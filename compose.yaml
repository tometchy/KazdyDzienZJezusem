services:
  kazdy-dzien:
    image: localhost/kazdydzienzjezusem_kazdy-dzien:latest
    build:
      context: .
      dockerfile: KazdyDzienZJezusem/Dockerfile
      no_cache: true
      secrets:
        - github_read_token
    restart: on-failure
    ports:
      - "8081:8080"
    environment:
      Tags__RedisConnection: redis:6379
      TagEditing__RepositoryPath: /repository
      TagEditing__Repository: tometchy/KazdyDzienZJezusem
      TagEditing__Branch: master
      TagEditing__ReadTokenFile: /run/secrets/github_read_token
      EditorSessions__KeyPath: /keys
      GreekInterlinear__Endpoint: ${KDJ_GREEK_ENDPOINT:-http://host.containers.internal:11434/api/chat}
      GreekInterlinear__Model: ${KDJ_GREEK_MODEL:-}
    volumes:
      # Podman aligns existing key ownership with the image's non-root app user.
      - editor-keys:/keys:U
    secrets:
      - github_read_token
    depends_on:
      - redis

  redis:
    image: docker.io/library/redis:8-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data

  cloudflared:
    image: docker.io/cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}

volumes:
  editor-keys:
  redis-data:

secrets:
  github_read_token:
    file: ${KDJ_GITHUB_READ_TOKEN_FILE:?Set KDJ_GITHUB_READ_TOKEN_FILE to the readonly GitHub token file}
