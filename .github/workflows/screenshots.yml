name: Screenshots

on:
  # Manual only. Restore pull_request here to enable automatic checks again.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshots:
    name: Screenshot regression
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ProductionVisualTests/package-lock.json
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/cache@v4
        with:
          path: |
            artifacts/visual-tools/redis-8.2.2
            artifacts/visual-tools/liberation-fonts-ttf-2.1.5
            artifacts/playwright
          key: visual-tools-ubuntu-24.04-redis-8.2.2-${{ hashFiles('ProductionVisualTests/package-lock.json', 'scripts/setup-visual-tests.sh') }}
      - name: Prepare .NET, Redis and Chromium
        run: bash scripts/setup-visual-tests.sh --with-deps
      - name: Build and test
        run: |
          dotnet build KazdyDzienZJezusem.slnx -c Release --no-restore
          dotnet test --project KazdyDzienZJezusem.Tests/KazdyDzienZJezusem.Tests.csproj -c Release --no-build --no-restore
          python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Compare screenshots
        run: bash scripts/test-screenshots.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshot-report
          path: |
            screenshots/results/
            screenshots/report/
          if-no-files-found: ignore
          retention-days: 14
