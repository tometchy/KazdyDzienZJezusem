"Tral6,1": "Παρακαλῶ οὖν ὑμᾶς, οὐκ ἐγώ, ἀλλ’ ἡ ἀγάπη Ἰησοῦ Χριστοῦ: μόνῃ τῇ χριστιανῇ τροφῇ χρῆσθε, ἀλλοτρίας δὲ βοτάνης ἀπέχεσθε, ἥτις ἐστὶν αἵρεσις:"
"Tral6,2": "οἳ ἑαυτοῖς παρεμπλέκουσιν Ἰησοῦν Χριστὸν καταξιοπιστευόμενοι, ὥσπερ θανάσιμον φάρμακον διδόντες μετὰ οἰνομέλιτος, ὅπερ ὁ ἀγνοῶν ἡδέως λαμβάνει ἐν ἡδονῇ κακῇ τὸ ἀποθανεῖν."
