"Tral12,1": "Ἀσπάζομαι ὑμᾶς ἀπὸ Σμύρνης ἅμα ταῖς συμπαρούσαις μοι ἐκκλησίαις τοῦ θεοῦ, οἲ κατὰ πάντα με ἀνέπαυσαν σαρκί τε καὶ πνεύματι."
"Tral12,2": "παρακαλεῖ ὑμᾶς τὰ δεσμά μου, ἃ ἕνεκεν Ἰησοῦ Χριστοῦ περιφέρω, αἰτούμενος θεοῦ ἐπιτυχεῖν: διαμένετε ἐν τῇ ὁμονοίᾳ ὑμῶν καὶ τῇ μετ’ ἀλλήλων προσευχῇ. πρέπει γὰρ ὑμῖν τοῖς καθ̓ ἕνα, ἐξαιρέτως καὶ τοῖς πρεσβυτέροις, ἀναψύχειν τὸν ἐπίσκοπον εἰς τιμὴν πατρός, Ἰησοῦ Χριστοῦ καὶ τῶν ἀποστόλων."
"Tral12,3": "εὔχομαι ὑμᾶς ἐν ἀγάπῃ ἀκοῦσαί μου, ἵνα μὴ εἶς μαρτύριον ὦ ἐν ὑμῖν γράψας. καὶ περὶ ἐμοῦ δὲ προσεύχεσθε, τῆς ἀφ̓ ὑμῶν ἀγάπης χρῄζοντος ἐν τῷ ἐλέει τοῦ θεοῦ, εἰς τὸ καταξιωθῆναί με τοῦ κλήρου, οὖ περίκειμαι ἐπιτυχεῖν, ἵνα μὴ ἀδόκιμος εὑρεθῶ,"
