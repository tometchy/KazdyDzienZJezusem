"Tral7,1": "Φυλάττεσθε οὖν τοὺς τοιούτους. τοῦτο δὲ ἔσται ὑμῖν μὴ φυσιουμένοις καὶ οὖσιν ἀχωρίστοις θεοῦ Ἰησοῦ Χριστοῦ καὶ τοῦ ἐπισκόπου καὶ τῶν διαταγμάτων τῶν ἀποστόλων."
"Tral7,2": "ὁ ἐντὸς θυσιαστηρίου ὢν καθαρός ἐστιν: ὁ δὲ ἐκτὸς θυσιαστηρίου ὤν οὐ καθαρός ἐστιν. τοῦτ̓ ἔστιν, ὁ χωρὶς ἐπισκόπου καὶ πρεσβυτερίου καὶ διακόνων πράσσων τι, οὗτος οὐ καθαρός ἐστιν τῇ συνειδήσει."
