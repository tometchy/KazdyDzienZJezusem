"Tral1,1": "Ἄμωμον διάνοιαν καὶ ἀδιάκριτον ἐν ὑπομονῇ ἔγνων ὑμᾶς ἔχοντας, οὐ κατὰ χρῆσιν ἀλλὰ κατὰ φύσιν, καθὼς ἐδήλωσέν μοι Πολύβιος, ὁ ἐπίσκοπος ὑμῶν, ὃς παρεγένετο θελήματι θεοῦ καὶ Ἰησοῦ Χριστοῦ ἐν Σμύρνῃ καὶ οὕτως μοι συνεχάρη δεδεμένῳ ἐν Χριστῷ Ἰησοῦ, ὥστε με τὸ πᾶν πλῆθος ὑμῶν ἐν αὐτῷ θεωρεῖσθαι."
"Tral1,2": "ἀποδεξάμενος οὖν τὴν κατὰ θεὸν εὔνοιαν δἰ αὐτοῦ ἐδόξασα, εὑρὼν ὑμᾶς, ὡς ἔγνων, μιμητὰς ὄντας θεοῦ."
