"Tral2,1": "Ὅταν γὰρ τῷ ἐπισκόπῳ ὑποτάσσησθε ὡς Ἱησοῦ Χριστῷ, φαίνεσθέ μοι οὐ κατὰ ἄνθρωπον ζῶντες, ἀλλὰ κατὰ Ἰησοῦν Χριστὸν τὸν δἰ ἡμᾶς ἀποθανόντα, ἵνα πιστεύσαντες εἰς τὸν θάνατον αὐτοῦ τὸ ἀποθανεῖν ἐκφύγητε."
"Tral2,2": "ἀναγκαῖον οὖν ἐστίν, ὥσπερ ποιεῖτε, ἄνευ τοῦ ἐπισκόπου μηδὲν πράσσειν ὑμᾶς, ἀλλ’ ὑποτάσσεσθαι καὶ τῷ πρεσβυτερίῳ ὡς τοῖς ἀποστόλοις Ἰησοῦ Χριστοῦ τῆς ἐλπίδος ἡμῶν, ἐν ᾦ διάγοντες εὑρεθησόμεθα."
"Tral2,3": "δεῖ δὲ καὶ τοὺς διακόνους ὄντας μυστηρίων Ἰησοῦ Χριστοῦ κατὰ πάντα τρόπον πᾶσιν ἀρέσκειν. οὐ γὰρ βρωμάτων καὶ ποτῶν εἰσιν διάκονοι, ἀλλ’ ἐκκλησίας θεοῦ ὑπηρέται: δέον οὖν αὐτοὺς φυλάσσεσθαι τὰ ἐγκλήματα ὡς πῦρ."
