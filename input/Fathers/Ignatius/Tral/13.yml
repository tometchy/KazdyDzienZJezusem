"Tral13,1": "Ἀσπάζεται ὑμᾶς ἡ ἀγάπη Σμυρναίων καὶ Ἐφεσίων. μνημονεύετε ἐν ταῖς προσευχαῖς ὑμῶν τῆς ἐν Συρίᾳ ἐκκλησίας, ὅθεν καὶ οὐκ ἄξιός εἰμι λέγεσθαι, ὢν ἔσχατος ἐκείνων."
"Tral13,2": "ἔρρωσθε ἐν Ἰησοῦ Χριστῷ, ὑποτασσόμενοι τῷ ἐπισκόπῳ ὡς τῇ ἐντολῇ, ὁμοίως καὶ τῷ πρεσβυτερίῳ. καὶ οἱ κατ’ ἄνδρα ἀλλήλους ἀγαπᾶτε ἐν ἀμερίστῳ καρδίᾳ."
"Tral13,3": "ἁγνίζεται ὑμῶν τὸ ἐμὸν πνεῦμα οὐ μόνον νῦν, ἀλλὰ καὶ ὅταν θεοῦ ἐπιτύχω. ἔτι γὰρ ὑπὸ κίνδυνόν εἰμι: ἀλλὰ πιστὸς ὁ πατὴρ ἐν Ἰησοῦ Χριστῷ πληρῶσαί μου τὴν αἴτησιν καὶ ὑμῶν, ἐν ᾧ εὑρεθείητε ἄμωμοι."
