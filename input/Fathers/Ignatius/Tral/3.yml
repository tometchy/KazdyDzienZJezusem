"Tral3,1": "Ὁμοίως πάντες ἐντρεπέσθωσαν τοὺς διακόνους ὡς Ἰησοῦν Χριστόν, ὡς καὶ τὸν ἐπίσκοπον ὄντα τύπον τοῦ πατρός. τοὺς δὲ πρεσβυτέρους ὡς συνέδριον θεοῦ καὶ ὡς σύνδεσμον ἀποστόλων. χωρὶς τούτων ἐκκλησία οὐ καλεῖται."
"Tral3,2": "περὶ ὧν πέπεισμαι ὑμᾶς οὕτως ἔχειν. τὸ γὰρ ἐξεμπλάριον τῆς ἀγάπης ὑμῶν ἔλαβον καὶ ἔχω μεθ̓ ἑαυτοῦ ἐν τῷ ἐπισκόπῳ ὑμῶν, οὖ αὐτὸ τὸ κατάστημα μεγάλη μαθητεία, ἡ δὲ πραότης αὐτοῦ δύναμις: ὃν λογίζομαι καὶ τοὺς ἀθέους ἐντρέπεσθαι."
"Tral3,3": "ἀγαπῶν ὑμᾶς φείδομαι, συντονώτερον δυνάμενος γράφειν ὑπὲρ τούτου. οὐκ εἰς τοῦτο ᾠήθην, ἵνα ὤν κατάκριτος ὡς ἀπόστολος ὑμῖν διατάσσωμαι."
