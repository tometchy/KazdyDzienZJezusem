"Tral5,1": "Μὴ οὐ δύναμαι ὑμῖν τὰ ἐπουράνια γράψαι; ἀλλὰ φοβοῦμαι, μὴ νηπίοις οὖσιν ὑμῖν βλάβην παραθῶ: καὶ συγγνωμονεῖτέ μοι, μήποτε οὐ δυνηθέντες χωρῆσαι στραγγαλωθῆτε."
"Tral5,2": "καὶ γὰρ ἐγώ, οὐ καθότι δέδεμαι καὶ δύναμαι νοεῖν τὰ ἐπουράνια καὶ τὰς τοποθεσίας τὰς ἀγγελικὰς καὶ τὰς συστάσεις τὰς ἀρχοντικάς, ὁρατά τε καὶ ἀόρατα, παρὰ τοῦτο ἤδη καὶ μαθητής εἰμι. πολλὰ γὰρ ἡμῖν λείπει, ἵνα θεοῦ μὴ λειπώμεθα."
