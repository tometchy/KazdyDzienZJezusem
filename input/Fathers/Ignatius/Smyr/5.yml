"Smyr5,1": "Ὅν τινες ἀγνοοῦντες ἀρνοῦνται, μᾶλλον δὲ ἠρνήθησαν ὑπ’ αὐτοῦ, ὄντες συνήγοροι τοῦ θανάτου μᾶλλον ἢ τῆς ἀληθείας: οὓς οὐκ ἔπεισαν αἱ προφητεῖαι οὐδὲ ὁ νόμος Μωύσεως, ἀλλ’ οὐδὲ μέχρι νῦν τὸ εὐαγγέλιον, οὐδὲ τὰ ἡμέτερα τῶν κατ’ ἄνδρα παθήματα."
"Smyr5,2": "καὶ γὰρ περὶ ἡμῶν τὸ αὐτὸ φρονοῦσιν. τί γάρ με ὠφελεῖ τις, εἰ ἐμὲ ἐπαινεῖ, τὸν δὲ κύριόν μου βλασφημεῖ, μὴ ὁμολογῶν αὐτὸν σαρκοφόρον; ὁ δὲ τοῦτο λέγων τελείως αὐτὸν ἀπήρνηται, ὢν νεκροφόρος."
"Smyr5,3": "τὰ δὲ ὀνόματα αὐτῶν, ὄντα ἄπιστα, οὐκ ἔδοξέν μοι ἐγγράψαι. ἀλλὰ μηδὲ γένοιτό μοι αὐτῶν μνημονεύειν, μέχρις οὗ μετανοήσωσιν εἰς τὸ πάθος, ὅ ἐστιν ἡμῶν ἀνάστασις."
