"Smyr13,1": "Ἀσπάζομαι τοὺς οἴκους τῶν ἀδελφῶν μου σὺν γυναιξὶ καὶ τέκνοις καὶ τὰς παρθένους τὰς λεγομένας χήρας. ἔρρωσθέ μοι ἐν δυνάμει πατρός. ἀσπάζεται ὑμᾶς Φίλων σὺν ἐμοὶ ὤν."
"Smyr13,2": "ἀσπάζομαι τὸν οἶκον Ταουΐας, ἣν εὔχομαι ἑδρᾶσθαι πίστει καὶ ἀγάπῃ σαρκικῇ τε καὶ πνευματικῇ. ἀσπάζομαι Ἄλκην, τὸ ποθητόν μοι ὄνομα, καὶ Δάφνον τὸν ἀσύγκριτον καὶ Εὔτεκνον καὶ πάντας κατ’ ὄνομα. ἔρρωσθε ἐν χάριτι θεοῦ."
