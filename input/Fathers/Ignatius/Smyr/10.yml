"Smyr10,1": "Φίλωνα καὶ Ῥέον Ἀγαθόπουν, οἳ ἐπηκολούθησάν μοι εἰς λόγον θεοῦ, καλῶς ἐποιήσατε ὑποδεξάμενοι ὡς διακόνους θεοῦ: οἳ καὶ εὐχαριστοῦσιν τῷ κυρίῳ ὑπὲρ ὑμῶν, ὅτι αὐτοὺς ἀνεπαύσατε κατὰ πάντα τρόπον. οὐδὲν ὑμῖν οὐ μὴ ἀπολεῖται."
"Smyr10,2": "ἀντίψυχον ὑμῶν τὸ πνεῦμά μου καὶ τὰ δεσμά μου, ἃ οὐχ ὑπερηφανήσατε οὐδὲ ἐπῃσχύνθητε. οὐδὲ ὑμᾶς ἐπαισχυνθήσεται ἡ τελεία ἐλπίς, Ἰησοῦς Χριστός."
