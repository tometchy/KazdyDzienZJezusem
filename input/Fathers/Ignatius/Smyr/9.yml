"Smyr9,1": "Εὔλογόν ἐστιν λοιπὸν ἀνανῆψαι ἡμᾶς, ὡς ἔτι καιρὸν ἔχομεν εἰς θεὸν μετανοεῖν. καλῶς ἔχει, θεὸν καὶ ἐπίσκοπον εἰδέναι. ὁ τιμῶν ἐπίσκοπον ὑπὸ θεοῦ τετίμηται: ὁ λάθρα ἐπισκόπου τι πράσσων τῷ διαβόλῳ λατρεύει."
"Smyr9,2": "πάντα οὖν ὑμῖν ἐν χάριτι περισσευέτω: ἄξιοι γάρ ἐστε. κατὰ πάντα με ἀνεπαύσατε, καὶ ὑμᾶς Ἰησοῦς Χριστός. ἀπόντα με καὶ πάροντα ἠγαπήσατε. ἀμοιβὴ ὑμῖν ὁ θεός, δἰ ὃν πάντα ὑπομένοντες αὐτοῦ τεύξεσθε."
