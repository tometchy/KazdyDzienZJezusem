"Smyr8,1": "Πάντες τῷ ἐπισκόπῳ ἀκολουθεῖτε, ὡς Ἰησοῦς Χριστὸς τῷ πατρί, καὶ τῷ πρεσβυτερίῳ ὡς τοῖς ἀποστόλοις. τοὺς δὲ διακόνους ἐντρέπεσθε ὡς θεοῦ ἐντολήν. μηδεὶς χωρὶς τοῦ ἐπισκόπου τι πρασσέτω τῶν ἀνηκόντων εἰς τὴν ἐκκλησίαν. ἐκείνη βεβαία εὐχαριστία ἡγείσθω, ἡ ὑπὸ ἐπίσκοπον οὖσα ἢ ᾧ ἄν αὐτὸς ἐπιτρέψῃ."
"Smyr8,2": "ὅπου ἂν φανῇ ὁ ἐπίσκοπος, ἐκεῖ τὸ πλῆθος ἤτω, ὥσπερ ὅπου ἂν ᾖ Ἰησοῦς Χριστός, ἐκεῖ ἡ καθολικὴ ἐκκλησία. οὐκ ἐξόν ἐστιν χωρὶς τοῦ ἐπισκόπου οὔτε βαπτίζειν οὔτε ἀγάπην ποιεῖν: ἀλλ’ ὃ ἂν ἐκεῖνος δοκιμάσῃ, τοῦτο καὶ τῷ θεῷ εὐάρεστον, ἵνα ἀσφαλὲς ᾖ καὶ βέβαιον πᾶν ὃ πράσσετε."
