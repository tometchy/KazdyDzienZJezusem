"Mag1,1": "Γνοὺς ὑμῶν τὸ πολυεύτακτον τῆς κατὰ θεὸν ἀγάπης, ἀγαλλιώμενος προειλόμην ἐν πίστει Ἰησοῦ Χριστοῦ προσλαλῆσαι ὑμῖν."
"Mag1,2": "καταξιωθεὶς γὰρ ὀνόματος θεοπρεπεστάτου, ἐν οἷς περιφέρω δεσμοῖς ᾅδω τὰς ἐκκλησίας, ἐν αἷς ἕνωσιν: εὔχομαι σαρκὸς καὶ πνεύματος Ἰησοῦ Χριστοῦ, τοῦ διὰ παντὸς ἡμῶν ζῆν, πίστεώς τε καὶ ἀγάπης, ἡς οὐδὲν προκέκριται, τὸ δὲ κυριώτερον Ἰησοῦ καὶ πατρός: ἐν ᾧ ὑπομένοντες τὴν πᾶσαν ἐπήρειαν τοῦ ἄρχοντος τοῦ αἰῶνος τούτου καὶ διαφυγόντες θεοῦ τευξόμεθα."
