"Mag10,1": "Μὴ οὖν ἀναισθητῶμεν τῆς χρηστότητος αὐτοῦ. ἐὰν γὰρ ἡμᾶς μιμήσηται καθὰ πράσσομεν, οὐκέτι ἐσμέν. διὰ τοῦτο, μαθηταὶ αὐτοῦ γενόμενοι, μάθωμεν κατὰ Χριστιανισμὸν ζῆν. ὃς γὰρ ἄλλῳ ὀνόματι καλεῖται πλέον τούτου, οὐκ ἔστιν τοῦ θεοῦ."
"Mag10,2": "ὑπέρθεσθε οὖν τὴν κακὴν ζύμην, τὴν παλαιωθεῖσαν καὶ ἐνοξίσασαν, καὶ μεταβάλεσθε εἰς νέαν ζύμην, ὅ ἐστιν Ἰησοῦς Χριστός. ἁλίσθητε ἐν αὐτῷ, ἵνα μὴ διαφθαρῇ τις ἐν ὑμῖν, ἐπεὶ ἀπὸ τῆς ὀσμῆς ἐλεγχθήσεσθε."
"Mag10,3": "ἄτοπόν ἐστιν, Ἰησοῦν Χριστὸν λαλεῖν καὶ ἰουδαΐζειν. ὁ γὰρ Χριστιανισμὸς οὐκ εἰς Ἰουδαῖσμὸν ἐπίστευσεν, ἀλλ’ Ἰουδαϊσμὸς εἰς Χριστιανισμόν, ᾧ πᾶσα γλῶσσα πιστεύσασα εἰς θεὸν συνήχθη."
