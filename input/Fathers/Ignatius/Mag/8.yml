"Mag8,1": "Μὴ πλανᾶσθε ταῖς ἑτεροδοξίαις μηδὲ μυθεύμασιν τοῖς παλαιοῖς ἀνωφελέσιν οὖσιν. εἰ γὰρ μέχρι νῦν κατὰ Ἰουδαῖσμὸν ζῶμεν, ὁμολογοῦμεν χάριν μὴ εἰληφέναι."
"Mag8,2": "οἱ γὰρ θειότατοι προφῆται κατὰ Χριστὸν Ἰησοῦν ἔζησαν. διὰ τοῦτο καὶ ἐδιώχθησαν, ἐνπνεόμενοι ὑπὸ τῆς χάριτος αὐτοῦ, εἰς τὸ πληροφορηθῆναι τοὺς ἀπειθοῦντας, ὅτι εἶς θεός ἐστιν, ὁ φανερώσας ἑαυτὸν διὰ Ἰησοῦ Χριστοῦ τοῦ υἱοῦ αὐτοῦ, ὅς ἐστιν αὐτοῦ λόγος ἁπὸ σιγῆς προελθών, ὃς κατὰ πάντα εὐηρέστησεν τῷ πέμψαντι αὐτόν."
