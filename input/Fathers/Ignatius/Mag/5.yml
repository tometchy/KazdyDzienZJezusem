"Mag5,1": "Ἐπεὶ οὖν τέλος τὰ πρώγματα ἔχει καὶ πρόκειται τὰ δύο ὁμοῦ, ὅ τε θάνατος καὶ ἡ ζωή, καὶ ἕκαστος εἰς τὸν ἴδιον τόπον μέλλει χωρεῖν:"
"Mag5,2": "ὥσπερ γάρ ἐστιν νομίσματα δύο, ὃ μὲν θεοῦ, ὃ δὲ κόσμου, καὶ ἕκαστον αὐτῶν ἴδιον χαρακτῆρα ἐπικείμενον ἔχει, οἱ ἄπιστοι τοῦ κόσμου τούτου, οἱ δὲ πιστοὶ ἐν ἀγάπῃ χαρακτῆρα θεοῦ πατρὸς διὰ Ἰησοῦ Χριστοῦ, δἰ οὗ ἐὰν μὴ αὐθαιρέτως ἔχωμεν τὸ ἀποθανεῖν εἰς τὸ αὐτοῦ πάθος, τὸ ζῆν αὐτοῦ οὐκ ἔστιν ἐν ἡμῖν."
