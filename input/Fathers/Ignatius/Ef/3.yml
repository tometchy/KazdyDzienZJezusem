"Ef3,1": "Οὐ διατάσσομαι ὑμῖν ὡς ὤν τις. εἰ γὰρ καὶ δέδεμαι ἐν τῷ ὀνόματι, οὔπω ἀπήρτισμαι ἐν Ἰησοῦ Χριστῷ: νῦν γὰρ ἀρχὴν ἔχω τοῦ μαθητεύεσθαι, καὶ προσλαλῶ ὑμῖν ὡς συνδιδασκαλίταις μου. ἐμὲ γὰρ ἔδει ὑφ̓ ὑμῶν ὑπαλειφθῆναι πίστει, νουθεσίᾳ, ὑπομονῇ, μακροθυμίᾳ."
"Ef3,2": "ἀλλ’ ἐπεὶ ἡ ἀγάπη οὐκ ἐᾷ με σιωπᾶν περὶ ὑμῶν, διὰ τοῦτο προέλαβον παρακαλεῖν ὑμᾶς, ὅπως συντρέχητε τῇ γνώμῃ τοῦ θεοῦ. καὶ γὰρ Ἰησοῦς Χριστός, τὸ ἀδιάκριτον ἡμῶν ζῆν, τοῦ πατρὸς ἡ γνώμη, ὡς καὶ οἱ ἐπίσκοποι, οἱ κατὰ τὰ πέρατα ὁρισθέντες, ἐν Ἰησοῦ Χριστοῦ γνώμῃ εἰσίν."
