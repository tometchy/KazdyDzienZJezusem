"Ef6,1": "Καὶ ὅσον βλέπει τις σιγῶντα ἐπίσκοπον, πλειόνως αὐτὸν φοβείσθω: πάντα γάρ, ὃν πέμπει ὁ οἰκοδεσπότης εἰς ἰδίαν οἰκονομίαν, οὕτως δεῖ ἡμᾶς αὐτὸν δέχεσθαι, ὡς αὐτὸν τὸν πέμψαντα, τὸν οὖν ἐπίσκοπον δῆλον ὅτι ὡς αὐτὸν κύριον δεῖ προσβλέπειν."
"Ef6,2": "αὐτὸς μὲν οὖν Ὀνήσιμος ὑπερεπαινεῖ ὑμῶν τὴν ἐν θεῷ εὐταξίαν, ὅτι πάντες κατὰ ἀλήθειαν ζῆτε καὶ ὅτι ἐν ὑμῖν οὐδεμία αἵρεσις κατοικεῖ: ἀλλ’ οὐδὲ ἀκούετέ τινος πλέον, ἢ περὶ Ἰησοῦ Χριστοῦ λαλοῦντος ἐν ἀληθείᾳ."
