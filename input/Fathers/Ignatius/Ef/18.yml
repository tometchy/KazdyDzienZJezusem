"Ef18,1": "Περίψημα τὸ ἐμὸν πνεῦμα τοῦ σταυροῦ, ὅ ἐστιν σκάνδαλον τοῖς ἀπιστοῦσιν, ἡμῖν δὲ σωτηρία καὶ ζωὴ αἰώνιος, ποῦ σοφός; ποῦ συζητητής; ποῦ καύχησις τῶν λεγομένων συνετῶν;"
"Ef18,2": "ὁ γὰρ θεὸς ἡμῶν Ἰησοῦς ὁ Χριστὸς ἐκυοφορήθη ὑπὸ Μαρίας κατ’ οἰκονομίαν θεοῦ ἐκ σπέρματος μὲν Δαυείδ, πνεύματος δὲ ἁγίου: ὃς ἐγεννήθη καὶ ἐβαπτίσθη, ἵνα τῷ πάθει τὸ ὕδωρ καθαρίσῃ."
