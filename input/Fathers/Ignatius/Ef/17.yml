"Ef17,1": "Διὰ τοῦτο μύρον ἔλαβεν ἐπὶ τῆς κεφαλῆς αὐτοῦ ὁ κύριος, ἵνα πνέῃ τῇ ἐκκλησίᾳ ἀφθαρσίαν, μὴ ἀλείφεσθε δυσωδίαν τῆς διδασκαλίας τοῦ ἄρχοντος τοῦ αἰῶνος τούτου, μὴ αἰχμαλωτίσῃ ὑμᾶς ἐκ τοῦ προκειμένου ζῆν."
"Ef17,2": "διὰ τί δὲ οὐ πάντες φρόνιμοι γινόμεθα λαβόντες θεοῦ γνῶσιν, ὅ ἐστιν Ἰησοῦς Χριστός; τί μωρῶς ἀπολλύμεθα, ἀγνοοῦντες τὸ χάρισμα, ὃ πέπομφεν ἀληθῶς ὁ κύριος;"
