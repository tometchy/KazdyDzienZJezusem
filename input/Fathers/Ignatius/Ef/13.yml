"Ef13,1": "Σπουδάζετε οὖν πυκνότερον συνέρχεσθαι εἰς εὐχαριστίαν θεοῦ καὶ εἰς δόξαν. ὅταν γὰρ πυκνῶς ἐπὶ τὸ αὐτὸ γίνεσθε, καθαιροῦνται αἱ δυνάμεις τοῦ Σατανᾶ, καὶ λύεται ὁ ὄλεθρος αὐτοῦ ἐν τῇ ὁμονοίᾳ ὑμῶν τῆς πίστεως."
"Ef13,2": "οὐδέν ἐστιν ἄμεινον εἰρήνης, ἐν ᾗ πᾶς πόλεμος καταργεῖται ἐπουρανίων καὶ ἐπιγείων."
