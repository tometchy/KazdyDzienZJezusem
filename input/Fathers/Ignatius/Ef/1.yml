"Ef1,1": "Ἀποδεξάμενος ἐν θεῷ τὸ πολυαγάπητόν σου ὀνομα, ὃ κέκτησθε φύσει δικαίᾳ κατὰ πίστιν καὶ ἀγάπην ἐν Χριστῷ Ἰησοῦ, τῷ σωτῆρι ἡμῶν: μιμηταὶ ὄντες θεοῦ, ἀναζωπυρήσαντες ἐν αἵματι θεοῦ τὸ συγγενικὸν ἔργον τελείως ἀπηρτίσατε:"
"Ef1,2": "ἀκούσαντες γὰρ δεδεμένον ἀπὸ Συρίας ὑπὲρ τοῦ κοινοῦ ὀνόματος καὶ ἐλπίδος, ἐλπίζοντα τῇ προσευχῇ ὑμῶν ἐπιτυχεῖν ἐν Ῥώμῃ θηριομαχῆσαι, ἵνα διὰ τοῦ ἐπιτυχεῖν δυνηθῶ μαθητὴς εἶναι, ἰδεῖν ἐσπουδάσατε:"
"Ef1,3": "ἐπεὶ οὖν τὴν πολυπλήθειαν ὑμῶν ἐν ὀνόματι θεοῦ ἀπείληφα ἐν Ὀνησίμῳ, τῷ ἐν ἀγάπῃ ἀδιηγήτῳ, ὑμῶν δὲ ἐπισκόπῳ, ὄν εὔχομαι κατὰ Ἰησοῦν Χριστὸν ὑμᾶς ἀγαπᾶν καὶ πάντας ὑμᾶς αὐτῷ ἐν ὁμοιότητι εἶναι. εὐλογητὸς γὰρ ὁ χαρισάμενος ὑμῖν ἀξίοις οὖσι τοιοῦτον ἐπίσκοπον κεκτῆσθαι."
