"Ef0,1": "Ἰγνάτιος, ὁ καὶ Θεοφόρος, τῇ εὐλογημένῃ ἐν μεγέθει θεοῦ πατρὸς πληρώματι, τῇ προωρισμένῃ πρὸ αἰώνων εἶναι διὰ παντὸς εἰς δόξαν παράμονον ἄτρεπτον, ἡνωμένῃ καὶ ἐκλελεγμένῃ ἐν πάθει ἀληθινῷ, ἐν θελήματι τοῦ πατρὸς καὶ Ἰησοῦ Χριστοῦ τοῦ θεοῦ ἡμῶν, τῇ ἐκκλησίᾳ τῇ ἀξιομακαρίστῳ, τῇ οὔσῃ ἐν Ἐφέσῳ τῆς Ἀσίας, πλεῖστα ἐν Ἰησοῦ Χριστῷ καὶ ἐν ἀμώμῳ χαρᾷ χαίρειν."
