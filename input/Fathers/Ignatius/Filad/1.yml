"Filad1,1": "Ὃν ἐπίσκοπον ἔγνων οὐκ ἀφ̓ ἑαυτοῦ οὐδὲ δἰ ἀνθρώπων κεκτῆσθαι τὴν διακονίαν τὴν εἰς τὸ κοινὸν ἀνήκουσαν οὐδὲ κατὰ κενοδοξίαν, ἀλλ’ ἐν ἀγάπῃ θεοῦ πατρὸς καὶ κυρίου Ἰησοῦ Χριστοῦ: οὗ καταπέπληγμαι τὴν ἐπιείκειαν, ὃς σιγῶν πλείονα δύναται τῶν μάταια λαλούντων."
"Filad1,2": "συνευρύθμισται γαρ ταῖς ἐντολαῖς ὡς χορδαῖς κιθάρα. διὸ μακαρίζει μου ἡ ψυχὴ τὴν εἰς θεὸν αὐτοῦ γνώμην, ἐπιγνοὺς ἐνάρετον καὶ τέλειον οὖσαν, τὸ ἀκίνητον αὐτοῦ καὶ τὸ ἀόργητον αὐτοῦ ἐν πάσῃ ἐπιεικείᾳ θεοῦ ζῶντος."
