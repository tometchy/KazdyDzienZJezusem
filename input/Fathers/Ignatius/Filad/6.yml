"Filad6,1": "Ἐὰν δέ τις ἰουδαϊσμὸν ἑρμηνεύῃ ὑμῖν, μὴ ἀκούετε αὐτοῦ. ἄμεινον γάρ ἐστιν παρὰ ἀνδρὸς περιτομὴν ἔχοντος χριστιανισμὸν ἀκούειν, ἢ παρὰ ἀκροβύστου ἰουδαῖσμόν. ἐὰν δὲ ἀμφότεροι περὶ Ἰησοῦ Χριστοῦ μὴ λαλῶσιν, οὗτοι ἐμοὶ στῆλαί εἰσιν καὶ τάφοι νεκρῶν, ἐφ̓ οἷς γέγραπται μόνον ὀνόματα ἀνθρώπων."
"Filad6,2": "φεύγετε οὖν τὰς κακοτεχνίας καὶ ἐνέδρας τοῦ ἄρχοντος τοῦ αἰῶνος τούτου, μήποτε θλιβέντες τῇ γνώμῃ αὐτοῦ ἐξασθενήσετε ἐν τῇ ἀγάπῃ: ἀλλὰ πάντες ἐπὶ τὸ αὐτὸ γίνεσθε ἐν ἀμερίστῳ καρδίᾳ."
"Filad6,3": "εὐχαριστῶ δὲ τῷ θεῷ μου, ὅτι εὐσυνείδητός εἰμι ἐν ὑμῖν καὶ οὐκ ἔχει τις καυχήσασθαι οὔτε λάθρα οὔτε φανερῶς, ὅτι ἐβάρησά τινα ἐν μικρῷ ἢ ἐν μεγάλῳ. καὶ πᾶσι δέ, ἐν οἷς ἐλάλησα, εὔχομαι, ἵνα μὴ εἰς μαρτύριον αὐτὸ κτήσωνται."
