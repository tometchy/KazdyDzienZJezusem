"Filad3,1": "Ἀπέχεσθε τῶν κακῶν βοτανῶν, ἅστινας οὐ γεωργεῖ Ἰησοῦς Χριστός, διὰ τὸ μὴ εἶναι αὐτοὺς φυτείαν πατρός: οὐχ ὅτι παῤ ὑμῖν μερισμὸν εὗρον, ἀλλ’ ὰποδιῡλισμόν."
"Filad3,2": "ὅσοι γὰρ θεοῦ εἰσιν καὶ Ἰησοῦ Χριστοῦ, οὗτοι μετὰ τοῦ ἐπισκόπου εἰσίν. καὶ ὅσοι ἂν μετανοήσαντες ἔλθωσιν ἐπὶ τὴν ἑνότητα τῆς ἐκκλησίας, καὶ οὗτοι θεοῦ ἔσονται, ἵνα ὦσιν κατὰ Ἰησοῦν Χριστὸν ζῶντες."
"Filad3,3": "μὴ πλανᾶσθε, ἀδελφοί μου: εἴ τις σχίζοντι ἀκολουθεῖ. βασιλείαν θεοῦ οὐ κληρονομεῖ: εἴ τις ἐν ἀλλοτρίᾳ γνώμῃ περιπατεῖ, οὗτος τῷ πάθει οὐ συγκατατίθεται."
