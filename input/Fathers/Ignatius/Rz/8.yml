"Rz8,1": "Οὐκέτι θέλω κατὰ ἀνθρώπους ζῆν. τοῦτο δὲ ἔσται, ἐὰν ὑμεῖς θελήσητε. θελήσατε, ἵνα καὶ ὑμεῖς θεληθῆτε."
"Rz8,2": "δἰ ὀλίγων γραμμάτων αἰτοῦμαι ὑμᾶς: πιστεύσατέ μοι. Ἰησοῦς δὲ Χριστὸς ὑμῖν ταῦτα φανερώσει, ὅτι ἀληθῶς λέγω: τὸ ἀψευδὲς στόμα, ἐν ᾧ ὁ πατὴρ ἐλάλησεν ἀληθῶς."
"Rz8,3": "αἰτήσασθε περὶ ἐμοῦ, ἵνα ἐπιτύχω. οὐ κατὰ σάρκα ὑμῖν ἔγραψα, ἀλλὰ κατὰ γνώμην θεοῦ. ἐὰν πάθω, ἠθελήσατε: ἐὰν ἀποδοκιμασθῶ, ἐμισήσατε."
