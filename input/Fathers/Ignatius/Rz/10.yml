"Rz10,1": "Γράφω δὲ ὑμῖν ταῦτα ἀπὸ Σμύρνης δἰ Ἐφεσίων τῶν ἀξιομακαρίστων. ἔστιν δὲ καὶ ἅμα ἐμοὶ σὺν ἄλλοις πολλοῖς καὶ Κρόκος, τὸ ποθητόν μοι ὄνομα."
"Rz10,2": "περὶ τῶν προελθόντων με ἀπὸ Συρίας εἰς Ῥώμην εἰς δόξαν τοῦ θεοῦ πιστεύω ὑμᾶς ἐπεγνωκέναι, οἷς καὶ δηλώσατε ἐγγύς με ὄντα. πάντες γάρ εἰσιν ἄξιοι τοῦ θεοῦ καὶ ὑμῶν: οὕς πρέπον ὑμῖν ἐστὶν κατὰ πάντα ἀναπαῦσαι."
"Rz10,3": "ἔγραψα δὲ ὑμῖν ταῦτα τῇ πρὸ ἐννέα καλανδῶν Σεπτεμβρίων. ἔρρωσθε εἰς τέλος ἐν ὑπομονῇ Ἰησοῦ Χριστοῦ."
