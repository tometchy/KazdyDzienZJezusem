"Rz7,1": "Ὁ ἄρχων τοῦ αἰῶνος τούτου διαρπάσαι με βούλεται καὶ τὴν εἰς θεόν μου γνώμην διαφθεῖραι. μηδεὶς οὖν τῶν παρόντων ὑμῶν βοηθείτω αὐτῷ: μᾶλλον ἐμοῦ γίνεσθε, τουτέστιν τοῦ θεοῦ. μὴ λαλεῖτε Ἰησοῦν Χριστόν, κόσμον δὲ ἐπιθυμεῖτε."
"Rz7,2": "βασκανία ἐν ὑμῖν μὴ κατοικείτω. μηδ’ ἂν ἐγὼ παρὼν παρακαλῶ ὑμᾶς, πείσθητέ μοι: τούτοις δὲ μᾶλλον πείσθητε, οἷς γράφω ὑμῖν. ζῶν γὰρ γράφω ὑμῖν, ἐρῶν τοῦ ἀποθανεῖν. ὁ ἐμὸς ἔρως ἐσταύρωται, καὶ οὐκ ἔστιν ἐν ἐμοὶ πῦρ φιλόυλον: ὕδωρ δὲ ζῶν καὶ λαλοῦν ἐν ἐμοί, ἔσωθέν μοι λέγον: Δεῦρο πρὸς τὸν πατέρα."
"Rz7,3": "οὐχ ἥδομαι τροφῇ φθορᾶς οὐδὲ ἡδοναῖς τοῦ βίου τούτου. ἄρτον θεοῦ θέλω, ὅ ἐστιν σὰρξ Ἰησοῦ Χριστοῦ, τοῦ ἐκ σπέρματος Δαυείδ, καὶ πόμα θέλω τὸ αἷμα αὐτοῦ, ὅ ἐστιν ἀγάπη ἄφθαρτος."
