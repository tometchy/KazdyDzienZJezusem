"Pol4,1": "Χῆραι μὴ ἀμελείσθωσαν: μετὰ τὸν κύριον σὺ αὐτῶν φροντιστὴς ἔσο. μηδὲν ἄνευ γνώμης σου γινέσθω μηδὲ σὺ ἄνευ θεοῦ τι πρᾶσσε, ὅπερ οὐδὲ πράσσεις: εὐστάθει."
"Pol4,2": "πυκνότερον συναγωγαὶ γινέσθωσαν: ἐξ ὀνόματος πάντας ζήτει."
"Pol4,3": "δούλους καὶ δούλας μὴ ὑπερηφάνει: ἀλλὰ μηδὲ αὐτοὶ φυσιούσθωσαν, ἀλλ’ εἰς δόξαν θεοῦ πλέον δουλευέτωσαν, ἵνα κρείττονος ἐλευθερίας ἀπὸ θεοῦ τύχωσιν. μὴ ἐράτωσαν ἀπὸ τοῦ κοινοῦ ἐλευθεροῦσθαι, ἵνα μὴ δοῦλοι εὑρεθῶσιν ἐπιθυμίας."
