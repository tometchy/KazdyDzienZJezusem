"Ml3,1":
  text: "Oto posyłam mojego posłańca, który oczyści drogę przed moim obliczem. I nagle przyjdzie do swojej świątyni PAN, którego wy szukacie, Posłaniec przymierza, którego wy pożądacie. Oto przyjdzie – mówi JHWH Zastępów."
  tags: []
"Ml3,2":
  text: "Lecz kto przetrwa dzień Jego przyjścia? I kto się ostanie, gdy się ukaże? Bo On jest jak ogień wypławiacza i jak mydło foluszników."
  tags: []
"Ml3,3":
  text: "I zasiądzie jako ten, kto wypławia i oczyszcza srebro; i oczyści synów Lewiego, przesączy ich jak złoto i jak srebro, i będą przynosić JHWH ofiarę w sprawiedliwości."
  tags: []
"Ml3,4":
  text: "I będzie miła JHWH ofiara Judy i Jerozolimy, jak za dawnych dni i jak za lat starożytnych."
  tags: []
"Ml3,5":
  text: "I zbliżę się do was na sąd, i będę stanowczym świadkiem przeciwko uprawiającym magię i cudzołożnikom, i przysięgającym fałszywie, uciskającym pracownika najemnego, wdowy i sieroty, i krzywdzącym cudzoziemca, a nie bojących się mnie – mówi JHWH Zastępów."
  tags: []
"Ml3,6":
  text: "Gdyż ja, JHWH, nie zmieniam się, dlatego wy, synowie Jakuba, nie zostaliście zniszczeni."
  tags: []
"Ml3,7":
  text: "Od dni waszych ojców odstępowaliście od moich ustaw i nie przestrzegaliście ich. Zawróćcie do mnie, a ja zawrócę do was – mówi JHWH Zastępów. Ale wy mówicie: W czym mamy zawracać?"
  tags: []
"Ml3,8":
  text: "Czy człowiek może okraść Boga? Bo wy mnie okradacie. Lecz mówicie: Z czego Cię okradamy? Z dziesięcin i danin."
  tags: []
"Ml3,9":
  text: "Jesteście obłożeni klątwą, bo wy mnie okradacie – wy, cały naród."
  tags: []
"Ml3,10":
  text: "Przynieście całą dziesięcinę do spichlerza, aby żywność była w moim domu, a doświadczcie mnie teraz w tym – mówi JHWH Zastępów, czy wam nie otworzę okien niebios i nie wyleję na was błogosławieństwa nad miarę."
  tags: []
"Ml3,11":
  text: "I zgromię ze względu na was pożerającego, i nie będzie wam niszczył plonu ziemi i winorośl nie będzie pozbawiona owocu na polu – mówi JHWH Zastępów."
  tags: []
"Ml3,12":
  text: "I wszystkie narody będą was nazywać szczęśliwymi, bo będziecie ziemią rozkoszną – mówi JHWH Zastępów."
  tags: []
"Ml3,13":
  text: "Mocne są wasze słowa przeciwko mnie – mówi JHWH. I mówicie: Co zostało przez nas powiedziane przeciwko Tobie?"
  tags: []
"Ml3,14":
  text: "Mówiliście: Na próżno służyć Bogu. Co za pożytek z tego, że przestrzegaliśmy Jego poleceń i chodziliśmy smutni przed obliczem JHWH Zastępów?"
  tags: []
"Ml3,15":
  text: "A teraz my uważamy pysznych za szczęśliwych, gdyż ci zostają wzmocnieni, którzy czynią niegodziwość, także tym, którzy wystawiają Boga na próbę, udaje się uciec od kary."
  tags: []
"Ml3,16":
  text: "Wtedy rozmawiali o tym między sobą bojący się JHWH, każdy ze swoim bliźnim. JHWH zwrócił na to uwagę i usłyszał; i napisano zwój wspomnień przed Jego obliczem dla bojących się JHWH i ceniących Jego imię."
  tags: []
"Ml3,17":
  text: "I będą oni dla mnie – mówi JHWH Zastępów, w dniu, w którym ja uczynię ich moją własnością. Zlituję się nad nimi, tak jak lituje się człowiek nad swoim synem, który mu służy."
  tags: []
"Ml3,18":
  text: "I zawrócicie, i zobaczycie różnicę między sprawiedliwym i bezbożnym, między tym, który służy Bogu, i tym, który Mu nie służy."
  tags: []
