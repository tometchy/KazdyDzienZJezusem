"Ml1,1": "Brzemię słowa JHWH do Izraela za pośrednictwem Malachiasza."
"Ml1,2": "Umiłowałem was, mówi JHWH, a wy mówicie: W czym nas umiłowałeś? Czy Ezaw nie był bratem Jakuba? – oświadczenie JHWH – a jednak umiłowałem Jakuba;"
"Ml1,3": "A Ezawa znienawidziłem i wystawiłem jego góry na spustoszenie, a jego dziedzictwo szakalom na pustkowiu."
"Ml1,4": "Choćby Edom powiedział: Jesteśmy powaleni, lecz powrócimy i odbudujemy ruiny, to tak mówi JHWH Zastępów: Oni będą budować, a ja zburzę; i nazwą ich obszarem niegodziwości oraz ludem, który JHWH przeklął aż na wieki."
"Ml1,5": "I wasze oczy to zobaczą, i powiecie: JHWH jest wielki nawet poza granicą Izraela."
"Ml1,6": "Syn czci ojca, a sługa swego pana. A jeśli ja jestem Ojcem, gdzie jest moja cześć? A jeśli ja jestem PANEM, to gdzie lęk przede mną? – mówi JHWH Zastępów do was, kapłani, gardzący moim imieniem. Lecz wy mówicie: Przez co gardzimy Twoim imieniem?"
"Ml1,7": "Przynosicie do mojego ołtarza pokarm nieczysty i mówicie: Przez co czynimy Ciebie nieczystym? Przez wasze mówienie: Stół JHWH – on jest godny pogardy."
"Ml1,8": "A gdy przyprowadzacie na ofiarę to, co jest ślepe – nie ma w tym nic złego? I gdy przyprowadzacie kulawe i chore – nie ma w tym nic złego? Podejdź – proszę – z tym do swego namiestnika. Czy przyjmie lub podniesie twoje oblicze? – mówi JHWH Zastępów."
"Ml1,9": "A teraz, proszę, przebłagajcie oblicze Boga, aby okazał łaskę nad nami. To się stało z waszych rąk, czy więc podniesie On oblicze z powodu was? – mówi JHWH Zastępów."
"Ml1,10": "Kto także spośród was zamknie bramy, aby nie zapalać ognia na moim ołtarzu daremnie? Nie mam w was upodobania – mówi JHWH Zastępów, i nie przyjmę ofiary z waszej ręki."
"Ml1,11": "Bo od wschodu słońca i aż po jego zachód moje imię jest wielkie wśród narodów; na każdym miejscu ma być składane mojemu imieniu kadzidło i ofiara czysta. Bo moje imię jest wielkie wśród narodów – mówi JHWH Zastępów."
"Ml1,12": "Lecz wy bezcześcicie je, gdy mówicie: Stół JHWH – on jest nieczysty, a owoc i pokarm na nim składany – godny pogardy."
"Ml1,13": "Mówicie też: Czyż to nie mozół!? I prychacie na to – mówi JHWH Zastępów. I przyprowadzacie zrabowane, i to, co kulawe i to, co chore – takie ofiary przyprowadzacie. Czy mam to przyjąć z waszej ręki? – mówi JHWH."
"Ml1,14": "Przeklęty oszust, który ma w swoim stadzie samca i ślubuje, a ofiarowuje PANU ułomne. Bo ja jestem wielkim Królem – mówi JHWH Zastępów, a moje imię jest przejmujące lękiem między narodami."
