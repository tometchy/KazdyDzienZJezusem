"Ml1,1":
  text: "Brzemię słowa JHWH do Izraela za pośrednictwem Malachiasza."
  tags: []
"Ml1,2":
  text: "Umiłowałem was, mówi JHWH, a wy mówicie: W czym nas umiłowałeś? Czy Ezaw nie był bratem Jakuba? – oświadczenie JHWH – a jednak umiłowałem Jakuba;"
  tags: []
"Ml1,3":
  text: "A Ezawa znienawidziłem i wystawiłem jego góry na spustoszenie, a jego dziedzictwo szakalom na pustkowiu."
  tags: []
"Ml1,4":
  text: "Choćby Edom powiedział: Jesteśmy powaleni, lecz powrócimy i odbudujemy ruiny, to tak mówi JHWH Zastępów: Oni będą budować, a ja zburzę; i nazwą ich obszarem niegodziwości oraz ludem, który JHWH przeklął aż na wieki."
  tags: []
"Ml1,5":
  text: "I wasze oczy to zobaczą, i powiecie: JHWH jest wielki nawet poza granicą Izraela."
  tags: []
"Ml1,6":
  text: "Syn czci ojca, a sługa swego pana. A jeśli ja jestem Ojcem, gdzie jest moja cześć? A jeśli ja jestem PANEM, to gdzie lęk przede mną? – mówi JHWH Zastępów do was, kapłani, gardzący moim imieniem. Lecz wy mówicie: Przez co gardzimy Twoim imieniem?"
  tags: []
"Ml1,7":
  text: "Przynosicie do mojego ołtarza pokarm nieczysty i mówicie: Przez co czynimy Ciebie nieczystym? Przez wasze mówienie: Stół JHWH – on jest godny pogardy."
  tags: []
"Ml1,8":
  text: "A gdy przyprowadzacie na ofiarę to, co jest ślepe – nie ma w tym nic złego? I gdy przyprowadzacie kulawe i chore – nie ma w tym nic złego? Podejdź – proszę – z tym do swego namiestnika. Czy przyjmie lub podniesie twoje oblicze? – mówi JHWH Zastępów."
  tags: []
"Ml1,9":
  text: "A teraz, proszę, przebłagajcie oblicze Boga, aby okazał łaskę nad nami. To się stało z waszych rąk, czy więc podniesie On oblicze z powodu was? – mówi JHWH Zastępów."
  tags: []
"Ml1,10":
  text: "Kto także spośród was zamknie bramy, aby nie zapalać ognia na moim ołtarzu daremnie? Nie mam w was upodobania – mówi JHWH Zastępów, i nie przyjmę ofiary z waszej ręki."
  tags: []
"Ml1,11":
  text: "Bo od wschodu słońca i aż po jego zachód moje imię jest wielkie wśród narodów; na każdym miejscu ma być składane mojemu imieniu kadzidło i ofiara czysta. Bo moje imię jest wielkie wśród narodów – mówi JHWH Zastępów."
  tags: []
"Ml1,12":
  text: "Lecz wy bezcześcicie je, gdy mówicie: Stół JHWH – on jest nieczysty, a owoc i pokarm na nim składany – godny pogardy."
  tags: []
"Ml1,13":
  text: "Mówicie też: Czyż to nie mozół!? I prychacie na to – mówi JHWH Zastępów. I przyprowadzacie zrabowane, i to, co kulawe i to, co chore – takie ofiary przyprowadzacie. Czy mam to przyjąć z waszej ręki? – mówi JHWH."
  tags: []
"Ml1,14":
  text: "Przeklęty oszust, który ma w swoim stadzie samca i ślubuje, a ofiarowuje PANU ułomne. Bo ja jestem wielkim Królem – mówi JHWH Zastępów, a moje imię jest przejmujące lękiem między narodami."
  tags: []
