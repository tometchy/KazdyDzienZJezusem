"Ml4,1": "Oto bowiem nadchodzi dzień, który spala jak piec, a wszyscy pyszni i wszyscy czyniący niegodziwie będą jak plewa. I spali ich ten nadchodzący dzień – mówi JHWH Zastępów, tak że nie pozostawi dla nich korzenia i gałązki."
"Ml4,2": "I wzejdzie dla was, którzy się boicie mojego imienia, słońce sprawiedliwości i uzdrowienie na jego skrzydłach; i wyjdziecie, i będziecie skakać jak cielęta przez przegrodę."
"Ml4,3": "I podepczecie bezbożnych, gdyż będą jak pył pod stopami waszych nóg w dniu, który ja uczynię – mówi JHWH Zastępów"
"Ml4,4": "Pamiętajcie o Prawie Mojżesza, mojego sługi, które mu nadałem na Horebie dla całego Izraela, o ustawach i sądach."
"Ml4,5": "Oto ja poślę wam Eliasza proroka, zanim przyjdzie dzień JHWH; wielki i straszny."
"Ml4,6": "I zwróci serca ojców ku synom, a serca synów ku ich ojcom, abym, gdy przyjdę, nie ukarał ziemi przekleństwem."
