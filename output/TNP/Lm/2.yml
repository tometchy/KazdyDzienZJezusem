"Lm2,1":
  text: "א‬ Ach, jakże okrył chmurą PAN w swoim gniewie córkę Syjonu, zrzucił z niebios na ziemię wspaniałość Izraela i nie pamiętał o podnóżku swoich stóp w dniu swojego gniewu!"
  tags: []
"Lm2,2":
  text: "‫ב‬ PAN pochłonął i nie okazał litości żadnej siedzibie Jakuba, zburzył w swojej zapalczywości twierdze córki Judy, rzucił je o ziemię i zhańbił królestwo i jego książąt."
  tags: []
"Lm2,3":
  text: "‫ג‬ Odciął w żarze swojego gniewu wszelki róg Izraela, cofnął swoją prawicę sprzed oblicza wroga i zapłonął przeciwko Jakubowi niczym płomień ognia, pożerający wszystko wokół."
  tags: []
"Lm2,4":
  text: "‫ד‬ Napiął swój łuk jak wróg, postawił swoją prawicę jak nieprzyjaciel i zabił całą rozkosz dla oczu. W namiocie córki Syjonu wylał jak ogień swą wściekłość."
  tags: []
"Lm2,5":
  text: "‫ה‬ PAN stał się jak wróg, pochłonął Izraela, pochłonął wszystkie jego pałace, zniszczył jego twierdze i pomnożył u córki Judy płacz i lament."
  tags: []
"Lm2,6":
  text: "‫ו‬ I przeorał jak ogród swój przybytek, zniszczył miejsce swoich spotkań. JHWH sprawił, że zapomniano na Syjonie o święcie i szabacie, a we wzburzeniu swojego gniewu odtrącił króla i kapłana."
  tags: []
"Lm2,7":
  text: "‫ז‬ PAN odrzucił swój ołtarz, obrzydził sobie swoją świątynię, wydał w ręce wroga mury jej pałaców. Wydali głos w domu JHWH jak w dzień święta."
  tags: []
"Lm2,8":
  text: "‫ח‬‬ JHWH przeznaczył na zburzenie mur córki Syjonu, rozciągnął sznur mierniczy i nie cofnął swojej ręki przed pochłonięciem. Sprawił, że płakał w żałobie wał i mur – razem osłabły."
  tags: []
"Lm2,9":
  text: "ט‬ Zapadły się w ziemię jej bramy, zniszczył i pokruszył jej rygle. Jej król i książęta są pośród narodów, nie ma Prawa, także jej prorocy nie znajdują widzenia od JHWH."
  tags: []
"Lm2,10":
  text: "‫י‬ Starsi córki Syjonu usiedli na ziemi i zamilkli. Wznieśli proch na swoje głowy, opasali się worami. Dziewice Jerozolimy pochylają do ziemi swoją głowę."
  tags: []
"Lm2,11":
  text: "‫כ‬ Moje oczy osłabły od łez, wrzenie ogarnia moje wnętrze, moja wątroba wylała się na ziemię z powodu ruiny córki mojego ludu. Dziecko i niemowlę mdleje na ulicach miasta."
  tags: []
"Lm2,12":
  text: "‫ל‬ Mówiły do swoich matek: Gdzie jest zboże i wino? – gdy mdlały niczym zranione na ulicach miasta aby oddawać swoją duszę na łonie swoich matek."
  tags: []
"Lm2,13":
  text: "‫מ‬ Kogo wezwę na twojego świadka? Kogo przyrównam do ciebie, córko Jerozolimy? Kogo uczynię podobnym tobie, aby cię pocieszać, dziewico, córko Syjonu? Bo twoja ruina jest wielka jak morze. Kto cię uzdrowi?"
  tags: []
"Lm2,14":
  text: "‫נ‬ Twoi prorocy mieli wizje dla ciebie – puste słowa i mdłe sprawy; i nie obnażali twojej winy, aby odwrócić twoją niewolę, lecz mieli wizje dla ciebie – brzemiona fałszywe i zwodnicze."
  tags: []
"Lm2,15":
  text: "‫ס‬ Klaskali nad tobą w dłonie wszyscy przechodzący drogą; gwizdali i kiwali głowami nad córką Jerozolimy, mówiąc: Czy to jest miasto, o którym mówili: Doskonała piękność i radość dla całej ziemi?"
  tags: []
"Lm2,16":
  text: "‫פ‬ Rozwarli na ciebie swoje usta wszyscy twoi wrogowie. Gwizdali i zgrzytali zębami, mówiąc: Pochłonęliśmy je. Zaiste! To jest dzień, na który czekaliśmy! Znaleźliśmy i zobaczyliśmy go!"
  tags: []
"Lm2,17":
  text: "‫ע‬ JHWH uczynił to, co zamyślał, wypełnił swoje Słowo, które przekazał od dawnych dni. Zniszczył i bez litości pozwolił wrogowi radować się nad tobą, wywyższył róg twoich nieprzyjaciół."
  tags: []
"Lm2,18":
  text: "‫צ‬‬ Ich serce wołało do PANA: Murze córki Syjonu! Spraw, niech wylewają się łzy za dnia i w nocy jak strumień! Nie dawaj sobie odpoczynku i niech nie uspokaja się źrenica twojego oka!"
  tags: []
"Lm2,19":
  text: "‫ק‬ Powstań, krzycz w nocy na początku straży nocnej, wylewaj swoje serce jak wodę przed obliczem PANA. Podnoś do Niego swoje dłonie o życie swoich niemowląt omdlewających z głodu na szczycie każdej z ulic."
  tags: []
"Lm2,20":
  text: "‫ר‬ Spójrz, JHWH, i przyjrzyj się: Z kim tak postąpiłeś? Czy kobiety mają jeść swoje potomstwo, wypieszczone niemowlęta? Czy kapłan i prorok mają być zabijani w świątyni PANA?"
  tags: []
"Lm2,21":
  text: "‫ש‬ Leżą w prochu ulic, dziecko i starzec. Moje dziewice i moi młodzieńcy polegli od miecza; zabiłeś ich w dzień swojego gniewu – zgładziłeś ich, nie pożałowałeś."
  tags: []
"Lm2,22":
  text: "‫ת‬ Zawołaj jak w dniu zgromadzenia – otacza mnie trwoga – lecz nie było w dniu gniewu JHWH uciekiniera i ocalonego. Tych, których piastowałam i wychowałam – zniszczył mój wróg."
  tags: []
