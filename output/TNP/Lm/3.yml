"Lm3,1": "א‬ Ja jestem tym mężem, który widział utrapienie pod rózgą Jego zapalczywości."
"Lm3,2": "א‬ Kierował mną i wprowadził w ciemność, a nie w światłość."
"Lm3,3": "א‬ O tak! Zwrócił się przeciwko mnie i odwrócił swoją rękę ode mnie przez cały dzień."
"Lm3,4": "‫ב‬ Pomarszczył moje ciało i moją skórę, połamał moje kości."
"Lm3,5": "‫ב‬ Obudował mnie i otoczył goryczą i mozołem;"
"Lm3,6": "‫ב‬ Posadził mnie w ciemnościach jak dawno zmarłych."
"Lm3,7": "‫ג‬ Ogrodził mnie zewsząd, abym nie wyszedł, uczynił ciężkimi moje kajdany."
"Lm3,8": "‫ג‬ Nawet gdy krzyczałem i wołałem o pomoc, zatyka uszy na moje modlitwy."
"Lm3,9": "‫ג‬ Zagrodził moje drogi kamieniem ciosanym, poplątał moje ścieżki."
"Lm3,10": "‫ד‬ Jest on dla mnie niedźwiedziem czyhającym na mnie, lwem w ukryciu."
"Lm3,11": "‫ד‬ Zmylił moje drogi, rozszarpał mnie i uczynił mnie spustoszeniem."
"Lm3,12": "‫ד‬ Napiął swój łuk i postawił mnie za cel dla swojej strzały."
"Lm3,13": "‫ה‬ Przeszył moje nerki strzałami ze swojego kołczana."
"Lm3,14": "‫ה‬ Stałem się pośmiewiskiem dla całego mojego ludu, ich przyśpiewką przez cały dzień."
"Lm3,15": "‫ה‬ Napełnił mnie goryczą, napoił mnie piołunem."
"Lm3,16": "‫ו‬ I pokruszył o żwir moje zęby i wdeptał mnie w proch."
"Lm3,17": "‫ו‬ I odtrącił moją duszę od pokoju. Zapomniałem, co to pomyślność."
"Lm3,18": "‫ו‬ Więc powiedziałem: Zginęła moja siła i moja nadzieja, którą pokładałem w JHWH."
"Lm3,19": "‫ז‬ Wspomnij na moje utrapienie i moją tułaczkę – piołun to i żółć."
"Lm3,20": "‫ז‬ Moja dusza nieustannie to wspomina i uniża się we mnie."
"Lm3,21": "‫ז‬ Przywołuję to sobie do serca, dlatego też mam nadzieję,"
"Lm3,22": "‫ח‬ Na miłosierdzie JHWH, bo nie wyczerpaliśmy go, gdyż nie ustaje Jego litość."
"Lm3,23": "‫ח‬ Każdego poranka pojawiają się na nowo, wielka jest Twoja wierność."
"Lm3,24": "‫ח‬ JHWH jest moim działem – powiedziała moja dusza – dlatego też pokładam w Nim nadzieję."
"Lm3,25": "ט‬ Dobry jest JHWH dla tych, którzy Go oczekują, dla duszy, która Go szuka."
"Lm3,26": "ט‬ Dobre jest również czekanie w milczeniu na zbawienie JHWH."
"Lm3,27": "ט‬ Dobrze jest człowiekowi nosić jarzmo w swojej młodości."
"Lm3,28": "‫י‬ Niech siedzi samotnie i milczy, gdy Pan włożył je na niego."
"Lm3,29": "‫י‬ Niech kładzie swoje usta w prochu, może jest jeszcze nadzieja."
"Lm3,30": "‫י‬ Niech nadstawia bijącemu policzek, niech syci się hańbą."
"Lm3,31": "‫כ‬ Bo PAN nie odrzuca na wieki;"
"Lm3,32": "‫כ‬ Bo jeśli zasmuca, to i lituje się według obfitości swojego miłosierdzia;"
"Lm3,33": "‫כ‬ Gdyż nie ze skłonności serc a trapi i zasmuca synów człowieka."
"Lm3,34": "‫ל‬ By kruszyć pod stopami wszystkich więźniów ziemi;"
"Lm3,35": "‫ל‬ By nagiąć prawa człowieka przed obliczem Najwyższego;"
"Lm3,36": "‫ל‬ By gnębić człowieka w toku jego sprawy – czyż PAN nie widzi tego?"
"Lm3,37": "‫מ‬ Kim jest ten, kto powiedział i stało się, a PAN tego nie rozkazał?"
"Lm3,38": "‫מ‬ Czy z ust Najwyższego nie pochodzi zło i dobro?"
"Lm3,39": "‫מ‬ Na co uskarża się człowiek, który żyje, mężczyzna – czy nie z powodu kary za swoje grzechy?"
"Lm3,40": "‫נ‬ Doświadczajmy nasze drogi i badajmy je, nawróćmy się do JHWH."
"Lm3,41": "‫נ‬ Wznieśmy swoje serca i ręce do Boga w niebiosach."
"Lm3,42": "‫נ‬ To my zgrzeszyliśmy i zbuntowaliśmy się, a Ty nie przebaczyłeś."
"Lm3,43": "‫ס‬ Okryłeś się gniewem i prześladowałeś nas, zabiłeś bez okazania litości."
"Lm3,44": "‫ס‬ Okryłeś się obłokiem, aby nie mogła przejść do Ciebie modlitwa."
"Lm3,45": "‫ס‬ Składałeś nas jak śmieci i odpadki pośród narodów."
"Lm3,46": "‫פ‬ Otworzyli nad nami swoje usta wszyscy nasi wrogowie."
"Lm3,47": "‫פ‬ Spadło na nas przerażenie i pułapka, spustoszenie i zniszczenie."
"Lm3,48": "‫פ‬ Strumieniami wód spływa moje oko z powodu zniszczenia córki mojego ludu."
"Lm3,49": "‫ע‬ Moje oko jest zapłakane i nie przestaje – nie ma końca płaczu;"
"Lm3,50": "‫ע‬ Dopóki nie wychyli się i nie zechce spojrzeć JHWH z niebios."
"Lm3,51": "‫ע‬ Moje oko trapi moją duszę z powodu wszystkich córek mojego miasta."
"Lm3,52": "‫צ‬ Moi wrogowie polowali na mnie ustawicznie jak na ptaka – bez powodu."
"Lm3,53": "‫צ‬ Chcieli zakończyć w dole moje życie i rzucali we mnie kamieniem."
"Lm3,54": "‫צ‬ Przelały się wody nad moją głową i powiedziałem: Jestem zgubiony!"
"Lm3,55": "‫ק‬ Wzywałem Twojego imienia, JHWH z głębokiego dołu."
"Lm3,56": "‫ק‬ Usłyszałeś mój głos, nie zakryłeś swojego ucha na moje wzdychanie i na moje wołanie o pomoc."
"Lm3,57": "‫ק‬ Zbliżyłeś się do mnie w dniu, gdy Cię wzywałem i powiedziałeś: Nie bój się."
"Lm3,58": "‫ר‬ Broniłeś, PANIE, spraw mojej duszy, odkupiłeś moje życie."
"Lm3,59": "‫ר‬ JHWH, widziałeś moją krzywdę, rozsądź moje prawo."
"Lm3,60": "‫ר‬ Widziałeś całą ich zemstę i wszystkie ich zamysły wobec mnie."
"Lm3,61": "‫ש‬ Słyszałeś ich szyderstwo, JHWH, i wszystkie ich zamysły wobec mnie;"
"Lm3,62": "‫ש‬ Słowa powstających przeciwko mnie i ich przyśpiewki są mi przeciwne przez cały dzień."
"Lm3,63": "‫ש‬ Zobacz – ich siadanie i wstawanie, ja jestem ich szyderczą pieśnią."
"Lm3,64": "‫ת‬ Zwróć im zapłatę, JHWH, według dzieła ich rąk."
"Lm3,65": "‫ת‬ Daj im zaślepione serce – ześlij im Twoje przekleństwo;"
"Lm3,66": "‫ת‬ Będziesz ścigał ich w gniewie i zgładzisz ich spod niebios, JHWH!"
