"Lm3,1":
  text: "א‬ Ja jestem tym mężem, który widział utrapienie pod rózgą Jego zapalczywości."
  tags: []
"Lm3,2":
  text: "א‬ Kierował mną i wprowadził w ciemność, a nie w światłość."
  tags: []
"Lm3,3":
  text: "א‬ O tak! Zwrócił się przeciwko mnie i odwrócił swoją rękę ode mnie przez cały dzień."
  tags: []
"Lm3,4":
  text: "‫ב‬ Pomarszczył moje ciało i moją skórę, połamał moje kości."
  tags: []
"Lm3,5":
  text: "‫ב‬ Obudował mnie i otoczył goryczą i mozołem;"
  tags: []
"Lm3,6":
  text: "‫ב‬ Posadził mnie w ciemnościach jak dawno zmarłych."
  tags: []
"Lm3,7":
  text: "‫ג‬ Ogrodził mnie zewsząd, abym nie wyszedł, uczynił ciężkimi moje kajdany."
  tags: []
"Lm3,8":
  text: "‫ג‬ Nawet gdy krzyczałem i wołałem o pomoc, zatyka uszy na moje modlitwy."
  tags: []
"Lm3,9":
  text: "‫ג‬ Zagrodził moje drogi kamieniem ciosanym, poplątał moje ścieżki."
  tags: []
"Lm3,10":
  text: "‫ד‬ Jest on dla mnie niedźwiedziem czyhającym na mnie, lwem w ukryciu."
  tags: []
"Lm3,11":
  text: "‫ד‬ Zmylił moje drogi, rozszarpał mnie i uczynił mnie spustoszeniem."
  tags: []
"Lm3,12":
  text: "‫ד‬ Napiął swój łuk i postawił mnie za cel dla swojej strzały."
  tags: []
"Lm3,13":
  text: "‫ה‬ Przeszył moje nerki strzałami ze swojego kołczana."
  tags: []
"Lm3,14":
  text: "‫ה‬ Stałem się pośmiewiskiem dla całego mojego ludu, ich przyśpiewką przez cały dzień."
  tags: []
"Lm3,15":
  text: "‫ה‬ Napełnił mnie goryczą, napoił mnie piołunem."
  tags: []
"Lm3,16":
  text: "‫ו‬ I pokruszył o żwir moje zęby i wdeptał mnie w proch."
  tags: []
"Lm3,17":
  text: "‫ו‬ I odtrącił moją duszę od pokoju. Zapomniałem, co to pomyślność."
  tags: []
"Lm3,18":
  text: "‫ו‬ Więc powiedziałem: Zginęła moja siła i moja nadzieja, którą pokładałem w JHWH."
  tags: []
"Lm3,19":
  text: "‫ז‬ Wspomnij na moje utrapienie i moją tułaczkę – piołun to i żółć."
  tags: []
"Lm3,20":
  text: "‫ז‬ Moja dusza nieustannie to wspomina i uniża się we mnie."
  tags: []
"Lm3,21":
  text: "‫ז‬ Przywołuję to sobie do serca, dlatego też mam nadzieję,"
  tags: []
"Lm3,22":
  text: "‫ח‬ Na miłosierdzie JHWH, bo nie wyczerpaliśmy go, gdyż nie ustaje Jego litość."
  tags: []
"Lm3,23":
  text: "‫ח‬ Każdego poranka pojawiają się na nowo, wielka jest Twoja wierność."
  tags: []
"Lm3,24":
  text: "‫ח‬ JHWH jest moim działem – powiedziała moja dusza – dlatego też pokładam w Nim nadzieję."
  tags: []
"Lm3,25":
  text: "ט‬ Dobry jest JHWH dla tych, którzy Go oczekują, dla duszy, która Go szuka."
  tags: []
"Lm3,26":
  text: "ט‬ Dobre jest również czekanie w milczeniu na zbawienie JHWH."
  tags: []
"Lm3,27":
  text: "ט‬ Dobrze jest człowiekowi nosić jarzmo w swojej młodości."
  tags: []
"Lm3,28":
  text: "‫י‬ Niech siedzi samotnie i milczy, gdy Pan włożył je na niego."
  tags: []
"Lm3,29":
  text: "‫י‬ Niech kładzie swoje usta w prochu, może jest jeszcze nadzieja."
  tags: []
"Lm3,30":
  text: "‫י‬ Niech nadstawia bijącemu policzek, niech syci się hańbą."
  tags: []
"Lm3,31":
  text: "‫כ‬ Bo PAN nie odrzuca na wieki;"
  tags: []
"Lm3,32":
  text: "‫כ‬ Bo jeśli zasmuca, to i lituje się według obfitości swojego miłosierdzia;"
  tags: []
"Lm3,33":
  text: "‫כ‬ Gdyż nie ze skłonności serc a trapi i zasmuca synów człowieka."
  tags: []
"Lm3,34":
  text: "‫ל‬ By kruszyć pod stopami wszystkich więźniów ziemi;"
  tags: []
"Lm3,35":
  text: "‫ל‬ By nagiąć prawa człowieka przed obliczem Najwyższego;"
  tags: []
"Lm3,36":
  text: "‫ל‬ By gnębić człowieka w toku jego sprawy – czyż PAN nie widzi tego?"
  tags: []
"Lm3,37":
  text: "‫מ‬ Kim jest ten, kto powiedział i stało się, a PAN tego nie rozkazał?"
  tags: []
"Lm3,38":
  text: "‫מ‬ Czy z ust Najwyższego nie pochodzi zło i dobro?"
  tags: []
"Lm3,39":
  text: "‫מ‬ Na co uskarża się człowiek, który żyje, mężczyzna – czy nie z powodu kary za swoje grzechy?"
  tags: []
"Lm3,40":
  text: "‫נ‬ Doświadczajmy nasze drogi i badajmy je, nawróćmy się do JHWH."
  tags: []
"Lm3,41":
  text: "‫נ‬ Wznieśmy swoje serca i ręce do Boga w niebiosach."
  tags: []
"Lm3,42":
  text: "‫נ‬ To my zgrzeszyliśmy i zbuntowaliśmy się, a Ty nie przebaczyłeś."
  tags: []
"Lm3,43":
  text: "‫ס‬ Okryłeś się gniewem i prześladowałeś nas, zabiłeś bez okazania litości."
  tags: []
"Lm3,44":
  text: "‫ס‬ Okryłeś się obłokiem, aby nie mogła przejść do Ciebie modlitwa."
  tags: []
"Lm3,45":
  text: "‫ס‬ Składałeś nas jak śmieci i odpadki pośród narodów."
  tags: []
"Lm3,46":
  text: "‫פ‬ Otworzyli nad nami swoje usta wszyscy nasi wrogowie."
  tags: []
"Lm3,47":
  text: "‫פ‬ Spadło na nas przerażenie i pułapka, spustoszenie i zniszczenie."
  tags: []
"Lm3,48":
  text: "‫פ‬ Strumieniami wód spływa moje oko z powodu zniszczenia córki mojego ludu."
  tags: []
"Lm3,49":
  text: "‫ע‬ Moje oko jest zapłakane i nie przestaje – nie ma końca płaczu;"
  tags: []
"Lm3,50":
  text: "‫ע‬ Dopóki nie wychyli się i nie zechce spojrzeć JHWH z niebios."
  tags: []
"Lm3,51":
  text: "‫ע‬ Moje oko trapi moją duszę z powodu wszystkich córek mojego miasta."
  tags: []
"Lm3,52":
  text: "‫צ‬ Moi wrogowie polowali na mnie ustawicznie jak na ptaka – bez powodu."
  tags: []
"Lm3,53":
  text: "‫צ‬ Chcieli zakończyć w dole moje życie i rzucali we mnie kamieniem."
  tags: []
"Lm3,54":
  text: "‫צ‬ Przelały się wody nad moją głową i powiedziałem: Jestem zgubiony!"
  tags: []
"Lm3,55":
  text: "‫ק‬ Wzywałem Twojego imienia, JHWH z głębokiego dołu."
  tags: []
"Lm3,56":
  text: "‫ק‬ Usłyszałeś mój głos, nie zakryłeś swojego ucha na moje wzdychanie i na moje wołanie o pomoc."
  tags: []
"Lm3,57":
  text: "‫ק‬ Zbliżyłeś się do mnie w dniu, gdy Cię wzywałem i powiedziałeś: Nie bój się."
  tags: []
"Lm3,58":
  text: "‫ר‬ Broniłeś, PANIE, spraw mojej duszy, odkupiłeś moje życie."
  tags: []
"Lm3,59":
  text: "‫ר‬ JHWH, widziałeś moją krzywdę, rozsądź moje prawo."
  tags: []
"Lm3,60":
  text: "‫ר‬ Widziałeś całą ich zemstę i wszystkie ich zamysły wobec mnie."
  tags: []
"Lm3,61":
  text: "‫ש‬ Słyszałeś ich szyderstwo, JHWH, i wszystkie ich zamysły wobec mnie;"
  tags: []
"Lm3,62":
  text: "‫ש‬ Słowa powstających przeciwko mnie i ich przyśpiewki są mi przeciwne przez cały dzień."
  tags: []
"Lm3,63":
  text: "‫ש‬ Zobacz – ich siadanie i wstawanie, ja jestem ich szyderczą pieśnią."
  tags: []
"Lm3,64":
  text: "‫ת‬ Zwróć im zapłatę, JHWH, według dzieła ich rąk."
  tags: []
"Lm3,65":
  text: "‫ת‬ Daj im zaślepione serce – ześlij im Twoje przekleństwo;"
  tags: []
"Lm3,66":
  text: "‫ת‬ Będziesz ścigał ich w gniewie i zgładzisz ich spod niebios, JHWH!"
  tags: []
