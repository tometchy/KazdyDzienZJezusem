"Lm5,1":
  text: "Wspomnij, JHWH, co się z nami stało. Spójrz i zobacz nasze pohańbienie."
  tags: []
"Lm5,2":
  text: "Nasze dziedzictwo przypadło obcym, a nasze domy – cudzoziemcom."
  tags: []
"Lm5,3":
  text: "Staliśmy się sierotami, bez ojca; nasze matki są jak wdowy."
  tags: []
"Lm5,4":
  text: "Naszą wodę piliśmy za srebro, z naszych drzew korzystamy za opłatą."
  tags: []
"Lm5,5":
  text: "Gnali nas z jarzmem na karku. Pracujemy ciężko, a nie dają nam wytchnienia."
  tags: []
"Lm5,6":
  text: "Podawaliśmy rękę Egiptowi i Asyrii, aby nasycić się chlebem."
  tags: []
"Lm5,7":
  text: "Nasi ojcowie zgrzeszyli i nie ma ich, a my dźwigamy ich winę."
  tags: []
"Lm5,8":
  text: "Słudzy panują nad nami, nie ma wybawcy z ich ręki."
  tags: []
"Lm5,9":
  text: "Z narażeniem swojego życia zdobywamy nasz chleb z powodu ciosu miecza na pustyni."
  tags: []
"Lm5,10":
  text: "Nasza skóra jest jak piec rozpalona z powodu gorączki głodowej."
  tags: []
"Lm5,11":
  text: "Kobiety hańbiono na Syjonie, a dziewice – w miastach Judy."
  tags: []
"Lm5,12":
  text: "Książęta zostali powieszeni za ręce, oblicza starszych nie uszanowano."
  tags: []
"Lm5,13":
  text: "Młodzieńcy dźwigali żarna, a chłopcy potykali się pod ciężarem drewna."
  tags: []
"Lm5,14":
  text: "‫נ‬ Starsi przestali zasiadać w bramach, młodzieńcy zrezygnowali ze śpiewu."
  tags: []
"Lm5,15":
  text: "Nasze serce przestało się radować, nasz radosny taniec zamienił się w żałobę."
  tags: []
"Lm5,16":
  text: "Spadła korona z naszej głowy. Biada nam, bo zgrzeszyliśmy!"
  tags: []
"Lm5,17":
  text: "To dlatego stało się omdlałe nasze serce. To dlatego nasze oczy przygasły."
  tags: []
"Lm5,18":
  text: "Z powodu spustoszonej góry Syjonu szakale chodzą po niej."
  tags: []
"Lm5,19":
  text: "Ty, JHWH, trwasz na wieki, twój tron z pokolenia na pokolenie."
  tags: []
"Lm5,20":
  text: "Dlaczego wciąż o nas zapominasz, opuściłeś nas na tak długie dni?"
  tags: []
"Lm5,21":
  text: "Nawróć nas do Ciebie, JHWH, a będziemy nawróceni; odnów nasze dni, jak dawniej."
  tags: []
"Lm5,22":
  text: "Bo czy odrzuciłeś nas całkowicie? Czy aż tak bardzo się na nas zagniewałeś?"
  tags: []
