"Lm5,1": "Wspomnij, JHWH, co się z nami stało. Spójrz i zobacz nasze pohańbienie."
"Lm5,2": "Nasze dziedzictwo przypadło obcym, a nasze domy – cudzoziemcom."
"Lm5,3": "Staliśmy się sierotami, bez ojca; nasze matki są jak wdowy."
"Lm5,4": "Naszą wodę piliśmy za srebro, z naszych drzew korzystamy za opłatą."
"Lm5,5": "Gnali nas z jarzmem na karku. Pracujemy ciężko, a nie dają nam wytchnienia."
"Lm5,6": "Podawaliśmy rękę Egiptowi i Asyrii, aby nasycić się chlebem."
"Lm5,7": "Nasi ojcowie zgrzeszyli i nie ma ich, a my dźwigamy ich winę."
"Lm5,8": "Słudzy panują nad nami, nie ma wybawcy z ich ręki."
"Lm5,9": "Z narażeniem swojego życia zdobywamy nasz chleb z powodu ciosu miecza na pustyni."
"Lm5,10": "Nasza skóra jest jak piec rozpalona z powodu gorączki głodowej."
"Lm5,11": "Kobiety hańbiono na Syjonie, a dziewice – w miastach Judy."
"Lm5,12": "Książęta zostali powieszeni za ręce, oblicza starszych nie uszanowano."
"Lm5,13": "Młodzieńcy dźwigali żarna, a chłopcy potykali się pod ciężarem drewna."
"Lm5,14": "‫נ‬ Starsi przestali zasiadać w bramach, młodzieńcy zrezygnowali ze śpiewu."
"Lm5,15": "Nasze serce przestało się radować, nasz radosny taniec zamienił się w żałobę."
"Lm5,16": "Spadła korona z naszej głowy. Biada nam, bo zgrzeszyliśmy!"
"Lm5,17": "To dlatego stało się omdlałe nasze serce. To dlatego nasze oczy przygasły."
"Lm5,18": "Z powodu spustoszonej góry Syjonu szakale chodzą po niej."
"Lm5,19": "Ty, JHWH, trwasz na wieki, twój tron z pokolenia na pokolenie."
"Lm5,20": "Dlaczego wciąż o nas zapominasz, opuściłeś nas na tak długie dni?"
"Lm5,21": "Nawróć nas do Ciebie, JHWH, a będziemy nawróceni; odnów nasze dni, jak dawniej."
"Lm5,22": "Bo czy odrzuciłeś nas całkowicie? Czy aż tak bardzo się na nas zagniewałeś?"
