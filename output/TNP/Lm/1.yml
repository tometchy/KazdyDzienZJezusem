"Lm1,1":
  text: "א‬ Ach, jakże samotnie siedzi miasto, niegdyś pełne ludzi! Stało się jak wdowa, niegdyś wielkie wśród narodów. Księżniczka wśród prowincji stała się przymusową robotnicą."
  tags: []
"Lm1,2":
  text: "‫ב‬ Gorzko płacze w nocy, a na jej policzkach łzy. Nie ma dla niej pocieszenia od żadnego z jej kochanków. Wszyscy jej przyjaciele zdradzili ją i stali się jej wrogami."
  tags: []
"Lm1,3":
  text: "‫ג‬ Juda poszedł na wygnanie, na cierpienie i w wielką niewolę. Osiadła ona między narodami i nie znajduje odpoczynku. Wszyscy jej prześladowcy dopadli ją pośród udręki."
  tags: []
"Lm1,4":
  text: "‫ד‬ Drogi Syjonu w żałobie, bo brak przychodzących na święto. Wszystkie jego bramy opustoszałe, jego kapłani wzdychają, jego dziewice zgnębione, a ona jest w rozgoryczeniu."
  tags: []
"Lm1,5":
  text: "‫ה‬ Jego przeciwnicy stali się górą jego wrogom się powodzi. Bo JHWH utrapił go z powodu mnóstwa jego nieustannego buntu. Jego dzieci poszły do niewoli przed ciemięzcą."
  tags: []
"Lm1,6":
  text: "‫ו‬ I odeszło od córki Syjonu całe jej dostojeństwo. Jej książęta stali się jak jelenie, które nie znalazły pastwiska i uchodzą bez siły przed tym, który je ściga."
  tags: []
"Lm1,7":
  text: "‫ז‬ W dniach swojego utrapienia i swojej tułaczki Jerozolima wspomniała wszystkie swoje kosztowności, które miała za dawnych dni. Gdy jej lud wpadł w rękę nieprzyjaciela i nikt nie przyszedł jej z pomocą, widzieli ją jej nieprzyjaciele – naśmiewali się z jej zagłady."
  tags: []
"Lm1,8":
  text: "‫ח‬ Ciężko zgrzeszyła Jerozolima, dlatego stała się nieczysta. Wszyscy, którzy ją szanowali, gardzą nią, gdyż widzą jej nagość, a ona wzdycha i odwraca się tyłem."
  tags: []
"Lm1,9":
  text: "ט‬ Jej nieczystość – na jej skraju spódnicy, nie pamięta już swojego końca, to zdumiewające jak jest poniżona, nie ma dla niej pocieszyciela. Spójrz, JHWH, na moje utrapienie, bo wróg się wywyższył."
  tags: []
"Lm1,10":
  text: "‫י‬ Nieprzyjaciel wyciągnął swoją rękę po wszystkie jej kosztowności. Tak! Widziała, jak poganie weszli do Twojej świątyni, którym nakazałeś nie wchodzić do Twojego zgromadzenia."
  tags: []
"Lm1,11":
  text: "‫כ‬ Cały jej lud jęczy poszukując chleba, daje swoje kosztowności za pokarm, by zachować duszę. Spójrz, JHWH, i zobacz, jak jestem wzgardzona."
  tags: []
"Lm1,12":
  text: "‫ל‬ Nic to dla was nie znaczy! Wszyscy przechodzący drogą? Zobaczcie i spójrzcie: Czy jest ból taki jak mój ból, którym zostałam surowo potraktowana, smutek, który sprowadził na mnie JHWH w dniu swojego zapalczywego gniewu?"
  tags: []
"Lm1,13":
  text: "‫מ‬ Z wysoka zesłał ogień na moje kości i ten je opanował. Rozciągnął sieć na moje nogi i obrócił mnie na plecy, wydał mnie na spustoszenie i przez cały dzień omdlewam."
  tags: []
"Lm1,14":
  text: "‫נ‬‬ Jarzmo moich nieprawości zostało związane Jego ręką, splotły się i wspięły się na moją szyję – sprawił, że załamała się moja siła. PAN wydał mnie w ręce wrogów i nie jestem w stanie powstać."
  tags: []
"Lm1,15":
  text: "‫ס‬ PAN odrzucił wszystkich mocarzy, którzy są pośród mnie, zwołał przeciwko mnie zgromadzenie, aby zmiażdżyć mojego młodzieńca. PAN podeptał w tłoczni dziewicę, córkę Judy."
  tags: []
"Lm1,16":
  text: "‫ע‬ Z tego powodu ja płaczę; z moich oczu, z moich oczu spływa woda, gdyż daleko jest ode mnie pocieszyciel, który by odnowił moją duszę; moi synowie zostali wytraceni, bo wróg zwyciężył."
  tags: []
"Lm1,17":
  text: "‫פ‬ Syjon wyciąga swoje ręce – nie ma dla niego pocieszyciela. JHWH rozkazał, by jego nieprzyjaciele otoczyli Jakuba. Jerozolima stała się pośród nich jak nieczysta."
  tags: []
"Lm1,18":
  text: "‫צ‬ JHWH – On jest sprawiedliwy, bo zbuntowałam się przeciwko Jego ustom. Słuchajcie, proszę, wszystkie ludy, i zobaczcie mój ból. Moje dziewice i moi młodzieńcy poszli do niewoli."
  tags: []
"Lm1,19":
  text: "‫ק‬ Wołałam do moich kochanków – oni mnie zdradzili! Moi kapłani i starsi zginęli w mieście, gdy szukali jedzenia dla siebie, aby posilić swoją duszę."
  tags: []
"Lm1,20":
  text: "‫ר‬ Spójrz, JHWH, bo jestem utrapiona, moje wnętrze ogarnia wrzenie, moje serce przewraca się we mnie, bo uparcie się buntowałam. Na zewnątrz osieroca miecz – w domu jest jak śmierć."
  tags: []
"Lm1,21":
  text: "‫ש‬ Słyszeli, że ja jęczę – nie ma dla mnie pocieszyciela; wszyscy moi wrogowie słyszeli o moim nieszczęściu, cieszyli się, że Ty to uczyniłeś. Sprowadziłeś dzień, który ogłosiłeś, więc niech im się stanie jak mnie!"
  tags: []
"Lm1,22":
  text: "‫ת‬ Niech cała ich niegodziwość przyjdzie przed Ciebie; i uczyń z nimi tak, jak ze mną uczyniłeś za wszystkie moje przestępstwa. Tak! Liczne są moje westchnienia, a moje serce jest słabe."
  tags: []
