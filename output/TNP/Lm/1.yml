"Lm1,1": "א‬ Ach, jakże samotnie siedzi miasto, niegdyś pełne ludzi! Stało się jak wdowa, niegdyś wielkie wśród narodów. Księżniczka wśród prowincji stała się przymusową robotnicą."
"Lm1,2": "‫ב‬ Gorzko płacze w nocy, a na jej policzkach łzy. Nie ma dla niej pocieszenia od żadnego z jej kochanków. Wszyscy jej przyjaciele zdradzili ją i stali się jej wrogami."
"Lm1,3": "‫ג‬ Juda poszedł na wygnanie, na cierpienie i w wielką niewolę. Osiadła ona między narodami i nie znajduje odpoczynku. Wszyscy jej prześladowcy dopadli ją pośród udręki."
"Lm1,4": "‫ד‬ Drogi Syjonu w żałobie, bo brak przychodzących na święto. Wszystkie jego bramy opustoszałe, jego kapłani wzdychają, jego dziewice zgnębione, a ona jest w rozgoryczeniu."
"Lm1,5": "‫ה‬ Jego przeciwnicy stali się górą jego wrogom się powodzi. Bo JHWH utrapił go z powodu mnóstwa jego nieustannego buntu. Jego dzieci poszły do niewoli przed ciemięzcą."
"Lm1,6": "‫ו‬ I odeszło od córki Syjonu całe jej dostojeństwo. Jej książęta stali się jak jelenie, które nie znalazły pastwiska i uchodzą bez siły przed tym, który je ściga."
"Lm1,7": "‫ז‬ W dniach swojego utrapienia i swojej tułaczki Jerozolima wspomniała wszystkie swoje kosztowności, które miała za dawnych dni. Gdy jej lud wpadł w rękę nieprzyjaciela i nikt nie przyszedł jej z pomocą, widzieli ją jej nieprzyjaciele – naśmiewali się z jej zagłady."
"Lm1,8": "‫ח‬ Ciężko zgrzeszyła Jerozolima, dlatego stała się nieczysta. Wszyscy, którzy ją szanowali, gardzą nią, gdyż widzą jej nagość, a ona wzdycha i odwraca się tyłem."
"Lm1,9": "ט‬ Jej nieczystość – na jej skraju spódnicy, nie pamięta już swojego końca, to zdumiewające jak jest poniżona, nie ma dla niej pocieszyciela. Spójrz, JHWH, na moje utrapienie, bo wróg się wywyższył."
"Lm1,10": "‫י‬ Nieprzyjaciel wyciągnął swoją rękę po wszystkie jej kosztowności. Tak! Widziała, jak poganie weszli do Twojej świątyni, którym nakazałeś nie wchodzić do Twojego zgromadzenia."
"Lm1,11": "‫כ‬ Cały jej lud jęczy poszukując chleba, daje swoje kosztowności za pokarm, by zachować duszę. Spójrz, JHWH, i zobacz, jak jestem wzgardzona."
"Lm1,12": "‫ל‬ Nic to dla was nie znaczy! Wszyscy przechodzący drogą? Zobaczcie i spójrzcie: Czy jest ból taki jak mój ból, którym zostałam surowo potraktowana, smutek, który sprowadził na mnie JHWH w dniu swojego zapalczywego gniewu?"
"Lm1,13": "‫מ‬ Z wysoka zesłał ogień na moje kości i ten je opanował. Rozciągnął sieć na moje nogi i obrócił mnie na plecy, wydał mnie na spustoszenie i przez cały dzień omdlewam."
"Lm1,14": "‫נ‬‬ Jarzmo moich nieprawości zostało związane Jego ręką, splotły się i wspięły się na moją szyję – sprawił, że załamała się moja siła. PAN wydał mnie w ręce wrogów i nie jestem w stanie powstać."
"Lm1,15": "‫ס‬ PAN odrzucił wszystkich mocarzy, którzy są pośród mnie, zwołał przeciwko mnie zgromadzenie, aby zmiażdżyć mojego młodzieńca. PAN podeptał w tłoczni dziewicę, córkę Judy."
"Lm1,16": "‫ע‬ Z tego powodu ja płaczę; z moich oczu, z moich oczu spływa woda, gdyż daleko jest ode mnie pocieszyciel, który by odnowił moją duszę; moi synowie zostali wytraceni, bo wróg zwyciężył."
"Lm1,17": "‫פ‬ Syjon wyciąga swoje ręce – nie ma dla niego pocieszyciela. JHWH rozkazał, by jego nieprzyjaciele otoczyli Jakuba. Jerozolima stała się pośród nich jak nieczysta."
"Lm1,18": "‫צ‬ JHWH – On jest sprawiedliwy, bo zbuntowałam się przeciwko Jego ustom. Słuchajcie, proszę, wszystkie ludy, i zobaczcie mój ból. Moje dziewice i moi młodzieńcy poszli do niewoli."
"Lm1,19": "‫ק‬ Wołałam do moich kochanków – oni mnie zdradzili! Moi kapłani i starsi zginęli w mieście, gdy szukali jedzenia dla siebie, aby posilić swoją duszę."
"Lm1,20": "‫ר‬ Spójrz, JHWH, bo jestem utrapiona, moje wnętrze ogarnia wrzenie, moje serce przewraca się we mnie, bo uparcie się buntowałam. Na zewnątrz osieroca miecz – w domu jest jak śmierć."
"Lm1,21": "‫ש‬ Słyszeli, że ja jęczę – nie ma dla mnie pocieszyciela; wszyscy moi wrogowie słyszeli o moim nieszczęściu, cieszyli się, że Ty to uczyniłeś. Sprowadziłeś dzień, który ogłosiłeś, więc niech im się stanie jak mnie!"
"Lm1,22": "‫ת‬ Niech cała ich niegodziwość przyjdzie przed Ciebie; i uczyń z nimi tak, jak ze mną uczyniłeś za wszystkie moje przestępstwa. Tak! Liczne są moje westchnienia, a moje serce jest słabe."
