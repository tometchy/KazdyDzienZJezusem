"J11,1":
  text: "A był pewien chory, Łazarz z Betanii, z miasteczka Marii i Marty, jej siostry."
  tags: []
"J11,2":
  text: "A była to ta Maria, która namaściła Pana pachnącym olejkiem i wytarła Jego stopy swoimi włosami; jej to brat Łazarz chorował."
  tags: []
"J11,3":
  text: "Posłały więc siostry do Niego wiadomość: Panie! Oto ten, którego miłujesz, jest chory."
  tags: []
"J11,4":
  text: "A gdy Jezus usłyszał to, powiedział: Ta choroba nie jest na śmierć, ale dla chwały Bożej, aby Syn Boży przez nią doznał chwały."
  tags: []
"J11,5":
  text: "A Jezus miłował Martę i jej siostrę, i Łazarza."
  tags: []
"J11,6":
  text: "A gdy usłyszał, że jest chory, wtedy jeszcze został przez dwa dni na tym miejscu, gdzie był."
  tags: []
"J11,7":
  text: "Dopiero potem powiedział do swoich uczniów: Chodźmy znów do Judei."
  tags: []
"J11,8":
  text: "Uczniowie powiedzieli do Niego: Rabbi! Dopiero co Judejczycy usiłowali Cię ukamienować, a Ty ponownie tam idziesz?"
  tags: []
"J11,9":
  text: "Jezus odpowiedział: Czy dzień nie składa się z dwunastu godzin? Jeśli ktoś chodzi za dnia, nie potyka się, bo widzi światłość tego świata."
  tags: []
"J11,10":
  text: "A jeśli ktoś chodzi w nocy, potyka się; bo nie ma w nim światłości."
  tags: []
"J11,11":
  text: "To im powiedział, a potem rzekł do nich: Łazarz, przyjaciel nasz, zasnął, ale idę go obudzić ze snu."
  tags: []
"J11,12":
  text: "Wtedy uczniowie Jego powiedzieli: Panie! Skoro śpi, wyzdrowieje."
  tags: []
"J11,13":
  text: "Ale Jezus mówił o jego śmierci, lecz oni mniemali, że mówi o odpoczynku przez sen."
  tags: []
"J11,14":
  text: "Jezus więc powiedział im wtedy wyraźnie: Łazarz umarł."
  tags: []
"J11,15":
  text: "I cieszę się ze względu na was, że tam nie byłem, abyście uwierzyli; ale teraz chodźmy do niego."
  tags: []
"J11,16":
  text: "Powiedział więc Tomasz, zwany Didymos, do współuczniów: Chodźmy i my, abyśmy razem z nim pomarli."
  tags: []
"J11,17":
  text: "Jezus więc przyszedł i znalazł go leżącego już cztery dni w grobowcu."
  tags: []
"J11,18":
  text: "A Betania była blisko Jerozolimy, około piętnaście stadiów."
  tags: []
"J11,19":
  text: "I przyszło wielu Żydów do Marty i Marii, aby je pocieszać po stracie ich brata."
  tags: []
"J11,20":
  text: "Wtedy Marta, gdy usłyszała, że idzie Jezus, wyszła Mu na spotkanie; ale Maria siedziała w domu."
  tags: []
"J11,21":
  text: "Marta więc powiedziała do Jezusa: Panie! Gdybyś tutaj był, mój brat by nie umarł."
  tags: []
"J11,22":
  text: "Ale i teraz wiem, że o cokolwiek prosiłbyś Boga, Bóg Ci to da."
  tags: []
"J11,23":
  text: "Jezus powiedział jej: Twój brat będzie wzbudzony z martwych."
  tags: []
"J11,24":
  text: "Marta powiedziała do Niego: Wiem, że będzie wzbudzony z martwych przy zmartwychwstaniu w dniu ostatecznym."
  tags: []
"J11,25":
  text: "Jezus powiedział jej: Ja jestem zmartwychwstanie i życie; kto wierzy we mnie, choćby i umarł, będzie żyć."
  tags: []
"J11,26":
  text: "A każdy, kto żyje i wierzy we mnie, nie umrze na wieki. Czy wierzysz w to?"
  tags: []
"J11,27":
  text: "Powiedziała Mu: Tak, Panie! Ja wierzę, że Ty jesteś Mesjaszem, Synem Bożym, który przychodzi na świat."
  tags: []
"J11,28":
  text: "A gdy to powiedziała, poszła i zawołała Marię, swoją siostrę, i powiedziała skrycie: Nauczyciel jest tutaj i woła ciebie."
  tags: []
"J11,29":
  text: "Ta, gdy tylko to usłyszała, wstała śpiesznie i poszła do Niego."
  tags: []
"J11,30":
  text: "A Jezus jeszcze nie przyszedł do miasteczka, ale był w tym miejscu, gdzie spotkała Go Marta."
  tags: []
"J11,31":
  text: "Żydzi więc, którzy byli z nią w domu i pocieszali ją, widząc, że Maria szybko wstała i wyszła, poszli za nią, mówiąc, że idzie do grobowca, aby tam płakać."
  tags: []
"J11,32":
  text: "Gdy więc Maria przyszła tam, gdzie był Jezus, widząc Go, upadła do Jego stóp i powiedziała do Niego: Panie! Gdybyś tutaj był, mój brat by nie umarł."
  tags: []
"J11,33":
  text: "Jezus więc, gdy ujrzał ją płaczącą i płaczących Żydów, którzy z nią przyszli, będąc wstrząśnięty i poruszony w duchu,"
  tags: []
"J11,34":
  text: "Powiedział: Gdzie go położyliście? Mówią Mu: Panie! Chodź i zobacz."
  tags: []
"J11,35":
  text: "I Jezus zapłakał."
  tags: []
"J11,36":
  text: "Żydzi powiedzieli więc: Patrzcie, jak go miłował."
  tags: []
"J11,37":
  text: "A niektórzy z nich mówili: Czy Ten, który otworzył oczy ślepemu, nie mógł uczynić, aby i ten nie umarł?"
  tags: []
"J11,38":
  text: "Jezus więc ponownie wstrząśnięty wewnątrz, przyszedł do grobowca; a była to grota, a kamień był położony na niej."
  tags: []
"J11,39":
  text: "Jezus powiedział: Usuńcie ten kamień. Marta, siostra umarłego, powiedziała do Niego: Panie! Już cuchnie, bo to jest czwarty dzień."
  tags: []
"J11,40":
  text: "Jezus powiedział jej: Czy nie powiedziałem ci, że jeśli uwierzysz, zobaczysz chwałę Bożą?"
  tags: []
"J11,41":
  text: "Usunęli więc kamień, gdzie umarły został położony. A Jezus wzniósł swoje oczy w górę i powiedział: Ojcze! Dziękuję Ci, że mnie wysłuchałeś."
  tags: []
"J11,42":
  text: "Ja wiedziałem, że mnie zawsze wysłuchujesz, ale to powiedziałem ze względu na tłum stojący wokół, aby uwierzyli, że Ty mnie posłałeś."
  tags: []
"J11,43":
  text: "A gdy to powiedział, zawołał potężnym głosem: Łazarzu! Chodź tu na zewnątrz!"
  tags: []
"J11,44":
  text: "I wyszedł ten, który umarł, mając stopy i ręce związane opaskami z płótna, a jego twarz była obwiązana chustą. Jezus powiedział im: Rozwiążcie go i pozwólcie mu iść."
  tags: []
"J11,45":
  text: "Wielu więc z Żydów, tych którzy przyszli do Marii, widząc co uczynił Jezus, uwierzyło w Niego."
  tags: []
"J11,46":
  text: "A niektórzy z nich odeszli do faryzeuszów i powiedzieli im, co uczynił Jezus."
  tags: []
"J11,47":
  text: "Zebrali więc arcykapłani i faryzeusze Sanhedryn, i mówili: Co uczynimy? Bo ten człowiek czyni wiele cudownych znaków."
  tags: []
"J11,48":
  text: "Jeśli Go tak zostawimy, wszyscy w Niego uwierzą. A wtedy przyjdą Rzymianie, zabiorą i to miejsce, i nasz naród."
  tags: []
"J11,49":
  text: "A jeden z nich, Kajfasz, który był arcykapłanem tego roku, powiedział im: Wy nic nie wiecie,"
  tags: []
"J11,50":
  text: "I nie myślicie, że lepiej jest dla nas, żeby jeden człowiek umarł za lud, a żeby cały ten naród nie zginął."
  tags: []
"J11,51":
  text: "Nie mówił tego jednak sam z siebie, ale będąc arcykapłanem tego roku, prorokował, że Jezus miał umrzeć za naród;"
  tags: []
"J11,52":
  text: "A nie jedynie za naród, ale aby i dzieci Boże, które są rozproszone, w jedno zgromadzić."
  tags: []
"J11,53":
  text: "Z tym zatem dniem naradzali się wspólnie, aby Go zabić."
  tags: []
"J11,54":
  text: "Jezus więc już nie chodził jawnie między Żydami, ale odszedł stamtąd do krainy, która jest blisko pustyni, do miasta, zwanego Efraim, i tam przebywał ze swoimi uczniami."
  tags: []
"J11,55":
  text: "A była blisko Pascha żydowska, i wielu z tej krainy szło do Jerozolimy przed Paschą, aby się oczyścić."
  tags: []
"J11,56":
  text: "Szukali więc Jezusa i mówili między sobą, stojąc w świątyni: Jak się wam zdaje? Że na pewno nie przyjdzie na święto?"
  tags: []
"J11,57":
  text: "A arcykapłani i faryzeusze wydali rozkazy: Jeśli ktoś się dowie, gdzie jest, aby doniósł, by mogli Go pojmać."
  tags: []
