"J11,1": "A był pewien chory, Łazarz z Betanii, z miasteczka Marii i Marty, jej siostry."
"J11,2": "A była to ta Maria, która namaściła Pana pachnącym olejkiem i wytarła Jego stopy swoimi włosami; jej to brat Łazarz chorował."
"J11,3": "Posłały więc siostry do Niego wiadomość: Panie! Oto ten, którego miłujesz, jest chory."
"J11,4": "A gdy Jezus usłyszał to, powiedział: Ta choroba nie jest na śmierć, ale dla chwały Bożej, aby Syn Boży przez nią doznał chwały."
"J11,5": "A Jezus miłował Martę i jej siostrę, i Łazarza."
"J11,6": "A gdy usłyszał, że jest chory, wtedy jeszcze został przez dwa dni na tym miejscu, gdzie był."
"J11,7": "Dopiero potem powiedział do swoich uczniów: Chodźmy znów do Judei."
"J11,8": "Uczniowie powiedzieli do Niego: Rabbi! Dopiero co Judejczycy usiłowali Cię ukamienować, a Ty ponownie tam idziesz?"
"J11,9": "Jezus odpowiedział: Czy dzień nie składa się z dwunastu godzin? Jeśli ktoś chodzi za dnia, nie potyka się, bo widzi światłość tego świata."
"J11,10": "A jeśli ktoś chodzi w nocy, potyka się; bo nie ma w nim światłości."
"J11,11": "To im powiedział, a potem rzekł do nich: Łazarz, przyjaciel nasz, zasnął, ale idę go obudzić ze snu."
"J11,12": "Wtedy uczniowie Jego powiedzieli: Panie! Skoro śpi, wyzdrowieje."
"J11,13": "Ale Jezus mówił o jego śmierci, lecz oni mniemali, że mówi o odpoczynku przez sen."
"J11,14": "Jezus więc powiedział im wtedy wyraźnie: Łazarz umarł."
"J11,15": "I cieszę się ze względu na was, że tam nie byłem, abyście uwierzyli; ale teraz chodźmy do niego."
"J11,16": "Powiedział więc Tomasz, zwany Didymos, do współuczniów: Chodźmy i my, abyśmy razem z nim pomarli."
"J11,17": "Jezus więc przyszedł i znalazł go leżącego już cztery dni w grobowcu."
"J11,18": "A Betania była blisko Jerozolimy, około piętnaście stadiów."
"J11,19": "I przyszło wielu Żydów do Marty i Marii, aby je pocieszać po stracie ich brata."
"J11,20": "Wtedy Marta, gdy usłyszała, że idzie Jezus, wyszła Mu na spotkanie; ale Maria siedziała w domu."
"J11,21": "Marta więc powiedziała do Jezusa: Panie! Gdybyś tutaj był, mój brat by nie umarł."
"J11,22": "Ale i teraz wiem, że o cokolwiek prosiłbyś Boga, Bóg Ci to da."
"J11,23": "Jezus powiedział jej: Twój brat będzie wzbudzony z martwych."
"J11,24": "Marta powiedziała do Niego: Wiem, że będzie wzbudzony z martwych przy zmartwychwstaniu w dniu ostatecznym."
"J11,25": "Jezus powiedział jej: Ja jestem zmartwychwstanie i życie; kto wierzy we mnie, choćby i umarł, będzie żyć."
"J11,26": "A każdy, kto żyje i wierzy we mnie, nie umrze na wieki. Czy wierzysz w to?"
"J11,27": "Powiedziała Mu: Tak, Panie! Ja wierzę, że Ty jesteś Mesjaszem, Synem Bożym, który przychodzi na świat."
"J11,28": "A gdy to powiedziała, poszła i zawołała Marię, swoją siostrę, i powiedziała skrycie: Nauczyciel jest tutaj i woła ciebie."
"J11,29": "Ta, gdy tylko to usłyszała, wstała śpiesznie i poszła do Niego."
"J11,30": "A Jezus jeszcze nie przyszedł do miasteczka, ale był w tym miejscu, gdzie spotkała Go Marta."
"J11,31": "Żydzi więc, którzy byli z nią w domu i pocieszali ją, widząc, że Maria szybko wstała i wyszła, poszli za nią, mówiąc, że idzie do grobowca, aby tam płakać."
"J11,32": "Gdy więc Maria przyszła tam, gdzie był Jezus, widząc Go, upadła do Jego stóp i powiedziała do Niego: Panie! Gdybyś tutaj był, mój brat by nie umarł."
"J11,33": "Jezus więc, gdy ujrzał ją płaczącą i płaczących Żydów, którzy z nią przyszli, będąc wstrząśnięty i poruszony w duchu,"
"J11,34": "Powiedział: Gdzie go położyliście? Mówią Mu: Panie! Chodź i zobacz."
"J11,35": "I Jezus zapłakał."
"J11,36": "Żydzi powiedzieli więc: Patrzcie, jak go miłował."
"J11,37": "A niektórzy z nich mówili: Czy Ten, który otworzył oczy ślepemu, nie mógł uczynić, aby i ten nie umarł?"
"J11,38": "Jezus więc ponownie wstrząśnięty wewnątrz, przyszedł do grobowca; a była to grota, a kamień był położony na niej."
"J11,39": "Jezus powiedział: Usuńcie ten kamień. Marta, siostra umarłego, powiedziała do Niego: Panie! Już cuchnie, bo to jest czwarty dzień."
"J11,40": "Jezus powiedział jej: Czy nie powiedziałem ci, że jeśli uwierzysz, zobaczysz chwałę Bożą?"
"J11,41": "Usunęli więc kamień, gdzie umarły został położony. A Jezus wzniósł swoje oczy w górę i powiedział: Ojcze! Dziękuję Ci, że mnie wysłuchałeś."
"J11,42": "Ja wiedziałem, że mnie zawsze wysłuchujesz, ale to powiedziałem ze względu na tłum stojący wokół, aby uwierzyli, że Ty mnie posłałeś."
"J11,43": "A gdy to powiedział, zawołał potężnym głosem: Łazarzu! Chodź tu na zewnątrz!"
"J11,44": "I wyszedł ten, który umarł, mając stopy i ręce związane opaskami z płótna, a jego twarz była obwiązana chustą. Jezus powiedział im: Rozwiążcie go i pozwólcie mu iść."
"J11,45": "Wielu więc z Żydów, tych którzy przyszli do Marii, widząc co uczynił Jezus, uwierzyło w Niego."
"J11,46": "A niektórzy z nich odeszli do faryzeuszów i powiedzieli im, co uczynił Jezus."
"J11,47": "Zebrali więc arcykapłani i faryzeusze Sanhedryn, i mówili: Co uczynimy? Bo ten człowiek czyni wiele cudownych znaków."
"J11,48": "Jeśli Go tak zostawimy, wszyscy w Niego uwierzą. A wtedy przyjdą Rzymianie, zabiorą i to miejsce, i nasz naród."
"J11,49": "A jeden z nich, Kajfasz, który był arcykapłanem tego roku, powiedział im: Wy nic nie wiecie,"
"J11,50": "I nie myślicie, że lepiej jest dla nas, żeby jeden człowiek umarł za lud, a żeby cały ten naród nie zginął."
"J11,51": "Nie mówił tego jednak sam z siebie, ale będąc arcykapłanem tego roku, prorokował, że Jezus miał umrzeć za naród;"
"J11,52": "A nie jedynie za naród, ale aby i dzieci Boże, które są rozproszone, w jedno zgromadzić."
"J11,53": "Z tym zatem dniem naradzali się wspólnie, aby Go zabić."
"J11,54": "Jezus więc już nie chodził jawnie między Żydami, ale odszedł stamtąd do krainy, która jest blisko pustyni, do miasta, zwanego Efraim, i tam przebywał ze swoimi uczniami."
"J11,55": "A była blisko Pascha żydowska, i wielu z tej krainy szło do Jerozolimy przed Paschą, aby się oczyścić."
"J11,56": "Szukali więc Jezusa i mówili między sobą, stojąc w świątyni: Jak się wam zdaje? Że na pewno nie przyjdzie na święto?"
"J11,57": "A arcykapłani i faryzeusze wydali rozkazy: Jeśli ktoś się dowie, gdzie jest, aby doniósł, by mogli Go pojmać."
