"J12,1": "Jezus więc na sześć dni przed Paschą przyszedł do Betanii, gdzie był Łazarz, który umarł, a którego On wzbudził z martwych."
"J12,2": "Tam przygotowali dla Niego wieczerzę, Marta im usługiwała, a Łazarz był jednym z tych, którzy z Nim spoczywali przy stole."
"J12,3": "A gdy Maria wzięła litrę płynnego olejku nardowego, bardzo drogiego, namaściła stopy Jezusa i otarła je swoimi włosami; i napełnił się dom wonnością olejku."
"J12,4": "Powiedział więc jeden z Jego uczniów, Judasz Iskariota, syn Szymona, który miał Go wydać:"
"J12,5": "Dlaczego ten olejek nie został sprzedany za trzysta denarów, i nie rozdano ich ubogim?"
"J12,6": "A to mówił nie dlatego, że troszczył się o ubogich, ale że był złodziejem, i miał sakiewkę, i cokolwiek włożono do niej, sprzeniewierzał."
"J12,7": "Jezus więc powiedział: Zostaw ją, gdyż na dzień mojego pogrzebu to zachowała."
"J12,8": "Ubogich bowiem zawsze macie u siebie, lecz mnie nie zawsze macie."
"J12,9": "Dowiedział się więc wielki tłum z Żydów, że tam jest i przyszli nie tylko z powodu Jezusa, ale aby zobaczyć Łazarza, którego wzbudził z martwych."
"J12,10": "A arcykapłani naradzali się, aby i zabić Łazarza."
"J12,11": "Gdyż wielu Żydów z jego powodu odchodziło i zaczęło wierzyć w Jezusa."
"J12,12": "Nazajutrz tłum wielki, który przybył na święto, słysząc, że Jezus idzie do Jerozolimy,"
"J12,13": "Wziął gałązki palmowe i wyszedł na Jego spotkanie, wołając: Hosanna! Błogosławiony, który przychodzi w imieniu PANA, Król Izraela!"
"J12,14": "A gdy Jezus znalazł osiołka, wsiadł na niego, tak jak jest napisane:"
"J12,15": "Nie bój się, córko Syjonu! Oto twój Król przychodzi siedzący na źrebięciu oślicy."
"J12,16": "A uczniowie Jego początkowo tego nie zrozumieli, ale gdy Jezus został otoczony chwałą, wtedy przypomnieli sobie, że to było o Nim napisane, i że to Mu uczynili."
"J12,17": "Świadczył więc lud, który był z Nim, że Łazarza wywołał z grobowca i wzbudził go z martwych."
"J12,18": "I dlatego lud wyszedł Mu na spotkanie, bo słyszał, że to On uczynił ten cudowny znak."
"J12,19": "Wtedy powiedzieli faryzeusze do siebie: Widzicie, że niczego nie zyskujecie; oto cały świat poszedł za Nim."
"J12,20": "A wśród tych, którzy przychodzili do Jerozolimy, aby oddać cześć w święto, byli pewni Grecy."
"J12,21": "Ci więc przyszli do Filipa z Betsaidy w Galilei i prosili go, mówiąc: Panie! Chcemy zobaczyć Jezusa."
"J12,22": "Poszedł Filip i powiedział Andrzejowi, a z kolei Andrzej i Filip powiedzieli Jezusowi."
"J12,23": "A Jezus w odpowiedzi, rzekł im: Nadeszła godzina, aby Syn Człowieczy został otoczony chwałą."
"J12,24": "Zaprawdę, zaprawdę mówię wam: Jeśliby ziarno pszeniczne, które wpadło do ziemi, nie obumarło, pozostaje pojedynczym ziarnem; lecz jeśliby obumarło, przyniesie obfity owoc."
"J12,25": "Kto miłuje swoje życie, utraci je, a kto nienawidzi swojego życia na tym świecie, dla wiecznego życia ustrzeże je."
"J12,26": "Jeśli ktoś chce mi służyć, niech idzie za mną; a gdzie ja jestem, tam będzie i mój sługa; a jeśli ktoś będzie mi służył, uczci go mój Ojciec."
"J12,27": "Teraz dusza moja jest zatrwożona; i co powiem? Ojcze! Uratuj mnie od tej godziny; przecież dlatego przyszedłem na tę godzinę."
"J12,28": "Ojcze! Otocz chwałą swoje imię. Na to dobiegł głos z nieba: I otoczyłem chwałą i ponownie otoczę je chwałą."
"J12,29": "Wtedy tłum, który stał i to słyszał, mówił: To był grzmot; inni mówili: Anioł przemówił do Niego."
"J12,30": "Jezus w odpowiedzi, rzekł im: Nie ze względu na mnie rozległ się ten głos, ale ze względu na was."
"J12,31": "Teraz odbywa się sąd nad tym światem, teraz przywódca tego świata zostanie wyrzucony na zewnątrz."
"J12,32": "A ja gdy będę podniesiony z ziemi, pociągnę wszystkich do siebie."
"J12,33": "A to powiedział zaznaczając, jaką śmiercią ma umrzeć."
"J12,34": "A tłum odpowiedział Mu: My wiemy ze słuchania Prawa, że Mesjasz trwa na wieki; jak więc Ty możesz mówić, że musi być podniesiony Syn Człowieczy? I kto to jest ten Syn Człowieczy?"
"J12,35": "Jezus więc powiedział im: Jeszcze na krótki czas światłość jest z wami; chodźcie, dopóki macie światłość, aby nie pochwyciła was ciemność; bo kto w ciemności chodzi, nie wie, dokąd idzie."
"J12,36": "Dopóki macie światłość, wierzcie w światłość, abyście się stali synami światła. Gdy Jezus to powiedział, odszedł i ukrył się przed nimi."
"J12,37": "A chociaż tak wiele cudownych znaków uczynił przed nimi, nie wierzyli w Niego;"
"J12,38": "Aby zostało wypełnione słowo, które wypowiedział prorok Izajasz: PANIE! Kto uwierzył naszej wieści, a komu zostało objawione ramię PANA?"
"J12,39": "Dlatego nie mogli wierzyć, bo ponownie powiedział Izajasz:"
"J12,40": "Zaczął zaślepiać ich oczy i zatwardzać ich serce, aby nie widzieli oczami, i nie zrozumieli sercem, i nie nawrócili się, a Ja żebym ich nie uzdrowił."
"J12,41": "To powiedział Izajasz, gdy zobaczył Jego chwałę i mówił o Nim."
"J12,42": "Niemniej jednak wielu z przywódców uwierzyło w Niego, ale ze względu na faryzeuszów nie przyznawali się do tego, aby nie zostali wyłączeni z synagogi."
"J12,43": "Umiłowali bowiem chwałę ludzką bardziej niż chwałę Bożą."
"J12,44": "Jezus natomiast głośno zawołał i powiedział: Kto wierzy we mnie, nie we mnie wierzy, ale w Tego, który mnie posłał!"
"J12,45": "A kto mnie widzi, widzi Tego, który mnie posłał."
"J12,46": "Ja – światłość, przyszedłem na świat, aby nikt, kto wierzy we mnie, nie pozostał w ciemności."
"J12,47": "A jeśliby ktoś słuchał moich słów, a nie uwierzy, ja go nie będę sądził; bo nie przyszedłem, aby sądzić świat, ale aby świat zbawić."
"J12,48": "Ten kto mnie odrzuca i nie przyjmuje moich słów, ma swojego sędziego – słowo, które ja mówiłem, ono osądzi go w dniu ostatecznym."
"J12,49": "Bo ja nie mówiłem sam z siebie, ale Ojciec, który mnie posłał, On mi dał przykazanie, które mam mówić, i które mam głosić;"
"J12,50": "I wiem, że przykazanie Jego jest życiem wiecznym. Więc to, co ja wam mówię, mówię tak, jak mi powiedział Ojciec."
