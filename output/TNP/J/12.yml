"J12,1":
  text: "Jezus więc na sześć dni przed Paschą przyszedł do Betanii, gdzie był Łazarz, który umarł, a którego On wzbudził z martwych."
  tags: []
"J12,2":
  text: "Tam przygotowali dla Niego wieczerzę, Marta im usługiwała, a Łazarz był jednym z tych, którzy z Nim spoczywali przy stole."
  tags: []
"J12,3":
  text: "A gdy Maria wzięła litrę płynnego olejku nardowego, bardzo drogiego, namaściła stopy Jezusa i otarła je swoimi włosami; i napełnił się dom wonnością olejku."
  tags: []
"J12,4":
  text: "Powiedział więc jeden z Jego uczniów, Judasz Iskariota, syn Szymona, który miał Go wydać:"
  tags: []
"J12,5":
  text: "Dlaczego ten olejek nie został sprzedany za trzysta denarów, i nie rozdano ich ubogim?"
  tags: []
"J12,6":
  text: "A to mówił nie dlatego, że troszczył się o ubogich, ale że był złodziejem, i miał sakiewkę, i cokolwiek włożono do niej, sprzeniewierzał."
  tags: []
"J12,7":
  text: "Jezus więc powiedział: Zostaw ją, gdyż na dzień mojego pogrzebu to zachowała."
  tags: []
"J12,8":
  text: "Ubogich bowiem zawsze macie u siebie, lecz mnie nie zawsze macie."
  tags: []
"J12,9":
  text: "Dowiedział się więc wielki tłum z Żydów, że tam jest i przyszli nie tylko z powodu Jezusa, ale aby zobaczyć Łazarza, którego wzbudził z martwych."
  tags: []
"J12,10":
  text: "A arcykapłani naradzali się, aby i zabić Łazarza."
  tags: []
"J12,11":
  text: "Gdyż wielu Żydów z jego powodu odchodziło i zaczęło wierzyć w Jezusa."
  tags: []
"J12,12":
  text: "Nazajutrz tłum wielki, który przybył na święto, słysząc, że Jezus idzie do Jerozolimy,"
  tags: []
"J12,13":
  text: "Wziął gałązki palmowe i wyszedł na Jego spotkanie, wołając: Hosanna! Błogosławiony, który przychodzi w imieniu PANA, Król Izraela!"
  tags: []
"J12,14":
  text: "A gdy Jezus znalazł osiołka, wsiadł na niego, tak jak jest napisane:"
  tags: []
"J12,15":
  text: "Nie bój się, córko Syjonu! Oto twój Król przychodzi siedzący na źrebięciu oślicy."
  tags: []
"J12,16":
  text: "A uczniowie Jego początkowo tego nie zrozumieli, ale gdy Jezus został otoczony chwałą, wtedy przypomnieli sobie, że to było o Nim napisane, i że to Mu uczynili."
  tags: []
"J12,17":
  text: "Świadczył więc lud, który był z Nim, że Łazarza wywołał z grobowca i wzbudził go z martwych."
  tags: []
"J12,18":
  text: "I dlatego lud wyszedł Mu na spotkanie, bo słyszał, że to On uczynił ten cudowny znak."
  tags: []
"J12,19":
  text: "Wtedy powiedzieli faryzeusze do siebie: Widzicie, że niczego nie zyskujecie; oto cały świat poszedł za Nim."
  tags: []
"J12,20":
  text: "A wśród tych, którzy przychodzili do Jerozolimy, aby oddać cześć w święto, byli pewni Grecy."
  tags: []
"J12,21":
  text: "Ci więc przyszli do Filipa z Betsaidy w Galilei i prosili go, mówiąc: Panie! Chcemy zobaczyć Jezusa."
  tags: []
"J12,22":
  text: "Poszedł Filip i powiedział Andrzejowi, a z kolei Andrzej i Filip powiedzieli Jezusowi."
  tags: []
"J12,23":
  text: "A Jezus w odpowiedzi, rzekł im: Nadeszła godzina, aby Syn Człowieczy został otoczony chwałą."
  tags: []
"J12,24":
  text: "Zaprawdę, zaprawdę mówię wam: Jeśliby ziarno pszeniczne, które wpadło do ziemi, nie obumarło, pozostaje pojedynczym ziarnem; lecz jeśliby obumarło, przyniesie obfity owoc."
  tags: []
"J12,25":
  text: "Kto miłuje swoje życie, utraci je, a kto nienawidzi swojego życia na tym świecie, dla wiecznego życia ustrzeże je."
  tags: []
"J12,26":
  text: "Jeśli ktoś chce mi służyć, niech idzie za mną; a gdzie ja jestem, tam będzie i mój sługa; a jeśli ktoś będzie mi służył, uczci go mój Ojciec."
  tags: []
"J12,27":
  text: "Teraz dusza moja jest zatrwożona; i co powiem? Ojcze! Uratuj mnie od tej godziny; przecież dlatego przyszedłem na tę godzinę."
  tags: []
"J12,28":
  text: "Ojcze! Otocz chwałą swoje imię. Na to dobiegł głos z nieba: I otoczyłem chwałą i ponownie otoczę je chwałą."
  tags: []
"J12,29":
  text: "Wtedy tłum, który stał i to słyszał, mówił: To był grzmot; inni mówili: Anioł przemówił do Niego."
  tags: []
"J12,30":
  text: "Jezus w odpowiedzi, rzekł im: Nie ze względu na mnie rozległ się ten głos, ale ze względu na was."
  tags: []
"J12,31":
  text: "Teraz odbywa się sąd nad tym światem, teraz przywódca tego świata zostanie wyrzucony na zewnątrz."
  tags: []
"J12,32":
  text: "A ja gdy będę podniesiony z ziemi, pociągnę wszystkich do siebie."
  tags: []
"J12,33":
  text: "A to powiedział zaznaczając, jaką śmiercią ma umrzeć."
  tags: []
"J12,34":
  text: "A tłum odpowiedział Mu: My wiemy ze słuchania Prawa, że Mesjasz trwa na wieki; jak więc Ty możesz mówić, że musi być podniesiony Syn Człowieczy? I kto to jest ten Syn Człowieczy?"
  tags: []
"J12,35":
  text: "Jezus więc powiedział im: Jeszcze na krótki czas światłość jest z wami; chodźcie, dopóki macie światłość, aby nie pochwyciła was ciemność; bo kto w ciemności chodzi, nie wie, dokąd idzie."
  tags: []
"J12,36":
  text: "Dopóki macie światłość, wierzcie w światłość, abyście się stali synami światła. Gdy Jezus to powiedział, odszedł i ukrył się przed nimi."
  tags: []
"J12,37":
  text: "A chociaż tak wiele cudownych znaków uczynił przed nimi, nie wierzyli w Niego;"
  tags: []
"J12,38":
  text: "Aby zostało wypełnione słowo, które wypowiedział prorok Izajasz: PANIE! Kto uwierzył naszej wieści, a komu zostało objawione ramię PANA?"
  tags: []
"J12,39":
  text: "Dlatego nie mogli wierzyć, bo ponownie powiedział Izajasz:"
  tags: []
"J12,40":
  text: "Zaczął zaślepiać ich oczy i zatwardzać ich serce, aby nie widzieli oczami, i nie zrozumieli sercem, i nie nawrócili się, a Ja żebym ich nie uzdrowił."
  tags: []
"J12,41":
  text: "To powiedział Izajasz, gdy zobaczył Jego chwałę i mówił o Nim."
  tags: []
"J12,42":
  text: "Niemniej jednak wielu z przywódców uwierzyło w Niego, ale ze względu na faryzeuszów nie przyznawali się do tego, aby nie zostali wyłączeni z synagogi."
  tags: []
"J12,43":
  text: "Umiłowali bowiem chwałę ludzką bardziej niż chwałę Bożą."
  tags: []
"J12,44":
  text: "Jezus natomiast głośno zawołał i powiedział: Kto wierzy we mnie, nie we mnie wierzy, ale w Tego, który mnie posłał!"
  tags: []
"J12,45":
  text: "A kto mnie widzi, widzi Tego, który mnie posłał."
  tags: []
"J12,46":
  text: "Ja – światłość, przyszedłem na świat, aby nikt, kto wierzy we mnie, nie pozostał w ciemności."
  tags: []
"J12,47":
  text: "A jeśliby ktoś słuchał moich słów, a nie uwierzy, ja go nie będę sądził; bo nie przyszedłem, aby sądzić świat, ale aby świat zbawić."
  tags: []
"J12,48":
  text: "Ten kto mnie odrzuca i nie przyjmuje moich słów, ma swojego sędziego – słowo, które ja mówiłem, ono osądzi go w dniu ostatecznym."
  tags: []
"J12,49":
  text: "Bo ja nie mówiłem sam z siebie, ale Ojciec, który mnie posłał, On mi dał przykazanie, które mam mówić, i które mam głosić;"
  tags: []
"J12,50":
  text: "I wiem, że przykazanie Jego jest życiem wiecznym. Więc to, co ja wam mówię, mówię tak, jak mi powiedział Ojciec."
  tags: []
