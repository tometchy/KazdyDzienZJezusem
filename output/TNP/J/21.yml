"J21,1": "Potem znów ukazał się Jezus uczniom nad Morzem Tyberiadzkim, a ukazał się tak:"
"J21,2": "Byli razem Szymon Piotr i Tomasz, zwany Didymos, i Natanael, który był z Kany Galilejskiej, i synowie Zebedeusza, i dwaj inni z Jego uczniów."
"J21,3": "Szymon Piotr powiedział im: Idę łowić ryby. Mówią mu: I my pójdziemy z tobą. I wyszli, i zaraz wstąpili do łodzi, a tej nocy nic nie złowili."
"J21,4": "A gdy nastał wczesny ranek, stanął Jezus na brzegu; jednak nie wiedzieli uczniowie, że to jest Jezus."
"J21,5": "Jezus więc powiedział im: Dzieciątka! Nie macie czegoś do zjedzenia? Odpowiedzieli mu: Nie mamy."
"J21,6": "On natomiast powiedział im: Zarzućcie sieć po prawej stronie łodzi, a znajdziecie. Zarzucili więc i nie mieli siły, aby ją wciągnąć z powodu mnóstwa ryb."
"J21,7": "Ten uczeń, którego miłował Jezus, powiedział Piotrowi: To jest Pan. Wtedy Szymon Piotr, słysząc, że to jest Pan, przepasał się narzutą, był bowiem nagi, i rzucił się w morze."
"J21,8": "A inni uczniowie przybyli w łodzi, bo byli niedaleko od lądu, około dwieście łokci, ciągnąc sieć z rybami."
"J21,9": "Gdy więc wyszli na ląd, ujrzeli leżące rozpalone węgle i ułożoną rybę i chleb."
"J21,10": "Jezus powiedział im: Przynieście kilka ryb, które teraz złowiliście."
"J21,11": "Szymon Piotr wstąpił więc do łodzi i wyciągnął sieć na ląd, pełną wielkich ryb, których było sto pięćdziesiąt trzy; a choć było ich tak wiele, sieć się nie rozdarła."
"J21,12": "Jezus powiedział im: Chodźcie i zjedzcie posiłek. A żaden z uczniów nie śmiał Go pytać: Kim Ty jesteś? Wiedząc, że to jest Pan."
"J21,13": "Więc przyszedł Jezus, wziął chleb i dał im, podobnie i rybę."
"J21,14": "To już trzeci raz ukazał się Jezus swoim uczniom jako wzbudzony z martwych."
"J21,15": "Gdy więc spożyli posiłek, Jezus powiedział do Szymona Piotra: Szymonie, synu Jonasza, miłujesz mnie więcej niż ci? Powiedział Mu: Tak jest, Panie! Ty wiesz, że Ciebie kocham. Rzekł więc do niego: Paś moje jagnięta."
"J21,16": "Powiedział mu ponownie, po raz drugi: Szymonie, synu Jonasza, miłujesz mnie? Powiedział do Niego: Tak, Panie! Ty wiesz, że Cię kocham. Powiedział mu: Bądź pasterzem moich owiec."
"J21,17": "Powiedział mu po raz trzeci: Szymonie, synu Jonasza, kochasz mnie? Zasmucił się Piotr, że do niego po raz trzeci powiedział: Czy mnie kochasz? I odpowiedział Mu: Panie! Ty wiesz wszystko, Ty wiesz, że Ciebie kocham. Jezus powiedział mu: Paś moje owce."
"J21,18": "Zaprawdę, zaprawdę mówię ci: Gdy byłeś młodszy, sam się przepasywałeś i chodziłeś, gdzie chciałeś; lecz gdy się zestarzejesz, wyciągniesz swoje ręce, a inny cię opasze i poprowadzi, gdzie nie chcesz."
"J21,19": "A to powiedział, zaznaczając jaką śmiercią odda chwałę Bogu. A gdy to powiedział, rzekł mu: Chodź za mną."
"J21,20": "A Piotr, gdy się obrócił, ujrzał idącego ucznia, którego miłował Jezus, tego, który spoczął podczas wieczerzy przy Jego piersi i zapytał: Panie! Kim jest ten, co Ciebie wydaje?"
"J21,21": "A gdy ujrzał go Piotr, powiedział Jezusowi: Panie, a co z tym?"
"J21,22": "Jezus powiedział mu: A jeśli zechciałbym pozostawić go, aż przyjdę, co ci do tego? Ty chodź za mną!"
"J21,23": "Rozeszła się więc ta wieść między braćmi, że ten uczeń nie umrze. Ale Jezus nie powiedział mu, że nie umrze, lecz: Jeśli zechciałbym go pozostawić, aż przyjdę, co ci do tego?"
"J21,24": "A to jest uczeń, który świadczy o tym, i który to napisał; a wiemy, że prawdziwe jest jego świadectwo."
"J21,25": "Jest jeszcze wiele innych licznych rzeczy, które uczynił Jezus, które gdyby miały zostać spisane jedne po drugich, to sądzę, że i cały świat nie zmieściłby zwojów spisanych o tym. Amen."
