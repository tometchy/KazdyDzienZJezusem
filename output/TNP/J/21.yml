"J21,1":
  text: "Potem znów ukazał się Jezus uczniom nad Morzem Tyberiadzkim, a ukazał się tak:"
  tags: []
"J21,2":
  text: "Byli razem Szymon Piotr i Tomasz, zwany Didymos, i Natanael, który był z Kany Galilejskiej, i synowie Zebedeusza, i dwaj inni z Jego uczniów."
  tags: []
"J21,3":
  text: "Szymon Piotr powiedział im: Idę łowić ryby. Mówią mu: I my pójdziemy z tobą. I wyszli, i zaraz wstąpili do łodzi, a tej nocy nic nie złowili."
  tags: []
"J21,4":
  text: "A gdy nastał wczesny ranek, stanął Jezus na brzegu; jednak nie wiedzieli uczniowie, że to jest Jezus."
  tags: []
"J21,5":
  text: "Jezus więc powiedział im: Dzieciątka! Nie macie czegoś do zjedzenia? Odpowiedzieli mu: Nie mamy."
  tags: []
"J21,6":
  text: "On natomiast powiedział im: Zarzućcie sieć po prawej stronie łodzi, a znajdziecie. Zarzucili więc i nie mieli siły, aby ją wciągnąć z powodu mnóstwa ryb."
  tags: []
"J21,7":
  text: "Ten uczeń, którego miłował Jezus, powiedział Piotrowi: To jest Pan. Wtedy Szymon Piotr, słysząc, że to jest Pan, przepasał się narzutą, był bowiem nagi, i rzucił się w morze."
  tags: []
"J21,8":
  text: "A inni uczniowie przybyli w łodzi, bo byli niedaleko od lądu, około dwieście łokci, ciągnąc sieć z rybami."
  tags: []
"J21,9":
  text: "Gdy więc wyszli na ląd, ujrzeli leżące rozpalone węgle i ułożoną rybę i chleb."
  tags: []
"J21,10":
  text: "Jezus powiedział im: Przynieście kilka ryb, które teraz złowiliście."
  tags: []
"J21,11":
  text: "Szymon Piotr wstąpił więc do łodzi i wyciągnął sieć na ląd, pełną wielkich ryb, których było sto pięćdziesiąt trzy; a choć było ich tak wiele, sieć się nie rozdarła."
  tags: []
"J21,12":
  text: "Jezus powiedział im: Chodźcie i zjedzcie posiłek. A żaden z uczniów nie śmiał Go pytać: Kim Ty jesteś? Wiedząc, że to jest Pan."
  tags: []
"J21,13":
  text: "Więc przyszedł Jezus, wziął chleb i dał im, podobnie i rybę."
  tags: []
"J21,14":
  text: "To już trzeci raz ukazał się Jezus swoim uczniom jako wzbudzony z martwych."
  tags: []
"J21,15":
  text: "Gdy więc spożyli posiłek, Jezus powiedział do Szymona Piotra: Szymonie, synu Jonasza, miłujesz mnie więcej niż ci? Powiedział Mu: Tak jest, Panie! Ty wiesz, że Ciebie kocham. Rzekł więc do niego: Paś moje jagnięta."
  tags: []
"J21,16":
  text: "Powiedział mu ponownie, po raz drugi: Szymonie, synu Jonasza, miłujesz mnie? Powiedział do Niego: Tak, Panie! Ty wiesz, że Cię kocham. Powiedział mu: Bądź pasterzem moich owiec."
  tags: []
"J21,17":
  text: "Powiedział mu po raz trzeci: Szymonie, synu Jonasza, kochasz mnie? Zasmucił się Piotr, że do niego po raz trzeci powiedział: Czy mnie kochasz? I odpowiedział Mu: Panie! Ty wiesz wszystko, Ty wiesz, że Ciebie kocham. Jezus powiedział mu: Paś moje owce."
  tags: []
"J21,18":
  text: "Zaprawdę, zaprawdę mówię ci: Gdy byłeś młodszy, sam się przepasywałeś i chodziłeś, gdzie chciałeś; lecz gdy się zestarzejesz, wyciągniesz swoje ręce, a inny cię opasze i poprowadzi, gdzie nie chcesz."
  tags: []
"J21,19":
  text: "A to powiedział, zaznaczając jaką śmiercią odda chwałę Bogu. A gdy to powiedział, rzekł mu: Chodź za mną."
  tags: []
"J21,20":
  text: "A Piotr, gdy się obrócił, ujrzał idącego ucznia, którego miłował Jezus, tego, który spoczął podczas wieczerzy przy Jego piersi i zapytał: Panie! Kim jest ten, co Ciebie wydaje?"
  tags: []
"J21,21":
  text: "A gdy ujrzał go Piotr, powiedział Jezusowi: Panie, a co z tym?"
  tags: []
"J21,22":
  text: "Jezus powiedział mu: A jeśli zechciałbym pozostawić go, aż przyjdę, co ci do tego? Ty chodź za mną!"
  tags: []
"J21,23":
  text: "Rozeszła się więc ta wieść między braćmi, że ten uczeń nie umrze. Ale Jezus nie powiedział mu, że nie umrze, lecz: Jeśli zechciałbym go pozostawić, aż przyjdę, co ci do tego?"
  tags: []
"J21,24":
  text: "A to jest uczeń, który świadczy o tym, i który to napisał; a wiemy, że prawdziwe jest jego świadectwo."
  tags: []
"J21,25":
  text: "Jest jeszcze wiele innych licznych rzeczy, które uczynił Jezus, które gdyby miały zostać spisane jedne po drugich, to sądzę, że i cały świat nie zmieściłby zwojów spisanych o tym. Amen."
  tags: []
