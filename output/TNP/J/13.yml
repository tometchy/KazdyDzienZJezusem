"J13,1":
  text: "A przed świętem Paschy, Jezus wiedząc, że przychodzi Jego godzina, aby przeszedł z tego świata do Ojca, ponieważ umiłował swoich, którzy byli na świecie, aż do końca ich umiłował."
  tags: []
"J13,2":
  text: "A w czasie wieczerzy, gdy diabeł zasiał już w serce Judasza, syna Szymona Iskarioty, aby Go wydać,"
  tags: []
"J13,3":
  text: "Jezus wiedząc, że Ojciec wszystko przekazuje w Jego ręce, i że od Boga wyszedł i odchodzi do Boga,"
  tags: []
"J13,4":
  text: "Wstał od wieczerzy, złożył swoje szaty i gdy wziął płócienny ręcznik, przepasał się nim."
  tags: []
"J13,5":
  text: "Potem nalał wody do misy i zaczął myć stopy uczniom, i wycierać ręcznikiem, którym był przepasany."
  tags: []
"J13,6":
  text: "Podszedł również do Szymona Piotra; a on mówi do Niego: Panie! Ty myjesz mi stopy?"
  tags: []
"J13,7":
  text: "Jezus w odpowiedzi, rzekł mu: Co ja czynię, ty teraz nie wiesz, ale potem to pojmiesz."
  tags: []
"J13,8":
  text: "Piotr powiedział do Niego: Nie! Za nic w świecie nie będziesz mył mych stóp. Odpowiedział mu Jezus: Jeśli cię nie umyję, nie masz działu ze mną."
  tags: []
"J13,9":
  text: "Szymon Piotr powiedział do Niego: Panie! Nie tylko moje stopy, ale i ręce, i głowę."
  tags: []
"J13,10":
  text: "Jezus odpowiedział mu: Kto jest umyty, nie potrzebuje się myć, chyba tylko stopy, bo czysty jest cały; i wy jesteście czyści, ale nie wszyscy."
  tags: []
"J13,11":
  text: "Wiedział bowiem, kto Go wyda; dlatego powiedział: Nie wszyscy jesteście czyści."
  tags: []
"J13,12":
  text: "Gdy więc umył ich stopy, wziął swoje szaty, spoczął przy stole i ponownie im powiedział: Rozumiecie, co wam uczyniłem?"
  tags: []
"J13,13":
  text: "Wy zwracacie się do mnie: Nauczycielu i Panie; i dobrze mówicie, bo jestem Nim."
  tags: []
"J13,14":
  text: "Jeżeli więc ja, Pan i Nauczyciel, umyłem wam stopy, i wy powinniście jedni drugim umywać stopy."
  tags: []
"J13,15":
  text: "Albowiem dałem wam przykład, abyście jak ja wam uczyniłem i wy czynili."
  tags: []
"J13,16":
  text: "Zaprawdę, zaprawdę mówię wam: Nie jest sługa większy od swojego pana, ani poseł nie jest większy od tego, który go posłał."
  tags: []
"J13,17":
  text: "Skoro to wiecie, błogosławieni jesteście, jeśli będziecie to czynić."
  tags: []
"J13,18":
  text: "Nie o was wszystkich mówię, ja wiem, których wybrałem; lecz niech wypełni się Pismo: Ten, który je ze mną chleb, podniósł przeciwko mnie swoją piętę."
  tags: []
"J13,19":
  text: "Mówię to wam już teraz, zanim się to stanie, abyście, gdy się to stanie, uwierzyli, że ja jestem."
  tags: []
"J13,20":
  text: "Zaprawdę, zaprawdę mówię wam: Jeśli ktoś przyjmuje tego, kogo poślę, mnie przyjmuje; a kto mnie przyjmuje, przyjmuje Tego, który mnie posłał."
  tags: []
"J13,21":
  text: "Gdy Jezus to powiedział, wzruszył się w duchu i zaświadczył, mówiąc: Zaprawdę, zaprawdę mówię wam, że jeden z was mnie wyda."
  tags: []
"J13,22":
  text: "Patrzyli więc uczniowie na siebie, będąc niepewni, o kim mówi."
  tags: []
"J13,23":
  text: "A był tam jeden z uczniów, którego Jezus miłował, ten spoczywał przy piersi Jezusa;"
  tags: []
"J13,24":
  text: "Skinął więc na niego Szymon Piotr, aby spytał się, kim jest ten, o którym mówi."
  tags: []
"J13,25":
  text: "A on, kładąc się przy piersi Jezusa, powiedział do Niego: Panie! Kto to jest?"
  tags: []
"J13,26":
  text: "Jezus odpowiedział: To jest ten, któremu ja podam umoczony kawałek chleba; i umoczył kawałek, i dał Judaszowi Iskariocie, synowi Szymona."
  tags: []
"J13,27":
  text: "A zaraz po podaniu tego kawałka wszedł w niego szatan. Jezus wtedy powiedział mu: To co zamierzasz czynić, czyń prędzej."
  tags: []
"J13,28":
  text: "A nikt ze spoczywających przy stole nie zrozumiał tego, dlaczego to mu powiedział."
  tags: []
"J13,29":
  text: "Niektórym bowiem wydawało się, że skoro Judasz miał sakiewkę, to Jezus mu powiedział: Zakup, to co nam potrzebne na święto, albo żeby coś dał ubogim."
  tags: []
"J13,30":
  text: "On więc, gdy wziął kawałek chleba, zaraz wyszedł; a była noc."
  tags: []
"J13,31":
  text: "A gdy wyszedł, Jezus powiedział: Teraz Syn Człowieczy został otoczony chwałą, i Bóg został otoczony chwałą w Nim."
  tags: []
"J13,32":
  text: "Jeśli Bóg w Nim został otoczony chwałą, to i Bóg otoczy Go chwałą w sobie, i to zaraz otoczy Go chwałą."
  tags: []
"J13,33":
  text: "Dzieciątka! Jeszcze krótko jestem z wami. Szukać mnie będziecie, a jak powiedziałem Żydom: Dokąd ja odchodzę, wy tam nie możecie przyjść; i to wam mówię teraz."
  tags: []
"J13,34":
  text: "Nowe przykazanie daję wam, abyście się wzajemnie miłowali; jak ja was umiłowałem; i wy miłujcie się wzajemnie."
  tags: []
"J13,35":
  text: "Po tym wszyscy poznają, że jesteście moimi uczniami, jeśli będziecie mieć między sobą wzajemną miłość."
  tags: []
"J13,36":
  text: "Szymon Piotr powiedział do Niego: Panie! Dokąd idziesz? Jezus odpowiedział mu: Tam dokąd odchodzę, ty teraz za mną iść nie możesz, ale potem pójdziesz."
  tags: []
"J13,37":
  text: "Piotr powiedział do Niego: Panie! Dlaczego teraz nie mogę iść za Tobą? Życie swoje położę za Ciebie."
  tags: []
"J13,38":
  text: "Jezus odpowiedział mu: Życie swoje za mnie położysz? Zaprawdę, zaprawdę mówię ci: Zanim zapieje kogut, trzykrotnie się mnie wyprzesz."
  tags: []
