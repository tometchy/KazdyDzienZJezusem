"J13,1": "A przed świętem Paschy, Jezus wiedząc, że przychodzi Jego godzina, aby przeszedł z tego świata do Ojca, ponieważ umiłował swoich, którzy byli na świecie, aż do końca ich umiłował."
"J13,2": "A w czasie wieczerzy, gdy diabeł zasiał już w serce Judasza, syna Szymona Iskarioty, aby Go wydać,"
"J13,3": "Jezus wiedząc, że Ojciec wszystko przekazuje w Jego ręce, i że od Boga wyszedł i odchodzi do Boga,"
"J13,4": "Wstał od wieczerzy, złożył swoje szaty i gdy wziął płócienny ręcznik, przepasał się nim."
"J13,5": "Potem nalał wody do misy i zaczął myć stopy uczniom, i wycierać ręcznikiem, którym był przepasany."
"J13,6": "Podszedł również do Szymona Piotra; a on mówi do Niego: Panie! Ty myjesz mi stopy?"
"J13,7": "Jezus w odpowiedzi, rzekł mu: Co ja czynię, ty teraz nie wiesz, ale potem to pojmiesz."
"J13,8": "Piotr powiedział do Niego: Nie! Za nic w świecie nie będziesz mył mych stóp. Odpowiedział mu Jezus: Jeśli cię nie umyję, nie masz działu ze mną."
"J13,9": "Szymon Piotr powiedział do Niego: Panie! Nie tylko moje stopy, ale i ręce, i głowę."
"J13,10": "Jezus odpowiedział mu: Kto jest umyty, nie potrzebuje się myć, chyba tylko stopy, bo czysty jest cały; i wy jesteście czyści, ale nie wszyscy."
"J13,11": "Wiedział bowiem, kto Go wyda; dlatego powiedział: Nie wszyscy jesteście czyści."
"J13,12": "Gdy więc umył ich stopy, wziął swoje szaty, spoczął przy stole i ponownie im powiedział: Rozumiecie, co wam uczyniłem?"
"J13,13": "Wy zwracacie się do mnie: Nauczycielu i Panie; i dobrze mówicie, bo jestem Nim."
"J13,14": "Jeżeli więc ja, Pan i Nauczyciel, umyłem wam stopy, i wy powinniście jedni drugim umywać stopy."
"J13,15": "Albowiem dałem wam przykład, abyście jak ja wam uczyniłem i wy czynili."
"J13,16": "Zaprawdę, zaprawdę mówię wam: Nie jest sługa większy od swojego pana, ani poseł nie jest większy od tego, który go posłał."
"J13,17": "Skoro to wiecie, błogosławieni jesteście, jeśli będziecie to czynić."
"J13,18": "Nie o was wszystkich mówię, ja wiem, których wybrałem; lecz niech wypełni się Pismo: Ten, który je ze mną chleb, podniósł przeciwko mnie swoją piętę."
"J13,19": "Mówię to wam już teraz, zanim się to stanie, abyście, gdy się to stanie, uwierzyli, że ja jestem."
"J13,20": "Zaprawdę, zaprawdę mówię wam: Jeśli ktoś przyjmuje tego, kogo poślę, mnie przyjmuje; a kto mnie przyjmuje, przyjmuje Tego, który mnie posłał."
"J13,21": "Gdy Jezus to powiedział, wzruszył się w duchu i zaświadczył, mówiąc: Zaprawdę, zaprawdę mówię wam, że jeden z was mnie wyda."
"J13,22": "Patrzyli więc uczniowie na siebie, będąc niepewni, o kim mówi."
"J13,23": "A był tam jeden z uczniów, którego Jezus miłował, ten spoczywał przy piersi Jezusa;"
"J13,24": "Skinął więc na niego Szymon Piotr, aby spytał się, kim jest ten, o którym mówi."
"J13,25": "A on, kładąc się przy piersi Jezusa, powiedział do Niego: Panie! Kto to jest?"
"J13,26": "Jezus odpowiedział: To jest ten, któremu ja podam umoczony kawałek chleba; i umoczył kawałek, i dał Judaszowi Iskariocie, synowi Szymona."
"J13,27": "A zaraz po podaniu tego kawałka wszedł w niego szatan. Jezus wtedy powiedział mu: To co zamierzasz czynić, czyń prędzej."
"J13,28": "A nikt ze spoczywających przy stole nie zrozumiał tego, dlaczego to mu powiedział."
"J13,29": "Niektórym bowiem wydawało się, że skoro Judasz miał sakiewkę, to Jezus mu powiedział: Zakup, to co nam potrzebne na święto, albo żeby coś dał ubogim."
"J13,30": "On więc, gdy wziął kawałek chleba, zaraz wyszedł; a była noc."
"J13,31": "A gdy wyszedł, Jezus powiedział: Teraz Syn Człowieczy został otoczony chwałą, i Bóg został otoczony chwałą w Nim."
"J13,32": "Jeśli Bóg w Nim został otoczony chwałą, to i Bóg otoczy Go chwałą w sobie, i to zaraz otoczy Go chwałą."
"J13,33": "Dzieciątka! Jeszcze krótko jestem z wami. Szukać mnie będziecie, a jak powiedziałem Żydom: Dokąd ja odchodzę, wy tam nie możecie przyjść; i to wam mówię teraz."
"J13,34": "Nowe przykazanie daję wam, abyście się wzajemnie miłowali; jak ja was umiłowałem; i wy miłujcie się wzajemnie."
"J13,35": "Po tym wszyscy poznają, że jesteście moimi uczniami, jeśli będziecie mieć między sobą wzajemną miłość."
"J13,36": "Szymon Piotr powiedział do Niego: Panie! Dokąd idziesz? Jezus odpowiedział mu: Tam dokąd odchodzę, ty teraz za mną iść nie możesz, ale potem pójdziesz."
"J13,37": "Piotr powiedział do Niego: Panie! Dlaczego teraz nie mogę iść za Tobą? Życie swoje położę za Ciebie."
"J13,38": "Jezus odpowiedział mu: Życie swoje za mnie położysz? Zaprawdę, zaprawdę mówię ci: Zanim zapieje kogut, trzykrotnie się mnie wyprzesz."
