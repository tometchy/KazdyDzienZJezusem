"J15,1": "Ja jestem prawdziwą winoroślą, a mój Ojciec jest winogrodnikiem."
"J15,2": "Każdą latorośl, która we mnie owocu nie przynosi, tę podnosi, a każdą, która przynosi owoc, tę oczyszcza, aby przynosiła obfitszy owoc."
"J15,3": "Wy już jesteście czyści, z powodu Słowa, które wam mówiłem."
"J15,4": "Trwajcie we mnie, a ja w was. Jak latorośl nie może przynieść owocu sama z siebie, jeśliby nie trwała w winorośli, tak i wy, jeśli we mnie trwać nie będziecie."
"J15,5": "Ja jestem winoroślą, a wy latoroślami. Kto trwa we mnie, a ja w nim, ten przynosi obfity owoc; bo beze mnie nic uczynić nie możecie."
"J15,6": "Jeśli ktoś nie trwałby we mnie, zostanie wyrzucony na zewnątrz jak latorośl, i usycha; takie zbiera się, wrzuca w ogień i płoną."
"J15,7": "Jeśli we mnie trwać będziecie i słowa moje w was trwać będą; cokolwiek byście chcieli, proście, a stanie się wam."
"J15,8": "W tym Ojciec mój dozna chwały, jeśli obfity owoc przyniesiecie i staniecie się moimi uczniami."
"J15,9": "Jak mnie umiłował Ojciec, tak i ja was umiłowałem; trwajcie w mojej miłości."
"J15,10": "Jeśli będziecie zachowywać moje przykazania, będziecie trwać w mojej miłości, jak i ja zachowałem przykazania Ojca mojego i trwam w Jego miłości."
"J15,11": "To wam powiedziałem, aby moja radość trwała w was, a radość wasza była pełna."
"J15,12": "To jest moje przykazanie, abyście siebie nawzajem miłowali, jak ja was umiłowałem."
"J15,13": "Nikt nie ma większej miłości nad tę, gdy ktoś życie swoje kładzie za swoich przyjaciół."
"J15,14": "Wy jesteście moimi przyjaciółmi, jeśli czynicie to wszystko, co ja wam przykazuję."
"J15,15": "Już dłużej nie nazywam was sługami, bo sługa nie wie, co czyni jego pan; lecz nazwałem was przyjaciółmi, bo wszystko, co usłyszałem od mojego Ojca, wam oznajmiłem."
"J15,16": "Nie wy mnie wybraliście, ale ja was wybrałem i przeznaczyłem, abyście szli i przynieśli owoc, i owoc wasz trwał, aby to, o cokolwiek byście prosili Ojca w moim imieniu, dał wam."
"J15,17": "To wam przykazuję, abyście się wzajemnie miłowali."
"J15,18": "Jeśli was świat nienawidzi, wiedzcie, że mnie wcześniej niż was zaczął nienawidzić."
"J15,19": "Gdybyście byli ze świata, świat miłowałby swoją własność; ponieważ jednak nie jesteście ze świata, lecz ja was wybrałem ze świata, dlatego świat was nienawidzi."
"J15,20": "Przypomnijcie sobie słowo, które ja wam powiedziałem: Nie jest sługa większy od swojego pana. Jeśli mnie prześladowali, i was będą prześladować; jeśli Słowo moje zachowali i wasze będą zachowywać."
"J15,21": "Ale to wszystko uczynią wam ze względu na moje imię, bo nie znają Tego, który mnie posłał."
"J15,22": "Gdybym nie przyszedł i nie mówił im, nie mieliby grzechu; lecz teraz nie mają wymówki dla swojego grzechu."
"J15,23": "Kto trwa w nienawiści do mnie, trwa też w nienawiści do mojego Ojca."
"J15,24": "Gdybym nie czynił między nimi dzieł, których nikt inny nie czynił, nie mieliby grzechu; teraz jednak widzieli, a mimo to nienawidzą i mnie, i mojego Ojca."
"J15,25": "Stało się to, aby zostało wypełnione słowo, które w ich Prawie jest napisane, że: Znienawidzili mnie bez powodu."
"J15,26": "A gdy przyjdzie Opiekun, którego ja wam poślę od Ojca, Duch Prawdy, który od Ojca wychodzi, Ten zaświadczy o mnie."
"J15,27": "Ale i wy także świadczycie; bo jesteście ze mną od początku."
