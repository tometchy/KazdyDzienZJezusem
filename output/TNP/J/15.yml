"J15,1":
  text: "Ja jestem prawdziwą winoroślą, a mój Ojciec jest winogrodnikiem."
  tags: []
"J15,2":
  text: "Każdą latorośl, która we mnie owocu nie przynosi, tę podnosi, a każdą, która przynosi owoc, tę oczyszcza, aby przynosiła obfitszy owoc."
  tags: []
"J15,3":
  text: "Wy już jesteście czyści, z powodu Słowa, które wam mówiłem."
  tags: []
"J15,4":
  text: "Trwajcie we mnie, a ja w was. Jak latorośl nie może przynieść owocu sama z siebie, jeśliby nie trwała w winorośli, tak i wy, jeśli we mnie trwać nie będziecie."
  tags: []
"J15,5":
  text: "Ja jestem winoroślą, a wy latoroślami. Kto trwa we mnie, a ja w nim, ten przynosi obfity owoc; bo beze mnie nic uczynić nie możecie."
  tags: []
"J15,6":
  text: "Jeśli ktoś nie trwałby we mnie, zostanie wyrzucony na zewnątrz jak latorośl, i usycha; takie zbiera się, wrzuca w ogień i płoną."
  tags: []
"J15,7":
  text: "Jeśli we mnie trwać będziecie i słowa moje w was trwać będą; cokolwiek byście chcieli, proście, a stanie się wam."
  tags: []
"J15,8":
  text: "W tym Ojciec mój dozna chwały, jeśli obfity owoc przyniesiecie i staniecie się moimi uczniami."
  tags: []
"J15,9":
  text: "Jak mnie umiłował Ojciec, tak i ja was umiłowałem; trwajcie w mojej miłości."
  tags: []
"J15,10":
  text: "Jeśli będziecie zachowywać moje przykazania, będziecie trwać w mojej miłości, jak i ja zachowałem przykazania Ojca mojego i trwam w Jego miłości."
  tags: []
"J15,11":
  text: "To wam powiedziałem, aby moja radość trwała w was, a radość wasza była pełna."
  tags: []
"J15,12":
  text: "To jest moje przykazanie, abyście siebie nawzajem miłowali, jak ja was umiłowałem."
  tags: []
"J15,13":
  text: "Nikt nie ma większej miłości nad tę, gdy ktoś życie swoje kładzie za swoich przyjaciół."
  tags: []
"J15,14":
  text: "Wy jesteście moimi przyjaciółmi, jeśli czynicie to wszystko, co ja wam przykazuję."
  tags: []
"J15,15":
  text: "Już dłużej nie nazywam was sługami, bo sługa nie wie, co czyni jego pan; lecz nazwałem was przyjaciółmi, bo wszystko, co usłyszałem od mojego Ojca, wam oznajmiłem."
  tags: []
"J15,16":
  text: "Nie wy mnie wybraliście, ale ja was wybrałem i przeznaczyłem, abyście szli i przynieśli owoc, i owoc wasz trwał, aby to, o cokolwiek byście prosili Ojca w moim imieniu, dał wam."
  tags: []
"J15,17":
  text: "To wam przykazuję, abyście się wzajemnie miłowali."
  tags: []
"J15,18":
  text: "Jeśli was świat nienawidzi, wiedzcie, że mnie wcześniej niż was zaczął nienawidzić."
  tags: []
"J15,19":
  text: "Gdybyście byli ze świata, świat miłowałby swoją własność; ponieważ jednak nie jesteście ze świata, lecz ja was wybrałem ze świata, dlatego świat was nienawidzi."
  tags: []
"J15,20":
  text: "Przypomnijcie sobie słowo, które ja wam powiedziałem: Nie jest sługa większy od swojego pana. Jeśli mnie prześladowali, i was będą prześladować; jeśli Słowo moje zachowali i wasze będą zachowywać."
  tags: []
"J15,21":
  text: "Ale to wszystko uczynią wam ze względu na moje imię, bo nie znają Tego, który mnie posłał."
  tags: []
"J15,22":
  text: "Gdybym nie przyszedł i nie mówił im, nie mieliby grzechu; lecz teraz nie mają wymówki dla swojego grzechu."
  tags: []
"J15,23":
  text: "Kto trwa w nienawiści do mnie, trwa też w nienawiści do mojego Ojca."
  tags: []
"J15,24":
  text: "Gdybym nie czynił między nimi dzieł, których nikt inny nie czynił, nie mieliby grzechu; teraz jednak widzieli, a mimo to nienawidzą i mnie, i mojego Ojca."
  tags: []
"J15,25":
  text: "Stało się to, aby zostało wypełnione słowo, które w ich Prawie jest napisane, że: Znienawidzili mnie bez powodu."
  tags: []
"J15,26":
  text: "A gdy przyjdzie Opiekun, którego ja wam poślę od Ojca, Duch Prawdy, który od Ojca wychodzi, Ten zaświadczy o mnie."
  tags: []
"J15,27":
  text: "Ale i wy także świadczycie; bo jesteście ze mną od początku."
  tags: []
