"J7,1": "I potem chodził Jezus po Galilei; bo nie chciał chodzić po Judei, dlatego że Żydzi usiłowali Go zabić."
"J7,2": "A było blisko święto żydowskie – Święto Namiotów."
"J7,3": "Powiedzieli więc do Niego Jego bracia: Odejdź stąd i idź do Judei, żeby i Twoi uczniowie zobaczyli dzieła, które Ty czynisz."
"J7,4": "Nikt bowiem nie czyni nic w ukryciu, lecz sam stara się być publicznie znany. Jeśli takie rzeczy czynisz, pokaż się światu."
"J7,5": "Bo nawet Jego bracia nie wierzyli w Niego."
"J7,6": "Jezus więc powiedział im: Mój czas jeszcze nie nadszedł; ale wasz czas zawsze jest odpowiedni."
"J7,7": "Świat nie może was nienawidzić, ale mnie nienawidzi, ponieważ ja świadczę o nim, że jego dzieła są złe."
"J7,8": "Wy idźcie na to święto, ja jeszcze nie idę na to święto, gdyż mój czas jeszcze się nie wypełnił."
"J7,9": "A gdy to im powiedział, sam pozostał w Galilei."
"J7,10": "A gdy poszli bracia Jego, wtedy i On poszedł na święto, nie jawnie, ale jakby w ukryciu."
"J7,11": "Żydzi tymczasem szukali Go w czasie święta i mówili: Gdzie On jest?"
"J7,12": "I wiele szeptano o Nim wśród tłumów. Jedni wprawdzie mówili, że jest dobry; inni natomiast mówili: Nie, bo zwodzi tłum."
"J7,13": "Nikt jednak otwarcie o Nim nie mówił, z obawy przed Żydami."
"J7,14": "A gdy już minęła połowa święta, wstąpił Jezus do świątyni i nauczał."
"J7,15": "I dziwili się Żydzi, mówiąc: Skąd On zna Pisma, skoro się nie uczył?"
"J7,16": "Jezus w odpowiedzi, rzekł im: Nauka moja nie jest moja, ale Tego, który mnie posłał."
"J7,17": "A jeśli ktoś chce czynić Jego wolę, ten pozna, czy ta nauka jest z Boga, czy ja sam od siebie mówię."
"J7,18": "Kto sam od siebie mówi, szuka własnej chwały; ale kto szuka chwały Tego, który go posłał, ten jest szczery i nie ma w nim niesprawiedliwości."
"J7,19": "Czy nie Mojżesz dał wam Prawo? A nikt z was nie czyni Prawa. Dlaczego usiłujecie mnie zabić?"
"J7,20": "W odpowiedzi, tłum rzekł: Masz demona; kto usiłuje Cię zabić?"
"J7,21": "Jezus w odpowiedzi, rzekł im: Jednego dzieła dokonałem i wszyscy się temu dziwicie!"
"J7,22": "Oto Mojżesz dał wam obrzezanie – chociaż nie było ono od Mojżesza, ale od ojców – i w szabat obrzezujecie człowieka."
"J7,23": "Jeżeli człowiek przyjmuje obrzezanie w szabat, aby nie było naruszone Prawo Mojżesza, dlaczego złościcie się na mnie, że całego człowieka uczyniłem zdrowym w szabat?"
"J7,24": "Nie sądźcie po pozorach, ale sprawiedliwym sądem osądźcie."
"J7,25": "Mówili więc niektórzy z mieszkańców Jerozolimy: Czy to nie jest Ten, którego usiłują zabić?"
"J7,26": "A oto On mówi otwarcie i nic Mu nie mówią. Czyżby rzeczywiście przywódcy poznali, że Ten jest prawdziwie Mesjaszem?"
"J7,27": "Ale o Nim wiemy, skąd jest; natomiast gdy przyjdzie Mesjasz, nikt nie będzie wiedział, skąd jest."
"J7,28": "Jezus więc wołał w świątyni, nauczając i głosząc: I mnie znacie, i wiecie, skąd jestem, a nie przyszedłem posłany przez samego siebie; lecz prawdziwy jest Ten, który mnie posłał, którego wy nie znacie!"
"J7,29": "A ja znam Go; ponieważ jestem od Niego i On mnie posłał."
"J7,30": "Usiłowali więc Go pojmać; lecz nikt nie podniósł na Niego ręki, bo jeszcze nie nadeszła Jego godzina."
"J7,31": "A wielu z ludzi uwierzyło w Niego i mówiło: Gdyby przyszedł Mesjasz, czy uczyniłby więcej cudownych znaków od tych, które Ten uczynił?"
"J7,32": "A gdy usłyszeli faryzeusze, że tłum tak o Nim szemrze, posłali faryzeusze i arcykapłani podwładnych, aby Go pojmać."
"J7,33": "Jezus więc powiedział im: Jeszcze na krótki czas jestem z wami, a potem odchodzę do Tego, który mnie posłał."
"J7,34": "Szukać mnie będziecie, a nie znajdziecie; a gdzie ja jestem, wy przyjść nie możecie."
"J7,35": "Powiedzieli więc Żydzi do siebie: Dokąd On zamierza iść, że my Go nie znajdziemy? Czy zamierza iść do greckiej diaspory i nauczać Greków?"
"J7,36": "Co to za słowa, które wypowiedział: Szukać mnie będziecie, a nie znajdziecie; i gdzie ja jestem, wy przyjść nie możecie?"
"J7,37": "A Jezus, w ostatnim wielkim dniu święta, stanął i głośno zawołał, głosząc: Jeśli ktoś pragnie, niech przychodzi do mnie i pije!"
"J7,38": "Kto wierzy we mnie, jak powiada Pismo, rzeki wody żywej popłyną z jego wnętrza."
"J7,39": "A to powiedział o Duchu, którego mieli otrzymać wierzący w Niego; bo Duch Święty nie był jeszcze dany, gdyż Jezus nie został jeszcze otoczony chwałą."
"J7,40": "Wtedy wielu spośród tłumu, słysząc to słowo, mówiło: On jest naprawdę tym Prorokiem."
"J7,41": "A inni mówili: To jest Mesjasz. Natomiast jeszcze inni mówili: Czy z Galilei przyjdzie Mesjasz?"
"J7,42": "Czy Pismo nie powiedziało, że z potomstwa Dawida i z Betlejem, miasteczka, gdzie był Dawid, przyjdzie Mesjasz?"
"J7,43": "Stał się więc rozłam między ludem z powodu Niego."
"J7,44": "A niektórzy z nich chcieli Go pojmać; ale nikt nie podniósł na Niego ręki."
"J7,45": "Przyszli więc podwładni do arcykapłanów i do faryzeuszów, a oni im powiedzieli: Dlaczego nie przyprowadziliście Go tutaj?"
"J7,46": "Odpowiedzieli podwładni: Żaden człowiek, nigdy tak nie przemawiał, jak Ten człowiek."
"J7,47": "I odpowiedzieli więc im faryzeusze: Czy i wy jesteście zwiedzeni?"
"J7,48": "Czy uwierzył w Niego ktoś z przywódców lub z faryzeuszów?"
"J7,49": "Tylko ten tłum, nieznający Prawa, jest przeklęty."
"J7,50": "I powiedział do nich Nikodem, ten który przyszedł do Niego w nocy, a był jednym z nich:"
"J7,51": "Czy nasze Prawo sądzi człowieka, jeżeli wcześniej nie usłyszy od niego wyjaśnień i nie pozna, co czyni?"
"J7,52": "W odpowiedzi, rzekli mu: Czy i ty jesteś z Galilei? Zbadaj to, a zobaczysz, że żaden prorok nie powstał z Galilei."
"J7,53": "I poszedł każdy do swojego domu."
