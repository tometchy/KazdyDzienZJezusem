"J7,1":
  text: "I potem chodził Jezus po Galilei; bo nie chciał chodzić po Judei, dlatego że Żydzi usiłowali Go zabić."
  tags: []
"J7,2":
  text: "A było blisko święto żydowskie – Święto Namiotów."
  tags: []
"J7,3":
  text: "Powiedzieli więc do Niego Jego bracia: Odejdź stąd i idź do Judei, żeby i Twoi uczniowie zobaczyli dzieła, które Ty czynisz."
  tags: []
"J7,4":
  text: "Nikt bowiem nie czyni nic w ukryciu, lecz sam stara się być publicznie znany. Jeśli takie rzeczy czynisz, pokaż się światu."
  tags: []
"J7,5":
  text: "Bo nawet Jego bracia nie wierzyli w Niego."
  tags: []
"J7,6":
  text: "Jezus więc powiedział im: Mój czas jeszcze nie nadszedł; ale wasz czas zawsze jest odpowiedni."
  tags: []
"J7,7":
  text: "Świat nie może was nienawidzić, ale mnie nienawidzi, ponieważ ja świadczę o nim, że jego dzieła są złe."
  tags: []
"J7,8":
  text: "Wy idźcie na to święto, ja jeszcze nie idę na to święto, gdyż mój czas jeszcze się nie wypełnił."
  tags: []
"J7,9":
  text: "A gdy to im powiedział, sam pozostał w Galilei."
  tags: []
"J7,10":
  text: "A gdy poszli bracia Jego, wtedy i On poszedł na święto, nie jawnie, ale jakby w ukryciu."
  tags: []
"J7,11":
  text: "Żydzi tymczasem szukali Go w czasie święta i mówili: Gdzie On jest?"
  tags: []
"J7,12":
  text: "I wiele szeptano o Nim wśród tłumów. Jedni wprawdzie mówili, że jest dobry; inni natomiast mówili: Nie, bo zwodzi tłum."
  tags: []
"J7,13":
  text: "Nikt jednak otwarcie o Nim nie mówił, z obawy przed Żydami."
  tags: []
"J7,14":
  text: "A gdy już minęła połowa święta, wstąpił Jezus do świątyni i nauczał."
  tags: []
"J7,15":
  text: "I dziwili się Żydzi, mówiąc: Skąd On zna Pisma, skoro się nie uczył?"
  tags: []
"J7,16":
  text: "Jezus w odpowiedzi, rzekł im: Nauka moja nie jest moja, ale Tego, który mnie posłał."
  tags: []
"J7,17":
  text: "A jeśli ktoś chce czynić Jego wolę, ten pozna, czy ta nauka jest z Boga, czy ja sam od siebie mówię."
  tags: []
"J7,18":
  text: "Kto sam od siebie mówi, szuka własnej chwały; ale kto szuka chwały Tego, który go posłał, ten jest szczery i nie ma w nim niesprawiedliwości."
  tags: []
"J7,19":
  text: "Czy nie Mojżesz dał wam Prawo? A nikt z was nie czyni Prawa. Dlaczego usiłujecie mnie zabić?"
  tags: []
"J7,20":
  text: "W odpowiedzi, tłum rzekł: Masz demona; kto usiłuje Cię zabić?"
  tags: []
"J7,21":
  text: "Jezus w odpowiedzi, rzekł im: Jednego dzieła dokonałem i wszyscy się temu dziwicie!"
  tags: []
"J7,22":
  text: "Oto Mojżesz dał wam obrzezanie – chociaż nie było ono od Mojżesza, ale od ojców – i w szabat obrzezujecie człowieka."
  tags: []
"J7,23":
  text: "Jeżeli człowiek przyjmuje obrzezanie w szabat, aby nie było naruszone Prawo Mojżesza, dlaczego złościcie się na mnie, że całego człowieka uczyniłem zdrowym w szabat?"
  tags: []
"J7,24":
  text: "Nie sądźcie po pozorach, ale sprawiedliwym sądem osądźcie."
  tags: []
"J7,25":
  text: "Mówili więc niektórzy z mieszkańców Jerozolimy: Czy to nie jest Ten, którego usiłują zabić?"
  tags: []
"J7,26":
  text: "A oto On mówi otwarcie i nic Mu nie mówią. Czyżby rzeczywiście przywódcy poznali, że Ten jest prawdziwie Mesjaszem?"
  tags: []
"J7,27":
  text: "Ale o Nim wiemy, skąd jest; natomiast gdy przyjdzie Mesjasz, nikt nie będzie wiedział, skąd jest."
  tags: []
"J7,28":
  text: "Jezus więc wołał w świątyni, nauczając i głosząc: I mnie znacie, i wiecie, skąd jestem, a nie przyszedłem posłany przez samego siebie; lecz prawdziwy jest Ten, który mnie posłał, którego wy nie znacie!"
  tags: []
"J7,29":
  text: "A ja znam Go; ponieważ jestem od Niego i On mnie posłał."
  tags: []
"J7,30":
  text: "Usiłowali więc Go pojmać; lecz nikt nie podniósł na Niego ręki, bo jeszcze nie nadeszła Jego godzina."
  tags: []
"J7,31":
  text: "A wielu z ludzi uwierzyło w Niego i mówiło: Gdyby przyszedł Mesjasz, czy uczyniłby więcej cudownych znaków od tych, które Ten uczynił?"
  tags: []
"J7,32":
  text: "A gdy usłyszeli faryzeusze, że tłum tak o Nim szemrze, posłali faryzeusze i arcykapłani podwładnych, aby Go pojmać."
  tags: []
"J7,33":
  text: "Jezus więc powiedział im: Jeszcze na krótki czas jestem z wami, a potem odchodzę do Tego, który mnie posłał."
  tags: []
"J7,34":
  text: "Szukać mnie będziecie, a nie znajdziecie; a gdzie ja jestem, wy przyjść nie możecie."
  tags: []
"J7,35":
  text: "Powiedzieli więc Żydzi do siebie: Dokąd On zamierza iść, że my Go nie znajdziemy? Czy zamierza iść do greckiej diaspory i nauczać Greków?"
  tags: []
"J7,36":
  text: "Co to za słowa, które wypowiedział: Szukać mnie będziecie, a nie znajdziecie; i gdzie ja jestem, wy przyjść nie możecie?"
  tags: []
"J7,37":
  text: "A Jezus, w ostatnim wielkim dniu święta, stanął i głośno zawołał, głosząc: Jeśli ktoś pragnie, niech przychodzi do mnie i pije!"
  tags: []
"J7,38":
  text: "Kto wierzy we mnie, jak powiada Pismo, rzeki wody żywej popłyną z jego wnętrza."
  tags: []
"J7,39":
  text: "A to powiedział o Duchu, którego mieli otrzymać wierzący w Niego; bo Duch Święty nie był jeszcze dany, gdyż Jezus nie został jeszcze otoczony chwałą."
  tags: []
"J7,40":
  text: "Wtedy wielu spośród tłumu, słysząc to słowo, mówiło: On jest naprawdę tym Prorokiem."
  tags: []
"J7,41":
  text: "A inni mówili: To jest Mesjasz. Natomiast jeszcze inni mówili: Czy z Galilei przyjdzie Mesjasz?"
  tags: []
"J7,42":
  text: "Czy Pismo nie powiedziało, że z potomstwa Dawida i z Betlejem, miasteczka, gdzie był Dawid, przyjdzie Mesjasz?"
  tags: []
"J7,43":
  text: "Stał się więc rozłam między ludem z powodu Niego."
  tags: []
"J7,44":
  text: "A niektórzy z nich chcieli Go pojmać; ale nikt nie podniósł na Niego ręki."
  tags: []
"J7,45":
  text: "Przyszli więc podwładni do arcykapłanów i do faryzeuszów, a oni im powiedzieli: Dlaczego nie przyprowadziliście Go tutaj?"
  tags: []
"J7,46":
  text: "Odpowiedzieli podwładni: Żaden człowiek, nigdy tak nie przemawiał, jak Ten człowiek."
  tags: []
"J7,47":
  text: "I odpowiedzieli więc im faryzeusze: Czy i wy jesteście zwiedzeni?"
  tags: []
"J7,48":
  text: "Czy uwierzył w Niego ktoś z przywódców lub z faryzeuszów?"
  tags: []
"J7,49":
  text: "Tylko ten tłum, nieznający Prawa, jest przeklęty."
  tags: []
"J7,50":
  text: "I powiedział do nich Nikodem, ten który przyszedł do Niego w nocy, a był jednym z nich:"
  tags: []
"J7,51":
  text: "Czy nasze Prawo sądzi człowieka, jeżeli wcześniej nie usłyszy od niego wyjaśnień i nie pozna, co czyni?"
  tags: []
"J7,52":
  text: "W odpowiedzi, rzekli mu: Czy i ty jesteś z Galilei? Zbadaj to, a zobaczysz, że żaden prorok nie powstał z Galilei."
  tags: []
"J7,53":
  text: "I poszedł każdy do swojego domu."
  tags: []
