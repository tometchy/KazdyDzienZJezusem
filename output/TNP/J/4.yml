"J4,1": "A gdy Pan dowiedział się, że faryzeusze usłyszeli, że Jezus więcej ludzi czyni uczniami i chrzci niż Jan,"
"J4,2": "Chociaż sam Jezus nie chrzcił, ale Jego uczniowie;"
"J4,3": "Opuścił Judeę i odszedł ponownie do Galilei."
"J4,4": "A musiał przechodzić przez Samarię."
"J4,5": "Przyszedł więc do miasta Samarii o nazwie Sychar, blisko pola, które dał Jakub Józefowi, swojemu synowi."
"J4,6": "A była tam studnia Jakuba. Jezus więc, będąc strudzony podróżą, usiadł tak przy studni; a było około szóstej godziny."
"J4,7": "Z Samarii przyszła kobieta zaczerpnąć wodę. Jezus powiedział jej: Daj mi pić!"
"J4,8": "Uczniowie Jego bowiem odeszli do miasta, aby kupić żywności."
"J4,9": "Kobieta z Samarii powiedziała więc do Niego: Jak Ty, będąc Żydem, prosisz mnie kobietę, Samarytankę, bym dała Ci pić? Bo Żydzi nie utrzymują stosunków z Samarytanami."
"J4,10": "Jezus w odpowiedzi, rzekł jej: Gdybyś znała dar Boga i kim jest Ten, który mówi do ciebie: Daj mi pić, to byś Go prosiła, a dałby ci wody żywej."
"J4,11": "Kobieta powiedziała do Niego: Panie! Nie masz nawet czerpaka, a studnia jest głęboka, skąd więc masz tę wodę żywą?"
"J4,12": "Czy Ty jesteś większy od naszego ojca Jakuba, który dał nam tę studnię i sam z niej pił, i jego synowie, i jego trzody?"
"J4,13": "Jezus w odpowiedzi, rzekł jej: Każdy, kto pije tę wodę, ponownie będzie pragnął;"
"J4,14": "Lecz kto będzie pił wodę, którą ja mu dam, nie będzie pragnął na wieki; ale woda, którą mu dam, stanie się w nim źródłem wody wytryskującej ku życiu wiecznemu."
"J4,15": "Kobieta powiedziała do Niego: Panie! Daj mi tej wody, abym nie pragnęła i nie przychodziła tutaj czerpać."
"J4,16": "Jezus powiedział jej: Idź, zawołaj swojego męża, i przyjdź tutaj."
"J4,17": "Kobieta w odpowiedzi, rzekła: Nie mam męża. Jezus powiedział jej: Dobrze powiedziałaś: Nie mam męża."
"J4,18": "Albowiem miałaś pięciu mężów, a ten, którego teraz masz, nie jest twoim mężem. Powiedziałaś prawdę."
"J4,19": "Kobieta powiedziała Mu: Panie! Widzę, że jesteś prorokiem."
"J4,20": "Ojcowie nasi oddawali cześć na tej górze, a wy mówicie, że w Jerozolimie jest miejsce, gdzie trzeba oddawać cześć."
"J4,21": "Jezus powiedział jej: Kobieto! Wierz mi, że przychodzi godzina, kiedy ani na tej górze, ani w Jerozolimie nie będziecie oddawali czci Ojcu."
"J4,22": "Wy czcicie to, czego nie znacie; my czcimy to, co znamy; bo zbawienie jest od Żydów."
"J4,23": "Ale przyjdzie godzina, i teraz już jest, kiedy prawdziwi czciciele będą cześć oddawać Ojcu w duchu i w prawdzie. Bo i Ojciec szuka takich, którzy tak Go czczą."
"J4,24": "Bóg jest duchem, a ci, którzy Go czczą, winni Go czcić w duchu i w prawdzie."
"J4,25": "Kobieta powiedziała do Niego: Wiem, że nadchodzi Mesjasz, nazywany Chrystusem; Ten, gdy przyjdzie, wszystko nam oznajmi."
"J4,26": "Jezus powiedział jej: Ja jestem Nim, ten który z tobą rozmawia."
"J4,27": "Wtedy przyszli Jego uczniowie i dziwili się, że rozmawiał z kobietą, jednak nikt nie powiedział: O co pytasz? lub: Dlaczego z nią rozmawiasz?"
"J4,28": "Zostawiła więc kobieta swój dzban i poszła do miasta, i powiedziała ludziom:"
"J4,29": "Chodźcie, zobaczcie człowieka, który powiedział mi wszystko, cokolwiek uczyniłam, czy to nie jest Mesjasz?"
"J4,30": "Wyszli więc z miasta i przyszli do Niego."
"J4,31": "A w tym czasie prosili Go uczniowie, mówiąc: Rabbi! Jedz."
"J4,32": "A On powiedział im: Ja mam pokarm do jedzenia, którego wy nie znacie."
"J4,33": "Mówili więc uczniowie do siebie nawzajem: Czy ktoś przyniósł Mu jeść?"
"J4,34": "Jezus powiedział im: Moim pokarmem jest czynić wolę Tego, który mnie posłał i wypełnić Jego dzieło."
"J4,35": "Czy nie wy mówicie: Jeszcze cztery miesiące, a nadejdzie żniwo? Otóż, mówię wam, podnieście swoje oczy i przypatrzcie się polom, że już są białe, gotowe do żniwa."
"J4,36": "A żniwiarz, odbiera zapłatę i zbiera plon do życia wiecznego, aby i ten, który sieje, radował się razem z tym, który żnie."
"J4,37": "Albowiem prawdziwe jest to słowo, że kto inny sieje, a kto inny żnie."
"J4,38": "Ja was posłałem żąć to, nad czym wy się nie trudziliście; inni się trudzili, a wy korzystacie z ich trudu."
"J4,39": "A wielu Samarytan z tego miasta uwierzyło w Niego dzięki słowu kobiety, która świadczyła: Powiedział mi wszystko, cokolwiek uczyniłam."
"J4,40": "Gdy więc przyszli do Niego Samarytanie, prosili Go, aby u nich pozostał; i pozostał tam dwa dni."
"J4,41": "I wielu więcej z nich uwierzyło dzięki Jego słowu;"
"J4,42": "Lecz także tej kobiecie mówili: Już nie dzięki twojemu opowiadaniu wierzymy; sami bowiem słyszeliśmy i wiemy, że Ten jest prawdziwie Zbawicielem świata – Mesjasz."
"J4,43": "A po dwóch dniach wyszedł stamtąd i odszedł do Galilei."
"J4,44": "Bowiem sam Jezus zaświadczył, że prorok we własnej ojczyźnie nie ma poważania."
"J4,45": "Gdy więc przyszedł do Galilei, przyjęli Go Galilejczycy, widząc wszystko, co czynił w czasie święta w Jerozolimie; i oni bowiem przybyli na święto."
"J4,46": "Przyszedł więc Jezus ponownie do Kany Galilejskiej, gdzie uczynił z wody wino. A był w Kafarnaum pewien dworzanin królewski, którego syn chorował."
"J4,47": "Ten, gdy usłyszał, że Jezus przybywa z Judei do Galilei, poszedł do Niego i prosił Go, aby zszedł i uzdrowił jego syna; bo bliski był śmierci."
"J4,48": "I Jezus powiedział do niego: Jeśli nie ujrzycie znaków i cudów – nie uwierzycie."
"J4,49": "Dworzanin królewski powiedział do Niego: Panie! Zejdź, zanim umrze moje dzieciątko."
"J4,50": "Jezus powiedział mu: Idź, syn twój żyje. I uwierzył ów człowiek słowu, które mu powiedział Jezus, i poszedł."
"J4,51": "A gdy już schodził, spotkali go jego słudzy i oznajmili, mówiąc: Chłopiec twój żyje."
"J4,52": "Wtedy zapytał ich o godzinę, w której poczuł się lepiej, i powiedzieli mu: Wczoraj o godzinie siódmej opuściła go gorączka."
"J4,53": "Poznał więc ojciec, że było to o tej godzinie, o której mu Jezus powiedział: Syn twój żyje. I uwierzył on i cały jego dom."
"J4,54": "To kolejny, drugi cudowny znak, który Jezus uczynił, gdy przyszedł z ziemi judzkiej do Galilei."
