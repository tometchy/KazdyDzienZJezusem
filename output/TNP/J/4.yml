"J4,1":
  text: "A gdy Pan dowiedział się, że faryzeusze usłyszeli, że Jezus więcej ludzi czyni uczniami i chrzci niż Jan,"
  tags: []
"J4,2":
  text: "Chociaż sam Jezus nie chrzcił, ale Jego uczniowie;"
  tags: []
"J4,3":
  text: "Opuścił Judeę i odszedł ponownie do Galilei."
  tags: []
"J4,4":
  text: "A musiał przechodzić przez Samarię."
  tags: []
"J4,5":
  text: "Przyszedł więc do miasta Samarii o nazwie Sychar, blisko pola, które dał Jakub Józefowi, swojemu synowi."
  tags: []
"J4,6":
  text: "A była tam studnia Jakuba. Jezus więc, będąc strudzony podróżą, usiadł tak przy studni; a było około szóstej godziny."
  tags: []
"J4,7":
  text: "Z Samarii przyszła kobieta zaczerpnąć wodę. Jezus powiedział jej: Daj mi pić!"
  tags: []
"J4,8":
  text: "Uczniowie Jego bowiem odeszli do miasta, aby kupić żywności."
  tags: []
"J4,9":
  text: "Kobieta z Samarii powiedziała więc do Niego: Jak Ty, będąc Żydem, prosisz mnie kobietę, Samarytankę, bym dała Ci pić? Bo Żydzi nie utrzymują stosunków z Samarytanami."
  tags: []
"J4,10":
  text: "Jezus w odpowiedzi, rzekł jej: Gdybyś znała dar Boga i kim jest Ten, który mówi do ciebie: Daj mi pić, to byś Go prosiła, a dałby ci wody żywej."
  tags: []
"J4,11":
  text: "Kobieta powiedziała do Niego: Panie! Nie masz nawet czerpaka, a studnia jest głęboka, skąd więc masz tę wodę żywą?"
  tags: []
"J4,12":
  text: "Czy Ty jesteś większy od naszego ojca Jakuba, który dał nam tę studnię i sam z niej pił, i jego synowie, i jego trzody?"
  tags: []
"J4,13":
  text: "Jezus w odpowiedzi, rzekł jej: Każdy, kto pije tę wodę, ponownie będzie pragnął;"
  tags: []
"J4,14":
  text: "Lecz kto będzie pił wodę, którą ja mu dam, nie będzie pragnął na wieki; ale woda, którą mu dam, stanie się w nim źródłem wody wytryskującej ku życiu wiecznemu."
  tags: []
"J4,15":
  text: "Kobieta powiedziała do Niego: Panie! Daj mi tej wody, abym nie pragnęła i nie przychodziła tutaj czerpać."
  tags: []
"J4,16":
  text: "Jezus powiedział jej: Idź, zawołaj swojego męża, i przyjdź tutaj."
  tags: []
"J4,17":
  text: "Kobieta w odpowiedzi, rzekła: Nie mam męża. Jezus powiedział jej: Dobrze powiedziałaś: Nie mam męża."
  tags: []
"J4,18":
  text: "Albowiem miałaś pięciu mężów, a ten, którego teraz masz, nie jest twoim mężem. Powiedziałaś prawdę."
  tags: []
"J4,19":
  text: "Kobieta powiedziała Mu: Panie! Widzę, że jesteś prorokiem."
  tags: []
"J4,20":
  text: "Ojcowie nasi oddawali cześć na tej górze, a wy mówicie, że w Jerozolimie jest miejsce, gdzie trzeba oddawać cześć."
  tags: []
"J4,21":
  text: "Jezus powiedział jej: Kobieto! Wierz mi, że przychodzi godzina, kiedy ani na tej górze, ani w Jerozolimie nie będziecie oddawali czci Ojcu."
  tags: []
"J4,22":
  text: "Wy czcicie to, czego nie znacie; my czcimy to, co znamy; bo zbawienie jest od Żydów."
  tags: []
"J4,23":
  text: "Ale przyjdzie godzina, i teraz już jest, kiedy prawdziwi czciciele będą cześć oddawać Ojcu w duchu i w prawdzie. Bo i Ojciec szuka takich, którzy tak Go czczą."
  tags: []
"J4,24":
  text: "Bóg jest duchem, a ci, którzy Go czczą, winni Go czcić w duchu i w prawdzie."
  tags: []
"J4,25":
  text: "Kobieta powiedziała do Niego: Wiem, że nadchodzi Mesjasz, nazywany Chrystusem; Ten, gdy przyjdzie, wszystko nam oznajmi."
  tags: []
"J4,26":
  text: "Jezus powiedział jej: Ja jestem Nim, ten który z tobą rozmawia."
  tags: []
"J4,27":
  text: "Wtedy przyszli Jego uczniowie i dziwili się, że rozmawiał z kobietą, jednak nikt nie powiedział: O co pytasz? lub: Dlaczego z nią rozmawiasz?"
  tags: []
"J4,28":
  text: "Zostawiła więc kobieta swój dzban i poszła do miasta, i powiedziała ludziom:"
  tags: []
"J4,29":
  text: "Chodźcie, zobaczcie człowieka, który powiedział mi wszystko, cokolwiek uczyniłam, czy to nie jest Mesjasz?"
  tags: []
"J4,30":
  text: "Wyszli więc z miasta i przyszli do Niego."
  tags: []
"J4,31":
  text: "A w tym czasie prosili Go uczniowie, mówiąc: Rabbi! Jedz."
  tags: []
"J4,32":
  text: "A On powiedział im: Ja mam pokarm do jedzenia, którego wy nie znacie."
  tags: []
"J4,33":
  text: "Mówili więc uczniowie do siebie nawzajem: Czy ktoś przyniósł Mu jeść?"
  tags: []
"J4,34":
  text: "Jezus powiedział im: Moim pokarmem jest czynić wolę Tego, który mnie posłał i wypełnić Jego dzieło."
  tags: []
"J4,35":
  text: "Czy nie wy mówicie: Jeszcze cztery miesiące, a nadejdzie żniwo? Otóż, mówię wam, podnieście swoje oczy i przypatrzcie się polom, że już są białe, gotowe do żniwa."
  tags: []
"J4,36":
  text: "A żniwiarz, odbiera zapłatę i zbiera plon do życia wiecznego, aby i ten, który sieje, radował się razem z tym, który żnie."
  tags: []
"J4,37":
  text: "Albowiem prawdziwe jest to słowo, że kto inny sieje, a kto inny żnie."
  tags: []
"J4,38":
  text: "Ja was posłałem żąć to, nad czym wy się nie trudziliście; inni się trudzili, a wy korzystacie z ich trudu."
  tags: []
"J4,39":
  text: "A wielu Samarytan z tego miasta uwierzyło w Niego dzięki słowu kobiety, która świadczyła: Powiedział mi wszystko, cokolwiek uczyniłam."
  tags: []
"J4,40":
  text: "Gdy więc przyszli do Niego Samarytanie, prosili Go, aby u nich pozostał; i pozostał tam dwa dni."
  tags: []
"J4,41":
  text: "I wielu więcej z nich uwierzyło dzięki Jego słowu;"
  tags: []
"J4,42":
  text: "Lecz także tej kobiecie mówili: Już nie dzięki twojemu opowiadaniu wierzymy; sami bowiem słyszeliśmy i wiemy, że Ten jest prawdziwie Zbawicielem świata – Mesjasz."
  tags: []
"J4,43":
  text: "A po dwóch dniach wyszedł stamtąd i odszedł do Galilei."
  tags: []
"J4,44":
  text: "Bowiem sam Jezus zaświadczył, że prorok we własnej ojczyźnie nie ma poważania."
  tags: []
"J4,45":
  text: "Gdy więc przyszedł do Galilei, przyjęli Go Galilejczycy, widząc wszystko, co czynił w czasie święta w Jerozolimie; i oni bowiem przybyli na święto."
  tags: []
"J4,46":
  text: "Przyszedł więc Jezus ponownie do Kany Galilejskiej, gdzie uczynił z wody wino. A był w Kafarnaum pewien dworzanin królewski, którego syn chorował."
  tags: []
"J4,47":
  text: "Ten, gdy usłyszał, że Jezus przybywa z Judei do Galilei, poszedł do Niego i prosił Go, aby zszedł i uzdrowił jego syna; bo bliski był śmierci."
  tags: []
"J4,48":
  text: "I Jezus powiedział do niego: Jeśli nie ujrzycie znaków i cudów – nie uwierzycie."
  tags: []
"J4,49":
  text: "Dworzanin królewski powiedział do Niego: Panie! Zejdź, zanim umrze moje dzieciątko."
  tags: []
"J4,50":
  text: "Jezus powiedział mu: Idź, syn twój żyje. I uwierzył ów człowiek słowu, które mu powiedział Jezus, i poszedł."
  tags: []
"J4,51":
  text: "A gdy już schodził, spotkali go jego słudzy i oznajmili, mówiąc: Chłopiec twój żyje."
  tags: []
"J4,52":
  text: "Wtedy zapytał ich o godzinę, w której poczuł się lepiej, i powiedzieli mu: Wczoraj o godzinie siódmej opuściła go gorączka."
  tags: []
"J4,53":
  text: "Poznał więc ojciec, że było to o tej godzinie, o której mu Jezus powiedział: Syn twój żyje. I uwierzył on i cały jego dom."
  tags: []
"J4,54":
  text: "To kolejny, drugi cudowny znak, który Jezus uczynił, gdy przyszedł z ziemi judzkiej do Galilei."
  tags: []
