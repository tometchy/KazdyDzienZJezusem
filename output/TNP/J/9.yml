"J9,1": "A przechodząc, zobaczył człowieka ślepego od urodzenia."
"J9,2": "I zapytali Go uczniowie Jego, mówiąc: Rabbi! Kto zgrzeszył? On czy jego rodzice, że urodził się ślepy?"
"J9,3": "Jezus odpowiedział: Ani on nie zgrzeszył, ani jego rodzice; lecz aby na nim okazały się dzieła Boże."
"J9,4": "Ja, dopóki jest dzień, muszę wykonywać dzieła Tego, który mnie posłał; nadchodzi noc, gdy nikt nie będzie mógł działać."
"J9,5": "Jak długo jestem na świecie, jestem światłem świata."
"J9,6": "A gdy to powiedział, splunął na ziemię i uczynił błoto ze śliny, i nałożył to błoto na oczy ślepego."
"J9,7": "I powiedział mu: Idź, obmyj się w sadzawce Syloe – co się tłumaczy: Posłany. Odszedł więc i obmył się, a gdy wrócił, widział."
"J9,8": "Sąsiedzi więc i ci, którzy go wcześniej widywali, że był ślepy, mówili: Czyż to nie jest ten, który tu siada i żebrze?"
"J9,9": "Jedni mówili, że to jest on, a inni, że jest podobny do niego. On natomiast mówił: To jestem ja."
"J9,10": "Powiedzieli więc do niego: Jak to się stało, że twoje oczy zostały otwarte?"
"J9,11": "A on w odpowiedzi, rzekł: Człowiek, którego nazywają Jezusem, uczynił błoto i pomazał moje oczy, i powiedział mi: Idź do sadzawki Syloe i obmyj się; a gdy odszedłem i obmyłem się, przejrzałem."
"J9,12": "Wtedy powiedzieli mu: Gdzie On jest? Powiedział: Nie wiem."
"J9,13": "Przyprowadzili więc tego, który kiedyś był ślepy do faryzeuszów."
"J9,14": "A tego dnia był szabat, gdy Jezus uczynił błoto i otworzył jego oczy."
"J9,15": "Wtedy ponownie zapytali go faryzeusze, w jaki sposób przejrzał? A on powiedział im: Nałożył mi błoto na oczy, obmyłem się i widzę."
"J9,16": "Mówili więc niektórzy z faryzeuszów: Ten człowiek nie jest od Boga, bo nie zachowuje szabatu. Inni mówili: Jak może grzeszny człowiek czynić takie cudowne znaki? I powstał rozłam wśród nich."
"J9,17": "Powiedzieli ponownie ślepemu: Co ty powiesz o Nim, skoro otworzył twoje oczy? A on powiedział: Jest prorokiem."
"J9,18": "Nie wierzyli Żydzi, że był on ślepy, i że ponownie zaczął widzieć, aż zawołali rodziców tego, który przejrzał,"
"J9,19": "I pytali ich, mówiąc: Czy to jest wasz syn, o którym wy mówicie, że urodził się ślepy? Jak więc to się stało, że teraz widzi?"
"J9,20": "W odpowiedzi rodzice jego, odparli im: Wiemy, że to jest nasz syn, i że urodził się ślepy;"
"J9,21": "A jak się to stało, że teraz widzi, tego nie wiemy, ani też nie wiemy, kto otworzył jego oczy; ma swoje lata, zapytajcie go, niech sam o sobie powie."
"J9,22": "Tak mówili jego rodzice, bo bali się Żydów; albowiem już wtedy Żydzi postanowili, że jeśli ktoś wyzna, że On jest Mesjaszem, zostanie wyłączony z synagogi."
"J9,23": "Dlatego powiedzieli jego rodzice: Ma swoje lata, zapytajcie jego."
"J9,24": "Powtórnie więc zawołali człowieka, który był ślepy, i powiedzieli mu: Oddaj chwałę Bogu; my wiemy, że człowiek ten jest grzeszny."
"J9,25": "A on w odpowiedzi, rzekł im: Czy jest grzeszny – nie wiem; wiem tylko jedno, że byłem ślepy, a teraz widzę."
"J9,26": "Powiedzieli więc do niego ponownie: Co ci uczynił? Jak otworzył twoje oczy?"
"J9,27": "Odpowiedział im: Już wam powiedziałem, a nie słuchaliście. Dlaczego jeszcze raz chcecie to słyszeć? Czy i wy chcecie zostać Jego uczniami?"
"J9,28": "Wtedy go znieważyli i powiedzieli: Ty jesteś Jego uczniem; my natomiast jesteśmy uczniami Mojżesza."
"J9,29": "My wiemy, że Bóg mówił do Mojżesza; lecz Ten, nie wiemy skąd jest."
"J9,30": "Człowiek ten w odpowiedzi, rzekł im: W tym wszystkim dziwne jest, że wy nie wiecie, skąd On jest, a On otworzył moje oczy."
"J9,31": "Wiemy przecież, że Bóg nie wysłuchuje grzeszników; ale kto jest bogobojny i czyni Jego wolę, tego wysłuchuje."
"J9,32": "Od wieku nie słyszano, aby ktoś otworzył oczy ślepemu od urodzenia."
"J9,33": "Gdyby On nie był z Boga, nie mógłby nic czynić."
"J9,34": "W odpowiedzi, rzekli mu: Ty cały zostałeś urodzony w grzechach, i ty nas nauczasz? I wyrzucili go na zewnątrz."
"J9,35": "A Jezus usłyszał, że go wyrzucili na zewnątrz, a gdy go znalazł, powiedział mu: Czy ty wierzysz w Syna Bożego?"
"J9,36": "A on w odpowiedzi, rzekł: Kto to jest, Panie, abym uwierzył w Niego?"
"J9,37": "I Jezus powiedział do niego: Widziałeś Go, jest nim Ten, który rozmawia z tobą."
"J9,38": "A on powiedział: Wierzę, Panie! I złożył Mu pokłon."
"J9,39": "A Jezus powiedział: Ja przyszedłem na ten świat na sąd, aby ci, którzy nie widzą, widzieli, a ci, którzy widzą, aby stali się ślepi."
"J9,40": "I usłyszeli to niektórzy z faryzeuszów obecni przy Nim, i powiedzieli do Niego: Czy i my jesteśmy ślepi?"
"J9,41": "Jezus powiedział im: Gdybyście byli ślepi, nie mielibyście grzechu; teraz jednak mówicie, że widzicie, dlatego grzech wasz trwa."
