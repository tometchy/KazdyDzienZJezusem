"J9,1":
  text: "A przechodząc, zobaczył człowieka ślepego od urodzenia."
  tags: []
"J9,2":
  text: "I zapytali Go uczniowie Jego, mówiąc: Rabbi! Kto zgrzeszył? On czy jego rodzice, że urodził się ślepy?"
  tags: []
"J9,3":
  text: "Jezus odpowiedział: Ani on nie zgrzeszył, ani jego rodzice; lecz aby na nim okazały się dzieła Boże."
  tags: []
"J9,4":
  text: "Ja, dopóki jest dzień, muszę wykonywać dzieła Tego, który mnie posłał; nadchodzi noc, gdy nikt nie będzie mógł działać."
  tags: []
"J9,5":
  text: "Jak długo jestem na świecie, jestem światłem świata."
  tags: []
"J9,6":
  text: "A gdy to powiedział, splunął na ziemię i uczynił błoto ze śliny, i nałożył to błoto na oczy ślepego."
  tags: []
"J9,7":
  text: "I powiedział mu: Idź, obmyj się w sadzawce Syloe – co się tłumaczy: Posłany. Odszedł więc i obmył się, a gdy wrócił, widział."
  tags: []
"J9,8":
  text: "Sąsiedzi więc i ci, którzy go wcześniej widywali, że był ślepy, mówili: Czyż to nie jest ten, który tu siada i żebrze?"
  tags: []
"J9,9":
  text: "Jedni mówili, że to jest on, a inni, że jest podobny do niego. On natomiast mówił: To jestem ja."
  tags: []
"J9,10":
  text: "Powiedzieli więc do niego: Jak to się stało, że twoje oczy zostały otwarte?"
  tags: []
"J9,11":
  text: "A on w odpowiedzi, rzekł: Człowiek, którego nazywają Jezusem, uczynił błoto i pomazał moje oczy, i powiedział mi: Idź do sadzawki Syloe i obmyj się; a gdy odszedłem i obmyłem się, przejrzałem."
  tags: []
"J9,12":
  text: "Wtedy powiedzieli mu: Gdzie On jest? Powiedział: Nie wiem."
  tags: []
"J9,13":
  text: "Przyprowadzili więc tego, który kiedyś był ślepy do faryzeuszów."
  tags: []
"J9,14":
  text: "A tego dnia był szabat, gdy Jezus uczynił błoto i otworzył jego oczy."
  tags: []
"J9,15":
  text: "Wtedy ponownie zapytali go faryzeusze, w jaki sposób przejrzał? A on powiedział im: Nałożył mi błoto na oczy, obmyłem się i widzę."
  tags: []
"J9,16":
  text: "Mówili więc niektórzy z faryzeuszów: Ten człowiek nie jest od Boga, bo nie zachowuje szabatu. Inni mówili: Jak może grzeszny człowiek czynić takie cudowne znaki? I powstał rozłam wśród nich."
  tags: []
"J9,17":
  text: "Powiedzieli ponownie ślepemu: Co ty powiesz o Nim, skoro otworzył twoje oczy? A on powiedział: Jest prorokiem."
  tags: []
"J9,18":
  text: "Nie wierzyli Żydzi, że był on ślepy, i że ponownie zaczął widzieć, aż zawołali rodziców tego, który przejrzał,"
  tags: []
"J9,19":
  text: "I pytali ich, mówiąc: Czy to jest wasz syn, o którym wy mówicie, że urodził się ślepy? Jak więc to się stało, że teraz widzi?"
  tags: []
"J9,20":
  text: "W odpowiedzi rodzice jego, odparli im: Wiemy, że to jest nasz syn, i że urodził się ślepy;"
  tags: []
"J9,21":
  text: "A jak się to stało, że teraz widzi, tego nie wiemy, ani też nie wiemy, kto otworzył jego oczy; ma swoje lata, zapytajcie go, niech sam o sobie powie."
  tags: []
"J9,22":
  text: "Tak mówili jego rodzice, bo bali się Żydów; albowiem już wtedy Żydzi postanowili, że jeśli ktoś wyzna, że On jest Mesjaszem, zostanie wyłączony z synagogi."
  tags: []
"J9,23":
  text: "Dlatego powiedzieli jego rodzice: Ma swoje lata, zapytajcie jego."
  tags: []
"J9,24":
  text: "Powtórnie więc zawołali człowieka, który był ślepy, i powiedzieli mu: Oddaj chwałę Bogu; my wiemy, że człowiek ten jest grzeszny."
  tags: []
"J9,25":
  text: "A on w odpowiedzi, rzekł im: Czy jest grzeszny – nie wiem; wiem tylko jedno, że byłem ślepy, a teraz widzę."
  tags: []
"J9,26":
  text: "Powiedzieli więc do niego ponownie: Co ci uczynił? Jak otworzył twoje oczy?"
  tags: []
"J9,27":
  text: "Odpowiedział im: Już wam powiedziałem, a nie słuchaliście. Dlaczego jeszcze raz chcecie to słyszeć? Czy i wy chcecie zostać Jego uczniami?"
  tags: []
"J9,28":
  text: "Wtedy go znieważyli i powiedzieli: Ty jesteś Jego uczniem; my natomiast jesteśmy uczniami Mojżesza."
  tags: []
"J9,29":
  text: "My wiemy, że Bóg mówił do Mojżesza; lecz Ten, nie wiemy skąd jest."
  tags: []
"J9,30":
  text: "Człowiek ten w odpowiedzi, rzekł im: W tym wszystkim dziwne jest, że wy nie wiecie, skąd On jest, a On otworzył moje oczy."
  tags: []
"J9,31":
  text: "Wiemy przecież, że Bóg nie wysłuchuje grzeszników; ale kto jest bogobojny i czyni Jego wolę, tego wysłuchuje."
  tags: []
"J9,32":
  text: "Od wieku nie słyszano, aby ktoś otworzył oczy ślepemu od urodzenia."
  tags: []
"J9,33":
  text: "Gdyby On nie był z Boga, nie mógłby nic czynić."
  tags: []
"J9,34":
  text: "W odpowiedzi, rzekli mu: Ty cały zostałeś urodzony w grzechach, i ty nas nauczasz? I wyrzucili go na zewnątrz."
  tags: []
"J9,35":
  text: "A Jezus usłyszał, że go wyrzucili na zewnątrz, a gdy go znalazł, powiedział mu: Czy ty wierzysz w Syna Bożego?"
  tags: []
"J9,36":
  text: "A on w odpowiedzi, rzekł: Kto to jest, Panie, abym uwierzył w Niego?"
  tags: []
"J9,37":
  text: "I Jezus powiedział do niego: Widziałeś Go, jest nim Ten, który rozmawia z tobą."
  tags: []
"J9,38":
  text: "A on powiedział: Wierzę, Panie! I złożył Mu pokłon."
  tags: []
"J9,39":
  text: "A Jezus powiedział: Ja przyszedłem na ten świat na sąd, aby ci, którzy nie widzą, widzieli, a ci, którzy widzą, aby stali się ślepi."
  tags: []
"J9,40":
  text: "I usłyszeli to niektórzy z faryzeuszów obecni przy Nim, i powiedzieli do Niego: Czy i my jesteśmy ślepi?"
  tags: []
"J9,41":
  text: "Jezus powiedział im: Gdybyście byli ślepi, nie mielibyście grzechu; teraz jednak mówicie, że widzicie, dlatego grzech wasz trwa."
  tags: []
