"J18,1":
  text: "Gdy Jezus to powiedział, przeszedł z uczniami swoimi na drugą stronę potoku Cedron, gdzie był ogród, do którego wszedł On i Jego uczniowie."
  tags: []
"J18,2":
  text: "Miejsce to znał także Judasz, który Go wydał, bo Jezus często zbierał się tam ze swoimi uczniami."
  tags: []
"J18,3":
  text: "Judasz więc wziął kohortę i podwładnych od arcykapłanów i faryzeuszów, przyszedł tam z latarniami i z pochodniami, i z orężem."
  tags: []
"J18,4":
  text: "Jezus więc, wiedząc o wszystkim, co miało na Niego przyjść, wyszedł i powiedział im: Kogo szukacie?"
  tags: []
"J18,5":
  text: "Odpowiedzieli Mu: Jezusa Nazarejczyka. Jezus powiedział im: Ja jestem. A stał z nimi i Judasz, który Go im wydał."
  tags: []
"J18,6":
  text: "A skoro im powiedział: Ja jestem, cofnęli się i upadli na ziemię."
  tags: []
"J18,7":
  text: "Ponownie więc zapytał ich: Kogo szukacie? A oni powiedzieli: Jezusa Nazarejczyka."
  tags: []
"J18,8":
  text: "Jezus odpowiedział: Powiedziałem wam, że ja jestem. Jeśli więc mnie szukacie, pozwólcie tym odejść;"
  tags: []
"J18,9":
  text: "Aby zostało wypełnione słowo, które powiedział: Nie straciłem nikogo z tych, których mi dałeś."
  tags: []
"J18,10":
  text: "Wtedy Szymon Piotr, mając miecz, wyciągnął go i uderzył sługę arcykapłana, i odciął mu prawe ucho. A słudze temu było na imię Malchos."
  tags: []
"J18,11":
  text: "Jezus więc powiedział Piotrowi: Włóż miecz swój do pochwy. Czy nie mam pić kielicha, który dał mi Ojciec?"
  tags: []
"J18,12":
  text: "Wtedy kohorta i dowódca oraz podwładni żydowscy schwytali Jezusa i związali Go."
  tags: []
"J18,13":
  text: "I zaprowadzili Go najpierw do Annasza, który był teściem Kajfasza; a on był w tym roku arcykapłanem."
  tags: []
"J18,14":
  text: "A był to ten Kajfasz, który radził Żydom, że korzystniej jest, aby jeden człowiek zginął za lud."
  tags: []
"J18,15":
  text: "A za Jezusem szedł Szymon Piotr i inny uczeń. A ten uczeń był znany arcykapłanowi, i wszedł razem z Jezusem na dziedziniec pałacu arcykapłana."
  tags: []
"J18,16":
  text: "Natomiast Piotr stał na zewnątrz przy bramie. Wyszedł więc ten drugi uczeń, który był znany arcykapłanowi i po rozmowie z odźwierną, wprowadził Piotra."
  tags: []
"J18,17":
  text: "Wtedy powiedziała służąca odźwierna Piotrowi: Czy i ty nie jesteś z uczniów Tego człowieka? On odpowiedział: Nie jestem."
  tags: []
"J18,18":
  text: "Stała tam natomiast służba i podwładni, paląc ogień, bo było zimno, i grzali się; i był też z nimi Piotr, który stał i grzał się."
  tags: []
"J18,19":
  text: "Tymczasem arcykapłan zapytał Jezusa o Jego uczniów i o Jego naukę."
  tags: []
"J18,20":
  text: "Jezus odpowiedział mu: Ja otwarcie mówiłem do świata. Ja zawsze uczyłem w synagodze i w świątyni, gdzie zawsze schodzą się Żydzi, a w ukryciu nic nie mówiłem."
  tags: []
"J18,21":
  text: "Dlaczego mnie pytasz? Zapytaj tych, którzy słuchali, co im mówiłem; oto oni wiedzą, co ja powiedziałem."
  tags: []
"J18,22":
  text: "A gdy On to powiedział, jeden ze stojących tam podwładnych wymierzył Jezusowi policzek, mówiąc: Tak to odpowiadasz arcykapłanowi?"
  tags: []
"J18,23":
  text: "Jezus odpowiedział mu: Jeśli źle powiedziałem, poświadcz, co było złe; a jeśli dobrze, dlaczego mnie bijesz?"
  tags: []
"J18,24":
  text: "Wysłał więc Go Annasz związanego do arcykapłana Kajfasza."
  tags: []
"J18,25":
  text: "A Szymon Piotr stał i grzał się. Powiedzieli więc do niego: Czy i ty nie jesteś jednym z Jego uczniów? A on wyparł się, mówiąc: Nie jestem."
  tags: []
"J18,26":
  text: "Powiedział mu jeden ze sług arcykapłana, krewny tego, któremu Piotr obciął ucho: Czy ja nie widziałem ciebie z Nim w ogrodzie?"
  tags: []
"J18,27":
  text: "Lecz Piotr ponownie wyparł się, i zaraz zapiał kogut."
  tags: []
"J18,28":
  text: "Zaprowadzili więc Jezusa od Kajfasza do pretorium. A było rano. I sami nie weszli do pretorium, aby się nie skalać, ale by móc spożyć Paschę."
  tags: []
"J18,29":
  text: "Wyszedł więc Piłat do nich na zewnątrz i powiedział: Jakie oskarżenie wnosicie przeciwko temu człowiekowi?"
  tags: []
"J18,30":
  text: "W odpowiedzi, rzekli do niego: Gdyby On nie był złoczyńcą nie wydalibyśmy Go tobie."
  tags: []
"J18,31":
  text: "Piłat więc powiedział: Weźcie Go wy i według waszego Prawa Go osądźcie. Żydzi powiedzieli mu: Nam nie wolno nikogo zabijać;"
  tags: []
"J18,32":
  text: "Aby zostało wypełnione słowo Jezusa, które wypowiedział, aby wskazać jaką śmiercią będzie umierał."
  tags: []
"J18,33":
  text: "Więc ponownie wszedł Piłat do pretorium i przywołał Jezusa, mówiąc do Niego: To Ty jesteś Królem Żydów?"
  tags: []
"J18,34":
  text: "Jezus odpowiedział mu: Czy ty mówisz to sam z siebie, czy inni powiedzieli ci o mnie?"
  tags: []
"J18,35":
  text: "Piłat odpowiedział: Czy ja jestem Żydem? Twój naród i arcykapłani wydali mi Ciebie; co uczyniłeś?"
  tags: []
"J18,36":
  text: "Jezus odpowiedział: Królestwo moje nie jest z tego świata; gdyby Królestwo moje było z tego świata, moi podwładni podjęliby walkę, abym nie został wydany Żydom; teraz jednak Królestwo moje nie jest stąd."
  tags: []
"J18,37":
  text: "Piłat powiedział więc do Niego: A zatem jesteś królem? Jezus odpowiedział mu: Ty to mówisz, że ja jestem królem. Ja na to zostałem zrodzony i na to przyszedłem na świat, aby dać świadectwo prawdzie. Każdy, kto jest z prawdy, słucha mojego głosu."
  tags: []
"J18,38":
  text: "Piłat powiedział do Niego: Co to jest prawda? A gdy to powiedział, wyszedł ponownie do Żydów, mówiąc im: Ja nie znajduję w Nim żadnej winy z powodu, której miałby być ukarany."
  tags: []
"J18,39":
  text: "A jest u was zwyczaj, że na Paschę jednego wam uwalniam. Chcecie więc, abym wam uwolnił Króla Żydów?"
  tags: []
"J18,40":
  text: "Wykrzyknęli więc wszyscy ponownie, mówiąc: Nie Tego, ale Barabasza! A Barabasz był bandytą."
  tags: []
