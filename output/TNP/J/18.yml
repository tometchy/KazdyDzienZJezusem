"J18,1": "Gdy Jezus to powiedział, przeszedł z uczniami swoimi na drugą stronę potoku Cedron, gdzie był ogród, do którego wszedł On i Jego uczniowie."
"J18,2": "Miejsce to znał także Judasz, który Go wydał, bo Jezus często zbierał się tam ze swoimi uczniami."
"J18,3": "Judasz więc wziął kohortę i podwładnych od arcykapłanów i faryzeuszów, przyszedł tam z latarniami i z pochodniami, i z orężem."
"J18,4": "Jezus więc, wiedząc o wszystkim, co miało na Niego przyjść, wyszedł i powiedział im: Kogo szukacie?"
"J18,5": "Odpowiedzieli Mu: Jezusa Nazarejczyka. Jezus powiedział im: Ja jestem. A stał z nimi i Judasz, który Go im wydał."
"J18,6": "A skoro im powiedział: Ja jestem, cofnęli się i upadli na ziemię."
"J18,7": "Ponownie więc zapytał ich: Kogo szukacie? A oni powiedzieli: Jezusa Nazarejczyka."
"J18,8": "Jezus odpowiedział: Powiedziałem wam, że ja jestem. Jeśli więc mnie szukacie, pozwólcie tym odejść;"
"J18,9": "Aby zostało wypełnione słowo, które powiedział: Nie straciłem nikogo z tych, których mi dałeś."
"J18,10": "Wtedy Szymon Piotr, mając miecz, wyciągnął go i uderzył sługę arcykapłana, i odciął mu prawe ucho. A słudze temu było na imię Malchos."
"J18,11": "Jezus więc powiedział Piotrowi: Włóż miecz swój do pochwy. Czy nie mam pić kielicha, który dał mi Ojciec?"
"J18,12": "Wtedy kohorta i dowódca oraz podwładni żydowscy schwytali Jezusa i związali Go."
"J18,13": "I zaprowadzili Go najpierw do Annasza, który był teściem Kajfasza; a on był w tym roku arcykapłanem."
"J18,14": "A był to ten Kajfasz, który radził Żydom, że korzystniej jest, aby jeden człowiek zginął za lud."
"J18,15": "A za Jezusem szedł Szymon Piotr i inny uczeń. A ten uczeń był znany arcykapłanowi, i wszedł razem z Jezusem na dziedziniec pałacu arcykapłana."
"J18,16": "Natomiast Piotr stał na zewnątrz przy bramie. Wyszedł więc ten drugi uczeń, który był znany arcykapłanowi i po rozmowie z odźwierną, wprowadził Piotra."
"J18,17": "Wtedy powiedziała służąca odźwierna Piotrowi: Czy i ty nie jesteś z uczniów Tego człowieka? On odpowiedział: Nie jestem."
"J18,18": "Stała tam natomiast służba i podwładni, paląc ogień, bo było zimno, i grzali się; i był też z nimi Piotr, który stał i grzał się."
"J18,19": "Tymczasem arcykapłan zapytał Jezusa o Jego uczniów i o Jego naukę."
"J18,20": "Jezus odpowiedział mu: Ja otwarcie mówiłem do świata. Ja zawsze uczyłem w synagodze i w świątyni, gdzie zawsze schodzą się Żydzi, a w ukryciu nic nie mówiłem."
"J18,21": "Dlaczego mnie pytasz? Zapytaj tych, którzy słuchali, co im mówiłem; oto oni wiedzą, co ja powiedziałem."
"J18,22": "A gdy On to powiedział, jeden ze stojących tam podwładnych wymierzył Jezusowi policzek, mówiąc: Tak to odpowiadasz arcykapłanowi?"
"J18,23": "Jezus odpowiedział mu: Jeśli źle powiedziałem, poświadcz, co było złe; a jeśli dobrze, dlaczego mnie bijesz?"
"J18,24": "Wysłał więc Go Annasz związanego do arcykapłana Kajfasza."
"J18,25": "A Szymon Piotr stał i grzał się. Powiedzieli więc do niego: Czy i ty nie jesteś jednym z Jego uczniów? A on wyparł się, mówiąc: Nie jestem."
"J18,26": "Powiedział mu jeden ze sług arcykapłana, krewny tego, któremu Piotr obciął ucho: Czy ja nie widziałem ciebie z Nim w ogrodzie?"
"J18,27": "Lecz Piotr ponownie wyparł się, i zaraz zapiał kogut."
"J18,28": "Zaprowadzili więc Jezusa od Kajfasza do pretorium. A było rano. I sami nie weszli do pretorium, aby się nie skalać, ale by móc spożyć Paschę."
"J18,29": "Wyszedł więc Piłat do nich na zewnątrz i powiedział: Jakie oskarżenie wnosicie przeciwko temu człowiekowi?"
"J18,30": "W odpowiedzi, rzekli do niego: Gdyby On nie był złoczyńcą nie wydalibyśmy Go tobie."
"J18,31": "Piłat więc powiedział: Weźcie Go wy i według waszego Prawa Go osądźcie. Żydzi powiedzieli mu: Nam nie wolno nikogo zabijać;"
"J18,32": "Aby zostało wypełnione słowo Jezusa, które wypowiedział, aby wskazać jaką śmiercią będzie umierał."
"J18,33": "Więc ponownie wszedł Piłat do pretorium i przywołał Jezusa, mówiąc do Niego: To Ty jesteś Królem Żydów?"
"J18,34": "Jezus odpowiedział mu: Czy ty mówisz to sam z siebie, czy inni powiedzieli ci o mnie?"
"J18,35": "Piłat odpowiedział: Czy ja jestem Żydem? Twój naród i arcykapłani wydali mi Ciebie; co uczyniłeś?"
"J18,36": "Jezus odpowiedział: Królestwo moje nie jest z tego świata; gdyby Królestwo moje było z tego świata, moi podwładni podjęliby walkę, abym nie został wydany Żydom; teraz jednak Królestwo moje nie jest stąd."
"J18,37": "Piłat powiedział więc do Niego: A zatem jesteś królem? Jezus odpowiedział mu: Ty to mówisz, że ja jestem królem. Ja na to zostałem zrodzony i na to przyszedłem na świat, aby dać świadectwo prawdzie. Każdy, kto jest z prawdy, słucha mojego głosu."
"J18,38": "Piłat powiedział do Niego: Co to jest prawda? A gdy to powiedział, wyszedł ponownie do Żydów, mówiąc im: Ja nie znajduję w Nim żadnej winy z powodu, której miałby być ukarany."
"J18,39": "A jest u was zwyczaj, że na Paschę jednego wam uwalniam. Chcecie więc, abym wam uwolnił Króla Żydów?"
"J18,40": "Wykrzyknęli więc wszyscy ponownie, mówiąc: Nie Tego, ale Barabasza! A Barabasz był bandytą."
