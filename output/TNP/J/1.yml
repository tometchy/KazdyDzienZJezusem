"J1,1": "Na początku było Słowo, a Słowo było u Boga, a Bogiem było Słowo."
"J1,2": "Ono było na początku u Boga."
"J1,3": "Wszystko przez Nie się stało, a bez Niego nic się nie stało, co się stało."
"J1,4": "W Nim było życie, a życie było światłem ludzi."
"J1,5": "A światło świeci w ciemności, a ciemność Nim nie zawładnęła."
"J1,6": "Pojawił się człowiek posłany od Boga, na imię mu – Jan."
"J1,7": "On przyszedł na świadectwo, by zaświadczyć o tym świetle, aby dzięki niemu wszyscy uwierzyli."
"J1,8": "Nie był on światłem, ale jedynie miał zaświadczyć o tym świetle."
"J1,9": "Było prawdziwe światło, które oświeca każdego człowieka przychodzącego na świat."
"J1,10": "Na świecie był i świat przez Niego jest uczyniony; a świat Go nie poznał."
"J1,11": "Do swojej własności przyszedł, a swoi Go nie przyjęli."
"J1,12": "Tym jednak, którzy Go przyjęli, dał prawo stać się dziećmi Boga, to jest wierzącym w Jego imię."
"J1,13": "Którzy zostali zrodzeni nie z krwi, ani z woli ciała, ani z woli mężczyzny, ale z Boga."
"J1,14": "A Słowo pełne łaski i prawdy, stało się ciałem i mieszkało między nami, i widzieliśmy chwałę Jego, chwałę jako jednorodzonego pochodzącego od Ojca."
"J1,15": "Jan świadczył o Nim i głośno wołając, oświadczył: Ten był, o którym powiedziałem: Ten, który przychodzi po mnie, istniał przede mną, bo wcześniej był niż ja."
"J1,16": "A z Jego pełni my wszyscy wzięliśmy, i to łaskę za łaską."
"J1,17": "O ile bowiem Prawo zostało dane przez Mojżesza, o tyle łaska i prawda stała się przez Jezusa Chrystusa."
"J1,18": "Boga nikt nigdy nie widział; jednorodzony Syn, który jest w łonie Ojca, Ten nam o Nim opowiedział."
"J1,19": "A takie jest świadectwo Jana, gdy posłali Żydzi z Jerozolimy kapłanów i lewitów, aby go zapytać: Kim ty jesteś?"
"J1,20": "I wyznał, a nie zaprzeczył, mówiąc: Ja nie jestem Mesjaszem."
"J1,21": "I pytali go: Kim więc? Czy ty jesteś Eliaszem? A on odpowiedział: Nie jestem. Czy ty jesteś tym Prorokiem? I odpowiedział: Nie."
"J1,22": "Powiedzieli wtedy do niego: Kim więc jesteś, żebyśmy dali odpowiedź tym, którzy nas posłali. Co mówisz o sobie?"
"J1,23": "Powiedział: Ja jestem głosem wołającego na pustyni: Prostujcie drogę PANA, jak powiedział prorok Izajasz."
"J1,24": "A ci, którzy zostali wysłani, byli z faryzeuszów."
"J1,25": "I pytali go, i powiedzieli mu: Czemu więc chrzcisz, jeżeli ty nie jesteś Mesjaszem, ani Eliaszem, ani tym Prorokiem?"
"J1,26": "Jan odpowiedział im, mówiąc: Ja chrzczę w wodzie; ale pośrodku was stanął Ten, którego wy nie znacie."
"J1,27": "To jest Ten, który przychodzi po mnie, On istniał przede mną, któremu ja nie jestem godny, by rozwiązać rzemyk u Jego sandała."
"J1,28": "To działo się w Betabarze za Jordanem, gdzie Jan chrzcił."
"J1,29": "A nazajutrz, Jan ujrzał idącego do niego Jezusa i powiedział: Oto Baranek Boży, który zabiera grzech świata."
"J1,30": "To jest Ten, o którym ja powiedziałem: Za mną idzie mąż, który istniał przede mną, bo wcześniej był niż ja."
"J1,31": "A ja Go wcześniej nie znałem. Ja dlatego przyszedłem chrzcząc w wodzie, aby On został ukazany Izraelowi."
"J1,32": "A Jan poświadczył, mówiąc: Widziałem Ducha zstępującego jakby gołębica z nieba, i pozostał na Nim."
"J1,33": "A ja Go nie poznałem; lecz Ten, który mnie posłał, bym chrzcił w wodzie, Ten mi powiedział: Jeśli ujrzysz kogoś, na którego zstępuje i pozostaje na nim Duch, to jest Ten, który chrzci w Duchu Świętym."
"J1,34": "A ja widziałem i zaświadczyłem, że Ten jest Synem Bożym."
"J1,35": "Nazajutrz ponownie stał Jan i dwaj z jego uczniów."
"J1,36": "A przypatrując się przechodzącemu Jezusowi, powiedział: Oto Baranek Boży."
"J1,37": "I usłyszeli go ci dwaj uczniowie, gdy to mówił, i poszli za Jezusem."
"J1,38": "A Jezus odwrócił się i ujrzał ich idących za sobą, i powiedział do nich: Czego szukacie? A oni powiedzieli do Niego: Rabbi! Co znaczy w tłumaczeniu – Nauczycielu – gdzie mieszkasz?"
"J1,39": "Powiedział im: Chodźcie, a zobaczycie. Przyszli i zobaczyli, gdzie mieszkał, i tego dnia pozostali u Niego; a było około dziesiątej godziny."
"J1,40": "Jednym z tych dwóch, którzy to słyszeli od Jana i którzy podążali za Nim, był Andrzej, brat Szymona Piotra."
"J1,41": "Ten najpierw odszukał Szymona, swojego brata i powiedział mu: Znaleźliśmy Mesjasza, co tłumaczy się – Pomazańca."
"J1,42": "I przyprowadził go do Jezusa. A Jezus przyjrzawszy się mu, powiedział: Ty jesteś Szymon, syn Jonasza; ty będziesz nazwany Kefas, co tłumaczy się – Piotr."
"J1,43": "Nazajutrz chciał Jezus udać się do Galilei i znalazł Filipa, i powiedział mu: Pójdź za mną."
"J1,44": "A Filip był z Betsaidy, z miasta Andrzeja i Piotra."
"J1,45": "Filip odnalazł Natanaela i powiedział mu: Znaleźliśmy Tego, o którym pisał Mojżesz w Prawie i Prorocy, Jezusa, syna Józefa z Nazaretu."
"J1,46": "I powiedział mu Natanael: Czy z Nazaretu może być coś dobrego? Filip na to: Chodź i zobacz!"
"J1,47": "Gdy Jezus ujrzał Natanaela idącego do Niego, powiedział o nim: Oto prawdziwie Izraelita, w którym nie ma podstępu."
"J1,48": "Natanael powiedział do Niego: Skąd mnie znasz? W odpowiedzi, Jezus rzekł mu: Zanim zawołał cię Filip, widziałem cię, gdy byłeś pod figowcem."
"J1,49": "Wtedy Natanael powiedział do Niego: Rabbi! Ty jesteś Synem Bożym, Ty jesteś Królem Izraela."
"J1,50": "A Jezus powiedział do niego: Wierzysz dlatego, że powiedziałem ci: Widziałem cię pod figowcem. Ujrzysz większe rzeczy niż te."
"J1,51": "I powiedział mu: Zaprawdę, zaprawdę mówię wam: Od teraz ujrzycie otwarte niebo i aniołów Boga wstępujących i zstępujących na Syna Człowieczego."
