"J1,1":
  text: "Na początku było Słowo, a Słowo było u Boga, a Bogiem było Słowo."
  tags: []
"J1,2":
  text: "Ono było na początku u Boga."
  tags: []
"J1,3":
  text: "Wszystko przez Nie się stało, a bez Niego nic się nie stało, co się stało."
  tags: []
"J1,4":
  text: "W Nim było życie, a życie było światłem ludzi."
  tags: []
"J1,5":
  text: "A światło świeci w ciemności, a ciemność Nim nie zawładnęła."
  tags: []
"J1,6":
  text: "Pojawił się człowiek posłany od Boga, na imię mu – Jan."
  tags: []
"J1,7":
  text: "On przyszedł na świadectwo, by zaświadczyć o tym świetle, aby dzięki niemu wszyscy uwierzyli."
  tags: []
"J1,8":
  text: "Nie był on światłem, ale jedynie miał zaświadczyć o tym świetle."
  tags: []
"J1,9":
  text: "Było prawdziwe światło, które oświeca każdego człowieka przychodzącego na świat."
  tags: []
"J1,10":
  text: "Na świecie był i świat przez Niego jest uczyniony; a świat Go nie poznał."
  tags: []
"J1,11":
  text: "Do swojej własności przyszedł, a swoi Go nie przyjęli."
  tags: []
"J1,12":
  text: "Tym jednak, którzy Go przyjęli, dał prawo stać się dziećmi Boga, to jest wierzącym w Jego imię."
  tags: []
"J1,13":
  text: "Którzy zostali zrodzeni nie z krwi, ani z woli ciała, ani z woli mężczyzny, ale z Boga."
  tags: []
"J1,14":
  text: "A Słowo pełne łaski i prawdy, stało się ciałem i mieszkało między nami, i widzieliśmy chwałę Jego, chwałę jako jednorodzonego pochodzącego od Ojca."
  tags: []
"J1,15":
  text: "Jan świadczył o Nim i głośno wołając, oświadczył: Ten był, o którym powiedziałem: Ten, który przychodzi po mnie, istniał przede mną, bo wcześniej był niż ja."
  tags: []
"J1,16":
  text: "A z Jego pełni my wszyscy wzięliśmy, i to łaskę za łaską."
  tags: []
"J1,17":
  text: "O ile bowiem Prawo zostało dane przez Mojżesza, o tyle łaska i prawda stała się przez Jezusa Chrystusa."
  tags: []
"J1,18":
  text: "Boga nikt nigdy nie widział; jednorodzony Syn, który jest w łonie Ojca, Ten nam o Nim opowiedział."
  tags: []
"J1,19":
  text: "A takie jest świadectwo Jana, gdy posłali Żydzi z Jerozolimy kapłanów i lewitów, aby go zapytać: Kim ty jesteś?"
  tags: []
"J1,20":
  text: "I wyznał, a nie zaprzeczył, mówiąc: Ja nie jestem Mesjaszem."
  tags: []
"J1,21":
  text: "I pytali go: Kim więc? Czy ty jesteś Eliaszem? A on odpowiedział: Nie jestem. Czy ty jesteś tym Prorokiem? I odpowiedział: Nie."
  tags: []
"J1,22":
  text: "Powiedzieli wtedy do niego: Kim więc jesteś, żebyśmy dali odpowiedź tym, którzy nas posłali. Co mówisz o sobie?"
  tags: []
"J1,23":
  text: "Powiedział: Ja jestem głosem wołającego na pustyni: Prostujcie drogę PANA, jak powiedział prorok Izajasz."
  tags: []
"J1,24":
  text: "A ci, którzy zostali wysłani, byli z faryzeuszów."
  tags: []
"J1,25":
  text: "I pytali go, i powiedzieli mu: Czemu więc chrzcisz, jeżeli ty nie jesteś Mesjaszem, ani Eliaszem, ani tym Prorokiem?"
  tags: []
"J1,26":
  text: "Jan odpowiedział im, mówiąc: Ja chrzczę w wodzie; ale pośrodku was stanął Ten, którego wy nie znacie."
  tags: []
"J1,27":
  text: "To jest Ten, który przychodzi po mnie, On istniał przede mną, któremu ja nie jestem godny, by rozwiązać rzemyk u Jego sandała."
  tags: []
"J1,28":
  text: "To działo się w Betabarze za Jordanem, gdzie Jan chrzcił."
  tags: []
"J1,29":
  text: "A nazajutrz, Jan ujrzał idącego do niego Jezusa i powiedział: Oto Baranek Boży, który zabiera grzech świata."
  tags: []
"J1,30":
  text: "To jest Ten, o którym ja powiedziałem: Za mną idzie mąż, który istniał przede mną, bo wcześniej był niż ja."
  tags: []
"J1,31":
  text: "A ja Go wcześniej nie znałem. Ja dlatego przyszedłem chrzcząc w wodzie, aby On został ukazany Izraelowi."
  tags: []
"J1,32":
  text: "A Jan poświadczył, mówiąc: Widziałem Ducha zstępującego jakby gołębica z nieba, i pozostał na Nim."
  tags: []
"J1,33":
  text: "A ja Go nie poznałem; lecz Ten, który mnie posłał, bym chrzcił w wodzie, Ten mi powiedział: Jeśli ujrzysz kogoś, na którego zstępuje i pozostaje na nim Duch, to jest Ten, który chrzci w Duchu Świętym."
  tags: []
"J1,34":
  text: "A ja widziałem i zaświadczyłem, że Ten jest Synem Bożym."
  tags: []
"J1,35":
  text: "Nazajutrz ponownie stał Jan i dwaj z jego uczniów."
  tags: []
"J1,36":
  text: "A przypatrując się przechodzącemu Jezusowi, powiedział: Oto Baranek Boży."
  tags: []
"J1,37":
  text: "I usłyszeli go ci dwaj uczniowie, gdy to mówił, i poszli za Jezusem."
  tags: []
"J1,38":
  text: "A Jezus odwrócił się i ujrzał ich idących za sobą, i powiedział do nich: Czego szukacie? A oni powiedzieli do Niego: Rabbi! Co znaczy w tłumaczeniu – Nauczycielu – gdzie mieszkasz?"
  tags: []
"J1,39":
  text: "Powiedział im: Chodźcie, a zobaczycie. Przyszli i zobaczyli, gdzie mieszkał, i tego dnia pozostali u Niego; a było około dziesiątej godziny."
  tags: []
"J1,40":
  text: "Jednym z tych dwóch, którzy to słyszeli od Jana i którzy podążali za Nim, był Andrzej, brat Szymona Piotra."
  tags: []
"J1,41":
  text: "Ten najpierw odszukał Szymona, swojego brata i powiedział mu: Znaleźliśmy Mesjasza, co tłumaczy się – Pomazańca."
  tags: []
"J1,42":
  text: "I przyprowadził go do Jezusa. A Jezus przyjrzawszy się mu, powiedział: Ty jesteś Szymon, syn Jonasza; ty będziesz nazwany Kefas, co tłumaczy się – Piotr."
  tags: []
"J1,43":
  text: "Nazajutrz chciał Jezus udać się do Galilei i znalazł Filipa, i powiedział mu: Pójdź za mną."
  tags: []
"J1,44":
  text: "A Filip był z Betsaidy, z miasta Andrzeja i Piotra."
  tags: []
"J1,45":
  text: "Filip odnalazł Natanaela i powiedział mu: Znaleźliśmy Tego, o którym pisał Mojżesz w Prawie i Prorocy, Jezusa, syna Józefa z Nazaretu."
  tags: []
"J1,46":
  text: "I powiedział mu Natanael: Czy z Nazaretu może być coś dobrego? Filip na to: Chodź i zobacz!"
  tags: []
"J1,47":
  text: "Gdy Jezus ujrzał Natanaela idącego do Niego, powiedział o nim: Oto prawdziwie Izraelita, w którym nie ma podstępu."
  tags: []
"J1,48":
  text: "Natanael powiedział do Niego: Skąd mnie znasz? W odpowiedzi, Jezus rzekł mu: Zanim zawołał cię Filip, widziałem cię, gdy byłeś pod figowcem."
  tags: []
"J1,49":
  text: "Wtedy Natanael powiedział do Niego: Rabbi! Ty jesteś Synem Bożym, Ty jesteś Królem Izraela."
  tags: []
"J1,50":
  text: "A Jezus powiedział do niego: Wierzysz dlatego, że powiedziałem ci: Widziałem cię pod figowcem. Ujrzysz większe rzeczy niż te."
  tags: []
"J1,51":
  text: "I powiedział mu: Zaprawdę, zaprawdę mówię wam: Od teraz ujrzycie otwarte niebo i aniołów Boga wstępujących i zstępujących na Syna Człowieczego."
  tags: []
