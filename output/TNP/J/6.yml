"J6,1":
  text: "Potem oddalił się Jezus na drugi brzeg Morza Galilejskiego, czyli Tyberiadzkiego."
  tags: []
"J6,2":
  text: "A podążał za Nim wielki tłum, bo widzieli Jego cudowne znaki, które czynił na chorych."
  tags: []
"J6,3":
  text: "I Jezus wszedł na górę, i siedział tam ze swoimi uczniami;"
  tags: []
"J6,4":
  text: "A była blisko Pascha, święto żydowskie."
  tags: []
"J6,5":
  text: "Wtedy Jezus podniósł oczy i ujrzał, że wielki tłum idzie do Niego, i powiedział do Filipa: Gdzie kupimy chleba, aby oni mogli się najeść?"
  tags: []
"J6,6":
  text: "A mówił to, aby go poddać próbie; bo sam wiedział, co miał czynić."
  tags: []
"J6,7":
  text: "Filip odpowiedział Mu: Chleba za dwieście denarów nie wystarczy dla nich, aby każdy z nich otrzymał choć trochę."
  tags: []
"J6,8":
  text: "Jeden z Jego uczniów, Andrzej, brat Szymona Piotra, powiedział do Niego:"
  tags: []
"J6,9":
  text: "Jest tu jeden chłopczyk, który ma pięć chlebów jęczmiennych i dwie ryby; ale cóż to jest na tak wielu?"
  tags: []
"J6,10":
  text: "A Jezus powiedział: Każcie, by ludzie spoczęli. A było w tym miejscu dużo trawy, i spoczęli mężczyźni w liczbie około pięciu tysięcy."
  tags: []
"J6,11":
  text: "Wziął więc Jezus chleby, podziękował i rozdał uczniom, a uczniowie siedzącym; podobnie uczynił i z rybami, ile tylko chcieli."
  tags: []
"J6,12":
  text: "A gdy byli nasyceni, powiedział swoim uczniom: Zbierzcie pozostałe kawałki, aby nic nie przepadło."
  tags: []
"J6,13":
  text: "Zebrali więc i napełnili dwanaście koszy kawałków z tych pięciu jęczmiennych chlebów, które pozostały po jedzących."
  tags: []
"J6,14":
  text: "Gdy więc ludzie ujrzeli cudowny znak, który uczynił Jezus, mówili: Ten prawdziwie jest prorokiem, który przychodzi na świat."
  tags: []
"J6,15":
  text: "Gdy więc Jezus poznał, że zamierzają przyjść i Go porwać, aby uczynić Go królem, sam jeden oddalił się ponownie na górę."
  tags: []
"J6,16":
  text: "A gdy nastał wieczór, zeszli Jego uczniowie nad morze."
  tags: []
"J6,17":
  text: "I gdy wstąpili do łodzi, wyruszyli na drugą stronę morza do Kafarnaum. I nastała ciemność, a Jezus jeszcze nie przybył do nich."
  tags: []
"J6,18":
  text: "Morze natomiast burzyło się, bo wiał silny wiatr."
  tags: []
"J6,19":
  text: "Gdy więc przepłynęli około dwadzieścia pięć albo trzydzieści stadiów, ujrzeli Jezusa idącego po morzu i zbliżającego się do łodzi; i zlękli się."
  tags: []
"J6,20":
  text: "A On im powiedział: Ja jestem, nie bójcie się."
  tags: []
"J6,21":
  text: "I chcieli Go wziąć do łodzi, a łódź od razu znalazła się przy lądzie, do którego zmierzali."
  tags: []
"J6,22":
  text: "Nazajutrz tłum, stojący na drugim brzegu morza, zauważył, że tam nie było innej łódki, tylko ta jedna, do której wstąpili Jego uczniowie, i że Jezus nie wstąpił do łodzi razem ze swoimi uczniami, ale uczniowie Jego odeszli sami;"
  tags: []
"J6,23":
  text: "A przypłynęły i inne łodzie z Tyberiady, blisko miejsca, gdzie jedli chleb, nad którym Pan uczynił dziękczynienie."
  tags: []
"J6,24":
  text: "Gdy więc lud zobaczył, że nie ma tam Jezusa, ani Jego uczniów, i oni wstąpili do łódek i przybyli do Kafarnaum, szukając Jezusa."
  tags: []
"J6,25":
  text: "I gdy znaleźli Go na drugim brzegu morza, powiedzieli do Niego: Rabbi! Kiedy tu się zjawiłeś?"
  tags: []
"J6,26":
  text: "Jezus w odpowiedzi, rzekł im: Zaprawdę, zaprawdę mówię wam: Szukacie mnie nie dlatego, że widzieliście cudowne znaki, ale że jedliście chleb i zostaliście nasyceni."
  tags: []
"J6,27":
  text: "Zabiegajcie nie o pokarm, który ginie, ale o pokarm, który trwa ku życiu wiecznemu, który wam da Syn Człowieczy; na Nim bowiem Bóg Ojciec położył pieczęć."
  tags: []
"J6,28":
  text: "Powiedzieli więc do Niego: Co mamy czynić, by trudzić się dziełami Boga?"
  tags: []
"J6,29":
  text: "Jezus w odpowiedzi, rzekł im: To jest dzieło Boga, abyście wierzyli w Tego, którego On posłał."
  tags: []
"J6,30":
  text: "W związku z tym, powiedzieli do Niego: Jaki więc cudowny znak uczynisz, byśmy widzieli i wierzyli Tobie? Co zrobisz?"
  tags: []
"J6,31":
  text: "Ojcowie nasi jedli mannę na pustyni, jak jest napisane: Dał im chleb z nieba, aby jedli."
  tags: []
"J6,32":
  text: "Jezus więc powiedział im: Zaprawdę mówię wam: Nie Mojżesz dał wam chleb z nieba, ale Ojciec mój daje wam prawdziwy chleb z nieba."
  tags: []
"J6,33":
  text: "Bo chlebem Bożym jest Ten, który zstępuje z nieba i daje życie światu."
  tags: []
"J6,34":
  text: "Powiedzieli więc do Niego: Panie! Daj nam zawsze tego chleba."
  tags: []
"J6,35":
  text: "I Jezus powiedział im: Ja jestem tym chlebem życia; kto do mnie przychodzi, nigdy nie zazna głodu, a wierzący we mnie, nigdy nie zazna pragnienia."
  tags: []
"J6,36":
  text: "Lecz powiedziałem wam, że już widzieliście mnie, i nie wierzycie."
  tags: []
"J6,37":
  text: "Wszystko, co mi daje Ojciec, przyjdzie do mnie; a tego który przychodzi do mnie, nie wyrzucę precz;"
  tags: []
"J6,38":
  text: "Bo zstąpiłem z nieba, nie żebym czynił swoją wolę, ale wolę Tego, który mnie posłał."
  tags: []
"J6,39":
  text: "A taka jest wola Tego, który mnie posłał, Ojca, abym z tego wszystkiego, co mi dał, nic nie stracił, lecz wzbudził to w dniu ostatecznym."
  tags: []
"J6,40":
  text: "A taka jest wola Tego, który mnie posłał, aby każdy, kto widzi Syna i wierzy w Niego, miał życie wieczne; a ja go wzbudzę w dniu ostatecznym."
  tags: []
"J6,41":
  text: "Szemrali więc Żydzi przeciw Niemu, bo powiedział: Ja jestem chlebem, który zstąpił z nieba."
  tags: []
"J6,42":
  text: "I mówili: Czy to nie jest Jezus, syn Józefa, którego ojca i matkę my znamy; jak więc mówi On teraz: Zstąpiłem z nieba?"
  tags: []
"J6,43":
  text: "Jezus więc w odpowiedzi, rzekł im: Nie szemrajcie między sobą;"
  tags: []
"J6,44":
  text: "Nikt nie może przyjść do mnie, jeśli go nie pociągnie Ojciec mój, który mnie posłał; a ja go wzbudzę w dniu ostatecznym."
  tags: []
"J6,45":
  text: "W Prorokach jest napisane: I będą wszyscy wyuczeni przez Boga. Każdy więc, kto słyszał od Ojca i przyjął pouczenie, przychodzi do mnie."
  tags: []
"J6,46":
  text: "Nie, żeby ktoś widział Ojca, jak tylko Ten, który jest od Boga; Ten widział Ojca."
  tags: []
"J6,47":
  text: "Zaprawdę, zaprawdę mówię wam: Kto wierzy we mnie, ma życie wieczne."
  tags: []
"J6,48":
  text: "Ja jestem chlebem życia."
  tags: []
"J6,49":
  text: "Ojcowie wasi zjedli mannę na pustyni i pomarli."
  tags: []
"J6,50":
  text: "A to jest chleb, który z nieba zstępuje, aby ktoś, kto z Niego spożył, nie umarł."
  tags: []
"J6,51":
  text: "Ja jestem chlebem żywym, który zstąpił z nieba; jeśli ktoś będzie jeść z tego chleba, żyć będzie na wieki; a chleb, który ja dam, to moje ciało, które ja dam za życie świata."
  tags: []
"J6,52":
  text: "Sprzeczali się więc między sobą Żydzi, mówiąc: Jak On może dać nam do jedzenia swoje ciało?"
  tags: []
"J6,53":
  text: "Jezus więc powiedział im: Zaprawdę, zaprawdę mówię wam: Jeśli nie spożyjecie ciała Syna Człowieczego, i nie wypijecie krwi Jego, nie macie życia w sobie."
  tags: []
"J6,54":
  text: "Kto spożywa moje ciało i pije moją krew, ma życie wieczne, a ja go wzbudzę w dniu ostatecznym."
  tags: []
"J6,55":
  text: "Gdyż moje ciało prawdziwie jest pokarmem, a moja krew prawdziwie jest napojem."
  tags: []
"J6,56":
  text: "Kto spożywa moje ciało i pije moją krew, we mnie mieszka, a ja w nim."
  tags: []
"J6,57":
  text: "Jak mnie posłał Ojciec, który żyje, i ja żyję przez Ojca, tak i ten, kto mnie spożywa, żyć będzie przeze mnie."
  tags: []
"J6,58":
  text: "To jest chleb, który z nieba zstąpił; nie tak, jak ojcowie wasi zjedli mannę i umarli; kto spożywa ten chleb, żyć będzie na wieki."
  tags: []
"J6,59":
  text: "To powiedział w synagodze, ucząc w Kafarnaum."
  tags: []
"J6,60":
  text: "Wtedy wielu z Jego uczniów, po usłyszeniu tych słów, powiedziało: Twarde jest to słowo, któż je może słuchać?"
  tags: []
"J6,61":
  text: "Ale Jezus, świadom w swym wnętrzu, że Jego uczniowie z tego powodu szemrzą, powiedział do nich: To was gorszy?"
  tags: []
"J6,62":
  text: "Co więc, gdy ujrzycie Syna Człowieczego wstępującego tam, gdzie był wcześniej?"
  tags: []
"J6,63":
  text: "Duch jest tym, który ożywia; ciało nic nie pomaga; słowa, które ja wam mówię, są duchem i są życiem."
  tags: []
"J6,64":
  text: "Ale są pośród was tacy, którzy nie wierzą. Jezus bowiem wiedział od początku, kim są ci, co nie wierzą, i kim jest ten, co Go wyda;"
  tags: []
"J6,65":
  text: "I mówił: Dlatego wam powiedziałem, że nikt nie może przyjść do mnie, jeśli nie jest mu to dane od mojego Ojca."
  tags: []
"J6,66":
  text: "Od tego czasu wielu Jego uczniów zawróciło i więcej z Nim nie chodziło."
  tags: []
"J6,67":
  text: "Jezus powiedział wtedy do dwunastu: Czy i wy chcecie odejść?"
  tags: []
"J6,68":
  text: "I odpowiedział Mu Szymon Piotr: Panie! Do kogo pójdziemy? Ty masz słowa życia wiecznego,"
  tags: []
"J6,69":
  text: "A my uwierzyliśmy i poznaliśmy, że Ty jesteś Mesjasz – Syn Boga żywego."
  tags: []
"J6,70":
  text: "Jezus odpowiedział im: Czy nie ja wybrałem was dwunastu? A jeden z was jest diabłem."
  tags: []
"J6,71":
  text: "A to mówił o Judaszu, synu Szymona Iskarioty; bo ten miał zamiar Go wydać, będąc jednym z dwunastu."
  tags: []
