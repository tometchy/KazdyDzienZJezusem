"J6,1": "Potem oddalił się Jezus na drugi brzeg Morza Galilejskiego, czyli Tyberiadzkiego."
"J6,2": "A podążał za Nim wielki tłum, bo widzieli Jego cudowne znaki, które czynił na chorych."
"J6,3": "I Jezus wszedł na górę, i siedział tam ze swoimi uczniami;"
"J6,4": "A była blisko Pascha, święto żydowskie."
"J6,5": "Wtedy Jezus podniósł oczy i ujrzał, że wielki tłum idzie do Niego, i powiedział do Filipa: Gdzie kupimy chleba, aby oni mogli się najeść?"
"J6,6": "A mówił to, aby go poddać próbie; bo sam wiedział, co miał czynić."
"J6,7": "Filip odpowiedział Mu: Chleba za dwieście denarów nie wystarczy dla nich, aby każdy z nich otrzymał choć trochę."
"J6,8": "Jeden z Jego uczniów, Andrzej, brat Szymona Piotra, powiedział do Niego:"
"J6,9": "Jest tu jeden chłopczyk, który ma pięć chlebów jęczmiennych i dwie ryby; ale cóż to jest na tak wielu?"
"J6,10": "A Jezus powiedział: Każcie, by ludzie spoczęli. A było w tym miejscu dużo trawy, i spoczęli mężczyźni w liczbie około pięciu tysięcy."
"J6,11": "Wziął więc Jezus chleby, podziękował i rozdał uczniom, a uczniowie siedzącym; podobnie uczynił i z rybami, ile tylko chcieli."
"J6,12": "A gdy byli nasyceni, powiedział swoim uczniom: Zbierzcie pozostałe kawałki, aby nic nie przepadło."
"J6,13": "Zebrali więc i napełnili dwanaście koszy kawałków z tych pięciu jęczmiennych chlebów, które pozostały po jedzących."
"J6,14": "Gdy więc ludzie ujrzeli cudowny znak, który uczynił Jezus, mówili: Ten prawdziwie jest prorokiem, który przychodzi na świat."
"J6,15": "Gdy więc Jezus poznał, że zamierzają przyjść i Go porwać, aby uczynić Go królem, sam jeden oddalił się ponownie na górę."
"J6,16": "A gdy nastał wieczór, zeszli Jego uczniowie nad morze."
"J6,17": "I gdy wstąpili do łodzi, wyruszyli na drugą stronę morza do Kafarnaum. I nastała ciemność, a Jezus jeszcze nie przybył do nich."
"J6,18": "Morze natomiast burzyło się, bo wiał silny wiatr."
"J6,19": "Gdy więc przepłynęli około dwadzieścia pięć albo trzydzieści stadiów, ujrzeli Jezusa idącego po morzu i zbliżającego się do łodzi; i zlękli się."
"J6,20": "A On im powiedział: Ja jestem, nie bójcie się."
"J6,21": "I chcieli Go wziąć do łodzi, a łódź od razu znalazła się przy lądzie, do którego zmierzali."
"J6,22": "Nazajutrz tłum, stojący na drugim brzegu morza, zauważył, że tam nie było innej łódki, tylko ta jedna, do której wstąpili Jego uczniowie, i że Jezus nie wstąpił do łodzi razem ze swoimi uczniami, ale uczniowie Jego odeszli sami;"
"J6,23": "A przypłynęły i inne łodzie z Tyberiady, blisko miejsca, gdzie jedli chleb, nad którym Pan uczynił dziękczynienie."
"J6,24": "Gdy więc lud zobaczył, że nie ma tam Jezusa, ani Jego uczniów, i oni wstąpili do łódek i przybyli do Kafarnaum, szukając Jezusa."
"J6,25": "I gdy znaleźli Go na drugim brzegu morza, powiedzieli do Niego: Rabbi! Kiedy tu się zjawiłeś?"
"J6,26": "Jezus w odpowiedzi, rzekł im: Zaprawdę, zaprawdę mówię wam: Szukacie mnie nie dlatego, że widzieliście cudowne znaki, ale że jedliście chleb i zostaliście nasyceni."
"J6,27": "Zabiegajcie nie o pokarm, który ginie, ale o pokarm, który trwa ku życiu wiecznemu, który wam da Syn Człowieczy; na Nim bowiem Bóg Ojciec położył pieczęć."
"J6,28": "Powiedzieli więc do Niego: Co mamy czynić, by trudzić się dziełami Boga?"
"J6,29": "Jezus w odpowiedzi, rzekł im: To jest dzieło Boga, abyście wierzyli w Tego, którego On posłał."
"J6,30": "W związku z tym, powiedzieli do Niego: Jaki więc cudowny znak uczynisz, byśmy widzieli i wierzyli Tobie? Co zrobisz?"
"J6,31": "Ojcowie nasi jedli mannę na pustyni, jak jest napisane: Dał im chleb z nieba, aby jedli."
"J6,32": "Jezus więc powiedział im: Zaprawdę mówię wam: Nie Mojżesz dał wam chleb z nieba, ale Ojciec mój daje wam prawdziwy chleb z nieba."
"J6,33": "Bo chlebem Bożym jest Ten, który zstępuje z nieba i daje życie światu."
"J6,34": "Powiedzieli więc do Niego: Panie! Daj nam zawsze tego chleba."
"J6,35": "I Jezus powiedział im: Ja jestem tym chlebem życia; kto do mnie przychodzi, nigdy nie zazna głodu, a wierzący we mnie, nigdy nie zazna pragnienia."
"J6,36": "Lecz powiedziałem wam, że już widzieliście mnie, i nie wierzycie."
"J6,37": "Wszystko, co mi daje Ojciec, przyjdzie do mnie; a tego który przychodzi do mnie, nie wyrzucę precz;"
"J6,38": "Bo zstąpiłem z nieba, nie żebym czynił swoją wolę, ale wolę Tego, który mnie posłał."
"J6,39": "A taka jest wola Tego, który mnie posłał, Ojca, abym z tego wszystkiego, co mi dał, nic nie stracił, lecz wzbudził to w dniu ostatecznym."
"J6,40": "A taka jest wola Tego, który mnie posłał, aby każdy, kto widzi Syna i wierzy w Niego, miał życie wieczne; a ja go wzbudzę w dniu ostatecznym."
"J6,41": "Szemrali więc Żydzi przeciw Niemu, bo powiedział: Ja jestem chlebem, który zstąpił z nieba."
"J6,42": "I mówili: Czy to nie jest Jezus, syn Józefa, którego ojca i matkę my znamy; jak więc mówi On teraz: Zstąpiłem z nieba?"
"J6,43": "Jezus więc w odpowiedzi, rzekł im: Nie szemrajcie między sobą;"
"J6,44": "Nikt nie może przyjść do mnie, jeśli go nie pociągnie Ojciec mój, który mnie posłał; a ja go wzbudzę w dniu ostatecznym."
"J6,45": "W Prorokach jest napisane: I będą wszyscy wyuczeni przez Boga. Każdy więc, kto słyszał od Ojca i przyjął pouczenie, przychodzi do mnie."
"J6,46": "Nie, żeby ktoś widział Ojca, jak tylko Ten, który jest od Boga; Ten widział Ojca."
"J6,47": "Zaprawdę, zaprawdę mówię wam: Kto wierzy we mnie, ma życie wieczne."
"J6,48": "Ja jestem chlebem życia."
"J6,49": "Ojcowie wasi zjedli mannę na pustyni i pomarli."
"J6,50": "A to jest chleb, który z nieba zstępuje, aby ktoś, kto z Niego spożył, nie umarł."
"J6,51": "Ja jestem chlebem żywym, który zstąpił z nieba; jeśli ktoś będzie jeść z tego chleba, żyć będzie na wieki; a chleb, który ja dam, to moje ciało, które ja dam za życie świata."
"J6,52": "Sprzeczali się więc między sobą Żydzi, mówiąc: Jak On może dać nam do jedzenia swoje ciało?"
"J6,53": "Jezus więc powiedział im: Zaprawdę, zaprawdę mówię wam: Jeśli nie spożyjecie ciała Syna Człowieczego, i nie wypijecie krwi Jego, nie macie życia w sobie."
"J6,54": "Kto spożywa moje ciało i pije moją krew, ma życie wieczne, a ja go wzbudzę w dniu ostatecznym."
"J6,55": "Gdyż moje ciało prawdziwie jest pokarmem, a moja krew prawdziwie jest napojem."
"J6,56": "Kto spożywa moje ciało i pije moją krew, we mnie mieszka, a ja w nim."
"J6,57": "Jak mnie posłał Ojciec, który żyje, i ja żyję przez Ojca, tak i ten, kto mnie spożywa, żyć będzie przeze mnie."
"J6,58": "To jest chleb, który z nieba zstąpił; nie tak, jak ojcowie wasi zjedli mannę i umarli; kto spożywa ten chleb, żyć będzie na wieki."
"J6,59": "To powiedział w synagodze, ucząc w Kafarnaum."
"J6,60": "Wtedy wielu z Jego uczniów, po usłyszeniu tych słów, powiedziało: Twarde jest to słowo, któż je może słuchać?"
"J6,61": "Ale Jezus, świadom w swym wnętrzu, że Jego uczniowie z tego powodu szemrzą, powiedział do nich: To was gorszy?"
"J6,62": "Co więc, gdy ujrzycie Syna Człowieczego wstępującego tam, gdzie był wcześniej?"
"J6,63": "Duch jest tym, który ożywia; ciało nic nie pomaga; słowa, które ja wam mówię, są duchem i są życiem."
"J6,64": "Ale są pośród was tacy, którzy nie wierzą. Jezus bowiem wiedział od początku, kim są ci, co nie wierzą, i kim jest ten, co Go wyda;"
"J6,65": "I mówił: Dlatego wam powiedziałem, że nikt nie może przyjść do mnie, jeśli nie jest mu to dane od mojego Ojca."
"J6,66": "Od tego czasu wielu Jego uczniów zawróciło i więcej z Nim nie chodziło."
"J6,67": "Jezus powiedział wtedy do dwunastu: Czy i wy chcecie odejść?"
"J6,68": "I odpowiedział Mu Szymon Piotr: Panie! Do kogo pójdziemy? Ty masz słowa życia wiecznego,"
"J6,69": "A my uwierzyliśmy i poznaliśmy, że Ty jesteś Mesjasz – Syn Boga żywego."
"J6,70": "Jezus odpowiedział im: Czy nie ja wybrałem was dwunastu? A jeden z was jest diabłem."
"J6,71": "A to mówił o Judaszu, synu Szymona Iskarioty; bo ten miał zamiar Go wydać, będąc jednym z dwunastu."
