"J2,1":
  text: "A trzeciego dnia odbywało się wesele w Kanie Galilejskiej i była tam matka Jezusa."
  tags: []
"J2,2":
  text: "Został też zaproszony na wesele Jezus i Jego uczniowie."
  tags: []
"J2,3":
  text: "A gdy zabrakło wina, powiedziała matka Jezusa do Niego: Nie mają wina."
  tags: []
"J2,4":
  text: "Jezus powiedział jej: Co mnie i tobie, kobieto? Jeszcze nie nadeszła moja godzina."
  tags: []
"J2,5":
  text: "Matka Jego powiedziała do sług: Cokolwiek wam powie, czyńcie."
  tags: []
"J2,6":
  text: "A było tam sześć stągwi kamiennych, postawionych według żydowskiego zwyczaju oczyszczenia, mieszczących w sobie każda po dwie lub trzy miary."
  tags: []
"J2,7":
  text: "Jezus powiedział im: Napełnijcie te stągwie wodą. I napełnili je aż po brzegi."
  tags: []
"J2,8":
  text: "I powiedział im: Zaczerpnijcie teraz i zanieście staroście wesela. I zanieśli."
  tags: []
"J2,9":
  text: "A gdy starosta wesela skosztował tej wody, która stała się winem – a nie wiedział, skąd ona jest, lecz słudzy wiedzieli, ci co czerpali wodę – zawołał oblubieńca,"
  tags: []
"J2,10":
  text: "I powiedział do niego: Każdy człowiek stawia najpierw dobre wino, a gdy sobie podpiją, wtedy gorsze; ty zachowałeś dobre wino aż dotąd."
  tags: []
"J2,11":
  text: "Taki to pierwszy z cudownych znaków uczynił Jezus w Kanie Galilejskiej i tam ukazał swoją chwałę; a Jego uczniowie uwierzyli w Niego."
  tags: []
"J2,12":
  text: "Potem zeszli do Kafarnaum, On sam, Jego matka, Jego bracia i Jego uczniowie; tam pozostali kilka dni;"
  tags: []
"J2,13":
  text: "A była blisko Pascha żydowska; i Jezus wstąpił do Jerozolimy."
  tags: []
"J2,14":
  text: "I znalazł w świątyni sprzedających woły, owce, gołębie i zajmujących swoje miejsca bankierów."
  tags: []
"J2,15":
  text: "I uczynił bicz z powrozów, i wypędził wszystkich ze świątyni, także owce i woły, a bankierom porozsypywał monety i powywracał stoły,"
  tags: []
"J2,16":
  text: "A tym, co sprzedawali gołębie, powiedział: Zabierzcie je stąd, nie czyńcie domu Ojca mojego domem targu."
  tags: []
"J2,17":
  text: "I przypomnieli sobie Jego uczniowie, że jest napisane: Gorliwość o Twój dom pochłonęła mnie."
  tags: []
"J2,18":
  text: "Wtedy Żydzi zwrócili się do Niego, mówiąc: Jakim znakiem dowiedziesz, że możesz to czynić?"
  tags: []
"J2,19":
  text: "W odpowiedzi, Jezus rzekł im: Zburzcie tę świątynię, a ja wzniosę ją w trzy dni."
  tags: []
"J2,20":
  text: "Powiedzieli więc Żydzi: Tę świątynię budowano czterdzieści sześć lat, a Ty wzniesiesz ją w trzy dni?"
  tags: []
"J2,21":
  text: "Ale On mówił o świątyni swojego ciała."
  tags: []
"J2,22":
  text: "Gdy więc został wzbudzony z martwych, Jego uczniowie przypomnieli sobie, że im to mówił; i uwierzyli Pismu i słowu, które wypowiedział Jezus."
  tags: []
"J2,23":
  text: "A gdy był w Jerozolimie w święto Paschy, wielu uwierzyło w Jego imię, widząc cudowne znaki, które czynił."
  tags: []
"J2,24":
  text: "Ale Jezus nie powierzał im samego siebie, dlatego że On znał wszystkich,"
  tags: []
"J2,25":
  text: "I dlatego, że nie miał potrzeby, aby ktoś zaświadczył Mu o człowieku; albowiem sam wiedział, co jest w człowieku."
  tags: []
