"J2,1": "A trzeciego dnia odbywało się wesele w Kanie Galilejskiej i była tam matka Jezusa."
"J2,2": "Został też zaproszony na wesele Jezus i Jego uczniowie."
"J2,3": "A gdy zabrakło wina, powiedziała matka Jezusa do Niego: Nie mają wina."
"J2,4": "Jezus powiedział jej: Co mnie i tobie, kobieto? Jeszcze nie nadeszła moja godzina."
"J2,5": "Matka Jego powiedziała do sług: Cokolwiek wam powie, czyńcie."
"J2,6": "A było tam sześć stągwi kamiennych, postawionych według żydowskiego zwyczaju oczyszczenia, mieszczących w sobie każda po dwie lub trzy miary."
"J2,7": "Jezus powiedział im: Napełnijcie te stągwie wodą. I napełnili je aż po brzegi."
"J2,8": "I powiedział im: Zaczerpnijcie teraz i zanieście staroście wesela. I zanieśli."
"J2,9": "A gdy starosta wesela skosztował tej wody, która stała się winem – a nie wiedział, skąd ona jest, lecz słudzy wiedzieli, ci co czerpali wodę – zawołał oblubieńca,"
"J2,10": "I powiedział do niego: Każdy człowiek stawia najpierw dobre wino, a gdy sobie podpiją, wtedy gorsze; ty zachowałeś dobre wino aż dotąd."
"J2,11": "Taki to pierwszy z cudownych znaków uczynił Jezus w Kanie Galilejskiej i tam ukazał swoją chwałę; a Jego uczniowie uwierzyli w Niego."
"J2,12": "Potem zeszli do Kafarnaum, On sam, Jego matka, Jego bracia i Jego uczniowie; tam pozostali kilka dni;"
"J2,13": "A była blisko Pascha żydowska; i Jezus wstąpił do Jerozolimy."
"J2,14": "I znalazł w świątyni sprzedających woły, owce, gołębie i zajmujących swoje miejsca bankierów."
"J2,15": "I uczynił bicz z powrozów, i wypędził wszystkich ze świątyni, także owce i woły, a bankierom porozsypywał monety i powywracał stoły,"
"J2,16": "A tym, co sprzedawali gołębie, powiedział: Zabierzcie je stąd, nie czyńcie domu Ojca mojego domem targu."
"J2,17": "I przypomnieli sobie Jego uczniowie, że jest napisane: Gorliwość o Twój dom pochłonęła mnie."
"J2,18": "Wtedy Żydzi zwrócili się do Niego, mówiąc: Jakim znakiem dowiedziesz, że możesz to czynić?"
"J2,19": "W odpowiedzi, Jezus rzekł im: Zburzcie tę świątynię, a ja wzniosę ją w trzy dni."
"J2,20": "Powiedzieli więc Żydzi: Tę świątynię budowano czterdzieści sześć lat, a Ty wzniesiesz ją w trzy dni?"
"J2,21": "Ale On mówił o świątyni swojego ciała."
"J2,22": "Gdy więc został wzbudzony z martwych, Jego uczniowie przypomnieli sobie, że im to mówił; i uwierzyli Pismu i słowu, które wypowiedział Jezus."
"J2,23": "A gdy był w Jerozolimie w święto Paschy, wielu uwierzyło w Jego imię, widząc cudowne znaki, które czynił."
"J2,24": "Ale Jezus nie powierzał im samego siebie, dlatego że On znał wszystkich,"
"J2,25": "I dlatego, że nie miał potrzeby, aby ktoś zaświadczył Mu o człowieku; albowiem sam wiedział, co jest w człowieku."
