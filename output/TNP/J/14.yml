"J14,1":
  text: "Niech się nie trwoży wasze serce; wierzcie w Boga i we mnie wierzcie."
  tags: []
"J14,2":
  text: "W domu mojego Ojca jest wiele mieszkań; gdyby było inaczej, to bym wam powiedział: Idę przygotować wam miejsce."
  tags: []
"J14,3":
  text: "A gdy odejdę i przygotuję wam miejsce, przyjdę ponownie i wezmę was do siebie, żebyście gdzie ja jestem, i wy byli."
  tags: []
"J14,4":
  text: "Wiecie dokąd ja idę i znacie drogę."
  tags: []
"J14,5":
  text: "Tomasz powiedział do Niego: Panie! Nie wiemy dokąd idziesz, jak więc możemy znać drogę?"
  tags: []
"J14,6":
  text: "Jezus więc powiedział do niego: Ja jestem droga, i prawda, i życie; nikt nie przychodzi do Ojca, jak tylko przeze mnie."
  tags: []
"J14,7":
  text: "Jeśli mnie poznaliście i Ojca mego poznaliście; i odtąd Go znacie i widzicie Go."
  tags: []
"J14,8":
  text: "Filip powiedział Mu: Panie! Pokaż nam Ojca, a to nam wystarczy."
  tags: []
"J14,9":
  text: "Jezus powiedział mu: Tyle czasu jestem z wami, a nie znasz mnie Filipie? Kto mnie widział, zaczął widzieć i mojego Ojca; jak ty możesz mówić: Pokaż nam Ojca?"
  tags: []
"J14,10":
  text: "Czy nie wierzysz, że ja jestem w Ojcu, a Ojciec jest we mnie? Słowa, które ja do was mówię, nie od siebie mówię; natomiast Ojciec, który mieszka we mnie, On czyni dzieła."
  tags: []
"J14,11":
  text: "Wierzcie mi, że ja jestem w Ojcu, a Ojciec jest we mnie; a jeżeli nie, to ze względu na te dzieła wierzcie mi."
  tags: []
"J14,12":
  text: "Zaprawdę, zaprawdę mówię wam: Kto wierzy we mnie, dzieła, które ja czynię, i on będzie czynić, i większe niż te będzie czynić; bo ja idę do mojego Ojca."
  tags: []
"J14,13":
  text: "I o cokolwiek będziecie prosić w moim imieniu, to uczynię, aby Ojciec w Synu został otoczony chwałą."
  tags: []
"J14,14":
  text: "Jeśli o cokolwiek będziecie prosić w moim imieniu, ja to uczynię."
  tags: []
"J14,15":
  text: "Jeśli mnie miłujecie, zachowajcie moje przykazania."
  tags: []
"J14,16":
  text: "I ja prosić będę Ojca, a da wam innego Opiekuna, aby przebywał z wami na wieki,"
  tags: []
"J14,17":
  text: "Ducha prawdy, którego świat nie może przyjąć, bo Go nie widzi, ani Go nie zna; lecz wy Go znacie, ponieważ przy was przebywa i w was będzie."
  tags: []
"J14,18":
  text: "Nie zostawię was sierotami; przyjdę do was."
  tags: []
"J14,19":
  text: "Jeszcze tylko chwila i świat nie będzie już mnie oglądać; lecz wy będziecie mnie oglądać; bo ja żyję i wy będziecie żyć."
  tags: []
"J14,20":
  text: "W tym dniu poznacie, że ja jestem w moim Ojcu, a wy we mnie, i ja w was."
  tags: []
"J14,21":
  text: "Kto ma moje przykazania i je zachowuje, ten mnie miłuje; a kto mnie miłuje, ten też zostanie umiłowany przez Ojca mojego, i ja będę go miłować, i objawię mu samego siebie."
  tags: []
"J14,22":
  text: "Judasz, nie Iskariota powiedział do Niego: Panie! Co się stało, że masz nam objawiać samego siebie, a nie światu?"
  tags: []
"J14,23":
  text: "Jezus w odpowiedzi, rzekł mu: Jeśli ktoś mnie miłuje, słowo moje będzie zachowywać; i mój Ojciec go umiłuje, i przyjdziemy do niego, i uczynimy u niego mieszkanie."
  tags: []
"J14,24":
  text: "Kto mnie nie miłuje, nie zachowuje moich słów; a słowo, którego słuchacie, nie jest moje, ale Ojca, który mnie posłał."
  tags: []
"J14,25":
  text: "To już wam powiedziałem, przebywając z wami."
  tags: []
"J14,26":
  text: "Lecz Opiekun, Duch Święty, którego pośle Ojciec w moim imieniu, On nauczy was wszystkiego i przypomni wam wszystko, co ja wam powiedziałem."
  tags: []
"J14,27":
  text: "Pokój zostawiam wam, pokój mój wam daję; nie tak jak daje świat, ja wam daję. Niech się nie trwoży serce wasze, ani niech się nie lęka."
  tags: []
"J14,28":
  text: "Słyszeliście, że wam powiedziałem: Odchodzę i powrócę do was. Gdybyście mnie miłowali, to byście się radowali, że wam powiedziałem: Idę do Ojca; bo Ojciec mój większy jest niż ja."
  tags: []
"J14,29":
  text: "A teraz powiedziałem wam zanim się to stanie, żebyście, gdy się to stanie, uwierzyli."
  tags: []
"J14,30":
  text: "Już niewiele będę z wami rozmawiał; albowiem idzie przywódca tego świata, ale on nic we mnie nie ma;"
  tags: []
"J14,31":
  text: "Ale aby poznał świat, że ja miłuję Ojca, i jak mi polecił Ojciec, tak czynię. Wstawajcie, chodźmy stąd."
  tags: []
