"J14,1": "Niech się nie trwoży wasze serce; wierzcie w Boga i we mnie wierzcie."
"J14,2": "W domu mojego Ojca jest wiele mieszkań; gdyby było inaczej, to bym wam powiedział: Idę przygotować wam miejsce."
"J14,3": "A gdy odejdę i przygotuję wam miejsce, przyjdę ponownie i wezmę was do siebie, żebyście gdzie ja jestem, i wy byli."
"J14,4": "Wiecie dokąd ja idę i znacie drogę."
"J14,5": "Tomasz powiedział do Niego: Panie! Nie wiemy dokąd idziesz, jak więc możemy znać drogę?"
"J14,6": "Jezus więc powiedział do niego: Ja jestem droga, i prawda, i życie; nikt nie przychodzi do Ojca, jak tylko przeze mnie."
"J14,7": "Jeśli mnie poznaliście i Ojca mego poznaliście; i odtąd Go znacie i widzicie Go."
"J14,8": "Filip powiedział Mu: Panie! Pokaż nam Ojca, a to nam wystarczy."
"J14,9": "Jezus powiedział mu: Tyle czasu jestem z wami, a nie znasz mnie Filipie? Kto mnie widział, zaczął widzieć i mojego Ojca; jak ty możesz mówić: Pokaż nam Ojca?"
"J14,10": "Czy nie wierzysz, że ja jestem w Ojcu, a Ojciec jest we mnie? Słowa, które ja do was mówię, nie od siebie mówię; natomiast Ojciec, który mieszka we mnie, On czyni dzieła."
"J14,11": "Wierzcie mi, że ja jestem w Ojcu, a Ojciec jest we mnie; a jeżeli nie, to ze względu na te dzieła wierzcie mi."
"J14,12": "Zaprawdę, zaprawdę mówię wam: Kto wierzy we mnie, dzieła, które ja czynię, i on będzie czynić, i większe niż te będzie czynić; bo ja idę do mojego Ojca."
"J14,13": "I o cokolwiek będziecie prosić w moim imieniu, to uczynię, aby Ojciec w Synu został otoczony chwałą."
"J14,14": "Jeśli o cokolwiek będziecie prosić w moim imieniu, ja to uczynię."
"J14,15": "Jeśli mnie miłujecie, zachowajcie moje przykazania."
"J14,16": "I ja prosić będę Ojca, a da wam innego Opiekuna, aby przebywał z wami na wieki,"
"J14,17": "Ducha prawdy, którego świat nie może przyjąć, bo Go nie widzi, ani Go nie zna; lecz wy Go znacie, ponieważ przy was przebywa i w was będzie."
"J14,18": "Nie zostawię was sierotami; przyjdę do was."
"J14,19": "Jeszcze tylko chwila i świat nie będzie już mnie oglądać; lecz wy będziecie mnie oglądać; bo ja żyję i wy będziecie żyć."
"J14,20": "W tym dniu poznacie, że ja jestem w moim Ojcu, a wy we mnie, i ja w was."
"J14,21": "Kto ma moje przykazania i je zachowuje, ten mnie miłuje; a kto mnie miłuje, ten też zostanie umiłowany przez Ojca mojego, i ja będę go miłować, i objawię mu samego siebie."
"J14,22": "Judasz, nie Iskariota powiedział do Niego: Panie! Co się stało, że masz nam objawiać samego siebie, a nie światu?"
"J14,23": "Jezus w odpowiedzi, rzekł mu: Jeśli ktoś mnie miłuje, słowo moje będzie zachowywać; i mój Ojciec go umiłuje, i przyjdziemy do niego, i uczynimy u niego mieszkanie."
"J14,24": "Kto mnie nie miłuje, nie zachowuje moich słów; a słowo, którego słuchacie, nie jest moje, ale Ojca, który mnie posłał."
"J14,25": "To już wam powiedziałem, przebywając z wami."
"J14,26": "Lecz Opiekun, Duch Święty, którego pośle Ojciec w moim imieniu, On nauczy was wszystkiego i przypomni wam wszystko, co ja wam powiedziałem."
"J14,27": "Pokój zostawiam wam, pokój mój wam daję; nie tak jak daje świat, ja wam daję. Niech się nie trwoży serce wasze, ani niech się nie lęka."
"J14,28": "Słyszeliście, że wam powiedziałem: Odchodzę i powrócę do was. Gdybyście mnie miłowali, to byście się radowali, że wam powiedziałem: Idę do Ojca; bo Ojciec mój większy jest niż ja."
"J14,29": "A teraz powiedziałem wam zanim się to stanie, żebyście, gdy się to stanie, uwierzyli."
"J14,30": "Już niewiele będę z wami rozmawiał; albowiem idzie przywódca tego świata, ale on nic we mnie nie ma;"
"J14,31": "Ale aby poznał świat, że ja miłuję Ojca, i jak mi polecił Ojciec, tak czynię. Wstawajcie, chodźmy stąd."
