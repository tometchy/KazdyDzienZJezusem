"J5,1":
  text: "Po tych dniach było święto żydowskie; i wstąpił Jezus do Jerozolimy."
  tags: []
"J5,2":
  text: "A jest w Jerozolimie przy Owczej bramie sadzawka, zwana po hebrajsku Betezda, mająca pięć portyków."
  tags: []
"J5,3":
  text: "W nich leżała wielka rzesza chorych, ślepych, chromych i sparaliżowanych, którzy oczekiwali na poruszenie wody."
  tags: []
"J5,4":
  text: "Albowiem anioł o pewnym czasie zstępował do sadzawki i poruszał wodę; pierwszy więc, kto wstąpił po poruszeniu wody, stawał się zdrowy, jakąkolwiek chorobą był złożony."
  tags: []
"J5,5":
  text: "A był tam pewien człowiek, chorujący od trzydziestu ośmiu lat."
  tags: []
"J5,6":
  text: "I gdy Jezus ujrzał go leżącego, i poznał, że już przez długi czas czeka, powiedział do niego: Czy chcesz stać się zdrowy?"
  tags: []
"J5,7":
  text: "Chory odpowiedział Mu: Panie! Nie ma człowieka, który wrzuciłby mnie do sadzawki, gdy woda zostanie poruszona; a gdy ja idę, inny przede mną wstępuje."
  tags: []
"J5,8":
  text: "Jezus powiedział mu: Wstań, weź swoje posłanie i chodź."
  tags: []
"J5,9":
  text: "I natychmiast stał się zdrowy ten człowiek, i wziął swoje posłanie, i chodził. A tego dnia był szabat,"
  tags: []
"J5,10":
  text: "Więc mówili Żydzi do uzdrowionego: Jest szabat, nie wolno ci nosić posłania."
  tags: []
"J5,11":
  text: "Odpowiedział im: Ten, który uczynił mnie zdrowym, powiedział mi: Weź swoje posłanie i chodź."
  tags: []
"J5,12":
  text: "I pytali go: Kim jest człowiek, który ci powiedział: Weź swoje posłanie i chodź?"
  tags: []
"J5,13":
  text: "A ten, który został uzdrowiony, nie wiedział, kto to jest; gdyż Jezus oddalił się od tłumu będącego na tym miejscu."
  tags: []
"J5,14":
  text: "Po tym znalazł go Jezus w świątyni i powiedział do niego: Oto stałeś się zdrowy; już więcej nie grzesz, aby nie stało ci się coś gorszego."
  tags: []
"J5,15":
  text: "Odszedł ów człowiek i oznajmił Żydom, że to był Jezus, który uczynił go zdrowym."
  tags: []
"J5,16":
  text: "I dlatego Żydzi prześladowali Jezusa, i dążyli do tego, aby Go zabić, bo to uczynił w szabat."
  tags: []
"J5,17":
  text: "A Jezus im odpowiedział: Ojciec mój aż dotąd działa, i ja działam."
  tags: []
"J5,18":
  text: "Dlatego tym bardziej Żydzi dążyli do tego, aby Go zabić, bo nie tylko rozluźniał rygor szabatu, ale i powiedział, że Bóg jest Jego Ojcem, i czynił siebie równym Bogu."
  tags: []
"J5,19":
  text: "W odpowiedzi więc, Jezus rzekł im: Zaprawdę, zaprawdę mówię wam: Nie może Syn sam od siebie nic uczynić, tylko to, co widzi, że czyni Ojciec; cokolwiek bowiem On czyni, to i Syn czyni to samo."
  tags: []
"J5,20":
  text: "Bo Ojciec miłuje Syna i ukazuje Mu wszystko, co sam czyni; i pokaże Mu większe dzieła niż te, abyście je podziwiali."
  tags: []
"J5,21":
  text: "Bo tak, jak Ojciec wzbudza umarłych i przywraca życie, tak i Syn, przywraca życie tym, którym chce."
  tags: []
"J5,22":
  text: "Bo Ojciec w ogóle nikogo nie sądzi, lecz wszelki sąd przekazał Synowi,"
  tags: []
"J5,23":
  text: "Aby wszyscy czcili Syna, tak jak czczą Ojca. Kto nie czci Syna, nie czci Ojca, który Go posłał."
  tags: []
"J5,24":
  text: "Zaprawdę, zaprawdę mówię wam: Kto słucha mojego słowa i wierzy Temu, który mnie posłał, ma życie wieczne i nie idzie na sąd, ale przeszedł ze śmierci do życia."
  tags: []
"J5,25":
  text: "Zaprawdę, zaprawdę mówię wam: Przyjdzie godzina, i teraz już jest, gdy umarli usłyszą głos Syna Bożego, i ci, którzy usłyszą, będą żyć."
  tags: []
"J5,26":
  text: "Bo jak Ojciec ma życie sam w sobie, tak i dał Synowi, aby miał życie sam w sobie."
  tags: []
"J5,27":
  text: "I dał Mu władzę i prawo sprawowania sądu, ponieważ jest Synem Człowieczym."
  tags: []
"J5,28":
  text: "Nie dziwcie się temu, bo nadchodzi godzina, w której wszyscy, którzy są w grobach, usłyszą Jego głos;"
  tags: []
"J5,29":
  text: "I wyjdą ci, którzy dobrze czynili, by powstać do życia; a ci, którzy podle czynili, by powstać na sąd."
  tags: []
"J5,30":
  text: "Ja nie mogę sam od siebie nic czynić. Tak, jak słyszę, tak sądzę, a mój sąd jest sprawiedliwy; bo nie szukam woli mojej, ale woli Tego, który mnie posłał – Ojca."
  tags: []
"J5,31":
  text: "Jeśli ja sam o sobie świadczę, moje świadectwo nie jest prawdziwe."
  tags: []
"J5,32":
  text: "Jest ktoś inny, który świadczy o mnie, i wiem, że świadectwo, które o mnie wydaje, jest prawdziwe."
  tags: []
"J5,33":
  text: "Wy posłaliście do Jana, a on zaświadczył o prawdzie."
  tags: []
"J5,34":
  text: "Ja natomiast nie przyjmuję świadectwa od człowieka, ale to mówię, abyście wy zostali zbawieni."
  tags: []
"J5,35":
  text: "On to był lampą, która płonie i świeci, a wy chcieliście do pewnego czasu radować się w jego świetle."
  tags: []
"J5,36":
  text: "A ja mam świadectwo większe niż Jana; gdyż dzieła, które mi dał Ojciec, bym je wykonał, te dzieła, które właśnie czynię, świadczą o mnie, że to Ojciec mnie wysyła."
  tags: []
"J5,37":
  text: "A Ten, który mnie posłał, Ojciec, sam świadczył o mnie. Ani głosu Jego nigdy nie słyszeliście, ani postaci Jego nie widzieliście,"
  tags: []
"J5,38":
  text: "I nie macie Jego Słowa w was mieszkającego; stąd też nie wierzycie Temu, którego On posłał."
  tags: []
"J5,39":
  text: "Badacie Pisma, bo wydaje się wam, że macie w nich życie wieczne; a one składają świadectwo o mnie."
  tags: []
"J5,40":
  text: "I nie chcecie przyjść do mnie, abyście mieli życie."
  tags: []
"J5,41":
  text: "Nie przyjmuję chwały od ludzi,"
  tags: []
"J5,42":
  text: "Ale wiem o was, że nie macie miłości Bożej w sobie."
  tags: []
"J5,43":
  text: "Ja przyszedłem w imieniu mojego Ojca, a nie przyjmujecie mnie; jeśli ktoś inny przyszedłby we własnym imieniu, tego przyjmiecie."
  tags: []
"J5,44":
  text: "Jak możecie wierzyć wy, którzy chwałę jedni od drugich przyjmujecie, a chwały samego Boga nie szukacie?"
  tags: []
"J5,45":
  text: "Niech nie wydaje się wam, że ja was będę oskarżał przed Ojcem; oskarża was Mojżesz, w którym wy pokładacie nadzieję."
  tags: []
"J5,46":
  text: "Jeśli bowiem uwierzyliście Mojżeszowi, uwierzyliście i mnie, gdyż on napisał o mnie."
  tags: []
"J5,47":
  text: "Jeśli jednak pismom jego nie wierzycie, jak uwierzycie moim słowom?"
  tags: []
