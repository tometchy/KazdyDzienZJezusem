"J8,1":
  text: "A Jezus poszedł na Górę Oliwną."
  tags: []
"J8,2":
  text: "Wczesnym rankiem natomiast ponownie przyszedł do świątyni, a cały lud zszedł się do Niego; a gdy On usiadł, nauczał ich."
  tags: []
"J8,3":
  text: "I przyprowadzili do Niego uczeni w Piśmie i faryzeusze kobietę schwytaną na cudzołóstwie, i postawili ją na środku,"
  tags: []
"J8,4":
  text: "Mówiąc do Niego: Nauczycielu! Tę kobietę pojmano w chwili, gdy cudzołożyła;"
  tags: []
"J8,5":
  text: "A w Prawie Mojżesz nakazał nam takie kamienować; a Ty co mówisz?"
  tags: []
"J8,6":
  text: "A to mówili, aby wystawić Go na próbę, aby mogli Go oskarżyć. A Jezus, schylił się i pisał palcem po ziemi, nie zwracając na nich uwagi."
  tags: []
"J8,7":
  text: "A gdy tak nalegali pytając Go, wyprostował się i powiedział do nich: Kto z was jest bez grzechu, niech pierwszy rzuci w nią kamieniem."
  tags: []
"J8,8":
  text: "I znowu schylił się i pisał po ziemi."
  tags: []
"J8,9":
  text: "A oni, gdy to usłyszeli, będąc przekonani przez sumienie, jeden po drugim wychodzili, poczynając od starszych aż do ostatnich, i został tylko sam Jezus i kobieta stojąca na środku."
  tags: []
"J8,10":
  text: "A Jezus wyprostował się, i nikogo nie widząc, tylko tę kobietę, powiedział jej: Kobieto! Gdzie są twoi oskarżyciele? Nikt cię nie potępił?"
  tags: []
"J8,11":
  text: "A ona powiedziała: Nikt, Panie! A Jezus powiedział jej: I ja cię nie potępiam; idź i więcej już nie grzesz."
  tags: []
"J8,12":
  text: "Wtedy ponownie Jezus powiedział im, mówiąc: Ja jestem światłem świata; kto za mną idzie, na pewno nie będzie chodził w ciemności, ale będzie miał światło życia."
  tags: []
"J8,13":
  text: "Powiedzieli więc do Niego faryzeusze: Ty sam o sobie świadczysz; świadectwo Twoje nie jest prawdziwe."
  tags: []
"J8,14":
  text: "Jezus w odpowiedzi, rzekł im: Nawet jeśli ja świadczę sam o sobie, to moje świadectwo jest prawdziwe, gdyż wiem, skąd przyszedłem i gdzie odchodzę; lecz wy nie wiecie, skąd przyszedłem i gdzie odchodzę."
  tags: []
"J8,15":
  text: "Wy sądzicie według ciała, ja nikogo nie sądzę."
  tags: []
"J8,16":
  text: "A nawet jeśli ja sądzę, sąd mój jest prawdziwy; gdyż nie jestem sam, ale jestem ja i Ten, który mnie posłał, Ojciec."
  tags: []
"J8,17":
  text: "A w Prawie waszym jest napisane, że świadectwo dwóch ludzi jest prawdziwe."
  tags: []
"J8,18":
  text: "Ja jestem tym, który sam świadczy o sobie i świadczy o mnie Ten, który mnie posłał, Ojciec."
  tags: []
"J8,19":
  text: "Wtedy powiedzieli do Niego: Gdzie jest twój ojciec? Jezus odpowiedział: Ani mnie nie znacie, ani mojego Ojca; gdybyście mnie poznali, znalibyście i mojego Ojca."
  tags: []
"J8,20":
  text: "Te słowa wypowiedział Jezus w skarbcu, ucząc w świątyni; i nikt Go nie pojmał, bo jeszcze nie nadeszła Jego godzina."
  tags: []
"J8,21":
  text: "Jezus powiedział im więc ponownie: Ja odchodzę i będziecie mnie szukać, i umrzecie w swoim grzechu; dokąd ja odchodzę, wy przyjść nie możecie."
  tags: []
"J8,22":
  text: "Mówili więc Żydzi: Czy sam siebie zabije, że mówi: Dokąd ja odchodzę, wy przyjść nie możecie?"
  tags: []
"J8,23":
  text: "I powiedział do nich: Wy jesteście z niskości, ja z wysokości; wy jesteście z tego świata, ja nie jestem z tego świata."
  tags: []
"J8,24":
  text: "Dlatego powiedziałem wam, że umrzecie w swoich grzechach; bo jeśli nie wierzycie, że ja jestem, umrzecie w swoich grzechach."
  tags: []
"J8,25":
  text: "Powiedzieli więc do Niego: Kim ty jesteś? I Jezus powiedział im: Tym, kim na początku wam powiedziałem."
  tags: []
"J8,26":
  text: "Wiele mam o was do powiedzenia i do sądzenia; ale Ten, który mnie posłał, jest prawdziwy, a ja, co usłyszałem od Niego, to mówię do świata."
  tags: []
"J8,27":
  text: "Ale nie zrozumieli, że im mówił o Ojcu."
  tags: []
"J8,28":
  text: "Jezus wtedy powiedział im: Gdy wywyższycie Syna Człowieczego, wtedy poznacie, że ja jestem, a nic sam z siebie nie czynię, ale jak nauczył mnie mój Ojciec, tak mówię."
  tags: []
"J8,29":
  text: "A Ten, który mnie posłał, jest ze mną; Ojciec nie zostawił mnie samego, bo ja zawsze czynię to, co Jemu się podoba."
  tags: []
"J8,30":
  text: "A gdy On o tym mówił, wielu uwierzyło w Niego."
  tags: []
"J8,31":
  text: "Mówił więc Jezus do tych Żydów, którzy Mu uwierzyli: Jeśli wytrwacie w moim słowie, prawdziwie jesteście moimi uczniami;"
  tags: []
"J8,32":
  text: "I poznacie prawdę, a prawda was wyzwoli."
  tags: []
"J8,33":
  text: "Odpowiedzieli Mu: My jesteśmy z potomstwa Abrahama i nigdy nie byliśmy niczyimi niewolnikami; jak Ty możesz mówić: Staniecie się wolni?"
  tags: []
"J8,34":
  text: "Jezus odpowiedział im: Zaprawdę, zaprawdę mówię wam: Każdy, kto popełnia grzech, jest niewolnikiem grzechu."
  tags: []
"J8,35":
  text: "A niewolnik nie zostaje w domu na wieki; Syn zostaje na wieki."
  tags: []
"J8,36":
  text: "Dlatego, jeśli Syn was wyzwoli, naprawdę będziecie wolni."
  tags: []
"J8,37":
  text: "Wiem, że jesteście potomstwem Abrahama; lecz dążycie do tego, aby mnie zabić, gdyż nie ma w was miejsca na moje słowo."
  tags: []
"J8,38":
  text: "Ja, co widziałem u mojego Ojca, to mówię; a wy czynicie to, co widzieliście u waszego ojca."
  tags: []
"J8,39":
  text: "W odpowiedzi, rzekli Mu: Ojcem naszym jest Abraham. Jezus powiedział im: Gdybyście byli synami Abrahama, czynilibyście dzieła Abrahama."
  tags: []
"J8,40":
  text: "Ale teraz dążycie do tego, aby mnie zabić, człowieka, który wam mówi prawdę, którą usłyszałem od Boga; tego Abraham nie czynił."
  tags: []
"J8,41":
  text: "Wy czynicie dzieła waszego ojca. Powiedzieli do Niego wtedy: My nie jesteśmy zrodzeni z nierządu; mamy jednego Ojca, Boga."
  tags: []
"J8,42":
  text: "Jezus wtedy powiedział im: Gdyby Bóg był waszym Ojcem, to byście mnie miłowali, ja bowiem wyszedłem od Boga i oto przybywam, bo nie przyszedłem od siebie samego, lecz On mnie posłał."
  tags: []
"J8,43":
  text: "Dlaczego mowy mojej nie rozumiecie? Dlatego, że nie możecie słuchać mojego słowa."
  tags: []
"J8,44":
  text: "Wy jesteście z waszego ojca – diabła, i pożądliwości ojca waszego chcecie czynić. On był mordercą od początku i nie pozostał w prawdzie, gdyż w nim nie ma prawdy. Gdy mówi kłamstwo, od siebie mówi, dlatego że jest kłamcą i jego ojcem."
  tags: []
"J8,45":
  text: "A ponieważ ja mówię prawdę, nie wierzycie mi."
  tags: []
"J8,46":
  text: "Kto z was skarci mnie za grzech? Natomiast, jeśli ja mówię prawdę, dlaczego wy mi nie wierzycie?"
  tags: []
"J8,47":
  text: "Kto jest z Boga, słów Bożych słucha; wy dlatego nie słuchacie, bo nie jesteście z Boga."
  tags: []
"J8,48":
  text: "Wtedy w odpowiedzi Żydzi, rzekli do Niego: Czy nie słusznie mówimy, że Ty jesteś Samarytaninem i że masz demona?"
  tags: []
"J8,49":
  text: "Jezus odpowiedział: Ja nie mam demona, ale czczę mojego Ojca; a wy mnie znieważacie."
  tags: []
"J8,50":
  text: "A ja nie szukam swojej chwały; jest ten, który jej szuka i sądzi."
  tags: []
"J8,51":
  text: "Zaprawdę, zaprawdę mówię wam: Jeśli ktoś zachowa moje Słowo, nie będzie oglądać śmierci na wieki."
  tags: []
"J8,52":
  text: "Wtedy Żydzi powiedzieli do Niego: Teraz poznaliśmy, że masz demona. Abraham umarł i prorocy, a Ty mówisz: Jeśli ktoś zachowa moje słowo, nie skosztuje śmierci na wieki."
  tags: []
"J8,53":
  text: "Czy Ty jesteś większy od naszego ojca Abrahama, który umarł? I prorocy umarli. Za kogo Ty się uważasz?"
  tags: []
"J8,54":
  text: "Jezus odpowiedział: Jeśli ja sam siebie otaczam chwałą, chwała moja jest niczym. Tym, który mnie otacza chwałą jest mój Ojciec, o którym wy mówicie, że jest waszym Bogiem."
  tags: []
"J8,55":
  text: "I nie znacie Go, ja natomiast znam Go; i jeślibym powiedział, że nie znam Go, byłbym podobnym do was, kłamcą; ale znam Go i słowo Jego zachowuję."
  tags: []
"J8,56":
  text: "Abraham, wasz ojciec, ogromnie się radował, że zobaczy mój dzień; i zobaczył go, i ucieszył się."
  tags: []
"J8,57":
  text: "Żydzi powiedzieli więc do Niego: Nie masz jeszcze pięćdziesięciu lat, a widziałeś Abrahama?"
  tags: []
"J8,58":
  text: "Jezus powiedział im: Zaprawdę, zaprawdę mówię wam: Zanim był Abraham, ja jestem."
  tags: []
"J8,59":
  text: "Wtedy podnieśli kamienie, aby rzucić w Niego; lecz Jezus ukrył się i wyszedł ze świątyni, przechodząc między nimi. I tak odszedł."
  tags: []
