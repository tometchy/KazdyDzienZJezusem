"J8,1": "A Jezus poszedł na Górę Oliwną."
"J8,2": "Wczesnym rankiem natomiast ponownie przyszedł do świątyni, a cały lud zszedł się do Niego; a gdy On usiadł, nauczał ich."
"J8,3": "I przyprowadzili do Niego uczeni w Piśmie i faryzeusze kobietę schwytaną na cudzołóstwie, i postawili ją na środku,"
"J8,4": "Mówiąc do Niego: Nauczycielu! Tę kobietę pojmano w chwili, gdy cudzołożyła;"
"J8,5": "A w Prawie Mojżesz nakazał nam takie kamienować; a Ty co mówisz?"
"J8,6": "A to mówili, aby wystawić Go na próbę, aby mogli Go oskarżyć. A Jezus, schylił się i pisał palcem po ziemi, nie zwracając na nich uwagi."
"J8,7": "A gdy tak nalegali pytając Go, wyprostował się i powiedział do nich: Kto z was jest bez grzechu, niech pierwszy rzuci w nią kamieniem."
"J8,8": "I znowu schylił się i pisał po ziemi."
"J8,9": "A oni, gdy to usłyszeli, będąc przekonani przez sumienie, jeden po drugim wychodzili, poczynając od starszych aż do ostatnich, i został tylko sam Jezus i kobieta stojąca na środku."
"J8,10": "A Jezus wyprostował się, i nikogo nie widząc, tylko tę kobietę, powiedział jej: Kobieto! Gdzie są twoi oskarżyciele? Nikt cię nie potępił?"
"J8,11": "A ona powiedziała: Nikt, Panie! A Jezus powiedział jej: I ja cię nie potępiam; idź i więcej już nie grzesz."
"J8,12": "Wtedy ponownie Jezus powiedział im, mówiąc: Ja jestem światłem świata; kto za mną idzie, na pewno nie będzie chodził w ciemności, ale będzie miał światło życia."
"J8,13": "Powiedzieli więc do Niego faryzeusze: Ty sam o sobie świadczysz; świadectwo Twoje nie jest prawdziwe."
"J8,14": "Jezus w odpowiedzi, rzekł im: Nawet jeśli ja świadczę sam o sobie, to moje świadectwo jest prawdziwe, gdyż wiem, skąd przyszedłem i gdzie odchodzę; lecz wy nie wiecie, skąd przyszedłem i gdzie odchodzę."
"J8,15": "Wy sądzicie według ciała, ja nikogo nie sądzę."
"J8,16": "A nawet jeśli ja sądzę, sąd mój jest prawdziwy; gdyż nie jestem sam, ale jestem ja i Ten, który mnie posłał, Ojciec."
"J8,17": "A w Prawie waszym jest napisane, że świadectwo dwóch ludzi jest prawdziwe."
"J8,18": "Ja jestem tym, który sam świadczy o sobie i świadczy o mnie Ten, który mnie posłał, Ojciec."
"J8,19": "Wtedy powiedzieli do Niego: Gdzie jest twój ojciec? Jezus odpowiedział: Ani mnie nie znacie, ani mojego Ojca; gdybyście mnie poznali, znalibyście i mojego Ojca."
"J8,20": "Te słowa wypowiedział Jezus w skarbcu, ucząc w świątyni; i nikt Go nie pojmał, bo jeszcze nie nadeszła Jego godzina."
"J8,21": "Jezus powiedział im więc ponownie: Ja odchodzę i będziecie mnie szukać, i umrzecie w swoim grzechu; dokąd ja odchodzę, wy przyjść nie możecie."
"J8,22": "Mówili więc Żydzi: Czy sam siebie zabije, że mówi: Dokąd ja odchodzę, wy przyjść nie możecie?"
"J8,23": "I powiedział do nich: Wy jesteście z niskości, ja z wysokości; wy jesteście z tego świata, ja nie jestem z tego świata."
"J8,24": "Dlatego powiedziałem wam, że umrzecie w swoich grzechach; bo jeśli nie wierzycie, że ja jestem, umrzecie w swoich grzechach."
"J8,25": "Powiedzieli więc do Niego: Kim ty jesteś? I Jezus powiedział im: Tym, kim na początku wam powiedziałem."
"J8,26": "Wiele mam o was do powiedzenia i do sądzenia; ale Ten, który mnie posłał, jest prawdziwy, a ja, co usłyszałem od Niego, to mówię do świata."
"J8,27": "Ale nie zrozumieli, że im mówił o Ojcu."
"J8,28": "Jezus wtedy powiedział im: Gdy wywyższycie Syna Człowieczego, wtedy poznacie, że ja jestem, a nic sam z siebie nie czynię, ale jak nauczył mnie mój Ojciec, tak mówię."
"J8,29": "A Ten, który mnie posłał, jest ze mną; Ojciec nie zostawił mnie samego, bo ja zawsze czynię to, co Jemu się podoba."
"J8,30": "A gdy On o tym mówił, wielu uwierzyło w Niego."
"J8,31": "Mówił więc Jezus do tych Żydów, którzy Mu uwierzyli: Jeśli wytrwacie w moim słowie, prawdziwie jesteście moimi uczniami;"
"J8,32": "I poznacie prawdę, a prawda was wyzwoli."
"J8,33": "Odpowiedzieli Mu: My jesteśmy z potomstwa Abrahama i nigdy nie byliśmy niczyimi niewolnikami; jak Ty możesz mówić: Staniecie się wolni?"
"J8,34": "Jezus odpowiedział im: Zaprawdę, zaprawdę mówię wam: Każdy, kto popełnia grzech, jest niewolnikiem grzechu."
"J8,35": "A niewolnik nie zostaje w domu na wieki; Syn zostaje na wieki."
"J8,36": "Dlatego, jeśli Syn was wyzwoli, naprawdę będziecie wolni."
"J8,37": "Wiem, że jesteście potomstwem Abrahama; lecz dążycie do tego, aby mnie zabić, gdyż nie ma w was miejsca na moje słowo."
"J8,38": "Ja, co widziałem u mojego Ojca, to mówię; a wy czynicie to, co widzieliście u waszego ojca."
"J8,39": "W odpowiedzi, rzekli Mu: Ojcem naszym jest Abraham. Jezus powiedział im: Gdybyście byli synami Abrahama, czynilibyście dzieła Abrahama."
"J8,40": "Ale teraz dążycie do tego, aby mnie zabić, człowieka, który wam mówi prawdę, którą usłyszałem od Boga; tego Abraham nie czynił."
"J8,41": "Wy czynicie dzieła waszego ojca. Powiedzieli do Niego wtedy: My nie jesteśmy zrodzeni z nierządu; mamy jednego Ojca, Boga."
"J8,42": "Jezus wtedy powiedział im: Gdyby Bóg był waszym Ojcem, to byście mnie miłowali, ja bowiem wyszedłem od Boga i oto przybywam, bo nie przyszedłem od siebie samego, lecz On mnie posłał."
"J8,43": "Dlaczego mowy mojej nie rozumiecie? Dlatego, że nie możecie słuchać mojego słowa."
"J8,44": "Wy jesteście z waszego ojca – diabła, i pożądliwości ojca waszego chcecie czynić. On był mordercą od początku i nie pozostał w prawdzie, gdyż w nim nie ma prawdy. Gdy mówi kłamstwo, od siebie mówi, dlatego że jest kłamcą i jego ojcem."
"J8,45": "A ponieważ ja mówię prawdę, nie wierzycie mi."
"J8,46": "Kto z was skarci mnie za grzech? Natomiast, jeśli ja mówię prawdę, dlaczego wy mi nie wierzycie?"
"J8,47": "Kto jest z Boga, słów Bożych słucha; wy dlatego nie słuchacie, bo nie jesteście z Boga."
"J8,48": "Wtedy w odpowiedzi Żydzi, rzekli do Niego: Czy nie słusznie mówimy, że Ty jesteś Samarytaninem i że masz demona?"
"J8,49": "Jezus odpowiedział: Ja nie mam demona, ale czczę mojego Ojca; a wy mnie znieważacie."
"J8,50": "A ja nie szukam swojej chwały; jest ten, który jej szuka i sądzi."
"J8,51": "Zaprawdę, zaprawdę mówię wam: Jeśli ktoś zachowa moje Słowo, nie będzie oglądać śmierci na wieki."
"J8,52": "Wtedy Żydzi powiedzieli do Niego: Teraz poznaliśmy, że masz demona. Abraham umarł i prorocy, a Ty mówisz: Jeśli ktoś zachowa moje słowo, nie skosztuje śmierci na wieki."
"J8,53": "Czy Ty jesteś większy od naszego ojca Abrahama, który umarł? I prorocy umarli. Za kogo Ty się uważasz?"
"J8,54": "Jezus odpowiedział: Jeśli ja sam siebie otaczam chwałą, chwała moja jest niczym. Tym, który mnie otacza chwałą jest mój Ojciec, o którym wy mówicie, że jest waszym Bogiem."
"J8,55": "I nie znacie Go, ja natomiast znam Go; i jeślibym powiedział, że nie znam Go, byłbym podobnym do was, kłamcą; ale znam Go i słowo Jego zachowuję."
"J8,56": "Abraham, wasz ojciec, ogromnie się radował, że zobaczy mój dzień; i zobaczył go, i ucieszył się."
"J8,57": "Żydzi powiedzieli więc do Niego: Nie masz jeszcze pięćdziesięciu lat, a widziałeś Abrahama?"
"J8,58": "Jezus powiedział im: Zaprawdę, zaprawdę mówię wam: Zanim był Abraham, ja jestem."
"J8,59": "Wtedy podnieśli kamienie, aby rzucić w Niego; lecz Jezus ukrył się i wyszedł ze świątyni, przechodząc między nimi. I tak odszedł."
