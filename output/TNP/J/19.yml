"J19,1":
  text: "Wówczas więc wziął Piłat Jezusa i kazał Go wychłostać."
  tags: []
"J19,2":
  text: "A żołnierze upletli wieniec z ciernia i włożyli na Jego głowę, i okryli Go purpurowym płaszczem,"
  tags: []
"J19,3":
  text: "Mówiąc: Witaj, Królu Żydów! I policzkowali Go."
  tags: []
"J19,4":
  text: "Wyszedł więc znów Piłat i powiedział im: Oto wyprowadzam Go do was, abyście poznali, że nie znajduję w Nim żadnej winy z powodu, której miałby być ukarany"
  tags: []
"J19,5":
  text: "Wtedy Jezus wyszedł na zewnątrz, niosąc cierniowy wieniec i purpurowy płaszcz. A Piłat powiedział im: Oto człowiek!"
  tags: []
"J19,6":
  text: "A gdy ujrzeli Go arcykapłani i ich podwładni, krzyczeli słowami: Ukrzyżuj, ukrzyżuj! Piłat powiedział im: Weźcie Go wy i ukrzyżujcie; ja bowiem nie znajduję w Nim żadnej winy z powodu, której miałby być ukarany."
  tags: []
"J19,7":
  text: "Żydzi odpowiedzieli mu: My mamy Prawo, a według naszego Prawa powinien umrzeć; bo samego siebie uczynił Synem Boga."
  tags: []
"J19,8":
  text: "Gdy więc Piłat usłyszał te słowa, tym bardziej się uląkł."
  tags: []
"J19,9":
  text: "I wszedł ponownie do pretorium, i powiedział do Jezusa: Skąd jesteś? Lecz Jezus nie dał mu odpowiedzi."
  tags: []
"J19,10":
  text: "Piłat więc powiedział do Niego: Nie odpowiadasz mi? Nie wiesz, że mam władzę, aby Cię ukrzyżować i mam władzę, aby Cię uwolnić?"
  tags: []
"J19,11":
  text: "Jezus odpowiedział: Nie miałbyś żadnej władzy nade mną, gdyby ci to nie było dane z góry; dlatego ten, kto mnie tobie wydaje, ma większy grzech."
  tags: []
"J19,12":
  text: "Odtąd Piłat starał się Go wypuścić, lecz Żydzi krzyczeli słowami: Jeśli Go uwolnisz, nie jesteś przyjacielem Cezara; każdy bowiem, kto czyni siebie królem, sprzeciwia się Cezarowi!"
  tags: []
"J19,13":
  text: "Wtedy Piłat, gdy usłyszał te słowa, wyprowadził Jezusa na zewnątrz i zasiadł na tronie sędziowskim, w miejscu, zwanym Lithostrotos, a po hebrajsku Gabbata."
  tags: []
"J19,14":
  text: "A był to Dzień Przygotowania Paschy, około szóstej godziny; i powiedział do Żydów: Oto wasz król!"
  tags: []
"J19,15":
  text: "Oni na to krzyczeli: Precz, precz! Ukrzyżuj Go! Powiedział im Piłat: Czy mam ukrzyżować waszego króla? Arcykapłani odpowiedzieli: Nie mamy króla, tylko Cezara."
  tags: []
"J19,16":
  text: "Wtedy im Go wydał, aby został ukrzyżowany. Wzięli więc Jezusa i wyprowadzili."
  tags: []
"J19,17":
  text: "A On niosąc swój krzyż, wyszedł na miejsce, zwane Miejsce Czaszki, które po hebrajsku nazywa się Golgota;"
  tags: []
"J19,18":
  text: "Tam Go ukrzyżowali; a z Nim dwóch innych z jednej i z drugiej strony, a Jezusa pośrodku."
  tags: []
"J19,19":
  text: "A Piłat sporządził napis i umieścił na krzyżu; a było na nim napisane: Jezus Nazarejczyk, Król Żydów."
  tags: []
"J19,20":
  text: "A ten napis czytało wielu Żydów, bo blisko miasta było to miejsce, gdzie Jezus został ukrzyżowany; a napisany był on po hebrajsku, po grecku i po łacinie."
  tags: []
"J19,21":
  text: "Wtedy powiedzieli Piłatowi arcykapłani żydowscy: Nie pisz: Król Żydów, ale On powiedział: Jestem Królem Żydów."
  tags: []
"J19,22":
  text: "Piłat odpowiedział: Co napisałem, to napisałem."
  tags: []
"J19,23":
  text: "Żołnierze więc, gdy ukrzyżowali Jezusa, wzięli Jego szaty i podzielili na cztery części, każdemu żołnierzowi część, i tunikę; a ta tunika była bez szwu, cała tkana od góry."
  tags: []
"J19,24":
  text: "Powiedzieli więc do siebie: Nie rozcinajmy jej, ale losujmy o nią, czyja ma być – aby zostało wypełnione Pismo, które mówi: Rozdzielili moje szaty między siebie, a o moje odzienie rzucili los. Wtedy to właśnie uczynili żołnierze."
  tags: []
"J19,25":
  text: "A stały przy krzyżu Jezusa: Jego matka i siostra Jego matki, Maria, żona Kleofasa, i Maria Magdalena."
  tags: []
"J19,26":
  text: "A gdy Jezus ujrzał matkę i ucznia tam stojącego, którego miłował, powiedział swojej matce: Kobieto, oto twój syn!"
  tags: []
"J19,27":
  text: "Potem powiedział do ucznia: Oto twoja matka! I od tej godziny wziął ją ten uczeń do siebie."
  tags: []
"J19,28":
  text: "Po tym Jezus wiedząc, że wszystko jest już dokonane, aby Pismo zostało wypełnione, powiedział: Pragnę."
  tags: []
"J19,29":
  text: "A stało tam naczynie napełnione winnym octem; a oni nasączyli gąbkę winnym octem i zatknęli na hyzop, podając Mu do ust."
  tags: []
"J19,30":
  text: "A gdy Jezus otrzymał ocet, powiedział: Wykonało się; skłonił głowę i oddał ducha."
  tags: []
"J19,31":
  text: "Żydzi więc, aby ciała nie pozostały na krzyżu w szabat, ponieważ był to Dzień Przygotowania – bo ten dzień szabatu był wielki – prosili Piłata, aby im połamano golenie i usunięto ich."
  tags: []
"J19,32":
  text: "Przyszli więc żołnierze i istotnie połamali pierwszemu golenie, również i drugiemu, który z Nim został ukrzyżowany,"
  tags: []
"J19,33":
  text: "Ale gdy podeszli do Jezusa i gdy zobaczyli, że już umarł, nie połamali Jego goleni."
  tags: []
"J19,34":
  text: "Lecz jeden z żołnierzy włócznią przebił Jego bok i zaraz wypłynęła krew i woda."
  tags: []
"J19,35":
  text: "A ten, który to widział, świadczy o tym, a jego świadectwo jest prawdziwe; i on wie, że mówi prawdę, abyście wy uwierzyli."
  tags: []
"J19,36":
  text: "To bowiem się stało, aby zostało wypełnione Pismo: Kość Jego nie zostanie złamana."
  tags: []
"J19,37":
  text: "I ponownie inne miejsce Pisma mówi: I będą patrzeć na Tego, którego przebili."
  tags: []
"J19,38":
  text: "A potem Józef z Arymetei, który był uczniem Jezusa, lecz ukrytym z powodu strachu przed Żydami, poprosił Piłata, aby mógł zdjąć ciało Jezusa. I Piłat mu pozwolił. Poszedł więc i zabrał ciało Jezusa."
  tags: []
"J19,39":
  text: "Przyszedł również i Nikodem, ten który wcześniej przybył w nocy do Jezusa, niosąc około stu liter mieszaniny mirry i aloesu."
  tags: []
"J19,40":
  text: "Wzięli więc ciało Jezusa i wraz z wonnościami zawinęli je w płótna, tak jak Żydzi mają zwyczaj grzebać."
  tags: []
"J19,41":
  text: "A był w tym miejscu, gdzie Go ukrzyżowano ogród, a w tym ogrodzie nowy grobowiec, w którym jeszcze nikt nie został położony."
  tags: []
"J19,42":
  text: "Tam więc, z powodu żydowskiego Dnia Przygotowania, złożono Jezusa, gdyż grobowiec był blisko."
  tags: []
