"J19,1": "Wówczas więc wziął Piłat Jezusa i kazał Go wychłostać."
"J19,2": "A żołnierze upletli wieniec z ciernia i włożyli na Jego głowę, i okryli Go purpurowym płaszczem,"
"J19,3": "Mówiąc: Witaj, Królu Żydów! I policzkowali Go."
"J19,4": "Wyszedł więc znów Piłat i powiedział im: Oto wyprowadzam Go do was, abyście poznali, że nie znajduję w Nim żadnej winy z powodu, której miałby być ukarany"
"J19,5": "Wtedy Jezus wyszedł na zewnątrz, niosąc cierniowy wieniec i purpurowy płaszcz. A Piłat powiedział im: Oto człowiek!"
"J19,6": "A gdy ujrzeli Go arcykapłani i ich podwładni, krzyczeli słowami: Ukrzyżuj, ukrzyżuj! Piłat powiedział im: Weźcie Go wy i ukrzyżujcie; ja bowiem nie znajduję w Nim żadnej winy z powodu, której miałby być ukarany."
"J19,7": "Żydzi odpowiedzieli mu: My mamy Prawo, a według naszego Prawa powinien umrzeć; bo samego siebie uczynił Synem Boga."
"J19,8": "Gdy więc Piłat usłyszał te słowa, tym bardziej się uląkł."
"J19,9": "I wszedł ponownie do pretorium, i powiedział do Jezusa: Skąd jesteś? Lecz Jezus nie dał mu odpowiedzi."
"J19,10": "Piłat więc powiedział do Niego: Nie odpowiadasz mi? Nie wiesz, że mam władzę, aby Cię ukrzyżować i mam władzę, aby Cię uwolnić?"
"J19,11": "Jezus odpowiedział: Nie miałbyś żadnej władzy nade mną, gdyby ci to nie było dane z góry; dlatego ten, kto mnie tobie wydaje, ma większy grzech."
"J19,12": "Odtąd Piłat starał się Go wypuścić, lecz Żydzi krzyczeli słowami: Jeśli Go uwolnisz, nie jesteś przyjacielem Cezara; każdy bowiem, kto czyni siebie królem, sprzeciwia się Cezarowi!"
"J19,13": "Wtedy Piłat, gdy usłyszał te słowa, wyprowadził Jezusa na zewnątrz i zasiadł na tronie sędziowskim, w miejscu, zwanym Lithostrotos, a po hebrajsku Gabbata."
"J19,14": "A był to Dzień Przygotowania Paschy, około szóstej godziny; i powiedział do Żydów: Oto wasz król!"
"J19,15": "Oni na to krzyczeli: Precz, precz! Ukrzyżuj Go! Powiedział im Piłat: Czy mam ukrzyżować waszego króla? Arcykapłani odpowiedzieli: Nie mamy króla, tylko Cezara."
"J19,16": "Wtedy im Go wydał, aby został ukrzyżowany. Wzięli więc Jezusa i wyprowadzili."
"J19,17": "A On niosąc swój krzyż, wyszedł na miejsce, zwane Miejsce Czaszki, które po hebrajsku nazywa się Golgota;"
"J19,18": "Tam Go ukrzyżowali; a z Nim dwóch innych z jednej i z drugiej strony, a Jezusa pośrodku."
"J19,19": "A Piłat sporządził napis i umieścił na krzyżu; a było na nim napisane: Jezus Nazarejczyk, Król Żydów."
"J19,20": "A ten napis czytało wielu Żydów, bo blisko miasta było to miejsce, gdzie Jezus został ukrzyżowany; a napisany był on po hebrajsku, po grecku i po łacinie."
"J19,21": "Wtedy powiedzieli Piłatowi arcykapłani żydowscy: Nie pisz: Król Żydów, ale On powiedział: Jestem Królem Żydów."
"J19,22": "Piłat odpowiedział: Co napisałem, to napisałem."
"J19,23": "Żołnierze więc, gdy ukrzyżowali Jezusa, wzięli Jego szaty i podzielili na cztery części, każdemu żołnierzowi część, i tunikę; a ta tunika była bez szwu, cała tkana od góry."
"J19,24": "Powiedzieli więc do siebie: Nie rozcinajmy jej, ale losujmy o nią, czyja ma być – aby zostało wypełnione Pismo, które mówi: Rozdzielili moje szaty między siebie, a o moje odzienie rzucili los. Wtedy to właśnie uczynili żołnierze."
"J19,25": "A stały przy krzyżu Jezusa: Jego matka i siostra Jego matki, Maria, żona Kleofasa, i Maria Magdalena."
"J19,26": "A gdy Jezus ujrzał matkę i ucznia tam stojącego, którego miłował, powiedział swojej matce: Kobieto, oto twój syn!"
"J19,27": "Potem powiedział do ucznia: Oto twoja matka! I od tej godziny wziął ją ten uczeń do siebie."
"J19,28": "Po tym Jezus wiedząc, że wszystko jest już dokonane, aby Pismo zostało wypełnione, powiedział: Pragnę."
"J19,29": "A stało tam naczynie napełnione winnym octem; a oni nasączyli gąbkę winnym octem i zatknęli na hyzop, podając Mu do ust."
"J19,30": "A gdy Jezus otrzymał ocet, powiedział: Wykonało się; skłonił głowę i oddał ducha."
"J19,31": "Żydzi więc, aby ciała nie pozostały na krzyżu w szabat, ponieważ był to Dzień Przygotowania – bo ten dzień szabatu był wielki – prosili Piłata, aby im połamano golenie i usunięto ich."
"J19,32": "Przyszli więc żołnierze i istotnie połamali pierwszemu golenie, również i drugiemu, który z Nim został ukrzyżowany,"
"J19,33": "Ale gdy podeszli do Jezusa i gdy zobaczyli, że już umarł, nie połamali Jego goleni."
"J19,34": "Lecz jeden z żołnierzy włócznią przebił Jego bok i zaraz wypłynęła krew i woda."
"J19,35": "A ten, który to widział, świadczy o tym, a jego świadectwo jest prawdziwe; i on wie, że mówi prawdę, abyście wy uwierzyli."
"J19,36": "To bowiem się stało, aby zostało wypełnione Pismo: Kość Jego nie zostanie złamana."
"J19,37": "I ponownie inne miejsce Pisma mówi: I będą patrzeć na Tego, którego przebili."
"J19,38": "A potem Józef z Arymetei, który był uczniem Jezusa, lecz ukrytym z powodu strachu przed Żydami, poprosił Piłata, aby mógł zdjąć ciało Jezusa. I Piłat mu pozwolił. Poszedł więc i zabrał ciało Jezusa."
"J19,39": "Przyszedł również i Nikodem, ten który wcześniej przybył w nocy do Jezusa, niosąc około stu liter mieszaniny mirry i aloesu."
"J19,40": "Wzięli więc ciało Jezusa i wraz z wonnościami zawinęli je w płótna, tak jak Żydzi mają zwyczaj grzebać."
"J19,41": "A był w tym miejscu, gdzie Go ukrzyżowano ogród, a w tym ogrodzie nowy grobowiec, w którym jeszcze nikt nie został położony."
"J19,42": "Tam więc, z powodu żydowskiego Dnia Przygotowania, złożono Jezusa, gdyż grobowiec był blisko."
