"J10,1": "Zaprawdę, zaprawdę mówię wam: Kto nie wchodzi przez bramę do zagrody dla owiec, ale wchodzi inną drogą, ten jest złodziejem i rozbójnikiem;"
"J10,2": "Kto natomiast wchodzi przez bramę, ten jest pasterzem owiec."
"J10,3": "Temu odźwierny otwiera i owce słuchają jego głosu, a on swoje własne owce woła po imieniu i je wyprowadza."
"J10,4": "I gdy wypuści swoje owce, idzie przed nimi, a owce idą za nim, bo znają jego głos."
"J10,5": "Ale za obcym na pewno nie będą podążać, lecz uciekają od niego, bo nie znają głosu obcych."
"J10,6": "Taką przypowieść powiedział im Jezus; lecz oni nie zrozumieli tego, co im mówił."
"J10,7": "Jezus więc ponownie powiedział im: Zaprawdę, zaprawdę mówię wam, że ja jestem bramą dla owiec."
"J10,8": "Wszyscy, ilu ich przyszło przede mną, są złodziejami i rozbójnikami, lecz owce ich nie posłuchały."
"J10,9": "Ja jestem bramą; jeśli ktoś przeze mnie wejdzie, zostanie zbawiony, wejdzie i wyjdzie, i znajdzie pastwisko."
"J10,10": "Złodziej przychodzi tylko, aby kraść, zarzynać i zatracać; ja przyszedłem, aby miały życie, i miały je obfite."
"J10,11": "Ja jestem dobrym pasterzem; dobry pasterz swoje życie kładzie za owce."
"J10,12": "Lecz najemnik, który nie jest pasterzem, którego owce nie są własnością, widząc przychodzącego wilka, opuszcza owce i ucieka, a wilk porywa i rozprasza owce."
"J10,13": "Najemnik natomiast ucieka, bo jest najemnikiem i nie troszczy się o owce."
"J10,14": "Ja jestem dobrym pasterzem i znam swoje owce, i moje owce mnie znają,"
"J10,15": "Tak jak mnie zna Ojciec i ja znam Ojca; i życie swoje kładę za owce."
"J10,16": "Mam i inne owce, które nie są z tej zagrody; i te muszę przyprowadzić, i słuchać będą mojego głosu; i powstanie jedno stado i jeden pasterz."
"J10,17": "Dlatego Ojciec mnie miłuje, bo ja kładę swoje życie, abym je ponownie otrzymał."
"J10,18": "Nikt mi go nie odbiera, ale ja kładę je sam z siebie. Mam władzę położyć je, i mam władzę ponownie je wziąć. Takie przykazanie otrzymałem od mojego Ojca."
"J10,19": "Wtedy ponownie powstał rozłam między Żydami z powodu tych słów."
"J10,20": "A wielu z nich mówiło: Ma demona i szaleje; dlaczego Go słuchacie?"
"J10,21": "Inni mówili: To nie są słowa opętanego przez demona; czy demon może otwierać oczy ślepym?"
"J10,22": "A obchodzono w Jerozolimie święto poświęcenia świątyni, i była zima,"
"J10,23": "I Jezus przechadzał się po świątyni w portyku Salomona."
"J10,24": "Żydzi więc obstąpili Go i powiedzieli do Niego: Jak długo będziesz trzymał nas w niepewności? Jeśli Ty jesteś Mesjaszem, powiedz nam to otwarcie."
"J10,25": "Jezus odpowiedział im: Powiedziałem wam, a nie wierzycie; dzieła, które ja czynię w imieniu Ojca mojego, te o mnie świadczą."
"J10,26": "Ale wy nie wierzycie; bo jak wam powiedziałem, nie jesteście z moich owiec."
"J10,27": "Owce moje słuchają mojego głosu, i ja je znam, i idą za mną;"
"J10,28": "I ja daję im życie wieczne, i z pewnością nie zginą na wieki, i nikt nie wyrwie ich z mojej ręki."
"J10,29": "Ojciec mój, który mi je dał, większy jest od wszystkich, i nikt nie może ich wyrywać z ręki mojego Ojca."
"J10,30": "Ja i Ojciec jesteśmy jedno."
"J10,31": "I wtedy ponownie Żydzi porwali kamienie, aby Go ukamienować."
"J10,32": "Jezus odpowiedział im: Wiele dobrych dzieł ukazałem wam od mojego Ojca; z powodu którego z tych dzieł mnie kamienujecie?"
"J10,33": "W odpowiedzi Żydzi, rzekli Mu: Nie chcemy cię kamienować z powodu dobrych dzieł, ale za bluźnierstwo i za to, że ty będąc człowiekiem, czynisz siebie Bogiem."
"J10,34": "Jezus odpowiedział im: Czy w Prawie waszym nie zostało napisane: Ja powiedziałem: Bogami jesteście?"
"J10,35": "Jeśli o tych, powiedział jesteście bogami, do których było skierowane Słowo Boże – a Pismo nie może być naruszone,"
"J10,36": "Do Tego, którego Ojciec poświęcił i posłał na świat, wy mówicie: Bluźnisz, dlatego że powiedziałem: Jestem Synem Bożym?"
"J10,37": "Jeśli nie czynię dzieł mojego Ojca, nie wierzcie mi;"
"J10,38": "Jeśli jednak czynię, to choćbyście mi nie wierzyli, uwierzcie dziełom, abyście poznali i uwierzyli, że Ojciec jest we mnie, a ja w Nim."
"J10,39": "Wtedy ponownie dążyli do tego, aby Go pojmać; ale uszedł z ich rąk."
"J10,40": "I ponownie odszedł za Jordan na miejsce, gdzie wcześniej chrzcił Jan, i tam pozostał."
"J10,41": "A wielu przychodziło do Niego, mówiąc: Jan wprawdzie żadnego cudownego znaku nie uczynił; ale wszystko, cokolwiek Jan o Nim powiedział, było prawdą."
"J10,42": "I wielu tam uwierzyło w Niego."
