"J10,1":
  text: "Zaprawdę, zaprawdę mówię wam: Kto nie wchodzi przez bramę do zagrody dla owiec, ale wchodzi inną drogą, ten jest złodziejem i rozbójnikiem;"
  tags: []
"J10,2":
  text: "Kto natomiast wchodzi przez bramę, ten jest pasterzem owiec."
  tags: []
"J10,3":
  text: "Temu odźwierny otwiera i owce słuchają jego głosu, a on swoje własne owce woła po imieniu i je wyprowadza."
  tags: []
"J10,4":
  text: "I gdy wypuści swoje owce, idzie przed nimi, a owce idą za nim, bo znają jego głos."
  tags: []
"J10,5":
  text: "Ale za obcym na pewno nie będą podążać, lecz uciekają od niego, bo nie znają głosu obcych."
  tags: []
"J10,6":
  text: "Taką przypowieść powiedział im Jezus; lecz oni nie zrozumieli tego, co im mówił."
  tags: []
"J10,7":
  text: "Jezus więc ponownie powiedział im: Zaprawdę, zaprawdę mówię wam, że ja jestem bramą dla owiec."
  tags: []
"J10,8":
  text: "Wszyscy, ilu ich przyszło przede mną, są złodziejami i rozbójnikami, lecz owce ich nie posłuchały."
  tags: []
"J10,9":
  text: "Ja jestem bramą; jeśli ktoś przeze mnie wejdzie, zostanie zbawiony, wejdzie i wyjdzie, i znajdzie pastwisko."
  tags: []
"J10,10":
  text: "Złodziej przychodzi tylko, aby kraść, zarzynać i zatracać; ja przyszedłem, aby miały życie, i miały je obfite."
  tags: []
"J10,11":
  text: "Ja jestem dobrym pasterzem; dobry pasterz swoje życie kładzie za owce."
  tags: []
"J10,12":
  text: "Lecz najemnik, który nie jest pasterzem, którego owce nie są własnością, widząc przychodzącego wilka, opuszcza owce i ucieka, a wilk porywa i rozprasza owce."
  tags: []
"J10,13":
  text: "Najemnik natomiast ucieka, bo jest najemnikiem i nie troszczy się o owce."
  tags: []
"J10,14":
  text: "Ja jestem dobrym pasterzem i znam swoje owce, i moje owce mnie znają,"
  tags: []
"J10,15":
  text: "Tak jak mnie zna Ojciec i ja znam Ojca; i życie swoje kładę za owce."
  tags: []
"J10,16":
  text: "Mam i inne owce, które nie są z tej zagrody; i te muszę przyprowadzić, i słuchać będą mojego głosu; i powstanie jedno stado i jeden pasterz."
  tags: []
"J10,17":
  text: "Dlatego Ojciec mnie miłuje, bo ja kładę swoje życie, abym je ponownie otrzymał."
  tags: []
"J10,18":
  text: "Nikt mi go nie odbiera, ale ja kładę je sam z siebie. Mam władzę położyć je, i mam władzę ponownie je wziąć. Takie przykazanie otrzymałem od mojego Ojca."
  tags: []
"J10,19":
  text: "Wtedy ponownie powstał rozłam między Żydami z powodu tych słów."
  tags: []
"J10,20":
  text: "A wielu z nich mówiło: Ma demona i szaleje; dlaczego Go słuchacie?"
  tags: []
"J10,21":
  text: "Inni mówili: To nie są słowa opętanego przez demona; czy demon może otwierać oczy ślepym?"
  tags: []
"J10,22":
  text: "A obchodzono w Jerozolimie święto poświęcenia świątyni, i była zima,"
  tags: []
"J10,23":
  text: "I Jezus przechadzał się po świątyni w portyku Salomona."
  tags: []
"J10,24":
  text: "Żydzi więc obstąpili Go i powiedzieli do Niego: Jak długo będziesz trzymał nas w niepewności? Jeśli Ty jesteś Mesjaszem, powiedz nam to otwarcie."
  tags: []
"J10,25":
  text: "Jezus odpowiedział im: Powiedziałem wam, a nie wierzycie; dzieła, które ja czynię w imieniu Ojca mojego, te o mnie świadczą."
  tags: []
"J10,26":
  text: "Ale wy nie wierzycie; bo jak wam powiedziałem, nie jesteście z moich owiec."
  tags: []
"J10,27":
  text: "Owce moje słuchają mojego głosu, i ja je znam, i idą za mną;"
  tags: []
"J10,28":
  text: "I ja daję im życie wieczne, i z pewnością nie zginą na wieki, i nikt nie wyrwie ich z mojej ręki."
  tags: []
"J10,29":
  text: "Ojciec mój, który mi je dał, większy jest od wszystkich, i nikt nie może ich wyrywać z ręki mojego Ojca."
  tags: []
"J10,30":
  text: "Ja i Ojciec jesteśmy jedno."
  tags: []
"J10,31":
  text: "I wtedy ponownie Żydzi porwali kamienie, aby Go ukamienować."
  tags: []
"J10,32":
  text: "Jezus odpowiedział im: Wiele dobrych dzieł ukazałem wam od mojego Ojca; z powodu którego z tych dzieł mnie kamienujecie?"
  tags: []
"J10,33":
  text: "W odpowiedzi Żydzi, rzekli Mu: Nie chcemy cię kamienować z powodu dobrych dzieł, ale za bluźnierstwo i za to, że ty będąc człowiekiem, czynisz siebie Bogiem."
  tags: []
"J10,34":
  text: "Jezus odpowiedział im: Czy w Prawie waszym nie zostało napisane: Ja powiedziałem: Bogami jesteście?"
  tags: []
"J10,35":
  text: "Jeśli o tych, powiedział jesteście bogami, do których było skierowane Słowo Boże – a Pismo nie może być naruszone,"
  tags: []
"J10,36":
  text: "Do Tego, którego Ojciec poświęcił i posłał na świat, wy mówicie: Bluźnisz, dlatego że powiedziałem: Jestem Synem Bożym?"
  tags: []
"J10,37":
  text: "Jeśli nie czynię dzieł mojego Ojca, nie wierzcie mi;"
  tags: []
"J10,38":
  text: "Jeśli jednak czynię, to choćbyście mi nie wierzyli, uwierzcie dziełom, abyście poznali i uwierzyli, że Ojciec jest we mnie, a ja w Nim."
  tags: []
"J10,39":
  text: "Wtedy ponownie dążyli do tego, aby Go pojmać; ale uszedł z ich rąk."
  tags: []
"J10,40":
  text: "I ponownie odszedł za Jordan na miejsce, gdzie wcześniej chrzcił Jan, i tam pozostał."
  tags: []
"J10,41":
  text: "A wielu przychodziło do Niego, mówiąc: Jan wprawdzie żadnego cudownego znaku nie uczynił; ale wszystko, cokolwiek Jan o Nim powiedział, było prawdą."
  tags: []
"J10,42":
  text: "I wielu tam uwierzyło w Niego."
  tags: []
