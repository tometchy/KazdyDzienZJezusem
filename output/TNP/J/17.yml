"J17,1":
  text: "Gdy Jezus to powiedział, podniósł swoje oczy ku niebu, mówiąc: Ojcze! Nadeszła godzina, otocz chwałą Twojego Syna, aby i Twój Syn otoczył chwałą Ciebie;"
  tags: []
"J17,2":
  text: "Tak, jak dałeś mu władzę nad wszelkim ciałem, aby dał życie wieczne tym wszystkim, których mu dałeś."
  tags: []
"J17,3":
  text: "A to jest życie wieczne, aby poznawali Ciebie, jedynego prawdziwego Boga, i tego, którego posłałeś, Jezusa Mesjasza."
  tags: []
"J17,4":
  text: "Ja Ciebie otoczyłem chwałą na ziemi; wypełniłem dzieło, które mi dałeś, abym je wykonał."
  tags: []
"J17,5":
  text: "A teraz Ty, Ojcze otocz mnie chwałą u siebie, tą chwałą, którą miałem u Ciebie zanim zaistniał świat."
  tags: []
"J17,6":
  text: "Objawiłem imię Twoje ludziom, których mi dałeś ze świata; byli Twoi i mnie ich dałeś; i zachowywali Twoje Słowo."
  tags: []
"J17,7":
  text: "Teraz zaczęli poznawać, że wszystko, co mi dałeś, jest od Ciebie."
  tags: []
"J17,8":
  text: "Albowiem słowa, które mi dałeś, dałem im; i oni je przyjęli, i prawdziwie poznali, że od Ciebie wyszedłem, i uwierzyli, że Ty mnie posłałeś."
  tags: []
"J17,9":
  text: "Ja za nimi proszę; nie proszę za światem, ale za tymi, których mi dałeś, bo są Twoi."
  tags: []
"J17,10":
  text: "I wszystko moje jest Twoje, a Twoje jest moje; i w nich zacząłem doznawać chwały."
  tags: []
"J17,11":
  text: "I już nie jestem na świecie, ale oni są na świecie, a ja idę do Ciebie. Ojcze Święty! Zachowaj ich w imieniu Twoim; tych których mi dałeś, aby jak my, byli jedno."
  tags: []
"J17,12":
  text: "Gdy byłem z nimi na świecie, ja strzegłem ich w imieniu Twoim; tych których mi dałeś, i ustrzegłem, i nikt z nich nie zginął, tylko syn zatracenia, aby Pismo zostało wypełnione."
  tags: []
"J17,13":
  text: "Ale teraz idę do Ciebie i mówię to na świecie, aby mieli moją radość, która jest pełna w nich."
  tags: []
"J17,14":
  text: "Ja dałem im słowo Twoje, a świat miał ich w nienawiści, dlatego że nie są ze świata, jak i ja nie jestem ze świata."
  tags: []
"J17,15":
  text: "Nie proszę, abyś zabrał ich ze świata, ale abyś ustrzegł ich od złego."
  tags: []
"J17,16":
  text: "Nie są ze świata, jak ja nie jestem ze świata."
  tags: []
"J17,17":
  text: "Poświęć ich w prawdzie Twojej; Słowo Twoje jest prawdą."
  tags: []
"J17,18":
  text: "Jak mnie posłałeś na świat, tak i ja posłałem ich na świat."
  tags: []
"J17,19":
  text: "I ja za nich poświęcam samego siebie, aby i oni byli poświęceni w prawdzie."
  tags: []
"J17,20":
  text: "A nie tylko za nimi proszę, lecz i za tymi, którzy przez ich słowo uwierzą we mnie,"
  tags: []
"J17,21":
  text: "Aby wszyscy byli jedno; jak Ty Ojcze we mnie, a ja w Tobie, aby i oni w nas byli jedno; aby świat uwierzył, że Ty mnie posłałeś."
  tags: []
"J17,22":
  text: "A ja chwałę, którą mi dałeś, dałem im, aby byli jedno, jak my jedno jesteśmy;"
  tags: []
"J17,23":
  text: "Ja w nich, a Ty we mnie, aby zostali wydoskonaleni w jedności, i żeby świat wiedział, że Ty mnie posłałeś, i że ich umiłowałeś, jak mnie umiłowałeś."
  tags: []
"J17,24":
  text: "Ojcze! Chcę, aby i ci, których mi dałeś, byli ze mną tam, gdzie ja jestem; aby oglądali moją chwałę, którą mi dałeś, bo umiłowałeś mnie przed założeniem świata."
  tags: []
"J17,25":
  text: "Ojcze sprawiedliwy! Świat Ciebie nie poznał, ale ja Ciebie poznałem, i ci poznali, że Ty mnie posłałeś."
  tags: []
"J17,26":
  text: "I dałem im poznać Twoje imię, i jeszcze dam je poznać, aby miłość, którą mnie umiłowałeś, w nich była, i ja w nich."
  tags: []
