"J17,1": "Gdy Jezus to powiedział, podniósł swoje oczy ku niebu, mówiąc: Ojcze! Nadeszła godzina, otocz chwałą Twojego Syna, aby i Twój Syn otoczył chwałą Ciebie;"
"J17,2": "Tak, jak dałeś mu władzę nad wszelkim ciałem, aby dał życie wieczne tym wszystkim, których mu dałeś."
"J17,3": "A to jest życie wieczne, aby poznawali Ciebie, jedynego prawdziwego Boga, i tego, którego posłałeś, Jezusa Mesjasza."
"J17,4": "Ja Ciebie otoczyłem chwałą na ziemi; wypełniłem dzieło, które mi dałeś, abym je wykonał."
"J17,5": "A teraz Ty, Ojcze otocz mnie chwałą u siebie, tą chwałą, którą miałem u Ciebie zanim zaistniał świat."
"J17,6": "Objawiłem imię Twoje ludziom, których mi dałeś ze świata; byli Twoi i mnie ich dałeś; i zachowywali Twoje Słowo."
"J17,7": "Teraz zaczęli poznawać, że wszystko, co mi dałeś, jest od Ciebie."
"J17,8": "Albowiem słowa, które mi dałeś, dałem im; i oni je przyjęli, i prawdziwie poznali, że od Ciebie wyszedłem, i uwierzyli, że Ty mnie posłałeś."
"J17,9": "Ja za nimi proszę; nie proszę za światem, ale za tymi, których mi dałeś, bo są Twoi."
"J17,10": "I wszystko moje jest Twoje, a Twoje jest moje; i w nich zacząłem doznawać chwały."
"J17,11": "I już nie jestem na świecie, ale oni są na świecie, a ja idę do Ciebie. Ojcze Święty! Zachowaj ich w imieniu Twoim; tych których mi dałeś, aby jak my, byli jedno."
"J17,12": "Gdy byłem z nimi na świecie, ja strzegłem ich w imieniu Twoim; tych których mi dałeś, i ustrzegłem, i nikt z nich nie zginął, tylko syn zatracenia, aby Pismo zostało wypełnione."
"J17,13": "Ale teraz idę do Ciebie i mówię to na świecie, aby mieli moją radość, która jest pełna w nich."
"J17,14": "Ja dałem im słowo Twoje, a świat miał ich w nienawiści, dlatego że nie są ze świata, jak i ja nie jestem ze świata."
"J17,15": "Nie proszę, abyś zabrał ich ze świata, ale abyś ustrzegł ich od złego."
"J17,16": "Nie są ze świata, jak ja nie jestem ze świata."
"J17,17": "Poświęć ich w prawdzie Twojej; Słowo Twoje jest prawdą."
"J17,18": "Jak mnie posłałeś na świat, tak i ja posłałem ich na świat."
"J17,19": "I ja za nich poświęcam samego siebie, aby i oni byli poświęceni w prawdzie."
"J17,20": "A nie tylko za nimi proszę, lecz i za tymi, którzy przez ich słowo uwierzą we mnie,"
"J17,21": "Aby wszyscy byli jedno; jak Ty Ojcze we mnie, a ja w Tobie, aby i oni w nas byli jedno; aby świat uwierzył, że Ty mnie posłałeś."
"J17,22": "A ja chwałę, którą mi dałeś, dałem im, aby byli jedno, jak my jedno jesteśmy;"
"J17,23": "Ja w nich, a Ty we mnie, aby zostali wydoskonaleni w jedności, i żeby świat wiedział, że Ty mnie posłałeś, i że ich umiłowałeś, jak mnie umiłowałeś."
"J17,24": "Ojcze! Chcę, aby i ci, których mi dałeś, byli ze mną tam, gdzie ja jestem; aby oglądali moją chwałę, którą mi dałeś, bo umiłowałeś mnie przed założeniem świata."
"J17,25": "Ojcze sprawiedliwy! Świat Ciebie nie poznał, ale ja Ciebie poznałem, i ci poznali, że Ty mnie posłałeś."
"J17,26": "I dałem im poznać Twoje imię, i jeszcze dam je poznać, aby miłość, którą mnie umiłowałeś, w nich była, i ja w nich."
