"2Tm3,1":
  text: "A to wiedz, że w dniach ostatecznych nastaną trudne czasy;"
  tags: []
"2Tm3,2":
  text: "Ludzie bowiem będą miłować siebie, kochać pieniądze, będą zarozumiali, pyszni, bluźnierczy, rodzicom nieposłuszni, niewdzięczni, bezbożni,"
  tags: []
"2Tm3,3":
  text: "Bez naturalnych uczuć, niedotrzymujący umów, oszczerczy, niepowściągliwi, okrutni, niemiłujący tego, co dobre,"
  tags: []
"2Tm3,4":
  text: "Zdradzieccy, porywczy, nadęci, kochający raczej przyjemności niż kochający Boga."
  tags: []
"2Tm3,5":
  text: "Którzy mają formę pobożności, ale zaparli się jej mocy; i właśnie tych unikaj."
  tags: []
"2Tm3,6":
  text: "Z takich bowiem są ci, którzy wciskają się do domów, zniewalając kobietki obarczone grzechami, dające się wodzić różnym pożądliwościom,"
  tags: []
"2Tm3,7":
  text: "Które zawsze się uczą i nigdy nie mogą dojść do dogłębnego poznania prawdy."
  tags: []
"2Tm3,8":
  text: "A jak Jannes i Jambres sprzeciwiali się Mojżeszowi, tak i ci sprzeciwiają się prawdzie, ludzie o spaczonym myśleniu, niewypróbowani, jeśli chodzi o wiarę."
  tags: []
"2Tm3,9":
  text: "Ale daleko nie zajdą; albowiem głupota ich będzie oczywista dla wszystkich, jak to się stało z tamtymi."
  tags: []
"2Tm3,10":
  text: "Ale ty poszedłeś za moją nauką, za sposobem życia, za postanowieniami, wiarą, cierpliwością, miłością, wytrwałością,"
  tags: []
"2Tm3,11":
  text: "Prześladowaniami, cierpieniami, które mnie spotkały w Antiochii, w Ikonium i w Listrze, które to prześladowania zniosłem; a ze wszystkich wyrwał mnie Pan."
  tags: []
"2Tm3,12":
  text: "Tak, też wszyscy, którzy chcą żyć pobożnie w Chrystusie Jezusie, będą prześladowani."
  tags: []
"2Tm3,13":
  text: "Lecz ludzie źli i oszuści będą posuwać się do coraz gorszego, wprowadzając innych w błędy i sami dając się w błędy wprowadzać."
  tags: []
"2Tm3,14":
  text: "Ale ty trwaj w tym, czego się nauczyłeś i o czym zostałeś przekonany, wiedząc od kogo się tego nauczyłeś,"
  tags: []
"2Tm3,15":
  text: "Zwłaszcza, że od niemowlęcia znasz Pisma Święte, mogące cię uczynić mądrym ku zbawieniu przez wiarę w Chrystusie Jezusie."
  tags: []
"2Tm3,16":
  text: "Bo całe Pismo przez Boga jest natchnione i jest pożyteczne do nauki, do wykazania błędu, do poprawy, do wychowywania w sprawiedliwości,"
  tags: []
"2Tm3,17":
  text: "Aby człowiek Boży był w pełni gotowy, wyposażony do wszelkiego dobrego dzieła."
  tags: []
