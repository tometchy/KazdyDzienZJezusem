"2Tm3,1": "A to wiedz, że w dniach ostatecznych nastaną trudne czasy;"
"2Tm3,2": "Ludzie bowiem będą miłować siebie, kochać pieniądze, będą zarozumiali, pyszni, bluźnierczy, rodzicom nieposłuszni, niewdzięczni, bezbożni,"
"2Tm3,3": "Bez naturalnych uczuć, niedotrzymujący umów, oszczerczy, niepowściągliwi, okrutni, niemiłujący tego, co dobre,"
"2Tm3,4": "Zdradzieccy, porywczy, nadęci, kochający raczej przyjemności niż kochający Boga."
"2Tm3,5": "Którzy mają formę pobożności, ale zaparli się jej mocy; i właśnie tych unikaj."
"2Tm3,6": "Z takich bowiem są ci, którzy wciskają się do domów, zniewalając kobietki obarczone grzechami, dające się wodzić różnym pożądliwościom,"
"2Tm3,7": "Które zawsze się uczą i nigdy nie mogą dojść do dogłębnego poznania prawdy."
"2Tm3,8": "A jak Jannes i Jambres sprzeciwiali się Mojżeszowi, tak i ci sprzeciwiają się prawdzie, ludzie o spaczonym myśleniu, niewypróbowani, jeśli chodzi o wiarę."
"2Tm3,9": "Ale daleko nie zajdą; albowiem głupota ich będzie oczywista dla wszystkich, jak to się stało z tamtymi."
"2Tm3,10": "Ale ty poszedłeś za moją nauką, za sposobem życia, za postanowieniami, wiarą, cierpliwością, miłością, wytrwałością,"
"2Tm3,11": "Prześladowaniami, cierpieniami, które mnie spotkały w Antiochii, w Ikonium i w Listrze, które to prześladowania zniosłem; a ze wszystkich wyrwał mnie Pan."
"2Tm3,12": "Tak, też wszyscy, którzy chcą żyć pobożnie w Chrystusie Jezusie, będą prześladowani."
"2Tm3,13": "Lecz ludzie źli i oszuści będą posuwać się do coraz gorszego, wprowadzając innych w błędy i sami dając się w błędy wprowadzać."
"2Tm3,14": "Ale ty trwaj w tym, czego się nauczyłeś i o czym zostałeś przekonany, wiedząc od kogo się tego nauczyłeś,"
"2Tm3,15": "Zwłaszcza, że od niemowlęcia znasz Pisma Święte, mogące cię uczynić mądrym ku zbawieniu przez wiarę w Chrystusie Jezusie."
"2Tm3,16": "Bo całe Pismo przez Boga jest natchnione i jest pożyteczne do nauki, do wykazania błędu, do poprawy, do wychowywania w sprawiedliwości,"
"2Tm3,17": "Aby człowiek Boży był w pełni gotowy, wyposażony do wszelkiego dobrego dzieła."
