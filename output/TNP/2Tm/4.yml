"2Tm4,1":
  text: "Ja więc uroczyście zaświadczam przed obliczem Boga i Pana Jezusa Chrystusa, który będzie sądzić żywych i martwych, podczas Jego pojawienia się i Jego Królestwa:"
  tags: []
"2Tm4,2":
  text: "Głoś słowo, bądź gotów w dogodnym i w niedogodnym czasie, wykaż błąd, skarć, zachęć z wszelką cierpliwością i nauką."
  tags: []
"2Tm4,3":
  text: "Albowiem będzie czas, gdy zdrowej nauki nie ścierpią, ale według swoich pożądliwości nagromadzą sobie nauczycieli, dając sobie łechtać ucho,"
  tags: []
"2Tm4,4":
  text: "I zaiste odwrócą się od słuchania prawdy, a będą zwracali się do baśni."
  tags: []
"2Tm4,5":
  text: "Ale ty bądź trzeźwy we wszystkim, znieś złą dolę, czyń dzieło ewangelisty, wypełnij swoją służbę."
  tags: []
"2Tm4,6":
  text: "Ja bowiem już jestem wylewany jako dar ofiarny i nadszedł czas mego odejścia."
  tags: []
"2Tm4,7":
  text: "Dobry bój stoczyłem, bieg kończę, wiarę zachowuję;"
  tags: []
"2Tm4,8":
  text: "Na koniec odłożony jest dla mnie wieniec sprawiedliwości, który odda mi w tym dniu Pan, sędzia sprawiedliwy, a nie tylko mi, lecz i wszystkim, którzy umiłowali Jego pojawienie się."
  tags: []
"2Tm4,9":
  text: "Staraj się przyjść do mnie szybko."
  tags: []
"2Tm4,10":
  text: "Demas bowiem mnie opuścił, bo umiłował obecny wiek i poszedł do Tesalonik, Krescens do Galacji, Tytus do Dalmacji;"
  tags: []
"2Tm4,11":
  text: "Jedynie Łukasz jest ze mną. Marka weź i przyprowadź ze sobą, bo jest mi bardzo przydatny do służby."
  tags: []
"2Tm4,12":
  text: "A Tychika posłałem do Efezu."
  tags: []
"2Tm4,13":
  text: "Płaszcz, który zostawiłem w Troadzie u Karpusa, idąc po drodze, przynieś ze sobą, i zwoje, zwłaszcza pergaminy."
  tags: []
"2Tm4,14":
  text: "Aleksander brązownik okazał mi wiele zła; oby oddał mu Pan według jego czynów;"
  tags: []
"2Tm4,15":
  text: "Ty jego również się strzeż, albowiem bardzo sprzeciwia się naszym słowom."
  tags: []
"2Tm4,16":
  text: "W pierwszej mojej obronie nikt przy mnie nie stanął, ale wszyscy mnie opuścili; oby im to nie było policzone."
  tags: []
"2Tm4,17":
  text: "Ale Pan przy mnie stał i mnie umocnił, aby przeze mnie było dopełnione głoszenie Ewangelii i aby ją słyszeli wszyscy poganie; i zostałem wyrwany z lwiej paszczy."
  tags: []
"2Tm4,18":
  text: "A Pan mnie wyrwie z wszelkiego złego dzieła i uratuje dla swojego Królestwa niebiańskiego. Jemu chwała na wieki wieków. Amen."
  tags: []
"2Tm4,19":
  text: "Pozdrów Pryskę i Akwilę, i dom Onezyfora."
  tags: []
"2Tm4,20":
  text: "Erast został w Koryncie, a chorego Trofima zostawiłem w Milecie."
  tags: []
"2Tm4,21":
  text: "Staraj się przyjść przed zimą. Pozdrawiają cię Eubulos i Pudens, i Linus, i Klaudia, i wszyscy bracia."
  tags: []
"2Tm4,22":
  text: "Pan Jezus Chrystus z duchem twoim. Łaska z wami. Amen."
  tags: []
