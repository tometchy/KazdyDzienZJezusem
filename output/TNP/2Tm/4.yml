"2Tm4,1": "Ja więc uroczyście zaświadczam przed obliczem Boga i Pana Jezusa Chrystusa, który będzie sądzić żywych i martwych, podczas Jego pojawienia się i Jego Królestwa:"
"2Tm4,2": "Głoś słowo, bądź gotów w dogodnym i w niedogodnym czasie, wykaż błąd, skarć, zachęć z wszelką cierpliwością i nauką."
"2Tm4,3": "Albowiem będzie czas, gdy zdrowej nauki nie ścierpią, ale według swoich pożądliwości nagromadzą sobie nauczycieli, dając sobie łechtać ucho,"
"2Tm4,4": "I zaiste odwrócą się od słuchania prawdy, a będą zwracali się do baśni."
"2Tm4,5": "Ale ty bądź trzeźwy we wszystkim, znieś złą dolę, czyń dzieło ewangelisty, wypełnij swoją służbę."
"2Tm4,6": "Ja bowiem już jestem wylewany jako dar ofiarny i nadszedł czas mego odejścia."
"2Tm4,7": "Dobry bój stoczyłem, bieg kończę, wiarę zachowuję;"
"2Tm4,8": "Na koniec odłożony jest dla mnie wieniec sprawiedliwości, który odda mi w tym dniu Pan, sędzia sprawiedliwy, a nie tylko mi, lecz i wszystkim, którzy umiłowali Jego pojawienie się."
"2Tm4,9": "Staraj się przyjść do mnie szybko."
"2Tm4,10": "Demas bowiem mnie opuścił, bo umiłował obecny wiek i poszedł do Tesalonik, Krescens do Galacji, Tytus do Dalmacji;"
"2Tm4,11": "Jedynie Łukasz jest ze mną. Marka weź i przyprowadź ze sobą, bo jest mi bardzo przydatny do służby."
"2Tm4,12": "A Tychika posłałem do Efezu."
"2Tm4,13": "Płaszcz, który zostawiłem w Troadzie u Karpusa, idąc po drodze, przynieś ze sobą, i zwoje, zwłaszcza pergaminy."
"2Tm4,14": "Aleksander brązownik okazał mi wiele zła; oby oddał mu Pan według jego czynów;"
"2Tm4,15": "Ty jego również się strzeż, albowiem bardzo sprzeciwia się naszym słowom."
"2Tm4,16": "W pierwszej mojej obronie nikt przy mnie nie stanął, ale wszyscy mnie opuścili; oby im to nie było policzone."
"2Tm4,17": "Ale Pan przy mnie stał i mnie umocnił, aby przeze mnie było dopełnione głoszenie Ewangelii i aby ją słyszeli wszyscy poganie; i zostałem wyrwany z lwiej paszczy."
"2Tm4,18": "A Pan mnie wyrwie z wszelkiego złego dzieła i uratuje dla swojego Królestwa niebiańskiego. Jemu chwała na wieki wieków. Amen."
"2Tm4,19": "Pozdrów Pryskę i Akwilę, i dom Onezyfora."
"2Tm4,20": "Erast został w Koryncie, a chorego Trofima zostawiłem w Milecie."
"2Tm4,21": "Staraj się przyjść przed zimą. Pozdrawiają cię Eubulos i Pudens, i Linus, i Klaudia, i wszyscy bracia."
"2Tm4,22": "Pan Jezus Chrystus z duchem twoim. Łaska z wami. Amen."
