"2Tm2,1": "Ty więc, dziecko moje, bądź napełniany mocą w łasce, która jest w Chrystusie Jezusie;"
"2Tm2,2": "A to, co usłyszałeś ode mnie wobec wielu świadków, powierz ludziom godnym zaufania, którzy będą w stanie i innych nauczać."
"2Tm2,3": "Ty zatem znoś złą dolę, jako dobry żołnierz Jezusa Chrystusa."
"2Tm2,4": "Nikt, kto pełni służbę wojskową, nie jest wikłany w sprawy tego życia, aby podobać się temu, który go powołał do wojska."
"2Tm2,5": "A jeśli ktoś stanąłby do walki, nie otrzyma wieńca, jeżeli nie walczył w zawodach prawidłowo."
"2Tm2,6": "Rolnik, który się trudzi, powinien pierwszy korzystać z plonów."
"2Tm2,7": "Rozważaj, co mówię, oby Pan dał ci we wszystkim zrozumienie."
"2Tm2,8": "Miej w pamięci, że Jezus Chrystus, który jest z nasienia Dawida, powstał z martwych, według mojej Ewangelii,"
"2Tm2,9": "Za którą cierpię aż do więzów, jak złoczyńca; ale Słowo Boże nie jest związane."
"2Tm2,10": "Dlatego wszystko znoszę dla wybranych, aby i oni doświadczyli zbawienia, które jest w Chrystusie Jezusie wraz z chwałą wieczną."
"2Tm2,11": "Godne zaufania jest to słowo; bo jeśli z Nim umarliśmy, z Nim też będziemy żyć;"
"2Tm2,12": "Jeśli trwamy, będziemy razem z Nim królować; jeśli się Go zapieramy, i On nas się zaprze;"
"2Tm2,13": "Jeśli my jesteśmy niewierni, On pozostaje wierny, gdyż zaprzeć się samego siebie nie może."
"2Tm2,14": "To przypominaj, świadcząc przed obliczem Pana, aby nie walczyć o słowa, bo nie ma w tym nic pożytecznego, tylko prowadzi słuchaczy do ruiny."
"2Tm2,15": "Staraj się gorliwie, abyś stanął przed Bogiem jako doświadczony pracownik, który nie musi się wstydzić, trafnie rozdzielający Słowo Prawdy."
"2Tm2,16": "Tych natomiast o pospolitej i pustej mowie unikaj; albowiem oni jeszcze bardziej posuną się w bezbożności."
"2Tm2,17": "A słowo ich będzie mieć pożywkę jak gangrena, do nich należą Hymeneusz i Filetos,"
"2Tm2,18": "Którzy rozminęli się z prawdą, mówiąc, że powstanie z martwych już się dokonało, i wywracają wiarę niektórych."
"2Tm2,19": "Jednak fundament Boży stoi niewzruszony, mając tę pieczęć: Zna Pan tych, którzy są Jego; i: Niech odstąpi od niesprawiedliwości każdy, kto wzywa imię Chrystusa."
"2Tm2,20": "A w wielkim domu są nie tylko naczynia złote i srebrne, ale też drewniane i gliniane, jedne do celów zaszczytnych, drugie natomiast do niezaszczytnych."
"2Tm2,21": "Jeśli więc ktoś oczyściłby samego siebie z tych rzeczy, będzie naczyniem do celów zaszczytnych, poświęconym i przydatnym Władcy, przygotowanym do każdego dobrego dzieła."
"2Tm2,22": "Uciekaj też od młodzieńczych pożądliwości, a zabiegaj o sprawiedliwość, wiarę, miłość, pokój z tymi, którzy wzywają Pana z czystego serca."
"2Tm2,23": "Unikaj także głupich i niewychowawczych dociekań, wiedząc, że rodzą konflikty."
"2Tm2,24": "A sługa Pana nie powinien być wojowniczy, lecz ma być uprzejmy dla wszystkich, zdolny do nauczania, cierpliwie znoszący zło,"
"2Tm2,25": "Z łagodnością korygujący przeciwników, aby kiedyś Bóg dał im upamiętanie dla dogłębnego poznania prawdy,"
"2Tm2,26": "Aby otrząsnęli się z sideł diabła, żywcem przez niego schwytani, by pełnić jego wolę."
