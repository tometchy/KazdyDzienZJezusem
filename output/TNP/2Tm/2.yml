"2Tm2,1":
  text: "Ty więc, dziecko moje, bądź napełniany mocą w łasce, która jest w Chrystusie Jezusie;"
  tags: []
"2Tm2,2":
  text: "A to, co usłyszałeś ode mnie wobec wielu świadków, powierz ludziom godnym zaufania, którzy będą w stanie i innych nauczać."
  tags: []
"2Tm2,3":
  text: "Ty zatem znoś złą dolę, jako dobry żołnierz Jezusa Chrystusa."
  tags: []
"2Tm2,4":
  text: "Nikt, kto pełni służbę wojskową, nie jest wikłany w sprawy tego życia, aby podobać się temu, który go powołał do wojska."
  tags: []
"2Tm2,5":
  text: "A jeśli ktoś stanąłby do walki, nie otrzyma wieńca, jeżeli nie walczył w zawodach prawidłowo."
  tags: []
"2Tm2,6":
  text: "Rolnik, który się trudzi, powinien pierwszy korzystać z plonów."
  tags: []
"2Tm2,7":
  text: "Rozważaj, co mówię, oby Pan dał ci we wszystkim zrozumienie."
  tags: []
"2Tm2,8":
  text: "Miej w pamięci, że Jezus Chrystus, który jest z nasienia Dawida, powstał z martwych, według mojej Ewangelii,"
  tags: []
"2Tm2,9":
  text: "Za którą cierpię aż do więzów, jak złoczyńca; ale Słowo Boże nie jest związane."
  tags: []
"2Tm2,10":
  text: "Dlatego wszystko znoszę dla wybranych, aby i oni doświadczyli zbawienia, które jest w Chrystusie Jezusie wraz z chwałą wieczną."
  tags: []
"2Tm2,11":
  text: "Godne zaufania jest to słowo; bo jeśli z Nim umarliśmy, z Nim też będziemy żyć;"
  tags: []
"2Tm2,12":
  text: "Jeśli trwamy, będziemy razem z Nim królować; jeśli się Go zapieramy, i On nas się zaprze;"
  tags: []
"2Tm2,13":
  text: "Jeśli my jesteśmy niewierni, On pozostaje wierny, gdyż zaprzeć się samego siebie nie może."
  tags: []
"2Tm2,14":
  text: "To przypominaj, świadcząc przed obliczem Pana, aby nie walczyć o słowa, bo nie ma w tym nic pożytecznego, tylko prowadzi słuchaczy do ruiny."
  tags: []
"2Tm2,15":
  text: "Staraj się gorliwie, abyś stanął przed Bogiem jako doświadczony pracownik, który nie musi się wstydzić, trafnie rozdzielający Słowo Prawdy."
  tags: []
"2Tm2,16":
  text: "Tych natomiast o pospolitej i pustej mowie unikaj; albowiem oni jeszcze bardziej posuną się w bezbożności."
  tags: []
"2Tm2,17":
  text: "A słowo ich będzie mieć pożywkę jak gangrena, do nich należą Hymeneusz i Filetos,"
  tags: []
"2Tm2,18":
  text: "Którzy rozminęli się z prawdą, mówiąc, że powstanie z martwych już się dokonało, i wywracają wiarę niektórych."
  tags: []
"2Tm2,19":
  text: "Jednak fundament Boży stoi niewzruszony, mając tę pieczęć: Zna Pan tych, którzy są Jego; i: Niech odstąpi od niesprawiedliwości każdy, kto wzywa imię Chrystusa."
  tags: []
"2Tm2,20":
  text: "A w wielkim domu są nie tylko naczynia złote i srebrne, ale też drewniane i gliniane, jedne do celów zaszczytnych, drugie natomiast do niezaszczytnych."
  tags: []
"2Tm2,21":
  text: "Jeśli więc ktoś oczyściłby samego siebie z tych rzeczy, będzie naczyniem do celów zaszczytnych, poświęconym i przydatnym Władcy, przygotowanym do każdego dobrego dzieła."
  tags: []
"2Tm2,22":
  text: "Uciekaj też od młodzieńczych pożądliwości, a zabiegaj o sprawiedliwość, wiarę, miłość, pokój z tymi, którzy wzywają Pana z czystego serca."
  tags: []
"2Tm2,23":
  text: "Unikaj także głupich i niewychowawczych dociekań, wiedząc, że rodzą konflikty."
  tags: []
"2Tm2,24":
  text: "A sługa Pana nie powinien być wojowniczy, lecz ma być uprzejmy dla wszystkich, zdolny do nauczania, cierpliwie znoszący zło,"
  tags: []
"2Tm2,25":
  text: "Z łagodnością korygujący przeciwników, aby kiedyś Bóg dał im upamiętanie dla dogłębnego poznania prawdy,"
  tags: []
"2Tm2,26":
  text: "Aby otrząsnęli się z sideł diabła, żywcem przez niego schwytani, by pełnić jego wolę."
  tags: []
