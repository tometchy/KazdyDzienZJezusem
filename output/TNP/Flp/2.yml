"Flp2,1": "Jeśli więc jest jakaś zachęta w Chrystusie, jeśli jakaś pociecha miłości, jeśli jakaś wspólnota ducha, jeśli jakieś serdeczne uczucie i miłosierdzie,"
"Flp2,2": "Dopełnijcie mojej radości, mając to samo rozumienie, tę samą miłość, jedną duszę i jedno myśląc."
"Flp2,3": "Nic nie czyniąc z powodu próżnej ambicji lub pustej chwały, ale w pokorze jedni drugich mając za wyższych od siebie."
"Flp2,4": "Niech wszyscy mają na uwadze nie tylko swoje sprawy, ale każdy i sprawy innych."
"Flp2,5": "Ten bowiem sposób myślenia niech będzie w was, jaki i był w Chrystusie Jezusie,"
"Flp2,6": "Który będąc w postaci Bożej, nie uznał za grabież być równym Bogu,"
"Flp2,7": "Ale ogołocił samego siebie, przyjął postać sługi, stając się podobny ludziom, a w zewnętrznej postaci został znaleziony jako człowiek;"
"Flp2,8": "Sam siebie uniżył, stając się posłusznym aż do śmierci, i to śmierci na krzyżu."
"Flp2,9": "Dlatego też Bóg wywyższył Go ponad wszystko i darował Mu imię, ponad wszelkie imię;"
"Flp2,10": "Aby na imię Jezusa zginało się każde kolano istot niebiańskich, ziemskich i podziemnych,"
"Flp2,11": "I aby każdy język wyznawał, że Jezus Chrystus jest Panem ku chwale Boga Ojca."
"Flp2,12": "Dlatego, moi umiłowani, tak jak zawsze byliście posłuszni, nie tylko w mojej obecności, ale teraz daleko więcej podczas mojej nieobecności, z bojaźnią i drżeniem sprawujcie swoje zbawienie."
"Flp2,13": "Bóg bowiem jest Tym, który sprawia w was i chęć, i wykonywanie według swojego upodobania."
"Flp2,14": "Wszystko czyńcie bez szemrania i powątpiewania,"
"Flp2,15": "Abyście stali się nienaganni i szczerzy jako dzieci Boga, niewinni wśród rodu wynaturzonego i przewrotnego, w którym jesteście widoczni jak światła na świecie,"
"Flp2,16": "Zachowując słowa życia ku mojej chlubie na dzień Chrystusa, że nie na próżno biegłem i nie na próżno się trudziłem."
"Flp2,17": "Ale jeżeli i teraz jestem wylany na ofiarę i w służbie waszej wiary, raduję się i współraduję się z wami wszystkimi."
"Flp2,18": "A tak samo i wy radujcie się i współradujcie się ze mną."
"Flp2,19": "I mam nadzieję w Panu Jezusie, że Tymoteusza szybko poślę do was, abym i ja był dobrej myśli, wiedząc o tym, co wśród was się dzieje."
"Flp2,20": "Albowiem nie mam nikogo równie myślącego jak on, który by się prawdziwie zatroszczył o to, co was dotyczy."
"Flp2,21": "Bo wszyscy szukają swoich spraw, a nie tych spraw, które są Chrystusa Jezusa."
"Flp2,22": "A jego doświadczenie znacie, dlatego że jak dziecko ojcu, razem ze mną służył dla Ewangelii."
"Flp2,23": "Mam więc nadzieję, że go natychmiast do was poślę, jak tylko zobaczę co się ze mną stanie;"
"Flp2,24": "A jestem przekonany w Panu, że i sam szybko do was przyjdę."
"Flp2,25": "Ale uważałem za konieczne posłać do was Epafrodyta, brata i mojego współpracownika i współbojownika, a waszego posłańca i sługę w mojej potrzebie,"
"Flp2,26": "Ponieważ tęsknił do was wszystkich i martwił się, bo słyszeliście, że zachorował."
"Flp2,27": "Bo wprawdzie chorował, tak że był bliski śmierci; ale Bóg zmiłował się nad nim, a nie tylko nad nim, ale i nade mną, abym nie miał smutku za smutkiem."
"Flp2,28": "Dlatego tym pilniej posłałem go, abyście widząc go, ponownie uradowali się, a ja abym miał mniej smutku."
"Flp2,29": "Przyjmijcie go więc w Panu z całą radością; a takich ludzi miejcie w poszanowaniu."
"Flp2,30": "Bo z powodu dzieła Chrystusa bliski był śmierci, narażając duszę swoją na niebezpieczeństwo, aby dopełnić tego, czego w waszej służbie wobec mnie brakowało."
