"Flp2,1":
  text: "Jeśli więc jest jakaś zachęta w Chrystusie, jeśli jakaś pociecha miłości, jeśli jakaś wspólnota ducha, jeśli jakieś serdeczne uczucie i miłosierdzie,"
  tags: []
"Flp2,2":
  text: "Dopełnijcie mojej radości, mając to samo rozumienie, tę samą miłość, jedną duszę i jedno myśląc."
  tags: []
"Flp2,3":
  text: "Nic nie czyniąc z powodu próżnej ambicji lub pustej chwały, ale w pokorze jedni drugich mając za wyższych od siebie."
  tags: []
"Flp2,4":
  text: "Niech wszyscy mają na uwadze nie tylko swoje sprawy, ale każdy i sprawy innych."
  tags: []
"Flp2,5":
  text: "Ten bowiem sposób myślenia niech będzie w was, jaki i był w Chrystusie Jezusie,"
  tags: []
"Flp2,6":
  text: "Który będąc w postaci Bożej, nie uznał za grabież być równym Bogu,"
  tags: []
"Flp2,7":
  text: "Ale ogołocił samego siebie, przyjął postać sługi, stając się podobny ludziom, a w zewnętrznej postaci został znaleziony jako człowiek;"
  tags: []
"Flp2,8":
  text: "Sam siebie uniżył, stając się posłusznym aż do śmierci, i to śmierci na krzyżu."
  tags: []
"Flp2,9":
  text: "Dlatego też Bóg wywyższył Go ponad wszystko i darował Mu imię, ponad wszelkie imię;"
  tags: []
"Flp2,10":
  text: "Aby na imię Jezusa zginało się każde kolano istot niebiańskich, ziemskich i podziemnych,"
  tags: []
"Flp2,11":
  text: "I aby każdy język wyznawał, że Jezus Chrystus jest Panem ku chwale Boga Ojca."
  tags: []
"Flp2,12":
  text: "Dlatego, moi umiłowani, tak jak zawsze byliście posłuszni, nie tylko w mojej obecności, ale teraz daleko więcej podczas mojej nieobecności, z bojaźnią i drżeniem sprawujcie swoje zbawienie."
  tags: []
"Flp2,13":
  text: "Bóg bowiem jest Tym, który sprawia w was i chęć, i wykonywanie według swojego upodobania."
  tags: []
"Flp2,14":
  text: "Wszystko czyńcie bez szemrania i powątpiewania,"
  tags: []
"Flp2,15":
  text: "Abyście stali się nienaganni i szczerzy jako dzieci Boga, niewinni wśród rodu wynaturzonego i przewrotnego, w którym jesteście widoczni jak światła na świecie,"
  tags: []
"Flp2,16":
  text: "Zachowując słowa życia ku mojej chlubie na dzień Chrystusa, że nie na próżno biegłem i nie na próżno się trudziłem."
  tags: []
"Flp2,17":
  text: "Ale jeżeli i teraz jestem wylany na ofiarę i w służbie waszej wiary, raduję się i współraduję się z wami wszystkimi."
  tags: []
"Flp2,18":
  text: "A tak samo i wy radujcie się i współradujcie się ze mną."
  tags: []
"Flp2,19":
  text: "I mam nadzieję w Panu Jezusie, że Tymoteusza szybko poślę do was, abym i ja był dobrej myśli, wiedząc o tym, co wśród was się dzieje."
  tags: []
"Flp2,20":
  text: "Albowiem nie mam nikogo równie myślącego jak on, który by się prawdziwie zatroszczył o to, co was dotyczy."
  tags: []
"Flp2,21":
  text: "Bo wszyscy szukają swoich spraw, a nie tych spraw, które są Chrystusa Jezusa."
  tags: []
"Flp2,22":
  text: "A jego doświadczenie znacie, dlatego że jak dziecko ojcu, razem ze mną służył dla Ewangelii."
  tags: []
"Flp2,23":
  text: "Mam więc nadzieję, że go natychmiast do was poślę, jak tylko zobaczę co się ze mną stanie;"
  tags: []
"Flp2,24":
  text: "A jestem przekonany w Panu, że i sam szybko do was przyjdę."
  tags: []
"Flp2,25":
  text: "Ale uważałem za konieczne posłać do was Epafrodyta, brata i mojego współpracownika i współbojownika, a waszego posłańca i sługę w mojej potrzebie,"
  tags: []
"Flp2,26":
  text: "Ponieważ tęsknił do was wszystkich i martwił się, bo słyszeliście, że zachorował."
  tags: []
"Flp2,27":
  text: "Bo wprawdzie chorował, tak że był bliski śmierci; ale Bóg zmiłował się nad nim, a nie tylko nad nim, ale i nade mną, abym nie miał smutku za smutkiem."
  tags: []
"Flp2,28":
  text: "Dlatego tym pilniej posłałem go, abyście widząc go, ponownie uradowali się, a ja abym miał mniej smutku."
  tags: []
"Flp2,29":
  text: "Przyjmijcie go więc w Panu z całą radością; a takich ludzi miejcie w poszanowaniu."
  tags: []
"Flp2,30":
  text: "Bo z powodu dzieła Chrystusa bliski był śmierci, narażając duszę swoją na niebezpieczeństwo, aby dopełnić tego, czego w waszej służbie wobec mnie brakowało."
  tags: []
