"Flp4,1": "Dlatego, bracia moi umiłowani i upragnieni, radości moja i wieńcu mój, tak stójcie w Panu, umiłowani."
"Flp4,2": "Zachęcam Ewodię i zachęcam Syntychę, aby były jednomyślne w Panu."
"Flp4,3": "Proszę też i ciebie, prawdziwy towarzyszu, pomagaj im, gdyż one dla Ewangelii razem ze mną walczyły wraz z Klemensem, i z pozostałymi moimi współpracownikami, których imiona są w zwoju życia."
"Flp4,4": "Radujcie się zawsze w Panu; ponownie mówię: Radujcie się."
"Flp4,5": "Łagodność wasza niech będzie znana wszystkim ludziom; Pan jest blisko."
"Flp4,6": "Nie troszczcie się o nic, ale w każdej modlitwie i błaganiu z dziękczynieniem, prośby wasze niech są znane Bogu."
"Flp4,7": "A pokój Boży, który przewyższa wszelki rozum, będzie strzegł waszych serc i waszych myśli w Chrystusie Jezusie."
"Flp4,8": "Na koniec, bracia, co tylko jest prawdziwe, co tylko szlachetne, co tylko sprawiedliwe, co tylko czyste, co tylko miłe, co tylko chwalebne, jeśli coś jest cnotą i jeśli coś jest chwałą, o tym rozważajcie."
"Flp4,9": "Czego się też nauczyliście i co przyjęliście, i słyszeliście, i widzieliście we mnie, to czyńcie, a Bóg pokoju będzie z wami."
"Flp4,10": "A wielce ucieszyłem się w Panu, że jak niegdyś, tak teraz rozkwitła wasza troska o mnie; myśleliście już o tym, jednak nie mieliście ku temu sposobności."
"Flp4,11": "Mówię to nie z powodu niedostatku; bo nauczyłem się być samowystarczalny."
"Flp4,12": "Umiem być uniżonym, umiem i obfitować; wszędzie i we wszystko jestem wtajemniczony, i nasyconym być i głodować, i obfitować i być w niedostatku;"
"Flp4,13": "Wszystko mogę w Tym, który mnie napełnia mocą, w Chrystusie."
"Flp4,14": "Jednak dobrze uczyniliście, stając się współuczestnikami mojego ucisku."
"Flp4,15": "A wiecie i wy, Filipianie, że na początku głoszenia Ewangelii, gdy wyszedłem z Macedonii, żaden zbór nie stał się wspólnikiem na rachunku rozchodu i przychodu, tylko wy jedyni;"
"Flp4,16": "Bo i do Tesalonik raz i drugi posłaliście mi na moje potrzeby."
"Flp4,17": "Nie, żebym pragnął daru; ale pragnę owocu, rosnącego na waszym rachunku."
"Flp4,18": "A odebrałem wszystko i mam nadmiar; jestem zaopatrzony, biorąc od Epafrodyta, co posłaliście, tę wonność kadzidła, ofiarę godną przyjęcia i bardzo podobającą się Bogu."
"Flp4,19": "A Bóg mój wypełni wszelką potrzebę waszą według swojego bogactwa w chwale, w Chrystusie Jezusie."
"Flp4,20": "A Bogu i Ojcu naszemu chwała na wieki wieków. Amen."
"Flp4,21": "Pozdrówcie każdego świętego w Chrystusie Jezusie. Pozdrawiają was bracia, którzy są ze mną."
"Flp4,22": "Pozdrawiają was wszyscy święci, a najbardziej ci z domu Cezara."
"Flp4,23": "Łaska Pana naszego Jezusa Chrystusa z wami wszystkimi. Amen."
