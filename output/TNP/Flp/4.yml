"Flp4,1":
  text: "Dlatego, bracia moi umiłowani i upragnieni, radości moja i wieńcu mój, tak stójcie w Panu, umiłowani."
  tags: []
"Flp4,2":
  text: "Zachęcam Ewodię i zachęcam Syntychę, aby były jednomyślne w Panu."
  tags: []
"Flp4,3":
  text: "Proszę też i ciebie, prawdziwy towarzyszu, pomagaj im, gdyż one dla Ewangelii razem ze mną walczyły wraz z Klemensem, i z pozostałymi moimi współpracownikami, których imiona są w zwoju życia."
  tags: []
"Flp4,4":
  text: "Radujcie się zawsze w Panu; ponownie mówię: Radujcie się."
  tags: []
"Flp4,5":
  text: "Łagodność wasza niech będzie znana wszystkim ludziom; Pan jest blisko."
  tags: []
"Flp4,6":
  text: "Nie troszczcie się o nic, ale w każdej modlitwie i błaganiu z dziękczynieniem, prośby wasze niech są znane Bogu."
  tags: []
"Flp4,7":
  text: "A pokój Boży, który przewyższa wszelki rozum, będzie strzegł waszych serc i waszych myśli w Chrystusie Jezusie."
  tags: []
"Flp4,8":
  text: "Na koniec, bracia, co tylko jest prawdziwe, co tylko szlachetne, co tylko sprawiedliwe, co tylko czyste, co tylko miłe, co tylko chwalebne, jeśli coś jest cnotą i jeśli coś jest chwałą, o tym rozważajcie."
  tags: []
"Flp4,9":
  text: "Czego się też nauczyliście i co przyjęliście, i słyszeliście, i widzieliście we mnie, to czyńcie, a Bóg pokoju będzie z wami."
  tags: []
"Flp4,10":
  text: "A wielce ucieszyłem się w Panu, że jak niegdyś, tak teraz rozkwitła wasza troska o mnie; myśleliście już o tym, jednak nie mieliście ku temu sposobności."
  tags: []
"Flp4,11":
  text: "Mówię to nie z powodu niedostatku; bo nauczyłem się być samowystarczalny."
  tags: []
"Flp4,12":
  text: "Umiem być uniżonym, umiem i obfitować; wszędzie i we wszystko jestem wtajemniczony, i nasyconym być i głodować, i obfitować i być w niedostatku;"
  tags: []
"Flp4,13":
  text: "Wszystko mogę w Tym, który mnie napełnia mocą, w Chrystusie."
  tags: []
"Flp4,14":
  text: "Jednak dobrze uczyniliście, stając się współuczestnikami mojego ucisku."
  tags: []
"Flp4,15":
  text: "A wiecie i wy, Filipianie, że na początku głoszenia Ewangelii, gdy wyszedłem z Macedonii, żaden zbór nie stał się wspólnikiem na rachunku rozchodu i przychodu, tylko wy jedyni;"
  tags: []
"Flp4,16":
  text: "Bo i do Tesalonik raz i drugi posłaliście mi na moje potrzeby."
  tags: []
"Flp4,17":
  text: "Nie, żebym pragnął daru; ale pragnę owocu, rosnącego na waszym rachunku."
  tags: []
"Flp4,18":
  text: "A odebrałem wszystko i mam nadmiar; jestem zaopatrzony, biorąc od Epafrodyta, co posłaliście, tę wonność kadzidła, ofiarę godną przyjęcia i bardzo podobającą się Bogu."
  tags: []
"Flp4,19":
  text: "A Bóg mój wypełni wszelką potrzebę waszą według swojego bogactwa w chwale, w Chrystusie Jezusie."
  tags: []
"Flp4,20":
  text: "A Bogu i Ojcu naszemu chwała na wieki wieków. Amen."
  tags: []
"Flp4,21":
  text: "Pozdrówcie każdego świętego w Chrystusie Jezusie. Pozdrawiają was bracia, którzy są ze mną."
  tags: []
"Flp4,22":
  text: "Pozdrawiają was wszyscy święci, a najbardziej ci z domu Cezara."
  tags: []
"Flp4,23":
  text: "Łaska Pana naszego Jezusa Chrystusa z wami wszystkimi. Amen."
  tags: []
