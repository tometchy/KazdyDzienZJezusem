"Flp1,1": "Paweł i Tymoteusz, słudzy Jezusa Chrystusa, do wszystkich świętych w Chrystusie Jezusie, którzy są w Filippi, z biskupami i z diakonami."
"Flp1,2": "Łaska wam i pokój od Boga, Ojca naszego i Pana Jezusa Chrystusa."
"Flp1,3": "Dziękuję Bogu mojemu przy każdym moim wspomnieniu o was,"
"Flp1,4": "Zawsze w każdej mojej modlitwie, za was wszystkich, modląc się z radością,"
"Flp1,5": "Z powodu wspólnoty waszej w Ewangelii, od pierwszego dnia aż do teraz,"
"Flp1,6": "Będąc przekonany o tym, że Ten, który rozpoczął w was dobre dzieło, doprowadzi je do końca, aż do dnia Jezusa Chrystusa."
"Flp1,7": "Wobec tego słuszne jest, abym tak o was wszystkich myślał, dlatego mam was w swoim sercu, bo w więzach moich, jak i w obronie i w utwierdzeniu Ewangelii, wy wszyscy jesteście ze mną uczestnikami łaski."
"Flp1,8": "Albowiem Bóg jest moim świadkiem, jak tęsknię do was wszystkich najgłębszymi uczuciami Jezusa Chrystusa,"
"Flp1,9": "I modlę się o to, aby wasza miłość jeszcze bardziej i bardziej obfitowała w dogłębnym poznaniu i we wszelkim doznaniu,"
"Flp1,10": "Abyście mogli rozpoznać to, co ważne, byście byli czyści i bez zarzutu na dzień Chrystusa,"
"Flp1,11": "Będąc napełnieni owocami sprawiedliwości przez Jezusa Chrystusa, ku chwale i sławie Boga."
"Flp1,12": "A chcę, bracia, abyście wiedzieli, że przeciwności wobec mnie, wpłynęły raczej na rozkrzewienie Ewangelii,"
"Flp1,13": "Tak że więzy moje dla Chrystusa stały się znane w całym pretorium i wszystkim pozostałym."
"Flp1,14": "A coraz liczniejsi bracia w Panu, będąc przekonani moimi więzami, zaczęli z większą śmiałością, bez bojaźni opowiadać Słowo."
"Flp1,15": "Niektórzy wprawdzie z powodu zazdrości i kłótni, a niektórzy natomiast z powodu dobrej woli głoszą Chrystusa."
"Flp1,16": "Ci, którzy istotnie z powodu próżnej ambicji głoszą Chrystusa nieszczerze, przypuszczają, że przydają ucisku moim więzom;"
"Flp1,17": "A ci, którzy z miłości, wiedzą, że jestem ustanawiany do obrony Ewangelii."
"Flp1,18": "Cóż więc? Mimo że każdym sposobem czy pozornie, czy to w prawdzie, Chrystus jest głoszony; z tego się raduję i będę się radował,"
"Flp1,19": "Wiem bowiem, że to okaże się mi ku wybawieniu przez modlitwę waszą i wsparcie Ducha Jezusa Chrystusa,"
"Flp1,20": "Według oczekiwania i nadziei mojej, że w niczym nie zostanę zawstydzony, ale z całą śmiałością, jak zawsze, tak i teraz, wywyższony zostanie Chrystus w moim ciele, czy to przez życie, czy przez śmierć."
"Flp1,21": "Dla mnie bowiem żyć – Chrystus, umrzeć – zysk."
"Flp1,22": "Jeśli jednak żyć w ciele – to dla mnie owoc dzieła; a co wybiorę – nie wiem."
"Flp1,23": "Albowiem jedno i drugie mnie naciska; pragnę odejść i być z Chrystusem, bo to daleko lepsze,"
"Flp1,24": "Ale pozostać w ciele jest bardziej potrzebne ze względu na was."
"Flp1,25": "A będąc tego pewien, wiem, że pozostanę i będę trwał razem przy wszystkich dla waszego postępu i radości wiary,"
"Flp1,26": "Aby chluba wasza obfitowała w Chrystusie Jezusie we mnie, z powodu mojego ponownego przyjścia do was."
"Flp1,27": "Tylko żyjcie jak wolni obywatele w sposób godny Ewangelii Chrystusa, abym, czy przyjdę i ujrzę was, czy nieobecny, słyszał o was, że stoicie w jednym Duchu, jedną duszą walcząc razem dla wiary Ewangelii,"
"Flp1,28": "I w niczym nie dając się zastraszyć przeciwnikom; co dla nich prawdziwie jest dowodem zguby, a dla was zbawienia, i to od Boga;"
"Flp1,29": "Gdyż wam to zostało darowane dla Chrystusa, abyście nie tylko w Niego wierzyli, ale i dla Niego cierpieli,"
"Flp1,30": "Tocząc tę samą walkę, jaką widzieliście we mnie i o jakiej we mnie teraz słyszycie."
