"Flp1,1":
  text: "Paweł i Tymoteusz, słudzy Jezusa Chrystusa, do wszystkich świętych w Chrystusie Jezusie, którzy są w Filippi, z biskupami i z diakonami."
  tags: []
"Flp1,2":
  text: "Łaska wam i pokój od Boga, Ojca naszego i Pana Jezusa Chrystusa."
  tags: []
"Flp1,3":
  text: "Dziękuję Bogu mojemu przy każdym moim wspomnieniu o was,"
  tags: []
"Flp1,4":
  text: "Zawsze w każdej mojej modlitwie, za was wszystkich, modląc się z radością,"
  tags: []
"Flp1,5":
  text: "Z powodu wspólnoty waszej w Ewangelii, od pierwszego dnia aż do teraz,"
  tags: []
"Flp1,6":
  text: "Będąc przekonany o tym, że Ten, który rozpoczął w was dobre dzieło, doprowadzi je do końca, aż do dnia Jezusa Chrystusa."
  tags: []
"Flp1,7":
  text: "Wobec tego słuszne jest, abym tak o was wszystkich myślał, dlatego mam was w swoim sercu, bo w więzach moich, jak i w obronie i w utwierdzeniu Ewangelii, wy wszyscy jesteście ze mną uczestnikami łaski."
  tags: []
"Flp1,8":
  text: "Albowiem Bóg jest moim świadkiem, jak tęsknię do was wszystkich najgłębszymi uczuciami Jezusa Chrystusa,"
  tags: []
"Flp1,9":
  text: "I modlę się o to, aby wasza miłość jeszcze bardziej i bardziej obfitowała w dogłębnym poznaniu i we wszelkim doznaniu,"
  tags: []
"Flp1,10":
  text: "Abyście mogli rozpoznać to, co ważne, byście byli czyści i bez zarzutu na dzień Chrystusa,"
  tags: []
"Flp1,11":
  text: "Będąc napełnieni owocami sprawiedliwości przez Jezusa Chrystusa, ku chwale i sławie Boga."
  tags: []
"Flp1,12":
  text: "A chcę, bracia, abyście wiedzieli, że przeciwności wobec mnie, wpłynęły raczej na rozkrzewienie Ewangelii,"
  tags: []
"Flp1,13":
  text: "Tak że więzy moje dla Chrystusa stały się znane w całym pretorium i wszystkim pozostałym."
  tags: []
"Flp1,14":
  text: "A coraz liczniejsi bracia w Panu, będąc przekonani moimi więzami, zaczęli z większą śmiałością, bez bojaźni opowiadać Słowo."
  tags: []
"Flp1,15":
  text: "Niektórzy wprawdzie z powodu zazdrości i kłótni, a niektórzy natomiast z powodu dobrej woli głoszą Chrystusa."
  tags: []
"Flp1,16":
  text: "Ci, którzy istotnie z powodu próżnej ambicji głoszą Chrystusa nieszczerze, przypuszczają, że przydają ucisku moim więzom;"
  tags: []
"Flp1,17":
  text: "A ci, którzy z miłości, wiedzą, że jestem ustanawiany do obrony Ewangelii."
  tags: []
"Flp1,18":
  text: "Cóż więc? Mimo że każdym sposobem czy pozornie, czy to w prawdzie, Chrystus jest głoszony; z tego się raduję i będę się radował,"
  tags: []
"Flp1,19":
  text: "Wiem bowiem, że to okaże się mi ku wybawieniu przez modlitwę waszą i wsparcie Ducha Jezusa Chrystusa,"
  tags: []
"Flp1,20":
  text: "Według oczekiwania i nadziei mojej, że w niczym nie zostanę zawstydzony, ale z całą śmiałością, jak zawsze, tak i teraz, wywyższony zostanie Chrystus w moim ciele, czy to przez życie, czy przez śmierć."
  tags: []
"Flp1,21":
  text: "Dla mnie bowiem żyć – Chrystus, umrzeć – zysk."
  tags: []
"Flp1,22":
  text: "Jeśli jednak żyć w ciele – to dla mnie owoc dzieła; a co wybiorę – nie wiem."
  tags: []
"Flp1,23":
  text: "Albowiem jedno i drugie mnie naciska; pragnę odejść i być z Chrystusem, bo to daleko lepsze,"
  tags: []
"Flp1,24":
  text: "Ale pozostać w ciele jest bardziej potrzebne ze względu na was."
  tags: []
"Flp1,25":
  text: "A będąc tego pewien, wiem, że pozostanę i będę trwał razem przy wszystkich dla waszego postępu i radości wiary,"
  tags: []
"Flp1,26":
  text: "Aby chluba wasza obfitowała w Chrystusie Jezusie we mnie, z powodu mojego ponownego przyjścia do was."
  tags: []
"Flp1,27":
  text: "Tylko żyjcie jak wolni obywatele w sposób godny Ewangelii Chrystusa, abym, czy przyjdę i ujrzę was, czy nieobecny, słyszał o was, że stoicie w jednym Duchu, jedną duszą walcząc razem dla wiary Ewangelii,"
  tags: []
"Flp1,28":
  text: "I w niczym nie dając się zastraszyć przeciwnikom; co dla nich prawdziwie jest dowodem zguby, a dla was zbawienia, i to od Boga;"
  tags: []
"Flp1,29":
  text: "Gdyż wam to zostało darowane dla Chrystusa, abyście nie tylko w Niego wierzyli, ale i dla Niego cierpieli,"
  tags: []
"Flp1,30":
  text: "Tocząc tę samą walkę, jaką widzieliście we mnie i o jakiej we mnie teraz słyszycie."
  tags: []
