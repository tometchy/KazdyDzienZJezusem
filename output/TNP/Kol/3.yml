"Kol3,1": "Jeśli więc zostaliście wzbudzeni z Chrystusem, szukajcie tego, co w górze, gdzie jest Chrystus, siedzący po prawicy Boga."
"Kol3,2": "Myślcie o tym, co w górze, nie o tym, co na ziemi."
"Kol3,3": "Umarliście bowiem, a życie wasze jest ukryte z Chrystusem w Bogu."
"Kol3,4": "Ale gdy się Chrystus, życie nasze, ukaże, wtedy i wy razem z Nim zostaniecie ukazani w chwale."
"Kol3,5": "Przyprowadźcie więc do śmierci to, co w waszych członkach jest ziemskie: nierząd, nieczystość, namiętność, złą pożądliwość i chciwość, która jest bałwochwalstwem,"
"Kol3,6": "Z ich to powodu przychodzi gniew Boży na synów opornych,"
"Kol3,7": "W których i wy dawniej postępowaliście, gdy w nich żyliście."
"Kol3,8": "Teraz więc i wy złóżcie z siebie to wszystko: gniew, zapalczywość, złość, bluźnierstwo, haniebną mowę z ust waszych."
"Kol3,9": "Nie bądźcie fałszywi jedni wobec drugich, skoro zdarliście z siebie starego człowieka razem z jego postępkami,"
"Kol3,10": "A przyoblekliście się w nowego, który jest odnawiany ku dogłębnemu poznaniu na obraz Tego, który go stworzył;"
"Kol3,11": "Gdzie nie ma Greka ani Żyda, obrzezania ani nieobrzezania, barbarzyńcy, Scyty, niewolnika, wolnego; ale wszystkim i we wszystkich – Chrystus."
"Kol3,12": "Dlatego więc przyobleczcie się jako wybrani Boży, święci i umiłowani, w litościwe wnętrze, dobroć, pokorę, łagodność, cierpliwość,"
"Kol3,13": "Znosząc jedni drugich i darowując sobie wzajemnie, jeśli miałby ktoś przeciwko komuś skargę; jak Chrystus wam darował, tak i wy."
"Kol3,14": "A na to wszystko przyobleczcie miłość, która jest więzią doskonałości."
"Kol3,15": "A w sercach waszych niech rządzi pokój Boży, do którego zostaliście powołani w jednym ciele; i bądźcie wdzięczni."
"Kol3,16": "Słowo Chrystusa niech mieszka w was obficie; we wszelkiej mądrości, nauczajcie i napominajcie się wzajemnie przez psalmy i hymny, i pieśni duchowe, z wdzięcznością śpiewajcie w sercach waszych Panu."
"Kol3,17": "I wszystko, cokolwiek czynilibyście w słowie albo w czynie, wszystko czyńcie w imieniu Pana Jezusa, dziękując Bogu i Ojcu przez Niego."
"Kol3,18": "Żony, bądźcie uległe swoim mężom, jak przystoi w Panu."
"Kol3,19": "Mężowie, miłujcie swoje żony i nie odnoście się wobec nich z goryczą."
"Kol3,20": "Dzieci, bądźcie posłuszne rodzicom we wszystkim; to bowiem bardzo podoba się Panu."
"Kol3,21": "Ojcowie, nie pobudzajcie do gniewu swoich dzieci, aby nie upadały na duchu."
"Kol3,22": "Słudzy, bądźcie posłuszni we wszystkim tym, którzy są panami waszymi według ciała, nie służąc na pokaz jak ci, którzy chcą podobać się ludziom, ale w prostocie serca, bojąc się Boga."
"Kol3,23": "A wszystko, cokolwiek byście czynili, wykonujcie z głębi duszy, jak dla Pana, a nie dla ludzi,"
"Kol3,24": "Wiedząc, że od Pana otrzymacie z powrotem zapłatę dziedzictwa; albowiem Chrystusowi Panu służycie."
"Kol3,25": "A ten, kto czyni niesprawiedliwość, odbierze niesprawiedliwość, tę którą uczynił; A Pan nie jest stronniczy."
