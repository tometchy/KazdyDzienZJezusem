"Kol3,1":
  text: "Jeśli więc zostaliście wzbudzeni z Chrystusem, szukajcie tego, co w górze, gdzie jest Chrystus, siedzący po prawicy Boga."
  tags: []
"Kol3,2":
  text: "Myślcie o tym, co w górze, nie o tym, co na ziemi."
  tags: []
"Kol3,3":
  text: "Umarliście bowiem, a życie wasze jest ukryte z Chrystusem w Bogu."
  tags: []
"Kol3,4":
  text: "Ale gdy się Chrystus, życie nasze, ukaże, wtedy i wy razem z Nim zostaniecie ukazani w chwale."
  tags: []
"Kol3,5":
  text: "Przyprowadźcie więc do śmierci to, co w waszych członkach jest ziemskie: nierząd, nieczystość, namiętność, złą pożądliwość i chciwość, która jest bałwochwalstwem,"
  tags: []
"Kol3,6":
  text: "Z ich to powodu przychodzi gniew Boży na synów opornych,"
  tags: []
"Kol3,7":
  text: "W których i wy dawniej postępowaliście, gdy w nich żyliście."
  tags: []
"Kol3,8":
  text: "Teraz więc i wy złóżcie z siebie to wszystko: gniew, zapalczywość, złość, bluźnierstwo, haniebną mowę z ust waszych."
  tags: []
"Kol3,9":
  text: "Nie bądźcie fałszywi jedni wobec drugich, skoro zdarliście z siebie starego człowieka razem z jego postępkami,"
  tags: []
"Kol3,10":
  text: "A przyoblekliście się w nowego, który jest odnawiany ku dogłębnemu poznaniu na obraz Tego, który go stworzył;"
  tags: []
"Kol3,11":
  text: "Gdzie nie ma Greka ani Żyda, obrzezania ani nieobrzezania, barbarzyńcy, Scyty, niewolnika, wolnego; ale wszystkim i we wszystkich – Chrystus."
  tags: []
"Kol3,12":
  text: "Dlatego więc przyobleczcie się jako wybrani Boży, święci i umiłowani, w litościwe wnętrze, dobroć, pokorę, łagodność, cierpliwość,"
  tags: []
"Kol3,13":
  text: "Znosząc jedni drugich i darowując sobie wzajemnie, jeśli miałby ktoś przeciwko komuś skargę; jak Chrystus wam darował, tak i wy."
  tags: []
"Kol3,14":
  text: "A na to wszystko przyobleczcie miłość, która jest więzią doskonałości."
  tags: []
"Kol3,15":
  text: "A w sercach waszych niech rządzi pokój Boży, do którego zostaliście powołani w jednym ciele; i bądźcie wdzięczni."
  tags: []
"Kol3,16":
  text: "Słowo Chrystusa niech mieszka w was obficie; we wszelkiej mądrości, nauczajcie i napominajcie się wzajemnie przez psalmy i hymny, i pieśni duchowe, z wdzięcznością śpiewajcie w sercach waszych Panu."
  tags: []
"Kol3,17":
  text: "I wszystko, cokolwiek czynilibyście w słowie albo w czynie, wszystko czyńcie w imieniu Pana Jezusa, dziękując Bogu i Ojcu przez Niego."
  tags: []
"Kol3,18":
  text: "Żony, bądźcie uległe swoim mężom, jak przystoi w Panu."
  tags: []
"Kol3,19":
  text: "Mężowie, miłujcie swoje żony i nie odnoście się wobec nich z goryczą."
  tags: []
"Kol3,20":
  text: "Dzieci, bądźcie posłuszne rodzicom we wszystkim; to bowiem bardzo podoba się Panu."
  tags: []
"Kol3,21":
  text: "Ojcowie, nie pobudzajcie do gniewu swoich dzieci, aby nie upadały na duchu."
  tags: []
"Kol3,22":
  text: "Słudzy, bądźcie posłuszni we wszystkim tym, którzy są panami waszymi według ciała, nie służąc na pokaz jak ci, którzy chcą podobać się ludziom, ale w prostocie serca, bojąc się Boga."
  tags: []
"Kol3,23":
  text: "A wszystko, cokolwiek byście czynili, wykonujcie z głębi duszy, jak dla Pana, a nie dla ludzi,"
  tags: []
"Kol3,24":
  text: "Wiedząc, że od Pana otrzymacie z powrotem zapłatę dziedzictwa; albowiem Chrystusowi Panu służycie."
  tags: []
"Kol3,25":
  text: "A ten, kto czyni niesprawiedliwość, odbierze niesprawiedliwość, tę którą uczynił; A Pan nie jest stronniczy."
  tags: []
