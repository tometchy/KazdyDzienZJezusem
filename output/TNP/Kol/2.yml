"Kol2,1":
  text: "Albowiem chcę, abyście wiedzieli, jak wielką walkę staczam o was i o tych, którzy są w Laodycei, i o tych licznych, którzy nie widzieli mojego oblicza w ciele;"
  tags: []
"Kol2,2":
  text: "Aby ich serca doznały zachęty, a oni zespoleni ze sobą w miłości, dążyli ku całemu bogactwu pełni zrozumienia, ku dogłębnemu poznaniu tajemnicy Boga i Ojca, i Chrystusa,"
  tags: []
"Kol2,3":
  text: "W którym ukryte są wszystkie skarby mądrości i poznania."
  tags: []
"Kol2,4":
  text: "A to mówię, aby was ktoś nie zwodził podstępnym dowodzeniem."
  tags: []
"Kol2,5":
  text: "Bo chociaż ciałem jestem nieobecny, ale duchem jestem z wami, radując się i widząc ład wasz i niewzruszoność waszej wiary w Chrystusa."
  tags: []
"Kol2,6":
  text: "Jak więc przyjęliście Chrystusa Jezusa, Pana, tak w Nim chodźcie,"
  tags: []
"Kol2,7":
  text: "Jako ci, którzy są zakorzenieni i są budowani na Nim, i są utwierdzani w wierze, tak jak zostaliście nauczeni, obfitując w niej z dziękczynieniem."
  tags: []
"Kol2,8":
  text: "Uważajcie, aby was ktoś nie prowadził jako swój łup dzięki filozofii i próżnemu oszustwu, opartemu na ludzkiej tradycji i elementarnych zasadach tego świata, a nie na Chrystusie;"
  tags: []
"Kol2,9":
  text: "Gdyż w Nim mieszka cieleśnie cała pełnia boskości."
  tags: []
"Kol2,10":
  text: "I jesteście w Nim napełnieni; On jest głową wszelkiej zwierzchności i władzy,"
  tags: []
"Kol2,11":
  text: "I w Nim zostaliście obrzezani obrzezaniem, nie uczynionym ręką w zewleczeniu doczesnego ciała, ale w zewleczeniu ciała grzechów w obrzezaniu Chrystusa,"
  tags: []
"Kol2,12":
  text: "Pogrzebani będąc wraz z Nim w chrzcie; w którym też zostaliście współwzbudzeni przez wiarę w moc Boga, który Go wzbudził z martwych."
  tags: []
"Kol2,13":
  text: "I was, będących martwymi w upadkach i w nieobrzezaniu waszego ciała, razem z Nim ożywił, darując wam wszystkie upadki,"
  tags: []
"Kol2,14":
  text: "Wymazał obciążający nas zapis dłużny, wynikający z ustaw, który był przeciwko nam i usunął go ze środka, przybijając go gwoździem do krzyża;"
  tags: []
"Kol2,15":
  text: "Rozbroił zwierzchności i władze, publicznie wystawiając je na pokaz i Bóg w Nim powlókł je w triumfalnym marszu zwycięstwa."
  tags: []
"Kol2,16":
  text: "Niech więc was nikt nie sądzi z powodu pokarmu albo napoju, albo w sprawie święta, albo nowiu księżyca, albo szabatów,"
  tags: []
"Kol2,17":
  text: "To są cienie tego, co ma nastąpić; rzeczywiste natomiast jest ciało Chrystusa."
  tags: []
"Kol2,18":
  text: "Niech was nikt nie pozbawia nagrody zwycięstwa, kto ma upodobanie w uniżaniu się, kulcie aniołów i w tajemniczych doznaniach, dając się bezpodstawnie nadymać przez swój cielesny sposób myślenia,"
  tags: []
"Kol2,19":
  text: "A nie trzyma się głowy, z której całe ciało jest zaopatrywane i spajane stawami i ścięgnami, rosnąc wzrostem Boga."
  tags: []
"Kol2,20":
  text: "Jeśli więc umarliście z Chrystusem dla elementarnych zasad tego świata, dlaczego jeszcze, jak żyjący w świecie, jesteście poddani nakazom:"
  tags: []
"Kol2,21":
  text: "Nie dotykaj, nie skosztuj, nie zetknij się;"
  tags: []
"Kol2,22":
  text: "To wszystko jest przeznaczone na zniszczenie przez używanie, zgodnie z przykazaniami i naukami ludzi."
  tags: []
"Kol2,23":
  text: "Które mają wprawdzie pozór mądrości w samowolnej formie kultu religijnego i w poniżaniu się, i w nieoszczędzaniu ciała, ale nie mają żadnej wartości, służą tylko do zaspakajania ciała."
  tags: []
