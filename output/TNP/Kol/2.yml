"Kol2,1": "Albowiem chcę, abyście wiedzieli, jak wielką walkę staczam o was i o tych, którzy są w Laodycei, i o tych licznych, którzy nie widzieli mojego oblicza w ciele;"
"Kol2,2": "Aby ich serca doznały zachęty, a oni zespoleni ze sobą w miłości, dążyli ku całemu bogactwu pełni zrozumienia, ku dogłębnemu poznaniu tajemnicy Boga i Ojca, i Chrystusa,"
"Kol2,3": "W którym ukryte są wszystkie skarby mądrości i poznania."
"Kol2,4": "A to mówię, aby was ktoś nie zwodził podstępnym dowodzeniem."
"Kol2,5": "Bo chociaż ciałem jestem nieobecny, ale duchem jestem z wami, radując się i widząc ład wasz i niewzruszoność waszej wiary w Chrystusa."
"Kol2,6": "Jak więc przyjęliście Chrystusa Jezusa, Pana, tak w Nim chodźcie,"
"Kol2,7": "Jako ci, którzy są zakorzenieni i są budowani na Nim, i są utwierdzani w wierze, tak jak zostaliście nauczeni, obfitując w niej z dziękczynieniem."
"Kol2,8": "Uważajcie, aby was ktoś nie prowadził jako swój łup dzięki filozofii i próżnemu oszustwu, opartemu na ludzkiej tradycji i elementarnych zasadach tego świata, a nie na Chrystusie;"
"Kol2,9": "Gdyż w Nim mieszka cieleśnie cała pełnia boskości."
"Kol2,10": "I jesteście w Nim napełnieni; On jest głową wszelkiej zwierzchności i władzy,"
"Kol2,11": "I w Nim zostaliście obrzezani obrzezaniem, nie uczynionym ręką w zewleczeniu doczesnego ciała, ale w zewleczeniu ciała grzechów w obrzezaniu Chrystusa,"
"Kol2,12": "Pogrzebani będąc wraz z Nim w chrzcie; w którym też zostaliście współwzbudzeni przez wiarę w moc Boga, który Go wzbudził z martwych."
"Kol2,13": "I was, będących martwymi w upadkach i w nieobrzezaniu waszego ciała, razem z Nim ożywił, darując wam wszystkie upadki,"
"Kol2,14": "Wymazał obciążający nas zapis dłużny, wynikający z ustaw, który był przeciwko nam i usunął go ze środka, przybijając go gwoździem do krzyża;"
"Kol2,15": "Rozbroił zwierzchności i władze, publicznie wystawiając je na pokaz i Bóg w Nim powlókł je w triumfalnym marszu zwycięstwa."
"Kol2,16": "Niech więc was nikt nie sądzi z powodu pokarmu albo napoju, albo w sprawie święta, albo nowiu księżyca, albo szabatów,"
"Kol2,17": "To są cienie tego, co ma nastąpić; rzeczywiste natomiast jest ciało Chrystusa."
"Kol2,18": "Niech was nikt nie pozbawia nagrody zwycięstwa, kto ma upodobanie w uniżaniu się, kulcie aniołów i w tajemniczych doznaniach, dając się bezpodstawnie nadymać przez swój cielesny sposób myślenia,"
"Kol2,19": "A nie trzyma się głowy, z której całe ciało jest zaopatrywane i spajane stawami i ścięgnami, rosnąc wzrostem Boga."
"Kol2,20": "Jeśli więc umarliście z Chrystusem dla elementarnych zasad tego świata, dlaczego jeszcze, jak żyjący w świecie, jesteście poddani nakazom:"
"Kol2,21": "Nie dotykaj, nie skosztuj, nie zetknij się;"
"Kol2,22": "To wszystko jest przeznaczone na zniszczenie przez używanie, zgodnie z przykazaniami i naukami ludzi."
"Kol2,23": "Które mają wprawdzie pozór mądrości w samowolnej formie kultu religijnego i w poniżaniu się, i w nieoszczędzaniu ciała, ale nie mają żadnej wartości, służą tylko do zaspakajania ciała."
