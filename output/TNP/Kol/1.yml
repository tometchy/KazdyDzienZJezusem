"Kol1,1": "Paweł, apostoł Jezusa Chrystusa z woli Boga, i Tymoteusz brat,"
"Kol1,2": "Do świętych i wiernych braci w Chrystusie Jezusie, którzy są w Kolosach. Łaska wam i pokój od Boga, Ojca naszego i od Pana Jezusa Chrystusa."
"Kol1,3": "Dziękujemy Bogu i Ojcu Pana naszego Jezusa Chrystusa, zawsze modląc się za was,"
"Kol1,4": "Bo usłyszeliśmy o waszej wierze w Chrystusie Jezusie i miłości do wszystkich świętych,"
"Kol1,5": "Z powodu nadziei, która jest odłożona dla was w niebiosach, o której wcześniej słyszeliście w słowie prawdy Ewangelii,"
"Kol1,6": "Która dotarła do was, jak i na cały świat i wydaje owoc, tak jak i wśród was, od tego dnia, kiedy usłyszeliście i dogłębnie poznaliście łaskę Boga w prawdzie."
"Kol1,7": "Tak jak i nauczyliście się jej od Epafrasa, umiłowanego współniewolnika naszego, który jest dla was wiernym sługą Chrystusa,"
"Kol1,8": "Który też oznajmił nam o waszej miłości w duchu."
"Kol1,9": "Dlatego i my, od tego dnia, w którym to usłyszeliśmy, nie przestajemy modlić się za was i prosić, abyście zostali napełnieni dogłębnym poznaniem Jego woli w całej mądrości i w duchowym zrozumieniu,"
"Kol1,10": "Abyście chodzili w sposób godny Pana, dla całkowitego przypodobania się Jemu, przynosząc owoce w każdym dobrym dziele i wzrastając w dogłębnym poznaniu Boga."
"Kol1,11": "Z całą mocą będąc wzmacniani zgodnie z potęgą Jego chwały, w całej wytrwałości i cierpliwości z radością."
"Kol1,12": "Dziękując Ojcu, który nas uczynił zdolnymi do uczestniczenia w dziedzictwie świętych w światłości,"
"Kol1,13": "Który nas wyrwał z władzy ciemności i przeniósł do Królestwa Syna swojego umiłowanego."
"Kol1,14": "W Nim mamy odkupienie przez Jego krew, odpuszczenie grzechów,"
"Kol1,15": "On jest obrazem niewidzialnego Boga, pierworodnym całego stworzenia,"
"Kol1,16": "Gdyż w Nim zostało stworzone wszystko w niebiosach i na ziemi, widzialne i niewidzialne, czy to trony, czy to panowania, czy to przywódcy, czy to władze – wszystko przez Niego i dla Niego jest stworzone."
"Kol1,17": "A On jest przed wszystkimi i wszystko w Nim razem zaistniało."
"Kol1,18": "On też jest głową ciała, Kościoła, On jest początkiem, pierworodnym z umarłych, aby sam we wszystkim stał się pierwszy;"
"Kol1,19": "Gdyż Bóg miał upodobanie, aby w Nim zamieszkała cała pełnia,"
"Kol1,20": "I aby przez Niego ponownie pojednać ze sobą wszystko, czyniąc pokój przez krew Jego krzyża; poprzez Niego, to co na ziemi, i to co w niebiosach."
"Kol1,21": "I was, niegdyś będących obcymi i wrogimi w myśleniu na skutek złych czynów, teraz jednak ponownie pojednał,"
"Kol1,22": "W ciele przez śmierć ciała Jego, aby was postawić przy Nim jako świętych i niewinnych, i nienagannych przed swoim obliczem."
"Kol1,23": "Jeśli rzeczywiście trwacie w wierze będąc ugruntowani i mocni, i nieporuszeni z powodu nadziei Ewangelii, którą słyszeliście, a która została ogłoszona całemu stworzeniu pod niebem, której ja, Paweł, stałem się sługą."
"Kol1,24": "Raduję się teraz w moich cierpieniach za was i dopełniam w swoim ciele niedostatki ucisków Chrystusa, za ciało Jego, którym jest Kościół;"
"Kol1,25": "Którego stałem się sługą według zarządzenia Boga, które zostało mi dane, aby wobec was wypełnić Słowo Boże,"
"Kol1,26": "Tajemnicę, która ukryta jest od wieków i pokoleń, teraz natomiast, została ukazana Jego świętym,"
"Kol1,27": "Im to Bóg zechciał oznajmić, jakie jest między poganami bogactwo chwały tej tajemnicy, którą jest Chrystus w was, nadzieja chwały."
"Kol1,28": "Jego my głosimy, napominając każdego człowieka i nauczając każdego człowieka z całą mądrością, abyśmy mogli postawić przy Nim każdego człowieka jako doskonałego w Chrystusie Jezusie;"
"Kol1,29": "Nad tym też się trudzę, walcząc zgodnie z Jego skutecznym działaniem, działającym we mnie z mocą."
