"Kol1,1":
  text: "Paweł, apostoł Jezusa Chrystusa z woli Boga, i Tymoteusz brat,"
  tags: []
"Kol1,2":
  text: "Do świętych i wiernych braci w Chrystusie Jezusie, którzy są w Kolosach. Łaska wam i pokój od Boga, Ojca naszego i od Pana Jezusa Chrystusa."
  tags: []
"Kol1,3":
  text: "Dziękujemy Bogu i Ojcu Pana naszego Jezusa Chrystusa, zawsze modląc się za was,"
  tags: []
"Kol1,4":
  text: "Bo usłyszeliśmy o waszej wierze w Chrystusie Jezusie i miłości do wszystkich świętych,"
  tags: []
"Kol1,5":
  text: "Z powodu nadziei, która jest odłożona dla was w niebiosach, o której wcześniej słyszeliście w słowie prawdy Ewangelii,"
  tags: []
"Kol1,6":
  text: "Która dotarła do was, jak i na cały świat i wydaje owoc, tak jak i wśród was, od tego dnia, kiedy usłyszeliście i dogłębnie poznaliście łaskę Boga w prawdzie."
  tags: []
"Kol1,7":
  text: "Tak jak i nauczyliście się jej od Epafrasa, umiłowanego współniewolnika naszego, który jest dla was wiernym sługą Chrystusa,"
  tags: []
"Kol1,8":
  text: "Który też oznajmił nam o waszej miłości w duchu."
  tags: []
"Kol1,9":
  text: "Dlatego i my, od tego dnia, w którym to usłyszeliśmy, nie przestajemy modlić się za was i prosić, abyście zostali napełnieni dogłębnym poznaniem Jego woli w całej mądrości i w duchowym zrozumieniu,"
  tags: []
"Kol1,10":
  text: "Abyście chodzili w sposób godny Pana, dla całkowitego przypodobania się Jemu, przynosząc owoce w każdym dobrym dziele i wzrastając w dogłębnym poznaniu Boga."
  tags: []
"Kol1,11":
  text: "Z całą mocą będąc wzmacniani zgodnie z potęgą Jego chwały, w całej wytrwałości i cierpliwości z radością."
  tags: []
"Kol1,12":
  text: "Dziękując Ojcu, który nas uczynił zdolnymi do uczestniczenia w dziedzictwie świętych w światłości,"
  tags: []
"Kol1,13":
  text: "Który nas wyrwał z władzy ciemności i przeniósł do Królestwa Syna swojego umiłowanego."
  tags: []
"Kol1,14":
  text: "W Nim mamy odkupienie przez Jego krew, odpuszczenie grzechów,"
  tags: []
"Kol1,15":
  text: "On jest obrazem niewidzialnego Boga, pierworodnym całego stworzenia,"
  tags: []
"Kol1,16":
  text: "Gdyż w Nim zostało stworzone wszystko w niebiosach i na ziemi, widzialne i niewidzialne, czy to trony, czy to panowania, czy to przywódcy, czy to władze – wszystko przez Niego i dla Niego jest stworzone."
  tags: []
"Kol1,17":
  text: "A On jest przed wszystkimi i wszystko w Nim razem zaistniało."
  tags: []
"Kol1,18":
  text: "On też jest głową ciała, Kościoła, On jest początkiem, pierworodnym z umarłych, aby sam we wszystkim stał się pierwszy;"
  tags: []
"Kol1,19":
  text: "Gdyż Bóg miał upodobanie, aby w Nim zamieszkała cała pełnia,"
  tags: []
"Kol1,20":
  text: "I aby przez Niego ponownie pojednać ze sobą wszystko, czyniąc pokój przez krew Jego krzyża; poprzez Niego, to co na ziemi, i to co w niebiosach."
  tags: []
"Kol1,21":
  text: "I was, niegdyś będących obcymi i wrogimi w myśleniu na skutek złych czynów, teraz jednak ponownie pojednał,"
  tags: []
"Kol1,22":
  text: "W ciele przez śmierć ciała Jego, aby was postawić przy Nim jako świętych i niewinnych, i nienagannych przed swoim obliczem."
  tags: []
"Kol1,23":
  text: "Jeśli rzeczywiście trwacie w wierze będąc ugruntowani i mocni, i nieporuszeni z powodu nadziei Ewangelii, którą słyszeliście, a która została ogłoszona całemu stworzeniu pod niebem, której ja, Paweł, stałem się sługą."
  tags: []
"Kol1,24":
  text: "Raduję się teraz w moich cierpieniach za was i dopełniam w swoim ciele niedostatki ucisków Chrystusa, za ciało Jego, którym jest Kościół;"
  tags: []
"Kol1,25":
  text: "Którego stałem się sługą według zarządzenia Boga, które zostało mi dane, aby wobec was wypełnić Słowo Boże,"
  tags: []
"Kol1,26":
  text: "Tajemnicę, która ukryta jest od wieków i pokoleń, teraz natomiast, została ukazana Jego świętym,"
  tags: []
"Kol1,27":
  text: "Im to Bóg zechciał oznajmić, jakie jest między poganami bogactwo chwały tej tajemnicy, którą jest Chrystus w was, nadzieja chwały."
  tags: []
"Kol1,28":
  text: "Jego my głosimy, napominając każdego człowieka i nauczając każdego człowieka z całą mądrością, abyśmy mogli postawić przy Nim każdego człowieka jako doskonałego w Chrystusie Jezusie;"
  tags: []
"Kol1,29":
  text: "Nad tym też się trudzę, walcząc zgodnie z Jego skutecznym działaniem, działającym we mnie z mocą."
  tags: []
