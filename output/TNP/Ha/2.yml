"Ha2,1": "Muszę stanąć na swoim posterunku i zająć miejsce na wale obronnym, śledzić pilnie, aby dowiedzieć się, co mi powie, i co mam odpowiedzieć na moje upomnienie."
"Ha2,2": "Wtedy odpowiedział mi JHWH, mówiąc: Zapisz to widzenie, wyryj je wyraźnie na tablicach, aby czytający mógł je szybko przeczytać."
"Ha2,3": "Bo widzenie nadal czeka na oznaczony czas, a na końcu wypełni się, a nie zawiedzie; a choćby się opóźniało, oczekuj go, bo z pewnością przyjdzie, nie spóźni się."
"Ha2,4": "Oto nadęta pychą, nieprawa w nimjest jego dusza. Ale sprawiedliwy będzie żył dzięki swej wierności."
"Ha2,5": "O tak, ponieważ wino jest zdradliwe, bohater staje się butnym i nie pozostaje w domu; pomnaża swą żądzę jak Szeol, i jest on jak śmierć nie może się nasycić, choć zgromadził przy sobie wszystkie narody i zebrał przy sobie wszystkich ludzi."
"Ha2,6": "Czy nie wezmą go one wszystkie za przedmiot przypowieści i szyderstwa, zagadki o nim, czy nie powie: Biada bogacącemu się na nie swoim – ileż można? – i obciąża siebie stertą gliny!"
"Ha2,7": "Czy nie powstaną nagle twoi wierzyciele i nie obudzą się ci, którzy przyprawiają cię o drżenie? I będziesz dla nich łupem."
"Ha2,8": "Ponieważ ty złupiłeś wiele narodów, złupią cię też wszystkie pozostałe ludy z powodu krwi ludzkiej i gwałtu zadanego ziemi, miastu i wszystkim jego mieszkańcom."
"Ha2,9": "Biada temu, który uzyskuje niegodziwy zysk dla swojego domu, aby ustanowić wysoko swoje gniazdo i by wyrwać się z ręki zła!"
"Ha2,10": "Zaplanowałeś hańbę swojemu domowi: wytracić wiele narodów, i grzeszyłeś przeciwko własnej duszy."
"Ha2,11": "Bo kamień będzie wołać ze ściany a krokiew z drewna odpowie mu."
"Ha2,12": "Biada temu, który na krwi buduje twierdzę i miasto utwierdza nieprawością!"
"Ha2,13": "Oto czy nie pochodzi to od JHWH Zastępów, że ludy trudzą się dla ognia, a narody tak bardzo męczą się na próżno?"
"Ha2,14": "Ziemia bowiem zostanie napełniona poznaniem chwały JHWH, jak wody okrywające głębiny morza."
"Ha2,15": "Biada temu, kto poi swojego bliźniego, przystawiając mu swój bukłak, żeby go upoić, by patrzeć na jego nagość!"
"Ha2,16": "Nasyciłeś się hańbą zamiast chwałą; upij się więc i ty, i zostań uznanym za nieobrzezanego. Kielich prawicy JHWH zwróci się przeciwko tobie, a na twojej chwale będzie łajno."
"Ha2,17": "Okryje cię bowiem gwałt zadany Libanowi i rzeź zwierząt przerazi cię, z powodu krwi ludzkiej i gwałtu zadanego ziemi, miastu i wszystkim jego mieszkańcom."
"Ha2,18": "Jaką korzyść przyniesie rzeźbiony posąg, że wyciosał go jego rzeźbiarz, ulany posąg i nauczyciel kłamstwa, że aż tak ufa rzeźbiarz swojej rzeźbie wykonując nieme bożki?"
"Ha2,19": "Biada temu, który mówi do drewna: Obudź się, a do niemego kamienia: Ocknij się! Czyż on może nauczać? Spójrz na niego, pokryty jest on złotem i srebrem, ale w jego wnętrzu nie ma żadnego ducha."
"Ha2,20": "JHWH jest w swoim świętym przybytku. Niech cała ziemia umilknie przed Jego obliczem."
