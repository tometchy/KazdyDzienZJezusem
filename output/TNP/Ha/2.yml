"Ha2,1":
  text: "Muszę stanąć na swoim posterunku i zająć miejsce na wale obronnym, śledzić pilnie, aby dowiedzieć się, co mi powie, i co mam odpowiedzieć na moje upomnienie."
  tags: []
"Ha2,2":
  text: "Wtedy odpowiedział mi JHWH, mówiąc: Zapisz to widzenie, wyryj je wyraźnie na tablicach, aby czytający mógł je szybko przeczytać."
  tags: []
"Ha2,3":
  text: "Bo widzenie nadal czeka na oznaczony czas, a na końcu wypełni się, a nie zawiedzie; a choćby się opóźniało, oczekuj go, bo z pewnością przyjdzie, nie spóźni się."
  tags: []
"Ha2,4":
  text: "Oto nadęta pychą, nieprawa w nimjest jego dusza. Ale sprawiedliwy będzie żył dzięki swej wierności."
  tags: []
"Ha2,5":
  text: "O tak, ponieważ wino jest zdradliwe, bohater staje się butnym i nie pozostaje w domu; pomnaża swą żądzę jak Szeol, i jest on jak śmierć nie może się nasycić, choć zgromadził przy sobie wszystkie narody i zebrał przy sobie wszystkich ludzi."
  tags: []
"Ha2,6":
  text: "Czy nie wezmą go one wszystkie za przedmiot przypowieści i szyderstwa, zagadki o nim, czy nie powie: Biada bogacącemu się na nie swoim – ileż można? – i obciąża siebie stertą gliny!"
  tags: []
"Ha2,7":
  text: "Czy nie powstaną nagle twoi wierzyciele i nie obudzą się ci, którzy przyprawiają cię o drżenie? I będziesz dla nich łupem."
  tags: []
"Ha2,8":
  text: "Ponieważ ty złupiłeś wiele narodów, złupią cię też wszystkie pozostałe ludy z powodu krwi ludzkiej i gwałtu zadanego ziemi, miastu i wszystkim jego mieszkańcom."
  tags: []
"Ha2,9":
  text: "Biada temu, który uzyskuje niegodziwy zysk dla swojego domu, aby ustanowić wysoko swoje gniazdo i by wyrwać się z ręki zła!"
  tags: []
"Ha2,10":
  text: "Zaplanowałeś hańbę swojemu domowi: wytracić wiele narodów, i grzeszyłeś przeciwko własnej duszy."
  tags: []
"Ha2,11":
  text: "Bo kamień będzie wołać ze ściany a krokiew z drewna odpowie mu."
  tags: []
"Ha2,12":
  text: "Biada temu, który na krwi buduje twierdzę i miasto utwierdza nieprawością!"
  tags: []
"Ha2,13":
  text: "Oto czy nie pochodzi to od JHWH Zastępów, że ludy trudzą się dla ognia, a narody tak bardzo męczą się na próżno?"
  tags: []
"Ha2,14":
  text: "Ziemia bowiem zostanie napełniona poznaniem chwały JHWH, jak wody okrywające głębiny morza."
  tags: []
"Ha2,15":
  text: "Biada temu, kto poi swojego bliźniego, przystawiając mu swój bukłak, żeby go upoić, by patrzeć na jego nagość!"
  tags: []
"Ha2,16":
  text: "Nasyciłeś się hańbą zamiast chwałą; upij się więc i ty, i zostań uznanym za nieobrzezanego. Kielich prawicy JHWH zwróci się przeciwko tobie, a na twojej chwale będzie łajno."
  tags: []
"Ha2,17":
  text: "Okryje cię bowiem gwałt zadany Libanowi i rzeź zwierząt przerazi cię, z powodu krwi ludzkiej i gwałtu zadanego ziemi, miastu i wszystkim jego mieszkańcom."
  tags: []
"Ha2,18":
  text: "Jaką korzyść przyniesie rzeźbiony posąg, że wyciosał go jego rzeźbiarz, ulany posąg i nauczyciel kłamstwa, że aż tak ufa rzeźbiarz swojej rzeźbie wykonując nieme bożki?"
  tags: []
"Ha2,19":
  text: "Biada temu, który mówi do drewna: Obudź się, a do niemego kamienia: Ocknij się! Czyż on może nauczać? Spójrz na niego, pokryty jest on złotem i srebrem, ale w jego wnętrzu nie ma żadnego ducha."
  tags: []
"Ha2,20":
  text: "JHWH jest w swoim świętym przybytku. Niech cała ziemia umilknie przed Jego obliczem."
  tags: []
