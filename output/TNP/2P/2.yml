"2P2,1":
  text: "A byli też fałszywi prorocy między ludem, jak i wśród was będą fałszywi nauczyciele, którzy wprowadzą po kryjomu zgubne rozłamy, a wypierając się Władcy, który ich kupił, sprowadzają na siebie samych szybką zgubę."
  tags: []
"2P2,2":
  text: "Wielu podąży za ich zatraceniem i to przez nich droga prawdy zostanie obrzucona bluźnierstwem."
  tags: []
"2P2,3":
  text: "I z chciwości wykorzystają was fałszywymi słowami; ci, wobec których sąd od dawna nie zwleka, a zguba ich nie drzemie."
  tags: []
"2P2,4":
  text: "Skoro bowiem Bóg aniołów, gdy zgrzeszyli, nie oszczędził, ale w więzach ciemności strącił ich do Tartaru. Wydał ich jako zachowanych na sąd."
  tags: []
"2P2,5":
  text: "I nie oszczędził też starożytnego świata, ale Noego, jako ósmego zwiastuna sprawiedliwości, zachował, sprowadzając potop na świat bezbożnych,"
  tags: []
"2P2,6":
  text: "A miasta Sodomy i Gomorę spopielił i potępił przez zagładę, stawiając je jako przykład tego, co ma nastąpić dla czyniących bezbożność,"
  tags: []
"2P2,7":
  text: "Lecz wyrwał sprawiedliwego Lota, dręczonego rozpustnym postępowaniem nieprawych,"
  tags: []
"2P2,8":
  text: "Albowiem sprawiedliwy ten, mieszkając między nimi, codziennie widząc i słysząc ich nieprawe czyny, zadręczał swoją sprawiedliwą duszę."
  tags: []
"2P2,9":
  text: "Umie PAN pobożnych wyrywać z próby, a poskramianych niesprawiedliwych zachowywać na dzień sądu,"
  tags: []
"2P2,10":
  text: "A szczególnie tych, którzy w żądzy zepsucia idą za ciałem, pogardzają Panowaniami; zuchwalcy, zarozumiali, nie drżą gdy bluźnią Chwałom,"
  tags: []
"2P2,11":
  text: "Podczas gdy aniołowie, będąc większymi siłą i mocą, nie wnoszą przeciwko nim przed PANEM bluźnierczego sądu."
  tags: []
"2P2,12":
  text: "Ci jednak, jak nierozumne zwierzęta, które zgodnie z naturą są zrodzone na schwytanie i zabicie, bluźnią temu, czego nie rozumieją, toteż zginą w swojej zagładzie,"
  tags: []
"2P2,13":
  text: "Odbiorą zapłatę niesprawiedliwości. Albowiem za rozkosz uważają rozpustę za dnia, a brud i hańba w ich oszustwach jest im rozkoszą, gdy wspólnie ucztują z wami;"
  tags: []
"2P2,14":
  text: "Oczy mają pełne cudzołóstwa i nienasycone w grzechu, nęcą dusze nieumocnione, mając serce wyćwiczone w objawach chciwości, dzieci przekleństwa;"
  tags: []
"2P2,15":
  text: "Opuszczając prostą drogę, zbłądzili, podążając drogą Balaama, syna Bosora, który umiłował zapłatę niesprawiedliwości,"
  tags: []
"2P2,16":
  text: "Został więc skarcony za własne przekroczenie prawa; nieme juczne zwierzę, przemawiając ludzkim głosem, powstrzymało szaleństwo proroka."
  tags: []
"2P2,17":
  text: "Ci są źródłami bez wody, chmurami pędzonymi przez nawałnicę; dla nich zachowany jest mrok ciemności na wieki."
  tags: []
"2P2,18":
  text: "Wypowiadają bowiem przesadne i czcze słowa, nęcąc przez pożądliwości ciała i rozpustę tych, którzy prawdziwie uciekli od żyjących w błędzie;"
  tags: []
"2P2,19":
  text: "Obiecując im wolność, sami są niewolnikami zepsucia. Bowiem przez kogo ktoś jest pokonany, przez tego też jest zniewolony."
  tags: []
"2P2,20":
  text: "Jeżeli bowiem uciekli od brudów tego świata przez pełniejsze poznanie Pana i Zbawiciela, Jezusa Chrystusa, ponownie przez nie zostali uwikłani i są pokonani, to dla nich to, co ostatnie, stało się gorsze od tego, co pierwsze."
  tags: []
"2P2,21":
  text: "Albowiem lepiej byłoby dla nich nie poznać pełniej drogi sprawiedliwości, niż gdy poznając ją pełniej, odwrócić się od przekazanego im świętego przykazania."
  tags: []
"2P2,22":
  text: "A zdarzyło się im to zgodnie z treścią prawdziwego przysłowia: Wraca pies do swoich wymiocin, a świnia, która umyła się do tarzania się w błocie."
  tags: []
