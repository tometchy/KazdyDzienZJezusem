"2P2,1": "A byli też fałszywi prorocy między ludem, jak i wśród was będą fałszywi nauczyciele, którzy wprowadzą po kryjomu zgubne rozłamy, a wypierając się Władcy, który ich kupił, sprowadzają na siebie samych szybką zgubę."
"2P2,2": "Wielu podąży za ich zatraceniem i to przez nich droga prawdy zostanie obrzucona bluźnierstwem."
"2P2,3": "I z chciwości wykorzystają was fałszywymi słowami; ci, wobec których sąd od dawna nie zwleka, a zguba ich nie drzemie."
"2P2,4": "Skoro bowiem Bóg aniołów, gdy zgrzeszyli, nie oszczędził, ale w więzach ciemności strącił ich do Tartaru. Wydał ich jako zachowanych na sąd."
"2P2,5": "I nie oszczędził też starożytnego świata, ale Noego, jako ósmego zwiastuna sprawiedliwości, zachował, sprowadzając potop na świat bezbożnych,"
"2P2,6": "A miasta Sodomy i Gomorę spopielił i potępił przez zagładę, stawiając je jako przykład tego, co ma nastąpić dla czyniących bezbożność,"
"2P2,7": "Lecz wyrwał sprawiedliwego Lota, dręczonego rozpustnym postępowaniem nieprawych,"
"2P2,8": "Albowiem sprawiedliwy ten, mieszkając między nimi, codziennie widząc i słysząc ich nieprawe czyny, zadręczał swoją sprawiedliwą duszę."
"2P2,9": "Umie PAN pobożnych wyrywać z próby, a poskramianych niesprawiedliwych zachowywać na dzień sądu,"
"2P2,10": "A szczególnie tych, którzy w żądzy zepsucia idą za ciałem, pogardzają Panowaniami; zuchwalcy, zarozumiali, nie drżą gdy bluźnią Chwałom,"
"2P2,11": "Podczas gdy aniołowie, będąc większymi siłą i mocą, nie wnoszą przeciwko nim przed PANEM bluźnierczego sądu."
"2P2,12": "Ci jednak, jak nierozumne zwierzęta, które zgodnie z naturą są zrodzone na schwytanie i zabicie, bluźnią temu, czego nie rozumieją, toteż zginą w swojej zagładzie,"
"2P2,13": "Odbiorą zapłatę niesprawiedliwości. Albowiem za rozkosz uważają rozpustę za dnia, a brud i hańba w ich oszustwach jest im rozkoszą, gdy wspólnie ucztują z wami;"
"2P2,14": "Oczy mają pełne cudzołóstwa i nienasycone w grzechu, nęcą dusze nieumocnione, mając serce wyćwiczone w objawach chciwości, dzieci przekleństwa;"
"2P2,15": "Opuszczając prostą drogę, zbłądzili, podążając drogą Balaama, syna Bosora, który umiłował zapłatę niesprawiedliwości,"
"2P2,16": "Został więc skarcony za własne przekroczenie prawa; nieme juczne zwierzę, przemawiając ludzkim głosem, powstrzymało szaleństwo proroka."
"2P2,17": "Ci są źródłami bez wody, chmurami pędzonymi przez nawałnicę; dla nich zachowany jest mrok ciemności na wieki."
"2P2,18": "Wypowiadają bowiem przesadne i czcze słowa, nęcąc przez pożądliwości ciała i rozpustę tych, którzy prawdziwie uciekli od żyjących w błędzie;"
"2P2,19": "Obiecując im wolność, sami są niewolnikami zepsucia. Bowiem przez kogo ktoś jest pokonany, przez tego też jest zniewolony."
"2P2,20": "Jeżeli bowiem uciekli od brudów tego świata przez pełniejsze poznanie Pana i Zbawiciela, Jezusa Chrystusa, ponownie przez nie zostali uwikłani i są pokonani, to dla nich to, co ostatnie, stało się gorsze od tego, co pierwsze."
"2P2,21": "Albowiem lepiej byłoby dla nich nie poznać pełniej drogi sprawiedliwości, niż gdy poznając ją pełniej, odwrócić się od przekazanego im świętego przykazania."
"2P2,22": "A zdarzyło się im to zgodnie z treścią prawdziwego przysłowia: Wraca pies do swoich wymiocin, a świnia, która umyła się do tarzania się w błocie."
