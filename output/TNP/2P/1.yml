"2P1,1":
  text: "Szymon Piotr, sługa i apostoł Jezusa Chrystusa, do tych, którzy z nami otrzymali równie cenną wiarę przez sprawiedliwość Boga naszego i Zbawiciela naszego Jezusa Chrystusa."
  tags: []
"2P1,2":
  text: "Łaska i pokój niech się wam rozmnoży przez dogłębne poznanie Boga i Jezusa, Pana naszego."
  tags: []
"2P1,3":
  text: "Gdyż boska Jego moc darowała nam wszystko, co potrzebne do życia i pobożności przez dogłębne poznanie Tego, który nas powołał przez własną chwałę i cnotę,"
  tags: []
"2P1,4":
  text: "Przez które są nam dane największe i drogocenne obietnice, abyście przez nie stali się uczestnikami boskiej natury, jako ci, którzy uciekli od zepsucia, które na tym świecie jest przez pożądliwość."
  tags: []
"2P1,5":
  text: "I dlatego przykładając wszelkie staranie, zaopatrzcie przez waszą wiarę cnotę, a przez cnotę poznanie,"
  tags: []
"2P1,6":
  text: "A przez poznanie opanowanie, a przez opanowanie wytrwałość, a przez wytrwałość pobożność,"
  tags: []
"2P1,7":
  text: "A przez pobożność miłość braterską, a przez miłość braterską miłość."
  tags: []
"2P1,8":
  text: "One bowiem, istniejąc i pomnażając się w was, nie pozostawiają was bezczynnymi ani bezowocnymi w dogłębnym poznaniu Pana naszego Jezusa Chrystusa."
  tags: []
"2P1,9":
  text: "Kto bowiem ich nie posiada, ten jest ślepy, krótkowzroczny i zapomniał, że otrzymał oczyszczenie ze swoich dawnych grzechów."
  tags: []
"2P1,10":
  text: "Dlatego, bracia, tym bardziej postarajcie się gorliwie czynić pewnym swoje powołanie i wybranie; to bowiem czyniąc, z pewnością nigdy się nie potkniecie."
  tags: []
"2P1,11":
  text: "W ten sposób bowiem w pełni będzie wam zapewnione wejście do wiecznego Królestwa Pana naszego i Zbawiciela, Jezusa Chrystusa."
  tags: []
"2P1,12":
  text: "Dlatego nie zaniedbam ciągle przypominać wam o tych sprawach, chociaż to wiecie i jesteście utwierdzeni w obecnej prawdzie."
  tags: []
"2P1,13":
  text: "Uważam więc za słuszne, pobudzać was przez przypominanie, póki jestem w tym namiocie,"
  tags: []
"2P1,14":
  text: "Wiedząc, że rychłe jest zwinięcie mojego namiotu, tak jak mi to Pan nasz Jezus Chrystus oznajmił."
  tags: []
"2P1,15":
  text: "Dołożę natomiast starań, abyście i po moim odejściu zawsze o tych sprawach pamiętali."
  tags: []
"2P1,16":
  text: "Gdyż daliśmy wam poznać moc i przyjście Pana naszego Jezusa Chrystusa, nie jako ci, którzy poszli za sprytnie wymyślonymi baśniami, lecz jako ci, którzy stali się naocznymi świadkami Jego wielkości."
  tags: []
"2P1,17":
  text: "Otrzymał On bowiem od Boga Ojca cześć i chwałę, gdy do Niego ze wspaniałej chwały głos ten został skierowany: To jest mój umiłowany Syn, w którym znalazłem upodobanie."
  tags: []
"2P1,18":
  text: "Głos ten skierowany z nieba słyszeliśmy my, będąc z Nim na świętej górze."
  tags: []
"2P1,19":
  text: "Tym pewniejsze mamy słowo prorockie, dobrze czynicie zwracając uwagę na nie, jako na lampę świecącą w ciemnym miejscu, dopóki nie zaświta dzień i nie wzejdzie jutrzenka w waszych sercach,"
  tags: []
"2P1,20":
  text: "To przede wszystkim wiedząc, że żadne proroctwo Pisma nie staje się podstawą własnego wykładu."
  tags: []
"2P1,21":
  text: "Albowiem proroctwo nie było niegdyś przyniesione z woli człowieka, ale mówili je niesieni przez Ducha Świętego, święci Boży ludzie."
  tags: []
