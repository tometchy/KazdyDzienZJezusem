"2P1,1": "Szymon Piotr, sługa i apostoł Jezusa Chrystusa, do tych, którzy z nami otrzymali równie cenną wiarę przez sprawiedliwość Boga naszego i Zbawiciela naszego Jezusa Chrystusa."
"2P1,2": "Łaska i pokój niech się wam rozmnoży przez dogłębne poznanie Boga i Jezusa, Pana naszego."
"2P1,3": "Gdyż boska Jego moc darowała nam wszystko, co potrzebne do życia i pobożności przez dogłębne poznanie Tego, który nas powołał przez własną chwałę i cnotę,"
"2P1,4": "Przez które są nam dane największe i drogocenne obietnice, abyście przez nie stali się uczestnikami boskiej natury, jako ci, którzy uciekli od zepsucia, które na tym świecie jest przez pożądliwość."
"2P1,5": "I dlatego przykładając wszelkie staranie, zaopatrzcie przez waszą wiarę cnotę, a przez cnotę poznanie,"
"2P1,6": "A przez poznanie opanowanie, a przez opanowanie wytrwałość, a przez wytrwałość pobożność,"
"2P1,7": "A przez pobożność miłość braterską, a przez miłość braterską miłość."
"2P1,8": "One bowiem, istniejąc i pomnażając się w was, nie pozostawiają was bezczynnymi ani bezowocnymi w dogłębnym poznaniu Pana naszego Jezusa Chrystusa."
"2P1,9": "Kto bowiem ich nie posiada, ten jest ślepy, krótkowzroczny i zapomniał, że otrzymał oczyszczenie ze swoich dawnych grzechów."
"2P1,10": "Dlatego, bracia, tym bardziej postarajcie się gorliwie czynić pewnym swoje powołanie i wybranie; to bowiem czyniąc, z pewnością nigdy się nie potkniecie."
"2P1,11": "W ten sposób bowiem w pełni będzie wam zapewnione wejście do wiecznego Królestwa Pana naszego i Zbawiciela, Jezusa Chrystusa."
"2P1,12": "Dlatego nie zaniedbam ciągle przypominać wam o tych sprawach, chociaż to wiecie i jesteście utwierdzeni w obecnej prawdzie."
"2P1,13": "Uważam więc za słuszne, pobudzać was przez przypominanie, póki jestem w tym namiocie,"
"2P1,14": "Wiedząc, że rychłe jest zwinięcie mojego namiotu, tak jak mi to Pan nasz Jezus Chrystus oznajmił."
"2P1,15": "Dołożę natomiast starań, abyście i po moim odejściu zawsze o tych sprawach pamiętali."
"2P1,16": "Gdyż daliśmy wam poznać moc i przyjście Pana naszego Jezusa Chrystusa, nie jako ci, którzy poszli za sprytnie wymyślonymi baśniami, lecz jako ci, którzy stali się naocznymi świadkami Jego wielkości."
"2P1,17": "Otrzymał On bowiem od Boga Ojca cześć i chwałę, gdy do Niego ze wspaniałej chwały głos ten został skierowany: To jest mój umiłowany Syn, w którym znalazłem upodobanie."
"2P1,18": "Głos ten skierowany z nieba słyszeliśmy my, będąc z Nim na świętej górze."
"2P1,19": "Tym pewniejsze mamy słowo prorockie, dobrze czynicie zwracając uwagę na nie, jako na lampę świecącą w ciemnym miejscu, dopóki nie zaświta dzień i nie wzejdzie jutrzenka w waszych sercach,"
"2P1,20": "To przede wszystkim wiedząc, że żadne proroctwo Pisma nie staje się podstawą własnego wykładu."
"2P1,21": "Albowiem proroctwo nie było niegdyś przyniesione z woli człowieka, ale mówili je niesieni przez Ducha Świętego, święci Boży ludzie."
