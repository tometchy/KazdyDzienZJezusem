"Jud1,1":
  text: "Juda, sługa Jezusa Chrystusa, a brat Jakuba, do powołanych, którzy są uświęceni w Bogu Ojcu i są zachowani dla Jezusa Chrystusa."
  tags: []
"Jud1,2":
  text: "Miłosierdzie i pokój, i miłość niech się wam pomnożą."
  tags: []
"Jud1,3":
  text: "Umiłowani! Z całą gorliwością starając się pisać do was o wspólnym zbawieniu, uznałem za konieczne napisać do was zachęcając, abyście wytrwale walczyli o wiarę, raz tylko przekazaną świętym."
  tags: []
"Jud1,4":
  text: "Wkradli się bowiem jacyś ludzie, już dawno zapisani na ów wyrok, bezbożni, którzy łaskę Boga naszego obracają w rozpustę, i zapierają się jedynego Władcy, Boga i Pana naszego Jezusa Chrystusa."
  tags: []
"Jud1,5":
  text: "A chcę wam to przypomnieć, wam, którzy raz na zawsze to wiecie, że PAN wybawił lud z ziemi egipskiej, następnie tych, którzy nie wierzyli, wygubił."
  tags: []
"Jud1,6":
  text: "Także aniołów, którzy nie zachowali swojego pierwotnego stanu, ale opuścili własne mieszkanie, zachował w wiecznych więzach w mroku na dzień wielkiego sądu."
  tags: []
"Jud1,7":
  text: "Jak Sodoma i Gomora, i miasta wokół nich, w podobny im sposób oddały się nierządowi i udały się za pożądaniem ciała innego mężczyzny, są wystawione za przykład, ponosząc karę ognia wiecznego."
  tags: []
"Jud1,8":
  text: "Podobnie jednak i ci, oddani snom, prawdziwie kalają ciało i odrzucają zwierzchność oraz bluźnierczo mówią o uczestnikach chwały."
  tags: []
"Jud1,9":
  text: "A archanioł Michał, gdy sprzeciwiał się diabłu prowadząc spór o ciało Mojżesza, nie ośmielił się wnieść bluźnierczego sądu, ale powiedział: Oby cię PAN zgromił."
  tags: []
"Jud1,10":
  text: "Ci więc bluźnią temu, czego nawet nie znają; a to, co jak nierozumne zwierzęta zgodnie z naturą znają, przez to są niszczeni."
  tags: []
"Jud1,11":
  text: "Biada im! Bo poszli drogą Kaina i oddali się dla zapłaty zwiedzeniu Balaama, i poginęli w buncie Korego."
  tags: []
"Jud1,12":
  text: "Ci są zmazami na waszych ucztach miłości, bez obawy wspólnie z wami ucztują, siebie samych pasąc; obłoki bezwodne, przez wiatry miotane; bezowocne drzewa późnojesienne, dwukrotnie obumarłe, które zostały wykorzenione;"
  tags: []
"Jud1,13":
  text: "Dzikie bałwany morskie, pieniące się swoją hańbą; gwiazdy zbłąkane, dla których jest zachowany mrok ciemności na wieczność."
  tags: []
"Jud1,14":
  text: "Prorokował też o nich Henoch, siódmy w linii od Adama, mówiąc: Oto przyszedł PAN wśród miriad swoich świętych,"
  tags: []
"Jud1,15":
  text: "By dokonać sądu nad wszystkimi i ujawnić wszystkie ich bezbożności, za wszystkie bezbożne czyny, którymi wyrażali swą bezbożność, i za wszystkie harde słowa, które mówili przeciwko Niemu bezbożni grzesznicy."
  tags: []
"Jud1,16":
  text: "Szemrzący i niezadowoleni ze swojego losu, chodzący według swoich pożądliwości, a usta ich mówią nadęte słowa, a dla zysku podziwiają ludzi."
  tags: []
"Jud1,17":
  text: "A wam, umiłowani, niech zostaną przypomniane słowa zapowiedziane przez apostołów Pana naszego Jezusa Chrystusa,"
  tags: []
"Jud1,18":
  text: "Gdy mówili wam, że w ostatecznych czasach będą szydercy, którzy chodzą według swoich bezbożnych pożądliwości."
  tags: []
"Jud1,19":
  text: "To są ci, którzy się sami odłączają, zmysłowi, nie mający Ducha."
  tags: []
"Jud1,20":
  text: "Ale wy, umiłowani, budujcie samych siebie w najświętszej wierze waszej, modląc się w Duchu Świętym,"
  tags: []
"Jud1,21":
  text: "Zachowajcie samych siebie w miłości Bożej, czekając na miłosierdzie Pana naszego Jezusa Chrystusa ku życiu wiecznemu."
  tags: []
"Jud1,22":
  text: "I rozróżniając, nad jednymi prawdziwie miejcie litość,"
  tags: []
"Jud1,23":
  text: "A innych w bojaźni ratujcie, wyrywając ich od ognia, mając odrazę i do tuniki, która jest splamiona przez ciało."
  tags: []
"Jud1,24":
  text: "A Temu natomiast, który was może zachować od upadku i stawić przed obliczem swojej chwały bez nagany z radosnym uniesieniem,"
  tags: []
"Jud1,25":
  text: "Jedynemu mądremu Bogu, Zbawicielowi naszemu, chwała i majestat, moc i władza, i teraz, i po wszystkie wieki. Amen."
  tags: []
