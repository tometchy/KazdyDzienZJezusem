"Jud1,1": "Juda, sługa Jezusa Chrystusa, a brat Jakuba, do powołanych, którzy są uświęceni w Bogu Ojcu i są zachowani dla Jezusa Chrystusa."
"Jud1,2": "Miłosierdzie i pokój, i miłość niech się wam pomnożą."
"Jud1,3": "Umiłowani! Z całą gorliwością starając się pisać do was o wspólnym zbawieniu, uznałem za konieczne napisać do was zachęcając, abyście wytrwale walczyli o wiarę, raz tylko przekazaną świętym."
"Jud1,4": "Wkradli się bowiem jacyś ludzie, już dawno zapisani na ów wyrok, bezbożni, którzy łaskę Boga naszego obracają w rozpustę, i zapierają się jedynego Władcy, Boga i Pana naszego Jezusa Chrystusa."
"Jud1,5": "A chcę wam to przypomnieć, wam, którzy raz na zawsze to wiecie, że PAN wybawił lud z ziemi egipskiej, następnie tych, którzy nie wierzyli, wygubił."
"Jud1,6": "Także aniołów, którzy nie zachowali swojego pierwotnego stanu, ale opuścili własne mieszkanie, zachował w wiecznych więzach w mroku na dzień wielkiego sądu."
"Jud1,7": "Jak Sodoma i Gomora, i miasta wokół nich, w podobny im sposób oddały się nierządowi i udały się za pożądaniem ciała innego mężczyzny, są wystawione za przykład, ponosząc karę ognia wiecznego."
"Jud1,8": "Podobnie jednak i ci, oddani snom, prawdziwie kalają ciało i odrzucają zwierzchność oraz bluźnierczo mówią o uczestnikach chwały."
"Jud1,9": "A archanioł Michał, gdy sprzeciwiał się diabłu prowadząc spór o ciało Mojżesza, nie ośmielił się wnieść bluźnierczego sądu, ale powiedział: Oby cię PAN zgromił."
"Jud1,10": "Ci więc bluźnią temu, czego nawet nie znają; a to, co jak nierozumne zwierzęta zgodnie z naturą znają, przez to są niszczeni."
"Jud1,11": "Biada im! Bo poszli drogą Kaina i oddali się dla zapłaty zwiedzeniu Balaama, i poginęli w buncie Korego."
"Jud1,12": "Ci są zmazami na waszych ucztach miłości, bez obawy wspólnie z wami ucztują, siebie samych pasąc; obłoki bezwodne, przez wiatry miotane; bezowocne drzewa późnojesienne, dwukrotnie obumarłe, które zostały wykorzenione;"
"Jud1,13": "Dzikie bałwany morskie, pieniące się swoją hańbą; gwiazdy zbłąkane, dla których jest zachowany mrok ciemności na wieczność."
"Jud1,14": "Prorokował też o nich Henoch, siódmy w linii od Adama, mówiąc: Oto przyszedł PAN wśród miriad swoich świętych,"
"Jud1,15": "By dokonać sądu nad wszystkimi i ujawnić wszystkie ich bezbożności, za wszystkie bezbożne czyny, którymi wyrażali swą bezbożność, i za wszystkie harde słowa, które mówili przeciwko Niemu bezbożni grzesznicy."
"Jud1,16": "Szemrzący i niezadowoleni ze swojego losu, chodzący według swoich pożądliwości, a usta ich mówią nadęte słowa, a dla zysku podziwiają ludzi."
"Jud1,17": "A wam, umiłowani, niech zostaną przypomniane słowa zapowiedziane przez apostołów Pana naszego Jezusa Chrystusa,"
"Jud1,18": "Gdy mówili wam, że w ostatecznych czasach będą szydercy, którzy chodzą według swoich bezbożnych pożądliwości."
"Jud1,19": "To są ci, którzy się sami odłączają, zmysłowi, nie mający Ducha."
"Jud1,20": "Ale wy, umiłowani, budujcie samych siebie w najświętszej wierze waszej, modląc się w Duchu Świętym,"
"Jud1,21": "Zachowajcie samych siebie w miłości Bożej, czekając na miłosierdzie Pana naszego Jezusa Chrystusa ku życiu wiecznemu."
"Jud1,22": "I rozróżniając, nad jednymi prawdziwie miejcie litość,"
"Jud1,23": "A innych w bojaźni ratujcie, wyrywając ich od ognia, mając odrazę i do tuniki, która jest splamiona przez ciało."
"Jud1,24": "A Temu natomiast, który was może zachować od upadku i stawić przed obliczem swojej chwały bez nagany z radosnym uniesieniem,"
"Jud1,25": "Jedynemu mądremu Bogu, Zbawicielowi naszemu, chwała i majestat, moc i władza, i teraz, i po wszystkie wieki. Amen."
