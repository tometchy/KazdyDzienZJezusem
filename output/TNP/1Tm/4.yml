"1Tm4,1": "A Duch wyraźnie mówi, że w późniejszych czasach odstąpią niektórzy od wiary, zwracając się ku duchom zwodniczym i naukom demonów,"
"1Tm4,2": "W obłudzie mówiący kłamstwo, mając piętnem wypalone własne sumienie,"
"1Tm4,3": "Zabraniający zawierania małżeństw, każąc wstrzymywać się od pokarmów, które stworzył Bóg, aby przyjmowali je z dziękczynieniem wierzący i dogłębnie znający prawdę."
"1Tm4,4": "Bo wszelkie stworzenie Boże jest dobre, i nic nie zasługuje na odrzucenie, co przyjmuje się z dziękczynieniem;"
"1Tm4,5": "Jest bowiem poświęcone przez Słowo Boże i modlitwę."
"1Tm4,6": "Przedstawiając to braciom, będziesz dobrym sługą Jezusa Chrystusa, który jest karmiony słowami wiary i dobrej nauki, za którą poszedłeś."
"1Tm4,7": "Światowe natomiast i babskie baśnie odrzucaj, a ćwicz samego siebie w pobożności."
"1Tm4,8": "Albowiem cielesne ćwiczenie jest mało pożyteczne; lecz pobożność jest pożyteczna do wszystkiego, mając obietnicę życia teraźniejszego i tego mającego nadejść."
"1Tm4,9": "Godne zaufania jest to słowo i godne całkowitego przyjęcia."
"1Tm4,10": "Gdyż dlatego i trudzimy się i doznajemy obelg, że pokładamy nadzieję w Bogu żywym, który jest Zbawicielem wszystkich ludzi, a przede wszystkim wierzących."
"1Tm4,11": "To nakazuj i tego nauczaj."
"1Tm4,12": "Niech nikt nie pogardza twoją młodością; ale bądź wzorem dla wiernych w mowie, w postępowaniu, w miłości, w duchu, w wierze, w czystości."
"1Tm4,13": "Dopóki nie przyjdę, pilnuj czytania, zachęcania, nauki."
"1Tm4,14": "Nie zaniedbuj daru łaski, który jest w tobie, który został ci dany poprzez proroctwo z nałożeniem rąk starszych."
"1Tm4,15": "O to się troszcz, w tym trwaj, aby postęp twój był widoczny we wszystkim."
"1Tm4,16": "Pilnuj samego siebie i nauki, trwaj w tym; bo to czyniąc, uratujesz samego siebie i tych, którzy cię słuchają."
