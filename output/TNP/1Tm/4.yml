"1Tm4,1":
  text: "A Duch wyraźnie mówi, że w późniejszych czasach odstąpią niektórzy od wiary, zwracając się ku duchom zwodniczym i naukom demonów,"
  tags: []
"1Tm4,2":
  text: "W obłudzie mówiący kłamstwo, mając piętnem wypalone własne sumienie,"
  tags: []
"1Tm4,3":
  text: "Zabraniający zawierania małżeństw, każąc wstrzymywać się od pokarmów, które stworzył Bóg, aby przyjmowali je z dziękczynieniem wierzący i dogłębnie znający prawdę."
  tags: []
"1Tm4,4":
  text: "Bo wszelkie stworzenie Boże jest dobre, i nic nie zasługuje na odrzucenie, co przyjmuje się z dziękczynieniem;"
  tags: []
"1Tm4,5":
  text: "Jest bowiem poświęcone przez Słowo Boże i modlitwę."
  tags: []
"1Tm4,6":
  text: "Przedstawiając to braciom, będziesz dobrym sługą Jezusa Chrystusa, który jest karmiony słowami wiary i dobrej nauki, za którą poszedłeś."
  tags: []
"1Tm4,7":
  text: "Światowe natomiast i babskie baśnie odrzucaj, a ćwicz samego siebie w pobożności."
  tags: []
"1Tm4,8":
  text: "Albowiem cielesne ćwiczenie jest mało pożyteczne; lecz pobożność jest pożyteczna do wszystkiego, mając obietnicę życia teraźniejszego i tego mającego nadejść."
  tags: []
"1Tm4,9":
  text: "Godne zaufania jest to słowo i godne całkowitego przyjęcia."
  tags: []
"1Tm4,10":
  text: "Gdyż dlatego i trudzimy się i doznajemy obelg, że pokładamy nadzieję w Bogu żywym, który jest Zbawicielem wszystkich ludzi, a przede wszystkim wierzących."
  tags: []
"1Tm4,11":
  text: "To nakazuj i tego nauczaj."
  tags: []
"1Tm4,12":
  text: "Niech nikt nie pogardza twoją młodością; ale bądź wzorem dla wiernych w mowie, w postępowaniu, w miłości, w duchu, w wierze, w czystości."
  tags: []
"1Tm4,13":
  text: "Dopóki nie przyjdę, pilnuj czytania, zachęcania, nauki."
  tags: []
"1Tm4,14":
  text: "Nie zaniedbuj daru łaski, który jest w tobie, który został ci dany poprzez proroctwo z nałożeniem rąk starszych."
  tags: []
"1Tm4,15":
  text: "O to się troszcz, w tym trwaj, aby postęp twój był widoczny we wszystkim."
  tags: []
"1Tm4,16":
  text: "Pilnuj samego siebie i nauki, trwaj w tym; bo to czyniąc, uratujesz samego siebie i tych, którzy cię słuchają."
  tags: []
