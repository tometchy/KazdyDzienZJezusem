"1Tm3,1": "Godne zaufania jest to słowo: Jeśli ktoś pragnie biskupstwa, pragnie dobrego dzieła."
"1Tm3,2": "Biskup więc ma być nienaganny, mąż jednej żony, trzeźwy, rozsądny, przyzwoity, gościnny, zdolny do nauczania,"
"1Tm3,3": "Nie oddany pijaństwu, nie porywczy, nie szukający haniebnego zysku, ale łagodny, nie wojowniczy, nie chciwy,"
"1Tm3,4": "Który dobrze stoi na czele swojego domu, trzymając dzieci w posłuszeństwie z wszelką powagą,"
"1Tm3,5": "Bo jeśli ktoś nie umie stać na czele swojego domu, jaką będzie miał troskę o zbór Boga?"
"1Tm3,6": "Nie dopiero co nawrócony, aby nie stał się nadęty i nie wpadł pod sąd diabła."
"1Tm3,7": "Powinien też mieć dobre świadectwo od obcych, aby nie został haniebnie oskarżony i nie wpadł w sidła diabła."
"1Tm3,8": "Tak samo diakoni mają być godni, nie dwulicowi, nie namiętnie oddani winu, nie szukający haniebnego zysku,"
"1Tm3,9": "Którzy mają tajemnicę wiary w czystym sumieniu."
"1Tm3,10": "I ci niech będą najpierw doświadczani, potem niech usługują, będąc nienaganni."
"1Tm3,11": "Tak samo żony, niech będą szlachetne, nieskłonne do obmowy, trzeźwe, wierne we wszystkim."
"1Tm3,12": "Diakoni niech będą mężami jednej żony, którzy dobrze przewodzą dzieciom i swoim domom."
"1Tm3,13": "Albowiem ci, którzy pełnili dobrze służbę, zyskują sobie piękną rangę i wielką śmiałość w wierze, która jest w Chrystusie Jezusie."
"1Tm3,14": "To ci piszę, mając nadzieję, że wkrótce przyjdę do ciebie."
"1Tm3,15": "Jeśli natomiast będę się opóźniał, chcę żebyś wiedział, jak należy postępować w domu Bożym, który jest Kościołem Boga żywego, filarem i podstawą prawdy."
"1Tm3,16": "A zgodnie wyznajemy: Wielka jest tajemnica pobożności, Bóg został ukazany w ciele, uznany za sprawiedliwego w duchu, ukazany posłańcom, zwiastowany wśród narodów, zawierzono Mu na świecie, został wzięty w górę w chwale."
