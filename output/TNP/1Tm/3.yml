"1Tm3,1":
  text: "Godne zaufania jest to słowo: Jeśli ktoś pragnie biskupstwa, pragnie dobrego dzieła."
  tags: []
"1Tm3,2":
  text: "Biskup więc ma być nienaganny, mąż jednej żony, trzeźwy, rozsądny, przyzwoity, gościnny, zdolny do nauczania,"
  tags: []
"1Tm3,3":
  text: "Nie oddany pijaństwu, nie porywczy, nie szukający haniebnego zysku, ale łagodny, nie wojowniczy, nie chciwy,"
  tags: []
"1Tm3,4":
  text: "Który dobrze stoi na czele swojego domu, trzymając dzieci w posłuszeństwie z wszelką powagą,"
  tags: []
"1Tm3,5":
  text: "Bo jeśli ktoś nie umie stać na czele swojego domu, jaką będzie miał troskę o zbór Boga?"
  tags: []
"1Tm3,6":
  text: "Nie dopiero co nawrócony, aby nie stał się nadęty i nie wpadł pod sąd diabła."
  tags: []
"1Tm3,7":
  text: "Powinien też mieć dobre świadectwo od obcych, aby nie został haniebnie oskarżony i nie wpadł w sidła diabła."
  tags: []
"1Tm3,8":
  text: "Tak samo diakoni mają być godni, nie dwulicowi, nie namiętnie oddani winu, nie szukający haniebnego zysku,"
  tags: []
"1Tm3,9":
  text: "Którzy mają tajemnicę wiary w czystym sumieniu."
  tags: []
"1Tm3,10":
  text: "I ci niech będą najpierw doświadczani, potem niech usługują, będąc nienaganni."
  tags: []
"1Tm3,11":
  text: "Tak samo żony, niech będą szlachetne, nieskłonne do obmowy, trzeźwe, wierne we wszystkim."
  tags: []
"1Tm3,12":
  text: "Diakoni niech będą mężami jednej żony, którzy dobrze przewodzą dzieciom i swoim domom."
  tags: []
"1Tm3,13":
  text: "Albowiem ci, którzy pełnili dobrze służbę, zyskują sobie piękną rangę i wielką śmiałość w wierze, która jest w Chrystusie Jezusie."
  tags: []
"1Tm3,14":
  text: "To ci piszę, mając nadzieję, że wkrótce przyjdę do ciebie."
  tags: []
"1Tm3,15":
  text: "Jeśli natomiast będę się opóźniał, chcę żebyś wiedział, jak należy postępować w domu Bożym, który jest Kościołem Boga żywego, filarem i podstawą prawdy."
  tags: []
"1Tm3,16":
  text: "A zgodnie wyznajemy: Wielka jest tajemnica pobożności, Bóg został ukazany w ciele, uznany za sprawiedliwego w duchu, ukazany posłańcom, zwiastowany wśród narodów, zawierzono Mu na świecie, został wzięty w górę w chwale."
  tags: []
