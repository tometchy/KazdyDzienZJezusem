"1Tm5,1":
  text: "Starszego mężczyzny nie karć, ale zachęcaj go jak ojca, młodszych jak braci,"
  tags: []
"1Tm5,2":
  text: "Starsze niewiasty jak matki, młodsze jak siostry, we wszelkiej czystości,"
  tags: []
"1Tm5,3":
  text: "Miej we czci wdowy, które istotnie są wdowami."
  tags: []
"1Tm5,4":
  text: "A jeśli jakaś wdowa ma dzieci lub wnuki, niech najpierw uczą się one pobożnie szanować swój dom i oddawać w zamian wdzięczność rodzicom; jest to bowiem piękne i godne przyjęcia przed obliczem Boga."
  tags: []
"1Tm5,5":
  text: "Wdową prawdziwie jest ta, która jest osamotniona i pokłada nadzieję w Bogu, i trwa w błaganiach i modlitwach dniem i nocą."
  tags: []
"1Tm5,6":
  text: "Ale ta, która żyje w zbytku, ta żyjąc jest martwa."
  tags: []
"1Tm5,7":
  text: "To więc nakazuj, żeby były nienaganne."
  tags: []
"1Tm5,8":
  text: "A jeśli ktoś o swoich, a nade wszystko o domowników, nie ma starania, ten zaparł się wiary i jest gorszy od niewierzącego."
  tags: []
"1Tm5,9":
  text: "Na listę wdów niech jest zapisana ta, mająca nie mniej niż sześćdziesiąt lat, która była żoną jednego męża,"
  tags: []
"1Tm5,10":
  text: "Mająca świadectwo dobrych czynów, że wychowała dzieci, że była gościnna, że umywała nogi świętym, że pomagała uciśnionym, że podejmowała się każdego dobrego dzieła."
  tags: []
"1Tm5,11":
  text: "Natomiast młodszych wdów do nich nie zaliczaj; bo kiedy namiętności odwodzą je od Chrystusa, chcą wychodzić za mąż."
  tags: []
"1Tm5,12":
  text: "Obciąża je wyrok, ponieważ nie dochowały pierwszej wierności;"
  tags: []
"1Tm5,13":
  text: "Jednocześnie też są próżne, uczą się chodzić od domu do domu, a nie tylko próżne, ale też są rozgadane i wścibskie, i mówią czego nie potrzeba."
  tags: []
"1Tm5,14":
  text: "Chcę więc, aby młodsze wychodziły za mąż, rodziły dzieci, zarządzały domem, by nie dawały przeciwnikowi okazji do obmowy;"
  tags: []
"1Tm5,15":
  text: "Niektóre bowiem już skręciły, by pójść za szatanem."
  tags: []
"1Tm5,16":
  text: "Dlatego, jeśli jakiś wierzący czy wierząca ma wdowy, niech je wspomaga, aby zbór nie był obciążany, aby wspomagał te, które prawdziwie są wdowami."
  tags: []
"1Tm5,17":
  text: "Starsi, którzy dobrze przewodzą, niech będą uznani za godnych podwójnej czci, a przede wszystkim ci, którzy trudzą się w słowie i nauce."
  tags: []
"1Tm5,18":
  text: "Albowiem Pismo mówi: Młócącemu wołowi nie zawiążesz pyska; i: Godny jest pracownik swojej zapłaty."
  tags: []
"1Tm5,19":
  text: "Przeciwko starszemu nie przyjmuj skargi, chyba że na podstawie dwóch lub trzech świadków."
  tags: []
"1Tm5,20":
  text: "A tych, którzy grzeszą, napominaj wobec wszystkich, aby i pozostali się bali."
  tags: []
"1Tm5,21":
  text: "Zaświadczam przed obliczem Boga i Pana Jezusa Chrystusa, i wybranych aniołów, abyś tego strzegł bez uprzedzeń, nie czyniąc niczego stronniczo."
  tags: []
"1Tm5,22":
  text: "Rąk na nikogo pośpiesznie nie nakładaj ani nie miej udziału w cudzych grzechach; samego siebie zachowuj czystym."
  tags: []
"1Tm5,23":
  text: "Już więcej samej wody nie pij, ale używaj w małej ilości wina ze względu na żołądek i częste twoje choroby."
  tags: []
"1Tm5,24":
  text: "Grzechy niektórych ludzi są wcześniej jawne i poprzedzają sąd, natomiast za niektórymi podążają w ślad."
  tags: []
"1Tm5,25":
  text: "Tak samo i dobre czyny są wcześniej jawne, a te, z którymi jest inaczej, nie mogą zostać ukryte."
  tags: []
