"1Tm5,1": "Starszego mężczyzny nie karć, ale zachęcaj go jak ojca, młodszych jak braci,"
"1Tm5,2": "Starsze niewiasty jak matki, młodsze jak siostry, we wszelkiej czystości,"
"1Tm5,3": "Miej we czci wdowy, które istotnie są wdowami."
"1Tm5,4": "A jeśli jakaś wdowa ma dzieci lub wnuki, niech najpierw uczą się one pobożnie szanować swój dom i oddawać w zamian wdzięczność rodzicom; jest to bowiem piękne i godne przyjęcia przed obliczem Boga."
"1Tm5,5": "Wdową prawdziwie jest ta, która jest osamotniona i pokłada nadzieję w Bogu, i trwa w błaganiach i modlitwach dniem i nocą."
"1Tm5,6": "Ale ta, która żyje w zbytku, ta żyjąc jest martwa."
"1Tm5,7": "To więc nakazuj, żeby były nienaganne."
"1Tm5,8": "A jeśli ktoś o swoich, a nade wszystko o domowników, nie ma starania, ten zaparł się wiary i jest gorszy od niewierzącego."
"1Tm5,9": "Na listę wdów niech jest zapisana ta, mająca nie mniej niż sześćdziesiąt lat, która była żoną jednego męża,"
"1Tm5,10": "Mająca świadectwo dobrych czynów, że wychowała dzieci, że była gościnna, że umywała nogi świętym, że pomagała uciśnionym, że podejmowała się każdego dobrego dzieła."
"1Tm5,11": "Natomiast młodszych wdów do nich nie zaliczaj; bo kiedy namiętności odwodzą je od Chrystusa, chcą wychodzić za mąż."
"1Tm5,12": "Obciąża je wyrok, ponieważ nie dochowały pierwszej wierności;"
"1Tm5,13": "Jednocześnie też są próżne, uczą się chodzić od domu do domu, a nie tylko próżne, ale też są rozgadane i wścibskie, i mówią czego nie potrzeba."
"1Tm5,14": "Chcę więc, aby młodsze wychodziły za mąż, rodziły dzieci, zarządzały domem, by nie dawały przeciwnikowi okazji do obmowy;"
"1Tm5,15": "Niektóre bowiem już skręciły, by pójść za szatanem."
"1Tm5,16": "Dlatego, jeśli jakiś wierzący czy wierząca ma wdowy, niech je wspomaga, aby zbór nie był obciążany, aby wspomagał te, które prawdziwie są wdowami."
"1Tm5,17": "Starsi, którzy dobrze przewodzą, niech będą uznani za godnych podwójnej czci, a przede wszystkim ci, którzy trudzą się w słowie i nauce."
"1Tm5,18": "Albowiem Pismo mówi: Młócącemu wołowi nie zawiążesz pyska; i: Godny jest pracownik swojej zapłaty."
"1Tm5,19": "Przeciwko starszemu nie przyjmuj skargi, chyba że na podstawie dwóch lub trzech świadków."
"1Tm5,20": "A tych, którzy grzeszą, napominaj wobec wszystkich, aby i pozostali się bali."
"1Tm5,21": "Zaświadczam przed obliczem Boga i Pana Jezusa Chrystusa, i wybranych aniołów, abyś tego strzegł bez uprzedzeń, nie czyniąc niczego stronniczo."
"1Tm5,22": "Rąk na nikogo pośpiesznie nie nakładaj ani nie miej udziału w cudzych grzechach; samego siebie zachowuj czystym."
"1Tm5,23": "Już więcej samej wody nie pij, ale używaj w małej ilości wina ze względu na żołądek i częste twoje choroby."
"1Tm5,24": "Grzechy niektórych ludzi są wcześniej jawne i poprzedzają sąd, natomiast za niektórymi podążają w ślad."
"1Tm5,25": "Tak samo i dobre czyny są wcześniej jawne, a te, z którymi jest inaczej, nie mogą zostać ukryte."
