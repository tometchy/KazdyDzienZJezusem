"1Tm2,1": "Zachęcam więc przede wszystkim, aby zanosić błagania, modlitwy, prośby wstawiennicze i dziękczynienia za wszystkich ludzi;"
"1Tm2,2": "Za królów i za wszystkich na wysokich stanowiskach, abyśmy wiedli ciche i spokojne życie w całej pobożności i powadze."
"1Tm2,3": "Albowiem jest to dobre i godne przyjęcia przed Bogiem, Zbawicielem naszym,"
"1Tm2,4": "Który chce, aby wszyscy ludzie zostali zbawieni i doszli do dogłębnego poznania prawdy."
"1Tm2,5": "Bo jeden jest Bóg, jeden też pośrednik Boga i ludzi: człowiek Chrystus Jezus,"
"1Tm2,6": "Który dał siebie samego na okup za wszystkich, na świadectwo swoich czasów."
"1Tm2,7": "Na co ja zostałem ustanowiony kaznodzieją i apostołem, prawdę mówię w Chrystusie, nie kłamię, nauczycielem pogan w wierze i w prawdzie."
"1Tm2,8": "Chcę więc, aby mężczyźni modlili się na każdym miejscu, wznosząc czyste ręce bez gniewu i bez sporów."
"1Tm2,9": "Tak samo i kobiety, aby ozdabiały się szatą przyzwoitą, ze skromnością i umiarem, nie w wymyślne sploty włosów, nie w złoto lub perły, nie w kosztowny strój,"
"1Tm2,10": "Ale jak przystoi kobietom, przyznającym sobie pobożność – w dobre czyny."
"1Tm2,11": "Kobieta niech się uczy w cichości z całą uległością."
"1Tm2,12": "Kobiecie natomiast nie pozwalam nauczać, ani kierować mężem, ale być w cichości."
"1Tm2,13": "Bo Adam pierwszy był ukształtowany, potem Ewa."
"1Tm2,14": "I nie Adam został zwiedziony, ale kobieta została zwiedziona, stając się winną przestępstwa;"
"1Tm2,15": "Lecz zostanie zbawiona przez macierzyństwo, jeśli zostaną w wierze, w miłości i uświęceniu z rozsądkiem."
