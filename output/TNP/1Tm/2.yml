"1Tm2,1":
  text: "Zachęcam więc przede wszystkim, aby zanosić błagania, modlitwy, prośby wstawiennicze i dziękczynienia za wszystkich ludzi;"
  tags: []
"1Tm2,2":
  text: "Za królów i za wszystkich na wysokich stanowiskach, abyśmy wiedli ciche i spokojne życie w całej pobożności i powadze."
  tags: []
"1Tm2,3":
  text: "Albowiem jest to dobre i godne przyjęcia przed Bogiem, Zbawicielem naszym,"
  tags: []
"1Tm2,4":
  text: "Który chce, aby wszyscy ludzie zostali zbawieni i doszli do dogłębnego poznania prawdy."
  tags: []
"1Tm2,5":
  text: "Bo jeden jest Bóg, jeden też pośrednik Boga i ludzi: człowiek Chrystus Jezus,"
  tags: []
"1Tm2,6":
  text: "Który dał siebie samego na okup za wszystkich, na świadectwo swoich czasów."
  tags: []
"1Tm2,7":
  text: "Na co ja zostałem ustanowiony kaznodzieją i apostołem, prawdę mówię w Chrystusie, nie kłamię, nauczycielem pogan w wierze i w prawdzie."
  tags: []
"1Tm2,8":
  text: "Chcę więc, aby mężczyźni modlili się na każdym miejscu, wznosząc czyste ręce bez gniewu i bez sporów."
  tags: []
"1Tm2,9":
  text: "Tak samo i kobiety, aby ozdabiały się szatą przyzwoitą, ze skromnością i umiarem, nie w wymyślne sploty włosów, nie w złoto lub perły, nie w kosztowny strój,"
  tags: []
"1Tm2,10":
  text: "Ale jak przystoi kobietom, przyznającym sobie pobożność – w dobre czyny."
  tags: []
"1Tm2,11":
  text: "Kobieta niech się uczy w cichości z całą uległością."
  tags: []
"1Tm2,12":
  text: "Kobiecie natomiast nie pozwalam nauczać, ani kierować mężem, ale być w cichości."
  tags: []
"1Tm2,13":
  text: "Bo Adam pierwszy był ukształtowany, potem Ewa."
  tags: []
"1Tm2,14":
  text: "I nie Adam został zwiedziony, ale kobieta została zwiedziona, stając się winną przestępstwa;"
  tags: []
"1Tm2,15":
  text: "Lecz zostanie zbawiona przez macierzyństwo, jeśli zostaną w wierze, w miłości i uświęceniu z rozsądkiem."
  tags: []
