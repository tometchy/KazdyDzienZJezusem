"Prz2,1": "Synu mój, jeśli przyjmiesz moje słowa i zachowasz u siebie moje przykazania;"
"Prz2,2": "Zwracając swoje ucho na mądrość i skłaniając swoje serce ku rozumowi;"
"Prz2,3": "Jeśli przywołasz roztropność i swój głos poddasz rozumowi;"
"Prz2,4": "Jeśli będziesz jej szukał jak srebra i poszukiwał jej jak ukrytych skarbów;"
"Prz2,5": "Wtedy zrozumiesz bojaźń JHWH i znajdziesz poznanie Boga."
"Prz2,6": "Bo JHWH daje mądrość, z Jego ust pochodzi poznanie i rozum."
"Prz2,7": "On zachowuje dla prawych pomyślność; On jest tarczą dla tych, którzy postępują niewinnie;"
"Prz2,8": "Strzeże ścieżek sądu i chroni drogę swoich świętych."
"Prz2,9": "Wtedy zrozumiesz sprawiedliwość, sąd, prawość i każdy dobry szlak."
"Prz2,10": "Bo mądrość wejdzie do twojego serca i poznanie będzie miłe twojej duszy;"
"Prz2,11": "Wtedy rozwaga będzie czuwać nad tobą, rozum będzie cię chronił."
"Prz2,12": "By uwolnić cię od złej drogi i od człowieka, który mówi przewrotnie;"
"Prz2,13": "Od tych, którzy porzucają ścieżki prawości, aby chodzić drogami ciemności;"
"Prz2,14": "Którzy się radują z czynienia zła, i cieszą się w złych przewrotnościach;"
"Prz2,15": "Których ścieżki są kręte, którzy są przebiegli na swoich szlakach;"
"Prz2,16": "Aby cię uwolnić od cudzej kobiety, od obcej, która schlebia pięknymi słowami;"
"Prz2,17": "Która porzuciła towarzysza swej młodości i zapomniała o przymierzu swojego Boga;"
"Prz2,18": "Bo jej dom chyli się ku śmierci, a jej szlaki zmierzają do krainy cieni;"
"Prz2,19": "Żaden z wchodzących do niej nie powraca i nie osiąga ścieżki życia –"
"Prz2,20": "Tak, abyś kroczył drogą dobrych i strzegł ścieżek ludzi sprawiedliwych."
"Prz2,21": "Bo prawi będą mieszkać na ziemi i nienaganni na niej pozostaną;"
"Prz2,22": "Ale niegodziwi będą wykorzenieni z ziemi a postępujący zdradziecko będą z niej wyrwani."
