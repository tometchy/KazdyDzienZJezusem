"Prz2,1":
  text: "Synu mój, jeśli przyjmiesz moje słowa i zachowasz u siebie moje przykazania;"
  tags: []
"Prz2,2":
  text: "Zwracając swoje ucho na mądrość i skłaniając swoje serce ku rozumowi;"
  tags: []
"Prz2,3":
  text: "Jeśli przywołasz roztropność i swój głos poddasz rozumowi;"
  tags: []
"Prz2,4":
  text: "Jeśli będziesz jej szukał jak srebra i poszukiwał jej jak ukrytych skarbów;"
  tags: []
"Prz2,5":
  text: "Wtedy zrozumiesz bojaźń JHWH i znajdziesz poznanie Boga."
  tags: []
"Prz2,6":
  text: "Bo JHWH daje mądrość, z Jego ust pochodzi poznanie i rozum."
  tags: []
"Prz2,7":
  text: "On zachowuje dla prawych pomyślność; On jest tarczą dla tych, którzy postępują niewinnie;"
  tags: []
"Prz2,8":
  text: "Strzeże ścieżek sądu i chroni drogę swoich świętych."
  tags: []
"Prz2,9":
  text: "Wtedy zrozumiesz sprawiedliwość, sąd, prawość i każdy dobry szlak."
  tags: []
"Prz2,10":
  text: "Bo mądrość wejdzie do twojego serca i poznanie będzie miłe twojej duszy;"
  tags: []
"Prz2,11":
  text: "Wtedy rozwaga będzie czuwać nad tobą, rozum będzie cię chronił."
  tags: []
"Prz2,12":
  text: "By uwolnić cię od złej drogi i od człowieka, który mówi przewrotnie;"
  tags: []
"Prz2,13":
  text: "Od tych, którzy porzucają ścieżki prawości, aby chodzić drogami ciemności;"
  tags: []
"Prz2,14":
  text: "Którzy się radują z czynienia zła, i cieszą się w złych przewrotnościach;"
  tags: []
"Prz2,15":
  text: "Których ścieżki są kręte, którzy są przebiegli na swoich szlakach;"
  tags: []
"Prz2,16":
  text: "Aby cię uwolnić od cudzej kobiety, od obcej, która schlebia pięknymi słowami;"
  tags: []
"Prz2,17":
  text: "Która porzuciła towarzysza swej młodości i zapomniała o przymierzu swojego Boga;"
  tags: []
"Prz2,18":
  text: "Bo jej dom chyli się ku śmierci, a jej szlaki zmierzają do krainy cieni;"
  tags: []
"Prz2,19":
  text: "Żaden z wchodzących do niej nie powraca i nie osiąga ścieżki życia –"
  tags: []
"Prz2,20":
  text: "Tak, abyś kroczył drogą dobrych i strzegł ścieżek ludzi sprawiedliwych."
  tags: []
"Prz2,21":
  text: "Bo prawi będą mieszkać na ziemi i nienaganni na niej pozostaną;"
  tags: []
"Prz2,22":
  text: "Ale niegodziwi będą wykorzenieni z ziemi a postępujący zdradziecko będą z niej wyrwani."
  tags: []
