"Prz29,1":
  text: "Człowiek, który mimo częstych nagan usztywnia swój kark, zostanie nagle skruszony i bez uzdrowienia."
  tags: []
"Prz29,2":
  text: "Gdy sprawiedliwi stają się wielcy, lud się raduje, a gdy panują niegodziwi, lud jęczy."
  tags: []
"Prz29,3":
  text: "Człowiek miłujący mądrość, sprawia swojemu ojcu radość, a kto prowadzi się z nierządnicami, trwoni majątek."
  tags: []
"Prz29,4":
  text: "Król utwierdza kraj prawem, lecz człowiek pobierający daninę, niszczy go."
  tags: []
"Prz29,5":
  text: "Człowiek, który schlebia swojemu bliźniemu, rozciąga sieć przed jego nogami."
  tags: []
"Prz29,6":
  text: "W przestępstwie złego człowieka jest pułapka, ale sprawiedliwy śpiewa i raduje się."
  tags: []
"Prz29,7":
  text: "Sprawiedliwy zna sprawę ubogich, lecz niegodziwy nie rozumie takiego poznania."
  tags: []
"Prz29,8":
  text: "Mężowie szyderstwa wzburzają miasto, ale mądrzy odwracają gniew."
  tags: []
"Prz29,9":
  text: "Gdy mądry człowiek spiera się z głupim człowiekiem, to ten wybucha gniewem i śmieje się szyderczo, a nie ma spokoju."
  tags: []
"Prz29,10":
  text: "Ludzie żądni krwi, nienawidzą niewinnego, ale prawi szukają ochrony jego duszy."
  tags: []
"Prz29,11":
  text: "Głupi daje upust całemu swojemu duchowi, lecz mądry na koniec go uśmierza."
  tags: []
"Prz29,12":
  text: "Jeśli władca zważa na słowo kłamstwa, to wszyscy jego słudzy są niegodziwi."
  tags: []
"Prz29,13":
  text: "Nędzarz i ciemiężca spotykają się, a JHWH obu oświeca oczy."
  tags: []
"Prz29,14":
  text: "Tron króla, który wiernie sądzi ubogich, zostanie utwierdzony na wieki."
  tags: []
"Prz29,15":
  text: "Rózga i nagana dają mądrość, a krnąbrny chłopiec przynosi wstyd swojej matce."
  tags: []
"Prz29,16":
  text: "Gdy niegodziwych przybywa, to pomnaża się i przestępstwo, lecz sprawiedliwi ujrzą ich upadek."
  tags: []
"Prz29,17":
  text: "Karć swojego syna, a przyniesie ci spokój i sprawi rozkosz twojej duszy."
  tags: []
"Prz29,18":
  text: "Gdy nie ma objawienia, lud się rozprzęga, a kto przestrzega Prawa, jest błogosławiony."
  tags: []
"Prz29,19":
  text: "Sługi nie napomina się samymi słowami, bo choć rozumie, a jednak nie ma na nie odzewu."
  tags: []
"Prz29,20":
  text: "Widzisz człowieka, który jest pochopny w swoich słowach? Więcej nadziei jest dla głupca niż dla niego."
  tags: []
"Prz29,21":
  text: "Kto od młodości rozpieszcza swojego sługę; w końcu zrobi z niego słabeusza."
  tags: []
"Prz29,22":
  text: "Człowiek gwałtowny wszczyna spór, a człowiek porywczy mnoży przestępstwa."
  tags: []
"Prz29,23":
  text: "Pycha człowieka upokarza go, ale pokorny duchem osiągnie chwałę."
  tags: []
"Prz29,24":
  text: "Kto dzieli się ze złodziejem, nienawidzi swojej duszy; słyszy przekleństwo, a nie wyjawia go."
  tags: []
"Prz29,25":
  text: "Lęk przed człowiekiem zastawia sidło, ale kto ufa JHWH, będzie bezpieczny."
  tags: []
"Prz29,26":
  text: "Wielu zabiega o względy władcy, natomiast sąd nad człowiekiem zależy od JHWH."
  tags: []
"Prz29,27":
  text: "Ohydą dla sprawiedliwych jest człowiek nieprawy, a droga prawego ohydą jest dla niegodziwych."
  tags: []
