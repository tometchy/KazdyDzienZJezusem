"Prz29,1": "Człowiek, który mimo częstych nagan usztywnia swój kark, zostanie nagle skruszony i bez uzdrowienia."
"Prz29,2": "Gdy sprawiedliwi stają się wielcy, lud się raduje, a gdy panują niegodziwi, lud jęczy."
"Prz29,3": "Człowiek miłujący mądrość, sprawia swojemu ojcu radość, a kto prowadzi się z nierządnicami, trwoni majątek."
"Prz29,4": "Król utwierdza kraj prawem, lecz człowiek pobierający daninę, niszczy go."
"Prz29,5": "Człowiek, który schlebia swojemu bliźniemu, rozciąga sieć przed jego nogami."
"Prz29,6": "W przestępstwie złego człowieka jest pułapka, ale sprawiedliwy śpiewa i raduje się."
"Prz29,7": "Sprawiedliwy zna sprawę ubogich, lecz niegodziwy nie rozumie takiego poznania."
"Prz29,8": "Mężowie szyderstwa wzburzają miasto, ale mądrzy odwracają gniew."
"Prz29,9": "Gdy mądry człowiek spiera się z głupim człowiekiem, to ten wybucha gniewem i śmieje się szyderczo, a nie ma spokoju."
"Prz29,10": "Ludzie żądni krwi, nienawidzą niewinnego, ale prawi szukają ochrony jego duszy."
"Prz29,11": "Głupi daje upust całemu swojemu duchowi, lecz mądry na koniec go uśmierza."
"Prz29,12": "Jeśli władca zważa na słowo kłamstwa, to wszyscy jego słudzy są niegodziwi."
"Prz29,13": "Nędzarz i ciemiężca spotykają się, a JHWH obu oświeca oczy."
"Prz29,14": "Tron króla, który wiernie sądzi ubogich, zostanie utwierdzony na wieki."
"Prz29,15": "Rózga i nagana dają mądrość, a krnąbrny chłopiec przynosi wstyd swojej matce."
"Prz29,16": "Gdy niegodziwych przybywa, to pomnaża się i przestępstwo, lecz sprawiedliwi ujrzą ich upadek."
"Prz29,17": "Karć swojego syna, a przyniesie ci spokój i sprawi rozkosz twojej duszy."
"Prz29,18": "Gdy nie ma objawienia, lud się rozprzęga, a kto przestrzega Prawa, jest błogosławiony."
"Prz29,19": "Sługi nie napomina się samymi słowami, bo choć rozumie, a jednak nie ma na nie odzewu."
"Prz29,20": "Widzisz człowieka, który jest pochopny w swoich słowach? Więcej nadziei jest dla głupca niż dla niego."
"Prz29,21": "Kto od młodości rozpieszcza swojego sługę; w końcu zrobi z niego słabeusza."
"Prz29,22": "Człowiek gwałtowny wszczyna spór, a człowiek porywczy mnoży przestępstwa."
"Prz29,23": "Pycha człowieka upokarza go, ale pokorny duchem osiągnie chwałę."
"Prz29,24": "Kto dzieli się ze złodziejem, nienawidzi swojej duszy; słyszy przekleństwo, a nie wyjawia go."
"Prz29,25": "Lęk przed człowiekiem zastawia sidło, ale kto ufa JHWH, będzie bezpieczny."
"Prz29,26": "Wielu zabiega o względy władcy, natomiast sąd nad człowiekiem zależy od JHWH."
"Prz29,27": "Ohydą dla sprawiedliwych jest człowiek nieprawy, a droga prawego ohydą jest dla niegodziwych."
