"Prz12,1": "Kto kocha karność, kocha wiedzę, a kto nienawidzi upomnienia, jest głupi."
"Prz12,2": "Dobry człowiek zyska łaskę JHWH, ale JHWH potępi człowieka przebiegłego."
"Prz12,3": "Człowiek nie umocni się niegodziwością, lecz korzeń sprawiedliwych nie zostanie poruszony."
"Prz12,4": "Dzielna żona jest koroną swojego męża, ale ta, przynosząca hańbę, jest jak zgnilizna w jego kościach."
"Prz12,5": "Myśli sprawiedliwych są prawe, a rady niegodziwych zdradliwe."
"Prz12,6": "Słowa niegodziwych są czyhaniem na krew, lecz usta prawych ocalą ich."
"Prz12,7": "Niegodziwi zostają powaleni i już ich nie ma, a dom sprawiedliwych się ostoi."
"Prz12,8": "Chwali się człowieka według jego roztropnych ust, a kto jest chwiejnego serca, będzie w pogardzie."
"Prz12,9": "Lepiej być lekceważonym i mieć swojego sługę, niż uważać się za ważnego, a nie mieć chleba."
"Prz12,10": "Sprawiedliwy dba o życie swojego bydła, a wnętrze niegodziwych jest okrutne."
"Prz12,11": "Kto uprawia swoją rolę, nasyci się chlebem, a kto gna za próżnującym, jest pozbawiony rozumu."
"Prz12,12": "Pragnieniem nikczemnych jest łup złych, a korzeń sprawiedliwych daje umocnienie."
"Prz12,13": "Przestępstwo nikczemnego jest pułapką jego warg, a sprawiedliwy wyjdzie z niedoli."
"Prz12,14": "Człowiek nasyci się dobrem z owocu swoich ust, a dorobek ludzkich rąk wróci do niego."
"Prz12,15": "Droga głupca wydaje się prawa w jego oczach, ale kto słucha rady, jest mądry."
"Prz12,16": "Głupiec w tym samym dniu ujawnia swój gniew, lecz roztropny skrywa hańbę."
"Prz12,17": "Kto rozgłasza prawdę, wypowiada to, co słuszne, lecz fałszywy świadek – oszustwo."
"Prz12,18": "Jest taki, który mówi bezmyślnie, jego słowa przeszywają jak miecz, lecz język mądrych jest lekarstwem."
"Prz12,19": "Prawdomówne wargi będą trwać wiecznie, ale język kłamliwy tak długo jak chwila."
"Prz12,20": "Podstęp jest w sercu knujących zło, lecz w doradzających pokój – radość."
"Prz12,21": "Sprawiedliwego nie spotka żadna krzywda, ale niegodziwi będą pełni udręki."
"Prz12,22": "Obrzydliwością dla JHWH są wargi kłamliwe, ale z postępującymi wiernie – Jego łaska."
"Prz12,23": "Człowiek roztropny ukrywa wiedzę, a serce głupców rozgłasza głupotę."
"Prz12,24": "Ręka pilnych będzie rządziła, a ręka leniwa będzie odrabiała pańszczyznę."
"Prz12,25": "Troska w sercu człowieka przygnębia je, a dobre słowo je rozwesela."
"Prz12,26": "Sprawiedliwy rozeznaje swojego bliźniego, a droga niegodziwych prowadzi ich na manowce."
"Prz12,27": "Leniwy nie upiecze swojej zwierzyny, ale mienie człowieka pilnego jest cenne."
"Prz12,28": "Na ścieżce sprawiedliwości jest życie, a na jej szlaku nie ma śmierci."
