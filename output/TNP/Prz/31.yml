"Prz31,1":
  text: "Słowa króla Lemuela. Zasada, której nauczyła go jego matka."
  tags: []
"Prz31,2":
  text: "Cóż, mój synu? Cóż, synu mojego łona? I cóż, synu moich ślubów?"
  tags: []
"Prz31,3":
  text: "Nie oddawaj kobietom swojej siły ani twoich dróg nie kieruj tam, gdzie wymazują królów z pamięci."
  tags: []
"Prz31,4":
  text: "Nie królom, o Lemuelu, nie królom picie wina, gdzież dla książąt mocny trunek;"
  tags: []
"Prz31,5":
  text: "Aby pijąc, nie zapomniał praw i nie wypaczył sprawy żadnego z synów udręczonych."
  tags: []
"Prz31,6":
  text: "Dajcie mocny trunek ginącemu, a wino zgorzkniałym na duszy."
  tags: []
"Prz31,7":
  text: "Będzie pił i zapomni o swoim ubóstwie, i niech nie pamięta więcej swojego utrapienia."
  tags: []
"Prz31,8":
  text: "Otwórz swoje usta w obronie niemego, w sprawie wszystkich synów skazanych na zgubę."
  tags: []
"Prz31,9":
  text: "Otwórz swoje usta, sądź sprawiedliwie i broń sprawy ubogiego i nędzarza."
  tags: []
"Prz31,10":
  text: "א‬ Któż znajdzie dzielną kobietę? Jej wartość daleko większa niż perły."
  tags: []
"Prz31,11":
  text: "ב‬‬ Serce męża ufa jej i korzyści mu nie zabraknie."
  tags: []
"Prz31,12":
  text: "‫ג‬ Świadczy mu ona dobro, a nie zło po wszystkie dni swojego życia."
  tags: []
"Prz31,13":
  text: "‫ד‬ Stara się o wełnę i len, i z upodobaniem pracuje swoimi rękami."
  tags: []
"Prz31,14":
  text: "‫ה‬‬ Jest jak statki handlowe; sprowadza żywność z daleka."
  tags: []
"Prz31,15":
  text: "‫ו‬‬ Wstaje, gdy jeszcze jest noc i daje pokarm swoim domownikom, a swoim służebnicom odpowiedni przydział prac."
  tags: []
"Prz31,16":
  text: "‫ז‬ Myśli o polu i kupuje je; z pracy swoich rąk sadzi winnice."
  tags: []
"Prz31,17":
  text: "‫ח‬ Przepasuje swoje biodra siłą i umacnia swoje ramiona."
  tags: []
"Prz31,18":
  text: "ט‬ Dostrzega, że jej dorobek jest dobry, a jej lampa w nocy nie gaśnie."
  tags: []
"Prz31,19":
  text: "‫י‬ Wyciąga ręce po kądziel, a dłońmi chwyta wrzeciono."
  tags: []
"Prz31,20":
  text: "‫כ‬ Otwiera dłoń przed ubogim i wyciąga swoje ręce do nędzarza."
  tags: []
"Prz31,21":
  text: "‫ל‬ Nie boi się, że śnieg zaskoczy jej domowników, bo wszyscy jej domownicy mają po dwa ubrania."
  tags: []
"Prz31,22":
  text: "‫מ‬ Wyrabia dla siebie przykrycia; jej strój jest z lnu i barwiony purpurą."
  tags: []
"Prz31,23":
  text: "‫נ‬ Jej mąż jest znany w bramach, gdy zasiada ze starszymi kraju."
  tags: []
"Prz31,24":
  text: "‫ס‬ Wyrabia bieliznę i sprzedaje ją, dostarcza pasy kupcowi."
  tags: []
"Prz31,25":
  text: "‫ע‬ Siła i dostojność są jej strojem; i uśmiecha się do dnia, który nadchodzi."
  tags: []
"Prz31,26":
  text: "‫פ‬ Z mądrością otwiera swoje usta, a jej językiem rządzi prawo łaski."
  tags: []
"Prz31,27":
  text: "‫צ‬ Czuwa nad biegiem spraw swojego domu i nie je niezapracowanego chleba."
  tags: []
"Prz31,28":
  text: "‫ק‬ Jej dzieci powstają i nazywają ją błogosławioną, mąż także ją chwali."
  tags: []
"Prz31,29":
  text: "‫ר‬ Wiele kobiet zarządza wspaniale, ale ty przewyższasz je wszystkie."
  tags: []
"Prz31,30":
  text: "‫ש‬ Wdzięk jest zwodniczy i piękność jest zwiewna, lecz kobieta żyjąca w bojaźni JHWH, ta będzie wychwalana."
  tags: []
"Prz31,31":
  text: "‫ת‬ Dajcie jej z owocu jej rąk i niech jej czyny chwalą ją w bramach."
  tags: []
