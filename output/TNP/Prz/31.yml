"Prz31,1": "Słowa króla Lemuela. Zasada, której nauczyła go jego matka."
"Prz31,2": "Cóż, mój synu? Cóż, synu mojego łona? I cóż, synu moich ślubów?"
"Prz31,3": "Nie oddawaj kobietom swojej siły ani twoich dróg nie kieruj tam, gdzie wymazują królów z pamięci."
"Prz31,4": "Nie królom, o Lemuelu, nie królom picie wina, gdzież dla książąt mocny trunek;"
"Prz31,5": "Aby pijąc, nie zapomniał praw i nie wypaczył sprawy żadnego z synów udręczonych."
"Prz31,6": "Dajcie mocny trunek ginącemu, a wino zgorzkniałym na duszy."
"Prz31,7": "Będzie pił i zapomni o swoim ubóstwie, i niech nie pamięta więcej swojego utrapienia."
"Prz31,8": "Otwórz swoje usta w obronie niemego, w sprawie wszystkich synów skazanych na zgubę."
"Prz31,9": "Otwórz swoje usta, sądź sprawiedliwie i broń sprawy ubogiego i nędzarza."
"Prz31,10": "א‬ Któż znajdzie dzielną kobietę? Jej wartość daleko większa niż perły."
"Prz31,11": "ב‬‬ Serce męża ufa jej i korzyści mu nie zabraknie."
"Prz31,12": "‫ג‬ Świadczy mu ona dobro, a nie zło po wszystkie dni swojego życia."
"Prz31,13": "‫ד‬ Stara się o wełnę i len, i z upodobaniem pracuje swoimi rękami."
"Prz31,14": "‫ה‬‬ Jest jak statki handlowe; sprowadza żywność z daleka."
"Prz31,15": "‫ו‬‬ Wstaje, gdy jeszcze jest noc i daje pokarm swoim domownikom, a swoim służebnicom odpowiedni przydział prac."
"Prz31,16": "‫ז‬ Myśli o polu i kupuje je; z pracy swoich rąk sadzi winnice."
"Prz31,17": "‫ח‬ Przepasuje swoje biodra siłą i umacnia swoje ramiona."
"Prz31,18": "ט‬ Dostrzega, że jej dorobek jest dobry, a jej lampa w nocy nie gaśnie."
"Prz31,19": "‫י‬ Wyciąga ręce po kądziel, a dłońmi chwyta wrzeciono."
"Prz31,20": "‫כ‬ Otwiera dłoń przed ubogim i wyciąga swoje ręce do nędzarza."
"Prz31,21": "‫ל‬ Nie boi się, że śnieg zaskoczy jej domowników, bo wszyscy jej domownicy mają po dwa ubrania."
"Prz31,22": "‫מ‬ Wyrabia dla siebie przykrycia; jej strój jest z lnu i barwiony purpurą."
"Prz31,23": "‫נ‬ Jej mąż jest znany w bramach, gdy zasiada ze starszymi kraju."
"Prz31,24": "‫ס‬ Wyrabia bieliznę i sprzedaje ją, dostarcza pasy kupcowi."
"Prz31,25": "‫ע‬ Siła i dostojność są jej strojem; i uśmiecha się do dnia, który nadchodzi."
"Prz31,26": "‫פ‬ Z mądrością otwiera swoje usta, a jej językiem rządzi prawo łaski."
"Prz31,27": "‫צ‬ Czuwa nad biegiem spraw swojego domu i nie je niezapracowanego chleba."
"Prz31,28": "‫ק‬ Jej dzieci powstają i nazywają ją błogosławioną, mąż także ją chwali."
"Prz31,29": "‫ר‬ Wiele kobiet zarządza wspaniale, ale ty przewyższasz je wszystkie."
"Prz31,30": "‫ש‬ Wdzięk jest zwodniczy i piękność jest zwiewna, lecz kobieta żyjąca w bojaźni JHWH, ta będzie wychwalana."
"Prz31,31": "‫ת‬ Dajcie jej z owocu jej rąk i niech jej czyny chwalą ją w bramach."
