"Prz18,1":
  text: "Samotnik dąży do spełnienia własnych pragnień i wtrąca się w każdą sprawę."
  tags: []
"Prz18,2":
  text: "Głupi nie ma upodobania w roztropności, lecz raczej w objawieniu swojego serca."
  tags: []
"Prz18,3":
  text: "Gdy przychodzi niegodziwy, przychodzi też pogarda, a z hańbą urąganie."
  tags: []
"Prz18,4":
  text: "Słowa ust człowieka są jak głębokie wody, a źródło mądrości jak płynący potok."
  tags: []
"Prz18,5":
  text: "Niedobrze jest popierać osobę niegodziwą, krzywdząc sprawiedliwego w sądzie."
  tags: []
"Prz18,6":
  text: "Wargi głupiego prowadzą do sporu, a jego usta wołają o ciosy."
  tags: []
"Prz18,7":
  text: "Usta głupiego są jego zgubą, a jego wargi sidłem dla jego duszy."
  tags: []
"Prz18,8":
  text: "Słowa oszczercy są jak przysmaki, które gładko zstępują do głębi wnętrzności."
  tags: []
"Prz18,9":
  text: "Kto okazuje się leniwym w swojej pracy, jest bratem wyrządzającego szkodę."
  tags: []
"Prz18,10":
  text: "Imię JHWH jest potężną wieżą, sprawiedliwy ucieka do niej i jest bezpieczny."
  tags: []
"Prz18,11":
  text: "Majątek bogatego jest jego warownym miastem i murem wysokim w jego wyobrażeniu."
  tags: []
"Prz18,12":
  text: "Przed upadkiem serce człowieka jest wyniosłe, a chwałę poprzedza pokora."
  tags: []
"Prz18,13":
  text: "Kto odpowiada słowem, zanim wysłucha, jest to głupotą i ona jest jego hańbą."
  tags: []
"Prz18,14":
  text: "Duch człowieka wspiera go w jego chorobie, lecz kto podniesie strapionego ducha?"
  tags: []
"Prz18,15":
  text: "Serce rozumnego nabywa wiedzy, a ucho mądrych szuka poznania."
  tags: []
"Prz18,16":
  text: "Dar człowieka poszerza mu miejsce i prowadzi go przed wielkich."
  tags: []
"Prz18,17":
  text: "Sprawiedliwym wydaje się ten, kto pierwszy przemawia w swojej sprawie w sądzie, jednak, gdy przyjdzie jego przeciwnik – sprawdzi go."
  tags: []
"Prz18,18":
  text: "Los kładzie kres sporom i rozstrzyga między potężnymi."
  tags: []
"Prz18,19":
  text: "Urażonego brata trudniej zdobyć niż warowne miasto, a spory są jak zasuwy w twierdzy."
  tags: []
"Prz18,20":
  text: "Owocem swoich ust nasyci człowiek swoje wnętrze, nasyci się plonem swoich warg."
  tags: []
"Prz18,21":
  text: "Śmierć i życie są w mocy języka, a kto go miłuje, spożyje jego owoc."
  tags: []
"Prz18,22":
  text: "Kto znalazł żonę, znalazł dobro i otrzymał łaskę od JHWH."
  tags: []
"Prz18,23":
  text: "Ubogi prosi błagalnie, ale bogaty odpowiada zuchwale."
  tags: []
"Prz18,24":
  text: "Człowiek ma towarzyszy, którzy przywodzą go do ruiny, lecz bywa przyjaciel, który przylgnie bardziej niż brat."
  tags: []
