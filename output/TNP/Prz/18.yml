"Prz18,1": "Samotnik dąży do spełnienia własnych pragnień i wtrąca się w każdą sprawę."
"Prz18,2": "Głupi nie ma upodobania w roztropności, lecz raczej w objawieniu swojego serca."
"Prz18,3": "Gdy przychodzi niegodziwy, przychodzi też pogarda, a z hańbą urąganie."
"Prz18,4": "Słowa ust człowieka są jak głębokie wody, a źródło mądrości jak płynący potok."
"Prz18,5": "Niedobrze jest popierać osobę niegodziwą, krzywdząc sprawiedliwego w sądzie."
"Prz18,6": "Wargi głupiego prowadzą do sporu, a jego usta wołają o ciosy."
"Prz18,7": "Usta głupiego są jego zgubą, a jego wargi sidłem dla jego duszy."
"Prz18,8": "Słowa oszczercy są jak przysmaki, które gładko zstępują do głębi wnętrzności."
"Prz18,9": "Kto okazuje się leniwym w swojej pracy, jest bratem wyrządzającego szkodę."
"Prz18,10": "Imię JHWH jest potężną wieżą, sprawiedliwy ucieka do niej i jest bezpieczny."
"Prz18,11": "Majątek bogatego jest jego warownym miastem i murem wysokim w jego wyobrażeniu."
"Prz18,12": "Przed upadkiem serce człowieka jest wyniosłe, a chwałę poprzedza pokora."
"Prz18,13": "Kto odpowiada słowem, zanim wysłucha, jest to głupotą i ona jest jego hańbą."
"Prz18,14": "Duch człowieka wspiera go w jego chorobie, lecz kto podniesie strapionego ducha?"
"Prz18,15": "Serce rozumnego nabywa wiedzy, a ucho mądrych szuka poznania."
"Prz18,16": "Dar człowieka poszerza mu miejsce i prowadzi go przed wielkich."
"Prz18,17": "Sprawiedliwym wydaje się ten, kto pierwszy przemawia w swojej sprawie w sądzie, jednak, gdy przyjdzie jego przeciwnik – sprawdzi go."
"Prz18,18": "Los kładzie kres sporom i rozstrzyga między potężnymi."
"Prz18,19": "Urażonego brata trudniej zdobyć niż warowne miasto, a spory są jak zasuwy w twierdzy."
"Prz18,20": "Owocem swoich ust nasyci człowiek swoje wnętrze, nasyci się plonem swoich warg."
"Prz18,21": "Śmierć i życie są w mocy języka, a kto go miłuje, spożyje jego owoc."
"Prz18,22": "Kto znalazł żonę, znalazł dobro i otrzymał łaskę od JHWH."
"Prz18,23": "Ubogi prosi błagalnie, ale bogaty odpowiada zuchwale."
"Prz18,24": "Człowiek ma towarzyszy, którzy przywodzą go do ruiny, lecz bywa przyjaciel, który przylgnie bardziej niż brat."
