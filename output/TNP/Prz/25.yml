"Prz25,1":
  text: "To także są przysłowia Salomona, które przepisali mężowie Ezechiasza, króla Judy."
  tags: []
"Prz25,2":
  text: "Chwałą Boga jest sprawę ukryć, a chwałą królów – dociekać sprawy."
  tags: []
"Prz25,3":
  text: "Wysokość niebios i głębia ziemi, i serca królów są niezbadane."
  tags: []
"Prz25,4":
  text: "Usuń żużel ze srebra, a uda się naczynie wytapiającemu."
  tags: []
"Prz25,5":
  text: "Usuń niegodziwego sprzed króla, a jego tron umocni się w sprawiedliwości."
  tags: []
"Prz25,6":
  text: "Nie szukaj własnej czci przed królem i nie stawaj na miejscu wielkich;"
  tags: []
"Prz25,7":
  text: "Bo lepiej, gdy ci powiedzą: Wstąp tutaj, niż gdyby cię poniżono przed księciem, którego twoje oczy widziały."
  tags: []
"Prz25,8":
  text: "Nie wchodź zbyt szybko w spór, abyś na koniec nie wiedział, co zrobić, gdy cię zawstydzi twój bliźni."
  tags: []
"Prz25,9":
  text: "Prowadź swój spór ze swoim bliźnim, lecz nie ujawnij tajemnicy drugiego;"
  tags: []
"Prz25,10":
  text: "Aby nie znieważył cię ten, który słucha i zła reputacja nie przylgnęła do ciebie."
  tags: []
"Prz25,11":
  text: "Słowo wypowiedziane we właściwym czasie jest jak złote jabłko na rzeźbach ze srebra."
  tags: []
"Prz25,12":
  text: "Jak złoty kolczyk i ozdoba z najczystszego złota jest dla ucha posłusznego ten, który mądrze napomina."
  tags: []
"Prz25,13":
  text: "Czym chłód śniegu w dzień żniwa, tym wierny posłaniec dla tych, którzy go posyłają, bo pokrzepia dusze swoich panów."
  tags: []
"Prz25,14":
  text: "Człowiek, który się chełpi zwodniczym darem, jest jak chmury i wiatr, lecz bez deszczu."
  tags: []
"Prz25,15":
  text: "Cierpliwością można przekonać oblicze władcy, a łagodny język skruszy nawet kość."
  tags: []
"Prz25,16":
  text: "Znalazłeś miód? Jedz tyle, ile trzeba, abyś się nie przejadł i nie zwymiotował."
  tags: []
"Prz25,17":
  text: "Rzadko stawiaj swoją nogę w domu twojego bliźniego, by się tobą nie przejadł i cię nie znienawidził."
  tags: []
"Prz25,18":
  text: "Człowiek składający fałszywe świadectwo przeciw swojemu bliźniemu jest maczugą i mieczem, i ostrą strzałą."
  tags: []
"Prz25,19":
  text: "Zaufanie przewrotnemu w dniu ucisku jest jak złamany ząb i zwichnięta noga."
  tags: []
"Prz25,20":
  text: "Jak ten, kto zabiera okrycie w zimny dzień i wylewa ocet na saletrę jest ten, kto śpiewa pieśni udręczonemu sercu."
  tags: []
"Prz25,21":
  text: "Jeśli twój nieprzyjaciel jest głodny, nakarm go chlebem, a jeśli jest spragniony, napój go wodą;"
  tags: []
"Prz25,22":
  text: "Wtedy ty zgarniesz rozżarzone węgle na jego głowę, a JHWH cię nagrodzi."
  tags: []
"Prz25,23":
  text: "Północny wiatr rozprasza deszcz, a zagniewane oblicze przepędza zdradliwy język."
  tags: []
"Prz25,24":
  text: "Lepiej mieszkać w kącie na dachu niż z kłótliwą żoną we wspólnym domu."
  tags: []
"Prz25,25":
  text: "Jak zimna woda dla znużonej duszy, tak dobra wieść z dalekiej ziemi."
  tags: []
"Prz25,26":
  text: "Jak zmącone źródło i skażony zdrój, tak sprawiedliwy, który chwiejny jest przed niegodziwym."
  tags: []
"Prz25,27":
  text: "Niedobrze jest jeść za dużo miodu, a szukanie własnej chwały nie jest chwałą."
  tags: []
"Prz25,28":
  text: "Człowiek, który nie panuje nad swoim duchem, jest miastem zburzonym bez muru."
  tags: []
