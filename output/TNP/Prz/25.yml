"Prz25,1": "To także są przysłowia Salomona, które przepisali mężowie Ezechiasza, króla Judy."
"Prz25,2": "Chwałą Boga jest sprawę ukryć, a chwałą królów – dociekać sprawy."
"Prz25,3": "Wysokość niebios i głębia ziemi, i serca królów są niezbadane."
"Prz25,4": "Usuń żużel ze srebra, a uda się naczynie wytapiającemu."
"Prz25,5": "Usuń niegodziwego sprzed króla, a jego tron umocni się w sprawiedliwości."
"Prz25,6": "Nie szukaj własnej czci przed królem i nie stawaj na miejscu wielkich;"
"Prz25,7": "Bo lepiej, gdy ci powiedzą: Wstąp tutaj, niż gdyby cię poniżono przed księciem, którego twoje oczy widziały."
"Prz25,8": "Nie wchodź zbyt szybko w spór, abyś na koniec nie wiedział, co zrobić, gdy cię zawstydzi twój bliźni."
"Prz25,9": "Prowadź swój spór ze swoim bliźnim, lecz nie ujawnij tajemnicy drugiego;"
"Prz25,10": "Aby nie znieważył cię ten, który słucha i zła reputacja nie przylgnęła do ciebie."
"Prz25,11": "Słowo wypowiedziane we właściwym czasie jest jak złote jabłko na rzeźbach ze srebra."
"Prz25,12": "Jak złoty kolczyk i ozdoba z najczystszego złota jest dla ucha posłusznego ten, który mądrze napomina."
"Prz25,13": "Czym chłód śniegu w dzień żniwa, tym wierny posłaniec dla tych, którzy go posyłają, bo pokrzepia dusze swoich panów."
"Prz25,14": "Człowiek, który się chełpi zwodniczym darem, jest jak chmury i wiatr, lecz bez deszczu."
"Prz25,15": "Cierpliwością można przekonać oblicze władcy, a łagodny język skruszy nawet kość."
"Prz25,16": "Znalazłeś miód? Jedz tyle, ile trzeba, abyś się nie przejadł i nie zwymiotował."
"Prz25,17": "Rzadko stawiaj swoją nogę w domu twojego bliźniego, by się tobą nie przejadł i cię nie znienawidził."
"Prz25,18": "Człowiek składający fałszywe świadectwo przeciw swojemu bliźniemu jest maczugą i mieczem, i ostrą strzałą."
"Prz25,19": "Zaufanie przewrotnemu w dniu ucisku jest jak złamany ząb i zwichnięta noga."
"Prz25,20": "Jak ten, kto zabiera okrycie w zimny dzień i wylewa ocet na saletrę jest ten, kto śpiewa pieśni udręczonemu sercu."
"Prz25,21": "Jeśli twój nieprzyjaciel jest głodny, nakarm go chlebem, a jeśli jest spragniony, napój go wodą;"
"Prz25,22": "Wtedy ty zgarniesz rozżarzone węgle na jego głowę, a JHWH cię nagrodzi."
"Prz25,23": "Północny wiatr rozprasza deszcz, a zagniewane oblicze przepędza zdradliwy język."
"Prz25,24": "Lepiej mieszkać w kącie na dachu niż z kłótliwą żoną we wspólnym domu."
"Prz25,25": "Jak zimna woda dla znużonej duszy, tak dobra wieść z dalekiej ziemi."
"Prz25,26": "Jak zmącone źródło i skażony zdrój, tak sprawiedliwy, który chwiejny jest przed niegodziwym."
"Prz25,27": "Niedobrze jest jeść za dużo miodu, a szukanie własnej chwały nie jest chwałą."
"Prz25,28": "Człowiek, który nie panuje nad swoim duchem, jest miastem zburzonym bez muru."
