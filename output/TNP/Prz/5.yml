"Prz5,1":
  text: "Synu mój, zwróć uwagę na moją mądrość i nakłoń twoje ucho ku mojemu rozumieniu;"
  tags: []
"Prz5,2":
  text: "Abyś potrafił zachować rozwagę i aby twoje wargi strzegły poznania."
  tags: []
"Prz5,3":
  text: "Bo wargi obcej kobiety ociekają miodem, a jej usta są gładsze niż oliwa;"
  tags: []
"Prz5,4":
  text: "Lecz na końcu jest ona gorzka jak piołun i ostra jak miecz obosieczny."
  tags: []
"Prz5,5":
  text: "Jej nogi zstępują do śmierci, jej kroki osiągną Szeol,"
  tags: []
"Prz5,6":
  text: "Abyś nie prostował ścieżki życia, nie wiesz jak chwiejne są jej szlaki."
  tags: []
"Prz5,7":
  text: "Teraz więc synowie, słuchajcie mnie i nie odstępujcie od wypowiedzi moich ust."
  tags: []
"Prz5,8":
  text: "Oddal od niej swoją drogę i nie zbliżaj się do drzwi jej domu;"
  tags: []
"Prz5,9":
  text: "Abyś nie oddał innym twojej chwały, a twoich lat komuś okrutnemu;"
  tags: []
"Prz5,10":
  text: "Aby obcy nie nasycili się twoim mieniem, a twój trud nie został w cudzym domu;"
  tags: []
"Prz5,11":
  text: "I abyś nie jęczał u kresu swoich dni, gdy twoje ciało i mięśnie zwiędną;"
  tags: []
"Prz5,12":
  text: "I nie powiedział: O, jakże nienawidziłem karności a moje serce gardziło upomnieniem!"
  tags: []
"Prz5,13":
  text: "I nie słuchałem głosu moich wychowawców, i nie nakłaniałem mojego ucha ku uczącym mnie!"
  tags: []
"Prz5,14":
  text: "O mało co nie wpadłem we wszelkie nieszczęście wśród społeczności i zgromadzenia."
  tags: []
"Prz5,15":
  text: "Pij wodę z własnej cysterny i wody płynące z twojej studni!"
  tags: []
"Prz5,16":
  text: "Inaczej twoje źródła rozleją się na zewnątrz, a po placach strumienie wód."
  tags: []
"Prz5,17":
  text: "Niech należą do ciebie samego, a nie do obcych wraz z tobą."
  tags: []
"Prz5,18":
  text: "Niech twój zdrój będzie błogosławiony i ciesz się żoną twojej młodości."
  tags: []
"Prz5,19":
  text: "Rozkosznej jak łania i urokliwej jak gazela; niech jej piersi w każdym czasie cię upajają, ciągle bądź odurzony jej miłością."
  tags: []
"Prz5,20":
  text: "Dlaczego, synu mój, masz odurzać się obcą kobietą i obejmować łono cudzej?"
  tags: []
"Prz5,21":
  text: "Bo drogi człowieka są przed oczami JHWH. On bada wszystkie jego szlaki."
  tags: []
"Prz5,22":
  text: "Niegodziwego schwytają jego własne nieprawości i zostanie pochwycony w powrozy swojego grzechu."
  tags: []
"Prz5,23":
  text: "Umrze z braku karności i będzie błądził z powodu swojej wielkiej głupoty."
  tags: []
