"Prz5,1": "Synu mój, zwróć uwagę na moją mądrość i nakłoń twoje ucho ku mojemu rozumieniu;"
"Prz5,2": "Abyś potrafił zachować rozwagę i aby twoje wargi strzegły poznania."
"Prz5,3": "Bo wargi obcej kobiety ociekają miodem, a jej usta są gładsze niż oliwa;"
"Prz5,4": "Lecz na końcu jest ona gorzka jak piołun i ostra jak miecz obosieczny."
"Prz5,5": "Jej nogi zstępują do śmierci, jej kroki osiągną Szeol,"
"Prz5,6": "Abyś nie prostował ścieżki życia, nie wiesz jak chwiejne są jej szlaki."
"Prz5,7": "Teraz więc synowie, słuchajcie mnie i nie odstępujcie od wypowiedzi moich ust."
"Prz5,8": "Oddal od niej swoją drogę i nie zbliżaj się do drzwi jej domu;"
"Prz5,9": "Abyś nie oddał innym twojej chwały, a twoich lat komuś okrutnemu;"
"Prz5,10": "Aby obcy nie nasycili się twoim mieniem, a twój trud nie został w cudzym domu;"
"Prz5,11": "I abyś nie jęczał u kresu swoich dni, gdy twoje ciało i mięśnie zwiędną;"
"Prz5,12": "I nie powiedział: O, jakże nienawidziłem karności a moje serce gardziło upomnieniem!"
"Prz5,13": "I nie słuchałem głosu moich wychowawców, i nie nakłaniałem mojego ucha ku uczącym mnie!"
"Prz5,14": "O mało co nie wpadłem we wszelkie nieszczęście wśród społeczności i zgromadzenia."
"Prz5,15": "Pij wodę z własnej cysterny i wody płynące z twojej studni!"
"Prz5,16": "Inaczej twoje źródła rozleją się na zewnątrz, a po placach strumienie wód."
"Prz5,17": "Niech należą do ciebie samego, a nie do obcych wraz z tobą."
"Prz5,18": "Niech twój zdrój będzie błogosławiony i ciesz się żoną twojej młodości."
"Prz5,19": "Rozkosznej jak łania i urokliwej jak gazela; niech jej piersi w każdym czasie cię upajają, ciągle bądź odurzony jej miłością."
"Prz5,20": "Dlaczego, synu mój, masz odurzać się obcą kobietą i obejmować łono cudzej?"
"Prz5,21": "Bo drogi człowieka są przed oczami JHWH. On bada wszystkie jego szlaki."
"Prz5,22": "Niegodziwego schwytają jego własne nieprawości i zostanie pochwycony w powrozy swojego grzechu."
"Prz5,23": "Umrze z braku karności i będzie błądził z powodu swojej wielkiej głupoty."
