"Prz22,1": "Lepiej jest wybrać dobre imię niż wielkie bogactwo, a przychylność lepsza jest niż srebro i złoto."
"Prz22,2": "Bogaty i ubogi spotykają się; JHWH Stwórcą każdego z nich."
"Prz22,3": "Roztropny dostrzega zło i ukrywa się, ale prości idą dalej i ponoszą karę."
"Prz22,4": "Skutkiem pokory i bojaźni JHWH jest bogactwo, chwała i życie."
"Prz22,5": "Ciernie i sidła są na drodze przewrotnego; kto strzeże swojej duszy, trzyma się od nich z dala."
"Prz22,6": "Pouczaj chłopca stosownie do jego drogi, a gdy się zestarzeje, nie odstąpi od niej."
"Prz22,7": "Bogaty panuje nad ubogimi, a ten, kto pożycza, jest sługą dla człowieka, który mu pożycza."
"Prz22,8": "Kto sieje nieprawość, żnie nieszczęście, a rózga położy kres jego furii."
"Prz22,9": "Kto jest szczodry – ten będzie błogosławiony, bo ofiarowuje swój chleb nędzarzowi."
"Prz22,10": "Wypędź szydercę, a ustanie spór, zakończy się kłótnia i zniewaga."
"Prz22,11": "Kto kocha czystość serca – tego wdzięk warg, zyskuje przyjaźń króla"
"Prz22,12": "Oczy JHWH strzegą pragnących wiedzy i On obala słowa zdrajcy."
"Prz22,13": "Leniwy mówi: Lew chodzi na zewnątrz, będę rozszarpany na środku placu."
"Prz22,14": "Usta obcych kobiet są jak głęboki dół; wpadnie tam ten, na kogo JHWH się gniewa."
"Prz22,15": "Głupota przywiązana jest do serca chłopca, ale rózga karności odsunie ją od niego."
"Prz22,16": "Kto uciska ubogiego, aby siebie wzbogacić, i kto daje bogatemu – z pewnością zubożeje."
"Prz22,17": "Nadstaw swoje ucho i słuchaj słów mędrców, i skłoń swoje serce do przyjęcia mojej wiedzy;"
"Prz22,18": "Bo miło będzie, jeśli zachowasz je w swoim wnętrzu, wszystkie gotowe na twoich wargach."
"Prz22,19": "Byś twoją ufność pokładał w JHWH, to właśnie ci dziś oznajmiłem."
"Prz22,20": "Czyż nie napisałem ci słów pełnych rad i wiedzy;"
"Prz22,21": "Aby oznajmić ci pewność słów prawdy; byś odpowiadał właściwymi słowami temu, kto cię posyła?"
"Prz22,22": "Nie odzieraj nędzarza, dlatego że jest nędzarzem ani nie uciskaj w bramie biednego."
"Prz22,23": "JHWH bowiem będzie bronił ich sprawy i złupi duszę tych, którzy ich łupią."
"Prz22,24": "Nie przyjaźnij się z mężem gniewliwym i nie krocz z człowiekiem porywczym."
"Prz22,25": "Abyś nie nauczył się jego ścieżek i nie zastawił pułapki na swoją duszę."
"Prz22,26": "Nie bądź wśród tych, którzy dają porękę, wśród tych, którzy ręczą za długi;"
"Prz22,27": "Bo jeśli nie będziesz miał czym zapłacić, dlaczego mieliby zabrać spod ciebie łóżko?"
"Prz22,28": "Nie przesuwaj dawnej granicy, którą ustalili twoi ojcowie."
"Prz22,29": "Widzisz człowieka biegłego w swoim zawodzie? Ten będzie stał przed królami, nie stanie przed pospólstwem."
