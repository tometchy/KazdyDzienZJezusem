"Prz9,1": "Mądrość zbudowała swój dom i wyciosała siedem filarów;"
"Prz9,2": "Zabiła swoje bydło, zmieszała swoje wino i zastawiła stół;"
"Prz9,3": "Wysłała swoje służące, woła na wzniesieniach wzgórz miasta:"
"Prz9,4": "Kto prosty, niech tu wstąpi! A do pozbawionego rozumu mówi:"
"Prz9,5": "Chodźcie, jedzcie mój chleb i pijcie wino, które zmieszałam!"
"Prz9,6": "Porzućcie prostactwo i żyjcie, i idźcie drogą roztropności."
"Prz9,7": "Kto upomina szydercę, ściąga na siebie hańbę, a strofujący niegodziwego – jego wadę."
"Prz9,8": "Nie karć szydercy, aby cię nie znienawidził; karć mądrego, a będzie cię miłował."
"Prz9,9": "Daj mądremu, a będzie jeszcze bardziej mądry; udziel wiedzy sprawiedliwemu, a pomnoży swoją umiejętność."
"Prz9,10": "Początkiem mądrości jest bojaźń JHWH, a wiedza świętych to rozum."
"Prz9,11": "Bo dzięki mnie rozmnożą się twoje dni i będą ci dodane lata życia."
"Prz9,12": "Jeśli jesteś mądry, to jesteś mądry dla siebie, a jeśli szydzisz, sam poniesiesz tego skutki."
"Prz9,13": "Pani Głupota jest wrzaskliwa, prostacka i niczego nie rozumie;"
"Prz9,14": "Siedzi u wejścia swojego domu, na tronie, na wzniesieniach miasta;"
"Prz9,15": "Aby wołać na przechodzących drogą, idących prosto swoimi ścieżkami:"
"Prz9,16": "Kto prostak, niech wstąpi; a do pozbawionego rozumu mówi:"
"Prz9,17": "Kradziona woda jest słodka, a chleb potajemnie zdobyty smakuje."
"Prz9,18": "A taki nie wie, że tam jest miejsce cieni zmarłych, że przywołani przez nią kończą w głębinach Szeolu."
