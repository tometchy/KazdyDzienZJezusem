"Prz9,1":
  text: "Mądrość zbudowała swój dom i wyciosała siedem filarów;"
  tags: []
"Prz9,2":
  text: "Zabiła swoje bydło, zmieszała swoje wino i zastawiła stół;"
  tags: []
"Prz9,3":
  text: "Wysłała swoje służące, woła na wzniesieniach wzgórz miasta:"
  tags: []
"Prz9,4":
  text: "Kto prosty, niech tu wstąpi! A do pozbawionego rozumu mówi:"
  tags: []
"Prz9,5":
  text: "Chodźcie, jedzcie mój chleb i pijcie wino, które zmieszałam!"
  tags: []
"Prz9,6":
  text: "Porzućcie prostactwo i żyjcie, i idźcie drogą roztropności."
  tags: []
"Prz9,7":
  text: "Kto upomina szydercę, ściąga na siebie hańbę, a strofujący niegodziwego – jego wadę."
  tags: []
"Prz9,8":
  text: "Nie karć szydercy, aby cię nie znienawidził; karć mądrego, a będzie cię miłował."
  tags: []
"Prz9,9":
  text: "Daj mądremu, a będzie jeszcze bardziej mądry; udziel wiedzy sprawiedliwemu, a pomnoży swoją umiejętność."
  tags: []
"Prz9,10":
  text: "Początkiem mądrości jest bojaźń JHWH, a wiedza świętych to rozum."
  tags: []
"Prz9,11":
  text: "Bo dzięki mnie rozmnożą się twoje dni i będą ci dodane lata życia."
  tags: []
"Prz9,12":
  text: "Jeśli jesteś mądry, to jesteś mądry dla siebie, a jeśli szydzisz, sam poniesiesz tego skutki."
  tags: []
"Prz9,13":
  text: "Pani Głupota jest wrzaskliwa, prostacka i niczego nie rozumie;"
  tags: []
"Prz9,14":
  text: "Siedzi u wejścia swojego domu, na tronie, na wzniesieniach miasta;"
  tags: []
"Prz9,15":
  text: "Aby wołać na przechodzących drogą, idących prosto swoimi ścieżkami:"
  tags: []
"Prz9,16":
  text: "Kto prostak, niech wstąpi; a do pozbawionego rozumu mówi:"
  tags: []
"Prz9,17":
  text: "Kradziona woda jest słodka, a chleb potajemnie zdobyty smakuje."
  tags: []
"Prz9,18":
  text: "A taki nie wie, że tam jest miejsce cieni zmarłych, że przywołani przez nią kończą w głębinach Szeolu."
  tags: []
