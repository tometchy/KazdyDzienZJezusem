"Prz20,1":
  text: "Wino to szyderca, mocny trunek – pieniacz, a każdy, kto od nich się zatacza, jest niemądry."
  tags: []
"Prz20,2":
  text: "Przerażenie, które budzi król, jest jak ryk lwa; kto go rozgniewa, grzeszy przeciwko swojej duszy."
  tags: []
"Prz20,3":
  text: "Chwałą człowieka – zaprzestać sporu, lecz każdy głupiec wybucha."
  tags: []
"Prz20,4":
  text: "Leniwy nie orze jesienią, dlatego będzie szukał plonu w żniwa, a tu nic."
  tags: []
"Prz20,5":
  text: "Plan w sercu człowieka to głęboka woda, lecz człowiek roztropny czerpie z niej."
  tags: []
"Prz20,6":
  text: "Wielu jest ludzi i człowiek rozgłasza swą dobroć, lecz kto znajdzie człowieka godnego zaufania?"
  tags: []
"Prz20,7":
  text: "Sprawiedliwy postępuje uczciwie, błogosławieni są po nim jego synowie."
  tags: []
"Prz20,8":
  text: "Król siedzący na sędziowskim tronie rozprasza swoimi oczami wszystko, co jest złe."
  tags: []
"Prz20,9":
  text: "Kto powie: Oczyściłem swoje serce, jestem czysty od swego grzechu?"
  tags: []
"Prz20,10":
  text: "Dwojakie odważniki i dwojaka efa – obie te rzeczy budzą odrazę w JHWH."
  tags: []
"Prz20,11":
  text: "Nawet młodzieńca daje się poznać po uczynkach, czy jego czyn jest czysty i prawy."
  tags: []
"Prz20,12":
  text: "Ucho, które słyszy i oko, które widzi, zaiste oba uczynił JHWH."
  tags: []
"Prz20,13":
  text: "Nie kochaj spania, byś nie zubożał; otwórz oczy, a nasycisz się chlebem."
  tags: []
"Prz20,14":
  text: "Marne, to marne, mówi nabywca, lecz odchodząc chwali wtedy siebie."
  tags: []
"Prz20,15":
  text: "Istnieje złoto i obfitość pereł, lecz rzeczą cenną są wargi rozumne."
  tags: []
"Prz20,16":
  text: "Zabierz szatę tego, kto ręczył za obcego, ponieważ ręczył za cudzoziemki, zabierz zastaw."
  tags: []
"Prz20,17":
  text: "Smaczny jest dla człowieka chleb podstępnie zdobyty, lecz potem jego usta zostaną napełnione żwirem."
  tags: []
"Prz20,18":
  text: "Plany są utwierdzone dzięki radzie, a wojnę prowadź z doradztwem."
  tags: []
"Prz20,19":
  text: "Plotkarz chodzi i ujawnia tajemnice; nie zadawaj się z tym, który wciąż otwiera usta."
  tags: []
"Prz20,20":
  text: "Kto przeklina swojego ojca lub swoją matkę, tego lampa zgaśnie w najgłębszej ciemności."
  tags: []
"Prz20,21":
  text: "Dziedzictwo chciwie zdobyte na początku nie będzie błogosławione na końcu."
  tags: []
"Prz20,22":
  text: "Nie mów: Odpłacę złem. Czekaj na JHWH, a wybawi cię."
  tags: []
"Prz20,23":
  text: "Dwojakie odważniki budzą odrazę w JHWH, a fałszywe szale nie są dobre."
  tags: []
"Prz20,24":
  text: "Od JHWH zależą kroki mężczyzny; jak ma człowiek zrozumieć własną drogę?"
  tags: []
"Prz20,25":
  text: "Sidłem dla człowieka jest powiedzieć nierozważnie: Święte! i zastanowić się dopiero po złożeniu ślubów."
  tags: []
"Prz20,26":
  text: "Mądry król rozprasza niegodziwych i zwraca w stronę ich koło."
  tags: []
"Prz20,27":
  text: "Duch człowieka jest lampą JHWH, badający wszystkie głębiny wnętrza."
  tags: []
"Prz20,28":
  text: "Miłosierdzie i prawda strzegą króla, a jego tron oparty jest na miłosierdziu."
  tags: []
"Prz20,29":
  text: "Chlubą młodzieńców jest ich siła, a ozdobą starców – sędziwość."
  tags: []
"Prz20,30":
  text: "Sińce i rany służą starciu zła, a razy – oczyszczeniu głębi wnętrza."
  tags: []
