"Prz20,1": "Wino to szyderca, mocny trunek – pieniacz, a każdy, kto od nich się zatacza, jest niemądry."
"Prz20,2": "Przerażenie, które budzi król, jest jak ryk lwa; kto go rozgniewa, grzeszy przeciwko swojej duszy."
"Prz20,3": "Chwałą człowieka – zaprzestać sporu, lecz każdy głupiec wybucha."
"Prz20,4": "Leniwy nie orze jesienią, dlatego będzie szukał plonu w żniwa, a tu nic."
"Prz20,5": "Plan w sercu człowieka to głęboka woda, lecz człowiek roztropny czerpie z niej."
"Prz20,6": "Wielu jest ludzi i człowiek rozgłasza swą dobroć, lecz kto znajdzie człowieka godnego zaufania?"
"Prz20,7": "Sprawiedliwy postępuje uczciwie, błogosławieni są po nim jego synowie."
"Prz20,8": "Król siedzący na sędziowskim tronie rozprasza swoimi oczami wszystko, co jest złe."
"Prz20,9": "Kto powie: Oczyściłem swoje serce, jestem czysty od swego grzechu?"
"Prz20,10": "Dwojakie odważniki i dwojaka efa – obie te rzeczy budzą odrazę w JHWH."
"Prz20,11": "Nawet młodzieńca daje się poznać po uczynkach, czy jego czyn jest czysty i prawy."
"Prz20,12": "Ucho, które słyszy i oko, które widzi, zaiste oba uczynił JHWH."
"Prz20,13": "Nie kochaj spania, byś nie zubożał; otwórz oczy, a nasycisz się chlebem."
"Prz20,14": "Marne, to marne, mówi nabywca, lecz odchodząc chwali wtedy siebie."
"Prz20,15": "Istnieje złoto i obfitość pereł, lecz rzeczą cenną są wargi rozumne."
"Prz20,16": "Zabierz szatę tego, kto ręczył za obcego, ponieważ ręczył za cudzoziemki, zabierz zastaw."
"Prz20,17": "Smaczny jest dla człowieka chleb podstępnie zdobyty, lecz potem jego usta zostaną napełnione żwirem."
"Prz20,18": "Plany są utwierdzone dzięki radzie, a wojnę prowadź z doradztwem."
"Prz20,19": "Plotkarz chodzi i ujawnia tajemnice; nie zadawaj się z tym, który wciąż otwiera usta."
"Prz20,20": "Kto przeklina swojego ojca lub swoją matkę, tego lampa zgaśnie w najgłębszej ciemności."
"Prz20,21": "Dziedzictwo chciwie zdobyte na początku nie będzie błogosławione na końcu."
"Prz20,22": "Nie mów: Odpłacę złem. Czekaj na JHWH, a wybawi cię."
"Prz20,23": "Dwojakie odważniki budzą odrazę w JHWH, a fałszywe szale nie są dobre."
"Prz20,24": "Od JHWH zależą kroki mężczyzny; jak ma człowiek zrozumieć własną drogę?"
"Prz20,25": "Sidłem dla człowieka jest powiedzieć nierozważnie: Święte! i zastanowić się dopiero po złożeniu ślubów."
"Prz20,26": "Mądry król rozprasza niegodziwych i zwraca w stronę ich koło."
"Prz20,27": "Duch człowieka jest lampą JHWH, badający wszystkie głębiny wnętrza."
"Prz20,28": "Miłosierdzie i prawda strzegą króla, a jego tron oparty jest na miłosierdziu."
"Prz20,29": "Chlubą młodzieńców jest ich siła, a ozdobą starców – sędziwość."
"Prz20,30": "Sińce i rany służą starciu zła, a razy – oczyszczeniu głębi wnętrza."
