"Prz14,1": "Mądrość kobiet buduje ich dom, lecz głupota burzy go własnymi rękami."
"Prz14,2": "Kto postępuje w sposób prawy, boi się JHWH, a przewrotny na swoich drogach gardzi Nim."
"Prz14,3": "W ustach głupiego jest rózga pychy, a mądrych strzegą ich wargi."
"Prz14,4": "Gdzie nie ma bydła, tam spichlerze są puste, lecz dzięki sile byków jest obfitość plonów."
"Prz14,5": "Wierny świadek nie kłamie, a fałszywy świadek zionie kłamstwem."
"Prz14,6": "Szyderca szuka mądrości – i nic, lecz rozumnym wiedza przychodzi łatwo."
"Prz14,7": "Odejdź od człowieka głupiego, bo nie zauważysz u niego warg rozumnych."
"Prz14,8": "Mądrość roztropnego to rozumienie swojej drogi, a głupotą głupich jest oszustwo."
"Prz14,9": "Głupcy szydzą z grzechu, a między prawymi panuje życzliwość."
"Prz14,10": "Serce zna gorycz swojej duszy, a obcy nie ma udziału w jego radości."
"Prz14,11": "Dom niegodziwych zostanie zgładzony, a namiot prawych rozkwitnie."
"Prz14,12": "Bywa jakaś droga, która człowiekowi wydaje się słuszna, lecz na końcu okazuje się drogą wiodącą do śmierci."
"Prz14,13": "Nawet w śmiechu serce boli, a końcem tej radości jest smutek."
"Prz14,14": "Serce odstępcy syci się tym, co ma ze swoich dróg, a dobry człowiek tym, co ma ze swoich."
"Prz14,15": "Prosty wierzy każdemu słowu, a roztropny zważa na swoje kroki."
"Prz14,16": "Mądry boi się i odstępuje od zła, ale głupi idąc obok zła jest pewny siebie."
"Prz14,17": "Kto jest skory do gniewu, popełnia głupstwa, a mąż przebiegły jest znienawidzony."
"Prz14,18": "Prości dziedziczą głupotę, a roztropnych wieńczy poznanie."
"Prz14,19": "Źli pokłonią się przed dobrymi, a niegodziwi u bram sprawiedliwego."
"Prz14,20": "Ubogi jest znienawidzony nawet przez swojego przyjaciela, a kochających bogatego jest wielu."
"Prz14,21": "Kto gardzi swoim bliźnim, ten grzeszy, a kto lituje się nad nędznikami, jest szczęśliwy."
"Prz14,22": "Czyż nie błądzą ci, którzy planują zło? Lecz miłosierdzie i prawda są z tymi, którzy planują dobro."
"Prz14,23": "Każda praca przynosi zysk, a puste słowa prowadzą tylko do nędzy."
"Prz14,24": "Koroną mądrych jest ich bogactwo, ale głupota głupich pozostaje głupotą."
"Prz14,25": "Świadek wierny wyzwala dusze, a fałszywy zionie kłamstwem."
"Prz14,26": "W bojaźni JHWH jest silna ufność, a dla synów jego będzie On schronieniem."
"Prz14,27": "Bojaźń JHWH jest źródłem życia, by uniknąć sideł śmierci."
"Prz14,28": "Liczny lud jest chwałą króla, a brak ludzi to zguba władcy."
"Prz14,29": "Nieskory do gniewu ma wiele roztropności, lecz niecierpliwy duchem wywyższa głupotę."
"Prz14,30": "Spokojne serce jest życiem ciała, a zazdrość jest zgnilizną kości."
"Prz14,31": "Kto gnębi ubogiego, uwłacza jego Stwórcy, a czci Go ten, kto lituje się nad potrzebującym."
"Prz14,32": "Niegodziwy zostaje powalony przez swoje zło, a sprawiedliwy ma nadzieję nawet w czasie swojej śmierci."
"Prz14,33": "Mądrość spoczywa w sercu rozumnego i wśród głupców staje się znana."
"Prz14,34": "Sprawiedliwość wywyższa naród, a grzech jest hańbą narodów."
"Prz14,35": "Król jest przychylny roztropnemu słudze, lecz gniew spadnie na przynoszącego wstyd."
