"Prz14,1":
  text: "Mądrość kobiet buduje ich dom, lecz głupota burzy go własnymi rękami."
  tags: []
"Prz14,2":
  text: "Kto postępuje w sposób prawy, boi się JHWH, a przewrotny na swoich drogach gardzi Nim."
  tags: []
"Prz14,3":
  text: "W ustach głupiego jest rózga pychy, a mądrych strzegą ich wargi."
  tags: []
"Prz14,4":
  text: "Gdzie nie ma bydła, tam spichlerze są puste, lecz dzięki sile byków jest obfitość plonów."
  tags: []
"Prz14,5":
  text: "Wierny świadek nie kłamie, a fałszywy świadek zionie kłamstwem."
  tags: []
"Prz14,6":
  text: "Szyderca szuka mądrości – i nic, lecz rozumnym wiedza przychodzi łatwo."
  tags: []
"Prz14,7":
  text: "Odejdź od człowieka głupiego, bo nie zauważysz u niego warg rozumnych."
  tags: []
"Prz14,8":
  text: "Mądrość roztropnego to rozumienie swojej drogi, a głupotą głupich jest oszustwo."
  tags: []
"Prz14,9":
  text: "Głupcy szydzą z grzechu, a między prawymi panuje życzliwość."
  tags: []
"Prz14,10":
  text: "Serce zna gorycz swojej duszy, a obcy nie ma udziału w jego radości."
  tags: []
"Prz14,11":
  text: "Dom niegodziwych zostanie zgładzony, a namiot prawych rozkwitnie."
  tags: []
"Prz14,12":
  text: "Bywa jakaś droga, która człowiekowi wydaje się słuszna, lecz na końcu okazuje się drogą wiodącą do śmierci."
  tags: []
"Prz14,13":
  text: "Nawet w śmiechu serce boli, a końcem tej radości jest smutek."
  tags: []
"Prz14,14":
  text: "Serce odstępcy syci się tym, co ma ze swoich dróg, a dobry człowiek tym, co ma ze swoich."
  tags: []
"Prz14,15":
  text: "Prosty wierzy każdemu słowu, a roztropny zważa na swoje kroki."
  tags: []
"Prz14,16":
  text: "Mądry boi się i odstępuje od zła, ale głupi idąc obok zła jest pewny siebie."
  tags: []
"Prz14,17":
  text: "Kto jest skory do gniewu, popełnia głupstwa, a mąż przebiegły jest znienawidzony."
  tags: []
"Prz14,18":
  text: "Prości dziedziczą głupotę, a roztropnych wieńczy poznanie."
  tags: []
"Prz14,19":
  text: "Źli pokłonią się przed dobrymi, a niegodziwi u bram sprawiedliwego."
  tags: []
"Prz14,20":
  text: "Ubogi jest znienawidzony nawet przez swojego przyjaciela, a kochających bogatego jest wielu."
  tags: []
"Prz14,21":
  text: "Kto gardzi swoim bliźnim, ten grzeszy, a kto lituje się nad nędznikami, jest szczęśliwy."
  tags: []
"Prz14,22":
  text: "Czyż nie błądzą ci, którzy planują zło? Lecz miłosierdzie i prawda są z tymi, którzy planują dobro."
  tags: []
"Prz14,23":
  text: "Każda praca przynosi zysk, a puste słowa prowadzą tylko do nędzy."
  tags: []
"Prz14,24":
  text: "Koroną mądrych jest ich bogactwo, ale głupota głupich pozostaje głupotą."
  tags: []
"Prz14,25":
  text: "Świadek wierny wyzwala dusze, a fałszywy zionie kłamstwem."
  tags: []
"Prz14,26":
  text: "W bojaźni JHWH jest silna ufność, a dla synów jego będzie On schronieniem."
  tags: []
"Prz14,27":
  text: "Bojaźń JHWH jest źródłem życia, by uniknąć sideł śmierci."
  tags: []
"Prz14,28":
  text: "Liczny lud jest chwałą króla, a brak ludzi to zguba władcy."
  tags: []
"Prz14,29":
  text: "Nieskory do gniewu ma wiele roztropności, lecz niecierpliwy duchem wywyższa głupotę."
  tags: []
"Prz14,30":
  text: "Spokojne serce jest życiem ciała, a zazdrość jest zgnilizną kości."
  tags: []
"Prz14,31":
  text: "Kto gnębi ubogiego, uwłacza jego Stwórcy, a czci Go ten, kto lituje się nad potrzebującym."
  tags: []
"Prz14,32":
  text: "Niegodziwy zostaje powalony przez swoje zło, a sprawiedliwy ma nadzieję nawet w czasie swojej śmierci."
  tags: []
"Prz14,33":
  text: "Mądrość spoczywa w sercu rozumnego i wśród głupców staje się znana."
  tags: []
"Prz14,34":
  text: "Sprawiedliwość wywyższa naród, a grzech jest hańbą narodów."
  tags: []
"Prz14,35":
  text: "Król jest przychylny roztropnemu słudze, lecz gniew spadnie na przynoszącego wstyd."
  tags: []
