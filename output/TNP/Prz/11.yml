"Prz11,1":
  text: "Fałszywe szale budzą w JHWH odrazę, ale podoba Mu się pełny odważnik."
  tags: []
"Prz11,2":
  text: "Przyszła pycha, to przyjdzie hańba, a u pokornych jest mądrość."
  tags: []
"Prz11,3":
  text: "Uczciwość prowadzi prawych, lecz przewrotność postępujących zdradliwie zgubi ich."
  tags: []
"Prz11,4":
  text: "Bogactwo nie przyniesie korzyści w dniu gniewu, ale sprawiedliwość ocala od śmierci."
  tags: []
"Prz11,5":
  text: "Sprawiedliwość nienagannego prostuje jego drogę, a niegodziwy upadnie przez swoją niegodziwość."
  tags: []
"Prz11,6":
  text: "Sprawiedliwość prawych ocali ich, a postępujący zdradliwie zostaną schwytani we własne żądze."
  tags: []
"Prz11,7":
  text: "Gdy umiera człowiek niegodziwy, ginie jego nadzieja, a oczekiwanie niesprawiedliwych znika."
  tags: []
"Prz11,8":
  text: "Sprawiedliwy został wybawiony z ucisku, a jego miejsce zajmuje niegodziwy."
  tags: []
"Prz11,9":
  text: "Obłudnik ustami niszczy swojego przyjaciela, a sprawiedliwi zostają wybawieni dzięki poznaniu."
  tags: []
"Prz11,10":
  text: "Gdy sprawiedliwym się powodzi, miasto się cieszy, a gdy giną niegodziwi, ludzie wykrzykują z radości."
  tags: []
"Prz11,11":
  text: "Dzięki błogosławieństwu prawych podnosi się miasto, a przez usta niegodziwych zostanie zburzone."
  tags: []
"Prz11,12":
  text: "Nierozumny gardzi swoim bliźnim, lecz mąż roztropny milczy."
  tags: []
"Prz11,13":
  text: "Plotkarz chodzi i wyjawia tajemnice, lecz człowiek wiernego ducha ukrywa sprawę."
  tags: []
"Prz11,14":
  text: "Gdzie nie ma mądrej rady, tam lud upada, a gdzie wielu doradców, tam jest wybawienie."
  tags: []
"Prz11,15":
  text: "Nikczemnik wyrządza sobie krzywdę kiedy ręczy za obcego, a kto nienawidzi poręki, jest bezpieczny."
  tags: []
"Prz11,16":
  text: "Kobieta pełna wdzięku dostępuje chwały, a tyrani zdobywają bogactwa."
  tags: []
"Prz11,17":
  text: "Człowiek miłosierny troszczy się o swoją duszę, a okrutny dręczy własne ciało."
  tags: []
"Prz11,18":
  text: "Niegodziwy zdobywa złudne wynagrodzenie, a kto sieje sprawiedliwość, ma pewną zapłatę."
  tags: []
"Prz11,19":
  text: "Jak sprawiedliwość prowadzi do życia, tak goniący za złem do śmierci."
  tags: []
"Prz11,20":
  text: "Serce przewrotne budzi w JHWH odrazę, a podoba Mu się droga prawych."
  tags: []
"Prz11,21":
  text: "Ręką za rękę. Zły nie zostanie uniewinniony, lecz potomstwo sprawiedliwych zostanie ocalone."
  tags: []
"Prz11,22":
  text: "Czym złoty kolczyk w nozdrzach świni, tym piękna kobieta lecz pozbawiona rozeznania."
  tags: []
"Prz11,23":
  text: "Pragnieniem sprawiedliwych jest samo dobro, a oczekiwaniem niegodziwych gniew."
  tags: []
"Prz11,24":
  text: "Jeden jest hojny, a jest mu ciągle dodawane, drugi nad miarę oszczędza, lecz ubożeje."
  tags: []
"Prz11,25":
  text: "Dusza, która błogosławi dozna pokrzepienia, a kto innych poi, on też będzie nawodniony."
  tags: []
"Prz11,26":
  text: "Kto zatrzymuje zboże, tego lud przeklina, a błogosławieństwo będzie nad głową tego, który je sprzedaje."
  tags: []
"Prz11,27":
  text: "Kto pilnie szuka dobra, szuka przychylności, lecz kto szuka zła, przyjdzie ono na niego."
  tags: []
"Prz11,28":
  text: "Kto pokłada ufność w swoim bogactwie, ten upadnie, a sprawiedliwi rozwiną się jak liść."
  tags: []
"Prz11,29":
  text: "Kto niepokoi swój dom, odziedziczy wiatr, a głupi jest sługą człowieka o mądrym sercu."
  tags: []
"Prz11,30":
  text: "Owoc sprawiedliwego jest drzewem życia, a kto zdobywa dusze, jest mądry."
  tags: []
"Prz11,31":
  text: "Jeśli sprawiedliwy otrzyma zapłatę na ziemi, to tym bardziej niegodziwy i grzesznik."
  tags: []
