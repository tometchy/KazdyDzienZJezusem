"Prz11,1": "Fałszywe szale budzą w JHWH odrazę, ale podoba Mu się pełny odważnik."
"Prz11,2": "Przyszła pycha, to przyjdzie hańba, a u pokornych jest mądrość."
"Prz11,3": "Uczciwość prowadzi prawych, lecz przewrotność postępujących zdradliwie zgubi ich."
"Prz11,4": "Bogactwo nie przyniesie korzyści w dniu gniewu, ale sprawiedliwość ocala od śmierci."
"Prz11,5": "Sprawiedliwość nienagannego prostuje jego drogę, a niegodziwy upadnie przez swoją niegodziwość."
"Prz11,6": "Sprawiedliwość prawych ocali ich, a postępujący zdradliwie zostaną schwytani we własne żądze."
"Prz11,7": "Gdy umiera człowiek niegodziwy, ginie jego nadzieja, a oczekiwanie niesprawiedliwych znika."
"Prz11,8": "Sprawiedliwy został wybawiony z ucisku, a jego miejsce zajmuje niegodziwy."
"Prz11,9": "Obłudnik ustami niszczy swojego przyjaciela, a sprawiedliwi zostają wybawieni dzięki poznaniu."
"Prz11,10": "Gdy sprawiedliwym się powodzi, miasto się cieszy, a gdy giną niegodziwi, ludzie wykrzykują z radości."
"Prz11,11": "Dzięki błogosławieństwu prawych podnosi się miasto, a przez usta niegodziwych zostanie zburzone."
"Prz11,12": "Nierozumny gardzi swoim bliźnim, lecz mąż roztropny milczy."
"Prz11,13": "Plotkarz chodzi i wyjawia tajemnice, lecz człowiek wiernego ducha ukrywa sprawę."
"Prz11,14": "Gdzie nie ma mądrej rady, tam lud upada, a gdzie wielu doradców, tam jest wybawienie."
"Prz11,15": "Nikczemnik wyrządza sobie krzywdę kiedy ręczy za obcego, a kto nienawidzi poręki, jest bezpieczny."
"Prz11,16": "Kobieta pełna wdzięku dostępuje chwały, a tyrani zdobywają bogactwa."
"Prz11,17": "Człowiek miłosierny troszczy się o swoją duszę, a okrutny dręczy własne ciało."
"Prz11,18": "Niegodziwy zdobywa złudne wynagrodzenie, a kto sieje sprawiedliwość, ma pewną zapłatę."
"Prz11,19": "Jak sprawiedliwość prowadzi do życia, tak goniący za złem do śmierci."
"Prz11,20": "Serce przewrotne budzi w JHWH odrazę, a podoba Mu się droga prawych."
"Prz11,21": "Ręką za rękę. Zły nie zostanie uniewinniony, lecz potomstwo sprawiedliwych zostanie ocalone."
"Prz11,22": "Czym złoty kolczyk w nozdrzach świni, tym piękna kobieta lecz pozbawiona rozeznania."
"Prz11,23": "Pragnieniem sprawiedliwych jest samo dobro, a oczekiwaniem niegodziwych gniew."
"Prz11,24": "Jeden jest hojny, a jest mu ciągle dodawane, drugi nad miarę oszczędza, lecz ubożeje."
"Prz11,25": "Dusza, która błogosławi dozna pokrzepienia, a kto innych poi, on też będzie nawodniony."
"Prz11,26": "Kto zatrzymuje zboże, tego lud przeklina, a błogosławieństwo będzie nad głową tego, który je sprzedaje."
"Prz11,27": "Kto pilnie szuka dobra, szuka przychylności, lecz kto szuka zła, przyjdzie ono na niego."
"Prz11,28": "Kto pokłada ufność w swoim bogactwie, ten upadnie, a sprawiedliwi rozwiną się jak liść."
"Prz11,29": "Kto niepokoi swój dom, odziedziczy wiatr, a głupi jest sługą człowieka o mądrym sercu."
"Prz11,30": "Owoc sprawiedliwego jest drzewem życia, a kto zdobywa dusze, jest mądry."
"Prz11,31": "Jeśli sprawiedliwy otrzyma zapłatę na ziemi, to tym bardziej niegodziwy i grzesznik."
