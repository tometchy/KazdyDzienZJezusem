"Prz1,1":
  text: "Przysłowia Salomona, syna Dawida, króla Izraela;"
  tags: []
"Prz1,2":
  text: "By poznać mądrość i karność, by zrozumiano słowa roztropne;"
  tags: []
"Prz1,3":
  text: "By wziąć pouczenie, aby postępować rozważnie, w sprawiedliwości, sądzie i prawości;"
  tags: []
"Prz1,4":
  text: "Do udzielenia prostym rozwagi, a młodym poznania i roztropności."
  tags: []
"Prz1,5":
  text: "Mądry niech słucha i pomnaża naukę, a rozumny niech nabywa mądrych rad;"
  tags: []
"Prz1,6":
  text: "By rozumieć przysłowia i ich wykładnię, słowa mądrych i ich zagadki."
  tags: []
"Prz1,7":
  text: "Bojaźń JHWH jest początkiem poznania; głupcy gardzą mądrością i karnością."
  tags: []
"Prz1,8":
  text: "Synu mój, słuchaj napomnienia swojego ojca i nie odrzucaj nauki swojej matki;"
  tags: []
"Prz1,9":
  text: "Bo one są wdzięcznym wieńcem na twojej głowie i naszyjnikiem na szyi."
  tags: []
"Prz1,10":
  text: "Synu mój, jeśli grzesznicy cię namawiają, nie ulegaj."
  tags: []
"Prz1,11":
  text: "Jeśli powiedzą: Chodź z nami, czyhajmy na krew, zaczajmy się na niewinnego bez powodu;"
  tags: []
"Prz1,12":
  text: "Połknijmy ich żywcem jak Szeol, całych, jak zstępujących do dołu;"
  tags: []
"Prz1,13":
  text: "Znajdziemy wszelkie kosztowności, napełnimy swoje domy łupem;"
  tags: []
"Prz1,14":
  text: "Rzuć swój los pomiędzy nami; miejmy wszyscy jedną sakiewkę."
  tags: []
"Prz1,15":
  text: "Synu mój, nie wyruszaj z nimi w drogę; powstrzymaj od ich ścieżki swoją nogę."
  tags: []
"Prz1,16":
  text: "Bo ich nogi biegną do zła i spieszą, by przelać krew."
  tags: []
"Prz1,17":
  text: "Lecz na próżno zastawia się sieci na oczach wszelkiego ptactwa."
  tags: []
"Prz1,18":
  text: "Oni też czyhając na krew, czają się na własne dusze."
  tags: []
"Prz1,19":
  text: "Takie są ścieżki każdego, który jest chciwy niegodziwego zysku; swoim właścicielom taki zysk odbiera życie."
  tags: []
"Prz1,20":
  text: "Mądrość głośno woła na zewnątrz, podnosi swój głos na placach."
  tags: []
"Prz1,21":
  text: "Woła w największym zgiełku, u wejścia do bram, w mieście wygłasza swoje mowy:"
  tags: []
"Prz1,22":
  text: "Jak długo, prości, będziecie kochać prostactwo, szydzący – mieć upodobanie w swoim szyderstwie, a głupi – nienawidzić wiedzy?"
  tags: []
"Prz1,23":
  text: "Zawróćcie do moich upomnień; oto wylewam przed wami mojego ducha i oznajmiam wam moje słowa."
  tags: []
"Prz1,24":
  text: "Ponieważ wołałam, a odmawialiście mi; wyciągałam rękę, a nikt nie zważał;"
  tags: []
"Prz1,25":
  text: "I odrzuciliście wszelką moją radę, i nie chcieliście uznać mojego upomnienia;"
  tags: []
"Prz1,26":
  text: "Dlatego i ja będę się śmiać z waszego nieszczęścia, będę drwić z was, gdy przyjdzie na was trwoga."
  tags: []
"Prz1,27":
  text: "Gdy nadejdzie jak burza na was trwoga, i gdy wasze nieszczęście nadciągnie jak wicher, gdy nadejdzie na was ucisk i cierpienie;"
  tags: []
"Prz1,28":
  text: "Wtedy będą mnie wzywać, a nie odpowiem; będą mnie szukać pilnie, lecz mnie nie znajdą."
  tags: []
"Prz1,29":
  text: "Dlatego że znienawidzili poznanie i nie wybrali bojaźni JHWH;"
  tags: []
"Prz1,30":
  text: "I nie chcieli mojej rady, ale gardzili każdym moim upomnieniem."
  tags: []
"Prz1,31":
  text: "Dlatego będą jedli z owocu swojej drogi i będą nasyceni swoimi zamysłami."
  tags: []
"Prz1,32":
  text: "Bo odstępstwo prostych ich zabija, a niefrasobliwość głupich gubi ich."
  tags: []
"Prz1,33":
  text: "Ale kto mnie słucha, będzie mieszkać bezpiecznie i będzie wolny od strachu przed złem."
  tags: []
