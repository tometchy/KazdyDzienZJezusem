"Prz1,1": "Przysłowia Salomona, syna Dawida, króla Izraela;"
"Prz1,2": "By poznać mądrość i karność, by zrozumiano słowa roztropne;"
"Prz1,3": "By wziąć pouczenie, aby postępować rozważnie, w sprawiedliwości, sądzie i prawości;"
"Prz1,4": "Do udzielenia prostym rozwagi, a młodym poznania i roztropności."
"Prz1,5": "Mądry niech słucha i pomnaża naukę, a rozumny niech nabywa mądrych rad;"
"Prz1,6": "By rozumieć przysłowia i ich wykładnię, słowa mądrych i ich zagadki."
"Prz1,7": "Bojaźń JHWH jest początkiem poznania; głupcy gardzą mądrością i karnością."
"Prz1,8": "Synu mój, słuchaj napomnienia swojego ojca i nie odrzucaj nauki swojej matki;"
"Prz1,9": "Bo one są wdzięcznym wieńcem na twojej głowie i naszyjnikiem na szyi."
"Prz1,10": "Synu mój, jeśli grzesznicy cię namawiają, nie ulegaj."
"Prz1,11": "Jeśli powiedzą: Chodź z nami, czyhajmy na krew, zaczajmy się na niewinnego bez powodu;"
"Prz1,12": "Połknijmy ich żywcem jak Szeol, całych, jak zstępujących do dołu;"
"Prz1,13": "Znajdziemy wszelkie kosztowności, napełnimy swoje domy łupem;"
"Prz1,14": "Rzuć swój los pomiędzy nami; miejmy wszyscy jedną sakiewkę."
"Prz1,15": "Synu mój, nie wyruszaj z nimi w drogę; powstrzymaj od ich ścieżki swoją nogę."
"Prz1,16": "Bo ich nogi biegną do zła i spieszą, by przelać krew."
"Prz1,17": "Lecz na próżno zastawia się sieci na oczach wszelkiego ptactwa."
"Prz1,18": "Oni też czyhając na krew, czają się na własne dusze."
"Prz1,19": "Takie są ścieżki każdego, który jest chciwy niegodziwego zysku; swoim właścicielom taki zysk odbiera życie."
"Prz1,20": "Mądrość głośno woła na zewnątrz, podnosi swój głos na placach."
"Prz1,21": "Woła w największym zgiełku, u wejścia do bram, w mieście wygłasza swoje mowy:"
"Prz1,22": "Jak długo, prości, będziecie kochać prostactwo, szydzący – mieć upodobanie w swoim szyderstwie, a głupi – nienawidzić wiedzy?"
"Prz1,23": "Zawróćcie do moich upomnień; oto wylewam przed wami mojego ducha i oznajmiam wam moje słowa."
"Prz1,24": "Ponieważ wołałam, a odmawialiście mi; wyciągałam rękę, a nikt nie zważał;"
"Prz1,25": "I odrzuciliście wszelką moją radę, i nie chcieliście uznać mojego upomnienia;"
"Prz1,26": "Dlatego i ja będę się śmiać z waszego nieszczęścia, będę drwić z was, gdy przyjdzie na was trwoga."
"Prz1,27": "Gdy nadejdzie jak burza na was trwoga, i gdy wasze nieszczęście nadciągnie jak wicher, gdy nadejdzie na was ucisk i cierpienie;"
"Prz1,28": "Wtedy będą mnie wzywać, a nie odpowiem; będą mnie szukać pilnie, lecz mnie nie znajdą."
"Prz1,29": "Dlatego że znienawidzili poznanie i nie wybrali bojaźni JHWH;"
"Prz1,30": "I nie chcieli mojej rady, ale gardzili każdym moim upomnieniem."
"Prz1,31": "Dlatego będą jedli z owocu swojej drogi i będą nasyceni swoimi zamysłami."
"Prz1,32": "Bo odstępstwo prostych ich zabija, a niefrasobliwość głupich gubi ich."
"Prz1,33": "Ale kto mnie słucha, będzie mieszkać bezpiecznie i będzie wolny od strachu przed złem."
