"Prz23,1": "Gdy usiądziesz by jeść z władcą, dobrze rozważ, kogo masz przed sobą;"
"Prz23,2": "I przyłóż nóż do gardła, jeśli ty jesteś mężem łapczywym."
"Prz23,3": "Nie pożądaj jego przysmaków, bo to potrawy zwodnicze."
"Prz23,4": "Nie trudź się, by zdobyć bogactwo, poniechaj tego z własnego rozsądku."
"Prz23,5": "Gdy sprawiasz, że twoje oczy ulatują do niego, to już go nie ma? Bo z pewnością uczyni sobie skrzydła i odleci ku niebu jak orzeł."
"Prz23,6": "Nie jedz chleba człowieka chciwego, ani nie pożądaj jego przysmaków."
"Prz23,7": "Bo jak rachuje w swojej duszy, taki on jest. Mówi do ciebie – jedz i pij, ale jego serce nie jest z tobą."
"Prz23,8": "Kęs twój, który zjadłeś, zwymiotujesz i zniszczysz swoje miłe słowa."
"Prz23,9": "Nie mów do uszu głupca, bo wzgardzi roztropnością twoich wypowiedzi."
"Prz23,10": "Nie przesuwaj dawnej granicy i nie wkraczaj na pole sierot."
"Prz23,11": "Bo ich Odkupiciel jest mocny i On będzie prowadził ich spór przeciwko tobie."
"Prz23,12": "Nakłoń swoje serce na pouczenie, a swoje uszy na słowa rozumne."
"Prz23,13": "Nie szczędź chłopcu karcenia, bo jeśli go uderzysz rózgą, nie umrze."
"Prz23,14": "Ty uderzysz go rózgą, a jego duszę ocalisz od Szeolu."
"Prz23,15": "Synu mój, gdy twoje serce jest mądre, także i moje serce się raduje;"
"Prz23,16": "I moje nerki weselą się, gdy twoje usta mówią to, co prawe."
"Prz23,17": "Niech twe serce nie zazdrości grzesznikom, lecz raczej niech każdego dnia trwa w bojaźni JHWH;"
"Prz23,18": "Bo na pewno jest dla ciebie przyszłość i twoja nadzieja nie zostanie zawiedziona."
"Prz23,19": "Słuchaj, synu mój, i bądź mądrym, i skieruj swoje serce na prostą drogę."
"Prz23,20": "Nie bywaj wśród upijających się winem ani wśród obżerających się ich mięsem;"
"Prz23,21": "Bo pijak i żarłok zubożeją, a ospały będzie odziany w łachmany."
"Prz23,22": "Słuchaj ojca, który cię spłodził, i nie gardź matką, gdy się zestarzeje."
"Prz23,23": "Kupuj prawdę i nie sprzedawaj jej; kupuj mądrość, karność i rozum."
"Prz23,24": "Ojciec sprawiedliwego raduje się niezmiernie, a kto spłodził mądrego, ma z niego ogromną radość."
"Prz23,25": "Niech się raduje twój ojciec i twoja matka, a niech unosi się radością ta, która cię urodziła."
"Prz23,26": "Synu mój, daj mi swoje serce, a niech twoje oczy upodobają sobie moje drogi."
"Prz23,27": "Bo nierządnica jest głębokim dołem, a obca kobieta jest ciasną studnią."
"Prz23,28": "Ona też czai się jak na łup i pomnaża przewrotnych wśród mężczyzn."
"Prz23,29": "U kogo: Biada!? U kogo: Ach!? U kogo kłótnie!? U kogo niepokój!? U kogo rany bez powodu!? U kogo zaczerwienione oczy!?"
"Prz23,30": "U tych, którzy przesiadują przy winie, którzy schodzą się w poszukiwaniu winnej mieszaniny."
"Prz23,31": "Nie patrz na wino, gdy się czerwieni, gdy daje swój blask w kielichu, i jak gładko spływa do gardła."
"Prz23,32": "Na koniec ukąsi jak wąż i ukąsi jak żmija;"
"Prz23,33": "Twoje oczy będą widzieć dziwne rzeczy, a twoje serce będzie mówiło rzeczy przewrotne;"
"Prz23,34": "I będziesz jak leżący w sercu morza, i jak ten, który śpi na szczycie masztu;"
"Prz23,35": "Powiesz: Bili mnie, a nie poczułem się słabo, uderzyli mnie, a o tym nie wiedziałem. Gdy się obudzę, tym bardziej będę go szukał."
