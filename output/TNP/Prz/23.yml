"Prz23,1":
  text: "Gdy usiądziesz by jeść z władcą, dobrze rozważ, kogo masz przed sobą;"
  tags: []
"Prz23,2":
  text: "I przyłóż nóż do gardła, jeśli ty jesteś mężem łapczywym."
  tags: []
"Prz23,3":
  text: "Nie pożądaj jego przysmaków, bo to potrawy zwodnicze."
  tags: []
"Prz23,4":
  text: "Nie trudź się, by zdobyć bogactwo, poniechaj tego z własnego rozsądku."
  tags: []
"Prz23,5":
  text: "Gdy sprawiasz, że twoje oczy ulatują do niego, to już go nie ma? Bo z pewnością uczyni sobie skrzydła i odleci ku niebu jak orzeł."
  tags: []
"Prz23,6":
  text: "Nie jedz chleba człowieka chciwego, ani nie pożądaj jego przysmaków."
  tags: []
"Prz23,7":
  text: "Bo jak rachuje w swojej duszy, taki on jest. Mówi do ciebie – jedz i pij, ale jego serce nie jest z tobą."
  tags: []
"Prz23,8":
  text: "Kęs twój, który zjadłeś, zwymiotujesz i zniszczysz swoje miłe słowa."
  tags: []
"Prz23,9":
  text: "Nie mów do uszu głupca, bo wzgardzi roztropnością twoich wypowiedzi."
  tags: []
"Prz23,10":
  text: "Nie przesuwaj dawnej granicy i nie wkraczaj na pole sierot."
  tags: []
"Prz23,11":
  text: "Bo ich Odkupiciel jest mocny i On będzie prowadził ich spór przeciwko tobie."
  tags: []
"Prz23,12":
  text: "Nakłoń swoje serce na pouczenie, a swoje uszy na słowa rozumne."
  tags: []
"Prz23,13":
  text: "Nie szczędź chłopcu karcenia, bo jeśli go uderzysz rózgą, nie umrze."
  tags: []
"Prz23,14":
  text: "Ty uderzysz go rózgą, a jego duszę ocalisz od Szeolu."
  tags: []
"Prz23,15":
  text: "Synu mój, gdy twoje serce jest mądre, także i moje serce się raduje;"
  tags: []
"Prz23,16":
  text: "I moje nerki weselą się, gdy twoje usta mówią to, co prawe."
  tags: []
"Prz23,17":
  text: "Niech twe serce nie zazdrości grzesznikom, lecz raczej niech każdego dnia trwa w bojaźni JHWH;"
  tags: []
"Prz23,18":
  text: "Bo na pewno jest dla ciebie przyszłość i twoja nadzieja nie zostanie zawiedziona."
  tags: []
"Prz23,19":
  text: "Słuchaj, synu mój, i bądź mądrym, i skieruj swoje serce na prostą drogę."
  tags: []
"Prz23,20":
  text: "Nie bywaj wśród upijających się winem ani wśród obżerających się ich mięsem;"
  tags: []
"Prz23,21":
  text: "Bo pijak i żarłok zubożeją, a ospały będzie odziany w łachmany."
  tags: []
"Prz23,22":
  text: "Słuchaj ojca, który cię spłodził, i nie gardź matką, gdy się zestarzeje."
  tags: []
"Prz23,23":
  text: "Kupuj prawdę i nie sprzedawaj jej; kupuj mądrość, karność i rozum."
  tags: []
"Prz23,24":
  text: "Ojciec sprawiedliwego raduje się niezmiernie, a kto spłodził mądrego, ma z niego ogromną radość."
  tags: []
"Prz23,25":
  text: "Niech się raduje twój ojciec i twoja matka, a niech unosi się radością ta, która cię urodziła."
  tags: []
"Prz23,26":
  text: "Synu mój, daj mi swoje serce, a niech twoje oczy upodobają sobie moje drogi."
  tags: []
"Prz23,27":
  text: "Bo nierządnica jest głębokim dołem, a obca kobieta jest ciasną studnią."
  tags: []
"Prz23,28":
  text: "Ona też czai się jak na łup i pomnaża przewrotnych wśród mężczyzn."
  tags: []
"Prz23,29":
  text: "U kogo: Biada!? U kogo: Ach!? U kogo kłótnie!? U kogo niepokój!? U kogo rany bez powodu!? U kogo zaczerwienione oczy!?"
  tags: []
"Prz23,30":
  text: "U tych, którzy przesiadują przy winie, którzy schodzą się w poszukiwaniu winnej mieszaniny."
  tags: []
"Prz23,31":
  text: "Nie patrz na wino, gdy się czerwieni, gdy daje swój blask w kielichu, i jak gładko spływa do gardła."
  tags: []
"Prz23,32":
  text: "Na koniec ukąsi jak wąż i ukąsi jak żmija;"
  tags: []
"Prz23,33":
  text: "Twoje oczy będą widzieć dziwne rzeczy, a twoje serce będzie mówiło rzeczy przewrotne;"
  tags: []
"Prz23,34":
  text: "I będziesz jak leżący w sercu morza, i jak ten, który śpi na szczycie masztu;"
  tags: []
"Prz23,35":
  text: "Powiesz: Bili mnie, a nie poczułem się słabo, uderzyli mnie, a o tym nie wiedziałem. Gdy się obudzę, tym bardziej będę go szukał."
  tags: []
