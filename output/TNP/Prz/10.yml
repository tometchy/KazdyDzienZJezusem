"Prz10,1":
  text: "Przysłowia Salomona. Mądry syn sprawia ojcu radość, a głupi syn jest zgryzotą swojej matki."
  tags: []
"Prz10,2":
  text: "Nie przynoszą korzyści skarby zgromadzone niegodziwie, lecz sprawiedliwość uwalnia od śmierci."
  tags: []
"Prz10,3":
  text: "JHWH nie pozwoli, by dusza sprawiedliwego głodowała, a żądze niegodziwych odtrąci."
  tags: []
"Prz10,4":
  text: "Leniwa ręka prowadzi do nędzy, a ręka pilnych zdobywa bogactwa."
  tags: []
"Prz10,5":
  text: "Kto zbiera w lecie, jest synem roztropnym; syn, który śpi w czasie żniwa, postępuje haniebnie."
  tags: []
"Prz10,6":
  text: "Błogosławieństwa spływają na głowę sprawiedliwego, a usta niegodziwych skrywają gwałt."
  tags: []
"Prz10,7":
  text: "Pamięć o sprawiedliwym jest błogosławieństwem, a imię niegodziwych zgnije."
  tags: []
"Prz10,8":
  text: "Człowiek mądrego serca przyjmuje przykazania, a głupiec przez swoje wargi upadnie."
  tags: []
"Prz10,9":
  text: "Kto kroczy uczciwie, kroczy bezpiecznie, a kto jest przewrotny w swoich drogach, zostanie ujawniony."
  tags: []
"Prz10,10":
  text: "Kto mruga okiem, powoduje ból, a głupiec przez swoje wargi upadnie."
  tags: []
"Prz10,11":
  text: "Usta sprawiedliwego są źródłem życia, a usta niegodziwych skrywają gwałt."
  tags: []
"Prz10,12":
  text: "Nienawiść wznieca kłótnie, a miłość zakrywa wszystkie przestępstwa."
  tags: []
"Prz10,13":
  text: "Na wargach rozumnego znajduje się mądrość, a rózga na plecach pozbawionego rozumu."
  tags: []
"Prz10,14":
  text: "Mądrzy gromadzą wiedzę, a wargi głupiego przybliżają zniszczenie."
  tags: []
"Prz10,15":
  text: "Majątek bogacza jest jego warownym miastem, a trwogą ubogich jest ich ubóstwo."
  tags: []
"Prz10,16":
  text: "Praca sprawiedliwego służy życiu, a dochód niegodziwych – grzechowi."
  tags: []
"Prz10,17":
  text: "Kto strzeże karności, kroczy ścieżką życia, a kto porzuca upomnienie – wprowadza w błąd."
  tags: []
"Prz10,18":
  text: "Kto skrywa nienawiść, ma wargi kłamliwe, a kto rozgłasza oszczerstwo, ten jest głupi."
  tags: []
"Prz10,19":
  text: "Gdzie mnóstwo słów, tam nie ustaje nieprawość, a kto panuje nad swoimi wargami, jest rozważny."
  tags: []
"Prz10,20":
  text: "Język sprawiedliwego jest wybornym srebrem, a serce niegodziwych jest mało warte."
  tags: []
"Prz10,21":
  text: "Wargi sprawiedliwego żywią wielu, a głupi zginą przez brak rozumu."
  tags: []
"Prz10,22":
  text: "Błogosławieństwo JHWH wzbogaca i nie dodaje przy tym trudu ."
  tags: []
"Prz10,23":
  text: "Dla głupiego popełnić niegodziwość to jak zabawa, lecz mądrość cechuje człowieka rozumnego."
  tags: []
"Prz10,24":
  text: "Na niegodziwego przyjdzie to, czego się boi, a sprawiedliwym zostanie dane to, czego pragną."
  tags: []
"Prz10,25":
  text: "Gdy wicher przechodzi, nie ma już niegodziwego, lecz sprawiedliwy ma wieczny fundament."
  tags: []
"Prz10,26":
  text: "Czym ocet dla zębów i dym dla oczu, tym jest leniwy dla tych, którzy go posyłają."
  tags: []
"Prz10,27":
  text: "Bojaźń JHWH dodaje dni, a lata niegodziwego skracają się."
  tags: []
"Prz10,28":
  text: "Oczekiwanie sprawiedliwych kończy się radością, a nadzieja niegodziwych zginie."
  tags: []
"Prz10,29":
  text: "Droga JHWH jest ostoją dla niewinnego, lecz zgubą dla czyniących nieprawość."
  tags: []
"Prz10,30":
  text: "Sprawiedliwy na wieki się nie zachwieje, a niegodziwi nie będą mieszkać na ziemi."
  tags: []
"Prz10,31":
  text: "Usta sprawiedliwego owocują mądrością, a język przewrotny zostanie wycięty."
  tags: []
"Prz10,32":
  text: "Wargi sprawiedliwego wyrażają życzliwość, a usta niegodziwych są przewrotne."
  tags: []
