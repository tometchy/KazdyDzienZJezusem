"Prz10,1": "Przysłowia Salomona. Mądry syn sprawia ojcu radość, a głupi syn jest zgryzotą swojej matki."
"Prz10,2": "Nie przynoszą korzyści skarby zgromadzone niegodziwie, lecz sprawiedliwość uwalnia od śmierci."
"Prz10,3": "JHWH nie pozwoli, by dusza sprawiedliwego głodowała, a żądze niegodziwych odtrąci."
"Prz10,4": "Leniwa ręka prowadzi do nędzy, a ręka pilnych zdobywa bogactwa."
"Prz10,5": "Kto zbiera w lecie, jest synem roztropnym; syn, który śpi w czasie żniwa, postępuje haniebnie."
"Prz10,6": "Błogosławieństwa spływają na głowę sprawiedliwego, a usta niegodziwych skrywają gwałt."
"Prz10,7": "Pamięć o sprawiedliwym jest błogosławieństwem, a imię niegodziwych zgnije."
"Prz10,8": "Człowiek mądrego serca przyjmuje przykazania, a głupiec przez swoje wargi upadnie."
"Prz10,9": "Kto kroczy uczciwie, kroczy bezpiecznie, a kto jest przewrotny w swoich drogach, zostanie ujawniony."
"Prz10,10": "Kto mruga okiem, powoduje ból, a głupiec przez swoje wargi upadnie."
"Prz10,11": "Usta sprawiedliwego są źródłem życia, a usta niegodziwych skrywają gwałt."
"Prz10,12": "Nienawiść wznieca kłótnie, a miłość zakrywa wszystkie przestępstwa."
"Prz10,13": "Na wargach rozumnego znajduje się mądrość, a rózga na plecach pozbawionego rozumu."
"Prz10,14": "Mądrzy gromadzą wiedzę, a wargi głupiego przybliżają zniszczenie."
"Prz10,15": "Majątek bogacza jest jego warownym miastem, a trwogą ubogich jest ich ubóstwo."
"Prz10,16": "Praca sprawiedliwego służy życiu, a dochód niegodziwych – grzechowi."
"Prz10,17": "Kto strzeże karności, kroczy ścieżką życia, a kto porzuca upomnienie – wprowadza w błąd."
"Prz10,18": "Kto skrywa nienawiść, ma wargi kłamliwe, a kto rozgłasza oszczerstwo, ten jest głupi."
"Prz10,19": "Gdzie mnóstwo słów, tam nie ustaje nieprawość, a kto panuje nad swoimi wargami, jest rozważny."
"Prz10,20": "Język sprawiedliwego jest wybornym srebrem, a serce niegodziwych jest mało warte."
"Prz10,21": "Wargi sprawiedliwego żywią wielu, a głupi zginą przez brak rozumu."
"Prz10,22": "Błogosławieństwo JHWH wzbogaca i nie dodaje przy tym trudu ."
"Prz10,23": "Dla głupiego popełnić niegodziwość to jak zabawa, lecz mądrość cechuje człowieka rozumnego."
"Prz10,24": "Na niegodziwego przyjdzie to, czego się boi, a sprawiedliwym zostanie dane to, czego pragną."
"Prz10,25": "Gdy wicher przechodzi, nie ma już niegodziwego, lecz sprawiedliwy ma wieczny fundament."
"Prz10,26": "Czym ocet dla zębów i dym dla oczu, tym jest leniwy dla tych, którzy go posyłają."
"Prz10,27": "Bojaźń JHWH dodaje dni, a lata niegodziwego skracają się."
"Prz10,28": "Oczekiwanie sprawiedliwych kończy się radością, a nadzieja niegodziwych zginie."
"Prz10,29": "Droga JHWH jest ostoją dla niewinnego, lecz zgubą dla czyniących nieprawość."
"Prz10,30": "Sprawiedliwy na wieki się nie zachwieje, a niegodziwi nie będą mieszkać na ziemi."
"Prz10,31": "Usta sprawiedliwego owocują mądrością, a język przewrotny zostanie wycięty."
"Prz10,32": "Wargi sprawiedliwego wyrażają życzliwość, a usta niegodziwych są przewrotne."
