"Prz6,1": "Synu mój, jeśli poręczyłeś za swojego bliźniego i przyklasnąłeś w dłonie za obcego;"
"Prz6,2": "To zostałeś związany przez słowa swoich ust i schwytany przez słowa swoich ust."
"Prz6,3": "Uczyń więc to, mój synu, uwolnij się, gdy wpadłeś w ręce swojego bliźniego; idź, upokórz się i nalegaj na twojego bliźniego."
"Prz6,4": "Nie pozwól zasnąć swoim oczom i nie pozwól drzemać swoim powiekom."
"Prz6,5": "Uwolnij się jak gazela z rąk myśliwego i jak ptak z ręki ptasznika."
"Prz6,6": "Idź do mrówki, leniwcze, przypatrz się jej drogom i bądź mądry;"
"Prz6,7": "Nie ma ona wodza ani nadzorcy, ani władcy;"
"Prz6,8": "A w lecie przygotowuje swój chleb i gromadzi w żniwa swoją żywność."
"Prz6,9": "Jak długo będziesz leżał, leniwcze? Kiedy wstaniesz ze swojego snu?"
"Prz6,10": "Jeszcze trochę snu, trochę drzemania, trochę założenia rąk, aby odpoczywać;"
"Prz6,11": "A twoje ubóstwo przyjdzie jak włóczęga i twój niedostatek jak mąż uzbrojony."
"Prz6,12": "Człowiek nikczemny i mąż niegodziwy chodzi z przewrotnością na ustach;"
"Prz6,13": "Mruga swoimi oczami, sygnalizuje swoimi nogami, wskazuje swoimi palcami;"
"Prz6,14": "Perwersja jest w jego sercu, przez cały czas obmyśla zło, wszczyna kłótnie."
"Prz6,15": "Dlatego nagle przyjdzie jego klęska; nagle zostanie rozbity i nie będzie uzdrowienia."
"Prz6,16": "Te sześć rzeczy nienawidzi JHWH, siedem budzi w Nim odrazę:"
"Prz6,17": "Wyniosłe oczy, kłamliwy język i ręce, które przelewają krew niewinną;"
"Prz6,18": "Serce, które knuje niegodziwe plany, nogi, które spiesznie biegną do zła;"
"Prz6,19": "Ziejący kłamstwem fałszywy świadek, i ten, który sieje niezgodę między braćmi."
"Prz6,20": "Synu mój, strzeż przykazania twojego ojca i nie odrzucaj pouczenia twojej matki."
"Prz6,21": "Przywiązuj je ciągle do swojego serca i zawiązuj je sobie na twojej szyi."
"Prz6,22": "Gdy ruszysz, poprowadzi cię; gdy zaśniesz, będzie cię strzec, a gdy się obudzisz, przemówi ono do ciebie;"
"Prz6,23": "Bo przykazanie jest lampą, pouczenie światłem, a upomnienia do karności są drogą życia;"
"Prz6,24": "Aby cię strzegły przed złą kobietą i przed gładkim językiem cudzej."
"Prz6,25": "Nie pożądaj w swoim sercu jej piękna i niech nie schwyta cię trzepotaniem swoich powiek."
"Prz6,26": "Bo dla kobiety nierządnej zubożeje człowiek aż do bochenka chleba, a żona innego mężczyzny poluje na cenną duszę."
"Prz6,27": "Czy może człowiek zagarnąć ogień w zanadrze, a jego szaty nie ulegną spaleniu?"
"Prz6,28": "Czy jeśli człowiek pójdzie po rozżarzonych węglach, to jego stopy się nie poparzą?"
"Prz6,29": "Tak jest z tym, kto wchodzi do żony swojego bliźniego; każdy kto jej dotyka, nie będzie wolny od winy."
"Prz6,30": "Czy nie pogardza się złodziejem, nawet gdy kradnie, by nasycić swoją duszę, gdy jest głodny?"
"Prz6,31": "A gdy go złapią, odpłaci siedmiokrotnie i odda cały dobytek swojego domu."
"Prz6,32": "Lecz kto cudzołoży z kobietą, brakuje mu rozumu; kto tak uczyni, ten rujnuje swoją duszę."
"Prz6,33": "Znajdzie sińce i wstyd, a jego hańba nie zostanie zmazana."
"Prz6,34": "Bo zazdrość rozpala gniew męża i nie zlituje się w dniu zemsty."
"Prz6,35": "Nie będzie miał względu na żaden okup i nie przyjmie darów, choćbyś je pomnożył."
