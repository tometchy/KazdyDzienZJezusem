"Prz6,1":
  text: "Synu mój, jeśli poręczyłeś za swojego bliźniego i przyklasnąłeś w dłonie za obcego;"
  tags: []
"Prz6,2":
  text: "To zostałeś związany przez słowa swoich ust i schwytany przez słowa swoich ust."
  tags: []
"Prz6,3":
  text: "Uczyń więc to, mój synu, uwolnij się, gdy wpadłeś w ręce swojego bliźniego; idź, upokórz się i nalegaj na twojego bliźniego."
  tags: []
"Prz6,4":
  text: "Nie pozwól zasnąć swoim oczom i nie pozwól drzemać swoim powiekom."
  tags: []
"Prz6,5":
  text: "Uwolnij się jak gazela z rąk myśliwego i jak ptak z ręki ptasznika."
  tags: []
"Prz6,6":
  text: "Idź do mrówki, leniwcze, przypatrz się jej drogom i bądź mądry;"
  tags: []
"Prz6,7":
  text: "Nie ma ona wodza ani nadzorcy, ani władcy;"
  tags: []
"Prz6,8":
  text: "A w lecie przygotowuje swój chleb i gromadzi w żniwa swoją żywność."
  tags: []
"Prz6,9":
  text: "Jak długo będziesz leżał, leniwcze? Kiedy wstaniesz ze swojego snu?"
  tags: []
"Prz6,10":
  text: "Jeszcze trochę snu, trochę drzemania, trochę założenia rąk, aby odpoczywać;"
  tags: []
"Prz6,11":
  text: "A twoje ubóstwo przyjdzie jak włóczęga i twój niedostatek jak mąż uzbrojony."
  tags: []
"Prz6,12":
  text: "Człowiek nikczemny i mąż niegodziwy chodzi z przewrotnością na ustach;"
  tags: []
"Prz6,13":
  text: "Mruga swoimi oczami, sygnalizuje swoimi nogami, wskazuje swoimi palcami;"
  tags: []
"Prz6,14":
  text: "Perwersja jest w jego sercu, przez cały czas obmyśla zło, wszczyna kłótnie."
  tags: []
"Prz6,15":
  text: "Dlatego nagle przyjdzie jego klęska; nagle zostanie rozbity i nie będzie uzdrowienia."
  tags: []
"Prz6,16":
  text: "Te sześć rzeczy nienawidzi JHWH, siedem budzi w Nim odrazę:"
  tags: []
"Prz6,17":
  text: "Wyniosłe oczy, kłamliwy język i ręce, które przelewają krew niewinną;"
  tags: []
"Prz6,18":
  text: "Serce, które knuje niegodziwe plany, nogi, które spiesznie biegną do zła;"
  tags: []
"Prz6,19":
  text: "Ziejący kłamstwem fałszywy świadek, i ten, który sieje niezgodę między braćmi."
  tags: []
"Prz6,20":
  text: "Synu mój, strzeż przykazania twojego ojca i nie odrzucaj pouczenia twojej matki."
  tags: []
"Prz6,21":
  text: "Przywiązuj je ciągle do swojego serca i zawiązuj je sobie na twojej szyi."
  tags: []
"Prz6,22":
  text: "Gdy ruszysz, poprowadzi cię; gdy zaśniesz, będzie cię strzec, a gdy się obudzisz, przemówi ono do ciebie;"
  tags: []
"Prz6,23":
  text: "Bo przykazanie jest lampą, pouczenie światłem, a upomnienia do karności są drogą życia;"
  tags: []
"Prz6,24":
  text: "Aby cię strzegły przed złą kobietą i przed gładkim językiem cudzej."
  tags: []
"Prz6,25":
  text: "Nie pożądaj w swoim sercu jej piękna i niech nie schwyta cię trzepotaniem swoich powiek."
  tags: []
"Prz6,26":
  text: "Bo dla kobiety nierządnej zubożeje człowiek aż do bochenka chleba, a żona innego mężczyzny poluje na cenną duszę."
  tags: []
"Prz6,27":
  text: "Czy może człowiek zagarnąć ogień w zanadrze, a jego szaty nie ulegną spaleniu?"
  tags: []
"Prz6,28":
  text: "Czy jeśli człowiek pójdzie po rozżarzonych węglach, to jego stopy się nie poparzą?"
  tags: []
"Prz6,29":
  text: "Tak jest z tym, kto wchodzi do żony swojego bliźniego; każdy kto jej dotyka, nie będzie wolny od winy."
  tags: []
"Prz6,30":
  text: "Czy nie pogardza się złodziejem, nawet gdy kradnie, by nasycić swoją duszę, gdy jest głodny?"
  tags: []
"Prz6,31":
  text: "A gdy go złapią, odpłaci siedmiokrotnie i odda cały dobytek swojego domu."
  tags: []
"Prz6,32":
  text: "Lecz kto cudzołoży z kobietą, brakuje mu rozumu; kto tak uczyni, ten rujnuje swoją duszę."
  tags: []
"Prz6,33":
  text: "Znajdzie sińce i wstyd, a jego hańba nie zostanie zmazana."
  tags: []
"Prz6,34":
  text: "Bo zazdrość rozpala gniew męża i nie zlituje się w dniu zemsty."
  tags: []
"Prz6,35":
  text: "Nie będzie miał względu na żaden okup i nie przyjmie darów, choćbyś je pomnożył."
  tags: []
