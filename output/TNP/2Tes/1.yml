"2Tes1,1": "Paweł i Sylwan, i Tymoteusz do zboru Tesaloniczan w Bogu Ojcu i w Panu Jezusie Chrystusie."
"2Tes1,2": "Łaska wam i pokój od Boga, Ojca naszego, i Pana Jezusa Chrystusa."
"2Tes1,3": "Powinniśmy zawsze dziękować Bogu za was, bracia, jak to jest słuszne, bo niezmiernie wzrasta wasza wiara i obfituje miłość każdego z was wobec siebie nawzajem,"
"2Tes1,4": "Tak że my sami chlubimy się z was w zborach Boga z powodu waszej wytrwałości i wiary we wszystkich waszych prześladowaniach i w uciskach, które znosicie."
"2Tes1,5": "Co jest dowodem sprawiedliwego sądu Bożego, że zostaliście uznani za godnych Królestwa Bożego, dla którego też cierpicie."
"2Tes1,6": "Bo sprawiedliwe jest u Boga odpłacić uciskiem tym, którzy was uciskają,"
"2Tes1,7": "A wam, uciskanym, przynieść ulgę wraz z nami podczas objawienia się Pana Jezusa z nieba z aniołami Jego mocy,"
"2Tes1,8": "W płomieniu ognia, wymierzającego karę tym, którzy Boga nie znają i tym, którzy nie są posłuszni Ewangelii Pana naszego Jezusa Chrystusa;"
"2Tes1,9": "Którzy poniosą karę, wieczną zgubę z dala od oblicza Pana i od chwały Jego mocy,"
"2Tes1,10": "Gdy przyjdzie w tym dniu, aby zostać wysławionym w swoich świętych i podziwianym we wszystkich tych, którzy wierzą, ponieważ świadectwo nasze znalazło wśród was wiarę."
"2Tes1,11": "O co też modlimy się zawsze za was, aby Bóg nasz uznał was godnymi powołania i wypełnił wszelkie pragnienie dobroci i dzieło wiary w mocy,"
"2Tes1,12": "Aby zostało wysławione imię Pana naszego Jezusa Chrystusa w was, a wy w Nim, według łaski Boga naszego i Pana Jezusa Chrystusa."
