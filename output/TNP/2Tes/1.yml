"2Tes1,1":
  text: "Paweł i Sylwan, i Tymoteusz do zboru Tesaloniczan w Bogu Ojcu i w Panu Jezusie Chrystusie."
  tags: []
"2Tes1,2":
  text: "Łaska wam i pokój od Boga, Ojca naszego, i Pana Jezusa Chrystusa."
  tags: []
"2Tes1,3":
  text: "Powinniśmy zawsze dziękować Bogu za was, bracia, jak to jest słuszne, bo niezmiernie wzrasta wasza wiara i obfituje miłość każdego z was wobec siebie nawzajem,"
  tags: []
"2Tes1,4":
  text: "Tak że my sami chlubimy się z was w zborach Boga z powodu waszej wytrwałości i wiary we wszystkich waszych prześladowaniach i w uciskach, które znosicie."
  tags: []
"2Tes1,5":
  text: "Co jest dowodem sprawiedliwego sądu Bożego, że zostaliście uznani za godnych Królestwa Bożego, dla którego też cierpicie."
  tags: []
"2Tes1,6":
  text: "Bo sprawiedliwe jest u Boga odpłacić uciskiem tym, którzy was uciskają,"
  tags: []
"2Tes1,7":
  text: "A wam, uciskanym, przynieść ulgę wraz z nami podczas objawienia się Pana Jezusa z nieba z aniołami Jego mocy,"
  tags: []
"2Tes1,8":
  text: "W płomieniu ognia, wymierzającego karę tym, którzy Boga nie znają i tym, którzy nie są posłuszni Ewangelii Pana naszego Jezusa Chrystusa;"
  tags: []
"2Tes1,9":
  text: "Którzy poniosą karę, wieczną zgubę z dala od oblicza Pana i od chwały Jego mocy,"
  tags: []
"2Tes1,10":
  text: "Gdy przyjdzie w tym dniu, aby zostać wysławionym w swoich świętych i podziwianym we wszystkich tych, którzy wierzą, ponieważ świadectwo nasze znalazło wśród was wiarę."
  tags: []
"2Tes1,11":
  text: "O co też modlimy się zawsze za was, aby Bóg nasz uznał was godnymi powołania i wypełnił wszelkie pragnienie dobroci i dzieło wiary w mocy,"
  tags: []
"2Tes1,12":
  text: "Aby zostało wysławione imię Pana naszego Jezusa Chrystusa w was, a wy w Nim, według łaski Boga naszego i Pana Jezusa Chrystusa."
  tags: []
