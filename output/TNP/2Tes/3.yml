"2Tes3,1": "Na koniec, bracia, módlcie się za nas, aby Słowo Pana szerzyło się i rozsławiało, jak i u was;"
"2Tes3,2": "I abyśmy zostali wyrwani od ludzi przewrotnych i złych; wiara bowiem nie jest udziałem wszystkich."
"2Tes3,3": "Ale wierny jest Pan, który was utwierdzi i strzec będzie od złego."
"2Tes3,4": "A mam ufność w Panu co do was, że to, co wam rozkazujemy, czynicie i będziecie czynić."
"2Tes3,5": "A Pan oby skierował wasze serca do miłości Boga i do cierpliwości Chrystusa."
"2Tes3,6": "A rozkazujemy wam, bracia, w imieniu Pana naszego Jezusa Chrystusa, abyście się odłączali od każdego brata postępującego nieporządnie, a nie według przekazu nauki, który otrzymał od nas."
"2Tes3,7": "Sami bowiem wiecie, jak należy nas naśladować; ponieważ nie żyliśmy między wami nieporządnie,"
"2Tes3,8": "Ani u nikogo nie jedliśmy za darmo chleba, ale w trudzie i mozole, pracując nocą i dniem, by nikogo z was nie obciążyć;"
"2Tes3,9": "Nie dlatego, że nie mamy takiego prawa, ale żeby dać wam siebie samych za wzór, abyście nas naśladowali."
"2Tes3,10": "A gdy byliśmy u was, to wam rozkazywaliśmy, że jeśli ktoś nie chce pracować, niech też nie je."
"2Tes3,11": "Słyszymy bowiem, że niektórzy spośród was postępują nieporządnie, nie pracują, ale trudzą się bezużytecznymi sprawami."
"2Tes3,12": "Dlatego takim rozkazujemy i zachęcamy ich przez Pana naszego Jezusa Chrystusa, aby spokojnie pracując, jedli własny chleb."
"2Tes3,13": "A wy, bracia, nie zniechęcajcie się dobrze czynić."
"2Tes3,14": "A jeśli ktoś jest nieposłuszny słowu naszemu przekazanemu w tym liście, tego naznaczcie i nie łączcie się z nim, aby został zawstydzony;"
"2Tes3,15": "Jednak nie uznawajcie go za nieprzyjaciela, ale korygujcie jako brata."
"2Tes3,16": "A sam Pan pokoju oby dał wam pokój pośród wszystkich okoliczności i wszelkim sposobem. Pan z wami wszystkimi."
"2Tes3,17": "Pozdrowienie moją, Pawła ręką, co jest znakiem w każdym liście; tak piszę."
"2Tes3,18": "Łaska Pana naszego Jezusa Chrystusa z wami wszystkimi. Amen."
