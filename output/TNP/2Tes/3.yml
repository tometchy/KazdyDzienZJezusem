"2Tes3,1":
  text: "Na koniec, bracia, módlcie się za nas, aby Słowo Pana szerzyło się i rozsławiało, jak i u was;"
  tags: []
"2Tes3,2":
  text: "I abyśmy zostali wyrwani od ludzi przewrotnych i złych; wiara bowiem nie jest udziałem wszystkich."
  tags: []
"2Tes3,3":
  text: "Ale wierny jest Pan, który was utwierdzi i strzec będzie od złego."
  tags: []
"2Tes3,4":
  text: "A mam ufność w Panu co do was, że to, co wam rozkazujemy, czynicie i będziecie czynić."
  tags: []
"2Tes3,5":
  text: "A Pan oby skierował wasze serca do miłości Boga i do cierpliwości Chrystusa."
  tags: []
"2Tes3,6":
  text: "A rozkazujemy wam, bracia, w imieniu Pana naszego Jezusa Chrystusa, abyście się odłączali od każdego brata postępującego nieporządnie, a nie według przekazu nauki, który otrzymał od nas."
  tags: []
"2Tes3,7":
  text: "Sami bowiem wiecie, jak należy nas naśladować; ponieważ nie żyliśmy między wami nieporządnie,"
  tags: []
"2Tes3,8":
  text: "Ani u nikogo nie jedliśmy za darmo chleba, ale w trudzie i mozole, pracując nocą i dniem, by nikogo z was nie obciążyć;"
  tags: []
"2Tes3,9":
  text: "Nie dlatego, że nie mamy takiego prawa, ale żeby dać wam siebie samych za wzór, abyście nas naśladowali."
  tags: []
"2Tes3,10":
  text: "A gdy byliśmy u was, to wam rozkazywaliśmy, że jeśli ktoś nie chce pracować, niech też nie je."
  tags: []
"2Tes3,11":
  text: "Słyszymy bowiem, że niektórzy spośród was postępują nieporządnie, nie pracują, ale trudzą się bezużytecznymi sprawami."
  tags: []
"2Tes3,12":
  text: "Dlatego takim rozkazujemy i zachęcamy ich przez Pana naszego Jezusa Chrystusa, aby spokojnie pracując, jedli własny chleb."
  tags: []
"2Tes3,13":
  text: "A wy, bracia, nie zniechęcajcie się dobrze czynić."
  tags: []
"2Tes3,14":
  text: "A jeśli ktoś jest nieposłuszny słowu naszemu przekazanemu w tym liście, tego naznaczcie i nie łączcie się z nim, aby został zawstydzony;"
  tags: []
"2Tes3,15":
  text: "Jednak nie uznawajcie go za nieprzyjaciela, ale korygujcie jako brata."
  tags: []
"2Tes3,16":
  text: "A sam Pan pokoju oby dał wam pokój pośród wszystkich okoliczności i wszelkim sposobem. Pan z wami wszystkimi."
  tags: []
"2Tes3,17":
  text: "Pozdrowienie moją, Pawła ręką, co jest znakiem w każdym liście; tak piszę."
  tags: []
"2Tes3,18":
  text: "Łaska Pana naszego Jezusa Chrystusa z wami wszystkimi. Amen."
  tags: []
