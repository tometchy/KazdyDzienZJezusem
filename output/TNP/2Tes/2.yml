"2Tes2,1": "A prosimy was, bracia, co do przyjścia Pana naszego Jezusa Chrystusa i naszego zgromadzenia się przed Nim,"
"2Tes2,2": "Nie dajcie się co do tego tak szybko zachwiać w swoim myśleniu, ani zatrważać, czy to przez ducha, czy to przez słowo, czy to przez list rzekomo przez nas napisany, jakoby już nastał dzień Chrystusa,"
"2Tes2,3": "Aby was nikt w żaden sposób nie zwiódł; gdyż dzień ten nie nastanie, jeśli najpierw nie przyjdzie odstępstwo i nie zostanie objawiony człowiek grzechu, syn zatracenia,"
"2Tes2,4": "Który sprzeciwia się i wynosi nad wszystko, co nazywa się bogiem lub jest przedmiotem czci, tak że on w świątyni Boga zasiądzie jako bóg, wskazując na siebie samego, że jest bogiem."
"2Tes2,5": "Czy nie pamiętacie, że jeszcze będąc u was, mówiłem wam o tych sprawach?"
"2Tes2,6": "A teraz wiecie, co go powstrzymuje, aż do chwili, by go objawiono we właściwym czasie."
"2Tes2,7": "Bo tajemnica bezprawia już działa; dopóki ten jedyny, który teraz powstrzymuje, nie zaistniałby ze środka."
"2Tes2,8": "A wtedy zostanie objawiony ów nieprawy, którego Pan zabije tchnieniem swoich ust i zniszczy manifestacją swojego przyjścia;"
"2Tes2,9": "Jego przyjście jest według skutecznego działania szatana, w całej mocy i znakach, i cudach kłamstwa,"
"2Tes2,10": "I w całym podstępie niesprawiedliwości w tych, którzy giną, za to, że nie przyjęli oni miłości prawdy, aby zostać zbawionymi."
"2Tes2,11": "I dlatego pośle im Bóg skuteczne działanie błędu, po to, by uwierzyli oni temu kłamstwu,"
"2Tes2,12": "Aby zostali osądzeni wszyscy, którzy nie uwierzyli prawdzie, lecz znaleźli upodobanie w niesprawiedliwości."
"2Tes2,13": "Lecz my powinniśmy zawsze dziękować Bogu za was, bracia, którzy jesteście umiłowani przez Pana, że Bóg od początku wybrał was dla siebie ku zbawieniu w uświęceniu Ducha i w wierze w prawdę,"
"2Tes2,14": "Do czego powołał was przez naszą Ewangelię dla pozyskania dla siebie chwały Pana naszego Jezusa Chrystusa."
"2Tes2,15": "Dlatego, bracia, stójcie mocno i trzymajcie się przekazów nauki, których zostaliście nauczeni, czy to przez słowo, czy to przez nasz list."
"2Tes2,16": "A sam Pan nasz Jezus Chrystus, i Bóg i Ojciec nasz, Ten, który nas umiłował i dał wieczne pocieszenie i nadzieję dobrą w łasce,"
"2Tes2,17": "Oby pocieszył wasze serca i utwierdził was w każdym słowie i w dobrym dziele."
