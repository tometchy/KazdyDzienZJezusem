"So2,1": "Zbierzcie się i zgromadźcie się, narodzie bezwstydny;"
"So2,2": "Zanim wyjdzie dekret i dzień przeminie jak plewa; zanim przyjdzie na was żar gniewu JHWH, zanim przyjdzie na was dzień gniewu JHWH!"
"So2,3": "Szukajcie JHWH, wszyscy pokorni ziemi, którzy wypełniacie Jego prawo; szukajcie sprawiedliwości, szukajcie pokory, może skryjecie się w dniu gniewu JHWH."
"So2,4": "Gaza bowiem będzie opuszczona a Aszkelon? – na spustoszenie, Aszdod w samo południe wyrzucą, a Ekron wykorzenią."
"So2,5": "Biada mieszkańcom wybrzeża morskiego, narodowi Keretytów! Słowo JHWH jest przeciwko wam, Kanaanie, ziemio Filistynów; zniszczę cię tak, że nie będzie żadnego mieszkańca."
"So2,6": "Wybrzeże morskie będzie pastwiskami i łąkami dla pasterzy, i na zagrody dla trzód."
"So2,7": "I będzie wybrzeże morskie dla resztki domu Judy i będą na nim wypasać. W domach Aszkelonu będą się kłaść wieczorem, gdyż nawiedzi ich JHWH, ich Bóg, i przywróci ich z niewoli."
"So2,8": "Słyszałem drwinę Moabu i obelgi synów Ammona, którymi urągali mojemu ludowi i wynosili się nad ich granicą."
"So2,9": "Dlatego, jako żyję ja – oświadczenie JHWH Zastępów – Bóg Izraela, Tak, Moab stanie się jak Sodoma, a synowie Ammona jak Gomora – miejscem pokrzyw, dołem solnym i pustynią aż na wieki. Resztka mojego ludu złupi ich i pozostali z mojego ludu posiądą ich."
"So2,10": "To ich spotka za ich pychę, gdyż lżyli i wynosili się nad lud JHWH Zastępów."
"So2,11": "JHWH ukaże się nad nimi wywołując lęk, bo odtłuści wszystkich bogów ziemi; i będą mu oddawać pokłon, każdy ze swojego miejsca – wszystkie wyspy narodów."
"So2,12": "Wy też, Kuszyci – pobici oni moim mieczem."
"So2,13": "Wyciągnie też swoją rękę przeciwko północy i zniszczy Aszur; zamieni Niniwę na pustoszenie suszy – jak pustynię."
"So2,14": "I będą się pośród niej wylegiwać stada, wszelkie zwierzęta narodów; zarówno sowa, jak i puszczyk na jej kolumnach będą spali, głos ich śpiewu słychać w oknach, dewastacja na progu, gdyż zostanie zerwane cedrowe obicie."
"So2,15": "To miasto rozradowane, zamieszkałe bezpiecznie i mówiące w swoim sercu: Ja i nikt więcej. Jakże stało się spustoszeniem, legowiskiem zwierząt! Każdy, kto będzie przechodził obok niego, gwizdnie i machnie swoją ręką."
