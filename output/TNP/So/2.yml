"So2,1":
  text: "Zbierzcie się i zgromadźcie się, narodzie bezwstydny;"
  tags: []
"So2,2":
  text: "Zanim wyjdzie dekret i dzień przeminie jak plewa; zanim przyjdzie na was żar gniewu JHWH, zanim przyjdzie na was dzień gniewu JHWH!"
  tags: []
"So2,3":
  text: "Szukajcie JHWH, wszyscy pokorni ziemi, którzy wypełniacie Jego prawo; szukajcie sprawiedliwości, szukajcie pokory, może skryjecie się w dniu gniewu JHWH."
  tags: []
"So2,4":
  text: "Gaza bowiem będzie opuszczona a Aszkelon? – na spustoszenie, Aszdod w samo południe wyrzucą, a Ekron wykorzenią."
  tags: []
"So2,5":
  text: "Biada mieszkańcom wybrzeża morskiego, narodowi Keretytów! Słowo JHWH jest przeciwko wam, Kanaanie, ziemio Filistynów; zniszczę cię tak, że nie będzie żadnego mieszkańca."
  tags: []
"So2,6":
  text: "Wybrzeże morskie będzie pastwiskami i łąkami dla pasterzy, i na zagrody dla trzód."
  tags: []
"So2,7":
  text: "I będzie wybrzeże morskie dla resztki domu Judy i będą na nim wypasać. W domach Aszkelonu będą się kłaść wieczorem, gdyż nawiedzi ich JHWH, ich Bóg, i przywróci ich z niewoli."
  tags: []
"So2,8":
  text: "Słyszałem drwinę Moabu i obelgi synów Ammona, którymi urągali mojemu ludowi i wynosili się nad ich granicą."
  tags: []
"So2,9":
  text: "Dlatego, jako żyję ja – oświadczenie JHWH Zastępów – Bóg Izraela, Tak, Moab stanie się jak Sodoma, a synowie Ammona jak Gomora – miejscem pokrzyw, dołem solnym i pustynią aż na wieki. Resztka mojego ludu złupi ich i pozostali z mojego ludu posiądą ich."
  tags: []
"So2,10":
  text: "To ich spotka za ich pychę, gdyż lżyli i wynosili się nad lud JHWH Zastępów."
  tags: []
"So2,11":
  text: "JHWH ukaże się nad nimi wywołując lęk, bo odtłuści wszystkich bogów ziemi; i będą mu oddawać pokłon, każdy ze swojego miejsca – wszystkie wyspy narodów."
  tags: []
"So2,12":
  text: "Wy też, Kuszyci – pobici oni moim mieczem."
  tags: []
"So2,13":
  text: "Wyciągnie też swoją rękę przeciwko północy i zniszczy Aszur; zamieni Niniwę na pustoszenie suszy – jak pustynię."
  tags: []
"So2,14":
  text: "I będą się pośród niej wylegiwać stada, wszelkie zwierzęta narodów; zarówno sowa, jak i puszczyk na jej kolumnach będą spali, głos ich śpiewu słychać w oknach, dewastacja na progu, gdyż zostanie zerwane cedrowe obicie."
  tags: []
"So2,15":
  text: "To miasto rozradowane, zamieszkałe bezpiecznie i mówiące w swoim sercu: Ja i nikt więcej. Jakże stało się spustoszeniem, legowiskiem zwierząt! Każdy, kto będzie przechodził obok niego, gwizdnie i machnie swoją ręką."
  tags: []
