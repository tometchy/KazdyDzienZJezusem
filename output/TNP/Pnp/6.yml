"Pnp6,1": "Dokąd poszedł twój umiłowany, o najpiękniejsza z kobiet? Dokąd skierował się twój umiłowany, a poszukamy go z tobą?"
"Pnp6,2": "Mój umiłowany zstąpił do swojego ogrodu między zagony balsamu, aby paść w ogrodach i zbierać lilie."
"Pnp6,3": "Ja należę do mojego umiłowanego, a mój umiłowany należy do mnie; wypasający mnie wśród lilii."
"Pnp6,4": "Ty jesteś piękna, moja przyjaciółko, jak Tirsa; zachwycająca jak Jerozolima; groźna – zaopatrzona w sztandary."
"Pnp6,5": "Odwróć ode mnie swoje oczy, bo one mnie urzekły. Twoje włosy są jak stado kóz, które spływają z Gileadu."
"Pnp6,6": "Twoje zęby – jak stado owiec, które wyszły z kąpieli – u wszystkich ciąża bliźniacza i nie ma wśród nich pozbawionej potomstwa."
"Pnp6,7": "Twoja skroń – jak plaster granatu spoza twojej zasłony."
"Pnp6,8": "Sześćdziesiąt jest królowych i osiemdziesiąt nałożnic, a dziewic bez liku."
"Pnp6,9": "Lecz jedna jest moja gołąbka, jedyna moja nieskalana, jedyna ona u swojej matki, czysta ona u swojej rodzicielki. Widziały ją córki i nazwały ją błogosławioną; królowe i nałożnice – i ją chwaliły!"
"Pnp6,10": "Kim jest ta, spoglądająca w dół jak zorza poranna, piękna jak księżyc, czysta jak słońce, groźna – zaopatrzona w sztandary?"
"Pnp6,11": "Zstąpiłam do ogrodu orzechowego, by zobaczyć zielone pędy w dolinie, by zobaczyć, czy winorośl zakwitła, czy rozkwitły granaty."
"Pnp6,12": "Nie znałam własnej duszy! Umieściła mnie ona w rydwanach księcia mojego ludu."
"Pnp6,13": "Powróć, powróć o Szulamitko! Powróć, powróć, abyśmy mogli cię oglądać. Co chcecie zobaczyć w Szulamitce wirującej niczym w tańcu dwóch obozów."
