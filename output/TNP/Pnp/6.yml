"Pnp6,1":
  text: "Dokąd poszedł twój umiłowany, o najpiękniejsza z kobiet? Dokąd skierował się twój umiłowany, a poszukamy go z tobą?"
  tags: []
"Pnp6,2":
  text: "Mój umiłowany zstąpił do swojego ogrodu między zagony balsamu, aby paść w ogrodach i zbierać lilie."
  tags: []
"Pnp6,3":
  text: "Ja należę do mojego umiłowanego, a mój umiłowany należy do mnie; wypasający mnie wśród lilii."
  tags: []
"Pnp6,4":
  text: "Ty jesteś piękna, moja przyjaciółko, jak Tirsa; zachwycająca jak Jerozolima; groźna – zaopatrzona w sztandary."
  tags: []
"Pnp6,5":
  text: "Odwróć ode mnie swoje oczy, bo one mnie urzekły. Twoje włosy są jak stado kóz, które spływają z Gileadu."
  tags: []
"Pnp6,6":
  text: "Twoje zęby – jak stado owiec, które wyszły z kąpieli – u wszystkich ciąża bliźniacza i nie ma wśród nich pozbawionej potomstwa."
  tags: []
"Pnp6,7":
  text: "Twoja skroń – jak plaster granatu spoza twojej zasłony."
  tags: []
"Pnp6,8":
  text: "Sześćdziesiąt jest królowych i osiemdziesiąt nałożnic, a dziewic bez liku."
  tags: []
"Pnp6,9":
  text: "Lecz jedna jest moja gołąbka, jedyna moja nieskalana, jedyna ona u swojej matki, czysta ona u swojej rodzicielki. Widziały ją córki i nazwały ją błogosławioną; królowe i nałożnice – i ją chwaliły!"
  tags: []
"Pnp6,10":
  text: "Kim jest ta, spoglądająca w dół jak zorza poranna, piękna jak księżyc, czysta jak słońce, groźna – zaopatrzona w sztandary?"
  tags: []
"Pnp6,11":
  text: "Zstąpiłam do ogrodu orzechowego, by zobaczyć zielone pędy w dolinie, by zobaczyć, czy winorośl zakwitła, czy rozkwitły granaty."
  tags: []
"Pnp6,12":
  text: "Nie znałam własnej duszy! Umieściła mnie ona w rydwanach księcia mojego ludu."
  tags: []
"Pnp6,13":
  text: "Powróć, powróć o Szulamitko! Powróć, powróć, abyśmy mogli cię oglądać. Co chcecie zobaczyć w Szulamitce wirującej niczym w tańcu dwóch obozów."
  tags: []
