"Pnp8,1":
  text: "O, gdybyś był jak mój brat, który ssał piersi mojej matki! Spotykałabym cię wtedy na dworze, całowałabym cię i nawet by mną nie wzgardzono."
  tags: []
"Pnp8,2":
  text: "Poprowadzę cię i wprowadzę do domu mojej matki, gdzie będzie mnie ona uczyła. I napoję cię winem korzennym, sokiem z mojego jabłka granatu."
  tags: []
"Pnp8,3":
  text: "Jego lewa ręka jest pod moją głową, a prawa ręka obejmuje mnie."
  tags: []
"Pnp8,4":
  text: "Błagam was, córki Jerozolimy: Nie budźcie i nie rozbudzajcie miłości dopóki nie zapragnie."
  tags: []
"Pnp8,5":
  text: "Kim jest ta, która odstrony pustyni idzie wsparta na jej umiłowanym? Pod jabłonią cię obudziłem. Tam cię urodziła twoja matka, tam cię urodziła twoja rodzicielka."
  tags: []
"Pnp8,6":
  text: "Przyłóż mnie jak pieczęć na swoim sercu, jak pieczęć na swoim ramieniu. Miłość bowiem jest silna jak śmierć, zazdrość twarda jak grób. Jej żar jak żar ognia i jak potężny płomień."
  tags: []
"Pnp8,7":
  text: "Wielkie wody nie są zdolne zgasić tej miłości, a rzeki jej nie zatopią. Jeśli ktoś oddałby cały majątek swojego domu za taką miłość, z pewnością zostałby wzgardzony."
  tags: []
"Pnp8,8":
  text: "Mamy małą siostrę, nie ma jeszcze piersi. Cóż uczynimy dla naszej siostry w dniu, gdy będą o niej mówić?"
  tags: []
"Pnp8,9":
  text: "Jeśli ona jest murem, zbudujemy na niej srebrny gzyms; a jeśli ona jest bramą, zastawimy ją deską z cedru."
  tags: []
"Pnp8,10":
  text: "Ja jestem murem, a moje piersi są jak wieże – od teraz stałam się w jego oczach jak ta, która znalazła pokój."
  tags: []
"Pnp8,11":
  text: "Salomon miał winnicę w Baal-Hamon, którą oddał stróżom; każdy miał przynosić za jej owoc tysiąc sztuk srebra."
  tags: []
"Pnp8,12":
  text: "Ja moją winnicę mam przede mną. Ten tysiąc jest twój, Salomonie, a dwieście – dla strzegących jej owocu."
  tags: []
"Pnp8,13":
  text: "O ty, która mieszkasz w ogrodach – przyjaciele zwracają uwagę na twój głos – spraw, abym go usłyszał!"
  tags: []
"Pnp8,14":
  text: "Pospiesz się, mój umiłowany, i bądź podobny do sarny albo młodego jelenia na górach pełnych wonności."
  tags: []
