"Pnp8,1": "O, gdybyś był jak mój brat, który ssał piersi mojej matki! Spotykałabym cię wtedy na dworze, całowałabym cię i nawet by mną nie wzgardzono."
"Pnp8,2": "Poprowadzę cię i wprowadzę do domu mojej matki, gdzie będzie mnie ona uczyła. I napoję cię winem korzennym, sokiem z mojego jabłka granatu."
"Pnp8,3": "Jego lewa ręka jest pod moją głową, a prawa ręka obejmuje mnie."
"Pnp8,4": "Błagam was, córki Jerozolimy: Nie budźcie i nie rozbudzajcie miłości dopóki nie zapragnie."
"Pnp8,5": "Kim jest ta, która odstrony pustyni idzie wsparta na jej umiłowanym? Pod jabłonią cię obudziłem. Tam cię urodziła twoja matka, tam cię urodziła twoja rodzicielka."
"Pnp8,6": "Przyłóż mnie jak pieczęć na swoim sercu, jak pieczęć na swoim ramieniu. Miłość bowiem jest silna jak śmierć, zazdrość twarda jak grób. Jej żar jak żar ognia i jak potężny płomień."
"Pnp8,7": "Wielkie wody nie są zdolne zgasić tej miłości, a rzeki jej nie zatopią. Jeśli ktoś oddałby cały majątek swojego domu za taką miłość, z pewnością zostałby wzgardzony."
"Pnp8,8": "Mamy małą siostrę, nie ma jeszcze piersi. Cóż uczynimy dla naszej siostry w dniu, gdy będą o niej mówić?"
"Pnp8,9": "Jeśli ona jest murem, zbudujemy na niej srebrny gzyms; a jeśli ona jest bramą, zastawimy ją deską z cedru."
"Pnp8,10": "Ja jestem murem, a moje piersi są jak wieże – od teraz stałam się w jego oczach jak ta, która znalazła pokój."
"Pnp8,11": "Salomon miał winnicę w Baal-Hamon, którą oddał stróżom; każdy miał przynosić za jej owoc tysiąc sztuk srebra."
"Pnp8,12": "Ja moją winnicę mam przede mną. Ten tysiąc jest twój, Salomonie, a dwieście – dla strzegących jej owocu."
"Pnp8,13": "O ty, która mieszkasz w ogrodach – przyjaciele zwracają uwagę na twój głos – spraw, abym go usłyszał!"
"Pnp8,14": "Pospiesz się, mój umiłowany, i bądź podobny do sarny albo młodego jelenia na górach pełnych wonności."
