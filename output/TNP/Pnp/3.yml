"Pnp3,1":
  text: "Na swoim łożu nocami szukałam tego, którego miłuje moja dusza. Szukałam go, ale go nie znalazłam."
  tags: []
"Pnp3,2":
  text: "Ach! Wstanę i obiegnę miasto, po ulicach i po placach będę szukać tego, którego miłuje moja dusza. Szukałam go, ale nie znalazłam."
  tags: []
"Pnp3,3":
  text: "Znaleźli mnie strażnicy obchodzący miasto; spytałam ich: Czy widzieliście tego, którego miłuje moja dusza?"
  tags: []
"Pnp3,4":
  text: "Zaledwie minęłam ich, wtedy znalazłam tego, którego miłuje moja dusza. Uchwyciłam go i nie puszczę, aż wprowadzę go do domu mojej matki i do pokoju tej, która mnie poczęła."
  tags: []
"Pnp3,5":
  text: "Błagam was, córki Jerozolimy, na sarny i łanie polne: Nie budźcie i nie rozbudzajcie miłości, dopóki nie zapragnie."
  tags: []
"Pnp3,6":
  text: "Kim jest ta, która od strony pustyni wznosi się niczym słupy dymu, okadzona mirrą i kadzidłem ze wszelkiego wonnego proszku kupca?"
  tags: []
"Pnp3,7":
  text: "Oto lektyka! To jego – Salomona, wokół niej sześćdziesięciu dzielnych spośród dzielnych Izraela."
  tags: []
"Pnp3,8":
  text: "Wszyscy trzymają miecze, doświadczeni w walce. Każdy z nich ma swój miecz u swego boku z powodu zagrożenia w nocy."
  tags: []
"Pnp3,9":
  text: "Ten palankin zrobił sobie król Salomon z drzew Libanu."
  tags: []
"Pnp3,10":
  text: "Jego słupki wykonał ze srebra, jego oparcie ze złota, jego siedzenie z purpury, a wnętrze wyścielone miłością córek Jerozolimy."
  tags: []
"Pnp3,11":
  text: "Wyjdźcie i patrzcie córki Syjonu na króla Salomona w koronie, którą ukoronowała go jego matka w dniu jego zaślubin i w dniu radości jego serca."
  tags: []
