"Pnp3,1": "Na swoim łożu nocami szukałam tego, którego miłuje moja dusza. Szukałam go, ale go nie znalazłam."
"Pnp3,2": "Ach! Wstanę i obiegnę miasto, po ulicach i po placach będę szukać tego, którego miłuje moja dusza. Szukałam go, ale nie znalazłam."
"Pnp3,3": "Znaleźli mnie strażnicy obchodzący miasto; spytałam ich: Czy widzieliście tego, którego miłuje moja dusza?"
"Pnp3,4": "Zaledwie minęłam ich, wtedy znalazłam tego, którego miłuje moja dusza. Uchwyciłam go i nie puszczę, aż wprowadzę go do domu mojej matki i do pokoju tej, która mnie poczęła."
"Pnp3,5": "Błagam was, córki Jerozolimy, na sarny i łanie polne: Nie budźcie i nie rozbudzajcie miłości, dopóki nie zapragnie."
"Pnp3,6": "Kim jest ta, która od strony pustyni wznosi się niczym słupy dymu, okadzona mirrą i kadzidłem ze wszelkiego wonnego proszku kupca?"
"Pnp3,7": "Oto lektyka! To jego – Salomona, wokół niej sześćdziesięciu dzielnych spośród dzielnych Izraela."
"Pnp3,8": "Wszyscy trzymają miecze, doświadczeni w walce. Każdy z nich ma swój miecz u swego boku z powodu zagrożenia w nocy."
"Pnp3,9": "Ten palankin zrobił sobie król Salomon z drzew Libanu."
"Pnp3,10": "Jego słupki wykonał ze srebra, jego oparcie ze złota, jego siedzenie z purpury, a wnętrze wyścielone miłością córek Jerozolimy."
"Pnp3,11": "Wyjdźcie i patrzcie córki Syjonu na króla Salomona w koronie, którą ukoronowała go jego matka w dniu jego zaślubin i w dniu radości jego serca."
