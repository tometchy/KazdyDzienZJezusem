"Pnp7,1":
  text: "Jak piękne są twoje kroki w sandałach, córko książęca! Wypukłości twoich bioder są jak klejnoty, dzieło rąk mistrza."
  tags: []
"Pnp7,2":
  text: "Twoje łono jest jak okrągła czasza, nie zabraknie w niej trunku. Twój brzuch jest jak stóg pszenicy okolony liliami."
  tags: []
"Pnp7,3":
  text: "Dwoje twoich piersi jest jak dwoje sarniąt, bliźniąt gazeli."
  tags: []
"Pnp7,4":
  text: "Twoja szyja jest jak wieża z kości słoniowej; twoje oczy jak sadzawki w Heszbonie tuż przy bramie Bat-Rabbim; twój nos jak wieża Libanu zwrócona w stronę Damaszku."
  tags: []
"Pnp7,5":
  text: "Twoja głowa nad tobą jak Karmel, a pukle twojej głowy jak purpura. Król zaplątany jest w twoich lokach."
  tags: []
"Pnp7,6":
  text: "Jakże jesteś piękna i jak zachwycająca, miłości w twych rozkoszach!"
  tags: []
"Pnp7,7":
  text: "Twoja smukłość jest podobna do palmy, a twoje piersi do pęków daktyli."
  tags: []
"Pnp7,8":
  text: "Powiedziałem sobie: Wespnę się na palmę i zerwę grona jej daktyli. A teraz niech będą twoje piersi jak pęki winogron i woń twojego oddechu jak zapach moreli;"
  tags: []
"Pnp7,9":
  text: "A twoje podniebienie jest jak wyborne wino, które spływa prosto do umiłowanego, zwilżając powoli wargi śpiących."
  tags: []
"Pnp7,10":
  text: "Ja należę do mojego umiłowanego i ku mnie zwraca się jego pożądanie."
  tags: []
"Pnp7,11":
  text: "Chodź, mój umiłowany, wyjdźmy w pole i przenocujemy we wsiach."
  tags: []
"Pnp7,12":
  text: "Rankiem wstaniemy, aby pójść do winnic, zobaczymy, czy zakwitła winorośl, czy otworzył się już pączek kwiatu, czy już rozkwitają granaty. Tam cię obdarzę moją miłością."
  tags: []
"Pnp7,13":
  text: "Mandragory wydały swoją woń, a nad naszym wejściem – wszelkie wspaniałości, nowe, a też stare – przechowałam je, mój umiłowany – dla ciebie."
  tags: []
