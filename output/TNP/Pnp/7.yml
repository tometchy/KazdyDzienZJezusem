"Pnp7,1": "Jak piękne są twoje kroki w sandałach, córko książęca! Wypukłości twoich bioder są jak klejnoty, dzieło rąk mistrza."
"Pnp7,2": "Twoje łono jest jak okrągła czasza, nie zabraknie w niej trunku. Twój brzuch jest jak stóg pszenicy okolony liliami."
"Pnp7,3": "Dwoje twoich piersi jest jak dwoje sarniąt, bliźniąt gazeli."
"Pnp7,4": "Twoja szyja jest jak wieża z kości słoniowej; twoje oczy jak sadzawki w Heszbonie tuż przy bramie Bat-Rabbim; twój nos jak wieża Libanu zwrócona w stronę Damaszku."
"Pnp7,5": "Twoja głowa nad tobą jak Karmel, a pukle twojej głowy jak purpura. Król zaplątany jest w twoich lokach."
"Pnp7,6": "Jakże jesteś piękna i jak zachwycająca, miłości w twych rozkoszach!"
"Pnp7,7": "Twoja smukłość jest podobna do palmy, a twoje piersi do pęków daktyli."
"Pnp7,8": "Powiedziałem sobie: Wespnę się na palmę i zerwę grona jej daktyli. A teraz niech będą twoje piersi jak pęki winogron i woń twojego oddechu jak zapach moreli;"
"Pnp7,9": "A twoje podniebienie jest jak wyborne wino, które spływa prosto do umiłowanego, zwilżając powoli wargi śpiących."
"Pnp7,10": "Ja należę do mojego umiłowanego i ku mnie zwraca się jego pożądanie."
"Pnp7,11": "Chodź, mój umiłowany, wyjdźmy w pole i przenocujemy we wsiach."
"Pnp7,12": "Rankiem wstaniemy, aby pójść do winnic, zobaczymy, czy zakwitła winorośl, czy otworzył się już pączek kwiatu, czy już rozkwitają granaty. Tam cię obdarzę moją miłością."
"Pnp7,13": "Mandragory wydały swoją woń, a nad naszym wejściem – wszelkie wspaniałości, nowe, a też stare – przechowałam je, mój umiłowany – dla ciebie."
