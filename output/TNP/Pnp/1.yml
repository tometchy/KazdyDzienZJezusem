"Pnp1,1": "Pieśń nad pieśniami, która jest od Salomona."
"Pnp1,2": "Niech mnie pocałuje pocałunkami swoich ust. Bo twoje wyrazy miłości są lepsze od wina."
"Pnp1,3": "Zaiste, przyjemna jest woń twoich olejków. Twoje imię jest jak rozlany olejek; dlatego miłują cię dziewczęta."
"Pnp1,4": "Pociągnij mnie za sobą! Pobiegnijmy! Król wprowadził mnie do swoich komnat. Cieszmy się i radujmy się tobą. Będziemy wspominać wyrazy twojej miłości bardziej niż wino. Miłują cię prawi!"
"Pnp1,5": "Ja jestem śniada, ale piękna, córki Jerozolimy, jak namioty Kedaru, jak zasłony namiotu Salomona."
"Pnp1,6": "Nie patrzcie na mnie, że jestem pociemniała, bo opaliło mnie słońce. Synowie mojej matki rozgniewali się na mnie, ustanowili mnie strzegącą winnic; winnicy należącej do mnie – nie ustrzegłam."
"Pnp1,7": "Powiedz mi ty, którego umiłowała moja dusza, gdzie wypasasz? Gdzie dajesz spocząć trzodzie w południe. Bo dlaczego mam być jak ta zasłonięta przy trzodach twoich towarzyszy?"
"Pnp1,8": "Jeśli tego nie wiesz, najpiękniejsza wśród kobiet, podążaj za śladami trzody i paś swoje koźlątka przy namiotach pasterzy."
"Pnp1,9": "Przyrównam cię, moja przyjaciółko, do klaczy w rydwanach faraona."
"Pnp1,10": "Twoje policzki są piękne, wśród złotych plecionek, a twoja szyja – wśród sznuru pereł."
"Pnp1,11": "Uczynimy jeszcze dla ciebie plecionki ze złota nakrapiane srebrem."
"Pnp1,12": "Dopóki król jest przy swoim stole, mój nard wydaje swoją woń."
"Pnp1,13": "Sakiewką mirry jest dla mnie mój umiłowany, ułożoną między moimi piersiami."
"Pnp1,14": "Mój umiłowany jest dla mnie kiścią henny w winnicach En-Gedi."
"Pnp1,15": "O, jakaś ty piękna, moja przyjaciółko! O, jakaś ty piękna! Twoje oczy są jak gołąbki."
"Pnp1,16": "O, jakiś ty jesteś piękny, mój umiłowany, i jakże miły! Jakże łoże nasze się zieleni."
"Pnp1,17": "Belki naszego domu są cedrowe, a nasze stropy – cyprysowe."
