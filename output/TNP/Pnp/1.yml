"Pnp1,1":
  text: "Pieśń nad pieśniami, która jest od Salomona."
  tags: []
"Pnp1,2":
  text: "Niech mnie pocałuje pocałunkami swoich ust. Bo twoje wyrazy miłości są lepsze od wina."
  tags: []
"Pnp1,3":
  text: "Zaiste, przyjemna jest woń twoich olejków. Twoje imię jest jak rozlany olejek; dlatego miłują cię dziewczęta."
  tags: []
"Pnp1,4":
  text: "Pociągnij mnie za sobą! Pobiegnijmy! Król wprowadził mnie do swoich komnat. Cieszmy się i radujmy się tobą. Będziemy wspominać wyrazy twojej miłości bardziej niż wino. Miłują cię prawi!"
  tags: []
"Pnp1,5":
  text: "Ja jestem śniada, ale piękna, córki Jerozolimy, jak namioty Kedaru, jak zasłony namiotu Salomona."
  tags: []
"Pnp1,6":
  text: "Nie patrzcie na mnie, że jestem pociemniała, bo opaliło mnie słońce. Synowie mojej matki rozgniewali się na mnie, ustanowili mnie strzegącą winnic; winnicy należącej do mnie – nie ustrzegłam."
  tags: []
"Pnp1,7":
  text: "Powiedz mi ty, którego umiłowała moja dusza, gdzie wypasasz? Gdzie dajesz spocząć trzodzie w południe. Bo dlaczego mam być jak ta zasłonięta przy trzodach twoich towarzyszy?"
  tags: []
"Pnp1,8":
  text: "Jeśli tego nie wiesz, najpiękniejsza wśród kobiet, podążaj za śladami trzody i paś swoje koźlątka przy namiotach pasterzy."
  tags: []
"Pnp1,9":
  text: "Przyrównam cię, moja przyjaciółko, do klaczy w rydwanach faraona."
  tags: []
"Pnp1,10":
  text: "Twoje policzki są piękne, wśród złotych plecionek, a twoja szyja – wśród sznuru pereł."
  tags: []
"Pnp1,11":
  text: "Uczynimy jeszcze dla ciebie plecionki ze złota nakrapiane srebrem."
  tags: []
"Pnp1,12":
  text: "Dopóki król jest przy swoim stole, mój nard wydaje swoją woń."
  tags: []
"Pnp1,13":
  text: "Sakiewką mirry jest dla mnie mój umiłowany, ułożoną między moimi piersiami."
  tags: []
"Pnp1,14":
  text: "Mój umiłowany jest dla mnie kiścią henny w winnicach En-Gedi."
  tags: []
"Pnp1,15":
  text: "O, jakaś ty piękna, moja przyjaciółko! O, jakaś ty piękna! Twoje oczy są jak gołąbki."
  tags: []
"Pnp1,16":
  text: "O, jakiś ty jesteś piękny, mój umiłowany, i jakże miły! Jakże łoże nasze się zieleni."
  tags: []
"Pnp1,17":
  text: "Belki naszego domu są cedrowe, a nasze stropy – cyprysowe."
  tags: []
