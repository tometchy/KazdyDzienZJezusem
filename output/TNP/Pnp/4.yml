"Pnp4,1":
  text: "O, jaka ty jesteś piękna, moja przyjaciółko! O, jaka ty jesteś piękna! Twoje oczy – jak gołębie spoza twojej zasłony! Twoje włosy – jak stado kóz, zstępujących z góry Gilead."
  tags: []
"Pnp4,2":
  text: "Twoje zęby – jak stado ostrzyżonych owiec, które wyszły z kąpieli – u wszystkich ciąża bliźniacza i nie ma wśród nich pozbawionej potomstwa."
  tags: []
"Pnp4,3":
  text: "Twoje usta – jak wstążka karmazynowa, a twoja mowa pełna wdzięku. Twoja skroń – jak plaster granatu spoza twojej zasłony."
  tags: []
"Pnp4,4":
  text: "Twoja szyja – jak wieża Dawida, zbudowana na zbrojownię – tysiąc puklerzy wiszących na niej, wszystko to tarcze dzielnych wojowników."
  tags: []
"Pnp4,5":
  text: "Twoje piersi są jak dwoje sarniąt bliźniąt gazeli, pasących się między liliami."
  tags: []
"Pnp4,6":
  text: "Póki wieje wiatr za dnia i uciekają cienie, pójdę na górę mirry i na wzgórze kadzidła."
  tags: []
"Pnp4,7":
  text: "Cała jesteś piękna, moja przyjaciółko, i nie ma w tobie żadnej skazy."
  tags: []
"Pnp4,8":
  text: "Przyjdź ze mną z Libanu, moja oblubienico, przyjdź ze mną z Libanu. Zstąp ze szczytu Amana, ze szczytu Seniru i Hermonu, od strony lwich legowisk, z gór lampartów."
  tags: []
"Pnp4,9":
  text: "Zachwyciłaś moje serce, moja siostro, moja oblubienico! Zachwyciłaś moje serce jednym twoim spojrzeniem oczu i jednym łańcuszkiem na twojej szyi."
  tags: []
"Pnp4,10":
  text: "Jakże piękna jest twoja miłość, moja siostro, moja oblubienico! Jak rozkoszne są twoje wyrazy miłości, lepsze od wina, a woń twoich olejków lepsza od wszystkich innych wonności!"
  tags: []
"Pnp4,11":
  text: "Twoje wargi ociekają płynnym miodem, moja oblubienico! Miód i mleko są pod twoim językiem, a woń twoich szat jest jak woń Libanu."
  tags: []
"Pnp4,12":
  text: "Jesteś zamkniętym ogrodem, moja siostro, moja oblubienico; źródłem zamkniętym, zdrojem zapieczętowanym."
  tags: []
"Pnp4,13":
  text: "Twoje pędy to sad drzew granatu z wybornym owocem henny wraz z nardem;"
  tags: []
"Pnp4,14":
  text: "Nard i szafran! Trzcina i cynamon – z wszelkimi drzewami kadzidła! Mirra i aloes – z wszelkimi najlepszymi wonnościami."
  tags: []
"Pnp4,15":
  text: "Źródło ogrodów, zdroju żywych wód, płynących z Libanu!"
  tags: []
"Pnp4,16":
  text: "Zbudź się wietrze północny! I przyjdź, wietrze południa! Przewiej mój ogród, niech rozpłyną się jego wonności. Niech przyjdzie mój umiłowany do swojego ogrodu i niech je jego wyborne owoce."
  tags: []
