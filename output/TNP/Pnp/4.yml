"Pnp4,1": "O, jaka ty jesteś piękna, moja przyjaciółko! O, jaka ty jesteś piękna! Twoje oczy – jak gołębie spoza twojej zasłony! Twoje włosy – jak stado kóz, zstępujących z góry Gilead."
"Pnp4,2": "Twoje zęby – jak stado ostrzyżonych owiec, które wyszły z kąpieli – u wszystkich ciąża bliźniacza i nie ma wśród nich pozbawionej potomstwa."
"Pnp4,3": "Twoje usta – jak wstążka karmazynowa, a twoja mowa pełna wdzięku. Twoja skroń – jak plaster granatu spoza twojej zasłony."
"Pnp4,4": "Twoja szyja – jak wieża Dawida, zbudowana na zbrojownię – tysiąc puklerzy wiszących na niej, wszystko to tarcze dzielnych wojowników."
"Pnp4,5": "Twoje piersi są jak dwoje sarniąt bliźniąt gazeli, pasących się między liliami."
"Pnp4,6": "Póki wieje wiatr za dnia i uciekają cienie, pójdę na górę mirry i na wzgórze kadzidła."
"Pnp4,7": "Cała jesteś piękna, moja przyjaciółko, i nie ma w tobie żadnej skazy."
"Pnp4,8": "Przyjdź ze mną z Libanu, moja oblubienico, przyjdź ze mną z Libanu. Zstąp ze szczytu Amana, ze szczytu Seniru i Hermonu, od strony lwich legowisk, z gór lampartów."
"Pnp4,9": "Zachwyciłaś moje serce, moja siostro, moja oblubienico! Zachwyciłaś moje serce jednym twoim spojrzeniem oczu i jednym łańcuszkiem na twojej szyi."
"Pnp4,10": "Jakże piękna jest twoja miłość, moja siostro, moja oblubienico! Jak rozkoszne są twoje wyrazy miłości, lepsze od wina, a woń twoich olejków lepsza od wszystkich innych wonności!"
"Pnp4,11": "Twoje wargi ociekają płynnym miodem, moja oblubienico! Miód i mleko są pod twoim językiem, a woń twoich szat jest jak woń Libanu."
"Pnp4,12": "Jesteś zamkniętym ogrodem, moja siostro, moja oblubienico; źródłem zamkniętym, zdrojem zapieczętowanym."
"Pnp4,13": "Twoje pędy to sad drzew granatu z wybornym owocem henny wraz z nardem;"
"Pnp4,14": "Nard i szafran! Trzcina i cynamon – z wszelkimi drzewami kadzidła! Mirra i aloes – z wszelkimi najlepszymi wonnościami."
"Pnp4,15": "Źródło ogrodów, zdroju żywych wód, płynących z Libanu!"
"Pnp4,16": "Zbudź się wietrze północny! I przyjdź, wietrze południa! Przewiej mój ogród, niech rozpłyną się jego wonności. Niech przyjdzie mój umiłowany do swojego ogrodu i niech je jego wyborne owoce."
