"Pnp2,1": "Ja jestem różą Szaronu i lilią dolin."
"Pnp2,2": "Jak lilia między cierniami, tak moja przyjaciółka między córkami."
"Pnp2,3": "Jak jabłoń wśród leśnych drzew, tak mój umiłowany między synami. Bardzo zapragnęłam zostać i usiąść w jego cieniu, bo jego owoc jest słodki dla mojego podniebienia."
"Pnp2,4": "Wprowadził mnie do domu wina, a jego sztandarem nade mną jest miłość."
"Pnp2,5": "Posilcie mnie plackami z rodzynkami, pokrzepcie mnie jabłkami, bo ja jestem chora z miłości."
"Pnp2,6": "Jego lewa ręka jest pod moją głową, a jego prawa ręka mnie obejmuje."
"Pnp2,7": "Błagam was, córki Jerozolimy, na sarny i łanie polne: Nie budźcie i nie rozbudzajcie miłości, dopóki nie zapragnie."
"Pnp2,8": "Głos mojego umiłowanego! Oto teraz nadchodzi! Skacze po górach i podskakuje po pagórkach."
"Pnp2,9": "Mój umiłowany podobny jest do sarny albo młodego jelenia. Oto on stoi za naszym murem, przypatruje się przez okna, zerka przez kraty."
"Pnp2,10": "Mój umiłowany odpowiedział i rzekł do mnie: Wstań, moja przyjaciółko, moja piękna i chodź za mną!"
"Pnp2,11": "Bo oto minęła zima, deszcz ustał – odszedł sobie."
"Pnp2,12": "Kwiaty pokazały się na ziemi, nadszedł czas pieśni i głos synogarlicy słychać w naszej ziemi."
"Pnp2,13": "Na figowcu dojrzewa już wczesna figa, a winorośle? Ich kwiat wydaje swoją woń. Wstań, chodź moja przyjaciółko, moja piękna – i chodź za mną!"
"Pnp2,14": "Moja gołąbko, z rozpadlin skalnych, z kryjówek stromizn górskich, pokaż mi swoją postać, daj mi usłyszeć twój głos, bo głos twój jest słodki, a twoja postać zachwycająca."
"Pnp2,15": "Schwytajcie nam lisy, małe liski, które psują winnice, bo nasze winnice kwitną!"
"Pnp2,16": "Mój umiłowany jest mój, a ja jestem jego. Pasie on wśród lilii."
"Pnp2,17": "Póki wieje wiatr za dnia i uciekają cienie, wróć, mój umiłowany, bądź jak sarna albo młode jelenie na górach Beter."
