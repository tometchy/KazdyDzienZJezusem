"Pnp2,1":
  text: "Ja jestem różą Szaronu i lilią dolin."
  tags: []
"Pnp2,2":
  text: "Jak lilia między cierniami, tak moja przyjaciółka między córkami."
  tags: []
"Pnp2,3":
  text: "Jak jabłoń wśród leśnych drzew, tak mój umiłowany między synami. Bardzo zapragnęłam zostać i usiąść w jego cieniu, bo jego owoc jest słodki dla mojego podniebienia."
  tags: []
"Pnp2,4":
  text: "Wprowadził mnie do domu wina, a jego sztandarem nade mną jest miłość."
  tags: []
"Pnp2,5":
  text: "Posilcie mnie plackami z rodzynkami, pokrzepcie mnie jabłkami, bo ja jestem chora z miłości."
  tags: []
"Pnp2,6":
  text: "Jego lewa ręka jest pod moją głową, a jego prawa ręka mnie obejmuje."
  tags: []
"Pnp2,7":
  text: "Błagam was, córki Jerozolimy, na sarny i łanie polne: Nie budźcie i nie rozbudzajcie miłości, dopóki nie zapragnie."
  tags: []
"Pnp2,8":
  text: "Głos mojego umiłowanego! Oto teraz nadchodzi! Skacze po górach i podskakuje po pagórkach."
  tags: []
"Pnp2,9":
  text: "Mój umiłowany podobny jest do sarny albo młodego jelenia. Oto on stoi za naszym murem, przypatruje się przez okna, zerka przez kraty."
  tags: []
"Pnp2,10":
  text: "Mój umiłowany odpowiedział i rzekł do mnie: Wstań, moja przyjaciółko, moja piękna i chodź za mną!"
  tags: []
"Pnp2,11":
  text: "Bo oto minęła zima, deszcz ustał – odszedł sobie."
  tags: []
"Pnp2,12":
  text: "Kwiaty pokazały się na ziemi, nadszedł czas pieśni i głos synogarlicy słychać w naszej ziemi."
  tags: []
"Pnp2,13":
  text: "Na figowcu dojrzewa już wczesna figa, a winorośle? Ich kwiat wydaje swoją woń. Wstań, chodź moja przyjaciółko, moja piękna – i chodź za mną!"
  tags: []
"Pnp2,14":
  text: "Moja gołąbko, z rozpadlin skalnych, z kryjówek stromizn górskich, pokaż mi swoją postać, daj mi usłyszeć twój głos, bo głos twój jest słodki, a twoja postać zachwycająca."
  tags: []
"Pnp2,15":
  text: "Schwytajcie nam lisy, małe liski, które psują winnice, bo nasze winnice kwitną!"
  tags: []
"Pnp2,16":
  text: "Mój umiłowany jest mój, a ja jestem jego. Pasie on wśród lilii."
  tags: []
"Pnp2,17":
  text: "Póki wieje wiatr za dnia i uciekają cienie, wróć, mój umiłowany, bądź jak sarna albo młode jelenie na górach Beter."
  tags: []
