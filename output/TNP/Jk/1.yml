"Jk1,1": "Jakub, sługa Boga i Pana Jezusa Chrystusa, do dwunastu pokoleń, które są w rozproszeniu. Pozdrowienie."
"Jk1,2": "Uznaliście, bracia moi, za pełną radość, gdy wpadliście w rozmaite doświadczenia,"
"Jk1,3": "Wiedząc, że wypróbowanie waszej wiary sprawia wytrwałość;"
"Jk1,4": "A wytrwałość niech prowadzi do dzieła doskonałego, abyście byli dojrzali i w pełni wyposażeni, w niczym nie odczuwający braków."
"Jk1,5": "A jeśli ktoś z was odczuwa brak mądrości, niech prosi Boga, który daje ją wszystkim szczodrze i bez wyrzutów, a będzie mu dana."
"Jk1,6": "Jednak niech prosi z wiarą, nie wątpiąc; kto bowiem wątpi, przypomina falę morską, gnaną i miotaną tu i tam przez wiatr."
"Jk1,7": "Niech taki człowiek nie myśli, że otrzyma coś od Pana;"
"Jk1,8": "Mąż o rozdwojonej duszy, niestały na wszystkich swoich drogach."
"Jk1,9": "A niech uniżony brat chlubi się w swoim wywyższeniu,"
"Jk1,10": "Bogaty natomiast w swoim uniżeniu; że jak kwiat trawy przeminie."
"Jk1,11": "Albowiem wzeszło palące słońce i wysuszyło trawę, a kwiat jej opadł, i zginęło piękno jego oblicza; tak i bogaty zwiędnie na swoich drogach."
"Jk1,12": "Błogosławiony mąż, który znosi próbę; który został wypróbowany, gdyż otrzyma wieniec życia, który obiecał PAN tym, którzy Go miłują."
"Jk1,13": "Niech nikt, gdy jest poddawany pokusie, nie mówi: Przez Boga jestem kuszony; bo Bóg nie jest podatny na kuszenie ze strony zła ani sam nikogo nie kusi;"
"Jk1,14": "Ale każdy jest kuszony przez własne pożądliwości, które go pociągają i nęcą."
"Jk1,15": "Potem, gdy pożądliwość pocznie, rodzi grzech, a gdy grzech dojrzeje, rodzi śmierć."
"Jk1,16": "Nie dawajcie się zwodzić, moi umiłowani bracia!"
"Jk1,17": "Wszelki dobry podarunek i wszelki dar doskonały zstępuje z góry od Ojca świateł, u którego nie istnieje zmienność lub cień poruszenia."
"Jk1,18": "Gdy zechciał, zrodził nas Słowem Prawdy, abyśmy byli niejako pierwociną Jego stworzeń."
"Jk1,19": "A tak, bracia moi umiłowani, niech każdy człowiek będzie skory do słuchania, nieskory do mówienia, nieskory do gniewu,"
"Jk1,20": "Bo gniew męża nie wykonuje sprawiedliwości Boga."
"Jk1,21": "Dlatego odrzućcie wszelką plugawość i obfitość złości, przyjmijcie z łagodnością wszczepione w was Słowo, które jest w stanie zbawić wasze dusze."
"Jk1,22": "A stawajcie się wykonawcami Słowa, a nie tylko słuchaczami, oszukującymi samych siebie."
"Jk1,23": "Albowiem jeśli ktoś jest słuchaczem Słowa, a nie wykonawcą, ten podobny jest do człowieka, który przygląda się w zwierciadle swojemu naturalnemu obliczu;"
"Jk1,24": "Bo przyjrzał się sobie i odszedł, i natychmiast zapomniał jakim był."
"Jk1,25": "Ale kto wejrzał w doskonałe Prawo wolności i trwa w nim, ten nie jest słuchaczem zapominającym, lecz wykonawcą dzieła, ten będzie błogosławiony w swoim działaniu."
"Jk1,26": "Jeśli ktoś pośród was uważa, że jest pobożny, a nie powściąga swojego języka, lecz oszukuje swoje serce, tego pobożność jest próżna."
"Jk1,27": "Czystą i nieskalaną pobożnością przed Bogiem i Ojcem jest to: troszczyć się o sieroty i wdowy w ich ucisku, i strzec siebie samego przed skalaniem przez świat."
