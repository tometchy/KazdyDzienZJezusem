"Jk1,1":
  text: "Jakub, sługa Boga i Pana Jezusa Chrystusa, do dwunastu pokoleń, które są w rozproszeniu. Pozdrowienie."
  tags: []
"Jk1,2":
  text: "Uznaliście, bracia moi, za pełną radość, gdy wpadliście w rozmaite doświadczenia,"
  tags: []
"Jk1,3":
  text: "Wiedząc, że wypróbowanie waszej wiary sprawia wytrwałość;"
  tags: []
"Jk1,4":
  text: "A wytrwałość niech prowadzi do dzieła doskonałego, abyście byli dojrzali i w pełni wyposażeni, w niczym nie odczuwający braków."
  tags: []
"Jk1,5":
  text: "A jeśli ktoś z was odczuwa brak mądrości, niech prosi Boga, który daje ją wszystkim szczodrze i bez wyrzutów, a będzie mu dana."
  tags: []
"Jk1,6":
  text: "Jednak niech prosi z wiarą, nie wątpiąc; kto bowiem wątpi, przypomina falę morską, gnaną i miotaną tu i tam przez wiatr."
  tags: []
"Jk1,7":
  text: "Niech taki człowiek nie myśli, że otrzyma coś od Pana;"
  tags: []
"Jk1,8":
  text: "Mąż o rozdwojonej duszy, niestały na wszystkich swoich drogach."
  tags: []
"Jk1,9":
  text: "A niech uniżony brat chlubi się w swoim wywyższeniu,"
  tags: []
"Jk1,10":
  text: "Bogaty natomiast w swoim uniżeniu; że jak kwiat trawy przeminie."
  tags: []
"Jk1,11":
  text: "Albowiem wzeszło palące słońce i wysuszyło trawę, a kwiat jej opadł, i zginęło piękno jego oblicza; tak i bogaty zwiędnie na swoich drogach."
  tags: []
"Jk1,12":
  text: "Błogosławiony mąż, który znosi próbę; który został wypróbowany, gdyż otrzyma wieniec życia, który obiecał PAN tym, którzy Go miłują."
  tags: []
"Jk1,13":
  text: "Niech nikt, gdy jest poddawany pokusie, nie mówi: Przez Boga jestem kuszony; bo Bóg nie jest podatny na kuszenie ze strony zła ani sam nikogo nie kusi;"
  tags: []
"Jk1,14":
  text: "Ale każdy jest kuszony przez własne pożądliwości, które go pociągają i nęcą."
  tags: []
"Jk1,15":
  text: "Potem, gdy pożądliwość pocznie, rodzi grzech, a gdy grzech dojrzeje, rodzi śmierć."
  tags: []
"Jk1,16":
  text: "Nie dawajcie się zwodzić, moi umiłowani bracia!"
  tags: []
"Jk1,17":
  text: "Wszelki dobry podarunek i wszelki dar doskonały zstępuje z góry od Ojca świateł, u którego nie istnieje zmienność lub cień poruszenia."
  tags: []
"Jk1,18":
  text: "Gdy zechciał, zrodził nas Słowem Prawdy, abyśmy byli niejako pierwociną Jego stworzeń."
  tags: []
"Jk1,19":
  text: "A tak, bracia moi umiłowani, niech każdy człowiek będzie skory do słuchania, nieskory do mówienia, nieskory do gniewu,"
  tags: []
"Jk1,20":
  text: "Bo gniew męża nie wykonuje sprawiedliwości Boga."
  tags: []
"Jk1,21":
  text: "Dlatego odrzućcie wszelką plugawość i obfitość złości, przyjmijcie z łagodnością wszczepione w was Słowo, które jest w stanie zbawić wasze dusze."
  tags: []
"Jk1,22":
  text: "A stawajcie się wykonawcami Słowa, a nie tylko słuchaczami, oszukującymi samych siebie."
  tags: []
"Jk1,23":
  text: "Albowiem jeśli ktoś jest słuchaczem Słowa, a nie wykonawcą, ten podobny jest do człowieka, który przygląda się w zwierciadle swojemu naturalnemu obliczu;"
  tags: []
"Jk1,24":
  text: "Bo przyjrzał się sobie i odszedł, i natychmiast zapomniał jakim był."
  tags: []
"Jk1,25":
  text: "Ale kto wejrzał w doskonałe Prawo wolności i trwa w nim, ten nie jest słuchaczem zapominającym, lecz wykonawcą dzieła, ten będzie błogosławiony w swoim działaniu."
  tags: []
"Jk1,26":
  text: "Jeśli ktoś pośród was uważa, że jest pobożny, a nie powściąga swojego języka, lecz oszukuje swoje serce, tego pobożność jest próżna."
  tags: []
"Jk1,27":
  text: "Czystą i nieskalaną pobożnością przed Bogiem i Ojcem jest to: troszczyć się o sieroty i wdowy w ich ucisku, i strzec siebie samego przed skalaniem przez świat."
  tags: []
