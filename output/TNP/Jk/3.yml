"Jk3,1": "Niech niewielu z was staje się nauczycielami, bracia moi, gdyż wiecie, że surowszy otrzymacie wyrok."
"Jk3,2": "My wszyscy bowiem potykamy się w wielu sprawach; jeśli ktoś w mowie się nie potyka, ten jest mężem doskonałym, który i całe ciało może trzymać na wodzy."
"Jk3,3": "Oto koniom wkładamy wędzidła w pyski, aby były nam posłuszne i kierujemy całym ich ciałem."
"Jk3,4": "Oto i okręty, choć są tak wielkie i pędzone silnymi wiatrami, jednak są kierowane bardzo małym sterem tam, dokąd chce ruch ręki sternika."
"Jk3,5": "Tak i język, małym jest członkiem, a bardzo się wynosi. Oto mały ogień, a jak wielki las podpala!"
"Jk3,6": "I ten język jest ogniem; język jest światem nieprawości, umieszczany wśród naszych członków, tym co kala całe nasze ciało i rozpala krąg naturalnych skłonności, sam będąc rozpalany przez Gehennę."
"Jk3,7": "Wszelka bowiem natura dzikich zwierząt i ptaków, i gadów, i stworzeń morskich jest poskramiana i jest poskromiona przez naturę człowieka;"
"Jk3,8": "Ale nikt z ludzi nie może poskromić języka; zło to nieposkromione, pełne śmiertelnego jadu."
"Jk3,9": "Nim wysławiamy Boga i Ojca, i nim przeklinamy ludzi, stworzonych na podobieństwo Boga."
"Jk3,10": "Z tych samych ust wychodzi błogosławieństwo i przekleństwo. Nie może tak być, bracia moi."
"Jk3,11": "Czy źródło z tej samej szczeliny tryska słodką i gorzką wodą?"
"Jk3,12": "Czy może, bracia moi, figowiec wydawać oliwki albo winorośl figi? Tak też żadne źródło nie może wydać słonej i słodkiej wody."
"Jk3,13": "Kto jest mądry i rozumny pośród was, niech to pokaże czynami wypływającymi z jego dobrego postępowania w łagodnej mądrości."
"Jk3,14": "Ale jeśli macie gorzką zazdrość i kłótliwość w swoim sercu, nie wynoście się i nie kłamcie wbrew prawdzie."
"Jk3,15": "Nie jest to mądrość zstępująca z góry, ale ziemska, zmysłowa, demoniczna."
"Jk3,16": "Bo gdzie jest zazdrość i kłótliwość, tam zamieszanie i wszelka podła sprawa."
"Jk3,17": "Ale mądrość, która jest z góry, najpierw jest prawdziwie czysta, następnie pokojowo usposobiona, łagodna, dająca się przekonać, pełna miłosierdzia i dobrych owoców, bezstronna i nieobłudna."
"Jk3,18": "Ale owoc sprawiedliwości zasiewany jest w pokoju tym, którzy czynią pokój."
