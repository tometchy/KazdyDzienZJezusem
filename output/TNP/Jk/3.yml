"Jk3,1":
  text: "Niech niewielu z was staje się nauczycielami, bracia moi, gdyż wiecie, że surowszy otrzymacie wyrok."
  tags: []
"Jk3,2":
  text: "My wszyscy bowiem potykamy się w wielu sprawach; jeśli ktoś w mowie się nie potyka, ten jest mężem doskonałym, który i całe ciało może trzymać na wodzy."
  tags: []
"Jk3,3":
  text: "Oto koniom wkładamy wędzidła w pyski, aby były nam posłuszne i kierujemy całym ich ciałem."
  tags: []
"Jk3,4":
  text: "Oto i okręty, choć są tak wielkie i pędzone silnymi wiatrami, jednak są kierowane bardzo małym sterem tam, dokąd chce ruch ręki sternika."
  tags: []
"Jk3,5":
  text: "Tak i język, małym jest członkiem, a bardzo się wynosi. Oto mały ogień, a jak wielki las podpala!"
  tags: []
"Jk3,6":
  text: "I ten język jest ogniem; język jest światem nieprawości, umieszczany wśród naszych członków, tym co kala całe nasze ciało i rozpala krąg naturalnych skłonności, sam będąc rozpalany przez Gehennę."
  tags: []
"Jk3,7":
  text: "Wszelka bowiem natura dzikich zwierząt i ptaków, i gadów, i stworzeń morskich jest poskramiana i jest poskromiona przez naturę człowieka;"
  tags: []
"Jk3,8":
  text: "Ale nikt z ludzi nie może poskromić języka; zło to nieposkromione, pełne śmiertelnego jadu."
  tags: []
"Jk3,9":
  text: "Nim wysławiamy Boga i Ojca, i nim przeklinamy ludzi, stworzonych na podobieństwo Boga."
  tags: []
"Jk3,10":
  text: "Z tych samych ust wychodzi błogosławieństwo i przekleństwo. Nie może tak być, bracia moi."
  tags: []
"Jk3,11":
  text: "Czy źródło z tej samej szczeliny tryska słodką i gorzką wodą?"
  tags: []
"Jk3,12":
  text: "Czy może, bracia moi, figowiec wydawać oliwki albo winorośl figi? Tak też żadne źródło nie może wydać słonej i słodkiej wody."
  tags: []
"Jk3,13":
  text: "Kto jest mądry i rozumny pośród was, niech to pokaże czynami wypływającymi z jego dobrego postępowania w łagodnej mądrości."
  tags: []
"Jk3,14":
  text: "Ale jeśli macie gorzką zazdrość i kłótliwość w swoim sercu, nie wynoście się i nie kłamcie wbrew prawdzie."
  tags: []
"Jk3,15":
  text: "Nie jest to mądrość zstępująca z góry, ale ziemska, zmysłowa, demoniczna."
  tags: []
"Jk3,16":
  text: "Bo gdzie jest zazdrość i kłótliwość, tam zamieszanie i wszelka podła sprawa."
  tags: []
"Jk3,17":
  text: "Ale mądrość, która jest z góry, najpierw jest prawdziwie czysta, następnie pokojowo usposobiona, łagodna, dająca się przekonać, pełna miłosierdzia i dobrych owoców, bezstronna i nieobłudna."
  tags: []
"Jk3,18":
  text: "Ale owoc sprawiedliwości zasiewany jest w pokoju tym, którzy czynią pokój."
  tags: []
