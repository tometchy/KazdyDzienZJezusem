"Jk4,1": "Skąd wojny i skąd walki pośród was? Czy nie pochodzą one z waszych namiętności, które walczą w waszych członkach?"
"Jk4,2": "Pożądacie, a nie macie; mordujecie i zazdrościcie, a nie możecie osiągnąć; wojujecie i walczycie; nie macie jednak z powodu tego, że nie prosicie."
"Jk4,3": "Prosicie, a nie otrzymujecie, dlatego że źle prosicie, zamierzając to wydać na wasze namiętności."
"Jk4,4": "Cudzołożnicy i cudzołożnice! Czy nie wiecie, że przyjaźń ze światem jest wrogością wobec Boga? Jeśli więc ktoś chce być przyjazny wobec tego świata, staje się nieprzyjazny wobec Boga."
"Jk4,5": "Albo czy wydaje się wam, że na próżno Pismo mówi: Do granic zazdrości tęskni za duchem, któremu dał w nas mieszkanie."
"Jk4,6": "Większą jednak daje łaskę, dlatego mówi: Bóg przeciwstawia się pysznym, a pokornym daje łaskę."
"Jk4,7": "Poddajcie się więc Bogu, przeciwstawcie się diabłu, a ucieknie od was."
"Jk4,8": "Przybliżcie się do Boga, a przybliży się do was. Obmyjcie ręce grzesznicy i oczyśćcie serca, ludzie o rozdwojonej duszy."
"Jk4,9": "Uznajcie swoją nędzę i zasmućcie się, i płaczcie; wasz śmiech niech obróci się w żałość, a radość w smutek."
"Jk4,10": "Uniżcie się przed obliczem PANA, a wywyższy was."
"Jk4,11": "Nie obmawiajcie jedni drugich, bracia; kto obmawia brata i osądza swojego brata, obmawia Prawo i osądza Prawo; a jeśli osądzasz Prawo, nie jesteś wykonawcą Prawa, ale sędzią."
"Jk4,12": "Jeden jest Prawodawca, który może zbawić i zgubić. Kim ty jesteś, że osądzasz innych?"
"Jk4,13": "A teraz wy, którzy mówicie: Dziś albo jutro pójdziemy do tego miasta i będziemy działać tam przez jeden rok, i będziemy handlować i ciągnąć zyski;"
"Jk4,14": "Wy, którzy nie wiecie, co będzie jutro; bo czym jest wasze życie? Parą bowiem jest, która na krótko się ukazuje, a następnie staje się niewidoczna."
"Jk4,15": "Zamiast tego, powinniście mówić: Jeśli Pan będzie chciał, to będziemy żyć i uczynimy to lub owo."
"Jk4,16": "A wy tymczasem chlubicie się swoimi przechwałkami; wszelka taka chełpliwość jest zła."
"Jk4,17": "Kto więc wie, jak dobrze czynić, a nie czyni, ma grzech."
