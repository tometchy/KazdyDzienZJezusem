"Jk4,1":
  text: "Skąd wojny i skąd walki pośród was? Czy nie pochodzą one z waszych namiętności, które walczą w waszych członkach?"
  tags: []
"Jk4,2":
  text: "Pożądacie, a nie macie; mordujecie i zazdrościcie, a nie możecie osiągnąć; wojujecie i walczycie; nie macie jednak z powodu tego, że nie prosicie."
  tags: []
"Jk4,3":
  text: "Prosicie, a nie otrzymujecie, dlatego że źle prosicie, zamierzając to wydać na wasze namiętności."
  tags: []
"Jk4,4":
  text: "Cudzołożnicy i cudzołożnice! Czy nie wiecie, że przyjaźń ze światem jest wrogością wobec Boga? Jeśli więc ktoś chce być przyjazny wobec tego świata, staje się nieprzyjazny wobec Boga."
  tags: []
"Jk4,5":
  text: "Albo czy wydaje się wam, że na próżno Pismo mówi: Do granic zazdrości tęskni za duchem, któremu dał w nas mieszkanie."
  tags: []
"Jk4,6":
  text: "Większą jednak daje łaskę, dlatego mówi: Bóg przeciwstawia się pysznym, a pokornym daje łaskę."
  tags: []
"Jk4,7":
  text: "Poddajcie się więc Bogu, przeciwstawcie się diabłu, a ucieknie od was."
  tags: []
"Jk4,8":
  text: "Przybliżcie się do Boga, a przybliży się do was. Obmyjcie ręce grzesznicy i oczyśćcie serca, ludzie o rozdwojonej duszy."
  tags: []
"Jk4,9":
  text: "Uznajcie swoją nędzę i zasmućcie się, i płaczcie; wasz śmiech niech obróci się w żałość, a radość w smutek."
  tags: []
"Jk4,10":
  text: "Uniżcie się przed obliczem PANA, a wywyższy was."
  tags: []
"Jk4,11":
  text: "Nie obmawiajcie jedni drugich, bracia; kto obmawia brata i osądza swojego brata, obmawia Prawo i osądza Prawo; a jeśli osądzasz Prawo, nie jesteś wykonawcą Prawa, ale sędzią."
  tags: []
"Jk4,12":
  text: "Jeden jest Prawodawca, który może zbawić i zgubić. Kim ty jesteś, że osądzasz innych?"
  tags: []
"Jk4,13":
  text: "A teraz wy, którzy mówicie: Dziś albo jutro pójdziemy do tego miasta i będziemy działać tam przez jeden rok, i będziemy handlować i ciągnąć zyski;"
  tags: []
"Jk4,14":
  text: "Wy, którzy nie wiecie, co będzie jutro; bo czym jest wasze życie? Parą bowiem jest, która na krótko się ukazuje, a następnie staje się niewidoczna."
  tags: []
"Jk4,15":
  text: "Zamiast tego, powinniście mówić: Jeśli Pan będzie chciał, to będziemy żyć i uczynimy to lub owo."
  tags: []
"Jk4,16":
  text: "A wy tymczasem chlubicie się swoimi przechwałkami; wszelka taka chełpliwość jest zła."
  tags: []
"Jk4,17":
  text: "Kto więc wie, jak dobrze czynić, a nie czyni, ma grzech."
  tags: []
