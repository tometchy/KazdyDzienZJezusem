"Hbr3,1":
  text: "Dlatego też, bracia święci, uczestnicy powołania niebiańskiego, patrzcie uważnie na apostoła i arcykapłana naszego wyznania, Jezusa Chrystusa,"
  tags: []
"Hbr3,2":
  text: "Wiernego Temu, który Go ustanowił, podobnie jak Mojżesz był wierny w całym Jego domu."
  tags: []
"Hbr3,3":
  text: "Bo ten uznany jest za godnego większej chwały od Mojżesza, o ile większą cześć ma od domu, ten który go zbudował."
  tags: []
"Hbr3,4":
  text: "Bo każdy dom jest przez kogoś budowany, ale Tym, który wszystkie zbudował jest Bóg."
  tags: []
"Hbr3,5":
  text: "A Mojżesz był wierny w całym Jego domu jako sługa, na świadectwo tego, co miało zostać powiedziane,"
  tags: []
"Hbr3,6":
  text: "Lecz Chrystus jest jako Syn w swoim domu; domem Jego my jesteśmy, jeśli tylko ufną odwagę i chlubę z nadziei zachowamy niewzruszenie aż do końca."
  tags: []
"Hbr3,7":
  text: "Dlatego, jak mówi Duch Święty: Dziś, jeślibyście usłyszeli Jego głos,"
  tags: []
"Hbr3,8":
  text: "Nie zatwardzajcie waszych serc, jak podczas buntu, w dzień próby na pustyni,"
  tags: []
"Hbr3,9":
  text: "Gdzie ojcowie wasi doświadczyli mnie, wystawiając mnie na próbę i widzieli moje dzieła przez czterdzieści lat."
  tags: []
"Hbr3,10":
  text: "Dlatego rozgniewałem się na to pokolenie i powiedziałem: Zawsze błądzą sercem; nie poznali też moich dróg."
  tags: []
"Hbr3,11":
  text: "Więc przysiągłem w moim gniewie: Nie wejdą do mojego odpocznienia."
  tags: []
"Hbr3,12":
  text: "Patrzcie, bracia, żeby czasem w kimś z was nie było złego serca niewiary, przez odstąpienie od Boga żywego;"
  tags: []
"Hbr3,13":
  text: "Ale zachęcajcie jedni drugich każdego dnia, dopóki trwa to, co nazywa się „Dzisiaj”, aby ktoś z was nie dał się zatwardzić zwiedzeniem grzechu."
  tags: []
"Hbr3,14":
  text: "Staliśmy się bowiem uczestnikami Chrystusa, jeśli niewzruszenie aż do końca zachowamy początek tego fundamentu."
  tags: []
"Hbr3,15":
  text: "Kiedy mówi: Dziś, jeślibyście usłyszeli Jego głos, nie zatwardzajcie waszych serc, jak podczas buntu,"
  tags: []
"Hbr3,16":
  text: "Ci bowiem, gdy usłyszeli, zbuntowali się, lecz nie wszyscy z tych, którzy wyszli z Egiptu prowadzeni przez Mojżesza."
  tags: []
"Hbr3,17":
  text: "A na kogo gniewał się przez czterdzieści lat? Czyż nie na tych, którzy zgrzeszyli, których zwłoki legły na pustyni?"
  tags: []
"Hbr3,18":
  text: "Komu natomiast przysiągł, że nie wejdą do Jego odpocznienia, jeśli nie tym, którzy byli nieposłuszni?"
  tags: []
"Hbr3,19":
  text: "Widzimy więc, że nie mogli wejść z powodu niewiary."
  tags: []
