"Hbr3,1": "Dlatego też, bracia święci, uczestnicy powołania niebiańskiego, patrzcie uważnie na apostoła i arcykapłana naszego wyznania, Jezusa Chrystusa,"
"Hbr3,2": "Wiernego Temu, który Go ustanowił, podobnie jak Mojżesz był wierny w całym Jego domu."
"Hbr3,3": "Bo ten uznany jest za godnego większej chwały od Mojżesza, o ile większą cześć ma od domu, ten który go zbudował."
"Hbr3,4": "Bo każdy dom jest przez kogoś budowany, ale Tym, który wszystkie zbudował jest Bóg."
"Hbr3,5": "A Mojżesz był wierny w całym Jego domu jako sługa, na świadectwo tego, co miało zostać powiedziane,"
"Hbr3,6": "Lecz Chrystus jest jako Syn w swoim domu; domem Jego my jesteśmy, jeśli tylko ufną odwagę i chlubę z nadziei zachowamy niewzruszenie aż do końca."
"Hbr3,7": "Dlatego, jak mówi Duch Święty: Dziś, jeślibyście usłyszeli Jego głos,"
"Hbr3,8": "Nie zatwardzajcie waszych serc, jak podczas buntu, w dzień próby na pustyni,"
"Hbr3,9": "Gdzie ojcowie wasi doświadczyli mnie, wystawiając mnie na próbę i widzieli moje dzieła przez czterdzieści lat."
"Hbr3,10": "Dlatego rozgniewałem się na to pokolenie i powiedziałem: Zawsze błądzą sercem; nie poznali też moich dróg."
"Hbr3,11": "Więc przysiągłem w moim gniewie: Nie wejdą do mojego odpocznienia."
"Hbr3,12": "Patrzcie, bracia, żeby czasem w kimś z was nie było złego serca niewiary, przez odstąpienie od Boga żywego;"
"Hbr3,13": "Ale zachęcajcie jedni drugich każdego dnia, dopóki trwa to, co nazywa się „Dzisiaj”, aby ktoś z was nie dał się zatwardzić zwiedzeniem grzechu."
"Hbr3,14": "Staliśmy się bowiem uczestnikami Chrystusa, jeśli niewzruszenie aż do końca zachowamy początek tego fundamentu."
"Hbr3,15": "Kiedy mówi: Dziś, jeślibyście usłyszeli Jego głos, nie zatwardzajcie waszych serc, jak podczas buntu,"
"Hbr3,16": "Ci bowiem, gdy usłyszeli, zbuntowali się, lecz nie wszyscy z tych, którzy wyszli z Egiptu prowadzeni przez Mojżesza."
"Hbr3,17": "A na kogo gniewał się przez czterdzieści lat? Czyż nie na tych, którzy zgrzeszyli, których zwłoki legły na pustyni?"
"Hbr3,18": "Komu natomiast przysiągł, że nie wejdą do Jego odpocznienia, jeśli nie tym, którzy byli nieposłuszni?"
"Hbr3,19": "Widzimy więc, że nie mogli wejść z powodu niewiary."
