"Hbr4,1": "Lękajmy się więc, aby czasem, choć pozostaje dla nas obietnica wejścia do Jego odpocznienia, nie wydawało się komuś, że ktoś z was, jest jej pozbawiony."
"Hbr4,2": "I my bowiem jesteśmy odbiorcami dobrej nowiny, tak jak i tamci, ale tamtym usłyszane Słowo nie pomogło, bo nie było związane z wiarą tych, którzy usłyszeli."
"Hbr4,3": "Bo do odpocznienia wchodzimy my, którzy uwierzyliśmy, tak jak powiedział: Przysiągłem w moim gniewie, że nie wejdą do mojego odpocznienia, pomimo dzieł dokonanych od założenia świata."
"Hbr4,4": "Powiedział bowiem gdzieś o siódmym dniu tak: I odpoczął Bóg siódmego dnia od wszystkich swoich dzieł."
"Hbr4,5": "A tutaj ponownie: Nie wejdą do mojego odpocznienia."
"Hbr4,6": "Skoro więc pozostawia niektórych, by weszli do niego, a ci, którym wcześniej głoszono, nie weszli z powodu nieposłuszeństwa,"
"Hbr4,7": "To ponownie wyznacza pewien dzień – „Dzisiaj” i mówi przez Dawida po długim czasie, tak jak jest powiedziane: Dzisiaj, jeślibyście usłyszeli Jego głos, nie zatwardzajcie waszych serc."
"Hbr4,8": "Bo gdyby Jozue wprowadził ich do odpocznienia, to Bóg nie mówiłby po takim czasie o innym dniu,"
"Hbr4,9": "A zatem pozostaje jeszcze odpocznienie szabatu dla ludu Bożego."
"Hbr4,10": "Albowiem kto wszedł do Jego odpocznienia, ten sam odpoczął od swoich dzieł, tak jak Bóg od swoich."
"Hbr4,11": "Starajmy się usilnie wejść do tego odpocznienia, aby ktoś nie popadł w ten sam przykład nieposłuszeństwa."
"Hbr4,12": "Bo Słowo Boże jest żywe i skuteczne, ostrzejsze niż każdy miecz obosieczny, przenikające aż do rozdzielenia duszy, jak i ducha, stawów, jak i szpiku, zdolne do osądzenia zamysłów i intencji serca."
"Hbr4,13": "I nie ma stworzenia ukrytego przed Jego obliczem, owszem, wszystko jest obnażone i odsłonięte przed oczami Tego, któremu zdamy sprawę."
"Hbr4,14": "Mając więc wielkiego arcykapłana, który przeszedł przez niebiosa, Jezusa, Syna Bożego, trzymajmy się mocno naszego wyznania."
"Hbr4,15": "Nie mamy bowiem arcykapłana, nie mogącego współczuć w naszych słabościach, lecz takiego, który na podobieństwo nam, doświadczony jest we wszystkim, oprócz grzechu."
"Hbr4,16": "Zbliżajmy się więc z ufną odwagą do tronu łaski, abyśmy otrzymali miłosierdzie i znaleźli łaskę, a we właściwym czasie pomoc."
