"Hbr4,1":
  text: "Lękajmy się więc, aby czasem, choć pozostaje dla nas obietnica wejścia do Jego odpocznienia, nie wydawało się komuś, że ktoś z was, jest jej pozbawiony."
  tags: []
"Hbr4,2":
  text: "I my bowiem jesteśmy odbiorcami dobrej nowiny, tak jak i tamci, ale tamtym usłyszane Słowo nie pomogło, bo nie było związane z wiarą tych, którzy usłyszeli."
  tags: []
"Hbr4,3":
  text: "Bo do odpocznienia wchodzimy my, którzy uwierzyliśmy, tak jak powiedział: Przysiągłem w moim gniewie, że nie wejdą do mojego odpocznienia, pomimo dzieł dokonanych od założenia świata."
  tags: []
"Hbr4,4":
  text: "Powiedział bowiem gdzieś o siódmym dniu tak: I odpoczął Bóg siódmego dnia od wszystkich swoich dzieł."
  tags: []
"Hbr4,5":
  text: "A tutaj ponownie: Nie wejdą do mojego odpocznienia."
  tags: []
"Hbr4,6":
  text: "Skoro więc pozostawia niektórych, by weszli do niego, a ci, którym wcześniej głoszono, nie weszli z powodu nieposłuszeństwa,"
  tags: []
"Hbr4,7":
  text: "To ponownie wyznacza pewien dzień – „Dzisiaj” i mówi przez Dawida po długim czasie, tak jak jest powiedziane: Dzisiaj, jeślibyście usłyszeli Jego głos, nie zatwardzajcie waszych serc."
  tags: []
"Hbr4,8":
  text: "Bo gdyby Jozue wprowadził ich do odpocznienia, to Bóg nie mówiłby po takim czasie o innym dniu,"
  tags: []
"Hbr4,9":
  text: "A zatem pozostaje jeszcze odpocznienie szabatu dla ludu Bożego."
  tags: []
"Hbr4,10":
  text: "Albowiem kto wszedł do Jego odpocznienia, ten sam odpoczął od swoich dzieł, tak jak Bóg od swoich."
  tags: []
"Hbr4,11":
  text: "Starajmy się usilnie wejść do tego odpocznienia, aby ktoś nie popadł w ten sam przykład nieposłuszeństwa."
  tags: []
"Hbr4,12":
  text: "Bo Słowo Boże jest żywe i skuteczne, ostrzejsze niż każdy miecz obosieczny, przenikające aż do rozdzielenia duszy, jak i ducha, stawów, jak i szpiku, zdolne do osądzenia zamysłów i intencji serca."
  tags: []
"Hbr4,13":
  text: "I nie ma stworzenia ukrytego przed Jego obliczem, owszem, wszystko jest obnażone i odsłonięte przed oczami Tego, któremu zdamy sprawę."
  tags: []
"Hbr4,14":
  text: "Mając więc wielkiego arcykapłana, który przeszedł przez niebiosa, Jezusa, Syna Bożego, trzymajmy się mocno naszego wyznania."
  tags: []
"Hbr4,15":
  text: "Nie mamy bowiem arcykapłana, nie mogącego współczuć w naszych słabościach, lecz takiego, który na podobieństwo nam, doświadczony jest we wszystkim, oprócz grzechu."
  tags: []
"Hbr4,16":
  text: "Zbliżajmy się więc z ufną odwagą do tronu łaski, abyśmy otrzymali miłosierdzie i znaleźli łaskę, a we właściwym czasie pomoc."
  tags: []
