"Hbr7,1":
  text: "Ten bowiem Melchisedek, król Salemu, kapłan Boga Najwyższego, wyszedł na spotkanie Abrahama wracającego po rozgromieniu królów i mu pobłogosławił;"
  tags: []
"Hbr7,2":
  text: "Jemu to udzielił Abraham dziesięciny ze wszystkiego. A imię jego jest tłumaczone najpierw jako król sprawiedliwości, a potem także król Salemu, to jest król pokoju."
  tags: []
"Hbr7,3":
  text: "Bez ojca, bez matki, bez rodowodu, nie mający ani początku dni, ani końca życia, ale będąc podobnym do Syna Bożego, trwa jako kapłan nieprzerwanie."
  tags: []
"Hbr7,4":
  text: "Zauważajcie więc, jak wielki jest ten, któremu nawet patriarcha Abraham dał dziesięcinę z najlepszej części."
  tags: []
"Hbr7,5":
  text: "Wprawdzie i ci z synów Lewiego, którzy przyjmują kapłaństwo, mają przykazanie, by brać dziesięcinę od ludu według Prawa, to jest od swoich braci, choć i oni wyszli z lędźwi Abrahama."
  tags: []
"Hbr7,6":
  text: "Ale ten, którego rodowód nie wywodzi się od nich, wziął dziesięcinę od Abrahama i temu, który ma obietnicę, błogosławił."
  tags: []
"Hbr7,7":
  text: "A bez żadnego sporu, mniejszy przez większego jest błogosławiony."
  tags: []
"Hbr7,8":
  text: "A tu nadto biorą dziesięciny ludzie, którzy umierają, tam natomiast ten, o którym jest składane świadectwo, że żyje."
  tags: []
"Hbr7,9":
  text: "I – jak można by powiedzieć – w Abrahamie i Lewi, przyjmujący dziesięciny, jest obłożony dziesięciną;"
  tags: []
"Hbr7,10":
  text: "Był bowiem jeszcze w lędźwiach ojca, gdy Melchisedek wyszedł mu na spotkanie."
  tags: []
"Hbr7,11":
  text: "Gdyby więc doskonałość była osiągana przez kapłaństwo lewickie, a z powodu niego lud otrzymał Prawo, jaka jeszcze byłaby potrzeba, aby ustanawiać innego kapłana zgodnie z porządkiem Melchisedeka, a nie, aby go nazywano kapłanem zgodnie z porządkiem Aarona?"
  tags: []
"Hbr7,12":
  text: "Bo skoro zmieniane jest kapłaństwo, to koniecznie musi nastąpić i zmiana Prawa."
  tags: []
"Hbr7,13":
  text: "Bo Ten, o którym jest mowa, należał do innego pokolenia, z którego nikt nie służył ołtarzowi."
  tags: []
"Hbr7,14":
  text: "Bo jest oczywiste, że nasz Pan wywodzi się z Judy, o którym to pokoleniu Mojżesz nic nie powiedział odnośnie kapłaństwa."
  tags: []
"Hbr7,15":
  text: "I jest to tym bardziej oczywiste, że na podobieństwo Melchisedeka jest ustanawiany inny kapłan,"
  tags: []
"Hbr7,16":
  text: "Który stał się nim, nie według przykazania prawa cielesnego, ale według mocy niezniszczalnego życia."
  tags: []
"Hbr7,17":
  text: "Świadczy bowiem o Nim: Ty jesteś kapłanem na wieki według porządku Melchisedeka."
  tags: []
"Hbr7,18":
  text: "Istotnie bowiem poprzednie przykazanie staje się nieważne z powodu jego bezsilności i bezużyteczności,"
  tags: []
"Hbr7,19":
  text: "Prawo bowiem nie doprowadziło niczego do doskonałości, lecz wprowadzało do lepszej nadziei, przez którą zbliżamy się do Boga."
  tags: []
"Hbr7,20":
  text: "I co więcej, stało się to, nie bez złożenia przysięgi,"
  tags: []
"Hbr7,21":
  text: "Bo ci wprawdzie stali się kapłanami bez przysięgi, a Ten ze względu na przysięgę Tego, który do Niego mówi: Przysiągł PAN i nie będzie tego żałował: Ty jesteś kapłanem na wieki według porządku Melchisedeka."
  tags: []
"Hbr7,22":
  text: "O tyle więc lepszego przymierza Jezus stał się poręczycielem."
  tags: []
"Hbr7,23":
  text: "A tych kapłanów było wielu, dlatego że śmierć nie pozwala im trwać na zawsze;"
  tags: []
"Hbr7,24":
  text: "Ten natomiast, na wieki pozostaje, bo ma kapłaństwo nieprzechodnie."
  tags: []
"Hbr7,25":
  text: "Dlatego też, może całkowicie zbawiać tych, którzy przez Niego przystępują do Boga; bo zawsze żyje, aby wstawiać się za nimi."
  tags: []
"Hbr7,26":
  text: "Takiego właśnie przystało nam mieć arcykapłana, który stał się święty, niewinny, nieskalany, odłączony od grzeszników i wywyższony ponad niebiosa,"
  tags: []
"Hbr7,27":
  text: "Nie ma On potrzeby codziennie, jak inni arcykapłani, najpierw składać ofiary za własne grzechy, a potem za lud; uczynił to bowiem raz na zawsze, gdy ofiarował samego siebie."
  tags: []
"Hbr7,28":
  text: "Prawo bowiem ustanawia arcykapłanami ludzi mających słabość; ale słowo złożonej przysięgi, po nadaniu Prawa – ustanawia Syna Bożego uczynionego doskonałym na wieki."
  tags: []
