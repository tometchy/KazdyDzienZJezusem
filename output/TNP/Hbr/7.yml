"Hbr7,1": "Ten bowiem Melchisedek, król Salemu, kapłan Boga Najwyższego, wyszedł na spotkanie Abrahama wracającego po rozgromieniu królów i mu pobłogosławił;"
"Hbr7,2": "Jemu to udzielił Abraham dziesięciny ze wszystkiego. A imię jego jest tłumaczone najpierw jako król sprawiedliwości, a potem także król Salemu, to jest król pokoju."
"Hbr7,3": "Bez ojca, bez matki, bez rodowodu, nie mający ani początku dni, ani końca życia, ale będąc podobnym do Syna Bożego, trwa jako kapłan nieprzerwanie."
"Hbr7,4": "Zauważajcie więc, jak wielki jest ten, któremu nawet patriarcha Abraham dał dziesięcinę z najlepszej części."
"Hbr7,5": "Wprawdzie i ci z synów Lewiego, którzy przyjmują kapłaństwo, mają przykazanie, by brać dziesięcinę od ludu według Prawa, to jest od swoich braci, choć i oni wyszli z lędźwi Abrahama."
"Hbr7,6": "Ale ten, którego rodowód nie wywodzi się od nich, wziął dziesięcinę od Abrahama i temu, który ma obietnicę, błogosławił."
"Hbr7,7": "A bez żadnego sporu, mniejszy przez większego jest błogosławiony."
"Hbr7,8": "A tu nadto biorą dziesięciny ludzie, którzy umierają, tam natomiast ten, o którym jest składane świadectwo, że żyje."
"Hbr7,9": "I – jak można by powiedzieć – w Abrahamie i Lewi, przyjmujący dziesięciny, jest obłożony dziesięciną;"
"Hbr7,10": "Był bowiem jeszcze w lędźwiach ojca, gdy Melchisedek wyszedł mu na spotkanie."
"Hbr7,11": "Gdyby więc doskonałość była osiągana przez kapłaństwo lewickie, a z powodu niego lud otrzymał Prawo, jaka jeszcze byłaby potrzeba, aby ustanawiać innego kapłana zgodnie z porządkiem Melchisedeka, a nie, aby go nazywano kapłanem zgodnie z porządkiem Aarona?"
"Hbr7,12": "Bo skoro zmieniane jest kapłaństwo, to koniecznie musi nastąpić i zmiana Prawa."
"Hbr7,13": "Bo Ten, o którym jest mowa, należał do innego pokolenia, z którego nikt nie służył ołtarzowi."
"Hbr7,14": "Bo jest oczywiste, że nasz Pan wywodzi się z Judy, o którym to pokoleniu Mojżesz nic nie powiedział odnośnie kapłaństwa."
"Hbr7,15": "I jest to tym bardziej oczywiste, że na podobieństwo Melchisedeka jest ustanawiany inny kapłan,"
"Hbr7,16": "Który stał się nim, nie według przykazania prawa cielesnego, ale według mocy niezniszczalnego życia."
"Hbr7,17": "Świadczy bowiem o Nim: Ty jesteś kapłanem na wieki według porządku Melchisedeka."
"Hbr7,18": "Istotnie bowiem poprzednie przykazanie staje się nieważne z powodu jego bezsilności i bezużyteczności,"
"Hbr7,19": "Prawo bowiem nie doprowadziło niczego do doskonałości, lecz wprowadzało do lepszej nadziei, przez którą zbliżamy się do Boga."
"Hbr7,20": "I co więcej, stało się to, nie bez złożenia przysięgi,"
"Hbr7,21": "Bo ci wprawdzie stali się kapłanami bez przysięgi, a Ten ze względu na przysięgę Tego, który do Niego mówi: Przysiągł PAN i nie będzie tego żałował: Ty jesteś kapłanem na wieki według porządku Melchisedeka."
"Hbr7,22": "O tyle więc lepszego przymierza Jezus stał się poręczycielem."
"Hbr7,23": "A tych kapłanów było wielu, dlatego że śmierć nie pozwala im trwać na zawsze;"
"Hbr7,24": "Ten natomiast, na wieki pozostaje, bo ma kapłaństwo nieprzechodnie."
"Hbr7,25": "Dlatego też, może całkowicie zbawiać tych, którzy przez Niego przystępują do Boga; bo zawsze żyje, aby wstawiać się za nimi."
"Hbr7,26": "Takiego właśnie przystało nam mieć arcykapłana, który stał się święty, niewinny, nieskalany, odłączony od grzeszników i wywyższony ponad niebiosa,"
"Hbr7,27": "Nie ma On potrzeby codziennie, jak inni arcykapłani, najpierw składać ofiary za własne grzechy, a potem za lud; uczynił to bowiem raz na zawsze, gdy ofiarował samego siebie."
"Hbr7,28": "Prawo bowiem ustanawia arcykapłanami ludzi mających słabość; ale słowo złożonej przysięgi, po nadaniu Prawa – ustanawia Syna Bożego uczynionego doskonałym na wieki."
