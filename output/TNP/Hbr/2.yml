"Hbr2,1":
  text: "Dlatego musimy tym bardziej trzymać się tego, co słyszeliśmy, abyśmy czasem nie minęli się z celem."
  tags: []
"Hbr2,2":
  text: "Bo jeśli Słowo wypowiedziane przez aniołów stało się pewne, a każde przestępstwo i nieposłuszeństwo otrzymało zgodną z prawem odpłatę,"
  tags: []
"Hbr2,3":
  text: "To jak my umkniemy przed karą, jeśli zlekceważymy tak wielkie zbawienie, które wzięło swój początek przez zwiastowanie Pana, a nam zostało potwierdzone przez tych, którzy usłyszeli."
  tags: []
"Hbr2,4":
  text: "Bóg równocześnie poświadcza je również przez znaki i cuda, i różne przejawy mocy, i przez udzielanie Ducha Świętego według swojej woli."
  tags: []
"Hbr2,5":
  text: "Bo nie aniołom poddał przyszły zamieszkały świat, o którym mówimy."
  tags: []
"Hbr2,6":
  text: "Zaświadczył o tym gdzieś ktoś, mówiąc: Kim jest człowiek, że o nim pamiętasz, albo Syn Człowieczy, że go nawiedzasz?"
  tags: []
"Hbr2,7":
  text: "Na małą chwilę uczyniłeś Go mniejszym od aniołów, ukoronowałeś Go chwałą i czcią, postawiłeś Go nad dziełami swoich rąk,"
  tags: []
"Hbr2,8":
  text: "Wszystko poddałeś pod Jego nogi. Gdy bowiem wszystko Mu poddał, nie zostawił nic, co nie byłoby Mu podporządkowane; lecz teraz jeszcze nie widzimy, że wszystko jest Mu poddane."
  tags: []
"Hbr2,9":
  text: "Ale widzimy Tego, który na krótko uczyniony jest mniejszym od aniołów, Jezusa, który przez cierpienie śmierci został ukoronowany chwałą i czcią, aby dzięki łasce Boga za każdego skosztował śmierci."
  tags: []
"Hbr2,10":
  text: "Przystało bowiem Temu, dla którego jest wszystko i przez którego jest wszystko, aby Tego, który wielu synów wprowadził do chwały, wodza ich zbawienia, uczynić doskonałym przez cierpienia."
  tags: []
"Hbr2,11":
  text: "Bo i Ten, który uświęca, i ci, którzy są uświęcani, z jednego są wszyscy; z tej to przyczyny nie wstydzi się nazywać ich braćmi,"
  tags: []
"Hbr2,12":
  text: "Gdy mówi: Opowiem imię Twoje moim braciom, pośrodku zgromadzenia zaśpiewam Ci hymn."
  tags: []
"Hbr2,13":
  text: "I ponownie: Ja będę pokładał w Nim ufność. I ponownie: Oto ja i dzieci, które dał mi Bóg."
  tags: []
"Hbr2,14":
  text: "Ponieważ dzieci są uczestnikami ciała i krwi, podobnie i On stał się ich uczestnikiem, aby przez śmierć zniszczyć tego, który ma swoją siłę w śmierci, to jest diabła,"
  tags: []
"Hbr2,15":
  text: "I żeby wyswobodzić tych, którzy z powodu lęku przed śmiercią przez całe życie podlegli byli niewoli."
  tags: []
"Hbr2,16":
  text: "Albowiem oczywistym jest, że nie ujmuje się On za aniołami, ale ujmuje się za potomstwem Abrahama."
  tags: []
"Hbr2,17":
  text: "Stąd zobowiązany był, aby we wszystkim zostać upodobnionym do braci, by stał się miłosiernym i wiernym arcykapłanem przed Bogiem, dla przebłagania za grzechy ludu."
  tags: []
"Hbr2,18":
  text: "W czym bowiem doznał cierpień, będąc poddawany próbie, w tym może dopomóc tym, którzy są poddawani próbie."
  tags: []
