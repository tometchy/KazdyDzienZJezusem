"Hbr2,1": "Dlatego musimy tym bardziej trzymać się tego, co słyszeliśmy, abyśmy czasem nie minęli się z celem."
"Hbr2,2": "Bo jeśli Słowo wypowiedziane przez aniołów stało się pewne, a każde przestępstwo i nieposłuszeństwo otrzymało zgodną z prawem odpłatę,"
"Hbr2,3": "To jak my umkniemy przed karą, jeśli zlekceważymy tak wielkie zbawienie, które wzięło swój początek przez zwiastowanie Pana, a nam zostało potwierdzone przez tych, którzy usłyszeli."
"Hbr2,4": "Bóg równocześnie poświadcza je również przez znaki i cuda, i różne przejawy mocy, i przez udzielanie Ducha Świętego według swojej woli."
"Hbr2,5": "Bo nie aniołom poddał przyszły zamieszkały świat, o którym mówimy."
"Hbr2,6": "Zaświadczył o tym gdzieś ktoś, mówiąc: Kim jest człowiek, że o nim pamiętasz, albo Syn Człowieczy, że go nawiedzasz?"
"Hbr2,7": "Na małą chwilę uczyniłeś Go mniejszym od aniołów, ukoronowałeś Go chwałą i czcią, postawiłeś Go nad dziełami swoich rąk,"
"Hbr2,8": "Wszystko poddałeś pod Jego nogi. Gdy bowiem wszystko Mu poddał, nie zostawił nic, co nie byłoby Mu podporządkowane; lecz teraz jeszcze nie widzimy, że wszystko jest Mu poddane."
"Hbr2,9": "Ale widzimy Tego, który na krótko uczyniony jest mniejszym od aniołów, Jezusa, który przez cierpienie śmierci został ukoronowany chwałą i czcią, aby dzięki łasce Boga za każdego skosztował śmierci."
"Hbr2,10": "Przystało bowiem Temu, dla którego jest wszystko i przez którego jest wszystko, aby Tego, który wielu synów wprowadził do chwały, wodza ich zbawienia, uczynić doskonałym przez cierpienia."
"Hbr2,11": "Bo i Ten, który uświęca, i ci, którzy są uświęcani, z jednego są wszyscy; z tej to przyczyny nie wstydzi się nazywać ich braćmi,"
"Hbr2,12": "Gdy mówi: Opowiem imię Twoje moim braciom, pośrodku zgromadzenia zaśpiewam Ci hymn."
"Hbr2,13": "I ponownie: Ja będę pokładał w Nim ufność. I ponownie: Oto ja i dzieci, które dał mi Bóg."
"Hbr2,14": "Ponieważ dzieci są uczestnikami ciała i krwi, podobnie i On stał się ich uczestnikiem, aby przez śmierć zniszczyć tego, który ma swoją siłę w śmierci, to jest diabła,"
"Hbr2,15": "I żeby wyswobodzić tych, którzy z powodu lęku przed śmiercią przez całe życie podlegli byli niewoli."
"Hbr2,16": "Albowiem oczywistym jest, że nie ujmuje się On za aniołami, ale ujmuje się za potomstwem Abrahama."
"Hbr2,17": "Stąd zobowiązany był, aby we wszystkim zostać upodobnionym do braci, by stał się miłosiernym i wiernym arcykapłanem przed Bogiem, dla przebłagania za grzechy ludu."
"Hbr2,18": "W czym bowiem doznał cierpień, będąc poddawany próbie, w tym może dopomóc tym, którzy są poddawani próbie."
