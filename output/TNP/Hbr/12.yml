"Hbr12,1": "Dlatego i my, mając wokół siebie tak wielki obłok świadków, zrzućmy z siebie wszelki ciężar i grzech, który nas mocno oplata, z wytrwałością biegnijmy w wyznaczonym nam boju,"
"Hbr12,2": "Patrząc uważnie na Jezusa, który jest początkiem i końcem naszej wiary, który w miejsce leżącej przed Nim radości wycierpiał krzyż, znosząc jego hańbę, i zasiadł po prawicy tronu Boga."
"Hbr12,3": "Rozważcie bowiem, jakim jest Ten, który wycierpiał od grzeszników przeciwko sobie tak wielki sprzeciw, abyście zmęczeni, nie osłabli na duszy."
"Hbr12,4": "Wy nie opieraliście się jeszcze aż do krwi, walcząc przeciwko grzechowi,"
"Hbr12,5": "I całkowicie zapomnieliście o zachęcie, którą zwraca się do was jak do synów: Synu mój, nie lekceważ karcenia PANA, i nie bądź osłabiony, gdy PAN ciebie napomina;"
"Hbr12,6": "Kogo bowiem PAN miłuje, tego karci, natomiast chłoszcze każdego syna, którego przyjmuje."
"Hbr12,7": "Jeżeli znosicie karcenie, to Bóg ofiarowuje się wam jako synom; jakim bowiem jest syn, którego ojciec nie wychowuje?"
"Hbr12,8": "A jeśli jesteście bez karcenia, które jest udziałem wszystkich, to jesteście dziećmi z nieprawego łoża, a nie synami."
"Hbr12,9": "Ponadto, mieliśmy naszych ojców według ciała, którzy nas karcili, i szanowaliśmy ich. Czyż nie mamy być daleko bardziej poddani Ojcu duchów, by żyć?"
"Hbr12,10": "Tamci bowiem wychowywali nas przez krótki czas według swojego uznania; Ten natomiast, dla naszej korzyści, abyśmy byli uczestnikami Jego świętości."
"Hbr12,11": "Wprawdzie wszelkie karcenie w danej chwili nie wydaje się radosne, lecz sprawia smutek; ale potem przynosi pełen pokoju owoc sprawiedliwości tym, którzy są przez nie wyćwiczeni."
"Hbr12,12": "Dlatego wyprostujcie opuszczone ręce i wyczerpane kolana,"
"Hbr12,13": "I czyńcie proste ścieżki waszymi nogami, aby to, co chrome nie zboczyło, ale raczej zostało uzdrowione."
"Hbr12,14": "Zabiegajcie o pokój ze wszystkimi i o uświęcenie, bez którego nikt nie zobaczy Pana."
"Hbr12,15": "Przyglądajcie się uważnie, aby ktoś nie pozostał z dala od łaski Bożej, aby jakiś korzeń gorzkości rosnący w górę nie wywołał niepokoju, i żeby przez to nie pokalało się wielu,"
"Hbr12,16": "Aby ktoś nie był rozpustny i bezbożny jak Ezaw, który za jedną potrawę oddał swoje pierworództwo."
"Hbr12,17": "Wiecie bowiem, że potem, gdy chciał odziedziczyć błogosławieństwo, został odrzucony, bowiem nie znalazł sposobu zmiany swojego położenia, chociaż ze łzami go poszukiwał."
"Hbr12,18": "Wy bowiem nie zbliżyliście się do góry dającej się dotknąć i płonącej ogniem, ani do mroku, ani do ciemności, ani do burzy,"
"Hbr12,19": "Ani do dźwięku trąby, ani do głosu słów, tak że ci, którzy to usłyszeli, prosili, aby więcej nie kierowano do nich ani słowa;"
"Hbr12,20": "Nie mogli bowiem znieść nakazu: A jeśli zwierzę dotknęłoby góry, będzie ukamienowane albo przebite oszczepem."
"Hbr12,21": "A tak straszne było to, co zostało im ukazane, że Mojżesz powiedział: Jestem przepełniony bojaźnią i drżę."
"Hbr12,22": "Ale wy przystąpiliście do góry Syjon i do miasta Boga żywego, do niebiańskiego Jeruzalem i do dziesiątek tysięcy aniołów,"
"Hbr12,23": "Do uroczystego zgromadzenia i do wywołanych pierworodnych, którzy są zapisani w niebiosach, i do Boga, sędziego wszystkich, i do duchów sprawiedliwych, uczynionych doskonałymi,"
"Hbr12,24": "I do pośrednika nowego przymierza, Jezusa, i do krwi pokropienia, która przemawia potężniej od krwi Abla."
"Hbr12,25": "Patrzcie, abyście nie odwracali się od Tego, który mówi; bo jeśli tamci, po tym jak odwrócili się od Tego, który przemawiał na ziemi, nie uszli kary, tym bardziej my, gdy odwracamy się od Tego, który przemawia z niebios."
"Hbr12,26": "Ten, którego głos wówczas wstrząsnął ziemią, teraz natomiast obiecał, mówiąc: Ja jeszcze raz poruszę nie tylko ziemią, ale i niebem."
"Hbr12,27": "Więc to „jeszcze raz” oznajmia, że te rzeczy które są wstrząsane, podlegają przemieszczeniu, jako stworzone; aby pozostały te, które nie są wstrząśnięte."
"Hbr12,28": "Dlatego przyjmując królestwo niewzruszone, obyśmy mieli łaskę przez którą służylibyśmy w sposób miły Bogu, z szacunkiem i czcią."
"Hbr12,29": "Albowiem nasz Bóg jest ogniem trawiącym."
