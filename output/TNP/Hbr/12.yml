"Hbr12,1":
  text: "Dlatego i my, mając wokół siebie tak wielki obłok świadków, zrzućmy z siebie wszelki ciężar i grzech, który nas mocno oplata, z wytrwałością biegnijmy w wyznaczonym nam boju,"
  tags: []
"Hbr12,2":
  text: "Patrząc uważnie na Jezusa, który jest początkiem i końcem naszej wiary, który w miejsce leżącej przed Nim radości wycierpiał krzyż, znosząc jego hańbę, i zasiadł po prawicy tronu Boga."
  tags: []
"Hbr12,3":
  text: "Rozważcie bowiem, jakim jest Ten, który wycierpiał od grzeszników przeciwko sobie tak wielki sprzeciw, abyście zmęczeni, nie osłabli na duszy."
  tags: []
"Hbr12,4":
  text: "Wy nie opieraliście się jeszcze aż do krwi, walcząc przeciwko grzechowi,"
  tags: []
"Hbr12,5":
  text: "I całkowicie zapomnieliście o zachęcie, którą zwraca się do was jak do synów: Synu mój, nie lekceważ karcenia PANA, i nie bądź osłabiony, gdy PAN ciebie napomina;"
  tags: []
"Hbr12,6":
  text: "Kogo bowiem PAN miłuje, tego karci, natomiast chłoszcze każdego syna, którego przyjmuje."
  tags: []
"Hbr12,7":
  text: "Jeżeli znosicie karcenie, to Bóg ofiarowuje się wam jako synom; jakim bowiem jest syn, którego ojciec nie wychowuje?"
  tags: []
"Hbr12,8":
  text: "A jeśli jesteście bez karcenia, które jest udziałem wszystkich, to jesteście dziećmi z nieprawego łoża, a nie synami."
  tags: []
"Hbr12,9":
  text: "Ponadto, mieliśmy naszych ojców według ciała, którzy nas karcili, i szanowaliśmy ich. Czyż nie mamy być daleko bardziej poddani Ojcu duchów, by żyć?"
  tags: []
"Hbr12,10":
  text: "Tamci bowiem wychowywali nas przez krótki czas według swojego uznania; Ten natomiast, dla naszej korzyści, abyśmy byli uczestnikami Jego świętości."
  tags: []
"Hbr12,11":
  text: "Wprawdzie wszelkie karcenie w danej chwili nie wydaje się radosne, lecz sprawia smutek; ale potem przynosi pełen pokoju owoc sprawiedliwości tym, którzy są przez nie wyćwiczeni."
  tags: []
"Hbr12,12":
  text: "Dlatego wyprostujcie opuszczone ręce i wyczerpane kolana,"
  tags: []
"Hbr12,13":
  text: "I czyńcie proste ścieżki waszymi nogami, aby to, co chrome nie zboczyło, ale raczej zostało uzdrowione."
  tags: []
"Hbr12,14":
  text: "Zabiegajcie o pokój ze wszystkimi i o uświęcenie, bez którego nikt nie zobaczy Pana."
  tags: []
"Hbr12,15":
  text: "Przyglądajcie się uważnie, aby ktoś nie pozostał z dala od łaski Bożej, aby jakiś korzeń gorzkości rosnący w górę nie wywołał niepokoju, i żeby przez to nie pokalało się wielu,"
  tags: []
"Hbr12,16":
  text: "Aby ktoś nie był rozpustny i bezbożny jak Ezaw, który za jedną potrawę oddał swoje pierworództwo."
  tags: []
"Hbr12,17":
  text: "Wiecie bowiem, że potem, gdy chciał odziedziczyć błogosławieństwo, został odrzucony, bowiem nie znalazł sposobu zmiany swojego położenia, chociaż ze łzami go poszukiwał."
  tags: []
"Hbr12,18":
  text: "Wy bowiem nie zbliżyliście się do góry dającej się dotknąć i płonącej ogniem, ani do mroku, ani do ciemności, ani do burzy,"
  tags: []
"Hbr12,19":
  text: "Ani do dźwięku trąby, ani do głosu słów, tak że ci, którzy to usłyszeli, prosili, aby więcej nie kierowano do nich ani słowa;"
  tags: []
"Hbr12,20":
  text: "Nie mogli bowiem znieść nakazu: A jeśli zwierzę dotknęłoby góry, będzie ukamienowane albo przebite oszczepem."
  tags: []
"Hbr12,21":
  text: "A tak straszne było to, co zostało im ukazane, że Mojżesz powiedział: Jestem przepełniony bojaźnią i drżę."
  tags: []
"Hbr12,22":
  text: "Ale wy przystąpiliście do góry Syjon i do miasta Boga żywego, do niebiańskiego Jeruzalem i do dziesiątek tysięcy aniołów,"
  tags: []
"Hbr12,23":
  text: "Do uroczystego zgromadzenia i do wywołanych pierworodnych, którzy są zapisani w niebiosach, i do Boga, sędziego wszystkich, i do duchów sprawiedliwych, uczynionych doskonałymi,"
  tags: []
"Hbr12,24":
  text: "I do pośrednika nowego przymierza, Jezusa, i do krwi pokropienia, która przemawia potężniej od krwi Abla."
  tags: []
"Hbr12,25":
  text: "Patrzcie, abyście nie odwracali się od Tego, który mówi; bo jeśli tamci, po tym jak odwrócili się od Tego, który przemawiał na ziemi, nie uszli kary, tym bardziej my, gdy odwracamy się od Tego, który przemawia z niebios."
  tags: []
"Hbr12,26":
  text: "Ten, którego głos wówczas wstrząsnął ziemią, teraz natomiast obiecał, mówiąc: Ja jeszcze raz poruszę nie tylko ziemią, ale i niebem."
  tags: []
"Hbr12,27":
  text: "Więc to „jeszcze raz” oznajmia, że te rzeczy które są wstrząsane, podlegają przemieszczeniu, jako stworzone; aby pozostały te, które nie są wstrząśnięte."
  tags: []
"Hbr12,28":
  text: "Dlatego przyjmując królestwo niewzruszone, obyśmy mieli łaskę przez którą służylibyśmy w sposób miły Bogu, z szacunkiem i czcią."
  tags: []
"Hbr12,29":
  text: "Albowiem nasz Bóg jest ogniem trawiącym."
  tags: []
