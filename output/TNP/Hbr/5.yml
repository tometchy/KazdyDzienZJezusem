"Hbr5,1":
  text: "Albowiem każdy arcykapłan brany z ludzi, za ludzi jest ustanawiany w obecności Boga, aby składał dary i ofiary za grzechy,"
  tags: []
"Hbr5,2":
  text: "Który może okazywać współczucie nieświadomym i błądzącym, bo sam poddany jest słabości."
  tags: []
"Hbr5,3":
  text: "I z tego powodu powinien, jak za lud, tak i za samego siebie składać ofiarę za grzechy."
  tags: []
"Hbr5,4":
  text: "A nikt sam sobie tej godności nie bierze, tylko ten, który jest powoływany przez Boga, jak Aaron."
  tags: []
"Hbr5,5":
  text: "Tak i Chrystus nie sobie samemu oddał chwałę, aby stać się arcykapłanem, lecz uczynił to Ten, który powiedział do Niego: Ty jesteś Synem moim, Ja ciebie dzisiaj zrodziłem."
  tags: []
"Hbr5,6":
  text: "Jak i na innym miejscu mówi: Ty jesteś kapłanem na wieki według porządku Melchisedeka."
  tags: []
"Hbr5,7":
  text: "Za dni swojego życia w ciele, z wielkim wołaniem i ze łzami, przynosił On błagania i usilne prośby do Tego, który mógł Go zbawiać od śmierci i został wysłuchany przez wzgląd na pobożność,"
  tags: []
"Hbr5,8":
  text: "I chociaż był Synem, nauczył się posłuszeństwa przez to, co wycierpiał."
  tags: []
"Hbr5,9":
  text: "A gdy został doskonałym, stał się dla wszystkich, którzy są Mu posłuszni, sprawcą zbawienia wiecznego,"
  tags: []
"Hbr5,10":
  text: "I został nazwany przez Boga arcykapłanem według porządku Melchisedeka."
  tags: []
"Hbr5,11":
  text: "O którym mamy wiele słów do powiedzenia i trudnych do wyjaśnienia, skoro staliście się ociężali w słuchaniu."
  tags: []
"Hbr5,12":
  text: "Bowiem wy, którzy ze względu na czas powinniście być nauczycielami, ponownie potrzebujecie, aby was ktoś nauczył początkowych zasad Słów Bożych, staliście się potrzebującymi mleka, a nie stałego pokarmu."
  tags: []
"Hbr5,13":
  text: "Każdy, kto karmi się mlekiem, jest niedoświadczony w nauce sprawiedliwości, bo jest niemowlęciem."
  tags: []
"Hbr5,14":
  text: "Dojrzałym natomiast, właściwy jest stały pokarm; ci dzięki praktyce mają zmysły wyćwiczone do rozróżniania tego, co dobre, a także i złe."
  tags: []
