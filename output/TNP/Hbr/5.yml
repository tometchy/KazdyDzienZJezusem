"Hbr5,1": "Albowiem każdy arcykapłan brany z ludzi, za ludzi jest ustanawiany w obecności Boga, aby składał dary i ofiary za grzechy,"
"Hbr5,2": "Który może okazywać współczucie nieświadomym i błądzącym, bo sam poddany jest słabości."
"Hbr5,3": "I z tego powodu powinien, jak za lud, tak i za samego siebie składać ofiarę za grzechy."
"Hbr5,4": "A nikt sam sobie tej godności nie bierze, tylko ten, który jest powoływany przez Boga, jak Aaron."
"Hbr5,5": "Tak i Chrystus nie sobie samemu oddał chwałę, aby stać się arcykapłanem, lecz uczynił to Ten, który powiedział do Niego: Ty jesteś Synem moim, Ja ciebie dzisiaj zrodziłem."
"Hbr5,6": "Jak i na innym miejscu mówi: Ty jesteś kapłanem na wieki według porządku Melchisedeka."
"Hbr5,7": "Za dni swojego życia w ciele, z wielkim wołaniem i ze łzami, przynosił On błagania i usilne prośby do Tego, który mógł Go zbawiać od śmierci i został wysłuchany przez wzgląd na pobożność,"
"Hbr5,8": "I chociaż był Synem, nauczył się posłuszeństwa przez to, co wycierpiał."
"Hbr5,9": "A gdy został doskonałym, stał się dla wszystkich, którzy są Mu posłuszni, sprawcą zbawienia wiecznego,"
"Hbr5,10": "I został nazwany przez Boga arcykapłanem według porządku Melchisedeka."
"Hbr5,11": "O którym mamy wiele słów do powiedzenia i trudnych do wyjaśnienia, skoro staliście się ociężali w słuchaniu."
"Hbr5,12": "Bowiem wy, którzy ze względu na czas powinniście być nauczycielami, ponownie potrzebujecie, aby was ktoś nauczył początkowych zasad Słów Bożych, staliście się potrzebującymi mleka, a nie stałego pokarmu."
"Hbr5,13": "Każdy, kto karmi się mlekiem, jest niedoświadczony w nauce sprawiedliwości, bo jest niemowlęciem."
"Hbr5,14": "Dojrzałym natomiast, właściwy jest stały pokarm; ci dzięki praktyce mają zmysły wyćwiczone do rozróżniania tego, co dobre, a także i złe."
