"Hbr11,1":
  text: "Wiara więc jest istotą tego, w czym pokładamy nadzieję, przekonaniem o rzeczach, których nie widzimy;"
  tags: []
"Hbr11,2":
  text: "Przez nią przodkowie otrzymali chlubne świadectwo."
  tags: []
"Hbr11,3":
  text: "Przez wiarę rozumiemy, że światy są utworzone słowem Boga, z tego, co niewidzialne stało się to, co widzialne."
  tags: []
"Hbr11,4":
  text: "Przez wiarę Abel złożył Bogu lepszą ofiarę niż Kain, przez nią otrzymał świadectwo, że jest sprawiedliwy; Bóg bowiem składa świadectwo nad jego darami, i przez nią po śmierci jeszcze mówi."
  tags: []
"Hbr11,5":
  text: "Przez wiarę został przeniesiony Henoch, by nie zobaczył śmierci; i nie został znaleziony, dlatego że Bóg go przeniósł; a przed jego przeniesieniem otrzymał świadectwo, że bardzo podobał się Bogu."
  tags: []
"Hbr11,6":
  text: "A bez wiary nie można spodobać się Bogu; ten bowiem, kto zbliża się do Boga, musi uwierzyć, że On jest, i że wynagradza tych, którzy Go szukają."
  tags: []
"Hbr11,7":
  text: "Przez wiarę Noe został ostrzeżony przez Boga o tym, czego jeszcze nie widziano; przejęty czcią zbudował arkę dla ocalenia swojego domu, przez nią wydał wyrok na świat i stał się dziedzicem sprawiedliwości, która jest z wiary."
  tags: []
"Hbr11,8":
  text: "Przez wiarę Abraham okazał posłuszeństwo wezwaniu, aby pójść do miejsca, które miał obejmować w dziedzictwo, i wyszedł, nie wiedząc, dokąd idzie."
  tags: []
"Hbr11,9":
  text: "Przez wiarę mieszkał w ziemi obiecanej jak w ziemi obcej, mieszkając w namiotach z Izaakiem i z Jakubem, współdziedzicami tej samej obietnicy,"
  tags: []
"Hbr11,10":
  text: "Bo oczekiwał miasta mającego fundamenty, którego architektem i budowniczym jest Bóg."
  tags: []
"Hbr11,11":
  text: "Przez wiarę, także sama Sara otrzymała moc poczęcia i urodziła mimo podeszłego wieku, skoro uznała za godnego zaufania Tego, który to obiecał."
  tags: []
"Hbr11,12":
  text: "I dlatego też z jednego człowieka, i to obumarłego, zostało zrodzone potomstwo tak liczne jak gwiazdy na niebie, i jakby piasek niezliczony na brzegu morza."
  tags: []
"Hbr11,13":
  text: "Ci wszyscy poumierali w wierze, nie otrzymując złożonych obietnic, ale widząc je z daleka, zaufali im, i witali je, i wyznawali, że są obcymi i przychodniami na ziemi."
  tags: []
"Hbr11,14":
  text: "Bo ci, którzy w ten sposób mówią, okazują, że poszukują ojczyzny."
  tags: []
"Hbr11,15":
  text: "A gdyby prawdziwie myśleli o tej, z której wyszli, mieliby czas powrócić."
  tags: []
"Hbr11,16":
  text: "Teraz natomiast pragną oni lepszej, to jest niebiańskiej; dlatego też Bóg nie wstydzi się ich, gdy jest wzywany jako ich Bóg, bo przygotował im miasto."
  tags: []
"Hbr11,17":
  text: "Przez wiarę Abraham, gdy był poddany próbie, przynosił na ofiarę Izaaka, i ofiarowywał jednorodzonego, on, który otrzymał obietnicę,"
  tags: []
"Hbr11,18":
  text: "Do którego powiedziano: W Izaaku nazwane będzie twoje potomstwo;"
  tags: []
"Hbr11,19":
  text: "Licząc, że Bóg jest mocny wzbudzać i z martwych; skąd go też na podobieństwo zmartwychwstania otrzymał."
  tags: []
"Hbr11,20":
  text: "Przez wiarę w to, co ma nastąpić, pobłogosławił Izaak Jakuba i Ezawa."
  tags: []
"Hbr11,21":
  text: "Przez wiarę Jakub, gdy umierał, pobłogosławił każdego z synów Józefa i oddał pokłon oparty o kraniec swojej laski."
  tags: []
"Hbr11,22":
  text: "Przez wiarę Józef, gdy umierał, wspomniał o wyjściu synów Izraela i dał polecenie dotyczące swoich kości."
  tags: []
"Hbr11,23":
  text: "Przez wiarę Mojżesz po urodzeniu był przez trzy miesiące ukrywany przez swoich rodziców, ponieważ zobaczyli to śliczne dziecię i nie ulękli się rozkazu króla."
  tags: []
"Hbr11,24":
  text: "Przez wiarę Mojżesz, gdy stał się dorosłym, nie zgodził się być nazywanym synem córki faraona,"
  tags: []
"Hbr11,25":
  text: "Wybierając dla siebie raczej cierpienie z ludem Bożym, niż by mieć chwilową przyjemność z grzechu,"
  tags: []
"Hbr11,26":
  text: "Uznając hańbę Pomazańca za większe bogactwo niż skarby Egiptu; patrzył bowiem na zapłatę."
  tags: []
"Hbr11,27":
  text: "Przez wiarę opuścił Egipt, nie lękając się gniewu króla; bo wytrwał w tym co niewidzialne, tak jakby to widział."
  tags: []
"Hbr11,28":
  text: "Przez wiarę uczynił Paschę i przelanie krwi, aby ten, który wytracał pierworodnych, nie dotknął ich."
  tags: []
"Hbr11,29":
  text: "Przez wiarę przeszli przez Morze Czerwone jak po suchej ziemi, a gdy Egipcjanie podjęli tę próbę, zostali pochłonięci."
  tags: []
"Hbr11,30":
  text: "Przez wiarę runęły mury Jerycha okrążane przez siedem dni."
  tags: []
"Hbr11,31":
  text: "Przez wiarę nierządnica Rahab nie zginęła razem z tymi, którzy byli nieposłuszni, bo w pokoju przyjęła zwiadowców."
  tags: []
"Hbr11,32":
  text: "I co jeszcze miałbym powiedzieć? Zabrakłoby mi czasu, gdybym miał opowiadać o Gedeonie i o Baraku, także o Samsonie i o Jeftem, i o Dawidzie, jak i o Samuelu i o prorokach,"
  tags: []
"Hbr11,33":
  text: "Którzy przez wiarę podbili królestwa, zaprowadzili sprawiedliwość, dostąpili spełnienia obietnic, zamknęli paszcze lwom,"
  tags: []
"Hbr11,34":
  text: "Ugasili moc ognia, uszli ostrza miecza, umocnieni powstawali z niemocy, byli mężni na wojnie, zmusili obce wojska do odwrotu."
  tags: []
"Hbr11,35":
  text: "Kobiety otrzymywały swoich umarłych wskrzeszonych; inni natomiast byli zamęczeni nie przyjmując uwolnienia, aby lepszego dostąpić zmartwychwstania."
  tags: []
"Hbr11,36":
  text: "Drudzy natomiast doświadczyli zniewag i biczowania, a do tego kajdan i więzienia;"
  tags: []
"Hbr11,37":
  text: "Byli ukamienowani, przerzynani piłą, doświadczeni, umierając mordowani mieczem, błąkali się w owczych i kozich skórach, znosząc niedostatek, ucisk i krzywdę."
  tags: []
"Hbr11,38":
  text: "Ci, których świat nie był godny, tułali się po pustyniach i górach, i jaskiniach, i po rozpadlinach ziemi."
  tags: []
"Hbr11,39":
  text: "A ci wszyscy, mimo że przez wiarę zostali poświadczeni, nie odebrali spełnienia obietnicy,"
  tags: []
"Hbr11,40":
  text: "Bóg bowiem odnośnie nas przewidział coś lepszego, aby oni bez nas nie zostali doprowadzeni do doskonałości."
  tags: []
