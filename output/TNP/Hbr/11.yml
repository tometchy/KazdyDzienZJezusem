"Hbr11,1": "Wiara więc jest istotą tego, w czym pokładamy nadzieję, przekonaniem o rzeczach, których nie widzimy;"
"Hbr11,2": "Przez nią przodkowie otrzymali chlubne świadectwo."
"Hbr11,3": "Przez wiarę rozumiemy, że światy są utworzone słowem Boga, z tego, co niewidzialne stało się to, co widzialne."
"Hbr11,4": "Przez wiarę Abel złożył Bogu lepszą ofiarę niż Kain, przez nią otrzymał świadectwo, że jest sprawiedliwy; Bóg bowiem składa świadectwo nad jego darami, i przez nią po śmierci jeszcze mówi."
"Hbr11,5": "Przez wiarę został przeniesiony Henoch, by nie zobaczył śmierci; i nie został znaleziony, dlatego że Bóg go przeniósł; a przed jego przeniesieniem otrzymał świadectwo, że bardzo podobał się Bogu."
"Hbr11,6": "A bez wiary nie można spodobać się Bogu; ten bowiem, kto zbliża się do Boga, musi uwierzyć, że On jest, i że wynagradza tych, którzy Go szukają."
"Hbr11,7": "Przez wiarę Noe został ostrzeżony przez Boga o tym, czego jeszcze nie widziano; przejęty czcią zbudował arkę dla ocalenia swojego domu, przez nią wydał wyrok na świat i stał się dziedzicem sprawiedliwości, która jest z wiary."
"Hbr11,8": "Przez wiarę Abraham okazał posłuszeństwo wezwaniu, aby pójść do miejsca, które miał obejmować w dziedzictwo, i wyszedł, nie wiedząc, dokąd idzie."
"Hbr11,9": "Przez wiarę mieszkał w ziemi obiecanej jak w ziemi obcej, mieszkając w namiotach z Izaakiem i z Jakubem, współdziedzicami tej samej obietnicy,"
"Hbr11,10": "Bo oczekiwał miasta mającego fundamenty, którego architektem i budowniczym jest Bóg."
"Hbr11,11": "Przez wiarę, także sama Sara otrzymała moc poczęcia i urodziła mimo podeszłego wieku, skoro uznała za godnego zaufania Tego, który to obiecał."
"Hbr11,12": "I dlatego też z jednego człowieka, i to obumarłego, zostało zrodzone potomstwo tak liczne jak gwiazdy na niebie, i jakby piasek niezliczony na brzegu morza."
"Hbr11,13": "Ci wszyscy poumierali w wierze, nie otrzymując złożonych obietnic, ale widząc je z daleka, zaufali im, i witali je, i wyznawali, że są obcymi i przychodniami na ziemi."
"Hbr11,14": "Bo ci, którzy w ten sposób mówią, okazują, że poszukują ojczyzny."
"Hbr11,15": "A gdyby prawdziwie myśleli o tej, z której wyszli, mieliby czas powrócić."
"Hbr11,16": "Teraz natomiast pragną oni lepszej, to jest niebiańskiej; dlatego też Bóg nie wstydzi się ich, gdy jest wzywany jako ich Bóg, bo przygotował im miasto."
"Hbr11,17": "Przez wiarę Abraham, gdy był poddany próbie, przynosił na ofiarę Izaaka, i ofiarowywał jednorodzonego, on, który otrzymał obietnicę,"
"Hbr11,18": "Do którego powiedziano: W Izaaku nazwane będzie twoje potomstwo;"
"Hbr11,19": "Licząc, że Bóg jest mocny wzbudzać i z martwych; skąd go też na podobieństwo zmartwychwstania otrzymał."
"Hbr11,20": "Przez wiarę w to, co ma nastąpić, pobłogosławił Izaak Jakuba i Ezawa."
"Hbr11,21": "Przez wiarę Jakub, gdy umierał, pobłogosławił każdego z synów Józefa i oddał pokłon oparty o kraniec swojej laski."
"Hbr11,22": "Przez wiarę Józef, gdy umierał, wspomniał o wyjściu synów Izraela i dał polecenie dotyczące swoich kości."
"Hbr11,23": "Przez wiarę Mojżesz po urodzeniu był przez trzy miesiące ukrywany przez swoich rodziców, ponieważ zobaczyli to śliczne dziecię i nie ulękli się rozkazu króla."
"Hbr11,24": "Przez wiarę Mojżesz, gdy stał się dorosłym, nie zgodził się być nazywanym synem córki faraona,"
"Hbr11,25": "Wybierając dla siebie raczej cierpienie z ludem Bożym, niż by mieć chwilową przyjemność z grzechu,"
"Hbr11,26": "Uznając hańbę Pomazańca za większe bogactwo niż skarby Egiptu; patrzył bowiem na zapłatę."
"Hbr11,27": "Przez wiarę opuścił Egipt, nie lękając się gniewu króla; bo wytrwał w tym co niewidzialne, tak jakby to widział."
"Hbr11,28": "Przez wiarę uczynił Paschę i przelanie krwi, aby ten, który wytracał pierworodnych, nie dotknął ich."
"Hbr11,29": "Przez wiarę przeszli przez Morze Czerwone jak po suchej ziemi, a gdy Egipcjanie podjęli tę próbę, zostali pochłonięci."
"Hbr11,30": "Przez wiarę runęły mury Jerycha okrążane przez siedem dni."
"Hbr11,31": "Przez wiarę nierządnica Rahab nie zginęła razem z tymi, którzy byli nieposłuszni, bo w pokoju przyjęła zwiadowców."
"Hbr11,32": "I co jeszcze miałbym powiedzieć? Zabrakłoby mi czasu, gdybym miał opowiadać o Gedeonie i o Baraku, także o Samsonie i o Jeftem, i o Dawidzie, jak i o Samuelu i o prorokach,"
"Hbr11,33": "Którzy przez wiarę podbili królestwa, zaprowadzili sprawiedliwość, dostąpili spełnienia obietnic, zamknęli paszcze lwom,"
"Hbr11,34": "Ugasili moc ognia, uszli ostrza miecza, umocnieni powstawali z niemocy, byli mężni na wojnie, zmusili obce wojska do odwrotu."
"Hbr11,35": "Kobiety otrzymywały swoich umarłych wskrzeszonych; inni natomiast byli zamęczeni nie przyjmując uwolnienia, aby lepszego dostąpić zmartwychwstania."
"Hbr11,36": "Drudzy natomiast doświadczyli zniewag i biczowania, a do tego kajdan i więzienia;"
"Hbr11,37": "Byli ukamienowani, przerzynani piłą, doświadczeni, umierając mordowani mieczem, błąkali się w owczych i kozich skórach, znosząc niedostatek, ucisk i krzywdę."
"Hbr11,38": "Ci, których świat nie był godny, tułali się po pustyniach i górach, i jaskiniach, i po rozpadlinach ziemi."
"Hbr11,39": "A ci wszyscy, mimo że przez wiarę zostali poświadczeni, nie odebrali spełnienia obietnicy,"
"Hbr11,40": "Bóg bowiem odnośnie nas przewidział coś lepszego, aby oni bez nas nie zostali doprowadzeni do doskonałości."
