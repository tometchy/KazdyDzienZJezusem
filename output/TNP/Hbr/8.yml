"Hbr8,1":
  text: "Główną więc myślą tego, co jest mówione, jest to, że mamy takiego arcykapłana, który zasiadł po prawej stronie tronu Majestatu na niebiosach,"
  tags: []
"Hbr8,2":
  text: "Jako sługa świątyni i prawdziwego przybytku, który wzniósł Pan, a nie człowiek."
  tags: []
"Hbr8,3":
  text: "Każdy bowiem arcykapłan ustanawiany jest do składania darów i ofiar. Dlatego też konieczne jest, aby i Ten miał co ofiarować."
  tags: []
"Hbr8,4":
  text: "Jeśliby bowiem prawdziwie był na ziemi, nie byłby kapłanem, gdyż są tu już kapłani, którzy według Prawa składają dary."
  tags: []
"Hbr8,5":
  text: "Służą oni obrazowi i cieniowi tego, co jest niebiańskie; Bóg tak ostrzegł Mojżesza, gdy zamierzał dokończyć przybytek: Mówi bowiem – patrz, abyś uczynił wszystko według wzoru, jaki ci pokazano na górze."
  tags: []
"Hbr8,6":
  text: "Ale teraz przyjął On o tyle ważniejszą służbę, o ile lepszego przymierza jest pośrednikiem, które prawnie ustanowione jest na lepszych obietnicach."
  tags: []
"Hbr8,7":
  text: "Bo gdyby to pierwsze było nienaganne, to nie szukano by miejsca na drugie."
  tags: []
"Hbr8,8":
  text: "Obwiniając ich bowiem mówi: Oto nadchodzą dni, mówi PAN, gdy zawrę z domem Izraela i z domem Judy ostateczne nowe przymierze,"
  tags: []
"Hbr8,9":
  text: "Nie według przymierza, które uczyniłem z ich ojcami, w dniu, kiedy ująłem ich za rękę, aby wyprowadzić ich z ziemi egipskiej; gdyż oni nie wytrwali w moim przymierzu i ja ich zlekceważyłem, mówi PAN."
  tags: []
"Hbr8,10":
  text: "Bo takie jest przymierze, które ustanowię z domem Izraela w owych dniach, mówi PAN: Prawa moje włożę w ich umysły i wypiszę je na ich sercach, i będę im Bogiem, a oni będą mi ludem."
  tags: []
"Hbr8,11":
  text: "I nikt nie będzie uczył swojego bliźniego, i nikt swojego brata, mówiąc: Poznaj PANA; wszyscy bowiem mnie poznają, od najmniejszego z nich, aż do największego z nich."
  tags: []
"Hbr8,12":
  text: "Bo miłosierny będę dla ich nieprawości, a ich grzechów i bezprawia nie wspomnę więcej."
  tags: []
"Hbr8,13":
  text: "A gdy mówi „nowe”, uznaje pierwsze za przestarzałe; a to, co jest uznane za przestarzałe i traci swoją ważność, bliskie jest zaniku."
  tags: []
