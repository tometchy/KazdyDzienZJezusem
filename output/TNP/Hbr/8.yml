"Hbr8,1": "Główną więc myślą tego, co jest mówione, jest to, że mamy takiego arcykapłana, który zasiadł po prawej stronie tronu Majestatu na niebiosach,"
"Hbr8,2": "Jako sługa świątyni i prawdziwego przybytku, który wzniósł Pan, a nie człowiek."
"Hbr8,3": "Każdy bowiem arcykapłan ustanawiany jest do składania darów i ofiar. Dlatego też konieczne jest, aby i Ten miał co ofiarować."
"Hbr8,4": "Jeśliby bowiem prawdziwie był na ziemi, nie byłby kapłanem, gdyż są tu już kapłani, którzy według Prawa składają dary."
"Hbr8,5": "Służą oni obrazowi i cieniowi tego, co jest niebiańskie; Bóg tak ostrzegł Mojżesza, gdy zamierzał dokończyć przybytek: Mówi bowiem – patrz, abyś uczynił wszystko według wzoru, jaki ci pokazano na górze."
"Hbr8,6": "Ale teraz przyjął On o tyle ważniejszą służbę, o ile lepszego przymierza jest pośrednikiem, które prawnie ustanowione jest na lepszych obietnicach."
"Hbr8,7": "Bo gdyby to pierwsze było nienaganne, to nie szukano by miejsca na drugie."
"Hbr8,8": "Obwiniając ich bowiem mówi: Oto nadchodzą dni, mówi PAN, gdy zawrę z domem Izraela i z domem Judy ostateczne nowe przymierze,"
"Hbr8,9": "Nie według przymierza, które uczyniłem z ich ojcami, w dniu, kiedy ująłem ich za rękę, aby wyprowadzić ich z ziemi egipskiej; gdyż oni nie wytrwali w moim przymierzu i ja ich zlekceważyłem, mówi PAN."
"Hbr8,10": "Bo takie jest przymierze, które ustanowię z domem Izraela w owych dniach, mówi PAN: Prawa moje włożę w ich umysły i wypiszę je na ich sercach, i będę im Bogiem, a oni będą mi ludem."
"Hbr8,11": "I nikt nie będzie uczył swojego bliźniego, i nikt swojego brata, mówiąc: Poznaj PANA; wszyscy bowiem mnie poznają, od najmniejszego z nich, aż do największego z nich."
"Hbr8,12": "Bo miłosierny będę dla ich nieprawości, a ich grzechów i bezprawia nie wspomnę więcej."
"Hbr8,13": "A gdy mówi „nowe”, uznaje pierwsze za przestarzałe; a to, co jest uznane za przestarzałe i traci swoją ważność, bliskie jest zaniku."
