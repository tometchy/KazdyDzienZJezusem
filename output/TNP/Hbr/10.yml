"Hbr10,1":
  text: "Albowiem Prawo mając cień przyszłych dóbr, a nie sam obraz rzeczy, nie może nigdy przez te same ofiary, które co rok ustawicznie ofiarowują, uczynić doskonałymi tych, którzy przystępują do Boga."
  tags: []
"Hbr10,2":
  text: "Bo czyż nie zaprzestano by je ofiarowywać, z powodu tego, że ci, którzy pełnią służbę, będąc raz oczyszczeni, nie mieliby już żadnej świadomości grzechów."
  tags: []
"Hbr10,3":
  text: "Jednak w samych tych ofiarach jest co roku przypomnienie grzechów."
  tags: []
"Hbr10,4":
  text: "Niemożliwe jest bowiem, aby krew wołów i kozłów miała usuwać od kogoś grzechy."
  tags: []
"Hbr10,5":
  text: "Dlatego przychodząc na świat, mówi: Ofiary i daru nie chciałeś, ale utworzyłeś mi ciało;"
  tags: []
"Hbr10,6":
  text: "Nie znalazłeś upodobania w całopaleniach i ofiarach za grzech."
  tags: []
"Hbr10,7":
  text: "Wtedy powiedziałem: Oto przychodzę, w nagłówku zwoju napisano o mnie, abym czynił, Boże, Twoją wolę."
  tags: []
"Hbr10,8":
  text: "Najpierw powiedział: Ofiary i daru, całopalenia i ofiary za grzech nie chciałeś, ani nie znalazłeś upodobania w tym, co zgodnie z Prawem jest ofiarowywane."
  tags: []
"Hbr10,9":
  text: "Wtedy powiedział: Oto przychodzę czynić, Boże, Twoją wolę. Znosi więc pierwsze, aby ustanowić drugie."
  tags: []
"Hbr10,10":
  text: "Dzięki tej woli jesteśmy raz na zawsze uświęceni przez ofiarę ciała Jezusa Chrystusa."
  tags: []
"Hbr10,11":
  text: "I wprawdzie każdy kapłan codziennie stawał pełniąc służbę i przynosząc często te same ofiary, które nie mogą nigdy usunąć grzechów."
  tags: []
"Hbr10,12":
  text: "Ten natomiast, po złożeniu jednej ofiary za grzechy, na zawsze zasiadł po prawicy Boga,"
  tags: []
"Hbr10,13":
  text: "Oczekując odtąd, aż Jego nieprzyjaciele staną się podnóżkiem dla Jego stóp."
  tags: []
"Hbr10,14":
  text: "Jedną bowiem ofiarą na zawsze uczynił doskonałymi tych, którzy są uświęcani."
  tags: []
"Hbr10,15":
  text: "A świadczy nam to również i Duch Święty, przepowiedział to bowiem w słowach:"
  tags: []
"Hbr10,16":
  text: "Oto przymierze, które ustanowię im po tych dniach, mówi PAN: Włożę Prawa moje do ich serc i wypiszę je w ich umysłach,"
  tags: []
"Hbr10,17":
  text: "A ich grzechy i ich bezprawie nie będą mi więcej przypominane."
  tags: []
"Hbr10,18":
  text: "A gdzie jest od nich wyzwolenie, tam nie ma już ofiary za grzech."
  tags: []
"Hbr10,19":
  text: "Mając więc, bracia, ufną odwagę, aby przez krew Jezusa wejść do świętego Świętych,"
  tags: []
"Hbr10,20":
  text: "Drogą nową i żywą, którą nam poświęcił przez zasłonę, to jest przez Jego ciało,"
  tags: []
"Hbr10,21":
  text: "I wielkiego kapłana nad domem Boga,"
  tags: []
"Hbr10,22":
  text: "Zbliżajmy się ze szczerym sercem, w pełni wiary, mając serca oczyszczone od złego sumienia i ciało obmyte wodą czystą."
  tags: []
"Hbr10,23":
  text: "Zachowujmy wyznanie niewzruszonej nadziei, bo godny zaufania jest Ten, który obiecał,"
  tags: []
"Hbr10,24":
  text: "I przypatrujmy się jedni drugim, aby pobudzać się do miłości i dobrych czynów,"
  tags: []
"Hbr10,25":
  text: "Nie porzucając naszych wspólnych zgromadzeń, jak to u niektórych jest w zwyczaju, ale zachęcajmy się; i to tym bardziej, im wyraźniej widzicie, że zbliża się ten dzień."
  tags: []
"Hbr10,26":
  text: "Bo jeśli po otrzymaniu dogłębnego poznania prawdy, dobrowolnie grzeszymy, nie pozostaje już żadna ofiara za grzechy,"
  tags: []
"Hbr10,27":
  text: "Ale tylko jakieś pełne bojaźni oczekiwanie sądu i żaru ognia, który ma strawić przeciwników."
  tags: []
"Hbr10,28":
  text: "Kto odrzuca Prawo Mojżesza, ten bez miłosierdzia umiera na podstawie zeznania dwóch lub trzech świadków."
  tags: []
"Hbr10,29":
  text: "Jak się wam wydaje, na ile gorszą karę zasługuje ten, kto Syna Bożego podeptał, a krew przymierza, przez którą został uświęcony, uznał za pospolitą i znieważył Ducha łaski?"
  tags: []
"Hbr10,30":
  text: "Znamy bowiem Tego, który powiedział: Pomsta do mnie należy, ja odpłacę, mówi PAN; i ponownie: PAN sądzić będzie swój lud."
  tags: []
"Hbr10,31":
  text: "Straszna to rzecz wpaść w ręce Boga żywego."
  tags: []
"Hbr10,32":
  text: "Przypomnijcie też sobie wcześniejsze dni, w których zostaliście oświeceni, jak wielki bój przetrwaliście z utrapieniem,"
  tags: []
"Hbr10,33":
  text: "Czy to, gdy byliście wystawieni na publiczne zniewagi i utrapienia, czy to jako współtowarzysze tych, z którymi tak się obchodzono."
  tags: []
"Hbr10,34":
  text: "Albowiem współczuliście więzom moim, a grabież swojego mienia przyjęliście z radością, wiedząc, że macie w sobie majętność w niebiosach, lepszą i trwałą."
  tags: []
"Hbr10,35":
  text: "Dlatego nie odrzucajcie swojej ufnej odwagi, która ma wielką zapłatę."
  tags: []
"Hbr10,36":
  text: "Albowiem wytrwałości wam potrzeba, abyście, gdy wypełnicie wolę Bożą, otrzymali obietnicę."
  tags: []
"Hbr10,37":
  text: "Bo jeszcze tylko krótka chwila, bardzo krótka, a Ten, który ma przyjść, przyjdzie i nie będzie zwlekać."
  tags: []
"Hbr10,38":
  text: "A sprawiedliwy będzie żyć z wiary; a jeśli się cofnie, moja dusza nie będzie miała w nim upodobania."
  tags: []
"Hbr10,39":
  text: "Lecz my nie jesteśmy z tych, którzy się cofają ku zgubie, ale z tych, którzy wierzą dla zachowania duszy."
  tags: []
