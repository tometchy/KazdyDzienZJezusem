"Hbr10,1": "Albowiem Prawo mając cień przyszłych dóbr, a nie sam obraz rzeczy, nie może nigdy przez te same ofiary, które co rok ustawicznie ofiarowują, uczynić doskonałymi tych, którzy przystępują do Boga."
"Hbr10,2": "Bo czyż nie zaprzestano by je ofiarowywać, z powodu tego, że ci, którzy pełnią służbę, będąc raz oczyszczeni, nie mieliby już żadnej świadomości grzechów."
"Hbr10,3": "Jednak w samych tych ofiarach jest co roku przypomnienie grzechów."
"Hbr10,4": "Niemożliwe jest bowiem, aby krew wołów i kozłów miała usuwać od kogoś grzechy."
"Hbr10,5": "Dlatego przychodząc na świat, mówi: Ofiary i daru nie chciałeś, ale utworzyłeś mi ciało;"
"Hbr10,6": "Nie znalazłeś upodobania w całopaleniach i ofiarach za grzech."
"Hbr10,7": "Wtedy powiedziałem: Oto przychodzę, w nagłówku zwoju napisano o mnie, abym czynił, Boże, Twoją wolę."
"Hbr10,8": "Najpierw powiedział: Ofiary i daru, całopalenia i ofiary za grzech nie chciałeś, ani nie znalazłeś upodobania w tym, co zgodnie z Prawem jest ofiarowywane."
"Hbr10,9": "Wtedy powiedział: Oto przychodzę czynić, Boże, Twoją wolę. Znosi więc pierwsze, aby ustanowić drugie."
"Hbr10,10": "Dzięki tej woli jesteśmy raz na zawsze uświęceni przez ofiarę ciała Jezusa Chrystusa."
"Hbr10,11": "I wprawdzie każdy kapłan codziennie stawał pełniąc służbę i przynosząc często te same ofiary, które nie mogą nigdy usunąć grzechów."
"Hbr10,12": "Ten natomiast, po złożeniu jednej ofiary za grzechy, na zawsze zasiadł po prawicy Boga,"
"Hbr10,13": "Oczekując odtąd, aż Jego nieprzyjaciele staną się podnóżkiem dla Jego stóp."
"Hbr10,14": "Jedną bowiem ofiarą na zawsze uczynił doskonałymi tych, którzy są uświęcani."
"Hbr10,15": "A świadczy nam to również i Duch Święty, przepowiedział to bowiem w słowach:"
"Hbr10,16": "Oto przymierze, które ustanowię im po tych dniach, mówi PAN: Włożę Prawa moje do ich serc i wypiszę je w ich umysłach,"
"Hbr10,17": "A ich grzechy i ich bezprawie nie będą mi więcej przypominane."
"Hbr10,18": "A gdzie jest od nich wyzwolenie, tam nie ma już ofiary za grzech."
"Hbr10,19": "Mając więc, bracia, ufną odwagę, aby przez krew Jezusa wejść do świętego Świętych,"
"Hbr10,20": "Drogą nową i żywą, którą nam poświęcił przez zasłonę, to jest przez Jego ciało,"
"Hbr10,21": "I wielkiego kapłana nad domem Boga,"
"Hbr10,22": "Zbliżajmy się ze szczerym sercem, w pełni wiary, mając serca oczyszczone od złego sumienia i ciało obmyte wodą czystą."
"Hbr10,23": "Zachowujmy wyznanie niewzruszonej nadziei, bo godny zaufania jest Ten, który obiecał,"
"Hbr10,24": "I przypatrujmy się jedni drugim, aby pobudzać się do miłości i dobrych czynów,"
"Hbr10,25": "Nie porzucając naszych wspólnych zgromadzeń, jak to u niektórych jest w zwyczaju, ale zachęcajmy się; i to tym bardziej, im wyraźniej widzicie, że zbliża się ten dzień."
"Hbr10,26": "Bo jeśli po otrzymaniu dogłębnego poznania prawdy, dobrowolnie grzeszymy, nie pozostaje już żadna ofiara za grzechy,"
"Hbr10,27": "Ale tylko jakieś pełne bojaźni oczekiwanie sądu i żaru ognia, który ma strawić przeciwników."
"Hbr10,28": "Kto odrzuca Prawo Mojżesza, ten bez miłosierdzia umiera na podstawie zeznania dwóch lub trzech świadków."
"Hbr10,29": "Jak się wam wydaje, na ile gorszą karę zasługuje ten, kto Syna Bożego podeptał, a krew przymierza, przez którą został uświęcony, uznał za pospolitą i znieważył Ducha łaski?"
"Hbr10,30": "Znamy bowiem Tego, który powiedział: Pomsta do mnie należy, ja odpłacę, mówi PAN; i ponownie: PAN sądzić będzie swój lud."
"Hbr10,31": "Straszna to rzecz wpaść w ręce Boga żywego."
"Hbr10,32": "Przypomnijcie też sobie wcześniejsze dni, w których zostaliście oświeceni, jak wielki bój przetrwaliście z utrapieniem,"
"Hbr10,33": "Czy to, gdy byliście wystawieni na publiczne zniewagi i utrapienia, czy to jako współtowarzysze tych, z którymi tak się obchodzono."
"Hbr10,34": "Albowiem współczuliście więzom moim, a grabież swojego mienia przyjęliście z radością, wiedząc, że macie w sobie majętność w niebiosach, lepszą i trwałą."
"Hbr10,35": "Dlatego nie odrzucajcie swojej ufnej odwagi, która ma wielką zapłatę."
"Hbr10,36": "Albowiem wytrwałości wam potrzeba, abyście, gdy wypełnicie wolę Bożą, otrzymali obietnicę."
"Hbr10,37": "Bo jeszcze tylko krótka chwila, bardzo krótka, a Ten, który ma przyjść, przyjdzie i nie będzie zwlekać."
"Hbr10,38": "A sprawiedliwy będzie żyć z wiary; a jeśli się cofnie, moja dusza nie będzie miała w nim upodobania."
"Hbr10,39": "Lecz my nie jesteśmy z tych, którzy się cofają ku zgubie, ale z tych, którzy wierzą dla zachowania duszy."
