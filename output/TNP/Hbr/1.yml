"Hbr1,1": "Bóg, który wielokrotnie i wieloma sposobami mówił dawniej do ojców przez proroków,"
"Hbr1,2": "W te ostatnie dni przemówił do nas poprzez Syna, którego ustanowił dziedzicem wszystkich rzeczy i przez którego uczynił okresy czasu."
"Hbr1,3": "On, będąc blaskiem chwały i wyrażeniem Jego istoty, podtrzymując wszystko słowem swojej mocy, gdy sam dokonał oczyszczenia naszych grzechów, zasiadł po prawicy Majestatu na wysokościach."
"Hbr1,4": "Stał się o tyle ważniejszy od aniołów, o ile wspanialsze od nich odziedziczył imię."
"Hbr1,5": "Do którego bowiem z aniołów kiedykolwiek powiedział: Ty jesteś moim Synem, ja ciebie dziś zrodziłem? I ponownie: Ja mu będę ojcem, a on będzie mi Synem?"
"Hbr1,6": "A kiedy znowu wprowadza pierworodnego na zamieszkały świat, mówi: Niech mu oddadzą pokłon wszyscy aniołowie Boga."
"Hbr1,7": "O aniołach wprawdzie powiedziano: On czyni swoich aniołów wiatrami, a swoje sługi płomieniem ognia,"
"Hbr1,8": "Do Syna natomiast: Tron twój, o Boże, na wieki wieków; berłem sprawiedliwości berło twojego królestwa."
"Hbr1,9": "Umiłowałeś sprawiedliwość, a znienawidziłeś nieprawość, dlatego namaścił cię, o Boże, Bóg twój olejkiem radości jak żadnego z twoich towarzyszy."
"Hbr1,10": "I: Ty, o PANIE, na początku założyłeś fundamenty ziemi, a niebiosa są dziełem twoich rąk."
"Hbr1,11": "One przeminą, ale Ty trwasz, wszystkie jak szata ulegną zużyciu,"
"Hbr1,12": "I jak płaszcz je zwiniesz, i będą odmienione; ale Ty jesteś zawsze ten sam i lata twoje się nie skończą."
"Hbr1,13": "I czy kiedykolwiek powiedział do któregoś z aniołów: Zasiadaj po mojej prawicy, dopóki nie położę nieprzyjaciół twoich jako podnóżek twoich stóp?"
"Hbr1,14": "Czyż nie są oni wszyscy duchami usługującymi, posyłanymi do służby z powodu tych, którzy mają odziedziczyć zbawienie?"
