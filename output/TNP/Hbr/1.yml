"Hbr1,1":
  text: "Bóg, który wielokrotnie i wieloma sposobami mówił dawniej do ojców przez proroków,"
  tags: []
"Hbr1,2":
  text: "W te ostatnie dni przemówił do nas poprzez Syna, którego ustanowił dziedzicem wszystkich rzeczy i przez którego uczynił okresy czasu."
  tags: []
"Hbr1,3":
  text: "On, będąc blaskiem chwały i wyrażeniem Jego istoty, podtrzymując wszystko słowem swojej mocy, gdy sam dokonał oczyszczenia naszych grzechów, zasiadł po prawicy Majestatu na wysokościach."
  tags: []
"Hbr1,4":
  text: "Stał się o tyle ważniejszy od aniołów, o ile wspanialsze od nich odziedziczył imię."
  tags: []
"Hbr1,5":
  text: "Do którego bowiem z aniołów kiedykolwiek powiedział: Ty jesteś moim Synem, ja ciebie dziś zrodziłem? I ponownie: Ja mu będę ojcem, a on będzie mi Synem?"
  tags: []
"Hbr1,6":
  text: "A kiedy znowu wprowadza pierworodnego na zamieszkały świat, mówi: Niech mu oddadzą pokłon wszyscy aniołowie Boga."
  tags: []
"Hbr1,7":
  text: "O aniołach wprawdzie powiedziano: On czyni swoich aniołów wiatrami, a swoje sługi płomieniem ognia,"
  tags: []
"Hbr1,8":
  text: "Do Syna natomiast: Tron twój, o Boże, na wieki wieków; berłem sprawiedliwości berło twojego królestwa."
  tags: []
"Hbr1,9":
  text: "Umiłowałeś sprawiedliwość, a znienawidziłeś nieprawość, dlatego namaścił cię, o Boże, Bóg twój olejkiem radości jak żadnego z twoich towarzyszy."
  tags: []
"Hbr1,10":
  text: "I: Ty, o PANIE, na początku założyłeś fundamenty ziemi, a niebiosa są dziełem twoich rąk."
  tags: []
"Hbr1,11":
  text: "One przeminą, ale Ty trwasz, wszystkie jak szata ulegną zużyciu,"
  tags: []
"Hbr1,12":
  text: "I jak płaszcz je zwiniesz, i będą odmienione; ale Ty jesteś zawsze ten sam i lata twoje się nie skończą."
  tags: []
"Hbr1,13":
  text: "I czy kiedykolwiek powiedział do któregoś z aniołów: Zasiadaj po mojej prawicy, dopóki nie położę nieprzyjaciół twoich jako podnóżek twoich stóp?"
  tags: []
"Hbr1,14":
  text: "Czyż nie są oni wszyscy duchami usługującymi, posyłanymi do służby z powodu tych, którzy mają odziedziczyć zbawienie?"
  tags: []
