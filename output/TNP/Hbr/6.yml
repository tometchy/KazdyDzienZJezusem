"Hbr6,1":
  text: "Dlatego też pozostawiając początek nauki Chrystusa, wznosimy się ku doskonałości, nie zakładając ponownie fundamentu o upamiętaniu się z martwych uczynków i o wierze w Boga,"
  tags: []
"Hbr6,2":
  text: "O nauce o chrztach, o wkładaniu rąk, także o powstaniu z martwych i o sądzie wiecznym."
  tags: []
"Hbr6,3":
  text: "A to właśnie uczynimy, jeśli Bóg pozwoli."
  tags: []
"Hbr6,4":
  text: "Albowiem niemożliwe jest, aby tych, którzy raz zostali oświeceni i skosztowali daru niebiańskiego, i stali się uczestnikami Ducha Świętego,"
  tags: []
"Hbr6,5":
  text: "I skosztowali dobrego Słowa Bożego, a także mocy wieku, który ma nadejść,"
  tags: []
"Hbr6,6":
  text: "A mimo to upadli, aby ich na nowo odnawiać ku upamiętaniu, gdyż oni ponownie krzyżują dla siebie samych Syna Bożego i wystawiają Go na publiczną hańbę."
  tags: []
"Hbr6,7":
  text: "Ziemia bowiem, która często piła deszcz, który na nią przychodził, rodzi rośliny przydatne dla tych, którzy ją uprawiają, taka otrzymuje błogosławieństwo od Boga;"
  tags: []
"Hbr6,8":
  text: "Lecz ta, która wydaje ciernie i osty, jest nieużyteczna i bliska przekleństwa, a jej końcem jest spalenie."
  tags: []
"Hbr6,9":
  text: "Jednak umiłowani, chociaż tak mówimy, to jeśli chodzi o was, jesteśmy przekonani o czymś lepszym i że trzymacie się zbawienia."
  tags: []
"Hbr6,10":
  text: "Bóg bowiem nie jest niesprawiedliwy, aby miał zapomnieć o waszym dziele i o trudzie miłości, jaki okazujcie dla Jego imienia, gdy służyliście i służycie świętym."
  tags: []
"Hbr6,11":
  text: "Pragniemy natomiast, aby każdy z was okazywał tę samą gorliwość wobec całkowitej pewności nadziei, aż do końca,"
  tags: []
"Hbr6,12":
  text: "Abyście nie stali się ociężali, ale naśladowali tych, którzy przez wiarę i cierpliwość dziedziczą obietnice."
  tags: []
"Hbr6,13":
  text: "Bo gdy Bóg dawał obietnicę Abrahamowi, nie miał nikogo większego, na kogo mógłby przysiąc, przysiągł więc na samego siebie,"
  tags: []
"Hbr6,14":
  text: "Mówiąc: Z pewnością błogosławić ci będę i rozmnożę cię obficie."
  tags: []
"Hbr6,15":
  text: "A tak cierpliwie czekając, osiągnął spełnienie obietnicy."
  tags: []
"Hbr6,16":
  text: "Ludzie bowiem istotnie przysięgają na kogoś większego, a potwierdzająca przysięga jest końcem ich każdego sporu."
  tags: []
"Hbr6,17":
  text: "Dlatego też Bóg, chcąc tym bardziej okazać dziedzicom obietnicy niezmienność swojej woli, poręczył ją przysięgą,"
  tags: []
"Hbr6,18":
  text: "Abyśmy przez dwie rzeczy niezmienne, co do których jest niemożliwe, aby Bóg kłamał, mieli mocną zachętę, my, którzy ocaleliśmy, by chwycić się leżącej przed nami nadziei,"
  tags: []
"Hbr6,19":
  text: "Którą mamy jako kotwicę duszy, bezpieczną i mocną, wchodzącą aż do wewnątrz za zasłonę,"
  tags: []
"Hbr6,20":
  text: "Dokąd w naszym imieniu, jako poprzedzający nas, wszedł Jezus, który stał się według porządku Melchisedeka arcykapłanem na wieki."
  tags: []
