"Hbr6,1": "Dlatego też pozostawiając początek nauki Chrystusa, wznosimy się ku doskonałości, nie zakładając ponownie fundamentu o upamiętaniu się z martwych uczynków i o wierze w Boga,"
"Hbr6,2": "O nauce o chrztach, o wkładaniu rąk, także o powstaniu z martwych i o sądzie wiecznym."
"Hbr6,3": "A to właśnie uczynimy, jeśli Bóg pozwoli."
"Hbr6,4": "Albowiem niemożliwe jest, aby tych, którzy raz zostali oświeceni i skosztowali daru niebiańskiego, i stali się uczestnikami Ducha Świętego,"
"Hbr6,5": "I skosztowali dobrego Słowa Bożego, a także mocy wieku, który ma nadejść,"
"Hbr6,6": "A mimo to upadli, aby ich na nowo odnawiać ku upamiętaniu, gdyż oni ponownie krzyżują dla siebie samych Syna Bożego i wystawiają Go na publiczną hańbę."
"Hbr6,7": "Ziemia bowiem, która często piła deszcz, który na nią przychodził, rodzi rośliny przydatne dla tych, którzy ją uprawiają, taka otrzymuje błogosławieństwo od Boga;"
"Hbr6,8": "Lecz ta, która wydaje ciernie i osty, jest nieużyteczna i bliska przekleństwa, a jej końcem jest spalenie."
"Hbr6,9": "Jednak umiłowani, chociaż tak mówimy, to jeśli chodzi o was, jesteśmy przekonani o czymś lepszym i że trzymacie się zbawienia."
"Hbr6,10": "Bóg bowiem nie jest niesprawiedliwy, aby miał zapomnieć o waszym dziele i o trudzie miłości, jaki okazujcie dla Jego imienia, gdy służyliście i służycie świętym."
"Hbr6,11": "Pragniemy natomiast, aby każdy z was okazywał tę samą gorliwość wobec całkowitej pewności nadziei, aż do końca,"
"Hbr6,12": "Abyście nie stali się ociężali, ale naśladowali tych, którzy przez wiarę i cierpliwość dziedziczą obietnice."
"Hbr6,13": "Bo gdy Bóg dawał obietnicę Abrahamowi, nie miał nikogo większego, na kogo mógłby przysiąc, przysiągł więc na samego siebie,"
"Hbr6,14": "Mówiąc: Z pewnością błogosławić ci będę i rozmnożę cię obficie."
"Hbr6,15": "A tak cierpliwie czekając, osiągnął spełnienie obietnicy."
"Hbr6,16": "Ludzie bowiem istotnie przysięgają na kogoś większego, a potwierdzająca przysięga jest końcem ich każdego sporu."
"Hbr6,17": "Dlatego też Bóg, chcąc tym bardziej okazać dziedzicom obietnicy niezmienność swojej woli, poręczył ją przysięgą,"
"Hbr6,18": "Abyśmy przez dwie rzeczy niezmienne, co do których jest niemożliwe, aby Bóg kłamał, mieli mocną zachętę, my, którzy ocaleliśmy, by chwycić się leżącej przed nami nadziei,"
"Hbr6,19": "Którą mamy jako kotwicę duszy, bezpieczną i mocną, wchodzącą aż do wewnątrz za zasłonę,"
"Hbr6,20": "Dokąd w naszym imieniu, jako poprzedzający nas, wszedł Jezus, który stał się według porządku Melchisedeka arcykapłanem na wieki."
