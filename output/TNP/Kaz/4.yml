"Kaz4,1":
  text: "Potem ja zwróciłem uwagę i przyjrzałem się wszelkim uciskom, jakie dzieją się pod słońcem. I oto: Łzy uciśnionych – nie ma dla nich pocieszenia, a z ręki uciskających ich – przemoc; nie ma dla nich pocieszenia."
  tags: []
"Kaz4,2":
  text: "I wychwalałem ja umarłych, którzy już zmarli, bardziej niż żywych, którzy jeszcze żyją."
  tags: []
"Kaz4,3":
  text: "A lepszy od nich obu jest ten, którego jeszcze nie było i który nie widział tego nieszczęsnego dzieła, które dokonuje się pod słońcem."
  tags: []
"Kaz4,4":
  text: "I zobaczyłem ja ten cały trud i całą te pomyślność w działaniu – jak ona rodzi zazdrość w człowieku wobec bliźniego. To także jest marnością i utrapieniem ducha."
  tags: []
"Kaz4,5":
  text: "Głupi zakłada swoje ręce i zjada swoje własne ciało."
  tags: []
"Kaz4,6":
  text: "Lepsza pełna dłoń spokoju, niż dwie garście pełne trudu i utrapienia ducha."
  tags: []
"Kaz4,7":
  text: "I ja ponownie zwróciłem się i zobaczyłem kolejną marność pod słońcem:"
  tags: []
"Kaz4,8":
  text: "Jest ktoś sam jeden i nie ma drugiego, także syna i brata, i nie ma końca wszelki jego trud, także jego oko nie nasyci się bogactwem. „I dla kogo ja ponoszę trud i odmawiam dobra swojej duszy?”. To także jest marnością i nieszczęsnym zajęciem."
  tags: []
"Kaz4,9":
  text: "Lepiej dwóm niż jednemu, bo dla nich istnieje dobra zapłata za ich trud."
  tags: []
"Kaz4,10":
  text: "Bo jeśli upadną, jeden podniesie drugiego. I biada jednemu, gdy upadnie, a nie ma drugiego, który by go podniósł."
  tags: []
"Kaz4,11":
  text: "Także jeśli dwóch leży razem, to będzie im ciepło. Ale jeden jak się ogrzeje?"
  tags: []
"Kaz4,12":
  text: "A jeśli ktoś pokona jednego, to dwóch wystąpi przeciwko niemu, a potrójny sznur nie tak szybko zostanie zerwany."
  tags: []
"Kaz4,13":
  text: "Lepszy jest młodzieniec ubogi a mądry, niż król stary i głupi, który nie potrafi już przyjmować napomnienia."
  tags: []
"Kaz4,14":
  text: "Nawet gdy wyszedł z więzienia, aby królować, także gdy w swoim królestwie urodził się biedny."
  tags: []
"Kaz4,15":
  text: "Widziałem to, jak wszyscy żyjący, którzy chodzą pod słońcem, byli z drugim młodzieńcem, który powstanie zamiast niego."
  tags: []
"Kaz4,16":
  text: "Nie było końca całemu ludowi, tym wszystkim, którzy byli przed nimi. Także następni nie będą się z niego radować – bo to także jest marnością i utrapieniem ducha."
  tags: []
