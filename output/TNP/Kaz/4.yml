"Kaz4,1": "Potem ja zwróciłem uwagę i przyjrzałem się wszelkim uciskom, jakie dzieją się pod słońcem. I oto: Łzy uciśnionych – nie ma dla nich pocieszenia, a z ręki uciskających ich – przemoc; nie ma dla nich pocieszenia."
"Kaz4,2": "I wychwalałem ja umarłych, którzy już zmarli, bardziej niż żywych, którzy jeszcze żyją."
"Kaz4,3": "A lepszy od nich obu jest ten, którego jeszcze nie było i który nie widział tego nieszczęsnego dzieła, które dokonuje się pod słońcem."
"Kaz4,4": "I zobaczyłem ja ten cały trud i całą te pomyślność w działaniu – jak ona rodzi zazdrość w człowieku wobec bliźniego. To także jest marnością i utrapieniem ducha."
"Kaz4,5": "Głupi zakłada swoje ręce i zjada swoje własne ciało."
"Kaz4,6": "Lepsza pełna dłoń spokoju, niż dwie garście pełne trudu i utrapienia ducha."
"Kaz4,7": "I ja ponownie zwróciłem się i zobaczyłem kolejną marność pod słońcem:"
"Kaz4,8": "Jest ktoś sam jeden i nie ma drugiego, także syna i brata, i nie ma końca wszelki jego trud, także jego oko nie nasyci się bogactwem. „I dla kogo ja ponoszę trud i odmawiam dobra swojej duszy?”. To także jest marnością i nieszczęsnym zajęciem."
"Kaz4,9": "Lepiej dwóm niż jednemu, bo dla nich istnieje dobra zapłata za ich trud."
"Kaz4,10": "Bo jeśli upadną, jeden podniesie drugiego. I biada jednemu, gdy upadnie, a nie ma drugiego, który by go podniósł."
"Kaz4,11": "Także jeśli dwóch leży razem, to będzie im ciepło. Ale jeden jak się ogrzeje?"
"Kaz4,12": "A jeśli ktoś pokona jednego, to dwóch wystąpi przeciwko niemu, a potrójny sznur nie tak szybko zostanie zerwany."
"Kaz4,13": "Lepszy jest młodzieniec ubogi a mądry, niż król stary i głupi, który nie potrafi już przyjmować napomnienia."
"Kaz4,14": "Nawet gdy wyszedł z więzienia, aby królować, także gdy w swoim królestwie urodził się biedny."
"Kaz4,15": "Widziałem to, jak wszyscy żyjący, którzy chodzą pod słońcem, byli z drugim młodzieńcem, który powstanie zamiast niego."
"Kaz4,16": "Nie było końca całemu ludowi, tym wszystkim, którzy byli przed nimi. Także następni nie będą się z niego radować – bo to także jest marnością i utrapieniem ducha."
