"Kaz11,1": "Ślij swój chleb po powierzchni wód, bo po wielu dniach odnajdziesz go."
"Kaz11,2": "Rozdaj dział dla siedmiu, a nawet dla ośmiu, bo nie wiesz, co złego stanie się na ziemi."
"Kaz11,3": "Gdy chmury są pełne, spuszczają na ziemię deszcz. Gdy drzewo upada na południe lub na północ, w miejscu, gdzie upadnie to drzewo, tam zostanie."
"Kaz11,4": "Kto zważa na wiatr, nigdy nie będzie siał, a kto patrzy na chmury, nie będzie żąć."
"Kaz11,5": "Jak nie wiesz, jaka jest droga wiatru i jak się kształtują kości w łonie ciężarnej, tak nie poznasz dzieł Boga, który wszystko to czyni."
"Kaz11,6": "Rano siej twoje ziarno, a wieczorem nie pozwól spocząć swojej ręce, gdyż nie wiesz, co jest właściwe – to czy tamto – czy też w obu przypadkach będzie jednakowo dobrze."
"Kaz11,7": "Tak, słodkie jest światło i miłe dla oczu jest widzieć słońce."
"Kaz11,8": "Bo jeśli człowiek będzie żył przez wiele lat i radował się nimi wszystkimi, to niech pamięta o dniach ciemności, bo będzie ich wiele. Wszystko, co nadejdzie, to tylko marność."
"Kaz11,9": "Raduj się młodzieńcze w swojej młodości, niech twoje serce cieszy cię w dniach twojej młodości i krocz drogami swojego serca oraz kieruj się widokiem swoich oczu, lecz wiedz, że za to wszystko Bóg pozwie cię na sąd."
"Kaz11,10": "Usuń więc przygnębienie ze swojego serca i odrzuć słabość swego ciała, gdyż młodość i jej najlepsze lata są marnością."
