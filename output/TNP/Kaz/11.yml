"Kaz11,1":
  text: "Ślij swój chleb po powierzchni wód, bo po wielu dniach odnajdziesz go."
  tags: []
"Kaz11,2":
  text: "Rozdaj dział dla siedmiu, a nawet dla ośmiu, bo nie wiesz, co złego stanie się na ziemi."
  tags: []
"Kaz11,3":
  text: "Gdy chmury są pełne, spuszczają na ziemię deszcz. Gdy drzewo upada na południe lub na północ, w miejscu, gdzie upadnie to drzewo, tam zostanie."
  tags: []
"Kaz11,4":
  text: "Kto zważa na wiatr, nigdy nie będzie siał, a kto patrzy na chmury, nie będzie żąć."
  tags: []
"Kaz11,5":
  text: "Jak nie wiesz, jaka jest droga wiatru i jak się kształtują kości w łonie ciężarnej, tak nie poznasz dzieł Boga, który wszystko to czyni."
  tags: []
"Kaz11,6":
  text: "Rano siej twoje ziarno, a wieczorem nie pozwól spocząć swojej ręce, gdyż nie wiesz, co jest właściwe – to czy tamto – czy też w obu przypadkach będzie jednakowo dobrze."
  tags: []
"Kaz11,7":
  text: "Tak, słodkie jest światło i miłe dla oczu jest widzieć słońce."
  tags: []
"Kaz11,8":
  text: "Bo jeśli człowiek będzie żył przez wiele lat i radował się nimi wszystkimi, to niech pamięta o dniach ciemności, bo będzie ich wiele. Wszystko, co nadejdzie, to tylko marność."
  tags: []
"Kaz11,9":
  text: "Raduj się młodzieńcze w swojej młodości, niech twoje serce cieszy cię w dniach twojej młodości i krocz drogami swojego serca oraz kieruj się widokiem swoich oczu, lecz wiedz, że za to wszystko Bóg pozwie cię na sąd."
  tags: []
"Kaz11,10":
  text: "Usuń więc przygnębienie ze swojego serca i odrzuć słabość swego ciała, gdyż młodość i jej najlepsze lata są marnością."
  tags: []
