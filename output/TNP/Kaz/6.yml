"Kaz6,1":
  text: "Jest zło, które widziałem pod słońcem, które jest powszechne wśród ludzi:"
  tags: []
"Kaz6,2":
  text: "Człowiekowi, któremu Bóg dał bogactwo, majątek i sławę, i nie brakuje jego duszy niczego, czego pragnie – a Bóg nie daje mu możliwości spożywać tego, ale spożywa to obcy człowiek. To także jest marnością i bolesnym złem."
  tags: []
"Kaz6,3":
  text: "Choćby spłodził stu mężczyzn, żył wiele lat i wiele by było w tych latach dni, a jego dusza nie nasyciła by się dobrem a też nie miałaby pogrzebu, to powiem: Lepiej niż on miał poroniony płód."
  tags: []
"Kaz6,4":
  text: "Bo przyszedł jak we mgle i odchodzi w ciemności, a jego imię spowija mrok."
  tags: []
"Kaz6,5":
  text: "Nie widział też słońca ani nic nie poznał. Ma większy spokój niż tamten."
  tags: []
"Kaz6,6":
  text: "I choćby żył tysiące lat – dwukrotnie, lecz dobra by nie zobaczył, to czyż wszystko nie zmierza do jednego miejsca?"
  tags: []
"Kaz6,7":
  text: "Wszelki trud człowieka jest przeznaczony dla jego ust, a jednak jego dusza nie zostanie napełniona."
  tags: []
"Kaz6,8":
  text: "Bo co za przewaga mądrego nad głupim? I co ubogiemu z tego, że umie właściwie postępować przed żyjącymi?"
  tags: []
"Kaz6,9":
  text: "Lepsze jest to, co oczy widzą, niż błądzenie duszy. To także jest marnością i utrapieniem ducha."
  tags: []
"Kaz6,10":
  text: "Temu co było, imię zostało już nadane i wiadomo kim jest człowiek, że nie jest on w stanie spierać się z silniejszym od siebie."
  tags: []
"Kaz6,11":
  text: "Bo wiele jest spraw, które pomnażają marność, to jaką korzyść ma człowiek?"
  tags: []
"Kaz6,12":
  text: "Bo kto wie, co jest dobre dla człowieka w tym życiu przez liczne dni jego marnego życia – a te przemijają jak cień? Kto oznajmi człowiekowi, co po nim będzie pod słońcem?"
  tags: []
