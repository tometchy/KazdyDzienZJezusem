"Kaz6,1": "Jest zło, które widziałem pod słońcem, które jest powszechne wśród ludzi:"
"Kaz6,2": "Człowiekowi, któremu Bóg dał bogactwo, majątek i sławę, i nie brakuje jego duszy niczego, czego pragnie – a Bóg nie daje mu możliwości spożywać tego, ale spożywa to obcy człowiek. To także jest marnością i bolesnym złem."
"Kaz6,3": "Choćby spłodził stu mężczyzn, żył wiele lat i wiele by było w tych latach dni, a jego dusza nie nasyciła by się dobrem a też nie miałaby pogrzebu, to powiem: Lepiej niż on miał poroniony płód."
"Kaz6,4": "Bo przyszedł jak we mgle i odchodzi w ciemności, a jego imię spowija mrok."
"Kaz6,5": "Nie widział też słońca ani nic nie poznał. Ma większy spokój niż tamten."
"Kaz6,6": "I choćby żył tysiące lat – dwukrotnie, lecz dobra by nie zobaczył, to czyż wszystko nie zmierza do jednego miejsca?"
"Kaz6,7": "Wszelki trud człowieka jest przeznaczony dla jego ust, a jednak jego dusza nie zostanie napełniona."
"Kaz6,8": "Bo co za przewaga mądrego nad głupim? I co ubogiemu z tego, że umie właściwie postępować przed żyjącymi?"
"Kaz6,9": "Lepsze jest to, co oczy widzą, niż błądzenie duszy. To także jest marnością i utrapieniem ducha."
"Kaz6,10": "Temu co było, imię zostało już nadane i wiadomo kim jest człowiek, że nie jest on w stanie spierać się z silniejszym od siebie."
"Kaz6,11": "Bo wiele jest spraw, które pomnażają marność, to jaką korzyść ma człowiek?"
"Kaz6,12": "Bo kto wie, co jest dobre dla człowieka w tym życiu przez liczne dni jego marnego życia – a te przemijają jak cień? Kto oznajmi człowiekowi, co po nim będzie pod słońcem?"
