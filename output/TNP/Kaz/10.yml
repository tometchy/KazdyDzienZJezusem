"Kaz10,1":
  text: "Martwa mucha zasmrodzi i zepsuje olejek mieszającego. Cięższą od mądrości i chwały bywa odrobina głupoty."
  tags: []
"Kaz10,2":
  text: "Serce mądrego jest po jego prawicy, a serce głupca po jego lewicy."
  tags: []
"Kaz10,3":
  text: "Także i drogą, którą idzie głupiec idzie jego wybrakowane serce, w ten sposób mówi wszystkim, że on jest głupcem."
  tags: []
"Kaz10,4":
  text: "Jeśli gniew władcy rośnie przeciwko tobie, nie opuszczaj swojego miejsca, gdyż spokój jest lekarstwem na wielkie przewinienie."
  tags: []
"Kaz10,5":
  text: "Jest pewne zło, które widziałem pod słońcem: To błąd, pochodzący sprzed oblicza władcy:"
  tags: []
"Kaz10,6":
  text: "Głupota jest wyniesiona do wielkiej godności, a bogaci w mądrość siedzą nisko."
  tags: []
"Kaz10,7":
  text: "Widziałem sługi na koniach, a książąt idących pieszo jak słudzy."
  tags: []
"Kaz10,8":
  text: "Kto kopie dół, sam w niego wpadnie, kto rozwala płot, tego ukąsi wąż."
  tags: []
"Kaz10,9":
  text: "Kto wydobywa kamienie, zostanie przez nie zraniony, kto rąbie drwa, naraża się na niebezpieczeństwo."
  tags: []
"Kaz10,10":
  text: "Jeśli stępiło się żelazne narzędzie, a nie zostanie naostrzone jego ostrze, wtedy trzeba będzie wytężyć siły. A korzystniejsze jest osiągnąć cel przez mądrość."
  tags: []
"Kaz10,11":
  text: "Jeśli wąż ukąsi przed zaklęciem, zaklinacz nie odnosi korzyści."
  tags: []
"Kaz10,12":
  text: "Słowa z ust mądrego zyskują życzliwość, ale wargi głupca połykają jego samego."
  tags: []
"Kaz10,13":
  text: "Początek słów jego ust to głupota, a koniec słów jego ust to groźne szaleństwo."
  tags: []
"Kaz10,14":
  text: "Głupiec mnoży słowa, choć człowiek nie wie, co będzie. Kto mu oznajmi, co po nim się stanie?"
  tags: []
"Kaz10,15":
  text: "Trud głupców męczy ich, tak że głupiec nie wie nawet jak dojść do miasta."
  tags: []
"Kaz10,16":
  text: "Biada tobie, ziemio, gdy twoim królem jest młodzieniec, a twoi książęta z rana ucztują."
  tags: []
"Kaz10,17":
  text: "Błogosławiona jesteś, ziemio, gdy twój król jest synem ze szlachetnego rodu, a twoi książęta we właściwym czasie jadają, by nabrać siły, a nie dla pijaństwa."
  tags: []
"Kaz10,18":
  text: "Z powodu lenistwa zapada się dach, a wskutek opuszczonych rąk przecieka dom."
  tags: []
"Kaz10,19":
  text: "Dla śmiechu przygotowują ucztę, a wino rozwesela życie. Srebro odpowiada za to wszystko."
  tags: []
"Kaz10,20":
  text: "Nawet w swoich myślach nie złorzecz królowi ani w swojej sypialni nie przeklinaj bogatego, bo ptak niebios zaniesie ten głos, a skrzydlate stworzenie rozgłosi sprawę."
  tags: []
