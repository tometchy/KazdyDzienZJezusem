"Kaz10,1": "Martwa mucha zasmrodzi i zepsuje olejek mieszającego. Cięższą od mądrości i chwały bywa odrobina głupoty."
"Kaz10,2": "Serce mądrego jest po jego prawicy, a serce głupca po jego lewicy."
"Kaz10,3": "Także i drogą, którą idzie głupiec idzie jego wybrakowane serce, w ten sposób mówi wszystkim, że on jest głupcem."
"Kaz10,4": "Jeśli gniew władcy rośnie przeciwko tobie, nie opuszczaj swojego miejsca, gdyż spokój jest lekarstwem na wielkie przewinienie."
"Kaz10,5": "Jest pewne zło, które widziałem pod słońcem: To błąd, pochodzący sprzed oblicza władcy:"
"Kaz10,6": "Głupota jest wyniesiona do wielkiej godności, a bogaci w mądrość siedzą nisko."
"Kaz10,7": "Widziałem sługi na koniach, a książąt idących pieszo jak słudzy."
"Kaz10,8": "Kto kopie dół, sam w niego wpadnie, kto rozwala płot, tego ukąsi wąż."
"Kaz10,9": "Kto wydobywa kamienie, zostanie przez nie zraniony, kto rąbie drwa, naraża się na niebezpieczeństwo."
"Kaz10,10": "Jeśli stępiło się żelazne narzędzie, a nie zostanie naostrzone jego ostrze, wtedy trzeba będzie wytężyć siły. A korzystniejsze jest osiągnąć cel przez mądrość."
"Kaz10,11": "Jeśli wąż ukąsi przed zaklęciem, zaklinacz nie odnosi korzyści."
"Kaz10,12": "Słowa z ust mądrego zyskują życzliwość, ale wargi głupca połykają jego samego."
"Kaz10,13": "Początek słów jego ust to głupota, a koniec słów jego ust to groźne szaleństwo."
"Kaz10,14": "Głupiec mnoży słowa, choć człowiek nie wie, co będzie. Kto mu oznajmi, co po nim się stanie?"
"Kaz10,15": "Trud głupców męczy ich, tak że głupiec nie wie nawet jak dojść do miasta."
"Kaz10,16": "Biada tobie, ziemio, gdy twoim królem jest młodzieniec, a twoi książęta z rana ucztują."
"Kaz10,17": "Błogosławiona jesteś, ziemio, gdy twój król jest synem ze szlachetnego rodu, a twoi książęta we właściwym czasie jadają, by nabrać siły, a nie dla pijaństwa."
"Kaz10,18": "Z powodu lenistwa zapada się dach, a wskutek opuszczonych rąk przecieka dom."
"Kaz10,19": "Dla śmiechu przygotowują ucztę, a wino rozwesela życie. Srebro odpowiada za to wszystko."
"Kaz10,20": "Nawet w swoich myślach nie złorzecz królowi ani w swojej sypialni nie przeklinaj bogatego, bo ptak niebios zaniesie ten głos, a skrzydlate stworzenie rozgłosi sprawę."
