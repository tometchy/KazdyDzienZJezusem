"Kaz12,1": "Pamiętaj więc o swoim Stwórcy w dniach swojej młodości, zanim przyjdą trudne dni i zbliżą się lata, o których powiesz: Nie mam w nich dla siebie rozkoszy."
"Kaz12,2": "Zanim zaćmią się słońce i światło, i księżyc, i gwiazdy, a chmury powrócą po deszczu."
"Kaz12,3": "W dniu, w którym drżeć będą stróże domu i pochylą się silni mężczyźni, ustaną młynarki, gdyż będzie ich niewiele, i osłabnie wzrok patrzących przez okna;"
"Kaz12,4": "I zamkną się drzwi na ulicę, gdy dźwięk młyna osłabnie, gdy będą wstawać na głos ptaka i przycichną wszystkie dźwięki pieśni."
"Kaz12,5": "Także gdy będą bać się wysokości i przerażenia będącego na drodze, gdy zakwitnie migdałowiec, a konik polny będzie się wlec i nie pomogą owoce kaparu, bo człowiek idzie do swojego wiecznego domu, a zawodzący otaczają go na ulicy;"
"Kaz12,6": "Zanim zostanie zerwany srebrny sznur i popęka złota lampa, i zostanie rozbity dzban u źródła i kołowrót u studni zostanie złamany."
"Kaz12,7": "I wróci proch do ziemi, jak nim był, a duch wróci do Boga, który go dał."
"Kaz12,8": "Marność nad marnościami – mówi Kaznodzieja – wszystko to marność."
"Kaz12,9": "A ponadto, Kaznodzieja, który był mądry, nieustanie uczył ten lud wiedzy, rozważał, badał – ułożył wiele przysłów."
"Kaz12,10": "Kaznodzieja starał się znaleźć słowa najtrafniejsze, spisał to, co jest prawe – słowa prawdy."
"Kaz12,11": "Słowa mądrych są jak ościenie i jak gwoździe wbite mocno przez właścicieli zbiorów – dane są od jednego Pasterza."
"Kaz12,12": "A ponadto, mój synu, przyjmij ostrzeżenie z tych słów: Pisaniu wielu zwojów nie ma końca, a nadmierne rozważanie męczy ciało."
"Kaz12,13": "Słowo na koniec, gdy wszystko zostało wysłuchane: Bój się Boga i przestrzegaj Jego przykazań. Bo jest to obowiązek każdego człowieka."
"Kaz12,14": "Gdyż Bóg każdy czyn przywiedzie na sąd, który odbędzie się nad każdą sprawą ukrytą – czy to dobrą, czy złą."
