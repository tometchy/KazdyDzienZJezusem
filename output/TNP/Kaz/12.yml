"Kaz12,1":
  text: "Pamiętaj więc o swoim Stwórcy w dniach swojej młodości, zanim przyjdą trudne dni i zbliżą się lata, o których powiesz: Nie mam w nich dla siebie rozkoszy."
  tags: []
"Kaz12,2":
  text: "Zanim zaćmią się słońce i światło, i księżyc, i gwiazdy, a chmury powrócą po deszczu."
  tags: []
"Kaz12,3":
  text: "W dniu, w którym drżeć będą stróże domu i pochylą się silni mężczyźni, ustaną młynarki, gdyż będzie ich niewiele, i osłabnie wzrok patrzących przez okna;"
  tags: []
"Kaz12,4":
  text: "I zamkną się drzwi na ulicę, gdy dźwięk młyna osłabnie, gdy będą wstawać na głos ptaka i przycichną wszystkie dźwięki pieśni."
  tags: []
"Kaz12,5":
  text: "Także gdy będą bać się wysokości i przerażenia będącego na drodze, gdy zakwitnie migdałowiec, a konik polny będzie się wlec i nie pomogą owoce kaparu, bo człowiek idzie do swojego wiecznego domu, a zawodzący otaczają go na ulicy;"
  tags: []
"Kaz12,6":
  text: "Zanim zostanie zerwany srebrny sznur i popęka złota lampa, i zostanie rozbity dzban u źródła i kołowrót u studni zostanie złamany."
  tags: []
"Kaz12,7":
  text: "I wróci proch do ziemi, jak nim był, a duch wróci do Boga, który go dał."
  tags: []
"Kaz12,8":
  text: "Marność nad marnościami – mówi Kaznodzieja – wszystko to marność."
  tags: []
"Kaz12,9":
  text: "A ponadto, Kaznodzieja, który był mądry, nieustanie uczył ten lud wiedzy, rozważał, badał – ułożył wiele przysłów."
  tags: []
"Kaz12,10":
  text: "Kaznodzieja starał się znaleźć słowa najtrafniejsze, spisał to, co jest prawe – słowa prawdy."
  tags: []
"Kaz12,11":
  text: "Słowa mądrych są jak ościenie i jak gwoździe wbite mocno przez właścicieli zbiorów – dane są od jednego Pasterza."
  tags: []
"Kaz12,12":
  text: "A ponadto, mój synu, przyjmij ostrzeżenie z tych słów: Pisaniu wielu zwojów nie ma końca, a nadmierne rozważanie męczy ciało."
  tags: []
"Kaz12,13":
  text: "Słowo na koniec, gdy wszystko zostało wysłuchane: Bój się Boga i przestrzegaj Jego przykazań. Bo jest to obowiązek każdego człowieka."
  tags: []
"Kaz12,14":
  text: "Gdyż Bóg każdy czyn przywiedzie na sąd, który odbędzie się nad każdą sprawą ukrytą – czy to dobrą, czy złą."
  tags: []
