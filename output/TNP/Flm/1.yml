"Flm1,1": "Paweł, więzień Chrystusa Jezusa i Tymoteusz, brat, do Filemona umiłowanego – i naszego współpracownika,"
"Flm1,2": "I do umiłowanej Apfii, i do Archipa, naszego współbojownika, i do zboru, który jest w twoim domu."
"Flm1,3": "Łaska wam i pokój od Boga, Ojca naszego i Pana Jezusa Chrystusa."
"Flm1,4": "Dziękuję Bogu mojemu, zawsze wspominając ciebie w moich modlitwach,"
"Flm1,5": "Słysząc o twojej miłości i o wierze, którą masz wobec Pana Jezusa i względem wszystkich świętych,"
"Flm1,6": "Aby twój udział w wierze stał się skuteczny w dogłębnym poznaniu całego dobra, które jest w was, ze względu na Chrystusa Jezusa."
"Flm1,7": "Albowiem mamy wielką radość i zachętę z powodu twojej miłości, bo serca świętych orzeźwione są przez ciebie bracie."
"Flm1,8": "Dlatego, mając wielką śmiałość w Chrystusie mógłbym ci rozkazywać, co należy."
"Flm1,9": "Raczej ze względu na tę miłość proszę, ja, Paweł, starzec, a teraz i więzień Jezusa Chrystusa."
"Flm1,10": "Proszę cię więc o dziecko moje, o Onezyma, którego zrodziłem w moich więzach,"
"Flm1,11": "Który tobie kiedyś był nieprzydatny, ale teraz tobie i mnie jest przydatny;"
"Flm1,12": "Którego ci odesłałem, a jego, to jest moje serce, przygarnij."
"Flm1,13": "Chciałem go zatrzymać przy sobie, aby za ciebie służył mi w więzach Ewangelii."
"Flm1,14": "Ale bez twojego postanowienia nie chciałem nic uczynić, aby dobry twój czyn nie był jakby z przymusu, lecz z dobrej woli."
"Flm1,15": "Bo być może, dlatego na chwilę został od ciebie odłączony, abyś ponownie otrzymał go na wieki."
"Flm1,16": "Już nie jako niewolnika, ale więcej niż niewolnika, jako brata umiłowanego, a szczególnie dla mnie, a o ileż bardziej dla ciebie i w ciele, i w Panu."
"Flm1,17": "Jeśli więc masz mnie za towarzysza, to przyjmij go jak mnie."
"Flm1,18": "A jeśli ciebie w czymś skrzywdził albo jest coś winny, zapisuj to na mój rachunek."
"Flm1,19": "Ja, Paweł, napisałem własną ręką; ja zapłacę, nie mówiąc o tym, że jesteś mi winien samego siebie w zamian."
"Flm1,20": "Tak, bracie, obym ja przez ciebie doznał radości w Panu, odśwież moje serce w Panu."
"Flm1,21": "Przekonany o twoim posłuszeństwie napisałem do ciebie, wiedząc, że uczynisz więcej niż mówię."
"Flm1,22": "A jednocześnie przygotuj mi gościnę; albowiem mam nadzieję, że przez modlitwy wasze będę wam darowany."
"Flm1,23": "Pozdrawiają cię Epafras, mój współwięzień w Chrystusie Jezusie,"
"Flm1,24": "Marek, Arystarch, Demas, Łukasz, moi współpracownicy."
"Flm1,25": "Łaska Pana naszego Jezusa Chrystusa z duchem waszym. Amen."
