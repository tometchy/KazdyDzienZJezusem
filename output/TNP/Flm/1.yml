"Flm1,1":
  text: "Paweł, więzień Chrystusa Jezusa i Tymoteusz, brat, do Filemona umiłowanego – i naszego współpracownika,"
  tags: []
"Flm1,2":
  text: "I do umiłowanej Apfii, i do Archipa, naszego współbojownika, i do zboru, który jest w twoim domu."
  tags: []
"Flm1,3":
  text: "Łaska wam i pokój od Boga, Ojca naszego i Pana Jezusa Chrystusa."
  tags: []
"Flm1,4":
  text: "Dziękuję Bogu mojemu, zawsze wspominając ciebie w moich modlitwach,"
  tags: []
"Flm1,5":
  text: "Słysząc o twojej miłości i o wierze, którą masz wobec Pana Jezusa i względem wszystkich świętych,"
  tags: []
"Flm1,6":
  text: "Aby twój udział w wierze stał się skuteczny w dogłębnym poznaniu całego dobra, które jest w was, ze względu na Chrystusa Jezusa."
  tags: []
"Flm1,7":
  text: "Albowiem mamy wielką radość i zachętę z powodu twojej miłości, bo serca świętych orzeźwione są przez ciebie bracie."
  tags: []
"Flm1,8":
  text: "Dlatego, mając wielką śmiałość w Chrystusie mógłbym ci rozkazywać, co należy."
  tags: []
"Flm1,9":
  text: "Raczej ze względu na tę miłość proszę, ja, Paweł, starzec, a teraz i więzień Jezusa Chrystusa."
  tags: []
"Flm1,10":
  text: "Proszę cię więc o dziecko moje, o Onezyma, którego zrodziłem w moich więzach,"
  tags: []
"Flm1,11":
  text: "Który tobie kiedyś był nieprzydatny, ale teraz tobie i mnie jest przydatny;"
  tags: []
"Flm1,12":
  text: "Którego ci odesłałem, a jego, to jest moje serce, przygarnij."
  tags: []
"Flm1,13":
  text: "Chciałem go zatrzymać przy sobie, aby za ciebie służył mi w więzach Ewangelii."
  tags: []
"Flm1,14":
  text: "Ale bez twojego postanowienia nie chciałem nic uczynić, aby dobry twój czyn nie był jakby z przymusu, lecz z dobrej woli."
  tags: []
"Flm1,15":
  text: "Bo być może, dlatego na chwilę został od ciebie odłączony, abyś ponownie otrzymał go na wieki."
  tags: []
"Flm1,16":
  text: "Już nie jako niewolnika, ale więcej niż niewolnika, jako brata umiłowanego, a szczególnie dla mnie, a o ileż bardziej dla ciebie i w ciele, i w Panu."
  tags: []
"Flm1,17":
  text: "Jeśli więc masz mnie za towarzysza, to przyjmij go jak mnie."
  tags: []
"Flm1,18":
  text: "A jeśli ciebie w czymś skrzywdził albo jest coś winny, zapisuj to na mój rachunek."
  tags: []
"Flm1,19":
  text: "Ja, Paweł, napisałem własną ręką; ja zapłacę, nie mówiąc o tym, że jesteś mi winien samego siebie w zamian."
  tags: []
"Flm1,20":
  text: "Tak, bracie, obym ja przez ciebie doznał radości w Panu, odśwież moje serce w Panu."
  tags: []
"Flm1,21":
  text: "Przekonany o twoim posłuszeństwie napisałem do ciebie, wiedząc, że uczynisz więcej niż mówię."
  tags: []
"Flm1,22":
  text: "A jednocześnie przygotuj mi gościnę; albowiem mam nadzieję, że przez modlitwy wasze będę wam darowany."
  tags: []
"Flm1,23":
  text: "Pozdrawiają cię Epafras, mój współwięzień w Chrystusie Jezusie,"
  tags: []
"Flm1,24":
  text: "Marek, Arystarch, Demas, Łukasz, moi współpracownicy."
  tags: []
"Flm1,25":
  text: "Łaska Pana naszego Jezusa Chrystusa z duchem waszym. Amen."
  tags: []
