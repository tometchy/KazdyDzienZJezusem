"Hi42,1": "I Hiob odpowiedział JHWH:"
"Hi42,2": "Wiem, że Ty możesz wszystko, a nie może żaden Twój zamysł zostać udaremniony."
"Hi42,3": "Pytałeś: Kim jest ten, który zaciemnia mój zamysł bez zrozumienia? To ja, dlatego obwieszczałem to, czego nie rozumiałem; to dla mnie zbyt cudowne – i nic o tym nie wiem."
"Hi42,4": "Powiedziałeś: Wysłuchaj teraz, a ja będę mówił; będę cię pytał, a ty mi odpowiedz."
"Hi42,5": "Tylko ze słuchania uchem zasłyszałem o Tobie, lecz teraz moje oko Cię ujrzało."
"Hi42,6": "Dlatego też gardzę sobą i kajam się w prochu i popiele."
"Hi42,7": "I stało się po tym, gdy JHWH wypowiedział te słowa do Hioba, powiedział JHWH do Elifaza z Temanu: Mój gniew zapłonął przeciw tobie i dwom twoim przyjaciołom, ponieważ nie mówiliście o mnie właściwie jak mój sługa Hiob."
"Hi42,8": "Teraz więc weźcie sobie siedem cielców i siedem baranów, idźcie do mojego sługi Hioba i ofiarujcie całopalenie za siebie; a Hiob, mój sługa, będzie się modlił za was, bo jego oblicze przyjmę, abym nie uczynił z wami według waszej głupoty. Ponieważ nie mówiliście o mnie właściwie jak mój sługa Hiob."
"Hi42,9": "Poszli więc Elifaz Temanita i Bildad Szuachita, Sofar Naamanita i uczynili to, co JHWH do nich powiedział. JHWH także przyjął oblicze Hioba."
"Hi42,10": "JHWH więc przywrócił to, co zostało zabrane Hiobowi, gdy się modlił za swoich przyjaciół. JHWH także pomnożył Hiobowi w dwójnasób wszystko, co miał."
"Hi42,11": "Wtedy przybyli do niego wszyscy jego bracia, wszystkie jego siostry i wszyscy znający go przedtem i jedli z nim chleb w jego domu. Ubolewali nad nim i pocieszali go z powodu wszystkich nieszczęść, które JHWH sprowadził na niego. Każdy dał mu po jednej kesicie i każdy po jednym złotym kolczyku."
"Hi42,12": "I tak JHWH błogosławił ostatnie lata Hioba bardziej niż początkowe. I stało się, że miał on czternaście tysięcy owiec, sześć tysięcy wielbłądów, tysiąc jarzm wołu i tysiąc oślic."
"Hi42,13": "I miał on też siedmiu synów i trzy córki."
"Hi42,14": "I nadał pierwszej imię Jemima, drugiej imię Kesja i trzeciej imię Kerenhappuk."
"Hi42,15": "I nie można było w całej tej ziemi znaleźć kobiet tak pięknych, jak córki Hioba. Ich ojciec dał im dziedzictwo wśród ich braci."
"Hi42,16": "Potem Hiob żył jeszcze sto czterdzieści lat i oglądał swoich synów i synów swoich synów aż do czwartego pokolenia."
"Hi42,17": "I umarł Hiob stary i syty dni."
