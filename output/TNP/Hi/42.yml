"Hi42,1":
  text: "I Hiob odpowiedział JHWH:"
  tags: []
"Hi42,2":
  text: "Wiem, że Ty możesz wszystko, a nie może żaden Twój zamysł zostać udaremniony."
  tags: []
"Hi42,3":
  text: "Pytałeś: Kim jest ten, który zaciemnia mój zamysł bez zrozumienia? To ja, dlatego obwieszczałem to, czego nie rozumiałem; to dla mnie zbyt cudowne – i nic o tym nie wiem."
  tags: []
"Hi42,4":
  text: "Powiedziałeś: Wysłuchaj teraz, a ja będę mówił; będę cię pytał, a ty mi odpowiedz."
  tags: []
"Hi42,5":
  text: "Tylko ze słuchania uchem zasłyszałem o Tobie, lecz teraz moje oko Cię ujrzało."
  tags: []
"Hi42,6":
  text: "Dlatego też gardzę sobą i kajam się w prochu i popiele."
  tags: []
"Hi42,7":
  text: "I stało się po tym, gdy JHWH wypowiedział te słowa do Hioba, powiedział JHWH do Elifaza z Temanu: Mój gniew zapłonął przeciw tobie i dwom twoim przyjaciołom, ponieważ nie mówiliście o mnie właściwie jak mój sługa Hiob."
  tags: []
"Hi42,8":
  text: "Teraz więc weźcie sobie siedem cielców i siedem baranów, idźcie do mojego sługi Hioba i ofiarujcie całopalenie za siebie; a Hiob, mój sługa, będzie się modlił za was, bo jego oblicze przyjmę, abym nie uczynił z wami według waszej głupoty. Ponieważ nie mówiliście o mnie właściwie jak mój sługa Hiob."
  tags: []
"Hi42,9":
  text: "Poszli więc Elifaz Temanita i Bildad Szuachita, Sofar Naamanita i uczynili to, co JHWH do nich powiedział. JHWH także przyjął oblicze Hioba."
  tags: []
"Hi42,10":
  text: "JHWH więc przywrócił to, co zostało zabrane Hiobowi, gdy się modlił za swoich przyjaciół. JHWH także pomnożył Hiobowi w dwójnasób wszystko, co miał."
  tags: []
"Hi42,11":
  text: "Wtedy przybyli do niego wszyscy jego bracia, wszystkie jego siostry i wszyscy znający go przedtem i jedli z nim chleb w jego domu. Ubolewali nad nim i pocieszali go z powodu wszystkich nieszczęść, które JHWH sprowadził na niego. Każdy dał mu po jednej kesicie i każdy po jednym złotym kolczyku."
  tags: []
"Hi42,12":
  text: "I tak JHWH błogosławił ostatnie lata Hioba bardziej niż początkowe. I stało się, że miał on czternaście tysięcy owiec, sześć tysięcy wielbłądów, tysiąc jarzm wołu i tysiąc oślic."
  tags: []
"Hi42,13":
  text: "I miał on też siedmiu synów i trzy córki."
  tags: []
"Hi42,14":
  text: "I nadał pierwszej imię Jemima, drugiej imię Kesja i trzeciej imię Kerenhappuk."
  tags: []
"Hi42,15":
  text: "I nie można było w całej tej ziemi znaleźć kobiet tak pięknych, jak córki Hioba. Ich ojciec dał im dziedzictwo wśród ich braci."
  tags: []
"Hi42,16":
  text: "Potem Hiob żył jeszcze sto czterdzieści lat i oglądał swoich synów i synów swoich synów aż do czwartego pokolenia."
  tags: []
"Hi42,17":
  text: "I umarł Hiob stary i syty dni."
  tags: []
