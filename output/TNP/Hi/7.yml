"Hi7,1": "Czyż nie służbę ma człowiek na ziemi? I czyż nie są jego dni jak dni najemnika?"
"Hi7,2": "Jak sługa pragnie cienia, i jak najemnik czeka na swoją zapłatę,"
"Hi7,3": "Tak moim udziałem są miesiące marności i wyznaczono mi noce pełne udręki."
"Hi7,4": "Gdy się kładę i myślę: Kiedy wstanę? Noc się wydłuża, a jestem nasycony niepokojem aż do świtu."
"Hi7,5": "Moje ciało obleczone robactwem i grudą prochu, moja skóra pęka i ropieje."
"Hi7,6": "Moje dni umykają bardziej niż czółenko tkackie i przemijają bez nadziei."
"Hi7,7": "Pamiętaj, że moje życie jest powiewem, moje oko nie zobaczy już więcej dobra."
"Hi7,8": "Oko patrzącego już mnie nie zobaczy. Twoje oczy są zwrócone na mnie, a mnie już nie ma!"
"Hi7,9": "Jak obłok znika i przemija, tak zstępujący do Szeolu – nie wraca."
"Hi7,10": "Nie wróci już do swojego domu ani nie rozpozna go już jego miejsce."
"Hi7,11": "Dlatego ja nie mogę powstrzymać swoich ust, będę mówił w udręce mojego ducha, będę narzekał w goryczy mojej duszy."
"Hi7,12": "Czy ja jestem morzem lub potworem morskim, że postawiłeś przy mnie straż?"
"Hi7,13": "Gdy myślę: Pocieszy mnie moje łóżko, a moje posłanie ulży mojemu narzekaniu;"
"Hi7,14": "To straszysz mnie snami i przerażasz mnie wizjami;"
"Hi7,15": "Więc moja dusza wybiera uduszenie, śmierć raczej niż moje życie."
"Hi7,16": "Gardzę życiem, nie chcę tu żyć na wieki. Zostaw mnie, bo moje dni są marnością."
"Hi7,17": "Czym jest człowiek, że tak go wywyższasz i że zwracasz ku niemu swoje serce?"
"Hi7,18": "Że nawiedzasz go co poranek i co chwila doświadczasz?"
"Hi7,19": "Czy nie przestaniesz wpatrywać się we mnie i nie pozwolisz mi nawet przełknąć swoją ślinę?"
"Hi7,20": "Zgrzeszyłem, co uczyniłem Tobie, Stróżu człowieka? Dlaczego wziąłeś mnie za cel, abym był sam dla siebie ciężarem?"
"Hi7,21": "I dlaczego nie usuwasz mojego przestępstwa, a nie zmażesz mojej nieprawości? Bo teraz położę się w prochu i gdy będziesz zabiegał o mnie, nie będzie mnie."
