"Hi12,1": "A Hiob odpowiedział i rzekł:"
"Hi12,2": "Niewątpliwie wiem, że wy jesteście ludźmi i wraz z wami zginie mądrość."
"Hi12,3": "Lecz ja mam rozum, jak i wy, i ja nie jestem od was gorszy. I komu nie są znane sprawy takie jak te?"
"Hi12,4": "Stałem się pośmiewiskiem dla swojego przyjaciela; ja, który wołam do Boga, a On odpowiada; jako sprawiedliwy i nienaganny stałem się szyderstwem."
"Hi12,5": "Płonącą pochodnią pogardy jest myśl butnego, ciosem dla chwiejących się na nogach"
"Hi12,6": "Spokojne są namioty łupieżców i bezpieczeństwo dla drażniących Boga – dla tego, który nosi boga w swojej ręce."
"Hi12,7": "A jednak, zapytaj proszę zwierząt, a pouczą cię, i ptaków niebios – a wyjaśnią ci."
"Hi12,8": "Albo mów z ziemią, a ona cię pouczy, i opowiedzą ci ryby morza."
"Hi12,9": "Kto spośród nich wszystkich nie wie tego, że ręka JHWH to uczyniła?"
"Hi12,10": "W Jego ręku jest dusza każdej istoty żywej i tchnienie w ciele każdego człowieka."
"Hi12,11": "Czy ucho nie ma badać słów, jak podniebienie próbuje smaku pożywienia?"
"Hi12,12": "U sędziwych jest mądrość, a w długości dni roztropność."
"Hi12,13": "Z Nim jest mądrość i siła, do Niego należy rada i roztropność."
"Hi12,14": "Oto co On zburzy, to nie zostanie odbudowane; gdy zamyka człowieka, to on nie zostanie uwolniony."
"Hi12,15": "Oto wstrzymuje wody i wysychają, a gdy je wypuści, to przemieniają ziemię."
"Hi12,16": "Z Nim jest moc i rozsądek. Do Niego należy zwiedziony i zwodziciel."
"Hi12,17": "Sprawia, że doradcy odchodzą boso, a sędziów czyni głupcami."
"Hi12,18": "Rozwiązuje dekrety królów i zawiązuje przepaskę wokół ich bioder."
"Hi12,19": "Sprawia, że kapłani odchodzą boso i przewraca niezachwianych."
"Hi12,20": "Odbiera mowę doświadczonym, a starców pozbawia rozeznania."
"Hi12,21": "Na dostojników wylewa pogardę, a rozluźnia pas mocarzy."
"Hi12,22": "On odsłania głębie okryte ciemnością i wyprowadza na światło cień śmierci."
"Hi12,23": "Czyni narody wielkimi i gubi je, rozprzestrzenia narody i rozprasza je."
"Hi12,24": "On pozbawia rozumu naczelników ludów ziemi i sprawia, że błądzą w pustce bezdroży;"
"Hi12,25": "I chodzą po omacku w ciemności, bez światła, i sprawia, że błąkają się jak pijani."
