"Hi32,1": "I wstrzymali się od odpowiedzi Hiobowi ci trzej mężczyźni, ponieważ był sprawiedliwy we własnych oczach;"
"Hi32,2": "Wtedy zapłonął gniewem Elihu, syn Barakeela, Buzyta, z rodu Ram; zapłonął jego gniew na Hioba, z powodu usprawiedliwiania jego duszy bardziej niż Boga."
"Hi32,3": "Także przeciwko jego trzem przyjaciołom rozpalił się jego gniew, za to, że nie znaleźli odpowiedzi, a jednak potępiali Hioba."
"Hi32,4": "A Elihu czekał na Hioba ze słowami aż skończy, gdyż oni byli od niego starsi co do dni."
"Hi32,5": "A gdy zobaczył Elihu, że nie było w ustach tych trzech mężczyzn odpowiedzi – zapłonął gniewem."
"Hi32,6": "I odpowiedział Elihu, syn Barakeela, Buzyta i rzekł: Ja jestem młody w dniach, a wy jesteście sędziwi, dlatego wahałem się i trwożyłem się, by przedstawić wam swoje zdanie."
"Hi32,7": "Myślałem: Niech przemówią dni, a mnogość lat niech ujawni mądrość."
"Hi32,8": "Lecz to duch w człowieku i tchnienie Wszechmogącego dają zrozumienie."
"Hi32,9": "Wielcy nie zawsze postępują mądrze, a sędziwi nie zawsze rozumieją to, co słuszne."
"Hi32,10": "Dlatego mówię: Posłuchaj mnie! Ja też przedstawię swoje zdanie."
"Hi32,11": "Oto czekałem na wasze słowa i słuchałem podczas waszych wywodów, aż zgłębicie swoje słowa."
"Hi32,12": "I na was skierowałem uwagę i oto nie było nikogo, kto przekonałby Hioba ani kto odpowiedziałby na jego mowy;"
"Hi32,13": "Abyście nie powiedzieli: Znaleźliśmy mądrość. Bóg może dać mu odpór – nie człowiek."
"Hi32,14": "Lecz nie do mnie skierował swoje mowy, a ja w słowach waszych mu nie odpowiem."
"Hi32,15": "Zaniepokoili się i już nie odpowiadali; odebrano im te słowa."
"Hi32,16": "I czy muszę jeszcze czekać, ponieważ nie mówią, gdyż stanęli i już więcej nie odpowiadają."
"Hi32,17": "Odpowiem także i ja w mojej części i ja wyjaśnię też swoje zdanie."
"Hi32,18": "Bo jestem pełny słów, przymusza mnie duch w moim wnętrzu."
"Hi32,19": "Oto moje wnętrze jest jak wino, które nie ma ujścia; jak nowe bukłaki zagrożone pęknięciem."
"Hi32,20": "Muszę mówić, aby ulżyć sobie; muszę otworzyć swoje wargi i muszę odpowiedzieć."
"Hi32,21": "Ach! Nie będę miał względu na mężczyznę i człowiekowi nie będę schlebiał!"
"Hi32,22": "Bo nie umiem schlebiać, gdyż mój Stwórca szybko by mnie uniósł."
