"Hi32,1":
  text: "I wstrzymali się od odpowiedzi Hiobowi ci trzej mężczyźni, ponieważ był sprawiedliwy we własnych oczach;"
  tags: []
"Hi32,2":
  text: "Wtedy zapłonął gniewem Elihu, syn Barakeela, Buzyta, z rodu Ram; zapłonął jego gniew na Hioba, z powodu usprawiedliwiania jego duszy bardziej niż Boga."
  tags: []
"Hi32,3":
  text: "Także przeciwko jego trzem przyjaciołom rozpalił się jego gniew, za to, że nie znaleźli odpowiedzi, a jednak potępiali Hioba."
  tags: []
"Hi32,4":
  text: "A Elihu czekał na Hioba ze słowami aż skończy, gdyż oni byli od niego starsi co do dni."
  tags: []
"Hi32,5":
  text: "A gdy zobaczył Elihu, że nie było w ustach tych trzech mężczyzn odpowiedzi – zapłonął gniewem."
  tags: []
"Hi32,6":
  text: "I odpowiedział Elihu, syn Barakeela, Buzyta i rzekł: Ja jestem młody w dniach, a wy jesteście sędziwi, dlatego wahałem się i trwożyłem się, by przedstawić wam swoje zdanie."
  tags: []
"Hi32,7":
  text: "Myślałem: Niech przemówią dni, a mnogość lat niech ujawni mądrość."
  tags: []
"Hi32,8":
  text: "Lecz to duch w człowieku i tchnienie Wszechmogącego dają zrozumienie."
  tags: []
"Hi32,9":
  text: "Wielcy nie zawsze postępują mądrze, a sędziwi nie zawsze rozumieją to, co słuszne."
  tags: []
"Hi32,10":
  text: "Dlatego mówię: Posłuchaj mnie! Ja też przedstawię swoje zdanie."
  tags: []
"Hi32,11":
  text: "Oto czekałem na wasze słowa i słuchałem podczas waszych wywodów, aż zgłębicie swoje słowa."
  tags: []
"Hi32,12":
  text: "I na was skierowałem uwagę i oto nie było nikogo, kto przekonałby Hioba ani kto odpowiedziałby na jego mowy;"
  tags: []
"Hi32,13":
  text: "Abyście nie powiedzieli: Znaleźliśmy mądrość. Bóg może dać mu odpór – nie człowiek."
  tags: []
"Hi32,14":
  text: "Lecz nie do mnie skierował swoje mowy, a ja w słowach waszych mu nie odpowiem."
  tags: []
"Hi32,15":
  text: "Zaniepokoili się i już nie odpowiadali; odebrano im te słowa."
  tags: []
"Hi32,16":
  text: "I czy muszę jeszcze czekać, ponieważ nie mówią, gdyż stanęli i już więcej nie odpowiadają."
  tags: []
"Hi32,17":
  text: "Odpowiem także i ja w mojej części i ja wyjaśnię też swoje zdanie."
  tags: []
"Hi32,18":
  text: "Bo jestem pełny słów, przymusza mnie duch w moim wnętrzu."
  tags: []
"Hi32,19":
  text: "Oto moje wnętrze jest jak wino, które nie ma ujścia; jak nowe bukłaki zagrożone pęknięciem."
  tags: []
"Hi32,20":
  text: "Muszę mówić, aby ulżyć sobie; muszę otworzyć swoje wargi i muszę odpowiedzieć."
  tags: []
"Hi32,21":
  text: "Ach! Nie będę miał względu na mężczyznę i człowiekowi nie będę schlebiał!"
  tags: []
"Hi32,22":
  text: "Bo nie umiem schlebiać, gdyż mój Stwórca szybko by mnie uniósł."
  tags: []
