"Hi41,1": "Czy lewiatana wyciągniesz hakiem? I czy w pętlę liny włożysz jego język?"
"Hi41,2": "Czy włożysz sitowie w jego nozdrza i kolcem przebijesz jego szczęki?"
"Hi41,3": "Czy pomnoży prośby do ciebie? Czy będzie z tobą rozmawiał łagodnie?"
"Hi41,4": "Czy zawrze z tobą przymierze? Czy weźmiesz go za sługę na zawsze?"
"Hi41,5": "Czy możesz się z nim bawić jak z ptaszkiem lub uwiązać go do zabawy dla swych córek?"
"Hi41,6": "Czy handlują nim cechy rybackie? Czy podzielą go między siebie kupcy?"
"Hi41,7": "Czy możesz podziurawić jego skórę grotami lub jego głowę harpunem rybackim?"
"Hi41,8": "Połóż na nim swoją dłoń i pamiętaj o walce, a nie będziesz chciał tego uczynić ponownie."
"Hi41,9": "Oto nadzieja pokonania go okazuje się fałszywa. Nadto, czyż nie na jego widok każdy jest powalony?"
"Hi41,10": "Nikt nie jest zuchwały, żeby go podrażnić. Kto więc zdoła stanąć przede Mną?"
"Hi41,11": "Kto mi wystąpi, abym mu odpłacił? Każdy, kto znajduje się pod niebiosami – on do mnie należy!"
"Hi41,12": "Nie mogę zamilczeć o jego członkach i o sprawie jego sił, ani o jego wspaniałych proporcjach."
"Hi41,13": "Kto odkryje wierzch jego szaty? Kto przystąpi do niego z podwójnym wędzidłem?"
"Hi41,14": "Kto otworzy wrota jego paszczy? Jego zęby sieją wokół zgrozę."
"Hi41,15": "Pycha – rzędami jego łusek, ściśle spięte są pieczęcią."
"Hi41,16": "Jedna do drugiej przylgnęły, pomiędzy nimi nie przejdzie podmuch."
"Hi41,17": "Każda z nich z drugą jest spojona, złączone i nie można ich rozdzielić."
"Hi41,18": "Jego parsknięcie błyska światłem, a jego oczy są jak powieki świtu."
"Hi41,19": "Z jego paszczy wychodzą pochodnie, tryskają iskry ognia."
"Hi41,20": "Z jego nozdrzy wychodzi dym jak z wrzącego kotła lub znad sitowia."
"Hi41,21": "Jego oddech rozpala węgle, z jego paszczy wychodzi płomień."
"Hi41,22": "W jego karku spoczywa moc, a przed nim zatacza się trwoga."
"Hi41,23": "Fałdy jego cielska są złączone, utwardzone na nim, nie mogą zostać poruszone."
"Hi41,24": "Jego serce jest utwardzone jak kamień, tak jest utwardzone jak część dolnego kamienia młyńskiego."
"Hi41,25": "Wobec jego wyniosłości drżą najdzielniejsi, ich złamane szeregi – są zagubione."
"Hi41,26": "Miecz, który go dosięga, nie ostoi się, ani włócznia, ani strzała i pancerz."
"Hi41,27": "Żelazo uważa za słomę, a miedź za zbutwiałe drewno."
"Hi41,28": "Strzała łucznika nie zmusi go do ucieczki, a kamienie z procy zmieniają się mu w ściernisko."
"Hi41,29": "Maczugę uważa za ściernisko i drwi sobie z potrząsania dzidą."
"Hi41,30": "Od spodu ma ostre skorupy; zostawia ślad jak brona w błocie."
"Hi41,31": "Sprawia, że głębiny wrą jak kocioł, a morze podnosi jak maź."
"Hi41,32": "Zostawia za sobą świetlany szlak, tak że myślałby ktoś, że głębia jest jak siwizna."
"Hi41,33": "Nie ma na prochu ziemi jemu podobnego – stworzonego bez trwogi."
"Hi41,34": "Na wszystko co wyniosłe, patrzy z góry, on, król nad wszystkimi synami pychy."
