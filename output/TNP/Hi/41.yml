"Hi41,1":
  text: "Czy lewiatana wyciągniesz hakiem? I czy w pętlę liny włożysz jego język?"
  tags: []
"Hi41,2":
  text: "Czy włożysz sitowie w jego nozdrza i kolcem przebijesz jego szczęki?"
  tags: []
"Hi41,3":
  text: "Czy pomnoży prośby do ciebie? Czy będzie z tobą rozmawiał łagodnie?"
  tags: []
"Hi41,4":
  text: "Czy zawrze z tobą przymierze? Czy weźmiesz go za sługę na zawsze?"
  tags: []
"Hi41,5":
  text: "Czy możesz się z nim bawić jak z ptaszkiem lub uwiązać go do zabawy dla swych córek?"
  tags: []
"Hi41,6":
  text: "Czy handlują nim cechy rybackie? Czy podzielą go między siebie kupcy?"
  tags: []
"Hi41,7":
  text: "Czy możesz podziurawić jego skórę grotami lub jego głowę harpunem rybackim?"
  tags: []
"Hi41,8":
  text: "Połóż na nim swoją dłoń i pamiętaj o walce, a nie będziesz chciał tego uczynić ponownie."
  tags: []
"Hi41,9":
  text: "Oto nadzieja pokonania go okazuje się fałszywa. Nadto, czyż nie na jego widok każdy jest powalony?"
  tags: []
"Hi41,10":
  text: "Nikt nie jest zuchwały, żeby go podrażnić. Kto więc zdoła stanąć przede Mną?"
  tags: []
"Hi41,11":
  text: "Kto mi wystąpi, abym mu odpłacił? Każdy, kto znajduje się pod niebiosami – on do mnie należy!"
  tags: []
"Hi41,12":
  text: "Nie mogę zamilczeć o jego członkach i o sprawie jego sił, ani o jego wspaniałych proporcjach."
  tags: []
"Hi41,13":
  text: "Kto odkryje wierzch jego szaty? Kto przystąpi do niego z podwójnym wędzidłem?"
  tags: []
"Hi41,14":
  text: "Kto otworzy wrota jego paszczy? Jego zęby sieją wokół zgrozę."
  tags: []
"Hi41,15":
  text: "Pycha – rzędami jego łusek, ściśle spięte są pieczęcią."
  tags: []
"Hi41,16":
  text: "Jedna do drugiej przylgnęły, pomiędzy nimi nie przejdzie podmuch."
  tags: []
"Hi41,17":
  text: "Każda z nich z drugą jest spojona, złączone i nie można ich rozdzielić."
  tags: []
"Hi41,18":
  text: "Jego parsknięcie błyska światłem, a jego oczy są jak powieki świtu."
  tags: []
"Hi41,19":
  text: "Z jego paszczy wychodzą pochodnie, tryskają iskry ognia."
  tags: []
"Hi41,20":
  text: "Z jego nozdrzy wychodzi dym jak z wrzącego kotła lub znad sitowia."
  tags: []
"Hi41,21":
  text: "Jego oddech rozpala węgle, z jego paszczy wychodzi płomień."
  tags: []
"Hi41,22":
  text: "W jego karku spoczywa moc, a przed nim zatacza się trwoga."
  tags: []
"Hi41,23":
  text: "Fałdy jego cielska są złączone, utwardzone na nim, nie mogą zostać poruszone."
  tags: []
"Hi41,24":
  text: "Jego serce jest utwardzone jak kamień, tak jest utwardzone jak część dolnego kamienia młyńskiego."
  tags: []
"Hi41,25":
  text: "Wobec jego wyniosłości drżą najdzielniejsi, ich złamane szeregi – są zagubione."
  tags: []
"Hi41,26":
  text: "Miecz, który go dosięga, nie ostoi się, ani włócznia, ani strzała i pancerz."
  tags: []
"Hi41,27":
  text: "Żelazo uważa za słomę, a miedź za zbutwiałe drewno."
  tags: []
"Hi41,28":
  text: "Strzała łucznika nie zmusi go do ucieczki, a kamienie z procy zmieniają się mu w ściernisko."
  tags: []
"Hi41,29":
  text: "Maczugę uważa za ściernisko i drwi sobie z potrząsania dzidą."
  tags: []
"Hi41,30":
  text: "Od spodu ma ostre skorupy; zostawia ślad jak brona w błocie."
  tags: []
"Hi41,31":
  text: "Sprawia, że głębiny wrą jak kocioł, a morze podnosi jak maź."
  tags: []
"Hi41,32":
  text: "Zostawia za sobą świetlany szlak, tak że myślałby ktoś, że głębia jest jak siwizna."
  tags: []
"Hi41,33":
  text: "Nie ma na prochu ziemi jemu podobnego – stworzonego bez trwogi."
  tags: []
"Hi41,34":
  text: "Na wszystko co wyniosłe, patrzy z góry, on, król nad wszystkimi synami pychy."
  tags: []
