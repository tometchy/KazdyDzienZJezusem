"Hi35,1":
  text: "I odpowiedział Elihu i rzekł:"
  tags: []
"Hi35,2":
  text: "Czy uważasz to za słuszne? Powiedziałeś: Moja sprawiedliwość pochodzi od Boga?"
  tags: []
"Hi35,3":
  text: "Jednak mówisz: Cóż mi to pomoże? Cóż za korzyść z mojego grzechu?"
  tags: []
"Hi35,4":
  text: "Ja odpowiem tobie słowami i twoim towarzyszom wraz z tobą."
  tags: []
"Hi35,5":
  text: "Spójrz w niebiosa i zobacz! Przypatrz się obłokom, które są wyżej od ciebie."
  tags: []
"Hi35,6":
  text: "Jeśli zgrzeszysz, co zrobisz przeciwko Niemu? A jeśli pomnożą się twoje nieprawości, co Mu uczynisz?"
  tags: []
"Hi35,7":
  text: "Jeśli jesteś sprawiedliwy, co Mu dajesz? Lub co On przyjmuje z twoich rąk?"
  tags: []
"Hi35,8":
  text: "Twoja niegodziwość – dla człowieka takiego jak ty, a twoja sprawiedliwość – też dla syna człowieka."
  tags: []
"Hi35,9":
  text: "Ludzie krzyczą z powodu mnóstwa ucisków, wołają z powodu ramienia możnych."
  tags: []
"Hi35,10":
  text: "Lecz nikt nie mówi: Gdzie jest Bóg, mój Stwórca, który w nocy daje pieśni;"
  tags: []
"Hi35,11":
  text: "Ten, który uczy nas bardziej niż polne zwierzęta i czyni nas mądrzejszymi niż ptactwo niebios?"
  tags: []
"Hi35,12":
  text: "Wtedy wołają – lecz nie odpowiada ze względu na pychę złych."
  tags: []
"Hi35,13":
  text: "Z pewnością, Bóg nie wysłuchuje pustych słów i Wszechmogący na nie nie zważa."
  tags: []
"Hi35,14":
  text: "Tym bardziej, gdy mówisz, że Go nie widzisz, że sprawa twoja jest przed Jego obliczem i Go wyczekujesz!"
  tags: []
"Hi35,15":
  text: "Teraz jednak, gdy nie nawiedza cię Jego gniew i nie zwrócił zbytniej uwagi na twoją głupotę,"
  tags: []
"Hi35,16":
  text: "To Hiob na próżno otwiera swoje usta; mnoży słowa bez poznania."
  tags: []
