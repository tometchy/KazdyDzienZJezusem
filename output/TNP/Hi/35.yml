"Hi35,1": "I odpowiedział Elihu i rzekł:"
"Hi35,2": "Czy uważasz to za słuszne? Powiedziałeś: Moja sprawiedliwość pochodzi od Boga?"
"Hi35,3": "Jednak mówisz: Cóż mi to pomoże? Cóż za korzyść z mojego grzechu?"
"Hi35,4": "Ja odpowiem tobie słowami i twoim towarzyszom wraz z tobą."
"Hi35,5": "Spójrz w niebiosa i zobacz! Przypatrz się obłokom, które są wyżej od ciebie."
"Hi35,6": "Jeśli zgrzeszysz, co zrobisz przeciwko Niemu? A jeśli pomnożą się twoje nieprawości, co Mu uczynisz?"
"Hi35,7": "Jeśli jesteś sprawiedliwy, co Mu dajesz? Lub co On przyjmuje z twoich rąk?"
"Hi35,8": "Twoja niegodziwość – dla człowieka takiego jak ty, a twoja sprawiedliwość – też dla syna człowieka."
"Hi35,9": "Ludzie krzyczą z powodu mnóstwa ucisków, wołają z powodu ramienia możnych."
"Hi35,10": "Lecz nikt nie mówi: Gdzie jest Bóg, mój Stwórca, który w nocy daje pieśni;"
"Hi35,11": "Ten, który uczy nas bardziej niż polne zwierzęta i czyni nas mądrzejszymi niż ptactwo niebios?"
"Hi35,12": "Wtedy wołają – lecz nie odpowiada ze względu na pychę złych."
"Hi35,13": "Z pewnością, Bóg nie wysłuchuje pustych słów i Wszechmogący na nie nie zważa."
"Hi35,14": "Tym bardziej, gdy mówisz, że Go nie widzisz, że sprawa twoja jest przed Jego obliczem i Go wyczekujesz!"
"Hi35,15": "Teraz jednak, gdy nie nawiedza cię Jego gniew i nie zwrócił zbytniej uwagi na twoją głupotę,"
"Hi35,16": "To Hiob na próżno otwiera swoje usta; mnoży słowa bez poznania."
