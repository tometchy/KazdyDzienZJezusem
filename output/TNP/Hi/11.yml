"Hi11,1": "Wtedy Sofar Naamita odpowiedział i rzekł:"
"Hi11,2": "Czy te mnóstwo słów zostanie bez odpowiedzi? I czy człowiek gadatliwy ma mieć słuszność?"
"Hi11,3": "Czy twoja pusta mowa uciszy mężczyzn? Czy gdy drwisz, wtedy nie ma nikogo zawstydzającego?"
"Hi11,4": "Bo powiedziałeś: Moja nauka jest jasna, jestem czysty w Twoich oczach."
"Hi11,5": "Lecz gdyby ktoś dał Bogu przemówić, wtedy otworzyłby swoje usta przeciwko tobie;"
"Hi11,6": "Niechby ci oznajmił tajemnice mądrości – gdyż podwójnie trudne jest zrozumienie. Poznaj więc, że Bóg zapomniał ci twoją nieprawość."
"Hi11,7": "Czy dosięgniesz głębokości Boga? Czy dosięgniesz aż do granic Wszechmogącego?"
"Hi11,8": "Wyższe są niż niebiosa, co możesz z tym uczynić? Niezgłębione jak Szeol, co o tym wiesz?"
"Hi11,9": "Dłuższa niż ziemia w swej mierze i szersza bardziej niż morze."
"Hi11,10": "Kiedy przechodzi i kogoś zamyka lub kogoś wzywa na zgromadzenie sądu, to kto Go powstrzyma?"
"Hi11,11": "Bo On zna marność ludzi i widzi ich niegodziwość. Czy miałby na to nie zwracać uwagi?"
"Hi11,12": "Lecz człowiek pusty tak może stać się rozumnym, jak źrebię osła urodzić się człowiekiem."
"Hi11,13": "Jeśli ty przygotujesz swoje serce i wyciągniesz do Niego swoje dłonie;"
"Hi11,14": "Jeśli nieprawość jest na twojej ręce, oddal ją i nie pozwól, aby niegodziwość mieszkała w twoich namiotach."
"Hi11,15": "Wtedy z pewnością podniesiesz swoje oblicze bez skazy, będziesz stał mocno i nie będziesz się bał."
"Hi11,16": "Wtedy ty też zapomnisz o swojej udręce i wspomnisz o niej tak jak o wodach, które przepłynęły."
"Hi11,17": "I twoje życie będzie jaśniejsze niż południe; a choćby ciemność zapadła, to stanie się jak poranek."
"Hi11,18": "Będziesz ufał, gdyż jest nadzieja; i rozejrzysz się, by odpocząć bezpiecznie."
"Hi11,19": "I położysz się, a nie będzie nikogo sprawiającego lęk; i wielu będzie błagać o twoją przychylność."
"Hi11,20": "Lecz oczy niegodziwych zgasną i przepadnie dla nich miejsce ucieczki, a ich nadzieją – wyzionięcie duszy."
