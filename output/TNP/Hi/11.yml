"Hi11,1":
  text: "Wtedy Sofar Naamita odpowiedział i rzekł:"
  tags: []
"Hi11,2":
  text: "Czy te mnóstwo słów zostanie bez odpowiedzi? I czy człowiek gadatliwy ma mieć słuszność?"
  tags: []
"Hi11,3":
  text: "Czy twoja pusta mowa uciszy mężczyzn? Czy gdy drwisz, wtedy nie ma nikogo zawstydzającego?"
  tags: []
"Hi11,4":
  text: "Bo powiedziałeś: Moja nauka jest jasna, jestem czysty w Twoich oczach."
  tags: []
"Hi11,5":
  text: "Lecz gdyby ktoś dał Bogu przemówić, wtedy otworzyłby swoje usta przeciwko tobie;"
  tags: []
"Hi11,6":
  text: "Niechby ci oznajmił tajemnice mądrości – gdyż podwójnie trudne jest zrozumienie. Poznaj więc, że Bóg zapomniał ci twoją nieprawość."
  tags: []
"Hi11,7":
  text: "Czy dosięgniesz głębokości Boga? Czy dosięgniesz aż do granic Wszechmogącego?"
  tags: []
"Hi11,8":
  text: "Wyższe są niż niebiosa, co możesz z tym uczynić? Niezgłębione jak Szeol, co o tym wiesz?"
  tags: []
"Hi11,9":
  text: "Dłuższa niż ziemia w swej mierze i szersza bardziej niż morze."
  tags: []
"Hi11,10":
  text: "Kiedy przechodzi i kogoś zamyka lub kogoś wzywa na zgromadzenie sądu, to kto Go powstrzyma?"
  tags: []
"Hi11,11":
  text: "Bo On zna marność ludzi i widzi ich niegodziwość. Czy miałby na to nie zwracać uwagi?"
  tags: []
"Hi11,12":
  text: "Lecz człowiek pusty tak może stać się rozumnym, jak źrebię osła urodzić się człowiekiem."
  tags: []
"Hi11,13":
  text: "Jeśli ty przygotujesz swoje serce i wyciągniesz do Niego swoje dłonie;"
  tags: []
"Hi11,14":
  text: "Jeśli nieprawość jest na twojej ręce, oddal ją i nie pozwól, aby niegodziwość mieszkała w twoich namiotach."
  tags: []
"Hi11,15":
  text: "Wtedy z pewnością podniesiesz swoje oblicze bez skazy, będziesz stał mocno i nie będziesz się bał."
  tags: []
"Hi11,16":
  text: "Wtedy ty też zapomnisz o swojej udręce i wspomnisz o niej tak jak o wodach, które przepłynęły."
  tags: []
"Hi11,17":
  text: "I twoje życie będzie jaśniejsze niż południe; a choćby ciemność zapadła, to stanie się jak poranek."
  tags: []
"Hi11,18":
  text: "Będziesz ufał, gdyż jest nadzieja; i rozejrzysz się, by odpocząć bezpiecznie."
  tags: []
"Hi11,19":
  text: "I położysz się, a nie będzie nikogo sprawiającego lęk; i wielu będzie błagać o twoją przychylność."
  tags: []
"Hi11,20":
  text: "Lecz oczy niegodziwych zgasną i przepadnie dla nich miejsce ucieczki, a ich nadzieją – wyzionięcie duszy."
  tags: []
