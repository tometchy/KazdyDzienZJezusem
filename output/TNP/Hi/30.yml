"Hi30,1": "A teraz szydzą ze mnie młodsi ode mnie wiekiem, których ojców uważałem za niewartych, by postawić przy psach swojej trzody."
"Hi30,2": "Również siła ich rąk – na cóż mi ona? Odszedł od nich ich wigor."
"Hi30,3": "Z niedostatku i z głodu wyczerpani włóczyli się po wyschłej ziemi, niedawno spustoszonej i jałowej."
"Hi30,4": "Zrywają sobie malwę na krzaku i korzeń janowca jest ich pokarmem."
"Hi30,5": "Wypędzają ich ze wspólnoty, krzyczą za nimi jak za złodziejem;"
"Hi30,6": "Osiedlić musieli się zatem w rozpadlinach dolin, w jamach ziemnych i skałach."
"Hi30,7": "Między krzakami wyją, gromadzą się pod ostami."
"Hi30,8": "To synowie głupoty, a także synowie ludzi bez sławy, wygnani batem z ziemi."
"Hi30,9": "A teraz stałem się tematem ich przyśpiewki i jestem ich powiedzonkiem."
"Hi30,10": "Brzydzą się mną i są oddaleni ode mnie, i przed moim obliczem nie powstrzymują się z pluciem."
"Hi30,11": "Bo On rozluźnił mój sznur i upokorzył mnie; zrzucili też uzdę przed moim obliczem."
"Hi30,12": "Na prawo powstaje banda wyrostków, przed moimi stopami zastawiają pułapkę i wznoszą przeciwko mnie ścieżki zniszczenia."
"Hi30,13": "Zniszczyli moją drogę i przyczynili się do mojej zagłady, nie potrzebują do tego pomocnika."
"Hi30,14": "Podchodzą jak przez szeroki wyłom i toczą się w miejscu gruzów."
"Hi30,15": "Dlatego lęki zwróciły się przeciwko mnie, jak wiatr nęka to moją godność. Moja pomyślność przemija jak obłok."
"Hi30,16": "I teraz wylewa się we mnie moja dusza. Pochwyciły mnie dni cierpienia;"
"Hi30,17": "Noc dziurawi moje kości we mnie, a dręczące bóle nie dają mi odpoczynku."
"Hi30,18": "Z wielką siłą okrywa mnie On moją szatą i jak brzeg mojej tuniki przepasuje mnie."
"Hi30,19": "Rzucił mnie w błoto, upodobniłem się do prochu i popiołu."
"Hi30,20": "Wołam do Ciebie, ale nie odpowiadasz; stoję, a nie zwracasz uwagi."
"Hi30,21": "Stałeś się dla mnie okrutny, w sile swojej ręki żywisz do mnie wrogość."
"Hi30,22": "Unosisz mnie na wietrze, sprawiasz, że go dosiadam i zmiękczasz moje jestestwo."
"Hi30,23": "Gdyż wiem, że prowadzisz mnie na śmierć i sprowadzasz do domu spotkania dla wszystkich żyjących."
"Hi30,24": "Jednak czy ktoś w ruinie nie wyciąga ręki, czy nie woła o pomoc w swym nieszczęściu."
"Hi30,25": "Czy nie płakałem nad tym, którego dzień był ciężki? Czy moja dusza nie smuciła się nad ubogim?"
"Hi30,26": "Tak, oczekiwałem dobra, a przyszło zło; a gdy z nadzieją oczekiwałem światła, przyszła ciemność."
"Hi30,27": "Moje wnętrze zawrzało i nie uspokoiło się; spotkały mnie dni cierpienia."
"Hi30,28": "Chodzę pociemniały, ale nie od słońca; wstaję i w zgromadzeniu wołam o pomoc."
"Hi30,29": "Stałem się bratem szakali i przyjacielem młodych strusic."
"Hi30,30": "Moja skóra stała się czarna na mnie i moje kość jest spieczona od gorączki."
"Hi30,31": "A moja harfa stała się pieśnią żałobną, a mój flet – krzykiem płaczących."
