"Hi36,1": "A Elihu mówił dalej:"
"Hi36,2": "Wytrzymaj ze mną troszkę, a oznajmię ci, że jest więcej słów od Boga."
"Hi36,3": "Z daleka wezmę moją wiedzę i oddam sprawiedliwość memu Stwórcy."
"Hi36,4": "Bo naprawdę moje słowa nie są kłamstwem, a ktoś z kompletną wiedzą jest przed tobą."
"Hi36,5": "Oto Bóg jest mocny i nie gardzi nikim. On jest potężny mocą serca."
"Hi36,6": "Nie zachowuje przy życiu niegodziwych, a ubogim nadaje prawa."
"Hi36,7": "Nie odwraca swoich oczu od sprawiedliwego, ale sadza ich na wieki razem z królami na tronie – i wywyższa ich."
"Hi36,8": "A jeśli są zakuci okowami, schwytani zostali w powrozy utrapienia;"
"Hi36,9": "To wtedy oznajmia im ich czyny i przestępstwa – bo się wzmogły."
"Hi36,10": "I otwiera ich uszy na pouczenie, i mówi, żeby odwrócili się od nieprawości."
"Hi36,11": "Jeśli będą posłuszni i będą Mu służyć, dopełnią swoich dni w dobrobycie, a swoje lata w rozkoszach."
"Hi36,12": "Ale jeśli nie usłuchają, od miecza zginą, umrą bez poznania."
"Hi36,13": "Lecz ludzie obłudnego serca gromadzą gniew, nie wołają o pomoc, gdy ich wiąże."
"Hi36,14": "Niech w młodości umiera ich dusza i ich życie zaniknie wśród nierządników."
"Hi36,15": "Wyrywa ubogiego w jego utrapieniu i otwiera ich uszy w ucisku."
"Hi36,16": "I również ciebie uwodzi z paszczy niedoli na miejsce przestronne, gdzie nie ma ograniczeń, a blat twojego stołu napełni tłustością."
"Hi36,17": "Lecz ty jesteś pełen niegodziwego sądu, sąd i prawo cię powstrzymają."
"Hi36,18": "Tak, aby gniew nie nęcił cię do szyderstwa i wielki okup cię nie zwiódł."
"Hi36,19": "Czy ułoży ci to wszystko twoje bogactwo? Nie w ucisku! Nie pomogą też ci wszystkie wysiłki mocy."
"Hi36,20": "Nie tęsknij za nocą, by usuwać ludzi z ich miejsc."
"Hi36,21": "Strzeż się, abyś nie zwracał się ku nieprawości, gdyż to jednak ją wybrałeś niż utrapienie."
"Hi36,22": "Oto Bóg działa wzniośle w swojej potędze, ktojest takim nauczycielem jak On?"
"Hi36,23": "Kto wytycza dla Niego drogę? A kto Mu powie: Popełniłeś nieprawość?"
"Hi36,24": "Pamiętaj, abyś wysławiał Jego dzieło, o którym śpiewali ludzie!"
"Hi36,25": "Cała ludzkość je widzi, człowiek przypatruje się im z daleka."
"Hi36,26": "Oto Bóg jest wzniosły i nie możemy poznać liczby Jego lat, a jest ona niezbadana."
"Hi36,27": "Bo On zatrzymuje krople wód, które filtrują deszcz z Jego mgły;"
"Hi36,28": "Którym spływają chmury, kapią obficie na ludzi."
"Hi36,29": "Kto może naprawdę zrozumieć rozmieszczenie chmur i grzmoty Jego namiotu?"
"Hi36,30": "Oto rozciąga nad nim swoją światłość i okrywa głębiny morza."
"Hi36,31": "Bo przez nie sądzi narody i daje im pokarm w obfitości."
"Hi36,32": "W swoich dłoniach ukrywa błyskawicę i rozkazuje, wskazując jej na cel uderzenia."
"Hi36,33": "Ogłasza nad Nim burzę Jego huk, nawet bydło ostrzega o wzmagającej się burzy."
