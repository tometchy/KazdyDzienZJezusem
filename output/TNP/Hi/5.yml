"Hi5,1": "Wołaj, tylko czy jest ktoś, kto ci odpowie; i do którego ze świętych się zwrócisz?"
"Hi5,2": "Bo gniew zabija głupiego, a prostaka uśmierca zawiść."
"Hi5,3": "Sam widziałem jak zakorzenił się głupi, lecz szybko przekląłem jego niwę."
"Hi5,4": "Jego synowie dalecy będą od ratunku, będą musieli pogodzić się z tym, że podeptano ich w bramie, a nie ma nikogo, kto by ich ocalił."
"Hi5,5": "Ten, kto jest głodny, pożera jego żniwo i wybiera je nawet spośród cierni, a złodziej pożąda ich bogactwa."
"Hi5,6": "Bo utrapienie nie wychodzi z prochu ani z ziemi nie wyrasta niedola;"
"Hi5,7": "Tak, człowiek jest zrodzony do niedoli, jak iskry wzlatujące w górę."
"Hi5,8": "Ja jednak zwróciłbym się do Boga i przed Bogiem przedstawiłbym swoją sprawę;"
"Hi5,9": "Temu, który czyni rzeczy wielkie i niezbadane, cudowne, że aż nie ma ich liczby;"
"Hi5,10": "Temu, który zsyła deszcz na powierzchnię ziemi i spuszcza wody na pola;"
"Hi5,11": "Temu, który stawia niskich na wysokości, a zasmuconych wywyższa ku wybawieniu;"
"Hi5,12": "Temu, który udaremnia zamysły przebiegłych, aby ich ręce nie osiągnęły sukcesu;"
"Hi5,13": "Temu, który chwyta mądrych w ich przebiegłość, a radę pokrętnych szybko obala."
"Hi5,14": "Za dnia napotykają ciemność, a w południe macają jak w nocy –"
"Hi5,15": "I wybawia on ubogiego od miecza z ich ust, z ręki mocarza."
"Hi5,16": "I dla ubogiego będzie nadzieja, a nieprawość zamyka swoje usta."
"Hi5,17": "Oto błogosławiony jest człowiek, którego Bóg strofuje; nie gardź więc karceniem Wszechmogącego."
"Hi5,18": "Bo On rani, ale i opatruje, uderza – a Jego ręce uzdrawiają."
"Hi5,19": "Z sześciu nieszczęść cię wyrwie, a w siódmym nie dotknie cię zło."
"Hi5,20": "W głodzie wykupi cię od śmierci, a na wojnie od mocy miecza."
"Hi5,21": "Przed biczem języka będziesz zasłonięty i nie ulękniesz się spustoszenia, gdy nadejdzie."
"Hi5,22": "Będziesz się śmiał ze spustoszenia i głodu, nie ulękniesz się zwierząt ziemi."
"Hi5,23": "Bo z kamieniami pola będziesz sprzymierzony i ze zwierzętami pól będziesz miał pokój."
"Hi5,24": "I poznasz, że twój namiot jest bezpieczny; a gdy odwiedzisz swoją niwę, nic nie utracisz."
"Hi5,25": "Poznasz też, że liczne jest twoje potomstwo, a twoje latorośle są jak zieleń ziemi."
"Hi5,26": "Pełen wigoru wkroczysz do grobu, jak snop zboża zbierany w swoim czasie."
"Hi5,27": "Oto do tego doszliśmy i tak jest. Słuchaj tego i sam rozważ to sobie."
