"Hi23,1": "A Hiob odpowiedział i rzekł:"
"Hi23,2": "Również dziś nieprzejednana jest moja skarga, a moja ręka ciąży na moim wzdychaniu."
"Hi23,3": "Kto dałby, abym wiedział i mógł Go znaleźć? Udałbym się wtedy do Jego tronu?"
"Hi23,4": "Przedstawiłbym przed Nim moją sprawę, a moje usta napełniłbym argumentami;"
"Hi23,5": "Chciałbym poznać słowa Jego odpowiedzi i rozważyć to, co mi powie."
"Hi23,6": "Czy przy swojej wielkiej mocy będzie się prawował ze mną? Nie! On na pewno zważałby na mnie."
"Hi23,7": "Tam prawy może spierać się z Nim i na zawsze byłbym uwolniony przez mojego sędziego."
"Hi23,8": "Lecz oto idę prosto, a nie ma Go; cofam się – a nie dostrzegam Go."
"Hi23,9": "Z lewej, gdzie On działa, a nie mogę Go dostrzec; obrócił się ku prawej, a nie widzę Go."
"Hi23,10": "Tak, On zna drogę, którą kroczę; gdyby mnie wypróbował, wyszedłbym czysty jak złoto."
"Hi23,11": "Moja stopa uchwyciła się Jego śladu, strzegłem Jego drogi i uważałem, aby z niej nie zboczyć."
"Hi23,12": "Od przykazań Jego warg nie odchodziłem; bardziej cenię wypowiedzi Jego ust niż moją codzienną rację."
"Hi23,13": "A On jest niezmienny i któż zdoła Go zawrócić? A czego pragnie Jego dusza, to czyni;"
"Hi23,14": "Tak, On dopełni mój wyznaczony czas; u Niego jest wiele takich zamiarów."
"Hi23,15": "Dlatego też jestem zatrwożony przed Jego obliczem; rozważam i odczuwam lęk wobec Niego."
"Hi23,16": "A Bóg osłabił moje serce, Wszechmogący mnie zatrwożył."
"Hi23,17": "Bo nie zostałem uciszony przed ciemnością, ani przez to, że twarz moją ogarnął mrok."
