"Hi23,1":
  text: "A Hiob odpowiedział i rzekł:"
  tags: []
"Hi23,2":
  text: "Również dziś nieprzejednana jest moja skarga, a moja ręka ciąży na moim wzdychaniu."
  tags: []
"Hi23,3":
  text: "Kto dałby, abym wiedział i mógł Go znaleźć? Udałbym się wtedy do Jego tronu?"
  tags: []
"Hi23,4":
  text: "Przedstawiłbym przed Nim moją sprawę, a moje usta napełniłbym argumentami;"
  tags: []
"Hi23,5":
  text: "Chciałbym poznać słowa Jego odpowiedzi i rozważyć to, co mi powie."
  tags: []
"Hi23,6":
  text: "Czy przy swojej wielkiej mocy będzie się prawował ze mną? Nie! On na pewno zważałby na mnie."
  tags: []
"Hi23,7":
  text: "Tam prawy może spierać się z Nim i na zawsze byłbym uwolniony przez mojego sędziego."
  tags: []
"Hi23,8":
  text: "Lecz oto idę prosto, a nie ma Go; cofam się – a nie dostrzegam Go."
  tags: []
"Hi23,9":
  text: "Z lewej, gdzie On działa, a nie mogę Go dostrzec; obrócił się ku prawej, a nie widzę Go."
  tags: []
"Hi23,10":
  text: "Tak, On zna drogę, którą kroczę; gdyby mnie wypróbował, wyszedłbym czysty jak złoto."
  tags: []
"Hi23,11":
  text: "Moja stopa uchwyciła się Jego śladu, strzegłem Jego drogi i uważałem, aby z niej nie zboczyć."
  tags: []
"Hi23,12":
  text: "Od przykazań Jego warg nie odchodziłem; bardziej cenię wypowiedzi Jego ust niż moją codzienną rację."
  tags: []
"Hi23,13":
  text: "A On jest niezmienny i któż zdoła Go zawrócić? A czego pragnie Jego dusza, to czyni;"
  tags: []
"Hi23,14":
  text: "Tak, On dopełni mój wyznaczony czas; u Niego jest wiele takich zamiarów."
  tags: []
"Hi23,15":
  text: "Dlatego też jestem zatrwożony przed Jego obliczem; rozważam i odczuwam lęk wobec Niego."
  tags: []
"Hi23,16":
  text: "A Bóg osłabił moje serce, Wszechmogący mnie zatrwożył."
  tags: []
"Hi23,17":
  text: "Bo nie zostałem uciszony przed ciemnością, ani przez to, że twarz moją ogarnął mrok."
  tags: []
