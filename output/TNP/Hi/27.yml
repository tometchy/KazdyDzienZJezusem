"Hi27,1": "I Hiob ciągnął dalej swoją przypowieść, i rzekł:"
"Hi27,2": "Jak żyje Bóg, który odmówił mi słuszności i Wszechmogący, który rozgoryczył moją duszę,"
"Hi27,3": "Bo jak długo jeszcze tchu we mnie i tchnienia Bożego w moich nozdrzach;"
"Hi27,4": "Z pewnością moje wargi nie będą mówiły niegodziwości, a język mój z pewnością nie wypowie fałszu."
"Hi27,5": "O, nie daj Boże, abym miał wam przyznać słuszność! Aż do śmierci nie odsunę mej niewinności ode mnie."
"Hi27,6": "Utrzymam się w swojej sprawiedliwości i nie porzucę jej; moje serce nie będzie czynić mi wyrzutów za żaden z moich dni."
"Hi27,7": "Niech mojemu wrogowi będzie jak niegodziwemu, a temu, który powstaje przeciwko mnie, jak nieprawemu!"
"Hi27,8": "Gdyż jaką nadzieję ma obłudnik, gdy zostaje wycięty, gdy Bóg zabiera jego duszę?"
"Hi27,9": "Czy Bóg usłyszy jego wołanie o pomoc, gdy spadnie na niego nieszczęście?"
"Hi27,10": "Czy może rozkoszować się we Wszechmogącym? Czy wezwie Boga w każdym czasie?"
"Hi27,11": "Pouczę was o ręce Boga, tego co z Wszechmogącym – nie zataję."
"Hi27,12": "Oto wy – wszyscy z was – widzieliście to; więc dlaczego ta próżna pusta mowa?"
"Hi27,13": "Taki jest dział człowieka niegodziwego od Boga i takie dziedzictwo otrzymają od Wszechmogącego ciemiężcy."
"Hi27,14": "Jakkolwiek liczni są jego synowie, pójdą pod miecz; a jego potomstwo nie nasyci się chlebem."
"Hi27,15": "Jego ocaleni w śmierci zostaną pogrzebani, a wdowy po nim nie będą płakać;"
"Hi27,16": "Choćby nagromadził srebra jak prochu i przygotował sobie odzieży jak glinę;"
"Hi27,17": "To przygotuje, ale włoży je sprawiedliwy, a niewinny będzie dzielić srebro."
"Hi27,18": "Zbuduje swój dom jak mól, jak szałas, który robi sobie stróż."
"Hi27,19": "Kładzie się spać – bogaty, lecz nie zbierze już plonu; otworzy swoje oczy, a bogactwa już nie ma."
"Hi27,20": "Ogarnie go trwoga jak wody, nocą porywa go wicher."
"Hi27,21": "Uniesie go wiatr wschodni i odejdzie; i daleko uniesie go z jego miejsca."
"Hi27,22": "I rzuci się na niego, i nie oszczędzi, a z jego ręki w popłochu będzie uciekał."
"Hi27,23": "Będzie klaskać nad nim w swoje dłonie i wygwiżdże go z jego miejsca."
