"Hi27,1":
  text: "I Hiob ciągnął dalej swoją przypowieść, i rzekł:"
  tags: []
"Hi27,2":
  text: "Jak żyje Bóg, który odmówił mi słuszności i Wszechmogący, który rozgoryczył moją duszę,"
  tags: []
"Hi27,3":
  text: "Bo jak długo jeszcze tchu we mnie i tchnienia Bożego w moich nozdrzach;"
  tags: []
"Hi27,4":
  text: "Z pewnością moje wargi nie będą mówiły niegodziwości, a język mój z pewnością nie wypowie fałszu."
  tags: []
"Hi27,5":
  text: "O, nie daj Boże, abym miał wam przyznać słuszność! Aż do śmierci nie odsunę mej niewinności ode mnie."
  tags: []
"Hi27,6":
  text: "Utrzymam się w swojej sprawiedliwości i nie porzucę jej; moje serce nie będzie czynić mi wyrzutów za żaden z moich dni."
  tags: []
"Hi27,7":
  text: "Niech mojemu wrogowi będzie jak niegodziwemu, a temu, który powstaje przeciwko mnie, jak nieprawemu!"
  tags: []
"Hi27,8":
  text: "Gdyż jaką nadzieję ma obłudnik, gdy zostaje wycięty, gdy Bóg zabiera jego duszę?"
  tags: []
"Hi27,9":
  text: "Czy Bóg usłyszy jego wołanie o pomoc, gdy spadnie na niego nieszczęście?"
  tags: []
"Hi27,10":
  text: "Czy może rozkoszować się we Wszechmogącym? Czy wezwie Boga w każdym czasie?"
  tags: []
"Hi27,11":
  text: "Pouczę was o ręce Boga, tego co z Wszechmogącym – nie zataję."
  tags: []
"Hi27,12":
  text: "Oto wy – wszyscy z was – widzieliście to; więc dlaczego ta próżna pusta mowa?"
  tags: []
"Hi27,13":
  text: "Taki jest dział człowieka niegodziwego od Boga i takie dziedzictwo otrzymają od Wszechmogącego ciemiężcy."
  tags: []
"Hi27,14":
  text: "Jakkolwiek liczni są jego synowie, pójdą pod miecz; a jego potomstwo nie nasyci się chlebem."
  tags: []
"Hi27,15":
  text: "Jego ocaleni w śmierci zostaną pogrzebani, a wdowy po nim nie będą płakać;"
  tags: []
"Hi27,16":
  text: "Choćby nagromadził srebra jak prochu i przygotował sobie odzieży jak glinę;"
  tags: []
"Hi27,17":
  text: "To przygotuje, ale włoży je sprawiedliwy, a niewinny będzie dzielić srebro."
  tags: []
"Hi27,18":
  text: "Zbuduje swój dom jak mól, jak szałas, który robi sobie stróż."
  tags: []
"Hi27,19":
  text: "Kładzie się spać – bogaty, lecz nie zbierze już plonu; otworzy swoje oczy, a bogactwa już nie ma."
  tags: []
"Hi27,20":
  text: "Ogarnie go trwoga jak wody, nocą porywa go wicher."
  tags: []
"Hi27,21":
  text: "Uniesie go wiatr wschodni i odejdzie; i daleko uniesie go z jego miejsca."
  tags: []
"Hi27,22":
  text: "I rzuci się na niego, i nie oszczędzi, a z jego ręki w popłochu będzie uciekał."
  tags: []
"Hi27,23":
  text: "Będzie klaskać nad nim w swoje dłonie i wygwiżdże go z jego miejsca."
  tags: []
