"Hi34,1": "Wtedy Elihu odpowiedział i rzekł:"
"Hi34,2": "Słuchajcie, mądrzy, moich słów i wy znawcy, nadstawcie mi ucha."
"Hi34,3": "Bo ucho bada słowa, jak i podniebienie smakuje pokarm."
"Hi34,4": "Wybierzmy dla nas to, co prawe, rozeznajmy między sobą to, co dobre."
"Hi34,5": "Bo Hiob powiedział: Jestem sprawiedliwy, lecz Bóg odrzucił moją prawość."
"Hi34,6": "Co do sądu nade mną, czy mam uznać kłamstwo? Nieuleczalna jest moja strzała, jestem bez winy."
"Hi34,7": "Któż jest mężem jak Hiob, który pije obelgi jak wodę?"
"Hi34,8": "I który obraca się też w towarzystwie czyniących nieprawość i chodzi z ludźmi niegodziwymi?"
"Hi34,9": "Bo powiedział: Człowiek nie odnosi korzyści, że ma upodobanie w Bogu."
"Hi34,10": "Tak więc posłuchajcie mnie, ludzie rozumni: Bóg jest niezmiernie daleki od niegodziwości, Wszechmogący – od nieprawości."
"Hi34,11": "Bo odpłaci człowiekowi według jego czynów i spowoduje, że człowiek znajdzie to, co właściwe jego ścieżkom."
"Hi34,12": "Tak, z pewnością Bóg nie postępuje niegodziwie, Wszechmogący nie wypacza prawa."
"Hi34,13": "Kto powierzył Mu ziemię? Kto urządził cały świat?"
"Hi34,14": "Jeśli zwróciłby ku niemu swoje serce, gdyby wziął do siebie Jego ducha i Jego tchnienie;"
"Hi34,15": "To zginęłoby łącznie wszelkie ciało, a człowiek w proch by się obrócił."
"Hi34,16": "Jeśli więc masz rozum, posłuchaj tego! Nadstaw uszu na głos moich słów!"
"Hi34,17": "Czyż istotnie może panować ten, który nienawidzi prawa? Czy więc potępisz Sprawiedliwego i Mocnego?"
"Hi34,18": "Czy On nie może do króla mówić: Nikczemniku? Do książąt: Bezbożniku?"
"Hi34,19": "Ten, który nie ma względu na władców i nie wyróżnia bogatego przed ubogim? Bo oni wszyscy są dziełem Jego rąk."
"Hi34,20": "W jednej chwili umierają, a w środku nocy lud zadrży i przeminą, a mocarz zostanie usunięty bez udziału ludzkiej ręki."
"Hi34,21": "Bo Jego oczy skierowane są na drogi człowieka i On widzi wszystkie jego kroki."
"Hi34,22": "Nie ma ciemności i nie ma cienia śmierci, tam gdzie mogliby się ukryć czyniący nieprawość."
"Hi34,23": "Gdyż nie wkłada na człowieka więcej niż to, co słuszne, by stawić go na sąd przed Bogiem."
"Hi34,24": "Rozbije mocarzy bez przesłuchania, a innych osadzi w ich miejsce."
"Hi34,25": "Dlatego zna ich czyny i wywraca ich nocą, i zostają zmiażdżeni."
"Hi34,26": "Ze względu na ich niegodziwości uderza ich w miejscu dla wszystkich widzących;"
"Hi34,27": "Za to, że odwrócili się od Niego i nie zważali na żadne Jego drogi;"
"Hi34,28": "Sprawili, że zaczęło dochodzić do Niego wołanie biednych, a On wysłuchuje wołania ubogich."
"Hi34,29": "A gdy On zachowuje pokój, to kto Go potępi? A gdy zechce zakryć swoje oblicze, kto Go ujrzy? – patrzy On jednak na naród i na człowieka jednakowo."
"Hi34,30": "By obłudny człowiek już nie mógł królować i zastawiać pułapek na lud."
"Hi34,31": "Gdy do Boga ktoś mówi: Poniosłem karę, nie będę już gorszyć."
"Hi34,32": "Ty mnie naucz tego, czego nie widzę; jeśli popełniłem nieprawość, ponownie jej nie popełnię."
"Hi34,33": "Czy według ciebie On winien ci odpłacić, gdy brzydzisz się nieprawością, bo ty wybierzesz, a nie ja? Ale co wiesz lepiej – mów."
"Hi34,34": "Ludzie rozumni powiedzą mi, a człowiek mądry niech słucha mnie:"
"Hi34,35": "Hiob mówi nie z wiedzą, a jego słowa nie są wypowiadane ze zrozumieniem."
"Hi34,36": "Oby Hiob został doświadczony na zawsze za odpowiedzi właściwe ludziom niegodziwym."
"Hi34,37": "Bo dodaje buntu do swojego grzechu, klaszcze pośród nas rękoma i mnoży swoje słowa przeciwko Bogu."
