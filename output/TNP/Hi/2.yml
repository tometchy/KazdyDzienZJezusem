"Hi2,1": "I stało się pewnego dnia, gdy synowie Boży przyszli, aby stanąć przed JHWH, że także szatan przyszedł wśród nich, aby stanąć przed JHWH"
"Hi2,2": "I powiedział JHWH do szatana: Skąd przychodzisz? I odpowiedział szatan JHWH, mówiąc: Krążyłem po ziemi i przechadzałem się po niej."
"Hi2,3": "Wtedy JHWH powiedział do szatana: Czy zwróciłeś uwagę na mojego sługę Hioba – gdyż nie ma nikogo jak on na ziemi? Człowiek to nienaganny i prawy, bojący się Boga i stroniący od zła. On nadal trwa w swojej prawości, a ty mnie nakłoniłeś przeciw niemu, aby go pochłonąć jak widać bez powodu."
"Hi2,4": "Szatan odpowiedział JHWH, mówiąc: Skóra za skórę, a wszystko, co człowiek ma, odda za swoje życie;"
"Hi2,5": "Lecz wyciągnij tylko swoją rękę i uderz w jego kości i w jego ciało, a zobaczysz, czy nie będzie ci w twarz złorzeczył."
"Hi2,6": "Wtedy JHWH powiedział do szatana: Oto jest w twojej mocy, lecz jego życie zachowaj."
"Hi2,7": "Wyszedł więc szatan sprzed oblicza JHWH i dotknął Hioba złośliwym wrzodem, od spodu jego stopy aż po czubek jego głowy."
"Hi2,8": "I wziął sobie skorupę, aby się nią skrobać, i siedział w popiele."
"Hi2,9": "Jego żona powiedziała do niego: Nadal trwasz w swojej prawości? Złorzecz Bogu i umrzyj!"
"Hi2,10": "I powiedział do niej: Mówisz, jak jedna z tych głupich kobiet. Czy tylko dobro będziemy przyjmować od Boga, a zła przyjmować nie będziemy? W tym wszystkim Hiob nie zgrzeszył swoimi ustami."
"Hi2,11": "I usłyszeli trzej przyjaciele Hioba o całym tym nieszczęściu, które spadło na niego; przyszli, każdy ze swojej miejscowości: Elifaz Temanita, Bildad Szuachita i Sofar Naamanita. Bo spotkali się razem, aby przyjść i wyrazić mu współczucie, i pocieszyć go."
"Hi2,12": "A gdy podnieśli z daleka swoje oczy, nie rozpoznali go. I podnieśli swój głos i zapłakali. I rozdarł każdy z nich swój płaszcz, i rzucali proch ku niebiosom na swoją głowę;"
"Hi2,13": "I siedzieli z nim na ziemi siedem dni i siedem nocy, a żaden z nich nie przemówił do niego ani słowa. Bo widzieli, że jego ból był bardzo wielki."
