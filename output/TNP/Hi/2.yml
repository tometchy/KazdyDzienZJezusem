"Hi2,1":
  text: "I stało się pewnego dnia, gdy synowie Boży przyszli, aby stanąć przed JHWH, że także szatan przyszedł wśród nich, aby stanąć przed JHWH"
  tags: []
"Hi2,2":
  text: "I powiedział JHWH do szatana: Skąd przychodzisz? I odpowiedział szatan JHWH, mówiąc: Krążyłem po ziemi i przechadzałem się po niej."
  tags: []
"Hi2,3":
  text: "Wtedy JHWH powiedział do szatana: Czy zwróciłeś uwagę na mojego sługę Hioba – gdyż nie ma nikogo jak on na ziemi? Człowiek to nienaganny i prawy, bojący się Boga i stroniący od zła. On nadal trwa w swojej prawości, a ty mnie nakłoniłeś przeciw niemu, aby go pochłonąć jak widać bez powodu."
  tags: []
"Hi2,4":
  text: "Szatan odpowiedział JHWH, mówiąc: Skóra za skórę, a wszystko, co człowiek ma, odda za swoje życie;"
  tags: []
"Hi2,5":
  text: "Lecz wyciągnij tylko swoją rękę i uderz w jego kości i w jego ciało, a zobaczysz, czy nie będzie ci w twarz złorzeczył."
  tags: []
"Hi2,6":
  text: "Wtedy JHWH powiedział do szatana: Oto jest w twojej mocy, lecz jego życie zachowaj."
  tags: []
"Hi2,7":
  text: "Wyszedł więc szatan sprzed oblicza JHWH i dotknął Hioba złośliwym wrzodem, od spodu jego stopy aż po czubek jego głowy."
  tags: []
"Hi2,8":
  text: "I wziął sobie skorupę, aby się nią skrobać, i siedział w popiele."
  tags: []
"Hi2,9":
  text: "Jego żona powiedziała do niego: Nadal trwasz w swojej prawości? Złorzecz Bogu i umrzyj!"
  tags: []
"Hi2,10":
  text: "I powiedział do niej: Mówisz, jak jedna z tych głupich kobiet. Czy tylko dobro będziemy przyjmować od Boga, a zła przyjmować nie będziemy? W tym wszystkim Hiob nie zgrzeszył swoimi ustami."
  tags: []
"Hi2,11":
  text: "I usłyszeli trzej przyjaciele Hioba o całym tym nieszczęściu, które spadło na niego; przyszli, każdy ze swojej miejscowości: Elifaz Temanita, Bildad Szuachita i Sofar Naamanita. Bo spotkali się razem, aby przyjść i wyrazić mu współczucie, i pocieszyć go."
  tags: []
"Hi2,12":
  text: "A gdy podnieśli z daleka swoje oczy, nie rozpoznali go. I podnieśli swój głos i zapłakali. I rozdarł każdy z nich swój płaszcz, i rzucali proch ku niebiosom na swoją głowę;"
  tags: []
"Hi2,13":
  text: "I siedzieli z nim na ziemi siedem dni i siedem nocy, a żaden z nich nie przemówił do niego ani słowa. Bo widzieli, że jego ból był bardzo wielki."
  tags: []
