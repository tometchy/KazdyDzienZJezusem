"Hi1,1": "Był pewien mąż w ziemi Us, jego imię – Hiob; człowiek ten był nienaganny i prawy, i bojący się Boga, a stroniący od zła."
"Hi1,2": "I urodziło mu się siedmiu synów i trzy córki."
"Hi1,3": "A jego dobytek stanowiło siedem tysięcy owiec, trzy tysiące wielbłądów, pięćset jarzm wołów i pięćset oślic, i bardzo liczna służba. A ten człowiek był najznakomitszym ze wszystkich synów Wschodu."
"Hi1,4": "I schodzili się jego synowie, i raz po raz urządzali ucztę, każdy w swoim domu w ustalonym dniu. I posyłali po swoje trzy siostry, i zapraszali je, aby jadły i piły wraz z nimi."
"Hi1,5": "A gdy mijał kolejny cykl dni uczty, wtedy posyłał po nich Hiob, aby ich poświęcić. Potem wstawał rano i za każdego z nich składał ofiary całopalne. Bo mówił Hiob: Może moi synowie zgrzeszyli i znieważyli Boga w swoich sercach. Tak Hiob czynił po wszystkie dni."
"Hi1,6": "I stało się pewnego dnia, gdy synowie Boży przyszli, aby stanąć przed JHWH, że także szatan przyszedł wśród nich."
"Hi1,7": "I powiedział JHWH do szatana: Skąd przychodzisz? I odpowiedział szatan JHWH, mówiąc: Krążyłem po ziemi i przechadzałem się po niej."
"Hi1,8": "Wtedy JHWH powiedział do szatana: Czy zwróciłeś uwagę na mojego sługę Hioba? Gdyż nie ma nikogo jak on na ziemi. Człowiek to nienaganny i prawy, bojący się Boga i stroniący od zła."
"Hi1,9": "A szatan odpowiedział JHWH, mówiąc: Czy Hiob za darmo boi się Boga?"
"Hi1,10": "Czy nie ty ogrodziłeś zewsząd jego, jego dom i wszystko, co wokół niego? Błogosławiłeś dziełu jego rąk, a jego dobytek rozmnożył się na ziemi."
"Hi1,11": "Ale teraz wyciągnij tylko swoją rękę i dotknij tego wszystkiego, co ma, a zobaczysz, czy nie będzie ci w twarz złorzeczył."
"Hi1,12": "Wtedy JHWH powiedział do szatana: Oto wszystko to, co ma, jest w twojej mocy, tylko na niego nie wyciągaj ręki. I szatan odszedł sprzed oblicza JHWH."
"Hi1,13": "I stało się pewnego dnia, gdy jego synowie i córki jedli i pili wino w domu najstarszego brata,"
"Hi1,14": "Że przybył do Hioba posłaniec i powiedział: Woły orały, a oślice pasły się w ich pobliżu;"
"Hi1,15": "I napadli Sabejczycy, i zabrali je, a sługi pozabijali ostrzem miecza. Uszedłem tylko ja sam, aby cię o tym powiadomić."
"Hi1,16": "A gdy ten jeszcze mówił, przyszedł inny i powiedział: Ogień Boży spadł z niebios, spalił owce i sługi i pochłonął ich. Uszedłem tylko ja sam, aby cię o tym powiadomić."
"Hi1,17": "A gdy ten jeszcze mówił, przyszedł inny i powiedział: Chaldejczycy uformowali trzy oddziały i napadli na wielbłądy, zabrali je, a sługi pozabijali ostrzem miecza. Uszedłem tylko ja sam, aby cię o tym powiadomić."
"Hi1,18": "A gdy ten jeszcze mówił, przyszedł inny i powiedział: Twoi synowie i córki jedli i pili wino w domu najstarszego brata;"
"Hi1,19": "A oto potężny wiatr nadciągnął od strony pustyni i uderzył w cztery węgły domu, tak że zawalił się na młodych i pomarli. Uszedłem tylko ja sam, aby cię o tym powiadomić."
"Hi1,20": "Wówczas Hiob wstał, rozdarł swój płaszcz, ogolił swoją głowę, upadł na ziemię i oddał pokłon;"
"Hi1,21": "I powiedział: Nagi wyszedłem z łona swojej matki i nagi stąd odejdę. JHWH dał, JHWH też wziął, niech imię JHWH będzie błogosławione."
"Hi1,22": "W tym wszystkim Hiob nie zgrzeszył i nie przypisywał Bogu nic niewłaściwego."
