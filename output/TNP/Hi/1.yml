"Hi1,1":
  text: "Był pewien mąż w ziemi Us, jego imię – Hiob; człowiek ten był nienaganny i prawy, i bojący się Boga, a stroniący od zła."
  tags: []
"Hi1,2":
  text: "I urodziło mu się siedmiu synów i trzy córki."
  tags: []
"Hi1,3":
  text: "A jego dobytek stanowiło siedem tysięcy owiec, trzy tysiące wielbłądów, pięćset jarzm wołów i pięćset oślic, i bardzo liczna służba. A ten człowiek był najznakomitszym ze wszystkich synów Wschodu."
  tags: []
"Hi1,4":
  text: "I schodzili się jego synowie, i raz po raz urządzali ucztę, każdy w swoim domu w ustalonym dniu. I posyłali po swoje trzy siostry, i zapraszali je, aby jadły i piły wraz z nimi."
  tags: []
"Hi1,5":
  text: "A gdy mijał kolejny cykl dni uczty, wtedy posyłał po nich Hiob, aby ich poświęcić. Potem wstawał rano i za każdego z nich składał ofiary całopalne. Bo mówił Hiob: Może moi synowie zgrzeszyli i znieważyli Boga w swoich sercach. Tak Hiob czynił po wszystkie dni."
  tags: []
"Hi1,6":
  text: "I stało się pewnego dnia, gdy synowie Boży przyszli, aby stanąć przed JHWH, że także szatan przyszedł wśród nich."
  tags: []
"Hi1,7":
  text: "I powiedział JHWH do szatana: Skąd przychodzisz? I odpowiedział szatan JHWH, mówiąc: Krążyłem po ziemi i przechadzałem się po niej."
  tags: []
"Hi1,8":
  text: "Wtedy JHWH powiedział do szatana: Czy zwróciłeś uwagę na mojego sługę Hioba? Gdyż nie ma nikogo jak on na ziemi. Człowiek to nienaganny i prawy, bojący się Boga i stroniący od zła."
  tags: []
"Hi1,9":
  text: "A szatan odpowiedział JHWH, mówiąc: Czy Hiob za darmo boi się Boga?"
  tags: []
"Hi1,10":
  text: "Czy nie ty ogrodziłeś zewsząd jego, jego dom i wszystko, co wokół niego? Błogosławiłeś dziełu jego rąk, a jego dobytek rozmnożył się na ziemi."
  tags: []
"Hi1,11":
  text: "Ale teraz wyciągnij tylko swoją rękę i dotknij tego wszystkiego, co ma, a zobaczysz, czy nie będzie ci w twarz złorzeczył."
  tags: []
"Hi1,12":
  text: "Wtedy JHWH powiedział do szatana: Oto wszystko to, co ma, jest w twojej mocy, tylko na niego nie wyciągaj ręki. I szatan odszedł sprzed oblicza JHWH."
  tags: []
"Hi1,13":
  text: "I stało się pewnego dnia, gdy jego synowie i córki jedli i pili wino w domu najstarszego brata,"
  tags: []
"Hi1,14":
  text: "Że przybył do Hioba posłaniec i powiedział: Woły orały, a oślice pasły się w ich pobliżu;"
  tags: []
"Hi1,15":
  text: "I napadli Sabejczycy, i zabrali je, a sługi pozabijali ostrzem miecza. Uszedłem tylko ja sam, aby cię o tym powiadomić."
  tags: []
"Hi1,16":
  text: "A gdy ten jeszcze mówił, przyszedł inny i powiedział: Ogień Boży spadł z niebios, spalił owce i sługi i pochłonął ich. Uszedłem tylko ja sam, aby cię o tym powiadomić."
  tags: []
"Hi1,17":
  text: "A gdy ten jeszcze mówił, przyszedł inny i powiedział: Chaldejczycy uformowali trzy oddziały i napadli na wielbłądy, zabrali je, a sługi pozabijali ostrzem miecza. Uszedłem tylko ja sam, aby cię o tym powiadomić."
  tags: []
"Hi1,18":
  text: "A gdy ten jeszcze mówił, przyszedł inny i powiedział: Twoi synowie i córki jedli i pili wino w domu najstarszego brata;"
  tags: []
"Hi1,19":
  text: "A oto potężny wiatr nadciągnął od strony pustyni i uderzył w cztery węgły domu, tak że zawalił się na młodych i pomarli. Uszedłem tylko ja sam, aby cię o tym powiadomić."
  tags: []
"Hi1,20":
  text: "Wówczas Hiob wstał, rozdarł swój płaszcz, ogolił swoją głowę, upadł na ziemię i oddał pokłon;"
  tags: []
"Hi1,21":
  text: "I powiedział: Nagi wyszedłem z łona swojej matki i nagi stąd odejdę. JHWH dał, JHWH też wziął, niech imię JHWH będzie błogosławione."
  tags: []
"Hi1,22":
  text: "W tym wszystkim Hiob nie zgrzeszył i nie przypisywał Bogu nic niewłaściwego."
  tags: []
