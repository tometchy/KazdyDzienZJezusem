"Hi22,1":
  text: "Wtedy Elifaz Temańczyk odpowiedział i rzekł:"
  tags: []
"Hi22,2":
  text: "Czy Bóg ma pożytek z człowieka? Czy nawet mądry może przynieść pożytek dla samego siebie?"
  tags: []
"Hi22,3":
  text: "Czy Wszechmogący ma upodobanie w tym, że jesteś sprawiedliwy? I czy ma zysk z tego, że doskonalisz swoje drogi?"
  tags: []
"Hi22,4":
  text: "Czy będzie cię karał za twoją bogobojność? Czy wnosi przeciwko tobie sprawę w sądzie?"
  tags: []
"Hi22,5":
  text: "Czy twoja niegodziwość nie jest wielka i nie mają końca twoje nieprawości?"
  tags: []
"Hi22,6":
  text: "Gdyż bez powodu brałeś zastaw od twoich braci, a półnagich obdzierałeś z szat."
  tags: []
"Hi22,7":
  text: "Nie dałeś wody zmęczonemu i odmówiłeś chleba głodnemu."
  tags: []
"Hi22,8":
  text: "Lecz dla człowieka silnego była ziemia, a poważany mieszkał w niej."
  tags: []
"Hi22,9":
  text: "Wdowy odprawiłeś z niczym, a ramiona sierot miażdżyłeś."
  tags: []
"Hi22,10":
  text: "Dlatego też otaczają cię sidła i przeraża cię nagły strach."
  tags: []
"Hi22,11":
  text: "I ciemność – nic nie widzisz, a masa wód cię okrywa."
  tags: []
"Hi22,12":
  text: "Czy Bóg nie jest na wysokościach niebios? Spójrz więc na wysokość gwiazd, jakże są wysoko!"
  tags: []
"Hi22,13":
  text: "A ty mówisz: Co Bóg wie? Czy zza gęstych chmur będzie sądził?"
  tags: []
"Hi22,14":
  text: "Ciemne chmury są Jego zasłoną, więc nie widzi, gdy po sklepieniu niebios się przechadza."
  tags: []
"Hi22,15":
  text: "Czy chcesz się trzymać starej ścieżki, którą wydeptali ludzie nieprawi?"
  tags: []
"Hi22,16":
  text: "Ci, którzy zostali wyrwani przed czasem i rzeka zalała ich fundamenty."
  tags: []
"Hi22,17":
  text: "Mówiący do Boga: Odejdź od nas! I: Co może im uczynić Wszechmogący?"
  tags: []
"Hi22,18":
  text: "Ale On napełniał ich domy dobrem. Ale rada niegodziwych jest daleko ode mnie."
  tags: []
"Hi22,19":
  text: "Widzą to sprawiedliwi i cieszą się, a niewinny naśmiewa się z nich."
  tags: []
"Hi22,20":
  text: "Czyż nasz przeciwnik nie zostaje zniszczony, a ich resztkę pochłonął ogień?"
  tags: []
"Hi22,21":
  text: "Zaznajom się z Nim, proszę! I niech będzie wśród was pokój, a zawita do ciebie dobro."
  tags: []
"Hi22,22":
  text: "Przyjmij, proszę, Prawo z Jego ust i złóż Jego słowa w swoim sercu."
  tags: []
"Hi22,23":
  text: "Jeśli zawrócisz do Wszechmogącego, zostaniesz odbudowany, jeśli oddalisz nieprawość od swojego namiotu."
  tags: []
"Hi22,24":
  text: "Rzuć w proch drogocenny kruszec i między skałę potoków złoto z Ofiru."
  tags: []
"Hi22,25":
  text: "Wszechmogący stanie się twoim drogocennym kruszcem i srebrem – twoją siłą."
  tags: []
"Hi22,26":
  text: "Tak! Wtedy będziesz się rozkoszować w Wszechmogącym i wzniesiesz ku Bogu swoje oblicze."
  tags: []
"Hi22,27":
  text: "Będziesz błagał Go, a On cię wysłucha, a ty spełnisz swoje śluby."
  tags: []
"Hi22,28":
  text: "I gdy podejmiesz sprawę, to się spełni, a na twoich drogach będzie świecić światłość."
  tags: []
"Hi22,29":
  text: "Bo choć poniżono cię, lecz jak powiedziałeś – pychę! A tego, kto nisko zwraca oczy, On wybawia."
  tags: []
"Hi22,30":
  text: "Ocala także tego, który nie jest niewinny, a zostanie on wyzwolony dzięki czystości Twoich rąk."
  tags: []
