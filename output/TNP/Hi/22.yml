"Hi22,1": "Wtedy Elifaz Temańczyk odpowiedział i rzekł:"
"Hi22,2": "Czy Bóg ma pożytek z człowieka? Czy nawet mądry może przynieść pożytek dla samego siebie?"
"Hi22,3": "Czy Wszechmogący ma upodobanie w tym, że jesteś sprawiedliwy? I czy ma zysk z tego, że doskonalisz swoje drogi?"
"Hi22,4": "Czy będzie cię karał za twoją bogobojność? Czy wnosi przeciwko tobie sprawę w sądzie?"
"Hi22,5": "Czy twoja niegodziwość nie jest wielka i nie mają końca twoje nieprawości?"
"Hi22,6": "Gdyż bez powodu brałeś zastaw od twoich braci, a półnagich obdzierałeś z szat."
"Hi22,7": "Nie dałeś wody zmęczonemu i odmówiłeś chleba głodnemu."
"Hi22,8": "Lecz dla człowieka silnego była ziemia, a poważany mieszkał w niej."
"Hi22,9": "Wdowy odprawiłeś z niczym, a ramiona sierot miażdżyłeś."
"Hi22,10": "Dlatego też otaczają cię sidła i przeraża cię nagły strach."
"Hi22,11": "I ciemność – nic nie widzisz, a masa wód cię okrywa."
"Hi22,12": "Czy Bóg nie jest na wysokościach niebios? Spójrz więc na wysokość gwiazd, jakże są wysoko!"
"Hi22,13": "A ty mówisz: Co Bóg wie? Czy zza gęstych chmur będzie sądził?"
"Hi22,14": "Ciemne chmury są Jego zasłoną, więc nie widzi, gdy po sklepieniu niebios się przechadza."
"Hi22,15": "Czy chcesz się trzymać starej ścieżki, którą wydeptali ludzie nieprawi?"
"Hi22,16": "Ci, którzy zostali wyrwani przed czasem i rzeka zalała ich fundamenty."
"Hi22,17": "Mówiący do Boga: Odejdź od nas! I: Co może im uczynić Wszechmogący?"
"Hi22,18": "Ale On napełniał ich domy dobrem. Ale rada niegodziwych jest daleko ode mnie."
"Hi22,19": "Widzą to sprawiedliwi i cieszą się, a niewinny naśmiewa się z nich."
"Hi22,20": "Czyż nasz przeciwnik nie zostaje zniszczony, a ich resztkę pochłonął ogień?"
"Hi22,21": "Zaznajom się z Nim, proszę! I niech będzie wśród was pokój, a zawita do ciebie dobro."
"Hi22,22": "Przyjmij, proszę, Prawo z Jego ust i złóż Jego słowa w swoim sercu."
"Hi22,23": "Jeśli zawrócisz do Wszechmogącego, zostaniesz odbudowany, jeśli oddalisz nieprawość od swojego namiotu."
"Hi22,24": "Rzuć w proch drogocenny kruszec i między skałę potoków złoto z Ofiru."
"Hi22,25": "Wszechmogący stanie się twoim drogocennym kruszcem i srebrem – twoją siłą."
"Hi22,26": "Tak! Wtedy będziesz się rozkoszować w Wszechmogącym i wzniesiesz ku Bogu swoje oblicze."
"Hi22,27": "Będziesz błagał Go, a On cię wysłucha, a ty spełnisz swoje śluby."
"Hi22,28": "I gdy podejmiesz sprawę, to się spełni, a na twoich drogach będzie świecić światłość."
"Hi22,29": "Bo choć poniżono cię, lecz jak powiedziałeś – pychę! A tego, kto nisko zwraca oczy, On wybawia."
"Hi22,30": "Ocala także tego, który nie jest niewinny, a zostanie on wyzwolony dzięki czystości Twoich rąk."
