"Hi18,1": "Wtedy Bildad Szuachita odpowiedział i rzekł:"
"Hi18,2": "Jak długo będziecie zastawiać pułapki na słowa? Pomyślcie, a potem przemówimy."
"Hi18,3": "Dlaczego zalicza się nas do bydła? Dlaczego jesteśmy uważani za nieczystych w waszych oczach?"
"Hi18,4": "Ty, który rozdzierasz w gniewie swoją duszę – czy z powodu ciebie ma być wyludniona ziemia i skała przesunięta ze swojego miejsca?"
"Hi18,5": "Tak, światło niegodziwych gaśnie, i płomień jego ognia nie świeci."
"Hi18,6": "Światło przygasa w jego namiocie jego lampa nad nim gaśnie."
"Hi18,7": "Kroki jego siły będą skrępowane, i upada przez własny plan."
"Hi18,8": "Bo jego nogi zapędzają go w sieć, i wchodzi na zapadnię."
"Hi18,9": "Potrzask chwyta go za piętę i mocno zatrzaskuje się nad nim pułapka."
"Hi18,10": "W ziemi skryta jest na niego pętla, a pułapka nad jego ścieżką."
"Hi18,11": "Zewsząd trwożą go zmory, nacierają na niego na każdym kroku."
"Hi18,12": "Głód niech będzie osłabieniem jego sił, a klęska jest już gotowa u jego boku."
"Hi18,13": "Pożre kawały jego skóry, najstraszniejsza śmierć pożre jego członki."
"Hi18,14": "Zostanie on wyrwany ze swego namiotu, swej ufności i zmuszony do przemaszerowania przed królem grozy."
"Hi18,15": "Osiądzie w jego namiocie nienależąca do niego, sprawi, że rozrzuci po jego niwie siarkę."
"Hi18,16": "Od spodu uschną jego korzenie, a z góry będzie obcięta jego gałąź."
"Hi18,17": "Pamięć o nim zginie z ziemi i nie ma już jego imienia na obszarze kraju."
"Hi18,18": "Wypychają go ze światła do ciemności i wypędzają go ze świata."
"Hi18,19": "Nie będzie miał potomka i nie będzie miał potomstwa w swoim ludzie i nikt nie pozostanie w miejscu jego zamieszkania."
"Hi18,20": "W dniu jego sądu zostaną przerażeni ludzie Zachodu, a mieszkańcy Wschodu zostaną ogarnięci trwogą."
"Hi18,21": "Tak to jest z tymi namiotami niegodziwych i takie jest miejsce tego, który nie zna Boga."
