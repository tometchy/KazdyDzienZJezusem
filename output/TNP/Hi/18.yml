"Hi18,1":
  text: "Wtedy Bildad Szuachita odpowiedział i rzekł:"
  tags: []
"Hi18,2":
  text: "Jak długo będziecie zastawiać pułapki na słowa? Pomyślcie, a potem przemówimy."
  tags: []
"Hi18,3":
  text: "Dlaczego zalicza się nas do bydła? Dlaczego jesteśmy uważani za nieczystych w waszych oczach?"
  tags: []
"Hi18,4":
  text: "Ty, który rozdzierasz w gniewie swoją duszę – czy z powodu ciebie ma być wyludniona ziemia i skała przesunięta ze swojego miejsca?"
  tags: []
"Hi18,5":
  text: "Tak, światło niegodziwych gaśnie, i płomień jego ognia nie świeci."
  tags: []
"Hi18,6":
  text: "Światło przygasa w jego namiocie jego lampa nad nim gaśnie."
  tags: []
"Hi18,7":
  text: "Kroki jego siły będą skrępowane, i upada przez własny plan."
  tags: []
"Hi18,8":
  text: "Bo jego nogi zapędzają go w sieć, i wchodzi na zapadnię."
  tags: []
"Hi18,9":
  text: "Potrzask chwyta go za piętę i mocno zatrzaskuje się nad nim pułapka."
  tags: []
"Hi18,10":
  text: "W ziemi skryta jest na niego pętla, a pułapka nad jego ścieżką."
  tags: []
"Hi18,11":
  text: "Zewsząd trwożą go zmory, nacierają na niego na każdym kroku."
  tags: []
"Hi18,12":
  text: "Głód niech będzie osłabieniem jego sił, a klęska jest już gotowa u jego boku."
  tags: []
"Hi18,13":
  text: "Pożre kawały jego skóry, najstraszniejsza śmierć pożre jego członki."
  tags: []
"Hi18,14":
  text: "Zostanie on wyrwany ze swego namiotu, swej ufności i zmuszony do przemaszerowania przed królem grozy."
  tags: []
"Hi18,15":
  text: "Osiądzie w jego namiocie nienależąca do niego, sprawi, że rozrzuci po jego niwie siarkę."
  tags: []
"Hi18,16":
  text: "Od spodu uschną jego korzenie, a z góry będzie obcięta jego gałąź."
  tags: []
"Hi18,17":
  text: "Pamięć o nim zginie z ziemi i nie ma już jego imienia na obszarze kraju."
  tags: []
"Hi18,18":
  text: "Wypychają go ze światła do ciemności i wypędzają go ze świata."
  tags: []
"Hi18,19":
  text: "Nie będzie miał potomka i nie będzie miał potomstwa w swoim ludzie i nikt nie pozostanie w miejscu jego zamieszkania."
  tags: []
"Hi18,20":
  text: "W dniu jego sądu zostaną przerażeni ludzie Zachodu, a mieszkańcy Wschodu zostaną ogarnięci trwogą."
  tags: []
"Hi18,21":
  text: "Tak to jest z tymi namiotami niegodziwych i takie jest miejsce tego, który nie zna Boga."
  tags: []
