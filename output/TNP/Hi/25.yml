"Hi25,1":
  text: "A Bildad Szuachita odpowiedział i rzekł:"
  tags: []
"Hi25,2":
  text: "Z Nim są panowanie i strach, On czyni pokój na Jego wysokościach."
  tags: []
"Hi25,3":
  text: "Czy znana jest liczba Jego oddziałów? A nad kim nie wschodzi Jego światło?"
  tags: []
"Hi25,4":
  text: "Jak więc może człowiek być usprawiedliwiony przed Bogiem? Lub jak może być czystym ten, kto został zrodzony z kobiety?"
  tags: []
"Hi25,5":
  text: "Oto nawet księżyc nie lśni i gwiazdy nie są w Jego oczach czyste;"
  tags: []
"Hi25,6":
  text: "Tak! Tym bardziej człowiek, który jest jak czerw i syn człowieka, który jest jak robak."
  tags: []
