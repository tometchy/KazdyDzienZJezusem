"Hi25,1": "A Bildad Szuachita odpowiedział i rzekł:"
"Hi25,2": "Z Nim są panowanie i strach, On czyni pokój na Jego wysokościach."
"Hi25,3": "Czy znana jest liczba Jego oddziałów? A nad kim nie wschodzi Jego światło?"
"Hi25,4": "Jak więc może człowiek być usprawiedliwiony przed Bogiem? Lub jak może być czystym ten, kto został zrodzony z kobiety?"
"Hi25,5": "Oto nawet księżyc nie lśni i gwiazdy nie są w Jego oczach czyste;"
"Hi25,6": "Tak! Tym bardziej człowiek, który jest jak czerw i syn człowieka, który jest jak robak."
