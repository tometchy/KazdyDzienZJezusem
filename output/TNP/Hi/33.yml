"Hi33,1":
  text: "A jednak słuchaj, proszę Hiobie, mojej mowy i nadstaw ucha na wszystkie moje słowa."
  tags: []
"Hi33,2":
  text: "Ach! Oto otwieram moje usta, a mój język przemawia z podniebienia."
  tags: []
"Hi33,3":
  text: "Moje wypowiedzi pochodzą z prawości mojego serca, a moje wargi wyraźnie wypowiedzą wiedzę."
  tags: []
"Hi33,4":
  text: "Duch Boga stworzył mnie i tchnienie Wszechmogącego ożywiło mnie."
  tags: []
"Hi33,5":
  text: "Jeśli możesz, odpowiedz mi! Przygotuj się, stań przede mną!"
  tags: []
"Hi33,6":
  text: "Oto ja jestem przed Bogiem takim jak ty, ja także jestem z gliny uformowany."
  tags: []
"Hi33,7":
  text: "Oto strach przede mną niech cię nie przeraża, a mój nacisk niech nie zaciąży nad tobą."
  tags: []
"Hi33,8":
  text: "Jednak ty powiedziałeś mi do uszu, słyszałem brzmienie twoich wypowiedzi:"
  tags: []
"Hi33,9":
  text: "Jestem czysty, bez przestępstwa, ja jestem niewinny i nie ma we mnie nieprawości."
  tags: []
"Hi33,10":
  text: "Oto On znajduje zarzuty przeciwko mnie i poczytuje mnie za swojego wroga."
  tags: []
"Hi33,11":
  text: "Wkłada moje nogi w dyby i śledzi wszystkie moje ścieżki."
  tags: []
"Hi33,12":
  text: "Otóż w tym nie jesteś sprawiedliwy. Odpowiem ci, że Bóg jest większy od człowieka."
  tags: []
"Hi33,13":
  text: "Dlaczego spierałeś się z Nim, że na żadne jego słowa nie odpowiada?"
  tags: []
"Hi33,14":
  text: "Bo w jednej sprawie przemawia Bóg i w drugiej, jednak nie zważa się na to."
  tags: []
"Hi33,15":
  text: "We śnie, w nocnym widzeniu, gdy twardy sen spada na ludzi, w drzemkach na łożu;"
  tags: []
"Hi33,16":
  text: "Wtedy otwiera mężom uszy i pieczętuje ich pouczenie;"
  tags: []
"Hi33,17":
  text: "Aby odwieść człowieka od złego czynu i zakryć pychę siłacza."
  tags: []
"Hi33,18":
  text: "Powstrzymuje jego duszę od grobu, a jego życie od przeszycia przez miecz."
  tags: []
"Hi33,19":
  text: "Karci go przez cierpienie na jego łożu i nieustannym drżeniem jego kości;"
  tags: []
"Hi33,20":
  text: "A jego życiu brzydnie nawetchleb, a jego duszy ulubiony pokarm."
  tags: []
"Hi33,21":
  text: "Jego ciało znika z widoku, a wystają jego kości, wcześniej niewidoczne."
  tags: []
"Hi33,22":
  text: "A jego dusza zbliża się do grobu, a jego życie do sprowadzających śmierć."
  tags: []
"Hi33,23":
  text: "Jeśli jest przy nim jakiś anioł, pośrednik, jeden z tysiąca, aby oznajmić człowiekowi jego powinność;"
  tags: []
"Hi33,24":
  text: "Wtedy okaże mu życzliwość i powie: Wybaw go od zejścia do grobu, bo znalazłem okup za niego."
  tags: []
"Hi33,25":
  text: "Jego ciało niech zostanie odnowione jak w młodości, niech powróci do dni jego żywotności."
  tags: []
"Hi33,26":
  text: "Gdy modli się do Boga, a Ten jest dla niego łaskawy i widzi Jego oblicze z okrzykiem radości, i przywraca człowiekowi jego sprawiedliwość;"
  tags: []
"Hi33,27":
  text: "Spojrzy na ludzi i powie: Zgrzeszyłem i wypaczyłem to, co prawe, a nie było mi za to odpłacone;"
  tags: []
"Hi33,28":
  text: "On wybawił moją duszę od zejścia do grobu, a moje życie ujrzy światło."
  tags: []
"Hi33,29":
  text: "Oto wszystko to czyni Bóg wobec człowieka kilkakrotnie;"
  tags: []
"Hi33,30":
  text: "Aby zawrócić jego duszę od zejścia do grobu i oświecić go światłem życia."
  tags: []
"Hi33,31":
  text: "Zważ na to, Hiobie, słuchaj mnie! Milcz, a ja będę mówił."
  tags: []
"Hi33,32":
  text: "Jeśli jednak masz słowa – odpowiedz mi. Przemów, bo chciałbym cię usprawiedliwić."
  tags: []
"Hi33,33":
  text: "A jeśli nie, to ty wysłuchaj mnie! Milcz, a nauczę cię mądrości."
  tags: []
