"Hi33,1": "A jednak słuchaj, proszę Hiobie, mojej mowy i nadstaw ucha na wszystkie moje słowa."
"Hi33,2": "Ach! Oto otwieram moje usta, a mój język przemawia z podniebienia."
"Hi33,3": "Moje wypowiedzi pochodzą z prawości mojego serca, a moje wargi wyraźnie wypowiedzą wiedzę."
"Hi33,4": "Duch Boga stworzył mnie i tchnienie Wszechmogącego ożywiło mnie."
"Hi33,5": "Jeśli możesz, odpowiedz mi! Przygotuj się, stań przede mną!"
"Hi33,6": "Oto ja jestem przed Bogiem takim jak ty, ja także jestem z gliny uformowany."
"Hi33,7": "Oto strach przede mną niech cię nie przeraża, a mój nacisk niech nie zaciąży nad tobą."
"Hi33,8": "Jednak ty powiedziałeś mi do uszu, słyszałem brzmienie twoich wypowiedzi:"
"Hi33,9": "Jestem czysty, bez przestępstwa, ja jestem niewinny i nie ma we mnie nieprawości."
"Hi33,10": "Oto On znajduje zarzuty przeciwko mnie i poczytuje mnie za swojego wroga."
"Hi33,11": "Wkłada moje nogi w dyby i śledzi wszystkie moje ścieżki."
"Hi33,12": "Otóż w tym nie jesteś sprawiedliwy. Odpowiem ci, że Bóg jest większy od człowieka."
"Hi33,13": "Dlaczego spierałeś się z Nim, że na żadne jego słowa nie odpowiada?"
"Hi33,14": "Bo w jednej sprawie przemawia Bóg i w drugiej, jednak nie zważa się na to."
"Hi33,15": "We śnie, w nocnym widzeniu, gdy twardy sen spada na ludzi, w drzemkach na łożu;"
"Hi33,16": "Wtedy otwiera mężom uszy i pieczętuje ich pouczenie;"
"Hi33,17": "Aby odwieść człowieka od złego czynu i zakryć pychę siłacza."
"Hi33,18": "Powstrzymuje jego duszę od grobu, a jego życie od przeszycia przez miecz."
"Hi33,19": "Karci go przez cierpienie na jego łożu i nieustannym drżeniem jego kości;"
"Hi33,20": "A jego życiu brzydnie nawetchleb, a jego duszy ulubiony pokarm."
"Hi33,21": "Jego ciało znika z widoku, a wystają jego kości, wcześniej niewidoczne."
"Hi33,22": "A jego dusza zbliża się do grobu, a jego życie do sprowadzających śmierć."
"Hi33,23": "Jeśli jest przy nim jakiś anioł, pośrednik, jeden z tysiąca, aby oznajmić człowiekowi jego powinność;"
"Hi33,24": "Wtedy okaże mu życzliwość i powie: Wybaw go od zejścia do grobu, bo znalazłem okup za niego."
"Hi33,25": "Jego ciało niech zostanie odnowione jak w młodości, niech powróci do dni jego żywotności."
"Hi33,26": "Gdy modli się do Boga, a Ten jest dla niego łaskawy i widzi Jego oblicze z okrzykiem radości, i przywraca człowiekowi jego sprawiedliwość;"
"Hi33,27": "Spojrzy na ludzi i powie: Zgrzeszyłem i wypaczyłem to, co prawe, a nie było mi za to odpłacone;"
"Hi33,28": "On wybawił moją duszę od zejścia do grobu, a moje życie ujrzy światło."
"Hi33,29": "Oto wszystko to czyni Bóg wobec człowieka kilkakrotnie;"
"Hi33,30": "Aby zawrócić jego duszę od zejścia do grobu i oświecić go światłem życia."
"Hi33,31": "Zważ na to, Hiobie, słuchaj mnie! Milcz, a ja będę mówił."
"Hi33,32": "Jeśli jednak masz słowa – odpowiedz mi. Przemów, bo chciałbym cię usprawiedliwić."
"Hi33,33": "A jeśli nie, to ty wysłuchaj mnie! Milcz, a nauczę cię mądrości."
