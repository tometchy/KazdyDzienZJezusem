"Hi17,1": "Mój duchjest złamany, moje dni gasną, pozostały mi groby."
"Hi17,2": "Czyż szydercy nie są przy mnie? A czy moje oko musi nocować w cieniu ich buntu?"
"Hi17,3": "Wyznacz więc proszę zastaw za mnie u siebie. Bo kim jest ten, który za mnie przyklaśnie ręką?"
"Hi17,4": "Ponieważ ich serce ukryłeś przed zrozumieniem, dlatego też ich nie wywyższysz."
"Hi17,5": "Kto dla pochlebstwa donosi na przyjaciół, to oczy jego synów zgasną."
"Hi17,6": "Wystawił mnie na przysłowie u ludów i stałem się splunięciem przed nimi."
"Hi17,7": "I moje oko zamgliło się od smutku, a wszystkie moje członki są jak cień."
"Hi17,8": "Prawi są zdumieni nad tym, a niewinny triumfuje nad obłudnikiem."
"Hi17,9": "A sprawiedliwy trzyma się swojej drogi, a kto ma czyste ręce, nabiera sił."
"Hi17,10": "A jednak wszyscy wy zawróćcie i przyjdźcie teraz! Bo mądrego wśród was nie znajduję."
"Hi17,11": "Moje dni przeminęły, rozwiały się moje zamiary – dziedzictwo mego serca."
"Hi17,12": "Noc zamieniają w dzień, światłość jest blisko w obliczu ciemności."
"Hi17,13": "Jeśli czekam? Szeol moim domem, w ciemności rozłożyłem sobie łoże."
"Hi17,14": "Zawołałem do dołu: Ty jesteś moim ojcem! A do robaka: Moja matko i moja siostro!"
"Hi17,15": "Gdzie jest więc teraz moja nadzieja? Moją nadzieję – kto ją ujrzy?"
"Hi17,16": "Zstąpią do zasuw Szeolu, gdy razem odpoczniemy w prochu."
