"Hi8,1": "Wtedy Bildad Szuachita odpowiedział i rzekł:"
"Hi8,2": "Jak długo będziesz mówił takie rzeczy? Jak długo słowa z twoich ust będą jak gwałtowny wiatr?"
"Hi8,3": "Czy Bóg wypacza sąd? Czy rzeczywiście Wszechmogący wypacza sprawiedliwość?"
"Hi8,4": "Gdy twoi synowie zgrzeszyli przeciwko Niemu, wtedy wydał ich w moc ich przestępstwa;"
"Hi8,5": "Jeśli ty będziesz szukał Boga i będziesz błagał Wszechmogącego o łaskę;"
"Hi8,6": "Jeśli ty będziesz czysty i prawy, to nawet teraz ocknie się nad tobą i poszczęści niwie twojej sprawiedliwości."
"Hi8,7": "A choćby twój początek był niewielki, to jednak twój koniec bardzo się rozrośnie."
"Hi8,8": "Bo zapytaj, proszę, dawnych pokoleń i rozważ odkrycie ich ojców;"
"Hi8,9": "Bo my żyjemy od wczoraj i nic nie wiemy, gdyż nasze dni są cieniem na ziemi."
"Hi8,10": "Czy oni nie pouczą cię i nie powiedzą ci, i czy z ich serc nie wypłyną słowa?"
"Hi8,11": "Czy papirus urośnie, tam gdzie nie ma bagna, a czy sitowie rośnie bez wody?"
"Hi8,12": "Nadal świeże i nie zostało wycięte, a jednak usycha wcześniej niż inna trawa."
"Hi8,13": "Tak dzieje się ze ścieżkami wszystkich, którzy zapomnieli o Bogu, i tak ginie nadzieja obłudnika."
"Hi8,14": "Pęka jego pewność, a jego ufność jest jak sieć pająka."
"Hi8,15": "Opiera się o swój dom, ale się nie ostoi; mocno się go uchwyci, lecz nie przetrwa."
"Hi8,16": "Nawodniony on jest w słońcu i poza ogród wypuszcza swoje pędy."
"Hi8,17": "Wśród sterty kamieni wplatają się jego korzenie; szuka miejsca pośród kamieni."
"Hi8,18": "A jeśli go pochłonie jego miejsce, wtedy miejsce to wyprze się, mówiąc: Nie widziałem cię."
"Hi8,19": "Oto, takie jest szczęście jego drogi, a z prochu po nim wyrosną inni."
"Hi8,20": "Oto Bóg nie odrzuca nienagannego, nie wzmacnia ręki nikczemnym;"
"Hi8,21": "Jeszcze napełni twoje usta uśmiechem, a twoje wargi okrzykiem radości."
"Hi8,22": "Nienawidzący cię okryją się hańbą, a namiotu niegodziwych już nie będzie."
