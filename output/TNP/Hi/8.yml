"Hi8,1":
  text: "Wtedy Bildad Szuachita odpowiedział i rzekł:"
  tags: []
"Hi8,2":
  text: "Jak długo będziesz mówił takie rzeczy? Jak długo słowa z twoich ust będą jak gwałtowny wiatr?"
  tags: []
"Hi8,3":
  text: "Czy Bóg wypacza sąd? Czy rzeczywiście Wszechmogący wypacza sprawiedliwość?"
  tags: []
"Hi8,4":
  text: "Gdy twoi synowie zgrzeszyli przeciwko Niemu, wtedy wydał ich w moc ich przestępstwa;"
  tags: []
"Hi8,5":
  text: "Jeśli ty będziesz szukał Boga i będziesz błagał Wszechmogącego o łaskę;"
  tags: []
"Hi8,6":
  text: "Jeśli ty będziesz czysty i prawy, to nawet teraz ocknie się nad tobą i poszczęści niwie twojej sprawiedliwości."
  tags: []
"Hi8,7":
  text: "A choćby twój początek był niewielki, to jednak twój koniec bardzo się rozrośnie."
  tags: []
"Hi8,8":
  text: "Bo zapytaj, proszę, dawnych pokoleń i rozważ odkrycie ich ojców;"
  tags: []
"Hi8,9":
  text: "Bo my żyjemy od wczoraj i nic nie wiemy, gdyż nasze dni są cieniem na ziemi."
  tags: []
"Hi8,10":
  text: "Czy oni nie pouczą cię i nie powiedzą ci, i czy z ich serc nie wypłyną słowa?"
  tags: []
"Hi8,11":
  text: "Czy papirus urośnie, tam gdzie nie ma bagna, a czy sitowie rośnie bez wody?"
  tags: []
"Hi8,12":
  text: "Nadal świeże i nie zostało wycięte, a jednak usycha wcześniej niż inna trawa."
  tags: []
"Hi8,13":
  text: "Tak dzieje się ze ścieżkami wszystkich, którzy zapomnieli o Bogu, i tak ginie nadzieja obłudnika."
  tags: []
"Hi8,14":
  text: "Pęka jego pewność, a jego ufność jest jak sieć pająka."
  tags: []
"Hi8,15":
  text: "Opiera się o swój dom, ale się nie ostoi; mocno się go uchwyci, lecz nie przetrwa."
  tags: []
"Hi8,16":
  text: "Nawodniony on jest w słońcu i poza ogród wypuszcza swoje pędy."
  tags: []
"Hi8,17":
  text: "Wśród sterty kamieni wplatają się jego korzenie; szuka miejsca pośród kamieni."
  tags: []
"Hi8,18":
  text: "A jeśli go pochłonie jego miejsce, wtedy miejsce to wyprze się, mówiąc: Nie widziałem cię."
  tags: []
"Hi8,19":
  text: "Oto, takie jest szczęście jego drogi, a z prochu po nim wyrosną inni."
  tags: []
"Hi8,20":
  text: "Oto Bóg nie odrzuca nienagannego, nie wzmacnia ręki nikczemnym;"
  tags: []
"Hi8,21":
  text: "Jeszcze napełni twoje usta uśmiechem, a twoje wargi okrzykiem radości."
  tags: []
"Hi8,22":
  text: "Nienawidzący cię okryją się hańbą, a namiotu niegodziwych już nie będzie."
  tags: []
