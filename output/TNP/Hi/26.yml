"Hi26,1":
  text: "A Hiob odpowiedział i rzekł:"
  tags: []
"Hi26,2":
  text: "O, jakże pokrzepiłeś bezsilnego! Jakże wspomogłeś osłabione ramię!"
  tags: []
"Hi26,3":
  text: "Ależ przyszedłeś z pomocą temu, kto nie ma mądrości? Okazałeś w pełni rozsądek!"
  tags: []
"Hi26,4":
  text: "Razem z kim oznajmiłeś te wypowiedzi? A czyje tchnienie wyszło z ciebie?"
  tags: []
"Hi26,5":
  text: "Cienie martwych drżą spod wód i ich mieszkańcy."
  tags: []
"Hi26,6":
  text: "Szeol jest odkryty przed Nim; Abaddon nie ma okrycia."
  tags: []
"Hi26,7":
  text: "Rozciąga północ nad pustką i ziemię zawiesza nad nicością."
  tags: []
"Hi26,8":
  text: "Wiąże wody w swoich chmurach, a jednak obłok nie pęka pod nimi."
  tags: []
"Hi26,9":
  text: "Zasłania oblicze swojego tronu, rozpościeraniem nad nim swojego obłoku."
  tags: []
"Hi26,10":
  text: "Zakreślił granicę nad powierzchnią wód, aż po kraniec światła przy ciemności."
  tags: []
"Hi26,11":
  text: "Filary niebios doznają wstrząsu i zdumiewają się Jego naganą."
  tags: []
"Hi26,12":
  text: "On w swojej mocy wzburza morze, i w swojej roztropności roztrzaskał Rahaba."
  tags: []
"Hi26,13":
  text: "Przez swoje tchnienie odsłania piękno niebios, a Jego ręka przebiła wijącego się węża."
  tags: []
"Hi26,14":
  text: "Oto te sprawy, to zaledwie zarys Jego drogi i niczym szept słyszymy Jego słowo! Kto więc zdoła zrozumieć grom Jego potęgi?"
  tags: []
