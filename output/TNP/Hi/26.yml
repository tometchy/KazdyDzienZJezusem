"Hi26,1": "A Hiob odpowiedział i rzekł:"
"Hi26,2": "O, jakże pokrzepiłeś bezsilnego! Jakże wspomogłeś osłabione ramię!"
"Hi26,3": "Ależ przyszedłeś z pomocą temu, kto nie ma mądrości? Okazałeś w pełni rozsądek!"
"Hi26,4": "Razem z kim oznajmiłeś te wypowiedzi? A czyje tchnienie wyszło z ciebie?"
"Hi26,5": "Cienie martwych drżą spod wód i ich mieszkańcy."
"Hi26,6": "Szeol jest odkryty przed Nim; Abaddon nie ma okrycia."
"Hi26,7": "Rozciąga północ nad pustką i ziemię zawiesza nad nicością."
"Hi26,8": "Wiąże wody w swoich chmurach, a jednak obłok nie pęka pod nimi."
"Hi26,9": "Zasłania oblicze swojego tronu, rozpościeraniem nad nim swojego obłoku."
"Hi26,10": "Zakreślił granicę nad powierzchnią wód, aż po kraniec światła przy ciemności."
"Hi26,11": "Filary niebios doznają wstrząsu i zdumiewają się Jego naganą."
"Hi26,12": "On w swojej mocy wzburza morze, i w swojej roztropności roztrzaskał Rahaba."
"Hi26,13": "Przez swoje tchnienie odsłania piękno niebios, a Jego ręka przebiła wijącego się węża."
"Hi26,14": "Oto te sprawy, to zaledwie zarys Jego drogi i niczym szept słyszymy Jego słowo! Kto więc zdoła zrozumieć grom Jego potęgi?"
