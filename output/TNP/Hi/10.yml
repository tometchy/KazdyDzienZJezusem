"Hi10,1": "Moja dusza zmęczona jest życiem. Puszczę wodze memu narzekaniu, przemówię w goryczy mojej duszy."
"Hi10,2": "Powiem do Boga: Nie potępiaj mnie. Oznajmij mi, o co mnie oskarżasz?"
"Hi10,3": "Czy dobrze ci z tym, że mnie uciskasz, że odrzucasz dzieło swoich rąk i na radę niegodziwych promieniejesz?"
"Hi10,4": "Czy masz oczy cielesne? Czy patrzysz, jak patrzy śmiertelnik?"
"Hi10,5": "Czy Twoje dni są jak dni śmiertelnika, a Twoje lata jak dni człowieka;"
"Hi10,6": "Bo szukasz mojej winy i dochodzisz mojego grzechu?"
"Hi10,7": "Chociaż Ty wiesz, że nie jestem niegodziwy i nikt nie wyrwie mnie z Twojej ręki."
"Hi10,8": "Twoje ręce ukształtowały mnie i uczyniły mnie, otoczyłeś mnie całego ze wszystkich stron, lecz teraz mnie pochłaniasz."
"Hi10,9": "Pamiętaj, proszę, że uczyniłeś mnie jak glinę; i czy w proch znowu mnie obrócisz?"
"Hi10,10": "Czy nie wylałeś mnie jak mleko i nie sprawiłeś, że stężałem jak ser?"
"Hi10,11": "Odziałeś mnie w skórę i ciało, a pospinałeś mnie kośćmi i ścięgnami."
"Hi10,12": "Ofiarowałeś mi życie i miłosierdzie, a Twoja troskliwość strzegła mojego ducha."
"Hi10,13": "Lecz ukryłeś to wszystko w swoim sercu, wiem jednak, że to było w Tobie."
"Hi10,14": "Jeśli zgrzeszę, wtedy Ty to spostrzeżesz i nie uznasz mnie za niewinnego z moją nieprawością."
"Hi10,15": "Jeśli jestem niegodziwy, biada mi, a jeśli jestem sprawiedliwy, i tak nie podniosę swojej głowy. Syty jestem hańby. Spójrz na moje utrapienie;"
"Hi10,16": "A gdyby jednak się podniosła, zapolujesz na mnie jak lew i zwrócisz się wobec mnie, by okazać swoją niezwykłość."
"Hi10,17": "Stawiasz nowe Twoje dowody przeciwko mnie, pomnażasz wobec mnie swój gniew; zmiana i zastęp wojska są przeciwko mnie."
"Hi10,18": "Dlaczego więc wyprowadziłeś mnie z łona? Umarłbym i nie ujrzałoby mnie żadne oko!"
"Hi10,19": "Byłbym, jakby mnie nigdy nie było, byłbym z brzucha przeniesiony do grobu!"
"Hi10,20": "Czyż nie zostało mi niewiele dni? Przestań więc i odstąp ode mnie, niech na chwilę się uśmiechnę."
"Hi10,21": "Zanim pójdę tam i nie wrócę – do ziemi ciemności i cienia śmierci;"
"Hi10,22": "Do ziemi ciemnej jak mrok, do cienia śmierci i bez porządku, zionącej niczym mrok."
