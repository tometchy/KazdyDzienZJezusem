"Hi10,1":
  text: "Moja dusza zmęczona jest życiem. Puszczę wodze memu narzekaniu, przemówię w goryczy mojej duszy."
  tags: []
"Hi10,2":
  text: "Powiem do Boga: Nie potępiaj mnie. Oznajmij mi, o co mnie oskarżasz?"
  tags: []
"Hi10,3":
  text: "Czy dobrze ci z tym, że mnie uciskasz, że odrzucasz dzieło swoich rąk i na radę niegodziwych promieniejesz?"
  tags: []
"Hi10,4":
  text: "Czy masz oczy cielesne? Czy patrzysz, jak patrzy śmiertelnik?"
  tags: []
"Hi10,5":
  text: "Czy Twoje dni są jak dni śmiertelnika, a Twoje lata jak dni człowieka;"
  tags: []
"Hi10,6":
  text: "Bo szukasz mojej winy i dochodzisz mojego grzechu?"
  tags: []
"Hi10,7":
  text: "Chociaż Ty wiesz, że nie jestem niegodziwy i nikt nie wyrwie mnie z Twojej ręki."
  tags: []
"Hi10,8":
  text: "Twoje ręce ukształtowały mnie i uczyniły mnie, otoczyłeś mnie całego ze wszystkich stron, lecz teraz mnie pochłaniasz."
  tags: []
"Hi10,9":
  text: "Pamiętaj, proszę, że uczyniłeś mnie jak glinę; i czy w proch znowu mnie obrócisz?"
  tags: []
"Hi10,10":
  text: "Czy nie wylałeś mnie jak mleko i nie sprawiłeś, że stężałem jak ser?"
  tags: []
"Hi10,11":
  text: "Odziałeś mnie w skórę i ciało, a pospinałeś mnie kośćmi i ścięgnami."
  tags: []
"Hi10,12":
  text: "Ofiarowałeś mi życie i miłosierdzie, a Twoja troskliwość strzegła mojego ducha."
  tags: []
"Hi10,13":
  text: "Lecz ukryłeś to wszystko w swoim sercu, wiem jednak, że to było w Tobie."
  tags: []
"Hi10,14":
  text: "Jeśli zgrzeszę, wtedy Ty to spostrzeżesz i nie uznasz mnie za niewinnego z moją nieprawością."
  tags: []
"Hi10,15":
  text: "Jeśli jestem niegodziwy, biada mi, a jeśli jestem sprawiedliwy, i tak nie podniosę swojej głowy. Syty jestem hańby. Spójrz na moje utrapienie;"
  tags: []
"Hi10,16":
  text: "A gdyby jednak się podniosła, zapolujesz na mnie jak lew i zwrócisz się wobec mnie, by okazać swoją niezwykłość."
  tags: []
"Hi10,17":
  text: "Stawiasz nowe Twoje dowody przeciwko mnie, pomnażasz wobec mnie swój gniew; zmiana i zastęp wojska są przeciwko mnie."
  tags: []
"Hi10,18":
  text: "Dlaczego więc wyprowadziłeś mnie z łona? Umarłbym i nie ujrzałoby mnie żadne oko!"
  tags: []
"Hi10,19":
  text: "Byłbym, jakby mnie nigdy nie było, byłbym z brzucha przeniesiony do grobu!"
  tags: []
"Hi10,20":
  text: "Czyż nie zostało mi niewiele dni? Przestań więc i odstąp ode mnie, niech na chwilę się uśmiechnę."
  tags: []
"Hi10,21":
  text: "Zanim pójdę tam i nie wrócę – do ziemi ciemności i cienia śmierci;"
  tags: []
"Hi10,22":
  text: "Do ziemi ciemnej jak mrok, do cienia śmierci i bez porządku, zionącej niczym mrok."
  tags: []
