"Rz16,1":
  text: "A polecam wam Febę, siostrę naszą, która jest służebnicą zboru w Kenchreach,"
  tags: []
"Rz16,2":
  text: "Abyście ją przyjęli w Panu w sposób godny świętych i dopomogli jej, gdyby was w jakiejkolwiek sprawie potrzebowała; albowiem i ona stała się opiekunką wielu, także i dla mnie samego."
  tags: []
"Rz16,3":
  text: "Pozdrówcie Pryscyllę i Akwilę, współpracowników moich w Chrystusie Jezusie,"
  tags: []
"Rz16,4":
  text: "Którzy za moją duszę nadstawili swoją szyję, którym nie tylko ja dziękuję, ale i wszystkie zbory z pogan;"
  tags: []
"Rz16,5":
  text: "Także zbór, który jest w ich domu. Pozdrówcie Epeneta, umiłowanego mojego, który jest pierwociną Achai w Chrystusie."
  tags: []
"Rz16,6":
  text: "Pozdrówcie Marię, która wiele trudziła się dla nas."
  tags: []
"Rz16,7":
  text: "Pozdrówcie Andronika i Junię, krewnych moich i współwięźniów moich, którzy są zaszczytnie znani między apostołami, którzy i przede mną byli w Chrystusie."
  tags: []
"Rz16,8":
  text: "Pozdrówcie Ampliasa, umiłowanego mojego w Panu."
  tags: []
"Rz16,9":
  text: "Pozdrówcie Urbana, naszego współpracownika w Chrystusie, i Stachysa, umiłowanego mojego."
  tags: []
"Rz16,10":
  text: "Pozdrówcie Apellesa, doświadczonego w Chrystusie. Pozdrówcie tych, którzy są z domu Arystobula."
  tags: []
"Rz16,11":
  text: "Pozdrówcie Herodiona, mojego krewnego. Pozdrówcie tych, którzy są z domu Narcyza, będących w Panu."
  tags: []
"Rz16,12":
  text: "Pozdrówcie Tryfenę i Tryfozę, które trudzą się w Panu. Pozdrówcie Persydę, umiłowaną, która wielce trudziła się w Panu."
  tags: []
"Rz16,13":
  text: "Pozdrówcie Rufusa, wybranego w Panu, i matkę jego, i moją."
  tags: []
"Rz16,14":
  text: "Pozdrówcie Asynkrytusa, Flegonta, Hermasa, Patroba, Hermesa i braci, którzy są z nimi."
  tags: []
"Rz16,15":
  text: "Pozdrówcie Filologa i Julię, Nereusza i jego siostrę, i Olimpasa, i wszystkich świętych, którzy są z nimi."
  tags: []
"Rz16,16":
  text: "Pozdrówcie jedni drugich pocałunkiem świętym. Pozdrawiają was zbory Chrystusa."
  tags: []
"Rz16,17":
  text: "A proszę was, bracia, abyście uważali na tych, którzy czynią podziały i zgorszenia wbrew tej nauce, której się wy nauczyliście; i odstąpcie od nich."
  tags: []
"Rz16,18":
  text: "Tacy bowiem nie służą naszemu Panu Jezusowi Chrystusowi, ale swojemu własnemu brzuchowi, a gładkimi słowami i schlebianiem zwodzą serca prostodusznych."
  tags: []
"Rz16,19":
  text: "Bo wieść o waszym posłuszeństwie dotarła do wszystkich. Dlatego raduję się z waszego powodu; a chcę, abyście prawdziwie byli mądrymi w tym, co dobre, a czyści wobec zła."
  tags: []
"Rz16,20":
  text: "A Bóg pokoju szybko zetrze szatana pod waszymi stopami. Łaska Pana naszego Jezusa Chrystusa z wami. Amen."
  tags: []
"Rz16,21":
  text: "Pozdrawiają was Tymoteusz, mój współpracownik i Lucjusz, i Jazon, i Sozypater, moi krewni."
  tags: []
"Rz16,22":
  text: "Pozdrawiam was ja, Tercjusz, który napisałem ten list w Panu."
  tags: []
"Rz16,23":
  text: "Pozdrawia was Gajus, gospodarz mój i całego zboru. Pozdrawia was Erast, zarządca miasta, i brat Kwartus;"
  tags: []
"Rz16,24":
  text: "Łaska Pana naszego Jezusa Chrystusa z wami wszystkimi. Amen."
  tags: []
"Rz16,25":
  text: "A Temu natomiast, który ma moc was utwierdzić według mojej Ewangelii i głoszenia Jezusa Chrystusa, według objawienia tajemnicy, która jest od czasów wiecznych zakryta milczeniem,"
  tags: []
"Rz16,26":
  text: "A która teraz została ujawniona także przez Pisma prorockie zgodnie z rozkazem wiecznego Boga oraz oznajmiona wszystkim narodom, aby je przyprowadzić do posłuszeństwa wiary;"
  tags: []
"Rz16,27":
  text: "Jedynemu mądremu Bogu, przez Jezusa Chrystusa – Jemu chwała na wieki. Amen."
  tags: []
