"Rz16,1": "A polecam wam Febę, siostrę naszą, która jest służebnicą zboru w Kenchreach,"
"Rz16,2": "Abyście ją przyjęli w Panu w sposób godny świętych i dopomogli jej, gdyby was w jakiejkolwiek sprawie potrzebowała; albowiem i ona stała się opiekunką wielu, także i dla mnie samego."
"Rz16,3": "Pozdrówcie Pryscyllę i Akwilę, współpracowników moich w Chrystusie Jezusie,"
"Rz16,4": "Którzy za moją duszę nadstawili swoją szyję, którym nie tylko ja dziękuję, ale i wszystkie zbory z pogan;"
"Rz16,5": "Także zbór, który jest w ich domu. Pozdrówcie Epeneta, umiłowanego mojego, który jest pierwociną Achai w Chrystusie."
"Rz16,6": "Pozdrówcie Marię, która wiele trudziła się dla nas."
"Rz16,7": "Pozdrówcie Andronika i Junię, krewnych moich i współwięźniów moich, którzy są zaszczytnie znani między apostołami, którzy i przede mną byli w Chrystusie."
"Rz16,8": "Pozdrówcie Ampliasa, umiłowanego mojego w Panu."
"Rz16,9": "Pozdrówcie Urbana, naszego współpracownika w Chrystusie, i Stachysa, umiłowanego mojego."
"Rz16,10": "Pozdrówcie Apellesa, doświadczonego w Chrystusie. Pozdrówcie tych, którzy są z domu Arystobula."
"Rz16,11": "Pozdrówcie Herodiona, mojego krewnego. Pozdrówcie tych, którzy są z domu Narcyza, będących w Panu."
"Rz16,12": "Pozdrówcie Tryfenę i Tryfozę, które trudzą się w Panu. Pozdrówcie Persydę, umiłowaną, która wielce trudziła się w Panu."
"Rz16,13": "Pozdrówcie Rufusa, wybranego w Panu, i matkę jego, i moją."
"Rz16,14": "Pozdrówcie Asynkrytusa, Flegonta, Hermasa, Patroba, Hermesa i braci, którzy są z nimi."
"Rz16,15": "Pozdrówcie Filologa i Julię, Nereusza i jego siostrę, i Olimpasa, i wszystkich świętych, którzy są z nimi."
"Rz16,16": "Pozdrówcie jedni drugich pocałunkiem świętym. Pozdrawiają was zbory Chrystusa."
"Rz16,17": "A proszę was, bracia, abyście uważali na tych, którzy czynią podziały i zgorszenia wbrew tej nauce, której się wy nauczyliście; i odstąpcie od nich."
"Rz16,18": "Tacy bowiem nie służą naszemu Panu Jezusowi Chrystusowi, ale swojemu własnemu brzuchowi, a gładkimi słowami i schlebianiem zwodzą serca prostodusznych."
"Rz16,19": "Bo wieść o waszym posłuszeństwie dotarła do wszystkich. Dlatego raduję się z waszego powodu; a chcę, abyście prawdziwie byli mądrymi w tym, co dobre, a czyści wobec zła."
"Rz16,20": "A Bóg pokoju szybko zetrze szatana pod waszymi stopami. Łaska Pana naszego Jezusa Chrystusa z wami. Amen."
"Rz16,21": "Pozdrawiają was Tymoteusz, mój współpracownik i Lucjusz, i Jazon, i Sozypater, moi krewni."
"Rz16,22": "Pozdrawiam was ja, Tercjusz, który napisałem ten list w Panu."
"Rz16,23": "Pozdrawia was Gajus, gospodarz mój i całego zboru. Pozdrawia was Erast, zarządca miasta, i brat Kwartus;"
"Rz16,24": "Łaska Pana naszego Jezusa Chrystusa z wami wszystkimi. Amen."
"Rz16,25": "A Temu natomiast, który ma moc was utwierdzić według mojej Ewangelii i głoszenia Jezusa Chrystusa, według objawienia tajemnicy, która jest od czasów wiecznych zakryta milczeniem,"
"Rz16,26": "A która teraz została ujawniona także przez Pisma prorockie zgodnie z rozkazem wiecznego Boga oraz oznajmiona wszystkim narodom, aby je przyprowadzić do posłuszeństwa wiary;"
"Rz16,27": "Jedynemu mądremu Bogu, przez Jezusa Chrystusa – Jemu chwała na wieki. Amen."
