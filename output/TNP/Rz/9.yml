"Rz9,1": "Prawdę mówię w Chrystusie, nie kłamię, jak mi współświadczy sumienie moje w Duchu Świętym,"
"Rz9,2": "Że wielki jest mój smutek i nieustanny ból w moim sercu."
"Rz9,3": "Ja bowiem sam życzyłem sobie, by być przeklętym, z dala od Chrystusa, ze względu na braci moich, krewnych moich według ciała,"
"Rz9,4": "Którymi są Izraelici, do których należą usynowienie i chwała, i przymierza, i nadanie Prawa, i służba Boża, i obietnice,"
"Rz9,5": "Których są ojcowie i z których pochodzi Chrystus według ciała, będący nad wszystkimi, Bóg błogosławiony na wieki. Amen."
"Rz9,6": "Lecz nie jest tak, aby zaczęło upadać Słowo Boże; bowiem nie wszyscy ci z Izraela, są Izraelem;"
"Rz9,7": "I nie wszystkie dzieci Abrahama są jego potomstwem lecz: W Izaaku zostanie nazwane twoje potomstwo."
"Rz9,8": "To jest, nie dzieci ciała są dziećmi Boga, ale dzieci obietnicy liczone są za potomstwo."
"Rz9,9": "Albowiem to jest słowo obietnicy: W tym czasie przyjdę i Sara będzie miała syna."
"Rz9,10": "A nie tylko to, ale i Rebeka, z jednego łoża miała dzieci, z Izaaka, ojca naszego;"
"Rz9,11": "Albowiem kiedy oni jeszcze nie zostali zrodzeni i nie uczynili nic dobrego ani złego, aby postanowienie Boże według wybrania trwało niewzruszone, nie z uczynków, ale przez Tego, który powołuje,"
"Rz9,12": "Powiedziano jej: Starszy będzie służył młodszemu."
"Rz9,13": "Tak, jak jest napisane: Jakuba umiłowałem, ale Ezawem wzgardziłem."
"Rz9,14": "Cóż więc powiemy? Czy u Boga jest niesprawiedliwość? Z pewnością nie!"
"Rz9,15": "Do Mojżesza bowiem powiedział: Zmiłuję się, nad kim chcę okazać zmiłowanie; a zlituję się, nad kim chcę okazać zlitowanie."
"Rz9,16": "A zatem zależy to nie od tego, który chce, ani od tego, który zabiega, ale od Tego, który okazuje miłosierdzie – Boga."
"Rz9,17": "Mówi bowiem Pismo do faraona: Na to ciebie wzbudziłem, aby okazać moc moją na tobie i aby rozgłoszone było imię moje po całej ziemi."
"Rz9,18": "Dlatego też, nad kim chce, okazuje zmiłowanie, a kogo chce, zatwardza."
"Rz9,19": "Powiesz mi więc: Dlaczego jeszcze oskarża? Kto bowiem sprzeciwi się Jego woli?"
"Rz9,20": "O człowieku! Przeciwnie, kim ty jesteś, że spierasz się z Bogiem? Czy powie twór do twórcy: Czemu mnie takim uczyniłeś?"
"Rz9,21": "Czy garncarz nie ma władzy nad gliną, żeby z tej samej masy uczynić jedno naczynie do celów prawdziwie zaszczytnych, a drugie do niezaszczytnych?"
"Rz9,22": "A jeśli Bóg, chcąc okazać gniew i dać poznać swoją moc, zniósł w wielkiej cierpliwości naczynia gniewu, które są przygotowane ku zgubie,"
"Rz9,23": "I aby dał poznać bogactwo chwały Jego nad naczyniami miłosierdzia, które wcześniej przygotował ku chwale?"
"Rz9,24": "I jako takich powołał nas, nie tylko z Żydów, ale i z pogan."
"Rz9,25": "Jak też u Ozeasza mówi: Nie mój lud nazwę moim ludem, a nie umiłowaną – umiłowaną."
"Rz9,26": "I będzie w miejscu, o którym im powiedziano: Wy nie jesteście moim ludem, tam zostaną nazwani synami Boga żywego."
"Rz9,27": "Izajasz natomiast woła nad Izraelem: Choćby liczba synów Izraela była jak piasek morski, tylko resztka zostanie zbawiona."
"Rz9,28": "Doprowadzi bowiem dzieło do końca i skraca je w sprawiedliwości, ponieważ PAN zaczął skracać dzieło na ziemi."
"Rz9,29": "I tak, jak wcześniej zaczął zapowiadać Izajasz: Gdyby PAN Zastępów nie zostawił nam potomstwa, stalibyśmy się jak Sodoma, i do Gomory byśmy zostali upodobnieni."
"Rz9,30": "Cóż więc powiemy? Że poganie, którzy nie dążą do sprawiedliwości, uchwycili się sprawiedliwości; sprawiedliwości, która jest z wiary,"
"Rz9,31": "A Izrael, który dąży do sprawiedliwości Prawa, nie doszedł do sprawiedliwości Prawa."
"Rz9,32": "A dlaczego? Dlatego, że nie z wiary, ale jakby z uczynków Prawa; potknęli się bowiem o kamień obrazy,"
"Rz9,33": "Tak, jak jest napisane: Oto kładę na Syjonie kamień obrazy i skałę zgorszenia, a każdy kto w Niego wierzy, nie zostanie zawstydzony."
