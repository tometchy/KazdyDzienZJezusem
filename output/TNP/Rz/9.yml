"Rz9,1":
  text: "Prawdę mówię w Chrystusie, nie kłamię, jak mi współświadczy sumienie moje w Duchu Świętym,"
  tags: []
"Rz9,2":
  text: "Że wielki jest mój smutek i nieustanny ból w moim sercu."
  tags: []
"Rz9,3":
  text: "Ja bowiem sam życzyłem sobie, by być przeklętym, z dala od Chrystusa, ze względu na braci moich, krewnych moich według ciała,"
  tags: []
"Rz9,4":
  text: "Którymi są Izraelici, do których należą usynowienie i chwała, i przymierza, i nadanie Prawa, i służba Boża, i obietnice,"
  tags: []
"Rz9,5":
  text: "Których są ojcowie i z których pochodzi Chrystus według ciała, będący nad wszystkimi, Bóg błogosławiony na wieki. Amen."
  tags: []
"Rz9,6":
  text: "Lecz nie jest tak, aby zaczęło upadać Słowo Boże; bowiem nie wszyscy ci z Izraela, są Izraelem;"
  tags: []
"Rz9,7":
  text: "I nie wszystkie dzieci Abrahama są jego potomstwem lecz: W Izaaku zostanie nazwane twoje potomstwo."
  tags: []
"Rz9,8":
  text: "To jest, nie dzieci ciała są dziećmi Boga, ale dzieci obietnicy liczone są za potomstwo."
  tags: []
"Rz9,9":
  text: "Albowiem to jest słowo obietnicy: W tym czasie przyjdę i Sara będzie miała syna."
  tags: []
"Rz9,10":
  text: "A nie tylko to, ale i Rebeka, z jednego łoża miała dzieci, z Izaaka, ojca naszego;"
  tags: []
"Rz9,11":
  text: "Albowiem kiedy oni jeszcze nie zostali zrodzeni i nie uczynili nic dobrego ani złego, aby postanowienie Boże według wybrania trwało niewzruszone, nie z uczynków, ale przez Tego, który powołuje,"
  tags: []
"Rz9,12":
  text: "Powiedziano jej: Starszy będzie służył młodszemu."
  tags: []
"Rz9,13":
  text: "Tak, jak jest napisane: Jakuba umiłowałem, ale Ezawem wzgardziłem."
  tags: []
"Rz9,14":
  text: "Cóż więc powiemy? Czy u Boga jest niesprawiedliwość? Z pewnością nie!"
  tags: []
"Rz9,15":
  text: "Do Mojżesza bowiem powiedział: Zmiłuję się, nad kim chcę okazać zmiłowanie; a zlituję się, nad kim chcę okazać zlitowanie."
  tags: []
"Rz9,16":
  text: "A zatem zależy to nie od tego, który chce, ani od tego, który zabiega, ale od Tego, który okazuje miłosierdzie – Boga."
  tags: []
"Rz9,17":
  text: "Mówi bowiem Pismo do faraona: Na to ciebie wzbudziłem, aby okazać moc moją na tobie i aby rozgłoszone było imię moje po całej ziemi."
  tags: []
"Rz9,18":
  text: "Dlatego też, nad kim chce, okazuje zmiłowanie, a kogo chce, zatwardza."
  tags: []
"Rz9,19":
  text: "Powiesz mi więc: Dlaczego jeszcze oskarża? Kto bowiem sprzeciwi się Jego woli?"
  tags: []
"Rz9,20":
  text: "O człowieku! Przeciwnie, kim ty jesteś, że spierasz się z Bogiem? Czy powie twór do twórcy: Czemu mnie takim uczyniłeś?"
  tags: []
"Rz9,21":
  text: "Czy garncarz nie ma władzy nad gliną, żeby z tej samej masy uczynić jedno naczynie do celów prawdziwie zaszczytnych, a drugie do niezaszczytnych?"
  tags: []
"Rz9,22":
  text: "A jeśli Bóg, chcąc okazać gniew i dać poznać swoją moc, zniósł w wielkiej cierpliwości naczynia gniewu, które są przygotowane ku zgubie,"
  tags: []
"Rz9,23":
  text: "I aby dał poznać bogactwo chwały Jego nad naczyniami miłosierdzia, które wcześniej przygotował ku chwale?"
  tags: []
"Rz9,24":
  text: "I jako takich powołał nas, nie tylko z Żydów, ale i z pogan."
  tags: []
"Rz9,25":
  text: "Jak też u Ozeasza mówi: Nie mój lud nazwę moim ludem, a nie umiłowaną – umiłowaną."
  tags: []
"Rz9,26":
  text: "I będzie w miejscu, o którym im powiedziano: Wy nie jesteście moim ludem, tam zostaną nazwani synami Boga żywego."
  tags: []
"Rz9,27":
  text: "Izajasz natomiast woła nad Izraelem: Choćby liczba synów Izraela była jak piasek morski, tylko resztka zostanie zbawiona."
  tags: []
"Rz9,28":
  text: "Doprowadzi bowiem dzieło do końca i skraca je w sprawiedliwości, ponieważ PAN zaczął skracać dzieło na ziemi."
  tags: []
"Rz9,29":
  text: "I tak, jak wcześniej zaczął zapowiadać Izajasz: Gdyby PAN Zastępów nie zostawił nam potomstwa, stalibyśmy się jak Sodoma, i do Gomory byśmy zostali upodobnieni."
  tags: []
"Rz9,30":
  text: "Cóż więc powiemy? Że poganie, którzy nie dążą do sprawiedliwości, uchwycili się sprawiedliwości; sprawiedliwości, która jest z wiary,"
  tags: []
"Rz9,31":
  text: "A Izrael, który dąży do sprawiedliwości Prawa, nie doszedł do sprawiedliwości Prawa."
  tags: []
"Rz9,32":
  text: "A dlaczego? Dlatego, że nie z wiary, ale jakby z uczynków Prawa; potknęli się bowiem o kamień obrazy,"
  tags: []
"Rz9,33":
  text: "Tak, jak jest napisane: Oto kładę na Syjonie kamień obrazy i skałę zgorszenia, a każdy kto w Niego wierzy, nie zostanie zawstydzony."
  tags: []
