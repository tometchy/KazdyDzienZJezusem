"Rz6,1": "Cóż więc powiemy? Czy mamy pozostać w grzechu, aby łaska była obfitsza?"
"Rz6,2": "Z pewnością nie! Albowiem my, którzy umarliśmy dla grzechu, jak jeszcze w nim żyć będziemy?"
"Rz6,3": "Czy nie wiecie, że my wszyscy, którzy zostaliśmy ochrzczeni w Chrystusa Jezusa, w śmierć Jego zostaliśmy ochrzczeni?"
"Rz6,4": "Pogrzebani jesteśmy razem z Nim przez zanurzenie w śmierć, aby tak jak Chrystus został wzbudzony z martwych przez chwałę Ojca, tak abyśmy i my chodzili w nowości życia."
"Rz6,5": "Bo jeśli staliśmy się zrośnięci w podobieństwo Jego śmierci, to i w podobieństwo Jego zmartwychwstania zrośnięci będziemy,"
"Rz6,6": "Wiedząc to, że nasz stary człowiek razem z Nim został ukrzyżowany, aby ciało grzechu zostało uczynione bezczynnym, abyśmy już więcej nie pozostawali w niewoli grzechu;"
"Rz6,7": "Bo kto umarł, uwolniony jest od grzechu."
"Rz6,8": "Jeśli więc umarliśmy z Chrystusem, wierzymy też, że razem z Nim żyć będziemy."
"Rz6,9": "Wiedząc, że Chrystus, który został wzbudzony z martwych, już nie umiera; śmierć już nad Nim nie panuje."
"Rz6,10": "Bo gdy umarł, raz na zawsze umarł dla grzechu; a gdy żyje, żyje dla Boga."
"Rz6,11": "Tak też i wy, zaliczajcie siebie samych do prawdziwie umarłych dla grzechu, a żyjących dla Boga w Chrystusie Jezusie, Panu naszym."
"Rz6,12": "Niech więc nie króluje grzech w śmiertelnym ciele waszym, abyście mieli być mu posłuszni w jego pożądliwościach;"
"Rz6,13": "I nie stawiajcie swoich członków na oręż niesprawiedliwości dla grzechu, ale postawcie samych siebie Bogu, jako żyjących, którzy powstali z martwych, a swoje członki jako oręż sprawiedliwości Bogu."
"Rz6,14": "Bowiem grzech nad wami panować nie będzie; bo nie jesteście pod prawem, ale pod łaską."
"Rz6,15": "Cóż więc? Czy mamy grzeszyć, dlatego że nie jesteśmy pod prawem, ale pod łaską? Z pewnością nie!"
"Rz6,16": "Czy nie wiecie, że komu stawiacie siebie samych jako niewolnicy w posłuszeństwo, jesteście niewolnikami tego, komu jesteście posłuszni, bądź grzechowi ku śmierci, bądź posłuszeństwu ku sprawiedliwości?"
"Rz6,17": "Ale Bogu niech będzie wdzięczność, że wy, którzy byliście niewolnikami grzechu, usłuchaliście z całego serca wzoru tej nauki, której zostaliście przekazani."
"Rz6,18": "A będąc uwolnieni od grzechu, zostaliście niewolnikami sprawiedliwości."
"Rz6,19": "Po ludzku mówię, z powodu słabości waszego ciała. Tak jak bowiem postawiliście swoje członki w niewolę nieczystości i nieprawości, by czynić nieprawość, tak teraz postawcie swoje członki w niewolę sprawiedliwości ku uświęceniu."
"Rz6,20": "Bo gdy byliście niewolnikami grzechu, byliście wolni od sprawiedliwości."
"Rz6,21": "Jaki więc wówczas mieliście pożytek z tych rzeczy? Tych, których się teraz wstydzicie; bo końcem ich jest śmierć."
"Rz6,22": "Lecz teraz, gdy zostaliście wyzwoleni od grzechu, zostaliście oddani w niewolę Bogu, mając swój pożytek w uświęceniu, a na końcu – życie wieczne."
"Rz6,23": "Bowiem zapłatą za grzech jest śmierć, ale darem łaski Boga jest życie wieczne w Chrystusie Jezusie, Panu naszym."
