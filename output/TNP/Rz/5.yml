"Rz5,1":
  text: "Będąc więc uznani za sprawiedliwych z wiary, pokój mamy z Bogiem przez Pana naszego Jezusa Chrystusa,"
  tags: []
"Rz5,2":
  text: "Przez którego też otrzymaliśmy dostęp przez wiarę do tej łaski, w której stanęliśmy i chlubimy się z powodu nadziei chwały Boga."
  tags: []
"Rz5,3":
  text: "A nie tylko to, ale chlubimy się w uciskach, wiedząc, że ucisk sprawia wytrwałość,"
  tags: []
"Rz5,4":
  text: "A wytrwałość doświadczenie, a doświadczenie nadzieję,"
  tags: []
"Rz5,5":
  text: "A nadzieja nie zawstydza, bo miłość Boża jest wylewana na nasze serca przez Ducha Świętego, który został nam dany."
  tags: []
"Rz5,6":
  text: "Chrystus bowiem umarł we właściwym czasie za nas bezbożnych, gdy jeszcze byliśmy bezsilni."
  tags: []
"Rz5,7":
  text: "Z trudnością bowiem umrze ktoś za sprawiedliwego; za dobrego może ktoś odważa się umrzeć."
  tags: []
"Rz5,8":
  text: "Lecz Bóg dowodzi swojej miłości wobec nas, że gdy jeszcze byliśmy grzesznikami, Chrystus umarł za nas."
  tags: []
"Rz5,9":
  text: "O wiele bardziej więc, będąc teraz uznani za sprawiedliwych przez Jego krew, zostaniemy przez Niego zbawieni od gniewu."
  tags: []
"Rz5,10":
  text: "Bo jeżeli, będąc nieprzyjaciółmi, zostaliśmy pojednani z Bogiem przez śmierć Jego Syna, o wiele bardziej będąc pojednani, zostaniemy zbawieni przez Jego życie."
  tags: []
"Rz5,11":
  text: "A nie tylko to, ale też chlubimy się w Bogu przez Pana naszego Jezusa Chrystusa, przez którego teraz otrzymaliśmy pojednanie."
  tags: []
"Rz5,12":
  text: "Dlatego, tak jak przez jednego człowieka grzech wszedł na świat, a przez grzech śmierć, tak i na wszystkich ludzi przeszła śmierć, za to, że wszyscy zgrzeszyli."
  tags: []
"Rz5,13":
  text: "Bo aż do Prawa grzech był na świecie; ale grzech nie jest zaliczany, gdy nie ma Prawa."
  tags: []
"Rz5,14":
  text: "Lecz śmierć zakrólowała od Adama aż do Mojżesza nawet nad tymi, którzy nie zgrzeszyli na podobieństwo przestępstwa Adama, będącego typem Tego, który miał przyjść."
  tags: []
"Rz5,15":
  text: "Ale nie tak jest z upadkiem, jak z darem łaski; jeśli bowiem z powodu jednego upadku wielu umarło, o wiele bardziej łaska Boża i dar w tej łasce jednego człowieka, Jezusa Chrystusa, zaobfitowała dla wielu."
  tags: []
"Rz5,16":
  text: "I nie tak, jak z powodu jednego, który zgrzeszył, jest z tym darem. Bo prawdziwie sąd jest za jeden upadek ku potępieniu, ale dar łaski za wiele upadków ku sprawiedliwości."
  tags: []
"Rz5,17":
  text: "Albowiem jeśli przez upadek jednego, śmierć zakrólowała z powodu jednego, o wiele bardziej ci, którzy otrzymują obfitość łaski i dar sprawiedliwości, w życiu królować będą z powodu jednego, Jezusa Chrystusa."
  tags: []
"Rz5,18":
  text: "A zatem, jak przez upadek jednego na wszystkich ludzi przyszło potępienie, tak też przez jeden sprawiedliwy czyn na wszystkich ludzi przyszło usprawiedliwienie ku życiu."
  tags: []
"Rz5,19":
  text: "Bo tak, jak przez nieposłuszeństwo jednego człowieka, wielu stało się grzesznikami, tak przez posłuszeństwo jednego, wielu stanie się sprawiedliwymi."
  tags: []
"Rz5,20":
  text: "A Prawo weszło dodatkowo, by zaobfitował upadek; a gdzie zaobfitował grzech, tam łaska tym bardziej zaobfitowała;"
  tags: []
"Rz5,21":
  text: "Aby tak, jak grzech zakrólował w śmierci, tak i łaska zakrólowała za sprawą usprawiedliwienia ku życiu wiecznemu przez Jezusa Chrystusa, Pana naszego."
  tags: []
