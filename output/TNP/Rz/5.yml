"Rz5,1": "Będąc więc uznani za sprawiedliwych z wiary, pokój mamy z Bogiem przez Pana naszego Jezusa Chrystusa,"
"Rz5,2": "Przez którego też otrzymaliśmy dostęp przez wiarę do tej łaski, w której stanęliśmy i chlubimy się z powodu nadziei chwały Boga."
"Rz5,3": "A nie tylko to, ale chlubimy się w uciskach, wiedząc, że ucisk sprawia wytrwałość,"
"Rz5,4": "A wytrwałość doświadczenie, a doświadczenie nadzieję,"
"Rz5,5": "A nadzieja nie zawstydza, bo miłość Boża jest wylewana na nasze serca przez Ducha Świętego, który został nam dany."
"Rz5,6": "Chrystus bowiem umarł we właściwym czasie za nas bezbożnych, gdy jeszcze byliśmy bezsilni."
"Rz5,7": "Z trudnością bowiem umrze ktoś za sprawiedliwego; za dobrego może ktoś odważa się umrzeć."
"Rz5,8": "Lecz Bóg dowodzi swojej miłości wobec nas, że gdy jeszcze byliśmy grzesznikami, Chrystus umarł za nas."
"Rz5,9": "O wiele bardziej więc, będąc teraz uznani za sprawiedliwych przez Jego krew, zostaniemy przez Niego zbawieni od gniewu."
"Rz5,10": "Bo jeżeli, będąc nieprzyjaciółmi, zostaliśmy pojednani z Bogiem przez śmierć Jego Syna, o wiele bardziej będąc pojednani, zostaniemy zbawieni przez Jego życie."
"Rz5,11": "A nie tylko to, ale też chlubimy się w Bogu przez Pana naszego Jezusa Chrystusa, przez którego teraz otrzymaliśmy pojednanie."
"Rz5,12": "Dlatego, tak jak przez jednego człowieka grzech wszedł na świat, a przez grzech śmierć, tak i na wszystkich ludzi przeszła śmierć, za to, że wszyscy zgrzeszyli."
"Rz5,13": "Bo aż do Prawa grzech był na świecie; ale grzech nie jest zaliczany, gdy nie ma Prawa."
"Rz5,14": "Lecz śmierć zakrólowała od Adama aż do Mojżesza nawet nad tymi, którzy nie zgrzeszyli na podobieństwo przestępstwa Adama, będącego typem Tego, który miał przyjść."
"Rz5,15": "Ale nie tak jest z upadkiem, jak z darem łaski; jeśli bowiem z powodu jednego upadku wielu umarło, o wiele bardziej łaska Boża i dar w tej łasce jednego człowieka, Jezusa Chrystusa, zaobfitowała dla wielu."
"Rz5,16": "I nie tak, jak z powodu jednego, który zgrzeszył, jest z tym darem. Bo prawdziwie sąd jest za jeden upadek ku potępieniu, ale dar łaski za wiele upadków ku sprawiedliwości."
"Rz5,17": "Albowiem jeśli przez upadek jednego, śmierć zakrólowała z powodu jednego, o wiele bardziej ci, którzy otrzymują obfitość łaski i dar sprawiedliwości, w życiu królować będą z powodu jednego, Jezusa Chrystusa."
"Rz5,18": "A zatem, jak przez upadek jednego na wszystkich ludzi przyszło potępienie, tak też przez jeden sprawiedliwy czyn na wszystkich ludzi przyszło usprawiedliwienie ku życiu."
"Rz5,19": "Bo tak, jak przez nieposłuszeństwo jednego człowieka, wielu stało się grzesznikami, tak przez posłuszeństwo jednego, wielu stanie się sprawiedliwymi."
"Rz5,20": "A Prawo weszło dodatkowo, by zaobfitował upadek; a gdzie zaobfitował grzech, tam łaska tym bardziej zaobfitowała;"
"Rz5,21": "Aby tak, jak grzech zakrólował w śmierci, tak i łaska zakrólowała za sprawą usprawiedliwienia ku życiu wiecznemu przez Jezusa Chrystusa, Pana naszego."
