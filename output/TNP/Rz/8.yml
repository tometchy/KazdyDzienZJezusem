"Rz8,1":
  text: "Dlatego teraz nie ma żadnego potępienia dla tych, którzy są w Chrystusie Jezusie, którzy chodzą, nie według ciała, ale według Ducha."
  tags: []
"Rz8,2":
  text: "Albowiem prawo Ducha, życiem w Chrystusie Jezusie, uwolniło mnie od prawa grzechu i śmierci."
  tags: []
"Rz8,3":
  text: "Bo niemoc, na którą niedomagało Prawo z powodu ciała, Bóg przezwyciężył, posyłając swojego Syna w podobieństwie grzesznego ciała, jako ofiarę za grzech, potępił grzech w ciele,"
  tags: []
"Rz8,4":
  text: "Aby sprawiedliwa norma Prawa została wypełniona w nas, którzy chodzimy, nie według ciała, ale według Ducha."
  tags: []
"Rz8,5":
  text: "Albowiem ci, którzy są według ciała, myślą o tym, co cielesne; ale ci, którzy są według Ducha, myślą o tym, co duchowe."
  tags: []
"Rz8,6":
  text: "Gdyż zamysł ciała to śmierć; ale zamysł Ducha to życie i pokój,"
  tags: []
"Rz8,7":
  text: "Dlatego że zamysł ciała jest wrogi Bogu, gdyż nie jest poddany Prawu Bożemu, bo i nie może."
  tags: []
"Rz8,8":
  text: "Ci bowiem, którzy są w ciele, Bogu podobać się nie mogą."
  tags: []
"Rz8,9":
  text: "Lecz wy nie jesteście w ciele, ale w Duchu, skoro Duch Boży mieszka w was; a jeśli ktoś nie ma Ducha Chrystusa, ten nie jest Jego."
  tags: []
"Rz8,10":
  text: "A jeśli Chrystus jest w was, wtedy ciało istotnie jest martwe z powodu grzechu, ale Duch jest życiem z powodu sprawiedliwości."
  tags: []
"Rz8,11":
  text: "Jeśli natomiast Duch Tego, który Jezusa wzbudził z martwych, mieszka w was, to Ten, który wzbudził Chrystusa z martwych, ożywi i śmiertelne ciała wasze przez swojego Ducha, który w was mieszka."
  tags: []
"Rz8,12":
  text: "A tak, bracia, nie jesteśmy dłużnikami ciała, abyśmy żyli według ciała."
  tags: []
"Rz8,13":
  text: "Jeśli bowiem żyjecie według ciała, macie umierać; natomiast jeśli Duchem doprowadzacie do śmierci działania ciała, będziecie żyć."
  tags: []
"Rz8,14":
  text: "Bo ci, którzy dają się prowadzić przez Ducha Bożego, ci są synami Boga."
  tags: []
"Rz8,15":
  text: "Bo nie wzięliście ducha niewoli, by znowu żyć w zastraszeniu, ale wzięliście ducha usynowienia, przez którego wykrzykujemy: Abba, Drogi Ojcze!"
  tags: []
"Rz8,16":
  text: "Ten to Duch współświadczy z naszym duchem, że jesteśmy dziećmi Boga."
  tags: []
"Rz8,17":
  text: "A jeśli dziećmi, to i dziedzicami, dziedzicami Boga, a współdziedzicami Chrystusa, skoro współcierpimy, byśmy też wspólnie zostali wprowadzeni do chwały."
  tags: []
"Rz8,18":
  text: "Sądzę bowiem, że utrapienia teraźniejszego czasu nie są godne porównania z tą chwałą, która ma się w nas objawić."
  tags: []
"Rz8,19":
  text: "Bo stworzenie żarliwie oczekuje objawienia synów Boga."
  tags: []
"Rz8,20":
  text: "Gdyż stworzenie zostało poddane marności, nie dobrowolnie, ale z powodu Tego, który je poddał, w nadziei,"
  tags: []
"Rz8,21":
  text: "Że i samo stworzenie zostanie uwolnione z niewoli skażenia do wolności chwały dzieci Boga."
  tags: []
"Rz8,22":
  text: "Bo wiemy, że całe stworzenie współwzdycha i współcierpi w bólach porodowych aż do teraz."
  tags: []
"Rz8,23":
  text: "A nie tylko ono, ale i my sami, którzy mamy pierwocinę Ducha, i my sami w sobie wzdychamy oczekując usynowienia, odkupienia naszego ciała."
  tags: []
"Rz8,24":
  text: "Albowiem w tej nadziei zostaliśmy zbawieni. A nadzieja widzialna nie jest nadzieją; bo ktoś, kto widzi, po co ma mieć nadzieję?"
  tags: []
"Rz8,25":
  text: "Ale jeśli mamy nadzieję na to, czego nie widzimy, to oczekujemy tego z wytrwałością."
  tags: []
"Rz8,26":
  text: "A tak samo i Duch wspomaga nas w naszych słabościach. Nie wiemy bowiem, o co mielibyśmy się modlić, tak jak należy; ale sam Duch wstawia się za nami w niewysłowionych westchnieniach."
  tags: []
"Rz8,27":
  text: "A Ten, który bada serca wie, jaki jest zamysł Ducha, ponieważ zgodnie z wolą Boga wstawia się za świętymi."
  tags: []
"Rz8,28":
  text: "A wiemy, że z tymi, którzy miłują Boga, wszystko współpracuje ku dobremu, to jest z tymi, którzy według Jego postanowienia są powołani."
  tags: []
"Rz8,29":
  text: "Bo tych, których wcześniej znał, tych też przeznaczył, aby byli ukształtowani na obraz Jego Syna, aby On był pierworodnym wśród wielu braci."
  tags: []
"Rz8,30":
  text: "A których przeznaczył, tych i powołał; a których powołał, tych i uznał za sprawiedliwych; a których uznał za sprawiedliwych, tych i wprowadził do chwały."
  tags: []
"Rz8,31":
  text: "Cóż więc na to powiemy? Jeśli Bóg za nami, kto jest przeciwko nam?"
  tags: []
"Rz8,32":
  text: "On, który nie oszczędził nawet własnego Syna, ale Go za nas wszystkich wydał, jakżeby wraz z Nim nie darował nam wszystkiego?"
  tags: []
"Rz8,33":
  text: "Kto będzie wnosił oskarżenie przeciwko wybranym Boga? Bóg, który usprawiedliwia?"
  tags: []
"Rz8,34":
  text: "Kto potępia? Chrystus, który umarł, więcej, który został wskrzeszony, który jest po prawicy Boga? On wstawia się za nami."
  tags: []
"Rz8,35":
  text: "Kto nas odłączy od miłości Chrystusa? Czy utrapienie? Czy ucisk? Czy prześladowanie? Czy głód? Czy nagość? Czy niebezpieczeństwo? Czy miecz?"
  tags: []
"Rz8,36":
  text: "Tak, jak jest napisane: Z powodu Ciebie cały dzień jesteśmy uśmiercani, zostaliśmy policzeni jak owce na rzeź."
  tags: []
"Rz8,37":
  text: "Lecz w tym wszystkim odnosimy całkowite zwycięstwo przez Tego, który nas umiłował."
  tags: []
"Rz8,38":
  text: "Albowiem jestem tego pewien, że ani śmierć, ani życie, ani aniołowie, ani władcy, ani moce, ani to, co nastało, ani to, co ma nastąpić,"
  tags: []
"Rz8,39":
  text: "Ani wysokość, ani głębokość, ani jakiekolwiek inne stworzenie nie będzie mogło odłączyć nas od tej miłości Boga, która jest w Chrystusie Jezusie, Panu naszym."
  tags: []
