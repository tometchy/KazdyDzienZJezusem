"Rz8,1": "Dlatego teraz nie ma żadnego potępienia dla tych, którzy są w Chrystusie Jezusie, którzy chodzą, nie według ciała, ale według Ducha."
"Rz8,2": "Albowiem prawo Ducha, życiem w Chrystusie Jezusie, uwolniło mnie od prawa grzechu i śmierci."
"Rz8,3": "Bo niemoc, na którą niedomagało Prawo z powodu ciała, Bóg przezwyciężył, posyłając swojego Syna w podobieństwie grzesznego ciała, jako ofiarę za grzech, potępił grzech w ciele,"
"Rz8,4": "Aby sprawiedliwa norma Prawa została wypełniona w nas, którzy chodzimy, nie według ciała, ale według Ducha."
"Rz8,5": "Albowiem ci, którzy są według ciała, myślą o tym, co cielesne; ale ci, którzy są według Ducha, myślą o tym, co duchowe."
"Rz8,6": "Gdyż zamysł ciała to śmierć; ale zamysł Ducha to życie i pokój,"
"Rz8,7": "Dlatego że zamysł ciała jest wrogi Bogu, gdyż nie jest poddany Prawu Bożemu, bo i nie może."
"Rz8,8": "Ci bowiem, którzy są w ciele, Bogu podobać się nie mogą."
"Rz8,9": "Lecz wy nie jesteście w ciele, ale w Duchu, skoro Duch Boży mieszka w was; a jeśli ktoś nie ma Ducha Chrystusa, ten nie jest Jego."
"Rz8,10": "A jeśli Chrystus jest w was, wtedy ciało istotnie jest martwe z powodu grzechu, ale Duch jest życiem z powodu sprawiedliwości."
"Rz8,11": "Jeśli natomiast Duch Tego, który Jezusa wzbudził z martwych, mieszka w was, to Ten, który wzbudził Chrystusa z martwych, ożywi i śmiertelne ciała wasze przez swojego Ducha, który w was mieszka."
"Rz8,12": "A tak, bracia, nie jesteśmy dłużnikami ciała, abyśmy żyli według ciała."
"Rz8,13": "Jeśli bowiem żyjecie według ciała, macie umierać; natomiast jeśli Duchem doprowadzacie do śmierci działania ciała, będziecie żyć."
"Rz8,14": "Bo ci, którzy dają się prowadzić przez Ducha Bożego, ci są synami Boga."
"Rz8,15": "Bo nie wzięliście ducha niewoli, by znowu żyć w zastraszeniu, ale wzięliście ducha usynowienia, przez którego wykrzykujemy: Abba, Drogi Ojcze!"
"Rz8,16": "Ten to Duch współświadczy z naszym duchem, że jesteśmy dziećmi Boga."
"Rz8,17": "A jeśli dziećmi, to i dziedzicami, dziedzicami Boga, a współdziedzicami Chrystusa, skoro współcierpimy, byśmy też wspólnie zostali wprowadzeni do chwały."
"Rz8,18": "Sądzę bowiem, że utrapienia teraźniejszego czasu nie są godne porównania z tą chwałą, która ma się w nas objawić."
"Rz8,19": "Bo stworzenie żarliwie oczekuje objawienia synów Boga."
"Rz8,20": "Gdyż stworzenie zostało poddane marności, nie dobrowolnie, ale z powodu Tego, który je poddał, w nadziei,"
"Rz8,21": "Że i samo stworzenie zostanie uwolnione z niewoli skażenia do wolności chwały dzieci Boga."
"Rz8,22": "Bo wiemy, że całe stworzenie współwzdycha i współcierpi w bólach porodowych aż do teraz."
"Rz8,23": "A nie tylko ono, ale i my sami, którzy mamy pierwocinę Ducha, i my sami w sobie wzdychamy oczekując usynowienia, odkupienia naszego ciała."
"Rz8,24": "Albowiem w tej nadziei zostaliśmy zbawieni. A nadzieja widzialna nie jest nadzieją; bo ktoś, kto widzi, po co ma mieć nadzieję?"
"Rz8,25": "Ale jeśli mamy nadzieję na to, czego nie widzimy, to oczekujemy tego z wytrwałością."
"Rz8,26": "A tak samo i Duch wspomaga nas w naszych słabościach. Nie wiemy bowiem, o co mielibyśmy się modlić, tak jak należy; ale sam Duch wstawia się za nami w niewysłowionych westchnieniach."
"Rz8,27": "A Ten, który bada serca wie, jaki jest zamysł Ducha, ponieważ zgodnie z wolą Boga wstawia się za świętymi."
"Rz8,28": "A wiemy, że z tymi, którzy miłują Boga, wszystko współpracuje ku dobremu, to jest z tymi, którzy według Jego postanowienia są powołani."
"Rz8,29": "Bo tych, których wcześniej znał, tych też przeznaczył, aby byli ukształtowani na obraz Jego Syna, aby On był pierworodnym wśród wielu braci."
"Rz8,30": "A których przeznaczył, tych i powołał; a których powołał, tych i uznał za sprawiedliwych; a których uznał za sprawiedliwych, tych i wprowadził do chwały."
"Rz8,31": "Cóż więc na to powiemy? Jeśli Bóg za nami, kto jest przeciwko nam?"
"Rz8,32": "On, który nie oszczędził nawet własnego Syna, ale Go za nas wszystkich wydał, jakżeby wraz z Nim nie darował nam wszystkiego?"
"Rz8,33": "Kto będzie wnosił oskarżenie przeciwko wybranym Boga? Bóg, który usprawiedliwia?"
"Rz8,34": "Kto potępia? Chrystus, który umarł, więcej, który został wskrzeszony, który jest po prawicy Boga? On wstawia się za nami."
"Rz8,35": "Kto nas odłączy od miłości Chrystusa? Czy utrapienie? Czy ucisk? Czy prześladowanie? Czy głód? Czy nagość? Czy niebezpieczeństwo? Czy miecz?"
"Rz8,36": "Tak, jak jest napisane: Z powodu Ciebie cały dzień jesteśmy uśmiercani, zostaliśmy policzeni jak owce na rzeź."
"Rz8,37": "Lecz w tym wszystkim odnosimy całkowite zwycięstwo przez Tego, który nas umiłował."
"Rz8,38": "Albowiem jestem tego pewien, że ani śmierć, ani życie, ani aniołowie, ani władcy, ani moce, ani to, co nastało, ani to, co ma nastąpić,"
"Rz8,39": "Ani wysokość, ani głębokość, ani jakiekolwiek inne stworzenie nie będzie mogło odłączyć nas od tej miłości Boga, która jest w Chrystusie Jezusie, Panu naszym."
