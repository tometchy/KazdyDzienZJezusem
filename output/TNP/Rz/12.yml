"Rz12,1":
  text: "Wzywam więc was, bracia, przez miłosierdzie Boga, abyście stawili swoje ciała jako ofiarę żywą, świętą, przyjemną Bogu, tę rozumną służbę waszą."
  tags: []
"Rz12,2":
  text: "I nie upodabniajcie się do tego wieku, ale dajcie się przemieniać przez odnowienie waszego myślenia, abyście doświadczyli jaka jest wola Boża, co dobre, przyjemne i doskonałe."
  tags: []
"Rz12,3":
  text: "Bo przez daną mi łaskę mówię każdemu będącemu spośród was: Nie myślcie ponad miarę o sobie, ponad to, co konieczne jest by rozumieć, lecz myślcie rozsądnie, według miary wiary, jaką Bóg każdemu przydzielił."
  tags: []
"Rz12,4":
  text: "Albowiem tak, jak w jednym ciele mamy wiele członków, lecz nie wszystkie członki mają te same działanie,"
  tags: []
"Rz12,5":
  text: "Tak wielu nas, a jesteśmy jednym ciałem w Chrystusie, a zgodnie z tym jesteśmy jedni drugich członkami."
  tags: []
"Rz12,6":
  text: "Mamy więc różne dary łaski, według łaski nam darowanej: Czy to prorokowanie, to proporcjonalnie do tej wiary;"
  tags: []
"Rz12,7":
  text: "Czy to służbę, to w służbie; czy ktoś naucza, to w nauce;"
  tags: []
"Rz12,8":
  text: "Czy gdy ktoś zachęca, to w zachęcie; jeśli ktoś się dzieli, to w szczerości; jeśli ktoś przewodzi, to w gorliwości; jeśli ktoś jest miłosierny, to z radością."
  tags: []
"Rz12,9":
  text: "Miłość niech będzie nieobłudna; brzydźcie się złym, lgnijcie do dobrego."
  tags: []
"Rz12,10":
  text: "Miłością braterską jedni drugich miłujcie czule, jedni drugich wyprzedzajcie w okazywaniu szacunku."
  tags: []
"Rz12,11":
  text: "W gorliwości nieopieszali, płonący duchem, Panu służący,"
  tags: []
"Rz12,12":
  text: "Radośni nadzieją, w ucisku wytrwali, w modlitwie trwający niezłomnie,"
  tags: []
"Rz12,13":
  text: "Miejcie udział w potrzebach świętych, prześcigajcie się w gościnności."
  tags: []
"Rz12,14":
  text: "Dobrze życzcie tym, którzy was prześladują, dobrze życzcie, a nie przeklinajcie."
  tags: []
"Rz12,15":
  text: "Weselcie się z weselącymi, a płaczcie z płaczącymi."
  tags: []
"Rz12,16":
  text: "Bądźcie wobec siebie tej samej myśli; nie rozumiejcie o sobie wyniośle, ale przystawajcie do pokornych; nie stawajcie się rozumni we własnych oczach."
  tags: []
"Rz12,17":
  text: "Nikomu złem za złe nie oddawajcie, troszcząc się o to, co dobre wobec wszystkich ludzi."
  tags: []
"Rz12,18":
  text: "Jeśli można, o ile to od was zależy, ze wszystkimi ludźmi zachowujcie pokój."
  tags: []
"Rz12,19":
  text: "Nie mścijcie się sami, umiłowani, ale dajcie miejsce gniewowi Bożemu; albowiem jest napisane: Pomsta do mnie należy, Ja odpłacę, mówi PAN."
  tags: []
"Rz12,20":
  text: "Jeśli więc twój nieprzyjaciel jest głodny, nakarm go, jeśli pragnie, daj mu pić; bo to czyniąc, węgle rozpalone zgarniesz na jego głowę."
  tags: []
"Rz12,21":
  text: "Nie dawaj się zwyciężać złu, ale zło dobrem zwyciężaj."
  tags: []
