"Rz12,1": "Wzywam więc was, bracia, przez miłosierdzie Boga, abyście stawili swoje ciała jako ofiarę żywą, świętą, przyjemną Bogu, tę rozumną służbę waszą."
"Rz12,2": "I nie upodabniajcie się do tego wieku, ale dajcie się przemieniać przez odnowienie waszego myślenia, abyście doświadczyli jaka jest wola Boża, co dobre, przyjemne i doskonałe."
"Rz12,3": "Bo przez daną mi łaskę mówię każdemu będącemu spośród was: Nie myślcie ponad miarę o sobie, ponad to, co konieczne jest by rozumieć, lecz myślcie rozsądnie, według miary wiary, jaką Bóg każdemu przydzielił."
"Rz12,4": "Albowiem tak, jak w jednym ciele mamy wiele członków, lecz nie wszystkie członki mają te same działanie,"
"Rz12,5": "Tak wielu nas, a jesteśmy jednym ciałem w Chrystusie, a zgodnie z tym jesteśmy jedni drugich członkami."
"Rz12,6": "Mamy więc różne dary łaski, według łaski nam darowanej: Czy to prorokowanie, to proporcjonalnie do tej wiary;"
"Rz12,7": "Czy to służbę, to w służbie; czy ktoś naucza, to w nauce;"
"Rz12,8": "Czy gdy ktoś zachęca, to w zachęcie; jeśli ktoś się dzieli, to w szczerości; jeśli ktoś przewodzi, to w gorliwości; jeśli ktoś jest miłosierny, to z radością."
"Rz12,9": "Miłość niech będzie nieobłudna; brzydźcie się złym, lgnijcie do dobrego."
"Rz12,10": "Miłością braterską jedni drugich miłujcie czule, jedni drugich wyprzedzajcie w okazywaniu szacunku."
"Rz12,11": "W gorliwości nieopieszali, płonący duchem, Panu służący,"
"Rz12,12": "Radośni nadzieją, w ucisku wytrwali, w modlitwie trwający niezłomnie,"
"Rz12,13": "Miejcie udział w potrzebach świętych, prześcigajcie się w gościnności."
"Rz12,14": "Dobrze życzcie tym, którzy was prześladują, dobrze życzcie, a nie przeklinajcie."
"Rz12,15": "Weselcie się z weselącymi, a płaczcie z płaczącymi."
"Rz12,16": "Bądźcie wobec siebie tej samej myśli; nie rozumiejcie o sobie wyniośle, ale przystawajcie do pokornych; nie stawajcie się rozumni we własnych oczach."
"Rz12,17": "Nikomu złem za złe nie oddawajcie, troszcząc się o to, co dobre wobec wszystkich ludzi."
"Rz12,18": "Jeśli można, o ile to od was zależy, ze wszystkimi ludźmi zachowujcie pokój."
"Rz12,19": "Nie mścijcie się sami, umiłowani, ale dajcie miejsce gniewowi Bożemu; albowiem jest napisane: Pomsta do mnie należy, Ja odpłacę, mówi PAN."
"Rz12,20": "Jeśli więc twój nieprzyjaciel jest głodny, nakarm go, jeśli pragnie, daj mu pić; bo to czyniąc, węgle rozpalone zgarniesz na jego głowę."
"Rz12,21": "Nie dawaj się zwyciężać złu, ale zło dobrem zwyciężaj."
