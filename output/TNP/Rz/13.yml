"Rz13,1":
  text: "Każda dusza niech się podporządkowuje władzom zwierzchnim; bo nie ma władzy, jak tylko od Boga; a te władze, które są, przez Boga są wyznaczone."
  tags: []
"Rz13,2":
  text: "Dlatego, kto sprzeciwia się władzy, sprzeciwia się Bożemu rozporządzeniu; a ci, którzy sprzeciwiają się, sami na siebie przyjmują wyrok."
  tags: []
"Rz13,3":
  text: "Albowiem przywódcy nie są postrachem dla dobrych czynów, ale dla złych. Chcesz się nie bać władzy? Czyń dobrze, a będziesz miał od niej pochwałę."
  tags: []
"Rz13,4":
  text: "Bowiem jest sługą Boga tobie ku dobremu. Ale jeśli czynisz zło, bój się; bo nie bez powodu nosi miecz, gdyż jest sługą Boga, który karze w gniewie tego, który czyni źle."
  tags: []
"Rz13,5":
  text: "Dlatego koniecznie trzeba być jej poddanym, nie tylko z powodu gniewu, lecz także z powodu sumienia."
  tags: []
"Rz13,6":
  text: "Dlatego bowiem płacicie podatki, bo oni są sługami Boga, właśnie po to, aby w tym trwać."
  tags: []
"Rz13,7":
  text: "Oddawajcie więc każdemu to, co powinniście: Komu podatek, podatek; komu cło, cło; komu respekt, respekt; komu szacunek, szacunek."
  tags: []
"Rz13,8":
  text: "Nikomu nie bądźcie nic winni, oprócz wzajemnej miłości; bo kto miłuje drugiego, wypełnił Prawo."
  tags: []
"Rz13,9":
  text: "Gdyż to: Nie będziesz cudzołożył, nie będziesz mordował, nie będziesz kradł, nie będziesz składał fałszywego świadectwa, nie będziesz pożądał, i jeśli jest jakieś inne przykazanie, w tym słowie się sumują, to znaczy: Będziesz miłował swojego bliźniego, jak samego siebie."
  tags: []
"Rz13,10":
  text: "Miłość nie czyni bliźniemu nic złego; wypełnieniem więc Prawa jest miłość."
  tags: []
"Rz13,11":
  text: "A to wiedząc, że już czas, że nadeszła nasza godzina, abyśmy już zostali wzbudzeni ze snu; bo teraz bliżej jest nasze zbawienie, niż kiedy uwierzyliśmy."
  tags: []
"Rz13,12":
  text: "Noc posunęła się naprzód, a dzień się przybliżył; odłóżmy więc uczynki ciemności, a obleczmy się w zbroję światłości."
  tags: []
"Rz13,13":
  text: "Chodźmy godnie jak za dnia, nie w hulankach i pijaństwach, nie w rozwiązłości i rozpustach, nie w kłótni i zazdrości."
  tags: []
"Rz13,14":
  text: "Ale obleczcie się w Pana Jezusa Chrystusa, a nie czyńcie starania o ciało ze względu na pożądliwość."
  tags: []
