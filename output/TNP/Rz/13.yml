"Rz13,1": "Każda dusza niech się podporządkowuje władzom zwierzchnim; bo nie ma władzy, jak tylko od Boga; a te władze, które są, przez Boga są wyznaczone."
"Rz13,2": "Dlatego, kto sprzeciwia się władzy, sprzeciwia się Bożemu rozporządzeniu; a ci, którzy sprzeciwiają się, sami na siebie przyjmują wyrok."
"Rz13,3": "Albowiem przywódcy nie są postrachem dla dobrych czynów, ale dla złych. Chcesz się nie bać władzy? Czyń dobrze, a będziesz miał od niej pochwałę."
"Rz13,4": "Bowiem jest sługą Boga tobie ku dobremu. Ale jeśli czynisz zło, bój się; bo nie bez powodu nosi miecz, gdyż jest sługą Boga, który karze w gniewie tego, który czyni źle."
"Rz13,5": "Dlatego koniecznie trzeba być jej poddanym, nie tylko z powodu gniewu, lecz także z powodu sumienia."
"Rz13,6": "Dlatego bowiem płacicie podatki, bo oni są sługami Boga, właśnie po to, aby w tym trwać."
"Rz13,7": "Oddawajcie więc każdemu to, co powinniście: Komu podatek, podatek; komu cło, cło; komu respekt, respekt; komu szacunek, szacunek."
"Rz13,8": "Nikomu nie bądźcie nic winni, oprócz wzajemnej miłości; bo kto miłuje drugiego, wypełnił Prawo."
"Rz13,9": "Gdyż to: Nie będziesz cudzołożył, nie będziesz mordował, nie będziesz kradł, nie będziesz składał fałszywego świadectwa, nie będziesz pożądał, i jeśli jest jakieś inne przykazanie, w tym słowie się sumują, to znaczy: Będziesz miłował swojego bliźniego, jak samego siebie."
"Rz13,10": "Miłość nie czyni bliźniemu nic złego; wypełnieniem więc Prawa jest miłość."
"Rz13,11": "A to wiedząc, że już czas, że nadeszła nasza godzina, abyśmy już zostali wzbudzeni ze snu; bo teraz bliżej jest nasze zbawienie, niż kiedy uwierzyliśmy."
"Rz13,12": "Noc posunęła się naprzód, a dzień się przybliżył; odłóżmy więc uczynki ciemności, a obleczmy się w zbroję światłości."
"Rz13,13": "Chodźmy godnie jak za dnia, nie w hulankach i pijaństwach, nie w rozwiązłości i rozpustach, nie w kłótni i zazdrości."
"Rz13,14": "Ale obleczcie się w Pana Jezusa Chrystusa, a nie czyńcie starania o ciało ze względu na pożądliwość."
