"Rz11,1": "Mówię więc: Czy Bóg odepchnął od siebie swój lud? Z pewnością nie; albowiem i ja jestem Izraelitą, z potomstwa Abrahama, z pokolenia Beniamina."
"Rz11,2": "Nie odepchnął od siebie Bóg swojego ludu, który wcześniej poznał. Czy nie wiecie, co mówi Pismo o Eliaszu? Jak zwraca się do Boga przeciwko Izraelowi, mówiąc:"
"Rz11,3": "PANIE! Proroków Twoich zabili, ołtarze Twoje zburzyli i zostałem pozostawiony tylko ja sam, i szukają mojej duszy."
"Rz11,4": "Ale co mówi do niego Boża odpowiedź? Zostawiłem sobie siedem tysięcy mężów, którzy nie zgięli kolana przed Baalem."
"Rz11,5": "Tak więc i teraz, w tym czasie pozostała resztka według wybrania z łaski."
"Rz11,6": "A jeśli z łaski, to już nie z uczynków, inaczej taka łaska już nie byłaby łaską; a jeśli z uczynków, to już nie z łaski, gdyż taki uczynek nie byłby już uczynkiem."
"Rz11,7": "Cóż więc? Czego Izrael poszukuje, tego nie osiągnął; ale wybrani osiągnęli, a inni zostali zatwardzeni."
"Rz11,8": "Tak, jak jest napisane: Dał im Bóg ducha głębokiego snu: oczy, aby nie widzieli i uszy, aby nie słyszeli, aż do dzisiejszego dnia."
"Rz11,9": "A Dawid mówi: Niech stół ich stanie się im sidłem i pułapką, i potrzaskiem, i odpłatą;"
"Rz11,10": "Niech ich oczy zostaną zaćmione, aby nie widzieli, a ich grzbiet na zawsze zegnij."
"Rz11,11": "Mówię więc: Czy potknęli się, aby upaść? Z pewnością nie; ale z powodu ich odstępstwa zbawienie objęło pogan, aby ich pobudzić do zazdrości."
"Rz11,12": "Jeżeli natomiast ich odstępstwo jest bogactwem świata, a ich porażka bogactwem pogan, o ile bardziej ich pełnia?"
"Rz11,13": "Albowiem mówię wam poganom: Na ile ja jestem istotnie apostołem pogan, chlubię się moją służbą,"
"Rz11,14": "Obym jakoś do zazdrości pobudził tych, którzy są moimi rodakami i zbawił niektórych z nich."
"Rz11,15": "Jeśli bowiem ich odrzucenie jest pojednaniem świata, to czym ich przyjęcie, jeśli nie życiem powstałym z martwych?"
"Rz11,16": "A jeśli pierwocina jest święta, to i ciasto; i jeśli korzeń jest święty, to i gałęzie."
"Rz11,17": "A jeśli niektóre z gałęzi zostały odłamane, a ty, będąc z dzikiego drzewa oliwnego, zostałeś wszczepiony pomiędzy nich i stałeś się współuczestnikiem korzenia i tłustości drzewa oliwnego,"
"Rz11,18": "Nie chlub się nad gałęzie; bo jeżeli chlubisz się, to wiedz, że nie ty nosisz korzeń, ale korzeń ciebie."
"Rz11,19": "Powiesz więc: Odłamane zostały gałęzie, abym ja został wszczepiony."
"Rz11,20": "Dobrze, z powodu niewiary zostały odłamane, ale ty stanąłeś w wierze; nie bądź pyszny, ale się bój."
"Rz11,21": "Albowiem jeśli Bóg nie oszczędził naturalnych gałęzi, mógłby i czasem ciebie nie oszczędzić."
"Rz11,22": "Zobacz więc dobroć i surowość Boga, surowość wobec tych, którzy upadli, a dobroć wobec ciebie, jeślibyś utrzymał się w dobroci; skoro i ty możesz zostać odcięty."
"Rz11,23": "Ale i oni, jeśli nie będą trwali w niewierze, zostaną wszczepieni, gdyż Bóg jest mocny ponownie ich wszczepić."
"Rz11,24": "Bo jeśli ty jesteś odcięty z drzewa oliwnego, dzikiego z natury, a wbrew naturze zostałeś wszczepiony w szlachetne drzewo oliwne, o ile bardziej ci, zgodnie z naturą, zostaną wszczepieni w swoje własne drzewo oliwne!"
"Rz11,25": "Bo nie chcę, bracia, abyście byli nieświadomi tej tajemnicy – żebyście we własnym mniemaniu nie uważali się za rozumnych – że zatwardziałość przyszła na część Izraela, aż do czasu, gdy wejdzie pełnia pogan."
"Rz11,26": "I w ten właśnie sposób będzie zbawiony cały Izrael, tak, jak jest napisane: Przyjdzie z Syjonu Ten, który ratuje i odwróci bezbożności od Jakuba."
"Rz11,27": "I takie będzie z nimi ode mnie przymierze, kiedy zabiorę od nich grzechy."
"Rz11,28": "Według Ewangelii istotnie są nieprzyjaciółmi z powodu was; lecz według wybrania są umiłowanymi z powodu ojców."
"Rz11,29": "Albowiem Bóg nie żałuje swoich darów łaski i powołania."
"Rz11,30": "Bo tak, jak i wy niegdyś byliście nieposłuszni Bogu, ale teraz doznaliście miłosierdzia z powodu ich nieposłuszeństwa,"
"Rz11,31": "Tak i oni teraz nie okazali posłuszeństwa, aby dla okazanego wam miłosierdzia i oni doznali miłosierdzia."
"Rz11,32": "Bowiem Bóg zamknął razem wszystkich w nieposłuszeństwie, aby zmiłować się nad wszystkimi."
"Rz11,33": "O głębio bogactwa i mądrości, i poznania Boga! Jak niezbadane są Jego sądy i niewyśledzone są Jego drogi!"
"Rz11,34": "Bo kto poznał myśl PANA? Lub kto stał się Jego doradcą?"
"Rz11,35": "Albo kto dał Mu najpierw coś i zostanie mu za to oddane w zamian?"
"Rz11,36": "Gdyż z Niego i przez Niego, i ku Niemu jest wszystko; Jemu chwała na wieki. Amen."
