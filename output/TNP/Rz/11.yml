"Rz11,1":
  text: "Mówię więc: Czy Bóg odepchnął od siebie swój lud? Z pewnością nie; albowiem i ja jestem Izraelitą, z potomstwa Abrahama, z pokolenia Beniamina."
  tags: []
"Rz11,2":
  text: "Nie odepchnął od siebie Bóg swojego ludu, który wcześniej poznał. Czy nie wiecie, co mówi Pismo o Eliaszu? Jak zwraca się do Boga przeciwko Izraelowi, mówiąc:"
  tags: []
"Rz11,3":
  text: "PANIE! Proroków Twoich zabili, ołtarze Twoje zburzyli i zostałem pozostawiony tylko ja sam, i szukają mojej duszy."
  tags: []
"Rz11,4":
  text: "Ale co mówi do niego Boża odpowiedź? Zostawiłem sobie siedem tysięcy mężów, którzy nie zgięli kolana przed Baalem."
  tags: []
"Rz11,5":
  text: "Tak więc i teraz, w tym czasie pozostała resztka według wybrania z łaski."
  tags: []
"Rz11,6":
  text: "A jeśli z łaski, to już nie z uczynków, inaczej taka łaska już nie byłaby łaską; a jeśli z uczynków, to już nie z łaski, gdyż taki uczynek nie byłby już uczynkiem."
  tags: []
"Rz11,7":
  text: "Cóż więc? Czego Izrael poszukuje, tego nie osiągnął; ale wybrani osiągnęli, a inni zostali zatwardzeni."
  tags: []
"Rz11,8":
  text: "Tak, jak jest napisane: Dał im Bóg ducha głębokiego snu: oczy, aby nie widzieli i uszy, aby nie słyszeli, aż do dzisiejszego dnia."
  tags: []
"Rz11,9":
  text: "A Dawid mówi: Niech stół ich stanie się im sidłem i pułapką, i potrzaskiem, i odpłatą;"
  tags: []
"Rz11,10":
  text: "Niech ich oczy zostaną zaćmione, aby nie widzieli, a ich grzbiet na zawsze zegnij."
  tags: []
"Rz11,11":
  text: "Mówię więc: Czy potknęli się, aby upaść? Z pewnością nie; ale z powodu ich odstępstwa zbawienie objęło pogan, aby ich pobudzić do zazdrości."
  tags: []
"Rz11,12":
  text: "Jeżeli natomiast ich odstępstwo jest bogactwem świata, a ich porażka bogactwem pogan, o ile bardziej ich pełnia?"
  tags: []
"Rz11,13":
  text: "Albowiem mówię wam poganom: Na ile ja jestem istotnie apostołem pogan, chlubię się moją służbą,"
  tags: []
"Rz11,14":
  text: "Obym jakoś do zazdrości pobudził tych, którzy są moimi rodakami i zbawił niektórych z nich."
  tags: []
"Rz11,15":
  text: "Jeśli bowiem ich odrzucenie jest pojednaniem świata, to czym ich przyjęcie, jeśli nie życiem powstałym z martwych?"
  tags: []
"Rz11,16":
  text: "A jeśli pierwocina jest święta, to i ciasto; i jeśli korzeń jest święty, to i gałęzie."
  tags: []
"Rz11,17":
  text: "A jeśli niektóre z gałęzi zostały odłamane, a ty, będąc z dzikiego drzewa oliwnego, zostałeś wszczepiony pomiędzy nich i stałeś się współuczestnikiem korzenia i tłustości drzewa oliwnego,"
  tags: []
"Rz11,18":
  text: "Nie chlub się nad gałęzie; bo jeżeli chlubisz się, to wiedz, że nie ty nosisz korzeń, ale korzeń ciebie."
  tags: []
"Rz11,19":
  text: "Powiesz więc: Odłamane zostały gałęzie, abym ja został wszczepiony."
  tags: []
"Rz11,20":
  text: "Dobrze, z powodu niewiary zostały odłamane, ale ty stanąłeś w wierze; nie bądź pyszny, ale się bój."
  tags: []
"Rz11,21":
  text: "Albowiem jeśli Bóg nie oszczędził naturalnych gałęzi, mógłby i czasem ciebie nie oszczędzić."
  tags: []
"Rz11,22":
  text: "Zobacz więc dobroć i surowość Boga, surowość wobec tych, którzy upadli, a dobroć wobec ciebie, jeślibyś utrzymał się w dobroci; skoro i ty możesz zostać odcięty."
  tags: []
"Rz11,23":
  text: "Ale i oni, jeśli nie będą trwali w niewierze, zostaną wszczepieni, gdyż Bóg jest mocny ponownie ich wszczepić."
  tags: []
"Rz11,24":
  text: "Bo jeśli ty jesteś odcięty z drzewa oliwnego, dzikiego z natury, a wbrew naturze zostałeś wszczepiony w szlachetne drzewo oliwne, o ile bardziej ci, zgodnie z naturą, zostaną wszczepieni w swoje własne drzewo oliwne!"
  tags: []
"Rz11,25":
  text: "Bo nie chcę, bracia, abyście byli nieświadomi tej tajemnicy – żebyście we własnym mniemaniu nie uważali się za rozumnych – że zatwardziałość przyszła na część Izraela, aż do czasu, gdy wejdzie pełnia pogan."
  tags: []
"Rz11,26":
  text: "I w ten właśnie sposób będzie zbawiony cały Izrael, tak, jak jest napisane: Przyjdzie z Syjonu Ten, który ratuje i odwróci bezbożności od Jakuba."
  tags: []
"Rz11,27":
  text: "I takie będzie z nimi ode mnie przymierze, kiedy zabiorę od nich grzechy."
  tags: []
"Rz11,28":
  text: "Według Ewangelii istotnie są nieprzyjaciółmi z powodu was; lecz według wybrania są umiłowanymi z powodu ojców."
  tags: []
"Rz11,29":
  text: "Albowiem Bóg nie żałuje swoich darów łaski i powołania."
  tags: []
"Rz11,30":
  text: "Bo tak, jak i wy niegdyś byliście nieposłuszni Bogu, ale teraz doznaliście miłosierdzia z powodu ich nieposłuszeństwa,"
  tags: []
"Rz11,31":
  text: "Tak i oni teraz nie okazali posłuszeństwa, aby dla okazanego wam miłosierdzia i oni doznali miłosierdzia."
  tags: []
"Rz11,32":
  text: "Bowiem Bóg zamknął razem wszystkich w nieposłuszeństwie, aby zmiłować się nad wszystkimi."
  tags: []
"Rz11,33":
  text: "O głębio bogactwa i mądrości, i poznania Boga! Jak niezbadane są Jego sądy i niewyśledzone są Jego drogi!"
  tags: []
"Rz11,34":
  text: "Bo kto poznał myśl PANA? Lub kto stał się Jego doradcą?"
  tags: []
"Rz11,35":
  text: "Albo kto dał Mu najpierw coś i zostanie mu za to oddane w zamian?"
  tags: []
"Rz11,36":
  text: "Gdyż z Niego i przez Niego, i ku Niemu jest wszystko; Jemu chwała na wieki. Amen."
  tags: []
