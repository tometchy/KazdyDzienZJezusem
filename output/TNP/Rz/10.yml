"Rz10,1": "Bracia! Prawdziwie upodobanie mojego serca i prośba do Boga za Izraelem jest za ich zbawienie."
"Rz10,2": "Albowiem daję im świadectwo, że mają gorliwość dla Boga, ale niezgodną z właściwym poznaniem."
"Rz10,3": "Nie znając bowiem sprawiedliwości Bożej, a szukając ustanowienia własnej sprawiedliwości, nie podporządkowali się Bożej sprawiedliwości."
"Rz10,4": "Albowiem końcem Prawa jest Chrystus, aby uznać za sprawiedliwego każdego wierzącego."
"Rz10,5": "Mojżesz bowiem pisze o sprawiedliwości, która jest z Prawa: Człowiek, który je wykonał, będzie przez nie żyć."
"Rz10,6": "A sprawiedliwość, która jest z wiary, tak mówi: Nie mów w swoim sercu: Kto wstąpi do nieba? To jest, aby Chrystusa sprowadzić na dół;"
"Rz10,7": "Albo: Kto zstąpi do otchłani? To jest, aby Chrystusa wyprowadzić spośród umarłych."
"Rz10,8": "A co mówi Pismo? Blisko ciebie jest słowo, w twoich ustach i w twoim sercu. Jest to słowo wiary, które głosimy."
"Rz10,9": "Bo jeśli swoimi ustami wyznasz Jezusa Panem i uwierzysz w swoim sercu, że Bóg wzbudził Go z martwych, zostaniesz zbawiony."
"Rz10,10": "Albowiem sercem wierzy się ku sprawiedliwości, a ustami wyznaje się ku zbawieniu."
"Rz10,11": "Pismo bowiem mówi: Każdy, kto wierzy w Niego, nie zostanie zawstydzony."
"Rz10,12": "Bo nie ma rozróżnienia między Żydem, jak i Grekiem; bo jeden jest Pan wszystkich, wzbogacający wszystkich, którzy Go wzywają."
"Rz10,13": "Każdy bowiem, kto by wezwał imienia Pana, zostanie zbawiony."
"Rz10,14": "Jak więc wzywać będą Tego, w którego nie uwierzyli? A jak uwierzą w Tego, o którym nie usłyszeli? A jak usłyszą bez tego, który głosi?"
"Rz10,15": "Jak będą głosić, jeżeli nie zostaliby posłani? Tak, jak jest napisane: O jak piękne są nogi głoszących dobrą nowinę o pokoju, dobrą nowinę o tym, co dobre."
"Rz10,16": "Ale nie wszyscy okazali posłuszeństwo Ewangelii, Izajasz bowiem mówi: PANIE! Kto uwierzył naszej wieści?"
"Rz10,17": "Wiara więc jest ze słuchania, a słuchanie przez Słowo Boga."
"Rz10,18": "Ale mówię: Czy może nie usłyszeli? Przeciwnie, na całą ziemię rozszedł się ich głos i do krańców zamieszkałego świata ich słowa."
"Rz10,19": "Ale mówię: Czy może Izrael nie zrozumiał? Mojżesz pierwszy mówi: Ja was pobudzę do zazdrości przez tych, którzy nie są narodem, przez naród nierozumny pobudzę was do gniewu."
"Rz10,20": "A Izajasz nabiera śmiałości i mówi: Zostałem znaleziony przez tych, którzy mnie nie szukali, ujawniłem się tym, którzy się o mnie nie pytali."
"Rz10,21": "O Izraelu natomiast mówi: Cały dzień miałem wyciągnięte swoje ręce do ludu, który jest nieposłuszny i mówiący – nie."
