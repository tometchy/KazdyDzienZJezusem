"Rz10,1":
  text: "Bracia! Prawdziwie upodobanie mojego serca i prośba do Boga za Izraelem jest za ich zbawienie."
  tags: []
"Rz10,2":
  text: "Albowiem daję im świadectwo, że mają gorliwość dla Boga, ale niezgodną z właściwym poznaniem."
  tags: []
"Rz10,3":
  text: "Nie znając bowiem sprawiedliwości Bożej, a szukając ustanowienia własnej sprawiedliwości, nie podporządkowali się Bożej sprawiedliwości."
  tags: []
"Rz10,4":
  text: "Albowiem końcem Prawa jest Chrystus, aby uznać za sprawiedliwego każdego wierzącego."
  tags: []
"Rz10,5":
  text: "Mojżesz bowiem pisze o sprawiedliwości, która jest z Prawa: Człowiek, który je wykonał, będzie przez nie żyć."
  tags: []
"Rz10,6":
  text: "A sprawiedliwość, która jest z wiary, tak mówi: Nie mów w swoim sercu: Kto wstąpi do nieba? To jest, aby Chrystusa sprowadzić na dół;"
  tags: []
"Rz10,7":
  text: "Albo: Kto zstąpi do otchłani? To jest, aby Chrystusa wyprowadzić spośród umarłych."
  tags: []
"Rz10,8":
  text: "A co mówi Pismo? Blisko ciebie jest słowo, w twoich ustach i w twoim sercu. Jest to słowo wiary, które głosimy."
  tags: []
"Rz10,9":
  text: "Bo jeśli swoimi ustami wyznasz Jezusa Panem i uwierzysz w swoim sercu, że Bóg wzbudził Go z martwych, zostaniesz zbawiony."
  tags: []
"Rz10,10":
  text: "Albowiem sercem wierzy się ku sprawiedliwości, a ustami wyznaje się ku zbawieniu."
  tags: []
"Rz10,11":
  text: "Pismo bowiem mówi: Każdy, kto wierzy w Niego, nie zostanie zawstydzony."
  tags: []
"Rz10,12":
  text: "Bo nie ma rozróżnienia między Żydem, jak i Grekiem; bo jeden jest Pan wszystkich, wzbogacający wszystkich, którzy Go wzywają."
  tags: []
"Rz10,13":
  text: "Każdy bowiem, kto by wezwał imienia Pana, zostanie zbawiony."
  tags: []
"Rz10,14":
  text: "Jak więc wzywać będą Tego, w którego nie uwierzyli? A jak uwierzą w Tego, o którym nie usłyszeli? A jak usłyszą bez tego, który głosi?"
  tags: []
"Rz10,15":
  text: "Jak będą głosić, jeżeli nie zostaliby posłani? Tak, jak jest napisane: O jak piękne są nogi głoszących dobrą nowinę o pokoju, dobrą nowinę o tym, co dobre."
  tags: []
"Rz10,16":
  text: "Ale nie wszyscy okazali posłuszeństwo Ewangelii, Izajasz bowiem mówi: PANIE! Kto uwierzył naszej wieści?"
  tags: []
"Rz10,17":
  text: "Wiara więc jest ze słuchania, a słuchanie przez Słowo Boga."
  tags: []
"Rz10,18":
  text: "Ale mówię: Czy może nie usłyszeli? Przeciwnie, na całą ziemię rozszedł się ich głos i do krańców zamieszkałego świata ich słowa."
  tags: []
"Rz10,19":
  text: "Ale mówię: Czy może Izrael nie zrozumiał? Mojżesz pierwszy mówi: Ja was pobudzę do zazdrości przez tych, którzy nie są narodem, przez naród nierozumny pobudzę was do gniewu."
  tags: []
"Rz10,20":
  text: "A Izajasz nabiera śmiałości i mówi: Zostałem znaleziony przez tych, którzy mnie nie szukali, ujawniłem się tym, którzy się o mnie nie pytali."
  tags: []
"Rz10,21":
  text: "O Izraelu natomiast mówi: Cały dzień miałem wyciągnięte swoje ręce do ludu, który jest nieposłuszny i mówiący – nie."
  tags: []
