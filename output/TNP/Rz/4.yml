"Rz4,1": "Cóż więc powiemy, co znalazł Abraham, ojciec nasz według ciała?"
"Rz4,2": "Bo jeśli Abraham z uczynków został uznany za sprawiedliwego, ma się czym chlubić, ale nie u Boga."
"Rz4,3": "Bo co mówi Pismo? A Abraham uwierzył Bogu i zostało mu to policzone za sprawiedliwość."
"Rz4,4": "A pracującemu, zapłata nie jest policzona według łaski, ale według należności;"
"Rz4,5": "Temu natomiast, który nie pracuje, lecz wierzy w Tego, który czyni sprawiedliwym bezbożnego, jego wiara jest mu policzona za sprawiedliwość."
"Rz4,6": "Tak też i Dawid mówi o błogosławieństwie człowieka, któremu Bóg zalicza sprawiedliwość, niezależnie od uczynków:"
"Rz4,7": "Błogosławieni, którym zostały odpuszczone nieprawości i których grzechy zostały zakryte;"
"Rz4,8": "Błogosławiony mąż, któremu PAN rzeczywiście nie policzy grzechu."
"Rz4,9": "Czy zatem to błogosławieństwo jest tylko dla obrzezanych, czy też dla nieobrzezanych? Mówimy bowiem, że wiara została policzona Abrahamowi za sprawiedliwość."
"Rz4,10": "Jak więc została mu policzona? Gdy był przed obrzezaniem, czy po obrzezaniu? Nie był obrzezany, ale był przed obrzezaniem."
"Rz4,11": "I przyjął znak obrzezania jako pieczęć sprawiedliwości tej wiary, którą miał przed obrzezaniem, aby on był ojcem wszystkich wierzących nieobrzezanych, aby i im to zostało policzone za sprawiedliwość,"
"Rz4,12": "I także ojcem obrzezanych, nie tylko dla tych, którzy są obrzezani, ale i dla tych, którzy idą śladami wiary ojca naszego Abrahama, którą miał przed obrzezaniem."
"Rz4,13": "Bowiem nie przez prawo została dana obietnica Abrahamowi i jego potomstwu, że ma być dziedzicem świata, ale przez sprawiedliwość z wiary."
"Rz4,14": "Bo jeśli ci, którzy są z prawa, są dziedzicami, wtedy wiara stała się bez znaczenia, a obietnica stała się bezużyteczna;"
"Rz4,15": "Gdyż Prawo powoduje gniew; bo gdzie nie ma prawa, tam i nie ma przestępstwa."
"Rz4,16": "Dlatego z wiary dana była obietnica, aby była z łaski, i aby była zapewniona całemu potomstwu, nie tylko tym, którzy są z Prawa, ale i tym, którzy są z wiary Abrahama, ojca nas wszystkich,"
"Rz4,17": "Tak, jak jest napisane: Ojcem wielu narodów ustanowiłem cię przed Bogiem, któremu uwierzył, który ożywia umarłych, a to czego nie ma, powołuje by było."
"Rz4,18": "Abraham wbrew nadziei z powodu nadziei uwierzył, by stać się ojcem wielu narodów według tego, co jest powiedziane: Takie będzie twoje potomstwo;"
"Rz4,19": "I nie osłabł w wierze, i nie patrzył na swoje własne ciało, że jest już obumarłe, mając około stu lat, ani na obumarłe łono Sary."
"Rz4,20": "A wobec obietnicy Boga nie poddał się wątpliwościom wypływającym z niewiary, ale został umocniony wiarą i dał chwałę Bogu,"
"Rz4,21": "I będąc w pełni zapewnionym, że cokolwiek On obiecał, mocny jest i uczynić;"
"Rz4,22": "I dlatego zostało mu to policzone za sprawiedliwość."
"Rz4,23": "A to nie napisano jedynie dla niego, że mu to zostało policzone,"
"Rz4,24": "Ale i ze względu na nas, którym ma być to poczytywane, wierzącym w Tego, który wzbudził z martwych Jezusa, naszego Pana;"
"Rz4,25": "Który został wydany z powodu naszych występków i powstał z martwych dla naszego usprawiedliwienia."
