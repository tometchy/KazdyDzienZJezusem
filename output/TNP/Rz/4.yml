"Rz4,1":
  text: "Cóż więc powiemy, co znalazł Abraham, ojciec nasz według ciała?"
  tags: []
"Rz4,2":
  text: "Bo jeśli Abraham z uczynków został uznany za sprawiedliwego, ma się czym chlubić, ale nie u Boga."
  tags: []
"Rz4,3":
  text: "Bo co mówi Pismo? A Abraham uwierzył Bogu i zostało mu to policzone za sprawiedliwość."
  tags: []
"Rz4,4":
  text: "A pracującemu, zapłata nie jest policzona według łaski, ale według należności;"
  tags: []
"Rz4,5":
  text: "Temu natomiast, który nie pracuje, lecz wierzy w Tego, który czyni sprawiedliwym bezbożnego, jego wiara jest mu policzona za sprawiedliwość."
  tags: []
"Rz4,6":
  text: "Tak też i Dawid mówi o błogosławieństwie człowieka, któremu Bóg zalicza sprawiedliwość, niezależnie od uczynków:"
  tags: []
"Rz4,7":
  text: "Błogosławieni, którym zostały odpuszczone nieprawości i których grzechy zostały zakryte;"
  tags: []
"Rz4,8":
  text: "Błogosławiony mąż, któremu PAN rzeczywiście nie policzy grzechu."
  tags: []
"Rz4,9":
  text: "Czy zatem to błogosławieństwo jest tylko dla obrzezanych, czy też dla nieobrzezanych? Mówimy bowiem, że wiara została policzona Abrahamowi za sprawiedliwość."
  tags: []
"Rz4,10":
  text: "Jak więc została mu policzona? Gdy był przed obrzezaniem, czy po obrzezaniu? Nie był obrzezany, ale był przed obrzezaniem."
  tags: []
"Rz4,11":
  text: "I przyjął znak obrzezania jako pieczęć sprawiedliwości tej wiary, którą miał przed obrzezaniem, aby on był ojcem wszystkich wierzących nieobrzezanych, aby i im to zostało policzone za sprawiedliwość,"
  tags: []
"Rz4,12":
  text: "I także ojcem obrzezanych, nie tylko dla tych, którzy są obrzezani, ale i dla tych, którzy idą śladami wiary ojca naszego Abrahama, którą miał przed obrzezaniem."
  tags: []
"Rz4,13":
  text: "Bowiem nie przez prawo została dana obietnica Abrahamowi i jego potomstwu, że ma być dziedzicem świata, ale przez sprawiedliwość z wiary."
  tags: []
"Rz4,14":
  text: "Bo jeśli ci, którzy są z prawa, są dziedzicami, wtedy wiara stała się bez znaczenia, a obietnica stała się bezużyteczna;"
  tags: []
"Rz4,15":
  text: "Gdyż Prawo powoduje gniew; bo gdzie nie ma prawa, tam i nie ma przestępstwa."
  tags: []
"Rz4,16":
  text: "Dlatego z wiary dana była obietnica, aby była z łaski, i aby była zapewniona całemu potomstwu, nie tylko tym, którzy są z Prawa, ale i tym, którzy są z wiary Abrahama, ojca nas wszystkich,"
  tags: []
"Rz4,17":
  text: "Tak, jak jest napisane: Ojcem wielu narodów ustanowiłem cię przed Bogiem, któremu uwierzył, który ożywia umarłych, a to czego nie ma, powołuje by było."
  tags: []
"Rz4,18":
  text: "Abraham wbrew nadziei z powodu nadziei uwierzył, by stać się ojcem wielu narodów według tego, co jest powiedziane: Takie będzie twoje potomstwo;"
  tags: []
"Rz4,19":
  text: "I nie osłabł w wierze, i nie patrzył na swoje własne ciało, że jest już obumarłe, mając około stu lat, ani na obumarłe łono Sary."
  tags: []
"Rz4,20":
  text: "A wobec obietnicy Boga nie poddał się wątpliwościom wypływającym z niewiary, ale został umocniony wiarą i dał chwałę Bogu,"
  tags: []
"Rz4,21":
  text: "I będąc w pełni zapewnionym, że cokolwiek On obiecał, mocny jest i uczynić;"
  tags: []
"Rz4,22":
  text: "I dlatego zostało mu to policzone za sprawiedliwość."
  tags: []
"Rz4,23":
  text: "A to nie napisano jedynie dla niego, że mu to zostało policzone,"
  tags: []
"Rz4,24":
  text: "Ale i ze względu na nas, którym ma być to poczytywane, wierzącym w Tego, który wzbudził z martwych Jezusa, naszego Pana;"
  tags: []
"Rz4,25":
  text: "Który został wydany z powodu naszych występków i powstał z martwych dla naszego usprawiedliwienia."
  tags: []
