"Rz15,1":
  text: "A tak my, którzy jesteśmy mocni, powinniśmy nosić bezsilność słabych, a nie przypodobywać się sobie samym."
  tags: []
"Rz15,2":
  text: "Dlatego każdy z nas niech podoba się bliźniemu ku dobru, ze względu na zbudowanie;"
  tags: []
"Rz15,3":
  text: "Ponieważ i Chrystus nie miał upodobania w samym sobie, ale tak, jak jest napisane: Urągania tych, którzy Tobie urągają spadły na mnie."
  tags: []
"Rz15,4":
  text: "Bo cokolwiek wcześniej zostało napisane, dla naszej nauki zostało napisane, abyśmy przez wytrwałość i przez zachętę Pism mieli nadzieję."
  tags: []
"Rz15,5":
  text: "A Bóg wytrwałości i zachęty oby wam dał, abyście byli tej samej myśli między sobą na wzór Chrystusa Jezusa."
  tags: []
"Rz15,6":
  text: "Abyście jednomyślnie, jednymi ustami wysławiali Boga i Ojca Pana naszego Jezusa Chrystusa."
  tags: []
"Rz15,7":
  text: "Dlatego przyjmujcie jedni drugich, jak i Chrystus przyjął nas dla chwały Boga."
  tags: []
"Rz15,8":
  text: "A mówię wam, że Jezus Chrystus stał się sługą obrzezanych dla prawdy Bożej, aby potwierdzić obietnice dane ojcom,"
  tags: []
"Rz15,9":
  text: "Poganie natomiast, żeby chwalili Boga za miłosierdzie, jak napisano: Z tego powodu wyznam Cię wśród pogan i imieniu Twojemu będę śpiewać."
  tags: []
"Rz15,10":
  text: "I ponownie mówi: Weselcie się poganie wraz z Jego ludem."
  tags: []
"Rz15,11":
  text: "I ponownie: Wielbijcie PANA, wszyscy poganie i wysławiajcie Go, wszystkie ludy."
  tags: []
"Rz15,12":
  text: "I ponownie Izajasz mówi: Będzie korzeń Jessego, który powstanie, aby władać poganami; w Nim poganie będą pokładać nadzieję."
  tags: []
"Rz15,13":
  text: "A Bóg nadziei niech was wypełni wszelką radością i pokojem w wierze, abyście obfitowali w nadziei przez moc Ducha Świętego."
  tags: []
"Rz15,14":
  text: "A ja sam jestem przekonany, co do was, że sami jesteście pełni dobroci, napełnieni wszelkim poznaniem, mogący jedni drugich pouczać."
  tags: []
"Rz15,15":
  text: "A napisałem do was, bracia, śmiało, po części jakby przypominając wam przez łaskę, która została mi dana od Boga,"
  tags: []
"Rz15,16":
  text: "Abym ja był sługą Jezusa Chrystusa pośród pogan, pełniącym świętą służbę dla Ewangelii Boga, aby ofiara pogan stała się godna przyjęcia i była uświęcona w Duchu Świętym."
  tags: []
"Rz15,17":
  text: "Mam więc chlubę w Chrystusie Jezusie, w tym, co odnosi się do Boga."
  tags: []
"Rz15,18":
  text: "Albowiem nie odważę się mówić o czymś, czego nie dokonał Chrystus przeze mnie, by przyprowadzić do posłuszeństwa pogan, słowem i czynem,"
  tags: []
"Rz15,19":
  text: "Przez moc znaków i cudów, w mocy Ducha Bożego, tak że od Jerozolimy i okolic, aż do Ilirii zacząłem wypełniać te krainy Ewangelią Chrystusa;"
  tags: []
"Rz15,20":
  text: "To jednak poczytuję sobie za honor, by głosić Ewangelię nie tam, gdzie było znane imię Chrystusa, abym nie budował na cudzym fundamencie;"
  tags: []
"Rz15,21":
  text: "Ale tak, jak jest napisane: Ci, którym nie głoszono ujrzą Go, a ci, którzy nie słyszeli, zrozumieją."
  tags: []
"Rz15,22":
  text: "Dlatego też wiele doznawałem przeszkód, aby przyjść do was."
  tags: []
"Rz15,23":
  text: "Lecz teraz, nie mając już miejsca w tych okolicach, a od wielu lat mając pragnienie przyjść do was,"
  tags: []
"Rz15,24":
  text: "Może gdy udam się do Hiszpanii, przyjdę do was; bo mam nadzieję, przechodząc ujrzeć was i przez was zostać tam wyprawiony, jeślibym najpierw wami choć częściowo został nasycony."
  tags: []
"Rz15,25":
  text: "A teraz idę do Jerozolimy, służąc świętym."
  tags: []
"Rz15,26":
  text: "Upodobało się bowiem Macedonii i Achai złożyć pewną składkę na ubogich pośród świętych w Jerozolimie."
  tags: []
"Rz15,27":
  text: "To postanowiły, bo są ich dłużnikami; bo jeśli poganie stali się uczestnikami tego, co duchowe, to winni są usłużyć im i w tym, co cielesne."
  tags: []
"Rz15,28":
  text: "Gdy więc to wypełnię i zapieczętuję dla nich ten plon, odejdę i przez was, udam się do Hiszpanii."
  tags: []
"Rz15,29":
  text: "Wiem natomiast, że idąc do was, przyjdę z pełnym błogosławieństwem Ewangelii Chrystusa."
  tags: []
"Rz15,30":
  text: "A proszę was, bracia, przez Pana naszego Jezusa Chrystusa i przez miłość Ducha, abyście razem ze mną walczyli w modlitwach za mnie do Boga,"
  tags: []
"Rz15,31":
  text: "Abym został uratowany od nieposłusznych w Judei, i aby służba moja na rzecz Jerozolimy stała się godna przyjęcia przez świętych."
  tags: []
"Rz15,32":
  text: "Abym w radości przyszedł do was za wolą Bożą i razem z wami zaznał odpoczynku."
  tags: []
"Rz15,33":
  text: "A Bóg pokoju jest z wami wszystkimi. Amen."
  tags: []
