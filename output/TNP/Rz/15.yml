"Rz15,1": "A tak my, którzy jesteśmy mocni, powinniśmy nosić bezsilność słabych, a nie przypodobywać się sobie samym."
"Rz15,2": "Dlatego każdy z nas niech podoba się bliźniemu ku dobru, ze względu na zbudowanie;"
"Rz15,3": "Ponieważ i Chrystus nie miał upodobania w samym sobie, ale tak, jak jest napisane: Urągania tych, którzy Tobie urągają spadły na mnie."
"Rz15,4": "Bo cokolwiek wcześniej zostało napisane, dla naszej nauki zostało napisane, abyśmy przez wytrwałość i przez zachętę Pism mieli nadzieję."
"Rz15,5": "A Bóg wytrwałości i zachęty oby wam dał, abyście byli tej samej myśli między sobą na wzór Chrystusa Jezusa."
"Rz15,6": "Abyście jednomyślnie, jednymi ustami wysławiali Boga i Ojca Pana naszego Jezusa Chrystusa."
"Rz15,7": "Dlatego przyjmujcie jedni drugich, jak i Chrystus przyjął nas dla chwały Boga."
"Rz15,8": "A mówię wam, że Jezus Chrystus stał się sługą obrzezanych dla prawdy Bożej, aby potwierdzić obietnice dane ojcom,"
"Rz15,9": "Poganie natomiast, żeby chwalili Boga za miłosierdzie, jak napisano: Z tego powodu wyznam Cię wśród pogan i imieniu Twojemu będę śpiewać."
"Rz15,10": "I ponownie mówi: Weselcie się poganie wraz z Jego ludem."
"Rz15,11": "I ponownie: Wielbijcie PANA, wszyscy poganie i wysławiajcie Go, wszystkie ludy."
"Rz15,12": "I ponownie Izajasz mówi: Będzie korzeń Jessego, który powstanie, aby władać poganami; w Nim poganie będą pokładać nadzieję."
"Rz15,13": "A Bóg nadziei niech was wypełni wszelką radością i pokojem w wierze, abyście obfitowali w nadziei przez moc Ducha Świętego."
"Rz15,14": "A ja sam jestem przekonany, co do was, że sami jesteście pełni dobroci, napełnieni wszelkim poznaniem, mogący jedni drugich pouczać."
"Rz15,15": "A napisałem do was, bracia, śmiało, po części jakby przypominając wam przez łaskę, która została mi dana od Boga,"
"Rz15,16": "Abym ja był sługą Jezusa Chrystusa pośród pogan, pełniącym świętą służbę dla Ewangelii Boga, aby ofiara pogan stała się godna przyjęcia i była uświęcona w Duchu Świętym."
"Rz15,17": "Mam więc chlubę w Chrystusie Jezusie, w tym, co odnosi się do Boga."
"Rz15,18": "Albowiem nie odważę się mówić o czymś, czego nie dokonał Chrystus przeze mnie, by przyprowadzić do posłuszeństwa pogan, słowem i czynem,"
"Rz15,19": "Przez moc znaków i cudów, w mocy Ducha Bożego, tak że od Jerozolimy i okolic, aż do Ilirii zacząłem wypełniać te krainy Ewangelią Chrystusa;"
"Rz15,20": "To jednak poczytuję sobie za honor, by głosić Ewangelię nie tam, gdzie było znane imię Chrystusa, abym nie budował na cudzym fundamencie;"
"Rz15,21": "Ale tak, jak jest napisane: Ci, którym nie głoszono ujrzą Go, a ci, którzy nie słyszeli, zrozumieją."
"Rz15,22": "Dlatego też wiele doznawałem przeszkód, aby przyjść do was."
"Rz15,23": "Lecz teraz, nie mając już miejsca w tych okolicach, a od wielu lat mając pragnienie przyjść do was,"
"Rz15,24": "Może gdy udam się do Hiszpanii, przyjdę do was; bo mam nadzieję, przechodząc ujrzeć was i przez was zostać tam wyprawiony, jeślibym najpierw wami choć częściowo został nasycony."
"Rz15,25": "A teraz idę do Jerozolimy, służąc świętym."
"Rz15,26": "Upodobało się bowiem Macedonii i Achai złożyć pewną składkę na ubogich pośród świętych w Jerozolimie."
"Rz15,27": "To postanowiły, bo są ich dłużnikami; bo jeśli poganie stali się uczestnikami tego, co duchowe, to winni są usłużyć im i w tym, co cielesne."
"Rz15,28": "Gdy więc to wypełnię i zapieczętuję dla nich ten plon, odejdę i przez was, udam się do Hiszpanii."
"Rz15,29": "Wiem natomiast, że idąc do was, przyjdę z pełnym błogosławieństwem Ewangelii Chrystusa."
"Rz15,30": "A proszę was, bracia, przez Pana naszego Jezusa Chrystusa i przez miłość Ducha, abyście razem ze mną walczyli w modlitwach za mnie do Boga,"
"Rz15,31": "Abym został uratowany od nieposłusznych w Judei, i aby służba moja na rzecz Jerozolimy stała się godna przyjęcia przez świętych."
"Rz15,32": "Abym w radości przyszedł do was za wolą Bożą i razem z wami zaznał odpoczynku."
"Rz15,33": "A Bóg pokoju jest z wami wszystkimi. Amen."
