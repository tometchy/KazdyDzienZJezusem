"1Kor5,1": "Powszechnie słyszy się o nierządzie między wami i to takim nierządzie, jaki nawet między poganami nie jest wymieniany, że ktoś ma żonę swojego ojca."
"1Kor5,2": "A wy jesteście nadęci pychą, zamiast raczej zasmucić się, by został usunięty spośród was ten, który popełnił taki czyn."
"1Kor5,3": "Ja wprawdzie chociaż jestem nieobecny ciałem, ale obecny duchem, już zacząłem osądzać – tak jakbym był obecny – tego, który to uczynił,"
"1Kor5,4": "Gdy zbierzecie się razem w imieniu Pana naszego Jezusa Chrystusa, wy i duch mój z mocą Pana naszego Jezusa Chrystusa,"
"1Kor5,5": "Oddajcie takiego szatanowi na zgubę ciała, aby duch został zbawiony w dzień Pana Jezusa."
"1Kor5,6": "Wasze chlubienie się nie jest dobre. Czy nie wiecie, że mała ilość kwasu całe ciasto zakwasza?"
"1Kor5,7": "Wyczyśćcie więc stary kwas, abyście byli nowym ciastem, jako że jesteście przaśni; gdyż jako – nasza Pascha – został zabity na ofiarę za nas Chrystus."
"1Kor5,8": "A tak, obchodźmy święto nie w starym zakwasie, ani w zakwasie złości i niegodziwości, ale w przaśnikach szczerości i prawdy."
"1Kor5,9": "Napisałem wam w liście, abyście nie łączyli się z nierządnikami;"
"1Kor5,10": "Ale niewątpliwie nie z nierządnikami tego świata, lub chciwcami, lub zdziercami, lub z bałwochwalcami; skoro jesteście zobowiązani właśnie wyjść z tego świata."
"1Kor5,11": "Lecz teraz napisałem wam, abyście nie łączyli się z kimś, jeśli ten jest nazwany bratem, a jest nierządnikiem lub chciwcem, lub bałwochwalcą, lub oszczercą, lub pijakiem, lub grabieżcą, żebyście z takim razem nie jadali."
"1Kor5,12": "Bo po co mi sądzić tych z zewnątrz? Czy wy nie sądzicie tych, którzy są wewnątrz?"
"1Kor5,13": "Tych z zewnątrz natomiast osądzi Bóg. Usuńcie więc niegodziwego spośród was samych."
