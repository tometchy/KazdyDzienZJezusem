"1Kor5,1":
  text: "Powszechnie słyszy się o nierządzie między wami i to takim nierządzie, jaki nawet między poganami nie jest wymieniany, że ktoś ma żonę swojego ojca."
  tags: []
"1Kor5,2":
  text: "A wy jesteście nadęci pychą, zamiast raczej zasmucić się, by został usunięty spośród was ten, który popełnił taki czyn."
  tags: []
"1Kor5,3":
  text: "Ja wprawdzie chociaż jestem nieobecny ciałem, ale obecny duchem, już zacząłem osądzać – tak jakbym był obecny – tego, który to uczynił,"
  tags: []
"1Kor5,4":
  text: "Gdy zbierzecie się razem w imieniu Pana naszego Jezusa Chrystusa, wy i duch mój z mocą Pana naszego Jezusa Chrystusa,"
  tags: []
"1Kor5,5":
  text: "Oddajcie takiego szatanowi na zgubę ciała, aby duch został zbawiony w dzień Pana Jezusa."
  tags: []
"1Kor5,6":
  text: "Wasze chlubienie się nie jest dobre. Czy nie wiecie, że mała ilość kwasu całe ciasto zakwasza?"
  tags: []
"1Kor5,7":
  text: "Wyczyśćcie więc stary kwas, abyście byli nowym ciastem, jako że jesteście przaśni; gdyż jako – nasza Pascha – został zabity na ofiarę za nas Chrystus."
  tags: []
"1Kor5,8":
  text: "A tak, obchodźmy święto nie w starym zakwasie, ani w zakwasie złości i niegodziwości, ale w przaśnikach szczerości i prawdy."
  tags: []
"1Kor5,9":
  text: "Napisałem wam w liście, abyście nie łączyli się z nierządnikami;"
  tags: []
"1Kor5,10":
  text: "Ale niewątpliwie nie z nierządnikami tego świata, lub chciwcami, lub zdziercami, lub z bałwochwalcami; skoro jesteście zobowiązani właśnie wyjść z tego świata."
  tags: []
"1Kor5,11":
  text: "Lecz teraz napisałem wam, abyście nie łączyli się z kimś, jeśli ten jest nazwany bratem, a jest nierządnikiem lub chciwcem, lub bałwochwalcą, lub oszczercą, lub pijakiem, lub grabieżcą, żebyście z takim razem nie jadali."
  tags: []
"1Kor5,12":
  text: "Bo po co mi sądzić tych z zewnątrz? Czy wy nie sądzicie tych, którzy są wewnątrz?"
  tags: []
"1Kor5,13":
  text: "Tych z zewnątrz natomiast osądzi Bóg. Usuńcie więc niegodziwego spośród was samych."
  tags: []
