"1Kor9,1":
  text: "Czy nie jestem apostołem? Czy nie jestem wolny? Czy nie widziałem Jezusa Chrystusa, Pana naszego? Czy wy nie jesteście dziełem moim w Panu?"
  tags: []
"1Kor9,2":
  text: "Jeśli dla innych nie jestem apostołem, to dla was rzeczywiście nim jestem; bo pieczęcią mego apostolstwa wy jesteście w Panu."
  tags: []
"1Kor9,3":
  text: "Moja obrona przed tymi, którzy mnie sądzą jest taka:"
  tags: []
"1Kor9,4":
  text: "Czy nie mamy prawa zjeść i wypić?"
  tags: []
"1Kor9,5":
  text: "Czy nie mamy prawa brać z sobą siostry żony, jak i pozostali apostołowie i bracia Pana, i Kefas?"
  tags: []
"1Kor9,6":
  text: "Czy ja jeden i Barnaba nie mamy prawa nie pracować?"
  tags: []
"1Kor9,7":
  text: "Kto służy w wojsku na własny koszt? Kto sadzi winnicę, a owocu jej nie spożywa? Lub kto pasie trzodę, a nie posila się jej mlekiem?"
  tags: []
"1Kor9,8":
  text: "Czy mówię to tylko po ludzku? Czy i Prawo tego nie mówi?"
  tags: []
"1Kor9,9":
  text: "Bo w Prawie Mojżesza jest napisane: Nie zawiążesz pyska młócącemu wołowi. Czy Bóg troszczy się o woły?"
  tags: []
"1Kor9,10":
  text: "Czy nie mówi tego zwłaszcza ze względu na nas? Bo z powodu nas zostało napisane, że oracz powinien orać w nadziei, a młocarz młócić w nadziei, że w swojej nadziei będzie miał udział."
  tags: []
"1Kor9,11":
  text: "Jeżeli my posialiśmy wam duchowe dobra, cóż to wielkiego, jeżeli będziemy żąć wasze dobra cielesne?"
  tags: []
"1Kor9,12":
  text: "Jeśli inni uczestniczą w waszym przywileju, czemu raczej nie my? Nie skorzystaliśmy jednak z tego prawa, ale wszystko znosimy, abyśmy nie stwarzali jakiejś przeszkody Ewangelii Chrystusa."
  tags: []
"1Kor9,13":
  text: "Czy nie wiecie, że ci, którzy przy rzeczach poświęconych pracują, żyją ze świątyni? A ci, którzy służą przy ołtarzu, mają udział z ofiar ołtarza?"
  tags: []
"1Kor9,14":
  text: "Tak też Pan rozporządził, aby ci, którzy głoszą Ewangelię, z Ewangelii żyli."
  tags: []
"1Kor9,15":
  text: "Ja jednak z żadnej z tych rzeczy nie skorzystałem. A nie napisałem tego, aby tak się ze mną stało; bo lepiej jest dla mnie umrzeć, niż miałby mnie ktoś pozbawić tej chluby."
  tags: []
"1Kor9,16":
  text: "Bo jeśli głoszę Ewangelię, nie jest to moją chlubą, taka bowiem ciąży na mnie konieczność; a biada mi, jeślibym nie głosił Ewangelii."
  tags: []
"1Kor9,17":
  text: "Jeśli bowiem z własnej woli to czynię, mam zapłatę; a jeśli niechętnie, to sprawuję powierzone mi szafarstwo."
  tags: []
"1Kor9,18":
  text: "Jaka więc jest moja zapłata? Taka, abym głosząc Ewangelię, przedkładał Ewangelię Chrystusa za darmo, tak by nie używać mojego prawa, jakie mam z racji Ewangelii."
  tags: []
"1Kor9,19":
  text: "Będąc bowiem wolny wobec wszystkich, samego siebie uczyniłem niewolnikiem dla wszystkich, bym tym liczniejsze grono pozyskał."
  tags: []
"1Kor9,20":
  text: "I stałem się dla Żydów jak Żyd, aby pozyskać Żydów; dla tych, którzy są pod Prawem, jakbym był pod Prawem, abym pozyskał tych, którzy są pod Prawem;"
  tags: []
"1Kor9,21":
  text: "Dla tych, którzy są bez Prawa, jakbym był bez Prawa – chociaż nie jestem bez Prawa Bogu, lecz pod Prawem Chrystusowi – aby pozyskać tych, którzy są bez Prawa."
  tags: []
"1Kor9,22":
  text: "Dla słabych stałem się jak słaby, abym pozyskał słabych. Dla wszystkich stałem się wszystkim, abym przynajmniej niektórych zbawił."
  tags: []
"1Kor9,23":
  text: "A to czynię dla Ewangelii, abym stał się jej uczestnikiem."
  tags: []
"1Kor9,24":
  text: "Czy nie wiecie, że biegnący na stadionie, wszyscy wprawdzie biegną, lecz jeden zdobywa nagrodę? Tak biegnijcie, abyście ją otrzymali."
  tags: []
"1Kor9,25":
  text: "A każdy, który walczy od wszystkiego się powstrzymuje, oni wprawdzie, aby otrzymać wieniec zniszczalny, my natomiast niezniszczalny."
  tags: []
"1Kor9,26":
  text: "Ja więc tak biegnę, nie jak w niepewne; uderzam pięściami nie jak ten, kto uderza w powietrze;"
  tags: []
"1Kor9,27":
  text: "Ale biję do sińców moje ciało i biorę je w niewolę, bym innym głosząc, sam czasem nie został zdyskwalifikowany."
  tags: []
