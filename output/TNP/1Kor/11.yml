"1Kor11,1":
  text: "Stawajcie się naśladowcami moimi, tak jak i ja naśladuję Chrystusa."
  tags: []
"1Kor11,2":
  text: "A chwalę was, bracia, że we wszystkim o mnie pamiętacie i jak wam przekazałem, tak przekaz ten zachowujecie."
  tags: []
"1Kor11,3":
  text: "A chcę, abyście wiedzieli, że głową każdego męża jest Chrystus, a głową żony mąż, a głową Chrystusa Bóg."
  tags: []
"1Kor11,4":
  text: "Każdy mężczyzna, gdy modli się lub prorokuje mając nakrytą głowę, hańbi swoją głowę."
  tags: []
"1Kor11,5":
  text: "I każda kobieta, gdy modli się albo prorokuje z nie nakrytą głową, hańbi swoją głowę; bo jest jednym i tym samym, z tą, która została ogolona."
  tags: []
"1Kor11,6":
  text: "Albowiem jeśli kobieta nie jest nakryta, niech się też ostrzyże; a jeśli hańbiącą rzeczą jest dla kobiety być ostrzyżoną lub ogoloną, to niech jest nakryta."
  tags: []
"1Kor11,7":
  text: "Mężczyzna istotnie nie powinien mieć nakrytej głowy, gdyż rozpoczyna jako obraz i chwała Boga; kobieta natomiast jest chwałą mężczyzny."
  tags: []
"1Kor11,8":
  text: "Gdyż nie mężczyzna jest z kobiety, ale kobieta jest z mężczyzny."
  tags: []
"1Kor11,9":
  text: "Bowiem i mężczyzna nie jest stworzony ze względu na kobietę, ale kobieta ze względu na mężczyznę."
  tags: []
"1Kor11,10":
  text: "Dlatego kobieta powinna mieć na głowie znak władzy nad nią ze względu na aniołów."
  tags: []
"1Kor11,11":
  text: "Jednakże w Panu ani kobieta nie jest bez mężczyzny, ani mężczyzna bez kobiety."
  tags: []
"1Kor11,12":
  text: "Albowiem jak kobieta jest z mężczyzny, tak też mężczyzna przez kobietę; a wszystko jest z Boga."
  tags: []
"1Kor11,13":
  text: "Osądźcie sami w sobie, czy przystoi kobiecie bez nakrycia modlić się do Boga?"
  tags: []
"1Kor11,14":
  text: "Czyż i nie sama natura uczy was, że jeśli mężczyzna, nosi długie włosy, jest to dla niego hańbą?"
  tags: []
"1Kor11,15":
  text: "Ale jeśli kobieta nosi długie włosy, jest to jej chwałą, gdyż włosy dane jej są zamiast okrycia."
  tags: []
"1Kor11,16":
  text: "A jeśli ktoś myśli być kłótliwym, my takiego zwyczaju nie mamy, ani zbory Boga."
  tags: []
"1Kor11,17":
  text: "A to nakazując, nie pochwalam, że schodzicie się nie ku lepszemu, ale ku gorszemu."
  tags: []
"1Kor11,18":
  text: "Bo istotnie najpierw słyszę i po części wierzę, że gdy schodzicie się jako zbór, są wśród was podziały."
  tags: []
"1Kor11,19":
  text: "Bo muszą być rozdwojenia między wami, aby stali się widoczni ci, którzy są wypróbowani wśród was."
  tags: []
"1Kor11,20":
  text: "Gdy więc schodzicie się razem na to samo miejsce, to jednak nie jest to spożywaniem Wieczerzy Pańskiej;"
  tags: []
"1Kor11,21":
  text: "Bo każdy kładzie przed sobą własną wieczerzę by zjeść – i jeden jest głodny, drugi natomiast jest pijany."
  tags: []
"1Kor11,22":
  text: "Czy nie macie domów, aby tam jeść i pić? Albo, czy gardzicie zborem Boga i zawstydzacie tych, którzy nic nie mają? Co wam powiem? Czy mam was pochwalić? W tym was nie pochwalam."
  tags: []
"1Kor11,23":
  text: "Albowiem ja otrzymałem od Pana to, co wam przekazałem, że Pan Jezus tej nocy, w której był wydany, wziął chleb;"
  tags: []
"1Kor11,24":
  text: "A gdy podziękował, złamał i powiedział: Bierzcie, zjedzcie; to jest moje ciało, które za was jest łamane; to czyńcie na moją pamiątkę."
  tags: []
"1Kor11,25":
  text: "Tak samo i kielich, po spożyciu wieczerzy, mówiąc: Ten kielich – to jest nowe przymierze we krwi mojej; to czyńcie, ilekroć będziecie pić, na moją pamiątkę."
  tags: []
"1Kor11,26":
  text: "Bo ilekroć ten chleb jecie, a z kielicha tego pijecie, obwieszczacie śmierć Pana, aż przyjdzie."
  tags: []
"1Kor11,27":
  text: "Tak więc, kto jadłby ten chleb, albo pił ten kielich Pana niegodnie, będzie winien ciała i krwi Pana."
  tags: []
"1Kor11,28":
  text: "Niech więc człowiek doświadcza samego siebie i niech w ten sposób je z tego chleba, i z kielicha tego niech pije."
  tags: []
"1Kor11,29":
  text: "Bo kto je i pije niegodnie, nie rozróżniając ciała Pana, własny sąd je i pije."
  tags: []
"1Kor11,30":
  text: "Dlatego między wami jest wielu słabych i chorych, i liczni śpią."
  tags: []
"1Kor11,31":
  text: "Bo gdybyśmy sami siebie osądzali, nie bylibyśmy sądzeni."
  tags: []
"1Kor11,32":
  text: "Lecz gdy jesteśmy sądzeni, przez Pana jesteśmy karceni, abyśmy ze światem nie zostali skazani."
  tags: []
"1Kor11,33":
  text: "A tak, moi bracia, gdy schodzicie się, aby zjeść, oczekujcie jedni na drugich."
  tags: []
"1Kor11,34":
  text: "A jeśli ktoś jest głodny, niech je w domu, abyście nie schodzili się na sąd. Co do pozostałych spraw, zarządzę, gdy przyjdę."
  tags: []
