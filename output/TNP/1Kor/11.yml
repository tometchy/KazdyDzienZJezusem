"1Kor11,1": "Stawajcie się naśladowcami moimi, tak jak i ja naśladuję Chrystusa."
"1Kor11,2": "A chwalę was, bracia, że we wszystkim o mnie pamiętacie i jak wam przekazałem, tak przekaz ten zachowujecie."
"1Kor11,3": "A chcę, abyście wiedzieli, że głową każdego męża jest Chrystus, a głową żony mąż, a głową Chrystusa Bóg."
"1Kor11,4": "Każdy mężczyzna, gdy modli się lub prorokuje mając nakrytą głowę, hańbi swoją głowę."
"1Kor11,5": "I każda kobieta, gdy modli się albo prorokuje z nie nakrytą głową, hańbi swoją głowę; bo jest jednym i tym samym, z tą, która została ogolona."
"1Kor11,6": "Albowiem jeśli kobieta nie jest nakryta, niech się też ostrzyże; a jeśli hańbiącą rzeczą jest dla kobiety być ostrzyżoną lub ogoloną, to niech jest nakryta."
"1Kor11,7": "Mężczyzna istotnie nie powinien mieć nakrytej głowy, gdyż rozpoczyna jako obraz i chwała Boga; kobieta natomiast jest chwałą mężczyzny."
"1Kor11,8": "Gdyż nie mężczyzna jest z kobiety, ale kobieta jest z mężczyzny."
"1Kor11,9": "Bowiem i mężczyzna nie jest stworzony ze względu na kobietę, ale kobieta ze względu na mężczyznę."
"1Kor11,10": "Dlatego kobieta powinna mieć na głowie znak władzy nad nią ze względu na aniołów."
"1Kor11,11": "Jednakże w Panu ani kobieta nie jest bez mężczyzny, ani mężczyzna bez kobiety."
"1Kor11,12": "Albowiem jak kobieta jest z mężczyzny, tak też mężczyzna przez kobietę; a wszystko jest z Boga."
"1Kor11,13": "Osądźcie sami w sobie, czy przystoi kobiecie bez nakrycia modlić się do Boga?"
"1Kor11,14": "Czyż i nie sama natura uczy was, że jeśli mężczyzna, nosi długie włosy, jest to dla niego hańbą?"
"1Kor11,15": "Ale jeśli kobieta nosi długie włosy, jest to jej chwałą, gdyż włosy dane jej są zamiast okrycia."
"1Kor11,16": "A jeśli ktoś myśli być kłótliwym, my takiego zwyczaju nie mamy, ani zbory Boga."
"1Kor11,17": "A to nakazując, nie pochwalam, że schodzicie się nie ku lepszemu, ale ku gorszemu."
"1Kor11,18": "Bo istotnie najpierw słyszę i po części wierzę, że gdy schodzicie się jako zbór, są wśród was podziały."
"1Kor11,19": "Bo muszą być rozdwojenia między wami, aby stali się widoczni ci, którzy są wypróbowani wśród was."
"1Kor11,20": "Gdy więc schodzicie się razem na to samo miejsce, to jednak nie jest to spożywaniem Wieczerzy Pańskiej;"
"1Kor11,21": "Bo każdy kładzie przed sobą własną wieczerzę by zjeść – i jeden jest głodny, drugi natomiast jest pijany."
"1Kor11,22": "Czy nie macie domów, aby tam jeść i pić? Albo, czy gardzicie zborem Boga i zawstydzacie tych, którzy nic nie mają? Co wam powiem? Czy mam was pochwalić? W tym was nie pochwalam."
"1Kor11,23": "Albowiem ja otrzymałem od Pana to, co wam przekazałem, że Pan Jezus tej nocy, w której był wydany, wziął chleb;"
"1Kor11,24": "A gdy podziękował, złamał i powiedział: Bierzcie, zjedzcie; to jest moje ciało, które za was jest łamane; to czyńcie na moją pamiątkę."
"1Kor11,25": "Tak samo i kielich, po spożyciu wieczerzy, mówiąc: Ten kielich – to jest nowe przymierze we krwi mojej; to czyńcie, ilekroć będziecie pić, na moją pamiątkę."
"1Kor11,26": "Bo ilekroć ten chleb jecie, a z kielicha tego pijecie, obwieszczacie śmierć Pana, aż przyjdzie."
"1Kor11,27": "Tak więc, kto jadłby ten chleb, albo pił ten kielich Pana niegodnie, będzie winien ciała i krwi Pana."
"1Kor11,28": "Niech więc człowiek doświadcza samego siebie i niech w ten sposób je z tego chleba, i z kielicha tego niech pije."
"1Kor11,29": "Bo kto je i pije niegodnie, nie rozróżniając ciała Pana, własny sąd je i pije."
"1Kor11,30": "Dlatego między wami jest wielu słabych i chorych, i liczni śpią."
"1Kor11,31": "Bo gdybyśmy sami siebie osądzali, nie bylibyśmy sądzeni."
"1Kor11,32": "Lecz gdy jesteśmy sądzeni, przez Pana jesteśmy karceni, abyśmy ze światem nie zostali skazani."
"1Kor11,33": "A tak, moi bracia, gdy schodzicie się, aby zjeść, oczekujcie jedni na drugich."
"1Kor11,34": "A jeśli ktoś jest głodny, niech je w domu, abyście nie schodzili się na sąd. Co do pozostałych spraw, zarządzę, gdy przyjdę."
