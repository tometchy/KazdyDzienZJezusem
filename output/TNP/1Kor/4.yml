"1Kor4,1":
  text: "Tak niech nas człowiek zalicza jako do poddanych Chrystusa i szafarzy tajemnic Bożych."
  tags: []
"1Kor4,2":
  text: "A tego w końcu wymaga się od szafarzy, aby każdy został znaleziony wiernym."
  tags: []
"1Kor4,3":
  text: "Ale mi najmniej zależy na tym, czy będę przez was sądzony, czy przez ludzki dzień sądu; nawet i sam siebie nie sądzę."
  tags: []
"1Kor4,4":
  text: "Niczego bowiem w sobie nie dostrzegam, ale nie przez to jestem uznany za sprawiedliwego; bo tym, który mnie sądzi, jest Pan."
  tags: []
"1Kor4,5":
  text: "Tak więc, nie sądźcie przed czasem, aż przyjdzie Pan, który też oświetli to, co jest ukryte w ciemności, i ukaże zamysły serc; a wtedy każdy będzie miał pochwałę od Boga."
  tags: []
"1Kor4,6":
  text: "A to wszystko, bracia, odniosłem do siebie i do Apollosa z powodu was, abyście nauczyli się na nas, nie rozumieć ponad to, co jest napisane; abyście jeden ponad drugiego nie nadymali się pychą przeciwko innemu."
  tags: []
"1Kor4,7":
  text: "Albowiem kto ciebie wyróżnia? I co masz, czego byś nie otrzymał? A jeśli otrzymałeś, dlaczego chlubisz się, jakbyś nie otrzymał?"
  tags: []
"1Kor4,8":
  text: "Już jesteście nasyceni, już wzbogaciliście się, bez nas zaczęliście królować; i obyście zaczęli królować, abyśmy i my razem z wami królowali!"
  tags: []
"1Kor4,9":
  text: "Wydaje mi się bowiem, że Bóg nas apostołów pokazał jako ostatnich, jak skazanych na śmierć; gdyż staliśmy się publicznym widowiskiem dla świata, aniołów i ludzi."
  tags: []
"1Kor4,10":
  text: "My jesteśmy głupi ze względu na Chrystusa, ale wy jesteście rozumni w Chrystusie; my jesteśmy słabi, a wy mocni; wy jesteście szanowani, a my w pogardzie."
  tags: []
"1Kor4,11":
  text: "Aż do obecnej chwili i łakniemy, i pragniemy, i jesteśmy nadzy, i bywamy policzkowani, i tułamy się,"
  tags: []
"1Kor4,12":
  text: "I trudzimy się, pracując własnymi rękami; lżą nas, my błogosławimy; prześladują nas, my cierpliwie znosimy;"
  tags: []
"1Kor4,13":
  text: "Bluźnią nam, zachęcamy; staliśmy się jakby śmieciem świata i odpadkami u wszystkich, aż do teraz."
  tags: []
"1Kor4,14":
  text: "Piszę to, nie dlatego, żeby was zawstydzać, ale jako moje dzieci umiłowane napominam was."
  tags: []
"1Kor4,15":
  text: "Bo choćbyście mieli dziesiątki tysięcy wychowawców w Chrystusie, jednak ojców macie niewielu; bo ja, w Chrystusie Jezusie, zrodziłem was przez Ewangelię."
  tags: []
"1Kor4,16":
  text: "Zachęcam więc was, stawajcie się moimi naśladowcami."
  tags: []
"1Kor4,17":
  text: "Dlatego posłałem do was Tymoteusza, który jest moim umiłowanym dzieckiem i wiernym w Panu; który wam przypomni moje drogi w Chrystusie, jak nauczam wszędzie, w każdym zborze."
  tags: []
"1Kor4,18":
  text: "Ale niektórzy nadęli się pychą, jak gdybym nie miał przyjść do was."
  tags: []
"1Kor4,19":
  text: "Lecz przyjdę do was szybko, jeżeli Pan zechce, i poznam nie słowo tych nadętych, lecz moc."
  tags: []
"1Kor4,20":
  text: "Albowiem nie w słowie tych nadętych przejawia się Królestwo Boże, ale w mocy."
  tags: []
"1Kor4,21":
  text: "Co chcecie? Mam przyjść do was z rózgą, czy też w miłości i w duchu łagodności?"
  tags: []
