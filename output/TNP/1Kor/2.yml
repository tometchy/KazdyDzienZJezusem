"1Kor2,1":
  text: "A ja, gdy przyszedłem do was, bracia, nie przyszedłem z wyniosłością słowa lub mądrości, głosząc wam świadectwo Boże."
  tags: []
"1Kor2,2":
  text: "Albowiem rozsądziłem, aby nie znać nic innego między wami, z wyjątkiem Jezusa Chrystusa, i to ukrzyżowanego."
  tags: []
"1Kor2,3":
  text: "A ja stanąłem przed wami w słabości, w bojaźni i z wielkim drżeniem."
  tags: []
"1Kor2,4":
  text: "A moje słowo i moje głoszenie nie było w przekonywujących słowach ludzkiej mądrości, ale w manifestacji Ducha i mocy,"
  tags: []
"1Kor2,5":
  text: "Aby wiara wasza nie była oparta na mądrości ludzkiej, ale na mocy Bożej."
  tags: []
"1Kor2,6":
  text: "Mądrość natomiast głosimy między doskonałymi, ale mądrość nie tego wieku, ani władców tego wieku, tracących na znaczeniu."
  tags: []
"1Kor2,7":
  text: "Ale głosimy mądrość Bożą, ukrytą w tajemnicy, którą Bóg przeznaczył przed wiekami dla naszej chwały,"
  tags: []
"1Kor2,8":
  text: "Której żaden z władców tego wieku nie poznał; bo gdyby poznali, nie ukrzyżowaliby Pana chwały;"
  tags: []
"1Kor2,9":
  text: "Lecz, jak jest napisane: Czego oko nie widziało i ucho nie słyszało, i co nie wstąpiło do ludzkiego serca, to przygotował Bóg tym, którzy Go miłują."
  tags: []
"1Kor2,10":
  text: "Nam natomiast objawił to Bóg przez swojego Ducha; Duch bowiem bada wszystko i głębokości Boga."
  tags: []
"1Kor2,11":
  text: "Bo któż z ludzi zna to, co ludzkie, jak tylko duch ludzki w nim? Tak i to, co z Boga, nikt nie zna, jak tylko Duch Boga."
  tags: []
"1Kor2,12":
  text: "Ale my nie przyjęliśmy ducha świata, lecz Ducha, który jest z Boga, abyśmy znali to wszystko, co zostało nam darowane przez Boga;"
  tags: []
"1Kor2,13":
  text: "O których też mówimy, nie w słowach nauczanych przez ludzką mądrość, lecz w słowach nauczanych przez Ducha Świętego, i to, co duchowe z duchowymi łączymy."
  tags: []
"1Kor2,14":
  text: "Jednak zmysłowy człowiek nie przyjmuje tych rzeczy, które są z Ducha Bożego; albowiem są dla niego głupotą i nie może ich poznać, ponieważ duchowo są rozsądzane."
  tags: []
"1Kor2,15":
  text: "Ale duchowy człowiek wprawdzie rozsądza to wszystko, lecz sam przez nikogo nie jest rozsądzany."
  tags: []
"1Kor2,16":
  text: "Kto bowiem poznał myśl Pana, kto Go pouczy? Ale my mamy myśl Chrystusa."
  tags: []
