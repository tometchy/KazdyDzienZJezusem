"1Kor2,1": "A ja, gdy przyszedłem do was, bracia, nie przyszedłem z wyniosłością słowa lub mądrości, głosząc wam świadectwo Boże."
"1Kor2,2": "Albowiem rozsądziłem, aby nie znać nic innego między wami, z wyjątkiem Jezusa Chrystusa, i to ukrzyżowanego."
"1Kor2,3": "A ja stanąłem przed wami w słabości, w bojaźni i z wielkim drżeniem."
"1Kor2,4": "A moje słowo i moje głoszenie nie było w przekonywujących słowach ludzkiej mądrości, ale w manifestacji Ducha i mocy,"
"1Kor2,5": "Aby wiara wasza nie była oparta na mądrości ludzkiej, ale na mocy Bożej."
"1Kor2,6": "Mądrość natomiast głosimy między doskonałymi, ale mądrość nie tego wieku, ani władców tego wieku, tracących na znaczeniu."
"1Kor2,7": "Ale głosimy mądrość Bożą, ukrytą w tajemnicy, którą Bóg przeznaczył przed wiekami dla naszej chwały,"
"1Kor2,8": "Której żaden z władców tego wieku nie poznał; bo gdyby poznali, nie ukrzyżowaliby Pana chwały;"
"1Kor2,9": "Lecz, jak jest napisane: Czego oko nie widziało i ucho nie słyszało, i co nie wstąpiło do ludzkiego serca, to przygotował Bóg tym, którzy Go miłują."
"1Kor2,10": "Nam natomiast objawił to Bóg przez swojego Ducha; Duch bowiem bada wszystko i głębokości Boga."
"1Kor2,11": "Bo któż z ludzi zna to, co ludzkie, jak tylko duch ludzki w nim? Tak i to, co z Boga, nikt nie zna, jak tylko Duch Boga."
"1Kor2,12": "Ale my nie przyjęliśmy ducha świata, lecz Ducha, który jest z Boga, abyśmy znali to wszystko, co zostało nam darowane przez Boga;"
"1Kor2,13": "O których też mówimy, nie w słowach nauczanych przez ludzką mądrość, lecz w słowach nauczanych przez Ducha Świętego, i to, co duchowe z duchowymi łączymy."
"1Kor2,14": "Jednak zmysłowy człowiek nie przyjmuje tych rzeczy, które są z Ducha Bożego; albowiem są dla niego głupotą i nie może ich poznać, ponieważ duchowo są rozsądzane."
"1Kor2,15": "Ale duchowy człowiek wprawdzie rozsądza to wszystko, lecz sam przez nikogo nie jest rozsądzany."
"1Kor2,16": "Kto bowiem poznał myśl Pana, kto Go pouczy? Ale my mamy myśl Chrystusa."
