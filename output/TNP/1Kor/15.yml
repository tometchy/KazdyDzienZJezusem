"1Kor15,1": "A daję wam dogłębnie poznać, bracia, Ewangelię, którą wam ogłosiłem, którą też przyjęliście i w której stoicie,"
"1Kor15,2": "Przez którą też jesteście zbawiani, jeśli trzymacie się jej w tym Słowie, które wam ogłosiłem jako dobrą nowinę, chyba że na próżno uwierzyliście."
"1Kor15,3": "Albowiem na początku przekazałem wam to, co sam przejąłem, że Chrystus umarł za nasze grzechy według Pism,"
"1Kor15,4": "I że został pogrzebany, i że został wzbudzony trzeciego dnia według Pism,"
"1Kor15,5": "I że został ukazany Kefasowi, a potem dwunastu."
"1Kor15,6": "Potem został ukazany więcej niż pięciuset braciom naraz, z których większość pozostaje przy życiu, a niektórzy zasnęli."
"1Kor15,7": "Potem ukazał się Jakubowi, potem wszystkim apostołom."
"1Kor15,8": "A na końcu po wszystkich, ukazał się i mnie, jakby poronionemu płodowi."
"1Kor15,9": "Ja bowiem jestem najmniejszy z apostołów i nie jestem godny, aby być nazywanym apostołem, ponieważ prześladowałem zbór Boga."
"1Kor15,10": "Lecz z łaski Boga jestem tym, kim jestem, a łaska Jego wobec mnie nie stała się daremna; lecz bardziej niż oni wszyscy trudziłem się, jednak nie ja, lecz łaska Boga, która jest ze mną."
"1Kor15,11": "Dlatego czy to ja, czy tamci, w ten sposób głosimy i tak uwierzyliście."
"1Kor15,12": "A jeżeli o Chrystusie głosi się, że jest wzbudzony z martwych, jakże więc mówią niektórzy między wami, że nie ma zmartwychwstania?"
"1Kor15,13": "Jeśli natomiast nie ma zmartwychwstania, to i Chrystus nie jest wzbudzony."
"1Kor15,14": "A jeśli Chrystus nie jest wzbudzony, wtedy i próżne jest nasze głoszenie, próżna też jest nasza wiara,"
"1Kor15,15": "I jesteśmy też uznani za fałszywych świadków Boga, bo świadczyliśmy o Bogu, że wzbudził Chrystusa, którego nie wzbudził, skoro umarli nie są wzbudzani."
"1Kor15,16": "Jeśli bowiem umarli nie są wzbudzani, to i Chrystus nie jest wzbudzony."
"1Kor15,17": "A jeśli Chrystus nie jest wzbudzony, próżna jest wasza wiara; jeszcze jesteście w waszych grzechach;"
"1Kor15,18": "Zatem i ci, którzy zasnęli w Chrystusie, zginęli."
"1Kor15,19": "Jeśli tylko w tym życiu mamy nadzieję w Chrystusie, jesteśmy ze wszystkich ludzi najbardziej pożałowania godni."
"1Kor15,20": "Ale teraz Chrystus jest wzbudzony z martwych i stał się pierwociną tych, którzy zasnęli;"
"1Kor15,21": "Skoro bowiem przez człowieka przyszła śmierć, przez człowieka też przyjdzie powstanie z martwych."
"1Kor15,22": "Tak jak w Adamie wszyscy umierają, tak i w Chrystusie wszyscy zostaną ożywieni."
"1Kor15,23": "Każdy natomiast we własnym szyku: Jako pierwocina Chrystus, a potem ci, którzy są Chrystusa w czasie Jego przyjścia;"
"1Kor15,24": "Potem nastanie koniec, gdy przekaże Królestwo Bogu i Ojcu, gdy zniszczy wszelką zwierzchność i wszelką władzę, i moc."
"1Kor15,25": "Bo trzeba, aby On królował, dopóki nie położy wszystkich wrogów pod Jego stopy."
"1Kor15,26": "A jako ostatni wróg zostanie zniszczona śmierć."
"1Kor15,27": "Wszystko bowiem poddał pod Jego stopy. A gdy mówi, że wszystko jest poddane, to oczywistym jest, że oprócz Tego, który Mu wszystko poddał."
"1Kor15,28": "A gdy wszystko zostanie Mu poddane, wtedy też i sam Syn zostanie poddany Temu, który Mu wszystko poddał, aby Bóg był wszystkim we wszystkich."
"1Kor15,29": "Bo co uczynią ci, którzy są chrzczeni za umarłych? Jeśli umarli w ogóle nie są wzbudzani, to dlaczego są chrzczeni za umarłych?"
"1Kor15,30": "Dlaczego i my narażamy się na niebezpieczeństwa każdej godziny?"
"1Kor15,31": "Codziennie umieram na waszą chlubę, którą mam w Jezusie Chrystusie, Panu naszym."
"1Kor15,32": "Jeśli ja na sposób ludzki walczyłem w Efezie z dzikimi zwierzętami, jaką mam z tego korzyść, jeśli umarli nie są wzbudzani? Jedzmy i pijmy, bo jutro pomrzemy."
"1Kor15,33": "Nie dawajcie się wprowadzać w błąd; złe rozmowy niszczą dobre obyczaje."
"1Kor15,34": "Ocknijcie się dla sprawiedliwości i nie grzeszcie; niektórzy bowiem nie mają poznania Boga; mówię to dla waszego zawstydzenia."
"1Kor15,35": "Ale powie ktoś: A jak wzbudzani są umarli i w jakim ciele przychodzą?"
"1Kor15,36": "O nierozumny! To, co ty siejesz, nie jest ożywiane, jeśli nie obumrze."
"1Kor15,37": "A co siejesz, nie jest przecież tym ciałem, które ma wyrosnąć, ale siejesz nagie ziarno, trafi się pszeniczne lub jakieś z pozostałych;"
"1Kor15,38": "A Bóg daje mu ciało, takie jak chce, a każdemu z nasion – ciało jemu właściwe."
"1Kor15,39": "Nie każde ciało jest tym samym ciałem; ale istotnie inne jest ciało ludzi, a inne ciało zwierząt, jeszcze inne ryb, a inne ptaków."
"1Kor15,40": "I są ciała niebiańskie i ciała ziemskie; lecz istotnie inna jest chwała niebiańskich, a inna ziemskich;"
"1Kor15,41": "Inna chwała słońca, a inna chwała księżyca, i inna chwała gwiazd; bo gwiazda od gwiazdy różni się w chwale."
"1Kor15,42": "Tak jest i ze wzbudzeniem umarłych. Siane jest ciało w zniszczalności, wzbudzane jest w niezniszczalności;"
"1Kor15,43": "Siane jest w zniewadze, wzbudzane jest w chwale; siane jest w słabości, wzbudzane jest w mocy;"
"1Kor15,44": "Siane jest ciało duszą żyjące, wzbudzane jest ciało duchowe. Jeżeli jest ciało duszą żyjące, jest też ciało duchowe."
"1Kor15,45": "Tak też jest napisane: Stał się pierwszy człowiek Adam duszą żyjącą, a ostatni Adam duchem ożywiającym."
"1Kor15,46": "Jednak nie to, co duchowe jest pierwsze, lecz to, co duszą żyjące; potem to, co duchowe."
"1Kor15,47": "Pierwszy człowiek z ziemi jest ziemski; drugi człowiek – Pan z nieba."
"1Kor15,48": "Jaki ten ziemski, tacy i ziemscy ludzie; a jaki Ten niebiański, tacy i niebiańscy."
"1Kor15,49": "A tak jak nosiliśmy obraz tego ziemskiego człowieka, tak też będziemy nosić obraz Tego niebiańskiego."
"1Kor15,50": "To natomiast mówię, bracia, że ciało i krew nie mogą odziedziczyć Królestwa Bożego, ani to, co zniszczalne nie może odziedziczyć niezniszczalności."
"1Kor15,51": "Oto oznajmiam wam tajemnicę: Nie wszyscy zaśniemy, ale wszyscy zostaniemy przemienieni,"
"1Kor15,52": "W jednej chwili, w mgnieniu oka, podczas ostatniej trąby; bowiem zatrąbi trąba, a umarli zostaną wzbudzeni jako niezniszczalni, a my zostaniemy przemienieni."
"1Kor15,53": "Trzeba bowiem, aby to, co zniszczalne, przyoblekło niezniszczalność, a to, co śmiertelne, przyoblekło nieśmiertelność."
"1Kor15,54": "A gdy to, co zniszczalne, przyoblecze niezniszczalność, a to, co śmiertelne, przyoblecze nieśmiertelność, wtedy wypełni się słowo, które jest zapisane: Pochłonięta została śmierć w zwycięstwie."
"1Kor15,55": "Gdzie jest, o śmierci, twoje żądło? Gdzie, o Hadesie, twoje zwycięstwo?"
"1Kor15,56": "Lecz żądłem śmierci jest grzech, a mocą grzechu jest Prawo."
"1Kor15,57": "Ale Bogu niech będzie wdzięczność, który daje nam zwycięstwo przez Pana naszego Jezusa Chrystusa."
"1Kor15,58": "A tak, bracia moi umiłowani, stawajcie się stali, niewzruszeni, zawsze obfitujący w dziele Pana, wiedząc, że trud wasz nie jest daremny w Panu."
