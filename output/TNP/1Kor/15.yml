"1Kor15,1":
  text: "A daję wam dogłębnie poznać, bracia, Ewangelię, którą wam ogłosiłem, którą też przyjęliście i w której stoicie,"
  tags: []
"1Kor15,2":
  text: "Przez którą też jesteście zbawiani, jeśli trzymacie się jej w tym Słowie, które wam ogłosiłem jako dobrą nowinę, chyba że na próżno uwierzyliście."
  tags: []
"1Kor15,3":
  text: "Albowiem na początku przekazałem wam to, co sam przejąłem, że Chrystus umarł za nasze grzechy według Pism,"
  tags: []
"1Kor15,4":
  text: "I że został pogrzebany, i że został wzbudzony trzeciego dnia według Pism,"
  tags: []
"1Kor15,5":
  text: "I że został ukazany Kefasowi, a potem dwunastu."
  tags: []
"1Kor15,6":
  text: "Potem został ukazany więcej niż pięciuset braciom naraz, z których większość pozostaje przy życiu, a niektórzy zasnęli."
  tags: []
"1Kor15,7":
  text: "Potem ukazał się Jakubowi, potem wszystkim apostołom."
  tags: []
"1Kor15,8":
  text: "A na końcu po wszystkich, ukazał się i mnie, jakby poronionemu płodowi."
  tags: []
"1Kor15,9":
  text: "Ja bowiem jestem najmniejszy z apostołów i nie jestem godny, aby być nazywanym apostołem, ponieważ prześladowałem zbór Boga."
  tags: []
"1Kor15,10":
  text: "Lecz z łaski Boga jestem tym, kim jestem, a łaska Jego wobec mnie nie stała się daremna; lecz bardziej niż oni wszyscy trudziłem się, jednak nie ja, lecz łaska Boga, która jest ze mną."
  tags: []
"1Kor15,11":
  text: "Dlatego czy to ja, czy tamci, w ten sposób głosimy i tak uwierzyliście."
  tags: []
"1Kor15,12":
  text: "A jeżeli o Chrystusie głosi się, że jest wzbudzony z martwych, jakże więc mówią niektórzy między wami, że nie ma zmartwychwstania?"
  tags: []
"1Kor15,13":
  text: "Jeśli natomiast nie ma zmartwychwstania, to i Chrystus nie jest wzbudzony."
  tags: []
"1Kor15,14":
  text: "A jeśli Chrystus nie jest wzbudzony, wtedy i próżne jest nasze głoszenie, próżna też jest nasza wiara,"
  tags: []
"1Kor15,15":
  text: "I jesteśmy też uznani za fałszywych świadków Boga, bo świadczyliśmy o Bogu, że wzbudził Chrystusa, którego nie wzbudził, skoro umarli nie są wzbudzani."
  tags: []
"1Kor15,16":
  text: "Jeśli bowiem umarli nie są wzbudzani, to i Chrystus nie jest wzbudzony."
  tags: []
"1Kor15,17":
  text: "A jeśli Chrystus nie jest wzbudzony, próżna jest wasza wiara; jeszcze jesteście w waszych grzechach;"
  tags: []
"1Kor15,18":
  text: "Zatem i ci, którzy zasnęli w Chrystusie, zginęli."
  tags: []
"1Kor15,19":
  text: "Jeśli tylko w tym życiu mamy nadzieję w Chrystusie, jesteśmy ze wszystkich ludzi najbardziej pożałowania godni."
  tags: []
"1Kor15,20":
  text: "Ale teraz Chrystus jest wzbudzony z martwych i stał się pierwociną tych, którzy zasnęli;"
  tags: []
"1Kor15,21":
  text: "Skoro bowiem przez człowieka przyszła śmierć, przez człowieka też przyjdzie powstanie z martwych."
  tags: []
"1Kor15,22":
  text: "Tak jak w Adamie wszyscy umierają, tak i w Chrystusie wszyscy zostaną ożywieni."
  tags: []
"1Kor15,23":
  text: "Każdy natomiast we własnym szyku: Jako pierwocina Chrystus, a potem ci, którzy są Chrystusa w czasie Jego przyjścia;"
  tags: []
"1Kor15,24":
  text: "Potem nastanie koniec, gdy przekaże Królestwo Bogu i Ojcu, gdy zniszczy wszelką zwierzchność i wszelką władzę, i moc."
  tags: []
"1Kor15,25":
  text: "Bo trzeba, aby On królował, dopóki nie położy wszystkich wrogów pod Jego stopy."
  tags: []
"1Kor15,26":
  text: "A jako ostatni wróg zostanie zniszczona śmierć."
  tags: []
"1Kor15,27":
  text: "Wszystko bowiem poddał pod Jego stopy. A gdy mówi, że wszystko jest poddane, to oczywistym jest, że oprócz Tego, który Mu wszystko poddał."
  tags: []
"1Kor15,28":
  text: "A gdy wszystko zostanie Mu poddane, wtedy też i sam Syn zostanie poddany Temu, który Mu wszystko poddał, aby Bóg był wszystkim we wszystkich."
  tags: []
"1Kor15,29":
  text: "Bo co uczynią ci, którzy są chrzczeni za umarłych? Jeśli umarli w ogóle nie są wzbudzani, to dlaczego są chrzczeni za umarłych?"
  tags: []
"1Kor15,30":
  text: "Dlaczego i my narażamy się na niebezpieczeństwa każdej godziny?"
  tags: []
"1Kor15,31":
  text: "Codziennie umieram na waszą chlubę, którą mam w Jezusie Chrystusie, Panu naszym."
  tags: []
"1Kor15,32":
  text: "Jeśli ja na sposób ludzki walczyłem w Efezie z dzikimi zwierzętami, jaką mam z tego korzyść, jeśli umarli nie są wzbudzani? Jedzmy i pijmy, bo jutro pomrzemy."
  tags: []
"1Kor15,33":
  text: "Nie dawajcie się wprowadzać w błąd; złe rozmowy niszczą dobre obyczaje."
  tags: []
"1Kor15,34":
  text: "Ocknijcie się dla sprawiedliwości i nie grzeszcie; niektórzy bowiem nie mają poznania Boga; mówię to dla waszego zawstydzenia."
  tags: []
"1Kor15,35":
  text: "Ale powie ktoś: A jak wzbudzani są umarli i w jakim ciele przychodzą?"
  tags: []
"1Kor15,36":
  text: "O nierozumny! To, co ty siejesz, nie jest ożywiane, jeśli nie obumrze."
  tags: []
"1Kor15,37":
  text: "A co siejesz, nie jest przecież tym ciałem, które ma wyrosnąć, ale siejesz nagie ziarno, trafi się pszeniczne lub jakieś z pozostałych;"
  tags: []
"1Kor15,38":
  text: "A Bóg daje mu ciało, takie jak chce, a każdemu z nasion – ciało jemu właściwe."
  tags: []
"1Kor15,39":
  text: "Nie każde ciało jest tym samym ciałem; ale istotnie inne jest ciało ludzi, a inne ciało zwierząt, jeszcze inne ryb, a inne ptaków."
  tags: []
"1Kor15,40":
  text: "I są ciała niebiańskie i ciała ziemskie; lecz istotnie inna jest chwała niebiańskich, a inna ziemskich;"
  tags: []
"1Kor15,41":
  text: "Inna chwała słońca, a inna chwała księżyca, i inna chwała gwiazd; bo gwiazda od gwiazdy różni się w chwale."
  tags: []
"1Kor15,42":
  text: "Tak jest i ze wzbudzeniem umarłych. Siane jest ciało w zniszczalności, wzbudzane jest w niezniszczalności;"
  tags: []
"1Kor15,43":
  text: "Siane jest w zniewadze, wzbudzane jest w chwale; siane jest w słabości, wzbudzane jest w mocy;"
  tags: []
"1Kor15,44":
  text: "Siane jest ciało duszą żyjące, wzbudzane jest ciało duchowe. Jeżeli jest ciało duszą żyjące, jest też ciało duchowe."
  tags: []
"1Kor15,45":
  text: "Tak też jest napisane: Stał się pierwszy człowiek Adam duszą żyjącą, a ostatni Adam duchem ożywiającym."
  tags: []
"1Kor15,46":
  text: "Jednak nie to, co duchowe jest pierwsze, lecz to, co duszą żyjące; potem to, co duchowe."
  tags: []
"1Kor15,47":
  text: "Pierwszy człowiek z ziemi jest ziemski; drugi człowiek – Pan z nieba."
  tags: []
"1Kor15,48":
  text: "Jaki ten ziemski, tacy i ziemscy ludzie; a jaki Ten niebiański, tacy i niebiańscy."
  tags: []
"1Kor15,49":
  text: "A tak jak nosiliśmy obraz tego ziemskiego człowieka, tak też będziemy nosić obraz Tego niebiańskiego."
  tags: []
"1Kor15,50":
  text: "To natomiast mówię, bracia, że ciało i krew nie mogą odziedziczyć Królestwa Bożego, ani to, co zniszczalne nie może odziedziczyć niezniszczalności."
  tags: []
"1Kor15,51":
  text: "Oto oznajmiam wam tajemnicę: Nie wszyscy zaśniemy, ale wszyscy zostaniemy przemienieni,"
  tags: []
"1Kor15,52":
  text: "W jednej chwili, w mgnieniu oka, podczas ostatniej trąby; bowiem zatrąbi trąba, a umarli zostaną wzbudzeni jako niezniszczalni, a my zostaniemy przemienieni."
  tags: []
"1Kor15,53":
  text: "Trzeba bowiem, aby to, co zniszczalne, przyoblekło niezniszczalność, a to, co śmiertelne, przyoblekło nieśmiertelność."
  tags: []
"1Kor15,54":
  text: "A gdy to, co zniszczalne, przyoblecze niezniszczalność, a to, co śmiertelne, przyoblecze nieśmiertelność, wtedy wypełni się słowo, które jest zapisane: Pochłonięta została śmierć w zwycięstwie."
  tags: []
"1Kor15,55":
  text: "Gdzie jest, o śmierci, twoje żądło? Gdzie, o Hadesie, twoje zwycięstwo?"
  tags: []
"1Kor15,56":
  text: "Lecz żądłem śmierci jest grzech, a mocą grzechu jest Prawo."
  tags: []
"1Kor15,57":
  text: "Ale Bogu niech będzie wdzięczność, który daje nam zwycięstwo przez Pana naszego Jezusa Chrystusa."
  tags: []
"1Kor15,58":
  text: "A tak, bracia moi umiłowani, stawajcie się stali, niewzruszeni, zawsze obfitujący w dziele Pana, wiedząc, że trud wasz nie jest daremny w Panu."
  tags: []
