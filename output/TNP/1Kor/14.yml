"1Kor14,1":
  text: "Zabiegajcie o taką miłość; starajcie się też usilnie o to, co duchowe; a bardziej o to, by prorokować."
  tags: []
"1Kor14,2":
  text: "Albowiem kto mówi innym językiem, nie ludziom mówi, lecz Bogu; nikt go bowiem nie słucha, a on w duchu mówi tajemnice."
  tags: []
"1Kor14,3":
  text: "Ale kto prorokuje, mówi ludziom ku zbudowaniu, zachęceniu i pocieszeniu."
  tags: []
"1Kor14,4":
  text: "Kto mówi innym językiem, buduje samego siebie; a kto prorokuje, ten buduje zbór."
  tags: []
"1Kor14,5":
  text: "A chciałbym, abyście wszyscy mówili innymi językami, lecz bardziej, abyście prorokowali; większy bowiem jest ten, który prorokuje, niż ten, który mówi innymi językami, chyba żeby tłumaczył, by zbór otrzymał zbudowanie."
  tags: []
"1Kor14,6":
  text: "A teraz, bracia, jeśli przyszedłbym do was, mówiąc innymi językami, na co bym się wam przydał, jeśli nie mówiłbym do was, czy to w ramach objawienia, czy poznania, czy prorokowania, czy nauki?"
  tags: []
"1Kor14,7":
  text: "Przecież i rzeczy martwe, które wydają dźwięki, jak flet albo cytra, gdyby nie wydały różnych dźwięków, jak dałoby się rozpoznać, co jest grane na flecie, a co na cytrze?"
  tags: []
"1Kor14,8":
  text: "Jeśli bowiem trąba wydaje niewyraźny dźwięk, kto będzie gotować się do wojny?"
  tags: []
"1Kor14,9":
  text: "Tak i wy, jeśli w innym języku nie wydacie słowa zrozumiałego, to jak można rozpoznać, co zostało powiedziane? Mówić bowiem będziecie na wiatr."
  tags: []
"1Kor14,10":
  text: "Jest tak wiele przykładów dźwięków na świecie, i nic nie jest bez dźwięku."
  tags: []
"1Kor14,11":
  text: "Jeślibym nie znał znaczenia słów będę dla tego, do którego mówię, cudzoziemcem; a ten, który do mnie mówi, będzie dla mnie cudzoziemcem."
  tags: []
"1Kor14,12":
  text: "Tak i wy, skoro jesteście zapaleńcami duchów, pragnijcie obfitować w te, które budują zbór."
  tags: []
"1Kor14,13":
  text: "Dlatego ten, kto mówi innym językiem, niech się modli, aby mógł tłumaczyć."
  tags: []
"1Kor14,14":
  text: "Bo jeśli modlę się innym językiem, modli się mój duch; ale rozum mój jest bezowocny."
  tags: []
"1Kor14,15":
  text: "Co zatem jest? Będę modlił się duchem, będę modlił się i rozumem; będę śpiewał duchem, będę też śpiewał rozumem."
  tags: []
"1Kor14,16":
  text: "Stąd, jeśli będziesz błogosławił duchem, w jaki sposób, zajmujący miejsce prosty człowiek, powie na twoje dziękczynienie: „Amen”, skoro nie rozumie, co mówisz?"
  tags: []
"1Kor14,17":
  text: "Ty wprawdzie pięknie dziękujesz, ale inny się nie buduje."
  tags: []
"1Kor14,18":
  text: "Dziękuję Bogu, że ja więcej, niż wy wszyscy, mówię innymi językami."
  tags: []
"1Kor14,19":
  text: "A w zborze wolę powiedzieć pięć słów za pomocą mojego rozumu, aby i innych pouczyć, niż dziesięć tysięcy słów w języku niezrozumiałym."
  tags: []
"1Kor14,20":
  text: "Bracia! Nie stawajcie się dziećmi w myśleniu, ale bądźcie niemowlętami w tym, co złe; a w myśleniu stawajcie się dojrzali."
  tags: []
"1Kor14,21":
  text: "W Prawie jest napisane: W obcych językach i przez usta obcych będę mówić do tego ludu; ale i tak mnie nie usłuchają, mówi PAN."
  tags: []
"1Kor14,22":
  text: "Zatem inne języki są znakiem czy nie dla wierzących, czy raczej dla niewierzących; a prorokowanie czy nie dla niewierzących, czy raczej dla wierzących,"
  tags: []
"1Kor14,23":
  text: "Jeżeli więc zszedłby się cały zbór na jedno miejsce, i wszyscy mówiliby innymi językami, a weszliby tam jacyś prości ludzie albo jacyś niewierzący, czy nie powiedzą, że szalejecie?"
  tags: []
"1Kor14,24":
  text: "A jeśliby wszyscy prorokowali, a wszedłby ktoś niewierzący albo jakiś prosty człowiek, to jest przez wszystkich przekonywany, i przez wszystkich rozsądzany."
  tags: []
"1Kor14,25":
  text: "I tak sprawy ukryte w jego sercu stają się jawne, i tak padając na twarz, odda pokłon Bogu, oznajmiając, że prawdziwie Bóg jest w was."
  tags: []
"1Kor14,26":
  text: "Cóż więc, bracia? Gdy schodzicie się, każdy z was ma psalm, ma naukę, ma objawienie, ma inne języki, ma tłumaczenie; wszystko to niech się dzieje ku zbudowaniu."
  tags: []
"1Kor14,27":
  text: "Jeżeli ktoś mówi innym językiem, to niech mówią po kolei, dwóch lub najwięcej trzech, a jeden niech tłumaczy."
  tags: []
"1Kor14,28":
  text: "A jeżeli nie ma tłumacza, to niech milczy w zborze, a mówi sobie samemu i Bogu."
  tags: []
"1Kor14,29":
  text: "Prorocy natomiast niech mówią dwaj albo trzej, a inni niech rozsądzają."
  tags: []
"1Kor14,30":
  text: "A jeżeli inny z siedzących otrzyma objawienie, ten pierwszy niech milczy."
  tags: []
"1Kor14,31":
  text: "Bo wszyscy możecie pojedynczo prorokować, aby wszyscy się uczyli i wszyscy doznawali zachęty."
  tags: []
"1Kor14,32":
  text: "A duchy proroków są poddane prorokom;"
  tags: []
"1Kor14,33":
  text: "Albowiem Bóg nie jest Bogiem nieporządku, ale pokoju. Jak we wszystkich zborach świętych,"
  tags: []
"1Kor14,34":
  text: "Kobiety wasze niech milczą w zborach; albowiem nie pozwala się im mówić, lecz mają być podporządkowane, tak jak mówi Prawo."
  tags: []
"1Kor14,35":
  text: "A jeśli chcą się czegoś nauczyć, niech pytają w domu swoich mężów, bo hańbiące dla kobiet jest mówić w zborze."
  tags: []
"1Kor14,36":
  text: "Czy od was wyszło Słowo Boże? Czy tylko do was jedynych przyszło?"
  tags: []
"1Kor14,37":
  text: "Jeśli ktoś uważa, że jest prorokiem lub człowiekiem duchowym, niech poznaje dokładnie, że to, co wam piszę, są to polecenia Pana."
  tags: []
"1Kor14,38":
  text: "A jeśli ktoś tego nie uznaje, niech nie uznaje."
  tags: []
"1Kor14,39":
  text: "A tak, bracia, starajcie się usilnie, aby prorokować i nie zabraniajcie mówić innymi językami."
  tags: []
"1Kor14,40":
  text: "Wszystko niech się dzieje godnie i zgodnie z porządkiem."
  tags: []
