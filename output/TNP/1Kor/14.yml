"1Kor14,1": "Zabiegajcie o taką miłość; starajcie się też usilnie o to, co duchowe; a bardziej o to, by prorokować."
"1Kor14,2": "Albowiem kto mówi innym językiem, nie ludziom mówi, lecz Bogu; nikt go bowiem nie słucha, a on w duchu mówi tajemnice."
"1Kor14,3": "Ale kto prorokuje, mówi ludziom ku zbudowaniu, zachęceniu i pocieszeniu."
"1Kor14,4": "Kto mówi innym językiem, buduje samego siebie; a kto prorokuje, ten buduje zbór."
"1Kor14,5": "A chciałbym, abyście wszyscy mówili innymi językami, lecz bardziej, abyście prorokowali; większy bowiem jest ten, który prorokuje, niż ten, który mówi innymi językami, chyba żeby tłumaczył, by zbór otrzymał zbudowanie."
"1Kor14,6": "A teraz, bracia, jeśli przyszedłbym do was, mówiąc innymi językami, na co bym się wam przydał, jeśli nie mówiłbym do was, czy to w ramach objawienia, czy poznania, czy prorokowania, czy nauki?"
"1Kor14,7": "Przecież i rzeczy martwe, które wydają dźwięki, jak flet albo cytra, gdyby nie wydały różnych dźwięków, jak dałoby się rozpoznać, co jest grane na flecie, a co na cytrze?"
"1Kor14,8": "Jeśli bowiem trąba wydaje niewyraźny dźwięk, kto będzie gotować się do wojny?"
"1Kor14,9": "Tak i wy, jeśli w innym języku nie wydacie słowa zrozumiałego, to jak można rozpoznać, co zostało powiedziane? Mówić bowiem będziecie na wiatr."
"1Kor14,10": "Jest tak wiele przykładów dźwięków na świecie, i nic nie jest bez dźwięku."
"1Kor14,11": "Jeślibym nie znał znaczenia słów będę dla tego, do którego mówię, cudzoziemcem; a ten, który do mnie mówi, będzie dla mnie cudzoziemcem."
"1Kor14,12": "Tak i wy, skoro jesteście zapaleńcami duchów, pragnijcie obfitować w te, które budują zbór."
"1Kor14,13": "Dlatego ten, kto mówi innym językiem, niech się modli, aby mógł tłumaczyć."
"1Kor14,14": "Bo jeśli modlę się innym językiem, modli się mój duch; ale rozum mój jest bezowocny."
"1Kor14,15": "Co zatem jest? Będę modlił się duchem, będę modlił się i rozumem; będę śpiewał duchem, będę też śpiewał rozumem."
"1Kor14,16": "Stąd, jeśli będziesz błogosławił duchem, w jaki sposób, zajmujący miejsce prosty człowiek, powie na twoje dziękczynienie: „Amen”, skoro nie rozumie, co mówisz?"
"1Kor14,17": "Ty wprawdzie pięknie dziękujesz, ale inny się nie buduje."
"1Kor14,18": "Dziękuję Bogu, że ja więcej, niż wy wszyscy, mówię innymi językami."
"1Kor14,19": "A w zborze wolę powiedzieć pięć słów za pomocą mojego rozumu, aby i innych pouczyć, niż dziesięć tysięcy słów w języku niezrozumiałym."
"1Kor14,20": "Bracia! Nie stawajcie się dziećmi w myśleniu, ale bądźcie niemowlętami w tym, co złe; a w myśleniu stawajcie się dojrzali."
"1Kor14,21": "W Prawie jest napisane: W obcych językach i przez usta obcych będę mówić do tego ludu; ale i tak mnie nie usłuchają, mówi PAN."
"1Kor14,22": "Zatem inne języki są znakiem czy nie dla wierzących, czy raczej dla niewierzących; a prorokowanie czy nie dla niewierzących, czy raczej dla wierzących,"
"1Kor14,23": "Jeżeli więc zszedłby się cały zbór na jedno miejsce, i wszyscy mówiliby innymi językami, a weszliby tam jacyś prości ludzie albo jacyś niewierzący, czy nie powiedzą, że szalejecie?"
"1Kor14,24": "A jeśliby wszyscy prorokowali, a wszedłby ktoś niewierzący albo jakiś prosty człowiek, to jest przez wszystkich przekonywany, i przez wszystkich rozsądzany."
"1Kor14,25": "I tak sprawy ukryte w jego sercu stają się jawne, i tak padając na twarz, odda pokłon Bogu, oznajmiając, że prawdziwie Bóg jest w was."
"1Kor14,26": "Cóż więc, bracia? Gdy schodzicie się, każdy z was ma psalm, ma naukę, ma objawienie, ma inne języki, ma tłumaczenie; wszystko to niech się dzieje ku zbudowaniu."
"1Kor14,27": "Jeżeli ktoś mówi innym językiem, to niech mówią po kolei, dwóch lub najwięcej trzech, a jeden niech tłumaczy."
"1Kor14,28": "A jeżeli nie ma tłumacza, to niech milczy w zborze, a mówi sobie samemu i Bogu."
"1Kor14,29": "Prorocy natomiast niech mówią dwaj albo trzej, a inni niech rozsądzają."
"1Kor14,30": "A jeżeli inny z siedzących otrzyma objawienie, ten pierwszy niech milczy."
"1Kor14,31": "Bo wszyscy możecie pojedynczo prorokować, aby wszyscy się uczyli i wszyscy doznawali zachęty."
"1Kor14,32": "A duchy proroków są poddane prorokom;"
"1Kor14,33": "Albowiem Bóg nie jest Bogiem nieporządku, ale pokoju. Jak we wszystkich zborach świętych,"
"1Kor14,34": "Kobiety wasze niech milczą w zborach; albowiem nie pozwala się im mówić, lecz mają być podporządkowane, tak jak mówi Prawo."
"1Kor14,35": "A jeśli chcą się czegoś nauczyć, niech pytają w domu swoich mężów, bo hańbiące dla kobiet jest mówić w zborze."
"1Kor14,36": "Czy od was wyszło Słowo Boże? Czy tylko do was jedynych przyszło?"
"1Kor14,37": "Jeśli ktoś uważa, że jest prorokiem lub człowiekiem duchowym, niech poznaje dokładnie, że to, co wam piszę, są to polecenia Pana."
"1Kor14,38": "A jeśli ktoś tego nie uznaje, niech nie uznaje."
"1Kor14,39": "A tak, bracia, starajcie się usilnie, aby prorokować i nie zabraniajcie mówić innymi językami."
"1Kor14,40": "Wszystko niech się dzieje godnie i zgodnie z porządkiem."
