"1Kor16,1": "A co do składki na świętych, i wy czyńcie tak, jak zarządziłem w zborach Galacji."
"1Kor16,2": "Pierwszego dnia tygodnia, niech każdy z was odkłada u siebie gromadząc według tego, jak mu się powodzi, żeby nie czynić składek dopiero wtedy, kiedy przyjdę."
"1Kor16,3": "A gdy przybędę, tych, których uznacie za wypróbowanych, poślę z listami, aby odnieśli wasz dar do Jerozolimy."
"1Kor16,4": "A jeśli byłoby słuszne, bym i ja miał iść, pójdą razem ze mną."
"1Kor16,5": "A przyjdę do was, gdy przejdę Macedonię, bo przemierzam Macedonię."
"1Kor16,6": "U was natomiast, być może pozostanę, albo i przezimuję, abyście wy mnie wyprawili w drogę, gdziekolwiek pójdę."
"1Kor16,7": "Nie chciałbym bowiem, teraz przechodząc, tylko was zobaczyć; ale mam nadzieję zatrzymać się u was przez jakiś czas, jeśli Pan pozwoli."
"1Kor16,8": "A zostanę w Efezie aż do Pięćdziesiątnicy."
"1Kor16,9": "Otworzyły się bowiem przede mną szeroko drzwi do działania, a sprzeciwiających się jest wielu."
"1Kor16,10": "A jeśli przyjdzie Tymoteusz, uważajcie, aby przebywał u was bez obaw, bo dzieło Pana sprawuje, jak i ja."
"1Kor16,11": "Niech go nikt nie lekceważy; ale wyprawcie go w drogę w pokoju, aby przyszedł do mnie; bo czekam na niego z braćmi."
"1Kor16,12": "A co do brata Apollosa, to bardzo go zachęciłem, aby poszedł do was z braćmi; ale w ogóle nie było wolą Boga, aby teraz miał przyjść; przyjdzie jednak w dogodnym czasie."
"1Kor16,13": "Czuwajcie, trwajcie w wierze, bądźcie mężni, umacniajcie się;"
"1Kor16,14": "Wszystko u was niech się dzieje w miłości."
"1Kor16,15": "A zachęcam was, bracia: wiecie, że dom Stefana jest pierwociną Achai, i że sami siebie stawili do służby świętym,"
"1Kor16,16": "Bądźcie poddani takim ludziom i każdemu współpracującemu i trudzącemu się."
"1Kor16,17": "A cieszę się z przyjścia Stefana i Fortunata, i Achaika, że wasz brak oni wypełnili;"
"1Kor16,18": "Pokrzepili bowiem mojego i waszego ducha; miejcie uznanie dla takich."
"1Kor16,19": "Pozdrawiają was zbory, które są w Azji. Pozdrawiają was bardzo w Panu Akwila i Pryscylla, ze zborem, który jest w ich domu."
"1Kor16,20": "Pozdrawiają was wszyscy bracia. Jedni drugich pozdrówcie pocałunkiem świętym."
"1Kor16,21": "Pozdrowienie – moją – Pawła ręką dopisuję."
"1Kor16,22": "Jeśli ktoś nie miłuje Pana Jezusa Chrystusa, niech będzie wyklęty, Maran atha."
"1Kor16,23": "Łaska Pana Jezusa Chrystusa z wami."
"1Kor16,24": "Miłość moja niech będzie z wami wszystkimi w Chrystusie Jezusie. Amen."
