"1Kor16,1":
  text: "A co do składki na świętych, i wy czyńcie tak, jak zarządziłem w zborach Galacji."
  tags: []
"1Kor16,2":
  text: "Pierwszego dnia tygodnia, niech każdy z was odkłada u siebie gromadząc według tego, jak mu się powodzi, żeby nie czynić składek dopiero wtedy, kiedy przyjdę."
  tags: []
"1Kor16,3":
  text: "A gdy przybędę, tych, których uznacie za wypróbowanych, poślę z listami, aby odnieśli wasz dar do Jerozolimy."
  tags: []
"1Kor16,4":
  text: "A jeśli byłoby słuszne, bym i ja miał iść, pójdą razem ze mną."
  tags: []
"1Kor16,5":
  text: "A przyjdę do was, gdy przejdę Macedonię, bo przemierzam Macedonię."
  tags: []
"1Kor16,6":
  text: "U was natomiast, być może pozostanę, albo i przezimuję, abyście wy mnie wyprawili w drogę, gdziekolwiek pójdę."
  tags: []
"1Kor16,7":
  text: "Nie chciałbym bowiem, teraz przechodząc, tylko was zobaczyć; ale mam nadzieję zatrzymać się u was przez jakiś czas, jeśli Pan pozwoli."
  tags: []
"1Kor16,8":
  text: "A zostanę w Efezie aż do Pięćdziesiątnicy."
  tags: []
"1Kor16,9":
  text: "Otworzyły się bowiem przede mną szeroko drzwi do działania, a sprzeciwiających się jest wielu."
  tags: []
"1Kor16,10":
  text: "A jeśli przyjdzie Tymoteusz, uważajcie, aby przebywał u was bez obaw, bo dzieło Pana sprawuje, jak i ja."
  tags: []
"1Kor16,11":
  text: "Niech go nikt nie lekceważy; ale wyprawcie go w drogę w pokoju, aby przyszedł do mnie; bo czekam na niego z braćmi."
  tags: []
"1Kor16,12":
  text: "A co do brata Apollosa, to bardzo go zachęciłem, aby poszedł do was z braćmi; ale w ogóle nie było wolą Boga, aby teraz miał przyjść; przyjdzie jednak w dogodnym czasie."
  tags: []
"1Kor16,13":
  text: "Czuwajcie, trwajcie w wierze, bądźcie mężni, umacniajcie się;"
  tags: []
"1Kor16,14":
  text: "Wszystko u was niech się dzieje w miłości."
  tags: []
"1Kor16,15":
  text: "A zachęcam was, bracia: wiecie, że dom Stefana jest pierwociną Achai, i że sami siebie stawili do służby świętym,"
  tags: []
"1Kor16,16":
  text: "Bądźcie poddani takim ludziom i każdemu współpracującemu i trudzącemu się."
  tags: []
"1Kor16,17":
  text: "A cieszę się z przyjścia Stefana i Fortunata, i Achaika, że wasz brak oni wypełnili;"
  tags: []
"1Kor16,18":
  text: "Pokrzepili bowiem mojego i waszego ducha; miejcie uznanie dla takich."
  tags: []
"1Kor16,19":
  text: "Pozdrawiają was zbory, które są w Azji. Pozdrawiają was bardzo w Panu Akwila i Pryscylla, ze zborem, który jest w ich domu."
  tags: []
"1Kor16,20":
  text: "Pozdrawiają was wszyscy bracia. Jedni drugich pozdrówcie pocałunkiem świętym."
  tags: []
"1Kor16,21":
  text: "Pozdrowienie – moją – Pawła ręką dopisuję."
  tags: []
"1Kor16,22":
  text: "Jeśli ktoś nie miłuje Pana Jezusa Chrystusa, niech będzie wyklęty, Maran atha."
  tags: []
"1Kor16,23":
  text: "Łaska Pana Jezusa Chrystusa z wami."
  tags: []
"1Kor16,24":
  text: "Miłość moja niech będzie z wami wszystkimi w Chrystusie Jezusie. Amen."
  tags: []
