"1Kor6,1":
  text: "Czy śmie ktoś z was, mając sprawę z drugim, być sądzonym przed niesprawiedliwymi, a nie przed świętymi?"
  tags: []
"1Kor6,2":
  text: "Czy nie wiecie, że święci będą sądzić świat? A jeżeli świat przez was jest sądzony, to czy jesteście niegodni sądzić w sprawach pomniejszych?"
  tags: []
"1Kor6,3":
  text: "Czy nie wiecie, że będziemy sądzić aniołów? A co dopiero sprawy życiowe?"
  tags: []
"1Kor6,4":
  text: "Wy więc, jeśli macie sprawy życiowe do osądzenia, to tych, którzy są bez znaczenia w zborze, sadzacie jako sędziów?"
  tags: []
"1Kor6,5":
  text: "Dla zawstydzenia was to mówię. Czy nie ma między wami ani jednego mądrego, który mógłby rozsądzić pomiędzy swoim jednym a drugim bratem?"
  tags: []
"1Kor6,6":
  text: "Ale brat z bratem sądzi się i to przed niewierzącymi!"
  tags: []
"1Kor6,7":
  text: "Już to więc jest całkowitą porażką dla was, że macie ze sobą sprawy sądowe. Czemu raczej nie znosicie niesprawiedliwości? Czemu raczej nie ponosicie szkody?"
  tags: []
"1Kor6,8":
  text: "Ale wy popełniacie niesprawiedliwość, wyrządzacie szkodę i to braciom."
  tags: []
"1Kor6,9":
  text: "Czy nie wiecie, że niesprawiedliwi nie odziedziczą Królestwa Bożego? Nie dajcie się wprowadzać w błąd; ani nierządnicy, ani bałwochwalcy, ani cudzołożnicy, ani zniewieściali, ani homoseksualiści,"
  tags: []
"1Kor6,10":
  text: "Ani złodzieje, ani chciwcy, ani pijacy, ani oszczercy, ani zdziercy nie odziedziczą Królestwa Bożego."
  tags: []
"1Kor6,11":
  text: "A niektórzy z was takimi byli; ale obmyliście się; ale zostaliście poświęceni; ale zostaliście uznani za sprawiedliwych w imieniu Pana Jezusa i w Duchu Boga naszego."
  tags: []
"1Kor6,12":
  text: "Wszystko mi wolno, ale nie wszystko jest pożyteczne; wszystko mi wolno, ale ja nie będę przez coś owładnięty."
  tags: []
"1Kor6,13":
  text: "Pokarm jest dla brzucha, a brzuch jest dla pokarmów, ale Bóg i jedno i drugie zniszczy; ciało natomiast nie jest dla nierządu, ale dla Pana, a Pan dla ciała."
  tags: []
"1Kor6,14":
  text: "Bóg natomiast i Pana wskrzesił, i nas wzbudzi przez Jego moc."
  tags: []
"1Kor6,15":
  text: "Czy nie wiecie, że ciała wasze są członkami Chrystusa? Czy mam więc wziąć członki Chrystusa i uczynić je członkami nierządnicy? Z pewnością nie!"
  tags: []
"1Kor6,16":
  text: "Czy nie wiecie, że ten, kto jest złączony z nierządnicą, jest z nią jednym ciałem? Będą bowiem – mówi Pismo – ci dwoje jednym ciałem."
  tags: []
"1Kor6,17":
  text: "Ale kto łączy się z Panem, jest z Nim jednym duchem."
  tags: []
"1Kor6,18":
  text: "Uciekajcie przed nierządem. Wszelki grzech, który uczyniłby człowiek, jest poza ciałem; lecz oddający się nierządowi, grzeszy względem własnego ciała."
  tags: []
"1Kor6,19":
  text: "Czy nie wiecie, że ciało wasze jest świątynią Ducha Świętego, który jest w was, którego macie od Boga, i nie należycie do siebie samych?"
  tags: []
"1Kor6,20":
  text: "Drogo bowiem jesteście kupieni. Oddajcie więc chwałę Bogu w ciele waszym i w duchu waszym, one są Boże."
  tags: []
