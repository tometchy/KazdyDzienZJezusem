"1Kor6,1": "Czy śmie ktoś z was, mając sprawę z drugim, być sądzonym przed niesprawiedliwymi, a nie przed świętymi?"
"1Kor6,2": "Czy nie wiecie, że święci będą sądzić świat? A jeżeli świat przez was jest sądzony, to czy jesteście niegodni sądzić w sprawach pomniejszych?"
"1Kor6,3": "Czy nie wiecie, że będziemy sądzić aniołów? A co dopiero sprawy życiowe?"
"1Kor6,4": "Wy więc, jeśli macie sprawy życiowe do osądzenia, to tych, którzy są bez znaczenia w zborze, sadzacie jako sędziów?"
"1Kor6,5": "Dla zawstydzenia was to mówię. Czy nie ma między wami ani jednego mądrego, który mógłby rozsądzić pomiędzy swoim jednym a drugim bratem?"
"1Kor6,6": "Ale brat z bratem sądzi się i to przed niewierzącymi!"
"1Kor6,7": "Już to więc jest całkowitą porażką dla was, że macie ze sobą sprawy sądowe. Czemu raczej nie znosicie niesprawiedliwości? Czemu raczej nie ponosicie szkody?"
"1Kor6,8": "Ale wy popełniacie niesprawiedliwość, wyrządzacie szkodę i to braciom."
"1Kor6,9": "Czy nie wiecie, że niesprawiedliwi nie odziedziczą Królestwa Bożego? Nie dajcie się wprowadzać w błąd; ani nierządnicy, ani bałwochwalcy, ani cudzołożnicy, ani zniewieściali, ani homoseksualiści,"
"1Kor6,10": "Ani złodzieje, ani chciwcy, ani pijacy, ani oszczercy, ani zdziercy nie odziedziczą Królestwa Bożego."
"1Kor6,11": "A niektórzy z was takimi byli; ale obmyliście się; ale zostaliście poświęceni; ale zostaliście uznani za sprawiedliwych w imieniu Pana Jezusa i w Duchu Boga naszego."
"1Kor6,12": "Wszystko mi wolno, ale nie wszystko jest pożyteczne; wszystko mi wolno, ale ja nie będę przez coś owładnięty."
"1Kor6,13": "Pokarm jest dla brzucha, a brzuch jest dla pokarmów, ale Bóg i jedno i drugie zniszczy; ciało natomiast nie jest dla nierządu, ale dla Pana, a Pan dla ciała."
"1Kor6,14": "Bóg natomiast i Pana wskrzesił, i nas wzbudzi przez Jego moc."
"1Kor6,15": "Czy nie wiecie, że ciała wasze są członkami Chrystusa? Czy mam więc wziąć członki Chrystusa i uczynić je członkami nierządnicy? Z pewnością nie!"
"1Kor6,16": "Czy nie wiecie, że ten, kto jest złączony z nierządnicą, jest z nią jednym ciałem? Będą bowiem – mówi Pismo – ci dwoje jednym ciałem."
"1Kor6,17": "Ale kto łączy się z Panem, jest z Nim jednym duchem."
"1Kor6,18": "Uciekajcie przed nierządem. Wszelki grzech, który uczyniłby człowiek, jest poza ciałem; lecz oddający się nierządowi, grzeszy względem własnego ciała."
"1Kor6,19": "Czy nie wiecie, że ciało wasze jest świątynią Ducha Świętego, który jest w was, którego macie od Boga, i nie należycie do siebie samych?"
"1Kor6,20": "Drogo bowiem jesteście kupieni. Oddajcie więc chwałę Bogu w ciele waszym i w duchu waszym, one są Boże."
