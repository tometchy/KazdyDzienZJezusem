"1Kor13,1": "Jeślibym mówił językami ludzi i aniołów, a nie miał miłości, staję się miedzią dźwięczącą lub cymbałem brzmiącym."
"1Kor13,2": "I jeśli miałbym proroctwo, i znał wszystkie tajemnice, i miał wszelkie poznanie, i jeśli miałbym pełnię wiary, tak że przenosiłbym góry, a miłości bym nie miał, jestem niczym."
"1Kor13,3": "A choćbym część po części rozdał ubogim cały swój majątek, i choćbym swoje ciało oddał na spalenie, a miłości bym nie miał, nic mi to nie pomoże."
"1Kor13,4": "Miłość cierpliwa jest, łagodna jest, miłość nie zazdrości, miłość nie jest chełpliwa, nie jest nadęta pychą,"
"1Kor13,5": "Nie czyni nic nieprzystojnego, nie szuka swego, nie jest porywcza, nie przypisuje żadnego zła."
"1Kor13,6": "Nie raduje się z niesprawiedliwości, ale dzieli radość z prawdy;"
"1Kor13,7": "Wszystko przykrywa, wszystkiemu wierzy, we wszystkim ma nadzieję, wszystko znosi."
"1Kor13,8": "Miłość nigdy nie ustaje; bo choć są proroctwa, stracą na znaczeniu; choć języki, ustaną; choć poznanie – przestanie mieć znaczenie."
"1Kor13,9": "Albowiem po części poznajemy i po części prorokujemy."
"1Kor13,10": "A gdy przyjdzie to, co doskonałe, wtedy to, co częściowe, straci na znaczeniu."
"1Kor13,11": "Gdy byłem dzieckiem, mówiłem jak dziecko, myślałem jak dziecko, wnioskowałem jak dziecko, a gdy stałem się mężczyzną, uznałem za bezużyteczne to, co dziecięce."
"1Kor13,12": "Teraz bowiem widzimy jakby w zwierciadle, w zagadce, a wówczas ujrzymy twarzą w twarz; teraz poznaję po części, ale wówczas poznam tak, jak zostałem dokładnie poznany."
"1Kor13,13": "Teraz więc trwa wiara, nadzieja, miłość – te trzy; lecz z nich największa jest miłość."
