"1Kor13,1":
  text: "Jeślibym mówił językami ludzi i aniołów, a nie miał miłości, staję się miedzią dźwięczącą lub cymbałem brzmiącym."
  tags: []
"1Kor13,2":
  text: "I jeśli miałbym proroctwo, i znał wszystkie tajemnice, i miał wszelkie poznanie, i jeśli miałbym pełnię wiary, tak że przenosiłbym góry, a miłości bym nie miał, jestem niczym."
  tags: []
"1Kor13,3":
  text: "A choćbym część po części rozdał ubogim cały swój majątek, i choćbym swoje ciało oddał na spalenie, a miłości bym nie miał, nic mi to nie pomoże."
  tags: []
"1Kor13,4":
  text: "Miłość cierpliwa jest, łagodna jest, miłość nie zazdrości, miłość nie jest chełpliwa, nie jest nadęta pychą,"
  tags: []
"1Kor13,5":
  text: "Nie czyni nic nieprzystojnego, nie szuka swego, nie jest porywcza, nie przypisuje żadnego zła."
  tags: []
"1Kor13,6":
  text: "Nie raduje się z niesprawiedliwości, ale dzieli radość z prawdy;"
  tags: []
"1Kor13,7":
  text: "Wszystko przykrywa, wszystkiemu wierzy, we wszystkim ma nadzieję, wszystko znosi."
  tags: []
"1Kor13,8":
  text: "Miłość nigdy nie ustaje; bo choć są proroctwa, stracą na znaczeniu; choć języki, ustaną; choć poznanie – przestanie mieć znaczenie."
  tags: []
"1Kor13,9":
  text: "Albowiem po części poznajemy i po części prorokujemy."
  tags: []
"1Kor13,10":
  text: "A gdy przyjdzie to, co doskonałe, wtedy to, co częściowe, straci na znaczeniu."
  tags: []
"1Kor13,11":
  text: "Gdy byłem dzieckiem, mówiłem jak dziecko, myślałem jak dziecko, wnioskowałem jak dziecko, a gdy stałem się mężczyzną, uznałem za bezużyteczne to, co dziecięce."
  tags: []
"1Kor13,12":
  text: "Teraz bowiem widzimy jakby w zwierciadle, w zagadce, a wówczas ujrzymy twarzą w twarz; teraz poznaję po części, ale wówczas poznam tak, jak zostałem dokładnie poznany."
  tags: []
"1Kor13,13":
  text: "Teraz więc trwa wiara, nadzieja, miłość – te trzy; lecz z nich największa jest miłość."
  tags: []
