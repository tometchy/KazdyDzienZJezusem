"1Kor8,1":
  text: "Co do ofiar składanych bożkom, wiemy, że wszyscy mamy poznanie. Poznanie nadyma, ale miłość buduje."
  tags: []
"1Kor8,2":
  text: "A jeśli ktoś mniema, że coś zna, niczego jeszcze nie zna tak, jak należało poznać;"
  tags: []
"1Kor8,3":
  text: "Lecz jeśli ktoś miłuje Boga, ten też jest przez Niego poznany."
  tags: []
"1Kor8,4":
  text: "Co do pokarmów ofiarowanych bożkom, wiemy, że bożek na świecie jest niczym, ani nie ma żadnego innego boga, z wyjątkiem Jednego."
  tags: []
"1Kor8,5":
  text: "I chociaż rzeczywiście są tacy, którzy są nazwani bogami, czy to na niebie, czy to na ziemi – jest wielu takich bogów i panów,"
  tags: []
"1Kor8,6":
  text: "Ale dla nas jest jeden Bóg Ojciec, z którego wszystko i my dla Niego, i jeden Pan Jezus Chrystus, przez którego wszystko, i my przez Niego."
  tags: []
"1Kor8,7":
  text: "Ale nie we wszystkich jest to poznanie; niektórzy natomiast z sumieniem pod wpływem bożka jedzą pokarmy aż do teraz jako ofiarowane bożkowi, a sumienie ich będąc słabe, jest plamione."
  tags: []
"1Kor8,8":
  text: "Ale pokarm nie stawia nas przy Bogu; bo jeśli jemy, nic nie zyskujemy; a jeśli nie jemy, nic nam nie brakuje."
  tags: []
"1Kor8,9":
  text: "Baczcie natomiast, aby to wasze prawo wyboru nie było powodem potknięcia dla słabych."
  tags: []
"1Kor8,10":
  text: "Jeśli bowiem ktoś ujrzałby ciebie, który masz poznanie, spoczywającego przy posiłku w świątyni bożka, to czy słabe sumienie jego nie będzie pobudzone do jedzenia pokarmów ofiarowanych bożkom?"
  tags: []
"1Kor8,11":
  text: "I ulegnie zgubie z powodu twojego poznania słaby brat, za którego Chrystus umarł."
  tags: []
"1Kor8,12":
  text: "A tak, grzesząc wobec braci i raniąc ich słabe sumienie, grzeszycie wobec Chrystusa."
  tags: []
"1Kor8,13":
  text: "Dlatego, jeśli pokarm powoduje upadek mojego brata, nie będę jadł mięsa na wieki, aby nie przyczynić się do upadku mojego brata."
  tags: []
