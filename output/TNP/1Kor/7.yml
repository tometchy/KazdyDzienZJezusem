"1Kor7,1":
  text: "A co do spraw, o których mi pisaliście: dobrze jest człowiekowi nie dotykać kobiety."
  tags: []
"1Kor7,2":
  text: "Jednak z powodu nierządu, niech każdy ma swoją żonę i niech każda ma własnego męża."
  tags: []
"1Kor7,3":
  text: "Niech mąż oddaje z życzliwością powinność żonie, podobnie i żona mężowi."
  tags: []
"1Kor7,4":
  text: "Żona nie włada swoim własnym ciałem, ale mąż; podobnie i mąż nie włada swoim własnym ciałem, ale żona."
  tags: []
"1Kor7,5":
  text: "Nie pozbawiajcie się wzajemnie tego; chyba że za wspólną zgodą na pewien okres, aby mieć czas postu i modlitwy; potem ponownie bądźcie razem, aby was szatan nie kusił z powodu waszej niepowściągliwości."
  tags: []
"1Kor7,6":
  text: "A to, co mówię, mówię z przyzwolenia, a nie z rozkazu."
  tags: []
"1Kor7,7":
  text: "Chciałbym bowiem, aby wszyscy ludzie byli jak ja; ale każdy ma swój własny dar łaski od Boga, ten oto taki, a ten taki."
  tags: []
"1Kor7,8":
  text: "Mówię natomiast nieżonatym i wdowom: Dobrze jest dla nich, jeżeli pozostaliby tak jak i ja."
  tags: []
"1Kor7,9":
  text: "Ale jeśli wytrzymać nie mogą, niech się pobiorą; bo lepiej się pobrać niż płonąć namiętnością."
  tags: []
"1Kor7,10":
  text: "A tym, którzy są w małżeństwie, rozkazuję nie ja, lecz Pan: Żona nie może zostać oddzielona od swojego męża."
  tags: []
"1Kor7,11":
  text: "Lecz jeśli została oddzielona, niech pozostaje niezamężna, albo niech pojedna się z mężem, a mąż niech nie oddala żony."
  tags: []
"1Kor7,12":
  text: "Lecz pozostałym mówię ja, nie Pan: Jeśli jakiś brat ma niewierzącą żonę, a ta zgadza się z nim mieszkać, niech jej nie oddala."
  tags: []
"1Kor7,13":
  text: "I żona, która ma niewierzącego męża, a on zgadza się z nią mieszkać, niech go nie oddala."
  tags: []
"1Kor7,14":
  text: "Albowiem niewierzący mąż jest uświęcony przez żonę, i niewierząca żona jest uświęcona przez męża; gdyż wtedy dzieci wasze byłyby nieczyste, teraz natomiast są święte."
  tags: []
"1Kor7,15":
  text: "A jeśli niewierzący oddziela się, niech jest oddzielony; nie jest zniewolony brat lub siostra w takich przypadkach; Bóg jednak powołał nas do pokoju."
  tags: []
"1Kor7,16":
  text: "Bo czy wiesz żono, że zbawisz męża? Lub czy wiesz mężu, że zbawisz żonę?"
  tags: []
"1Kor7,17":
  text: "Zatem niech każdy postępuje tak jak mu przydzielił Bóg, jak każdego powołał Pan; tak też zarządzam we wszystkich zborach."
  tags: []
"1Kor7,18":
  text: "Jeśli ktoś został powołany jako obrzezany, niech nie ukrywa obrzezania; a jeśli ktoś został powołany jako nieobrzezany, niech się nie obrzezuje."
  tags: []
"1Kor7,19":
  text: "Obrzezanie jest niczym i nieobrzezanie jest niczym, tylko zachowywanie przykazań Bożych."
  tags: []
"1Kor7,20":
  text: "Każdy, w tym powołaniu, w którym jest powołany, niech pozostaje."
  tags: []
"1Kor7,21":
  text: "Zostałeś powołany będąc niewolnikiem? Niech cię to nie martwi; ale jeśli możesz stać się wolnym, raczej z tego korzystaj."
  tags: []
"1Kor7,22":
  text: "Albowiem kto jest powołany w Panu będąc niewolnikiem, jest wyzwoleńcem Pana; podobnie, kto jest powołany jako wolny, jest niewolnikiem Chrystusa."
  tags: []
"1Kor7,23":
  text: "Drogo zostaliście kupieni; nie stawajcie się niewolnikami ludzi."
  tags: []
"1Kor7,24":
  text: "Każdy w jakim stanie został powołany, bracia, niech w nim trwa przy Bogu."
  tags: []
"1Kor7,25":
  text: "A co do panien nie mam rozkazu Pana; jednak wypowiadam zdanie, jako ten, który dzięki miłosierdziu Pana jest godny zaufania."
  tags: []
"1Kor7,26":
  text: "Sądzę więc, że przy nastających obecnie trudach dobrze jest człowiekowi być takim:"
  tags: []
"1Kor7,27":
  text: "Jesteś związany z żoną, nie szukaj uwolnienia; nie jesteś złączony z żoną, nie szukaj żony."
  tags: []
"1Kor7,28":
  text: "A jeśli ożeniłeś się, nie zgrzeszyłeś; jeśli też panna zaślubiła się, nie zgrzeszyła; jednak tacy będą mieli ucisk w ciele; lecz ja chcę was oszczędzić."
  tags: []
"1Kor7,29":
  text: "A to mówię, bracia, że czas jest skrócony. Odtąd ci, którzy mają żony, niech żyją jakby ich nie mieli;"
  tags: []
"1Kor7,30":
  text: "A ci, którzy płaczą, jakby nie płakali; a ci, którzy się radują, jakby się nie radowali; a którzy kupują, jakby nie trzymali tego co pozyskali;"
  tags: []
"1Kor7,31":
  text: "A którzy używają tego świata, jakby go nie nadużywali; bo przemija postać tego świata."
  tags: []
"1Kor7,32":
  text: "A chcę, abyście byli wolni od trosk; nieżonaty troszczy się o sprawy Pana, o to jak podobać się Panu;"
  tags: []
"1Kor7,33":
  text: "A żonaty troszczy się o sprawy tego świata, jak podobać się żonie."
  tags: []
"1Kor7,34":
  text: "Jest różnica między mężatką a panną: niezamężna troszczy się o sprawy Pana, aby była święta i ciałem, i duchem; a mężatka troszczy się o sprawy tego świata, jak podobać się mężowi."
  tags: []
"1Kor7,35":
  text: "A to mówię dla waszej własnej korzyści, nie aby zarzucać na was pętlę, lecz abyście nieprzerwanie, dostojnie i wytrwale stali przy Panu."
  tags: []
"1Kor7,36":
  text: "A jeżeli ktoś sądzi, że niestosownie postąpiłby wobec swojej panny, by miała przekroczyć lata swej młodości, oraz że tak powinno się stać, niech czyni co chce; nie grzeszy; niech się pobiorą."
  tags: []
"1Kor7,37":
  text: "Kto jednak mocno postanowił w sercu, bez przymusu i panuje nad własną wolą, osądził to w swoim sercu, aby zachowywać swoją pannę w dziewictwie, dobrze czyni."
  tags: []
"1Kor7,38":
  text: "A tak, kto poślubia swoją pannę, czyni dobrze; a kto nie zaślubia, czyni lepiej."
  tags: []
"1Kor7,39":
  text: "Żona związana jest prawem do tego czasu, dopóki żyje jej mąż; jeśli jednak usnąłby jej mąż, jest wolna by wyjść za mąż, za kogo chce, byle tylko w Panu."
  tags: []
"1Kor7,40":
  text: "Ale według mojej rady jest szczęśliwsza, jeśli tak pozostanie; a wydaje mi się, że i ja mam Ducha Bożego."
  tags: []
