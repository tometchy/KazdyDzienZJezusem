"1Kor7,1": "A co do spraw, o których mi pisaliście: dobrze jest człowiekowi nie dotykać kobiety."
"1Kor7,2": "Jednak z powodu nierządu, niech każdy ma swoją żonę i niech każda ma własnego męża."
"1Kor7,3": "Niech mąż oddaje z życzliwością powinność żonie, podobnie i żona mężowi."
"1Kor7,4": "Żona nie włada swoim własnym ciałem, ale mąż; podobnie i mąż nie włada swoim własnym ciałem, ale żona."
"1Kor7,5": "Nie pozbawiajcie się wzajemnie tego; chyba że za wspólną zgodą na pewien okres, aby mieć czas postu i modlitwy; potem ponownie bądźcie razem, aby was szatan nie kusił z powodu waszej niepowściągliwości."
"1Kor7,6": "A to, co mówię, mówię z przyzwolenia, a nie z rozkazu."
"1Kor7,7": "Chciałbym bowiem, aby wszyscy ludzie byli jak ja; ale każdy ma swój własny dar łaski od Boga, ten oto taki, a ten taki."
"1Kor7,8": "Mówię natomiast nieżonatym i wdowom: Dobrze jest dla nich, jeżeli pozostaliby tak jak i ja."
"1Kor7,9": "Ale jeśli wytrzymać nie mogą, niech się pobiorą; bo lepiej się pobrać niż płonąć namiętnością."
"1Kor7,10": "A tym, którzy są w małżeństwie, rozkazuję nie ja, lecz Pan: Żona nie może zostać oddzielona od swojego męża."
"1Kor7,11": "Lecz jeśli została oddzielona, niech pozostaje niezamężna, albo niech pojedna się z mężem, a mąż niech nie oddala żony."
"1Kor7,12": "Lecz pozostałym mówię ja, nie Pan: Jeśli jakiś brat ma niewierzącą żonę, a ta zgadza się z nim mieszkać, niech jej nie oddala."
"1Kor7,13": "I żona, która ma niewierzącego męża, a on zgadza się z nią mieszkać, niech go nie oddala."
"1Kor7,14": "Albowiem niewierzący mąż jest uświęcony przez żonę, i niewierząca żona jest uświęcona przez męża; gdyż wtedy dzieci wasze byłyby nieczyste, teraz natomiast są święte."
"1Kor7,15": "A jeśli niewierzący oddziela się, niech jest oddzielony; nie jest zniewolony brat lub siostra w takich przypadkach; Bóg jednak powołał nas do pokoju."
"1Kor7,16": "Bo czy wiesz żono, że zbawisz męża? Lub czy wiesz mężu, że zbawisz żonę?"
"1Kor7,17": "Zatem niech każdy postępuje tak jak mu przydzielił Bóg, jak każdego powołał Pan; tak też zarządzam we wszystkich zborach."
"1Kor7,18": "Jeśli ktoś został powołany jako obrzezany, niech nie ukrywa obrzezania; a jeśli ktoś został powołany jako nieobrzezany, niech się nie obrzezuje."
"1Kor7,19": "Obrzezanie jest niczym i nieobrzezanie jest niczym, tylko zachowywanie przykazań Bożych."
"1Kor7,20": "Każdy, w tym powołaniu, w którym jest powołany, niech pozostaje."
"1Kor7,21": "Zostałeś powołany będąc niewolnikiem? Niech cię to nie martwi; ale jeśli możesz stać się wolnym, raczej z tego korzystaj."
"1Kor7,22": "Albowiem kto jest powołany w Panu będąc niewolnikiem, jest wyzwoleńcem Pana; podobnie, kto jest powołany jako wolny, jest niewolnikiem Chrystusa."
"1Kor7,23": "Drogo zostaliście kupieni; nie stawajcie się niewolnikami ludzi."
"1Kor7,24": "Każdy w jakim stanie został powołany, bracia, niech w nim trwa przy Bogu."
"1Kor7,25": "A co do panien nie mam rozkazu Pana; jednak wypowiadam zdanie, jako ten, który dzięki miłosierdziu Pana jest godny zaufania."
"1Kor7,26": "Sądzę więc, że przy nastających obecnie trudach dobrze jest człowiekowi być takim:"
"1Kor7,27": "Jesteś związany z żoną, nie szukaj uwolnienia; nie jesteś złączony z żoną, nie szukaj żony."
"1Kor7,28": "A jeśli ożeniłeś się, nie zgrzeszyłeś; jeśli też panna zaślubiła się, nie zgrzeszyła; jednak tacy będą mieli ucisk w ciele; lecz ja chcę was oszczędzić."
"1Kor7,29": "A to mówię, bracia, że czas jest skrócony. Odtąd ci, którzy mają żony, niech żyją jakby ich nie mieli;"
"1Kor7,30": "A ci, którzy płaczą, jakby nie płakali; a ci, którzy się radują, jakby się nie radowali; a którzy kupują, jakby nie trzymali tego co pozyskali;"
"1Kor7,31": "A którzy używają tego świata, jakby go nie nadużywali; bo przemija postać tego świata."
"1Kor7,32": "A chcę, abyście byli wolni od trosk; nieżonaty troszczy się o sprawy Pana, o to jak podobać się Panu;"
"1Kor7,33": "A żonaty troszczy się o sprawy tego świata, jak podobać się żonie."
"1Kor7,34": "Jest różnica między mężatką a panną: niezamężna troszczy się o sprawy Pana, aby była święta i ciałem, i duchem; a mężatka troszczy się o sprawy tego świata, jak podobać się mężowi."
"1Kor7,35": "A to mówię dla waszej własnej korzyści, nie aby zarzucać na was pętlę, lecz abyście nieprzerwanie, dostojnie i wytrwale stali przy Panu."
"1Kor7,36": "A jeżeli ktoś sądzi, że niestosownie postąpiłby wobec swojej panny, by miała przekroczyć lata swej młodości, oraz że tak powinno się stać, niech czyni co chce; nie grzeszy; niech się pobiorą."
"1Kor7,37": "Kto jednak mocno postanowił w sercu, bez przymusu i panuje nad własną wolą, osądził to w swoim sercu, aby zachowywać swoją pannę w dziewictwie, dobrze czyni."
"1Kor7,38": "A tak, kto poślubia swoją pannę, czyni dobrze; a kto nie zaślubia, czyni lepiej."
"1Kor7,39": "Żona związana jest prawem do tego czasu, dopóki żyje jej mąż; jeśli jednak usnąłby jej mąż, jest wolna by wyjść za mąż, za kogo chce, byle tylko w Panu."
"1Kor7,40": "Ale według mojej rady jest szczęśliwsza, jeśli tak pozostanie; a wydaje mi się, że i ja mam Ducha Bożego."
