"Oz9,1": "Nie raduj się, Izraelu, nie wesel się jak inne ludy, bo uprawiasz nierząd wobec swojego Boga i kochasz zapłatę nierządnicy na wszystkich klepiskach zboża."
"Oz9,2": "Klepisko i prasa nie wykarmi ich, a moszcz w niej zawiedzie."
"Oz9,3": "Nie będą mieszkać w ziemi JHWH, lecz Efraim wróci do Egiptu, a w Asyrii będą jedli pokarm nieczysty."
"Oz9,4": "Nie będą wylewali wina w ofierze dla JHWH i nie będą zastawiać dla Niego swoich ofiar krwawych. Bo one są dla nich niczym chleb żałoby; wszyscy jedzący go staną się nieczyści. Tak, ich chleb będzie tylko dla ich gardeł – nie wejdzie do domu JHWH."
"Oz9,5": "Co będziecie robić w uroczysty dzień i w dzień święta JHWH?"
"Oz9,6": "Bo oto poszli z powodu spustoszenia. Egipt ich zgromadzi, a Memfis ich razem pogrzebie. Upragnione ich srebro odziedziczy oset, a w ich namiotach – głóg."
"Oz9,7": "Nadeszły dni nawiedzenia! Nadeszły dni zapłaty! Izrael – poznają, czy prorok jest głupcem, a człowiek ducha – szalonym, z powodu twojej wielkiej nieprawości i ogromu wrogości."
"Oz9,8": "Pilnuję Efraima wraz z moim Bogiem. Prorok jest sidłem ptasznika na wszystkich jego drogach; wrogość panuje w domu jego Boga."
"Oz9,9": "Pogrążyli się głęboko w zepsuciu, jak za dni Gibea. On zapamięta ich nieprawości, ukarze ich za grzechy."
"Oz9,10": "Znalazłem Izraela jak niedojrzałe winne grona na pustyni, widziałem twoich ojców jak wczesną figę na figowcu w jego początku. Lecz oni poszli do Baal-Peor i oddali się hańbie, i stali się obrzydliwi jak ich ukochanie."
"Oz9,11": "Jak ptak uleci chwała Efraima bez narodzin i bez łona, i bez poczęcia."
"Oz9,12": "Tak, choćby odchowali swoich synów, osierocę ich i nie będzie człowieka. Bo też biada im, gdy się od nich odsunę!"
"Oz9,13": "Efraim, tak jak widziałem, jestjak Tyr przesadzony na łąkę. Efraim jednak będzie musiał wyprowadzić swoich synów na zabicie."
"Oz9,14": "Daj im, JHWH, co masz im dać! Daj im niepłodne łono i wyschnięte piersi."
"Oz9,15": "Cała ich niegodziwość jest w Gilgal. Tak, tam ich znienawidziłem. Z powodu zła ich uczynków wyrzucę ich z mojego domu, nie chcę ich już więcej miłować. Wszyscy ich książęta to buntownicy."
"Oz9,16": "Efraim został powalony, ich korzeń usechł, nie wydają już owocu. Nawet jeśli zrodzą, to uśmiercę umiłowane dzieci ich łona."
"Oz9,17": "Mój Bóg ich odrzuci, bo Go nie słuchali i będą tułaczami wśród narodów."
