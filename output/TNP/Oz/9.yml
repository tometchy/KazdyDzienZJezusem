"Oz9,1":
  text: "Nie raduj się, Izraelu, nie wesel się jak inne ludy, bo uprawiasz nierząd wobec swojego Boga i kochasz zapłatę nierządnicy na wszystkich klepiskach zboża."
  tags: []
"Oz9,2":
  text: "Klepisko i prasa nie wykarmi ich, a moszcz w niej zawiedzie."
  tags: []
"Oz9,3":
  text: "Nie będą mieszkać w ziemi JHWH, lecz Efraim wróci do Egiptu, a w Asyrii będą jedli pokarm nieczysty."
  tags: []
"Oz9,4":
  text: "Nie będą wylewali wina w ofierze dla JHWH i nie będą zastawiać dla Niego swoich ofiar krwawych. Bo one są dla nich niczym chleb żałoby; wszyscy jedzący go staną się nieczyści. Tak, ich chleb będzie tylko dla ich gardeł – nie wejdzie do domu JHWH."
  tags: []
"Oz9,5":
  text: "Co będziecie robić w uroczysty dzień i w dzień święta JHWH?"
  tags: []
"Oz9,6":
  text: "Bo oto poszli z powodu spustoszenia. Egipt ich zgromadzi, a Memfis ich razem pogrzebie. Upragnione ich srebro odziedziczy oset, a w ich namiotach – głóg."
  tags: []
"Oz9,7":
  text: "Nadeszły dni nawiedzenia! Nadeszły dni zapłaty! Izrael – poznają, czy prorok jest głupcem, a człowiek ducha – szalonym, z powodu twojej wielkiej nieprawości i ogromu wrogości."
  tags: []
"Oz9,8":
  text: "Pilnuję Efraima wraz z moim Bogiem. Prorok jest sidłem ptasznika na wszystkich jego drogach; wrogość panuje w domu jego Boga."
  tags: []
"Oz9,9":
  text: "Pogrążyli się głęboko w zepsuciu, jak za dni Gibea. On zapamięta ich nieprawości, ukarze ich za grzechy."
  tags: []
"Oz9,10":
  text: "Znalazłem Izraela jak niedojrzałe winne grona na pustyni, widziałem twoich ojców jak wczesną figę na figowcu w jego początku. Lecz oni poszli do Baal-Peor i oddali się hańbie, i stali się obrzydliwi jak ich ukochanie."
  tags: []
"Oz9,11":
  text: "Jak ptak uleci chwała Efraima bez narodzin i bez łona, i bez poczęcia."
  tags: []
"Oz9,12":
  text: "Tak, choćby odchowali swoich synów, osierocę ich i nie będzie człowieka. Bo też biada im, gdy się od nich odsunę!"
  tags: []
"Oz9,13":
  text: "Efraim, tak jak widziałem, jestjak Tyr przesadzony na łąkę. Efraim jednak będzie musiał wyprowadzić swoich synów na zabicie."
  tags: []
"Oz9,14":
  text: "Daj im, JHWH, co masz im dać! Daj im niepłodne łono i wyschnięte piersi."
  tags: []
"Oz9,15":
  text: "Cała ich niegodziwość jest w Gilgal. Tak, tam ich znienawidziłem. Z powodu zła ich uczynków wyrzucę ich z mojego domu, nie chcę ich już więcej miłować. Wszyscy ich książęta to buntownicy."
  tags: []
"Oz9,16":
  text: "Efraim został powalony, ich korzeń usechł, nie wydają już owocu. Nawet jeśli zrodzą, to uśmiercę umiłowane dzieci ich łona."
  tags: []
"Oz9,17":
  text: "Mój Bóg ich odrzuci, bo Go nie słuchali i będą tułaczami wśród narodów."
  tags: []
