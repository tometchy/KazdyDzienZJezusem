"Oz11,1":
  text: "Gdy Izrael był dzieckiem, umiłowałem go i z Egiptu wezwałem mojego syna."
  tags: []
"Oz11,2":
  text: "Wzywali ich, lecz oni tym bardziej odchodzili sprzed ich oblicza. Składali ofiary Baalom i palili kadzidło rytym wizerunkom bożków."
  tags: []
"Oz11,3":
  text: "A ja uczyłem Efraima chodzić, brali ich na ramiona, a oni nie wiedzieli, że to ja leczyłem ich."
  tags: []
"Oz11,4":
  text: "Ciągnąłem ich więzami ludzkimi, powrozami miłości, a byłem dla nich jak podnoszący w górę jarzmo ze szczęk, i postępowałem łagodnie z nim i karmiłem go."
  tags: []
"Oz11,5":
  text: "Nie wróci do ziemi Egiptu, lecz Asyryjczyk – on jego królem, gdyż odmówili, aby się nawrócić."
  tags: []
"Oz11,6":
  text: "I miecz będzie wirować w jego miastach i zniszczy jego zasuwy, i pochłonie ich za ich spiski."
  tags: []
"Oz11,7":
  text: "A mój lud jest zawieszony za odstępstwo ode mnie i ku Najwyższemu wołają razem, lecz nie wywyższają Go."
  tags: []
"Oz11,8":
  text: "Jak mam cię zostawić, Efraimie, wydać cię, Izraelu? Jak mam cię zostawić – jak Admę? Uczynić ci jak Seboim? Odmienione jest we mnie moje serce, jednocześnie rozpala się moje współczucie."
  tags: []
"Oz11,9":
  text: "Nie wykonam zapalczywości swojego gniewu i nie powrócę, aby zrujnować Efraima, bo ja jestem Bogiem, a nie człowiekiem; Świętym pośrodku ciebie. I nie przyjdę z grozą."
  tags: []
"Oz11,10":
  text: "Pójdą za JHWH, który jak lew zaryczy. Gdy On zaryczy, to z drżeniem przyjdą synowie z zachodu."
  tags: []
"Oz11,11":
  text: "Przylecą z drżeniem jak ptak z Egiptu i jak gołębica z ziemi asyryjskiej i sprawię, że osiądą oni w ich domach – oświadczenie JHWH."
  tags: []
"Oz11,12":
  text: "Efraim otoczył mnie kłamstwem, a dom Izraela – zdradą. A Juda? Ciągle włóczy się z Bogiem i jest wierny ze świętymi."
  tags: []
