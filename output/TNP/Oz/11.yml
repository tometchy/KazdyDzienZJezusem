"Oz11,1": "Gdy Izrael był dzieckiem, umiłowałem go i z Egiptu wezwałem mojego syna."
"Oz11,2": "Wzywali ich, lecz oni tym bardziej odchodzili sprzed ich oblicza. Składali ofiary Baalom i palili kadzidło rytym wizerunkom bożków."
"Oz11,3": "A ja uczyłem Efraima chodzić, brali ich na ramiona, a oni nie wiedzieli, że to ja leczyłem ich."
"Oz11,4": "Ciągnąłem ich więzami ludzkimi, powrozami miłości, a byłem dla nich jak podnoszący w górę jarzmo ze szczęk, i postępowałem łagodnie z nim i karmiłem go."
"Oz11,5": "Nie wróci do ziemi Egiptu, lecz Asyryjczyk – on jego królem, gdyż odmówili, aby się nawrócić."
"Oz11,6": "I miecz będzie wirować w jego miastach i zniszczy jego zasuwy, i pochłonie ich za ich spiski."
"Oz11,7": "A mój lud jest zawieszony za odstępstwo ode mnie i ku Najwyższemu wołają razem, lecz nie wywyższają Go."
"Oz11,8": "Jak mam cię zostawić, Efraimie, wydać cię, Izraelu? Jak mam cię zostawić – jak Admę? Uczynić ci jak Seboim? Odmienione jest we mnie moje serce, jednocześnie rozpala się moje współczucie."
"Oz11,9": "Nie wykonam zapalczywości swojego gniewu i nie powrócę, aby zrujnować Efraima, bo ja jestem Bogiem, a nie człowiekiem; Świętym pośrodku ciebie. I nie przyjdę z grozą."
"Oz11,10": "Pójdą za JHWH, który jak lew zaryczy. Gdy On zaryczy, to z drżeniem przyjdą synowie z zachodu."
"Oz11,11": "Przylecą z drżeniem jak ptak z Egiptu i jak gołębica z ziemi asyryjskiej i sprawię, że osiądą oni w ich domach – oświadczenie JHWH."
"Oz11,12": "Efraim otoczył mnie kłamstwem, a dom Izraela – zdradą. A Juda? Ciągle włóczy się z Bogiem i jest wierny ze świętymi."
