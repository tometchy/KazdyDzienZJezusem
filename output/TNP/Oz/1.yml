"Oz1,1":
  text: "Słowo JHWH, które stało się do Ozeasza, syna Beeriego, za dni Uzjasza, Jotama, Achaza, Ezechiasza, królów Judy i za dni Jeroboama, syna Joasza, króla Izraela."
  tags: []
"Oz1,2":
  text: "Na początku powiedział JHWH przez Ozeasza. I powiedział JHWH do Ozeasza: Idź, weź sobie nierządnicę za żonę i miej z nią dzieci nierządu. Bo ziemia przez haniebny nierząd – odwraca się od JHWH."
  tags: []
"Oz1,3":
  text: "I poszedł, i pojął za żonę Gomer, córkę Diblaima, a ona poczęła i urodziła mu syna."
  tags: []
"Oz1,4":
  text: "JHWH powiedział do niego: Nadaj mu imię Jizreel, bo jeszcze trochę a ukarzę dom Jehu za krew Jizreel i położę kres królestwu domu Izraela."
  tags: []
"Oz1,5":
  text: "I stanie się w tym dniu, że złamię łuk Izraela w dolinie Jizreel."
  tags: []
"Oz1,6":
  text: "I poczęła ponownie, i urodziła córkę. JHWH powiedział do niego: Nadaj jej imię Lo-Ruchama, bo już więcej, ponownie nie zlituję się nad domem Izraela, lecz na pewno ich wypędzę."
  tags: []
"Oz1,7":
  text: "A jednak domowi Judy okażę zmiłowanie i wybawię ich przez JHWH, ich Boga, lecz nie wybawię za pomocą łuku ani miecza, ani wojny, ani koni, ani jeźdźców."
  tags: []
"Oz1,8":
  text: "Gdy odstawiła od piersi Lo-Ruchamę, ponownie poczęła i urodziła syna."
  tags: []
"Oz1,9":
  text: "I JHWH powiedział: Nadaj mu imię Lo-Ammi, bo wy nie jesteście moim ludem, a ja nie będę dla was Bogiem."
  tags: []
"Oz1,10":
  text: "I będzie liczba synów Izraela jak piasek morski, którego nie można zmierzyć i nie można zliczyć. I stanie się, że w miejscu, gdzie im mówiono: Nie-mój-lud, będą do nich mówić: Synowie Boga żywego."
  tags: []
"Oz1,11":
  text: "I zostaną zgromadzeni synowie Judy i synowie Izraela razem, i ustanowią sobie jedną głowę i ruszą w górę z tej ziemi. Bo wielki będzie dzień Jizreel."
  tags: []
