"Oz1,1": "Słowo JHWH, które stało się do Ozeasza, syna Beeriego, za dni Uzjasza, Jotama, Achaza, Ezechiasza, królów Judy i za dni Jeroboama, syna Joasza, króla Izraela."
"Oz1,2": "Na początku powiedział JHWH przez Ozeasza. I powiedział JHWH do Ozeasza: Idź, weź sobie nierządnicę za żonę i miej z nią dzieci nierządu. Bo ziemia przez haniebny nierząd – odwraca się od JHWH."
"Oz1,3": "I poszedł, i pojął za żonę Gomer, córkę Diblaima, a ona poczęła i urodziła mu syna."
"Oz1,4": "JHWH powiedział do niego: Nadaj mu imię Jizreel, bo jeszcze trochę a ukarzę dom Jehu za krew Jizreel i położę kres królestwu domu Izraela."
"Oz1,5": "I stanie się w tym dniu, że złamię łuk Izraela w dolinie Jizreel."
"Oz1,6": "I poczęła ponownie, i urodziła córkę. JHWH powiedział do niego: Nadaj jej imię Lo-Ruchama, bo już więcej, ponownie nie zlituję się nad domem Izraela, lecz na pewno ich wypędzę."
"Oz1,7": "A jednak domowi Judy okażę zmiłowanie i wybawię ich przez JHWH, ich Boga, lecz nie wybawię za pomocą łuku ani miecza, ani wojny, ani koni, ani jeźdźców."
"Oz1,8": "Gdy odstawiła od piersi Lo-Ruchamę, ponownie poczęła i urodziła syna."
"Oz1,9": "I JHWH powiedział: Nadaj mu imię Lo-Ammi, bo wy nie jesteście moim ludem, a ja nie będę dla was Bogiem."
"Oz1,10": "I będzie liczba synów Izraela jak piasek morski, którego nie można zmierzyć i nie można zliczyć. I stanie się, że w miejscu, gdzie im mówiono: Nie-mój-lud, będą do nich mówić: Synowie Boga żywego."
"Oz1,11": "I zostaną zgromadzeni synowie Judy i synowie Izraela razem, i ustanowią sobie jedną głowę i ruszą w górę z tej ziemi. Bo wielki będzie dzień Jizreel."
