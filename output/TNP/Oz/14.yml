"Oz14,1":
  text: "Izraelu, nawróć się do JHWH, swojego Boga. Bo upadłeś z powodu własnej nieprawości."
  tags: []
"Oz14,2":
  text: "Weźcie ze sobą słowa skruchy i nawróćcie się do JHWH. Mówcie do Niego: Zdejmij z nas całą naszą nieprawość i przyjmij dobro, abyśmy mogli oddać owoc naszych warg."
  tags: []
"Oz14,3":
  text: "Asyria nas nie wybawi, nie dosiądziemy konia i nie powiemy więcej do dzieła naszych rąk: Nasz boże. Bo w Tobie sierotka dozna miłosierdzia."
  tags: []
"Oz14,4":
  text: "Uzdrowię ich odstępstwo i pokocham ich chętnie, bo mój gniew odwrócił się od nich."
  tags: []
"Oz14,5":
  text: "Będę dla Izraela jak rosa, rozkwitnie jak lilia i zapuści swoje korzenie jak Liban."
  tags: []
"Oz14,6":
  text: "Jego gałęzie rozrosną się i będzie jego wspaniałość jak drzewo oliwne, a jego woń – jak woń Libanu."
  tags: []
"Oz14,7":
  text: "W jego cień wrócą mieszkańcy. Zboże będzie żyło i rozkwitną jak winorośl, a wspomnienie o nim, jak o winie Libanu."
  tags: []
"Oz14,8":
  text: "Efraimie! Cóż mi jeszcze do bożków? Ja odpowiem i doglądnę go. Ja jestem jak zielony cyprys, ze mnie pojawia się twój owoc."
  tags: []
"Oz14,9":
  text: "Kto mądry, niech to zrozumie, mający zrozumienie – niech to pozna, że drogi JHWH są proste; sprawiedliwi po nich będą chodzić, ale buntownicy na nich się potkną."
  tags: []
