"Oz14,1": "Izraelu, nawróć się do JHWH, swojego Boga. Bo upadłeś z powodu własnej nieprawości."
"Oz14,2": "Weźcie ze sobą słowa skruchy i nawróćcie się do JHWH. Mówcie do Niego: Zdejmij z nas całą naszą nieprawość i przyjmij dobro, abyśmy mogli oddać owoc naszych warg."
"Oz14,3": "Asyria nas nie wybawi, nie dosiądziemy konia i nie powiemy więcej do dzieła naszych rąk: Nasz boże. Bo w Tobie sierotka dozna miłosierdzia."
"Oz14,4": "Uzdrowię ich odstępstwo i pokocham ich chętnie, bo mój gniew odwrócił się od nich."
"Oz14,5": "Będę dla Izraela jak rosa, rozkwitnie jak lilia i zapuści swoje korzenie jak Liban."
"Oz14,6": "Jego gałęzie rozrosną się i będzie jego wspaniałość jak drzewo oliwne, a jego woń – jak woń Libanu."
"Oz14,7": "W jego cień wrócą mieszkańcy. Zboże będzie żyło i rozkwitną jak winorośl, a wspomnienie o nim, jak o winie Libanu."
"Oz14,8": "Efraimie! Cóż mi jeszcze do bożków? Ja odpowiem i doglądnę go. Ja jestem jak zielony cyprys, ze mnie pojawia się twój owoc."
"Oz14,9": "Kto mądry, niech to zrozumie, mający zrozumienie – niech to pozna, że drogi JHWH są proste; sprawiedliwi po nich będą chodzić, ale buntownicy na nich się potkną."
