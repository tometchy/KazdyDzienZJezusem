"Oz3,1": "I powiedział JHWH do mnie ponownie: Idź i pokochaj kobietę kochaną przez innego – cudzołożnicę. Tak jak JHWH miłuje synów Izraela, a oni odwracają się do innych bogów i kochają placki z rodzynkami."
"Oz3,2": "I nabyłem ją sobie za piętnaście sztuk srebra i za chomer jęczmienia, i letek jęczmienia;"
"Oz3,3": "I powiedziałem do niej: Pozostaniesz u mnie przez wiele dni. Nie będziesz uprawiała nierządu, nie będziesz dla innego mężczyzny i także ja nie przyjdę do ciebie."
"Oz3,4": "Bo przez wiele dni synowie Izraela pozostaną bez króla i bez księcia, i bez ofiary, i bez steli, i bez efodu i terafim."
"Oz3,5": "Potem synowie Izraela nawrócą się i będą szukać JHWH, ich Boga, i Dawida, ich króla; a w dniach ostatecznych odczują przerażenie i zwrócą się do JHWH i Jego dobroci."
