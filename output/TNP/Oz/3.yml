"Oz3,1":
  text: "I powiedział JHWH do mnie ponownie: Idź i pokochaj kobietę kochaną przez innego – cudzołożnicę. Tak jak JHWH miłuje synów Izraela, a oni odwracają się do innych bogów i kochają placki z rodzynkami."
  tags: []
"Oz3,2":
  text: "I nabyłem ją sobie za piętnaście sztuk srebra i za chomer jęczmienia, i letek jęczmienia;"
  tags: []
"Oz3,3":
  text: "I powiedziałem do niej: Pozostaniesz u mnie przez wiele dni. Nie będziesz uprawiała nierządu, nie będziesz dla innego mężczyzny i także ja nie przyjdę do ciebie."
  tags: []
"Oz3,4":
  text: "Bo przez wiele dni synowie Izraela pozostaną bez króla i bez księcia, i bez ofiary, i bez steli, i bez efodu i terafim."
  tags: []
"Oz3,5":
  text: "Potem synowie Izraela nawrócą się i będą szukać JHWH, ich Boga, i Dawida, ich króla; a w dniach ostatecznych odczują przerażenie i zwrócą się do JHWH i Jego dobroci."
  tags: []
