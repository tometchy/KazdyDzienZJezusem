"Oz13,1":
  text: "Gdy Efraim przemawiał, niosło to ze sobą drżenie w Izraelu, ale zgrzeszył przy Baalu i wtedy umarł."
  tags: []
"Oz13,2":
  text: "I teraz dodają do tego więcej, by grzeszyć, i czynią dla siebie lane posążki ze swojego srebra, bóstwa według ich umiejętności. Wszystkie one są dla nich dziełem rzemieślników. Oniteż mówią: Ludzie składający ofiary niech całują cielce."
  tags: []
"Oz13,3":
  text: "Dlatego staną się jak obłok poranny, który jak rosa podnosząca się wcześnie odchodzi, jak plewy rozwiewane z klepiska i jak dym ulatujący przez okno."
  tags: []
"Oz13,4":
  text: "Ale ja jestem JHWH, twój Bóg, od twego wyjścia z ziemi Egiptu. I nie miałeś znać innych bogów poza mną. Nie ma Zbawiciela oprócz mnie."
  tags: []
"Oz13,5":
  text: "Ja cię poznałem na pustyni, w ziemi ciągłej suszy."
  tags: []
"Oz13,6":
  text: "Jakie były ich pastwiska, tak się nasycili, a gdy się nasycili – urosło ich serce; dlatego zapomnieli o mnie."
  tags: []
"Oz13,7":
  text: "Będę więc dla nich takim jak lew, jak lampart przy drodze zaczajony."
  tags: []
"Oz13,8":
  text: "Spotkam ich jak niedźwiedzica, której zabrano młode, rozerwę powłokę ich serca i pożrę ich tam, jak lew – polny zwierz ich rozszarpie."
  tags: []
"Oz13,9":
  text: "Zniszczy cię, Izraelu! Jednak we mnie jest twoja pomoc."
  tags: []
"Oz13,10":
  text: "Gdzie jest teraz twój król, aby cię wybawić we wszystkich twoich miastach? I twoi sędziowie, którym mówiłeś: Daj mi króla i książąt?"
  tags: []
"Oz13,11":
  text: "Dałem ci więc króla w swoim gniewie i odebrałem go w swojej zapalczywości."
  tags: []
"Oz13,12":
  text: "Nieprawość Efraima jest zapisana, jego grzech – zachowany!"
  tags: []
"Oz13,13":
  text: "Przyjdą na niego bóle rodzącej. On jest niemądrym synem, bo nie stanie na czas gdy z łona wychodzą synowie."
  tags: []
"Oz13,14":
  text: "Wykupię ich z mocy Szeolu, odkupię ich od śmierci. Gdzie jest twój cierń, o śmierci! Gdzie twoje zniszczenie, o Szeolu! Żal zostanie ukryty przed moimi oczami."
  tags: []
"Oz13,15":
  text: "Chociaż on zaowocował wśród braci, przyjdzie jednak wiatr ze wschodu. Wiatr JHWH podnosi się od pustyni i zawstydzi jego źródło, i wysuszy jego zdrój. On splądruje skarbiec z wszelkiego kosztownego naczynia."
  tags: []
"Oz13,16":
  text: "Samaria zawiniła, ponieważ zbuntowała się przeciwko swojemu Bogu – padną od miecza. Jej niemowlęta zostaną roztrzaskane na kawałki, a jej brzemienne zostaną rozprute."
  tags: []
