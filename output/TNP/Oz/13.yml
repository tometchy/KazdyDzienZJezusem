"Oz13,1": "Gdy Efraim przemawiał, niosło to ze sobą drżenie w Izraelu, ale zgrzeszył przy Baalu i wtedy umarł."
"Oz13,2": "I teraz dodają do tego więcej, by grzeszyć, i czynią dla siebie lane posążki ze swojego srebra, bóstwa według ich umiejętności. Wszystkie one są dla nich dziełem rzemieślników. Oniteż mówią: Ludzie składający ofiary niech całują cielce."
"Oz13,3": "Dlatego staną się jak obłok poranny, który jak rosa podnosząca się wcześnie odchodzi, jak plewy rozwiewane z klepiska i jak dym ulatujący przez okno."
"Oz13,4": "Ale ja jestem JHWH, twój Bóg, od twego wyjścia z ziemi Egiptu. I nie miałeś znać innych bogów poza mną. Nie ma Zbawiciela oprócz mnie."
"Oz13,5": "Ja cię poznałem na pustyni, w ziemi ciągłej suszy."
"Oz13,6": "Jakie były ich pastwiska, tak się nasycili, a gdy się nasycili – urosło ich serce; dlatego zapomnieli o mnie."
"Oz13,7": "Będę więc dla nich takim jak lew, jak lampart przy drodze zaczajony."
"Oz13,8": "Spotkam ich jak niedźwiedzica, której zabrano młode, rozerwę powłokę ich serca i pożrę ich tam, jak lew – polny zwierz ich rozszarpie."
"Oz13,9": "Zniszczy cię, Izraelu! Jednak we mnie jest twoja pomoc."
"Oz13,10": "Gdzie jest teraz twój król, aby cię wybawić we wszystkich twoich miastach? I twoi sędziowie, którym mówiłeś: Daj mi króla i książąt?"
"Oz13,11": "Dałem ci więc króla w swoim gniewie i odebrałem go w swojej zapalczywości."
"Oz13,12": "Nieprawość Efraima jest zapisana, jego grzech – zachowany!"
"Oz13,13": "Przyjdą na niego bóle rodzącej. On jest niemądrym synem, bo nie stanie na czas gdy z łona wychodzą synowie."
"Oz13,14": "Wykupię ich z mocy Szeolu, odkupię ich od śmierci. Gdzie jest twój cierń, o śmierci! Gdzie twoje zniszczenie, o Szeolu! Żal zostanie ukryty przed moimi oczami."
"Oz13,15": "Chociaż on zaowocował wśród braci, przyjdzie jednak wiatr ze wschodu. Wiatr JHWH podnosi się od pustyni i zawstydzi jego źródło, i wysuszy jego zdrój. On splądruje skarbiec z wszelkiego kosztownego naczynia."
"Oz13,16": "Samaria zawiniła, ponieważ zbuntowała się przeciwko swojemu Bogu – padną od miecza. Jej niemowlęta zostaną roztrzaskane na kawałki, a jej brzemienne zostaną rozprute."
