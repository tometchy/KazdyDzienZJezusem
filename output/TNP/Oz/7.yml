"Oz7,1":
  text: "Gdy uleczę Izraela, wtedy zostanie ujawniona nieprawość Efraima i niegodziwość Samarii, bo popełniają oszustwa; złodziej nadchodzi, a banda uderza na zewnątrz."
  tags: []
"Oz7,2":
  text: "I wcale nie myślą w swoim sercu, że ja pamiętam o całej ich niegodziwości; wkrótce ich czyny osaczą ich i będą przed moim obliczem."
  tags: []
"Oz7,3":
  text: "Króla rozweselają swoją niegodziwością, a książąt swoimi kłamstwami."
  tags: []
"Oz7,4":
  text: "Wszyscy cudzołożą, są jak ten rozpalony piec. Piekarz przestaje czuwać nad roznieceniem ognia; po zaczynieniu ciasta czeka aż do jego zakwaszenia."
  tags: []
"Oz7,5":
  text: "W uroczystym dniu naszego króla książęta uczynili go chorym od bukłaka wina. Wyciąga swoją rękę przeciwko szydercom."
  tags: []
"Oz7,6":
  text: "Gdy podeszli, ich serce jak piec płonie w ich spisku. Piekarz uśpiony przez całą noc. Rankiem – rozpalony on jak płomień ognia."
  tags: []
"Oz7,7":
  text: "Wszyscy są rozpaleni jak piec i pożerają swoich sędziów; wszyscy ich królowie upadli. Nikt wśród nich nie wołał do mnie."
  tags: []
"Oz7,8":
  text: "Efraim? On zmieszał się wśród narodów; Efraim stał się jak podpłomyk nieobrócony."
  tags: []
"Oz7,9":
  text: "Obcy pochłonęli jego siłę, a on o tym nie wie; nawet siwizna go przyprószyła, a on o tym nie wie."
  tags: []
"Oz7,10":
  text: "I pycha Izraela świadczy przeciwko niemu, lecz nie nawracają się do JHWH, swojego Boga ani Go w tym wszystkim nie szukają."
  tags: []
"Oz7,11":
  text: "I stał się Efraim jak naiwna gołębica bez rozumu. Przyzywają Egipt, poszli do Asyrii."
  tags: []
"Oz7,12":
  text: "Gdy tak chodzą, rozciągnę na nich swoją sieć, ściągnę ich jak ptactwo niebios; ukarzę ich, według tego, co usłyszano na ich zgromadzeniu."
  tags: []
"Oz7,13":
  text: "Biada im, bo uciekli ode mnie! Zguba im, gdyż zbuntowali się przeciwko mnie. Ja odkupię ich, lecz oni mówią kłamstwa przeciwko mnie."
  tags: []
"Oz7,14":
  text: "I nie wołają do mnie ze swojego serca, gdy jęczą na swoich łożach. Nad zbożem i moszczem się gromadzą – odstępują ode mnie."
  tags: []
"Oz7,15":
  text: "A ja ćwiczyłem i wzmacniałem ich ramiona, a oni obmyślają zło przeciwko mnie."
  tags: []
"Oz7,16":
  text: "I zawrócili lecz nie w górę. Są jak łuk z rozluźnioną cięciwą; ich książęta polegną od miecza za zuchwałość ich języka. To będzie ich pośmiewiskiem w ziemi Egiptu."
  tags: []
