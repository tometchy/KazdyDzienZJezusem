"Oz7,1": "Gdy uleczę Izraela, wtedy zostanie ujawniona nieprawość Efraima i niegodziwość Samarii, bo popełniają oszustwa; złodziej nadchodzi, a banda uderza na zewnątrz."
"Oz7,2": "I wcale nie myślą w swoim sercu, że ja pamiętam o całej ich niegodziwości; wkrótce ich czyny osaczą ich i będą przed moim obliczem."
"Oz7,3": "Króla rozweselają swoją niegodziwością, a książąt swoimi kłamstwami."
"Oz7,4": "Wszyscy cudzołożą, są jak ten rozpalony piec. Piekarz przestaje czuwać nad roznieceniem ognia; po zaczynieniu ciasta czeka aż do jego zakwaszenia."
"Oz7,5": "W uroczystym dniu naszego króla książęta uczynili go chorym od bukłaka wina. Wyciąga swoją rękę przeciwko szydercom."
"Oz7,6": "Gdy podeszli, ich serce jak piec płonie w ich spisku. Piekarz uśpiony przez całą noc. Rankiem – rozpalony on jak płomień ognia."
"Oz7,7": "Wszyscy są rozpaleni jak piec i pożerają swoich sędziów; wszyscy ich królowie upadli. Nikt wśród nich nie wołał do mnie."
"Oz7,8": "Efraim? On zmieszał się wśród narodów; Efraim stał się jak podpłomyk nieobrócony."
"Oz7,9": "Obcy pochłonęli jego siłę, a on o tym nie wie; nawet siwizna go przyprószyła, a on o tym nie wie."
"Oz7,10": "I pycha Izraela świadczy przeciwko niemu, lecz nie nawracają się do JHWH, swojego Boga ani Go w tym wszystkim nie szukają."
"Oz7,11": "I stał się Efraim jak naiwna gołębica bez rozumu. Przyzywają Egipt, poszli do Asyrii."
"Oz7,12": "Gdy tak chodzą, rozciągnę na nich swoją sieć, ściągnę ich jak ptactwo niebios; ukarzę ich, według tego, co usłyszano na ich zgromadzeniu."
"Oz7,13": "Biada im, bo uciekli ode mnie! Zguba im, gdyż zbuntowali się przeciwko mnie. Ja odkupię ich, lecz oni mówią kłamstwa przeciwko mnie."
"Oz7,14": "I nie wołają do mnie ze swojego serca, gdy jęczą na swoich łożach. Nad zbożem i moszczem się gromadzą – odstępują ode mnie."
"Oz7,15": "A ja ćwiczyłem i wzmacniałem ich ramiona, a oni obmyślają zło przeciwko mnie."
"Oz7,16": "I zawrócili lecz nie w górę. Są jak łuk z rozluźnioną cięciwą; ich książęta polegną od miecza za zuchwałość ich języka. To będzie ich pośmiewiskiem w ziemi Egiptu."
