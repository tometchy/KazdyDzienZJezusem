"Oz4,1": "Słuchajcie Słowa JHWH, synowie Izraela, bo JHWH wnosi sprawę w sądzie przeciwko mieszkańcom tej ziemi, gdyż nie ma prawdy i nie ma miłosierdzia, i nie ma poznania Boga w tej ziemi."
"Oz4,2": "Jest klątwa i kłamstwo, i morderstwo, i kradzież, i cudzołóstwo – te wybuchły gwałtownie, a krew sięga po krew."
"Oz4,3": "Dlatego lamentuje ziemia i marnieje każdy w niej zamieszkujący, wraz z polnymi zwierzętami i ptactwem niebios, a także ryby morskie zginą."
"Oz4,4": "Jednak, niech nikt nie kłóci się, i niech nikt nie oskarża. A twój lud jest jak okarżyciel kapłana."
"Oz4,5": "I potykasz się we dnie, i potyka się także z tobą prorok w nocy; zniszczę twoją matkę."
"Oz4,6": "Mój lud ulega zgubie z powodu braku poznania! Ponieważ ty odrzuciłeś poznanie, ja też odrzucę ciebie, byś mi nie był kapłanem. Skoro zapomniałeś o Prawie Twojego Boga, ja też zapomnę o twoich synach."
"Oz4,7": "Im więcej ich, tym więcej grzeszą przeciwko mnie. Dlatego ich chwałę zamienię w hańbę."
"Oz4,8": "Pożerają ofiary za grzech mojego ludu i ku nieprawości ich podnoszą swoją duszę."
"Oz4,9": "I tak samo stanie się z ludem jak z kapłanem. I ukarzę go za jego drogi i oddam mu za jego czyny."
"Oz4,10": "I będą pożerać, ale się nie nasycą, będą uprawiać nierząd, ale się nie pomnożą, bo opuścili JHWH, by poświęcić się nierządowi."
"Oz4,11": "Nierząd i wino, i moszcz odbiera rozum."
"Oz4,12": "Mój lud radzi się u swojego drewna, a jego kij obwieszcza mu odpowiedź, bo duch nierządu go zwodzi – i uprawiają nierząd, wyłamując się spod władzy ich Boga."
"Oz4,13": "Na szczytach gór składają ofiary, a na pagórkach palą kadzidła, pod dębem, pod topolą i pod terebintem – tak, dobry jest ich cień – dlatego wasze córki uprawiają nierząd i wasze synowe cudzołożą."
"Oz4,14": "Nie będę karał waszych córek z tego powodu, że uprawiają nierząd, ani waszych synowych z tego powodu, że cudzołożą. Bo oni sami odchodzą na bok z nierządnicami i składają krwawe ofiary wraz z kapłankami, a lud nie rozumie, że upada."
"Oz4,15": "Jeśli ty, Izraelu, uprawiasz nierząd, niech chociaż Juda nie ściąga na siebie winy. I nie idźcie do Gilgal, nie wstępujcie do Bet-Awen i nie przysięgajcie: Jak żyje JHWH!"
"Oz4,16": "Bo Izrael jest krnąbrny jak uparta jałówka. Wkrótce JHWH będzie ich prowadzić jak jagnię na otwartą przestrzeń."
"Oz4,17": "Efraim związał się z bożkami. Porzuć go."
"Oz4,18": "Gdy został usunięty ich trunek, to nurzają się w nierządzie; rozkochują się hańbą jej tarczy."
"Oz4,19": "Przygniótł ich wiatr swoimi skrzydłami i zawstydzą się z powodu swoich krwawych ofiar."
