"Oz4,1":
  text: "Słuchajcie Słowa JHWH, synowie Izraela, bo JHWH wnosi sprawę w sądzie przeciwko mieszkańcom tej ziemi, gdyż nie ma prawdy i nie ma miłosierdzia, i nie ma poznania Boga w tej ziemi."
  tags: []
"Oz4,2":
  text: "Jest klątwa i kłamstwo, i morderstwo, i kradzież, i cudzołóstwo – te wybuchły gwałtownie, a krew sięga po krew."
  tags: []
"Oz4,3":
  text: "Dlatego lamentuje ziemia i marnieje każdy w niej zamieszkujący, wraz z polnymi zwierzętami i ptactwem niebios, a także ryby morskie zginą."
  tags: []
"Oz4,4":
  text: "Jednak, niech nikt nie kłóci się, i niech nikt nie oskarża. A twój lud jest jak okarżyciel kapłana."
  tags: []
"Oz4,5":
  text: "I potykasz się we dnie, i potyka się także z tobą prorok w nocy; zniszczę twoją matkę."
  tags: []
"Oz4,6":
  text: "Mój lud ulega zgubie z powodu braku poznania! Ponieważ ty odrzuciłeś poznanie, ja też odrzucę ciebie, byś mi nie był kapłanem. Skoro zapomniałeś o Prawie Twojego Boga, ja też zapomnę o twoich synach."
  tags: []
"Oz4,7":
  text: "Im więcej ich, tym więcej grzeszą przeciwko mnie. Dlatego ich chwałę zamienię w hańbę."
  tags: []
"Oz4,8":
  text: "Pożerają ofiary za grzech mojego ludu i ku nieprawości ich podnoszą swoją duszę."
  tags: []
"Oz4,9":
  text: "I tak samo stanie się z ludem jak z kapłanem. I ukarzę go za jego drogi i oddam mu za jego czyny."
  tags: []
"Oz4,10":
  text: "I będą pożerać, ale się nie nasycą, będą uprawiać nierząd, ale się nie pomnożą, bo opuścili JHWH, by poświęcić się nierządowi."
  tags: []
"Oz4,11":
  text: "Nierząd i wino, i moszcz odbiera rozum."
  tags: []
"Oz4,12":
  text: "Mój lud radzi się u swojego drewna, a jego kij obwieszcza mu odpowiedź, bo duch nierządu go zwodzi – i uprawiają nierząd, wyłamując się spod władzy ich Boga."
  tags: []
"Oz4,13":
  text: "Na szczytach gór składają ofiary, a na pagórkach palą kadzidła, pod dębem, pod topolą i pod terebintem – tak, dobry jest ich cień – dlatego wasze córki uprawiają nierząd i wasze synowe cudzołożą."
  tags: []
"Oz4,14":
  text: "Nie będę karał waszych córek z tego powodu, że uprawiają nierząd, ani waszych synowych z tego powodu, że cudzołożą. Bo oni sami odchodzą na bok z nierządnicami i składają krwawe ofiary wraz z kapłankami, a lud nie rozumie, że upada."
  tags: []
"Oz4,15":
  text: "Jeśli ty, Izraelu, uprawiasz nierząd, niech chociaż Juda nie ściąga na siebie winy. I nie idźcie do Gilgal, nie wstępujcie do Bet-Awen i nie przysięgajcie: Jak żyje JHWH!"
  tags: []
"Oz4,16":
  text: "Bo Izrael jest krnąbrny jak uparta jałówka. Wkrótce JHWH będzie ich prowadzić jak jagnię na otwartą przestrzeń."
  tags: []
"Oz4,17":
  text: "Efraim związał się z bożkami. Porzuć go."
  tags: []
"Oz4,18":
  text: "Gdy został usunięty ich trunek, to nurzają się w nierządzie; rozkochują się hańbą jej tarczy."
  tags: []
"Oz4,19":
  text: "Przygniótł ich wiatr swoimi skrzydłami i zawstydzą się z powodu swoich krwawych ofiar."
  tags: []
