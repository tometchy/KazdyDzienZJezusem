"Oz2,1": "Mówcie do swoich braci: Ammi, i do swoich sióstr: Ruchama!"
"Oz2,2": "Spierajcie się z waszą matką, spierajcie się, bo ona nie jest moją żoną, a ja nie jestem jej mężem. Niech usunie swój nierząd z twarzy, a swój znak cudzołóstwa spomiędzy swoich piersi;"
"Oz2,3": "Bym nie obnażył jej do naga i nie wystawił jej, jak w dniu jej narodzin; i nie uczynił ją podobną do pustyni, i nie upodobnił do suchej ziemi, i nie uśmiercił ją pragnieniem."
"Oz2,4": "A nad jej dziećmi nie zlituję się, gdyż są dziećmi nierządu."
"Oz2,5": "Bo ich matka uprawiała nierząd, bezwstydnie postępowała ich rodzicielka. Bo mówiła: Ach! Pójdę za moimi kochankami, którzy dają mi mój chleb i moją wodę, moją wełnę i mój len, moją oliwę i moje napoje."
"Oz2,6": "Dlatego oto zagrodzę drogę twoją cierniami i wymuruję przed nią mur, i nie znajdzie swoich ścieżek."
"Oz2,7": "I będzie biegać za swoimi kochankami, lecz ich nie dogoni; będzie ich szukać, lecz nie znajdzie. I powie: Ach! Pójdę i wrócę do swojego pierwszego męża, bo lepiej mi było wtedy niż teraz."
"Oz2,8": "Bo ona nie wie, że to ja dałem jej zboże, moszcz i oliwę, i pomnożyłem dla niej srebro i złoto, a oni używali tego dla Baala."
"Oz2,9": "Dlatego wrócę i zabiorę moje zboże w jego czasie, mój moszcz w jego porze, odejmę jej moją wełnę i mój len, do okrywania jej nagości."
"Oz2,10": "A teraz odkryję jej sprośność na oczach jej kochanków i nikt jej nie wyrwie z mojej ręki."
"Oz2,11": "I sprawię, że ustanie wszelka jej radość, jej święto, jej nów, jej szabat i wszelkie jej zgromadzenie."
"Oz2,12": "Zniszczę też jej winnicę i jej figowiec, o którym mówiła: To ich zapłata dla mnie, którą dali mi moi kochankowie. Więc zamienię je w leśne gąszcze i pożrą je polne zwierzęta."
"Oz2,13": "I ukarzę ją za te dni Baalów, którym spalała kadzidło i dla których była ozdobiona swoimi kolczykami i swoimi klejnotami, i chodziła za swoimi kochankami, a o mnie zapomniała – oświadczenie JHWH."
"Oz2,14": "Dlatego oto ja zwabię ją, zaprowadzę na pustynię i przemówię do jej serca;"
"Oz2,15": "I dam jej, tam jej winnice, a dolinę Akor jako wrota nadziei. I zaśpiewa mi tam jak za dni swojej młodości, jak w dniu jej wyjścia z ziemi Egiptu."
"Oz2,16": "I stanie się w tym dniu – oświadczenie JHWH, że zawołasz do mnie – „Mój mężu”, a nie będziesz do mnie więcej wołała – „Mój Baalu”!"
"Oz2,17": "I usunę z jej ust imiona baalów, a ich imię nie zostanie więcej wspomniane."
"Oz2,18": "W tym dniu zawrę dla nich przymierze z polnymi zwierzętami, z ptactwem niebios i z tym, co pełza po ziemi, a łuk i miecz, i wojnę wyrwę z ziemi, i sprawię, że położą się do snu bezpiecznie."
"Oz2,19": "I zaręczę cię z sobą na wieki; i zaręczę cię z sobą w sprawiedliwości, w prawości, w łasce i w miłosierdziu."
"Oz2,20": "I zaręczę cię z sobą w wierności i poznasz JHWH."
"Oz2,21": "I stanie się w tym dniu, że odpowiem – oświadczenie JHWH – odpowiem niebiosom, a one odpowiedzą ziemi;"
"Oz2,22": "A ziemia odpowie zbożu, moszczowi i oliwie, a te odpowiedzą Jizreel."
"Oz2,23": "Zasieję ją sobie na ziemi i zlituję się nad Lo-Ruchamą, i powiem do Lo-Ammi: Ty jesteś moim ludem! A on powie: Ty jesteś moim Bogiem."
