"Oz8,1":
  text: "Przyłóż róg do swoich ust. Jakby orzeł nad domem JHWH! Gdyż przestąpili moje przymierze i przekroczyli moje Prawo."
  tags: []
"Oz8,2":
  text: "Do mnie wołają: Mój Boże – znamy Cię – my Izrael"
  tags: []
"Oz8,3":
  text: "Ale Izrael odtrącił dobro. Wróg go ściga."
  tags: []
"Oz8,4":
  text: "Oni ustanawiają królów, ale nie ze mną; wybierają książąt, ale bez mojej wiedzy. Ze swojego srebra i złota czynią sobie bożki, by dorobić się zniszczenia."
  tags: []
"Oz8,5":
  text: "On odtrącił twojego cielca, Samario! Mój gniew zapłonął przeciwko nim. Jak długo nie będą oczyszczeni?"
  tags: []
"Oz8,6":
  text: "Tak to z Izraela! A on? Rzemieślnik go wykonał i nie jest on bogiem. Owszem, cielec Samarii rozleci się w drzazgi."
  tags: []
"Oz8,7":
  text: "Tak, sieją wiatr – i będą zbierać wicher. Nie ma zboża. Kłos nie wyda mąki, a choćby wydał, obcy ją pochłoną."
  tags: []
"Oz8,8":
  text: "Izrael został pochłonięty, wkrótce staną się wśród narodów jak zbyteczny sprzęt – nikt go nie pragnie."
  tags: []
"Oz8,9":
  text: "Bo oni odeszli do Asyrii! Dziki, osamotniony osioł! Efraim najął sobie kochanków!"
  tags: []
"Oz8,10":
  text: "Ale choć dają prezenty wśród narodów, wkrótce zbiorę ich na sąd i zaczną maleć pod brzemieniem króla książąt."
  tags: []
"Oz8,11":
  text: "Tak! Efraim namnożył ołtarzy, by grzeszyć; te ołtarze stały się dla niego powodem grzechu."
  tags: []
"Oz8,12":
  text: "Napisałem dla niego liczne moje Prawa, uważali je za coś obcego."
  tags: []
"Oz8,13":
  text: "Ofiary z moich darów składają w ofierze, mięso – i jedzą je! JHWH nie ma w nich upodobania. Wspomni wkrótce ich nieprawość i ukarze ich za grzechy. Oni powrócą do Egiptu."
  tags: []
"Oz8,14":
  text: "Bo zapomniał Izrael o swoim Stwórcy i pobudował świątynie, a Juda pomnożył miasta warowne. Ale ja poślę ogień na jego miasta i pożre jego pałace."
  tags: []
