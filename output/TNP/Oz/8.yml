"Oz8,1": "Przyłóż róg do swoich ust. Jakby orzeł nad domem JHWH! Gdyż przestąpili moje przymierze i przekroczyli moje Prawo."
"Oz8,2": "Do mnie wołają: Mój Boże – znamy Cię – my Izrael"
"Oz8,3": "Ale Izrael odtrącił dobro. Wróg go ściga."
"Oz8,4": "Oni ustanawiają królów, ale nie ze mną; wybierają książąt, ale bez mojej wiedzy. Ze swojego srebra i złota czynią sobie bożki, by dorobić się zniszczenia."
"Oz8,5": "On odtrącił twojego cielca, Samario! Mój gniew zapłonął przeciwko nim. Jak długo nie będą oczyszczeni?"
"Oz8,6": "Tak to z Izraela! A on? Rzemieślnik go wykonał i nie jest on bogiem. Owszem, cielec Samarii rozleci się w drzazgi."
"Oz8,7": "Tak, sieją wiatr – i będą zbierać wicher. Nie ma zboża. Kłos nie wyda mąki, a choćby wydał, obcy ją pochłoną."
"Oz8,8": "Izrael został pochłonięty, wkrótce staną się wśród narodów jak zbyteczny sprzęt – nikt go nie pragnie."
"Oz8,9": "Bo oni odeszli do Asyrii! Dziki, osamotniony osioł! Efraim najął sobie kochanków!"
"Oz8,10": "Ale choć dają prezenty wśród narodów, wkrótce zbiorę ich na sąd i zaczną maleć pod brzemieniem króla książąt."
"Oz8,11": "Tak! Efraim namnożył ołtarzy, by grzeszyć; te ołtarze stały się dla niego powodem grzechu."
"Oz8,12": "Napisałem dla niego liczne moje Prawa, uważali je za coś obcego."
"Oz8,13": "Ofiary z moich darów składają w ofierze, mięso – i jedzą je! JHWH nie ma w nich upodobania. Wspomni wkrótce ich nieprawość i ukarze ich za grzechy. Oni powrócą do Egiptu."
"Oz8,14": "Bo zapomniał Izrael o swoim Stwórcy i pobudował świątynie, a Juda pomnożył miasta warowne. Ale ja poślę ogień na jego miasta i pożre jego pałace."
