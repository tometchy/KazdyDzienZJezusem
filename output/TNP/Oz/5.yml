"Oz5,1":
  text: "Słuchajcie tego, kapłani, zwróć uwagę na to, domu Izraela i nakłoń ucha, domu króla. Bo przeciwko wam jest sąd, ponieważ staliście się sidłem dla Mispy i siecią rozciągniętą nad Taborem,"
  tags: []
"Oz5,2":
  text: "I rzeź buntowników pogłębiliście, ale ja będę karą dla każdego z nich."
  tags: []
"Oz5,3":
  text: "Ja znam Efraima i Izrael nie jest przede mną ukryty, bo teraz, Efraimie, uprawiasz nierząd. Izrael jest skalany."
  tags: []
"Oz5,4":
  text: "Ich uczynki nie dadzą im zawrócić do swojego Boga, bo duch nierządu jest w ich wnętrzu i nie znają JHWH."
  tags: []
"Oz5,5":
  text: "A pycha Izraela świadczy przeciwko niemu. I Izrael, i Efraim upadną z powodu swojej nieprawości, upadnie z nimi też Juda."
  tags: []
"Oz5,6":
  text: "Ze swoimi owcami i swoimi wołami pójdą, aby szukać JHWH, ale nie znajdą Go, bo odstąpił od nich."
  tags: []
"Oz5,7":
  text: "Sprzeniewierzyli się JHWH, bo napłodzili obcych synów, a teraz dzień nowiu pożre ich oraz ich dziedzictwo."
  tags: []
"Oz5,8":
  text: "Zadmijcie w róg w Gibei i w trąbę w Ramie; krzyczcie w Bet-Awen: Wróg za tobą, Beniaminie!"
  tags: []
"Oz5,9":
  text: "Efraim będzie spustoszony w dniu kary. Oznajmiłem wśród plemion Izraela to, co pewne."
  tags: []
"Oz5,10":
  text: "Książęta Judy byli jak ci, którzy przesuwają granice. Wyleję na nich swój gniew jak wodę."
  tags: []
"Oz5,11":
  text: "Efraim jest uciskany i kruszony przez sąd, gdyż zaczął chodzić za rozkazami ludzi."
  tags: []
"Oz5,12":
  text: "A ja będę dla Efraima jak mól, a dla domu Judy jak próchnica."
  tags: []
"Oz5,13":
  text: "I ujrzał Efraim swoją chorobę, a Juda swoją ranę, i poszedł Efraim do Asyrii i posłał do króla Jareb. Ale on nie będzie zdolnym was uzdrowić ani uleczyć waszej rany."
  tags: []
"Oz5,14":
  text: "Bo ja będę dla Efraima jak lew, a dla domu Judy jak lew młody. Ja, ja sam rozszarpię i odejdę; uniosę, a nikt ich nie wyratuje."
  tags: []
"Oz5,15":
  text: "Pójdę i powrócę do swojego miejsca, aż do czasu, gdy uznają swoją winę i zaczną szukać mojego oblicza. W ich utrapieniu będą o mnie zabiegać."
  tags: []
