"Oz5,1": "Słuchajcie tego, kapłani, zwróć uwagę na to, domu Izraela i nakłoń ucha, domu króla. Bo przeciwko wam jest sąd, ponieważ staliście się sidłem dla Mispy i siecią rozciągniętą nad Taborem,"
"Oz5,2": "I rzeź buntowników pogłębiliście, ale ja będę karą dla każdego z nich."
"Oz5,3": "Ja znam Efraima i Izrael nie jest przede mną ukryty, bo teraz, Efraimie, uprawiasz nierząd. Izrael jest skalany."
"Oz5,4": "Ich uczynki nie dadzą im zawrócić do swojego Boga, bo duch nierządu jest w ich wnętrzu i nie znają JHWH."
"Oz5,5": "A pycha Izraela świadczy przeciwko niemu. I Izrael, i Efraim upadną z powodu swojej nieprawości, upadnie z nimi też Juda."
"Oz5,6": "Ze swoimi owcami i swoimi wołami pójdą, aby szukać JHWH, ale nie znajdą Go, bo odstąpił od nich."
"Oz5,7": "Sprzeniewierzyli się JHWH, bo napłodzili obcych synów, a teraz dzień nowiu pożre ich oraz ich dziedzictwo."
"Oz5,8": "Zadmijcie w róg w Gibei i w trąbę w Ramie; krzyczcie w Bet-Awen: Wróg za tobą, Beniaminie!"
"Oz5,9": "Efraim będzie spustoszony w dniu kary. Oznajmiłem wśród plemion Izraela to, co pewne."
"Oz5,10": "Książęta Judy byli jak ci, którzy przesuwają granice. Wyleję na nich swój gniew jak wodę."
"Oz5,11": "Efraim jest uciskany i kruszony przez sąd, gdyż zaczął chodzić za rozkazami ludzi."
"Oz5,12": "A ja będę dla Efraima jak mól, a dla domu Judy jak próchnica."
"Oz5,13": "I ujrzał Efraim swoją chorobę, a Juda swoją ranę, i poszedł Efraim do Asyrii i posłał do króla Jareb. Ale on nie będzie zdolnym was uzdrowić ani uleczyć waszej rany."
"Oz5,14": "Bo ja będę dla Efraima jak lew, a dla domu Judy jak lew młody. Ja, ja sam rozszarpię i odejdę; uniosę, a nikt ich nie wyratuje."
"Oz5,15": "Pójdę i powrócę do swojego miejsca, aż do czasu, gdy uznają swoją winę i zaczną szukać mojego oblicza. W ich utrapieniu będą o mnie zabiegać."
