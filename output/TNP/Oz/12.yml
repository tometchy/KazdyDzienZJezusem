"Oz12,1": "Efraim karmi się wiatrem i goni wiatr wschodni. Każdego dnia mnoży kłamstwo i gwałt. Zawierają przymierze z Asyryjczykami i przynoszą oliwę do Egiptu."
"Oz12,2": "I wiedzie JHWH spór z Judą i ukarze Jakuba według jego dróg, odda mu według jego czynów."
"Oz12,3": "Już w łonie matki chwycił on za piętę swojego brata, a w sile wieku zmagał się z Bogiem."
"Oz12,4": "Walczył z aniołem i zwyciężył. Płakał i zabiegał o Jego przychylność. Znalazł Go w Betel i tam z nami rozmawiał;"
"Oz12,5": "A był to JHWH, Bóg Zastępów, JHWH, takie jest wspomnienie o Nim."
"Oz12,6": "A ty nawróć się do swego Boga, zabiegaj o miłosierdzie i sąd oraz oczekuj na swojego Boga – zawsze!"
"Oz12,7": "Kaanan! W jego ręku fałszywe szale, lubi wyłudzać!"
"Oz12,8": "Lecz Efraim powiedział: Jednak wzbogaciłem się, osiągnąłem dla siebie bogactwo. W całym moim trudzie nie znaleźli we mnie winy, która wynikała z grzechu."
"Oz12,9": "Lecz ja jestem JHWH, twój Bóg, od wyjścia z ziemi Egiptu. Sprawię ponownie, że zamieszkacie w namiotach, jak za dni uroczystych świąt."
"Oz12,10": "Przemawiałem do proroków, mnożyłem widzenia i przez proroków podawałem przypowieści."
"Oz12,11": "Czy niegodziwość jest w Gileadzie? Z pewnością staną się pustką! I w Gilgal ofiarowują cielce. Także ich ołtarze są jak stosy kamieni przy bruzdach polnych."
"Oz12,12": "I uciekł Jakub na pola Aramu, gdzie Izrael służył za żonę i za żonę strzegł stad."
"Oz12,13": "I JHWH przez proroka wyprowadził Izraela z Egiptu i przez proroka był strzeżony."
"Oz12,14": "Efraim nad wyraz gorzko pobudzałGo do gniewu. Pozostawi więc na nim krew przez niego przelaną i za jego zniewagę odpłaci mu jego PAN."
