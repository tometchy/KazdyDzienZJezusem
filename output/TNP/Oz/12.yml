"Oz12,1":
  text: "Efraim karmi się wiatrem i goni wiatr wschodni. Każdego dnia mnoży kłamstwo i gwałt. Zawierają przymierze z Asyryjczykami i przynoszą oliwę do Egiptu."
  tags: []
"Oz12,2":
  text: "I wiedzie JHWH spór z Judą i ukarze Jakuba według jego dróg, odda mu według jego czynów."
  tags: []
"Oz12,3":
  text: "Już w łonie matki chwycił on za piętę swojego brata, a w sile wieku zmagał się z Bogiem."
  tags: []
"Oz12,4":
  text: "Walczył z aniołem i zwyciężył. Płakał i zabiegał o Jego przychylność. Znalazł Go w Betel i tam z nami rozmawiał;"
  tags: []
"Oz12,5":
  text: "A był to JHWH, Bóg Zastępów, JHWH, takie jest wspomnienie o Nim."
  tags: []
"Oz12,6":
  text: "A ty nawróć się do swego Boga, zabiegaj o miłosierdzie i sąd oraz oczekuj na swojego Boga – zawsze!"
  tags: []
"Oz12,7":
  text: "Kaanan! W jego ręku fałszywe szale, lubi wyłudzać!"
  tags: []
"Oz12,8":
  text: "Lecz Efraim powiedział: Jednak wzbogaciłem się, osiągnąłem dla siebie bogactwo. W całym moim trudzie nie znaleźli we mnie winy, która wynikała z grzechu."
  tags: []
"Oz12,9":
  text: "Lecz ja jestem JHWH, twój Bóg, od wyjścia z ziemi Egiptu. Sprawię ponownie, że zamieszkacie w namiotach, jak za dni uroczystych świąt."
  tags: []
"Oz12,10":
  text: "Przemawiałem do proroków, mnożyłem widzenia i przez proroków podawałem przypowieści."
  tags: []
"Oz12,11":
  text: "Czy niegodziwość jest w Gileadzie? Z pewnością staną się pustką! I w Gilgal ofiarowują cielce. Także ich ołtarze są jak stosy kamieni przy bruzdach polnych."
  tags: []
"Oz12,12":
  text: "I uciekł Jakub na pola Aramu, gdzie Izrael służył za żonę i za żonę strzegł stad."
  tags: []
"Oz12,13":
  text: "I JHWH przez proroka wyprowadził Izraela z Egiptu i przez proroka był strzeżony."
  tags: []
"Oz12,14":
  text: "Efraim nad wyraz gorzko pobudzałGo do gniewu. Pozostawi więc na nim krew przez niego przelaną i za jego zniewagę odpłaci mu jego PAN."
  tags: []
