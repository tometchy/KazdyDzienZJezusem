"Oz6,1": "Chodźcie i wróćmy do JHWH, Tak, On nas rozszarpał i On nas uzdrowi; uderzył, ale nas opatrzy."
"Oz6,2": "Ożywi nas po dwóch dniach, w trzecim dniu nas podniesie i będziemy żyli przed Jego obliczem."
"Oz6,3": "Poznajmy i starajmy się usilnie poznać JHWH. Jego nadejście jest pewne jak świt, przyjdzie do nas jak deszcz, jak późny deszcz zraszający, jak ulewa na ziemię."
"Oz6,4": "Co mam ci uczynić, Efraimie? Co mam ci uczynić, Judo? Przecież wasze miłosierdzie jest jak obłok poranny i jak rosa szybko znikająca."
"Oz6,5": "Dlatego ciosałem ich przez proroków, zabijałem ich słowami moich ust, a moje orzeczenia jak światłość wzejdą nad tobą."
"Oz6,6": "Bo miłosierdzia pragnę, a nie krwawej ofiary i poznania Boga – bardziej niż ofiar całopalnych."
"Oz6,7": "Ale oni podeptali moje przymierze jak Adam, właśnie wtedy mi się sprzeniewierzyli."
"Oz6,8": "Gilead jest miastem czyniących nieprawość, naznaczone krwią."
"Oz6,9": "I jak zaczajone na człowieka bandy, zgraja kapłanów morduje na drodze do Sychem, tak popełniają czyny niegodziwe."
"Oz6,10": "Widziałem w domu Izraela okropności: Jakiż nierząd u Efraima! Splamił się Izrael!"
"Oz6,11": "Także dla ciebie, Judo, wyznaczone jest żniwo, gdy odwrócę niewolę mojego ludu."
