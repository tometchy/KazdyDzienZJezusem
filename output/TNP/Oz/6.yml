"Oz6,1":
  text: "Chodźcie i wróćmy do JHWH, Tak, On nas rozszarpał i On nas uzdrowi; uderzył, ale nas opatrzy."
  tags: []
"Oz6,2":
  text: "Ożywi nas po dwóch dniach, w trzecim dniu nas podniesie i będziemy żyli przed Jego obliczem."
  tags: []
"Oz6,3":
  text: "Poznajmy i starajmy się usilnie poznać JHWH. Jego nadejście jest pewne jak świt, przyjdzie do nas jak deszcz, jak późny deszcz zraszający, jak ulewa na ziemię."
  tags: []
"Oz6,4":
  text: "Co mam ci uczynić, Efraimie? Co mam ci uczynić, Judo? Przecież wasze miłosierdzie jest jak obłok poranny i jak rosa szybko znikająca."
  tags: []
"Oz6,5":
  text: "Dlatego ciosałem ich przez proroków, zabijałem ich słowami moich ust, a moje orzeczenia jak światłość wzejdą nad tobą."
  tags: []
"Oz6,6":
  text: "Bo miłosierdzia pragnę, a nie krwawej ofiary i poznania Boga – bardziej niż ofiar całopalnych."
  tags: []
"Oz6,7":
  text: "Ale oni podeptali moje przymierze jak Adam, właśnie wtedy mi się sprzeniewierzyli."
  tags: []
"Oz6,8":
  text: "Gilead jest miastem czyniących nieprawość, naznaczone krwią."
  tags: []
"Oz6,9":
  text: "I jak zaczajone na człowieka bandy, zgraja kapłanów morduje na drodze do Sychem, tak popełniają czyny niegodziwe."
  tags: []
"Oz6,10":
  text: "Widziałem w domu Izraela okropności: Jakiż nierząd u Efraima! Splamił się Izrael!"
  tags: []
"Oz6,11":
  text: "Także dla ciebie, Judo, wyznaczone jest żniwo, gdy odwrócę niewolę mojego ludu."
  tags: []
