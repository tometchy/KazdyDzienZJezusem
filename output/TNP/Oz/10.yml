"Oz10,1": "Izrael to płodna winorośl, dla siebie przynosi owoc. Im więcej jego owocu, tym więcej stawiania ołtarzy, a im obfitsza była jego ziemia, tym piękniejsze wystawiał stele."
"Oz10,2": "Ich serce jest podzielone, teraz okażą się winni. On skręci kark ich ołtarzom i spustoszy ich stele."
"Oz10,3": "Tak teraz powiedzą: Nie ma króla dla nas, gdyż nie baliśmy się JHWH, a król – co dla nas uczyni?"
"Oz10,4": "Wypowiadają słowa, by przysięgać daremnie, by zawierać przymierze. I jak trujące winogrona rozplenia się sąd na bruzdach pola."
"Oz10,5": "O cielca Bet-Awen drżą mieszkańcy Samarii. Bo lamentuje nad nim – jego lud i jego kapłani, radujący się nad nim, nad jego chwałą – bo odeszła od niego."
"Oz10,6": "Również i on zostanie zaprowadzony do Asyrii jako dar dla króla Jareb. Efraim okryje się hańbą, a Izrael będzie się wstydził z powodu swojego planu."
"Oz10,7": "Samaria zostanie wycięta, jej król jak piana na powierzchni wody."
"Oz10,8": "Wyżyny Awen zostaną zniszczone – grzech Izraela. Cierń i oset wyrośnie na ich ołtarzach. I powiedzą do gór: Przykryjcie nas, a do pagórków: Padnijcie na nas."
"Oz10,9": "Od dni Gibea grzeszyłeś, Izraelu. Tam powstaliście. Czy nie dosięgnie ich w Gibea wojna przeciwko synom nieprawości?"
"Oz10,10": "Z mojej woli ukarzę ich; zbiorę przeciwko nim ludy, by ich związać za ich podwójną nieprawość."
"Oz10,11": "A Efraim jest wyćwiczoną jałówką, lubiącą młócić. Lecz ja przełożę jarzmo nad pięknem jej karku. Zaprzęgnę Efraima! Juda będzie orał, a Jakub za nim bronował."
"Oz10,12": "Zasiejcie dla siebie sprawiedliwość, zbierajcie plon zgodnie z wiernością, orzcie dla siebie ugór. A czas już by szukać JHWH, aż przyjdzie i spuści na was deszcz prawości."
"Oz10,13": "Lecz wy oraliście niegodziwość, zbieraliście plon nieprawości, jedliście owoc kłamstwa. Bo zaufałeś swojej drodze i mnóstwu swoich wojowników."
"Oz10,14": "I powstanie zgiełk pośród twojego ludu, a wszystkie twoje umocnienia zostaną zburzone, tak jak Szalman spustoszył Bet-Arbel w dniu bitwy, gdy matkę rozpłatano na synach."
"Oz10,15": "Tak uczynię dla was, Betel, z powodu waszej strasznej niegodziwości. O świcie król Izraela zostanie doszczętnie zniszczony."
