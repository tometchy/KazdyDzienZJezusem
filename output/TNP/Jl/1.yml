"Jl1,1": "Słowo JHWH, które stało się do Joela, syna Petuela."
"Jl1,2": "Słuchajcie tego starsi, nakłońcie ucha wszyscy mieszkańcy tej ziemi. Czy stało się to za waszych dni albo za dni waszych ojców?"
"Jl1,3": "Wobec tego, opowiadajcie o tym swoim synom, a wasi synowie niech opowiedzą swoim synom, a ich synowie przyszłemu pokoleniu."
"Jl1,4": "Co zostało po gazam, pożarła arba, co zostało po arbie, pożarł jelek, a co zostało po jelku, pożarł chasil."
"Jl1,5": "Ocknijcie się pijani i płaczcie; a wszyscy pijący wino, zawódźcie nad słodkim winem, bo zostało odjęte od waszych ust."
"Jl1,6": "Bo nadciągnął naród do mojej ziemi, mocny i niezliczony, jego zęby zębami lwa, a siekacze jak lwicy."
"Jl1,7": "Wystawił moją winnicę na spustoszenie i rozłupał na drzazgi mój figowiec. Odarł go doszczętnie i porzucił – pobielały jego pędy."
"Jl1,8": "Lamentuj jak dziewica przepasana worem nad narzeczonym swojej młodości."
"Jl1,9": "Usunięto ofiarę z pokarmów i z płynów od domu JHWH; płaczą kapłani, słudzy JHWH."
"Jl1,10": "Pole zostało spustoszone, płacze ziemia. Tak, spustoszono zboże. Wysechł moszcz, zmarniała oliwa."
"Jl1,11": "Zarumieńcie się rolnicy; zawódźcie ogrodnicy z powodu pszenicy i jęczmienia, bo zginął plon pola."
"Jl1,12": "Uschła winorośl i zwiądł figowiec, drzewo granatowe, także palma daktylowa, jabłoń i wszystkie drzewa pola uschły. Tak też, radość uschła spośród synów ludzkich."
"Jl1,13": "Przepaszcie się i zawódźcie kapłani, lamentujcie słudzy ołtarza. Przyjdźcie i nocujcie w worach, słudzy mojego Boga, bo wstrzymano ofiarę z pokarmów i płynów w domu waszego Boga."
"Jl1,14": "Uświęćcie post, zwołajcie uroczyste zgromadzenie, zbierzcie starszych i wszystkich mieszkańców tej ziemi do domu JHWH, waszego Boga, i wołajcie do JHWH:"
"Jl1,15": "Ach! Cóż to za dzień?! Tak, bliski jest dzień JHWH, a nadejdzie jak spustoszenie od Wszechmogącego."
"Jl1,16": "Czyż na naszych oczach nie zginęła żywność, a z domu naszego Boga – radość i wesele?"
"Jl1,17": "Zgniły ziarna pod swoimi grudami, składy zostały spustoszone, spichlerze zostały zburzone, ponieważ uschło zboże."
"Jl1,18": "Jakże porykuje zwierzę? Błąkają się stada wołów, bo nie ma pastwisk, nawet stada owiec poniosły karę."
"Jl1,19": "Do Ciebie wołam, JHWH, bo ogień pochłonął łąki na stepie, a płomień spalił wszystkie drzewa pola;"
"Jl1,20": "Nawet zwierzęta pola ryczą do Ciebie, ponieważ wyschły koryta wód, a ogień pożarł pastwiska na stepie."
