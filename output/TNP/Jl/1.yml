"Jl1,1":
  text: "Słowo JHWH, które stało się do Joela, syna Petuela."
  tags: []
"Jl1,2":
  text: "Słuchajcie tego starsi, nakłońcie ucha wszyscy mieszkańcy tej ziemi. Czy stało się to za waszych dni albo za dni waszych ojców?"
  tags: []
"Jl1,3":
  text: "Wobec tego, opowiadajcie o tym swoim synom, a wasi synowie niech opowiedzą swoim synom, a ich synowie przyszłemu pokoleniu."
  tags: []
"Jl1,4":
  text: "Co zostało po gazam, pożarła arba, co zostało po arbie, pożarł jelek, a co zostało po jelku, pożarł chasil."
  tags: []
"Jl1,5":
  text: "Ocknijcie się pijani i płaczcie; a wszyscy pijący wino, zawódźcie nad słodkim winem, bo zostało odjęte od waszych ust."
  tags: []
"Jl1,6":
  text: "Bo nadciągnął naród do mojej ziemi, mocny i niezliczony, jego zęby zębami lwa, a siekacze jak lwicy."
  tags: []
"Jl1,7":
  text: "Wystawił moją winnicę na spustoszenie i rozłupał na drzazgi mój figowiec. Odarł go doszczętnie i porzucił – pobielały jego pędy."
  tags: []
"Jl1,8":
  text: "Lamentuj jak dziewica przepasana worem nad narzeczonym swojej młodości."
  tags: []
"Jl1,9":
  text: "Usunięto ofiarę z pokarmów i z płynów od domu JHWH; płaczą kapłani, słudzy JHWH."
  tags: []
"Jl1,10":
  text: "Pole zostało spustoszone, płacze ziemia. Tak, spustoszono zboże. Wysechł moszcz, zmarniała oliwa."
  tags: []
"Jl1,11":
  text: "Zarumieńcie się rolnicy; zawódźcie ogrodnicy z powodu pszenicy i jęczmienia, bo zginął plon pola."
  tags: []
"Jl1,12":
  text: "Uschła winorośl i zwiądł figowiec, drzewo granatowe, także palma daktylowa, jabłoń i wszystkie drzewa pola uschły. Tak też, radość uschła spośród synów ludzkich."
  tags: []
"Jl1,13":
  text: "Przepaszcie się i zawódźcie kapłani, lamentujcie słudzy ołtarza. Przyjdźcie i nocujcie w worach, słudzy mojego Boga, bo wstrzymano ofiarę z pokarmów i płynów w domu waszego Boga."
  tags: []
"Jl1,14":
  text: "Uświęćcie post, zwołajcie uroczyste zgromadzenie, zbierzcie starszych i wszystkich mieszkańców tej ziemi do domu JHWH, waszego Boga, i wołajcie do JHWH:"
  tags: []
"Jl1,15":
  text: "Ach! Cóż to za dzień?! Tak, bliski jest dzień JHWH, a nadejdzie jak spustoszenie od Wszechmogącego."
  tags: []
"Jl1,16":
  text: "Czyż na naszych oczach nie zginęła żywność, a z domu naszego Boga – radość i wesele?"
  tags: []
"Jl1,17":
  text: "Zgniły ziarna pod swoimi grudami, składy zostały spustoszone, spichlerze zostały zburzone, ponieważ uschło zboże."
  tags: []
"Jl1,18":
  text: "Jakże porykuje zwierzę? Błąkają się stada wołów, bo nie ma pastwisk, nawet stada owiec poniosły karę."
  tags: []
"Jl1,19":
  text: "Do Ciebie wołam, JHWH, bo ogień pochłonął łąki na stepie, a płomień spalił wszystkie drzewa pola;"
  tags: []
"Jl1,20":
  text: "Nawet zwierzęta pola ryczą do Ciebie, ponieważ wyschły koryta wód, a ogień pożarł pastwiska na stepie."
  tags: []
