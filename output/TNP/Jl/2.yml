"Jl2,1":
  text: "Zadmijcie w róg na Syjonie, krzyczcie na mojej świętej górze! Niech zadrżą wszyscy mieszkańcy tej ziemi, bo nadchodzi dzień JHWH. Tak, jest bliski!"
  tags: []
"Jl2,2":
  text: "Dzień ciemności i mroku, dzień obłoku i gęstej chmury, jak zorza rozciągnięta nad górami. Jak lud wielki i potężny. Takiego jak on nie było od wieków i po nim się nie powtórzy, aż do lat najdalszych pokoleń."
  tags: []
"Jl2,3":
  text: "Przed jego obliczem ogień pochłaniający, a po nim płomień palący. Przed jego obliczem ziemia jak ogród Eden, ale po nim spustoszony step – i nawet nie będzie możliwa ucieczka przed nim."
  tags: []
"Jl2,4":
  text: "Ich wygląd podobny do koni i pobiegną jak jeźdźcy."
  tags: []
"Jl2,5":
  text: "Z turkotem jakby rydwanów skaczą po szczytach gór – jak trzaskający płomień ognia, co pochłania ściernisko, jak lud potężny atakujący w szyku wojennym."
  tags: []
"Jl2,6":
  text: "Przed jego obliczem drżą ze strachu ludy, wszystkie ich twarze pokryje bladość."
  tags: []
"Jl2,7":
  text: "Biegną jak bohaterowie, wedrą się na mury niczym ludzie wojny; każdy z nich idzie swoją drogą i nie zbacza ze swoich ścieżek."
  tags: []
"Jl2,8":
  text: "I człowiek brata nie gnębi, każdy mąż idzie swoim traktem, a od pocisku spadającego nie będą powstrzymani."
  tags: []
"Jl2,9":
  text: "Napadną na miasto, wbiegną na mury, wdrapią się na domy i wejdą oknami jak złodziej."
  tags: []
"Jl2,10":
  text: "Przed Jego obliczem zadrży ziemia, zatrzęsą się niebiosa, słońce i księżyc będą zaćmione, a gwiazdy stracą swój blask."
  tags: []
"Jl2,11":
  text: "A JHWH wyda swój głos przed obliczem swego wojska, gdyż Jego obóz jest bardzo liczny, gdyż potężnym jest wykonawca Jego rozkazu. Bo wielki jest dzień JHWH i budzi wielki strach! I kto go przetrwa?"
  tags: []
"Jl2,12":
  text: "I dlatego teraz – oświadczenie JHWH, zawróćcie do mnie całym swoim sercem i w poście, i w płaczu, i lamencie."
  tags: []
"Jl2,13":
  text: "I rozdzierajcie swoje serca, a nie swoje szaty, i nawróćcie się do JHWH, waszego Boga, bo On jest łaskawy i życzliwy, nieskory do gniewu i wielki w miłosierdziu, i okazujący litość w czasie niedoli."
  tags: []
"Jl2,14":
  text: "Kto wie, czy nie zawróci i nie okaże litości, i nie zostawi po sobie błogosławieństwa na ofiarę z pokarmów i z płynów dla JHWH, waszego Boga?"
  tags: []
"Jl2,15":
  text: "Zadmijcie w róg na Syjonie, poświęćcie post, zwołajcie uroczyste zgromadzenie!"
  tags: []
"Jl2,16":
  text: "Zbierzcie lud, poświęćcie zgromadzenie, zbierzcie starców, zbierzcie dzieci i niemowlęta ssące piersi! Niech pan młody wyjdzie ze swojej komnaty, a panna młoda spoza zasłony."
  tags: []
"Jl2,17":
  text: "Niech kapłani, słudzy JHWH, płaczą między przedsionkiem, a ołtarzem, i niech mówią: Zlituj się, JHWH, nad swoim ludem i nie wydawaj swojego dziedzictwa na hańbę, aby obce narody nad nimi nie panowały. Dlaczego mieliby mówić wśród ludów: Gdzie jest ich Bóg?"
  tags: []
"Jl2,18":
  text: "I zapłonął JHWH gorliwością o swoją ziemię. I oszczędził swój lud."
  tags: []
"Jl2,19":
  text: "I odpowiedział JHWH. I powiedział do swojego ludu: Oto ja ześlę dla was zboże, moszcz i oliwę i nasycicie się tym. I nie wydam was już na hańbę wśród narodów."
  tags: []
"Jl2,20":
  text: "I odsunę od was wroga z północy i wypędzę go do ziemi suchej i spustoszonej. Obrócę jego oblicze w stronę Morza Wschodniego, a jego tył w stronę Morza Zachodniego; i wzniesie się jego smród i wzniesie się jego odór, gdyż spotężniał, aby działać."
  tags: []
"Jl2,21":
  text: "Nie bój się, ziemio! Ciesz się i raduj, gdyż to JHWH spotężniał, aby działać."
  tags: []
"Jl2,22":
  text: "Nie bójcie się, zwierzęta pól, bo zazielenią się pastwiska stepowe, bo drzewa przynoszą swoje owoce, figowiec i winorośl wydają swoją obfitość."
  tags: []
"Jl2,23":
  text: "A wy, synowie Syjonu, cieszcie się i radujcie w JHWH, waszym Bogu. Bo da dla was deszcz ku sprawiedliwości i ześle dla was ulewę – deszcz wczesny i późny, jak dawniej."
  tags: []
"Jl2,24":
  text: "I klepiska będą pełne ziarna, a tłocznie będą opływać moszczem i oliwą."
  tags: []
"Jl2,25":
  text: "Wynagrodzę wam lata, które pożarła arba, jelek i chasil, i gazam, moje wielkie wojsko, które wysyłałem na was."
  tags: []
"Jl2,26":
  text: "I będziecie obficie jeść i nasycicie się; i będziecie chwalili imię JHWH, swojego Boga, który dokonał z wami cudowną rzecz, a mój lud nie zazna wstydu na wieki."
  tags: []
"Jl2,27":
  text: "I poznacie, że ja jestem pośród Izraela, że ja jestem JHWH, wasz Bóg, i nie ma innego; a mój lud nie zazna wstydu na wieki."
  tags: []
"Jl2,28":
  text: "I stanie się potem, że wyleję swojego Ducha na wszelkie ciało, i będą prorokować wasi synowie i wasze córki, wasi starcy śnić będą sny, a wasi młodzieńcy – ujrzą wizje."
  tags: []
"Jl2,29":
  text: "I nawet na sługi i na służebnice wyleję w tych dniach swojego Ducha."
  tags: []
"Jl2,30":
  text: "I uczynię cuda na niebiosach i na ziemi, krew i ogień, i słupy dymu."
  tags: []
"Jl2,31":
  text: "Słońce zostanie zmienione w ciemność, a księżyc w krew, przed moim obliczem, nim nadejdzie dzień JHWH, wielki i straszny."
  tags: []
"Jl2,32":
  text: "I stanie się, że każdy, kto wezwie imienia JHWH, zostanie wyzwolony, bo na górze Syjon i w Jerozolimie będzie wybawienie, tak jak powiedział JHWH – i wśród ocalałych, których JHWH wezwie."
  tags: []
