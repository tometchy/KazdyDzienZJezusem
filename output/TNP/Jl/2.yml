"Jl2,1": "Zadmijcie w róg na Syjonie, krzyczcie na mojej świętej górze! Niech zadrżą wszyscy mieszkańcy tej ziemi, bo nadchodzi dzień JHWH. Tak, jest bliski!"
"Jl2,2": "Dzień ciemności i mroku, dzień obłoku i gęstej chmury, jak zorza rozciągnięta nad górami. Jak lud wielki i potężny. Takiego jak on nie było od wieków i po nim się nie powtórzy, aż do lat najdalszych pokoleń."
"Jl2,3": "Przed jego obliczem ogień pochłaniający, a po nim płomień palący. Przed jego obliczem ziemia jak ogród Eden, ale po nim spustoszony step – i nawet nie będzie możliwa ucieczka przed nim."
"Jl2,4": "Ich wygląd podobny do koni i pobiegną jak jeźdźcy."
"Jl2,5": "Z turkotem jakby rydwanów skaczą po szczytach gór – jak trzaskający płomień ognia, co pochłania ściernisko, jak lud potężny atakujący w szyku wojennym."
"Jl2,6": "Przed jego obliczem drżą ze strachu ludy, wszystkie ich twarze pokryje bladość."
"Jl2,7": "Biegną jak bohaterowie, wedrą się na mury niczym ludzie wojny; każdy z nich idzie swoją drogą i nie zbacza ze swoich ścieżek."
"Jl2,8": "I człowiek brata nie gnębi, każdy mąż idzie swoim traktem, a od pocisku spadającego nie będą powstrzymani."
"Jl2,9": "Napadną na miasto, wbiegną na mury, wdrapią się na domy i wejdą oknami jak złodziej."
"Jl2,10": "Przed Jego obliczem zadrży ziemia, zatrzęsą się niebiosa, słońce i księżyc będą zaćmione, a gwiazdy stracą swój blask."
"Jl2,11": "A JHWH wyda swój głos przed obliczem swego wojska, gdyż Jego obóz jest bardzo liczny, gdyż potężnym jest wykonawca Jego rozkazu. Bo wielki jest dzień JHWH i budzi wielki strach! I kto go przetrwa?"
"Jl2,12": "I dlatego teraz – oświadczenie JHWH, zawróćcie do mnie całym swoim sercem i w poście, i w płaczu, i lamencie."
"Jl2,13": "I rozdzierajcie swoje serca, a nie swoje szaty, i nawróćcie się do JHWH, waszego Boga, bo On jest łaskawy i życzliwy, nieskory do gniewu i wielki w miłosierdziu, i okazujący litość w czasie niedoli."
"Jl2,14": "Kto wie, czy nie zawróci i nie okaże litości, i nie zostawi po sobie błogosławieństwa na ofiarę z pokarmów i z płynów dla JHWH, waszego Boga?"
"Jl2,15": "Zadmijcie w róg na Syjonie, poświęćcie post, zwołajcie uroczyste zgromadzenie!"
"Jl2,16": "Zbierzcie lud, poświęćcie zgromadzenie, zbierzcie starców, zbierzcie dzieci i niemowlęta ssące piersi! Niech pan młody wyjdzie ze swojej komnaty, a panna młoda spoza zasłony."
"Jl2,17": "Niech kapłani, słudzy JHWH, płaczą między przedsionkiem, a ołtarzem, i niech mówią: Zlituj się, JHWH, nad swoim ludem i nie wydawaj swojego dziedzictwa na hańbę, aby obce narody nad nimi nie panowały. Dlaczego mieliby mówić wśród ludów: Gdzie jest ich Bóg?"
"Jl2,18": "I zapłonął JHWH gorliwością o swoją ziemię. I oszczędził swój lud."
"Jl2,19": "I odpowiedział JHWH. I powiedział do swojego ludu: Oto ja ześlę dla was zboże, moszcz i oliwę i nasycicie się tym. I nie wydam was już na hańbę wśród narodów."
"Jl2,20": "I odsunę od was wroga z północy i wypędzę go do ziemi suchej i spustoszonej. Obrócę jego oblicze w stronę Morza Wschodniego, a jego tył w stronę Morza Zachodniego; i wzniesie się jego smród i wzniesie się jego odór, gdyż spotężniał, aby działać."
"Jl2,21": "Nie bój się, ziemio! Ciesz się i raduj, gdyż to JHWH spotężniał, aby działać."
"Jl2,22": "Nie bójcie się, zwierzęta pól, bo zazielenią się pastwiska stepowe, bo drzewa przynoszą swoje owoce, figowiec i winorośl wydają swoją obfitość."
"Jl2,23": "A wy, synowie Syjonu, cieszcie się i radujcie w JHWH, waszym Bogu. Bo da dla was deszcz ku sprawiedliwości i ześle dla was ulewę – deszcz wczesny i późny, jak dawniej."
"Jl2,24": "I klepiska będą pełne ziarna, a tłocznie będą opływać moszczem i oliwą."
"Jl2,25": "Wynagrodzę wam lata, które pożarła arba, jelek i chasil, i gazam, moje wielkie wojsko, które wysyłałem na was."
"Jl2,26": "I będziecie obficie jeść i nasycicie się; i będziecie chwalili imię JHWH, swojego Boga, który dokonał z wami cudowną rzecz, a mój lud nie zazna wstydu na wieki."
"Jl2,27": "I poznacie, że ja jestem pośród Izraela, że ja jestem JHWH, wasz Bóg, i nie ma innego; a mój lud nie zazna wstydu na wieki."
"Jl2,28": "I stanie się potem, że wyleję swojego Ducha na wszelkie ciało, i będą prorokować wasi synowie i wasze córki, wasi starcy śnić będą sny, a wasi młodzieńcy – ujrzą wizje."
"Jl2,29": "I nawet na sługi i na służebnice wyleję w tych dniach swojego Ducha."
"Jl2,30": "I uczynię cuda na niebiosach i na ziemi, krew i ogień, i słupy dymu."
"Jl2,31": "Słońce zostanie zmienione w ciemność, a księżyc w krew, przed moim obliczem, nim nadejdzie dzień JHWH, wielki i straszny."
"Jl2,32": "I stanie się, że każdy, kto wezwie imienia JHWH, zostanie wyzwolony, bo na górze Syjon i w Jerozolimie będzie wybawienie, tak jak powiedział JHWH – i wśród ocalałych, których JHWH wezwie."
