"Mi4,1": "I stanie się w ostatecznych dniach, że góra domu JHWH będzie utwierdzona na szczytach gór i wywyższona ponad pagórki, a ludy do niej popłyną."
"Mi4,2": "I wiele narodów przybędzie, mówiąc: Chodźcie, wstąpmy na górę JHWH, do domu Boga Jakuba, i będzie nas nauczał swoich dróg, a my będziemy chodzili jego ścieżkami. Z Syjonu bowiem wyjdzie Prawo i Słowo JHWH z Jerozolimy."
"Mi4,3": "I będzie sądził wśród wielu ludów i będzie rozstrzygał sprawy potężnych i odległych narodów. I przekują swoje miecze na lemiesze, a swoje włócznie na noże winogrodnika. Naród na naród nie podniesie miecza i nie będą się więcej uczyć wojny."
"Mi4,4": "I usiądzie każdy człowiek pod swoją winoroślą i pod swoim figowcem i nikt nie będzie wzbudzał strachu, bo usta JHWH Zastępów to powiedziały."
"Mi4,5": "Bo wszystkie ludy, każdy człowiek pójdzie w imię swojego boga, ale my pójdziemy w imię JHWH, naszego Boga, na wieki wieków."
"Mi4,6": "W tym dniu – oświadczenie JHWH, zgromadzę chromą i zbiorę wygnaną oraz tę, którą skrzywdziłem;"
"Mi4,7": "A z tej chromej ustanowię resztkę, a z wygnanej – potężny naród. I JHWH będzie królował nad nimi na górze Syjon, odtąd aż na wieki."
"Mi4,8": "A ty, Wieżo Trzody, twierdzo córki Syjonu, do ciebie nadejdzie i przyjdzie wcześniejsze panowanie – królestwo córki Jerozolimy."
"Mi4,9": "Dlaczego teraz tak głośno krzyczysz? Czy nie ma króla u ciebie? Czy twój doradca zginął, że ból twój wzmógł się jak u rodzącej?"
"Mi4,10": "Wij się z bólu i przyj, córko Syjonu, jak rodząca, bo teraz wyjdziesz z miasta i zamieszkasz w polu, i pójdziesz aż do Babilonu. Tam będziesz wybawiona, tam cię JHWH odkupi z rąk twoich wrogów."
"Mi4,11": "Teraz zebrało się przeciwko tobie wiele narodów, mówiąc: Niech będzie zhańbiona, niech nasze oczy nasycą się patrząc na Syjon."
"Mi4,12": "One jednak nie znają myśli JHWH ani nie rozumieją Jego planów. Bo On zgromadził je jak snopy na klepisku."
"Mi4,13": "Wstań i młóć, córko Syjonu, bo twój róg uczynię z żelaza i twoje kopyta uczynię ze spiżu, i zmiażdżysz wiele ludów. I poświęcę ich łupy JHWH i ich bogactwo PANU całej ziemi."
