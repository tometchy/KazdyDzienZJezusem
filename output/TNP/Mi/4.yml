"Mi4,1":
  text: "I stanie się w ostatecznych dniach, że góra domu JHWH będzie utwierdzona na szczytach gór i wywyższona ponad pagórki, a ludy do niej popłyną."
  tags: []
"Mi4,2":
  text: "I wiele narodów przybędzie, mówiąc: Chodźcie, wstąpmy na górę JHWH, do domu Boga Jakuba, i będzie nas nauczał swoich dróg, a my będziemy chodzili jego ścieżkami. Z Syjonu bowiem wyjdzie Prawo i Słowo JHWH z Jerozolimy."
  tags: []
"Mi4,3":
  text: "I będzie sądził wśród wielu ludów i będzie rozstrzygał sprawy potężnych i odległych narodów. I przekują swoje miecze na lemiesze, a swoje włócznie na noże winogrodnika. Naród na naród nie podniesie miecza i nie będą się więcej uczyć wojny."
  tags: []
"Mi4,4":
  text: "I usiądzie każdy człowiek pod swoją winoroślą i pod swoim figowcem i nikt nie będzie wzbudzał strachu, bo usta JHWH Zastępów to powiedziały."
  tags: []
"Mi4,5":
  text: "Bo wszystkie ludy, każdy człowiek pójdzie w imię swojego boga, ale my pójdziemy w imię JHWH, naszego Boga, na wieki wieków."
  tags: []
"Mi4,6":
  text: "W tym dniu – oświadczenie JHWH, zgromadzę chromą i zbiorę wygnaną oraz tę, którą skrzywdziłem;"
  tags: []
"Mi4,7":
  text: "A z tej chromej ustanowię resztkę, a z wygnanej – potężny naród. I JHWH będzie królował nad nimi na górze Syjon, odtąd aż na wieki."
  tags: []
"Mi4,8":
  text: "A ty, Wieżo Trzody, twierdzo córki Syjonu, do ciebie nadejdzie i przyjdzie wcześniejsze panowanie – królestwo córki Jerozolimy."
  tags: []
"Mi4,9":
  text: "Dlaczego teraz tak głośno krzyczysz? Czy nie ma króla u ciebie? Czy twój doradca zginął, że ból twój wzmógł się jak u rodzącej?"
  tags: []
"Mi4,10":
  text: "Wij się z bólu i przyj, córko Syjonu, jak rodząca, bo teraz wyjdziesz z miasta i zamieszkasz w polu, i pójdziesz aż do Babilonu. Tam będziesz wybawiona, tam cię JHWH odkupi z rąk twoich wrogów."
  tags: []
"Mi4,11":
  text: "Teraz zebrało się przeciwko tobie wiele narodów, mówiąc: Niech będzie zhańbiona, niech nasze oczy nasycą się patrząc na Syjon."
  tags: []
"Mi4,12":
  text: "One jednak nie znają myśli JHWH ani nie rozumieją Jego planów. Bo On zgromadził je jak snopy na klepisku."
  tags: []
"Mi4,13":
  text: "Wstań i młóć, córko Syjonu, bo twój róg uczynię z żelaza i twoje kopyta uczynię ze spiżu, i zmiażdżysz wiele ludów. I poświęcę ich łupy JHWH i ich bogactwo PANU całej ziemi."
  tags: []
