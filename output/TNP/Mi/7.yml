"Mi7,1": "Biada mi! Stałem się bowiem jak po letnich zbiorach, jak pozostałość po winobraniu. Nie ma żadnego grona do zjedzenia, moja dusza pragnie wczesnej figi."
"Mi7,2": "Pobożny zniknął z ziemi, nie ma prawego wśród ludzi. Wszyscy czyhają na krew, każdy zastawia sieć na swojego brata."
"Mi7,3": "Do złego – choćby obiema rękami; do czynienia dobra – książę i sędzia zabiegają o łapówkę. A dostojnik? On mówi to, czego pożąda jego dusza i do spółki przekręcają sprawę."
"Mi7,4": "Najlepszy z nich jest jak kolec, najuczciwszy jak płot ciernisty. Dzień twoich stróżów i twojego nawiedzenia nadszedł; teraz nastanie pośród nich zamieszanie."
"Mi7,5": "Nie wierzcie bliźniemu, nie ufajcie przyjacielowi. Strzeż bramy swoich ust przed leżącą na twoim łonie."
"Mi7,6": "Bo syn znieważa ojca, córka powstaje przeciwko swojej matce, synowa przeciwko swojej teściowej, a wrogami człowieka są jego domownicy."
"Mi7,7": "Lecz ja będę wypatrywał JHWH, będę oczekiwał Boga mojego zbawienia. Mój Bóg mnie wysłucha."
"Mi7,8": "Nie raduj się z mojego powodu, moja nieprzyjaciółko! Chociaż upadłem – powstanę; chociaż siedzę w ciemności – JHWH jest moją światłością."
"Mi7,9": "Zniosę gniew JHWH, bo zgrzeszyłem przeciwko Niemu, aż będzie prowadził moją sprawę w sądzie i wykona na mnie sprawiedliwy sąd. Wyprowadzi mnie na światło i ujrzę Jego sprawiedliwość."
"Mi7,10": "I zobaczy to moja nieprzyjaciółka i okryje się wstydem ta, która do mnie powiedziała: Gdzie jest JHWH, twój Bóg? Moje oczy ujrzą ją, teraz będzie na podeptanie jak uliczne błoto."
"Mi7,11": "Dzień budowy twoich murów! Ten dzień! Dekret przeciwko tobie będzie oddalony."
"Mi7,12": "Ten dzień przyjdzie do ciebie od Aszur aż do miast Egiptu, od Egiptu aż po Rzekę, od morza aż do morza i od góry aż do góry."
"Mi7,13": "A ta ziemia stanie się pustkowiem z powodu swoich mieszkańców, z powodu owocu ich czynów."
"Mi7,14": "Paś swój lud laską swoją, trzodę swojego dziedzictwa, mieszkającą samotnie w zaroślach pośrodku Karmelu. Niech się pasą w Baszanie i Gileadzie jak za dawnych dni."
"Mi7,15": "Ukażę mu cudowne znaki, jak za dni twojego wyjścia z ziemi Egiptu."
"Mi7,16": "Ujrzą to narody i zawstydzą się całej swojej potęgi. Przyłożą rękę do ust, a ich uszy ogłuchną."
"Mi7,17": "Będą lizać proch niczym wąż, niczym pełzający po ziemi. Z drżeniem wyjdą ze swoich warowni do JHWH, naszego Boga; będą się bać i lękać Ciebie."
"Mi7,18": "Któż jest Bogiem jak Ty, który przebaczasz nieprawość i przechodzisz ponad przestępstwem resztki swojego dziedzictwa? Nie zachował swojego gniewu na zawsze, bo On ma upodobanie w miłosierdziu."
"Mi7,19": "Odnowi miłosierdzie nad nami, pokona nasze nieprawości i wrzuci w głębiny morza wszystkie nasze grzechy."
"Mi7,20": "Okażesz wierność Jakubowi i miłosierdzie Abrahamowi, tak jak przysiągłeś naszym ojcom za pradawnych dni."
