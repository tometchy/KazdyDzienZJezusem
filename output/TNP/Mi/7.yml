"Mi7,1":
  text: "Biada mi! Stałem się bowiem jak po letnich zbiorach, jak pozostałość po winobraniu. Nie ma żadnego grona do zjedzenia, moja dusza pragnie wczesnej figi."
  tags: []
"Mi7,2":
  text: "Pobożny zniknął z ziemi, nie ma prawego wśród ludzi. Wszyscy czyhają na krew, każdy zastawia sieć na swojego brata."
  tags: []
"Mi7,3":
  text: "Do złego – choćby obiema rękami; do czynienia dobra – książę i sędzia zabiegają o łapówkę. A dostojnik? On mówi to, czego pożąda jego dusza i do spółki przekręcają sprawę."
  tags: []
"Mi7,4":
  text: "Najlepszy z nich jest jak kolec, najuczciwszy jak płot ciernisty. Dzień twoich stróżów i twojego nawiedzenia nadszedł; teraz nastanie pośród nich zamieszanie."
  tags: []
"Mi7,5":
  text: "Nie wierzcie bliźniemu, nie ufajcie przyjacielowi. Strzeż bramy swoich ust przed leżącą na twoim łonie."
  tags: []
"Mi7,6":
  text: "Bo syn znieważa ojca, córka powstaje przeciwko swojej matce, synowa przeciwko swojej teściowej, a wrogami człowieka są jego domownicy."
  tags: []
"Mi7,7":
  text: "Lecz ja będę wypatrywał JHWH, będę oczekiwał Boga mojego zbawienia. Mój Bóg mnie wysłucha."
  tags: []
"Mi7,8":
  text: "Nie raduj się z mojego powodu, moja nieprzyjaciółko! Chociaż upadłem – powstanę; chociaż siedzę w ciemności – JHWH jest moją światłością."
  tags: []
"Mi7,9":
  text: "Zniosę gniew JHWH, bo zgrzeszyłem przeciwko Niemu, aż będzie prowadził moją sprawę w sądzie i wykona na mnie sprawiedliwy sąd. Wyprowadzi mnie na światło i ujrzę Jego sprawiedliwość."
  tags: []
"Mi7,10":
  text: "I zobaczy to moja nieprzyjaciółka i okryje się wstydem ta, która do mnie powiedziała: Gdzie jest JHWH, twój Bóg? Moje oczy ujrzą ją, teraz będzie na podeptanie jak uliczne błoto."
  tags: []
"Mi7,11":
  text: "Dzień budowy twoich murów! Ten dzień! Dekret przeciwko tobie będzie oddalony."
  tags: []
"Mi7,12":
  text: "Ten dzień przyjdzie do ciebie od Aszur aż do miast Egiptu, od Egiptu aż po Rzekę, od morza aż do morza i od góry aż do góry."
  tags: []
"Mi7,13":
  text: "A ta ziemia stanie się pustkowiem z powodu swoich mieszkańców, z powodu owocu ich czynów."
  tags: []
"Mi7,14":
  text: "Paś swój lud laską swoją, trzodę swojego dziedzictwa, mieszkającą samotnie w zaroślach pośrodku Karmelu. Niech się pasą w Baszanie i Gileadzie jak za dawnych dni."
  tags: []
"Mi7,15":
  text: "Ukażę mu cudowne znaki, jak za dni twojego wyjścia z ziemi Egiptu."
  tags: []
"Mi7,16":
  text: "Ujrzą to narody i zawstydzą się całej swojej potęgi. Przyłożą rękę do ust, a ich uszy ogłuchną."
  tags: []
"Mi7,17":
  text: "Będą lizać proch niczym wąż, niczym pełzający po ziemi. Z drżeniem wyjdą ze swoich warowni do JHWH, naszego Boga; będą się bać i lękać Ciebie."
  tags: []
"Mi7,18":
  text: "Któż jest Bogiem jak Ty, który przebaczasz nieprawość i przechodzisz ponad przestępstwem resztki swojego dziedzictwa? Nie zachował swojego gniewu na zawsze, bo On ma upodobanie w miłosierdziu."
  tags: []
"Mi7,19":
  text: "Odnowi miłosierdzie nad nami, pokona nasze nieprawości i wrzuci w głębiny morza wszystkie nasze grzechy."
  tags: []
"Mi7,20":
  text: "Okażesz wierność Jakubowi i miłosierdzie Abrahamowi, tak jak przysiągłeś naszym ojcom za pradawnych dni."
  tags: []
