"Mi3,1": "I powiedziałem: Słuchajcie proszę, przywódcy Jakuba i naczelnicy domu Izraela! Czy nie waszą rzeczą jest znać czym jest sprawiedliwy sąd?"
"Mi3,2": "Nienawidzicie dobra, kochacie zło, zdzieracie z ludu skórę i ciało z jego kości;"
"Mi3,3": "A ci, którzy jedzą ciało mojego ludu, skórę z niego zrywają, jego kości roztrzaskują i rozrzucają jak w garnku i jak mięso do kotła."
"Mi3,4": "Wtedy będą wołać do JHWH, a nie odpowie im, lecz zakryje swoje oblicze przed nimi w tym czasie, gdyż oni postępują niegodziwie w swych czynach."
"Mi3,5": "Tak mówi JHWH o tych prorokach, którzy zwodzą mój lud, którzy gryzą swoimi zębami i głoszą pokój, a temu, który nic im nie włoży do ust, uświęcają wojnę:"
"Mi3,6": "Dlatego noc wam! – Bez wizji i ciemność! – Bez wróżby. I zajdzie słońce nad tymi prorokami i przygaśnie dzień nad nimi."
"Mi3,7": "Wtedy widzący będą rozczarowani i wróżbiarze się zawstydzą. Oni wszyscy zakryją swoje brody, bo nie będzie żadnej odpowiedzi od Boga."
"Mi3,8": "A ja jednak jestem napełniony mocą, Duchem JHWH, sądem i siłą, aby oznajmić Jakubowi jego występki i Izraelowi jego grzech."
"Mi3,9": "Słuchajcie proszę tego, przywódcy domu Jakuba i naczelnicy domu Izraela, którzy brzydzicie się sądem i wykrzywiacie wszystko, co proste."
"Mi3,10": "Budujecie Syjon krwią, a Jerozolimę nieprawością."
"Mi3,11": "Jej przywódcy sądzą za łapówki, jego kapłani rozstrzygają za zapłatę, a jego prorocy przepowiadają przyszłość za srebro. Polegają jednak na JHWH, mówiąc: Czy JHWH nie jest wśród nas? Nie przyjdzie na nas nic złego."
"Mi3,12": "Dlatego Syjon zostanie z powodu was zaorany jak pole, z Jerozolimy zostanie sterta gruzu, a z góry domu – zalesione wzgórza."
