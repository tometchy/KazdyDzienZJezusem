"Mi3,1":
  text: "I powiedziałem: Słuchajcie proszę, przywódcy Jakuba i naczelnicy domu Izraela! Czy nie waszą rzeczą jest znać czym jest sprawiedliwy sąd?"
  tags: []
"Mi3,2":
  text: "Nienawidzicie dobra, kochacie zło, zdzieracie z ludu skórę i ciało z jego kości;"
  tags: []
"Mi3,3":
  text: "A ci, którzy jedzą ciało mojego ludu, skórę z niego zrywają, jego kości roztrzaskują i rozrzucają jak w garnku i jak mięso do kotła."
  tags: []
"Mi3,4":
  text: "Wtedy będą wołać do JHWH, a nie odpowie im, lecz zakryje swoje oblicze przed nimi w tym czasie, gdyż oni postępują niegodziwie w swych czynach."
  tags: []
"Mi3,5":
  text: "Tak mówi JHWH o tych prorokach, którzy zwodzą mój lud, którzy gryzą swoimi zębami i głoszą pokój, a temu, który nic im nie włoży do ust, uświęcają wojnę:"
  tags: []
"Mi3,6":
  text: "Dlatego noc wam! – Bez wizji i ciemność! – Bez wróżby. I zajdzie słońce nad tymi prorokami i przygaśnie dzień nad nimi."
  tags: []
"Mi3,7":
  text: "Wtedy widzący będą rozczarowani i wróżbiarze się zawstydzą. Oni wszyscy zakryją swoje brody, bo nie będzie żadnej odpowiedzi od Boga."
  tags: []
"Mi3,8":
  text: "A ja jednak jestem napełniony mocą, Duchem JHWH, sądem i siłą, aby oznajmić Jakubowi jego występki i Izraelowi jego grzech."
  tags: []
"Mi3,9":
  text: "Słuchajcie proszę tego, przywódcy domu Jakuba i naczelnicy domu Izraela, którzy brzydzicie się sądem i wykrzywiacie wszystko, co proste."
  tags: []
"Mi3,10":
  text: "Budujecie Syjon krwią, a Jerozolimę nieprawością."
  tags: []
"Mi3,11":
  text: "Jej przywódcy sądzą za łapówki, jego kapłani rozstrzygają za zapłatę, a jego prorocy przepowiadają przyszłość za srebro. Polegają jednak na JHWH, mówiąc: Czy JHWH nie jest wśród nas? Nie przyjdzie na nas nic złego."
  tags: []
"Mi3,12":
  text: "Dlatego Syjon zostanie z powodu was zaorany jak pole, z Jerozolimy zostanie sterta gruzu, a z góry domu – zalesione wzgórza."
  tags: []
