"Mi5,1":
  text: "Zbierz się teraz w oddziały, córko oddziału! Wał oblężniczy stanął przeciwko nam. Kijem będą bić w policzek sędziego Izraela."
  tags: []
"Mi5,2":
  text: "A ty, Betlejem Efrata, za małe aby być w tysiącach w Judzie, z ciebie wyjdzie Mi Ten, który będzie władcą w Izraelu, a Jego pochodzenie – pradawne, od wieczności."
  tags: []
"Mi5,3":
  text: "Dlatego wyda ich aż do czasu, kiedy rodząca porodzi i wtedy pozostałość Jego braci wróci do synów Izraela."
  tags: []
"Mi5,4":
  text: "Powstanie i będzie paść w mocy JHWH i w majestacie imienia JHWH, swojego Boga. I zamieszkają, bo teraz stanie się wielki aż po krańce ziemi."
  tags: []
"Mi5,5":
  text: "I Ten będzie pokojem. Gdy Aszur wkroczy do naszej ziemi i gdy podepcze nasze twierdze, wtedy wystawimy przeciwko niemu siedmiu pasterzy i ośmiu książąt z ludu."
  tags: []
"Mi5,6":
  text: "I złamią ziemię Aszur mieczem i ziemię Nimroda u jej wejścia. I wybawi nas od Aszur, gdy wkroczy do naszej ziemi i gdy będzie stąpał w naszych granicach."
  tags: []
"Mi5,7":
  text: "I stanie się resztka Jakuba pośród wielu ludów jak rosa od JHWH, jak ulewny deszcz na zieleń, które nie czekają na człowieka ani nie zwlekają z powodu synów ludzkich."
  tags: []
"Mi5,8":
  text: "Resztka Jakuba będzie pośród pogan, wśród wielu narodów, jak lew między leśnymi zwierzętami i jak lwiątko między trzodami owiec, które – gdy przechodzi – depcze i szarpie, i nie ma ocalenia."
  tags: []
"Mi5,9":
  text: "Wzniesie się twoja ręka nad twoimi wrogami, a wszyscy twoi przeciwnicy zostaną wycięci."
  tags: []
"Mi5,10":
  text: "I stanie się w tym dniu – oświadczenie JHWH – że wytnę twoje konie spośród ciebie i zniszczę twoje rydwany."
  tags: []
"Mi5,11":
  text: "Wytnę miasta twojej ziemi i zburzę wszystkie twoje umocnienia."
  tags: []
"Mi5,12":
  text: "Wytnę czary z twojej ręki i nie będzie u ciebie wróżbitów."
  tags: []
"Mi5,13":
  text: "Wytnę twoje rzeźbione bożki i twoje stele spośród ciebie i nie będziesz już oddawał pokłonu dziełu swoich rąk."
  tags: []
"Mi5,14":
  text: "Wyrwę twoje aszery spośród ciebie i zniszczę twoje miasta."
  tags: []
"Mi5,15":
  text: "W gniewie i zapalczywości dokonam zemsty nad narodami, które nie posłuchały."
  tags: []
