"Mi5,1": "Zbierz się teraz w oddziały, córko oddziału! Wał oblężniczy stanął przeciwko nam. Kijem będą bić w policzek sędziego Izraela."
"Mi5,2": "A ty, Betlejem Efrata, za małe aby być w tysiącach w Judzie, z ciebie wyjdzie Mi Ten, który będzie władcą w Izraelu, a Jego pochodzenie – pradawne, od wieczności."
"Mi5,3": "Dlatego wyda ich aż do czasu, kiedy rodząca porodzi i wtedy pozostałość Jego braci wróci do synów Izraela."
"Mi5,4": "Powstanie i będzie paść w mocy JHWH i w majestacie imienia JHWH, swojego Boga. I zamieszkają, bo teraz stanie się wielki aż po krańce ziemi."
"Mi5,5": "I Ten będzie pokojem. Gdy Aszur wkroczy do naszej ziemi i gdy podepcze nasze twierdze, wtedy wystawimy przeciwko niemu siedmiu pasterzy i ośmiu książąt z ludu."
"Mi5,6": "I złamią ziemię Aszur mieczem i ziemię Nimroda u jej wejścia. I wybawi nas od Aszur, gdy wkroczy do naszej ziemi i gdy będzie stąpał w naszych granicach."
"Mi5,7": "I stanie się resztka Jakuba pośród wielu ludów jak rosa od JHWH, jak ulewny deszcz na zieleń, które nie czekają na człowieka ani nie zwlekają z powodu synów ludzkich."
"Mi5,8": "Resztka Jakuba będzie pośród pogan, wśród wielu narodów, jak lew między leśnymi zwierzętami i jak lwiątko między trzodami owiec, które – gdy przechodzi – depcze i szarpie, i nie ma ocalenia."
"Mi5,9": "Wzniesie się twoja ręka nad twoimi wrogami, a wszyscy twoi przeciwnicy zostaną wycięci."
"Mi5,10": "I stanie się w tym dniu – oświadczenie JHWH – że wytnę twoje konie spośród ciebie i zniszczę twoje rydwany."
"Mi5,11": "Wytnę miasta twojej ziemi i zburzę wszystkie twoje umocnienia."
"Mi5,12": "Wytnę czary z twojej ręki i nie będzie u ciebie wróżbitów."
"Mi5,13": "Wytnę twoje rzeźbione bożki i twoje stele spośród ciebie i nie będziesz już oddawał pokłonu dziełu swoich rąk."
"Mi5,14": "Wyrwę twoje aszery spośród ciebie i zniszczę twoje miasta."
"Mi5,15": "W gniewie i zapalczywości dokonam zemsty nad narodami, które nie posłuchały."
