"Mi2,1":
  text: "Biada obmyślającym nieprawość i czyniącym zło na swoich łożach! W świetle poranka wykonują je, bo jest to w mocy ich ręki."
  tags: []
"Mi2,2":
  text: "Gdy pragną pól – rabują je; gdy domów – zabierają je. Gnębią mężczyznę i jego dom, także człowieka i jego dziedzictwo."
  tags: []
"Mi2,3":
  text: "Dlatego tak powiedział JHWH: Oto ja obmyślam dla tego rodu nieszczęście, spod którego nie będziecie mogli usunąć swych karków, ani nie będziecie chodzić zuchwale. Bo będzie to czas nieszczęścia."
  tags: []
"Mi2,4":
  text: "W tym dniu powstanie o was przypowieść i nastanie nad wami żałosny lament, mówiąc: Jesteśmy doszczętnie spustoszeni. Zamienia dział mojego ludu. Ach jakże mi go odjął! Nasze pola rozdzielił odstępcy."
  tags: []
"Mi2,5":
  text: "Dlatego nie będzie u ciebie nikogo rzucającego sznurem na los w zgromadzeniu JHWH."
  tags: []
"Mi2,6":
  text: "Nie prorokujcie, niech inni prorokują. Nie prorokują do nich: Nie ominie was hańba."
  tags: []
"Mi2,7":
  text: "Czy tak powinno się mówić, domu Jakuba – zniecierpliwił się Duch JHWH? Czy takie są Jego czyny? Czy moje słowa nie są dobre dla tego, który postępuje w sposób prawy?"
  tags: []
"Mi2,8":
  text: "Lecz ostatnio mój lud powstaje niczym wróg. Zdzieracie płaszcz wraz z szatą z przechodzących bezpiecznie, jakby powracających z wojny."
  tags: []
"Mi2,9":
  text: "Kobiety mojego ludu wypędzacie z ich wygodnych domów; ich dzieciom odebraliście moją świetność na zawsze."
  tags: []
"Mi2,10":
  text: "Powstańcie i idźcie, bo nie ta jest miejscem odpoczynku. Z powodu tego, że jest skalana, zniszczy was i to zniszczenie będzie bolesne."
  tags: []
"Mi2,11":
  text: "O tak!. Człowiek chodzący za wiatrem i oszust mówiący kłamstwo: Będę prorokował o winie i o mocnym napoju – taki to będzie prorokiem tego ludu."
  tags: []
"Mi2,12":
  text: "Na pewno zgromadzę ciebie całego, Jakubie, na pewno zbiorę resztkę Izraela. Uczynię z nich jedno jak owce w zagrodzie, jak trzodę w środku pastwiska, i będzie gwar jak pośród ludzi."
  tags: []
"Mi2,13":
  text: "Wstąpił przed ich obliczem ten, który toruje drogę. Przebili się, przeszli przez bramę i przez nią wyszli. Ich król przejdzie przed ich obliczem, a JHWH na ich czele."
  tags: []
