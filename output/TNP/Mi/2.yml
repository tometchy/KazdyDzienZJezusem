"Mi2,1": "Biada obmyślającym nieprawość i czyniącym zło na swoich łożach! W świetle poranka wykonują je, bo jest to w mocy ich ręki."
"Mi2,2": "Gdy pragną pól – rabują je; gdy domów – zabierają je. Gnębią mężczyznę i jego dom, także człowieka i jego dziedzictwo."
"Mi2,3": "Dlatego tak powiedział JHWH: Oto ja obmyślam dla tego rodu nieszczęście, spod którego nie będziecie mogli usunąć swych karków, ani nie będziecie chodzić zuchwale. Bo będzie to czas nieszczęścia."
"Mi2,4": "W tym dniu powstanie o was przypowieść i nastanie nad wami żałosny lament, mówiąc: Jesteśmy doszczętnie spustoszeni. Zamienia dział mojego ludu. Ach jakże mi go odjął! Nasze pola rozdzielił odstępcy."
"Mi2,5": "Dlatego nie będzie u ciebie nikogo rzucającego sznurem na los w zgromadzeniu JHWH."
"Mi2,6": "Nie prorokujcie, niech inni prorokują. Nie prorokują do nich: Nie ominie was hańba."
"Mi2,7": "Czy tak powinno się mówić, domu Jakuba – zniecierpliwił się Duch JHWH? Czy takie są Jego czyny? Czy moje słowa nie są dobre dla tego, który postępuje w sposób prawy?"
"Mi2,8": "Lecz ostatnio mój lud powstaje niczym wróg. Zdzieracie płaszcz wraz z szatą z przechodzących bezpiecznie, jakby powracających z wojny."
"Mi2,9": "Kobiety mojego ludu wypędzacie z ich wygodnych domów; ich dzieciom odebraliście moją świetność na zawsze."
"Mi2,10": "Powstańcie i idźcie, bo nie ta jest miejscem odpoczynku. Z powodu tego, że jest skalana, zniszczy was i to zniszczenie będzie bolesne."
"Mi2,11": "O tak!. Człowiek chodzący za wiatrem i oszust mówiący kłamstwo: Będę prorokował o winie i o mocnym napoju – taki to będzie prorokiem tego ludu."
"Mi2,12": "Na pewno zgromadzę ciebie całego, Jakubie, na pewno zbiorę resztkę Izraela. Uczynię z nich jedno jak owce w zagrodzie, jak trzodę w środku pastwiska, i będzie gwar jak pośród ludzi."
"Mi2,13": "Wstąpił przed ich obliczem ten, który toruje drogę. Przebili się, przeszli przez bramę i przez nią wyszli. Ich król przejdzie przed ich obliczem, a JHWH na ich czele."
