"Mk1,1": "Początek Ewangelii Jezusa Chrystusa, Syna Bożego."
"Mk1,2": "Jak jest napisane u proroków: Oto Ja posyłam mojego posłańca przed Twoim obliczem, który przygotuje Twoją drogę przed Tobą;"
"Mk1,3": "Głos wołającego na pustyni: Przygotujcie drogę PANA; prostymi czyńcie Jego ścieżki."
"Mk1,4": "Jan był tym, który chrzcił na pustyni i głosił chrzest upamiętania na odpuszczenie grzechów."
"Mk1,5": "I zaczęła wychodzić do niego cała kraina judzka i mieszkańcy Jerozolimy; i wszyscy byli przez niego chrzczeni w Jordanie, wyznając swoje grzechy."
"Mk1,6": "A Jan przyodziany był w sierść wielbłąda, a wokół swoich bioder miał skórzany pas, i jadał szarańczę i polny miód,"
"Mk1,7": "Głosił też, mówiąc: Idzie za mną mocniejszy ode mnie, któremu nie jestem godny, schylając się, rozwiązać rzemienia Jego sandałów."
"Mk1,8": "Ja wprawdzie ochrzciłem was w wodzie, On natomiast będzie was chrzcił w Duchu Świętym."
"Mk1,9": "I stało się w tych dniach, że Jezus przyszedł z Nazaretu w Galilei i został ochrzczony przez Jana w Jordanie."
"Mk1,10": "I zaraz gdy wychodził z wody, ujrzał rozdarte niebiosa i Ducha zstępującego na Niego, jakby gołębica."
"Mk1,11": "I rozległ się głos z nieba: Ty jesteś moim umiłowanym Synem, w którym złożyłem swoje upodobanie."
"Mk1,12": "I zaraz Duch wypchnął Go na pustynię."
"Mk1,13": "I był tam na pustyni przez czterdzieści dni, kuszony przez szatana; i był ze zwierzętami, a aniołowie Mu służyli."
"Mk1,14": "A po tym, gdy Jan został wydany, przyszedł Jezus do Galilei, głosząc Ewangelię Królestwa Bożego,"
"Mk1,15": "I mówiąc: Wypełnił się czas i przybliżyło się Królestwo Boże; upamiętajcie się i wierzcie w Ewangelię."
"Mk1,16": "A gdy przechodził nad Morzem Galilejskim, ujrzał Szymona i Andrzeja, brata jego, zarzucających sieć rybacką w morze; bo byli rybakami."
"Mk1,17": "I Jezus powiedział im: Chodźcie za mną, a uczynię was rybakami ludzi."
"Mk1,18": "A oni zaraz pozostawili swoje sieci i poszli za Nim."
"Mk1,19": "I gdy odszedł stamtąd nieco dalej, zobaczył Jakuba, syna Zebedeusza, i Jana, jego brata, naprawiających w łodzi sieci."
"Mk1,20": "I zaraz ich wezwał; a oni pozostawili swojego ojca Zebedeusza w łodzi z najemnikami i poszli za Nim."
"Mk1,21": "I weszli do Kafarnaum; i zaraz w szabat Jezus wszedł do synagogi, i zaczął nauczać."
"Mk1,22": "I zdumiewali się z powodu Jego nauki; bowiem uczył ich, jak ktoś, kto ma władzę, a nie jak uczeni w Piśmie."
"Mk1,23": "I był w ich synagodze człowiek mający ducha nieczystego; ten wrzasnął słowami:"
"Mk1,24": "Ach! Co Tobie do nas, Jezusie Nazareńczyku? Przyszedłeś nas zniszczyć? Wiem, kim Ty jesteś, Święty Boga."
"Mk1,25": "I surowo upomniał go Jezus, mówiąc: Umilknij i wyjdź z niego."
"Mk1,26": "I potrząsnął nim duch nieczysty, wrzasnął potężnym głosem i wyszedł z niego."
"Mk1,27": "A wszyscy byli zdumieni, i zastanawiali się między sobą, mówiąc: Co to jest? Co to za nowa nauka, że z mocą rozkazuje nawet duchom nieczystym i są Mu posłuszne?"
"Mk1,28": "I wieść o Nim szybko się rozeszła po całej krainie wokół Galilei."
"Mk1,29": "I zaraz po wyjściu z synagogi, przyszli z Jakubem i Janem do domu Szymona i Andrzeja."
"Mk1,30": "A teściowa Szymona leżała w gorączce, i zaraz Mu o niej powiedziano."
"Mk1,31": "I gdy przystąpił do niej, podniósł ją, chwytając ją za rękę; i zaraz opuściła ją gorączka i usługiwała im."
"Mk1,32": "A gdy nastał wieczór i zaszło słońce, przynosili do Niego wszystkich, którzy mieli się źle i opętanych przez demony;"
"Mk1,33": "A całe miasto zgromadziło się u drzwi."
"Mk1,34": "I uzdrowił wielu, którzy się źle mieli z powodu rozlicznych chorób, i wygnał wiele demonów; a nie pozwolił mówić demonom, bo Go znały."
"Mk1,35": "A wcześnie rano, gdy było jeszcze ciemno, wstał, wyszedł i odszedł na puste miejsce, i tam się modlił."
"Mk1,36": "I pośpieszyli za Nim Szymon i ci, którzy z Nim byli;"
"Mk1,37": "A gdy Go znaleźli, powiedzieli do Niego: Wszyscy Cię szukają."
"Mk1,38": "I mówi im: Idźmy do pobliskich miasteczek, abym i tam głosił; po to bowiem przyszedłem."
"Mk1,39": "I głosił, będąc w ich synagogach po całej Galilei, i wyganiał demony."
"Mk1,40": "I przyszedł do Niego trędowaty, prosząc Go i gdy padł przed Nim na kolana, powiedział do Niego: Jeśli chcesz, możesz mnie oczyścić."
"Mk1,41": "A Jezus, pełen współczucia, wyciągnął rękę, dotknął go i powiedział mu: Chcę, bądź oczyszczony!"
"Mk1,42": "I gdy to powiedział, natychmiast zszedł z niego trąd i został oczyszczony."
"Mk1,43": "I surowo mu przykazał, i zaraz go odprawił,"
"Mk1,44": "I powiedział mu: Uważaj, abyś nikomu nic nie mówił; ale idź, pokaż się kapłanowi, i ofiaruj za swoje oczyszczenie to, co rozkazał Mojżesz, na świadectwo dla nich."
"Mk1,45": "Ale on gdy odszedł, zaczął bardzo rozgłaszać i rozpowiadać o tym, tak że Jezus nie mógł już jawnie wejść do miasta, ale był na zewnątrz, w miejscach odludnych. A ludzie przychodzili zewsząd do Niego."
