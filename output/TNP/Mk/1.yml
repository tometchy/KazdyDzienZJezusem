"Mk1,1":
  text: "Początek Ewangelii Jezusa Chrystusa, Syna Bożego."
  tags: []
"Mk1,2":
  text: "Jak jest napisane u proroków: Oto Ja posyłam mojego posłańca przed Twoim obliczem, który przygotuje Twoją drogę przed Tobą;"
  tags: []
"Mk1,3":
  text: "Głos wołającego na pustyni: Przygotujcie drogę PANA; prostymi czyńcie Jego ścieżki."
  tags: []
"Mk1,4":
  text: "Jan był tym, który chrzcił na pustyni i głosił chrzest upamiętania na odpuszczenie grzechów."
  tags: []
"Mk1,5":
  text: "I zaczęła wychodzić do niego cała kraina judzka i mieszkańcy Jerozolimy; i wszyscy byli przez niego chrzczeni w Jordanie, wyznając swoje grzechy."
  tags: []
"Mk1,6":
  text: "A Jan przyodziany był w sierść wielbłąda, a wokół swoich bioder miał skórzany pas, i jadał szarańczę i polny miód,"
  tags: []
"Mk1,7":
  text: "Głosił też, mówiąc: Idzie za mną mocniejszy ode mnie, któremu nie jestem godny, schylając się, rozwiązać rzemienia Jego sandałów."
  tags: []
"Mk1,8":
  text: "Ja wprawdzie ochrzciłem was w wodzie, On natomiast będzie was chrzcił w Duchu Świętym."
  tags: []
"Mk1,9":
  text: "I stało się w tych dniach, że Jezus przyszedł z Nazaretu w Galilei i został ochrzczony przez Jana w Jordanie."
  tags: []
"Mk1,10":
  text: "I zaraz gdy wychodził z wody, ujrzał rozdarte niebiosa i Ducha zstępującego na Niego, jakby gołębica."
  tags: []
"Mk1,11":
  text: "I rozległ się głos z nieba: Ty jesteś moim umiłowanym Synem, w którym złożyłem swoje upodobanie."
  tags: []
"Mk1,12":
  text: "I zaraz Duch wypchnął Go na pustynię."
  tags: []
"Mk1,13":
  text: "I był tam na pustyni przez czterdzieści dni, kuszony przez szatana; i był ze zwierzętami, a aniołowie Mu służyli."
  tags: []
"Mk1,14":
  text: "A po tym, gdy Jan został wydany, przyszedł Jezus do Galilei, głosząc Ewangelię Królestwa Bożego,"
  tags: []
"Mk1,15":
  text: "I mówiąc: Wypełnił się czas i przybliżyło się Królestwo Boże; upamiętajcie się i wierzcie w Ewangelię."
  tags: []
"Mk1,16":
  text: "A gdy przechodził nad Morzem Galilejskim, ujrzał Szymona i Andrzeja, brata jego, zarzucających sieć rybacką w morze; bo byli rybakami."
  tags: []
"Mk1,17":
  text: "I Jezus powiedział im: Chodźcie za mną, a uczynię was rybakami ludzi."
  tags: []
"Mk1,18":
  text: "A oni zaraz pozostawili swoje sieci i poszli za Nim."
  tags: []
"Mk1,19":
  text: "I gdy odszedł stamtąd nieco dalej, zobaczył Jakuba, syna Zebedeusza, i Jana, jego brata, naprawiających w łodzi sieci."
  tags: []
"Mk1,20":
  text: "I zaraz ich wezwał; a oni pozostawili swojego ojca Zebedeusza w łodzi z najemnikami i poszli za Nim."
  tags: []
"Mk1,21":
  text: "I weszli do Kafarnaum; i zaraz w szabat Jezus wszedł do synagogi, i zaczął nauczać."
  tags: []
"Mk1,22":
  text: "I zdumiewali się z powodu Jego nauki; bowiem uczył ich, jak ktoś, kto ma władzę, a nie jak uczeni w Piśmie."
  tags: []
"Mk1,23":
  text: "I był w ich synagodze człowiek mający ducha nieczystego; ten wrzasnął słowami:"
  tags: []
"Mk1,24":
  text: "Ach! Co Tobie do nas, Jezusie Nazareńczyku? Przyszedłeś nas zniszczyć? Wiem, kim Ty jesteś, Święty Boga."
  tags: []
"Mk1,25":
  text: "I surowo upomniał go Jezus, mówiąc: Umilknij i wyjdź z niego."
  tags: []
"Mk1,26":
  text: "I potrząsnął nim duch nieczysty, wrzasnął potężnym głosem i wyszedł z niego."
  tags: []
"Mk1,27":
  text: "A wszyscy byli zdumieni, i zastanawiali się między sobą, mówiąc: Co to jest? Co to za nowa nauka, że z mocą rozkazuje nawet duchom nieczystym i są Mu posłuszne?"
  tags: []
"Mk1,28":
  text: "I wieść o Nim szybko się rozeszła po całej krainie wokół Galilei."
  tags: []
"Mk1,29":
  text: "I zaraz po wyjściu z synagogi, przyszli z Jakubem i Janem do domu Szymona i Andrzeja."
  tags: []
"Mk1,30":
  text: "A teściowa Szymona leżała w gorączce, i zaraz Mu o niej powiedziano."
  tags: []
"Mk1,31":
  text: "I gdy przystąpił do niej, podniósł ją, chwytając ją za rękę; i zaraz opuściła ją gorączka i usługiwała im."
  tags: []
"Mk1,32":
  text: "A gdy nastał wieczór i zaszło słońce, przynosili do Niego wszystkich, którzy mieli się źle i opętanych przez demony;"
  tags: []
"Mk1,33":
  text: "A całe miasto zgromadziło się u drzwi."
  tags: []
"Mk1,34":
  text: "I uzdrowił wielu, którzy się źle mieli z powodu rozlicznych chorób, i wygnał wiele demonów; a nie pozwolił mówić demonom, bo Go znały."
  tags: []
"Mk1,35":
  text: "A wcześnie rano, gdy było jeszcze ciemno, wstał, wyszedł i odszedł na puste miejsce, i tam się modlił."
  tags: []
"Mk1,36":
  text: "I pośpieszyli za Nim Szymon i ci, którzy z Nim byli;"
  tags: []
"Mk1,37":
  text: "A gdy Go znaleźli, powiedzieli do Niego: Wszyscy Cię szukają."
  tags: []
"Mk1,38":
  text: "I mówi im: Idźmy do pobliskich miasteczek, abym i tam głosił; po to bowiem przyszedłem."
  tags: []
"Mk1,39":
  text: "I głosił, będąc w ich synagogach po całej Galilei, i wyganiał demony."
  tags: []
"Mk1,40":
  text: "I przyszedł do Niego trędowaty, prosząc Go i gdy padł przed Nim na kolana, powiedział do Niego: Jeśli chcesz, możesz mnie oczyścić."
  tags: []
"Mk1,41":
  text: "A Jezus, pełen współczucia, wyciągnął rękę, dotknął go i powiedział mu: Chcę, bądź oczyszczony!"
  tags: []
"Mk1,42":
  text: "I gdy to powiedział, natychmiast zszedł z niego trąd i został oczyszczony."
  tags: []
"Mk1,43":
  text: "I surowo mu przykazał, i zaraz go odprawił,"
  tags: []
"Mk1,44":
  text: "I powiedział mu: Uważaj, abyś nikomu nic nie mówił; ale idź, pokaż się kapłanowi, i ofiaruj za swoje oczyszczenie to, co rozkazał Mojżesz, na świadectwo dla nich."
  tags: []
"Mk1,45":
  text: "Ale on gdy odszedł, zaczął bardzo rozgłaszać i rozpowiadać o tym, tak że Jezus nie mógł już jawnie wejść do miasta, ale był na zewnątrz, w miejscach odludnych. A ludzie przychodzili zewsząd do Niego."
  tags: []
