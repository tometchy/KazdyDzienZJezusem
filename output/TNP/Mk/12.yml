"Mk12,1": "I zaczął do nich mówić w podobieństwach: Pewien człowiek zasadził winnicę, ogrodził ją płotem, wykopał dół pod tłocznię, zbudował wieżę, i wynajął ją rolnikom, i odjechał."
"Mk12,2": "A we właściwym czasie posłał sługę do rolników, aby odebrał część z plonów tej winnicy."
"Mk12,3": "Lecz oni go pojmali i wychłostali, odsyłając z niczym."
"Mk12,4": "I ponownie posłał do nich drugiego sługę, którego obrzucili kamieniami, zranili w głowę i odesłali znieważonego."
"Mk12,5": "I ponownie posłał innego; a i tego zabili, i wielu innych również wychłostali lub pozabijali."
"Mk12,6": "Mając więc jeszcze jednego – swojego ukochanego syna, na końcu posłał go do nich, mówiąc: Uszanują mojego syna."
"Mk12,7": "Lecz owi robotnicy powiedzieli do siebie: To jest dziedzic; pójdźmy, zabijmy go, a dziedzictwo będzie nasze."
"Mk12,8": "A gdy go pochwycili, zabili i wyrzucili poza winnicę."
"Mk12,9": "Co więc uczyni pan winnicy? Przyjdzie i wygubi robotników, a winnicę odda innym."
"Mk12,10": "Czy nie czytaliście tych słów Pisma: Kamień, który odrzucili budujący, ten stał się głowicą węgła?"
"Mk12,11": "PAN to sprawił i jest to godne podziwu w naszych oczach."
"Mk12,12": "I starali się Go pojmać; bo poznali, że o nich powiedział to podobieństwo, lecz przestraszyli się tłumu. Więc opuścili Go i odeszli."
"Mk12,13": "I posłali do Niego niektórych spośród faryzeuszów i z herodian, aby Go pochwycić w mowie."
"Mk12,14": "A gdy oni przyszli, powiedzieli Mu: Nauczycielu, wiemy, że jesteś szczery i nie zważasz na nikogo; albowiem nie patrzysz na oblicze ludzi, ale w prawdzie nauczasz drogi Bożej; czy wolno dawać podatek Cezarowi, czy nie?"
"Mk12,15": "Dać go, czy nie dać? A On znając ich obłudę, powiedział im: Dlaczego mnie kusicie? Przynieście mi denara, abym go obejrzał."
"Mk12,16": "Wtedy Mu przynieśli; a On powiedział im: Czyj to jest obraz i napis? A oni Mu powiedzieli: Cezara."
"Mk12,17": "I Jezus w odpowiedzi, rzekł im: Oddawajcie więc, to co Cezara, Cezarowi, a to, co Boga, Bogu. I podziwiali Go."
"Mk12,18": "I przyszli do Niego saduceusze, którzy mówią, że nie ma powstania z martwych, i pytali Go, mówiąc:"
"Mk12,19": "Nauczycielu! Mojżesz napisał nam, że jeśli czyjś brat umrze i zostawi żonę, a dzieci nie pozostawi, to wtedy, jego brat ma pojąć jego żonę i wzbudzić potomka swojemu bratu."
"Mk12,20": "Było więc siedmiu braci; a pierwszy pojął żonę, umarł i nie zostawił potomka;"
"Mk12,21": "I drugi pojął ją, umarł, lecz i on nie zostawił potomka; a trzeci tak samo."
"Mk12,22": "A tak pojęło ją siedmiu braci i nie zostawili potomka. Na końcu po nich wszystkich umarła i ta kobieta."
"Mk12,23": "Zatem przy powstaniu z martwych, gdy powstaną, którego z nich będzie żoną? Bo ich siedmiu miało ją za żonę."
"Mk12,24": "I Jezus w odpowiedzi, rzekł im: Czy nie dlatego jesteście w błędzie, że nie znacie Pism, ani mocy Bożej?"
"Mk12,25": "Bo gdy powstaną z martwych, ani nie będą poślubiać, ani wychodzić za mąż; ale będą jak aniołowie w niebiosach."
"Mk12,26": "A o umarłych natomiast, że są wzbudzani, czy nie czytaliście w zwoju Mojżesza, jak Bóg powiedział do niego przy krzaku cierniowym: Ja jestem Bóg Abrahama, Bóg Izaaka i Bóg Jakuba?"
"Mk12,27": "Bóg nie jest Bogiem umarłych, ale Bogiem żywych; jesteście w wielkim błędzie."
"Mk12,28": "I przystąpił jeden z uczonych w Piśmie, który słyszał ich rozprawiających, a wiedząc, że im dobrze odpowiedział, spytał Go: Jakie jest pierwsze ze wszystkich przykazań?"
"Mk12,29": "A Jezus odpowiedział mu: Pierwsze ze wszystkich przykazań jest to: Słuchaj, Izraelu! PAN, Bóg nasz, PAN jest jeden."
"Mk12,30": "I: Będziesz miłował PANA, Boga twojego, z całego swojego serca, i z całej swojej duszy, i z całej swojej myśli, i z całej swojej siły; to jest pierwsze przykazanie."
"Mk12,31": "A drugie podobne, to: Będziesz miłował swego bliźniego jak samego siebie. Większego przykazania od tych nie ma."
"Mk12,32": "I powiedział do Niego uczony w Piśmie: Nauczycielu! Prawdziwie dobrze powiedziałeś, że jeden jest Bóg, i nie ma innego oprócz Niego."
"Mk12,33": "A miłować Go z całego serca, i z całej myśli, i z całej duszy, i z całej siły, i miłować bliźniego jak samego siebie, to więcej jest niż wszystkie całopalenia i ofiary."
"Mk12,34": "A Jezus widząc, że on mądrze odpowiedział, powiedział do niego: Niedaleko jesteś od Królestwa Bożego. I nikt nie ośmielał się Go już więcej pytać."
"Mk12,35": "A gdy im na to odpowiedział, Jezus, nauczając w świątyni, mówił: Jak mogą uczeni w Piśmie mówić, że Mesjasz jest synem Dawida?"
"Mk12,36": "Bo sam Dawid w Duchu Świętym powiedział: Rzekł PAN mojemu Panu: Siądź po mojej prawicy, aż położę nieprzyjaciół twoich pod podnóżek twoich stóp."
"Mk12,37": "Sam więc Dawid nazywa Go Panem, jak to możliwe, że jest Jego synem? A liczny tłum chętnie Go słuchał."
"Mk12,38": "I mówił do nich w swojej nauce: Uważajcie na uczonych w Piśmie, którzy chcą chodzić w długich szatach i być pozdrawiani na rynkach,"
"Mk12,39": "W synagogach zajmować pierwsze ławy i mieć pierwsze miejsca na wieczerzach,"
"Mk12,40": "Którzy objadają domy wdów, i to pod pozorem długich modlitw. Ci otrzymają większy wyrok."
"Mk12,41": "A Jezus, siedząc naprzeciwko skarbca, przypatrywał się jak tłum wrzucał pieniądze do skarbca i jak wielu bogatych wiele wrzucało."
"Mk12,42": "I gdy przyszła jedna uboga wdowa, wrzuciła dwa leptony czyli kodrantes."
"Mk12,43": "I przywołał swoich uczniów, mówiąc im: Zaprawdę mówię wam, że ta uboga wdowa wrzuciła więcej, niż ci wszyscy, którzy wrzucili do skarbca."
"Mk12,44": "Bo wszyscy wrzucili z tego, co im zbywało; ale ona ze swego ubóstwa wrzuciła wszystko co miała, wszystkie środki do życia."
