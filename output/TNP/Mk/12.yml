"Mk12,1":
  text: "I zaczął do nich mówić w podobieństwach: Pewien człowiek zasadził winnicę, ogrodził ją płotem, wykopał dół pod tłocznię, zbudował wieżę, i wynajął ją rolnikom, i odjechał."
  tags: []
"Mk12,2":
  text: "A we właściwym czasie posłał sługę do rolników, aby odebrał część z plonów tej winnicy."
  tags: []
"Mk12,3":
  text: "Lecz oni go pojmali i wychłostali, odsyłając z niczym."
  tags: []
"Mk12,4":
  text: "I ponownie posłał do nich drugiego sługę, którego obrzucili kamieniami, zranili w głowę i odesłali znieważonego."
  tags: []
"Mk12,5":
  text: "I ponownie posłał innego; a i tego zabili, i wielu innych również wychłostali lub pozabijali."
  tags: []
"Mk12,6":
  text: "Mając więc jeszcze jednego – swojego ukochanego syna, na końcu posłał go do nich, mówiąc: Uszanują mojego syna."
  tags: []
"Mk12,7":
  text: "Lecz owi robotnicy powiedzieli do siebie: To jest dziedzic; pójdźmy, zabijmy go, a dziedzictwo będzie nasze."
  tags: []
"Mk12,8":
  text: "A gdy go pochwycili, zabili i wyrzucili poza winnicę."
  tags: []
"Mk12,9":
  text: "Co więc uczyni pan winnicy? Przyjdzie i wygubi robotników, a winnicę odda innym."
  tags: []
"Mk12,10":
  text: "Czy nie czytaliście tych słów Pisma: Kamień, który odrzucili budujący, ten stał się głowicą węgła?"
  tags: []
"Mk12,11":
  text: "PAN to sprawił i jest to godne podziwu w naszych oczach."
  tags: []
"Mk12,12":
  text: "I starali się Go pojmać; bo poznali, że o nich powiedział to podobieństwo, lecz przestraszyli się tłumu. Więc opuścili Go i odeszli."
  tags: []
"Mk12,13":
  text: "I posłali do Niego niektórych spośród faryzeuszów i z herodian, aby Go pochwycić w mowie."
  tags: []
"Mk12,14":
  text: "A gdy oni przyszli, powiedzieli Mu: Nauczycielu, wiemy, że jesteś szczery i nie zważasz na nikogo; albowiem nie patrzysz na oblicze ludzi, ale w prawdzie nauczasz drogi Bożej; czy wolno dawać podatek Cezarowi, czy nie?"
  tags: []
"Mk12,15":
  text: "Dać go, czy nie dać? A On znając ich obłudę, powiedział im: Dlaczego mnie kusicie? Przynieście mi denara, abym go obejrzał."
  tags: []
"Mk12,16":
  text: "Wtedy Mu przynieśli; a On powiedział im: Czyj to jest obraz i napis? A oni Mu powiedzieli: Cezara."
  tags: []
"Mk12,17":
  text: "I Jezus w odpowiedzi, rzekł im: Oddawajcie więc, to co Cezara, Cezarowi, a to, co Boga, Bogu. I podziwiali Go."
  tags: []
"Mk12,18":
  text: "I przyszli do Niego saduceusze, którzy mówią, że nie ma powstania z martwych, i pytali Go, mówiąc:"
  tags: []
"Mk12,19":
  text: "Nauczycielu! Mojżesz napisał nam, że jeśli czyjś brat umrze i zostawi żonę, a dzieci nie pozostawi, to wtedy, jego brat ma pojąć jego żonę i wzbudzić potomka swojemu bratu."
  tags: []
"Mk12,20":
  text: "Było więc siedmiu braci; a pierwszy pojął żonę, umarł i nie zostawił potomka;"
  tags: []
"Mk12,21":
  text: "I drugi pojął ją, umarł, lecz i on nie zostawił potomka; a trzeci tak samo."
  tags: []
"Mk12,22":
  text: "A tak pojęło ją siedmiu braci i nie zostawili potomka. Na końcu po nich wszystkich umarła i ta kobieta."
  tags: []
"Mk12,23":
  text: "Zatem przy powstaniu z martwych, gdy powstaną, którego z nich będzie żoną? Bo ich siedmiu miało ją za żonę."
  tags: []
"Mk12,24":
  text: "I Jezus w odpowiedzi, rzekł im: Czy nie dlatego jesteście w błędzie, że nie znacie Pism, ani mocy Bożej?"
  tags: []
"Mk12,25":
  text: "Bo gdy powstaną z martwych, ani nie będą poślubiać, ani wychodzić za mąż; ale będą jak aniołowie w niebiosach."
  tags: []
"Mk12,26":
  text: "A o umarłych natomiast, że są wzbudzani, czy nie czytaliście w zwoju Mojżesza, jak Bóg powiedział do niego przy krzaku cierniowym: Ja jestem Bóg Abrahama, Bóg Izaaka i Bóg Jakuba?"
  tags: []
"Mk12,27":
  text: "Bóg nie jest Bogiem umarłych, ale Bogiem żywych; jesteście w wielkim błędzie."
  tags: []
"Mk12,28":
  text: "I przystąpił jeden z uczonych w Piśmie, który słyszał ich rozprawiających, a wiedząc, że im dobrze odpowiedział, spytał Go: Jakie jest pierwsze ze wszystkich przykazań?"
  tags: []
"Mk12,29":
  text: "A Jezus odpowiedział mu: Pierwsze ze wszystkich przykazań jest to: Słuchaj, Izraelu! PAN, Bóg nasz, PAN jest jeden."
  tags: []
"Mk12,30":
  text: "I: Będziesz miłował PANA, Boga twojego, z całego swojego serca, i z całej swojej duszy, i z całej swojej myśli, i z całej swojej siły; to jest pierwsze przykazanie."
  tags: []
"Mk12,31":
  text: "A drugie podobne, to: Będziesz miłował swego bliźniego jak samego siebie. Większego przykazania od tych nie ma."
  tags: []
"Mk12,32":
  text: "I powiedział do Niego uczony w Piśmie: Nauczycielu! Prawdziwie dobrze powiedziałeś, że jeden jest Bóg, i nie ma innego oprócz Niego."
  tags: []
"Mk12,33":
  text: "A miłować Go z całego serca, i z całej myśli, i z całej duszy, i z całej siły, i miłować bliźniego jak samego siebie, to więcej jest niż wszystkie całopalenia i ofiary."
  tags: []
"Mk12,34":
  text: "A Jezus widząc, że on mądrze odpowiedział, powiedział do niego: Niedaleko jesteś od Królestwa Bożego. I nikt nie ośmielał się Go już więcej pytać."
  tags: []
"Mk12,35":
  text: "A gdy im na to odpowiedział, Jezus, nauczając w świątyni, mówił: Jak mogą uczeni w Piśmie mówić, że Mesjasz jest synem Dawida?"
  tags: []
"Mk12,36":
  text: "Bo sam Dawid w Duchu Świętym powiedział: Rzekł PAN mojemu Panu: Siądź po mojej prawicy, aż położę nieprzyjaciół twoich pod podnóżek twoich stóp."
  tags: []
"Mk12,37":
  text: "Sam więc Dawid nazywa Go Panem, jak to możliwe, że jest Jego synem? A liczny tłum chętnie Go słuchał."
  tags: []
"Mk12,38":
  text: "I mówił do nich w swojej nauce: Uważajcie na uczonych w Piśmie, którzy chcą chodzić w długich szatach i być pozdrawiani na rynkach,"
  tags: []
"Mk12,39":
  text: "W synagogach zajmować pierwsze ławy i mieć pierwsze miejsca na wieczerzach,"
  tags: []
"Mk12,40":
  text: "Którzy objadają domy wdów, i to pod pozorem długich modlitw. Ci otrzymają większy wyrok."
  tags: []
"Mk12,41":
  text: "A Jezus, siedząc naprzeciwko skarbca, przypatrywał się jak tłum wrzucał pieniądze do skarbca i jak wielu bogatych wiele wrzucało."
  tags: []
"Mk12,42":
  text: "I gdy przyszła jedna uboga wdowa, wrzuciła dwa leptony czyli kodrantes."
  tags: []
"Mk12,43":
  text: "I przywołał swoich uczniów, mówiąc im: Zaprawdę mówię wam, że ta uboga wdowa wrzuciła więcej, niż ci wszyscy, którzy wrzucili do skarbca."
  tags: []
"Mk12,44":
  text: "Bo wszyscy wrzucili z tego, co im zbywało; ale ona ze swego ubóstwa wrzuciła wszystko co miała, wszystkie środki do życia."
  tags: []
