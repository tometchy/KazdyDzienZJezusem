"Mk4,1":
  text: "I ponownie zaczął nauczać nad morzem; a zgromadził się wokół Niego tak wielki tłum, że wstąpił do łodzi i siedział w niej na morzu, a cały lud był na lądzie nad morzem."
  tags: []
"Mk4,2":
  text: "I nauczał ich wielu rzeczy w podobieństwach, i w swej nauce mówił do nich:"
  tags: []
"Mk4,3":
  text: "Słuchajcie uważnie! Oto wyszedł siewca, aby siać."
  tags: []
"Mk4,4":
  text: "I stało się, gdy siał, że jedno ziarno padło przy drodze; i przyleciały ptaki z nieba, i je zjadły."
  tags: []
"Mk4,5":
  text: "Inne natomiast padło na miejsce skaliste, gdzie nie miało wiele ziemi; i szybko wzeszło, bo nie miało głębokiej ziemi;"
  tags: []
"Mk4,6":
  text: "A gdy słońce wzeszło, spaliło je, a ponieważ nie miało korzenia, uschło."
  tags: []
"Mk4,7":
  text: "A inne padło między ciernie; i wzrosły ciernie i je zadusiły, i nie wydało owocu."
  tags: []
"Mk4,8":
  text: "Inne natomiast padło na dobrą ziemię; i wydawało owoc pnąc się w górę i rosnąc; i przyniosło trzydziestokrotny, sześćdziesięciokrotny i stokrotny plon."
  tags: []
"Mk4,9":
  text: "I mówił im: Kto ma uszy, aby słuchać, niech słucha."
  tags: []
"Mk4,10":
  text: "A gdy został sam, pytali Go o to podobieństwo ci, co przy Nim byli wraz z dwunastoma."
  tags: []
"Mk4,11":
  text: "A On odpowiedział im: Wam jest dane poznać tajemnicę Królestwa Bożego; a tamtym, którzy są na zewnątrz, wszystko przekazuje się w podobieństwach;"
  tags: []
"Mk4,12":
  text: "Aby patrząc widzieli i nie zobaczyli, i słuchając słyszeli i nie zrozumieli, by się czasem nie nawrócili, i nie były im odpuszczone grzechy."
  tags: []
"Mk4,13":
  text: "I powiedział do nich: Nie rozumiecie tego podobieństwa? Jak więc zrozumiecie wszystkie inne podobieństwa?"
  tags: []
"Mk4,14":
  text: "Siewca rozsiewa słowo."
  tags: []
"Mk4,15":
  text: "A tymi przy drodze, gdzie siane jest słowo, są ci, którzy usłyszeli; i zaraz przychodzi szatan, i zabiera słowo, które jest zasiane w ich serca."
  tags: []
"Mk4,16":
  text: "I podobnie są ci posiani na skalistych miejscach, gdy usłyszą słowo, zaraz je z radością przyjmują;"
  tags: []
"Mk4,17":
  text: "A jednak nie mają w sobie korzenia i trwają tylko chwilę; potem, gdy przychodzi ucisk albo prześladowanie z powodu słowa, szybko się gorszą."
  tags: []
"Mk4,18":
  text: "A posiani w ciernie to ci, którzy słyszą słowo;"
  tags: []
"Mk4,19":
  text: "Ale troski tego wieku i zwodniczy urok bogactw, i usilne pragnienia pozostałych rzeczy wkraczają i zaduszają słowo; i staje się bezowocne."
  tags: []
"Mk4,20":
  text: "A na dobrą ziemię posiani są ci, którzy słuchają słowa i przyjmują je, i przynoszą plon trzydziestokrotny, sześćdziesięciokrotny i stokrotny."
  tags: []
"Mk4,21":
  text: "I mówił im: Czy wnosi się lampę, aby ją postawić pod korcem albo pod łóżkiem? A nie po to, by ją postawiono na świeczniku?"
  tags: []
"Mk4,22":
  text: "Bo nie ma nic ukrytego, co nie stałoby się widoczne, i nic nie stało się tak skryte, aby nie wyszło na jaw."
  tags: []
"Mk4,23":
  text: "Jeśli ktoś ma uszy, by słuchać, niech słucha!"
  tags: []
"Mk4,24":
  text: "I powiedział do nich: Zwracajcie uwagę na to, czego słuchacie; jaką miarą mierzycie, taką wam będzie odmierzone, i zostanie wam dodane; wam, którzy słuchacie."
  tags: []
"Mk4,25":
  text: "Bo ktokolwiek ma, będzie mu dane; a temu, kto nie ma, i to, co ma, zostanie mu zabrane."
  tags: []
"Mk4,26":
  text: "I mówił: Takie jest Królestwo Boże: jest jak ziarno, które człowiek rzuciłby w ziemię,"
  tags: []
"Mk4,27":
  text: "I czy by spał, czy wstawał we dnie i w nocy, nasienie będzie kiełkowało i rosło, a on sam nie wie jak."
  tags: []
"Mk4,28":
  text: "Bo ziemia sama z siebie plon wydaje, najpierw źdźbło, potem kłos, potem pełne ziarno w kłosie."
  tags: []
"Mk4,29":
  text: "A gdy wyda plon, zaraz zapuszcza się sierp, gdyż nadeszło żniwo."
  tags: []
"Mk4,30":
  text: "I mówił: Do czego przyrównamy Królestwo Boga lub jakim podobieństwem je przybliżymy?"
  tags: []
"Mk4,31":
  text: "Jest jak ziarno gorczycy, które, gdy jest zasiewane w ziemię, jest mniejsze od wszystkich nasion na ziemi;"
  tags: []
"Mk4,32":
  text: "I gdy zostaje zasiane, wzrasta i staje się większe nad wszystkie jarzyny, i wypuszcza wielkie gałęzie, tak że w jego cieniu ptaki z nieba mogą się zagnieździć."
  tags: []
"Mk4,33":
  text: "I w wielu takich podobieństwach mówił do nich słowo, stosownie do tego, jak mogli słuchać."
  tags: []
"Mk4,34":
  text: "A bez podobieństwa nie mówił do nich; natomiast na osobności wszystko wyjaśniał swoim uczniom."
  tags: []
"Mk4,35":
  text: "I tego dnia, gdy już nastał wieczór, powiedział do nich: Przeprawmy się na drugą stronę."
  tags: []
"Mk4,36":
  text: "I opuścili tłum, i wzięli Go ze sobą, tak jak był, w łodzi; ale i inne łódki były przy Nim."
  tags: []
"Mk4,37":
  text: "I nastała wielka burza, a wiatr wlewał fale do łodzi, tak że ona już się napełniła."
  tags: []
"Mk4,38":
  text: "A On był na rufie łodzi i spał na zagłówku; i obudzili Go, i mówili do Niego: Nauczycielu! Nie obchodzi Cię to, że giniemy?"
  tags: []
"Mk4,39":
  text: "A On podniósł się, skarcił wiatr i powiedział morzu: Umilknij i uspokój się! I ustał wiatr, i nastała wielka cisza."
  tags: []
"Mk4,40":
  text: "I powiedział im: Dlaczego jesteście tak bojaźliwi? Jeszcze nie macie wiary?"
  tags: []
"Mk4,41":
  text: "I ogarnął ich wielki lęk, i mówili do siebie nawzajem: Kim więc jest Ten, że wiatr i morze są Mu posłuszne?"
  tags: []
