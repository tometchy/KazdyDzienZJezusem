"Mk4,1": "I ponownie zaczął nauczać nad morzem; a zgromadził się wokół Niego tak wielki tłum, że wstąpił do łodzi i siedział w niej na morzu, a cały lud był na lądzie nad morzem."
"Mk4,2": "I nauczał ich wielu rzeczy w podobieństwach, i w swej nauce mówił do nich:"
"Mk4,3": "Słuchajcie uważnie! Oto wyszedł siewca, aby siać."
"Mk4,4": "I stało się, gdy siał, że jedno ziarno padło przy drodze; i przyleciały ptaki z nieba, i je zjadły."
"Mk4,5": "Inne natomiast padło na miejsce skaliste, gdzie nie miało wiele ziemi; i szybko wzeszło, bo nie miało głębokiej ziemi;"
"Mk4,6": "A gdy słońce wzeszło, spaliło je, a ponieważ nie miało korzenia, uschło."
"Mk4,7": "A inne padło między ciernie; i wzrosły ciernie i je zadusiły, i nie wydało owocu."
"Mk4,8": "Inne natomiast padło na dobrą ziemię; i wydawało owoc pnąc się w górę i rosnąc; i przyniosło trzydziestokrotny, sześćdziesięciokrotny i stokrotny plon."
"Mk4,9": "I mówił im: Kto ma uszy, aby słuchać, niech słucha."
"Mk4,10": "A gdy został sam, pytali Go o to podobieństwo ci, co przy Nim byli wraz z dwunastoma."
"Mk4,11": "A On odpowiedział im: Wam jest dane poznać tajemnicę Królestwa Bożego; a tamtym, którzy są na zewnątrz, wszystko przekazuje się w podobieństwach;"
"Mk4,12": "Aby patrząc widzieli i nie zobaczyli, i słuchając słyszeli i nie zrozumieli, by się czasem nie nawrócili, i nie były im odpuszczone grzechy."
"Mk4,13": "I powiedział do nich: Nie rozumiecie tego podobieństwa? Jak więc zrozumiecie wszystkie inne podobieństwa?"
"Mk4,14": "Siewca rozsiewa słowo."
"Mk4,15": "A tymi przy drodze, gdzie siane jest słowo, są ci, którzy usłyszeli; i zaraz przychodzi szatan, i zabiera słowo, które jest zasiane w ich serca."
"Mk4,16": "I podobnie są ci posiani na skalistych miejscach, gdy usłyszą słowo, zaraz je z radością przyjmują;"
"Mk4,17": "A jednak nie mają w sobie korzenia i trwają tylko chwilę; potem, gdy przychodzi ucisk albo prześladowanie z powodu słowa, szybko się gorszą."
"Mk4,18": "A posiani w ciernie to ci, którzy słyszą słowo;"
"Mk4,19": "Ale troski tego wieku i zwodniczy urok bogactw, i usilne pragnienia pozostałych rzeczy wkraczają i zaduszają słowo; i staje się bezowocne."
"Mk4,20": "A na dobrą ziemię posiani są ci, którzy słuchają słowa i przyjmują je, i przynoszą plon trzydziestokrotny, sześćdziesięciokrotny i stokrotny."
"Mk4,21": "I mówił im: Czy wnosi się lampę, aby ją postawić pod korcem albo pod łóżkiem? A nie po to, by ją postawiono na świeczniku?"
"Mk4,22": "Bo nie ma nic ukrytego, co nie stałoby się widoczne, i nic nie stało się tak skryte, aby nie wyszło na jaw."
"Mk4,23": "Jeśli ktoś ma uszy, by słuchać, niech słucha!"
"Mk4,24": "I powiedział do nich: Zwracajcie uwagę na to, czego słuchacie; jaką miarą mierzycie, taką wam będzie odmierzone, i zostanie wam dodane; wam, którzy słuchacie."
"Mk4,25": "Bo ktokolwiek ma, będzie mu dane; a temu, kto nie ma, i to, co ma, zostanie mu zabrane."
"Mk4,26": "I mówił: Takie jest Królestwo Boże: jest jak ziarno, które człowiek rzuciłby w ziemię,"
"Mk4,27": "I czy by spał, czy wstawał we dnie i w nocy, nasienie będzie kiełkowało i rosło, a on sam nie wie jak."
"Mk4,28": "Bo ziemia sama z siebie plon wydaje, najpierw źdźbło, potem kłos, potem pełne ziarno w kłosie."
"Mk4,29": "A gdy wyda plon, zaraz zapuszcza się sierp, gdyż nadeszło żniwo."
"Mk4,30": "I mówił: Do czego przyrównamy Królestwo Boga lub jakim podobieństwem je przybliżymy?"
"Mk4,31": "Jest jak ziarno gorczycy, które, gdy jest zasiewane w ziemię, jest mniejsze od wszystkich nasion na ziemi;"
"Mk4,32": "I gdy zostaje zasiane, wzrasta i staje się większe nad wszystkie jarzyny, i wypuszcza wielkie gałęzie, tak że w jego cieniu ptaki z nieba mogą się zagnieździć."
"Mk4,33": "I w wielu takich podobieństwach mówił do nich słowo, stosownie do tego, jak mogli słuchać."
"Mk4,34": "A bez podobieństwa nie mówił do nich; natomiast na osobności wszystko wyjaśniał swoim uczniom."
"Mk4,35": "I tego dnia, gdy już nastał wieczór, powiedział do nich: Przeprawmy się na drugą stronę."
"Mk4,36": "I opuścili tłum, i wzięli Go ze sobą, tak jak był, w łodzi; ale i inne łódki były przy Nim."
"Mk4,37": "I nastała wielka burza, a wiatr wlewał fale do łodzi, tak że ona już się napełniła."
"Mk4,38": "A On był na rufie łodzi i spał na zagłówku; i obudzili Go, i mówili do Niego: Nauczycielu! Nie obchodzi Cię to, że giniemy?"
"Mk4,39": "A On podniósł się, skarcił wiatr i powiedział morzu: Umilknij i uspokój się! I ustał wiatr, i nastała wielka cisza."
"Mk4,40": "I powiedział im: Dlaczego jesteście tak bojaźliwi? Jeszcze nie macie wiary?"
"Mk4,41": "I ogarnął ich wielki lęk, i mówili do siebie nawzajem: Kim więc jest Ten, że wiatr i morze są Mu posłuszne?"
