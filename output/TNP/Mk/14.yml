"Mk14,1":
  text: "A za dwa dni była Pascha i Święto Przaśników; i szukali arcykapłani i uczeni w Piśmie sposobu, jakby Go podstępnie pojmać i zabić."
  tags: []
"Mk14,2":
  text: "Lecz mówili: Nie w święto, aby czasem nie było rozruchów wśród ludu."
  tags: []
"Mk14,3":
  text: "A gdy On był w Betanii, w domu Szymona trędowatego, i spoczywał u stołu, przyszła kobieta, mająca flakonik alabastrowy czystego olejku nardowego, bardzo kosztownego, skruszyła ten flakonik alabastrowy i wylała zawartość na Jego głowę."
  tags: []
"Mk14,4":
  text: "A niektórzy oburzali się między sobą, mówiąc: Po co doszło do straty tego olejku?"
  tags: []
"Mk14,5":
  text: "Można bowiem było sprzedać to drożej niż za trzysta denarów i rozdać ubogim; i szorstko ją napominali."
  tags: []
"Mk14,6":
  text: "Ale Jezus powiedział: Dajcie jej spokój; dlaczego sprawiacie jej przykrość? Dobry uczynek spełniła wobec mnie."
  tags: []
"Mk14,7":
  text: "Ubogich bowiem zawsze macie pomiędzy sobą, i kiedykolwiek chcecie, możecie im dobrze czynić; ale mnie nie zawsze macie."
  tags: []
"Mk14,8":
  text: "Ona, co miała uczynić, to uczyniła – z wyprzedzeniem namaściła moje ciało na pogrzeb."
  tags: []
"Mk14,9":
  text: "Zaprawdę mówię wam: Gdziekolwiek na całym świecie będzie głoszona ta Ewangelia, to, co ona uczyniła, będzie opowiadane na jej pamiątkę."
  tags: []
"Mk14,10":
  text: "A Judasz Iskariota, jeden z dwunastu, odszedł do arcykapłanów, aby Go im wydać."
  tags: []
"Mk14,11":
  text: "A gdy to usłyszeli, uradowali się i obiecali dać mu srebro; szukał więc właściwego czasu, jakby Go wydać."
  tags: []
"Mk14,12":
  text: "A pierwszego dnia Święta Przaśników, gdy ofiarują Paschę, powiedzieli Mu Jego uczniowie: Gdzie chcesz, abyśmy poszli i przygotowali Ci Paschę, byś mógł ją spożyć?"
  tags: []
"Mk14,13":
  text: "I posłał dwóch ze swoich uczniów, i powiedział im: Odejdźcie do miasta, i spotka się z wami człowiek niosący dzban wody; idźcie za nim."
  tags: []
"Mk14,14":
  text: "A gdziekolwiek wszedłby, powiedzcie gospodarzowi: Nauczyciel mówi: Gdzie jest dla mnie pokój gościnny, abym mógł spożyć Paschę ze swoimi uczniami?"
  tags: []
"Mk14,15":
  text: "A on wskaże wam górny pokój, wielki, usłany i gotowy, tam przygotujcie ją dla nas."
  tags: []
"Mk14,16":
  text: "I wyszli uczniowie Jego, i przyszli do miasta, i znaleźli pokój tak, jak im powiedział, i przygotowali Paschę."
  tags: []
"Mk14,17":
  text: "I gdy nadszedł wieczór, przyszedł z dwunastoma."
  tags: []
"Mk14,18":
  text: "A gdy spoczywali przy stole i jedli, Jezus powiedział: Zaprawdę mówię wam, że jeden z was, ten który je ze mną, wyda mnie."
  tags: []
"Mk14,19":
  text: "A oni zaczęli się smucić i mówić do Niego jeden po drugim: Czy to nie ja? A inny: Chyba nie ja?"
  tags: []
"Mk14,20":
  text: "Lecz On w odpowiedzi, rzekł im: Jeden z dwunastu, ten który ze mną zanurza rękę w misie."
  tags: []
"Mk14,21":
  text: "Wprawdzie Syn Człowieczy odchodzi, tak jak jest o Nim napisane; ale biada temu człowiekowi, przez którego Syn Człowieczy będzie wydany! Lepiej by mu było, gdyby ten człowiek nie został zrodzony."
  tags: []
"Mk14,22":
  text: "I gdy oni jedli, wziął Jezus chleb i pobłogosławił, połamał i dał im, i powiedział: Weźcie, zjedzcie, to jest moje ciało."
  tags: []
"Mk14,23":
  text: "I potem wziął kielich, podziękował i dał im; i wypili z niego wszyscy;"
  tags: []
"Mk14,24":
  text: "I powiedział im: To jest krew moja Nowego Przymierza, która jest za wielu wylewana."
  tags: []
"Mk14,25":
  text: "Zaprawdę mówię wam, że nie będę pił więcej z owocu winorośli, aż do tego dnia, gdy go będę pił nowy w Królestwie Bożym."
  tags: []
"Mk14,26":
  text: "A po zaśpiewaniu hymnu, wyszli ku Górze Oliwnej,"
  tags: []
"Mk14,27":
  text: "I Jezus im powiedział: Tej nocy, wszyscy z powodu mnie zostaniecie zgorszeni; bo jest napisane: Uderzę pasterza i owce zostaną rozproszone."
  tags: []
"Mk14,28":
  text: "Ale gdy zostanę wzbudzony, poprzedzę was do Galilei."
  tags: []
"Mk14,29":
  text: "A Piotr powiedział do Niego: Jeśli nawet wszyscy zostaną zgorszeni, jednak nie ja."
  tags: []
"Mk14,30":
  text: "A Jezus powiedział mu: Zaprawdę mówię ci, że dziś w nocy, zanim kogut dwukrotnie zapieje, trzykrotnie się mnie wyprzesz."
  tags: []
"Mk14,31":
  text: "Ale on tym bardziej mówił: Prędzej, jeśli trzeba, umrę razem z Tobą, z pewnością nie wyprę się Ciebie. A tak samo i wszyscy mówili."
  tags: []
"Mk14,32":
  text: "I przyszli na miejsce, które zwano Getsemane, i powiedział do swoich uczniów: Usiądźcie tutaj, dopóki będę się modlić."
  tags: []
"Mk14,33":
  text: "I wziął ze sobą Piotra i Jakuba, i Jana, i zaczął się trwożyć i głęboko troskać;"
  tags: []
"Mk14,34":
  text: "I powiedział im: Bardzo jest zasmucona moja dusza aż do śmierci; zostańcie tu i czuwajcie."
  tags: []
"Mk14,35":
  text: "I odszedł nieco dalej, padł na ziemię i modlił się, aby, jeśli jest to możliwe, ominęła Go ta godzina;"
  tags: []
"Mk14,36":
  text: "I mówił: Abba, Drogi Ojcze! Dla Ciebie wszystko jest możliwe, oddal ten kielich ode mnie, jednak nie, co ja chcę, ale co Ty."
  tags: []
"Mk14,37":
  text: "A gdy przyszedł i znalazł ich śpiących, powiedział Piotrowi: Szymonie, śpisz? Nie miałeś siły czuwać jednej godziny?"
  tags: []
"Mk14,38":
  text: "Czuwajcie i módlcie się, abyście nie weszli w pokusę; duch wprawdzie jest chętny, ale ciało słabe."
  tags: []
"Mk14,39":
  text: "I odszedł ponownie, modlił się, mówiąc te same słowa."
  tags: []
"Mk14,40":
  text: "A gdy wrócił, ponownie znalazł ich śpiących, bo oczy ich były ociężałe, i nie wiedzieli, co mu odpowiedzieć."
  tags: []
"Mk14,41":
  text: "I przyszedł trzeci raz, i powiedział im: Nadal śpicie i odpoczywacie! Dosyć! Przyszła godzina, oto Syn Człowieczy wydawany jest w ręce grzeszników."
  tags: []
"Mk14,42":
  text: "Wstańcie, pójdźmy! Oto ten, który mnie wydaje, zbliża się."
  tags: []
"Mk14,43":
  text: "I zaraz, gdy On jeszcze mówił, przyszedł Judasz, będący jednym z grona dwunastu, a z nim wielki tłum z mieczami i z kijami, od arcykapłanów, i od uczonych w Piśmie, i od starszych."
  tags: []
"Mk14,44":
  text: "A ten, który Go wydawał, dał im umówiony znak, mówiąc: Tego, którego pocałuję, to jest On; schwytajcie Go i odprowadźcie ostrożnie."
  tags: []
"Mk14,45":
  text: "A gdy przyszedł, zaraz przystąpił do Niego i powiedział: Rabbi, Rabbi! I Go pocałował."
  tags: []
"Mk14,46":
  text: "A oni podnieśli na Niego ręce i Go pojmali."
  tags: []
"Mk14,47":
  text: "A jeden z tych, którzy stali obok, dobył miecza, uderzył sługę arcykapłana i odciął mu ucho."
  tags: []
"Mk14,48":
  text: "A Jezus w odpowiedzi, rzekł im: Jak na zbójcę wyszliście z mieczami i z kijami, aby mnie pochwycić."
  tags: []
"Mk14,49":
  text: "Codziennie byłem u was w świątyni, nauczając, a nie pojmaliście mnie; lecz to się stało, aby zostały wypełnione Pisma."
  tags: []
"Mk14,50":
  text: "Wtedy wszyscy Go opuścili i uciekli."
  tags: []
"Mk14,51":
  text: "A pewien młodzieniec podążał za Nim, odziany w płótno na nagim ciele; i pochwycili go młodzieńcy."
  tags: []
"Mk14,52":
  text: "Ale on pozostawił płótno i nagi uciekł od nich."
  tags: []
"Mk14,53":
  text: "I odprowadzili Jezusa do arcykapłana; i zeszli się do niego wszyscy arcykapłani, i starsi, i uczeni w Piśmie."
  tags: []
"Mk14,54":
  text: "A Piotr szedł z dala za Nim aż do wewnątrz na dziedziniec arcykapłana, i siedział ze służbą, grzejąc się przy ogniu."
  tags: []
"Mk14,55":
  text: "A arcykapłani i cały Sanhedryn szukali świadectwa przeciwko Jezusowi, aby Go uśmiercić; lecz nie znajdowali."
  tags: []
"Mk14,56":
  text: "Wielu bowiem fałszywie świadczyło przeciwko Niemu; ale świadectwa ich nie były zgodne."
  tags: []
"Mk14,57":
  text: "A jacyś ludzie wstali i fałszywie świadczyli przeciwko Niemu, mówiąc:"
  tags: []
"Mk14,58":
  text: "My słyszeliśmy, jak mówił: Ja zburzę tę świątynię uczynioną ręką, i w trzy dni zbuduję inną, nie ręką uczynioną."
  tags: []
"Mk14,59":
  text: "Lecz nawet i w tym świadectwo ich nie było zgodne."
  tags: []
"Mk14,60":
  text: "I stanął arcykapłan na środku, i zapytał Jezusa, mówiąc: Nic nie odpowiadasz na to, co oni świadczą przeciwko Tobie?"
  tags: []
"Mk14,61":
  text: "A On milczał i nic nie odpowiedział. Ponownie zapytał Go arcykapłan i powiedział do Niego: Czy Ty jesteś Mesjasz, Syn Błogosławionego?"
  tags: []
"Mk14,62":
  text: "A Jezus powiedział: Ja jestem; i zobaczycie Syna Człowieczego, siedzącego po prawicy Mocy Boga, i przychodzącego z obłokami nieba."
  tags: []
"Mk14,63":
  text: "Wtedy arcykapłan rozdarł swoje szaty, mówiąc: Na co nam jeszcze potrzeba świadków?"
  tags: []
"Mk14,64":
  text: "Słyszeliście bluźnierstwo. Co jeszcze nie jest dla was oczywiste? I wszyscy oni Go osądzili, że winien jest śmierci."
  tags: []
"Mk14,65":
  text: "I zaczęli niektórzy na Niego pluć i zakrywać Jego oblicze, bić Go pięściami i mówić do Niego: Prorokuj! A słudzy zadawali Mu razy."
  tags: []
"Mk14,66":
  text: "A gdy Piotr był na dziedzińcu, na dole, przyszła jedna ze służących arcykapłana;"
  tags: []
"Mk14,67":
  text: "A gdy zobaczyła Piotra grzejącego się, przypatrzyła się mu i powiedziała: I ty byłeś z tym Nazareńczykiem Jezusem."
  tags: []
"Mk14,68":
  text: "Ale on wyparł się, mówiąc: Nie wiem, ani nie rozumiem, co mówisz. I wyszedł na zewnątrz do przysionka, i zapiał kogut."
  tags: []
"Mk14,69":
  text: "A służąca, widząc go ponownie, zaczęła mówić do tych, którzy stali obok: To jest jeden z nich."
  tags: []
"Mk14,70":
  text: "A on ponownie się wyparł. I po chwili ponownie ci, co stali obok, powiedzieli Piotrowi: Na pewno jesteś jednym z nich, bo i ty jesteś Galilejczykiem, i twoja mowa jest podobna."
  tags: []
"Mk14,71":
  text: "A on zaczął ślubować pod groźbą klątwy i przysięgać, mówiąc: Nie znam tego człowieka, o którym mówicie."
  tags: []
"Mk14,72":
  text: "I zaraz zapiał kogut, i przypomniały się Piotrowi słowa, które mu powiedział Jezus: Zanim kogut dwa razy zapieje, trzy razy się mnie wyprzesz. I rzuciwszy się, płakał."
  tags: []
