"Mk14,1": "A za dwa dni była Pascha i Święto Przaśników; i szukali arcykapłani i uczeni w Piśmie sposobu, jakby Go podstępnie pojmać i zabić."
"Mk14,2": "Lecz mówili: Nie w święto, aby czasem nie było rozruchów wśród ludu."
"Mk14,3": "A gdy On był w Betanii, w domu Szymona trędowatego, i spoczywał u stołu, przyszła kobieta, mająca flakonik alabastrowy czystego olejku nardowego, bardzo kosztownego, skruszyła ten flakonik alabastrowy i wylała zawartość na Jego głowę."
"Mk14,4": "A niektórzy oburzali się między sobą, mówiąc: Po co doszło do straty tego olejku?"
"Mk14,5": "Można bowiem było sprzedać to drożej niż za trzysta denarów i rozdać ubogim; i szorstko ją napominali."
"Mk14,6": "Ale Jezus powiedział: Dajcie jej spokój; dlaczego sprawiacie jej przykrość? Dobry uczynek spełniła wobec mnie."
"Mk14,7": "Ubogich bowiem zawsze macie pomiędzy sobą, i kiedykolwiek chcecie, możecie im dobrze czynić; ale mnie nie zawsze macie."
"Mk14,8": "Ona, co miała uczynić, to uczyniła – z wyprzedzeniem namaściła moje ciało na pogrzeb."
"Mk14,9": "Zaprawdę mówię wam: Gdziekolwiek na całym świecie będzie głoszona ta Ewangelia, to, co ona uczyniła, będzie opowiadane na jej pamiątkę."
"Mk14,10": "A Judasz Iskariota, jeden z dwunastu, odszedł do arcykapłanów, aby Go im wydać."
"Mk14,11": "A gdy to usłyszeli, uradowali się i obiecali dać mu srebro; szukał więc właściwego czasu, jakby Go wydać."
"Mk14,12": "A pierwszego dnia Święta Przaśników, gdy ofiarują Paschę, powiedzieli Mu Jego uczniowie: Gdzie chcesz, abyśmy poszli i przygotowali Ci Paschę, byś mógł ją spożyć?"
"Mk14,13": "I posłał dwóch ze swoich uczniów, i powiedział im: Odejdźcie do miasta, i spotka się z wami człowiek niosący dzban wody; idźcie za nim."
"Mk14,14": "A gdziekolwiek wszedłby, powiedzcie gospodarzowi: Nauczyciel mówi: Gdzie jest dla mnie pokój gościnny, abym mógł spożyć Paschę ze swoimi uczniami?"
"Mk14,15": "A on wskaże wam górny pokój, wielki, usłany i gotowy, tam przygotujcie ją dla nas."
"Mk14,16": "I wyszli uczniowie Jego, i przyszli do miasta, i znaleźli pokój tak, jak im powiedział, i przygotowali Paschę."
"Mk14,17": "I gdy nadszedł wieczór, przyszedł z dwunastoma."
"Mk14,18": "A gdy spoczywali przy stole i jedli, Jezus powiedział: Zaprawdę mówię wam, że jeden z was, ten który je ze mną, wyda mnie."
"Mk14,19": "A oni zaczęli się smucić i mówić do Niego jeden po drugim: Czy to nie ja? A inny: Chyba nie ja?"
"Mk14,20": "Lecz On w odpowiedzi, rzekł im: Jeden z dwunastu, ten który ze mną zanurza rękę w misie."
"Mk14,21": "Wprawdzie Syn Człowieczy odchodzi, tak jak jest o Nim napisane; ale biada temu człowiekowi, przez którego Syn Człowieczy będzie wydany! Lepiej by mu było, gdyby ten człowiek nie został zrodzony."
"Mk14,22": "I gdy oni jedli, wziął Jezus chleb i pobłogosławił, połamał i dał im, i powiedział: Weźcie, zjedzcie, to jest moje ciało."
"Mk14,23": "I potem wziął kielich, podziękował i dał im; i wypili z niego wszyscy;"
"Mk14,24": "I powiedział im: To jest krew moja Nowego Przymierza, która jest za wielu wylewana."
"Mk14,25": "Zaprawdę mówię wam, że nie będę pił więcej z owocu winorośli, aż do tego dnia, gdy go będę pił nowy w Królestwie Bożym."
"Mk14,26": "A po zaśpiewaniu hymnu, wyszli ku Górze Oliwnej,"
"Mk14,27": "I Jezus im powiedział: Tej nocy, wszyscy z powodu mnie zostaniecie zgorszeni; bo jest napisane: Uderzę pasterza i owce zostaną rozproszone."
"Mk14,28": "Ale gdy zostanę wzbudzony, poprzedzę was do Galilei."
"Mk14,29": "A Piotr powiedział do Niego: Jeśli nawet wszyscy zostaną zgorszeni, jednak nie ja."
"Mk14,30": "A Jezus powiedział mu: Zaprawdę mówię ci, że dziś w nocy, zanim kogut dwukrotnie zapieje, trzykrotnie się mnie wyprzesz."
"Mk14,31": "Ale on tym bardziej mówił: Prędzej, jeśli trzeba, umrę razem z Tobą, z pewnością nie wyprę się Ciebie. A tak samo i wszyscy mówili."
"Mk14,32": "I przyszli na miejsce, które zwano Getsemane, i powiedział do swoich uczniów: Usiądźcie tutaj, dopóki będę się modlić."
"Mk14,33": "I wziął ze sobą Piotra i Jakuba, i Jana, i zaczął się trwożyć i głęboko troskać;"
"Mk14,34": "I powiedział im: Bardzo jest zasmucona moja dusza aż do śmierci; zostańcie tu i czuwajcie."
"Mk14,35": "I odszedł nieco dalej, padł na ziemię i modlił się, aby, jeśli jest to możliwe, ominęła Go ta godzina;"
"Mk14,36": "I mówił: Abba, Drogi Ojcze! Dla Ciebie wszystko jest możliwe, oddal ten kielich ode mnie, jednak nie, co ja chcę, ale co Ty."
"Mk14,37": "A gdy przyszedł i znalazł ich śpiących, powiedział Piotrowi: Szymonie, śpisz? Nie miałeś siły czuwać jednej godziny?"
"Mk14,38": "Czuwajcie i módlcie się, abyście nie weszli w pokusę; duch wprawdzie jest chętny, ale ciało słabe."
"Mk14,39": "I odszedł ponownie, modlił się, mówiąc te same słowa."
"Mk14,40": "A gdy wrócił, ponownie znalazł ich śpiących, bo oczy ich były ociężałe, i nie wiedzieli, co mu odpowiedzieć."
"Mk14,41": "I przyszedł trzeci raz, i powiedział im: Nadal śpicie i odpoczywacie! Dosyć! Przyszła godzina, oto Syn Człowieczy wydawany jest w ręce grzeszników."
"Mk14,42": "Wstańcie, pójdźmy! Oto ten, który mnie wydaje, zbliża się."
"Mk14,43": "I zaraz, gdy On jeszcze mówił, przyszedł Judasz, będący jednym z grona dwunastu, a z nim wielki tłum z mieczami i z kijami, od arcykapłanów, i od uczonych w Piśmie, i od starszych."
"Mk14,44": "A ten, który Go wydawał, dał im umówiony znak, mówiąc: Tego, którego pocałuję, to jest On; schwytajcie Go i odprowadźcie ostrożnie."
"Mk14,45": "A gdy przyszedł, zaraz przystąpił do Niego i powiedział: Rabbi, Rabbi! I Go pocałował."
"Mk14,46": "A oni podnieśli na Niego ręce i Go pojmali."
"Mk14,47": "A jeden z tych, którzy stali obok, dobył miecza, uderzył sługę arcykapłana i odciął mu ucho."
"Mk14,48": "A Jezus w odpowiedzi, rzekł im: Jak na zbójcę wyszliście z mieczami i z kijami, aby mnie pochwycić."
"Mk14,49": "Codziennie byłem u was w świątyni, nauczając, a nie pojmaliście mnie; lecz to się stało, aby zostały wypełnione Pisma."
"Mk14,50": "Wtedy wszyscy Go opuścili i uciekli."
"Mk14,51": "A pewien młodzieniec podążał za Nim, odziany w płótno na nagim ciele; i pochwycili go młodzieńcy."
"Mk14,52": "Ale on pozostawił płótno i nagi uciekł od nich."
"Mk14,53": "I odprowadzili Jezusa do arcykapłana; i zeszli się do niego wszyscy arcykapłani, i starsi, i uczeni w Piśmie."
"Mk14,54": "A Piotr szedł z dala za Nim aż do wewnątrz na dziedziniec arcykapłana, i siedział ze służbą, grzejąc się przy ogniu."
"Mk14,55": "A arcykapłani i cały Sanhedryn szukali świadectwa przeciwko Jezusowi, aby Go uśmiercić; lecz nie znajdowali."
"Mk14,56": "Wielu bowiem fałszywie świadczyło przeciwko Niemu; ale świadectwa ich nie były zgodne."
"Mk14,57": "A jacyś ludzie wstali i fałszywie świadczyli przeciwko Niemu, mówiąc:"
"Mk14,58": "My słyszeliśmy, jak mówił: Ja zburzę tę świątynię uczynioną ręką, i w trzy dni zbuduję inną, nie ręką uczynioną."
"Mk14,59": "Lecz nawet i w tym świadectwo ich nie było zgodne."
"Mk14,60": "I stanął arcykapłan na środku, i zapytał Jezusa, mówiąc: Nic nie odpowiadasz na to, co oni świadczą przeciwko Tobie?"
"Mk14,61": "A On milczał i nic nie odpowiedział. Ponownie zapytał Go arcykapłan i powiedział do Niego: Czy Ty jesteś Mesjasz, Syn Błogosławionego?"
"Mk14,62": "A Jezus powiedział: Ja jestem; i zobaczycie Syna Człowieczego, siedzącego po prawicy Mocy Boga, i przychodzącego z obłokami nieba."
"Mk14,63": "Wtedy arcykapłan rozdarł swoje szaty, mówiąc: Na co nam jeszcze potrzeba świadków?"
"Mk14,64": "Słyszeliście bluźnierstwo. Co jeszcze nie jest dla was oczywiste? I wszyscy oni Go osądzili, że winien jest śmierci."
"Mk14,65": "I zaczęli niektórzy na Niego pluć i zakrywać Jego oblicze, bić Go pięściami i mówić do Niego: Prorokuj! A słudzy zadawali Mu razy."
"Mk14,66": "A gdy Piotr był na dziedzińcu, na dole, przyszła jedna ze służących arcykapłana;"
"Mk14,67": "A gdy zobaczyła Piotra grzejącego się, przypatrzyła się mu i powiedziała: I ty byłeś z tym Nazareńczykiem Jezusem."
"Mk14,68": "Ale on wyparł się, mówiąc: Nie wiem, ani nie rozumiem, co mówisz. I wyszedł na zewnątrz do przysionka, i zapiał kogut."
"Mk14,69": "A służąca, widząc go ponownie, zaczęła mówić do tych, którzy stali obok: To jest jeden z nich."
"Mk14,70": "A on ponownie się wyparł. I po chwili ponownie ci, co stali obok, powiedzieli Piotrowi: Na pewno jesteś jednym z nich, bo i ty jesteś Galilejczykiem, i twoja mowa jest podobna."
"Mk14,71": "A on zaczął ślubować pod groźbą klątwy i przysięgać, mówiąc: Nie znam tego człowieka, o którym mówicie."
"Mk14,72": "I zaraz zapiał kogut, i przypomniały się Piotrowi słowa, które mu powiedział Jezus: Zanim kogut dwa razy zapieje, trzy razy się mnie wyprzesz. I rzuciwszy się, płakał."
