"Mk8,1": "A w tych dniach, gdy tłum był wielki i nie mieli co jeść, przywołał Jezus swoich uczniów i powiedział im:"
"Mk8,2": "Lituję się nad tym tłumem; bo już trzy dni pozostają przy mnie, a nie mają co jeść."
"Mk8,3": "I jeśli ich rozpuszczę głodnych do domu, zasłabną w drodze; niektórzy bowiem z nich przyszli z daleka."
"Mk8,4": "I odpowiedzieli Mu Jego uczniowie: W jaki sposób ktoś tutaj, na pustkowiu będzie mógł ich nasycić chlebem?"
"Mk8,5": "I spytał ich: Ile macie chlebów? A oni powiedzieli: Siedem."
"Mk8,6": "I kazał ludowi spocząć na ziemi; i wziął siedem chlebów, i podziękował, łamał i dawał swoim uczniom, aby kładli przed nimi; i położyli je przed tłumem."
"Mk8,7": "Mieli też kilka rybek. Błogosławił i kazał je podawać."
"Mk8,8": "I zjedli, i zostali nasyceni, i zebrali siedem koszów kawałków, które pozostały."
"Mk8,9": "A było tych, którzy jedli, około czterech tysięcy; i rozpuścił ich."
"Mk8,10": "I zaraz wstąpił do łodzi ze swoimi uczniami, i przybył w strony Dalmanuty."
"Mk8,11": "I wyszli faryzeusze, i zaczęli z Nim rozprawiać, poddając Go próbie i żądając od Niego znaku z nieba."
"Mk8,12": "A On westchnął w swoim duchu i powiedział: Dlaczego to pokolenie szuka znaku? Zaprawdę mówię wam: Nie zostanie dany znak temu pokoleniu."
"Mk8,13": "I opuścił ich, wstąpił ponownie do łodzi i przeprawił się na drugą stronę."
"Mk8,14": "A uczniowie zapomnieli wziąć ze sobą chleba i mieli ze sobą w łodzi tylko jeden chleb."
"Mk8,15": "I nakazał im, mówiąc: Patrzcie, a przyglądajcie się uważnie na zakwas faryzeuszów i zakwas Heroda."
"Mk8,16": "Wtedy rozprawiali między sobą o tym, że nie mają chleba."
"Mk8,17": "Gdy Jezus to dostrzegł, powiedział im: Dlaczego rozważacie, że nie macie chleba? Jeszcze nie pojmujecie i nie rozumiecie? Wasze serce jeszcze jest zatwardzone?"
"Mk8,18": "Mając oczy, nie widzicie; i mając uszy, nie słuchacie; i nie pamiętacie?"
"Mk8,19": "Ile wówczas zebraliście pełnych koszy kawałków, gdy połamałem pięć chlebów dla pięciu tysięcy ludzi? Powiedzieli do Niego: Dwanaście."
"Mk8,20": "A ile zebraliście pełnych koszy kawałków, gdy połamałem siedem chlebów dla czterech tysięcy ludzi? A oni powiedzieli: Siedem."
"Mk8,21": "I powiedział im: Jak to nadal nie rozumiecie?"
"Mk8,22": "I przyszedł do Betsaidy; i przyprowadzili do Niego ślepego, prosząc, aby go dotknął."
"Mk8,23": "I ujął ślepego za rękę, wyprowadził go poza wieś i plunął w jego oczy, nałożył na niego ręce i pytał go, czy coś widzi."
"Mk8,24": "A on spojrzał w górę i powiedział: Widzę ludzi, są jak drzewa. Chodzą!"
"Mk8,25": "Potem ponownie nałożył ręce na jego oczy i uczynił, że znów widział i wrócił do zdrowia; i wszystko widział wyraźnie."
"Mk8,26": "I odesłał go do jego domu, mówiąc: Nie wchodź ani do tego miasteczka, ani o tym nie mów nikomu z miasteczka."
"Mk8,27": "I wyszedł Jezus ze swoimi uczniami do miasteczek w pobliżu Cezarei Filipowej, i pytał w drodze swoich uczniów, mówiąc im: Co mówią o mnie ludzie? Kim jestem?"
"Mk8,28": "A oni odpowiedzieli Mu: Jedni, że Janem Chrzcicielem, inni, że Eliaszem, a inni, że jednym z proroków."
"Mk8,29": "A On powiedział do nich: A wy mówicie, że kim jestem? A w odpowiedzi, Piotr rzekł Mu: Ty jesteś Mesjasz."
"Mk8,30": "I surowo napominał ich, aby o Nim nikomu nie mówili."
"Mk8,31": "I zaczął ich nauczać, że Syn Człowieczy musi wiele wycierpieć, i być odrzucony przez starszych ludu i przez arcykapłanów, i przez uczonych w Piśmie; i być zabity, a po trzech dniach zmartwychwstać."
"Mk8,32": "I mówił to otwarcie, a Piotr wziął Go na stronę i zaczął Go surowo napominać."
"Mk8,33": "A On odwrócił się, spojrzał na swoich uczniów i skarcił Piotra, mówiąc: Zejdź mi z drogi, przeciwniku! Albowiem nie myślisz o tym, co Boże, ale o tym, co ludzkie."
"Mk8,34": "I przywołał tłum i swoich uczniów, i powiedział im: Kto chce iść za mną, niech się wyprze samego siebie i weźmie swój krzyż, i niech idzie za mną."
"Mk8,35": "Albowiem kto chce uratować swoją duszę, straci ją; a kto straci swoją duszę ze względu na mnie i Ewangelię, ten ją uratuje."
"Mk8,36": "Bo cóż pomoże człowiekowi, choćby cały świat pozyskał, a dusza jego doznałaby straty?"
"Mk8,37": "Albo co człowiek da w zamian za swoją duszę?"
"Mk8,38": "Bo ktokolwiek wstydzi się mnie i moich słów pośród tego cudzołożnego i grzesznego pokolenia, tego i Syn Człowieczy będzie się wstydzić, gdy przyjdzie w chwale swojego Ojca z aniołami świętymi."
