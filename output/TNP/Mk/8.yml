"Mk8,1":
  text: "A w tych dniach, gdy tłum był wielki i nie mieli co jeść, przywołał Jezus swoich uczniów i powiedział im:"
  tags: []
"Mk8,2":
  text: "Lituję się nad tym tłumem; bo już trzy dni pozostają przy mnie, a nie mają co jeść."
  tags: []
"Mk8,3":
  text: "I jeśli ich rozpuszczę głodnych do domu, zasłabną w drodze; niektórzy bowiem z nich przyszli z daleka."
  tags: []
"Mk8,4":
  text: "I odpowiedzieli Mu Jego uczniowie: W jaki sposób ktoś tutaj, na pustkowiu będzie mógł ich nasycić chlebem?"
  tags: []
"Mk8,5":
  text: "I spytał ich: Ile macie chlebów? A oni powiedzieli: Siedem."
  tags: []
"Mk8,6":
  text: "I kazał ludowi spocząć na ziemi; i wziął siedem chlebów, i podziękował, łamał i dawał swoim uczniom, aby kładli przed nimi; i położyli je przed tłumem."
  tags: []
"Mk8,7":
  text: "Mieli też kilka rybek. Błogosławił i kazał je podawać."
  tags: []
"Mk8,8":
  text: "I zjedli, i zostali nasyceni, i zebrali siedem koszów kawałków, które pozostały."
  tags: []
"Mk8,9":
  text: "A było tych, którzy jedli, około czterech tysięcy; i rozpuścił ich."
  tags: []
"Mk8,10":
  text: "I zaraz wstąpił do łodzi ze swoimi uczniami, i przybył w strony Dalmanuty."
  tags: []
"Mk8,11":
  text: "I wyszli faryzeusze, i zaczęli z Nim rozprawiać, poddając Go próbie i żądając od Niego znaku z nieba."
  tags: []
"Mk8,12":
  text: "A On westchnął w swoim duchu i powiedział: Dlaczego to pokolenie szuka znaku? Zaprawdę mówię wam: Nie zostanie dany znak temu pokoleniu."
  tags: []
"Mk8,13":
  text: "I opuścił ich, wstąpił ponownie do łodzi i przeprawił się na drugą stronę."
  tags: []
"Mk8,14":
  text: "A uczniowie zapomnieli wziąć ze sobą chleba i mieli ze sobą w łodzi tylko jeden chleb."
  tags: []
"Mk8,15":
  text: "I nakazał im, mówiąc: Patrzcie, a przyglądajcie się uważnie na zakwas faryzeuszów i zakwas Heroda."
  tags: []
"Mk8,16":
  text: "Wtedy rozprawiali między sobą o tym, że nie mają chleba."
  tags: []
"Mk8,17":
  text: "Gdy Jezus to dostrzegł, powiedział im: Dlaczego rozważacie, że nie macie chleba? Jeszcze nie pojmujecie i nie rozumiecie? Wasze serce jeszcze jest zatwardzone?"
  tags: []
"Mk8,18":
  text: "Mając oczy, nie widzicie; i mając uszy, nie słuchacie; i nie pamiętacie?"
  tags: []
"Mk8,19":
  text: "Ile wówczas zebraliście pełnych koszy kawałków, gdy połamałem pięć chlebów dla pięciu tysięcy ludzi? Powiedzieli do Niego: Dwanaście."
  tags: []
"Mk8,20":
  text: "A ile zebraliście pełnych koszy kawałków, gdy połamałem siedem chlebów dla czterech tysięcy ludzi? A oni powiedzieli: Siedem."
  tags: []
"Mk8,21":
  text: "I powiedział im: Jak to nadal nie rozumiecie?"
  tags: []
"Mk8,22":
  text: "I przyszedł do Betsaidy; i przyprowadzili do Niego ślepego, prosząc, aby go dotknął."
  tags: []
"Mk8,23":
  text: "I ujął ślepego za rękę, wyprowadził go poza wieś i plunął w jego oczy, nałożył na niego ręce i pytał go, czy coś widzi."
  tags: []
"Mk8,24":
  text: "A on spojrzał w górę i powiedział: Widzę ludzi, są jak drzewa. Chodzą!"
  tags: []
"Mk8,25":
  text: "Potem ponownie nałożył ręce na jego oczy i uczynił, że znów widział i wrócił do zdrowia; i wszystko widział wyraźnie."
  tags: []
"Mk8,26":
  text: "I odesłał go do jego domu, mówiąc: Nie wchodź ani do tego miasteczka, ani o tym nie mów nikomu z miasteczka."
  tags: []
"Mk8,27":
  text: "I wyszedł Jezus ze swoimi uczniami do miasteczek w pobliżu Cezarei Filipowej, i pytał w drodze swoich uczniów, mówiąc im: Co mówią o mnie ludzie? Kim jestem?"
  tags: []
"Mk8,28":
  text: "A oni odpowiedzieli Mu: Jedni, że Janem Chrzcicielem, inni, że Eliaszem, a inni, że jednym z proroków."
  tags: []
"Mk8,29":
  text: "A On powiedział do nich: A wy mówicie, że kim jestem? A w odpowiedzi, Piotr rzekł Mu: Ty jesteś Mesjasz."
  tags: []
"Mk8,30":
  text: "I surowo napominał ich, aby o Nim nikomu nie mówili."
  tags: []
"Mk8,31":
  text: "I zaczął ich nauczać, że Syn Człowieczy musi wiele wycierpieć, i być odrzucony przez starszych ludu i przez arcykapłanów, i przez uczonych w Piśmie; i być zabity, a po trzech dniach zmartwychwstać."
  tags: []
"Mk8,32":
  text: "I mówił to otwarcie, a Piotr wziął Go na stronę i zaczął Go surowo napominać."
  tags: []
"Mk8,33":
  text: "A On odwrócił się, spojrzał na swoich uczniów i skarcił Piotra, mówiąc: Zejdź mi z drogi, przeciwniku! Albowiem nie myślisz o tym, co Boże, ale o tym, co ludzkie."
  tags: []
"Mk8,34":
  text: "I przywołał tłum i swoich uczniów, i powiedział im: Kto chce iść za mną, niech się wyprze samego siebie i weźmie swój krzyż, i niech idzie za mną."
  tags: []
"Mk8,35":
  text: "Albowiem kto chce uratować swoją duszę, straci ją; a kto straci swoją duszę ze względu na mnie i Ewangelię, ten ją uratuje."
  tags: []
"Mk8,36":
  text: "Bo cóż pomoże człowiekowi, choćby cały świat pozyskał, a dusza jego doznałaby straty?"
  tags: []
"Mk8,37":
  text: "Albo co człowiek da w zamian za swoją duszę?"
  tags: []
"Mk8,38":
  text: "Bo ktokolwiek wstydzi się mnie i moich słów pośród tego cudzołożnego i grzesznego pokolenia, tego i Syn Człowieczy będzie się wstydzić, gdy przyjdzie w chwale swojego Ojca z aniołami świętymi."
  tags: []
