"Mk6,1":
  text: "I wyszedł stamtąd. I przyszedł w swoje ojczyste strony; a szli za Nim Jego uczniowie."
  tags: []
"Mk6,2":
  text: "A gdy nadszedł szabat, zaczął nauczać w synagodze; a wielu słuchając tego, zdumiewało się, mówiąc: Skąd On to ma? I co to za mądrość, która została Mu dana, że się takie dzieła mocy dzieją przez Jego ręce?"
  tags: []
"Mk6,3":
  text: "Czy to nie jest ów cieśla, syn Marii, brat Jakuba i Józefa, i Judy, i Szymona? I czy siostry Jego, nie są tu, przy nas? I gorszyli się z Jego powodu."
  tags: []
"Mk6,4":
  text: "A Jezus powiedział do nich: Nigdzie prorok nie jest pozbawiony czci, tylko w swojej ojczyźnie i wśród swoich krewnych, i w swoim domu."
  tags: []
"Mk6,5":
  text: "I nie mógł tam uczynić żadnego dzieła mocy; tylko na kilku chorych nałożył ręce i uzdrowił ich."
  tags: []
"Mk6,6":
  text: "I dziwił się z powodu ich niewiary; i obchodził okoliczne miasteczka nauczając."
  tags: []
"Mk6,7":
  text: "I przywołał do siebie dwunastu, zaczął ich rozsyłać: dwójkę po dwójce i dał im władzę nad duchami nieczystymi."
  tags: []
"Mk6,8":
  text: "I nakazał im, aby nic nie brali na drogę, tylko laskę; ani torby, ani chleba, ani pieniędzy w trzosie;"
  tags: []
"Mk6,9":
  text: "Lecz by podwiązali sandały i nie wdziewali dwóch tunik."
  tags: []
"Mk6,10":
  text: "I mówił do nich: Do jakiegokolwiek domu wejdziecie, tam mieszkajcie, aż stamtąd wyjdziecie."
  tags: []
"Mk6,11":
  text: "A ktokolwiek nie przyjąłby was, ani was nie wysłuchał, wyjdźcie stamtąd, strząśnijcie pył spod waszych stóp na świadectwo przeciwko nim. Zaprawdę mówię wam: Lżej będzie w dzień sądu Sodomie i Gomorze, niż temu miastu."
  tags: []
"Mk6,12":
  text: "A oni wyszli, głosząc, by ludzie się upamiętali."
  tags: []
"Mk6,13":
  text: "I wyrzucali wiele demonów, i wielu chorych namaszczali oliwą, i ich uzdrawiali."
  tags: []
"Mk6,14":
  text: "I usłyszał o Nim król Herod, albowiem Jego imię stało się znane wszystkim, i powiedział: Jan Chrzciciel został wzbudzony z martwych i dlatego dzieła mocy działają w Nim."
  tags: []
"Mk6,15":
  text: "Inni mówili, że to jest Eliasz; jeszcze inni natomiast mówili, że to jest prorok lub jak jeden z proroków."
  tags: []
"Mk6,16":
  text: "Herod słysząc to, powiedział: To jest Jan, któremu ja ściąłem głowę. To on został wzbudzony z martwych."
  tags: []
"Mk6,17":
  text: "Albowiem sam Herod posłał i pojmał Jana, i związał go w więzieniu z powodu Herodiady, żony Filipa, swojego brata, gdyż ją poślubił."
  tags: []
"Mk6,18":
  text: "Bo Jan mówił Herodowi: Nie wolno ci mieć żony swojego brata."
  tags: []
"Mk6,19":
  text: "A Herodiada odczuwała do niego niechęć i chciała go zabić, ale nie mogła;"
  tags: []
"Mk6,20":
  text: "Herod bowiem obawiał się Jana, wiedząc, że był to mąż sprawiedliwy i święty; i ochraniał go, a gdy go wysłuchał, wiele z tego czynił, a chętnie go też słuchał."
  tags: []
"Mk6,21":
  text: "I przyszedł odpowiedni dzień, kiedy Herod w swoje urodziny wyprawiał wieczerzę dla swoich dostojników i dla trybunów wojskowych, i dla przedniejszych osób z Galilei,"
  tags: []
"Mk6,22":
  text: "A gdy weszła córka Herodiady i tańczyła, podobała się Herodowi i współspoczywającym przy stole; wtedy powiedział król dziewczynce: Proś mnie, o co chcesz, a dam ci."
  tags: []
"Mk6,23":
  text: "I przysiągł jej: O cokolwiek byś mnie prosiła, dam ci, aż do połowy mojego królestwa."
  tags: []
"Mk6,24":
  text: "A ona wyszła i powiedziała swojej matce: O co mam poprosić? Ta natomiast powiedziała: O głowę Jana Chrzciciela."
  tags: []
"Mk6,25":
  text: "A ona zaraz pośpiesznie wyszła do króla, i poprosiła, mówiąc: Chcę, abyś mi natychmiast dał na tacy głowę Jana Chrzciciela."
  tags: []
"Mk6,26":
  text: "I król zasmucił się; ale ze względu na przysięgę i ze względu na współspoczywających przy stole, nie chciał jej odmówić."
  tags: []
"Mk6,27":
  text: "I król zaraz posłał żołnierza straży przybocznej, i rozkazał przynieść jego głowę."
  tags: []
"Mk6,28":
  text: "A gdy on poszedł, ściął go w więzieniu i przyniósł jego głowę na tacy, i dał ją dziewczynce, a dziewczynka dała ją swojej matce."
  tags: []
"Mk6,29":
  text: "Gdy o tym usłyszeli jego uczniowie, przyszli i wzięli jego zwłoki, i położyli je w grobowcu."
  tags: []
"Mk6,30":
  text: "A apostołowie, gdy przyszli do Jezusa, opowiedzieli Mu wszystko, co uczynili i czego nauczali."
  tags: []
"Mk6,31":
  text: "I powiedział im: Idźcie tylko wy sami na osobność, na ustronne miejsce i trochę odpocznijcie; bo wielu było tych, którzy przychodzili i odchodzili, tak że nie mieli nawet sposobności by zjeść."
  tags: []
"Mk6,32":
  text: "I oddalili się łodzią na ustronne miejsce na osobność."
  tags: []
"Mk6,33":
  text: "A tłumy ujrzały ich, że odpłynęli, i wielu poznało Go, i zbiegli się tam pieszo ze wszystkich miast, i wyprzedzili ich, zgromadzając się przy Nim."
  tags: []
"Mk6,34":
  text: "A gdy Jezus wyszedł, ujrzał wielki tłum i zlitował się nad nimi, albowiem byli jak owce nie mające pasterza; i zaczął ich nauczać wielu rzeczy."
  tags: []
"Mk6,35":
  text: "I gdy już nastała późna godzina, zbliżyli się do Niego Jego uczniowie i powiedzieli: To miejsce jest odludne i godzina już późna."
  tags: []
"Mk6,36":
  text: "Rozpuść ich, aby poszli do okolicznych wsi i miasteczek i kupili sobie chleba, bo nie mają nic, co mogliby zjeść."
  tags: []
"Mk6,37":
  text: "A On w odpowiedzi, rzekł do nich: Wy dajcie im jeść. I powiedzieli do Niego: Czy mamy pójść i kupić chlebów za dwieście denarów, i dać im jeść?"
  tags: []
"Mk6,38":
  text: "A On powiedział im: Ile macie chlebów? Idźcie i zobaczcie. A oni dowiedzieli się i powiedzieli: Pięć i dwie ryby."
  tags: []
"Mk6,39":
  text: "I kazał im posadzić wszystkich, grupa za grupą, na zielonej trawie."
  tags: []
"Mk6,40":
  text: "I usiedli, gromada za gromadą, po stu i po pięćdziesięciu."
  tags: []
"Mk6,41":
  text: "A wziął te pięć chlebów i dwie ryby, spojrzał w niebo, błogosławił; i łamał chleby, i dawał swoim uczniom, aby kładli przed nich; i owe dwie ryby rozdzielił między wszystkich."
  tags: []
"Mk6,42":
  text: "I zjedli wszyscy, i zostali nasyceni."
  tags: []
"Mk6,43":
  text: "I zebrali pełnych dwanaście koszy kawałków chleba, a także z ryb."
  tags: []
"Mk6,44":
  text: "A tych, którzy jedli chleby, było około pięciu tysięcy mężów."
  tags: []
"Mk6,45":
  text: "I zaraz przymusił swoich uczniów, aby weszli do łodzi i wyprzedzili Go kierując się na drugą stronę do Betsaidy, aż On rozpuści tłum."
  tags: []
"Mk6,46":
  text: "A gdy się pożegnał z nimi, odszedł na górę, aby się modlić."
  tags: []
"Mk6,47":
  text: "A gdy nastał wieczór, łódź była na środku morza, a On sam na lądzie,"
  tags: []
"Mk6,48":
  text: "I widział, że zmęczyli się, wiosłując, bo mieli przeciwny wiatr; i około czwartej straży nocnej przyszedł do nich, idąc po morzu, a chciał przejść obok nich."
  tags: []
"Mk6,49":
  text: "Ale oni, gdy Go ujrzeli idącego po morzu, mniemali, że to zjawa, i krzyknęli,"
  tags: []
"Mk6,50":
  text: "Gdyż wszyscy Go widzieli i zaniepokoili się. Lecz On zaraz przemówił do nich i powiedział im: Odwagi, ja jestem, nie bójcie się!"
  tags: []
"Mk6,51":
  text: "I wszedł do nich do łodzi, i ustał wiatr; a oni byli wewnątrz siebie niezwykle zdumieni i zdziwieni."
  tags: []
"Mk6,52":
  text: "Bo nie pojęli cudu z chlebami, gdyż serce ich było skamieniałe."
  tags: []
"Mk6,53":
  text: "A gdy przeprawili się, przypłynęli do ziemi Genezaret i przycumowali do brzegu."
  tags: []
"Mk6,54":
  text: "A gdy wyszli z łodzi, zaraz Go rozpoznano,"
  tags: []
"Mk6,55":
  text: "I obiegli całą okoliczną krainę, zaczęli znosić na posłaniach tych, którzy się mieli źle, tam gdzie usłyszeli, że jest."
  tags: []
"Mk6,56":
  text: "I gdziekolwiek wchodził do wiosek lub do miast, czy na polach, czy na rynkach, kładli chorych i prosili Go, aby mogli dotknąć choćby frędzla Jego szaty; a ci, którzy Go dotknęli, byli uzdrawiani."
  tags: []
