"Mk6,1": "I wyszedł stamtąd. I przyszedł w swoje ojczyste strony; a szli za Nim Jego uczniowie."
"Mk6,2": "A gdy nadszedł szabat, zaczął nauczać w synagodze; a wielu słuchając tego, zdumiewało się, mówiąc: Skąd On to ma? I co to za mądrość, która została Mu dana, że się takie dzieła mocy dzieją przez Jego ręce?"
"Mk6,3": "Czy to nie jest ów cieśla, syn Marii, brat Jakuba i Józefa, i Judy, i Szymona? I czy siostry Jego, nie są tu, przy nas? I gorszyli się z Jego powodu."
"Mk6,4": "A Jezus powiedział do nich: Nigdzie prorok nie jest pozbawiony czci, tylko w swojej ojczyźnie i wśród swoich krewnych, i w swoim domu."
"Mk6,5": "I nie mógł tam uczynić żadnego dzieła mocy; tylko na kilku chorych nałożył ręce i uzdrowił ich."
"Mk6,6": "I dziwił się z powodu ich niewiary; i obchodził okoliczne miasteczka nauczając."
"Mk6,7": "I przywołał do siebie dwunastu, zaczął ich rozsyłać: dwójkę po dwójce i dał im władzę nad duchami nieczystymi."
"Mk6,8": "I nakazał im, aby nic nie brali na drogę, tylko laskę; ani torby, ani chleba, ani pieniędzy w trzosie;"
"Mk6,9": "Lecz by podwiązali sandały i nie wdziewali dwóch tunik."
"Mk6,10": "I mówił do nich: Do jakiegokolwiek domu wejdziecie, tam mieszkajcie, aż stamtąd wyjdziecie."
"Mk6,11": "A ktokolwiek nie przyjąłby was, ani was nie wysłuchał, wyjdźcie stamtąd, strząśnijcie pył spod waszych stóp na świadectwo przeciwko nim. Zaprawdę mówię wam: Lżej będzie w dzień sądu Sodomie i Gomorze, niż temu miastu."
"Mk6,12": "A oni wyszli, głosząc, by ludzie się upamiętali."
"Mk6,13": "I wyrzucali wiele demonów, i wielu chorych namaszczali oliwą, i ich uzdrawiali."
"Mk6,14": "I usłyszał o Nim król Herod, albowiem Jego imię stało się znane wszystkim, i powiedział: Jan Chrzciciel został wzbudzony z martwych i dlatego dzieła mocy działają w Nim."
"Mk6,15": "Inni mówili, że to jest Eliasz; jeszcze inni natomiast mówili, że to jest prorok lub jak jeden z proroków."
"Mk6,16": "Herod słysząc to, powiedział: To jest Jan, któremu ja ściąłem głowę. To on został wzbudzony z martwych."
"Mk6,17": "Albowiem sam Herod posłał i pojmał Jana, i związał go w więzieniu z powodu Herodiady, żony Filipa, swojego brata, gdyż ją poślubił."
"Mk6,18": "Bo Jan mówił Herodowi: Nie wolno ci mieć żony swojego brata."
"Mk6,19": "A Herodiada odczuwała do niego niechęć i chciała go zabić, ale nie mogła;"
"Mk6,20": "Herod bowiem obawiał się Jana, wiedząc, że był to mąż sprawiedliwy i święty; i ochraniał go, a gdy go wysłuchał, wiele z tego czynił, a chętnie go też słuchał."
"Mk6,21": "I przyszedł odpowiedni dzień, kiedy Herod w swoje urodziny wyprawiał wieczerzę dla swoich dostojników i dla trybunów wojskowych, i dla przedniejszych osób z Galilei,"
"Mk6,22": "A gdy weszła córka Herodiady i tańczyła, podobała się Herodowi i współspoczywającym przy stole; wtedy powiedział król dziewczynce: Proś mnie, o co chcesz, a dam ci."
"Mk6,23": "I przysiągł jej: O cokolwiek byś mnie prosiła, dam ci, aż do połowy mojego królestwa."
"Mk6,24": "A ona wyszła i powiedziała swojej matce: O co mam poprosić? Ta natomiast powiedziała: O głowę Jana Chrzciciela."
"Mk6,25": "A ona zaraz pośpiesznie wyszła do króla, i poprosiła, mówiąc: Chcę, abyś mi natychmiast dał na tacy głowę Jana Chrzciciela."
"Mk6,26": "I król zasmucił się; ale ze względu na przysięgę i ze względu na współspoczywających przy stole, nie chciał jej odmówić."
"Mk6,27": "I król zaraz posłał żołnierza straży przybocznej, i rozkazał przynieść jego głowę."
"Mk6,28": "A gdy on poszedł, ściął go w więzieniu i przyniósł jego głowę na tacy, i dał ją dziewczynce, a dziewczynka dała ją swojej matce."
"Mk6,29": "Gdy o tym usłyszeli jego uczniowie, przyszli i wzięli jego zwłoki, i położyli je w grobowcu."
"Mk6,30": "A apostołowie, gdy przyszli do Jezusa, opowiedzieli Mu wszystko, co uczynili i czego nauczali."
"Mk6,31": "I powiedział im: Idźcie tylko wy sami na osobność, na ustronne miejsce i trochę odpocznijcie; bo wielu było tych, którzy przychodzili i odchodzili, tak że nie mieli nawet sposobności by zjeść."
"Mk6,32": "I oddalili się łodzią na ustronne miejsce na osobność."
"Mk6,33": "A tłumy ujrzały ich, że odpłynęli, i wielu poznało Go, i zbiegli się tam pieszo ze wszystkich miast, i wyprzedzili ich, zgromadzając się przy Nim."
"Mk6,34": "A gdy Jezus wyszedł, ujrzał wielki tłum i zlitował się nad nimi, albowiem byli jak owce nie mające pasterza; i zaczął ich nauczać wielu rzeczy."
"Mk6,35": "I gdy już nastała późna godzina, zbliżyli się do Niego Jego uczniowie i powiedzieli: To miejsce jest odludne i godzina już późna."
"Mk6,36": "Rozpuść ich, aby poszli do okolicznych wsi i miasteczek i kupili sobie chleba, bo nie mają nic, co mogliby zjeść."
"Mk6,37": "A On w odpowiedzi, rzekł do nich: Wy dajcie im jeść. I powiedzieli do Niego: Czy mamy pójść i kupić chlebów za dwieście denarów, i dać im jeść?"
"Mk6,38": "A On powiedział im: Ile macie chlebów? Idźcie i zobaczcie. A oni dowiedzieli się i powiedzieli: Pięć i dwie ryby."
"Mk6,39": "I kazał im posadzić wszystkich, grupa za grupą, na zielonej trawie."
"Mk6,40": "I usiedli, gromada za gromadą, po stu i po pięćdziesięciu."
"Mk6,41": "A wziął te pięć chlebów i dwie ryby, spojrzał w niebo, błogosławił; i łamał chleby, i dawał swoim uczniom, aby kładli przed nich; i owe dwie ryby rozdzielił między wszystkich."
"Mk6,42": "I zjedli wszyscy, i zostali nasyceni."
"Mk6,43": "I zebrali pełnych dwanaście koszy kawałków chleba, a także z ryb."
"Mk6,44": "A tych, którzy jedli chleby, było około pięciu tysięcy mężów."
"Mk6,45": "I zaraz przymusił swoich uczniów, aby weszli do łodzi i wyprzedzili Go kierując się na drugą stronę do Betsaidy, aż On rozpuści tłum."
"Mk6,46": "A gdy się pożegnał z nimi, odszedł na górę, aby się modlić."
"Mk6,47": "A gdy nastał wieczór, łódź była na środku morza, a On sam na lądzie,"
"Mk6,48": "I widział, że zmęczyli się, wiosłując, bo mieli przeciwny wiatr; i około czwartej straży nocnej przyszedł do nich, idąc po morzu, a chciał przejść obok nich."
"Mk6,49": "Ale oni, gdy Go ujrzeli idącego po morzu, mniemali, że to zjawa, i krzyknęli,"
"Mk6,50": "Gdyż wszyscy Go widzieli i zaniepokoili się. Lecz On zaraz przemówił do nich i powiedział im: Odwagi, ja jestem, nie bójcie się!"
"Mk6,51": "I wszedł do nich do łodzi, i ustał wiatr; a oni byli wewnątrz siebie niezwykle zdumieni i zdziwieni."
"Mk6,52": "Bo nie pojęli cudu z chlebami, gdyż serce ich było skamieniałe."
"Mk6,53": "A gdy przeprawili się, przypłynęli do ziemi Genezaret i przycumowali do brzegu."
"Mk6,54": "A gdy wyszli z łodzi, zaraz Go rozpoznano,"
"Mk6,55": "I obiegli całą okoliczną krainę, zaczęli znosić na posłaniach tych, którzy się mieli źle, tam gdzie usłyszeli, że jest."
"Mk6,56": "I gdziekolwiek wchodził do wiosek lub do miast, czy na polach, czy na rynkach, kładli chorych i prosili Go, aby mogli dotknąć choćby frędzla Jego szaty; a ci, którzy Go dotknęli, byli uzdrawiani."
