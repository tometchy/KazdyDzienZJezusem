"Mk5,1":
  text: "I przeprawili się na drugą stronę morza do krainy Gadareńczyków."
  tags: []
"Mk5,2":
  text: "I gdy wyszedł z łodzi, zaraz wybiegł Mu naprzeciw z grobowców człowiek, mający ducha nieczystego,"
  tags: []
"Mk5,3":
  text: "Który mieszkał w grobowcach; i nikt nie mógł związać go nawet łańcuchami,"
  tags: []
"Mk5,4":
  text: "Gdyż będąc wielokrotnie zakuty w dyby i związany łańcuchami, zrywał te łańcuchy i kruszył dyby; i nikt nie miał siły go ujarzmić."
  tags: []
"Mk5,5":
  text: "I całymi dniami i nocami był w górach i w grobowcach, krzycząc i raniąc siebie kamieniami."
  tags: []
"Mk5,6":
  text: "A gdy ujrzał z daleka Jezusa, przybiegł i oddał Mu pokłon,"
  tags: []
"Mk5,7":
  text: "I krzyknął potężnym głosem, mówiąc: Dlaczego mnie tak traktujesz, Jezusie, Synu Boga Najwyższego? Zaprzysięgam Cię na Boga, abyś mnie nie dręczył!"
  tags: []
"Mk5,8":
  text: "Albowiem mówił mu: Wyjdź, duchu nieczysty, z tego człowieka!"
  tags: []
"Mk5,9":
  text: "I zapytał go: Jakie jest twoje imię? A on w odpowiedzi, rzekł: Na imię mi Legion, gdyż jest nas wielu."
  tags: []
"Mk5,10":
  text: "I bardzo Go prosił, aby ich nie odsyłał z tej krainy."
  tags: []
"Mk5,11":
  text: "A była tam u podnóża góry wielka trzoda wypasanych świń,"
  tags: []
"Mk5,12":
  text: "I prosiły Go wszystkie te demony, mówiąc: Poślij nas w te świnie, abyśmy w nie weszli."
  tags: []
"Mk5,13":
  text: "I Jezus zaraz im pozwolił. I wyszły duchy nieczyste, i weszły w świnie; i ruszyła trzoda w dół urwiska w morze, a było ich około dwóch tysięcy; i potonęły w morzu."
  tags: []
"Mk5,14":
  text: "A ci, którzy paśli świnie, uciekli i oznajmili to w mieście i we wsiach; i ludzie wyszli, aby ujrzeć to, co się stało."
  tags: []
"Mk5,15":
  text: "I przyszli do Jezusa, i ujrzeli opętanego, tego, który miał legion demonów, że siedzi i jest ubrany, i przy zdrowych zmysłach; i zlękli się."
  tags: []
"Mk5,16":
  text: "A ci, którzy to widzieli, opowiedzieli im, co się stało z opętanym przez demony, i o świniach."
  tags: []
"Mk5,17":
  text: "I zaczęli Go prosić, aby odszedł z ich granic."
  tags: []
"Mk5,18":
  text: "A gdy wstąpił do łodzi, prosił Go ten, który był opętany przez demony, aby mógł z Nim być."
  tags: []
"Mk5,19":
  text: "Lecz Jezus nie pozwolił mu, ale powiedział do niego: Idź do swojego domu, do swoich, i oznajmij im, jak wiele PAN dla ciebie uczynił i jak zmiłował się nad tobą."
  tags: []
"Mk5,20":
  text: "I odszedł, i zaczął rozgłaszać w Dziesięciogrodziu, jak wiele uczynił mu Jezus; i dziwili się wszyscy."
  tags: []
"Mk5,21":
  text: "A gdy Jezus przeprawił się ponownie w łodzi na drugą stronę, zebrał się wokół Niego wielki tłum; a On był nad morzem."
  tags: []
"Mk5,22":
  text: "I oto przyszedł jeden z przełożonych synagogi o imieniu Jair, i gdy Go ujrzał, przypadł do Jego stóp,"
  tags: []
"Mk5,23":
  text: "I prosił Go bardzo, mówiąc: Córeczka moja umiera; pójdź, włóż na nią ręce, aby została ocalona i ożyła."
  tags: []
"Mk5,24":
  text: "I poszedł z nim; i podążał za Nim wielki tłum, i napierali na Niego."
  tags: []
"Mk5,25":
  text: "A pewna kobieta, która od dwunastu lat miała upływ krwi,"
  tags: []
"Mk5,26":
  text: "I wiele wycierpiała od licznych lekarzy, i wydała wszystko co miała, i nic jej nie pomogło, lecz stan jej raczej się pogorszył."
  tags: []
"Mk5,27":
  text: "Ta słysząc o Jezusie, podeszła z tyłu w tłumie i dotknęła Jego szaty,"
  tags: []
"Mk5,28":
  text: "Mówiła bowiem: Jeśli tylko dotknę się Jego szaty, zostanę uzdrowiona."
  tags: []
"Mk5,29":
  text: "I zaraz zaschło źródło upływu jej krwi, i poczuła w ciele, że jest uzdrowiona ze swojej choroby."
  tags: []
"Mk5,30":
  text: "A Jezus zaraz odczuł w sobie, że wyszła z Niego moc, obrócił się do tłumu i powiedział: Kto dotknął moich szat?"
  tags: []
"Mk5,31":
  text: "I powiedzieli do Niego Jego uczniowie: Widzisz ten tłum cisnący się na Ciebie i mówisz: Kto mnie dotknął?"
  tags: []
"Mk5,32":
  text: "I spojrzał wokoło, aby ujrzeć tę, która to uczyniła."
  tags: []
"Mk5,33":
  text: "Ale kobieta z bojaźnią i z drżeniem, wiedząc, co się z nią stało, przyszła i upadła przed Nim, i powiedziała Mu całą prawdę."
  tags: []
"Mk5,34":
  text: "A On jej powiedział: Córko! Wiara twoja uzdrowiła cię, idź w pokoju i bądź uzdrowiona ze swojej choroby."
  tags: []
"Mk5,35":
  text: "Gdy On jeszcze to mówił, przyszli słudzy przełożonego synagogi, mówiąc: Córka twoja umarła, czemu jeszcze trudzisz nauczyciela?"
  tags: []
"Mk5,36":
  text: "Ale Jezus, skoro usłyszał to, co oni mówili, powiedział do przełożonego synagogi: Nie bój się, tylko wierz!"
  tags: []
"Mk5,37":
  text: "I nie pozwolił nikomu iść ze sobą, tylko Piotrowi, Jakubowi i Janowi, bratu Jakuba."
  tags: []
"Mk5,38":
  text: "I przyszedł do domu przełożonego synagogi, i ujrzał tam zamęt, i wielu płaczących i głośno zawodzących."
  tags: []
"Mk5,39":
  text: "A gdy wszedł, powiedział im: Czemu czynicie zgiełk i płaczecie? Dziecko nie umarło, ale śpi."
  tags: []
"Mk5,40":
  text: "I wyśmiewali się z Niego. A On usunął wszystkich, wziął z sobą ojca i matkę dziecka i tych, którzy z Nim byli, i wszedł tam, gdzie było leżące dziecko."
  tags: []
"Mk5,41":
  text: "I ujął rękę dziewczynki, mówiąc do niej: Talita kumi! Co się tłumaczy: Dziewczynko, mówię ci, wstań!"
  tags: []
"Mk5,42":
  text: "I zaraz dziewczynka powstała i chodziła, miała bowiem dwanaście lat. I zdumieli się w wielkim zachwycie."
  tags: []
"Mk5,43":
  text: "I przykazał im z naciskiem, aby się o tym nikt nie dowiedział; powiedział też, aby dano jej jeść."
  tags: []
