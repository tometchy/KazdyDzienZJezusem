"Mk5,1": "I przeprawili się na drugą stronę morza do krainy Gadareńczyków."
"Mk5,2": "I gdy wyszedł z łodzi, zaraz wybiegł Mu naprzeciw z grobowców człowiek, mający ducha nieczystego,"
"Mk5,3": "Który mieszkał w grobowcach; i nikt nie mógł związać go nawet łańcuchami,"
"Mk5,4": "Gdyż będąc wielokrotnie zakuty w dyby i związany łańcuchami, zrywał te łańcuchy i kruszył dyby; i nikt nie miał siły go ujarzmić."
"Mk5,5": "I całymi dniami i nocami był w górach i w grobowcach, krzycząc i raniąc siebie kamieniami."
"Mk5,6": "A gdy ujrzał z daleka Jezusa, przybiegł i oddał Mu pokłon,"
"Mk5,7": "I krzyknął potężnym głosem, mówiąc: Dlaczego mnie tak traktujesz, Jezusie, Synu Boga Najwyższego? Zaprzysięgam Cię na Boga, abyś mnie nie dręczył!"
"Mk5,8": "Albowiem mówił mu: Wyjdź, duchu nieczysty, z tego człowieka!"
"Mk5,9": "I zapytał go: Jakie jest twoje imię? A on w odpowiedzi, rzekł: Na imię mi Legion, gdyż jest nas wielu."
"Mk5,10": "I bardzo Go prosił, aby ich nie odsyłał z tej krainy."
"Mk5,11": "A była tam u podnóża góry wielka trzoda wypasanych świń,"
"Mk5,12": "I prosiły Go wszystkie te demony, mówiąc: Poślij nas w te świnie, abyśmy w nie weszli."
"Mk5,13": "I Jezus zaraz im pozwolił. I wyszły duchy nieczyste, i weszły w świnie; i ruszyła trzoda w dół urwiska w morze, a było ich około dwóch tysięcy; i potonęły w morzu."
"Mk5,14": "A ci, którzy paśli świnie, uciekli i oznajmili to w mieście i we wsiach; i ludzie wyszli, aby ujrzeć to, co się stało."
"Mk5,15": "I przyszli do Jezusa, i ujrzeli opętanego, tego, który miał legion demonów, że siedzi i jest ubrany, i przy zdrowych zmysłach; i zlękli się."
"Mk5,16": "A ci, którzy to widzieli, opowiedzieli im, co się stało z opętanym przez demony, i o świniach."
"Mk5,17": "I zaczęli Go prosić, aby odszedł z ich granic."
"Mk5,18": "A gdy wstąpił do łodzi, prosił Go ten, który był opętany przez demony, aby mógł z Nim być."
"Mk5,19": "Lecz Jezus nie pozwolił mu, ale powiedział do niego: Idź do swojego domu, do swoich, i oznajmij im, jak wiele PAN dla ciebie uczynił i jak zmiłował się nad tobą."
"Mk5,20": "I odszedł, i zaczął rozgłaszać w Dziesięciogrodziu, jak wiele uczynił mu Jezus; i dziwili się wszyscy."
"Mk5,21": "A gdy Jezus przeprawił się ponownie w łodzi na drugą stronę, zebrał się wokół Niego wielki tłum; a On był nad morzem."
"Mk5,22": "I oto przyszedł jeden z przełożonych synagogi o imieniu Jair, i gdy Go ujrzał, przypadł do Jego stóp,"
"Mk5,23": "I prosił Go bardzo, mówiąc: Córeczka moja umiera; pójdź, włóż na nią ręce, aby została ocalona i ożyła."
"Mk5,24": "I poszedł z nim; i podążał za Nim wielki tłum, i napierali na Niego."
"Mk5,25": "A pewna kobieta, która od dwunastu lat miała upływ krwi,"
"Mk5,26": "I wiele wycierpiała od licznych lekarzy, i wydała wszystko co miała, i nic jej nie pomogło, lecz stan jej raczej się pogorszył."
"Mk5,27": "Ta słysząc o Jezusie, podeszła z tyłu w tłumie i dotknęła Jego szaty,"
"Mk5,28": "Mówiła bowiem: Jeśli tylko dotknę się Jego szaty, zostanę uzdrowiona."
"Mk5,29": "I zaraz zaschło źródło upływu jej krwi, i poczuła w ciele, że jest uzdrowiona ze swojej choroby."
"Mk5,30": "A Jezus zaraz odczuł w sobie, że wyszła z Niego moc, obrócił się do tłumu i powiedział: Kto dotknął moich szat?"
"Mk5,31": "I powiedzieli do Niego Jego uczniowie: Widzisz ten tłum cisnący się na Ciebie i mówisz: Kto mnie dotknął?"
"Mk5,32": "I spojrzał wokoło, aby ujrzeć tę, która to uczyniła."
"Mk5,33": "Ale kobieta z bojaźnią i z drżeniem, wiedząc, co się z nią stało, przyszła i upadła przed Nim, i powiedziała Mu całą prawdę."
"Mk5,34": "A On jej powiedział: Córko! Wiara twoja uzdrowiła cię, idź w pokoju i bądź uzdrowiona ze swojej choroby."
"Mk5,35": "Gdy On jeszcze to mówił, przyszli słudzy przełożonego synagogi, mówiąc: Córka twoja umarła, czemu jeszcze trudzisz nauczyciela?"
"Mk5,36": "Ale Jezus, skoro usłyszał to, co oni mówili, powiedział do przełożonego synagogi: Nie bój się, tylko wierz!"
"Mk5,37": "I nie pozwolił nikomu iść ze sobą, tylko Piotrowi, Jakubowi i Janowi, bratu Jakuba."
"Mk5,38": "I przyszedł do domu przełożonego synagogi, i ujrzał tam zamęt, i wielu płaczących i głośno zawodzących."
"Mk5,39": "A gdy wszedł, powiedział im: Czemu czynicie zgiełk i płaczecie? Dziecko nie umarło, ale śpi."
"Mk5,40": "I wyśmiewali się z Niego. A On usunął wszystkich, wziął z sobą ojca i matkę dziecka i tych, którzy z Nim byli, i wszedł tam, gdzie było leżące dziecko."
"Mk5,41": "I ujął rękę dziewczynki, mówiąc do niej: Talita kumi! Co się tłumaczy: Dziewczynko, mówię ci, wstań!"
"Mk5,42": "I zaraz dziewczynka powstała i chodziła, miała bowiem dwanaście lat. I zdumieli się w wielkim zachwycie."
"Mk5,43": "I przykazał im z naciskiem, aby się o tym nikt nie dowiedział; powiedział też, aby dano jej jeść."
