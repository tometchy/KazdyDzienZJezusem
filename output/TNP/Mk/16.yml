"Mk16,1": "A gdy minął szabat, Maria Magdalena i Maria, matka Jakuba, i Salome kupiły wonności, żeby pójść i Go namaścić."
"Mk16,2": "A bardzo wcześnie pierwszego dnia tygodnia przyszły do grobu, gdy już wzeszło słońce."
"Mk16,3": "I mówiły do siebie: Kto nam odtoczy kamień z wejścia do grobowca?"
"Mk16,4": "A gdy podniosły wzrok, zobaczyły, że kamień jest odtoczony; był bowiem bardzo wielki."
"Mk16,5": "A gdy weszły do grobowca, ujrzały młodzieńca, siedzącego po prawej stronie, ubranego w długą, białą szatę; i zlękły się."
"Mk16,6": "A on powiedział im: Nie lękajcie się; szukacie Jezusa Nazarejczyka, ukrzyżowanego; powstał z martwych, nie ma Go tu; oto miejsce, gdzie Go położyli."
"Mk16,7": "Ale odejdźcie i powiedzcie Jego uczniom, i Piotrowi, że was wyprzedza do Galilei; tam Go zobaczycie, jak wam powiedział."
"Mk16,8": "I wyszły, szybko uciekły z grobowca, bowiem ogarnęło je drżenie i uniesienie; a nikomu nic nie mówiły, bo się bały."
"Mk16,9": "A Jezus, gdy powstał z martwych, rano pierwszego dnia tygodnia, ukazał się najpierw Marii Magdalenie, z której wyrzucił siedem demonów."
"Mk16,10": "Ona poszła i oznajmiła to tym, którzy byli z Nim, smutnym i płaczącym."
"Mk16,11": "A oni słysząc, że żyje, i że był przez nią widziany, nie uwierzyli."
"Mk16,12": "Potem dwom z nich ukazał się w innej postaci, gdy szli do wsi."
"Mk16,13": "I oni powrócili, i opowiedzieli pozostałym; ale i tym nie uwierzyli."
"Mk16,14": "W końcu ukazał się jedenastu, gdy spoczywali przy stole, i zganił ich niedowiarstwo i zatwardziałość ich serca, że nie uwierzyli tym, którzy widzieli Go wskrzeszonego."
"Mk16,15": "I powiedział im: Idźcie na cały świat, ogłoście Ewangelię całemu stworzeniu."
"Mk16,16": "Ten kto uwierzy i zostanie ochrzczony, będzie zbawiony; ale kto nie uwierzy, będzie potępiony."
"Mk16,17": "A takie znaki będą towarzyszyć tym, którzy uwierzyli: w moim imieniu będą wyrzucać demony, będą mówić nowymi językami,"
"Mk16,18": "Będą podnosić węże, a choćby wypili coś trującego, nie zaszkodzi im; na chorych będą nakładali ręce, a ci będą mieli się dobrze."
"Mk16,19": "Po tym więc, jak Pan, im powiedział, został wzięty do nieba i usiadł po prawicy Boga."
"Mk16,20": "A gdy oni odeszli, ogłosili wszędzie; współdziałając z Panem, potwierdzając Słowo przez towarzyszące im znaki. Amen."
