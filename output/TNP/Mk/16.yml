"Mk16,1":
  text: "A gdy minął szabat, Maria Magdalena i Maria, matka Jakuba, i Salome kupiły wonności, żeby pójść i Go namaścić."
  tags: []
"Mk16,2":
  text: "A bardzo wcześnie pierwszego dnia tygodnia przyszły do grobu, gdy już wzeszło słońce."
  tags: []
"Mk16,3":
  text: "I mówiły do siebie: Kto nam odtoczy kamień z wejścia do grobowca?"
  tags: []
"Mk16,4":
  text: "A gdy podniosły wzrok, zobaczyły, że kamień jest odtoczony; był bowiem bardzo wielki."
  tags: []
"Mk16,5":
  text: "A gdy weszły do grobowca, ujrzały młodzieńca, siedzącego po prawej stronie, ubranego w długą, białą szatę; i zlękły się."
  tags: []
"Mk16,6":
  text: "A on powiedział im: Nie lękajcie się; szukacie Jezusa Nazarejczyka, ukrzyżowanego; powstał z martwych, nie ma Go tu; oto miejsce, gdzie Go położyli."
  tags: []
"Mk16,7":
  text: "Ale odejdźcie i powiedzcie Jego uczniom, i Piotrowi, że was wyprzedza do Galilei; tam Go zobaczycie, jak wam powiedział."
  tags: []
"Mk16,8":
  text: "I wyszły, szybko uciekły z grobowca, bowiem ogarnęło je drżenie i uniesienie; a nikomu nic nie mówiły, bo się bały."
  tags: []
"Mk16,9":
  text: "A Jezus, gdy powstał z martwych, rano pierwszego dnia tygodnia, ukazał się najpierw Marii Magdalenie, z której wyrzucił siedem demonów."
  tags: []
"Mk16,10":
  text: "Ona poszła i oznajmiła to tym, którzy byli z Nim, smutnym i płaczącym."
  tags: []
"Mk16,11":
  text: "A oni słysząc, że żyje, i że był przez nią widziany, nie uwierzyli."
  tags: []
"Mk16,12":
  text: "Potem dwom z nich ukazał się w innej postaci, gdy szli do wsi."
  tags: []
"Mk16,13":
  text: "I oni powrócili, i opowiedzieli pozostałym; ale i tym nie uwierzyli."
  tags: []
"Mk16,14":
  text: "W końcu ukazał się jedenastu, gdy spoczywali przy stole, i zganił ich niedowiarstwo i zatwardziałość ich serca, że nie uwierzyli tym, którzy widzieli Go wskrzeszonego."
  tags: []
"Mk16,15":
  text: "I powiedział im: Idźcie na cały świat, ogłoście Ewangelię całemu stworzeniu."
  tags: []
"Mk16,16":
  text: "Ten kto uwierzy i zostanie ochrzczony, będzie zbawiony; ale kto nie uwierzy, będzie potępiony."
  tags: []
"Mk16,17":
  text: "A takie znaki będą towarzyszyć tym, którzy uwierzyli: w moim imieniu będą wyrzucać demony, będą mówić nowymi językami,"
  tags: []
"Mk16,18":
  text: "Będą podnosić węże, a choćby wypili coś trującego, nie zaszkodzi im; na chorych będą nakładali ręce, a ci będą mieli się dobrze."
  tags: []
"Mk16,19":
  text: "Po tym więc, jak Pan, im powiedział, został wzięty do nieba i usiadł po prawicy Boga."
  tags: []
"Mk16,20":
  text: "A gdy oni odeszli, ogłosili wszędzie; współdziałając z Panem, potwierdzając Słowo przez towarzyszące im znaki. Amen."
  tags: []
