"Mk15,1":
  text: "A zaraz o poranku, arcykapłani ze starszymi i uczonymi w Piśmie, i cały Sanhedryn, odbyli naradę, po czym związali Jezusa i odprowadzili Go, i wydali Piłatowi."
  tags: []
"Mk15,2":
  text: "I Piłat pytał Go: Ty jesteś Królem Żydów? A On w odpowiedzi, rzekł do niego: Ty to mówisz."
  tags: []
"Mk15,3":
  text: "I oskarżali Go arcykapłani o wiele rzeczy. On natomiast nic nie odpowiedział."
  tags: []
"Mk15,4":
  text: "A Piłat ponownie pytał Go, mówiąc: Nic nie odpowiadasz? Spójrz o jak wiele Cię oskarżają."
  tags: []
"Mk15,5":
  text: "A Jezus już nic nie odpowiedział, tak że dziwił się Piłat."
  tags: []
"Mk15,6":
  text: "A na święto zwykle wypuszczał im jednego więźnia, którego żądali."
  tags: []
"Mk15,7":
  text: "I był pewien, nazywany Barabasz, uwięziony wraz z buntownikami, którzy podczas rozruchów popełnili morderstwo."
  tags: []
"Mk15,8":
  text: "A tłum krzycząc, zaczął domagać się, aby uczynił im, to co zawsze."
  tags: []
"Mk15,9":
  text: "Piłat więc odpowiedział im, mówiąc: Chcecie, abym wam wypuścił Króla Żydów?"
  tags: []
"Mk15,10":
  text: "Wiedział bowiem, że Go arcykapłani wydali z zawiści."
  tags: []
"Mk15,11":
  text: "Ale arcykapłani podburzyli lud, aby im wypuścił raczej Barabasza."
  tags: []
"Mk15,12":
  text: "A Piłat w odpowiedzi, rzekł im ponownie: Co więc chcecie, abym uczynił z tym, o którym mówicie – Król Żydów?"
  tags: []
"Mk15,13":
  text: "A oni ponownie zawołali: Ukrzyżuj Go!"
  tags: []
"Mk15,14":
  text: "A Piłat powiedział do nich: Co więc złego uczynił? Lecz oni tym głośniej krzyczeli: Ukrzyżuj Go!"
  tags: []
"Mk15,15":
  text: "A Piłat, chcąc ludowi uczynić zadość, wypuścił im Barabasza, a Jezusa ubiczował i wydał, aby został ukrzyżowany."
  tags: []
"Mk15,16":
  text: "Żołnierze więc wprowadzili Go na wewnętrzny dziedziniec, to jest do pretorium, i zwołali całą kohortę wojska."
  tags: []
"Mk15,17":
  text: "I oblekli Go w purpurę, upletli wieniec z ciernia, i nałożyli Mu,"
  tags: []
"Mk15,18":
  text: "Zaczęli Go pozdrawiać, mówiąc: Witaj Królu Żydów!"
  tags: []
"Mk15,19":
  text: "I bili Go w głowę trzciną, i pluli na Niego, a upadając na kolana, oddawali Mu pokłon."
  tags: []
"Mk15,20":
  text: "A gdy przestali z Niego szydzić, zdjęli z Niego purpurę i oblekli Go w Jego własne szaty, i wyprowadzili Go, aby Go ukrzyżować."
  tags: []
"Mk15,21":
  text: "I zmusili przechodzącego tam niejakiego Szymona Cyrenejczyka, idącego z pola, ojca Aleksandra i Rufa, aby niósł Jego krzyż."
  tags: []
"Mk15,22":
  text: "I przyprowadzili Go na miejsce zwane Golgota, co się tłumaczy: Miejsce Czaszki."
  tags: []
"Mk15,23":
  text: "I dawali Mu pić wino z mirrą, ale nie przyjął."
  tags: []
"Mk15,24":
  text: "A gdy Go ukrzyżowali, rozdzielili między siebie Jego szaty, rzucając o nie los, co kto ma zabrać."
  tags: []
"Mk15,25":
  text: "A gdy Go ukrzyżowali, była trzecia godzina."
  tags: []
"Mk15,26":
  text: "Był też wyryty napis z podaniem przyczyny Jego ukarania: Król Żydów."
  tags: []
"Mk15,27":
  text: "Ukrzyżowali też z Nim dwóch bandytów: jednego po prawej, a jednego po lewej Jego stronie."
  tags: []
"Mk15,28":
  text: "Tak zostało wypełnione Pismo, które mówi: I do przestępców został zaliczony."
  tags: []
"Mk15,29":
  text: "A ci, którzy przechodzili obok, bluźnili przeciwko Niemu, kiwając głowami swoimi i mówiąc: Oho! Ty, który rozwalasz świątynię i w trzy dni ją budujesz,"
  tags: []
"Mk15,30":
  text: "Ratuj siebie samego i zstąp z krzyża!"
  tags: []
"Mk15,31":
  text: "Podobnie też i arcykapłani z uczonymi w Piśmie, szydząc, mówili jedni do drugich: Ratował innych, a nie może uratować samego siebie,"
  tags: []
"Mk15,32":
  text: "Mesjasz, Król Izraela niech teraz zstąpi z krzyża, abyśmy ujrzeli i uwierzyli. I ci, co z Nim byli ukrzyżowani, również Go lżyli."
  tags: []
"Mk15,33":
  text: "A gdy była szósta godzina, stała się ciemność na całej ziemi, aż do dziewiątej godziny."
  tags: []
"Mk15,34":
  text: "A o godzinie dziewiątej zawołał Jezus potężnym głosem, mówiąc: Eloi, Eloi, lamma sabachtani?! Co tłumaczy się: Boże mój, Boże mój, dlaczego mnie opuściłeś?!"
  tags: []
"Mk15,35":
  text: "A niektórzy z tych, co stali tam obok, słysząc to, mówili: Oto woła Eliasza."
  tags: []
"Mk15,36":
  text: "I ktoś podbiegł, napełnił gąbkę winnym octem i włożył ją na trzcinę, poił Go, mówiąc: Pozwólcie, zobaczmy, czy przyjdzie Eliasz, żeby Go zdjąć."
  tags: []
"Mk15,37":
  text: "Ale Jezus zawołał potężnym głosem i oddał ducha."
  tags: []
"Mk15,38":
  text: "I wtedy została rozdarta zasłona świątyni na dwoje, od góry aż do dołu."
  tags: []
"Mk15,39":
  text: "A setnik, który stał naprzeciwko Niego, widząc, że w ten sposób wołając oddał ducha, powiedział: Prawdziwie ten człowiek był Synem Boga."
  tags: []
"Mk15,40":
  text: "Były tam też i kobiety przypatrujące się z daleka, a wśród nich była Maria Magdalena i Maria, matka Jakuba Mniejszego i Jozesa, i Salome,"
  tags: []
"Mk15,41":
  text: "Które, gdy był w Galilei, chodziły za Nim i usługiwały Mu, i wiele innych, które razem z Nim wstąpiły do Jerozolimy."
  tags: []
"Mk15,42":
  text: "A gdy był już wieczór, ponieważ był Dzień Przygotowania, który jest przed szabatem,"
  tags: []
"Mk15,43":
  text: "Przyszedł Józef z Arymatei, szanowany członek Rady, który też sam oczekiwał Królestwa Bożego, odważnie wszedł do Piłata i prosił o ciało Jezusa."
  tags: []
"Mk15,44":
  text: "A Piłat zdziwił się, że już umarł; i zawołał setnika, pytając go, czy dawno umarł."
  tags: []
"Mk15,45":
  text: "A gdy dowiedział się o tym od setnika, darował ciało Józefowi."
  tags: []
"Mk15,46":
  text: "A on kupił płótno, i zdjął Go, owinął płótnem, i złożył Go w grobowcu, który był wykuty w skale, i zatoczył kamień na otwór wejściowy grobowca."
  tags: []
"Mk15,47":
  text: "A Maria Magdalena i Maria, matka Jozesa, przyglądały się, gdzie Go złożono."
  tags: []
