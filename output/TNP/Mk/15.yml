"Mk15,1": "A zaraz o poranku, arcykapłani ze starszymi i uczonymi w Piśmie, i cały Sanhedryn, odbyli naradę, po czym związali Jezusa i odprowadzili Go, i wydali Piłatowi."
"Mk15,2": "I Piłat pytał Go: Ty jesteś Królem Żydów? A On w odpowiedzi, rzekł do niego: Ty to mówisz."
"Mk15,3": "I oskarżali Go arcykapłani o wiele rzeczy. On natomiast nic nie odpowiedział."
"Mk15,4": "A Piłat ponownie pytał Go, mówiąc: Nic nie odpowiadasz? Spójrz o jak wiele Cię oskarżają."
"Mk15,5": "A Jezus już nic nie odpowiedział, tak że dziwił się Piłat."
"Mk15,6": "A na święto zwykle wypuszczał im jednego więźnia, którego żądali."
"Mk15,7": "I był pewien, nazywany Barabasz, uwięziony wraz z buntownikami, którzy podczas rozruchów popełnili morderstwo."
"Mk15,8": "A tłum krzycząc, zaczął domagać się, aby uczynił im, to co zawsze."
"Mk15,9": "Piłat więc odpowiedział im, mówiąc: Chcecie, abym wam wypuścił Króla Żydów?"
"Mk15,10": "Wiedział bowiem, że Go arcykapłani wydali z zawiści."
"Mk15,11": "Ale arcykapłani podburzyli lud, aby im wypuścił raczej Barabasza."
"Mk15,12": "A Piłat w odpowiedzi, rzekł im ponownie: Co więc chcecie, abym uczynił z tym, o którym mówicie – Król Żydów?"
"Mk15,13": "A oni ponownie zawołali: Ukrzyżuj Go!"
"Mk15,14": "A Piłat powiedział do nich: Co więc złego uczynił? Lecz oni tym głośniej krzyczeli: Ukrzyżuj Go!"
"Mk15,15": "A Piłat, chcąc ludowi uczynić zadość, wypuścił im Barabasza, a Jezusa ubiczował i wydał, aby został ukrzyżowany."
"Mk15,16": "Żołnierze więc wprowadzili Go na wewnętrzny dziedziniec, to jest do pretorium, i zwołali całą kohortę wojska."
"Mk15,17": "I oblekli Go w purpurę, upletli wieniec z ciernia, i nałożyli Mu,"
"Mk15,18": "Zaczęli Go pozdrawiać, mówiąc: Witaj Królu Żydów!"
"Mk15,19": "I bili Go w głowę trzciną, i pluli na Niego, a upadając na kolana, oddawali Mu pokłon."
"Mk15,20": "A gdy przestali z Niego szydzić, zdjęli z Niego purpurę i oblekli Go w Jego własne szaty, i wyprowadzili Go, aby Go ukrzyżować."
"Mk15,21": "I zmusili przechodzącego tam niejakiego Szymona Cyrenejczyka, idącego z pola, ojca Aleksandra i Rufa, aby niósł Jego krzyż."
"Mk15,22": "I przyprowadzili Go na miejsce zwane Golgota, co się tłumaczy: Miejsce Czaszki."
"Mk15,23": "I dawali Mu pić wino z mirrą, ale nie przyjął."
"Mk15,24": "A gdy Go ukrzyżowali, rozdzielili między siebie Jego szaty, rzucając o nie los, co kto ma zabrać."
"Mk15,25": "A gdy Go ukrzyżowali, była trzecia godzina."
"Mk15,26": "Był też wyryty napis z podaniem przyczyny Jego ukarania: Król Żydów."
"Mk15,27": "Ukrzyżowali też z Nim dwóch bandytów: jednego po prawej, a jednego po lewej Jego stronie."
"Mk15,28": "Tak zostało wypełnione Pismo, które mówi: I do przestępców został zaliczony."
"Mk15,29": "A ci, którzy przechodzili obok, bluźnili przeciwko Niemu, kiwając głowami swoimi i mówiąc: Oho! Ty, który rozwalasz świątynię i w trzy dni ją budujesz,"
"Mk15,30": "Ratuj siebie samego i zstąp z krzyża!"
"Mk15,31": "Podobnie też i arcykapłani z uczonymi w Piśmie, szydząc, mówili jedni do drugich: Ratował innych, a nie może uratować samego siebie,"
"Mk15,32": "Mesjasz, Król Izraela niech teraz zstąpi z krzyża, abyśmy ujrzeli i uwierzyli. I ci, co z Nim byli ukrzyżowani, również Go lżyli."
"Mk15,33": "A gdy była szósta godzina, stała się ciemność na całej ziemi, aż do dziewiątej godziny."
"Mk15,34": "A o godzinie dziewiątej zawołał Jezus potężnym głosem, mówiąc: Eloi, Eloi, lamma sabachtani?! Co tłumaczy się: Boże mój, Boże mój, dlaczego mnie opuściłeś?!"
"Mk15,35": "A niektórzy z tych, co stali tam obok, słysząc to, mówili: Oto woła Eliasza."
"Mk15,36": "I ktoś podbiegł, napełnił gąbkę winnym octem i włożył ją na trzcinę, poił Go, mówiąc: Pozwólcie, zobaczmy, czy przyjdzie Eliasz, żeby Go zdjąć."
"Mk15,37": "Ale Jezus zawołał potężnym głosem i oddał ducha."
"Mk15,38": "I wtedy została rozdarta zasłona świątyni na dwoje, od góry aż do dołu."
"Mk15,39": "A setnik, który stał naprzeciwko Niego, widząc, że w ten sposób wołając oddał ducha, powiedział: Prawdziwie ten człowiek był Synem Boga."
"Mk15,40": "Były tam też i kobiety przypatrujące się z daleka, a wśród nich była Maria Magdalena i Maria, matka Jakuba Mniejszego i Jozesa, i Salome,"
"Mk15,41": "Które, gdy był w Galilei, chodziły za Nim i usługiwały Mu, i wiele innych, które razem z Nim wstąpiły do Jerozolimy."
"Mk15,42": "A gdy był już wieczór, ponieważ był Dzień Przygotowania, który jest przed szabatem,"
"Mk15,43": "Przyszedł Józef z Arymatei, szanowany członek Rady, który też sam oczekiwał Królestwa Bożego, odważnie wszedł do Piłata i prosił o ciało Jezusa."
"Mk15,44": "A Piłat zdziwił się, że już umarł; i zawołał setnika, pytając go, czy dawno umarł."
"Mk15,45": "A gdy dowiedział się o tym od setnika, darował ciało Józefowi."
"Mk15,46": "A on kupił płótno, i zdjął Go, owinął płótnem, i złożył Go w grobowcu, który był wykuty w skale, i zatoczył kamień na otwór wejściowy grobowca."
"Mk15,47": "A Maria Magdalena i Maria, matka Jozesa, przyglądały się, gdzie Go złożono."
