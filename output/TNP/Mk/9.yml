"Mk9,1":
  text: "I powiedział im: Zaprawdę mówię wam: Niektórzy z tych, co tu stoją, nie zakosztują śmierci, aż ujrzą Królestwo Boże przychodzące w mocy."
  tags: []
"Mk9,2":
  text: "A po sześciu dniach wziął Jezus ze sobą Piotra i Jakuba, i Jana, i wprowadził ich samych na wysoką górę na osobność, i został przemieniony wobec nich."
  tags: []
"Mk9,3":
  text: "A Jego szaty stały się lśniące, bardzo białe jak śnieg, tak jak żaden folusznik na ziemi nie może wybielić."
  tags: []
"Mk9,4":
  text: "I ukazał się im Eliasz z Mojżeszem, rozmawiający z Jezusem."
  tags: []
"Mk9,5":
  text: "I Piotr odezwał się, i powiedział Jezusowi: Rabbi! Dobrze nam tu być; zróbmy więc trzy namioty: jeden dla Ciebie, i jeden dla Mojżesza, i jeden dla Eliasza."
  tags: []
"Mk9,6":
  text: "Nie wiedział bowiem, co ma powiedzieć; bo byli bardzo przestraszeni."
  tags: []
"Mk9,7":
  text: "I powstał obłok, który ich zacienił; a z obłoku rozległ się głos, mówiący: Ten jest moim umiłowanym Synem, Jego słuchajcie."
  tags: []
"Mk9,8":
  text: "I nagle, gdy rozejrzeli się wokół, już nikogo nie zobaczyli, był z nimi tylko sam Jezus."
  tags: []
"Mk9,9":
  text: "A gdy zstępowali z góry, przykazał im, aby nikomu nie opowiadali o tym, co zobaczyli, dopóki Syn Człowieczy nie powstanie z martwych."
  tags: []
"Mk9,10":
  text: "I zachowali to słowo, rozprawiając między sobą: Co to jest powstanie z martwych?"
  tags: []
"Mk9,11":
  text: "Pytali Go też, mówiąc: Dlaczego uczeni w Piśmie mówią, że najpierw musi przyjść Eliasz?"
  tags: []
"Mk9,12":
  text: "A On w odpowiedzi, rzekł im: Eliasz wprawdzie przyszedł najpierw i wszystko naprawia; lecz o Synu Człowieczym jest napisane, że wiele wycierpiał i został uznany za nic."
  tags: []
"Mk9,13":
  text: "Lecz mówię wam, że Eliasz już przyszedł, i uczynili mu co chcieli, tak jak o nim jest napisane."
  tags: []
"Mk9,14":
  text: "A gdy przyszedł do uczniów, ujrzał wielki tłum wokół nich i uczonych w Piśmie, którzy spierali się z nimi."
  tags: []
"Mk9,15":
  text: "A zaraz ujrzał Go cały tłum, zdumiał się i przybiegł, pozdrawiając Go."
  tags: []
"Mk9,16":
  text: "I zapytał uczonych w Piśmie: Czemu prowadzicie z nimi spór?"
  tags: []
"Mk9,17":
  text: "A w odpowiedzi, ktoś z tłumu rzekł: Nauczycielu! Przyprowadziłem do Ciebie swojego syna, który ma ducha niemego."
  tags: []
"Mk9,18":
  text: "I kiedy go pochwyci, rzuca nim, a on pieni się, zgrzyta zębami i drętwieje; mówiłem Twoim uczniom, aby go wyrzucili, a nie mogli."
  tags: []
"Mk9,19":
  text: "A On w odpowiedzi, rzekł mu: O niewierne pokolenie! Jak długo przy was będę? I jak długo będę was znosić? Przyprowadźcie go do mnie."
  tags: []
"Mk9,20":
  text: "I przyprowadzili go do Niego; a gdy duch Go ujrzał, zaraz nim szarpnął, a on gdy upadł na ziemię, tarzał się z pianą na ustach."
  tags: []
"Mk9,21":
  text: "I spytał jego ojca: Od jakiego czasu to się z nim dzieje? A on powiedział: Od dzieciństwa,"
  tags: []
"Mk9,22":
  text: "I wiele razy rzucał go i w ogień, i w wodę, żeby go zgubić; ale jeżeli coś możesz, ratuj nas i zlituj się nad nami."
  tags: []
"Mk9,23":
  text: "Jezus więc powiedział do niego: Jeżeli możesz uwierzyć; wszystko jest możliwe dla wierzącego."
  tags: []
"Mk9,24":
  text: "I zaraz ojciec chłopca zawołał i powiedział ze łzami: Wierzę, Panie! Pomóż mojemu niedowiarstwu."
  tags: []
"Mk9,25":
  text: "A Jezus widząc, że lud zbiega się, zgromił ducha nieczystego, mówiąc do niego: Duchu niemy i głuchy! Ja ci rozkazuję, wyjdź z niego i już więcej w niego nie wchodź."
  tags: []
"Mk9,26":
  text: "I krzyknął, i mocno go szarpnął, i wyszedł z niego; a chłopiec stał się jakby martwy, tak że wielu mówiło, że umarł."
  tags: []
"Mk9,27":
  text: "Ale Jezus ujął go za rękę i podniósł go; a on wstał."
  tags: []
"Mk9,28":
  text: "I gdy On wszedł do domu, pytali Go na osobności Jego uczniowie: Dlaczego my nie mogliśmy go wyrzucić?"
  tags: []
"Mk9,29":
  text: "I powiedział im: Ten rodzaj inaczej wyjść nie może, jak tylko w modlitwie i poście."
  tags: []
"Mk9,30":
  text: "I wyszli stamtąd, i przechodzili przez Galileę; a nie chciał, aby ktoś o tym wiedział."
  tags: []
"Mk9,31":
  text: "Albowiem nauczał swoich uczniów i mówił im: Syn Człowieczy będzie wydany w ręce ludzi, i zabiją Go; a gdy będzie zabity, trzeciego dnia zmartwychwstanie."
  tags: []
"Mk9,32":
  text: "Lecz oni nie rozumieli tego słowa, a bali się Go pytać."
  tags: []
"Mk9,33":
  text: "I przyszedł do Kafarnaum, a będąc w domu, pytał ich: O czym rozprawialiście między sobą w drodze?"
  tags: []
"Mk9,34":
  text: "Lecz oni milczeli; bo w drodze rozprawiali między sobą, który z nich jest większy."
  tags: []
"Mk9,35":
  text: "I gdy usiadł, zawołał dwunastu i mówił im: Jeśli ktoś chce być pierwszy, niech będzie ze wszystkich ostatni i sługą wszystkich."
  tags: []
"Mk9,36":
  text: "A następnie wziął dziecię, postawił je pośrodku nich, wziął je w ramiona i powiedział im:"
  tags: []
"Mk9,37":
  text: "Jeśli ktoś przyjąłby jedno z takich dzieciątek w moim imieniu, mnie przyjmuje; a jeśli ktoś przyjąłby mnie, nie mnie by przyjął, ale Tego, który mnie posłał."
  tags: []
"Mk9,38":
  text: "A w odpowiedzi, Jan rzekł do Niego: Nauczycielu! Zobaczyliśmy kogoś, kto w Twoim imieniu wyganiał demony, a nie chodzi z nami, i zabroniliśmy mu, gdyż nie chodzi z nami."
  tags: []
"Mk9,39":
  text: "Ale Jezus powiedział: Nie zabraniajcie mu; albowiem nie ma nikogo, kto by czynił dzieła mocy w moim imieniu, a potem mógł zaraz o mnie mówić źle,"
  tags: []
"Mk9,40":
  text: "Kto bowiem nie jest przeciwko nam, jest za nami."
  tags: []
"Mk9,41":
  text: "Bo ktokolwiek napoiłby was kubkiem wody w moim imieniu, dlatego że należycie do Mesjasza, zaprawdę mówię wam, nie straci swojej zapłaty."
  tags: []
"Mk9,42":
  text: "A kto byłby powodem upadku jednego z tych małych, którzy wierzą we mnie, lepiej by mu było, aby zawieszono kamień młyński wokół jego szyi i wrzucono go w morze."
  tags: []
"Mk9,43":
  text: "I jeśli twoja ręka jest powodem do upadku, odetnij ją; lepiej jest tobie wejść kalekim do życia, niż mając dwie ręce, odejść do Gehenny, w ogień nieugaszony,"
  tags: []
"Mk9,44":
  text: "Gdzie robak ich nie umiera i ogień nie gaśnie."
  tags: []
"Mk9,45":
  text: "I jeśli twoja stopa jest powodem do upadku, odetnij ją; lepiej jest tobie wejść kulawym do życia, niż mając dwie stopy, zostać wrzuconym do Gehenny, w ogień nieugaszony,"
  tags: []
"Mk9,46":
  text: "Gdzie robak ich nie umiera i ogień nie gaśnie."
  tags: []
"Mk9,47":
  text: "I jeśli twoje oko jest powodem do upadku, wyłup je; lepiej tobie jest wejść do Królestwa Bożego jednookim, niż mając dwoje oczu, zostać wrzuconym w ogień Gehenny,"
  tags: []
"Mk9,48":
  text: "Gdzie robak ich nie umiera i ogień nie gaśnie."
  tags: []
"Mk9,49":
  text: "Każdy bowiem zostanie ogniem osolony, i każda ofiara zostanie osolona solą."
  tags: []
"Mk9,50":
  text: "Dobra jest sól; jeśli jednak sól stanie się niesłona, czym ją przyprawicie? Miejcie sól w sobie samych i zachowajcie pokój między sobą."
  tags: []
