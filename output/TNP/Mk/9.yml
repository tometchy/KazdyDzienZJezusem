"Mk9,1": "I powiedział im: Zaprawdę mówię wam: Niektórzy z tych, co tu stoją, nie zakosztują śmierci, aż ujrzą Królestwo Boże przychodzące w mocy."
"Mk9,2": "A po sześciu dniach wziął Jezus ze sobą Piotra i Jakuba, i Jana, i wprowadził ich samych na wysoką górę na osobność, i został przemieniony wobec nich."
"Mk9,3": "A Jego szaty stały się lśniące, bardzo białe jak śnieg, tak jak żaden folusznik na ziemi nie może wybielić."
"Mk9,4": "I ukazał się im Eliasz z Mojżeszem, rozmawiający z Jezusem."
"Mk9,5": "I Piotr odezwał się, i powiedział Jezusowi: Rabbi! Dobrze nam tu być; zróbmy więc trzy namioty: jeden dla Ciebie, i jeden dla Mojżesza, i jeden dla Eliasza."
"Mk9,6": "Nie wiedział bowiem, co ma powiedzieć; bo byli bardzo przestraszeni."
"Mk9,7": "I powstał obłok, który ich zacienił; a z obłoku rozległ się głos, mówiący: Ten jest moim umiłowanym Synem, Jego słuchajcie."
"Mk9,8": "I nagle, gdy rozejrzeli się wokół, już nikogo nie zobaczyli, był z nimi tylko sam Jezus."
"Mk9,9": "A gdy zstępowali z góry, przykazał im, aby nikomu nie opowiadali o tym, co zobaczyli, dopóki Syn Człowieczy nie powstanie z martwych."
"Mk9,10": "I zachowali to słowo, rozprawiając między sobą: Co to jest powstanie z martwych?"
"Mk9,11": "Pytali Go też, mówiąc: Dlaczego uczeni w Piśmie mówią, że najpierw musi przyjść Eliasz?"
"Mk9,12": "A On w odpowiedzi, rzekł im: Eliasz wprawdzie przyszedł najpierw i wszystko naprawia; lecz o Synu Człowieczym jest napisane, że wiele wycierpiał i został uznany za nic."
"Mk9,13": "Lecz mówię wam, że Eliasz już przyszedł, i uczynili mu co chcieli, tak jak o nim jest napisane."
"Mk9,14": "A gdy przyszedł do uczniów, ujrzał wielki tłum wokół nich i uczonych w Piśmie, którzy spierali się z nimi."
"Mk9,15": "A zaraz ujrzał Go cały tłum, zdumiał się i przybiegł, pozdrawiając Go."
"Mk9,16": "I zapytał uczonych w Piśmie: Czemu prowadzicie z nimi spór?"
"Mk9,17": "A w odpowiedzi, ktoś z tłumu rzekł: Nauczycielu! Przyprowadziłem do Ciebie swojego syna, który ma ducha niemego."
"Mk9,18": "I kiedy go pochwyci, rzuca nim, a on pieni się, zgrzyta zębami i drętwieje; mówiłem Twoim uczniom, aby go wyrzucili, a nie mogli."
"Mk9,19": "A On w odpowiedzi, rzekł mu: O niewierne pokolenie! Jak długo przy was będę? I jak długo będę was znosić? Przyprowadźcie go do mnie."
"Mk9,20": "I przyprowadzili go do Niego; a gdy duch Go ujrzał, zaraz nim szarpnął, a on gdy upadł na ziemię, tarzał się z pianą na ustach."
"Mk9,21": "I spytał jego ojca: Od jakiego czasu to się z nim dzieje? A on powiedział: Od dzieciństwa,"
"Mk9,22": "I wiele razy rzucał go i w ogień, i w wodę, żeby go zgubić; ale jeżeli coś możesz, ratuj nas i zlituj się nad nami."
"Mk9,23": "Jezus więc powiedział do niego: Jeżeli możesz uwierzyć; wszystko jest możliwe dla wierzącego."
"Mk9,24": "I zaraz ojciec chłopca zawołał i powiedział ze łzami: Wierzę, Panie! Pomóż mojemu niedowiarstwu."
"Mk9,25": "A Jezus widząc, że lud zbiega się, zgromił ducha nieczystego, mówiąc do niego: Duchu niemy i głuchy! Ja ci rozkazuję, wyjdź z niego i już więcej w niego nie wchodź."
"Mk9,26": "I krzyknął, i mocno go szarpnął, i wyszedł z niego; a chłopiec stał się jakby martwy, tak że wielu mówiło, że umarł."
"Mk9,27": "Ale Jezus ujął go za rękę i podniósł go; a on wstał."
"Mk9,28": "I gdy On wszedł do domu, pytali Go na osobności Jego uczniowie: Dlaczego my nie mogliśmy go wyrzucić?"
"Mk9,29": "I powiedział im: Ten rodzaj inaczej wyjść nie może, jak tylko w modlitwie i poście."
"Mk9,30": "I wyszli stamtąd, i przechodzili przez Galileę; a nie chciał, aby ktoś o tym wiedział."
"Mk9,31": "Albowiem nauczał swoich uczniów i mówił im: Syn Człowieczy będzie wydany w ręce ludzi, i zabiją Go; a gdy będzie zabity, trzeciego dnia zmartwychwstanie."
"Mk9,32": "Lecz oni nie rozumieli tego słowa, a bali się Go pytać."
"Mk9,33": "I przyszedł do Kafarnaum, a będąc w domu, pytał ich: O czym rozprawialiście między sobą w drodze?"
"Mk9,34": "Lecz oni milczeli; bo w drodze rozprawiali między sobą, który z nich jest większy."
"Mk9,35": "I gdy usiadł, zawołał dwunastu i mówił im: Jeśli ktoś chce być pierwszy, niech będzie ze wszystkich ostatni i sługą wszystkich."
"Mk9,36": "A następnie wziął dziecię, postawił je pośrodku nich, wziął je w ramiona i powiedział im:"
"Mk9,37": "Jeśli ktoś przyjąłby jedno z takich dzieciątek w moim imieniu, mnie przyjmuje; a jeśli ktoś przyjąłby mnie, nie mnie by przyjął, ale Tego, który mnie posłał."
"Mk9,38": "A w odpowiedzi, Jan rzekł do Niego: Nauczycielu! Zobaczyliśmy kogoś, kto w Twoim imieniu wyganiał demony, a nie chodzi z nami, i zabroniliśmy mu, gdyż nie chodzi z nami."
"Mk9,39": "Ale Jezus powiedział: Nie zabraniajcie mu; albowiem nie ma nikogo, kto by czynił dzieła mocy w moim imieniu, a potem mógł zaraz o mnie mówić źle,"
"Mk9,40": "Kto bowiem nie jest przeciwko nam, jest za nami."
"Mk9,41": "Bo ktokolwiek napoiłby was kubkiem wody w moim imieniu, dlatego że należycie do Mesjasza, zaprawdę mówię wam, nie straci swojej zapłaty."
"Mk9,42": "A kto byłby powodem upadku jednego z tych małych, którzy wierzą we mnie, lepiej by mu było, aby zawieszono kamień młyński wokół jego szyi i wrzucono go w morze."
"Mk9,43": "I jeśli twoja ręka jest powodem do upadku, odetnij ją; lepiej jest tobie wejść kalekim do życia, niż mając dwie ręce, odejść do Gehenny, w ogień nieugaszony,"
"Mk9,44": "Gdzie robak ich nie umiera i ogień nie gaśnie."
"Mk9,45": "I jeśli twoja stopa jest powodem do upadku, odetnij ją; lepiej jest tobie wejść kulawym do życia, niż mając dwie stopy, zostać wrzuconym do Gehenny, w ogień nieugaszony,"
"Mk9,46": "Gdzie robak ich nie umiera i ogień nie gaśnie."
"Mk9,47": "I jeśli twoje oko jest powodem do upadku, wyłup je; lepiej tobie jest wejść do Królestwa Bożego jednookim, niż mając dwoje oczu, zostać wrzuconym w ogień Gehenny,"
"Mk9,48": "Gdzie robak ich nie umiera i ogień nie gaśnie."
"Mk9,49": "Każdy bowiem zostanie ogniem osolony, i każda ofiara zostanie osolona solą."
"Mk9,50": "Dobra jest sól; jeśli jednak sól stanie się niesłona, czym ją przyprawicie? Miejcie sól w sobie samych i zachowajcie pokój między sobą."
