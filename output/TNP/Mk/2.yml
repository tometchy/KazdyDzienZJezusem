"Mk2,1":
  text: "I po kilku dniach ponownie przyszedł do Kafarnaum; i usłyszano, że jest w domu."
  tags: []
"Mk2,2":
  text: "I zaraz zeszło się tak wielu, że nie mogli się zmieścić nawet przed drzwiami. I zaczął im głosić Słowo."
  tags: []
"Mk2,3":
  text: "I przyszli do Niego, niosąc sparaliżowanego, a niosło go czterech ludzi."
  tags: []
"Mk2,4":
  text: "A gdy nie mogli zbliżyć się do Niego z powodu tłumu, zdjęli dach nad miejscem gdzie był Jezus, i gdy go wyłamali, spuścili na dół posłanie, na którym leżał sparaliżowany."
  tags: []
"Mk2,5":
  text: "A Jezus, widząc ich wiarę, powiedział sparaliżowanemu: Dziecko, odpuszczone są ci twoje grzechy."
  tags: []
"Mk2,6":
  text: "A byli tam niektórzy z uczonych w Piśmie; ci siedzieli i rozważali w swoich sercach:"
  tags: []
"Mk2,7":
  text: "Dlaczego On mówi takie bluźnierstwa? Kto może odpuszczać grzechy jeśli nie jeden – Bóg?"
  tags: []
"Mk2,8":
  text: "A Jezus zaraz poznał w swoim duchu, że tak w głębi siebie rozważają, i powiedział im: Dlaczego takie myśli rozważacie w swoich sercach?"
  tags: []
"Mk2,9":
  text: "Co jest łatwiejsze, powiedzieć sparaliżowanemu: Odpuszczone są ci grzechy, czy powiedzieć: Wstań, weź swoje posłanie i chodź?"
  tags: []
"Mk2,10":
  text: "Ale abyście wiedzieli, że Syn Człowieczy ma prawo na ziemi odpuszczać grzechy, powiedział sparaliżowanemu:"
  tags: []
"Mk2,11":
  text: "Tobie mówię: Wstań, weź swoje posłanie i idź do swojego domu."
  tags: []
"Mk2,12":
  text: "I on zaraz wstał, i wziął swoje posłanie, wyszedł wobec wszystkich, tak że zdumiewali się wszyscy i chwalili Boga, mówiąc: Nigdy czegoś takiego nie widzieliśmy."
  tags: []
"Mk2,13":
  text: "I wyszedł ponownie nad morze, i cały tłum przychodził do Niego; i nauczał ich."
  tags: []
"Mk2,14":
  text: "A przechodząc obok, ujrzał Lewiego, syna Alfeusza, siedzącego przy stole celnym, i powiedział mu: Pójdź za mną! A on wstał i poszedł za Nim."
  tags: []
"Mk2,15":
  text: "I stało się, gdy spoczywał przy stole w jego domu, że wielu celników i grzeszników razem spoczywało z Jezusem i z Jego uczniami; bo było ich wielu i podążali za Nim."
  tags: []
"Mk2,16":
  text: "A uczeni w Piśmie i faryzeusze widząc, że jadł z celnikami i grzesznikami, mówili do Jego uczniów: Dlaczego je i pije z celnikami i grzesznikami?"
  tags: []
"Mk2,17":
  text: "Jezus słysząc to, powiedział im: Nie potrzebują zdrowi lekarza, ale ci, co mają się źle; nie przyszedłem wezwać sprawiedliwych, ale grzesznych do upamiętania."
  tags: []
"Mk2,18":
  text: "A uczniowie Jana i faryzeusze właśnie pościli; przyszli więc i mówili do Niego: Czemu uczniowie Jana i faryzeusze poszczą, a Twoi uczniowie nie poszczą?"
  tags: []
"Mk2,19":
  text: "I Jezus powiedział im: Czy mogą przyjaciele domu weselnego pościć, dopóki jest z nimi oblubieniec? Przez ten czas, dopóki mają między sobą oblubieńca, nie mogą pościć."
  tags: []
"Mk2,20":
  text: "A przyjdą dni, gdy zostanie im odebrany oblubieniec; i wtedy w owe dni będą pościć."
  tags: []
"Mk2,21":
  text: "A nikt nie wszywa łaty z surowego sukna w starą szatę; a jeśli tak zrobi, to nowe wypełnienie odrywa to, co stare i rozdarcie staje się gorsze."
  tags: []
"Mk2,22":
  text: "I nikt nie leje młodego wina do starych bukłaków; a jeśli tak zrobi, to młode wino rozsadza bukłaki, i wino wycieka, a bukłaki psują się; ale młode wino wlewa się w nowe bukłaki."
  tags: []
"Mk2,23":
  text: "I stało się, że Jezus w szabat szedł przez zboża; i zaczęli Jego uczniowie po drodze rwać kłosy."
  tags: []
"Mk2,24":
  text: "A faryzeusze mówili do Niego: Spójrz! Dlaczego oni czynią w szabat to, czego nie wolno czynić?"
  tags: []
"Mk2,25":
  text: "A On powiedział im: Czy nigdy nie czytaliście, co uczynił Dawid, gdy znalazł się w potrzebie; i był głodny on i ci, którzy byli z nim?"
  tags: []
"Mk2,26":
  text: "Jak wszedł do domu Bożego za arcykapłana Abiatara i jadł chleby ofiarne, których nie wolno jeść nikomu, oprócz kapłanów, i dał je tym, którzy byli z nim."
  tags: []
"Mk2,27":
  text: "I powiedział im: Szabat ustanowiony jest dla człowieka, a nie człowiek dla szabatu."
  tags: []
"Mk2,28":
  text: "Tak więc Syn Człowieczy jest Panem i szabatu."
  tags: []
