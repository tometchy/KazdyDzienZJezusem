"Mk2,1": "I po kilku dniach ponownie przyszedł do Kafarnaum; i usłyszano, że jest w domu."
"Mk2,2": "I zaraz zeszło się tak wielu, że nie mogli się zmieścić nawet przed drzwiami. I zaczął im głosić Słowo."
"Mk2,3": "I przyszli do Niego, niosąc sparaliżowanego, a niosło go czterech ludzi."
"Mk2,4": "A gdy nie mogli zbliżyć się do Niego z powodu tłumu, zdjęli dach nad miejscem gdzie był Jezus, i gdy go wyłamali, spuścili na dół posłanie, na którym leżał sparaliżowany."
"Mk2,5": "A Jezus, widząc ich wiarę, powiedział sparaliżowanemu: Dziecko, odpuszczone są ci twoje grzechy."
"Mk2,6": "A byli tam niektórzy z uczonych w Piśmie; ci siedzieli i rozważali w swoich sercach:"
"Mk2,7": "Dlaczego On mówi takie bluźnierstwa? Kto może odpuszczać grzechy jeśli nie jeden – Bóg?"
"Mk2,8": "A Jezus zaraz poznał w swoim duchu, że tak w głębi siebie rozważają, i powiedział im: Dlaczego takie myśli rozważacie w swoich sercach?"
"Mk2,9": "Co jest łatwiejsze, powiedzieć sparaliżowanemu: Odpuszczone są ci grzechy, czy powiedzieć: Wstań, weź swoje posłanie i chodź?"
"Mk2,10": "Ale abyście wiedzieli, że Syn Człowieczy ma prawo na ziemi odpuszczać grzechy, powiedział sparaliżowanemu:"
"Mk2,11": "Tobie mówię: Wstań, weź swoje posłanie i idź do swojego domu."
"Mk2,12": "I on zaraz wstał, i wziął swoje posłanie, wyszedł wobec wszystkich, tak że zdumiewali się wszyscy i chwalili Boga, mówiąc: Nigdy czegoś takiego nie widzieliśmy."
"Mk2,13": "I wyszedł ponownie nad morze, i cały tłum przychodził do Niego; i nauczał ich."
"Mk2,14": "A przechodząc obok, ujrzał Lewiego, syna Alfeusza, siedzącego przy stole celnym, i powiedział mu: Pójdź za mną! A on wstał i poszedł za Nim."
"Mk2,15": "I stało się, gdy spoczywał przy stole w jego domu, że wielu celników i grzeszników razem spoczywało z Jezusem i z Jego uczniami; bo było ich wielu i podążali za Nim."
"Mk2,16": "A uczeni w Piśmie i faryzeusze widząc, że jadł z celnikami i grzesznikami, mówili do Jego uczniów: Dlaczego je i pije z celnikami i grzesznikami?"
"Mk2,17": "Jezus słysząc to, powiedział im: Nie potrzebują zdrowi lekarza, ale ci, co mają się źle; nie przyszedłem wezwać sprawiedliwych, ale grzesznych do upamiętania."
"Mk2,18": "A uczniowie Jana i faryzeusze właśnie pościli; przyszli więc i mówili do Niego: Czemu uczniowie Jana i faryzeusze poszczą, a Twoi uczniowie nie poszczą?"
"Mk2,19": "I Jezus powiedział im: Czy mogą przyjaciele domu weselnego pościć, dopóki jest z nimi oblubieniec? Przez ten czas, dopóki mają między sobą oblubieńca, nie mogą pościć."
"Mk2,20": "A przyjdą dni, gdy zostanie im odebrany oblubieniec; i wtedy w owe dni będą pościć."
"Mk2,21": "A nikt nie wszywa łaty z surowego sukna w starą szatę; a jeśli tak zrobi, to nowe wypełnienie odrywa to, co stare i rozdarcie staje się gorsze."
"Mk2,22": "I nikt nie leje młodego wina do starych bukłaków; a jeśli tak zrobi, to młode wino rozsadza bukłaki, i wino wycieka, a bukłaki psują się; ale młode wino wlewa się w nowe bukłaki."
"Mk2,23": "I stało się, że Jezus w szabat szedł przez zboża; i zaczęli Jego uczniowie po drodze rwać kłosy."
"Mk2,24": "A faryzeusze mówili do Niego: Spójrz! Dlaczego oni czynią w szabat to, czego nie wolno czynić?"
"Mk2,25": "A On powiedział im: Czy nigdy nie czytaliście, co uczynił Dawid, gdy znalazł się w potrzebie; i był głodny on i ci, którzy byli z nim?"
"Mk2,26": "Jak wszedł do domu Bożego za arcykapłana Abiatara i jadł chleby ofiarne, których nie wolno jeść nikomu, oprócz kapłanów, i dał je tym, którzy byli z nim."
"Mk2,27": "I powiedział im: Szabat ustanowiony jest dla człowieka, a nie człowiek dla szabatu."
"Mk2,28": "Tak więc Syn Człowieczy jest Panem i szabatu."
