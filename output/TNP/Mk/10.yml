"Mk10,1":
  text: "I oddalił się stamtąd, przyszedł w granice Judei na drugą stronę Jordanu; i ponownie zszedł się do Niego lud, i jak miał w zwyczaju, ponownie ich nauczał."
  tags: []
"Mk10,2":
  text: "I przystąpili faryzeusze, a wystawiając Go na próbę, spytali Go: Czy wolno mężowi oddalić żonę?"
  tags: []
"Mk10,3":
  text: "A On w odpowiedzi, rzekł do nich: Co wam przykazał Mojżesz?"
  tags: []
"Mk10,4":
  text: "A oni powiedzieli: Mojżesz pozwolił napisać zwój rozwodowy i ją oddalić."
  tags: []
"Mk10,5":
  text: "A Jezus w odpowiedzi, rzekł im: Z powodu zatwardziałości waszego serca napisał wam to przykazanie;"
  tags: []
"Mk10,6":
  text: "Jednak od początku stworzenia Bóg uczynił ich mężczyzną i kobietą."
  tags: []
"Mk10,7":
  text: "Z tego powodu opuści człowiek swojego ojca i matkę i zostanie połączony ze swoją żoną,"
  tags: []
"Mk10,8":
  text: "I będą ci dwoje jednym ciałem. A tak już nie są dwoje, ale jedno ciało."
  tags: []
"Mk10,9":
  text: "Co więc Bóg złączył, człowiek niech nie rozłącza."
  tags: []
"Mk10,10":
  text: "A w domu uczniowie Jego ponownie pytali Go o to samo."
  tags: []
"Mk10,11":
  text: "I powiedział im: Kto oddali swoją żonę i pojmie inną, cudzołoży względem niej;"
  tags: []
"Mk10,12":
  text: "I jeśliby kobieta opuściła swojego męża i została poślubiona przez innego, cudzołoży."
  tags: []
"Mk10,13":
  text: "I przynoszono do Niego dzieciątka, aby je dotknął; ale uczniowie surowo napominali tych, którzy je przynosili."
  tags: []
"Mk10,14":
  text: "A Jezus widząc to, oburzył się i powiedział im: Pozwólcie dzieciątkom przychodzić do mnie, i nie zabraniajcie im; bo takich jest Królestwo Boże."
  tags: []
"Mk10,15":
  text: "Zaprawdę mówię wam: Jeśli ktoś nie przyjmie Królestwa Bożego jak dziecię, nie wejdzie do niego."
  tags: []
"Mk10,16":
  text: "I brał je na swoje ramiona, błogosławił, kładąc na nie ręce."
  tags: []
"Mk10,17":
  text: "A gdy On wyruszał w drogę, podbiegł ktoś i upadł przed Nim na kolana, pytając Go: Nauczycielu dobry! Co mam czynić, aby odziedziczyć życie wieczne?"
  tags: []
"Mk10,18":
  text: "Ale Jezus powiedział mu: Dlaczego nazywasz mnie dobrym? Nikt nie jest dobry, tylko jeden – Bóg."
  tags: []
"Mk10,19":
  text: "Znasz przykazania: nie cudzołóż, nie morduj, nie kradnij, nie składaj fałszywego świadectwa, nie ograbiaj innych, czcij swojego ojca i matkę."
  tags: []
"Mk10,20":
  text: "A on w odpowiedzi, rzekł do Niego: Nauczycielu! Tego wszystkiego przestrzegałem od swojej młodości."
  tags: []
"Mk10,21":
  text: "A Jezus, przypatrzył się mu, umiłował go i powiedział do niego: Jednego ci brakuje: Odejdź, sprzedaj co masz i rozdaj ubogim, a będziesz miał skarb w niebie, i przyjdź, wziąwszy krzyż, podążaj za mną."
  tags: []
"Mk10,22":
  text: "A on sposępniał na to słowo i odszedł zasmucony, miał bowiem wiele posiadłości."
  tags: []
"Mk10,23":
  text: "A Jezus spojrzał wokoło, mówiąc do swoich uczniów: Jak trudno będzie tym, którzy mają bogactwa, wejść do Królestwa Bożego!"
  tags: []
"Mk10,24":
  text: "Lecz uczniowie byli zdumieni z powodu Jego słów. A Jezus, ponownie w odpowiedzi, rzekł im: Dzieci, jak trudno tym, co pokładają ufność w bogactwie, wejść do Królestwa Bożego."
  tags: []
"Mk10,25":
  text: "Łatwiej jest wielbłądowi przejść przez ucho igły, niż bogatemu wejść do Królestwa Bożego."
  tags: []
"Mk10,26":
  text: "A oni tym bardziej byli zaniepokojeni, mówiąc do siebie: Kto może być zbawiony?"
  tags: []
"Mk10,27":
  text: "A Jezus spojrzał na nich uważnie, mówiąc: U ludzi to niemożliwe, ale nie u Boga; u Boga bowiem wszystko jest możliwe."
  tags: []
"Mk10,28":
  text: "I wtedy Piotr zaczął mówić do Niego: Oto my wszystko opuściliśmy i poszliśmy za Tobą."
  tags: []
"Mk10,29":
  text: "A Jezus w odpowiedzi, rzekł: Zaprawdę mówię wam: Nie ma takiego, kto opuściłby dom, albo braci, albo siostry, albo ojca, albo matkę, albo żonę, albo dzieci, albo pole dla mnie i dla Ewangelii,"
  tags: []
"Mk10,30":
  text: "A nie otrzymał teraz w tym czasie stokrotnie tyle domów i braci, i sióstr, i matek, i dzieci, i pól, wśród prześladowań, a w nadchodzącym wieku – życie wieczne."
  tags: []
"Mk10,31":
  text: "A wielu pierwszych będzie ostatnimi, a ostatnich pierwszymi."
  tags: []
"Mk10,32":
  text: "Kiedy byli w drodze, zmierzając do Jerozolimy, a Jezus szedł przed nimi, zdumiewali się, a idąc za Nim, odczuwali lęk. I ponownie wziął ze sobą dwunastu, zaczął im mówić o tym, co ma Go spotkać:"
  tags: []
"Mk10,33":
  text: "Oto zmierzamy do Jerozolimy, a Syn Człowieczy zostanie wydany arcykapłanom i uczonym w Piśmie, i skażą Go na śmierć, i wydadzą Go poganom."
  tags: []
"Mk10,34":
  text: "I będą z Niego szydzić, i Go ubiczują, i będą pluć na Niego, i Go zabiją; a trzeciego dnia powstanie z martwych."
  tags: []
"Mk10,35":
  text: "I podeszli do Niego Jakub i Jan, synowie Zebedeusza, mówiąc: Nauczycielu! Chcemy, abyś uczynił nam to, o co byśmy Cię poprosili."
  tags: []
"Mk10,36":
  text: "A On powiedział im: Co chcecie, abym wam uczynił?"
  tags: []
"Mk10,37":
  text: "A oni powiedzieli Mu: Daj nam, abyśmy siedzieli w chwale Twojej jeden po Twojej prawej stronie, a drugi po Twojej lewej stronie."
  tags: []
"Mk10,38":
  text: "A Jezus powiedział im: Nie wiecie, o co prosicie. Czy możecie pić kielich, który ja piję, i chrztem, którym ja jestem chrzczony, być ochrzczeni?"
  tags: []
"Mk10,39":
  text: "A oni powiedzieli Mu: Możemy. A Jezus powiedział im: Istotnie, kielich, który ja piję, wypijecie, i chrztem, którym ja jestem chrzczony, zostaniecie ochrzczeni;"
  tags: []
"Mk10,40":
  text: "Lecz nie moją sprawą jest dać wam usiąść po mojej prawej stronie i po mojej lewej stronie; lecz będzie to dane tym, dla których jest to przygotowane."
  tags: []
"Mk10,41":
  text: "A gdy usłyszało to dziesięciu, zaczęli się oburzać na Jakuba i na Jana."
  tags: []
"Mk10,42":
  text: "Ale Jezus przywołał ich do siebie, mówiąc im: Wiecie, że ci, którym wydaje się, że przewodzą narodom, panują nad nimi, a wielcy wśród nich okazują swą władzę."
  tags: []
"Mk10,43":
  text: "Nie tak będzie między wami; ale jeśli ktoś chciałby stać się wielkim między wami, będzie waszym sługą;"
  tags: []
"Mk10,44":
  text: "A ktokolwiek z was chciałby być pierwszy, będzie niewolnikiem wszystkich."
  tags: []
"Mk10,45":
  text: "Bo i Syn Człowieczy nie przyszedł, aby Mu służono, ale aby służył, i aby dał życie swoje na okup za wielu."
  tags: []
"Mk10,46":
  text: "I przyszli do Jerycha; a gdy wychodził z Jerycha, On i Jego uczniowie, i znaczny tłum ludzi, oto ślepy, Bartymeusz, syn Tymeusza, siedział przy drodze żebrząc."
  tags: []
"Mk10,47":
  text: "A gdy usłyszał, że to idzie Jezus Nazarejczyk, zaczął wołać, mówiąc: Jezusie, Synu Dawida! Zmiłuj się nade mną!"
  tags: []
"Mk10,48":
  text: "I wielu napominało go surowo, aby milczał; a on tym bardziej wołał: Synu Dawida! Zmiłuj się nade mną!"
  tags: []
"Mk10,49":
  text: "I Jezus stanął, i kazał go zawołać. I zawołali ślepego, mówiąc mu: Ufaj, wstań, woła cię."
  tags: []
"Mk10,50":
  text: "A on zrzucił swój płaszcz, wstał i przyszedł do Jezusa."
  tags: []
"Mk10,51":
  text: "I Jezus odpowiadając, rzekł do niego: Co chcesz, abym ci uczynił? A ślepy powiedział mu: Rabbuni! Bym przejrzał."
  tags: []
"Mk10,52":
  text: "A Jezus powiedział mu: Idź, wiara twoja uzdrowiła cię. I zaraz przejrzał, i towarzyszył Jezusowi w drodze."
  tags: []
