"Mk10,1": "I oddalił się stamtąd, przyszedł w granice Judei na drugą stronę Jordanu; i ponownie zszedł się do Niego lud, i jak miał w zwyczaju, ponownie ich nauczał."
"Mk10,2": "I przystąpili faryzeusze, a wystawiając Go na próbę, spytali Go: Czy wolno mężowi oddalić żonę?"
"Mk10,3": "A On w odpowiedzi, rzekł do nich: Co wam przykazał Mojżesz?"
"Mk10,4": "A oni powiedzieli: Mojżesz pozwolił napisać zwój rozwodowy i ją oddalić."
"Mk10,5": "A Jezus w odpowiedzi, rzekł im: Z powodu zatwardziałości waszego serca napisał wam to przykazanie;"
"Mk10,6": "Jednak od początku stworzenia Bóg uczynił ich mężczyzną i kobietą."
"Mk10,7": "Z tego powodu opuści człowiek swojego ojca i matkę i zostanie połączony ze swoją żoną,"
"Mk10,8": "I będą ci dwoje jednym ciałem. A tak już nie są dwoje, ale jedno ciało."
"Mk10,9": "Co więc Bóg złączył, człowiek niech nie rozłącza."
"Mk10,10": "A w domu uczniowie Jego ponownie pytali Go o to samo."
"Mk10,11": "I powiedział im: Kto oddali swoją żonę i pojmie inną, cudzołoży względem niej;"
"Mk10,12": "I jeśliby kobieta opuściła swojego męża i została poślubiona przez innego, cudzołoży."
"Mk10,13": "I przynoszono do Niego dzieciątka, aby je dotknął; ale uczniowie surowo napominali tych, którzy je przynosili."
"Mk10,14": "A Jezus widząc to, oburzył się i powiedział im: Pozwólcie dzieciątkom przychodzić do mnie, i nie zabraniajcie im; bo takich jest Królestwo Boże."
"Mk10,15": "Zaprawdę mówię wam: Jeśli ktoś nie przyjmie Królestwa Bożego jak dziecię, nie wejdzie do niego."
"Mk10,16": "I brał je na swoje ramiona, błogosławił, kładąc na nie ręce."
"Mk10,17": "A gdy On wyruszał w drogę, podbiegł ktoś i upadł przed Nim na kolana, pytając Go: Nauczycielu dobry! Co mam czynić, aby odziedziczyć życie wieczne?"
"Mk10,18": "Ale Jezus powiedział mu: Dlaczego nazywasz mnie dobrym? Nikt nie jest dobry, tylko jeden – Bóg."
"Mk10,19": "Znasz przykazania: nie cudzołóż, nie morduj, nie kradnij, nie składaj fałszywego świadectwa, nie ograbiaj innych, czcij swojego ojca i matkę."
"Mk10,20": "A on w odpowiedzi, rzekł do Niego: Nauczycielu! Tego wszystkiego przestrzegałem od swojej młodości."
"Mk10,21": "A Jezus, przypatrzył się mu, umiłował go i powiedział do niego: Jednego ci brakuje: Odejdź, sprzedaj co masz i rozdaj ubogim, a będziesz miał skarb w niebie, i przyjdź, wziąwszy krzyż, podążaj za mną."
"Mk10,22": "A on sposępniał na to słowo i odszedł zasmucony, miał bowiem wiele posiadłości."
"Mk10,23": "A Jezus spojrzał wokoło, mówiąc do swoich uczniów: Jak trudno będzie tym, którzy mają bogactwa, wejść do Królestwa Bożego!"
"Mk10,24": "Lecz uczniowie byli zdumieni z powodu Jego słów. A Jezus, ponownie w odpowiedzi, rzekł im: Dzieci, jak trudno tym, co pokładają ufność w bogactwie, wejść do Królestwa Bożego."
"Mk10,25": "Łatwiej jest wielbłądowi przejść przez ucho igły, niż bogatemu wejść do Królestwa Bożego."
"Mk10,26": "A oni tym bardziej byli zaniepokojeni, mówiąc do siebie: Kto może być zbawiony?"
"Mk10,27": "A Jezus spojrzał na nich uważnie, mówiąc: U ludzi to niemożliwe, ale nie u Boga; u Boga bowiem wszystko jest możliwe."
"Mk10,28": "I wtedy Piotr zaczął mówić do Niego: Oto my wszystko opuściliśmy i poszliśmy za Tobą."
"Mk10,29": "A Jezus w odpowiedzi, rzekł: Zaprawdę mówię wam: Nie ma takiego, kto opuściłby dom, albo braci, albo siostry, albo ojca, albo matkę, albo żonę, albo dzieci, albo pole dla mnie i dla Ewangelii,"
"Mk10,30": "A nie otrzymał teraz w tym czasie stokrotnie tyle domów i braci, i sióstr, i matek, i dzieci, i pól, wśród prześladowań, a w nadchodzącym wieku – życie wieczne."
"Mk10,31": "A wielu pierwszych będzie ostatnimi, a ostatnich pierwszymi."
"Mk10,32": "Kiedy byli w drodze, zmierzając do Jerozolimy, a Jezus szedł przed nimi, zdumiewali się, a idąc za Nim, odczuwali lęk. I ponownie wziął ze sobą dwunastu, zaczął im mówić o tym, co ma Go spotkać:"
"Mk10,33": "Oto zmierzamy do Jerozolimy, a Syn Człowieczy zostanie wydany arcykapłanom i uczonym w Piśmie, i skażą Go na śmierć, i wydadzą Go poganom."
"Mk10,34": "I będą z Niego szydzić, i Go ubiczują, i będą pluć na Niego, i Go zabiją; a trzeciego dnia powstanie z martwych."
"Mk10,35": "I podeszli do Niego Jakub i Jan, synowie Zebedeusza, mówiąc: Nauczycielu! Chcemy, abyś uczynił nam to, o co byśmy Cię poprosili."
"Mk10,36": "A On powiedział im: Co chcecie, abym wam uczynił?"
"Mk10,37": "A oni powiedzieli Mu: Daj nam, abyśmy siedzieli w chwale Twojej jeden po Twojej prawej stronie, a drugi po Twojej lewej stronie."
"Mk10,38": "A Jezus powiedział im: Nie wiecie, o co prosicie. Czy możecie pić kielich, który ja piję, i chrztem, którym ja jestem chrzczony, być ochrzczeni?"
"Mk10,39": "A oni powiedzieli Mu: Możemy. A Jezus powiedział im: Istotnie, kielich, który ja piję, wypijecie, i chrztem, którym ja jestem chrzczony, zostaniecie ochrzczeni;"
"Mk10,40": "Lecz nie moją sprawą jest dać wam usiąść po mojej prawej stronie i po mojej lewej stronie; lecz będzie to dane tym, dla których jest to przygotowane."
"Mk10,41": "A gdy usłyszało to dziesięciu, zaczęli się oburzać na Jakuba i na Jana."
"Mk10,42": "Ale Jezus przywołał ich do siebie, mówiąc im: Wiecie, że ci, którym wydaje się, że przewodzą narodom, panują nad nimi, a wielcy wśród nich okazują swą władzę."
"Mk10,43": "Nie tak będzie między wami; ale jeśli ktoś chciałby stać się wielkim między wami, będzie waszym sługą;"
"Mk10,44": "A ktokolwiek z was chciałby być pierwszy, będzie niewolnikiem wszystkich."
"Mk10,45": "Bo i Syn Człowieczy nie przyszedł, aby Mu służono, ale aby służył, i aby dał życie swoje na okup za wielu."
"Mk10,46": "I przyszli do Jerycha; a gdy wychodził z Jerycha, On i Jego uczniowie, i znaczny tłum ludzi, oto ślepy, Bartymeusz, syn Tymeusza, siedział przy drodze żebrząc."
"Mk10,47": "A gdy usłyszał, że to idzie Jezus Nazarejczyk, zaczął wołać, mówiąc: Jezusie, Synu Dawida! Zmiłuj się nade mną!"
"Mk10,48": "I wielu napominało go surowo, aby milczał; a on tym bardziej wołał: Synu Dawida! Zmiłuj się nade mną!"
"Mk10,49": "I Jezus stanął, i kazał go zawołać. I zawołali ślepego, mówiąc mu: Ufaj, wstań, woła cię."
"Mk10,50": "A on zrzucił swój płaszcz, wstał i przyszedł do Jezusa."
"Mk10,51": "I Jezus odpowiadając, rzekł do niego: Co chcesz, abym ci uczynił? A ślepy powiedział mu: Rabbuni! Bym przejrzał."
"Mk10,52": "A Jezus powiedział mu: Idź, wiara twoja uzdrowiła cię. I zaraz przejrzał, i towarzyszył Jezusowi w drodze."
