"Na1,1":
  text: "Brzemię Niniwy. Zwój wizji Nahuma z Elkosz."
  tags: []
"Na1,2":
  text: "JHWH jest Bogiem zazdrosnym i mszczącym się; mściwy jest JHWH i władcą gniewnym; JHWH, który się mści nad przeciwnikami swoimi i zachowuje gniew wobec nieprzyjaciół swoich."
  tags: []
"Na1,3":
  text: "JHWH nieprędki do gniewu, to Bóg wielkiej mocy, nie uzna za niewinnego tego, który jest winny; w nawałnicy i w burzy jest droga JHWH, a obłok jest prochem Jego nóg,"
  tags: []
"Na1,4":
  text: "Który gromi morze i wysusza je, i wysuszył wszystkie rzeki; usechł przed Nim Baszan i Karmel, usechł także kwiat Libanu;"
  tags: []
"Na1,5":
  text: "Góry drżą przed Nim, a pagórki się roztapiają i ziemia podnosi się przed Jego obliczem, także okrąg ziemi oraz wszyscy mieszkający na nim."
  tags: []
"Na1,6":
  text: "Kto ostoi się przed Jego wzburzeniem? A kto powstanie wobec żaru Jego gniewu? Uniesienie Jego wylewa się jak ogień, a skały rozpadają się przed Nim."
  tags: []
"Na1,7":
  text: "Dobry jest JHWH. On miejscem schronienia w dniu ucisku, zna tych, którzy w Nim pokładają ufność;"
  tags: []
"Na1,8":
  text: "W zalewającej powodzi uczyni kres temu miejscu, a wrogów Boga będą gonić zawzięcie ciemności."
  tags: []
"Na1,9":
  text: "Co zamyślacie wobec JHWH? On uczyni kres Niniwie, nie nastanie drugi raz utrapienie."
  tags: []
"Na1,10":
  text: "Bo tak jak splątane ciernie i jak upici są winem, jak słoma zupełnie sucha – zostaną pochłonięci."
  tags: []
"Na1,11":
  text: "Z ciebie bowiem wyszedł planujący zło przeciw JHWH – złośliwie doradzający."
  tags: []
"Na1,12":
  text: "Tak powiedział JHWH: Choć bezpieczni i tak liczni, zatem zostaną zniszczeni – i przeminą; a ciebie chociaż upokorzyłem – już więcej cię nie upokorzę."
  tags: []
"Na1,13":
  text: "A teraz złamię jego jarzmo, które jest na tobie, a więzy twoje rozerwę."
  tags: []
"Na1,14":
  text: "Bo przeciwko tobie JHWH rozkazał, że nie będzie więcej już potomstwa z twojego imienia; z domu twojego boga zniszczę ryte i lane posągi, gdyż byłeś mało warty – wyznaczę ci grób."
  tags: []
"Na1,15":
  text: "Oto na górach stopy zwiastującego radosne poselstwo, oznajmiającego pokój. Obchodź Judo swoje święta, dopełnij swoich ślubów; bo już więcej niegodziwiec nie zdoła przejść przez ciebie, całkowicie został zgładzony."
  tags: []
