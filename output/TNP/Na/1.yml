"Na1,1": "Brzemię Niniwy. Zwój wizji Nahuma z Elkosz."
"Na1,2": "JHWH jest Bogiem zazdrosnym i mszczącym się; mściwy jest JHWH i władcą gniewnym; JHWH, który się mści nad przeciwnikami swoimi i zachowuje gniew wobec nieprzyjaciół swoich."
"Na1,3": "JHWH nieprędki do gniewu, to Bóg wielkiej mocy, nie uzna za niewinnego tego, który jest winny; w nawałnicy i w burzy jest droga JHWH, a obłok jest prochem Jego nóg,"
"Na1,4": "Który gromi morze i wysusza je, i wysuszył wszystkie rzeki; usechł przed Nim Baszan i Karmel, usechł także kwiat Libanu;"
"Na1,5": "Góry drżą przed Nim, a pagórki się roztapiają i ziemia podnosi się przed Jego obliczem, także okrąg ziemi oraz wszyscy mieszkający na nim."
"Na1,6": "Kto ostoi się przed Jego wzburzeniem? A kto powstanie wobec żaru Jego gniewu? Uniesienie Jego wylewa się jak ogień, a skały rozpadają się przed Nim."
"Na1,7": "Dobry jest JHWH. On miejscem schronienia w dniu ucisku, zna tych, którzy w Nim pokładają ufność;"
"Na1,8": "W zalewającej powodzi uczyni kres temu miejscu, a wrogów Boga będą gonić zawzięcie ciemności."
"Na1,9": "Co zamyślacie wobec JHWH? On uczyni kres Niniwie, nie nastanie drugi raz utrapienie."
"Na1,10": "Bo tak jak splątane ciernie i jak upici są winem, jak słoma zupełnie sucha – zostaną pochłonięci."
"Na1,11": "Z ciebie bowiem wyszedł planujący zło przeciw JHWH – złośliwie doradzający."
"Na1,12": "Tak powiedział JHWH: Choć bezpieczni i tak liczni, zatem zostaną zniszczeni – i przeminą; a ciebie chociaż upokorzyłem – już więcej cię nie upokorzę."
"Na1,13": "A teraz złamię jego jarzmo, które jest na tobie, a więzy twoje rozerwę."
"Na1,14": "Bo przeciwko tobie JHWH rozkazał, że nie będzie więcej już potomstwa z twojego imienia; z domu twojego boga zniszczę ryte i lane posągi, gdyż byłeś mało warty – wyznaczę ci grób."
"Na1,15": "Oto na górach stopy zwiastującego radosne poselstwo, oznajmiającego pokój. Obchodź Judo swoje święta, dopełnij swoich ślubów; bo już więcej niegodziwiec nie zdoła przejść przez ciebie, całkowicie został zgładzony."
