"Za3,1":
  text: "I pokazał mi Jozuego, arcykapłana, stojącego przed aniołem JHWH, i szatana stojącego po jego prawicy, aby mu się sprzeciwiać."
  tags: []
"Za3,2":
  text: "I powiedział JHWH do szatana: Upomina cię JHWH, szatanie! Upomina cię JHWH, Ten który wybiera Jerozolimę. Czyż ten nie jest polanem wyrwanym z ognia?"
  tags: []
"Za3,3":
  text: "A Jozue był ubrany w brudne szaty i stał przed aniołem."
  tags: []
"Za3,4":
  text: "I odezwał się, i powiedział do stojących przed jego obliczem, mówiąc: Zdejmijcie z niego te brudne szaty. I powiedział: Patrz, zdjąłem z ciebie twoją nieprawość i ubrałem cię w odświętne szaty."
  tags: []
"Za3,5":
  text: "I powiedziałem: Niech włożą mu na głowę czysty zawój. Włożyli więc czysty zawój na jego głowę i ubrali go w odświętne szaty, a anioł JHWH stał obok."
  tags: []
"Za3,6":
  text: "I oświadczył anioł JHWH Jozuemu, mówiąc:"
  tags: []
"Za3,7":
  text: "Tak mówi JHWH Zastępów: Jeśli będziesz chodził moimi drogami i jeśli będziesz strzegł mojego urzędu, to także ty będziesz sądził mój dom i także ty będziesz strzegł moich dziedzińców, dam ci się poruszać pomiędzy tymi, którzy tu stoją."
  tags: []
"Za3,8":
  text: "Słuchaj więc teraz, Jozue, arcykapłanie, ty i twoi towarzysze, którzy siedzą przed tobą. Bo oni są ludźmi zapowiedzi, gdyż oto sprowadzam swojego sługę – Latorośl."
  tags: []
"Za3,9":
  text: "Bo oto ten kamień, który położony jest przed Jozuem – na tym jednym kamieniu siedmioro oczu – oto ja wyryję na nim ryt – oświadczenie JHWH Zastępów – i usunę nieprawość tej ziemi w jednym dniu."
  tags: []
"Za3,10":
  text: "W tym dniu – oświadczenie JHWH Zastępów – każdy zaprosi swojego bliźniego, by usiąść pod winoroślą i pod figowcem."
  tags: []
