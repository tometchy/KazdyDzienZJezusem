"Za3,1": "I pokazał mi Jozuego, arcykapłana, stojącego przed aniołem JHWH, i szatana stojącego po jego prawicy, aby mu się sprzeciwiać."
"Za3,2": "I powiedział JHWH do szatana: Upomina cię JHWH, szatanie! Upomina cię JHWH, Ten który wybiera Jerozolimę. Czyż ten nie jest polanem wyrwanym z ognia?"
"Za3,3": "A Jozue był ubrany w brudne szaty i stał przed aniołem."
"Za3,4": "I odezwał się, i powiedział do stojących przed jego obliczem, mówiąc: Zdejmijcie z niego te brudne szaty. I powiedział: Patrz, zdjąłem z ciebie twoją nieprawość i ubrałem cię w odświętne szaty."
"Za3,5": "I powiedziałem: Niech włożą mu na głowę czysty zawój. Włożyli więc czysty zawój na jego głowę i ubrali go w odświętne szaty, a anioł JHWH stał obok."
"Za3,6": "I oświadczył anioł JHWH Jozuemu, mówiąc:"
"Za3,7": "Tak mówi JHWH Zastępów: Jeśli będziesz chodził moimi drogami i jeśli będziesz strzegł mojego urzędu, to także ty będziesz sądził mój dom i także ty będziesz strzegł moich dziedzińców, dam ci się poruszać pomiędzy tymi, którzy tu stoją."
"Za3,8": "Słuchaj więc teraz, Jozue, arcykapłanie, ty i twoi towarzysze, którzy siedzą przed tobą. Bo oni są ludźmi zapowiedzi, gdyż oto sprowadzam swojego sługę – Latorośl."
"Za3,9": "Bo oto ten kamień, który położony jest przed Jozuem – na tym jednym kamieniu siedmioro oczu – oto ja wyryję na nim ryt – oświadczenie JHWH Zastępów – i usunę nieprawość tej ziemi w jednym dniu."
"Za3,10": "W tym dniu – oświadczenie JHWH Zastępów – każdy zaprosi swojego bliźniego, by usiąść pod winoroślą i pod figowcem."
