"Za5,1":
  text: "I odwróciłem się, a gdy podniosłem swój wzrok i spojrzałem – a oto unoszący się zwój."
  tags: []
"Za5,2":
  text: "I powiedział do mnie: Co widzisz? A ja odpowiedziałem: Widzę unoszący się zwój, jego długość dwadzieścia łokci, a jego szerokość dziesięć łokci."
  tags: []
"Za5,3":
  text: "I powiedział do mnie: To klątwa, wznosząca się ponad obliczem całej tej ziemi. Bo każdy, kto kradnie, od tego czasu nie pozostanie zgodnie z nią bez kary i każdy, kto fałszywie przysięga, od tego czasu nie pozostanie zgodnie z nią bez kary."
  tags: []
"Za5,4":
  text: "I sprawiłem, że wyszła – oświadczenie JHWH Zastępów – i wejdzie do domu złodzieja i do domu tego, kto fałszywie przysięga na moje imię. Pozostanie pośród jego domu i zniszczy go – z jego belkami i jego kamieniami."
  tags: []
"Za5,5":
  text: "I wyszedł anioł, który ze mną rozmawiał, i powiedział do mnie: Podnieś teraz swoje oczy i zobacz, cóż to wychodzi."
  tags: []
"Za5,6":
  text: "I powiedziałem: Cóż to? A on odpowiedział: To, co wychodzi, to efa. I powiedział: To ich wygląd po całej tej ziemi."
  tags: []
"Za5,7":
  text: "A oto została podniesiona pokrywa ołowiana, a tam jakaś kobieta siedzi w środku efy."
  tags: []
"Za5,8":
  text: "I anioł powiedział: To bezbożność. I wrzucił ją do środka, wrzucił też na jej otwór ołowiany odważnik."
  tags: []
"Za5,9":
  text: "I podniosłem swój wzrok, i spojrzałem, a oto wyszły dwie kobiety mające wiatr w ich skrzydłach, a oto miały one skrzydła jak skrzydła bociana. I podniosły efę między ziemią a niebiosami."
  tags: []
"Za5,10":
  text: "I powiedziałem do anioła, któryrozmawiał ze mną: Dokąd one niosą tę efę?"
  tags: []
"Za5,11":
  text: "I powiedział do mnie: By zbudować dla niej dom w ziemi Szinear; a gdy będzie gotowy, umieszczą ją tam na cokole."
  tags: []
