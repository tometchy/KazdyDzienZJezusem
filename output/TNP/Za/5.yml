"Za5,1": "I odwróciłem się, a gdy podniosłem swój wzrok i spojrzałem – a oto unoszący się zwój."
"Za5,2": "I powiedział do mnie: Co widzisz? A ja odpowiedziałem: Widzę unoszący się zwój, jego długość dwadzieścia łokci, a jego szerokość dziesięć łokci."
"Za5,3": "I powiedział do mnie: To klątwa, wznosząca się ponad obliczem całej tej ziemi. Bo każdy, kto kradnie, od tego czasu nie pozostanie zgodnie z nią bez kary i każdy, kto fałszywie przysięga, od tego czasu nie pozostanie zgodnie z nią bez kary."
"Za5,4": "I sprawiłem, że wyszła – oświadczenie JHWH Zastępów – i wejdzie do domu złodzieja i do domu tego, kto fałszywie przysięga na moje imię. Pozostanie pośród jego domu i zniszczy go – z jego belkami i jego kamieniami."
"Za5,5": "I wyszedł anioł, który ze mną rozmawiał, i powiedział do mnie: Podnieś teraz swoje oczy i zobacz, cóż to wychodzi."
"Za5,6": "I powiedziałem: Cóż to? A on odpowiedział: To, co wychodzi, to efa. I powiedział: To ich wygląd po całej tej ziemi."
"Za5,7": "A oto została podniesiona pokrywa ołowiana, a tam jakaś kobieta siedzi w środku efy."
"Za5,8": "I anioł powiedział: To bezbożność. I wrzucił ją do środka, wrzucił też na jej otwór ołowiany odważnik."
"Za5,9": "I podniosłem swój wzrok, i spojrzałem, a oto wyszły dwie kobiety mające wiatr w ich skrzydłach, a oto miały one skrzydła jak skrzydła bociana. I podniosły efę między ziemią a niebiosami."
"Za5,10": "I powiedziałem do anioła, któryrozmawiał ze mną: Dokąd one niosą tę efę?"
"Za5,11": "I powiedział do mnie: By zbudować dla niej dom w ziemi Szinear; a gdy będzie gotowy, umieszczą ją tam na cokole."
