"Za6,1":
  text: "I odwróciłem się, i podniosłem swój wzrok, i spojrzałem; a oto cztery rydwany wychodziły spomiędzy dwóch gór, a te góry były górami z miedzi."
  tags: []
"Za6,2":
  text: "W pierwszym rydwanie były konie czerwone, w drugim rydwanie – konie czarne;"
  tags: []
"Za6,3":
  text: "W trzecim rydwanie – konie białe, a w czwartym rydwanie były konie pstrokate – silne."
  tags: []
"Za6,4":
  text: "I zapytałem, i powiedziałem do anioła, który rozmawiał ze mną: Co one oznaczają, mój panie?"
  tags: []
"Za6,5":
  text: "I odpowiedział anioł mówiący do mnie: To są cztery duchy niebios, wychodzące, by stawić się przed PANEM całej ziemi."
  tags: []
"Za6,6":
  text: "Ten rydwan przy którym są konie czarne, te wyruszają do krainy północnej, białe wyruszają za nimi, a pstrokate wyruszają do krainy Temanu."
  tags: []
"Za6,7":
  text: "A te silne wyruszyły, rwały się do biegu, aby obejść ziemię. I mówił: Idźcie i obejdźcie ziemię! I obeszły ziemię."
  tags: []
"Za6,8":
  text: "I zawołał do mnie, i powiedział do mnie, mówiąc: Patrz – te wyruszające do ziemi północnej, uspokoiły mojego ducha w ziemi północnej."
  tags: []
"Za6,9":
  text: "I stało się do mnie Słowo JHWH, mówiące:"
  tags: []
"Za6,10":
  text: "Weź dary od wygnańców: od Cheldaja, od Tobiasza i od Jedajasza, i idź w tym samym dniu, i wejdź do domu Jozjasza, syna Sofoniasza, do tych którzy przyszli z Babilonu"
  tags: []
"Za6,11":
  text: "I weź srebro i złoto, zrób korony i włóż je na głowę Jozuego, syna Josadaka, arcykapłana."
  tags: []
"Za6,12":
  text: "I powiedz do niego, mówiąc: To mówi JHWH Zastępów, mówiąc: Oto mąż, imię jego – Latorośl; i pod nim wyrośnie i zbuduje świątynię JHWH."
  tags: []
"Za6,13":
  text: "I on zbuduje świątynię JHWH, i on wesprze majestat, i zasiądzie i będzie rządził na swoim tronie, i stanie się kapłanem na swoim tronie, a plan pokoju będzie między nimi dwoma."
  tags: []
"Za6,14":
  text: "A te korony będą dla Chelema, Tobiasza, Jedajasza i Chena, syna Sofoniasza, na pamiątkę w świątyni JHWH."
  tags: []
"Za6,15":
  text: "I przyjdą z daleka, i będą budować w świątyni JHWH, i poznacie, że JHWH Zastępów posłał mnie do was. A stanie się to, jeśli pilnie będziecie słuchać głosu JHWH, swojego Boga."
  tags: []
