"Za6,1": "I odwróciłem się, i podniosłem swój wzrok, i spojrzałem; a oto cztery rydwany wychodziły spomiędzy dwóch gór, a te góry były górami z miedzi."
"Za6,2": "W pierwszym rydwanie były konie czerwone, w drugim rydwanie – konie czarne;"
"Za6,3": "W trzecim rydwanie – konie białe, a w czwartym rydwanie były konie pstrokate – silne."
"Za6,4": "I zapytałem, i powiedziałem do anioła, który rozmawiał ze mną: Co one oznaczają, mój panie?"
"Za6,5": "I odpowiedział anioł mówiący do mnie: To są cztery duchy niebios, wychodzące, by stawić się przed PANEM całej ziemi."
"Za6,6": "Ten rydwan przy którym są konie czarne, te wyruszają do krainy północnej, białe wyruszają za nimi, a pstrokate wyruszają do krainy Temanu."
"Za6,7": "A te silne wyruszyły, rwały się do biegu, aby obejść ziemię. I mówił: Idźcie i obejdźcie ziemię! I obeszły ziemię."
"Za6,8": "I zawołał do mnie, i powiedział do mnie, mówiąc: Patrz – te wyruszające do ziemi północnej, uspokoiły mojego ducha w ziemi północnej."
"Za6,9": "I stało się do mnie Słowo JHWH, mówiące:"
"Za6,10": "Weź dary od wygnańców: od Cheldaja, od Tobiasza i od Jedajasza, i idź w tym samym dniu, i wejdź do domu Jozjasza, syna Sofoniasza, do tych którzy przyszli z Babilonu"
"Za6,11": "I weź srebro i złoto, zrób korony i włóż je na głowę Jozuego, syna Josadaka, arcykapłana."
"Za6,12": "I powiedz do niego, mówiąc: To mówi JHWH Zastępów, mówiąc: Oto mąż, imię jego – Latorośl; i pod nim wyrośnie i zbuduje świątynię JHWH."
"Za6,13": "I on zbuduje świątynię JHWH, i on wesprze majestat, i zasiądzie i będzie rządził na swoim tronie, i stanie się kapłanem na swoim tronie, a plan pokoju będzie między nimi dwoma."
"Za6,14": "A te korony będą dla Chelema, Tobiasza, Jedajasza i Chena, syna Sofoniasza, na pamiątkę w świątyni JHWH."
"Za6,15": "I przyjdą z daleka, i będą budować w świątyni JHWH, i poznacie, że JHWH Zastępów posłał mnie do was. A stanie się to, jeśli pilnie będziecie słuchać głosu JHWH, swojego Boga."
