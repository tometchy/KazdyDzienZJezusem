"Za2,1":
  text: "I ponownie podniosłem swoje oczy, i zobaczyłem, a oto mężczyzna, w którego ręce był sznur mierniczy."
  tags: []
"Za2,2":
  text: "I powiedziałem: Dokąd ty idziesz? Odpowiedział mi: Idę zmierzyć Jerozolimę, by zobaczyć, jaka jest jej szerokość i jaka jest jej długość."
  tags: []
"Za2,3":
  text: "I oto anioł, który rozmawiał ze mną wystąpił; i inny anioł wystąpił, by się z nim spotkać."
  tags: []
"Za2,4":
  text: "I powiedział do niego: Biegnij, mów do tego młodzieńca: Jerozolima będzie zamieszkana jak miasta bez murów z powodu mnóstwa ludzi i bydła w niej."
  tags: []
"Za2,5":
  text: "A ja – oświadczenie JHWH – będę dla niej murem ognia dokoła i będę dla jej chwały pośród niej."
  tags: []
"Za2,6":
  text: "Biada, biada! Uciekajcie z kraju Północy – oświadczenie JHWH – bo jak cztery wiatry niebios, rozproszyłem was – oświadczenie JHWH."
  tags: []
"Za2,7":
  text: "Biada! Syjonie, zostań wyzwolona, mieszkanko córki Babilonu."
  tags: []
"Za2,8":
  text: "Bo tak mówi JHWH Zastępów – który posłał mnie za swoją chwałą do tych narodów, które was ograbiają – bo kto was dotyka, dotyka źrenicy Jego oka;"
  tags: []
"Za2,9":
  text: "Bo oto ja potrząsnę moją ręką przeciwko nim i staną się łupem dla swoich sług. I poznacie, że JHWH Zastępów mnie posłał."
  tags: []
"Za2,10":
  text: "Wiwatuj i raduj się, córko Syjonu, bo oto przyjdę i zamieszkam pośród ciebie – oświadczenie JHWH."
  tags: []
"Za2,11":
  text: "I wiele narodów zostanie przyłączonych w tym dniu do JHWH i będą mi za lud; i zamieszkam pośród ciebie i poznasz, że JHWH Zastępów posłał mnie do ciebie."
  tags: []
"Za2,12":
  text: "I posiądzie JHWH Judę – dział swój w ziemi świętej – i ponownie wybierze Jerozolimę."
  tags: []
"Za2,13":
  text: "Niech umilknie wszelkie ciało przed obliczem JHWH! Bo On wyruszy ze swojego miejsca świętego."
  tags: []
