"Za2,1": "I ponownie podniosłem swoje oczy, i zobaczyłem, a oto mężczyzna, w którego ręce był sznur mierniczy."
"Za2,2": "I powiedziałem: Dokąd ty idziesz? Odpowiedział mi: Idę zmierzyć Jerozolimę, by zobaczyć, jaka jest jej szerokość i jaka jest jej długość."
"Za2,3": "I oto anioł, który rozmawiał ze mną wystąpił; i inny anioł wystąpił, by się z nim spotkać."
"Za2,4": "I powiedział do niego: Biegnij, mów do tego młodzieńca: Jerozolima będzie zamieszkana jak miasta bez murów z powodu mnóstwa ludzi i bydła w niej."
"Za2,5": "A ja – oświadczenie JHWH – będę dla niej murem ognia dokoła i będę dla jej chwały pośród niej."
"Za2,6": "Biada, biada! Uciekajcie z kraju Północy – oświadczenie JHWH – bo jak cztery wiatry niebios, rozproszyłem was – oświadczenie JHWH."
"Za2,7": "Biada! Syjonie, zostań wyzwolona, mieszkanko córki Babilonu."
"Za2,8": "Bo tak mówi JHWH Zastępów – który posłał mnie za swoją chwałą do tych narodów, które was ograbiają – bo kto was dotyka, dotyka źrenicy Jego oka;"
"Za2,9": "Bo oto ja potrząsnę moją ręką przeciwko nim i staną się łupem dla swoich sług. I poznacie, że JHWH Zastępów mnie posłał."
"Za2,10": "Wiwatuj i raduj się, córko Syjonu, bo oto przyjdę i zamieszkam pośród ciebie – oświadczenie JHWH."
"Za2,11": "I wiele narodów zostanie przyłączonych w tym dniu do JHWH i będą mi za lud; i zamieszkam pośród ciebie i poznasz, że JHWH Zastępów posłał mnie do ciebie."
"Za2,12": "I posiądzie JHWH Judę – dział swój w ziemi świętej – i ponownie wybierze Jerozolimę."
"Za2,13": "Niech umilknie wszelkie ciało przed obliczem JHWH! Bo On wyruszy ze swojego miejsca świętego."
