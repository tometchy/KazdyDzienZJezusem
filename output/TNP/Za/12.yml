"Za12,1": "Brzemię. Słowo JHWH nad Izraelem. Oświadczenie JHWH, który rozpościera niebiosa, zakłada fundamenty ziemi i stwarza ducha człowieka w jego wnętrzu:"
"Za12,2": "Oto ja ustanowię Jerozolimę kielichem odurzenia dla wszystkich okolicznych ludów, a także przeciwko Judzie będzie oblężenie i przeciwko Jerozolimie."
"Za12,3": "I stanie się w tym dniu, że ustanowię Jerozolimę ciężkim kamieniem dla wszystkich ludów. Każdy, kto go podniesie, bardzo się zrani, a zgromadzą się przeciwko niej wszystkie narody ziemi."
"Za12,4": "W tym dniu – oświadczenie JHWH – każdego konia porażę trwogą, a jego jeźdźca – szaleństwem; ale nad domem Judy otworzę swoje oczy, a każdego konia narodów porażę ślepotą."
"Za12,5": "I przywódcy Judy powiedzą w swoim sercu: Moc dla mnie to mieszkańcy Jerozolimy w JHWH Zastępów, swoim Bogu."
"Za12,6": "W tym dniu ustanowię przywódców Judy jakby misą pełną ognia wśród drwa i płonącą pochodnią pośród snopów; i pożrą na prawo i na lewo wszystkie narody wokoło. A Jerozolima osiądzie ponownie na swoim miejscu, w Jerozolimie."
"Za12,7": "I najpierw JHWH wybawi namioty Judy, aby chwała domu Dawida i chwała mieszkańców Jerozolimy nie stała się większa nad Judą."
"Za12,8": "W tym dniu JHWH będzie osłoną na rzecz mieszkańców Jerozolimy, a najsłabszy pośród nich w tym dniu stanie się jak Dawid, a dom Dawida jak Bóg, jak anioł JHWH przed ich obliczem."
"Za12,9": "I stanie się w tym dniu, że będę dążył, by zniszczyć wszystkie te narody, wyruszające przeciwko Jerozolimie."
"Za12,10": "I wyleję na dom Dawida i na mieszkańca Jerozolimy ducha łaski i błagania. I będą wpatrywali się we mnie, tego, którego przebili, i będą lamentowali nad nim, jak lamentuje się nad jedynakiem; i będą napełniać się goryczą nad nim, jak napełnia się goryczą nad pierworodnym."
"Za12,11": "W tym dniu będzie wielkie zawodzenie w Jerozolimie, jak zawodzenie Hadad-Rimmon na równinie Megiddo."
"Za12,12": "Ziemia ta będzie lamentować, każdy ród osobno: ród domu Dawida osobno i jego kobiety osobno; ród domu Natana osobno i jego kobiety osobno;"
"Za12,13": "Ród domu Lewiego osobno i jego kobiety osobno; ród Szimejego osobno i jego kobiety osobno;"
"Za12,14": "Wszystkie pozostałe rody, każdy ród osobno i ich kobiety osobno."
