"Za12,1":
  text: "Brzemię. Słowo JHWH nad Izraelem. Oświadczenie JHWH, który rozpościera niebiosa, zakłada fundamenty ziemi i stwarza ducha człowieka w jego wnętrzu:"
  tags: []
"Za12,2":
  text: "Oto ja ustanowię Jerozolimę kielichem odurzenia dla wszystkich okolicznych ludów, a także przeciwko Judzie będzie oblężenie i przeciwko Jerozolimie."
  tags: []
"Za12,3":
  text: "I stanie się w tym dniu, że ustanowię Jerozolimę ciężkim kamieniem dla wszystkich ludów. Każdy, kto go podniesie, bardzo się zrani, a zgromadzą się przeciwko niej wszystkie narody ziemi."
  tags: []
"Za12,4":
  text: "W tym dniu – oświadczenie JHWH – każdego konia porażę trwogą, a jego jeźdźca – szaleństwem; ale nad domem Judy otworzę swoje oczy, a każdego konia narodów porażę ślepotą."
  tags: []
"Za12,5":
  text: "I przywódcy Judy powiedzą w swoim sercu: Moc dla mnie to mieszkańcy Jerozolimy w JHWH Zastępów, swoim Bogu."
  tags: []
"Za12,6":
  text: "W tym dniu ustanowię przywódców Judy jakby misą pełną ognia wśród drwa i płonącą pochodnią pośród snopów; i pożrą na prawo i na lewo wszystkie narody wokoło. A Jerozolima osiądzie ponownie na swoim miejscu, w Jerozolimie."
  tags: []
"Za12,7":
  text: "I najpierw JHWH wybawi namioty Judy, aby chwała domu Dawida i chwała mieszkańców Jerozolimy nie stała się większa nad Judą."
  tags: []
"Za12,8":
  text: "W tym dniu JHWH będzie osłoną na rzecz mieszkańców Jerozolimy, a najsłabszy pośród nich w tym dniu stanie się jak Dawid, a dom Dawida jak Bóg, jak anioł JHWH przed ich obliczem."
  tags: []
"Za12,9":
  text: "I stanie się w tym dniu, że będę dążył, by zniszczyć wszystkie te narody, wyruszające przeciwko Jerozolimie."
  tags: []
"Za12,10":
  text: "I wyleję na dom Dawida i na mieszkańca Jerozolimy ducha łaski i błagania. I będą wpatrywali się we mnie, tego, którego przebili, i będą lamentowali nad nim, jak lamentuje się nad jedynakiem; i będą napełniać się goryczą nad nim, jak napełnia się goryczą nad pierworodnym."
  tags: []
"Za12,11":
  text: "W tym dniu będzie wielkie zawodzenie w Jerozolimie, jak zawodzenie Hadad-Rimmon na równinie Megiddo."
  tags: []
"Za12,12":
  text: "Ziemia ta będzie lamentować, każdy ród osobno: ród domu Dawida osobno i jego kobiety osobno; ród domu Natana osobno i jego kobiety osobno;"
  tags: []
"Za12,13":
  text: "Ród domu Lewiego osobno i jego kobiety osobno; ród Szimejego osobno i jego kobiety osobno;"
  tags: []
"Za12,14":
  text: "Wszystkie pozostałe rody, każdy ród osobno i ich kobiety osobno."
  tags: []
