"Za4,1":
  text: "I powrócił anioł, który rozmawiał ze mną, i obudził mnie, jak kogoś kto ma zostać obudzony ze snu."
  tags: []
"Za4,2":
  text: "I powiedział do mnie: Co ty widzisz? Odpowiedziałem: Spojrzałem, a oto świecznik cały ze złota, a na jego szczycie czasza, na nim siedem jego lamp, siedem i siedem rurek do tych siedmiu lamp, które są na jego szczycie;"
  tags: []
"Za4,3":
  text: "I dwa drzewa oliwne obok niego, jedno po prawej stronie czaszy i jedno po jej lewej stronie."
  tags: []
"Za4,4":
  text: "I odpowiedziałem, i rzekłem do anioła, który rozmawiał ze mną, mówiąc: Co to oznacza, mój panie?"
  tags: []
"Za4,5":
  text: "Anioł, który rozmawiał ze mną, odpowiedział i rzekł do mnie: Czy nie wiesz, co oznaczają te rzeczy? I odpowiedziałem: Nie, mój panie."
  tags: []
"Za4,6":
  text: "Wtedy odpowiedział mi, mówiąc: Takie jest Słowo JHWH do Zorobabela: Nie w wojsku, nie w sile, lecz w moim Duchu – oświadczenie JHWH Zastępów."
  tags: []
"Za4,7":
  text: "Kim ty jesteś, góro wielka? Przed obliczem Zorobabela staniesz się równiną. Wyprowadzi on szczytowy kamień z okrzykami: Łaska, łaska dla niej!"
  tags: []
"Za4,8":
  text: "I stało się Słowo JHWH do mnie, mówiące:"
  tags: []
"Za4,9":
  text: "Ręce Zorobabela położyły fundamenty tego domu, jego ręce go dokończą; i poznasz, że JHWH Zastępów posłał mnie do was."
  tags: []
"Za4,10":
  text: "Bo kto wzgardził dniem małych początków? I będą się radować, i zobaczą kamień, pion w ręku Zorobabela. Te siedem to oczy JHWH, przebiegają one całą ziemię."
  tags: []
"Za4,11":
  text: "I odezwałem się, i powiedziałem do niego: Co oznaczają te dwa drzewa oliwne po prawej i po lewej stronie świecznika?"
  tags: []
"Za4,12":
  text: "I odezwałem się, i drugi raz powiedziałem do niego: Co oznaczają te dwie gałązki oliwne, które przez dwie złote rurki wypuszczają z siebie złocistą oliwę?"
  tags: []
"Za4,13":
  text: "I on powiedział: Czy nie wiesz, co te rzeczy oznaczają? Odpowiedziałem: Nie, mój panie."
  tags: []
"Za4,14":
  text: "Wtedy powiedział do mnie, mówiąc: To są dwaj pomazańcy, którzy stoją przy PANU całej ziemi."
  tags: []
