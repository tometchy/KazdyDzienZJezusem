"Za4,1": "I powrócił anioł, który rozmawiał ze mną, i obudził mnie, jak kogoś kto ma zostać obudzony ze snu."
"Za4,2": "I powiedział do mnie: Co ty widzisz? Odpowiedziałem: Spojrzałem, a oto świecznik cały ze złota, a na jego szczycie czasza, na nim siedem jego lamp, siedem i siedem rurek do tych siedmiu lamp, które są na jego szczycie;"
"Za4,3": "I dwa drzewa oliwne obok niego, jedno po prawej stronie czaszy i jedno po jej lewej stronie."
"Za4,4": "I odpowiedziałem, i rzekłem do anioła, który rozmawiał ze mną, mówiąc: Co to oznacza, mój panie?"
"Za4,5": "Anioł, który rozmawiał ze mną, odpowiedział i rzekł do mnie: Czy nie wiesz, co oznaczają te rzeczy? I odpowiedziałem: Nie, mój panie."
"Za4,6": "Wtedy odpowiedział mi, mówiąc: Takie jest Słowo JHWH do Zorobabela: Nie w wojsku, nie w sile, lecz w moim Duchu – oświadczenie JHWH Zastępów."
"Za4,7": "Kim ty jesteś, góro wielka? Przed obliczem Zorobabela staniesz się równiną. Wyprowadzi on szczytowy kamień z okrzykami: Łaska, łaska dla niej!"
"Za4,8": "I stało się Słowo JHWH do mnie, mówiące:"
"Za4,9": "Ręce Zorobabela położyły fundamenty tego domu, jego ręce go dokończą; i poznasz, że JHWH Zastępów posłał mnie do was."
"Za4,10": "Bo kto wzgardził dniem małych początków? I będą się radować, i zobaczą kamień, pion w ręku Zorobabela. Te siedem to oczy JHWH, przebiegają one całą ziemię."
"Za4,11": "I odezwałem się, i powiedziałem do niego: Co oznaczają te dwa drzewa oliwne po prawej i po lewej stronie świecznika?"
"Za4,12": "I odezwałem się, i drugi raz powiedziałem do niego: Co oznaczają te dwie gałązki oliwne, które przez dwie złote rurki wypuszczają z siebie złocistą oliwę?"
"Za4,13": "I on powiedział: Czy nie wiesz, co te rzeczy oznaczają? Odpowiedziałem: Nie, mój panie."
"Za4,14": "Wtedy powiedział do mnie, mówiąc: To są dwaj pomazańcy, którzy stoją przy PANU całej ziemi."
