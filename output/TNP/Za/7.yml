"Za7,1": "W czwartym roku króla Dariusza Słowo JHWH stało się do Zachariasza, czwartego dnia dziewiątego miesiąca, to jest w miesiącu Kislew."
"Za7,2": "I posłał Betel Sar-Esera i Regem-Meleka i jego ludzi, by ubłagać oblicze JHWH;"
"Za7,3": "I aby zapytać kapłanów, którzy byli w domu JHWH Zastępów, a także proroków, mówiąc: Czy w piątym miesiącu mam jeszcze płakać, poświęcając się, jak to czyniłem przez tyle lat?"
"Za7,4": "I stało się do mnie Słowo JHWH Zastępów, mówiące:"
"Za7,5": "Powiedz do całego ludu tej ziemi i do kapłanów: Gdy pościliście i zawodziliście w piątym i siódmym miesiącu i to siedemdziesiąt lat, czy rzeczywiście pościliście dla mnie?"
"Za7,6": "A gdy jecie i pijecie, czy nie dla siebie jecie i nie dla siebie pijecie?"
"Za7,7": "Czy nie są to słowa, którymi JHWH nawoływał was przez dawnych proroków, gdy jeszcze Jerozolima była zamieszkana i prosperująca, a także jej miasta wokół niej, również Negew i Szefela były zamieszkane?"
"Za7,8": "I stało się Słowo JHWH do Zachariasza, mówiące:"
"Za7,9": "Tak mówi JHWH Zastępów: Zasądzajcie wyroki zgodne ze sprawiedliwością i okazujcie łaskawość i litość każdy wobec swojego brata."
"Za7,10": "Nie uciskajcie wdowy i sieroty, obcego i ubogiego. Niech nikt nie obmyśla zła w swoich sercach wobec swojego brata."
"Za7,11": "Ale wzbraniali się, aby słuchać, raczej podali nieugięte ramię i uczynili stępiałym swoje uszy, aby nie słyszeć."
"Za7,12": "I swe serce uczynili krzemieniem, aby nie słuchać Prawa i słów, które posyłał JHWH Zastępów przez swojego Ducha ręką dawnych proroków. I nastał wielki gniew od JHWH Zastępów."
"Za7,13": "I stanie się tak, że jak wołał, a oni nie słuchali, tak będą wołali, a nie wysłucham – mówi JHWH Zastępów."
"Za7,14": "I rozwieję ich po wszystkich narodach, których nie znali, a ziemia ta została spustoszona, bez przechodzącego i powracającego. I uczynili tę kosztowną ziemię pustkowiem."
