"Za7,1":
  text: "W czwartym roku króla Dariusza Słowo JHWH stało się do Zachariasza, czwartego dnia dziewiątego miesiąca, to jest w miesiącu Kislew."
  tags: []
"Za7,2":
  text: "I posłał Betel Sar-Esera i Regem-Meleka i jego ludzi, by ubłagać oblicze JHWH;"
  tags: []
"Za7,3":
  text: "I aby zapytać kapłanów, którzy byli w domu JHWH Zastępów, a także proroków, mówiąc: Czy w piątym miesiącu mam jeszcze płakać, poświęcając się, jak to czyniłem przez tyle lat?"
  tags: []
"Za7,4":
  text: "I stało się do mnie Słowo JHWH Zastępów, mówiące:"
  tags: []
"Za7,5":
  text: "Powiedz do całego ludu tej ziemi i do kapłanów: Gdy pościliście i zawodziliście w piątym i siódmym miesiącu i to siedemdziesiąt lat, czy rzeczywiście pościliście dla mnie?"
  tags: []
"Za7,6":
  text: "A gdy jecie i pijecie, czy nie dla siebie jecie i nie dla siebie pijecie?"
  tags: []
"Za7,7":
  text: "Czy nie są to słowa, którymi JHWH nawoływał was przez dawnych proroków, gdy jeszcze Jerozolima była zamieszkana i prosperująca, a także jej miasta wokół niej, również Negew i Szefela były zamieszkane?"
  tags: []
"Za7,8":
  text: "I stało się Słowo JHWH do Zachariasza, mówiące:"
  tags: []
"Za7,9":
  text: "Tak mówi JHWH Zastępów: Zasądzajcie wyroki zgodne ze sprawiedliwością i okazujcie łaskawość i litość każdy wobec swojego brata."
  tags: []
"Za7,10":
  text: "Nie uciskajcie wdowy i sieroty, obcego i ubogiego. Niech nikt nie obmyśla zła w swoich sercach wobec swojego brata."
  tags: []
"Za7,11":
  text: "Ale wzbraniali się, aby słuchać, raczej podali nieugięte ramię i uczynili stępiałym swoje uszy, aby nie słyszeć."
  tags: []
"Za7,12":
  text: "I swe serce uczynili krzemieniem, aby nie słuchać Prawa i słów, które posyłał JHWH Zastępów przez swojego Ducha ręką dawnych proroków. I nastał wielki gniew od JHWH Zastępów."
  tags: []
"Za7,13":
  text: "I stanie się tak, że jak wołał, a oni nie słuchali, tak będą wołali, a nie wysłucham – mówi JHWH Zastępów."
  tags: []
"Za7,14":
  text: "I rozwieję ich po wszystkich narodach, których nie znali, a ziemia ta została spustoszona, bez przechodzącego i powracającego. I uczynili tę kosztowną ziemię pustkowiem."
  tags: []
