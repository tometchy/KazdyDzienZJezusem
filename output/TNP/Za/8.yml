"Za8,1":
  text: "I stało się do mnie Słowo JHWH Zastępów, mówiące:"
  tags: []
"Za8,2":
  text: "Tak mówi JHWH Zastępów: Zapłonąłem o Syjon wielką zazdrością i wielkim żarem zapłonąłem o niego."
  tags: []
"Za8,3":
  text: "Tak mówi JHWH: Wróciłem na Syjon i zamieszkam pośrodku Jerozolimy; a Jerozolima zostanie nazwana Miastem Wiernym, a góra JHWH Zastępów – Górą Świętą."
  tags: []
"Za8,4":
  text: "Tak mówi JHWH Zastępów: Jeszcze siadać będą starcy i staruszki na placach Jerozolimy, każdy z laską w swoim ręku z powodu licznych dni."
  tags: []
"Za8,5":
  text: "A place miasta zostaną napełnione bawiącymi się na nich chłopcami i dziewczętami."
  tags: []
"Za8,6":
  text: "Tak mówi JHWH Zastępów: Jeśli w tych dniach wyda się to niemożliwe w oczach resztki tego ludu, czy to będzie też niemożliwe w moich oczach? – oświadczenie JHWH Zastępów."
  tags: []
"Za8,7":
  text: "Tak mówi JHWH Zastępów: Oto ja wybawię mój lud z ziemi wschodu i z ziemi zachodu słońca."
  tags: []
"Za8,8":
  text: "I sprowadzę ich, i zamieszkają pośrodku Jerozolimy i będą moim ludem, a ja będę ich Bogiem, w prawdzie i sprawiedliwości."
  tags: []
"Za8,9":
  text: "Tak mówi JHWH Zastępów: Niech umocnią się wasze ręce, ręce słuchających w tych dniach słów, tych pochodzących z ust proroków, którzy byli w dniu, kiedy położono fundament domu JHWH Zastępów, aby świątynia została odbudowana."
  tags: []
"Za8,10":
  text: "Bo przed tymi dniami nie była wynagrodzona praca człowieka i praca zwierzęcia. Dla wychodzącego i wchodzącego nie było pokoju z powodu wroga. Bo ja skierowałem wszystkich – każdego człowieka, przeciw jego bliźniemu."
  tags: []
"Za8,11":
  text: "Lecz ja teraz, nie tak jak za wcześniejszych dni, będę dla resztki tego ludu – oświadczenie JHWH Zastępów."
  tags: []
"Za8,12":
  text: "Bo zasiew będzie rósł w pokoju, winorośl wyda swój owoc, ziemia wyda swoje plony, a także niebiosa udzielą swojej rosy, a to wszystko dam resztce tego ludu w dziedzictwo."
  tags: []
"Za8,13":
  text: "I stanie się, że jak byliście przekleństwem wśród narodów, domu Judy i domu Izraela, tak wybawię was i będziecie błogosławieństwem. Nie bójcie się i niech się umocnią wasze ręce."
  tags: []
"Za8,14":
  text: "Bo tak mówi JHWH Zastępów:Tak jak postanowiłem sprowadzić na was nieszczęście, gdy wasi ojcowie pobudzali mnie do gniewu, mówi JHWH Zastępów – i nie żałowałem tego;"
  tags: []
"Za8,15":
  text: "Tak zawróciłem i postanowiłem w tych dniach uczynić dobrze Jerozolimie i domowi Judy. Nie bójcie się."
  tags: []
"Za8,16":
  text: "Te słowa wprowadzajcie w czyn: Mówcie prawdę, każdy swojemu bliźniemu, prawdę i prawo pokoju stosujcie w waszych bramach;"
  tags: []
"Za8,17":
  text: "Niech nikt nie obmyśla zła w swoim sercu przeciwko bliźniemu i nie lubujcie się w fałszywej przysiędze, gdyż tego wszystkiego nienawidzę – oświadczenie JHWH."
  tags: []
"Za8,18":
  text: "I stało się do mnie Słowo JHWH Zastępów, mówiące:"
  tags: []
"Za8,19":
  text: "Tak mówi JHWH Zastępów: Post w czwartym, post w piątym, post w siódmym i post w dziesiątym miesiącu stanie się dla domu Judy radością i weselem, i rozkosznym świętem. Miłujcie i prawdę, i pokój."
  tags: []
"Za8,20":
  text: "Tak mówi JHWH Zastępów: Jeszcze będą przychodzić ludy i mieszkańcy wielu miast."
  tags: []
"Za8,21":
  text: "I udadzą się mieszkańcy jednego miasta do drugiego, mówiąc: Pójdźmy ochoczo przebłagać oblicze JHWH i szukać JHWH Zastępów. Ja także pójdę."
  tags: []
"Za8,22":
  text: "I liczne ludy, i potężne narody przybędą szukać JHWH Zastępów w Jerozolimie i przebłagać oblicze JHWH."
  tags: []
"Za8,23":
  text: "Tak mówi JHWH Zastępów: W tych dniach dziesięciu ludzi z wszystkich narodów i właściwych im języków uchwyci się skraju szaty Judejczyka, mówiąc: Pójdziemy z wami, bo usłyszeliśmy, że Bóg jest z wami."
  tags: []
