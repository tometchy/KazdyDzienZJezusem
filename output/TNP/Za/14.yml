"Za14,1": "Oto przychodzi dzień dla JHWH i twój łup zostanie rozdzielony pośrodku ciebie."
"Za14,2": "Bo zgromadzę wszystkie narody na wojnę do Jerozolimy, a miasto zostanie wzięte, domy splądrowane, a kobiety zgwałcone. Połowa miasta pójdzie do niewoli, a pozostały lud nie zostanie usunięty z miasta."
"Za14,3": "I wyjdzie JHWH, i będzie walczył z tymi narodami, jak w dniu swojej walki, jak w dniu bitwy."
"Za14,4": "I jego nogi staną w tym dniu na Górze Oliwnej, która leży naprzeciw Jerozolimy od wschodu. I zostanie rozcięta przez środek Góra Oliwna ze wschodu na zachód w bardzo wielką dolinę; i połowa tej góry cofnie się na północ, a druga jej połowa – na południe."
"Za14,5": "I będziecie uciekać w dolinę mojej góry, bo dolina gór będzie sięgać do Azal. Będziecie uciekać, jak uciekaliście przed trzęsieniem ziemi za dni Uzjasza, króla Judy. I przyjdzie JHWH, mój Bóg, a z Tobą wszyscy święci."
"Za14,6": "A w tym dniu nie będzie światła, a wspaniałości staną się ciemnością;"
"Za14,7": "I będzie jeden dzień, on znany jest JHWH, nie dzień i nie noc. I stanie się, że o wieczornej porze nastanie światło."
"Za14,8": "I stanie się w tym dniu, że wyjdą wody żywe z Jerozolimy; połowa ich do morza wschodniego, a połowa – do morza zachodniego. Będzie to w lecie i w zimie."
"Za14,9": "I JHWH będzie królem nad całą ziemią. W tym dniu jeden będzie JHWH i jedyne Jego imię."
"Za14,10": "Cała ta ziemia zamieni się jak Araba od Geba do Rimmon, na południe od Jerozolimy. I będzie ona wywyższona i osiądzie na swoim miejscu, od Bramy Beniamina do miejsca bramy Pierwszej i aż do Bramy Narożnej, i od Wieży Chananela aż do tłoczni królewskich."
"Za14,11": "I zamieszkają w niej, i klątwy nie będzie już więcej. I Jerozolima będzie mieszkać bezpiecznie."
"Za14,12": "A taka będzie plaga, którą dotknie JHWH wszystkie narody, które walczyły przeciwko Jerozolimie: Jego ciało będzie się rozkładać, gdy wciąż stać on będzie na swoich nogach i jego oczy będą ropieć w oczodołach, a jego język zgnije w ich ustach."
"Za14,13": "I stanie się w tym dniu, że będzie wśród nich wielkie zamieszanie od JHWH: i chwyci człowiek rękę bliźniego i jego ręka podniesie się przeciw ręce jego bliźniego."
"Za14,14": "Również Juda będzie walczyć w Jerozolimie, a bogactwa wszystkich okolicznych narodów będą zgromadzone: złoto i srebro, i szaty w wielkiej ilości."
"Za14,15": "A taka sama plaga jak tamta plaga dotknie konia, muła, wielbłąda i osła, wszelkie bydło, które będzie w tych obozach."
"Za14,16": "Wszyscy pozostali spośród wszystkich tych narodów, które wyruszyły przeciwko Jerozolimie, będą przychodzić co roku, by oddawać pokłon Królowi, JHWH Zastępów, i obchodzić Święto Namiotów;"
"Za14,17": "I stanie się, że jeśli któryś z rodów ziemi nie uda się do Jerozolimy, by oddawać pokłon Królowi, JHWH Zastępów, nie będzie dla tych narodów deszczu."
"Za14,18": "A jeśli ród Egiptu nie uda się i nie przyjdzie, nie dozna tej plagi; spadnie jednak na niego plaga, którą JHWH dotknie te narody, które nie przyjdą, by obchodzić Święto Namiotów."
"Za14,19": "Taka będzie kara na Egipt i kara na wszystkie narody, które nie udadzą się, by obchodzić Święto Namiotów."
"Za14,20": "W tym dniu na dzwoneczkach konia będzie napis: Świętość dla JHWH; i będą misy w domu JHWH jak czasze sprzed ołtarza."
"Za14,21": "Każda misa w Jerozolimie i Judzie będzie święta dla JHWH Zastępów. Wszyscy, którzy składają ofiary, przyjdą i będą je brali, i będą w nich gotowali. W tym dniu nie będzie już handlarza w domu JHWH Zastępów."
