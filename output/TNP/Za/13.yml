"Za13,1": "W tym dniu stanie się, że zostanie otwarte źródło dla domu Dawida i mieszkańców Jerozolimy dla oczyszczenia grzechu i nieczystości."
"Za13,2": "I stanie się w tym dniu – oświadczenie JHWH Zastępów – że wykorzenię imiona bożków z tej ziemi, tak że nie będą więcej wspominane. Usunę z tej ziemi także proroków i ducha nieczystego."
"Za13,3": "A stanie się, że jeśli ktoś zacznie ponownie prorokować, jego ojciec i matka, którzy go zrodzili, powiedzą mu: Nie będziesz żył, bo wypowiedziałeś kłamstwo w imię JHWH. I jego ojciec i matka, którzy go zrodzili, przebiją go podczas jego prorokowania."
"Za13,4": "I stanie się w tym dniu, że zawstydzą się prorocy, każdy za swoją wizję, podczas swojego prorokowania, i nie włożą na siebie szaty z włosia, aby zwodzić."
"Za13,5": "I każdy powie: Ja nie jestem prorokiem, lecz ja jestem człowiekiem uprawiającym rolę, bo człowiek nabył mnie od młodości."
"Za13,6": "A gdy powiedzą do niego: Co to za rany między twoimi rękami? Wtedy powie: Temi zadano w domu – od moich przyjaciół."
"Za13,7": "Ocknij się, mieczu, przeciwko mojemu pasterzowi i przeciwko mocarzowi, mojemu towarzyszowi – oświadczenie JHWH Zastępów. Uderz pasterza, a rozproszą się owce. I zwrócę swoją rękę przeciwko malutkim."
"Za13,8": "I stanie się na całej tej ziemi – oświadczenie JHWH – że dwie trzecie w niej zostaną wycięte i zginą, a trzecia zostanie w niej pozostawiona."
"Za13,9": "I przeprowadzę tę trzecią część przez ogień i oczyszczę ich jak oczyszcza się srebro, wypróbuję ich jak się próbuje złoto. Wezwie on mojego imienia, a ja mu odpowiem. Powiem: Jesteś moim ludem, a on powie: JHWH moim Bogiem."
