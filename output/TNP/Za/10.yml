"Za10,1": "Proście JHWH o deszcz w późnej porze deszczowej, a JHWH stworzy chmury burzowe i da im ulewny deszcz i każdemu zieleń na polu."
"Za10,2": "Bo bożki głoszą niegodziwość, a wróżbici widzą kłamstwo i opowiadają bezwartościowe sny, pocieszają marnością. Dlatego oddalili się jak owce, są udręczeni, bo nie mają pasterza."
"Za10,3": "Przeciw tym pasterzom rozpalił się mój gniew – i nawiedzę kozły, bo JHWH Zastępów nawiedził swoją trzodę – dom Judy i uczyni z nich jakby swojego potężnego rumaka w boju."
"Za10,4": "Od Niego kamień węgielny, od Niego palik, od Niego łuk bojowy, od Niego wyjdzie każdy wódz – wszyscy razem."
"Za10,5": "I będą jak mocarze, wdeptujący wroga w błoto ulic w bitwie. I będą walczyć, bo JHWH jest z nimi; i zawstydzą się jeźdźcy na koniach."
"Za10,6": "I umocnię dom Judy, i wybawię dom Józefa. I sprowadzę ich z powrotem, bo okażę im miłosierdzie. I będą takimi, jak gdybym ich nie odrzucił. Bo ja jestem JHWH, ich Bóg, i odpowiem im."
"Za10,7": "Ci z Efraima będą jak mocarz, ich serce rozweseli się tak jak po winie. Ich synowie to zobaczą i będą radośni, a ich serce rozraduje się w JHWH."
"Za10,8": "Zagwiżdżę na nich i zgromadzę ich, bo ich odkupiłem; i będą tak liczni, jak liczni byli wcześniej."
"Za10,9": "I rozsieję ich pośród ludów, by w dalekich krajach przypomnieli sobie o mnie; i będą żyli ze swoimi synami i powrócą ponownie."
"Za10,10": "I spowoduję, że powrócą ponownie z ziemi Egiptu i zgromadzę ich z Asyrii, wprowadzę ich do ziemi Gilead i do Libanu, i nie znajdzie się dla nich miejsca."
"Za10,11": "I przejdzie przez morze ucisku, i uderzy w fale morza i wyschną wszystkie głębie rzeki. I zstąpi na dół pycha Asyrii, a berło Egiptu zostanie usunięte."
"Za10,12": "Umocnię ich w JHWH i będą chodzić w Jego imieniu – oświadczenie JHWH."
