"Za10,1":
  text: "Proście JHWH o deszcz w późnej porze deszczowej, a JHWH stworzy chmury burzowe i da im ulewny deszcz i każdemu zieleń na polu."
  tags: []
"Za10,2":
  text: "Bo bożki głoszą niegodziwość, a wróżbici widzą kłamstwo i opowiadają bezwartościowe sny, pocieszają marnością. Dlatego oddalili się jak owce, są udręczeni, bo nie mają pasterza."
  tags: []
"Za10,3":
  text: "Przeciw tym pasterzom rozpalił się mój gniew – i nawiedzę kozły, bo JHWH Zastępów nawiedził swoją trzodę – dom Judy i uczyni z nich jakby swojego potężnego rumaka w boju."
  tags: []
"Za10,4":
  text: "Od Niego kamień węgielny, od Niego palik, od Niego łuk bojowy, od Niego wyjdzie każdy wódz – wszyscy razem."
  tags: []
"Za10,5":
  text: "I będą jak mocarze, wdeptujący wroga w błoto ulic w bitwie. I będą walczyć, bo JHWH jest z nimi; i zawstydzą się jeźdźcy na koniach."
  tags: []
"Za10,6":
  text: "I umocnię dom Judy, i wybawię dom Józefa. I sprowadzę ich z powrotem, bo okażę im miłosierdzie. I będą takimi, jak gdybym ich nie odrzucił. Bo ja jestem JHWH, ich Bóg, i odpowiem im."
  tags: []
"Za10,7":
  text: "Ci z Efraima będą jak mocarz, ich serce rozweseli się tak jak po winie. Ich synowie to zobaczą i będą radośni, a ich serce rozraduje się w JHWH."
  tags: []
"Za10,8":
  text: "Zagwiżdżę na nich i zgromadzę ich, bo ich odkupiłem; i będą tak liczni, jak liczni byli wcześniej."
  tags: []
"Za10,9":
  text: "I rozsieję ich pośród ludów, by w dalekich krajach przypomnieli sobie o mnie; i będą żyli ze swoimi synami i powrócą ponownie."
  tags: []
"Za10,10":
  text: "I spowoduję, że powrócą ponownie z ziemi Egiptu i zgromadzę ich z Asyrii, wprowadzę ich do ziemi Gilead i do Libanu, i nie znajdzie się dla nich miejsca."
  tags: []
"Za10,11":
  text: "I przejdzie przez morze ucisku, i uderzy w fale morza i wyschną wszystkie głębie rzeki. I zstąpi na dół pycha Asyrii, a berło Egiptu zostanie usunięte."
  tags: []
"Za10,12":
  text: "Umocnię ich w JHWH i będą chodzić w Jego imieniu – oświadczenie JHWH."
  tags: []
