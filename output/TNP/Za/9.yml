"Za9,1":
  text: "Brzemię Słowa JHWH. W ziemi Hadraku i Damaszku będzie miejsce Jego odpoczynku, gdyż ku JHWH skieruje się oko człowieka i wszystkie plemiona Izraela;"
  tags: []
"Za9,2":
  text: "A także Hamat wytyczy z nim granicę, Tyr i Sydon, bo jest bardzo mądry."
  tags: []
"Za9,3":
  text: "Bo Tyr zbudował dla siebie fortyfikację i nagromadził srebra jak prochu, a złota jak błota na ulicach."
  tags: []
"Za9,4":
  text: "Oto PAN weźmie go w posiadanie i wrzuci w morze jego potęgę, a on zostanie strawiony przez ogień."
  tags: []
"Za9,5":
  text: "Ujrzy to Aszkelon i ulęknie się, a Gaza – mocno skręcać się będzie z bólu i Ekron, bo zawstydzi się z powodu swojej nadziei. I zginie król z Gazy, a Aszkelon nie będzie zamieszkany."
  tags: []
"Za9,6":
  text: "I mieszaniec będzie mieszkał w Aszdodzie, i ukrócę pychę Filistynów."
  tags: []
"Za9,7":
  text: "I usunę jego krew z jego ust i jego obrzydliwości spomiędzy jego zębów. I także on zostanie pozostawiony dla naszego Boga, i będzie jak przyjaciel w Judzie, a Ekron jak Jebusyta."
  tags: []
"Za9,8":
  text: "I rozłożę obóz jako straż dla mojego domu przeciwko przechodzącemu i powracającemu tamtędy. I ponownie nie przejdzie przez nich ciemiężca. Bo teraz ujrzałem to moimi oczami."
  tags: []
"Za9,9":
  text: "Raduj się wielce, córko Syjonu! Wykrzykuj, córko Jerozolimy! Oto twój Król przychodzi do ciebie – sprawiedliwy i zwycięski. On jest pokorny i siedzi na ośle, na oślęciu, źrebięciu oślicy."
  tags: []
"Za9,10":
  text: "I zniszczę rydwan z Efraima i konia z Jerozolimy, i zostanie złamany łuk wojenny. I ogłosi on pokój narodom, a Jego władza będzie sięgać od morza do morza i od rzeki aż po krańce ziemi."
  tags: []
"Za9,11":
  text: "Również dzięki Tobie – przez krew przymierza z Tobą – wypuściłem Twoich więźniów z cysterny, w której nie ma wody."
  tags: []
"Za9,12":
  text: "Wróćcie do twierdzy, więźniowie, mający nadzieję. Już dzień dzisiejszy ogłasza, że wynagrodzę tobie w dwójnasób;"
  tags: []
"Za9,13":
  text: "Gdyż jak łuk naciągnę sobie Judę, nałożę nań Efraima jak strzałę; pobudzę twoich synów, Syjonie, przeciwko twoim synom, Jawanie, i uczynię z ciebie miecz mocarza."
  tags: []
"Za9,14":
  text: "A JHWH ukaże się nad nimi i jak błyskawica wyleci Jego strzała. JHWH PAN zadmie w róg i wyruszy w huraganach Temanu."
  tags: []
"Za9,15":
  text: "JHWH Zastępów będzie nad nimi obroną; pochłoną i podepczą kamienie procy. I będą spijać radość, i zapłoną tak jak po winie; i będą jej pełni jak czasza, jak rogi ołtarza."
  tags: []
"Za9,16":
  text: "W tym dniu JHWH, ich Bóg, wybawi ich jako trzodę swojego ludu. Bo jak drogocenne kamienie diademu będą błyszczeć nad Jego ziemią."
  tags: []
"Za9,17":
  text: "Doprawdy jakże wielkie jest Jego dobro! Jakież Jego piękno! Zboże młodzieńcom, a moszcz obrodzi dziewicom."
  tags: []
