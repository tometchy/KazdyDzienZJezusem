"2Kor6,1":
  text: "Jako współpracownicy wzywamy was, abyście na próżno nie przyjęli łaski Boga,"
  tags: []
"2Kor6,2":
  text: "Mówi bowiem: W czasie dogodnym wysłuchałem cię, a w dniu zbawienia pomogłem ci; oto teraz czas bardzo dogodny, oto teraz dzień zbawienia."
  tags: []
"2Kor6,3":
  text: "Nie dając w niczym żadnego zgorszenia, aby nie została zhańbiona nasza służba,"
  tags: []
"2Kor6,4":
  text: "Ale we wszystkim zalecając samych siebie, jako słudzy Boga, w wielkiej wytrwałości, w uciskach, w koniecznych potrzebach życiowych, w utrapieniach,"
  tags: []
"2Kor6,5":
  text: "W razach, w więzieniach, w rozruchach, w trudach, w czuwaniach, w postach,"
  tags: []
"2Kor6,6":
  text: "W czystości, w poznaniu, w cierpliwości, w łagodności, w Duchu Świętym, w miłości nieobłudnej,"
  tags: []
"2Kor6,7":
  text: "W Słowie prawdy, w mocy Bożej, z orężem sprawiedliwości w prawej i lewej ręce;"
  tags: []
"2Kor6,8":
  text: "Przez chwałę i hańbę, przez złą i dobrą sławę; jakby zwodziciele, a jednak prawdomówni;"
  tags: []
"2Kor6,9":
  text: "Jako nieznani, a jednak dobrze znani; jako umierający, a oto żyjemy; jako karani, a jednak nie zabici;"
  tags: []
"2Kor6,10":
  text: "Jako zasmucani, a jednak zawsze weseli; jako ubodzy, a jednak wielu wzbogacający; jako nic nie mający, a jednak wszystko posiadający."
  tags: []
"2Kor6,11":
  text: "Usta nasze otworzyły się do was, Koryntianie! Serce nasze jest rozszerzone."
  tags: []
"2Kor6,12":
  text: "Nie jesteście ściskani w nas, ale ciasnota jest w waszym wnętrzu."
  tags: []
"2Kor6,13":
  text: "A że należy się odwzajemniać, jak dzieciom mówię: Rozszerzcie się i wy."
  tags: []
"2Kor6,14":
  text: "Nie wprzęgajcie się w nierówne jarzmo z niewierzącymi; bo jakie jest zespalanie sprawiedliwości i nieprawości? A jaka wspólnota światłości z ciemnością?"
  tags: []
"2Kor6,15":
  text: "A jaka jest harmonia między Chrystusem i Belialem? Albo jaki dział ma wierzący z niewierzącym?"
  tags: []
"2Kor6,16":
  text: "A jakie jest porozumienie między świątynią Bożą a bożkami? Albowiem wy jesteście świątynią Boga żywego, jak powiedział Bóg: Zamieszkam w nich i będę się przechadzał pośród nich, i będę ich Bogiem, a oni będą moim ludem."
  tags: []
"2Kor6,17":
  text: "Dlatego wyjdźcie spośród nich i bądźcie odłączeni, mówi PAN, i nieczystego nie dotykajcie, a Ja was przyjmę."
  tags: []
"2Kor6,18":
  text: "I będę dla was Ojcem, a wy będziecie dla mnie synami i córkami, mówi PAN Wszechmogący."
  tags: []
