"2Kor6,1": "Jako współpracownicy wzywamy was, abyście na próżno nie przyjęli łaski Boga,"
"2Kor6,2": "Mówi bowiem: W czasie dogodnym wysłuchałem cię, a w dniu zbawienia pomogłem ci; oto teraz czas bardzo dogodny, oto teraz dzień zbawienia."
"2Kor6,3": "Nie dając w niczym żadnego zgorszenia, aby nie została zhańbiona nasza służba,"
"2Kor6,4": "Ale we wszystkim zalecając samych siebie, jako słudzy Boga, w wielkiej wytrwałości, w uciskach, w koniecznych potrzebach życiowych, w utrapieniach,"
"2Kor6,5": "W razach, w więzieniach, w rozruchach, w trudach, w czuwaniach, w postach,"
"2Kor6,6": "W czystości, w poznaniu, w cierpliwości, w łagodności, w Duchu Świętym, w miłości nieobłudnej,"
"2Kor6,7": "W Słowie prawdy, w mocy Bożej, z orężem sprawiedliwości w prawej i lewej ręce;"
"2Kor6,8": "Przez chwałę i hańbę, przez złą i dobrą sławę; jakby zwodziciele, a jednak prawdomówni;"
"2Kor6,9": "Jako nieznani, a jednak dobrze znani; jako umierający, a oto żyjemy; jako karani, a jednak nie zabici;"
"2Kor6,10": "Jako zasmucani, a jednak zawsze weseli; jako ubodzy, a jednak wielu wzbogacający; jako nic nie mający, a jednak wszystko posiadający."
"2Kor6,11": "Usta nasze otworzyły się do was, Koryntianie! Serce nasze jest rozszerzone."
"2Kor6,12": "Nie jesteście ściskani w nas, ale ciasnota jest w waszym wnętrzu."
"2Kor6,13": "A że należy się odwzajemniać, jak dzieciom mówię: Rozszerzcie się i wy."
"2Kor6,14": "Nie wprzęgajcie się w nierówne jarzmo z niewierzącymi; bo jakie jest zespalanie sprawiedliwości i nieprawości? A jaka wspólnota światłości z ciemnością?"
"2Kor6,15": "A jaka jest harmonia między Chrystusem i Belialem? Albo jaki dział ma wierzący z niewierzącym?"
"2Kor6,16": "A jakie jest porozumienie między świątynią Bożą a bożkami? Albowiem wy jesteście świątynią Boga żywego, jak powiedział Bóg: Zamieszkam w nich i będę się przechadzał pośród nich, i będę ich Bogiem, a oni będą moim ludem."
"2Kor6,17": "Dlatego wyjdźcie spośród nich i bądźcie odłączeni, mówi PAN, i nieczystego nie dotykajcie, a Ja was przyjmę."
"2Kor6,18": "I będę dla was Ojcem, a wy będziecie dla mnie synami i córkami, mówi PAN Wszechmogący."
