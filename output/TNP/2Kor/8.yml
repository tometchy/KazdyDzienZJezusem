"2Kor8,1":
  text: "A oznajmiamy wam, bracia, o łasce Boga udzielonej w zborach Macedonii,"
  tags: []
"2Kor8,2":
  text: "Że w wielkiej próbie ucisku, obfitość ich radości i skrajne ich ubóstwo zaobfitowało w bogactwie ich szczodrości."
  tags: []
"2Kor8,3":
  text: "Bo według możliwości – zaświadczam o tym – i nawet ponad możliwość, z własnej woli,"
  tags: []
"2Kor8,4":
  text: "Z wielkim naleganiem prosząc nas, abyśmy przyjęli ten dar i współudział w służbie względem świętych."
  tags: []
"2Kor8,5":
  text: "I nie tak, jak się spodziewaliśmy, ale najpierw samych siebie oddali Panu, a potem nam za wolą Bożą,"
  tags: []
"2Kor8,6":
  text: "Tak że prosiliśmy Tytusa, aby tak jak rozpoczął, tak i doprowadził do końca u was to dzieło łaski."
  tags: []
"2Kor8,7":
  text: "Ale tak jak we wszystkim obfitujecie wiarą i słowem, i poznaniem, i wszelką gorliwością, i tą miłością waszą do nas, tak abyście i w tym dziele łaski obfitowali."
  tags: []
"2Kor8,8":
  text: "Nie jako rozkaz to mówię, ale przez gorliwość innych chcę doświadczyć szczerość waszej miłości."
  tags: []
"2Kor8,9":
  text: "Znacie bowiem łaskę Pana naszego Jezusa Chrystusa, że dla was stał się ubogim, będąc bogatym, abyście wy Jego ubóstwem zostali wzbogaceni."
  tags: []
"2Kor8,10":
  text: "A taką daję wam radę; bo jest to korzystne dla was, którzy nie tylko zaczęliście to czynić, ale i już wcześniej, od ubiegłego roku wyraziliście ku temu chęć."
  tags: []
"2Kor8,11":
  text: "A teraz i to, co czynicie dokończcie, aby tak jak gotowość wyraziła się w chęci, tak też z tego co macie nastąpiło dokończenie."
  tags: []
"2Kor8,12":
  text: "Bo jeśli najpierw jest gotowość, to godna jest ona przyjęcia, według tego, co ma, a nie według tego, czego nie ma."
  tags: []
"2Kor8,13":
  text: "Nie chodzi bowiem o to, aby inni mieli ulgę, a wy ucisk, lecz aby było po równo, aby w obecnym czasie wasz nadmiar usłużył ich niedostatkowi,"
  tags: []
"2Kor8,14":
  text: "Aby też i ich nadmiar był pomocą dla waszego niedostatku, aby stała się równość,"
  tags: []
"2Kor8,15":
  text: "Tak jak jest napisane: Ten kto wiele zebrał, nie miał za wiele; a ten kto mało, nie miał za mało."
  tags: []
"2Kor8,16":
  text: "A Bogu niech będzie dziękczynienie, Temu, który wlewa taką gorliwość o was w serce Tytusa,"
  tags: []
"2Kor8,17":
  text: "Bo istotnie przyjął tę zachętę, i z tym większym zapałem dobrowolnie poszedł do was."
  tags: []
"2Kor8,18":
  text: "I posłaliśmy razem z nim brata, którego uznanie w Ewangelii jest znane przez wszystkie zbory."
  tags: []
"2Kor8,19":
  text: "A nie tylko to, ale został wybrany przez zbory za towarzysza naszej podróży razem z tym darem łaski, który przez nas służy ku chwale samego Pana i ku okazaniu waszej gotowości,"
  tags: []
"2Kor8,20":
  text: "Wystrzegając się tego, aby ktoś nie zganił nas z powodu obfitości sprawowanej przez nas służby."
  tags: []
"2Kor8,21":
  text: "Troszcząc się o to, co dobre nie tylko przed Panem, ale i przed ludźmi."
  tags: []
"2Kor8,22":
  text: "A posłaliśmy z nimi naszego brata, którego wypróbowaliśmy wielokrotnie w wielu sprawach, że jest gorliwy, a który teraz jest o wiele gorliwszym z powodu wielkiego zaufania do was."
  tags: []
"2Kor8,23":
  text: "Co do Tytusa, to jest on moim współtowarzyszem i współpracownikiem dla was; a co do naszych braci, są oni chwałą Chrystusa i wysłannikami zborów."
  tags: []
"2Kor8,24":
  text: "Okażcie więc dowody waszej miłości i naszej chluby z was przed obliczem zborów."
  tags: []
