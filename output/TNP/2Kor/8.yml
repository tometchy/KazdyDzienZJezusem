"2Kor8,1": "A oznajmiamy wam, bracia, o łasce Boga udzielonej w zborach Macedonii,"
"2Kor8,2": "Że w wielkiej próbie ucisku, obfitość ich radości i skrajne ich ubóstwo zaobfitowało w bogactwie ich szczodrości."
"2Kor8,3": "Bo według możliwości – zaświadczam o tym – i nawet ponad możliwość, z własnej woli,"
"2Kor8,4": "Z wielkim naleganiem prosząc nas, abyśmy przyjęli ten dar i współudział w służbie względem świętych."
"2Kor8,5": "I nie tak, jak się spodziewaliśmy, ale najpierw samych siebie oddali Panu, a potem nam za wolą Bożą,"
"2Kor8,6": "Tak że prosiliśmy Tytusa, aby tak jak rozpoczął, tak i doprowadził do końca u was to dzieło łaski."
"2Kor8,7": "Ale tak jak we wszystkim obfitujecie wiarą i słowem, i poznaniem, i wszelką gorliwością, i tą miłością waszą do nas, tak abyście i w tym dziele łaski obfitowali."
"2Kor8,8": "Nie jako rozkaz to mówię, ale przez gorliwość innych chcę doświadczyć szczerość waszej miłości."
"2Kor8,9": "Znacie bowiem łaskę Pana naszego Jezusa Chrystusa, że dla was stał się ubogim, będąc bogatym, abyście wy Jego ubóstwem zostali wzbogaceni."
"2Kor8,10": "A taką daję wam radę; bo jest to korzystne dla was, którzy nie tylko zaczęliście to czynić, ale i już wcześniej, od ubiegłego roku wyraziliście ku temu chęć."
"2Kor8,11": "A teraz i to, co czynicie dokończcie, aby tak jak gotowość wyraziła się w chęci, tak też z tego co macie nastąpiło dokończenie."
"2Kor8,12": "Bo jeśli najpierw jest gotowość, to godna jest ona przyjęcia, według tego, co ma, a nie według tego, czego nie ma."
"2Kor8,13": "Nie chodzi bowiem o to, aby inni mieli ulgę, a wy ucisk, lecz aby było po równo, aby w obecnym czasie wasz nadmiar usłużył ich niedostatkowi,"
"2Kor8,14": "Aby też i ich nadmiar był pomocą dla waszego niedostatku, aby stała się równość,"
"2Kor8,15": "Tak jak jest napisane: Ten kto wiele zebrał, nie miał za wiele; a ten kto mało, nie miał za mało."
"2Kor8,16": "A Bogu niech będzie dziękczynienie, Temu, który wlewa taką gorliwość o was w serce Tytusa,"
"2Kor8,17": "Bo istotnie przyjął tę zachętę, i z tym większym zapałem dobrowolnie poszedł do was."
"2Kor8,18": "I posłaliśmy razem z nim brata, którego uznanie w Ewangelii jest znane przez wszystkie zbory."
"2Kor8,19": "A nie tylko to, ale został wybrany przez zbory za towarzysza naszej podróży razem z tym darem łaski, który przez nas służy ku chwale samego Pana i ku okazaniu waszej gotowości,"
"2Kor8,20": "Wystrzegając się tego, aby ktoś nie zganił nas z powodu obfitości sprawowanej przez nas służby."
"2Kor8,21": "Troszcząc się o to, co dobre nie tylko przed Panem, ale i przed ludźmi."
"2Kor8,22": "A posłaliśmy z nimi naszego brata, którego wypróbowaliśmy wielokrotnie w wielu sprawach, że jest gorliwy, a który teraz jest o wiele gorliwszym z powodu wielkiego zaufania do was."
"2Kor8,23": "Co do Tytusa, to jest on moim współtowarzyszem i współpracownikiem dla was; a co do naszych braci, są oni chwałą Chrystusa i wysłannikami zborów."
"2Kor8,24": "Okażcie więc dowody waszej miłości i naszej chluby z was przed obliczem zborów."
