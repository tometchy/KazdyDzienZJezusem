"2Kor7,1": "Mając zatem te obietnice, umiłowani, oczyśćmy siebie od wszelkiej zmazy ciała i ducha, wypełniając uświęcenie nasze w bojaźni Boga."
"2Kor7,2": "Zróbcie dla nas miejsce, nikogo nie skrzywdziliśmy, nikogo nie zrujnowaliśmy, nikogo nie oszukaliśmy."
"2Kor7,3": "Nie mówię tego dla potępienia; bo wcześniej powiedziałem, że w naszych sercach jesteście na wspólną śmierć i wspólne życie."
"2Kor7,4": "Mam wielką śmiałość do was, mam wielką chlubę z was, jestem wypełniony zachętą, aż nazbyt obfituję radością w każdym naszym ucisku."
"2Kor7,5": "A gdy przyszliśmy do Macedonii, ciało nasze nie miewało żadnego wytchnienia, ale we wszystkim jesteśmy uciśnieni – na zewnątrz walki, a wewnątrz lęki."
"2Kor7,6": "Lecz Ten, który pociesza uniżonych, pocieszył nas przez przyjście Tytusa,"
"2Kor7,7": "A nie tylko przez jego przyjście, ale też przez pociechę, którą został u was pocieszony, oznajmiając nam o waszej tęsknocie, waszym płaczu i waszej gorliwości o mnie, tak że ja tym bardziej się rozradowałem."
"2Kor7,8": "Bo jeśli was zasmuciłem listem, nie żałuję tego, a jeśli żałowałem, to widzę oto, że list ten zasmucił was, chociaż na chwilę."
"2Kor7,9": "Teraz raduję się, nie że zostaliście zasmuceni, ale że zostaliście zasmuceni ku upamiętaniu; bo zostaliście zasmuceni według Boga, abyście w niczym przez nas nie doznali straty."
"2Kor7,10": "Ten bowiem smutek, który jest według Boga, sprawia upamiętanie ku zbawieniu, którego się nie żałuje; a smutek tego świata sprawia śmierć."
"2Kor7,11": "Oto bowiem samo to zasmucenie według Boga, jak wielką w was sprawiło gorliwość? Jaką obronę, jakie oburzenie, jaką bojaźń, jaką tęsknotę, jaki zapał, jaką potrzebę wymierzenia kary? We wszystkim okazaliście się czystymi w tej sprawie."
"2Kor7,12": "Zatem skoro napisałem do was, to nie ze względu na tego, kto czynił krzywdę, ani ze względu na tego, który został pokrzywdzony, ale ze względu na to, aby została ujawniona nasza gorliwość o was przed obliczem Boga."
"2Kor7,13": "Przez to jesteśmy zachęcani; a w tej waszej zachęcie tym bardziej radowaliśmy się z powodu radości Tytusa, bo jego duch jest pokrzepiony przez was wszystkich."
"2Kor7,14": "Bo jeśli chlubiłem się jemu czymś o was, nie zostałem zawstydzony; ale jak wszystko mówiliśmy wam w prawdzie, tak też i chluba nasza przed Tytusem okazała się prawdą."
"2Kor7,15": "A jego głębokie uczucia wobec was są tym obfitsze, gdy przypomina sobie posłuszeństwo was wszystkich i jak go z bojaźnią i z drżeniem przyjęliście."
"2Kor7,16": "Raduję się więc, że we wszystkim mogę wam ufać."
