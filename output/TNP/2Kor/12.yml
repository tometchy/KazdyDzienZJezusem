"2Kor12,1": "Chlubić się zatem nie jest dla mnie pożyteczne; przejdę bowiem do widzeń i objawień Pana."
"2Kor12,2": "Znam człowieka w Chrystusie, który przed czternastu laty – czy w ciele, nie wiem, czy poza ciałem, nie wiem, Bóg wie – ten to, porwany został aż do trzeciego nieba."
"2Kor12,3": "I znam takiego człowieka – czy w ciele, czy poza ciałem, nie wiem, Bóg wie –"
"2Kor12,4": "Został porwany do raju i słyszał niewypowiedziane słowa, których człowiekowi nie wolno wypowiedzieć."
"2Kor12,5": "Z takiego będę się chlubić; ale z samego siebie chlubić się nie będę, chyba tylko ze swoich słabości."
"2Kor12,6": "Jeśli bowiem chciałbym się chlubić, nie będę głupi, będę bowiem mówił prawdę, ale wstrzymuję się, aby ktoś nie myślał o mnie ponad to, co widzi we mnie lub co ode mnie słyszy."
"2Kor12,7": "Abym nie wynosił się z nadzwyczajności objawień, został mi dany kolec w ciało – posłaniec szatana, aby mnie policzkował, abym nie wynosił się ponad miarę."
"2Kor12,8": "W tej sprawie trzykrotnie poprosiłem Pana, aby to odstąpiło ode mnie."
"2Kor12,9": "I powiedział mi: Wystarczy ci moja łaska; bowiem moja moc jest doskonalona w słabości. Więc raczej najchętniej będę się chlubił ze swoich słabości, aby we mnie zamieszkała moc Chrystusa."
"2Kor12,10": "Dlatego mam upodobanie w słabościach, w zniewagach, w potrzebach, w prześladowaniach, w uciskach dla Chrystusa; bo gdy jestem słaby, wtedy jestem mocny."
"2Kor12,11": "Stałem się głupi, chlubiąc się; wy mnie do tego zmusiliście. Ja bowiem powinienem być przez was polecany, bo w niczym nie ustępowałem owym bardzo wielkim apostołom, chociaż jestem niczym."
"2Kor12,12": "Jednak prawdziwie znaki apostoła okazały się wśród was w całej wytrwałości, w znakach, i w cudach, i mocach."
"2Kor12,13": "Czy bowiem jest coś, w czym okazaliście się gorsi od pozostałych zborów, chyba tylko w tym, że ja sam nie byłem wam ciężarem? Darujcie mi tę niesprawiedliwość."
"2Kor12,14": "Oto po raz trzeci jestem gotowy przyjść do was i nie będę wam ciężarem; albowiem nie szukam tego, co wasze, ale was samych; nie dzieci bowiem winny gromadzić zapasy dla rodziców, ale rodzice dla dzieci."
"2Kor12,15": "Lecz ja z największą przyjemnością będę ponosił wydatki i wyczerpię się zupełnie dla waszych dusz, chociaż im więcej was miłuję, tym mniej jestem przez was miłowany."
"2Kor12,16": "Ale niech i tak będzie, ja was nie obciążyłem, tylko będąc przebiegłym, wziąłem was podstępem."
"2Kor12,17": "Czy przez kogoś z tych, których do was wysłałem, oszukałem was?"
"2Kor12,18": "Prosiłem Tytusa i posłałem z nim brata. Czy Tytus w czymś was oszukał? Czy nie postępowaliśmy w tym samym duchu? Czy nie chodziliśmy tymi samymi śladami?"
"2Kor12,19": "Czy znowu wydaje się wam, że usprawiedliwiamy się przed wami? Przed obliczem Boga mówimy w Chrystusie, a wszystko to, umiłowani, dla waszego zbudowania."
"2Kor12,20": "Boję się bowiem, gdy przyjdę, abym nie znalazł was czasem takimi, jakimi nie chcę, bym i ja nie został znaleziony przez was takim, jakim nie chcecie; by czasem między wami nie było kłótni, zazdrości, wybuchów gniewu, intryg, plotek, obmawiania, nadymania się i nieporządków;"
"2Kor12,21": "Aby, gdy ponownie przyjdę, nie poniżył mnie Bóg mój u was i będę wielce opłakiwał tych, którzy wcześniej zgrzeszyli i nie okazali żalu nad popełnioną nieczystością, nierządem i rozwiązłością, które uczynili."
