"2Kor12,1":
  text: "Chlubić się zatem nie jest dla mnie pożyteczne; przejdę bowiem do widzeń i objawień Pana."
  tags: []
"2Kor12,2":
  text: "Znam człowieka w Chrystusie, który przed czternastu laty – czy w ciele, nie wiem, czy poza ciałem, nie wiem, Bóg wie – ten to, porwany został aż do trzeciego nieba."
  tags: []
"2Kor12,3":
  text: "I znam takiego człowieka – czy w ciele, czy poza ciałem, nie wiem, Bóg wie –"
  tags: []
"2Kor12,4":
  text: "Został porwany do raju i słyszał niewypowiedziane słowa, których człowiekowi nie wolno wypowiedzieć."
  tags: []
"2Kor12,5":
  text: "Z takiego będę się chlubić; ale z samego siebie chlubić się nie będę, chyba tylko ze swoich słabości."
  tags: []
"2Kor12,6":
  text: "Jeśli bowiem chciałbym się chlubić, nie będę głupi, będę bowiem mówił prawdę, ale wstrzymuję się, aby ktoś nie myślał o mnie ponad to, co widzi we mnie lub co ode mnie słyszy."
  tags: []
"2Kor12,7":
  text: "Abym nie wynosił się z nadzwyczajności objawień, został mi dany kolec w ciało – posłaniec szatana, aby mnie policzkował, abym nie wynosił się ponad miarę."
  tags: []
"2Kor12,8":
  text: "W tej sprawie trzykrotnie poprosiłem Pana, aby to odstąpiło ode mnie."
  tags: []
"2Kor12,9":
  text: "I powiedział mi: Wystarczy ci moja łaska; bowiem moja moc jest doskonalona w słabości. Więc raczej najchętniej będę się chlubił ze swoich słabości, aby we mnie zamieszkała moc Chrystusa."
  tags: []
"2Kor12,10":
  text: "Dlatego mam upodobanie w słabościach, w zniewagach, w potrzebach, w prześladowaniach, w uciskach dla Chrystusa; bo gdy jestem słaby, wtedy jestem mocny."
  tags: []
"2Kor12,11":
  text: "Stałem się głupi, chlubiąc się; wy mnie do tego zmusiliście. Ja bowiem powinienem być przez was polecany, bo w niczym nie ustępowałem owym bardzo wielkim apostołom, chociaż jestem niczym."
  tags: []
"2Kor12,12":
  text: "Jednak prawdziwie znaki apostoła okazały się wśród was w całej wytrwałości, w znakach, i w cudach, i mocach."
  tags: []
"2Kor12,13":
  text: "Czy bowiem jest coś, w czym okazaliście się gorsi od pozostałych zborów, chyba tylko w tym, że ja sam nie byłem wam ciężarem? Darujcie mi tę niesprawiedliwość."
  tags: []
"2Kor12,14":
  text: "Oto po raz trzeci jestem gotowy przyjść do was i nie będę wam ciężarem; albowiem nie szukam tego, co wasze, ale was samych; nie dzieci bowiem winny gromadzić zapasy dla rodziców, ale rodzice dla dzieci."
  tags: []
"2Kor12,15":
  text: "Lecz ja z największą przyjemnością będę ponosił wydatki i wyczerpię się zupełnie dla waszych dusz, chociaż im więcej was miłuję, tym mniej jestem przez was miłowany."
  tags: []
"2Kor12,16":
  text: "Ale niech i tak będzie, ja was nie obciążyłem, tylko będąc przebiegłym, wziąłem was podstępem."
  tags: []
"2Kor12,17":
  text: "Czy przez kogoś z tych, których do was wysłałem, oszukałem was?"
  tags: []
"2Kor12,18":
  text: "Prosiłem Tytusa i posłałem z nim brata. Czy Tytus w czymś was oszukał? Czy nie postępowaliśmy w tym samym duchu? Czy nie chodziliśmy tymi samymi śladami?"
  tags: []
"2Kor12,19":
  text: "Czy znowu wydaje się wam, że usprawiedliwiamy się przed wami? Przed obliczem Boga mówimy w Chrystusie, a wszystko to, umiłowani, dla waszego zbudowania."
  tags: []
"2Kor12,20":
  text: "Boję się bowiem, gdy przyjdę, abym nie znalazł was czasem takimi, jakimi nie chcę, bym i ja nie został znaleziony przez was takim, jakim nie chcecie; by czasem między wami nie było kłótni, zazdrości, wybuchów gniewu, intryg, plotek, obmawiania, nadymania się i nieporządków;"
  tags: []
"2Kor12,21":
  text: "Aby, gdy ponownie przyjdę, nie poniżył mnie Bóg mój u was i będę wielce opłakiwał tych, którzy wcześniej zgrzeszyli i nie okazali żalu nad popełnioną nieczystością, nierządem i rozwiązłością, które uczynili."
  tags: []
