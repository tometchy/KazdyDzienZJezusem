"2Kor3,1":
  text: "Czy zaczynamy ponownie polecać samych siebie? Czy potrzebujemy, jak niektórzy, listów polecających do was albo polecających od was?"
  tags: []
"2Kor3,2":
  text: "Listem naszym wy jesteście, napisanym w sercach naszych, który jest znany i czytany przez wszystkich ludzi;"
  tags: []
"2Kor3,3":
  text: "Gdyż jawne jest im to, że jesteście listem Chrystusa, sporządzonym przez naszą służbę, który jest napisany nie atramentem, ale Duchem Boga żywego, nie na tablicach kamiennych, lecz na mięsistych tablicach serca."
  tags: []
"2Kor3,4":
  text: "A taką ufność mamy przez Chrystusa względem Boga;"
  tags: []
"2Kor3,5":
  text: "Nie, że jesteśmy zdolni pomyśleć coś sami z siebie, jakby sami z siebie, lecz zdolność nasza jest z Boga;"
  tags: []
"2Kor3,6":
  text: "Który też uzdolnił nas do bycia sługami nowego przymierza, nie litery, ale ducha; bo litera zabija, a duch ożywia."
  tags: []
"2Kor3,7":
  text: "Bo jeśli służba śmierci, wyryta literami na tablicach kamiennych, zaistniała w chwale, tak że synowie Izraela nie mogli patrzeć na oblicze Mojżesza z powodu przemijającej chwały jego oblicza,"
  tags: []
"2Kor3,8":
  text: "To czyż nie bardziej służba ducha będzie w chwale?"
  tags: []
"2Kor3,9":
  text: "Bo jeśli w służbie potępienia jest chwała, daleko więcej obfituje w chwale służba sprawiedliwości."
  tags: []
"2Kor3,10":
  text: "W tej części bowiem, nie jest obdarzone chwałą to, co jest obdarzone z powodu przewyższającej chwały."
  tags: []
"2Kor3,11":
  text: "Jeśli bowiem to, co przemija, zaistniało za sprawą chwały, tym bardziej jest w chwale to, co trwa."
  tags: []
"2Kor3,12":
  text: "Mając więc taką nadzieję, postępujemy z wielką śmiałością."
  tags: []
"2Kor3,13":
  text: "A nie tak, jak Mojżesz, który kładł zasłonę na swoje oblicze, aby synowie Izraela nie patrzyli na koniec tego, co przemija;"
  tags: []
"2Kor3,14":
  text: "Ale skamieniały ich umysły; aż do dzisiaj bowiem, gdy odczytują stare przymierze ta sama zasłona pozostaje nieodsłonięta, a która w Chrystusie jest usuwana;"
  tags: []
"2Kor3,15":
  text: "Ale aż do dzisiaj, ilekroć czytany jest Mojżesz, zasłona leży na ich sercu."
  tags: []
"2Kor3,16":
  text: "Skoro tylko ich serce zwróciłoby się do Pana, zasłona jest usuwana."
  tags: []
"2Kor3,17":
  text: "A Pan jest Duchem; a gdzie Duch Pana, tam wolność."
  tags: []
"2Kor3,18":
  text: "My wszyscy natomiast, których oblicze jest odkryte, odzwierciedlając sobą chwałę Pana, na ten sam obraz jesteśmy przemieniani z chwały w chwałę, tak, jak to sprawia Duch Pana."
  tags: []
