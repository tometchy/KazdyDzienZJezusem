"2Kor11,1":
  text: "Obyście mogli znosić odrobinę mojej głupoty! Ale znoście także i mnie."
  tags: []
"2Kor11,2":
  text: "Albowiem zazdrosny jestem o was zazdrością Bożą; bo zaręczyłem was z jednym mężem, aby postawić przy Chrystusie czystą dziewicę."
  tags: []
"2Kor11,3":
  text: "Boję się jednak, by w jakiś sposób, tak jak wąż zwiódł Ewę swoją przebiegłością, tak też wasze myśli nie zostały skażone, odpadając od prostoty w Chrystusie."
  tags: []
"2Kor11,4":
  text: "Bo jeśli oto ktoś przychodzi i głosi innego Jezusa, którego my nie ogłosiliśmy, albo jeśli bierzecie innego ducha, którego nie otrzymaliście, albo inną ewangelię, której nie przyjęliście, dobrze to znosiliście."
  tags: []
"2Kor11,5":
  text: "Bo uważam, że w niczym nie jestem gorszy niż owi bardzo wielcy apostołowie."
  tags: []
"2Kor11,6":
  text: "Jeśli więc jestem prostakiem w słowie, to nie w poznaniu; lecz we wszystkim staliśmy się całkowicie jawni wszystkim wam."
  tags: []
"2Kor11,7":
  text: "Czy popełniłem grzech, poniżając samego siebie, abyście wy zostali wywyższeni, że za darmo ogłosiłem wam jako dobrą nowinę Ewangelię Boga?"
  tags: []
"2Kor11,8":
  text: "Złupiłem inne zbory, gdy wziąłem od nich żołd, aby wam służyć;"
  tags: []
"2Kor11,9":
  text: "A będąc obecny u was, i znajdując się w niedostatku, nikogo nie obciążyłem; bo mój brak uzupełnili bracia, którzy przyszli z Macedonii i w tym wszystkim ustrzegłem samego siebie, by nie być dla was ciężarem i nadal będę się strzec."
  tags: []
"2Kor11,10":
  text: "Jest we mnie prawda Chrystusa, że w regionie Achai, ta chluba, która jest we mnie nie zostanie zatrzymana."
  tags: []
"2Kor11,11":
  text: "Dlaczego? Że was nie miłuję? Bóg to wie."
  tags: []
"2Kor11,12":
  text: "Ale co czynię, to i będę czynić, aby odciąć sposobność tym, którzy szukają tej sposobności, aby w tym, w czym się chlubią, zostali znalezieni takimi jak my."
  tags: []
"2Kor11,13":
  text: "Bowiem tacy fałszywi apostołowie, zdradliwi pracownicy, zmieniają swą postać na apostołów Chrystusa."
  tags: []
"2Kor11,14":
  text: "I nie ma w tym nic dziwnego, bo sam szatan zmienia swą postać na anioła światłości."
  tags: []
"2Kor11,15":
  text: "Nic więc wielkiego, jeśli i słudzy jego są zmieniani na postać jakby sług sprawiedliwości – ich koniec będzie zgodny z ich czynami."
  tags: []
"2Kor11,16":
  text: "Ponownie mówię: Niech nikt nie uważa mnie za głupiego; a jeśli nawet, to przyjmijcie mnie, jak głupiego, abym i ja mógł się odrobinę chlubić."
  tags: []
"2Kor11,17":
  text: "To, co mówię, nie mówię zgodnie z myślą Pana, ale jakby w przystępie głupoty – w tej podstawie chluby."
  tags: []
"2Kor11,18":
  text: "Skoro liczni chlubią się według ciała i ja będę się chlubić."
  tags: []
"2Kor11,19":
  text: "Bo chętnie znosicie głupich, sami będąc mądrymi."
  tags: []
"2Kor11,20":
  text: "Bowiem znosicie to, gdy was ktoś zniewala, gdy ktoś objada, gdy ktoś bierze, co wasze, gdy się ktoś wynosi, gdy ktoś was uderza w twarz."
  tags: []
"2Kor11,21":
  text: "Ze wstydem to mówię, jako że w tym my byliśmy słabi; a jeśli ktoś jest w czymś ośmielony – w głupocie to mówię – i ja się ośmielam."
  tags: []
"2Kor11,22":
  text: "Hebrajczykami są? I ja także. Izraelitami są? I ja także. Potomstwem są Abrahama? I ja także."
  tags: []
"2Kor11,23":
  text: "Sługami są Chrystusa? Jako obłąkany to mówię: Ja bardziej; bardziej niż inni w trudach, ponad miarę w chłostach, częściej od innych w więzieniach, częstokroć w bliskości śmierci."
  tags: []
"2Kor11,24":
  text: "Od Żydów otrzymałem pięć razy po czterdzieści uderzeń bez jednego,"
  tags: []
"2Kor11,25":
  text: "Trzy razy byłem bity rózgami, raz zostałem ukamienowany, trzykrotnie rozbił się ze mną okręt, dzień i noc przeżyłem w głębinie morskiej,"
  tags: []
"2Kor11,26":
  text: "Często w podróżach, w niebezpieczeństwach na rzekach, w niebezpieczeństwach od rozbójników, w niebezpieczeństwach od współrodaków, w niebezpieczeństwach od pogan, w niebezpieczeństwach w mieście, w niebezpieczeństwach na pustyni, w niebezpieczeństwach na morzu, w niebezpieczeństwach wśród fałszywych braci,"
  tags: []
"2Kor11,27":
  text: "W trudzie i w znoju, często w bezsennych nocach, w głodzie i pragnieniu, często w postach, w zimnie i w nagości,"
  tags: []
"2Kor11,28":
  text: "Niezależnie od tych zewnętrznych nacisków, pozostaje mi codzienna troska o wszystkie zbory."
  tags: []
"2Kor11,29":
  text: "Ktoś jest słaby, to czy ja nie jestem słaby? Ktoś jest zgorszony, to czy ja nie płonę?"
  tags: []
"2Kor11,30":
  text: "Jeśli konieczne jest bym się chlubił, będę się chlubić moją słabością."
  tags: []
"2Kor11,31":
  text: "Bóg i Ojciec Pana naszego Jezusa Chrystusa, który jest błogosławiony na wieki, wie, że nie kłamię."
  tags: []
"2Kor11,32":
  text: "W Damaszku etnarcha króla Aretasa strzegł miasta Damasceńczyków, chcąc mnie pojmać;"
  tags: []
"2Kor11,33":
  text: "Ale przez otwór, w koszu, zostałem spuszczony przez mur i uciekłem z jego rąk."
  tags: []
