"2Kor11,1": "Obyście mogli znosić odrobinę mojej głupoty! Ale znoście także i mnie."
"2Kor11,2": "Albowiem zazdrosny jestem o was zazdrością Bożą; bo zaręczyłem was z jednym mężem, aby postawić przy Chrystusie czystą dziewicę."
"2Kor11,3": "Boję się jednak, by w jakiś sposób, tak jak wąż zwiódł Ewę swoją przebiegłością, tak też wasze myśli nie zostały skażone, odpadając od prostoty w Chrystusie."
"2Kor11,4": "Bo jeśli oto ktoś przychodzi i głosi innego Jezusa, którego my nie ogłosiliśmy, albo jeśli bierzecie innego ducha, którego nie otrzymaliście, albo inną ewangelię, której nie przyjęliście, dobrze to znosiliście."
"2Kor11,5": "Bo uważam, że w niczym nie jestem gorszy niż owi bardzo wielcy apostołowie."
"2Kor11,6": "Jeśli więc jestem prostakiem w słowie, to nie w poznaniu; lecz we wszystkim staliśmy się całkowicie jawni wszystkim wam."
"2Kor11,7": "Czy popełniłem grzech, poniżając samego siebie, abyście wy zostali wywyższeni, że za darmo ogłosiłem wam jako dobrą nowinę Ewangelię Boga?"
"2Kor11,8": "Złupiłem inne zbory, gdy wziąłem od nich żołd, aby wam służyć;"
"2Kor11,9": "A będąc obecny u was, i znajdując się w niedostatku, nikogo nie obciążyłem; bo mój brak uzupełnili bracia, którzy przyszli z Macedonii i w tym wszystkim ustrzegłem samego siebie, by nie być dla was ciężarem i nadal będę się strzec."
"2Kor11,10": "Jest we mnie prawda Chrystusa, że w regionie Achai, ta chluba, która jest we mnie nie zostanie zatrzymana."
"2Kor11,11": "Dlaczego? Że was nie miłuję? Bóg to wie."
"2Kor11,12": "Ale co czynię, to i będę czynić, aby odciąć sposobność tym, którzy szukają tej sposobności, aby w tym, w czym się chlubią, zostali znalezieni takimi jak my."
"2Kor11,13": "Bowiem tacy fałszywi apostołowie, zdradliwi pracownicy, zmieniają swą postać na apostołów Chrystusa."
"2Kor11,14": "I nie ma w tym nic dziwnego, bo sam szatan zmienia swą postać na anioła światłości."
"2Kor11,15": "Nic więc wielkiego, jeśli i słudzy jego są zmieniani na postać jakby sług sprawiedliwości – ich koniec będzie zgodny z ich czynami."
"2Kor11,16": "Ponownie mówię: Niech nikt nie uważa mnie za głupiego; a jeśli nawet, to przyjmijcie mnie, jak głupiego, abym i ja mógł się odrobinę chlubić."
"2Kor11,17": "To, co mówię, nie mówię zgodnie z myślą Pana, ale jakby w przystępie głupoty – w tej podstawie chluby."
"2Kor11,18": "Skoro liczni chlubią się według ciała i ja będę się chlubić."
"2Kor11,19": "Bo chętnie znosicie głupich, sami będąc mądrymi."
"2Kor11,20": "Bowiem znosicie to, gdy was ktoś zniewala, gdy ktoś objada, gdy ktoś bierze, co wasze, gdy się ktoś wynosi, gdy ktoś was uderza w twarz."
"2Kor11,21": "Ze wstydem to mówię, jako że w tym my byliśmy słabi; a jeśli ktoś jest w czymś ośmielony – w głupocie to mówię – i ja się ośmielam."
"2Kor11,22": "Hebrajczykami są? I ja także. Izraelitami są? I ja także. Potomstwem są Abrahama? I ja także."
"2Kor11,23": "Sługami są Chrystusa? Jako obłąkany to mówię: Ja bardziej; bardziej niż inni w trudach, ponad miarę w chłostach, częściej od innych w więzieniach, częstokroć w bliskości śmierci."
"2Kor11,24": "Od Żydów otrzymałem pięć razy po czterdzieści uderzeń bez jednego,"
"2Kor11,25": "Trzy razy byłem bity rózgami, raz zostałem ukamienowany, trzykrotnie rozbił się ze mną okręt, dzień i noc przeżyłem w głębinie morskiej,"
"2Kor11,26": "Często w podróżach, w niebezpieczeństwach na rzekach, w niebezpieczeństwach od rozbójników, w niebezpieczeństwach od współrodaków, w niebezpieczeństwach od pogan, w niebezpieczeństwach w mieście, w niebezpieczeństwach na pustyni, w niebezpieczeństwach na morzu, w niebezpieczeństwach wśród fałszywych braci,"
"2Kor11,27": "W trudzie i w znoju, często w bezsennych nocach, w głodzie i pragnieniu, często w postach, w zimnie i w nagości,"
"2Kor11,28": "Niezależnie od tych zewnętrznych nacisków, pozostaje mi codzienna troska o wszystkie zbory."
"2Kor11,29": "Ktoś jest słaby, to czy ja nie jestem słaby? Ktoś jest zgorszony, to czy ja nie płonę?"
"2Kor11,30": "Jeśli konieczne jest bym się chlubił, będę się chlubić moją słabością."
"2Kor11,31": "Bóg i Ojciec Pana naszego Jezusa Chrystusa, który jest błogosławiony na wieki, wie, że nie kłamię."
"2Kor11,32": "W Damaszku etnarcha króla Aretasa strzegł miasta Damasceńczyków, chcąc mnie pojmać;"
"2Kor11,33": "Ale przez otwór, w koszu, zostałem spuszczony przez mur i uciekłem z jego rąk."
