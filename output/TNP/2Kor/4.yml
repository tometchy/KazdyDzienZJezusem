"2Kor4,1": "Dlatego mając tę służbę według miłosierdzia, którego dostąpiliśmy, nie upadamy na duchu."
"2Kor4,2": "Ale wyrzekliśmy się ukrytych spraw hańbiących i nie postępujemy w chytrości, ani nie fałszujemy Słowa Bożego; ale przez ukazanie prawdy polecamy samych siebie sumieniu każdego człowieka przed obliczem Boga."
"2Kor4,3": "A jeśli nasza Ewangelia jest zakryta, to jest zakryta wśród tych, którzy giną."
"2Kor4,4": "Dla niewierzących, którym bóg tego wieku zaślepił myśli, aby nie świeciła im światłość Ewangelii chwały Chrystusa, który jest obrazem Boga."
"2Kor4,5": "Nie głosimy bowiem samych siebie, ale Chrystusa Jezusa jako Pana, a samych siebie jako niewolników waszych ze względu na Jezusa,"
"2Kor4,6": "Ponieważ Bóg, który powiedział: Z ciemności niech zajaśnieje światłość, jest Tym, który zajaśniał w naszych sercach dla oświetlenia poznania chwały Boga na obliczu Jezusa Chrystusa."
"2Kor4,7": "Mamy natomiast ten skarb w naczyniach glinianych, aby wielka obfitość mocy była z Boga, a nie z nas,"
"2Kor4,8": "We wszystkim uciskani, ale nie przytłaczani; w niepewności, ale nie w rozpaczy;"
"2Kor4,9": "Prześladowani, ale nie opuszczani; powaleni, ale nie pokonywani;"
"2Kor4,10": "Zawsze nosząc na ciele śmierć Pana Jezusa, aby i życie Jezusa zostało ujawnione na naszym ciele."
"2Kor4,11": "Zawsze bowiem my, którzy żyjemy, jesteśmy wydawani na śmierć z powodu Jezusa, aby też życie Jezusa zostało ujawnione w śmiertelnym ciele naszym."
"2Kor4,12": "Tak że śmierć prawdziwie działa w nas, a życie w was."
"2Kor4,13": "Mając więc tego samego ducha wiary, według tego, co jest napisane: Uwierzyłem, dlatego też przemówiłem i my wierzymy, dlatego też mówimy,"
"2Kor4,14": "Wiedząc, że Ten, który wzbudził Pana Jezusa i nas wzbudzi przez Jezusa, i postawi razem z wami przed sobą."
"2Kor4,15": "To wszystko bowiem jest dla was, aby łaska obfitująca ze względu na wielu, zaobfitowała w dziękczynienie ku chwale Bożej."
"2Kor4,16": "Dlatego nie upadamy na duchu; ale chociaż nasz zewnętrzny człowiek jest niszczony, jednak ten wewnętrzny jest odnawiany z dnia na dzień."
"2Kor4,17": "Gdyż nasz chwilowy, lekki ucisk sprawia nam w coraz większej mierze obfitość wiecznej chwały,"
"2Kor4,18": "Nam, którzy nie patrzymy na to, co widzialne, ale na niewidzialne; albowiem to, co widzialne, jest chwilowe, a niewidzialne wieczne."
