"2Kor4,1":
  text: "Dlatego mając tę służbę według miłosierdzia, którego dostąpiliśmy, nie upadamy na duchu."
  tags: []
"2Kor4,2":
  text: "Ale wyrzekliśmy się ukrytych spraw hańbiących i nie postępujemy w chytrości, ani nie fałszujemy Słowa Bożego; ale przez ukazanie prawdy polecamy samych siebie sumieniu każdego człowieka przed obliczem Boga."
  tags: []
"2Kor4,3":
  text: "A jeśli nasza Ewangelia jest zakryta, to jest zakryta wśród tych, którzy giną."
  tags: []
"2Kor4,4":
  text: "Dla niewierzących, którym bóg tego wieku zaślepił myśli, aby nie świeciła im światłość Ewangelii chwały Chrystusa, który jest obrazem Boga."
  tags: []
"2Kor4,5":
  text: "Nie głosimy bowiem samych siebie, ale Chrystusa Jezusa jako Pana, a samych siebie jako niewolników waszych ze względu na Jezusa,"
  tags: []
"2Kor4,6":
  text: "Ponieważ Bóg, który powiedział: Z ciemności niech zajaśnieje światłość, jest Tym, który zajaśniał w naszych sercach dla oświetlenia poznania chwały Boga na obliczu Jezusa Chrystusa."
  tags: []
"2Kor4,7":
  text: "Mamy natomiast ten skarb w naczyniach glinianych, aby wielka obfitość mocy była z Boga, a nie z nas,"
  tags: []
"2Kor4,8":
  text: "We wszystkim uciskani, ale nie przytłaczani; w niepewności, ale nie w rozpaczy;"
  tags: []
"2Kor4,9":
  text: "Prześladowani, ale nie opuszczani; powaleni, ale nie pokonywani;"
  tags: []
"2Kor4,10":
  text: "Zawsze nosząc na ciele śmierć Pana Jezusa, aby i życie Jezusa zostało ujawnione na naszym ciele."
  tags: []
"2Kor4,11":
  text: "Zawsze bowiem my, którzy żyjemy, jesteśmy wydawani na śmierć z powodu Jezusa, aby też życie Jezusa zostało ujawnione w śmiertelnym ciele naszym."
  tags: []
"2Kor4,12":
  text: "Tak że śmierć prawdziwie działa w nas, a życie w was."
  tags: []
"2Kor4,13":
  text: "Mając więc tego samego ducha wiary, według tego, co jest napisane: Uwierzyłem, dlatego też przemówiłem i my wierzymy, dlatego też mówimy,"
  tags: []
"2Kor4,14":
  text: "Wiedząc, że Ten, który wzbudził Pana Jezusa i nas wzbudzi przez Jezusa, i postawi razem z wami przed sobą."
  tags: []
"2Kor4,15":
  text: "To wszystko bowiem jest dla was, aby łaska obfitująca ze względu na wielu, zaobfitowała w dziękczynienie ku chwale Bożej."
  tags: []
"2Kor4,16":
  text: "Dlatego nie upadamy na duchu; ale chociaż nasz zewnętrzny człowiek jest niszczony, jednak ten wewnętrzny jest odnawiany z dnia na dzień."
  tags: []
"2Kor4,17":
  text: "Gdyż nasz chwilowy, lekki ucisk sprawia nam w coraz większej mierze obfitość wiecznej chwały,"
  tags: []
"2Kor4,18":
  text: "Nam, którzy nie patrzymy na to, co widzialne, ale na niewidzialne; albowiem to, co widzialne, jest chwilowe, a niewidzialne wieczne."
  tags: []
