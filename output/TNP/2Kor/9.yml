"2Kor9,1":
  text: "Lecz o służbie dla świętych nie muszę wam zbyt dużo pisać."
  tags: []
"2Kor9,2":
  text: "Bo znam waszą gotowość, z powodu której chlubię się wami przed Macedończykami, że Achaja jest już gotowa od roku; a żarliwość wasza pobudziła wielu z nich."
  tags: []
"2Kor9,3":
  text: "Posłałem więc tych braci, aby chluba nasza z was w tej mierze nie okazała się daremna, abyście – jak powiedziałem – byli przygotowani;"
  tags: []
"2Kor9,4":
  text: "Abyśmy czasem, gdyby przyszli ze mną Macedończycy i znaleźli was nieprzygotowanych, nie zostali zawstydzeni – aby nie powiedzieć – że raczej wy, na podstawie tej chluby."
  tags: []
"2Kor9,5":
  text: "Uznałem za konieczne zachęcić tych braci, aby do was wcześniej poszli i przygotowali zapowiedziany wcześniej wasz hojny dar, aby był on gotowy jako wyraz hojności, a nie jako przejaw skąpstwa."
  tags: []
"2Kor9,6":
  text: "To natomiast sądzę: Kto skąpo sieje, skąpo też będzie żąć; a kto sieje hojnie, będzie też hojnie żąć."
  tags: []
"2Kor9,7":
  text: "Każdy, tak jak postanawia w sercu, nie z żalem i nie z przymusu; bo radosnego dawcę Bóg miłuje."
  tags: []
"2Kor9,8":
  text: "A Bóg jest mocny obficie wam udzielić wszelkiej łaski, abyście we wszystkim zawsze mając wszystko wystarczająco, obfitowali w każdym dobrym czynie,"
  tags: []
"2Kor9,9":
  text: "Jak jest napisane: Rozproszył, dał ubogim, sprawiedliwość Jego trwa na wieki."
  tags: []
"2Kor9,10":
  text: "A ten, który zaopatruje siejącego w ziarno i w chleb na pokarm, oby zaopatrzył i rozmnożył wasz zasiew, i dał wzrost plonom waszej sprawiedliwości,"
  tags: []
"2Kor9,11":
  text: "We wszystkim jesteście ubogacani ku wszelkiej szczodrości, która przez nas sprawia dziękczynienie Bogu."
  tags: []
"2Kor9,12":
  text: "Bo posługa w tej służbie, nie tylko uzupełnia niedostatki świętych, ale i obfituje w liczne dziękczynienia składane Bogu,"
  tags: []
"2Kor9,13":
  text: "Przez doświadczenie tej służby, oddają chwałę Bogu z powodu posłuszeństwa wyznawanej przez was Ewangelii Chrystusa i za szczodrość wspólnoty wobec nich, i wobec wszystkich."
  tags: []
"2Kor9,14":
  text: "A w swym błaganiu za was, tęsknią za wami z powodu przeobfitej łaski Bożej wobec was."
  tags: []
"2Kor9,15":
  text: "A Bogu niech będzie dziękczynienie za Jego niewysłowiony dar."
  tags: []
