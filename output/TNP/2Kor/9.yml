"2Kor9,1": "Lecz o służbie dla świętych nie muszę wam zbyt dużo pisać."
"2Kor9,2": "Bo znam waszą gotowość, z powodu której chlubię się wami przed Macedończykami, że Achaja jest już gotowa od roku; a żarliwość wasza pobudziła wielu z nich."
"2Kor9,3": "Posłałem więc tych braci, aby chluba nasza z was w tej mierze nie okazała się daremna, abyście – jak powiedziałem – byli przygotowani;"
"2Kor9,4": "Abyśmy czasem, gdyby przyszli ze mną Macedończycy i znaleźli was nieprzygotowanych, nie zostali zawstydzeni – aby nie powiedzieć – że raczej wy, na podstawie tej chluby."
"2Kor9,5": "Uznałem za konieczne zachęcić tych braci, aby do was wcześniej poszli i przygotowali zapowiedziany wcześniej wasz hojny dar, aby był on gotowy jako wyraz hojności, a nie jako przejaw skąpstwa."
"2Kor9,6": "To natomiast sądzę: Kto skąpo sieje, skąpo też będzie żąć; a kto sieje hojnie, będzie też hojnie żąć."
"2Kor9,7": "Każdy, tak jak postanawia w sercu, nie z żalem i nie z przymusu; bo radosnego dawcę Bóg miłuje."
"2Kor9,8": "A Bóg jest mocny obficie wam udzielić wszelkiej łaski, abyście we wszystkim zawsze mając wszystko wystarczająco, obfitowali w każdym dobrym czynie,"
"2Kor9,9": "Jak jest napisane: Rozproszył, dał ubogim, sprawiedliwość Jego trwa na wieki."
"2Kor9,10": "A ten, który zaopatruje siejącego w ziarno i w chleb na pokarm, oby zaopatrzył i rozmnożył wasz zasiew, i dał wzrost plonom waszej sprawiedliwości,"
"2Kor9,11": "We wszystkim jesteście ubogacani ku wszelkiej szczodrości, która przez nas sprawia dziękczynienie Bogu."
"2Kor9,12": "Bo posługa w tej służbie, nie tylko uzupełnia niedostatki świętych, ale i obfituje w liczne dziękczynienia składane Bogu,"
"2Kor9,13": "Przez doświadczenie tej służby, oddają chwałę Bogu z powodu posłuszeństwa wyznawanej przez was Ewangelii Chrystusa i za szczodrość wspólnoty wobec nich, i wobec wszystkich."
"2Kor9,14": "A w swym błaganiu za was, tęsknią za wami z powodu przeobfitej łaski Bożej wobec was."
"2Kor9,15": "A Bogu niech będzie dziękczynienie za Jego niewysłowiony dar."
