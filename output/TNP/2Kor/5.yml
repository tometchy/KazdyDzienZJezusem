"2Kor5,1": "Wiemy bowiem, że jeśli nasz ziemski dom, ten namiot, zostanie obalony, mamy budowlę u Boga, dom w niebiosach, nie ręką uczyniony, wieczny."
"2Kor5,2": "Bo i w tym wzdychamy, pragnąc przyoblec się w nasze domostwo, które jest z nieba,"
"2Kor5,3": "Jeśli tylko przyobleczeni, a nie nadzy zostaniemy znalezieni."
"2Kor5,4": "Bo i będąc w tym namiocie, wzdychamy obciążeni, ponieważ nie chcemy zdjąć, ale przyoblec, by to, co śmiertelne, zostało wchłonięte przez życie."
"2Kor5,5": "A Tym, który nas dla siebie do tego przygotował, jest Bóg i który dał nam zadatek Ducha."
"2Kor5,6": "Zawsze więc ufni wiemy, że mieszkając w ciele, jesteśmy oddaleni od Pana;"
"2Kor5,7": "Albowiem przez wiarę chodzimy, a nie przez to, co się widzi."
"2Kor5,8": "Ufamy więc i mamy upodobanie raczej wyjść z ciała i zamieszkać u Pana."
"2Kor5,9": "Dlatego uważamy za zaszczytne, czy to pozostając, czy odchodząc, Jemu się podobać."
"2Kor5,10": "Albowiem musimy wszyscy pokazać się przed sędziowskim tronem Chrystusa, aby każdy odebrał to, co poprzez ciało zrobił i ze względu na to, co dokonał – czy to dobrego, czy to złego."
"2Kor5,11": "Wiedząc więc, czym jest bojaźń Pana, ludzi przekonujemy, a dla Boga jesteśmy jawnymi; a mam nadzieję, że i w waszych sumieniach jest to jawne."
"2Kor5,12": "Bo ponownie nie polecamy samych siebie, ale dajemy wam powód do chluby z nas, abyście ją mieli przeciw tym, którzy chlubią się z tego, co na zewnątrz, a nie z serca."
"2Kor5,13": "Bo jeśli straciliśmy rozum, to dla Boga; jeśli zachowujemy rozsądek, to dla was."
"2Kor5,14": "Albowiem miłość Chrystusa naciska na nas, którzy to osądziliśmy, że jeśli Jeden za wszystkich umarł, zatem wszyscy umarli;"
"2Kor5,15": "A za wszystkich umarł, aby ci, którzy żyją, już nie żyli dla samych siebie, ale dla Tego, który umarł za nich i został wzbudzony."
"2Kor5,16": "Dlatego my, od teraz nikogo nie znamy według ciała, a jeśli i poznaliśmy Chrystusa według ciała, to teraz już Go nie znamy."
"2Kor5,17": "Tak więc, jeśli ktoś jest w Chrystusie, nowym jest stworzeniem; stare przeminęło, oto wszystko stało się nowe,"
"2Kor5,18": "A to wszystko jest z Boga, który nas z samym sobą pojednał przez Jezusa Chrystusa i dał nam służbę pojednania,"
"2Kor5,19": "Jako że Bóg był w Chrystusie tym, który świat z samym sobą pojednał, nie zaliczając im ich upadków, i tym, który w nas złożył słowo pojednania."
"2Kor5,20": "W miejsce Chrystusa jesteśmy posłani, jako samego Boga, który przez nas wzywa, w miejsce Chrystusa prosimy: Bądźcie pojednani z Bogiem."
"2Kor5,21": "Albowiem On Tego, który nie znał grzechu, za nas uczynił grzechem, byśmy w Nim stawali się Bożą sprawiedliwością."
