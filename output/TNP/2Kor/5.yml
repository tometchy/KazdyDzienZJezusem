"2Kor5,1":
  text: "Wiemy bowiem, że jeśli nasz ziemski dom, ten namiot, zostanie obalony, mamy budowlę u Boga, dom w niebiosach, nie ręką uczyniony, wieczny."
  tags: []
"2Kor5,2":
  text: "Bo i w tym wzdychamy, pragnąc przyoblec się w nasze domostwo, które jest z nieba,"
  tags: []
"2Kor5,3":
  text: "Jeśli tylko przyobleczeni, a nie nadzy zostaniemy znalezieni."
  tags: []
"2Kor5,4":
  text: "Bo i będąc w tym namiocie, wzdychamy obciążeni, ponieważ nie chcemy zdjąć, ale przyoblec, by to, co śmiertelne, zostało wchłonięte przez życie."
  tags: []
"2Kor5,5":
  text: "A Tym, który nas dla siebie do tego przygotował, jest Bóg i który dał nam zadatek Ducha."
  tags: []
"2Kor5,6":
  text: "Zawsze więc ufni wiemy, że mieszkając w ciele, jesteśmy oddaleni od Pana;"
  tags: []
"2Kor5,7":
  text: "Albowiem przez wiarę chodzimy, a nie przez to, co się widzi."
  tags: []
"2Kor5,8":
  text: "Ufamy więc i mamy upodobanie raczej wyjść z ciała i zamieszkać u Pana."
  tags: []
"2Kor5,9":
  text: "Dlatego uważamy za zaszczytne, czy to pozostając, czy odchodząc, Jemu się podobać."
  tags: []
"2Kor5,10":
  text: "Albowiem musimy wszyscy pokazać się przed sędziowskim tronem Chrystusa, aby każdy odebrał to, co poprzez ciało zrobił i ze względu na to, co dokonał – czy to dobrego, czy to złego."
  tags: []
"2Kor5,11":
  text: "Wiedząc więc, czym jest bojaźń Pana, ludzi przekonujemy, a dla Boga jesteśmy jawnymi; a mam nadzieję, że i w waszych sumieniach jest to jawne."
  tags: []
"2Kor5,12":
  text: "Bo ponownie nie polecamy samych siebie, ale dajemy wam powód do chluby z nas, abyście ją mieli przeciw tym, którzy chlubią się z tego, co na zewnątrz, a nie z serca."
  tags: []
"2Kor5,13":
  text: "Bo jeśli straciliśmy rozum, to dla Boga; jeśli zachowujemy rozsądek, to dla was."
  tags: []
"2Kor5,14":
  text: "Albowiem miłość Chrystusa naciska na nas, którzy to osądziliśmy, że jeśli Jeden za wszystkich umarł, zatem wszyscy umarli;"
  tags: []
"2Kor5,15":
  text: "A za wszystkich umarł, aby ci, którzy żyją, już nie żyli dla samych siebie, ale dla Tego, który umarł za nich i został wzbudzony."
  tags: []
"2Kor5,16":
  text: "Dlatego my, od teraz nikogo nie znamy według ciała, a jeśli i poznaliśmy Chrystusa według ciała, to teraz już Go nie znamy."
  tags: []
"2Kor5,17":
  text: "Tak więc, jeśli ktoś jest w Chrystusie, nowym jest stworzeniem; stare przeminęło, oto wszystko stało się nowe,"
  tags: []
"2Kor5,18":
  text: "A to wszystko jest z Boga, który nas z samym sobą pojednał przez Jezusa Chrystusa i dał nam służbę pojednania,"
  tags: []
"2Kor5,19":
  text: "Jako że Bóg był w Chrystusie tym, który świat z samym sobą pojednał, nie zaliczając im ich upadków, i tym, który w nas złożył słowo pojednania."
  tags: []
"2Kor5,20":
  text: "W miejsce Chrystusa jesteśmy posłani, jako samego Boga, który przez nas wzywa, w miejsce Chrystusa prosimy: Bądźcie pojednani z Bogiem."
  tags: []
"2Kor5,21":
  text: "Albowiem On Tego, który nie znał grzechu, za nas uczynił grzechem, byśmy w Nim stawali się Bożą sprawiedliwością."
  tags: []
