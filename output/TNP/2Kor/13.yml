"2Kor13,1":
  text: "Trzeci to już raz idę do was. A na wypowiedzi ust dwóch albo trzech świadków oprze się cała sprawa."
  tags: []
"2Kor13,2":
  text: "Zapowiedziałem i zapowiadam, jako obecny za drugim razem, a teraz będąc nieobecny; piszę tym, którzy przedtem zgrzeszyli, i wszystkim pozostałym, że jeśli znów przyjdę, nie będę nikogo oszczędzał,"
  tags: []
"2Kor13,3":
  text: "Skoro chcecie doświadczyć mówiącego we mnie Chrystusa, który wobec was nie jest bezsilny, ale mocny jest w was."
  tags: []
"2Kor13,4":
  text: "A jeśli bowiem ukrzyżowany został wskutek słabości, to jednak żyje z mocy Boga, bo i my jesteśmy słabi w Nim, jednak będziemy żyć razem z Nim z mocy Boga wobec was."
  tags: []
"2Kor13,5":
  text: "Poddawajcie próbie samych siebie, czy jesteście w wierze, samych siebie doświadczajcie. Czyż sami o sobie w pełni nie wiecie, że Jezus Chrystus jest w was? Chyba że jesteście niewypróbowani."
  tags: []
"2Kor13,6":
  text: "Mam jednak nadzieję, że poznacie, że my nie jesteśmy niewypróbowani."
  tags: []
"2Kor13,7":
  text: "A modlę się do Boga, abyście nic złego nie czynili; nie dlatego, żebyśmy okazali się wypróbowani, ale abyście wy czynili to, co jest dobre, a my byśmy byli jak niewypróbowani."
  tags: []
"2Kor13,8":
  text: "Bo nie możemy uczynić czegoś przeciwko prawdzie, ale dla prawdy."
  tags: []
"2Kor13,9":
  text: "Albowiem radujemy się, jeżeli my bylibyśmy słabi, a wy bylibyście mocni; a o to też modlimy się – o wasze wzmocnienie."
  tags: []
"2Kor13,10":
  text: "Dlatego będąc nieobecny piszę to, abym, gdy będę obecny, nie musiał użyć surowości zgodnie z autorytetem, który mi dał Pan dla zbudowania, a nie dla burzenia."
  tags: []
"2Kor13,11":
  text: "Na koniec, bracia, radujcie się, bądźcie wzmocnieni, bądźcie zachęceni, to samo myślcie, zachowujcie pokój, a Bóg miłości i pokoju będzie z wami."
  tags: []
"2Kor13,12":
  text: "Pozdrówcie jedni drugich pocałunkiem świętym. Pozdrawiają was wszyscy święci."
  tags: []
"2Kor13,13":
  text: "Łaska Pana Jezusa Chrystusa i miłość Boga, i społeczność Ducha Świętego z wami wszystkimi. Amen."
  tags: []
