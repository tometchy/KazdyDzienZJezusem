"2Kor13,1": "Trzeci to już raz idę do was. A na wypowiedzi ust dwóch albo trzech świadków oprze się cała sprawa."
"2Kor13,2": "Zapowiedziałem i zapowiadam, jako obecny za drugim razem, a teraz będąc nieobecny; piszę tym, którzy przedtem zgrzeszyli, i wszystkim pozostałym, że jeśli znów przyjdę, nie będę nikogo oszczędzał,"
"2Kor13,3": "Skoro chcecie doświadczyć mówiącego we mnie Chrystusa, który wobec was nie jest bezsilny, ale mocny jest w was."
"2Kor13,4": "A jeśli bowiem ukrzyżowany został wskutek słabości, to jednak żyje z mocy Boga, bo i my jesteśmy słabi w Nim, jednak będziemy żyć razem z Nim z mocy Boga wobec was."
"2Kor13,5": "Poddawajcie próbie samych siebie, czy jesteście w wierze, samych siebie doświadczajcie. Czyż sami o sobie w pełni nie wiecie, że Jezus Chrystus jest w was? Chyba że jesteście niewypróbowani."
"2Kor13,6": "Mam jednak nadzieję, że poznacie, że my nie jesteśmy niewypróbowani."
"2Kor13,7": "A modlę się do Boga, abyście nic złego nie czynili; nie dlatego, żebyśmy okazali się wypróbowani, ale abyście wy czynili to, co jest dobre, a my byśmy byli jak niewypróbowani."
"2Kor13,8": "Bo nie możemy uczynić czegoś przeciwko prawdzie, ale dla prawdy."
"2Kor13,9": "Albowiem radujemy się, jeżeli my bylibyśmy słabi, a wy bylibyście mocni; a o to też modlimy się – o wasze wzmocnienie."
"2Kor13,10": "Dlatego będąc nieobecny piszę to, abym, gdy będę obecny, nie musiał użyć surowości zgodnie z autorytetem, który mi dał Pan dla zbudowania, a nie dla burzenia."
"2Kor13,11": "Na koniec, bracia, radujcie się, bądźcie wzmocnieni, bądźcie zachęceni, to samo myślcie, zachowujcie pokój, a Bóg miłości i pokoju będzie z wami."
"2Kor13,12": "Pozdrówcie jedni drugich pocałunkiem świętym. Pozdrawiają was wszyscy święci."
"2Kor13,13": "Łaska Pana Jezusa Chrystusa i miłość Boga, i społeczność Ducha Świętego z wami wszystkimi. Amen."
