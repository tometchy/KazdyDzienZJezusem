"2Kor2,1": "A postanowiłem w sobie samym to, aby nie przychodzić znowu do was w smutku."
"2Kor2,2": "Bo jeśli ja was zasmucam, to kto może mnie rozweselić, jeśli nie ten, który przeze mnie jest zasmucany?"
"2Kor2,3": "A to właśnie wam napisałem, abym, gdy przyjdę, nie doznawał smutku od tych, z których powinienem się radować, będąc przekonanym co do was wszystkich, że radość moja jest radością was wszystkich."
"2Kor2,4": "Albowiem z wielkiego utrapienia i ucisku serca, i wśród wielu łez napisałem do was, nie żebyście zostali zasmuceni, ale żebyście poznali miłość, którą mam obficie do was."
"2Kor2,5": "A jeśli ktoś mnie zasmucił, nie mnie zasmucił, lecz po części – obym go nie obciążył – was wszystkich."
"2Kor2,6": "Takiemu wystarczy ta kara, która jest nałożona przez większość,"
"2Kor2,7": "Tak że przeciwnie, raczej darujcie mu i pocieszcie, aby w jakiś sposób nie został pochłonięty przez ogrom smutku."
"2Kor2,8": "Dlatego proszę was, abyście okazali mu miłość."
"2Kor2,9": "Gdyż po to napisałem, aby poznać, czy jesteście wypróbowani i czy we wszystkim jesteście posłuszni."
"2Kor2,10": "A jeśli wy coś komuś darujecie, to i ja; gdyż i ja, jeśli coś darowałem, co darowałem, to ze względu na was w obliczu Chrystusa,"
"2Kor2,11": "Aby nie podszedł was szatan, albowiem nie jesteśmy nieświadomi jego sposobu myślenia."
"2Kor2,12": "A gdy przyszedłem do Troady dla głoszenia Ewangelii Chrystusa, a drzwi były mi otworzone w Panu,"
"2Kor2,13": "Nie miałem ulgi w swoim duchu, ponieważ nie znalazłem Tytusa, mojego brata; więc rozstając się z nimi, wyruszyłem do Macedonii."
"2Kor2,14": "A Bogu niech będą dzięki, który nas nieustannie prowadzi w triumfalnym marszu zwycięstwa w Chrystusie i ujawnia wonność poznania Jego przez nas na każdym miejscu."
"2Kor2,15": "Bo my jesteśmy wonnością Chrystusa dla Boga wśród tych, którzy dostępują zbawienia i tych, którzy giną,"
"2Kor2,16": "Dla jednych wprawdzie to woń śmierci ku śmierci, a dla drugich to woń życia ku życiu; a do tego, kto jest zdolny?"
"2Kor2,17": "Bo nie jesteśmy jak wielu fałszujących Słowo Boga; ale w szczerości i jak od Boga, przed obliczem Boga mówimy w Chrystusie."
