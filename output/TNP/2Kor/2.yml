"2Kor2,1":
  text: "A postanowiłem w sobie samym to, aby nie przychodzić znowu do was w smutku."
  tags: []
"2Kor2,2":
  text: "Bo jeśli ja was zasmucam, to kto może mnie rozweselić, jeśli nie ten, który przeze mnie jest zasmucany?"
  tags: []
"2Kor2,3":
  text: "A to właśnie wam napisałem, abym, gdy przyjdę, nie doznawał smutku od tych, z których powinienem się radować, będąc przekonanym co do was wszystkich, że radość moja jest radością was wszystkich."
  tags: []
"2Kor2,4":
  text: "Albowiem z wielkiego utrapienia i ucisku serca, i wśród wielu łez napisałem do was, nie żebyście zostali zasmuceni, ale żebyście poznali miłość, którą mam obficie do was."
  tags: []
"2Kor2,5":
  text: "A jeśli ktoś mnie zasmucił, nie mnie zasmucił, lecz po części – obym go nie obciążył – was wszystkich."
  tags: []
"2Kor2,6":
  text: "Takiemu wystarczy ta kara, która jest nałożona przez większość,"
  tags: []
"2Kor2,7":
  text: "Tak że przeciwnie, raczej darujcie mu i pocieszcie, aby w jakiś sposób nie został pochłonięty przez ogrom smutku."
  tags: []
"2Kor2,8":
  text: "Dlatego proszę was, abyście okazali mu miłość."
  tags: []
"2Kor2,9":
  text: "Gdyż po to napisałem, aby poznać, czy jesteście wypróbowani i czy we wszystkim jesteście posłuszni."
  tags: []
"2Kor2,10":
  text: "A jeśli wy coś komuś darujecie, to i ja; gdyż i ja, jeśli coś darowałem, co darowałem, to ze względu na was w obliczu Chrystusa,"
  tags: []
"2Kor2,11":
  text: "Aby nie podszedł was szatan, albowiem nie jesteśmy nieświadomi jego sposobu myślenia."
  tags: []
"2Kor2,12":
  text: "A gdy przyszedłem do Troady dla głoszenia Ewangelii Chrystusa, a drzwi były mi otworzone w Panu,"
  tags: []
"2Kor2,13":
  text: "Nie miałem ulgi w swoim duchu, ponieważ nie znalazłem Tytusa, mojego brata; więc rozstając się z nimi, wyruszyłem do Macedonii."
  tags: []
"2Kor2,14":
  text: "A Bogu niech będą dzięki, który nas nieustannie prowadzi w triumfalnym marszu zwycięstwa w Chrystusie i ujawnia wonność poznania Jego przez nas na każdym miejscu."
  tags: []
"2Kor2,15":
  text: "Bo my jesteśmy wonnością Chrystusa dla Boga wśród tych, którzy dostępują zbawienia i tych, którzy giną,"
  tags: []
"2Kor2,16":
  text: "Dla jednych wprawdzie to woń śmierci ku śmierci, a dla drugich to woń życia ku życiu; a do tego, kto jest zdolny?"
  tags: []
"2Kor2,17":
  text: "Bo nie jesteśmy jak wielu fałszujących Słowo Boga; ale w szczerości i jak od Boga, przed obliczem Boga mówimy w Chrystusie."
  tags: []
