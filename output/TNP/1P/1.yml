"1P1,1": "Piotr, apostoł Jezusa Chrystusa, do wychodźców rozproszonych po Poncie, Galacji, Kapadocji, Azji i Bitynii,"
"1P1,2": "Wybranych zgodnie z uprzednią wiedzą Boga Ojca w uświęceniu Ducha, do posłuszeństwa i pokropienia krwią Jezusa Chrystusa. Łaska wam; a pokój oby został pomnożony."
"1P1,3": "Błogosławiony niech będzie Bóg i Ojciec Pana naszego Jezusa Chrystusa, który według swojego wielkiego miłosierdzia, odrodził nas ku nadziei żywej przez wzbudzenie Jezusa Chrystusa z martwych,"
"1P1,4": "Do dziedzictwa niezniszczalnego i nieskalanego, i niewiędnącego, które jest zachowane w niebiosach dla was,"
"1P1,5": "Którzy w mocy Bożej strzeżeni jesteście przez wiarę ku zbawieniu, gotowemu by zostać objawionym w ostatecznym czasie."
"1P1,6": "Weselicie się z tego, mimo że teraz zostaliście na krótko zasmuceni, jeśli potrzeba, rozmaitymi próbami,"
"1P1,7": "Aby doświadczenie waszej wiary, o wiele cenniejsze od zniszczalnego złota, a które przez ogień jest próbowane, zostało znalezione dla uznania, czci i chwały w objawieniu Jezusa Chrystusa,"
"1P1,8": "Którego, choć nie widzieliście, miłujecie; w którego, teraz nie widząc, wierzycie; i cieszycie się radością niewysłowioną i pełną chwały."
"1P1,9": "Przyjmując cel wiary waszej, zbawienie dusz."
"1P1,10": "Tego to zbawienia poszukiwali i pilnie badali je prorocy, którzy prorokowali o niesionej dla was łasce."
"1P1,11": "Wypatrując, na jaki lub na jakiego rodzaju czas wskazywał będący w nich Duch Chrystusa, zapowiadający nadchodzące na Chrystusa cierpienia i następującą po nich chwałę;"
"1P1,12": "Którym zostało objawione, że nie im samym, ale nam służyły te sprawy, które teraz zostały wam oznajmione przez tych, którzy wam ogłosili dobrą nowinę w Duchu Świętym, który został wysłany z nieba – sprawy, w które pragną wejrzeć aniołowie."
"1P1,13": "Dlatego gdy przepasaliście sobie biodra waszego umysłu, trzeźwymi będąc, całkowicie złóżcie nadzieję w łasce, która jest wam niesiona w objawieniu Jezusa Chrystusa."
"1P1,14": "Jako posłuszne dzieci, nie dostosowujcie się do wcześniejszych pożądliwości z czasów waszej niewiedzy,"
"1P1,15": "Ale z powodu Świętego, który was powołał, stańcie się sami święci we wszelkim postępowaniu waszym;"
"1P1,16": "Bo napisano: Stańcie się święci, bo Ja jestem Święty."
"1P1,17": "A jeśli wzywacie jako Ojca, tego który bez względu na osoby sądzi każdego według jego czynów, postępujcie w bojaźni przez czas waszego zamieszkiwania na obczyźnie."
"1P1,18": "Wiedząc, że nie zniszczalnym srebrem albo złotem zostaliście wykupieni z waszego marnego postępowania, przekazanego przez ojców,"
"1P1,19": "Ale drogą krwią Chrystusa, jako Baranka niewinnego i nieskalanego,"
"1P1,20": "Przeznaczonego wprawdzie przed założeniem świata, lecz ukazanego ze względu na was w czasach ostatecznych,"
"1P1,21": "Którzy dzięki Niemu jesteście wierzącymi w Boga, który wzbudził Go z martwych i dał Mu chwałę, tak aby wiara i nadzieja wasza była w Bogu."
"1P1,22": "Skoro zaczęliście oczyszczać dusze wasze w posłuszeństwie prawdzie przez Ducha, dla nieobłudnej braterskiej miłości, z czystego serca jedni drugich miłujcie gorąco,"
"1P1,23": "Odradzani będąc, nie z nasienia zniszczalnego, ale z niezniszczalnego przez Słowo żywego Boga, które trwa na wieki."
"1P1,24": "Dlatego że wszelkie ciało jest jak trawa, a wszelka chwała człowieka jak kwiat trawy; uschła trawa i kwiat jej opadł;"
"1P1,25": "Ale Słowo PANA trwa na wieki. A tym Słowem jest to, co zostało ogłoszone wam w Ewangelii."
