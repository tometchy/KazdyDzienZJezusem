"1P1,1":
  text: "Piotr, apostoł Jezusa Chrystusa, do wychodźców rozproszonych po Poncie, Galacji, Kapadocji, Azji i Bitynii,"
  tags: []
"1P1,2":
  text: "Wybranych zgodnie z uprzednią wiedzą Boga Ojca w uświęceniu Ducha, do posłuszeństwa i pokropienia krwią Jezusa Chrystusa. Łaska wam; a pokój oby został pomnożony."
  tags: []
"1P1,3":
  text: "Błogosławiony niech będzie Bóg i Ojciec Pana naszego Jezusa Chrystusa, który według swojego wielkiego miłosierdzia, odrodził nas ku nadziei żywej przez wzbudzenie Jezusa Chrystusa z martwych,"
  tags: []
"1P1,4":
  text: "Do dziedzictwa niezniszczalnego i nieskalanego, i niewiędnącego, które jest zachowane w niebiosach dla was,"
  tags: []
"1P1,5":
  text: "Którzy w mocy Bożej strzeżeni jesteście przez wiarę ku zbawieniu, gotowemu by zostać objawionym w ostatecznym czasie."
  tags: []
"1P1,6":
  text: "Weselicie się z tego, mimo że teraz zostaliście na krótko zasmuceni, jeśli potrzeba, rozmaitymi próbami,"
  tags: []
"1P1,7":
  text: "Aby doświadczenie waszej wiary, o wiele cenniejsze od zniszczalnego złota, a które przez ogień jest próbowane, zostało znalezione dla uznania, czci i chwały w objawieniu Jezusa Chrystusa,"
  tags: []
"1P1,8":
  text: "Którego, choć nie widzieliście, miłujecie; w którego, teraz nie widząc, wierzycie; i cieszycie się radością niewysłowioną i pełną chwały."
  tags: []
"1P1,9":
  text: "Przyjmując cel wiary waszej, zbawienie dusz."
  tags: []
"1P1,10":
  text: "Tego to zbawienia poszukiwali i pilnie badali je prorocy, którzy prorokowali o niesionej dla was łasce."
  tags: []
"1P1,11":
  text: "Wypatrując, na jaki lub na jakiego rodzaju czas wskazywał będący w nich Duch Chrystusa, zapowiadający nadchodzące na Chrystusa cierpienia i następującą po nich chwałę;"
  tags: []
"1P1,12":
  text: "Którym zostało objawione, że nie im samym, ale nam służyły te sprawy, które teraz zostały wam oznajmione przez tych, którzy wam ogłosili dobrą nowinę w Duchu Świętym, który został wysłany z nieba – sprawy, w które pragną wejrzeć aniołowie."
  tags: []
"1P1,13":
  text: "Dlatego gdy przepasaliście sobie biodra waszego umysłu, trzeźwymi będąc, całkowicie złóżcie nadzieję w łasce, która jest wam niesiona w objawieniu Jezusa Chrystusa."
  tags: []
"1P1,14":
  text: "Jako posłuszne dzieci, nie dostosowujcie się do wcześniejszych pożądliwości z czasów waszej niewiedzy,"
  tags: []
"1P1,15":
  text: "Ale z powodu Świętego, który was powołał, stańcie się sami święci we wszelkim postępowaniu waszym;"
  tags: []
"1P1,16":
  text: "Bo napisano: Stańcie się święci, bo Ja jestem Święty."
  tags: []
"1P1,17":
  text: "A jeśli wzywacie jako Ojca, tego który bez względu na osoby sądzi każdego według jego czynów, postępujcie w bojaźni przez czas waszego zamieszkiwania na obczyźnie."
  tags: []
"1P1,18":
  text: "Wiedząc, że nie zniszczalnym srebrem albo złotem zostaliście wykupieni z waszego marnego postępowania, przekazanego przez ojców,"
  tags: []
"1P1,19":
  text: "Ale drogą krwią Chrystusa, jako Baranka niewinnego i nieskalanego,"
  tags: []
"1P1,20":
  text: "Przeznaczonego wprawdzie przed założeniem świata, lecz ukazanego ze względu na was w czasach ostatecznych,"
  tags: []
"1P1,21":
  text: "Którzy dzięki Niemu jesteście wierzącymi w Boga, który wzbudził Go z martwych i dał Mu chwałę, tak aby wiara i nadzieja wasza była w Bogu."
  tags: []
"1P1,22":
  text: "Skoro zaczęliście oczyszczać dusze wasze w posłuszeństwie prawdzie przez Ducha, dla nieobłudnej braterskiej miłości, z czystego serca jedni drugich miłujcie gorąco,"
  tags: []
"1P1,23":
  text: "Odradzani będąc, nie z nasienia zniszczalnego, ale z niezniszczalnego przez Słowo żywego Boga, które trwa na wieki."
  tags: []
"1P1,24":
  text: "Dlatego że wszelkie ciało jest jak trawa, a wszelka chwała człowieka jak kwiat trawy; uschła trawa i kwiat jej opadł;"
  tags: []
"1P1,25":
  text: "Ale Słowo PANA trwa na wieki. A tym Słowem jest to, co zostało ogłoszone wam w Ewangelii."
  tags: []
