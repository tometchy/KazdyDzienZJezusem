"1P4,1":
  text: "Skoro więc Chrystus cierpiał za nas w ciele, to i wy uzbrójcie się tą myślą; bo ten, kto cierpiał w ciele, zaprzestał grzechu,"
  tags: []
"1P4,2":
  text: "Aby już więcej, nie w ludzkich pożądliwościach, ale w woli Boga, pozostały czas żyć w ciele."
  tags: []
"1P4,3":
  text: "Wystarczy już bowiem, że w minionym czasie naszego życia czyniliśmy wolę pogan, żyjąc w rozwiązłościach, pożądliwościach, pijaństwie, hulankach, pijatykach i niegodziwych bałwochwalstwach."
  tags: []
"1P4,4":
  text: "Przy tym dziwią się oni, że wy nie śpieszycie się razem z nimi do tego samego zalewu rozwiązłości, i bluźnią wam."
  tags: []
"1P4,5":
  text: "Ci zdadzą sprawę Temu, który gotów jest osądzić żywych i umarłych."
  tags: []
"1P4,6":
  text: "W tym bowiem celu i umarłym ogłoszono dobrą nowinę, aby zostali osądzeni wprawdzie jako ludzie według ciała, ale żyli w duchu według Boga."
  tags: []
"1P4,7":
  text: "Lecz zbliża się koniec wszystkich; zachowajcie więc roztropność i trzeźwość w modlitwach."
  tags: []
"1P4,8":
  text: "Przede wszystkim jednak miejcie gorliwą miłość jedni ku drugim; gdyż miłość zakryje mnóstwo grzechów."
  tags: []
"1P4,9":
  text: "Okazujcie gościnność jedni drugim bez szemrania."
  tags: []
"1P4,10":
  text: "Każdy tak jak otrzymał dar łaski, niech nim służy drugim, jako dobrzy zarządcy różnorodnej łaski Bożej."
  tags: []
"1P4,11":
  text: "Jeśli ktoś mówi, niech mówi jak Słowa Boga; jeśli ktoś usługuje, to z siłą w którą Bóg zaopatruje; aby we wszystkim Bóg był otoczony chwałą przez Jezusa Chrystusa. Jemu chwała i moc na wieki wieków. Amen."
  tags: []
"1P4,12":
  text: "Umiłowani! Nie dziwcie się próbie ognia, która was doświadcza, jakby was spotykało coś niezwykłego;"
  tags: []
"1P4,13":
  text: "Ale według tego, jak jesteście uczestnikami cierpień Chrystusa, radujcie się, byście i podczas objawienia Jego chwały rozradowali się weseląc."
  tags: []
"1P4,14":
  text: "Jeśli was znieważają dla imienia Chrystusa, jesteście błogosławieni, gdyż Duch chwały i Duch Boga spoczywa na was; wprawdzie przez nich jest spotwarzany, ale przez was doznaje chwały."
  tags: []
"1P4,15":
  text: "Niech nikt z was nie cierpi jako zabójca, albo złodziej, albo złoczyńca, albo wtrącający się w cudze sprawy."
  tags: []
"1P4,16":
  text: "Jeśli natomiast ktoś cierpi jako chrześcijanin, niech nie będzie zawstydzany, ale niech w tej mierze oddaje chwałę Bogu."
  tags: []
"1P4,17":
  text: "Gdyż jest czas, aby rozpoczął się sąd od domu Bożego; jeżeli więc zaczyna się od nas, jaki będzie koniec tych, którzy nie okazują posłuszeństwa ewangelii Bożej?"
  tags: []
"1P4,18":
  text: "A jeśli sprawiedliwy z trudem jest zbawiany, bezbożny i grzeszny gdzie się ukaże?"
  tags: []
"1P4,19":
  text: "Tak więc i ci, którzy cierpią według woli Bożej, niech Jemu, jako wiernemu Stwórcy, powierzają swoje dusze w czynieniu dobra."
  tags: []
