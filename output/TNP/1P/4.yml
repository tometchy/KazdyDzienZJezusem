"1P4,1": "Skoro więc Chrystus cierpiał za nas w ciele, to i wy uzbrójcie się tą myślą; bo ten, kto cierpiał w ciele, zaprzestał grzechu,"
"1P4,2": "Aby już więcej, nie w ludzkich pożądliwościach, ale w woli Boga, pozostały czas żyć w ciele."
"1P4,3": "Wystarczy już bowiem, że w minionym czasie naszego życia czyniliśmy wolę pogan, żyjąc w rozwiązłościach, pożądliwościach, pijaństwie, hulankach, pijatykach i niegodziwych bałwochwalstwach."
"1P4,4": "Przy tym dziwią się oni, że wy nie śpieszycie się razem z nimi do tego samego zalewu rozwiązłości, i bluźnią wam."
"1P4,5": "Ci zdadzą sprawę Temu, który gotów jest osądzić żywych i umarłych."
"1P4,6": "W tym bowiem celu i umarłym ogłoszono dobrą nowinę, aby zostali osądzeni wprawdzie jako ludzie według ciała, ale żyli w duchu według Boga."
"1P4,7": "Lecz zbliża się koniec wszystkich; zachowajcie więc roztropność i trzeźwość w modlitwach."
"1P4,8": "Przede wszystkim jednak miejcie gorliwą miłość jedni ku drugim; gdyż miłość zakryje mnóstwo grzechów."
"1P4,9": "Okazujcie gościnność jedni drugim bez szemrania."
"1P4,10": "Każdy tak jak otrzymał dar łaski, niech nim służy drugim, jako dobrzy zarządcy różnorodnej łaski Bożej."
"1P4,11": "Jeśli ktoś mówi, niech mówi jak Słowa Boga; jeśli ktoś usługuje, to z siłą w którą Bóg zaopatruje; aby we wszystkim Bóg był otoczony chwałą przez Jezusa Chrystusa. Jemu chwała i moc na wieki wieków. Amen."
"1P4,12": "Umiłowani! Nie dziwcie się próbie ognia, która was doświadcza, jakby was spotykało coś niezwykłego;"
"1P4,13": "Ale według tego, jak jesteście uczestnikami cierpień Chrystusa, radujcie się, byście i podczas objawienia Jego chwały rozradowali się weseląc."
"1P4,14": "Jeśli was znieważają dla imienia Chrystusa, jesteście błogosławieni, gdyż Duch chwały i Duch Boga spoczywa na was; wprawdzie przez nich jest spotwarzany, ale przez was doznaje chwały."
"1P4,15": "Niech nikt z was nie cierpi jako zabójca, albo złodziej, albo złoczyńca, albo wtrącający się w cudze sprawy."
"1P4,16": "Jeśli natomiast ktoś cierpi jako chrześcijanin, niech nie będzie zawstydzany, ale niech w tej mierze oddaje chwałę Bogu."
"1P4,17": "Gdyż jest czas, aby rozpoczął się sąd od domu Bożego; jeżeli więc zaczyna się od nas, jaki będzie koniec tych, którzy nie okazują posłuszeństwa ewangelii Bożej?"
"1P4,18": "A jeśli sprawiedliwy z trudem jest zbawiany, bezbożny i grzeszny gdzie się ukaże?"
"1P4,19": "Tak więc i ci, którzy cierpią według woli Bożej, niech Jemu, jako wiernemu Stwórcy, powierzają swoje dusze w czynieniu dobra."
