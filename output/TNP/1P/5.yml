"1P5,1": "Starszych spośród was zachęcam ja, współstarszy i świadek cierpień Chrystusa, i współuczestnik chwały, która ma się objawiać:"
"1P5,2": "Paście stadko Boże, które jest wśród was, doglądając go nie z przymusu, lecz chętnie; i nie dla brudnego zysku, lecz z zapałem;"
"1P5,3": "I nie jako panujący nad dziedzictwem Pana, lecz stając się wzorem dla stadka."
"1P5,4": "Gdy ukaże się Arcypasterz, otrzymacie niezwiędły wieniec chwały."
"1P5,5": "Podobnie młodsi, bądźcie ulegli starszym, a wszyscy bądźcie ulegli jedni drugim. Przepaszcie się pokorą, gdyż Bóg pysznym się sprzeciwia, a pokornym daje łaskę."
"1P5,6": "Uniżcie się pod mocną ręką Boga, aby was wywyższył w swoim czasie;"
"1P5,7": "Przerzućcie na Niego wszelką waszą troskę, gdyż On troszczy się o was."
"1P5,8": "Otrzeźwijcie, obudźcie się, gdyż przeciwnik wasz, diabeł, chodzi wokoło jak lew ryczący, szukając kogo by pochłonąć."
"1P5,9": "Przeciwstawcie się mu mocni wiarą, wiedząc, że takie same cierpienia wasi bracia przechodzą w świecie."
"1P5,10": "A Bóg wszelkiej łaski, który nas powołał do wiecznej swojej chwały w Chrystusie Jezusie, po krótkotrwałych cierpieniach, oby sam was uczynił doskonałymi, oby utwierdził, oby umocnił i oby ugruntował."
"1P5,11": "Jemu chwała i moc na wieki wieków. Amen."
"1P5,12": "Przez Sylwana, wiernego wam, jak sądzę brata, krótko napisałem do was, zachęcając i dając świadectwo, że to jest prawdziwa łaska Boża, w której stoicie."
"1P5,13": "Pozdrawia was współwybrana w Babilonie i Marek, mój syn."
"1P5,14": "Pozdrówcie jedni drugich pocałunkiem miłości. Pokój wam wszystkim w Chrystusie Jezusie. Amen."
