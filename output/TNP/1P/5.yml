"1P5,1":
  text: "Starszych spośród was zachęcam ja, współstarszy i świadek cierpień Chrystusa, i współuczestnik chwały, która ma się objawiać:"
  tags: []
"1P5,2":
  text: "Paście stadko Boże, które jest wśród was, doglądając go nie z przymusu, lecz chętnie; i nie dla brudnego zysku, lecz z zapałem;"
  tags: []
"1P5,3":
  text: "I nie jako panujący nad dziedzictwem Pana, lecz stając się wzorem dla stadka."
  tags: []
"1P5,4":
  text: "Gdy ukaże się Arcypasterz, otrzymacie niezwiędły wieniec chwały."
  tags: []
"1P5,5":
  text: "Podobnie młodsi, bądźcie ulegli starszym, a wszyscy bądźcie ulegli jedni drugim. Przepaszcie się pokorą, gdyż Bóg pysznym się sprzeciwia, a pokornym daje łaskę."
  tags: []
"1P5,6":
  text: "Uniżcie się pod mocną ręką Boga, aby was wywyższył w swoim czasie;"
  tags: []
"1P5,7":
  text: "Przerzućcie na Niego wszelką waszą troskę, gdyż On troszczy się o was."
  tags: []
"1P5,8":
  text: "Otrzeźwijcie, obudźcie się, gdyż przeciwnik wasz, diabeł, chodzi wokoło jak lew ryczący, szukając kogo by pochłonąć."
  tags: []
"1P5,9":
  text: "Przeciwstawcie się mu mocni wiarą, wiedząc, że takie same cierpienia wasi bracia przechodzą w świecie."
  tags: []
"1P5,10":
  text: "A Bóg wszelkiej łaski, który nas powołał do wiecznej swojej chwały w Chrystusie Jezusie, po krótkotrwałych cierpieniach, oby sam was uczynił doskonałymi, oby utwierdził, oby umocnił i oby ugruntował."
  tags: []
"1P5,11":
  text: "Jemu chwała i moc na wieki wieków. Amen."
  tags: []
"1P5,12":
  text: "Przez Sylwana, wiernego wam, jak sądzę brata, krótko napisałem do was, zachęcając i dając świadectwo, że to jest prawdziwa łaska Boża, w której stoicie."
  tags: []
"1P5,13":
  text: "Pozdrawia was współwybrana w Babilonie i Marek, mój syn."
  tags: []
"1P5,14":
  text: "Pozdrówcie jedni drugich pocałunkiem miłości. Pokój wam wszystkim w Chrystusie Jezusie. Amen."
  tags: []
