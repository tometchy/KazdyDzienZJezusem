"1P3,1": "Podobnie i żony, bądźcie uległe swoim mężom, aby nawet jeśli niektórzy z nich są nieposłuszni Słowu, dzięki postępowaniu swych żon, bez słowa zostali pozyskani,"
"1P3,2": "Bo zaobserwowali wasze czyste postępowanie w bojaźni Bożej."
"1P3,3": "Niech waszą ozdobą nie jest to, co zewnętrzne: sploty włosów, opasywanie się złotem, noszenie ozdobnych szat,"
"1P3,4": "Ale ukryty wewnętrzny człowiek, w niezniszczalnym, łagodnym i cichym duchu, który jest drogocenny przed obliczem Boga."
"1P3,5": "I niegdyś bowiem tak właśnie święte kobiety, mające nadzieję w Bogu, przyozdabiały siebie, uległe swoim mężom."
"1P3,6": "Tak Sara była uległa Abrahamowi, nazywając go panem. Jej dziećmi stałyście się wy, czyniąc dobro i nie lękając się niczego strasznego."
"1P3,7": "Tak samo mężowie, żyjcie z nimi wspólnie zgodnie z poznaniem; okazując im szacunek jako słabszemu naczyniu kobiecemu, i jako współdziedzicom łaski życia, aby modlitwy wasze nie były przerywane."
"1P3,8": "Na koniec wszyscy bądźcie jednomyślni, współczujący, miłujący braci, miłosierni i uprzejmi,"
"1P3,9": "Nie oddając złem za zło, ani obelgą za obelgę, lecz przeciwnie, błogosławcie, wiedząc, że do tego zostaliście powołani, abyście odziedziczyli błogosławieństwo."
"1P3,10": "Bo kto chce miłować życie i oglądać dni dobre, niech powstrzyma swój język od złego, a swoje wargi, by nie mówić zwodniczo;"
"1P3,11": "Niech się odwróci od tego, co złe i uczyni, to co dobre; niech szuka pokoju i niech dokona starań, aby go osiągnąć."
"1P3,12": "Bo oczy PANA są zwrócone na sprawiedliwych, a uszy Jego na ich prośbę; lecz oblicze PANA przeciwko czyniącym to, co złe."
"1P3,13": "Kto zrobi wam coś złego, jeśli będziecie naśladowcami tego, co dobre?"
"1P3,14": "Ale chociaż mielibyście cierpieć z powodu sprawiedliwości, jesteście szczęśliwi; nie zlęknijcie się ich gróźb i nie zatrwóżcie się,"
"1P3,15": "A PANA Boga uświęćcie w swoich sercach. Bądźcie też zawsze gotowi do obrony przed każdym, kto żądałby od was zdania rachunku z waszej nadziei, ale czyńcie to z łagodnością i bojaźnią."
"1P3,16": "Mając dobre sumienie, by w tym, w czym będą was obmawiali jako złoczyńców, zostali zawstydzeni ci, którzy znieważają wasze dobre postępowanie w Chrystusie."
"1P3,17": "Lepiej bowiem, jeżeli tego chce wola Boga, cierpieć czyniąc dobro, niż czyniąc zło."
"1P3,18": "Gdyż i Chrystus raz za grzechy cierpiał, sprawiedliwy za niesprawiedliwych, aby nas przyprowadzić do Boga, zabity wprawdzie w ciele, lecz ożywiony w duchu,"
"1P3,19": "W którym też poszedł i ogłosił duchom będącym w więzieniu,"
"1P3,20": "Które niegdyś były nieposłuszne, gdy raz oczekiwał Bóg cierpliwie za dni Noego, kiedy budowana była arka, w której niewiele, to jest osiem dusz, ocalało wśród wody."
"1P3,21": "Ona jest odpowiednikiem chrztu, który i nas teraz zbawia, a nie jest pozbyciem się brudu ciała, ale prośbą do Boga o dobre sumienie, przez powstanie z martwych Jezusa Chrystusa,"
"1P3,22": "Który jest po prawicy Boga, wstąpił do nieba, gdzie zostali Mu poddani aniołowie i władze, i moce."
