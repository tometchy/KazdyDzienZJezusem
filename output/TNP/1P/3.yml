"1P3,1":
  text: "Podobnie i żony, bądźcie uległe swoim mężom, aby nawet jeśli niektórzy z nich są nieposłuszni Słowu, dzięki postępowaniu swych żon, bez słowa zostali pozyskani,"
  tags: []
"1P3,2":
  text: "Bo zaobserwowali wasze czyste postępowanie w bojaźni Bożej."
  tags: []
"1P3,3":
  text: "Niech waszą ozdobą nie jest to, co zewnętrzne: sploty włosów, opasywanie się złotem, noszenie ozdobnych szat,"
  tags: []
"1P3,4":
  text: "Ale ukryty wewnętrzny człowiek, w niezniszczalnym, łagodnym i cichym duchu, który jest drogocenny przed obliczem Boga."
  tags: []
"1P3,5":
  text: "I niegdyś bowiem tak właśnie święte kobiety, mające nadzieję w Bogu, przyozdabiały siebie, uległe swoim mężom."
  tags: []
"1P3,6":
  text: "Tak Sara była uległa Abrahamowi, nazywając go panem. Jej dziećmi stałyście się wy, czyniąc dobro i nie lękając się niczego strasznego."
  tags: []
"1P3,7":
  text: "Tak samo mężowie, żyjcie z nimi wspólnie zgodnie z poznaniem; okazując im szacunek jako słabszemu naczyniu kobiecemu, i jako współdziedzicom łaski życia, aby modlitwy wasze nie były przerywane."
  tags: []
"1P3,8":
  text: "Na koniec wszyscy bądźcie jednomyślni, współczujący, miłujący braci, miłosierni i uprzejmi,"
  tags: []
"1P3,9":
  text: "Nie oddając złem za zło, ani obelgą za obelgę, lecz przeciwnie, błogosławcie, wiedząc, że do tego zostaliście powołani, abyście odziedziczyli błogosławieństwo."
  tags: []
"1P3,10":
  text: "Bo kto chce miłować życie i oglądać dni dobre, niech powstrzyma swój język od złego, a swoje wargi, by nie mówić zwodniczo;"
  tags: []
"1P3,11":
  text: "Niech się odwróci od tego, co złe i uczyni, to co dobre; niech szuka pokoju i niech dokona starań, aby go osiągnąć."
  tags: []
"1P3,12":
  text: "Bo oczy PANA są zwrócone na sprawiedliwych, a uszy Jego na ich prośbę; lecz oblicze PANA przeciwko czyniącym to, co złe."
  tags: []
"1P3,13":
  text: "Kto zrobi wam coś złego, jeśli będziecie naśladowcami tego, co dobre?"
  tags: []
"1P3,14":
  text: "Ale chociaż mielibyście cierpieć z powodu sprawiedliwości, jesteście szczęśliwi; nie zlęknijcie się ich gróźb i nie zatrwóżcie się,"
  tags: []
"1P3,15":
  text: "A PANA Boga uświęćcie w swoich sercach. Bądźcie też zawsze gotowi do obrony przed każdym, kto żądałby od was zdania rachunku z waszej nadziei, ale czyńcie to z łagodnością i bojaźnią."
  tags: []
"1P3,16":
  text: "Mając dobre sumienie, by w tym, w czym będą was obmawiali jako złoczyńców, zostali zawstydzeni ci, którzy znieważają wasze dobre postępowanie w Chrystusie."
  tags: []
"1P3,17":
  text: "Lepiej bowiem, jeżeli tego chce wola Boga, cierpieć czyniąc dobro, niż czyniąc zło."
  tags: []
"1P3,18":
  text: "Gdyż i Chrystus raz za grzechy cierpiał, sprawiedliwy za niesprawiedliwych, aby nas przyprowadzić do Boga, zabity wprawdzie w ciele, lecz ożywiony w duchu,"
  tags: []
"1P3,19":
  text: "W którym też poszedł i ogłosił duchom będącym w więzieniu,"
  tags: []
"1P3,20":
  text: "Które niegdyś były nieposłuszne, gdy raz oczekiwał Bóg cierpliwie za dni Noego, kiedy budowana była arka, w której niewiele, to jest osiem dusz, ocalało wśród wody."
  tags: []
"1P3,21":
  text: "Ona jest odpowiednikiem chrztu, który i nas teraz zbawia, a nie jest pozbyciem się brudu ciała, ale prośbą do Boga o dobre sumienie, przez powstanie z martwych Jezusa Chrystusa,"
  tags: []
"1P3,22":
  text: "Który jest po prawicy Boga, wstąpił do nieba, gdzie zostali Mu poddani aniołowie i władze, i moce."
  tags: []
