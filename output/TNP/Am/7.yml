"Am7,1":
  text: "To mi ukazał JHWH PAN. A oto On przygotowuje szarańczę na początku odrastania potrawu. A oto był to potraw po sianokosach królewskich."
  tags: []
"Am7,2":
  text: "I stało się, gdy kończyła ona pożerać zieleń ziemi, że powiedziałem: JHWH PANIE! Przebacz, proszę. Jakże ostoi się Jakub? Bo on jest malutki."
  tags: []
"Am7,3":
  text: "I zlitował się JHWH. Z powodu tego, to się nie stanie – powiedział JHWH."
  tags: []
"Am7,4":
  text: "To mi ukazał JHWH PAN: Oto JHWH PAN wezwał ogień, by prowadzić spór. I pochłonął on wielką głębię, i pochłonął dziedzictwo."
  tags: []
"Am7,5":
  text: "Wtedy powiedziałem: JHWH PANIE! Zaniechaj tego, proszę. Jakże ostoi się Jakub? Bo on jest malutki."
  tags: []
"Am7,6":
  text: "I zlitował się JHWH. Z powodu tego również i to się nie stanie – powiedział JHWH."
  tags: []
"Am7,7":
  text: "Potem to mi ukazał: Oto PAN stał na murze wybudowanym za pomocą pionu, a w ręku Jego pion."
  tags: []
"Am7,8":
  text: "I JHWH powiedział do mnie: Co ty widzisz, Amosie? I odpowiedziałem: Pion. Wtedy PAN powiedział: Oto ja umieszczam pion pośród mojego ludu, Izraela. Już mu więcej nie przepuszczę."
  tags: []
"Am7,9":
  text: "Wyżyny Izaaka zostaną spustoszone i święte miejsca Izraela zostaną całkowicie zniszczone; i powstanę z mieczem przeciwko domowi Jeroboama."
  tags: []
"Am7,10":
  text: "I posłał Amazjasz, kapłan Betel, do Jeroboama, króla Izraela taką wiadomość: Amos spiskuje przeciwko tobie pośród domu Izraela, tak że ziemia nie może wytrzymać wszystkich jego słów."
  tags: []
"Am7,11":
  text: "Bo tak mówi Amos: Jeroboam umrze od miecza, a Izrael na pewno zostanie uprowadzony ze swojej ziemi do niewoli."
  tags: []
"Am7,12":
  text: "I powiedział Amazjasz do Amosa: Widzący, idź, uciekaj do ziemi Judy i tam jedz chleb, i tam prorokuj."
  tags: []
"Am7,13":
  text: "A w Betel ponownie więcej nie prorokuj, bo to jest świątynia króla i dom królewski."
  tags: []
"Am7,14":
  text: "A w odpowiedzi Amos powiedział do Amazjasza: Nie jestem ja prorokiem ani nawet synem proroka, gdyż ja jestem pasterzem i nacinającym owoc sykomory."
  tags: []
"Am7,15":
  text: "Lecz JHWH wziął mnie, spoza stada, i powiedział do mnie JHWH: Idź, prorokuj do mojego ludu Izraela."
  tags: []
"Am7,16":
  text: "A teraz słuchaj Słowa JHWH. Ty mówisz: Nie prorokuj przeciwko Izraelowi i nie cedź słów przeciwko domowi Izaaka."
  tags: []
"Am7,17":
  text: "Dlatego tak mówi JHWH: Twoja żona będzie uprawiać nierząd w mieście, twoi synowie i twoje córki padną od miecza, twoja ziemia będzie podzielona sznurem mierniczym, a ty umrzesz w ziemi nieczystej; a Izrael na pewno zostanie uprowadzony do niewoli ze swojej ziemi."
  tags: []
