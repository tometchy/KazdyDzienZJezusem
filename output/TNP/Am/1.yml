"Am1,1":
  text: "Słowa Amosa, który był spośród pasterzy z Tekoa, które widział nad Izraelem w dniach Uzjasza, króla Judy i w dniach Jeroboama, syna Joasza, króla Izraela, dwa lata przed trzęsieniem ziemi."
  tags: []
"Am1,2":
  text: "I powiedział on: JHWH zaryczy jak lew z Syjonu, z Jerozolimy wyda swój głos; pastwiska pasterzy będą lamentować i wyschnie szczyt Karmelu."
  tags: []
"Am1,3":
  text: "Tak mówi JHWH: Z powodu trzech przestępstw Damaszku i z powodu czterech nie odwrócę tego, ponieważ młócili Gilead saniami z żelaza."
  tags: []
"Am1,4":
  text: "I ześlę ogień na dom Chazaela, i strawi on pałace Ben-Hadada."
  tags: []
"Am1,5":
  text: "Połamię też zasuwy Damaszku i wytnę mieszkańca z doliny Awen trzymającego berło z domu Eden. I pójdzie lud Aramu do niewoli do Kir, mówi JHWH."
  tags: []
"Am1,6":
  text: "Tak mówi JHWH: Z powodu trzech występków Gazy i z powodu czterech nie cofnę tego, ponieważ zabrali do niewoli wszystkich wygnańców, aby ich wydać Edomowi."
  tags: []
"Am1,7":
  text: "I ześlę ogień na mur Gazy, i strawi on jej pałace."
  tags: []
"Am1,8":
  text: "Wytnę też mieszkańca z Aszdodu i trzymającego berło z Aszkelonu, i zwrócę swoją rękę przeciwko Ekronowi i zginie resztka Filistynów, mówi JHWH PAN."
  tags: []
"Am1,9":
  text: "Tak mówi JHWH: Z powodu trzech występków Tyru i z powodu czterech nie cofnę tego, ponieważ wydali ich wszystkich w niewolę Edomowi, a nie pamiętali o braterskim przymierzu;"
  tags: []
"Am1,10":
  text: "I ześlę ogień na mur Tyru, i strawi on jego pałace."
  tags: []
"Am1,11":
  text: "Tak mówi JHWH: Z powodu trzech występków Edomu i z powodu czterech nie cofnę tego, ponieważ prześladował mieczem swojego brata i stłumił swoją litość, a jego gniew rozszarpuje nieustannie; swoją zapalczywość zachowywał na zawsze."
  tags: []
"Am1,12":
  text: "I ześlę ogień na Teman i strawi on pałace Bosry."
  tags: []
"Am1,13":
  text: "Tak mówi JHWH: Z powodu trzech przestępstw synów Ammona i z powodu czterech nie odwrócę tego, ponieważ rozpruwali brzemienne Gileadu, by poszerzyć swoje granice."
  tags: []
"Am1,14":
  text: "I rozniecę ogień na murze Rabby, i strawi on jej pałace wśród krzyku w dzień bitwy, wśród wichru w dzień burzy."
  tags: []
"Am1,15":
  text: "I pójdzie ich król do niewoli, on i jego książęta razem z nim, mówi JHWH."
  tags: []
