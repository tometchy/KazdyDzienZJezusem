"Am1,1": "Słowa Amosa, który był spośród pasterzy z Tekoa, które widział nad Izraelem w dniach Uzjasza, króla Judy i w dniach Jeroboama, syna Joasza, króla Izraela, dwa lata przed trzęsieniem ziemi."
"Am1,2": "I powiedział on: JHWH zaryczy jak lew z Syjonu, z Jerozolimy wyda swój głos; pastwiska pasterzy będą lamentować i wyschnie szczyt Karmelu."
"Am1,3": "Tak mówi JHWH: Z powodu trzech przestępstw Damaszku i z powodu czterech nie odwrócę tego, ponieważ młócili Gilead saniami z żelaza."
"Am1,4": "I ześlę ogień na dom Chazaela, i strawi on pałace Ben-Hadada."
"Am1,5": "Połamię też zasuwy Damaszku i wytnę mieszkańca z doliny Awen trzymającego berło z domu Eden. I pójdzie lud Aramu do niewoli do Kir, mówi JHWH."
"Am1,6": "Tak mówi JHWH: Z powodu trzech występków Gazy i z powodu czterech nie cofnę tego, ponieważ zabrali do niewoli wszystkich wygnańców, aby ich wydać Edomowi."
"Am1,7": "I ześlę ogień na mur Gazy, i strawi on jej pałace."
"Am1,8": "Wytnę też mieszkańca z Aszdodu i trzymającego berło z Aszkelonu, i zwrócę swoją rękę przeciwko Ekronowi i zginie resztka Filistynów, mówi JHWH PAN."
"Am1,9": "Tak mówi JHWH: Z powodu trzech występków Tyru i z powodu czterech nie cofnę tego, ponieważ wydali ich wszystkich w niewolę Edomowi, a nie pamiętali o braterskim przymierzu;"
"Am1,10": "I ześlę ogień na mur Tyru, i strawi on jego pałace."
"Am1,11": "Tak mówi JHWH: Z powodu trzech występków Edomu i z powodu czterech nie cofnę tego, ponieważ prześladował mieczem swojego brata i stłumił swoją litość, a jego gniew rozszarpuje nieustannie; swoją zapalczywość zachowywał na zawsze."
"Am1,12": "I ześlę ogień na Teman i strawi on pałace Bosry."
"Am1,13": "Tak mówi JHWH: Z powodu trzech przestępstw synów Ammona i z powodu czterech nie odwrócę tego, ponieważ rozpruwali brzemienne Gileadu, by poszerzyć swoje granice."
"Am1,14": "I rozniecę ogień na murze Rabby, i strawi on jej pałace wśród krzyku w dzień bitwy, wśród wichru w dzień burzy."
"Am1,15": "I pójdzie ich król do niewoli, on i jego książęta razem z nim, mówi JHWH."
