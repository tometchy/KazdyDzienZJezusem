"Am3,1":
  text: "Słuchajcie tego słowa, które JHWH powiedział przeciwko wam, synowie Izraela, przeciwko całemu rodowi, który wyprowadziłem z ziemi Egiptu, mówiąc to:"
  tags: []
"Am3,2":
  text: "Tylko was poznałem spośród wszystkich rodów ziemi, dlatego was ukarzę za wszystkie wasze nieprawości."
  tags: []
"Am3,3":
  text: "Czy dwóch idzie razem, jeśli się nie umówią?"
  tags: []
"Am3,4":
  text: "Czy lew ryczy w lesie, gdy nie ma łupu? Czy lwię wydaje swój głos ze swojego legowiska, jeśli nic nie złapało?"
  tags: []
"Am3,5":
  text: "Czy ptak wpadnie w sidła na ziemi, gdyby nie było na niego przynęty? Czy podnosi się sidła z ziemi, jeśli nic się w nie nie złapało?"
  tags: []
"Am3,6":
  text: "Jeśli zadmą w róg w mieście, to czy lud się nie ulęknie? Czy w mieście zdarzy się nieszczęście, którego JHWH by nie zarządził?"
  tags: []
"Am3,7":
  text: "Tak, JHWH PAN nic nie uczyni, jeśli nie objawi swojego planu swoim sługom, prorokom."
  tags: []
"Am3,8":
  text: "Lew ryknął, kto się nie ulęknie? JHWH PAN przemówił, kto by nie prorokował?"
  tags: []
"Am3,9":
  text: "Głoście w pałacach w Aszdodzie i w pałacach ziemi Egiptu i mówcie: Zbierzcie się na górach Samarii i zobaczcie wielkie zamieszanie w jej środku i ucisk w jej wnętrzu;"
  tags: []
"Am3,10":
  text: "Bo nie umieją czynić tego, co prawe – oświadczenie JHWH. Gromadzą gwałt i przemoc w swoich pałacach."
  tags: []
"Am3,11":
  text: "Dlatego tak mówi JHWH PAN: Wróg otoczy tę ziemię i pozbawi cię twojej siły i twoje pałace zostaną splądrowane."
  tags: []
"Am3,12":
  text: "Tak mówi JHWH: Jak pasterz wyrywa z paszczy lwa dwa podudzia lub kawałek ucha, tak zostaną wyrwani synowie Izraela, siedzący w Samarii na brzegu łoża i na jedwabnej kapie."
  tags: []
"Am3,13":
  text: "Słuchajcie i zaświadczcie w domu Jakuba – oświadczenie JHWH PANA, Boga Zastępów;"
  tags: []
"Am3,14":
  text: "Bo w tym dniu, w którym ukarzę Izraela za jego przestępstwa, ukarzę też ołtarze w Betel. I rogi ołtarza zostaną odrąbane, i upadną na ziemię."
  tags: []
"Am3,15":
  text: "I zburzę dom zimowy wraz z domem letnim, zginą domy z kości słoniowej i dla wielkich domów nastanie koniec – oświadczenie JHWH."
  tags: []
