"Am3,1": "Słuchajcie tego słowa, które JHWH powiedział przeciwko wam, synowie Izraela, przeciwko całemu rodowi, który wyprowadziłem z ziemi Egiptu, mówiąc to:"
"Am3,2": "Tylko was poznałem spośród wszystkich rodów ziemi, dlatego was ukarzę za wszystkie wasze nieprawości."
"Am3,3": "Czy dwóch idzie razem, jeśli się nie umówią?"
"Am3,4": "Czy lew ryczy w lesie, gdy nie ma łupu? Czy lwię wydaje swój głos ze swojego legowiska, jeśli nic nie złapało?"
"Am3,5": "Czy ptak wpadnie w sidła na ziemi, gdyby nie było na niego przynęty? Czy podnosi się sidła z ziemi, jeśli nic się w nie nie złapało?"
"Am3,6": "Jeśli zadmą w róg w mieście, to czy lud się nie ulęknie? Czy w mieście zdarzy się nieszczęście, którego JHWH by nie zarządził?"
"Am3,7": "Tak, JHWH PAN nic nie uczyni, jeśli nie objawi swojego planu swoim sługom, prorokom."
"Am3,8": "Lew ryknął, kto się nie ulęknie? JHWH PAN przemówił, kto by nie prorokował?"
"Am3,9": "Głoście w pałacach w Aszdodzie i w pałacach ziemi Egiptu i mówcie: Zbierzcie się na górach Samarii i zobaczcie wielkie zamieszanie w jej środku i ucisk w jej wnętrzu;"
"Am3,10": "Bo nie umieją czynić tego, co prawe – oświadczenie JHWH. Gromadzą gwałt i przemoc w swoich pałacach."
"Am3,11": "Dlatego tak mówi JHWH PAN: Wróg otoczy tę ziemię i pozbawi cię twojej siły i twoje pałace zostaną splądrowane."
"Am3,12": "Tak mówi JHWH: Jak pasterz wyrywa z paszczy lwa dwa podudzia lub kawałek ucha, tak zostaną wyrwani synowie Izraela, siedzący w Samarii na brzegu łoża i na jedwabnej kapie."
"Am3,13": "Słuchajcie i zaświadczcie w domu Jakuba – oświadczenie JHWH PANA, Boga Zastępów;"
"Am3,14": "Bo w tym dniu, w którym ukarzę Izraela za jego przestępstwa, ukarzę też ołtarze w Betel. I rogi ołtarza zostaną odrąbane, i upadną na ziemię."
"Am3,15": "I zburzę dom zimowy wraz z domem letnim, zginą domy z kości słoniowej i dla wielkich domów nastanie koniec – oświadczenie JHWH."
