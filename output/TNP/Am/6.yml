"Am6,1": "Biada beztroskim na Syjonie i pokładającym ufność na górze Samarii; dostojnikom pierwszego z narodów, do nich schodzi się dom Izraela."
"Am6,2": "Przejdźcie do Kalne i zobaczcie, a stamtąd idźcie do Chamatrabba, i zejdźcie do Gat filistyńskiego. Czy jesteście lepsi niż te królestwa? Czy ich obszar jest większy niż wasz obszar?"
"Am6,3": "Którzy odsuwają od siebie dzień zły, a zbliżają się do miejsca przemocy;"
"Am6,4": "Którzy odprężają się na łożach obłożonych kością słoniową i rozciągają się na swoich kanapach, jedzą jagnięta ze stada i cielęta ze środka obory;"
"Am6,5": "Którzy brzdąkają leniwie na strunach harfy i wymyślają dla siebie instrumenty muzyczne jak Dawid;"
"Am6,6": "Którzy piją wino z czasz i namaszczają się najlepszymi olejkami, a nie boleją nad ruiną Józefa."
"Am6,7": "Dlatego też teraz pójdą do niewoli na czele pojmanych i skończy się wrzask hulaków."
"Am6,8": "JHWH PAN przysiągł na swoją duszę – oświadczenie JHWH, Boga Zastępów: Ja brzydzę się pychą Jakuba i nienawidzę jego pałaców. I wydam miasto i wszystko, co go wypełnia."
"Am6,9": "A stanie się tak: Jeśli pozostanie dziesięciu mężczyzn w jednym domu i oni umrą."
"Am6,10": "I weźmie go jego krewny, i spali go, aby wynieść kości na zewnątrz domu. I powie do tego, który jest w zakamarkach domu: Czy ktoś jest jeszcze z tobą? A ten odpowie: Nie ma. I powie: Milcz, bo nie wolno wspominać imienia JHWH."
"Am6,11": "Bo oto JHWH rozkaże i rozbije wielki dom w gruzy, a mały dom w kawałki."
"Am6,12": "Czy konie biegają po skale? Czy orze się tam wołami? Bo sąd zamieniliście w truciznę, a owoc sprawiedliwości w piołun."
"Am6,13": "Wy, którzy radujecie się z Lo Dabar, mówicie: Czy nie wzięliśmy własną siłą Karanaim?"
"Am6,14": "Lecz oto ja wzbudzę naród przeciwko wam, domu Izraela – wyrocznia JHWH, Boga Zastępów – który was będzie uciskał od wejścia do Chamat aż do strumienia Araby."
