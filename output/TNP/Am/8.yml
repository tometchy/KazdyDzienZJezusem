"Am8,1": "To mi ukazał JHWH PAN: Oto ujrzałem kosz letnich owoców."
"Am8,2": "I powiedział: Co widzisz, Amosie? I powiedziałem: Kosz letnich owoców. I ponownie JHWH powiedział do mnie: Nadszedł koniec mojego ludu, Izraela. Już mu więcej nie przepuszczę."
"Am8,3": "W tym dniu zawodzić będą pieśniami świątyni – oświadczenie JHWH PANA. Mnóstwo zwłok na każdym miejscu. Porozrzucał! Cicho!"
"Am8,4": "Słuchajcie tego, wy, którzy depczecie ubogiego, aby zniszczyć biednych tej ziemi;"
"Am8,5": "Mówiąc: Kiedy przeminie nów, abyśmy mogli sprzedać zboże? I szabat, abyśmy wystawili ziarno na sprzedaż i mogli umniejszać efę, podwyższać sykl i szale podstępnie fałszować;"
"Am8,6": "Aby kupować ubogich za srebro, a nędzarza za cenę pary sandałów i sprzedawać poślad zboża?"
"Am8,7": "Przysiągł JHWH na chlubę Jakuba:Nigdy nie zapomnę wszystkich ich dzieł."
"Am8,8": "Czyż z tego powodu nie zadrży ziemia i będzie lamentował każdy, kto w niej mieszka? I wzniesie się cała ona jak rzeka i zostanie wzburzona, i opadnie jak rzeka Egiptu."
"Am8,9": "I stanie się w tym dniu – oświadczenie JHWH PANA – sprawię, że słońce zajdzie w południe, a w jasny dzień okryję ziemię mrokiem;"
"Am8,10": "I zamienię wasze święta w żałobę, a wszystkie wasze pieśni w lament. Na wszystkie biodra włożę wór i na każdej głowie zrobię łysinę. I sprawię, że będzie jej jak w żałobie po jedynaku, jej koniec jak dzień goryczy."
"Am8,11": "Oto nadchodzą dni – oświadczenie JHWH PANA – gdy ześlę głód na ziemię, nie głód chleba i nie pragnienia wody, ale słuchania Słów JHWH."
"Am8,12": "I powloką się od morza do morza, i od północy aż na wschód będą błąkać się, szukając Słowa JHWH, ale go nie znajdą."
"Am8,13": "W tym dniu piękne dziewice i nawet młodzieńcy zemdleją z pragnienia."
"Am8,14": "Ci, którzy przysięgają na grzech Samarii i mówią: Jak żyje twój bóg, Danie, i jak żyje twoja droga Beer-Szebo, ci upadną i już więcej nie powstaną."
