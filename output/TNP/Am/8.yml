"Am8,1":
  text: "To mi ukazał JHWH PAN: Oto ujrzałem kosz letnich owoców."
  tags: []
"Am8,2":
  text: "I powiedział: Co widzisz, Amosie? I powiedziałem: Kosz letnich owoców. I ponownie JHWH powiedział do mnie: Nadszedł koniec mojego ludu, Izraela. Już mu więcej nie przepuszczę."
  tags: []
"Am8,3":
  text: "W tym dniu zawodzić będą pieśniami świątyni – oświadczenie JHWH PANA. Mnóstwo zwłok na każdym miejscu. Porozrzucał! Cicho!"
  tags: []
"Am8,4":
  text: "Słuchajcie tego, wy, którzy depczecie ubogiego, aby zniszczyć biednych tej ziemi;"
  tags: []
"Am8,5":
  text: "Mówiąc: Kiedy przeminie nów, abyśmy mogli sprzedać zboże? I szabat, abyśmy wystawili ziarno na sprzedaż i mogli umniejszać efę, podwyższać sykl i szale podstępnie fałszować;"
  tags: []
"Am8,6":
  text: "Aby kupować ubogich za srebro, a nędzarza za cenę pary sandałów i sprzedawać poślad zboża?"
  tags: []
"Am8,7":
  text: "Przysiągł JHWH na chlubę Jakuba:Nigdy nie zapomnę wszystkich ich dzieł."
  tags: []
"Am8,8":
  text: "Czyż z tego powodu nie zadrży ziemia i będzie lamentował każdy, kto w niej mieszka? I wzniesie się cała ona jak rzeka i zostanie wzburzona, i opadnie jak rzeka Egiptu."
  tags: []
"Am8,9":
  text: "I stanie się w tym dniu – oświadczenie JHWH PANA – sprawię, że słońce zajdzie w południe, a w jasny dzień okryję ziemię mrokiem;"
  tags: []
"Am8,10":
  text: "I zamienię wasze święta w żałobę, a wszystkie wasze pieśni w lament. Na wszystkie biodra włożę wór i na każdej głowie zrobię łysinę. I sprawię, że będzie jej jak w żałobie po jedynaku, jej koniec jak dzień goryczy."
  tags: []
"Am8,11":
  text: "Oto nadchodzą dni – oświadczenie JHWH PANA – gdy ześlę głód na ziemię, nie głód chleba i nie pragnienia wody, ale słuchania Słów JHWH."
  tags: []
"Am8,12":
  text: "I powloką się od morza do morza, i od północy aż na wschód będą błąkać się, szukając Słowa JHWH, ale go nie znajdą."
  tags: []
"Am8,13":
  text: "W tym dniu piękne dziewice i nawet młodzieńcy zemdleją z pragnienia."
  tags: []
"Am8,14":
  text: "Ci, którzy przysięgają na grzech Samarii i mówią: Jak żyje twój bóg, Danie, i jak żyje twoja droga Beer-Szebo, ci upadną i już więcej nie powstaną."
  tags: []
