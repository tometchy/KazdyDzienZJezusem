"Am2,1":
  text: "Tak mówi JHWH: Z powodu trzech występków Moabu i z powodu czterech nie odwrócę tego, ponieważ spalił kości króla Edomu na wapno."
  tags: []
"Am2,2":
  text: "I ześlę ogień na Moab, i strawi pałace Keriotu. I umrze Moab wśród wrzawy, wśród krzyku i przy dźwięku trąby."
  tags: []
"Am2,3":
  text: "I wytnę sędziego spośród niego, i zabiję wraz z nim wszystkich jego książąt, mówi JHWH."
  tags: []
"Am2,4":
  text: "Tak mówi JHWH: Z powodu trzech przestępstw Judy i z powodu czterech nie odwrócę tego, ponieważ odrzucili Prawo JHWH i nie przestrzegali jego przykazań, i zwiodły ich, ich ułudy, za którymi chodzili ich ojcowie."
  tags: []
"Am2,5":
  text: "I ześlę ogień na Judę, i strawi on pałace Jerozolimy."
  tags: []
"Am2,6":
  text: "Tak mówi JHWH: Z powodu trzech przestępstw Izraela i z powodu czterech nie odwrócę tego, ponieważ sprzedali sprawiedliwego za srebro, a potrzebującego za parę sandałów;"
  tags: []
"Am2,7":
  text: "Depczą w prochu ziemi głowy ubogich i drogę pokornych wypaczają. A syn i jego ojciec chodzą do tej samej dziewczyny, aby splamić moje święte imię."
  tags: []
"Am2,8":
  text: "I na szatach danych im w zastaw rozciągają się przy każdym ołtarzu, a za pieniądze ukaranych grzywną piją wino w domu swojego Boga."
  tags: []
"Am2,9":
  text: "A ja wygubiłem sprzed ich oblicza Amorytę, który był wysoki jak cedry, i mocny on jak dęby. Wygubiłem jednak jego owoc od góry, a od dołu jego korzenie."
  tags: []
"Am2,10":
  text: "To ja wyprowadziłem was z ziemi Egiptu i prowadziłem przez pustynię czterdzieści lat, abyście posiedli ziemię Amoryty."
  tags: []
"Am2,11":
  text: "I ustanawiałem spośród waszych synów proroków, a spośród waszych młodzieńców nazyrejczyków. Czy nie było tak, synowie Izraela? – oświadczenie JHWH."
  tags: []
"Am2,12":
  text: "Lecz wy poiliście nazyrejczyków winem, a prorokom rozkazywaliście, mówiąc: Nie prorokujcie."
  tags: []
"Am2,13":
  text: "Oto ja szarpnę pod wami, tak jak szarpie się wóz pełen snopów."
  tags: []
"Am2,14":
  text: "Nie uda się ucieczka szybkiemu, mocny nie wzmocni swojej siły, a mocarz nie wybawi swojej duszy."
  tags: []
"Am2,15":
  text: "A trzymający łuk nie ostoi się i szybki nie uratuje się na swoich nogach, a dosiadający konia nie wybawi swojej duszy."
  tags: []
"Am2,16":
  text: "I najodważniejszy swym sercem spośród mocarzy ucieknie w tym dniu nagi – oświadczenie JHWH."
  tags: []
