"Am2,1": "Tak mówi JHWH: Z powodu trzech występków Moabu i z powodu czterech nie odwrócę tego, ponieważ spalił kości króla Edomu na wapno."
"Am2,2": "I ześlę ogień na Moab, i strawi pałace Keriotu. I umrze Moab wśród wrzawy, wśród krzyku i przy dźwięku trąby."
"Am2,3": "I wytnę sędziego spośród niego, i zabiję wraz z nim wszystkich jego książąt, mówi JHWH."
"Am2,4": "Tak mówi JHWH: Z powodu trzech przestępstw Judy i z powodu czterech nie odwrócę tego, ponieważ odrzucili Prawo JHWH i nie przestrzegali jego przykazań, i zwiodły ich, ich ułudy, za którymi chodzili ich ojcowie."
"Am2,5": "I ześlę ogień na Judę, i strawi on pałace Jerozolimy."
"Am2,6": "Tak mówi JHWH: Z powodu trzech przestępstw Izraela i z powodu czterech nie odwrócę tego, ponieważ sprzedali sprawiedliwego za srebro, a potrzebującego za parę sandałów;"
"Am2,7": "Depczą w prochu ziemi głowy ubogich i drogę pokornych wypaczają. A syn i jego ojciec chodzą do tej samej dziewczyny, aby splamić moje święte imię."
"Am2,8": "I na szatach danych im w zastaw rozciągają się przy każdym ołtarzu, a za pieniądze ukaranych grzywną piją wino w domu swojego Boga."
"Am2,9": "A ja wygubiłem sprzed ich oblicza Amorytę, który był wysoki jak cedry, i mocny on jak dęby. Wygubiłem jednak jego owoc od góry, a od dołu jego korzenie."
"Am2,10": "To ja wyprowadziłem was z ziemi Egiptu i prowadziłem przez pustynię czterdzieści lat, abyście posiedli ziemię Amoryty."
"Am2,11": "I ustanawiałem spośród waszych synów proroków, a spośród waszych młodzieńców nazyrejczyków. Czy nie było tak, synowie Izraela? – oświadczenie JHWH."
"Am2,12": "Lecz wy poiliście nazyrejczyków winem, a prorokom rozkazywaliście, mówiąc: Nie prorokujcie."
"Am2,13": "Oto ja szarpnę pod wami, tak jak szarpie się wóz pełen snopów."
"Am2,14": "Nie uda się ucieczka szybkiemu, mocny nie wzmocni swojej siły, a mocarz nie wybawi swojej duszy."
"Am2,15": "A trzymający łuk nie ostoi się i szybki nie uratuje się na swoich nogach, a dosiadający konia nie wybawi swojej duszy."
"Am2,16": "I najodważniejszy swym sercem spośród mocarzy ucieknie w tym dniu nagi – oświadczenie JHWH."
