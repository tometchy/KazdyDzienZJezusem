"Am4,1": "Słuchajcie tego słowa, krowy Baszanu, które na górach Samarii uciskacie biednych i niszczycie ubogich, mówiąc ich panom: Przynieście, a będziemy piły."
"Am4,2": "Przysiągł JHWH PAN na swoją świętość, że oto nadejdą na was dni, gdy wywleką was hakami, a wasze potomstwo rybackimi kolcami."
"Am4,3": "I przez wyłomy wyjdziecie, każda wprost przed siebie, i będziecie wyrzucone do Harmonu – oświadczenie JHWH."
"Am4,4": "Przychodźcie do Betel i grzeszcie, w Gilgal rozmnóżcie swój grzech; przynoście każdego ranka swoje ofiary, a co trzy dni – swoje dziesięciny;"
"Am4,5": "I spalajcie kwaszony chleb na dziękczynienie, i obwołujcie dobrowolne ofiary rozgłaszając je, bo tak wam się podoba, synowie Izraela – oświadczenie JHWH PANA."
"Am4,6": "A chociaż ja dałem wam czystość zębów we wszystkich waszych miastach i niedostatek chleba po wszystkich waszych miejscach, to nie nawróciliście się do mnie – oświadczenie JHWH."
"Am4,7": "I chociaż to ja wstrzymałem wam deszcz, na trzy miesiące przed żniwami. I spuszczałem deszcz na jedno miasto, a na drugie miasto nie spuszczałem deszczu. Jedną część pola zraszałem deszczem, a druga część, której deszcz nie zraszał – usychała."
"Am4,8": "I wlekliście się z dwóch, z trzech miast do jednego miasta, aby napić się wody i nie zaspokoiliście swojego pragnienia, a nie nawróciliście się do mnie – oświadczenie JHWH."
"Am4,9": "Smagałem was posuchą zboża i pleśnią, gdy rosły wasze ogrody i winnice. Wasze drzewa figowe i drzewa oliwne pożarła szarańcza, a nie nawróciliście się do mnie – oświadczenie JHWH."
"Am4,10": "Zesłałem na was zarazę, tak jak na drodze do Egiptu, zgładziłem mieczem waszych młodzieńców, łupem stały się wasze konie i sprawiłem, że smród pobitych w waszych obozach uniósł się do waszych nozdrzy, a nie nawróciliście się do mnie – oświadczenie JHWH."
"Am4,11": "Zniszczyłem was, jak Bóg zniszczył Sodomę i Gomorę, i staliście się jak polano wyrwane z ognia, a nie nawróciliście się do mnie – oświadczenie JHWH."
"Am4,12": "Dlatego tak uczynię tobie, Izraelu, a ponieważ zamierzam ci tak uczynić, przygotuj się na spotkanie ze swoim Bogiem, Izraelu!"
"Am4,13": "Gdyż oto: On jest tym, który formuje góry, tworzy wiatr, oznajmia człowiekowi, co jest Jego zamysłem; On czyni świt ciemnością i stąpa po wyżynach ziemi. JHWH, Bóg Zastępów, to Jego imię."
