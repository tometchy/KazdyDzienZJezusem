"Am9,1": "Widziałem PANA stojącego przy ołtarzu i powiedział: Uderz w głowicę kolumny, a zadrżą progi, i odłam je na głowy ich wszystkich, a resztę ich zabiję mieczem. Żaden z nich – uciekający – nie ujdzie i żaden z nich – uchodźca – nie uratuje się."
"Am9,2": "Choćby się dokopali aż do Szeolu, moja ręka wyciągnie ich stamtąd; a choćby wstąpili aż do niebios – i stamtąd ich ściągnę."
"Am9,3": "A choćby schowali się na szczycie Karmelu, tam ich odszukam i wezmę stamtąd; a choćby się ukryli przed moimi oczami na dnie morza, rozkażę wężowi i ukąsi ich;"
"Am9,4": "A choćby poszli do niewoli przed obliczem swoich wrogów, nawet tam rozkażę mieczowi i zabije ich. I skieruję moje oko przeciwko nim dla zła, a nie dla dobra."
"Am9,5": "Bo JHWH PAN Zastępów dotyka ziemi, a ta topnieje, i płaczą wszyscy jej mieszkańcy. I wzniesie się ona cała jak rzeka, i opadnie jak rzeka Egiptu."
"Am9,6": "Ten, który buduje w niebiosach swoje kondygnacje, a swoje sklepienie posadawia na ziemi; Ten, który przywołuje wody morza i rozlewa je po powierzchni ziemi. JHWH to Jego imię."
"Am9,7": "Synowie Izraela, czy nie wy jesteście dla mnie jak synowie Kuszytów? – oświadczenie JHWH. Czy nie wyprowadziłem Izraela z ziemi Egiptu, Filistynów z Kaftor i Aramejczyków z Kir?"
"Am9,8": "Oto moje oczy – JHWH PANA – zwrócone są na to grzeszne królestwo i zgładzę je z powierzchni ziemi. Jednak nie zgładzę doszczętnie domu Jakuba – oświadczenie JHWH."
"Am9,9": "Oto bowiem ja rozkażę i przesieję dom Izraela pośród wszystkich narodów, jak przesiewa się przetakiem, i żaden kamyk nie upadnie na ziemię."
"Am9,10": "Od miecza umrą wszyscy grzesznicy spośród mojego ludu, ci, którzy mówią: Nie zbliży się do nas i nie zaskoczy nas to zło."
"Am9,11": "W tym dniu podniosę upadły szałas Dawida i zamuruję jego wyłomy; wzniosę jego ruiny i odbuduję go, jak za dawnych dni;"
"Am9,12": "Aby posiedli resztki Edomu i wszystkie narody, nad którymi zostało wezwane moje imię – oświadczenie JHWH – który to czyni."
"Am9,13": "Oto nadchodzą dni – oświadczenie JHWH – że oracz zbliży się do żniwiarza, a depczący winogrona do siejącego ziarno; góry będą ociekać moszczem, a wszystkie pagórki nim spłyną."
"Am9,14": "I odwrócę niewolę mojego ludu, Izraela; odbudują miasta spustoszone i zamieszkają w nich; zasadzą też winnice i będą pić z nich wino; założą też ogrody i będą jedli ich owoce."
"Am9,15": "Zasadzę ich na ich ziemi; i nie zostaną wyrwani już więcej z ich ziemi, którą im dałem – mówi JHWH, twój Bóg."
