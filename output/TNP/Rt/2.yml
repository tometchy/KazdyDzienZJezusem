"Rt2,1": "A Noemi miała krewnego ze strony męża, człowieka bardzo zamożnego z domu Elimelecha, a jego imię brzmiało Boaz."
"Rt2,2": "I powiedziała Rut Moabitka do Noemi: Pozwól proszę mi pójść na pole, a będę zbierać kłosy za tym, w którego oczach znajdę łaskę. A ona jej odpowiedziała: Idź, moja córko."
"Rt2,3": "Poszła więc, a gdy przybyła i zbierała na polu za żeńcami, stało się, że natknęła się na część pola Boaza, który był z rodu Elimeleka."
"Rt2,4": "A oto i Boaz przyszedł z Betlejem i powiedział do żeńców: JHWH z wami. I odpowiedzieli mu: Niech ci JHWH błogosławi!"
"Rt2,5": "Wtedy Boaz powiedział do swojego sługi ustanowionego nad żeńcami: Do kogo należy ta młoda kobieta?"
"Rt2,6": "A sługa ustanowiony nad żeńcami odpowiedział mu: To jest ta młoda Moabitka, która powróciła z Noemi z pól Moabu."
"Rt2,7": "Powiedziała: Chciałabym, proszę, zbierać a potem gromadzić kłosy w snopy za żeńcami. Przyszła więc i pozostała od poranku aż do teraz. Tego jej odpoczynku w domu było niewiele."
"Rt2,8": "Wtedy Boaz powiedział do Rut: Czy nie słyszałaś moja córko! Nie chodź zbierać kłosów na inne pole i nie opuszczaj tego właśnie miejsca ale przyłącz się tu do moich służących."
"Rt2,9": "Zwróć swoje oczy na pole, na którym będą żąć, i chodź za nimi. Czyż nie nakazałem swoim sługom, aby cię nie nagabywać? A jeśli będziesz spragniona, podejdź do naczyń i napij się z tego, co czerpią moi słudzy."
"Rt2,10": "Wtedy upadła na twarz i pokłoniła się mu do ziemi, i powiedziała do niego: Dlaczego znalazłam łaskę w twoich oczach, że zwracasz na mnie uwagę, choć ja jestem cudzoziemką?"
"Rt2,11": "A Boaz odpowiedział jej i rzekł: Dokładnie opowiedziano mi o wszystkim, co uczyniłaś dla swojej teściowej po śmierci twojego męża, i że opuściłaś swojego ojca i swoją matkę oraz ziemię swojego urodzenia, i przyszłaś do ludu, którego przedtem nie znałaś."
"Rt2,12": "Niech JHWH wynagrodzi twój czyn i niech będzie pełna twoja zapłata od JHWH, Boga Izraela, pod którego skrzydła przyszłaś się schronić."
"Rt2,13": "A ona odpowiedziała: Znalazłam łaskę w twoich oczach, mój panie. Bo pocieszyłeś mnie, a także przemówiłeś do serca – do swojej służebnicy, chociaż ja nie będę nawet jak jedna z twoich służebnic."
"Rt2,14": "A Boaz jej powiedział w porze posiłku: Podejdź tu i jedz z tego chleba, i zanurzaj swój kawałek w kwaśnej polewce. Usiadła więc z boku żniwiarzy, a on podawał jej prażone ziarno. I jadła, i nasyciła się – a resztę zatrzymała."
"Rt2,15": "A gdy wstała, aby zbierać kłosy, Boaz nakazał swoim sługom, mówiąc: Niech zbiera nawet między snopami i nie zawstydzajcie jej."
"Rt2,16": "A nawet umyślnie wyciągajcie ze snopów i pozostawiajcie je, niech zbiera i nie gańcie jej."
"Rt2,17": "I zbierała na tym polu aż do wieczora, a potem wymłóciła to, co zebrała. Było tego około efy jęczmienia."
"Rt2,18": "Następnie zarzuciła to na siebie i poszła do miasta, a jej teściowa zobaczyła to, co nazbierała. Wyjęła też i dała jej to, co pozostało jej z tego, co zachowała ze swojego nadmiaru."
"Rt2,19": "I powiedziała do niej jej teściowa: Gdzie zbierałaś dzisiaj i gdzie pracowałaś? Niech będzie błogosławiony ten, który zwrócił na ciebie uwagę. I opowiedziała swojej teściowej, u kogo pracowała, i powiedziała: Imię tego człowieka, u którego dzisiaj pracowałam brzmi Boaz."
"Rt2,20": "Wtedy Noemi odezwała się do swojej synowej: Błogosławiony on u JHWH, który nie zaniechał swojego miłosierdzia wobec żywych i wobec umarłych. Nadto Noemi powiedziała jej: Ten człowiek jest naszym bliskim krewnym, jest on jednym z naszych wykupicieli."
"Rt2,21": "Wtedy Rut Moabitka powiedziała także: Tak, ten człowiek powiedział do mnie: Przyłącz się do moich służących, aż do zakończenia całego mojego żniwa."
"Rt2,22": "I powiedziała Noemi do Rut, swojej synowej: To dobrze, moja córko, że będziesz wychodziła w pole z jego służącymi i nie będą ci przeciwni ludzie na innym polu."
"Rt2,23": "I przyłączyła się do służących Boaza i zbierała kłosy, dopóki nie skończyły się żniwa jęczmienia i żniwa pszenicy, a mieszkała ze swoją teściową."
