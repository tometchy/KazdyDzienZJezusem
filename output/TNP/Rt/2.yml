"Rt2,1":
  text: "A Noemi miała krewnego ze strony męża, człowieka bardzo zamożnego z domu Elimelecha, a jego imię brzmiało Boaz."
  tags: []
"Rt2,2":
  text: "I powiedziała Rut Moabitka do Noemi: Pozwól proszę mi pójść na pole, a będę zbierać kłosy za tym, w którego oczach znajdę łaskę. A ona jej odpowiedziała: Idź, moja córko."
  tags: []
"Rt2,3":
  text: "Poszła więc, a gdy przybyła i zbierała na polu za żeńcami, stało się, że natknęła się na część pola Boaza, który był z rodu Elimeleka."
  tags: []
"Rt2,4":
  text: "A oto i Boaz przyszedł z Betlejem i powiedział do żeńców: JHWH z wami. I odpowiedzieli mu: Niech ci JHWH błogosławi!"
  tags: []
"Rt2,5":
  text: "Wtedy Boaz powiedział do swojego sługi ustanowionego nad żeńcami: Do kogo należy ta młoda kobieta?"
  tags: []
"Rt2,6":
  text: "A sługa ustanowiony nad żeńcami odpowiedział mu: To jest ta młoda Moabitka, która powróciła z Noemi z pól Moabu."
  tags: []
"Rt2,7":
  text: "Powiedziała: Chciałabym, proszę, zbierać a potem gromadzić kłosy w snopy za żeńcami. Przyszła więc i pozostała od poranku aż do teraz. Tego jej odpoczynku w domu było niewiele."
  tags: []
"Rt2,8":
  text: "Wtedy Boaz powiedział do Rut: Czy nie słyszałaś moja córko! Nie chodź zbierać kłosów na inne pole i nie opuszczaj tego właśnie miejsca ale przyłącz się tu do moich służących."
  tags: []
"Rt2,9":
  text: "Zwróć swoje oczy na pole, na którym będą żąć, i chodź za nimi. Czyż nie nakazałem swoim sługom, aby cię nie nagabywać? A jeśli będziesz spragniona, podejdź do naczyń i napij się z tego, co czerpią moi słudzy."
  tags: []
"Rt2,10":
  text: "Wtedy upadła na twarz i pokłoniła się mu do ziemi, i powiedziała do niego: Dlaczego znalazłam łaskę w twoich oczach, że zwracasz na mnie uwagę, choć ja jestem cudzoziemką?"
  tags: []
"Rt2,11":
  text: "A Boaz odpowiedział jej i rzekł: Dokładnie opowiedziano mi o wszystkim, co uczyniłaś dla swojej teściowej po śmierci twojego męża, i że opuściłaś swojego ojca i swoją matkę oraz ziemię swojego urodzenia, i przyszłaś do ludu, którego przedtem nie znałaś."
  tags: []
"Rt2,12":
  text: "Niech JHWH wynagrodzi twój czyn i niech będzie pełna twoja zapłata od JHWH, Boga Izraela, pod którego skrzydła przyszłaś się schronić."
  tags: []
"Rt2,13":
  text: "A ona odpowiedziała: Znalazłam łaskę w twoich oczach, mój panie. Bo pocieszyłeś mnie, a także przemówiłeś do serca – do swojej służebnicy, chociaż ja nie będę nawet jak jedna z twoich służebnic."
  tags: []
"Rt2,14":
  text: "A Boaz jej powiedział w porze posiłku: Podejdź tu i jedz z tego chleba, i zanurzaj swój kawałek w kwaśnej polewce. Usiadła więc z boku żniwiarzy, a on podawał jej prażone ziarno. I jadła, i nasyciła się – a resztę zatrzymała."
  tags: []
"Rt2,15":
  text: "A gdy wstała, aby zbierać kłosy, Boaz nakazał swoim sługom, mówiąc: Niech zbiera nawet między snopami i nie zawstydzajcie jej."
  tags: []
"Rt2,16":
  text: "A nawet umyślnie wyciągajcie ze snopów i pozostawiajcie je, niech zbiera i nie gańcie jej."
  tags: []
"Rt2,17":
  text: "I zbierała na tym polu aż do wieczora, a potem wymłóciła to, co zebrała. Było tego około efy jęczmienia."
  tags: []
"Rt2,18":
  text: "Następnie zarzuciła to na siebie i poszła do miasta, a jej teściowa zobaczyła to, co nazbierała. Wyjęła też i dała jej to, co pozostało jej z tego, co zachowała ze swojego nadmiaru."
  tags: []
"Rt2,19":
  text: "I powiedziała do niej jej teściowa: Gdzie zbierałaś dzisiaj i gdzie pracowałaś? Niech będzie błogosławiony ten, który zwrócił na ciebie uwagę. I opowiedziała swojej teściowej, u kogo pracowała, i powiedziała: Imię tego człowieka, u którego dzisiaj pracowałam brzmi Boaz."
  tags: []
"Rt2,20":
  text: "Wtedy Noemi odezwała się do swojej synowej: Błogosławiony on u JHWH, który nie zaniechał swojego miłosierdzia wobec żywych i wobec umarłych. Nadto Noemi powiedziała jej: Ten człowiek jest naszym bliskim krewnym, jest on jednym z naszych wykupicieli."
  tags: []
"Rt2,21":
  text: "Wtedy Rut Moabitka powiedziała także: Tak, ten człowiek powiedział do mnie: Przyłącz się do moich służących, aż do zakończenia całego mojego żniwa."
  tags: []
"Rt2,22":
  text: "I powiedziała Noemi do Rut, swojej synowej: To dobrze, moja córko, że będziesz wychodziła w pole z jego służącymi i nie będą ci przeciwni ludzie na innym polu."
  tags: []
"Rt2,23":
  text: "I przyłączyła się do służących Boaza i zbierała kłosy, dopóki nie skończyły się żniwa jęczmienia i żniwa pszenicy, a mieszkała ze swoją teściową."
  tags: []
