"Rt1,1": "I stało się w dniach sądzenia sędziów, że nastał głód na ziemi. I wówczas wyszedł pewien mąż z Betlejem w Judzie, aby zatrzymać się na polach Moabu. On i jego żona i dwóch jego synów."
"Rt1,2": "A imię tego męża brzmi Elimelek, imię jego żony brzmi Noemi, a imiona jego dwóch synów to Machlon i Kilion – Efratejczycy z Betlejem w Judzie. Przybyli na pola Moabu i tam przebywali."
"Rt1,3": "Potem umarł Elimelek, mąż Noemi, i została sama – ona i jej dwaj synowie."
"Rt1,4": "A ci wzięli sobie za żony Moabitki: jedna miała na imię Orfa, a druga miała na imię Rut. I mieszkali tam około dziesięciu lat."
"Rt1,5": "Lecz również oni obaj umarli – Machlon i Kilion, i kobieta ta pozostała sama bez swoich dwóch chłopców i bez swojego męża."
"Rt1,6": "Wtedy powstała ona i jej synowe i wróciła z pól Moabu, bo usłyszała na polach Moabu, że JHWH nawiedził swój lud, aby im dać chleb."
"Rt1,7": "Wyszła więc z miejsca, w którym była, i obie jej synowe razem z nią i poszły w drogę, aby wrócić do ziemi Judy."
"Rt1,8": "I powiedziała Noemi do obu swoich synowych: Idźcie, wróćcie – każda z was do domu swojej matki. Niech JHWH okaże wam miłosierdzie, tak jak okazałyście wobec zmarłych i wobec mnie."
"Rt1,9": "Niech JHWH da wam, aby każda z was znalazła odpoczynek w domu swojego męża. I pocałowała je, a one podniosły swój głos i zapłakały."
"Rt1,10": "I mówiły do niej: Tak! Z tobą wrócimy do twojego ludu."
"Rt1,11": "Lecz Noemi odpowiedziała: Zawróćcie, moje córki! Po co macie iść ze mną? Czy mam jeszcze w swoim wnętrzu synów, którzy to mogliby stać się waszymi mężami?"
"Rt1,12": "Zawróćcie, moje córki! Idźcie, bo jestem zbyt stara, aby być z mężem. A gdybym powiedziała: Mam jeszcze nadzieję, że będę tej nocy z mężem, a także urodzę synów;"
"Rt1,13": "To czy wy czekałybyście na nich, aż ci dorosną? Czy więc wy wyrzekłybyście się, by żyć bez męża? Nie, moje córki! Bo gorzko mi bardzo z waszego powodu, że ręka JHWH wystąpiła przeciwko mnie."
"Rt1,14": "A one ponownie podniosły głos i zapłakały. I Orfa pocałowała swoją teściową, ale Rut przylgnęła do niej."
"Rt1,15": "A ta powiedziała do niej: Spójrz, twoja szwagierka wróciła do swojego ludu i do swoich bogów. Zawróć za swoją szwagierką."
"Rt1,16": "Lecz Rut odpowiedziała: Nie nalegaj na mnie, że mam cię opuścić i odejść od ciebie. Bo dokąd pójdziesz, ja pójdę, i gdzie osiądziesz i ja osiądę. Twój lud będzie moim ludem, a twój Bóg będzie moim Bogiem."
"Rt1,17": "Tam gdzie umrzesz, umrę – i tam zostanę pogrzebana. Tak niech JHWH mi uczyni i tak niech do tego doda, jeśli coś innego niż śmierć oddzieli mnie i ciebie."
"Rt1,18": "A gdy Noemi zobaczyła, żeona uparła się, aby z nią iść, to przestała do niej mówić."
"Rt1,19": "I szły obie, aż przyszły do Betlejem. I stało się, gdy przyszły do Betlejem, że całe miasto zostało poruszone z ich powodu i kobiety mówiły: Czy to jest Noemi?!"
"Rt1,20": "Lecz ona powiedziała do nich: Nie nazywajcie mnie Noemi, nazywajcie mnie Mara, bo Wszechmogący uczynił mnie bardzo gorzką."
"Rt1,21": "Ja wyszłam stąd pełna, lecz pustą sprowadził mnie JHWH. Dlaczego nazywacie mnie Noemi, skoro JHWH zaświadczył przeciwko mnie i Wszechmogący wyrządził mi krzywdę?"
"Rt1,22": "Tak powróciła Noemi, a wraz z nią Rut Moabitka, jej synowa, ta, która powróciła z pól Moabu. I przyszły one do Betlejem na początku zbiorów jęczmienia."
