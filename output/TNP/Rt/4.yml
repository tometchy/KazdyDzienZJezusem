"Rt4,1": "A Boaz wszedł do bramy i tam usiadł. A oto tamtędy przechodził wykupiciel, o którym mówił Boaz. Powiedział więc: Zbocz ku mnie i usiądź tutaj kuzynie! A on zboczył i usiadł."
"Rt4,2": "I wziął Boaz dziesięciu starszych mężczyzn z tego miasta i powiedział do nich: Usiądźcie tutaj. I usiedli."
"Rt4,3": "I powiedział do wykupiciela: Noemi, która powróciła z pól Moabu, chce zbyć kawałek ziemi, który należy do naszego brata Elimeleka."
"Rt4,4": "I ja pomyślałem sobie: Odkryję to przed twoim uchem i powiem: Nabądź go ty w obecności siedzących i w obecności starszych mego ludu. Jeśli chcesz go wykupić, wykup. Lecz jeśli nie chcesz go wykupić, oznajmij mi, a będę to wiedział. Bo nie ma nikogo poza tobą, aby go wykupić, ja natomiast jestem po tobie. Wtedy on odpowiedział: Ja wykupię."
"Rt4,5": "A Boaz powiedział: W dniu, kiedy nabędziesz pole z ręki Noemi, i z Rut Moabitką z żoną zmarłego nabędziesz je – by wzbudzić imię zmarłego na jego dziedzictwie."
"Rt4,6": "Wykupiciel powiedział wtedy: Nie mogę go wykupić dla siebie, abym nie sprowadził ruiny na własne dziedzictwo. Ty wykup dla siebie to prawo wykupu, gdyż ja nie mogę go wykupić."
"Rt4,7": "A to było dawną regułą w Izraelu co do prawa wykupu i co do zamiany, aby zatwierdzić każdą sprawę, człowiek zdejmował swój sandał i dawał go swojemu bliźniemu. I było to aktem zatwierdzenia w Izraelu."
"Rt4,8": "Wtedy ów wykupiciel powiedział do Boaza: Nabądź dla siebie. I zdjął swój sandał."
"Rt4,9": "I powiedział Boaz do starszych i całego ludu: Wy dziś jesteście świadkami, że nabyłem z ręki Noemi to wszystko, co należało do Elimeleka oraz to wszystko, co należało do Kiliona i Machlona."
"Rt4,10": "A także Rut Moabitkę, żonę Machlona, nabywam sobie za żonę, aby wzbudzić imię zmarłego na jego dziedzictwie, aby nie zostało usunięte imię zmarłego wśród jego braci ani z bramy jego miejsca zamieszkania. Wy jesteście dziś tego świadkami."
"Rt4,11": "I odpowiedzieli – cały lud, który był w bramie oraz starsi: Jesteśmy tego świadkami. Niech JHWH sprawi, aby ta kobieta, która wchodzi do twojego domu, była jak Rachela i jak Lea, które wspólnie zbudowały dom Izraela. Nabieraj znaczenia w Efrata i rozgłoś swe imię w Betlejem."
"Rt4,12": "Niech twój dom stanie się jak dom Peresa, którego Tamar urodziła Judzie dzięki potomstwu, które JHWH da ci z tej młodej kobiety."
"Rt4,13": "Boaz wziął więc sobie Rut i stała się jego żoną. A gdy z nią obcował, JHWH użyczył jej poczęcia i urodziła syna."
"Rt4,14": "Wtedy powiedziały kobiety do Noemi: Błogosławiony JHWH, który nie zostawił cię dziś bez wykupiciela i niech Jego imię zostanie rozgłoszone w Izraelu."
"Rt4,15": "I będzie on dla ciebie za przywracającego życie i wsparcie w twojej starości, gdyż twoja synowa, która cię miłuje urodziła go, ta która jest dla ciebie lepsza niż siedmiu synów."
"Rt4,16": "Wzięła więc Noemi chłopca, położyła go na swoim łonie i była mu piastunką."
"Rt4,17": "I sąsiadki nadały mu imię, mówiąc: Narodził się syn Noemi. I nadały mu imię Obed. On to jest ojcem Jessego, ojca Dawida."
"Rt4,18": "A oto potomkowie Peresa: Peres spłodził Chesrona;"
"Rt4,19": "A Chesron spłodził Rama, a Ram spłodził Amminadaba;"
"Rt4,20": "A Amminadab spłodził Nachszona, a Nachszon spłodził Salmah;"
"Rt4,21": "A Salmon spłodził Boaza, a Boaz spłodził Obeda;"
"Rt4,22": "A Obed spłodził Jessego, a Jesse spłodził Dawida."
