"Est9,1": "A w dwunastym miesiącu, to jest w miesiącu Adar, w trzynastym dniu tego miesiąca, gdy rozeszło się słowo króla i jego zarządzenie, które miało być wykonane, kiedy wrogowie Żydów mieli nadzieję zapanować nad nimi, lecz to się zmieniło, ponieważ Żydzi zapanowali nad tymi, którzy ich nienawidzili."
"Est9,2": "Bo Żydzi zebrali się w swoich miastach we wszystkich prowincjach króla Achaszwerosza, aby podnieść rękę na tych, którzy pragnęli ich zguby. A nikt nie mógł ostać się przed ich obliczem, gdyż strach przed nimi padł na wszystkie ludy."
"Est9,3": "I wszyscy książęta prowincji, satrapowie, namiestnicy i wykonujący pracę dla króla popierali Żydów, bo padł na nich strach przed Mordocheuszem."
"Est9,4": "Bo Mordocheusz stał się wielkim w pałacu króla, a wieść o nim rozchodziła się po wszystkich prowincjach, tak że znaczenie tego człowieka, Mordocheusza, rozchodziło się i stawało się coraz większe."
"Est9,5": "I uderzyli Żydzi we wszystkich swoich wrogów ciosem miecza, także rzezią i zniszczeniem, a czynili z tymi, którzy ich nienawidzą, według swojego uznania."
"Est9,6": "Także w pałacu w Suzie Żydzi zabili i wytracili pięciuset mężczyzn;"
"Est9,7": "I Parszandatę, i Dalfona, i Aspatę;"
"Est9,8": "I Poratę, i Adalię, i Arydata;"
"Est9,9": "I Parmasztę, i Arisaja, i Aridaja, i Wajezatę;"
"Est9,10": "Tych dziesięciu synów Hamana, syna Hammedaty, gnębiciela Żydów, zabili, ale po łup nie wyciągnęli swojej ręki."
"Est9,11": "W tym dniu dotarła przed oblicze króla wieść o liczbie zabitych w pałacu w Suzie."
"Est9,12": "I powiedział król do królowej Estery: W pałacu w Suzie zabili Żydzi i wytracili pięciuset mężczyzn oraz dziesięciu synów Hamana. A co uczynili w pozostałych prowincjach królewskich? Jaką masz jeszcze prośbę, a zostanie ci dane? Co jeszcze sobie życzysz, a stanie ci się?"
"Est9,13": "A Estera odpowiedziała: Jeśli król uzna to za dobre, niech będzie dane także jutro Żydom, którzy są w Suzie, uczynić według zarządzenia tego dnia i niech zawieszą dziesięciu synów Hamana na drzewie."
"Est9,14": "I król rozkazał, aby tak uczyniono. Ogłoszono zarządzenie w Suzie i zawieszono dziesięciu synów Hamana na drzewie."
"Est9,15": "A Żydzi, którzy byli w Suzie, zgromadzili się także dnia czternastego miesiąca Adar i zabili w Suzie trzystu mężczyzn, lecz po ich łup nie wyciągnęli swojej ręki."
"Est9,16": "A pozostali Żydzi, którzy byli w prowincjach królewskich, zebrali się, by stanąć do obrony swojej duszy i odetchnąć od swoich wrogów. I zabili z tych, którzy ich nienawidzili siedemdziesiąt pięć tysięcy, lecz po łup ich nie wyciągnęli swojej ręki;"
"Est9,17": "Tak się stało w dniu trzynastym miesiąca Adar, a dnia czternastego tego miesiąca odpoczęli i uczynili go dniem uczty i radości."
"Est9,18": "Ale Żydzi, którzy byli w Suzie, zebrali się dnia trzynastego tego miesiąca i czternastego tego miesiąca, a piętnastego dnia odpoczęli i uczynili go dniem uczty i radości."
"Est9,19": "Dlatego też Żydzi ze wsi i mieszkający w miasteczkach nieobwarowanych obchodzą czternasty dzień miesiąca Adar jako dzień radości, uczty, jako dzień szczęśliwy, w którym posyła jeden drugiemu porcje żywności."
"Est9,20": "I spisał Mordocheusz te wydarzenia i rozesłał listy do wszystkich Żydów, którzy byli we wszystkich prowincjach króla Achaszwerosza, bliskich i dalekich;"
"Est9,21": "Aby nałożyć na nich obowiązek, stałego obchodzenia dnia czternastego miesiąca Adar i piętnastego dnia tego miesiąca – rokrocznie –"
"Est9,22": "Jako dni, w których Żydzi odpoczęli od swoich wrogów, i miesiąc, który obrócił się dla nich ze smutku w radość, a z płaczu w dzień szczęścia – aby uczynić je dniami uczty i radości oraz posyłając jeden drugiemu porcje żywności, a ubogim dary."
"Est9,23": "I Żydzi przyjęli to, co zapoczątkowali, by obchodzić to, co napisał do nich Mordocheusz:"
"Est9,24": "Że Haman, syn Hammedaty, Agagity, gnębiciel wszystkich Żydów, wymyślił plan przeciw Żydom, aby ich wytracić, i rzucił pur, to jest los, aby ich i zniszczyć i aby ich wytracić;"
"Est9,25": "Lecz gdy Estera przyszła przed oblicze króla, ten rozkazał na piśmie, aby jego niegodziwy zamiar, który obmyślił przeciwko Żydom, obrócił się na jego głowę, i aby zawiesili go i jego synów na drzewie."
"Est9,26": "Dlatego też nazwali te dni Purim, ze względu na nazwę pur. Dlatego też z powodu wszystkich słów tego listu oraz z powodu tego, co z tych rzeczy widzieli, i co ich dotknęło;"
"Est9,27": "Żydzi zobowiązali się i przyjęli na siebie, na swoje potomstwo i na wszystkich, którzy się do nich przyłączyli – i nikt tego nie przestąpi – że rokrocznie będą obchodzili te dwa dni zgodnie z pismem i w ustalonym czasie;"
"Est9,28": "I że te dni będą wspominane i obchodzone w każdym poszczególnym pokoleniu, w każdej rodzinie, w każdej prowincji i w każdym mieście; i że te dni Purim nie zanikną wśród Żydów, a pamięć o nich nie ustanie u ich potomstwa."
"Est9,29": "I napisała królowa Estera, córka Abichaila, i Żyd Mordocheusz z całym autorytetem, aby nadać moc obowiązującą temu drugiemu listowi dotyczącemu Purim."
"Est9,30": "I rozesłał listy do wszystkich Żydów, do wszystkich stu i dwudziestu i siedmiu prowincji królestwa Achaszwerosza, ze słowami pokoju i prawdy;"
"Est9,31": "Aby ustanowić te dni Purim w oznaczonym czasie – jak to ustanowił dla nich Żyd Mordocheusz i królowa Estera, i jak to sami ustanowili na swoją własną duszę i na swoje potomstwo – sprawy postów i ich lamentowania."
"Est9,32": "A polecenie Estery potwierdziło sprawy dotyczące tych dni Purim i zostało to zapisane w zwoju."
