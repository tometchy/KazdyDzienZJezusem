"Est6,1": "A tej nocy odbiegł króla sen, powiedział więc, aby przynieść zwój wspomnień spraw dziennych. I stało się, że odczytano go przed obliczem króla."
"Est6,2": "I został znaleziony zapis, o tym, co doniósł Mordocheusz na Bigtana i Teresza, dwóch eunuchów króla, spośród stróżów progu, którzy szukali sposobności, by podnieść rękę na króla Achaszwerosza."
"Est6,3": "Wtedy król powiedział: Jakiego zaszczytu i wywyższenia za to dostąpił Mordocheusz? I odpowiedzieli słudzy króla usługujący mu: Nie uczyniono dla niego nic w tej sprawie."
"Est6,4": "A król zapytał: Kto jest na dziedzińcu? A właśnie Haman przyszedł na zewnętrzny dziedziniec domu królewskiego, aby rozmawiać z królem, by powiesić Mordocheusza na słupie, który dla niego sporządził."
"Est6,5": "Słudzy króla odpowiedzieli mu: Oto Haman stoi na dziedzińcu. Król powiedział: Niech wejdzie."
"Est6,6": "I Haman wszedł. A król zapytał go: Co uczynić dla człowieka, którego król pragnie uczcić? A Haman myślał w swoim sercu: Kogo by król pragnął uczcić bardziej niż mnie?"
"Est6,7": "Powiedział więc Haman do króla: Dla człowieka, którego król pragnie uczcić,"
"Est6,8": "Niech przyniosą szatę królewską, w którą ubiera się król i konia, na którym jeździ król, a któremu włożą diadem królestwa na jego głowę;"
"Est6,9": "Potem niech ofiarują tę szatę i konia w ręce kogoś z najdostojniejszych książąt, niech ubiorą tego człowieka, którego król pragnie uczcić, niech go obwożą na koniu po placu miejskim i niech wołają przed jego obliczem: Tak postępuje się z człowiekiem, którego król pragnie uczcić!"
"Est6,10": "Wtedy król powiedział do Hamana: Pośpiesz się, weź tę szatę i tego konia, tak jak powiedziałeś i uczyń tak z Żydem Mordocheuszem, który siedzi w Bramie Królewskiej. Nie pomiń ani słowa z tego wszystkiego, co powiedziałeś!"
"Est6,11": "I Haman wziął tę szatę i tego konia, ubrał Mordocheusza i obwoził go po placu miejskim, i wołał przed jego obliczem: Tak postąpi się z człowiekiem, którego król pragnie uczcić!"
"Est6,12": "Potem wrócił Mordocheusz do Bramy Królewskiej, Haman natomiast śpieszył się do swojego domu smutny, z zakrytą głową."
"Est6,13": "I Haman opowiedział swojej żonie Zeresz i wszystkim swoim przyjaciołom o tym wszystkim, co go spotkało. Jego mędrcy i jego żona Zeresz powiedzieli do niego: Jeśli Mordocheusz, przed którym zacząłeś upadać, jest z nasienia żydowskiego, to nie pokonasz go – owszem, przed jego obliczem z pewnością upadniesz."
"Est6,14": "Gdy jeszcze oni z nim rozmawiali, oto dotarli eunuchowie króla, aby śpiesznie sprowadzić Hamana na ucztę, którą przygotowała Estera."
