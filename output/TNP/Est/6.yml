"Est6,1":
  text: "A tej nocy odbiegł króla sen, powiedział więc, aby przynieść zwój wspomnień spraw dziennych. I stało się, że odczytano go przed obliczem króla."
  tags: []
"Est6,2":
  text: "I został znaleziony zapis, o tym, co doniósł Mordocheusz na Bigtana i Teresza, dwóch eunuchów króla, spośród stróżów progu, którzy szukali sposobności, by podnieść rękę na króla Achaszwerosza."
  tags: []
"Est6,3":
  text: "Wtedy król powiedział: Jakiego zaszczytu i wywyższenia za to dostąpił Mordocheusz? I odpowiedzieli słudzy króla usługujący mu: Nie uczyniono dla niego nic w tej sprawie."
  tags: []
"Est6,4":
  text: "A król zapytał: Kto jest na dziedzińcu? A właśnie Haman przyszedł na zewnętrzny dziedziniec domu królewskiego, aby rozmawiać z królem, by powiesić Mordocheusza na słupie, który dla niego sporządził."
  tags: []
"Est6,5":
  text: "Słudzy króla odpowiedzieli mu: Oto Haman stoi na dziedzińcu. Król powiedział: Niech wejdzie."
  tags: []
"Est6,6":
  text: "I Haman wszedł. A król zapytał go: Co uczynić dla człowieka, którego król pragnie uczcić? A Haman myślał w swoim sercu: Kogo by król pragnął uczcić bardziej niż mnie?"
  tags: []
"Est6,7":
  text: "Powiedział więc Haman do króla: Dla człowieka, którego król pragnie uczcić,"
  tags: []
"Est6,8":
  text: "Niech przyniosą szatę królewską, w którą ubiera się król i konia, na którym jeździ król, a któremu włożą diadem królestwa na jego głowę;"
  tags: []
"Est6,9":
  text: "Potem niech ofiarują tę szatę i konia w ręce kogoś z najdostojniejszych książąt, niech ubiorą tego człowieka, którego król pragnie uczcić, niech go obwożą na koniu po placu miejskim i niech wołają przed jego obliczem: Tak postępuje się z człowiekiem, którego król pragnie uczcić!"
  tags: []
"Est6,10":
  text: "Wtedy król powiedział do Hamana: Pośpiesz się, weź tę szatę i tego konia, tak jak powiedziałeś i uczyń tak z Żydem Mordocheuszem, który siedzi w Bramie Królewskiej. Nie pomiń ani słowa z tego wszystkiego, co powiedziałeś!"
  tags: []
"Est6,11":
  text: "I Haman wziął tę szatę i tego konia, ubrał Mordocheusza i obwoził go po placu miejskim, i wołał przed jego obliczem: Tak postąpi się z człowiekiem, którego król pragnie uczcić!"
  tags: []
"Est6,12":
  text: "Potem wrócił Mordocheusz do Bramy Królewskiej, Haman natomiast śpieszył się do swojego domu smutny, z zakrytą głową."
  tags: []
"Est6,13":
  text: "I Haman opowiedział swojej żonie Zeresz i wszystkim swoim przyjaciołom o tym wszystkim, co go spotkało. Jego mędrcy i jego żona Zeresz powiedzieli do niego: Jeśli Mordocheusz, przed którym zacząłeś upadać, jest z nasienia żydowskiego, to nie pokonasz go – owszem, przed jego obliczem z pewnością upadniesz."
  tags: []
"Est6,14":
  text: "Gdy jeszcze oni z nim rozmawiali, oto dotarli eunuchowie króla, aby śpiesznie sprowadzić Hamana na ucztę, którą przygotowała Estera."
  tags: []
