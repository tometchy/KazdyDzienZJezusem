"Est1,1":
  text: "I stało się za dni Achaszwerosza – tego Achaszwerosza – który królował od Indii aż do Kusz nad stu i dwudziestoma i siedmioma prowincjami –"
  tags: []
"Est1,2":
  text: "W tych dniach, gdy król Achaszwerosz zasiadał na tronie swojego królestwa, który był w pałacu w Suzie,"
  tags: []
"Est1,3":
  text: "W trzecim roku swojego panowania wyprawił u siebie ucztę dla wszystkich swoich książąt i sług. Stawili się przed nim dowódcy Persów i Medów oraz dostojnicy i książęta prowincji."
  tags: []
"Est1,4":
  text: "A on dawał pokaz bogactwa, chwały swojego królestwa oraz wspaniałości swojego majestatu przez wiele dni. Trwało to przez sto osiemdziesiąt dni."
  tags: []
"Est1,5":
  text: "A po zakończeniu tych dni król wyprawił ucztę dla wszystkich ludzi obecnych w pałacu w Suzie, od największego aż do najmniejszego, przez siedem dni na dziedzińcu, w ogrodzie domu króla."
  tags: []
"Est1,6":
  text: "Białe lniane i fioletowe kotary przymocowane sznurami z bisioru i purpury zwisały na srebrnych pierścieniach i na słupach z marmuru. Złote i srebrne sofy stały na posadzce z porfiru i marmuru, i z masy perłowej oraz czarnego marmuru"
  tags: []
"Est1,7":
  text: "A napoje podawano w złotych naczyniach, a każde z naczyń było inne, a wina królewskiego było dużo, jak przystało na króla."
  tags: []
"Est1,8":
  text: "A do picia, zgodnie z zarządzeniem, nikt nie zmuszał. Bo tak postanowił król wobec wszystkich zarządców swojego domu, że każdy mężczyzna może czynić według swojej woli."
  tags: []
"Est1,9":
  text: "Królowa Waszti także wyprawiła ucztę dla kobiet w domu króla, który należał do króla Achaszwerosza."
  tags: []
"Est1,10":
  text: "W siódmym dniu, gdy przyjemnie było sercu króla z powodu wina, powiedział on Mechumanowi, Bizzecie, Charbonie, Bigcie i Abagcie, Zeterowi i Karkasowi, siedmiu eunuchom, którzy służyli przed królem Achaszweroszem;"
  tags: []
"Est1,11":
  text: "Aby przyprowadzili przed oblicze króla królową Waszti w diademie królewskim, chcąc pokazać ludowi i książętom jej piękność. Gdyż była piękna z wyglądu."
  tags: []
"Est1,12":
  text: "Lecz królowa Waszti odmówiła przyjścia na słowo króla, które było przekazane przez eunuchów. Król więc bardzo się rozgniewał, a jego gniew w nim zapłonął."
  tags: []
"Est1,13":
  text: "I powiedział król do mędrców znających czasy – gdyż tak przedstawiano sprawy króla przed wszystkimi znającymi prawo i sąd,"
  tags: []
"Est1,14":
  text: "A najbliżej niego byli: Karszena, Szetar, Admata, Tarszisz, Meres, Marsena i Memukan, siedmiu książąt Persji i Medii, którzy oglądali oblicze króla i zasiadali jako pierwsi w królestwie –"
  tags: []
"Est1,15":
  text: "Zgodnie z jakim prawem postąpić z królową Waszti za to, że nie wykonała nakazu króla Achaszwerosza przekazanego przez eunuchów?"
  tags: []
"Est1,16":
  text: "I powiedział Memukan przed królem i książętami: Królowa Waszti zawiniła nie tylko przeciw samemu królowi, ale przeciw wszystkim książętom i wszystkim ludom, które żyją we wszystkich prowincjach króla Achaszwerosza."
  tags: []
"Est1,17":
  text: "Bo kiedy sprawa królowej rozniesie się wśród wszystkich kobiet, wzgardzą one swoimi mężami w swoich oczach i powiedzą: Król Achaszwerosz powiedział, by przyprowadzić królową Waszti przed swoje oblicze, a ona nie przyszła."
  tags: []
"Est1,18":
  text: "A jeszcze dzisiaj będą to mówiły księżniczki Persji i Medii, które słyszały o sprawie królowej wszystkim książętom króla i wyniknie z tego wiele pogardy i gniewu."
  tags: []
"Est1,19":
  text: "Dlatego też, jeśli król uzna to za słuszne, niech wyjdzie sprzed oblicza króla wyrok i niech zostanie wpisany do praw Persji i Medii, które są nieodwołalne: To, że Waszti nie przyjdzie już przed oblicze króla Achaszwerosza, a jej godność królewską niech król da jej przyjaciółce, lepszej od niej."
  tags: []
"Est1,20":
  text: "A gdy ten wydany przez króla edykt zostanie usłyszany w całym jego królestwie – bo ono jest wielkie – to wszystkie żony oddadzą cześć swoim mężom, od największego aż do najmniejszego."
  tags: []
"Est1,21":
  text: "A to słowo było dobre w oczach króla i książąt, i król uczynił według słowa Memukana."
  tags: []
"Est1,22":
  text: "I rozesłał listy do wszystkich prowincji królewskich, do każdej prowincji ich pismem, i do każdego ludu w jego języku, że każdy mężczyzna ma być zarządcą w swoim domu i przemówić zgodnie z językiem swojego ludu."
  tags: []
