"Est7,1":
  text: "Król i Haman przybyli więc na ucztę z królową Esterą."
  tags: []
"Est7,2":
  text: "I powiedział król do Estery również w drugim dniu, gdy napił się wina: Jaka jest twoja prośba, królowo Estero, a będzie ci to dane; i jakie jest twoje życzenie – aż do połowy królestwa – a będzie spełnione?"
  tags: []
"Est7,3":
  text: "Wtedy królowa Estera odpowiedziała, mówiąc: Jeśli znalazłam łaskę w twoich oczach, królu, i jeśli król uzna to za dobre, niech będzie mi darowana moja dusza na moją prośbę i mój naród na moje życzenie."
  tags: []
"Est7,4":
  text: "Bo zostaliśmy sprzedani, ja i mój lud, aby nas zgładzić, pozabijać i wytracić. A jeśli zostalibyśmy sprzedani jako niewolnicy i niewolnice, milczałabym, gdyż ta niedola nie może wyrównać tej szkody królowi."
  tags: []
"Est7,5":
  text: "Wtedy król Achaszwerosz odezwał się do królowej Estery i powiedział: Kto to jest i gdzie jest ten, który wypełnił swoje serce, by tak uczynić?"
  tags: []
"Est7,6":
  text: "A Estera powiedziała: Tym kimś – przeciwnikiem i wrogiem jest ten niegodziwy Haman. I Haman zatrwożył się przed królem i królową."
  tags: []
"Est7,7":
  text: "Wtedy król wstał w swoim gniewie od uczty przy winie i poszedł do ogrodu pałacowego. Haman natomiast stał, aby błagać królową Esterę o swoją duszę, bo widział, że dopełniło się jego nieszczęście ze strony króla."
  tags: []
"Est7,8":
  text: "Gdy król wrócił z ogrodu pałacowego do domu, gdzie odbywała się uczta przy winie, a Haman upadł na łoże, na którym spoczywała Estera, wtedy król powiedział: Czy także chce napastować królową przy mnie w domu? A gdy te słowo wyszło z ust króla, to twarz Hamana natychmiast zakryto."
  tags: []
"Est7,9":
  text: "A Charbona, jeden z eunuchów, powiedział przed obliczem króla: Oto nawet pal uczyniony przez Hamana dla Mordocheusza, który dobrze mówił o królu, stoi przy domu Hamana, wysoki na pięćdziesiąt łokci. Król powiedział: Powieście go na nim."
  tags: []
"Est7,10":
  text: "I powieszono Hamana na tym palu, który przygotował dla Mordocheusza. I gniew króla uspokoił się."
  tags: []
