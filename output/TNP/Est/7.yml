"Est7,1": "Król i Haman przybyli więc na ucztę z królową Esterą."
"Est7,2": "I powiedział król do Estery również w drugim dniu, gdy napił się wina: Jaka jest twoja prośba, królowo Estero, a będzie ci to dane; i jakie jest twoje życzenie – aż do połowy królestwa – a będzie spełnione?"
"Est7,3": "Wtedy królowa Estera odpowiedziała, mówiąc: Jeśli znalazłam łaskę w twoich oczach, królu, i jeśli król uzna to za dobre, niech będzie mi darowana moja dusza na moją prośbę i mój naród na moje życzenie."
"Est7,4": "Bo zostaliśmy sprzedani, ja i mój lud, aby nas zgładzić, pozabijać i wytracić. A jeśli zostalibyśmy sprzedani jako niewolnicy i niewolnice, milczałabym, gdyż ta niedola nie może wyrównać tej szkody królowi."
"Est7,5": "Wtedy król Achaszwerosz odezwał się do królowej Estery i powiedział: Kto to jest i gdzie jest ten, który wypełnił swoje serce, by tak uczynić?"
"Est7,6": "A Estera powiedziała: Tym kimś – przeciwnikiem i wrogiem jest ten niegodziwy Haman. I Haman zatrwożył się przed królem i królową."
"Est7,7": "Wtedy król wstał w swoim gniewie od uczty przy winie i poszedł do ogrodu pałacowego. Haman natomiast stał, aby błagać królową Esterę o swoją duszę, bo widział, że dopełniło się jego nieszczęście ze strony króla."
"Est7,8": "Gdy król wrócił z ogrodu pałacowego do domu, gdzie odbywała się uczta przy winie, a Haman upadł na łoże, na którym spoczywała Estera, wtedy król powiedział: Czy także chce napastować królową przy mnie w domu? A gdy te słowo wyszło z ust króla, to twarz Hamana natychmiast zakryto."
"Est7,9": "A Charbona, jeden z eunuchów, powiedział przed obliczem króla: Oto nawet pal uczyniony przez Hamana dla Mordocheusza, który dobrze mówił o królu, stoi przy domu Hamana, wysoki na pięćdziesiąt łokci. Król powiedział: Powieście go na nim."
"Est7,10": "I powieszono Hamana na tym palu, który przygotował dla Mordocheusza. I gniew króla uspokoił się."
