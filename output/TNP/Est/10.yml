"Est10,1":
  text: "Potem król Achaszwerosz nałożył podatek na swoją ziemię i na wyspy morza."
  tags: []
"Est10,2":
  text: "A wszystkie dzieła jego potęgi i mocy, i dokładny opis wielkości Mordocheusza, którą wywyższył go król – czyż nie zostały one zapisane w zwoju wspomnień spraw dziennych królów Medii i Persji?"
  tags: []
"Est10,3":
  text: "Gdyż Żyd Mordocheusz był drugim po królu Achaszweroszu i wielkim pośród Żydów, i cieszącym się uznaniem wśród wielu swoich braci, szukającym dobra dla swojego ludu i głoszącym pokój dla całego swojego potomstwa."
  tags: []
