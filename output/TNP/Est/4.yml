"Est4,1":
  text: "A gdy Mordocheusz dowiedział się o tym wszystkim, co czyniono, to rozdarł swoje szaty i przywdział wór, i posypał się popiołem – i wyszedł na środek miasta i donośnie oraz gorzko krzyczał."
  tags: []
"Est4,2":
  text: "I doszedł aż przed Bramę Królewską, gdyż nie wolno było wejść do Bramy Królewskiej ubrany w wór."
  tags: []
"Est4,3":
  text: "A w każdej poszczególnej prowincji, w miejscu gdzie doszło słowo króla i jego zarządzenie, nastała wielka żałoba wśród Żydów i post, i płacz, i lament. Wór i popiół stanowiły posłanie dla wielu."
  tags: []
"Est4,4":
  text: "Przyszły więc służące Estery i jej eunuchowie i opowiedzieli jej o tym. Królowa bardzo się tym zasmuciła i posłała szaty, aby ubrać Mordocheusza i zdjąć z niego wór. Ale on ich nie przyjął."
  tags: []
"Est4,5":
  text: "Wtedy Estera zawołała Hataka, jednego z eunuchów króla, którego postawił przed jej obliczem do posługi, i nakazała mu pójść do Mordocheusza, aby dowiedzieć się, co to ma znaczyć i na co to."
  tags: []
"Est4,6":
  text: "Wyszedł więc Hatak do Mordocheusza na plac miejski, który był przed Bramą Królewską;"
  tags: []
"Est4,7":
  text: "I Mordocheusz opowiedział mu wszystko, co mu się przydarzyło, także dokładną kwotę srebra, którą Haman powiedział, że odważy dla skarbców królewskich za Żydów, aby ich wytracić."
  tags: []
"Est4,8":
  text: "Dał mu też odpis pisma zarządzenia o ich zagładzie, które wydano w Suzie, aby pokazać Esterze, powiadomić ją i rozkazać, aby poszła do króla błagać go o łaskę i uzyskać ją przed jego obliczem nad jej ludem."
  tags: []
"Est4,9":
  text: "Przyszedł więc Hatak i przekazał Esterze słowa Mordocheusza."
  tags: []
"Est4,10":
  text: "I odpowiedziała Estera Hatakowi i poleciła mu iść do Mordocheusza z takimi słowami:"
  tags: []
"Est4,11":
  text: "Wszyscy słudzy króla oraz ludy z prowincji królewskich wiedzą o tym, że każdy – mężczyzna lub kobieta – który wejdzie do króla na dziedziniec wewnętrzny, a który nie został tam wezwany, jedno jest dla niego prawo – ma zostać zabity, z wyjątkiem tego, ku któremu król wyciągnie złote berło, aby taki żył. Ale ja nie zostałam wezwana, aby wejść do króla, i to od trzydziestu dni."
  tags: []
"Est4,12":
  text: "I powiedziano Mordocheuszowi słowa Estery."
  tags: []
"Est4,13":
  text: "Wtedy Mordocheusz powiedział, aby przekazano do Estery taką odpowiedź: Nie myśl sobie, że jedyna zostaniesz ocalona ze wszystkich Żydów, bo jesteś w pałacu królewskim."
  tags: []
"Est4,14":
  text: "Bo jeśli zachowasz milczenie w tym czasie, uwolnienie i wybawienie dla Żydów wyłoni się z innego miejsca, a ty i dom twojego ojca zginiecie. A kto wie, czy nie na taki czas dostąpiłaś godności królewskiej?"
  tags: []
"Est4,15":
  text: "I powiedziała Estera, aby przekazano do Mordocheusza taką odpowiedź:"
  tags: []
"Est4,16":
  text: "Idź, zbierz wszystkich Żydów, którzy się znajdują w Suzie, i pośćcie za mnie, nie jedzcie i nie pijcie przez trzy dni, nocą i dniem. Ja także i moje służące będziemy tak pościć, i tak wejdę do króla, mimo że to nie jest zgodne z prawem. A jeśli zginę, to zginę."
  tags: []
"Est4,17":
  text: "Odszedł więc Mordocheusz i uczynił wszystko, jak mu poleciła Estera."
  tags: []
