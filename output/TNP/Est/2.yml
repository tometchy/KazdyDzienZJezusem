"Est2,1": "Po tych wydarzeniach, gdy minął gniew króla Achaszwerosza, wspomniał on Waszti i to, co uczyniła i to, co zostało postanowione przeciwko niej."
"Est2,2": "I powiedzieli dworzanie króla, którzy mu usługiwali: Niech poszukują dla króla panien, dziewic pięknychz wyglądu;"
"Est2,3": "I niech król ustanowi urzędników we wszystkich prowincjach swojego królestwa, aby zgromadzili wszystkie panny, dziewice o pięknej urodzie do pałacu w Suzie, w domu kobiet, pod opieką Hegaja, eunucha królewskiego, stróża kobiet, i niech im dadzą ich kosmetyki."
"Est2,4": "A ta panna, która spodoba się oczom króla, będzie królować w miejsce Waszti. Spodobało się to słowo oczom króla i tak uczynił."
"Est2,5": "A w pałacu w Suzie był pewien Żyd, a jego imię – Mordocheusz, syn Jaira, syna Szimejego, syna Kisza – mąż Beniaminita."
"Est2,6": "Który został uprowadzony z Jerozolimy wraz z innymi pojmanymi, którzy zostali uprowadzeni razem z Jechoniaszem, królem Judy, który został uprowadzony do niewoli przez Nabuchodonozora, króla Babilonu."
"Est2,7": "A był on opiekunem Hadassy, to jest Estery, córki swojego stryja, gdyż nie miała ona ani ojca, ani matki. A była to panna pięknej postaci i urodziwego wyglądu. Mordocheusz więc, po śmierci jej ojca i jej matki, przyjął ją do siebie za córkę."
"Est2,8": "I stało się tak, gdy usłyszano słowo króla i jego zarządzenie, i gdy zgromadzono wiele panien do pałacu w Suzie pod opieką Hegaja, także Estera została wzięta do pałacu króla pod opiekę Hegaja, stróża kobiet."
"Est2,9": "I znalazła uznanie ta panna w jego oczach, i zyskała łaskę przed jego obliczem, więc ponaglił by dać jej przynależące jej kosmetyki, i należny jej przydział, oraz dać jej siedem wybranych dziewcząt z pałacu króla. Następnie przeniósł ją i jej dziewczęta do lepszej części domu kobiet."
"Est2,10": "Ale Estera nie ujawniła swojej narodowości ani pochodzenia, ponieważ Mordocheusz nakazał jej, aby tego nie ujawniała."
"Est2,11": "A Mordocheusz każdego dnia przechadzał się przed dziedzińcem domu kobiet, aby dowiedzieć się o zdrowiu Estery i co się z nią dzieje."
"Est2,12": "A gdy przyszła kolej na każdą z tych panien, aby pójść do króla Achaszwerosza – a działo się to po upływie jej bycia zgodnie z zarządzeniem dla kobiet, po dwunastu miesiącach – bo tak kończyły się dni ich pielęgnacji: sześć miesięcy olejkiem z mirry, a sześć miesięcy wonnościami i innymi środkami pielęgnacji kobiet;"
"Est2,13": "Dopiero wtedy panna szła do króla – wszystko, o co prosiła, dawano jej, aby mogła z tym iść z domu kobiet aż do pałacu króla."
"Est2,14": "Wieczorem ona szła, a rano ona wracała do drugiego domu kobiet pod opiekę Szaaszgaza, eunucha królewskiego, stróża nałożnic. Nie szła już więcej do króla, chyba że upodobał ją sobie król, wtedy wzywano ją po imieniu."
"Est2,15": "A gdy przyszła kolej Estery, córki Abichaila, stryja Mordocheusza, który przyjął ją za córkę – aby pójść do króla, nie domagała się niczego jak tylko to, co powiedział jej Hegaj, eunuch króla, stróż kobiet. I stało się tak, że Estera zyskała łaskę w oczach wszystkich patrzących na nią."
"Est2,16": "Zabrano więc Esterę do króla Achaszwerosza do jego pałacu królewskiego, w dziesiątym miesiącu, to jest w miesiącu Tebet, w siódmym roku jego panowania."
"Est2,17": "A król umiłował Esterę nad wszystkie kobiety i zyskała łaskę i przychylność przed jego obliczem nad wszystkie dziewice. Włożył więc jej na głowę diadem królewski i uczynił ją królową w miejsce Waszti."
"Est2,18": "Potem król wyprawił wielką ucztę dla wszystkich swoich książąt i sług, ucztę Estery, a dla prowincji uczynił dzień wolny i rozdał dary, według hojnej ręki króla."
"Est2,19": "A gdy zebrano dziewice po raz drugi, i gdy Mordocheusz siedział w Bramie Królewskiej."
"Est2,20": "Estera nie ujawniła jeszcze swojego pochodzenia i swojej narodowości, tak jak jej nakazał Mordocheusz; Estera wykonała polecenie Mordocheusza, tak jakby była pod jego opieką."
"Est2,21": "W tych dniach, a Mordocheusz siedział w Bramie Królewskiej, dwaj eunuchowie króla, Bigtan i Teresz, spośród strzegących progu, szukali sposobności, aby podnieść rękę na króla Achaszwerosza."
"Est2,22": "A sprawa ta stała się znana Mordocheuszowi i oznajmił ją królowej Esterze, a Estera powiedziała o tym królowi w imieniu Mordocheusza."
"Est2,23": "I zbadano tę sprawę, i odkryto jej prawdziwość. I zostali zawieszeni obydwaj na drzewie, i zapisano to w zwoju spraw dziennych przed królem."
