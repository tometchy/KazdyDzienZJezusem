"Tt2,1": "Ty jednak mów, co przystoi zdrowej nauce,"
"Tt2,2": "Aby starsi mężczyźni byli trzeźwi, godni szacunku, roztropni, zdrowi w wierze, w miłości, w cierpliwości."
"Tt2,3": "Tak samo i starsze kobiety w zachowaniu godne świętości, nieskłonne do oszczerstw, niezniewolone nadużywaniem wina, nauczające tego, co dobre,"
"Tt2,4": "Aby uczyły młodsze kobiety rozsądku, by te kochały swoich mężów, by kochały swoje dzieci,"
"Tt2,5": "Rozsądne, czyste, zajmujące się domem, dobrotliwe, uległe swoim mężom, aby nie bluźniono Słowu Bożemu."
"Tt2,6": "Młodzieńców tak samo zachęcaj do rozsądku."
"Tt2,7": "We wszystkim stawiaj siebie jako wzór dobrych czynów, w nauczaniu okazuj prawość, powagę, czystość,"
"Tt2,8": "Słowo zdrowe, nienaganne, aby przeciwnik został zawstydzony, nie mając nic podłego o was do powiedzenia."
"Tt2,9": "Słudzy, aby byli ulegli swoim panom, aby we wszystkim im się podobali i nie sprzeciwiali się,"
"Tt2,10": "Nie kradli, lecz okazywali wszelką dobrą wierność, aby we wszystkim byli ozdobą nauki Zbawiciela naszego Boga."
"Tt2,11": "Ukazała się bowiem wszystkim ludziom zbawienna łaska Boża,"
"Tt2,12": "Nauczająca nas, abyśmy wyrzekli się bezbożności i światowych pożądliwości, i w obecnym wieku żyli roztropnie, sprawiedliwie i pobożnie."
"Tt2,13": "Oczekując szczęśliwej nadziei i ukazania się chwały wielkiego Boga i Zbawiciela naszego Jezusa Chrystusa,"
"Tt2,14": "Który dał samego siebie za nas, aby nas wykupić od wszelkiej nieprawości i oczyścić sobie lud wybrany na szczególną własność, gorliwy w dobrych czynach."
"Tt2,15": "To mów i zachęcaj, i strofuj z całą władzą nakazywania. Niech nikt tobą nie gardzi."
