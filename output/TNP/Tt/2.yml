"Tt2,1":
  text: "Ty jednak mów, co przystoi zdrowej nauce,"
  tags: []
"Tt2,2":
  text: "Aby starsi mężczyźni byli trzeźwi, godni szacunku, roztropni, zdrowi w wierze, w miłości, w cierpliwości."
  tags: []
"Tt2,3":
  text: "Tak samo i starsze kobiety w zachowaniu godne świętości, nieskłonne do oszczerstw, niezniewolone nadużywaniem wina, nauczające tego, co dobre,"
  tags: []
"Tt2,4":
  text: "Aby uczyły młodsze kobiety rozsądku, by te kochały swoich mężów, by kochały swoje dzieci,"
  tags: []
"Tt2,5":
  text: "Rozsądne, czyste, zajmujące się domem, dobrotliwe, uległe swoim mężom, aby nie bluźniono Słowu Bożemu."
  tags: []
"Tt2,6":
  text: "Młodzieńców tak samo zachęcaj do rozsądku."
  tags: []
"Tt2,7":
  text: "We wszystkim stawiaj siebie jako wzór dobrych czynów, w nauczaniu okazuj prawość, powagę, czystość,"
  tags: []
"Tt2,8":
  text: "Słowo zdrowe, nienaganne, aby przeciwnik został zawstydzony, nie mając nic podłego o was do powiedzenia."
  tags: []
"Tt2,9":
  text: "Słudzy, aby byli ulegli swoim panom, aby we wszystkim im się podobali i nie sprzeciwiali się,"
  tags: []
"Tt2,10":
  text: "Nie kradli, lecz okazywali wszelką dobrą wierność, aby we wszystkim byli ozdobą nauki Zbawiciela naszego Boga."
  tags: []
"Tt2,11":
  text: "Ukazała się bowiem wszystkim ludziom zbawienna łaska Boża,"
  tags: []
"Tt2,12":
  text: "Nauczająca nas, abyśmy wyrzekli się bezbożności i światowych pożądliwości, i w obecnym wieku żyli roztropnie, sprawiedliwie i pobożnie."
  tags: []
"Tt2,13":
  text: "Oczekując szczęśliwej nadziei i ukazania się chwały wielkiego Boga i Zbawiciela naszego Jezusa Chrystusa,"
  tags: []
"Tt2,14":
  text: "Który dał samego siebie za nas, aby nas wykupić od wszelkiej nieprawości i oczyścić sobie lud wybrany na szczególną własność, gorliwy w dobrych czynach."
  tags: []
"Tt2,15":
  text: "To mów i zachęcaj, i strofuj z całą władzą nakazywania. Niech nikt tobą nie gardzi."
  tags: []
