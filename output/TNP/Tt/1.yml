"Tt1,1": "Paweł, sługa Boga i apostoł Jezusa Chrystusa, według wiary wybranych Bożych i dogłębnego poznania prawdy, zgodnie z pobożnością,"
"Tt1,2": "Z nadzieją życia wiecznego, które obiecał przed wiecznymi czasami Bóg, Ten który nie kłamie,"
"Tt1,3": "A ukazał we właściwym czasie swoje Słowo przez zwiastowanie, które jest mi powierzone według rozkazu Boga, Zbawiciela naszego,"
"Tt1,4": "Do Tytusa, prawowitego dziecka według wspólnej wiary. Łaska, miłosierdzie i pokój Boga Ojca i Pana Jezusa Chrystusa, Zbawiciela naszego."
"Tt1,5": "Z tego powodu zostawiłem cię na Krecie, abyś uporządkował te sprawy, które pozostały i ustanowił po miastach starszych, jak ci nakazałem;"
"Tt1,6": "Jeśli jest ktoś nienaganny, mąż jednej żony, mający dzieci wierne, nie oskarżone o rozwiązłość lub brak karności."
"Tt1,7": "Trzeba bowiem, aby biskup był nienaganny, jako szafarz Boży, nie samowolny, nieskłonny do gniewu, nie oddający się pijaństwu, nie porywczy, nie szukający haniebnego zysku,"
"Tt1,8": "Ale gościnny, miłujący dobro, roztropny, sprawiedliwy, święty, opanowany,"
"Tt1,9": "Trzymający się zgodnie z nauką słowa godnego zaufania, aby mógł zachęcać w zdrowej nauce i napominać tych, którzy się sprzeciwiają."
"Tt1,10": "Wielu bowiem jest nieposłusznych, pustych gadułów i zwodzicieli, szczególnie wśród obrzezanych,"
"Tt1,11": "Którym trzeba zatykać usta; oni to wywracają całe domy, nauczając czego nie należy dla brudnego zysku."
"Tt1,12": "Powiedział któryś z nich, ich własny prorok: Kreteńczycy zawsze kłamcy, złe bydlęta, brzuchy leniwe."
"Tt1,13": "Świadectwo to jest prawdziwe; dla tej przyczyny karć ich surowo, żeby zdrowi byli w wierze,"
"Tt1,14": "I nie zwracali uwagi na żydowskie baśnie i przykazania ludzi, którzy odwracają się od prawdy."
"Tt1,15": "Dla czystych wszystko prawdziwie jest czyste, a dla skalanych i niewierzących nic nie jest czyste, ale skalany jest ich umysł i sumienie."
"Tt1,16": "Wyznają, że znają Boga; ale swoimi czynami zapierają się Go, będąc obrzydliwymi i nieposłusznymi, i niezdolnymi do żadnego dobrego czynu."
