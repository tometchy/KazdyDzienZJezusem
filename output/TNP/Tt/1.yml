"Tt1,1":
  text: "Paweł, sługa Boga i apostoł Jezusa Chrystusa, według wiary wybranych Bożych i dogłębnego poznania prawdy, zgodnie z pobożnością,"
  tags: []
"Tt1,2":
  text: "Z nadzieją życia wiecznego, które obiecał przed wiecznymi czasami Bóg, Ten który nie kłamie,"
  tags: []
"Tt1,3":
  text: "A ukazał we właściwym czasie swoje Słowo przez zwiastowanie, które jest mi powierzone według rozkazu Boga, Zbawiciela naszego,"
  tags: []
"Tt1,4":
  text: "Do Tytusa, prawowitego dziecka według wspólnej wiary. Łaska, miłosierdzie i pokój Boga Ojca i Pana Jezusa Chrystusa, Zbawiciela naszego."
  tags: []
"Tt1,5":
  text: "Z tego powodu zostawiłem cię na Krecie, abyś uporządkował te sprawy, które pozostały i ustanowił po miastach starszych, jak ci nakazałem;"
  tags: []
"Tt1,6":
  text: "Jeśli jest ktoś nienaganny, mąż jednej żony, mający dzieci wierne, nie oskarżone o rozwiązłość lub brak karności."
  tags: []
"Tt1,7":
  text: "Trzeba bowiem, aby biskup był nienaganny, jako szafarz Boży, nie samowolny, nieskłonny do gniewu, nie oddający się pijaństwu, nie porywczy, nie szukający haniebnego zysku,"
  tags: []
"Tt1,8":
  text: "Ale gościnny, miłujący dobro, roztropny, sprawiedliwy, święty, opanowany,"
  tags: []
"Tt1,9":
  text: "Trzymający się zgodnie z nauką słowa godnego zaufania, aby mógł zachęcać w zdrowej nauce i napominać tych, którzy się sprzeciwiają."
  tags: []
"Tt1,10":
  text: "Wielu bowiem jest nieposłusznych, pustych gadułów i zwodzicieli, szczególnie wśród obrzezanych,"
  tags: []
"Tt1,11":
  text: "Którym trzeba zatykać usta; oni to wywracają całe domy, nauczając czego nie należy dla brudnego zysku."
  tags: []
"Tt1,12":
  text: "Powiedział któryś z nich, ich własny prorok: Kreteńczycy zawsze kłamcy, złe bydlęta, brzuchy leniwe."
  tags: []
"Tt1,13":
  text: "Świadectwo to jest prawdziwe; dla tej przyczyny karć ich surowo, żeby zdrowi byli w wierze,"
  tags: []
"Tt1,14":
  text: "I nie zwracali uwagi na żydowskie baśnie i przykazania ludzi, którzy odwracają się od prawdy."
  tags: []
"Tt1,15":
  text: "Dla czystych wszystko prawdziwie jest czyste, a dla skalanych i niewierzących nic nie jest czyste, ale skalany jest ich umysł i sumienie."
  tags: []
"Tt1,16":
  text: "Wyznają, że znają Boga; ale swoimi czynami zapierają się Go, będąc obrzydliwymi i nieposłusznymi, i niezdolnymi do żadnego dobrego czynu."
  tags: []
