"Tt3,1":
  text: "Przypominaj im, aby zwierzchnościom i władzom byli ulegli i posłuszni, gotowi do wszelkiego dobrego czynu;"
  tags: []
"Tt3,2":
  text: "Aby nikomu nie bluźnili, nie byli wojowniczy, ale byli uprzejmi, okazujący wszelką łagodność wobec wszystkich ludzi."
  tags: []
"Tt3,3":
  text: "I my bowiem byliśmy niegdyś bezmyślni, nieposłuszni, błądzący, zniewoleni rozmaitymi pragnieniami i przyjemnościami, w złości i zazdrości, wiodący życie budzące obrzydzenie, nienawidzący jedni drugich."
  tags: []
"Tt3,4":
  text: "Ale gdy ukazała się dobroć i miłość ku ludziom Boga, Zbawiciela naszego,"
  tags: []
"Tt3,5":
  text: "Zbawił nas, nie z uczynków, których my dokonaliśmy w sprawiedliwości, ale według swojego miłosierdzia przez kąpiel odrodzenia i odnowienia Ducha Świętego,"
  tags: []
"Tt3,6":
  text: "Którego wylał na nas obficie przez Jezusa Chrystusa, Zbawiciela naszego,"
  tags: []
"Tt3,7":
  text: "Abyśmy, będąc uznani za sprawiedliwych dzięki Jego łasce, stali się dziedzicami zgodnie z nadzieją życia wiecznego."
  tags: []
"Tt3,8":
  text: "Godne zaufania jest to słowo i chcę, abyś o tym stanowczo twierdził, żeby ci, którzy uwierzyli Bogu, troszczyli się o przodowanie w dobrych czynach. Te sprawy są dobre i pożyteczne dla ludzi."
  tags: []
"Tt3,9":
  text: "Natomiast głupich dociekań i rodowodów, i kłótni, i walk związanych z Prawem unikaj; są bowiem bezużyteczne i próżne."
  tags: []
"Tt3,10":
  text: "A człowieka czyniącego rozłamy, po pierwszym i drugim napomnieniu unikaj,"
  tags: []
"Tt3,11":
  text: "Wiedząc, że taki jest przewrotny i grzeszy, i sam na siebie wydając skazujący wyrok."
  tags: []
"Tt3,12":
  text: "Gdy poślę do ciebie Artemasa albo Tychikusa, staraj się przyjść do mnie do Nikopolis; bo tam postanowiłem przezimować."
  tags: []
"Tt3,13":
  text: "Zenasa, uczonego w Prawie i Apollosa pilnie wypraw w drogę, aby im niczego nie brakowało."
  tags: []
"Tt3,14":
  text: "Niech i nasi uczą się przodować w dobrych dziełach, aby wobec koniecznych potrzeb, nie byli bezowocni."
  tags: []
"Tt3,15":
  text: "Pozdrawiają cię wszyscy, którzy są ze mną. Pozdrów tych, którzy nas miłują w wierze. Łaska z wami wszystkimi. Amen."
  tags: []
