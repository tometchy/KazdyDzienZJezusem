"Tt3,1": "Przypominaj im, aby zwierzchnościom i władzom byli ulegli i posłuszni, gotowi do wszelkiego dobrego czynu;"
"Tt3,2": "Aby nikomu nie bluźnili, nie byli wojowniczy, ale byli uprzejmi, okazujący wszelką łagodność wobec wszystkich ludzi."
"Tt3,3": "I my bowiem byliśmy niegdyś bezmyślni, nieposłuszni, błądzący, zniewoleni rozmaitymi pragnieniami i przyjemnościami, w złości i zazdrości, wiodący życie budzące obrzydzenie, nienawidzący jedni drugich."
"Tt3,4": "Ale gdy ukazała się dobroć i miłość ku ludziom Boga, Zbawiciela naszego,"
"Tt3,5": "Zbawił nas, nie z uczynków, których my dokonaliśmy w sprawiedliwości, ale według swojego miłosierdzia przez kąpiel odrodzenia i odnowienia Ducha Świętego,"
"Tt3,6": "Którego wylał na nas obficie przez Jezusa Chrystusa, Zbawiciela naszego,"
"Tt3,7": "Abyśmy, będąc uznani za sprawiedliwych dzięki Jego łasce, stali się dziedzicami zgodnie z nadzieją życia wiecznego."
"Tt3,8": "Godne zaufania jest to słowo i chcę, abyś o tym stanowczo twierdził, żeby ci, którzy uwierzyli Bogu, troszczyli się o przodowanie w dobrych czynach. Te sprawy są dobre i pożyteczne dla ludzi."
"Tt3,9": "Natomiast głupich dociekań i rodowodów, i kłótni, i walk związanych z Prawem unikaj; są bowiem bezużyteczne i próżne."
"Tt3,10": "A człowieka czyniącego rozłamy, po pierwszym i drugim napomnieniu unikaj,"
"Tt3,11": "Wiedząc, że taki jest przewrotny i grzeszy, i sam na siebie wydając skazujący wyrok."
"Tt3,12": "Gdy poślę do ciebie Artemasa albo Tychikusa, staraj się przyjść do mnie do Nikopolis; bo tam postanowiłem przezimować."
"Tt3,13": "Zenasa, uczonego w Prawie i Apollosa pilnie wypraw w drogę, aby im niczego nie brakowało."
"Tt3,14": "Niech i nasi uczą się przodować w dobrych dziełach, aby wobec koniecznych potrzeb, nie byli bezowocni."
"Tt3,15": "Pozdrawiają cię wszyscy, którzy są ze mną. Pozdrów tych, którzy nas miłują w wierze. Łaska z wami wszystkimi. Amen."
