"Ps113,1":
  text: "Chwalcie JH[WH]. Chwalcie, słudzy JHWH, chwalcie imię JHWH!"
  tags: []
"Ps113,2":
  text: "Niech imię JHWH będzie błogosławione, od teraz aż na wieki."
  tags: []
"Ps113,3":
  text: "Od wschodu słońca aż do jego zachodu, niech imię JHWH będzie wychwalane."
  tags: []
"Ps113,4":
  text: "JHWH jest wywyższony ponad wszystkie narody, Jego chwała ponad niebiosa."
  tags: []
"Ps113,5":
  text: "Któż jest jak JHWH, nasz Bóg, który uczynił wysoko swoje mieszkanie;"
  tags: []
"Ps113,6":
  text: "Który zniża się, aby patrzeć na niebiosa i na ziemię?"
  tags: []
"Ps113,7":
  text: "Podnosi nędznego z prochu, a z gnoju wywyższa ubogiego;"
  tags: []
"Ps113,8":
  text: "Aby usiadł pomiędzy książętami, pomiędzy książętami swojego ludu;"
  tags: []
"Ps113,9":
  text: "On sprawia, że niepłodna zamieszkuje w domu jako radosna matka synów. Chwalcie JH[WH]."
  tags: []
