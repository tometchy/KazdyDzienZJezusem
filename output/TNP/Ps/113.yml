"Ps113,1": "Chwalcie JH[WH]. Chwalcie, słudzy JHWH, chwalcie imię JHWH!"
"Ps113,2": "Niech imię JHWH będzie błogosławione, od teraz aż na wieki."
"Ps113,3": "Od wschodu słońca aż do jego zachodu, niech imię JHWH będzie wychwalane."
"Ps113,4": "JHWH jest wywyższony ponad wszystkie narody, Jego chwała ponad niebiosa."
"Ps113,5": "Któż jest jak JHWH, nasz Bóg, który uczynił wysoko swoje mieszkanie;"
"Ps113,6": "Który zniża się, aby patrzeć na niebiosa i na ziemię?"
"Ps113,7": "Podnosi nędznego z prochu, a z gnoju wywyższa ubogiego;"
"Ps113,8": "Aby usiadł pomiędzy książętami, pomiędzy książętami swojego ludu;"
"Ps113,9": "On sprawia, że niepłodna zamieszkuje w domu jako radosna matka synów. Chwalcie JH[WH]."
