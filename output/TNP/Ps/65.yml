"Ps65,1":
  text: "Dla Ciebie ciche oczekiwanie jest hymnem chwały, Boże na Syjonie i Tobie trzeba spełnić śluby."
  tags: []
"Ps65,2":
  text: "Ty wysłuchujesz modlitwę, dlatego do Ciebie przyjdzie wszelkie ciało."
  tags: []
"Ps65,3":
  text: "Spisy naszych nieprawości górują nad nami; Ty jednak przebaczasz nasze występki."
  tags: []
"Ps65,4":
  text: "Błogosławiony ten, którego Ty wybierasz i przyprowadzasz blisko do siebie, aby mieszkał w Twoich dziedzińcach; będziemy nasyceni dobrem Twojego domu, Twojej świętej świątyni."
  tags: []
"Ps65,5":
  text: "W prawości odpowiadasz nam czynami przejmującymi lękiem, Boże naszego zbawienia. Ty, źródło ufności wszystkich krańców ziemi i odległego morza."
  tags: []
"Ps65,6":
  text: "Ty, który utwierdzasz góry swoją mocą, przepasany potęgą;"
  tags: []
"Ps65,7":
  text: "Ty, który uśmierzasz szum morza, szum jego fal i wzburzenie narodów;"
  tags: []
"Ps65,8":
  text: "Mieszkający na krańcach ziemi boją się z powodu Twoich znaków; Ty napełniasz radością tam, gdzie nastaje poranek i zapada wieczór."
  tags: []
"Ps65,9":
  text: "Doglądasz ziemię i obficie wylewasz na nią wodę, wielce się wzbogaciła. Strumień Boży jest pełen wód. Przygotowujesz im zboże, gdyż tak przygotowujesz ziemię."
  tags: []
"Ps65,10":
  text: "Nawadniasz jej zagony, wyrównujesz jej skiby, zmiękczasz ją deszczami i błogosławisz jej pędom."
  tags: []
"Ps65,11":
  text: "Wieńczysz rok swoją dobrocią, a Twoje ścieżki ociekają tłustością."
  tags: []
"Ps65,12":
  text: "Skrapiasz pustynne pastwiska, a pagórki przepasują się radością."
  tags: []
"Ps65,13":
  text: "Łąki przyodziewają się stadami, a doliny okrywają się zbożem; wykrzykują radośnie, tak na głos śpiewają."
  tags: []
