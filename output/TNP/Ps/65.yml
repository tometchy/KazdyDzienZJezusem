"Ps65,1": "Dla Ciebie ciche oczekiwanie jest hymnem chwały, Boże na Syjonie i Tobie trzeba spełnić śluby."
"Ps65,2": "Ty wysłuchujesz modlitwę, dlatego do Ciebie przyjdzie wszelkie ciało."
"Ps65,3": "Spisy naszych nieprawości górują nad nami; Ty jednak przebaczasz nasze występki."
"Ps65,4": "Błogosławiony ten, którego Ty wybierasz i przyprowadzasz blisko do siebie, aby mieszkał w Twoich dziedzińcach; będziemy nasyceni dobrem Twojego domu, Twojej świętej świątyni."
"Ps65,5": "W prawości odpowiadasz nam czynami przejmującymi lękiem, Boże naszego zbawienia. Ty, źródło ufności wszystkich krańców ziemi i odległego morza."
"Ps65,6": "Ty, który utwierdzasz góry swoją mocą, przepasany potęgą;"
"Ps65,7": "Ty, który uśmierzasz szum morza, szum jego fal i wzburzenie narodów;"
"Ps65,8": "Mieszkający na krańcach ziemi boją się z powodu Twoich znaków; Ty napełniasz radością tam, gdzie nastaje poranek i zapada wieczór."
"Ps65,9": "Doglądasz ziemię i obficie wylewasz na nią wodę, wielce się wzbogaciła. Strumień Boży jest pełen wód. Przygotowujesz im zboże, gdyż tak przygotowujesz ziemię."
"Ps65,10": "Nawadniasz jej zagony, wyrównujesz jej skiby, zmiękczasz ją deszczami i błogosławisz jej pędom."
"Ps65,11": "Wieńczysz rok swoją dobrocią, a Twoje ścieżki ociekają tłustością."
"Ps65,12": "Skrapiasz pustynne pastwiska, a pagórki przepasują się radością."
"Ps65,13": "Łąki przyodziewają się stadami, a doliny okrywają się zbożem; wykrzykują radośnie, tak na głos śpiewają."
