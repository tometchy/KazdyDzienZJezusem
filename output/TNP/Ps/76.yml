"Ps76,1": "Bóg znany jest w Judzie, Jego imię jest wielkie w Izraelu."
"Ps76,2": "I w Salem powstał Jego przybytek, a Jego mieszkanie na Syjonie."
"Ps76,3": "Tam połamał ogniste strzały łuku, tarczę i miecz oraz narzędzia wojny. Sela."
"Ps76,4": "Olśniewający jesteś i dostojniejszy niż góry pełne zdobyczy."
"Ps76,5": "Uparci sercem zostali złupieni, drzemią we śnie, wszyscy waleczni ludzie nie znaleźli siły w swoich rękach."
"Ps76,6": "Od Twojego napomnienia, Boże Jakuba, pogrążył się we śnie woźnica i koń."
"Ps76,7": "Ty napawasz lękiem, Ty sam i kto się ostoi przed Twoim obliczem w czasie Twojego gniewu?"
"Ps76,8": "Z niebios dajesz słyszeć swój wyrok, ziemia się zlękła i zamilkła;"
"Ps76,9": "Gdy Bóg powstał na sąd, aby wybawić wszystkich pokornych ziemi. Sela."
"Ps76,10": "Bo nawet gniew człowieka będzie Ciebie chwalił, a pozostałością gniewu opaszesz się."
"Ps76,11": "Składajcie śluby i odnawiajcie je wobec JHWH, waszego Boga; wszyscy otaczający Go, przynoście dary Temu, który jest Straszny."
"Ps76,12": "On odcina ducha książąt, On napawa lękiem królów ziemi."
