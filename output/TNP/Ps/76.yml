"Ps76,1":
  text: "Bóg znany jest w Judzie, Jego imię jest wielkie w Izraelu."
  tags: []
"Ps76,2":
  text: "I w Salem powstał Jego przybytek, a Jego mieszkanie na Syjonie."
  tags: []
"Ps76,3":
  text: "Tam połamał ogniste strzały łuku, tarczę i miecz oraz narzędzia wojny. Sela."
  tags: []
"Ps76,4":
  text: "Olśniewający jesteś i dostojniejszy niż góry pełne zdobyczy."
  tags: []
"Ps76,5":
  text: "Uparci sercem zostali złupieni, drzemią we śnie, wszyscy waleczni ludzie nie znaleźli siły w swoich rękach."
  tags: []
"Ps76,6":
  text: "Od Twojego napomnienia, Boże Jakuba, pogrążył się we śnie woźnica i koń."
  tags: []
"Ps76,7":
  text: "Ty napawasz lękiem, Ty sam i kto się ostoi przed Twoim obliczem w czasie Twojego gniewu?"
  tags: []
"Ps76,8":
  text: "Z niebios dajesz słyszeć swój wyrok, ziemia się zlękła i zamilkła;"
  tags: []
"Ps76,9":
  text: "Gdy Bóg powstał na sąd, aby wybawić wszystkich pokornych ziemi. Sela."
  tags: []
"Ps76,10":
  text: "Bo nawet gniew człowieka będzie Ciebie chwalił, a pozostałością gniewu opaszesz się."
  tags: []
"Ps76,11":
  text: "Składajcie śluby i odnawiajcie je wobec JHWH, waszego Boga; wszyscy otaczający Go, przynoście dary Temu, który jest Straszny."
  tags: []
"Ps76,12":
  text: "On odcina ducha książąt, On napawa lękiem królów ziemi."
  tags: []
