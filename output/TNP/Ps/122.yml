"Ps122,1":
  text: "Pieśń stopni. Dawida. Uradowałem się, gdy mi powiedzieli: Pójdźmy do domu JHWH!"
  tags: []
"Ps122,2":
  text: "I oto nasze nogi stanęły w twoich bramach, o Jerozolimo!"
  tags: []
"Ps122,3":
  text: "Jerozolima jest budowana jako miasto, zespolona w jedną całość;"
  tags: []
"Ps122,4":
  text: "Bo tam wstępują pokolenia, pokolenia JH[WH] do świadectwa Izraela, aby wysławiać imię JHWH."
  tags: []
"Ps122,5":
  text: "Tam bowiem ustanowili trony sądu, trony domu Dawida."
  tags: []
"Ps122,6":
  text: "Proście o pokój dla Jerozolimy: Niech się szczęści tym, którzy cię miłują."
  tags: []
"Ps122,7":
  text: "Niech będzie pokój w twoich murach i spokój w twoich pałacach."
  tags: []
"Ps122,8":
  text: "Ze względu na moich braci i moich przyjaciół pragnę teraz powiedzieć: Pokój Tobie."
  tags: []
"Ps122,9":
  text: "Ze względu na dom JHWH, naszego Boga, pragnę zabiegać o dobro dla ciebie."
  tags: []
