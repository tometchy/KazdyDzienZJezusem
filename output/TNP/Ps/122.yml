"Ps122,1": "Pieśń stopni. Dawida. Uradowałem się, gdy mi powiedzieli: Pójdźmy do domu JHWH!"
"Ps122,2": "I oto nasze nogi stanęły w twoich bramach, o Jerozolimo!"
"Ps122,3": "Jerozolima jest budowana jako miasto, zespolona w jedną całość;"
"Ps122,4": "Bo tam wstępują pokolenia, pokolenia JH[WH] do świadectwa Izraela, aby wysławiać imię JHWH."
"Ps122,5": "Tam bowiem ustanowili trony sądu, trony domu Dawida."
"Ps122,6": "Proście o pokój dla Jerozolimy: Niech się szczęści tym, którzy cię miłują."
"Ps122,7": "Niech będzie pokój w twoich murach i spokój w twoich pałacach."
"Ps122,8": "Ze względu na moich braci i moich przyjaciół pragnę teraz powiedzieć: Pokój Tobie."
"Ps122,9": "Ze względu na dom JHWH, naszego Boga, pragnę zabiegać o dobro dla ciebie."
