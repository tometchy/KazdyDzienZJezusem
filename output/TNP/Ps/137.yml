"Ps137,1":
  text: "Nad rzekami Babilonu, tam siedzieliśmy i płakaliśmy wspominając Syjon."
  tags: []
"Ps137,2":
  text: "Na wierzbach pośród niego zawiesiliśmy nasze harfy;"
  tags: []
"Ps137,3":
  text: "Gdyż tam ci, którzy nas wzięli w niewolę, domagali się od nas słów pieśni, a nasi szydercy mówili: Z radością śpiewajcie nam którąś z pieśni Syjonu."
  tags: []
"Ps137,4":
  text: "Jak będziemy śpiewać pieśń JHWH na obcej ziemi?"
  tags: []
"Ps137,5":
  text: "Jeśli zapomnę o tobie, Jerozolimo, niech zapomni o mnie moja prawica."
  tags: []
"Ps137,6":
  text: "Niech mi język przylgnie do moich ust, jeśli nie będę pamiętał o tobie, jeśli nie wyniosę Jerozolimy ponad największą moją radość."
  tags: []
"Ps137,7":
  text: "Pamiętaj, JHWH, synom Edomu dzień Jerozolimy, gdy mówili: Obnażcie, obnażcie ją aż do jej podstaw."
  tags: []
"Ps137,8":
  text: "O, córko Babilonu! I ty zostaniesz spustoszona. Błogosławiony, kto ci zapłaci tym, czym nam płaciłaś."
  tags: []
"Ps137,9":
  text: "Błogosławiony, kto schwyta i roztrzaska twoje dzieci o skałę."
  tags: []
