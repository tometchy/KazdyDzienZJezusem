"Ps137,1": "Nad rzekami Babilonu, tam siedzieliśmy i płakaliśmy wspominając Syjon."
"Ps137,2": "Na wierzbach pośród niego zawiesiliśmy nasze harfy;"
"Ps137,3": "Gdyż tam ci, którzy nas wzięli w niewolę, domagali się od nas słów pieśni, a nasi szydercy mówili: Z radością śpiewajcie nam którąś z pieśni Syjonu."
"Ps137,4": "Jak będziemy śpiewać pieśń JHWH na obcej ziemi?"
"Ps137,5": "Jeśli zapomnę o tobie, Jerozolimo, niech zapomni o mnie moja prawica."
"Ps137,6": "Niech mi język przylgnie do moich ust, jeśli nie będę pamiętał o tobie, jeśli nie wyniosę Jerozolimy ponad największą moją radość."
"Ps137,7": "Pamiętaj, JHWH, synom Edomu dzień Jerozolimy, gdy mówili: Obnażcie, obnażcie ją aż do jej podstaw."
"Ps137,8": "O, córko Babilonu! I ty zostaniesz spustoszona. Błogosławiony, kto ci zapłaci tym, czym nam płaciłaś."
"Ps137,9": "Błogosławiony, kto schwyta i roztrzaska twoje dzieci o skałę."
