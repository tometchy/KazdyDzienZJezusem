"Ps95,1":
  text: "Chodźcie, wykrzykujmy radośnie JHWH, wykrzykujmy triumfalnie skale naszego zbawienia!"
  tags: []
"Ps95,2":
  text: "Przyjdźmy przed Jego oblicze z dziękczynieniem, w pieśniach wykrzykujmy triumfalnie do Niego."
  tags: []
"Ps95,3":
  text: "JHWH bowiem jest wielkim Bogiem i wielkim Królem – ponad wszystkich bogów."
  tags: []
"Ps95,4":
  text: "W Jego ręku są głębiny ziemi i Jego są szczyty gór."
  tags: []
"Ps95,5":
  text: "Do Niego należy morze i On je uczynił, i Jego ręka ukształtowała suchy ląd."
  tags: []
"Ps95,6":
  text: "Wejdźcie! Oddajmy pokłon i padnijmy przed Nim, błogosławmy przed obliczem JHWH, który nas uczynił."
  tags: []
"Ps95,7":
  text: "On bowiem jest naszym Bogiem, a my ludem Jego pastwiska i trzodą Jego ręki. Dziś, jeśli Jego głos usłyszycie;"
  tags: []
"Ps95,8":
  text: "Nie zatwardzajcie waszych serc jak w Meriba, jak w dniu Massa – na pustyni;"
  tags: []
"Ps95,9":
  text: "Kiedy wystawiali mnie na próbę wasi ojcowie, doświadczali mnie, choć widzieli moje dzieła."
  tags: []
"Ps95,10":
  text: "Przez czterdzieści lat czułem odrazę do tego pokolenia i powiedziałem: Ten lud błądzi sercem i nie poznał moich dróg;"
  tags: []
"Ps95,11":
  text: "Przysiągłem im w swoim gniewie, że nie wejdą do mojego odpoczynku."
  tags: []
