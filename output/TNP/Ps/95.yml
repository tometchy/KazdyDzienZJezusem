"Ps95,1": "Chodźcie, wykrzykujmy radośnie JHWH, wykrzykujmy triumfalnie skale naszego zbawienia!"
"Ps95,2": "Przyjdźmy przed Jego oblicze z dziękczynieniem, w pieśniach wykrzykujmy triumfalnie do Niego."
"Ps95,3": "JHWH bowiem jest wielkim Bogiem i wielkim Królem – ponad wszystkich bogów."
"Ps95,4": "W Jego ręku są głębiny ziemi i Jego są szczyty gór."
"Ps95,5": "Do Niego należy morze i On je uczynił, i Jego ręka ukształtowała suchy ląd."
"Ps95,6": "Wejdźcie! Oddajmy pokłon i padnijmy przed Nim, błogosławmy przed obliczem JHWH, który nas uczynił."
"Ps95,7": "On bowiem jest naszym Bogiem, a my ludem Jego pastwiska i trzodą Jego ręki. Dziś, jeśli Jego głos usłyszycie;"
"Ps95,8": "Nie zatwardzajcie waszych serc jak w Meriba, jak w dniu Massa – na pustyni;"
"Ps95,9": "Kiedy wystawiali mnie na próbę wasi ojcowie, doświadczali mnie, choć widzieli moje dzieła."
"Ps95,10": "Przez czterdzieści lat czułem odrazę do tego pokolenia i powiedziałem: Ten lud błądzi sercem i nie poznał moich dróg;"
"Ps95,11": "Przysiągłem im w swoim gniewie, że nie wejdą do mojego odpoczynku."
