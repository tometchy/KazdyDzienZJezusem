"Ps10,1":
  text: "Dlaczego JHWH stoisz z daleka? Dlaczego ukrywasz się w czasie niedoli?"
  tags: []
"Ps10,2":
  text: "Ubogi płonie z powodu pychy niegodziwego, niech niegodziwi zostaną schwytani w knowania, które obmyślili."
  tags: []
"Ps10,3":
  text: "Bo niegodziwy pyszni się pragnieniem swojej duszy, a chciwiec błogosławi i pogardza JHWH."
  tags: []
"Ps10,4":
  text: "Niegodziwy z wyniosłością na twarzy, nie będzie dociekał! Nie ma Boga, taka jest cała jego roztropność."
  tags: []
"Ps10,5":
  text: "Jego drogi zawsze są pokrętne, Twoje sądy są daleko od niego, sapie na wszystkich swoich wrogów."
  tags: []
"Ps10,6":
  text: "Mówi w swoim sercu: Nie zachwieję się, nie zaznam udręki z pokolenia na pokolenie."
  tags: []
"Ps10,7":
  text: "Jego usta pełne są przekleństw, zdrady i podstępu, pod jego językiem gnieździ się krzywda i nieprawość."
  tags: []
"Ps10,8":
  text: "Siedzi w zasadzce w osadach, z ukrycia morduje niewinnego, jego oczy wypatrują nieszczęśliwego."
  tags: []
"Ps10,9":
  text: "Będzie czyhał w kryjówce jak lew w zaroślach; czyha, by schwytać ubogiego, porywa i wciąga ubogiego w swoją sieć."
  tags: []
"Ps10,10":
  text: "Schyla się, zniża się, w jego moc wpada nieszczęśnik."
  tags: []
"Ps10,11":
  text: "Mówi w swoim sercu: Bóg zapomniał, zakrył swoje oblicze, nigdy nie zobaczy."
  tags: []
"Ps10,12":
  text: "Powstań, JHWH Boże, podnieś swoją rękę; nie zapominaj o ubogich."
  tags: []
"Ps10,13":
  text: "Dlaczego niegodziwy znieważa Boga? Mówi w swoim sercu: Nie będziesz prowadził dochodzenia."
  tags: []
"Ps10,14":
  text: "Lecz Ty widzisz utrapienie i patrzysz na krzywdę, aby wziąć sprawę w swoje ręce. Na Ciebie zdaje się nieszczęśnik, Ty przychodzisz z pomocą sierocie."
  tags: []
"Ps10,15":
  text: "Złam ramię niegodziwego i złego, dochodź jego nieprawości, aż się jej nie znajdzie."
  tags: []
"Ps10,16":
  text: "JHWH jest Królem na wieki wieków, z Jego ziemi zginęły narody."
  tags: []
"Ps10,17":
  text: "Ty rozumiesz pragnienia pokornych, JHWH, utwierdzisz ich serca, nakłonisz swoje ucho;"
  tags: []
"Ps10,18":
  text: "Aby bronić sieroty i udręczonego, by śmiertelny człowiek już więcej nie wzbudzał strachu."
  tags: []
