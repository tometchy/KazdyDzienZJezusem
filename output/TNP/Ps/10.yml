"Ps10,1": "Dlaczego JHWH stoisz z daleka? Dlaczego ukrywasz się w czasie niedoli?"
"Ps10,2": "Ubogi płonie z powodu pychy niegodziwego, niech niegodziwi zostaną schwytani w knowania, które obmyślili."
"Ps10,3": "Bo niegodziwy pyszni się pragnieniem swojej duszy, a chciwiec błogosławi i pogardza JHWH."
"Ps10,4": "Niegodziwy z wyniosłością na twarzy, nie będzie dociekał! Nie ma Boga, taka jest cała jego roztropność."
"Ps10,5": "Jego drogi zawsze są pokrętne, Twoje sądy są daleko od niego, sapie na wszystkich swoich wrogów."
"Ps10,6": "Mówi w swoim sercu: Nie zachwieję się, nie zaznam udręki z pokolenia na pokolenie."
"Ps10,7": "Jego usta pełne są przekleństw, zdrady i podstępu, pod jego językiem gnieździ się krzywda i nieprawość."
"Ps10,8": "Siedzi w zasadzce w osadach, z ukrycia morduje niewinnego, jego oczy wypatrują nieszczęśliwego."
"Ps10,9": "Będzie czyhał w kryjówce jak lew w zaroślach; czyha, by schwytać ubogiego, porywa i wciąga ubogiego w swoją sieć."
"Ps10,10": "Schyla się, zniża się, w jego moc wpada nieszczęśnik."
"Ps10,11": "Mówi w swoim sercu: Bóg zapomniał, zakrył swoje oblicze, nigdy nie zobaczy."
"Ps10,12": "Powstań, JHWH Boże, podnieś swoją rękę; nie zapominaj o ubogich."
"Ps10,13": "Dlaczego niegodziwy znieważa Boga? Mówi w swoim sercu: Nie będziesz prowadził dochodzenia."
"Ps10,14": "Lecz Ty widzisz utrapienie i patrzysz na krzywdę, aby wziąć sprawę w swoje ręce. Na Ciebie zdaje się nieszczęśnik, Ty przychodzisz z pomocą sierocie."
"Ps10,15": "Złam ramię niegodziwego i złego, dochodź jego nieprawości, aż się jej nie znajdzie."
"Ps10,16": "JHWH jest Królem na wieki wieków, z Jego ziemi zginęły narody."
"Ps10,17": "Ty rozumiesz pragnienia pokornych, JHWH, utwierdzisz ich serca, nakłonisz swoje ucho;"
"Ps10,18": "Aby bronić sieroty i udręczonego, by śmiertelny człowiek już więcej nie wzbudzał strachu."
