"Ps35,1":
  text: "Psalm Dawida. Zmagaj się, JHWH, z moimi przeciwnikami, walcz z tymi, którzy walczą ze mną!"
  tags: []
"Ps35,2":
  text: "Chwyć tarczę i puklerz i powstań mi na pomoc!"
  tags: []
"Ps35,3":
  text: "Wyciągnij włócznię i zagrodź drogę moim prześladowcom. Powiedz mojej duszy: Ja jestem twoim zbawieniem!"
  tags: []
"Ps35,4":
  text: "Niech będą zawstydzeni i upokorzeni ci, którzy szukają mojej duszy! Niech się obrócą i odejdą zmieszani ci, którzy planują wyrządzić mi krzywdę!"
  tags: []
"Ps35,5":
  text: "Niech będą jak plewy na wietrze i niech anioł JHWH ich rozproszy."
  tags: []
"Ps35,6":
  text: "Niech droga ich będzie ciemna i śliska i niech anioł JHWH ich ściga."
  tags: []
"Ps35,7":
  text: "Bez powodu bowiem skrycie przygotowali na mnie w dole sieć, bez powodu wykopali dół na moją duszę."
  tags: []
"Ps35,8":
  text: "Niech bezwiednie przyjdzie na takiego zniszczenie; i niech złapie go jego własna sieć, którą ukrył. Niech w nią wpadnie ku zniszczeniu."
  tags: []
"Ps35,9":
  text: "A moja dusza rozraduje się w JHWH, będzie się weselić Jego zbawieniem."
  tags: []
"Ps35,10":
  text: "Wszystkie moje kości powiedzą: JHWH, któż jest jak Ty, który wyrywasz ubogiego z ręki silniejszego od niego, ubogiego i będącego w potrzebie z ręki grabiącego?"
  tags: []
"Ps35,11":
  text: "Powstają okrutni świadkowie i będą mnie pytać o to, czego nie wiem."
  tags: []
"Ps35,12":
  text: "Odpłacili mi złem w zamian za dobro, osieroceniem mojej duszy."
  tags: []
"Ps35,13":
  text: "Lecz ja, gdy oni chorowali, ubierałem się w wór, dręczyłem postem moją duszę i moja modlitwa wracała na moją pierś."
  tags: []
"Ps35,14":
  text: "Postępowałem jak z przyjacielem, jak z bratem, chodziłem jak w żałobie po matce, zasępiony i zgięty"
  tags: []
"Ps35,15":
  text: "Lecz gdy ja kulałem, oni się radowali i zbierali się, zbierali się przeciwko mnie, pobici – o czym nie wiedziałem – szarpią mnie i nie milczą."
  tags: []
"Ps35,16":
  text: "Między obłudnikami i prześmiewcami, za jedzenie zgrzytali na mnie zębami."
  tags: []
"Ps35,17":
  text: "PANIE, jak długo będziesz na to patrzeć? Odnów z ruin moją duszę, od młodych lwów ocal drogą duszę moją."
  tags: []
"Ps35,18":
  text: "Będę Ci dziękował w wielkim zgromadzeniu, wśród licznego ludu będę Cię chwalił."
  tags: []
"Ps35,19":
  text: "Niech się nie cieszą ze mnie moi zakłamani wrogowie, nienawidzący mnie bez powodu. Niech nie mrugają okiem."
  tags: []
"Ps35,20":
  text: "Nie mówią bowiem o pokoju, lecz przeciwko spokojnym tej ziemi obmyślają zdradliwe słowa."
  tags: []
"Ps35,21":
  text: "Rozwierają na mnie swoje usta, mówiąc: Ha, ha! Widziały to nasze oczy."
  tags: []
"Ps35,22":
  text: "Widziałeś to, JHWH, nie milcz; PANIE, nie bądź ode mnie daleki."
  tags: []
"Ps35,23":
  text: "Ocknij się i obudź się na mój sąd, mój Boże i PANIE! Powstań do sporu o mnie."
  tags: []
"Ps35,24":
  text: "Osądź mnie według swojej sprawiedliwości, JHWH, mój Boże! Niech się nie radują ze mnie."
  tags: []
"Ps35,25":
  text: "Niech nie mówią w swoim sercu: Ha! Nasza dusza górą! Niech nie mówią: Pochłonęliśmy go!"
  tags: []
"Ps35,26":
  text: "Niech się zawstydzą i zmieszają ci, którzy razem cieszą się z mojego nieszczęścia; niech się okryją wstydem i hańbą ci, którzy się nade mnie wynoszą."
  tags: []
"Ps35,27":
  text: "Ale niech wykrzykują z radości i niech ucieszą się ci, którzy pragną mojej sprawiedliwości; niech mówią nieustannie: Niech będzie wywyższony JHWH, który pragnie pokoju dla swojego sługi."
  tags: []
"Ps35,28":
  text: "A mój język przez cały dzień będzie rozgłaszał Twoją sprawiedliwość i Twoją chwałę."
  tags: []
