"Ps35,1": "Psalm Dawida. Zmagaj się, JHWH, z moimi przeciwnikami, walcz z tymi, którzy walczą ze mną!"
"Ps35,2": "Chwyć tarczę i puklerz i powstań mi na pomoc!"
"Ps35,3": "Wyciągnij włócznię i zagrodź drogę moim prześladowcom. Powiedz mojej duszy: Ja jestem twoim zbawieniem!"
"Ps35,4": "Niech będą zawstydzeni i upokorzeni ci, którzy szukają mojej duszy! Niech się obrócą i odejdą zmieszani ci, którzy planują wyrządzić mi krzywdę!"
"Ps35,5": "Niech będą jak plewy na wietrze i niech anioł JHWH ich rozproszy."
"Ps35,6": "Niech droga ich będzie ciemna i śliska i niech anioł JHWH ich ściga."
"Ps35,7": "Bez powodu bowiem skrycie przygotowali na mnie w dole sieć, bez powodu wykopali dół na moją duszę."
"Ps35,8": "Niech bezwiednie przyjdzie na takiego zniszczenie; i niech złapie go jego własna sieć, którą ukrył. Niech w nią wpadnie ku zniszczeniu."
"Ps35,9": "A moja dusza rozraduje się w JHWH, będzie się weselić Jego zbawieniem."
"Ps35,10": "Wszystkie moje kości powiedzą: JHWH, któż jest jak Ty, który wyrywasz ubogiego z ręki silniejszego od niego, ubogiego i będącego w potrzebie z ręki grabiącego?"
"Ps35,11": "Powstają okrutni świadkowie i będą mnie pytać o to, czego nie wiem."
"Ps35,12": "Odpłacili mi złem w zamian za dobro, osieroceniem mojej duszy."
"Ps35,13": "Lecz ja, gdy oni chorowali, ubierałem się w wór, dręczyłem postem moją duszę i moja modlitwa wracała na moją pierś."
"Ps35,14": "Postępowałem jak z przyjacielem, jak z bratem, chodziłem jak w żałobie po matce, zasępiony i zgięty"
"Ps35,15": "Lecz gdy ja kulałem, oni się radowali i zbierali się, zbierali się przeciwko mnie, pobici – o czym nie wiedziałem – szarpią mnie i nie milczą."
"Ps35,16": "Między obłudnikami i prześmiewcami, za jedzenie zgrzytali na mnie zębami."
"Ps35,17": "PANIE, jak długo będziesz na to patrzeć? Odnów z ruin moją duszę, od młodych lwów ocal drogą duszę moją."
"Ps35,18": "Będę Ci dziękował w wielkim zgromadzeniu, wśród licznego ludu będę Cię chwalił."
"Ps35,19": "Niech się nie cieszą ze mnie moi zakłamani wrogowie, nienawidzący mnie bez powodu. Niech nie mrugają okiem."
"Ps35,20": "Nie mówią bowiem o pokoju, lecz przeciwko spokojnym tej ziemi obmyślają zdradliwe słowa."
"Ps35,21": "Rozwierają na mnie swoje usta, mówiąc: Ha, ha! Widziały to nasze oczy."
"Ps35,22": "Widziałeś to, JHWH, nie milcz; PANIE, nie bądź ode mnie daleki."
"Ps35,23": "Ocknij się i obudź się na mój sąd, mój Boże i PANIE! Powstań do sporu o mnie."
"Ps35,24": "Osądź mnie według swojej sprawiedliwości, JHWH, mój Boże! Niech się nie radują ze mnie."
"Ps35,25": "Niech nie mówią w swoim sercu: Ha! Nasza dusza górą! Niech nie mówią: Pochłonęliśmy go!"
"Ps35,26": "Niech się zawstydzą i zmieszają ci, którzy razem cieszą się z mojego nieszczęścia; niech się okryją wstydem i hańbą ci, którzy się nade mnie wynoszą."
"Ps35,27": "Ale niech wykrzykują z radości i niech ucieszą się ci, którzy pragną mojej sprawiedliwości; niech mówią nieustannie: Niech będzie wywyższony JHWH, który pragnie pokoju dla swojego sługi."
"Ps35,28": "A mój język przez cały dzień będzie rozgłaszał Twoją sprawiedliwość i Twoją chwałę."
