"Ps97,1":
  text: "JHWH króluje, raduj się ziemio, i weselcie się rozliczne wyspy!"
  tags: []
"Ps97,2":
  text: "Chmura i ciemność wokół Niego, sprawiedliwość i prawo podstawą Jego tronu."
  tags: []
"Ps97,3":
  text: "Ogień idzie przed Jego obliczem i pali jego wrogów wokoło."
  tags: []
"Ps97,4":
  text: "Sprawił, że Jego błyskawice oświetlają świat, zobaczyła to ziemia i drży."
  tags: []
"Ps97,5":
  text: "Góry stopniały jak wosk przed obliczem JHWH, przed obliczem PANA całej ziemi."
  tags: []
"Ps97,6":
  text: "Niebiosa obwieściły Jego sprawiedliwość, a wszystkie narody zobaczyły Jego chwałę."
  tags: []
"Ps97,7":
  text: "Niech będą zawstydzeni wszyscy, którzy służą posągom, którzy chlubią się bożkami; oddajcie Mu pokłon wszyscy bogowie."
  tags: []
"Ps97,8":
  text: "Syjon to usłyszał i weseli się, a córki Judy radują się z powodu Twoich sądów, JHWH!"
  tags: []
"Ps97,9":
  text: "Ty bowiem, JHWH, jesteś Najwyższy ponad całą ziemią, wywyższony ponad wszystkich bogów."
  tags: []
"Ps97,10":
  text: "Wy, którzy miłujecie JHWH, miejcie w nienawiści zło; On strzeże dusz swoich świętych, wyrywa ich z ręki niegodziwych."
  tags: []
"Ps97,11":
  text: "Światło zostało zasiane dla sprawiedliwego i radość dla tych, którzy są prawego serca."
  tags: []
"Ps97,12":
  text: "Radujcie się w JHWH sprawiedliwi i wysławiajcie Go, mając w pamięci Jego świętość."
  tags: []
