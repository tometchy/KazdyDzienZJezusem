"Ps97,1": "JHWH króluje, raduj się ziemio, i weselcie się rozliczne wyspy!"
"Ps97,2": "Chmura i ciemność wokół Niego, sprawiedliwość i prawo podstawą Jego tronu."
"Ps97,3": "Ogień idzie przed Jego obliczem i pali jego wrogów wokoło."
"Ps97,4": "Sprawił, że Jego błyskawice oświetlają świat, zobaczyła to ziemia i drży."
"Ps97,5": "Góry stopniały jak wosk przed obliczem JHWH, przed obliczem PANA całej ziemi."
"Ps97,6": "Niebiosa obwieściły Jego sprawiedliwość, a wszystkie narody zobaczyły Jego chwałę."
"Ps97,7": "Niech będą zawstydzeni wszyscy, którzy służą posągom, którzy chlubią się bożkami; oddajcie Mu pokłon wszyscy bogowie."
"Ps97,8": "Syjon to usłyszał i weseli się, a córki Judy radują się z powodu Twoich sądów, JHWH!"
"Ps97,9": "Ty bowiem, JHWH, jesteś Najwyższy ponad całą ziemią, wywyższony ponad wszystkich bogów."
"Ps97,10": "Wy, którzy miłujecie JHWH, miejcie w nienawiści zło; On strzeże dusz swoich świętych, wyrywa ich z ręki niegodziwych."
"Ps97,11": "Światło zostało zasiane dla sprawiedliwego i radość dla tych, którzy są prawego serca."
"Ps97,12": "Radujcie się w JHWH sprawiedliwi i wysławiajcie Go, mając w pamięci Jego świętość."
