"Ps128,1":
  text: "Pieśń stopni. Błogosławiony każdy, bojący się JHWH, ten kto kroczy Jego drogami!"
  tags: []
"Ps128,2":
  text: "Bo będziesz spożywał z trudu swoich rąk; będziesz błogosławionym i będzie ci dobrze."
  tags: []
"Ps128,3":
  text: "Twoja żona będzie jak owocująca winorośl na zewnątrz twojego domu; twoi synowie jak sadzonki oliwne dokoła twojego stołu."
  tags: []
"Ps128,4":
  text: "Oto właśnie tak błogosławiony jest mąż, który boi się JHWH."
  tags: []
"Ps128,5":
  text: "Niech ci JHWH błogosławi z Syjonu, abyś oglądał dobro Jerozolimy po wszystkie dni twojego życia;"
  tags: []
"Ps128,6":
  text: "I abyś oglądał synów twoich synów. Pokój nad Izraelem."
  tags: []
