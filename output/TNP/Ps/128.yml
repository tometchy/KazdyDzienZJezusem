"Ps128,1": "Pieśń stopni. Błogosławiony każdy, bojący się JHWH, ten kto kroczy Jego drogami!"
"Ps128,2": "Bo będziesz spożywał z trudu swoich rąk; będziesz błogosławionym i będzie ci dobrze."
"Ps128,3": "Twoja żona będzie jak owocująca winorośl na zewnątrz twojego domu; twoi synowie jak sadzonki oliwne dokoła twojego stołu."
"Ps128,4": "Oto właśnie tak błogosławiony jest mąż, który boi się JHWH."
"Ps128,5": "Niech ci JHWH błogosławi z Syjonu, abyś oglądał dobro Jerozolimy po wszystkie dni twojego życia;"
"Ps128,6": "I abyś oglądał synów twoich synów. Pokój nad Izraelem."
