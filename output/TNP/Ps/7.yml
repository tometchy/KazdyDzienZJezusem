"Ps7,1":
  text: "JHWH, mój Boże, Tobie ufam, wybaw mnie od wszystkich moich prześladowców i wyzwól mnie;"
  tags: []
"Ps7,2":
  text: "By nikt jak lew nie porwał mojej duszy i nie rozszarpał, gdy nie będzie nikogo, kto by ją ocalił."
  tags: []
"Ps7,3":
  text: "JHWH, mój Boże, jeśli to zrobiłem, jeśli nieprawość jest na moich dłoniach;"
  tags: []
"Ps7,4":
  text: "Jeśli złem odpłaciłem temu, kto żył ze mną w pokoju, jeśli nie wyratowałem tego, który mnie dręczył bez powodu;"
  tags: []
"Ps7,5":
  text: "To niech nieprzyjaciel prześladuje moją duszę i niech pochwyci i wdepcze w ziemię moje życie, niech moją chwałę w proch obróci. Sela."
  tags: []
"Ps7,6":
  text: "Powstań, JHWH, w swoim gniewie; podnieś się przeciwko wściekłości moich wrogów. Przebudź się w mojej obronie, bo Ty zarządziłeś sąd."
  tags: []
"Ps7,7":
  text: "Wtedy otoczy Cię zgromadzenie narodów, a Ty powróć na wysokość ze względu na nich."
  tags: []
"Ps7,8":
  text: "JHWH będzie sądził narody. Osądź mnie, JHWH, według mojej sprawiedliwości i według mojej niewinności, która jest we mnie."
  tags: []
"Ps7,9":
  text: "Niech zakończy się zło niegodziwych, a umocnij sprawiedliwego; Ty, który badasz serca i nerki, Boże sprawiedliwy."
  tags: []
"Ps7,10":
  text: "Moja obrona jest od Boga, który wybawia ludzi prawego serca."
  tags: []
"Ps7,11":
  text: "Bóg jest sędzią sprawiedliwym i Bóg gniewa się każdego dnia."
  tags: []
"Ps7,12":
  text: "Jeśli człowiek się nie nawróci, On swój miecz naostrzy; swój łuk naciągnął i przygotował go."
  tags: []
"Ps7,13":
  text: "Przygotował na niego narzędzia śmierci, a swoje strzały sporządził na prześladowców."
  tags: []
"Ps7,14":
  text: "Oto bezbożny wyda na świat nieprawość i będzie w ciąży z krzywdą i urodzi oszustwo."
  tags: []
"Ps7,15":
  text: "Wykopał dół i pogłębił go, lecz sam wpadnie do jamy, którą uczynił."
  tags: []
"Ps7,16":
  text: "Krzywda, którą wyrządzał, wróci na jego głowę, a jego nieprawość spadnie na jego skroń."
  tags: []
"Ps7,17":
  text: "Będę wysławiał JHWH według Jego sprawiedliwości, będę śpiewał imieniu JHWH Najwyższego."
  tags: []
