"Ps7,1": "JHWH, mój Boże, Tobie ufam, wybaw mnie od wszystkich moich prześladowców i wyzwól mnie;"
"Ps7,2": "By nikt jak lew nie porwał mojej duszy i nie rozszarpał, gdy nie będzie nikogo, kto by ją ocalił."
"Ps7,3": "JHWH, mój Boże, jeśli to zrobiłem, jeśli nieprawość jest na moich dłoniach;"
"Ps7,4": "Jeśli złem odpłaciłem temu, kto żył ze mną w pokoju, jeśli nie wyratowałem tego, który mnie dręczył bez powodu;"
"Ps7,5": "To niech nieprzyjaciel prześladuje moją duszę i niech pochwyci i wdepcze w ziemię moje życie, niech moją chwałę w proch obróci. Sela."
"Ps7,6": "Powstań, JHWH, w swoim gniewie; podnieś się przeciwko wściekłości moich wrogów. Przebudź się w mojej obronie, bo Ty zarządziłeś sąd."
"Ps7,7": "Wtedy otoczy Cię zgromadzenie narodów, a Ty powróć na wysokość ze względu na nich."
"Ps7,8": "JHWH będzie sądził narody. Osądź mnie, JHWH, według mojej sprawiedliwości i według mojej niewinności, która jest we mnie."
"Ps7,9": "Niech zakończy się zło niegodziwych, a umocnij sprawiedliwego; Ty, który badasz serca i nerki, Boże sprawiedliwy."
"Ps7,10": "Moja obrona jest od Boga, który wybawia ludzi prawego serca."
"Ps7,11": "Bóg jest sędzią sprawiedliwym i Bóg gniewa się każdego dnia."
"Ps7,12": "Jeśli człowiek się nie nawróci, On swój miecz naostrzy; swój łuk naciągnął i przygotował go."
"Ps7,13": "Przygotował na niego narzędzia śmierci, a swoje strzały sporządził na prześladowców."
"Ps7,14": "Oto bezbożny wyda na świat nieprawość i będzie w ciąży z krzywdą i urodzi oszustwo."
"Ps7,15": "Wykopał dół i pogłębił go, lecz sam wpadnie do jamy, którą uczynił."
"Ps7,16": "Krzywda, którą wyrządzał, wróci na jego głowę, a jego nieprawość spadnie na jego skroń."
"Ps7,17": "Będę wysławiał JHWH według Jego sprawiedliwości, będę śpiewał imieniu JHWH Najwyższego."
