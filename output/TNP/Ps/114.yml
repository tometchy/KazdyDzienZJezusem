"Ps114,1":
  text: "Gdy Izrael wychodził z Egiptu, dom Jakuba spośród ludu obcej mowy,"
  tags: []
"Ps114,2":
  text: "Juda stał się jego świątynią, Izrael sferą Jego panowania."
  tags: []
"Ps114,3":
  text: "Morze to ujrzało i uciekło, Jordan popłynął wstecz."
  tags: []
"Ps114,4":
  text: "Góry skakały jak barany, pagórki jak jagnięta."
  tags: []
"Ps114,5":
  text: "Morze, co ci się stało, że uciekasz, Jordanie, że płyniesz wstecz?"
  tags: []
"Ps114,6":
  text: "Góry, że skaczecie jak barany, a wy, pagórki, jak jagnięta?"
  tags: []
"Ps114,7":
  text: "Zadrżyj, ziemio, przed obliczem PANA, przed obliczem Boga Jakuba;"
  tags: []
"Ps114,8":
  text: "Który zamienia skałę w zasoby wód, a krzemień w źródło wód."
  tags: []
