"Ps114,1": "Gdy Izrael wychodził z Egiptu, dom Jakuba spośród ludu obcej mowy,"
"Ps114,2": "Juda stał się jego świątynią, Izrael sferą Jego panowania."
"Ps114,3": "Morze to ujrzało i uciekło, Jordan popłynął wstecz."
"Ps114,4": "Góry skakały jak barany, pagórki jak jagnięta."
"Ps114,5": "Morze, co ci się stało, że uciekasz, Jordanie, że płyniesz wstecz?"
"Ps114,6": "Góry, że skaczecie jak barany, a wy, pagórki, jak jagnięta?"
"Ps114,7": "Zadrżyj, ziemio, przed obliczem PANA, przed obliczem Boga Jakuba;"
"Ps114,8": "Który zamienia skałę w zasoby wód, a krzemień w źródło wód."
