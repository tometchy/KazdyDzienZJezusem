"Ps130,1": "Pieśń stopni. Z głębokości wołam do Ciebie, JHWH!"
"Ps130,2": "PANIE, wysłuchaj mojego głosu. Niech Twoje ucho będzie wrażliwe na głos mojego błagania."
"Ps130,3": "JH[WH], jeśli zachowasz pamięć o nieprawości, PANIE, kto się ostoi?"
"Ps130,4": "Lecz u Ciebie jest przebaczenie, aby się Ciebie bano."
"Ps130,5": "Oczekuję JHWH, moja dusza oczekuje; a w Jego Słowie pokładam nadzieję."
"Ps130,6": "Moja dusza oczekuje na mojego PANA bardziej niż strażnicy świtu, strażnicy świtu."
"Ps130,7": "Wyczekuj Izraelu na JHWH; u JHWH bowiem jest miłosierdzie i u Niego obfite odkupienie."
"Ps130,8": "On sam odkupi Izraela ze wszystkich jego nieprawości."
