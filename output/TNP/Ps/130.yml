"Ps130,1":
  text: "Pieśń stopni. Z głębokości wołam do Ciebie, JHWH!"
  tags: []
"Ps130,2":
  text: "PANIE, wysłuchaj mojego głosu. Niech Twoje ucho będzie wrażliwe na głos mojego błagania."
  tags: []
"Ps130,3":
  text: "JH[WH], jeśli zachowasz pamięć o nieprawości, PANIE, kto się ostoi?"
  tags: []
"Ps130,4":
  text: "Lecz u Ciebie jest przebaczenie, aby się Ciebie bano."
  tags: []
"Ps130,5":
  text: "Oczekuję JHWH, moja dusza oczekuje; a w Jego Słowie pokładam nadzieję."
  tags: []
"Ps130,6":
  text: "Moja dusza oczekuje na mojego PANA bardziej niż strażnicy świtu, strażnicy świtu."
  tags: []
"Ps130,7":
  text: "Wyczekuj Izraelu na JHWH; u JHWH bowiem jest miłosierdzie i u Niego obfite odkupienie."
  tags: []
"Ps130,8":
  text: "On sam odkupi Izraela ze wszystkich jego nieprawości."
  tags: []
