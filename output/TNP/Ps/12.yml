"Ps12,1":
  text: "Ratuj, JHWH, bo już nie ma pobożnego, zniknęli wierni spośród synów ludzkich."
  tags: []
"Ps12,2":
  text: "Wszyscy ludzie mówią kłamstwo do bliźniego, mówią schlebiającymi wargami i z rozdwojonym sercem."
  tags: []
"Ps12,3":
  text: "Niech JHWH wytnie wszystkie wargi schlebiające i język mówiący wyniośle."
  tags: []
"Ps12,4":
  text: "Którzy powiedzieli: Naszym językiem zwyciężymy, nasze wargi są naszą własnością, kto jest naszym panem?"
  tags: []
"Ps12,5":
  text: "Ze względu na ucisk ubogich i jęk nędzarzy teraz powstanę – mówi JHWH – postawię w bezpiecznym miejscu tego, który wzdycha za nim."
  tags: []
"Ps12,6":
  text: "Słowa JHWH to słowa czyste jak srebro wypróbowane w ziemnym tyglu, siedmiokrotnie oczyszczone."
  tags: []
"Ps12,7":
  text: "Ty, JHWH, będziesz ich strzegł; zachowasz od tego złego pokolenia aż na wieki."
  tags: []
"Ps12,8":
  text: "Niegodziwi krążą wokoło, gdy podłość synów ludzkich zostaje wywyższona."
  tags: []
