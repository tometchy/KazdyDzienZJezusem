"Ps12,1": "Ratuj, JHWH, bo już nie ma pobożnego, zniknęli wierni spośród synów ludzkich."
"Ps12,2": "Wszyscy ludzie mówią kłamstwo do bliźniego, mówią schlebiającymi wargami i z rozdwojonym sercem."
"Ps12,3": "Niech JHWH wytnie wszystkie wargi schlebiające i język mówiący wyniośle."
"Ps12,4": "Którzy powiedzieli: Naszym językiem zwyciężymy, nasze wargi są naszą własnością, kto jest naszym panem?"
"Ps12,5": "Ze względu na ucisk ubogich i jęk nędzarzy teraz powstanę – mówi JHWH – postawię w bezpiecznym miejscu tego, który wzdycha za nim."
"Ps12,6": "Słowa JHWH to słowa czyste jak srebro wypróbowane w ziemnym tyglu, siedmiokrotnie oczyszczone."
"Ps12,7": "Ty, JHWH, będziesz ich strzegł; zachowasz od tego złego pokolenia aż na wieki."
"Ps12,8": "Niegodziwi krążą wokoło, gdy podłość synów ludzkich zostaje wywyższona."
