"Ps29,1": "Psalm Dawida. Oddajcie JHWH, synowie Boży, oddajcie JHWH chwałę i moc!"
"Ps29,2": "Oddajcie JHWH chwałę należną Jego imieniu, oddajcie JHWH pokłon w ozdobie świętości."
"Ps29,3": "Głos JHWH nad wodami; zagrzmiał Bóg chwały, JHWH nad wielkimi wodami."
"Ps29,4": "Głos JHWH potężny, głos JHWH pełen majestatu."
"Ps29,5": "Głos JHWH łamie cedry, JHWH roztrzaskał cedry Libanu;"
"Ps29,6": "I sprawia, że skaczą jak cielę, Liban i Sirion jak młody bawół."
"Ps29,7": "Głos JHWH rozłupuje strzałami ognia."
"Ps29,8": "Głos JHWH wstrząsa pustynią, JHWH wstrząsa pustynią Kadesz."
"Ps29,9": "Głos JHWH sprawia, że z bólem rodzą łanie i obnażają się lasy, a w Jego świątyni wszystko woła: Chwała!"
"Ps29,10": "JHWH zasiadł nad potopem, JHWH zasiadł jako Król na wieki."
"Ps29,11": "JHWH da siłę swojemu ludowi, JHWH pobłogosławi swój lud pokojem."
