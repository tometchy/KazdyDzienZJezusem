"Ps87,1":
  text: "Jego fundament jest na świętych górach."
  tags: []
"Ps87,2":
  text: "JHWH miłuje bramy Syjonu bardziej niż wszystkie przybytki Jakuba."
  tags: []
"Ps87,3":
  text: "Wspaniałe rzeczy mówione są o tobie – miasto Boże. Sela."
  tags: []
"Ps87,4":
  text: "Odnotuję Rahab i Babilon jako tych, którzy Mnie znają; oto Filistea i Tyr, i Kusz: Ten został tam zrodzony."
  tags: []
"Ps87,5":
  text: "O Syjonie też będą mówić: Ten i tamten został zrodzony na nim; a On sam – Najwyższy go utwierdzi!"
  tags: []
"Ps87,6":
  text: "JHWH policzy, spisując narody: Ten tam został zrodzony. Sela."
  tags: []
"Ps87,7":
  text: "I śpiewający podczas tańca zanucą: W Tobie są wszystkie moje źródła."
  tags: []
