"Ps87,1": "Jego fundament jest na świętych górach."
"Ps87,2": "JHWH miłuje bramy Syjonu bardziej niż wszystkie przybytki Jakuba."
"Ps87,3": "Wspaniałe rzeczy mówione są o tobie – miasto Boże. Sela."
"Ps87,4": "Odnotuję Rahab i Babilon jako tych, którzy Mnie znają; oto Filistea i Tyr, i Kusz: Ten został tam zrodzony."
"Ps87,5": "O Syjonie też będą mówić: Ten i tamten został zrodzony na nim; a On sam – Najwyższy go utwierdzi!"
"Ps87,6": "JHWH policzy, spisując narody: Ten tam został zrodzony. Sela."
"Ps87,7": "I śpiewający podczas tańca zanucą: W Tobie są wszystkie moje źródła."
