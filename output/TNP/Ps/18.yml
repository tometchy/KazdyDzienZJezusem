"Ps18,1": "Dla przewodnika chóru. Psalm sługi JHWH, Dawida, który wypowiedział do JHWH słowa tej pieśni, w dniu gdy go JHWH ocalił z rąk wszystkich jego wrogów i z ręki Saula. Powiedział wtedy: Będę Cię miłował, JHWH, mocy moja."
"Ps18,2": "JHWH moją skałą, moją twierdzą i wybawicielem. Mój Bóg moją opoką, której będę ufał, moją tarczą i rogiem mojego zbawienia, moją warownią."
"Ps18,3": "Zawołam do JHWH, który jest godny chwały, a będę wybawiony od moich wrogów."
"Ps18,4": "Ogarnęły mnie powrozy śmierci i zatrwożyły mnie potoki bezbożnych."
"Ps18,5": "Powrozy Szeolu mnie oplotły, pochwyciły mnie sidła śmierci."
"Ps18,6": "W moim utrapieniu wzywałem JHWH i wołałem do mojego Boga. Ze swojej świątyni usłyszał mój głos, a moje wołanie dotarło przed Jego oblicze, do Jego uszu."
"Ps18,7": "Wtedy ziemia poruszyła się i zadrżała, a posady gór zatrzęsły się i zachwiały, bo On się rozgniewał."
"Ps18,8": "Z Jego nozdrzy unosił się dym, z Jego ust buchnął ogień trawiący, węgle zapaliły się od niego."
"Ps18,9": "Nachylił niebiosa i zstąpił, a chmura burzowa była pod Jego stopami."
"Ps18,10": "Dosiadł cheruba i latał; pomknął na skrzydłach wiatru."
"Ps18,11": "Z ciemności zrobił sobie ukrycie, namiotem wokół Niego były ciemne wody i gęste obłoki niebios."
"Ps18,12": "Przed Jego blaskiem rozeszły się Jego obłoki, grad i węgle ogniste."
"Ps18,13": "I zagrzmiał JHWH na niebiosach, Najwyższy wydał swój głos, grad i węgle ogniste."
"Ps18,14": "Wypuścił swoje strzały i rozproszył ich, cisnął błyskawice i ich rozgromił."
"Ps18,15": "I ukazały się łożyska wód, i odsłoniły się fundamenty świata od Twojego napomnienia, JHWH, i od podmuchu tchnienia Twoich nozdrzy."
"Ps18,16": "Posłał z wysoka, chwycił mnie, wyciągnął mnie z wielkich wód."
"Ps18,17": "Ocalił mnie przed mym potężnym wrogiem i od tych, którzy mnie nienawidzą, ponieważ byli silniejsi ode mnie."
"Ps18,18": "Wystąpili przeciwko mnie w dniu mojego utrapienia, lecz JHWH był moją podporą."
"Ps18,19": "Wyprowadził mnie na miejsce przestronne, wybawił mnie, bo mnie sobie upodobał."
"Ps18,20": "JHWH nagrodził mnie według mojej sprawiedliwości, oddał mi według czystości moich rąk."
"Ps18,21": "Strzegłem bowiem dróg JHWH i nie odstąpiłem niegodziwie od mojego Boga."
"Ps18,22": "Bo miałem przed oczami wszystkie Jego nakazy i nie odrzucałem od siebie Jego ustaw."
"Ps18,23": "Byłem przed Nim nienaganny i ustrzegłem się przed występkiem."
"Ps18,24": "Dlatego JHWH oddał mi zgodnie z moją sprawiedliwością, zgodnie z czystością moich rąk przed Jego oczami."
"Ps18,25": "Z wiernym będziesz postępował wiernie, a z człowiekiem nienagannym będziesz postępował nienagannie."
"Ps18,26": "Z czystym okażesz się czysty, a względem przewrotnego postąpisz sprytnie."
"Ps18,27": "Gdyż Ty wybawisz lud strapiony, a wyniosłe oczy poniżysz."
"Ps18,28": "Bo Ty zapalisz moją pochodnię; JHWH, Bóg mój, rozjaśni moje ciemności."
"Ps18,29": "Bo z Tobą zaatakuję drużynę, z moim Bogiem przeskoczę mur."
"Ps18,30": "Droga Boża jest doskonała, Słowo JHWH w ogniu wypróbowane. On jest tarczą dla wszystkich, którzy Mu ufają."
"Ps18,31": "Bo któż jest Bogiem oprócz JHWH? Któż skałą oprócz Boga naszego?"
"Ps18,32": "To Bóg, który przepasuje mnie mocą i czyni moją drogę doskonałą."
"Ps18,33": "Moje nogi czyni zwinne jak u łani i stawia mnie na moich wyżynach."
"Ps18,34": "Ćwiczy moje ręce do walki, tak że mogę nagiąć spiżowy łuk swoimi ramionami."
"Ps18,35": "Dałeś mi tarczę swojego zbawienia i Twoja prawa ręka mnie wsparła, a Twoje uniżenie uczyniło mnie wielkim."
"Ps18,36": "Rozszerzyłeś miejsce pode mną dla moich kroków, tak że moje stopy się nie zachwiały."
"Ps18,37": "Będę ścigał moich wrogów i dogonię ich, nie zawrócę, aż ich nie zniszczę."
"Ps18,38": "Uderzę ich tak, że nie będą mogli powstać, upadną pod moje stopy."
"Ps18,39": "Przepasałeś mnie mocą do walki, powaliłeś pod moje stopy moich przeciwników."
"Ps18,40": "Zmuszałeś mych wrogów do ucieczki, abym zniszczył tych, którzy mnie nienawidzą."
"Ps18,41": "Wołali o pomoc, lecz nie ma wybawcy; wołali do JHWH, lecz im nie odpowiedział."
"Ps18,42": "Rozproszę ich jak proch na wietrze i usunę ich jak błoto na ulicy."
"Ps18,43": "Wyzwoliłeś mnie od ludzkich sporów, ustanowiłeś mnie głową narodów. Będzie mi służył lud, którego nie znałem."
"Ps18,44": "Jak tylko usłyszą o mnie, będą mi posłuszni, synowie obcych będą obłudnie ulegli."
"Ps18,45": "Synowie obcych staną się słabi i będą drżeć w swoich warowniach."
"Ps18,46": "JHWH żyje, niech będzie błogosławiona moja Skała, niech będzie wywyższony Bóg mojego zbawienia."
"Ps18,47": "Bóg dokonuje za mnie pomsty i poddaje mi narody."
"Ps18,48": "On wyzwala mnie od moich wrogów; Ty wywyższyłeś mnie ponad tych, którzy powstają przeciwko mnie, ocaliłeś mnie od człowieka gwałtownego."
"Ps18,49": "Dlatego będę Cię, JHWH, sławił wśród narodów i będę śpiewał Twojemu imieniu."
"Ps18,50": "Bo dajesz wielkie wybawienie swojemu królowi i na wieki okazujesz miłosierdzie swojemu pomazańcowi Dawidowi i jego potomstwu."
