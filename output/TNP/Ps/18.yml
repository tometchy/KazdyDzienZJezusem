"Ps18,1":
  text: "Dla przewodnika chóru. Psalm sługi JHWH, Dawida, który wypowiedział do JHWH słowa tej pieśni, w dniu gdy go JHWH ocalił z rąk wszystkich jego wrogów i z ręki Saula. Powiedział wtedy: Będę Cię miłował, JHWH, mocy moja."
  tags: []
"Ps18,2":
  text: "JHWH moją skałą, moją twierdzą i wybawicielem. Mój Bóg moją opoką, której będę ufał, moją tarczą i rogiem mojego zbawienia, moją warownią."
  tags: []
"Ps18,3":
  text: "Zawołam do JHWH, który jest godny chwały, a będę wybawiony od moich wrogów."
  tags: []
"Ps18,4":
  text: "Ogarnęły mnie powrozy śmierci i zatrwożyły mnie potoki bezbożnych."
  tags: []
"Ps18,5":
  text: "Powrozy Szeolu mnie oplotły, pochwyciły mnie sidła śmierci."
  tags: []
"Ps18,6":
  text: "W moim utrapieniu wzywałem JHWH i wołałem do mojego Boga. Ze swojej świątyni usłyszał mój głos, a moje wołanie dotarło przed Jego oblicze, do Jego uszu."
  tags: []
"Ps18,7":
  text: "Wtedy ziemia poruszyła się i zadrżała, a posady gór zatrzęsły się i zachwiały, bo On się rozgniewał."
  tags: []
"Ps18,8":
  text: "Z Jego nozdrzy unosił się dym, z Jego ust buchnął ogień trawiący, węgle zapaliły się od niego."
  tags: []
"Ps18,9":
  text: "Nachylił niebiosa i zstąpił, a chmura burzowa była pod Jego stopami."
  tags: []
"Ps18,10":
  text: "Dosiadł cheruba i latał; pomknął na skrzydłach wiatru."
  tags: []
"Ps18,11":
  text: "Z ciemności zrobił sobie ukrycie, namiotem wokół Niego były ciemne wody i gęste obłoki niebios."
  tags: []
"Ps18,12":
  text: "Przed Jego blaskiem rozeszły się Jego obłoki, grad i węgle ogniste."
  tags: []
"Ps18,13":
  text: "I zagrzmiał JHWH na niebiosach, Najwyższy wydał swój głos, grad i węgle ogniste."
  tags: []
"Ps18,14":
  text: "Wypuścił swoje strzały i rozproszył ich, cisnął błyskawice i ich rozgromił."
  tags: []
"Ps18,15":
  text: "I ukazały się łożyska wód, i odsłoniły się fundamenty świata od Twojego napomnienia, JHWH, i od podmuchu tchnienia Twoich nozdrzy."
  tags: []
"Ps18,16":
  text: "Posłał z wysoka, chwycił mnie, wyciągnął mnie z wielkich wód."
  tags: []
"Ps18,17":
  text: "Ocalił mnie przed mym potężnym wrogiem i od tych, którzy mnie nienawidzą, ponieważ byli silniejsi ode mnie."
  tags: []
"Ps18,18":
  text: "Wystąpili przeciwko mnie w dniu mojego utrapienia, lecz JHWH był moją podporą."
  tags: []
"Ps18,19":
  text: "Wyprowadził mnie na miejsce przestronne, wybawił mnie, bo mnie sobie upodobał."
  tags: []
"Ps18,20":
  text: "JHWH nagrodził mnie według mojej sprawiedliwości, oddał mi według czystości moich rąk."
  tags: []
"Ps18,21":
  text: "Strzegłem bowiem dróg JHWH i nie odstąpiłem niegodziwie od mojego Boga."
  tags: []
"Ps18,22":
  text: "Bo miałem przed oczami wszystkie Jego nakazy i nie odrzucałem od siebie Jego ustaw."
  tags: []
"Ps18,23":
  text: "Byłem przed Nim nienaganny i ustrzegłem się przed występkiem."
  tags: []
"Ps18,24":
  text: "Dlatego JHWH oddał mi zgodnie z moją sprawiedliwością, zgodnie z czystością moich rąk przed Jego oczami."
  tags: []
"Ps18,25":
  text: "Z wiernym będziesz postępował wiernie, a z człowiekiem nienagannym będziesz postępował nienagannie."
  tags: []
"Ps18,26":
  text: "Z czystym okażesz się czysty, a względem przewrotnego postąpisz sprytnie."
  tags: []
"Ps18,27":
  text: "Gdyż Ty wybawisz lud strapiony, a wyniosłe oczy poniżysz."
  tags: []
"Ps18,28":
  text: "Bo Ty zapalisz moją pochodnię; JHWH, Bóg mój, rozjaśni moje ciemności."
  tags: []
"Ps18,29":
  text: "Bo z Tobą zaatakuję drużynę, z moim Bogiem przeskoczę mur."
  tags: []
"Ps18,30":
  text: "Droga Boża jest doskonała, Słowo JHWH w ogniu wypróbowane. On jest tarczą dla wszystkich, którzy Mu ufają."
  tags: []
"Ps18,31":
  text: "Bo któż jest Bogiem oprócz JHWH? Któż skałą oprócz Boga naszego?"
  tags: []
"Ps18,32":
  text: "To Bóg, który przepasuje mnie mocą i czyni moją drogę doskonałą."
  tags: []
"Ps18,33":
  text: "Moje nogi czyni zwinne jak u łani i stawia mnie na moich wyżynach."
  tags: []
"Ps18,34":
  text: "Ćwiczy moje ręce do walki, tak że mogę nagiąć spiżowy łuk swoimi ramionami."
  tags: []
"Ps18,35":
  text: "Dałeś mi tarczę swojego zbawienia i Twoja prawa ręka mnie wsparła, a Twoje uniżenie uczyniło mnie wielkim."
  tags: []
"Ps18,36":
  text: "Rozszerzyłeś miejsce pode mną dla moich kroków, tak że moje stopy się nie zachwiały."
  tags: []
"Ps18,37":
  text: "Będę ścigał moich wrogów i dogonię ich, nie zawrócę, aż ich nie zniszczę."
  tags: []
"Ps18,38":
  text: "Uderzę ich tak, że nie będą mogli powstać, upadną pod moje stopy."
  tags: []
"Ps18,39":
  text: "Przepasałeś mnie mocą do walki, powaliłeś pod moje stopy moich przeciwników."
  tags: []
"Ps18,40":
  text: "Zmuszałeś mych wrogów do ucieczki, abym zniszczył tych, którzy mnie nienawidzą."
  tags: []
"Ps18,41":
  text: "Wołali o pomoc, lecz nie ma wybawcy; wołali do JHWH, lecz im nie odpowiedział."
  tags: []
"Ps18,42":
  text: "Rozproszę ich jak proch na wietrze i usunę ich jak błoto na ulicy."
  tags: []
"Ps18,43":
  text: "Wyzwoliłeś mnie od ludzkich sporów, ustanowiłeś mnie głową narodów. Będzie mi służył lud, którego nie znałem."
  tags: []
"Ps18,44":
  text: "Jak tylko usłyszą o mnie, będą mi posłuszni, synowie obcych będą obłudnie ulegli."
  tags: []
"Ps18,45":
  text: "Synowie obcych staną się słabi i będą drżeć w swoich warowniach."
  tags: []
"Ps18,46":
  text: "JHWH żyje, niech będzie błogosławiona moja Skała, niech będzie wywyższony Bóg mojego zbawienia."
  tags: []
"Ps18,47":
  text: "Bóg dokonuje za mnie pomsty i poddaje mi narody."
  tags: []
"Ps18,48":
  text: "On wyzwala mnie od moich wrogów; Ty wywyższyłeś mnie ponad tych, którzy powstają przeciwko mnie, ocaliłeś mnie od człowieka gwałtownego."
  tags: []
"Ps18,49":
  text: "Dlatego będę Cię, JHWH, sławił wśród narodów i będę śpiewał Twojemu imieniu."
  tags: []
"Ps18,50":
  text: "Bo dajesz wielkie wybawienie swojemu królowi i na wieki okazujesz miłosierdzie swojemu pomazańcowi Dawidowi i jego potomstwu."
  tags: []
