"Ps51,1":
  text: "Dla przewodnika chóru. Psalm Dawida, gdy przyszedł do niego prorok Natan po popełnionym cudzołóstwie z Batszebą."
  tags: []
"Ps51,2":
  text: "Zmiłuj się nade mną, Boże, według Twojego miłosierdzia; według Twojej wielkiej litości wymaż moje występki."
  tags: []
"Ps51,3":
  text: "Obmyj mnie zupełnie z mojej nieprawości i oczyść mnie z mojego grzechu."
  tags: []
"Ps51,4":
  text: "Gdyż ja znam moje występki, a mój grzech zawsze jest przede mną."
  tags: []
"Ps51,5":
  text: "Przeciwko Tobie, Tobie samemu, zgrzeszyłem i zło uczyniłem na Twoich oczach, dlatego że Ty jesteś prawy w swoim słowie i czysty w swoim sądzie."
  tags: []
"Ps51,6":
  text: "Oto zostałem zrodzony w nieprawości i w grzechu poczęła mnie moja matka."
  tags: []
"Ps51,7":
  text: "Oto rozkoszujesz się prawdą we wnętrzu i oznajmiłeś mi ukrytą mądrość."
  tags: []
"Ps51,8":
  text: "Oczyść mnie z grzechu hizopem, a będę oczyszczony; obmyj mnie, a stanę się bielszy od śniegu."
  tags: []
"Ps51,9":
  text: "Daj mi usłyszeć radość i wesele; niech się rozradują kości, które skruszyłeś."
  tags: []
"Ps51,10":
  text: "Zakryj swoje oblicze przed moimi grzechami i zmaż wszystkie moje nieprawości."
  tags: []
"Ps51,11":
  text: "Stwórz we mnie serce czyste, o Boże, i odnów we mnie ducha niezłomnego."
  tags: []
"Ps51,12":
  text: "Nie odrzucaj mnie sprzed Twojego oblicza i nie odbieraj mi swojego Ducha Świętego."
  tags: []
"Ps51,13":
  text: "Przywróć mi radość z Twojego zbawienia i wesprzyj mnie duchem ochoczym."
  tags: []
"Ps51,14":
  text: "Wtedy będę nauczał buntowników Twoich dróg i grzesznicy nawrócą się do Ciebie."
  tags: []
"Ps51,15":
  text: "Uwolnij mnie od winy za przelanie krwi, o Boże, Boże mojego zbawienia, a mój język będzie radośnie wysławiał Twoją sprawiedliwość."
  tags: []
"Ps51,16":
  text: "PANIE, otwórz moje wargi, a moje usta będą głosić Twoją chwałę."
  tags: []
"Ps51,17":
  text: "Bo Ty nie rozkoszujesz się ofiarą, a choćbym chciał złożyć ofiarę całopalną nie przyjmiesz jej."
  tags: []
"Ps51,18":
  text: "Ofiarą miłą dla Boga jest duch skruszony; sercem skruszonym i zgnębionym nie wzgardzisz, o Boże!"
  tags: []
"Ps51,19":
  text: "Czyń dobrze Syjonowi według Twojego upodobania; odbuduj mury Jerozolimy."
  tags: []
