"Ps51,1": "Dla przewodnika chóru. Psalm Dawida, gdy przyszedł do niego prorok Natan po popełnionym cudzołóstwie z Batszebą."
"Ps51,2": "Zmiłuj się nade mną, Boże, według Twojego miłosierdzia; według Twojej wielkiej litości wymaż moje występki."
"Ps51,3": "Obmyj mnie zupełnie z mojej nieprawości i oczyść mnie z mojego grzechu."
"Ps51,4": "Gdyż ja znam moje występki, a mój grzech zawsze jest przede mną."
"Ps51,5": "Przeciwko Tobie, Tobie samemu, zgrzeszyłem i zło uczyniłem na Twoich oczach, dlatego że Ty jesteś prawy w swoim słowie i czysty w swoim sądzie."
"Ps51,6": "Oto zostałem zrodzony w nieprawości i w grzechu poczęła mnie moja matka."
"Ps51,7": "Oto rozkoszujesz się prawdą we wnętrzu i oznajmiłeś mi ukrytą mądrość."
"Ps51,8": "Oczyść mnie z grzechu hizopem, a będę oczyszczony; obmyj mnie, a stanę się bielszy od śniegu."
"Ps51,9": "Daj mi usłyszeć radość i wesele; niech się rozradują kości, które skruszyłeś."
"Ps51,10": "Zakryj swoje oblicze przed moimi grzechami i zmaż wszystkie moje nieprawości."
"Ps51,11": "Stwórz we mnie serce czyste, o Boże, i odnów we mnie ducha niezłomnego."
"Ps51,12": "Nie odrzucaj mnie sprzed Twojego oblicza i nie odbieraj mi swojego Ducha Świętego."
"Ps51,13": "Przywróć mi radość z Twojego zbawienia i wesprzyj mnie duchem ochoczym."
"Ps51,14": "Wtedy będę nauczał buntowników Twoich dróg i grzesznicy nawrócą się do Ciebie."
"Ps51,15": "Uwolnij mnie od winy za przelanie krwi, o Boże, Boże mojego zbawienia, a mój język będzie radośnie wysławiał Twoją sprawiedliwość."
"Ps51,16": "PANIE, otwórz moje wargi, a moje usta będą głosić Twoją chwałę."
"Ps51,17": "Bo Ty nie rozkoszujesz się ofiarą, a choćbym chciał złożyć ofiarę całopalną nie przyjmiesz jej."
"Ps51,18": "Ofiarą miłą dla Boga jest duch skruszony; sercem skruszonym i zgnębionym nie wzgardzisz, o Boże!"
"Ps51,19": "Czyń dobrze Syjonowi według Twojego upodobania; odbuduj mury Jerozolimy."
