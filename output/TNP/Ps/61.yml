"Ps61,1":
  text: "Wysłuchaj, Boże, mojego wołania, zwróć uwagę na moją modlitwę."
  tags: []
"Ps61,2":
  text: "Z krańca ziemi wołam do Ciebie w słabości mojego serca; wprowadź mnie na skałę, wyższą ode mnie."
  tags: []
"Ps61,3":
  text: "Ty bowiem jesteś moją ucieczką i wieżą warowną przed obliczem wroga."
  tags: []
"Ps61,4":
  text: "Będę mieszkał w Twoim przybytku na wieki, chroniąc się pod osłoną Twoich skrzydeł. Sela."
  tags: []
"Ps61,5":
  text: "Bo Ty, Boże, wysłuchałeś moich ślubów; dałeś dziedzictwo tym, którzy się boją Twojego imienia."
  tags: []
"Ps61,6":
  text: "Dodaj dni do dni króla, a jego lata niech trwają jak z pokolenia na pokolenie."
  tags: []
"Ps61,7":
  text: "Będzie trwał na wieki przed obliczem Boga; ustanów miłosierdzie i prawdę, niech go strzegą."
  tags: []
"Ps61,8":
  text: "Tak więc będę śpiewał Twojemu imieniu na wieki i będę spełniał moje śluby każdego dnia."
  tags: []
