"Ps61,1": "Wysłuchaj, Boże, mojego wołania, zwróć uwagę na moją modlitwę."
"Ps61,2": "Z krańca ziemi wołam do Ciebie w słabości mojego serca; wprowadź mnie na skałę, wyższą ode mnie."
"Ps61,3": "Ty bowiem jesteś moją ucieczką i wieżą warowną przed obliczem wroga."
"Ps61,4": "Będę mieszkał w Twoim przybytku na wieki, chroniąc się pod osłoną Twoich skrzydeł. Sela."
"Ps61,5": "Bo Ty, Boże, wysłuchałeś moich ślubów; dałeś dziedzictwo tym, którzy się boją Twojego imienia."
"Ps61,6": "Dodaj dni do dni króla, a jego lata niech trwają jak z pokolenia na pokolenie."
"Ps61,7": "Będzie trwał na wieki przed obliczem Boga; ustanów miłosierdzie i prawdę, niech go strzegą."
"Ps61,8": "Tak więc będę śpiewał Twojemu imieniu na wieki i będę spełniał moje śluby każdego dnia."
