"Ps146,1": "Chwalcie JH[WH]. Chwal, duszo moja, JHWH!"
"Ps146,2": "Będę chwalić JHWH, póki żyję; będę śpiewał mojemu Bogu, póki jestem."
"Ps146,3": "Nie pokładajcie ufności we władcach ani w synu człowieka, w którym nie ma wybawienia."
"Ps146,4": "Opuszcza go duch i wraca do swojej ziemi; w tym dniu zginą wszystkie jego myśli."
"Ps146,5": "Błogosławiony ten, którego pomocą jest Bóg Jakuba, którego nadzieja jest w JHWH, jego Bogu;"
"Ps146,6": "Który dogląda niebiosa i ziemię, morze i wszystko, co w nich jest; który dochowuje wierności na wieki;"
"Ps146,7": "Który wymierza sprawiedliwość skrzywdzonym i daje chleb głodnym; JHWH uwalnia więźniów."
"Ps146,8": "JHWH otwiera oczy ślepych; JHWH podnosi przygnębionych; JHWH miłuje sprawiedliwych."
"Ps146,9": "JHWH strzeże przychodniów, wspomaga sierotę i wdowę, ale utrudnia drogę niegodziwych."
"Ps146,10": "JHWH króluje na wieki, Twój Bóg, o Syjonie, z pokolenia na pokolenie. Chwalcie JH[WH]."
