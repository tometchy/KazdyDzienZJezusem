"Ps146,1":
  text: "Chwalcie JH[WH]. Chwal, duszo moja, JHWH!"
  tags: []
"Ps146,2":
  text: "Będę chwalić JHWH, póki żyję; będę śpiewał mojemu Bogu, póki jestem."
  tags: []
"Ps146,3":
  text: "Nie pokładajcie ufności we władcach ani w synu człowieka, w którym nie ma wybawienia."
  tags: []
"Ps146,4":
  text: "Opuszcza go duch i wraca do swojej ziemi; w tym dniu zginą wszystkie jego myśli."
  tags: []
"Ps146,5":
  text: "Błogosławiony ten, którego pomocą jest Bóg Jakuba, którego nadzieja jest w JHWH, jego Bogu;"
  tags: []
"Ps146,6":
  text: "Który dogląda niebiosa i ziemię, morze i wszystko, co w nich jest; który dochowuje wierności na wieki;"
  tags: []
"Ps146,7":
  text: "Który wymierza sprawiedliwość skrzywdzonym i daje chleb głodnym; JHWH uwalnia więźniów."
  tags: []
"Ps146,8":
  text: "JHWH otwiera oczy ślepych; JHWH podnosi przygnębionych; JHWH miłuje sprawiedliwych."
  tags: []
"Ps146,9":
  text: "JHWH strzeże przychodniów, wspomaga sierotę i wdowę, ale utrudnia drogę niegodziwych."
  tags: []
"Ps146,10":
  text: "JHWH króluje na wieki, Twój Bóg, o Syjonie, z pokolenia na pokolenie. Chwalcie JH[WH]."
  tags: []
