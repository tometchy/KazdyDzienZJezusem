"Ps67,1":
  text: "Niech Bóg się zmiłuje nad nami i błogosławi nam, niech rozjaśni nad nami swoje oblicze. Sela."
  tags: []
"Ps67,2":
  text: "Aby poznano na ziemi Twoją drogę, wśród wszystkich narodów Twoje zbawienie."
  tags: []
"Ps67,3":
  text: "Niech Cię wysławiają ludy, o Boże, niech Cię wysławiają wszystkie ludy."
  tags: []
"Ps67,4":
  text: "Niech narody się radują i wykrzykują z radości, bo Ty będziesz sądził ludy sprawiedliwie i będziesz prowadził narody na ziemi. Sela."
  tags: []
"Ps67,5":
  text: "Niech Cię wysławiają ludy, o Boże, niech Cię wysławiają wszystkie ludy."
  tags: []
"Ps67,6":
  text: "Ziemia wydała swój plon. Bóg, nasz Bóg, będzie nam błogosławił."
  tags: []
"Ps67,7":
  text: "Niech nam Bóg błogosławi i niech się Go boją wszystkie krańce ziemi."
  tags: []
