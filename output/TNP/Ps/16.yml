"Ps16,1":
  text: "Miktam Dawida. Strzeż mnie, Boże, bo Tobie ufam!"
  tags: []
"Ps16,2":
  text: "Powiem do JHWH: Mój PANIE, Ty jesteś moim dobrem, nie ma nikogo ponad Ciebie;"
  tags: []
"Ps16,3":
  text: "W świętych, którzy są na ziemi, i dostojnych, w nich jest całe moje upodobanie."
  tags: []
"Ps16,4":
  text: "Rozmnożą się cierpienia tych, którzy chodzą za obcymi bogami. Nie wyleję im ofiar z krwi i nie wymówię ich imion swoimi ustami."
  tags: []
"Ps16,5":
  text: "JHWH jest działem mojego dziedzictwa i kielicha; Ty mocno trzymasz mój los."
  tags: []
"Ps16,6":
  text: "Sznury miernicze wyznaczyły mi bardzo przyjemne miejsca i miłe jest moje dziedzictwo."
  tags: []
"Ps16,7":
  text: "Będę błogosławił JHWH, który udzielił mi rady, bo nawet w nocy pouczają mnie moje nerki."
  tags: []
"Ps16,8":
  text: "Stawiam JHWH zawsze przed oczami; skoro On jest po mojej prawicy, nie zachwieję się."
  tags: []
"Ps16,9":
  text: "Dlatego cieszy się moje serce i wykrzykuje z radości moje wnętrze, a moje ciało odpocznie bezpiecznie."
  tags: []
"Ps16,10":
  text: "Nie pozostawisz bowiem mojej duszy w Szeolu ani nie dopuścisz swojemu świętemu, aby zobaczył zniszczenie."
  tags: []
"Ps16,11":
  text: "Dasz mi poznać drogę życia, pełnię radości przed Twoim obliczem, rozkosze po Twojej prawicy na zawsze."
  tags: []
