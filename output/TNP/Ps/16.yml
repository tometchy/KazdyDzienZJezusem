"Ps16,1": "Miktam Dawida. Strzeż mnie, Boże, bo Tobie ufam!"
"Ps16,2": "Powiem do JHWH: Mój PANIE, Ty jesteś moim dobrem, nie ma nikogo ponad Ciebie;"
"Ps16,3": "W świętych, którzy są na ziemi, i dostojnych, w nich jest całe moje upodobanie."
"Ps16,4": "Rozmnożą się cierpienia tych, którzy chodzą za obcymi bogami. Nie wyleję im ofiar z krwi i nie wymówię ich imion swoimi ustami."
"Ps16,5": "JHWH jest działem mojego dziedzictwa i kielicha; Ty mocno trzymasz mój los."
"Ps16,6": "Sznury miernicze wyznaczyły mi bardzo przyjemne miejsca i miłe jest moje dziedzictwo."
"Ps16,7": "Będę błogosławił JHWH, który udzielił mi rady, bo nawet w nocy pouczają mnie moje nerki."
"Ps16,8": "Stawiam JHWH zawsze przed oczami; skoro On jest po mojej prawicy, nie zachwieję się."
"Ps16,9": "Dlatego cieszy się moje serce i wykrzykuje z radości moje wnętrze, a moje ciało odpocznie bezpiecznie."
"Ps16,10": "Nie pozostawisz bowiem mojej duszy w Szeolu ani nie dopuścisz swojemu świętemu, aby zobaczył zniszczenie."
"Ps16,11": "Dasz mi poznać drogę życia, pełnię radości przed Twoim obliczem, rozkosze po Twojej prawicy na zawsze."
