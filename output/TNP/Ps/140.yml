"Ps140,1":
  text: "Przewodnikowi chóru. Psalm Dawida. Wyrwij mnie, JHWH, od złego człowieka; zachowaj mnie od męża okrutnego;"
  tags: []
"Ps140,2":
  text: "Od tych, którzy planują w sercu złe rzeczy, każdego dnia wszczynają wojny."
  tags: []
"Ps140,3":
  text: "Ostrzą swoje języki jak węże, jad żmii pod ich wargami. Sela."
  tags: []
"Ps140,4":
  text: "Strzeż mnie, JHWH, od rąk niegodziwego, zachowaj mnie od męża okrutnego; od tych, którzy zaplanowali zachwiać moimi krokami."
  tags: []
"Ps140,5":
  text: "Pyszni zastawili na mnie sidła i sznury; rozciągnęli sieci na skraju ścieżki; rozmieścili na mnie pułapki. Sela."
  tags: []
"Ps140,6":
  text: "Powiedziałem JHWH: Ty jesteś moim Bogiem; wysłuchaj, JHWH, głosu mojego błagania."
  tags: []
"Ps140,7":
  text: "JHWH, PANIE, siło mojego zbawienia, który osłoniłeś moją głowę w dniu zbrojnej walki;"
  tags: []
"Ps140,8":
  text: "Nie spełniaj, JHWH, pragnień niegodziwego; nie wspieraj jego złych zamysłów, aby tacy nie byli wywyższeni. Sela."
  tags: []
"Ps140,9":
  text: "A głowa otaczających mnie? – niech troska okryje ich wargi!"
  tags: []
"Ps140,10":
  text: "Niech strząsną na nich rozżarzone węgle; niech ich strącą do głębokich dołów, by już nie powstali."
  tags: []
"Ps140,11":
  text: "Niech oszczerca nie będzie utwierdzony na ziemi, niech zło poluje na człowieka okrutnego, aby go powalić."
  tags: []
"Ps140,12":
  text: "Wiem, że JHWH dokona sądu dla udręczonego i ubogiemu odda sprawiedliwość."
  tags: []
"Ps140,13":
  text: "O tak, sprawiedliwi będą wysławiać Twoje imię, a prawi będą mieszkać przed Twoim obliczem."
  tags: []
