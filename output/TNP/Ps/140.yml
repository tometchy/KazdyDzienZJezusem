"Ps140,1": "Przewodnikowi chóru. Psalm Dawida. Wyrwij mnie, JHWH, od złego człowieka; zachowaj mnie od męża okrutnego;"
"Ps140,2": "Od tych, którzy planują w sercu złe rzeczy, każdego dnia wszczynają wojny."
"Ps140,3": "Ostrzą swoje języki jak węże, jad żmii pod ich wargami. Sela."
"Ps140,4": "Strzeż mnie, JHWH, od rąk niegodziwego, zachowaj mnie od męża okrutnego; od tych, którzy zaplanowali zachwiać moimi krokami."
"Ps140,5": "Pyszni zastawili na mnie sidła i sznury; rozciągnęli sieci na skraju ścieżki; rozmieścili na mnie pułapki. Sela."
"Ps140,6": "Powiedziałem JHWH: Ty jesteś moim Bogiem; wysłuchaj, JHWH, głosu mojego błagania."
"Ps140,7": "JHWH, PANIE, siło mojego zbawienia, który osłoniłeś moją głowę w dniu zbrojnej walki;"
"Ps140,8": "Nie spełniaj, JHWH, pragnień niegodziwego; nie wspieraj jego złych zamysłów, aby tacy nie byli wywyższeni. Sela."
"Ps140,9": "A głowa otaczających mnie? – niech troska okryje ich wargi!"
"Ps140,10": "Niech strząsną na nich rozżarzone węgle; niech ich strącą do głębokich dołów, by już nie powstali."
"Ps140,11": "Niech oszczerca nie będzie utwierdzony na ziemi, niech zło poluje na człowieka okrutnego, aby go powalić."
"Ps140,12": "Wiem, że JHWH dokona sądu dla udręczonego i ubogiemu odda sprawiedliwość."
"Ps140,13": "O tak, sprawiedliwi będą wysławiać Twoje imię, a prawi będą mieszkać przed Twoim obliczem."
