"Ps89,1": "Będę śpiewał o dziełach łaski JHWH na wieki, swoimi ustami będę oznajmiał Twoją wierność z pokolenia na pokolenie."
"Ps89,2": "Ponieważ powiedziałem: Łaska będzie utrwalona na wieki. Niebiosa – w nich utwierdziłeś swoją wierność."
"Ps89,3": "Zawarłem przymierze z moim wybrańcem; przysiągłem Dawidowi, swojemu słudze;"
"Ps89,4": "Na wieki utwierdzę twoje potomstwo i zbuduję twój tron z pokolenia na pokolenie. Sela."
"Ps89,5": "Tak, JHWH, niebiosa wysławiają Twoje cuda, a także Twoją wierność w zgromadzeniu świętych."
"Ps89,6": "Kto bowiem na nieboskłonie może się równać z JHWH? Kto pośród synów mocarzy jest podobny do JHWH?"
"Ps89,7": "Bóg jest przerażającym w gronie świętych i wielce przejmujący lękiem wśród wszystkich, którzy są wokół Niego."
"Ps89,8": "JHWH, Boże Zastępów, kto jest taki, jak Ty? JH[WH] potężny! I otacza Cię Twoja wierność."
"Ps89,9": "Ty panujesz nad wzburzonym morzem; gdy się podnoszą jego fale, Ty je uspokajasz."
"Ps89,10": "Ty zdruzgotałeś Rahaba – jak kogoś zabitego. Mocą Twojego ramienia rozproszyłeś swoich wrogów."
"Ps89,11": "Twoje są niebiosa, a także Twoja jest ziemia; Ty ugruntowałeś świat i wszystko, co go napełnia."
"Ps89,12": "Ty stworzyłeś północ i południe; Tabor i Hermon radośnie wykrzykują w Twoim imieniu."
"Ps89,13": "Ty masz potężne ramię, Twoja ręka mocna, a Twoja prawica wzniesiona."
"Ps89,14": "Sprawiedliwość i sąd są podstawą Twojego tronu, miłosierdzie i prawda idą przed Twoim obliczem."
"Ps89,15": "Błogosławiony lud, który wie co to jest okrzyk radości; będzie chodzić w światłości Twojego oblicza, JHWH."
"Ps89,16": "W Twoim imieniu będą się weselić każdego dnia, a w Twojej sprawiedliwości będą wywyższeni."
"Ps89,17": "Ty bowiem jesteś pięknem ich mocy i z Twojej łaski nasz róg będzie wzniesiony."
"Ps89,18": "Bo JHWH jest naszą tarczą, a Święty Izraela naszym królem."
"Ps89,19": "Wtedy powiedziałeś w widzeniu swojemu świętemu te słowa: Udzieliłem pomocy mocarzowi, wywyższyłem wybranego z ludu."
"Ps89,20": "Znalazłem Dawida, mojego sługę, namaściłem go moim świętym olejem."
"Ps89,21": "Jego utwierdzę swoją ręką. O tak, umocni go moje ramię."
"Ps89,22": "Nie będzie go nękać wróg, a syn nieprawości go nie pognębi."
"Ps89,23": "Zgniotę przed jego obliczem jego przeciwników, a nienawidzących go, porażę."
"Ps89,24": "A moja wierność i miłosierdzie będą z nim, a w moim imieniu wzniesie się jego róg."
"Ps89,25": "I położę na morzu jego rękę, i na rzekach jego prawicę."
"Ps89,26": "On zawoła do mnie: Ty jesteś moim ojcem, moim Bogiem i skałą mojego zbawienia!"
"Ps89,27": "Ja więc uczynię go pierworodnym i najwyższym wśród królów ziemi."
"Ps89,28": "Na wieki zachowam dla niego swoje miłosierdzie, a moje przymierze z nim będzie trwałe."
"Ps89,29": "Jego potomstwo utrwalę na wieki a jego tron – jak dni niebios."
"Ps89,30": "Ale jeśli jego synowie porzucą moje Prawo i nie będą postępowali według moich rozstrzygnięć;"
"Ps89,31": "Jeśli moje ustawy znieważą, a moich przykazań nie będą przestrzegać;"
"Ps89,32": "Wtedy ja nawiedzę rózgą ich przestępstwo, a ich nieprawość plagami."
"Ps89,33": "Lecz nie odbiorę mu mojego miłosierdzia ani nie zdradzę mojej wierności."
"Ps89,34": "Nie złamię mojego przymierza ani nie zmienię tego, co wyszło z moich ust."
"Ps89,35": "Raz przysiągłem w swojej świętości, że nie zawiodę Dawida."
"Ps89,36": "Jego potomstwo będzie istnieć na wieki, a jego tron jak słońce przede mną;"
"Ps89,37": "Jak księżyc będzie utwierdzone na wieki i jak wierny świadek na nieboskłonie. Sela."
"Ps89,38": "Lecz Ty odrzuciłeś, wzgardziłeś i wybuchnąłeś gniewem na Twojego pomazańca."
"Ps89,39": "Odrzuciłeś przymierze z Twoim sługą, znieważyłeś strącając na ziemię jego koronę."
"Ps89,40": "Rozbiłeś wszystkie jego mury i doprowadziłeś do ruiny jego umocnienia."
"Ps89,41": "Ograbili go wszyscy przechodzący drogą, stał się pogardą dla swoich sąsiadów."
"Ps89,42": "Podniosłeś prawicę jego przeciwników, sprawiłeś radość wszystkim jego wrogom."
"Ps89,43": "Odrzuciłeś też ostrze jego miecza i nie wsparłeś go w bitwie."
"Ps89,44": "Położyłeś kres jego czystości, a jego tron obaliłeś na ziemię."
"Ps89,45": "Skróciłeś dni jego młodości, okryłeś go hańbą. Sela."
"Ps89,46": "Jak długo, JHWH? Czy wiecznie będziesz się ukrywał? Czy Twoja zapalczywość będzie płonąć jak ogień?"
"Ps89,47": "Wspomnij na mnie, jak krótkie jest moje życie; czy na próżno stworzyłeś wszystkich synów ludzkich?"
"Ps89,48": "Gdzie jest bohater, który może żyć i nie ujrzeć śmierci? I który wyrwie swoją duszę z ręki Szeolu? Sela."
"Ps89,49": "Gdzie są, o PANIE, Twoje wcześniejsze dzieła łaski, które przysiągłeś Dawidowi w swojej wierności?"
"Ps89,50": "Pamiętaj, PANIE, o zniewadze Twoich sług, którą noszę w moim wnętrzu, doznaną od wszystkich licznych narodów;"
"Ps89,51": "Które Twoi wrogowie znieważają, JHWH, ci, którzy znieważają kroki Twojego pomazańca."
"Ps89,52": "Błogosławiony niech będzie JHWH na wieki. Amen, amen."
