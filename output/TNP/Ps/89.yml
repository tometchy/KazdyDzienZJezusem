"Ps89,1":
  text: "Będę śpiewał o dziełach łaski JHWH na wieki, swoimi ustami będę oznajmiał Twoją wierność z pokolenia na pokolenie."
  tags: []
"Ps89,2":
  text: "Ponieważ powiedziałem: Łaska będzie utrwalona na wieki. Niebiosa – w nich utwierdziłeś swoją wierność."
  tags: []
"Ps89,3":
  text: "Zawarłem przymierze z moim wybrańcem; przysiągłem Dawidowi, swojemu słudze;"
  tags: []
"Ps89,4":
  text: "Na wieki utwierdzę twoje potomstwo i zbuduję twój tron z pokolenia na pokolenie. Sela."
  tags: []
"Ps89,5":
  text: "Tak, JHWH, niebiosa wysławiają Twoje cuda, a także Twoją wierność w zgromadzeniu świętych."
  tags: []
"Ps89,6":
  text: "Kto bowiem na nieboskłonie może się równać z JHWH? Kto pośród synów mocarzy jest podobny do JHWH?"
  tags: []
"Ps89,7":
  text: "Bóg jest przerażającym w gronie świętych i wielce przejmujący lękiem wśród wszystkich, którzy są wokół Niego."
  tags: []
"Ps89,8":
  text: "JHWH, Boże Zastępów, kto jest taki, jak Ty? JH[WH] potężny! I otacza Cię Twoja wierność."
  tags: []
"Ps89,9":
  text: "Ty panujesz nad wzburzonym morzem; gdy się podnoszą jego fale, Ty je uspokajasz."
  tags: []
"Ps89,10":
  text: "Ty zdruzgotałeś Rahaba – jak kogoś zabitego. Mocą Twojego ramienia rozproszyłeś swoich wrogów."
  tags: []
"Ps89,11":
  text: "Twoje są niebiosa, a także Twoja jest ziemia; Ty ugruntowałeś świat i wszystko, co go napełnia."
  tags: []
"Ps89,12":
  text: "Ty stworzyłeś północ i południe; Tabor i Hermon radośnie wykrzykują w Twoim imieniu."
  tags: []
"Ps89,13":
  text: "Ty masz potężne ramię, Twoja ręka mocna, a Twoja prawica wzniesiona."
  tags: []
"Ps89,14":
  text: "Sprawiedliwość i sąd są podstawą Twojego tronu, miłosierdzie i prawda idą przed Twoim obliczem."
  tags: []
"Ps89,15":
  text: "Błogosławiony lud, który wie co to jest okrzyk radości; będzie chodzić w światłości Twojego oblicza, JHWH."
  tags: []
"Ps89,16":
  text: "W Twoim imieniu będą się weselić każdego dnia, a w Twojej sprawiedliwości będą wywyższeni."
  tags: []
"Ps89,17":
  text: "Ty bowiem jesteś pięknem ich mocy i z Twojej łaski nasz róg będzie wzniesiony."
  tags: []
"Ps89,18":
  text: "Bo JHWH jest naszą tarczą, a Święty Izraela naszym królem."
  tags: []
"Ps89,19":
  text: "Wtedy powiedziałeś w widzeniu swojemu świętemu te słowa: Udzieliłem pomocy mocarzowi, wywyższyłem wybranego z ludu."
  tags: []
"Ps89,20":
  text: "Znalazłem Dawida, mojego sługę, namaściłem go moim świętym olejem."
  tags: []
"Ps89,21":
  text: "Jego utwierdzę swoją ręką. O tak, umocni go moje ramię."
  tags: []
"Ps89,22":
  text: "Nie będzie go nękać wróg, a syn nieprawości go nie pognębi."
  tags: []
"Ps89,23":
  text: "Zgniotę przed jego obliczem jego przeciwników, a nienawidzących go, porażę."
  tags: []
"Ps89,24":
  text: "A moja wierność i miłosierdzie będą z nim, a w moim imieniu wzniesie się jego róg."
  tags: []
"Ps89,25":
  text: "I położę na morzu jego rękę, i na rzekach jego prawicę."
  tags: []
"Ps89,26":
  text: "On zawoła do mnie: Ty jesteś moim ojcem, moim Bogiem i skałą mojego zbawienia!"
  tags: []
"Ps89,27":
  text: "Ja więc uczynię go pierworodnym i najwyższym wśród królów ziemi."
  tags: []
"Ps89,28":
  text: "Na wieki zachowam dla niego swoje miłosierdzie, a moje przymierze z nim będzie trwałe."
  tags: []
"Ps89,29":
  text: "Jego potomstwo utrwalę na wieki a jego tron – jak dni niebios."
  tags: []
"Ps89,30":
  text: "Ale jeśli jego synowie porzucą moje Prawo i nie będą postępowali według moich rozstrzygnięć;"
  tags: []
"Ps89,31":
  text: "Jeśli moje ustawy znieważą, a moich przykazań nie będą przestrzegać;"
  tags: []
"Ps89,32":
  text: "Wtedy ja nawiedzę rózgą ich przestępstwo, a ich nieprawość plagami."
  tags: []
"Ps89,33":
  text: "Lecz nie odbiorę mu mojego miłosierdzia ani nie zdradzę mojej wierności."
  tags: []
"Ps89,34":
  text: "Nie złamię mojego przymierza ani nie zmienię tego, co wyszło z moich ust."
  tags: []
"Ps89,35":
  text: "Raz przysiągłem w swojej świętości, że nie zawiodę Dawida."
  tags: []
"Ps89,36":
  text: "Jego potomstwo będzie istnieć na wieki, a jego tron jak słońce przede mną;"
  tags: []
"Ps89,37":
  text: "Jak księżyc będzie utwierdzone na wieki i jak wierny świadek na nieboskłonie. Sela."
  tags: []
"Ps89,38":
  text: "Lecz Ty odrzuciłeś, wzgardziłeś i wybuchnąłeś gniewem na Twojego pomazańca."
  tags: []
"Ps89,39":
  text: "Odrzuciłeś przymierze z Twoim sługą, znieważyłeś strącając na ziemię jego koronę."
  tags: []
"Ps89,40":
  text: "Rozbiłeś wszystkie jego mury i doprowadziłeś do ruiny jego umocnienia."
  tags: []
"Ps89,41":
  text: "Ograbili go wszyscy przechodzący drogą, stał się pogardą dla swoich sąsiadów."
  tags: []
"Ps89,42":
  text: "Podniosłeś prawicę jego przeciwników, sprawiłeś radość wszystkim jego wrogom."
  tags: []
"Ps89,43":
  text: "Odrzuciłeś też ostrze jego miecza i nie wsparłeś go w bitwie."
  tags: []
"Ps89,44":
  text: "Położyłeś kres jego czystości, a jego tron obaliłeś na ziemię."
  tags: []
"Ps89,45":
  text: "Skróciłeś dni jego młodości, okryłeś go hańbą. Sela."
  tags: []
"Ps89,46":
  text: "Jak długo, JHWH? Czy wiecznie będziesz się ukrywał? Czy Twoja zapalczywość będzie płonąć jak ogień?"
  tags: []
"Ps89,47":
  text: "Wspomnij na mnie, jak krótkie jest moje życie; czy na próżno stworzyłeś wszystkich synów ludzkich?"
  tags: []
"Ps89,48":
  text: "Gdzie jest bohater, który może żyć i nie ujrzeć śmierci? I który wyrwie swoją duszę z ręki Szeolu? Sela."
  tags: []
"Ps89,49":
  text: "Gdzie są, o PANIE, Twoje wcześniejsze dzieła łaski, które przysiągłeś Dawidowi w swojej wierności?"
  tags: []
"Ps89,50":
  text: "Pamiętaj, PANIE, o zniewadze Twoich sług, którą noszę w moim wnętrzu, doznaną od wszystkich licznych narodów;"
  tags: []
"Ps89,51":
  text: "Które Twoi wrogowie znieważają, JHWH, ci, którzy znieważają kroki Twojego pomazańca."
  tags: []
"Ps89,52":
  text: "Błogosławiony niech będzie JHWH na wieki. Amen, amen."
  tags: []
