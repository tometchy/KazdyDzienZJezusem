"Ps110,1": "Psalm Dawida. JHWH oświadczył mojemu PANU: Usiądź po mojej prawicy, aż położę twoich wrogów jako podnóżek pod twoje stopy."
"Ps110,2": "Berło twojej mocy pośle JHWH z Syjonu, mówiąc: Panuj pośród twoich wrogów."
"Ps110,3": "Twój lud będzie ochoczy w dniu twojej potęgi, w ozdobach świętości, z łona świtu. Dla ciebie czeka rosa twojej młodości."
"Ps110,4": "JHWH przysiągł i nie będzie żałował: Ty jesteś kapłanem na wieki według porządku Melchizedeka."
"Ps110,5": "PAN po twojej prawicy roztrzaska królów w dniu swojego gniewu."
"Ps110,6": "Będzie sądził narody i napełni wszystko martwymi ciałami; roztrzaska głowy panujące nad ziemią."
"Ps110,7": "Ze strumienia będzie pił po drodze, dlatego podniesie głowę."
