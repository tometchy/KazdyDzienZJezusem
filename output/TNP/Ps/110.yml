"Ps110,1":
  text: "Psalm Dawida. JHWH oświadczył mojemu PANU: Usiądź po mojej prawicy, aż położę twoich wrogów jako podnóżek pod twoje stopy."
  tags: []
"Ps110,2":
  text: "Berło twojej mocy pośle JHWH z Syjonu, mówiąc: Panuj pośród twoich wrogów."
  tags: []
"Ps110,3":
  text: "Twój lud będzie ochoczy w dniu twojej potęgi, w ozdobach świętości, z łona świtu. Dla ciebie czeka rosa twojej młodości."
  tags: []
"Ps110,4":
  text: "JHWH przysiągł i nie będzie żałował: Ty jesteś kapłanem na wieki według porządku Melchizedeka."
  tags: []
"Ps110,5":
  text: "PAN po twojej prawicy roztrzaska królów w dniu swojego gniewu."
  tags: []
"Ps110,6":
  text: "Będzie sądził narody i napełni wszystko martwymi ciałami; roztrzaska głowy panujące nad ziemią."
  tags: []
"Ps110,7":
  text: "Ze strumienia będzie pił po drodze, dlatego podniesie głowę."
  tags: []
