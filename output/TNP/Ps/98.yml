"Ps98,1": "Psalm. Śpiewajcie JHWH nową pieśń, bo uczynił cudowne dzieła, Jego prawica i święte ramię dały Mu zwycięstwo."
"Ps98,2": "JHWH objawił swoje zbawienie, okazał swoją sprawiedliwość na oczach narodów."
"Ps98,3": "Pamiętał o swoim miłosierdziu i swojej wierności wobec domu Izraela; wszystkie krańce ziemi ujrzały zbawienie naszego Boga."
"Ps98,4": "Triumfalnie wykrzykuj dla JHWH cała ziemio; wybuchnijcie z radości i radośnie wiwatujcie."
"Ps98,5": "Grajcie JHWH na cytrze, na cytrze przy dźwięku melodii."
"Ps98,6": "Na trąbach i przy dźwięku rogu wykrzykujcie radośnie przed obliczem króla, JHWH."
"Ps98,7": "Niech zaszumi morze i to, co je wypełnia, świat i ci, którzy na nim mieszkają."
"Ps98,8": "Niech rzeki uderzą w dłoń, niech góry wspólnie radośnie wiwatują;"
"Ps98,9": "Przed obliczem JHWH, bo idzie, by sądzić ziemię. Będzie sądził świat sprawiedliwie i narody według słuszności."
