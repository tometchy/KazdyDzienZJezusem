"Ps98,1":
  text: "Psalm. Śpiewajcie JHWH nową pieśń, bo uczynił cudowne dzieła, Jego prawica i święte ramię dały Mu zwycięstwo."
  tags: []
"Ps98,2":
  text: "JHWH objawił swoje zbawienie, okazał swoją sprawiedliwość na oczach narodów."
  tags: []
"Ps98,3":
  text: "Pamiętał o swoim miłosierdziu i swojej wierności wobec domu Izraela; wszystkie krańce ziemi ujrzały zbawienie naszego Boga."
  tags: []
"Ps98,4":
  text: "Triumfalnie wykrzykuj dla JHWH cała ziemio; wybuchnijcie z radości i radośnie wiwatujcie."
  tags: []
"Ps98,5":
  text: "Grajcie JHWH na cytrze, na cytrze przy dźwięku melodii."
  tags: []
"Ps98,6":
  text: "Na trąbach i przy dźwięku rogu wykrzykujcie radośnie przed obliczem króla, JHWH."
  tags: []
"Ps98,7":
  text: "Niech zaszumi morze i to, co je wypełnia, świat i ci, którzy na nim mieszkają."
  tags: []
"Ps98,8":
  text: "Niech rzeki uderzą w dłoń, niech góry wspólnie radośnie wiwatują;"
  tags: []
"Ps98,9":
  text: "Przed obliczem JHWH, bo idzie, by sądzić ziemię. Będzie sądził świat sprawiedliwie i narody według słuszności."
  tags: []
