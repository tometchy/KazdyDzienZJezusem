"Ps101,1":
  text: "Psalm Dawida. Pragnę śpiewać o miłosierdziu i sądzie; Tobie, JHWH, pragnę oddać chwałę."
  tags: []
"Ps101,2":
  text: "Pragnę mądrze kroczyć drogą doskonałą, gdy przyjdziesz do mnie. Pragnę chodzić w swoim domu w prawości serca."
  tags: []
"Ps101,3":
  text: "Nie postawię przed swoje oczy nic nikczemnego; nienawidzę postępowania odstępców, nie przylgnie ono do mnie."
  tags: []
"Ps101,4":
  text: "Serce przewrotne zostanie usunięte ode mnie, nie chcę znać złego."
  tags: []
"Ps101,5":
  text: "Zniszczę tego, kto potajemnie oczernia swojego bliźniego, nie zniosę wyniosłych oczu i nadętego serca."
  tags: []
"Ps101,6":
  text: "Moje oczy zwrócone będą na wiernych tej ziemi, pragnę, by mieszkali ze mną; kto chodzi drogą doskonałą, ten będzie mi służył."
  tags: []
"Ps101,7":
  text: "Nie zamieszka we wnętrzu mojego domu, ten kto dopuszcza się zdrady, mówiący kłamstwa nie ostoi się przed moimi oczami."
  tags: []
"Ps101,8":
  text: "Co rano będę niszczył wszystkich niegodziwych na ziemi, by wyciąć z miasta JHWH wszystkich złoczyńców."
  tags: []
