"Ps101,1": "Psalm Dawida. Pragnę śpiewać o miłosierdziu i sądzie; Tobie, JHWH, pragnę oddać chwałę."
"Ps101,2": "Pragnę mądrze kroczyć drogą doskonałą, gdy przyjdziesz do mnie. Pragnę chodzić w swoim domu w prawości serca."
"Ps101,3": "Nie postawię przed swoje oczy nic nikczemnego; nienawidzę postępowania odstępców, nie przylgnie ono do mnie."
"Ps101,4": "Serce przewrotne zostanie usunięte ode mnie, nie chcę znać złego."
"Ps101,5": "Zniszczę tego, kto potajemnie oczernia swojego bliźniego, nie zniosę wyniosłych oczu i nadętego serca."
"Ps101,6": "Moje oczy zwrócone będą na wiernych tej ziemi, pragnę, by mieszkali ze mną; kto chodzi drogą doskonałą, ten będzie mi służył."
"Ps101,7": "Nie zamieszka we wnętrzu mojego domu, ten kto dopuszcza się zdrady, mówiący kłamstwa nie ostoi się przed moimi oczami."
"Ps101,8": "Co rano będę niszczył wszystkich niegodziwych na ziemi, by wyciąć z miasta JHWH wszystkich złoczyńców."
