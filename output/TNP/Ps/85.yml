"Ps85,1":
  text: "JHWH, okazałeś łaskę swojej ziemi, przywróciłeś z niewoli Jakuba."
  tags: []
"Ps85,2":
  text: "Przebaczyłeś nieprawość Twojego ludu, zakryłeś wszystkie ich grzechy. Sela."
  tags: []
"Ps85,3":
  text: "Uśmierzyłeś cały wybuch swojej wściekłości, odwróciłeś się od zapalczywości swojego gniewu."
  tags: []
"Ps85,4":
  text: "Przywróć nas, Boże naszego zbawienia, i odwróć od nas swoje rozdrażnienie."
  tags: []
"Ps85,5":
  text: "Czy wiecznie będziesz z nas niezadowolony? Czy rozciągniesz swój gniew z pokolenia na pokolenie?"
  tags: []
"Ps85,6":
  text: "Czy to nie Ty przywrócisz nas do życia, aby Twój lud rozradował się w Tobie?"
  tags: []
"Ps85,7":
  text: "Daj nam zobaczyć, JHWH, Twoje miłosierdzie i daj nam swoje zbawienie."
  tags: []
"Ps85,8":
  text: "Chcę słuchać, co powie Bóg, JHWH; Oto, ogłosi pokój swojemu ludowi i swoim świętym, i niech nie wracają do swojej głupoty."
  tags: []
"Ps85,9":
  text: "O tak, Jego zbawienie jest blisko tych, którzy się Go boją, tak aby Jego chwała mogła zamieszkać w naszej ziemi."
  tags: []
"Ps85,10":
  text: "Miłosierdzie i prawda spotkają się razem, sprawiedliwość i pokój pocałują się."
  tags: []
"Ps85,11":
  text: "Prawda wyrośnie z ziemi, a sprawiedliwość spojrzy w dół z niebios."
  tags: []
"Ps85,12":
  text: "JHWH także obdaruje dobrem, a nasza ziemia wyda swój plon."
  tags: []
"Ps85,13":
  text: "Sprawiedliwość przed Nim pójdzie i będzie wyznaczać drogę Jego krokom."
  tags: []
