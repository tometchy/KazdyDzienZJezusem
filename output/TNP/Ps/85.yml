"Ps85,1": "JHWH, okazałeś łaskę swojej ziemi, przywróciłeś z niewoli Jakuba."
"Ps85,2": "Przebaczyłeś nieprawość Twojego ludu, zakryłeś wszystkie ich grzechy. Sela."
"Ps85,3": "Uśmierzyłeś cały wybuch swojej wściekłości, odwróciłeś się od zapalczywości swojego gniewu."
"Ps85,4": "Przywróć nas, Boże naszego zbawienia, i odwróć od nas swoje rozdrażnienie."
"Ps85,5": "Czy wiecznie będziesz z nas niezadowolony? Czy rozciągniesz swój gniew z pokolenia na pokolenie?"
"Ps85,6": "Czy to nie Ty przywrócisz nas do życia, aby Twój lud rozradował się w Tobie?"
"Ps85,7": "Daj nam zobaczyć, JHWH, Twoje miłosierdzie i daj nam swoje zbawienie."
"Ps85,8": "Chcę słuchać, co powie Bóg, JHWH; Oto, ogłosi pokój swojemu ludowi i swoim świętym, i niech nie wracają do swojej głupoty."
"Ps85,9": "O tak, Jego zbawienie jest blisko tych, którzy się Go boją, tak aby Jego chwała mogła zamieszkać w naszej ziemi."
"Ps85,10": "Miłosierdzie i prawda spotkają się razem, sprawiedliwość i pokój pocałują się."
"Ps85,11": "Prawda wyrośnie z ziemi, a sprawiedliwość spojrzy w dół z niebios."
"Ps85,12": "JHWH także obdaruje dobrem, a nasza ziemia wyda swój plon."
"Ps85,13": "Sprawiedliwość przed Nim pójdzie i będzie wyznaczać drogę Jego krokom."
