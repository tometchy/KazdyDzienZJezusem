"Ps108,1":
  text: "Boże, moje serce jest gotowe; będę Ci śpiewał i wysławiał Cię, także i moja chwała."
  tags: []
"Ps108,2":
  text: "Obudź się, cytro i harfo, gdy budzę się o świcie."
  tags: []
"Ps108,3":
  text: "Pragnę Cię wysławiać wśród ludu, JHWH, pragnę Ci śpiewać wśród narodów."
  tags: []
"Ps108,4":
  text: "Bo Twoje miłosierdzie jest wielkie, sięga ponad niebiosa, a Twoja prawda aż pod obłoki."
  tags: []
"Ps108,5":
  text: "Bądź wywyższony ponad niebiosa, Boże, a Twoja chwała ponad całą ziemię;"
  tags: []
"Ps108,6":
  text: "Aby Twoi umiłowani zostali wyzwoleni, wybaw ich swoją prawicą i odpowiedz mi."
  tags: []
"Ps108,7":
  text: "Bóg przemówił w swojej świętości: Z radością rozdzielę Sychem, a dolinę Sukkot wymierzę."
  tags: []
"Ps108,8":
  text: "Mój jest Gilead, mój i Manasses, Efraim osłoną mojej głowy, Juda moim prawodawcą."
  tags: []
"Ps108,9":
  text: "Moab jest moją misą do mycia, na Edom rzucę mój sandał; zawiwatuję nad Filisteą."
  tags: []
"Ps108,10":
  text: "Kto mnie wprowadzi do miasta warownego? Kto mnie doprowadzi do Edomu?"
  tags: []
"Ps108,11":
  text: "Czy nie Ty, o Boże, który nas odrzuciłeś i już nie wyruszasz, Boże, z naszymi zastępami?"
  tags: []
"Ps108,12":
  text: "Zapewnij nam pomoc w utrapieniu, bo próżne jest wsparcie człowieka."
  tags: []
"Ps108,13":
  text: "W Bogu uczynimy potężne rzeczy, a On podepcze naszych nieprzyjaciół."
  tags: []
