"Ps108,1": "Boże, moje serce jest gotowe; będę Ci śpiewał i wysławiał Cię, także i moja chwała."
"Ps108,2": "Obudź się, cytro i harfo, gdy budzę się o świcie."
"Ps108,3": "Pragnę Cię wysławiać wśród ludu, JHWH, pragnę Ci śpiewać wśród narodów."
"Ps108,4": "Bo Twoje miłosierdzie jest wielkie, sięga ponad niebiosa, a Twoja prawda aż pod obłoki."
"Ps108,5": "Bądź wywyższony ponad niebiosa, Boże, a Twoja chwała ponad całą ziemię;"
"Ps108,6": "Aby Twoi umiłowani zostali wyzwoleni, wybaw ich swoją prawicą i odpowiedz mi."
"Ps108,7": "Bóg przemówił w swojej świętości: Z radością rozdzielę Sychem, a dolinę Sukkot wymierzę."
"Ps108,8": "Mój jest Gilead, mój i Manasses, Efraim osłoną mojej głowy, Juda moim prawodawcą."
"Ps108,9": "Moab jest moją misą do mycia, na Edom rzucę mój sandał; zawiwatuję nad Filisteą."
"Ps108,10": "Kto mnie wprowadzi do miasta warownego? Kto mnie doprowadzi do Edomu?"
"Ps108,11": "Czy nie Ty, o Boże, który nas odrzuciłeś i już nie wyruszasz, Boże, z naszymi zastępami?"
"Ps108,12": "Zapewnij nam pomoc w utrapieniu, bo próżne jest wsparcie człowieka."
"Ps108,13": "W Bogu uczynimy potężne rzeczy, a On podepcze naszych nieprzyjaciół."
