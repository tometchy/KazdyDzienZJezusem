"Ps133,1": "Pieśń stopni. Dawida. Oto, jak dobrze i miło, gdy bracia w zgodzie mieszkają!"
"Ps133,2": "Jest to jak wyborny olejek na głowie, który spływa na brodę, na brodę Aarona; spływający na skraj jego szat;"
"Ps133,3": "Jest to jak rosa Hermonu, opadająca na góry Syjon; bo tam JHWH zarządza błogosławieństwo i życie na wieki."
