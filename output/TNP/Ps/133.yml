"Ps133,1":
  text: "Pieśń stopni. Dawida. Oto, jak dobrze i miło, gdy bracia w zgodzie mieszkają!"
  tags: []
"Ps133,2":
  text: "Jest to jak wyborny olejek na głowie, który spływa na brodę, na brodę Aarona; spływający na skraj jego szat;"
  tags: []
"Ps133,3":
  text: "Jest to jak rosa Hermonu, opadająca na góry Syjon; bo tam JHWH zarządza błogosławieństwo i życie na wieki."
  tags: []
