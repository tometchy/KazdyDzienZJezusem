"Ps13,1": "Dla przewodnika chóru. Psalm Dawida. Jak długo, JHWH? Czy zawsze będziesz o mnie zapominał? Jak długo będziesz ukrywał przede mną swoje oblicze?"
"Ps13,2": "Jak długo będę układał plany w swojej duszy i codziennie nosił smutek w sercu? Jak długo mój wróg będzie się wynosił nade mną?"
"Ps13,3": "Spójrz i wysłuchaj mnie, JHWH, mój Boże! Oświeć moje oczy, bym nie zasnął w śnie śmierci;"
"Ps13,4": "By mój wróg nie mówił: Zwyciężyłem go! Aby moi nieprzyjaciele nie radowali się, gdy się zachwieję."
"Ps13,5": "Lecz ja zaufałem Twojemu miłosierdziu; niech raduje się moje serce w Twoim zbawieniu."
"Ps13,6": "Będę śpiewał JHWH, bo obdarzył mnie dobrem."
