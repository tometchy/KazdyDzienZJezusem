"Ps13,1":
  text: "Dla przewodnika chóru. Psalm Dawida. Jak długo, JHWH? Czy zawsze będziesz o mnie zapominał? Jak długo będziesz ukrywał przede mną swoje oblicze?"
  tags: []
"Ps13,2":
  text: "Jak długo będę układał plany w swojej duszy i codziennie nosił smutek w sercu? Jak długo mój wróg będzie się wynosił nade mną?"
  tags: []
"Ps13,3":
  text: "Spójrz i wysłuchaj mnie, JHWH, mój Boże! Oświeć moje oczy, bym nie zasnął w śnie śmierci;"
  tags: []
"Ps13,4":
  text: "By mój wróg nie mówił: Zwyciężyłem go! Aby moi nieprzyjaciele nie radowali się, gdy się zachwieję."
  tags: []
"Ps13,5":
  text: "Lecz ja zaufałem Twojemu miłosierdziu; niech raduje się moje serce w Twoim zbawieniu."
  tags: []
"Ps13,6":
  text: "Będę śpiewał JHWH, bo obdarzył mnie dobrem."
  tags: []
