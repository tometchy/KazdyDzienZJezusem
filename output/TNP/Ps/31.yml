"Ps31,1": "Dla przewodnika chóru. Psalm Dawida. W Tobie, JHWH, pokładam nadzieję, obym nigdy nie został zawstydzony, wyzwól mnie w swojej sprawiedliwości."
"Ps31,2": "Skłoń ku mnie swoje ucho, jak najszybciej mnie ocal; bądź mi ufortyfikowaną skałą, miejscem warownym, abyś mnie wybawił."
"Ps31,3": "Ty bowiem jesteś moją ścianą skalną i warownią; dlatego przez wzgląd na Twoje imię kieruj mną i prowadź."
"Ps31,4": "Wyciągnij mnie z sieci, którą zastawili na mnie, bo Ty jesteś moją twierdzą."
"Ps31,5": "W Twoje ręce powierzę mojego ducha; odkupiłeś mnie, JHWH, Boże wierny."
"Ps31,6": "Znienawidziłem tych, którzy zważają na próżne marności, bo ja w JHWH pokładam ufność."
"Ps31,7": "Będę się radował i weselił w Twoim miłosierdziu, bo widziałeś moje utrapienie i poznałeś udręki mojej duszy;"
"Ps31,8": "I nie wydałeś mnie w ręce wroga, postawiłeś moje nogi na miejscu przestronnym."
"Ps31,9": "Bądź dla mnie miłosierny, JHWH, bo jestem udręczony, z żalu słabnie moje oko, a także moja dusza i moje wnętrze."
"Ps31,10": "W bólu bowiem wypełniło się moje życie, a moje lata na wzdychaniu; moja siła osłabła z powodu mojej nieprawości, a moje kości wyschły."
"Ps31,11": "Stałem się pośmiewiskiem dla wszystkich moich wrogów, a zwłaszcza dla moich sąsiadów, i przerażeniem dla tych, którzy mnie znają; ci, którzy mnie widzą na ulicy, uciekają przede mną."
"Ps31,12": "Zostałem zapomniany jak umarły, w sercu stałem się jak rozbite naczynie."
"Ps31,13": "Słyszę bowiem złowrogi szept wielu; groza dookoła; gdy razem naradzają się przeciwko mnie, knują, jak odebrać mi życie."
"Ps31,14": "Ale ja zaufałem Tobie, JHWH; powiedziałem: Ty jesteś moim Bogiem."
"Ps31,15": "Mój czas jest w Twoim ręku, wyrwij mnie z ręki moich wrogów i od tych, którzy mnie prześladują."
"Ps31,16": "Rozjaśnij swoje oblicze nad Twoim sługą, wybaw mnie w Twoim miłosierdziu."
"Ps31,17": "JHWH, niech nie doznam wstydu, ponieważ Cię wzywałem; niech niegodziwi się zawstydzą i niech zamilkną w Szeolu."
"Ps31,18": "Niech zaniemówią wargi wypowiadające kłamstwo, które zuchwale, butnie z pogardą mówią przeciwko sprawiedliwemu."
"Ps31,19": "Jak wielka jest Twoja dobroć, którą gromadzisz dla bojących się Ciebie i okazujesz ją tym, co ufają Tobie wobec synów ludzkich."
"Ps31,20": "Schowasz ich pod osłoną Twojej obecności przed atakiem człowieka, ochronisz ich w namiocie przed kłótliwym językiem."
"Ps31,21": "Błogosławiony niech będzie JHWH, ponieważ okazał mi cudownie swoją łaskę w mieście warownym."
"Ps31,22": "A ja powiedziałem w moim popłochu: Odrzuciłeś mnie sprzed Twoich oczu; a jednak wysłuchałeś głosu moich błagań o przychylność, gdy wołałem do Ciebie."
"Ps31,23": "Miłujcie JHWH, wszyscy Jego święci, bo JHWH strzeże wiernych, a postępującemu dumnie odpłaci obficie."
"Ps31,24": "Bądźcie mocni i niech wasze serce będzie odważne, wy wszyscy, którzy pokładacie nadzieję w JHWH."
