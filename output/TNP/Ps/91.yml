"Ps91,1":
  text: "Kto mieszka pod osłoną Najwyższego, będzie przebywał w cieniu Wszechmogącego,"
  tags: []
"Ps91,2":
  text: "Będę mówił o JHWH: Moja ucieczka i twierdza, mój Bóg, Jemu będę ufał."
  tags: []
"Ps91,3":
  text: "Ponieważ On wybawi cię z sideł ptasznika i od zgubnej zarazy."
  tags: []
"Ps91,4":
  text: "Okryje cię swoimi piórami i pod Jego skrzydłami znajdziesz schronienie; Jego prawda będzie ci tarczą i puklerzem."
  tags: []
"Ps91,5":
  text: "Nie będziesz się bał strachu nocnego ani strzały lecącej za dnia;"
  tags: []
"Ps91,6":
  text: "Ani zarazy, która przychodzi w mroku; ani zagłady, która niszczy w południe."
  tags: []
"Ps91,7":
  text: "Tysiąc padnie u twojego boku, a dziesięć tysięcy po twojej prawicy, lecz do ciebie to się nie zbliży."
  tags: []
"Ps91,8":
  text: "Tylko zobaczysz to na własne oczy i ujrzysz zapłatę daną niegodziwym."
  tags: []
"Ps91,9":
  text: "Bo Ty, JHWH, jesteś moją ucieczką. Jeśli Najwyższego uczyniłeś swoim mieszkaniem,"
  tags: []
"Ps91,10":
  text: "Nie spotka cię nic złego ani plaga nie zbliży się do twojego namiotu."
  tags: []
"Ps91,11":
  text: "Rozkaże bowiem o tobie swoim aniołom, aby cię strzegli na wszystkich twoich drogach."
  tags: []
"Ps91,12":
  text: "Na rękach będą cię nosić, byś nie uderzył swojej nogi o kamień."
  tags: []
"Ps91,13":
  text: "Będziesz stąpał po lwie i po żmii, lwiątko i szakala podepczesz."
  tags: []
"Ps91,14":
  text: "Ponieważ mnie umiłował, wybawię go; wywyższę go, bo poznał moje imię."
  tags: []
"Ps91,15":
  text: "Będzie mnie wzywał i odpowiem mu; ja sam będę z nim w utrapieniu, wyrwę go i otoczę chwałą."
  tags: []
"Ps91,16":
  text: "Długimi dniami go nasycę i ukażę mu moje zbawienie."
  tags: []
