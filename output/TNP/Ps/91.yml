"Ps91,1": "Kto mieszka pod osłoną Najwyższego, będzie przebywał w cieniu Wszechmogącego,"
"Ps91,2": "Będę mówił o JHWH: Moja ucieczka i twierdza, mój Bóg, Jemu będę ufał."
"Ps91,3": "Ponieważ On wybawi cię z sideł ptasznika i od zgubnej zarazy."
"Ps91,4": "Okryje cię swoimi piórami i pod Jego skrzydłami znajdziesz schronienie; Jego prawda będzie ci tarczą i puklerzem."
"Ps91,5": "Nie będziesz się bał strachu nocnego ani strzały lecącej za dnia;"
"Ps91,6": "Ani zarazy, która przychodzi w mroku; ani zagłady, która niszczy w południe."
"Ps91,7": "Tysiąc padnie u twojego boku, a dziesięć tysięcy po twojej prawicy, lecz do ciebie to się nie zbliży."
"Ps91,8": "Tylko zobaczysz to na własne oczy i ujrzysz zapłatę daną niegodziwym."
"Ps91,9": "Bo Ty, JHWH, jesteś moją ucieczką. Jeśli Najwyższego uczyniłeś swoim mieszkaniem,"
"Ps91,10": "Nie spotka cię nic złego ani plaga nie zbliży się do twojego namiotu."
"Ps91,11": "Rozkaże bowiem o tobie swoim aniołom, aby cię strzegli na wszystkich twoich drogach."
"Ps91,12": "Na rękach będą cię nosić, byś nie uderzył swojej nogi o kamień."
"Ps91,13": "Będziesz stąpał po lwie i po żmii, lwiątko i szakala podepczesz."
"Ps91,14": "Ponieważ mnie umiłował, wybawię go; wywyższę go, bo poznał moje imię."
"Ps91,15": "Będzie mnie wzywał i odpowiem mu; ja sam będę z nim w utrapieniu, wyrwę go i otoczę chwałą."
"Ps91,16": "Długimi dniami go nasycę i ukażę mu moje zbawienie."
