"Ps90,1":
  text: "PANIE, Ty byłeś dla nas schronieniem z pokolenia w pokolenie."
  tags: []
"Ps90,2":
  text: "Zanim zostały zrodzone góry, zanim ukształtowałeś ziemię i świat, od wieków na wieki Ty jesteś Bogiem."
  tags: []
"Ps90,3":
  text: "Ty obracasz człowieka w proch i mówisz: Wracajcie, synowie ludzcy."
  tags: []
"Ps90,4":
  text: "Tysiąc lat bowiem w Twoich oczach jest jak dzień wczorajszy, który minął, i jak straż nocna."
  tags: []
"Ps90,5":
  text: "Porywasz ich jak nurt powodzi, są jak sen i jak trawa, która przemija."
  tags: []
"Ps90,6":
  text: "Rano rozkwita i rośnie, a wieczorem zostaje skoszona i usycha."
  tags: []
"Ps90,7":
  text: "Giniemy bowiem od Twojego gniewu i przeraża nas Twoja zapalczywość."
  tags: []
"Ps90,8":
  text: "Postawiłeś przed sobą nasze nieprawości, nasze ukryte grzechy w świetle Twojego oblicza."
  tags: []
"Ps90,9":
  text: "Wszystkie nasze dni gasną z powodu Twojego wzburzenia, nasze lata dobiegają kresu jak westchnienie."
  tags: []
"Ps90,10":
  text: "Dni lat naszych w nas samych jest siedemdziesiąt lat, a jeśli sił starczy, lat osiemdziesiąt, a ich chlubą to tylko trud i smutek, bo szybko mijają, a my odlatujemy."
  tags: []
"Ps90,11":
  text: "Kto zna potęgę Twojego gniewu? A ogarnięty bojaźnią przed Tobą, Twoje wzburzenie?"
  tags: []
"Ps90,12":
  text: "Dlatego też naucz nas liczyć nasze dni, aby serce nasze zostało przyprowadzone do mądrości."
  tags: []
"Ps90,13":
  text: "Powróć, JHWH. Jak długo jeszcze? Zlituj się nad swoimi sługami."
  tags: []
"Ps90,14":
  text: "Zaspokój nas o poranku Twoim miłosierdziem, abyśmy mogli wykrzykiwać z radości i cieszyć się przez wszystkie nasze dni."
  tags: []
"Ps90,15":
  text: "Spraw nam radość odpowiednio do dni, w których nas upokorzyłeś; odpowiednio do lat, w których oglądaliśmy zło."
  tags: []
"Ps90,16":
  text: "Niech się ukaże Twoim sługom Twoje dzieło, a Twoja chwała ich synom."
  tags: []
"Ps90,17":
  text: "Niech dobroć JHWH, naszego Boga będzie z nami; i utwierdź wśród nas dzieło naszych rąk; utwierdź dzieło naszych rąk!"
  tags: []
