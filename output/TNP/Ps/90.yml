"Ps90,1": "PANIE, Ty byłeś dla nas schronieniem z pokolenia w pokolenie."
"Ps90,2": "Zanim zostały zrodzone góry, zanim ukształtowałeś ziemię i świat, od wieków na wieki Ty jesteś Bogiem."
"Ps90,3": "Ty obracasz człowieka w proch i mówisz: Wracajcie, synowie ludzcy."
"Ps90,4": "Tysiąc lat bowiem w Twoich oczach jest jak dzień wczorajszy, który minął, i jak straż nocna."
"Ps90,5": "Porywasz ich jak nurt powodzi, są jak sen i jak trawa, która przemija."
"Ps90,6": "Rano rozkwita i rośnie, a wieczorem zostaje skoszona i usycha."
"Ps90,7": "Giniemy bowiem od Twojego gniewu i przeraża nas Twoja zapalczywość."
"Ps90,8": "Postawiłeś przed sobą nasze nieprawości, nasze ukryte grzechy w świetle Twojego oblicza."
"Ps90,9": "Wszystkie nasze dni gasną z powodu Twojego wzburzenia, nasze lata dobiegają kresu jak westchnienie."
"Ps90,10": "Dni lat naszych w nas samych jest siedemdziesiąt lat, a jeśli sił starczy, lat osiemdziesiąt, a ich chlubą to tylko trud i smutek, bo szybko mijają, a my odlatujemy."
"Ps90,11": "Kto zna potęgę Twojego gniewu? A ogarnięty bojaźnią przed Tobą, Twoje wzburzenie?"
"Ps90,12": "Dlatego też naucz nas liczyć nasze dni, aby serce nasze zostało przyprowadzone do mądrości."
"Ps90,13": "Powróć, JHWH. Jak długo jeszcze? Zlituj się nad swoimi sługami."
"Ps90,14": "Zaspokój nas o poranku Twoim miłosierdziem, abyśmy mogli wykrzykiwać z radości i cieszyć się przez wszystkie nasze dni."
"Ps90,15": "Spraw nam radość odpowiednio do dni, w których nas upokorzyłeś; odpowiednio do lat, w których oglądaliśmy zło."
"Ps90,16": "Niech się ukaże Twoim sługom Twoje dzieło, a Twoja chwała ich synom."
"Ps90,17": "Niech dobroć JHWH, naszego Boga będzie z nami; i utwierdź wśród nas dzieło naszych rąk; utwierdź dzieło naszych rąk!"
