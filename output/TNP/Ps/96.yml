"Ps96,1": "Śpiewajcie JHWH nową pieśń, śpiewaj JHWH cała ziemio!"
"Ps96,2": "Śpiewajcie JHWH, błogosławcie Jego imię, opowiadajcie o Jego zbawieniu dzień po dniu."
"Ps96,3": "Ogłaszajcie wśród narodów Jego chwałę, wśród wszystkich ludów Jego cuda."
"Ps96,4": "Wielki bowiem jest JHWH i wychwalany. On jest budzącym lęk bardziej niż wszyscy bogowie."
"Ps96,5": "Gdyż wszyscy bogowie narodów są bezwartościowi, a JHWH uczynił niebiosa."
"Ps96,6": "Cześć i majestat przed Jego obliczem, potęga i piękno w Jego świątyni."
"Ps96,7": "Oddajcie JHWH rodziny narodów, oddajcie JHWH chwałę i moc."
"Ps96,8": "Oddajcie JHWH chwałę Jego imieniu, przynieście dary i wejdźcie do Jego przedsionków."
"Ps96,9": "Oddajcie JHWH pokłon w ozdobie świętości, niech cała ziemia drży przed Jego obliczem."
"Ps96,10": "Powiedzcie wśród narodów: JHWH króluje; prawdziwie świat zostanie utwierdzony, aby nie został poruszony, i On będzie sądził ludzi sprawiedliwie."
"Ps96,11": "Niech się weselą niebiosa i niech się raduje ziemia; niech zaszumi morze i to, co je wypełnia."
"Ps96,12": "Niech radują się pola i wszystko, co jest na nich, wtedy radośnie wykrzykną wszystkie drzewa leśne –"
"Ps96,13": "Przed obliczem JHWH, bo idzie, bo idzie, aby sądzić ziemię. Będzie sądził świat w sprawiedliwości, a narody w swojej prawdzie."
