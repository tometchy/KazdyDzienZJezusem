"Ps96,1":
  text: "Śpiewajcie JHWH nową pieśń, śpiewaj JHWH cała ziemio!"
  tags: []
"Ps96,2":
  text: "Śpiewajcie JHWH, błogosławcie Jego imię, opowiadajcie o Jego zbawieniu dzień po dniu."
  tags: []
"Ps96,3":
  text: "Ogłaszajcie wśród narodów Jego chwałę, wśród wszystkich ludów Jego cuda."
  tags: []
"Ps96,4":
  text: "Wielki bowiem jest JHWH i wychwalany. On jest budzącym lęk bardziej niż wszyscy bogowie."
  tags: []
"Ps96,5":
  text: "Gdyż wszyscy bogowie narodów są bezwartościowi, a JHWH uczynił niebiosa."
  tags: []
"Ps96,6":
  text: "Cześć i majestat przed Jego obliczem, potęga i piękno w Jego świątyni."
  tags: []
"Ps96,7":
  text: "Oddajcie JHWH rodziny narodów, oddajcie JHWH chwałę i moc."
  tags: []
"Ps96,8":
  text: "Oddajcie JHWH chwałę Jego imieniu, przynieście dary i wejdźcie do Jego przedsionków."
  tags: []
"Ps96,9":
  text: "Oddajcie JHWH pokłon w ozdobie świętości, niech cała ziemia drży przed Jego obliczem."
  tags: []
"Ps96,10":
  text: "Powiedzcie wśród narodów: JHWH króluje; prawdziwie świat zostanie utwierdzony, aby nie został poruszony, i On będzie sądził ludzi sprawiedliwie."
  tags: []
"Ps96,11":
  text: "Niech się weselą niebiosa i niech się raduje ziemia; niech zaszumi morze i to, co je wypełnia."
  tags: []
"Ps96,12":
  text: "Niech radują się pola i wszystko, co jest na nich, wtedy radośnie wykrzykną wszystkie drzewa leśne –"
  tags: []
"Ps96,13":
  text: "Przed obliczem JHWH, bo idzie, bo idzie, aby sądzić ziemię. Będzie sądził świat w sprawiedliwości, a narody w swojej prawdzie."
  tags: []
