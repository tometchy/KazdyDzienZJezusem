"Ps28,1": "Dawidowy. Psalm. Do Ciebie wołam, JHWH, Skało moja; nie milcz przede mną, abym, jeśli będziesz milczał, nie stał się podobny do zstępujących do dołu."
"Ps28,2": "Usłysz głos mojego błagania, gdy wołam do Ciebie, gdy podnoszę moje ręce ku Twojemu miejscu najświętszemu."
"Ps28,3": "Nie pochwyć mnie z niegodziwymi i z czyniącymi nieprawość, którzy mówią o pokoju z bliźnimi, a zło jest w ich sercach."
"Ps28,4": "Odpłać im zgodnie z ich czynami, i zgodnie ze złem ich poczynań; zgodnie z czynem ich rąk odpłać im, oddaj im to, co im się należy."
"Ps28,5": "Skoro nie zważają na czyny JHWH ani na dzieła Jego rąk, On zburzy ich i nie odbuduje."
"Ps28,6": "Błogosławiony niech będzie JHWH, bo wysłuchał głosu mojego błagania."
"Ps28,7": "JHWH jest moją siłą i tarczą, moje serce w Nim położyło ufność i otrzymałem pomoc; dlatego moje serce się rozweseliło i moją pieśnią będę Go chwalił."
"Ps28,8": "JHWH jest siłą dla nas i twierdzą zbawienia Jego pomazańca."
"Ps28,9": "Wybaw Twój lud, błogosław Twojemu dziedzictwu, paś ich i nieś ich aż do wieczności."
