"Ps28,1":
  text: "Dawidowy. Psalm. Do Ciebie wołam, JHWH, Skało moja; nie milcz przede mną, abym, jeśli będziesz milczał, nie stał się podobny do zstępujących do dołu."
  tags: []
"Ps28,2":
  text: "Usłysz głos mojego błagania, gdy wołam do Ciebie, gdy podnoszę moje ręce ku Twojemu miejscu najświętszemu."
  tags: []
"Ps28,3":
  text: "Nie pochwyć mnie z niegodziwymi i z czyniącymi nieprawość, którzy mówią o pokoju z bliźnimi, a zło jest w ich sercach."
  tags: []
"Ps28,4":
  text: "Odpłać im zgodnie z ich czynami, i zgodnie ze złem ich poczynań; zgodnie z czynem ich rąk odpłać im, oddaj im to, co im się należy."
  tags: []
"Ps28,5":
  text: "Skoro nie zważają na czyny JHWH ani na dzieła Jego rąk, On zburzy ich i nie odbuduje."
  tags: []
"Ps28,6":
  text: "Błogosławiony niech będzie JHWH, bo wysłuchał głosu mojego błagania."
  tags: []
"Ps28,7":
  text: "JHWH jest moją siłą i tarczą, moje serce w Nim położyło ufność i otrzymałem pomoc; dlatego moje serce się rozweseliło i moją pieśnią będę Go chwalił."
  tags: []
"Ps28,8":
  text: "JHWH jest siłą dla nas i twierdzą zbawienia Jego pomazańca."
  tags: []
"Ps28,9":
  text: "Wybaw Twój lud, błogosław Twojemu dziedzictwu, paś ich i nieś ich aż do wieczności."
  tags: []
