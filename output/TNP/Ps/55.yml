"Ps55,1":
  text: "Boże, nakłoń ucha ku mojej modlitwie i nie ukrywaj się przed moją prośbą."
  tags: []
"Ps55,2":
  text: "Zwróć na mnie uwagę i wysłuchaj mnie; miotam się w swoim zmartwieniu i nie dożywam spokoju;"
  tags: []
"Ps55,3":
  text: "Z powodu głosu wroga, z powodu ucisku niegodziwego zwalają na mnie nieprawość i w gniewie mi się sprzeciwiają."
  tags: []
"Ps55,4":
  text: "Moje serce wije się z bólu i w moim wnętrzu ogarnęły mnie lęki przed śmiercią."
  tags: []
"Ps55,5":
  text: "Bojaźń i drżenie wkroczyły we mnie i ogarnęło mnie przerażenie."
  tags: []
"Ps55,6":
  text: "I powiedziałem: Och, kto da mi skrzydła jak u gołębicy, wtedy bym uleciał i spoczął."
  tags: []
"Ps55,7":
  text: "Oto bym uciekł daleko i pozostał na pustyni. Sela."
  tags: []
"Ps55,8":
  text: "Pośpiesznie znalazłbym sobie miejsce ucieczki przed porywistym wiatrem i huraganem."
  tags: []
"Ps55,9":
  text: "Pochłoń ich PANIE, podziel ich języki, bo widzę przemoc i niezgodę w mieście."
  tags: []
"Ps55,10":
  text: "Dniem i nocą krążą wokoło po jego murach, a wewnątrz niego zło i ucisk."
  tags: []
"Ps55,11":
  text: "Wewnątrz niego jest zepsucie, a z jego ulic nie znika oszustwo i podstęp."
  tags: []
"Ps55,12":
  text: "Bo to nie wróg mi urąga – to zniósłbym; nie wywyższa się przeciwko mnie ten, który mnie nienawidzi – ukryłbym się przed nim;"
  tags: []
"Ps55,13":
  text: "Ale ty, człowiek mi równy, mój przyjaciel, który mnie zna."
  tags: []
"Ps55,14":
  text: "Z którym przyjaźnie naradzaliśmy się i w tłumie chodziliśmy do domu Bożego."
  tags: []
"Ps55,15":
  text: "Niech śmierć ich spustoszy, oby żywi zstąpili do Szeolu, bo w ich siedzibach i pośród nich mieszka zło."
  tags: []
"Ps55,16":
  text: "Ja natomiast zawołam do Boga i JHWH mnie wybawi."
  tags: []
"Ps55,17":
  text: "Wieczorem, rano i w południe będę skarżyć się i głośno wołać, a On wysłucha mojego głosu."
  tags: []
"Ps55,18":
  text: "On odkupił moją duszę w pokoju od walki przeciwko mnie, ponieważ bardzo licznie przeciwko mnie wystąpili."
  tags: []
"Ps55,19":
  text: "Bóg usłyszy i poniży ich, Ten, który trwa od początku. Sela. Bo nie ma w nich zmiany i nie boją się Boga."
  tags: []
"Ps55,20":
  text: "Podniósł swoją rękę na swój pokój; zbezcześcił swoje przymierze."
  tags: []
"Ps55,21":
  text: "Gładsze niż masło były słowa jego ust, lecz w sercu miał walkę; miększe niż oliwa jego słowa, ale one są jak obnażone miecze."
  tags: []
"Ps55,22":
  text: "Zrzuć swoje brzemię na JHWH, a On cię podtrzyma; nie dopuści by sprawiedliwy zachwiał się na wieki."
  tags: []
"Ps55,23":
  text: "Ale Ty, Boże, wtrącisz ich w dół zatracenia; ludzie żądni krwi i podstępni nie dożyją połowy swoich dni; ja natomiast zaufam Tobie."
  tags: []
