"Ps55,1": "Boże, nakłoń ucha ku mojej modlitwie i nie ukrywaj się przed moją prośbą."
"Ps55,2": "Zwróć na mnie uwagę i wysłuchaj mnie; miotam się w swoim zmartwieniu i nie dożywam spokoju;"
"Ps55,3": "Z powodu głosu wroga, z powodu ucisku niegodziwego zwalają na mnie nieprawość i w gniewie mi się sprzeciwiają."
"Ps55,4": "Moje serce wije się z bólu i w moim wnętrzu ogarnęły mnie lęki przed śmiercią."
"Ps55,5": "Bojaźń i drżenie wkroczyły we mnie i ogarnęło mnie przerażenie."
"Ps55,6": "I powiedziałem: Och, kto da mi skrzydła jak u gołębicy, wtedy bym uleciał i spoczął."
"Ps55,7": "Oto bym uciekł daleko i pozostał na pustyni. Sela."
"Ps55,8": "Pośpiesznie znalazłbym sobie miejsce ucieczki przed porywistym wiatrem i huraganem."
"Ps55,9": "Pochłoń ich PANIE, podziel ich języki, bo widzę przemoc i niezgodę w mieście."
"Ps55,10": "Dniem i nocą krążą wokoło po jego murach, a wewnątrz niego zło i ucisk."
"Ps55,11": "Wewnątrz niego jest zepsucie, a z jego ulic nie znika oszustwo i podstęp."
"Ps55,12": "Bo to nie wróg mi urąga – to zniósłbym; nie wywyższa się przeciwko mnie ten, który mnie nienawidzi – ukryłbym się przed nim;"
"Ps55,13": "Ale ty, człowiek mi równy, mój przyjaciel, który mnie zna."
"Ps55,14": "Z którym przyjaźnie naradzaliśmy się i w tłumie chodziliśmy do domu Bożego."
"Ps55,15": "Niech śmierć ich spustoszy, oby żywi zstąpili do Szeolu, bo w ich siedzibach i pośród nich mieszka zło."
"Ps55,16": "Ja natomiast zawołam do Boga i JHWH mnie wybawi."
"Ps55,17": "Wieczorem, rano i w południe będę skarżyć się i głośno wołać, a On wysłucha mojego głosu."
"Ps55,18": "On odkupił moją duszę w pokoju od walki przeciwko mnie, ponieważ bardzo licznie przeciwko mnie wystąpili."
"Ps55,19": "Bóg usłyszy i poniży ich, Ten, który trwa od początku. Sela. Bo nie ma w nich zmiany i nie boją się Boga."
"Ps55,20": "Podniósł swoją rękę na swój pokój; zbezcześcił swoje przymierze."
"Ps55,21": "Gładsze niż masło były słowa jego ust, lecz w sercu miał walkę; miększe niż oliwa jego słowa, ale one są jak obnażone miecze."
"Ps55,22": "Zrzuć swoje brzemię na JHWH, a On cię podtrzyma; nie dopuści by sprawiedliwy zachwiał się na wieki."
"Ps55,23": "Ale Ty, Boże, wtrącisz ich w dół zatracenia; ludzie żądni krwi i podstępni nie dożyją połowy swoich dni; ja natomiast zaufam Tobie."
