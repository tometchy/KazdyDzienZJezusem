"Ps115,1":
  text: "Nie nam, JHWH, nie nam, ale imieniu swojemu daj chwałę, ze względu na Twoją łaskę, ze względu na Twoją wierność!"
  tags: []
"Ps115,2":
  text: "Dlaczego mają mówić narody: Gdzie więc jest ich Bóg?"
  tags: []
"Ps115,3":
  text: "Ale Bóg nasz jest w niebiosach, czyni wszystko, to czego pragnie."
  tags: []
"Ps115,4":
  text: "Ich bożki to srebro i złoto, dzieło rąk ludzkich."
  tags: []
"Ps115,5":
  text: "Mają usta, ale nie mówią; mają oczy, ale nie widzą."
  tags: []
"Ps115,6":
  text: "Mają uszy, ale nie słyszą; mają nosy, ale nie wąchają."
  tags: []
"Ps115,7":
  text: "Mają ręce, ale nie dotykają; mają nogi, ale nie chodzą; ani gardłem swoim nie wydają głosu."
  tags: []
"Ps115,8":
  text: "Tacy jak one niech się staną ci, którzy je wykonują i wszyscy, którzy w nich pokładają ufność!"
  tags: []
"Ps115,9":
  text: "Izraelu, ufaj JHWH; On jest waszą pomocą i waszą tarczą."
  tags: []
"Ps115,10":
  text: "Domu Aarona, ufaj JHWH; On jest waszą pomocą i waszą tarczą."
  tags: []
"Ps115,11":
  text: "Wy, którzy się boicie JHWH, ufajcie JHWH; On jest waszą pomocą i waszą tarczą."
  tags: []
"Ps115,12":
  text: "JHWH pamięta o nas, będzie błogosławił; będzie błogosławił domowi Izraela, będzie błogosławił domowi Aarona."
  tags: []
"Ps115,13":
  text: "Będzie błogosławił tym, którzy boją się JHWH, małym oraz wielkim."
  tags: []
"Ps115,14":
  text: "Niech rozmnoży was JHWH, was i waszych synów."
  tags: []
"Ps115,15":
  text: "Wy zostaliście pobłogosławieni przez JHWH, który dogląda niebiosa i ziemię."
  tags: []
"Ps115,16":
  text: "Niebiosa są niebiosami JHWH, ale ziemię dał synom ludzkim."
  tags: []
"Ps115,17":
  text: "To nie umarli będą chwalili JH[WH] ani nikt z tych, którzy zstępują do krainy milczenia."
  tags: []
"Ps115,18":
  text: "Ale my będziemy błogosławili JHWH, teraz i na wieki. Chwalcie JH[WH]."
  tags: []
