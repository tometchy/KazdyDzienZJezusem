"Ps115,1": "Nie nam, JHWH, nie nam, ale imieniu swojemu daj chwałę, ze względu na Twoją łaskę, ze względu na Twoją wierność!"
"Ps115,2": "Dlaczego mają mówić narody: Gdzie więc jest ich Bóg?"
"Ps115,3": "Ale Bóg nasz jest w niebiosach, czyni wszystko, to czego pragnie."
"Ps115,4": "Ich bożki to srebro i złoto, dzieło rąk ludzkich."
"Ps115,5": "Mają usta, ale nie mówią; mają oczy, ale nie widzą."
"Ps115,6": "Mają uszy, ale nie słyszą; mają nosy, ale nie wąchają."
"Ps115,7": "Mają ręce, ale nie dotykają; mają nogi, ale nie chodzą; ani gardłem swoim nie wydają głosu."
"Ps115,8": "Tacy jak one niech się staną ci, którzy je wykonują i wszyscy, którzy w nich pokładają ufność!"
"Ps115,9": "Izraelu, ufaj JHWH; On jest waszą pomocą i waszą tarczą."
"Ps115,10": "Domu Aarona, ufaj JHWH; On jest waszą pomocą i waszą tarczą."
"Ps115,11": "Wy, którzy się boicie JHWH, ufajcie JHWH; On jest waszą pomocą i waszą tarczą."
"Ps115,12": "JHWH pamięta o nas, będzie błogosławił; będzie błogosławił domowi Izraela, będzie błogosławił domowi Aarona."
"Ps115,13": "Będzie błogosławił tym, którzy boją się JHWH, małym oraz wielkim."
"Ps115,14": "Niech rozmnoży was JHWH, was i waszych synów."
"Ps115,15": "Wy zostaliście pobłogosławieni przez JHWH, który dogląda niebiosa i ziemię."
"Ps115,16": "Niebiosa są niebiosami JHWH, ale ziemię dał synom ludzkim."
"Ps115,17": "To nie umarli będą chwalili JH[WH] ani nikt z tych, którzy zstępują do krainy milczenia."
"Ps115,18": "Ale my będziemy błogosławili JHWH, teraz i na wieki. Chwalcie JH[WH]."
