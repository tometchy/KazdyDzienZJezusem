"Ps106,1": "Chwalcie JH[WH]. Wysławiajcie JHWH, albowiem jest dobry, albowiem miłosierdzie Jego trwa na wieki!"
"Ps106,2": "Kto wysłowi potęgę JHWH i ogłosi całą Jego chwałę?"
"Ps106,3": "Błogosławieni, którzy strzegą sądu i czynią sprawiedliwość w każdym czasie."
"Ps106,4": "Pamiętaj o mnie, JHWH, przez życzliwość do swojego ludu; nawiedź mnie swoim zbawieniem;"
"Ps106,5": "Abym widział szczęście Twoich wybranych, radował się radością Twojego narodu i chlubił się razem z Twoim dziedzictwem."
"Ps106,6": "Zgrzeszyliśmy wraz z naszymi ojcami, postępowaliśmy przewrotnie i czyniliśmy niegodziwość."
"Ps106,7": "Nasi ojcowie w Egipcie nie zrozumieli Twoich cudów, nie pamiętali ogromu Twoich łask, lecz buntowali się nad morzem – Morzem Czerwonym."
"Ps106,8": "A jednak ich wybawił ze względu na swoje imię, aby okazać swoją potęgę."
"Ps106,9": "Zgromił Morze Czerwone i wyschło; i przeprowadził ich przez głębiny jak przez pustynię."
"Ps106,10": "Tak wybawił ich z ręki tego, który ich nienawidził i odkupił ich z ręki wroga."
"Ps106,11": "Wody zakryły ich nieprzyjaciół, nie pozostał ani jeden z nich."
"Ps106,12": "Wtedy uwierzyli Jego słowom i śpiewali na Jego chwałę."
"Ps106,13": "Szybko jednak zapomnieli o Jego dziełach, nie czekali na Jego radę."
"Ps106,14": "Pałali żądzą na pustyni, na próbę wystawiali Boga na pustkowiu."
"Ps106,15": "I dał im, czego żądali, lecz zesłał na ich dusze wycieńczenie."
"Ps106,16": "Potem zazdrościli Mojżeszowi w obozie i Aaronowi, świętemu JHWH;"
"Ps106,17": "Otworzyła się ziemia i pochłonęła Datana, i zakryła zgromadzenie Abirama;"
"Ps106,18": "I zapłonął ogień przeciwko ich zgromadzeniu, płomień spalił niegodziwych."
"Ps106,19": "Zrobili cielca na Horebie i odlanemu posągowi oddali pokłon;"
"Ps106,20": "I zamienili swoją chwałę na obraz wołu jedzącego trawę."
"Ps106,21": "Zapomnieli o Bogu, swoim wybawcy, który dokonywał wielkich dzieł w Egipcie;"
"Ps106,22": "Cudownych dzieł w ziemi Chama, rzeczy budzących lęk nad Morzem Czerwonym."
"Ps106,23": "Dlatego powiedział, że ich wygubi, gdyby nie Mojżesz, Jego wybrany, który stanął w wyłomie przed Jego obliczem, aby odwrócić Jego gniew i zamiar ich zniszczenia."
"Ps106,24": "Wzgardzili też wspaniałą ziemią, nie wierząc Jego słowu."
"Ps106,25": "I szemrząc w swoich namiotach, nie byli posłuszni głosowi JHWH."
"Ps106,26": "Dlatego podniósł na nich swoją rękę, aby ich doprowadzić do upadku na pustyni;"
"Ps106,27": "Aby ich potomstwo upadło wśród narodów i aby rozproszyć ich po różnych ziemiach."
"Ps106,28": "Przyłączyli się też do Baal-Peora i jedli ofiary składane zmarłym."
"Ps106,29": "I pobudzili Go do gniewu swoimi czynami, tak że wybuchła wśród nich plaga;"
"Ps106,30": "Wtedy powstał Pinechas, dokonał sądu i plaga została powstrzymana."
"Ps106,31": "I zostało mu to policzone za sprawiedliwość z pokolenia w pokolenie, na wieki."
"Ps106,32": "Rozgniewali Go ponownie u wód Meriba, tak że Mojżesz był pełen obaw z tego powodu;"
"Ps106,33": "Okazali bowiem nieposłuszeństwo Jego Duchowi, tak że mówił on nierozważnie swoimi ustami."
"Ps106,34": "Nie wytępili narodów, jak im to JHWH nakazał."
"Ps106,35": "Lecz zmieszali się z tymi narodami i nauczyli się ich czynów;"
"Ps106,36": "I służyli ich bożkom, które stały się dla nich pułapką."
"Ps106,37": "Ofiarowali bowiem demonom swoich synów i swoje córki;"
"Ps106,38": "I wylali krew niewinną, krew swoich synów i córek, którą ofiarowali bożkom Kanaanu; i ziemia została zanieczyszczona krwią."
"Ps106,39": "Zanieczyścili się swoimi czynami i cudzołożyli swoimi postępkami."
"Ps106,40": "I rozpalił się gniew JHWH na Jego lud, obrzydło Mu Jego dziedzictwo."
"Ps106,41": "I wydał ich w rękę narodów, i panowali nad nimi ci, którzy ich nienawidzą."
"Ps106,42": "I uciskali ich wrogowie, upokarzali ich pod swoją ręką."
"Ps106,43": "Wiele razy ich wybawiał, lecz oni buntowali się w swoich planach i zostali upokorzeni przez swoje nieprawości."
"Ps106,44": "Lecz wejrzał na ich ucisk, gdy usłyszał ich błaganie."
"Ps106,45": "Wspomniał ze względu na nich na swoje przymierze z nimi i zlitował się nad nimi według wielkiej łaski Jego."
"Ps106,46": "I sprawiał, że mieli litość dla nich, wszyscy, którzy uprowadzili ich w niewolę."
"Ps106,47": "Wybaw nas, JHWH, nasz Boże, i zgromadź nas spośród narodów, abyśmy wysławiali Twoje święte imię i szczycili się Twoją chwałą."
"Ps106,48": "Błogosławiony JHWH, Bóg Izraela, od wieków na wieki; niech cały lud powie: Amen. Chwalcie JH[WH]."
