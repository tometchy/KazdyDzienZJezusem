"Ps106,1":
  text: "Chwalcie JH[WH]. Wysławiajcie JHWH, albowiem jest dobry, albowiem miłosierdzie Jego trwa na wieki!"
  tags: []
"Ps106,2":
  text: "Kto wysłowi potęgę JHWH i ogłosi całą Jego chwałę?"
  tags: []
"Ps106,3":
  text: "Błogosławieni, którzy strzegą sądu i czynią sprawiedliwość w każdym czasie."
  tags: []
"Ps106,4":
  text: "Pamiętaj o mnie, JHWH, przez życzliwość do swojego ludu; nawiedź mnie swoim zbawieniem;"
  tags: []
"Ps106,5":
  text: "Abym widział szczęście Twoich wybranych, radował się radością Twojego narodu i chlubił się razem z Twoim dziedzictwem."
  tags: []
"Ps106,6":
  text: "Zgrzeszyliśmy wraz z naszymi ojcami, postępowaliśmy przewrotnie i czyniliśmy niegodziwość."
  tags: []
"Ps106,7":
  text: "Nasi ojcowie w Egipcie nie zrozumieli Twoich cudów, nie pamiętali ogromu Twoich łask, lecz buntowali się nad morzem – Morzem Czerwonym."
  tags: []
"Ps106,8":
  text: "A jednak ich wybawił ze względu na swoje imię, aby okazać swoją potęgę."
  tags: []
"Ps106,9":
  text: "Zgromił Morze Czerwone i wyschło; i przeprowadził ich przez głębiny jak przez pustynię."
  tags: []
"Ps106,10":
  text: "Tak wybawił ich z ręki tego, który ich nienawidził i odkupił ich z ręki wroga."
  tags: []
"Ps106,11":
  text: "Wody zakryły ich nieprzyjaciół, nie pozostał ani jeden z nich."
  tags: []
"Ps106,12":
  text: "Wtedy uwierzyli Jego słowom i śpiewali na Jego chwałę."
  tags: []
"Ps106,13":
  text: "Szybko jednak zapomnieli o Jego dziełach, nie czekali na Jego radę."
  tags: []
"Ps106,14":
  text: "Pałali żądzą na pustyni, na próbę wystawiali Boga na pustkowiu."
  tags: []
"Ps106,15":
  text: "I dał im, czego żądali, lecz zesłał na ich dusze wycieńczenie."
  tags: []
"Ps106,16":
  text: "Potem zazdrościli Mojżeszowi w obozie i Aaronowi, świętemu JHWH;"
  tags: []
"Ps106,17":
  text: "Otworzyła się ziemia i pochłonęła Datana, i zakryła zgromadzenie Abirama;"
  tags: []
"Ps106,18":
  text: "I zapłonął ogień przeciwko ich zgromadzeniu, płomień spalił niegodziwych."
  tags: []
"Ps106,19":
  text: "Zrobili cielca na Horebie i odlanemu posągowi oddali pokłon;"
  tags: []
"Ps106,20":
  text: "I zamienili swoją chwałę na obraz wołu jedzącego trawę."
  tags: []
"Ps106,21":
  text: "Zapomnieli o Bogu, swoim wybawcy, który dokonywał wielkich dzieł w Egipcie;"
  tags: []
"Ps106,22":
  text: "Cudownych dzieł w ziemi Chama, rzeczy budzących lęk nad Morzem Czerwonym."
  tags: []
"Ps106,23":
  text: "Dlatego powiedział, że ich wygubi, gdyby nie Mojżesz, Jego wybrany, który stanął w wyłomie przed Jego obliczem, aby odwrócić Jego gniew i zamiar ich zniszczenia."
  tags: []
"Ps106,24":
  text: "Wzgardzili też wspaniałą ziemią, nie wierząc Jego słowu."
  tags: []
"Ps106,25":
  text: "I szemrząc w swoich namiotach, nie byli posłuszni głosowi JHWH."
  tags: []
"Ps106,26":
  text: "Dlatego podniósł na nich swoją rękę, aby ich doprowadzić do upadku na pustyni;"
  tags: []
"Ps106,27":
  text: "Aby ich potomstwo upadło wśród narodów i aby rozproszyć ich po różnych ziemiach."
  tags: []
"Ps106,28":
  text: "Przyłączyli się też do Baal-Peora i jedli ofiary składane zmarłym."
  tags: []
"Ps106,29":
  text: "I pobudzili Go do gniewu swoimi czynami, tak że wybuchła wśród nich plaga;"
  tags: []
"Ps106,30":
  text: "Wtedy powstał Pinechas, dokonał sądu i plaga została powstrzymana."
  tags: []
"Ps106,31":
  text: "I zostało mu to policzone za sprawiedliwość z pokolenia w pokolenie, na wieki."
  tags: []
"Ps106,32":
  text: "Rozgniewali Go ponownie u wód Meriba, tak że Mojżesz był pełen obaw z tego powodu;"
  tags: []
"Ps106,33":
  text: "Okazali bowiem nieposłuszeństwo Jego Duchowi, tak że mówił on nierozważnie swoimi ustami."
  tags: []
"Ps106,34":
  text: "Nie wytępili narodów, jak im to JHWH nakazał."
  tags: []
"Ps106,35":
  text: "Lecz zmieszali się z tymi narodami i nauczyli się ich czynów;"
  tags: []
"Ps106,36":
  text: "I służyli ich bożkom, które stały się dla nich pułapką."
  tags: []
"Ps106,37":
  text: "Ofiarowali bowiem demonom swoich synów i swoje córki;"
  tags: []
"Ps106,38":
  text: "I wylali krew niewinną, krew swoich synów i córek, którą ofiarowali bożkom Kanaanu; i ziemia została zanieczyszczona krwią."
  tags: []
"Ps106,39":
  text: "Zanieczyścili się swoimi czynami i cudzołożyli swoimi postępkami."
  tags: []
"Ps106,40":
  text: "I rozpalił się gniew JHWH na Jego lud, obrzydło Mu Jego dziedzictwo."
  tags: []
"Ps106,41":
  text: "I wydał ich w rękę narodów, i panowali nad nimi ci, którzy ich nienawidzą."
  tags: []
"Ps106,42":
  text: "I uciskali ich wrogowie, upokarzali ich pod swoją ręką."
  tags: []
"Ps106,43":
  text: "Wiele razy ich wybawiał, lecz oni buntowali się w swoich planach i zostali upokorzeni przez swoje nieprawości."
  tags: []
"Ps106,44":
  text: "Lecz wejrzał na ich ucisk, gdy usłyszał ich błaganie."
  tags: []
"Ps106,45":
  text: "Wspomniał ze względu na nich na swoje przymierze z nimi i zlitował się nad nimi według wielkiej łaski Jego."
  tags: []
"Ps106,46":
  text: "I sprawiał, że mieli litość dla nich, wszyscy, którzy uprowadzili ich w niewolę."
  tags: []
"Ps106,47":
  text: "Wybaw nas, JHWH, nasz Boże, i zgromadź nas spośród narodów, abyśmy wysławiali Twoje święte imię i szczycili się Twoją chwałą."
  tags: []
"Ps106,48":
  text: "Błogosławiony JHWH, Bóg Izraela, od wieków na wieki; niech cały lud powie: Amen. Chwalcie JH[WH]."
  tags: []
