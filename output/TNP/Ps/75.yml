"Ps75,1": "Wysławiamy Ciebie, Boże, wysławiamy, bo bliskie jest Twoje imię; opowiadają to Twoje cudowne dzieła."
"Ps75,2": "Gdy wybiorę odpowiedni czas, ja będę sądzić sprawiedliwie."
"Ps75,3": "Roztopiła się ziemia i wszyscy ją zamieszkujący, ale ja umacniam jej filary. Sela."
"Ps75,4": "Powiedziałem szalejącym: Nie szalejcie, a niegodziwym: Nie podnoście rogu."
"Ps75,5": "Nie podnoście wysoko swojego rogu i nie mówcie z nieugiętym karkiem;"
"Ps75,6": "Bo nie ze wschodu ani z zachodu, ani z pustyni przychodzi wywyższenie."
"Ps75,7": "Lecz Bóg jest tym, który sądzi; tego poniży, a tamtego wywyższy."
"Ps75,8": "Bo w ręku JHWH jest kielich pieniącego wina, pełnego przypraw; z niego nalewa tak, że wszyscy niegodziwi ziemi wypiją nawet osad."
"Ps75,9": "Ja natomiast będę zawsze ogłaszał, będę śpiewał Bogu Jakuba."
"Ps75,10": "I odetnę wszystkie rogi niegodziwych, a rogi sprawiedliwego będą wywyższone."
