"Ps75,1":
  text: "Wysławiamy Ciebie, Boże, wysławiamy, bo bliskie jest Twoje imię; opowiadają to Twoje cudowne dzieła."
  tags: []
"Ps75,2":
  text: "Gdy wybiorę odpowiedni czas, ja będę sądzić sprawiedliwie."
  tags: []
"Ps75,3":
  text: "Roztopiła się ziemia i wszyscy ją zamieszkujący, ale ja umacniam jej filary. Sela."
  tags: []
"Ps75,4":
  text: "Powiedziałem szalejącym: Nie szalejcie, a niegodziwym: Nie podnoście rogu."
  tags: []
"Ps75,5":
  text: "Nie podnoście wysoko swojego rogu i nie mówcie z nieugiętym karkiem;"
  tags: []
"Ps75,6":
  text: "Bo nie ze wschodu ani z zachodu, ani z pustyni przychodzi wywyższenie."
  tags: []
"Ps75,7":
  text: "Lecz Bóg jest tym, który sądzi; tego poniży, a tamtego wywyższy."
  tags: []
"Ps75,8":
  text: "Bo w ręku JHWH jest kielich pieniącego wina, pełnego przypraw; z niego nalewa tak, że wszyscy niegodziwi ziemi wypiją nawet osad."
  tags: []
"Ps75,9":
  text: "Ja natomiast będę zawsze ogłaszał, będę śpiewał Bogu Jakuba."
  tags: []
"Ps75,10":
  text: "I odetnę wszystkie rogi niegodziwych, a rogi sprawiedliwego będą wywyższone."
  tags: []
