"Ps36,1":
  text: "Oświadczenie: Przestępstwo bezbożnego mówi w głębi mojego serca: Nie ma bojaźni Bożej przed jego oczyma."
  tags: []
"Ps36,2":
  text: "Schlebia sobie bowiem w swoich oczach, by szukać swej nieprawości i nienawidzić."
  tags: []
"Ps36,3":
  text: "Słowa jego ust to niegodziwość i podstęp, zaniechał roztropności i czynienia dobra."
  tags: []
"Ps36,4":
  text: "Na swoim posłaniu obmyśla nieprawość, postawił się na niedobrej drodze i nie wzgardzi złem."
  tags: []
"Ps36,5":
  text: "JHWH, Twoje miłosierdzie sięga niebios, Twoja wierność aż do obłoków."
  tags: []
"Ps36,6":
  text: "Twoja sprawiedliwość jak potężne góry, Twoje orzeczenia jak wielka głębia; Ty, JHWH, wybawiasz ludzi i zwierzęta!"
  tags: []
"Ps36,7":
  text: "Jak cenne jest Twoje miłosierdzie, Boże! Dlatego synowie ludzcy chronią się w cieniu Twoich skrzydeł."
  tags: []
"Ps36,8":
  text: "Nasycą się tłustością Twojego domu, napoisz ich strumieniem Twoich rozkoszy."
  tags: []
"Ps36,9":
  text: "Ponieważ u Ciebie jest źródło życia, w Twojej światłości ujrzymy światłość."
  tags: []
"Ps36,10":
  text: "Roztocz swoje miłosierdzie nad tymi, którzy Ciebie znają, a Twoją sprawiedliwość nad ludźmi prawego serca."
  tags: []
"Ps36,11":
  text: "Niech nie zdepcze mnie stopa pysznego, niech mnie nie wygania ręka niegodziwego."
  tags: []
"Ps36,12":
  text: "Tam upadli, czyniący nieprawość zostali powaleni i nie będą zdolni powstać."
  tags: []
