"Ps36,1": "Oświadczenie: Przestępstwo bezbożnego mówi w głębi mojego serca: Nie ma bojaźni Bożej przed jego oczyma."
"Ps36,2": "Schlebia sobie bowiem w swoich oczach, by szukać swej nieprawości i nienawidzić."
"Ps36,3": "Słowa jego ust to niegodziwość i podstęp, zaniechał roztropności i czynienia dobra."
"Ps36,4": "Na swoim posłaniu obmyśla nieprawość, postawił się na niedobrej drodze i nie wzgardzi złem."
"Ps36,5": "JHWH, Twoje miłosierdzie sięga niebios, Twoja wierność aż do obłoków."
"Ps36,6": "Twoja sprawiedliwość jak potężne góry, Twoje orzeczenia jak wielka głębia; Ty, JHWH, wybawiasz ludzi i zwierzęta!"
"Ps36,7": "Jak cenne jest Twoje miłosierdzie, Boże! Dlatego synowie ludzcy chronią się w cieniu Twoich skrzydeł."
"Ps36,8": "Nasycą się tłustością Twojego domu, napoisz ich strumieniem Twoich rozkoszy."
"Ps36,9": "Ponieważ u Ciebie jest źródło życia, w Twojej światłości ujrzymy światłość."
"Ps36,10": "Roztocz swoje miłosierdzie nad tymi, którzy Ciebie znają, a Twoją sprawiedliwość nad ludźmi prawego serca."
"Ps36,11": "Niech nie zdepcze mnie stopa pysznego, niech mnie nie wygania ręka niegodziwego."
"Ps36,12": "Tam upadli, czyniący nieprawość zostali powaleni i nie będą zdolni powstać."
