"Ps11,1": "Przewodnikowi chóru. Psalm Dawida. W JHWH pokładam ufność: Jakże więc możecie mówić mojej duszy: Uciekaj jak ptak na swoją górę?"
"Ps11,2": "Bo oto niegodziwi napinają łuk, kładą strzałę na cięciwę, aby w ciemności strzelać do tych, którzy są prawego serca."
"Ps11,3": "Gdy zburzone są fundamenty, co uczyni sprawiedliwy?"
"Ps11,4": "JHWH jest w swoim świętym przybytku, tron JHWH jest w niebie, Jego oczy patrzą, Jego powieki badają synów ludzkich."
"Ps11,5": "JHWH doświadcza sprawiedliwego, ale znienawidził duszę niegodziwego i tego, kto kocha bezprawie."
"Ps11,6": "Ześle deszcz na niegodziwych pułapkę ognia i siarki, a palący wicher będzie udziałem ich kielicha."
"Ps11,7": "Bo sprawiedliwy JHWH kocha sprawiedliwość, prawy ujrzy Jego oblicze."
