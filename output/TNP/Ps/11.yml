"Ps11,1":
  text: "Przewodnikowi chóru. Psalm Dawida. W JHWH pokładam ufność: Jakże więc możecie mówić mojej duszy: Uciekaj jak ptak na swoją górę?"
  tags: []
"Ps11,2":
  text: "Bo oto niegodziwi napinają łuk, kładą strzałę na cięciwę, aby w ciemności strzelać do tych, którzy są prawego serca."
  tags: []
"Ps11,3":
  text: "Gdy zburzone są fundamenty, co uczyni sprawiedliwy?"
  tags: []
"Ps11,4":
  text: "JHWH jest w swoim świętym przybytku, tron JHWH jest w niebie, Jego oczy patrzą, Jego powieki badają synów ludzkich."
  tags: []
"Ps11,5":
  text: "JHWH doświadcza sprawiedliwego, ale znienawidził duszę niegodziwego i tego, kto kocha bezprawie."
  tags: []
"Ps11,6":
  text: "Ześle deszcz na niegodziwych pułapkę ognia i siarki, a palący wicher będzie udziałem ich kielicha."
  tags: []
"Ps11,7":
  text: "Bo sprawiedliwy JHWH kocha sprawiedliwość, prawy ujrzy Jego oblicze."
  tags: []
