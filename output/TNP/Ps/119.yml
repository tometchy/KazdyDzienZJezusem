"Ps119,1": "Błogosławieni ci, których droga jest nienaganna , którzy chodzą według Prawa JHWH!"
"Ps119,2": "Błogosławieni ci, którzy strzegą Jego świadectw i szukają Go całym sercem;"
"Ps119,3": "Którzy także nie czynią nieprawości, ale chodzą Jego drogami."
"Ps119,4": "Ty nakazałeś, aby pilnie strzec Twoich ustaw."
"Ps119,5": "Obym trzymał się moich dróg, aby zachowywać Twoje postanowienia!"
"Ps119,6": "Wtedy nie zawstydzę się, gdy będę zważał na wszystkie Twoje przykazania."
"Ps119,7": "Pragnę Cię wysławiać w szczerości serca, gdy nauczę się Twoich sprawiedliwych orzeczeń."
"Ps119,8": "Będę strzegł Twoich postanowień, nigdy mnie nie opuszczaj."
"Ps119,9": "W jaki sposób młodzieniec oczyści swoją ścieżkę? Gdy przestrzegać będzie Twojego Słowa."
"Ps119,10": "Szukam Ciebie z całego serca, nie daj mi zboczyć od Twoich przykazań."
"Ps119,11": "W sercu swoim przechowuję Twoje wypowiedzi, abym nie zgrzeszył przeciwko Tobie."
"Ps119,12": "Błogosławiony jesteś, JHWH; naucz mnie Twoich postanowień."
"Ps119,13": "Swoimi wargami opowiadam wszystkie orzeczenia Twoich ust."
"Ps119,14": "Raduję się na drodze Twoich świadectw jak z całego bogactwa."
"Ps119,15": "Pragnę rozmyślać o Twoich ustawach i pragnę przyglądać się Twoim ścieżkom."
"Ps119,16": "Zachwycam się Twoimi zarządzeniami i nie zapominam Twojego Słowa."
"Ps119,17": "Okaż wspaniałomyślność swojemu słudze, abym żył i zachowywał Twoje Słowo."
"Ps119,18": "Odsłoń moje oczy, abym mógł zobaczyć cudowność Twojego Prawa."
"Ps119,19": "Jestem przybyszem na ziemi, nie ukrywaj przede mną Twoich przykazań."
"Ps119,20": "Moją duszę przez cały czas druzgocze tęsknota za Twoimi orzeczeniami."
"Ps119,21": "Skarciłeś pysznych, przeklętych, którzy odstępują od Twoich przykazań."
"Ps119,22": "Zdejmij ze mnie hańbę i pogardę, gdyż zachowuję Twoje świadectwo."
"Ps119,23": "Nawet książęta zasiadają i zmawiają się przeciwko mnie, lecz Twój sługa rozmyśla o Twoich postanowieniach."
"Ps119,24": "Również Twoje świadectwa są moją rozkoszą i jako mężowie będący moimi doradcami."
"Ps119,25": "Moja dusza przylgnęła do prochu, ożyw mnie według Twojego Słowa."
"Ps119,26": "Opowiedziałem Ci o moich drogach i odpowiedziałeś mi; naucz mnie Twoich postanowień."
"Ps119,27": "Spraw, bym zrozumiał drogę Twoich ustaw, a będę rozmyślał o Twoich cudownych dziełach."
"Ps119,28": "Dusza moja rozpływa się we łzach ze smutku, utwierdź mnie według Twojego Słowa."
"Ps119,29": "Oddal ode mnie drogę kłamstwa, a obdarz mnie łaskawie swoim Prawem."
"Ps119,30": "Wybrałem drogę prawdy, a Twoje orzeczenia stawiam przed sobą."
"Ps119,31": "Przylgnąłem do Twoich świadectw; JHWH, nie pozwól mi zaznać wstydu."
"Ps119,32": "Pobiegnę drogą Twoich przykazań, ponieważ rozszerzasz moje serce."
"Ps119,33": "Naucz mnie, JHWH, drogi Twoich postanowień, a będę jej strzegł aż do końca."
"Ps119,34": "Daj mi zrozumienie, bym strzegł Twojego Prawa; abym go przestrzegał całym sercem."
"Ps119,35": "Spraw, bym chodził ścieżką Twoich przykazań, gdyż w niej mam upodobanie."
"Ps119,36": "Nagnij moje serce do Twoich świadectw, a nie do zysków."
"Ps119,37": "Odwróć moje oczy, aby nie patrzyły na marność, ożyw mnie na Twojej drodze."
"Ps119,38": "Utwierdź swoją wypowiedź względem Twojego sługi, który się oddał Twojej bojaźni."
"Ps119,39": "Oddal ode mnie mą hańbę, której się boję, bo Twoje orzeczenia są dobre."
"Ps119,40": "Oto tęsknię do Twoich ustaw; ożyw mnie w swojej sprawiedliwości."
"Ps119,41": "I niech zstąpi na mnie Twoje miłosierdzie, JHWH, Twoje zbawienie według Twojej wypowiedzi;"
"Ps119,42": "Wówczas odpowiem słowem temu, który mi urąga, bo ufam Twojemu Słowu."
"Ps119,43": "I proszę nie odejmuj żadną miarą z moich ust słowa prawdy, bo oczekuję Twoich orzeczeń."
"Ps119,44": "I chcę nieustannie strzec Twojego Prawa, na wieki i na zawsze."
"Ps119,45": "I będę chodził drogą przestronną, bo szukam Twoich ustaw."
"Ps119,46": "Nawet przed królami będę mówił o Twoich świadectwach i nie doznam zawstydzenia."
"Ps119,47": "Będę się również rozkoszował Twoimi przykazaniami, które umiłowałem."
"Ps119,48": "I podniosę mą rękę ku Twoim przykazaniom, które miłuję, i będę rozmyślał o Twoich postanowieniach."
"Ps119,49": "Pamiętaj o słowie wypowiedzianym do Twojego sługi, na które kierujesz moją nadzieję."
"Ps119,50": "To jest moim pocieszeniem w mojej udręce, bo Twoja wypowiedź mnie ożywia."
"Ps119,51": "Butni tak bardzo szydzą ze mnie, lecz ja nie odstępuję od Twojego Prawa."
"Ps119,52": "Przypominam sobie Twoje odwieczne orzeczenia, JHWH, i pragnę pocieszać się nimi."
"Ps119,53": "Ogarnia mnie gniew z powodu niegodziwych porzucających Twoje Prawo."
"Ps119,54": "Twoje postanowienia są dla mnie pieśniami w domu mojego zamieszkania."
"Ps119,55": "W nocy wspominam Twoje imię, JHWH, i strzegę Twojego Prawa."
"Ps119,56": "To mnie spotkało, bo przestrzegam Twoich ustaw."
"Ps119,57": "JHWH jest moim działem – obiecałem przestrzegać Twoich słów."
"Ps119,58": "Całym sercem przebłagiwałem Twoje oblicze, zlituj się nade mną stosownie do Twojej wypowiedzi."
"Ps119,59": "Rozmyślałem o moich drogach i skierowałem swoje kroki ku Twoim świadectwom."
"Ps119,60": "Śpieszyłem się i nie zwlekałem, aby strzec Twoich przykazań."
"Ps119,61": "Powrozy niegodziwych spętały mnie, ale nie zapominam Twojego Prawa."
"Ps119,62": "Wstaję w środku nocy, aby wysławiać Cię za Twoje sprawiedliwe orzeczenia."
"Ps119,63": "Jestem przyjacielem wszystkich, którzy boją się Ciebie i strzegą Twoich ustaw."
"Ps119,64": "JHWH, ziemia jest pełna Twojego miłosierdzia; naucz mnie Twoich postanowień."
"Ps119,65": "Wyświadczyłeś dobro Twojemu słudze, JHWH, według Twojego Słowa."
"Ps119,66": "Naucz mnie trafnego osądu i wiedzy, bo uwierzyłem Twoim przykazaniom."
"Ps119,67": "Zanim doznałem utrapienia, błądziłem; lecz teraz strzegę Twojej wypowiedzi."
"Ps119,68": "Jesteś dobry i czynisz dobro; naucz mnie Twoich postanowień."
"Ps119,69": "Butni zmyślili przeciwko mnie kłamstwo, ale ja całym sercem strzegę Twoich ustaw."
"Ps119,70": "Serce ich tłuszczem otyłe , ale ja rozkoszuję się Twoim Prawem."
"Ps119,71": "Dobrze to dla mnie, że zostałem upokorzony, abym się nauczył Twoich postanowień."
"Ps119,72": "Lepsze jest dla mnie Prawo Twoich ust niż tysiące sztuk złota i srebra."
"Ps119,73": "Twoje ręce mnie uczyniły i trwale ustanowiły; daj mi zrozumienie, abym się nauczył Twoich przykazań;"
"Ps119,74": "Ci, którzy boją się Ciebie, widząc mnie, będą się radować, że pokładam nadzieję w Twoim Słowie."
"Ps119,75": "Wiem, JHWH, że Twoje orzeczenia są sprawiedliwe i że ze względu na wierność mnie upokorzyłeś."
"Ps119,76": "Proszę, niech teraz mnie pocieszy Twoje miłosierdzie według Twojej wypowiedzi dla Twojego sługi."
"Ps119,77": "Niech zstąpi na mnie Twoje współczucie, abym żył; bo Twoje Prawo jest moją rozkoszą."
"Ps119,78": "Niech się zawstydzą butni, którzy za pomocą kłamstwa mnie poniżyli, ale ja będę rozmyślać o Twoich ustawach."
"Ps119,79": "Niech się zwrócą do mnie ci, którzy się boją Ciebie, i ci, którzy poznają Twoje świadectwa."
"Ps119,80": "Niech moje serce będzie nienaganne w przestrzeganiu Twoich postanowień, po to, abym nie doznał wstydu!"
"Ps119,81": "Moja dusza osłabła z tęsknoty za Twoim zbawieniem; pokładam nadzieję w Twoim Słowie."
"Ps119,82": "Moje oczy osłabły z tęsknoty za Twoją wypowiedzią, mówiąc: Kiedy mnie pocieszysz?"
"Ps119,83": "Chociaż stałem się jak bukłak w dymie, to nie zapomniałem Twoich postanowień."
"Ps119,84": "Ile dni zostało Twojemu słudze? Kiedy wykonasz orzeczenie na tych, którzy mnie prześladują?"
"Ps119,85": "Doły wykopali dla mnie butni, którzy nie postępują zgodnie z Twoim Prawem."
"Ps119,86": "Wszystkie Twoje przykazania są prawdą; za pomocą kłamstwa mnie prześladują; pomóż mi!"
"Ps119,87": "Omal nie zgładzili mnie na ziemi; ale ja nie porzuciłem Twoich ustaw."
"Ps119,88": "Według Twojego miłosierdzia ożyw mnie, abym strzegł świadectwa Twoich ust."
"Ps119,89": "Na wieki, o JHWH, Twoje Słowo jest ustanowione w niebiosach."
"Ps119,90": "Twoja prawda z pokolenia na pokolenie; ugruntowałeś ziemię i trwa."
"Ps119,91": "Według Twoich orzeczeń trwa do dziś, bo wszyscy są Twoimi sługami."
"Ps119,92": "Gdyby Twoje Prawo nie było moją rozkoszą, wtedy zginąłbym w moim utrapieniu."
"Ps119,93": "Nigdy nie zapomnę Twoich ustaw, bo przez nie mnie ożywiłeś."
"Ps119,94": "Ja jestem Twój, wybaw mnie, bo szukam Twoich ustaw."
"Ps119,95": "Wyczekują na mnie niegodziwi, aby mnie zgubić, ale ja starannie rozważam Twoje świadectwa."
"Ps119,96": "Widziałem koniec wszelkiej doskonałości, ale Twoje przykazanie jest bardzo szerokie."
"Ps119,97": "O, jak bardzo miłuję Twoje Prawo! Przez cały dzień o nim rozmyślam."
"Ps119,98": "Twoje przykazanie czyni mnie mądrzejszym od moich wrogów, bo jest ono przy mnie na wieki."
"Ps119,99": "Stałem się rozumniejszy od wszystkich moich nauczycieli, bo rozmyślam o Twoich świadectwach."
"Ps119,100": "Jestem roztropniejszy od starszych, bo strzegę Twojej ustawy."
"Ps119,101": "Powstrzymuję swoje nogi od wszelkiej złej ścieżki, po to bym strzegł Twojego Słowa."
"Ps119,102": "Nie odstępuję od Twoich orzeczeń, bo Ty mnie uczysz."
"Ps119,103": "O, jak słodka dla mojego podniebienia jest Twoja wypowiedź! Słodsza niż miód dla moich ust."
"Ps119,104": "Dzięki Twoim ustawom staję się rozumniejszy; dlatego też nienawidzę wszelkiej ścieżki kłamliwej."
"Ps119,105": "Twoje Słowo jest lampą dla moich nóg i światłem dla mojej ścieżki."
"Ps119,106": "Złożyłem przysięgę i wypełnię ją, będę strzegł Twoich sprawiedliwych orzeczeń."
"Ps119,107": "Jestem tak bardzo udręczony; JHWH, ożyw mnie zgodnie z Twoim Słowem!"
"Ps119,108": "JHWH, przyjmij proszę dobrowolne ofiary wdzięczności z moich ust i naucz mnie Twoich orzeczeń."
"Ps119,109": "Moja dusza jest ciągle w mojej dłoni, ale nie zapominam Twojego Prawa."
"Ps119,110": "Niegodziwi zastawili na mnie sidło, ale ja nie zbaczam od Twoich ustaw."
"Ps119,111": "Odziedziczyłem Twoje świadectwa na wieki, bo są radością mojego serca."
"Ps119,112": "Nakłoniłem moje serce, by zawsze wykonywać Twoje postanowienia, aż do końca."
"Ps119,113": "Nienawidzę chwiejnych, ale miłuję Twoje Prawo."
"Ps119,114": "Ty jesteś moją ucieczką i tarczą, pokładam nadzieję w Twoim Słowie."
"Ps119,115": "Niech odstąpią ode mnie czyniący niegodziwość, bym mógł strzec przykazań mojego Boga."
"Ps119,116": "Wesprzyj mnie zgodnie ze swoją wypowiedzią, abym żył i nie został zawstydzony w mojej nadziei."
"Ps119,117": "Podtrzymaj mnie, a będę wybawiony i będę zawsze wpatrywał się w Twoje postanowienia."
"Ps119,118": "Odrzuciłeś wszystkich, którzy odstępują od Twoich postanowień, bo fałsz ich jest zwodniczy."
"Ps119,119": "To żużel! Skończysz ze wszystkimi niegodziwymi ziemi; dlatego miłuję Twoje świadectwa."
"Ps119,120": "Moje ciało drży ze strachu przed Tobą i lękam się Twoich orzeczeń."
"Ps119,121": "Wykonałem Twoje orzeczenie i sprawiedliwość; nie pozostawiaj mnie tym, którzy mnie krzywdzą."
"Ps119,122": "Poręcz za Twojego sługę dla mojego dobra, aby nie krzywdzili mnie butni."
"Ps119,123": "Moje oczy słabną, wypatrując Twojego zbawienia i słowa Twojej sprawiedliwości."
"Ps119,124": "Postąp ze swoim sługą według Twojego miłosierdzia i naucz mnie Twoich postanowień."
"Ps119,125": "Jestem Twoim sługą, daj mi zrozumienie i poznanie Twoich świadectw."
"Ps119,126": "Już czas, JHWH, abyś działał, bo naruszono Twoje Prawo."
"Ps119,127": "Dlatego umiłowałem Twoje przykazania bardziej od złota, bardziej od najczystszego złota."
"Ps119,128": "Dlatego wszystkie Twoje ustawy, każdą z nich uznaję za słuszną, a nienawidzę wszelkiej ścieżki kłamstwa."
"Ps119,129": "Twoje świadectwa są przedziwne, dlatego moja dusza ich strzeże."
"Ps119,130": "Wykład Twoich słów oświeca i daje zrozumienie prostym."
"Ps119,131": "Otwieram szeroko swoje usta i wzdycham, bo tęsknię za Twoimi przykazaniami."
"Ps119,132": "Zwróć się ku mnie i bądź łaskawy dla mnie, jak orzekłeś wobec tych, którzy miłują Twoje imię."
"Ps119,133": "Utwierdź moje kroki w Twojej wypowiedzi, niech nie zapanuje nade mną żadna nieprawość."
"Ps119,134": "Wyzwól mnie od ucisku człowieka, abym strzegł Twoich ustaw."
"Ps119,135": "Rozjaśnij swoje oblicze nad Twoim sługą i naucz mnie Twoich postanowień."
"Ps119,136": "Jak korytami wód płyną łzy z moich oczu, dlatego że nie strzegą Twojego Prawa."
"Ps119,137": "Sprawiedliwy jesteś, JHWH, i prawe są Twoje orzeczenia."
"Ps119,138": "Zarządziłeś sprawiedliwość Twoich świadectw i wielką ich wierność."
"Ps119,139": "Gorliwość wyniszcza mnie, bo moi wrogowie zapominają Twoje słowa."
"Ps119,140": "Twoja wypowiedź została w pełni wypróbowana, dlatego Twój sługa ją kocha."
"Ps119,141": "Ja jestem mały i wzgardzony, lecz nie zapominam Twoich ustaw."
"Ps119,142": "Twoja sprawiedliwość jest sprawiedliwością na wieki, a Twoje Prawo jest prawdą."
"Ps119,143": "Ucisk i utrapienie znalazły mnie, lecz Twoje przykazania stały się moją rozkoszą."
"Ps119,144": "Sprawiedliwość Twoich świadectw trwa na wieki; daj mi zrozumienie, a będę żył."
"Ps119,145": "Wołam z całego serca, wysłuchaj mnie, o JHWH, a będę strzegł Twoich postanowień."
"Ps119,146": "Wołam do Ciebie, wybaw mnie, a będę strzegł Twoich świadectw."
"Ps119,147": "Wstaję przed świtem i wołam o pomoc, oczekuję na Twoje Słowa."
"Ps119,148": "Moje oczy wyprzedzają straże nocne, abym mógł rozmyślać o Twojej wypowiedzi."
"Ps119,149": "JHWH, usłysz mój głos ze względu na Twoją łaskawość; ożyw mnie zgodnie z Twoim orzeczeniem."
"Ps119,150": "Zbliżyli się do mnie prześladowcy w złym celu, są daleko od Twojego Prawa."
"Ps119,151": "Blisko jesteś, JHWH, i wszystkie Twoje przykazania są prawdą."
"Ps119,152": "Od dawna znam Twoje świadectwa, bo ustanowiłeś je na wieki."
"Ps119,153": "Popatrz na moje ubóstwo i wyzwól mnie, gdyż nie zapominam Twojego Prawa."
"Ps119,154": "Broń mojej sprawy i odkup mnie; ożyw mnie zgodnie z Twoją wypowiedzią."
"Ps119,155": "Zbawienie jest dalekie od niegodziwych, bo nie szukają Twoich postanowień."
"Ps119,156": "Wielka jest Twoja litość, JHWH; ożyw mnie zgodnie z Twoimi orzeczeniami."
"Ps119,157": "Liczni są ci, którzy mnie prześladują i moi wrogowie; lecz nie odstępuję od Twoich świadectw."
"Ps119,158": "Widzę postępujących podstępnie i czuję odrazę do tych, którzy nie strzegą Twoich wypowiedzi."
"Ps119,159": "Zobacz, że miłuję Twoje ustawy JHWH; ożyw mnie według Twojego miłosierdzia."
"Ps119,160": "Sedno Twojego Słowa to wierność i na wieki trwa każde orzeczenie Twojej sprawiedliwości."
"Ps119,161": "Książęta prześladują mnie bez przyczyny; lecz moje serce boi się Twoich słów."
"Ps119,162": "Raduję się z Twojej wypowiedzi jak ten, który znajduje wielki łup."
"Ps119,163": "Nienawidzę kłamstwa i brzydzę się nim, ale miłuję Twoje Prawo."
"Ps119,164": "Wysławiam Cię siedem razy dziennie za Twoje sprawiedliwe orzeczenia."
"Ps119,165": "Głęboki pokój dla tych, którzy miłują Twoje Prawo, a nie potkną się."
"Ps119,166": "JHWH, oczekuję na Twoje zbawienie i wypełniam Twoje przykazania."
"Ps119,167": "Moja dusza strzeże Twoich świadectw, bo bardzo je miłuję."
"Ps119,168": "Strzegę Twoich ustaw i świadectw, bo wszystkie moje drogi są przed Tobą."
"Ps119,169": "JHWH, niech dotrze moje wołanie przed Twoje oblicze, daj mi zrozumienie zgodnie z Twoim Słowem."
"Ps119,170": "Niech dojdzie moja prośba przed Twoje oblicze, ocal mnie zgodnie z Twoją wypowiedzią."
"Ps119,171": "Niech spłyną moje wargi pieśnią chwały, bo nauczasz mnie Twoich postanowień."
"Ps119,172": "Niech mój język ogłasza Twoją wypowiedź, bo wszystkie Twoje przykazania są sprawiedliwe."
"Ps119,173": "Niech Twoja ręka będzie mi pomocą, bo wybrałem Twoje ustawy."
"Ps119,174": "JHWH, tęsknię do Twojego zbawienia, a Twoje Prawo jest moją rozkoszą."
"Ps119,175": "Niech moja dusza żyje, aby Ciebie chwalić; niech Twoje nakazy będą dla mnie pomocą."
"Ps119,176": "Zbłądziłem jak zagubiona owca; odszukaj Twojego sługi, bo nie zapomniałem Twoich przykazań."
