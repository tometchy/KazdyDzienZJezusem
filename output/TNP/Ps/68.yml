"Ps68,1":
  text: "Niech Bóg się pojawi, a rozproszeni będą Jego wrogowie; niech pierzchną przed Jego obliczem ci, którzy Go nienawidzą."
  tags: []
"Ps68,2":
  text: "Jak rozwianie się dymu, tak ich rozwiejesz; jak rozpłynięcie się wosku w obecności ognia, tak niegodziwi niech zginą przed obliczem Boga."
  tags: []
"Ps68,3":
  text: "A sprawiedliwi będą się weselić i cieszyć przed obliczem Boga, i będą się radować niezmiernie."
  tags: []
"Ps68,4":
  text: "Śpiewajcie Bogu, śpiewajcie psalmy Jego imieniu, wywyższajcie Tego, który przemierza niebiosa; JH[WH] to Jego imię, radujcie się przed Jego obliczem."
  tags: []
"Ps68,5":
  text: "Ojcem dla sierot i sędzią wdów jest Bóg w swoim świętym miejscu zamieszkania."
  tags: []
"Ps68,6":
  text: "Bóg samotnym daje dom, więźniów uwalnia do pomyślności, ale buntujący się mieszkają w suchej ziemi."
  tags: []
"Ps68,7":
  text: "Boże, gdy wyruszałeś przed obliczem swojego ludu, gdy kroczyłeś przez pustynię – Sela –"
  tags: []
"Ps68,8":
  text: "Ziemia zadrżała, także niebiosa spuściły deszcz przed obliczem Boga na ten Synaj przed obliczem Boga, Boga Izraela."
  tags: []
"Ps68,9":
  text: "Obfity deszcz ofiarowałeś dobrowolnie, Boże, Ty sam umocniłeś swoje dziedzictwo, gdy było zmęczone."
  tags: []
"Ps68,10":
  text: "Twoje zastępy zamieszkały w niej; Ty, Boże, w swojej dobroci przygotowałeś ją dla ubogiego."
  tags: []
"Ps68,11":
  text: "PAN dał słowo, wielki jest zastęp przynoszących dobre wieści."
  tags: []
"Ps68,12":
  text: "Królowie zastępów uciekną, uciekną; a mieszkanka domu dzielić będzie łupy."
  tags: []
"Ps68,13":
  text: "Dlaczego macie odpoczywać między obozowymi garnkami, skoro skrzydła gołębicy zostały pokryte srebrem, a jej pióra żółtozielonym złotem."
  tags: []
"Ps68,14":
  text: "Gdy Wszechmogący rozproszył w niej królów, była biała jak śnieg na górze Salmon."
  tags: []
"Ps68,15":
  text: "Góra Boża to góra Baszan, górą o wielu szczytach jest góra Baszan."
  tags: []
"Ps68,16":
  text: "Dlaczego przyglądacie się zazdrośnie szczyty górskie, górze, na której Bóg zapragnął zamieszkać. Tak, JHWH zamieszka tam na wieki."
  tags: []
"Ps68,17":
  text: "Rydwanów Bożych jest miriady, tysiące razy powtórzone; PAN pośród nich jak na Synaju, w świętym świętych."
  tags: []
"Ps68,18":
  text: "Wstąpiłeś na wysokość, wziąłeś do niewoli jeńców, przyniosłeś dary dla ludzi, także dla buntujących się, którzy mogą tam zamieszkać – JH[WH] Boże."
  tags: []
"Ps68,19":
  text: "Błogosławiony PAN, który dzień po dniu niesie nam dary. Bóg naszym zbawieniem. Sela."
  tags: []
"Ps68,20":
  text: "Nasz Bóg jest Bogiem ocalenia, JHWH PAN wybawia od śmierci."
  tags: []
"Ps68,21":
  text: "Lecz Bóg roztrzaska głowę swoich wrogów i włochaty czubek głowy chodzącego w swoich grzechach."
  tags: []
"Ps68,22":
  text: "PAN powiedział: Wyprowadzę ponownie swoich z Baszanu, wyprowadzę ich ponownie z głębin morskich;"
  tags: []
"Ps68,23":
  text: "Aby twoja stopa ich zdruzgotała a język twoich psów miał część we krwi wrogów."
  tags: []
"Ps68,24":
  text: "Widzieli Twoje wymarsze, Boże; wymarsze mojego Boga, mojego Króla w miejscu świętym."
  tags: []
"Ps68,25":
  text: "Na przedzie idą śpiewacy, za nimi grający na instrumentach, pośród nich grające dziewczęta."
  tags: []
"Ps68,26":
  text: "W zgromadzeniach błogosławcie Boga, JHWH, wy, którzy pochodzicie ze źródła Izraela."
  tags: []
"Ps68,27":
  text: "Tam kroczy najmłodszy Beniamin, panujący nad nimi, władcy Judy z dowódcami, władcy Zebulona i władcy Neftalego."
  tags: []
"Ps68,28":
  text: "Twój Bóg ustanowił twoją potęgę; wzmacniaj, Boże, to co dla nas uczyniłeś."
  tags: []
"Ps68,29":
  text: "Ze względu na Twoją świątynię w Jerozolimie królowie będą przynosić Ci dary."
  tags: []
"Ps68,30":
  text: "Zgrom zwierzynę w trzcinie, zgromadzenie mocnych byczków narodów, depczących kawałki srebra. Rozprosz narody rozkoszujące się wojną."
  tags: []
"Ps68,31":
  text: "Przyjdą dostojnicy z Egiptu; Kusz szybko wyciągnie swoje ręce do Boga."
  tags: []
"Ps68,32":
  text: "Śpiewajcie Bogu, królestwa ziemi. Och, wysławiajcie PANA. Sela."
  tags: []
"Ps68,33":
  text: "Który przemierza odwieczne niebiosa niebios; oto wyda On swój głos, głos potężny."
  tags: []
"Ps68,34":
  text: "Uznajcie potęgę Boga, Jego majestat nad Izraelem i Jego potęgę w obłokach."
  tags: []
"Ps68,35":
  text: "Bóg napawa lękiem, ze swojej świątyni; Bóg Izraela, On daje moc i siłę swojemu ludowi. Bóg niech będzie błogosławiony."
  tags: []
