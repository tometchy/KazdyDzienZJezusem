"Ps68,1": "Niech Bóg się pojawi, a rozproszeni będą Jego wrogowie; niech pierzchną przed Jego obliczem ci, którzy Go nienawidzą."
"Ps68,2": "Jak rozwianie się dymu, tak ich rozwiejesz; jak rozpłynięcie się wosku w obecności ognia, tak niegodziwi niech zginą przed obliczem Boga."
"Ps68,3": "A sprawiedliwi będą się weselić i cieszyć przed obliczem Boga, i będą się radować niezmiernie."
"Ps68,4": "Śpiewajcie Bogu, śpiewajcie psalmy Jego imieniu, wywyższajcie Tego, który przemierza niebiosa; JH[WH] to Jego imię, radujcie się przed Jego obliczem."
"Ps68,5": "Ojcem dla sierot i sędzią wdów jest Bóg w swoim świętym miejscu zamieszkania."
"Ps68,6": "Bóg samotnym daje dom, więźniów uwalnia do pomyślności, ale buntujący się mieszkają w suchej ziemi."
"Ps68,7": "Boże, gdy wyruszałeś przed obliczem swojego ludu, gdy kroczyłeś przez pustynię – Sela –"
"Ps68,8": "Ziemia zadrżała, także niebiosa spuściły deszcz przed obliczem Boga na ten Synaj przed obliczem Boga, Boga Izraela."
"Ps68,9": "Obfity deszcz ofiarowałeś dobrowolnie, Boże, Ty sam umocniłeś swoje dziedzictwo, gdy było zmęczone."
"Ps68,10": "Twoje zastępy zamieszkały w niej; Ty, Boże, w swojej dobroci przygotowałeś ją dla ubogiego."
"Ps68,11": "PAN dał słowo, wielki jest zastęp przynoszących dobre wieści."
"Ps68,12": "Królowie zastępów uciekną, uciekną; a mieszkanka domu dzielić będzie łupy."
"Ps68,13": "Dlaczego macie odpoczywać między obozowymi garnkami, skoro skrzydła gołębicy zostały pokryte srebrem, a jej pióra żółtozielonym złotem."
"Ps68,14": "Gdy Wszechmogący rozproszył w niej królów, była biała jak śnieg na górze Salmon."
"Ps68,15": "Góra Boża to góra Baszan, górą o wielu szczytach jest góra Baszan."
"Ps68,16": "Dlaczego przyglądacie się zazdrośnie szczyty górskie, górze, na której Bóg zapragnął zamieszkać. Tak, JHWH zamieszka tam na wieki."
"Ps68,17": "Rydwanów Bożych jest miriady, tysiące razy powtórzone; PAN pośród nich jak na Synaju, w świętym świętych."
"Ps68,18": "Wstąpiłeś na wysokość, wziąłeś do niewoli jeńców, przyniosłeś dary dla ludzi, także dla buntujących się, którzy mogą tam zamieszkać – JH[WH] Boże."
"Ps68,19": "Błogosławiony PAN, który dzień po dniu niesie nam dary. Bóg naszym zbawieniem. Sela."
"Ps68,20": "Nasz Bóg jest Bogiem ocalenia, JHWH PAN wybawia od śmierci."
"Ps68,21": "Lecz Bóg roztrzaska głowę swoich wrogów i włochaty czubek głowy chodzącego w swoich grzechach."
"Ps68,22": "PAN powiedział: Wyprowadzę ponownie swoich z Baszanu, wyprowadzę ich ponownie z głębin morskich;"
"Ps68,23": "Aby twoja stopa ich zdruzgotała a język twoich psów miał część we krwi wrogów."
"Ps68,24": "Widzieli Twoje wymarsze, Boże; wymarsze mojego Boga, mojego Króla w miejscu świętym."
"Ps68,25": "Na przedzie idą śpiewacy, za nimi grający na instrumentach, pośród nich grające dziewczęta."
"Ps68,26": "W zgromadzeniach błogosławcie Boga, JHWH, wy, którzy pochodzicie ze źródła Izraela."
"Ps68,27": "Tam kroczy najmłodszy Beniamin, panujący nad nimi, władcy Judy z dowódcami, władcy Zebulona i władcy Neftalego."
"Ps68,28": "Twój Bóg ustanowił twoją potęgę; wzmacniaj, Boże, to co dla nas uczyniłeś."
"Ps68,29": "Ze względu na Twoją świątynię w Jerozolimie królowie będą przynosić Ci dary."
"Ps68,30": "Zgrom zwierzynę w trzcinie, zgromadzenie mocnych byczków narodów, depczących kawałki srebra. Rozprosz narody rozkoszujące się wojną."
"Ps68,31": "Przyjdą dostojnicy z Egiptu; Kusz szybko wyciągnie swoje ręce do Boga."
"Ps68,32": "Śpiewajcie Bogu, królestwa ziemi. Och, wysławiajcie PANA. Sela."
"Ps68,33": "Który przemierza odwieczne niebiosa niebios; oto wyda On swój głos, głos potężny."
"Ps68,34": "Uznajcie potęgę Boga, Jego majestat nad Izraelem i Jego potęgę w obłokach."
"Ps68,35": "Bóg napawa lękiem, ze swojej świątyni; Bóg Izraela, On daje moc i siłę swojemu ludowi. Bóg niech będzie błogosławiony."
