"Ps112,1": "Chwalcie JH[WH]. Błogosławiony mąż, który boi się JHWH i bardzo upodobał sobie Jego przykazania!"
"Ps112,2": "Jego potomstwo będzie potężne na ziemi, pokolenie prawych będzie błogosławione."
"Ps112,3": "Dobrobyt i bogactwo są w jego domu, a jego sprawiedliwość trwa na wieki."
"Ps112,4": "Dla prawych wschodzi światłość w ciemności; On jest łaskawy, miłosierny i sprawiedliwy."
"Ps112,5": "Dobrze jest, gdy człowiek okazuje łaskę i pożycza, dotrzymuje swojego słowa należycie."
"Ps112,6": "O tak! Nigdy nie zostanie zachwiany, sprawiedliwy na wieki będzie zapamiętany."
"Ps112,7": "Nie będzie się bał złej nowiny, jego serce jest stateczne, ufające JHWH."
"Ps112,8": "Jego serce zostało umocnione, nie będzie się bał, aż spojrzy z góry na swoich wrogów."
"Ps112,9": "Rozprowadził i dał ubogim, jego sprawiedliwość trwa na wieki, jego róg będzie wywyższony w chwale."
"Ps112,10": "Niegodziwy widzi to i gniewa się, zgrzyta zębami i omdlewa; pragnienie niegodziwych zginie."
