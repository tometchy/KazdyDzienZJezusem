"Ps112,1":
  text: "Chwalcie JH[WH]. Błogosławiony mąż, który boi się JHWH i bardzo upodobał sobie Jego przykazania!"
  tags: []
"Ps112,2":
  text: "Jego potomstwo będzie potężne na ziemi, pokolenie prawych będzie błogosławione."
  tags: []
"Ps112,3":
  text: "Dobrobyt i bogactwo są w jego domu, a jego sprawiedliwość trwa na wieki."
  tags: []
"Ps112,4":
  text: "Dla prawych wschodzi światłość w ciemności; On jest łaskawy, miłosierny i sprawiedliwy."
  tags: []
"Ps112,5":
  text: "Dobrze jest, gdy człowiek okazuje łaskę i pożycza, dotrzymuje swojego słowa należycie."
  tags: []
"Ps112,6":
  text: "O tak! Nigdy nie zostanie zachwiany, sprawiedliwy na wieki będzie zapamiętany."
  tags: []
"Ps112,7":
  text: "Nie będzie się bał złej nowiny, jego serce jest stateczne, ufające JHWH."
  tags: []
"Ps112,8":
  text: "Jego serce zostało umocnione, nie będzie się bał, aż spojrzy z góry na swoich wrogów."
  tags: []
"Ps112,9":
  text: "Rozprowadził i dał ubogim, jego sprawiedliwość trwa na wieki, jego róg będzie wywyższony w chwale."
  tags: []
"Ps112,10":
  text: "Niegodziwy widzi to i gniewa się, zgrzyta zębami i omdlewa; pragnienie niegodziwych zginie."
  tags: []
