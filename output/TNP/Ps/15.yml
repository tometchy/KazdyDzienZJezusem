"Ps15,1":
  text: "Psalm Dawida. JHWH! Kto będzie przebywał w Twoim namiocie? Kto będzie mieszkał na Twojej świętej górze?"
  tags: []
"Ps15,2":
  text: "Ten, kto chodzi nienagannie i czyni sprawiedliwość, mówi prawdę w swoim sercu;"
  tags: []
"Ps15,3":
  text: "Kto nie obmawia swoim językiem, nie czyni swojemu bliźniemu zła, nie znieważa swojego sąsiada."
  tags: []
"Ps15,4":
  text: "Wzgardzonego w jego oczach – odrzuca, a uczci tych, co się boją JHWH; choć przysięga na własną niekorzyść, to nie zmieni przysięgi;"
  tags: []
"Ps15,5":
  text: "Nie daje srebra na lichwę i nie bierze łapówki przeciwko niewinnemu. Tak postępujący, nigdy się nie zachwieje."
  tags: []
