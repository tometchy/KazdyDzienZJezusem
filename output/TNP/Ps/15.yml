"Ps15,1": "Psalm Dawida. JHWH! Kto będzie przebywał w Twoim namiocie? Kto będzie mieszkał na Twojej świętej górze?"
"Ps15,2": "Ten, kto chodzi nienagannie i czyni sprawiedliwość, mówi prawdę w swoim sercu;"
"Ps15,3": "Kto nie obmawia swoim językiem, nie czyni swojemu bliźniemu zła, nie znieważa swojego sąsiada."
"Ps15,4": "Wzgardzonego w jego oczach – odrzuca, a uczci tych, co się boją JHWH; choć przysięga na własną niekorzyść, to nie zmieni przysięgi;"
"Ps15,5": "Nie daje srebra na lichwę i nie bierze łapówki przeciwko niewinnemu. Tak postępujący, nigdy się nie zachwieje."
