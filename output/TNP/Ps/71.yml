"Ps71,1": "W Tobie, JHWH, pokładam ufność, niech nigdy nie będę zawstydzony!"
"Ps71,2": "W swojej sprawiedliwości wyrwij mnie i wyzwól; nakłoń ku mnie swojego ucha i wybaw mnie."
"Ps71,3": "Bądź dla mnie skałą, schronieniem do którego zawsze będę mógł wkroczyć. Przykazałeś, aby mnie wybawiono, bo Ty jesteś moją ścianą skalną i twierdzą."
"Ps71,4": "Mój Boże, wyzwól mnie z ręki niegodziwego, z ręki czyniącego zło i tego, kto ciemięży."
"Ps71,5": "Ty bowiem jesteś moją nadzieją, JHWH PANIE, moją ufnością od młodości."
"Ps71,6": "Na Tobie wspieram się już od wyjścia z łona, Ty mnie odciąłeś od wnętrza mojej matki; w Tobie zawsze jest moja chwała."
"Ps71,7": "Dla wielu jestem jakby znakiem, lecz Ty jesteś moim potężnym schronieniem."
"Ps71,8": "Niech moje usta zostaną napełnione Twoją chwałą, Twoją wspaniałością każdego dnia."
"Ps71,9": "Nie odrzucaj mnie w czasie starości; nie pozostaw mnie, gdy ustanie moja siła,"
"Ps71,10": "Moi wrogowie bowiem mówią przeciwko mnie, a ci, którzy czyhają na moją duszę, wspólnie się naradzają;"
"Ps71,11": "Mówiąc: Bóg go opuścił, ścigajcie go i złapcie, bo nie ma nikogo, kto by go wyzwolił."
"Ps71,12": "Boże, nie bądź daleko ode mnie; mój Boże, pośpiesz mi na pomoc."
"Ps71,13": "Niech się zawstydzą i zginą przeciwnicy mojej duszy, niech się okryją hańbą i wstydem ci, którzy szukają mojej krzywdy."
"Ps71,14": "Ja natomiast wciąż będę ufał i pomnożę wszelką Twoją chwałę."
"Ps71,15": "Moje usta ogłaszać będą Twoją sprawiedliwość przez cały dzień i Twoje zbawienie, choć nie znam ich miary."
"Ps71,16": "Przyjdę w potędze JHWH PANA, będę wspominał tylko Twoją sprawiedliwość."
"Ps71,17": "Boże, uczyłeś mnie od mojej młodości i aż dotąd ogłaszam Twoje cudowne dzieła."
"Ps71,18": "Również do starości i siwizny nie opuszczaj mnie, Boże, dopóki o Twoim ramieniu nie oznajmię temu pokoleniu i każdemu przychodzącemu o Twojej potędze."
"Ps71,19": "Twoja sprawiedliwość, Boże, sięga aż do wyżyn nieba, uczyniłeś wielkie rzeczy; Boże, któż jest podobny do Ciebie?"
"Ps71,20": "Ty, który sprawiłeś, że doświadczyliśmy wiele trudności i nieszczęść, ponownie przywrócisz mnie do życia i ponownie podniesiesz mnie z głębin ziemi."
"Ps71,21": "Pomnożysz moją wielkość i otoczysz mnie opieką."
"Ps71,22": "A ja na harfie będę wysławiał Ciebie i Twoją wierność, mój Boże; będę Ci grał na cytrze, Święty Izraela!"
"Ps71,23": "Rozradują się moje wargi, gdy będę Ci śpiewał, i moja dusza, którą odkupiłeś."
"Ps71,24": "Również mój język będzie głosił przez cały dzień Twoją sprawiedliwość, bo okryli się wstydem i hańbą ci, którzy szukają mojej krzywdy."
