"Ps71,1":
  text: "W Tobie, JHWH, pokładam ufność, niech nigdy nie będę zawstydzony!"
  tags: []
"Ps71,2":
  text: "W swojej sprawiedliwości wyrwij mnie i wyzwól; nakłoń ku mnie swojego ucha i wybaw mnie."
  tags: []
"Ps71,3":
  text: "Bądź dla mnie skałą, schronieniem do którego zawsze będę mógł wkroczyć. Przykazałeś, aby mnie wybawiono, bo Ty jesteś moją ścianą skalną i twierdzą."
  tags: []
"Ps71,4":
  text: "Mój Boże, wyzwól mnie z ręki niegodziwego, z ręki czyniącego zło i tego, kto ciemięży."
  tags: []
"Ps71,5":
  text: "Ty bowiem jesteś moją nadzieją, JHWH PANIE, moją ufnością od młodości."
  tags: []
"Ps71,6":
  text: "Na Tobie wspieram się już od wyjścia z łona, Ty mnie odciąłeś od wnętrza mojej matki; w Tobie zawsze jest moja chwała."
  tags: []
"Ps71,7":
  text: "Dla wielu jestem jakby znakiem, lecz Ty jesteś moim potężnym schronieniem."
  tags: []
"Ps71,8":
  text: "Niech moje usta zostaną napełnione Twoją chwałą, Twoją wspaniałością każdego dnia."
  tags: []
"Ps71,9":
  text: "Nie odrzucaj mnie w czasie starości; nie pozostaw mnie, gdy ustanie moja siła,"
  tags: []
"Ps71,10":
  text: "Moi wrogowie bowiem mówią przeciwko mnie, a ci, którzy czyhają na moją duszę, wspólnie się naradzają;"
  tags: []
"Ps71,11":
  text: "Mówiąc: Bóg go opuścił, ścigajcie go i złapcie, bo nie ma nikogo, kto by go wyzwolił."
  tags: []
"Ps71,12":
  text: "Boże, nie bądź daleko ode mnie; mój Boże, pośpiesz mi na pomoc."
  tags: []
"Ps71,13":
  text: "Niech się zawstydzą i zginą przeciwnicy mojej duszy, niech się okryją hańbą i wstydem ci, którzy szukają mojej krzywdy."
  tags: []
"Ps71,14":
  text: "Ja natomiast wciąż będę ufał i pomnożę wszelką Twoją chwałę."
  tags: []
"Ps71,15":
  text: "Moje usta ogłaszać będą Twoją sprawiedliwość przez cały dzień i Twoje zbawienie, choć nie znam ich miary."
  tags: []
"Ps71,16":
  text: "Przyjdę w potędze JHWH PANA, będę wspominał tylko Twoją sprawiedliwość."
  tags: []
"Ps71,17":
  text: "Boże, uczyłeś mnie od mojej młodości i aż dotąd ogłaszam Twoje cudowne dzieła."
  tags: []
"Ps71,18":
  text: "Również do starości i siwizny nie opuszczaj mnie, Boże, dopóki o Twoim ramieniu nie oznajmię temu pokoleniu i każdemu przychodzącemu o Twojej potędze."
  tags: []
"Ps71,19":
  text: "Twoja sprawiedliwość, Boże, sięga aż do wyżyn nieba, uczyniłeś wielkie rzeczy; Boże, któż jest podobny do Ciebie?"
  tags: []
"Ps71,20":
  text: "Ty, który sprawiłeś, że doświadczyliśmy wiele trudności i nieszczęść, ponownie przywrócisz mnie do życia i ponownie podniesiesz mnie z głębin ziemi."
  tags: []
"Ps71,21":
  text: "Pomnożysz moją wielkość i otoczysz mnie opieką."
  tags: []
"Ps71,22":
  text: "A ja na harfie będę wysławiał Ciebie i Twoją wierność, mój Boże; będę Ci grał na cytrze, Święty Izraela!"
  tags: []
"Ps71,23":
  text: "Rozradują się moje wargi, gdy będę Ci śpiewał, i moja dusza, którą odkupiłeś."
  tags: []
"Ps71,24":
  text: "Również mój język będzie głosił przez cały dzień Twoją sprawiedliwość, bo okryli się wstydem i hańbą ci, którzy szukają mojej krzywdy."
  tags: []
