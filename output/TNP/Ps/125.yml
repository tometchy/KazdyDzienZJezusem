"Ps125,1": "Pieśń stopni. Ci, którzy ufają JHWH, są jak góra Syjon, która nie zostanie poruszona, ale trwać będzie na wieki."
"Ps125,2": "Spójrzcie na Jerozolimę, otaczają ją góry, tak właśnie JHWH otacza swój lud, teraz i na wieki."
"Ps125,3": "Bo nie spocznie berło niegodziwych nad losem sprawiedliwych, po to, by sprawiedliwi nie wyciągali swoich rąk ku nieprawości."
"Ps125,4": "Czyń dobrze, JHWH, dobrym i tym, którzy są prawego serca."
"Ps125,5": "A zbaczających na swoje kręte drogi, JHWH odprawi wraz z czyniącymi nieprawość. Pokój nad Izraelem."
