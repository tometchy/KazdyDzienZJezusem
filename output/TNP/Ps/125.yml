"Ps125,1":
  text: "Pieśń stopni. Ci, którzy ufają JHWH, są jak góra Syjon, która nie zostanie poruszona, ale trwać będzie na wieki."
  tags: []
"Ps125,2":
  text: "Spójrzcie na Jerozolimę, otaczają ją góry, tak właśnie JHWH otacza swój lud, teraz i na wieki."
  tags: []
"Ps125,3":
  text: "Bo nie spocznie berło niegodziwych nad losem sprawiedliwych, po to, by sprawiedliwi nie wyciągali swoich rąk ku nieprawości."
  tags: []
"Ps125,4":
  text: "Czyń dobrze, JHWH, dobrym i tym, którzy są prawego serca."
  tags: []
"Ps125,5":
  text: "A zbaczających na swoje kręte drogi, JHWH odprawi wraz z czyniącymi nieprawość. Pokój nad Izraelem."
  tags: []
