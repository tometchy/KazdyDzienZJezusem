"Ps80,1": "Posłuchaj, Pasterzu Izraela, Ty, który prowadzisz Józefa jak stado owiec; Ty, który zasiadasz między cherubinami, zajaśniej."
"Ps80,2": "Przed obliczem Efraima, Beniamina i Manassesa wzbudź swoją moc i przyjdź nas zbawić."
"Ps80,3": "Boże, odnów nas, rozjaśnij nad nami swoje oblicze, a zostaniemy wybawieni."
"Ps80,4": "JHWH, Boże Zastępów, jak długo będziesz się gniewał na modlitwę swojego ludu?"
"Ps80,5": "Karmiłeś ich chlebem z łez i napoiłeś ich łzami w pełnej mierze."
"Ps80,6": "Uczyniłeś nas kością niezgody dla naszych sąsiadów, a nasi wrogowie szydzą z nas."
"Ps80,7": "Boże Zastępów, odnów nas, rozjaśnij nad nami swoje oblicze, a zostaniemy wybawieni."
"Ps80,8": "Wyrwałeś winorośl z Egiptu; wygnałeś pogan, a ją zasadziłeś."
"Ps80,9": "Oczyściłeś dla niej grunt i sprawiłeś, że zapuściła swoje korzenie i napełniła ziemię."
"Ps80,10": "Góry zostały okryte jej cieniem, a jej gałęziami potężne cedry."
"Ps80,11": "Wypuściła swoją latorośl aż do Morza i swoje pędy aż do Rzeki."
"Ps80,12": "Dlaczego więc rozwaliłeś jej ogrodzenie, tak że zrywają z niej wszyscy, którzy przechodzą drogą?"
"Ps80,13": "Obgryza ją dzik z lasu, a zwierzę polne karmi się nią."
"Ps80,14": "Boże Zastępów, powróć, spójrz z niebios i zobacz, zwróć uwagę na tę winorośl;"
"Ps80,15": "I na pęd, który zasadziła Twoja prawica, na syna, którego umocniłeś dla siebie."
"Ps80,16": "Spalona jest ogniem i wycięta; poginą z powodu grozy Twojego oblicza."
"Ps80,17": "Niech Twoja ręka będzie nad mężem Twojej prawicy, nad synem człowieczym, którego umocniłeś dla siebie."
"Ps80,18": "A nie odstąpimy od Ciebie; ożyw nas, a będziemy wzywać Twojego imienia."
"Ps80,19": "JHWH, Boże Zastępów, odnów nas, rozjaśnij nad nami swoje oblicze, a będziemy wybawieni."
