"Ps80,1":
  text: "Posłuchaj, Pasterzu Izraela, Ty, który prowadzisz Józefa jak stado owiec; Ty, który zasiadasz między cherubinami, zajaśniej."
  tags: []
"Ps80,2":
  text: "Przed obliczem Efraima, Beniamina i Manassesa wzbudź swoją moc i przyjdź nas zbawić."
  tags: []
"Ps80,3":
  text: "Boże, odnów nas, rozjaśnij nad nami swoje oblicze, a zostaniemy wybawieni."
  tags: []
"Ps80,4":
  text: "JHWH, Boże Zastępów, jak długo będziesz się gniewał na modlitwę swojego ludu?"
  tags: []
"Ps80,5":
  text: "Karmiłeś ich chlebem z łez i napoiłeś ich łzami w pełnej mierze."
  tags: []
"Ps80,6":
  text: "Uczyniłeś nas kością niezgody dla naszych sąsiadów, a nasi wrogowie szydzą z nas."
  tags: []
"Ps80,7":
  text: "Boże Zastępów, odnów nas, rozjaśnij nad nami swoje oblicze, a zostaniemy wybawieni."
  tags: []
"Ps80,8":
  text: "Wyrwałeś winorośl z Egiptu; wygnałeś pogan, a ją zasadziłeś."
  tags: []
"Ps80,9":
  text: "Oczyściłeś dla niej grunt i sprawiłeś, że zapuściła swoje korzenie i napełniła ziemię."
  tags: []
"Ps80,10":
  text: "Góry zostały okryte jej cieniem, a jej gałęziami potężne cedry."
  tags: []
"Ps80,11":
  text: "Wypuściła swoją latorośl aż do Morza i swoje pędy aż do Rzeki."
  tags: []
"Ps80,12":
  text: "Dlaczego więc rozwaliłeś jej ogrodzenie, tak że zrywają z niej wszyscy, którzy przechodzą drogą?"
  tags: []
"Ps80,13":
  text: "Obgryza ją dzik z lasu, a zwierzę polne karmi się nią."
  tags: []
"Ps80,14":
  text: "Boże Zastępów, powróć, spójrz z niebios i zobacz, zwróć uwagę na tę winorośl;"
  tags: []
"Ps80,15":
  text: "I na pęd, który zasadziła Twoja prawica, na syna, którego umocniłeś dla siebie."
  tags: []
"Ps80,16":
  text: "Spalona jest ogniem i wycięta; poginą z powodu grozy Twojego oblicza."
  tags: []
"Ps80,17":
  text: "Niech Twoja ręka będzie nad mężem Twojej prawicy, nad synem człowieczym, którego umocniłeś dla siebie."
  tags: []
"Ps80,18":
  text: "A nie odstąpimy od Ciebie; ożyw nas, a będziemy wzywać Twojego imienia."
  tags: []
"Ps80,19":
  text: "JHWH, Boże Zastępów, odnów nas, rozjaśnij nad nami swoje oblicze, a będziemy wybawieni."
  tags: []
