"Ps127,1":
  text: "Pieśń stopni. Salomona. Jeśli JHWH domu nie zbuduje, na próżno będą trudzić się nad nim budujący. Jeśli JHWH nie strzeże miasta, na próżno czuwa strażnik."
  tags: []
"Ps127,2":
  text: "Daremne to dla was, wy wcześnie wstający, przesiadywać do późna i w smutku jeść chleb. O tak, On daje sen swojemu umiłowanemu."
  tags: []
"Ps127,3":
  text: "Oto synowie są dziedzictwem JHWH, a owoc łona nagrodą."
  tags: []
"Ps127,4":
  text: "Czym strzały w ręku mocarza, tym są synowie zrodzeni za młodu."
  tags: []
"Ps127,5":
  text: "Błogosławiony ten mąż, który napełnił nimi swój kołczan; nie doznają wstydu, gdy w bramie będą prowadzić spór z nieprzyjaciółmi."
  tags: []
