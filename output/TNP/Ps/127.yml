"Ps127,1": "Pieśń stopni. Salomona. Jeśli JHWH domu nie zbuduje, na próżno będą trudzić się nad nim budujący. Jeśli JHWH nie strzeże miasta, na próżno czuwa strażnik."
"Ps127,2": "Daremne to dla was, wy wcześnie wstający, przesiadywać do późna i w smutku jeść chleb. O tak, On daje sen swojemu umiłowanemu."
"Ps127,3": "Oto synowie są dziedzictwem JHWH, a owoc łona nagrodą."
"Ps127,4": "Czym strzały w ręku mocarza, tym są synowie zrodzeni za młodu."
"Ps127,5": "Błogosławiony ten mąż, który napełnił nimi swój kołczan; nie doznają wstydu, gdy w bramie będą prowadzić spór z nieprzyjaciółmi."
