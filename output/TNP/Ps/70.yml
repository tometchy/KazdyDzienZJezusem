"Ps70,1":
  text: "Boże, wyrwij mnie; JHWH, pośpiesz mi na pomoc."
  tags: []
"Ps70,2":
  text: "Niech się zawstydzą i zarumienią ci, którzy szukają mojej duszy; niech zostaną odciągnięci w tył i upokorzeni ci, którzy pragną mojej krzywdy."
  tags: []
"Ps70,3":
  text: "Niech się cofną z powodu swojej hańby ci, którzy mówią: Ha, ha!"
  tags: []
"Ps70,4":
  text: "Niech się weselą i radują w Tobie wszyscy, którzy Cię szukają; niech ci, którzy miłują Twoje zbawienie, mówią stale: Niech Bóg będzie wywyższony!"
  tags: []
"Ps70,5":
  text: "Ja natomiast jestem nędzny i ubogi, Boże, pośpiesz mi na pomoc! Ty jesteś tym, który mnie wyzwala; JHWH, nie zwlekaj."
  tags: []
