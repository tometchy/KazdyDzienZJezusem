"Ps70,1": "Boże, wyrwij mnie; JHWH, pośpiesz mi na pomoc."
"Ps70,2": "Niech się zawstydzą i zarumienią ci, którzy szukają mojej duszy; niech zostaną odciągnięci w tył i upokorzeni ci, którzy pragną mojej krzywdy."
"Ps70,3": "Niech się cofną z powodu swojej hańby ci, którzy mówią: Ha, ha!"
"Ps70,4": "Niech się weselą i radują w Tobie wszyscy, którzy Cię szukają; niech ci, którzy miłują Twoje zbawienie, mówią stale: Niech Bóg będzie wywyższony!"
"Ps70,5": "Ja natomiast jestem nędzny i ubogi, Boże, pośpiesz mi na pomoc! Ty jesteś tym, który mnie wyzwala; JHWH, nie zwlekaj."
