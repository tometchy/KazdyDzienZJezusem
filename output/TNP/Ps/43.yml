"Ps43,1": "Osądź mnie, Boże, i rozstrzygnij mój spór z tym nieświętym narodem! Och! Wybaw mnie od człowieka fałszywego i niesprawiedliwego!"
"Ps43,2": "Bo Ty jesteś Bogiem mojej twierdzy. Dlaczego mnie odrzuciłeś? Dlaczego chodzę zasępiony z powodu ucisku wroga?"
"Ps43,3": "Ześlij Twoje światło i Twoją prawdę, niech mnie przyprowadzą i wprowadzą na Twoją świętą górę i do Twojego miejsca zamieszkania."
"Ps43,4": "Wtedy przyjdę do ołtarza Bożego, do Boga mojego wesela i radości; będę Cię wysławiał na cytrze, Boże, mój Boże."
"Ps43,5": "Dlaczego się smucisz, moja duszo, i dlaczego jesteś we mnie zatrwożona? Zaufaj Bogu, bo jeszcze będę Go wysławiał, On jest ocaleniem mojego oblicza i On moim Bogiem."
