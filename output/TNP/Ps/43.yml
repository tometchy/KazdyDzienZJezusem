"Ps43,1":
  text: "Osądź mnie, Boże, i rozstrzygnij mój spór z tym nieświętym narodem! Och! Wybaw mnie od człowieka fałszywego i niesprawiedliwego!"
  tags: []
"Ps43,2":
  text: "Bo Ty jesteś Bogiem mojej twierdzy. Dlaczego mnie odrzuciłeś? Dlaczego chodzę zasępiony z powodu ucisku wroga?"
  tags: []
"Ps43,3":
  text: "Ześlij Twoje światło i Twoją prawdę, niech mnie przyprowadzą i wprowadzą na Twoją świętą górę i do Twojego miejsca zamieszkania."
  tags: []
"Ps43,4":
  text: "Wtedy przyjdę do ołtarza Bożego, do Boga mojego wesela i radości; będę Cię wysławiał na cytrze, Boże, mój Boże."
  tags: []
"Ps43,5":
  text: "Dlaczego się smucisz, moja duszo, i dlaczego jesteś we mnie zatrwożona? Zaufaj Bogu, bo jeszcze będę Go wysławiał, On jest ocaleniem mojego oblicza i On moim Bogiem."
  tags: []
