"Ps46,1":
  text: "Bóg jest naszym schronieniem i siłą, niezmierną pomocą dającą się znaleźć w czasie utrapienia."
  tags: []
"Ps46,2":
  text: "Dlatego nie będziemy się bać, choćby się zapadła ziemia, choćby się zsunęły góry w samo wnętrze mórz;"
  tags: []
"Ps46,3":
  text: "Choćby zaszumiały i zawrzały ich wody, i zatrzęsły się góry od jego wzburzenia. Sela."
  tags: []
"Ps46,4":
  text: "Jest rzeka, której nurty rozweselą miasto Boże, święte mieszkanie Najwyższego."
  tags: []
"Ps46,5":
  text: "Bóg jest wewnątrz niego, nie będzie się ono chwiać; Bóg wspomoże je gdy będzie zbliżał się poranek."
  tags: []
"Ps46,6":
  text: "Wzburzyły się narody, zachwiały się królestwa, gdy On wydał swój głos, rozpłynęła się ziemia."
  tags: []
"Ps46,7":
  text: "JHWH Zastępów jest z nami; Bóg Jakuba jest naszą twierdzą. Sela."
  tags: []
"Ps46,8":
  text: "Chodźcie, zobaczcie dzieła JHWH, którymi dokonał spustoszenia na ziemi."
  tags: []
"Ps46,9":
  text: "On położył kres wojnom aż po krańce ziemi, kruszy łuk i łamie włócznie, a wozy spali w ogniu."
  tags: []
"Ps46,10":
  text: "Uciszcie się i uznajcie, że Ja jestem Bogiem; będę wywyższony wśród narodów, będę wywyższony na ziemi."
  tags: []
"Ps46,11":
  text: "JHWH Zastępów jest z nami, Bóg Jakuba jest naszą twierdzą. Sela."
  tags: []
