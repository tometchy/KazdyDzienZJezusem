"Ps46,1": "Bóg jest naszym schronieniem i siłą, niezmierną pomocą dającą się znaleźć w czasie utrapienia."
"Ps46,2": "Dlatego nie będziemy się bać, choćby się zapadła ziemia, choćby się zsunęły góry w samo wnętrze mórz;"
"Ps46,3": "Choćby zaszumiały i zawrzały ich wody, i zatrzęsły się góry od jego wzburzenia. Sela."
"Ps46,4": "Jest rzeka, której nurty rozweselą miasto Boże, święte mieszkanie Najwyższego."
"Ps46,5": "Bóg jest wewnątrz niego, nie będzie się ono chwiać; Bóg wspomoże je gdy będzie zbliżał się poranek."
"Ps46,6": "Wzburzyły się narody, zachwiały się królestwa, gdy On wydał swój głos, rozpłynęła się ziemia."
"Ps46,7": "JHWH Zastępów jest z nami; Bóg Jakuba jest naszą twierdzą. Sela."
"Ps46,8": "Chodźcie, zobaczcie dzieła JHWH, którymi dokonał spustoszenia na ziemi."
"Ps46,9": "On położył kres wojnom aż po krańce ziemi, kruszy łuk i łamie włócznie, a wozy spali w ogniu."
"Ps46,10": "Uciszcie się i uznajcie, że Ja jestem Bogiem; będę wywyższony wśród narodów, będę wywyższony na ziemi."
"Ps46,11": "JHWH Zastępów jest z nami, Bóg Jakuba jest naszą twierdzą. Sela."
