"Ps56,1":
  text: "Zmiłuj się nade mną, Boże, bo prześladuje mnie człowiek; napiera na mnie walcząc każdego dnia."
  tags: []
"Ps56,2":
  text: "Moi wrogowie każdego dnia chcą mnie zmiażdżyć; wielu bowiem walczy przeciwko mnie, o Najwyższy."
  tags: []
"Ps56,3":
  text: "W dniu, gdy będę się lękał, zaufam Tobie."
  tags: []
"Ps56,4":
  text: "W Bogu będę wysławiać Jego słowo; Bogu ufam i nie będę się lękał, co zrobi mi człowiek?"
  tags: []
"Ps56,5":
  text: "Każdego dnia przekręcają moje słowa, przeciwko mnie wszelkie ich złe zamysły."
  tags: []
"Ps56,6":
  text: "Wszczynają kłótnie wobec mnie, w tajemnicy śledzą moje kroki, czyhając na moją duszę."
  tags: []
"Ps56,7":
  text: "Czy uciekną pomimo nieprawości? Boże, powal te narody w swoim gniewie."
  tags: []
"Ps56,8":
  text: "Ty policzyłeś dni mojej tułaczki, Ty sam umieść moje łzy w Twoim bukłaku; czyż nie są one spisane w Twoim zwoju?"
  tags: []
"Ps56,9":
  text: "Kiedy zawrócą na tyły moi wrogowie; wtedy zawołam: To wiem, z pewnością Bóg jest ze mną!"
  tags: []
"Ps56,10":
  text: "W Bogu będę wysławiać Jego słowo, w JHWH będę chwalić Jego słowo."
  tags: []
"Ps56,11":
  text: "Bogu ufam i nie będę się lękał, co zrobi mi człowiek."
  tags: []
"Ps56,12":
  text: "Tobie, Boże, złożyłem śluby, dlatego też Tobie oddam chwałę."
  tags: []
"Ps56,13":
  text: "Ponieważ wyrwałeś moją duszę od śmierci, czyż nie uchroniłeś mych nóg od upadku, abym przechadzał się przed Bogiem w światłości życia?"
  tags: []
