"Ps56,1": "Zmiłuj się nade mną, Boże, bo prześladuje mnie człowiek; napiera na mnie walcząc każdego dnia."
"Ps56,2": "Moi wrogowie każdego dnia chcą mnie zmiażdżyć; wielu bowiem walczy przeciwko mnie, o Najwyższy."
"Ps56,3": "W dniu, gdy będę się lękał, zaufam Tobie."
"Ps56,4": "W Bogu będę wysławiać Jego słowo; Bogu ufam i nie będę się lękał, co zrobi mi człowiek?"
"Ps56,5": "Każdego dnia przekręcają moje słowa, przeciwko mnie wszelkie ich złe zamysły."
"Ps56,6": "Wszczynają kłótnie wobec mnie, w tajemnicy śledzą moje kroki, czyhając na moją duszę."
"Ps56,7": "Czy uciekną pomimo nieprawości? Boże, powal te narody w swoim gniewie."
"Ps56,8": "Ty policzyłeś dni mojej tułaczki, Ty sam umieść moje łzy w Twoim bukłaku; czyż nie są one spisane w Twoim zwoju?"
"Ps56,9": "Kiedy zawrócą na tyły moi wrogowie; wtedy zawołam: To wiem, z pewnością Bóg jest ze mną!"
"Ps56,10": "W Bogu będę wysławiać Jego słowo, w JHWH będę chwalić Jego słowo."
"Ps56,11": "Bogu ufam i nie będę się lękał, co zrobi mi człowiek."
"Ps56,12": "Tobie, Boże, złożyłem śluby, dlatego też Tobie oddam chwałę."
"Ps56,13": "Ponieważ wyrwałeś moją duszę od śmierci, czyż nie uchroniłeś mych nóg od upadku, abym przechadzał się przed Bogiem w światłości życia?"
