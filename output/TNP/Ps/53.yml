"Ps53,1":
  text: "Głupi mówi w swoim sercu: Nie ma Boga. Są zepsuci i czynią obrzydliwą nieprawość; nie ma nikogo, kto by czynił dobro."
  tags: []
"Ps53,2":
  text: "Bóg spojrzał w dół z niebios na synów ludzkich, aby zobaczyć, czy jest ktoś rozumny i szukający Boga."
  tags: []
"Ps53,3":
  text: "Każdy z nich zboczył z drogi i razem znikczemnieli; nie ma nikogo, kto by czynił dobro, nie ma ani jednego."
  tags: []
"Ps53,4":
  text: "Czy nie mają poznania wszyscy czyniący nieprawość, jedzący mój lud, tak jak zjedli chleb, do Boga nie zawołali."
  tags: []
"Ps53,5":
  text: "Tam zadrżeli ze strachu, gdzie właśnie nie było strachu, Bóg bowiem już rozrzucił kości tych, którzy cię oblegali; ty ich zawstydziłeś, bo Bóg nimi wzgardził."
  tags: []
"Ps53,6":
  text: "Kto da z Syjonu zbawienie Izraelowi? Gdy Bóg odwróci niewolę swojego ludu, niech Jakub się rozraduje i rozweseli się Izrael."
  tags: []
