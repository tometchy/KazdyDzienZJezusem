"Ps53,1": "Głupi mówi w swoim sercu: Nie ma Boga. Są zepsuci i czynią obrzydliwą nieprawość; nie ma nikogo, kto by czynił dobro."
"Ps53,2": "Bóg spojrzał w dół z niebios na synów ludzkich, aby zobaczyć, czy jest ktoś rozumny i szukający Boga."
"Ps53,3": "Każdy z nich zboczył z drogi i razem znikczemnieli; nie ma nikogo, kto by czynił dobro, nie ma ani jednego."
"Ps53,4": "Czy nie mają poznania wszyscy czyniący nieprawość, jedzący mój lud, tak jak zjedli chleb, do Boga nie zawołali."
"Ps53,5": "Tam zadrżeli ze strachu, gdzie właśnie nie było strachu, Bóg bowiem już rozrzucił kości tych, którzy cię oblegali; ty ich zawstydziłeś, bo Bóg nimi wzgardził."
"Ps53,6": "Kto da z Syjonu zbawienie Izraelowi? Gdy Bóg odwróci niewolę swojego ludu, niech Jakub się rozraduje i rozweseli się Izrael."
