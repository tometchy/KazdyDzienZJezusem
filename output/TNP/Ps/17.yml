"Ps17,1": "Modlitwa Dawida. Wysłuchaj JHWH mojej słusznej sprawy, zważ na moje wołanie, nakłoń ucha na modlitwę płynącą z moich niepodstępnych ust!"
"Ps17,2": "Niech wyrok o mnie wyjdzie sprzed Twojego oblicza, niech Twoje oczy ujrzą to, co prawe."
"Ps17,3": "Doświadczyłeś moje serce, nawiedziłeś mnie nocą, wypróbowałeś mnie ogniem, ale nic nie znalazłeś. Postanowiłem, że moje usta nie dopuszczą się wykroczenia."
"Ps17,4": "Co do czynów ludzkich, dzięki słowom Twoich ust ustrzegłem się dróg przestępcy."
"Ps17,5": "Zatrzymaj moje kroki na Twoich drogach, aby nie zachwiały się moje stopy."
"Ps17,6": "Wołam do Ciebie, Boże, bo mi odpowiesz. Nakłoń ku mnie swoje ucho, usłysz moje słowa."
"Ps17,7": "Okaż swoje miłosierdzie, Ty, który wybawiasz ufających Tobie od tych, którzy powstają przeciwko Twojej prawicy."
"Ps17,8": "Strzeż mnie jak źrenicy oka, ukryj mnie w cieniu swoich skrzydeł;"
"Ps17,9": "Przed obliczem niegodziwych, którzy mnie gnębią, przed wrogami mojej duszy, którzy mnie otaczają."
"Ps17,10": "Okryli się swoim tłuszczem, wyniośle mówią swoimi ustami."
"Ps17,11": "Gdy ruszamy – otaczają nas, swoimi oczami wodzą, by nas powalić na ziemię."
"Ps17,12": "Podobni są do lwa pragnącego łupu, do lwiątka siedzącego w ukryciu."
"Ps17,13": "Powstań, JHWH, wystąp przeciwko jego obliczu i powal go, swoim mieczem uratuj moją duszę przed niegodziwym;"
"Ps17,14": "A swoją ręką JHWH, od ludzi, od ludzi tego świata, których dział jest w tym życiu, a których brzuch napełniasz swoimi skarbami, tak że nasycą się synowie, a nadmiar pozostawią swoim dzieciom."
"Ps17,15": "Ja natomiast ze względu na sprawiedliwość ujrzę Twoje oblicze, a gdy się obudzę, nasycę się Twoim podobieństwem."
