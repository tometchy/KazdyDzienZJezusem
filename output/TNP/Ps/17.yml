"Ps17,1":
  text: "Modlitwa Dawida. Wysłuchaj JHWH mojej słusznej sprawy, zważ na moje wołanie, nakłoń ucha na modlitwę płynącą z moich niepodstępnych ust!"
  tags: []
"Ps17,2":
  text: "Niech wyrok o mnie wyjdzie sprzed Twojego oblicza, niech Twoje oczy ujrzą to, co prawe."
  tags: []
"Ps17,3":
  text: "Doświadczyłeś moje serce, nawiedziłeś mnie nocą, wypróbowałeś mnie ogniem, ale nic nie znalazłeś. Postanowiłem, że moje usta nie dopuszczą się wykroczenia."
  tags: []
"Ps17,4":
  text: "Co do czynów ludzkich, dzięki słowom Twoich ust ustrzegłem się dróg przestępcy."
  tags: []
"Ps17,5":
  text: "Zatrzymaj moje kroki na Twoich drogach, aby nie zachwiały się moje stopy."
  tags: []
"Ps17,6":
  text: "Wołam do Ciebie, Boże, bo mi odpowiesz. Nakłoń ku mnie swoje ucho, usłysz moje słowa."
  tags: []
"Ps17,7":
  text: "Okaż swoje miłosierdzie, Ty, który wybawiasz ufających Tobie od tych, którzy powstają przeciwko Twojej prawicy."
  tags: []
"Ps17,8":
  text: "Strzeż mnie jak źrenicy oka, ukryj mnie w cieniu swoich skrzydeł;"
  tags: []
"Ps17,9":
  text: "Przed obliczem niegodziwych, którzy mnie gnębią, przed wrogami mojej duszy, którzy mnie otaczają."
  tags: []
"Ps17,10":
  text: "Okryli się swoim tłuszczem, wyniośle mówią swoimi ustami."
  tags: []
"Ps17,11":
  text: "Gdy ruszamy – otaczają nas, swoimi oczami wodzą, by nas powalić na ziemię."
  tags: []
"Ps17,12":
  text: "Podobni są do lwa pragnącego łupu, do lwiątka siedzącego w ukryciu."
  tags: []
"Ps17,13":
  text: "Powstań, JHWH, wystąp przeciwko jego obliczu i powal go, swoim mieczem uratuj moją duszę przed niegodziwym;"
  tags: []
"Ps17,14":
  text: "A swoją ręką JHWH, od ludzi, od ludzi tego świata, których dział jest w tym życiu, a których brzuch napełniasz swoimi skarbami, tak że nasycą się synowie, a nadmiar pozostawią swoim dzieciom."
  tags: []
"Ps17,15":
  text: "Ja natomiast ze względu na sprawiedliwość ujrzę Twoje oblicze, a gdy się obudzę, nasycę się Twoim podobieństwem."
  tags: []
