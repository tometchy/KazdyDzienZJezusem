"Ps66,1": "Radośnie wykrzykujcie Bogu, ludzie całej ziemi;"
"Ps66,2": "Śpiewajcie na chwałę Jego imienia, oddawajcie Mu chwałę pieśnią chwały."
"Ps66,3": "Powiedzcie Bogu: Jak przerażające są Twoje dzieła! Z powodu Twojej wielkiej mocy będą płaszczyć się przed Tobą Twoi wrogowie."
"Ps66,4": "Cała ziemia odda Ci pokłon i wysławiać Cię będzie śpiewem; śpiewać będzie Twojemu imieniu. Sela."
"Ps66,5": "Chodźcie i przypatrujcie się dziełom Boga, przerażający czyn wobec synów ludzkich:"
"Ps66,6": "Zamienił morze na suchy ląd, pieszo przeszli przez rzekę; aż dotąd radujmy się w Nim."
"Ps66,7": "Włada w swojej potędze na wieki, Jego oczy patrzą na narody, buntujący się nie będą wywyższeni. Sela."
"Ps66,8": "Błogosławcie, narody, naszego Boga i spowodujcie, by usłyszano głos na Jego chwałę."
"Ps66,9": "Zachował wśród żywych naszą duszę i nie dał się zachwiać naszym nogom."
"Ps66,10": "Istotnie, doświadczyłeś nas, Boże, wypróbowałeś nas ogniem, tak jak srebro jest próbowane."
"Ps66,11": "Wprowadziłeś nas w sidła, włożyłeś ucisk na nasze biodra."
"Ps66,12": "Pozwoliłeś człowiekowi jeździć po naszych głowach, przeszliśmy przez ogień i wodę, ale nas wyprowadziłeś na miejsce obfitości."
"Ps66,13": "Wejdę więc do Twojego domu z ofiarami całopalnymi i wypełnię dla Ciebie moje ślubowania;"
"Ps66,14": "Które złożyły moje wargi i wypowiedziały moje usta w mojej niedoli."
"Ps66,15": "Ofiaruję Ci ofiary całopalne z tucznych zwierząt wraz z wonnością baranów, ofiaruję Ci woły i kozły. Sela."
"Ps66,16": "Chodźcie, słuchajcie wszyscy, którzy się boicie Boga, a opowiem, co uczynił dla mojej duszy."
"Ps66,17": "Do Niego wołałem moimi ustami i wywyższałem Go moim językiem."
"Ps66,18": "Jeśli rozważałem nieprawość w swoim sercu, to PAN mnie nie wysłucha."
"Ps66,19": "Doprawdy, Bóg wysłuchał, przychylił się do głosu mojej modlitwy."
"Ps66,20": "Błogosławiony Bóg, który nie odrzucił mojej modlitwy i nie odmówił mi swojego miłosierdzia."
