"Ps66,1":
  text: "Radośnie wykrzykujcie Bogu, ludzie całej ziemi;"
  tags: []
"Ps66,2":
  text: "Śpiewajcie na chwałę Jego imienia, oddawajcie Mu chwałę pieśnią chwały."
  tags: []
"Ps66,3":
  text: "Powiedzcie Bogu: Jak przerażające są Twoje dzieła! Z powodu Twojej wielkiej mocy będą płaszczyć się przed Tobą Twoi wrogowie."
  tags: []
"Ps66,4":
  text: "Cała ziemia odda Ci pokłon i wysławiać Cię będzie śpiewem; śpiewać będzie Twojemu imieniu. Sela."
  tags: []
"Ps66,5":
  text: "Chodźcie i przypatrujcie się dziełom Boga, przerażający czyn wobec synów ludzkich:"
  tags: []
"Ps66,6":
  text: "Zamienił morze na suchy ląd, pieszo przeszli przez rzekę; aż dotąd radujmy się w Nim."
  tags: []
"Ps66,7":
  text: "Włada w swojej potędze na wieki, Jego oczy patrzą na narody, buntujący się nie będą wywyższeni. Sela."
  tags: []
"Ps66,8":
  text: "Błogosławcie, narody, naszego Boga i spowodujcie, by usłyszano głos na Jego chwałę."
  tags: []
"Ps66,9":
  text: "Zachował wśród żywych naszą duszę i nie dał się zachwiać naszym nogom."
  tags: []
"Ps66,10":
  text: "Istotnie, doświadczyłeś nas, Boże, wypróbowałeś nas ogniem, tak jak srebro jest próbowane."
  tags: []
"Ps66,11":
  text: "Wprowadziłeś nas w sidła, włożyłeś ucisk na nasze biodra."
  tags: []
"Ps66,12":
  text: "Pozwoliłeś człowiekowi jeździć po naszych głowach, przeszliśmy przez ogień i wodę, ale nas wyprowadziłeś na miejsce obfitości."
  tags: []
"Ps66,13":
  text: "Wejdę więc do Twojego domu z ofiarami całopalnymi i wypełnię dla Ciebie moje ślubowania;"
  tags: []
"Ps66,14":
  text: "Które złożyły moje wargi i wypowiedziały moje usta w mojej niedoli."
  tags: []
"Ps66,15":
  text: "Ofiaruję Ci ofiary całopalne z tucznych zwierząt wraz z wonnością baranów, ofiaruję Ci woły i kozły. Sela."
  tags: []
"Ps66,16":
  text: "Chodźcie, słuchajcie wszyscy, którzy się boicie Boga, a opowiem, co uczynił dla mojej duszy."
  tags: []
"Ps66,17":
  text: "Do Niego wołałem moimi ustami i wywyższałem Go moim językiem."
  tags: []
"Ps66,18":
  text: "Jeśli rozważałem nieprawość w swoim sercu, to PAN mnie nie wysłucha."
  tags: []
"Ps66,19":
  text: "Doprawdy, Bóg wysłuchał, przychylił się do głosu mojej modlitwy."
  tags: []
"Ps66,20":
  text: "Błogosławiony Bóg, który nie odrzucił mojej modlitwy i nie odmówił mi swojego miłosierdzia."
  tags: []
