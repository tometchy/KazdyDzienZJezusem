"Ps132,1":
  text: "Pieśń stopni. Pamiętaj, JHWH, Dawidowi całe jego udręczenie!"
  tags: []
"Ps132,2":
  text: "Który przysiągł JHWH i ślubował Mocarzowi Jakuba, mówiąc:"
  tags: []
"Ps132,3":
  text: "Nie wejdę do przybytku, do mojego domu, i nie wstąpię na posłanie mojego łoża;"
  tags: []
"Ps132,4":
  text: "I nie dam zasnąć moim oczom ani drzemać swoim powiekom;"
  tags: []
"Ps132,5":
  text: "Dopóki nie znajdę miejsca dla JHWH, przybytku dla Mocarza Jakuba."
  tags: []
"Ps132,6":
  text: "Oto usłyszeliśmy o niej w Efrata, znaleźliśmy ją na polach Jaaru."
  tags: []
"Ps132,7":
  text: "Wejdźmy do Jego przybytku, oddajmy pokłon u podnóżka Jego stóp."
  tags: []
"Ps132,8":
  text: "Powstań, JHWH, i wejdź do miejsca Twojego odpoczynku, Ty i arka Twojej mocy."
  tags: []
"Ps132,9":
  text: "Niech Twoi kapłani ubiorą się w sprawiedliwość, a Twoi święci niech wykrzykują z radości."
  tags: []
"Ps132,10":
  text: "Ze względu na Dawida, Twojego sługę, nie odwracaj oblicza od Twojego pomazańca."
  tags: []
"Ps132,11":
  text: "Przysiągł JHWH Dawidowi prawdę i nie wycofa się z niej: Z owocu twojego łona posadzę następcę na twoim tronie."
  tags: []
"Ps132,12":
  text: "Jeśli twoi synowie będą strzegli mojego przymierza i moich świadectw, których ich nauczyłem, to również ich synowie aż na wieki będą siedzieli na twoim tronie."
  tags: []
"Ps132,13":
  text: "JHWH bowiem wybrał Syjon i zapragnął go na mieszkanie dla siebie:"
  tags: []
"Ps132,14":
  text: "To jest miejsce mojego odpocznienia aż na wieki; tu będę mieszkał, bo tego zapragnąłem."
  tags: []
"Ps132,15":
  text: "Będę obficie błogosławił jego zaopatrzenie, a jego ubogich nasycę chlebem."
  tags: []
"Ps132,16":
  text: "Jego kapłanów przyodzieję zbawieniem, a jego święci będą wołać radośnie."
  tags: []
"Ps132,17":
  text: "Tam sprawię, że wyrośnie róg Dawida; tam zgotuję pochodnię mojemu pomazańcowi."
  tags: []
"Ps132,18":
  text: "Okryję jego wrogów wstydem, ale nad nim rozbłyśnie jego korona."
  tags: []
