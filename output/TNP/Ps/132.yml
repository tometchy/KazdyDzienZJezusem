"Ps132,1": "Pieśń stopni. Pamiętaj, JHWH, Dawidowi całe jego udręczenie!"
"Ps132,2": "Który przysiągł JHWH i ślubował Mocarzowi Jakuba, mówiąc:"
"Ps132,3": "Nie wejdę do przybytku, do mojego domu, i nie wstąpię na posłanie mojego łoża;"
"Ps132,4": "I nie dam zasnąć moim oczom ani drzemać swoim powiekom;"
"Ps132,5": "Dopóki nie znajdę miejsca dla JHWH, przybytku dla Mocarza Jakuba."
"Ps132,6": "Oto usłyszeliśmy o niej w Efrata, znaleźliśmy ją na polach Jaaru."
"Ps132,7": "Wejdźmy do Jego przybytku, oddajmy pokłon u podnóżka Jego stóp."
"Ps132,8": "Powstań, JHWH, i wejdź do miejsca Twojego odpoczynku, Ty i arka Twojej mocy."
"Ps132,9": "Niech Twoi kapłani ubiorą się w sprawiedliwość, a Twoi święci niech wykrzykują z radości."
"Ps132,10": "Ze względu na Dawida, Twojego sługę, nie odwracaj oblicza od Twojego pomazańca."
"Ps132,11": "Przysiągł JHWH Dawidowi prawdę i nie wycofa się z niej: Z owocu twojego łona posadzę następcę na twoim tronie."
"Ps132,12": "Jeśli twoi synowie będą strzegli mojego przymierza i moich świadectw, których ich nauczyłem, to również ich synowie aż na wieki będą siedzieli na twoim tronie."
"Ps132,13": "JHWH bowiem wybrał Syjon i zapragnął go na mieszkanie dla siebie:"
"Ps132,14": "To jest miejsce mojego odpocznienia aż na wieki; tu będę mieszkał, bo tego zapragnąłem."
"Ps132,15": "Będę obficie błogosławił jego zaopatrzenie, a jego ubogich nasycę chlebem."
"Ps132,16": "Jego kapłanów przyodzieję zbawieniem, a jego święci będą wołać radośnie."
"Ps132,17": "Tam sprawię, że wyrośnie róg Dawida; tam zgotuję pochodnię mojemu pomazańcowi."
"Ps132,18": "Okryję jego wrogów wstydem, ale nad nim rozbłyśnie jego korona."
