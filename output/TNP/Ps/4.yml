"Ps4,1": "Odpowiedz mi, gdy Cię wołam, Boże mojej sprawiedliwości! Ty wyzwoliłeś mnie w czasie ucisku. Okaż mi przychylność i wysłuchaj mojej modlitwy."
"Ps4,2": "Synowie ludzcy, jak długo będziecie znieważać moją chwałę? Jak długo będziecie miłować marność i pożądać będziecie ułudy? Sela."
"Ps4,3": "Wiedzcie, że JHWH oddzielił dla siebie pobożnego. JHWH wysłucha, gdy zawołam do Niego."
"Ps4,4": "Zadrżyjcie i nie grzeszcie. Rozmyślajcie w swoim sercu na łożu i uciszcie się. Sela."
"Ps4,5": "Składajcie ofiary sprawiedliwości i pokładajcie ufność w JHWH."
"Ps4,6": "Wielu mówi: Któż pokaże nam dobro? JHWH, wznieś nad nami światło Twojego oblicza."
"Ps4,7": "Dałeś mojemu sercu więcej radości niż w czasie obfitości ich ziarna i ich moszczu."
"Ps4,8": "W pokoju się położę i zasnę, bo Ty sam, JHWH, sprawiasz, że mieszkam bezpiecznie."
