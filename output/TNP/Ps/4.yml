"Ps4,1":
  text: "Odpowiedz mi, gdy Cię wołam, Boże mojej sprawiedliwości! Ty wyzwoliłeś mnie w czasie ucisku. Okaż mi przychylność i wysłuchaj mojej modlitwy."
  tags: []
"Ps4,2":
  text: "Synowie ludzcy, jak długo będziecie znieważać moją chwałę? Jak długo będziecie miłować marność i pożądać będziecie ułudy? Sela."
  tags: []
"Ps4,3":
  text: "Wiedzcie, że JHWH oddzielił dla siebie pobożnego. JHWH wysłucha, gdy zawołam do Niego."
  tags: []
"Ps4,4":
  text: "Zadrżyjcie i nie grzeszcie. Rozmyślajcie w swoim sercu na łożu i uciszcie się. Sela."
  tags: []
"Ps4,5":
  text: "Składajcie ofiary sprawiedliwości i pokładajcie ufność w JHWH."
  tags: []
"Ps4,6":
  text: "Wielu mówi: Któż pokaże nam dobro? JHWH, wznieś nad nami światło Twojego oblicza."
  tags: []
"Ps4,7":
  text: "Dałeś mojemu sercu więcej radości niż w czasie obfitości ich ziarna i ich moszczu."
  tags: []
"Ps4,8":
  text: "W pokoju się położę i zasnę, bo Ty sam, JHWH, sprawiasz, że mieszkam bezpiecznie."
  tags: []
