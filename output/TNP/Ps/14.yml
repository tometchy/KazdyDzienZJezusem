"Ps14,1": "Dla przewodnika chóru. Dawidowy. Głupi powiedział w swoim sercu: Nie ma Boga. Są zepsuci, popełniają obrzydliwe czyny. Nie ma nikogo, kto by czynił dobro."
"Ps14,2": "JHWH spojrzał z niebios na synów ludzkich, aby zobaczyć, czy jest ktoś rozumny i szukający Boga."
"Ps14,3": "Wszyscy zboczyli z drogi, wszyscy razem znikczemnieli. Nie ma nikogo, kto by czynił dobro, nie ma ani jednego."
"Ps14,4": "Czy nie mają poznania wszyscy czyniący nieprawość, jedzący mój lud, tak jak zjedli chleb, a JHWH nie wzywają?"
"Ps14,5": "Tam zadrżeli z przerażenia, gdyż Bóg jest pośród sprawiedliwego pokolenia."
"Ps14,6": "Szydzicie z rady ubogiego, ale JHWH jest jego ucieczką."
"Ps14,7": "Kto da z Syjonu zbawienie Izraela? Gdy JHWH odwróci niewolę swojego ludu, niech raduje się Jakub i rozweseli się Izrael."
