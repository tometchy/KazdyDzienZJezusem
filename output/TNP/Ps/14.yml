"Ps14,1":
  text: "Dla przewodnika chóru. Dawidowy. Głupi powiedział w swoim sercu: Nie ma Boga. Są zepsuci, popełniają obrzydliwe czyny. Nie ma nikogo, kto by czynił dobro."
  tags: []
"Ps14,2":
  text: "JHWH spojrzał z niebios na synów ludzkich, aby zobaczyć, czy jest ktoś rozumny i szukający Boga."
  tags: []
"Ps14,3":
  text: "Wszyscy zboczyli z drogi, wszyscy razem znikczemnieli. Nie ma nikogo, kto by czynił dobro, nie ma ani jednego."
  tags: []
"Ps14,4":
  text: "Czy nie mają poznania wszyscy czyniący nieprawość, jedzący mój lud, tak jak zjedli chleb, a JHWH nie wzywają?"
  tags: []
"Ps14,5":
  text: "Tam zadrżeli z przerażenia, gdyż Bóg jest pośród sprawiedliwego pokolenia."
  tags: []
"Ps14,6":
  text: "Szydzicie z rady ubogiego, ale JHWH jest jego ucieczką."
  tags: []
"Ps14,7":
  text: "Kto da z Syjonu zbawienie Izraela? Gdy JHWH odwróci niewolę swojego ludu, niech raduje się Jakub i rozweseli się Izrael."
  tags: []
