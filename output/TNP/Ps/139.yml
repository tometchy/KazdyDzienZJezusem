"Ps139,1": "Przewodnikowi chóru. Psalm Dawida. JHWH, zbadałeś mnie i znasz."
"Ps139,2": "Ty wiesz, kiedy siedzę i wstaję, z daleka rozumiesz moją myśl."
"Ps139,3": "Wyznaczasz moją ścieżkę i spoczynek, wszystkie moje drogi są Ci bardzo dobrze znane."
"Ps139,4": "Gdy jeszcze nie ma słowa na moim języku, oto Ty, JHWH, już je całe znasz."
"Ps139,5": "Otaczasz mnie z tyłu i z przodu i położyłeś na mnie swoją rękę."
"Ps139,6": "Zbyt cudowna jest dla mnie Twoja wiedza; zbyt wzniosła, nie zdołam jej pojąć."
"Ps139,7": "Dokąd ujdę przed Twoim Duchem? Dokąd ucieknę przed Twoim obliczem?"
"Ps139,8": "Jeśli wstąpię do niebios, Ty tam jesteś; jeśli przygotuję sobie posłanie w Szeolu – oto Ty i tam jesteś."
"Ps139,9": "Gdybym wziął skrzydła zorzy porannej i zamieszkał na krańcach morza;"
"Ps139,10": "Nawet tam Twoja ręka wiodłaby mnie i Twoja prawica by mnie podtrzymała."
"Ps139,11": "I jeśli powiem: Na pewno spadnie na mnie ciemność i noc zgasi światło wokół mnie."
"Ps139,12": "To nawet ciemność się przed Tobą nie zakryje, bo przez Ciebie noc rozświetli się jak dzień, a ciemność jak światłość."
"Ps139,13": "Ty bowiem stworzyłeś moje nerki; utkałeś mnie w łonie mojej matki."
"Ps139,14": "Wysławiam Cię z powodu tego, że zostałem zdumiewająco udoskonalony. Przedziwne są Twoje dzieła, a moja dusza dobrze je zna."
"Ps139,15": "Moje kości nie były ukryte przed Tobą, gdy zostałem uczyniony w skrytości i utkany w niskości ziemi."
"Ps139,16": "Twoje oczy widziały mą poczętą postać; na Twym zwoju zostały spisane wszystkie moje dni, które zostały wcześniej ustalone, gdy nie było jeszcze ani jednego z nich."
"Ps139,17": "Jak cenne są dla mnie Twoje myśli, Boże! Jak wielka jest ich suma!"
"Ps139,18": "Zliczę je, jednak liczniejsze są niż piasek; rozbudziłem się podczas liczenia i wciąż ja jestem z Tobą."
"Ps139,19": "Obyś tylko zgładził, Boże, niegodziwego; odejdźcie ode mnie ludzie krwi;"
"Ps139,20": "Ci, którzy mówią o Tobie w złym zamiarze, na próżno wspierają Twoich wrogów."
"Ps139,21": "Czyż nienawidzących Ciebie, JHWH, nie mam w obrzydzeniu? I nie czuję wstrętu do tych, którzy powstają przeciwko Tobie?"
"Ps139,22": "Nienawidzę ich pełnią nienawiści i zaliczam ich do nieprzyjaciół."
"Ps139,23": "Zbadaj mnie, Boże, i poznaj moje serce; wypróbuj mnie i poznaj moje rozterki;"
"Ps139,24": "I zobacz, czy nie ma we mnie drogi cierpienia, a prowadź mnie drogą odwieczną."
