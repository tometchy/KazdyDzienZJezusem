"Ps139,1":
  text: "Przewodnikowi chóru. Psalm Dawida. JHWH, zbadałeś mnie i znasz."
  tags: []
"Ps139,2":
  text: "Ty wiesz, kiedy siedzę i wstaję, z daleka rozumiesz moją myśl."
  tags: []
"Ps139,3":
  text: "Wyznaczasz moją ścieżkę i spoczynek, wszystkie moje drogi są Ci bardzo dobrze znane."
  tags: []
"Ps139,4":
  text: "Gdy jeszcze nie ma słowa na moim języku, oto Ty, JHWH, już je całe znasz."
  tags: []
"Ps139,5":
  text: "Otaczasz mnie z tyłu i z przodu i położyłeś na mnie swoją rękę."
  tags: []
"Ps139,6":
  text: "Zbyt cudowna jest dla mnie Twoja wiedza; zbyt wzniosła, nie zdołam jej pojąć."
  tags: []
"Ps139,7":
  text: "Dokąd ujdę przed Twoim Duchem? Dokąd ucieknę przed Twoim obliczem?"
  tags: []
"Ps139,8":
  text: "Jeśli wstąpię do niebios, Ty tam jesteś; jeśli przygotuję sobie posłanie w Szeolu – oto Ty i tam jesteś."
  tags: []
"Ps139,9":
  text: "Gdybym wziął skrzydła zorzy porannej i zamieszkał na krańcach morza;"
  tags: []
"Ps139,10":
  text: "Nawet tam Twoja ręka wiodłaby mnie i Twoja prawica by mnie podtrzymała."
  tags: []
"Ps139,11":
  text: "I jeśli powiem: Na pewno spadnie na mnie ciemność i noc zgasi światło wokół mnie."
  tags: []
"Ps139,12":
  text: "To nawet ciemność się przed Tobą nie zakryje, bo przez Ciebie noc rozświetli się jak dzień, a ciemność jak światłość."
  tags: []
"Ps139,13":
  text: "Ty bowiem stworzyłeś moje nerki; utkałeś mnie w łonie mojej matki."
  tags: []
"Ps139,14":
  text: "Wysławiam Cię z powodu tego, że zostałem zdumiewająco udoskonalony. Przedziwne są Twoje dzieła, a moja dusza dobrze je zna."
  tags: []
"Ps139,15":
  text: "Moje kości nie były ukryte przed Tobą, gdy zostałem uczyniony w skrytości i utkany w niskości ziemi."
  tags: []
"Ps139,16":
  text: "Twoje oczy widziały mą poczętą postać; na Twym zwoju zostały spisane wszystkie moje dni, które zostały wcześniej ustalone, gdy nie było jeszcze ani jednego z nich."
  tags: []
"Ps139,17":
  text: "Jak cenne są dla mnie Twoje myśli, Boże! Jak wielka jest ich suma!"
  tags: []
"Ps139,18":
  text: "Zliczę je, jednak liczniejsze są niż piasek; rozbudziłem się podczas liczenia i wciąż ja jestem z Tobą."
  tags: []
"Ps139,19":
  text: "Obyś tylko zgładził, Boże, niegodziwego; odejdźcie ode mnie ludzie krwi;"
  tags: []
"Ps139,20":
  text: "Ci, którzy mówią o Tobie w złym zamiarze, na próżno wspierają Twoich wrogów."
  tags: []
"Ps139,21":
  text: "Czyż nienawidzących Ciebie, JHWH, nie mam w obrzydzeniu? I nie czuję wstrętu do tych, którzy powstają przeciwko Tobie?"
  tags: []
"Ps139,22":
  text: "Nienawidzę ich pełnią nienawiści i zaliczam ich do nieprzyjaciół."
  tags: []
"Ps139,23":
  text: "Zbadaj mnie, Boże, i poznaj moje serce; wypróbuj mnie i poznaj moje rozterki;"
  tags: []
"Ps139,24":
  text: "I zobacz, czy nie ma we mnie drogi cierpienia, a prowadź mnie drogą odwieczną."
  tags: []
