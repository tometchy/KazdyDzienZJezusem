"Ps143,1": "Psalm Dawida. JHWH! Usłysz moją modlitwę, nadstaw ucha na moje błaganie; odpowiedz mi w swojej wierności i sprawiedliwości."
"Ps143,2": "I nie stawiaj przed sądem swojego sługi, bo wszystko co żyje, nie okaże się sprawiedliwe przed Twoim obliczem."
"Ps143,3": "Bo wróg prześladuje moją duszę, starł na proch moje życie; osadził mnie w ciemności tak jak od dawna umarłych."
"Ps143,4": "A mój duch omdlewa we mnie, i serce wewnątrz się trwoży."
"Ps143,5": "Wspominam dawne dni, rozmyślam o wszystkich Twoich czynach i rozważam dzieło Twoich rąk."
"Ps143,6": "Rozpościeram ku Tobie moje ręce; moja dusza jest jak sucha ziemia. Sela."
"Ps143,7": "Odpowiedz mi szybko, JHWH; mój duch jest już u kresu; nie ukrywaj przede mną swojego oblicza, bym nie był podobny zstępującym do dołu."
"Ps143,8": "Spraw, abym rano słyszał o Twoim miłosierdziu, bo Tobie ufam; oznajmij mi drogę, którą mam chodzić, bo ku Tobie wznoszę moją duszę."
"Ps143,9": "Ocal mnie od moich wrogów, JHWH; u Ciebie się ukryłem."
"Ps143,10": "Naucz mnie czynić Twoją wolę, bo Ty jesteś moim Bogiem. Niech Twój dobry Duch prowadzi mnie do prawej ziemi."
"Ps143,11": "Ożyw mnie, JHWH, dla Twojego imienia; ze względu na Twoją sprawiedliwość wyprowadź moją duszę z niedoli."
"Ps143,12": "W swoim miłosierdziu wytrać moich wrogów i zgładź wszystkich okazujących wrogość mojej duszy, bo ja jestem Twoim sługą."
