"Ps143,1":
  text: "Psalm Dawida. JHWH! Usłysz moją modlitwę, nadstaw ucha na moje błaganie; odpowiedz mi w swojej wierności i sprawiedliwości."
  tags: []
"Ps143,2":
  text: "I nie stawiaj przed sądem swojego sługi, bo wszystko co żyje, nie okaże się sprawiedliwe przed Twoim obliczem."
  tags: []
"Ps143,3":
  text: "Bo wróg prześladuje moją duszę, starł na proch moje życie; osadził mnie w ciemności tak jak od dawna umarłych."
  tags: []
"Ps143,4":
  text: "A mój duch omdlewa we mnie, i serce wewnątrz się trwoży."
  tags: []
"Ps143,5":
  text: "Wspominam dawne dni, rozmyślam o wszystkich Twoich czynach i rozważam dzieło Twoich rąk."
  tags: []
"Ps143,6":
  text: "Rozpościeram ku Tobie moje ręce; moja dusza jest jak sucha ziemia. Sela."
  tags: []
"Ps143,7":
  text: "Odpowiedz mi szybko, JHWH; mój duch jest już u kresu; nie ukrywaj przede mną swojego oblicza, bym nie był podobny zstępującym do dołu."
  tags: []
"Ps143,8":
  text: "Spraw, abym rano słyszał o Twoim miłosierdziu, bo Tobie ufam; oznajmij mi drogę, którą mam chodzić, bo ku Tobie wznoszę moją duszę."
  tags: []
"Ps143,9":
  text: "Ocal mnie od moich wrogów, JHWH; u Ciebie się ukryłem."
  tags: []
"Ps143,10":
  text: "Naucz mnie czynić Twoją wolę, bo Ty jesteś moim Bogiem. Niech Twój dobry Duch prowadzi mnie do prawej ziemi."
  tags: []
"Ps143,11":
  text: "Ożyw mnie, JHWH, dla Twojego imienia; ze względu na Twoją sprawiedliwość wyprowadź moją duszę z niedoli."
  tags: []
"Ps143,12":
  text: "W swoim miłosierdziu wytrać moich wrogów i zgładź wszystkich okazujących wrogość mojej duszy, bo ja jestem Twoim sługą."
  tags: []
