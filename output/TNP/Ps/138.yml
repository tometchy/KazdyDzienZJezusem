"Ps138,1":
  text: "Psalm Dawida. Będę Cię wysławiał, JHWH, z całego mojego serca, będę Ci śpiewał wobec bogów."
  tags: []
"Ps138,2":
  text: "Oddaję pokłon ku świętemu Twojemu przybytkowi i będę wysławiał Twoje imię za miłosierdzie Twoje i prawdę; bo ponad wszystko wywyższyłeś Twoje imię i Słowo."
  tags: []
"Ps138,3":
  text: "W dniu, gdy Cię wzywałem, odpowiedziałeś mi. Twoja siła przejmuje mnie lękiem w mej duszy."
  tags: []
"Ps138,4":
  text: "Wszyscy królowie ziemi będą Cię wysławiać, JHWH, gdy usłyszą Słowa Twoich ust."
  tags: []
"Ps138,5":
  text: "I będą śpiewali o drogach JHWH, że wielka jest chwała JHWH."
  tags: []
"Ps138,6":
  text: "A choć wywyższony jest JHWH, jednak zwraca uwagę na pokornego, a wyniosłego poznaje z daleka."
  tags: []
"Ps138,7":
  text: "Choćbym szedł przez sam środek niedoli, zachowasz mnie przy życiu; wyciągniesz swoją rękę przeciw gniewowi moich nieprzyjaciół, a Twoja prawica mnie wybawi."
  tags: []
"Ps138,8":
  text: "JHWH dokona wszystkiego dla mnie. JHWH, Twoje miłosierdzie trwa na wieki; nie porzuć dzieł Twoich rąk."
  tags: []
