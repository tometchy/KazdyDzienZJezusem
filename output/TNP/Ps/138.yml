"Ps138,1": "Psalm Dawida. Będę Cię wysławiał, JHWH, z całego mojego serca, będę Ci śpiewał wobec bogów."
"Ps138,2": "Oddaję pokłon ku świętemu Twojemu przybytkowi i będę wysławiał Twoje imię za miłosierdzie Twoje i prawdę; bo ponad wszystko wywyższyłeś Twoje imię i Słowo."
"Ps138,3": "W dniu, gdy Cię wzywałem, odpowiedziałeś mi. Twoja siła przejmuje mnie lękiem w mej duszy."
"Ps138,4": "Wszyscy królowie ziemi będą Cię wysławiać, JHWH, gdy usłyszą Słowa Twoich ust."
"Ps138,5": "I będą śpiewali o drogach JHWH, że wielka jest chwała JHWH."
"Ps138,6": "A choć wywyższony jest JHWH, jednak zwraca uwagę na pokornego, a wyniosłego poznaje z daleka."
"Ps138,7": "Choćbym szedł przez sam środek niedoli, zachowasz mnie przy życiu; wyciągniesz swoją rękę przeciw gniewowi moich nieprzyjaciół, a Twoja prawica mnie wybawi."
"Ps138,8": "JHWH dokona wszystkiego dla mnie. JHWH, Twoje miłosierdzie trwa na wieki; nie porzuć dzieł Twoich rąk."
