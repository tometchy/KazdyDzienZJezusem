"Ps54,1": "Boże, wybaw mnie przez Twoje imię i Twoją potęgą broń mojej sprawy."
"Ps54,2": "Boże, wysłuchaj mojej modlitwy, nakłoń ucha ku słowom moich ust."
"Ps54,3": "Gdyż obcy powstali przeciwko mnie, a okrutnicy czyhają na moją duszę; nie mają Boga przed oczami. Sela."
"Ps54,4": "Oto Bóg mi pomaga; PAN podtrzymuje moją duszę."
"Ps54,5": "Niech odwróci zło na moich nieprzyjaciół; w Twojej prawdzie wytrać ich."
"Ps54,6": "Będę Ci dobrowolnie składał ofiary, będę wysławiał Twoje imię, JHWH, bo jest dobre."
"Ps54,7": "Uwolniłeś mnie bowiem z każdego utrapienia, a moje oko spojrzało triumfalnie na moich wrogów."
