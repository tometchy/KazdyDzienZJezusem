"Ps54,1":
  text: "Boże, wybaw mnie przez Twoje imię i Twoją potęgą broń mojej sprawy."
  tags: []
"Ps54,2":
  text: "Boże, wysłuchaj mojej modlitwy, nakłoń ucha ku słowom moich ust."
  tags: []
"Ps54,3":
  text: "Gdyż obcy powstali przeciwko mnie, a okrutnicy czyhają na moją duszę; nie mają Boga przed oczami. Sela."
  tags: []
"Ps54,4":
  text: "Oto Bóg mi pomaga; PAN podtrzymuje moją duszę."
  tags: []
"Ps54,5":
  text: "Niech odwróci zło na moich nieprzyjaciół; w Twojej prawdzie wytrać ich."
  tags: []
"Ps54,6":
  text: "Będę Ci dobrowolnie składał ofiary, będę wysławiał Twoje imię, JHWH, bo jest dobre."
  tags: []
"Ps54,7":
  text: "Uwolniłeś mnie bowiem z każdego utrapienia, a moje oko spojrzało triumfalnie na moich wrogów."
  tags: []
