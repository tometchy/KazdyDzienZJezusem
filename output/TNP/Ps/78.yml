"Ps78,1": "Pieśń pouczająca. Asafa. Słuchaj, mój ludu, mojego Prawa, skłońcie ucho ku słowom moich ust."
"Ps78,2": "Pragnę otworzyć moje usta w przypowieści, sprawię, że wytrysną prastare zagadki;"
"Ps78,3": "Co usłyszeliśmy i poznaliśmy i co nam opowiedzieli nasi ojcowie."
"Ps78,4": "Nie ukryjemy tego przed ich synami, opowiadając przyszłemu pokoleniu o chwale JHWH, o Jego potędze i cudach, które uczynił."
"Ps78,5": "Utwierdził bowiem świadectwo w Jakubie, ustanowił Prawo w Izraelu i nakazał naszym ojcom, aby je oznajmiali swoim synom;"
"Ps78,6": "Aby poznało je przyszłe pokolenie, synowie, którzy się urodzą; by powstali i przekazali je swoim synom;"
"Ps78,7": "Aby pokładali nadzieję w Bogu i nie zapominali o dziełach Boga, lecz strzegli Jego przykazań;"
"Ps78,8": "Żeby nie stali się jak ich ojcowie, pokoleniem buntującym się i nieposłusznym; pokoleniem, które nie przygotowało swojego serca i którego duch nie był wierny Bogu."
"Ps78,9": "Synowie Efraima, uzbrojeni i strzelający z łuku, w dniu bitwy wycofali się."
"Ps78,10": "Ponieważ nie strzegli przymierza Boga i odmówili chodzenia według Jego Prawa."
"Ps78,11": "Zapomnieli o Jego dziełach i cudach, które im ukazał."
"Ps78,12": "Przed ich ojcami uczynił cud w ziemi Egiptu, na polu Soanu."
"Ps78,13": "Rozdzielił morze i przeprowadził ich, i ustawił wody jak ścianę."
"Ps78,14": "I prowadził ich w obłoku za dnia, i całą noc w blasku ognia."
"Ps78,15": "Rozszczepił skały na pustyni i dał im pić niczym z wielkich głębin."
"Ps78,16": "Wydobył wartkie strumienie ze skały i kazał wodom spłynąć niczym rzekom."
"Ps78,17": "Lecz oni wciąż coraz bardziej grzeszyli wobec Niego, buntując się przeciw Najwyższemu na pustyni;"
"Ps78,18": "I wystawiali Boga w swoich sercach na próbę, zabiegając o pokarm według swojego pragnienia."
"Ps78,19": "I mówili przeciwko Bogu, tak się wypowiadając: Czy Bóg może przygotować stół na tej pustyni?"
"Ps78,20": "Oto, uderzył skałę i wytrysnęły wody, i wypłynęły potoki! Ale czy także będzie mógł dać chleb? Czy przygotuje mięso swojemu ludowi?"
"Ps78,21": "Gdy JHWH to usłyszał, rozgniewał się i ogień zapłonął przeciw Jakubowi, i również gniew wybuchnął przeciw Izraelowi;"
"Ps78,22": "Bo nie uwierzyli Bogu i nie zaufali Jego ocaleniu;"
"Ps78,23": "I rozkazał więc chmurom w górze, i otworzył bramy niebios."
"Ps78,24": "I zesłał im jak deszcz mannę do jedzenia, dał im zboże z niebios."
"Ps78,25": "Człowiek jadł chleb anielski; zesłał im pokarm do syta."
"Ps78,26": "Wzbudził na niebiosach wiatr wschodni i sprowadził swoją mocą wiatr południowy."
"Ps78,27": "I zesłał na nich mięso jak pył i ptactwo skrzydlate jak piasek morski."
"Ps78,28": "I sprawił, że spadło ono pośrodku Jego obozu, wokół ich namiotów."
"Ps78,29": "Jedli i w pełni się nasycili, i sprowadził im to, czego pożądali."
"Ps78,30": "A gdy jeszcze nie wyzbyli się swojego pożądania, gdy jeszcze pokarm był w ich ustach;"
"Ps78,31": "Podniósł się na nich gniew Boga i zabił najtęższych z nich, a młodzieńców z Izraela powalił."
"Ps78,32": "W tym wszystkim nadal grzeszyli i nie wierzyli Jego cudom;"
"Ps78,33": "Dlatego doprowadził do końca ich dni jak tchnienie, a ich lata – w trwodze."
"Ps78,34": "Gdy ich zabijał, szukali Go; nawracali się i o świcie zabiegali o Boga;"
"Ps78,35": "Przypominali sobie, że Bóg jest ich skałą, że Bóg Najwyższy – ich Odkupicielem;"
"Ps78,36": "Pochlebiali Mu jednak swoimi ustami i okłamywali Go swoim językiem;"
"Ps78,37": "A ich serce nie trwało w Nim niezłomnie, i nie byli wierni Jego przymierzu."
"Ps78,38": "Lecz On, będąc miłosiernym, przykrywał ich winę i nie wytracał ich; wiele razy odwracał swój gniew i nie pobudzał całej swojej zapalczywości;"
"Ps78,39": "Pamiętał, że oni są tylko ciałem; tchnieniem, które ulatuje i nie powraca."
"Ps78,40": "Jak często buntowali się na pustyni i zadawali Mu ból na pustkowiu!"
"Ps78,41": "Odwracali się i wystawiali Boga na próbę, i stawiali granice Świętemu Izraela."
"Ps78,42": "Nie pamiętali o mocy Jego ręki ani dnia, w którym ich wykupił od ciemiężcy;"
"Ps78,43": "Gdy czynił swoje znaki w Egipcie i swoje cuda na polu Soanu;"
"Ps78,44": "I zamienił w krew ich kanały Nilu i ich strumienie, tak że nie mogli z nich pić."
"Ps78,45": "Posłał przeciwko nim rój owadów, aby ich żarły, i żaby, aby ich niszczyły;"
"Ps78,46": "I dał gąsienicom ich plon, a owoc ich pracy – szarańczy."
"Ps78,47": "Zniszczył gradem ich krzewy winne, a drzewa sykomory mrozem."
"Ps78,48": "Ich bydło wydał na pastwę gradu, a ich stada błyskawicom."
"Ps78,49": "I zesłał na nich żar swojego gniewu, zapalczywość, oburzenie i udrękę, oddział aniołów niegodziwości."
"Ps78,50": "Utorował drogę dla swojego gniewu, nie ochronił ich duszy od śmierci, a ich życie wydał zarazie;"
"Ps78,51": "Wybił wszystko, co pierworodne w Egipcie, początek ich mocy w namiotach Chama;"
"Ps78,52": "A swój lud wyprowadził jak owce i wiódł ich po pustyni jak stado."
"Ps78,53": "Prowadził ich bezpiecznie, tak że nie odczuwali trwogi, a ich wrogów przykryło morze;"
"Ps78,54": "I wprowadził ich do swojego świętego terytorium, do góry, którą nabył swoją prawicą."
"Ps78,55": "Wypędził przed ich obliczem narody, sznurem wyznaczył im dziedzictwo, żeby plemiona Izraela mieszkały w swoich namiotach."
"Ps78,56": "Oni jednak wystawiali Go na próbę i buntowali się przeciwko Bogu Najwyższemu, i nie strzegli Jego świadectw."
"Ps78,57": "Lecz odwrócili się i postępowali przewrotnie jak ich ojcowie, zawiedli jak łuk z rozluźnioną cięciwą."
"Ps78,58": "I pobudzali Go do gniewu przez swoje wyżyny i rytymi wizerunkami bożków wzbudzali Jego zazdrość."
"Ps78,59": "Bóg to usłyszał, rozgniewał się i bardzo wzgardził Izraelem."
"Ps78,60": "I opuścił przybytek w Szilo; namiot, który rozbił wśród ludzi;"
"Ps78,61": "I oddał w niewolę swoją moc i swoje piękno w ręce wroga."
"Ps78,62": "Wydał swój lud pod miecz i rozgniewał się na swoje dziedzictwo."
"Ps78,63": "Jego młodzieńców pochłonął ogień, Jego dziewic nie wysławiano."
"Ps78,64": "Jego kapłani padli od miecza, a Jego wdowy nie lamentowały."
"Ps78,65": "Lecz potem PAN ocknął się jak ze snu, jak mocarz radujący się winem."
"Ps78,66": "I uderzył w tył swoich nieprzyjaciół, okrył ich wieczną hańbą."
"Ps78,67": "Wzgardził namiotem Józefa i pokolenia Efraima nie wybrał;"
"Ps78,68": "Jednak wybrał pokolenie Judy, Górę Syjon, którą umiłował."
"Ps78,69": "I zbudował swoją świątynię niczym na wysokościach; jak ziemię, którą założył na wieki."
"Ps78,70": "I wybrał też Dawida, swojego sługę; wziął go z owczych zagród;"
"Ps78,71": "Sprowadził go, gdy chodził za karmiącymi owcami, aby pasł Jakuba, Jego lud, i Izraela, Jego dziedzictwo."
"Ps78,72": "A on ich pasł w prostocie swojego serca i prowadził ich roztropną ręką."
