"Ps78,1":
  text: "Pieśń pouczająca. Asafa. Słuchaj, mój ludu, mojego Prawa, skłońcie ucho ku słowom moich ust."
  tags: []
"Ps78,2":
  text: "Pragnę otworzyć moje usta w przypowieści, sprawię, że wytrysną prastare zagadki;"
  tags: []
"Ps78,3":
  text: "Co usłyszeliśmy i poznaliśmy i co nam opowiedzieli nasi ojcowie."
  tags: []
"Ps78,4":
  text: "Nie ukryjemy tego przed ich synami, opowiadając przyszłemu pokoleniu o chwale JHWH, o Jego potędze i cudach, które uczynił."
  tags: []
"Ps78,5":
  text: "Utwierdził bowiem świadectwo w Jakubie, ustanowił Prawo w Izraelu i nakazał naszym ojcom, aby je oznajmiali swoim synom;"
  tags: []
"Ps78,6":
  text: "Aby poznało je przyszłe pokolenie, synowie, którzy się urodzą; by powstali i przekazali je swoim synom;"
  tags: []
"Ps78,7":
  text: "Aby pokładali nadzieję w Bogu i nie zapominali o dziełach Boga, lecz strzegli Jego przykazań;"
  tags: []
"Ps78,8":
  text: "Żeby nie stali się jak ich ojcowie, pokoleniem buntującym się i nieposłusznym; pokoleniem, które nie przygotowało swojego serca i którego duch nie był wierny Bogu."
  tags: []
"Ps78,9":
  text: "Synowie Efraima, uzbrojeni i strzelający z łuku, w dniu bitwy wycofali się."
  tags: []
"Ps78,10":
  text: "Ponieważ nie strzegli przymierza Boga i odmówili chodzenia według Jego Prawa."
  tags: []
"Ps78,11":
  text: "Zapomnieli o Jego dziełach i cudach, które im ukazał."
  tags: []
"Ps78,12":
  text: "Przed ich ojcami uczynił cud w ziemi Egiptu, na polu Soanu."
  tags: []
"Ps78,13":
  text: "Rozdzielił morze i przeprowadził ich, i ustawił wody jak ścianę."
  tags: []
"Ps78,14":
  text: "I prowadził ich w obłoku za dnia, i całą noc w blasku ognia."
  tags: []
"Ps78,15":
  text: "Rozszczepił skały na pustyni i dał im pić niczym z wielkich głębin."
  tags: []
"Ps78,16":
  text: "Wydobył wartkie strumienie ze skały i kazał wodom spłynąć niczym rzekom."
  tags: []
"Ps78,17":
  text: "Lecz oni wciąż coraz bardziej grzeszyli wobec Niego, buntując się przeciw Najwyższemu na pustyni;"
  tags: []
"Ps78,18":
  text: "I wystawiali Boga w swoich sercach na próbę, zabiegając o pokarm według swojego pragnienia."
  tags: []
"Ps78,19":
  text: "I mówili przeciwko Bogu, tak się wypowiadając: Czy Bóg może przygotować stół na tej pustyni?"
  tags: []
"Ps78,20":
  text: "Oto, uderzył skałę i wytrysnęły wody, i wypłynęły potoki! Ale czy także będzie mógł dać chleb? Czy przygotuje mięso swojemu ludowi?"
  tags: []
"Ps78,21":
  text: "Gdy JHWH to usłyszał, rozgniewał się i ogień zapłonął przeciw Jakubowi, i również gniew wybuchnął przeciw Izraelowi;"
  tags: []
"Ps78,22":
  text: "Bo nie uwierzyli Bogu i nie zaufali Jego ocaleniu;"
  tags: []
"Ps78,23":
  text: "I rozkazał więc chmurom w górze, i otworzył bramy niebios."
  tags: []
"Ps78,24":
  text: "I zesłał im jak deszcz mannę do jedzenia, dał im zboże z niebios."
  tags: []
"Ps78,25":
  text: "Człowiek jadł chleb anielski; zesłał im pokarm do syta."
  tags: []
"Ps78,26":
  text: "Wzbudził na niebiosach wiatr wschodni i sprowadził swoją mocą wiatr południowy."
  tags: []
"Ps78,27":
  text: "I zesłał na nich mięso jak pył i ptactwo skrzydlate jak piasek morski."
  tags: []
"Ps78,28":
  text: "I sprawił, że spadło ono pośrodku Jego obozu, wokół ich namiotów."
  tags: []
"Ps78,29":
  text: "Jedli i w pełni się nasycili, i sprowadził im to, czego pożądali."
  tags: []
"Ps78,30":
  text: "A gdy jeszcze nie wyzbyli się swojego pożądania, gdy jeszcze pokarm był w ich ustach;"
  tags: []
"Ps78,31":
  text: "Podniósł się na nich gniew Boga i zabił najtęższych z nich, a młodzieńców z Izraela powalił."
  tags: []
"Ps78,32":
  text: "W tym wszystkim nadal grzeszyli i nie wierzyli Jego cudom;"
  tags: []
"Ps78,33":
  text: "Dlatego doprowadził do końca ich dni jak tchnienie, a ich lata – w trwodze."
  tags: []
"Ps78,34":
  text: "Gdy ich zabijał, szukali Go; nawracali się i o świcie zabiegali o Boga;"
  tags: []
"Ps78,35":
  text: "Przypominali sobie, że Bóg jest ich skałą, że Bóg Najwyższy – ich Odkupicielem;"
  tags: []
"Ps78,36":
  text: "Pochlebiali Mu jednak swoimi ustami i okłamywali Go swoim językiem;"
  tags: []
"Ps78,37":
  text: "A ich serce nie trwało w Nim niezłomnie, i nie byli wierni Jego przymierzu."
  tags: []
"Ps78,38":
  text: "Lecz On, będąc miłosiernym, przykrywał ich winę i nie wytracał ich; wiele razy odwracał swój gniew i nie pobudzał całej swojej zapalczywości;"
  tags: []
"Ps78,39":
  text: "Pamiętał, że oni są tylko ciałem; tchnieniem, które ulatuje i nie powraca."
  tags: []
"Ps78,40":
  text: "Jak często buntowali się na pustyni i zadawali Mu ból na pustkowiu!"
  tags: []
"Ps78,41":
  text: "Odwracali się i wystawiali Boga na próbę, i stawiali granice Świętemu Izraela."
  tags: []
"Ps78,42":
  text: "Nie pamiętali o mocy Jego ręki ani dnia, w którym ich wykupił od ciemiężcy;"
  tags: []
"Ps78,43":
  text: "Gdy czynił swoje znaki w Egipcie i swoje cuda na polu Soanu;"
  tags: []
"Ps78,44":
  text: "I zamienił w krew ich kanały Nilu i ich strumienie, tak że nie mogli z nich pić."
  tags: []
"Ps78,45":
  text: "Posłał przeciwko nim rój owadów, aby ich żarły, i żaby, aby ich niszczyły;"
  tags: []
"Ps78,46":
  text: "I dał gąsienicom ich plon, a owoc ich pracy – szarańczy."
  tags: []
"Ps78,47":
  text: "Zniszczył gradem ich krzewy winne, a drzewa sykomory mrozem."
  tags: []
"Ps78,48":
  text: "Ich bydło wydał na pastwę gradu, a ich stada błyskawicom."
  tags: []
"Ps78,49":
  text: "I zesłał na nich żar swojego gniewu, zapalczywość, oburzenie i udrękę, oddział aniołów niegodziwości."
  tags: []
"Ps78,50":
  text: "Utorował drogę dla swojego gniewu, nie ochronił ich duszy od śmierci, a ich życie wydał zarazie;"
  tags: []
"Ps78,51":
  text: "Wybił wszystko, co pierworodne w Egipcie, początek ich mocy w namiotach Chama;"
  tags: []
"Ps78,52":
  text: "A swój lud wyprowadził jak owce i wiódł ich po pustyni jak stado."
  tags: []
"Ps78,53":
  text: "Prowadził ich bezpiecznie, tak że nie odczuwali trwogi, a ich wrogów przykryło morze;"
  tags: []
"Ps78,54":
  text: "I wprowadził ich do swojego świętego terytorium, do góry, którą nabył swoją prawicą."
  tags: []
"Ps78,55":
  text: "Wypędził przed ich obliczem narody, sznurem wyznaczył im dziedzictwo, żeby plemiona Izraela mieszkały w swoich namiotach."
  tags: []
"Ps78,56":
  text: "Oni jednak wystawiali Go na próbę i buntowali się przeciwko Bogu Najwyższemu, i nie strzegli Jego świadectw."
  tags: []
"Ps78,57":
  text: "Lecz odwrócili się i postępowali przewrotnie jak ich ojcowie, zawiedli jak łuk z rozluźnioną cięciwą."
  tags: []
"Ps78,58":
  text: "I pobudzali Go do gniewu przez swoje wyżyny i rytymi wizerunkami bożków wzbudzali Jego zazdrość."
  tags: []
"Ps78,59":
  text: "Bóg to usłyszał, rozgniewał się i bardzo wzgardził Izraelem."
  tags: []
"Ps78,60":
  text: "I opuścił przybytek w Szilo; namiot, który rozbił wśród ludzi;"
  tags: []
"Ps78,61":
  text: "I oddał w niewolę swoją moc i swoje piękno w ręce wroga."
  tags: []
"Ps78,62":
  text: "Wydał swój lud pod miecz i rozgniewał się na swoje dziedzictwo."
  tags: []
"Ps78,63":
  text: "Jego młodzieńców pochłonął ogień, Jego dziewic nie wysławiano."
  tags: []
"Ps78,64":
  text: "Jego kapłani padli od miecza, a Jego wdowy nie lamentowały."
  tags: []
"Ps78,65":
  text: "Lecz potem PAN ocknął się jak ze snu, jak mocarz radujący się winem."
  tags: []
"Ps78,66":
  text: "I uderzył w tył swoich nieprzyjaciół, okrył ich wieczną hańbą."
  tags: []
"Ps78,67":
  text: "Wzgardził namiotem Józefa i pokolenia Efraima nie wybrał;"
  tags: []
"Ps78,68":
  text: "Jednak wybrał pokolenie Judy, Górę Syjon, którą umiłował."
  tags: []
"Ps78,69":
  text: "I zbudował swoją świątynię niczym na wysokościach; jak ziemię, którą założył na wieki."
  tags: []
"Ps78,70":
  text: "I wybrał też Dawida, swojego sługę; wziął go z owczych zagród;"
  tags: []
"Ps78,71":
  text: "Sprowadził go, gdy chodził za karmiącymi owcami, aby pasł Jakuba, Jego lud, i Izraela, Jego dziedzictwo."
  tags: []
"Ps78,72":
  text: "A on ich pasł w prostocie swojego serca i prowadził ich roztropną ręką."
  tags: []
