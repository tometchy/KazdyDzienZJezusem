"Ps82,1": "Psalm Asafa. Bóg powstaje w zgromadzeniu Bożym, pośród bogów będzie sądził:"
"Ps82,2": "Jak długo będziecie sądzić niesprawiedliwie i wspierać osoby niegodziwe? Sela."
"Ps82,3": "Bierzcie w obronę ubogiego i sierotę, oddajcie sprawiedliwość strapionemu i będącemu w potrzebie."
"Ps82,4": "Wyzwólcie biedaka i nędzarza, ocalcie go z ręki niegodziwych."
"Ps82,5": "Lecz oni nic nie wiedzą i nie rozumieją, ciągle chodzą w ciemności; zostały wstrząśnięte wszystkie fundamenty ziemi."
"Ps82,6": "Ja więc powiedziałem: Jesteście bogami i wszyscy wy jesteście synami Najwyższego."
"Ps82,7": "Jednak umrzecie jak człowiek i upadniecie jak jeden z książąt."
"Ps82,8": "Powstań, Boże, osądź ziemię, bo Ty weźmiesz w dziedzictwo wszystkie narody."
