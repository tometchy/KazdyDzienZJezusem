"Ps82,1":
  text: "Psalm Asafa. Bóg powstaje w zgromadzeniu Bożym, pośród bogów będzie sądził:"
  tags: []
"Ps82,2":
  text: "Jak długo będziecie sądzić niesprawiedliwie i wspierać osoby niegodziwe? Sela."
  tags: []
"Ps82,3":
  text: "Bierzcie w obronę ubogiego i sierotę, oddajcie sprawiedliwość strapionemu i będącemu w potrzebie."
  tags: []
"Ps82,4":
  text: "Wyzwólcie biedaka i nędzarza, ocalcie go z ręki niegodziwych."
  tags: []
"Ps82,5":
  text: "Lecz oni nic nie wiedzą i nie rozumieją, ciągle chodzą w ciemności; zostały wstrząśnięte wszystkie fundamenty ziemi."
  tags: []
"Ps82,6":
  text: "Ja więc powiedziałem: Jesteście bogami i wszyscy wy jesteście synami Najwyższego."
  tags: []
"Ps82,7":
  text: "Jednak umrzecie jak człowiek i upadniecie jak jeden z książąt."
  tags: []
"Ps82,8":
  text: "Powstań, Boże, osądź ziemię, bo Ty weźmiesz w dziedzictwo wszystkie narody."
  tags: []
