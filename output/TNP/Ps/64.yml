"Ps64,1": "Wysłuchaj, o Boże, mojego głosu, gdy się skarżę; zachowaj moje życie od lęku przed wrogiem."
"Ps64,2": "Ukryj mnie przed tajemną radą czyniących zło, przed zgrają czyniących nieprawość;"
"Ps64,3": "Którzy naostrzyli swoje języki jak miecz, wypuścili swoje strzały – gorzkie słowa;"
"Ps64,4": "Aby ugodzić z ukrycia w niewinnego; nagle strzelić do niego, i to bez lęku."
"Ps64,5": "Utwierdzają się w złym zamiarze, rozmawiają, jak zastawiać potajemnie sidła i mówią: Któż je zobaczy?"
"Ps64,6": "Szukają nieprawości, są gotowi, mają obmyślony chytry plan. Wnętrze i serce człowieka – niezgłębione."
"Ps64,7": "Ale Bóg wypuści na nich strzałę, nagle będą zranieni;"
"Ps64,8": "Ich własny język sprowadzi na nich upadek; wszyscy, którzy ich zobaczą, uciekną."
"Ps64,9": "I przestraszy się cała ludzkość, będą opowiadali o dziele Boga i będą rozważali Jego czyn."
"Ps64,10": "A sprawiedliwy będzie się weselił w JHWH i w Nim będzie szukał schronienia; a wszyscy prawego serca będą się Nim szczycić."
