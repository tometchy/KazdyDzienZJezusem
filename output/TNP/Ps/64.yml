"Ps64,1":
  text: "Wysłuchaj, o Boże, mojego głosu, gdy się skarżę; zachowaj moje życie od lęku przed wrogiem."
  tags: []
"Ps64,2":
  text: "Ukryj mnie przed tajemną radą czyniących zło, przed zgrają czyniących nieprawość;"
  tags: []
"Ps64,3":
  text: "Którzy naostrzyli swoje języki jak miecz, wypuścili swoje strzały – gorzkie słowa;"
  tags: []
"Ps64,4":
  text: "Aby ugodzić z ukrycia w niewinnego; nagle strzelić do niego, i to bez lęku."
  tags: []
"Ps64,5":
  text: "Utwierdzają się w złym zamiarze, rozmawiają, jak zastawiać potajemnie sidła i mówią: Któż je zobaczy?"
  tags: []
"Ps64,6":
  text: "Szukają nieprawości, są gotowi, mają obmyślony chytry plan. Wnętrze i serce człowieka – niezgłębione."
  tags: []
"Ps64,7":
  text: "Ale Bóg wypuści na nich strzałę, nagle będą zranieni;"
  tags: []
"Ps64,8":
  text: "Ich własny język sprowadzi na nich upadek; wszyscy, którzy ich zobaczą, uciekną."
  tags: []
"Ps64,9":
  text: "I przestraszy się cała ludzkość, będą opowiadali o dziele Boga i będą rozważali Jego czyn."
  tags: []
"Ps64,10":
  text: "A sprawiedliwy będzie się weselił w JHWH i w Nim będzie szukał schronienia; a wszyscy prawego serca będą się Nim szczycić."
  tags: []
