"Ps26,1":
  text: "Dawidowy. Psalm. JHWH, osądź mnie, bo chodziłem uczciwie, zaufałem też JHWH, więc się nie zachwieję!"
  tags: []
"Ps26,2":
  text: "Zbadaj mnie JHWH i doświadcz mnie; poddaj próbie moje nerki i serce."
  tags: []
"Ps26,3":
  text: "Mam bowiem Twoje miłosierdzie przed oczyma i chodzę w Twojej prawdzie."
  tags: []
"Ps26,4":
  text: "Nie zasiadałem z ludźmi próżnymi i nie chodzę z obłudnikami."
  tags: []
"Ps26,5":
  text: "Nienawidzę zgromadzenia złoczyńców i z niegodziwymi nie usiądę."
  tags: []
"Ps26,6":
  text: "Umyję w niewinności swoje ręce i obejdę wokół Twój ołtarz, JHWH;"
  tags: []
"Ps26,7":
  text: "By rozbrzmiał głośno głos dziękczynienia i by wyliczać wszystkie Twoje cudowne dzieła."
  tags: []
"Ps26,8":
  text: "JHWH, miłuję mieszkanie w Twoim domu i miejsce, gdzie przebywa Twoja chwała."
  tags: []
"Ps26,9":
  text: "Nie zabieraj mojej duszy z grzesznikami ani mojego życia z ludźmi żądnymi rozlewu krwi;"
  tags: []
"Ps26,10":
  text: "W ich rękach jest zbrodniczy plan, a ich prawa ręka pełna jest przekupstwa."
  tags: []
"Ps26,11":
  text: "Lecz ja będę chodzić w swojej niewinności, odkup mnie i okaż nade mną miłosierdzie."
  tags: []
"Ps26,12":
  text: "Moja noga stoi na równym gruncie, będę błogosławił JHWH podczas zgromadzeń."
  tags: []
