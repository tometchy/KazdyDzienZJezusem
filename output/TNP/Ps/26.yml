"Ps26,1": "Dawidowy. Psalm. JHWH, osądź mnie, bo chodziłem uczciwie, zaufałem też JHWH, więc się nie zachwieję!"
"Ps26,2": "Zbadaj mnie JHWH i doświadcz mnie; poddaj próbie moje nerki i serce."
"Ps26,3": "Mam bowiem Twoje miłosierdzie przed oczyma i chodzę w Twojej prawdzie."
"Ps26,4": "Nie zasiadałem z ludźmi próżnymi i nie chodzę z obłudnikami."
"Ps26,5": "Nienawidzę zgromadzenia złoczyńców i z niegodziwymi nie usiądę."
"Ps26,6": "Umyję w niewinności swoje ręce i obejdę wokół Twój ołtarz, JHWH;"
"Ps26,7": "By rozbrzmiał głośno głos dziękczynienia i by wyliczać wszystkie Twoje cudowne dzieła."
"Ps26,8": "JHWH, miłuję mieszkanie w Twoim domu i miejsce, gdzie przebywa Twoja chwała."
"Ps26,9": "Nie zabieraj mojej duszy z grzesznikami ani mojego życia z ludźmi żądnymi rozlewu krwi;"
"Ps26,10": "W ich rękach jest zbrodniczy plan, a ich prawa ręka pełna jest przekupstwa."
"Ps26,11": "Lecz ja będę chodzić w swojej niewinności, odkup mnie i okaż nade mną miłosierdzie."
"Ps26,12": "Moja noga stoi na równym gruncie, będę błogosławił JHWH podczas zgromadzeń."
