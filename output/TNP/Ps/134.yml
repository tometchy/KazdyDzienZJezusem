"Ps134,1":
  text: "Pieśń stopni. Oto błogosławcie JHWH, wszyscy słudzy JHWH, którzy co noc stoicie w domu JHWH!"
  tags: []
"Ps134,2":
  text: "Wznieście wasze ręce ku świątyni i błogosławcie JHWH."
  tags: []
"Ps134,3":
  text: "Niech cię błogosławi z Syjonu JHWH, który dogląda niebiosa i ziemię."
  tags: []
