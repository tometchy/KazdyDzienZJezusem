"Ps73,1":
  text: "Psalm Asafa. Doprawdy Bóg jest dobry dla Izraela; dla tych, którzy są czystego serca."
  tags: []
"Ps73,2":
  text: "Ale moje nogi o mało się nie potknęły, omal nie poślizgnęły się moje kroki;"
  tags: []
"Ps73,3":
  text: "Bo zazdrościłem chełpliwym, widząc pomyślność niegodziwych."
  tags: []
"Ps73,4":
  text: "Nie mają bowiem bólów aż do śmierci, i tłuste jest ich ciało."
  tags: []
"Ps73,5":
  text: "Nie doznają trudu ludzkiego ani nie są porażeni przez chorobę jak inni ludzie."
  tags: []
"Ps73,6":
  text: "Dlatego pycha służy im jako naszyjnik i okryci są okrucieństwem jak szatą."
  tags: []
"Ps73,7":
  text: "Ich oko wyłupiaste od tłuszczu; mają więcej niż serce mogłoby sobie wyobrazić."
  tags: []
"Ps73,8":
  text: "Szydzą i mówią złośliwie, o ucisku mówią wyniośle."
  tags: []
"Ps73,9":
  text: "Swoje usta ustawiają na niebiosach, a ich język będzie chodził po ziemi."
  tags: []
"Ps73,10":
  text: "Dlatego swój lud zawraca tutaj i obfite pochłoną ich wody;"
  tags: []
"Ps73,11":
  text: "Bo mówią: W jaki sposób Bóg się o tym dowiedział? Czy Najwyższy ma mądrość?"
  tags: []
"Ps73,12":
  text: "Patrz! Tacy są niegodziwi, zawsze beztroscy i wciąż zwiększają bogactwo."
  tags: []
"Ps73,13":
  text: "Czy rzeczywiście na próżno oczyściłem swoje serce i w niewinności obmywałem swoje ręce?"
  tags: []
"Ps73,14":
  text: "Cały dzień jestem uderzany i co rano jestem karany."
  tags: []
"Ps73,15":
  text: "Gdybym powiedział: Będę mówił tak jak oni, zdradziłbym ród Twoich synów."
  tags: []
"Ps73,16":
  text: "Rozmyślałem, by to zrozumieć, ale było to zbyt trudne w moich oczach;"
  tags: []
"Ps73,17":
  text: "Dopóki nie wejdę do świątyni Bożej, by tu zrozumieć ich koniec."
  tags: []
"Ps73,18":
  text: "Doprawdy, stawiasz ich na śliskim gruncie i sprawiasz, że popadają w ruinę."
  tags: []
"Ps73,19":
  text: "O, jak nagle stali się przerażeniem! W jednej chwili, w trwodze zostali doprowadzeni do kresu."
  tags: []
"Ps73,20":
  text: "Jak sen po przebudzeniu, PANIE. Ty, gdy się ockniesz, wzgardzisz ich obrazem."
  tags: []
"Ps73,21":
  text: "Gdy rozgoryczone było moje serce, a w nerkach czułem kłucie;"
  tags: []
"Ps73,22":
  text: "Byłem głupi i nic nie rozumiałem, byłem przed Tobą jak zwierzę."
  tags: []
"Ps73,23":
  text: "A ja jednak bez przerwy jestem z Tobą, bo mnie pochwyciłeś za prawą rękę."
  tags: []
"Ps73,24":
  text: "Poprowadzisz mnie według swojej rady, a potem weźmiesz mnie do chwały."
  tags: []
"Ps73,25":
  text: "Kogo mam w niebiosach? Poza Tobą, nic nie cieszy mnie na ziemi."
  tags: []
"Ps73,26":
  text: "Wyczerpuje się moje ciało i serce. Bóg jest skałą mojego serca i moim dziedzictwem na wieki."
  tags: []
"Ps73,27":
  text: "Oto bowiem ci, którzy się oddalają od Ciebie, zginą; wytracasz wszystkich, którzy cudzołożą względem Ciebie."
  tags: []
"Ps73,28":
  text: "A ja? Dla mnie szczęściem jest być blisko Boga; JHWH PANA uczyniłem moim schronieniem, by opowiadać wszystkie Jego dzieła."
  tags: []
