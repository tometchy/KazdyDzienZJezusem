"Ps73,1": "Psalm Asafa. Doprawdy Bóg jest dobry dla Izraela; dla tych, którzy są czystego serca."
"Ps73,2": "Ale moje nogi o mało się nie potknęły, omal nie poślizgnęły się moje kroki;"
"Ps73,3": "Bo zazdrościłem chełpliwym, widząc pomyślność niegodziwych."
"Ps73,4": "Nie mają bowiem bólów aż do śmierci, i tłuste jest ich ciało."
"Ps73,5": "Nie doznają trudu ludzkiego ani nie są porażeni przez chorobę jak inni ludzie."
"Ps73,6": "Dlatego pycha służy im jako naszyjnik i okryci są okrucieństwem jak szatą."
"Ps73,7": "Ich oko wyłupiaste od tłuszczu; mają więcej niż serce mogłoby sobie wyobrazić."
"Ps73,8": "Szydzą i mówią złośliwie, o ucisku mówią wyniośle."
"Ps73,9": "Swoje usta ustawiają na niebiosach, a ich język będzie chodził po ziemi."
"Ps73,10": "Dlatego swój lud zawraca tutaj i obfite pochłoną ich wody;"
"Ps73,11": "Bo mówią: W jaki sposób Bóg się o tym dowiedział? Czy Najwyższy ma mądrość?"
"Ps73,12": "Patrz! Tacy są niegodziwi, zawsze beztroscy i wciąż zwiększają bogactwo."
"Ps73,13": "Czy rzeczywiście na próżno oczyściłem swoje serce i w niewinności obmywałem swoje ręce?"
"Ps73,14": "Cały dzień jestem uderzany i co rano jestem karany."
"Ps73,15": "Gdybym powiedział: Będę mówił tak jak oni, zdradziłbym ród Twoich synów."
"Ps73,16": "Rozmyślałem, by to zrozumieć, ale było to zbyt trudne w moich oczach;"
"Ps73,17": "Dopóki nie wejdę do świątyni Bożej, by tu zrozumieć ich koniec."
"Ps73,18": "Doprawdy, stawiasz ich na śliskim gruncie i sprawiasz, że popadają w ruinę."
"Ps73,19": "O, jak nagle stali się przerażeniem! W jednej chwili, w trwodze zostali doprowadzeni do kresu."
"Ps73,20": "Jak sen po przebudzeniu, PANIE. Ty, gdy się ockniesz, wzgardzisz ich obrazem."
"Ps73,21": "Gdy rozgoryczone było moje serce, a w nerkach czułem kłucie;"
"Ps73,22": "Byłem głupi i nic nie rozumiałem, byłem przed Tobą jak zwierzę."
"Ps73,23": "A ja jednak bez przerwy jestem z Tobą, bo mnie pochwyciłeś za prawą rękę."
"Ps73,24": "Poprowadzisz mnie według swojej rady, a potem weźmiesz mnie do chwały."
"Ps73,25": "Kogo mam w niebiosach? Poza Tobą, nic nie cieszy mnie na ziemi."
"Ps73,26": "Wyczerpuje się moje ciało i serce. Bóg jest skałą mojego serca i moim dziedzictwem na wieki."
"Ps73,27": "Oto bowiem ci, którzy się oddalają od Ciebie, zginą; wytracasz wszystkich, którzy cudzołożą względem Ciebie."
"Ps73,28": "A ja? Dla mnie szczęściem jest być blisko Boga; JHWH PANA uczyniłem moim schronieniem, by opowiadać wszystkie Jego dzieła."
