"Ps141,1": "Psalm Dawida. JHWH, wezwałem Cię, pośpiesz do mnie! Usłysz mój głos, gdy wołam do Ciebie."
"Ps141,2": "Niech moja modlitwa będzie przygotowana przed Twoim obliczem jak kadzidło, a podniesienie moich rąk jak wieczorna ofiara."
"Ps141,3": "JHWH, ustanów straż przy ustach moich; strzeż drzwi moich warg."
"Ps141,4": "Nie skłaniaj mojego serca do złej sprawy, do ludzi czyniących niegodziwość, i abym nie karmił się ich smakołykami."
"Ps141,5": "Niech mnie uderzy sprawiedliwy – to miłosierdzie; i niech mnie strofuje, to najlepszy olejek na moją głowę przed którym, niech się nie uchyla moja głowa; bo zawsze się modlę pomimo ich nieszczęścia."
"Ps141,6": "Sądzący ich zostali zrzuceni na zbocza skały i wysłuchali moje słowa, bo były przyjemne."
"Ps141,7": "Jakby ktoś orał i rozrywał ziemię, tak kości nasze zostały rozrzucone przy paszczy grobu."
"Ps141,8": "Jednakże do Ciebie wznoszę moje oczy, JHWH, mój PANIE; Tobie ufam, nie zostawiaj mojej duszy."
"Ps141,9": "Strzeż mnie od sidła, które zastawili na mnie i od pułapek tych, którzy czynią nieprawość."
"Ps141,10": "Niech niegodziwi wpadną razem w swoje sieci, a ja wtedy umknę im."
