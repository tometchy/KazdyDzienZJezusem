"Ps141,1":
  text: "Psalm Dawida. JHWH, wezwałem Cię, pośpiesz do mnie! Usłysz mój głos, gdy wołam do Ciebie."
  tags: []
"Ps141,2":
  text: "Niech moja modlitwa będzie przygotowana przed Twoim obliczem jak kadzidło, a podniesienie moich rąk jak wieczorna ofiara."
  tags: []
"Ps141,3":
  text: "JHWH, ustanów straż przy ustach moich; strzeż drzwi moich warg."
  tags: []
"Ps141,4":
  text: "Nie skłaniaj mojego serca do złej sprawy, do ludzi czyniących niegodziwość, i abym nie karmił się ich smakołykami."
  tags: []
"Ps141,5":
  text: "Niech mnie uderzy sprawiedliwy – to miłosierdzie; i niech mnie strofuje, to najlepszy olejek na moją głowę przed którym, niech się nie uchyla moja głowa; bo zawsze się modlę pomimo ich nieszczęścia."
  tags: []
"Ps141,6":
  text: "Sądzący ich zostali zrzuceni na zbocza skały i wysłuchali moje słowa, bo były przyjemne."
  tags: []
"Ps141,7":
  text: "Jakby ktoś orał i rozrywał ziemię, tak kości nasze zostały rozrzucone przy paszczy grobu."
  tags: []
"Ps141,8":
  text: "Jednakże do Ciebie wznoszę moje oczy, JHWH, mój PANIE; Tobie ufam, nie zostawiaj mojej duszy."
  tags: []
"Ps141,9":
  text: "Strzeż mnie od sidła, które zastawili na mnie i od pułapek tych, którzy czynią nieprawość."
  tags: []
"Ps141,10":
  text: "Niech niegodziwi wpadną razem w swoje sieci, a ja wtedy umknę im."
  tags: []
