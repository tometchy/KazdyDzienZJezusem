"Ps131,1": "Pieśń stopni. Dawida. JHWH, moje serce się nie wywyższa i moje oczy nie są wyniosłe, ani nie idę za tym co wielkie lub zbyt cudowne dla mnie."
"Ps131,2": "Przeciwnie, uspokoiłem i uciszyłem swoją duszę jak niemowlę odstawione od piersi swojej matki; moja dusza jest jak u niemowlęcia."
"Ps131,3": "Izraelu oczekuj JHWH, odtąd aż na wieki."
