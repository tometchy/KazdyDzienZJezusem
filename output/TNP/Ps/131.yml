"Ps131,1":
  text: "Pieśń stopni. Dawida. JHWH, moje serce się nie wywyższa i moje oczy nie są wyniosłe, ani nie idę za tym co wielkie lub zbyt cudowne dla mnie."
  tags: []
"Ps131,2":
  text: "Przeciwnie, uspokoiłem i uciszyłem swoją duszę jak niemowlę odstawione od piersi swojej matki; moja dusza jest jak u niemowlęcia."
  tags: []
"Ps131,3":
  text: "Izraelu oczekuj JHWH, odtąd aż na wieki."
  tags: []
