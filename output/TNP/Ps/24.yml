"Ps24,1":
  text: "Dawidowy. Psalm. Do JHWH należy ziemia i wszystko, co ją napełnia, świat i ci, co na nim mieszkają."
  tags: []
"Ps24,2":
  text: "Ponieważ On na morzach postawił jego fundamenty i utwierdził go na rzekach."
  tags: []
"Ps24,3":
  text: "Któż wstąpi na górę JHWH? Kto stanie w Jego świętym miejscu?"
  tags: []
"Ps24,4":
  text: "Ten, kto ma niewinne ręce i czyste serce, ten, kto nie unosi swojej duszy ku marności i nie przysięga kłamliwie."
  tags: []
"Ps24,5":
  text: "Ten weźmie błogosławieństwo od JHWH i sprawiedliwość od Boga, swojego Zbawiciela."
  tags: []
"Ps24,6":
  text: "Oto jest pokolenie tych, którzy Go szukają, którzy pragną Twojego oblicza. Tak, Jakubie! Sela."
  tags: []
"Ps24,7":
  text: "Podnieście, o bramy, wasze szczyty; podnieście się wrota odwieczne, oby wszedł Król chwały."
  tags: []
"Ps24,8":
  text: "Któż jest tym Królem chwały? JHWH mocny i potężny, JHWH potężny w bitwie."
  tags: []
"Ps24,9":
  text: "Podnieście, o bramy, wasze szczyty, podnieście się wrota odwieczne, oby wszedł Król chwały."
  tags: []
"Ps24,10":
  text: "Któż jest tym Królem chwały? JHWH Zastępów! On jest Królem chwały. Sela."
  tags: []
