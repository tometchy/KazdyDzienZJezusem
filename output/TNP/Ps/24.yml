"Ps24,1": "Dawidowy. Psalm. Do JHWH należy ziemia i wszystko, co ją napełnia, świat i ci, co na nim mieszkają."
"Ps24,2": "Ponieważ On na morzach postawił jego fundamenty i utwierdził go na rzekach."
"Ps24,3": "Któż wstąpi na górę JHWH? Kto stanie w Jego świętym miejscu?"
"Ps24,4": "Ten, kto ma niewinne ręce i czyste serce, ten, kto nie unosi swojej duszy ku marności i nie przysięga kłamliwie."
"Ps24,5": "Ten weźmie błogosławieństwo od JHWH i sprawiedliwość od Boga, swojego Zbawiciela."
"Ps24,6": "Oto jest pokolenie tych, którzy Go szukają, którzy pragną Twojego oblicza. Tak, Jakubie! Sela."
"Ps24,7": "Podnieście, o bramy, wasze szczyty; podnieście się wrota odwieczne, oby wszedł Król chwały."
"Ps24,8": "Któż jest tym Królem chwały? JHWH mocny i potężny, JHWH potężny w bitwie."
"Ps24,9": "Podnieście, o bramy, wasze szczyty, podnieście się wrota odwieczne, oby wszedł Król chwały."
"Ps24,10": "Któż jest tym Królem chwały? JHWH Zastępów! On jest Królem chwały. Sela."
