"Ps47,1":
  text: "Klaszczcie w dłonie wszystkie narody, wykrzykujcie triumfalnie Bogu głosem radosnym."
  tags: []
"Ps47,2":
  text: "Gdyż JHWH Najwyższy, który wzbudza lęk, jest wielkim Królem nad całą ziemią."
  tags: []
"Ps47,3":
  text: "Podda nam ludy i narody rzuci pod nasze stopy."
  tags: []
"Ps47,4":
  text: "On nam wybierze nasze dziedzictwo, chlubę Jakuba, którego umiłował. Sela."
  tags: []
"Ps47,5":
  text: "Wstąpił Bóg wśród okrzyków radości, JHWH przy dźwięku trąby."
  tags: []
"Ps47,6":
  text: "Śpiewajcie Bogu, śpiewajcie; śpiewajcie naszemu Królowi, śpiewajcie."
  tags: []
"Ps47,7":
  text: "Bóg bowiem jest Królem całej ziemi, śpiewajcie pieśni ze zrozumieniem."
  tags: []
"Ps47,8":
  text: "Bóg króluje nad narodami, Bóg zasiada na swoim świętym tronie."
  tags: []
"Ps47,9":
  text: "Książęta narodów zebrali się z ludem Boga Abrahama, bo do Boga należą tarcze ziemi; On jest wielce wywyższony."
  tags: []
