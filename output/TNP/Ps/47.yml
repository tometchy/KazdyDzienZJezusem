"Ps47,1": "Klaszczcie w dłonie wszystkie narody, wykrzykujcie triumfalnie Bogu głosem radosnym."
"Ps47,2": "Gdyż JHWH Najwyższy, który wzbudza lęk, jest wielkim Królem nad całą ziemią."
"Ps47,3": "Podda nam ludy i narody rzuci pod nasze stopy."
"Ps47,4": "On nam wybierze nasze dziedzictwo, chlubę Jakuba, którego umiłował. Sela."
"Ps47,5": "Wstąpił Bóg wśród okrzyków radości, JHWH przy dźwięku trąby."
"Ps47,6": "Śpiewajcie Bogu, śpiewajcie; śpiewajcie naszemu Królowi, śpiewajcie."
"Ps47,7": "Bóg bowiem jest Królem całej ziemi, śpiewajcie pieśni ze zrozumieniem."
"Ps47,8": "Bóg króluje nad narodami, Bóg zasiada na swoim świętym tronie."
"Ps47,9": "Książęta narodów zebrali się z ludem Boga Abrahama, bo do Boga należą tarcze ziemi; On jest wielce wywyższony."
