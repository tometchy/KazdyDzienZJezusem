"Ps93,1":
  text: "JHWH króluje. Odział się w majestat! JHWH odział się, przepasał mocą. O tak, utwierdził świat, że się nie poruszy."
  tags: []
"Ps93,2":
  text: "Twój tron jest utwierdzony od dawien dawna, Ty jesteś od wieczności."
  tags: []
"Ps93,3":
  text: "Podniosły rzeki, JHWH, podniosły rzeki swój szum, podniosą rzeki swoje miażdżące fale."
  tags: []
"Ps93,4":
  text: "Ponad szum wielkich wód i potężne fale morza JHWH jest pełen dostojeństwa na wysokości."
  tags: []
"Ps93,5":
  text: "Twoje świadectwa są bardzo pewne; dla Twojego domu, JHWH, jest pięknem świętość na długie dni."
  tags: []
