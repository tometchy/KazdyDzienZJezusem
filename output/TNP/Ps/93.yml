"Ps93,1": "JHWH króluje. Odział się w majestat! JHWH odział się, przepasał mocą. O tak, utwierdził świat, że się nie poruszy."
"Ps93,2": "Twój tron jest utwierdzony od dawien dawna, Ty jesteś od wieczności."
"Ps93,3": "Podniosły rzeki, JHWH, podniosły rzeki swój szum, podniosą rzeki swoje miażdżące fale."
"Ps93,4": "Ponad szum wielkich wód i potężne fale morza JHWH jest pełen dostojeństwa na wysokości."
"Ps93,5": "Twoje świadectwa są bardzo pewne; dla Twojego domu, JHWH, jest pięknem świętość na długie dni."
