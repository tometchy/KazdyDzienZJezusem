"Ps126,1": "Pieśń stopni. Gdy JHWH przywrócił odnowienie Syjonu, byliśmy jak ci, którzy śnią."
"Ps126,2": "Wtedy usta nasze zostały napełnione śmiechem, a nasz język krzykiem radości; wtedy też mówili wśród narodów: JHWH uczynił wielkie rzeczy z nami."
"Ps126,3": "JHWH uczynił dla nas wielkie rzeczy i jesteśmy radośni."
"Ps126,4": "JHWH, przywróć naszą pomyślność jak strumienie na pustyni Negeb."
"Ps126,5": "Ci, którzy teraz sieją ze łzami, będą żąć z okrzykiem radości."
"Ps126,6": "Kto ciągle wychodzi z płaczem, niosąc ziarno na siew, na pewno wejdzie z okrzykiem radości, niosąc swoje snopy."
