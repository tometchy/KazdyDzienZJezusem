"Ps126,1":
  text: "Pieśń stopni. Gdy JHWH przywrócił odnowienie Syjonu, byliśmy jak ci, którzy śnią."
  tags: []
"Ps126,2":
  text: "Wtedy usta nasze zostały napełnione śmiechem, a nasz język krzykiem radości; wtedy też mówili wśród narodów: JHWH uczynił wielkie rzeczy z nami."
  tags: []
"Ps126,3":
  text: "JHWH uczynił dla nas wielkie rzeczy i jesteśmy radośni."
  tags: []
"Ps126,4":
  text: "JHWH, przywróć naszą pomyślność jak strumienie na pustyni Negeb."
  tags: []
"Ps126,5":
  text: "Ci, którzy teraz sieją ze łzami, będą żąć z okrzykiem radości."
  tags: []
"Ps126,6":
  text: "Kto ciągle wychodzi z płaczem, niosąc ziarno na siew, na pewno wejdzie z okrzykiem radości, niosąc swoje snopy."
  tags: []
