"Ps77,1":
  text: "Wzniosę mój głos do Boga i zawołam; wzniosę mój głos do Boga, a On mnie wysłucha."
  tags: []
"Ps77,2":
  text: "W dniu mojego utrapienia szukałem PANA, moja ręka wyciągnięta jest w nocy i nie drętwieje, moja dusza odmawia pocieszenia."
  tags: []
"Ps77,3":
  text: "Gdy wspominam Boga, to jęczę; gdy rozmyślam – mój duch słabnie. Sela."
  tags: []
"Ps77,4":
  text: "Ty trzymałeś otwarte powieki moich oczu; byłem tak znękany, że nie mogłem mówić."
  tags: []
"Ps77,5":
  text: "Rozmyślam o dniach dawnych i latach odwiecznych."
  tags: []
"Ps77,6":
  text: "Przypominam sobie mój śpiew; nocą rozważam w sercu i mój duch docieka:"
  tags: []
"Ps77,7":
  text: "Czy PAN odrzuci na wieki i już więcej nie będzie miał upodobania?"
  tags: []
"Ps77,8":
  text: "Czy Jego miłosierdzie ustało na zawsze i Jego obietnica skończyła się z pokolenia na pokolenie?"
  tags: []
"Ps77,9":
  text: "Czy Bóg zapomniał o litości? Czy w gniewie zamknął swoją łaskawość? Sela."
  tags: []
"Ps77,10":
  text: "I powiedziałem: Jestem słaby; to jednak będę wspominał lata prawicy Najwyższego."
  tags: []
"Ps77,11":
  text: "Będę wspominał dzieła JH[WH], z pewnością wspomnę Twoje dawne cuda."
  tags: []
"Ps77,12":
  text: "Będę rozmyślał o wszystkich Twoich dziełach i o Twoich czynach będę mówił."
  tags: []
"Ps77,13":
  text: "Boże, święta jest Twoja droga; który bóg jest tak wielki, jak nasz Bóg?"
  tags: []
"Ps77,14":
  text: "Ty jesteś Bogiem, który czyni cuda; oznajmiłeś narodom swoją potęgę."
  tags: []
"Ps77,15":
  text: "Odkupiłeś swoim ramieniem Twój lud, synów Jakuba i Józefa. Sela."
  tags: []
"Ps77,16":
  text: "Ujrzały Cię wody, o Boże, ujrzały Cię wody i wzburzyły się, zatrzęsły się głębiny oceanu."
  tags: []
"Ps77,17":
  text: "Gęste chmury wylały wody, obłoki wydały głos. Tak poleciały Twoje strzały."
  tags: []
"Ps77,18":
  text: "Głos Twego grzmotu słychać w wirze zawieruchy, przez błyskawicę został oświetlony świat, zatrzęsła się i zadrżała ziemia."
  tags: []
"Ps77,19":
  text: "Twoja droga prowadzi przez morze, Twoje ścieżki przez wielkie wody i nie można było dostrzec Twoich śladów."
  tags: []
"Ps77,20":
  text: "Prowadziłeś swój lud jak stado owiec ręką Mojżesza i Aarona."
  tags: []
