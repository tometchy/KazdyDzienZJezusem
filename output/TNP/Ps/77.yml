"Ps77,1": "Wzniosę mój głos do Boga i zawołam; wzniosę mój głos do Boga, a On mnie wysłucha."
"Ps77,2": "W dniu mojego utrapienia szukałem PANA, moja ręka wyciągnięta jest w nocy i nie drętwieje, moja dusza odmawia pocieszenia."
"Ps77,3": "Gdy wspominam Boga, to jęczę; gdy rozmyślam – mój duch słabnie. Sela."
"Ps77,4": "Ty trzymałeś otwarte powieki moich oczu; byłem tak znękany, że nie mogłem mówić."
"Ps77,5": "Rozmyślam o dniach dawnych i latach odwiecznych."
"Ps77,6": "Przypominam sobie mój śpiew; nocą rozważam w sercu i mój duch docieka:"
"Ps77,7": "Czy PAN odrzuci na wieki i już więcej nie będzie miał upodobania?"
"Ps77,8": "Czy Jego miłosierdzie ustało na zawsze i Jego obietnica skończyła się z pokolenia na pokolenie?"
"Ps77,9": "Czy Bóg zapomniał o litości? Czy w gniewie zamknął swoją łaskawość? Sela."
"Ps77,10": "I powiedziałem: Jestem słaby; to jednak będę wspominał lata prawicy Najwyższego."
"Ps77,11": "Będę wspominał dzieła JH[WH], z pewnością wspomnę Twoje dawne cuda."
"Ps77,12": "Będę rozmyślał o wszystkich Twoich dziełach i o Twoich czynach będę mówił."
"Ps77,13": "Boże, święta jest Twoja droga; który bóg jest tak wielki, jak nasz Bóg?"
"Ps77,14": "Ty jesteś Bogiem, który czyni cuda; oznajmiłeś narodom swoją potęgę."
"Ps77,15": "Odkupiłeś swoim ramieniem Twój lud, synów Jakuba i Józefa. Sela."
"Ps77,16": "Ujrzały Cię wody, o Boże, ujrzały Cię wody i wzburzyły się, zatrzęsły się głębiny oceanu."
"Ps77,17": "Gęste chmury wylały wody, obłoki wydały głos. Tak poleciały Twoje strzały."
"Ps77,18": "Głos Twego grzmotu słychać w wirze zawieruchy, przez błyskawicę został oświetlony świat, zatrzęsła się i zadrżała ziemia."
"Ps77,19": "Twoja droga prowadzi przez morze, Twoje ścieżki przez wielkie wody i nie można było dostrzec Twoich śladów."
"Ps77,20": "Prowadziłeś swój lud jak stado owiec ręką Mojżesza i Aarona."
