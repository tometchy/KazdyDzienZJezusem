"Ps27,1":
  text: "Dawidowy. Psalm. JHWH jest moją światłością i moim zbawieniem. Kogo mam się bać? JHWH jest twierdzą mojego życia, przed kim mam odczuwać przerażenie?"
  tags: []
"Ps27,2":
  text: "Gdy złoczyńcy, natarli przeciwko mnie, by pożreć moje ciało, moi przeciwnicy i wrogowie, ci zachwiali się i upadli."
  tags: []
"Ps27,3":
  text: "Choćby rozbili naprzeciwko mnie obóz wojenny, moje serce nie będzie się bało, choćby wybuchła przeciwko mnie wojna, nawet wtedy będę ufał."
  tags: []
"Ps27,4":
  text: "O jedno proszę JHWH i tego poszukuję: aby zamieszkać w domu JHWH przez wszystkie dni mojego życia, aby oglądać piękno JHWH i szukać Go w Jego świątyni."
  tags: []
"Ps27,5":
  text: "Skryje mnie bowiem w dniu niedoli w swoim szałasie; schowa mnie w ukrytym miejscu swojego przybytku i wyniesie mnie wysoko na skałę."
  tags: []
"Ps27,6":
  text: "A teraz moja głowa podniesie się nad moimi wrogami, którzy mnie otaczają; będę składał w Jego przybytku ofiary radosnego wykrzykiwania ze zwycięstwa, będę śpiewał i oddawał JHWH chwałę."
  tags: []
"Ps27,7":
  text: "Usłysz, JHWH, mój głos gdy zawołam; zmiłuj się nade mną i odpowiedz mi."
  tags: []
"Ps27,8":
  text: "O Tobie rozmyśla moje serce: szukajcie mojego oblicza; Twojego oblicza, JHWH, będę szukał."
  tags: []
"Ps27,9":
  text: "Nie ukrywaj przede mną swojego oblicza ani nie odtrącaj w gniewie swojego sługi; Ty jesteś moją pomocą, nie opuszczaj mnie i nie pozostawiaj mnie, Boże mojego zbawienia."
  tags: []
"Ps27,10":
  text: "Choćby ojciec i matka mnie pozostawili, to JHWH mnie przygarnie."
  tags: []
"Ps27,11":
  text: "Wskaż mi, JHWH, Twoją drogę i prowadź mnie ścieżką prostą ze względu na moich nieprzyjaciół."
  tags: []
"Ps27,12":
  text: "Nie poddawaj mnie woli moich nieprzyjaciół, bo powstali przeciwko mnie fałszywi świadkowie i ten, który dyszy okrucieństwem,"
  tags: []
"Ps27,13":
  text: "Ja jednak wierzę, że zobaczę dobroć JHWH w ziemi żyjących."
  tags: []
"Ps27,14":
  text: "Oczekuj JHWH, bądź dzielny a On niech umocni twoje serce, i oczekuj JHWH."
  tags: []
