"Ps27,1": "Dawidowy. Psalm. JHWH jest moją światłością i moim zbawieniem. Kogo mam się bać? JHWH jest twierdzą mojego życia, przed kim mam odczuwać przerażenie?"
"Ps27,2": "Gdy złoczyńcy, natarli przeciwko mnie, by pożreć moje ciało, moi przeciwnicy i wrogowie, ci zachwiali się i upadli."
"Ps27,3": "Choćby rozbili naprzeciwko mnie obóz wojenny, moje serce nie będzie się bało, choćby wybuchła przeciwko mnie wojna, nawet wtedy będę ufał."
"Ps27,4": "O jedno proszę JHWH i tego poszukuję: aby zamieszkać w domu JHWH przez wszystkie dni mojego życia, aby oglądać piękno JHWH i szukać Go w Jego świątyni."
"Ps27,5": "Skryje mnie bowiem w dniu niedoli w swoim szałasie; schowa mnie w ukrytym miejscu swojego przybytku i wyniesie mnie wysoko na skałę."
"Ps27,6": "A teraz moja głowa podniesie się nad moimi wrogami, którzy mnie otaczają; będę składał w Jego przybytku ofiary radosnego wykrzykiwania ze zwycięstwa, będę śpiewał i oddawał JHWH chwałę."
"Ps27,7": "Usłysz, JHWH, mój głos gdy zawołam; zmiłuj się nade mną i odpowiedz mi."
"Ps27,8": "O Tobie rozmyśla moje serce: szukajcie mojego oblicza; Twojego oblicza, JHWH, będę szukał."
"Ps27,9": "Nie ukrywaj przede mną swojego oblicza ani nie odtrącaj w gniewie swojego sługi; Ty jesteś moją pomocą, nie opuszczaj mnie i nie pozostawiaj mnie, Boże mojego zbawienia."
"Ps27,10": "Choćby ojciec i matka mnie pozostawili, to JHWH mnie przygarnie."
"Ps27,11": "Wskaż mi, JHWH, Twoją drogę i prowadź mnie ścieżką prostą ze względu na moich nieprzyjaciół."
"Ps27,12": "Nie poddawaj mnie woli moich nieprzyjaciół, bo powstali przeciwko mnie fałszywi świadkowie i ten, który dyszy okrucieństwem,"
"Ps27,13": "Ja jednak wierzę, że zobaczę dobroć JHWH w ziemi żyjących."
"Ps27,14": "Oczekuj JHWH, bądź dzielny a On niech umocni twoje serce, i oczekuj JHWH."
