"Ps86,1": "Nakłoń swojego ucha, JHWH, odpowiedz mi, bo ja jestem nędzny i ubogi."
"Ps86,2": "Strzeż mojej duszy, bo ja jestem Ci wierny; Ty Boże, wybaw Twojego sługę, który ufa Tobie."
"Ps86,3": "Zmiłuj się nade mną, PANIE, bo do Ciebie codziennie wołam."
"Ps86,4": "Rozraduj duszę Twojego sługi, bo do Ciebie, PANIE, wznoszę swoją duszę."
"Ps86,5": "Bo Ty, PANIE, jesteś dobry i gotowy przebaczać, i pełen miłosierdzia dla wszystkich, którzy Cię wzywają."
"Ps86,6": "Wysłuchaj, JHWH, mojej modlitwy i zważ na głos mojego błagania."
"Ps86,7": "Wzywam Cię w dniu mojego ucisku, bo Ty mi odpowiesz."
"Ps86,8": "Nie ma wśród bogów takiego jak Ty, PANIE, i nie ma dzieł takich jak Twoje."
"Ps86,9": "Wszystkie narody, które stworzyłeś, przyjdą i złożą pokłon przed Twoim obliczem, PANIE, i będą wielbić Twoje imię;"
"Ps86,10": "Bo Ty jesteś wielki i czynisz cuda; tylko Ty jesteś Bogiem."
"Ps86,11": "Naucz mnie, JHWH, Twojej drogi, abym chodził w Twojej prawdzie; skup moje serce na bojaźni Twojego imienia."
"Ps86,12": "Będę Cię chwalił, PANIE, mój Boże, z całego serca i będę wielbił Twoje imię na wieki;"
"Ps86,13": "Bo wielkie jest Twoje miłosierdzie dla mnie; Ty wyrwałeś moją duszę z najgłębszego Szeolu."
"Ps86,14": "Boże, butni powstali przeciwko mnie i banda okrutników pożąda mojej duszy, a nie stawiają Ciebie przed oczyma."
"Ps86,15": "Lecz Ty, PANIE, jesteś Bogiem współczującym i łaskawym, nieskorym do gniewu, pełnym miłosierdzia i prawdy."
"Ps86,16": "Zwróć się ku mnie i zmiłuj się nade mną, udziel swojej mocy Twojemu słudze i wybaw syna Twojej służebnicy."
"Ps86,17": "Uczyń dla mnie znak Twojej dobroci, aby nienawidzący mnie, zobaczyli i zawstydzili się, bo Ty, JHWH, pomogłeś mi i mnie pocieszyłeś."
