"Ps86,1":
  text: "Nakłoń swojego ucha, JHWH, odpowiedz mi, bo ja jestem nędzny i ubogi."
  tags: []
"Ps86,2":
  text: "Strzeż mojej duszy, bo ja jestem Ci wierny; Ty Boże, wybaw Twojego sługę, który ufa Tobie."
  tags: []
"Ps86,3":
  text: "Zmiłuj się nade mną, PANIE, bo do Ciebie codziennie wołam."
  tags: []
"Ps86,4":
  text: "Rozraduj duszę Twojego sługi, bo do Ciebie, PANIE, wznoszę swoją duszę."
  tags: []
"Ps86,5":
  text: "Bo Ty, PANIE, jesteś dobry i gotowy przebaczać, i pełen miłosierdzia dla wszystkich, którzy Cię wzywają."
  tags: []
"Ps86,6":
  text: "Wysłuchaj, JHWH, mojej modlitwy i zważ na głos mojego błagania."
  tags: []
"Ps86,7":
  text: "Wzywam Cię w dniu mojego ucisku, bo Ty mi odpowiesz."
  tags: []
"Ps86,8":
  text: "Nie ma wśród bogów takiego jak Ty, PANIE, i nie ma dzieł takich jak Twoje."
  tags: []
"Ps86,9":
  text: "Wszystkie narody, które stworzyłeś, przyjdą i złożą pokłon przed Twoim obliczem, PANIE, i będą wielbić Twoje imię;"
  tags: []
"Ps86,10":
  text: "Bo Ty jesteś wielki i czynisz cuda; tylko Ty jesteś Bogiem."
  tags: []
"Ps86,11":
  text: "Naucz mnie, JHWH, Twojej drogi, abym chodził w Twojej prawdzie; skup moje serce na bojaźni Twojego imienia."
  tags: []
"Ps86,12":
  text: "Będę Cię chwalił, PANIE, mój Boże, z całego serca i będę wielbił Twoje imię na wieki;"
  tags: []
"Ps86,13":
  text: "Bo wielkie jest Twoje miłosierdzie dla mnie; Ty wyrwałeś moją duszę z najgłębszego Szeolu."
  tags: []
"Ps86,14":
  text: "Boże, butni powstali przeciwko mnie i banda okrutników pożąda mojej duszy, a nie stawiają Ciebie przed oczyma."
  tags: []
"Ps86,15":
  text: "Lecz Ty, PANIE, jesteś Bogiem współczującym i łaskawym, nieskorym do gniewu, pełnym miłosierdzia i prawdy."
  tags: []
"Ps86,16":
  text: "Zwróć się ku mnie i zmiłuj się nade mną, udziel swojej mocy Twojemu słudze i wybaw syna Twojej służebnicy."
  tags: []
"Ps86,17":
  text: "Uczyń dla mnie znak Twojej dobroci, aby nienawidzący mnie, zobaczyli i zawstydzili się, bo Ty, JHWH, pomogłeś mi i mnie pocieszyłeś."
  tags: []
