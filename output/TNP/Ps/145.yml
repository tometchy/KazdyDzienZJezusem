"Ps145,1": "Hymn pochwalny Dawida. Będę Cię wywyższał, Boże mój, Królu mój, i będę błogosławić Twoje imię na wieki wieków."
"Ps145,2": "Każdego dnia będę Cię błogosławił i chwalił Twoje imię na wieki wieków."
"Ps145,3": "Wielki jest JHWH i wielce godny chwały, a Jego wielkość jest niezbadana."
"Ps145,4": "Pokolenie pokoleniu głosi chwałę Twoich dzieł i będzie obwieszczać o Twoich potężnych czynach."
"Ps145,5": "Dostojeństwo, chwała, majestat i cudowne Twoje dzieła – o tym będę rozmyślał."
"Ps145,6": "I niech powiedzą o potędze Twoich przejmujących lękiem czynów, a ja będę opowiadać Twoją wielkość."
"Ps145,7": "Będą się rozwodzić nad pamiątkami Twojej wielkiej dobroci i o Twojej sprawiedliwości niech krzyczą z radością."
"Ps145,8": "Łaskawy jest JHWH i litościwy, nieskory do gniewu i wielce miłosierny."
"Ps145,9": "Dobry jest JHWH dla wszystkich, a Jego miłosierdzie we wszystkich Jego dziełach."
"Ps145,10": "Niech Cię wysławiają wszystkie Twoje dzieła, JHWH, a Twoi święci niech Cię błogosławią."
"Ps145,11": "Niech opowiadają o chwale Twojego królestwa i mówią o Twojej potędze;"
"Ps145,12": "Aby oznajmić synom ludzkim Jego potężne czyny i dostojeństwo chwały Jego królestwa."
"Ps145,13": "Twoje królestwo jest królestwem przez wszystkie wieki, a Twoje panowanie trwa przez wszystkie pokolenia."
"Ps145,14": "JHWH podtrzymuje wszystkich, którzy upadają i podnosi wszystkich przygniecionych."
"Ps145,15": "Oczy wszystkich patrzą z nadzieją na Ciebie, a Ty im dajesz pokarm w swoim czasie."
"Ps145,16": "Otwierasz swoją rękę i zaspokajasz pragnienia wszystkich żyjących."
"Ps145,17": "Sprawiedliwy jest JHWH na wszystkich swoich drogach i święty we wszystkich swoich dziełach."
"Ps145,18": "Bliski jest JHWH wszystkim, którzy Go wzywają; wszystkim, którzy Go będą wzywać w prawdzie."
"Ps145,19": "Spełni pragnienia tych, którzy się Go boją; usłyszy ich wołanie i wybawi ich."
"Ps145,20": "JHWH strzeże wszystkich, którzy Go miłują, a wytraci wszystkich niegodziwych."
"Ps145,21": "Moje usta będą głosić chwałę JHWH i niech wszelkie ciało błogosławi Jego święte imię na wieki wieków."
