"Ps145,1":
  text: "Hymn pochwalny Dawida. Będę Cię wywyższał, Boże mój, Królu mój, i będę błogosławić Twoje imię na wieki wieków."
  tags: []
"Ps145,2":
  text: "Każdego dnia będę Cię błogosławił i chwalił Twoje imię na wieki wieków."
  tags: []
"Ps145,3":
  text: "Wielki jest JHWH i wielce godny chwały, a Jego wielkość jest niezbadana."
  tags: []
"Ps145,4":
  text: "Pokolenie pokoleniu głosi chwałę Twoich dzieł i będzie obwieszczać o Twoich potężnych czynach."
  tags: []
"Ps145,5":
  text: "Dostojeństwo, chwała, majestat i cudowne Twoje dzieła – o tym będę rozmyślał."
  tags: []
"Ps145,6":
  text: "I niech powiedzą o potędze Twoich przejmujących lękiem czynów, a ja będę opowiadać Twoją wielkość."
  tags: []
"Ps145,7":
  text: "Będą się rozwodzić nad pamiątkami Twojej wielkiej dobroci i o Twojej sprawiedliwości niech krzyczą z radością."
  tags: []
"Ps145,8":
  text: "Łaskawy jest JHWH i litościwy, nieskory do gniewu i wielce miłosierny."
  tags: []
"Ps145,9":
  text: "Dobry jest JHWH dla wszystkich, a Jego miłosierdzie we wszystkich Jego dziełach."
  tags: []
"Ps145,10":
  text: "Niech Cię wysławiają wszystkie Twoje dzieła, JHWH, a Twoi święci niech Cię błogosławią."
  tags: []
"Ps145,11":
  text: "Niech opowiadają o chwale Twojego królestwa i mówią o Twojej potędze;"
  tags: []
"Ps145,12":
  text: "Aby oznajmić synom ludzkim Jego potężne czyny i dostojeństwo chwały Jego królestwa."
  tags: []
"Ps145,13":
  text: "Twoje królestwo jest królestwem przez wszystkie wieki, a Twoje panowanie trwa przez wszystkie pokolenia."
  tags: []
"Ps145,14":
  text: "JHWH podtrzymuje wszystkich, którzy upadają i podnosi wszystkich przygniecionych."
  tags: []
"Ps145,15":
  text: "Oczy wszystkich patrzą z nadzieją na Ciebie, a Ty im dajesz pokarm w swoim czasie."
  tags: []
"Ps145,16":
  text: "Otwierasz swoją rękę i zaspokajasz pragnienia wszystkich żyjących."
  tags: []
"Ps145,17":
  text: "Sprawiedliwy jest JHWH na wszystkich swoich drogach i święty we wszystkich swoich dziełach."
  tags: []
"Ps145,18":
  text: "Bliski jest JHWH wszystkim, którzy Go wzywają; wszystkim, którzy Go będą wzywać w prawdzie."
  tags: []
"Ps145,19":
  text: "Spełni pragnienia tych, którzy się Go boją; usłyszy ich wołanie i wybawi ich."
  tags: []
"Ps145,20":
  text: "JHWH strzeże wszystkich, którzy Go miłują, a wytraci wszystkich niegodziwych."
  tags: []
"Ps145,21":
  text: "Moje usta będą głosić chwałę JHWH i niech wszelkie ciało błogosławi Jego święte imię na wieki wieków."
  tags: []
