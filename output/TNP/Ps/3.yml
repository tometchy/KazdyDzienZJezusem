"Ps3,1": "JHWH, jak liczni są moi wrogowie, jak wielu powstaje przeciwko mnie!"
"Ps3,2": "Wielu mówi o mojej duszy: Nie ma dla niego ocalenia u Boga. Sela."
"Ps3,3": "A jednak Ty, JHWH, jesteś moją tarczą, moją chwałą, tym, który podnosi moją głowę."
"Ps3,4": "Podniosę swój głos do JHWH, a On mi odpowie ze swojej świętej góry. Sela."
"Ps3,5": "Ja położyłem się i zasnąłem; obudziłem się, bo JHWH mnie wspierał."
"Ps3,6": "Nie ulęknę się dziesiątków tysięcy ludzi, którzy dookoła na mnie nastają."
"Ps3,7": "Powstań, JHWH! Wybaw mnie, mój Boże! Uderzyłeś bowiem w szczękę wszystkich moich wrogów i połamałeś zęby niegodziwych."
"Ps3,8": "Od JHWH jest zbawienie. Twoje błogosławieństwo jest nad Twoim ludem. Sela."
