"Ps3,1":
  text: "JHWH, jak liczni są moi wrogowie, jak wielu powstaje przeciwko mnie!"
  tags: []
"Ps3,2":
  text: "Wielu mówi o mojej duszy: Nie ma dla niego ocalenia u Boga. Sela."
  tags: []
"Ps3,3":
  text: "A jednak Ty, JHWH, jesteś moją tarczą, moją chwałą, tym, który podnosi moją głowę."
  tags: []
"Ps3,4":
  text: "Podniosę swój głos do JHWH, a On mi odpowie ze swojej świętej góry. Sela."
  tags: []
"Ps3,5":
  text: "Ja położyłem się i zasnąłem; obudziłem się, bo JHWH mnie wspierał."
  tags: []
"Ps3,6":
  text: "Nie ulęknę się dziesiątków tysięcy ludzi, którzy dookoła na mnie nastają."
  tags: []
"Ps3,7":
  text: "Powstań, JHWH! Wybaw mnie, mój Boże! Uderzyłeś bowiem w szczękę wszystkich moich wrogów i połamałeś zęby niegodziwych."
  tags: []
"Ps3,8":
  text: "Od JHWH jest zbawienie. Twoje błogosławieństwo jest nad Twoim ludem. Sela."
  tags: []
