"Ps100,1": "Psalm dla dziękczynienia. Triumfalnie wykrzykujcie JHWH – cała ziemio!"
"Ps100,2": "Służcie JHWH z weselem, przychodźcie z radością przed Jego oblicze."
"Ps100,3": "Wiedzcie, że JHWH jest Bogiem, to On nas uczynił, a nie my sami siebie; jesteśmy Jego ludem i owcami Jego pastwiska."
"Ps100,4": "Przekroczcie Jego bramy z dziękczynieniem i Jego przedsionek z wychwalaniem; wysławiajcie Go, błogosławcie Jego imię;"
"Ps100,5": "JHWH bowiem jest dobry, Jego miłosierdzie trwa na wieki, a Jego prawda z pokolenia na pokolenie."
