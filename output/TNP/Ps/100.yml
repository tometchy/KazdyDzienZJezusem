"Ps100,1":
  text: "Psalm dla dziękczynienia. Triumfalnie wykrzykujcie JHWH – cała ziemio!"
  tags: []
"Ps100,2":
  text: "Służcie JHWH z weselem, przychodźcie z radością przed Jego oblicze."
  tags: []
"Ps100,3":
  text: "Wiedzcie, że JHWH jest Bogiem, to On nas uczynił, a nie my sami siebie; jesteśmy Jego ludem i owcami Jego pastwiska."
  tags: []
"Ps100,4":
  text: "Przekroczcie Jego bramy z dziękczynieniem i Jego przedsionek z wychwalaniem; wysławiajcie Go, błogosławcie Jego imię;"
  tags: []
"Ps100,5":
  text: "JHWH bowiem jest dobry, Jego miłosierdzie trwa na wieki, a Jego prawda z pokolenia na pokolenie."
  tags: []
