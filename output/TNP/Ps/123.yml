"Ps123,1":
  text: "Pieśń stopni. Moje oczy wznoszę ku Tobie, który mieszkasz w niebiosach."
  tags: []
"Ps123,2":
  text: "Oto jak oczy sług zwrócone są na ręce ich panów i jak oczy służącej na ręce jej pani, tak oczy nasze patrzą na JHWH, Boga naszego, aż się zmiłuje nad nami."
  tags: []
"Ps123,3":
  text: "Zmiłuj się nad nami, JHWH; zmiłuj się nad nami, bo jesteśmy obficie nasyceni wzgardą."
  tags: []
"Ps123,4":
  text: "Nasza dusza jest obficie nasycona szyderstwem butnych i wzgardą dumnych."
  tags: []
