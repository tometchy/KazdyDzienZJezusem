"Ps123,1": "Pieśń stopni. Moje oczy wznoszę ku Tobie, który mieszkasz w niebiosach."
"Ps123,2": "Oto jak oczy sług zwrócone są na ręce ich panów i jak oczy służącej na ręce jej pani, tak oczy nasze patrzą na JHWH, Boga naszego, aż się zmiłuje nad nami."
"Ps123,3": "Zmiłuj się nad nami, JHWH; zmiłuj się nad nami, bo jesteśmy obficie nasyceni wzgardą."
"Ps123,4": "Nasza dusza jest obficie nasycona szyderstwem butnych i wzgardą dumnych."
