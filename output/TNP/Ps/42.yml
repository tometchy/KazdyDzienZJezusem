"Ps42,1":
  text: "Jak jeleń pragnie wód strumieni, tak moja dusza pragnie Ciebie, Boże."
  tags: []
"Ps42,2":
  text: "Moja dusza jest spragniona Boga, Boga żywego. Kiedy przyjdę i będę się mógł wpatrywać w oblicze Boga?"
  tags: []
"Ps42,3":
  text: "Łza stała się dla mnie chlebem za dnia i nocą, bo mówią do mnie cały dzień: Gdzie jest twój Bóg?"
  tags: []
"Ps42,4":
  text: "To wspominam i wylewam na siebie moją duszę, jak podróżując w tłumie, szedłem z nimi do domu Bożego wśród okrzyków radości i dziękczynienia, pośród świętującego mnóstwa."
  tags: []
"Ps42,5":
  text: "Dlaczego się smucisz, moja duszo, i dlaczego jesteś we mnie zatrwożona? Zaufaj Bogu, bo jeszcze będę Go wysławiał za zwycięstwo Jego oblicza."
  tags: []
"Ps42,6":
  text: "Mój Boże, smuci się we mnie moja dusza, dlatego wspominam Cię z ziemi Jordanu i szczytu Hermonu, z góry Misar."
  tags: []
"Ps42,7":
  text: "Głębia woła do głębi, szumem Twoich wodospadów; wszystkie Twoje fale i nawałnice przeszły nade mną."
  tags: []
"Ps42,8":
  text: "Lecz za dnia JHWH wyznacza swoje miłosierdzie, a w nocy będzie we mnie Jego pieśń, modlitwa moja do Boga mojego życia."
  tags: []
"Ps42,9":
  text: "Powiem do Boga: Moja skało, dlaczego o mnie zapomniałeś? Dlaczego chodzę zasępiony z powodu ucisku wroga?"
  tags: []
"Ps42,10":
  text: "Jak przy łamaniu moich kości, tak mi urągają moi wrogowie, gdy mówią do mnie cały dzień: Gdzie jest twój Bóg?"
  tags: []
"Ps42,11":
  text: "Dlaczego się smucisz, moja duszo, i dlaczego jesteś we mnie zatrwożona? Zaufaj Bogu, bo jeszcze będę Go wysławiał, On jest ocaleniem mojego oblicza i On moim Bogiem."
  tags: []
