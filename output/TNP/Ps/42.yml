"Ps42,1": "Jak jeleń pragnie wód strumieni, tak moja dusza pragnie Ciebie, Boże."
"Ps42,2": "Moja dusza jest spragniona Boga, Boga żywego. Kiedy przyjdę i będę się mógł wpatrywać w oblicze Boga?"
"Ps42,3": "Łza stała się dla mnie chlebem za dnia i nocą, bo mówią do mnie cały dzień: Gdzie jest twój Bóg?"
"Ps42,4": "To wspominam i wylewam na siebie moją duszę, jak podróżując w tłumie, szedłem z nimi do domu Bożego wśród okrzyków radości i dziękczynienia, pośród świętującego mnóstwa."
"Ps42,5": "Dlaczego się smucisz, moja duszo, i dlaczego jesteś we mnie zatrwożona? Zaufaj Bogu, bo jeszcze będę Go wysławiał za zwycięstwo Jego oblicza."
"Ps42,6": "Mój Boże, smuci się we mnie moja dusza, dlatego wspominam Cię z ziemi Jordanu i szczytu Hermonu, z góry Misar."
"Ps42,7": "Głębia woła do głębi, szumem Twoich wodospadów; wszystkie Twoje fale i nawałnice przeszły nade mną."
"Ps42,8": "Lecz za dnia JHWH wyznacza swoje miłosierdzie, a w nocy będzie we mnie Jego pieśń, modlitwa moja do Boga mojego życia."
"Ps42,9": "Powiem do Boga: Moja skało, dlaczego o mnie zapomniałeś? Dlaczego chodzę zasępiony z powodu ucisku wroga?"
"Ps42,10": "Jak przy łamaniu moich kości, tak mi urągają moi wrogowie, gdy mówią do mnie cały dzień: Gdzie jest twój Bóg?"
"Ps42,11": "Dlaczego się smucisz, moja duszo, i dlaczego jesteś we mnie zatrwożona? Zaufaj Bogu, bo jeszcze będę Go wysławiał, On jest ocaleniem mojego oblicza i On moim Bogiem."
