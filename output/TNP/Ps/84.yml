"Ps84,1":
  text: "O, jak piękne są Twoje przybytki, JHWH Zastępów!"
  tags: []
"Ps84,2":
  text: "Moja dusza gorąco tęskni, o tak wysycha z tęsknoty do dziedzińców JHWH; moje serce i ciało wołają radośnie do Boga żywego."
  tags: []
"Ps84,3":
  text: "Wróbel też znalazł sobie dom i jaskółka gniazdo, gdzie składa swoje pisklęta, u Twoich ołtarzy, JHWH Zastępów, mój Królu i mój Boże!"
  tags: []
"Ps84,4":
  text: "Błogosławieni ci, którzy mieszkają w Twoim domu, nieustannie będą Cię chwalić. Sela."
  tags: []
"Ps84,5":
  text: "Błogosławiony człowiek, którego siła jest w Tobie, w którego sercu są Twoje drogi;"
  tags: []
"Ps84,6":
  text: "Przechodząc przez dolinę Baka, czynią ją źródłem, a wczesny deszcz okrywa ją też błogosławieństwem."
  tags: []
"Ps84,7":
  text: "Idąc z mocy w moc wzrastają, aż ukażą się przed Bogiem na Syjonie."
  tags: []
"Ps84,8":
  text: "O, JHWH! Boże Zastępów, wysłuchaj mojej modlitwy, nakłoń ucha, Boże Jakuba. Sela."
  tags: []
"Ps84,9":
  text: "Nasza tarczo, spójrz Boże i zwróć uwagę na oblicze Twojego pomazańca."
  tags: []
"Ps84,10":
  text: "Lepszy bowiem jest jeden dzień w Twoich przedsionkach niż tysiąc gdzie indziej; wybrałem raczej strzec progów domu mojego Boga, niż mieszkać w namiotach niegodziwców."
  tags: []
"Ps84,11":
  text: "JHWH Bóg bowiem jest słońcem i tarczą, JHWH daje łaskę i chwałę, nie odmawia dobra tym, którzy chodzą nienagannie."
  tags: []
"Ps84,12":
  text: "JHWH Zastępów, błogosławiony człowiek, który ufa Tobie."
  tags: []
