"Ps84,1": "O, jak piękne są Twoje przybytki, JHWH Zastępów!"
"Ps84,2": "Moja dusza gorąco tęskni, o tak wysycha z tęsknoty do dziedzińców JHWH; moje serce i ciało wołają radośnie do Boga żywego."
"Ps84,3": "Wróbel też znalazł sobie dom i jaskółka gniazdo, gdzie składa swoje pisklęta, u Twoich ołtarzy, JHWH Zastępów, mój Królu i mój Boże!"
"Ps84,4": "Błogosławieni ci, którzy mieszkają w Twoim domu, nieustannie będą Cię chwalić. Sela."
"Ps84,5": "Błogosławiony człowiek, którego siła jest w Tobie, w którego sercu są Twoje drogi;"
"Ps84,6": "Przechodząc przez dolinę Baka, czynią ją źródłem, a wczesny deszcz okrywa ją też błogosławieństwem."
"Ps84,7": "Idąc z mocy w moc wzrastają, aż ukażą się przed Bogiem na Syjonie."
"Ps84,8": "O, JHWH! Boże Zastępów, wysłuchaj mojej modlitwy, nakłoń ucha, Boże Jakuba. Sela."
"Ps84,9": "Nasza tarczo, spójrz Boże i zwróć uwagę na oblicze Twojego pomazańca."
"Ps84,10": "Lepszy bowiem jest jeden dzień w Twoich przedsionkach niż tysiąc gdzie indziej; wybrałem raczej strzec progów domu mojego Boga, niż mieszkać w namiotach niegodziwców."
"Ps84,11": "JHWH Bóg bowiem jest słońcem i tarczą, JHWH daje łaskę i chwałę, nie odmawia dobra tym, którzy chodzą nienagannie."
"Ps84,12": "JHWH Zastępów, błogosławiony człowiek, który ufa Tobie."
