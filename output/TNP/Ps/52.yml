"Ps52,1":
  text: "Dla przewodnika chóru. Pieśń pouczająca Dawida."
  tags: []
"Ps52,2":
  text: "Gdy przybył Doeg Edomita i oznajmił Saulowi: Dawid wszedł do domu Achimeleka."
  tags: []
"Ps52,3":
  text: "Czemu chlubisz się złem, bohaterze? Miłosierdzie Boże trwa nieustannie."
  tags: []
"Ps52,4":
  text: "Twój język knuje zniszczenie, ostry jak brzytwa, działający podstępnie."
  tags: []
"Ps52,5":
  text: "Miłujesz zło bardziej niż dobro; kłamstwo bardziej niż mówienie o sprawiedliwości. Sela."
  tags: []
"Ps52,6":
  text: "Miłujesz wszelkie słowa pożerające, podstępny języku."
  tags: []
"Ps52,7":
  text: "Lecz Bóg zniszczy cię na wieki, pochwyci cię i wyrwie z namiotu, i wykorzeni cię z ziemi żyjących. Sela."
  tags: []
"Ps52,8":
  text: "Zobaczą to sprawiedliwi i zlękną się, i roześmieją się nad nim:"
  tags: []
"Ps52,9":
  text: "Oto bohater, który nie uczynił Boga swoją twierdzą, ale ufał swoim wielkim bogactwom i umacniał się w swoich groźbach wobec innych."
  tags: []
