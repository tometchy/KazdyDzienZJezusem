"Ps52,1": "Dla przewodnika chóru. Pieśń pouczająca Dawida."
"Ps52,2": "Gdy przybył Doeg Edomita i oznajmił Saulowi: Dawid wszedł do domu Achimeleka."
"Ps52,3": "Czemu chlubisz się złem, bohaterze? Miłosierdzie Boże trwa nieustannie."
"Ps52,4": "Twój język knuje zniszczenie, ostry jak brzytwa, działający podstępnie."
"Ps52,5": "Miłujesz zło bardziej niż dobro; kłamstwo bardziej niż mówienie o sprawiedliwości. Sela."
"Ps52,6": "Miłujesz wszelkie słowa pożerające, podstępny języku."
"Ps52,7": "Lecz Bóg zniszczy cię na wieki, pochwyci cię i wyrwie z namiotu, i wykorzeni cię z ziemi żyjących. Sela."
"Ps52,8": "Zobaczą to sprawiedliwi i zlękną się, i roześmieją się nad nim:"
"Ps52,9": "Oto bohater, który nie uczynił Boga swoją twierdzą, ale ufał swoim wielkim bogactwom i umacniał się w swoich groźbach wobec innych."
