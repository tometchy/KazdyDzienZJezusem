"Ps121,1":
  text: "Pieśń stopni. Oczy moje wznoszę ku górom: Skąd nadejdzie mi pomoc?"
  tags: []
"Ps121,2":
  text: "Moja pomoc jest od JHWH, który dogląda niebiosa i ziemię."
  tags: []
"Ps121,3":
  text: "On nie pozwoli zachwiać się twojej nodze; ten, który cię strzeże, nie drzemie."
  tags: []
"Ps121,4":
  text: "Oto ten, który strzeże Izraela, nie zdrzemnie się ani nie zaśnie."
  tags: []
"Ps121,5":
  text: "JHWH jest tym, który cię strzeże, JHWH jest cieniem u twej prawej ręki."
  tags: []
"Ps121,6":
  text: "Słońce nie porazi cię za dnia ani księżyc w nocy."
  tags: []
"Ps121,7":
  text: "JHWH będzie cię strzegł od wszelkiego zła; On będzie strzegł twojej duszy."
  tags: []
"Ps121,8":
  text: "JHWH będzie strzegł twojego wyjścia i twojego przyjścia, odtąd aż na wieki."
  tags: []
