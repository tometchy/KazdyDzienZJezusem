"Ps121,1": "Pieśń stopni. Oczy moje wznoszę ku górom: Skąd nadejdzie mi pomoc?"
"Ps121,2": "Moja pomoc jest od JHWH, który dogląda niebiosa i ziemię."
"Ps121,3": "On nie pozwoli zachwiać się twojej nodze; ten, który cię strzeże, nie drzemie."
"Ps121,4": "Oto ten, który strzeże Izraela, nie zdrzemnie się ani nie zaśnie."
"Ps121,5": "JHWH jest tym, który cię strzeże, JHWH jest cieniem u twej prawej ręki."
"Ps121,6": "Słońce nie porazi cię za dnia ani księżyc w nocy."
"Ps121,7": "JHWH będzie cię strzegł od wszelkiego zła; On będzie strzegł twojej duszy."
"Ps121,8": "JHWH będzie strzegł twojego wyjścia i twojego przyjścia, odtąd aż na wieki."
