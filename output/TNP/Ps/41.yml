"Ps41,1":
  text: "Dla przewodnika chóru. Psalm Dawida. Błogosławiony ten, który poświęca uwagę ubogiemu, JHWH go wybawi w dniu niedoli."
  tags: []
"Ps41,2":
  text: "JHWH będzie go strzegł, zachowa przy życiu i uczyni szczęśliwym w tej ziemi i nie wyda go na wolę jego wrogów."
  tags: []
"Ps41,3":
  text: "JHWH wzmocni go na łożu choroby, w cierpieniu poprawi całe jego posłanie."
  tags: []
"Ps41,4":
  text: "Ja powiedziałem: JHWH, zmiłuj się nade mną, uzdrów moją duszę, bo zgrzeszyłem przeciwko Tobie."
  tags: []
"Ps41,5":
  text: "Moi wrogowie powiedzą o mnie źle: Kiedy on umrze i zginie jego imię?"
  tags: []
"Ps41,6":
  text: "A jeśliby ktoś przyszedł mnie zobaczyć, powie puste słowa; jego serce gromadzi sobie nieprawość, a gdy wyjdzie na zewnątrz, będzie o niej mówił."
  tags: []
"Ps41,7":
  text: "Wszyscy, którzy mnie nienawidzą, szepczą razem przeciwko mnie, przeciwko mnie obmyślają zło;"
  tags: []
"Ps41,8":
  text: "Mówiąc: Spadła na niego okropna rzecz, położył się i nie zrobi nic więcej by się podnieść."
  tags: []
"Ps41,9":
  text: "Nawet mój przyjaciel, któremu ufałem, który jadł mój chleb, podniósł przeciwko mnie piętę."
  tags: []
"Ps41,10":
  text: "Ale Ty, JHWH, zmiłuj się nade mną i podnieś mnie, abym im odpłacił."
  tags: []
"Ps41,11":
  text: "Po tym ja poznałem, że masz we mnie upodobanie, bo mój wróg nie będzie już krzyczał z radości przeciwko mnie."
  tags: []
"Ps41,12":
  text: "Lecz Ty wsparłeś mnie przez wzgląd na moją uczciwość i na wieki postawiłeś mnie przed swoim obliczem."
  tags: []
"Ps41,13":
  text: "Błogosławiony JHWH, Bóg Izraela, od wieków aż na wieki. Amen i amen."
  tags: []
