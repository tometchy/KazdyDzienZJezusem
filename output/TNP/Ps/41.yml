"Ps41,1": "Dla przewodnika chóru. Psalm Dawida. Błogosławiony ten, który poświęca uwagę ubogiemu, JHWH go wybawi w dniu niedoli."
"Ps41,2": "JHWH będzie go strzegł, zachowa przy życiu i uczyni szczęśliwym w tej ziemi i nie wyda go na wolę jego wrogów."
"Ps41,3": "JHWH wzmocni go na łożu choroby, w cierpieniu poprawi całe jego posłanie."
"Ps41,4": "Ja powiedziałem: JHWH, zmiłuj się nade mną, uzdrów moją duszę, bo zgrzeszyłem przeciwko Tobie."
"Ps41,5": "Moi wrogowie powiedzą o mnie źle: Kiedy on umrze i zginie jego imię?"
"Ps41,6": "A jeśliby ktoś przyszedł mnie zobaczyć, powie puste słowa; jego serce gromadzi sobie nieprawość, a gdy wyjdzie na zewnątrz, będzie o niej mówił."
"Ps41,7": "Wszyscy, którzy mnie nienawidzą, szepczą razem przeciwko mnie, przeciwko mnie obmyślają zło;"
"Ps41,8": "Mówiąc: Spadła na niego okropna rzecz, położył się i nie zrobi nic więcej by się podnieść."
"Ps41,9": "Nawet mój przyjaciel, któremu ufałem, który jadł mój chleb, podniósł przeciwko mnie piętę."
"Ps41,10": "Ale Ty, JHWH, zmiłuj się nade mną i podnieś mnie, abym im odpłacił."
"Ps41,11": "Po tym ja poznałem, że masz we mnie upodobanie, bo mój wróg nie będzie już krzyczał z radości przeciwko mnie."
"Ps41,12": "Lecz Ty wsparłeś mnie przez wzgląd na moją uczciwość i na wieki postawiłeś mnie przed swoim obliczem."
"Ps41,13": "Błogosławiony JHWH, Bóg Izraela, od wieków aż na wieki. Amen i amen."
