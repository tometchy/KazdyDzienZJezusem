"Ps120,1": "Pieśń stopni. Wołałem do JHWH w swoim utrapieniu i odpowiedział mi."
"Ps120,2": "Wyrwij, JHWH, moją duszę od warg kłamliwych i od języka zdradliwego."
"Ps120,3": "Co ci to da albo co ci to doda zdradliwy języku?"
"Ps120,4": "Że jesteś jak ostre strzały mocarza i węgle z janowca."
"Ps120,5": "Biada mi, że przebywam w Meszek i mieszkam w namiotach Kedaru."
"Ps120,6": "Moja dusza zbyt długo mieszkała z nienawidzącymi pokój."
"Ps120,7": "Ja jestem za pokojem, ale gdy o tym mówię, oni są za wojną."
