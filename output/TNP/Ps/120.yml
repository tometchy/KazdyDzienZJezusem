"Ps120,1":
  text: "Pieśń stopni. Wołałem do JHWH w swoim utrapieniu i odpowiedział mi."
  tags: []
"Ps120,2":
  text: "Wyrwij, JHWH, moją duszę od warg kłamliwych i od języka zdradliwego."
  tags: []
"Ps120,3":
  text: "Co ci to da albo co ci to doda zdradliwy języku?"
  tags: []
"Ps120,4":
  text: "Że jesteś jak ostre strzały mocarza i węgle z janowca."
  tags: []
"Ps120,5":
  text: "Biada mi, że przebywam w Meszek i mieszkam w namiotach Kedaru."
  tags: []
"Ps120,6":
  text: "Moja dusza zbyt długo mieszkała z nienawidzącymi pokój."
  tags: []
"Ps120,7":
  text: "Ja jestem za pokojem, ale gdy o tym mówię, oni są za wojną."
  tags: []
