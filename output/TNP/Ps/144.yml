"Ps144,1": "Psalm Dawida. Błogosławiony JHWH, moja skała, który zaprawia moje ręce do walki, a moje palce do boju."
"Ps144,2": "Moje miłosierdzie i moja twierdza, moja warownia, mój wybawiciel i moja tarcza. Ten, któremu ufam, On mi poddaje mój lud."
"Ps144,3": "JHWH, czym jest człowiek, że zwracasz na niego uwagę? Albo syn człowieka, że o nim pamiętasz?"
"Ps144,4": "Człowiek podobny jest do tchnienia; jego dni są jak cień, który mija."
"Ps144,5": "JHWH, nachyl Twoich niebios i zstąp; dotknij gór, a będą dymić."
"Ps144,6": "Zabłyśnij błyskawicą i rozprosz ich; wypuść swoje strzały i wprowadź ich w zamęt."
"Ps144,7": "Wyciągnij swoją rękę z wysokości; wybaw mnie i ocal z wielkich wód, z ręki synów obcych;"
"Ps144,8": "Których usta mówią kłamstwo, a których prawica jest prawicą zdradliwą."
"Ps144,9": "Boże, zaśpiewam Tobie nową pieśń; zagram Ci na harfie o dziesięciu strunach."
"Ps144,10": "Ty dajesz królom zwycięstwo, a Dawida, swojego sługę, wybawiasz od srogiego miecza."
"Ps144,11": "Wybaw mnie i ocal z ręki synów obcych, których usta mówią kłamstwo, a ich prawica jest prawicą zdradliwą;"
"Ps144,12": "Wtedy nasi synowie będą jak rośliny bujnie rosnące w swojej młodości, a nasze córki jak kolumny wyrzeźbione na wzór kolumn świątyni;"
"Ps144,13": "Nasze spichlerze będą pełne plonów według swego rodzaju, nasze stada według swego rodzaju rodzić będą tysiące i dziesiątki tysięcy na naszych polach;"
"Ps144,14": "Nasze woły będą objuczone, nie będzie złamań ani odejść, ani lamentu na naszych placach."
"Ps144,15": "Błogosławiony lud, któremu w ten sposób się powodzi. Błogosławiony lud, którego Bogiem jest JHWH."
