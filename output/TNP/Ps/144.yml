"Ps144,1":
  text: "Psalm Dawida. Błogosławiony JHWH, moja skała, który zaprawia moje ręce do walki, a moje palce do boju."
  tags: []
"Ps144,2":
  text: "Moje miłosierdzie i moja twierdza, moja warownia, mój wybawiciel i moja tarcza. Ten, któremu ufam, On mi poddaje mój lud."
  tags: []
"Ps144,3":
  text: "JHWH, czym jest człowiek, że zwracasz na niego uwagę? Albo syn człowieka, że o nim pamiętasz?"
  tags: []
"Ps144,4":
  text: "Człowiek podobny jest do tchnienia; jego dni są jak cień, który mija."
  tags: []
"Ps144,5":
  text: "JHWH, nachyl Twoich niebios i zstąp; dotknij gór, a będą dymić."
  tags: []
"Ps144,6":
  text: "Zabłyśnij błyskawicą i rozprosz ich; wypuść swoje strzały i wprowadź ich w zamęt."
  tags: []
"Ps144,7":
  text: "Wyciągnij swoją rękę z wysokości; wybaw mnie i ocal z wielkich wód, z ręki synów obcych;"
  tags: []
"Ps144,8":
  text: "Których usta mówią kłamstwo, a których prawica jest prawicą zdradliwą."
  tags: []
"Ps144,9":
  text: "Boże, zaśpiewam Tobie nową pieśń; zagram Ci na harfie o dziesięciu strunach."
  tags: []
"Ps144,10":
  text: "Ty dajesz królom zwycięstwo, a Dawida, swojego sługę, wybawiasz od srogiego miecza."
  tags: []
"Ps144,11":
  text: "Wybaw mnie i ocal z ręki synów obcych, których usta mówią kłamstwo, a ich prawica jest prawicą zdradliwą;"
  tags: []
"Ps144,12":
  text: "Wtedy nasi synowie będą jak rośliny bujnie rosnące w swojej młodości, a nasze córki jak kolumny wyrzeźbione na wzór kolumn świątyni;"
  tags: []
"Ps144,13":
  text: "Nasze spichlerze będą pełne plonów według swego rodzaju, nasze stada według swego rodzaju rodzić będą tysiące i dziesiątki tysięcy na naszych polach;"
  tags: []
"Ps144,14":
  text: "Nasze woły będą objuczone, nie będzie złamań ani odejść, ani lamentu na naszych placach."
  tags: []
"Ps144,15":
  text: "Błogosławiony lud, któremu w ten sposób się powodzi. Błogosławiony lud, którego Bogiem jest JHWH."
  tags: []
