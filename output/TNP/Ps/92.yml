"Ps92,1":
  text: "Dobrze jest wysławiać JHWH i śpiewać Twojemu imieniu, o Najwyższy."
  tags: []
"Ps92,2":
  text: "Ogłaszać rankiem Twoje miłosierdzie, a po nocach Twoją wierność;"
  tags: []
"Ps92,3":
  text: "Na instrumencie o dziesięciu strunach, na cytrze i na harfie z rozmyślaniem."
  tags: []
"Ps92,4":
  text: "Ponieważ rozradowałeś mnie, JHWH, Twoimi czynami; będę wykrzykiwał z radości z powodu dzieł Twoich rąk."
  tags: []
"Ps92,5":
  text: "O, jak wielkie są Twoje dzieła, JHWH! Bardzo głębokie są Twoje myśli."
  tags: []
"Ps92,6":
  text: "Człowiek nierozumny nie będzie tego znał, a głupi tego nie pojmie."
  tags: []
"Ps92,7":
  text: "Choć niegodziwi rozkwitają jak trawa i rozwijają się wszyscy czyniący nieprawość, to będą zniszczeni aż na wieki;"
  tags: []
"Ps92,8":
  text: "Ty natomiast, JHWH, jesteś Najwyższy na wieki."
  tags: []
"Ps92,9":
  text: "Oto bowiem Twoi wrogowie, JHWH, oto bowiem Twoi wrogowie zginą, zostaną rozproszeni wszyscy czyniący nieprawość."
  tags: []
"Ps92,10":
  text: "Ale mój róg wywyższysz jak rogi bawołu, zostałem namaszczony świeżym olejem."
  tags: []
"Ps92,11":
  text: "I moje oko ujrzało czyhających na mnie, tych, którzy powstają przeciwko mnie, a moje ucho usłyszy czyniących zło."
  tags: []
"Ps92,12":
  text: "Sprawiedliwy rozkwitnie jak palma, rozrośnie się jak cedr na Libanie."
  tags: []
"Ps92,13":
  text: "Ci, którzy zostali zasadzeni w domu JHWH rozkwitną na dziedzińcach naszego Boga."
  tags: []
"Ps92,14":
  text: "Jeszcze w starości wydadzą owoc, są pełni soczystości i świeżości;"
  tags: []
"Ps92,15":
  text: "Aby opowiadać, że JHWH jest prawy; On jest moją skałą i nie ma w nim żadnej nieprawości."
  tags: []
