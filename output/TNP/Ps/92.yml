"Ps92,1": "Dobrze jest wysławiać JHWH i śpiewać Twojemu imieniu, o Najwyższy."
"Ps92,2": "Ogłaszać rankiem Twoje miłosierdzie, a po nocach Twoją wierność;"
"Ps92,3": "Na instrumencie o dziesięciu strunach, na cytrze i na harfie z rozmyślaniem."
"Ps92,4": "Ponieważ rozradowałeś mnie, JHWH, Twoimi czynami; będę wykrzykiwał z radości z powodu dzieł Twoich rąk."
"Ps92,5": "O, jak wielkie są Twoje dzieła, JHWH! Bardzo głębokie są Twoje myśli."
"Ps92,6": "Człowiek nierozumny nie będzie tego znał, a głupi tego nie pojmie."
"Ps92,7": "Choć niegodziwi rozkwitają jak trawa i rozwijają się wszyscy czyniący nieprawość, to będą zniszczeni aż na wieki;"
"Ps92,8": "Ty natomiast, JHWH, jesteś Najwyższy na wieki."
"Ps92,9": "Oto bowiem Twoi wrogowie, JHWH, oto bowiem Twoi wrogowie zginą, zostaną rozproszeni wszyscy czyniący nieprawość."
"Ps92,10": "Ale mój róg wywyższysz jak rogi bawołu, zostałem namaszczony świeżym olejem."
"Ps92,11": "I moje oko ujrzało czyhających na mnie, tych, którzy powstają przeciwko mnie, a moje ucho usłyszy czyniących zło."
"Ps92,12": "Sprawiedliwy rozkwitnie jak palma, rozrośnie się jak cedr na Libanie."
"Ps92,13": "Ci, którzy zostali zasadzeni w domu JHWH rozkwitną na dziedzińcach naszego Boga."
"Ps92,14": "Jeszcze w starości wydadzą owoc, są pełni soczystości i świeżości;"
"Ps92,15": "Aby opowiadać, że JHWH jest prawy; On jest moją skałą i nie ma w nim żadnej nieprawości."
