"Ps60,1":
  text: "Boże, odrzuciłeś nas, złamałeś nas i rozgniewałeś się; odnów nas!"
  tags: []
"Ps60,2":
  text: "Wstrząsnąłeś ziemią i rozdarłeś ją; ulecz jej rozpadliny, bo się chwieje."
  tags: []
"Ps60,3":
  text: "Wskazałeś Twojemu ludowi twardy los, napoiłeś nas winem powodującym chwiejny krok."
  tags: []
"Ps60,4":
  text: "Dałeś sztandar tym, którzy się Ciebie boją, aby mogli schronić się z powodu prawdy. Sela."
  tags: []
"Ps60,5":
  text: "Aby byli ocaleni Twoi umiłowani, wybaw ich swoją prawicą i odpowiedz mi."
  tags: []
"Ps60,6":
  text: "Bóg przemówił w swojej świętości; Z radością rozdzielę Sychem i wymierzę dolinę Sukkot."
  tags: []
"Ps60,7":
  text: "Mój jest Gilead, mój i Manasses, Efraim osłoną mojej głowy, Juda moim prawodawcą."
  tags: []
"Ps60,8":
  text: "Moab moją misą do mycia, na Edom rzucę mój sandał; wiwatuj nad Filisteą."
  tags: []
"Ps60,9":
  text: "Kto mnie wprowadzi do warownego miasta? Kto mnie doprowadzi do Edomu?"
  tags: []
"Ps60,10":
  text: "Czy nie Ty, o Boże, który nas odrzuciłeś i już nie wyruszasz, Boże, z naszymi zastępami?"
  tags: []
"Ps60,11":
  text: "Zapewnij nam pomoc w utrapieniu, bo próżne jest wsparcie człowieka."
  tags: []
"Ps60,12":
  text: "W Bogu uczynimy potężne rzeczy, a On podepcze naszych nieprzyjaciół."
  tags: []
