"Ps60,1": "Boże, odrzuciłeś nas, złamałeś nas i rozgniewałeś się; odnów nas!"
"Ps60,2": "Wstrząsnąłeś ziemią i rozdarłeś ją; ulecz jej rozpadliny, bo się chwieje."
"Ps60,3": "Wskazałeś Twojemu ludowi twardy los, napoiłeś nas winem powodującym chwiejny krok."
"Ps60,4": "Dałeś sztandar tym, którzy się Ciebie boją, aby mogli schronić się z powodu prawdy. Sela."
"Ps60,5": "Aby byli ocaleni Twoi umiłowani, wybaw ich swoją prawicą i odpowiedz mi."
"Ps60,6": "Bóg przemówił w swojej świętości; Z radością rozdzielę Sychem i wymierzę dolinę Sukkot."
"Ps60,7": "Mój jest Gilead, mój i Manasses, Efraim osłoną mojej głowy, Juda moim prawodawcą."
"Ps60,8": "Moab moją misą do mycia, na Edom rzucę mój sandał; wiwatuj nad Filisteą."
"Ps60,9": "Kto mnie wprowadzi do warownego miasta? Kto mnie doprowadzi do Edomu?"
"Ps60,10": "Czy nie Ty, o Boże, który nas odrzuciłeś i już nie wyruszasz, Boże, z naszymi zastępami?"
"Ps60,11": "Zapewnij nam pomoc w utrapieniu, bo próżne jest wsparcie człowieka."
"Ps60,12": "W Bogu uczynimy potężne rzeczy, a On podepcze naszych nieprzyjaciół."
