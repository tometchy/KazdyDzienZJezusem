"Ps8,1":
  text: "O, JHWH, nasz PANIE, jak sławne jest Twoje imię na całej ziemi! Ty, który swoją chwałę wyniosłeś nad niebiosa."
  tags: []
"Ps8,2":
  text: "Z ust niemowląt i ssących ugruntowałeś swą moc z powodu Twoich wrogów, aby poskromić nieprzyjaciela i mściciela."
  tags: []
"Ps8,3":
  text: "Gdy przypatruję się Twoim niebiosom, dziełu Twoich palców, księżycowi i gwiazdom, które rozmieściłeś;"
  tags: []
"Ps8,4":
  text: "To myślę: Kim jest człowiek, że o nim pamiętasz, albo syn człowieczy, że troszczysz się o niego?"
  tags: []
"Ps8,5":
  text: "Uczyniłeś go bowiem niewiele mniejszym od aniołów, chwałą i czcią go ukoronowałeś."
  tags: []
"Ps8,6":
  text: "Dałeś mu władzę nad dziełami Twoich rąk, wszystko poddałeś pod jego stopy:"
  tags: []
"Ps8,7":
  text: "Owce i wszelkie bydło, a także zwierzęta polne;"
  tags: []
"Ps8,8":
  text: "Ptaki niebios i ryby morskie, co przemierzają szlakami mórz."
  tags: []
"Ps8,9":
  text: "O, JHWH, nasz PANIE, jak wielkie jest Twoje imię na całej ziemi!"
  tags: []
