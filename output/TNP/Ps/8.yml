"Ps8,1": "O, JHWH, nasz PANIE, jak sławne jest Twoje imię na całej ziemi! Ty, który swoją chwałę wyniosłeś nad niebiosa."
"Ps8,2": "Z ust niemowląt i ssących ugruntowałeś swą moc z powodu Twoich wrogów, aby poskromić nieprzyjaciela i mściciela."
"Ps8,3": "Gdy przypatruję się Twoim niebiosom, dziełu Twoich palców, księżycowi i gwiazdom, które rozmieściłeś;"
"Ps8,4": "To myślę: Kim jest człowiek, że o nim pamiętasz, albo syn człowieczy, że troszczysz się o niego?"
"Ps8,5": "Uczyniłeś go bowiem niewiele mniejszym od aniołów, chwałą i czcią go ukoronowałeś."
"Ps8,6": "Dałeś mu władzę nad dziełami Twoich rąk, wszystko poddałeś pod jego stopy:"
"Ps8,7": "Owce i wszelkie bydło, a także zwierzęta polne;"
"Ps8,8": "Ptaki niebios i ryby morskie, co przemierzają szlakami mórz."
"Ps8,9": "O, JHWH, nasz PANIE, jak wielkie jest Twoje imię na całej ziemi!"
