"Ps1,1":
  text: "Błogosławiony człowiek, który nie idzie za radą niegodziwych, nie stoi na drodze grzeszników i nie siedzi w gronie szyderców;"
  tags: []
"Ps1,2":
  text: "Lecz jego upodobanie jest w Prawie JHWH i nad Jego Prawem rozmyśla we dnie i w nocy."
  tags: []
"Ps1,3":
  text: "Bo będzie on jak drzewo zasadzone nad strumieniami wód, które wydaje swój owoc w swoim czasie; jego liść nie zwiędnie i wszystko, co robi, powiedzie się."
  tags: []
"Ps1,4":
  text: "Nie tak jest z niegodziwymi; są oni jak plewa, którą wiatr rozwiewa."
  tags: []
"Ps1,5":
  text: "Dlatego też niegodziwi nie podniosą się na sądzie ani grzesznicy w zgromadzeniu sprawiedliwych."
  tags: []
"Ps1,6":
  text: "Bo JHWH zna drogę sprawiedliwych, ale droga niegodziwych zginie."
  tags: []
