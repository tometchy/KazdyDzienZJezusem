"Ps1,1": "Błogosławiony człowiek, który nie idzie za radą niegodziwych, nie stoi na drodze grzeszników i nie siedzi w gronie szyderców;"
"Ps1,2": "Lecz jego upodobanie jest w Prawie JHWH i nad Jego Prawem rozmyśla we dnie i w nocy."
"Ps1,3": "Bo będzie on jak drzewo zasadzone nad strumieniami wód, które wydaje swój owoc w swoim czasie; jego liść nie zwiędnie i wszystko, co robi, powiedzie się."
"Ps1,4": "Nie tak jest z niegodziwymi; są oni jak plewa, którą wiatr rozwiewa."
"Ps1,5": "Dlatego też niegodziwi nie podniosą się na sądzie ani grzesznicy w zgromadzeniu sprawiedliwych."
"Ps1,6": "Bo JHWH zna drogę sprawiedliwych, ale droga niegodziwych zginie."
