"Ps72,1": "Salomonowy. Boże! Daj królowi swoje rozstrzygnięcia i swoją sprawiedliwość synowi króla."
"Ps72,2": "Będzie sądził Twój lud w sprawiedliwości, a Twoich ubogich zgodnie z prawem."
"Ps72,3": "Góry przyniosą ludowi pokój, a pagórki sprawiedliwość."
"Ps72,4": "Będzie sądził ubogich z ludu, wybawi synów potrzebującego, a zgniecie tego, co ciemięży."
"Ps72,5": "Będą się bali ciebie, jak długo trwać będzie słońce przed obliczem księżyca, z pokolenia na pokolenia."
"Ps72,6": "Zstąpi jak deszcz na skoszoną trawę, jak ulewny deszcz nawadniający ziemię."
"Ps72,7": "Za jego dni zakwitnie sprawiedliwy i będzie obfitość pokoju, dopóki nie zabraknie księżyca."
"Ps72,8": "Będzie panował od morza do morza, i od rzeki aż po krańce ziemi."
"Ps72,9": "Przed obliczem jego upadną mieszkańcy pustyni, a jego wrogowie będą lizać proch."
"Ps72,10": "Królowie Tarszisz i wysp przyniosą dary, królowie Szeby i Saby złożą daninę."
"Ps72,11": "I oddadzą mu pokłon wszyscy królowie; będą mu służyć wszystkie narody."
"Ps72,12": "Wyzwoli bowiem ubogiego, gdy zawoła o ratunek, i nędznego, który nie ma pomocy."
"Ps72,13": "Zmiłuje się nad biedakiem i potrzebującym i wyzwoli dusze potrzebujących."
"Ps72,14": "Wykupi ich dusze od ucisku i gwałtu, bo ich krew będzie kosztowna w jego oczach."
"Ps72,15": "I będzie żył, i dadzą mu złoto z Szeby; nieustannie będą się za niego modlić i codziennie mu błogosławić."
"Ps72,16": "I będzie obfitość zboża w ziemi na szczytach gór, jego plon zaszumi jak Liban, a mieszkańcy miast zakwitną jak trawa ziemi."
"Ps72,17": "Niech jego imię trwa na wieki przed obliczem słońca, niech wzrasta jego imię; niech błogosławią sobie w nim wszystkie narody, i niech nazwą go szczęśliwym."
"Ps72,18": "Błogosławiony niech będzie JHWH Bóg, Bóg Izraela, który sam jeden czyni cuda."
"Ps72,19": "I błogosławione na wieki imię Jego chwały; niech cała ziemia zostanie napełniona Jego chwałą. Amen, amen."
"Ps72,20": "I tu zakończyły się modlitwy Dawida, syna Jessego."
