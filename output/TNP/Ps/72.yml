"Ps72,1":
  text: "Salomonowy. Boże! Daj królowi swoje rozstrzygnięcia i swoją sprawiedliwość synowi króla."
  tags: []
"Ps72,2":
  text: "Będzie sądził Twój lud w sprawiedliwości, a Twoich ubogich zgodnie z prawem."
  tags: []
"Ps72,3":
  text: "Góry przyniosą ludowi pokój, a pagórki sprawiedliwość."
  tags: []
"Ps72,4":
  text: "Będzie sądził ubogich z ludu, wybawi synów potrzebującego, a zgniecie tego, co ciemięży."
  tags: []
"Ps72,5":
  text: "Będą się bali ciebie, jak długo trwać będzie słońce przed obliczem księżyca, z pokolenia na pokolenia."
  tags: []
"Ps72,6":
  text: "Zstąpi jak deszcz na skoszoną trawę, jak ulewny deszcz nawadniający ziemię."
  tags: []
"Ps72,7":
  text: "Za jego dni zakwitnie sprawiedliwy i będzie obfitość pokoju, dopóki nie zabraknie księżyca."
  tags: []
"Ps72,8":
  text: "Będzie panował od morza do morza, i od rzeki aż po krańce ziemi."
  tags: []
"Ps72,9":
  text: "Przed obliczem jego upadną mieszkańcy pustyni, a jego wrogowie będą lizać proch."
  tags: []
"Ps72,10":
  text: "Królowie Tarszisz i wysp przyniosą dary, królowie Szeby i Saby złożą daninę."
  tags: []
"Ps72,11":
  text: "I oddadzą mu pokłon wszyscy królowie; będą mu służyć wszystkie narody."
  tags: []
"Ps72,12":
  text: "Wyzwoli bowiem ubogiego, gdy zawoła o ratunek, i nędznego, który nie ma pomocy."
  tags: []
"Ps72,13":
  text: "Zmiłuje się nad biedakiem i potrzebującym i wyzwoli dusze potrzebujących."
  tags: []
"Ps72,14":
  text: "Wykupi ich dusze od ucisku i gwałtu, bo ich krew będzie kosztowna w jego oczach."
  tags: []
"Ps72,15":
  text: "I będzie żył, i dadzą mu złoto z Szeby; nieustannie będą się za niego modlić i codziennie mu błogosławić."
  tags: []
"Ps72,16":
  text: "I będzie obfitość zboża w ziemi na szczytach gór, jego plon zaszumi jak Liban, a mieszkańcy miast zakwitną jak trawa ziemi."
  tags: []
"Ps72,17":
  text: "Niech jego imię trwa na wieki przed obliczem słońca, niech wzrasta jego imię; niech błogosławią sobie w nim wszystkie narody, i niech nazwą go szczęśliwym."
  tags: []
"Ps72,18":
  text: "Błogosławiony niech będzie JHWH Bóg, Bóg Izraela, który sam jeden czyni cuda."
  tags: []
"Ps72,19":
  text: "I błogosławione na wieki imię Jego chwały; niech cała ziemia zostanie napełniona Jego chwałą. Amen, amen."
  tags: []
"Ps72,20":
  text: "I tu zakończyły się modlitwy Dawida, syna Jessego."
  tags: []
