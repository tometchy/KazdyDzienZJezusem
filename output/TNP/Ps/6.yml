"Ps6,1": "JHWH, nie karć mnie w swoim gniewie i nie karz mnie w swojej zapalczywości."
"Ps6,2": "Zmiłuj się nade mną, JHWH, bo jestem słaby; uzdrów mnie, JHWH, bo moje kości drżą;"
"Ps6,3": "I moja dusza bardzo się zatrwożyła; lecz Ty, JHWH, jak długo jeszcze będziesz zwlekał?"
"Ps6,4": "Zawróć, JHWH, ocal moją duszę, wybaw mnie ze względu na Twoje miłosierdzie."
"Ps6,5": "W śmierci bowiem nie ma pamięci o Tobie, a w Szeolu któż będzie Cię wysławiać?"
"Ps6,6": "Zmęczyłem się moim wzdychaniem, całą noc płynie potok łez na moje posłanie, moje łoże rozpuszcza się od łez."
"Ps6,7": "Moje oko osłabło od smutku, zestarzało się z powodu wszystkich moich wrogów."
"Ps6,8": "Odstąpcie ode mnie wszyscy czyniący nieprawość, bo JHWH usłyszał głos mojego płaczu."
"Ps6,9": "JHWH usłyszał moją prośbę o przychylność, JHWH przyjął moją modlitwę."
"Ps6,10": "Niech się zawstydzą i niech się bardzo przestraszą wszyscy moi wrogowie, niech zawrócą i nagle okryją się wstydem."
