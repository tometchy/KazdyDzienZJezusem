"Ps6,1":
  text: "JHWH, nie karć mnie w swoim gniewie i nie karz mnie w swojej zapalczywości."
  tags: []
"Ps6,2":
  text: "Zmiłuj się nade mną, JHWH, bo jestem słaby; uzdrów mnie, JHWH, bo moje kości drżą;"
  tags: []
"Ps6,3":
  text: "I moja dusza bardzo się zatrwożyła; lecz Ty, JHWH, jak długo jeszcze będziesz zwlekał?"
  tags: []
"Ps6,4":
  text: "Zawróć, JHWH, ocal moją duszę, wybaw mnie ze względu na Twoje miłosierdzie."
  tags: []
"Ps6,5":
  text: "W śmierci bowiem nie ma pamięci o Tobie, a w Szeolu któż będzie Cię wysławiać?"
  tags: []
"Ps6,6":
  text: "Zmęczyłem się moim wzdychaniem, całą noc płynie potok łez na moje posłanie, moje łoże rozpuszcza się od łez."
  tags: []
"Ps6,7":
  text: "Moje oko osłabło od smutku, zestarzało się z powodu wszystkich moich wrogów."
  tags: []
"Ps6,8":
  text: "Odstąpcie ode mnie wszyscy czyniący nieprawość, bo JHWH usłyszał głos mojego płaczu."
  tags: []
"Ps6,9":
  text: "JHWH usłyszał moją prośbę o przychylność, JHWH przyjął moją modlitwę."
  tags: []
"Ps6,10":
  text: "Niech się zawstydzą i niech się bardzo przestraszą wszyscy moi wrogowie, niech zawrócą i nagle okryją się wstydem."
  tags: []
