"Ps45,1":
  text: "Moje serce zostało poruszone dobrym słowem; dzieła, które wypowiadam, są dla króla; mój język będzie rysikiem biegłego pisarza."
  tags: []
"Ps45,2":
  text: "Ty jesteś piękniejszy od synów ludzkich; na twoich wargach rozlał się wdzięk, dlatego Bóg pobłogosławił cię na wieki."
  tags: []
"Ps45,3":
  text: "Przypasz do biodra swój miecz, mocarzu, w swojej chwale i dostojeństwie."
  tags: []
"Ps45,4":
  text: "A w swoim dostojeństwie rozwijaj się pomyślnie, wyruszysz ze słowem prawdy, łagodnej sprawiedliwości i niech twoja prawica wskaże ci zdumiewające dzieła."
  tags: []
"Ps45,5":
  text: "Twoje strzały są ostre, narody pod tobą upadną, skierowane są w serce wrogów króla,"
  tags: []
"Ps45,6":
  text: "Twój tron, o Boże, trwa na wieki wieczne, berłem Twojego królestwa jest berło sprawiedliwości."
  tags: []
"Ps45,7":
  text: "Umiłowałeś sprawiedliwość, a brzydzisz się nieprawością, dlatego namaścił cię, o Boże, twój Bóg olejkiem radości bardziej niż twoich towarzyszy."
  tags: []
"Ps45,8":
  text: "Wszystkie twoje szaty pachną mirrą, aloesem i kasją; płynąca z pałaców z kości słoniowej gra na strunach czyni cię radosnym."
  tags: []
"Ps45,9":
  text: "Córki królów są wśród cenionych przez ciebie kobiet, królowa w złocie z Ofiru stanęła po twojej prawicy."
  tags: []
"Ps45,10":
  text: "Posłuchaj córko, spójrz i nakłoń ucha, zapomnij o swoim ludzie i o domu swojego ojca;"
  tags: []
"Ps45,11":
  text: "A król zapragnie twojego piękna, bo on jest twoim panem; oddaj mu pokłon."
  tags: []
"Ps45,12":
  text: "Także córka Tyru przyjdzie z darami, najbogatsi z ludu będą prosić o przychylność twojego oblicza."
  tags: []
"Ps45,13":
  text: "W środku córka królewska w całej swojej świetności, a jej szata przetykana złotem."
  tags: []
"Ps45,14":
  text: "W kolorowej szacie będą ją prowadzić do króla, za nią dziewice, jej towarzyszki, są prowadzone do ciebie."
  tags: []
"Ps45,15":
  text: "Prowadzą je z weselem i z radością, i wejdą do pałacu króla."
  tags: []
"Ps45,16":
  text: "Zamiast twoich ojców, będą twoi synowie, których ustanowisz książętami po całej ziemi."
  tags: []
"Ps45,17":
  text: "Upamiętnię twoje imię po wszystkie pokolenia; dlatego narody będą cię wysławiać na wieki wieczne."
  tags: []
