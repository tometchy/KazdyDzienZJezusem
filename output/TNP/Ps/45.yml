"Ps45,1": "Moje serce zostało poruszone dobrym słowem; dzieła, które wypowiadam, są dla króla; mój język będzie rysikiem biegłego pisarza."
"Ps45,2": "Ty jesteś piękniejszy od synów ludzkich; na twoich wargach rozlał się wdzięk, dlatego Bóg pobłogosławił cię na wieki."
"Ps45,3": "Przypasz do biodra swój miecz, mocarzu, w swojej chwale i dostojeństwie."
"Ps45,4": "A w swoim dostojeństwie rozwijaj się pomyślnie, wyruszysz ze słowem prawdy, łagodnej sprawiedliwości i niech twoja prawica wskaże ci zdumiewające dzieła."
"Ps45,5": "Twoje strzały są ostre, narody pod tobą upadną, skierowane są w serce wrogów króla,"
"Ps45,6": "Twój tron, o Boże, trwa na wieki wieczne, berłem Twojego królestwa jest berło sprawiedliwości."
"Ps45,7": "Umiłowałeś sprawiedliwość, a brzydzisz się nieprawością, dlatego namaścił cię, o Boże, twój Bóg olejkiem radości bardziej niż twoich towarzyszy."
"Ps45,8": "Wszystkie twoje szaty pachną mirrą, aloesem i kasją; płynąca z pałaców z kości słoniowej gra na strunach czyni cię radosnym."
"Ps45,9": "Córki królów są wśród cenionych przez ciebie kobiet, królowa w złocie z Ofiru stanęła po twojej prawicy."
"Ps45,10": "Posłuchaj córko, spójrz i nakłoń ucha, zapomnij o swoim ludzie i o domu swojego ojca;"
"Ps45,11": "A król zapragnie twojego piękna, bo on jest twoim panem; oddaj mu pokłon."
"Ps45,12": "Także córka Tyru przyjdzie z darami, najbogatsi z ludu będą prosić o przychylność twojego oblicza."
"Ps45,13": "W środku córka królewska w całej swojej świetności, a jej szata przetykana złotem."
"Ps45,14": "W kolorowej szacie będą ją prowadzić do króla, za nią dziewice, jej towarzyszki, są prowadzone do ciebie."
"Ps45,15": "Prowadzą je z weselem i z radością, i wejdą do pałacu króla."
"Ps45,16": "Zamiast twoich ojców, będą twoi synowie, których ustanowisz książętami po całej ziemi."
"Ps45,17": "Upamiętnię twoje imię po wszystkie pokolenia; dlatego narody będą cię wysławiać na wieki wieczne."
