"Ps124,1":
  text: "Pieśń stopni. Dawida. Gdyby nie JHWH, który był po naszej stronie, niech powie teraz Izrael;"
  tags: []
"Ps124,2":
  text: "Gdyby nie JHWH, który był po naszej stronie, gdy powstawał przeciwko nam człowiek;"
  tags: []
"Ps124,3":
  text: "Wówczas by nas pożarli żywcem, gdy płonęli gniewem przeciwko nam;"
  tags: []
"Ps124,4":
  text: "Wtedy zmyłyby nas wody, a potok przelałby się nad naszymi duszami;"
  tags: []
"Ps124,5":
  text: "Wtedy wzburzone wody przelałyby się nad naszymi duszami."
  tags: []
"Ps124,6":
  text: "Błogosławiony JHWH, który nas nie wydał na rozszarpanie ich kłom."
  tags: []
"Ps124,7":
  text: "Nasza dusza umknęła jak ptak z pułapki łowiącego; pułapka została zniszczona, a my umknęliśmy."
  tags: []
"Ps124,8":
  text: "Nasza pomoc jest w imieniu JHWH, który dogląda niebiosa i ziemię."
  tags: []
