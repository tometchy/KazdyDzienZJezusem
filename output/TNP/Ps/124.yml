"Ps124,1": "Pieśń stopni. Dawida. Gdyby nie JHWH, który był po naszej stronie, niech powie teraz Izrael;"
"Ps124,2": "Gdyby nie JHWH, który był po naszej stronie, gdy powstawał przeciwko nam człowiek;"
"Ps124,3": "Wówczas by nas pożarli żywcem, gdy płonęli gniewem przeciwko nam;"
"Ps124,4": "Wtedy zmyłyby nas wody, a potok przelałby się nad naszymi duszami;"
"Ps124,5": "Wtedy wzburzone wody przelałyby się nad naszymi duszami."
"Ps124,6": "Błogosławiony JHWH, który nas nie wydał na rozszarpanie ich kłom."
"Ps124,7": "Nasza dusza umknęła jak ptak z pułapki łowiącego; pułapka została zniszczona, a my umknęliśmy."
"Ps124,8": "Nasza pomoc jest w imieniu JHWH, który dogląda niebiosa i ziemię."
