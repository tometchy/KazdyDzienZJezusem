"Ps99,1":
  text: "JHWH króluje, niech drżą narody; siedzi ponad cherubami, niech zatrzęsie się ziemia."
  tags: []
"Ps99,2":
  text: "Wielki jest JHWH na Syjonie i wywyższony nad wszystkie narody."
  tags: []
"Ps99,3":
  text: "Niech wysławiają Jego wielkie i budzące lęk imię. On jest święty."
  tags: []
"Ps99,4":
  text: "I potężny – król miłujący sąd. Ty ustanowiłeś to, co słuszne. Ty wykonujesz sąd i sprawiedliwość w Jakubie."
  tags: []
"Ps99,5":
  text: "Wywyższajcie JHWH, naszego Boga, i oddajcie pokłon u podnóżka Jego stóp. On jest święty."
  tags: []
"Ps99,6":
  text: "Mojżesz i Aaron wśród Jego kapłanów, a Samuel wśród tych, którzy wzywają Jego imienia; wołali do JHWH, a On im odpowiedział."
  tags: []
"Ps99,7":
  text: "W słupie obłoku mówił do nich, a oni strzegli Jego świadectw i dekretów, które im dał."
  tags: []
"Ps99,8":
  text: "JHWH, nasz Boże, Ty im odpowiedziałeś, byłeś dla nich Bogiem, który przebacza, lecz także karze za ich złe czyny."
  tags: []
"Ps99,9":
  text: "Wywyższajcie JHWH, naszego Boga, i oddajcie pokłon na Jego świętej górze, bo JHWH, nasz Bóg, jest święty."
  tags: []
