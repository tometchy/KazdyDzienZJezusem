"Ps99,1": "JHWH króluje, niech drżą narody; siedzi ponad cherubami, niech zatrzęsie się ziemia."
"Ps99,2": "Wielki jest JHWH na Syjonie i wywyższony nad wszystkie narody."
"Ps99,3": "Niech wysławiają Jego wielkie i budzące lęk imię. On jest święty."
"Ps99,4": "I potężny – król miłujący sąd. Ty ustanowiłeś to, co słuszne. Ty wykonujesz sąd i sprawiedliwość w Jakubie."
"Ps99,5": "Wywyższajcie JHWH, naszego Boga, i oddajcie pokłon u podnóżka Jego stóp. On jest święty."
"Ps99,6": "Mojżesz i Aaron wśród Jego kapłanów, a Samuel wśród tych, którzy wzywają Jego imienia; wołali do JHWH, a On im odpowiedział."
"Ps99,7": "W słupie obłoku mówił do nich, a oni strzegli Jego świadectw i dekretów, które im dał."
"Ps99,8": "JHWH, nasz Boże, Ty im odpowiedziałeś, byłeś dla nich Bogiem, który przebacza, lecz także karze za ich złe czyny."
"Ps99,9": "Wywyższajcie JHWH, naszego Boga, i oddajcie pokłon na Jego świętej górze, bo JHWH, nasz Bóg, jest święty."
