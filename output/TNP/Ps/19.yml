"Ps19,1":
  text: "Niebiosa ogłaszają chwałę Boga, a firmament obwieszcza dzieło Jego rąk."
  tags: []
"Ps19,2":
  text: "Dzień dniowi przekazuje słowo, a noc nocy oznajmia wiedzę."
  tags: []
"Ps19,3":
  text: "Bez mowy i bez słów, nie słychać ich głosu."
  tags: []
"Ps19,4":
  text: "Po całej ziemi rozciąga się ich dźwięk i na krańce świata ich przekaz. Na nich wystawił namiot słońcu."
  tags: []
"Ps19,5":
  text: "A ono wychodzi jak pan młody ze swojej komnaty, wykrzykuje z radości jak bohater, który rozpoczyna swoją drogę."
  tags: []
"Ps19,6":
  text: "Jego wschód na krańcu niebios i obiega je na ich krańcach, a nic nie ukryje się przed jego żarem."
  tags: []
"Ps19,7":
  text: "Prawo JHWH jest doskonałe, nawracające duszę; świadectwo JHWH pewne, czyni mądrym prostodusznego."
  tags: []
"Ps19,8":
  text: "Ustawy JHWH są prawe, radujące serce; przykazanie JHWH wyraźne, oświecające oczy."
  tags: []
"Ps19,9":
  text: "Bojaźń JHWH jest czysta, trwająca na wieki; sądy JHWH prawdziwe, wszystkie są słuszne,"
  tags: []
"Ps19,10":
  text: "Bardziej pożądane niż złoto, niż mnóstwo szczerego złota, i słodsze niż miód, nawet niż plaster miodu."
  tags: []
"Ps19,11":
  text: "Także Twój sługa jest przez nie oświecony, a kto je przestrzega, otrzymuje wielką nagrodę."
  tags: []
"Ps19,12":
  text: "Kto zrozumie własne błędy? Oczyść mnie od tych ukrytych przede mną."
  tags: []
"Ps19,13":
  text: "Chroń też swojego sługę od zuchwałych, aby nie panowali nade mną. Wtedy będę prawym i wolnym od wielkiego przestępstwa."
  tags: []
"Ps19,14":
  text: "Niech będą miłe słowa moich ust i rozmyślanie mojego serca przed Twoim obliczem, JHWH, moja Skało i mój Odkupicielu!"
  tags: []
