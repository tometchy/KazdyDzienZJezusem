"Ps19,1": "Niebiosa ogłaszają chwałę Boga, a firmament obwieszcza dzieło Jego rąk."
"Ps19,2": "Dzień dniowi przekazuje słowo, a noc nocy oznajmia wiedzę."
"Ps19,3": "Bez mowy i bez słów, nie słychać ich głosu."
"Ps19,4": "Po całej ziemi rozciąga się ich dźwięk i na krańce świata ich przekaz. Na nich wystawił namiot słońcu."
"Ps19,5": "A ono wychodzi jak pan młody ze swojej komnaty, wykrzykuje z radości jak bohater, który rozpoczyna swoją drogę."
"Ps19,6": "Jego wschód na krańcu niebios i obiega je na ich krańcach, a nic nie ukryje się przed jego żarem."
"Ps19,7": "Prawo JHWH jest doskonałe, nawracające duszę; świadectwo JHWH pewne, czyni mądrym prostodusznego."
"Ps19,8": "Ustawy JHWH są prawe, radujące serce; przykazanie JHWH wyraźne, oświecające oczy."
"Ps19,9": "Bojaźń JHWH jest czysta, trwająca na wieki; sądy JHWH prawdziwe, wszystkie są słuszne,"
"Ps19,10": "Bardziej pożądane niż złoto, niż mnóstwo szczerego złota, i słodsze niż miód, nawet niż plaster miodu."
"Ps19,11": "Także Twój sługa jest przez nie oświecony, a kto je przestrzega, otrzymuje wielką nagrodę."
"Ps19,12": "Kto zrozumie własne błędy? Oczyść mnie od tych ukrytych przede mną."
"Ps19,13": "Chroń też swojego sługę od zuchwałych, aby nie panowali nade mną. Wtedy będę prawym i wolnym od wielkiego przestępstwa."
"Ps19,14": "Niech będą miłe słowa moich ust i rozmyślanie mojego serca przed Twoim obliczem, JHWH, moja Skało i mój Odkupicielu!"
