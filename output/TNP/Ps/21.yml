"Ps21,1": "Przewodnikowi chóru. Psalm Dawida. JHWH! Król będzie się cieszyć z Twojej mocy i jakże bardzo radować się będzie Twoim zbawieniem!"
"Ps21,2": "Spełniłeś pragnienie jego serca i prośbie jego ust nie odmówiłeś. Sela."
"Ps21,3": "Wyszedłeś mu bowiem naprzeciw z obfitymi błogosławieństwami, koronę z czystego złota włożyłeś mu na głowę."
"Ps21,4": "Prosił Cię o życie i dałeś mu je, długie dni na wieki wieków."
"Ps21,5": "Wielka jest jego chwała dzięki Twojemu zbawieniu, okryłeś go sławą i dostojeństwem;"
"Ps21,6": "Bo uczyniłeś go błogosławieństwem na zawsze, rozweseliłeś go radością swojego oblicza."
"Ps21,7": "Król bowiem w JHWH pokłada ufność i nie zachwieje się dzięki miłosierdziu Najwyższego."
"Ps21,8": "Twoja ręka znajdzie wszystkich Twoich wrogów; Twoja prawica dosięgnie wszystkich, którzy Cię nienawidzą."
"Ps21,9": "Umieścisz ich jakby w piecu ognistym w czasie Twojego oblicza; JHWH w swojej zapalczywości ich pochłonie, a ogień ich strawi."
"Ps21,10": "Wytracisz z ziemi ich owoc, a ich potomstwo spośród synów ludzkich."
"Ps21,11": "Bo uknuli zło przeciwko Tobie, wymyślili spisek, którego nie mogli wykonać."
"Ps21,12": "Dlatego zmusisz ich do ucieczki, cięciwy będą napięte przeciwko nim."
"Ps21,13": "Powstań, JHWH, w swojej mocy; będziemy śpiewać i grać na chwałę Twojej potęgi."
