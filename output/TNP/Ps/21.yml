"Ps21,1":
  text: "Przewodnikowi chóru. Psalm Dawida. JHWH! Król będzie się cieszyć z Twojej mocy i jakże bardzo radować się będzie Twoim zbawieniem!"
  tags: []
"Ps21,2":
  text: "Spełniłeś pragnienie jego serca i prośbie jego ust nie odmówiłeś. Sela."
  tags: []
"Ps21,3":
  text: "Wyszedłeś mu bowiem naprzeciw z obfitymi błogosławieństwami, koronę z czystego złota włożyłeś mu na głowę."
  tags: []
"Ps21,4":
  text: "Prosił Cię o życie i dałeś mu je, długie dni na wieki wieków."
  tags: []
"Ps21,5":
  text: "Wielka jest jego chwała dzięki Twojemu zbawieniu, okryłeś go sławą i dostojeństwem;"
  tags: []
"Ps21,6":
  text: "Bo uczyniłeś go błogosławieństwem na zawsze, rozweseliłeś go radością swojego oblicza."
  tags: []
"Ps21,7":
  text: "Król bowiem w JHWH pokłada ufność i nie zachwieje się dzięki miłosierdziu Najwyższego."
  tags: []
"Ps21,8":
  text: "Twoja ręka znajdzie wszystkich Twoich wrogów; Twoja prawica dosięgnie wszystkich, którzy Cię nienawidzą."
  tags: []
"Ps21,9":
  text: "Umieścisz ich jakby w piecu ognistym w czasie Twojego oblicza; JHWH w swojej zapalczywości ich pochłonie, a ogień ich strawi."
  tags: []
"Ps21,10":
  text: "Wytracisz z ziemi ich owoc, a ich potomstwo spośród synów ludzkich."
  tags: []
"Ps21,11":
  text: "Bo uknuli zło przeciwko Tobie, wymyślili spisek, którego nie mogli wykonać."
  tags: []
"Ps21,12":
  text: "Dlatego zmusisz ich do ucieczki, cięciwy będą napięte przeciwko nim."
  tags: []
"Ps21,13":
  text: "Powstań, JHWH, w swojej mocy; będziemy śpiewać i grać na chwałę Twojej potęgi."
  tags: []
