"Ps88,1":
  text: "JHWH, Boże mojego zbawienia, wołam za dnia i w nocy staję przed Tobą."
  tags: []
"Ps88,2":
  text: "Niech dojdzie przed Twoje oblicze moja modlitwa, nakłoń swojego ucha na moje błaganie."
  tags: []
"Ps88,3":
  text: "Moja dusza bowiem nasycona jest utrapieniem, a moje życie zbliża się do Szeolu."
  tags: []
"Ps88,4":
  text: "Zostałem zaliczony do tych, którzy zstępują do dołu; stałem się jak mocarz bez siły."
  tags: []
"Ps88,5":
  text: "Wolny wśród umarłych; tak jak zabici, leżący w grobie, których już więcej nie wspominasz, bo oni zostali odcięci od Twojej ręki."
  tags: []
"Ps88,6":
  text: "Położyłeś mnie w najgłębszym dole, w ciemności i w głębinach."
  tags: []
"Ps88,7":
  text: "Twój gniew spoczął na mnie i utrapiłeś mnie wszystkimi Twoimi nawałnicami. Sela."
  tags: []
"Ps88,8":
  text: "Odsunąłeś ode mnie moich znajomych, uczyniłeś mnie dla nich ohydą; zostałem zamknięty i nie wyjdę."
  tags: []
"Ps88,9":
  text: "Moje oko słabnie z powodu utrapienia; wzywam Cię, JHWH, każdego dnia wyciągam do Ciebie swoje ręce."
  tags: []
"Ps88,10":
  text: "Czy dla umarłych uczynisz cud? Czy cienie powstaną, aby Cię wysławiać? Sela."
  tags: []
"Ps88,11":
  text: "Czy w grobie opowiada się o Twoim miłosierdziu, a o Twojej wierności – w miejscu zniszczenia?"
  tags: []
"Ps88,12":
  text: "Czy Twój cud da się dostrzec w ciemności, a Twoją sprawiedliwość w kraju zapomnienia?"
  tags: []
"Ps88,13":
  text: "Lecz ja, JHWH, do Ciebie wołam; rankiem moja modlitwa staje przed Tobą."
  tags: []
"Ps88,14":
  text: "Dlaczego, JHWH, odrzucasz moją duszę i ukrywasz przede mną swoje oblicze?"
  tags: []
"Ps88,15":
  text: "Ja jestem ubogi i umierający; od młodości dźwigam lęk przed Tobą i jestem zrozpaczony."
  tags: []
"Ps88,16":
  text: "Przeszły nade mną fale Twojego srogiego gniewu, a trwoga przed Tobą niszczy mnie."
  tags: []
"Ps88,17":
  text: "Ogarniają mnie co dzień jak wody, wszystkie razem mnie otaczają."
  tags: []
"Ps88,18":
  text: "Oddaliłeś ode mnie tego, który mnie miłuje i przyjaciela, a jest mi znany tylko mrok."
  tags: []
