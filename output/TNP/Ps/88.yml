"Ps88,1": "JHWH, Boże mojego zbawienia, wołam za dnia i w nocy staję przed Tobą."
"Ps88,2": "Niech dojdzie przed Twoje oblicze moja modlitwa, nakłoń swojego ucha na moje błaganie."
"Ps88,3": "Moja dusza bowiem nasycona jest utrapieniem, a moje życie zbliża się do Szeolu."
"Ps88,4": "Zostałem zaliczony do tych, którzy zstępują do dołu; stałem się jak mocarz bez siły."
"Ps88,5": "Wolny wśród umarłych; tak jak zabici, leżący w grobie, których już więcej nie wspominasz, bo oni zostali odcięci od Twojej ręki."
"Ps88,6": "Położyłeś mnie w najgłębszym dole, w ciemności i w głębinach."
"Ps88,7": "Twój gniew spoczął na mnie i utrapiłeś mnie wszystkimi Twoimi nawałnicami. Sela."
"Ps88,8": "Odsunąłeś ode mnie moich znajomych, uczyniłeś mnie dla nich ohydą; zostałem zamknięty i nie wyjdę."
"Ps88,9": "Moje oko słabnie z powodu utrapienia; wzywam Cię, JHWH, każdego dnia wyciągam do Ciebie swoje ręce."
"Ps88,10": "Czy dla umarłych uczynisz cud? Czy cienie powstaną, aby Cię wysławiać? Sela."
"Ps88,11": "Czy w grobie opowiada się o Twoim miłosierdziu, a o Twojej wierności – w miejscu zniszczenia?"
"Ps88,12": "Czy Twój cud da się dostrzec w ciemności, a Twoją sprawiedliwość w kraju zapomnienia?"
"Ps88,13": "Lecz ja, JHWH, do Ciebie wołam; rankiem moja modlitwa staje przed Tobą."
"Ps88,14": "Dlaczego, JHWH, odrzucasz moją duszę i ukrywasz przede mną swoje oblicze?"
"Ps88,15": "Ja jestem ubogi i umierający; od młodości dźwigam lęk przed Tobą i jestem zrozpaczony."
"Ps88,16": "Przeszły nade mną fale Twojego srogiego gniewu, a trwoga przed Tobą niszczy mnie."
"Ps88,17": "Ogarniają mnie co dzień jak wody, wszystkie razem mnie otaczają."
"Ps88,18": "Oddaliłeś ode mnie tego, który mnie miłuje i przyjaciela, a jest mi znany tylko mrok."
