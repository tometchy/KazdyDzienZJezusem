"Ps48,1": "Wielki jest JHWH i godny wielkiej chwały w mieście naszego Boga, na swojej świętej górze."
"Ps48,2": "Piękne wzniesienie, radość dla całej ziemi. Góra Syjon szczyt północy, miasto Wielkiego Króla."
"Ps48,3": "Bóg w swoich pałacach jest uznany za twierdzę."
"Ps48,4": "Bo oto zgromadzili się królowie i razem się zeszli."
"Ps48,5": "Lecz gdy zobaczyli, zdumieli się, przerazili się i w popłochu uciekli."
"Ps48,6": "Drżenie tam ich ogarnęło i ból, jak rodzącą kobietę."
"Ps48,7": "Wiatrem wschodnim rozbijasz okręty Tarszisz."
"Ps48,8": "To, co usłyszeliśmy, to także zobaczyliśmy w mieście JHWH Zastępów, w mieście naszego Boga; Bóg je utrwali na wieki. Sela."
"Ps48,9": "Rozważyliśmy, o Boże, Twoje miłosierdzie we wnętrzu Twojej świątyni."
"Ps48,10": "Jak Twoje imię, Boże, tak też chwała Twoja sięga aż po krańce ziemi; Twoja prawica pełna jest sprawiedliwości."
"Ps48,11": "Niech się weseli góra Syjon, niech się radują córki Judy z powodu Twoich sądów."
"Ps48,12": "Okrążcie Syjon i obejdźcie go, policzcie jego wieże."
"Ps48,13": "Zwróćcie swoje wnętrze ku jego umocnieniom, oglądajcie jego pałace, abyście mogli opowiadać o tym przyszłemu pokoleniu."
"Ps48,14": "Bo ten Bóg jest naszym Bogiem na wieki wieków, On będzie nas prowadził aż do samej śmierci."
