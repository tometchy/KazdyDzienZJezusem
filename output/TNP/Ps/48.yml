"Ps48,1":
  text: "Wielki jest JHWH i godny wielkiej chwały w mieście naszego Boga, na swojej świętej górze."
  tags: []
"Ps48,2":
  text: "Piękne wzniesienie, radość dla całej ziemi. Góra Syjon szczyt północy, miasto Wielkiego Króla."
  tags: []
"Ps48,3":
  text: "Bóg w swoich pałacach jest uznany za twierdzę."
  tags: []
"Ps48,4":
  text: "Bo oto zgromadzili się królowie i razem się zeszli."
  tags: []
"Ps48,5":
  text: "Lecz gdy zobaczyli, zdumieli się, przerazili się i w popłochu uciekli."
  tags: []
"Ps48,6":
  text: "Drżenie tam ich ogarnęło i ból, jak rodzącą kobietę."
  tags: []
"Ps48,7":
  text: "Wiatrem wschodnim rozbijasz okręty Tarszisz."
  tags: []
"Ps48,8":
  text: "To, co usłyszeliśmy, to także zobaczyliśmy w mieście JHWH Zastępów, w mieście naszego Boga; Bóg je utrwali na wieki. Sela."
  tags: []
"Ps48,9":
  text: "Rozważyliśmy, o Boże, Twoje miłosierdzie we wnętrzu Twojej świątyni."
  tags: []
"Ps48,10":
  text: "Jak Twoje imię, Boże, tak też chwała Twoja sięga aż po krańce ziemi; Twoja prawica pełna jest sprawiedliwości."
  tags: []
"Ps48,11":
  text: "Niech się weseli góra Syjon, niech się radują córki Judy z powodu Twoich sądów."
  tags: []
"Ps48,12":
  text: "Okrążcie Syjon i obejdźcie go, policzcie jego wieże."
  tags: []
"Ps48,13":
  text: "Zwróćcie swoje wnętrze ku jego umocnieniom, oglądajcie jego pałace, abyście mogli opowiadać o tym przyszłemu pokoleniu."
  tags: []
"Ps48,14":
  text: "Bo ten Bóg jest naszym Bogiem na wieki wieków, On będzie nas prowadził aż do samej śmierci."
  tags: []
