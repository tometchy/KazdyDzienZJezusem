"Ps79,1":
  text: "Psalm Asafa. Boże! Poganie wkroczyli do Twojego dziedzictwa, skalali Twoją świętą świątynię, Jerozolimę uczynili ruiną."
  tags: []
"Ps79,2":
  text: "Zwłoki Twoich sług dali na żer ptactwu nieba, ciała Twoich świętych zwierzętom ziemi."
  tags: []
"Ps79,3":
  text: "Rozlali ich krew jak wodę wokół Jerozolimy i nie było nikogo, kto by ich pogrzebał."
  tags: []
"Ps79,4":
  text: "Staliśmy się hańbą dla naszych sąsiadów, pośmiewiskiem i drwiną dla tych, którzy są wokoło nas."
  tags: []
"Ps79,5":
  text: "Jak długo, JHWH? Czy wiecznie będziesz się gniewał? Czy Twoja zazdrość będzie płonąć jak ogień?"
  tags: []
"Ps79,6":
  text: "Wylej swoją zapalczywość na pogan, którzy Cię nie uznają, i na królestwa, które nie wzywają Twojego imienia."
  tags: []
"Ps79,7":
  text: "Pożarli bowiem Jakuba i spustoszyli jego mieszkanie."
  tags: []
"Ps79,8":
  text: "Nie pamiętaj nam dawnych naszych nieprawości, niech jak najszybciej spotka nas Twoje miłosierdzie, bo jesteśmy bardzo wynędzniali."
  tags: []
"Ps79,9":
  text: "Pomóż nam, Boże naszego zbawienia, dla sprawy chwały Twojego imienia ocal nas i przebacz nam grzechy ze względu na Twoje imię."
  tags: []
"Ps79,10":
  text: "Dlaczego poganie mają mówić: Gdzie jest ich Bóg? Niech będzie na naszych oczach znana wśród pogan pomsta za przelaną krew Twoich sług."
  tags: []
"Ps79,11":
  text: "Niech dojdzie przed Twoje oblicze jęk więźniów, według potęgi Twojego ramienia zachowaj przy życiu synów skazanych na śmierć."
  tags: []
"Ps79,12":
  text: "I odpłać naszym sąsiadom siedmiokrotnie w ich zanadrze za drwinę, którą Ci urągali, PANIE!"
  tags: []
"Ps79,13":
  text: "A my, Twój lud i owce Twojego pastwiska, będziemy Cię wysławiać na wieki, będziemy głosić Twoją chwałę z pokolenia na pokolenie."
  tags: []
