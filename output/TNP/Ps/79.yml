"Ps79,1": "Psalm Asafa. Boże! Poganie wkroczyli do Twojego dziedzictwa, skalali Twoją świętą świątynię, Jerozolimę uczynili ruiną."
"Ps79,2": "Zwłoki Twoich sług dali na żer ptactwu nieba, ciała Twoich świętych zwierzętom ziemi."
"Ps79,3": "Rozlali ich krew jak wodę wokół Jerozolimy i nie było nikogo, kto by ich pogrzebał."
"Ps79,4": "Staliśmy się hańbą dla naszych sąsiadów, pośmiewiskiem i drwiną dla tych, którzy są wokoło nas."
"Ps79,5": "Jak długo, JHWH? Czy wiecznie będziesz się gniewał? Czy Twoja zazdrość będzie płonąć jak ogień?"
"Ps79,6": "Wylej swoją zapalczywość na pogan, którzy Cię nie uznają, i na królestwa, które nie wzywają Twojego imienia."
"Ps79,7": "Pożarli bowiem Jakuba i spustoszyli jego mieszkanie."
"Ps79,8": "Nie pamiętaj nam dawnych naszych nieprawości, niech jak najszybciej spotka nas Twoje miłosierdzie, bo jesteśmy bardzo wynędzniali."
"Ps79,9": "Pomóż nam, Boże naszego zbawienia, dla sprawy chwały Twojego imienia ocal nas i przebacz nam grzechy ze względu na Twoje imię."
"Ps79,10": "Dlaczego poganie mają mówić: Gdzie jest ich Bóg? Niech będzie na naszych oczach znana wśród pogan pomsta za przelaną krew Twoich sług."
"Ps79,11": "Niech dojdzie przed Twoje oblicze jęk więźniów, według potęgi Twojego ramienia zachowaj przy życiu synów skazanych na śmierć."
"Ps79,12": "I odpłać naszym sąsiadom siedmiokrotnie w ich zanadrze za drwinę, którą Ci urągali, PANIE!"
"Ps79,13": "A my, Twój lud i owce Twojego pastwiska, będziemy Cię wysławiać na wieki, będziemy głosić Twoją chwałę z pokolenia na pokolenie."
