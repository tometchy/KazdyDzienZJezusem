"Ps129,1": "Pieśń stopni. Bardzo mnie uciskali od mojej młodości – niech powie teraz Izrael;"
"Ps129,2": "Bardzo mnie uciskali od mojej młodości, jednak mnie nie przemogli."
"Ps129,3": "Po moim grzbiecie orali orzący i wydłużyli swoje bruzdy."
"Ps129,4": "Ale JHWH jest sprawiedliwy; przeciął powrozy niegodziwych."
"Ps129,5": "Niech się zawstydzą i odstąpią w tył wszyscy nienawidzący Syjonu."
"Ps129,6": "Staną się jak trawa na dachach, która usycha, zanim wyrośnie;"
"Ps129,7": "Którą żniwiarz nawet nie napełni swojej dłoni ani swojego naręcza ten, który wiąże snopy."
"Ps129,8": "I nie powiedzą przechodzący obok: Niech będzie z wami błogosławieństwo JHWH. Błogosławimy wam w imieniu JHWH."
