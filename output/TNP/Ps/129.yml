"Ps129,1":
  text: "Pieśń stopni. Bardzo mnie uciskali od mojej młodości – niech powie teraz Izrael;"
  tags: []
"Ps129,2":
  text: "Bardzo mnie uciskali od mojej młodości, jednak mnie nie przemogli."
  tags: []
"Ps129,3":
  text: "Po moim grzbiecie orali orzący i wydłużyli swoje bruzdy."
  tags: []
"Ps129,4":
  text: "Ale JHWH jest sprawiedliwy; przeciął powrozy niegodziwych."
  tags: []
"Ps129,5":
  text: "Niech się zawstydzą i odstąpią w tył wszyscy nienawidzący Syjonu."
  tags: []
"Ps129,6":
  text: "Staną się jak trawa na dachach, która usycha, zanim wyrośnie;"
  tags: []
"Ps129,7":
  text: "Którą żniwiarz nawet nie napełni swojej dłoni ani swojego naręcza ten, który wiąże snopy."
  tags: []
"Ps129,8":
  text: "I nie powiedzą przechodzący obok: Niech będzie z wami błogosławieństwo JHWH. Błogosławimy wam w imieniu JHWH."
  tags: []
