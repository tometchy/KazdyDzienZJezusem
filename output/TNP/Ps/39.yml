"Ps39,1": "Powiedziałem: Będę strzegł moich dróg, abym nie zgrzeszył językiem; nałożę na usta wędzidło, dopóki niegodziwy będzie naprzeciwko mnie."
"Ps39,2": "Zaniemówiłem w milczeniu, przestałem mówić o dobru, lecz mój ból był rujnujący."
"Ps39,3": "Zapłonęło we mnie serce; gdy rozmyślałem, zapłonął ogień, a wtedy przemówiłem swoim językiem tak:"
"Ps39,4": "JHWH, oznajmij mi mój kres i miarę moich dni, abym poznał, jak bardzo jestem przemijający."
"Ps39,5": "Oto darowałeś mi moje dni na szerokość dłoni, a okres mojego życia jest niczym przed Tobą; O tak, każdy człowiek, nawet wysoko postawiony, jest tylko parą. Sela."
"Ps39,6": "O tak, człowiek porusza się jak cień; doprawdy na próżno się martwi; gromadzi, a nie wie, kto to zabierze."
"Ps39,7": "A teraz czego mam oczekiwać, PANIE? W Tobie jest moja nadzieja."
"Ps39,8": "Uwolnij mnie od wszystkich moich występków, nie wystawiaj mnie na pośmiewisko głupca."
"Ps39,9": "Jestem niemy i nie otwieram moich ust, bo Ty to uczyniłeś."
"Ps39,10": "Oddal ode mnie Twój cios, bo ginę od wrogości Twojej ręki."
"Ps39,11": "Gdy karą dyscyplinujesz człowieka za nieprawość, to jak mól niszczysz to, czego pragnie; O tak, parą jest każdy człowiek. Sela."
"Ps39,12": "Wysłuchaj mojej modlitwy, JHWH, i nakłoń ucha na moje wołanie; nie bądź głuchy na moje łzy, bo jestem przybyszem dla Ciebie i przychodniem, jak wszyscy moi ojcowie."
"Ps39,13": "Odwróć wzrok ode mnie, abym się rozpromienił, zanim odejdę i już mnie nie będzie."
