"Ps39,1":
  text: "Powiedziałem: Będę strzegł moich dróg, abym nie zgrzeszył językiem; nałożę na usta wędzidło, dopóki niegodziwy będzie naprzeciwko mnie."
  tags: []
"Ps39,2":
  text: "Zaniemówiłem w milczeniu, przestałem mówić o dobru, lecz mój ból był rujnujący."
  tags: []
"Ps39,3":
  text: "Zapłonęło we mnie serce; gdy rozmyślałem, zapłonął ogień, a wtedy przemówiłem swoim językiem tak:"
  tags: []
"Ps39,4":
  text: "JHWH, oznajmij mi mój kres i miarę moich dni, abym poznał, jak bardzo jestem przemijający."
  tags: []
"Ps39,5":
  text: "Oto darowałeś mi moje dni na szerokość dłoni, a okres mojego życia jest niczym przed Tobą; O tak, każdy człowiek, nawet wysoko postawiony, jest tylko parą. Sela."
  tags: []
"Ps39,6":
  text: "O tak, człowiek porusza się jak cień; doprawdy na próżno się martwi; gromadzi, a nie wie, kto to zabierze."
  tags: []
"Ps39,7":
  text: "A teraz czego mam oczekiwać, PANIE? W Tobie jest moja nadzieja."
  tags: []
"Ps39,8":
  text: "Uwolnij mnie od wszystkich moich występków, nie wystawiaj mnie na pośmiewisko głupca."
  tags: []
"Ps39,9":
  text: "Jestem niemy i nie otwieram moich ust, bo Ty to uczyniłeś."
  tags: []
"Ps39,10":
  text: "Oddal ode mnie Twój cios, bo ginę od wrogości Twojej ręki."
  tags: []
"Ps39,11":
  text: "Gdy karą dyscyplinujesz człowieka za nieprawość, to jak mól niszczysz to, czego pragnie; O tak, parą jest każdy człowiek. Sela."
  tags: []
"Ps39,12":
  text: "Wysłuchaj mojej modlitwy, JHWH, i nakłoń ucha na moje wołanie; nie bądź głuchy na moje łzy, bo jestem przybyszem dla Ciebie i przychodniem, jak wszyscy moi ojcowie."
  tags: []
"Ps39,13":
  text: "Odwróć wzrok ode mnie, abym się rozpromienił, zanim odejdę i już mnie nie będzie."
  tags: []
