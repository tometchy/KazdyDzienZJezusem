"Ps58,1": "Czy rzeczywiście przez milczenie mówicie to, co sprawiedliwe? Czy słusznie sądzicie, synowie ludzcy?"
"Ps58,2": "Raczej już w sercu czynicie nieprawość, a wasze ręce wymierzają gwałt na ziemi."
"Ps58,3": "Niegodziwi budzą odrazę już od łona matki, od urodzenia błądzą, mówiąc kłamstwo."
"Ps58,4": "Ich jad podobny do jadu węża, są jak głucha żmija, ich ucho zostało zatkane."
"Ps58,5": "Aby nie słyszeć głosu rzucających uroki ani biegle zaklinających czarowników."
"Ps58,6": "Boże, połam zęby w ich ustach; JHWH, zniszcz kły lwiątek."
"Ps58,7": "Niech się rozpłyną jak wody, które przepływają, a kiedy napną łuk, strzały jego niech będą jakby obcięto im grot."
"Ps58,8": "Niech przeminą jak rozpływający się ślimak, niech nie zobaczą słońca, podobnie jak poroniony płód kobiety."
"Ps58,9": "Zanim wasze ciernie wypuszczą kolce, gdy jeszcze są zielone, zmiecie je wicher Jego wzburzenia."
"Ps58,10": "Będzie się radował sprawiedliwy, bo ujrzał pomstę; swoje stopy obmyje we krwi niegodziwego."
"Ps58,11": "A ludzie powiedzą: Doprawdy jest plon dla sprawiedliwego; doprawdy jest Bóg, który sądzi na ziemi."
