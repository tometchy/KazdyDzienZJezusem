"Ps58,1":
  text: "Czy rzeczywiście przez milczenie mówicie to, co sprawiedliwe? Czy słusznie sądzicie, synowie ludzcy?"
  tags: []
"Ps58,2":
  text: "Raczej już w sercu czynicie nieprawość, a wasze ręce wymierzają gwałt na ziemi."
  tags: []
"Ps58,3":
  text: "Niegodziwi budzą odrazę już od łona matki, od urodzenia błądzą, mówiąc kłamstwo."
  tags: []
"Ps58,4":
  text: "Ich jad podobny do jadu węża, są jak głucha żmija, ich ucho zostało zatkane."
  tags: []
"Ps58,5":
  text: "Aby nie słyszeć głosu rzucających uroki ani biegle zaklinających czarowników."
  tags: []
"Ps58,6":
  text: "Boże, połam zęby w ich ustach; JHWH, zniszcz kły lwiątek."
  tags: []
"Ps58,7":
  text: "Niech się rozpłyną jak wody, które przepływają, a kiedy napną łuk, strzały jego niech będą jakby obcięto im grot."
  tags: []
"Ps58,8":
  text: "Niech przeminą jak rozpływający się ślimak, niech nie zobaczą słońca, podobnie jak poroniony płód kobiety."
  tags: []
"Ps58,9":
  text: "Zanim wasze ciernie wypuszczą kolce, gdy jeszcze są zielone, zmiecie je wicher Jego wzburzenia."
  tags: []
"Ps58,10":
  text: "Będzie się radował sprawiedliwy, bo ujrzał pomstę; swoje stopy obmyje we krwi niegodziwego."
  tags: []
"Ps58,11":
  text: "A ludzie powiedzą: Doprawdy jest plon dla sprawiedliwego; doprawdy jest Bóg, który sądzi na ziemi."
  tags: []
