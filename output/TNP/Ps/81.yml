"Ps81,1":
  text: "Radośnie śpiewajcie Bogu, naszej mocy; radośnie wykrzykujcie Bogu Jakuba."
  tags: []
"Ps81,2":
  text: "Podnieście śpiew, przynieście tamburyn, słodko brzmiącą harfę i cytrę."
  tags: []
"Ps81,3":
  text: "Zadmijcie w róg w czas nowiu, w czasie pełni, w dniu naszego uroczystego święta."
  tags: []
"Ps81,4":
  text: "Taki bowiem jest dekret, o Izraelu, decyzja Boga Jakuba."
  tags: []
"Ps81,5":
  text: "Ustanowił to świadectwem w pokoleniu Józefa, gdy wyruszył przeciw ziemi Egiptu – słyszę język, którego nie znałem:"
  tags: []
"Ps81,6":
  text: "Usunąłem ciężar z jego barku, a jego ręce zostały uwolnione od dźwigania kosza."
  tags: []
"Ps81,7":
  text: "Wzywałeś mnie w ucisku i wybawiłem cię; odpowiedziałem ci w tajemniczości grzmotu, doświadczyłem cię u wód Meriba. Sela."
  tags: []
"Ps81,8":
  text: "Słuchaj mnie, mój ludu, bo składam przeciwko tobie świadectwo: O, Izraelu! Jeśli mnie posłuchasz,"
  tags: []
"Ps81,9":
  text: "Nie będzie u ciebie cudzego boga ani nie oddasz pokłonu obcemu bogu;"
  tags: []
"Ps81,10":
  text: "Ja, JHWH, jestem twoim Bogiem, który cię wyprowadził z ziemi Egiptu; otwórz szeroko usta, a ja je napełnię."
  tags: []
"Ps81,11":
  text: "Lecz mój lud nie usłuchał mojego głosu, a Izrael nie był mi uległy."
  tags: []
"Ps81,12":
  text: "Dlatego wydałem go zatwardziałości ich serca i postępowali według swoich zamysłów."
  tags: []
"Ps81,13":
  text: "O, gdyby mój lud mnie posłuchał, a Izrael chodził moimi drogami!"
  tags: []
"Ps81,14":
  text: "Szybko upokorzyłbym ich wrogów i zwróciłbym swoją rękę przeciwko ich nieprzyjaciołom."
  tags: []
"Ps81,15":
  text: "Nienawidzący JHWH, płaszczyliby się, a taki ich los trwałby wiecznie."
  tags: []
"Ps81,16":
  text: "I karmiłbym ich wyborną pszenicą, a nasyciłbym cię miodem ze skały."
  tags: []
