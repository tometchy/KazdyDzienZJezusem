"Ps81,1": "Radośnie śpiewajcie Bogu, naszej mocy; radośnie wykrzykujcie Bogu Jakuba."
"Ps81,2": "Podnieście śpiew, przynieście tamburyn, słodko brzmiącą harfę i cytrę."
"Ps81,3": "Zadmijcie w róg w czas nowiu, w czasie pełni, w dniu naszego uroczystego święta."
"Ps81,4": "Taki bowiem jest dekret, o Izraelu, decyzja Boga Jakuba."
"Ps81,5": "Ustanowił to świadectwem w pokoleniu Józefa, gdy wyruszył przeciw ziemi Egiptu – słyszę język, którego nie znałem:"
"Ps81,6": "Usunąłem ciężar z jego barku, a jego ręce zostały uwolnione od dźwigania kosza."
"Ps81,7": "Wzywałeś mnie w ucisku i wybawiłem cię; odpowiedziałem ci w tajemniczości grzmotu, doświadczyłem cię u wód Meriba. Sela."
"Ps81,8": "Słuchaj mnie, mój ludu, bo składam przeciwko tobie świadectwo: O, Izraelu! Jeśli mnie posłuchasz,"
"Ps81,9": "Nie będzie u ciebie cudzego boga ani nie oddasz pokłonu obcemu bogu;"
"Ps81,10": "Ja, JHWH, jestem twoim Bogiem, który cię wyprowadził z ziemi Egiptu; otwórz szeroko usta, a ja je napełnię."
"Ps81,11": "Lecz mój lud nie usłuchał mojego głosu, a Izrael nie był mi uległy."
"Ps81,12": "Dlatego wydałem go zatwardziałości ich serca i postępowali według swoich zamysłów."
"Ps81,13": "O, gdyby mój lud mnie posłuchał, a Izrael chodził moimi drogami!"
"Ps81,14": "Szybko upokorzyłbym ich wrogów i zwróciłbym swoją rękę przeciwko ich nieprzyjaciołom."
"Ps81,15": "Nienawidzący JHWH, płaszczyliby się, a taki ich los trwałby wiecznie."
"Ps81,16": "I karmiłbym ich wyborną pszenicą, a nasyciłbym cię miodem ze skały."
