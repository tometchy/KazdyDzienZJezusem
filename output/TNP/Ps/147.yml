"Ps147,1": "Chwalcie JH[WH], bo dobrze jest śpiewać naszemu Bogu; bo jest to miłe – piękna jest pieśń chwały."
"Ps147,2": "JHWH buduje Jerozolimę i gromadzi rozrzuconych Izraela."
"Ps147,3": "On uzdrawia skruszonych w sercu i opatruje ich rany."
"Ps147,4": "On wyznacza liczbę gwiazd, nadaje imię każdej z nich."
"Ps147,5": "Wielki jest nasz PAN i potężny mocą; Jego mądrość jest niezmierzona."
"Ps147,6": "JHWH podnosi pokornych, a niegodziwych poniża aż do ziemi."
"Ps147,7": "Odpowiedzcie JHWH w dziękczynieniu; grajcie naszemu Bogu na harfie;"
"Ps147,8": "Który okrywa niebiosa gęstymi chmurami i przygotowuje deszcz dla ziemi; który sprawia, że trawa rośnie na górach;"
"Ps147,9": "Który daje pokarm bydłu i dla młodych kruka, które wołają do Niego."
"Ps147,10": "Nie rozkoszuje się mocą konia ani nie ma upodobania w udach mężczyzny."
"Ps147,11": "JHWH ma upodobanie w tych, którzy się Go boją, którzy ufają Jego miłosierdziu."
"Ps147,12": "Wysławiaj JHWH, Jerozolimo; chwal swojego Boga, Syjonie."
"Ps147,13": "Gdyż umocnił zasuwy twoich bram i błogosławił synów twoich pośród ciebie."
"Ps147,14": "Zapewnia pokój w twoich granicach i syci cię najwyborniejszą pszenicą."
"Ps147,15": "On posyła swój rozkaz na ziemię; szybko mknie Jego Słowo."
"Ps147,16": "On daje śnieg jak wełnę, rozsypuje szron jak popiół."
"Ps147,17": "Rzuca swój grad jak okruchy; kto ostoi się przed Jego zimnem?"
"Ps147,18": "Posyła swoje Słowo i każe im topnieć; powoduje wianie swego wiatru i wody spływają."
"Ps147,19": "Oznajmia swoje słowo Jakubowi, swoje prawa i sądy Izraelowi."
"Ps147,20": "Nie uczynił tak żadnemu narodowi, nie poznali Jego sądów. Chwalcie JH[WH]."
