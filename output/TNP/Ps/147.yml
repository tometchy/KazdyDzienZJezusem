"Ps147,1":
  text: "Chwalcie JH[WH], bo dobrze jest śpiewać naszemu Bogu; bo jest to miłe – piękna jest pieśń chwały."
  tags: []
"Ps147,2":
  text: "JHWH buduje Jerozolimę i gromadzi rozrzuconych Izraela."
  tags: []
"Ps147,3":
  text: "On uzdrawia skruszonych w sercu i opatruje ich rany."
  tags: []
"Ps147,4":
  text: "On wyznacza liczbę gwiazd, nadaje imię każdej z nich."
  tags: []
"Ps147,5":
  text: "Wielki jest nasz PAN i potężny mocą; Jego mądrość jest niezmierzona."
  tags: []
"Ps147,6":
  text: "JHWH podnosi pokornych, a niegodziwych poniża aż do ziemi."
  tags: []
"Ps147,7":
  text: "Odpowiedzcie JHWH w dziękczynieniu; grajcie naszemu Bogu na harfie;"
  tags: []
"Ps147,8":
  text: "Który okrywa niebiosa gęstymi chmurami i przygotowuje deszcz dla ziemi; który sprawia, że trawa rośnie na górach;"
  tags: []
"Ps147,9":
  text: "Który daje pokarm bydłu i dla młodych kruka, które wołają do Niego."
  tags: []
"Ps147,10":
  text: "Nie rozkoszuje się mocą konia ani nie ma upodobania w udach mężczyzny."
  tags: []
"Ps147,11":
  text: "JHWH ma upodobanie w tych, którzy się Go boją, którzy ufają Jego miłosierdziu."
  tags: []
"Ps147,12":
  text: "Wysławiaj JHWH, Jerozolimo; chwal swojego Boga, Syjonie."
  tags: []
"Ps147,13":
  text: "Gdyż umocnił zasuwy twoich bram i błogosławił synów twoich pośród ciebie."
  tags: []
"Ps147,14":
  text: "Zapewnia pokój w twoich granicach i syci cię najwyborniejszą pszenicą."
  tags: []
"Ps147,15":
  text: "On posyła swój rozkaz na ziemię; szybko mknie Jego Słowo."
  tags: []
"Ps147,16":
  text: "On daje śnieg jak wełnę, rozsypuje szron jak popiół."
  tags: []
"Ps147,17":
  text: "Rzuca swój grad jak okruchy; kto ostoi się przed Jego zimnem?"
  tags: []
"Ps147,18":
  text: "Posyła swoje Słowo i każe im topnieć; powoduje wianie swego wiatru i wody spływają."
  tags: []
"Ps147,19":
  text: "Oznajmia swoje słowo Jakubowi, swoje prawa i sądy Izraelowi."
  tags: []
"Ps147,20":
  text: "Nie uczynił tak żadnemu narodowi, nie poznali Jego sądów. Chwalcie JH[WH]."
  tags: []
