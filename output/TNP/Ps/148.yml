"Ps148,1": "Chwalcie JH[WH]. Chwalcie JHWH z niebios, chwalcie Go na wysokościach!"
"Ps148,2": "Chwalcie Go, wszyscy Jego aniołowie; chwalcie Go, wszystkie Jego zastępy."
"Ps148,3": "Chwalcie Go, słońce i księżycu; chwalcie Go, wszystkie gwiazdy świecące."
"Ps148,4": "Chwalcie Go, niebiosa niebios i wody, które są nad niebiosami."
"Ps148,5": "Niech chwalą imię JHWH, On bowiem rozkazał i zostały stworzone."
"Ps148,6": "I ustanowił je na wieki wieków; dał prawo, które nie przeminie."
"Ps148,7": "Chwalcie JHWH z ziemi, morskie potwory i wszystkie głębiny."
"Ps148,8": "Ogniu i gradzie, śniegu i dymie, wietrze gwałtowny, wykonujący Jego Słowo;"
"Ps148,9": "Góry i wszystkie pagórki, drzewa, owoce ziemi i wszystkie cedry;"
"Ps148,10": "Zwierzęta i wszelkie bydło, płazy i ptactwo skrzydlate."
"Ps148,11": "Królowie ziemi i wszystkie narody; władcy i wszyscy sędziowie ziemi;"
"Ps148,12": "Młodzieńcy, a także panny, starcy z młodymi;"
"Ps148,13": "Niech chwalą imię JHWH, bo tylko Jego imię jest wzniosłe, a Jego chwała nad ziemią i niebiosami."
"Ps148,14": "I wywyższył róg swego ludu, chwałę wszystkich Jego świętych, synów Izraela, ludu Mu bliskiego. Chwalcie JH[WH]."
