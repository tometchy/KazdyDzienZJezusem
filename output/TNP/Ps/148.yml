"Ps148,1":
  text: "Chwalcie JH[WH]. Chwalcie JHWH z niebios, chwalcie Go na wysokościach!"
  tags: []
"Ps148,2":
  text: "Chwalcie Go, wszyscy Jego aniołowie; chwalcie Go, wszystkie Jego zastępy."
  tags: []
"Ps148,3":
  text: "Chwalcie Go, słońce i księżycu; chwalcie Go, wszystkie gwiazdy świecące."
  tags: []
"Ps148,4":
  text: "Chwalcie Go, niebiosa niebios i wody, które są nad niebiosami."
  tags: []
"Ps148,5":
  text: "Niech chwalą imię JHWH, On bowiem rozkazał i zostały stworzone."
  tags: []
"Ps148,6":
  text: "I ustanowił je na wieki wieków; dał prawo, które nie przeminie."
  tags: []
"Ps148,7":
  text: "Chwalcie JHWH z ziemi, morskie potwory i wszystkie głębiny."
  tags: []
"Ps148,8":
  text: "Ogniu i gradzie, śniegu i dymie, wietrze gwałtowny, wykonujący Jego Słowo;"
  tags: []
"Ps148,9":
  text: "Góry i wszystkie pagórki, drzewa, owoce ziemi i wszystkie cedry;"
  tags: []
"Ps148,10":
  text: "Zwierzęta i wszelkie bydło, płazy i ptactwo skrzydlate."
  tags: []
"Ps148,11":
  text: "Królowie ziemi i wszystkie narody; władcy i wszyscy sędziowie ziemi;"
  tags: []
"Ps148,12":
  text: "Młodzieńcy, a także panny, starcy z młodymi;"
  tags: []
"Ps148,13":
  text: "Niech chwalą imię JHWH, bo tylko Jego imię jest wzniosłe, a Jego chwała nad ziemią i niebiosami."
  tags: []
"Ps148,14":
  text: "I wywyższył róg swego ludu, chwałę wszystkich Jego świętych, synów Izraela, ludu Mu bliskiego. Chwalcie JH[WH]."
  tags: []
