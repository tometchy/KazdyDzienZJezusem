"Ps149,1": "Chwalcie JH[WH]. Śpiewajcie JHWH pieśń nową, pieśń Jego chwały w zgromadzeniu świętych."
"Ps149,2": "Niech Izrael cieszy się swoim Stwórcą; niech synowie Syjonu radują się swoim Królem."
"Ps149,3": "Niech chwalą Jego imię tańcem; niech grają Mu na tamburynie i na cytrze."
"Ps149,4": "JHWH bowiem ma upodobanie w swoim ludzie; ozdabia pokornych zbawieniem."
"Ps149,5": "Niech święci się radują w chwale, niech wiwatują na swoich posłaniach."
"Ps149,6": "Niech uwielbienie Boga będzie na ich ustach, a miecz obosieczny w ich rękach;"
"Ps149,7": "Aby dokonali pomsty wśród narodów i ukarali ludy;"
"Ps149,8": "Aby zakuli ich królów w kajdany, a ich znamienitych w żelazne okowy;"
"Ps149,9": "Aby wykonali pisany im sąd. Taka jest chwała wszystkich Jego świętych. Chwalcie JH[WH]."
