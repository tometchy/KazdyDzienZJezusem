"Ps149,1":
  text: "Chwalcie JH[WH]. Śpiewajcie JHWH pieśń nową, pieśń Jego chwały w zgromadzeniu świętych."
  tags: []
"Ps149,2":
  text: "Niech Izrael cieszy się swoim Stwórcą; niech synowie Syjonu radują się swoim Królem."
  tags: []
"Ps149,3":
  text: "Niech chwalą Jego imię tańcem; niech grają Mu na tamburynie i na cytrze."
  tags: []
"Ps149,4":
  text: "JHWH bowiem ma upodobanie w swoim ludzie; ozdabia pokornych zbawieniem."
  tags: []
"Ps149,5":
  text: "Niech święci się radują w chwale, niech wiwatują na swoich posłaniach."
  tags: []
"Ps149,6":
  text: "Niech uwielbienie Boga będzie na ich ustach, a miecz obosieczny w ich rękach;"
  tags: []
"Ps149,7":
  text: "Aby dokonali pomsty wśród narodów i ukarali ludy;"
  tags: []
"Ps149,8":
  text: "Aby zakuli ich królów w kajdany, a ich znamienitych w żelazne okowy;"
  tags: []
"Ps149,9":
  text: "Aby wykonali pisany im sąd. Taka jest chwała wszystkich Jego świętych. Chwalcie JH[WH]."
  tags: []
