"Ps62,1": "Tylko w Bogu ma uciszenie moja dusza, od Niego pochodzi moje zbawienie."
"Ps62,2": "Tylko On jest moją skałą i zbawieniem, moją twierdzą; nic mną mocno nie zachwieje."
"Ps62,3": "Jak długo będziecie napadać na człowieka i będziecie go zabijać? Wy wszyscy jesteście jak pochylona ściana i jak walący się mur."
"Ps62,4": "Tylko naradzają się, jak pozbawić go godności; mają upodobanie w kłamstwie, swoimi ustami błogosławią, ale we wnętrzu złorzeczą. Sela."
"Ps62,5": "Tylko w Bogu ucisz się moja duszo, od Niego pochodzi moja nadzieja."
"Ps62,6": "Tylko On jest moją skałą i zbawieniem, moją twierdzą; nie zachwieję się."
"Ps62,7": "W Bogu moje wybawienie i moja chwała; skała mojej mocy, moje schronienie jest w Bogu."
"Ps62,8": "Ludu, ufajcie Mu w każdym czasie, wylewajcie przed Jego obliczem wasze serca; Bóg jest naszym schronieniem. Sela."
"Ps62,9": "Tylko tchnieniem są synowie ludzcy, synowie człowieka – kłamstwem; położeni na szalach, wszyscy razem podnoszą się w górę bardziej niż tchnienie."
"Ps62,10": "Nie pokładajcie ufności w wyzysku ani daremnej nadziei w grabieży; a gdyby bogactwo kwitło, nie umacniajcie nim serca."
"Ps62,11": "Bóg raz przemówił, dwa razy to słyszałem, że moc należy do Boga;"
"Ps62,12": "I u Ciebie, PANIE, jest łaska, bo Ty odpłacisz każdemu zgodnie z jego czynem."
