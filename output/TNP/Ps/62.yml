"Ps62,1":
  text: "Tylko w Bogu ma uciszenie moja dusza, od Niego pochodzi moje zbawienie."
  tags: []
"Ps62,2":
  text: "Tylko On jest moją skałą i zbawieniem, moją twierdzą; nic mną mocno nie zachwieje."
  tags: []
"Ps62,3":
  text: "Jak długo będziecie napadać na człowieka i będziecie go zabijać? Wy wszyscy jesteście jak pochylona ściana i jak walący się mur."
  tags: []
"Ps62,4":
  text: "Tylko naradzają się, jak pozbawić go godności; mają upodobanie w kłamstwie, swoimi ustami błogosławią, ale we wnętrzu złorzeczą. Sela."
  tags: []
"Ps62,5":
  text: "Tylko w Bogu ucisz się moja duszo, od Niego pochodzi moja nadzieja."
  tags: []
"Ps62,6":
  text: "Tylko On jest moją skałą i zbawieniem, moją twierdzą; nie zachwieję się."
  tags: []
"Ps62,7":
  text: "W Bogu moje wybawienie i moja chwała; skała mojej mocy, moje schronienie jest w Bogu."
  tags: []
"Ps62,8":
  text: "Ludu, ufajcie Mu w każdym czasie, wylewajcie przed Jego obliczem wasze serca; Bóg jest naszym schronieniem. Sela."
  tags: []
"Ps62,9":
  text: "Tylko tchnieniem są synowie ludzcy, synowie człowieka – kłamstwem; położeni na szalach, wszyscy razem podnoszą się w górę bardziej niż tchnienie."
  tags: []
"Ps62,10":
  text: "Nie pokładajcie ufności w wyzysku ani daremnej nadziei w grabieży; a gdyby bogactwo kwitło, nie umacniajcie nim serca."
  tags: []
"Ps62,11":
  text: "Bóg raz przemówił, dwa razy to słyszałem, że moc należy do Boga;"
  tags: []
"Ps62,12":
  text: "I u Ciebie, PANIE, jest łaska, bo Ty odpłacisz każdemu zgodnie z jego czynem."
  tags: []
