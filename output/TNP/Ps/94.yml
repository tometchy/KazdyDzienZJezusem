"Ps94,1":
  text: "Boże pomsty, JHWH, Boże pomsty, zajaśniej!"
  tags: []
"Ps94,2":
  text: "Powstań, Ty, który sądzisz ziemię, daj odpłatę wyniosłym."
  tags: []
"Ps94,3":
  text: "Jak długo niegodziwi, JHWH, jak długo niegodziwi będą się radować?"
  tags: []
"Ps94,4":
  text: "Kipieć złością i mówić zuchwale; pysznią się wszyscy czyniący nieprawość!"
  tags: []
"Ps94,5":
  text: "Miażdżyć Twój lud, JHWH, i dręczyć Twoje dziedzictwo."
  tags: []
"Ps94,6":
  text: "Zabijać wdowy i przybysza, mordować sieroty."
  tags: []
"Ps94,7":
  text: "I mówić: JH[WH] tego nie widzi, nie zwraca na to uwagi Bóg Jakuba."
  tags: []
"Ps94,8":
  text: "Pojmijcie, nierozumni wśród ludu! Głupcy, kiedy staniecie się roztropni?"
  tags: []
"Ps94,9":
  text: "Czy Ten, który osadza ucho, nie usłyszy? Czy Ten, który formuje oko, nie zobaczy?"
  tags: []
"Ps94,10":
  text: "Czy Ten, który poucza narody, nie będzie karcił, On, który uczy człowieka wiedzy?"
  tags: []
"Ps94,11":
  text: "JHWH zna myśli ludzkie; są one jak tchnienie."
  tags: []
"Ps94,12":
  text: "Błogosławiony mąż, którego Ty karcisz, JH[WH], i nauczasz go Twojego Prawa;"
  tags: []
"Ps94,13":
  text: "Aby zapewnić mu spokój od złych dni, aż będzie wykopany grób dla niegodziwego."
  tags: []
"Ps94,14":
  text: "JHWH bowiem nie porzuci swojego ludu i nie opuści swojego dziedzictwa."
  tags: []
"Ps94,15":
  text: "Ponieważ sąd powróci do sprawiedliwości, a za nim wszyscy prawego serca."
  tags: []
"Ps94,16":
  text: "Kto stanie za mną przeciwko postępującym niegodziwie? Kto ujmie się za mną przeciwko czyniącym niegodziwość?"
  tags: []
"Ps94,17":
  text: "Gdyby JHWH nie był mi pomocą, jeszcze trochę, a moja dusza zamieszkałaby w milczeniu."
  tags: []
"Ps94,18":
  text: "Gdy powiedziałem: Zachwiała się moja stopa, Twoje miłosierdzie, JHWH, mnie wsparło."
  tags: []
"Ps94,19":
  text: "W mnogości niepokojących myśli w moim wnętrzu Twoje pocieszenia radują moją duszę."
  tags: []
"Ps94,20":
  text: "Czy złączy się z Tobą tron nieprawości, który planuje krzywdę pod pozorem prawa?"
  tags: []
"Ps94,21":
  text: "Nastają przeciwko duszy sprawiedliwego i krew niewinną potępiają."
  tags: []
"Ps94,22":
  text: "Lecz JHWH stał się moją twierdzą, mój Bóg – skałą mojej ucieczki."
  tags: []
"Ps94,23":
  text: "On zwróci im jako odpłatę ich niegodziwość i za ich zło ich wytraci; wytraci ich JHWH, nasz Bóg."
  tags: []
