"Ps94,1": "Boże pomsty, JHWH, Boże pomsty, zajaśniej!"
"Ps94,2": "Powstań, Ty, który sądzisz ziemię, daj odpłatę wyniosłym."
"Ps94,3": "Jak długo niegodziwi, JHWH, jak długo niegodziwi będą się radować?"
"Ps94,4": "Kipieć złością i mówić zuchwale; pysznią się wszyscy czyniący nieprawość!"
"Ps94,5": "Miażdżyć Twój lud, JHWH, i dręczyć Twoje dziedzictwo."
"Ps94,6": "Zabijać wdowy i przybysza, mordować sieroty."
"Ps94,7": "I mówić: JH[WH] tego nie widzi, nie zwraca na to uwagi Bóg Jakuba."
"Ps94,8": "Pojmijcie, nierozumni wśród ludu! Głupcy, kiedy staniecie się roztropni?"
"Ps94,9": "Czy Ten, który osadza ucho, nie usłyszy? Czy Ten, który formuje oko, nie zobaczy?"
"Ps94,10": "Czy Ten, który poucza narody, nie będzie karcił, On, który uczy człowieka wiedzy?"
"Ps94,11": "JHWH zna myśli ludzkie; są one jak tchnienie."
"Ps94,12": "Błogosławiony mąż, którego Ty karcisz, JH[WH], i nauczasz go Twojego Prawa;"
"Ps94,13": "Aby zapewnić mu spokój od złych dni, aż będzie wykopany grób dla niegodziwego."
"Ps94,14": "JHWH bowiem nie porzuci swojego ludu i nie opuści swojego dziedzictwa."
"Ps94,15": "Ponieważ sąd powróci do sprawiedliwości, a za nim wszyscy prawego serca."
"Ps94,16": "Kto stanie za mną przeciwko postępującym niegodziwie? Kto ujmie się za mną przeciwko czyniącym niegodziwość?"
"Ps94,17": "Gdyby JHWH nie był mi pomocą, jeszcze trochę, a moja dusza zamieszkałaby w milczeniu."
"Ps94,18": "Gdy powiedziałem: Zachwiała się moja stopa, Twoje miłosierdzie, JHWH, mnie wsparło."
"Ps94,19": "W mnogości niepokojących myśli w moim wnętrzu Twoje pocieszenia radują moją duszę."
"Ps94,20": "Czy złączy się z Tobą tron nieprawości, który planuje krzywdę pod pozorem prawa?"
"Ps94,21": "Nastają przeciwko duszy sprawiedliwego i krew niewinną potępiają."
"Ps94,22": "Lecz JHWH stał się moją twierdzą, mój Bóg – skałą mojej ucieczki."
"Ps94,23": "On zwróci im jako odpłatę ich niegodziwość i za ich zło ich wytraci; wytraci ich JHWH, nasz Bóg."
