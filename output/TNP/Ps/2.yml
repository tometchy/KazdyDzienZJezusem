"Ps2,1": "Dlaczego poganie się buntują, a narody knują próżne zamysły?"
"Ps2,2": "Królowie ziemi powstają, a władcy naradzają się wspólnie przeciwko JHWH i Jego Pomazańcowi, mówiąc:"
"Ps2,3": "Zerwijmy ich więzy i zrzućmy z siebie ich pęta."
"Ps2,4": "Lecz Ten, który mieszka w niebiosach, będzie się śmiał, PAN będzie z nich kpił."
"Ps2,5": "Wtedy przemówi do nich w swoim gniewie i swoją zapalczywością ich przerazi:"
"Ps2,6": "Ja ustanowiłem mojego króla na Syjonie, mojej świętej górze."
"Ps2,7": "Ogłoszę ten dekret: JHWH powiedział do mnie: Ty jesteś moim Synem, ja ciebie dziś zrodziłem."
"Ps2,8": "Proś mnie, a dam ci narody w dziedzictwo i krańce ziemi na własność."
"Ps2,9": "Złamiesz je laską żelazną, jak naczynie gliniane je pokruszysz."
"Ps2,10": "Teraz więc, królowie, zrozumcie, przyjmijcie napomnienia, sędziowie ziemi!"
"Ps2,11": "Służcie JHWH z bojaźnią i radujcie się z drżeniem."
"Ps2,12": "Pocałujcie Syna, by się nie rozgniewał i nie zniszczył drogi, gdyby Jego gniew choćby trochę zapłonął. Błogosławieni wszyscy, którzy Mu ufają."
