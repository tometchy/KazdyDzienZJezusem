"Ps2,1":
  text: "Dlaczego poganie się buntują, a narody knują próżne zamysły?"
  tags: []
"Ps2,2":
  text: "Królowie ziemi powstają, a władcy naradzają się wspólnie przeciwko JHWH i Jego Pomazańcowi, mówiąc:"
  tags: []
"Ps2,3":
  text: "Zerwijmy ich więzy i zrzućmy z siebie ich pęta."
  tags: []
"Ps2,4":
  text: "Lecz Ten, który mieszka w niebiosach, będzie się śmiał, PAN będzie z nich kpił."
  tags: []
"Ps2,5":
  text: "Wtedy przemówi do nich w swoim gniewie i swoją zapalczywością ich przerazi:"
  tags: []
"Ps2,6":
  text: "Ja ustanowiłem mojego króla na Syjonie, mojej świętej górze."
  tags: []
"Ps2,7":
  text: "Ogłoszę ten dekret: JHWH powiedział do mnie: Ty jesteś moim Synem, ja ciebie dziś zrodziłem."
  tags: []
"Ps2,8":
  text: "Proś mnie, a dam ci narody w dziedzictwo i krańce ziemi na własność."
  tags: []
"Ps2,9":
  text: "Złamiesz je laską żelazną, jak naczynie gliniane je pokruszysz."
  tags: []
"Ps2,10":
  text: "Teraz więc, królowie, zrozumcie, przyjmijcie napomnienia, sędziowie ziemi!"
  tags: []
"Ps2,11":
  text: "Służcie JHWH z bojaźnią i radujcie się z drżeniem."
  tags: []
"Ps2,12":
  text: "Pocałujcie Syna, by się nie rozgniewał i nie zniszczył drogi, gdyby Jego gniew choćby trochę zapłonął. Błogosławieni wszyscy, którzy Mu ufają."
  tags: []
