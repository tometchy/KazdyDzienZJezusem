"Ps40,1": "Dla przewodnika chóru. Dawidowy. Psalm. Cierpliwie oczekiwałem na JHWH i skłonił się ku mnie, i wysłuchał mojego wołania."
"Ps40,2": "I sprawił, że wyszedłem z dołu zagłady i z błota bagiennego; sprawił, że postawiłem moje stopy na skale i wzmocnił moje kroki."
"Ps40,3": "I włożył w moje usta nową pieśń, pieśń chwały dla naszego Boga. Wielu to zobaczy i ulęknie się, i zaufa JHWH."
"Ps40,4": "Błogosławiony człowiek, który pokłada w JHWH swoją nadzieję, a nie zwraca swoich oczu w kierunku dumnych ani na tych, którzy oplatają się kłamstwem."
"Ps40,5": "Wiele cudownych dzieł uczyniłeś, Ty JHWH, mój Boże, a Twoich zamysłów wobec nas nikt nie może wymienić w kolejności przed Tobą; gdybym chciał je opowiedzieć i ogłosić, są zbyt liczne, nie można ich policzyć."
"Ps40,6": "W ofierze krwawej i w darze z pokarmu nie miałeś upodobania, lecz przekłułeś mi uszy; nie pytałeś się o całopalenia i ofiary za grzech."
"Ps40,7": "Wtedy powiedziałem: Oto przybyłem, w zwoju dokumentu napisano o mnie."
"Ps40,8": "Z upodobaniem czynię to, w czym Ty znajdujesz przyjemność, mój Boże, a Twoje Prawo jest w głębi mojego wnętrza."
"Ps40,9": "Ogłosiłem jako dobrą nowinę Twoją sprawiedliwość w wielkim zgromadzeniu. Oto, nie będę zamykał moich ust; JHWH, Ty o tym wiesz."
"Ps40,10": "Twojej sprawiedliwości nie skrywałem w głębi serca, opowiadałem o Twojej wierności i Twoim zbawieniu; nie ukryłem Twojego miłosierdzia i Twojej prawdy w wielkim zgromadzeniu."
"Ps40,11": "Dlatego Ty, JHWH, nie odmawiaj mi swojej litości; Twoje miłosierdzie i prawda niech mnie zawsze strzegą."
"Ps40,12": "Ponieważ otoczyły mnie nieszczęścia, których nie można policzyć; dosięgły mnie moje nieprawości, tak że nie mogę ich dostrzec; stały się liczniejsze niż włosy na mojej głowie, a moje serce mnie zawodzi."
"Ps40,13": "Bądź łaskawy, JHWH, zechciej mnie ocalić; JHWH, pośpiesz mi na pomoc."
"Ps40,14": "Niech się zawstydzą i zmieszają wszyscy, którzy razem szukają mojej duszy by ją zniszczyć; niech odstąpią do tyłu i zostaną upokorzeni ci, którzy znajdują przyjemność w moim nieszczęściu."
"Ps40,15": "Niech będą ogarnięci grozą z powodu swojej hańby ci, którzy mówią: Ha, ha!"
"Ps40,16": "Niech się radują i niech będą zadowoleni w Tobie, ci wszyscy, którzy Ciebie szukają; niech ci, którzy miłują Twoje zbawienie, zawsze mówią: Niech JHWH będzie wywyższony,"
"Ps40,17": "Ja wprawdzie jestem ubogi i nędzny, lecz PAN myśli o mnie. Ty jesteś moją pomocą i tym, który mnie wyzwala, mój Boże, nie zwlekaj."
