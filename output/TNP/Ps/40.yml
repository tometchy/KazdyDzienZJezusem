"Ps40,1":
  text: "Dla przewodnika chóru. Dawidowy. Psalm. Cierpliwie oczekiwałem na JHWH i skłonił się ku mnie, i wysłuchał mojego wołania."
  tags: []
"Ps40,2":
  text: "I sprawił, że wyszedłem z dołu zagłady i z błota bagiennego; sprawił, że postawiłem moje stopy na skale i wzmocnił moje kroki."
  tags: []
"Ps40,3":
  text: "I włożył w moje usta nową pieśń, pieśń chwały dla naszego Boga. Wielu to zobaczy i ulęknie się, i zaufa JHWH."
  tags: []
"Ps40,4":
  text: "Błogosławiony człowiek, który pokłada w JHWH swoją nadzieję, a nie zwraca swoich oczu w kierunku dumnych ani na tych, którzy oplatają się kłamstwem."
  tags: []
"Ps40,5":
  text: "Wiele cudownych dzieł uczyniłeś, Ty JHWH, mój Boże, a Twoich zamysłów wobec nas nikt nie może wymienić w kolejności przed Tobą; gdybym chciał je opowiedzieć i ogłosić, są zbyt liczne, nie można ich policzyć."
  tags: []
"Ps40,6":
  text: "W ofierze krwawej i w darze z pokarmu nie miałeś upodobania, lecz przekłułeś mi uszy; nie pytałeś się o całopalenia i ofiary za grzech."
  tags: []
"Ps40,7":
  text: "Wtedy powiedziałem: Oto przybyłem, w zwoju dokumentu napisano o mnie."
  tags: []
"Ps40,8":
  text: "Z upodobaniem czynię to, w czym Ty znajdujesz przyjemność, mój Boże, a Twoje Prawo jest w głębi mojego wnętrza."
  tags: []
"Ps40,9":
  text: "Ogłosiłem jako dobrą nowinę Twoją sprawiedliwość w wielkim zgromadzeniu. Oto, nie będę zamykał moich ust; JHWH, Ty o tym wiesz."
  tags: []
"Ps40,10":
  text: "Twojej sprawiedliwości nie skrywałem w głębi serca, opowiadałem o Twojej wierności i Twoim zbawieniu; nie ukryłem Twojego miłosierdzia i Twojej prawdy w wielkim zgromadzeniu."
  tags: []
"Ps40,11":
  text: "Dlatego Ty, JHWH, nie odmawiaj mi swojej litości; Twoje miłosierdzie i prawda niech mnie zawsze strzegą."
  tags: []
"Ps40,12":
  text: "Ponieważ otoczyły mnie nieszczęścia, których nie można policzyć; dosięgły mnie moje nieprawości, tak że nie mogę ich dostrzec; stały się liczniejsze niż włosy na mojej głowie, a moje serce mnie zawodzi."
  tags: []
"Ps40,13":
  text: "Bądź łaskawy, JHWH, zechciej mnie ocalić; JHWH, pośpiesz mi na pomoc."
  tags: []
"Ps40,14":
  text: "Niech się zawstydzą i zmieszają wszyscy, którzy razem szukają mojej duszy by ją zniszczyć; niech odstąpią do tyłu i zostaną upokorzeni ci, którzy znajdują przyjemność w moim nieszczęściu."
  tags: []
"Ps40,15":
  text: "Niech będą ogarnięci grozą z powodu swojej hańby ci, którzy mówią: Ha, ha!"
  tags: []
"Ps40,16":
  text: "Niech się radują i niech będą zadowoleni w Tobie, ci wszyscy, którzy Ciebie szukają; niech ci, którzy miłują Twoje zbawienie, zawsze mówią: Niech JHWH będzie wywyższony,"
  tags: []
"Ps40,17":
  text: "Ja wprawdzie jestem ubogi i nędzny, lecz PAN myśli o mnie. Ty jesteś moją pomocą i tym, który mnie wyzwala, mój Boże, nie zwlekaj."
  tags: []
