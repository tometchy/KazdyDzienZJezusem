"Ps111,1": "Chwalcie JH[WH]. Pragnę z całego serca wysławiać JHWH w gronie prawych i w zgromadzeniu."
"Ps111,2": "Wielkie są dzieła JHWH, rozważane przez wszystkich, którzy mają w nich upodobanie."
"Ps111,3": "Majestatyczne i wspaniałe jest Jego dzieło, a Jego sprawiedliwość trwa na wieki."
"Ps111,4": "Pamiętnymi uczynił swoje cuda; miłosierny i litościwy jest JHWH."
"Ps111,5": "Dał pokarm tym, którzy się Go boją, pamięta zawsze o swoim przymierzu."
"Ps111,6": "Okazał swojemu ludowi potęgę swoich dzieł, dając im dziedzictwo narodów."
"Ps111,7": "Dzieła Jego rąk to prawda i sąd, godne zaufania są wszystkie Jego ustawy;"
"Ps111,8": "Zostały ustanowione na wieki wieków, uczynione w prawdzie i prawości."
"Ps111,9": "Zesłał swojemu ludowi odkupienie, ustanowił na wieki swoje przymierze; Jego imię jest święte i przejmujące lękiem."
"Ps111,10": "Początkiem mądrości jest bojaźń JHWH; dobre zrozumienie mają wszyscy, którzy je wykonują; Jego chwała trwa na wieki."
