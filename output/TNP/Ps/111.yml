"Ps111,1":
  text: "Chwalcie JH[WH]. Pragnę z całego serca wysławiać JHWH w gronie prawych i w zgromadzeniu."
  tags: []
"Ps111,2":
  text: "Wielkie są dzieła JHWH, rozważane przez wszystkich, którzy mają w nich upodobanie."
  tags: []
"Ps111,3":
  text: "Majestatyczne i wspaniałe jest Jego dzieło, a Jego sprawiedliwość trwa na wieki."
  tags: []
"Ps111,4":
  text: "Pamiętnymi uczynił swoje cuda; miłosierny i litościwy jest JHWH."
  tags: []
"Ps111,5":
  text: "Dał pokarm tym, którzy się Go boją, pamięta zawsze o swoim przymierzu."
  tags: []
"Ps111,6":
  text: "Okazał swojemu ludowi potęgę swoich dzieł, dając im dziedzictwo narodów."
  tags: []
"Ps111,7":
  text: "Dzieła Jego rąk to prawda i sąd, godne zaufania są wszystkie Jego ustawy;"
  tags: []
"Ps111,8":
  text: "Zostały ustanowione na wieki wieków, uczynione w prawdzie i prawości."
  tags: []
"Ps111,9":
  text: "Zesłał swojemu ludowi odkupienie, ustanowił na wieki swoje przymierze; Jego imię jest święte i przejmujące lękiem."
  tags: []
"Ps111,10":
  text: "Początkiem mądrości jest bojaźń JHWH; dobre zrozumienie mają wszyscy, którzy je wykonują; Jego chwała trwa na wieki."
  tags: []
