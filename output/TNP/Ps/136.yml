"Ps136,1":
  text: "Wysławiajcie JHWH, bo jest dobry, bo na wieki trwa Jego miłosierdzie."
  tags: []
"Ps136,2":
  text: "Wysławiajcie Boga bogów, bo na wieki trwa Jego miłosierdzie."
  tags: []
"Ps136,3":
  text: "Wysławiajcie PANA panów, bo na wieki trwa Jego miłosierdzie;"
  tags: []
"Ps136,4":
  text: "Tego, który sam czyni wielkie cuda, bo na wieki trwa Jego miłosierdzie,"
  tags: []
"Ps136,5":
  text: "Tego, który w mądrości dogląda niebios, bo na wieki trwa Jego miłosierdzie;"
  tags: []
"Ps136,6":
  text: "Tego, który rozpostarł ziemię na wodach, bo na wieki trwa Jego miłosierdzie;"
  tags: []
"Ps136,7":
  text: "Tego, który uczynił wielkie światła, bo na wieki trwa Jego miłosierdzie;"
  tags: []
"Ps136,8":
  text: "Słońce, aby panowało za dnia, bo na wieki trwa Jego miłosierdzie;"
  tags: []
"Ps136,9":
  text: "Księżyc i gwiazdy, aby panowały w nocy, bo na wieki trwa Jego miłosierdzie."
  tags: []
"Ps136,10":
  text: "Tego, który uderzył Egipt śmiercią jego pierworodnych, bo na wieki trwa Jego miłosierdzie."
  tags: []
"Ps136,11":
  text: "Tego, który wyprowadził spośród niego Izraela, bo na wieki trwa Jego miłosierdzie;"
  tags: []
"Ps136,12":
  text: "Mocną ręką i wyciągniętym ramieniem, bo na wieki trwa Jego miłosierdzie."
  tags: []
"Ps136,13":
  text: "Tego, który rozdzielił Morze Czerwone na części, bo na wieki trwa Jego miłosierdzie;"
  tags: []
"Ps136,14":
  text: "I przeprowadził Izraela jego środkiem, bo na wieki trwa Jego miłosierdzie."
  tags: []
"Ps136,15":
  text: "I strząsnął faraona z jego wojskiem w Morze Czerwone, bo na wieki trwa Jego miłosierdzie."
  tags: []
"Ps136,16":
  text: "Tego, który prowadził swój lud przez pustynię, bo na wieki trwa Jego miłosierdzie."
  tags: []
"Ps136,17":
  text: "Tego, który pobił wielkich królów, bo na wieki trwa Jego miłosierdzie;"
  tags: []
"Ps136,18":
  text: "I zgładził potężnych królów, bo na wieki trwa Jego miłosierdzie;"
  tags: []
"Ps136,19":
  text: "Sychona, króla Amorytów, bo na wieki trwa Jego miłosierdzie;"
  tags: []
"Ps136,20":
  text: "I Oga, króla Baszanu, bo na wieki trwa Jego miłosierdzie."
  tags: []
"Ps136,21":
  text: "I dał ich ziemię w dziedzictwo, bo na wieki trwa Jego miłosierdzie;"
  tags: []
"Ps136,22":
  text: "W dziedzictwo Izraelowi, swojemu słudze, bo na wieki trwa Jego miłosierdzie."
  tags: []
"Ps136,23":
  text: "Tego, który w naszym poniżeniu pamiętał o nas, bo na wieki trwa Jego miłosierdzie."
  tags: []
"Ps136,24":
  text: "I wybawił nas od naszych nieprzyjaciół, bo na wieki trwa Jego miłosierdzie."
  tags: []
"Ps136,25":
  text: "Tego, który daje pokarm wszelkiemu ciału, bo na wieki trwa Jego miłosierdzie."
  tags: []
"Ps136,26":
  text: "Wysławiajcie Boga niebios, bo na wieki trwa Jego miłosierdzie."
  tags: []
