"Ps136,1": "Wysławiajcie JHWH, bo jest dobry, bo na wieki trwa Jego miłosierdzie."
"Ps136,2": "Wysławiajcie Boga bogów, bo na wieki trwa Jego miłosierdzie."
"Ps136,3": "Wysławiajcie PANA panów, bo na wieki trwa Jego miłosierdzie;"
"Ps136,4": "Tego, który sam czyni wielkie cuda, bo na wieki trwa Jego miłosierdzie,"
"Ps136,5": "Tego, który w mądrości dogląda niebios, bo na wieki trwa Jego miłosierdzie;"
"Ps136,6": "Tego, który rozpostarł ziemię na wodach, bo na wieki trwa Jego miłosierdzie;"
"Ps136,7": "Tego, który uczynił wielkie światła, bo na wieki trwa Jego miłosierdzie;"
"Ps136,8": "Słońce, aby panowało za dnia, bo na wieki trwa Jego miłosierdzie;"
"Ps136,9": "Księżyc i gwiazdy, aby panowały w nocy, bo na wieki trwa Jego miłosierdzie."
"Ps136,10": "Tego, który uderzył Egipt śmiercią jego pierworodnych, bo na wieki trwa Jego miłosierdzie."
"Ps136,11": "Tego, który wyprowadził spośród niego Izraela, bo na wieki trwa Jego miłosierdzie;"
"Ps136,12": "Mocną ręką i wyciągniętym ramieniem, bo na wieki trwa Jego miłosierdzie."
"Ps136,13": "Tego, który rozdzielił Morze Czerwone na części, bo na wieki trwa Jego miłosierdzie;"
"Ps136,14": "I przeprowadził Izraela jego środkiem, bo na wieki trwa Jego miłosierdzie."
"Ps136,15": "I strząsnął faraona z jego wojskiem w Morze Czerwone, bo na wieki trwa Jego miłosierdzie."
"Ps136,16": "Tego, który prowadził swój lud przez pustynię, bo na wieki trwa Jego miłosierdzie."
"Ps136,17": "Tego, który pobił wielkich królów, bo na wieki trwa Jego miłosierdzie;"
"Ps136,18": "I zgładził potężnych królów, bo na wieki trwa Jego miłosierdzie;"
"Ps136,19": "Sychona, króla Amorytów, bo na wieki trwa Jego miłosierdzie;"
"Ps136,20": "I Oga, króla Baszanu, bo na wieki trwa Jego miłosierdzie."
"Ps136,21": "I dał ich ziemię w dziedzictwo, bo na wieki trwa Jego miłosierdzie;"
"Ps136,22": "W dziedzictwo Izraelowi, swojemu słudze, bo na wieki trwa Jego miłosierdzie."
"Ps136,23": "Tego, który w naszym poniżeniu pamiętał o nas, bo na wieki trwa Jego miłosierdzie."
"Ps136,24": "I wybawił nas od naszych nieprzyjaciół, bo na wieki trwa Jego miłosierdzie."
"Ps136,25": "Tego, który daje pokarm wszelkiemu ciału, bo na wieki trwa Jego miłosierdzie."
"Ps136,26": "Wysławiajcie Boga niebios, bo na wieki trwa Jego miłosierdzie."
