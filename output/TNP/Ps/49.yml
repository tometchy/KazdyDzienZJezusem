"Ps49,1":
  text: "Słuchajcie tego wszystkie narody, nakłońcie uszy wszyscy mieszkańcy świata."
  tags: []
"Ps49,2":
  text: "Zarówno wy, synowie ludzcy, jak i wy, synowie człowieka; razem bogaty, jak i ubogi."
  tags: []
"Ps49,3":
  text: "Moje usta wypowiedzą mądrość, a rozmyślaniem mojego serca będzie roztropność."
  tags: []
"Ps49,4":
  text: "Skłonię ucho do przypowieści, przy harfie rozwiążę moją zagadkę."
  tags: []
"Ps49,5":
  text: "Dlaczego mam się bać w dniach złych, gdy otacza mnie nieprawość moich zdrajców,"
  tags: []
"Ps49,6":
  text: "Ufających swojej sile i chlubiących się swoim wielkim bogactwem?"
  tags: []
"Ps49,7":
  text: "Człowiek nie może odkupić swojego brata ani nie da Bogu za niego okupu;"
  tags: []
"Ps49,8":
  text: "Kosztowny bowiem jest okup za ich dusze i nigdy się nie zdarzy;"
  tags: []
"Ps49,9":
  text: "Aby taki żył nadal, na zawsze i nie zobaczył zniszczenia."
  tags: []
"Ps49,10":
  text: "Ponieważ widzi, że mądrzy umrą, tak samo zginie głupiec i prostak, i zostawią innym swoje bogactwa."
  tags: []
"Ps49,11":
  text: "We wnętrzu myślą, że ich domy są na wieki, a ich mieszkania z pokolenia na pokolenie; od własnych imion nazywają ziemię."
  tags: []
"Ps49,12":
  text: "Lecz człowiek, choć otoczony przepychem, nie pozostanie; podobny jest do bydląt, które giną."
  tags: []
"Ps49,13":
  text: "To jest ich droga – głupota, i tych, co po nich pochwalają ich mowę. Sela."
  tags: []
"Ps49,14":
  text: "Jak owce będą złożeni w Szeolu, śmierć będzie ich paść; prawi będą nad nimi panować o poranku, ich postać zostanie zniszczona, Szeol jest miejscem jego zamieszkania."
  tags: []
"Ps49,15":
  text: "Ale Bóg wykupi moją duszę z mocy Szeolu, bo mnie przyjmie do siebie. Sela."
  tags: []
"Ps49,16":
  text: "Nie bój się, gdy się ktoś wzbogaci, gdy się rozmnoży chwała jego domu;"
  tags: []
"Ps49,17":
  text: "Bo w godzinie swojej śmierci niczego ze sobą nie weźmie i nie zejdzie za nim jego chwała."
  tags: []
"Ps49,18":
  text: "Choćby za życia błogosławił swojej duszy i chwalono by go, gdyż uczyniłby dla siebie dobrze;"
  tags: []
"Ps49,19":
  text: "Dołączy jednak do pokolenia swoich ojców; na zawsze nie ujrzą światła."
  tags: []
"Ps49,20":
  text: "Człowiek otoczony przepychem nie zrozumie tego, podobny jest do bydląt, które giną."
  tags: []
