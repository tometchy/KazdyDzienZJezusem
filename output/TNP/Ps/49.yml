"Ps49,1": "Słuchajcie tego wszystkie narody, nakłońcie uszy wszyscy mieszkańcy świata."
"Ps49,2": "Zarówno wy, synowie ludzcy, jak i wy, synowie człowieka; razem bogaty, jak i ubogi."
"Ps49,3": "Moje usta wypowiedzą mądrość, a rozmyślaniem mojego serca będzie roztropność."
"Ps49,4": "Skłonię ucho do przypowieści, przy harfie rozwiążę moją zagadkę."
"Ps49,5": "Dlaczego mam się bać w dniach złych, gdy otacza mnie nieprawość moich zdrajców,"
"Ps49,6": "Ufających swojej sile i chlubiących się swoim wielkim bogactwem?"
"Ps49,7": "Człowiek nie może odkupić swojego brata ani nie da Bogu za niego okupu;"
"Ps49,8": "Kosztowny bowiem jest okup za ich dusze i nigdy się nie zdarzy;"
"Ps49,9": "Aby taki żył nadal, na zawsze i nie zobaczył zniszczenia."
"Ps49,10": "Ponieważ widzi, że mądrzy umrą, tak samo zginie głupiec i prostak, i zostawią innym swoje bogactwa."
"Ps49,11": "We wnętrzu myślą, że ich domy są na wieki, a ich mieszkania z pokolenia na pokolenie; od własnych imion nazywają ziemię."
"Ps49,12": "Lecz człowiek, choć otoczony przepychem, nie pozostanie; podobny jest do bydląt, które giną."
"Ps49,13": "To jest ich droga – głupota, i tych, co po nich pochwalają ich mowę. Sela."
"Ps49,14": "Jak owce będą złożeni w Szeolu, śmierć będzie ich paść; prawi będą nad nimi panować o poranku, ich postać zostanie zniszczona, Szeol jest miejscem jego zamieszkania."
"Ps49,15": "Ale Bóg wykupi moją duszę z mocy Szeolu, bo mnie przyjmie do siebie. Sela."
"Ps49,16": "Nie bój się, gdy się ktoś wzbogaci, gdy się rozmnoży chwała jego domu;"
"Ps49,17": "Bo w godzinie swojej śmierci niczego ze sobą nie weźmie i nie zejdzie za nim jego chwała."
"Ps49,18": "Choćby za życia błogosławił swojej duszy i chwalono by go, gdyż uczyniłby dla siebie dobrze;"
"Ps49,19": "Dołączy jednak do pokolenia swoich ojców; na zawsze nie ujrzą światła."
"Ps49,20": "Człowiek otoczony przepychem nie zrozumie tego, podobny jest do bydląt, które giną."
