"Ps30,1": "JHWH, będę Cię wywyższać, bo wyciągnąłeś mnie i nie pozwoliłeś moim wrogom radować się z mojego powodu."
"Ps30,2": "JHWH, Boże mój, wołałem do Ciebie i uzdrowiłeś mnie."
"Ps30,3": "JHWH, wyprowadziłeś moją duszę z Szeolu, zachowałeś mnie przy życiu, abym nie zstąpił do dołu."
"Ps30,4": "Śpiewajcie JHWH, święci Jego i wysławiajcie Go, pamiętając o Jego świętości."
"Ps30,5": "Jego gniew trwa bowiem tylko chwilę, a Jego łaskawość przez całe życie; wieczorem zagości płacz, a rankiem okrzyk radości."
"Ps30,6": "A ja powiedziałem w czasie mej pomyślności: Nigdy się nie zachwieję."
"Ps30,7": "JHWH, w swojej łaskawości umocniłeś moją górę; ale gdy ukryłeś swoje oblicze, byłem przerażony."
"Ps30,8": "Wołałem do Ciebie, JHWH, prosiłem JHWH o miłosierdzie."
"Ps30,9": "Jaki zysk z mojej krwi, z mojego zstąpienia do grobu? Czy proch będzie Cię chwalił? Czy będzie oznajmiał Twoją wierność?"
"Ps30,10": "Usłysz, JHWH, i zmiłuj się nade mną; JHWH, bądź moim wsparciem."
"Ps30,11": "Mój płacz zmieniłeś w taniec, rozwiązałeś mój wór żałobny, a przepasałeś mnie radością;"
"Ps30,12": "Aby moje wnętrze śpiewało Ci i nie zamilkło; JHWH, mój Boże, będę Cię wysławiał na wieki."
