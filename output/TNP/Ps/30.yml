"Ps30,1":
  text: "JHWH, będę Cię wywyższać, bo wyciągnąłeś mnie i nie pozwoliłeś moim wrogom radować się z mojego powodu."
  tags: []
"Ps30,2":
  text: "JHWH, Boże mój, wołałem do Ciebie i uzdrowiłeś mnie."
  tags: []
"Ps30,3":
  text: "JHWH, wyprowadziłeś moją duszę z Szeolu, zachowałeś mnie przy życiu, abym nie zstąpił do dołu."
  tags: []
"Ps30,4":
  text: "Śpiewajcie JHWH, święci Jego i wysławiajcie Go, pamiętając o Jego świętości."
  tags: []
"Ps30,5":
  text: "Jego gniew trwa bowiem tylko chwilę, a Jego łaskawość przez całe życie; wieczorem zagości płacz, a rankiem okrzyk radości."
  tags: []
"Ps30,6":
  text: "A ja powiedziałem w czasie mej pomyślności: Nigdy się nie zachwieję."
  tags: []
"Ps30,7":
  text: "JHWH, w swojej łaskawości umocniłeś moją górę; ale gdy ukryłeś swoje oblicze, byłem przerażony."
  tags: []
"Ps30,8":
  text: "Wołałem do Ciebie, JHWH, prosiłem JHWH o miłosierdzie."
  tags: []
"Ps30,9":
  text: "Jaki zysk z mojej krwi, z mojego zstąpienia do grobu? Czy proch będzie Cię chwalił? Czy będzie oznajmiał Twoją wierność?"
  tags: []
"Ps30,10":
  text: "Usłysz, JHWH, i zmiłuj się nade mną; JHWH, bądź moim wsparciem."
  tags: []
"Ps30,11":
  text: "Mój płacz zmieniłeś w taniec, rozwiązałeś mój wór żałobny, a przepasałeś mnie radością;"
  tags: []
"Ps30,12":
  text: "Aby moje wnętrze śpiewało Ci i nie zamilkło; JHWH, mój Boże, będę Cię wysławiał na wieki."
  tags: []
