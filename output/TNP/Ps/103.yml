"Ps103,1":
  text: "Psalm Dawida. Błogosław, duszo moja, JHWH, i całe moje wnętrze – Jego święte imię."
  tags: []
"Ps103,2":
  text: "Błogosław, moja duszo, JHWH, i nie zapominaj o wszystkich Jego dobrodziejstwach."
  tags: []
"Ps103,3":
  text: "On przebacza wszystkie twoje nieprawości, On uzdrawia wszystkie twoje choroby;"
  tags: []
"Ps103,4":
  text: "On wyzwala twoje życie od zguby, koronuje cię miłosierdziem i wielką litością."
  tags: []
"Ps103,5":
  text: "On nasyca dobrem twoje usta i odnawia twoją młodość jak u orła."
  tags: []
"Ps103,6":
  text: "JHWH czyni to, co sprawiedliwe i zapewnia sądy wszystkim, którzy zostali uciśnieni."
  tags: []
"Ps103,7":
  text: "Oznajmił swoje drogi Mojżeszowi, a synom Izraela swoje dzieła."
  tags: []
"Ps103,8":
  text: "Współczujący i litościwy jest JHWH, nieskory do gniewu i pełen wielkiego miłosierdzia."
  tags: []
"Ps103,9":
  text: "Nie będzie procesował się bez końca ani chował urazy na wieki."
  tags: []
"Ps103,10":
  text: "Nie czyni z nami stosownie do naszych grzechów ani nie odpłaca nam stosownie do naszych nieprawości."
  tags: []
"Ps103,11":
  text: "Jak wysoko bowiem są niebiosa nad ziemią, tak wielkie jest Jego miłosierdzie nad tymi, którzy się Go boją."
  tags: []
"Ps103,12":
  text: "Jak odległym jest wschód od zachodu, tak odsunął od nas nasze występki."
  tags: []
"Ps103,13":
  text: "Jak ojciec lituje się nad dziećmi, tak JHWH lituje się nad tymi, którzy się Go boją."
  tags: []
"Ps103,14":
  text: "Bo On wie, jakim jesteśmy tworem; pamięta, że jesteśmy prochem."
  tags: []
"Ps103,15":
  text: "Dni człowieka są jak trawa, kwitnie jak kwiat polny."
  tags: []
"Ps103,16":
  text: "Wiatr na niego powieje i nie ma go, i nie zauważy się więcej jego miejsca."
  tags: []
"Ps103,17":
  text: "Ale miłosierdzie JHWH od wieków na wieki nad tymi, którzy się Go boją, a Jego sprawiedliwość nad synami synów;"
  tags: []
"Ps103,18":
  text: "Dla tych, którzy strzegą Jego przymierza i pamiętają, aby wykonywać Jego ustawy."
  tags: []
"Ps103,19":
  text: "JHWH na niebiosach utwierdził swój tron, a Jego królestwo panuje nad wszystkimi."
  tags: []
"Ps103,20":
  text: "Błogosławcie JHWH, Jego aniołowie, potężni siłą, wykonujący Jego Słowo, aby słuchano głosu Jego Słowa."
  tags: []
"Ps103,21":
  text: "Błogosławcie JHWH, wszystkie Jego zastępy, służący Jemu i wykonujący Jego dobrą wolę."
  tags: []
"Ps103,22":
  text: "Błogosławcie JHWH, wszystkie Jego dzieła, we wszystkich miejscach Jego panowania. Błogosław, moja duszo, JHWH."
  tags: []
