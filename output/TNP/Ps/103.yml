"Ps103,1": "Psalm Dawida. Błogosław, duszo moja, JHWH, i całe moje wnętrze – Jego święte imię."
"Ps103,2": "Błogosław, moja duszo, JHWH, i nie zapominaj o wszystkich Jego dobrodziejstwach."
"Ps103,3": "On przebacza wszystkie twoje nieprawości, On uzdrawia wszystkie twoje choroby;"
"Ps103,4": "On wyzwala twoje życie od zguby, koronuje cię miłosierdziem i wielką litością."
"Ps103,5": "On nasyca dobrem twoje usta i odnawia twoją młodość jak u orła."
"Ps103,6": "JHWH czyni to, co sprawiedliwe i zapewnia sądy wszystkim, którzy zostali uciśnieni."
"Ps103,7": "Oznajmił swoje drogi Mojżeszowi, a synom Izraela swoje dzieła."
"Ps103,8": "Współczujący i litościwy jest JHWH, nieskory do gniewu i pełen wielkiego miłosierdzia."
"Ps103,9": "Nie będzie procesował się bez końca ani chował urazy na wieki."
"Ps103,10": "Nie czyni z nami stosownie do naszych grzechów ani nie odpłaca nam stosownie do naszych nieprawości."
"Ps103,11": "Jak wysoko bowiem są niebiosa nad ziemią, tak wielkie jest Jego miłosierdzie nad tymi, którzy się Go boją."
"Ps103,12": "Jak odległym jest wschód od zachodu, tak odsunął od nas nasze występki."
"Ps103,13": "Jak ojciec lituje się nad dziećmi, tak JHWH lituje się nad tymi, którzy się Go boją."
"Ps103,14": "Bo On wie, jakim jesteśmy tworem; pamięta, że jesteśmy prochem."
"Ps103,15": "Dni człowieka są jak trawa, kwitnie jak kwiat polny."
"Ps103,16": "Wiatr na niego powieje i nie ma go, i nie zauważy się więcej jego miejsca."
"Ps103,17": "Ale miłosierdzie JHWH od wieków na wieki nad tymi, którzy się Go boją, a Jego sprawiedliwość nad synami synów;"
"Ps103,18": "Dla tych, którzy strzegą Jego przymierza i pamiętają, aby wykonywać Jego ustawy."
"Ps103,19": "JHWH na niebiosach utwierdził swój tron, a Jego królestwo panuje nad wszystkimi."
"Ps103,20": "Błogosławcie JHWH, Jego aniołowie, potężni siłą, wykonujący Jego Słowo, aby słuchano głosu Jego Słowa."
"Ps103,21": "Błogosławcie JHWH, wszystkie Jego zastępy, służący Jemu i wykonujący Jego dobrą wolę."
"Ps103,22": "Błogosławcie JHWH, wszystkie Jego dzieła, we wszystkich miejscach Jego panowania. Błogosław, moja duszo, JHWH."
