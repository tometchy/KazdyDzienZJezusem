"Ps135,1":
  text: "Chwalcie JH[WH]. Chwalcie imię JHWH, chwalcie, słudzy JHWH,"
  tags: []
"Ps135,2":
  text: "Którzy stoicie w domu JHWH, w dziedzińcach domu naszego Boga."
  tags: []
"Ps135,3":
  text: "Chwalcie JH[WH], bo JHWH jest dobry; śpiewajcie Jego imieniu, bo jest miłe."
  tags: []
"Ps135,4":
  text: "JH[WH] bowiem wybrał sobie Jakuba. Uczynił Izraela swoją własnością."
  tags: []
"Ps135,5":
  text: "Bo, ja wiem, że JHWH jest wielki, a nasz PAN przewyższa wszystkich bogów."
  tags: []
"Ps135,6":
  text: "Wszystko, co JHWH zechce, to czyni w niebiosach i na ziemi, w morzu i we wszystkich głębinach."
  tags: []
"Ps135,7":
  text: "On sprawia, że mgły wznoszą się z krańców ziemi; czyni błyskawice dla deszczu, wypuszcza wiatr ze swoich skarbców;"
  tags: []
"Ps135,8":
  text: "Uderzył pierworodnych w Egipcie, od człowieka do zwierzęcia."
  tags: []
"Ps135,9":
  text: "Zesłał znaki i cuda pośród ciebie, Egipcie; na faraona i na wszystkie jego sługi."
  tags: []
"Ps135,10":
  text: "On uderzył wiele narodów i zgładził potężnych królów;"
  tags: []
"Ps135,11":
  text: "Sychona, króla Amorytów, i Oga, króla Baszanu, i pokonał wszystkie królestwa Kanaanu;"
  tags: []
"Ps135,12":
  text: "I ich ziemię dał w dziedzictwo, w dziedzictwo dla Izraela, swojego ludu."
  tags: []
"Ps135,13":
  text: "Twoje imię, JHWH, trwa na wieki; pamięć o Tobie, JHWH, z pokolenia na pokolenie."
  tags: []
"Ps135,14":
  text: "Ponieważ JHWH będzie sądzić swój lud i pocieszy swoje sługi."
  tags: []
"Ps135,15":
  text: "Bożki narodów to srebro i złoto, dzieło rąk człowieka."
  tags: []
"Ps135,16":
  text: "Mają usta, ale nie mówią; mają oczy, ale nie widzą;"
  tags: []
"Ps135,17":
  text: "Mają uszy, ale nie słyszą, nie ma też tchnienia w ich ustach."
  tags: []
"Ps135,18":
  text: "Tak jak one, będą ci, którzy je czynią, i wszyscy, pokładający w nich ufność."
  tags: []
"Ps135,19":
  text: "Domu Izraela, błogosławcie JHWH; domu Aarona, błogosławcie JHWH."
  tags: []
"Ps135,20":
  text: "Domu Lewiego, błogosławcie JHWH; wy, którzy się boicie JHWH, błogosławcie JHWH."
  tags: []
"Ps135,21":
  text: "Niech będzie błogosławiony z Syjonu JHWH, który mieszka w Jerozolimie. Chwalcie JH[WH]."
  tags: []
