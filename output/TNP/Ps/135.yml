"Ps135,1": "Chwalcie JH[WH]. Chwalcie imię JHWH, chwalcie, słudzy JHWH,"
"Ps135,2": "Którzy stoicie w domu JHWH, w dziedzińcach domu naszego Boga."
"Ps135,3": "Chwalcie JH[WH], bo JHWH jest dobry; śpiewajcie Jego imieniu, bo jest miłe."
"Ps135,4": "JH[WH] bowiem wybrał sobie Jakuba. Uczynił Izraela swoją własnością."
"Ps135,5": "Bo, ja wiem, że JHWH jest wielki, a nasz PAN przewyższa wszystkich bogów."
"Ps135,6": "Wszystko, co JHWH zechce, to czyni w niebiosach i na ziemi, w morzu i we wszystkich głębinach."
"Ps135,7": "On sprawia, że mgły wznoszą się z krańców ziemi; czyni błyskawice dla deszczu, wypuszcza wiatr ze swoich skarbców;"
"Ps135,8": "Uderzył pierworodnych w Egipcie, od człowieka do zwierzęcia."
"Ps135,9": "Zesłał znaki i cuda pośród ciebie, Egipcie; na faraona i na wszystkie jego sługi."
"Ps135,10": "On uderzył wiele narodów i zgładził potężnych królów;"
"Ps135,11": "Sychona, króla Amorytów, i Oga, króla Baszanu, i pokonał wszystkie królestwa Kanaanu;"
"Ps135,12": "I ich ziemię dał w dziedzictwo, w dziedzictwo dla Izraela, swojego ludu."
"Ps135,13": "Twoje imię, JHWH, trwa na wieki; pamięć o Tobie, JHWH, z pokolenia na pokolenie."
"Ps135,14": "Ponieważ JHWH będzie sądzić swój lud i pocieszy swoje sługi."
"Ps135,15": "Bożki narodów to srebro i złoto, dzieło rąk człowieka."
"Ps135,16": "Mają usta, ale nie mówią; mają oczy, ale nie widzą;"
"Ps135,17": "Mają uszy, ale nie słyszą, nie ma też tchnienia w ich ustach."
"Ps135,18": "Tak jak one, będą ci, którzy je czynią, i wszyscy, pokładający w nich ufność."
"Ps135,19": "Domu Izraela, błogosławcie JHWH; domu Aarona, błogosławcie JHWH."
"Ps135,20": "Domu Lewiego, błogosławcie JHWH; wy, którzy się boicie JHWH, błogosławcie JHWH."
"Ps135,21": "Niech będzie błogosławiony z Syjonu JHWH, który mieszka w Jerozolimie. Chwalcie JH[WH]."
