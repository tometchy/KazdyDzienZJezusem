"Ps59,1": "Wyrwij mnie od moich wrogów, mój Boże; odsuń mnie od tych, którzy powstają przeciwko mnie."
"Ps59,2": "Wyrwij mnie od czyniących nieprawość i wybaw mnie od ludzi żądnych krwi."
"Ps59,3": "Oto bowiem czyhają na moją duszę; zbierają się przeciwko mnie ludzie potężni, chociaż nie zawiniłem ani nie zgrzeszyłem, JHWH."
"Ps59,4": "Chociaż jestem bez winy, biegną i ustawiają się; powstań, by mnie spotkać i zobacz to."
"Ps59,5": "Ty, JHWH, Boże Zastępów, Boże Izraela, obudź się, aby ukarać wszystkie narody; nie lituj się nad żadnym z tych podstępnych przestępców. Sela."
"Ps59,6": "Wracają wieczorem, ujadają jak pies i okrążają miasto."
"Ps59,7": "Oto, co wypluwają ich usta, miecze na ich wargach. Mówią bowiem: Któż usłyszy?"
"Ps59,8": "A Ty, JHWH, będziesz się z nich śmiał, będziesz kpił ze wszystkich narodów."
"Ps59,9": "Moja Mocy, będę się trzymał Ciebie, bo Bóg jest moją twierdzą."
"Ps59,10": "Mój miłosierny Bóg wyjdzie mi naprzeciw, Bóg sprawi, że zobaczę klęskę moich wrogów."
"Ps59,11": "Nie zabijaj ich nagle, aby mój lud nie zapomniał, lecz wstrząśnij ich w swojej mocy i powal, o PANIE, nasza tarczo."
"Ps59,12": "Za grzech ich ust, za słowa, które wypowiadają wargami, niech będą schwytani w swojej pysze; za złorzeczenia i za kłamstwa, które rozgłaszają."
"Ps59,13": "Skończ z nimi w gniewie, skończ, by już ich nie było. Niech poznają, że Bóg panuje w Jakubie aż po krańce ziemi. Sela."
"Ps59,14": "Wracają wieczorem, ujadają jak pies i okrążają miasto."
"Ps59,15": "Miotają się, szukając pokarmu; warczą, gdy się nie nasycą."
"Ps59,16": "Ale ja będę śpiewał o Twojej mocy, rankiem będę wykrzykiwał z radości o Twoim miłosierdziu, bo Ty stałeś się dla mnie twierdzą i ucieczką w dniu mojego ucisku."
"Ps59,17": "Moja Mocy, Tobie będę śpiewał; bo Ty, Boże, jesteś moją twierdzą, Boże mój miłosierny."
