"Ps59,1":
  text: "Wyrwij mnie od moich wrogów, mój Boże; odsuń mnie od tych, którzy powstają przeciwko mnie."
  tags: []
"Ps59,2":
  text: "Wyrwij mnie od czyniących nieprawość i wybaw mnie od ludzi żądnych krwi."
  tags: []
"Ps59,3":
  text: "Oto bowiem czyhają na moją duszę; zbierają się przeciwko mnie ludzie potężni, chociaż nie zawiniłem ani nie zgrzeszyłem, JHWH."
  tags: []
"Ps59,4":
  text: "Chociaż jestem bez winy, biegną i ustawiają się; powstań, by mnie spotkać i zobacz to."
  tags: []
"Ps59,5":
  text: "Ty, JHWH, Boże Zastępów, Boże Izraela, obudź się, aby ukarać wszystkie narody; nie lituj się nad żadnym z tych podstępnych przestępców. Sela."
  tags: []
"Ps59,6":
  text: "Wracają wieczorem, ujadają jak pies i okrążają miasto."
  tags: []
"Ps59,7":
  text: "Oto, co wypluwają ich usta, miecze na ich wargach. Mówią bowiem: Któż usłyszy?"
  tags: []
"Ps59,8":
  text: "A Ty, JHWH, będziesz się z nich śmiał, będziesz kpił ze wszystkich narodów."
  tags: []
"Ps59,9":
  text: "Moja Mocy, będę się trzymał Ciebie, bo Bóg jest moją twierdzą."
  tags: []
"Ps59,10":
  text: "Mój miłosierny Bóg wyjdzie mi naprzeciw, Bóg sprawi, że zobaczę klęskę moich wrogów."
  tags: []
"Ps59,11":
  text: "Nie zabijaj ich nagle, aby mój lud nie zapomniał, lecz wstrząśnij ich w swojej mocy i powal, o PANIE, nasza tarczo."
  tags: []
"Ps59,12":
  text: "Za grzech ich ust, za słowa, które wypowiadają wargami, niech będą schwytani w swojej pysze; za złorzeczenia i za kłamstwa, które rozgłaszają."
  tags: []
"Ps59,13":
  text: "Skończ z nimi w gniewie, skończ, by już ich nie było. Niech poznają, że Bóg panuje w Jakubie aż po krańce ziemi. Sela."
  tags: []
"Ps59,14":
  text: "Wracają wieczorem, ujadają jak pies i okrążają miasto."
  tags: []
"Ps59,15":
  text: "Miotają się, szukając pokarmu; warczą, gdy się nie nasycą."
  tags: []
"Ps59,16":
  text: "Ale ja będę śpiewał o Twojej mocy, rankiem będę wykrzykiwał z radości o Twoim miłosierdziu, bo Ty stałeś się dla mnie twierdzą i ucieczką w dniu mojego ucisku."
  tags: []
"Ps59,17":
  text: "Moja Mocy, Tobie będę śpiewał; bo Ty, Boże, jesteś moją twierdzą, Boże mój miłosierny."
  tags: []
