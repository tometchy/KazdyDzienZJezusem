"Ps9,1": "Będę wysławiał, JHWH, całym moim sercem, będę wyliczał wszystkie Twoje cudowne dzieła."
"Ps9,2": "Będę się cieszył i radował Tobą, będę śpiewał Twojemu imieniu, o Najwyższy!"
"Ps9,3": "Gdy cofną się moi nieprzyjaciele, to potkną się i zginą przed Twoim obliczem."
"Ps9,4": "Ty bowiem przeprowadziłeś mój sąd i moją sprawę, zasiadłeś na tronie, by sądzić sprawiedliwie."
"Ps9,5": "Skarciłeś pogan, wytraciłeś niegodziwych, wymazałeś ich imię na wieki wieków."
"Ps9,6": "O, nieprzyjacielu! zniszczony zostałeś całkowicie, na zawsze – ruina, zburzone miasta, pamięć o nich zginie."
"Ps9,7": "Ale JHWH trwa na wieki, ustawił swój tron na sąd."
"Ps9,8": "On będzie sądził świat sprawiedliwie i wyda na narody wyrok prawy."
"Ps9,9": "I będzie JHWH ucieczką dla uciśnionego, i ucieczką w czasie utrapienia."
"Ps9,10": "I będą ufać Tobie ci, którzy znają Twoje imię, bo nie opuszczasz, JHWH, tych, którzy Cię szukają."
"Ps9,11": "Śpiewajcie JHWH, który mieszka na Syjonie, opowiadajcie wśród narodów o Jego dziełach."
"Ps9,12": "Bo On szuka krwi i pamięta o nich, i nie zapomina wołania strapionych."
"Ps9,13": "Zmiłuj się nade mną, JHWH, spójrz, jak mnie uciskają ci, którzy mnie nienawidzą, Ty, który podnosisz mnie z bram śmierci;"
"Ps9,14": "Bym głosił wszelką Twoją chwałę w bramach córki Syjonu, będę się radował Twoim zbawieniem."
"Ps9,15": "Poganie wpadli w dół, który wykopali; w sidłach, które skrycie zastawili, uwięzła ich noga."
"Ps9,16": "JHWH dał się poznać, gdy odbył sąd, w dzieła swoich rąk wpadł niegodziwy. Higgajon. Sela."
"Ps9,17": "Niegodziwi zawrócą do Szeolu, wszystkie narody, które zapominają Boga."
"Ps9,18": "Bo ubogi nie będzie zapomniany na zawsze, nadzieja nędzarzy nie zginie na wieki."
"Ps9,19": "Powstań, JHWH! Niech nie triumfuje człowiek, niech narody zostaną osądzone przed Twoim obliczem."
"Ps9,20": "JHWH, ześlij na nie przerażenie, aby narody poznały, że są tylko ludźmi. Sela."
