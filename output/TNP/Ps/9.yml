"Ps9,1":
  text: "Będę wysławiał, JHWH, całym moim sercem, będę wyliczał wszystkie Twoje cudowne dzieła."
  tags: []
"Ps9,2":
  text: "Będę się cieszył i radował Tobą, będę śpiewał Twojemu imieniu, o Najwyższy!"
  tags: []
"Ps9,3":
  text: "Gdy cofną się moi nieprzyjaciele, to potkną się i zginą przed Twoim obliczem."
  tags: []
"Ps9,4":
  text: "Ty bowiem przeprowadziłeś mój sąd i moją sprawę, zasiadłeś na tronie, by sądzić sprawiedliwie."
  tags: []
"Ps9,5":
  text: "Skarciłeś pogan, wytraciłeś niegodziwych, wymazałeś ich imię na wieki wieków."
  tags: []
"Ps9,6":
  text: "O, nieprzyjacielu! zniszczony zostałeś całkowicie, na zawsze – ruina, zburzone miasta, pamięć o nich zginie."
  tags: []
"Ps9,7":
  text: "Ale JHWH trwa na wieki, ustawił swój tron na sąd."
  tags: []
"Ps9,8":
  text: "On będzie sądził świat sprawiedliwie i wyda na narody wyrok prawy."
  tags: []
"Ps9,9":
  text: "I będzie JHWH ucieczką dla uciśnionego, i ucieczką w czasie utrapienia."
  tags: []
"Ps9,10":
  text: "I będą ufać Tobie ci, którzy znają Twoje imię, bo nie opuszczasz, JHWH, tych, którzy Cię szukają."
  tags: []
"Ps9,11":
  text: "Śpiewajcie JHWH, który mieszka na Syjonie, opowiadajcie wśród narodów o Jego dziełach."
  tags: []
"Ps9,12":
  text: "Bo On szuka krwi i pamięta o nich, i nie zapomina wołania strapionych."
  tags: []
"Ps9,13":
  text: "Zmiłuj się nade mną, JHWH, spójrz, jak mnie uciskają ci, którzy mnie nienawidzą, Ty, który podnosisz mnie z bram śmierci;"
  tags: []
"Ps9,14":
  text: "Bym głosił wszelką Twoją chwałę w bramach córki Syjonu, będę się radował Twoim zbawieniem."
  tags: []
"Ps9,15":
  text: "Poganie wpadli w dół, który wykopali; w sidłach, które skrycie zastawili, uwięzła ich noga."
  tags: []
"Ps9,16":
  text: "JHWH dał się poznać, gdy odbył sąd, w dzieła swoich rąk wpadł niegodziwy. Higgajon. Sela."
  tags: []
"Ps9,17":
  text: "Niegodziwi zawrócą do Szeolu, wszystkie narody, które zapominają Boga."
  tags: []
"Ps9,18":
  text: "Bo ubogi nie będzie zapomniany na zawsze, nadzieja nędzarzy nie zginie na wieki."
  tags: []
"Ps9,19":
  text: "Powstań, JHWH! Niech nie triumfuje człowiek, niech narody zostaną osądzone przed Twoim obliczem."
  tags: []
"Ps9,20":
  text: "JHWH, ześlij na nie przerażenie, aby narody poznały, że są tylko ludźmi. Sela."
  tags: []
