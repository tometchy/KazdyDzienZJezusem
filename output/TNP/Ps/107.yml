"Ps107,1": "Wysławiajcie JHWH, albowiem jest dobry, albowiem miłosierdzie Jego trwa na wieki!"
"Ps107,2": "Niech mówią to odkupieni przez JHWH, ci, których odkupił z ręki wroga;"
"Ps107,3": "I zgromadził z różnych ziem, ze wschodu i zachodu, z północy i południa."
"Ps107,4": "Błądzili po pustyni, na pustkowiu nie znaleźli drogi do zamieszkałego miasta."
"Ps107,5": "Byli głodni, a także spragnieni, aż omdlewała w nich dusza."
"Ps107,6": "A wtedy wołali do JHWH w swojej niedoli, i wyzwalał ich z ucisków;"
"Ps107,7": "I poprowadził ich właściwą drogą, aby przyszli do zamieszkałego miasta."
"Ps107,8": "Niech wysławiają JHWH za Jego miłosierdzie i cudowne dzieła dla synów ludzkich;"
"Ps107,9": "Bo zaspokoił spragnioną duszę, a głodną duszę napełnił dobrami!"
"Ps107,10": "Siedzących w ciemności i w cieniu śmierci, więźniów nędzy i żelaza."
"Ps107,11": "Bo buntowali się przeciwko nakazom Boga i pogardzili radą Najwyższego."
"Ps107,12": "I upokorzył ich serce trudem, potknęli się, a nie było nikogo, kto pomógł."
"Ps107,13": "A wtedy wołali do JHWH w swojej niedoli, a On wybawiał ich z ucisków;"
"Ps107,14": "Wyprowadził ich z ciemności i z cienia śmierci, a ich więzy rozerwał."
"Ps107,15": "Niech wysławiają JHWH za Jego miłosierdzie i za cudowne dzieła wobec synów ludzkich."
"Ps107,16": "Bo skruszył bramy mosiężne i rozłupał żelazne sztaby."
"Ps107,17": "Głupcy przez swoje występne drogi i przez swoje nieprawości są udręczeni."
"Ps107,18": "Wszelki pokarm obrzydł ich duszy i zbliżyli się do bram śmierci."
"Ps107,19": "A wtedy wołali do JHWH w swojej niedoli, i wybawiał ich z ucisków;"
"Ps107,20": "Posłał swoje słowo i uzdrowił ich, i wybawił ich z dołu."
"Ps107,21": "Niech wysławiają JHWH za Jego miłosierdzie i cudowne dzieła dla synów ludzkich;"
"Ps107,22": "I niech składają ofiary dziękczynienia, i głoszą z radością Jego dzieła."
"Ps107,23": "Ci, którzy zstąpili na morze w statkach, którzy prowadzili handel na wielkich wodach;"
"Ps107,24": "Oni widzieli dzieła JHWH i Jego cuda w głębinach."
"Ps107,25": "Gdy rozkazał, powstał huraganowy wiatr i podniósł on fale morskie."
"Ps107,26": "Wznosili się aż do niebios i zstępowali w głębiny, tak że ich dusza mdlała w nieszczęściu."
"Ps107,27": "Zataczali się i chwiali jak pijani, a cała ich mądrość skończyła się."
"Ps107,28": "A wtedy wołali do JHWH w swojej niedoli, i wyprowadzał ich z ucisków;"
"Ps107,29": "Doprowadził do uciszenia huraganu i zamilkły fale morskie."
"Ps107,30": "Ucieszyli się więc, że ucichły; i tak prowadził ich do upragnionej przystani."
"Ps107,31": "Niech wysławiają JHWH za Jego miłosierdzie i cudowne dzieła dla synów ludzkich;"
"Ps107,32": "Niech Go wywyższają w zgromadzeniu ludu i w zgromadzeniu starszych niech Go chwalą."
"Ps107,33": "Zamienił rzeki w pustynię, a źródła wód w spragnioną ziemię;"
"Ps107,34": "Ziemię urodzajną zamienia w jałową z powodu niegodziwości tych, którzy w niej mieszkają."
"Ps107,35": "Pustynię zamienia w stawy pełne wód, a suchą ziemię w źródła wód."
"Ps107,36": "I osiedlił tam głodnych, aby założyli miasto do zamieszkania;"
"Ps107,37": "I obsiali pola, zasadzili winnice i uzyskali obfity plon."
"Ps107,38": "Błogosławił im i stali się bardzo liczni, nie umniejszył też ich bydła."
"Ps107,39": "Zmniejszyli się i zostali upokorzeni z powodu ucisku, zła i utrapienia;"
"Ps107,40": "On wylewa wzgardę na władców i sprawia, że błądzą na pustkowiach bez drogi."
"Ps107,41": "Lecz podniósł ubogiego z utrapienia i uczynił ich rodziny jak stado owiec."
"Ps107,42": "Zobaczą to prawi i rozradują się, a wszelka nieprawość zamknie swoje usta."
"Ps107,43": "Kto jest mądry, będzie tego strzegł i ci rozważą starannie miłosierdzie JHWH."
