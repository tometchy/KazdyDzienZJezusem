"Ps107,1":
  text: "Wysławiajcie JHWH, albowiem jest dobry, albowiem miłosierdzie Jego trwa na wieki!"
  tags: []
"Ps107,2":
  text: "Niech mówią to odkupieni przez JHWH, ci, których odkupił z ręki wroga;"
  tags: []
"Ps107,3":
  text: "I zgromadził z różnych ziem, ze wschodu i zachodu, z północy i południa."
  tags: []
"Ps107,4":
  text: "Błądzili po pustyni, na pustkowiu nie znaleźli drogi do zamieszkałego miasta."
  tags: []
"Ps107,5":
  text: "Byli głodni, a także spragnieni, aż omdlewała w nich dusza."
  tags: []
"Ps107,6":
  text: "A wtedy wołali do JHWH w swojej niedoli, i wyzwalał ich z ucisków;"
  tags: []
"Ps107,7":
  text: "I poprowadził ich właściwą drogą, aby przyszli do zamieszkałego miasta."
  tags: []
"Ps107,8":
  text: "Niech wysławiają JHWH za Jego miłosierdzie i cudowne dzieła dla synów ludzkich;"
  tags: []
"Ps107,9":
  text: "Bo zaspokoił spragnioną duszę, a głodną duszę napełnił dobrami!"
  tags: []
"Ps107,10":
  text: "Siedzących w ciemności i w cieniu śmierci, więźniów nędzy i żelaza."
  tags: []
"Ps107,11":
  text: "Bo buntowali się przeciwko nakazom Boga i pogardzili radą Najwyższego."
  tags: []
"Ps107,12":
  text: "I upokorzył ich serce trudem, potknęli się, a nie było nikogo, kto pomógł."
  tags: []
"Ps107,13":
  text: "A wtedy wołali do JHWH w swojej niedoli, a On wybawiał ich z ucisków;"
  tags: []
"Ps107,14":
  text: "Wyprowadził ich z ciemności i z cienia śmierci, a ich więzy rozerwał."
  tags: []
"Ps107,15":
  text: "Niech wysławiają JHWH za Jego miłosierdzie i za cudowne dzieła wobec synów ludzkich."
  tags: []
"Ps107,16":
  text: "Bo skruszył bramy mosiężne i rozłupał żelazne sztaby."
  tags: []
"Ps107,17":
  text: "Głupcy przez swoje występne drogi i przez swoje nieprawości są udręczeni."
  tags: []
"Ps107,18":
  text: "Wszelki pokarm obrzydł ich duszy i zbliżyli się do bram śmierci."
  tags: []
"Ps107,19":
  text: "A wtedy wołali do JHWH w swojej niedoli, i wybawiał ich z ucisków;"
  tags: []
"Ps107,20":
  text: "Posłał swoje słowo i uzdrowił ich, i wybawił ich z dołu."
  tags: []
"Ps107,21":
  text: "Niech wysławiają JHWH za Jego miłosierdzie i cudowne dzieła dla synów ludzkich;"
  tags: []
"Ps107,22":
  text: "I niech składają ofiary dziękczynienia, i głoszą z radością Jego dzieła."
  tags: []
"Ps107,23":
  text: "Ci, którzy zstąpili na morze w statkach, którzy prowadzili handel na wielkich wodach;"
  tags: []
"Ps107,24":
  text: "Oni widzieli dzieła JHWH i Jego cuda w głębinach."
  tags: []
"Ps107,25":
  text: "Gdy rozkazał, powstał huraganowy wiatr i podniósł on fale morskie."
  tags: []
"Ps107,26":
  text: "Wznosili się aż do niebios i zstępowali w głębiny, tak że ich dusza mdlała w nieszczęściu."
  tags: []
"Ps107,27":
  text: "Zataczali się i chwiali jak pijani, a cała ich mądrość skończyła się."
  tags: []
"Ps107,28":
  text: "A wtedy wołali do JHWH w swojej niedoli, i wyprowadzał ich z ucisków;"
  tags: []
"Ps107,29":
  text: "Doprowadził do uciszenia huraganu i zamilkły fale morskie."
  tags: []
"Ps107,30":
  text: "Ucieszyli się więc, że ucichły; i tak prowadził ich do upragnionej przystani."
  tags: []
"Ps107,31":
  text: "Niech wysławiają JHWH za Jego miłosierdzie i cudowne dzieła dla synów ludzkich;"
  tags: []
"Ps107,32":
  text: "Niech Go wywyższają w zgromadzeniu ludu i w zgromadzeniu starszych niech Go chwalą."
  tags: []
"Ps107,33":
  text: "Zamienił rzeki w pustynię, a źródła wód w spragnioną ziemię;"
  tags: []
"Ps107,34":
  text: "Ziemię urodzajną zamienia w jałową z powodu niegodziwości tych, którzy w niej mieszkają."
  tags: []
"Ps107,35":
  text: "Pustynię zamienia w stawy pełne wód, a suchą ziemię w źródła wód."
  tags: []
"Ps107,36":
  text: "I osiedlił tam głodnych, aby założyli miasto do zamieszkania;"
  tags: []
"Ps107,37":
  text: "I obsiali pola, zasadzili winnice i uzyskali obfity plon."
  tags: []
"Ps107,38":
  text: "Błogosławił im i stali się bardzo liczni, nie umniejszył też ich bydła."
  tags: []
"Ps107,39":
  text: "Zmniejszyli się i zostali upokorzeni z powodu ucisku, zła i utrapienia;"
  tags: []
"Ps107,40":
  text: "On wylewa wzgardę na władców i sprawia, że błądzą na pustkowiach bez drogi."
  tags: []
"Ps107,41":
  text: "Lecz podniósł ubogiego z utrapienia i uczynił ich rodziny jak stado owiec."
  tags: []
"Ps107,42":
  text: "Zobaczą to prawi i rozradują się, a wszelka nieprawość zamknie swoje usta."
  tags: []
"Ps107,43":
  text: "Kto jest mądry, będzie tego strzegł i ci rozważą starannie miłosierdzie JHWH."
  tags: []
