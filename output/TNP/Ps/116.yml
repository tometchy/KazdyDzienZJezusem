"Ps116,1":
  text: "Miłuję JHWH, ponieważ wysłuchał mojego głosu i mojego błagania."
  tags: []
"Ps116,2":
  text: "Skłonił bowiem swoje ucho ku mnie, dlatego będę wzywał Go za moich dni."
  tags: []
"Ps116,3":
  text: "Otoczyły mnie powrozy śmierci, utrapienia Szeolu znalazły mnie; znalazły mnie ucisk i udręczenie."
  tags: []
"Ps116,4":
  text: "Wtedy wezwałem imienia JHWH, mówiąc: JHWH proszę! Wybaw moją duszę!"
  tags: []
"Ps116,5":
  text: "Łaskawy jest JHWH i sprawiedliwy, nasz Bóg jest miłosierny."
  tags: []
"Ps116,6":
  text: "JHWH strzeże ludzi prostodusznych; byłem utrapiony, a On mnie uratował."
  tags: []
"Ps116,7":
  text: "Powróć, moja duszo, do swego odpoczynku, bo JHWH zaopiekował się tobą."
  tags: []
"Ps116,8":
  text: "Ty bowiem uwolniłeś moją duszę od śmierci, oczy moje od łez, moją nogę od upadku."
  tags: []
"Ps116,9":
  text: "Będę chodził przed obliczem JHWH w ziemi żyjących."
  tags: []
"Ps116,10":
  text: "Uwierzyłem i dlatego przemówiłem; byłem bardzo przygnębiony."
  tags: []
"Ps116,11":
  text: "Powiedziałem w moim przerażeniu: Każdy człowiek to kłamca."
  tags: []
"Ps116,12":
  text: "Cóż oddam JHWH za wszystkie Jego dobrodziejstwa wobec mnie?"
  tags: []
"Ps116,13":
  text: "Podniosę kielich zbawienia i będę wzywać imienia JHWH."
  tags: []
"Ps116,14":
  text: "Wypełnię teraz moje śluby złożone JHWH przed całym Jego ludem."
  tags: []
"Ps116,15":
  text: "Cenna jest w oczach JHWH śmierć Jego świętych."
  tags: []
"Ps116,16":
  text: "Och JHWH, ja właśnie jestem Twoim sługą; jestem Twoim sługą i synem Twojej służebnicy; rozerwałeś moje więzy."
  tags: []
"Ps116,17":
  text: "Tobie złożę ofiarę dziękczynienia i będę wzywać imienia JHWH."
  tags: []
"Ps116,18":
  text: "Wypełnię teraz moje śluby złożone JHWH przed całym Jego ludem;"
  tags: []
"Ps116,19":
  text: "W dziedzińcach domu JHWH, pośrodku ciebie, Jerozolimo! Chwalcie JH[WH]."
  tags: []
