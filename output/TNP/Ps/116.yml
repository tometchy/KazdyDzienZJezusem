"Ps116,1": "Miłuję JHWH, ponieważ wysłuchał mojego głosu i mojego błagania."
"Ps116,2": "Skłonił bowiem swoje ucho ku mnie, dlatego będę wzywał Go za moich dni."
"Ps116,3": "Otoczyły mnie powrozy śmierci, utrapienia Szeolu znalazły mnie; znalazły mnie ucisk i udręczenie."
"Ps116,4": "Wtedy wezwałem imienia JHWH, mówiąc: JHWH proszę! Wybaw moją duszę!"
"Ps116,5": "Łaskawy jest JHWH i sprawiedliwy, nasz Bóg jest miłosierny."
"Ps116,6": "JHWH strzeże ludzi prostodusznych; byłem utrapiony, a On mnie uratował."
"Ps116,7": "Powróć, moja duszo, do swego odpoczynku, bo JHWH zaopiekował się tobą."
"Ps116,8": "Ty bowiem uwolniłeś moją duszę od śmierci, oczy moje od łez, moją nogę od upadku."
"Ps116,9": "Będę chodził przed obliczem JHWH w ziemi żyjących."
"Ps116,10": "Uwierzyłem i dlatego przemówiłem; byłem bardzo przygnębiony."
"Ps116,11": "Powiedziałem w moim przerażeniu: Każdy człowiek to kłamca."
"Ps116,12": "Cóż oddam JHWH za wszystkie Jego dobrodziejstwa wobec mnie?"
"Ps116,13": "Podniosę kielich zbawienia i będę wzywać imienia JHWH."
"Ps116,14": "Wypełnię teraz moje śluby złożone JHWH przed całym Jego ludem."
"Ps116,15": "Cenna jest w oczach JHWH śmierć Jego świętych."
"Ps116,16": "Och JHWH, ja właśnie jestem Twoim sługą; jestem Twoim sługą i synem Twojej służebnicy; rozerwałeś moje więzy."
"Ps116,17": "Tobie złożę ofiarę dziękczynienia i będę wzywać imienia JHWH."
"Ps116,18": "Wypełnię teraz moje śluby złożone JHWH przed całym Jego ludem;"
"Ps116,19": "W dziedzińcach domu JHWH, pośrodku ciebie, Jerozolimo! Chwalcie JH[WH]."
