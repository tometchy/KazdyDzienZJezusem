"Ps23,1": "Psalm Dawida. JHWH jest moim Pasterzem niczego mi nie zabraknie."
"Ps23,2": "Położył mnie na zielonych pastwiskach, prowadzi mnie nad spokojne wody."
"Ps23,3": "Odnawia moją duszę, prowadzi mnie ścieżkami sprawiedliwości ze względu na swoje imię."
"Ps23,4": "Nawet kiedy będę szedł doliną cienia śmierci, nie będę się bał złego, bo Ty jesteś ze mną; Twoja laska i Twój kij, te mnie pocieszają."
"Ps23,5": "Każesz przygotować przede mną stół wobec moich wrogów, namaszczasz mi głowę olejkiem, mój kielich się przelewa."
"Ps23,6": "Z pewnością dobroć i miłosierdzie pójdą w ślad za mną po wszystkie dni mojego życia i powrócę do domu JHWH na długie dni."
