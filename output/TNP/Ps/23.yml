"Ps23,1":
  text: "Psalm Dawida. JHWH jest moim Pasterzem niczego mi nie zabraknie."
  tags: []
"Ps23,2":
  text: "Położył mnie na zielonych pastwiskach, prowadzi mnie nad spokojne wody."
  tags: []
"Ps23,3":
  text: "Odnawia moją duszę, prowadzi mnie ścieżkami sprawiedliwości ze względu na swoje imię."
  tags: []
"Ps23,4":
  text: "Nawet kiedy będę szedł doliną cienia śmierci, nie będę się bał złego, bo Ty jesteś ze mną; Twoja laska i Twój kij, te mnie pocieszają."
  tags: []
"Ps23,5":
  text: "Każesz przygotować przede mną stół wobec moich wrogów, namaszczasz mi głowę olejkiem, mój kielich się przelewa."
  tags: []
"Ps23,6":
  text: "Z pewnością dobroć i miłosierdzie pójdą w ślad za mną po wszystkie dni mojego życia i powrócę do domu JHWH na długie dni."
  tags: []
