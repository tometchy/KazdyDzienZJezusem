"Ps33,1":
  text: "Wykrzykujcie z radości JHWH, sprawiedliwi, bo prawym przystoi pieśń chwały."
  tags: []
"Ps33,2":
  text: "Wysławiajcie JHWH na cytrze, śpiewajcie Mu przy wtórze dziesięciostrunowej harfy."
  tags: []
"Ps33,3":
  text: "Śpiewajcie dla Niego nową pieśń, grajcie pięknie i z okrzykiem radości."
  tags: []
"Ps33,4":
  text: "Ponieważ Słowo JHWH jest prawe i wszystkie Jego dzieła są dokonane w prawdzie."
  tags: []
"Ps33,5":
  text: "On kocha sprawiedliwość i sąd, ziemia jest pełna miłosierdzia JHWH."
  tags: []
"Ps33,6":
  text: "Na Słowo JHWH zostały uczynione niebiosa i tchnieniem Jego ust wszystkie ich zastępy."
  tags: []
"Ps33,7":
  text: "On gromadzi wody morskie w stos i w zbiornikach kładzie głębię wód."
  tags: []
"Ps33,8":
  text: "Niech cała ziemia boi się JHWH, niech się Go lękają wszyscy mieszkańcy świata."
  tags: []
"Ps33,9":
  text: "On bowiem przemówił – i stało się; On rozkazał – i stoi trwale."
  tags: []
"Ps33,10":
  text: "JHWH miażdży zamysły narodów, niweczy plany ludów."
  tags: []
"Ps33,11":
  text: "Zamysł JHWH trwa na wieki, myśli Jego serca z pokolenia na pokolenie."
  tags: []
"Ps33,12":
  text: "Błogosławiony naród, którego Bogiem jest JHWH; lud, który On wybrał sobie na dziedzictwo."
  tags: []
"Ps33,13":
  text: "JHWH patrzy z niebios, widzi wszystkich synów ludzkich."
  tags: []
"Ps33,14":
  text: "Z miejsca, w którym przebywa, przypatruje się wszystkim mieszkańcom ziemi."
  tags: []
"Ps33,15":
  text: "Ukształtował serce każdego z nich, zwraca uwagę na wszystkie ich czyny."
  tags: []
"Ps33,16":
  text: "Nie wybawi króla liczne wojsko ani nie ocali bohatera wielka siła."
  tags: []
"Ps33,17":
  text: "Koń jest zwodniczy w wybawieniu, nie ocali swoją wielką siłą."
  tags: []
"Ps33,18":
  text: "Oto oko JHWH nad tymi, którzy się Go boją, nad tymi, którzy pokładają nadzieję w Jego miłosierdziu;"
  tags: []
"Ps33,19":
  text: "Aby ocalić od śmierci ich duszę i zachować ich przy życiu w czasie głodu."
  tags: []
"Ps33,20":
  text: "Nasze dusze oczekują JHWH, On jest naszą pomocą i tarczą."
  tags: []
"Ps33,21":
  text: "W Nim bowiem rozraduje się nasze serce, bo zaufaliśmy Jego świętemu imieniu."
  tags: []
"Ps33,22":
  text: "Niech będzie nad nami Twoje miłosierdzie, JHWH, według pokładanej w Tobie nadziei."
  tags: []
