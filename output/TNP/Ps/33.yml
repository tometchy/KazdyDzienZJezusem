"Ps33,1": "Wykrzykujcie z radości JHWH, sprawiedliwi, bo prawym przystoi pieśń chwały."
"Ps33,2": "Wysławiajcie JHWH na cytrze, śpiewajcie Mu przy wtórze dziesięciostrunowej harfy."
"Ps33,3": "Śpiewajcie dla Niego nową pieśń, grajcie pięknie i z okrzykiem radości."
"Ps33,4": "Ponieważ Słowo JHWH jest prawe i wszystkie Jego dzieła są dokonane w prawdzie."
"Ps33,5": "On kocha sprawiedliwość i sąd, ziemia jest pełna miłosierdzia JHWH."
"Ps33,6": "Na Słowo JHWH zostały uczynione niebiosa i tchnieniem Jego ust wszystkie ich zastępy."
"Ps33,7": "On gromadzi wody morskie w stos i w zbiornikach kładzie głębię wód."
"Ps33,8": "Niech cała ziemia boi się JHWH, niech się Go lękają wszyscy mieszkańcy świata."
"Ps33,9": "On bowiem przemówił – i stało się; On rozkazał – i stoi trwale."
"Ps33,10": "JHWH miażdży zamysły narodów, niweczy plany ludów."
"Ps33,11": "Zamysł JHWH trwa na wieki, myśli Jego serca z pokolenia na pokolenie."
"Ps33,12": "Błogosławiony naród, którego Bogiem jest JHWH; lud, który On wybrał sobie na dziedzictwo."
"Ps33,13": "JHWH patrzy z niebios, widzi wszystkich synów ludzkich."
"Ps33,14": "Z miejsca, w którym przebywa, przypatruje się wszystkim mieszkańcom ziemi."
"Ps33,15": "Ukształtował serce każdego z nich, zwraca uwagę na wszystkie ich czyny."
"Ps33,16": "Nie wybawi króla liczne wojsko ani nie ocali bohatera wielka siła."
"Ps33,17": "Koń jest zwodniczy w wybawieniu, nie ocali swoją wielką siłą."
"Ps33,18": "Oto oko JHWH nad tymi, którzy się Go boją, nad tymi, którzy pokładają nadzieję w Jego miłosierdziu;"
"Ps33,19": "Aby ocalić od śmierci ich duszę i zachować ich przy życiu w czasie głodu."
"Ps33,20": "Nasze dusze oczekują JHWH, On jest naszą pomocą i tarczą."
"Ps33,21": "W Nim bowiem rozraduje się nasze serce, bo zaufaliśmy Jego świętemu imieniu."
"Ps33,22": "Niech będzie nad nami Twoje miłosierdzie, JHWH, według pokładanej w Tobie nadziei."
