"Ps63,1":
  text: "Boże, Ty jesteś moim Bogiem, Ciebie gorliwie szukam; Ciebie zapragnęła moja dusza, zatęskniło do Ciebie moje ciało na ziemi suchej i spragnionej, bez wody;"
  tags: []
"Ps63,2":
  text: "Tak właśnie ujrzałem Cię w świątyni, widząc Twoją moc i chwałę."
  tags: []
"Ps63,3":
  text: "Bo Twoje miłosierdzie lepsze jest niż życie, tak więc będę Cię wysławiać moimi wargami."
  tags: []
"Ps63,4":
  text: "Tak błogosławić Cię będę dopóki żyję, wzniosę swoje ręce w imieniu Twoim."
  tags: []
"Ps63,5":
  text: "Jak tłuszczem i szpikiem będzie nasycona moja dusza, moje usta będą Cię chwalić radosnymi wargami;"
  tags: []
"Ps63,6":
  text: "Gdy wspominam Ciebie na moim posłaniu i rozmyślam o Tobie podczas nocnych straży."
  tags: []
"Ps63,7":
  text: "Ponieważ byłeś mi pomocą, w cieniu Twoich skrzydeł będę radośnie wykrzykiwał."
  tags: []
"Ps63,8":
  text: "Moja dusza przylgnęła do Ciebie, Twoja prawica mnie podtrzymuje."
  tags: []
"Ps63,9":
  text: "Ale ci, którzy szukają zguby mojej duszy, niech pójdą w głębiny ziemi."
  tags: []
"Ps63,10":
  text: "Będą wydani pod ostrze miecza, staną się łupem szakali."
  tags: []
"Ps63,11":
  text: "Lecz król będzie się weselił w Bogu, niech się szczyci każdy, kto na Niego przysięga, a usta mówiących kłamstwo zostaną zamknięte."
  tags: []
