"Ps63,1": "Boże, Ty jesteś moim Bogiem, Ciebie gorliwie szukam; Ciebie zapragnęła moja dusza, zatęskniło do Ciebie moje ciało na ziemi suchej i spragnionej, bez wody;"
"Ps63,2": "Tak właśnie ujrzałem Cię w świątyni, widząc Twoją moc i chwałę."
"Ps63,3": "Bo Twoje miłosierdzie lepsze jest niż życie, tak więc będę Cię wysławiać moimi wargami."
"Ps63,4": "Tak błogosławić Cię będę dopóki żyję, wzniosę swoje ręce w imieniu Twoim."
"Ps63,5": "Jak tłuszczem i szpikiem będzie nasycona moja dusza, moje usta będą Cię chwalić radosnymi wargami;"
"Ps63,6": "Gdy wspominam Ciebie na moim posłaniu i rozmyślam o Tobie podczas nocnych straży."
"Ps63,7": "Ponieważ byłeś mi pomocą, w cieniu Twoich skrzydeł będę radośnie wykrzykiwał."
"Ps63,8": "Moja dusza przylgnęła do Ciebie, Twoja prawica mnie podtrzymuje."
"Ps63,9": "Ale ci, którzy szukają zguby mojej duszy, niech pójdą w głębiny ziemi."
"Ps63,10": "Będą wydani pod ostrze miecza, staną się łupem szakali."
"Ps63,11": "Lecz król będzie się weselił w Bogu, niech się szczyci każdy, kto na Niego przysięga, a usta mówiących kłamstwo zostaną zamknięte."
