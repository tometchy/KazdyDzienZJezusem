"Ps20,1": "Dla przewodnika chóru. Psalm Dawida. Niech cię wysłucha JHWH w dniu utrapienia, niech cię chroni imię Boga Jakuba!"
"Ps20,2": "Niech ci ześle pomoc ze świątyni i niech cię wesprze z Syjonu."
"Ps20,3": "Niech pamięta wszystkie twoje ofiary i niech przyjmie twoje ofiary całopalne. Sela."
"Ps20,4": "Niech da ci wszystko według twojego serca, i wszelki twój zamysł niech wypełni."
"Ps20,5": "Będziemy wykrzykiwać z radości z powodu Twojego zbawienia i w imię naszego Boga podniesiemy sztandary. Niech JHWH spełni wszystkie twoje prośby."
"Ps20,6": "Teraz wiem, że JHWH wybawia swojego pomazańca i odpowie mu ze świętych swoich niebios, zbawczą mocą swojej prawicy."
"Ps20,7": "Jedni w rydwanach, inni w koniach pokładają nadzieję, lecz my będziemy mieć w pamięci imię JHWH, naszego Boga."
"Ps20,8": "Tym zgięły się kolana i upadli, a my powstaliśmy i stoimy prosto."
"Ps20,9": "JHWH, ocal króla, obyś wysłuchał nas w dniu naszego wołania."
