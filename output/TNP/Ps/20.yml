"Ps20,1":
  text: "Dla przewodnika chóru. Psalm Dawida. Niech cię wysłucha JHWH w dniu utrapienia, niech cię chroni imię Boga Jakuba!"
  tags: []
"Ps20,2":
  text: "Niech ci ześle pomoc ze świątyni i niech cię wesprze z Syjonu."
  tags: []
"Ps20,3":
  text: "Niech pamięta wszystkie twoje ofiary i niech przyjmie twoje ofiary całopalne. Sela."
  tags: []
"Ps20,4":
  text: "Niech da ci wszystko według twojego serca, i wszelki twój zamysł niech wypełni."
  tags: []
"Ps20,5":
  text: "Będziemy wykrzykiwać z radości z powodu Twojego zbawienia i w imię naszego Boga podniesiemy sztandary. Niech JHWH spełni wszystkie twoje prośby."
  tags: []
"Ps20,6":
  text: "Teraz wiem, że JHWH wybawia swojego pomazańca i odpowie mu ze świętych swoich niebios, zbawczą mocą swojej prawicy."
  tags: []
"Ps20,7":
  text: "Jedni w rydwanach, inni w koniach pokładają nadzieję, lecz my będziemy mieć w pamięci imię JHWH, naszego Boga."
  tags: []
"Ps20,8":
  text: "Tym zgięły się kolana i upadli, a my powstaliśmy i stoimy prosto."
  tags: []
"Ps20,9":
  text: "JHWH, ocal króla, obyś wysłuchał nas w dniu naszego wołania."
  tags: []
