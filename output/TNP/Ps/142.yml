"Ps142,1":
  text: "Pieśń pouczająca Dawida gdy był w jaskini. Modlitwa. Moim głosem wołam do JHWH; moim głosem błagam JHWH o miłosierdzie."
  tags: []
"Ps142,2":
  text: "Wylewam przed Jego obliczem swoją troskę i przed Nim oznajmiam swoje utrapienie."
  tags: []
"Ps142,3":
  text: "Gdy omdlewa we mnie mój duch, Ty znasz moją ścieżkę; na drodze, którą chodzę, skrycie zastawili na mnie sidło."
  tags: []
"Ps142,4":
  text: "Spójrz na prawo i zobacz, nie ma nikogo, kto ma wzgląd na mnie; przepadła moja ucieczka, odkąd nie ma troszczącego się o moją duszę."
  tags: []
"Ps142,5":
  text: "JHWH, wołam do Ciebie, mówiąc: Ty jesteś moim schronieniem, Ty jesteś moim działem w ziemi żyjących!"
  tags: []
"Ps142,6":
  text: "Zwróć uwagę na krzyk mojego błagania, bo jestem bardzo przygnębiony; wyrwij mnie od tych, którzy mnie prześladują, bo mocniejsi są ode mnie."
  tags: []
"Ps142,7":
  text: "Wyprowadź moją duszę z więzienia, abym wysławiał Twoje imię; sprawiedliwi otoczą mnie, bo w pełni mi odpłacisz."
  tags: []
