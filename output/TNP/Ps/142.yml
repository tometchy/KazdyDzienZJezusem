"Ps142,1": "Pieśń pouczająca Dawida gdy był w jaskini. Modlitwa. Moim głosem wołam do JHWH; moim głosem błagam JHWH o miłosierdzie."
"Ps142,2": "Wylewam przed Jego obliczem swoją troskę i przed Nim oznajmiam swoje utrapienie."
"Ps142,3": "Gdy omdlewa we mnie mój duch, Ty znasz moją ścieżkę; na drodze, którą chodzę, skrycie zastawili na mnie sidło."
"Ps142,4": "Spójrz na prawo i zobacz, nie ma nikogo, kto ma wzgląd na mnie; przepadła moja ucieczka, odkąd nie ma troszczącego się o moją duszę."
"Ps142,5": "JHWH, wołam do Ciebie, mówiąc: Ty jesteś moim schronieniem, Ty jesteś moim działem w ziemi żyjących!"
"Ps142,6": "Zwróć uwagę na krzyk mojego błagania, bo jestem bardzo przygnębiony; wyrwij mnie od tych, którzy mnie prześladują, bo mocniejsi są ode mnie."
"Ps142,7": "Wyprowadź moją duszę z więzienia, abym wysławiał Twoje imię; sprawiedliwi otoczą mnie, bo w pełni mi odpłacisz."
