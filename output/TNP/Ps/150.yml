"Ps150,1": "Chwalcie JH[WH]. Chwalcie Boga w Jego świątyni, chwalcie Go na firmamencie Jego mocy."
"Ps150,2": "Chwalcie Go za Jego potężne dzieła; chwalcie Go za Jego niezrównaną wielkość."
"Ps150,3": "Chwalcie Go wśród dźwięków rogu; chwalcie Go na cytrze i na lirze."
"Ps150,4": "Chwalcie Go tamburynem i tańcem; chwalcie Go na strunach i na fletach."
"Ps150,5": "Chwalcie Go na cymbałach dźwięcznych; chwalcie Go na cymbałach głośno brzmiących."
"Ps150,6": "Niech wszystko, co oddycha, chwali JH[WH]. Chwalcie JH[WH]."
