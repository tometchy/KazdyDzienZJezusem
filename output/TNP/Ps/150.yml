"Ps150,1":
  text: "Chwalcie JH[WH]. Chwalcie Boga w Jego świątyni, chwalcie Go na firmamencie Jego mocy."
  tags: []
"Ps150,2":
  text: "Chwalcie Go za Jego potężne dzieła; chwalcie Go za Jego niezrównaną wielkość."
  tags: []
"Ps150,3":
  text: "Chwalcie Go wśród dźwięków rogu; chwalcie Go na cytrze i na lirze."
  tags: []
"Ps150,4":
  text: "Chwalcie Go tamburynem i tańcem; chwalcie Go na strunach i na fletach."
  tags: []
"Ps150,5":
  text: "Chwalcie Go na cymbałach dźwięcznych; chwalcie Go na cymbałach głośno brzmiących."
  tags: []
"Ps150,6":
  text: "Niech wszystko, co oddycha, chwali JH[WH]. Chwalcie JH[WH]."
  tags: []
