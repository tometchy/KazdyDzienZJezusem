"Ps25,1": "Dawidowy. Psalm. Do Ciebie, JHWH, wznoszę moją duszę."
"Ps25,2": "Mój Boże, Tobie ufam, niech nie doznam wstydu; niech moi wrogowie nie triumfują nade mną."
"Ps25,3": "Tak! Nikt, kto Ciebie oczekuje, nie dozna wstydu; zawstydzą się ci, którzy bez powodu postępują zdradziecko."
"Ps25,4": "JHWH, daj mi poznać Twoje drogi, naucz mnie Twoich ścieżek."
"Ps25,5": "Spraw, abym chodził w Twojej prawdzie i nauczaj mnie, bo Ty Boże jesteś moim zbawieniem; Ciebie co dzień oczekuję."
"Ps25,6": "Pamiętaj o swoim miłosierdziu, JHWH, i o Twoich łaskach, które są od wieków."
"Ps25,7": "I nie pamiętaj grzechów mojej młodości i przejawów mojego buntu; pamiętaj o mnie według Twojego miłosierdzia, ze względu na Twoją dobroć, JHWH."
"Ps25,8": "JHWH jest dobry i prawy, dlatego grzesznikom pokazuje drogę."
"Ps25,9": "Poprowadzi pokornych w sprawiedliwości, pokornych nauczy swojej drogi."
"Ps25,10": "Wszystkie ścieżki JHWH to miłosierdzie i prawda dla tych, którzy strzegą Jego przymierza i świadectwa."
"Ps25,11": "JHWH, przez wzgląd na Twoje imię przebacz moje przewinienie, bo jest wielkie."
"Ps25,12": "Kim jest ów człowiek, który boi się JHWH? Takiego naucza drogi, którą ma wybrać."
"Ps25,13": "Jego dusza będzie przebywać w dobroci i jego potomstwo odziedziczy ziemię."
"Ps25,14": "Tajemnica JHWH odkryta jest dla tych, którzy się Go boją, daje im poznać swoje przymierze."
"Ps25,15": "Moje oczy zawsze skierowane są na JHWH, bo On wyrwie z sidła moje nogi."
"Ps25,16": "Zwróć się ku mnie i zmiłuj się nade mną, bo jestem samotny i opuszczony."
"Ps25,17": "Utrapienia mojego serca rozmnożyły się, wyprowadź mnie z moich udręk."
"Ps25,18": "Spójrz na moje utrapienie i trud i zabierz wszystkie moje grzechy."
"Ps25,19": "Spójrz, jak liczni stali się moi wrogowie, jak bardzo mnie nienawidzą."
"Ps25,20": "Strzeż mojej duszy i ocal mnie, bym nie doznał wstydu; w Tobie bowiem pokładam nadzieję."
"Ps25,21": "Niech mnie chronią uczciwość i prawość, bo na Ciebie czekałem."
"Ps25,22": "Boże, wykup Izraela ze wszystkich jego udręczeń."
