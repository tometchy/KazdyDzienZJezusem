"Ps25,1":
  text: "Dawidowy. Psalm. Do Ciebie, JHWH, wznoszę moją duszę."
  tags: []
"Ps25,2":
  text: "Mój Boże, Tobie ufam, niech nie doznam wstydu; niech moi wrogowie nie triumfują nade mną."
  tags: []
"Ps25,3":
  text: "Tak! Nikt, kto Ciebie oczekuje, nie dozna wstydu; zawstydzą się ci, którzy bez powodu postępują zdradziecko."
  tags: []
"Ps25,4":
  text: "JHWH, daj mi poznać Twoje drogi, naucz mnie Twoich ścieżek."
  tags: []
"Ps25,5":
  text: "Spraw, abym chodził w Twojej prawdzie i nauczaj mnie, bo Ty Boże jesteś moim zbawieniem; Ciebie co dzień oczekuję."
  tags: []
"Ps25,6":
  text: "Pamiętaj o swoim miłosierdziu, JHWH, i o Twoich łaskach, które są od wieków."
  tags: []
"Ps25,7":
  text: "I nie pamiętaj grzechów mojej młodości i przejawów mojego buntu; pamiętaj o mnie według Twojego miłosierdzia, ze względu na Twoją dobroć, JHWH."
  tags: []
"Ps25,8":
  text: "JHWH jest dobry i prawy, dlatego grzesznikom pokazuje drogę."
  tags: []
"Ps25,9":
  text: "Poprowadzi pokornych w sprawiedliwości, pokornych nauczy swojej drogi."
  tags: []
"Ps25,10":
  text: "Wszystkie ścieżki JHWH to miłosierdzie i prawda dla tych, którzy strzegą Jego przymierza i świadectwa."
  tags: []
"Ps25,11":
  text: "JHWH, przez wzgląd na Twoje imię przebacz moje przewinienie, bo jest wielkie."
  tags: []
"Ps25,12":
  text: "Kim jest ów człowiek, który boi się JHWH? Takiego naucza drogi, którą ma wybrać."
  tags: []
"Ps25,13":
  text: "Jego dusza będzie przebywać w dobroci i jego potomstwo odziedziczy ziemię."
  tags: []
"Ps25,14":
  text: "Tajemnica JHWH odkryta jest dla tych, którzy się Go boją, daje im poznać swoje przymierze."
  tags: []
"Ps25,15":
  text: "Moje oczy zawsze skierowane są na JHWH, bo On wyrwie z sidła moje nogi."
  tags: []
"Ps25,16":
  text: "Zwróć się ku mnie i zmiłuj się nade mną, bo jestem samotny i opuszczony."
  tags: []
"Ps25,17":
  text: "Utrapienia mojego serca rozmnożyły się, wyprowadź mnie z moich udręk."
  tags: []
"Ps25,18":
  text: "Spójrz na moje utrapienie i trud i zabierz wszystkie moje grzechy."
  tags: []
"Ps25,19":
  text: "Spójrz, jak liczni stali się moi wrogowie, jak bardzo mnie nienawidzą."
  tags: []
"Ps25,20":
  text: "Strzeż mojej duszy i ocal mnie, bym nie doznał wstydu; w Tobie bowiem pokładam nadzieję."
  tags: []
"Ps25,21":
  text: "Niech mnie chronią uczciwość i prawość, bo na Ciebie czekałem."
  tags: []
"Ps25,22":
  text: "Boże, wykup Izraela ze wszystkich jego udręczeń."
  tags: []
