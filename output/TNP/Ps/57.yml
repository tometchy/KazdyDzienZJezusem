"Ps57,1":
  text: "Zmiłuj się nade mną, Boże, zmiłuj się nade mną, bo moja dusza ufa Tobie; w cień Twoich skrzydeł będę uciekał, aż przeminą nieszczęścia."
  tags: []
"Ps57,2":
  text: "Będę wołał do Boga Najwyższego, do Boga osiągającego swój cel wobec mnie."
  tags: []
"Ps57,3":
  text: "On pośle pomoc z niebios i wybawi. Bo urągał mi ten, który chce mnie zmiażdżyć. Sela. Bóg pośle mi swoje miłosierdzie i prawdę."
  tags: []
"Ps57,4":
  text: "Moja dusza przebywa pośrodku lwów; spoczywam pośród zapalczywych, pośród synów ludzkich, których zęby są jak włócznie i strzały, a język jak ostry miecz."
  tags: []
"Ps57,5":
  text: "Bądź wywyższony, Boże, ponad niebiosa, a Twoja chwała ponad całą ziemię."
  tags: []
"Ps57,6":
  text: "Zastawili sieć na moje kroki, zgięli moją duszę, wykopali przede mną dół, lecz wpadli do środka niego. Sela."
  tags: []
"Ps57,7":
  text: "Utwierdzone jest moje serce, Boże, utwierdzone jest moje serce; będę śpiewał i oddawał Ci chwałę."
  tags: []
"Ps57,8":
  text: "Obudź się, moja chwało, obudź się, cytro i harfo; chcę obudzić jutrzenkę."
  tags: []
"Ps57,9":
  text: "Będę Cię wysławiał wśród ludów, PANIE, będę Ci śpiewał wśród narodów."
  tags: []
"Ps57,10":
  text: "Bo wielkie jest Twoje miłosierdzie, aż do niebios, i aż pod obłoki Twoja prawda."
  tags: []
"Ps57,11":
  text: "Bądź wywyższony ponad niebiosa, Boże, a ponad całą ziemię Twoja chwała."
  tags: []
