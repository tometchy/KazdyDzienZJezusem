"Ps57,1": "Zmiłuj się nade mną, Boże, zmiłuj się nade mną, bo moja dusza ufa Tobie; w cień Twoich skrzydeł będę uciekał, aż przeminą nieszczęścia."
"Ps57,2": "Będę wołał do Boga Najwyższego, do Boga osiągającego swój cel wobec mnie."
"Ps57,3": "On pośle pomoc z niebios i wybawi. Bo urągał mi ten, który chce mnie zmiażdżyć. Sela. Bóg pośle mi swoje miłosierdzie i prawdę."
"Ps57,4": "Moja dusza przebywa pośrodku lwów; spoczywam pośród zapalczywych, pośród synów ludzkich, których zęby są jak włócznie i strzały, a język jak ostry miecz."
"Ps57,5": "Bądź wywyższony, Boże, ponad niebiosa, a Twoja chwała ponad całą ziemię."
"Ps57,6": "Zastawili sieć na moje kroki, zgięli moją duszę, wykopali przede mną dół, lecz wpadli do środka niego. Sela."
"Ps57,7": "Utwierdzone jest moje serce, Boże, utwierdzone jest moje serce; będę śpiewał i oddawał Ci chwałę."
"Ps57,8": "Obudź się, moja chwało, obudź się, cytro i harfo; chcę obudzić jutrzenkę."
"Ps57,9": "Będę Cię wysławiał wśród ludów, PANIE, będę Ci śpiewał wśród narodów."
"Ps57,10": "Bo wielkie jest Twoje miłosierdzie, aż do niebios, i aż pod obłoki Twoja prawda."
"Ps57,11": "Bądź wywyższony ponad niebiosa, Boże, a ponad całą ziemię Twoja chwała."
