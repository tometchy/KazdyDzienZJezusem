"Mt11,1": "I stało się, kiedy Jezus zakończył wydawanie poleceń dwunastu swoim uczniom, że odszedł stamtąd, aby nauczać i głosić w ich miastach."
"Mt11,2": "A gdy Jan usłyszał w więzieniu o czynach Chrystusa, posłał dwóch ze swoich uczniów;"
"Mt11,3": "I powiedział do Niego: Czy to Ty jesteś tym, który ma przyjść, czy mamy oczekiwać kogoś innego?"
"Mt11,4": "A Jezus w odpowiedzi, rzekł im: Idźcie i oznajmijcie Janowi, co słyszycie i widzicie:"
"Mt11,5": "Ślepi widzą, chromi chodzą, trędowaci zostają oczyszczeni, głusi słyszą, umarli są wzbudzani, a ubogim głoszona jest Ewangelia;"
"Mt11,6": "A błogosławiony jest ten, kto nie zgorszy się z mojego powodu."
"Mt11,7": "A gdy oni odchodzili, Jezus zaczął mówić do tłumów o Janie: Co wyszliście oglądać na pustyni? Trzcinę chwiejącą się na wietrze?"
"Mt11,8": "Ale co wyszliście zobaczyć? Czy człowieka ubranego w miękkie szaty? Oto ci, którzy noszą miękkie szaty, są w domach królów."
"Mt11,9": "Ale co wyszliście zobaczyć? Proroka? Tak, mówię wam, że więcej niż proroka."
"Mt11,10": "Bo to jest ten, o którym napisano: Oto ja posyłam mojego posłańca przed Twoim obliczem, który przygotuje Twoją drogę przed Tobą."
"Mt11,11": "Zaprawdę mówię wam: Wśród narodzonych z kobiet, nie powstał większy nad Jana Chrzciciela; ale najmniejszy w Królestwie Niebios, większy jest niż on."
"Mt11,12": "A od dni Jana Chrzciciela aż dotąd Królestwo Niebios ulega gwałtowi, i gwałtownicy porywają je."
"Mt11,13": "Bo wszyscy Prorocy i Prawo prorokowali aż do Jana."
"Mt11,14": "A jeśli chcecie to przyjąć, on jest Eliaszem, który miał przyjść."
"Mt11,15": "Kto ma uszy, aby słuchać, niech słucha."
"Mt11,16": "Ale do kogo przyrównam to pokolenie? Podobne jest do chłopców, którzy siedzą na rynkach i wołają do swoich towarzyszy,"
"Mt11,17": "I mówią: Graliśmy wam na piszczałce, a nie tańczyliście; śpiewaliśmy pieśni żałobne, a nie uderzyliście się w piersi."
"Mt11,18": "Przyszedł bowiem Jan, nie jadł i nie pił, a mówią: Ma demona."
"Mt11,19": "Przyszedł Syn Człowieczy, jedząc i pijąc, a mówią: Oto człowiek – żarłok i pijak wina, przyjaciel celników i grzeszników; i mądrość została uznana za sprawiedliwą przez swoje dzieci."
"Mt11,20": "Wtedy zaczął czynić wyrzuty miastom, w których działo się bardzo wiele Jego dzieł mocy, że nie upamiętały się, mówiąc:"
"Mt11,21": "Biada tobie, Chorazin! Biada tobie, Betsaido! Bo gdyby te dzieła mocy stały się w Tyrze i w Sydonie, które stały się u was, już dawno by upamiętały się w worze i popiele."
"Mt11,22": "Ale mówię wam: Znośniej będzie Tyrowi i Sydonowi w dzień sądu, niż wam."
"Mt11,23": "A ty, Kafarnaum, któreś zostało wywyższone aż do nieba, aż do Hadesu zostaniesz strącone; bo gdyby w Sodomie stały się dzieła mocy, które stały się u ciebie, pozostałaby aż do dzisiaj."
"Mt11,24": "Ale mówię wam: Znośniej będzie ziemi Sodomy w dzień sądu, niż tobie."
"Mt11,25": "W tym czasie odpowiadając, Jezus rzekł: Wysławiam Cię Ojcze, Panie nieba i ziemi, że zakryłeś te rzeczy przed mądrymi i roztropnymi, a objawiłeś je niemowlętom."
"Mt11,26": "Tak, Ojcze, gdyż takie było Twoje upodobanie."
"Mt11,27": "Wszystko zostało mi przekazane przez Ojca mojego i nikt nie zna dogłębnie Syna, tylko Ojciec, i nikt nie zna dogłębnie Ojca, tylko Syn, i ten, komu Syn zechce objawić."
"Mt11,28": "Chodźcie do mnie wszyscy, którzy jesteście spracowani i obciążeni, a ja dam wam odpocząć."
"Mt11,29": "Weźcie na siebie moje jarzmo i uczcie się ode mnie, że jestem łagodny i pokorny sercem, a znajdziecie odpocznienie dla swoich dusz;"
"Mt11,30": "Albowiem moje jarzmo jest wygodne, a moje brzemię lekkie."
