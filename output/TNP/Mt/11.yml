"Mt11,1":
  text: "I stało się, kiedy Jezus zakończył wydawanie poleceń dwunastu swoim uczniom, że odszedł stamtąd, aby nauczać i głosić w ich miastach."
  tags: []
"Mt11,2":
  text: "A gdy Jan usłyszał w więzieniu o czynach Chrystusa, posłał dwóch ze swoich uczniów;"
  tags: []
"Mt11,3":
  text: "I powiedział do Niego: Czy to Ty jesteś tym, który ma przyjść, czy mamy oczekiwać kogoś innego?"
  tags: []
"Mt11,4":
  text: "A Jezus w odpowiedzi, rzekł im: Idźcie i oznajmijcie Janowi, co słyszycie i widzicie:"
  tags: []
"Mt11,5":
  text: "Ślepi widzą, chromi chodzą, trędowaci zostają oczyszczeni, głusi słyszą, umarli są wzbudzani, a ubogim głoszona jest Ewangelia;"
  tags: []
"Mt11,6":
  text: "A błogosławiony jest ten, kto nie zgorszy się z mojego powodu."
  tags: []
"Mt11,7":
  text: "A gdy oni odchodzili, Jezus zaczął mówić do tłumów o Janie: Co wyszliście oglądać na pustyni? Trzcinę chwiejącą się na wietrze?"
  tags: []
"Mt11,8":
  text: "Ale co wyszliście zobaczyć? Czy człowieka ubranego w miękkie szaty? Oto ci, którzy noszą miękkie szaty, są w domach królów."
  tags: []
"Mt11,9":
  text: "Ale co wyszliście zobaczyć? Proroka? Tak, mówię wam, że więcej niż proroka."
  tags: []
"Mt11,10":
  text: "Bo to jest ten, o którym napisano: Oto ja posyłam mojego posłańca przed Twoim obliczem, który przygotuje Twoją drogę przed Tobą."
  tags: []
"Mt11,11":
  text: "Zaprawdę mówię wam: Wśród narodzonych z kobiet, nie powstał większy nad Jana Chrzciciela; ale najmniejszy w Królestwie Niebios, większy jest niż on."
  tags: []
"Mt11,12":
  text: "A od dni Jana Chrzciciela aż dotąd Królestwo Niebios ulega gwałtowi, i gwałtownicy porywają je."
  tags: []
"Mt11,13":
  text: "Bo wszyscy Prorocy i Prawo prorokowali aż do Jana."
  tags: []
"Mt11,14":
  text: "A jeśli chcecie to przyjąć, on jest Eliaszem, który miał przyjść."
  tags: []
"Mt11,15":
  text: "Kto ma uszy, aby słuchać, niech słucha."
  tags: []
"Mt11,16":
  text: "Ale do kogo przyrównam to pokolenie? Podobne jest do chłopców, którzy siedzą na rynkach i wołają do swoich towarzyszy,"
  tags: []
"Mt11,17":
  text: "I mówią: Graliśmy wam na piszczałce, a nie tańczyliście; śpiewaliśmy pieśni żałobne, a nie uderzyliście się w piersi."
  tags: []
"Mt11,18":
  text: "Przyszedł bowiem Jan, nie jadł i nie pił, a mówią: Ma demona."
  tags: []
"Mt11,19":
  text: "Przyszedł Syn Człowieczy, jedząc i pijąc, a mówią: Oto człowiek – żarłok i pijak wina, przyjaciel celników i grzeszników; i mądrość została uznana za sprawiedliwą przez swoje dzieci."
  tags: []
"Mt11,20":
  text: "Wtedy zaczął czynić wyrzuty miastom, w których działo się bardzo wiele Jego dzieł mocy, że nie upamiętały się, mówiąc:"
  tags: []
"Mt11,21":
  text: "Biada tobie, Chorazin! Biada tobie, Betsaido! Bo gdyby te dzieła mocy stały się w Tyrze i w Sydonie, które stały się u was, już dawno by upamiętały się w worze i popiele."
  tags: []
"Mt11,22":
  text: "Ale mówię wam: Znośniej będzie Tyrowi i Sydonowi w dzień sądu, niż wam."
  tags: []
"Mt11,23":
  text: "A ty, Kafarnaum, któreś zostało wywyższone aż do nieba, aż do Hadesu zostaniesz strącone; bo gdyby w Sodomie stały się dzieła mocy, które stały się u ciebie, pozostałaby aż do dzisiaj."
  tags: []
"Mt11,24":
  text: "Ale mówię wam: Znośniej będzie ziemi Sodomy w dzień sądu, niż tobie."
  tags: []
"Mt11,25":
  text: "W tym czasie odpowiadając, Jezus rzekł: Wysławiam Cię Ojcze, Panie nieba i ziemi, że zakryłeś te rzeczy przed mądrymi i roztropnymi, a objawiłeś je niemowlętom."
  tags: []
"Mt11,26":
  text: "Tak, Ojcze, gdyż takie było Twoje upodobanie."
  tags: []
"Mt11,27":
  text: "Wszystko zostało mi przekazane przez Ojca mojego i nikt nie zna dogłębnie Syna, tylko Ojciec, i nikt nie zna dogłębnie Ojca, tylko Syn, i ten, komu Syn zechce objawić."
  tags: []
"Mt11,28":
  text: "Chodźcie do mnie wszyscy, którzy jesteście spracowani i obciążeni, a ja dam wam odpocząć."
  tags: []
"Mt11,29":
  text: "Weźcie na siebie moje jarzmo i uczcie się ode mnie, że jestem łagodny i pokorny sercem, a znajdziecie odpocznienie dla swoich dusz;"
  tags: []
"Mt11,30":
  text: "Albowiem moje jarzmo jest wygodne, a moje brzemię lekkie."
  tags: []
