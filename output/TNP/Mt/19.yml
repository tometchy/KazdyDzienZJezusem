"Mt19,1": "I stało się, gdy zakończył Jezus te słowa, że odszedł z Galilei i przyszedł w granice Judei po drugiej stronie Jordanu."
"Mt19,2": "I podążały za Nim wielkie tłumy, i tam ich uzdrawiał."
"Mt19,3": "I przyszli do Niego faryzeusze, wystawiając Go na próbę i mówiąc do Niego: Czy wolno człowiekowi oddalić swoją żonę z powodu każdej przyczyny?"
"Mt19,4": "A On w odpowiedzi, rzekł im: Czy nie czytaliście, że Ten, który stworzył, od początku uczynił ich mężczyzną i kobietą?"
"Mt19,5": "I powiedział: Dlatego opuści mąż swojego ojca i matkę, i zostanie złączony ze swoją żoną, i będą dwoje jednym ciałem?"
"Mt19,6": "Tak że już nie są dwoje, ale jedno ciało. Co więc Bóg złączył, człowiek niech nie rozłącza."
"Mt19,7": "Powiedzieli do Niego: Dlaczego więc Mojżesz polecił dać zwój rozwodowy i ją oddalić?"
"Mt19,8": "Powiedział im: Mojżesz z powodu zatwardziałości waszego serca pozwolił wam oddalić wasze żony, lecz od początku tak nie było."
"Mt19,9": "Ale mówię wam: Ktokolwiek oddaliłby swoją żonę z wyjątkiem powodu nierządu, i poślubił inną, cudzołoży; a kto poślubił tę, która jest oddalona, cudzołoży."
"Mt19,10": "Powiedzieli do Niego Jego uczniowie: Jeśli tak się ma sprawa męża z żoną, nie warto się żenić."
"Mt19,11": "A On powiedział im: Nie wszyscy pojmują te słowa, ale ci, którym jest to dane."
"Mt19,12": "Albowiem są eunuchowie, którzy narodzili się takimi z łona matki, są też eunuchowie, którzy przez ludzi zostali wytrzebieni; są też eunuchowie, którzy sami siebie uczynili eunuchami dla Królestwa Niebios. Kto może pojąć, niech pojmuje!"
"Mt19,13": "Wtedy przynoszono do Niego dzieci, aby wkładał na nie ręce i modlił się; ale uczniowie skarcili ich."
"Mt19,14": "Lecz Jezus powiedział: Dopuśćcie dzieci i nie zabraniajcie im przyjść do mnie; bo takich jest Królestwo Niebios."
"Mt19,15": "A gdy włożył na nie ręce, odszedł stamtąd."
"Mt19,16": "I oto podszedł do Niego ktoś i powiedział do Niego: Nauczycielu dobry! Co dobrego mam czynić, abym miał życie wieczne?"
"Mt19,17": "Ale On mu powiedział: Czemu mówisz do mnie – dobry? Nikt nie jest dobry, tylko jeden, Bóg. A jeśli chcesz wejść do życia, zachowuj przykazania."
"Mt19,18": "Mówi do Niego: Jakie? A Jezus powiedział: Te: nie będziesz mordował, nie będziesz cudzołożył, nie będziesz kradł, nie będziesz mówił fałszywego świadectwa;"
"Mt19,19": "Czcij swojego ojca i matkę, i: Będziesz miłował swojego bliźniego, jak samego siebie."
"Mt19,20": "Mówi do Niego młodzieniec: To wszystko zachowywałem od swojej młodości; czego mi jeszcze brakuje?"
"Mt19,21": "Jezus powiedział do niego: Jeśli chcesz być doskonały, idź, sprzedaj swoje majętności i rozdaj ubogim, a będziesz miał skarb w niebie; i przyjdź tutaj, i podążaj za mną."
"Mt19,22": "A gdy młodzieniec usłyszał to słowo, odszedł smutny; był bowiem człowiekiem mającym wiele posiadłości."
"Mt19,23": "A Jezus powiedział swoim uczniom: Zaprawdę mówię wam, że bogaty z trudnością wejdzie do Królestwa Niebios."
"Mt19,24": "A nadto mówię wam: Łatwiej wielbłądowi przejść przez ucho igły, niż bogatemu wejść do Królestwa Bożego."
"Mt19,25": "Gdy usłyszeli to Jego uczniowie, bardzo się zdumieli, mówiąc: Kto więc może zostać zbawiony?"
"Mt19,26": "A Jezus spojrzał na nich i powiedział im: U ludzi to niemożliwe, lecz u Boga wszystko jest możliwe."
"Mt19,27": "Wtedy odpowiedział Piotr, mówiąc do Niego: Oto my opuściliśmy wszystko i poszliśmy za Tobą; co za to mieć będziemy?"
"Mt19,28": "A Jezus powiedział im: Zaprawdę mówię wam, że wy, którzy za mną poszliście, przy odrodzeniu, gdy usiądzie Syn Człowieczy na tronie swojej chwały, usiądziecie i wy na dwunastu tronach, sądząc dwanaście pokoleń Izraela."
"Mt19,29": "I każdy, kto by opuścił domy, albo braci, albo siostry, albo ojca, albo matkę, albo żonę, albo dzieci, albo rolę dla mojego imienia, stokrotnie tyle otrzyma, i życie wieczne odziedziczy."
"Mt19,30": "A wielu pierwszych będzie ostatnimi, a ostatnich pierwszymi."
