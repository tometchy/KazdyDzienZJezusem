"Mt19,1":
  text: "I stało się, gdy zakończył Jezus te słowa, że odszedł z Galilei i przyszedł w granice Judei po drugiej stronie Jordanu."
  tags: []
"Mt19,2":
  text: "I podążały za Nim wielkie tłumy, i tam ich uzdrawiał."
  tags: []
"Mt19,3":
  text: "I przyszli do Niego faryzeusze, wystawiając Go na próbę i mówiąc do Niego: Czy wolno człowiekowi oddalić swoją żonę z powodu każdej przyczyny?"
  tags: []
"Mt19,4":
  text: "A On w odpowiedzi, rzekł im: Czy nie czytaliście, że Ten, który stworzył, od początku uczynił ich mężczyzną i kobietą?"
  tags: []
"Mt19,5":
  text: "I powiedział: Dlatego opuści mąż swojego ojca i matkę, i zostanie złączony ze swoją żoną, i będą dwoje jednym ciałem?"
  tags: []
"Mt19,6":
  text: "Tak że już nie są dwoje, ale jedno ciało. Co więc Bóg złączył, człowiek niech nie rozłącza."
  tags: []
"Mt19,7":
  text: "Powiedzieli do Niego: Dlaczego więc Mojżesz polecił dać zwój rozwodowy i ją oddalić?"
  tags: []
"Mt19,8":
  text: "Powiedział im: Mojżesz z powodu zatwardziałości waszego serca pozwolił wam oddalić wasze żony, lecz od początku tak nie było."
  tags: []
"Mt19,9":
  text: "Ale mówię wam: Ktokolwiek oddaliłby swoją żonę z wyjątkiem powodu nierządu, i poślubił inną, cudzołoży; a kto poślubił tę, która jest oddalona, cudzołoży."
  tags: []
"Mt19,10":
  text: "Powiedzieli do Niego Jego uczniowie: Jeśli tak się ma sprawa męża z żoną, nie warto się żenić."
  tags: []
"Mt19,11":
  text: "A On powiedział im: Nie wszyscy pojmują te słowa, ale ci, którym jest to dane."
  tags: []
"Mt19,12":
  text: "Albowiem są eunuchowie, którzy narodzili się takimi z łona matki, są też eunuchowie, którzy przez ludzi zostali wytrzebieni; są też eunuchowie, którzy sami siebie uczynili eunuchami dla Królestwa Niebios. Kto może pojąć, niech pojmuje!"
  tags: []
"Mt19,13":
  text: "Wtedy przynoszono do Niego dzieci, aby wkładał na nie ręce i modlił się; ale uczniowie skarcili ich."
  tags: []
"Mt19,14":
  text: "Lecz Jezus powiedział: Dopuśćcie dzieci i nie zabraniajcie im przyjść do mnie; bo takich jest Królestwo Niebios."
  tags: []
"Mt19,15":
  text: "A gdy włożył na nie ręce, odszedł stamtąd."
  tags: []
"Mt19,16":
  text: "I oto podszedł do Niego ktoś i powiedział do Niego: Nauczycielu dobry! Co dobrego mam czynić, abym miał życie wieczne?"
  tags: []
"Mt19,17":
  text: "Ale On mu powiedział: Czemu mówisz do mnie – dobry? Nikt nie jest dobry, tylko jeden, Bóg. A jeśli chcesz wejść do życia, zachowuj przykazania."
  tags: []
"Mt19,18":
  text: "Mówi do Niego: Jakie? A Jezus powiedział: Te: nie będziesz mordował, nie będziesz cudzołożył, nie będziesz kradł, nie będziesz mówił fałszywego świadectwa;"
  tags: []
"Mt19,19":
  text: "Czcij swojego ojca i matkę, i: Będziesz miłował swojego bliźniego, jak samego siebie."
  tags: []
"Mt19,20":
  text: "Mówi do Niego młodzieniec: To wszystko zachowywałem od swojej młodości; czego mi jeszcze brakuje?"
  tags: []
"Mt19,21":
  text: "Jezus powiedział do niego: Jeśli chcesz być doskonały, idź, sprzedaj swoje majętności i rozdaj ubogim, a będziesz miał skarb w niebie; i przyjdź tutaj, i podążaj za mną."
  tags: []
"Mt19,22":
  text: "A gdy młodzieniec usłyszał to słowo, odszedł smutny; był bowiem człowiekiem mającym wiele posiadłości."
  tags: []
"Mt19,23":
  text: "A Jezus powiedział swoim uczniom: Zaprawdę mówię wam, że bogaty z trudnością wejdzie do Królestwa Niebios."
  tags: []
"Mt19,24":
  text: "A nadto mówię wam: Łatwiej wielbłądowi przejść przez ucho igły, niż bogatemu wejść do Królestwa Bożego."
  tags: []
"Mt19,25":
  text: "Gdy usłyszeli to Jego uczniowie, bardzo się zdumieli, mówiąc: Kto więc może zostać zbawiony?"
  tags: []
"Mt19,26":
  text: "A Jezus spojrzał na nich i powiedział im: U ludzi to niemożliwe, lecz u Boga wszystko jest możliwe."
  tags: []
"Mt19,27":
  text: "Wtedy odpowiedział Piotr, mówiąc do Niego: Oto my opuściliśmy wszystko i poszliśmy za Tobą; co za to mieć będziemy?"
  tags: []
"Mt19,28":
  text: "A Jezus powiedział im: Zaprawdę mówię wam, że wy, którzy za mną poszliście, przy odrodzeniu, gdy usiądzie Syn Człowieczy na tronie swojej chwały, usiądziecie i wy na dwunastu tronach, sądząc dwanaście pokoleń Izraela."
  tags: []
"Mt19,29":
  text: "I każdy, kto by opuścił domy, albo braci, albo siostry, albo ojca, albo matkę, albo żonę, albo dzieci, albo rolę dla mojego imienia, stokrotnie tyle otrzyma, i życie wieczne odziedziczy."
  tags: []
"Mt19,30":
  text: "A wielu pierwszych będzie ostatnimi, a ostatnich pierwszymi."
  tags: []
