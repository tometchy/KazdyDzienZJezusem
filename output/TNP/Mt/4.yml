"Mt4,1":
  text: "Wtedy Jezus został zaprowadzony przez Ducha na pustynię, by był kuszony przez diabła."
  tags: []
"Mt4,2":
  text: "A wówczas, po poście trwającym czterdzieści dni i czterdzieści nocy, łaknął."
  tags: []
"Mt4,3":
  text: "I zbliżył się do Niego kusiciel, i powiedział: Jeśli jesteś Synem Bożym, powiedz, aby te kamienie stały się chlebem."
  tags: []
"Mt4,4":
  text: "A On w odpowiedzi, rzekł: Napisano: Nie samym chlebem będzie żył człowiek, ale każdym słowem, wychodzącym z ust Boga."
  tags: []
"Mt4,5":
  text: "Wtedy diabeł bierze Go do miasta świętego i stawia Go na szczycie świątyni,"
  tags: []
"Mt4,6":
  text: "I mówi do Niego: Jeśli jesteś Synem Bożym, rzuć się w dół, albowiem jest napisane, że: Aniołom swoim rozkaże o Tobie, i podniosą Cię na rękach, abyś czasem nie uraził swojej nogi o kamień."
  tags: []
"Mt4,7":
  text: "Jezus powiedział mu: Również jest napisane: Nie będziesz kusił PANA, Boga twojego."
  tags: []
"Mt4,8":
  text: "Ponownie bierze Go diabeł na bardzo wysoką górę i ukazuje Mu wszystkie królestwa świata oraz ich chwałę,"
  tags: []
"Mt4,9":
  text: "I mówi Mu: Dam Ci to wszystko, jeśli upadniesz i oddasz mi pokłon."
  tags: []
"Mt4,10":
  text: "Wtedy Jezus mówi do niego: Zejdź mi z drogi, szatanie! Bo jest napisane: PANU, Bogu twojemu, pokłon będziesz oddawać i Jemu samemu będziesz służyć."
  tags: []
"Mt4,11":
  text: "Wtedy diabeł Go opuścił, a oto aniołowie przystąpili i służyli Mu."
  tags: []
"Mt4,12":
  text: "A gdy Jezus usłyszał, że Jan został wydany, wrócił do Galilei;"
  tags: []
"Mt4,13":
  text: "A po opuszczeniu Nazaretu przyszedł i zamieszkał w Kafarnaum, nad morzem, w granicach krain Zabulona i Neftalego;"
  tags: []
"Mt4,14":
  text: "Aby wypełniło się to, co zostało powiedziane przez proroka Izajasza, mówiącego:"
  tags: []
"Mt4,15":
  text: "Ziemia Zabulona i ziemia Neftalego, droga morska, za Jordanem, Galilea pogan."
  tags: []
"Mt4,16":
  text: "Lud siedzący w ciemności, ujrzał wielkie światło, a siedzącym w mrocznej krainie i w cieniu śmierci – wzeszło im światło!"
  tags: []
"Mt4,17":
  text: "Od tego czasu zaczął Jezus głosić i mówić: Upamiętajcie się, albowiem przybliżyło się Królestwo Niebios."
  tags: []
"Mt4,18":
  text: "A Jezus, idąc nad Morzem Galilejskim, ujrzał dwóch braci: Szymona, którego nazywano Piotrem, i Andrzeja, jego brata, zarzucających sieć rybacką w morze; byli bowiem rybakami."
  tags: []
"Mt4,19":
  text: "I mówi im: Chodźcie za mną, a uczynię was rybakami ludzi."
  tags: []
"Mt4,20":
  text: "A oni natychmiast opuścili sieci rybackie i podążyli za Nim."
  tags: []
"Mt4,21":
  text: "I gdy poszedł stamtąd dalej, zobaczył dwóch innych braci: Jakuba, syna Zebedeusza, i Jana, jego brata, w łodzi z Zebedeuszem, ich ojcem, naprawiających swoje sieci rybackie. I powołał ich."
  tags: []
"Mt4,22":
  text: "A oni natychmiast opuścili łódź i swojego ojca i podążali za Nim."
  tags: []
"Mt4,23":
  text: "I obchodził Jezus całą Galileę, ucząc w ich synagogach i głosząc Ewangelię Królestwa, i uzdrawiając każdą chorobę i każdą słabość wśród ludu."
  tags: []
"Mt4,24":
  text: "I rozeszła się wieść o Nim po całej Syrii. I przyprowadzili do Niego wszystkich, którzy mieli się źle, dotkniętych rozmaitymi chorobami i cierpieniami, opętanych, epileptyków, sparaliżowanych, i ich uzdrowił."
  tags: []
"Mt4,25":
  text: "A szły za Nim wielkie tłumy z Galilei, Dziesięciogrodu, Jerozolimy, Judei i zza Jordanu."
  tags: []
