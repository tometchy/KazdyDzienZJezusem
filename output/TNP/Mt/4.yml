"Mt4,1": "Wtedy Jezus został zaprowadzony przez Ducha na pustynię, by był kuszony przez diabła."
"Mt4,2": "A wówczas, po poście trwającym czterdzieści dni i czterdzieści nocy, łaknął."
"Mt4,3": "I zbliżył się do Niego kusiciel, i powiedział: Jeśli jesteś Synem Bożym, powiedz, aby te kamienie stały się chlebem."
"Mt4,4": "A On w odpowiedzi, rzekł: Napisano: Nie samym chlebem będzie żył człowiek, ale każdym słowem, wychodzącym z ust Boga."
"Mt4,5": "Wtedy diabeł bierze Go do miasta świętego i stawia Go na szczycie świątyni,"
"Mt4,6": "I mówi do Niego: Jeśli jesteś Synem Bożym, rzuć się w dół, albowiem jest napisane, że: Aniołom swoim rozkaże o Tobie, i podniosą Cię na rękach, abyś czasem nie uraził swojej nogi o kamień."
"Mt4,7": "Jezus powiedział mu: Również jest napisane: Nie będziesz kusił PANA, Boga twojego."
"Mt4,8": "Ponownie bierze Go diabeł na bardzo wysoką górę i ukazuje Mu wszystkie królestwa świata oraz ich chwałę,"
"Mt4,9": "I mówi Mu: Dam Ci to wszystko, jeśli upadniesz i oddasz mi pokłon."
"Mt4,10": "Wtedy Jezus mówi do niego: Zejdź mi z drogi, szatanie! Bo jest napisane: PANU, Bogu twojemu, pokłon będziesz oddawać i Jemu samemu będziesz służyć."
"Mt4,11": "Wtedy diabeł Go opuścił, a oto aniołowie przystąpili i służyli Mu."
"Mt4,12": "A gdy Jezus usłyszał, że Jan został wydany, wrócił do Galilei;"
"Mt4,13": "A po opuszczeniu Nazaretu przyszedł i zamieszkał w Kafarnaum, nad morzem, w granicach krain Zabulona i Neftalego;"
"Mt4,14": "Aby wypełniło się to, co zostało powiedziane przez proroka Izajasza, mówiącego:"
"Mt4,15": "Ziemia Zabulona i ziemia Neftalego, droga morska, za Jordanem, Galilea pogan."
"Mt4,16": "Lud siedzący w ciemności, ujrzał wielkie światło, a siedzącym w mrocznej krainie i w cieniu śmierci – wzeszło im światło!"
"Mt4,17": "Od tego czasu zaczął Jezus głosić i mówić: Upamiętajcie się, albowiem przybliżyło się Królestwo Niebios."
"Mt4,18": "A Jezus, idąc nad Morzem Galilejskim, ujrzał dwóch braci: Szymona, którego nazywano Piotrem, i Andrzeja, jego brata, zarzucających sieć rybacką w morze; byli bowiem rybakami."
"Mt4,19": "I mówi im: Chodźcie za mną, a uczynię was rybakami ludzi."
"Mt4,20": "A oni natychmiast opuścili sieci rybackie i podążyli za Nim."
"Mt4,21": "I gdy poszedł stamtąd dalej, zobaczył dwóch innych braci: Jakuba, syna Zebedeusza, i Jana, jego brata, w łodzi z Zebedeuszem, ich ojcem, naprawiających swoje sieci rybackie. I powołał ich."
"Mt4,22": "A oni natychmiast opuścili łódź i swojego ojca i podążali za Nim."
"Mt4,23": "I obchodził Jezus całą Galileę, ucząc w ich synagogach i głosząc Ewangelię Królestwa, i uzdrawiając każdą chorobę i każdą słabość wśród ludu."
"Mt4,24": "I rozeszła się wieść o Nim po całej Syrii. I przyprowadzili do Niego wszystkich, którzy mieli się źle, dotkniętych rozmaitymi chorobami i cierpieniami, opętanych, epileptyków, sparaliżowanych, i ich uzdrowił."
"Mt4,25": "A szły za Nim wielkie tłumy z Galilei, Dziesięciogrodu, Jerozolimy, Judei i zza Jordanu."
