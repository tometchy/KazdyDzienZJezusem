"Mt2,1":
  text: "A gdy Jezus narodził się w Betlejem Judzkim za dni króla Heroda, oto mędrcy ze Wschodu przybyli do Jerozolimy, mówiąc:"
  tags: []
"Mt2,2":
  text: "Gdzie jest Ten, który się narodził, Król Żydów? Bo widzieliśmy Jego gwiazdę na Wschodzie i przybyliśmy oddać Mu pokłon."
  tags: []
"Mt2,3":
  text: "Gdy król Herod to usłyszał, zaniepokoił się, a z nim cała Jerozolima."
  tags: []
"Mt2,4":
  text: "I gdy zebrał razem wszystkich arcykapłanów i uczonych w Piśmie, wypytywał się ich, gdzie jest narodzony Mesjasz."
  tags: []
"Mt2,5":
  text: "A oni powiedzieli mu: W Betlejem Judzkim; bo tak jest napisane przez proroka:"
  tags: []
"Mt2,6":
  text: "A ty, Betlejem, ziemio Judy, wcale nie jesteś najmniejsze wśród książąt Judy; z ciebie bowiem wyjdzie przywódca, który paść będzie lud mój – Izrael."
  tags: []
"Mt2,7":
  text: "Wtedy Herod wezwał potajemnie mędrców i dokładnie dowiedział się od nich o czasie ukazania się gwiazdy."
  tags: []
"Mt2,8":
  text: "A gdy wysyłał ich do Betlejem, powiedział: Idźcie i dokładnie wypytajcie się o to dziecię, a gdy je znajdziecie, donieście mi, abym i ja poszedł oddać Mu pokłon."
  tags: []
"Mt2,9":
  text: "Oni więc, po wysłuchaniu króla, poszli; i oto gwiazda, którą widzieli na Wschodzie, prowadziła ich, aż doszła i stanęła nad miejscem, gdzie było dziecię."
  tags: []
"Mt2,10":
  text: "A gdy ujrzeli gwiazdę, ucieszyli się bardzo wielką radością."
  tags: []
"Mt2,11":
  text: "A gdy weszli do domu, zobaczyli dziecię z Marią, matką Jego, a gdy upadli, oddali Mu pokłon i otworzyli swoje skarby, i ofiarowali Mu dary: złoto, kadzidło i mirrę."
  tags: []
"Mt2,12":
  text: "A gdy zostali ostrzeżeni przez Boga we śnie, aby nie wracali do Heroda, inną drogą wrócili do swojej krainy."
  tags: []
"Mt2,13":
  text: "A gdy odeszli, oto anioł PANA ukazał się we śnie Józefowi, mówiąc: Wstań, weź dziecię oraz Jego matkę i uciekaj do Egiptu, i bądź tam, aż ci powiem; Herod bowiem będzie szukał dziecięcia, aby je zgładzić."
  tags: []
"Mt2,14":
  text: "Wstał więc, wziął w nocy dziecię oraz Jego matkę i odszedł do Egiptu."
  tags: []
"Mt2,15":
  text: "I był tam aż do śmierci Heroda, aby wypełniło się to, co powiedział PAN przez proroka, mówiącego: Z Egiptu wezwałem swojego syna."
  tags: []
"Mt2,16":
  text: "Wtedy Herod widząc, że został oszukany przez mędrców, rozgniewał się bardzo i wysłał rozkaz, i zabił wszystkie dzieci, które były w Betlejem i we wszystkich jego granicach, w wieku lat dwóch i mniej, stosownie do czasu, o którym dokładnie dowiedział się od mędrców."
  tags: []
"Mt2,17":
  text: "Wtedy wypełniło się to, co zostało powiedziane przez proroka Jeremiasza, mówiącego:"
  tags: []
"Mt2,18":
  text: "Głos w Rama został usłyszany, lament, płacz i wielkie zawodzenie: Rachel opłakuje swoje dzieci; i nie chce dać się pocieszyć, bo już ich nie ma."
  tags: []
"Mt2,19":
  text: "A gdy umarł Herod, oto anioł PANA ukazał się we śnie Józefowi w Egipcie, mówiąc:"
  tags: []
"Mt2,20":
  text: "Wstań, weź dziecię oraz Jego matkę i idź do ziemi Izraela. Umarli bowiem ci, którzy szukali życia tego dziecięcia."
  tags: []
"Mt2,21":
  text: "Wstał więc, wziął dziecię oraz Jego matkę i przyszedł do ziemi Izraela."
  tags: []
"Mt2,22":
  text: "Ale gdy usłyszał, że Archelaus króluje nad Judeą w miejsce Heroda, swojego ojca, bał się tam wrócić; ale ostrzeżony przez Boga we śnie, oddalił się w strony Galilei."
  tags: []
"Mt2,23":
  text: "A gdy przyszedł, zamieszkał w mieście, które jest nazywane Nazaret, aby wypełniło się to, co powiedziano przez proroków: Zostanie nazwany Nazarejczykiem."
  tags: []
