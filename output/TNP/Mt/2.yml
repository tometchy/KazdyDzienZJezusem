"Mt2,1": "A gdy Jezus narodził się w Betlejem Judzkim za dni króla Heroda, oto mędrcy ze Wschodu przybyli do Jerozolimy, mówiąc:"
"Mt2,2": "Gdzie jest Ten, który się narodził, Król Żydów? Bo widzieliśmy Jego gwiazdę na Wschodzie i przybyliśmy oddać Mu pokłon."
"Mt2,3": "Gdy król Herod to usłyszał, zaniepokoił się, a z nim cała Jerozolima."
"Mt2,4": "I gdy zebrał razem wszystkich arcykapłanów i uczonych w Piśmie, wypytywał się ich, gdzie jest narodzony Mesjasz."
"Mt2,5": "A oni powiedzieli mu: W Betlejem Judzkim; bo tak jest napisane przez proroka:"
"Mt2,6": "A ty, Betlejem, ziemio Judy, wcale nie jesteś najmniejsze wśród książąt Judy; z ciebie bowiem wyjdzie przywódca, który paść będzie lud mój – Izrael."
"Mt2,7": "Wtedy Herod wezwał potajemnie mędrców i dokładnie dowiedział się od nich o czasie ukazania się gwiazdy."
"Mt2,8": "A gdy wysyłał ich do Betlejem, powiedział: Idźcie i dokładnie wypytajcie się o to dziecię, a gdy je znajdziecie, donieście mi, abym i ja poszedł oddać Mu pokłon."
"Mt2,9": "Oni więc, po wysłuchaniu króla, poszli; i oto gwiazda, którą widzieli na Wschodzie, prowadziła ich, aż doszła i stanęła nad miejscem, gdzie było dziecię."
"Mt2,10": "A gdy ujrzeli gwiazdę, ucieszyli się bardzo wielką radością."
"Mt2,11": "A gdy weszli do domu, zobaczyli dziecię z Marią, matką Jego, a gdy upadli, oddali Mu pokłon i otworzyli swoje skarby, i ofiarowali Mu dary: złoto, kadzidło i mirrę."
"Mt2,12": "A gdy zostali ostrzeżeni przez Boga we śnie, aby nie wracali do Heroda, inną drogą wrócili do swojej krainy."
"Mt2,13": "A gdy odeszli, oto anioł PANA ukazał się we śnie Józefowi, mówiąc: Wstań, weź dziecię oraz Jego matkę i uciekaj do Egiptu, i bądź tam, aż ci powiem; Herod bowiem będzie szukał dziecięcia, aby je zgładzić."
"Mt2,14": "Wstał więc, wziął w nocy dziecię oraz Jego matkę i odszedł do Egiptu."
"Mt2,15": "I był tam aż do śmierci Heroda, aby wypełniło się to, co powiedział PAN przez proroka, mówiącego: Z Egiptu wezwałem swojego syna."
"Mt2,16": "Wtedy Herod widząc, że został oszukany przez mędrców, rozgniewał się bardzo i wysłał rozkaz, i zabił wszystkie dzieci, które były w Betlejem i we wszystkich jego granicach, w wieku lat dwóch i mniej, stosownie do czasu, o którym dokładnie dowiedział się od mędrców."
"Mt2,17": "Wtedy wypełniło się to, co zostało powiedziane przez proroka Jeremiasza, mówiącego:"
"Mt2,18": "Głos w Rama został usłyszany, lament, płacz i wielkie zawodzenie: Rachel opłakuje swoje dzieci; i nie chce dać się pocieszyć, bo już ich nie ma."
"Mt2,19": "A gdy umarł Herod, oto anioł PANA ukazał się we śnie Józefowi w Egipcie, mówiąc:"
"Mt2,20": "Wstań, weź dziecię oraz Jego matkę i idź do ziemi Izraela. Umarli bowiem ci, którzy szukali życia tego dziecięcia."
"Mt2,21": "Wstał więc, wziął dziecię oraz Jego matkę i przyszedł do ziemi Izraela."
"Mt2,22": "Ale gdy usłyszał, że Archelaus króluje nad Judeą w miejsce Heroda, swojego ojca, bał się tam wrócić; ale ostrzeżony przez Boga we śnie, oddalił się w strony Galilei."
"Mt2,23": "A gdy przyszedł, zamieszkał w mieście, które jest nazywane Nazaret, aby wypełniło się to, co powiedziano przez proroków: Zostanie nazwany Nazarejczykiem."
