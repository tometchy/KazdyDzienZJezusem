"Mt9,1": "A gdy wstąpił do łodzi, przeprawił się na drugi brzeg i przyszedł do swojego miasta."
"Mt9,2": "I oto przynieśli do Niego sparaliżowanego, leżącego na posłaniu. A Jezus, widząc ich wiarę, powiedział do sparaliżowanego: Ufaj, dziecko! Odpuszczone są ci twoje grzechy."
"Mt9,3": "A oto niektórzy z uczonych w Piśmie mówili w sobie: On bluźni."
"Mt9,4": "A Jezus, znając ich myśli, powiedział: Dlaczego rozmyślacie o złych rzeczach w swoich sercach?"
"Mt9,5": "Albowiem co jest łatwiej powiedzieć: Odpuszczone są ci twoje grzechy, czy powiedzieć: Wstań i chodź?"
"Mt9,6": "Ale abyście wiedzieli, że Syn Człowieczy ma władzę na ziemi odpuszczać grzechy; wtedy powiedział do sparaliżowanego: Powstań, weź swoje posłanie i idź do swojego domu."
"Mt9,7": "I gdy powstał, poszedł do swojego domu."
"Mt9,8": "Gdy tłum to ujrzał, dziwił się i chwalił Boga, który dał taką władzę ludziom."
"Mt9,9": "A Jezus, odchodząc stamtąd, ujrzał człowieka siedzącego przy stole celnym, zwanego Mateuszem, i mówi do niego: Pójdź za mną; a on wstał i poszedł za Nim."
"Mt9,10": "I stało się, gdy Jezus spoczywał u stołu w jego domu, że oto wielu celników i grzeszników przyszło, i spoczęło przy stole z Jezusem i z Jego uczniami."
"Mt9,11": "Widząc to, faryzeusze powiedzieli Jego uczniom: Dlaczego wasz nauczyciel je z celnikami i grzesznikami?"
"Mt9,12": "A gdy Jezus to usłyszał, powiedział im: Nie potrzebują zdrowi lekarza, ale ci, co mają się źle."
"Mt9,13": "Idźcie więc i nauczcie się, co to znaczy: Miłosierdzia chcę, a nie ofiary. Bo nie przyszedłem wzywać do upamiętania sprawiedliwych, ale grzeszników."
"Mt9,14": "Wtedy podeszli do Niego uczniowie Jana, mówiąc: Dlaczego my i faryzeusze często pościmy, a Twoi uczniowie nie poszczą?"
"Mt9,15": "I Jezus powiedział im: Czy mogą przyjaciele domu weselnego smucić się, dopóki jest z nimi oblubieniec? Ale przyjdą dni, gdy będzie zabrany od nich oblubieniec, i wtedy będą pościć."
"Mt9,16": "A nikt nie nakłada łaty z surowego sukna w starą szatę; albowiem to wypełnienie zrywa brzegi szaty i rozdarcie staje się gorsze."
"Mt9,17": "I nie leją młodego wina w stare bukłaki; bo inaczej pękają bukłaki, i wino wycieka, a bukłaki się niszczą; ale młode wino leją w nowe bukłaki, a wtedy oba są zachowane."
"Mt9,18": "Gdy to do nich mówił, oto przyszedł przełożony synagogi i oddał Mu pokłon, mówiąc: Córka moja właśnie umarła, ale przyjdź i połóż na nią swoją rękę, a ożyje."
"Mt9,19": "I wstał Jezus, i poszedł za nim wraz ze swoimi uczniami."
"Mt9,20": "I oto kobieta, która krwawiła od dwunastu lat, podeszła z tyłu i dotknęła się skraju Jego szaty."
"Mt9,21": "Mówiła bowiem w sobie: Jeśli tylko dotknę Jego szaty, będę uzdrowiona."
"Mt9,22": "Ale Jezus odwrócił się, ujrzał ją i powiedział: Ufaj, córko! Twoja wiara cię uzdrowiła; i kobieta została uzdrowiona w tej godzinie."
"Mt9,23": "A gdy Jezus przyszedł do domu przełożonego synagogi, ujrzał flecistów i tłum czyniący zgiełk;"
"Mt9,24": "Mówi im: Wycofajcie się, bo dziewczynka nie umarła, ale śpi. I szydzili z Niego."
"Mt9,25": "Ale gdy wyrzucono tłum, wszedł, ujął ją za rękę, i dziewczynka wstała."
"Mt9,26": "I rozeszła się wieść o tym po całej tamtejszej ziemi."
"Mt9,27": "I gdy Jezus odchodził stamtąd, szli za Nim dwaj ślepi, wołając i mówiąc: Synu Dawida! Zmiłuj się nad nami!"
"Mt9,28": "A gdy wszedł do domu, przyszli do Niego owi ślepi, i Jezus mówi im: Czy wierzycie, że mogę to uczynić? Mówią do Niego: Tak, Panie!"
"Mt9,29": "Wtedy dotknął ich oczu, mówiąc: Zgodnie z waszą wiarą niech się wam stanie."
"Mt9,30": "I otworzyły się ich oczy; a Jezus nakazał im surowo, mówiąc: Uważajcie, niech nikt o tym nie wie."
"Mt9,31": "Lecz oni wyszli i rozgłosili o Nim po całej tamtejszej ziemi."
"Mt9,32": "A gdy oni wychodzili, oto przyprowadzono do Niego człowieka niemego, który był opętany przez demona."
"Mt9,33": "Po wypędzeniu demona, niemy przemówił; i dziwiły się tłumy, mówiąc: Nigdy nic takiego nie pojawiło się w Izraelu."
"Mt9,34": "Lecz faryzeusze mówili: Przez władcę demonów wygania demony."
"Mt9,35": "I obchodził Jezus wszystkie miasta i wioski, nauczając w ich synagogach i głosząc Ewangelię o Królestwie, uzdrawiając każdą chorobę i każdą słabość wśród ludu."
"Mt9,36": "A widząc tłumy, ulitował się nad nimi, gdyż byli wyczerpani i porzuceni jak owce, niemające pasterza."
"Mt9,37": "Wtedy powiedział swoim uczniom: Żniwo wprawdzie jest wielkie, ale robotników mało."
"Mt9,38": "Proście więc Pana żniwa, aby wypchnął robotników na swoje żniwo."
