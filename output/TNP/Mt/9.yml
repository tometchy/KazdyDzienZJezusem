"Mt9,1":
  text: "A gdy wstąpił do łodzi, przeprawił się na drugi brzeg i przyszedł do swojego miasta."
  tags: []
"Mt9,2":
  text: "I oto przynieśli do Niego sparaliżowanego, leżącego na posłaniu. A Jezus, widząc ich wiarę, powiedział do sparaliżowanego: Ufaj, dziecko! Odpuszczone są ci twoje grzechy."
  tags: []
"Mt9,3":
  text: "A oto niektórzy z uczonych w Piśmie mówili w sobie: On bluźni."
  tags: []
"Mt9,4":
  text: "A Jezus, znając ich myśli, powiedział: Dlaczego rozmyślacie o złych rzeczach w swoich sercach?"
  tags: []
"Mt9,5":
  text: "Albowiem co jest łatwiej powiedzieć: Odpuszczone są ci twoje grzechy, czy powiedzieć: Wstań i chodź?"
  tags: []
"Mt9,6":
  text: "Ale abyście wiedzieli, że Syn Człowieczy ma władzę na ziemi odpuszczać grzechy; wtedy powiedział do sparaliżowanego: Powstań, weź swoje posłanie i idź do swojego domu."
  tags: []
"Mt9,7":
  text: "I gdy powstał, poszedł do swojego domu."
  tags: []
"Mt9,8":
  text: "Gdy tłum to ujrzał, dziwił się i chwalił Boga, który dał taką władzę ludziom."
  tags: []
"Mt9,9":
  text: "A Jezus, odchodząc stamtąd, ujrzał człowieka siedzącego przy stole celnym, zwanego Mateuszem, i mówi do niego: Pójdź za mną; a on wstał i poszedł za Nim."
  tags: []
"Mt9,10":
  text: "I stało się, gdy Jezus spoczywał u stołu w jego domu, że oto wielu celników i grzeszników przyszło, i spoczęło przy stole z Jezusem i z Jego uczniami."
  tags: []
"Mt9,11":
  text: "Widząc to, faryzeusze powiedzieli Jego uczniom: Dlaczego wasz nauczyciel je z celnikami i grzesznikami?"
  tags: []
"Mt9,12":
  text: "A gdy Jezus to usłyszał, powiedział im: Nie potrzebują zdrowi lekarza, ale ci, co mają się źle."
  tags: []
"Mt9,13":
  text: "Idźcie więc i nauczcie się, co to znaczy: Miłosierdzia chcę, a nie ofiary. Bo nie przyszedłem wzywać do upamiętania sprawiedliwych, ale grzeszników."
  tags: []
"Mt9,14":
  text: "Wtedy podeszli do Niego uczniowie Jana, mówiąc: Dlaczego my i faryzeusze często pościmy, a Twoi uczniowie nie poszczą?"
  tags: []
"Mt9,15":
  text: "I Jezus powiedział im: Czy mogą przyjaciele domu weselnego smucić się, dopóki jest z nimi oblubieniec? Ale przyjdą dni, gdy będzie zabrany od nich oblubieniec, i wtedy będą pościć."
  tags: []
"Mt9,16":
  text: "A nikt nie nakłada łaty z surowego sukna w starą szatę; albowiem to wypełnienie zrywa brzegi szaty i rozdarcie staje się gorsze."
  tags: []
"Mt9,17":
  text: "I nie leją młodego wina w stare bukłaki; bo inaczej pękają bukłaki, i wino wycieka, a bukłaki się niszczą; ale młode wino leją w nowe bukłaki, a wtedy oba są zachowane."
  tags: []
"Mt9,18":
  text: "Gdy to do nich mówił, oto przyszedł przełożony synagogi i oddał Mu pokłon, mówiąc: Córka moja właśnie umarła, ale przyjdź i połóż na nią swoją rękę, a ożyje."
  tags: []
"Mt9,19":
  text: "I wstał Jezus, i poszedł za nim wraz ze swoimi uczniami."
  tags: []
"Mt9,20":
  text: "I oto kobieta, która krwawiła od dwunastu lat, podeszła z tyłu i dotknęła się skraju Jego szaty."
  tags: []
"Mt9,21":
  text: "Mówiła bowiem w sobie: Jeśli tylko dotknę Jego szaty, będę uzdrowiona."
  tags: []
"Mt9,22":
  text: "Ale Jezus odwrócił się, ujrzał ją i powiedział: Ufaj, córko! Twoja wiara cię uzdrowiła; i kobieta została uzdrowiona w tej godzinie."
  tags: []
"Mt9,23":
  text: "A gdy Jezus przyszedł do domu przełożonego synagogi, ujrzał flecistów i tłum czyniący zgiełk;"
  tags: []
"Mt9,24":
  text: "Mówi im: Wycofajcie się, bo dziewczynka nie umarła, ale śpi. I szydzili z Niego."
  tags: []
"Mt9,25":
  text: "Ale gdy wyrzucono tłum, wszedł, ujął ją za rękę, i dziewczynka wstała."
  tags: []
"Mt9,26":
  text: "I rozeszła się wieść o tym po całej tamtejszej ziemi."
  tags: []
"Mt9,27":
  text: "I gdy Jezus odchodził stamtąd, szli za Nim dwaj ślepi, wołając i mówiąc: Synu Dawida! Zmiłuj się nad nami!"
  tags: []
"Mt9,28":
  text: "A gdy wszedł do domu, przyszli do Niego owi ślepi, i Jezus mówi im: Czy wierzycie, że mogę to uczynić? Mówią do Niego: Tak, Panie!"
  tags: []
"Mt9,29":
  text: "Wtedy dotknął ich oczu, mówiąc: Zgodnie z waszą wiarą niech się wam stanie."
  tags: []
"Mt9,30":
  text: "I otworzyły się ich oczy; a Jezus nakazał im surowo, mówiąc: Uważajcie, niech nikt o tym nie wie."
  tags: []
"Mt9,31":
  text: "Lecz oni wyszli i rozgłosili o Nim po całej tamtejszej ziemi."
  tags: []
"Mt9,32":
  text: "A gdy oni wychodzili, oto przyprowadzono do Niego człowieka niemego, który był opętany przez demona."
  tags: []
"Mt9,33":
  text: "Po wypędzeniu demona, niemy przemówił; i dziwiły się tłumy, mówiąc: Nigdy nic takiego nie pojawiło się w Izraelu."
  tags: []
"Mt9,34":
  text: "Lecz faryzeusze mówili: Przez władcę demonów wygania demony."
  tags: []
"Mt9,35":
  text: "I obchodził Jezus wszystkie miasta i wioski, nauczając w ich synagogach i głosząc Ewangelię o Królestwie, uzdrawiając każdą chorobę i każdą słabość wśród ludu."
  tags: []
"Mt9,36":
  text: "A widząc tłumy, ulitował się nad nimi, gdyż byli wyczerpani i porzuceni jak owce, niemające pasterza."
  tags: []
"Mt9,37":
  text: "Wtedy powiedział swoim uczniom: Żniwo wprawdzie jest wielkie, ale robotników mało."
  tags: []
"Mt9,38":
  text: "Proście więc Pana żniwa, aby wypchnął robotników na swoje żniwo."
  tags: []
