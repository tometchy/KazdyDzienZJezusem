"Mt15,1":
  text: "Wtedy podeszli do Jezusa uczeni w Piśmie i faryzeusze z Jerozolimy, mówiąc:"
  tags: []
"Mt15,2":
  text: "Dlaczego Twoi uczniowie przekraczają tradycję starszych? Nie myją bowiem swoich rąk, kiedy jedzą chleb."
  tags: []
"Mt15,3":
  text: "A On w odpowiedzi, rzekł im: Dlaczego i wy przekraczacie przykazanie Boże z powodu swojej tradycji?"
  tags: []
"Mt15,4":
  text: "Albowiem Bóg przykazał, mówiąc: Czcij ojca swojego i matkę; oraz: Kto złorzeczy ojcu albo matce, niech poniesie śmierć."
  tags: []
"Mt15,5":
  text: "Ale wy mówicie: Kto powiedziałby ojcu albo matce: Darem ofiarnym jest to, co ode mnie miałoby was wspomóc; ten nie potrzebuje czcić swojego ojca lub swojej matki."
  tags: []
"Mt15,6":
  text: "I tak unieważniliście przykazanie Boże z powodu swojej tradycji."
  tags: []
"Mt15,7":
  text: "Obłudnicy! Dobrze prorokował o was Izajasz, mówiąc:"
  tags: []
"Mt15,8":
  text: "Ten lud zbliża się do mnie swoimi ustami, i czci mnie swoimi wargami; ale serce ich jest bardzo daleko ode mnie."
  tags: []
"Mt15,9":
  text: "Lecz na próżno mnie czczą, ucząc nauk, które są przykazaniami ludzi."
  tags: []
"Mt15,10":
  text: "I przywołał do siebie tłum, i powiedział im: Słuchajcie i zrozumiejcie."
  tags: []
"Mt15,11":
  text: "Nie to, co wchodzi do ust, kala człowieka; ale to, co wychodzi z ust, to kala człowieka."
  tags: []
"Mt15,12":
  text: "Wtedy podeszli Jego uczniowie i powiedzieli do Niego: Wiesz, że faryzeusze, słysząc to słowo, zostali zgorszeni?"
  tags: []
"Mt15,13":
  text: "A On w odpowiedzi, rzekł im: Każdy krzew, którego nie sadził Ojciec mój niebiański, zostanie wykorzeniony."
  tags: []
"Mt15,14":
  text: "Zostawcie ich! Oni są ślepymi przewodnikami ślepych, a jeśli ślepy prowadzi ślepego, obaj wpadną w dół."
  tags: []
"Mt15,15":
  text: "A Piotr w odpowiedzi, rzekł do Niego: Wyjaśnij nam dokładnie to podobieństwo."
  tags: []
"Mt15,16":
  text: "A Jezus powiedział: Wy nadal nie jesteście w stanie zrozumieć?"
  tags: []
"Mt15,17":
  text: "Czy jeszcze nie rozumiecie, że wszystko, co wchodzi do ust, idzie do żołądka i zostaje wydalane do ustępu?"
  tags: []
"Mt15,18":
  text: "Ale to, co wychodzi z ust, to pochodzi z serca, i to kala człowieka."
  tags: []
"Mt15,19":
  text: "Z serca bowiem pochodzą złe zamysły, morderstwa, cudzołóstwa, nierząd, kradzieże, fałszywe świadectwa, bluźnierstwa."
  tags: []
"Mt15,20":
  text: "To jest to, co kala człowieka; natomiast jedzenie nieumytymi rękoma nie kala człowieka."
  tags: []
"Mt15,21":
  text: "I Jezus wyszedł stamtąd, i odszedł w strony Tyru i Sydonu."
  tags: []
"Mt15,22":
  text: "A oto kobieta kananejska z tamtego regionu wyszła i głośno wołała do Niego, mówiąc: Zmiłuj się nade mną, Panie, Synu Dawida! Moja córka ma się źle, jest opętana przez demona."
  tags: []
"Mt15,23":
  text: "A On nie odpowiedział jej ani słowa. I podeszli Jego uczniowie, prosząc Go i mówiąc: Odpraw ją, bo głośno woła za nami."
  tags: []
"Mt15,24":
  text: "A On w odpowiedzi, rzekł: Nie zostałem do niej posłany, tylko do owiec, które są zgubione z domu Izraela."
  tags: []
"Mt15,25":
  text: "Lecz ona podeszła i oddała Mu pokłon, mówiąc: Panie, pomóż mi!"
  tags: []
"Mt15,26":
  text: "A On w odpowiedzi, rzekł: Nie jest dobrze brać chleb dzieci i rzucać szczeniętom."
  tags: []
"Mt15,27":
  text: "Ona natomiast powiedziała: Tak, Panie! Ale i szczenięta jedzą z okruszyn, które spadają ze stołu ich panów."
  tags: []
"Mt15,28":
  text: "Wtedy Jezus w odpowiedzi, rzekł jej: O kobieto! Wielka jest twoja wiara! Niech ci się stanie, jak chcesz. I uzdrowiona została jej córka od tej godziny."
  tags: []
"Mt15,29":
  text: "A Jezus poszedł stamtąd i przyszedł nad Morze Galilejskie, i wstąpił na górę, i tam usiadł."
  tags: []
"Mt15,30":
  text: "I przyszły do Niego wielkie tłumy, mając ze sobą chromych, ślepych, niemych, kalekich i wielu innych, i kładli ich u stóp Jezusa; a On ich uzdrowił;"
  tags: []
"Mt15,31":
  text: "Tak że tłum zdumiał się, widząc, że niemi mówią, kalecy są uzdrowieni, chromi chodzą, a ślepi widzą; i oddawali chwałę Bogu Izraela."
  tags: []
"Mt15,32":
  text: "A Jezus wezwał swoich uczniów i powiedział: Żal mi tego tłumu, ponieważ już trzy dni pozostają przy mnie i nie mają co jeść, a nie chcę ich rozpuścić głodnych, aby czasem nie zasłabli w drodze."
  tags: []
"Mt15,33":
  text: "I powiedzieli do Niego Jego uczniowie: Skąd weźmiemy tyle chleba na tej pustyni, aby nasycić tak wielki tłum?"
  tags: []
"Mt15,34":
  text: "A Jezus mówi im: Ile macie chlebów? A oni powiedzieli: Siedem i trochę rybek."
  tags: []
"Mt15,35":
  text: "I kazał tłumowi spocząć na ziemi."
  tags: []
"Mt15,36":
  text: "I wziął te siedem chlebów i ryby, złożył dziękczynienie, połamał i dał swoim uczniom, natomiast uczniowie tłumowi."
  tags: []
"Mt15,37":
  text: "I zjedli wszyscy, i zostali nasyceni, i zebrali to, co zbywało z kawałków, siedem pełnych koszy."
  tags: []
"Mt15,38":
  text: "Tych natomiast, którzy jedli, było cztery tysiące mężczyzn, bez kobiet i dzieci."
  tags: []
"Mt15,39":
  text: "I gdy rozpuścił tłumy, wszedł do łodzi i przybył w granice Magdali."
  tags: []
