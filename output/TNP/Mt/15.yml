"Mt15,1": "Wtedy podeszli do Jezusa uczeni w Piśmie i faryzeusze z Jerozolimy, mówiąc:"
"Mt15,2": "Dlaczego Twoi uczniowie przekraczają tradycję starszych? Nie myją bowiem swoich rąk, kiedy jedzą chleb."
"Mt15,3": "A On w odpowiedzi, rzekł im: Dlaczego i wy przekraczacie przykazanie Boże z powodu swojej tradycji?"
"Mt15,4": "Albowiem Bóg przykazał, mówiąc: Czcij ojca swojego i matkę; oraz: Kto złorzeczy ojcu albo matce, niech poniesie śmierć."
"Mt15,5": "Ale wy mówicie: Kto powiedziałby ojcu albo matce: Darem ofiarnym jest to, co ode mnie miałoby was wspomóc; ten nie potrzebuje czcić swojego ojca lub swojej matki."
"Mt15,6": "I tak unieważniliście przykazanie Boże z powodu swojej tradycji."
"Mt15,7": "Obłudnicy! Dobrze prorokował o was Izajasz, mówiąc:"
"Mt15,8": "Ten lud zbliża się do mnie swoimi ustami, i czci mnie swoimi wargami; ale serce ich jest bardzo daleko ode mnie."
"Mt15,9": "Lecz na próżno mnie czczą, ucząc nauk, które są przykazaniami ludzi."
"Mt15,10": "I przywołał do siebie tłum, i powiedział im: Słuchajcie i zrozumiejcie."
"Mt15,11": "Nie to, co wchodzi do ust, kala człowieka; ale to, co wychodzi z ust, to kala człowieka."
"Mt15,12": "Wtedy podeszli Jego uczniowie i powiedzieli do Niego: Wiesz, że faryzeusze, słysząc to słowo, zostali zgorszeni?"
"Mt15,13": "A On w odpowiedzi, rzekł im: Każdy krzew, którego nie sadził Ojciec mój niebiański, zostanie wykorzeniony."
"Mt15,14": "Zostawcie ich! Oni są ślepymi przewodnikami ślepych, a jeśli ślepy prowadzi ślepego, obaj wpadną w dół."
"Mt15,15": "A Piotr w odpowiedzi, rzekł do Niego: Wyjaśnij nam dokładnie to podobieństwo."
"Mt15,16": "A Jezus powiedział: Wy nadal nie jesteście w stanie zrozumieć?"
"Mt15,17": "Czy jeszcze nie rozumiecie, że wszystko, co wchodzi do ust, idzie do żołądka i zostaje wydalane do ustępu?"
"Mt15,18": "Ale to, co wychodzi z ust, to pochodzi z serca, i to kala człowieka."
"Mt15,19": "Z serca bowiem pochodzą złe zamysły, morderstwa, cudzołóstwa, nierząd, kradzieże, fałszywe świadectwa, bluźnierstwa."
"Mt15,20": "To jest to, co kala człowieka; natomiast jedzenie nieumytymi rękoma nie kala człowieka."
"Mt15,21": "I Jezus wyszedł stamtąd, i odszedł w strony Tyru i Sydonu."
"Mt15,22": "A oto kobieta kananejska z tamtego regionu wyszła i głośno wołała do Niego, mówiąc: Zmiłuj się nade mną, Panie, Synu Dawida! Moja córka ma się źle, jest opętana przez demona."
"Mt15,23": "A On nie odpowiedział jej ani słowa. I podeszli Jego uczniowie, prosząc Go i mówiąc: Odpraw ją, bo głośno woła za nami."
"Mt15,24": "A On w odpowiedzi, rzekł: Nie zostałem do niej posłany, tylko do owiec, które są zgubione z domu Izraela."
"Mt15,25": "Lecz ona podeszła i oddała Mu pokłon, mówiąc: Panie, pomóż mi!"
"Mt15,26": "A On w odpowiedzi, rzekł: Nie jest dobrze brać chleb dzieci i rzucać szczeniętom."
"Mt15,27": "Ona natomiast powiedziała: Tak, Panie! Ale i szczenięta jedzą z okruszyn, które spadają ze stołu ich panów."
"Mt15,28": "Wtedy Jezus w odpowiedzi, rzekł jej: O kobieto! Wielka jest twoja wiara! Niech ci się stanie, jak chcesz. I uzdrowiona została jej córka od tej godziny."
"Mt15,29": "A Jezus poszedł stamtąd i przyszedł nad Morze Galilejskie, i wstąpił na górę, i tam usiadł."
"Mt15,30": "I przyszły do Niego wielkie tłumy, mając ze sobą chromych, ślepych, niemych, kalekich i wielu innych, i kładli ich u stóp Jezusa; a On ich uzdrowił;"
"Mt15,31": "Tak że tłum zdumiał się, widząc, że niemi mówią, kalecy są uzdrowieni, chromi chodzą, a ślepi widzą; i oddawali chwałę Bogu Izraela."
"Mt15,32": "A Jezus wezwał swoich uczniów i powiedział: Żal mi tego tłumu, ponieważ już trzy dni pozostają przy mnie i nie mają co jeść, a nie chcę ich rozpuścić głodnych, aby czasem nie zasłabli w drodze."
"Mt15,33": "I powiedzieli do Niego Jego uczniowie: Skąd weźmiemy tyle chleba na tej pustyni, aby nasycić tak wielki tłum?"
"Mt15,34": "A Jezus mówi im: Ile macie chlebów? A oni powiedzieli: Siedem i trochę rybek."
"Mt15,35": "I kazał tłumowi spocząć na ziemi."
"Mt15,36": "I wziął te siedem chlebów i ryby, złożył dziękczynienie, połamał i dał swoim uczniom, natomiast uczniowie tłumowi."
"Mt15,37": "I zjedli wszyscy, i zostali nasyceni, i zebrali to, co zbywało z kawałków, siedem pełnych koszy."
"Mt15,38": "Tych natomiast, którzy jedli, było cztery tysiące mężczyzn, bez kobiet i dzieci."
"Mt15,39": "I gdy rozpuścił tłumy, wszedł do łodzi i przybył w granice Magdali."
