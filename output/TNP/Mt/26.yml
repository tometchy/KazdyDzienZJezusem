"Mt26,1": "I stało się, gdy Jezus skończył wszystkie te mowy, że powiedział do swoich uczniów:"
"Mt26,2": "Wiecie, że za dwa dni jest Pascha, i Syn Człowieczy zostanie wydany na ukrzyżowanie."
"Mt26,3": "Wówczas zebrali się arcykapłani i uczeni w Piśmie, i starsi ludu na dziedzińcu arcykapłana, którego zwano Kajfasz,"
"Mt26,4": "I zaplanowali, aby Jezusa pochwycić podstępem i uśmiercić;"
"Mt26,5": "Lecz mówili: Nie w święto, aby nie powstały rozruchy między ludem."
"Mt26,6": "A gdy Jezus był w Betanii, w domu Szymona trędowatego,"
"Mt26,7": "Przystąpiła do Niego kobieta, mająca alabastrowy flakonik olejku bardzo kosztownego i wylała go na Jego głowę, gdy spoczywał u stołu."
"Mt26,8": "Co widząc uczniowie Jego, oburzyli się, mówiąc: Po co ta strata?"
"Mt26,9": "Albowiem można było ten olejek za dużą sumę sprzedać i rozdać ubogim."
"Mt26,10": "Gdy Jezus to dostrzegł, powiedział im: Dlaczego przysparzacie tej kobiecie trudu? Dobry bowiem czyn spełniła wobec mnie."
"Mt26,11": "Ubogich bowiem zawsze macie u siebie, jednak mnie nie zawsze macie."
"Mt26,12": "Bo ona, wylewając ten olejek na moje ciało, uczyniła to na mój pogrzeb."
"Mt26,13": "Zaprawdę mówię wam: Gdziekolwiek będzie głoszona ta Ewangelia po całym świecie i to, co ona uczyniła, będzie opowiadane na jej pamiątkę."
"Mt26,14": "Wtedy poszedł jeden z dwunastu, zwany Judasz Iskariota do arcykapłanów,"
"Mt26,15": "I powiedział im: Co mi chcecie dać, a ja wam Go wydam? Oni więc wyznaczyli mu trzydzieści srebrników."
"Mt26,16": "I odtąd szukał dogodnej chwili, aby Go wydać."
"Mt26,17": "A pierwszego dnia Przaśników przystąpili uczniowie do Jezusa, mówiąc Mu: Gdzie chcesz, abyśmy przygotowali Ci Paschę do spożycia?"
"Mt26,18": "A On powiedział: Idźcie do miasta, do tego a tego człowieka, i powiedzcie mu: Nauczyciel mówi: Mój czas jest bliski, u ciebie urządzę Paschę ze swoimi uczniami."
"Mt26,19": "I zrobili uczniowie jak im rozkazał Jezus, i przygotowali Paschę."
"Mt26,20": "A gdy nastał wieczór, spoczął wspólnie z dwunastoma u stołu."
"Mt26,21": "A gdy jedli, powiedział: Zaprawdę mówię wam, że jeden z was mnie wyda."
"Mt26,22": "I zasmucili się bardzo, i każdy z nich zaczął mówić do Niego: Czy to nie jestem ja, Panie?"
"Mt26,23": "A On w odpowiedzi, rzekł: Ten, który zanurzył ze mną rękę w misie, ten mnie wyda."
"Mt26,24": "Wprawdzie Syn Człowieczy odchodzi, tak jak jest napisane o Nim, ale biada temu człowiekowi, przez którego Syn Człowieczy będzie wydany! Lepiej by mu było, gdyby się ten człowiek nie narodził."
"Mt26,25": "A w odpowiedzi Judasz, który Go wydał, rzekł: Czy to nie jestem ja, Rabbi? Odpowiedział mu: Ty to powiedziałeś."
"Mt26,26": "A gdy oni jedli, Jezus wziął chleb i pobłogosławił, łamał i dawał uczniom, mówiąc: Bierzcie, zjedzcie, to jest moje ciało."
"Mt26,27": "I wziął kielich, i podziękował, dał im, mówiąc: Wypijcie z niego wszyscy;"
"Mt26,28": "To bowiem jest krew moja Nowego Przymierza, która jest za wielu wylewana, na odpuszczenie grzechów."
"Mt26,29": "Ale mówię wam, że odtąd nie będę pił z tego plonu winnej latorośli, aż do tego dnia, gdy go będę pił z wami nowy, w Królestwie Ojca mojego."
"Mt26,30": "A gdy odśpiewali hymn, wyszli na Górę Oliwną."
"Mt26,31": "Wtedy Jezus powiedział im: Wy wszyscy zgorszycie się ze mnie tej nocy; bo jest napisane: Uderzę pasterza i zostaną rozproszone owce stada."
"Mt26,32": "A po wzbudzeniu mnie, wyprzedzę was idąc do Galilei."
"Mt26,33": "A Piotr w odpowiedzi, rzekł do Niego: Choćby wszyscy zgorszyli się Tobą, ja nigdy nie zostanę Tobą zgorszony."
"Mt26,34": "Jezus mu powiedział: Zaprawdę mówię ci, że tej nocy, zanim zapieje kogut, trzykrotnie się mnie wyprzesz."
"Mt26,35": "Piotr mówi Mu: Nawet jeśli trzeba by było umrzeć z Tobą, na pewno nie wyprę się Ciebie. Podobnie powiedzieli i wszyscy uczniowie."
"Mt26,36": "Wtedy Jezus przyszedł z nimi na miejsce, które zwano Getsemane, i powiedział uczniom: Usiądźcie tu, podczas gdy ja odejdę, aby tam się modlić."
"Mt26,37": "A gdy wziął ze sobą Piotra i dwóch synów Zebedeusza, zaczął się smucić i trwożyć."
"Mt26,38": "Wtedy Jezus powiedział im: Zasmucona jest moja dusza aż do śmierci; zostańcie tu i czuwajcie ze mną."
"Mt26,39": "I odszedł trochę dalej, upadł na swoje oblicze, modląc się i mówiąc: Ojcze mój, jeśli jest to możliwe, niech ominie mnie ten kielich; jednak nie jak ja chcę, ale jak Ty."
"Mt26,40": "I przyszedł do uczniów, i znalazł ich śpiących, i powiedział Piotrowi: Cóż to, nie mieliście siły czuwać ze mną jednej godziny?"
"Mt26,41": "Czuwajcie i módlcie się, abyście nie weszli w pokuszenie; duch wprawdzie jest ochoczy, ale ciało słabe."
"Mt26,42": "Znów po raz drugi odszedł i modlił się, mówiąc: Ojcze mój, jeśli nie może minąć mnie ten kielich, tak abym go nie wypił, niech się stanie wola Twoja."
"Mt26,43": "I gdy przyszedł, znalazł ich ponownie śpiących; albowiem oczy ich były obciążone."
"Mt26,44": "A gdy ich opuścił, ponownie odszedł i modlił się po raz trzeci, wypowiadając te same słowa."
"Mt26,45": "Wtedy przyszedł do swoich uczniów i powiedział im: Jeszcze śpicie i odpoczywacie? Oto przybliżyła się godzina, i Syn Człowieczy wydany zostaje w ręce grzeszników."
"Mt26,46": "Wstańcie, pójdźmy! Oto zbliżył się ten, który mnie wydaje."
"Mt26,47": "I gdy On jeszcze to mówił, oto przyszedł Judasz, jeden z dwunastu, a z nim liczny tłum z mieczami i z kijami od arcykapłanów i od starszych ludu."
"Mt26,48": "Ale ten, który Go wydawał, dał im znak, mówiąc: Ten, którego pocałuję, to jest On; schwytajcie Go."
"Mt26,49": "I zaraz zbliżył się do Jezusa, i powiedział: Witaj, Rabbi! I pocałował Go czule."
"Mt26,50": "Ale Jezus mu powiedział: Przyjacielu! Po co przyszedłeś? Wtedy przystąpili i podnieśli ręce na Jezusa, i Go pojmali."
"Mt26,51": "I oto jeden z tych, którzy byli z Jezusem, wyciągnął rękę i wydobył swój miecz, i uderzył sługę arcykapłana, i odciął mu ucho."
"Mt26,52": "Wtedy Jezus powiedział mu: Schowaj swój miecz z powrotem gdzie jego miejsce; bo wszyscy, którzy biorą miecz, od miecza zginą."
"Mt26,53": "Czy wydaje ci się, że nie mogę prosić Ojca mojego, i już teraz postawiłby przy mnie więcej niż dwanaście legionów aniołów?"
"Mt26,54": "Jak więc wypełniłyby się Pisma, że tak się musi stać?"
"Mt26,55": "W tej godzinie mówił Jezus do tłumu: Jak na zbójcę wyszliście z mieczami i z kijami, aby mnie pojmać; co dzień siadałem pośród was, nauczając w świątyni, a nie pojmaliście mnie."
"Mt26,56": "Ale to wszystko stało się, aby zostały wypełnione Pisma Proroków. Wtedy wszyscy Jego uczniowie opuścili Go i uciekli."
"Mt26,57": "A ci, którzy pojmali Jezusa, przyprowadzili Go do arcykapłana Kajfasza, gdzie zostali zebrani uczeni w Piśmie i starsi."
"Mt26,58": "A Piotr podążył za Nim z daleka aż do dziedzińca arcykapłana; i wszedł tam do wewnątrz, i siedział ze sługami, aby zobaczyć koniec."
"Mt26,59": "A arcykapłani i starsi, i cały Sanhedryn szukali fałszywego świadectwa przeciwko Jezusowi, aby Go uśmiercić,"
"Mt26,60": "I nie znaleźli; a chociaż przychodziło wielu fałszywych świadków, to jednak nie znaleźli. A na końcu podeszli dwaj fałszywi świadkowie,"
"Mt26,61": "I powiedzieli: Ten mówił: Mogę rozwalić świątynię Boga i w trzy dni ją zbudować."
"Mt26,62": "A gdy powstał arcykapłan, powiedział Mu: Nic nie odpowiadasz na to, co świadczą przeciwko Tobie?"
"Mt26,63": "Lecz Jezus milczał. A w odpowiedzi, arcykapłan rzekł do Niego: Poprzysięgam Cię na Boga żywego, abyś nam powiedział, czy Ty jesteś Mesjasz, Syn Boga?"
"Mt26,64": "Mówi mu Jezus: Ty to powiedziałeś. Ponadto mówię wam: Już teraz zobaczycie Syna Człowieczego siedzącego po prawej stronie mocy Bożej i przychodzącego na obłokach nieba."
"Mt26,65": "Wtedy arcykapłan rozdarł swoje szaty, mówiąc: Zbluźnił! Czy potrzebujemy jeszcze świadków?! Oto teraz słyszeliście Jego bluźnierstwo."
"Mt26,66": "Jak wam się zdaje? A oni w odpowiedzi, rzekli: Winny jest śmierci."
"Mt26,67": "Wtedy pluli Mu w twarz i bili Go pięściami w twarz, a inni Go uderzali,"
"Mt26,68": "Mówiąc: Prorokuj nam, Mesjaszu! Kim jest ten, który Ciebie uderzył?"
"Mt26,69": "A Piotr siedział na zewnątrz na dziedzińcu. I zbliżyła się do niego jedna służąca, mówiąc: I ty byłeś z Jezusem Galilejczykiem."
"Mt26,70": "A on wyparł się przed wszystkimi, mówiąc: Nie wiem, o czym mówisz."
"Mt26,71": "A gdy on wyszedł ku bramie, ujrzała go inna i powiedziała do tych, którzy tam byli: I ten był z Jezusem Nazarejczykiem."
"Mt26,72": "I ponownie wyparł się pod przysięgą: Nie znam tego człowieka."
"Mt26,73": "A po chwili zbliżyli się inni przystając, i powiedzieli Piotrowi: Prawdziwie i ty jesteś jednym z nich; bo i mowa twoja ciebie zdradza."
"Mt26,74": "Wtedy zaczął ściągać klątwę na siebie i przysięgać: Nie znam tego człowieka; i zaraz zapiał kogut."
"Mt26,75": "I przypomniały się Piotrowi słowa wypowiedziane do niego przez Jezusa: Zanim zapieje kogut, trzykrotnie się mnie wyprzesz. I wyszedł na zewnątrz, i gorzko zapłakał."
