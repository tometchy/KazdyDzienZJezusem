"Mt26,1":
  text: "I stało się, gdy Jezus skończył wszystkie te mowy, że powiedział do swoich uczniów:"
  tags: []
"Mt26,2":
  text: "Wiecie, że za dwa dni jest Pascha, i Syn Człowieczy zostanie wydany na ukrzyżowanie."
  tags: []
"Mt26,3":
  text: "Wówczas zebrali się arcykapłani i uczeni w Piśmie, i starsi ludu na dziedzińcu arcykapłana, którego zwano Kajfasz,"
  tags: []
"Mt26,4":
  text: "I zaplanowali, aby Jezusa pochwycić podstępem i uśmiercić;"
  tags: []
"Mt26,5":
  text: "Lecz mówili: Nie w święto, aby nie powstały rozruchy między ludem."
  tags: []
"Mt26,6":
  text: "A gdy Jezus był w Betanii, w domu Szymona trędowatego,"
  tags: []
"Mt26,7":
  text: "Przystąpiła do Niego kobieta, mająca alabastrowy flakonik olejku bardzo kosztownego i wylała go na Jego głowę, gdy spoczywał u stołu."
  tags: []
"Mt26,8":
  text: "Co widząc uczniowie Jego, oburzyli się, mówiąc: Po co ta strata?"
  tags: []
"Mt26,9":
  text: "Albowiem można było ten olejek za dużą sumę sprzedać i rozdać ubogim."
  tags: []
"Mt26,10":
  text: "Gdy Jezus to dostrzegł, powiedział im: Dlaczego przysparzacie tej kobiecie trudu? Dobry bowiem czyn spełniła wobec mnie."
  tags: []
"Mt26,11":
  text: "Ubogich bowiem zawsze macie u siebie, jednak mnie nie zawsze macie."
  tags: []
"Mt26,12":
  text: "Bo ona, wylewając ten olejek na moje ciało, uczyniła to na mój pogrzeb."
  tags: []
"Mt26,13":
  text: "Zaprawdę mówię wam: Gdziekolwiek będzie głoszona ta Ewangelia po całym świecie i to, co ona uczyniła, będzie opowiadane na jej pamiątkę."
  tags: []
"Mt26,14":
  text: "Wtedy poszedł jeden z dwunastu, zwany Judasz Iskariota do arcykapłanów,"
  tags: []
"Mt26,15":
  text: "I powiedział im: Co mi chcecie dać, a ja wam Go wydam? Oni więc wyznaczyli mu trzydzieści srebrników."
  tags: []
"Mt26,16":
  text: "I odtąd szukał dogodnej chwili, aby Go wydać."
  tags: []
"Mt26,17":
  text: "A pierwszego dnia Przaśników przystąpili uczniowie do Jezusa, mówiąc Mu: Gdzie chcesz, abyśmy przygotowali Ci Paschę do spożycia?"
  tags: []
"Mt26,18":
  text: "A On powiedział: Idźcie do miasta, do tego a tego człowieka, i powiedzcie mu: Nauczyciel mówi: Mój czas jest bliski, u ciebie urządzę Paschę ze swoimi uczniami."
  tags: []
"Mt26,19":
  text: "I zrobili uczniowie jak im rozkazał Jezus, i przygotowali Paschę."
  tags: []
"Mt26,20":
  text: "A gdy nastał wieczór, spoczął wspólnie z dwunastoma u stołu."
  tags: []
"Mt26,21":
  text: "A gdy jedli, powiedział: Zaprawdę mówię wam, że jeden z was mnie wyda."
  tags: []
"Mt26,22":
  text: "I zasmucili się bardzo, i każdy z nich zaczął mówić do Niego: Czy to nie jestem ja, Panie?"
  tags: []
"Mt26,23":
  text: "A On w odpowiedzi, rzekł: Ten, który zanurzył ze mną rękę w misie, ten mnie wyda."
  tags: []
"Mt26,24":
  text: "Wprawdzie Syn Człowieczy odchodzi, tak jak jest napisane o Nim, ale biada temu człowiekowi, przez którego Syn Człowieczy będzie wydany! Lepiej by mu było, gdyby się ten człowiek nie narodził."
  tags: []
"Mt26,25":
  text: "A w odpowiedzi Judasz, który Go wydał, rzekł: Czy to nie jestem ja, Rabbi? Odpowiedział mu: Ty to powiedziałeś."
  tags: []
"Mt26,26":
  text: "A gdy oni jedli, Jezus wziął chleb i pobłogosławił, łamał i dawał uczniom, mówiąc: Bierzcie, zjedzcie, to jest moje ciało."
  tags: []
"Mt26,27":
  text: "I wziął kielich, i podziękował, dał im, mówiąc: Wypijcie z niego wszyscy;"
  tags: []
"Mt26,28":
  text: "To bowiem jest krew moja Nowego Przymierza, która jest za wielu wylewana, na odpuszczenie grzechów."
  tags: []
"Mt26,29":
  text: "Ale mówię wam, że odtąd nie będę pił z tego plonu winnej latorośli, aż do tego dnia, gdy go będę pił z wami nowy, w Królestwie Ojca mojego."
  tags: []
"Mt26,30":
  text: "A gdy odśpiewali hymn, wyszli na Górę Oliwną."
  tags: []
"Mt26,31":
  text: "Wtedy Jezus powiedział im: Wy wszyscy zgorszycie się ze mnie tej nocy; bo jest napisane: Uderzę pasterza i zostaną rozproszone owce stada."
  tags: []
"Mt26,32":
  text: "A po wzbudzeniu mnie, wyprzedzę was idąc do Galilei."
  tags: []
"Mt26,33":
  text: "A Piotr w odpowiedzi, rzekł do Niego: Choćby wszyscy zgorszyli się Tobą, ja nigdy nie zostanę Tobą zgorszony."
  tags: []
"Mt26,34":
  text: "Jezus mu powiedział: Zaprawdę mówię ci, że tej nocy, zanim zapieje kogut, trzykrotnie się mnie wyprzesz."
  tags: []
"Mt26,35":
  text: "Piotr mówi Mu: Nawet jeśli trzeba by było umrzeć z Tobą, na pewno nie wyprę się Ciebie. Podobnie powiedzieli i wszyscy uczniowie."
  tags: []
"Mt26,36":
  text: "Wtedy Jezus przyszedł z nimi na miejsce, które zwano Getsemane, i powiedział uczniom: Usiądźcie tu, podczas gdy ja odejdę, aby tam się modlić."
  tags: []
"Mt26,37":
  text: "A gdy wziął ze sobą Piotra i dwóch synów Zebedeusza, zaczął się smucić i trwożyć."
  tags: []
"Mt26,38":
  text: "Wtedy Jezus powiedział im: Zasmucona jest moja dusza aż do śmierci; zostańcie tu i czuwajcie ze mną."
  tags: []
"Mt26,39":
  text: "I odszedł trochę dalej, upadł na swoje oblicze, modląc się i mówiąc: Ojcze mój, jeśli jest to możliwe, niech ominie mnie ten kielich; jednak nie jak ja chcę, ale jak Ty."
  tags: []
"Mt26,40":
  text: "I przyszedł do uczniów, i znalazł ich śpiących, i powiedział Piotrowi: Cóż to, nie mieliście siły czuwać ze mną jednej godziny?"
  tags: []
"Mt26,41":
  text: "Czuwajcie i módlcie się, abyście nie weszli w pokuszenie; duch wprawdzie jest ochoczy, ale ciało słabe."
  tags: []
"Mt26,42":
  text: "Znów po raz drugi odszedł i modlił się, mówiąc: Ojcze mój, jeśli nie może minąć mnie ten kielich, tak abym go nie wypił, niech się stanie wola Twoja."
  tags: []
"Mt26,43":
  text: "I gdy przyszedł, znalazł ich ponownie śpiących; albowiem oczy ich były obciążone."
  tags: []
"Mt26,44":
  text: "A gdy ich opuścił, ponownie odszedł i modlił się po raz trzeci, wypowiadając te same słowa."
  tags: []
"Mt26,45":
  text: "Wtedy przyszedł do swoich uczniów i powiedział im: Jeszcze śpicie i odpoczywacie? Oto przybliżyła się godzina, i Syn Człowieczy wydany zostaje w ręce grzeszników."
  tags: []
"Mt26,46":
  text: "Wstańcie, pójdźmy! Oto zbliżył się ten, który mnie wydaje."
  tags: []
"Mt26,47":
  text: "I gdy On jeszcze to mówił, oto przyszedł Judasz, jeden z dwunastu, a z nim liczny tłum z mieczami i z kijami od arcykapłanów i od starszych ludu."
  tags: []
"Mt26,48":
  text: "Ale ten, który Go wydawał, dał im znak, mówiąc: Ten, którego pocałuję, to jest On; schwytajcie Go."
  tags: []
"Mt26,49":
  text: "I zaraz zbliżył się do Jezusa, i powiedział: Witaj, Rabbi! I pocałował Go czule."
  tags: []
"Mt26,50":
  text: "Ale Jezus mu powiedział: Przyjacielu! Po co przyszedłeś? Wtedy przystąpili i podnieśli ręce na Jezusa, i Go pojmali."
  tags: []
"Mt26,51":
  text: "I oto jeden z tych, którzy byli z Jezusem, wyciągnął rękę i wydobył swój miecz, i uderzył sługę arcykapłana, i odciął mu ucho."
  tags: []
"Mt26,52":
  text: "Wtedy Jezus powiedział mu: Schowaj swój miecz z powrotem gdzie jego miejsce; bo wszyscy, którzy biorą miecz, od miecza zginą."
  tags: []
"Mt26,53":
  text: "Czy wydaje ci się, że nie mogę prosić Ojca mojego, i już teraz postawiłby przy mnie więcej niż dwanaście legionów aniołów?"
  tags: []
"Mt26,54":
  text: "Jak więc wypełniłyby się Pisma, że tak się musi stać?"
  tags: []
"Mt26,55":
  text: "W tej godzinie mówił Jezus do tłumu: Jak na zbójcę wyszliście z mieczami i z kijami, aby mnie pojmać; co dzień siadałem pośród was, nauczając w świątyni, a nie pojmaliście mnie."
  tags: []
"Mt26,56":
  text: "Ale to wszystko stało się, aby zostały wypełnione Pisma Proroków. Wtedy wszyscy Jego uczniowie opuścili Go i uciekli."
  tags: []
"Mt26,57":
  text: "A ci, którzy pojmali Jezusa, przyprowadzili Go do arcykapłana Kajfasza, gdzie zostali zebrani uczeni w Piśmie i starsi."
  tags: []
"Mt26,58":
  text: "A Piotr podążył za Nim z daleka aż do dziedzińca arcykapłana; i wszedł tam do wewnątrz, i siedział ze sługami, aby zobaczyć koniec."
  tags: []
"Mt26,59":
  text: "A arcykapłani i starsi, i cały Sanhedryn szukali fałszywego świadectwa przeciwko Jezusowi, aby Go uśmiercić,"
  tags: []
"Mt26,60":
  text: "I nie znaleźli; a chociaż przychodziło wielu fałszywych świadków, to jednak nie znaleźli. A na końcu podeszli dwaj fałszywi świadkowie,"
  tags: []
"Mt26,61":
  text: "I powiedzieli: Ten mówił: Mogę rozwalić świątynię Boga i w trzy dni ją zbudować."
  tags: []
"Mt26,62":
  text: "A gdy powstał arcykapłan, powiedział Mu: Nic nie odpowiadasz na to, co świadczą przeciwko Tobie?"
  tags: []
"Mt26,63":
  text: "Lecz Jezus milczał. A w odpowiedzi, arcykapłan rzekł do Niego: Poprzysięgam Cię na Boga żywego, abyś nam powiedział, czy Ty jesteś Mesjasz, Syn Boga?"
  tags: []
"Mt26,64":
  text: "Mówi mu Jezus: Ty to powiedziałeś. Ponadto mówię wam: Już teraz zobaczycie Syna Człowieczego siedzącego po prawej stronie mocy Bożej i przychodzącego na obłokach nieba."
  tags: []
"Mt26,65":
  text: "Wtedy arcykapłan rozdarł swoje szaty, mówiąc: Zbluźnił! Czy potrzebujemy jeszcze świadków?! Oto teraz słyszeliście Jego bluźnierstwo."
  tags: []
"Mt26,66":
  text: "Jak wam się zdaje? A oni w odpowiedzi, rzekli: Winny jest śmierci."
  tags: []
"Mt26,67":
  text: "Wtedy pluli Mu w twarz i bili Go pięściami w twarz, a inni Go uderzali,"
  tags: []
"Mt26,68":
  text: "Mówiąc: Prorokuj nam, Mesjaszu! Kim jest ten, który Ciebie uderzył?"
  tags: []
"Mt26,69":
  text: "A Piotr siedział na zewnątrz na dziedzińcu. I zbliżyła się do niego jedna służąca, mówiąc: I ty byłeś z Jezusem Galilejczykiem."
  tags: []
"Mt26,70":
  text: "A on wyparł się przed wszystkimi, mówiąc: Nie wiem, o czym mówisz."
  tags: []
"Mt26,71":
  text: "A gdy on wyszedł ku bramie, ujrzała go inna i powiedziała do tych, którzy tam byli: I ten był z Jezusem Nazarejczykiem."
  tags: []
"Mt26,72":
  text: "I ponownie wyparł się pod przysięgą: Nie znam tego człowieka."
  tags: []
"Mt26,73":
  text: "A po chwili zbliżyli się inni przystając, i powiedzieli Piotrowi: Prawdziwie i ty jesteś jednym z nich; bo i mowa twoja ciebie zdradza."
  tags: []
"Mt26,74":
  text: "Wtedy zaczął ściągać klątwę na siebie i przysięgać: Nie znam tego człowieka; i zaraz zapiał kogut."
  tags: []
"Mt26,75":
  text: "I przypomniały się Piotrowi słowa wypowiedziane do niego przez Jezusa: Zanim zapieje kogut, trzykrotnie się mnie wyprzesz. I wyszedł na zewnątrz, i gorzko zapłakał."
  tags: []
