"Mt7,1": "Nie sądźcie, abyście nie zostali osądzeni."
"Mt7,2": "Albowiem jakim sądem sądzicie, takim zostaniecie osądzeni, i jaką miarą mierzycie, taką wam w zamian odmierzą."
"Mt7,3": "A czemu widzisz drzazgę w oku swojego brata, a nie dostrzegasz belki w swoim oku?"
"Mt7,4": "Albo jak możesz powiedzieć swojemu bratu: Pozwól, że wyrwę drzazgę z twojego oka, a oto belka jest w twoim oku?"
"Mt7,5": "Obłudniku! Wyrwij wpierw belkę ze swojego oka, a wtedy przejrzysz, by wyrwać drzazgę z oka swojego brata."
"Mt7,6": "Nie dawajcie psom tego, co jest święte, i nie rzucajcie swoich pereł przed świnie, aby ich czasem nie podeptały swoimi nogami, a następnie nie obróciły się i was nie rozszarpały."
"Mt7,7": "Proście, a zostanie wam dane; szukajcie, a znajdziecie; pukajcie, a zostanie wam otworzone."
"Mt7,8": "Bo każdy, kto prosi, otrzymuje; a kto szuka, znajduje; a temu, kto puka, zostanie otworzone."
"Mt7,9": "Albo kto z was jest takim człowiekiem, który, gdy syn prosiłby o chleb, to poda mu kamień?"
"Mt7,10": "Albo kiedy prosiłby o rybę, to poda mu węża?"
"Mt7,11": "Jeśli więc wy, będąc złymi, wiecie jak dawać dobre dary waszym dzieciom, o ile bardziej Ojciec wasz, który jest w niebiosach, da to, co dobre tym, którzy Go proszą."
"Mt7,12": "Wszystko więc, cokolwiek byście chcieli, aby wam ludzie czynili, to i wy im czyńcie; takie jest bowiem Prawo i Prorocy."
"Mt7,13": "Wchodźcie przez ciasną bramę. Albowiem szeroka jest brama i przestronna droga, która prowadzi do zguby, i wielu jest takich, którzy przez nią wchodzą."
"Mt7,14": "Gdyż ciasna jest brama i wąska droga, która prowadzi do życia, a mało jest takich, którzy ją znajdują."
"Mt7,15": "Zważcie na fałszywych proroków, którzy przychodzą do was w owczej skórze, ale wewnątrz są drapieżnymi wilkami."
"Mt7,16": "Po ich owocach poznacie ich. Czy zbierają winogrona z cierni albo figi z ostu?"
"Mt7,17": "Tak każde dobre drzewo przynosi dobre owoce, ale zgniłe drzewo przynosi złe owoce."
"Mt7,18": "Nie może dobre drzewo przynosić złych owoców, ani zgniłe drzewo przynosić dobrych owoców."
"Mt7,19": "Każde drzewo, które nie przynosi dobrego owocu, jest wycinane i wrzucone w ogień."
"Mt7,20": "Zatem prawdziwie po ich owocach poznacie ich."
"Mt7,21": "Nie każdy, kto do mnie mówi: Panie, Panie, wejdzie do Królestwa Niebios, lecz ten, kto czyni wolę Ojca mojego, który jest w niebiosach."
"Mt7,22": "Wielu powie mi tego dnia: Panie, Panie, czy w Twoim imieniu nie prorokowaliśmy i w Twoim imieniu nie wypędzaliśmy demonów, i w Twoim imieniu nie czyniliśmy wielu dzieł mocy?"
"Mt7,23": "A wtedy wyznam im: Ponieważ nigdy was nie poznałem, odejdźcie ode mnie wy, którzy czynicie bezprawie."
"Mt7,24": "Każdy więc, kto słucha tych moich słów i czyni je, będzie podobny do męża rozsądnego, który zbudował swój dom na skale;"
"Mt7,25": "I spadł gwałtowny deszcz, i wezbrały rzeki, i zawiały wiatry, i uderzyły w ten dom, i nie runął, bo miał założony fundament na skale."
"Mt7,26": "A każdy, kto słucha tych moich słów, a nie czyni ich, będzie podobny do męża głupiego, który zbudował swój dom na piasku."
"Mt7,27": "I spadł gwałtowny deszcz, i wezbrały rzeki, i zawiały wiatry, i uderzyły w ten dom, i runął, a upadek jego był wielki."
"Mt7,28": "I stało się, gdy Jezus dokończył te słowa, że tłumy zdumiewały się nad Jego nauką."
"Mt7,29": "Uczył ich bowiem jak ten, który ma władzę, a nie jak ich uczeni w Piśmie."
