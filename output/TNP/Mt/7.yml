"Mt7,1":
  text: "Nie sądźcie, abyście nie zostali osądzeni."
  tags: []
"Mt7,2":
  text: "Albowiem jakim sądem sądzicie, takim zostaniecie osądzeni, i jaką miarą mierzycie, taką wam w zamian odmierzą."
  tags: []
"Mt7,3":
  text: "A czemu widzisz drzazgę w oku swojego brata, a nie dostrzegasz belki w swoim oku?"
  tags: []
"Mt7,4":
  text: "Albo jak możesz powiedzieć swojemu bratu: Pozwól, że wyrwę drzazgę z twojego oka, a oto belka jest w twoim oku?"
  tags: []
"Mt7,5":
  text: "Obłudniku! Wyrwij wpierw belkę ze swojego oka, a wtedy przejrzysz, by wyrwać drzazgę z oka swojego brata."
  tags: []
"Mt7,6":
  text: "Nie dawajcie psom tego, co jest święte, i nie rzucajcie swoich pereł przed świnie, aby ich czasem nie podeptały swoimi nogami, a następnie nie obróciły się i was nie rozszarpały."
  tags: []
"Mt7,7":
  text: "Proście, a zostanie wam dane; szukajcie, a znajdziecie; pukajcie, a zostanie wam otworzone."
  tags: []
"Mt7,8":
  text: "Bo każdy, kto prosi, otrzymuje; a kto szuka, znajduje; a temu, kto puka, zostanie otworzone."
  tags: []
"Mt7,9":
  text: "Albo kto z was jest takim człowiekiem, który, gdy syn prosiłby o chleb, to poda mu kamień?"
  tags: []
"Mt7,10":
  text: "Albo kiedy prosiłby o rybę, to poda mu węża?"
  tags: []
"Mt7,11":
  text: "Jeśli więc wy, będąc złymi, wiecie jak dawać dobre dary waszym dzieciom, o ile bardziej Ojciec wasz, który jest w niebiosach, da to, co dobre tym, którzy Go proszą."
  tags: []
"Mt7,12":
  text: "Wszystko więc, cokolwiek byście chcieli, aby wam ludzie czynili, to i wy im czyńcie; takie jest bowiem Prawo i Prorocy."
  tags: []
"Mt7,13":
  text: "Wchodźcie przez ciasną bramę. Albowiem szeroka jest brama i przestronna droga, która prowadzi do zguby, i wielu jest takich, którzy przez nią wchodzą."
  tags: []
"Mt7,14":
  text: "Gdyż ciasna jest brama i wąska droga, która prowadzi do życia, a mało jest takich, którzy ją znajdują."
  tags: []
"Mt7,15":
  text: "Zważcie na fałszywych proroków, którzy przychodzą do was w owczej skórze, ale wewnątrz są drapieżnymi wilkami."
  tags: []
"Mt7,16":
  text: "Po ich owocach poznacie ich. Czy zbierają winogrona z cierni albo figi z ostu?"
  tags: []
"Mt7,17":
  text: "Tak każde dobre drzewo przynosi dobre owoce, ale zgniłe drzewo przynosi złe owoce."
  tags: []
"Mt7,18":
  text: "Nie może dobre drzewo przynosić złych owoców, ani zgniłe drzewo przynosić dobrych owoców."
  tags: []
"Mt7,19":
  text: "Każde drzewo, które nie przynosi dobrego owocu, jest wycinane i wrzucone w ogień."
  tags: []
"Mt7,20":
  text: "Zatem prawdziwie po ich owocach poznacie ich."
  tags: []
"Mt7,21":
  text: "Nie każdy, kto do mnie mówi: Panie, Panie, wejdzie do Królestwa Niebios, lecz ten, kto czyni wolę Ojca mojego, który jest w niebiosach."
  tags: []
"Mt7,22":
  text: "Wielu powie mi tego dnia: Panie, Panie, czy w Twoim imieniu nie prorokowaliśmy i w Twoim imieniu nie wypędzaliśmy demonów, i w Twoim imieniu nie czyniliśmy wielu dzieł mocy?"
  tags: []
"Mt7,23":
  text: "A wtedy wyznam im: Ponieważ nigdy was nie poznałem, odejdźcie ode mnie wy, którzy czynicie bezprawie."
  tags: []
"Mt7,24":
  text: "Każdy więc, kto słucha tych moich słów i czyni je, będzie podobny do męża rozsądnego, który zbudował swój dom na skale;"
  tags: []
"Mt7,25":
  text: "I spadł gwałtowny deszcz, i wezbrały rzeki, i zawiały wiatry, i uderzyły w ten dom, i nie runął, bo miał założony fundament na skale."
  tags: []
"Mt7,26":
  text: "A każdy, kto słucha tych moich słów, a nie czyni ich, będzie podobny do męża głupiego, który zbudował swój dom na piasku."
  tags: []
"Mt7,27":
  text: "I spadł gwałtowny deszcz, i wezbrały rzeki, i zawiały wiatry, i uderzyły w ten dom, i runął, a upadek jego był wielki."
  tags: []
"Mt7,28":
  text: "I stało się, gdy Jezus dokończył te słowa, że tłumy zdumiewały się nad Jego nauką."
  tags: []
"Mt7,29":
  text: "Uczył ich bowiem jak ten, który ma władzę, a nie jak ich uczeni w Piśmie."
  tags: []
