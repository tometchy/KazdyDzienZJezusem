"Mt20,1":
  text: "Albowiem podobne jest Królestwo Niebios do pewnego człowieka, gospodarza, który wczesnym rankiem wyszedł wynająć robotników do swojej winnicy."
  tags: []
"Mt20,2":
  text: "A zgodził się z robotnikami po denarze za dzień pracy i posłał ich do swojej winnicy."
  tags: []
"Mt20,3":
  text: "I gdy wyszedł około trzeciej godziny, ujrzał innych, którzy stali na rynku bezczynnie,"
  tags: []
"Mt20,4":
  text: "I powiedział im: Idźcie i wy do winnicy, a sprawiedliwie dam wam, co należy."
  tags: []
"Mt20,5":
  text: "I oni poszli. Ponownie wyszedł około szóstej i dziewiątej godziny, i uczynił tak samo."
  tags: []
"Mt20,6":
  text: "A gdy wyszedł około jedenastej godziny, znalazł innych, którzy stali bezczynnie i powiedział im: Dlaczego tu cały dzień staliście bezczynnie?"
  tags: []
"Mt20,7":
  text: "Mówią mu: Bo nas nikt nie wynajął. Powiedział im: Idźcie i wy do winnicy, a co będzie sprawiedliwe otrzymacie."
  tags: []
"Mt20,8":
  text: "A gdy nastał wieczór, powiedział pan winnicy swojemu zarządcy: Zawołaj robotników i daj im zapłatę, zaczynając od ostatnich, aż do pierwszych."
  tags: []
"Mt20,9":
  text: "I gdy przyszli ci, którzy około jedenastej godziny zostali wynajęci, otrzymali po denarze."
  tags: []
"Mt20,10":
  text: "Gdy natomiast przyszli pierwsi, sądzili, że więcej otrzymają; ale i oni otrzymali po denarze."
  tags: []
"Mt20,11":
  text: "A gdy wzięli, zaczęli szemrać przeciwko gospodarzowi,"
  tags: []
"Mt20,12":
  text: "Mówiąc: Ci ostatni pracowali jedną godzinę, a zrównałeś ich z nami, którzy znosiliśmy ciężar dnia i upał."
  tags: []
"Mt20,13":
  text: "A on odpowiedział, jednemu z nich mówiąc: Przyjacielu! Nie czynię ci krzywdy; czyż nie zgodziłeś się ze mną na denara?"
  tags: []
"Mt20,14":
  text: "Zabierz co twoje i odejdź; chcę bowiem temu ostatniemu dać, jak i tobie."
  tags: []
"Mt20,15":
  text: "Albo czy nie wolno mi czynić z tym, co moje, tego, co chcę? Czy oko twoje jest złe, że ja jestem dobry?"
  tags: []
"Mt20,16":
  text: "Tak będą ostatni pierwszymi, a pierwsi ostatnimi; albowiem wielu jest wezwanych, ale mało wybranych."
  tags: []
"Mt20,17":
  text: "A Jezus, zmierzając do Jerozolimy, wziął dwunastu uczniów i w drodze na osobności powiedział im:"
  tags: []
"Mt20,18":
  text: "Oto zmierzamy do Jerozolimy, a Syn Człowieczy zostanie wydany arcykapłanom i uczonym w Piśmie, i skażą Go na śmierć,"
  tags: []
"Mt20,19":
  text: "I wydadzą Go poganom na pośmiewisko, i na ubiczowanie, i na ukrzyżowanie; a trzeciego dnia będzie wzbudzony z martwych."
  tags: []
"Mt20,20":
  text: "Wtedy zbliżyła się do Niego matka synów Zebedeusza ze swoimi synami, oddając Mu pokłon i prosząc Go o coś."
  tags: []
"Mt20,21":
  text: "A On jej powiedział: Co chcesz? Mówi do Niego: Powiedz, aby ci dwaj moi synowie zasiedli, jeden z Twojej prawej strony, a drugi z lewej strony w Królestwie Twoim."
  tags: []
"Mt20,22":
  text: "Ale Jezus w odpowiedzi, rzekł: Nie wiecie, o co prosicie; czy możecie pić kielich, który ja mam pić? I chrztem, którym ja jestem chrzczony, być ochrzczeni? Powiedzieli do Niego: Możemy."
  tags: []
"Mt20,23":
  text: "I powiedział im: Kielich mój istotnie wypijecie, i chrztem, którym ja jestem chrzczony, będziecie ochrzczeni; ale zasiąść z prawej mojej strony i z lewej mojej strony, nie moja to rzecz dać wam, ale dano to tym, którym jest to przygotowane przez Ojca mojego."
  tags: []
"Mt20,24":
  text: "A gdy to usłyszało pozostałych dziesięciu, oburzyli się na dwóch braci."
  tags: []
"Mt20,25":
  text: "Ale Jezus przywołał ich i powiedział: Wiecie, że przywódcy narodów panują nad nimi, a wielcy dają odczuć swoją władzę nad nimi."
  tags: []
"Mt20,26":
  text: "Lecz nie tak będzie u was; ale jeśli ktoś chciałby stać się wielkim wśród was, niech jest waszym sługą."
  tags: []
"Mt20,27":
  text: "A jeśli ktoś wśród was chciałby być pierwszym, niech jest waszym niewolnikiem."
  tags: []
"Mt20,28":
  text: "Podobnie Syn Człowieczy nie przyszedł, aby Mu służono, ale aby służyć, i aby dał życie swoje na okup za wielu."
  tags: []
"Mt20,29":
  text: "A gdy wychodzili z Jerycha, szedł za Nim wielki tłum."
  tags: []
"Mt20,30":
  text: "I oto dwaj ślepi, siedzący przy drodze, słysząc, że Jezus przechodził, krzyczeli, wołając: Zmiłuj się nad nami, Panie, Synu Dawida!"
  tags: []
"Mt20,31":
  text: "A tłum skarcił ich, aby milczeli; lecz oni tym bardziej krzyczeli, mówiąc: Zmiłuj się nad nami, Panie, Synu Dawida!"
  tags: []
"Mt20,32":
  text: "I Jezus stanął, przywołał ich, i powiedział: Co chcecie, abym wam uczynił?"
  tags: []
"Mt20,33":
  text: "Mówią do Niego: Panie! Aby nasze oczy zostały otworzone."
  tags: []
"Mt20,34":
  text: "A Jezus zlitował się i dotknął ich oczu, i zaraz odzyskali wzrok; i podążali za Nim."
  tags: []
