"Mt20,1": "Albowiem podobne jest Królestwo Niebios do pewnego człowieka, gospodarza, który wczesnym rankiem wyszedł wynająć robotników do swojej winnicy."
"Mt20,2": "A zgodził się z robotnikami po denarze za dzień pracy i posłał ich do swojej winnicy."
"Mt20,3": "I gdy wyszedł około trzeciej godziny, ujrzał innych, którzy stali na rynku bezczynnie,"
"Mt20,4": "I powiedział im: Idźcie i wy do winnicy, a sprawiedliwie dam wam, co należy."
"Mt20,5": "I oni poszli. Ponownie wyszedł około szóstej i dziewiątej godziny, i uczynił tak samo."
"Mt20,6": "A gdy wyszedł około jedenastej godziny, znalazł innych, którzy stali bezczynnie i powiedział im: Dlaczego tu cały dzień staliście bezczynnie?"
"Mt20,7": "Mówią mu: Bo nas nikt nie wynajął. Powiedział im: Idźcie i wy do winnicy, a co będzie sprawiedliwe otrzymacie."
"Mt20,8": "A gdy nastał wieczór, powiedział pan winnicy swojemu zarządcy: Zawołaj robotników i daj im zapłatę, zaczynając od ostatnich, aż do pierwszych."
"Mt20,9": "I gdy przyszli ci, którzy około jedenastej godziny zostali wynajęci, otrzymali po denarze."
"Mt20,10": "Gdy natomiast przyszli pierwsi, sądzili, że więcej otrzymają; ale i oni otrzymali po denarze."
"Mt20,11": "A gdy wzięli, zaczęli szemrać przeciwko gospodarzowi,"
"Mt20,12": "Mówiąc: Ci ostatni pracowali jedną godzinę, a zrównałeś ich z nami, którzy znosiliśmy ciężar dnia i upał."
"Mt20,13": "A on odpowiedział, jednemu z nich mówiąc: Przyjacielu! Nie czynię ci krzywdy; czyż nie zgodziłeś się ze mną na denara?"
"Mt20,14": "Zabierz co twoje i odejdź; chcę bowiem temu ostatniemu dać, jak i tobie."
"Mt20,15": "Albo czy nie wolno mi czynić z tym, co moje, tego, co chcę? Czy oko twoje jest złe, że ja jestem dobry?"
"Mt20,16": "Tak będą ostatni pierwszymi, a pierwsi ostatnimi; albowiem wielu jest wezwanych, ale mało wybranych."
"Mt20,17": "A Jezus, zmierzając do Jerozolimy, wziął dwunastu uczniów i w drodze na osobności powiedział im:"
"Mt20,18": "Oto zmierzamy do Jerozolimy, a Syn Człowieczy zostanie wydany arcykapłanom i uczonym w Piśmie, i skażą Go na śmierć,"
"Mt20,19": "I wydadzą Go poganom na pośmiewisko, i na ubiczowanie, i na ukrzyżowanie; a trzeciego dnia będzie wzbudzony z martwych."
"Mt20,20": "Wtedy zbliżyła się do Niego matka synów Zebedeusza ze swoimi synami, oddając Mu pokłon i prosząc Go o coś."
"Mt20,21": "A On jej powiedział: Co chcesz? Mówi do Niego: Powiedz, aby ci dwaj moi synowie zasiedli, jeden z Twojej prawej strony, a drugi z lewej strony w Królestwie Twoim."
"Mt20,22": "Ale Jezus w odpowiedzi, rzekł: Nie wiecie, o co prosicie; czy możecie pić kielich, który ja mam pić? I chrztem, którym ja jestem chrzczony, być ochrzczeni? Powiedzieli do Niego: Możemy."
"Mt20,23": "I powiedział im: Kielich mój istotnie wypijecie, i chrztem, którym ja jestem chrzczony, będziecie ochrzczeni; ale zasiąść z prawej mojej strony i z lewej mojej strony, nie moja to rzecz dać wam, ale dano to tym, którym jest to przygotowane przez Ojca mojego."
"Mt20,24": "A gdy to usłyszało pozostałych dziesięciu, oburzyli się na dwóch braci."
"Mt20,25": "Ale Jezus przywołał ich i powiedział: Wiecie, że przywódcy narodów panują nad nimi, a wielcy dają odczuć swoją władzę nad nimi."
"Mt20,26": "Lecz nie tak będzie u was; ale jeśli ktoś chciałby stać się wielkim wśród was, niech jest waszym sługą."
"Mt20,27": "A jeśli ktoś wśród was chciałby być pierwszym, niech jest waszym niewolnikiem."
"Mt20,28": "Podobnie Syn Człowieczy nie przyszedł, aby Mu służono, ale aby służyć, i aby dał życie swoje na okup za wielu."
"Mt20,29": "A gdy wychodzili z Jerycha, szedł za Nim wielki tłum."
"Mt20,30": "I oto dwaj ślepi, siedzący przy drodze, słysząc, że Jezus przechodził, krzyczeli, wołając: Zmiłuj się nad nami, Panie, Synu Dawida!"
"Mt20,31": "A tłum skarcił ich, aby milczeli; lecz oni tym bardziej krzyczeli, mówiąc: Zmiłuj się nad nami, Panie, Synu Dawida!"
"Mt20,32": "I Jezus stanął, przywołał ich, i powiedział: Co chcecie, abym wam uczynił?"
"Mt20,33": "Mówią do Niego: Panie! Aby nasze oczy zostały otworzone."
"Mt20,34": "A Jezus zlitował się i dotknął ich oczu, i zaraz odzyskali wzrok; i podążali za Nim."
