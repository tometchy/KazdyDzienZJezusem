"Mt6,1": "Uważajcie, abyście swojego daru miłosierdzia nie czynili przed ludźmi, po to, by być widzianymi przez nich, inaczej nie macie zapłaty u Ojca waszego, który jest w niebiosach."
"Mt6,2": "Dlatego, gdy dajesz dar miłosierdzia, nie trąb przed sobą, tak jak czynią to obłudnicy w synagogach i na ulicach, aby przez ludzi została oddana im chwała. Zaprawdę mówię wam: Już w całości otrzymują swoją zapłatę."
"Mt6,3": "Ale ty, gdy dajesz dar miłosierdzia, niech nie wie twoja lewa ręka, co czyni twoja prawa ręka,"
"Mt6,4": "By twój dar miłosierdzia pozostał w ukryciu, a twój Ojciec, który widzi w ukryciu, On ci odda jawnie."
"Mt6,5": "A gdy się modlisz, nie bądź jak obłudnicy; gdyż oni lubią stać i modlić się w synagogach i na rogach placów, aby ludzie ich widzieli. Zaprawdę mówię wam, że już w całości otrzymują swoją zapłatę."
"Mt6,6": "Ale ty, gdy się modlisz, wejdź do swojej komórki i zamknij swoje drzwi, módl się do Ojca twojego, który jest w ukryciu; a Ojciec twój, który widzi w ukryciu, odda ci jawnie."
"Mt6,7": "Modląc się natomiast, nie paplajcie jak poganie; albowiem wydaje im się, że w swojej wielomówności zostaną wysłuchani."
"Mt6,8": "Nie bądźcie do nich podobni, gdyż Ojciec wasz wie, czego potrzebujecie, zanim Go poprosicie."
"Mt6,9": "Wy więc módlcie się tak: Ojcze nasz, który jesteś w niebiosach! Niech Twoje imię zostanie uświęcone."
"Mt6,10": "Niech przyjdzie Twoje Królestwo; niech się stanie Twoja wola jak w niebie, tak i na ziemi."
"Mt6,11": "Chleba naszego codziennego daj nam dzisiaj."
"Mt6,12": "I odpuść nam nasze winy, jak i my odpuszczamy tym, którzy są wobec nas winni."
"Mt6,13": "I nie wprowadź nas w pokusę, ale uratuj nas od złego; gdyż Twoje jest Królestwo i moc, i chwała na wieki. Amen."
"Mt6,14": "Bo jeśli odpuścicie ludziom ich upadki, i wam odpuści Ojciec wasz niebiański."
"Mt6,15": "Ale jeśli nie odpuścicie ludziom ich upadków, także Ojciec wasz nie odpuści wam waszych upadków."
"Mt6,16": "A gdy pościcie, nie stawajcie się smutni tak jak obłudnicy; wykrzywiają bowiem swoje twarze, aby ludzie widzieli, że poszczą. Zaprawdę mówię wam: Już otrzymują całą swoją zapłatę."
"Mt6,17": "Ale ty, gdy pościsz, namaść swoją głowę i umyj swoją twarz;"
"Mt6,18": "Abyś nie był widziany przez ludzi, że pościsz, ale przez Ojca twojego, który jest w ukryciu; a Ojciec twój, który widzi w ukryciu, odda ci jawnie."
"Mt6,19": "Nie gromadźcie sobie skarbów na ziemi, gdzie mól i rdza niszczą, i gdzie złodzieje przekopują ściany i kradną;"
"Mt6,20": "Ale gromadźcie sobie skarby w niebie, gdzie ani mól, ani rdza nie niszczy, i gdzie złodzieje nie przekopują ścian i nie kradną."
"Mt6,21": "Albowiem gdzie jest wasz skarb, tam będzie i wasze serce."
"Mt6,22": "Lampą ciała jest oko. Jeśli więc twoje oko jest prosto patrzące, całe twoje ciało będzie jasne."
"Mt6,23": "Jeśli natomiast twoje oko jest złe, całe twoje ciało będzie ciemne. Jeśli więc światłość, która jest w tobie, jest ciemnością, sama ciemność jakąż wielką będzie?"
"Mt6,24": "Nikt nie może dwom panom służyć, jednego bowiem znienawidzi, a drugiego będzie miłował; albo do jednego przylgnie, a drugim pogardzi. Nie możecie służyć Bogu i mamonie."
"Mt6,25": "Dlatego mówię wam: Nie martwcie się o swoje życie, co będziecie jedli, albo co będziecie pili; ani o swoje ciało, w co będziecie się ubierać. Czyż życie nie jest czymś więcej niż pokarm, a ciało niż ubranie?"
"Mt6,26": "Przypatrzcie się ptakom na niebie, że nie sieją, ani nie żną, ani nie zbierają do spichlerzy, a Ojciec wasz niebiański je żywi. Czy wy nie jesteście o wiele ważniejsi od nich?"
"Mt6,27": "A kto z was, martwiąc się, może dodać do swojego wzrostu jeden łokieć?"
"Mt6,28": "A o ubranie dlaczego się martwicie? Zwróćcie uwagę na lilie polne, jak rosną; nie pracują, ani nie przędą,"
"Mt6,29": "A mówię wam, że nawet Salomon w całej swojej chwale nie ubrał się, jak jedna z nich."
"Mt6,30": "Jeśli więc trawę polną, która dziś jest, a jutro zostanie wrzucona do pieca, Bóg tak ubiera, czy nie o wiele bardziej was, ludzie małej wiary?"
"Mt6,31": "Nie martwcie się więc, mówiąc: Co będziemy jedli? Albo: Co będziemy pili? Albo: W co się ubierzemy?"
"Mt6,32": "Bo tego wszystkiego szukają poganie. Wie bowiem Ojciec wasz niebiański, że tego wszystkiego potrzebujecie."
"Mt6,33": "Ale szukajcie najpierw Królestwa Bożego i jego sprawiedliwości, a to wszystko zostanie wam dodane."
"Mt6,34": "Nie martwcie się więc o jutro; albowiem jutro martwić się będzie o siebie. Wystarczy dniowi jego zło."
