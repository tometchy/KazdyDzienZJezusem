"Mt6,1":
  text: "Uważajcie, abyście swojego daru miłosierdzia nie czynili przed ludźmi, po to, by być widzianymi przez nich, inaczej nie macie zapłaty u Ojca waszego, który jest w niebiosach."
  tags: []
"Mt6,2":
  text: "Dlatego, gdy dajesz dar miłosierdzia, nie trąb przed sobą, tak jak czynią to obłudnicy w synagogach i na ulicach, aby przez ludzi została oddana im chwała. Zaprawdę mówię wam: Już w całości otrzymują swoją zapłatę."
  tags: []
"Mt6,3":
  text: "Ale ty, gdy dajesz dar miłosierdzia, niech nie wie twoja lewa ręka, co czyni twoja prawa ręka,"
  tags: []
"Mt6,4":
  text: "By twój dar miłosierdzia pozostał w ukryciu, a twój Ojciec, który widzi w ukryciu, On ci odda jawnie."
  tags: []
"Mt6,5":
  text: "A gdy się modlisz, nie bądź jak obłudnicy; gdyż oni lubią stać i modlić się w synagogach i na rogach placów, aby ludzie ich widzieli. Zaprawdę mówię wam, że już w całości otrzymują swoją zapłatę."
  tags: []
"Mt6,6":
  text: "Ale ty, gdy się modlisz, wejdź do swojej komórki i zamknij swoje drzwi, módl się do Ojca twojego, który jest w ukryciu; a Ojciec twój, który widzi w ukryciu, odda ci jawnie."
  tags: []
"Mt6,7":
  text: "Modląc się natomiast, nie paplajcie jak poganie; albowiem wydaje im się, że w swojej wielomówności zostaną wysłuchani."
  tags: []
"Mt6,8":
  text: "Nie bądźcie do nich podobni, gdyż Ojciec wasz wie, czego potrzebujecie, zanim Go poprosicie."
  tags: []
"Mt6,9":
  text: "Wy więc módlcie się tak: Ojcze nasz, który jesteś w niebiosach! Niech Twoje imię zostanie uświęcone."
  tags: []
"Mt6,10":
  text: "Niech przyjdzie Twoje Królestwo; niech się stanie Twoja wola jak w niebie, tak i na ziemi."
  tags: []
"Mt6,11":
  text: "Chleba naszego codziennego daj nam dzisiaj."
  tags: []
"Mt6,12":
  text: "I odpuść nam nasze winy, jak i my odpuszczamy tym, którzy są wobec nas winni."
  tags: []
"Mt6,13":
  text: "I nie wprowadź nas w pokusę, ale uratuj nas od złego; gdyż Twoje jest Królestwo i moc, i chwała na wieki. Amen."
  tags: []
"Mt6,14":
  text: "Bo jeśli odpuścicie ludziom ich upadki, i wam odpuści Ojciec wasz niebiański."
  tags: []
"Mt6,15":
  text: "Ale jeśli nie odpuścicie ludziom ich upadków, także Ojciec wasz nie odpuści wam waszych upadków."
  tags: []
"Mt6,16":
  text: "A gdy pościcie, nie stawajcie się smutni tak jak obłudnicy; wykrzywiają bowiem swoje twarze, aby ludzie widzieli, że poszczą. Zaprawdę mówię wam: Już otrzymują całą swoją zapłatę."
  tags: []
"Mt6,17":
  text: "Ale ty, gdy pościsz, namaść swoją głowę i umyj swoją twarz;"
  tags: []
"Mt6,18":
  text: "Abyś nie był widziany przez ludzi, że pościsz, ale przez Ojca twojego, który jest w ukryciu; a Ojciec twój, który widzi w ukryciu, odda ci jawnie."
  tags: []
"Mt6,19":
  text: "Nie gromadźcie sobie skarbów na ziemi, gdzie mól i rdza niszczą, i gdzie złodzieje przekopują ściany i kradną;"
  tags: []
"Mt6,20":
  text: "Ale gromadźcie sobie skarby w niebie, gdzie ani mól, ani rdza nie niszczy, i gdzie złodzieje nie przekopują ścian i nie kradną."
  tags: []
"Mt6,21":
  text: "Albowiem gdzie jest wasz skarb, tam będzie i wasze serce."
  tags: []
"Mt6,22":
  text: "Lampą ciała jest oko. Jeśli więc twoje oko jest prosto patrzące, całe twoje ciało będzie jasne."
  tags: []
"Mt6,23":
  text: "Jeśli natomiast twoje oko jest złe, całe twoje ciało będzie ciemne. Jeśli więc światłość, która jest w tobie, jest ciemnością, sama ciemność jakąż wielką będzie?"
  tags: []
"Mt6,24":
  text: "Nikt nie może dwom panom służyć, jednego bowiem znienawidzi, a drugiego będzie miłował; albo do jednego przylgnie, a drugim pogardzi. Nie możecie służyć Bogu i mamonie."
  tags: []
"Mt6,25":
  text: "Dlatego mówię wam: Nie martwcie się o swoje życie, co będziecie jedli, albo co będziecie pili; ani o swoje ciało, w co będziecie się ubierać. Czyż życie nie jest czymś więcej niż pokarm, a ciało niż ubranie?"
  tags: []
"Mt6,26":
  text: "Przypatrzcie się ptakom na niebie, że nie sieją, ani nie żną, ani nie zbierają do spichlerzy, a Ojciec wasz niebiański je żywi. Czy wy nie jesteście o wiele ważniejsi od nich?"
  tags: []
"Mt6,27":
  text: "A kto z was, martwiąc się, może dodać do swojego wzrostu jeden łokieć?"
  tags: []
"Mt6,28":
  text: "A o ubranie dlaczego się martwicie? Zwróćcie uwagę na lilie polne, jak rosną; nie pracują, ani nie przędą,"
  tags: []
"Mt6,29":
  text: "A mówię wam, że nawet Salomon w całej swojej chwale nie ubrał się, jak jedna z nich."
  tags: []
"Mt6,30":
  text: "Jeśli więc trawę polną, która dziś jest, a jutro zostanie wrzucona do pieca, Bóg tak ubiera, czy nie o wiele bardziej was, ludzie małej wiary?"
  tags: []
"Mt6,31":
  text: "Nie martwcie się więc, mówiąc: Co będziemy jedli? Albo: Co będziemy pili? Albo: W co się ubierzemy?"
  tags: []
"Mt6,32":
  text: "Bo tego wszystkiego szukają poganie. Wie bowiem Ojciec wasz niebiański, że tego wszystkiego potrzebujecie."
  tags: []
"Mt6,33":
  text: "Ale szukajcie najpierw Królestwa Bożego i jego sprawiedliwości, a to wszystko zostanie wam dodane."
  tags: []
"Mt6,34":
  text: "Nie martwcie się więc o jutro; albowiem jutro martwić się będzie o siebie. Wystarczy dniowi jego zło."
  tags: []
