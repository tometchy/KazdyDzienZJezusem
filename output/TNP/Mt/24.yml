"Mt24,1": "A gdy Jezus wyszedł i odchodził ze świątyni, podeszli Jego uczniowie, aby pokazać Mu zabudowania świątyni."
"Mt24,2": "A Jezus powiedział im: Czy nie dostrzegacie tych wszystkich wydarzeń? Zaprawdę mówię wam, nie zostanie tu kamień na kamieniu, który nie zostanie zwalony."
"Mt24,3": "A gdy siedział na Górze Oliwnej, podeszli do Niego uczniowie na osobności, mówiąc: Powiedz nam, kiedy staną się te wydarzenia, i jaki jest znak Twojego przyjścia oraz końca tego wieku?"
"Mt24,4": "A Jezus w odpowiedzi, rzekł im: Uważajcie, aby was ktoś nie zwiódł."
"Mt24,5": "Wielu bowiem przyjdzie w moim imieniu, mówiąc: Ja jestem Mesjasz; i wielu zwiodą;"
"Mt24,6": "I usłyszycie o wojnach i wieści z wojen. Uważajcie, abyście się nie trwożyli; bo trzeba, aby stały się te wszystkie wydarzenia; ale to jeszcze nie koniec."
"Mt24,7": "Albowiem powstanie naród przeciwko narodowi i królestwo przeciwko królestwu, i będzie głód, i zarazy, a miejscami trzęsienia ziemi."
"Mt24,8": "A wszystkie te wydarzenia, to początek bólów porodowych."
"Mt24,9": "Wtedy wydawać was będą na udrękę, i będą was zabijać, i będziecie znienawidzeni przez wszystkie narody z powodu mojego imienia."
"Mt24,10": "I wtedy wielu zostanie zgorszonych, i jedni drugich wydadzą, i jedni drugich znienawidzą."
"Mt24,11": "I powstanie wielu fałszywych proroków, i zwiodą wielu."
"Mt24,12": "A z powodu rozmnożenia się bezprawia, miłość wielu oziębnie."
"Mt24,13": "Ale kto wytrwa aż do końca, ten zostanie ocalony."
"Mt24,14": "I zostanie ogłoszona ta Ewangelia Królestwa w całym zamieszkałym świecie, na świadectwo wszystkim narodom. I wtedy nadejdzie koniec."
"Mt24,15": "Gdy więc ujrzycie obrzydliwość spustoszenia, o której zostało powiedziane przez proroka Daniela, stojącą na miejscu świętym – kto czyta, niech rozumie!"
"Mt24,16": "Wtedy ci, którzy będą w Judei, niech uciekają w góry;"
"Mt24,17": "Kto jest na górnym tarasie, niech nie schodzi, aby coś wziąć ze swojego domu;"
"Mt24,18": "A kto jest na roli, niech ponownie nie wraca, by wziąć swoje szaty."
"Mt24,19": "A biada kobietom w ciąży i karmiącym w te dni!"
"Mt24,20": "Módlcie się więc, aby ucieczka wasza nie nastąpiła zimą, ani w szabat."
"Mt24,21": "Wtedy bowiem będzie wielki ucisk, jaki nie zaistniał od początku świata aż do teraz, ani jakiego z pewnością nie będzie."
"Mt24,22": "A gdyby nie były skrócone te dni, nikt nie zostałby uratowany; ale ze względu na wybranych będą skrócone te dni."
"Mt24,23": "Jeśli wtedy ktoś by wam powiedział: Oto tu jest Mesjasz, albo tam, nie wierzcie."
"Mt24,24": "Albowiem powstaną fałszywi mesjasze i fałszywi prorocy, i czynić będą wielkie znaki i cuda, tak aby zwieść, o ile można, i wybranych."
"Mt24,25": "Oto wam przepowiedziałem."
"Mt24,26": "Jeśli więc powiedzieliby wam: Oto jest na pustyni, nie wychodźcie; oto jest w alkierzach, nie wierzcie."
"Mt24,27": "Albowiem jak błyskawica pojawia się na wschodzie i jest widziana aż na zachodzie, takie będzie i przyjście Syna Człowieczego."
"Mt24,28": "Gdzie bowiem jest padlina, tam gromadzą się orły."
"Mt24,29": "A zaraz po ucisku tych dni słońce zostanie zaćmione i księżyc nie da swojej jasności, i gwiazdy spadać będą z nieba, a moce niebieskie zostaną poruszone."
"Mt24,30": "I wtedy ukaże się na niebie znak Syna Człowieczego, i wtedy będą bić się w piersi wszystkie plemiona ziemi, i zobaczą Syna Człowieczego, przychodzącego na obłokach nieba z mocą i z wielką chwałą."
"Mt24,31": "I pośle swoich aniołów z trąbą o potężnym dźwięku, i zgromadzą Jego wybranych z czterech stron, od jednego krańca nieba aż po drugi kraniec."
"Mt24,32": "A od figowca nauczcie się tego oto podobieństwa: Gdy jego gałąź staje się miękka i wypuszcza liście, wiecie, że blisko jest lato."
"Mt24,33": "Tak i wy, gdy ujrzycie te wszystkie wydarzenia, wiedzcie, że jest blisko, u drzwi."
"Mt24,34": "Zaprawdę mówię wam: Nie przeminie to pokolenie, aż się te wszystkie wydarzenia staną."
"Mt24,35": "Niebo i ziemia przeminą, ale słowa moje z pewnością nie przeminą."
"Mt24,36": "A o tym dniu i godzinie nikt nie wie, ani aniołowie niebios, tylko sam Ojciec mój."
"Mt24,37": "A tak, jak było za dni Noego, takie będzie i przyjście Syna Człowieczego."
"Mt24,38": "Albowiem jak za dni przed potopem jedli i pili, żenili się i za mąż wydawali, aż do tego dnia, w którym Noe wszedł do arki,"
"Mt24,39": "I nie spostrzegli się, aż przyszedł potop i uniósł wszystkich; takie będzie i przyjście Syna Człowieczego."
"Mt24,40": "Wtedy dwóch będzie na roli; jeden będzie wzięty, a jeden pozostawiony;"
"Mt24,41": "Dwie będą mleć na żarnach; jedna będzie wzięta, a jedna pozostawiona."
"Mt24,42": "Czuwajcie więc, ponieważ nie wiecie, o której godzinie wasz Pan przyjdzie."
"Mt24,43": "A to wiedzcie, że gdyby wiedział gospodarz, o której straży ma przyjść złodziej, czuwałby i nie pozwoliłby włamać się do swojego domu."
"Mt24,44": "Dlatego i wy bądźcie gotowi, bo Syn Człowieczy przyjdzie o godzinie, której się nie domyślacie."
"Mt24,45": "Kto więc jest tym wiernym i rozumnym sługą, którego pan jego ustanowił nad swoją służbą, aby im dawał pokarm we właściwym czasie?"
"Mt24,46": "Błogosławiony ów sługa, którego jego pan gdy przyjdzie, znajdzie tak czyniącego."
"Mt24,47": "Zaprawdę mówię wam, że go ustanowi nad całym swoim mieniem."
"Mt24,48": "A jeśliby powiedział ów zły sługa w swoim sercu: Mój pan zwleka ze swoim przyjściem,"
"Mt24,49": "I zacząłby bić współsługi, a jeść i pić z pijakami,"
"Mt24,50": "Przyjdzie pan owego sługi w dniu, którego się nie spodziewa, i o godzinie, której nie zna,"
"Mt24,51": "I potnie go na kawałki, i wyznaczy mu dział równy z obłudnikami; tam będzie płacz i zgrzytanie zębów."
