"Mt24,1":
  text: "A gdy Jezus wyszedł i odchodził ze świątyni, podeszli Jego uczniowie, aby pokazać Mu zabudowania świątyni."
  tags: []
"Mt24,2":
  text: "A Jezus powiedział im: Czy nie dostrzegacie tych wszystkich wydarzeń? Zaprawdę mówię wam, nie zostanie tu kamień na kamieniu, który nie zostanie zwalony."
  tags: []
"Mt24,3":
  text: "A gdy siedział na Górze Oliwnej, podeszli do Niego uczniowie na osobności, mówiąc: Powiedz nam, kiedy staną się te wydarzenia, i jaki jest znak Twojego przyjścia oraz końca tego wieku?"
  tags: []
"Mt24,4":
  text: "A Jezus w odpowiedzi, rzekł im: Uważajcie, aby was ktoś nie zwiódł."
  tags: []
"Mt24,5":
  text: "Wielu bowiem przyjdzie w moim imieniu, mówiąc: Ja jestem Mesjasz; i wielu zwiodą;"
  tags: []
"Mt24,6":
  text: "I usłyszycie o wojnach i wieści z wojen. Uważajcie, abyście się nie trwożyli; bo trzeba, aby stały się te wszystkie wydarzenia; ale to jeszcze nie koniec."
  tags: []
"Mt24,7":
  text: "Albowiem powstanie naród przeciwko narodowi i królestwo przeciwko królestwu, i będzie głód, i zarazy, a miejscami trzęsienia ziemi."
  tags: []
"Mt24,8":
  text: "A wszystkie te wydarzenia, to początek bólów porodowych."
  tags: []
"Mt24,9":
  text: "Wtedy wydawać was będą na udrękę, i będą was zabijać, i będziecie znienawidzeni przez wszystkie narody z powodu mojego imienia."
  tags: []
"Mt24,10":
  text: "I wtedy wielu zostanie zgorszonych, i jedni drugich wydadzą, i jedni drugich znienawidzą."
  tags: []
"Mt24,11":
  text: "I powstanie wielu fałszywych proroków, i zwiodą wielu."
  tags: []
"Mt24,12":
  text: "A z powodu rozmnożenia się bezprawia, miłość wielu oziębnie."
  tags: []
"Mt24,13":
  text: "Ale kto wytrwa aż do końca, ten zostanie ocalony."
  tags: []
"Mt24,14":
  text: "I zostanie ogłoszona ta Ewangelia Królestwa w całym zamieszkałym świecie, na świadectwo wszystkim narodom. I wtedy nadejdzie koniec."
  tags: []
"Mt24,15":
  text: "Gdy więc ujrzycie obrzydliwość spustoszenia, o której zostało powiedziane przez proroka Daniela, stojącą na miejscu świętym – kto czyta, niech rozumie!"
  tags: []
"Mt24,16":
  text: "Wtedy ci, którzy będą w Judei, niech uciekają w góry;"
  tags: []
"Mt24,17":
  text: "Kto jest na górnym tarasie, niech nie schodzi, aby coś wziąć ze swojego domu;"
  tags: []
"Mt24,18":
  text: "A kto jest na roli, niech ponownie nie wraca, by wziąć swoje szaty."
  tags: []
"Mt24,19":
  text: "A biada kobietom w ciąży i karmiącym w te dni!"
  tags: []
"Mt24,20":
  text: "Módlcie się więc, aby ucieczka wasza nie nastąpiła zimą, ani w szabat."
  tags: []
"Mt24,21":
  text: "Wtedy bowiem będzie wielki ucisk, jaki nie zaistniał od początku świata aż do teraz, ani jakiego z pewnością nie będzie."
  tags: []
"Mt24,22":
  text: "A gdyby nie były skrócone te dni, nikt nie zostałby uratowany; ale ze względu na wybranych będą skrócone te dni."
  tags: []
"Mt24,23":
  text: "Jeśli wtedy ktoś by wam powiedział: Oto tu jest Mesjasz, albo tam, nie wierzcie."
  tags: []
"Mt24,24":
  text: "Albowiem powstaną fałszywi mesjasze i fałszywi prorocy, i czynić będą wielkie znaki i cuda, tak aby zwieść, o ile można, i wybranych."
  tags: []
"Mt24,25":
  text: "Oto wam przepowiedziałem."
  tags: []
"Mt24,26":
  text: "Jeśli więc powiedzieliby wam: Oto jest na pustyni, nie wychodźcie; oto jest w alkierzach, nie wierzcie."
  tags: []
"Mt24,27":
  text: "Albowiem jak błyskawica pojawia się na wschodzie i jest widziana aż na zachodzie, takie będzie i przyjście Syna Człowieczego."
  tags: []
"Mt24,28":
  text: "Gdzie bowiem jest padlina, tam gromadzą się orły."
  tags: []
"Mt24,29":
  text: "A zaraz po ucisku tych dni słońce zostanie zaćmione i księżyc nie da swojej jasności, i gwiazdy spadać będą z nieba, a moce niebieskie zostaną poruszone."
  tags: []
"Mt24,30":
  text: "I wtedy ukaże się na niebie znak Syna Człowieczego, i wtedy będą bić się w piersi wszystkie plemiona ziemi, i zobaczą Syna Człowieczego, przychodzącego na obłokach nieba z mocą i z wielką chwałą."
  tags: []
"Mt24,31":
  text: "I pośle swoich aniołów z trąbą o potężnym dźwięku, i zgromadzą Jego wybranych z czterech stron, od jednego krańca nieba aż po drugi kraniec."
  tags: []
"Mt24,32":
  text: "A od figowca nauczcie się tego oto podobieństwa: Gdy jego gałąź staje się miękka i wypuszcza liście, wiecie, że blisko jest lato."
  tags: []
"Mt24,33":
  text: "Tak i wy, gdy ujrzycie te wszystkie wydarzenia, wiedzcie, że jest blisko, u drzwi."
  tags: []
"Mt24,34":
  text: "Zaprawdę mówię wam: Nie przeminie to pokolenie, aż się te wszystkie wydarzenia staną."
  tags: []
"Mt24,35":
  text: "Niebo i ziemia przeminą, ale słowa moje z pewnością nie przeminą."
  tags: []
"Mt24,36":
  text: "A o tym dniu i godzinie nikt nie wie, ani aniołowie niebios, tylko sam Ojciec mój."
  tags: []
"Mt24,37":
  text: "A tak, jak było za dni Noego, takie będzie i przyjście Syna Człowieczego."
  tags: []
"Mt24,38":
  text: "Albowiem jak za dni przed potopem jedli i pili, żenili się i za mąż wydawali, aż do tego dnia, w którym Noe wszedł do arki,"
  tags: []
"Mt24,39":
  text: "I nie spostrzegli się, aż przyszedł potop i uniósł wszystkich; takie będzie i przyjście Syna Człowieczego."
  tags: []
"Mt24,40":
  text: "Wtedy dwóch będzie na roli; jeden będzie wzięty, a jeden pozostawiony;"
  tags: []
"Mt24,41":
  text: "Dwie będą mleć na żarnach; jedna będzie wzięta, a jedna pozostawiona."
  tags: []
"Mt24,42":
  text: "Czuwajcie więc, ponieważ nie wiecie, o której godzinie wasz Pan przyjdzie."
  tags: []
"Mt24,43":
  text: "A to wiedzcie, że gdyby wiedział gospodarz, o której straży ma przyjść złodziej, czuwałby i nie pozwoliłby włamać się do swojego domu."
  tags: []
"Mt24,44":
  text: "Dlatego i wy bądźcie gotowi, bo Syn Człowieczy przyjdzie o godzinie, której się nie domyślacie."
  tags: []
"Mt24,45":
  text: "Kto więc jest tym wiernym i rozumnym sługą, którego pan jego ustanowił nad swoją służbą, aby im dawał pokarm we właściwym czasie?"
  tags: []
"Mt24,46":
  text: "Błogosławiony ów sługa, którego jego pan gdy przyjdzie, znajdzie tak czyniącego."
  tags: []
"Mt24,47":
  text: "Zaprawdę mówię wam, że go ustanowi nad całym swoim mieniem."
  tags: []
"Mt24,48":
  text: "A jeśliby powiedział ów zły sługa w swoim sercu: Mój pan zwleka ze swoim przyjściem,"
  tags: []
"Mt24,49":
  text: "I zacząłby bić współsługi, a jeść i pić z pijakami,"
  tags: []
"Mt24,50":
  text: "Przyjdzie pan owego sługi w dniu, którego się nie spodziewa, i o godzinie, której nie zna,"
  tags: []
"Mt24,51":
  text: "I potnie go na kawałki, i wyznaczy mu dział równy z obłudnikami; tam będzie płacz i zgrzytanie zębów."
  tags: []
