"Mt3,1": "A w te dni przyszedł Jan Chrzciciel, głosząc na pustyni judzkiej i mówiąc:"
"Mt3,2": "Upamiętajcie się, albowiem bliskie jest Królestwo Niebios."
"Mt3,3": "To bowiem jest Ten, o którym powiedziano przez proroka Izajasza, mówiącego: Głos wołającego na pustyni: Przygotujcie drogę PANA, prostymi czyńcie Jego ścieżki."
"Mt3,4": "A Jan miał odzienie z sierści wielbłąda i pas skórzany wokół swoich bioder, a jego pokarmem była szarańcza i miód polny."
"Mt3,5": "Wtedy wychodziła do niego Jerozolima oraz cała Judea i cała okolica nad Jordanem."
"Mt3,6": "I byli chrzczeni przez niego w Jordanie, wyznając swoje grzechy."
"Mt3,7": "A gdy ujrzał wielu faryzeuszów i saduceuszów przychodzących do jego chrztu, powiedział im: Płody żmij! Kto wam pokazał, jak uciec od nadchodzącego gniewu?"
"Mt3,8": "Przynoście więc owoce godne upamiętania;"
"Mt3,9": "A nie mniemajcie, że możecie sobie mówić: Ojca mamy Abrahama; albowiem mówię wam, że Bóg i z tych kamieni może wzbudzić dzieci Abrahamowi."
"Mt3,10": "Już i także siekiera przykładana jest do korzenia drzew. Każde więc drzewo, które nie wydaje dobrego owocu, jest wycinane i wrzucane w ogień."
"Mt3,11": "Ja wprawdzie chrzczę was wodą ku upamiętaniu; Ten natomiast, który idzie za mną, mocniejszy jest ode mnie, Jemu nie jestem godny nosić sandałów. On was ochrzci w Duchu Świętym i ogniu."
"Mt3,12": "W Jego ręku jest wiejadło, i oczyści przewiewając swoje klepisko, i zgromadzi swoją pszenicę do spichlerza, a plewy spali ogniem nieugaszonym."
"Mt3,13": "Wtedy Jezus przyszedł z Galilei nad Jordan do Jana, aby zostać przez niego ochrzczonym."
"Mt3,14": "Ale Jan powstrzymywał Go, mówiąc: To ja mam potrzebę zostać ochrzczonym przez Ciebie, a Ty przychodzisz do mnie?"
"Mt3,15": "A Jezus powiedział do niego: Ustąp teraz; w ten sposób bowiem przystoi nam wypełnić wszelką sprawiedliwość. Wtedy Mu ustąpił."
"Mt3,16": "A gdy Jezus został ochrzczony, zaraz wyszedł z wody, a oto zostały Mu otwarte niebiosa i widział Ducha Bożego, zstępującego jakby gołębica i przychodzącego na Niego."
"Mt3,17": "I oto rozległ się głos z nieba, mówiący: Ten jest Synem moim umiłowanym, w którym znalazłem upodobanie."
