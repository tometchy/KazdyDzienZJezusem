"Mt3,1":
  text: "A w te dni przyszedł Jan Chrzciciel, głosząc na pustyni judzkiej i mówiąc:"
  tags: []
"Mt3,2":
  text: "Upamiętajcie się, albowiem bliskie jest Królestwo Niebios."
  tags: []
"Mt3,3":
  text: "To bowiem jest Ten, o którym powiedziano przez proroka Izajasza, mówiącego: Głos wołającego na pustyni: Przygotujcie drogę PANA, prostymi czyńcie Jego ścieżki."
  tags: []
"Mt3,4":
  text: "A Jan miał odzienie z sierści wielbłąda i pas skórzany wokół swoich bioder, a jego pokarmem była szarańcza i miód polny."
  tags: []
"Mt3,5":
  text: "Wtedy wychodziła do niego Jerozolima oraz cała Judea i cała okolica nad Jordanem."
  tags: []
"Mt3,6":
  text: "I byli chrzczeni przez niego w Jordanie, wyznając swoje grzechy."
  tags: []
"Mt3,7":
  text: "A gdy ujrzał wielu faryzeuszów i saduceuszów przychodzących do jego chrztu, powiedział im: Płody żmij! Kto wam pokazał, jak uciec od nadchodzącego gniewu?"
  tags: []
"Mt3,8":
  text: "Przynoście więc owoce godne upamiętania;"
  tags: []
"Mt3,9":
  text: "A nie mniemajcie, że możecie sobie mówić: Ojca mamy Abrahama; albowiem mówię wam, że Bóg i z tych kamieni może wzbudzić dzieci Abrahamowi."
  tags: []
"Mt3,10":
  text: "Już i także siekiera przykładana jest do korzenia drzew. Każde więc drzewo, które nie wydaje dobrego owocu, jest wycinane i wrzucane w ogień."
  tags: []
"Mt3,11":
  text: "Ja wprawdzie chrzczę was wodą ku upamiętaniu; Ten natomiast, który idzie za mną, mocniejszy jest ode mnie, Jemu nie jestem godny nosić sandałów. On was ochrzci w Duchu Świętym i ogniu."
  tags: []
"Mt3,12":
  text: "W Jego ręku jest wiejadło, i oczyści przewiewając swoje klepisko, i zgromadzi swoją pszenicę do spichlerza, a plewy spali ogniem nieugaszonym."
  tags: []
"Mt3,13":
  text: "Wtedy Jezus przyszedł z Galilei nad Jordan do Jana, aby zostać przez niego ochrzczonym."
  tags: []
"Mt3,14":
  text: "Ale Jan powstrzymywał Go, mówiąc: To ja mam potrzebę zostać ochrzczonym przez Ciebie, a Ty przychodzisz do mnie?"
  tags: []
"Mt3,15":
  text: "A Jezus powiedział do niego: Ustąp teraz; w ten sposób bowiem przystoi nam wypełnić wszelką sprawiedliwość. Wtedy Mu ustąpił."
  tags: []
"Mt3,16":
  text: "A gdy Jezus został ochrzczony, zaraz wyszedł z wody, a oto zostały Mu otwarte niebiosa i widział Ducha Bożego, zstępującego jakby gołębica i przychodzącego na Niego."
  tags: []
"Mt3,17":
  text: "I oto rozległ się głos z nieba, mówiący: Ten jest Synem moim umiłowanym, w którym znalazłem upodobanie."
  tags: []
