"Mt27,1":
  text: "A gdy nastał ranek, wszyscy arcykapłani i starsi ludu powzięli plan przeciwko Jezusowi, aby Go uśmiercić;"
  tags: []
"Mt27,2":
  text: "I związali Go, zaprowadzili i oddali Go namiestnikowi Poncjuszowi Piłatowi."
  tags: []
"Mt27,3":
  text: "Wtedy Judasz, który Go wydał, widząc, że Jezus został osądzony, żałował tego i zwrócił trzydzieści srebrników arcykapłanom i starszym,"
  tags: []
"Mt27,4":
  text: "Mówiąc: Zgrzeszyłem, wydając krew niewinną! A oni powiedzieli: Co nam do tego? To twoja sprawa."
  tags: []
"Mt27,5":
  text: "I rzucił srebrniki w świątyni, oddalił się, poszedł i powiesił się."
  tags: []
"Mt27,6":
  text: "Ale arcykapłani wzięli srebrniki, mówiąc: Nie wolno ich kłaść do skarbca świątynnego, gdyż jest to wycena krwi."
  tags: []
"Mt27,7":
  text: "A gdy naradzili się, kupili za nie pole garncarza na cmentarz dla cudzoziemców."
  tags: []
"Mt27,8":
  text: "Dlatego pole to nazwane jest Polem Krwi, aż do dnia dzisiejszego."
  tags: []
"Mt27,9":
  text: "Wtedy wypełniło się to, co zostało powiedziane przez proroka Jeremiasza, mówiącego: I przyjęli wartość trzydziestu srebrników, jako wycenę Tego, który został oszacowany przez synów Izraela,"
  tags: []
"Mt27,10":
  text: "I dali je za pole garncarza, jak mi nakazał PAN."
  tags: []
"Mt27,11":
  text: "A Jezus stał przed namiestnikiem; i pytał Go namiestnik, mówiąc: Czy Ty jesteś Królem Żydów? A Jezus mu odpowiedział: Ty to mówisz."
  tags: []
"Mt27,12":
  text: "I pośród oskarżeń arcykapłanów i starszych, nic nie odpowiedział."
  tags: []
"Mt27,13":
  text: "Wtedy Piłat powiedział Mu: Czy nie słyszysz, o jak wiele rzeczy Cię oskarżają?"
  tags: []
"Mt27,14":
  text: "A On nie odpowiedział mu na ani jedno słowo, tak że namiestnik bardzo się dziwił."
  tags: []
"Mt27,15":
  text: "A na święto namiestnik miał zwyczaj wypuszczać tłumowi jednego więźnia, tego, którego chcieli."
  tags: []
"Mt27,16":
  text: "A mieli wtedy dość znacznego więźnia, który nazywał się Barabasz."
  tags: []
"Mt27,17":
  text: "Gdy więc zebrali się, powiedział do nich Piłat: Kogo chcecie, abym wam wypuścił, Barabasza czy Jezusa, którego nazywają Mesjaszem?"
  tags: []
"Mt27,18":
  text: "Bo wiedział, że wydali Go z nienawiści."
  tags: []
"Mt27,19":
  text: "A gdy on siedział na tronie sędziowskim, posłała do niego wiadomość jego żona, mówiąc: Nic tobie do Tego sprawiedliwego; bo dzisiaj we śnie wiele wycierpiałam przez Niego."
  tags: []
"Mt27,20":
  text: "Natomiast arcykapłani i starsi przekonali tłumy, aby prosili o Barabasza, a Jezusa, aby zgubiono."
  tags: []
"Mt27,21":
  text: "A namiestnik w odpowiedzi, rzekł im: Kogo chcecie, abym wam z tych dwóch wypuścił? A oni odpowiedzieli: Barabasza."
  tags: []
"Mt27,22":
  text: "Piłat powiedział im: Co więc mam uczynić Jezusowi, którego nazywają Mesjaszem? Powiedzieli do niego wszyscy: Niech zostanie ukrzyżowany!"
  tags: []
"Mt27,23":
  text: "A namiestnik powiedział: Co więc złego uczynił? Ale oni tym bardziej krzyczeli, mówiąc: Niech zostanie ukrzyżowany!"
  tags: []
"Mt27,24":
  text: "A widząc Piłat, że to nic nie pomaga, ale tym bardziej wzmaga się zamęt, wziął wodę i obmył ręce przed ludem, mówiąc: Ja nie jestem winien krwi Tego sprawiedliwego; to wasza sprawa."
  tags: []
"Mt27,25":
  text: "A w odpowiedzi, cały lud rzekł: Krew Jego na nas i na nasze dzieci!"
  tags: []
"Mt27,26":
  text: "Wtedy im wypuścił Barabasza; a Jezusa po ubiczowaniu wydał, aby został ukrzyżowany."
  tags: []
"Mt27,27":
  text: "Wówczas żołnierze namiestnika wzięli Jezusa do pretorium, zebrali wokół Niego całą kohortę,"
  tags: []
"Mt27,28":
  text: "I zdjęli z Niego odzienie, i nałożyli na Niego płaszcz szkarłatny;"
  tags: []
"Mt27,29":
  text: "I upletli wieniec z cierni, i włożyli na Jego głowę, i wcisnęli trzcinę w Jego prawą rękę, a upadając przed Nim na kolana, szydzili z Niego, mówiąc: Witaj, Królu Judejczyków!"
  tags: []
"Mt27,30":
  text: "I plując na Niego, wzięli trzcinę i bili Go w głowę."
  tags: []
"Mt27,31":
  text: "A gdy zakończyli Go wyszydzać, zdjęli z Niego płaszcz i oblekli Go w Jego szaty, i odprowadzili na ukrzyżowanie."
  tags: []
"Mt27,32":
  text: "A wychodząc natrafili na pewnego człowieka, Cyrenejczyka, o imieniu Szymon; tego zmusili, aby niósł Jego krzyż."
  tags: []
"Mt27,33":
  text: "A gdy przyszli na miejsce o nazwie Golgota, to jest zwane Miejscem Czaszki,"
  tags: []
"Mt27,34":
  text: "Dali Mu pić kwaśne wino zmieszane z żółcią; a gdy je skosztował, nie chciał wypić."
  tags: []
"Mt27,35":
  text: "A gdy Go ukrzyżowali, rozdzielili Jego szaty, rzucając los; aby wypełniło się to, co zostało powiedziane przez proroka: Rozdzielili między siebie moje szaty, a o moje odzienie rzucali los."
  tags: []
"Mt27,36":
  text: "I siedząc tam, pilnowali Go."
  tags: []
"Mt27,37":
  text: "I umieścili nad Jego głową napis wyrażający Jego winę: To jest Jezus, Król Żydów."
  tags: []
"Mt27,38":
  text: "Wtedy też z Nim zostali ukrzyżowani dwaj przestępcy, jeden po prawej stronie, a drugi po lewej stronie."
  tags: []
"Mt27,39":
  text: "A ci, którzy obok przechodzili, bluźnili Mu, kiwali głowami i mówili:"
  tags: []
"Mt27,40":
  text: "Ty, co rozwalasz świątynię i w trzy dni ją budujesz, ratuj samego siebie; jeśli jesteś Synem Boga, zstąp z krzyża."
  tags: []
"Mt27,41":
  text: "Także i arcykapłani z uczonymi w Piśmie i ze starszymi szydząc z Niego, mówili:"
  tags: []
"Mt27,42":
  text: "Innych wybawiał, a samego siebie wybawić nie może; jeśli jest Królem Izraela, niech teraz zstąpi z krzyża, a Mu uwierzymy."
  tags: []
"Mt27,43":
  text: "Polegał na Bogu; niech Go teraz wybawi, jeśli Go pragnie; bo powiedział: Jestem Synem Boga."
  tags: []
"Mt27,44":
  text: "A tak samo przestępcy, którzy zostali z Nim ukrzyżowani, urągali Mu."
  tags: []
"Mt27,45":
  text: "A od szóstej godziny nastała ciemność na całej ziemi, aż do dziewiątej godziny."
  tags: []
"Mt27,46":
  text: "A około dziewiątej godziny zawołał Jezus potężnym głosem, mówiąc: Eli, Eli, lama sabachtani! To jest: Boże mój, Boże mój, dlaczego mnie opuściłeś!?"
  tags: []
"Mt27,47":
  text: "A niektórzy z tych, co tam stali, słysząc to, mówili: On woła Eliasza."
  tags: []
"Mt27,48":
  text: "I zaraz podbiegł jeden z nich, wziął gąbkę i nasączył ją kwaśnym winem, i nałożył na trzcinę, i dawał Mu pić."
  tags: []
"Mt27,49":
  text: "A pozostali mówili: Przestań, zobaczymy, czy przyjdzie Eliasz, aby Go wybawić."
  tags: []
"Mt27,50":
  text: "Ale Jezus ponownie zawołał potężnym głosem i oddał ducha."
  tags: []
"Mt27,51":
  text: "A oto zasłona świątyni została rozdarta na dwoje z góry aż do dołu, i zatrzęsła się ziemia, i skały popękały,"
  tags: []
"Mt27,52":
  text: "I groby otworzyły się, a wiele ciał świętych, którzy zasnęli, zostało wzbudzonych,"
  tags: []
"Mt27,53":
  text: "I wyszli z grobowców po Jego wzbudzeniu, i weszli do miasta świętego, i pokazali się wielu."
  tags: []
"Mt27,54":
  text: "A setnik i ci, którzy z nim pilnowali Jezusa, widząc trzęsienie ziemi i to, co się stało, bardzo się zlękli, mówiąc: Prawdziwie Ten był Synem Boga."
  tags: []
"Mt27,55":
  text: "A było tam wiele kobiet z daleka przypatrujących się, które przyszły za Jezusem z Galilei, służąc Mu;"
  tags: []
"Mt27,56":
  text: "Między nimi była Maria Magdalena i Maria, matka Jakuba i Jozeasa, i matka synów Zebedeusza."
  tags: []
"Mt27,57":
  text: "A gdy nastał wieczór, przyszedł bogaty człowiek z Arymatei, o imieniu Józef, który sam był uczniem Jezusa."
  tags: []
"Mt27,58":
  text: "Ten przyszedł do Piłata i poprosił o ciało Jezusa. Wtedy Piłat rozkazał, by ciało zostało oddane."
  tags: []
"Mt27,59":
  text: "I wziął Józef ciało, owinął je w czyste prześcieradło,"
  tags: []
"Mt27,60":
  text: "I złożył je w swoim nowym grobowcu, który wykuł w skale; a gdy zatoczył wielki kamień na otwór grobowca, odszedł."
  tags: []
"Mt27,61":
  text: "A była tam Maria Magdalena i inna Maria, siedzące naprzeciw grobowca."
  tags: []
"Mt27,62":
  text: "A nazajutrz, to jest w dniu po Przygotowaniu, zebrali się arcykapłani i faryzeusze u Piłata,"
  tags: []
"Mt27,63":
  text: "Mówiąc: Panie! Przypomnieliśmy sobie, że ten zwodziciel, gdy jeszcze żył, powiedział: Po trzech dniach zostanę wzbudzony z martwych."
  tags: []
"Mt27,64":
  text: "Każ więc zabezpieczyć grób aż do trzeciego dnia, żeby czasem Jego uczniowie nie przyszli w nocy i Go nie wykradli, i nie mówili ludowi, że powstał z martwych. A ostatnie zwiedzenie będzie gorsze niż pierwsze."
  tags: []
"Mt27,65":
  text: "Piłat powiedział im: Macie straż; idźcie, zabezpieczcie jak umiecie."
  tags: []
"Mt27,66":
  text: "A oni poszli i zabezpieczyli grób, opieczętowali kamień i postawili straże."
  tags: []
