"Mt27,1": "A gdy nastał ranek, wszyscy arcykapłani i starsi ludu powzięli plan przeciwko Jezusowi, aby Go uśmiercić;"
"Mt27,2": "I związali Go, zaprowadzili i oddali Go namiestnikowi Poncjuszowi Piłatowi."
"Mt27,3": "Wtedy Judasz, który Go wydał, widząc, że Jezus został osądzony, żałował tego i zwrócił trzydzieści srebrników arcykapłanom i starszym,"
"Mt27,4": "Mówiąc: Zgrzeszyłem, wydając krew niewinną! A oni powiedzieli: Co nam do tego? To twoja sprawa."
"Mt27,5": "I rzucił srebrniki w świątyni, oddalił się, poszedł i powiesił się."
"Mt27,6": "Ale arcykapłani wzięli srebrniki, mówiąc: Nie wolno ich kłaść do skarbca świątynnego, gdyż jest to wycena krwi."
"Mt27,7": "A gdy naradzili się, kupili za nie pole garncarza na cmentarz dla cudzoziemców."
"Mt27,8": "Dlatego pole to nazwane jest Polem Krwi, aż do dnia dzisiejszego."
"Mt27,9": "Wtedy wypełniło się to, co zostało powiedziane przez proroka Jeremiasza, mówiącego: I przyjęli wartość trzydziestu srebrników, jako wycenę Tego, który został oszacowany przez synów Izraela,"
"Mt27,10": "I dali je za pole garncarza, jak mi nakazał PAN."
"Mt27,11": "A Jezus stał przed namiestnikiem; i pytał Go namiestnik, mówiąc: Czy Ty jesteś Królem Żydów? A Jezus mu odpowiedział: Ty to mówisz."
"Mt27,12": "I pośród oskarżeń arcykapłanów i starszych, nic nie odpowiedział."
"Mt27,13": "Wtedy Piłat powiedział Mu: Czy nie słyszysz, o jak wiele rzeczy Cię oskarżają?"
"Mt27,14": "A On nie odpowiedział mu na ani jedno słowo, tak że namiestnik bardzo się dziwił."
"Mt27,15": "A na święto namiestnik miał zwyczaj wypuszczać tłumowi jednego więźnia, tego, którego chcieli."
"Mt27,16": "A mieli wtedy dość znacznego więźnia, który nazywał się Barabasz."
"Mt27,17": "Gdy więc zebrali się, powiedział do nich Piłat: Kogo chcecie, abym wam wypuścił, Barabasza czy Jezusa, którego nazywają Mesjaszem?"
"Mt27,18": "Bo wiedział, że wydali Go z nienawiści."
"Mt27,19": "A gdy on siedział na tronie sędziowskim, posłała do niego wiadomość jego żona, mówiąc: Nic tobie do Tego sprawiedliwego; bo dzisiaj we śnie wiele wycierpiałam przez Niego."
"Mt27,20": "Natomiast arcykapłani i starsi przekonali tłumy, aby prosili o Barabasza, a Jezusa, aby zgubiono."
"Mt27,21": "A namiestnik w odpowiedzi, rzekł im: Kogo chcecie, abym wam z tych dwóch wypuścił? A oni odpowiedzieli: Barabasza."
"Mt27,22": "Piłat powiedział im: Co więc mam uczynić Jezusowi, którego nazywają Mesjaszem? Powiedzieli do niego wszyscy: Niech zostanie ukrzyżowany!"
"Mt27,23": "A namiestnik powiedział: Co więc złego uczynił? Ale oni tym bardziej krzyczeli, mówiąc: Niech zostanie ukrzyżowany!"
"Mt27,24": "A widząc Piłat, że to nic nie pomaga, ale tym bardziej wzmaga się zamęt, wziął wodę i obmył ręce przed ludem, mówiąc: Ja nie jestem winien krwi Tego sprawiedliwego; to wasza sprawa."
"Mt27,25": "A w odpowiedzi, cały lud rzekł: Krew Jego na nas i na nasze dzieci!"
"Mt27,26": "Wtedy im wypuścił Barabasza; a Jezusa po ubiczowaniu wydał, aby został ukrzyżowany."
"Mt27,27": "Wówczas żołnierze namiestnika wzięli Jezusa do pretorium, zebrali wokół Niego całą kohortę,"
"Mt27,28": "I zdjęli z Niego odzienie, i nałożyli na Niego płaszcz szkarłatny;"
"Mt27,29": "I upletli wieniec z cierni, i włożyli na Jego głowę, i wcisnęli trzcinę w Jego prawą rękę, a upadając przed Nim na kolana, szydzili z Niego, mówiąc: Witaj, Królu Judejczyków!"
"Mt27,30": "I plując na Niego, wzięli trzcinę i bili Go w głowę."
"Mt27,31": "A gdy zakończyli Go wyszydzać, zdjęli z Niego płaszcz i oblekli Go w Jego szaty, i odprowadzili na ukrzyżowanie."
"Mt27,32": "A wychodząc natrafili na pewnego człowieka, Cyrenejczyka, o imieniu Szymon; tego zmusili, aby niósł Jego krzyż."
"Mt27,33": "A gdy przyszli na miejsce o nazwie Golgota, to jest zwane Miejscem Czaszki,"
"Mt27,34": "Dali Mu pić kwaśne wino zmieszane z żółcią; a gdy je skosztował, nie chciał wypić."
"Mt27,35": "A gdy Go ukrzyżowali, rozdzielili Jego szaty, rzucając los; aby wypełniło się to, co zostało powiedziane przez proroka: Rozdzielili między siebie moje szaty, a o moje odzienie rzucali los."
"Mt27,36": "I siedząc tam, pilnowali Go."
"Mt27,37": "I umieścili nad Jego głową napis wyrażający Jego winę: To jest Jezus, Król Żydów."
"Mt27,38": "Wtedy też z Nim zostali ukrzyżowani dwaj przestępcy, jeden po prawej stronie, a drugi po lewej stronie."
"Mt27,39": "A ci, którzy obok przechodzili, bluźnili Mu, kiwali głowami i mówili:"
"Mt27,40": "Ty, co rozwalasz świątynię i w trzy dni ją budujesz, ratuj samego siebie; jeśli jesteś Synem Boga, zstąp z krzyża."
"Mt27,41": "Także i arcykapłani z uczonymi w Piśmie i ze starszymi szydząc z Niego, mówili:"
"Mt27,42": "Innych wybawiał, a samego siebie wybawić nie może; jeśli jest Królem Izraela, niech teraz zstąpi z krzyża, a Mu uwierzymy."
"Mt27,43": "Polegał na Bogu; niech Go teraz wybawi, jeśli Go pragnie; bo powiedział: Jestem Synem Boga."
"Mt27,44": "A tak samo przestępcy, którzy zostali z Nim ukrzyżowani, urągali Mu."
"Mt27,45": "A od szóstej godziny nastała ciemność na całej ziemi, aż do dziewiątej godziny."
"Mt27,46": "A około dziewiątej godziny zawołał Jezus potężnym głosem, mówiąc: Eli, Eli, lama sabachtani! To jest: Boże mój, Boże mój, dlaczego mnie opuściłeś!?"
"Mt27,47": "A niektórzy z tych, co tam stali, słysząc to, mówili: On woła Eliasza."
"Mt27,48": "I zaraz podbiegł jeden z nich, wziął gąbkę i nasączył ją kwaśnym winem, i nałożył na trzcinę, i dawał Mu pić."
"Mt27,49": "A pozostali mówili: Przestań, zobaczymy, czy przyjdzie Eliasz, aby Go wybawić."
"Mt27,50": "Ale Jezus ponownie zawołał potężnym głosem i oddał ducha."
"Mt27,51": "A oto zasłona świątyni została rozdarta na dwoje z góry aż do dołu, i zatrzęsła się ziemia, i skały popękały,"
"Mt27,52": "I groby otworzyły się, a wiele ciał świętych, którzy zasnęli, zostało wzbudzonych,"
"Mt27,53": "I wyszli z grobowców po Jego wzbudzeniu, i weszli do miasta świętego, i pokazali się wielu."
"Mt27,54": "A setnik i ci, którzy z nim pilnowali Jezusa, widząc trzęsienie ziemi i to, co się stało, bardzo się zlękli, mówiąc: Prawdziwie Ten był Synem Boga."
"Mt27,55": "A było tam wiele kobiet z daleka przypatrujących się, które przyszły za Jezusem z Galilei, służąc Mu;"
"Mt27,56": "Między nimi była Maria Magdalena i Maria, matka Jakuba i Jozeasa, i matka synów Zebedeusza."
"Mt27,57": "A gdy nastał wieczór, przyszedł bogaty człowiek z Arymatei, o imieniu Józef, który sam był uczniem Jezusa."
"Mt27,58": "Ten przyszedł do Piłata i poprosił o ciało Jezusa. Wtedy Piłat rozkazał, by ciało zostało oddane."
"Mt27,59": "I wziął Józef ciało, owinął je w czyste prześcieradło,"
"Mt27,60": "I złożył je w swoim nowym grobowcu, który wykuł w skale; a gdy zatoczył wielki kamień na otwór grobowca, odszedł."
"Mt27,61": "A była tam Maria Magdalena i inna Maria, siedzące naprzeciw grobowca."
"Mt27,62": "A nazajutrz, to jest w dniu po Przygotowaniu, zebrali się arcykapłani i faryzeusze u Piłata,"
"Mt27,63": "Mówiąc: Panie! Przypomnieliśmy sobie, że ten zwodziciel, gdy jeszcze żył, powiedział: Po trzech dniach zostanę wzbudzony z martwych."
"Mt27,64": "Każ więc zabezpieczyć grób aż do trzeciego dnia, żeby czasem Jego uczniowie nie przyszli w nocy i Go nie wykradli, i nie mówili ludowi, że powstał z martwych. A ostatnie zwiedzenie będzie gorsze niż pierwsze."
"Mt27,65": "Piłat powiedział im: Macie straż; idźcie, zabezpieczcie jak umiecie."
"Mt27,66": "A oni poszli i zabezpieczyli grób, opieczętowali kamień i postawili straże."
