"Mt10,1": "A gdy przywołał swoich dwunastu uczniów, dał im władzę nad duchami nieczystymi, aby je wypędzali, i aby uzdrawiali wszelką chorobę i wszelką słabość."
"Mt10,2": "A to są imiona dwunastu apostołów: pierwszy Szymon, zwany Piotrem, i Andrzej, jego brat; Jakub, syn Zebedeusza, i Jan, jego brat;"
"Mt10,3": "Filip i Bartłomiej, Tomasz i celnik Mateusz, Jakub, syn Alfeusza, i Lebeusz, o przydomku – Tadeusz;"
"Mt10,4": "Szymon Kananejczyk i Judasz Iskariota, ten, który Go wydał."
"Mt10,5": "Tych to dwunastu posłał Jezus, rozkazując im i mówiąc: Na drogę pogan nie wstępujcie i nie wchodźcie do miasta Samarytan;"
"Mt10,6": "Ale idźcie raczej do owiec zgubionych z domu Izraela."
"Mt10,7": "A idąc głoście, mówiąc: Przybliżyło się Królestwo Niebios."
"Mt10,8": "Słabych uleczcie, trędowatych oczyszczajcie, umarłych wskrzeszajcie, demony wyganiajcie. Za darmo wzięliście, za darmo też dawajcie."
"Mt10,9": "Nie nabywajcie złota, ani srebra, ani miedzi w swoje trzosy;"
"Mt10,10": "Ani torby na drogę, ani dwóch sukien, ani sandałów, ani lasek. Albowiem godny jest robotnik swojego wyżywienia."
"Mt10,11": "A do któregokolwiek miasta lub wioski wejdziecie, dokładnie dowiedzcie się, kto jest w nim godny, i tam mieszkajcie, dopóki nie wyjdziecie."
"Mt10,12": "Wchodząc natomiast do domu, pozdrówcie go."
"Mt10,13": "I jeśli ten dom prawdziwie byłby godny, niech przyjdzie pokój wasz do niego, a jeśli nie byłby godny, pokój wasz niech wróci do was."
"Mt10,14": "A jeśli ktoś by was nie przyjął, ani nie słuchał waszych słów, wychodząc z domu albo z tego miasta, strząśnijcie proch ze swoich stóp."
"Mt10,15": "Zaprawdę mówię wam: Znośniej będzie ziemi Sodomy i Gomory w dniu sądu, niż temu miastu."
"Mt10,16": "Oto ja posyłam was jak owce w sam środek wilków. Bądźcie więc roztropni jak węże i prości jak gołębice."
"Mt10,17": "I uważajcie na ludzi; będą bowiem wydawać was lokalnym sanhedrynom, i będą was biczować w swoich synagogach."
"Mt10,18": "I będziecie prowadzeni przed namiestników i przed królów z mojego powodu, na świadectwo przeciwko nim i poganom."
"Mt10,19": "Ale gdyby was wydali, nie martwcie się, jak i co będziecie mówić; albowiem w tej godzinie zostanie wam dane, co macie powiedzieć."
"Mt10,20": "Bo to nie wy mówicie, ale Duch Ojca waszego mówi w was."
"Mt10,21": "I wyda na śmierć brat brata, a ojciec dziecko. Dzieci powstaną przeciwko rodzicom i uśmiercą ich."
"Mt10,22": "I będziecie znienawidzeni przez wszystkich z powodu mojego imienia. Lecz kto wytrwa do końca, ten będzie ocalony."
"Mt10,23": "A gdy będą was prześladować w tym mieście, uciekajcie do drugiego. Zaprawdę mówię wam, że nie skończycie obchodzić miast Izraela, a Syn Człowieczy przyjdzie."
"Mt10,24": "Nie jest uczeń nad nauczyciela, ani sługa nad swojego pana."
"Mt10,25": "Wystarczy uczniowi, aby stał się jak jego nauczyciel, a sługa jak jego pan. Jeśli gospodarza nazywali Belzebubem, o ile bardziej będą tak nazywać jego domowników."
"Mt10,26": "Dlatego nie bójcie się ich. Albowiem nie ma nic zasłoniętego, co nie będzie odsłonięte, i nic ukrytego, co nie będzie poznane."
"Mt10,27": "Co wam mówię w ciemności, powiedzcie w świetle, a co słyszycie na ucho, rozgłaszajcie na tarasach."
"Mt10,28": "I nie bójcie się tych, którzy zabijają ciało, lecz nie mogą zabić duszy; ale bójcie się bardziej Tego, który może i duszę, i ciało zgubić w Gehennie."
"Mt10,29": "Czy nie sprzedają dwóch wróbli za assariona? A jednak ani jeden z nich nie upadnie na ziemię bez woli Ojca waszego."
"Mt10,30": "Nawet i włosy na waszej głowie wszystkie są policzone."
"Mt10,31": "Nie bójcie się więc; wy jesteście ważniejsi niż wiele wróbli."
"Mt10,32": "Każdy więc, kto przyzna się do mnie przed ludźmi, do tego i ja przyznam się przed Ojcem moim, który jest w niebiosach."
"Mt10,33": "A ktokolwiek wyparłby się mnie przed ludźmi, tego i ja wyprę się przed moim Ojcem, który jest w niebiosach."
"Mt10,34": "Nie sądźcie, że przyszedłem przynieść pokój na ziemię; nie przyszedłem przynieść pokój, lecz miecz."
"Mt10,35": "Bo przyszedłem rozdzielić człowieka z jego ojcem, i córkę z jej matką, a synową z jej teściową;"
"Mt10,36": "I będą wrogami człowieka jego domownicy."
"Mt10,37": "Kto miłuje ojca albo matkę bardziej niż mnie, nie jest mnie godny. I kto miłuje syna albo córkę bardziej niż mnie, nie jest mnie godny."
"Mt10,38": "Kto nie bierze swojego krzyża, a idzie za mną, nie jest mnie godny."
"Mt10,39": "Kto znajdzie swoje życie, zgubi je, a kto zgubi swoje życie dla mnie, znajdzie je."
"Mt10,40": "Kto was przyjmuje, mnie przyjmuje, a kto mnie przyjmuje, przyjmuje Tego, który mnie posłał."
"Mt10,41": "Kto przyjmuje proroka w imieniu proroka, weźmie zapłatę proroka; a kto przyjmuje sprawiedliwego w imieniu sprawiedliwego, weźmie zapłatę sprawiedliwego."
"Mt10,42": "A kto napoiłby jednego z tych małych kubkiem zimnej wody tylko dlatego, że jest uczniem, zaprawdę mówię wam, nie straci swojej zapłaty."
