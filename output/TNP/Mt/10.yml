"Mt10,1":
  text: "A gdy przywołał swoich dwunastu uczniów, dał im władzę nad duchami nieczystymi, aby je wypędzali, i aby uzdrawiali wszelką chorobę i wszelką słabość."
  tags: []
"Mt10,2":
  text: "A to są imiona dwunastu apostołów: pierwszy Szymon, zwany Piotrem, i Andrzej, jego brat; Jakub, syn Zebedeusza, i Jan, jego brat;"
  tags: []
"Mt10,3":
  text: "Filip i Bartłomiej, Tomasz i celnik Mateusz, Jakub, syn Alfeusza, i Lebeusz, o przydomku – Tadeusz;"
  tags: []
"Mt10,4":
  text: "Szymon Kananejczyk i Judasz Iskariota, ten, który Go wydał."
  tags: []
"Mt10,5":
  text: "Tych to dwunastu posłał Jezus, rozkazując im i mówiąc: Na drogę pogan nie wstępujcie i nie wchodźcie do miasta Samarytan;"
  tags: []
"Mt10,6":
  text: "Ale idźcie raczej do owiec zgubionych z domu Izraela."
  tags: []
"Mt10,7":
  text: "A idąc głoście, mówiąc: Przybliżyło się Królestwo Niebios."
  tags: []
"Mt10,8":
  text: "Słabych uleczcie, trędowatych oczyszczajcie, umarłych wskrzeszajcie, demony wyganiajcie. Za darmo wzięliście, za darmo też dawajcie."
  tags: []
"Mt10,9":
  text: "Nie nabywajcie złota, ani srebra, ani miedzi w swoje trzosy;"
  tags: []
"Mt10,10":
  text: "Ani torby na drogę, ani dwóch sukien, ani sandałów, ani lasek. Albowiem godny jest robotnik swojego wyżywienia."
  tags: []
"Mt10,11":
  text: "A do któregokolwiek miasta lub wioski wejdziecie, dokładnie dowiedzcie się, kto jest w nim godny, i tam mieszkajcie, dopóki nie wyjdziecie."
  tags: []
"Mt10,12":
  text: "Wchodząc natomiast do domu, pozdrówcie go."
  tags: []
"Mt10,13":
  text: "I jeśli ten dom prawdziwie byłby godny, niech przyjdzie pokój wasz do niego, a jeśli nie byłby godny, pokój wasz niech wróci do was."
  tags: []
"Mt10,14":
  text: "A jeśli ktoś by was nie przyjął, ani nie słuchał waszych słów, wychodząc z domu albo z tego miasta, strząśnijcie proch ze swoich stóp."
  tags: []
"Mt10,15":
  text: "Zaprawdę mówię wam: Znośniej będzie ziemi Sodomy i Gomory w dniu sądu, niż temu miastu."
  tags: []
"Mt10,16":
  text: "Oto ja posyłam was jak owce w sam środek wilków. Bądźcie więc roztropni jak węże i prości jak gołębice."
  tags: []
"Mt10,17":
  text: "I uważajcie na ludzi; będą bowiem wydawać was lokalnym sanhedrynom, i będą was biczować w swoich synagogach."
  tags: []
"Mt10,18":
  text: "I będziecie prowadzeni przed namiestników i przed królów z mojego powodu, na świadectwo przeciwko nim i poganom."
  tags: []
"Mt10,19":
  text: "Ale gdyby was wydali, nie martwcie się, jak i co będziecie mówić; albowiem w tej godzinie zostanie wam dane, co macie powiedzieć."
  tags: []
"Mt10,20":
  text: "Bo to nie wy mówicie, ale Duch Ojca waszego mówi w was."
  tags: []
"Mt10,21":
  text: "I wyda na śmierć brat brata, a ojciec dziecko. Dzieci powstaną przeciwko rodzicom i uśmiercą ich."
  tags: []
"Mt10,22":
  text: "I będziecie znienawidzeni przez wszystkich z powodu mojego imienia. Lecz kto wytrwa do końca, ten będzie ocalony."
  tags: []
"Mt10,23":
  text: "A gdy będą was prześladować w tym mieście, uciekajcie do drugiego. Zaprawdę mówię wam, że nie skończycie obchodzić miast Izraela, a Syn Człowieczy przyjdzie."
  tags: []
"Mt10,24":
  text: "Nie jest uczeń nad nauczyciela, ani sługa nad swojego pana."
  tags: []
"Mt10,25":
  text: "Wystarczy uczniowi, aby stał się jak jego nauczyciel, a sługa jak jego pan. Jeśli gospodarza nazywali Belzebubem, o ile bardziej będą tak nazywać jego domowników."
  tags: []
"Mt10,26":
  text: "Dlatego nie bójcie się ich. Albowiem nie ma nic zasłoniętego, co nie będzie odsłonięte, i nic ukrytego, co nie będzie poznane."
  tags: []
"Mt10,27":
  text: "Co wam mówię w ciemności, powiedzcie w świetle, a co słyszycie na ucho, rozgłaszajcie na tarasach."
  tags: []
"Mt10,28":
  text: "I nie bójcie się tych, którzy zabijają ciało, lecz nie mogą zabić duszy; ale bójcie się bardziej Tego, który może i duszę, i ciało zgubić w Gehennie."
  tags: []
"Mt10,29":
  text: "Czy nie sprzedają dwóch wróbli za assariona? A jednak ani jeden z nich nie upadnie na ziemię bez woli Ojca waszego."
  tags: []
"Mt10,30":
  text: "Nawet i włosy na waszej głowie wszystkie są policzone."
  tags: []
"Mt10,31":
  text: "Nie bójcie się więc; wy jesteście ważniejsi niż wiele wróbli."
  tags: []
"Mt10,32":
  text: "Każdy więc, kto przyzna się do mnie przed ludźmi, do tego i ja przyznam się przed Ojcem moim, który jest w niebiosach."
  tags: []
"Mt10,33":
  text: "A ktokolwiek wyparłby się mnie przed ludźmi, tego i ja wyprę się przed moim Ojcem, który jest w niebiosach."
  tags: []
"Mt10,34":
  text: "Nie sądźcie, że przyszedłem przynieść pokój na ziemię; nie przyszedłem przynieść pokój, lecz miecz."
  tags: []
"Mt10,35":
  text: "Bo przyszedłem rozdzielić człowieka z jego ojcem, i córkę z jej matką, a synową z jej teściową;"
  tags: []
"Mt10,36":
  text: "I będą wrogami człowieka jego domownicy."
  tags: []
"Mt10,37":
  text: "Kto miłuje ojca albo matkę bardziej niż mnie, nie jest mnie godny. I kto miłuje syna albo córkę bardziej niż mnie, nie jest mnie godny."
  tags: []
"Mt10,38":
  text: "Kto nie bierze swojego krzyża, a idzie za mną, nie jest mnie godny."
  tags: []
"Mt10,39":
  text: "Kto znajdzie swoje życie, zgubi je, a kto zgubi swoje życie dla mnie, znajdzie je."
  tags: []
"Mt10,40":
  text: "Kto was przyjmuje, mnie przyjmuje, a kto mnie przyjmuje, przyjmuje Tego, który mnie posłał."
  tags: []
"Mt10,41":
  text: "Kto przyjmuje proroka w imieniu proroka, weźmie zapłatę proroka; a kto przyjmuje sprawiedliwego w imieniu sprawiedliwego, weźmie zapłatę sprawiedliwego."
  tags: []
"Mt10,42":
  text: "A kto napoiłby jednego z tych małych kubkiem zimnej wody tylko dlatego, że jest uczniem, zaprawdę mówię wam, nie straci swojej zapłaty."
  tags: []
