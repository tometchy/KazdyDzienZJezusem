"Mt1,1": "Zwój o pochodzeniu Jezusa Chrystusa, syna Dawida, syna Abrahama."
"Mt1,2": "Abraham spłodził Izaaka, a Izaak spłodził Jakuba, a Jakub spłodził Judę i jego braci."
"Mt1,3": "A Juda spłodził z Tamar Faresa i Zarę, a Fares spłodził Esroma, a Esrom spłodził Arama."
"Mt1,4": "A Aram spłodził Aminadaba, a Aminadab spłodził Naassona, a Naasson spłodził Salmona."
"Mt1,5": "A Salmon spłodził z Rahab Booza, a Booz spłodził z Ruty Obeda, a Obed spłodził Jessego."
"Mt1,6": "A Jesse spłodził Dawida króla, a Dawid król spłodził Salomona z tej, która była żoną Uriasza."
"Mt1,7": "A Salomon spłodził Roboama, a Roboam spłodził Abiasza, a Abiasz spłodził Asę."
"Mt1,8": "A Asa spłodził Jozafata, a Jozafat spłodził Jorama, a Joram spłodził Ozjasza."
"Mt1,9": "Ozjasz spłodził Joatama, a Joatam spłodził Achaza, a Achaz spłodził Ezechiasza."
"Mt1,10": "Ezechiasz spłodził Manassesa, a Manasses spłodził Amona, a Amon spłodził Josjasza."
"Mt1,11": "A Josjasz spłodził Jechoniasza i jego braci w czasie przesiedlenia do Babilonu."
"Mt1,12": "A po przesiedleniu do Babilonu Jechoniasz spłodził Salatiela, a Salatiel spłodził Zorobabela."
"Mt1,13": "A Zorobabel spłodził Abiuda, a Abiud spłodził Eliakima, a Eliakim spłodził Azora."
"Mt1,14": "Azor spłodził Sadoka, a Sadok spłodził Achima, a Achim spłodził Eliuda."
"Mt1,15": "A Eliud spłodził Eleazara, a Eleazar spłodził Matana, a Matan spłodził Jakuba."
"Mt1,16": "Jakub spłodził Józefa, męża Marii, z której został zrodzony Jezus, zwany Mesjaszem."
"Mt1,17": "Wszystkich więc pokoleń od Abrahama aż do Dawida – pokoleń czternaście; a od Dawida aż do przesiedlenia do Babilonu – pokoleń czternaście; a od przesiedlenia do Babilonu aż do Mesjasza – pokoleń czternaście."
"Mt1,18": "A z narodzeniem Jezusa – Mesjasza było tak: Gdy matka Jego, Maria, poślubiła Józefa, okazało się, zanim połączyli się razem, że była w ciąży z Ducha Świętego."
"Mt1,19": "Józef natomiast, jej mąż, będąc sprawiedliwym i nie chcąc jej zniesławić, chciał ją potajemnie oddalić."
"Mt1,20": "A gdy on to rozważył, oto anioł PANA ukazał mu się we śnie, mówiąc: Józefie, synu Dawida! Nie bój się przyjąć Marii, swojej żony. Bo to, co w niej zaistniało, jest z Ducha Świętego."
"Mt1,21": "Urodzi więc syna i nazwiesz Go imieniem Jezus; bo On zbawi swój lud od jego grzechów."
"Mt1,22": "A to wszystko stało się, aby wypełniło się to, co zostało powiedziane przez PANA poprzez proroka, mówiącego:"
"Mt1,23": "Oto dziewica będzie w ciąży i urodzi syna, i nazwą Go imieniem Emmanuel, co jest tłumaczone: Bóg z nami."
"Mt1,24": "A gdy Józef obudził się ze snu, uczynił jak mu rozkazał anioł PANA i przyjął swoją żonę,"
"Mt1,25": "I nie współżył z nią, aż urodziła swojego pierworodnego syna i nazwał Go imieniem Jezus."
