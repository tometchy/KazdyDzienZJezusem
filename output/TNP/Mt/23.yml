"Mt23,1": "Wtedy Jezus powiedział do tłumów i do swoich uczniów, mówiąc:"
"Mt23,2": "Na katedrze Mojżesza zasiedli uczeni w Piśmie i faryzeusze."
"Mt23,3": "Dlatego wszystko, cokolwiek by wam powiedzieli by zachowywać, zachowujcie i czyńcie, ale według uczynków ich nie postępujcie; albowiem oni mówią, a nie czynią."
"Mt23,4": "Bo wiążą ciężkie i trudne do uniesienia brzemiona, i kładą je na ramiona ludzi, lecz nawet swoim palcem nie chcą ich ruszyć."
"Mt23,5": "A wszystkie swoje dzieła pełnią tak, aby byli widziani przez ludzi. Poszerzają bowiem swoje rzemyki modlitewne i przedłużają frędzle swoich płaszczów,"
"Mt23,6": "I lubią pierwsze miejsca na wieczerzach i pierwsze siedzenia w synagogach,"
"Mt23,7": "I pozdrowienia na rynkach, i bycie przez ludzi nazywanymi: Rabbi, Rabbi!"
"Mt23,8": "Ale wy nie pozwalajcie nazywać siebie Rabbi; albowiem jeden jest wasz Mistrz, Mesjasz; a wy wszyscy jesteście braćmi."
"Mt23,9": "I nikogo na ziemi nie nazywajcie swoim ojcem; albowiem jeden jest Ojciec wasz, który jest w niebiosach."
"Mt23,10": "I nie pozwalajcie nazywać siebie mistrzami; jeden bowiem jest wasz Mistrz, Mesjasz."
"Mt23,11": "Natomiast kto jest największy wśród was, niech będzie waszym sługą."
"Mt23,12": "A kto będzie siebie wywyższał, zostanie poniżony; a kto samego siebie uniży, zostanie wywyższony."
"Mt23,13": "Lecz biada wam, uczeni w Piśmie i faryzeusze, obłudnicy! Albowiem zamykacie Królestwo Niebios przed ludźmi; wy nie wchodzicie, a wchodzącym nie pozwalacie wejść."
"Mt23,14": "Biada wam, uczeni w Piśmie i faryzeusze, obłudnicy! Albowiem pożeracie domy wdów, i to pod pozorem długich modlitw, dlatego większy wyrok otrzymacie."
"Mt23,15": "Biada wam, uczeni w Piśmie i faryzeusze, obłudnicy! Obchodzicie bowiem morze i suchy ląd, aby jednego uczynić prozelitą, a gdy nim zostanie, czynicie go synem Gehenny, dwa razy bardziej niż wy."
"Mt23,16": "Biada wam, ślepi przewodnicy! Którzy mówicie: Kto przysiągłby na świątynię, to nic; ale kto przysiągłby na złoto w świątyni, ten jest zobowiązany przysięgą."
"Mt23,17": "Głupi i ślepi! Albowiem co jest większe, złoto czy świątynia, która uświęca złoto?"
"Mt23,18": "A kto przysiągłby na ołtarz, to nic; lecz kto przysiągłby na dar ofiarny, który jest na nim, ten jest zobowiązany przysięgą."
"Mt23,19": "Głupi i ślepi! Co bowiem jest większe, dar ofiarny czy ołtarz, który uświęca ten dar?"
"Mt23,20": "Kto więc przysięga na ołtarz, przysięga na niego i na wszystko, co na nim jest;"
"Mt23,21": "A kto przysięga na świątynię, przysięga na nią i na Tego, który w niej mieszka;"
"Mt23,22": "A kto przysięga na niebo, przysięga na tron Boga i na Tego, który na nim zasiada."
"Mt23,23": "Biada wam, uczeni w Piśmie i faryzeusze, obłudnicy! Dajecie bowiem dziesięcinę z mięty i z anyżu, i z kminu, a opuszczacie ważniejsze rzeczy w Prawie: sąd, miłosierdzie i wiarę; te rzeczy należy czynić, a tamtych nie opuszczać."
"Mt23,24": "Ślepi przewodnicy! Przecedzacie komara, a połykacie wielbłąda."
"Mt23,25": "Biada wam, uczeni w Piśmie i faryzeusze, obłudnicy! Oczyszczacie bowiem zewnątrz kubek i misę, a wewnątrz one są pełne tego, co pochodzi z grabieży i niepowściągliwości."
"Mt23,26": "Ślepy faryzeuszu! Oczyść najpierw to, co jest wewnątrz kubka i misy, aby i to, co jest na zewnątrz nich, stało się czyste."
"Mt23,27": "Biada wam, uczeni w Piśmie i faryzeusze, obłudnicy! Bo podobni jesteście grobom pobielanym, które na zewnątrz wprawdzie widziane są jako piękne, ale wewnątrz pełne są kości umarłych i wszelkiej nieczystości."
"Mt23,28": "Tak i wy, na zewnątrz wprawdzie ukazujecie się ludziom jako sprawiedliwi, ale wewnątrz pełni jesteście obłudy i bezprawia."
"Mt23,29": "Biada wam, uczeni w Piśmie i faryzeusze, obłudnicy! Budujecie bowiem groby proroków i zdobicie nagrobki sprawiedliwych."
"Mt23,30": "I mówicie: Gdybyśmy żyli za dni naszych ojców, nie bylibyśmy ich wspólnikami w przelaniu krwi proroków."
"Mt23,31": "A tak sami o sobie świadczycie, że jesteście synami tych, którzy pozabijali proroków;"
"Mt23,32": "Dopełnijcie i wy miary swoich ojców."
"Mt23,33": "Węże! Płody żmij! Jak uciekniecie przed sądem Gehenny?"
"Mt23,34": "Oto dlatego, ja posyłam do was proroków i mędrców, i uczonych w Piśmie, a niektórych z nich zabijecie i ukrzyżujecie, i niektórych ubiczujecie w swoich synagogach, i będziecie ich prześladować z miasta do miasta;"
"Mt23,35": "Aby przyszła na was cała sprawiedliwa krew, wylana na ziemi od krwi sprawiedliwego Abla aż do krwi Zachariasza, syna Barachiasza, którego zabiliście między świątynią a ołtarzem."
"Mt23,36": "Zaprawdę mówię wam: To wszystko przyjdzie na to pokolenie."
"Mt23,37": "Jeruzalem! Jeruzalem! Które zabijasz proroków i kamienujesz tych, którzy do ciebie są posyłani, ile to razy chciałem zgromadzić twoje dzieci, jak kwoka zgromadza swoje pisklęta pod skrzydła, a nie chcieliście."
"Mt23,38": "Oto wasz dom jest zostawiony wam pusty."
"Mt23,39": "Albowiem mówię wam, że nie ujrzycie mnie od teraz, aż do czasu, gdy powiecie: Błogosławiony, który przychodzi w imieniu PANA."
