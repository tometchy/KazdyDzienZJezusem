"Mt23,1":
  text: "Wtedy Jezus powiedział do tłumów i do swoich uczniów, mówiąc:"
  tags: []
"Mt23,2":
  text: "Na katedrze Mojżesza zasiedli uczeni w Piśmie i faryzeusze."
  tags: []
"Mt23,3":
  text: "Dlatego wszystko, cokolwiek by wam powiedzieli by zachowywać, zachowujcie i czyńcie, ale według uczynków ich nie postępujcie; albowiem oni mówią, a nie czynią."
  tags: []
"Mt23,4":
  text: "Bo wiążą ciężkie i trudne do uniesienia brzemiona, i kładą je na ramiona ludzi, lecz nawet swoim palcem nie chcą ich ruszyć."
  tags: []
"Mt23,5":
  text: "A wszystkie swoje dzieła pełnią tak, aby byli widziani przez ludzi. Poszerzają bowiem swoje rzemyki modlitewne i przedłużają frędzle swoich płaszczów,"
  tags: []
"Mt23,6":
  text: "I lubią pierwsze miejsca na wieczerzach i pierwsze siedzenia w synagogach,"
  tags: []
"Mt23,7":
  text: "I pozdrowienia na rynkach, i bycie przez ludzi nazywanymi: Rabbi, Rabbi!"
  tags: []
"Mt23,8":
  text: "Ale wy nie pozwalajcie nazywać siebie Rabbi; albowiem jeden jest wasz Mistrz, Mesjasz; a wy wszyscy jesteście braćmi."
  tags: []
"Mt23,9":
  text: "I nikogo na ziemi nie nazywajcie swoim ojcem; albowiem jeden jest Ojciec wasz, który jest w niebiosach."
  tags: []
"Mt23,10":
  text: "I nie pozwalajcie nazywać siebie mistrzami; jeden bowiem jest wasz Mistrz, Mesjasz."
  tags: []
"Mt23,11":
  text: "Natomiast kto jest największy wśród was, niech będzie waszym sługą."
  tags: []
"Mt23,12":
  text: "A kto będzie siebie wywyższał, zostanie poniżony; a kto samego siebie uniży, zostanie wywyższony."
  tags: []
"Mt23,13":
  text: "Lecz biada wam, uczeni w Piśmie i faryzeusze, obłudnicy! Albowiem zamykacie Królestwo Niebios przed ludźmi; wy nie wchodzicie, a wchodzącym nie pozwalacie wejść."
  tags: []
"Mt23,14":
  text: "Biada wam, uczeni w Piśmie i faryzeusze, obłudnicy! Albowiem pożeracie domy wdów, i to pod pozorem długich modlitw, dlatego większy wyrok otrzymacie."
  tags: []
"Mt23,15":
  text: "Biada wam, uczeni w Piśmie i faryzeusze, obłudnicy! Obchodzicie bowiem morze i suchy ląd, aby jednego uczynić prozelitą, a gdy nim zostanie, czynicie go synem Gehenny, dwa razy bardziej niż wy."
  tags: []
"Mt23,16":
  text: "Biada wam, ślepi przewodnicy! Którzy mówicie: Kto przysiągłby na świątynię, to nic; ale kto przysiągłby na złoto w świątyni, ten jest zobowiązany przysięgą."
  tags: []
"Mt23,17":
  text: "Głupi i ślepi! Albowiem co jest większe, złoto czy świątynia, która uświęca złoto?"
  tags: []
"Mt23,18":
  text: "A kto przysiągłby na ołtarz, to nic; lecz kto przysiągłby na dar ofiarny, który jest na nim, ten jest zobowiązany przysięgą."
  tags: []
"Mt23,19":
  text: "Głupi i ślepi! Co bowiem jest większe, dar ofiarny czy ołtarz, który uświęca ten dar?"
  tags: []
"Mt23,20":
  text: "Kto więc przysięga na ołtarz, przysięga na niego i na wszystko, co na nim jest;"
  tags: []
"Mt23,21":
  text: "A kto przysięga na świątynię, przysięga na nią i na Tego, który w niej mieszka;"
  tags: []
"Mt23,22":
  text: "A kto przysięga na niebo, przysięga na tron Boga i na Tego, który na nim zasiada."
  tags: []
"Mt23,23":
  text: "Biada wam, uczeni w Piśmie i faryzeusze, obłudnicy! Dajecie bowiem dziesięcinę z mięty i z anyżu, i z kminu, a opuszczacie ważniejsze rzeczy w Prawie: sąd, miłosierdzie i wiarę; te rzeczy należy czynić, a tamtych nie opuszczać."
  tags: []
"Mt23,24":
  text: "Ślepi przewodnicy! Przecedzacie komara, a połykacie wielbłąda."
  tags: []
"Mt23,25":
  text: "Biada wam, uczeni w Piśmie i faryzeusze, obłudnicy! Oczyszczacie bowiem zewnątrz kubek i misę, a wewnątrz one są pełne tego, co pochodzi z grabieży i niepowściągliwości."
  tags: []
"Mt23,26":
  text: "Ślepy faryzeuszu! Oczyść najpierw to, co jest wewnątrz kubka i misy, aby i to, co jest na zewnątrz nich, stało się czyste."
  tags: []
"Mt23,27":
  text: "Biada wam, uczeni w Piśmie i faryzeusze, obłudnicy! Bo podobni jesteście grobom pobielanym, które na zewnątrz wprawdzie widziane są jako piękne, ale wewnątrz pełne są kości umarłych i wszelkiej nieczystości."
  tags: []
"Mt23,28":
  text: "Tak i wy, na zewnątrz wprawdzie ukazujecie się ludziom jako sprawiedliwi, ale wewnątrz pełni jesteście obłudy i bezprawia."
  tags: []
"Mt23,29":
  text: "Biada wam, uczeni w Piśmie i faryzeusze, obłudnicy! Budujecie bowiem groby proroków i zdobicie nagrobki sprawiedliwych."
  tags: []
"Mt23,30":
  text: "I mówicie: Gdybyśmy żyli za dni naszych ojców, nie bylibyśmy ich wspólnikami w przelaniu krwi proroków."
  tags: []
"Mt23,31":
  text: "A tak sami o sobie świadczycie, że jesteście synami tych, którzy pozabijali proroków;"
  tags: []
"Mt23,32":
  text: "Dopełnijcie i wy miary swoich ojców."
  tags: []
"Mt23,33":
  text: "Węże! Płody żmij! Jak uciekniecie przed sądem Gehenny?"
  tags: []
"Mt23,34":
  text: "Oto dlatego, ja posyłam do was proroków i mędrców, i uczonych w Piśmie, a niektórych z nich zabijecie i ukrzyżujecie, i niektórych ubiczujecie w swoich synagogach, i będziecie ich prześladować z miasta do miasta;"
  tags: []
"Mt23,35":
  text: "Aby przyszła na was cała sprawiedliwa krew, wylana na ziemi od krwi sprawiedliwego Abla aż do krwi Zachariasza, syna Barachiasza, którego zabiliście między świątynią a ołtarzem."
  tags: []
"Mt23,36":
  text: "Zaprawdę mówię wam: To wszystko przyjdzie na to pokolenie."
  tags: []
"Mt23,37":
  text: "Jeruzalem! Jeruzalem! Które zabijasz proroków i kamienujesz tych, którzy do ciebie są posyłani, ile to razy chciałem zgromadzić twoje dzieci, jak kwoka zgromadza swoje pisklęta pod skrzydła, a nie chcieliście."
  tags: []
"Mt23,38":
  text: "Oto wasz dom jest zostawiony wam pusty."
  tags: []
"Mt23,39":
  text: "Albowiem mówię wam, że nie ujrzycie mnie od teraz, aż do czasu, gdy powiecie: Błogosławiony, który przychodzi w imieniu PANA."
  tags: []
