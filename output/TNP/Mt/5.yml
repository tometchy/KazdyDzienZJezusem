"Mt5,1":
  text: "A Jezus, widząc tłumy, wszedł na górę, a gdy On usiadł, podeszli do Niego Jego uczniowie."
  tags: []
"Mt5,2":
  text: "I otworzył swoje usta, i uczył ich, mówiąc:"
  tags: []
"Mt5,3":
  text: "Błogosławieni ubodzy duchem, gdyż ich jest Królestwo Niebios."
  tags: []
"Mt5,4":
  text: "Błogosławieni, którzy się smucą, gdyż oni zostaną pocieszeni."
  tags: []
"Mt5,5":
  text: "Błogosławieni łagodni, gdyż oni odziedziczą ziemię."
  tags: []
"Mt5,6":
  text: "Błogosławieni, którzy łakną i pragną sprawiedliwości, gdyż oni zostaną nasyceni."
  tags: []
"Mt5,7":
  text: "Błogosławieni miłosierni, gdyż oni dostąpią miłosierdzia."
  tags: []
"Mt5,8":
  text: "Błogosławieni czystego serca, gdyż oni zobaczą Boga."
  tags: []
"Mt5,9":
  text: "Błogosławieni czyniący pokój, gdyż oni zostaną nazwani synami Boga."
  tags: []
"Mt5,10":
  text: "Błogosławieni, którzy są prześladowani z powodu sprawiedliwości, gdyż ich jest Królestwo Niebios."
  tags: []
"Mt5,11":
  text: "Błogosławieni jesteście, gdy ze względu na mnie będą was lżyć i prześladować, i mówić wszystkie złe słowa, kłamiąc przeciwko wam."
  tags: []
"Mt5,12":
  text: "Radujcie się i weselcie się, gdyż wielka jest zapłata wasza w niebiosach; tak bowiem prześladowali proroków, którzy byli przed wami."
  tags: []
"Mt5,13":
  text: "Wy jesteście solą ziemi; natomiast jeśli sól straci swój smak, czym ją posolą? Nie ma już nic ze swej siły, nadaje się tylko by zostać wyrzuconą na zewnątrz i deptaną przez ludzi."
  tags: []
"Mt5,14":
  text: "Wy jesteście światłem świata. Nie może zostać ukryte miasto leżące na górze."
  tags: []
"Mt5,15":
  text: "Nie zapalają też lampy i nie stawiają jej pod korcem, ale na świeczniku, i świeci wszystkim, którzy są w domu."
  tags: []
"Mt5,16":
  text: "Tak niech świeci wasza światłość przed ludźmi, aby zobaczyli wasze dobre czyny i sławili Ojca waszego, który jest w niebiosach."
  tags: []
"Mt5,17":
  text: "Nie myślcie, że przyszedłem znieść Prawo lub Proroków. Nie przyszedłem znieść, ale wypełnić."
  tags: []
"Mt5,18":
  text: "Zaprawdę bowiem mówię wam: Dopóki nie przeminą niebo i ziemia, ani jedna jota, ani jedna kreska z pewnością nie przeminie z Prawa, aż się to wszystko stanie."
  tags: []
"Mt5,19":
  text: "Jeśli więc ktoś, rozwiązałby jedno z tych najmniejszych przykazań i tak nauczał ludzi, zostanie nazwany najmniejszym w Królestwie Niebios, a ten, kto by czynił je i nauczał, zostanie nazwany wielkim w Królestwie Niebios."
  tags: []
"Mt5,20":
  text: "Mówię bowiem wam: Jeśli wasza sprawiedliwość nie będzie obfitować bardziej niż uczonych w Piśmie i faryzeuszów, z pewnością nie wejdziecie do Królestwa Niebios."
  tags: []
"Mt5,21":
  text: "Słyszeliście, że powiedziano przodkom: Nie będziesz mordował; a kto by mordował, będzie podlegał sądowi."
  tags: []
"Mt5,22":
  text: "A ja wam mówię, że każdy, kto jest rozgniewany na swojego brata bez powodu, będzie winien sądu; a kto powie swojemu bratu: Raka! będzie podlegał Sanhedrynowi; a kto powie: Głupcze! będzie wrzucony w ogień Gehenny."
  tags: []
"Mt5,23":
  text: "Jeśli więc przyniósłbyś swój dar na ołtarz i tam przypomniano by ci, że twój brat ma coś przeciwko tobie;"
  tags: []
"Mt5,24":
  text: "Zostaw tam swój dar przed ołtarzem, i odejdź; najpierw pojednaj się ze swoim bratem, a potem przyjdź i przynieś swój dar."
  tags: []
"Mt5,25":
  text: "Bądź tym, który godzi się szybko ze swoim przeciwnikiem, dopóki jesteś z nim w drodze, by czasem przeciwnik nie przekazał cię sędziemu, a sędzia nie przekazał cię podwładnemu, abyś nie został wrzucony do więzienia."
  tags: []
"Mt5,26":
  text: "Zaprawdę mówię ci: Na pewno nie wyjdziesz stamtąd, aż oddasz ostatni kodrantes."
  tags: []
"Mt5,27":
  text: "Słyszeliście, że powiedziano przodkom: Nie będziesz cudzołożył."
  tags: []
"Mt5,28":
  text: "A ja wam mówię, że każdy, kto patrzy na kobietę, aby jej pożądać, już z nią popełnił cudzołóstwo w swoim sercu."
  tags: []
"Mt5,29":
  text: "Jeśli więc twoje prawe oko jest ci powodem upadku, wyłup je i odrzuć od siebie; albowiem pożyteczniej jest dla ciebie, aby zginął jeden z twoich członków, a nie całe twoje ciało zostało wrzucone do Gehenny."
  tags: []
"Mt5,30":
  text: "A jeśli twoja prawa ręka jest ci powodem upadku, odetnij ją i odrzuć od siebie; albowiem pożyteczniej jest dla ciebie, aby zginął jeden z twoich członków, a nie całe twoje ciało zostało wrzucone do Gehenny."
  tags: []
"Mt5,31":
  text: "Powiedziano też, że ktokolwiek oddaliłby swoją żonę, niech jej da zwój rozwodowy."
  tags: []
"Mt5,32":
  text: "A ja wam mówię: Ktokolwiek oddala swoją żonę, poza sprawą nierządu, prowadzi ją do cudzołóstwa, a kto poślubiłby oddaloną, cudzołoży."
  tags: []
"Mt5,33":
  text: "Słyszeliście także, że powiedziano przodkom: Nie będziesz krzywoprzysięgał, ale dotrzymasz PANU swoich przysiąg."
  tags: []
"Mt5,34":
  text: "A ja wam mówię, abyście w ogóle nie przysięgali – ani na niebo, gdyż jest tronem Boga;"
  tags: []
"Mt5,35":
  text: "Ani na ziemię, gdyż jest podnóżkiem Jego stóp; ani na Jerozolimę, gdyż jest miastem wielkiego króla;"
  tags: []
"Mt5,36":
  text: "Ani na swoją głowę nie będziesz przysięgał, gdyż nie możesz jednego włosa uczynić białym albo czarnym."
  tags: []
"Mt5,37":
  text: "A słowo wasze niech będzie: Tak, tak; nie, nie. A co jest ponad to, jest od złego."
  tags: []
"Mt5,38":
  text: "Słyszeliście, że powiedziano: Oko za oko, ząb za ząb."
  tags: []
"Mt5,39":
  text: "A ja wam mówię: Nie sprzeciwiajcie się złemu, ale ku temu, który uderzy cię w twój prawy policzek, zwróć i drugi;"
  tags: []
"Mt5,40":
  text: "A temu, który chce się z tobą procesować i wziąć twoją suknię, zostaw mu i płaszcz."
  tags: []
"Mt5,41":
  text: "A kto by zmusił ciebie, abyś niósł jego ciężar jedną milę, idź z nim i dwie."
  tags: []
"Mt5,42":
  text: "Temu, kto ciebie prosi, dawaj, a od tego, kto chce od ciebie pożyczyć, nie odwracaj się."
  tags: []
"Mt5,43":
  text: "Słyszeliście, że powiedziano: Będziesz miłował swojego bliźniego, a swojego nieprzyjaciela będziesz nienawidził."
  tags: []
"Mt5,44":
  text: "A ja wam mówię: Miłujcie swoich nieprzyjaciół, błogosławcie tych, którzy was przeklinają, dobrze czyńcie tym, którzy was nienawidzą i módlcie się za tych, którzy was fałszywie oskarżają i prześladują was;"
  tags: []
"Mt5,45":
  text: "Abyście stali się synami Ojca waszego, który jest w niebiosach; bo On czyni to, że słońce Jego wschodzi nad złymi i nad dobrymi, i deszcz pada na sprawiedliwych i na niesprawiedliwych."
  tags: []
"Mt5,46":
  text: "Albowiem, jeśli miłujecie tych, którzy was miłują, jaką macie zapłatę? Czy i celnicy tego nie czynią?"
  tags: []
"Mt5,47":
  text: "A jeśli tylko swoich braci byście pozdrawiali, co osobliwego czynicie? Czy i celnicy tego nie czynią?"
  tags: []
"Mt5,48":
  text: "Bądźcie więc doskonali, tak jak Ojciec wasz, który jest w niebiosach jest doskonały."
  tags: []
