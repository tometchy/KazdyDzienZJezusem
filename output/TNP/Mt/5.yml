"Mt5,1": "A Jezus, widząc tłumy, wszedł na górę, a gdy On usiadł, podeszli do Niego Jego uczniowie."
"Mt5,2": "I otworzył swoje usta, i uczył ich, mówiąc:"
"Mt5,3": "Błogosławieni ubodzy duchem, gdyż ich jest Królestwo Niebios."
"Mt5,4": "Błogosławieni, którzy się smucą, gdyż oni zostaną pocieszeni."
"Mt5,5": "Błogosławieni łagodni, gdyż oni odziedziczą ziemię."
"Mt5,6": "Błogosławieni, którzy łakną i pragną sprawiedliwości, gdyż oni zostaną nasyceni."
"Mt5,7": "Błogosławieni miłosierni, gdyż oni dostąpią miłosierdzia."
"Mt5,8": "Błogosławieni czystego serca, gdyż oni zobaczą Boga."
"Mt5,9": "Błogosławieni czyniący pokój, gdyż oni zostaną nazwani synami Boga."
"Mt5,10": "Błogosławieni, którzy są prześladowani z powodu sprawiedliwości, gdyż ich jest Królestwo Niebios."
"Mt5,11": "Błogosławieni jesteście, gdy ze względu na mnie będą was lżyć i prześladować, i mówić wszystkie złe słowa, kłamiąc przeciwko wam."
"Mt5,12": "Radujcie się i weselcie się, gdyż wielka jest zapłata wasza w niebiosach; tak bowiem prześladowali proroków, którzy byli przed wami."
"Mt5,13": "Wy jesteście solą ziemi; natomiast jeśli sól straci swój smak, czym ją posolą? Nie ma już nic ze swej siły, nadaje się tylko by zostać wyrzuconą na zewnątrz i deptaną przez ludzi."
"Mt5,14": "Wy jesteście światłem świata. Nie może zostać ukryte miasto leżące na górze."
"Mt5,15": "Nie zapalają też lampy i nie stawiają jej pod korcem, ale na świeczniku, i świeci wszystkim, którzy są w domu."
"Mt5,16": "Tak niech świeci wasza światłość przed ludźmi, aby zobaczyli wasze dobre czyny i sławili Ojca waszego, który jest w niebiosach."
"Mt5,17": "Nie myślcie, że przyszedłem znieść Prawo lub Proroków. Nie przyszedłem znieść, ale wypełnić."
"Mt5,18": "Zaprawdę bowiem mówię wam: Dopóki nie przeminą niebo i ziemia, ani jedna jota, ani jedna kreska z pewnością nie przeminie z Prawa, aż się to wszystko stanie."
"Mt5,19": "Jeśli więc ktoś, rozwiązałby jedno z tych najmniejszych przykazań i tak nauczał ludzi, zostanie nazwany najmniejszym w Królestwie Niebios, a ten, kto by czynił je i nauczał, zostanie nazwany wielkim w Królestwie Niebios."
"Mt5,20": "Mówię bowiem wam: Jeśli wasza sprawiedliwość nie będzie obfitować bardziej niż uczonych w Piśmie i faryzeuszów, z pewnością nie wejdziecie do Królestwa Niebios."
"Mt5,21": "Słyszeliście, że powiedziano przodkom: Nie będziesz mordował; a kto by mordował, będzie podlegał sądowi."
"Mt5,22": "A ja wam mówię, że każdy, kto jest rozgniewany na swojego brata bez powodu, będzie winien sądu; a kto powie swojemu bratu: Raka! będzie podlegał Sanhedrynowi; a kto powie: Głupcze! będzie wrzucony w ogień Gehenny."
"Mt5,23": "Jeśli więc przyniósłbyś swój dar na ołtarz i tam przypomniano by ci, że twój brat ma coś przeciwko tobie;"
"Mt5,24": "Zostaw tam swój dar przed ołtarzem, i odejdź; najpierw pojednaj się ze swoim bratem, a potem przyjdź i przynieś swój dar."
"Mt5,25": "Bądź tym, który godzi się szybko ze swoim przeciwnikiem, dopóki jesteś z nim w drodze, by czasem przeciwnik nie przekazał cię sędziemu, a sędzia nie przekazał cię podwładnemu, abyś nie został wrzucony do więzienia."
"Mt5,26": "Zaprawdę mówię ci: Na pewno nie wyjdziesz stamtąd, aż oddasz ostatni kodrantes."
"Mt5,27": "Słyszeliście, że powiedziano przodkom: Nie będziesz cudzołożył."
"Mt5,28": "A ja wam mówię, że każdy, kto patrzy na kobietę, aby jej pożądać, już z nią popełnił cudzołóstwo w swoim sercu."
"Mt5,29": "Jeśli więc twoje prawe oko jest ci powodem upadku, wyłup je i odrzuć od siebie; albowiem pożyteczniej jest dla ciebie, aby zginął jeden z twoich członków, a nie całe twoje ciało zostało wrzucone do Gehenny."
"Mt5,30": "A jeśli twoja prawa ręka jest ci powodem upadku, odetnij ją i odrzuć od siebie; albowiem pożyteczniej jest dla ciebie, aby zginął jeden z twoich członków, a nie całe twoje ciało zostało wrzucone do Gehenny."
"Mt5,31": "Powiedziano też, że ktokolwiek oddaliłby swoją żonę, niech jej da zwój rozwodowy."
"Mt5,32": "A ja wam mówię: Ktokolwiek oddala swoją żonę, poza sprawą nierządu, prowadzi ją do cudzołóstwa, a kto poślubiłby oddaloną, cudzołoży."
"Mt5,33": "Słyszeliście także, że powiedziano przodkom: Nie będziesz krzywoprzysięgał, ale dotrzymasz PANU swoich przysiąg."
"Mt5,34": "A ja wam mówię, abyście w ogóle nie przysięgali – ani na niebo, gdyż jest tronem Boga;"
"Mt5,35": "Ani na ziemię, gdyż jest podnóżkiem Jego stóp; ani na Jerozolimę, gdyż jest miastem wielkiego króla;"
"Mt5,36": "Ani na swoją głowę nie będziesz przysięgał, gdyż nie możesz jednego włosa uczynić białym albo czarnym."
"Mt5,37": "A słowo wasze niech będzie: Tak, tak; nie, nie. A co jest ponad to, jest od złego."
"Mt5,38": "Słyszeliście, że powiedziano: Oko za oko, ząb za ząb."
"Mt5,39": "A ja wam mówię: Nie sprzeciwiajcie się złemu, ale ku temu, który uderzy cię w twój prawy policzek, zwróć i drugi;"
"Mt5,40": "A temu, który chce się z tobą procesować i wziąć twoją suknię, zostaw mu i płaszcz."
"Mt5,41": "A kto by zmusił ciebie, abyś niósł jego ciężar jedną milę, idź z nim i dwie."
"Mt5,42": "Temu, kto ciebie prosi, dawaj, a od tego, kto chce od ciebie pożyczyć, nie odwracaj się."
"Mt5,43": "Słyszeliście, że powiedziano: Będziesz miłował swojego bliźniego, a swojego nieprzyjaciela będziesz nienawidził."
"Mt5,44": "A ja wam mówię: Miłujcie swoich nieprzyjaciół, błogosławcie tych, którzy was przeklinają, dobrze czyńcie tym, którzy was nienawidzą i módlcie się za tych, którzy was fałszywie oskarżają i prześladują was;"
"Mt5,45": "Abyście stali się synami Ojca waszego, który jest w niebiosach; bo On czyni to, że słońce Jego wschodzi nad złymi i nad dobrymi, i deszcz pada na sprawiedliwych i na niesprawiedliwych."
"Mt5,46": "Albowiem, jeśli miłujecie tych, którzy was miłują, jaką macie zapłatę? Czy i celnicy tego nie czynią?"
"Mt5,47": "A jeśli tylko swoich braci byście pozdrawiali, co osobliwego czynicie? Czy i celnicy tego nie czynią?"
"Mt5,48": "Bądźcie więc doskonali, tak jak Ojciec wasz, który jest w niebiosach jest doskonały."
