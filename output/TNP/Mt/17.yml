"Mt17,1":
  text: "A po sześciu dniach wziął Jezus Piotra, Jakuba i Jana, jego brata, i wprowadził ich na wysoką górę na osobności."
  tags: []
"Mt17,2":
  text: "I został przemieniony przed nimi, i rozjaśniło się Jego oblicze jak słońce, a szaty Jego stały się białe jak światło."
  tags: []
"Mt17,3":
  text: "I oto zostali ukazani im Mojżesz i Eliasz, wspólnie z Nim rozmawiający."
  tags: []
"Mt17,4":
  text: "A Piotr zwracając się, powiedział do Jezusa: Panie! Dobrze nam tu być; jeśli chcesz, zrobimy tu trzy namioty: Tobie jeden, Mojżeszowi jeden, i Eliaszowi jeden."
  tags: []
"Mt17,5":
  text: "A gdy on jeszcze mówił, oto obłok świetlisty zacienił ich; i oto odezwał się głos z obłoku, mówiący: Ten jest Syn mój umiłowany, w którym mam upodobanie, Jego słuchajcie."
  tags: []
"Mt17,6":
  text: "A uczniowie, gdy to usłyszeli, upadli na swoją twarz i bardzo się bali."
  tags: []
"Mt17,7":
  text: "A gdy podszedł Jezus, dotknął się ich i powiedział: Wstańcie i nie bójcie się."
  tags: []
"Mt17,8":
  text: "A oni podnieśli swoje oczy i nikogo nie widzieli, tylko samego Jezusa."
  tags: []
"Mt17,9":
  text: "A gdy schodzili z góry, przykazał im Jezus, mówiąc: Nikomu nie mówcie o tym widzeniu, aż Syn Człowieczy powstanie z martwych."
  tags: []
"Mt17,10":
  text: "I zapytali Go uczniowie Jego, mówiąc: Dlaczego więc uczeni w Piśmie mówią, że najpierw musi przyjść Eliasz?"
  tags: []
"Mt17,11":
  text: "A Jezus w odpowiedzi, rzekł im: Eliasz istotnie najpierw przyjdzie i wszystko naprawi;"
  tags: []
"Mt17,12":
  text: "Lecz mówię wam: Eliasz już przyszedł, a nie poznali go, ale uczynili z nim, co chcieli; tak i Syn Człowieczy ma cierpieć przez nich."
  tags: []
"Mt17,13":
  text: "Wtedy uczniowie zrozumieli, że mówił im o Janie Chrzcicielu."
  tags: []
"Mt17,14":
  text: "I gdy oni przyszli do ludu, podszedł do Niego człowiek, który upadł przed Nim na kolana,"
  tags: []
"Mt17,15":
  text: "I powiedział: Panie! Zmiłuj się nad moim synem; bo jest epileptykiem i strasznie cierpi; bo często wpada w ogień, i często w wodę."
  tags: []
"Mt17,16":
  text: "I przyprowadziłem go do Twoich uczniów, ale nie mogli go uzdrowić."
  tags: []
"Mt17,17":
  text: "A Jezus w odpowiedzi, rzekł: O pokolenie bez wiary i przewrotne! Jak długo będę z wami? Jak długo będę was znosić? Przynieście mi go tutaj."
  tags: []
"Mt17,18":
  text: "I zgromił go Jezus; i wyszedł z niego demon, i uzdrowiony został chłopiec od tej godziny."
  tags: []
"Mt17,19":
  text: "Wtedy podeszli na osobności uczniowie do Jezusa i powiedzieli do Niego: Dlaczego my nie mogliśmy go wyrzucić?"
  tags: []
"Mt17,20":
  text: "A Jezus powiedział do nich: Z powodu waszej niewiary; zaprawdę bowiem mówię wam: Jeśli macie wiarę jak ziarnko gorczycy, powiecie tej górze: Przenieś się stąd na tamto miejsce, i przeniesie się, a nic nie będzie dla was niemożliwe."
  tags: []
"Mt17,21":
  text: "Natomiast ten rodzaj nie wychodzi inaczej, jak tylko przez modlitwę i post."
  tags: []
"Mt17,22":
  text: "A gdy przebywali w Galilei, Jezus powiedział do nich: Syn Człowieczy ma być wydany w ręce ludzi,"
  tags: []
"Mt17,23":
  text: "I zabiją Go, a trzeciego dnia powstanie z martwych. I bardzo się zasmucili."
  tags: []
"Mt17,24":
  text: "A gdy przyszli do Kafarnaum, podeszli do Piotra poborcy didrachmy i powiedzieli: Czy nauczyciel wasz nie płaci podatku didrachmowego?"
  tags: []
"Mt17,25":
  text: "Powiedział: Tak. A gdy wchodził do domu, uprzedził go Jezus, mówiąc: Jak ci się wydaje, Szymonie? Królowie ziemi od kogo biorą cło albo podatek? Od swoich synów, czy od obcych?"
  tags: []
"Mt17,26":
  text: "Piotr odpowiedział Mu: Od obcych. Jezus powiedział do niego: A więc synowie są wolni."
  tags: []
"Mt17,27":
  text: "Jednak, abyśmy ich nie zgorszyli, idź nad morze i zarzuć haczyk, weź pierwszą wyciągniętą rybę, a gdy otworzysz jej pyszczek, znajdziesz stater; zabierz go i daj im za mnie i za siebie."
  tags: []
