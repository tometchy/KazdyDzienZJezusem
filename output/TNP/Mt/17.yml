"Mt17,1": "A po sześciu dniach wziął Jezus Piotra, Jakuba i Jana, jego brata, i wprowadził ich na wysoką górę na osobności."
"Mt17,2": "I został przemieniony przed nimi, i rozjaśniło się Jego oblicze jak słońce, a szaty Jego stały się białe jak światło."
"Mt17,3": "I oto zostali ukazani im Mojżesz i Eliasz, wspólnie z Nim rozmawiający."
"Mt17,4": "A Piotr zwracając się, powiedział do Jezusa: Panie! Dobrze nam tu być; jeśli chcesz, zrobimy tu trzy namioty: Tobie jeden, Mojżeszowi jeden, i Eliaszowi jeden."
"Mt17,5": "A gdy on jeszcze mówił, oto obłok świetlisty zacienił ich; i oto odezwał się głos z obłoku, mówiący: Ten jest Syn mój umiłowany, w którym mam upodobanie, Jego słuchajcie."
"Mt17,6": "A uczniowie, gdy to usłyszeli, upadli na swoją twarz i bardzo się bali."
"Mt17,7": "A gdy podszedł Jezus, dotknął się ich i powiedział: Wstańcie i nie bójcie się."
"Mt17,8": "A oni podnieśli swoje oczy i nikogo nie widzieli, tylko samego Jezusa."
"Mt17,9": "A gdy schodzili z góry, przykazał im Jezus, mówiąc: Nikomu nie mówcie o tym widzeniu, aż Syn Człowieczy powstanie z martwych."
"Mt17,10": "I zapytali Go uczniowie Jego, mówiąc: Dlaczego więc uczeni w Piśmie mówią, że najpierw musi przyjść Eliasz?"
"Mt17,11": "A Jezus w odpowiedzi, rzekł im: Eliasz istotnie najpierw przyjdzie i wszystko naprawi;"
"Mt17,12": "Lecz mówię wam: Eliasz już przyszedł, a nie poznali go, ale uczynili z nim, co chcieli; tak i Syn Człowieczy ma cierpieć przez nich."
"Mt17,13": "Wtedy uczniowie zrozumieli, że mówił im o Janie Chrzcicielu."
"Mt17,14": "I gdy oni przyszli do ludu, podszedł do Niego człowiek, który upadł przed Nim na kolana,"
"Mt17,15": "I powiedział: Panie! Zmiłuj się nad moim synem; bo jest epileptykiem i strasznie cierpi; bo często wpada w ogień, i często w wodę."
"Mt17,16": "I przyprowadziłem go do Twoich uczniów, ale nie mogli go uzdrowić."
"Mt17,17": "A Jezus w odpowiedzi, rzekł: O pokolenie bez wiary i przewrotne! Jak długo będę z wami? Jak długo będę was znosić? Przynieście mi go tutaj."
"Mt17,18": "I zgromił go Jezus; i wyszedł z niego demon, i uzdrowiony został chłopiec od tej godziny."
"Mt17,19": "Wtedy podeszli na osobności uczniowie do Jezusa i powiedzieli do Niego: Dlaczego my nie mogliśmy go wyrzucić?"
"Mt17,20": "A Jezus powiedział do nich: Z powodu waszej niewiary; zaprawdę bowiem mówię wam: Jeśli macie wiarę jak ziarnko gorczycy, powiecie tej górze: Przenieś się stąd na tamto miejsce, i przeniesie się, a nic nie będzie dla was niemożliwe."
"Mt17,21": "Natomiast ten rodzaj nie wychodzi inaczej, jak tylko przez modlitwę i post."
"Mt17,22": "A gdy przebywali w Galilei, Jezus powiedział do nich: Syn Człowieczy ma być wydany w ręce ludzi,"
"Mt17,23": "I zabiją Go, a trzeciego dnia powstanie z martwych. I bardzo się zasmucili."
"Mt17,24": "A gdy przyszli do Kafarnaum, podeszli do Piotra poborcy didrachmy i powiedzieli: Czy nauczyciel wasz nie płaci podatku didrachmowego?"
"Mt17,25": "Powiedział: Tak. A gdy wchodził do domu, uprzedził go Jezus, mówiąc: Jak ci się wydaje, Szymonie? Królowie ziemi od kogo biorą cło albo podatek? Od swoich synów, czy od obcych?"
"Mt17,26": "Piotr odpowiedział Mu: Od obcych. Jezus powiedział do niego: A więc synowie są wolni."
"Mt17,27": "Jednak, abyśmy ich nie zgorszyli, idź nad morze i zarzuć haczyk, weź pierwszą wyciągniętą rybę, a gdy otworzysz jej pyszczek, znajdziesz stater; zabierz go i daj im za mnie i za siebie."
