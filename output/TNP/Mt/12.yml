"Mt12,1": "W tym czasie Jezus szedł w szabat przez zboża, a Jego uczniowie łaknęli i zaczęli rwać kłosy i jeść."
"Mt12,2": "A gdy ujrzeli to faryzeusze, powiedzieli do Niego: Oto Twoi uczniowie czynią to, czego nie wolno czynić w szabat."
"Mt12,3": "A On powiedział im: Czy nie czytaliście, co uczynił Dawid, gdy łaknął, on i ci, którzy byli z nim?"
"Mt12,4": "Jak wszedł do domu Bożego i jadł chleby ofiarne, których nie wolno było jeść jemu, ani tym, którzy byli z nim, tylko samym kapłanom."
"Mt12,5": "Czy nie czytaliście w Prawie, że w szabat kapłani w świątyni profanują szabat, a są bez winy?"
"Mt12,6": "Ale mówię wam, że tu jest ktoś większy niż świątynia."
"Mt12,7": "A gdybyście wiedzieli, co to jest: Miłosierdzia chcę, a nie ofiary, nie potępilibyście niewinnych."
"Mt12,8": "Albowiem Syn Człowieczy jest Panem i szabatu."
"Mt12,9": "I odszedł stamtąd, i przyszedł do ich synagogi."
"Mt12,10": "I oto był tam człowiek, który miał uschłą rękę. I zapytali Go, mówiąc tak, aby Go oskarżyć: Czy wolno uzdrawiać w szabat?"
"Mt12,11": "A On powiedział im: Kto spośród was okaże się takim człowiekiem, który mając jedną owcę, jeśli mu ta w szabat wpadnie do dołu, nie chwyci jej i nie wyciągnie?"
"Mt12,12": "O ile więc ważniejszy jest człowiek od owcy! Tak więc dozwolone jest dobrze czynić w szabat."
"Mt12,13": "Wtedy powiedział do tego człowieka: Wyciągnij swoją rękę; a on ją wyciągnął i stała się zdrowa jak i druga."
"Mt12,14": "A gdy faryzeusze wyszli, przyjęli plan przeciwko Niemu, by Go zniszczyć."
"Mt12,15": "Jezus więc, mając tego świadomość, odszedł stamtąd, a szły za Nim wielkie tłumy, a On uzdrowił ich wszystkich."
"Mt12,16": "I stanowczo im nakazał, aby Go nie ujawniali."
"Mt12,17": "Aby wypełniło się to, co zostało powiedziane przez proroka Izajasza, mówiącego:"
"Mt12,18": "Oto mój sługa, którego wybrałem, mój Umiłowany, w którym moja dusza znalazła upodobanie. Złożę na Nim mojego Ducha, a On oznajmi sąd narodom;"
"Mt12,19": "Nie będzie się spierał, ani nie będzie krzyczał, i nikt nie usłyszy na ulicach Jego głosu;"
"Mt12,20": "Trzciny zgniecionej nie złamie, a lnu tlącego się nie zagasi, dopóki nie doprowadzi sądu do zwycięstwa;"
"Mt12,21": "A w imieniu Jego narody będą pokładać nadzieję."
"Mt12,22": "Wtedy przyprowadzono do Niego opętanego przez demona, który był ślepy i niemy. I uzdrowił go, tak że ślepy i niemy mówił i widział."
"Mt12,23": "I zdumiały się wszystkie tłumy, i mówiły: Czy Ten nie jest synem Dawida?"
"Mt12,24": "A gdy faryzeusze to usłyszeli, powiedzieli: Ten nie wygania demonów inaczej, jak tylko przez Belzebuba, władcę demonów."
"Mt12,25": "Lecz Jezus, znając ich myśli, powiedział im: Każde królestwo podzielone wewnętrznie, pustoszeje, i każde miasto albo dom, wewnętrznie podzielony, nie ostoi się."
"Mt12,26": "A jeśli szatan wygania szatana, to został wewnątrz podzielony; jak więc ostoi się jego królestwo?"
"Mt12,27": "A jeśli ja przez Belzebuba wyganiam demony, to przez kogo wyganiają wasi synowie? Dlatego oni będą waszymi sędziami."
"Mt12,28": "A jeśli ja przez Ducha Bożego wyganiam demony, wtedy przyszło do was Królestwo Boże."
"Mt12,29": "Albo jak może ktoś wejść do domu mocarza i zagrabić jego rzeczy, jeśli najpierw nie zwiąże mocarza? Dopiero wtedy ograbi jego dom."
"Mt12,30": "Kto nie jest ze mną, jest przeciwko mnie, a kto nie zbiera ze mną, rozprasza."
"Mt12,31": "Dlatego mówię wam: Każdy grzech i bluźnierstwo zostaną ludziom odpuszczone; natomiast bluźnierstwo przeciwko Duchowi nie będzie ludziom odpuszczone."
"Mt12,32": "I ktokolwiek powiedziałby słowo przeciwko Synowi Człowieczemu, zostanie mu odpuszczone; ale kto mówiłby przeciwko Duchowi Świętemu, nie zostanie mu odpuszczone, ani w tym wieku, ani w tym mającym nadejść."
"Mt12,33": "A uczyńcie dobre drzewo, to i owoc jego będzie dobry; albo dopuśćcie by drzewo zgniło, to i jego owoc będzie zgniły. Po owocu bowiem poznaje się drzewo."
"Mt12,34": "Płody żmij! Jak możecie mówić dobrze, będąc złymi? Gdyż z obfitości serca mówią usta."
"Mt12,35": "Dobry człowiek wydobywa z dobrego skarbca serca dobre rzeczy, a zły człowiek wydobywa ze złego skarbca złe rzeczy."
"Mt12,36": "Mówię wam natomiast, że z każdego nieużytecznego słowa, które wypowiedzą ludzie, zdadzą sprawę w dzień sądu;"
"Mt12,37": "Gdyż ze swoich słów zostaniesz uznany za sprawiedliwego, i ze swoich słów zostaniesz potępiony."
"Mt12,38": "Wtedy odpowiedzieli niektórzy z uczonych w Piśmie i z faryzeuszów, mówiąc: Nauczycielu! Chcemy od Ciebie zobaczyć znak."
"Mt12,39": "A On w odpowiedzi, rzekł im: Pokolenie złe i cudzołożne szuka znaku, a znak nie będzie mu dany, chyba że znak proroka Jonasza."
"Mt12,40": "Albowiem tak jak Jonasz był w brzuchu wielkiej ryby trzy dni i trzy noce, tak będzie Syn Człowieczy w sercu ziemi trzy dni i trzy noce."
"Mt12,41": "Mężowie z Niniwy powstaną na sądzie z tym pokoleniem i potępią je, bo upamiętali się wskutek głoszenia Jonasza, a oto tu ktoś więcej niż Jonasz."
"Mt12,42": "Królowa Południa zostanie wzbudzona na sądzie z tym pokoleniem i potępi je, bo przyszła z krańców ziemi, aby słuchać mądrości Salomona, a oto tutaj ktoś więcej niż Salomon."
"Mt12,43": "A gdy nieczysty duch wyjdzie z człowieka, chodzi po miejscach bezwodnych, szukając odpoczynku, ale nie znajduje."
"Mt12,44": "Wtedy mówi: Wrócę do swojego domu, z którego wyszedłem; i przychodząc, znajduje go niezajętym, zamiecionym i przyozdobionym."
"Mt12,45": "Wtedy idzie i bierze z sobą siedem innych duchów gorszych od siebie, i gdy wejdą tam, mieszkają; i końcowy stan tego człowieka jest gorszy, niż początkowy. Tak też będzie i z tym złym pokoleniem."
"Mt12,46": "A gdy On jeszcze mówił do tłumów, oto matka i Jego bracia stali na zewnątrz, szukając sposobności, by z Nim pomówić."
"Mt12,47": "A powiedział do Niego ktoś: Oto Twoja matka i Twoi bracia stoją na zewnątrz, i szukają sposobności, by z Tobą pomówić."
"Mt12,48": "A On w odpowiedzi, rzekł temu, co o tym Mu oznajmił: Kto jest moją matką? I kim są moi bracia?"
"Mt12,49": "I gdy wyciągnął rękę ku swoim uczniom, powiedział: Oto moja matka i moi bracia!"
"Mt12,50": "Ktokolwiek bowiem czyniłby wolę mojego Ojca, który jest w niebiosach, ten jest moim bratem i siostrą, i matką."
