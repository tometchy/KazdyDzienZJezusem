"Mt12,1":
  text: "W tym czasie Jezus szedł w szabat przez zboża, a Jego uczniowie łaknęli i zaczęli rwać kłosy i jeść."
  tags: []
"Mt12,2":
  text: "A gdy ujrzeli to faryzeusze, powiedzieli do Niego: Oto Twoi uczniowie czynią to, czego nie wolno czynić w szabat."
  tags: []
"Mt12,3":
  text: "A On powiedział im: Czy nie czytaliście, co uczynił Dawid, gdy łaknął, on i ci, którzy byli z nim?"
  tags: []
"Mt12,4":
  text: "Jak wszedł do domu Bożego i jadł chleby ofiarne, których nie wolno było jeść jemu, ani tym, którzy byli z nim, tylko samym kapłanom."
  tags: []
"Mt12,5":
  text: "Czy nie czytaliście w Prawie, że w szabat kapłani w świątyni profanują szabat, a są bez winy?"
  tags: []
"Mt12,6":
  text: "Ale mówię wam, że tu jest ktoś większy niż świątynia."
  tags: []
"Mt12,7":
  text: "A gdybyście wiedzieli, co to jest: Miłosierdzia chcę, a nie ofiary, nie potępilibyście niewinnych."
  tags: []
"Mt12,8":
  text: "Albowiem Syn Człowieczy jest Panem i szabatu."
  tags: []
"Mt12,9":
  text: "I odszedł stamtąd, i przyszedł do ich synagogi."
  tags: []
"Mt12,10":
  text: "I oto był tam człowiek, który miał uschłą rękę. I zapytali Go, mówiąc tak, aby Go oskarżyć: Czy wolno uzdrawiać w szabat?"
  tags: []
"Mt12,11":
  text: "A On powiedział im: Kto spośród was okaże się takim człowiekiem, który mając jedną owcę, jeśli mu ta w szabat wpadnie do dołu, nie chwyci jej i nie wyciągnie?"
  tags: []
"Mt12,12":
  text: "O ile więc ważniejszy jest człowiek od owcy! Tak więc dozwolone jest dobrze czynić w szabat."
  tags: []
"Mt12,13":
  text: "Wtedy powiedział do tego człowieka: Wyciągnij swoją rękę; a on ją wyciągnął i stała się zdrowa jak i druga."
  tags: []
"Mt12,14":
  text: "A gdy faryzeusze wyszli, przyjęli plan przeciwko Niemu, by Go zniszczyć."
  tags: []
"Mt12,15":
  text: "Jezus więc, mając tego świadomość, odszedł stamtąd, a szły za Nim wielkie tłumy, a On uzdrowił ich wszystkich."
  tags: []
"Mt12,16":
  text: "I stanowczo im nakazał, aby Go nie ujawniali."
  tags: []
"Mt12,17":
  text: "Aby wypełniło się to, co zostało powiedziane przez proroka Izajasza, mówiącego:"
  tags: []
"Mt12,18":
  text: "Oto mój sługa, którego wybrałem, mój Umiłowany, w którym moja dusza znalazła upodobanie. Złożę na Nim mojego Ducha, a On oznajmi sąd narodom;"
  tags: []
"Mt12,19":
  text: "Nie będzie się spierał, ani nie będzie krzyczał, i nikt nie usłyszy na ulicach Jego głosu;"
  tags: []
"Mt12,20":
  text: "Trzciny zgniecionej nie złamie, a lnu tlącego się nie zagasi, dopóki nie doprowadzi sądu do zwycięstwa;"
  tags: []
"Mt12,21":
  text: "A w imieniu Jego narody będą pokładać nadzieję."
  tags: []
"Mt12,22":
  text: "Wtedy przyprowadzono do Niego opętanego przez demona, który był ślepy i niemy. I uzdrowił go, tak że ślepy i niemy mówił i widział."
  tags: []
"Mt12,23":
  text: "I zdumiały się wszystkie tłumy, i mówiły: Czy Ten nie jest synem Dawida?"
  tags: []
"Mt12,24":
  text: "A gdy faryzeusze to usłyszeli, powiedzieli: Ten nie wygania demonów inaczej, jak tylko przez Belzebuba, władcę demonów."
  tags: []
"Mt12,25":
  text: "Lecz Jezus, znając ich myśli, powiedział im: Każde królestwo podzielone wewnętrznie, pustoszeje, i każde miasto albo dom, wewnętrznie podzielony, nie ostoi się."
  tags: []
"Mt12,26":
  text: "A jeśli szatan wygania szatana, to został wewnątrz podzielony; jak więc ostoi się jego królestwo?"
  tags: []
"Mt12,27":
  text: "A jeśli ja przez Belzebuba wyganiam demony, to przez kogo wyganiają wasi synowie? Dlatego oni będą waszymi sędziami."
  tags: []
"Mt12,28":
  text: "A jeśli ja przez Ducha Bożego wyganiam demony, wtedy przyszło do was Królestwo Boże."
  tags: []
"Mt12,29":
  text: "Albo jak może ktoś wejść do domu mocarza i zagrabić jego rzeczy, jeśli najpierw nie zwiąże mocarza? Dopiero wtedy ograbi jego dom."
  tags: []
"Mt12,30":
  text: "Kto nie jest ze mną, jest przeciwko mnie, a kto nie zbiera ze mną, rozprasza."
  tags: []
"Mt12,31":
  text: "Dlatego mówię wam: Każdy grzech i bluźnierstwo zostaną ludziom odpuszczone; natomiast bluźnierstwo przeciwko Duchowi nie będzie ludziom odpuszczone."
  tags: []
"Mt12,32":
  text: "I ktokolwiek powiedziałby słowo przeciwko Synowi Człowieczemu, zostanie mu odpuszczone; ale kto mówiłby przeciwko Duchowi Świętemu, nie zostanie mu odpuszczone, ani w tym wieku, ani w tym mającym nadejść."
  tags: []
"Mt12,33":
  text: "A uczyńcie dobre drzewo, to i owoc jego będzie dobry; albo dopuśćcie by drzewo zgniło, to i jego owoc będzie zgniły. Po owocu bowiem poznaje się drzewo."
  tags: []
"Mt12,34":
  text: "Płody żmij! Jak możecie mówić dobrze, będąc złymi? Gdyż z obfitości serca mówią usta."
  tags: []
"Mt12,35":
  text: "Dobry człowiek wydobywa z dobrego skarbca serca dobre rzeczy, a zły człowiek wydobywa ze złego skarbca złe rzeczy."
  tags: []
"Mt12,36":
  text: "Mówię wam natomiast, że z każdego nieużytecznego słowa, które wypowiedzą ludzie, zdadzą sprawę w dzień sądu;"
  tags: []
"Mt12,37":
  text: "Gdyż ze swoich słów zostaniesz uznany za sprawiedliwego, i ze swoich słów zostaniesz potępiony."
  tags: []
"Mt12,38":
  text: "Wtedy odpowiedzieli niektórzy z uczonych w Piśmie i z faryzeuszów, mówiąc: Nauczycielu! Chcemy od Ciebie zobaczyć znak."
  tags: []
"Mt12,39":
  text: "A On w odpowiedzi, rzekł im: Pokolenie złe i cudzołożne szuka znaku, a znak nie będzie mu dany, chyba że znak proroka Jonasza."
  tags: []
"Mt12,40":
  text: "Albowiem tak jak Jonasz był w brzuchu wielkiej ryby trzy dni i trzy noce, tak będzie Syn Człowieczy w sercu ziemi trzy dni i trzy noce."
  tags: []
"Mt12,41":
  text: "Mężowie z Niniwy powstaną na sądzie z tym pokoleniem i potępią je, bo upamiętali się wskutek głoszenia Jonasza, a oto tu ktoś więcej niż Jonasz."
  tags: []
"Mt12,42":
  text: "Królowa Południa zostanie wzbudzona na sądzie z tym pokoleniem i potępi je, bo przyszła z krańców ziemi, aby słuchać mądrości Salomona, a oto tutaj ktoś więcej niż Salomon."
  tags: []
"Mt12,43":
  text: "A gdy nieczysty duch wyjdzie z człowieka, chodzi po miejscach bezwodnych, szukając odpoczynku, ale nie znajduje."
  tags: []
"Mt12,44":
  text: "Wtedy mówi: Wrócę do swojego domu, z którego wyszedłem; i przychodząc, znajduje go niezajętym, zamiecionym i przyozdobionym."
  tags: []
"Mt12,45":
  text: "Wtedy idzie i bierze z sobą siedem innych duchów gorszych od siebie, i gdy wejdą tam, mieszkają; i końcowy stan tego człowieka jest gorszy, niż początkowy. Tak też będzie i z tym złym pokoleniem."
  tags: []
"Mt12,46":
  text: "A gdy On jeszcze mówił do tłumów, oto matka i Jego bracia stali na zewnątrz, szukając sposobności, by z Nim pomówić."
  tags: []
"Mt12,47":
  text: "A powiedział do Niego ktoś: Oto Twoja matka i Twoi bracia stoją na zewnątrz, i szukają sposobności, by z Tobą pomówić."
  tags: []
"Mt12,48":
  text: "A On w odpowiedzi, rzekł temu, co o tym Mu oznajmił: Kto jest moją matką? I kim są moi bracia?"
  tags: []
"Mt12,49":
  text: "I gdy wyciągnął rękę ku swoim uczniom, powiedział: Oto moja matka i moi bracia!"
  tags: []
"Mt12,50":
  text: "Ktokolwiek bowiem czyniłby wolę mojego Ojca, który jest w niebiosach, ten jest moim bratem i siostrą, i matką."
  tags: []
