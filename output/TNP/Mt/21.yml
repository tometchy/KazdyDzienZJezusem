"Mt21,1": "I gdy przybliżyli się do Jerozolimy, i przyszli do Betfage, pod Górą Oliwną, wtedy Jezus wysłał dwóch uczniów,"
"Mt21,2": "Mówiąc im: Idźcie do miasteczka, które jest przed wami, a zaraz znajdziecie oślicę uwiązaną, a z nią oślątko; odwiążcie i przyprowadźcie je do mnie."
"Mt21,3": "A gdyby wam ktoś coś mówił, powiedzcie, że Pan ich potrzebuje; jednak zaraz je odeśle."
"Mt21,4": "A to wszystko stało się, aby wypełniło się to, co zostało powiedziane przez proroka, gdy mówi:"
"Mt21,5": "Powiedzcie córce Syjonu: Oto twój Król przychodzi do ciebie, łagodny i siedzący na ośle, na oślątku, źrebięciu oślicy będącej pod jarzmem."
"Mt21,6": "I uczniowie poszli i uczynili tak, jak im rozkazał Jezus,"
"Mt21,7": "Przyprowadzili oślicę i oślątko, i włożyli na nie swoje szaty, i usadowili Go na nich."
"Mt21,8": "A bardzo wielki tłum słał swoje szaty na drodze, a inni obcinali gałązki z drzew i słali je na drodze."
"Mt21,9": "A tłumy idące przed Nim i za Nim wołały, mówiąc: Hosanna Synowi Dawida! Błogosławiony, który przychodzi w imieniu PANA! Hosanna na wysokościach!"
"Mt21,10": "I gdy przybył do Jerozolimy, całe miasto zostało poruszone, mówiono: Kto to jest?"
"Mt21,11": "Tłumy natomiast mówiły: To jest Jezus, prorok z Nazaretu w Galilei."
"Mt21,12": "A Jezus wszedł do świątyni Bożej, i wyrzucił wszystkich sprzedających i kupujących w świątyni; poprzewracał stoły tych, którzy pieniądze wymieniali, i ławy sprzedających gołębie."
"Mt21,13": "I powiedział im: Napisano: Mój dom zostanie nazwany domem modlitwy; a wy uczyniliście z niego jaskinię zbójców."
"Mt21,14": "I przystąpili do Niego w świątyni ślepi i kulawi, i uzdrowił ich."
"Mt21,15": "A widząc arcykapłani i uczeni w Piśmie przedziwne dzieła, które czynił, i chłopców wołających w świątyni, i mówiących: Hosanna Synowi Dawida, oburzyli się,"
"Mt21,16": "I powiedzieli do Niego: Czy słyszysz, co oni mówią? A Jezus powiedział im: Tak, czy nigdy nie czytaliście: Z ust niemowląt i ssących zgotowałeś sobie chwałę?"
"Mt21,17": "A gdy ich opuścił, wyszedł z miasta do Betanii, i tam zanocował."
"Mt21,18": "A rano wracając do miasta, poczuł głód."
"Mt21,19": "I zobaczył przy drodze jeden figowiec, i podszedł do niego, i nie znalazł na nim nic, tylko same liście, i powiedział do niego: Niech więcej nie zrodzi się z ciebie owoc na wieki. I natychmiast usechł figowiec."
"Mt21,20": "A gdy ujrzeli to uczniowie, dziwili się, mówiąc: Jak szybko usechł ten figowiec!"
"Mt21,21": "A Jezus w odpowiedzi, rzekł im: Zaprawdę mówię wam: Jeśli mielibyście wiarę i nie wątpili, nie tylko to, co stało się z figowcem, uczynicie, ale gdybyście i tej górze powiedzieli: Podnieś się i rzuć się w morze, to stanie się tak."
"Mt21,22": "I wszystko, o cokolwiek prosilibyście w modlitwie, wierząc, otrzymacie."
"Mt21,23": "A gdy On przyszedł do świątyni, zbliżyli się do Niego, gdy nauczał, arcykapłani i starsi ludu, mówiąc: Jakim prawem to czynisz? I kto Ci dał to prawo?"
"Mt21,24": "A Jezus w odpowiedzi, rzekł im: Spytam i ja was o jedną rzecz, na którą jeśli mi odpowiecie, i ja wam odpowiem, jakim prawem to czynię."
"Mt21,25": "Skąd był chrzest Jana? Z nieba, czy od ludzi? A oni rozważali to w sobie i mówili: Jeśli powiemy: Z nieba, powie nam: Dlaczego więc mu nie uwierzyliście?"
"Mt21,26": "Jeśli powiemy: Od ludzi, boimy się ludu; bo wszyscy mają Jana za proroka."
"Mt21,27": "A w odpowiedzi, rzekli Jezusowi: Nie wiemy. Powiedział im i On: To i ja wam nie powiem, jakim prawem to czynię."
"Mt21,28": "Ale co się wam wydaje? Pewien człowiek miał dwoje dzieci; i gdy podszedł do pierwszego, powiedział: Dziecko! Idź, pracuj dziś w mojej winnicy."
"Mt21,29": "A on w odpowiedzi, rzekł: Nie chcę, ale potem odczuł żal z tego powodu, i poszedł."
"Mt21,30": "I gdy podszedł do drugiego, powiedział tak samo. A on w odpowiedzi, rzekł: Ja idę, panie! Ale nie poszedł."
"Mt21,31": "Który z tych dwóch uczynił wolę ojca? Powiedzieli do Niego: Pierwszy. Jezus powiedział im: Zaprawdę mówię wam, że celnicy i nierządnice wyprzedzają was do Królestwa Bożego."
"Mt21,32": "Albowiem Jan przyszedł do was drogą sprawiedliwości, a nie uwierzyliście mu, ale celnicy i nierządnice mu uwierzyli; a wy chociaż to widzieliście, jednak nie odczuliście później żalu, aby mu uwierzyć."
"Mt21,33": "Posłuchajcie innego podobieństwa: Był pewien gospodarz, który zasadził winnicę i ogrodził ją dookoła płotem, wykopał w niej tłocznię, zbudował wieżę, przekazał ją rolnikom i odjechał."
"Mt21,34": "A gdy przybliżył się czas owocowania, posłał swoje sługi do rolników, aby odebrali jego plony."
"Mt21,35": "A rolnicy, gdy pojmali jego sługi, jednego dotkliwie wychłostali, drugiego zabili, a trzeciego ukamienowali."
"Mt21,36": "Znowu posłał inne sługi, więcej niż za pierwszym razem, i to samo uczynili z nimi."
"Mt21,37": "A w końcu posłał do nich swojego syna, mówiąc: Uszanują mojego syna."
"Mt21,38": "Lecz rolnicy, gdy ujrzeli syna, powiedzieli sobie: To jest dziedzic; pójdźmy, zabijmy go, a zatrzymamy dla siebie jego dziedzictwo."
"Mt21,39": "I wzięli go, i wyrzucili go poza winnicę, i zabili."
"Mt21,40": "Gdy więc przyjdzie pan winnicy, co uczyni tym rolnikom?"
"Mt21,41": "Mówią do Niego: Złych srogo wygubi, a winnicę wynajmie innym rolnikom, którzy we właściwym czasie oddawać mu będą swoje plony."
"Mt21,42": "Jezus powiedział im: Czy nigdy nie czytaliście w Pismach: Kamień, który odrzucili budujący, stał się głowicą węgła; PAN to sprawił i to jest godne podziwu w naszych oczach?"
"Mt21,43": "Dlatego mówię wam, że zostanie wam zabrane Królestwo Boże, i dane narodowi, który będzie wydawał jego owoce."
"Mt21,44": "A kto upadłby na ten kamień, roztrzaska się, a na kogo on upadłby, zetrze go."
"Mt21,45": "A gdy usłyszeli arcykapłani i faryzeusze Jego podobieństwa, poznali, że mówił o nich;"
"Mt21,46": "I szukali sposobu jak Go pojmać, lecz bali się ludu, ponieważ lud miał Go za proroka."
