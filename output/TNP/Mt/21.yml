"Mt21,1":
  text: "I gdy przybliżyli się do Jerozolimy, i przyszli do Betfage, pod Górą Oliwną, wtedy Jezus wysłał dwóch uczniów,"
  tags: []
"Mt21,2":
  text: "Mówiąc im: Idźcie do miasteczka, które jest przed wami, a zaraz znajdziecie oślicę uwiązaną, a z nią oślątko; odwiążcie i przyprowadźcie je do mnie."
  tags: []
"Mt21,3":
  text: "A gdyby wam ktoś coś mówił, powiedzcie, że Pan ich potrzebuje; jednak zaraz je odeśle."
  tags: []
"Mt21,4":
  text: "A to wszystko stało się, aby wypełniło się to, co zostało powiedziane przez proroka, gdy mówi:"
  tags: []
"Mt21,5":
  text: "Powiedzcie córce Syjonu: Oto twój Król przychodzi do ciebie, łagodny i siedzący na ośle, na oślątku, źrebięciu oślicy będącej pod jarzmem."
  tags: []
"Mt21,6":
  text: "I uczniowie poszli i uczynili tak, jak im rozkazał Jezus,"
  tags: []
"Mt21,7":
  text: "Przyprowadzili oślicę i oślątko, i włożyli na nie swoje szaty, i usadowili Go na nich."
  tags: []
"Mt21,8":
  text: "A bardzo wielki tłum słał swoje szaty na drodze, a inni obcinali gałązki z drzew i słali je na drodze."
  tags: []
"Mt21,9":
  text: "A tłumy idące przed Nim i za Nim wołały, mówiąc: Hosanna Synowi Dawida! Błogosławiony, który przychodzi w imieniu PANA! Hosanna na wysokościach!"
  tags: []
"Mt21,10":
  text: "I gdy przybył do Jerozolimy, całe miasto zostało poruszone, mówiono: Kto to jest?"
  tags: []
"Mt21,11":
  text: "Tłumy natomiast mówiły: To jest Jezus, prorok z Nazaretu w Galilei."
  tags: []
"Mt21,12":
  text: "A Jezus wszedł do świątyni Bożej, i wyrzucił wszystkich sprzedających i kupujących w świątyni; poprzewracał stoły tych, którzy pieniądze wymieniali, i ławy sprzedających gołębie."
  tags: []
"Mt21,13":
  text: "I powiedział im: Napisano: Mój dom zostanie nazwany domem modlitwy; a wy uczyniliście z niego jaskinię zbójców."
  tags: []
"Mt21,14":
  text: "I przystąpili do Niego w świątyni ślepi i kulawi, i uzdrowił ich."
  tags: []
"Mt21,15":
  text: "A widząc arcykapłani i uczeni w Piśmie przedziwne dzieła, które czynił, i chłopców wołających w świątyni, i mówiących: Hosanna Synowi Dawida, oburzyli się,"
  tags: []
"Mt21,16":
  text: "I powiedzieli do Niego: Czy słyszysz, co oni mówią? A Jezus powiedział im: Tak, czy nigdy nie czytaliście: Z ust niemowląt i ssących zgotowałeś sobie chwałę?"
  tags: []
"Mt21,17":
  text: "A gdy ich opuścił, wyszedł z miasta do Betanii, i tam zanocował."
  tags: []
"Mt21,18":
  text: "A rano wracając do miasta, poczuł głód."
  tags: []
"Mt21,19":
  text: "I zobaczył przy drodze jeden figowiec, i podszedł do niego, i nie znalazł na nim nic, tylko same liście, i powiedział do niego: Niech więcej nie zrodzi się z ciebie owoc na wieki. I natychmiast usechł figowiec."
  tags: []
"Mt21,20":
  text: "A gdy ujrzeli to uczniowie, dziwili się, mówiąc: Jak szybko usechł ten figowiec!"
  tags: []
"Mt21,21":
  text: "A Jezus w odpowiedzi, rzekł im: Zaprawdę mówię wam: Jeśli mielibyście wiarę i nie wątpili, nie tylko to, co stało się z figowcem, uczynicie, ale gdybyście i tej górze powiedzieli: Podnieś się i rzuć się w morze, to stanie się tak."
  tags: []
"Mt21,22":
  text: "I wszystko, o cokolwiek prosilibyście w modlitwie, wierząc, otrzymacie."
  tags: []
"Mt21,23":
  text: "A gdy On przyszedł do świątyni, zbliżyli się do Niego, gdy nauczał, arcykapłani i starsi ludu, mówiąc: Jakim prawem to czynisz? I kto Ci dał to prawo?"
  tags: []
"Mt21,24":
  text: "A Jezus w odpowiedzi, rzekł im: Spytam i ja was o jedną rzecz, na którą jeśli mi odpowiecie, i ja wam odpowiem, jakim prawem to czynię."
  tags: []
"Mt21,25":
  text: "Skąd był chrzest Jana? Z nieba, czy od ludzi? A oni rozważali to w sobie i mówili: Jeśli powiemy: Z nieba, powie nam: Dlaczego więc mu nie uwierzyliście?"
  tags: []
"Mt21,26":
  text: "Jeśli powiemy: Od ludzi, boimy się ludu; bo wszyscy mają Jana za proroka."
  tags: []
"Mt21,27":
  text: "A w odpowiedzi, rzekli Jezusowi: Nie wiemy. Powiedział im i On: To i ja wam nie powiem, jakim prawem to czynię."
  tags: []
"Mt21,28":
  text: "Ale co się wam wydaje? Pewien człowiek miał dwoje dzieci; i gdy podszedł do pierwszego, powiedział: Dziecko! Idź, pracuj dziś w mojej winnicy."
  tags: []
"Mt21,29":
  text: "A on w odpowiedzi, rzekł: Nie chcę, ale potem odczuł żal z tego powodu, i poszedł."
  tags: []
"Mt21,30":
  text: "I gdy podszedł do drugiego, powiedział tak samo. A on w odpowiedzi, rzekł: Ja idę, panie! Ale nie poszedł."
  tags: []
"Mt21,31":
  text: "Który z tych dwóch uczynił wolę ojca? Powiedzieli do Niego: Pierwszy. Jezus powiedział im: Zaprawdę mówię wam, że celnicy i nierządnice wyprzedzają was do Królestwa Bożego."
  tags: []
"Mt21,32":
  text: "Albowiem Jan przyszedł do was drogą sprawiedliwości, a nie uwierzyliście mu, ale celnicy i nierządnice mu uwierzyli; a wy chociaż to widzieliście, jednak nie odczuliście później żalu, aby mu uwierzyć."
  tags: []
"Mt21,33":
  text: "Posłuchajcie innego podobieństwa: Był pewien gospodarz, który zasadził winnicę i ogrodził ją dookoła płotem, wykopał w niej tłocznię, zbudował wieżę, przekazał ją rolnikom i odjechał."
  tags: []
"Mt21,34":
  text: "A gdy przybliżył się czas owocowania, posłał swoje sługi do rolników, aby odebrali jego plony."
  tags: []
"Mt21,35":
  text: "A rolnicy, gdy pojmali jego sługi, jednego dotkliwie wychłostali, drugiego zabili, a trzeciego ukamienowali."
  tags: []
"Mt21,36":
  text: "Znowu posłał inne sługi, więcej niż za pierwszym razem, i to samo uczynili z nimi."
  tags: []
"Mt21,37":
  text: "A w końcu posłał do nich swojego syna, mówiąc: Uszanują mojego syna."
  tags: []
"Mt21,38":
  text: "Lecz rolnicy, gdy ujrzeli syna, powiedzieli sobie: To jest dziedzic; pójdźmy, zabijmy go, a zatrzymamy dla siebie jego dziedzictwo."
  tags: []
"Mt21,39":
  text: "I wzięli go, i wyrzucili go poza winnicę, i zabili."
  tags: []
"Mt21,40":
  text: "Gdy więc przyjdzie pan winnicy, co uczyni tym rolnikom?"
  tags: []
"Mt21,41":
  text: "Mówią do Niego: Złych srogo wygubi, a winnicę wynajmie innym rolnikom, którzy we właściwym czasie oddawać mu będą swoje plony."
  tags: []
"Mt21,42":
  text: "Jezus powiedział im: Czy nigdy nie czytaliście w Pismach: Kamień, który odrzucili budujący, stał się głowicą węgła; PAN to sprawił i to jest godne podziwu w naszych oczach?"
  tags: []
"Mt21,43":
  text: "Dlatego mówię wam, że zostanie wam zabrane Królestwo Boże, i dane narodowi, który będzie wydawał jego owoce."
  tags: []
"Mt21,44":
  text: "A kto upadłby na ten kamień, roztrzaska się, a na kogo on upadłby, zetrze go."
  tags: []
"Mt21,45":
  text: "A gdy usłyszeli arcykapłani i faryzeusze Jego podobieństwa, poznali, że mówił o nich;"
  tags: []
"Mt21,46":
  text: "I szukali sposobu jak Go pojmać, lecz bali się ludu, ponieważ lud miał Go za proroka."
  tags: []
