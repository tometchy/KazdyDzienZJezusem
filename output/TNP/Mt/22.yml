"Mt22,1":
  text: "A Jezus w odpowiedzi, ponownie rzekł im w podobieństwach, mówiąc:"
  tags: []
"Mt22,2":
  text: "Podobne jest Królestwo Niebios do pewnego człowieka, króla, który wyprawił wesele swojemu synowi,"
  tags: []
"Mt22,3":
  text: "I posłał swoje sługi, by wezwali zaproszonych na uroczystości weselne; ale oni nie chcieli przyjść."
  tags: []
"Mt22,4":
  text: "I ponownie posłał inne sługi, mówiąc: Powiedzcie tym, którzy są zaproszeni: Oto przygotowałem mój posiłek, moje woły i tuczne bydło ofiarowano, i wszystko jest gotowe; chodźcie na uroczystości weselne!"
  tags: []
"Mt22,5":
  text: "Oni jednak lekceważąc to, odeszli, ten wprawdzie do swojej roli, a tamten do swojego handlu;"
  tags: []
"Mt22,6":
  text: "A pozostali pojmali jego sługi, znieważyli ich i pozabijali."
  tags: []
"Mt22,7":
  text: "Gdy król to usłyszał, rozgniewał się i posłał swoje wojska, wytracił owych morderców, a miasto ich spalił."
  tags: []
"Mt22,8":
  text: "Wtedy powiedział swoim sługom: Wesele wprawdzie jest gotowe, lecz zaproszeni nie byli godni."
  tags: []
"Mt22,9":
  text: "Dlatego idźcie na rozstaje dróg, i kogokolwiek znajdziecie, wezwijcie na uroczystości weselne."
  tags: []
"Mt22,10":
  text: "I wyszli owi słudzy na drogi, zgromadzili wszystkich ilu znaleźli, złych a także dobrych, i napełniło się wesele gośćmi."
  tags: []
"Mt22,11":
  text: "A gdy wszedł król, aby przypatrzeć się spoczywającym przy stole, zobaczył tam człowieka nieodzianego w szatę weselną."
  tags: []
"Mt22,12":
  text: "I powiedział do niego: Przyjacielu! Jak tu wszedłeś, nie mając szaty weselnej? A on zamilkł."
  tags: []
"Mt22,13":
  text: "Wtedy powiedział król sługom: Zwiążcie jego nogi i ręce, zabierzcie go i wyrzućcie w ciemność zewnętrzną; tam będzie płacz i zgrzytanie zębów."
  tags: []
"Mt22,14":
  text: "Albowiem wielu jest powołanych, ale mało wybranych."
  tags: []
"Mt22,15":
  text: "Wtedy odeszli faryzeusze na naradę i podjęli decyzję, żeby Go złapać na słowie."
  tags: []
"Mt22,16":
  text: "I posłali do Niego swoich uczniów z herodianami, mówiąc: Nauczycielu! Wiemy, że jesteś szczery, a drogi Bożej w prawdzie nauczasz, i nie zależy Ci na nikim; albowiem nie patrzysz na powierzchowność ludzi."
  tags: []
"Mt22,17":
  text: "Dlatego powiedz nam, jak Ci się wydaje: Czy wolno dawać podatek Cezarowi, czy nie?"
  tags: []
"Mt22,18":
  text: "Ale Jezus poznał ich niegodziwość, dlatego powiedział: Dlaczego wystawiacie mnie na próbę, obłudnicy?"
  tags: []
"Mt22,19":
  text: "Pokażcie mi monetę podatkową; a oni przynieśli Mu denara."
  tags: []
"Mt22,20":
  text: "I powiedział im: Czyj to jest wizerunek i napis?"
  tags: []
"Mt22,21":
  text: "Powiedzieli do Niego: Cezara. Wtedy powiedział im: Oddawajcie więc to, co jest Cezara, Cezarowi, a to, co jest Boga, Bogu."
  tags: []
"Mt22,22":
  text: "Gdy to usłyszeli, zadziwili się, opuścili Go i odeszli."
  tags: []
"Mt22,23":
  text: "Tego dnia podeszli do Niego saduceusze, którzy mówią, że nie ma powstania z martwych, i pytali Go,"
  tags: []
"Mt22,24":
  text: "Mówiąc: Nauczycielu! Mojżesz powiedział: Jeżeli ktoś umrze nie mając dzieci, to jego brat prawem powinowactwa, ma poślubić jego żonę i wzbudzić potomstwo swojemu bratu."
  tags: []
"Mt22,25":
  text: "Było więc u nas siedmiu braci; pierwszy pojął żonę i umarł, nie mając potomstwa, zostawił swoją żonę swojemu bratu."
  tags: []
"Mt22,26":
  text: "Podobnie drugi i trzeci, aż do siódmego."
  tags: []
"Mt22,27":
  text: "A na końcu po wszystkich umarła i ta kobieta."
  tags: []
"Mt22,28":
  text: "Przy powstaniu z martwych więc, którego z tych siedmiu będzie żoną, gdyż wszyscy mieli ją za żonę?"
  tags: []
"Mt22,29":
  text: "A w odpowiedzi, Jezus rzekł im: Błądzicie, nie znając Pism ani mocy Boga."
  tags: []
"Mt22,30":
  text: "Albowiem przy powstaniu z martwych ani nie poślubiają, ani są zaślubiane, ale są jak aniołowie Boży w niebie."
  tags: []
"Mt22,31":
  text: "A co do powstania z martwych, czy nie czytaliście, co wam zostało powiedziane przez Boga, mówiącego:"
  tags: []
"Mt22,32":
  text: "Ja jestem Bóg Abrahama i Bóg Izaaka, i Bóg Jakuba. Bóg nie jest Bogiem martwych, ale żywych."
  tags: []
"Mt22,33":
  text: "A gdy tłumy to usłyszały, zdumiały się nad Jego nauką."
  tags: []
"Mt22,34":
  text: "A gdy usłyszeli faryzeusze, że zamknął usta saduceuszom, zebrali się razem."
  tags: []
"Mt22,35":
  text: "I spytał Go jeden z nich, znawca Prawa, wystawiając Go na próbę i mówiąc:"
  tags: []
"Mt22,36":
  text: "Nauczycielu! Które przykazanie jest wielkie w Prawie?"
  tags: []
"Mt22,37":
  text: "A Jezus mu powiedział: Będziesz miłował PANA, Boga twojego, całym swoim sercem, i całą swoją duszą, i całą swoją myślą;"
  tags: []
"Mt22,38":
  text: "To jest wielkie i pierwsze przykazanie."
  tags: []
"Mt22,39":
  text: "A drugie podobne temu: Będziesz miłował swojego bliźniego, jak samego siebie."
  tags: []
"Mt22,40":
  text: "Na tych dwóch przykazaniach jest oparte całe Prawo i Prorocy."
  tags: []
"Mt22,41":
  text: "A gdy zebrali się faryzeusze, Jezus spytał ich,"
  tags: []
"Mt22,42":
  text: "Mówiąc: Co wy myślicie o Mesjaszu? Czyim jest synem? Powiedzieli do Niego: Dawida."
  tags: []
"Mt22,43":
  text: "Powiedział im: Jak więc Dawid w Duchu nazywa Go Panem, mówiąc:"
  tags: []
"Mt22,44":
  text: "Powiedział PAN mojemu Panu: Siądź po mojej prawicy, aż położę Twoich nieprzyjaciół jako podnóżek pod Twoje stopy?"
  tags: []
"Mt22,45":
  text: "Jeśli więc Dawid nazywa Go Panem, to jak jest Jego synem?"
  tags: []
"Mt22,46":
  text: "I nikt Mu nie mógł odpowiedzieć ani słowem, i od tego dnia, nikt nie ośmielił się Go więcej pytać."
  tags: []
