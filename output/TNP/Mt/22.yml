"Mt22,1": "A Jezus w odpowiedzi, ponownie rzekł im w podobieństwach, mówiąc:"
"Mt22,2": "Podobne jest Królestwo Niebios do pewnego człowieka, króla, który wyprawił wesele swojemu synowi,"
"Mt22,3": "I posłał swoje sługi, by wezwali zaproszonych na uroczystości weselne; ale oni nie chcieli przyjść."
"Mt22,4": "I ponownie posłał inne sługi, mówiąc: Powiedzcie tym, którzy są zaproszeni: Oto przygotowałem mój posiłek, moje woły i tuczne bydło ofiarowano, i wszystko jest gotowe; chodźcie na uroczystości weselne!"
"Mt22,5": "Oni jednak lekceważąc to, odeszli, ten wprawdzie do swojej roli, a tamten do swojego handlu;"
"Mt22,6": "A pozostali pojmali jego sługi, znieważyli ich i pozabijali."
"Mt22,7": "Gdy król to usłyszał, rozgniewał się i posłał swoje wojska, wytracił owych morderców, a miasto ich spalił."
"Mt22,8": "Wtedy powiedział swoim sługom: Wesele wprawdzie jest gotowe, lecz zaproszeni nie byli godni."
"Mt22,9": "Dlatego idźcie na rozstaje dróg, i kogokolwiek znajdziecie, wezwijcie na uroczystości weselne."
"Mt22,10": "I wyszli owi słudzy na drogi, zgromadzili wszystkich ilu znaleźli, złych a także dobrych, i napełniło się wesele gośćmi."
"Mt22,11": "A gdy wszedł król, aby przypatrzeć się spoczywającym przy stole, zobaczył tam człowieka nieodzianego w szatę weselną."
"Mt22,12": "I powiedział do niego: Przyjacielu! Jak tu wszedłeś, nie mając szaty weselnej? A on zamilkł."
"Mt22,13": "Wtedy powiedział król sługom: Zwiążcie jego nogi i ręce, zabierzcie go i wyrzućcie w ciemność zewnętrzną; tam będzie płacz i zgrzytanie zębów."
"Mt22,14": "Albowiem wielu jest powołanych, ale mało wybranych."
"Mt22,15": "Wtedy odeszli faryzeusze na naradę i podjęli decyzję, żeby Go złapać na słowie."
"Mt22,16": "I posłali do Niego swoich uczniów z herodianami, mówiąc: Nauczycielu! Wiemy, że jesteś szczery, a drogi Bożej w prawdzie nauczasz, i nie zależy Ci na nikim; albowiem nie patrzysz na powierzchowność ludzi."
"Mt22,17": "Dlatego powiedz nam, jak Ci się wydaje: Czy wolno dawać podatek Cezarowi, czy nie?"
"Mt22,18": "Ale Jezus poznał ich niegodziwość, dlatego powiedział: Dlaczego wystawiacie mnie na próbę, obłudnicy?"
"Mt22,19": "Pokażcie mi monetę podatkową; a oni przynieśli Mu denara."
"Mt22,20": "I powiedział im: Czyj to jest wizerunek i napis?"
"Mt22,21": "Powiedzieli do Niego: Cezara. Wtedy powiedział im: Oddawajcie więc to, co jest Cezara, Cezarowi, a to, co jest Boga, Bogu."
"Mt22,22": "Gdy to usłyszeli, zadziwili się, opuścili Go i odeszli."
"Mt22,23": "Tego dnia podeszli do Niego saduceusze, którzy mówią, że nie ma powstania z martwych, i pytali Go,"
"Mt22,24": "Mówiąc: Nauczycielu! Mojżesz powiedział: Jeżeli ktoś umrze nie mając dzieci, to jego brat prawem powinowactwa, ma poślubić jego żonę i wzbudzić potomstwo swojemu bratu."
"Mt22,25": "Było więc u nas siedmiu braci; pierwszy pojął żonę i umarł, nie mając potomstwa, zostawił swoją żonę swojemu bratu."
"Mt22,26": "Podobnie drugi i trzeci, aż do siódmego."
"Mt22,27": "A na końcu po wszystkich umarła i ta kobieta."
"Mt22,28": "Przy powstaniu z martwych więc, którego z tych siedmiu będzie żoną, gdyż wszyscy mieli ją za żonę?"
"Mt22,29": "A w odpowiedzi, Jezus rzekł im: Błądzicie, nie znając Pism ani mocy Boga."
"Mt22,30": "Albowiem przy powstaniu z martwych ani nie poślubiają, ani są zaślubiane, ale są jak aniołowie Boży w niebie."
"Mt22,31": "A co do powstania z martwych, czy nie czytaliście, co wam zostało powiedziane przez Boga, mówiącego:"
"Mt22,32": "Ja jestem Bóg Abrahama i Bóg Izaaka, i Bóg Jakuba. Bóg nie jest Bogiem martwych, ale żywych."
"Mt22,33": "A gdy tłumy to usłyszały, zdumiały się nad Jego nauką."
"Mt22,34": "A gdy usłyszeli faryzeusze, że zamknął usta saduceuszom, zebrali się razem."
"Mt22,35": "I spytał Go jeden z nich, znawca Prawa, wystawiając Go na próbę i mówiąc:"
"Mt22,36": "Nauczycielu! Które przykazanie jest wielkie w Prawie?"
"Mt22,37": "A Jezus mu powiedział: Będziesz miłował PANA, Boga twojego, całym swoim sercem, i całą swoją duszą, i całą swoją myślą;"
"Mt22,38": "To jest wielkie i pierwsze przykazanie."
"Mt22,39": "A drugie podobne temu: Będziesz miłował swojego bliźniego, jak samego siebie."
"Mt22,40": "Na tych dwóch przykazaniach jest oparte całe Prawo i Prorocy."
"Mt22,41": "A gdy zebrali się faryzeusze, Jezus spytał ich,"
"Mt22,42": "Mówiąc: Co wy myślicie o Mesjaszu? Czyim jest synem? Powiedzieli do Niego: Dawida."
"Mt22,43": "Powiedział im: Jak więc Dawid w Duchu nazywa Go Panem, mówiąc:"
"Mt22,44": "Powiedział PAN mojemu Panu: Siądź po mojej prawicy, aż położę Twoich nieprzyjaciół jako podnóżek pod Twoje stopy?"
"Mt22,45": "Jeśli więc Dawid nazywa Go Panem, to jak jest Jego synem?"
"Mt22,46": "I nikt Mu nie mógł odpowiedzieć ani słowem, i od tego dnia, nikt nie ośmielił się Go więcej pytać."
