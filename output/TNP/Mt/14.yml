"Mt14,1": "W tym czasie tetrarcha Herod usłyszał wieść o Jezusie."
"Mt14,2": "I powiedział swoim sługom: To jest Jan Chrzciciel; on został wzbudzony z martwych, i przez to dokonują się w Nim dzieła mocy."
"Mt14,3": "Albowiem Herod schwytał Jana, związał go i umieścił w więzieniu z powodu Herodiady, żony Filipa, swojego brata."
"Mt14,4": "Bo Jan mówił mu: Nie wolno ci jej mieć za żonę."
"Mt14,5": "I chciał go zabić, ale bał się ludu; albowiem mieli go za proroka."
"Mt14,6": "A gdy obchodzono dzień narodzin Heroda, córka Herodiady tańczyła pośrodku gości i spodobała się Herodowi."
"Mt14,7": "Dlatego pod przysięgą przyrzekł jej dać o cokolwiek poprosi."
"Mt14,8": "A ona została namówiona przez swoją matkę, i mówi: Daj mi tu na tacy głowę Jana Chrzciciela."
"Mt14,9": "I zasmucił się król, ale z powodu przysięgi i z powodu współbiesiadników rozkazał jej dać."
"Mt14,10": "Posłał więc i ściął głowę Jana w więzieniu."
"Mt14,11": "I przyniesiono jego głowę na tacy, i dano dziewczynce, a ona zaniosła ją swojej matce."
"Mt14,12": "Potem przyszli jego uczniowie, zabrali ciało i pogrzebali je; a potem poszli i oznajmili o tym Jezusowi."
"Mt14,13": "A gdy Jezus to usłyszał, wycofał się stamtąd w łodzi na miejsce odludne, by pozostać na osobności; a tłumy słysząc o tym, podążały za Nim pieszo z miast."
"Mt14,14": "A Jezus wyszedł i zobaczył wielki tłum; zlitował się nad nim i uzdrawiał ich chorych."
"Mt14,15": "A gdy nastał wieczór, przystąpili do Niego Jego uczniowie, mówiąc: To miejsce jest puste, a właściwa pora już przeminęła; rozpuść te tłumy, aby odeszły do wiosek i kupiły sobie żywności."
"Mt14,16": "A Jezus powiedział im: Nie mają potrzeby odchodzić; wy dajcie im jeść."
"Mt14,17": "Ale oni powiedzieli do Niego: Mamy tu tylko pięć chlebów i dwie ryby."
"Mt14,18": "A On powiedział: Przynieście mi je tutaj."
"Mt14,19": "A gdy rozkazał tłumom usiąść na trawie i wziął pięć chlebów, i dwie ryby, spojrzał w górę ku niebu, błogosławił, a gdy połamał chleby, dał uczniom, a uczniowie tłumom."
"Mt14,20": "I jedli wszyscy, i zostali nasyceni; i zebrali to, co zbywało, dwanaście pełnych koszy kawałków."
"Mt14,21": "A tych, którzy jedli, było około pięciu tysięcy mężczyzn, bez kobiet i dzieci."
"Mt14,22": "I zaraz Jezus przymusił swoich uczniów, aby wstąpili do łodzi i wyprzedzili Go na drugą stronę, aż On rozpuści tłumy."
"Mt14,23": "A gdy rozpuścił tłumy, wstąpił na górę, aby się modlić na osobności; a gdy nastał wieczór, był tam sam."
"Mt14,24": "Łódź natomiast była już na środku morza, nękana przez fale; albowiem wiatr był przeciwny."
"Mt14,25": "A o czwartej straży nocnej przyszedł do nich Jezus, idąc po morzu."
"Mt14,26": "A gdy uczniowie ujrzeli Go chodzącego po morzu, zatrwożyli się, mówiąc: To jest zjawa! I krzyczeli ze strachu."
"Mt14,27": "Lecz Jezus zaraz powiedział do nich, mówiąc: Ufajcie! Ja jestem! Nie bójcie się!"
"Mt14,28": "A Piotr w odpowiedzi, rzekł do Niego: Panie! Jeśli to jesteś Ty, każ mi przyjść do siebie po wodzie."
"Mt14,29": "A On powiedział: Przyjdź! I Piotr wyszedł z łodzi, a idąc po wodzie, przyszedł do Jezusa."
"Mt14,30": "Lecz gdy ujrzał gwałtowny wiatr, zląkł się, i gdy zaczął tonąć, zawołał, mówiąc: Panie, ratuj mnie!"
"Mt14,31": "A Jezus natychmiast wyciągnął rękę, uchwycił go i powiedział do niego: O małej wiary! Dlaczego zwątpiłeś?"
"Mt14,32": "A gdy weszli do łodzi, wiatr się uciszył."
"Mt14,33": "Ci natomiast, którzy byli w łodzi, podeszli i oddali Mu pokłon, mówiąc: Prawdziwie jesteś Synem Bożym."
"Mt14,34": "A gdy przeprawili się, przyszli do ziemi Genezaret."
"Mt14,35": "I rozpoznali Go mężowie z tego miejsca, i posłali wiadomość do wszystkich w tej okolicy i przyniesiono do Niego wszystkich, którzy mieli się źle."
"Mt14,36": "I prosili Go, aby mogli tylko dotknąć skraju Jego szaty; a ilu dotknęło, tylu zostało uzdrowionych."
