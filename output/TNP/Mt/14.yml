"Mt14,1":
  text: "W tym czasie tetrarcha Herod usłyszał wieść o Jezusie."
  tags: []
"Mt14,2":
  text: "I powiedział swoim sługom: To jest Jan Chrzciciel; on został wzbudzony z martwych, i przez to dokonują się w Nim dzieła mocy."
  tags: []
"Mt14,3":
  text: "Albowiem Herod schwytał Jana, związał go i umieścił w więzieniu z powodu Herodiady, żony Filipa, swojego brata."
  tags: []
"Mt14,4":
  text: "Bo Jan mówił mu: Nie wolno ci jej mieć za żonę."
  tags: []
"Mt14,5":
  text: "I chciał go zabić, ale bał się ludu; albowiem mieli go za proroka."
  tags: []
"Mt14,6":
  text: "A gdy obchodzono dzień narodzin Heroda, córka Herodiady tańczyła pośrodku gości i spodobała się Herodowi."
  tags: []
"Mt14,7":
  text: "Dlatego pod przysięgą przyrzekł jej dać o cokolwiek poprosi."
  tags: []
"Mt14,8":
  text: "A ona została namówiona przez swoją matkę, i mówi: Daj mi tu na tacy głowę Jana Chrzciciela."
  tags: []
"Mt14,9":
  text: "I zasmucił się król, ale z powodu przysięgi i z powodu współbiesiadników rozkazał jej dać."
  tags: []
"Mt14,10":
  text: "Posłał więc i ściął głowę Jana w więzieniu."
  tags: []
"Mt14,11":
  text: "I przyniesiono jego głowę na tacy, i dano dziewczynce, a ona zaniosła ją swojej matce."
  tags: []
"Mt14,12":
  text: "Potem przyszli jego uczniowie, zabrali ciało i pogrzebali je; a potem poszli i oznajmili o tym Jezusowi."
  tags: []
"Mt14,13":
  text: "A gdy Jezus to usłyszał, wycofał się stamtąd w łodzi na miejsce odludne, by pozostać na osobności; a tłumy słysząc o tym, podążały za Nim pieszo z miast."
  tags: []
"Mt14,14":
  text: "A Jezus wyszedł i zobaczył wielki tłum; zlitował się nad nim i uzdrawiał ich chorych."
  tags: []
"Mt14,15":
  text: "A gdy nastał wieczór, przystąpili do Niego Jego uczniowie, mówiąc: To miejsce jest puste, a właściwa pora już przeminęła; rozpuść te tłumy, aby odeszły do wiosek i kupiły sobie żywności."
  tags: []
"Mt14,16":
  text: "A Jezus powiedział im: Nie mają potrzeby odchodzić; wy dajcie im jeść."
  tags: []
"Mt14,17":
  text: "Ale oni powiedzieli do Niego: Mamy tu tylko pięć chlebów i dwie ryby."
  tags: []
"Mt14,18":
  text: "A On powiedział: Przynieście mi je tutaj."
  tags: []
"Mt14,19":
  text: "A gdy rozkazał tłumom usiąść na trawie i wziął pięć chlebów, i dwie ryby, spojrzał w górę ku niebu, błogosławił, a gdy połamał chleby, dał uczniom, a uczniowie tłumom."
  tags: []
"Mt14,20":
  text: "I jedli wszyscy, i zostali nasyceni; i zebrali to, co zbywało, dwanaście pełnych koszy kawałków."
  tags: []
"Mt14,21":
  text: "A tych, którzy jedli, było około pięciu tysięcy mężczyzn, bez kobiet i dzieci."
  tags: []
"Mt14,22":
  text: "I zaraz Jezus przymusił swoich uczniów, aby wstąpili do łodzi i wyprzedzili Go na drugą stronę, aż On rozpuści tłumy."
  tags: []
"Mt14,23":
  text: "A gdy rozpuścił tłumy, wstąpił na górę, aby się modlić na osobności; a gdy nastał wieczór, był tam sam."
  tags: []
"Mt14,24":
  text: "Łódź natomiast była już na środku morza, nękana przez fale; albowiem wiatr był przeciwny."
  tags: []
"Mt14,25":
  text: "A o czwartej straży nocnej przyszedł do nich Jezus, idąc po morzu."
  tags: []
"Mt14,26":
  text: "A gdy uczniowie ujrzeli Go chodzącego po morzu, zatrwożyli się, mówiąc: To jest zjawa! I krzyczeli ze strachu."
  tags: []
"Mt14,27":
  text: "Lecz Jezus zaraz powiedział do nich, mówiąc: Ufajcie! Ja jestem! Nie bójcie się!"
  tags: []
"Mt14,28":
  text: "A Piotr w odpowiedzi, rzekł do Niego: Panie! Jeśli to jesteś Ty, każ mi przyjść do siebie po wodzie."
  tags: []
"Mt14,29":
  text: "A On powiedział: Przyjdź! I Piotr wyszedł z łodzi, a idąc po wodzie, przyszedł do Jezusa."
  tags: []
"Mt14,30":
  text: "Lecz gdy ujrzał gwałtowny wiatr, zląkł się, i gdy zaczął tonąć, zawołał, mówiąc: Panie, ratuj mnie!"
  tags: []
"Mt14,31":
  text: "A Jezus natychmiast wyciągnął rękę, uchwycił go i powiedział do niego: O małej wiary! Dlaczego zwątpiłeś?"
  tags: []
"Mt14,32":
  text: "A gdy weszli do łodzi, wiatr się uciszył."
  tags: []
"Mt14,33":
  text: "Ci natomiast, którzy byli w łodzi, podeszli i oddali Mu pokłon, mówiąc: Prawdziwie jesteś Synem Bożym."
  tags: []
"Mt14,34":
  text: "A gdy przeprawili się, przyszli do ziemi Genezaret."
  tags: []
"Mt14,35":
  text: "I rozpoznali Go mężowie z tego miejsca, i posłali wiadomość do wszystkich w tej okolicy i przyniesiono do Niego wszystkich, którzy mieli się źle."
  tags: []
"Mt14,36":
  text: "I prosili Go, aby mogli tylko dotknąć skraju Jego szaty; a ilu dotknęło, tylu zostało uzdrowionych."
  tags: []
