"Mt16,1": "I podeszli faryzeusze i saduceusze, a wystawiając Go na próbę, prosili, aby pokazał im znak z nieba."
"Mt16,2": "A On w odpowiedzi, rzekł im: Gdy jest wieczór, mówicie: Będzie piękna pogoda, bo niebo się czerwieni;"
"Mt16,3": "A rano: Dziś będzie burzliwa pogoda, bo niebo się czerwieni i jest pochmurne. Obłudnicy! Wprawdzie oblicze nieba umiecie rozróżniać, a znaków tych czasów nie możecie?"
"Mt16,4": "Pokolenie złe i cudzołożne szuka znaku; ale znak nie będzie mu dany, chyba że znak proroka Jonasza. I opuścił ich, i odszedł."
"Mt16,5": "I gdy uczniowie Jego przeprawili się na drugą stronę morza, zapomnieli wziąć chleba."
"Mt16,6": "A Jezus powiedział im: Patrzcie i zwróćcie uwagę na zakwas faryzeuszów i saduceuszów."
"Mt16,7": "I oni rozważali to między sobą, mówiąc: Nie wzięliśmy chleba."
"Mt16,8": "A gdy Jezus rozpoznał to, powiedział im: Dlaczego rozważacie to między sobą, o małej wiary, że nie wzięliście chleba?"
"Mt16,9": "Jeszcze tego nie rozumiecie, ani nie pamiętacie tych pięciu chlebów dla pięciu tysięcy ludzi, i ile koszów zebraliście?"
"Mt16,10": "Ani tych siedmiu chlebów dla czterech tysięcy ludzi, i ile koszów zebraliście?"
"Mt16,11": "Jak to? Nie rozumiecie, że nie o chlebie wam powiedziałem mówiąc, żebyście zwrócili uwagę na zakwas faryzeuszów i saduceuszów?"
"Mt16,12": "Wtedy zrozumieli, że nie mówił im, aby zwrócili uwagę na zakwas chlebowy, ale na naukę faryzeuszów i saduceuszów."
"Mt16,13": "A gdy Jezus przyszedł w strony Cezarei Filipowej, pytał swoich uczniów, mówiąc: Co o mnie mówią ludzie? Kim jest Syn Człowieczy?"
"Mt16,14": "A oni powiedzieli: Według niektórych, prawdziwie Janem Chrzcicielem, a inni mówią, że Eliaszem, jeszcze inni Jeremiaszem lub jednym z proroków."
"Mt16,15": "Powiedział im: A wy co o mnie mówicie? Kim jestem?"
"Mt16,16": "A w odpowiedzi, Szymon Piotr rzekł: Ty jesteś Mesjasz, Syn Boga żywego."
"Mt16,17": "A w odpowiedzi, Jezus rzekł do niego: Błogosławiony jesteś Szymonie, synu Jony! Bo nie objawiły ci tego ciało i krew, ale Ojciec mój, który jest w niebie."
"Mt16,18": "A ja ci też mówię, że ty jesteś Piotr; a na tej skale zbuduję mój Kościół, a bramy Hadesu go nie przemogą;"
"Mt16,19": "I tobie dam klucze Królestwa Niebios; i cokolwiek zwiążesz na ziemi, zostanie związane i w niebie; i cokolwiek rozwiążesz na ziemi, zostanie rozwiązane i w niebie."
"Mt16,20": "Wtedy nakazał swoim uczniom, aby nikomu nie mówili, że on Jezus jest Mesjaszem."
"Mt16,21": "Od tej chwili Jezus zaczął wyjaśniać swoim uczniom, że musi pójść do Jerozolimy i wiele wycierpieć od starszych i od arcykapłanów, i od uczonych w Piśmie, i zostać zabity, a trzeciego dnia być wzbudzonym z martwych."
"Mt16,22": "I wziął Go Piotr na stronę, i zaczął Go strofować, mówiąc: Zmiłuj się nad sobą, Panie! Nie stanie się to z Tobą."
"Mt16,23": "A On obrócił się i powiedział Piotrowi: Zejdź mi z drogi, przeciwniku! Jesteś dla mnie zgorszeniem; nie myślisz o tym, co Boże, ale o tym, co ludzkie."
"Mt16,24": "Wtedy Jezus powiedział do swoich uczniów: Jeśli ktoś chce iść za mną, niech zaprze się samego siebie, weźmie swój krzyż, i idzie za mną."
"Mt16,25": "Bo kto chce duszę swoją uratować, zgubi ją; a kto straci duszę swoją dla mnie, znajdzie ją."
"Mt16,26": "Cóż bowiem zyska człowiek, choćby cały świat zdobył, a na duszy swojej poniósł szkodę? Albo co da człowiek w zamian za swoją duszę?"
"Mt16,27": "Bo Syn Człowieczy ma przyjść w chwale Ojca swojego ze swoimi aniołami, i wtedy odda każdemu według jego postępowania."
"Mt16,28": "Zaprawdę mówię wam: Niektórzy z tych, tu stojących, na pewno nie skosztują śmierci, dopóki nie ujrzą Syna Człowieczego, przychodzącego w swoim Królestwie."
