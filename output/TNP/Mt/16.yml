"Mt16,1":
  text: "I podeszli faryzeusze i saduceusze, a wystawiając Go na próbę, prosili, aby pokazał im znak z nieba."
  tags: []
"Mt16,2":
  text: "A On w odpowiedzi, rzekł im: Gdy jest wieczór, mówicie: Będzie piękna pogoda, bo niebo się czerwieni;"
  tags: []
"Mt16,3":
  text: "A rano: Dziś będzie burzliwa pogoda, bo niebo się czerwieni i jest pochmurne. Obłudnicy! Wprawdzie oblicze nieba umiecie rozróżniać, a znaków tych czasów nie możecie?"
  tags: []
"Mt16,4":
  text: "Pokolenie złe i cudzołożne szuka znaku; ale znak nie będzie mu dany, chyba że znak proroka Jonasza. I opuścił ich, i odszedł."
  tags: []
"Mt16,5":
  text: "I gdy uczniowie Jego przeprawili się na drugą stronę morza, zapomnieli wziąć chleba."
  tags: []
"Mt16,6":
  text: "A Jezus powiedział im: Patrzcie i zwróćcie uwagę na zakwas faryzeuszów i saduceuszów."
  tags: []
"Mt16,7":
  text: "I oni rozważali to między sobą, mówiąc: Nie wzięliśmy chleba."
  tags: []
"Mt16,8":
  text: "A gdy Jezus rozpoznał to, powiedział im: Dlaczego rozważacie to między sobą, o małej wiary, że nie wzięliście chleba?"
  tags: []
"Mt16,9":
  text: "Jeszcze tego nie rozumiecie, ani nie pamiętacie tych pięciu chlebów dla pięciu tysięcy ludzi, i ile koszów zebraliście?"
  tags: []
"Mt16,10":
  text: "Ani tych siedmiu chlebów dla czterech tysięcy ludzi, i ile koszów zebraliście?"
  tags: []
"Mt16,11":
  text: "Jak to? Nie rozumiecie, że nie o chlebie wam powiedziałem mówiąc, żebyście zwrócili uwagę na zakwas faryzeuszów i saduceuszów?"
  tags: []
"Mt16,12":
  text: "Wtedy zrozumieli, że nie mówił im, aby zwrócili uwagę na zakwas chlebowy, ale na naukę faryzeuszów i saduceuszów."
  tags: []
"Mt16,13":
  text: "A gdy Jezus przyszedł w strony Cezarei Filipowej, pytał swoich uczniów, mówiąc: Co o mnie mówią ludzie? Kim jest Syn Człowieczy?"
  tags: []
"Mt16,14":
  text: "A oni powiedzieli: Według niektórych, prawdziwie Janem Chrzcicielem, a inni mówią, że Eliaszem, jeszcze inni Jeremiaszem lub jednym z proroków."
  tags: []
"Mt16,15":
  text: "Powiedział im: A wy co o mnie mówicie? Kim jestem?"
  tags: []
"Mt16,16":
  text: "A w odpowiedzi, Szymon Piotr rzekł: Ty jesteś Mesjasz, Syn Boga żywego."
  tags: []
"Mt16,17":
  text: "A w odpowiedzi, Jezus rzekł do niego: Błogosławiony jesteś Szymonie, synu Jony! Bo nie objawiły ci tego ciało i krew, ale Ojciec mój, który jest w niebie."
  tags: []
"Mt16,18":
  text: "A ja ci też mówię, że ty jesteś Piotr; a na tej skale zbuduję mój Kościół, a bramy Hadesu go nie przemogą;"
  tags: []
"Mt16,19":
  text: "I tobie dam klucze Królestwa Niebios; i cokolwiek zwiążesz na ziemi, zostanie związane i w niebie; i cokolwiek rozwiążesz na ziemi, zostanie rozwiązane i w niebie."
  tags: []
"Mt16,20":
  text: "Wtedy nakazał swoim uczniom, aby nikomu nie mówili, że on Jezus jest Mesjaszem."
  tags: []
"Mt16,21":
  text: "Od tej chwili Jezus zaczął wyjaśniać swoim uczniom, że musi pójść do Jerozolimy i wiele wycierpieć od starszych i od arcykapłanów, i od uczonych w Piśmie, i zostać zabity, a trzeciego dnia być wzbudzonym z martwych."
  tags: []
"Mt16,22":
  text: "I wziął Go Piotr na stronę, i zaczął Go strofować, mówiąc: Zmiłuj się nad sobą, Panie! Nie stanie się to z Tobą."
  tags: []
"Mt16,23":
  text: "A On obrócił się i powiedział Piotrowi: Zejdź mi z drogi, przeciwniku! Jesteś dla mnie zgorszeniem; nie myślisz o tym, co Boże, ale o tym, co ludzkie."
  tags: []
"Mt16,24":
  text: "Wtedy Jezus powiedział do swoich uczniów: Jeśli ktoś chce iść za mną, niech zaprze się samego siebie, weźmie swój krzyż, i idzie za mną."
  tags: []
"Mt16,25":
  text: "Bo kto chce duszę swoją uratować, zgubi ją; a kto straci duszę swoją dla mnie, znajdzie ją."
  tags: []
"Mt16,26":
  text: "Cóż bowiem zyska człowiek, choćby cały świat zdobył, a na duszy swojej poniósł szkodę? Albo co da człowiek w zamian za swoją duszę?"
  tags: []
"Mt16,27":
  text: "Bo Syn Człowieczy ma przyjść w chwale Ojca swojego ze swoimi aniołami, i wtedy odda każdemu według jego postępowania."
  tags: []
"Mt16,28":
  text: "Zaprawdę mówię wam: Niektórzy z tych, tu stojących, na pewno nie skosztują śmierci, dopóki nie ujrzą Syna Człowieczego, przychodzącego w swoim Królestwie."
  tags: []
