"Mt13,1":
  text: "A tego dnia wyszedł Jezus z domu i usiadł nad morzem."
  tags: []
"Mt13,2":
  text: "I zebrały się wokół Niego wielkie tłumy, dlatego wstąpił do łodzi i siedział, a cały tłum stał na brzegu."
  tags: []
"Mt13,3":
  text: "I mówił do nich wiele w podobieństwach. I powiedział: Oto siewca wyszedł siać."
  tags: []
"Mt13,4":
  text: "A gdy on siał, niektóre ziarna padły obok drogi; i przybyły ptaki, i zjadły je."
  tags: []
"Mt13,5":
  text: "Drugie natomiast padły na miejsca skaliste, gdzie nie miały wiele ziemi. Szybko wzeszły, ponieważ nie miały głębokiej ziemi."
  tags: []
"Mt13,6":
  text: "A gdy wzeszło słońce, zostały spieczone, a że nie miały korzenia, uschły."
  tags: []
"Mt13,7":
  text: "A inne padły między ciernie; i wzrosły ciernie, i je zadusiły."
  tags: []
"Mt13,8":
  text: "Inne natomiast padły na ziemię dobrą i wydały plon – to wprawdzie stokrotny, a to sześćdziesięciokrotny, a to trzydziestokrotny."
  tags: []
"Mt13,9":
  text: "Kto ma uszy do słuchania, niech słucha!"
  tags: []
"Mt13,10":
  text: "A wtedy podeszli uczniowie i powiedzieli do Niego: Dlaczego mówisz do nich w podobieństwach?"
  tags: []
"Mt13,11":
  text: "A On w odpowiedzi, rzekł im: Wam jest dane znać tajemnice Królestwa Niebios, a tamtym nie jest dane."
  tags: []
"Mt13,12":
  text: "Ktokolwiek bowiem ma, temu będzie dane, i będzie obfitował; ale kto nie ma, i to co ma, zostanie mu zabrane."
  tags: []
"Mt13,13":
  text: "Właśnie dlatego mówię do nich w podobieństwach, bo patrząc nie widzą, i słuchając nie słyszą, ani nie rozumieją."
  tags: []
"Mt13,14":
  text: "I spełnia się na nich proroctwo Izajasza, mówiące: Słuchem będziecie słuchać, a nie zrozumiecie, i patrząc będziecie widzieć, a nie ujrzycie;"
  tags: []
"Mt13,15":
  text: "Bo utuczyło się serce tego ludu, a uszami z trudem usłyszeli, a oczy swoje zmrużyli, żeby czasem oczami nie widzieli, i uszami nie słyszeli, i sercem nie zrozumieli, i nie nawrócili się, a ja żebym ich nie uzdrowił."
  tags: []
"Mt13,16":
  text: "Ale oczy wasze są błogosławione, że widzą, i uszy wasze, że słyszą."
  tags: []
"Mt13,17":
  text: "Bo zaprawdę mówię wam, że wielu proroków i sprawiedliwych pragnęło widzieć to, co wy widzicie, a nie widzieli, i słyszeć to, co wy słyszycie, a nie słyszeli."
  tags: []
"Mt13,18":
  text: "Wy więc posłuchajcie podobieństwa o siewcy."
  tags: []
"Mt13,19":
  text: "Do każdego, kto słucha słowa o Królestwie, i nie rozumie go, przychodzi zły i porywa to, co jest zasiane w jego sercu. To jest ten, który posiany jest obok drogi."
  tags: []
"Mt13,20":
  text: "A ten, który jest posiany na miejscach skalistych, to ten, który słucha słowa i zaraz je z radością przyjmuje;"
  tags: []
"Mt13,21":
  text: "Ale nie ma w sobie korzenia, trwa tylko chwilę; a gdy nastaje ucisk albo prześladowanie z powodu słowa, zaraz jest zgorszony."
  tags: []
"Mt13,22":
  text: "A ten, który jest posiany między ciernie, to ten, który słucha słowa; ale troska tego wieku i zwodniczy urok bogactwa zadusza słowo, i staje się bezowocnym."
  tags: []
"Mt13,23":
  text: "A ten, który jest posiany na dobrej ziemi, to ten, który słucha słowa i rozumie. Ten przynosi plon i daje: ten rzeczywiście stokrotny, a ten sześćdziesięciokrotny, a ten trzydziestokrotny."
  tags: []
"Mt13,24":
  text: "Inne podobieństwo powiedział im, mówiąc: Podobne jest Królestwo Niebios do człowieka, który zasiał dobre nasienie na swojej roli."
  tags: []
"Mt13,25":
  text: "A gdy ludzie spali, przyszedł jego nieprzyjaciel i posiał życicę pośrodku pszenicy, i odszedł."
  tags: []
"Mt13,26":
  text: "A gdy urosło źdźbło i wydało owoc, wtedy pokazała się i życica."
  tags: []
"Mt13,27":
  text: "A gdy przyszli słudzy gospodarza, powiedzieli mu: Panie! Czy nie posiałeś dobrego nasienia na swojej roli? Skąd więc ma życicę?"
  tags: []
"Mt13,28":
  text: "A on powiedział im: Człowiek, który jest wrogiem to uczynił. A słudzy powiedzieli do niego: Czy chcesz, abyśmy poszli i ją pozbierali?"
  tags: []
"Mt13,29":
  text: "A on powiedział: Nie! Abyście czasem zbierając życicę, nie wykorzenili równocześnie z nią i pszenicy."
  tags: []
"Mt13,30":
  text: "Pozwólcie obu razem rosnąć aż do żniwa; a w czasie żniw powiem żniwiarzom: Zbierzcie najpierw życicę i zwiążcie ją w snopy na spalenie, a pszenicę zgromadźcie do mojego spichlerza."
  tags: []
"Mt13,31":
  text: "Inne podobieństwo przedstawił im, mówiąc: Podobne jest Królestwo Niebios do ziarna gorczycy, które wziął człowiek i zasiał na swojej roli."
  tags: []
"Mt13,32":
  text: "Wprawdzie jest ono mniejsze niż wszystkie nasiona; ale kiedy urośnie, jest większe od jarzyn i staje się drzewem, tak że ptaki z nieba przybywają i robią sobie gniazda na jego gałązkach."
  tags: []
"Mt13,33":
  text: "Inne podobieństwo powiedział im: Podobne jest Królestwo Niebios do zakwasu, który wzięła kobieta i rozczyniła w trzech miarach mąki pszennej, aż całe ciasto zostało zakwaszone."
  tags: []
"Mt13,34":
  text: "To wszystko mówił Jezus w podobieństwach do tłumów, a bez podobieństwa nic nie mówił do nich;"
  tags: []
"Mt13,35":
  text: "Aby wypełniło się to, co zostało powiedziane przez proroka, mówiącego: Otworzę w podobieństwach moje usta, wypowiem rzeczy, które są ukryte od założenia świata."
  tags: []
"Mt13,36":
  text: "Wtedy rozpuścił tłumy; a gdy Jezus przyszedł do domu, podeszli do Niego Jego uczniowie, mówiąc: Wyjaśnij nam dokładnie podobieństwo o życicy na roli."
  tags: []
"Mt13,37":
  text: "A On w odpowiedzi, rzekł im: Ten, który rozsiewa dobre nasienie, to Syn Człowieczy;"
  tags: []
"Mt13,38":
  text: "A rola to świat, a dobre nasienie to synowie Królestwa, natomiast życica to synowie złego;"
  tags: []
"Mt13,39":
  text: "Wróg, który ją zasiał, to diabeł, żniwo to koniec tego wieku, a żniwiarzami są aniołowie."
  tags: []
"Mt13,40":
  text: "Jak więc zbiera się życicę i spala w ogniu, tak będzie przy końcu tego wieku."
  tags: []
"Mt13,41":
  text: "Syn Człowieczy pośle swoich aniołów, a oni zbiorą z Jego Królestwa wszystkie zgorszenia i tych, którzy czynią bezprawie;"
  tags: []
"Mt13,42":
  text: "I wrzucą ich do pieca z ogniem. Tam będzie płacz i zgrzytanie zębów."
  tags: []
"Mt13,43":
  text: "Wtedy sprawiedliwi rozbłysną jak słońce w Królestwie Ojca swojego. Kto ma uszy do słuchania, niech słucha."
  tags: []
"Mt13,44":
  text: "Ponownie podobne jest Królestwo Niebios do skarbu, który jest ukryty w roli, a który człowiek znalazł i ukrył, i z radości odchodzi, i wszystko, co ma sprzedaje, i kupuje tę rolę."
  tags: []
"Mt13,45":
  text: "Ponownie podobne jest Królestwo Niebios do kupca szukającego pięknych pereł;"
  tags: []
"Mt13,46":
  text: "Który gdy znalazł jedną drogocenną perłę, odszedł i sprzedał wszystko, co miał, i kupił ją."
  tags: []
"Mt13,47":
  text: "Ponownie podobne jest Królestwo Niebios do sieci zarzuconej w morze i zagarniającej ryby wszelkiego rodzaju;"
  tags: []
"Mt13,48":
  text: "A gdy ta została napełniona, rybacy wyciągnęli ją na brzeg, a gdy usiedli, zebrali to, co dobre do naczyń, a to co zgniłe, wyrzucili na zewnątrz."
  tags: []
"Mt13,49":
  text: "Tak będzie przy końcu tego wieku; wyjdą aniołowie i wyłączą złych spośród sprawiedliwych,"
  tags: []
"Mt13,50":
  text: "I wrzucą ich do pieca z ogniem. Tam będzie płacz i zgrzytanie zębów."
  tags: []
"Mt13,51":
  text: "Mówi im Jezus: Zrozumieliście to wszystko? Powiedzieli Mu: Tak, Panie!"
  tags: []
"Mt13,52":
  text: "A On powiedział im: Dlatego każdy uczony w Piśmie, który stał się uczniem w Królestwie Niebios, podobny jest do człowieka – pana domu, który wyciąga ze swojego skarbca to, co nowe i to, co stare."
  tags: []
"Mt13,53":
  text: "I stało się, gdy Jezus dokończył tych podobieństw, że odszedł stamtąd."
  tags: []
"Mt13,54":
  text: "I przyszedł do swojej ojczyzny, i nauczał w ich synagodze, tak że się bardzo zdumiewali i mówili: Skąd u Niego ta mądrość i te moce?"
  tags: []
"Mt13,55":
  text: "Czy nie jest to syn cieśli? Czy Jego matka nie nazywa się Maria, a Jego bracia to Jakub, Józef, Szymon i Juda?"
  tags: []
"Mt13,56":
  text: "A Jego siostry, czy wszystkie nie są pośród nas? Skąd więc u Niego to wszystko?"
  tags: []
"Mt13,57":
  text: "I byli Nim zgorszeni; ale Jezus powiedział im: Nigdzie nie jest prorok pozbawiony czci, jak tylko w swojej ojczyźnie i w swoim domu."
  tags: []
"Mt13,58":
  text: "I nie uczynił tam wielu dzieł mocy ze względu na ich niedowiarstwo."
  tags: []
