"Mt13,1": "A tego dnia wyszedł Jezus z domu i usiadł nad morzem."
"Mt13,2": "I zebrały się wokół Niego wielkie tłumy, dlatego wstąpił do łodzi i siedział, a cały tłum stał na brzegu."
"Mt13,3": "I mówił do nich wiele w podobieństwach. I powiedział: Oto siewca wyszedł siać."
"Mt13,4": "A gdy on siał, niektóre ziarna padły obok drogi; i przybyły ptaki, i zjadły je."
"Mt13,5": "Drugie natomiast padły na miejsca skaliste, gdzie nie miały wiele ziemi. Szybko wzeszły, ponieważ nie miały głębokiej ziemi."
"Mt13,6": "A gdy wzeszło słońce, zostały spieczone, a że nie miały korzenia, uschły."
"Mt13,7": "A inne padły między ciernie; i wzrosły ciernie, i je zadusiły."
"Mt13,8": "Inne natomiast padły na ziemię dobrą i wydały plon – to wprawdzie stokrotny, a to sześćdziesięciokrotny, a to trzydziestokrotny."
"Mt13,9": "Kto ma uszy do słuchania, niech słucha!"
"Mt13,10": "A wtedy podeszli uczniowie i powiedzieli do Niego: Dlaczego mówisz do nich w podobieństwach?"
"Mt13,11": "A On w odpowiedzi, rzekł im: Wam jest dane znać tajemnice Królestwa Niebios, a tamtym nie jest dane."
"Mt13,12": "Ktokolwiek bowiem ma, temu będzie dane, i będzie obfitował; ale kto nie ma, i to co ma, zostanie mu zabrane."
"Mt13,13": "Właśnie dlatego mówię do nich w podobieństwach, bo patrząc nie widzą, i słuchając nie słyszą, ani nie rozumieją."
"Mt13,14": "I spełnia się na nich proroctwo Izajasza, mówiące: Słuchem będziecie słuchać, a nie zrozumiecie, i patrząc będziecie widzieć, a nie ujrzycie;"
"Mt13,15": "Bo utuczyło się serce tego ludu, a uszami z trudem usłyszeli, a oczy swoje zmrużyli, żeby czasem oczami nie widzieli, i uszami nie słyszeli, i sercem nie zrozumieli, i nie nawrócili się, a ja żebym ich nie uzdrowił."
"Mt13,16": "Ale oczy wasze są błogosławione, że widzą, i uszy wasze, że słyszą."
"Mt13,17": "Bo zaprawdę mówię wam, że wielu proroków i sprawiedliwych pragnęło widzieć to, co wy widzicie, a nie widzieli, i słyszeć to, co wy słyszycie, a nie słyszeli."
"Mt13,18": "Wy więc posłuchajcie podobieństwa o siewcy."
"Mt13,19": "Do każdego, kto słucha słowa o Królestwie, i nie rozumie go, przychodzi zły i porywa to, co jest zasiane w jego sercu. To jest ten, który posiany jest obok drogi."
"Mt13,20": "A ten, który jest posiany na miejscach skalistych, to ten, który słucha słowa i zaraz je z radością przyjmuje;"
"Mt13,21": "Ale nie ma w sobie korzenia, trwa tylko chwilę; a gdy nastaje ucisk albo prześladowanie z powodu słowa, zaraz jest zgorszony."
"Mt13,22": "A ten, który jest posiany między ciernie, to ten, który słucha słowa; ale troska tego wieku i zwodniczy urok bogactwa zadusza słowo, i staje się bezowocnym."
"Mt13,23": "A ten, który jest posiany na dobrej ziemi, to ten, który słucha słowa i rozumie. Ten przynosi plon i daje: ten rzeczywiście stokrotny, a ten sześćdziesięciokrotny, a ten trzydziestokrotny."
"Mt13,24": "Inne podobieństwo powiedział im, mówiąc: Podobne jest Królestwo Niebios do człowieka, który zasiał dobre nasienie na swojej roli."
"Mt13,25": "A gdy ludzie spali, przyszedł jego nieprzyjaciel i posiał życicę pośrodku pszenicy, i odszedł."
"Mt13,26": "A gdy urosło źdźbło i wydało owoc, wtedy pokazała się i życica."
"Mt13,27": "A gdy przyszli słudzy gospodarza, powiedzieli mu: Panie! Czy nie posiałeś dobrego nasienia na swojej roli? Skąd więc ma życicę?"
"Mt13,28": "A on powiedział im: Człowiek, który jest wrogiem to uczynił. A słudzy powiedzieli do niego: Czy chcesz, abyśmy poszli i ją pozbierali?"
"Mt13,29": "A on powiedział: Nie! Abyście czasem zbierając życicę, nie wykorzenili równocześnie z nią i pszenicy."
"Mt13,30": "Pozwólcie obu razem rosnąć aż do żniwa; a w czasie żniw powiem żniwiarzom: Zbierzcie najpierw życicę i zwiążcie ją w snopy na spalenie, a pszenicę zgromadźcie do mojego spichlerza."
"Mt13,31": "Inne podobieństwo przedstawił im, mówiąc: Podobne jest Królestwo Niebios do ziarna gorczycy, które wziął człowiek i zasiał na swojej roli."
"Mt13,32": "Wprawdzie jest ono mniejsze niż wszystkie nasiona; ale kiedy urośnie, jest większe od jarzyn i staje się drzewem, tak że ptaki z nieba przybywają i robią sobie gniazda na jego gałązkach."
"Mt13,33": "Inne podobieństwo powiedział im: Podobne jest Królestwo Niebios do zakwasu, który wzięła kobieta i rozczyniła w trzech miarach mąki pszennej, aż całe ciasto zostało zakwaszone."
"Mt13,34": "To wszystko mówił Jezus w podobieństwach do tłumów, a bez podobieństwa nic nie mówił do nich;"
"Mt13,35": "Aby wypełniło się to, co zostało powiedziane przez proroka, mówiącego: Otworzę w podobieństwach moje usta, wypowiem rzeczy, które są ukryte od założenia świata."
"Mt13,36": "Wtedy rozpuścił tłumy; a gdy Jezus przyszedł do domu, podeszli do Niego Jego uczniowie, mówiąc: Wyjaśnij nam dokładnie podobieństwo o życicy na roli."
"Mt13,37": "A On w odpowiedzi, rzekł im: Ten, który rozsiewa dobre nasienie, to Syn Człowieczy;"
"Mt13,38": "A rola to świat, a dobre nasienie to synowie Królestwa, natomiast życica to synowie złego;"
"Mt13,39": "Wróg, który ją zasiał, to diabeł, żniwo to koniec tego wieku, a żniwiarzami są aniołowie."
"Mt13,40": "Jak więc zbiera się życicę i spala w ogniu, tak będzie przy końcu tego wieku."
"Mt13,41": "Syn Człowieczy pośle swoich aniołów, a oni zbiorą z Jego Królestwa wszystkie zgorszenia i tych, którzy czynią bezprawie;"
"Mt13,42": "I wrzucą ich do pieca z ogniem. Tam będzie płacz i zgrzytanie zębów."
"Mt13,43": "Wtedy sprawiedliwi rozbłysną jak słońce w Królestwie Ojca swojego. Kto ma uszy do słuchania, niech słucha."
"Mt13,44": "Ponownie podobne jest Królestwo Niebios do skarbu, który jest ukryty w roli, a który człowiek znalazł i ukrył, i z radości odchodzi, i wszystko, co ma sprzedaje, i kupuje tę rolę."
"Mt13,45": "Ponownie podobne jest Królestwo Niebios do kupca szukającego pięknych pereł;"
"Mt13,46": "Który gdy znalazł jedną drogocenną perłę, odszedł i sprzedał wszystko, co miał, i kupił ją."
"Mt13,47": "Ponownie podobne jest Królestwo Niebios do sieci zarzuconej w morze i zagarniającej ryby wszelkiego rodzaju;"
"Mt13,48": "A gdy ta została napełniona, rybacy wyciągnęli ją na brzeg, a gdy usiedli, zebrali to, co dobre do naczyń, a to co zgniłe, wyrzucili na zewnątrz."
"Mt13,49": "Tak będzie przy końcu tego wieku; wyjdą aniołowie i wyłączą złych spośród sprawiedliwych,"
"Mt13,50": "I wrzucą ich do pieca z ogniem. Tam będzie płacz i zgrzytanie zębów."
"Mt13,51": "Mówi im Jezus: Zrozumieliście to wszystko? Powiedzieli Mu: Tak, Panie!"
"Mt13,52": "A On powiedział im: Dlatego każdy uczony w Piśmie, który stał się uczniem w Królestwie Niebios, podobny jest do człowieka – pana domu, który wyciąga ze swojego skarbca to, co nowe i to, co stare."
"Mt13,53": "I stało się, gdy Jezus dokończył tych podobieństw, że odszedł stamtąd."
"Mt13,54": "I przyszedł do swojej ojczyzny, i nauczał w ich synagodze, tak że się bardzo zdumiewali i mówili: Skąd u Niego ta mądrość i te moce?"
"Mt13,55": "Czy nie jest to syn cieśli? Czy Jego matka nie nazywa się Maria, a Jego bracia to Jakub, Józef, Szymon i Juda?"
"Mt13,56": "A Jego siostry, czy wszystkie nie są pośród nas? Skąd więc u Niego to wszystko?"
"Mt13,57": "I byli Nim zgorszeni; ale Jezus powiedział im: Nigdzie nie jest prorok pozbawiony czci, jak tylko w swojej ojczyźnie i w swoim domu."
"Mt13,58": "I nie uczynił tam wielu dzieł mocy ze względu na ich niedowiarstwo."
