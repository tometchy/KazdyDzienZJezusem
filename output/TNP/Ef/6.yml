"Ef6,1": "Dzieci, bądźcie posłuszne waszym rodzicom w Panu, bo jest to sprawiedliwe."
"Ef6,2": "Czcij swojego ojca i matkę, to jest pierwsze przykazanie w obietnicy,"
"Ef6,3": "Aby ci się dobrze działo i abyś długo żył na ziemi."
"Ef6,4": "A wy, ojcowie, nie pobudzajcie do gniewu waszych dzieci, ale wychowujcie je w karności i napominaniu Pana."
"Ef6,5": "Niewolnicy, posłuszni bądźcie tym, którzy są waszymi panami według ciała, z bojaźnią i z drżeniem, w prostocie waszego serca, tak jak Chrystusowi,"
"Ef6,6": "Nie dla oka służąc, jak ci, którzy chcą się przypodobać ludziom, ale jako niewolnicy Chrystusa, czyniąc z głębi duszy wolę Boga,"
"Ef6,7": "Z dobrej woli służąc Panu, a nie ludziom,"
"Ef6,8": "Wiedząc, że każdy, jeśli uczyni coś dobrego, otrzyma to samo od Pana, czy niewolnik, czy wolny."
"Ef6,9": "I wy, panowie, to samo czyńcie względem nich; porzućcie groźby, wiedząc, że ich i wasz Pan jest w niebiosach, a On nie ma względu na osoby."
"Ef6,10": "W końcu, bracia moi, wzmacniajcie się w Panu i w potędze Jego siły;"
"Ef6,11": "Przyobleczcie się w całą zbroję Bożą, abyście mogli stać mocno wobec podstępów diabła."
"Ef6,12": "Albowiem nie toczymy boju przeciwko krwi i ciału, lecz z władzami, ze zwierzchnościami, z rządcami tego wieku ciemności, z niegodziwymi duchami w niebiosach."
"Ef6,13": "Dlatego weźcie całą zbroję Bożą, abyście mogli dać odpór w dzień zły, a po wykonaniu wszystkiego stać niewzruszenie."
"Ef6,14": "Stójcie więc, mając swoje biodra przepasane prawdą i będąc obleczeni w pancerz sprawiedliwości,"
"Ef6,15": "A nogi obute w gotowość przynoszenia ewangelii pokoju,"
"Ef6,16": "A w tym wszystkim podnieście tarczę wiary, którą możecie zgasić wszystkie rozpalone strzały złego."
"Ef6,17": "I weźcie hełm zbawienia i miecz Ducha, którym jest Słowo Boże,"
"Ef6,18": "W każdej modlitwie i prośbie, modląc się w każdym czasie w Duchu i w tym celu czuwając z całą niezłomnością trwania i prośbą za wszystkich świętych,"
"Ef6,19": "I za mnie, aby dane mi było słowo, bym otwierając swoje usta, śmiało oznajmiał tajemnicę Ewangelii,"
"Ef6,20": "Z powodu której sprawuję poselstwo w więzach, abym o niej mówił śmiało, jak mówić mi trzeba."
"Ef6,21": "Żebyście jednak i wy wiedzieli, co się ze mną dzieje i co czynię, o tym wszystkim oznajmi wam Tychikus, brat umiłowany i wierny sługa w Panu,"
"Ef6,22": "Którego posłałem do was, dlatego, abyście wiedzieli, co się z nami dzieje i aby pocieszył wasze serca."
"Ef6,23": "Pokój braciom i miłość z wiarą od Boga Ojca i Pana Jezusa Chrystusa."
"Ef6,24": "Łaska z wszystkimi miłującymi Pana naszego Jezusa Chrystusa w szczerości."
