"Ef6,1":
  text: "Dzieci, bądźcie posłuszne waszym rodzicom w Panu, bo jest to sprawiedliwe."
  tags: []
"Ef6,2":
  text: "Czcij swojego ojca i matkę, to jest pierwsze przykazanie w obietnicy,"
  tags: []
"Ef6,3":
  text: "Aby ci się dobrze działo i abyś długo żył na ziemi."
  tags: []
"Ef6,4":
  text: "A wy, ojcowie, nie pobudzajcie do gniewu waszych dzieci, ale wychowujcie je w karności i napominaniu Pana."
  tags: []
"Ef6,5":
  text: "Niewolnicy, posłuszni bądźcie tym, którzy są waszymi panami według ciała, z bojaźnią i z drżeniem, w prostocie waszego serca, tak jak Chrystusowi,"
  tags: []
"Ef6,6":
  text: "Nie dla oka służąc, jak ci, którzy chcą się przypodobać ludziom, ale jako niewolnicy Chrystusa, czyniąc z głębi duszy wolę Boga,"
  tags: []
"Ef6,7":
  text: "Z dobrej woli służąc Panu, a nie ludziom,"
  tags: []
"Ef6,8":
  text: "Wiedząc, że każdy, jeśli uczyni coś dobrego, otrzyma to samo od Pana, czy niewolnik, czy wolny."
  tags: []
"Ef6,9":
  text: "I wy, panowie, to samo czyńcie względem nich; porzućcie groźby, wiedząc, że ich i wasz Pan jest w niebiosach, a On nie ma względu na osoby."
  tags: []
"Ef6,10":
  text: "W końcu, bracia moi, wzmacniajcie się w Panu i w potędze Jego siły;"
  tags: []
"Ef6,11":
  text: "Przyobleczcie się w całą zbroję Bożą, abyście mogli stać mocno wobec podstępów diabła."
  tags: []
"Ef6,12":
  text: "Albowiem nie toczymy boju przeciwko krwi i ciału, lecz z władzami, ze zwierzchnościami, z rządcami tego wieku ciemności, z niegodziwymi duchami w niebiosach."
  tags: []
"Ef6,13":
  text: "Dlatego weźcie całą zbroję Bożą, abyście mogli dać odpór w dzień zły, a po wykonaniu wszystkiego stać niewzruszenie."
  tags: []
"Ef6,14":
  text: "Stójcie więc, mając swoje biodra przepasane prawdą i będąc obleczeni w pancerz sprawiedliwości,"
  tags: []
"Ef6,15":
  text: "A nogi obute w gotowość przynoszenia ewangelii pokoju,"
  tags: []
"Ef6,16":
  text: "A w tym wszystkim podnieście tarczę wiary, którą możecie zgasić wszystkie rozpalone strzały złego."
  tags: []
"Ef6,17":
  text: "I weźcie hełm zbawienia i miecz Ducha, którym jest Słowo Boże,"
  tags: []
"Ef6,18":
  text: "W każdej modlitwie i prośbie, modląc się w każdym czasie w Duchu i w tym celu czuwając z całą niezłomnością trwania i prośbą za wszystkich świętych,"
  tags: []
"Ef6,19":
  text: "I za mnie, aby dane mi było słowo, bym otwierając swoje usta, śmiało oznajmiał tajemnicę Ewangelii,"
  tags: []
"Ef6,20":
  text: "Z powodu której sprawuję poselstwo w więzach, abym o niej mówił śmiało, jak mówić mi trzeba."
  tags: []
"Ef6,21":
  text: "Żebyście jednak i wy wiedzieli, co się ze mną dzieje i co czynię, o tym wszystkim oznajmi wam Tychikus, brat umiłowany i wierny sługa w Panu,"
  tags: []
"Ef6,22":
  text: "Którego posłałem do was, dlatego, abyście wiedzieli, co się z nami dzieje i aby pocieszył wasze serca."
  tags: []
"Ef6,23":
  text: "Pokój braciom i miłość z wiarą od Boga Ojca i Pana Jezusa Chrystusa."
  tags: []
"Ef6,24":
  text: "Łaska z wszystkimi miłującymi Pana naszego Jezusa Chrystusa w szczerości."
  tags: []
