"Ef2,1": "A was, będących martwymi w upadkach i grzechach,"
"Ef2,2": "W których niegdyś żyliście zgodnie z dobą tego świata, według przywódcy mającego władzę w powietrzu, ducha, który teraz działa w synach opornych,"
"Ef2,3": "Wśród nich i my wszyscy żyliśmy niegdyś w pożądliwościach naszego ciała, czyniąc wolę ciała i myśli, i byliśmy z natury dziećmi gniewu, jak i pozostali;"
"Ef2,4": "Bóg natomiast, będąc bogatym w miłosierdzie, przez swoją wielką miłość, którą nas umiłował,"
"Ef2,5": "I to nas, będących martwymi w upadkach, ożywił wraz z Chrystusem – łaską jesteście zbawieni,"
"Ef2,6": "I wraz z Nim wzbudził, i wraz z Nim posadził w niebiosach w Chrystusie Jezusie,"
"Ef2,7": "Aby okazać w nadchodzących wiekach przeobfite bogactwo swojej łaski w dobroci wobec nas w Chrystusie Jezusie."
"Ef2,8": "Łaską bowiem jesteście zbawieni przez wiarę, i to nie z was; dar to Boga;"
"Ef2,9": "Nie z uczynków, aby się ktoś nie chlubił."
"Ef2,10": "Jego bowiem dziełem jesteśmy, stworzeni w Chrystusie Jezusie do dobrych dzieł, które przygotował wcześniej Bóg, abyśmy w nich chodzili."
"Ef2,11": "Dlatego pamiętajcie, że wy, niegdyś poganie w ciele, nazywani nieobrzezanymi przez tego, który jest nazwany obrzezaniem na ciele wykonanym ręką,"
"Ef2,12": "Że wy byliście w owym czasie bez Chrystusa, oddzieleni od praw obywateli Izraela i obcy przymierzom obietnicy, nie mający nadziei i bez Boga na świecie."
"Ef2,13": "Ale teraz w Chrystusie Jezusie, wy, którzy niegdyś byliście dalecy, staliście się bliscy przez krew Chrystusa."
"Ef2,14": "On bowiem jest naszym pokojem, który z dwojga jedno uczynił i zburzył w ciele stojący pośrodku mur oddzielenia – wrogość."
"Ef2,15": "On Prawo przykazań, zawarte w ustawach, uznał za bezużyteczne, aby z tych dwóch stworzyć w sobie samym jednego nowego człowieka, czyniąc pokój,"
"Ef2,16": "I pojednał ponownie obydwóch w jednym ciele z Bogiem przez krzyż, w Nim zadając śmierć tej nieprzyjaźni."
"Ef2,17": "A gdy przyszedł, ogłosił dobrą nowinę pokoju wam, którzy byliście daleko, i którzy byliście blisko."
"Ef2,18": "Przez Niego bowiem mamy przystęp do Ojca, jedni i drudzy w jednym Duchu."
"Ef2,19": "I dlatego już nie jesteście obcymi i przychodniami, ale współobywatelami świętych i domownikami Boga,"
"Ef2,20": "Zbudowanymi na fundamencie apostołów i proroków, którego kamieniem węgielnym jest Jezus Chrystus,"
"Ef2,21": "W którym cała budowla razem spajana wzrasta w świętą świątynię w Panu;"
"Ef2,22": "W którym i wy jesteście wspólnie budowani, na mieszkanie Boga w Duchu."
