"Ef2,1":
  text: "A was, będących martwymi w upadkach i grzechach,"
  tags: []
"Ef2,2":
  text: "W których niegdyś żyliście zgodnie z dobą tego świata, według przywódcy mającego władzę w powietrzu, ducha, który teraz działa w synach opornych,"
  tags: []
"Ef2,3":
  text: "Wśród nich i my wszyscy żyliśmy niegdyś w pożądliwościach naszego ciała, czyniąc wolę ciała i myśli, i byliśmy z natury dziećmi gniewu, jak i pozostali;"
  tags: []
"Ef2,4":
  text: "Bóg natomiast, będąc bogatym w miłosierdzie, przez swoją wielką miłość, którą nas umiłował,"
  tags: []
"Ef2,5":
  text: "I to nas, będących martwymi w upadkach, ożywił wraz z Chrystusem – łaską jesteście zbawieni,"
  tags: []
"Ef2,6":
  text: "I wraz z Nim wzbudził, i wraz z Nim posadził w niebiosach w Chrystusie Jezusie,"
  tags: []
"Ef2,7":
  text: "Aby okazać w nadchodzących wiekach przeobfite bogactwo swojej łaski w dobroci wobec nas w Chrystusie Jezusie."
  tags: []
"Ef2,8":
  text: "Łaską bowiem jesteście zbawieni przez wiarę, i to nie z was; dar to Boga;"
  tags: []
"Ef2,9":
  text: "Nie z uczynków, aby się ktoś nie chlubił."
  tags: []
"Ef2,10":
  text: "Jego bowiem dziełem jesteśmy, stworzeni w Chrystusie Jezusie do dobrych dzieł, które przygotował wcześniej Bóg, abyśmy w nich chodzili."
  tags: []
"Ef2,11":
  text: "Dlatego pamiętajcie, że wy, niegdyś poganie w ciele, nazywani nieobrzezanymi przez tego, który jest nazwany obrzezaniem na ciele wykonanym ręką,"
  tags: []
"Ef2,12":
  text: "Że wy byliście w owym czasie bez Chrystusa, oddzieleni od praw obywateli Izraela i obcy przymierzom obietnicy, nie mający nadziei i bez Boga na świecie."
  tags: []
"Ef2,13":
  text: "Ale teraz w Chrystusie Jezusie, wy, którzy niegdyś byliście dalecy, staliście się bliscy przez krew Chrystusa."
  tags: []
"Ef2,14":
  text: "On bowiem jest naszym pokojem, który z dwojga jedno uczynił i zburzył w ciele stojący pośrodku mur oddzielenia – wrogość."
  tags: []
"Ef2,15":
  text: "On Prawo przykazań, zawarte w ustawach, uznał za bezużyteczne, aby z tych dwóch stworzyć w sobie samym jednego nowego człowieka, czyniąc pokój,"
  tags: []
"Ef2,16":
  text: "I pojednał ponownie obydwóch w jednym ciele z Bogiem przez krzyż, w Nim zadając śmierć tej nieprzyjaźni."
  tags: []
"Ef2,17":
  text: "A gdy przyszedł, ogłosił dobrą nowinę pokoju wam, którzy byliście daleko, i którzy byliście blisko."
  tags: []
"Ef2,18":
  text: "Przez Niego bowiem mamy przystęp do Ojca, jedni i drudzy w jednym Duchu."
  tags: []
"Ef2,19":
  text: "I dlatego już nie jesteście obcymi i przychodniami, ale współobywatelami świętych i domownikami Boga,"
  tags: []
"Ef2,20":
  text: "Zbudowanymi na fundamencie apostołów i proroków, którego kamieniem węgielnym jest Jezus Chrystus,"
  tags: []
"Ef2,21":
  text: "W którym cała budowla razem spajana wzrasta w świętą świątynię w Panu;"
  tags: []
"Ef2,22":
  text: "W którym i wy jesteście wspólnie budowani, na mieszkanie Boga w Duchu."
  tags: []
