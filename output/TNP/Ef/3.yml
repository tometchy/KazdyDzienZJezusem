"Ef3,1":
  text: "Z tego powodu ja, Paweł, jestem więźniem Chrystusa Jezusa za was pogan;"
  tags: []
"Ef3,2":
  text: "Jeśli tylko słyszeliście o rozporządzeniu łaski Bożej, danej mi dla was,"
  tags: []
"Ef3,3":
  text: "Że według objawienia została mi oznajmiona tajemnica, jak to wcześniej krótko napisałem,"
  tags: []
"Ef3,4":
  text: "Dzięki temu, czytając, możecie zrozumieć mój wgląd w tajemnicę Chrystusa,"
  tags: []
"Ef3,5":
  text: "Która w poprzednich pokoleniach nie była oznajmiona synom ludzkim, tak jak teraz została objawiona Jego świętym apostołom i prorokom w Duchu,"
  tags: []
"Ef3,6":
  text: "Że poganie są współdziedzicami i współczłonkami ciała, i współuczestnikami obietnicy Jego w Chrystusie przez Ewangelię."
  tags: []
"Ef3,7":
  text: "Jej to stałem się sługą według daru łaski Bożej, danej mi według skutecznej mocy Jego."
  tags: []
"Ef3,8":
  text: "Mnie, najmniejszemu ze wszystkich świętych, została dana ta łaska, abym między poganami głosił dobrą nowinę, to niezgłębione bogactwo Chrystusa,"
  tags: []
"Ef3,9":
  text: "I oświecił wszystkich, jaka jest wspólnota tajemnicy, która jest ukryta od wieków w Bogu, który wszystko stworzył przez Jezusa Chrystusa;"
  tags: []
"Ef3,10":
  text: "Aby teraz została przez Kościół oznajmiona władzom i zwierzchnościom w niebiosach różnorodna mądrość Boga,"
  tags: []
"Ef3,11":
  text: "Zgodnie z postanowieniem powziętym przed wiekami, które wykonał w Chrystusie Jezusie, naszym Panu."
  tags: []
"Ef3,12":
  text: "W Nim mamy śmiałość i przystęp z ufnością przez wiarę w Niego."
  tags: []
"Ef3,13":
  text: "Dlatego proszę, abyście nie upadali na duchu z powodu ucisków moich za was, które są waszą chwałą."
  tags: []
"Ef3,14":
  text: "Z tego powodu zginam moje kolana przed Ojcem Pana naszego Jezusa Chrystusa,"
  tags: []
"Ef3,15":
  text: "Od którego jest nazwana wszelka rodzina na niebie i na ziemi,"
  tags: []
"Ef3,16":
  text: "Aby dał wam według bogactwa swojej chwały, byście zostali mocą wzmocnieni przez Jego Ducha w wewnętrznym człowieku,"
  tags: []
"Ef3,17":
  text: "Aby Chrystus przez wiarę zadomowił się w waszych sercach,"
  tags: []
"Ef3,18":
  text: "A wy, którzy zostaliście w miłości zakorzenieni i ugruntowani, abyście nabrali siły by uchwycić razem ze wszystkimi świętymi, jaka jest szerokość i długość, i głębokość, i wysokość,"
  tags: []
"Ef3,19":
  text: "I poznać także tę miłość Chrystusa, która przewyższa wszelką wiedzę, abyście zostali napełnieni do całej pełni Boga."
  tags: []
"Ef3,20":
  text: "A Temu, który według mocy w nas działającej, może uczynić daleko więcej, ponad to wszystko, o co prosimy lub o czym myślimy,"
  tags: []
"Ef3,21":
  text: "Temu chwała w Kościele w Chrystusie Jezusie we wszystkich pokoleniach, na wieki wieków. Amen."
  tags: []
