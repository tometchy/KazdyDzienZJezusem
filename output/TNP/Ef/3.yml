"Ef3,1": "Z tego powodu ja, Paweł, jestem więźniem Chrystusa Jezusa za was pogan;"
"Ef3,2": "Jeśli tylko słyszeliście o rozporządzeniu łaski Bożej, danej mi dla was,"
"Ef3,3": "Że według objawienia została mi oznajmiona tajemnica, jak to wcześniej krótko napisałem,"
"Ef3,4": "Dzięki temu, czytając, możecie zrozumieć mój wgląd w tajemnicę Chrystusa,"
"Ef3,5": "Która w poprzednich pokoleniach nie była oznajmiona synom ludzkim, tak jak teraz została objawiona Jego świętym apostołom i prorokom w Duchu,"
"Ef3,6": "Że poganie są współdziedzicami i współczłonkami ciała, i współuczestnikami obietnicy Jego w Chrystusie przez Ewangelię."
"Ef3,7": "Jej to stałem się sługą według daru łaski Bożej, danej mi według skutecznej mocy Jego."
"Ef3,8": "Mnie, najmniejszemu ze wszystkich świętych, została dana ta łaska, abym między poganami głosił dobrą nowinę, to niezgłębione bogactwo Chrystusa,"
"Ef3,9": "I oświecił wszystkich, jaka jest wspólnota tajemnicy, która jest ukryta od wieków w Bogu, który wszystko stworzył przez Jezusa Chrystusa;"
"Ef3,10": "Aby teraz została przez Kościół oznajmiona władzom i zwierzchnościom w niebiosach różnorodna mądrość Boga,"
"Ef3,11": "Zgodnie z postanowieniem powziętym przed wiekami, które wykonał w Chrystusie Jezusie, naszym Panu."
"Ef3,12": "W Nim mamy śmiałość i przystęp z ufnością przez wiarę w Niego."
"Ef3,13": "Dlatego proszę, abyście nie upadali na duchu z powodu ucisków moich za was, które są waszą chwałą."
"Ef3,14": "Z tego powodu zginam moje kolana przed Ojcem Pana naszego Jezusa Chrystusa,"
"Ef3,15": "Od którego jest nazwana wszelka rodzina na niebie i na ziemi,"
"Ef3,16": "Aby dał wam według bogactwa swojej chwały, byście zostali mocą wzmocnieni przez Jego Ducha w wewnętrznym człowieku,"
"Ef3,17": "Aby Chrystus przez wiarę zadomowił się w waszych sercach,"
"Ef3,18": "A wy, którzy zostaliście w miłości zakorzenieni i ugruntowani, abyście nabrali siły by uchwycić razem ze wszystkimi świętymi, jaka jest szerokość i długość, i głębokość, i wysokość,"
"Ef3,19": "I poznać także tę miłość Chrystusa, która przewyższa wszelką wiedzę, abyście zostali napełnieni do całej pełni Boga."
"Ef3,20": "A Temu, który według mocy w nas działającej, może uczynić daleko więcej, ponad to wszystko, o co prosimy lub o czym myślimy,"
"Ef3,21": "Temu chwała w Kościele w Chrystusie Jezusie we wszystkich pokoleniach, na wieki wieków. Amen."
