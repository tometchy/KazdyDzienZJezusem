"Ef1,1":
  text: "Paweł, apostoł Jezusa Chrystusa z woli Boga, do świętych, którzy są w Efezie i wiernych w Chrystusie Jezusie."
  tags: []
"Ef1,2":
  text: "Łaska wam i pokój od Boga, Ojca naszego i Pana Jezusa Chrystusa."
  tags: []
"Ef1,3":
  text: "Błogosławiony Bóg i Ojciec Pana naszego Jezusa Chrystusa, Ten, który nas pobłogosławił wszelkim duchowym błogosławieństwem niebios w Chrystusie."
  tags: []
"Ef1,4":
  text: "Tak jak i wybrał nas dla siebie w Nim przed założeniem świata, abyśmy byli święci i nienaganni przed Nim w miłości,"
  tags: []
"Ef1,5":
  text: "Przeznaczył nas dla siebie do usynowienia przez Jezusa Chrystusa, według upodobania swojej woli,"
  tags: []
"Ef1,6":
  text: "Ku chwale sławy swojej łaski, którą obdarzył nas w Umiłowanym."
  tags: []
"Ef1,7":
  text: "W Nim mamy odkupienie przez Jego krew, odpuszczenie upadków według bogactwa Jego łaski,"
  tags: []
"Ef1,8":
  text: "Którą hojnie nas obdarzył we wszelkiej mądrości i roztropności."
  tags: []
"Ef1,9":
  text: "Oznajmiając nam tajemnicę swojej woli według swojego upodobania, które powziął w Nim,"
  tags: []
"Ef1,10":
  text: "Aby w akcie zarządzenia pełni czasów, w Chrystusie jako głowie, w jedno zgromadzić wszystko, zarówno to co w niebiosach, jak i na ziemi, w Nim,"
  tags: []
"Ef1,11":
  text: "W którym też jesteśmy wybrani do dziedzictwa, my, którzy zostaliśmy przeznaczeni według postanowienia Tego, który sprawia wszystko według decyzji swojej woli,"
  tags: []
"Ef1,12":
  text: "Abyśmy istnieli ku chwale sławy Jego, my, którzy już wcześniej położyliśmy swoją nadzieję w Chrystusie."
  tags: []
"Ef1,13":
  text: "W Nim i wy usłyszeliście słowo prawdy, Ewangelię o zbawieniu waszym, w Nim też uwierzyliście i zostaliście zapieczętowani Duchem obietnicy – Świętym,"
  tags: []
"Ef1,14":
  text: "Który jest poręką naszego dziedzictwa dla odkupienia nabytej własności, dla chwały sławy Jego."
  tags: []
"Ef1,15":
  text: "Dlatego i ja, gdy usłyszałem o wierze waszej w Panu Jezusie i o miłości do wszystkich świętych,"
  tags: []
"Ef1,16":
  text: "Nie przestaję dziękować za was, wspominając o was w moich modlitwach,"
  tags: []
"Ef1,17":
  text: "Aby Bóg Pana naszego Jezusa Chrystusa, Ojciec chwały, dał wam Ducha mądrości i objawienia w dogłębnym poznaniu Jego,"
  tags: []
"Ef1,18":
  text: "I oświecone oczy waszego umysłu, abyście wiedzieli jaka jest nadzieja Jego powołania i jakie jest bogactwo chwały dziedzictwa Jego w świętych,"
  tags: []
"Ef1,19":
  text: "I jak przeogromną jest wielkość Jego mocy wobec nas, którzy wierzymy zgodnie z działaniem potęgi siły Jego,"
  tags: []
"Ef1,20":
  text: "Którą działał w Chrystusie, gdy wzbudził Go z martwych i posadził po swojej prawicy w niebiosach,"
  tags: []
"Ef1,21":
  text: "Wyżej nad wszelkie zwierzchności i władze, i moce, i panowania, i wszelkie imię jakie może być wymieniane, nie tylko w tym wieku, ale i w tym nadchodzącym;"
  tags: []
"Ef1,22":
  text: "I wszystko poddał pod Jego stopy, a Jego dał jako głowę ponad wszystkim Kościołowi,"
  tags: []
"Ef1,23":
  text: "Który jest Jego ciałem i pełnią Tego, który sam wszystko we wszystkich napełnia sobą."
  tags: []
