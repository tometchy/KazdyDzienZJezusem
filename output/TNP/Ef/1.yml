"Ef1,1": "Paweł, apostoł Jezusa Chrystusa z woli Boga, do świętych, którzy są w Efezie i wiernych w Chrystusie Jezusie."
"Ef1,2": "Łaska wam i pokój od Boga, Ojca naszego i Pana Jezusa Chrystusa."
"Ef1,3": "Błogosławiony Bóg i Ojciec Pana naszego Jezusa Chrystusa, Ten, który nas pobłogosławił wszelkim duchowym błogosławieństwem niebios w Chrystusie."
"Ef1,4": "Tak jak i wybrał nas dla siebie w Nim przed założeniem świata, abyśmy byli święci i nienaganni przed Nim w miłości,"
"Ef1,5": "Przeznaczył nas dla siebie do usynowienia przez Jezusa Chrystusa, według upodobania swojej woli,"
"Ef1,6": "Ku chwale sławy swojej łaski, którą obdarzył nas w Umiłowanym."
"Ef1,7": "W Nim mamy odkupienie przez Jego krew, odpuszczenie upadków według bogactwa Jego łaski,"
"Ef1,8": "Którą hojnie nas obdarzył we wszelkiej mądrości i roztropności."
"Ef1,9": "Oznajmiając nam tajemnicę swojej woli według swojego upodobania, które powziął w Nim,"
"Ef1,10": "Aby w akcie zarządzenia pełni czasów, w Chrystusie jako głowie, w jedno zgromadzić wszystko, zarówno to co w niebiosach, jak i na ziemi, w Nim,"
"Ef1,11": "W którym też jesteśmy wybrani do dziedzictwa, my, którzy zostaliśmy przeznaczeni według postanowienia Tego, który sprawia wszystko według decyzji swojej woli,"
"Ef1,12": "Abyśmy istnieli ku chwale sławy Jego, my, którzy już wcześniej położyliśmy swoją nadzieję w Chrystusie."
"Ef1,13": "W Nim i wy usłyszeliście słowo prawdy, Ewangelię o zbawieniu waszym, w Nim też uwierzyliście i zostaliście zapieczętowani Duchem obietnicy – Świętym,"
"Ef1,14": "Który jest poręką naszego dziedzictwa dla odkupienia nabytej własności, dla chwały sławy Jego."
"Ef1,15": "Dlatego i ja, gdy usłyszałem o wierze waszej w Panu Jezusie i o miłości do wszystkich świętych,"
"Ef1,16": "Nie przestaję dziękować za was, wspominając o was w moich modlitwach,"
"Ef1,17": "Aby Bóg Pana naszego Jezusa Chrystusa, Ojciec chwały, dał wam Ducha mądrości i objawienia w dogłębnym poznaniu Jego,"
"Ef1,18": "I oświecone oczy waszego umysłu, abyście wiedzieli jaka jest nadzieja Jego powołania i jakie jest bogactwo chwały dziedzictwa Jego w świętych,"
"Ef1,19": "I jak przeogromną jest wielkość Jego mocy wobec nas, którzy wierzymy zgodnie z działaniem potęgi siły Jego,"
"Ef1,20": "Którą działał w Chrystusie, gdy wzbudził Go z martwych i posadził po swojej prawicy w niebiosach,"
"Ef1,21": "Wyżej nad wszelkie zwierzchności i władze, i moce, i panowania, i wszelkie imię jakie może być wymieniane, nie tylko w tym wieku, ale i w tym nadchodzącym;"
"Ef1,22": "I wszystko poddał pod Jego stopy, a Jego dał jako głowę ponad wszystkim Kościołowi,"
"Ef1,23": "Który jest Jego ciałem i pełnią Tego, który sam wszystko we wszystkich napełnia sobą."
