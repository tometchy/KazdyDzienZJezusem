"1J3,1":
  text: "Zobaczcie, jaką miłość daje nam Ojciec, abyśmy byli nazwani dziećmi Bożymi. Świat dlatego nas nie zna, ponieważ Jego nie poznał."
  tags: []
"1J3,2":
  text: "Umiłowani! Teraz jesteśmy dziećmi Bożymi, a jeszcze nie zostało ukazane kim będziemy; lecz wiemy, że gdy On się ukaże, będziemy do Niego podobni; ujrzymy Go bowiem takim, jakim jest."
  tags: []
"1J3,3":
  text: "A każdy kto ma tę nadzieję w Nim, oczyszcza siebie, tak jak On jest czysty."
  tags: []
"1J3,4":
  text: "Każdy, kto trwa w grzechu, czyni też bezprawie; a grzech jest bezprawiem."
  tags: []
"1J3,5":
  text: "A wiecie, że On ukazał się, aby usunąć nasze grzechy, i że grzechu w Nim nie ma."
  tags: []
"1J3,6":
  text: "Każdy, kto w Nim trwa, nie grzeszy; każdy kto trwa w grzechu nie widział Go, ani Go nie poznał."
  tags: []
"1J3,7":
  text: "Dzieciątka! Niech was nikt nie zwodzi; kto czyni sprawiedliwość, jest sprawiedliwy, tak jak On jest sprawiedliwy;"
  tags: []
"1J3,8":
  text: "Kto trwa w grzechu, jest z diabła; gdyż diabeł od początku grzeszy. Dlatego ukazał się Syn Boży, aby zniszczyć dzieła diabła."
  tags: []
"1J3,9":
  text: "Każdy, kto jest zrodzony z Boga, nie czyni grzechu, dlatego że nasienie Jego jest w nim; i nie może trwać w grzechu, gdyż jest narodzony z Boga."
  tags: []
"1J3,10":
  text: "Po tym poznaje się dzieci Boga i dzieci diabła. Każdy, kto nie czyni sprawiedliwości, nie jest z Boga, jak i ten, kto nie miłuje swojego brata."
  tags: []
"1J3,11":
  text: "Albowiem to jest przesłanie, które słyszeliście od początku, abyśmy jedni drugich miłowali."
  tags: []
"1J3,12":
  text: "Nie tak jak Kain, który był od złego i brutalnie zamordował swojego brata. A dlaczego brutalnie go zamordował? Bo jego czyny były złe, a czyny jego brata sprawiedliwe."
  tags: []
"1J3,13":
  text: "Nie dziwcie się, moi bracia, jeśli was świat nienawidzi."
  tags: []
"1J3,14":
  text: "My wiemy, że przeszliśmy ze śmierci do życia, dlatego że trwamy w miłości do braci; kto nie trwa w miłości do brata, pozostaje w śmierci."
  tags: []
"1J3,15":
  text: "Każdy, kto trwa w nienawiści do swojego brata, jest mordercą; a wiecie, że żaden morderca nie ma życia wiecznego, które by w nim pozostawało."
  tags: []
"1J3,16":
  text: "Po tym poznaliśmy miłość Bożą, że On za nas położył swoje życie; i my powinniśmy kłaść życie za braci."
  tags: []
"1J3,17":
  text: "A jeśli ktoś miałby dobra tego świata, a widziałby swojego brata, że jest w potrzebie, i zamknąłby przed nim swoje wnętrze, jak więc może w nim trwać miłość Boża?"
  tags: []
"1J3,18":
  text: "Dzieciątka moje! Miłujmy nie słowem lub językiem, ale czynem i prawdą."
  tags: []
"1J3,19":
  text: "A po tym poznajemy, że jesteśmy z prawdy; i przed Nim przekonamy swoje serca,"
  tags: []
"1J3,20":
  text: "Bo jeśli potępiałoby nas serce, Bóg jest potężniejszy niż nasze serce i wie wszystko."
  tags: []
"1J3,21":
  text: "Umiłowani! Jeśliby nasze serce nas nie potępiało, ufną odwagę mamy w Bogu,"
  tags: []
"1J3,22":
  text: "I o cokolwiek prosilibyśmy, otrzymamy od Niego; bo przykazania Jego zachowujemy, i czynimy to, co podoba się przed Jego obliczem."
  tags: []
"1J3,23":
  text: "A to jest Jego przykazanie, abyśmy wierzyli w imię Jego Syna, Jezusa Chrystusa i miłowali jedni drugich, zgodnie z przykazaniem jakie nam dał."
  tags: []
"1J3,24":
  text: "A kto trwa w przestrzeganiu Jego przykazania, ten w Nim trwa, a On w nim. I po tym poznajemy, że w nas trwa, przez Ducha, którego nam dał."
  tags: []
