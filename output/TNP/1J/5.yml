"1J5,1": "Każdy, kto wierzy, że Jezus jest Mesjaszem, jest zrodzony z Boga; a każdy, kto miłuje Tego, który zrodził, miłuje i tego, który z Niego jest zrodzony."
"1J5,2": "Po tym poznajemy, że miłujemy dzieci Boże, gdy miłujemy Boga i zachowujemy Jego przykazania."
"1J5,3": "To bowiem jest miłość Boga, byśmy przykazania Jego zachowywali; a przykazania Jego nie są uciążliwe."
"1J5,4": "Bo wszystko, co jest zrodzone z Boga, nieustannie zwycięża świat; a to jest zwycięstwo, które zwyciężyło świat – nasza wiara."
"1J5,5": "Kim jest ten, który ciągle zwycięża świat, jeśli nie tym, który wierzy, że Jezus jest Synem Boga?"
"1J5,6": "On jest tym, który przyszedł przez wodę i krew, Jezus Mesjasz, nie tylko w wodzie, ale w wodzie i we krwi; a Duch jest tym, który świadczy, bo Duch jest prawdą."
"1J5,7": "Gdyż trzej są, którzy świadczą w niebie: Ojciec, Słowo i Duch Święty, a ci trzej są jedno."
"1J5,8": "I trzej są, którzy świadczą na ziemi: Duch i woda, i krew, a ci trzej są w jednym."
"1J5,9": "Jeżeli przyjmujemy świadectwo ludzi, to świadectwo Boże jest większe, gdyż jest to świadectwo Boga, jako że złożył świadectwo o swoim Synu."
"1J5,10": "Kto wierzy w Syna Bożego, ma świadectwo sam w sobie. Kto nie wierzy Bogu, uczynił Go kłamcą, bo nie uwierzył w świadectwo, które Bóg złożył o swoim Synu."
"1J5,11": "A takie jest to świadectwo, że Bóg dał nam życie wieczne; a to życie jest w Jego Synu."
"1J5,12": "Kto ma Syna, ma to życie; kto nie ma Syna Bożego, nie ma tego życia."
"1J5,13": "To napisałem wam, którzy wierzycie w imię Syna Bożego, byście wiedzieli, że macie życie wieczne i abyście wierzyli w imię Syna Bożego."
"1J5,14": "A to jest ufna odwaga, którą mamy do Niego, że jeśli o coś prosimy według Jego woli, wysłuchuje nas."
"1J5,15": "A jeśli wiemy, że nas wysłuchuje, gdy o cokolwiek prosimy, to wiemy, że mamy od Niego odpowiedź na prośby, które zanosimy."
"1J5,16": "Jeśli ktoś zobaczyłby, że jego brat grzeszy grzechem nie na śmierć, będzie prosił, a Bóg da mu życie, to jest tym niegrzeszącym na śmierć. Jest grzech prowadzący na śmierć; nie o takim mówię, aby prosić."
"1J5,17": "Wszelka niesprawiedliwość jest grzechem; jest też grzech nieprowadzący na śmierć."
"1J5,18": "Wiemy, że każdy, kto z Boga jest zrodzony, nie trwa w grzechu; ale kto został zrodzony z Boga, strzeże siebie i zły go nie dotyka."
"1J5,19": "Wiemy, że jesteśmy z Boga, a cały świat leży w złym."
"1J5,20": "Wiemy też, że Syn Boży nadchodzi, i dał nam rozum, abyśmy poznawali Prawdziwego – i jesteśmy w Prawdziwym, w Jego Synu, Jezusie Chrystusie; Ten jest – Prawdziwym Bogiem i życiem wiecznym."
"1J5,21": "Dzieciątka! Ustrzeżcie się bożków. Amen."
