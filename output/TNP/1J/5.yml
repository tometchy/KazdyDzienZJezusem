"1J5,1":
  text: "Każdy, kto wierzy, że Jezus jest Mesjaszem, jest zrodzony z Boga; a każdy, kto miłuje Tego, który zrodził, miłuje i tego, który z Niego jest zrodzony."
  tags: []
"1J5,2":
  text: "Po tym poznajemy, że miłujemy dzieci Boże, gdy miłujemy Boga i zachowujemy Jego przykazania."
  tags: []
"1J5,3":
  text: "To bowiem jest miłość Boga, byśmy przykazania Jego zachowywali; a przykazania Jego nie są uciążliwe."
  tags: []
"1J5,4":
  text: "Bo wszystko, co jest zrodzone z Boga, nieustannie zwycięża świat; a to jest zwycięstwo, które zwyciężyło świat – nasza wiara."
  tags: []
"1J5,5":
  text: "Kim jest ten, który ciągle zwycięża świat, jeśli nie tym, który wierzy, że Jezus jest Synem Boga?"
  tags: []
"1J5,6":
  text: "On jest tym, który przyszedł przez wodę i krew, Jezus Mesjasz, nie tylko w wodzie, ale w wodzie i we krwi; a Duch jest tym, który świadczy, bo Duch jest prawdą."
  tags: []
"1J5,7":
  text: "Gdyż trzej są, którzy świadczą w niebie: Ojciec, Słowo i Duch Święty, a ci trzej są jedno."
  tags: []
"1J5,8":
  text: "I trzej są, którzy świadczą na ziemi: Duch i woda, i krew, a ci trzej są w jednym."
  tags: []
"1J5,9":
  text: "Jeżeli przyjmujemy świadectwo ludzi, to świadectwo Boże jest większe, gdyż jest to świadectwo Boga, jako że złożył świadectwo o swoim Synu."
  tags: []
"1J5,10":
  text: "Kto wierzy w Syna Bożego, ma świadectwo sam w sobie. Kto nie wierzy Bogu, uczynił Go kłamcą, bo nie uwierzył w świadectwo, które Bóg złożył o swoim Synu."
  tags: []
"1J5,11":
  text: "A takie jest to świadectwo, że Bóg dał nam życie wieczne; a to życie jest w Jego Synu."
  tags: []
"1J5,12":
  text: "Kto ma Syna, ma to życie; kto nie ma Syna Bożego, nie ma tego życia."
  tags: []
"1J5,13":
  text: "To napisałem wam, którzy wierzycie w imię Syna Bożego, byście wiedzieli, że macie życie wieczne i abyście wierzyli w imię Syna Bożego."
  tags: []
"1J5,14":
  text: "A to jest ufna odwaga, którą mamy do Niego, że jeśli o coś prosimy według Jego woli, wysłuchuje nas."
  tags: []
"1J5,15":
  text: "A jeśli wiemy, że nas wysłuchuje, gdy o cokolwiek prosimy, to wiemy, że mamy od Niego odpowiedź na prośby, które zanosimy."
  tags: []
"1J5,16":
  text: "Jeśli ktoś zobaczyłby, że jego brat grzeszy grzechem nie na śmierć, będzie prosił, a Bóg da mu życie, to jest tym niegrzeszącym na śmierć. Jest grzech prowadzący na śmierć; nie o takim mówię, aby prosić."
  tags: []
"1J5,17":
  text: "Wszelka niesprawiedliwość jest grzechem; jest też grzech nieprowadzący na śmierć."
  tags: []
"1J5,18":
  text: "Wiemy, że każdy, kto z Boga jest zrodzony, nie trwa w grzechu; ale kto został zrodzony z Boga, strzeże siebie i zły go nie dotyka."
  tags: []
"1J5,19":
  text: "Wiemy, że jesteśmy z Boga, a cały świat leży w złym."
  tags: []
"1J5,20":
  text: "Wiemy też, że Syn Boży nadchodzi, i dał nam rozum, abyśmy poznawali Prawdziwego – i jesteśmy w Prawdziwym, w Jego Synu, Jezusie Chrystusie; Ten jest – Prawdziwym Bogiem i życiem wiecznym."
  tags: []
"1J5,21":
  text: "Dzieciątka! Ustrzeżcie się bożków. Amen."
  tags: []
