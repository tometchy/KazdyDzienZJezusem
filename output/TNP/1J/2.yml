"1J2,1":
  text: "Dzieciątka moje! To wam piszę, abyście nie grzeszyli; a jeśliby ktoś zgrzeszył, mamy obrońcę u Ojca, Jezusa Chrystusa sprawiedliwego,"
  tags: []
"1J2,2":
  text: "On też jest ofiarą przebłagalną za nasze grzechy, a nie tylko za nasze, ale też za grzechy całego świata."
  tags: []
"1J2,3":
  text: "A po tym poznajemy, że Go znamy, jeśli przykazania Jego zachowujemy."
  tags: []
"1J2,4":
  text: "Kto mówi: Poznałem Go, a nie zachowuje Jego przykazań, jest kłamcą i nie ma w nim prawdy;"
  tags: []
"1J2,5":
  text: "Lecz kto zachowuje Jego słowo, w tym prawdziwie miłość Boża doprowadzona jest do pełni. Po tym poznajemy, że w Nim jesteśmy."
  tags: []
"1J2,6":
  text: "Kto mówi, że trwa w Nim, ten sam powinien tak postępować jak On postępował."
  tags: []
"1J2,7":
  text: "Bracia! Nie piszę wam nowego przykazania, ale stare przykazanie, które mieliście od początku; tym starym przykazaniem jest to Słowo, które usłyszeliście od początku."
  tags: []
"1J2,8":
  text: "Jednak ponownie piszę wam nowe przykazanie, które jest prawdziwe w Nim i w was; bo ciemność przemija, a prawdziwa światłość już świeci."
  tags: []
"1J2,9":
  text: "Kto mówi, że jest w światłości, a nienawidzi swojego brata, aż dotąd jest w ciemności."
  tags: []
"1J2,10":
  text: "Kto miłuje swojego brata, w światłości mieszka i nie ma w nim zgorszenia."
  tags: []
"1J2,11":
  text: "Lecz kto nienawidzi swojego brata, jest w ciemności i chodzi w ciemności, a nie wie, gdzie idzie bo ciemność oślepiła jego oczy."
  tags: []
"1J2,12":
  text: "Piszę wam, dzieciątka, bo odpuszczone są wam grzechy ze względu na Jego imię."
  tags: []
"1J2,13":
  text: "Piszę wam, ojcowie, bo poznaliście Tego, który jest od początku. Piszę wam, młodzieńcy, bo zwyciężyliście złego. Piszę wam, dzieci, bo poznaliście Ojca."
  tags: []
"1J2,14":
  text: "Pisałem wam, ojcowie, bo poznaliście Tego, który jest od początku. Pisałem wam, młodzieńcy, bo jesteście mocni i Słowo Boże mieszka w was, i zwyciężyliście złego."
  tags: []
"1J2,15":
  text: "Nie miłujcie świata, ani tego, co jest na świecie; jeśli ktoś miłuje świat, nie ma w nim miłości Ojca."
  tags: []
"1J2,16":
  text: "Bo wszystko, co jest na świecie: pożądliwość ciała i pożądliwość oczu, i pycha życia, nie jest z Ojca, ale jest ze świata."
  tags: []
"1J2,17":
  text: "A świat przemija i jego pożądliwość; lecz kto czyni wolę Boga, trwa na wieki."
  tags: []
"1J2,18":
  text: "Dzieci! To jest ostatnia godzina; a jak słyszeliście, że antychryst przychodzi, tak i teraz wielu stało się antychrystami, stąd poznajemy, że jest to ostatnia godzina."
  tags: []
"1J2,19":
  text: "Wyszli spośród nas, ale nie byli z nas; jeśli bowiem byliby z nas, trwaliby z nami; lecz to się stało, aby zostało ujawnione, że nie wszyscy są z nas."
  tags: []
"1J2,20":
  text: "A wy macie namaszczenie od Świętego i wiecie wszystko."
  tags: []
"1J2,21":
  text: "Nie napisałem wam, że nie znacie prawdy, ale że ją znacie, i że każde kłamstwo nie jest z prawdy."
  tags: []
"1J2,22":
  text: "Kto jest kłamcą? Czy nie ten, kto przeczy, że Jezus jest Chrystusem? Ten jest antychrystem, który zapiera się Ojca i Syna."
  tags: []
"1J2,23":
  text: "Każdy, kto zapiera się Syna, nie ma i Ojca; a kto wyznaje Syna, ma i Ojca."
  tags: []
"1J2,24":
  text: "Wy więc, którzy słyszeliście to, co od początku, niech to w was pozostaje, jeśli w was pozostałoby to, co słyszeliście od początku, to i wy pozostaniecie w Synu i w Ojcu."
  tags: []
"1J2,25":
  text: "A taka jest obietnica, którą On nam złożył – życie wieczne."
  tags: []
"1J2,26":
  text: "To napisałem wam o tych, którzy was zwodzą."
  tags: []
"1J2,27":
  text: "A wy, którzy otrzymaliście to namaszczenie od Niego, ono trwa w was i nie macie potrzeby, aby was ktoś nauczał; ale jak Jego namaszczenie naucza was o wszystkim i jest prawdziwe, i nie jest kłamstwem, i jak was nauczył, tak będziecie w Nim trwać."
  tags: []
"1J2,28":
  text: "A teraz, dzieciątka, trwajcie w Nim, abyśmy, gdy się ukaże, ciągle mieli ufną odwagę i nie zostali przez Niego zawstydzeni przy Jego przyjściu."
  tags: []
"1J2,29":
  text: "Jeżeli doświadczyliście, że On jest sprawiedliwy, wiecie też, że każdy, kto czyni sprawiedliwość, z Niego jest zrodzony."
  tags: []
