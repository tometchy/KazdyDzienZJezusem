"1J2,1": "Dzieciątka moje! To wam piszę, abyście nie grzeszyli; a jeśliby ktoś zgrzeszył, mamy obrońcę u Ojca, Jezusa Chrystusa sprawiedliwego,"
"1J2,2": "On też jest ofiarą przebłagalną za nasze grzechy, a nie tylko za nasze, ale też za grzechy całego świata."
"1J2,3": "A po tym poznajemy, że Go znamy, jeśli przykazania Jego zachowujemy."
"1J2,4": "Kto mówi: Poznałem Go, a nie zachowuje Jego przykazań, jest kłamcą i nie ma w nim prawdy;"
"1J2,5": "Lecz kto zachowuje Jego słowo, w tym prawdziwie miłość Boża doprowadzona jest do pełni. Po tym poznajemy, że w Nim jesteśmy."
"1J2,6": "Kto mówi, że trwa w Nim, ten sam powinien tak postępować jak On postępował."
"1J2,7": "Bracia! Nie piszę wam nowego przykazania, ale stare przykazanie, które mieliście od początku; tym starym przykazaniem jest to Słowo, które usłyszeliście od początku."
"1J2,8": "Jednak ponownie piszę wam nowe przykazanie, które jest prawdziwe w Nim i w was; bo ciemność przemija, a prawdziwa światłość już świeci."
"1J2,9": "Kto mówi, że jest w światłości, a nienawidzi swojego brata, aż dotąd jest w ciemności."
"1J2,10": "Kto miłuje swojego brata, w światłości mieszka i nie ma w nim zgorszenia."
"1J2,11": "Lecz kto nienawidzi swojego brata, jest w ciemności i chodzi w ciemności, a nie wie, gdzie idzie bo ciemność oślepiła jego oczy."
"1J2,12": "Piszę wam, dzieciątka, bo odpuszczone są wam grzechy ze względu na Jego imię."
"1J2,13": "Piszę wam, ojcowie, bo poznaliście Tego, który jest od początku. Piszę wam, młodzieńcy, bo zwyciężyliście złego. Piszę wam, dzieci, bo poznaliście Ojca."
"1J2,14": "Pisałem wam, ojcowie, bo poznaliście Tego, który jest od początku. Pisałem wam, młodzieńcy, bo jesteście mocni i Słowo Boże mieszka w was, i zwyciężyliście złego."
"1J2,15": "Nie miłujcie świata, ani tego, co jest na świecie; jeśli ktoś miłuje świat, nie ma w nim miłości Ojca."
"1J2,16": "Bo wszystko, co jest na świecie: pożądliwość ciała i pożądliwość oczu, i pycha życia, nie jest z Ojca, ale jest ze świata."
"1J2,17": "A świat przemija i jego pożądliwość; lecz kto czyni wolę Boga, trwa na wieki."
"1J2,18": "Dzieci! To jest ostatnia godzina; a jak słyszeliście, że antychryst przychodzi, tak i teraz wielu stało się antychrystami, stąd poznajemy, że jest to ostatnia godzina."
"1J2,19": "Wyszli spośród nas, ale nie byli z nas; jeśli bowiem byliby z nas, trwaliby z nami; lecz to się stało, aby zostało ujawnione, że nie wszyscy są z nas."
"1J2,20": "A wy macie namaszczenie od Świętego i wiecie wszystko."
"1J2,21": "Nie napisałem wam, że nie znacie prawdy, ale że ją znacie, i że każde kłamstwo nie jest z prawdy."
"1J2,22": "Kto jest kłamcą? Czy nie ten, kto przeczy, że Jezus jest Chrystusem? Ten jest antychrystem, który zapiera się Ojca i Syna."
"1J2,23": "Każdy, kto zapiera się Syna, nie ma i Ojca; a kto wyznaje Syna, ma i Ojca."
"1J2,24": "Wy więc, którzy słyszeliście to, co od początku, niech to w was pozostaje, jeśli w was pozostałoby to, co słyszeliście od początku, to i wy pozostaniecie w Synu i w Ojcu."
"1J2,25": "A taka jest obietnica, którą On nam złożył – życie wieczne."
"1J2,26": "To napisałem wam o tych, którzy was zwodzą."
"1J2,27": "A wy, którzy otrzymaliście to namaszczenie od Niego, ono trwa w was i nie macie potrzeby, aby was ktoś nauczał; ale jak Jego namaszczenie naucza was o wszystkim i jest prawdziwe, i nie jest kłamstwem, i jak was nauczył, tak będziecie w Nim trwać."
"1J2,28": "A teraz, dzieciątka, trwajcie w Nim, abyśmy, gdy się ukaże, ciągle mieli ufną odwagę i nie zostali przez Niego zawstydzeni przy Jego przyjściu."
"1J2,29": "Jeżeli doświadczyliście, że On jest sprawiedliwy, wiecie też, że każdy, kto czyni sprawiedliwość, z Niego jest zrodzony."
