"1J1,1": "Co było od początku, co słyszeliśmy, co naszymi oczami widzieliśmy, na co patrzyliśmy i czego nasze ręce dotknęły, to opowiadamy – o Słowie życia,"
"1J1,2": "A życie zostało ukazane i widzieliśmy, i świadczymy, i ogłaszamy wam to życie wieczne, które było u Ojca i nam zostało ukazane."
"1J1,3": "Co widzieliśmy i słyszeliśmy, to wam ogłaszamy, byście i wy z nami mieli społeczność; a społeczność nasza jest z Ojcem i z Jego Synem, Jezusem Chrystusem."
"1J1,4": "A to wam piszemy, aby radość wasza była pełna."
"1J1,5": "A to jest poselstwo, które słyszeliśmy od Niego i wam ogłaszamy, że Bóg jest światłością i nie ma w Nim żadnej ciemności."
"1J1,6": "Jeśli mówimy, że mamy z Nim społeczność, a chodzimy w ciemności, kłamiemy i nie czynimy prawdy."
"1J1,7": "A jeśli chodzimy w światłości, jak On jest w światłości, społeczność mamy między sobą, a krew Jezusa Chrystusa, Jego Syna, oczyszcza nas z wszelkiego grzechu."
"1J1,8": "Gdybyśmy powiedzieli, że nie mamy grzechu, sami siebie zwodzimy i prawdy w nas nie ma."
"1J1,9": "Jeślibyśmy wyznawali nasze grzechy, Bóg jest wierny i sprawiedliwy, tak, że odpuściłby nam grzechy i oczyścił nas od wszelkiej nieprawości."
"1J1,10": "Gdybyśmy powiedzieli, że nie zgrzeszyliśmy, czynimy Go kłamcą i nie ma w nas Jego słowa."
