"1J1,1":
  text: "Co było od początku, co słyszeliśmy, co naszymi oczami widzieliśmy, na co patrzyliśmy i czego nasze ręce dotknęły, to opowiadamy – o Słowie życia,"
  tags: []
"1J1,2":
  text: "A życie zostało ukazane i widzieliśmy, i świadczymy, i ogłaszamy wam to życie wieczne, które było u Ojca i nam zostało ukazane."
  tags: []
"1J1,3":
  text: "Co widzieliśmy i słyszeliśmy, to wam ogłaszamy, byście i wy z nami mieli społeczność; a społeczność nasza jest z Ojcem i z Jego Synem, Jezusem Chrystusem."
  tags: []
"1J1,4":
  text: "A to wam piszemy, aby radość wasza była pełna."
  tags: []
"1J1,5":
  text: "A to jest poselstwo, które słyszeliśmy od Niego i wam ogłaszamy, że Bóg jest światłością i nie ma w Nim żadnej ciemności."
  tags: []
"1J1,6":
  text: "Jeśli mówimy, że mamy z Nim społeczność, a chodzimy w ciemności, kłamiemy i nie czynimy prawdy."
  tags: []
"1J1,7":
  text: "A jeśli chodzimy w światłości, jak On jest w światłości, społeczność mamy między sobą, a krew Jezusa Chrystusa, Jego Syna, oczyszcza nas z wszelkiego grzechu."
  tags: []
"1J1,8":
  text: "Gdybyśmy powiedzieli, że nie mamy grzechu, sami siebie zwodzimy i prawdy w nas nie ma."
  tags: []
"1J1,9":
  text: "Jeślibyśmy wyznawali nasze grzechy, Bóg jest wierny i sprawiedliwy, tak, że odpuściłby nam grzechy i oczyścił nas od wszelkiej nieprawości."
  tags: []
"1J1,10":
  text: "Gdybyśmy powiedzieli, że nie zgrzeszyliśmy, czynimy Go kłamcą i nie ma w nas Jego słowa."
  tags: []
