"2J1,1": "Starszy, do wybranej pani i do jej dzieci, które ja miłuję w prawdzie, i nie tylko ja, ale i wszyscy, którzy znają prawdę,"
"2J1,2": "Ze względu na prawdę, która pozostaje w nas i będzie z nami do nastania wieku."
"2J1,3": "Z wami będzie też łaska, miłosierdzie, pokój od Boga Ojca i od Pana Jezusa Chrystusa, Syna Ojca, w prawdzie i w miłości."
"2J1,4": "Uradowałem się bardzo, że między twoimi dziećmi znalazłem takie, które chodzą w prawdzie, stosownie do przykazania, które otrzymaliśmy od Ojca."
"2J1,5": "A teraz proszę cię, pani – nie jako piszący ci nowe przykazanie, lecz to, które mieliśmy od początku – abyśmy jedni drugich miłowali."
"2J1,6": "A to jest miłość, abyśmy postępowali według Jego przykazań, to jest przykazanie, które słyszeliście od początku, abyście zgodnie z nim postępowali."
"2J1,7": "Gdyż liczni zwodziciele wyszli na świat, którzy nie wyznają Jezusa Chrystusa przychodzącego w ciele; taki jest zwodzicielem i antychrystem."
"2J1,8": "Uważajcie na siebie, byśmy nie stracili tego, co wypracowaliście, ale odebrali pełną zapłatę."
"2J1,9": "Każdy, kto przekracza naukę Chrystusa i nie trwa w niej, nie ma Boga; kto trwa w nauce Chrystusa, ten ma i Ojca, i Syna."
"2J1,10": "Jeśli ktoś przychodzi do was, a nie przynosi tej nauki, nie przyjmujcie go do domu, ani mu nie mówcie: Witaj!"
"2J1,11": "Albowiem kto takiemu mówi: Witaj! Jest uczestnikiem jego złych czynów."
"2J1,12": "Mając wam wiele do napisania, nie chcę tego czynić posługując się papierem i atramentem, ale mam nadzieję, że do was przyjdę i osobiście z wami będę mówić, aby radość nasza była pełna."
"2J1,13": "Pozdrawiają cię dzieci siostry twojej wybranej. Amen."
