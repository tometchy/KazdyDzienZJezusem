"2J1,1":
  text: "Starszy, do wybranej pani i do jej dzieci, które ja miłuję w prawdzie, i nie tylko ja, ale i wszyscy, którzy znają prawdę,"
  tags: []
"2J1,2":
  text: "Ze względu na prawdę, która pozostaje w nas i będzie z nami do nastania wieku."
  tags: []
"2J1,3":
  text: "Z wami będzie też łaska, miłosierdzie, pokój od Boga Ojca i od Pana Jezusa Chrystusa, Syna Ojca, w prawdzie i w miłości."
  tags: []
"2J1,4":
  text: "Uradowałem się bardzo, że między twoimi dziećmi znalazłem takie, które chodzą w prawdzie, stosownie do przykazania, które otrzymaliśmy od Ojca."
  tags: []
"2J1,5":
  text: "A teraz proszę cię, pani – nie jako piszący ci nowe przykazanie, lecz to, które mieliśmy od początku – abyśmy jedni drugich miłowali."
  tags: []
"2J1,6":
  text: "A to jest miłość, abyśmy postępowali według Jego przykazań, to jest przykazanie, które słyszeliście od początku, abyście zgodnie z nim postępowali."
  tags: []
"2J1,7":
  text: "Gdyż liczni zwodziciele wyszli na świat, którzy nie wyznają Jezusa Chrystusa przychodzącego w ciele; taki jest zwodzicielem i antychrystem."
  tags: []
"2J1,8":
  text: "Uważajcie na siebie, byśmy nie stracili tego, co wypracowaliście, ale odebrali pełną zapłatę."
  tags: []
"2J1,9":
  text: "Każdy, kto przekracza naukę Chrystusa i nie trwa w niej, nie ma Boga; kto trwa w nauce Chrystusa, ten ma i Ojca, i Syna."
  tags: []
"2J1,10":
  text: "Jeśli ktoś przychodzi do was, a nie przynosi tej nauki, nie przyjmujcie go do domu, ani mu nie mówcie: Witaj!"
  tags: []
"2J1,11":
  text: "Albowiem kto takiemu mówi: Witaj! Jest uczestnikiem jego złych czynów."
  tags: []
"2J1,12":
  text: "Mając wam wiele do napisania, nie chcę tego czynić posługując się papierem i atramentem, ale mam nadzieję, że do was przyjdę i osobiście z wami będę mówić, aby radość nasza była pełna."
  tags: []
"2J1,13":
  text: "Pozdrawiają cię dzieci siostry twojej wybranej. Amen."
  tags: []
