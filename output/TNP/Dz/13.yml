"Dz13,1": "A byli w Antiochii, w zborze, który tam był, pewni prorocy i nauczyciele jak: Barnaba i Symeon, zwany Niger, i Lucjusz Cyrenejczyk, i Manaen, który był też wychowany z Herodem tetrarchą, i Saul."
"Dz13,2": "A gdy oni pełnili służbę Panu i pościli, Duch Święty powiedział: Odłączcie mi już Barnabę i Saula do tego dzieła, do którego ich powołałem."
"Dz13,3": "Wtedy po zakończeniu postu i modlitwy, włożyli na nich ręce i uwolnili ich do tego dzieła."
"Dz13,4": "Oni więc, istotnie będąc wysłani przez Ducha Świętego, przyszli do Seleucji, stamtąd też odpłynęli na Cypr."
"Dz13,5": "I gdy stanęli w Salaminie, głosili Słowo Boże w synagogach żydowskich, a mieli ze sobą i Jana jako pomocnika."
"Dz13,6": "A gdy przeszli wyspę aż do Pafos, znaleźli pewnego maga, fałszywego proroka, Żyda, o imieniu Bar-Jezus,"
"Dz13,7": "Który był przy prokonsulu Sergiuszu Pawle, mężu roztropnym. Ten wezwał do siebie Barnabę i Saula, pragnąc usłyszeć Słowo Boże."
"Dz13,8": "Ale przeciwstawiał się im Elymas, mag – tak bowiem jest tłumaczone jego imię – starając się odwrócić prokonsula od wiary."
"Dz13,9": "A Saul, zwany też Pawłem, napełniony Duchem Świętym, gdy spojrzał na niego uważnie,"
"Dz13,10": "Powiedział: O pełen wszelkiej zdrady i wszelkiej przewrotności, synu diabła, nieprzyjacielu wszelkiej sprawiedliwości! Czy nie przestaniesz wykrzywiać prostych dróg Pana?"
"Dz13,11": "A oto teraz ręka Pana na tobie, będziesz ślepy i do pewnego czasu nie będziesz widział słońca. I natychmiast spadły na niego mrok i ciemność, a krążąc dookoła, szukał, by ktoś poprowadził go za rękę."
"Dz13,12": "Wtedy prokonsul, widząc, co się stało, uwierzył, zdumiony z powodu nauki Pana."
"Dz13,13": "A po wypłynięciu z Pafos, Paweł i ci, którzy byli przy nim, przybyli do Perge w Pamfilii. A Jan odłączył się od nich i wrócił do Jerozolimy."
"Dz13,14": "Oni zatem, po przejściu przez Perge, przybyli do Antiochii Pizydyjskiej, i gdy weszli do synagogi w dzień szabatu, usiedli."
"Dz13,15": "A po odczytaniu Prawa i Proroków, posłali do nich przełożeni synagogi, mówiąc: Mężowie bracia! Jeśli jest w was słowo zachęty do ludu, mówcie."
"Dz13,16": "A Paweł powstał i skinął ręką i powiedział: Mężowie Izraelici, i wy bojący się Boga, posłuchajcie!"
"Dz13,17": "Bóg ludu tego, Izraela, wybrał sobie naszych ojców i wywyższył lud na obczyźnie w ziemi egipskiej, i wyprowadził ich z niej z podniesionym ramieniem."
"Dz13,18": "I przez blisko czterdzieści lat znosił ich sposób życia na pustyni."
"Dz13,19": "A gdy zniszczył siedem narodów w ziemi Kanaan, rozdzielił im ich ziemię przez losowanie."
"Dz13,20": "I potem przez blisko czterysta pięćdziesiąt lat dawał im sędziów, aż do proroka Samuela."
"Dz13,21": "Wtedy zażądali króla i dał im Bóg na czterdzieści lat Saula, syna Kisza, mężczyznę z pokolenia Beniamina."
"Dz13,22": "A gdy go odsunął, wzbudził im na króla Dawida, o którym też zaświadczył, gdy powiedział: Znalazłem Dawida, syna Jessego, męża według mojego serca, który wypełni całą moją wolę."
"Dz13,23": "Z jego to potomstwa, zgodnie z obietnicą, Bóg wzbudził Izraelowi Zbawiciela, Jezusa,"
"Dz13,24": "Przed Jego przyjściem, Jan wcześniej głosił chrzest upamiętania całemu ludowi Izraela,"
"Dz13,25": "A gdy Jan wypełniał już swój bieg życia, powiedział: Za kogo mnie uważacie? To nie ja jestem Nim, ale oto przychodzi po mnie Ten, któremu nie jestem godny rozwiązać rzemienia sandału u Jego stóp."
"Dz13,26": "Mężowie bracia, synowie rodu Abrahama i ci, którzy między wami boją się Boga! Do was zostało posłane słowo o tym zbawieniu."
"Dz13,27": "Bowiem ci, którzy mieszkają w Jerozolimie i ich przełożeni nie poznali Go, a przez osądzenie wypełnili słowa Proroków, które w każdy szabat są odczytywane;"
"Dz13,28": "Choć nie znaleźli w Nim żadnego powodu uzasadniającego wyrok śmierci, domagali się od Piłata, aby został zabity."
"Dz13,29": "A gdy wykonali wszystko, co o Nim jest napisane, zdjęli Go z drzewa i złożyli do grobowca."
"Dz13,30": "Bóg jednak wzbudził Go z martwych."
"Dz13,31": "On też ukazywał się przez wiele dni tym, którzy z Galilei razem z Nim weszli do Jerozolimy, ci są Jego świadkami wobec ludu."
"Dz13,32": "I my głosimy wam dobrą nowinę o obietnicy złożonej ojcom, że tę Bóg wypełnił ich dzieciom, wzbudzając Jezusa,"
"Dz13,33": "Jak też w Psalmie drugim jest napisane: Ty jesteś moim Synem, Ja dzisiaj ciebie zrodziłem."
"Dz13,34": "A że Go wzbudził z martwych, aby już więcej nie miał wrócić do zepsucia, powiedział tak: Dam wam święte obietnice Dawida – godne zaufania."
"Dz13,35": "Dlatego i na innym miejscu mówi: Nie dasz swojemu Świętemu zobaczyć zepsucia."
"Dz13,36": "Dawid bowiem prawdziwie usłużył swojemu pokoleniu, zgodnie z wolą Boga zasnął i został przyłączony do swoich ojców, i widział zepsucie;"
"Dz13,37": "Lecz Ten, którego Bóg wzbudził, nie zobaczył zepsucia."
"Dz13,38": "Niech więc będzie wam wiadome, mężowie bracia, że przez Niego jest wam głoszone uwolnienie z grzechów,"
"Dz13,39": "I to od wszystkich, co do których nie mogliście zostać uznani za sprawiedliwych przez Prawo Mojżesza. W Nim, każdy wierzący zostaje uznany za sprawiedliwego."
"Dz13,40": "Uważajcie więc, aby nie przyszło na was to, co zostało powiedziane u Proroków:"
"Dz13,41": "Zobaczcie, szydercy, zdziwcie się i zgińcie; gdyż Ja czynię za waszych dni dzieło, w które nie uwierzycie, jeśli ktoś będzie wam je opowiadał."
"Dz13,42": "A gdy oni wychodzili z synagogi żydowskiej, prosili ich poganie, aby też i w następny szabat mówili do nich te słowa."
"Dz13,43": "A gdy zgromadzenie zostało rozwiązane, poszło wielu Żydów i pobożnych prozelitów za Pawłem i Barnabą, którzy rozmawiali z nimi, i przekonywali ich, aby trwali w łasce Bożej."
"Dz13,44": "A w następny szabat niemal całe miasto zgromadziło się, aby usłyszeć Słowo Boga."
"Dz13,45": "A Żydzi, widząc tłumy, zostali napełnieni zazdrością, sprzeciwiali się temu, co mówił Paweł, mówiąc i bluźniąc przeciwko temu."
"Dz13,46": "A Paweł i Barnaba śmiało przemawiali, mówiąc: Konieczne było, wam najpierw opowiedzieć Słowo Boga; ale ponieważ je odrzucacie i uważacie się za niegodnych życia wiecznego, oto zwracamy się do pogan."
"Dz13,47": "Tak bowiem nakazał nam PAN: Ustanowiłem Cię światłem dla pogan, abyś był niosącym zbawienie aż po krańce ziemi."
"Dz13,48": "A słysząc to poganie, radowali się i oddali chwałę Słowu Pana, i uwierzyli, ilu ich było wyznaczonych do życia wiecznego."
"Dz13,49": "A Słowo Pana było roznoszone po całej krainie."
"Dz13,50": "A Żydzi podburzyli pobożne i dostojne kobiety oraz znaczących obywateli miasta, i wzbudzili prześladowanie przeciwko Pawłowi i Barnabie, i wyrzucili ich ze swoich granic."
"Dz13,51": "Oni natomiast, strząsnęli na nich proch ze swoich stóp i przybyli do Ikonium."
"Dz13,52": "A uczniowie byli wypełniani radością i Duchem Świętym."
