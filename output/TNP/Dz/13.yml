"Dz13,1":
  text: "A byli w Antiochii, w zborze, który tam był, pewni prorocy i nauczyciele jak: Barnaba i Symeon, zwany Niger, i Lucjusz Cyrenejczyk, i Manaen, który był też wychowany z Herodem tetrarchą, i Saul."
  tags: []
"Dz13,2":
  text: "A gdy oni pełnili służbę Panu i pościli, Duch Święty powiedział: Odłączcie mi już Barnabę i Saula do tego dzieła, do którego ich powołałem."
  tags: []
"Dz13,3":
  text: "Wtedy po zakończeniu postu i modlitwy, włożyli na nich ręce i uwolnili ich do tego dzieła."
  tags: []
"Dz13,4":
  text: "Oni więc, istotnie będąc wysłani przez Ducha Świętego, przyszli do Seleucji, stamtąd też odpłynęli na Cypr."
  tags: []
"Dz13,5":
  text: "I gdy stanęli w Salaminie, głosili Słowo Boże w synagogach żydowskich, a mieli ze sobą i Jana jako pomocnika."
  tags: []
"Dz13,6":
  text: "A gdy przeszli wyspę aż do Pafos, znaleźli pewnego maga, fałszywego proroka, Żyda, o imieniu Bar-Jezus,"
  tags: []
"Dz13,7":
  text: "Który był przy prokonsulu Sergiuszu Pawle, mężu roztropnym. Ten wezwał do siebie Barnabę i Saula, pragnąc usłyszeć Słowo Boże."
  tags: []
"Dz13,8":
  text: "Ale przeciwstawiał się im Elymas, mag – tak bowiem jest tłumaczone jego imię – starając się odwrócić prokonsula od wiary."
  tags: []
"Dz13,9":
  text: "A Saul, zwany też Pawłem, napełniony Duchem Świętym, gdy spojrzał na niego uważnie,"
  tags: []
"Dz13,10":
  text: "Powiedział: O pełen wszelkiej zdrady i wszelkiej przewrotności, synu diabła, nieprzyjacielu wszelkiej sprawiedliwości! Czy nie przestaniesz wykrzywiać prostych dróg Pana?"
  tags: []
"Dz13,11":
  text: "A oto teraz ręka Pana na tobie, będziesz ślepy i do pewnego czasu nie będziesz widział słońca. I natychmiast spadły na niego mrok i ciemność, a krążąc dookoła, szukał, by ktoś poprowadził go za rękę."
  tags: []
"Dz13,12":
  text: "Wtedy prokonsul, widząc, co się stało, uwierzył, zdumiony z powodu nauki Pana."
  tags: []
"Dz13,13":
  text: "A po wypłynięciu z Pafos, Paweł i ci, którzy byli przy nim, przybyli do Perge w Pamfilii. A Jan odłączył się od nich i wrócił do Jerozolimy."
  tags: []
"Dz13,14":
  text: "Oni zatem, po przejściu przez Perge, przybyli do Antiochii Pizydyjskiej, i gdy weszli do synagogi w dzień szabatu, usiedli."
  tags: []
"Dz13,15":
  text: "A po odczytaniu Prawa i Proroków, posłali do nich przełożeni synagogi, mówiąc: Mężowie bracia! Jeśli jest w was słowo zachęty do ludu, mówcie."
  tags: []
"Dz13,16":
  text: "A Paweł powstał i skinął ręką i powiedział: Mężowie Izraelici, i wy bojący się Boga, posłuchajcie!"
  tags: []
"Dz13,17":
  text: "Bóg ludu tego, Izraela, wybrał sobie naszych ojców i wywyższył lud na obczyźnie w ziemi egipskiej, i wyprowadził ich z niej z podniesionym ramieniem."
  tags: []
"Dz13,18":
  text: "I przez blisko czterdzieści lat znosił ich sposób życia na pustyni."
  tags: []
"Dz13,19":
  text: "A gdy zniszczył siedem narodów w ziemi Kanaan, rozdzielił im ich ziemię przez losowanie."
  tags: []
"Dz13,20":
  text: "I potem przez blisko czterysta pięćdziesiąt lat dawał im sędziów, aż do proroka Samuela."
  tags: []
"Dz13,21":
  text: "Wtedy zażądali króla i dał im Bóg na czterdzieści lat Saula, syna Kisza, mężczyznę z pokolenia Beniamina."
  tags: []
"Dz13,22":
  text: "A gdy go odsunął, wzbudził im na króla Dawida, o którym też zaświadczył, gdy powiedział: Znalazłem Dawida, syna Jessego, męża według mojego serca, który wypełni całą moją wolę."
  tags: []
"Dz13,23":
  text: "Z jego to potomstwa, zgodnie z obietnicą, Bóg wzbudził Izraelowi Zbawiciela, Jezusa,"
  tags: []
"Dz13,24":
  text: "Przed Jego przyjściem, Jan wcześniej głosił chrzest upamiętania całemu ludowi Izraela,"
  tags: []
"Dz13,25":
  text: "A gdy Jan wypełniał już swój bieg życia, powiedział: Za kogo mnie uważacie? To nie ja jestem Nim, ale oto przychodzi po mnie Ten, któremu nie jestem godny rozwiązać rzemienia sandału u Jego stóp."
  tags: []
"Dz13,26":
  text: "Mężowie bracia, synowie rodu Abrahama i ci, którzy między wami boją się Boga! Do was zostało posłane słowo o tym zbawieniu."
  tags: []
"Dz13,27":
  text: "Bowiem ci, którzy mieszkają w Jerozolimie i ich przełożeni nie poznali Go, a przez osądzenie wypełnili słowa Proroków, które w każdy szabat są odczytywane;"
  tags: []
"Dz13,28":
  text: "Choć nie znaleźli w Nim żadnego powodu uzasadniającego wyrok śmierci, domagali się od Piłata, aby został zabity."
  tags: []
"Dz13,29":
  text: "A gdy wykonali wszystko, co o Nim jest napisane, zdjęli Go z drzewa i złożyli do grobowca."
  tags: []
"Dz13,30":
  text: "Bóg jednak wzbudził Go z martwych."
  tags: []
"Dz13,31":
  text: "On też ukazywał się przez wiele dni tym, którzy z Galilei razem z Nim weszli do Jerozolimy, ci są Jego świadkami wobec ludu."
  tags: []
"Dz13,32":
  text: "I my głosimy wam dobrą nowinę o obietnicy złożonej ojcom, że tę Bóg wypełnił ich dzieciom, wzbudzając Jezusa,"
  tags: []
"Dz13,33":
  text: "Jak też w Psalmie drugim jest napisane: Ty jesteś moim Synem, Ja dzisiaj ciebie zrodziłem."
  tags: []
"Dz13,34":
  text: "A że Go wzbudził z martwych, aby już więcej nie miał wrócić do zepsucia, powiedział tak: Dam wam święte obietnice Dawida – godne zaufania."
  tags: []
"Dz13,35":
  text: "Dlatego i na innym miejscu mówi: Nie dasz swojemu Świętemu zobaczyć zepsucia."
  tags: []
"Dz13,36":
  text: "Dawid bowiem prawdziwie usłużył swojemu pokoleniu, zgodnie z wolą Boga zasnął i został przyłączony do swoich ojców, i widział zepsucie;"
  tags: []
"Dz13,37":
  text: "Lecz Ten, którego Bóg wzbudził, nie zobaczył zepsucia."
  tags: []
"Dz13,38":
  text: "Niech więc będzie wam wiadome, mężowie bracia, że przez Niego jest wam głoszone uwolnienie z grzechów,"
  tags: []
"Dz13,39":
  text: "I to od wszystkich, co do których nie mogliście zostać uznani za sprawiedliwych przez Prawo Mojżesza. W Nim, każdy wierzący zostaje uznany za sprawiedliwego."
  tags: []
"Dz13,40":
  text: "Uważajcie więc, aby nie przyszło na was to, co zostało powiedziane u Proroków:"
  tags: []
"Dz13,41":
  text: "Zobaczcie, szydercy, zdziwcie się i zgińcie; gdyż Ja czynię za waszych dni dzieło, w które nie uwierzycie, jeśli ktoś będzie wam je opowiadał."
  tags: []
"Dz13,42":
  text: "A gdy oni wychodzili z synagogi żydowskiej, prosili ich poganie, aby też i w następny szabat mówili do nich te słowa."
  tags: []
"Dz13,43":
  text: "A gdy zgromadzenie zostało rozwiązane, poszło wielu Żydów i pobożnych prozelitów za Pawłem i Barnabą, którzy rozmawiali z nimi, i przekonywali ich, aby trwali w łasce Bożej."
  tags: []
"Dz13,44":
  text: "A w następny szabat niemal całe miasto zgromadziło się, aby usłyszeć Słowo Boga."
  tags: []
"Dz13,45":
  text: "A Żydzi, widząc tłumy, zostali napełnieni zazdrością, sprzeciwiali się temu, co mówił Paweł, mówiąc i bluźniąc przeciwko temu."
  tags: []
"Dz13,46":
  text: "A Paweł i Barnaba śmiało przemawiali, mówiąc: Konieczne było, wam najpierw opowiedzieć Słowo Boga; ale ponieważ je odrzucacie i uważacie się za niegodnych życia wiecznego, oto zwracamy się do pogan."
  tags: []
"Dz13,47":
  text: "Tak bowiem nakazał nam PAN: Ustanowiłem Cię światłem dla pogan, abyś był niosącym zbawienie aż po krańce ziemi."
  tags: []
"Dz13,48":
  text: "A słysząc to poganie, radowali się i oddali chwałę Słowu Pana, i uwierzyli, ilu ich było wyznaczonych do życia wiecznego."
  tags: []
"Dz13,49":
  text: "A Słowo Pana było roznoszone po całej krainie."
  tags: []
"Dz13,50":
  text: "A Żydzi podburzyli pobożne i dostojne kobiety oraz znaczących obywateli miasta, i wzbudzili prześladowanie przeciwko Pawłowi i Barnabie, i wyrzucili ich ze swoich granic."
  tags: []
"Dz13,51":
  text: "Oni natomiast, strząsnęli na nich proch ze swoich stóp i przybyli do Ikonium."
  tags: []
"Dz13,52":
  text: "A uczniowie byli wypełniani radością i Duchem Świętym."
  tags: []
