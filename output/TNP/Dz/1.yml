"Dz1,1":
  text: "Pierwszą relację napisałem, Teofilu, o wszystkim, co Jezus zaczął czynić, a także nauczać od początku,"
  tags: []
"Dz1,2":
  text: "Aż do dnia, w którym po przekazaniu przez Ducha Świętego poleceń apostołom, których sobie wybrał, został wzięty do góry;"
  tags: []
"Dz1,3":
  text: "Im też po swojej męce, w wielu niepodważalnych dowodach, przedstawił się jako żyjący, ukazując się im przez czterdzieści dni i mówiąc o Królestwie Bożym."
  tags: []
"Dz1,4":
  text: "A w czasie wspólnego spotkania z nimi, nakazał im: Nie oddalajcie się z Jerozolimy, ale oczekujcie obietnicy Ojca, o której słyszeliście ode mnie."
  tags: []
"Dz1,5":
  text: "Jan bowiem chrzcił w wodzie, lecz wy, po niewielu dniach zostaniecie zanurzeni w Duchu Świętym."
  tags: []
"Dz1,6":
  text: "A gdy się zgromadzili, pytali Go, mówiąc: Panie! Czy w tym czasie przywrócisz Królestwo Izraelowi?"
  tags: []
"Dz1,7":
  text: "On jednak powiedział do nich: Nie wasza to rzecz poznać czasy i pory, które Ojciec swą władzą ustalił."
  tags: []
"Dz1,8":
  text: "Ale otrzymacie moc Ducha Świętego, który przyszedł do was; i będziecie mi świadkami zarówno w Jerozolimie, jak i w całej Judei, i w Samarii, aż do krańców ziemi."
  tags: []
"Dz1,9":
  text: "I gdy to powiedział, a oni patrzyli, został uniesiony w górę, i obłok wziął Go sprzed ich oczu."
  tags: []
"Dz1,10":
  text: "A gdy byli wpatrzeni w niebo, jak On się oddala, oto dwaj mężowie stanęli przy nich w białym odzieniu,"
  tags: []
"Dz1,11":
  text: "I ci powiedzieli: Mężowie z Galilei, czemu stoicie, wpatrując się w niebo? Ten Jezus, który od was w górę został uniesiony do nieba, powróci w taki sposób, jak Go widzieliście idącego do nieba."
  tags: []
"Dz1,12":
  text: "Wtedy wrócili do Jerozolimy z góry, zwanej Oliwną, która leży blisko Jerozolimy na odległość drogi szabatowej."
  tags: []
"Dz1,13":
  text: "I gdy weszli do miasta, wstąpili do sali na piętrze, gdzie się zatrzymali: Piotr i Jakub, i Jan, i Andrzej, Filip i Tomasz, Bartłomiej i Mateusz, Jakub syn Alfeusza i Szymon Zelota, i Juda syn Jakuba."
  tags: []
"Dz1,14":
  text: "Ci wszyscy trwali niezłomnie i jednomyślnie w modlitwie i prośbie, razem z kobietami, i z Marią, matką Jezusa, i z Jego braćmi."
  tags: []
"Dz1,15":
  text: "W tych też dniach powstał Piotr pośród uczniów – a w tym samym miejscu była rzesza razem licząca około sto dwadzieścia osób – i powiedział:"
  tags: []
"Dz1,16":
  text: "Mężowie bracia! Musiało zostać wypełnione to Pismo, w którym Duch Święty przepowiedział przez usta Dawida o Judaszu, który stał się przewodnikiem tych, którzy schwytali Jezusa;"
  tags: []
"Dz1,17":
  text: "Który został zaliczony do nas i dostał w udziale dziedzictwo tej służby."
  tags: []
"Dz1,18":
  text: "On rzeczywiście za zapłatę niesprawiedliwości nabył pole, ale gdy padł na twarz, pękł wpół i wypłynęły wszystkie jego wnętrzności."
  tags: []
"Dz1,19":
  text: "I stało się to wiadome wszystkim mieszkającym w Jerozolimie, tak że nazwano to pole w ich własnym języku Akeldamach, to jest Pole Krwi."
  tags: []
"Dz1,20":
  text: "Napisane jest bowiem w zwoju Psalmów: Niech mieszkanie jego stanie się puste i niech nikt w nim nie zamieszka, a jego urząd oby wziął inny."
  tags: []
"Dz1,21":
  text: "Trzeba więc, aby spośród mężów, którzy towarzyszyli nam przez cały czas, gdy Pan Jezus przebywał wśród nas,"
  tags: []
"Dz1,22":
  text: "Począwszy od chrztu Jana aż do dnia, w którym został wzięty od nas w górę, aby jeden z nich, stał się razem z nami świadkiem Jego powstania z martwych."
  tags: []
"Dz1,23":
  text: "I postawili dwóch: Józefa, zwanego Barsabą, którego też nazywano Justus i Mattiasza."
  tags: []
"Dz1,24":
  text: "A pomodlili się, mówiąc: Ty, Panie! Który znasz serca wszystkich, wskaż z tych dwóch jednego, którego sobie wybrałeś,"
  tags: []
"Dz1,25":
  text: "Aby przyjął dziedzictwo tej służby i apostolstwa, od którego odstąpił Judasz, by pójść na swe własne miejsce."
  tags: []
"Dz1,26":
  text: "I rzucili ich losy. I padł los na Mattiasza; i został dobrany do grona jedenastu apostołów."
  tags: []
