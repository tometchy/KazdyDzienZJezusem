"Dz1,1": "Pierwszą relację napisałem, Teofilu, o wszystkim, co Jezus zaczął czynić, a także nauczać od początku,"
"Dz1,2": "Aż do dnia, w którym po przekazaniu przez Ducha Świętego poleceń apostołom, których sobie wybrał, został wzięty do góry;"
"Dz1,3": "Im też po swojej męce, w wielu niepodważalnych dowodach, przedstawił się jako żyjący, ukazując się im przez czterdzieści dni i mówiąc o Królestwie Bożym."
"Dz1,4": "A w czasie wspólnego spotkania z nimi, nakazał im: Nie oddalajcie się z Jerozolimy, ale oczekujcie obietnicy Ojca, o której słyszeliście ode mnie."
"Dz1,5": "Jan bowiem chrzcił w wodzie, lecz wy, po niewielu dniach zostaniecie zanurzeni w Duchu Świętym."
"Dz1,6": "A gdy się zgromadzili, pytali Go, mówiąc: Panie! Czy w tym czasie przywrócisz Królestwo Izraelowi?"
"Dz1,7": "On jednak powiedział do nich: Nie wasza to rzecz poznać czasy i pory, które Ojciec swą władzą ustalił."
"Dz1,8": "Ale otrzymacie moc Ducha Świętego, który przyszedł do was; i będziecie mi świadkami zarówno w Jerozolimie, jak i w całej Judei, i w Samarii, aż do krańców ziemi."
"Dz1,9": "I gdy to powiedział, a oni patrzyli, został uniesiony w górę, i obłok wziął Go sprzed ich oczu."
"Dz1,10": "A gdy byli wpatrzeni w niebo, jak On się oddala, oto dwaj mężowie stanęli przy nich w białym odzieniu,"
"Dz1,11": "I ci powiedzieli: Mężowie z Galilei, czemu stoicie, wpatrując się w niebo? Ten Jezus, który od was w górę został uniesiony do nieba, powróci w taki sposób, jak Go widzieliście idącego do nieba."
"Dz1,12": "Wtedy wrócili do Jerozolimy z góry, zwanej Oliwną, która leży blisko Jerozolimy na odległość drogi szabatowej."
"Dz1,13": "I gdy weszli do miasta, wstąpili do sali na piętrze, gdzie się zatrzymali: Piotr i Jakub, i Jan, i Andrzej, Filip i Tomasz, Bartłomiej i Mateusz, Jakub syn Alfeusza i Szymon Zelota, i Juda syn Jakuba."
"Dz1,14": "Ci wszyscy trwali niezłomnie i jednomyślnie w modlitwie i prośbie, razem z kobietami, i z Marią, matką Jezusa, i z Jego braćmi."
"Dz1,15": "W tych też dniach powstał Piotr pośród uczniów – a w tym samym miejscu była rzesza razem licząca około sto dwadzieścia osób – i powiedział:"
"Dz1,16": "Mężowie bracia! Musiało zostać wypełnione to Pismo, w którym Duch Święty przepowiedział przez usta Dawida o Judaszu, który stał się przewodnikiem tych, którzy schwytali Jezusa;"
"Dz1,17": "Który został zaliczony do nas i dostał w udziale dziedzictwo tej służby."
"Dz1,18": "On rzeczywiście za zapłatę niesprawiedliwości nabył pole, ale gdy padł na twarz, pękł wpół i wypłynęły wszystkie jego wnętrzności."
"Dz1,19": "I stało się to wiadome wszystkim mieszkającym w Jerozolimie, tak że nazwano to pole w ich własnym języku Akeldamach, to jest Pole Krwi."
"Dz1,20": "Napisane jest bowiem w zwoju Psalmów: Niech mieszkanie jego stanie się puste i niech nikt w nim nie zamieszka, a jego urząd oby wziął inny."
"Dz1,21": "Trzeba więc, aby spośród mężów, którzy towarzyszyli nam przez cały czas, gdy Pan Jezus przebywał wśród nas,"
"Dz1,22": "Począwszy od chrztu Jana aż do dnia, w którym został wzięty od nas w górę, aby jeden z nich, stał się razem z nami świadkiem Jego powstania z martwych."
"Dz1,23": "I postawili dwóch: Józefa, zwanego Barsabą, którego też nazywano Justus i Mattiasza."
"Dz1,24": "A pomodlili się, mówiąc: Ty, Panie! Który znasz serca wszystkich, wskaż z tych dwóch jednego, którego sobie wybrałeś,"
"Dz1,25": "Aby przyjął dziedzictwo tej służby i apostolstwa, od którego odstąpił Judasz, by pójść na swe własne miejsce."
"Dz1,26": "I rzucili ich losy. I padł los na Mattiasza; i został dobrany do grona jedenastu apostołów."
