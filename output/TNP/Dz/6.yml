"Dz6,1": "A w te dni, gdy liczba uczniów pomnażała się, doszło do szemrania hellenistów na Hebrajczyków, że ich wdowy były zaniedbywane w codziennej posłudze."
"Dz6,2": "Wówczas dwunastu zwołało rzeszę uczniów i powiedzieli: Nie jest słuszne, abyśmy opuścili Słowo Boże i służyli stołom."
"Dz6,3": "Przyjrzyjcie się więc, bracia, siedmiu poświadczonym mężom spośród was, pełnych Ducha Świętego i mądrości, których ustanowimy do tego koniecznego zajęcia."
"Dz6,4": "A my będziemy trwać niezłomnie w modlitwie i służbie Słowa."
"Dz6,5": "I spodobała się ta myśl całej tej rzeszy. I wybrali Szczepana, męża pełnego wiary i Ducha Świętego, i Filipa, i Prochora, i Nikanora, i Tymona, i Parmena, i Mikołaja, prozelitę z Antiochii."
"Dz6,6": "Tych postawili przed apostołami, a ci po modlitwie położyli na nich ręce."
"Dz6,7": "A Słowo Boże rosło i pomnażała się liczba uczniów w Jerozolimie; i bardzo liczna rzesza kapłanów była posłuszna wierze."
"Dz6,8": "A Szczepan, pełen wiary i mocy, czynił wielkie cuda i znaki pośród ludu."
"Dz6,9": "Powstali jednak niektórzy z synagogi, zwaną synagogą Libertynów i Cyrenejczyków, i Aleksandryjczyków, i z Cylicji i Azji, dyskutując ze Szczepanem."
"Dz6,10": "I nie mieli siły, aby przeciwstawić się mądrości i Duchowi, dzięki któremu mówił."
"Dz6,11": "Wtedy podstawili mężów, którzy powiedzieli: Słyszeliśmy go jak mówił bluźniercze słowa przeciwko Mojżeszowi i Bogu."
"Dz6,12": "I wzburzyli lud, starszych i uczonych w Piśmie; a gdy powstali, wspólnie porwali go i przyprowadzili do Sanhedrynu."
"Dz6,13": "I postawili też fałszywych świadków, mówiących: Ten człowiek nie przestaje wypowiadać bluźnierstw, mówiąc przeciwko temu świętemu miejscu i Prawu."
"Dz6,14": "Słyszeliśmy go bowiem jak mówił, że ów Jezus Nazarejczyk zburzy to miejsce i zmieni zwyczaje, które przekazał nam Mojżesz."
"Dz6,15": "A wszyscy, którzy siedzieli w Sanhedrynie utkwili w nim wzrok, i zobaczyli jego twarz jakby oblicze anioła."
