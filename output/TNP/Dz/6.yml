"Dz6,1":
  text: "A w te dni, gdy liczba uczniów pomnażała się, doszło do szemrania hellenistów na Hebrajczyków, że ich wdowy były zaniedbywane w codziennej posłudze."
  tags: []
"Dz6,2":
  text: "Wówczas dwunastu zwołało rzeszę uczniów i powiedzieli: Nie jest słuszne, abyśmy opuścili Słowo Boże i służyli stołom."
  tags: []
"Dz6,3":
  text: "Przyjrzyjcie się więc, bracia, siedmiu poświadczonym mężom spośród was, pełnych Ducha Świętego i mądrości, których ustanowimy do tego koniecznego zajęcia."
  tags: []
"Dz6,4":
  text: "A my będziemy trwać niezłomnie w modlitwie i służbie Słowa."
  tags: []
"Dz6,5":
  text: "I spodobała się ta myśl całej tej rzeszy. I wybrali Szczepana, męża pełnego wiary i Ducha Świętego, i Filipa, i Prochora, i Nikanora, i Tymona, i Parmena, i Mikołaja, prozelitę z Antiochii."
  tags: []
"Dz6,6":
  text: "Tych postawili przed apostołami, a ci po modlitwie położyli na nich ręce."
  tags: []
"Dz6,7":
  text: "A Słowo Boże rosło i pomnażała się liczba uczniów w Jerozolimie; i bardzo liczna rzesza kapłanów była posłuszna wierze."
  tags: []
"Dz6,8":
  text: "A Szczepan, pełen wiary i mocy, czynił wielkie cuda i znaki pośród ludu."
  tags: []
"Dz6,9":
  text: "Powstali jednak niektórzy z synagogi, zwaną synagogą Libertynów i Cyrenejczyków, i Aleksandryjczyków, i z Cylicji i Azji, dyskutując ze Szczepanem."
  tags: []
"Dz6,10":
  text: "I nie mieli siły, aby przeciwstawić się mądrości i Duchowi, dzięki któremu mówił."
  tags: []
"Dz6,11":
  text: "Wtedy podstawili mężów, którzy powiedzieli: Słyszeliśmy go jak mówił bluźniercze słowa przeciwko Mojżeszowi i Bogu."
  tags: []
"Dz6,12":
  text: "I wzburzyli lud, starszych i uczonych w Piśmie; a gdy powstali, wspólnie porwali go i przyprowadzili do Sanhedrynu."
  tags: []
"Dz6,13":
  text: "I postawili też fałszywych świadków, mówiących: Ten człowiek nie przestaje wypowiadać bluźnierstw, mówiąc przeciwko temu świętemu miejscu i Prawu."
  tags: []
"Dz6,14":
  text: "Słyszeliśmy go bowiem jak mówił, że ów Jezus Nazarejczyk zburzy to miejsce i zmieni zwyczaje, które przekazał nam Mojżesz."
  tags: []
"Dz6,15":
  text: "A wszyscy, którzy siedzieli w Sanhedrynie utkwili w nim wzrok, i zobaczyli jego twarz jakby oblicze anioła."
  tags: []
