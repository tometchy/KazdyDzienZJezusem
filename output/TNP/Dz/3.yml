"Dz3,1": "A Piotr i Jan wchodzili do świątyni w godzinę modlitwy, o dziewiątej."
"Dz3,2": "I był właśnie niesiony pewien mąż, chromy już w łonie swojej matki, a którego kładziono każdego dnia przy bramie świątyni, zwanej Piękną, aby prosił o dar miłosierdzia tych, którzy wchodzili do świątyni."
"Dz3,3": "Ten widząc Piotra i Jana, gdy mieli wejść do świątyni, prosił ich o dar miłosierdzia."
"Dz3,4": "A Piotr, wpatrując się w niego wraz z Janem, powiedział: Spójrz na nas!"
"Dz3,5": "On więc spojrzał na nich, spodziewając się od nich coś dostać."
"Dz3,6": "Piotr natomiast powiedział: Nie mam srebra ani złota; lecz co mam, to ci daję: W imieniu Jezusa Chrystusa Nazarejczyka wstań i chodź."
"Dz3,7": "I chwycił go prawą ręką, i podniósł, a natychmiast zostały wzmocnione jego stopy i kostki."
"Dz3,8": "A podskakując, stanął i chodził, i wszedł z nimi do świątyni, chodząc, skacząc i chwaląc Boga."
"Dz3,9": "I zobaczył go cały lud, jak chodził i chwalił Boga."
"Dz3,10": "I poznali też, że to on był tym, który dla uzyskania wsparcia siadał przy Bramie Pięknej świątyni; i napełnieni zostali zdumieniem i uniesieniem z powodu tego, co mu się stało."
"Dz3,11": "A gdy chromy, ten, który został uzdrowiony, trzymał się Piotra i Jana, zbiegł się do nich cały zdumiony lud do portyku, zwanego Salomonowym."
"Dz3,12": "Co widząc Piotr, odpowiedział ludowi: Mężowie Izraelici! Dlaczego się z tego powodu dziwicie, lub dlaczego tak uważnie nam się przypatrujecie, jakbyśmy to własną mocą lub pobożnością uczynili, że on chodzi?"
"Dz3,13": "Bóg Abrahama, Izaaka, Jakuba, Bóg naszych ojców, wprowadził do chwały Jezusa, swojego Syna, którego wy wydaliście i wyparliście się Go przed obliczem Piłata, który zasądził Jego uwolnienie."
"Dz3,14": "Ale wy zaparliście się Świętego i Sprawiedliwego i prosiliście o darowanie wam mordercy,"
"Dz3,15": "I zabiliście Sprawcę życia, którego Bóg wzbudził z martwych, czego my jesteśmy świadkami."
"Dz3,16": "A z powodu wiary w imię Jego, imię Jego wzmocniło tego, którego wy widzicie i znacie; a wiara w Niego, dała mu pełne zdrowie wobec was wszystkich."
"Dz3,17": "Ale teraz, bracia, wiem, że tak jak i wasi przywódcy uczyniliście to z niewiedzy,"
"Dz3,18": "Bóg natomiast wypełnił w ten sposób to, co przez usta wszystkich proroków wcześniej oznajmił, że Jego Mesjasz miał cierpieć."
"Dz3,19": "Dlatego upamiętajcie się i nawróćcie, aby zostały zmazane wasze grzechy, i aby nadeszły od oblicza PANA czasy ochłody,"
"Dz3,20": "I aby posłał wcześniej zapowiedzianego wam Jezusa Mesjasza."
"Dz3,21": "Którego niebo musi przyjąć aż do czasu odnowienia wszystkich rzeczy, o których powiedział Bóg od wieku przez usta wszystkich swoich świętych proroków."
"Dz3,22": "Mojżesz bowiem prawdziwie powiedział do ojców, że Proroka wzbudzi wam PAN, Bóg wasz, spośród waszych braci, jak mnie; Jego będziecie słuchać we wszystkim, cokolwiek do was będzie mówić."
"Dz3,23": "I stanie się, że każda dusza, która nie usłuchałaby tego Proroka, będzie całkowicie wytępiona z ludu."
"Dz3,24": "I wszyscy prorocy od Samuela, którzy kolejno przemawiali, zapowiadali te dni."
"Dz3,25": "Wy jesteście synami proroków i przymierza, które zawarł Bóg z naszymi ojcami, mówiąc do Abrahama: A twoim potomkiem zostaną ubłogosławione wszystkie rody ziemi."
"Dz3,26": "Wam to najpierw Bóg wzbudził swojego Syna Jezusa i posłał Go, błogosławiąc was w nawracaniu każdego od waszych niegodziwości."
