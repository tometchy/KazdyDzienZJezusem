"Dz3,1":
  text: "A Piotr i Jan wchodzili do świątyni w godzinę modlitwy, o dziewiątej."
  tags: []
"Dz3,2":
  text: "I był właśnie niesiony pewien mąż, chromy już w łonie swojej matki, a którego kładziono każdego dnia przy bramie świątyni, zwanej Piękną, aby prosił o dar miłosierdzia tych, którzy wchodzili do świątyni."
  tags: []
"Dz3,3":
  text: "Ten widząc Piotra i Jana, gdy mieli wejść do świątyni, prosił ich o dar miłosierdzia."
  tags: []
"Dz3,4":
  text: "A Piotr, wpatrując się w niego wraz z Janem, powiedział: Spójrz na nas!"
  tags: []
"Dz3,5":
  text: "On więc spojrzał na nich, spodziewając się od nich coś dostać."
  tags: []
"Dz3,6":
  text: "Piotr natomiast powiedział: Nie mam srebra ani złota; lecz co mam, to ci daję: W imieniu Jezusa Chrystusa Nazarejczyka wstań i chodź."
  tags: []
"Dz3,7":
  text: "I chwycił go prawą ręką, i podniósł, a natychmiast zostały wzmocnione jego stopy i kostki."
  tags: []
"Dz3,8":
  text: "A podskakując, stanął i chodził, i wszedł z nimi do świątyni, chodząc, skacząc i chwaląc Boga."
  tags: []
"Dz3,9":
  text: "I zobaczył go cały lud, jak chodził i chwalił Boga."
  tags: []
"Dz3,10":
  text: "I poznali też, że to on był tym, który dla uzyskania wsparcia siadał przy Bramie Pięknej świątyni; i napełnieni zostali zdumieniem i uniesieniem z powodu tego, co mu się stało."
  tags: []
"Dz3,11":
  text: "A gdy chromy, ten, który został uzdrowiony, trzymał się Piotra i Jana, zbiegł się do nich cały zdumiony lud do portyku, zwanego Salomonowym."
  tags: []
"Dz3,12":
  text: "Co widząc Piotr, odpowiedział ludowi: Mężowie Izraelici! Dlaczego się z tego powodu dziwicie, lub dlaczego tak uważnie nam się przypatrujecie, jakbyśmy to własną mocą lub pobożnością uczynili, że on chodzi?"
  tags: []
"Dz3,13":
  text: "Bóg Abrahama, Izaaka, Jakuba, Bóg naszych ojców, wprowadził do chwały Jezusa, swojego Syna, którego wy wydaliście i wyparliście się Go przed obliczem Piłata, który zasądził Jego uwolnienie."
  tags: []
"Dz3,14":
  text: "Ale wy zaparliście się Świętego i Sprawiedliwego i prosiliście o darowanie wam mordercy,"
  tags: []
"Dz3,15":
  text: "I zabiliście Sprawcę życia, którego Bóg wzbudził z martwych, czego my jesteśmy świadkami."
  tags: []
"Dz3,16":
  text: "A z powodu wiary w imię Jego, imię Jego wzmocniło tego, którego wy widzicie i znacie; a wiara w Niego, dała mu pełne zdrowie wobec was wszystkich."
  tags: []
"Dz3,17":
  text: "Ale teraz, bracia, wiem, że tak jak i wasi przywódcy uczyniliście to z niewiedzy,"
  tags: []
"Dz3,18":
  text: "Bóg natomiast wypełnił w ten sposób to, co przez usta wszystkich proroków wcześniej oznajmił, że Jego Mesjasz miał cierpieć."
  tags: []
"Dz3,19":
  text: "Dlatego upamiętajcie się i nawróćcie, aby zostały zmazane wasze grzechy, i aby nadeszły od oblicza PANA czasy ochłody,"
  tags: []
"Dz3,20":
  text: "I aby posłał wcześniej zapowiedzianego wam Jezusa Mesjasza."
  tags: []
"Dz3,21":
  text: "Którego niebo musi przyjąć aż do czasu odnowienia wszystkich rzeczy, o których powiedział Bóg od wieku przez usta wszystkich swoich świętych proroków."
  tags: []
"Dz3,22":
  text: "Mojżesz bowiem prawdziwie powiedział do ojców, że Proroka wzbudzi wam PAN, Bóg wasz, spośród waszych braci, jak mnie; Jego będziecie słuchać we wszystkim, cokolwiek do was będzie mówić."
  tags: []
"Dz3,23":
  text: "I stanie się, że każda dusza, która nie usłuchałaby tego Proroka, będzie całkowicie wytępiona z ludu."
  tags: []
"Dz3,24":
  text: "I wszyscy prorocy od Samuela, którzy kolejno przemawiali, zapowiadali te dni."
  tags: []
"Dz3,25":
  text: "Wy jesteście synami proroków i przymierza, które zawarł Bóg z naszymi ojcami, mówiąc do Abrahama: A twoim potomkiem zostaną ubłogosławione wszystkie rody ziemi."
  tags: []
"Dz3,26":
  text: "Wam to najpierw Bóg wzbudził swojego Syna Jezusa i posłał Go, błogosławiąc was w nawracaniu każdego od waszych niegodziwości."
  tags: []
