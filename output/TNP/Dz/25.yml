"Dz25,1":
  text: "A gdy Festus objął prowincję, po trzech dniach wstąpił do Jerozolimy z Cezarei."
  tags: []
"Dz25,2":
  text: "A stawili się przed nim, przeciwko Pawłowi, arcykapłan i przedniejsi z Żydów, i prosili go,"
  tags: []
"Dz25,3":
  text: "Domagając się łaski u niego, aby wezwać go do Jerozolimy; bo mieli zamiar uczynić zasadzkę, aby go zabić w drodze."
  tags: []
"Dz25,4":
  text: "Ale Festus stanowczo odpowiedział, że Paweł zostaje pod strażą w Cezarei, i że on sam zamierza szybko tam wyruszyć."
  tags: []
"Dz25,5":
  text: "Niech więc ci z was – mówi – którzy mają znaczenie, zejdą razem; a jeśli jest coś niewłaściwego w tym mężu, niech go oskarżają."
  tags: []
"Dz25,6":
  text: "A przebywając u nich więcej niż dziesięć dni, zszedł do Cezarei i nazajutrz zasiadł na sędziowskim tronie, i kazał przyprowadzić Pawła."
  tags: []
"Dz25,7":
  text: "A gdy on przyszedł, obstąpili go Żydzi, którzy zeszli z Jerozolimy, wnosząc wiele ciężkich oskarżeń przeciwko Pawłowi, których nie byli zdolni dowieść,"
  tags: []
"Dz25,8":
  text: "On natomiast bronił się, mówiąc: Niczym nie zgrzeszyłem ani przeciwko Prawu żydowskiemu, ani przeciwko świątyni, ani przeciwko Cezarowi."
  tags: []
"Dz25,9":
  text: "Ale Festus, chcąc okazać życzliwość Żydom, odpowiadając Pawłowi, powiedział: Czy chcesz udać się do Jerozolimy i tam być odnośnie tych zarzutów sądzony przede mną?"
  tags: []
"Dz25,10":
  text: "Ale Paweł powiedział: Przed sądem Cezara stoję, gdzie powinienem być sądzony; Żydów w niczym nie skrzywdziłem, jak i ty o tym bardzo dobrze wiesz."
  tags: []
"Dz25,11":
  text: "Jeśli bowiem naprawdę wyrządzam komuś krzywdę i czynię coś zasługującego na śmierć, nie wzbraniam się umrzeć; ale jeśli nie ma niczego prawdziwego w tym, o co mnie oskarżają, nikt nie może mnie im wydać; odwołuję się do Cezara."
  tags: []
"Dz25,12":
  text: "Wtedy Festus, po rozmowie z radą, odpowiedział: Odwołałeś się do Cezara, pójdziesz do Cezara."
  tags: []
"Dz25,13":
  text: "A po upływie kilku dni król Agryppa i Berenika przyszli do Cezarei, z zamiarem powitania Festusa."
  tags: []
"Dz25,14":
  text: "A gdy tam przebywali wiele dni, Festus przedłożył królowi sprawę dotyczącą Pawła, mówiąc: Pewien człowiek jest pozostawiony przez Feliksa jako więzień,"
  tags: []
"Dz25,15":
  text: "Odnośnie którego, gdy byłem w Jerozolimie, stawili się przede mną arcykapłani i starsi żydowscy, domagając się sprawiedliwego wyroku przeciw niemu;"
  tags: []
"Dz25,16":
  text: "Odpowiedziałem im, że nie ma zwyczaju u Rzymian wydawać jakiegoś człowieka na zgubę wcześniej, zanim oskarżony nie stanie twarzą w twarz wobec oskarżycieli i dana mu będzie sposobność obrony z zarzutów."
  tags: []
"Dz25,17":
  text: "Gdy więc się tutaj zebrali, ja bez żadnej zwłoki, następnego dnia, gdy siadłem na sędziowskim tronie, rozkazałem, aby ten człowiek został przyprowadzony;"
  tags: []
"Dz25,18":
  text: "Stanęli przeciw niemu oskarżyciele, a żadnego powodu do ukarania nie przytoczyli z tych, których ja się spodziewałem,"
  tags: []
"Dz25,19":
  text: "Lecz wytoczyli przeciwko niemu jakieś sporne kwestie, dotyczące ich własnych przesądów i jakiegoś Jezusa, który jest martwy, a o którym Paweł twierdził, że żyje."
  tags: []
"Dz25,20":
  text: "Ja więc będąc w niepewności co do tego sporu, spytałem czy chce udać się do Jerozolimy i tam być odnośnie tych zarzutów sądzony."
  tags: []
"Dz25,21":
  text: "Ale że Paweł odwołał się, aby go strzeżono do rozpoznania przez Czcigodnego, rozkazałem go strzec, aż go odeślę do Cezara."
  tags: []
"Dz25,22":
  text: "Wtedy Agryppa powiedział do Festusa: Chciałbym i ja usłyszeć tego człowieka. Więc powiedział: Jutro go usłyszysz."
  tags: []
"Dz25,23":
  text: "A gdy następnego dnia przyszli Agryppa i Berenika z wielką okazałością i weszli do audytorium z dowódcami i głównymi osobistościami miasta, na rozkaz Festusa przyprowadzono Pawła."
  tags: []
"Dz25,24":
  text: "I rzekł Festus: Królu Agryppo i wszyscy mężowie z nami tu obecni! Widzicie tego, o którego prosiło mnie usilnie całe mnóstwo Żydów, i w Jerozolimie i tu, wołając przeciwko niemu, że nie powinien on już dłużej żyć."
  tags: []
"Dz25,25":
  text: "A ja rozumiejąc, że nie uczynił nic zasługującego na śmierć, i gdy on sam odwołał się do Czcigodnego, wydałem wyrok, aby go tam posłać."
  tags: []
"Dz25,26":
  text: "Nic pewnego jednak nie mogę o nim napisać panu. Dlatego przyprowadziłem go przed was, a najbardziej przed ciebie, królu Agryppo, abym po jego przesłuchaniu miał co napisać;"
  tags: []
"Dz25,27":
  text: "Bo wydaje mi się nierozsądne posyłać więźnia, nie wskazując przeciwko niemu stawianych zarzutów."
  tags: []
