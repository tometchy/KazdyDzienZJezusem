"Dz25,1": "A gdy Festus objął prowincję, po trzech dniach wstąpił do Jerozolimy z Cezarei."
"Dz25,2": "A stawili się przed nim, przeciwko Pawłowi, arcykapłan i przedniejsi z Żydów, i prosili go,"
"Dz25,3": "Domagając się łaski u niego, aby wezwać go do Jerozolimy; bo mieli zamiar uczynić zasadzkę, aby go zabić w drodze."
"Dz25,4": "Ale Festus stanowczo odpowiedział, że Paweł zostaje pod strażą w Cezarei, i że on sam zamierza szybko tam wyruszyć."
"Dz25,5": "Niech więc ci z was – mówi – którzy mają znaczenie, zejdą razem; a jeśli jest coś niewłaściwego w tym mężu, niech go oskarżają."
"Dz25,6": "A przebywając u nich więcej niż dziesięć dni, zszedł do Cezarei i nazajutrz zasiadł na sędziowskim tronie, i kazał przyprowadzić Pawła."
"Dz25,7": "A gdy on przyszedł, obstąpili go Żydzi, którzy zeszli z Jerozolimy, wnosząc wiele ciężkich oskarżeń przeciwko Pawłowi, których nie byli zdolni dowieść,"
"Dz25,8": "On natomiast bronił się, mówiąc: Niczym nie zgrzeszyłem ani przeciwko Prawu żydowskiemu, ani przeciwko świątyni, ani przeciwko Cezarowi."
"Dz25,9": "Ale Festus, chcąc okazać życzliwość Żydom, odpowiadając Pawłowi, powiedział: Czy chcesz udać się do Jerozolimy i tam być odnośnie tych zarzutów sądzony przede mną?"
"Dz25,10": "Ale Paweł powiedział: Przed sądem Cezara stoję, gdzie powinienem być sądzony; Żydów w niczym nie skrzywdziłem, jak i ty o tym bardzo dobrze wiesz."
"Dz25,11": "Jeśli bowiem naprawdę wyrządzam komuś krzywdę i czynię coś zasługującego na śmierć, nie wzbraniam się umrzeć; ale jeśli nie ma niczego prawdziwego w tym, o co mnie oskarżają, nikt nie może mnie im wydać; odwołuję się do Cezara."
"Dz25,12": "Wtedy Festus, po rozmowie z radą, odpowiedział: Odwołałeś się do Cezara, pójdziesz do Cezara."
"Dz25,13": "A po upływie kilku dni król Agryppa i Berenika przyszli do Cezarei, z zamiarem powitania Festusa."
"Dz25,14": "A gdy tam przebywali wiele dni, Festus przedłożył królowi sprawę dotyczącą Pawła, mówiąc: Pewien człowiek jest pozostawiony przez Feliksa jako więzień,"
"Dz25,15": "Odnośnie którego, gdy byłem w Jerozolimie, stawili się przede mną arcykapłani i starsi żydowscy, domagając się sprawiedliwego wyroku przeciw niemu;"
"Dz25,16": "Odpowiedziałem im, że nie ma zwyczaju u Rzymian wydawać jakiegoś człowieka na zgubę wcześniej, zanim oskarżony nie stanie twarzą w twarz wobec oskarżycieli i dana mu będzie sposobność obrony z zarzutów."
"Dz25,17": "Gdy więc się tutaj zebrali, ja bez żadnej zwłoki, następnego dnia, gdy siadłem na sędziowskim tronie, rozkazałem, aby ten człowiek został przyprowadzony;"
"Dz25,18": "Stanęli przeciw niemu oskarżyciele, a żadnego powodu do ukarania nie przytoczyli z tych, których ja się spodziewałem,"
"Dz25,19": "Lecz wytoczyli przeciwko niemu jakieś sporne kwestie, dotyczące ich własnych przesądów i jakiegoś Jezusa, który jest martwy, a o którym Paweł twierdził, że żyje."
"Dz25,20": "Ja więc będąc w niepewności co do tego sporu, spytałem czy chce udać się do Jerozolimy i tam być odnośnie tych zarzutów sądzony."
"Dz25,21": "Ale że Paweł odwołał się, aby go strzeżono do rozpoznania przez Czcigodnego, rozkazałem go strzec, aż go odeślę do Cezara."
"Dz25,22": "Wtedy Agryppa powiedział do Festusa: Chciałbym i ja usłyszeć tego człowieka. Więc powiedział: Jutro go usłyszysz."
"Dz25,23": "A gdy następnego dnia przyszli Agryppa i Berenika z wielką okazałością i weszli do audytorium z dowódcami i głównymi osobistościami miasta, na rozkaz Festusa przyprowadzono Pawła."
"Dz25,24": "I rzekł Festus: Królu Agryppo i wszyscy mężowie z nami tu obecni! Widzicie tego, o którego prosiło mnie usilnie całe mnóstwo Żydów, i w Jerozolimie i tu, wołając przeciwko niemu, że nie powinien on już dłużej żyć."
"Dz25,25": "A ja rozumiejąc, że nie uczynił nic zasługującego na śmierć, i gdy on sam odwołał się do Czcigodnego, wydałem wyrok, aby go tam posłać."
"Dz25,26": "Nic pewnego jednak nie mogę o nim napisać panu. Dlatego przyprowadziłem go przed was, a najbardziej przed ciebie, królu Agryppo, abym po jego przesłuchaniu miał co napisać;"
"Dz25,27": "Bo wydaje mi się nierozsądne posyłać więźnia, nie wskazując przeciwko niemu stawianych zarzutów."
