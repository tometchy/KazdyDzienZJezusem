"Dz18,1":
  text: "A potem Paweł odszedł z Aten i przyszedł do Koryntu."
  tags: []
"Dz18,2":
  text: "A gdy znalazł pewnego Żyda, o imieniu Akwila, rodem z Pontu, ostatnio przybyłego z Italii, i Pryscyllę, jego żonę, dlatego że Klaudiusz zarządził, aby wszyscy Żydzi odeszli z Rzymu, zbliżył się do nich;"
  tags: []
"Dz18,3":
  text: "A ponieważ uprawiał to samo rzemiosło, zamieszkał u nich i pracował; a rzemiosłem ich było wytwarzanie namiotów."
  tags: []
"Dz18,4":
  text: "A w każdy szabat rozprawiał w synagodze i przekonywał Żydów i Greków."
  tags: []
"Dz18,5":
  text: "A gdy Sylas i Tymoteusz przyszli z Macedonii, Paweł naciskany był w duchu, aby zaświadczyć Żydom, że Jezus jest Mesjaszem."
  tags: []
"Dz18,6":
  text: "Lecz gdy oni sprzeciwiali się i bluźnili, otrząsnął szaty i powiedział do nich: Krew wasza na waszą głowę; ja jestem czysty, od tej chwili pójdę do pogan."
  tags: []
"Dz18,7":
  text: "I po odejściu stamtąd, wszedł do domu pewnego człowieka, o imieniu Justus, czczącego Boga, którego dom sąsiadował z synagogą."
  tags: []
"Dz18,8":
  text: "A Kryspus, przełożony synagogi, uwierzył w Pana z całym swoim domem, i wielu z Koryntian, którzy słuchali, uwierzyło i zostało ochrzczonych."
  tags: []
"Dz18,9":
  text: "A Pan w nocy przez widzenie powiedział Pawłowi: Nie bój się, lecz mów i nie milcz;"
  tags: []
"Dz18,10":
  text: "Dlatego, że ja jestem z tobą i nikt nie tknie ciebie, aby cię skrzywdzić, ja bowiem mam wielki lud w tym mieście."
  tags: []
"Dz18,11":
  text: "Osiadł tam zatem na rok i sześć miesięcy, nauczając u nich Słowa Bożego."
  tags: []
"Dz18,12":
  text: "A gdy Gallion był prokonsulem Achai, powstali jednomyślnie Żydzi przeciwko Pawłowi i przyprowadzili go przed sędziowski tron, mówiąc:"
  tags: []
"Dz18,13":
  text: "Ten człowiek namawia ludzi, żeby służyli Bogu wbrew Prawu."
  tags: []
"Dz18,14":
  text: "A gdy Paweł miał zamiar otworzyć usta, Gallion powiedział do Żydów: O Żydzi! Gdyby rzeczywiście to było jakieś bezprawie lub jakieś niegodziwe przestępstwo, cierpliwie bym wysłuchał tej sprawy."
  tags: []
"Dz18,15":
  text: "Lecz jeśli jest spór o słowa i o imiona, i o wasze Prawo, sami to rozpatrzcie; albowiem ja nie chcę być sędzią tych spraw."
  tags: []
"Dz18,16":
  text: "I przepędził ich sprzed sędziowskiego tronu."
  tags: []
"Dz18,17":
  text: "A wszyscy Grecy pochwycili Sostenesa, przełożonego synagogi i bili go przed sędziowskim tronem, a Galliona nic to nie obchodziło."
  tags: []
"Dz18,18":
  text: "A Paweł pozostał tam jeszcze przez wiele dni i gdy pożegnał się z braćmi, odpłynął do Syrii, a z nim Pryscylla i Akwila. W Kenchreach ogolił sobie głowę, bo uczynił ślub."
  tags: []
"Dz18,19":
  text: "I przybył do Efezu, i tam ich pozostawił, a sam wszedł do synagogi i rozprawiał z Żydami."
  tags: []
"Dz18,20":
  text: "A gdy oni prosili, aby u nich został przez dłuższy czas, nie zgodził się,"
  tags: []
"Dz18,21":
  text: "Ale pożegnał się z nimi i powiedział: Niewątpliwie, trzeba mi nadchodzące święto obchodzić w Jerozolimie; lecz znów do was wrócę, za wolą Boga. I odpłynął z Efezu."
  tags: []
"Dz18,22":
  text: "A gdy przybył do Cezarei, wstąpił i pozdrowił zbór, i zszedł do Antiochii;"
  tags: []
"Dz18,23":
  text: "I pozostał tam przez pewien czas, i gdy wyszedł, przeszedł kolejno krainę galacką i Frygię, umacniając wszystkich uczniów."
  tags: []
"Dz18,24":
  text: "A do Efezu przyszedł pewien Żyd, o imieniu Apollos, rodem z Aleksandrii, człowiek wymowny, biegły w Pismach."
  tags: []
"Dz18,25":
  text: "Ten był pouczony o drodze Pana, a pałając w duchu, mówił i nauczał dokładnie o Panu, wiedząc tylko o chrzcie Jana."
  tags: []
"Dz18,26":
  text: "I zaczął śmiało mówić w synagodze. A gdy usłyszeli go Akwila i Pryscylla, wzięli go ze sobą i dokładniej wyłożyli mu drogę Bożą."
  tags: []
"Dz18,27":
  text: "A gdy chciał iść do Achai, bracia napisali do uczniów, zachęcając, aby go przyjęli; i gdy tam przyszedł, wiele pomagał tym, którzy uwierzyli dzięki łasce Bożej."
  tags: []
"Dz18,28":
  text: "Zdecydowanie bowiem zbijał twierdzenia Żydów, publicznie wykazując z Pisma, że Jezus jest Mesjaszem."
  tags: []
