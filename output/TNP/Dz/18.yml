"Dz18,1": "A potem Paweł odszedł z Aten i przyszedł do Koryntu."
"Dz18,2": "A gdy znalazł pewnego Żyda, o imieniu Akwila, rodem z Pontu, ostatnio przybyłego z Italii, i Pryscyllę, jego żonę, dlatego że Klaudiusz zarządził, aby wszyscy Żydzi odeszli z Rzymu, zbliżył się do nich;"
"Dz18,3": "A ponieważ uprawiał to samo rzemiosło, zamieszkał u nich i pracował; a rzemiosłem ich było wytwarzanie namiotów."
"Dz18,4": "A w każdy szabat rozprawiał w synagodze i przekonywał Żydów i Greków."
"Dz18,5": "A gdy Sylas i Tymoteusz przyszli z Macedonii, Paweł naciskany był w duchu, aby zaświadczyć Żydom, że Jezus jest Mesjaszem."
"Dz18,6": "Lecz gdy oni sprzeciwiali się i bluźnili, otrząsnął szaty i powiedział do nich: Krew wasza na waszą głowę; ja jestem czysty, od tej chwili pójdę do pogan."
"Dz18,7": "I po odejściu stamtąd, wszedł do domu pewnego człowieka, o imieniu Justus, czczącego Boga, którego dom sąsiadował z synagogą."
"Dz18,8": "A Kryspus, przełożony synagogi, uwierzył w Pana z całym swoim domem, i wielu z Koryntian, którzy słuchali, uwierzyło i zostało ochrzczonych."
"Dz18,9": "A Pan w nocy przez widzenie powiedział Pawłowi: Nie bój się, lecz mów i nie milcz;"
"Dz18,10": "Dlatego, że ja jestem z tobą i nikt nie tknie ciebie, aby cię skrzywdzić, ja bowiem mam wielki lud w tym mieście."
"Dz18,11": "Osiadł tam zatem na rok i sześć miesięcy, nauczając u nich Słowa Bożego."
"Dz18,12": "A gdy Gallion był prokonsulem Achai, powstali jednomyślnie Żydzi przeciwko Pawłowi i przyprowadzili go przed sędziowski tron, mówiąc:"
"Dz18,13": "Ten człowiek namawia ludzi, żeby służyli Bogu wbrew Prawu."
"Dz18,14": "A gdy Paweł miał zamiar otworzyć usta, Gallion powiedział do Żydów: O Żydzi! Gdyby rzeczywiście to było jakieś bezprawie lub jakieś niegodziwe przestępstwo, cierpliwie bym wysłuchał tej sprawy."
"Dz18,15": "Lecz jeśli jest spór o słowa i o imiona, i o wasze Prawo, sami to rozpatrzcie; albowiem ja nie chcę być sędzią tych spraw."
"Dz18,16": "I przepędził ich sprzed sędziowskiego tronu."
"Dz18,17": "A wszyscy Grecy pochwycili Sostenesa, przełożonego synagogi i bili go przed sędziowskim tronem, a Galliona nic to nie obchodziło."
"Dz18,18": "A Paweł pozostał tam jeszcze przez wiele dni i gdy pożegnał się z braćmi, odpłynął do Syrii, a z nim Pryscylla i Akwila. W Kenchreach ogolił sobie głowę, bo uczynił ślub."
"Dz18,19": "I przybył do Efezu, i tam ich pozostawił, a sam wszedł do synagogi i rozprawiał z Żydami."
"Dz18,20": "A gdy oni prosili, aby u nich został przez dłuższy czas, nie zgodził się,"
"Dz18,21": "Ale pożegnał się z nimi i powiedział: Niewątpliwie, trzeba mi nadchodzące święto obchodzić w Jerozolimie; lecz znów do was wrócę, za wolą Boga. I odpłynął z Efezu."
"Dz18,22": "A gdy przybył do Cezarei, wstąpił i pozdrowił zbór, i zszedł do Antiochii;"
"Dz18,23": "I pozostał tam przez pewien czas, i gdy wyszedł, przeszedł kolejno krainę galacką i Frygię, umacniając wszystkich uczniów."
"Dz18,24": "A do Efezu przyszedł pewien Żyd, o imieniu Apollos, rodem z Aleksandrii, człowiek wymowny, biegły w Pismach."
"Dz18,25": "Ten był pouczony o drodze Pana, a pałając w duchu, mówił i nauczał dokładnie o Panu, wiedząc tylko o chrzcie Jana."
"Dz18,26": "I zaczął śmiało mówić w synagodze. A gdy usłyszeli go Akwila i Pryscylla, wzięli go ze sobą i dokładniej wyłożyli mu drogę Bożą."
"Dz18,27": "A gdy chciał iść do Achai, bracia napisali do uczniów, zachęcając, aby go przyjęli; i gdy tam przyszedł, wiele pomagał tym, którzy uwierzyli dzięki łasce Bożej."
"Dz18,28": "Zdecydowanie bowiem zbijał twierdzenia Żydów, publicznie wykazując z Pisma, że Jezus jest Mesjaszem."
