"Dz28,1":
  text: "Gdy zostali ocaleni, dowiedzieli się, że wyspa nazywa się Malta."
  tags: []
"Dz28,2":
  text: "A tubylcy okazali nam niespotykaną życzliwość; przyjęli bowiem nas wszystkich, rozpalając ogień z powodu padającego deszczu i z powodu zimna."
  tags: []
"Dz28,3":
  text: "A gdy Paweł zgarnął kupę chrustu i nałożył na ogień, od gorąca wyszła żmija i uczepiła się jego ręki."
  tags: []
"Dz28,4":
  text: "A gdy tubylcy ujrzeli żmiję wiszącą u jego ręki, mówili między sobą: Pewnie ten człowiek jest zabójcą; chociaż ocalał z morza, sprawiedliwość nie pozwoliła mu żyć."
  tags: []
"Dz28,5":
  text: "Lecz on strząsnął żmiję w ogień i nie doznał nic złego."
  tags: []
"Dz28,6":
  text: "A oni oczekiwali, że spuchnie albo nagle upadnie martwy; lecz gdy długo na to czekali, a widzieli, że nic złego mu się nie stało, zmienili zdanie i mówili, że jest bogiem."
  tags: []
"Dz28,7":
  text: "A w okolicy tego miejsca miał posiadłość zarządca tej wyspy, o imieniu Publiusz, który przyjął nas i życzliwie ugościł przez trzy dni."
  tags: []
"Dz28,8":
  text: "I zdarzyło się, że ojciec Publiusza leżał złożony gorączką i biegunką; Paweł wszedł do niego, i gdy pomodlił się, i włożył na niego ręce, uzdrowił go."
  tags: []
"Dz28,9":
  text: "Gdy więc to się stało, inni na tej wyspie, którzy też mieli słabości, przychodzili i byli uzdrawiani."
  tags: []
"Dz28,10":
  text: "Ci też okazywali nam wielki szacunek, a gdy mieliśmy odpłynąć, dostarczyli, to co było potrzebne."
  tags: []
"Dz28,11":
  text: "A po trzech miesiącach odpłynęliśmy na statku aleksandryjskim z figurą dziobową bliźniąt, który przezimował na tej wyspie."
  tags: []
"Dz28,12":
  text: "I gdy przypłynęliśmy do Syrakuz, pozostaliśmy tam trzy dni."
  tags: []
"Dz28,13":
  text: "A stamtąd, trzymając się brzegu, przybyliśmy do Regium, a gdy po upływie jednego dnia, nastał południowy wiatr, na drugi dzień przybyliśmy do Puteoli,"
  tags: []
"Dz28,14":
  text: "Gdzie znaleźliśmy braci, i byliśmy przez nich zaproszeni, aby pozostać siedem dni; i tak doszliśmy do Rzymu."
  tags: []
"Dz28,15":
  text: "A tamtejsi bracia, słysząc o nas, wyszli na nasze spotkanie aż do Forum Appii i do Trzech Tawern, gdy ich Paweł ujrzał, podziękował Bogu i nabrał odwagi."
  tags: []
"Dz28,16":
  text: "A gdy przyszliśmy do Rzymu, setnik oddał więźniów dowódcy straży; ale Pawłowi pozwolono mieszkać osobno razem z żołnierzem, który go strzegł."
  tags: []
"Dz28,17":
  text: "I stało się po trzech dniach, że Paweł zwołał do siebie przedniejszych Żydów. A gdy się zeszli, powiedział do nich: Mężowie bracia! Ja nie uczyniłem nic przeciwko ludowi i zwyczajom ojczystym, a jednak zostałem wydany jako więzień z Jerozolimy w ręce Rzymian,"
  tags: []
"Dz28,18":
  text: "Którzy po przesłuchaniu chcieli mnie wypuścić, dlatego że we mnie nie było żadnego powodu do kary śmierci."
  tags: []
"Dz28,19":
  text: "Lecz wobec sprzeciwu Judejczyków, zostałem zmuszony odwołać się do Cezara; nie żebym miał swój naród o coś oskarżać."
  tags: []
"Dz28,20":
  text: "Z tego właśnie powodu poprosiłem was, aby zobaczyć się i porozmawiać; albowiem ze względu na nadzieję Izraela jestem opasany tym łańcuchem."
  tags: []
"Dz28,21":
  text: "Oni natomiast powiedzieli do niego: My nie otrzymaliśmy ani listów o tobie z Judei, ani też nikt z braci nie przyszedł i nie oznajmił, czy powiedział coś złego o tobie."
  tags: []
"Dz28,22":
  text: "A uważamy za właściwe od ciebie usłyszeć, co naprawdę myślisz; wiadomo bowiem nam o tym stronnictwie, że wszędzie spotyka się ze sprzeciwem."
  tags: []
"Dz28,23":
  text: "A gdy wyznaczyli mu dzień, przyszli do niego jeszcze liczniej w gościnę, im to od rana do wieczora wykładał, świadcząc o Królestwie Boga, przekonując ich do tego, co dotyczy Jezusa, z Prawa Mojżesza i z Proroków,"
  tags: []
"Dz28,24":
  text: "I jedni wprawdzie zostali przekonani o tym, co mówił, inni natomiast nie wierzyli."
  tags: []
"Dz28,25":
  text: "A nie zgadzając się między sobą, zaczęli się rozchodzić, gdy Paweł powiedział to jedno słowo: Dobrze Duch Święty powiedział przez Izajasza proroka do naszych ojców,"
  tags: []
"Dz28,26":
  text: "Mówiąc: Idź do tego ludu i powiedz: Słuchając będziecie słyszeć, a nie zrozumiecie, i patrząc będziecie widzieć, a nie ujrzycie;"
  tags: []
"Dz28,27":
  text: "Utyło bowiem serce tego ludu i uszami z trudem usłyszeli, a swoje oczy zamknęli, aby czasem oczami nie widzieli i uszami nie usłyszeli, a sercem nie zrozumieli i nie nawrócili się, i abym ich nie uzdrowił."
  tags: []
"Dz28,28":
  text: "Niech więc będzie wam wiadomo, że poganom posłane zostało to zbawienie Boże; i oni będą słuchać."
  tags: []
"Dz28,29":
  text: "A gdy on to powiedział, Żydzi odeszli, wiodąc między sobą zaciekły spór."
  tags: []
"Dz28,30":
  text: "I pozostał Paweł całe dwa lata we własnym, wynajmowanym mieszkaniu i przyjmował wszystkich, którzy przychodzili do niego,"
  tags: []
"Dz28,31":
  text: "Głosząc Królestwo Boga i nauczając o Panu Jezusie Chrystusie, z całą śmiałością, bez przeszkód."
  tags: []
