"Dz28,1": "Gdy zostali ocaleni, dowiedzieli się, że wyspa nazywa się Malta."
"Dz28,2": "A tubylcy okazali nam niespotykaną życzliwość; przyjęli bowiem nas wszystkich, rozpalając ogień z powodu padającego deszczu i z powodu zimna."
"Dz28,3": "A gdy Paweł zgarnął kupę chrustu i nałożył na ogień, od gorąca wyszła żmija i uczepiła się jego ręki."
"Dz28,4": "A gdy tubylcy ujrzeli żmiję wiszącą u jego ręki, mówili między sobą: Pewnie ten człowiek jest zabójcą; chociaż ocalał z morza, sprawiedliwość nie pozwoliła mu żyć."
"Dz28,5": "Lecz on strząsnął żmiję w ogień i nie doznał nic złego."
"Dz28,6": "A oni oczekiwali, że spuchnie albo nagle upadnie martwy; lecz gdy długo na to czekali, a widzieli, że nic złego mu się nie stało, zmienili zdanie i mówili, że jest bogiem."
"Dz28,7": "A w okolicy tego miejsca miał posiadłość zarządca tej wyspy, o imieniu Publiusz, który przyjął nas i życzliwie ugościł przez trzy dni."
"Dz28,8": "I zdarzyło się, że ojciec Publiusza leżał złożony gorączką i biegunką; Paweł wszedł do niego, i gdy pomodlił się, i włożył na niego ręce, uzdrowił go."
"Dz28,9": "Gdy więc to się stało, inni na tej wyspie, którzy też mieli słabości, przychodzili i byli uzdrawiani."
"Dz28,10": "Ci też okazywali nam wielki szacunek, a gdy mieliśmy odpłynąć, dostarczyli, to co było potrzebne."
"Dz28,11": "A po trzech miesiącach odpłynęliśmy na statku aleksandryjskim z figurą dziobową bliźniąt, który przezimował na tej wyspie."
"Dz28,12": "I gdy przypłynęliśmy do Syrakuz, pozostaliśmy tam trzy dni."
"Dz28,13": "A stamtąd, trzymając się brzegu, przybyliśmy do Regium, a gdy po upływie jednego dnia, nastał południowy wiatr, na drugi dzień przybyliśmy do Puteoli,"
"Dz28,14": "Gdzie znaleźliśmy braci, i byliśmy przez nich zaproszeni, aby pozostać siedem dni; i tak doszliśmy do Rzymu."
"Dz28,15": "A tamtejsi bracia, słysząc o nas, wyszli na nasze spotkanie aż do Forum Appii i do Trzech Tawern, gdy ich Paweł ujrzał, podziękował Bogu i nabrał odwagi."
"Dz28,16": "A gdy przyszliśmy do Rzymu, setnik oddał więźniów dowódcy straży; ale Pawłowi pozwolono mieszkać osobno razem z żołnierzem, który go strzegł."
"Dz28,17": "I stało się po trzech dniach, że Paweł zwołał do siebie przedniejszych Żydów. A gdy się zeszli, powiedział do nich: Mężowie bracia! Ja nie uczyniłem nic przeciwko ludowi i zwyczajom ojczystym, a jednak zostałem wydany jako więzień z Jerozolimy w ręce Rzymian,"
"Dz28,18": "Którzy po przesłuchaniu chcieli mnie wypuścić, dlatego że we mnie nie było żadnego powodu do kary śmierci."
"Dz28,19": "Lecz wobec sprzeciwu Judejczyków, zostałem zmuszony odwołać się do Cezara; nie żebym miał swój naród o coś oskarżać."
"Dz28,20": "Z tego właśnie powodu poprosiłem was, aby zobaczyć się i porozmawiać; albowiem ze względu na nadzieję Izraela jestem opasany tym łańcuchem."
"Dz28,21": "Oni natomiast powiedzieli do niego: My nie otrzymaliśmy ani listów o tobie z Judei, ani też nikt z braci nie przyszedł i nie oznajmił, czy powiedział coś złego o tobie."
"Dz28,22": "A uważamy za właściwe od ciebie usłyszeć, co naprawdę myślisz; wiadomo bowiem nam o tym stronnictwie, że wszędzie spotyka się ze sprzeciwem."
"Dz28,23": "A gdy wyznaczyli mu dzień, przyszli do niego jeszcze liczniej w gościnę, im to od rana do wieczora wykładał, świadcząc o Królestwie Boga, przekonując ich do tego, co dotyczy Jezusa, z Prawa Mojżesza i z Proroków,"
"Dz28,24": "I jedni wprawdzie zostali przekonani o tym, co mówił, inni natomiast nie wierzyli."
"Dz28,25": "A nie zgadzając się między sobą, zaczęli się rozchodzić, gdy Paweł powiedział to jedno słowo: Dobrze Duch Święty powiedział przez Izajasza proroka do naszych ojców,"
"Dz28,26": "Mówiąc: Idź do tego ludu i powiedz: Słuchając będziecie słyszeć, a nie zrozumiecie, i patrząc będziecie widzieć, a nie ujrzycie;"
"Dz28,27": "Utyło bowiem serce tego ludu i uszami z trudem usłyszeli, a swoje oczy zamknęli, aby czasem oczami nie widzieli i uszami nie usłyszeli, a sercem nie zrozumieli i nie nawrócili się, i abym ich nie uzdrowił."
"Dz28,28": "Niech więc będzie wam wiadomo, że poganom posłane zostało to zbawienie Boże; i oni będą słuchać."
"Dz28,29": "A gdy on to powiedział, Żydzi odeszli, wiodąc między sobą zaciekły spór."
"Dz28,30": "I pozostał Paweł całe dwa lata we własnym, wynajmowanym mieszkaniu i przyjmował wszystkich, którzy przychodzili do niego,"
"Dz28,31": "Głosząc Królestwo Boga i nauczając o Panu Jezusie Chrystusie, z całą śmiałością, bez przeszkód."
