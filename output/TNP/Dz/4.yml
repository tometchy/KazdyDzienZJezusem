"Dz4,1": "A gdy oni przemawiali do ludu, stanęli obok nich kapłani i dowódca straży świątyni, i saduceusze,"
"Dz4,2": "Oburzając się, że nauczali lud i głosili powstanie z martwych w Jezusie."
"Dz4,3": "I pochwycili ich w swe ręce, i osadzili pod strażą aż do następnego dnia; bo był już wieczór."
"Dz4,4": "Wielu natomiast z tych, którzy usłyszeli te słowa, uwierzyło; a była liczba tych mężów około pięciu tysięcy."
"Dz4,5": "I stało się, że nazajutrz zebrali się w Jerozolimie ich przywódcy, i starsi, i uczeni w Piśmie,"
"Dz4,6": "I Annasz, arcykapłan, i Kajfasz, i Jan, i Aleksander, i ci którzy byli z rodu arcykapłańskiego;"
"Dz4,7": "A gdy postawili ich pośrodku, wypytywali: Jaką mocą albo w czyim imieniu to uczyniliście?"
"Dz4,8": "Wtedy Piotr, napełniony Duchem Świętym, powiedział do nich: Przywódcy ludu i starsi Izraela!"
"Dz4,9": "Jeśli my dzisiaj jesteśmy przesłuchiwani z powodu dobrodziejstwa uczynionego człowiekowi choremu, dzięki któremu on jest teraz uratowany."
"Dz4,10": "To niech wam wszystkim i całemu ludowi Izraela jest wiadome, że w imieniu Jezusa Chrystusa Nazarejczyka, którego wy przybiliście do krzyża, a którego Bóg wzbudził z martwych, w tym imieniu stoi on przed wami zdrowy."
"Dz4,11": "On jest tym kamieniem wzgardzonym przez was budujących, który stał się głowicą węgła."
"Dz4,12": "I nie ma w nikim innym zbawienia, bowiem nie ma innego imienia pod niebem, danego ludziom, w którym moglibyśmy zostać zbawieni."
"Dz4,13": "A widząc odwagę Piotra i Jana, i gdy pojęli, że są to ludzie nieuczeni i prości, dziwili się i poznali, że oni również byli z Jezusem."
"Dz4,14": "A patrząc na stojącego razem z nimi człowieka, który został uzdrowiony, nie mieli nic przeciwko nim do powiedzenia."
"Dz4,15": "I gdy rozkazali im wyjść z miejsca posiedzeń Sanhedrynu, naradzali się między sobą,"
"Dz4,16": "Mówiąc: Co uczynimy tym ludziom? Gdyż istotnie stał się przez nich widoczny wszystkim mieszkającym w Jerozolimie cudowny znak i nie możemy temu zaprzeczyć."
"Dz4,17": "Lecz, aby to jeszcze bardziej nie rozniosło się między ludem, zabrońmy im pod groźbą, aby więcej w tym imieniu nie mówili do nikogo z ludzi."
"Dz4,18": "I wezwali ich, i nakazali im, aby w ogóle nie mówili ani nie nauczali w imieniu Jezusa."
"Dz4,19": "Lecz Piotr i Jan w odpowiedzi, powiedzieli do nich: Czy jest to słuszne przed obliczem Boga, was słuchać bardziej niż Boga? Osądźcie."
"Dz4,20": "My bowiem, nie możemy nie mówić tego, co widzieliśmy i słyszeliśmy."
"Dz4,21": "A oni po dalszych groźbach wypuścili ich z powodu ludu, nie znajdując nic, za co mogliby ich ukarać; wszyscy bowiem chwalili Boga za to, co się stało."
"Dz4,22": "Bo człowiek, na którym dokonał się ten cudowny znak uzdrowienia, liczył więcej niż czterdzieści lat."
"Dz4,23": "A gdy zostali zwolnieni, przyszli do swoich i oznajmili im wszystko, co do nich powiedzieli arcykapłani i starsi."
"Dz4,24": "A ci, gdy to usłyszeli, podnieśli jednomyślnie głos do Boga i powiedzieli: Władco! Boże, Ty który uczyniłeś niebo i ziemię, i morze i wszystko, co w nich jest,"
"Dz4,25": "Który powiedziałeś przez usta Dawida, swojego sługi: Czemu wzburzyły się narody, a ludy rozmyślały o marności?"
"Dz4,26": "Powstali królowie ziemi, a przywódcy zebrali się razem przeciwko PANU i przeciwko Jego Mesjaszowi."
"Dz4,27": "Bo rzeczywiście zebrali się razem przeciwko świętemu Synowi Twojemu, Jezusowi, którego namaściłeś, Herod, a także i Poncjusz Piłat z narodami i z ludem Izraela,"
"Dz4,28": "Aby uczynili wszystko to, co ręka Twoja i wola Twoja wcześniej postanowiła, aby się stało."
"Dz4,29": "A teraz, PANIE, spójrz na ich groźby, i daj swoim sługom z całą śmiałością głosić Twoje Słowo;"
"Dz4,30": "Gdy Ty wyciągasz swoją rękę by uzdrawiać, tak by działy się znaki i cuda, przez imię Twojego świętego Syna, Jezusa."
"Dz4,31": "A gdy oni się pomodlili, zatrzęsło się miejsce, w którym byli zgromadzeni, i wszyscy zostali napełnieni Duchem Świętym, i ze śmiałością głosili Słowo Boże."
"Dz4,32": "A mnóstwo tych, którzy uwierzyli, miało jedno serce i jedną duszę, a nikt nie mówił, że jego dobytek był jego własnością, ale wszystko mieli wspólne."
"Dz4,33": "A apostołowie z wielką mocą składali świadectwo o powstaniu z martwych Pana Jezusa, była też nad nimi wszystkimi wielka łaska."
"Dz4,34": "Albowiem nie było wśród nich nikogo, kto by cierpiał niedostatek; gdyż ci, którzy byli właścicielami pól lub domów, sprzedawali je i przynosili równowartość tego, co zostało sprzedane,"
"Dz4,35": "I kładli u stóp apostołów; i rozdawano każdemu, zgodnie z tym, kto jaką miał potrzebę."
"Dz4,36": "A Józef, który przez apostołów został nazwany Barnabą – co tłumaczy się: Syn Pocieszenia – Lewita, rodem z Cypru,"
"Dz4,37": "Po sprzedaniu posiadanej przez siebie roli, przyniósł pieniądze i położył je u stóp apostołów."
