"Dz4,1":
  text: "A gdy oni przemawiali do ludu, stanęli obok nich kapłani i dowódca straży świątyni, i saduceusze,"
  tags: []
"Dz4,2":
  text: "Oburzając się, że nauczali lud i głosili powstanie z martwych w Jezusie."
  tags: []
"Dz4,3":
  text: "I pochwycili ich w swe ręce, i osadzili pod strażą aż do następnego dnia; bo był już wieczór."
  tags: []
"Dz4,4":
  text: "Wielu natomiast z tych, którzy usłyszeli te słowa, uwierzyło; a była liczba tych mężów około pięciu tysięcy."
  tags: []
"Dz4,5":
  text: "I stało się, że nazajutrz zebrali się w Jerozolimie ich przywódcy, i starsi, i uczeni w Piśmie,"
  tags: []
"Dz4,6":
  text: "I Annasz, arcykapłan, i Kajfasz, i Jan, i Aleksander, i ci którzy byli z rodu arcykapłańskiego;"
  tags: []
"Dz4,7":
  text: "A gdy postawili ich pośrodku, wypytywali: Jaką mocą albo w czyim imieniu to uczyniliście?"
  tags: []
"Dz4,8":
  text: "Wtedy Piotr, napełniony Duchem Świętym, powiedział do nich: Przywódcy ludu i starsi Izraela!"
  tags: []
"Dz4,9":
  text: "Jeśli my dzisiaj jesteśmy przesłuchiwani z powodu dobrodziejstwa uczynionego człowiekowi choremu, dzięki któremu on jest teraz uratowany."
  tags: []
"Dz4,10":
  text: "To niech wam wszystkim i całemu ludowi Izraela jest wiadome, że w imieniu Jezusa Chrystusa Nazarejczyka, którego wy przybiliście do krzyża, a którego Bóg wzbudził z martwych, w tym imieniu stoi on przed wami zdrowy."
  tags: []
"Dz4,11":
  text: "On jest tym kamieniem wzgardzonym przez was budujących, który stał się głowicą węgła."
  tags: []
"Dz4,12":
  text: "I nie ma w nikim innym zbawienia, bowiem nie ma innego imienia pod niebem, danego ludziom, w którym moglibyśmy zostać zbawieni."
  tags: []
"Dz4,13":
  text: "A widząc odwagę Piotra i Jana, i gdy pojęli, że są to ludzie nieuczeni i prości, dziwili się i poznali, że oni również byli z Jezusem."
  tags: []
"Dz4,14":
  text: "A patrząc na stojącego razem z nimi człowieka, który został uzdrowiony, nie mieli nic przeciwko nim do powiedzenia."
  tags: []
"Dz4,15":
  text: "I gdy rozkazali im wyjść z miejsca posiedzeń Sanhedrynu, naradzali się między sobą,"
  tags: []
"Dz4,16":
  text: "Mówiąc: Co uczynimy tym ludziom? Gdyż istotnie stał się przez nich widoczny wszystkim mieszkającym w Jerozolimie cudowny znak i nie możemy temu zaprzeczyć."
  tags: []
"Dz4,17":
  text: "Lecz, aby to jeszcze bardziej nie rozniosło się między ludem, zabrońmy im pod groźbą, aby więcej w tym imieniu nie mówili do nikogo z ludzi."
  tags: []
"Dz4,18":
  text: "I wezwali ich, i nakazali im, aby w ogóle nie mówili ani nie nauczali w imieniu Jezusa."
  tags: []
"Dz4,19":
  text: "Lecz Piotr i Jan w odpowiedzi, powiedzieli do nich: Czy jest to słuszne przed obliczem Boga, was słuchać bardziej niż Boga? Osądźcie."
  tags: []
"Dz4,20":
  text: "My bowiem, nie możemy nie mówić tego, co widzieliśmy i słyszeliśmy."
  tags: []
"Dz4,21":
  text: "A oni po dalszych groźbach wypuścili ich z powodu ludu, nie znajdując nic, za co mogliby ich ukarać; wszyscy bowiem chwalili Boga za to, co się stało."
  tags: []
"Dz4,22":
  text: "Bo człowiek, na którym dokonał się ten cudowny znak uzdrowienia, liczył więcej niż czterdzieści lat."
  tags: []
"Dz4,23":
  text: "A gdy zostali zwolnieni, przyszli do swoich i oznajmili im wszystko, co do nich powiedzieli arcykapłani i starsi."
  tags: []
"Dz4,24":
  text: "A ci, gdy to usłyszeli, podnieśli jednomyślnie głos do Boga i powiedzieli: Władco! Boże, Ty który uczyniłeś niebo i ziemię, i morze i wszystko, co w nich jest,"
  tags: []
"Dz4,25":
  text: "Który powiedziałeś przez usta Dawida, swojego sługi: Czemu wzburzyły się narody, a ludy rozmyślały o marności?"
  tags: []
"Dz4,26":
  text: "Powstali królowie ziemi, a przywódcy zebrali się razem przeciwko PANU i przeciwko Jego Mesjaszowi."
  tags: []
"Dz4,27":
  text: "Bo rzeczywiście zebrali się razem przeciwko świętemu Synowi Twojemu, Jezusowi, którego namaściłeś, Herod, a także i Poncjusz Piłat z narodami i z ludem Izraela,"
  tags: []
"Dz4,28":
  text: "Aby uczynili wszystko to, co ręka Twoja i wola Twoja wcześniej postanowiła, aby się stało."
  tags: []
"Dz4,29":
  text: "A teraz, PANIE, spójrz na ich groźby, i daj swoim sługom z całą śmiałością głosić Twoje Słowo;"
  tags: []
"Dz4,30":
  text: "Gdy Ty wyciągasz swoją rękę by uzdrawiać, tak by działy się znaki i cuda, przez imię Twojego świętego Syna, Jezusa."
  tags: []
"Dz4,31":
  text: "A gdy oni się pomodlili, zatrzęsło się miejsce, w którym byli zgromadzeni, i wszyscy zostali napełnieni Duchem Świętym, i ze śmiałością głosili Słowo Boże."
  tags: []
"Dz4,32":
  text: "A mnóstwo tych, którzy uwierzyli, miało jedno serce i jedną duszę, a nikt nie mówił, że jego dobytek był jego własnością, ale wszystko mieli wspólne."
  tags: []
"Dz4,33":
  text: "A apostołowie z wielką mocą składali świadectwo o powstaniu z martwych Pana Jezusa, była też nad nimi wszystkimi wielka łaska."
  tags: []
"Dz4,34":
  text: "Albowiem nie było wśród nich nikogo, kto by cierpiał niedostatek; gdyż ci, którzy byli właścicielami pól lub domów, sprzedawali je i przynosili równowartość tego, co zostało sprzedane,"
  tags: []
"Dz4,35":
  text: "I kładli u stóp apostołów; i rozdawano każdemu, zgodnie z tym, kto jaką miał potrzebę."
  tags: []
"Dz4,36":
  text: "A Józef, który przez apostołów został nazwany Barnabą – co tłumaczy się: Syn Pocieszenia – Lewita, rodem z Cypru,"
  tags: []
"Dz4,37":
  text: "Po sprzedaniu posiadanej przez siebie roli, przyniósł pieniądze i położył je u stóp apostołów."
  tags: []
