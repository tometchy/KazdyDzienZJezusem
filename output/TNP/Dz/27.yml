"Dz27,1":
  text: "A gdy postanowiono, abyśmy odpłynęli do Italii, oddano Pawła i niektórych innych więźniów setnikowi kohorty Czcigodnego, o imieniu Juliusz."
  tags: []
"Dz27,2":
  text: "A gdy wsiedliśmy na statek adramyteński, mający płynąć do portów Azji, wyruszyliśmy, a był z nami Arystarch, Macedończyk z Tesaloniki."
  tags: []
"Dz27,3":
  text: "A następnego dnia przybyliśmy do Sydonu, gdzie Juliusz z życzliwością potraktował Pawła i pozwolił mu iść do przyjaciół, aby uzyskał zaopatrzenie."
  tags: []
"Dz27,4":
  text: "A stamtąd wyruszyliśmy, i przepłynęliśmy pod osłoną Cypru, bo wiatry były przeciwne."
  tags: []
"Dz27,5":
  text: "A gdy przepłynęliśmy otwarte morze, naprzeciw Cylicji i Pamfilii, przybyliśmy do Miry, miasta w Licji."
  tags: []
"Dz27,6":
  text: "I tam setnik znalazł statek aleksandryjski, który płynął do Italii i wsadził nas na niego."
  tags: []
"Dz27,7":
  text: "A gdy przez wiele dni wolno płynęliśmy, z trudnością przybyliśmy naprzeciw Knidos, bo nie pozwalał nam wiatr, przepłynęliśmy pod osłoną Krety naprzeciw Salmony."
  tags: []
"Dz27,8":
  text: "I gdy z trudem żeglowaliśmy wzdłuż niej, przybyliśmy do pewnego miejsca, zwanego Piękne Porty, w pobliżu którego było miasto Lasaia."
  tags: []
"Dz27,9":
  text: "A gdy upłynął znaczny czas i żegluga była już niebezpieczna, dlatego że minął już okres postu, radził im Paweł,"
  tags: []
"Dz27,10":
  text: "Mówiąc do nich: Mężowie! Widzę, że ta żegluga będzie ze stratą i z wielką szkodą, nie tylko dla towarów i statku, ale i dla naszego życia."
  tags: []
"Dz27,11":
  text: "Setnik jednak bardziej ufał właścicielowi statku i sternikowi, niż temu, co mówił Paweł."
  tags: []
"Dz27,12":
  text: "A ponieważ port był niedogodny do przezimowania, większość powzięła decyzję, aby stamtąd odpłynąć i, o ile jest to możliwe, dostać się do Feniksu, portu Krety, zwróconego na stronę południowo-zachodnią i północno-zachodnią, i tam przezimować."
  tags: []
"Dz27,13":
  text: "A gdy zawiał łagodny wiatr z południa, uważając, że trzeba silnie trzymać się swojego postanowienia, podnieśli kotwicę i płynęli wzdłuż wybrzeża Krety."
  tags: []
"Dz27,14":
  text: "Lecz niedługo potem uderzył na nich gwałtowny wicher, który nazywa się Euroklidon."
  tags: []
"Dz27,15":
  text: "A gdy statek został porwany i nie mógł stawiać czoła wichrowi, poddaliśmy się wiatrowi i byliśmy niesieni."
  tags: []
"Dz27,16":
  text: "A gdy podpłynęliśmy pod pewną wysepkę, która nazywa się Klauda, z trudnością zdołaliśmy zapanować nad łodzią ratunkową,"
  tags: []
"Dz27,17":
  text: "Po wciągnięciu której, rozpoczęto opasywać statek korzystając ze sprzętu pomocniczego, a w obawie, by nie wpaść na mieliznę Syrty, spuszczono pływającą kotwicę; i tak byli niesieni."
  tags: []
"Dz27,18":
  text: "A że gwałtownie byliśmy gnani przez wichurę, nazajutrz wyrzucono ładunek."
  tags: []
"Dz27,19":
  text: "A trzeciego dnia wyrzuciliśmy własnymi rękami osprzęt statku."
  tags: []
"Dz27,20":
  text: "Ponieważ ani słońce, ani gwiazdy nie ukazywały się przez wiele dni, a niesłabnąca nawałnica napierała na nas, opuściła nas cała nasza nadzieja, że będziemy ocaleni."
  tags: []
"Dz27,21":
  text: "A gdy długo nie jedliśmy, wtedy Paweł stanął pośrodku nich i powiedział: Należało, o mężowie, być bezwzględnie posłusznym mojej radzie i nie odpływać z Krety, i oszczędzić sobie tej straty i szkody."
  tags: []
"Dz27,22":
  text: "I teraz namawiam was, bądźcie dobrej myśli; bo żadna dusza spośród was nie zginie, tylko statek."
  tags: []
"Dz27,23":
  text: "Tej nocy bowiem, stanął przy mnie anioł tego Boga, do którego należę i któremu służę, mówiąc:"
  tags: []
"Dz27,24":
  text: "Nie bój się, Pawle! Trzeba ci stanąć przed Cezarem, a oto darował ci Bóg wszystkich, którzy płyną z tobą."
  tags: []
"Dz27,25":
  text: "Dlatego, mężowie, bądźcie dobrej myśli; albowiem wierzę Bogu, że tak będzie, jak mi powiedziano."
  tags: []
"Dz27,26":
  text: "I musimy być wyrzuceni na jakąś wyspę."
  tags: []
"Dz27,27":
  text: "A gdy nastała czternasta noc, a my błąkaliśmy się po Adriatyku, około północy zdawało się żeglarzom, że zbliża się do nich jakiś ląd."
  tags: []
"Dz27,28":
  text: "I gdy spuścili sondę, stwierdzili dwadzieścia sążni; a gdy posunęli się trochę dalej, znowu spuścili sondę i stwierdzili piętnaście sążni."
  tags: []
"Dz27,29":
  text: "W obawie, byśmy czasem nie wpadli na miejsca skaliste, zrzucili cztery kotwice z rufy statku, życzyli sobie, aby nastał dzień."
  tags: []
"Dz27,30":
  text: "A żeglarze, zamierzając uciec ze statku, spuścili łódź ratunkową na morze, pod pretekstem, że chcą od dziobu statku rzucać kotwice,"
  tags: []
"Dz27,31":
  text: "Paweł powiedział setnikowi i żołnierzom: Jeśli oni nie zostaną na statku, wy nie możecie zostać ocaleni."
  tags: []
"Dz27,32":
  text: "Wtedy żołnierze odcięli liny od łodzi ratunkowej i pozwolili jej spaść."
  tags: []
"Dz27,33":
  text: "A kiedy miał nastać dzień, Paweł zachęcał wszystkich, aby spożyli posiłek, mówiąc: Dzisiaj jest czternasty dzień, jak czekając pozostajecie bez posiłku, nic nie przyjmując."
  tags: []
"Dz27,34":
  text: "Dlatego zachęcam was, abyście przyjęli posiłek, bo to służy waszemu ocaleniu, albowiem żadnemu z was nawet włos z głowy nie spadnie."
  tags: []
"Dz27,35":
  text: "A gdy to powiedział, wziął chleb, podziękował Bogu wobec wszystkich, złamał i zaczął jeść."
  tags: []
"Dz27,36":
  text: "A będąc dobrej myśli, również i wszyscy oni przyjęli posiłek."
  tags: []
"Dz27,37":
  text: "A było nas wszystkich na statku dwieście siedemdziesiąt sześć dusz."
  tags: []
"Dz27,38":
  text: "A gdy nasycili się posiłkiem, odciążyli statek, wyrzucając zboże do morza."
  tags: []
"Dz27,39":
  text: "A gdy nastał dzień, nie rozpoznali tej ziemi; spostrzegli jednak jakąś zatokę, mającą wybrzeże, do którego postanowili, jeżeli można, przybić statkiem."
  tags: []
"Dz27,40":
  text: "I odcięli kotwice, spuszczając je w morze; i gdy zwolnili wiązania steru, podnieśli przedni żagiel, by podmuch wiatru skierował ich do brzegu;"
  tags: []
"Dz27,41":
  text: "A wpadli w miejsce, między dwoma prądami morskimi i osadzili statek na mieliźnie; wprawdzie dziób statku oparł się pozostając unieruchomiony, lecz rufa była rozbijana przez gwałtowne fale."
  tags: []
"Dz27,42":
  text: "Żołnierze natomiast postanowili, aby pozabijać więźniów, aby żaden po dopłynięciu nie uciekł."
  tags: []
"Dz27,43":
  text: "Lecz setnik, chcąc uratować Pawła, powstrzymał ich od tego zamiaru i rozkazał także, by umiejący pływać wyskoczyli i pierwsi wyszli na ląd,"
  tags: []
"Dz27,44":
  text: "A pozostali mieli dopłynąć, jedni na deskach, a inni na czymkolwiek z okrętu. I tak się stało, że wszyscy ocaleli i wyszli na ląd."
  tags: []
