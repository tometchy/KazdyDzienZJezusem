"Dz27,1": "A gdy postanowiono, abyśmy odpłynęli do Italii, oddano Pawła i niektórych innych więźniów setnikowi kohorty Czcigodnego, o imieniu Juliusz."
"Dz27,2": "A gdy wsiedliśmy na statek adramyteński, mający płynąć do portów Azji, wyruszyliśmy, a był z nami Arystarch, Macedończyk z Tesaloniki."
"Dz27,3": "A następnego dnia przybyliśmy do Sydonu, gdzie Juliusz z życzliwością potraktował Pawła i pozwolił mu iść do przyjaciół, aby uzyskał zaopatrzenie."
"Dz27,4": "A stamtąd wyruszyliśmy, i przepłynęliśmy pod osłoną Cypru, bo wiatry były przeciwne."
"Dz27,5": "A gdy przepłynęliśmy otwarte morze, naprzeciw Cylicji i Pamfilii, przybyliśmy do Miry, miasta w Licji."
"Dz27,6": "I tam setnik znalazł statek aleksandryjski, który płynął do Italii i wsadził nas na niego."
"Dz27,7": "A gdy przez wiele dni wolno płynęliśmy, z trudnością przybyliśmy naprzeciw Knidos, bo nie pozwalał nam wiatr, przepłynęliśmy pod osłoną Krety naprzeciw Salmony."
"Dz27,8": "I gdy z trudem żeglowaliśmy wzdłuż niej, przybyliśmy do pewnego miejsca, zwanego Piękne Porty, w pobliżu którego było miasto Lasaia."
"Dz27,9": "A gdy upłynął znaczny czas i żegluga była już niebezpieczna, dlatego że minął już okres postu, radził im Paweł,"
"Dz27,10": "Mówiąc do nich: Mężowie! Widzę, że ta żegluga będzie ze stratą i z wielką szkodą, nie tylko dla towarów i statku, ale i dla naszego życia."
"Dz27,11": "Setnik jednak bardziej ufał właścicielowi statku i sternikowi, niż temu, co mówił Paweł."
"Dz27,12": "A ponieważ port był niedogodny do przezimowania, większość powzięła decyzję, aby stamtąd odpłynąć i, o ile jest to możliwe, dostać się do Feniksu, portu Krety, zwróconego na stronę południowo-zachodnią i północno-zachodnią, i tam przezimować."
"Dz27,13": "A gdy zawiał łagodny wiatr z południa, uważając, że trzeba silnie trzymać się swojego postanowienia, podnieśli kotwicę i płynęli wzdłuż wybrzeża Krety."
"Dz27,14": "Lecz niedługo potem uderzył na nich gwałtowny wicher, który nazywa się Euroklidon."
"Dz27,15": "A gdy statek został porwany i nie mógł stawiać czoła wichrowi, poddaliśmy się wiatrowi i byliśmy niesieni."
"Dz27,16": "A gdy podpłynęliśmy pod pewną wysepkę, która nazywa się Klauda, z trudnością zdołaliśmy zapanować nad łodzią ratunkową,"
"Dz27,17": "Po wciągnięciu której, rozpoczęto opasywać statek korzystając ze sprzętu pomocniczego, a w obawie, by nie wpaść na mieliznę Syrty, spuszczono pływającą kotwicę; i tak byli niesieni."
"Dz27,18": "A że gwałtownie byliśmy gnani przez wichurę, nazajutrz wyrzucono ładunek."
"Dz27,19": "A trzeciego dnia wyrzuciliśmy własnymi rękami osprzęt statku."
"Dz27,20": "Ponieważ ani słońce, ani gwiazdy nie ukazywały się przez wiele dni, a niesłabnąca nawałnica napierała na nas, opuściła nas cała nasza nadzieja, że będziemy ocaleni."
"Dz27,21": "A gdy długo nie jedliśmy, wtedy Paweł stanął pośrodku nich i powiedział: Należało, o mężowie, być bezwzględnie posłusznym mojej radzie i nie odpływać z Krety, i oszczędzić sobie tej straty i szkody."
"Dz27,22": "I teraz namawiam was, bądźcie dobrej myśli; bo żadna dusza spośród was nie zginie, tylko statek."
"Dz27,23": "Tej nocy bowiem, stanął przy mnie anioł tego Boga, do którego należę i któremu służę, mówiąc:"
"Dz27,24": "Nie bój się, Pawle! Trzeba ci stanąć przed Cezarem, a oto darował ci Bóg wszystkich, którzy płyną z tobą."
"Dz27,25": "Dlatego, mężowie, bądźcie dobrej myśli; albowiem wierzę Bogu, że tak będzie, jak mi powiedziano."
"Dz27,26": "I musimy być wyrzuceni na jakąś wyspę."
"Dz27,27": "A gdy nastała czternasta noc, a my błąkaliśmy się po Adriatyku, około północy zdawało się żeglarzom, że zbliża się do nich jakiś ląd."
"Dz27,28": "I gdy spuścili sondę, stwierdzili dwadzieścia sążni; a gdy posunęli się trochę dalej, znowu spuścili sondę i stwierdzili piętnaście sążni."
"Dz27,29": "W obawie, byśmy czasem nie wpadli na miejsca skaliste, zrzucili cztery kotwice z rufy statku, życzyli sobie, aby nastał dzień."
"Dz27,30": "A żeglarze, zamierzając uciec ze statku, spuścili łódź ratunkową na morze, pod pretekstem, że chcą od dziobu statku rzucać kotwice,"
"Dz27,31": "Paweł powiedział setnikowi i żołnierzom: Jeśli oni nie zostaną na statku, wy nie możecie zostać ocaleni."
"Dz27,32": "Wtedy żołnierze odcięli liny od łodzi ratunkowej i pozwolili jej spaść."
"Dz27,33": "A kiedy miał nastać dzień, Paweł zachęcał wszystkich, aby spożyli posiłek, mówiąc: Dzisiaj jest czternasty dzień, jak czekając pozostajecie bez posiłku, nic nie przyjmując."
"Dz27,34": "Dlatego zachęcam was, abyście przyjęli posiłek, bo to służy waszemu ocaleniu, albowiem żadnemu z was nawet włos z głowy nie spadnie."
"Dz27,35": "A gdy to powiedział, wziął chleb, podziękował Bogu wobec wszystkich, złamał i zaczął jeść."
"Dz27,36": "A będąc dobrej myśli, również i wszyscy oni przyjęli posiłek."
"Dz27,37": "A było nas wszystkich na statku dwieście siedemdziesiąt sześć dusz."
"Dz27,38": "A gdy nasycili się posiłkiem, odciążyli statek, wyrzucając zboże do morza."
"Dz27,39": "A gdy nastał dzień, nie rozpoznali tej ziemi; spostrzegli jednak jakąś zatokę, mającą wybrzeże, do którego postanowili, jeżeli można, przybić statkiem."
"Dz27,40": "I odcięli kotwice, spuszczając je w morze; i gdy zwolnili wiązania steru, podnieśli przedni żagiel, by podmuch wiatru skierował ich do brzegu;"
"Dz27,41": "A wpadli w miejsce, między dwoma prądami morskimi i osadzili statek na mieliźnie; wprawdzie dziób statku oparł się pozostając unieruchomiony, lecz rufa była rozbijana przez gwałtowne fale."
"Dz27,42": "Żołnierze natomiast postanowili, aby pozabijać więźniów, aby żaden po dopłynięciu nie uciekł."
"Dz27,43": "Lecz setnik, chcąc uratować Pawła, powstrzymał ich od tego zamiaru i rozkazał także, by umiejący pływać wyskoczyli i pierwsi wyszli na ląd,"
"Dz27,44": "A pozostali mieli dopłynąć, jedni na deskach, a inni na czymkolwiek z okrętu. I tak się stało, że wszyscy ocaleli i wyszli na ląd."
