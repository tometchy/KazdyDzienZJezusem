"Dz2,1":
  text: "I gdy nadszedł dzień Pięćdziesiąty, byli wszyscy zgromadzeni jednomyślnie na tym samym miejscu."
  tags: []
"Dz2,2":
  text: "I nagle powstał z nieba szum, jakby nadchodzącego gwałtownego wiatru, i napełnił cały dom, gdzie przebywali."
  tags: []
"Dz2,3":
  text: "I ukazały się im rozdzielające się języki jakby ognia, tak że spoczął na każdym z nich."
  tags: []
"Dz2,4":
  text: "I napełnieni zostali wszyscy Duchem Świętym, i zaczęli mówić innymi językami, tak jak Duch dawał im się wypowiadać."
  tags: []
"Dz2,5":
  text: "A przebywali w Jerozolimie Żydzi, mężowie pobożni, z każdego narodu pod niebem."
  tags: []
"Dz2,6":
  text: "A gdy powstał ten głos, zeszło się mnóstwo ludzi i zdumieli się, że słyszeli, każdy z nich, jak mówili ich własnym językiem."
  tags: []
"Dz2,7":
  text: "I zdumiewali się wszyscy, i dziwili się, mówiąc jedni do drugich: Czy oto ci wszyscy, którzy mówią, nie są Galilejczykami?"
  tags: []
"Dz2,8":
  text: "Jak to więc jest, że słyszymy każdy z nas własny język w którym się urodziliśmy?"
  tags: []
"Dz2,9":
  text: "Partowie i Medowie, i Elamici, i zamieszkujący Mezopotamię, Judeę a także Kapadocję, Pont i Azję,"
  tags: []
"Dz2,10":
  text: "Frygię a także Pamfilię, Egipt i części Libii, tej leżącej naprzeciw Cyreny, i przybysze z Rzymu, Judejczycy, a także prozelici,"
  tags: []
"Dz2,11":
  text: "Kreteńczycy i Arabowie, słyszymy ich mówiących w naszych językach o wielkich dziełach Boga."
  tags: []
"Dz2,12":
  text: "I zdumieli się wszyscy, i byli zakłopotani, mówiąc jeden do drugiego: Cóż to ma być?"
  tags: []
"Dz2,13":
  text: "Inni natomiast szydząc, mówili: Upili się młodym winem."
  tags: []
"Dz2,14":
  text: "Wtedy wstał Piotr z jedenastoma, podniósł swój głos i przemówił do nich: Mężowie Judejczycy i wy zamieszkujący Jerozolimę! Niech jest to wam wiadome i wysłuchajcie moich słów."
  tags: []
"Dz2,15":
  text: "Bowiem nie są oni pijani, jak przypuszczacie, gdyż jest trzecia godzina dnia."
  tags: []
"Dz2,16":
  text: "Ale to jest to, co jest powiedziane przez proroka Joela:"
  tags: []
"Dz2,17":
  text: "I tak będzie w ostatecznych dniach, mówi Bóg, wyleję z Ducha mojego na wszelkie ciało, prorokować będą synowie wasi i córki wasze, a młodzieńcy wasi ujrzą widzenia, a starsi wasi będą śnić sny."
  tags: []
"Dz2,18":
  text: "I nawet na moje sługi i na moje służebnice w tych dniach wyleję z Ducha mojego, i będą prorokować;"
  tags: []
"Dz2,19":
  text: "I ukażę cuda na niebie w górze, i znaki na ziemi na dole, krew, ogień i kłęby dymu."
  tags: []
"Dz2,20":
  text: "Słońce zostanie obrócone w ciemność, a księżyc w krew, zanim przyjdzie ten wielki i jawny dzień PANA."
  tags: []
"Dz2,21":
  text: "I stanie się, że każdy, kto wezwie imienia PANA, zostanie zbawiony."
  tags: []
"Dz2,22":
  text: "Mężowie Izraelici! Słuchajcie tych słów: Jezusa Nazarejczyka, męża od Boga, który jest wam potwierdzony przez moce, cuda i znaki, które czynił Bóg przez Niego pośród was, jak to sami wiecie,"
  tags: []
"Dz2,23":
  text: "Tego, zgodnie z ustalonym postanowieniem i uprzednią wiedzą Boga wydanego, wzięliście i przytwierdziliście do krzyża rękami ludzi nieprawych."
  tags: []
"Dz2,24":
  text: "Jego to wzbudził Bóg, gdy uwolnił od bólów śmierci, gdyż było rzeczą niemożliwą, aby przez nią był trzymany."
  tags: []
"Dz2,25":
  text: "Dawid bowiem mówi o Nim: Przez cały czas widziałem Pana przed moim obliczem: Bo jest po mojej prawicy, abym nie został zachwiany."
  tags: []
"Dz2,26":
  text: "Dlatego doznało radości moje serce i rozradował się mój język, a jeszcze i ciało moje mieszkać będzie w nadziei;"
  tags: []
"Dz2,27":
  text: "Nie zostawisz bowiem mojej duszy w Hadesie, ani nie dopuścisz, by święty Twój oglądał zepsucie."
  tags: []
"Dz2,28":
  text: "Dałeś mi poznać drogi życia i napełnisz mnie radością przed Twoim obliczem."
  tags: []
"Dz2,29":
  text: "Mężowie bracia! Wolno mi mówić z całą śmiałością do was o patriarsze Dawidzie, że umarł i został pogrzebany, a jego grobowiec jest u nas aż do dnia dzisiejszego."
  tags: []
"Dz2,30":
  text: "Będąc więc prorokiem, i wiedząc, że Bóg potwierdził przysięgą, że z owocu jego lędźwi według ciała wzbudzi Mesjasza i posadzi na jego tronie,"
  tags: []
"Dz2,31":
  text: "To przewidując, powiedział o zmartwychwstaniu Mesjasza, że nie została dusza Jego w Hadesie, a ciało Jego nie zobaczy zepsucia."
  tags: []
"Dz2,32":
  text: "Tego to Jezusa wzbudził Bóg, czego my wszyscy jesteśmy świadkami."
  tags: []
"Dz2,33":
  text: "Będąc więc wywyższonym prawicą Boga, i otrzymując od Ojca obietnicę Ducha Świętego, wylał to, co wy teraz widzicie i słyszycie."
  tags: []
"Dz2,34":
  text: "Albowiem Dawid nie wstąpił do nieba, lecz sam mówi: Powiedział PAN mojemu Panu: Zasiadaj po mojej prawicy,"
  tags: []
"Dz2,35":
  text: "Aż położę nieprzyjaciół twoich jako podnóżek twoich stóp."
  tags: []
"Dz2,36":
  text: "Niech więc wie z pewnością cały dom Izraela, że i Panem i Mesjaszem uczynił Go Bóg, tego Jezusa, którego wy ukrzyżowaliście."
  tags: []
"Dz2,37":
  text: "Gdy to usłyszeli, serca ich zostały przeszyte do głębi i powiedzieli do Piotra oraz do pozostałych apostołów: Co mamy czynić, mężowie bracia?"
  tags: []
"Dz2,38":
  text: "A Piotr powiedział do nich: Upamiętajcie się i niech każdy z was zostanie ochrzczony w imieniu Jezusa Chrystusa ze względu na odpuszczenie grzechów, a otrzymacie dar Ducha Świętego."
  tags: []
"Dz2,39":
  text: "Dla was bowiem jest ta obietnica i dla waszych dzieci, i dla wszystkich, którzy są z dala, ilu ich powoła PAN, Bóg nasz."
  tags: []
"Dz2,40":
  text: "I w wielu innych słowach świadczył i zachęcał ich, mówiąc: Dajcie się uratować z tego przewrotnego pokolenia."
  tags: []
"Dz2,41":
  text: "Ci więc, którzy z radością przyjęli jego słowa, zostali ochrzczeni, i w tym dniu przyłączonych zostało około trzech tysięcy dusz."
  tags: []
"Dz2,42":
  text: "I trwali niezłomnie w nauce apostołów i we wspólnocie, i w łamaniu chleba, i w modlitwach."
  tags: []
"Dz2,43":
  text: "I każdą duszę ogarniała bojaźń, a przez ręce apostołów działo się wiele znaków i cudów."
  tags: []
"Dz2,44":
  text: "A wszyscy wierzący byli na tym samym miejscu i wszystko mieli wspólne."
  tags: []
"Dz2,45":
  text: "I sprzedawali swoje posiadłości i majątki, i rozdzielali je wszystkim, zgodnie z tym, jaką kto miał potrzebę."
  tags: []
"Dz2,46":
  text: "I codziennie też trwali niezłomnie i jednomyślnie w świątyni, łamiąc także chleb po domach, przyjmowali pokarm z radością i w prostocie serca,"
  tags: []
"Dz2,47":
  text: "Chwaląc Boga i mając życzliwość u całego ludu. A Pan codziennie przyłączał do tego grona – do zboru – tych, którzy dostępowali zbawienia."
  tags: []
