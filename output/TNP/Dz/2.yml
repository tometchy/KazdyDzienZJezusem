"Dz2,1": "I gdy nadszedł dzień Pięćdziesiąty, byli wszyscy zgromadzeni jednomyślnie na tym samym miejscu."
"Dz2,2": "I nagle powstał z nieba szum, jakby nadchodzącego gwałtownego wiatru, i napełnił cały dom, gdzie przebywali."
"Dz2,3": "I ukazały się im rozdzielające się języki jakby ognia, tak że spoczął na każdym z nich."
"Dz2,4": "I napełnieni zostali wszyscy Duchem Świętym, i zaczęli mówić innymi językami, tak jak Duch dawał im się wypowiadać."
"Dz2,5": "A przebywali w Jerozolimie Żydzi, mężowie pobożni, z każdego narodu pod niebem."
"Dz2,6": "A gdy powstał ten głos, zeszło się mnóstwo ludzi i zdumieli się, że słyszeli, każdy z nich, jak mówili ich własnym językiem."
"Dz2,7": "I zdumiewali się wszyscy, i dziwili się, mówiąc jedni do drugich: Czy oto ci wszyscy, którzy mówią, nie są Galilejczykami?"
"Dz2,8": "Jak to więc jest, że słyszymy każdy z nas własny język w którym się urodziliśmy?"
"Dz2,9": "Partowie i Medowie, i Elamici, i zamieszkujący Mezopotamię, Judeę a także Kapadocję, Pont i Azję,"
"Dz2,10": "Frygię a także Pamfilię, Egipt i części Libii, tej leżącej naprzeciw Cyreny, i przybysze z Rzymu, Judejczycy, a także prozelici,"
"Dz2,11": "Kreteńczycy i Arabowie, słyszymy ich mówiących w naszych językach o wielkich dziełach Boga."
"Dz2,12": "I zdumieli się wszyscy, i byli zakłopotani, mówiąc jeden do drugiego: Cóż to ma być?"
"Dz2,13": "Inni natomiast szydząc, mówili: Upili się młodym winem."
"Dz2,14": "Wtedy wstał Piotr z jedenastoma, podniósł swój głos i przemówił do nich: Mężowie Judejczycy i wy zamieszkujący Jerozolimę! Niech jest to wam wiadome i wysłuchajcie moich słów."
"Dz2,15": "Bowiem nie są oni pijani, jak przypuszczacie, gdyż jest trzecia godzina dnia."
"Dz2,16": "Ale to jest to, co jest powiedziane przez proroka Joela:"
"Dz2,17": "I tak będzie w ostatecznych dniach, mówi Bóg, wyleję z Ducha mojego na wszelkie ciało, prorokować będą synowie wasi i córki wasze, a młodzieńcy wasi ujrzą widzenia, a starsi wasi będą śnić sny."
"Dz2,18": "I nawet na moje sługi i na moje służebnice w tych dniach wyleję z Ducha mojego, i będą prorokować;"
"Dz2,19": "I ukażę cuda na niebie w górze, i znaki na ziemi na dole, krew, ogień i kłęby dymu."
"Dz2,20": "Słońce zostanie obrócone w ciemność, a księżyc w krew, zanim przyjdzie ten wielki i jawny dzień PANA."
"Dz2,21": "I stanie się, że każdy, kto wezwie imienia PANA, zostanie zbawiony."
"Dz2,22": "Mężowie Izraelici! Słuchajcie tych słów: Jezusa Nazarejczyka, męża od Boga, który jest wam potwierdzony przez moce, cuda i znaki, które czynił Bóg przez Niego pośród was, jak to sami wiecie,"
"Dz2,23": "Tego, zgodnie z ustalonym postanowieniem i uprzednią wiedzą Boga wydanego, wzięliście i przytwierdziliście do krzyża rękami ludzi nieprawych."
"Dz2,24": "Jego to wzbudził Bóg, gdy uwolnił od bólów śmierci, gdyż było rzeczą niemożliwą, aby przez nią był trzymany."
"Dz2,25": "Dawid bowiem mówi o Nim: Przez cały czas widziałem Pana przed moim obliczem: Bo jest po mojej prawicy, abym nie został zachwiany."
"Dz2,26": "Dlatego doznało radości moje serce i rozradował się mój język, a jeszcze i ciało moje mieszkać będzie w nadziei;"
"Dz2,27": "Nie zostawisz bowiem mojej duszy w Hadesie, ani nie dopuścisz, by święty Twój oglądał zepsucie."
"Dz2,28": "Dałeś mi poznać drogi życia i napełnisz mnie radością przed Twoim obliczem."
"Dz2,29": "Mężowie bracia! Wolno mi mówić z całą śmiałością do was o patriarsze Dawidzie, że umarł i został pogrzebany, a jego grobowiec jest u nas aż do dnia dzisiejszego."
"Dz2,30": "Będąc więc prorokiem, i wiedząc, że Bóg potwierdził przysięgą, że z owocu jego lędźwi według ciała wzbudzi Mesjasza i posadzi na jego tronie,"
"Dz2,31": "To przewidując, powiedział o zmartwychwstaniu Mesjasza, że nie została dusza Jego w Hadesie, a ciało Jego nie zobaczy zepsucia."
"Dz2,32": "Tego to Jezusa wzbudził Bóg, czego my wszyscy jesteśmy świadkami."
"Dz2,33": "Będąc więc wywyższonym prawicą Boga, i otrzymując od Ojca obietnicę Ducha Świętego, wylał to, co wy teraz widzicie i słyszycie."
"Dz2,34": "Albowiem Dawid nie wstąpił do nieba, lecz sam mówi: Powiedział PAN mojemu Panu: Zasiadaj po mojej prawicy,"
"Dz2,35": "Aż położę nieprzyjaciół twoich jako podnóżek twoich stóp."
"Dz2,36": "Niech więc wie z pewnością cały dom Izraela, że i Panem i Mesjaszem uczynił Go Bóg, tego Jezusa, którego wy ukrzyżowaliście."
"Dz2,37": "Gdy to usłyszeli, serca ich zostały przeszyte do głębi i powiedzieli do Piotra oraz do pozostałych apostołów: Co mamy czynić, mężowie bracia?"
"Dz2,38": "A Piotr powiedział do nich: Upamiętajcie się i niech każdy z was zostanie ochrzczony w imieniu Jezusa Chrystusa ze względu na odpuszczenie grzechów, a otrzymacie dar Ducha Świętego."
"Dz2,39": "Dla was bowiem jest ta obietnica i dla waszych dzieci, i dla wszystkich, którzy są z dala, ilu ich powoła PAN, Bóg nasz."
"Dz2,40": "I w wielu innych słowach świadczył i zachęcał ich, mówiąc: Dajcie się uratować z tego przewrotnego pokolenia."
"Dz2,41": "Ci więc, którzy z radością przyjęli jego słowa, zostali ochrzczeni, i w tym dniu przyłączonych zostało około trzech tysięcy dusz."
"Dz2,42": "I trwali niezłomnie w nauce apostołów i we wspólnocie, i w łamaniu chleba, i w modlitwach."
"Dz2,43": "I każdą duszę ogarniała bojaźń, a przez ręce apostołów działo się wiele znaków i cudów."
"Dz2,44": "A wszyscy wierzący byli na tym samym miejscu i wszystko mieli wspólne."
"Dz2,45": "I sprzedawali swoje posiadłości i majątki, i rozdzielali je wszystkim, zgodnie z tym, jaką kto miał potrzebę."
"Dz2,46": "I codziennie też trwali niezłomnie i jednomyślnie w świątyni, łamiąc także chleb po domach, przyjmowali pokarm z radością i w prostocie serca,"
"Dz2,47": "Chwaląc Boga i mając życzliwość u całego ludu. A Pan codziennie przyłączał do tego grona – do zboru – tych, którzy dostępowali zbawienia."
