"Dz24,1":
  text: "A po pięciu dniach przybył arcykapłan Ananiasz ze starszymi i z Tertullusem, retorem prawnym, którzy przedstawili namiestnikowi zarzuty wobec Pawła."
  tags: []
"Dz24,2":
  text: "A gdy został wezwany, zaczął go Tertullus oskarżać, mówiąc: Dostąpiliśmy dzięki tobie wielkiego pokoju i wszystko pomyślnie się dzieje w tym narodzie z powodu twojej przezorności."
  tags: []
"Dz24,3":
  text: "Przyjmujemy to zawsze i wszędzie, najdostojniejszy Feliksie, z całą wdzięcznością."
  tags: []
"Dz24,4":
  text: "Lecz aby ci więcej nie przeszkadzać, proszę, abyś nas w swojej życzliwości, krótko posłuchał."
  tags: []
"Dz24,5":
  text: "Stwierdziliśmy bowiem, że ten człowiek jest jak zaraza i wywołuje rozruchy między wszystkimi Żydami po całym zamieszkałym świecie, jako przywódca stronnictwa Nazarejczyków."
  tags: []
"Dz24,6":
  text: "On też próbował zbezcześcić świątynię, a my pochwyciliśmy go i chcieliśmy sądzić według naszego Prawa."
  tags: []
"Dz24,7":
  text: "Lecz dowódca Lizjasz przyszedł i z wielką gwałtownością wyrwał go z naszych rąk,"
  tags: []
"Dz24,8":
  text: "Rozkazując jego oskarżycielom przyjść do ciebie; sam będziesz mógł wypytać się go o wszystkie te sprawy, o które my go oskarżamy."
  tags: []
"Dz24,9":
  text: "Co też potwierdzili i Żydzi, zapewniając, że tak się te sprawy mają."
  tags: []
"Dz24,10":
  text: "A Paweł, gdy namiestnik skinął na niego, aby mówił, odpowiedział: Wiedząc, że ty jesteś sędzią tego narodu od wielu lat, bronię się, będąc dobrej myśli odnośnie siebie."
  tags: []
"Dz24,11":
  text: "A ty możesz sprawdzić, że nie minęło więcej jak dwanaście dni od czasu, kiedy przyszedłem do Jerozolimy, aby oddać cześć Bogu;"
  tags: []
"Dz24,12":
  text: "I nie znaleźli mnie w świątyni ani w synagogach, ani w mieście, z kimś rozprawiającego, ani wywołującego bunt tłumu;"
  tags: []
"Dz24,13":
  text: "I nie mogą przedstawić dowodów na to, o co mnie teraz oskarżają."
  tags: []
"Dz24,14":
  text: "To jednak wyznaję przed tobą, że zgodnie z Drogą, którą oni nazywają odszczepieństwem, tak służę ojczystemu Bogu, wierząc wszystkiemu co zgodnie z Prawem, i co w Prorokach jest napisane."
  tags: []
"Dz24,15":
  text: "Mając nadzieję w Bogu, której i oni sami oczekują, że będzie powstanie z martwych sprawiedliwych, a także niesprawiedliwych."
  tags: []
"Dz24,16":
  text: "W związku z tym sam usilnie zabiegam, abym we wszystkim miał przed Bogiem i przed ludźmi nienaganne sumienie."
  tags: []
"Dz24,17":
  text: "A po wielu latach przybyłem, aby mojemu narodowi przynieść dary miłosierdzia i ofiary."
  tags: []
"Dz24,18":
  text: "Przy których, niektórzy Żydzi z Azji znaleźli mnie oczyszczonego w świątyni, a nie w tłumie lub podczas rozruchów,"
  tags: []
"Dz24,19":
  text: "Oni powinni być tu obecni przed tobą, i oskarżać, jeżeli mają coś przeciwko mnie."
  tags: []
"Dz24,20":
  text: "Albo niech ci to sami powiedzą, czy znaleźli we mnie jakieś bezprawie, gdy stanąłem przed Sanhedrynem,"
  tags: []
"Dz24,21":
  text: "Chyba tylko ten jeden okrzyk, którym stojąc wśród nich, wykrzyknąłem: Odnośnie powstania z martwych, ja dzisiaj przed wami jestem sądzony."
  tags: []
"Dz24,22":
  text: "A gdy Feliks to usłyszał, znając dokładniej to, co dotyczy Drogi, odroczył ich sprawę, i powiedział: Kiedy przybędzie dowódca Lizjasz, rozpatrzę te wasze zarzuty."
  tags: []
"Dz24,23":
  text: "I rozkazał setnikowi strzec Pawła i zastosować ulgi, i nie wzbraniać nikomu z jego bliskich mu usługiwać lub przychodzić do niego."
  tags: []
"Dz24,24":
  text: "A gdy po kilku dniach przyjechał Feliks ze swoją żoną Druzyllą, która była Żydówką, kazał przywołać Pawła, i słuchał go odnośnie wiary w Chrystusa."
  tags: []
"Dz24,25":
  text: "A gdy on wykładał o sprawiedliwości, i o wstrzemięźliwości, i o mającym nadejść sądzie, Feliks przestraszony, odpowiedział: Na teraz wystarczy. Odejdź, a gdy znajdę stosowny czas, wezwę ciebie."
  tags: []
"Dz24,26":
  text: "Równocześnie też miał nadzieję, że Paweł da mu pieniądze, aby go wypuścił; dlatego też tym częściej go wzywał i z nim rozmawiał."
  tags: []
"Dz24,27":
  text: "A po upływie dwóch lat, Feliks otrzymał następcę Porcjusza Festusa, chcąc też okazać życzliwość Żydom, Feliks zostawił Pawła w więzieniu."
  tags: []
