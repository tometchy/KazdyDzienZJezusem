"Dz24,1": "A po pięciu dniach przybył arcykapłan Ananiasz ze starszymi i z Tertullusem, retorem prawnym, którzy przedstawili namiestnikowi zarzuty wobec Pawła."
"Dz24,2": "A gdy został wezwany, zaczął go Tertullus oskarżać, mówiąc: Dostąpiliśmy dzięki tobie wielkiego pokoju i wszystko pomyślnie się dzieje w tym narodzie z powodu twojej przezorności."
"Dz24,3": "Przyjmujemy to zawsze i wszędzie, najdostojniejszy Feliksie, z całą wdzięcznością."
"Dz24,4": "Lecz aby ci więcej nie przeszkadzać, proszę, abyś nas w swojej życzliwości, krótko posłuchał."
"Dz24,5": "Stwierdziliśmy bowiem, że ten człowiek jest jak zaraza i wywołuje rozruchy między wszystkimi Żydami po całym zamieszkałym świecie, jako przywódca stronnictwa Nazarejczyków."
"Dz24,6": "On też próbował zbezcześcić świątynię, a my pochwyciliśmy go i chcieliśmy sądzić według naszego Prawa."
"Dz24,7": "Lecz dowódca Lizjasz przyszedł i z wielką gwałtownością wyrwał go z naszych rąk,"
"Dz24,8": "Rozkazując jego oskarżycielom przyjść do ciebie; sam będziesz mógł wypytać się go o wszystkie te sprawy, o które my go oskarżamy."
"Dz24,9": "Co też potwierdzili i Żydzi, zapewniając, że tak się te sprawy mają."
"Dz24,10": "A Paweł, gdy namiestnik skinął na niego, aby mówił, odpowiedział: Wiedząc, że ty jesteś sędzią tego narodu od wielu lat, bronię się, będąc dobrej myśli odnośnie siebie."
"Dz24,11": "A ty możesz sprawdzić, że nie minęło więcej jak dwanaście dni od czasu, kiedy przyszedłem do Jerozolimy, aby oddać cześć Bogu;"
"Dz24,12": "I nie znaleźli mnie w świątyni ani w synagogach, ani w mieście, z kimś rozprawiającego, ani wywołującego bunt tłumu;"
"Dz24,13": "I nie mogą przedstawić dowodów na to, o co mnie teraz oskarżają."
"Dz24,14": "To jednak wyznaję przed tobą, że zgodnie z Drogą, którą oni nazywają odszczepieństwem, tak służę ojczystemu Bogu, wierząc wszystkiemu co zgodnie z Prawem, i co w Prorokach jest napisane."
"Dz24,15": "Mając nadzieję w Bogu, której i oni sami oczekują, że będzie powstanie z martwych sprawiedliwych, a także niesprawiedliwych."
"Dz24,16": "W związku z tym sam usilnie zabiegam, abym we wszystkim miał przed Bogiem i przed ludźmi nienaganne sumienie."
"Dz24,17": "A po wielu latach przybyłem, aby mojemu narodowi przynieść dary miłosierdzia i ofiary."
"Dz24,18": "Przy których, niektórzy Żydzi z Azji znaleźli mnie oczyszczonego w świątyni, a nie w tłumie lub podczas rozruchów,"
"Dz24,19": "Oni powinni być tu obecni przed tobą, i oskarżać, jeżeli mają coś przeciwko mnie."
"Dz24,20": "Albo niech ci to sami powiedzą, czy znaleźli we mnie jakieś bezprawie, gdy stanąłem przed Sanhedrynem,"
"Dz24,21": "Chyba tylko ten jeden okrzyk, którym stojąc wśród nich, wykrzyknąłem: Odnośnie powstania z martwych, ja dzisiaj przed wami jestem sądzony."
"Dz24,22": "A gdy Feliks to usłyszał, znając dokładniej to, co dotyczy Drogi, odroczył ich sprawę, i powiedział: Kiedy przybędzie dowódca Lizjasz, rozpatrzę te wasze zarzuty."
"Dz24,23": "I rozkazał setnikowi strzec Pawła i zastosować ulgi, i nie wzbraniać nikomu z jego bliskich mu usługiwać lub przychodzić do niego."
"Dz24,24": "A gdy po kilku dniach przyjechał Feliks ze swoją żoną Druzyllą, która była Żydówką, kazał przywołać Pawła, i słuchał go odnośnie wiary w Chrystusa."
"Dz24,25": "A gdy on wykładał o sprawiedliwości, i o wstrzemięźliwości, i o mającym nadejść sądzie, Feliks przestraszony, odpowiedział: Na teraz wystarczy. Odejdź, a gdy znajdę stosowny czas, wezwę ciebie."
"Dz24,26": "Równocześnie też miał nadzieję, że Paweł da mu pieniądze, aby go wypuścił; dlatego też tym częściej go wzywał i z nim rozmawiał."
"Dz24,27": "A po upływie dwóch lat, Feliks otrzymał następcę Porcjusza Festusa, chcąc też okazać życzliwość Żydom, Feliks zostawił Pawła w więzieniu."
