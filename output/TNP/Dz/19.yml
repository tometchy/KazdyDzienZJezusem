"Dz19,1":
  text: "I stało się, gdy Apollos był w Koryncie, że Paweł przeszedł wyżynne części i zszedł do Efezu; i znalazł jakichś uczniów,"
  tags: []
"Dz19,2":
  text: "I powiedział do nich: Czy otrzymaliście Ducha Świętego, gdy uwierzyliście? A oni mu powiedzieli: Nawet nie usłyszeliśmy, że jest dany Duch Święty."
  tags: []
"Dz19,3":
  text: "I powiedział do nich: W co więc zostaliście ochrzczeni? A oni powiedzieli: W chrzcie Jana."
  tags: []
"Dz19,4":
  text: "Paweł więc powiedział: Jan wprawdzie chrzcił chrztem upamiętania, mówiąc ludowi, aby uwierzyli w Tego, który idzie po nim, to jest w Mesjasza – Jezusa."
  tags: []
"Dz19,5":
  text: "A gdy to usłyszeli, dali się ochrzcić w imię Pana Jezusa."
  tags: []
"Dz19,6":
  text: "I gdy Paweł nałożył na nich ręce, zstąpił na nich Duch Święty, tak że jedni mówili językami, a inni prorokowali."
  tags: []
"Dz19,7":
  text: "A było tych wszystkich mężczyzn około dwunastu."
  tags: []
"Dz19,8":
  text: "A gdy wszedł do synagogi, śmiało mówił przez trzy miesiące, rozprawiając i przekonując o Królestwie Boga."
  tags: []
"Dz19,9":
  text: "A gdy niektórzy zatwardzali się i nie okazywali posłuszeństwa, źle mówiąc wobec wielu o drodze Pana, odstąpił od nich i odłączył uczniów, i codziennie rozprawiał w szkole niejakiego Tyranosa."
  tags: []
"Dz19,10":
  text: "A działo się to przez dwa lata, tak że wszyscy mieszkający w Azji usłyszeli Słowa Pana Jezusa, Żydzi i Grecy."
  tags: []
"Dz19,11":
  text: "A niezwykłe dzieła mocy Bóg czynił przez ręce Pawła,"
  tags: []
"Dz19,12":
  text: "Tak że nawet chustki albo przepaski, które dotknęły jego ciała były przynoszone na chorych, i odstępowały od nich choroby, a złe duchy wychodziły z nich."
  tags: []
"Dz19,13":
  text: "A niektórzy z wędrownych egzorcystów żydowskich, podejmowali się wzywać imienia Pana Jezusa nad tymi, co mieli złego ducha, mówiąc: Poprzysięgamy was na Jezusa, którego głosi Paweł."
  tags: []
"Dz19,14":
  text: "A było niejakich siedmiu synów Scewy, Żyda, arcykapłana, którzy to czynili."
  tags: []
"Dz19,15":
  text: "A w odpowiedzi, zły duch rzekł: Jezusa znam i wiem o Pawle, natomiast wy kim jesteście?"
  tags: []
"Dz19,16":
  text: "I rzucił się na nich człowiek, w którym był zły duch, i zapanował nad nimi, okazał wobec nich taką siłę, że nadzy i poranieni wybiegli z tego domu."
  tags: []
"Dz19,17":
  text: "I stało się to znane wszystkim, Żydom i Grekom, którzy mieszkali w Efezie; i padł strach na nich wszystkich, a imię Pana Jezusa było wywyższane."
  tags: []
"Dz19,18":
  text: "I wielu z tych, którzy uwierzyli, przychodziło, wyznając i oznajmiając swoje praktyki."
  tags: []
"Dz19,19":
  text: "A wielu z tych, którzy zajmowali się magią, poznosiło swoje zwoje, i paliło je wobec wszystkich; obliczono ich wartość i stwierdzono, że wynosiła ona pięćdziesiąt tysięcy srebrnych drachm."
  tags: []
"Dz19,20":
  text: "Tak dzięki mocy Słowo Pana rozszerzało się i umacniało."
  tags: []
"Dz19,21":
  text: "A gdy się to dokonało, Paweł postanowił w duchu, przejść przez Macedonię i Achaję, i pójść do Jerozolimy, mówiąc: Potem, gdy tam będę, muszę też Rzym zobaczyć."
  tags: []
"Dz19,22":
  text: "Wysłał więc do Macedonii dwóch z usługujących mu, Tymoteusza i Erasta, sam zatrzymał się jakiś czas w Azji."
  tags: []
"Dz19,23":
  text: "A w tym czasie powstało niemałe zamieszanie z powodu drogi Pana."
  tags: []
"Dz19,24":
  text: "Albowiem pewien złotnik, o imieniu Demetriusz, który wyrabiał ze srebra świątynki Artemidy i przynosił rzemieślnikom niemały zysk,"
  tags: []
"Dz19,25":
  text: "Zgromadził ich i innych o pokrewnym rzemiośle i powiedział: Mężowie! Wiecie, że z tego zajęcia mamy swój dobrobyt."
  tags: []
"Dz19,26":
  text: "A widzicie i słyszycie, że nie tylko w Efezie, ale prawie w całej Azji ten Paweł przekonał i odwrócił wielkie rzesze, mówiąc, że nie są bogami ci, którzy są uczynieni rękami."
  tags: []
"Dz19,27":
  text: "Grozi nam niebezpieczeństwo, że nie tylko nasz dział pójdzie w poniewierkę, ale i świątynia wielkiej bogini Artemidy zacznie być poczytywana za nic, a także zostanie odarta ze swojej wielkości ta, którą czci cała Azja i cały zamieszkały świat."
  tags: []
"Dz19,28":
  text: "Gdy to usłyszeli, będąc pełni gniewu, zaczęli krzyczeć, mówiąc: Wielka jest Artemida Efeska!"
  tags: []
"Dz19,29":
  text: "I całe miasto zostało napełnione wrzawą, i ruszyli jednomyślnie na plac teatralny, porywając Gajusa i Arystarcha, Macedończyków, towarzyszy podróży Pawła."
  tags: []
"Dz19,30":
  text: "A gdy Paweł chciał wejść między lud, nie pozwolili mu uczniowie."
  tags: []
"Dz19,31":
  text: "A niektórzy też z zarządców Azji, będąc mu życzliwi, posłali do niego, prosząc, aby nie udawał się na plac teatralny."
  tags: []
"Dz19,32":
  text: "Różni zatem różne rzeczy krzyczeli; bowiem w tym zgromadzeniu był zamęt, a większość nie wiedziała, z jakiej przyczyny się zebrali."
  tags: []
"Dz19,33":
  text: "I wywlekli z tłumu Aleksandra, bo go wypchnęli Żydzi; Aleksander natomiast, skinął ręką i chciał się bronić przed ludem."
  tags: []
"Dz19,34":
  text: "Lecz gdy poznali, że jest Żydem, podniósł się jeden głos ze wszystkich ust, krzyczących prawie przez dwie godziny: Wielka jest Artemida Efeska!"
  tags: []
"Dz19,35":
  text: "Wtedy pisarz uspokoił tłum, mówiąc: Mężowie Efezjanie! Kto z ludzi nie wie, że miasto Efez opiekuje się świątynią wielkiej bogini Artemidy i posągiem, który spadł od Zeusa?"
  tags: []
"Dz19,36":
  text: "A ponieważ jest to niezaprzeczalne, trzeba, żebyście się uspokoili i nie czynili nic pochopnie."
  tags: []
"Dz19,37":
  text: "Albowiem przyprowadziliście tych mężów, którzy nie są ani świętokradcami, ani bluźniercami waszej bogini."
  tags: []
"Dz19,38":
  text: "Jeśli więc rzeczywiście Demetriusz, a razem z nim rzemieślnicy, mają przeciwko komuś sprawę, to są sądy na agorze i są prokonsulowie; niech jedni drugich oskarżają."
  tags: []
"Dz19,39":
  text: "Jeśli natomiast żądacie czegoś innego, niech rozstrzygnie się to na zgodnym z prawem zgromadzeniu."
  tags: []
"Dz19,40":
  text: "Narażamy się bowiem na niebezpieczeństwo oskarżenia o dzisiejsze rozruchy, gdyż nie ma żadnego powodu, z którego będziemy mogli zdać sprawę co do tego zbiegowiska."
  tags: []
"Dz19,41":
  text: "I gdy to powiedział, rozwiązał zgromadzenie."
  tags: []
