"Dz19,1": "I stało się, gdy Apollos był w Koryncie, że Paweł przeszedł wyżynne części i zszedł do Efezu; i znalazł jakichś uczniów,"
"Dz19,2": "I powiedział do nich: Czy otrzymaliście Ducha Świętego, gdy uwierzyliście? A oni mu powiedzieli: Nawet nie usłyszeliśmy, że jest dany Duch Święty."
"Dz19,3": "I powiedział do nich: W co więc zostaliście ochrzczeni? A oni powiedzieli: W chrzcie Jana."
"Dz19,4": "Paweł więc powiedział: Jan wprawdzie chrzcił chrztem upamiętania, mówiąc ludowi, aby uwierzyli w Tego, który idzie po nim, to jest w Mesjasza – Jezusa."
"Dz19,5": "A gdy to usłyszeli, dali się ochrzcić w imię Pana Jezusa."
"Dz19,6": "I gdy Paweł nałożył na nich ręce, zstąpił na nich Duch Święty, tak że jedni mówili językami, a inni prorokowali."
"Dz19,7": "A było tych wszystkich mężczyzn około dwunastu."
"Dz19,8": "A gdy wszedł do synagogi, śmiało mówił przez trzy miesiące, rozprawiając i przekonując o Królestwie Boga."
"Dz19,9": "A gdy niektórzy zatwardzali się i nie okazywali posłuszeństwa, źle mówiąc wobec wielu o drodze Pana, odstąpił od nich i odłączył uczniów, i codziennie rozprawiał w szkole niejakiego Tyranosa."
"Dz19,10": "A działo się to przez dwa lata, tak że wszyscy mieszkający w Azji usłyszeli Słowa Pana Jezusa, Żydzi i Grecy."
"Dz19,11": "A niezwykłe dzieła mocy Bóg czynił przez ręce Pawła,"
"Dz19,12": "Tak że nawet chustki albo przepaski, które dotknęły jego ciała były przynoszone na chorych, i odstępowały od nich choroby, a złe duchy wychodziły z nich."
"Dz19,13": "A niektórzy z wędrownych egzorcystów żydowskich, podejmowali się wzywać imienia Pana Jezusa nad tymi, co mieli złego ducha, mówiąc: Poprzysięgamy was na Jezusa, którego głosi Paweł."
"Dz19,14": "A było niejakich siedmiu synów Scewy, Żyda, arcykapłana, którzy to czynili."
"Dz19,15": "A w odpowiedzi, zły duch rzekł: Jezusa znam i wiem o Pawle, natomiast wy kim jesteście?"
"Dz19,16": "I rzucił się na nich człowiek, w którym był zły duch, i zapanował nad nimi, okazał wobec nich taką siłę, że nadzy i poranieni wybiegli z tego domu."
"Dz19,17": "I stało się to znane wszystkim, Żydom i Grekom, którzy mieszkali w Efezie; i padł strach na nich wszystkich, a imię Pana Jezusa było wywyższane."
"Dz19,18": "I wielu z tych, którzy uwierzyli, przychodziło, wyznając i oznajmiając swoje praktyki."
"Dz19,19": "A wielu z tych, którzy zajmowali się magią, poznosiło swoje zwoje, i paliło je wobec wszystkich; obliczono ich wartość i stwierdzono, że wynosiła ona pięćdziesiąt tysięcy srebrnych drachm."
"Dz19,20": "Tak dzięki mocy Słowo Pana rozszerzało się i umacniało."
"Dz19,21": "A gdy się to dokonało, Paweł postanowił w duchu, przejść przez Macedonię i Achaję, i pójść do Jerozolimy, mówiąc: Potem, gdy tam będę, muszę też Rzym zobaczyć."
"Dz19,22": "Wysłał więc do Macedonii dwóch z usługujących mu, Tymoteusza i Erasta, sam zatrzymał się jakiś czas w Azji."
"Dz19,23": "A w tym czasie powstało niemałe zamieszanie z powodu drogi Pana."
"Dz19,24": "Albowiem pewien złotnik, o imieniu Demetriusz, który wyrabiał ze srebra świątynki Artemidy i przynosił rzemieślnikom niemały zysk,"
"Dz19,25": "Zgromadził ich i innych o pokrewnym rzemiośle i powiedział: Mężowie! Wiecie, że z tego zajęcia mamy swój dobrobyt."
"Dz19,26": "A widzicie i słyszycie, że nie tylko w Efezie, ale prawie w całej Azji ten Paweł przekonał i odwrócił wielkie rzesze, mówiąc, że nie są bogami ci, którzy są uczynieni rękami."
"Dz19,27": "Grozi nam niebezpieczeństwo, że nie tylko nasz dział pójdzie w poniewierkę, ale i świątynia wielkiej bogini Artemidy zacznie być poczytywana za nic, a także zostanie odarta ze swojej wielkości ta, którą czci cała Azja i cały zamieszkały świat."
"Dz19,28": "Gdy to usłyszeli, będąc pełni gniewu, zaczęli krzyczeć, mówiąc: Wielka jest Artemida Efeska!"
"Dz19,29": "I całe miasto zostało napełnione wrzawą, i ruszyli jednomyślnie na plac teatralny, porywając Gajusa i Arystarcha, Macedończyków, towarzyszy podróży Pawła."
"Dz19,30": "A gdy Paweł chciał wejść między lud, nie pozwolili mu uczniowie."
"Dz19,31": "A niektórzy też z zarządców Azji, będąc mu życzliwi, posłali do niego, prosząc, aby nie udawał się na plac teatralny."
"Dz19,32": "Różni zatem różne rzeczy krzyczeli; bowiem w tym zgromadzeniu był zamęt, a większość nie wiedziała, z jakiej przyczyny się zebrali."
"Dz19,33": "I wywlekli z tłumu Aleksandra, bo go wypchnęli Żydzi; Aleksander natomiast, skinął ręką i chciał się bronić przed ludem."
"Dz19,34": "Lecz gdy poznali, że jest Żydem, podniósł się jeden głos ze wszystkich ust, krzyczących prawie przez dwie godziny: Wielka jest Artemida Efeska!"
"Dz19,35": "Wtedy pisarz uspokoił tłum, mówiąc: Mężowie Efezjanie! Kto z ludzi nie wie, że miasto Efez opiekuje się świątynią wielkiej bogini Artemidy i posągiem, który spadł od Zeusa?"
"Dz19,36": "A ponieważ jest to niezaprzeczalne, trzeba, żebyście się uspokoili i nie czynili nic pochopnie."
"Dz19,37": "Albowiem przyprowadziliście tych mężów, którzy nie są ani świętokradcami, ani bluźniercami waszej bogini."
"Dz19,38": "Jeśli więc rzeczywiście Demetriusz, a razem z nim rzemieślnicy, mają przeciwko komuś sprawę, to są sądy na agorze i są prokonsulowie; niech jedni drugich oskarżają."
"Dz19,39": "Jeśli natomiast żądacie czegoś innego, niech rozstrzygnie się to na zgodnym z prawem zgromadzeniu."
"Dz19,40": "Narażamy się bowiem na niebezpieczeństwo oskarżenia o dzisiejsze rozruchy, gdyż nie ma żadnego powodu, z którego będziemy mogli zdać sprawę co do tego zbiegowiska."
"Dz19,41": "I gdy to powiedział, rozwiązał zgromadzenie."
