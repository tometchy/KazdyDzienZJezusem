"Dz11,1": "I usłyszeli apostołowie i bracia, którzy byli w Judei, że także poganie przyjęli Słowo Boże."
"Dz11,2": "I gdy Piotr wstąpił do Jerozolimy, spierali się z nim ci, którzy byli z obrzezania,"
"Dz11,3": "Mówiąc: Poszedłeś do mężów nieobrzezanych i jadłeś z nimi."
"Dz11,4": "A Piotr zaczął im wyjaśniać po kolei, mówiąc:"
"Dz11,5": "Ja, gdy byłem w mieście Joppie i modliłem się, miałem w uniesieniu widzenie; ujrzałem jakiś przedmiot zstępujący jakby wielkie płótno, za cztery rogi spuszczane z nieba i dotarło aż do mnie;"
"Dz11,6": "Wpatrując się w nie uważnie, przyglądałem się i zobaczyłem czworonożne zwierzęta ziemi, dzikie zwierzęta, płazy i ptaki nieba;"
"Dz11,7": "I usłyszałem głos skierowany do mnie: Wstań, Piotrze! Zabijaj i zjedz."
"Dz11,8": "I powiedziałem: Przenigdy, Panie! Gdyż nic z tego wszystkiego, co skalane lub nieczyste nigdy nie weszło do moich ust."
"Dz11,9": "A głos z nieba po raz drugi mi odpowiedział: Tego, co Bóg oczyścił, ty nie uważaj za skalane."
"Dz11,10": "A to stało się trzykrotnie. I z powrotem wszystko zostało wciągnięte do nieba."
"Dz11,11": "I oto zaraz trzej mężowie posłani do mnie z Cezarei stanęli przed domem, w którym byłem."
"Dz11,12": "A Duch powiedział mi, abym poszedł razem z nimi, nie wahając się. A szło ze mną także tych sześciu braci i weszliśmy do domu tego człowieka;"
"Dz11,13": "On też oznajmił nam, jak zobaczył anioła, który stanął w jego domu i powiedział mu: Poślij mężczyzn do Joppy i wezwij Szymona, którego nazywają Piotrem;"
"Dz11,14": "On powie ci słowa, przez które zostaniesz zbawiony ty i cały twój dom."
"Dz11,15": "A gdy zacząłem mówić, zstąpił na nich Duch Święty, tak jak i na nas na początku."
"Dz11,16": "I przypomniałem sobie Słowo Pana, gdy mówił: Jan chrzcił w wodzie, ale wy zostaniecie ochrzczeni w Duchu Świętym."
"Dz11,17": "Jeśli więc dał im Bóg ten sam dar, jak i nam, którzy uwierzyliśmy w Pana Jezusa Chrystusa, to kim ja jestem, bym mógł zabronić tego Bogu?"
"Dz11,18": "A gdy to usłyszeli, uspokoili się i oddali chwałę Bogu, mówiąc: Tak więc i poganom dał Bóg upamiętanie ku życiu."
"Dz11,19": "A wtedy ci, których rozproszyło prześladowanie, jakie stało się z powodu Szczepana, dotarli aż do Fenicji i do Cypru, i do Antiochii, nikomu nie głosząc Słowa, tylko samym Żydom."
"Dz11,20": "A niektórzy z nich byli ludźmi z Cypru i z Cyreny; ci weszli do Antiochii, przemawiali też do hellenistów, głosząc dobrą nowinę Pana Jezusa."
"Dz11,21": "I była z nimi ręka Pana i wielka liczba tych, którzy uwierzyli, nawróciła się do Pana."
"Dz11,22": "Wieść o nich dotarła do uszu zboru w Jerozolimie; i wysłali Barnabę, aby poszedł aż do Antiochii."
"Dz11,23": "Ten, gdy tam przybył, widząc łaskę Boga, uradował się i zachęcał wszystkich, aby w postanowieniu serca trwali przy Panu."
"Dz11,24": "Był to bowiem mąż dobry i pełen Ducha Świętego, i wiary. I została przyłączona do Pana wielka rzesza ludzi."
"Dz11,25": "I poszedł Barnaba do Tarsu, aby odszukać Saula, a gdy go znalazł, przyprowadził do Antiochii."
"Dz11,26": "A stało się, że przez cały rok zgromadzali się w tym zborze, nauczając znaczną rzeszę ludzi; w Antiochii także uczniowie po raz pierwszy zostali nazwani chrześcijanami."
"Dz11,27": "A w tych dniach przyszli do Antiochii prorocy z Jerozolimy."
"Dz11,28": "A gdy powstał jeden z nich, o imieniu Agabus, wskazał przez Ducha, że będzie wielki głód w całej zamieszkałej ziemi, który też nastał za cesarza Klaudiusza."
"Dz11,29": "Uczniowie więc postanowili, tak jak każdego z nich było stać, posłać pomoc braciom mieszkającym w Judei."
"Dz11,30": "Co też uczynili, posyłając ją do starszych przez ręce Barnaby i Saula."
