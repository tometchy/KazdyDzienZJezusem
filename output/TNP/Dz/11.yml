"Dz11,1":
  text: "I usłyszeli apostołowie i bracia, którzy byli w Judei, że także poganie przyjęli Słowo Boże."
  tags: []
"Dz11,2":
  text: "I gdy Piotr wstąpił do Jerozolimy, spierali się z nim ci, którzy byli z obrzezania,"
  tags: []
"Dz11,3":
  text: "Mówiąc: Poszedłeś do mężów nieobrzezanych i jadłeś z nimi."
  tags: []
"Dz11,4":
  text: "A Piotr zaczął im wyjaśniać po kolei, mówiąc:"
  tags: []
"Dz11,5":
  text: "Ja, gdy byłem w mieście Joppie i modliłem się, miałem w uniesieniu widzenie; ujrzałem jakiś przedmiot zstępujący jakby wielkie płótno, za cztery rogi spuszczane z nieba i dotarło aż do mnie;"
  tags: []
"Dz11,6":
  text: "Wpatrując się w nie uważnie, przyglądałem się i zobaczyłem czworonożne zwierzęta ziemi, dzikie zwierzęta, płazy i ptaki nieba;"
  tags: []
"Dz11,7":
  text: "I usłyszałem głos skierowany do mnie: Wstań, Piotrze! Zabijaj i zjedz."
  tags: []
"Dz11,8":
  text: "I powiedziałem: Przenigdy, Panie! Gdyż nic z tego wszystkiego, co skalane lub nieczyste nigdy nie weszło do moich ust."
  tags: []
"Dz11,9":
  text: "A głos z nieba po raz drugi mi odpowiedział: Tego, co Bóg oczyścił, ty nie uważaj za skalane."
  tags: []
"Dz11,10":
  text: "A to stało się trzykrotnie. I z powrotem wszystko zostało wciągnięte do nieba."
  tags: []
"Dz11,11":
  text: "I oto zaraz trzej mężowie posłani do mnie z Cezarei stanęli przed domem, w którym byłem."
  tags: []
"Dz11,12":
  text: "A Duch powiedział mi, abym poszedł razem z nimi, nie wahając się. A szło ze mną także tych sześciu braci i weszliśmy do domu tego człowieka;"
  tags: []
"Dz11,13":
  text: "On też oznajmił nam, jak zobaczył anioła, który stanął w jego domu i powiedział mu: Poślij mężczyzn do Joppy i wezwij Szymona, którego nazywają Piotrem;"
  tags: []
"Dz11,14":
  text: "On powie ci słowa, przez które zostaniesz zbawiony ty i cały twój dom."
  tags: []
"Dz11,15":
  text: "A gdy zacząłem mówić, zstąpił na nich Duch Święty, tak jak i na nas na początku."
  tags: []
"Dz11,16":
  text: "I przypomniałem sobie Słowo Pana, gdy mówił: Jan chrzcił w wodzie, ale wy zostaniecie ochrzczeni w Duchu Świętym."
  tags: []
"Dz11,17":
  text: "Jeśli więc dał im Bóg ten sam dar, jak i nam, którzy uwierzyliśmy w Pana Jezusa Chrystusa, to kim ja jestem, bym mógł zabronić tego Bogu?"
  tags: []
"Dz11,18":
  text: "A gdy to usłyszeli, uspokoili się i oddali chwałę Bogu, mówiąc: Tak więc i poganom dał Bóg upamiętanie ku życiu."
  tags: []
"Dz11,19":
  text: "A wtedy ci, których rozproszyło prześladowanie, jakie stało się z powodu Szczepana, dotarli aż do Fenicji i do Cypru, i do Antiochii, nikomu nie głosząc Słowa, tylko samym Żydom."
  tags: []
"Dz11,20":
  text: "A niektórzy z nich byli ludźmi z Cypru i z Cyreny; ci weszli do Antiochii, przemawiali też do hellenistów, głosząc dobrą nowinę Pana Jezusa."
  tags: []
"Dz11,21":
  text: "I była z nimi ręka Pana i wielka liczba tych, którzy uwierzyli, nawróciła się do Pana."
  tags: []
"Dz11,22":
  text: "Wieść o nich dotarła do uszu zboru w Jerozolimie; i wysłali Barnabę, aby poszedł aż do Antiochii."
  tags: []
"Dz11,23":
  text: "Ten, gdy tam przybył, widząc łaskę Boga, uradował się i zachęcał wszystkich, aby w postanowieniu serca trwali przy Panu."
  tags: []
"Dz11,24":
  text: "Był to bowiem mąż dobry i pełen Ducha Świętego, i wiary. I została przyłączona do Pana wielka rzesza ludzi."
  tags: []
"Dz11,25":
  text: "I poszedł Barnaba do Tarsu, aby odszukać Saula, a gdy go znalazł, przyprowadził do Antiochii."
  tags: []
"Dz11,26":
  text: "A stało się, że przez cały rok zgromadzali się w tym zborze, nauczając znaczną rzeszę ludzi; w Antiochii także uczniowie po raz pierwszy zostali nazwani chrześcijanami."
  tags: []
"Dz11,27":
  text: "A w tych dniach przyszli do Antiochii prorocy z Jerozolimy."
  tags: []
"Dz11,28":
  text: "A gdy powstał jeden z nich, o imieniu Agabus, wskazał przez Ducha, że będzie wielki głód w całej zamieszkałej ziemi, który też nastał za cesarza Klaudiusza."
  tags: []
"Dz11,29":
  text: "Uczniowie więc postanowili, tak jak każdego z nich było stać, posłać pomoc braciom mieszkającym w Judei."
  tags: []
"Dz11,30":
  text: "Co też uczynili, posyłając ją do starszych przez ręce Barnaby i Saula."
  tags: []
