"Dz9,1":
  text: "A Saul, dysząc jeszcze groźbą i chęcią mordu wobec uczniów Pana, przyszedł do arcykapłana,"
  tags: []
"Dz9,2":
  text: "I prosił go o listy do Damaszku do synagog, aby, jeśli znajdzie tam mężczyzn i kobiety, zwolenników tej Drogi, przyprowadził ich związanych do Jerozolimy."
  tags: []
"Dz9,3":
  text: "I stało się, gdy był w drodze i zbliżał się do Damaszku, że nagle otoczyło go światło z nieba."
  tags: []
"Dz9,4":
  text: "A gdy padł na ziemię, usłyszał głos do niego mówiący: Saulu! Saulu! Czemu mnie prześladujesz?"
  tags: []
"Dz9,5":
  text: "A on powiedział: Kim jesteś, Panie? A Pan rzekł: Ja jestem Jezus, którego ty prześladujesz; trudno ci wierzgać przeciwko ościeniowi."
  tags: []
"Dz9,6":
  text: "A Saul drżący i wstrząśnięty, powiedział: Panie! Co chcesz bym uczynił? A Pan do niego: Wstań i wejdź do miasta, a powiedzą ci, co konieczne jest abyś uczynił."
  tags: []
"Dz9,7":
  text: "A mężczyźni towarzyszący mu w drodze, stanęli niezdolni do mówienia; głos bowiem słyszeli, ale nikogo nie widzieli."
  tags: []
"Dz9,8":
  text: "A Saul został podniesiony z ziemi, lecz gdy otworzył swoje oczy, nic nie widział. Prowadząc go więc za rękę, wprowadzili do Damaszku."
  tags: []
"Dz9,9":
  text: "I był tam trzy dni nie widząc; i nie jadł i nie pił."
  tags: []
"Dz9,10":
  text: "A był pewien uczeń w Damaszku o imieniu Ananiasz; i Pan powiedział do niego w widzeniu: Ananiaszu! A on odpowiedział: Oto ja, Panie!"
  tags: []
"Dz9,11":
  text: "A Pan powiedział do niego: Wstań i pójdź na ulicę, zwaną Prostą, i w domu Judy szukaj Tarseńczyka o imieniu Saul; oto bowiem się modli."
  tags: []
"Dz9,12":
  text: "I zobaczył Saul w widzeniu mężczyznę o imieniu Ananiasz, jak wszedł i włożył na niego rękę, aby znów widział."
  tags: []
"Dz9,13":
  text: "A Ananiasz odpowiedział: Panie! Słyszałem od wielu o tym człowieku, ile zła uczynił Twoim świętym w Jerozolimie;"
  tags: []
"Dz9,14":
  text: "I tutaj ma władzę od arcykapłanów, aby związać wszystkich, którzy wzywają Twojego imienia."
  tags: []
"Dz9,15":
  text: "Pan jednak powiedział do niego: Idź, ten bowiem człowiek jest moim wybranym naczyniem, aby zanieść moje imię przed pogan i królów, a także synów Izraela."
  tags: []
"Dz9,16":
  text: "Albowiem ja mu pokażę, ile on musi wycierpieć dla mojego imienia."
  tags: []
"Dz9,17":
  text: "A Ananiasz poszedł i wszedł do tego domu, a gdy włożył na niego ręce, powiedział: Saulu bracie! Pan mnie posłał – Jezus, który ukazał ci się w drodze, którą przybyłeś, abyś przejrzał i został napełniony Duchem Świętym."
  tags: []
"Dz9,18":
  text: "I natychmiast spadły z jego oczu jakby łuski, i zaraz przejrzał, a gdy wstał, został ochrzczony."
  tags: []
"Dz9,19":
  text: "A po przyjęciu pokarmu odzyskał siły. I Saul był z uczniami, którzy byli w Damaszku przez kilka dni."
  tags: []
"Dz9,20":
  text: "I zaraz w synagogach zaczął głosić Chrystusa, że On jest Synem Boga."
  tags: []
"Dz9,21":
  text: "I zdumiewali się wszyscy, którzy go słuchali, i mówili: Czy to nie jest ten, który niszczył w Jerozolimie tych, którzy wzywają tego imienia, i przyszedł tu po to, aby ich związać i przyprowadzić do arcykapłanów?"
  tags: []
"Dz9,22":
  text: "Saul natomiast coraz bardziej umacniał się i zdumiewał Żydów, mieszkających w Damaszku, dowodząc, że Ten jest Mesjaszem."
  tags: []
"Dz9,23":
  text: "A gdy upłynęło wiele dni, Żydzi naradzili się między sobą, aby go zabić."
  tags: []
"Dz9,24":
  text: "Lecz Saul dowiedział się o ich spisku. Strzegli też bram dniem i nocą, aby go zabić."
  tags: []
"Dz9,25":
  text: "Uczniowie więc zabrali go w nocy i opuścili wzdłuż muru, spuszczając w koszu."
  tags: []
"Dz9,26":
  text: "Po przybyciu do Jerozolimy, Saul próbował przyłączyć się do uczniów; ale wszyscy się go bali, nie wierząc, że jest uczniem."
  tags: []
"Dz9,27":
  text: "Barnaba jednak przygarnął go, przyprowadził do apostołów i opowiedział im, jak w drodze zobaczył Pana, i że On przemówił do niego, i jak w Damaszku śmiało przemawiał w imieniu Jezusa."
  tags: []
"Dz9,28":
  text: "I był z nimi, poruszając się swobodnie po Jerozolimie, i śmiało przemawiał w imieniu Pana Jezusa;"
  tags: []
"Dz9,29":
  text: "Rozmawiał też i dyskutował z hellenistami, a ci starali się go zabić."
  tags: []
"Dz9,30":
  text: "A gdy dowiedzieli się o tym bracia, odprowadzili go do Cezarei i wysłali go do Tarsu."
  tags: []
"Dz9,31":
  text: "A tak zbory w całej Judei i Galilei, i Samarii miały pokój, budując się i chodząc w bojaźni Pana, i dzięki zachęcie Ducha Świętego pomnażały się."
  tags: []
"Dz9,32":
  text: "I stało się, gdy Piotr obchodził wszystkich, że zszedł też do świętych, którzy mieszkali w Lyddzie."
  tags: []
"Dz9,33":
  text: "I znalazł tam pewnego człowieka o imieniu Eneasz, który od ośmiu lat leżał na posłaniu i był sparaliżowany."
  tags: []
"Dz9,34":
  text: "I Piotr powiedział do niego: Eneaszu! Uzdrawia cię Jezus Chrystus; wstań i pościel sobie. I zaraz wstał."
  tags: []
"Dz9,35":
  text: "I zobaczyli go wszyscy zamieszkujący Lyddę i Szaron, którzy też nawrócili się do Pana."
  tags: []
"Dz9,36":
  text: "A była w Joppie pewna uczennica, o imieniu Tabita, co w tłumaczeniu znaczy Dorkas; ta była pełna dobrych czynów i darów miłosierdzia, które czyniła."
  tags: []
"Dz9,37":
  text: "I stało się w tych właśnie dniach, że ona zasłabła i umarła; a gdy ją obmyto, położono w sali na piętrze."
  tags: []
"Dz9,38":
  text: "A że Lydda jest blisko Joppy, uczniowie słysząc, że jest w niej Piotr, posłali do niego dwóch mężów, prosząc, aby nie zwlekał z przyjściem do nich."
  tags: []
"Dz9,39":
  text: "Wstał więc Piotr i poszedł z nimi; a gdy przyszedł, wprowadzili go do sali na piętrze, i obstąpiły go wszystkie wdowy, płacząc i pokazując tuniki i płaszcze, które robiła Dorkas, dopóki była z nimi."
  tags: []
"Dz9,40":
  text: "A Piotr usunął wszystkich na zewnątrz, padł na kolana i pomodlił się, po czym zwrócił się do ciała i powiedział: Tabito, wstań! A ona otworzyła swoje oczy, a widząc Piotra, usiadła."
  tags: []
"Dz9,41":
  text: "A on podał jej rękę i podniósł ją, przywołując świętych i wdowy, przedstawił ją żywą."
  tags: []
"Dz9,42":
  text: "I stało się to znane w całej Joppie; i wielu uwierzyło w Pana."
  tags: []
"Dz9,43":
  text: "Przez wiele też dni pozostał on w Joppie u niejakiego Szymona, garbarza."
  tags: []
