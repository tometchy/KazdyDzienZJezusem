"Dz9,1": "A Saul, dysząc jeszcze groźbą i chęcią mordu wobec uczniów Pana, przyszedł do arcykapłana,"
"Dz9,2": "I prosił go o listy do Damaszku do synagog, aby, jeśli znajdzie tam mężczyzn i kobiety, zwolenników tej Drogi, przyprowadził ich związanych do Jerozolimy."
"Dz9,3": "I stało się, gdy był w drodze i zbliżał się do Damaszku, że nagle otoczyło go światło z nieba."
"Dz9,4": "A gdy padł na ziemię, usłyszał głos do niego mówiący: Saulu! Saulu! Czemu mnie prześladujesz?"
"Dz9,5": "A on powiedział: Kim jesteś, Panie? A Pan rzekł: Ja jestem Jezus, którego ty prześladujesz; trudno ci wierzgać przeciwko ościeniowi."
"Dz9,6": "A Saul drżący i wstrząśnięty, powiedział: Panie! Co chcesz bym uczynił? A Pan do niego: Wstań i wejdź do miasta, a powiedzą ci, co konieczne jest abyś uczynił."
"Dz9,7": "A mężczyźni towarzyszący mu w drodze, stanęli niezdolni do mówienia; głos bowiem słyszeli, ale nikogo nie widzieli."
"Dz9,8": "A Saul został podniesiony z ziemi, lecz gdy otworzył swoje oczy, nic nie widział. Prowadząc go więc za rękę, wprowadzili do Damaszku."
"Dz9,9": "I był tam trzy dni nie widząc; i nie jadł i nie pił."
"Dz9,10": "A był pewien uczeń w Damaszku o imieniu Ananiasz; i Pan powiedział do niego w widzeniu: Ananiaszu! A on odpowiedział: Oto ja, Panie!"
"Dz9,11": "A Pan powiedział do niego: Wstań i pójdź na ulicę, zwaną Prostą, i w domu Judy szukaj Tarseńczyka o imieniu Saul; oto bowiem się modli."
"Dz9,12": "I zobaczył Saul w widzeniu mężczyznę o imieniu Ananiasz, jak wszedł i włożył na niego rękę, aby znów widział."
"Dz9,13": "A Ananiasz odpowiedział: Panie! Słyszałem od wielu o tym człowieku, ile zła uczynił Twoim świętym w Jerozolimie;"
"Dz9,14": "I tutaj ma władzę od arcykapłanów, aby związać wszystkich, którzy wzywają Twojego imienia."
"Dz9,15": "Pan jednak powiedział do niego: Idź, ten bowiem człowiek jest moim wybranym naczyniem, aby zanieść moje imię przed pogan i królów, a także synów Izraela."
"Dz9,16": "Albowiem ja mu pokażę, ile on musi wycierpieć dla mojego imienia."
"Dz9,17": "A Ananiasz poszedł i wszedł do tego domu, a gdy włożył na niego ręce, powiedział: Saulu bracie! Pan mnie posłał – Jezus, który ukazał ci się w drodze, którą przybyłeś, abyś przejrzał i został napełniony Duchem Świętym."
"Dz9,18": "I natychmiast spadły z jego oczu jakby łuski, i zaraz przejrzał, a gdy wstał, został ochrzczony."
"Dz9,19": "A po przyjęciu pokarmu odzyskał siły. I Saul był z uczniami, którzy byli w Damaszku przez kilka dni."
"Dz9,20": "I zaraz w synagogach zaczął głosić Chrystusa, że On jest Synem Boga."
"Dz9,21": "I zdumiewali się wszyscy, którzy go słuchali, i mówili: Czy to nie jest ten, który niszczył w Jerozolimie tych, którzy wzywają tego imienia, i przyszedł tu po to, aby ich związać i przyprowadzić do arcykapłanów?"
"Dz9,22": "Saul natomiast coraz bardziej umacniał się i zdumiewał Żydów, mieszkających w Damaszku, dowodząc, że Ten jest Mesjaszem."
"Dz9,23": "A gdy upłynęło wiele dni, Żydzi naradzili się między sobą, aby go zabić."
"Dz9,24": "Lecz Saul dowiedział się o ich spisku. Strzegli też bram dniem i nocą, aby go zabić."
"Dz9,25": "Uczniowie więc zabrali go w nocy i opuścili wzdłuż muru, spuszczając w koszu."
"Dz9,26": "Po przybyciu do Jerozolimy, Saul próbował przyłączyć się do uczniów; ale wszyscy się go bali, nie wierząc, że jest uczniem."
"Dz9,27": "Barnaba jednak przygarnął go, przyprowadził do apostołów i opowiedział im, jak w drodze zobaczył Pana, i że On przemówił do niego, i jak w Damaszku śmiało przemawiał w imieniu Jezusa."
"Dz9,28": "I był z nimi, poruszając się swobodnie po Jerozolimie, i śmiało przemawiał w imieniu Pana Jezusa;"
"Dz9,29": "Rozmawiał też i dyskutował z hellenistami, a ci starali się go zabić."
"Dz9,30": "A gdy dowiedzieli się o tym bracia, odprowadzili go do Cezarei i wysłali go do Tarsu."
"Dz9,31": "A tak zbory w całej Judei i Galilei, i Samarii miały pokój, budując się i chodząc w bojaźni Pana, i dzięki zachęcie Ducha Świętego pomnażały się."
"Dz9,32": "I stało się, gdy Piotr obchodził wszystkich, że zszedł też do świętych, którzy mieszkali w Lyddzie."
"Dz9,33": "I znalazł tam pewnego człowieka o imieniu Eneasz, który od ośmiu lat leżał na posłaniu i był sparaliżowany."
"Dz9,34": "I Piotr powiedział do niego: Eneaszu! Uzdrawia cię Jezus Chrystus; wstań i pościel sobie. I zaraz wstał."
"Dz9,35": "I zobaczyli go wszyscy zamieszkujący Lyddę i Szaron, którzy też nawrócili się do Pana."
"Dz9,36": "A była w Joppie pewna uczennica, o imieniu Tabita, co w tłumaczeniu znaczy Dorkas; ta była pełna dobrych czynów i darów miłosierdzia, które czyniła."
"Dz9,37": "I stało się w tych właśnie dniach, że ona zasłabła i umarła; a gdy ją obmyto, położono w sali na piętrze."
"Dz9,38": "A że Lydda jest blisko Joppy, uczniowie słysząc, że jest w niej Piotr, posłali do niego dwóch mężów, prosząc, aby nie zwlekał z przyjściem do nich."
"Dz9,39": "Wstał więc Piotr i poszedł z nimi; a gdy przyszedł, wprowadzili go do sali na piętrze, i obstąpiły go wszystkie wdowy, płacząc i pokazując tuniki i płaszcze, które robiła Dorkas, dopóki była z nimi."
"Dz9,40": "A Piotr usunął wszystkich na zewnątrz, padł na kolana i pomodlił się, po czym zwrócił się do ciała i powiedział: Tabito, wstań! A ona otworzyła swoje oczy, a widząc Piotra, usiadła."
"Dz9,41": "A on podał jej rękę i podniósł ją, przywołując świętych i wdowy, przedstawił ją żywą."
"Dz9,42": "I stało się to znane w całej Joppie; i wielu uwierzyło w Pana."
"Dz9,43": "Przez wiele też dni pozostał on w Joppie u niejakiego Szymona, garbarza."
