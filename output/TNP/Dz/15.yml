"Dz15,1":
  text: "A z Judei przybyli jacyś ludzie i nauczali braci: Jeśli nie dacie się obrzezać według zwyczaju Mojżesza, nie możecie zostać zbawieni."
  tags: []
"Dz15,2":
  text: "Gdy więc powstał zatarg i niemały spór między Pawłem i Barnabą a tamtymi, wyznaczono, aby Paweł i Barnaba, i niektórzy inni poszli z nimi do apostołów i do starszych do Jerozolimy z powodu tego sporu."
  tags: []
"Dz15,3":
  text: "Ci więc, wyprawieni przez zbór, przechodzili przez Fenicję i przez Samarię, opowiadając szczegółowo o nawróceniu pogan, sprawiając tym wielką radość wszystkim braciom."
  tags: []
"Dz15,4":
  text: "A gdy przybyli do Jerozolimy, zostali przyjęci przez zbór i przez apostołów, i starszych, i opowiedzieli to, co Bóg przez nich uczynił."
  tags: []
"Dz15,5":
  text: "Lecz powstali niektórzy ze stronnictwa faryzeuszów, którzy uwierzyli, mówiąc: Trzeba ich obrzezywać, a także nakazać, aby zachowywali Prawo Mojżesza."
  tags: []
"Dz15,6":
  text: "Zgromadzili się więc apostołowie i starsi, aby rozpatrzyć tę sprawę."
  tags: []
"Dz15,7":
  text: "A gdy doszło do długiej dyskusji, powstał Piotr i powiedział do nich: Mężowie bracia! Wy wiecie, że od dawnych dni Bóg pośród nas dokonał wyboru, aby przez moje usta poganie usłyszeli słowa Ewangelii i uwierzyli."
  tags: []
"Dz15,8":
  text: "A Bóg, który zna serca, wydał im świadectwo, i dał im Ducha Świętego, tak jak i nam;"
  tags: []
"Dz15,9":
  text: "I nie uczynił żadnej różnicy między nami a nimi, gdy wiarą oczyścił ich serca."
  tags: []
"Dz15,10":
  text: "Teraz więc, dlaczego wystawiacie Boga na próbę, wkładając na kark uczniów jarzmo, którego ani nasi ojcowie, ani my nie mieliśmy siły unieść?"
  tags: []
"Dz15,11":
  text: "Ale wierzymy, że przez łaskę Pana Jezusa Chrystusa zostaliśmy zbawieni, i w ten sam sposób i oni."
  tags: []
"Dz15,12":
  text: "Wtedy umilkło całe to mnóstwo zgromadzonych i słuchali Barnaby i Pawła, opowiadających, jak wielkie znaki i cuda czynił Bóg przez nich między poganami."
  tags: []
"Dz15,13":
  text: "A po nich, gdy umilkli, odpowiedział Jakub, mówiąc: Mężowie bracia, posłuchajcie mnie!"
  tags: []
"Dz15,14":
  text: "Szymon opowiedział, jak najpierw Bóg zatroszczył się o to, aby wziąć z pogan lud dla swojego imienia."
  tags: []
"Dz15,15":
  text: "A z tym współbrzmią słowa Proroków, tak, jak jest napisane:"
  tags: []
"Dz15,16":
  text: "Potem przywrócę i odbuduję upadły przybytek Dawida, i to, co zniszczone odbuduję i znowu prosto go postawię,"
  tags: []
"Dz15,17":
  text: "Aby w ten sposób pozostali spośród ludzi szukali PANA i wszyscy poganie, wśród których wzywane jest moje imię nad nimi, mówi PAN, który to wszystko czyni."
  tags: []
"Dz15,18":
  text: "Znane są Bogu od wieków wszystkie Jego dzieła."
  tags: []
"Dz15,19":
  text: "Dlatego ja sądzę, że nie należy niepokoić tych, którzy nawracają się z pogan do Boga;"
  tags: []
"Dz15,20":
  text: "Ale powiadomić ich listem, aby wstrzymywali się od tego, co skażone przez bożki, od nierządu, od tego, co uduszone, i od krwi."
  tags: []
"Dz15,21":
  text: "Albowiem Mojżesz od dawnych pokoleń ma w każdym mieście tych, którzy go głoszą w synagogach, bo czyta się go w każdy szabat."
  tags: []
"Dz15,22":
  text: "Wtedy apostołowie i starsi razem z całym zborem uznali za słuszne, aby razem z Pawłem i z Barnabą posłać do Antiochii wybranych spośród siebie mężów, to jest Judę, którego zwano Barsabaszem i Sylasa, mężów przewodzących wśród braci,"
  tags: []
"Dz15,23":
  text: "Po napisaniu swoją ręką tego oto: Apostołowie i starsi, i bracia, braciom z pogan w Antiochii i w Syrii, i w Cylicji, przesyłają pozdrowienie;"
  tags: []
"Dz15,24":
  text: "Ponieważ usłyszeliśmy, że niektórzy, po wyjściu spośród nas, niepokoją was słowami i wprowadzają zamęt w wasze dusze, mówiąc, że musicie zostać obrzezani i zachowywać Prawo, czego im nie nakazaliśmy,"
  tags: []
"Dz15,25":
  text: "Uznaliśmy za słuszne będąc jednomyślni, posłać do was wybranych mężów, razem z naszymi umiłowanymi Barnabą i Pawłem,"
  tags: []
"Dz15,26":
  text: "Ludźmi, którzy oddają swoje dusze dla imienia Pana naszego, Jezusa Chrystusa."
  tags: []
"Dz15,27":
  text: "Dlatego posłaliśmy Judę i Sylasa, którzy wam powiedzą to samo ustnie."
  tags: []
"Dz15,28":
  text: "Albowiem uznaliśmy za słuszne, Duch Święty i my, aby nie nakładać na was żadnego większego ciężaru, oprócz tych rzeczy koniecznych:"
  tags: []
"Dz15,29":
  text: "Wstrzymywać się od tego, co ofiarowane bożkom i od krwi, i od tego, co uduszone, i od nierządu – trzymając samych siebie z daleka od tego, dobrze uczynicie. Bądźcie zdrowi."
  tags: []
"Dz15,30":
  text: "Więc ci, gdy już zostali odprawieni, zeszli do Antiochii i gdy zgromadzili wielu braci, oddali list."
  tags: []
"Dz15,31":
  text: "A gdy go przeczytali, radowali się z tej zachęty."
  tags: []
"Dz15,32":
  text: "A Juda i Sylas, którzy sami byli prorokami, licznymi słowami zachęcili i utwierdzili braci."
  tags: []
"Dz15,33":
  text: "A przebywając tam przez pewien czas, zostali odprawieni w pokoju przez braci do apostołów."
  tags: []
"Dz15,34":
  text: "Sylas jednak uznał za słuszne tam pozostać."
  tags: []
"Dz15,35":
  text: "Paweł natomiast i Barnaba przebywali w Antiochii, nauczając i głosząc dobrą nowinę – wraz z wieloma innymi – Słowo Pana."
  tags: []
"Dz15,36":
  text: "A po pewnym czasie powiedział Paweł do Barnaby: Wróćmy i przyjrzyjmy się, jak się mają nasi bracia w każdym mieście, w którym głosiliśmy Słowo Pana."
  tags: []
"Dz15,37":
  text: "A Barnaba postanowił zabrać ze sobą Jana, zwanego Markiem."
  tags: []
"Dz15,38":
  text: "Lecz Paweł uznał za właściwe nie brać ze sobą tego, który odstąpił od nich w Pamfilii i nie poszedł razem z nimi do tej pracy."
  tags: []
"Dz15,39":
  text: "Powstało ostre nieporozumienie, tak że oni zostali oddzieleni od siebie; Barnaba wziął ze sobą Marka i popłynął na Cypr,"
  tags: []
"Dz15,40":
  text: "Paweł natomiast wybrał Sylasa i wyszedł, powierzony łasce Bożej przez braci."
  tags: []
"Dz15,41":
  text: "I przechodził Syrię i Cylicję, utwierdzając zbory."
  tags: []
