"Dz15,1": "A z Judei przybyli jacyś ludzie i nauczali braci: Jeśli nie dacie się obrzezać według zwyczaju Mojżesza, nie możecie zostać zbawieni."
"Dz15,2": "Gdy więc powstał zatarg i niemały spór między Pawłem i Barnabą a tamtymi, wyznaczono, aby Paweł i Barnaba, i niektórzy inni poszli z nimi do apostołów i do starszych do Jerozolimy z powodu tego sporu."
"Dz15,3": "Ci więc, wyprawieni przez zbór, przechodzili przez Fenicję i przez Samarię, opowiadając szczegółowo o nawróceniu pogan, sprawiając tym wielką radość wszystkim braciom."
"Dz15,4": "A gdy przybyli do Jerozolimy, zostali przyjęci przez zbór i przez apostołów, i starszych, i opowiedzieli to, co Bóg przez nich uczynił."
"Dz15,5": "Lecz powstali niektórzy ze stronnictwa faryzeuszów, którzy uwierzyli, mówiąc: Trzeba ich obrzezywać, a także nakazać, aby zachowywali Prawo Mojżesza."
"Dz15,6": "Zgromadzili się więc apostołowie i starsi, aby rozpatrzyć tę sprawę."
"Dz15,7": "A gdy doszło do długiej dyskusji, powstał Piotr i powiedział do nich: Mężowie bracia! Wy wiecie, że od dawnych dni Bóg pośród nas dokonał wyboru, aby przez moje usta poganie usłyszeli słowa Ewangelii i uwierzyli."
"Dz15,8": "A Bóg, który zna serca, wydał im świadectwo, i dał im Ducha Świętego, tak jak i nam;"
"Dz15,9": "I nie uczynił żadnej różnicy między nami a nimi, gdy wiarą oczyścił ich serca."
"Dz15,10": "Teraz więc, dlaczego wystawiacie Boga na próbę, wkładając na kark uczniów jarzmo, którego ani nasi ojcowie, ani my nie mieliśmy siły unieść?"
"Dz15,11": "Ale wierzymy, że przez łaskę Pana Jezusa Chrystusa zostaliśmy zbawieni, i w ten sam sposób i oni."
"Dz15,12": "Wtedy umilkło całe to mnóstwo zgromadzonych i słuchali Barnaby i Pawła, opowiadających, jak wielkie znaki i cuda czynił Bóg przez nich między poganami."
"Dz15,13": "A po nich, gdy umilkli, odpowiedział Jakub, mówiąc: Mężowie bracia, posłuchajcie mnie!"
"Dz15,14": "Szymon opowiedział, jak najpierw Bóg zatroszczył się o to, aby wziąć z pogan lud dla swojego imienia."
"Dz15,15": "A z tym współbrzmią słowa Proroków, tak, jak jest napisane:"
"Dz15,16": "Potem przywrócę i odbuduję upadły przybytek Dawida, i to, co zniszczone odbuduję i znowu prosto go postawię,"
"Dz15,17": "Aby w ten sposób pozostali spośród ludzi szukali PANA i wszyscy poganie, wśród których wzywane jest moje imię nad nimi, mówi PAN, który to wszystko czyni."
"Dz15,18": "Znane są Bogu od wieków wszystkie Jego dzieła."
"Dz15,19": "Dlatego ja sądzę, że nie należy niepokoić tych, którzy nawracają się z pogan do Boga;"
"Dz15,20": "Ale powiadomić ich listem, aby wstrzymywali się od tego, co skażone przez bożki, od nierządu, od tego, co uduszone, i od krwi."
"Dz15,21": "Albowiem Mojżesz od dawnych pokoleń ma w każdym mieście tych, którzy go głoszą w synagogach, bo czyta się go w każdy szabat."
"Dz15,22": "Wtedy apostołowie i starsi razem z całym zborem uznali za słuszne, aby razem z Pawłem i z Barnabą posłać do Antiochii wybranych spośród siebie mężów, to jest Judę, którego zwano Barsabaszem i Sylasa, mężów przewodzących wśród braci,"
"Dz15,23": "Po napisaniu swoją ręką tego oto: Apostołowie i starsi, i bracia, braciom z pogan w Antiochii i w Syrii, i w Cylicji, przesyłają pozdrowienie;"
"Dz15,24": "Ponieważ usłyszeliśmy, że niektórzy, po wyjściu spośród nas, niepokoją was słowami i wprowadzają zamęt w wasze dusze, mówiąc, że musicie zostać obrzezani i zachowywać Prawo, czego im nie nakazaliśmy,"
"Dz15,25": "Uznaliśmy za słuszne będąc jednomyślni, posłać do was wybranych mężów, razem z naszymi umiłowanymi Barnabą i Pawłem,"
"Dz15,26": "Ludźmi, którzy oddają swoje dusze dla imienia Pana naszego, Jezusa Chrystusa."
"Dz15,27": "Dlatego posłaliśmy Judę i Sylasa, którzy wam powiedzą to samo ustnie."
"Dz15,28": "Albowiem uznaliśmy za słuszne, Duch Święty i my, aby nie nakładać na was żadnego większego ciężaru, oprócz tych rzeczy koniecznych:"
"Dz15,29": "Wstrzymywać się od tego, co ofiarowane bożkom i od krwi, i od tego, co uduszone, i od nierządu – trzymając samych siebie z daleka od tego, dobrze uczynicie. Bądźcie zdrowi."
"Dz15,30": "Więc ci, gdy już zostali odprawieni, zeszli do Antiochii i gdy zgromadzili wielu braci, oddali list."
"Dz15,31": "A gdy go przeczytali, radowali się z tej zachęty."
"Dz15,32": "A Juda i Sylas, którzy sami byli prorokami, licznymi słowami zachęcili i utwierdzili braci."
"Dz15,33": "A przebywając tam przez pewien czas, zostali odprawieni w pokoju przez braci do apostołów."
"Dz15,34": "Sylas jednak uznał za słuszne tam pozostać."
"Dz15,35": "Paweł natomiast i Barnaba przebywali w Antiochii, nauczając i głosząc dobrą nowinę – wraz z wieloma innymi – Słowo Pana."
"Dz15,36": "A po pewnym czasie powiedział Paweł do Barnaby: Wróćmy i przyjrzyjmy się, jak się mają nasi bracia w każdym mieście, w którym głosiliśmy Słowo Pana."
"Dz15,37": "A Barnaba postanowił zabrać ze sobą Jana, zwanego Markiem."
"Dz15,38": "Lecz Paweł uznał za właściwe nie brać ze sobą tego, który odstąpił od nich w Pamfilii i nie poszedł razem z nimi do tej pracy."
"Dz15,39": "Powstało ostre nieporozumienie, tak że oni zostali oddzieleni od siebie; Barnaba wziął ze sobą Marka i popłynął na Cypr,"
"Dz15,40": "Paweł natomiast wybrał Sylasa i wyszedł, powierzony łasce Bożej przez braci."
"Dz15,41": "I przechodził Syrię i Cylicję, utwierdzając zbory."
