"Dz23,1": "A Paweł, spojrzał uważnie na Sanhedryn i powiedział: Mężowie bracia! Ja aż do tego dnia z całkowicie dobrym sumieniem przeżyłem przed Bogiem."
"Dz23,2": "Ale Ananiasz, arcykapłan, rozkazał tym, którzy przy nim stali, uderzać go w twarz."
"Dz23,3": "Wtedy Paweł powiedział do niego: Bóg, zamierza cię uderzyć, ściano pobielana! I ty siedzisz, aby mnie sądzić według Prawa, a rozkazujesz mnie bić wbrew Prawu?"
"Dz23,4": "A ci, którzy tam stali, powiedzieli: Arcykapłanowi Boga złorzeczysz?"
"Dz23,5": "Paweł więc odpowiedział: Nie wiedziałem bracia, że jest to arcykapłan; bo napisano: Nie powiesz źle o przywódcy twojego ludu."
"Dz23,6": "A gdy poznał Paweł, że jedna część zgromadzenia jest z saduceuszów, a inna z faryzeuszów, zawołał przed Sanhedrynem: Mężowie bracia! Ja jestem faryzeuszem, synem faryzeusza; ja za nadzieję i wzbudzenie z martwych jestem sądzony."
"Dz23,7": "A gdy to powiedział, nastał spór między faryzeuszami i saduceuszami, i stało się rozdwojenie pośród tego mnóstwa."
"Dz23,8": "Albowiem saduceusze mówią, że nie ma powstania z martwych, ani anioła, ani ducha; a faryzeusze wyznają jedno i drugie."
"Dz23,9": "Wszczął się więc wielki krzyk. I powstali uczeni w Piśmie z części faryzeuszów, i ostro sprzeciwiali się, mówiąc: Nic złego nie znajdujemy w tym człowieku; a jeśli Duch albo anioł powiedział coś do niego, obyśmy nie walczyli przeciwko Bogu."
"Dz23,10": "A gdy spór stawał się coraz większy, dowódca obawiając się, aby Paweł nie został przez nich rozszarpany, kazał wojsku zejść, wyrwać go spośród nich i prowadzić do twierdzy."
"Dz23,11": "A następnej nocy stanął przy nim Pan i powiedział: Odwagi, Pawle! Jak bowiem zaświadczyłeś o mnie w Jerozolimie, tak też trzeba ci zaświadczyć i w Rzymie."
"Dz23,12": "A gdy nastał dzień, niektórzy Żydzi zebrali się i zobowiązując się pod karą klątwy, mówili, że nie będą ani jeść ani pić, dopóki nie zabiją Pawła."
"Dz23,13": "A było więcej niż czterdziestu tych, którzy uczynili to sprzysiężenie."
"Dz23,14": "Przyszli oni do arcykapłanów i do starszych, mówiąc: Związaliśmy się klątwą, że niczego nie skosztujemy, póki nie zabijemy Pawła."
"Dz23,15": "Teraz więc wy, razem z Sanhedrynem dajcie znać dowódcy, aby go jutro przyprowadził do was, jakbyście chcieli dokładniej rozpoznać jego sprawę, a my, zanim się on zbliży, gotowi jesteśmy go zabić."
"Dz23,16": "A gdy usłyszał o tej zasadzce syn siostry Pawła, przybył, wszedł do twierdzy i oznajmił o tym Pawłowi."
"Dz23,17": "Paweł więc, przywołał jednego z setników i powiedział: Zaprowadź tego młodzieńca do dowódcy, bo ma mu coś oznajmić."
"Dz23,18": "On więc wziął go ze sobą, zaprowadził do dowódcy i powiedział: Paweł więzień, przywołał mnie i prosił, abym przyprowadził do ciebie tego młodzieńca, który ma ci coś powiedzieć."
"Dz23,19": "A dowódca wziął go za rękę i odszedł na osobność, i wypytywał go: O czym masz mi oznajmić?"
"Dz23,20": "A on powiedział: Żydzi postanowili prosić cię, abyś jutro sprowadził Pawła przed Sanhedryn, niby to zamierzając dokładniej wypytywać się o niego;"
"Dz23,21": "Lecz ty nie daj się im przekonać, bo czeka na niego w zasadzce więcej niż czterdziestu mężów, którzy związali się klątwą, że ani nie będą jeść ani pić, dopóki go nie zabiją; i teraz są gotowi, czekając na twoje zezwolenie."
"Dz23,22": "Wtedy dowódca odprawił młodzieńca, nakazując mu: Nikomu nie ujawnij, że mi to oznajmiłeś."
"Dz23,23": "I wezwał dwóch pewnych setników, i powiedział: Przygotujcie dwustu żołnierzy w drogę aż do Cezarei i siedemdziesięciu jezdnych, i dwustu oszczepników od trzeciej godziny w nocy;"
"Dz23,24": "Kazał też podstawić juczne zwierzęta, aby posadzić na nich Pawła i bezpiecznie zaprowadzić go do namiestnika Feliksa."
"Dz23,25": "I napisał list w takiej formie:"
"Dz23,26": "Klaudiusz Lizjasz najdostojniejszemu namiestnikowi Feliksowi. Pozdrowienie."
"Dz23,27": "Tego człowieka, pojmanego przez Żydów, gdy już miał być przez nich zabity, stając przy nim razem z wojskiem, wyrwałem z ich rąk, gdy dowiedziałem się, że jest Rzymianinem."
"Dz23,28": "A chcąc poznać przyczynę, dla której go oskarżali, przyprowadziłem go przed ich Sanhedryn;"
"Dz23,29": "I odkryłem, że jest on oskarżany o rzeczy sporne, dotyczące ich Prawa, lecz nie ma żadnego zarzutu godnego śmierci lub więzienia."
"Dz23,30": "A gdy mi doniesiono o zasadzce, którą zamierzali uczynić Żydzi na tego człowieka, natychmiast posłałem go do ciebie, nakazując oskarżycielom, aby przed tobą powiedzieli, co mają przeciwko niemu. Bądź zdrów."
"Dz23,31": "Żołnierze więc zgodnie z tym, jak im rozkazano, wzięli Pawła i prowadzili go nocą do Antypatris."
"Dz23,32": "A nazajutrz, pozostawili jezdnych, aby z nim jechali i wrócili do twierdzy."
"Dz23,33": "Tamci, gdy przybyli do Cezarei, oddali list namiestnikowi i stawili przed nim Pawła."
"Dz23,34": "A namiestnik, gdy go przeczytał, spytał z jakiej jest prowincji, a gdy dowiedział się, że z Cylicji,"
"Dz23,35": "Powiedział: Będę cię słuchał, gdy przybędą twoi oskarżyciele. I rozkazał go strzec w pałacu Heroda."
