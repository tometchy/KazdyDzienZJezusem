"Dz23,1":
  text: "A Paweł, spojrzał uważnie na Sanhedryn i powiedział: Mężowie bracia! Ja aż do tego dnia z całkowicie dobrym sumieniem przeżyłem przed Bogiem."
  tags: []
"Dz23,2":
  text: "Ale Ananiasz, arcykapłan, rozkazał tym, którzy przy nim stali, uderzać go w twarz."
  tags: []
"Dz23,3":
  text: "Wtedy Paweł powiedział do niego: Bóg, zamierza cię uderzyć, ściano pobielana! I ty siedzisz, aby mnie sądzić według Prawa, a rozkazujesz mnie bić wbrew Prawu?"
  tags: []
"Dz23,4":
  text: "A ci, którzy tam stali, powiedzieli: Arcykapłanowi Boga złorzeczysz?"
  tags: []
"Dz23,5":
  text: "Paweł więc odpowiedział: Nie wiedziałem bracia, że jest to arcykapłan; bo napisano: Nie powiesz źle o przywódcy twojego ludu."
  tags: []
"Dz23,6":
  text: "A gdy poznał Paweł, że jedna część zgromadzenia jest z saduceuszów, a inna z faryzeuszów, zawołał przed Sanhedrynem: Mężowie bracia! Ja jestem faryzeuszem, synem faryzeusza; ja za nadzieję i wzbudzenie z martwych jestem sądzony."
  tags: []
"Dz23,7":
  text: "A gdy to powiedział, nastał spór między faryzeuszami i saduceuszami, i stało się rozdwojenie pośród tego mnóstwa."
  tags: []
"Dz23,8":
  text: "Albowiem saduceusze mówią, że nie ma powstania z martwych, ani anioła, ani ducha; a faryzeusze wyznają jedno i drugie."
  tags: []
"Dz23,9":
  text: "Wszczął się więc wielki krzyk. I powstali uczeni w Piśmie z części faryzeuszów, i ostro sprzeciwiali się, mówiąc: Nic złego nie znajdujemy w tym człowieku; a jeśli Duch albo anioł powiedział coś do niego, obyśmy nie walczyli przeciwko Bogu."
  tags: []
"Dz23,10":
  text: "A gdy spór stawał się coraz większy, dowódca obawiając się, aby Paweł nie został przez nich rozszarpany, kazał wojsku zejść, wyrwać go spośród nich i prowadzić do twierdzy."
  tags: []
"Dz23,11":
  text: "A następnej nocy stanął przy nim Pan i powiedział: Odwagi, Pawle! Jak bowiem zaświadczyłeś o mnie w Jerozolimie, tak też trzeba ci zaświadczyć i w Rzymie."
  tags: []
"Dz23,12":
  text: "A gdy nastał dzień, niektórzy Żydzi zebrali się i zobowiązując się pod karą klątwy, mówili, że nie będą ani jeść ani pić, dopóki nie zabiją Pawła."
  tags: []
"Dz23,13":
  text: "A było więcej niż czterdziestu tych, którzy uczynili to sprzysiężenie."
  tags: []
"Dz23,14":
  text: "Przyszli oni do arcykapłanów i do starszych, mówiąc: Związaliśmy się klątwą, że niczego nie skosztujemy, póki nie zabijemy Pawła."
  tags: []
"Dz23,15":
  text: "Teraz więc wy, razem z Sanhedrynem dajcie znać dowódcy, aby go jutro przyprowadził do was, jakbyście chcieli dokładniej rozpoznać jego sprawę, a my, zanim się on zbliży, gotowi jesteśmy go zabić."
  tags: []
"Dz23,16":
  text: "A gdy usłyszał o tej zasadzce syn siostry Pawła, przybył, wszedł do twierdzy i oznajmił o tym Pawłowi."
  tags: []
"Dz23,17":
  text: "Paweł więc, przywołał jednego z setników i powiedział: Zaprowadź tego młodzieńca do dowódcy, bo ma mu coś oznajmić."
  tags: []
"Dz23,18":
  text: "On więc wziął go ze sobą, zaprowadził do dowódcy i powiedział: Paweł więzień, przywołał mnie i prosił, abym przyprowadził do ciebie tego młodzieńca, który ma ci coś powiedzieć."
  tags: []
"Dz23,19":
  text: "A dowódca wziął go za rękę i odszedł na osobność, i wypytywał go: O czym masz mi oznajmić?"
  tags: []
"Dz23,20":
  text: "A on powiedział: Żydzi postanowili prosić cię, abyś jutro sprowadził Pawła przed Sanhedryn, niby to zamierzając dokładniej wypytywać się o niego;"
  tags: []
"Dz23,21":
  text: "Lecz ty nie daj się im przekonać, bo czeka na niego w zasadzce więcej niż czterdziestu mężów, którzy związali się klątwą, że ani nie będą jeść ani pić, dopóki go nie zabiją; i teraz są gotowi, czekając na twoje zezwolenie."
  tags: []
"Dz23,22":
  text: "Wtedy dowódca odprawił młodzieńca, nakazując mu: Nikomu nie ujawnij, że mi to oznajmiłeś."
  tags: []
"Dz23,23":
  text: "I wezwał dwóch pewnych setników, i powiedział: Przygotujcie dwustu żołnierzy w drogę aż do Cezarei i siedemdziesięciu jezdnych, i dwustu oszczepników od trzeciej godziny w nocy;"
  tags: []
"Dz23,24":
  text: "Kazał też podstawić juczne zwierzęta, aby posadzić na nich Pawła i bezpiecznie zaprowadzić go do namiestnika Feliksa."
  tags: []
"Dz23,25":
  text: "I napisał list w takiej formie:"
  tags: []
"Dz23,26":
  text: "Klaudiusz Lizjasz najdostojniejszemu namiestnikowi Feliksowi. Pozdrowienie."
  tags: []
"Dz23,27":
  text: "Tego człowieka, pojmanego przez Żydów, gdy już miał być przez nich zabity, stając przy nim razem z wojskiem, wyrwałem z ich rąk, gdy dowiedziałem się, że jest Rzymianinem."
  tags: []
"Dz23,28":
  text: "A chcąc poznać przyczynę, dla której go oskarżali, przyprowadziłem go przed ich Sanhedryn;"
  tags: []
"Dz23,29":
  text: "I odkryłem, że jest on oskarżany o rzeczy sporne, dotyczące ich Prawa, lecz nie ma żadnego zarzutu godnego śmierci lub więzienia."
  tags: []
"Dz23,30":
  text: "A gdy mi doniesiono o zasadzce, którą zamierzali uczynić Żydzi na tego człowieka, natychmiast posłałem go do ciebie, nakazując oskarżycielom, aby przed tobą powiedzieli, co mają przeciwko niemu. Bądź zdrów."
  tags: []
"Dz23,31":
  text: "Żołnierze więc zgodnie z tym, jak im rozkazano, wzięli Pawła i prowadzili go nocą do Antypatris."
  tags: []
"Dz23,32":
  text: "A nazajutrz, pozostawili jezdnych, aby z nim jechali i wrócili do twierdzy."
  tags: []
"Dz23,33":
  text: "Tamci, gdy przybyli do Cezarei, oddali list namiestnikowi i stawili przed nim Pawła."
  tags: []
"Dz23,34":
  text: "A namiestnik, gdy go przeczytał, spytał z jakiej jest prowincji, a gdy dowiedział się, że z Cylicji,"
  tags: []
"Dz23,35":
  text: "Powiedział: Będę cię słuchał, gdy przybędą twoi oskarżyciele. I rozkazał go strzec w pałacu Heroda."
  tags: []
