"Dz10,1":
  text: "A był w Cezarei pewien mężczyzna, o imieniu Korneliusz, setnik, z kohorty zwanej italską,"
  tags: []
"Dz10,2":
  text: "Pobożny i bojący się Boga wraz z całym swoim domem, i dający wiele darów miłosierdzia ludowi, i przez cały czas modlący się do Boga."
  tags: []
"Dz10,3":
  text: "Około dziewiątej godziny dnia, zobaczył wyraźnie w widzeniu anioła Boga, który przybył do niego i powiedział mu: Korneliuszu!"
  tags: []
"Dz10,4":
  text: "A on, wpatrując się w niego, ogarnięty lękiem powiedział: Cóż jest, Panie? I odpowiedział mu: Twoje modlitwy i dary miłosierdzia wstąpiły przed oblicze Boga ku przypomnieniu."
  tags: []
"Dz10,5":
  text: "A teraz poślij mężów do Joppy i wezwij Szymona, którego nazywają Piotrem."
  tags: []
"Dz10,6":
  text: "Gości on u niejakiego Szymona, garbarza, który ma dom nad morzem; on ci powie, co trzeba, abyś uczynił."
  tags: []
"Dz10,7":
  text: "A gdy odszedł anioł, który przemawiał do Korneliusza, ten przywołał dwóch ze swoich domowników i pobożnego żołnierza z tych, którzy przy nim nieustannie byli,"
  tags: []
"Dz10,8":
  text: "I gdy wyjaśnił im wszystko, posłał ich do Joppy."
  tags: []
"Dz10,9":
  text: "A nazajutrz, gdy byli w drodze i zbliżali się do miasta, wszedł Piotr na taras, około godziny szóstej, aby się modlić."
  tags: []
"Dz10,10":
  text: "A będąc bardzo głodnym, chciał coś zjeść; a gdy inni przygotowywali mu posiłek, przyszło na niego uniesienie."
  tags: []
"Dz10,11":
  text: "I ujrzał otwarte niebo i zstępujący na niego jakiś przedmiot, jakby wielkie płótno, za cztery rogi związane i spuszczane na ziemię;"
  tags: []
"Dz10,12":
  text: "W którym były wszystkie czworonożne zwierzęta ziemi, dzikie zwierzęta, płazy i ptaki nieba."
  tags: []
"Dz10,13":
  text: "I rozległ się głos do niego: Wstań, Piotrze! Zarzynaj i zjedz."
  tags: []
"Dz10,14":
  text: "A Piotr powiedział: Przenigdy, Panie! Bo nigdy nie jadłem nic skalanego albo nieczystego."
  tags: []
"Dz10,15":
  text: "I znów, po raz drugi głos dotarł do niego: Co Bóg oczyścił, ty nie miej za skalane."
  tags: []
"Dz10,16":
  text: "A to się stało trzykrotnie. I na powrót przedmiot został uniesiony do nieba."
  tags: []
"Dz10,17":
  text: "A gdy Piotr nie miał wewnętrznej pewności czym było to widzenie, które ujrzał, oto ludzie posłani przez Korneliusza, pytając o dom Szymona, stanęli przed bramą;"
  tags: []
"Dz10,18":
  text: "I wołając, zapytali: Czy Szymon, którego nazywają Piotrem, jest tutaj w gościnie?"
  tags: []
"Dz10,19":
  text: "A gdy Piotr nadal rozmyślał o tym widzeniu, Duch powiedział do niego: Oto szukają cię trzej mężczyźni,"
  tags: []
"Dz10,20":
  text: "Dlatego wstań, zejdź i idź z nimi, nie wahając się; dlatego, że ja ich posłałem."
  tags: []
"Dz10,21":
  text: "A Piotr zszedł do mężczyzn posłanych do niego przez Korneliusza i powiedział: Oto ja jestem tym, którego szukacie. Jaki jest powód, dla którego jesteście tu obecni?"
  tags: []
"Dz10,22":
  text: "A oni powiedzieli: Korneliusz, setnik, człowiek sprawiedliwy i bojący się Boga, mający dobre świadectwo także od całego narodu żydowskiego, otrzymał przez świętego anioła polecenie, aby cię wezwać do swojego domu i słuchać twoich słów."
  tags: []
"Dz10,23":
  text: "Wtedy zaprosił ich i ugościł. A nazajutrz Piotr wyszedł z nimi, i szli z nim niektórzy bracia z Joppy."
  tags: []
"Dz10,24":
  text: "I weszli następnego dnia do Cezarei; a Korneliusz oczekiwał na nich i zwołał swoich krewnych i bliskich przyjaciół."
  tags: []
"Dz10,25":
  text: "I gdy Piotr wchodził, Korneliusz wyszedł na jego spotkanie, przypadł do jego nóg i oddał mu pokłon."
  tags: []
"Dz10,26":
  text: "Ale Piotr podniósł go, mówiąc: Wstań, ja też jestem człowiekiem."
  tags: []
"Dz10,27":
  text: "A rozmawiając z nim, wszedł i zobaczył wielu zgromadzonych."
  tags: []
"Dz10,28":
  text: "I przemówił też do nich: Wy wiecie, jak sprzeczne z prawem jest dla człowieka będącego Żydem łączyć się lub przychodzić do cudzoziemca; lecz Bóg pokazał mi, abym żadnego człowieka nie nazywał skalanym lub nieczystym."
  tags: []
"Dz10,29":
  text: "Dlatego też bez sprzeciwu przyszedłem wezwany. Pytam więc: W jakiej sprawie mnie wezwaliście?"
  tags: []
"Dz10,30":
  text: "A Korneliusz powiedział: Od czterech dni aż do tej godziny pościłem, a gdy o dziewiątej godzinie modliłem się w swoim domu, oto stanął przede mną mężczyzna w lśniącej szacie,"
  tags: []
"Dz10,31":
  text: "I powiedział: Korneliuszu! Twoja modlitwa została wysłuchana, a twoje dary miłosierdzia zostały przypomniane przed obliczem Boga."
  tags: []
"Dz10,32":
  text: "Poślij więc do Joppy i wezwij Szymona, którego nazywają Piotrem; przebywa on w gościnie w domu Szymona garbarza, nad morzem, a gdy przyjdzie, będzie z tobą rozmawiał."
  tags: []
"Dz10,33":
  text: "Natychmiast więc posłałem do ciebie, a ty dobrze uczyniłeś, że przyszedłeś. Teraz więc wszyscy jesteśmy obecni przed obliczem Boga, abyśmy usłyszeli wszystko to, co zostało ci polecone przez Boga."
  tags: []
"Dz10,34":
  text: "A gdy Piotr otworzył usta, powiedział: Naprawdę pojmuję, że Bóg nie ma względu na osobę,"
  tags: []
"Dz10,35":
  text: "Lecz w każdym narodzie godnym przyjęcia przez Niego jest ten, kto się Go boi i czyni sprawiedliwość."
  tags: []
"Dz10,36":
  text: "Posłał słowo synom Izraela, głosząc dobrą nowinę o pokoju przez Jezusa Chrystusa. Ten jest Panem wszystkich."
  tags: []
"Dz10,37":
  text: "Wy wiecie, że słowo zaistniało po całej Judei, zaczynając od Galilei, po chrzcie, który głosił Jan;"
  tags: []
"Dz10,38":
  text: "O Jezusie z Nazaretu, jak Bóg namaścił Go Duchem Świętym i mocą, który chodził, czyniąc dobrze i uzdrawiając wszystkich ciemiężonych przez diabła; gdyż Bóg był z Nim."
  tags: []
"Dz10,39":
  text: "A my jesteśmy świadkami wszystkiego, co czynił w krainie Judejczyków i w Jerozolimie, Jego też zabili, wieszając na drzewie."
  tags: []
"Dz10,40":
  text: "Tego Bóg wzbudził trzeciego dnia i dał Mu stać się widzianym;"
  tags: []
"Dz10,41":
  text: "Nie całemu ludowi, ale świadkom wybranym uprzednio przez Boga, nam, którzy z Nim jedliśmy i piliśmy po Jego powstaniu z martwych."
  tags: []
"Dz10,42":
  text: "I nakazał nam, abyśmy głosili ludowi i świadczyli, że On jest ustanowionym przez Boga sędzią żywych i umarłych."
  tags: []
"Dz10,43":
  text: "O Nim świadczą wszyscy Prorocy, że każdy wierzący w Niego otrzyma odpuszczenie grzechów przez Jego imię."
  tags: []
"Dz10,44":
  text: "Gdy Piotr jeszcze mówił te słowa, Duch Święty zstąpił na wszystkich słuchających tych słów."
  tags: []
"Dz10,45":
  text: "I zdumieli się wierzący, pochodzący z obrzezania, którzy przybyli razem z Piotrem, że i na pogan został wylany dar Ducha Świętego."
  tags: []
"Dz10,46":
  text: "Słyszeli ich bowiem mówiących innymi językami i wywyższających Boga. Wtedy odpowiedział Piotr:"
  tags: []
"Dz10,47":
  text: "Czy ktoś może odmówić wody, aby nie zostali ochrzczeni ci, którzy przyjęli Ducha Świętego, tak jak i my?"
  tags: []
"Dz10,48":
  text: "I polecił ich ochrzcić w imieniu Pana. Wtedy prosili go, aby został u nich kilka dni."
  tags: []
