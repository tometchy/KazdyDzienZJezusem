"Dz10,1": "A był w Cezarei pewien mężczyzna, o imieniu Korneliusz, setnik, z kohorty zwanej italską,"
"Dz10,2": "Pobożny i bojący się Boga wraz z całym swoim domem, i dający wiele darów miłosierdzia ludowi, i przez cały czas modlący się do Boga."
"Dz10,3": "Około dziewiątej godziny dnia, zobaczył wyraźnie w widzeniu anioła Boga, który przybył do niego i powiedział mu: Korneliuszu!"
"Dz10,4": "A on, wpatrując się w niego, ogarnięty lękiem powiedział: Cóż jest, Panie? I odpowiedział mu: Twoje modlitwy i dary miłosierdzia wstąpiły przed oblicze Boga ku przypomnieniu."
"Dz10,5": "A teraz poślij mężów do Joppy i wezwij Szymona, którego nazywają Piotrem."
"Dz10,6": "Gości on u niejakiego Szymona, garbarza, który ma dom nad morzem; on ci powie, co trzeba, abyś uczynił."
"Dz10,7": "A gdy odszedł anioł, który przemawiał do Korneliusza, ten przywołał dwóch ze swoich domowników i pobożnego żołnierza z tych, którzy przy nim nieustannie byli,"
"Dz10,8": "I gdy wyjaśnił im wszystko, posłał ich do Joppy."
"Dz10,9": "A nazajutrz, gdy byli w drodze i zbliżali się do miasta, wszedł Piotr na taras, około godziny szóstej, aby się modlić."
"Dz10,10": "A będąc bardzo głodnym, chciał coś zjeść; a gdy inni przygotowywali mu posiłek, przyszło na niego uniesienie."
"Dz10,11": "I ujrzał otwarte niebo i zstępujący na niego jakiś przedmiot, jakby wielkie płótno, za cztery rogi związane i spuszczane na ziemię;"
"Dz10,12": "W którym były wszystkie czworonożne zwierzęta ziemi, dzikie zwierzęta, płazy i ptaki nieba."
"Dz10,13": "I rozległ się głos do niego: Wstań, Piotrze! Zarzynaj i zjedz."
"Dz10,14": "A Piotr powiedział: Przenigdy, Panie! Bo nigdy nie jadłem nic skalanego albo nieczystego."
"Dz10,15": "I znów, po raz drugi głos dotarł do niego: Co Bóg oczyścił, ty nie miej za skalane."
"Dz10,16": "A to się stało trzykrotnie. I na powrót przedmiot został uniesiony do nieba."
"Dz10,17": "A gdy Piotr nie miał wewnętrznej pewności czym było to widzenie, które ujrzał, oto ludzie posłani przez Korneliusza, pytając o dom Szymona, stanęli przed bramą;"
"Dz10,18": "I wołając, zapytali: Czy Szymon, którego nazywają Piotrem, jest tutaj w gościnie?"
"Dz10,19": "A gdy Piotr nadal rozmyślał o tym widzeniu, Duch powiedział do niego: Oto szukają cię trzej mężczyźni,"
"Dz10,20": "Dlatego wstań, zejdź i idź z nimi, nie wahając się; dlatego, że ja ich posłałem."
"Dz10,21": "A Piotr zszedł do mężczyzn posłanych do niego przez Korneliusza i powiedział: Oto ja jestem tym, którego szukacie. Jaki jest powód, dla którego jesteście tu obecni?"
"Dz10,22": "A oni powiedzieli: Korneliusz, setnik, człowiek sprawiedliwy i bojący się Boga, mający dobre świadectwo także od całego narodu żydowskiego, otrzymał przez świętego anioła polecenie, aby cię wezwać do swojego domu i słuchać twoich słów."
"Dz10,23": "Wtedy zaprosił ich i ugościł. A nazajutrz Piotr wyszedł z nimi, i szli z nim niektórzy bracia z Joppy."
"Dz10,24": "I weszli następnego dnia do Cezarei; a Korneliusz oczekiwał na nich i zwołał swoich krewnych i bliskich przyjaciół."
"Dz10,25": "I gdy Piotr wchodził, Korneliusz wyszedł na jego spotkanie, przypadł do jego nóg i oddał mu pokłon."
"Dz10,26": "Ale Piotr podniósł go, mówiąc: Wstań, ja też jestem człowiekiem."
"Dz10,27": "A rozmawiając z nim, wszedł i zobaczył wielu zgromadzonych."
"Dz10,28": "I przemówił też do nich: Wy wiecie, jak sprzeczne z prawem jest dla człowieka będącego Żydem łączyć się lub przychodzić do cudzoziemca; lecz Bóg pokazał mi, abym żadnego człowieka nie nazywał skalanym lub nieczystym."
"Dz10,29": "Dlatego też bez sprzeciwu przyszedłem wezwany. Pytam więc: W jakiej sprawie mnie wezwaliście?"
"Dz10,30": "A Korneliusz powiedział: Od czterech dni aż do tej godziny pościłem, a gdy o dziewiątej godzinie modliłem się w swoim domu, oto stanął przede mną mężczyzna w lśniącej szacie,"
"Dz10,31": "I powiedział: Korneliuszu! Twoja modlitwa została wysłuchana, a twoje dary miłosierdzia zostały przypomniane przed obliczem Boga."
"Dz10,32": "Poślij więc do Joppy i wezwij Szymona, którego nazywają Piotrem; przebywa on w gościnie w domu Szymona garbarza, nad morzem, a gdy przyjdzie, będzie z tobą rozmawiał."
"Dz10,33": "Natychmiast więc posłałem do ciebie, a ty dobrze uczyniłeś, że przyszedłeś. Teraz więc wszyscy jesteśmy obecni przed obliczem Boga, abyśmy usłyszeli wszystko to, co zostało ci polecone przez Boga."
"Dz10,34": "A gdy Piotr otworzył usta, powiedział: Naprawdę pojmuję, że Bóg nie ma względu na osobę,"
"Dz10,35": "Lecz w każdym narodzie godnym przyjęcia przez Niego jest ten, kto się Go boi i czyni sprawiedliwość."
"Dz10,36": "Posłał słowo synom Izraela, głosząc dobrą nowinę o pokoju przez Jezusa Chrystusa. Ten jest Panem wszystkich."
"Dz10,37": "Wy wiecie, że słowo zaistniało po całej Judei, zaczynając od Galilei, po chrzcie, który głosił Jan;"
"Dz10,38": "O Jezusie z Nazaretu, jak Bóg namaścił Go Duchem Świętym i mocą, który chodził, czyniąc dobrze i uzdrawiając wszystkich ciemiężonych przez diabła; gdyż Bóg był z Nim."
"Dz10,39": "A my jesteśmy świadkami wszystkiego, co czynił w krainie Judejczyków i w Jerozolimie, Jego też zabili, wieszając na drzewie."
"Dz10,40": "Tego Bóg wzbudził trzeciego dnia i dał Mu stać się widzianym;"
"Dz10,41": "Nie całemu ludowi, ale świadkom wybranym uprzednio przez Boga, nam, którzy z Nim jedliśmy i piliśmy po Jego powstaniu z martwych."
"Dz10,42": "I nakazał nam, abyśmy głosili ludowi i świadczyli, że On jest ustanowionym przez Boga sędzią żywych i umarłych."
"Dz10,43": "O Nim świadczą wszyscy Prorocy, że każdy wierzący w Niego otrzyma odpuszczenie grzechów przez Jego imię."
"Dz10,44": "Gdy Piotr jeszcze mówił te słowa, Duch Święty zstąpił na wszystkich słuchających tych słów."
"Dz10,45": "I zdumieli się wierzący, pochodzący z obrzezania, którzy przybyli razem z Piotrem, że i na pogan został wylany dar Ducha Świętego."
"Dz10,46": "Słyszeli ich bowiem mówiących innymi językami i wywyższających Boga. Wtedy odpowiedział Piotr:"
"Dz10,47": "Czy ktoś może odmówić wody, aby nie zostali ochrzczeni ci, którzy przyjęli Ducha Świętego, tak jak i my?"
"Dz10,48": "I polecił ich ochrzcić w imieniu Pana. Wtedy prosili go, aby został u nich kilka dni."
