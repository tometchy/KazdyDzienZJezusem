"Dz7,1": "Powiedział wtedy arcykapłan: Czy zatem tak się te rzeczy mają?"
"Dz7,2": "A on powiedział: Mężowie bracia i ojcowie, posłuchajcie! Bóg chwały ukazał się naszemu ojcu Abrahamowi, gdy był w Mezopotamii, zanim zamieszkał on w Haranie,"
"Dz7,3": "I powiedział do niego: Wyjdź ze swojej ziemi i od swojej rodziny, i idź do ziemi, którą ci wskażę."
"Dz7,4": "Wtedy wyszedł z ziemi Chaldejczyków, i mieszkał w Haranie, a stamtąd, po śmierci swego ojca, Bóg przesiedlił go do tej ziemi, w której wy teraz mieszkacie,"
"Dz7,5": "I nie dał mu w niej dziedzictwa nawet na szerokość stopy, a obiecał dać mu ją w posiadanie i jego potomkowi po nim, gdy jeszcze nie miał dziecka."
"Dz7,6": "Bóg jednak powiedział tak, że jego potomstwo będzie przychodniami w obcej ziemi i uczynią je niewolnikami, i będą krzywdzić przez czterysta lat."
"Dz7,7": "A ten naród, którego będą niewolnikami, Ja będę sądzić, powiedział Bóg; a potem wyjdą i będą mi służyć na tym miejscu."
"Dz7,8": "I dał mu przymierze obrzezania; i tak spłodził on Izaaka, i obrzezał go ósmego dnia, a Izaak Jakuba, a Jakub dwunastu patriarchów."
"Dz7,9": "A patriarchowie, zazdroszcząc Józefowi, sprzedali go do Egiptu; ale Bóg był z nim."
"Dz7,10": "I wyrwał go ze wszystkich jego ucisków, i dał mu łaskę i mądrość przed faraonem, królem Egiptu, i ustanowił go przełożonym nad Egiptem i nad całym jego domem."
"Dz7,11": "Następnie przyszedł głód na całą ziemię egipską i w Kanaanie, i wielki ucisk, a ojcowie nasi nie znajdowali żywności."
"Dz7,12": "I gdy usłyszał Jakub, że w Egipcie było zboże, posłał tam naszych ojców po raz pierwszy."
"Dz7,13": "A za drugim razem Józef dał się poznać swoim braciom, i ujawniono faraonowi ród Józefa."
"Dz7,14": "A Józef posłał i wezwał do siebie swojego ojca Jakuba i całą swoją rodzinę liczącą siedemdziesiąt pięć dusz."
"Dz7,15": "Wówczas zstąpił Jakub do Egiptu, gdzie zakończył życie on i nasi ojcowie."
"Dz7,16": "I przeniesiono ich do Sychem, i złożono w grobowcu, który kupił Abraham za cenę srebra od synów Hemora, ojca Sychema."
"Dz7,17": "A gdy zbliżał się czas wypełnienia obietnicy, którą Bóg przysiągł spełnić Abrahamowi, rozrósł się lud i rozmnożył w Egipcie,"
"Dz7,18": "Aż do czasu, gdy nastał inny król, który nie znał Józefa."
"Dz7,19": "Ten podstępnie obchodził się z naszym rodem, wyrządził zło naszym ojcom, sprawił on, że porzucali swoje niemowlęta, aby ich nie zachować przy życiu."
"Dz7,20": "W tym czasie został zrodzony Mojżesz, a był miły Bogu i był on przez trzy miesiące karmiony w domu jego ojca."
"Dz7,21": "A gdy został porzucony, wzięła go córka faraona i wychowała go sobie za syna."
"Dz7,22": "I został wykształcony Mojżesz we wszelkiej mądrości Egipcjan, a był mocny w słowach i w czynach."
"Dz7,23": "A gdy osiągnął pełnię lat czterdziestu, wstąpiło mu na serce, aby odwiedzić swoich braci, synów Izraela."
"Dz7,24": "I gdy zobaczył kogoś krzywdzonego, stanął w jego obronie, i pomścił dręczonego, uderzając śmiertelnie Egipcjanina."
"Dz7,25": "Sądził bowiem, że jego bracia zrozumieją, że Bóg przez jego rękę daje im wybawienie; lecz oni nie zrozumieli."
"Dz7,26": "A następnego dnia zjawił się przy nich, gdy właśnie walczyli ze sobą, i namawiał ich do pokoju, mówiąc: Mężowie! Jesteście braćmi, dlaczego się nawzajem krzywdzicie?"
"Dz7,27": "Lecz ten, który krzywdził bliźniego, odepchnął go, mówiąc: Kto cię ustanowił przywódcą i sędzią nad nami?"
"Dz7,28": "Czy ty chcesz mnie zabić, w ten sam sposób, jak wczoraj zabiłeś Egipcjanina?"
"Dz7,29": "I uciekł Mojżesz z powodu tych słów, i stał się przychodniem w ziemi madiańskiej, gdzie spłodził dwóch synów."
"Dz7,30": "A gdy się wypełniło czterdzieści lat, ukazał mu się na pustyni góry Synaj anioł PANA w płomieniu płonącego krzewu."
"Dz7,31": "A gdy Mojżesz to ujrzał, zdziwił się temu widzeniu; a gdy przystąpił, aby się przypatrzeć, rozległ się głos PANA, skierowany do niego:"
"Dz7,32": "Ja jestem Bóg twoich ojców, Bóg Abrahama i Bóg Izaaka, i Bóg Jakuba. I zaczął drżeć Mojżesz, i nie śmiał się przyjrzeć."
"Dz7,33": "I PAN powiedział do niego: Rozwiąż rzemienie sandała ze swoich stóp, bo miejsce na którym stoisz, jest ziemią świętą."
"Dz7,34": "Wejrzałem i zobaczyłem utrapienie mojego ludu, który jest w Egipcie, i słyszałem ich wzdychanie i zstąpiłem, aby ich wyzwolić; dlatego teraz chodź, poślę cię do Egiptu."
"Dz7,35": "Tego Mojżesza, którego wyparli się, mówiąc: Kto ustanowił cię przywódcą i sędzią?! Tego Bóg jako przywódcę i odkupiciela posłał przez rękę anioła, który ukazał mu się w krzaku."
"Dz7,36": "Ten ich wyprowadził, gdy uczynił cuda i znaki w ziemi egipskiej i na Morzu Czerwonym, i na pustyni, przez czterdzieści lat."
"Dz7,37": "To jest ten Mojżesz, który powiedział synom Izraela: Proroka jak mnie wzbudzi wam PAN, Bóg wasz, spośród waszych braci; jego będziecie słuchać."
"Dz7,38": "On jest tym, który stał w zgromadzeniu na pustyni między aniołem, mówiącym do niego na górze Synaj, a naszymi ojcami, który przyjął słowa żywe, aby nam je dać,"
"Dz7,39": "Jemu nie chcieli być posłuszni nasi ojcowie; ale go odepchnęli i zawrócili swoimi sercami w stronę Egiptu,"
"Dz7,40": "Gdy powiedzieli do Aarona: Uczyń nam bogów, którzy będą szli przed nami, bo z tym Mojżeszem, który nas wyprowadził z ziemi egipskiej, nie wiemy, co się stało."
"Dz7,41": "I zrobili w tych dniach cielca, i przynosili ofiarę bożkowi, i radowali się z dzieł swoich rąk."
"Dz7,42": "Zatem Bóg odwrócił się i wydał ich, aby służyli zastępom nieba, tak jak jest napisane w zwoju Proroków: Czy to Mnie przynosiliście zarżnięte ofiary i dary przez czterdzieści lat na pustyni, o domu Izraela?"
"Dz7,43": "I nosiliście namiot Molocha i gwiazdę waszego boga Remfana, figury, które sobie uczyniliście, aby im oddawać pokłon; więc przesiedlę was poza Babilon."
"Dz7,44": "Nasi ojcowie mieli Namiot Świadectwa na pustyni, tak jak zarządził Ten, który powiedział Mojżeszowi, aby go uczynił według wzoru, który zobaczył."
"Dz7,45": "I nasi ojcowie przejęli go i wnieśli z Jozuem do posiadłości pogan, których Bóg wygnał sprzed oblicza naszych ojców, aż do dni Dawida,"
"Dz7,46": "Który znalazł łaskę przed obliczem Boga i prosił, aby znalazł miejsce na przybytek Bogu Jakuba."
"Dz7,47": "Jednak to Salomon zbudował Mu dom."
"Dz7,48": "Ale Najwyższy nie mieszka w świątyniach uczynionych ręką, jak mówi prorok:"
"Dz7,49": "Niebo jest moim tronem, a ziemia podnóżkiem moich stóp. Jaki zbudujecie mi dom, mówi PAN, albo jakie jest miejsce mojego odpocznienia?"
"Dz7,50": "Czyż moja ręka nie uczyniła tego wszystkiego?"
"Dz7,51": "Ludzie twardego karku, o nieobrzezanym sercu i uszach! Wy zawsze opieracie się Duchowi Świętemu, jak ojcowie wasi, tak i wy."
"Dz7,52": "Którego z proroków nie prześladowali wasi ojcowie? I pozabijali tych, którzy zapowiedzieli przyjście Sprawiedliwego, którego wy teraz staliście się zdrajcami i mordercami,"
"Dz7,53": "Wy, którzy otrzymaliście Prawo z nakazów aniołów i nie strzegliście go!"
"Dz7,54": "A oni, słuchając tego, byli w swoich sercach wzburzeni ze złości i zgrzytali na niego zębami."
"Dz7,55": "A on, będąc pełen Ducha Świętego, ze wzrokiem skierowanym w niebo, zobaczył chwałę Bożą i Jezusa stojącego po prawicy Boga,"
"Dz7,56": "I powiedział: Oto widzę otwarte niebiosa i Syna Człowieczego stojącego po prawej stronie Boga."
"Dz7,57": "A oni krzyknęli potężnym głosem, zatkali swoje uszy i rzucili się jednomyślnie na niego."
"Dz7,58": "A gdy go wypchnęli na zewnątrz miasta, kamienowali; a świadkowie złożyli swoje szaty u stóp młodzieńca, zwanego Saulem."
"Dz7,59": "I kamienowali Szczepana, który wzywał Pana, mówiąc: Panie Jezu! Przyjmij mojego ducha!"
"Dz7,60": "A gdy padał na kolana, zawołał potężnym głosem: Panie! Nie poczytaj im tego za grzech! I gdy to powiedział, zasnął."
