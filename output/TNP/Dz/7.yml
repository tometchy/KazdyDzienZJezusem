"Dz7,1":
  text: "Powiedział wtedy arcykapłan: Czy zatem tak się te rzeczy mają?"
  tags: []
"Dz7,2":
  text: "A on powiedział: Mężowie bracia i ojcowie, posłuchajcie! Bóg chwały ukazał się naszemu ojcu Abrahamowi, gdy był w Mezopotamii, zanim zamieszkał on w Haranie,"
  tags: []
"Dz7,3":
  text: "I powiedział do niego: Wyjdź ze swojej ziemi i od swojej rodziny, i idź do ziemi, którą ci wskażę."
  tags: []
"Dz7,4":
  text: "Wtedy wyszedł z ziemi Chaldejczyków, i mieszkał w Haranie, a stamtąd, po śmierci swego ojca, Bóg przesiedlił go do tej ziemi, w której wy teraz mieszkacie,"
  tags: []
"Dz7,5":
  text: "I nie dał mu w niej dziedzictwa nawet na szerokość stopy, a obiecał dać mu ją w posiadanie i jego potomkowi po nim, gdy jeszcze nie miał dziecka."
  tags: []
"Dz7,6":
  text: "Bóg jednak powiedział tak, że jego potomstwo będzie przychodniami w obcej ziemi i uczynią je niewolnikami, i będą krzywdzić przez czterysta lat."
  tags: []
"Dz7,7":
  text: "A ten naród, którego będą niewolnikami, Ja będę sądzić, powiedział Bóg; a potem wyjdą i będą mi służyć na tym miejscu."
  tags: []
"Dz7,8":
  text: "I dał mu przymierze obrzezania; i tak spłodził on Izaaka, i obrzezał go ósmego dnia, a Izaak Jakuba, a Jakub dwunastu patriarchów."
  tags: []
"Dz7,9":
  text: "A patriarchowie, zazdroszcząc Józefowi, sprzedali go do Egiptu; ale Bóg był z nim."
  tags: []
"Dz7,10":
  text: "I wyrwał go ze wszystkich jego ucisków, i dał mu łaskę i mądrość przed faraonem, królem Egiptu, i ustanowił go przełożonym nad Egiptem i nad całym jego domem."
  tags: []
"Dz7,11":
  text: "Następnie przyszedł głód na całą ziemię egipską i w Kanaanie, i wielki ucisk, a ojcowie nasi nie znajdowali żywności."
  tags: []
"Dz7,12":
  text: "I gdy usłyszał Jakub, że w Egipcie było zboże, posłał tam naszych ojców po raz pierwszy."
  tags: []
"Dz7,13":
  text: "A za drugim razem Józef dał się poznać swoim braciom, i ujawniono faraonowi ród Józefa."
  tags: []
"Dz7,14":
  text: "A Józef posłał i wezwał do siebie swojego ojca Jakuba i całą swoją rodzinę liczącą siedemdziesiąt pięć dusz."
  tags: []
"Dz7,15":
  text: "Wówczas zstąpił Jakub do Egiptu, gdzie zakończył życie on i nasi ojcowie."
  tags: []
"Dz7,16":
  text: "I przeniesiono ich do Sychem, i złożono w grobowcu, który kupił Abraham za cenę srebra od synów Hemora, ojca Sychema."
  tags: []
"Dz7,17":
  text: "A gdy zbliżał się czas wypełnienia obietnicy, którą Bóg przysiągł spełnić Abrahamowi, rozrósł się lud i rozmnożył w Egipcie,"
  tags: []
"Dz7,18":
  text: "Aż do czasu, gdy nastał inny król, który nie znał Józefa."
  tags: []
"Dz7,19":
  text: "Ten podstępnie obchodził się z naszym rodem, wyrządził zło naszym ojcom, sprawił on, że porzucali swoje niemowlęta, aby ich nie zachować przy życiu."
  tags: []
"Dz7,20":
  text: "W tym czasie został zrodzony Mojżesz, a był miły Bogu i był on przez trzy miesiące karmiony w domu jego ojca."
  tags: []
"Dz7,21":
  text: "A gdy został porzucony, wzięła go córka faraona i wychowała go sobie za syna."
  tags: []
"Dz7,22":
  text: "I został wykształcony Mojżesz we wszelkiej mądrości Egipcjan, a był mocny w słowach i w czynach."
  tags: []
"Dz7,23":
  text: "A gdy osiągnął pełnię lat czterdziestu, wstąpiło mu na serce, aby odwiedzić swoich braci, synów Izraela."
  tags: []
"Dz7,24":
  text: "I gdy zobaczył kogoś krzywdzonego, stanął w jego obronie, i pomścił dręczonego, uderzając śmiertelnie Egipcjanina."
  tags: []
"Dz7,25":
  text: "Sądził bowiem, że jego bracia zrozumieją, że Bóg przez jego rękę daje im wybawienie; lecz oni nie zrozumieli."
  tags: []
"Dz7,26":
  text: "A następnego dnia zjawił się przy nich, gdy właśnie walczyli ze sobą, i namawiał ich do pokoju, mówiąc: Mężowie! Jesteście braćmi, dlaczego się nawzajem krzywdzicie?"
  tags: []
"Dz7,27":
  text: "Lecz ten, który krzywdził bliźniego, odepchnął go, mówiąc: Kto cię ustanowił przywódcą i sędzią nad nami?"
  tags: []
"Dz7,28":
  text: "Czy ty chcesz mnie zabić, w ten sam sposób, jak wczoraj zabiłeś Egipcjanina?"
  tags: []
"Dz7,29":
  text: "I uciekł Mojżesz z powodu tych słów, i stał się przychodniem w ziemi madiańskiej, gdzie spłodził dwóch synów."
  tags: []
"Dz7,30":
  text: "A gdy się wypełniło czterdzieści lat, ukazał mu się na pustyni góry Synaj anioł PANA w płomieniu płonącego krzewu."
  tags: []
"Dz7,31":
  text: "A gdy Mojżesz to ujrzał, zdziwił się temu widzeniu; a gdy przystąpił, aby się przypatrzeć, rozległ się głos PANA, skierowany do niego:"
  tags: []
"Dz7,32":
  text: "Ja jestem Bóg twoich ojców, Bóg Abrahama i Bóg Izaaka, i Bóg Jakuba. I zaczął drżeć Mojżesz, i nie śmiał się przyjrzeć."
  tags: []
"Dz7,33":
  text: "I PAN powiedział do niego: Rozwiąż rzemienie sandała ze swoich stóp, bo miejsce na którym stoisz, jest ziemią świętą."
  tags: []
"Dz7,34":
  text: "Wejrzałem i zobaczyłem utrapienie mojego ludu, który jest w Egipcie, i słyszałem ich wzdychanie i zstąpiłem, aby ich wyzwolić; dlatego teraz chodź, poślę cię do Egiptu."
  tags: []
"Dz7,35":
  text: "Tego Mojżesza, którego wyparli się, mówiąc: Kto ustanowił cię przywódcą i sędzią?! Tego Bóg jako przywódcę i odkupiciela posłał przez rękę anioła, który ukazał mu się w krzaku."
  tags: []
"Dz7,36":
  text: "Ten ich wyprowadził, gdy uczynił cuda i znaki w ziemi egipskiej i na Morzu Czerwonym, i na pustyni, przez czterdzieści lat."
  tags: []
"Dz7,37":
  text: "To jest ten Mojżesz, który powiedział synom Izraela: Proroka jak mnie wzbudzi wam PAN, Bóg wasz, spośród waszych braci; jego będziecie słuchać."
  tags: []
"Dz7,38":
  text: "On jest tym, który stał w zgromadzeniu na pustyni między aniołem, mówiącym do niego na górze Synaj, a naszymi ojcami, który przyjął słowa żywe, aby nam je dać,"
  tags: []
"Dz7,39":
  text: "Jemu nie chcieli być posłuszni nasi ojcowie; ale go odepchnęli i zawrócili swoimi sercami w stronę Egiptu,"
  tags: []
"Dz7,40":
  text: "Gdy powiedzieli do Aarona: Uczyń nam bogów, którzy będą szli przed nami, bo z tym Mojżeszem, który nas wyprowadził z ziemi egipskiej, nie wiemy, co się stało."
  tags: []
"Dz7,41":
  text: "I zrobili w tych dniach cielca, i przynosili ofiarę bożkowi, i radowali się z dzieł swoich rąk."
  tags: []
"Dz7,42":
  text: "Zatem Bóg odwrócił się i wydał ich, aby służyli zastępom nieba, tak jak jest napisane w zwoju Proroków: Czy to Mnie przynosiliście zarżnięte ofiary i dary przez czterdzieści lat na pustyni, o domu Izraela?"
  tags: []
"Dz7,43":
  text: "I nosiliście namiot Molocha i gwiazdę waszego boga Remfana, figury, które sobie uczyniliście, aby im oddawać pokłon; więc przesiedlę was poza Babilon."
  tags: []
"Dz7,44":
  text: "Nasi ojcowie mieli Namiot Świadectwa na pustyni, tak jak zarządził Ten, który powiedział Mojżeszowi, aby go uczynił według wzoru, który zobaczył."
  tags: []
"Dz7,45":
  text: "I nasi ojcowie przejęli go i wnieśli z Jozuem do posiadłości pogan, których Bóg wygnał sprzed oblicza naszych ojców, aż do dni Dawida,"
  tags: []
"Dz7,46":
  text: "Który znalazł łaskę przed obliczem Boga i prosił, aby znalazł miejsce na przybytek Bogu Jakuba."
  tags: []
"Dz7,47":
  text: "Jednak to Salomon zbudował Mu dom."
  tags: []
"Dz7,48":
  text: "Ale Najwyższy nie mieszka w świątyniach uczynionych ręką, jak mówi prorok:"
  tags: []
"Dz7,49":
  text: "Niebo jest moim tronem, a ziemia podnóżkiem moich stóp. Jaki zbudujecie mi dom, mówi PAN, albo jakie jest miejsce mojego odpocznienia?"
  tags: []
"Dz7,50":
  text: "Czyż moja ręka nie uczyniła tego wszystkiego?"
  tags: []
"Dz7,51":
  text: "Ludzie twardego karku, o nieobrzezanym sercu i uszach! Wy zawsze opieracie się Duchowi Świętemu, jak ojcowie wasi, tak i wy."
  tags: []
"Dz7,52":
  text: "Którego z proroków nie prześladowali wasi ojcowie? I pozabijali tych, którzy zapowiedzieli przyjście Sprawiedliwego, którego wy teraz staliście się zdrajcami i mordercami,"
  tags: []
"Dz7,53":
  text: "Wy, którzy otrzymaliście Prawo z nakazów aniołów i nie strzegliście go!"
  tags: []
"Dz7,54":
  text: "A oni, słuchając tego, byli w swoich sercach wzburzeni ze złości i zgrzytali na niego zębami."
  tags: []
"Dz7,55":
  text: "A on, będąc pełen Ducha Świętego, ze wzrokiem skierowanym w niebo, zobaczył chwałę Bożą i Jezusa stojącego po prawicy Boga,"
  tags: []
"Dz7,56":
  text: "I powiedział: Oto widzę otwarte niebiosa i Syna Człowieczego stojącego po prawej stronie Boga."
  tags: []
"Dz7,57":
  text: "A oni krzyknęli potężnym głosem, zatkali swoje uszy i rzucili się jednomyślnie na niego."
  tags: []
"Dz7,58":
  text: "A gdy go wypchnęli na zewnątrz miasta, kamienowali; a świadkowie złożyli swoje szaty u stóp młodzieńca, zwanego Saulem."
  tags: []
"Dz7,59":
  text: "I kamienowali Szczepana, który wzywał Pana, mówiąc: Panie Jezu! Przyjmij mojego ducha!"
  tags: []
"Dz7,60":
  text: "A gdy padał na kolana, zawołał potężnym głosem: Panie! Nie poczytaj im tego za grzech! I gdy to powiedział, zasnął."
  tags: []
