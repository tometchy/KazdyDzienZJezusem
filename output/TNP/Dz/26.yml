"Dz26,1":
  text: "Agryppa powiedział wtedy do Pawła: Pozwala ci się mówić za siebie samego. Wtedy Paweł wyciągnął rękę i zaczął się bronić:"
  tags: []
"Dz26,2":
  text: "Uważam siebie za szczęśliwego, królu Agryppo, że mam dziś bronić się przed tobą odnośnie wszystkiego, o co jestem oskarżany przez Żydów,"
  tags: []
"Dz26,3":
  text: "Zwłaszcza, że ty znasz wszystkie zwyczaje i sporne kwestie wśród Żydów; dlatego, proszę cię, abyś mnie cierpliwie wysłuchał."
  tags: []
"Dz26,4":
  text: "Tak więc, tryb mojego życia od młodości, jakim on był od początku między moim narodem w Jerozolimie, znają wszyscy Żydzi."
  tags: []
"Dz26,5":
  text: "Wiedzą o mnie od dawna – gdyby chcieli zaświadczyć – że żyłem według najściślejszych zasad stronnictwa naszej religii, jako faryzeusz."
  tags: []
"Dz26,6":
  text: "A teraz stoję tu sądzony z powodu nadziei spełnienia obietnicy, uczynionej wobec ojców przez Boga,"
  tags: []
"Dz26,7":
  text: "Której dwanaście naszych pokoleń, żarliwie służąc Bogu dniem i nocą, spodziewa się dostąpić, w sprawie tej nadziei jestem oskarżany przez Żydów, królu Agryppo!"
  tags: []
"Dz26,8":
  text: "Dlaczego uważa się za rzecz nie do wiary, że Bóg wzbudza umarłych?"
  tags: []
"Dz26,9":
  text: "Ja sam wprawdzie uważałem, że trzeba przeciw imieniu Jezusa Nazarejczyka podjąć wiele wrogich działań,"
  tags: []
"Dz26,10":
  text: "Co też uczyniłem w Jerozolimie, wielu też świętych zamknąłem w więzieniach, gdyż wziąłem to pełnomocnictwo od arcykapłanów. A gdy miano ich zabijać, głosowałem za tym rzucając kamyk."
  tags: []
"Dz26,11":
  text: "I po wszystkich synagogach często karząc ich, zmuszałem do bluźnierstwa, popadając też w coraz większy szał przeciwko nim, prześladowałem ich nawet w obcych miastach."
  tags: []
"Dz26,12":
  text: "I w tych okolicznościach podróżując do Damaszku z pełnomocnictwem i poleceniem od arcykapłanów,"
  tags: []
"Dz26,13":
  text: "W środku dnia, na drodze, zobaczyłem, o królu, światłość z nieba, przewyższającą jasność słońca, światłość, która oświeciła mnie i tych, którzy szli ze mną."
  tags: []
"Dz26,14":
  text: "A gdy my wszyscy upadliśmy na ziemię, usłyszałem głos mówiący do mnie, który powiedział w języku hebrajskim: Saulu! Saulu! Dlaczego mnie prześladujesz? Trudno ci wierzgać przeciw ościeniowi."
  tags: []
"Dz26,15":
  text: "A ja powiedziałem: Kim jesteś, Panie? A On powiedział: Ja jestem Jezus, którego ty prześladujesz."
  tags: []
"Dz26,16":
  text: "Ale podnieś się i stań na swoich nogach; albowiem na to ci się ukazałem, ponieważ cię dla siebie już wcześniej swą ręką wybrałem na sługę i świadka tych rzeczy, które widziałeś, jak i tych, w których ci się ukażę,"
  tags: []
"Dz26,17":
  text: "Wyrywając cię dla siebie spośród tego ludu i pogan, do których cię teraz posyłam,"
  tags: []
"Dz26,18":
  text: "Aby otworzyć ich oczy i odwrócić od ciemności do światłości i z władzy szatana do Boga, aby otrzymali odpuszczenie grzechów i dziedzictwo między uświęconymi przez wiarę we mnie."
  tags: []
"Dz26,19":
  text: "Dlatego też, królu Agryppo, nie byłem nieposłuszny temu niebiańskiemu widzeniu."
  tags: []
"Dz26,20":
  text: "Ale najpierw tym, którzy są w Damaszku i w Jerozolimie, a także w całej krainie judzkiej, i poganom oznajmiałem, aby upamiętywali się i nawracali się do Boga, czyniąc dzieła godne upamiętania."
  tags: []
"Dz26,21":
  text: "I ze względu na te słowa, schwytali mnie Żydzi w świątyni i próbowali zabić."
  tags: []
"Dz26,22":
  text: "Otrzymując jednak pomoc od Boga, aż do tego dnia stoję, świadcząc zarówno małemu, jak i wielkiemu, nie mówiąc nic oprócz tego, co powiedzieli Prorocy i Mojżesz, że ma nastąpić,"
  tags: []
"Dz26,23":
  text: "Że Mesjasz będzie poddany cierpieniom, że jako pierwszy, który powstał z martwych ma głosić światłość ludowi i poganom."
  tags: []
"Dz26,24":
  text: "A gdy on tak się bronił, Festus powiedział potężnym głosem: Szalejesz, Pawle! Wielka nauka prowadzi cię do szaleństwa."
  tags: []
"Dz26,25":
  text: "Ale on powiedział: Nie szaleję, najdostojniejszy Festusie! Ale wypowiadam słowa prawdy i rozsądku."
  tags: []
"Dz26,26":
  text: "Wie bowiem o tych sprawach król, do którego śmiało mówię, gdyż jestem przekonany, że nie jest to przed nim ukryte, ponieważ nic z tego nie działo się w jakimś zakątku."
  tags: []
"Dz26,27":
  text: "Czy wierzysz, królu Agryppo, prorokom? Wiem, że wierzysz."
  tags: []
"Dz26,28":
  text: "Agryppa natomiast powiedział do Pawła: Już zaraz mnie przekonasz, bym został chrześcijaninem."
  tags: []
"Dz26,29":
  text: "A Paweł powiedział: Życzyłbym sobie, by Bóg sprawił, czy już teraz, czy później, nie tylko ty, ale i wszyscy, którzy mnie dzisiaj słuchają, stali się takimi, jakim i ja jestem, oprócz tych więzów."
  tags: []
"Dz26,30":
  text: "A gdy on to powiedział, powstał król i namiestnik, a także Berenika i ci, którzy razem z nimi siedzieli."
  tags: []
"Dz26,31":
  text: "I gdy oddalili się na ubocze, rozmawiali między sobą, mówiąc: Nic godnego śmierci lub więzienia nie czyni ten człowiek."
  tags: []
"Dz26,32":
  text: "Agryppa jednak powiedział do Festusa: Mógłby ten człowiek zostać uwolniony, gdyby nie odwołał się do Cezara."
  tags: []
