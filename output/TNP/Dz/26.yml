"Dz26,1": "Agryppa powiedział wtedy do Pawła: Pozwala ci się mówić za siebie samego. Wtedy Paweł wyciągnął rękę i zaczął się bronić:"
"Dz26,2": "Uważam siebie za szczęśliwego, królu Agryppo, że mam dziś bronić się przed tobą odnośnie wszystkiego, o co jestem oskarżany przez Żydów,"
"Dz26,3": "Zwłaszcza, że ty znasz wszystkie zwyczaje i sporne kwestie wśród Żydów; dlatego, proszę cię, abyś mnie cierpliwie wysłuchał."
"Dz26,4": "Tak więc, tryb mojego życia od młodości, jakim on był od początku między moim narodem w Jerozolimie, znają wszyscy Żydzi."
"Dz26,5": "Wiedzą o mnie od dawna – gdyby chcieli zaświadczyć – że żyłem według najściślejszych zasad stronnictwa naszej religii, jako faryzeusz."
"Dz26,6": "A teraz stoję tu sądzony z powodu nadziei spełnienia obietnicy, uczynionej wobec ojców przez Boga,"
"Dz26,7": "Której dwanaście naszych pokoleń, żarliwie służąc Bogu dniem i nocą, spodziewa się dostąpić, w sprawie tej nadziei jestem oskarżany przez Żydów, królu Agryppo!"
"Dz26,8": "Dlaczego uważa się za rzecz nie do wiary, że Bóg wzbudza umarłych?"
"Dz26,9": "Ja sam wprawdzie uważałem, że trzeba przeciw imieniu Jezusa Nazarejczyka podjąć wiele wrogich działań,"
"Dz26,10": "Co też uczyniłem w Jerozolimie, wielu też świętych zamknąłem w więzieniach, gdyż wziąłem to pełnomocnictwo od arcykapłanów. A gdy miano ich zabijać, głosowałem za tym rzucając kamyk."
"Dz26,11": "I po wszystkich synagogach często karząc ich, zmuszałem do bluźnierstwa, popadając też w coraz większy szał przeciwko nim, prześladowałem ich nawet w obcych miastach."
"Dz26,12": "I w tych okolicznościach podróżując do Damaszku z pełnomocnictwem i poleceniem od arcykapłanów,"
"Dz26,13": "W środku dnia, na drodze, zobaczyłem, o królu, światłość z nieba, przewyższającą jasność słońca, światłość, która oświeciła mnie i tych, którzy szli ze mną."
"Dz26,14": "A gdy my wszyscy upadliśmy na ziemię, usłyszałem głos mówiący do mnie, który powiedział w języku hebrajskim: Saulu! Saulu! Dlaczego mnie prześladujesz? Trudno ci wierzgać przeciw ościeniowi."
"Dz26,15": "A ja powiedziałem: Kim jesteś, Panie? A On powiedział: Ja jestem Jezus, którego ty prześladujesz."
"Dz26,16": "Ale podnieś się i stań na swoich nogach; albowiem na to ci się ukazałem, ponieważ cię dla siebie już wcześniej swą ręką wybrałem na sługę i świadka tych rzeczy, które widziałeś, jak i tych, w których ci się ukażę,"
"Dz26,17": "Wyrywając cię dla siebie spośród tego ludu i pogan, do których cię teraz posyłam,"
"Dz26,18": "Aby otworzyć ich oczy i odwrócić od ciemności do światłości i z władzy szatana do Boga, aby otrzymali odpuszczenie grzechów i dziedzictwo między uświęconymi przez wiarę we mnie."
"Dz26,19": "Dlatego też, królu Agryppo, nie byłem nieposłuszny temu niebiańskiemu widzeniu."
"Dz26,20": "Ale najpierw tym, którzy są w Damaszku i w Jerozolimie, a także w całej krainie judzkiej, i poganom oznajmiałem, aby upamiętywali się i nawracali się do Boga, czyniąc dzieła godne upamiętania."
"Dz26,21": "I ze względu na te słowa, schwytali mnie Żydzi w świątyni i próbowali zabić."
"Dz26,22": "Otrzymując jednak pomoc od Boga, aż do tego dnia stoję, świadcząc zarówno małemu, jak i wielkiemu, nie mówiąc nic oprócz tego, co powiedzieli Prorocy i Mojżesz, że ma nastąpić,"
"Dz26,23": "Że Mesjasz będzie poddany cierpieniom, że jako pierwszy, który powstał z martwych ma głosić światłość ludowi i poganom."
"Dz26,24": "A gdy on tak się bronił, Festus powiedział potężnym głosem: Szalejesz, Pawle! Wielka nauka prowadzi cię do szaleństwa."
"Dz26,25": "Ale on powiedział: Nie szaleję, najdostojniejszy Festusie! Ale wypowiadam słowa prawdy i rozsądku."
"Dz26,26": "Wie bowiem o tych sprawach król, do którego śmiało mówię, gdyż jestem przekonany, że nie jest to przed nim ukryte, ponieważ nic z tego nie działo się w jakimś zakątku."
"Dz26,27": "Czy wierzysz, królu Agryppo, prorokom? Wiem, że wierzysz."
"Dz26,28": "Agryppa natomiast powiedział do Pawła: Już zaraz mnie przekonasz, bym został chrześcijaninem."
"Dz26,29": "A Paweł powiedział: Życzyłbym sobie, by Bóg sprawił, czy już teraz, czy później, nie tylko ty, ale i wszyscy, którzy mnie dzisiaj słuchają, stali się takimi, jakim i ja jestem, oprócz tych więzów."
"Dz26,30": "A gdy on to powiedział, powstał król i namiestnik, a także Berenika i ci, którzy razem z nimi siedzieli."
"Dz26,31": "I gdy oddalili się na ubocze, rozmawiali między sobą, mówiąc: Nic godnego śmierci lub więzienia nie czyni ten człowiek."
"Dz26,32": "Agryppa jednak powiedział do Festusa: Mógłby ten człowiek zostać uwolniony, gdyby nie odwołał się do Cezara."
