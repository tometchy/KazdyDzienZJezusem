"Dz8,1":
  text: "A Saul był tym, który zgadzał się z jego zabiciem. I w tym dniu rozpoczęło się wielkie prześladowanie wobec zboru w Jerozolimie, i byli wszyscy rozproszeni po krainach Judei i Samarii z wyjątkiem apostołów."
  tags: []
"Dz8,2":
  text: "A Szczepana pogrzebali pobożni mężowie i wszczęli nad nim wielki lament."
  tags: []
"Dz8,3":
  text: "A Saul tępił zbór, wchodząc do domów, wywlekając zarówno mężczyzn, jak i kobiety, i przekazywał ich do więzienia."
  tags: []
"Dz8,4":
  text: "Jednakże ci, którzy zostali rozproszeni, przechodzili z miejsca na miejsce, głosząc słowo dobrej nowiny."
  tags: []
"Dz8,5":
  text: "A Filip, gdy zszedł do miasta Samarii, głosił im Chrystusa."
  tags: []
"Dz8,6":
  text: "A tłumy jednomyślnie lgnęły do tego, co mówił Filip, słysząc i widząc cudowne znaki, które czynił."
  tags: []
"Dz8,7":
  text: "Albowiem duchy nieczyste wychodziły z wielu, którzy je mieli, wołając potężnym głosem; wielu też sparaliżowanych i chromych zostało uzdrowionych."
  tags: []
"Dz8,8":
  text: "I nastała w tym mieście wielka radość."
  tags: []
"Dz8,9":
  text: "A był w tym mieście pewien mąż, o imieniu Szymon, który wcześniej zajmował się magią i wprawiał w zdumienie lud Samarii, mówiąc o sobie, że jest kimś wielkim;"
  tags: []
"Dz8,10":
  text: "Do którego lgnęli wszyscy od małych aż do wielkich, mówiąc: Ten jest mocą Boga – Wielką."
  tags: []
"Dz8,11":
  text: "A lgnęli do niego dlatego, gdyż od dłuższego czasu wprawiał ich w zdumienie swoją magią."
  tags: []
"Dz8,12":
  text: "Gdy jednak uwierzyli Filipowi, głoszącemu Ewangelię o Królestwie Bożym i o imieniu Jezusa Chrystusa, dawali się ochrzcić, zarówno mężczyźni, jak i kobiety."
  tags: []
"Dz8,13":
  text: "Sam Szymon także uwierzył, a gdy został ochrzczony, trzymał się Filipa, a widząc, jak dzieją się znaki i przejawy mocy, był zdumiony."
  tags: []
"Dz8,14":
  text: "A gdy apostołowie w Jerozolimie usłyszeli, że Samaria przyjęła Słowo Boga, posłali do nich Piotra i Jana,"
  tags: []
"Dz8,15":
  text: "Którzy, gdy tam przyszli, modlili się za nich, aby otrzymali Ducha Świętego."
  tags: []
"Dz8,16":
  text: "Bowiem jeszcze nie zstąpił na nikogo z nich; bo byli jedynie ochrzczeni w imię Pana Jezusa."
  tags: []
"Dz8,17":
  text: "Wtedy wkładali na nich ręce, a oni otrzymywali Ducha Świętego."
  tags: []
"Dz8,18":
  text: "A Szymon widząc, że przez wkładanie rąk apostołów jest udzielany Duch Święty, przyniósł im pieniądze,"
  tags: []
"Dz8,19":
  text: "Mówiąc: Dajcie i mnie tę moc, aby ten, na kogo włożę ręce, otrzymał Ducha Świętego."
  tags: []
"Dz8,20":
  text: "Lecz Piotr powiedział do niego: Oby ci twoje srebro razem z tobą było na zgubę, gdyż sądziłeś, że dar Boga można nabyć za pieniądze."
  tags: []
"Dz8,21":
  text: "Nie ma dla ciebie cząstki, ani dziedzictwa w tej sprawie, albowiem serce twoje nie jest szczere przed obliczem Boga."
  tags: []
"Dz8,22":
  text: "Upamiętaj się więc z tego swojego zła i proś Boga, czy w związku z tym zostanie ci odpuszczony zamysł twojego serca."
  tags: []
"Dz8,23":
  text: "Widzę bowiem, że jesteś pogrążony w gorzkiej żółci i w więzach nieprawości."
  tags: []
"Dz8,24":
  text: "A w odpowiedzi, Szymon powiedział: Módlcie się za mną do Pana, aby nie przyszło na mnie nic z tego, co powiedzieliście."
  tags: []
"Dz8,25":
  text: "A oni, gdy złożyli świadectwo i opowiedzieli Słowo Pana, wrócili do Jerozolimy; także w wielu miasteczkach Samarytan głosili dobrą nowinę."
  tags: []
"Dz8,26":
  text: "A anioł PANA powiedział do Filipa, mówiąc: Wstań i idź na południe na drogę, która z Jerozolimy schodzi do Gazy, jest to droga pustynna."
  tags: []
"Dz8,27":
  text: "Powstał więc i poszedł. A oto mąż Etiopczyk, eunuch, dostojnik królowej Etiopii Kandaki, który był ustanowiony nad całym jej skarbcem, przybył mając zamiar oddać cześć Bogu w Jerozolimie."
  tags: []
"Dz8,28":
  text: "Teraz już wracał, siedząc na swoim wozie, czytał proroka Izajasza."
  tags: []
"Dz8,29":
  text: "Wtedy Duch powiedział do Filipa: Podejdź i przyłącz się do tego wozu."
  tags: []
"Dz8,30":
  text: "A gdy Filip podbiegł, usłyszał go czytającego proroka Izajasza, i powiedział: Czy rzeczywiście rozumiesz, co czytasz?"
  tags: []
"Dz8,31":
  text: "A on powiedział: Jak mogę rozumieć, jeśli mnie nikt nie poprowadzi? I zaprosił Filipa, aby wszedł i razem z nim usiadł."
  tags: []
"Dz8,32":
  text: "A odczytywał ten oto urywek Pisma: Jak owca na rzeź był prowadzony, i milczał jak baranek wobec tego, który go strzyże, tak i On nie otwiera swoich ust;"
  tags: []
"Dz8,33":
  text: "W jego poniżeniu pozbawiono go sądu, a kto opowie o jego rodzie? Gdyż Jego życie jest usuwane z ziemi."
  tags: []
"Dz8,34":
  text: "A eunuch w odpowiedzi, rzekł Filipowi: Proszę cię, powiedz, o kim to mówi prorok? O sobie samym, czy o kimś innym?"
  tags: []
"Dz8,35":
  text: "A Filip otworzył swoje usta, i rozpoczynając od tego miejsca Pisma ogłosił mu dobrą nowinę o Jezusie."
  tags: []
"Dz8,36":
  text: "A gdy jechali tą drogą, przybyli nad jakąś wodę. I powiedział eunuch: Oto woda! Co stoi na przeszkodzie, abym został ochrzczony?"
  tags: []
"Dz8,37":
  text: "A Filip powiedział: Jeśli wierzysz z całego serca, wolno ci. A on odpowiadając, rzekł: Wierzę, że Jezus Chrystus jest Synem Boga."
  tags: []
"Dz8,38":
  text: "I kazał, aby zatrzymano wóz, i zeszli obaj do wody, Filip i eunuch; i ochrzcił go."
  tags: []
"Dz8,39":
  text: "A gdy wyszli z wody, Duch PANA porwał Filipa i eunuch nie zobaczył go więcej, lecz radując się jechał dalej swoją drogą."
  tags: []
"Dz8,40":
  text: "Filip natomiast znalazł się w Azocie, a przechodząc przez wszystkie miasta, głosił dobrą nowinę, aż przyszedł do Cezarei."
  tags: []
