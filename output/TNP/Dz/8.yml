"Dz8,1": "A Saul był tym, który zgadzał się z jego zabiciem. I w tym dniu rozpoczęło się wielkie prześladowanie wobec zboru w Jerozolimie, i byli wszyscy rozproszeni po krainach Judei i Samarii z wyjątkiem apostołów."
"Dz8,2": "A Szczepana pogrzebali pobożni mężowie i wszczęli nad nim wielki lament."
"Dz8,3": "A Saul tępił zbór, wchodząc do domów, wywlekając zarówno mężczyzn, jak i kobiety, i przekazywał ich do więzienia."
"Dz8,4": "Jednakże ci, którzy zostali rozproszeni, przechodzili z miejsca na miejsce, głosząc słowo dobrej nowiny."
"Dz8,5": "A Filip, gdy zszedł do miasta Samarii, głosił im Chrystusa."
"Dz8,6": "A tłumy jednomyślnie lgnęły do tego, co mówił Filip, słysząc i widząc cudowne znaki, które czynił."
"Dz8,7": "Albowiem duchy nieczyste wychodziły z wielu, którzy je mieli, wołając potężnym głosem; wielu też sparaliżowanych i chromych zostało uzdrowionych."
"Dz8,8": "I nastała w tym mieście wielka radość."
"Dz8,9": "A był w tym mieście pewien mąż, o imieniu Szymon, który wcześniej zajmował się magią i wprawiał w zdumienie lud Samarii, mówiąc o sobie, że jest kimś wielkim;"
"Dz8,10": "Do którego lgnęli wszyscy od małych aż do wielkich, mówiąc: Ten jest mocą Boga – Wielką."
"Dz8,11": "A lgnęli do niego dlatego, gdyż od dłuższego czasu wprawiał ich w zdumienie swoją magią."
"Dz8,12": "Gdy jednak uwierzyli Filipowi, głoszącemu Ewangelię o Królestwie Bożym i o imieniu Jezusa Chrystusa, dawali się ochrzcić, zarówno mężczyźni, jak i kobiety."
"Dz8,13": "Sam Szymon także uwierzył, a gdy został ochrzczony, trzymał się Filipa, a widząc, jak dzieją się znaki i przejawy mocy, był zdumiony."
"Dz8,14": "A gdy apostołowie w Jerozolimie usłyszeli, że Samaria przyjęła Słowo Boga, posłali do nich Piotra i Jana,"
"Dz8,15": "Którzy, gdy tam przyszli, modlili się za nich, aby otrzymali Ducha Świętego."
"Dz8,16": "Bowiem jeszcze nie zstąpił na nikogo z nich; bo byli jedynie ochrzczeni w imię Pana Jezusa."
"Dz8,17": "Wtedy wkładali na nich ręce, a oni otrzymywali Ducha Świętego."
"Dz8,18": "A Szymon widząc, że przez wkładanie rąk apostołów jest udzielany Duch Święty, przyniósł im pieniądze,"
"Dz8,19": "Mówiąc: Dajcie i mnie tę moc, aby ten, na kogo włożę ręce, otrzymał Ducha Świętego."
"Dz8,20": "Lecz Piotr powiedział do niego: Oby ci twoje srebro razem z tobą było na zgubę, gdyż sądziłeś, że dar Boga można nabyć za pieniądze."
"Dz8,21": "Nie ma dla ciebie cząstki, ani dziedzictwa w tej sprawie, albowiem serce twoje nie jest szczere przed obliczem Boga."
"Dz8,22": "Upamiętaj się więc z tego swojego zła i proś Boga, czy w związku z tym zostanie ci odpuszczony zamysł twojego serca."
"Dz8,23": "Widzę bowiem, że jesteś pogrążony w gorzkiej żółci i w więzach nieprawości."
"Dz8,24": "A w odpowiedzi, Szymon powiedział: Módlcie się za mną do Pana, aby nie przyszło na mnie nic z tego, co powiedzieliście."
"Dz8,25": "A oni, gdy złożyli świadectwo i opowiedzieli Słowo Pana, wrócili do Jerozolimy; także w wielu miasteczkach Samarytan głosili dobrą nowinę."
"Dz8,26": "A anioł PANA powiedział do Filipa, mówiąc: Wstań i idź na południe na drogę, która z Jerozolimy schodzi do Gazy, jest to droga pustynna."
"Dz8,27": "Powstał więc i poszedł. A oto mąż Etiopczyk, eunuch, dostojnik królowej Etiopii Kandaki, który był ustanowiony nad całym jej skarbcem, przybył mając zamiar oddać cześć Bogu w Jerozolimie."
"Dz8,28": "Teraz już wracał, siedząc na swoim wozie, czytał proroka Izajasza."
"Dz8,29": "Wtedy Duch powiedział do Filipa: Podejdź i przyłącz się do tego wozu."
"Dz8,30": "A gdy Filip podbiegł, usłyszał go czytającego proroka Izajasza, i powiedział: Czy rzeczywiście rozumiesz, co czytasz?"
"Dz8,31": "A on powiedział: Jak mogę rozumieć, jeśli mnie nikt nie poprowadzi? I zaprosił Filipa, aby wszedł i razem z nim usiadł."
"Dz8,32": "A odczytywał ten oto urywek Pisma: Jak owca na rzeź był prowadzony, i milczał jak baranek wobec tego, który go strzyże, tak i On nie otwiera swoich ust;"
"Dz8,33": "W jego poniżeniu pozbawiono go sądu, a kto opowie o jego rodzie? Gdyż Jego życie jest usuwane z ziemi."
"Dz8,34": "A eunuch w odpowiedzi, rzekł Filipowi: Proszę cię, powiedz, o kim to mówi prorok? O sobie samym, czy o kimś innym?"
"Dz8,35": "A Filip otworzył swoje usta, i rozpoczynając od tego miejsca Pisma ogłosił mu dobrą nowinę o Jezusie."
"Dz8,36": "A gdy jechali tą drogą, przybyli nad jakąś wodę. I powiedział eunuch: Oto woda! Co stoi na przeszkodzie, abym został ochrzczony?"
"Dz8,37": "A Filip powiedział: Jeśli wierzysz z całego serca, wolno ci. A on odpowiadając, rzekł: Wierzę, że Jezus Chrystus jest Synem Boga."
"Dz8,38": "I kazał, aby zatrzymano wóz, i zeszli obaj do wody, Filip i eunuch; i ochrzcił go."
"Dz8,39": "A gdy wyszli z wody, Duch PANA porwał Filipa i eunuch nie zobaczył go więcej, lecz radując się jechał dalej swoją drogą."
"Dz8,40": "Filip natomiast znalazł się w Azocie, a przechodząc przez wszystkie miasta, głosił dobrą nowinę, aż przyszedł do Cezarei."
