"Dz17,1": "A gdy przeszli Amfipolis i Apolonię, przyszli do Tesaloniki, gdzie była synagoga żydowska."
"Dz17,2": "Paweł więc zgodnie ze swoim zwyczajem wszedł do nich i przez trzy szabaty wykładał im z Pism,"
"Dz17,3": "Wyjaśniając i dowodząc, że Mesjasz musiał cierpieć i powstać z martwych, i że tym Mesjaszem jest Jezus, którego ja wam głoszę."
"Dz17,4": "A niektórzy z nich zostali przekonani i przyłączeni do Pawła i Sylasa, również wielka liczba czczących Boga Greków, a także niemało wpływowych kobiet."
"Dz17,5": "Ale Żydzi, którzy nie okazali posłuszeństwa, powodowani zazdrością, dobrali sobie jakichś niegodziwych mężczyzn z agory, uczynili zbiegowisko i wzniecili rozruch w mieście; przybyli także pod dom Jazona, usiłując przyprowadzić ich do ludu."
"Dz17,6": "A gdy ich nie znaleźli, ciągnęli Jazona i niektórych braci do przełożonych miasta, wołając: Ci, którzy wzburzyli cały zamieszkały świat, przybyli i tutaj;"
"Dz17,7": "A Jazon ich przyjął; a oni wszyscy działają przeciwko postanowieniom Cezara, mówiąc, że kto inny jest królem – Jezus."
"Dz17,8": "I wzburzyli tym tłum i przełożonych miasta, którzy to słyszeli."
"Dz17,9": "A oni, otrzymawszy zabezpieczenie od Jazona i od innych, wypuścili ich."
"Dz17,10": "A bracia zaraz w nocy wysłali Pawła i Sylasa do Berei, którzy gdy tam przybyli, chodzili do synagogi żydowskiej."
"Dz17,11": "A ci byli szlachetniejsi od tych w Tesalonice, gdyż przyjęli Słowo Boże z całą gotowością, codziennie badając Pisma, czy tak się te rzeczy mają."
"Dz17,12": "Wielu więc z nich prawdziwie uwierzyło, i dostojnych Greczynek, kobiet i niemało mężczyzn."
"Dz17,13": "A gdy Żydzi z Tesaloniki dowiedzieli się, że i w Berei było ogłoszone przez Pawła Słowo Boże, i tam przyszli, podburzając tłum."
"Dz17,14": "A wtedy bracia natychmiast wysłali Pawła, aby szedł ku morzu; a Sylas i Tymoteusz tam pozostali."
"Dz17,15": "A ci, którzy odprowadzali Pawła, doprowadzili go aż do Aten, i gdy wzięli polecenie dla Sylasa i Tymoteusza, aby jak najszybciej przybyli do niego, odeszli."
"Dz17,16": "A gdy Paweł oczekiwał ich w Atenach, burzył się w nim jego duch, bo widział, że miasto jest pełne bożków."
"Dz17,17": "I dlatego rozprawiał w synagodze z Żydami i czczącymi Boga, i codziennie na rynku z tymi, z którymi się nadarzyło."
"Dz17,18": "A niektórzy z filozofów epikurejskich i stoickich spierali się z nim, jedni mówili: Co chce powiedzieć ten bajarz? A drudzy: Zdaje się, że jest zwiastunem obcych bóstw; bo im głosił dobrą nowinę o Jezusie i powstaniu z martwych."
"Dz17,19": "Chwycili go i zaprowadzili na Areopag, mówiąc: Czy możemy wiedzieć, co to za nowa nauka, która przez ciebie jest głoszona?"
"Dz17,20": "Bo słyszymy jakieś obce rzeczy; chcemy więc wiedzieć, co to jest?"
"Dz17,21": "Gdyż wszyscy Ateńczycy i przebywający w tym kraju cudzoziemcy na nic innego nie mieli tyle czasu, co na mówienie albo słuchanie czegoś z najświeższych nowinek."
"Dz17,22": "A Paweł stanął pośrodku Areopagu i powiedział: Mężowie ateńscy! Widzę, że we wszystkim jesteście bardzo religijni."
"Dz17,23": "Przechodząc bowiem i przypatrując się waszym świętościom, znalazłem i ołtarz, na którym zostało napisane: Nieznanemu Bogu. Tego więc, którego nie znając czcicie, ja wam głoszę."
"Dz17,24": "Bóg, który uczynił świat i wszystko, co jest na nim, Ten, będąc Panem nieba i ziemi, nie zamieszkuje w świątyniach uczynionych ręką,"
"Dz17,25": "Ani nie potrzebuje ludzkich rąk, aby był obsługiwany, jak gdyby czegoś dodatkowo potrzebował, ponieważ sam daje wszystkim życie i tchnienie, i wszystko;"
"Dz17,26": "I uczynił z jednej krwi każdy naród ludzki, aby mieszkał na całym obliczu ziemi, wyznaczając im czasy wcześniej ustanowione i granice ich zamieszkania,"
"Dz17,27": "Żeby szukały PANA, oby prawdziwie Go dotknęły i oby Go znalazły, wszakże nie jest On daleko od każdego z nas;"
"Dz17,28": "W Nim bowiem żyjemy i poruszamy się, i jesteśmy, jak i niektórzy z waszych poetów powiedzieli: Jego bowiem rodem jesteśmy."
"Dz17,29": "Będąc więc rodem Boga, nie powinniśmy sądzić, że złoto, albo srebro, albo kamień wytworu rzemiosła i pomysłu ludzkiego, miałyby być podobne do tego, co boskie."
"Dz17,30": "Otóż Bóg wprawdzie pominął czasy niewiedzy, lecz teraz nakazuje wszędzie wszystkim ludziom, aby się upamiętali,"
"Dz17,31": "Dlatego że ustanowił dzień, w którym ma sądzić zamieszkały świat w sprawiedliwości przez Męża, którego ustanowił, dając wszystkim tego dowód godny zaufania gdy wzbudził Go z martwych."
"Dz17,32": "Gdy więc usłyszeli o wzbudzeniu z martwych, jedni wprawdzie szydzili, jednak inni mówili: Posłuchamy cię o tym ponownie."
"Dz17,33": "I tak Paweł wyszedł spośród nich."
"Dz17,34": "A niektórzy mężczyźni przyłączyli się do niego i uwierzyli, wśród nich był i Dionizy Areopagita i niewiasta imieniem Damaris, i inni z nimi."
