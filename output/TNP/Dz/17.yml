"Dz17,1":
  text: "A gdy przeszli Amfipolis i Apolonię, przyszli do Tesaloniki, gdzie była synagoga żydowska."
  tags: []
"Dz17,2":
  text: "Paweł więc zgodnie ze swoim zwyczajem wszedł do nich i przez trzy szabaty wykładał im z Pism,"
  tags: []
"Dz17,3":
  text: "Wyjaśniając i dowodząc, że Mesjasz musiał cierpieć i powstać z martwych, i że tym Mesjaszem jest Jezus, którego ja wam głoszę."
  tags: []
"Dz17,4":
  text: "A niektórzy z nich zostali przekonani i przyłączeni do Pawła i Sylasa, również wielka liczba czczących Boga Greków, a także niemało wpływowych kobiet."
  tags: []
"Dz17,5":
  text: "Ale Żydzi, którzy nie okazali posłuszeństwa, powodowani zazdrością, dobrali sobie jakichś niegodziwych mężczyzn z agory, uczynili zbiegowisko i wzniecili rozruch w mieście; przybyli także pod dom Jazona, usiłując przyprowadzić ich do ludu."
  tags: []
"Dz17,6":
  text: "A gdy ich nie znaleźli, ciągnęli Jazona i niektórych braci do przełożonych miasta, wołając: Ci, którzy wzburzyli cały zamieszkały świat, przybyli i tutaj;"
  tags: []
"Dz17,7":
  text: "A Jazon ich przyjął; a oni wszyscy działają przeciwko postanowieniom Cezara, mówiąc, że kto inny jest królem – Jezus."
  tags: []
"Dz17,8":
  text: "I wzburzyli tym tłum i przełożonych miasta, którzy to słyszeli."
  tags: []
"Dz17,9":
  text: "A oni, otrzymawszy zabezpieczenie od Jazona i od innych, wypuścili ich."
  tags: []
"Dz17,10":
  text: "A bracia zaraz w nocy wysłali Pawła i Sylasa do Berei, którzy gdy tam przybyli, chodzili do synagogi żydowskiej."
  tags: []
"Dz17,11":
  text: "A ci byli szlachetniejsi od tych w Tesalonice, gdyż przyjęli Słowo Boże z całą gotowością, codziennie badając Pisma, czy tak się te rzeczy mają."
  tags: []
"Dz17,12":
  text: "Wielu więc z nich prawdziwie uwierzyło, i dostojnych Greczynek, kobiet i niemało mężczyzn."
  tags: []
"Dz17,13":
  text: "A gdy Żydzi z Tesaloniki dowiedzieli się, że i w Berei było ogłoszone przez Pawła Słowo Boże, i tam przyszli, podburzając tłum."
  tags: []
"Dz17,14":
  text: "A wtedy bracia natychmiast wysłali Pawła, aby szedł ku morzu; a Sylas i Tymoteusz tam pozostali."
  tags: []
"Dz17,15":
  text: "A ci, którzy odprowadzali Pawła, doprowadzili go aż do Aten, i gdy wzięli polecenie dla Sylasa i Tymoteusza, aby jak najszybciej przybyli do niego, odeszli."
  tags: []
"Dz17,16":
  text: "A gdy Paweł oczekiwał ich w Atenach, burzył się w nim jego duch, bo widział, że miasto jest pełne bożków."
  tags: []
"Dz17,17":
  text: "I dlatego rozprawiał w synagodze z Żydami i czczącymi Boga, i codziennie na rynku z tymi, z którymi się nadarzyło."
  tags: []
"Dz17,18":
  text: "A niektórzy z filozofów epikurejskich i stoickich spierali się z nim, jedni mówili: Co chce powiedzieć ten bajarz? A drudzy: Zdaje się, że jest zwiastunem obcych bóstw; bo im głosił dobrą nowinę o Jezusie i powstaniu z martwych."
  tags: []
"Dz17,19":
  text: "Chwycili go i zaprowadzili na Areopag, mówiąc: Czy możemy wiedzieć, co to za nowa nauka, która przez ciebie jest głoszona?"
  tags: []
"Dz17,20":
  text: "Bo słyszymy jakieś obce rzeczy; chcemy więc wiedzieć, co to jest?"
  tags: []
"Dz17,21":
  text: "Gdyż wszyscy Ateńczycy i przebywający w tym kraju cudzoziemcy na nic innego nie mieli tyle czasu, co na mówienie albo słuchanie czegoś z najświeższych nowinek."
  tags: []
"Dz17,22":
  text: "A Paweł stanął pośrodku Areopagu i powiedział: Mężowie ateńscy! Widzę, że we wszystkim jesteście bardzo religijni."
  tags: []
"Dz17,23":
  text: "Przechodząc bowiem i przypatrując się waszym świętościom, znalazłem i ołtarz, na którym zostało napisane: Nieznanemu Bogu. Tego więc, którego nie znając czcicie, ja wam głoszę."
  tags: []
"Dz17,24":
  text: "Bóg, który uczynił świat i wszystko, co jest na nim, Ten, będąc Panem nieba i ziemi, nie zamieszkuje w świątyniach uczynionych ręką,"
  tags: []
"Dz17,25":
  text: "Ani nie potrzebuje ludzkich rąk, aby był obsługiwany, jak gdyby czegoś dodatkowo potrzebował, ponieważ sam daje wszystkim życie i tchnienie, i wszystko;"
  tags: []
"Dz17,26":
  text: "I uczynił z jednej krwi każdy naród ludzki, aby mieszkał na całym obliczu ziemi, wyznaczając im czasy wcześniej ustanowione i granice ich zamieszkania,"
  tags: []
"Dz17,27":
  text: "Żeby szukały PANA, oby prawdziwie Go dotknęły i oby Go znalazły, wszakże nie jest On daleko od każdego z nas;"
  tags: []
"Dz17,28":
  text: "W Nim bowiem żyjemy i poruszamy się, i jesteśmy, jak i niektórzy z waszych poetów powiedzieli: Jego bowiem rodem jesteśmy."
  tags: []
"Dz17,29":
  text: "Będąc więc rodem Boga, nie powinniśmy sądzić, że złoto, albo srebro, albo kamień wytworu rzemiosła i pomysłu ludzkiego, miałyby być podobne do tego, co boskie."
  tags: []
"Dz17,30":
  text: "Otóż Bóg wprawdzie pominął czasy niewiedzy, lecz teraz nakazuje wszędzie wszystkim ludziom, aby się upamiętali,"
  tags: []
"Dz17,31":
  text: "Dlatego że ustanowił dzień, w którym ma sądzić zamieszkały świat w sprawiedliwości przez Męża, którego ustanowił, dając wszystkim tego dowód godny zaufania gdy wzbudził Go z martwych."
  tags: []
"Dz17,32":
  text: "Gdy więc usłyszeli o wzbudzeniu z martwych, jedni wprawdzie szydzili, jednak inni mówili: Posłuchamy cię o tym ponownie."
  tags: []
"Dz17,33":
  text: "I tak Paweł wyszedł spośród nich."
  tags: []
"Dz17,34":
  text: "A niektórzy mężczyźni przyłączyli się do niego i uwierzyli, wśród nich był i Dionizy Areopagita i niewiasta imieniem Damaris, i inni z nimi."
  tags: []
