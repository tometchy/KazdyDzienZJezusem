"Dz5,1":
  text: "A pewien mąż, o imieniu Ananiasz, ze swoją żoną Safirą, sprzedał posiadłość,"
  tags: []
"Dz5,2":
  text: "I za wiedzą swojej żony przywłaszczył sobie część zapłaty, a jakąś część z niej położył u stóp apostołów."
  tags: []
"Dz5,3":
  text: "A Piotr powiedział: Ananiaszu! Czym to szatan napełnił twoje serce, że skłamałeś Duchowi Świętemu i przywłaszczyłeś sobie część zapłaty za pole?"
  tags: []
"Dz5,4":
  text: "Czy pozostając twoją, nie należała do ciebie? A po sprzedaniu, zapłata nie była w twej władzy? Dlaczego tę rzecz dopuściłeś do swojego serca? Skłamałeś nie ludziom, lecz Bogu."
  tags: []
"Dz5,5":
  text: "A Ananiasz, słysząc te słowa, padł i wyzionął ducha. I wielki strach ogarnął wszystkich, którzy to słyszeli."
  tags: []
"Dz5,6":
  text: "Młodsi natomiast, wstali, owinęli go, wynieśli i pogrzebali."
  tags: []
"Dz5,7":
  text: "A stało się po upływie około trzech godzin, że jego żona weszła, nie wiedząc, co się stało."
  tags: []
"Dz5,8":
  text: "I Piotr powiedział do niej: Powiedz mi, czy za tyle sprzedaliście tę rolę? A ona powiedziała: Tak, za tyle."
  tags: []
"Dz5,9":
  text: "A Piotr powiedział do niej: Dlaczego zmówiliście się między sobą, aby wystawiać na próbę Ducha PANA? Oto stopy tych, którzy pogrzebali twojego męża są u drzwi, wyniosą i ciebie."
  tags: []
"Dz5,10":
  text: "I padła zaraz przed jego stopami, i wyzionęła ducha. A gdy młodzieńcy weszli, znaleźli ją martwą, wynieśli i pogrzebali obok jej męża."
  tags: []
"Dz5,11":
  text: "I wielki strach ogarnął całe zgromadzenie i wszystkich, którzy to słyszeli."
  tags: []
"Dz5,12":
  text: "A przez ręce apostołów działo się wiele znaków i cudów wśród ludu i byli wszyscy jednomyślnie w portyku Salomona."
  tags: []
"Dz5,13":
  text: "A z pozostałych nikt nie śmiał przyłączyć się do nich; ale lud ich wysoko cenił."
  tags: []
"Dz5,14":
  text: "Coraz więcej też przybywało wierzących Panu, mnóstwo mężczyzn, a także i kobiet,"
  tags: []
"Dz5,15":
  text: "Tak że na ulice wynoszono chorych i kładziono ich na posłaniach i na matach, aby przynajmniej cień idącego Piotra zacienił kogoś z nich."
  tags: []
"Dz5,16":
  text: "Schodziło się również mnóstwo ludzi z okolicznych miast do Jerozolimy, przynosząc chorych i dręczonych przez duchy nieczyste; i wszyscy oni byli uzdrawiani."
  tags: []
"Dz5,17":
  text: "Wówczas powstał arcykapłan i razem z nim ci wszyscy, którzy byli ze stronnictwa saduceuszów, i napełnieni zazdrością,"
  tags: []
"Dz5,18":
  text: "Pochwycili w swe ręce apostołów, i umieścili ich w publicznym więzieniu."
  tags: []
"Dz5,19":
  text: "Lecz anioł PANA w nocy otworzył drzwi więzienia, wyprowadził ich i powiedział:"
  tags: []
"Dz5,20":
  text: "Idźcie, stańcie i głoście ludowi w świątyni wszystkie słowa tego życia."
  tags: []
"Dz5,21":
  text: "Posłuchali więc tego, weszli o świcie do świątyni i nauczali. A gdy przyszedł arcykapłan i ci, którzy razem z nim byli, zwołali Sanhedryn i całą starszyznę synów Izraela, posyłając do więzienia, aby ich przyprowadzono."
  tags: []
"Dz5,22":
  text: "Podwładni jednak gdy tam przybyli, nie znaleźli ich w więzieniu, zawrócili więc, i oznajmili o tym, mówiąc:"
  tags: []
"Dz5,23":
  text: "Więzienie wprawdzie znaleźliśmy zamknięte z całą starannością i strażników na zewnątrz stojących przed bramą, lecz gdy je otworzyliśmy, nikogo wewnątrz nie znaleźliśmy."
  tags: []
"Dz5,24":
  text: "Gdy więc usłyszeli te słowa, arcykapłan i dowódca straży świątynnej oraz arcykapłani, byli w niepewności co do nich, bo nie rozumieli, co tam się stało."
  tags: []
"Dz5,25":
  text: "I gdy przyszedł ktoś, oznajmił im, mówiąc: Oto mężowie, których umieściliście w więzieniu, są w świątyni, stojąc i nauczając lud."
  tags: []
"Dz5,26":
  text: "Wtedy poszedł dowódca straży z podwładnymi i przyprowadził ich bez użycia siły, bali się bowiem ludu, aby nie zostali ukamienowani."
  tags: []
"Dz5,27":
  text: "A gdy ich przyprowadzili, postawili przed Sanhedrynem; i arcykapłan wypytywał ich,"
  tags: []
"Dz5,28":
  text: "Mówiąc: Czy surowo wam nie nakazaliśmy, abyście nie nauczali w tym imieniu? A oto swoją nauką napełniliście Jerozolimę i chcecie sprowadzić na nas krew tego człowieka."
  tags: []
"Dz5,29":
  text: "A w odpowiedzi, Piotr i apostołowie powiedzieli: Trzeba bardziej być posłusznym Bogu niż ludziom."
  tags: []
"Dz5,30":
  text: "Bóg naszych ojców wzbudził Jezusa, którego wy własnymi rękami zabiliście, zawieszając na drzewie."
  tags: []
"Dz5,31":
  text: "Tego, Wodza i Zbawiciela, Bóg wywyższył swoją prawicą, aby dać Izraelowi upamiętanie i odpuszczenie grzechów."
  tags: []
"Dz5,32":
  text: "A my jesteśmy Jego świadkami, i tych słów, a także Duch Święty, którego Bóg dał tym, którzy są Mu posłuszni."
  tags: []
"Dz5,33":
  text: "A oni, gdy to usłyszeli, byli wzburzeni ze złości i naradzali się, jak ich zabić."
  tags: []
"Dz5,34":
  text: "Powstał jednak w Sanhedrynie pewien faryzeusz, o imieniu Gamaliel, nauczyciel Prawa, poważany przez cały lud, rozkazując, aby na małą chwilę wyprowadzono na zewnątrz apostołów;"
  tags: []
"Dz5,35":
  text: "I powiedział do nich: Mężowie Izraelici! Zastanówcie się sami dobrze, co macie uczynić z tymi ludźmi."
  tags: []
"Dz5,36":
  text: "Niedawno bowiem powstał Teudas, który mówił o sobie, że jest kimś; przyłączyła się do niego liczba około czterystu mężów; tego zabito, i wszyscy, ilu ich było przez niego przekonanych, rozproszyli się i nikt z nich nie został."
  tags: []
"Dz5,37":
  text: "Po nim, w dniach spisu powstał Judasz Galilejczyk i pociągnął za sobą dość liczny lud; ale i on zginął, a wszyscy, ilu ich było przez niego przekonanych, zostali rozproszeni."
  tags: []
"Dz5,38":
  text: "A teraz wam to mówię: Odstąpcie od tych ludzi i zostawcie ich; jeśli bowiem z ludzi jest ten zamysł albo to dzieło, zostanie zniszczone;"
  tags: []
"Dz5,39":
  text: "Jeśli jednak jest z Boga, nie możecie ich zniszczyć; i abyście się czasem nie okazali ludźmi walczącymi przeciw Bogu."
  tags: []
"Dz5,40":
  text: "I zostali przez niego przekonani; a gdy zawołali apostołów, wychłostali ich, zakazując im przemawiać w imieniu Jezusa; i wypuścili ich."
  tags: []
"Dz5,41":
  text: "Ci więc odeszli sprzed oblicza Sanhedrynu, radując się, że zostali uznani za godnych, aby znosić hańbę dla Jego imienia."
  tags: []
"Dz5,42":
  text: "I nie przestawali każdego dnia w świątyni i w domach nauczać, i głosić dobrą nowinę Jezusa Chrystusa."
  tags: []
