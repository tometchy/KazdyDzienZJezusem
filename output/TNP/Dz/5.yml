"Dz5,1": "A pewien mąż, o imieniu Ananiasz, ze swoją żoną Safirą, sprzedał posiadłość,"
"Dz5,2": "I za wiedzą swojej żony przywłaszczył sobie część zapłaty, a jakąś część z niej położył u stóp apostołów."
"Dz5,3": "A Piotr powiedział: Ananiaszu! Czym to szatan napełnił twoje serce, że skłamałeś Duchowi Świętemu i przywłaszczyłeś sobie część zapłaty za pole?"
"Dz5,4": "Czy pozostając twoją, nie należała do ciebie? A po sprzedaniu, zapłata nie była w twej władzy? Dlaczego tę rzecz dopuściłeś do swojego serca? Skłamałeś nie ludziom, lecz Bogu."
"Dz5,5": "A Ananiasz, słysząc te słowa, padł i wyzionął ducha. I wielki strach ogarnął wszystkich, którzy to słyszeli."
"Dz5,6": "Młodsi natomiast, wstali, owinęli go, wynieśli i pogrzebali."
"Dz5,7": "A stało się po upływie około trzech godzin, że jego żona weszła, nie wiedząc, co się stało."
"Dz5,8": "I Piotr powiedział do niej: Powiedz mi, czy za tyle sprzedaliście tę rolę? A ona powiedziała: Tak, za tyle."
"Dz5,9": "A Piotr powiedział do niej: Dlaczego zmówiliście się między sobą, aby wystawiać na próbę Ducha PANA? Oto stopy tych, którzy pogrzebali twojego męża są u drzwi, wyniosą i ciebie."
"Dz5,10": "I padła zaraz przed jego stopami, i wyzionęła ducha. A gdy młodzieńcy weszli, znaleźli ją martwą, wynieśli i pogrzebali obok jej męża."
"Dz5,11": "I wielki strach ogarnął całe zgromadzenie i wszystkich, którzy to słyszeli."
"Dz5,12": "A przez ręce apostołów działo się wiele znaków i cudów wśród ludu i byli wszyscy jednomyślnie w portyku Salomona."
"Dz5,13": "A z pozostałych nikt nie śmiał przyłączyć się do nich; ale lud ich wysoko cenił."
"Dz5,14": "Coraz więcej też przybywało wierzących Panu, mnóstwo mężczyzn, a także i kobiet,"
"Dz5,15": "Tak że na ulice wynoszono chorych i kładziono ich na posłaniach i na matach, aby przynajmniej cień idącego Piotra zacienił kogoś z nich."
"Dz5,16": "Schodziło się również mnóstwo ludzi z okolicznych miast do Jerozolimy, przynosząc chorych i dręczonych przez duchy nieczyste; i wszyscy oni byli uzdrawiani."
"Dz5,17": "Wówczas powstał arcykapłan i razem z nim ci wszyscy, którzy byli ze stronnictwa saduceuszów, i napełnieni zazdrością,"
"Dz5,18": "Pochwycili w swe ręce apostołów, i umieścili ich w publicznym więzieniu."
"Dz5,19": "Lecz anioł PANA w nocy otworzył drzwi więzienia, wyprowadził ich i powiedział:"
"Dz5,20": "Idźcie, stańcie i głoście ludowi w świątyni wszystkie słowa tego życia."
"Dz5,21": "Posłuchali więc tego, weszli o świcie do świątyni i nauczali. A gdy przyszedł arcykapłan i ci, którzy razem z nim byli, zwołali Sanhedryn i całą starszyznę synów Izraela, posyłając do więzienia, aby ich przyprowadzono."
"Dz5,22": "Podwładni jednak gdy tam przybyli, nie znaleźli ich w więzieniu, zawrócili więc, i oznajmili o tym, mówiąc:"
"Dz5,23": "Więzienie wprawdzie znaleźliśmy zamknięte z całą starannością i strażników na zewnątrz stojących przed bramą, lecz gdy je otworzyliśmy, nikogo wewnątrz nie znaleźliśmy."
"Dz5,24": "Gdy więc usłyszeli te słowa, arcykapłan i dowódca straży świątynnej oraz arcykapłani, byli w niepewności co do nich, bo nie rozumieli, co tam się stało."
"Dz5,25": "I gdy przyszedł ktoś, oznajmił im, mówiąc: Oto mężowie, których umieściliście w więzieniu, są w świątyni, stojąc i nauczając lud."
"Dz5,26": "Wtedy poszedł dowódca straży z podwładnymi i przyprowadził ich bez użycia siły, bali się bowiem ludu, aby nie zostali ukamienowani."
"Dz5,27": "A gdy ich przyprowadzili, postawili przed Sanhedrynem; i arcykapłan wypytywał ich,"
"Dz5,28": "Mówiąc: Czy surowo wam nie nakazaliśmy, abyście nie nauczali w tym imieniu? A oto swoją nauką napełniliście Jerozolimę i chcecie sprowadzić na nas krew tego człowieka."
"Dz5,29": "A w odpowiedzi, Piotr i apostołowie powiedzieli: Trzeba bardziej być posłusznym Bogu niż ludziom."
"Dz5,30": "Bóg naszych ojców wzbudził Jezusa, którego wy własnymi rękami zabiliście, zawieszając na drzewie."
"Dz5,31": "Tego, Wodza i Zbawiciela, Bóg wywyższył swoją prawicą, aby dać Izraelowi upamiętanie i odpuszczenie grzechów."
"Dz5,32": "A my jesteśmy Jego świadkami, i tych słów, a także Duch Święty, którego Bóg dał tym, którzy są Mu posłuszni."
"Dz5,33": "A oni, gdy to usłyszeli, byli wzburzeni ze złości i naradzali się, jak ich zabić."
"Dz5,34": "Powstał jednak w Sanhedrynie pewien faryzeusz, o imieniu Gamaliel, nauczyciel Prawa, poważany przez cały lud, rozkazując, aby na małą chwilę wyprowadzono na zewnątrz apostołów;"
"Dz5,35": "I powiedział do nich: Mężowie Izraelici! Zastanówcie się sami dobrze, co macie uczynić z tymi ludźmi."
"Dz5,36": "Niedawno bowiem powstał Teudas, który mówił o sobie, że jest kimś; przyłączyła się do niego liczba około czterystu mężów; tego zabito, i wszyscy, ilu ich było przez niego przekonanych, rozproszyli się i nikt z nich nie został."
"Dz5,37": "Po nim, w dniach spisu powstał Judasz Galilejczyk i pociągnął za sobą dość liczny lud; ale i on zginął, a wszyscy, ilu ich było przez niego przekonanych, zostali rozproszeni."
"Dz5,38": "A teraz wam to mówię: Odstąpcie od tych ludzi i zostawcie ich; jeśli bowiem z ludzi jest ten zamysł albo to dzieło, zostanie zniszczone;"
"Dz5,39": "Jeśli jednak jest z Boga, nie możecie ich zniszczyć; i abyście się czasem nie okazali ludźmi walczącymi przeciw Bogu."
"Dz5,40": "I zostali przez niego przekonani; a gdy zawołali apostołów, wychłostali ich, zakazując im przemawiać w imieniu Jezusa; i wypuścili ich."
"Dz5,41": "Ci więc odeszli sprzed oblicza Sanhedrynu, radując się, że zostali uznani za godnych, aby znosić hańbę dla Jego imienia."
"Dz5,42": "I nie przestawali każdego dnia w świątyni i w domach nauczać, i głosić dobrą nowinę Jezusa Chrystusa."
