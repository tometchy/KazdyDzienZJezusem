"Dz20,1": "A gdy ustał już zamęt, Paweł przywołał do siebie uczniów i pożegnał się z nimi, i wyszedł stamtąd, aby udać się do Macedonii."
"Dz20,2": "A przechodząc przez tamte regiony, zachęcając ich niejednym słowem, przyszedł do Grecji."
"Dz20,3": "Tam też spędził trzy miesiące; a ponieważ Żydzi uczynili spisek, gdy miał płynąć do Syrii, postanowił powrócić przez Macedonię."
"Dz20,4": "A towarzyszył mu aż do Azji Sopater Berejczyk, a z Tesaloniczan Arystarch i Sekundus, i Gajusz z Derbe, i Tymoteusz, a z Azji Tychikus i Trofim."
"Dz20,5": "Ci poszli naprzód i oczekiwali na nas w Troadzie."
"Dz20,6": "A my po dniach Przaśników odpłynęliśmy z Filippi, a piątego dnia przybyliśmy do nich do Troady, gdzie spędziliśmy siedem dni."
"Dz20,7": "A pierwszego dnia po sabacie, gdy uczniowie zgromadzili się by łamać chleb, Paweł rozprawiał z nimi, zamierzając odejść następnego dnia, przeciągnął tę mowę aż do północy."
"Dz20,8": "A było wiele lamp w sali na piętrze, gdzie byli zgromadzeni."
"Dz20,9": "Wówczas pewien młodzieniec, o imieniu Eutychos, siedząc na oknie, zmorzony głębokim snem, gdy Paweł tak długo wykładał, pogrążony we śnie spadł na dół z trzeciego piętra i został podniesiony martwy."
"Dz20,10": "A Paweł zszedł na dół, przypadł do niego, objął go i powiedział: Nie czyńcie zgiełku, bo jego dusza jest nadal w nim."
"Dz20,11": "A gdy wszedł na górę, złamał chleb i skosztował, i jeszcze długo z nimi rozmawiał, aż do świtu – i tak odszedł."
"Dz20,12": "I przyprowadzili tego chłopca żywego, i doznali niemałej zachęty."
"Dz20,13": "Natomiast my wcześniej przyszliśmy na okręt i wypłynęliśmy do Assos, aby stamtąd zabrać Pawła; bowiem tak rozporządził, sam zamierzając iść pieszo."
"Dz20,14": "A gdy się z nami spotkał w Assos, zabraliśmy go i przybyliśmy do Mityleny."
"Dz20,15": "I odpłynęliśmy stamtąd następnego dnia, i przybyliśmy naprzeciw Chios, a na drugi dzień przypłynęliśmy do Samos, i pozostaliśmy w Trogillium, nazajutrz przybyliśmy do Miletu."
"Dz20,16": "Albowiem Paweł postanowił minąć Efez, aby nie przyszło mu tracić czasu w Azji; albowiem śpieszył się, aby jeśli to możliwe, na dzień Pięćdziesiątnicy być w Jerozolimie."
"Dz20,17": "A z Miletu posłał do Efezu i przywołał do siebie starszych zboru."
"Dz20,18": "A gdy przyszli do niego, powiedział im: Wy od pierwszego dnia, gdy przyszedłem do Azji wiecie, jak z wami cały ten czas byłem,"
"Dz20,19": "Służąc Panu z całą pokorą wśród wielu łez i prób, które na mnie przychodziły z powodu spisków żydowskich,"
"Dz20,20": "Jak nie powstrzymałem się, aby oznajmiać wam i nauczyć was, zarówno publicznie jak i po domach tego, co pożyteczne,"
"Dz20,21": "Wydając świadectwo Żydom i Grekom o upamiętaniu wobec Boga i o wierze w Pana naszego, Jezusa Mesjasza."
"Dz20,22": "I oto teraz ja, związany w duchu, idę do Jerozolimy, nie wiedząc co mnie w niej spotka;"
"Dz20,23": "Oprócz tego, że Duch Święty co miasto poświadcza, mówiąc, że czekają mnie więzy i ucisk."
"Dz20,24": "Lecz o swoim życiu nie mówię ani jednego słowa, ani go sobie nie cenię, bylebym tylko z radością dokończył swój bieg i służbę, którą otrzymałem od Pana Jezusa, żeby świadczyć o Ewangelii łaski Boga."
"Dz20,25": "A oto teraz ja wiem, że już więcej nie zobaczycie mojego oblicza wy wszyscy, wśród których przeszedłem, ogłaszając Królestwo Boże."
"Dz20,26": "Dlatego świadczę wam w dzisiejszym dniu, że jestem nieskalany niczyją krwią."
"Dz20,27": "Nie powstrzymywałem się bowiem od oznajmienia wam całego planu Boga."
"Dz20,28": "Uważajcie więc na siebie samych i na całe stadko, w którym was Duch Święty ustanowił biskupami, abyście paśli zbór Boga, nabyty własną Jego krwią."
"Dz20,29": "Ja bowiem wiem to, że po moim odejściu wejdą do was wilki drapieżne, nie oszczędzając stadka."
"Dz20,30": "I spośród was samych powstaną mężowie, mówiący rzeczy przewrotne, aby pociągnąć za sobą uczniów."
"Dz20,31": "Dlatego czuwajcie, pamiętając, że przez trzy lata nocami i dniami nie przestawałem ze łzami napominać każdego z was."
"Dz20,32": "A teraz, bracia, powierzam was Bogu i słowu Jego łaski, które jest w stanie zbudować i dać wam dziedzictwo między wszystkimi uświęconymi."
"Dz20,33": "Srebra, ani złota, ani niczyjego odzienia nie pożądałem;"
"Dz20,34": "Sami przecież wiecie, że moim potrzebom i tych, którzy są ze mną, służyły te ręce."
"Dz20,35": "We wszystkim wam pokazałem, że tak trudząc się, należy pomagać słabym i pamiętać o Słowach Pana Jezusa, bo to On powiedział: Bardziej błogosławione jest dawać niż brać."
"Dz20,36": "A gdy to powiedział, padł na swoje kolana i pomodlił się z nimi wszystkimi."
"Dz20,37": "Wtedy wszyscy wybuchnęli wielkim płaczem, i rzucając się Pawłowi na szyję, całowali go,"
"Dz20,38": "Odczuwając ból najbardziej z powodu słowa, które powiedział, że już więcej nie mają widzieć jego oblicza. I odprowadzili go na statek."
