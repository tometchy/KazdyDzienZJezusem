"Dz20,1":
  text: "A gdy ustał już zamęt, Paweł przywołał do siebie uczniów i pożegnał się z nimi, i wyszedł stamtąd, aby udać się do Macedonii."
  tags: []
"Dz20,2":
  text: "A przechodząc przez tamte regiony, zachęcając ich niejednym słowem, przyszedł do Grecji."
  tags: []
"Dz20,3":
  text: "Tam też spędził trzy miesiące; a ponieważ Żydzi uczynili spisek, gdy miał płynąć do Syrii, postanowił powrócić przez Macedonię."
  tags: []
"Dz20,4":
  text: "A towarzyszył mu aż do Azji Sopater Berejczyk, a z Tesaloniczan Arystarch i Sekundus, i Gajusz z Derbe, i Tymoteusz, a z Azji Tychikus i Trofim."
  tags: []
"Dz20,5":
  text: "Ci poszli naprzód i oczekiwali na nas w Troadzie."
  tags: []
"Dz20,6":
  text: "A my po dniach Przaśników odpłynęliśmy z Filippi, a piątego dnia przybyliśmy do nich do Troady, gdzie spędziliśmy siedem dni."
  tags: []
"Dz20,7":
  text: "A pierwszego dnia po sabacie, gdy uczniowie zgromadzili się by łamać chleb, Paweł rozprawiał z nimi, zamierzając odejść następnego dnia, przeciągnął tę mowę aż do północy."
  tags: []
"Dz20,8":
  text: "A było wiele lamp w sali na piętrze, gdzie byli zgromadzeni."
  tags: []
"Dz20,9":
  text: "Wówczas pewien młodzieniec, o imieniu Eutychos, siedząc na oknie, zmorzony głębokim snem, gdy Paweł tak długo wykładał, pogrążony we śnie spadł na dół z trzeciego piętra i został podniesiony martwy."
  tags: []
"Dz20,10":
  text: "A Paweł zszedł na dół, przypadł do niego, objął go i powiedział: Nie czyńcie zgiełku, bo jego dusza jest nadal w nim."
  tags: []
"Dz20,11":
  text: "A gdy wszedł na górę, złamał chleb i skosztował, i jeszcze długo z nimi rozmawiał, aż do świtu – i tak odszedł."
  tags: []
"Dz20,12":
  text: "I przyprowadzili tego chłopca żywego, i doznali niemałej zachęty."
  tags: []
"Dz20,13":
  text: "Natomiast my wcześniej przyszliśmy na okręt i wypłynęliśmy do Assos, aby stamtąd zabrać Pawła; bowiem tak rozporządził, sam zamierzając iść pieszo."
  tags: []
"Dz20,14":
  text: "A gdy się z nami spotkał w Assos, zabraliśmy go i przybyliśmy do Mityleny."
  tags: []
"Dz20,15":
  text: "I odpłynęliśmy stamtąd następnego dnia, i przybyliśmy naprzeciw Chios, a na drugi dzień przypłynęliśmy do Samos, i pozostaliśmy w Trogillium, nazajutrz przybyliśmy do Miletu."
  tags: []
"Dz20,16":
  text: "Albowiem Paweł postanowił minąć Efez, aby nie przyszło mu tracić czasu w Azji; albowiem śpieszył się, aby jeśli to możliwe, na dzień Pięćdziesiątnicy być w Jerozolimie."
  tags: []
"Dz20,17":
  text: "A z Miletu posłał do Efezu i przywołał do siebie starszych zboru."
  tags: []
"Dz20,18":
  text: "A gdy przyszli do niego, powiedział im: Wy od pierwszego dnia, gdy przyszedłem do Azji wiecie, jak z wami cały ten czas byłem,"
  tags: []
"Dz20,19":
  text: "Służąc Panu z całą pokorą wśród wielu łez i prób, które na mnie przychodziły z powodu spisków żydowskich,"
  tags: []
"Dz20,20":
  text: "Jak nie powstrzymałem się, aby oznajmiać wam i nauczyć was, zarówno publicznie jak i po domach tego, co pożyteczne,"
  tags: []
"Dz20,21":
  text: "Wydając świadectwo Żydom i Grekom o upamiętaniu wobec Boga i o wierze w Pana naszego, Jezusa Mesjasza."
  tags: []
"Dz20,22":
  text: "I oto teraz ja, związany w duchu, idę do Jerozolimy, nie wiedząc co mnie w niej spotka;"
  tags: []
"Dz20,23":
  text: "Oprócz tego, że Duch Święty co miasto poświadcza, mówiąc, że czekają mnie więzy i ucisk."
  tags: []
"Dz20,24":
  text: "Lecz o swoim życiu nie mówię ani jednego słowa, ani go sobie nie cenię, bylebym tylko z radością dokończył swój bieg i służbę, którą otrzymałem od Pana Jezusa, żeby świadczyć o Ewangelii łaski Boga."
  tags: []
"Dz20,25":
  text: "A oto teraz ja wiem, że już więcej nie zobaczycie mojego oblicza wy wszyscy, wśród których przeszedłem, ogłaszając Królestwo Boże."
  tags: []
"Dz20,26":
  text: "Dlatego świadczę wam w dzisiejszym dniu, że jestem nieskalany niczyją krwią."
  tags: []
"Dz20,27":
  text: "Nie powstrzymywałem się bowiem od oznajmienia wam całego planu Boga."
  tags: []
"Dz20,28":
  text: "Uważajcie więc na siebie samych i na całe stadko, w którym was Duch Święty ustanowił biskupami, abyście paśli zbór Boga, nabyty własną Jego krwią."
  tags: []
"Dz20,29":
  text: "Ja bowiem wiem to, że po moim odejściu wejdą do was wilki drapieżne, nie oszczędzając stadka."
  tags: []
"Dz20,30":
  text: "I spośród was samych powstaną mężowie, mówiący rzeczy przewrotne, aby pociągnąć za sobą uczniów."
  tags: []
"Dz20,31":
  text: "Dlatego czuwajcie, pamiętając, że przez trzy lata nocami i dniami nie przestawałem ze łzami napominać każdego z was."
  tags: []
"Dz20,32":
  text: "A teraz, bracia, powierzam was Bogu i słowu Jego łaski, które jest w stanie zbudować i dać wam dziedzictwo między wszystkimi uświęconymi."
  tags: []
"Dz20,33":
  text: "Srebra, ani złota, ani niczyjego odzienia nie pożądałem;"
  tags: []
"Dz20,34":
  text: "Sami przecież wiecie, że moim potrzebom i tych, którzy są ze mną, służyły te ręce."
  tags: []
"Dz20,35":
  text: "We wszystkim wam pokazałem, że tak trudząc się, należy pomagać słabym i pamiętać o Słowach Pana Jezusa, bo to On powiedział: Bardziej błogosławione jest dawać niż brać."
  tags: []
"Dz20,36":
  text: "A gdy to powiedział, padł na swoje kolana i pomodlił się z nimi wszystkimi."
  tags: []
"Dz20,37":
  text: "Wtedy wszyscy wybuchnęli wielkim płaczem, i rzucając się Pawłowi na szyję, całowali go,"
  tags: []
"Dz20,38":
  text: "Odczuwając ból najbardziej z powodu słowa, które powiedział, że już więcej nie mają widzieć jego oblicza. I odprowadzili go na statek."
  tags: []
