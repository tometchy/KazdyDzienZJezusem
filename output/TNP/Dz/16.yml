"Dz16,1": "I przyszedł do Derbe i do Listry; a oto był tam pewien uczeń, o imieniu Tymoteusz, syn pewnej wierzącej żydowskiej kobiety i ojca Greka,"
"Dz16,2": "Któremu bracia w Listrze i w Ikonium wydali dobre świadectwo."
"Dz16,3": "Paweł chciał, aby ten razem z nim szedł, wziął go więc i obrzezał ze względu na Żydów, będących w tych miejscach; bo wszyscy wiedzieli, że jego ojciec był Grekiem."
"Dz16,4": "A gdy przechodzili przez miasta, przekazywali im do przestrzegania postanowienia powzięte przez apostołów i starszych w Jerozolimie."
"Dz16,5": "Toteż zbory prawdziwie utwierdzały się w wierze i z każdym dniem wzrastały liczebnie."
"Dz16,6": "A gdy przeszli Frygię i krainę Galacką, zostali powstrzymani przez Ducha Świętego, przed powiedzeniem Słowa Bożego w Azji,"
"Dz16,7": "A gdy przybyli do Mizji, próbowali wyruszyć do Bitynii, lecz Duch im nie pozwolił."
"Dz16,8": "A gdy minęli Mizję, zeszli do Troady."
"Dz16,9": "I Paweł ujrzał w nocy widzenie: Pewien mężczyzna, Macedończyk, stał i prosił go, mówiąc: Przepraw się do Macedonii i pomóż nam."
"Dz16,10": "A gdy on ujrzał tę wizję, zaraz chcieliśmy udać się do Macedonii, wspólnie wnioskując, że Pan nas wezwał, abyśmy im głosili dobrą nowinę."
"Dz16,11": "Wyruszyliśmy więc z Troady, płynęliśmy wprost na Samotrakę, a następnego dnia do Neapolu,"
"Dz16,12": "A stamtąd do Filippi, które jest kolonią rzymską, przodującym miastem okręgu Macedonii; i spędziliśmy w tym mieście kilka dni."
"Dz16,13": "A w dzień szabatu wyszliśmy poza miasto nad rzekę, gdzie jak sądziliśmy odbywały się modlitwy, i gdy usiedliśmy, przemówiliśmy do kobiet, które się zeszły."
"Dz16,14": "A przysłuchiwała się temu pewna kobieta, czcząca Boga, o imieniu Lidia, która sprzedawała purpurę z miasta Tiatyra, której Pan otworzył serce, aby uważnie słuchała tego, co mówił Paweł."
"Dz16,15": "A gdy została ochrzczona ona i jej dom, prosiła, mówiąc: Jeżeli uznaliście, że jestem wierzącą w Pana, wejdźcie do mojego domu i zatrzymajcie się. I przymusiła nas."
"Dz16,16": "I stało się, gdy szliśmy na miejsce modlitwy, że wyszła nam naprzeciw pewna służąca, mająca ducha wieszczego, która wieszcząc, przynosiła wielki zysk swoim panom."
"Dz16,17": "Ta, chodząc za Pawłem i za nami, wołała, mówiąc: Ci ludzie są sługami Boga Najwyższego, którzy głoszą nam drogę zbawienia."
"Dz16,18": "A czyniła to przez wiele dni; ale Paweł, udręczony tym odwrócił się i powiedział duchowi: Rozkazuję ci w imieniu Jezusa Chrystusa, abyś wyszedł z niej. I w tej chwili wyszedł."
"Dz16,19": "A jej panowie, widząc, że zginęła nadzieja ich zysku, pojmali Pawła i Sylasa i powlekli ich na rynek przed przełożonych;"
"Dz16,20": "I postawili ich przed sprawującymi władzę, mówiąc: Ci ludzie, będąc Żydami, niepokoją nasze miasto,"
"Dz16,21": "I głoszą zwyczaje, których nam nie wolno przyjmować ani czynić, bo jesteśmy Rzymianami."
"Dz16,22": "I wraz z nimi wystąpił przeciwko nim tłum, a sprawujący władzę zdarli z nich szaty i rozkazali ich wychłostać."
"Dz16,23": "I gdy im zadali wiele razów, wrzucili ich do więzienia i nakazali stróżowi więzienia, aby ich bacznie strzegł."
"Dz16,24": "Ten, gdy otrzymał taki rozkaz, wtrącił ich do wewnętrznej części więzienia, a nogi ich zakuł w drewniane dyby."
"Dz16,25": "A około północy, Paweł i Sylas modląc się, śpiewali hymny Bogu, a więźniowie przysłuchiwali się im."
"Dz16,26": "I nagle nastąpiło wielkie trzęsienie ziemi, aż się zatrzęsły fundamenty więzienia i natychmiast otworzyły się wszystkie drzwi, i wszystkie więzy zostały rozluźnione."
"Dz16,27": "A gdy został zbudzony stróż więzienia, widząc otwarte drzwi więzienia, dobył miecza i zamierzał się zabić, sądząc, że więźniowie pouciekali."
"Dz16,28": "Lecz Paweł zawołał potężnym głosem, mówiąc: Nie czyń sobie nic złego, bo jesteśmy tu wszyscy."
"Dz16,29": "I zażądał światła, wskoczył i drżący przypadł do nóg Pawła i Sylasa."
"Dz16,30": "I gdy wyprowadził ich na zewnątrz, powiedział: Panowie! Co mam czynić, abym został zbawiony?"
"Dz16,31": "A oni powiedzieli: Uwierz w Pana Jezusa Chrystusa, a zostaniesz zbawiony ty i twój dom."
"Dz16,32": "I opowiedzieli mu Słowo Pana i wszystkim, którzy byli w jego domu."
"Dz16,33": "I przyjął ich w tej godzinie, w nocy, obmył ich rany po razach i natychmiast został ochrzczony, on i wszyscy jego domownicy."
"Dz16,34": "Wprowadził ich też do swojego domu, zastawił im stół i weselił się z całym swoim domem, że uwierzył Bogu."
"Dz16,35": "A gdy nastał dzień, sprawujący władzę posłali liktorów, mówiąc: Wypuść tych ludzi."
"Dz16,36": "Stróż więzienia z kolei oznajmił te słowa Pawłowi: Sprawujący władzę przysłali ludzi, abyście zostali zwolnieni; teraz więc wyjdźcie i idźcie w pokoju."
"Dz16,37": "Lecz Paweł powiedział im: Wychłostali nas, ludzi będących Rzymianami, publicznie, bez sądu, i wrzucili do więzienia; a teraz potajemnie nas wypędzają? O nie! Ale niech sami przyjdą i nas wyprowadzą."
"Dz16,38": "Wtedy liktorzy powiedzieli te słowa sprawującym władzę. A ci zlękli się, słysząc, że są Rzymianami."
"Dz16,39": "A gdy przyszli, wezwali ich, a wyprowadzając, prosili, by wyszli z miasta."
"Dz16,40": "Po wyjściu z więzienia wstąpili do Lidii, a gdy zobaczyli braci, zachęcili ich i odeszli."
