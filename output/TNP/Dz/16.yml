"Dz16,1":
  text: "I przyszedł do Derbe i do Listry; a oto był tam pewien uczeń, o imieniu Tymoteusz, syn pewnej wierzącej żydowskiej kobiety i ojca Greka,"
  tags: []
"Dz16,2":
  text: "Któremu bracia w Listrze i w Ikonium wydali dobre świadectwo."
  tags: []
"Dz16,3":
  text: "Paweł chciał, aby ten razem z nim szedł, wziął go więc i obrzezał ze względu na Żydów, będących w tych miejscach; bo wszyscy wiedzieli, że jego ojciec był Grekiem."
  tags: []
"Dz16,4":
  text: "A gdy przechodzili przez miasta, przekazywali im do przestrzegania postanowienia powzięte przez apostołów i starszych w Jerozolimie."
  tags: []
"Dz16,5":
  text: "Toteż zbory prawdziwie utwierdzały się w wierze i z każdym dniem wzrastały liczebnie."
  tags: []
"Dz16,6":
  text: "A gdy przeszli Frygię i krainę Galacką, zostali powstrzymani przez Ducha Świętego, przed powiedzeniem Słowa Bożego w Azji,"
  tags: []
"Dz16,7":
  text: "A gdy przybyli do Mizji, próbowali wyruszyć do Bitynii, lecz Duch im nie pozwolił."
  tags: []
"Dz16,8":
  text: "A gdy minęli Mizję, zeszli do Troady."
  tags: []
"Dz16,9":
  text: "I Paweł ujrzał w nocy widzenie: Pewien mężczyzna, Macedończyk, stał i prosił go, mówiąc: Przepraw się do Macedonii i pomóż nam."
  tags: []
"Dz16,10":
  text: "A gdy on ujrzał tę wizję, zaraz chcieliśmy udać się do Macedonii, wspólnie wnioskując, że Pan nas wezwał, abyśmy im głosili dobrą nowinę."
  tags: []
"Dz16,11":
  text: "Wyruszyliśmy więc z Troady, płynęliśmy wprost na Samotrakę, a następnego dnia do Neapolu,"
  tags: []
"Dz16,12":
  text: "A stamtąd do Filippi, które jest kolonią rzymską, przodującym miastem okręgu Macedonii; i spędziliśmy w tym mieście kilka dni."
  tags: []
"Dz16,13":
  text: "A w dzień szabatu wyszliśmy poza miasto nad rzekę, gdzie jak sądziliśmy odbywały się modlitwy, i gdy usiedliśmy, przemówiliśmy do kobiet, które się zeszły."
  tags: []
"Dz16,14":
  text: "A przysłuchiwała się temu pewna kobieta, czcząca Boga, o imieniu Lidia, która sprzedawała purpurę z miasta Tiatyra, której Pan otworzył serce, aby uważnie słuchała tego, co mówił Paweł."
  tags: []
"Dz16,15":
  text: "A gdy została ochrzczona ona i jej dom, prosiła, mówiąc: Jeżeli uznaliście, że jestem wierzącą w Pana, wejdźcie do mojego domu i zatrzymajcie się. I przymusiła nas."
  tags: []
"Dz16,16":
  text: "I stało się, gdy szliśmy na miejsce modlitwy, że wyszła nam naprzeciw pewna służąca, mająca ducha wieszczego, która wieszcząc, przynosiła wielki zysk swoim panom."
  tags: []
"Dz16,17":
  text: "Ta, chodząc za Pawłem i za nami, wołała, mówiąc: Ci ludzie są sługami Boga Najwyższego, którzy głoszą nam drogę zbawienia."
  tags: []
"Dz16,18":
  text: "A czyniła to przez wiele dni; ale Paweł, udręczony tym odwrócił się i powiedział duchowi: Rozkazuję ci w imieniu Jezusa Chrystusa, abyś wyszedł z niej. I w tej chwili wyszedł."
  tags: []
"Dz16,19":
  text: "A jej panowie, widząc, że zginęła nadzieja ich zysku, pojmali Pawła i Sylasa i powlekli ich na rynek przed przełożonych;"
  tags: []
"Dz16,20":
  text: "I postawili ich przed sprawującymi władzę, mówiąc: Ci ludzie, będąc Żydami, niepokoją nasze miasto,"
  tags: []
"Dz16,21":
  text: "I głoszą zwyczaje, których nam nie wolno przyjmować ani czynić, bo jesteśmy Rzymianami."
  tags: []
"Dz16,22":
  text: "I wraz z nimi wystąpił przeciwko nim tłum, a sprawujący władzę zdarli z nich szaty i rozkazali ich wychłostać."
  tags: []
"Dz16,23":
  text: "I gdy im zadali wiele razów, wrzucili ich do więzienia i nakazali stróżowi więzienia, aby ich bacznie strzegł."
  tags: []
"Dz16,24":
  text: "Ten, gdy otrzymał taki rozkaz, wtrącił ich do wewnętrznej części więzienia, a nogi ich zakuł w drewniane dyby."
  tags: []
"Dz16,25":
  text: "A około północy, Paweł i Sylas modląc się, śpiewali hymny Bogu, a więźniowie przysłuchiwali się im."
  tags: []
"Dz16,26":
  text: "I nagle nastąpiło wielkie trzęsienie ziemi, aż się zatrzęsły fundamenty więzienia i natychmiast otworzyły się wszystkie drzwi, i wszystkie więzy zostały rozluźnione."
  tags: []
"Dz16,27":
  text: "A gdy został zbudzony stróż więzienia, widząc otwarte drzwi więzienia, dobył miecza i zamierzał się zabić, sądząc, że więźniowie pouciekali."
  tags: []
"Dz16,28":
  text: "Lecz Paweł zawołał potężnym głosem, mówiąc: Nie czyń sobie nic złego, bo jesteśmy tu wszyscy."
  tags: []
"Dz16,29":
  text: "I zażądał światła, wskoczył i drżący przypadł do nóg Pawła i Sylasa."
  tags: []
"Dz16,30":
  text: "I gdy wyprowadził ich na zewnątrz, powiedział: Panowie! Co mam czynić, abym został zbawiony?"
  tags: []
"Dz16,31":
  text: "A oni powiedzieli: Uwierz w Pana Jezusa Chrystusa, a zostaniesz zbawiony ty i twój dom."
  tags: []
"Dz16,32":
  text: "I opowiedzieli mu Słowo Pana i wszystkim, którzy byli w jego domu."
  tags: []
"Dz16,33":
  text: "I przyjął ich w tej godzinie, w nocy, obmył ich rany po razach i natychmiast został ochrzczony, on i wszyscy jego domownicy."
  tags: []
"Dz16,34":
  text: "Wprowadził ich też do swojego domu, zastawił im stół i weselił się z całym swoim domem, że uwierzył Bogu."
  tags: []
"Dz16,35":
  text: "A gdy nastał dzień, sprawujący władzę posłali liktorów, mówiąc: Wypuść tych ludzi."
  tags: []
"Dz16,36":
  text: "Stróż więzienia z kolei oznajmił te słowa Pawłowi: Sprawujący władzę przysłali ludzi, abyście zostali zwolnieni; teraz więc wyjdźcie i idźcie w pokoju."
  tags: []
"Dz16,37":
  text: "Lecz Paweł powiedział im: Wychłostali nas, ludzi będących Rzymianami, publicznie, bez sądu, i wrzucili do więzienia; a teraz potajemnie nas wypędzają? O nie! Ale niech sami przyjdą i nas wyprowadzą."
  tags: []
"Dz16,38":
  text: "Wtedy liktorzy powiedzieli te słowa sprawującym władzę. A ci zlękli się, słysząc, że są Rzymianami."
  tags: []
"Dz16,39":
  text: "A gdy przyszli, wezwali ich, a wyprowadzając, prosili, by wyszli z miasta."
  tags: []
"Dz16,40":
  text: "Po wyjściu z więzienia wstąpili do Lidii, a gdy zobaczyli braci, zachęcili ich i odeszli."
  tags: []
