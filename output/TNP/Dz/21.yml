"Dz21,1": "A gdy stało się, że odpłynęliśmy rozstając się z nimi, płynęliśmy prostym kursem i przybyliśmy na Kos, a następnego dnia na Rodos, a stamtąd do Patary,"
"Dz21,2": "A gdy znaleźliśmy statek płynący do Fenicji, wsiedliśmy na niego i odpłynęliśmy."
"Dz21,3": "Ukazał się nam Cypr, zostawiliśmy go po lewej stronie, płynąc do Syrii i przybyliśmy do Tyru; tam bowiem statek miał wyładować towar."
"Dz21,4": "A gdy odnaleźliśmy uczniów, pozostaliśmy tam przez siedem dni; a ci mówili Pawłowi za sprawą ducha, aby nie udawał się do Jerozolimy."
"Dz21,5": "Gdy więc skończyły się dni naszego pobytu, wyruszyliśmy i szliśmy odprowadzani przez wszystkich z żonami i z dziećmi aż poza miasto; uklękliśmy na wybrzeżu i pomodliliśmy się."
"Dz21,6": "A gdy pożegnaliśmy się nawzajem, weszliśmy na statek, a oni wrócili do swoich."
"Dz21,7": "A my, kończąc żeglugę z Tyru, przypłynęliśmy do Ptolemaidy, gdzie pozdrowiliśmy braci, pozostając u nich przez jeden dzień."
"Dz21,8": "A nazajutrz my, którzy byliśmy z Pawłem, wyszliśmy i przyszliśmy do Cezarei, i gdy weszliśmy do domu Filipa Ewangelisty, który był jednym z siedmiu, zostaliśmy u niego."
"Dz21,9": "A ten miał cztery córki, panny, które prorokowały."
"Dz21,10": "A gdy tam pozostawaliśmy przez szereg dni, przyszedł z Judei pewien prorok, o imieniu Agabus."
"Dz21,11": "Ten przyszedł do nas, i gdy wziął pas Pawła, związał sobie zarówno ręce i nogi, i powiedział: To mówi Duch Święty: Męża, którego jest ten pas, tak zwiążą w Jerozolimie Żydzi, i wydadzą go w ręce pogan."
"Dz21,12": "A gdy to usłyszeliśmy, prosiliśmy, i my i miejscowi, aby nie szedł do Jerozolimy."
"Dz21,13": "Paweł natomiast odpowiedział: Co czynicie, płacząc i łamiąc moje serce? Ja bowiem jestem gotów, nie tylko być związany, ale i umrzeć w Jerozolimie dla imienia Pana Jezusa."
"Dz21,14": "A gdy nie dał się przekonać, ucichliśmy, mówiąc: Niech się stanie wola Pana."
"Dz21,15": "A po upływie tych dni, przygotowaliśmy się do podróży i poszliśmy do Jerozolimy."
"Dz21,16": "A szli z nami także uczniowie z Cezarei, prowadząc nas do pewnego Cypryjczyka, Mnazona, już od dawna ucznia, u którego mieliśmy zostać ugoszczeni."
"Dz21,17": "A gdy znaleźliśmy się w Jerozolimie, bracia przyjęli nas z radością."
"Dz21,18": "A nazajutrz wszedł Paweł razem z nami do Jakuba, gdzie byli obecni wszyscy starsi."
"Dz21,19": "I gdy ich pozdrowił, opowiedział im po kolei, co Bóg uczynił wśród pogan przez jego służbę."
"Dz21,20": "Oni słysząc to, oddali chwałę Panu; powiedzieli mu także: Widzisz, bracie, jak wiele jest dziesiątków tysięcy Żydów, którzy uwierzyli, a wszyscy pozostają gorliwi wobec Prawa."
"Dz21,21": "O tobie jednak dowiedzieli się, że uczysz odstępstwa od Mojżesza wszystkich Żydów, którzy są między poganami, mówiąc, aby nie obrzezywali dzieci i nie zachowywali naszych zwyczajów."
"Dz21,22": "Co więc począć? Na pewno muszą się licznie zgromadzić, bo usłyszą, że przyszedłeś."
"Dz21,23": "Dlatego uczyń to, co ci mówimy: Są tutaj czterej mężczyźni, na których ciąży ślub;"
"Dz21,24": "Weź ich, daj się oczyścić z nimi i ponieś za nich koszty, aby ostrzygli głowy; i poznają wszyscy, że to, co o tobie się dowiedzieli, nic nie znaczy, lecz ty sam trzymasz się linii, przestrzegając Prawa."
"Dz21,25": "Co do tych natomiast, którzy uwierzyli z pogan, napisaliśmy, po rozsądzeniu, by niczego takiego nie zachowywali, by oni tylko wystrzegali się tego, co ofiarowane bożkom i krwi, i tego, co uduszone, i nierządu."
"Dz21,26": "Wtedy Paweł wziął z sobą owych mężczyzn, poddał się z nimi następnego dnia oczyszczeniu i wszedł do świątyni, zapowiadając wypełnienie dni oczyszczenia, dopóki za każdego z nich nie została złożona ofiara."
"Dz21,27": "A gdy miało się wypełnić te siedem dni, pewni Żydzi z Azji, widząc go w świątyni, wzburzyli cały lud i pochwycili go w swoje ręce,"
"Dz21,28": "Krzycząc: Mężowie Izraelici, pomóżcie! Oto jest człowiek, który przeciwko ludowi i Prawu, i temu miejscu wszystkich i wszędzie naucza; nadto jeszcze i Greków wprowadził do świątyni i zanieczyścił to święte miejsce."
"Dz21,29": "Przedtem bowiem widywali z nim w mieście Trofima z Efezu, o którym sądzili, że go Paweł wprowadził do świątyni."
"Dz21,30": "I poruszyło się całe miasto, i powstało zbiegowisko ludu; pojmali Pawła i wywlekli go na zewnątrz świątyni, i natychmiast bramy zostały zamknięte."
"Dz21,31": "A gdy usiłowali go zabić, doszła wieść do dowódcy kohorty, że wzburzona jest cała Jerozolima;"
"Dz21,32": "Ten natychmiast wziął ze sobą żołnierzy i setników, i przybiegł do nich. A oni, widząc dowódcę i żołnierzy, zaprzestali bić Pawła."
"Dz21,33": "Wtedy dowódca przybliżył się, pojmał go i kazał związać dwoma łańcuchami, i wypytywał się, kim jest i co zrobił?"
"Dz21,34": "A każdy coś innego wołał w tłumie; nie mogąc dowiedzieć się nic pewnego z powodu wrzawy, rozkazał by zaprowadzono go do twierdzy."
"Dz21,35": "A gdy stał na schodach, doszło do tego, że żołnierze musieli go nieść z powodu naporu ludu;"
"Dz21,36": "Podążało bowiem za nim mnóstwo ludu, wołając: Precz z nim!"
"Dz21,37": "A Paweł, gdy miał być wprowadzony do twierdzy, powiedział do dowódcy: Czy wolno mi powiedzieć coś do ciebie? A on powiedział: Znasz grecki?"
"Dz21,38": "Nie jesteś zatem tym Egipcjaninem, który niedawno wzniecił zamieszki i wyprowadził na pustynię cztery tysiące nożowników?"
"Dz21,39": "A Paweł powiedział: Ja w rzeczywistości jestem Żydem, człowiekiem z Tarsu, obywatelem znacznego miasta w Cylicji; proszę cię zatem, pozwól mi mówić do ludu."
"Dz21,40": "A gdy ten pozwolił, Paweł, stojąc na schodach, dał znak ręką ludowi. A gdy nastała wielka cisza, przemówił do nich w języku hebrajskim, mówiąc:"
