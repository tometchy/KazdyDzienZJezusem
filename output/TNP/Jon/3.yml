"Jon3,1":
  text: "I powtórnie stało się Słowo JHWH do Jonasza głoszące:"
  tags: []
"Jon3,2":
  text: "Wstań, idź do Niniwy, tego wielkiego miasta, i głoś do niej poselstwo, które ja mówię do ciebie."
  tags: []
"Jon3,3":
  text: "Jonasz więc wstał i poszedł do Niniwy, zgodnie ze Słowem JHWH. A Niniwa była wielkim miastem dla Boga, na trzy dni drogi pieszej."
  tags: []
"Jon3,4":
  text: "I Jonasz rozpoczął chodzić po mieście na jeden dzień drogi, i wołał, mówiąc: Jeszcze czterdzieści dni i Niniwa zostanie obrócona w ruinę."
  tags: []
"Jon3,5":
  text: "Wtedy ludzie z Niniwy uwierzyli w Boga, ogłosili post i przywdziali wory, od największego i aż do najmniejszego."
  tags: []
"Jon3,6":
  text: "A gdy sprawa ta doszła do króla Niniwy, wstał ze swojego tronu, zdjął swój płaszcz i okrył się worem, i usiadł w popiele."
  tags: []
"Jon3,7":
  text: "Ogłosił też i powiedział król i jego dostojnicy, mówiąc tak: Człowiek i zwierzę, bydło i owce niczego nie zjedzą, nie będą się pasły i nie będą piły wody!"
  tags: []
"Jon3,8":
  text: "Odzieją się w wory, człowiek jak i bydło, i z całej siły zawołają do Boga; zawróci też każdy ze swojej złej drogi i od bezprawia, które jest w jego rękach."
  tags: []
"Jon3,9":
  text: "Kto wie, może Bóg zawróci i zlituje się, odwróci się od zapalczywości swojego gniewu, i nie zginiemy?"
  tags: []
"Jon3,10":
  text: "A Bóg widział ich postępowanie, że zawrócili ze swojej złej drogi, wtedy użalił się Bóg nad nieszczęściem, o którym mówił, aby im uczynić, i nie uczynił tego."
  tags: []
