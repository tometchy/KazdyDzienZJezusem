"Jon3,1": "I powtórnie stało się Słowo JHWH do Jonasza głoszące:"
"Jon3,2": "Wstań, idź do Niniwy, tego wielkiego miasta, i głoś do niej poselstwo, które ja mówię do ciebie."
"Jon3,3": "Jonasz więc wstał i poszedł do Niniwy, zgodnie ze Słowem JHWH. A Niniwa była wielkim miastem dla Boga, na trzy dni drogi pieszej."
"Jon3,4": "I Jonasz rozpoczął chodzić po mieście na jeden dzień drogi, i wołał, mówiąc: Jeszcze czterdzieści dni i Niniwa zostanie obrócona w ruinę."
"Jon3,5": "Wtedy ludzie z Niniwy uwierzyli w Boga, ogłosili post i przywdziali wory, od największego i aż do najmniejszego."
"Jon3,6": "A gdy sprawa ta doszła do króla Niniwy, wstał ze swojego tronu, zdjął swój płaszcz i okrył się worem, i usiadł w popiele."
"Jon3,7": "Ogłosił też i powiedział król i jego dostojnicy, mówiąc tak: Człowiek i zwierzę, bydło i owce niczego nie zjedzą, nie będą się pasły i nie będą piły wody!"
"Jon3,8": "Odzieją się w wory, człowiek jak i bydło, i z całej siły zawołają do Boga; zawróci też każdy ze swojej złej drogi i od bezprawia, które jest w jego rękach."
"Jon3,9": "Kto wie, może Bóg zawróci i zlituje się, odwróci się od zapalczywości swojego gniewu, i nie zginiemy?"
"Jon3,10": "A Bóg widział ich postępowanie, że zawrócili ze swojej złej drogi, wtedy użalił się Bóg nad nieszczęściem, o którym mówił, aby im uczynić, i nie uczynił tego."
