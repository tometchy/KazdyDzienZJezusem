"Jon4,1": "I zasmuciło to Jonasza wielkim przygnębieniem, i zapłonął gniewem."
"Jon4,2": "I modlił się do JHWH, mówiąc: Ach, JHWH! Czy nie tak właśnie mówiłem, gdy jeszcze byłem w mojej ziemi? Dlatego uprzedzając, to uciekałem do Tarszisz; bo wiedziałem, że Ty jesteś Bogiem łaskawym i miłosiernym, nieskorym do gniewu i obfitującym w łaskę, i okazującym litość w nieszczęściu."
"Jon4,3": "A teraz, JHWH, proszę zabierz moją duszę ode mnie, bo lepiej mi umrzeć niż żyć."
"Jon4,4": "A JHWH odpowiedział: Czy to słusznie, tak płonąć gniewem?"
"Jon4,5": "Jonasz więc wyszedł z miasta i usiadł na wschód od miasta; i zrobił sobie tam szałas, i usiadł pod nim w cieniu, tak aby zobaczyć, co stanie się w mieście."
"Jon4,6": "A JHWH, Bóg, wyznaczył krzew rycynowy, aby wyrósł nad Jonaszem, dawał cień jego głowie i chronił go przed nieszczęściem. I Jonasz radował się z tego krzewu rycynowego radością wielką."
"Jon4,7": "I wyznaczył Bóg robaka, aby wyszedł o świcie następnego dnia i podgryzł krzew rycynowy, by usechł."
"Jon4,8": "I stało się, gdy zajaśniało słońce, wyznaczył Bóg suchy wiatr wschodni i słońce prażyło głowę Jonasza, tak że omdlewał i życzył sobie śmierci, mówiąc: Lepiej mi umrzeć, niż żyć."
"Jon4,9": "Wtedy powiedział Bóg do Jonasza:Czy to słuszne, aby tak płonąć gniewem z powodu krzewu rycynowego? A ten odpowiedział: Słusznie płonę gniewem, i to na śmierć."
"Jon4,10": "A JHWH powiedział: Ty żałujesz krzewu rycynowego, przy którym się nie trudziłeś i którego nie wyhodowałeś; zjawił się on jako syn nocy i jako syn nocy zginął,"
"Jon4,11": "A ja nie miałbym żałować Niniwy, tego wielkiego miasta, w którym jest więcej niż sto dwadzieścia tysięcy ludzi, którzy nie potrafią rozróżnić między swoją prawą ręką a lewą, i wiele bydła?"
