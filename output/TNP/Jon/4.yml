"Jon4,1":
  text: "I zasmuciło to Jonasza wielkim przygnębieniem, i zapłonął gniewem."
  tags: []
"Jon4,2":
  text: "I modlił się do JHWH, mówiąc: Ach, JHWH! Czy nie tak właśnie mówiłem, gdy jeszcze byłem w mojej ziemi? Dlatego uprzedzając, to uciekałem do Tarszisz; bo wiedziałem, że Ty jesteś Bogiem łaskawym i miłosiernym, nieskorym do gniewu i obfitującym w łaskę, i okazującym litość w nieszczęściu."
  tags: []
"Jon4,3":
  text: "A teraz, JHWH, proszę zabierz moją duszę ode mnie, bo lepiej mi umrzeć niż żyć."
  tags: []
"Jon4,4":
  text: "A JHWH odpowiedział: Czy to słusznie, tak płonąć gniewem?"
  tags: []
"Jon4,5":
  text: "Jonasz więc wyszedł z miasta i usiadł na wschód od miasta; i zrobił sobie tam szałas, i usiadł pod nim w cieniu, tak aby zobaczyć, co stanie się w mieście."
  tags: []
"Jon4,6":
  text: "A JHWH, Bóg, wyznaczył krzew rycynowy, aby wyrósł nad Jonaszem, dawał cień jego głowie i chronił go przed nieszczęściem. I Jonasz radował się z tego krzewu rycynowego radością wielką."
  tags: []
"Jon4,7":
  text: "I wyznaczył Bóg robaka, aby wyszedł o świcie następnego dnia i podgryzł krzew rycynowy, by usechł."
  tags: []
"Jon4,8":
  text: "I stało się, gdy zajaśniało słońce, wyznaczył Bóg suchy wiatr wschodni i słońce prażyło głowę Jonasza, tak że omdlewał i życzył sobie śmierci, mówiąc: Lepiej mi umrzeć, niż żyć."
  tags: []
"Jon4,9":
  text: "Wtedy powiedział Bóg do Jonasza:Czy to słuszne, aby tak płonąć gniewem z powodu krzewu rycynowego? A ten odpowiedział: Słusznie płonę gniewem, i to na śmierć."
  tags: []
"Jon4,10":
  text: "A JHWH powiedział: Ty żałujesz krzewu rycynowego, przy którym się nie trudziłeś i którego nie wyhodowałeś; zjawił się on jako syn nocy i jako syn nocy zginął,"
  tags: []
"Jon4,11":
  text: "A ja nie miałbym żałować Niniwy, tego wielkiego miasta, w którym jest więcej niż sto dwadzieścia tysięcy ludzi, którzy nie potrafią rozróżnić między swoją prawą ręką a lewą, i wiele bydła?"
  tags: []
