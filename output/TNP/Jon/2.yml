"Jon2,1": "Lecz JHWH wyznaczył wielką rybę, aby połknęła Jonasza. I był Jonasz we wnętrznościach ryby trzy dni i trzy noce."
"Jon2,2": "I modlił się Jonasz do JHWH, swojego Boga, z wnętrzności ryby,"
"Jon2,3": "Mówiąc: Wzywałem JHWH w mojej niedoli i odpowiedział mi z głębin Szeolu; wołałem o pomoc i wysłuchał mojego głosu."
"Jon2,4": "I cisnąłeś mną w głębinę, we wnętrze mórz, i okrążył mnie nurt; wszystkie Twoje bałwany i fale przeszły nade mną."
"Jon2,5": "A ja powiedziałem: Zostałem wygnany sprzed Twoich oczu. Z pewnością będę mógł ponownie spojrzeć na Twój święty przybytek!"
"Jon2,6": "Otoczyły mnie wody aż do mojego gardła, okrążyła mnie otchłań, zielsko oplątało moją głowę."
"Jon2,7": "Zstąpiłem do posad gór, zasuwy ziemi na zawsze się za mną zamknęły. Lecz Ty wydobyłeś z otchłani moje życie, JHWH, Boże mój."
"Jon2,8": "Gdy ustawało we mnie życie, wspomniałem na JHWH; i tak doszła moja modlitwa do Ciebie, do Twojego świętego przybytku."
"Jon2,9": "Ci, którzy zważają na próżne marności, opuszczają swojego Łaskawcę,"
"Jon2,10": "Lecz ja z głosem dziękczynienia, złożę Ci ofiarę, spełnię to, co ślubowałem. U JHWH jest wybawienie. Wtedy JHWH polecił rybie, a ta zwymiotowała Jonasza na ląd."
