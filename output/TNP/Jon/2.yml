"Jon2,1":
  text: "Lecz JHWH wyznaczył wielką rybę, aby połknęła Jonasza. I był Jonasz we wnętrznościach ryby trzy dni i trzy noce."
  tags: []
"Jon2,2":
  text: "I modlił się Jonasz do JHWH, swojego Boga, z wnętrzności ryby,"
  tags: []
"Jon2,3":
  text: "Mówiąc: Wzywałem JHWH w mojej niedoli i odpowiedział mi z głębin Szeolu; wołałem o pomoc i wysłuchał mojego głosu."
  tags: []
"Jon2,4":
  text: "I cisnąłeś mną w głębinę, we wnętrze mórz, i okrążył mnie nurt; wszystkie Twoje bałwany i fale przeszły nade mną."
  tags: []
"Jon2,5":
  text: "A ja powiedziałem: Zostałem wygnany sprzed Twoich oczu. Z pewnością będę mógł ponownie spojrzeć na Twój święty przybytek!"
  tags: []
"Jon2,6":
  text: "Otoczyły mnie wody aż do mojego gardła, okrążyła mnie otchłań, zielsko oplątało moją głowę."
  tags: []
"Jon2,7":
  text: "Zstąpiłem do posad gór, zasuwy ziemi na zawsze się za mną zamknęły. Lecz Ty wydobyłeś z otchłani moje życie, JHWH, Boże mój."
  tags: []
"Jon2,8":
  text: "Gdy ustawało we mnie życie, wspomniałem na JHWH; i tak doszła moja modlitwa do Ciebie, do Twojego świętego przybytku."
  tags: []
"Jon2,9":
  text: "Ci, którzy zważają na próżne marności, opuszczają swojego Łaskawcę,"
  tags: []
"Jon2,10":
  text: "Lecz ja z głosem dziękczynienia, złożę Ci ofiarę, spełnię to, co ślubowałem. U JHWH jest wybawienie. Wtedy JHWH polecił rybie, a ta zwymiotowała Jonasza na ląd."
  tags: []
