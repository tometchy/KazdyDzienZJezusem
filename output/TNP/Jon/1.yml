"Jon1,1":
  text: "I stało się Słowo JHWH do Jonasza, syna Amittaja, głoszące:"
  tags: []
"Jon1,2":
  text: "Wstań, idź do Niniwy, tego wielkiego miasta, i wołaj przeciwko niej, gdyż jej zło wzniosło się przed moje oblicze."
  tags: []
"Jon1,3":
  text: "Lecz Jonasz wstał, aby uciec sprzed oblicza JHWH do Tarszisz. A gdy zszedł do Jaffy, znalazł tam okręt, który miał płynąć do Tarszisz, uiścił opłatę i zszedł na pokład, aby sprzed oblicza JHWH płynąć z nimi do Tarszisz."
  tags: []
"Jon1,4":
  text: "A JHWH zrzucił potężny wiatr na morze i zerwała się potężna burza na morzu, i okręt liczył się z rozbiciem."
  tags: []
"Jon1,5":
  text: "Przestraszyli się więc żeglarze i każdy wołał do swojego boga; osprzęt, który był na okręcie wyrzucili do morza, aby zmniejszyć ciężar. Jonasz natomiast zszedł pod pokład statku, położył się i twardo zasnął."
  tags: []
"Jon1,6":
  text: "Wtedy zbliżył się do niego dowódca żeglarzy i powiedział do niego: Co tobie, że tak twardo śpisz? Wstań, wołaj do swojego boga! Być może bóg pomyśli o nas i nie zginiemy."
  tags: []
"Jon1,7":
  text: "I powiedzieli każdy do swojego towarzysza: Przyjdźmy, rzućmy losy, aby się dowiedzieć, z powodu kogo spadło na nas to zło! Rzucili więc losy i los padł na Jonasza."
  tags: []
"Jon1,8":
  text: "I powiedzieli do niego: Powiedz proszę nam, z powodu jakiego zła spadło to na nas, jakie jest twoje rzemiosło i skąd pochodzisz, jaki jest twój kraj i z którego ludu ty jesteś?"
  tags: []
"Jon1,9":
  text: "I odpowiedział im: Ja jestem Hebrajczykiem i czczę JHWH, Boga niebios, który uczynił morze i ląd."
  tags: []
"Jon1,10":
  text: "A wtedy ci mężczyźni bardzo się przerazili i powiedzieli do niego: Co ty uczyniłeś? Bo ludzie ci dowiedzieli się, że ucieka sprzed oblicza JHWH, gdyż im to oznajmił."
  tags: []
"Jon1,11":
  text: "I również powiedzieli do niego: Co powinniśmy uczynić z tobą, aby uspokoiło się morze dookoła nas, bo morze jest coraz bardziej wzburzone?"
  tags: []
"Jon1,12":
  text: "Wtedy powiedział do nich: Weźcie mnie i wrzućcie do morza, a morze uspokoi się dookoła was, bo ja wiem, że z powodu mnie spadła na was ta wielka burza."
  tags: []
"Jon1,13":
  text: "Lecz ci mężczyźni wiosłowali, aby wrócić na ląd, lecz nie mogli, gdyż morze coraz bardziej burzyło się dookoła nich."
  tags: []
"Jon1,14":
  text: "Wtedy zawołali do JHWH i powiedzieli: Ach JHWH! Prosimy, nie daj nam zginąć z powodu życia tego człowieka, i nie przypisuj nam winy za niewinną, krew, bo Ty, o JHWH, uczyniłeś tak, jak Ci się spodobało."
  tags: []
"Jon1,15":
  text: "Wzięli więc Jonasza i wrzucili go do morza; wtedy morze przestało się burzyć."
  tags: []
"Jon1,16":
  text: "A tych ludzi ogarnęło wielkie przerażenie przed JHWH; złożyli więc JHWH ofiarę i uczynili śluby."
  tags: []
