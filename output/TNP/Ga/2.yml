"Ga2,1":
  text: "Potem, po czternastu latach wstąpiłem ponownie do Jerozolimy z Barnabą, biorąc ze sobą także Tytusa."
  tags: []
"Ga2,2":
  text: "A wstąpiłem tam w związku z objawieniem i przedstawiłem im Ewangelię, którą głoszę między poganami, a na osobności tym cieszącym się poważaniem, aby się czasem nie okazało, że biegnę lub biegłem na próżno."
  tags: []
"Ga2,3":
  text: "Ale nawet Tytus, który był ze mną, będący Grekiem, nie został zmuszony by dać się obrzezać,"
  tags: []
"Ga2,4":
  text: "Pomimo wprowadzenia potajemnie fałszywych braci, którzy wkradli się by wyszpiegować naszą wolność, którą mamy w Chrystusie Jezusie, aby nas zniewolić;"
  tags: []
"Ga2,5":
  text: "Tym ani na chwilę nie ustąpiliśmy i nie poddaliśmy się, aby prawda Ewangelii przetrwała ze względu na was."
  tags: []
"Ga2,6":
  text: "A ci, którzy uważają się za kogoś – jakimi niegdyś byli, nie czyni mi to różnicy; Bóg nie ma względu na osobę – ci, cieszący się poważaniem, nic na mnie dodatkowo nie nałożyli."
  tags: []
"Ga2,7":
  text: "Raczej przeciwnie, widząc, że jest mi powierzona Ewangelia dla nieobrzezanych, jak Piotrowi dla obrzezanych,"
  tags: []
"Ga2,8":
  text: "Ten bowiem, który przez Piotra działał skutecznie w apostolstwie dla obrzezanych, działał skutecznie i we mnie wobec pogan,"
  tags: []
"Ga2,9":
  text: "I gdy poznali daną mi łaskę, Jakub i Kefas, i Jan, uważani za filary, podali mi i Barnabie prawicę wspólnoty, abyśmy szli do pogan, a oni do obrzezanych;"
  tags: []
"Ga2,10":
  text: "Tylko żebyśmy pamiętali o ubogich, toteż gorliwie starałem się to właśnie czynić."
  tags: []
"Ga2,11":
  text: "A gdy przyszedł Piotr do Antiochii, wystąpiłem przeciwko niemu otwarcie, gdyż był winny."
  tags: []
"Ga2,12":
  text: "Albowiem przed przyjściem niektórych od Jakuba, jadał razem z poganami; a gdy przyszli, usuwał się i odłączał, bojąc się tych z obrzezania."
  tags: []
"Ga2,13":
  text: "A razem z nim obłudni byli i pozostali Żydzi, tak że i Barnaba dał się uwieść ich obłudzie."
  tags: []
"Ga2,14":
  text: "Ale gdy zobaczyłem, że nie kroczą prosto zgodnie z prawdą Ewangelii, powiedziałem Piotrowi wobec wszystkich: Jeżeli ty, będąc Żydem, żyjesz po pogańsku, a nie po żydowsku, dlaczego przymuszasz pogan by żyli po żydowsku?"
  tags: []
"Ga2,15":
  text: "My jesteśmy z natury Żydami, a nie grzesznikami z pogan."
  tags: []
"Ga2,16":
  text: "Wiedząc, że człowiek nie zostaje uznany za sprawiedliwego z uczynków Prawa, ale tylko przez wiarę Jezusa Chrystusa, i my uwierzyliśmy w Jezusa Chrystusa, abyśmy zostali uznani za sprawiedliwych z wiary w Chrystusa, a nie z uczynków Prawa, dlatego że nikt nie będzie uznany za sprawiedliwego z uczynków Prawa."
  tags: []
"Ga2,17":
  text: "Natomiast jeśli, szukając tego by zostać uznanymi za sprawiedliwych w Chrystusie, sami okazaliśmy się grzesznikami, to czy Chrystus jest sługą grzechu? Z pewnością nie."
  tags: []
"Ga2,18":
  text: "Albowiem jeśli to, co zburzyłem, ponownie buduję, to samego siebie czynię przestępcą."
  tags: []
"Ga2,19":
  text: "Bo ja z powodu Prawa, umarłem dla Prawa, abym żył dla Boga."
  tags: []
"Ga2,20":
  text: "Z Chrystusem jestem przybity do krzyża i żyję już nie ja, lecz żyje we mnie Chrystus; a to, że teraz żyję w ciele, żyję w wierze Syna Bożego, który mnie umiłował i wydał samego siebie za mnie."
  tags: []
"Ga2,21":
  text: "Nie odrzucam łaski Bożej; bo jeśli przez Prawo jest sprawiedliwość, wtedy Chrystus umarł na próżno."
  tags: []
