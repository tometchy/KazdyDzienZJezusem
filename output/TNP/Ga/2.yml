"Ga2,1": "Potem, po czternastu latach wstąpiłem ponownie do Jerozolimy z Barnabą, biorąc ze sobą także Tytusa."
"Ga2,2": "A wstąpiłem tam w związku z objawieniem i przedstawiłem im Ewangelię, którą głoszę między poganami, a na osobności tym cieszącym się poważaniem, aby się czasem nie okazało, że biegnę lub biegłem na próżno."
"Ga2,3": "Ale nawet Tytus, który był ze mną, będący Grekiem, nie został zmuszony by dać się obrzezać,"
"Ga2,4": "Pomimo wprowadzenia potajemnie fałszywych braci, którzy wkradli się by wyszpiegować naszą wolność, którą mamy w Chrystusie Jezusie, aby nas zniewolić;"
"Ga2,5": "Tym ani na chwilę nie ustąpiliśmy i nie poddaliśmy się, aby prawda Ewangelii przetrwała ze względu na was."
"Ga2,6": "A ci, którzy uważają się za kogoś – jakimi niegdyś byli, nie czyni mi to różnicy; Bóg nie ma względu na osobę – ci, cieszący się poważaniem, nic na mnie dodatkowo nie nałożyli."
"Ga2,7": "Raczej przeciwnie, widząc, że jest mi powierzona Ewangelia dla nieobrzezanych, jak Piotrowi dla obrzezanych,"
"Ga2,8": "Ten bowiem, który przez Piotra działał skutecznie w apostolstwie dla obrzezanych, działał skutecznie i we mnie wobec pogan,"
"Ga2,9": "I gdy poznali daną mi łaskę, Jakub i Kefas, i Jan, uważani za filary, podali mi i Barnabie prawicę wspólnoty, abyśmy szli do pogan, a oni do obrzezanych;"
"Ga2,10": "Tylko żebyśmy pamiętali o ubogich, toteż gorliwie starałem się to właśnie czynić."
"Ga2,11": "A gdy przyszedł Piotr do Antiochii, wystąpiłem przeciwko niemu otwarcie, gdyż był winny."
"Ga2,12": "Albowiem przed przyjściem niektórych od Jakuba, jadał razem z poganami; a gdy przyszli, usuwał się i odłączał, bojąc się tych z obrzezania."
"Ga2,13": "A razem z nim obłudni byli i pozostali Żydzi, tak że i Barnaba dał się uwieść ich obłudzie."
"Ga2,14": "Ale gdy zobaczyłem, że nie kroczą prosto zgodnie z prawdą Ewangelii, powiedziałem Piotrowi wobec wszystkich: Jeżeli ty, będąc Żydem, żyjesz po pogańsku, a nie po żydowsku, dlaczego przymuszasz pogan by żyli po żydowsku?"
"Ga2,15": "My jesteśmy z natury Żydami, a nie grzesznikami z pogan."
"Ga2,16": "Wiedząc, że człowiek nie zostaje uznany za sprawiedliwego z uczynków Prawa, ale tylko przez wiarę Jezusa Chrystusa, i my uwierzyliśmy w Jezusa Chrystusa, abyśmy zostali uznani za sprawiedliwych z wiary w Chrystusa, a nie z uczynków Prawa, dlatego że nikt nie będzie uznany za sprawiedliwego z uczynków Prawa."
"Ga2,17": "Natomiast jeśli, szukając tego by zostać uznanymi za sprawiedliwych w Chrystusie, sami okazaliśmy się grzesznikami, to czy Chrystus jest sługą grzechu? Z pewnością nie."
"Ga2,18": "Albowiem jeśli to, co zburzyłem, ponownie buduję, to samego siebie czynię przestępcą."
"Ga2,19": "Bo ja z powodu Prawa, umarłem dla Prawa, abym żył dla Boga."
"Ga2,20": "Z Chrystusem jestem przybity do krzyża i żyję już nie ja, lecz żyje we mnie Chrystus; a to, że teraz żyję w ciele, żyję w wierze Syna Bożego, który mnie umiłował i wydał samego siebie za mnie."
"Ga2,21": "Nie odrzucam łaski Bożej; bo jeśli przez Prawo jest sprawiedliwość, wtedy Chrystus umarł na próżno."
