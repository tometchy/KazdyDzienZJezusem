"Ga3,1": "O nierozumni Galacjanie! Kto was zaczarował, abyście nie byli posłuszni prawdzie, was, którym przed oczami Jezus Chrystus wcześniej był opisany pośród was jako ukrzyżowany?"
"Ga3,2": "Tego tylko chciałbym się od was dowiedzieć: Czy z uczynków Prawa otrzymaliście Ducha, czy ze słuchania z wiarą?"
"Ga3,3": "Czy tak nierozumni jesteście? Rozpoczęliście w Duchu, a teraz ciałem kończycie?"
"Ga3,4": "Czy tak wiele wycierpieliście na próżno? Jeśli rzeczywiście – to na próżno!"
"Ga3,5": "Ten więc, który was zaopatruje w Ducha i Ten działający z mocą wśród was, czy z uczynków Prawa czyni to, czy ze słuchania z wiarą?"
"Ga3,6": "Tak jak Abraham uwierzył Bogu i zostało mu to poczytane ku uznaniu za sprawiedliwego."
"Ga3,7": "Wiedzcie zatem, że ci, którzy są z wiary, ci są synami Abrahama."
"Ga3,8": "A Pismo przewidziało, że Bóg z wiary uznaje za sprawiedliwych pogan; wcześniej ogłosiło tę dobrą nowinę Abrahamowi: W tobie będą błogosławione wszystkie narody."
"Ga3,9": "Tak, że ci, którzy są z wiary, są błogosławieni z wierzącym Abrahamem."
"Ga3,10": "Wszyscy bowiem, którzy są z uczynków Prawa, są pod przekleństwem, bo napisano: Przeklęty każdy, kto nie trwa we wszystkich przepisach, które są zapisane w zwoju Prawa, aby je uczynił."
"Ga3,11": "Ale to, że przez Prawo nikt przed Bogiem nie jest uznawany za sprawiedliwego jest oczywiste, gdyż: Sprawiedliwy z wiary żyć będzie."
"Ga3,12": "Prawo natomiast nie jest z wiary, lecz człowiek, który je wykonał, będzie żyć przez nie."
"Ga3,13": "Chrystus odkupił nas od przekleństwa Prawa, stając się za nas przekleństwem, bowiem jest napisane: Przeklęty każdy, kto wisi na drzewie,"
"Ga3,14": "Aby błogosławieństwo Abrahama stało się w Chrystusie Jezusie udziałem pogan, abyśmy obietnicę Ducha otrzymali przez wiarę."
"Ga3,15": "Bracia! Po ludzku mówię: Przecież i potwierdzonego przymierza zawartego przez ludzi nikt nie odrzuca ani niczego nie dodaje."
"Ga3,16": "Abrahamowi natomiast i jego potomkowi zostały ogłoszone obietnice. Nie mówi: I potomkom, jak o wielu, ale jak o jednym: I twojemu potomkowi – którym jest Chrystus."
"Ga3,17": "To więc mówię, że przymierza potwierdzonego wcześniej przez Boga w Chrystusie nie unieważniło Prawo, które nastało po czterystu trzydziestu latach, tak by uznać obietnicę za nieważną."
"Ga3,18": "Albowiem jeśli z Prawa jest dziedziczenie, to już nie z obietnicy; lecz Abrahamowi darował je Bóg przez obietnicę."
"Ga3,19": "Czym więc jest Prawo? Z powodu przestępstw zostało dodane, dopóki nie przyjdzie potomek, któremu dana jest obietnica; co zostało zarządzone przez aniołów ręką pośrednika."
"Ga3,20": "A pośrednik nie jest potrzebny przy jednej stronie, a Bóg jest jeden."
"Ga3,21": "Czy więc Prawo jest przeciwne obietnicom Boga? Z pewnością nie. Gdyby bowiem dane było Prawo, które mogłoby przywrócić do życia, prawdziwie z Prawa byłoby uznanie za sprawiedliwych."
"Ga3,22": "Ale Pismo zamknęło wszystko pod grzechem, aby obietnica z wiary Jezusa Chrystusa była dana tym, którzy są wierzącymi."
"Ga3,23": "A przed przyjściem wiary, byliśmy strzeżeni pod Prawem, razem zamknięci aż do przyjścia wiary, która miała zostać objawiona."
"Ga3,24": "Tak więc Prawo było naszym wychowawcą do Chrystusa, abyśmy z wiary zostali uznani za sprawiedliwych."
"Ga3,25": "Ale gdy przyszła wiara, już nie jesteśmy poddani wychowawcy."
"Ga3,26": "Wszyscy bowiem jesteście synami Boga przez wiarę w Chrystusie Jezusie."
"Ga3,27": "Albowiem ilu z was zostało ochrzczonych w Chrystusa, w Chrystusa się przyoblekliście."
"Ga3,28": "I nie ma Żyda ani Greka; nie ma niewolnika ani wolnego; nie ma mężczyzny ani kobiety; albowiem wy wszyscy jednym jesteście w Chrystusie Jezusie."
"Ga3,29": "A jeśli wy należycie do Chrystusa, wtedy jesteście potomstwem Abrahama, a zgodnie z obietnicą dziedzicami."
