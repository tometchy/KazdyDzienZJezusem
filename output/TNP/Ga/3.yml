"Ga3,1":
  text: "O nierozumni Galacjanie! Kto was zaczarował, abyście nie byli posłuszni prawdzie, was, którym przed oczami Jezus Chrystus wcześniej był opisany pośród was jako ukrzyżowany?"
  tags: []
"Ga3,2":
  text: "Tego tylko chciałbym się od was dowiedzieć: Czy z uczynków Prawa otrzymaliście Ducha, czy ze słuchania z wiarą?"
  tags: []
"Ga3,3":
  text: "Czy tak nierozumni jesteście? Rozpoczęliście w Duchu, a teraz ciałem kończycie?"
  tags: []
"Ga3,4":
  text: "Czy tak wiele wycierpieliście na próżno? Jeśli rzeczywiście – to na próżno!"
  tags: []
"Ga3,5":
  text: "Ten więc, który was zaopatruje w Ducha i Ten działający z mocą wśród was, czy z uczynków Prawa czyni to, czy ze słuchania z wiarą?"
  tags: []
"Ga3,6":
  text: "Tak jak Abraham uwierzył Bogu i zostało mu to poczytane ku uznaniu za sprawiedliwego."
  tags: []
"Ga3,7":
  text: "Wiedzcie zatem, że ci, którzy są z wiary, ci są synami Abrahama."
  tags: []
"Ga3,8":
  text: "A Pismo przewidziało, że Bóg z wiary uznaje za sprawiedliwych pogan; wcześniej ogłosiło tę dobrą nowinę Abrahamowi: W tobie będą błogosławione wszystkie narody."
  tags: []
"Ga3,9":
  text: "Tak, że ci, którzy są z wiary, są błogosławieni z wierzącym Abrahamem."
  tags: []
"Ga3,10":
  text: "Wszyscy bowiem, którzy są z uczynków Prawa, są pod przekleństwem, bo napisano: Przeklęty każdy, kto nie trwa we wszystkich przepisach, które są zapisane w zwoju Prawa, aby je uczynił."
  tags: []
"Ga3,11":
  text: "Ale to, że przez Prawo nikt przed Bogiem nie jest uznawany za sprawiedliwego jest oczywiste, gdyż: Sprawiedliwy z wiary żyć będzie."
  tags: []
"Ga3,12":
  text: "Prawo natomiast nie jest z wiary, lecz człowiek, który je wykonał, będzie żyć przez nie."
  tags: []
"Ga3,13":
  text: "Chrystus odkupił nas od przekleństwa Prawa, stając się za nas przekleństwem, bowiem jest napisane: Przeklęty każdy, kto wisi na drzewie,"
  tags: []
"Ga3,14":
  text: "Aby błogosławieństwo Abrahama stało się w Chrystusie Jezusie udziałem pogan, abyśmy obietnicę Ducha otrzymali przez wiarę."
  tags: []
"Ga3,15":
  text: "Bracia! Po ludzku mówię: Przecież i potwierdzonego przymierza zawartego przez ludzi nikt nie odrzuca ani niczego nie dodaje."
  tags: []
"Ga3,16":
  text: "Abrahamowi natomiast i jego potomkowi zostały ogłoszone obietnice. Nie mówi: I potomkom, jak o wielu, ale jak o jednym: I twojemu potomkowi – którym jest Chrystus."
  tags: []
"Ga3,17":
  text: "To więc mówię, że przymierza potwierdzonego wcześniej przez Boga w Chrystusie nie unieważniło Prawo, które nastało po czterystu trzydziestu latach, tak by uznać obietnicę za nieważną."
  tags: []
"Ga3,18":
  text: "Albowiem jeśli z Prawa jest dziedziczenie, to już nie z obietnicy; lecz Abrahamowi darował je Bóg przez obietnicę."
  tags: []
"Ga3,19":
  text: "Czym więc jest Prawo? Z powodu przestępstw zostało dodane, dopóki nie przyjdzie potomek, któremu dana jest obietnica; co zostało zarządzone przez aniołów ręką pośrednika."
  tags: []
"Ga3,20":
  text: "A pośrednik nie jest potrzebny przy jednej stronie, a Bóg jest jeden."
  tags: []
"Ga3,21":
  text: "Czy więc Prawo jest przeciwne obietnicom Boga? Z pewnością nie. Gdyby bowiem dane było Prawo, które mogłoby przywrócić do życia, prawdziwie z Prawa byłoby uznanie za sprawiedliwych."
  tags: []
"Ga3,22":
  text: "Ale Pismo zamknęło wszystko pod grzechem, aby obietnica z wiary Jezusa Chrystusa była dana tym, którzy są wierzącymi."
  tags: []
"Ga3,23":
  text: "A przed przyjściem wiary, byliśmy strzeżeni pod Prawem, razem zamknięci aż do przyjścia wiary, która miała zostać objawiona."
  tags: []
"Ga3,24":
  text: "Tak więc Prawo było naszym wychowawcą do Chrystusa, abyśmy z wiary zostali uznani za sprawiedliwych."
  tags: []
"Ga3,25":
  text: "Ale gdy przyszła wiara, już nie jesteśmy poddani wychowawcy."
  tags: []
"Ga3,26":
  text: "Wszyscy bowiem jesteście synami Boga przez wiarę w Chrystusie Jezusie."
  tags: []
"Ga3,27":
  text: "Albowiem ilu z was zostało ochrzczonych w Chrystusa, w Chrystusa się przyoblekliście."
  tags: []
"Ga3,28":
  text: "I nie ma Żyda ani Greka; nie ma niewolnika ani wolnego; nie ma mężczyzny ani kobiety; albowiem wy wszyscy jednym jesteście w Chrystusie Jezusie."
  tags: []
"Ga3,29":
  text: "A jeśli wy należycie do Chrystusa, wtedy jesteście potomstwem Abrahama, a zgodnie z obietnicą dziedzicami."
  tags: []
