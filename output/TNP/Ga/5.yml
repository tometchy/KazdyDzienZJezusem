"Ga5,1":
  text: "Stójcie więc w wolności, do której nas wyzwolił Chrystus i nie poddawajcie się ponownie pod jarzmo niewoli."
  tags: []
"Ga5,2":
  text: "Oto ja, Paweł, mówię wam: Jeśli dajecie się obrzezać, Chrystus wam nic nie pomoże."
  tags: []
"Ga5,3":
  text: "A świadczę ponownie każdemu człowiekowi, który daje się obrzezać, że jest zobowiązany wykonać całe Prawo."
  tags: []
"Ga5,4":
  text: "Zostaliście odłączeni od Chrystusa wy wszyscy, którzy w Prawie uznajecie się za sprawiedliwych; wypadliście z łaski."
  tags: []
"Ga5,5":
  text: "My bowiem w duchu, z wiary, oczekujemy nadziei sprawiedliwości."
  tags: []
"Ga5,6":
  text: "Bo w Chrystusie Jezusie ani obrzezanie nic nie znaczy, ani nieobrzezanie, ale wiara działająca przez miłość."
  tags: []
"Ga5,7":
  text: "Biegliście dobrze; kto wam przeszkodził, abyście nie byli posłuszni prawdzie?"
  tags: []
"Ga5,8":
  text: "To namawianie nie jest od Tego, który was powołuje."
  tags: []
"Ga5,9":
  text: "Mała ilość zakwasu całe ciasto zakwasza."
  tags: []
"Ga5,10":
  text: "Ja jestem co do was przekonany w Panu, że nie będziecie myśleć inaczej; a ten, który was niepokoi, poniesie karę, kimkolwiek by był."
  tags: []
"Ga5,11":
  text: "A ja, bracia, jeśli jeszcze głoszę obrzezanie, dlaczego nadal jestem prześladowany? Zatem straciło znaczenie zgorszenie krzyża."
  tags: []
"Ga5,12":
  text: "Oby odcięli sobie ci, którzy was podburzają."
  tags: []
"Ga5,13":
  text: "Bo wy do wolności zostaliście powołani, bracia; tylko ta wolność niech nie będzie zachętą ku pobudzaniu ciała, ale ze względu na miłość służcie jedni drugim."
  tags: []
"Ga5,14":
  text: "Całe bowiem Prawo jest wypełnione w jednym nakazie, w tym: Będziesz miłował swojego bliźniego, jak samego siebie."
  tags: []
"Ga5,15":
  text: "Ale jeśli jedni drugich kąsacie i pożeracie, patrzcie, abyście jedni przez drugich nie zostali strawieni."
  tags: []
"Ga5,16":
  text: "Mówię więc: Duchem postępujcie, a pożądliwości ciała z pewnością nie wykonacie."
  tags: []
"Ga5,17":
  text: "Ciało bowiem pożąda przeciwko Duchowi, a Duch przeciwko ciału; a te są sobie przeciwne, abyście nie to, co chcecie, czynili."
  tags: []
"Ga5,18":
  text: "Jeśli więc przez Ducha dajecie się prowadzić, nie jesteście pod Prawem."
  tags: []
"Ga5,19":
  text: "Jawne są natomiast czyny ciała, którymi są: cudzołóstwo, nierząd, nieczystość, rozpusta,"
  tags: []
"Ga5,20":
  text: "Bałwochwalstwo, czary, nieprzyjaźnie, kłótnie, zazdrość, wybuchy gniewu, intrygi, poróżnienia, rozłamy,"
  tags: []
"Ga5,21":
  text: "Zawiść, zabójstwa, pijaństwo, hulanki i tym podobne, o których zapowiadam wam, jak i przedtem zapowiedziałem, że ci, którzy te rzeczy czynią, Królestwa Bożego nie odziedziczą."
  tags: []
"Ga5,22":
  text: "Natomiast owocem Ducha jest: miłość, radość, pokój, cierpliwość, uprzejmość, dobroć, wiara,"
  tags: []
"Ga5,23":
  text: "Łagodność, opanowanie. Prawo nie jest przeciwko takim."
  tags: []
"Ga5,24":
  text: "Ci więc, którzy są własnością Chrystusa, ukrzyżowali swoje ciało wraz z namiętnościami i pożądliwościami."
  tags: []
"Ga5,25":
  text: "Jeśli żyjemy w Duchu, Duchowi się podporządkowujemy."
  tags: []
"Ga5,26":
  text: "Nie stawajmy się chciwi próżnej chwały, jedni drugich prowokując, jedni drugim zazdroszcząc."
  tags: []
