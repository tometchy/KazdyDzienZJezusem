"Ga5,1": "Stójcie więc w wolności, do której nas wyzwolił Chrystus i nie poddawajcie się ponownie pod jarzmo niewoli."
"Ga5,2": "Oto ja, Paweł, mówię wam: Jeśli dajecie się obrzezać, Chrystus wam nic nie pomoże."
"Ga5,3": "A świadczę ponownie każdemu człowiekowi, który daje się obrzezać, że jest zobowiązany wykonać całe Prawo."
"Ga5,4": "Zostaliście odłączeni od Chrystusa wy wszyscy, którzy w Prawie uznajecie się za sprawiedliwych; wypadliście z łaski."
"Ga5,5": "My bowiem w duchu, z wiary, oczekujemy nadziei sprawiedliwości."
"Ga5,6": "Bo w Chrystusie Jezusie ani obrzezanie nic nie znaczy, ani nieobrzezanie, ale wiara działająca przez miłość."
"Ga5,7": "Biegliście dobrze; kto wam przeszkodził, abyście nie byli posłuszni prawdzie?"
"Ga5,8": "To namawianie nie jest od Tego, który was powołuje."
"Ga5,9": "Mała ilość zakwasu całe ciasto zakwasza."
"Ga5,10": "Ja jestem co do was przekonany w Panu, że nie będziecie myśleć inaczej; a ten, który was niepokoi, poniesie karę, kimkolwiek by był."
"Ga5,11": "A ja, bracia, jeśli jeszcze głoszę obrzezanie, dlaczego nadal jestem prześladowany? Zatem straciło znaczenie zgorszenie krzyża."
"Ga5,12": "Oby odcięli sobie ci, którzy was podburzają."
"Ga5,13": "Bo wy do wolności zostaliście powołani, bracia; tylko ta wolność niech nie będzie zachętą ku pobudzaniu ciała, ale ze względu na miłość służcie jedni drugim."
"Ga5,14": "Całe bowiem Prawo jest wypełnione w jednym nakazie, w tym: Będziesz miłował swojego bliźniego, jak samego siebie."
"Ga5,15": "Ale jeśli jedni drugich kąsacie i pożeracie, patrzcie, abyście jedni przez drugich nie zostali strawieni."
"Ga5,16": "Mówię więc: Duchem postępujcie, a pożądliwości ciała z pewnością nie wykonacie."
"Ga5,17": "Ciało bowiem pożąda przeciwko Duchowi, a Duch przeciwko ciału; a te są sobie przeciwne, abyście nie to, co chcecie, czynili."
"Ga5,18": "Jeśli więc przez Ducha dajecie się prowadzić, nie jesteście pod Prawem."
"Ga5,19": "Jawne są natomiast czyny ciała, którymi są: cudzołóstwo, nierząd, nieczystość, rozpusta,"
"Ga5,20": "Bałwochwalstwo, czary, nieprzyjaźnie, kłótnie, zazdrość, wybuchy gniewu, intrygi, poróżnienia, rozłamy,"
"Ga5,21": "Zawiść, zabójstwa, pijaństwo, hulanki i tym podobne, o których zapowiadam wam, jak i przedtem zapowiedziałem, że ci, którzy te rzeczy czynią, Królestwa Bożego nie odziedziczą."
"Ga5,22": "Natomiast owocem Ducha jest: miłość, radość, pokój, cierpliwość, uprzejmość, dobroć, wiara,"
"Ga5,23": "Łagodność, opanowanie. Prawo nie jest przeciwko takim."
"Ga5,24": "Ci więc, którzy są własnością Chrystusa, ukrzyżowali swoje ciało wraz z namiętnościami i pożądliwościami."
"Ga5,25": "Jeśli żyjemy w Duchu, Duchowi się podporządkowujemy."
"Ga5,26": "Nie stawajmy się chciwi próżnej chwały, jedni drugich prowokując, jedni drugim zazdroszcząc."
