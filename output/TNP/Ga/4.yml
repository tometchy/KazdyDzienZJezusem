"Ga4,1":
  text: "Mówię więc: Tyle czasu, ile dziedzic jest małym dzieckiem, niczym nie różni się od niewolnika, chociaż jest panem wszystkiego;"
  tags: []
"Ga4,2":
  text: "Ale podlega opiekunom i zarządcom, aż do czasu ustalonego przez ojca."
  tags: []
"Ga4,3":
  text: "Tak też i my, gdy byliśmy małymi dziećmi, byliśmy zniewoleni przez elementarne zasady tego świata."
  tags: []
"Ga4,4":
  text: "Lecz gdy przyszło wypełnienie czasu, posłał Bóg swojego Syna, który narodził się z kobiety i narodził się pod Prawem,"
  tags: []
"Ga4,5":
  text: "Aby wykupić tych, którzy byli pod Prawem, abyśmy dostąpili usynowienia."
  tags: []
"Ga4,6":
  text: "A ponieważ jesteście synami, dlatego Bóg posłał do serc waszych Ducha swojego Syna, wołającego: Abba, Drogi Ojcze!"
  tags: []
"Ga4,7":
  text: "Tak więc już nie jesteś niewolnikiem, lecz synem; a jeżeli synem, to i dziedzicem Boga przez Chrystusa."
  tags: []
"Ga4,8":
  text: "Ale wtedy, prawdziwie nie znając Boga, staliście się niewolnikami tych, którzy z natury nie są bogami."
  tags: []
"Ga4,9":
  text: "Ale teraz, gdy poznaliście Boga, a raczej gdy zostaliście poznani przez Boga, czemu ponownie zawracacie do słabych i nędznych elementarnych zasad tego świata, którym ponownie, tak jak na początku, chcecie oddać się w niewolę?"
  tags: []
"Ga4,10":
  text: "Pilnujecie dni i miesięcy, i pór roku, i lat."
  tags: []
"Ga4,11":
  text: "Boję się o was, czy czasem nie trudziłem się dla was na próżno."
  tags: []
"Ga4,12":
  text: "Proszę was, bracia, stawajcie się tacy jak ja, gdyż i ja jestem jak wy. W niczym mnie nie skrzywdziliście."
  tags: []
"Ga4,13":
  text: "Wiecie bowiem, że po raz pierwszy ogłosiłem wam Ewangelię na skutek słabości ciała;"
  tags: []
"Ga4,14":
  text: "A próbą moją, w moim ciele, nie wzgardziliście, ani mnie nie odrzuciliście, ale przyjęliście mnie jak posłańca Bożego, jak Chrystusa Jezusa."
  tags: []
"Ga4,15":
  text: "Kto więc był waszym szczęściem? Albowiem świadczę wam, że gdyby to było możliwe, wyłupilibyście swoje oczy i mi je oddali."
  tags: []
"Ga4,16":
  text: "A tak, czy stałem się waszym nieprzyjacielem mówiąc wam prawdę?"
  tags: []
"Ga4,17":
  text: "Zabiegają o was, nie ku temu, co dobre, bo chcą was odłączyć, abyście wy o nich zabiegali."
  tags: []
"Ga4,18":
  text: "A dobrze jest zawsze zabiegać o to, co dobre, a nie tylko wtedy, gdy jestem wśród was obecny."
  tags: []
"Ga4,19":
  text: "Dzieciątka moje, które znowu w bólach rodzę, dopóki Chrystus nie będzie ukształtowany w was!"
  tags: []
"Ga4,20":
  text: "Chciałbym teraz być obecnym przy was i odmienić mój głos, ponieważ jestem zakłopotany co do was."
  tags: []
"Ga4,21":
  text: "Powiedzcie mi wy, którzy chcecie być pod Prawem, czy nie słuchacie tego Prawa?"
  tags: []
"Ga4,22":
  text: "Albowiem jest napisane, że Abraham miał dwóch synów, jednego z niewolnicy, a drugiego z wolnej."
  tags: []
"Ga4,23":
  text: "A ten, jednakże, który był z niewolnicy, jest zrodzony zgodnie z wolą ciała, ten natomiast z wolnej, ze względu na obietnicę."
  tags: []
"Ga4,24":
  text: "To jest znaczenie obrazowe; są to bowiem dwa przymierza; jedno z góry Synaj, które istotnie rodzi w niewolę; jest nim Hagar."
  tags: []
"Ga4,25":
  text: "Hagar bowiem jest to góra Synaj w Arabii, a odpowiada dzisiejszej Jerozolimie; bo jest w niewoli ze swoimi dziećmi."
  tags: []
"Ga4,26":
  text: "Lecz górna Jerozolima jest wolna i ona jest matką nas wszystkich."
  tags: []
"Ga4,27":
  text: "Albowiem jest napisane: Rozraduj się niepłodna, ty, która nie rodzisz; wydaj okrzyk i zawołaj, ty, która nie rodzisz w bólach; bo samotna ma więcej dzieci niż ta, która ma męża."
  tags: []
"Ga4,28":
  text: "My natomiast, bracia, jesteśmy dziećmi obietnicy na podobieństwo Izaaka."
  tags: []
"Ga4,29":
  text: "Lecz tak, jak wtedy ten, który został zrodzony według ciała, prześladował tego, który został zrodzony według Ducha, tak i teraz."
  tags: []
"Ga4,30":
  text: "Ale co mówi Pismo? Wyrzuć niewolnicę i jej syna; bo na pewno nie będzie dziedziczyć syn niewolnicy z synem wolnej."
  tags: []
"Ga4,31":
  text: "Zatem, bracia, nie jesteśmy dziećmi niewolnicy, ale wolnej."
  tags: []
