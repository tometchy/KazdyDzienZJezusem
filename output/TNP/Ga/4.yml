"Ga4,1": "Mówię więc: Tyle czasu, ile dziedzic jest małym dzieckiem, niczym nie różni się od niewolnika, chociaż jest panem wszystkiego;"
"Ga4,2": "Ale podlega opiekunom i zarządcom, aż do czasu ustalonego przez ojca."
"Ga4,3": "Tak też i my, gdy byliśmy małymi dziećmi, byliśmy zniewoleni przez elementarne zasady tego świata."
"Ga4,4": "Lecz gdy przyszło wypełnienie czasu, posłał Bóg swojego Syna, który narodził się z kobiety i narodził się pod Prawem,"
"Ga4,5": "Aby wykupić tych, którzy byli pod Prawem, abyśmy dostąpili usynowienia."
"Ga4,6": "A ponieważ jesteście synami, dlatego Bóg posłał do serc waszych Ducha swojego Syna, wołającego: Abba, Drogi Ojcze!"
"Ga4,7": "Tak więc już nie jesteś niewolnikiem, lecz synem; a jeżeli synem, to i dziedzicem Boga przez Chrystusa."
"Ga4,8": "Ale wtedy, prawdziwie nie znając Boga, staliście się niewolnikami tych, którzy z natury nie są bogami."
"Ga4,9": "Ale teraz, gdy poznaliście Boga, a raczej gdy zostaliście poznani przez Boga, czemu ponownie zawracacie do słabych i nędznych elementarnych zasad tego świata, którym ponownie, tak jak na początku, chcecie oddać się w niewolę?"
"Ga4,10": "Pilnujecie dni i miesięcy, i pór roku, i lat."
"Ga4,11": "Boję się o was, czy czasem nie trudziłem się dla was na próżno."
"Ga4,12": "Proszę was, bracia, stawajcie się tacy jak ja, gdyż i ja jestem jak wy. W niczym mnie nie skrzywdziliście."
"Ga4,13": "Wiecie bowiem, że po raz pierwszy ogłosiłem wam Ewangelię na skutek słabości ciała;"
"Ga4,14": "A próbą moją, w moim ciele, nie wzgardziliście, ani mnie nie odrzuciliście, ale przyjęliście mnie jak posłańca Bożego, jak Chrystusa Jezusa."
"Ga4,15": "Kto więc był waszym szczęściem? Albowiem świadczę wam, że gdyby to było możliwe, wyłupilibyście swoje oczy i mi je oddali."
"Ga4,16": "A tak, czy stałem się waszym nieprzyjacielem mówiąc wam prawdę?"
"Ga4,17": "Zabiegają o was, nie ku temu, co dobre, bo chcą was odłączyć, abyście wy o nich zabiegali."
"Ga4,18": "A dobrze jest zawsze zabiegać o to, co dobre, a nie tylko wtedy, gdy jestem wśród was obecny."
"Ga4,19": "Dzieciątka moje, które znowu w bólach rodzę, dopóki Chrystus nie będzie ukształtowany w was!"
"Ga4,20": "Chciałbym teraz być obecnym przy was i odmienić mój głos, ponieważ jestem zakłopotany co do was."
"Ga4,21": "Powiedzcie mi wy, którzy chcecie być pod Prawem, czy nie słuchacie tego Prawa?"
"Ga4,22": "Albowiem jest napisane, że Abraham miał dwóch synów, jednego z niewolnicy, a drugiego z wolnej."
"Ga4,23": "A ten, jednakże, który był z niewolnicy, jest zrodzony zgodnie z wolą ciała, ten natomiast z wolnej, ze względu na obietnicę."
"Ga4,24": "To jest znaczenie obrazowe; są to bowiem dwa przymierza; jedno z góry Synaj, które istotnie rodzi w niewolę; jest nim Hagar."
"Ga4,25": "Hagar bowiem jest to góra Synaj w Arabii, a odpowiada dzisiejszej Jerozolimie; bo jest w niewoli ze swoimi dziećmi."
"Ga4,26": "Lecz górna Jerozolima jest wolna i ona jest matką nas wszystkich."
"Ga4,27": "Albowiem jest napisane: Rozraduj się niepłodna, ty, która nie rodzisz; wydaj okrzyk i zawołaj, ty, która nie rodzisz w bólach; bo samotna ma więcej dzieci niż ta, która ma męża."
"Ga4,28": "My natomiast, bracia, jesteśmy dziećmi obietnicy na podobieństwo Izaaka."
"Ga4,29": "Lecz tak, jak wtedy ten, który został zrodzony według ciała, prześladował tego, który został zrodzony według Ducha, tak i teraz."
"Ga4,30": "Ale co mówi Pismo? Wyrzuć niewolnicę i jej syna; bo na pewno nie będzie dziedziczyć syn niewolnicy z synem wolnej."
"Ga4,31": "Zatem, bracia, nie jesteśmy dziećmi niewolnicy, ale wolnej."
