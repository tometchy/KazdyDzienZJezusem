"Ga6,1": "Bracia! Jeśli człowiek zostanie przyłapany na jakimś upadku, wy jako duchowi, naprawiajcie takiego w duchu łagodności, przyglądając się uważnie sobie, abyś i ty nie został poddany próbie."
"Ga6,2": "Jedni drugich brzemiona noście, a tak wypełnijcie Prawo Chrystusa."
"Ga6,3": "Albowiem jeśli ktoś uważa, że jest kimś, będąc nikim, ten zwodzi w myśleniu samego siebie."
"Ga6,4": "Ale każdy niech sam bada swoje dzieło, a wtedy będzie miał chlubę jedynie w sobie samym, a nie w innym,"
"Ga6,5": "Albowiem każdy swój własny ciężar poniesie."
"Ga6,6": "A ten, który jest nauczany o Słowie, niech ma wspólnotę wszelkiego dobra z tym, który go naucza."
"Ga6,7": "Nie dajcie się wprowadzić w błąd. Bóg nie daje się z siebie naśmiewać; albowiem cokolwiek by człowiek siał, to też będzie żął."
"Ga6,8": "Bo kto sieje dla swojego ciała, z ciała żął będzie skażenie; ale kto sieje dla ducha, z ducha żął będzie życie wieczne."
"Ga6,9": "A nie zniechęcajmy się czyniąc dobro; albowiem w swoim czasie będziemy żąć nieznużeni."
"Ga6,10": "Zatem więc, dopóki mamy czas, czyńmy dobro względem wszystkich, a najwięcej względem domowników w wierze."
"Ga6,11": "Popatrzcie, jak wielkimi literami napisałem wam swoją ręką."
"Ga6,12": "Ci wszyscy, którzy chcą się podobać w ciele, ci zmuszają was, abyście byli obrzezani jedynie po to, aby nie byli prześladowani z powodu krzyża Chrystusa."
"Ga6,13": "Albowiem ci, którzy są obrzezani, sami nie zachowują Prawa, ale chcą, abyście byli obrzezani, aby chlubić się z waszego ciała."
"Ga6,14": "Co do mnie natomiast, oby się tak nie stało, abym się chlubił, chyba tylko w krzyżu Pana naszego Jezusa Chrystusa, przez którego dla mnie świat jest ukrzyżowany, a ja dla świata."
"Ga6,15": "Albowiem w Chrystusie Jezusie ani obrzezanie nie jest ważne, ani nieobrzezanie, ale nowe stworzenie."
"Ga6,16": "A wszyscy ci, którzy według tego wzoru będą kroczyć – nad nimi pokój i miłosierdzie, i nad Izraelem Boga."
"Ga6,17": "Odtąd niech mi nikt nie dodaje trudu; ja bowiem piętna Pana Jezusa noszę na swoim ciele."
"Ga6,18": "Łaska Pana naszego Jezusa Chrystusa z duchem waszym, bracia. Amen."
