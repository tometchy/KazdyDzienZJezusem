"Ga6,1":
  text: "Bracia! Jeśli człowiek zostanie przyłapany na jakimś upadku, wy jako duchowi, naprawiajcie takiego w duchu łagodności, przyglądając się uważnie sobie, abyś i ty nie został poddany próbie."
  tags: []
"Ga6,2":
  text: "Jedni drugich brzemiona noście, a tak wypełnijcie Prawo Chrystusa."
  tags: []
"Ga6,3":
  text: "Albowiem jeśli ktoś uważa, że jest kimś, będąc nikim, ten zwodzi w myśleniu samego siebie."
  tags: []
"Ga6,4":
  text: "Ale każdy niech sam bada swoje dzieło, a wtedy będzie miał chlubę jedynie w sobie samym, a nie w innym,"
  tags: []
"Ga6,5":
  text: "Albowiem każdy swój własny ciężar poniesie."
  tags: []
"Ga6,6":
  text: "A ten, który jest nauczany o Słowie, niech ma wspólnotę wszelkiego dobra z tym, który go naucza."
  tags: []
"Ga6,7":
  text: "Nie dajcie się wprowadzić w błąd. Bóg nie daje się z siebie naśmiewać; albowiem cokolwiek by człowiek siał, to też będzie żął."
  tags: []
"Ga6,8":
  text: "Bo kto sieje dla swojego ciała, z ciała żął będzie skażenie; ale kto sieje dla ducha, z ducha żął będzie życie wieczne."
  tags: []
"Ga6,9":
  text: "A nie zniechęcajmy się czyniąc dobro; albowiem w swoim czasie będziemy żąć nieznużeni."
  tags: []
"Ga6,10":
  text: "Zatem więc, dopóki mamy czas, czyńmy dobro względem wszystkich, a najwięcej względem domowników w wierze."
  tags: []
"Ga6,11":
  text: "Popatrzcie, jak wielkimi literami napisałem wam swoją ręką."
  tags: []
"Ga6,12":
  text: "Ci wszyscy, którzy chcą się podobać w ciele, ci zmuszają was, abyście byli obrzezani jedynie po to, aby nie byli prześladowani z powodu krzyża Chrystusa."
  tags: []
"Ga6,13":
  text: "Albowiem ci, którzy są obrzezani, sami nie zachowują Prawa, ale chcą, abyście byli obrzezani, aby chlubić się z waszego ciała."
  tags: []
"Ga6,14":
  text: "Co do mnie natomiast, oby się tak nie stało, abym się chlubił, chyba tylko w krzyżu Pana naszego Jezusa Chrystusa, przez którego dla mnie świat jest ukrzyżowany, a ja dla świata."
  tags: []
"Ga6,15":
  text: "Albowiem w Chrystusie Jezusie ani obrzezanie nie jest ważne, ani nieobrzezanie, ale nowe stworzenie."
  tags: []
"Ga6,16":
  text: "A wszyscy ci, którzy według tego wzoru będą kroczyć – nad nimi pokój i miłosierdzie, i nad Izraelem Boga."
  tags: []
"Ga6,17":
  text: "Odtąd niech mi nikt nie dodaje trudu; ja bowiem piętna Pana Jezusa noszę na swoim ciele."
  tags: []
"Ga6,18":
  text: "Łaska Pana naszego Jezusa Chrystusa z duchem waszym, bracia. Amen."
  tags: []
