"Ga1,1": "Paweł apostoł, wysłany nie od ludzi, ani przez człowieka, ale przez Jezusa Chrystusa i Boga Ojca, który Go wzbudził z martwych,"
"Ga1,2": "I wszyscy bracia, którzy są ze mną, do zborów Galacji."
"Ga1,3": "Łaska wam i pokój od Boga Ojca i Pana naszego Jezusa Chrystusa,"
"Ga1,4": "Który wydał samego siebie za nasze grzechy, aby nas wyrwać z obecnego wieku złego, zgodnie z wolą Boga i Ojca naszego,"
"Ga1,5": "Jemu chwała na wieki wieków. Amen."
"Ga1,6": "Dziwię się, że tak prędko dajecie się przenosić od Tego, który was powołał przez łaskę Chrystusa do innej Ewangelii;"
"Ga1,7": "Która nie jest inna, są tylko jacyś ludzie, którzy was niepokoją i chcą przekręcić Ewangelię Chrystusa."
"Ga1,8": "Ale jeśli nawet my lub anioł z nieba głosiłby wam Ewangelię inną od tej, którą my wam ogłosiliśmy, niech jest przeklęty."
"Ga1,9": "Jak wcześniej powiedziałem i teraz ponownie mówię: Jeśli wam ktoś głosi Ewangelię inną od tej, którą przyjęliście, niech jest przeklęty."
"Ga1,10": "Albowiem, czy teraz ludzi chcę pozyskać, czy Boga? Albo czy ludziom staram się podobać? Bo jeślibym jeszcze ludziom chciał się podobać, nie byłbym sługą Chrystusa."
"Ga1,11": "A oznajmiam wam, bracia, że Ewangelia przeze mnie ogłoszona, nie jest zgodna z myślą człowieka;"
"Ga1,12": "Ja bowiem ani jej nie wziąłem od człowieka, ani nie zostałem jej nauczony, ale mam ją przez objawienie Jezusa Chrystusa."
"Ga1,13": "Bo usłyszeliście o moim wcześniejszym postępowaniu w judaizmie, że niezmiernie prześladowałem Kościół Boga i niszczyłem go;"
"Ga1,14": "I robiłem postępy w judaizmie ponad wielu rówieśników z mojego pokolenia, będąc w większym stopniu od innych zapaleńcem względem moich ojczystych tradycji."
"Ga1,15": "Ale gdy upodobało się Bogu, który mnie odłączył już w łonie mojej matki i powołał przez swoją łaskę,"
"Ga1,16": "Objawić we mnie swojego Syna, abym głosił dobrą nowinę o Nim między poganami, natychmiast, nie radziłem się ciała i krwi;"
"Ga1,17": "I nie wstąpiłem do Jerozolimy do tych, którzy przede mną byli apostołami, ale odszedłem do Arabii i ponownie wróciłem do Damaszku."
"Ga1,18": "Następnie, po trzech latach wstąpiłem do Jerozolimy, żeby poznać Piotra; i pozostałem u niego piętnaście dni."
"Ga1,19": "A innego z apostołów nie widziałem z wyjątkiem Jakuba, brata Pana."
"Ga1,20": "A to, co wam piszę, oto oświadczam przed obliczem Boga, że nie kłamię."
"Ga1,21": "Potem poszedłem w okolice Syrii i Cylicji;"
"Ga1,22": "A nie byłem znany osobiście zborom Judei w Chrystusie;"
"Ga1,23": "A oni jedynie słyszeli, że ten, który nas wcześniej prześladował, teraz głosi jako dobrą nowinę tę wiarę, którą wcześniej niszczył."
"Ga1,24": "I chwalili Boga z mojego powodu."
