"Ga1,1":
  text: "Paweł apostoł, wysłany nie od ludzi, ani przez człowieka, ale przez Jezusa Chrystusa i Boga Ojca, który Go wzbudził z martwych,"
  tags: []
"Ga1,2":
  text: "I wszyscy bracia, którzy są ze mną, do zborów Galacji."
  tags: []
"Ga1,3":
  text: "Łaska wam i pokój od Boga Ojca i Pana naszego Jezusa Chrystusa,"
  tags: []
"Ga1,4":
  text: "Który wydał samego siebie za nasze grzechy, aby nas wyrwać z obecnego wieku złego, zgodnie z wolą Boga i Ojca naszego,"
  tags: []
"Ga1,5":
  text: "Jemu chwała na wieki wieków. Amen."
  tags: []
"Ga1,6":
  text: "Dziwię się, że tak prędko dajecie się przenosić od Tego, który was powołał przez łaskę Chrystusa do innej Ewangelii;"
  tags: []
"Ga1,7":
  text: "Która nie jest inna, są tylko jacyś ludzie, którzy was niepokoją i chcą przekręcić Ewangelię Chrystusa."
  tags: []
"Ga1,8":
  text: "Ale jeśli nawet my lub anioł z nieba głosiłby wam Ewangelię inną od tej, którą my wam ogłosiliśmy, niech jest przeklęty."
  tags: []
"Ga1,9":
  text: "Jak wcześniej powiedziałem i teraz ponownie mówię: Jeśli wam ktoś głosi Ewangelię inną od tej, którą przyjęliście, niech jest przeklęty."
  tags: []
"Ga1,10":
  text: "Albowiem, czy teraz ludzi chcę pozyskać, czy Boga? Albo czy ludziom staram się podobać? Bo jeślibym jeszcze ludziom chciał się podobać, nie byłbym sługą Chrystusa."
  tags: []
"Ga1,11":
  text: "A oznajmiam wam, bracia, że Ewangelia przeze mnie ogłoszona, nie jest zgodna z myślą człowieka;"
  tags: []
"Ga1,12":
  text: "Ja bowiem ani jej nie wziąłem od człowieka, ani nie zostałem jej nauczony, ale mam ją przez objawienie Jezusa Chrystusa."
  tags: []
"Ga1,13":
  text: "Bo usłyszeliście o moim wcześniejszym postępowaniu w judaizmie, że niezmiernie prześladowałem Kościół Boga i niszczyłem go;"
  tags: []
"Ga1,14":
  text: "I robiłem postępy w judaizmie ponad wielu rówieśników z mojego pokolenia, będąc w większym stopniu od innych zapaleńcem względem moich ojczystych tradycji."
  tags: []
"Ga1,15":
  text: "Ale gdy upodobało się Bogu, który mnie odłączył już w łonie mojej matki i powołał przez swoją łaskę,"
  tags: []
"Ga1,16":
  text: "Objawić we mnie swojego Syna, abym głosił dobrą nowinę o Nim między poganami, natychmiast, nie radziłem się ciała i krwi;"
  tags: []
"Ga1,17":
  text: "I nie wstąpiłem do Jerozolimy do tych, którzy przede mną byli apostołami, ale odszedłem do Arabii i ponownie wróciłem do Damaszku."
  tags: []
"Ga1,18":
  text: "Następnie, po trzech latach wstąpiłem do Jerozolimy, żeby poznać Piotra; i pozostałem u niego piętnaście dni."
  tags: []
"Ga1,19":
  text: "A innego z apostołów nie widziałem z wyjątkiem Jakuba, brata Pana."
  tags: []
"Ga1,20":
  text: "A to, co wam piszę, oto oświadczam przed obliczem Boga, że nie kłamię."
  tags: []
"Ga1,21":
  text: "Potem poszedłem w okolice Syrii i Cylicji;"
  tags: []
"Ga1,22":
  text: "A nie byłem znany osobiście zborom Judei w Chrystusie;"
  tags: []
"Ga1,23":
  text: "A oni jedynie słyszeli, że ten, który nas wcześniej prześladował, teraz głosi jako dobrą nowinę tę wiarę, którą wcześniej niszczył."
  tags: []
"Ga1,24":
  text: "I chwalili Boga z mojego powodu."
  tags: []
