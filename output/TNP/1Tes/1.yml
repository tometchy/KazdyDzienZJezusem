"1Tes1,1":
  text: "Paweł i Sylwan, i Tymoteusz do zboru Tesaloniczan w Bogu Ojcu i w Panu Jezusie Chrystusie. Łaska wam i pokój od Boga, Ojca naszego i Pana Jezusa Chrystusa."
  tags: []
"1Tes1,2":
  text: "Dziękujemy Bogu zawsze za was wszystkich, gdy wspominamy was w naszych modlitwach."
  tags: []
"1Tes1,3":
  text: "Nieustannie przypominając sobie o dziele waszej wiary i o trudzie miłości, i o wytrwałości w nadziei co do Pana naszego Jezusa Chrystusa, przed Bogiem i Ojcem naszym,"
  tags: []
"1Tes1,4":
  text: "Wiedząc, bracia umiłowani przez Boga, o wybraniu waszym,"
  tags: []
"1Tes1,5":
  text: "Że nasza Ewangelia zaistniała w was nie tylko w Słowie, ale i w mocy, i w Duchu Świętym, i w wielkiej całkowitej pewności, jak wiecie, jakimi staliśmy się pośród was ze względu na was."
  tags: []
"1Tes1,6":
  text: "A wy staliście się naśladowcami naszymi i Pana, przyjmując Słowo w wielkim ucisku, z radością Ducha Świętego,"
  tags: []
"1Tes1,7":
  text: "Tak, że wy staliście się wzorem dla wszystkich wierzących w Macedonii i w Achai."
  tags: []
"1Tes1,8":
  text: "Bowiem od was rozbrzmiało Słowo Pana nie tylko w Macedonii i w Achai, ale i w każdym miejscu rozeszła się wasza wiara w Boga, tak że nie mamy potrzeby o tym mówić,"
  tags: []
"1Tes1,9":
  text: "Sami bowiem o nas oznajmiają, jak szerokie mieliśmy wejście do was i jak nawróciliście się od bożków do Boga, aby służyć Bogu żywemu i prawdziwemu,"
  tags: []
"1Tes1,10":
  text: "I oczekiwać Syna Jego z niebios, którego wzbudził z martwych, Jezusa, który nas wyrywa od nadchodzącego gniewu."
  tags: []
