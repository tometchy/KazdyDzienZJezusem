"1Tes1,1": "Paweł i Sylwan, i Tymoteusz do zboru Tesaloniczan w Bogu Ojcu i w Panu Jezusie Chrystusie. Łaska wam i pokój od Boga, Ojca naszego i Pana Jezusa Chrystusa."
"1Tes1,2": "Dziękujemy Bogu zawsze za was wszystkich, gdy wspominamy was w naszych modlitwach."
"1Tes1,3": "Nieustannie przypominając sobie o dziele waszej wiary i o trudzie miłości, i o wytrwałości w nadziei co do Pana naszego Jezusa Chrystusa, przed Bogiem i Ojcem naszym,"
"1Tes1,4": "Wiedząc, bracia umiłowani przez Boga, o wybraniu waszym,"
"1Tes1,5": "Że nasza Ewangelia zaistniała w was nie tylko w Słowie, ale i w mocy, i w Duchu Świętym, i w wielkiej całkowitej pewności, jak wiecie, jakimi staliśmy się pośród was ze względu na was."
"1Tes1,6": "A wy staliście się naśladowcami naszymi i Pana, przyjmując Słowo w wielkim ucisku, z radością Ducha Świętego,"
"1Tes1,7": "Tak, że wy staliście się wzorem dla wszystkich wierzących w Macedonii i w Achai."
"1Tes1,8": "Bowiem od was rozbrzmiało Słowo Pana nie tylko w Macedonii i w Achai, ale i w każdym miejscu rozeszła się wasza wiara w Boga, tak że nie mamy potrzeby o tym mówić,"
"1Tes1,9": "Sami bowiem o nas oznajmiają, jak szerokie mieliśmy wejście do was i jak nawróciliście się od bożków do Boga, aby służyć Bogu żywemu i prawdziwemu,"
"1Tes1,10": "I oczekiwać Syna Jego z niebios, którego wzbudził z martwych, Jezusa, który nas wyrywa od nadchodzącego gniewu."
