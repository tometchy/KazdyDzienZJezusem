"1Tes5,1": "Natomiast o czasach i porach, bracia, nie ma potrzeby wam pisać."
"1Tes5,2": "Sami bowiem dokładnie wiecie, że dzień Pana nadchodzi jak złodziej w nocy."
"1Tes5,3": "Bo gdy będą mówić: Pokój i bezpieczeństwo, wtedy nadciąga na nich nagła zguba, jak bóle na kobietę w ciąży; i nie umkną."
"1Tes5,4": "Lecz wy, bracia, nie jesteście w ciemności, aby ten dzień miał was zaskoczyć jak złodziej."
"1Tes5,5": "Wy wszyscy jesteście synami światłości i synami dnia; nie jesteśmy synami nocy ani ciemności."
"1Tes5,6": "Dlatego nie śpijmy jak pozostali, ale czuwajmy i bądźmy trzeźwi."
"1Tes5,7": "Ci bowiem, którzy śpią, w nocy śpią; a ci, którzy się upijają, nocą są pijani."
"1Tes5,8": "Lecz my, należący do dnia, bądźmy trzeźwi, jako ci, którzy włożyli na siebie pancerz wiary i miłości, i hełm nadziei zbawienia."
"1Tes5,9": "Gdyż Bóg nie przeznaczył nas na gniew, ale na pozyskanie zbawienia przez Pana naszego Jezusa Chrystusa,"
"1Tes5,10": "Który umarł za nas, abyśmy, czy czuwamy, czy śpimy, razem z Nim żyli."
"1Tes5,11": "Dlatego zachęcajcie jedni drugich i budujcie jeden drugiego, co też i czynicie."
"1Tes5,12": "A prosimy was, bracia, abyście dostrzegali tych, którzy trudzą się między wami i którzy przewodzą wam w Panu, i korygują was,"
"1Tes5,13": "Ceńcie ich wysoko w miłości z powodu ich pracy. Pokój zachowujcie między sobą."
"1Tes5,14": "A zachęcamy was, bracia, korygujcie niezdyscyplinowanych, pocieszajcie lękliwych, podtrzymujcie słabych, bądźcie cierpliwi wobec wszystkich."
"1Tes5,15": "Patrzcie, aby nikt nikomu nie oddawał złem za zło, ale zawsze zabiegajcie o dobro jedni wobec drugich i wobec wszystkich."
"1Tes5,16": "Zawsze się radujcie."
"1Tes5,17": "Nieustannie się módlcie."
"1Tes5,18": "We wszystkim dziękujcie; bo taka jest wola Boga w Chrystusie Jezusie wobec was."
"1Tes5,19": "Ducha nie gaście."
"1Tes5,20": "Proroctw nie lekceważcie."
"1Tes5,21": "Wszystko poddawajcie próbie, co dobre, tego się trzymajcie."
"1Tes5,22": "Trzymajcie się z dala od każdej postaci zła."
"1Tes5,23": "A sam Bóg pokoju oby was całkowicie uświęcił i w pełni wyposażył, a wasz duch i dusza, i ciało oby zostały zachowane bez nagany na przyjście Pana naszego Jezusa Chrystusa."
"1Tes5,24": "Wierny jest Ten, który was powołuje, który i tego dokona."
"1Tes5,25": "Bracia, módlcie się za nas."
"1Tes5,26": "Pozdrówcie wszystkich braci świętym pocałunkiem."
"1Tes5,27": "Poprzysięgam was na Pana, aby ten list został odczytany wszystkim świętym braciom."
"1Tes5,28": "Łaska Pana naszego Jezusa Chrystusa z wami. Amen."
