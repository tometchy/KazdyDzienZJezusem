"1Tes5,1":
  text: "Natomiast o czasach i porach, bracia, nie ma potrzeby wam pisać."
  tags: []
"1Tes5,2":
  text: "Sami bowiem dokładnie wiecie, że dzień Pana nadchodzi jak złodziej w nocy."
  tags: []
"1Tes5,3":
  text: "Bo gdy będą mówić: Pokój i bezpieczeństwo, wtedy nadciąga na nich nagła zguba, jak bóle na kobietę w ciąży; i nie umkną."
  tags: []
"1Tes5,4":
  text: "Lecz wy, bracia, nie jesteście w ciemności, aby ten dzień miał was zaskoczyć jak złodziej."
  tags: []
"1Tes5,5":
  text: "Wy wszyscy jesteście synami światłości i synami dnia; nie jesteśmy synami nocy ani ciemności."
  tags: []
"1Tes5,6":
  text: "Dlatego nie śpijmy jak pozostali, ale czuwajmy i bądźmy trzeźwi."
  tags: []
"1Tes5,7":
  text: "Ci bowiem, którzy śpią, w nocy śpią; a ci, którzy się upijają, nocą są pijani."
  tags: []
"1Tes5,8":
  text: "Lecz my, należący do dnia, bądźmy trzeźwi, jako ci, którzy włożyli na siebie pancerz wiary i miłości, i hełm nadziei zbawienia."
  tags: []
"1Tes5,9":
  text: "Gdyż Bóg nie przeznaczył nas na gniew, ale na pozyskanie zbawienia przez Pana naszego Jezusa Chrystusa,"
  tags: []
"1Tes5,10":
  text: "Który umarł za nas, abyśmy, czy czuwamy, czy śpimy, razem z Nim żyli."
  tags: []
"1Tes5,11":
  text: "Dlatego zachęcajcie jedni drugich i budujcie jeden drugiego, co też i czynicie."
  tags: []
"1Tes5,12":
  text: "A prosimy was, bracia, abyście dostrzegali tych, którzy trudzą się między wami i którzy przewodzą wam w Panu, i korygują was,"
  tags: []
"1Tes5,13":
  text: "Ceńcie ich wysoko w miłości z powodu ich pracy. Pokój zachowujcie między sobą."
  tags: []
"1Tes5,14":
  text: "A zachęcamy was, bracia, korygujcie niezdyscyplinowanych, pocieszajcie lękliwych, podtrzymujcie słabych, bądźcie cierpliwi wobec wszystkich."
  tags: []
"1Tes5,15":
  text: "Patrzcie, aby nikt nikomu nie oddawał złem za zło, ale zawsze zabiegajcie o dobro jedni wobec drugich i wobec wszystkich."
  tags: []
"1Tes5,16":
  text: "Zawsze się radujcie."
  tags: []
"1Tes5,17":
  text: "Nieustannie się módlcie."
  tags: []
"1Tes5,18":
  text: "We wszystkim dziękujcie; bo taka jest wola Boga w Chrystusie Jezusie wobec was."
  tags: []
"1Tes5,19":
  text: "Ducha nie gaście."
  tags: []
"1Tes5,20":
  text: "Proroctw nie lekceważcie."
  tags: []
"1Tes5,21":
  text: "Wszystko poddawajcie próbie, co dobre, tego się trzymajcie."
  tags: []
"1Tes5,22":
  text: "Trzymajcie się z dala od każdej postaci zła."
  tags: []
"1Tes5,23":
  text: "A sam Bóg pokoju oby was całkowicie uświęcił i w pełni wyposażył, a wasz duch i dusza, i ciało oby zostały zachowane bez nagany na przyjście Pana naszego Jezusa Chrystusa."
  tags: []
"1Tes5,24":
  text: "Wierny jest Ten, który was powołuje, który i tego dokona."
  tags: []
"1Tes5,25":
  text: "Bracia, módlcie się za nas."
  tags: []
"1Tes5,26":
  text: "Pozdrówcie wszystkich braci świętym pocałunkiem."
  tags: []
"1Tes5,27":
  text: "Poprzysięgam was na Pana, aby ten list został odczytany wszystkim świętym braciom."
  tags: []
"1Tes5,28":
  text: "Łaska Pana naszego Jezusa Chrystusa z wami. Amen."
  tags: []
