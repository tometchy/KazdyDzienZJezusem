"1Tes3,1":
  text: "Dlatego też, nie mogąc już dłużej tego znosić, postanowiliśmy pozostać sami w Atenach,"
  tags: []
"1Tes3,2":
  text: "I posłaliśmy Tymoteusza, naszego brata i sługę Bożego, i naszego współpracownika w Ewangelii Chrystusa, aby was utwierdził i zachęcił w waszej wierze,"
  tags: []
"1Tes3,3":
  text: "By nikt nie zachwiał się w tych uciskach; sami bowiem wiecie, że do tego jesteśmy przeznaczeni."
  tags: []
"1Tes3,4":
  text: "Gdy byliśmy bowiem u was, zapowiadaliśmy wam, że mamy być uciskani, i co też, jak wiecie, się stało."
  tags: []
"1Tes3,5":
  text: "Dlatego i ja, nie mogąc już więcej tego znosić, posłałem, aby dowiedzieć się o waszej wierze, czy czasem nie skusił was, ten który kusi i czy nasz trud nie stał się daremny."
  tags: []
"1Tes3,6":
  text: "Lecz teraz, gdy Tymoteusz przyszedł od was do nas i opowiedział nam radosną nowinę o waszej wierze i o miłości, i że nas zawsze dobrze wspominacie, pragnąc nas zobaczyć, tak jak i my was,"
  tags: []
"1Tes3,7":
  text: "Przez to zostaliśmy zachęceni przez was, bracia, w każdym naszym utrapieniu i potrzebie, przez waszą wiarę;"
  tags: []
"1Tes3,8":
  text: "Bo teraz żyjemy, jeśli wy trwacie w Panu."
  tags: []
"1Tes3,9":
  text: "Albowiem jakie dziękczynienie możemy oddać Bogu w zamian za was, za całą radość której doznajemy z powodu was przed naszym Bogiem?"
  tags: []
"1Tes3,10":
  text: "Nocą i dniem bardzo usilnie modląc się, abyśmy zobaczyli wasze oblicze i uzupełnili braki waszej wiary."
  tags: []
"1Tes3,11":
  text: "A sam Bóg i Ojciec nasz, i Pan nasz Jezus Chrystus oby wyprostował drogę naszą do was."
  tags: []
"1Tes3,12":
  text: "A Pan oby was jeszcze bardziej napełnił miłością i uczynił w niej obfitującymi do siebie nawzajem i do wszystkich, tak jak i my do was jesteśmy,"
  tags: []
"1Tes3,13":
  text: "Aby utwierdzić wasze serca jako nienaganne w świętości przed Bogiem i Ojcem naszym, na przyjście Pana naszego Jezusa Chrystusa ze wszystkimi Jego świętymi."
  tags: []
