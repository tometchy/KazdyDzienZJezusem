"1Tes3,1": "Dlatego też, nie mogąc już dłużej tego znosić, postanowiliśmy pozostać sami w Atenach,"
"1Tes3,2": "I posłaliśmy Tymoteusza, naszego brata i sługę Bożego, i naszego współpracownika w Ewangelii Chrystusa, aby was utwierdził i zachęcił w waszej wierze,"
"1Tes3,3": "By nikt nie zachwiał się w tych uciskach; sami bowiem wiecie, że do tego jesteśmy przeznaczeni."
"1Tes3,4": "Gdy byliśmy bowiem u was, zapowiadaliśmy wam, że mamy być uciskani, i co też, jak wiecie, się stało."
"1Tes3,5": "Dlatego i ja, nie mogąc już więcej tego znosić, posłałem, aby dowiedzieć się o waszej wierze, czy czasem nie skusił was, ten który kusi i czy nasz trud nie stał się daremny."
"1Tes3,6": "Lecz teraz, gdy Tymoteusz przyszedł od was do nas i opowiedział nam radosną nowinę o waszej wierze i o miłości, i że nas zawsze dobrze wspominacie, pragnąc nas zobaczyć, tak jak i my was,"
"1Tes3,7": "Przez to zostaliśmy zachęceni przez was, bracia, w każdym naszym utrapieniu i potrzebie, przez waszą wiarę;"
"1Tes3,8": "Bo teraz żyjemy, jeśli wy trwacie w Panu."
"1Tes3,9": "Albowiem jakie dziękczynienie możemy oddać Bogu w zamian za was, za całą radość której doznajemy z powodu was przed naszym Bogiem?"
"1Tes3,10": "Nocą i dniem bardzo usilnie modląc się, abyśmy zobaczyli wasze oblicze i uzupełnili braki waszej wiary."
"1Tes3,11": "A sam Bóg i Ojciec nasz, i Pan nasz Jezus Chrystus oby wyprostował drogę naszą do was."
"1Tes3,12": "A Pan oby was jeszcze bardziej napełnił miłością i uczynił w niej obfitującymi do siebie nawzajem i do wszystkich, tak jak i my do was jesteśmy,"
"1Tes3,13": "Aby utwierdzić wasze serca jako nienaganne w świętości przed Bogiem i Ojcem naszym, na przyjście Pana naszego Jezusa Chrystusa ze wszystkimi Jego świętymi."
