"1Tes2,1":
  text: "Albowiem sami wiecie, bracia, że przyjście nasze do was nie było daremne;"
  tags: []
"1Tes2,2":
  text: "Ale chociaż i przedtem, jak wiecie, cierpieliśmy i doznaliśmy zniewag w Filippi, jednak śmiało w Bogu naszym powiedzieliśmy u was Ewangelię Bożą w wielkim boju."
  tags: []
"1Tes2,3":
  text: "Albowiem wezwanie nasze nie wypływa z błędu ani z nieczystości, ani nie kryje w sobie podstępu,"
  tags: []
"1Tes2,4":
  text: "Ale jak zostaliśmy wypróbowani przez Boga, aby została nam powierzona Ewangelia, tak mówimy, nie aby podobać się ludziom, ale Bogu, który poddaje próbie nasze serca."
  tags: []
"1Tes2,5":
  text: "Bo jak wiecie, nigdy nie byliśmy u was ze słowem pochlebstwa ani pod pozorem chciwości; Bóg jest tego świadkiem."
  tags: []
"1Tes2,6":
  text: "Ani nie szukamy chwały od ludzi, ani od was, ani od innych, choć jako apostołowie Chrystusa możemy być w poważaniu;"
  tags: []
"1Tes2,7":
  text: "Ale byliśmy łagodni pośród was, jak karmicielka pielęgnująca swoje dzieci."
  tags: []
"1Tes2,8":
  text: "Tak przywiązaliśmy się do was, że byliśmy gotowi przekazać wam nie tylko Ewangelię Bożą, ale i własne dusze, ponieważ staliście się dla nas umiłowani."
  tags: []
"1Tes2,9":
  text: "Albowiem pamiętacie, bracia, trud nasz i mozół, gdyż pracując nocą i dniem, aby nikogo z was nie obciążyć, ogłosiliśmy wam Ewangelię Bożą."
  tags: []
"1Tes2,10":
  text: "Wy jesteście świadkami i Bóg, jak święcie i sprawiedliwie, i bez nagany postępowaliśmy pośród was wierzących."
  tags: []
"1Tes2,11":
  text: "I jak wiecie, że każdego z was, jak ojciec swoje dzieci, zachęcaliśmy i pocieszaliśmy,"
  tags: []
"1Tes2,12":
  text: "I świadczyliśmy wam, abyście chodzili w sposób godny Boga, który was powołuje do swojego Królestwa i do chwały."
  tags: []
"1Tes2,13":
  text: "Dlatego i my, nieustannie dziękujemy Bogu, że przyjmując od nas Słowo wieści o Bogu, przyjęliście je, nie jako słowo ludzkie, ale tak jak jest naprawdę, jako Słowo Boga, który i w was wierzących skutecznie działa."
  tags: []
"1Tes2,14":
  text: "Wy bowiem, bracia, staliście się naśladowcami zborów Boga, które są w Judei, w Chrystusie Jezusie; gdyż i wy tak samo cierpieliście od swoich rodaków, tak jak oni od Judejczyków,"
  tags: []
"1Tes2,15":
  text: "Którzy i Pana Jezusa, i swoich własnych proroków zabili i nas prześladowali, i Bogu się nie podobają, i wszystkim ludziom są przeciwni,"
  tags: []
"1Tes2,16":
  text: "Przeszkadzają nam mówić do pogan, aby i oni zostali zbawieni, by przez to dopełnić miary swoich grzechów; na zawsze nadszedł bowiem na nich gniew aż do końca."
  tags: []
"1Tes2,17":
  text: "Lecz my, bracia, będąc odłączeni od was na chwilę obliczem, ale nie sercem, tym bardziej z wielkim pragnieniem wykazaliśmy gorliwość, by ujrzeć wasze oblicze."
  tags: []
"1Tes2,18":
  text: "Dlatego chcieliśmy, zwłaszcza ja, Paweł, przyjść do was i raz i drugi; ale przeszkodził nam szatan."
  tags: []
"1Tes2,19":
  text: "Kto bowiem jest naszą nadzieją czy radością, czy wieńcem przynoszącym chlubę? Czyż nie i wy przed Panem naszym Jezusem Chrystusem w chwili Jego przyjścia?"
  tags: []
"1Tes2,20":
  text: "Wy bowiem jesteście naszą chwałą i radością."
  tags: []
