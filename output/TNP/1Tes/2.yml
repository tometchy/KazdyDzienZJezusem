"1Tes2,1": "Albowiem sami wiecie, bracia, że przyjście nasze do was nie było daremne;"
"1Tes2,2": "Ale chociaż i przedtem, jak wiecie, cierpieliśmy i doznaliśmy zniewag w Filippi, jednak śmiało w Bogu naszym powiedzieliśmy u was Ewangelię Bożą w wielkim boju."
"1Tes2,3": "Albowiem wezwanie nasze nie wypływa z błędu ani z nieczystości, ani nie kryje w sobie podstępu,"
"1Tes2,4": "Ale jak zostaliśmy wypróbowani przez Boga, aby została nam powierzona Ewangelia, tak mówimy, nie aby podobać się ludziom, ale Bogu, który poddaje próbie nasze serca."
"1Tes2,5": "Bo jak wiecie, nigdy nie byliśmy u was ze słowem pochlebstwa ani pod pozorem chciwości; Bóg jest tego świadkiem."
"1Tes2,6": "Ani nie szukamy chwały od ludzi, ani od was, ani od innych, choć jako apostołowie Chrystusa możemy być w poważaniu;"
"1Tes2,7": "Ale byliśmy łagodni pośród was, jak karmicielka pielęgnująca swoje dzieci."
"1Tes2,8": "Tak przywiązaliśmy się do was, że byliśmy gotowi przekazać wam nie tylko Ewangelię Bożą, ale i własne dusze, ponieważ staliście się dla nas umiłowani."
"1Tes2,9": "Albowiem pamiętacie, bracia, trud nasz i mozół, gdyż pracując nocą i dniem, aby nikogo z was nie obciążyć, ogłosiliśmy wam Ewangelię Bożą."
"1Tes2,10": "Wy jesteście świadkami i Bóg, jak święcie i sprawiedliwie, i bez nagany postępowaliśmy pośród was wierzących."
"1Tes2,11": "I jak wiecie, że każdego z was, jak ojciec swoje dzieci, zachęcaliśmy i pocieszaliśmy,"
"1Tes2,12": "I świadczyliśmy wam, abyście chodzili w sposób godny Boga, który was powołuje do swojego Królestwa i do chwały."
"1Tes2,13": "Dlatego i my, nieustannie dziękujemy Bogu, że przyjmując od nas Słowo wieści o Bogu, przyjęliście je, nie jako słowo ludzkie, ale tak jak jest naprawdę, jako Słowo Boga, który i w was wierzących skutecznie działa."
"1Tes2,14": "Wy bowiem, bracia, staliście się naśladowcami zborów Boga, które są w Judei, w Chrystusie Jezusie; gdyż i wy tak samo cierpieliście od swoich rodaków, tak jak oni od Judejczyków,"
"1Tes2,15": "Którzy i Pana Jezusa, i swoich własnych proroków zabili i nas prześladowali, i Bogu się nie podobają, i wszystkim ludziom są przeciwni,"
"1Tes2,16": "Przeszkadzają nam mówić do pogan, aby i oni zostali zbawieni, by przez to dopełnić miary swoich grzechów; na zawsze nadszedł bowiem na nich gniew aż do końca."
"1Tes2,17": "Lecz my, bracia, będąc odłączeni od was na chwilę obliczem, ale nie sercem, tym bardziej z wielkim pragnieniem wykazaliśmy gorliwość, by ujrzeć wasze oblicze."
"1Tes2,18": "Dlatego chcieliśmy, zwłaszcza ja, Paweł, przyjść do was i raz i drugi; ale przeszkodził nam szatan."
"1Tes2,19": "Kto bowiem jest naszą nadzieją czy radością, czy wieńcem przynoszącym chlubę? Czyż nie i wy przed Panem naszym Jezusem Chrystusem w chwili Jego przyjścia?"
"1Tes2,20": "Wy bowiem jesteście naszą chwałą i radością."
