"1Tes4,1": "W końcu więc, bracia, prosimy was i zachęcamy w Panu Jezusie, tak jak przyjęliście od nas, jak macie postępować i podobać się Bogu, abyście tym więcej obfitowali;"
"1Tes4,2": "Gdyż wiecie, jakie daliśmy wam rozkazy za sprawą Pana Jezusa."
"1Tes4,3": "To jest bowiem wola Boża, wasze uświęcenie, żebyście powstrzymywali się od nierządu;"
"1Tes4,4": "Aby każdy z was umiał utrzymywać swoje naczynie w świętości i czci;"
"1Tes4,5": "Nie w namiętności żądzy, tak jak poganie, nieznający Boga."
"1Tes4,6": "Aby nikt nie wykraczał przeciwko swojemu bratu i w tej sprawie go nie oszukiwał; bo PAN jest mścicielem tego wszystkiego, tak jak wam wcześniej zapowiedzieliśmy i zaświadczyliśmy."
"1Tes4,7": "Bóg bowiem nie powołał nas do nieczystości, ale do uświęcenia."
"1Tes4,8": "Zatem kto to odrzuca, odrzuca nie człowieka, ale Boga, który też dał nam swojego Ducha Świętego."
"1Tes4,9": "Natomiast o miłości braterskiej nie mamy potrzeby wam pisać; bo wy sami jesteście przez Boga nauczeni, abyście miłowali jedni drugich."
"1Tes4,10": "Czynicie to bowiem wobec wszystkich braci w całej Macedonii; ale was zachęcamy, bracia, żebyście w tym bardziej obfitowali,"
"1Tes4,11": "I abyście uczynili swoim celem życie ciche, i czynili swoje obowiązki, i pracowali własnymi rękami, jak wam rozkazaliśmy,"
"1Tes4,12": "Abyście dostojnie postępowali wobec tych, którzy są na zewnątrz i nikogo nie potrzebowali."
"1Tes4,13": "A nie chcę, bracia, abyście nie wiedzieli o tych, którzy zasnęli, żebyście nie byli zasmucani, tak jak pozostali, którzy nie mają nadziei."
"1Tes4,14": "Jeśli bowiem wierzymy, że Jezus umarł i zmartwychwstał, tak i tych, którzy zasnęli ze względu na Jezusa, Bóg poprowadzi razem z Nim."
"1Tes4,15": "Bo to mówimy wam w Słowie Pana, że my żyjący, nadal pozostawiani na przyjście Pana, nie wyprzedzimy tych, którzy zasnęli."
"1Tes4,16": "Gdyż sam Pan na okrzyk, na głos archanioła i na głos trąby Bożej zstąpi z nieba, a umarli w Chrystusie powstaną najpierw."
"1Tes4,17": "Potem my, pozostający przy życiu, równocześnie z nimi zostaniemy porwani w obłokach na spotkanie Pana, w powietrze; i tak zawsze będziemy z Panem."
"1Tes4,18": "Dlatego pocieszajcie jedni drugich tymi słowami."
