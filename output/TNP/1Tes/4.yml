"1Tes4,1":
  text: "W końcu więc, bracia, prosimy was i zachęcamy w Panu Jezusie, tak jak przyjęliście od nas, jak macie postępować i podobać się Bogu, abyście tym więcej obfitowali;"
  tags: []
"1Tes4,2":
  text: "Gdyż wiecie, jakie daliśmy wam rozkazy za sprawą Pana Jezusa."
  tags: []
"1Tes4,3":
  text: "To jest bowiem wola Boża, wasze uświęcenie, żebyście powstrzymywali się od nierządu;"
  tags: []
"1Tes4,4":
  text: "Aby każdy z was umiał utrzymywać swoje naczynie w świętości i czci;"
  tags: []
"1Tes4,5":
  text: "Nie w namiętności żądzy, tak jak poganie, nieznający Boga."
  tags: []
"1Tes4,6":
  text: "Aby nikt nie wykraczał przeciwko swojemu bratu i w tej sprawie go nie oszukiwał; bo PAN jest mścicielem tego wszystkiego, tak jak wam wcześniej zapowiedzieliśmy i zaświadczyliśmy."
  tags: []
"1Tes4,7":
  text: "Bóg bowiem nie powołał nas do nieczystości, ale do uświęcenia."
  tags: []
"1Tes4,8":
  text: "Zatem kto to odrzuca, odrzuca nie człowieka, ale Boga, który też dał nam swojego Ducha Świętego."
  tags: []
"1Tes4,9":
  text: "Natomiast o miłości braterskiej nie mamy potrzeby wam pisać; bo wy sami jesteście przez Boga nauczeni, abyście miłowali jedni drugich."
  tags: []
"1Tes4,10":
  text: "Czynicie to bowiem wobec wszystkich braci w całej Macedonii; ale was zachęcamy, bracia, żebyście w tym bardziej obfitowali,"
  tags: []
"1Tes4,11":
  text: "I abyście uczynili swoim celem życie ciche, i czynili swoje obowiązki, i pracowali własnymi rękami, jak wam rozkazaliśmy,"
  tags: []
"1Tes4,12":
  text: "Abyście dostojnie postępowali wobec tych, którzy są na zewnątrz i nikogo nie potrzebowali."
  tags: []
"1Tes4,13":
  text: "A nie chcę, bracia, abyście nie wiedzieli o tych, którzy zasnęli, żebyście nie byli zasmucani, tak jak pozostali, którzy nie mają nadziei."
  tags: []
"1Tes4,14":
  text: "Jeśli bowiem wierzymy, że Jezus umarł i zmartwychwstał, tak i tych, którzy zasnęli ze względu na Jezusa, Bóg poprowadzi razem z Nim."
  tags: []
"1Tes4,15":
  text: "Bo to mówimy wam w Słowie Pana, że my żyjący, nadal pozostawiani na przyjście Pana, nie wyprzedzimy tych, którzy zasnęli."
  tags: []
"1Tes4,16":
  text: "Gdyż sam Pan na okrzyk, na głos archanioła i na głos trąby Bożej zstąpi z nieba, a umarli w Chrystusie powstaną najpierw."
  tags: []
"1Tes4,17":
  text: "Potem my, pozostający przy życiu, równocześnie z nimi zostaniemy porwani w obłokach na spotkanie Pana, w powietrze; i tak zawsze będziemy z Panem."
  tags: []
"1Tes4,18":
  text: "Dlatego pocieszajcie jedni drugich tymi słowami."
  tags: []
