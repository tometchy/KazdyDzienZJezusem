"Łk3,1":
  text: "A w piętnastym roku panowania Cezara Tyberiusza, gdy Poncjusz Piłat był namiestnikiem Judei, a Herod tetrarchą Galilei, Filip, jego brat, tetrarchą Iturei i okręgu Trachonis, a Lizaniasz tetrarchą Abileny,"
  tags: []
"Łk3,2":
  text: "Za arcykapłanów Annasza i Kajfasza, doszło słowo Boże do Jana, syna Zachariasza, na pustkowiu."
  tags: []
"Łk3,3":
  text: "I obchodził całą okolicę nad Jordanem, głosząc chrzest upamiętania na odpuszczenie grzechów;"
  tags: []
"Łk3,4":
  text: "Jak napisano w zwoju słów proroka Izajasza, mówiącego: Głos wołającego na pustkowiu: Przygotujcie drogę PANA, prostymi czyńcie Jego ścieżki!"
  tags: []
"Łk3,5":
  text: "Każda dolina zostanie wypełniona, a każda góra i pagórek zostaną zniżone, a to, co krzywe zostanie wyprostowane, a skaliste drogi będą wyrównane,"
  tags: []
"Łk3,6":
  text: "A wszelkie ciało ujrzy zbawienie Boże."
  tags: []
"Łk3,7":
  text: "Mówił więc do tłumów, które wychodziły, aby zostać ochrzczonymi przez Niego: Płody żmij! Kto wam pokazał, jak uciec przed nadchodzącym gniewem?"
  tags: []
"Łk3,8":
  text: "Wydawajcie więc owoce godne upamiętania, a nie zaczynajcie mówić sobie: Ojca mamy Abrahama; albowiem mówię wam, że Bóg może i z tych kamieni wzbudzić dzieci Abrahama."
  tags: []
"Łk3,9":
  text: "Już nawet i siekiera do korzenia drzew jest przyłożona; wszelkie więc drzewo, które nie przynosi dobrego owocu, jest wycinane i wrzucane w ogień."
  tags: []
"Łk3,10":
  text: "I pytały go tłumy, mówiąc: Co więc mamy czynić?"
  tags: []
"Łk3,11":
  text: "A on w odpowiedzi, rzekł im: Kto ma dwie tuniki, niech przekaże temu, który nie ma; i kto ma żywność, niech uczyni podobnie."
  tags: []
"Łk3,12":
  text: "Przyszli też i celnicy, aby zostać ochrzczeni i powiedzieli do niego: Nauczycielu! Co mamy czynić?"
  tags: []
"Łk3,13":
  text: "A on powiedział do nich: Nie pobierajcie nic więcej niż to, co wam nakazano."
  tags: []
"Łk3,14":
  text: "Pytali go natomiast żołnierze, mówiąc: A my co mamy czynić? I powiedział do nich: Nic nie wymuszajcie, ani nikogo fałszywie nie oskarżajcie, ale poprzestawajcie na swoim żołdzie."
  tags: []
"Łk3,15":
  text: "A gdy lud oczekiwał, i gdy rozważali wszyscy w swoich sercach o Janie, czy czasem on nie jest Mesjaszem,"
  tags: []
"Łk3,16":
  text: "Jan odpowiedział wszystkim, mówiąc: Ja wprawdzie chrzczę was wodą; ale przyjdzie mocniejszy ode mnie, któremu nie jestem godny rozwiązać rzemyka u Jego sandałów; On będzie was chrzcić w Duchu Świętym i ogniu."
  tags: []
"Łk3,17":
  text: "W Jego ręku jest wiejadło i oczyści przewiewając swoje klepisko, i zbierze pszenicę do swojego spichlerza, lecz plewy spali ogniem nieugaszonym."
  tags: []
"Łk3,18":
  text: "W wielu też i innych słowach zachęty, głosił dobrą nowinę ludowi."
  tags: []
"Łk3,19":
  text: "A tetrarcha Herod, napominany przez niego z powodu Herodiady, żony Filipa, swojego brata, i z powodu wszystkich złych rzeczy, które uczynił Herod,"
  tags: []
"Łk3,20":
  text: "Dodał do tego wszystkiego i to, że zamknął Jana w więzieniu."
  tags: []
"Łk3,21":
  text: "A stało się, że cały lud był ochrzczony, również Jezus został ochrzczony, a gdy się modlił, otworzyło się niebo,"
  tags: []
"Łk3,22":
  text: "I zstąpił na Niego Duch Święty w postaci cielesnej, jakby gołębica, i rozległ się głos z nieba, mówiący: Ty jesteś moim Synem umiłowanym, w Tobie mam upodobanie."
  tags: []
"Łk3,23":
  text: "A Jezus, gdy rozpoczął swoją służbę, miał około trzydziestu lat, będąc, jak sądzono, synem Józefa, syna Helego,"
  tags: []
"Łk3,24":
  text: "Syna Mattata, syna Lewiego, syna Melchiego, syna Jannaja, syna Józefa,"
  tags: []
"Łk3,25":
  text: "Syna Matatiasza, syna Amosa, syna Nahuma, syna Hesliego, syna Nanggaja,"
  tags: []
"Łk3,26":
  text: "Syna Mahata, syna Mattatijasza, syna Semeja, syna Józefa, syna Judy,"
  tags: []
"Łk3,27":
  text: "Syna Joananna, syna Rezy, syna Zorobabela, syna Salatiela, syna Neriego,"
  tags: []
"Łk3,28":
  text: "Syna Melchiego, syna Addy, syna Kosama, syna Elmodama, syna Hera,"
  tags: []
"Łk3,29":
  text: "Syna Jozesa, syna Eliezera, syna Joreima, syna Mattata, syna Lewiego,"
  tags: []
"Łk3,30":
  text: "Syna Symeona, syna Judy, syna Józefa, syna Jonama, syna Eliakeima,"
  tags: []
"Łk3,31":
  text: "Syna Meleasza, syna Menama, syna Mattaty, syna Natana, syna Dawida,"
  tags: []
"Łk3,32":
  text: "Syna Jessego, syna Obeda, syna Booza, syna Salmona, syna Naassona,"
  tags: []
"Łk3,33":
  text: "Syna Aminadaba, syna Arama, syna Esroma, syna Faresa, syna Judy,"
  tags: []
"Łk3,34":
  text: "Syna Jakuba, syna Izaaka, syna Abrahama, syna Tarego, syna Nachora,"
  tags: []
"Łk3,35":
  text: "Syna Sarucha, syna Ragaua, syna Falega, syna Ebera, syna Sali,"
  tags: []
"Łk3,36":
  text: "Syna Kainana, syna Arfaksada, syna Sema, syna Noego, syna Lamecha,"
  tags: []
"Łk3,37":
  text: "Syna Matusali, syna Henocha, syna Jareda, syna Malaleela, syna Kainana,"
  tags: []
"Łk3,38":
  text: "Syna Enosza, syna Seta, syna Adama, syna Boga."
  tags: []
