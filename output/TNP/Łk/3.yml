"Łk3,1": "A w piętnastym roku panowania Cezara Tyberiusza, gdy Poncjusz Piłat był namiestnikiem Judei, a Herod tetrarchą Galilei, Filip, jego brat, tetrarchą Iturei i okręgu Trachonis, a Lizaniasz tetrarchą Abileny,"
"Łk3,2": "Za arcykapłanów Annasza i Kajfasza, doszło słowo Boże do Jana, syna Zachariasza, na pustkowiu."
"Łk3,3": "I obchodził całą okolicę nad Jordanem, głosząc chrzest upamiętania na odpuszczenie grzechów;"
"Łk3,4": "Jak napisano w zwoju słów proroka Izajasza, mówiącego: Głos wołającego na pustkowiu: Przygotujcie drogę PANA, prostymi czyńcie Jego ścieżki!"
"Łk3,5": "Każda dolina zostanie wypełniona, a każda góra i pagórek zostaną zniżone, a to, co krzywe zostanie wyprostowane, a skaliste drogi będą wyrównane,"
"Łk3,6": "A wszelkie ciało ujrzy zbawienie Boże."
"Łk3,7": "Mówił więc do tłumów, które wychodziły, aby zostać ochrzczonymi przez Niego: Płody żmij! Kto wam pokazał, jak uciec przed nadchodzącym gniewem?"
"Łk3,8": "Wydawajcie więc owoce godne upamiętania, a nie zaczynajcie mówić sobie: Ojca mamy Abrahama; albowiem mówię wam, że Bóg może i z tych kamieni wzbudzić dzieci Abrahama."
"Łk3,9": "Już nawet i siekiera do korzenia drzew jest przyłożona; wszelkie więc drzewo, które nie przynosi dobrego owocu, jest wycinane i wrzucane w ogień."
"Łk3,10": "I pytały go tłumy, mówiąc: Co więc mamy czynić?"
"Łk3,11": "A on w odpowiedzi, rzekł im: Kto ma dwie tuniki, niech przekaże temu, który nie ma; i kto ma żywność, niech uczyni podobnie."
"Łk3,12": "Przyszli też i celnicy, aby zostać ochrzczeni i powiedzieli do niego: Nauczycielu! Co mamy czynić?"
"Łk3,13": "A on powiedział do nich: Nie pobierajcie nic więcej niż to, co wam nakazano."
"Łk3,14": "Pytali go natomiast żołnierze, mówiąc: A my co mamy czynić? I powiedział do nich: Nic nie wymuszajcie, ani nikogo fałszywie nie oskarżajcie, ale poprzestawajcie na swoim żołdzie."
"Łk3,15": "A gdy lud oczekiwał, i gdy rozważali wszyscy w swoich sercach o Janie, czy czasem on nie jest Mesjaszem,"
"Łk3,16": "Jan odpowiedział wszystkim, mówiąc: Ja wprawdzie chrzczę was wodą; ale przyjdzie mocniejszy ode mnie, któremu nie jestem godny rozwiązać rzemyka u Jego sandałów; On będzie was chrzcić w Duchu Świętym i ogniu."
"Łk3,17": "W Jego ręku jest wiejadło i oczyści przewiewając swoje klepisko, i zbierze pszenicę do swojego spichlerza, lecz plewy spali ogniem nieugaszonym."
"Łk3,18": "W wielu też i innych słowach zachęty, głosił dobrą nowinę ludowi."
"Łk3,19": "A tetrarcha Herod, napominany przez niego z powodu Herodiady, żony Filipa, swojego brata, i z powodu wszystkich złych rzeczy, które uczynił Herod,"
"Łk3,20": "Dodał do tego wszystkiego i to, że zamknął Jana w więzieniu."
"Łk3,21": "A stało się, że cały lud był ochrzczony, również Jezus został ochrzczony, a gdy się modlił, otworzyło się niebo,"
"Łk3,22": "I zstąpił na Niego Duch Święty w postaci cielesnej, jakby gołębica, i rozległ się głos z nieba, mówiący: Ty jesteś moim Synem umiłowanym, w Tobie mam upodobanie."
"Łk3,23": "A Jezus, gdy rozpoczął swoją służbę, miał około trzydziestu lat, będąc, jak sądzono, synem Józefa, syna Helego,"
"Łk3,24": "Syna Mattata, syna Lewiego, syna Melchiego, syna Jannaja, syna Józefa,"
"Łk3,25": "Syna Matatiasza, syna Amosa, syna Nahuma, syna Hesliego, syna Nanggaja,"
"Łk3,26": "Syna Mahata, syna Mattatijasza, syna Semeja, syna Józefa, syna Judy,"
"Łk3,27": "Syna Joananna, syna Rezy, syna Zorobabela, syna Salatiela, syna Neriego,"
"Łk3,28": "Syna Melchiego, syna Addy, syna Kosama, syna Elmodama, syna Hera,"
"Łk3,29": "Syna Jozesa, syna Eliezera, syna Joreima, syna Mattata, syna Lewiego,"
"Łk3,30": "Syna Symeona, syna Judy, syna Józefa, syna Jonama, syna Eliakeima,"
"Łk3,31": "Syna Meleasza, syna Menama, syna Mattaty, syna Natana, syna Dawida,"
"Łk3,32": "Syna Jessego, syna Obeda, syna Booza, syna Salmona, syna Naassona,"
"Łk3,33": "Syna Aminadaba, syna Arama, syna Esroma, syna Faresa, syna Judy,"
"Łk3,34": "Syna Jakuba, syna Izaaka, syna Abrahama, syna Tarego, syna Nachora,"
"Łk3,35": "Syna Sarucha, syna Ragaua, syna Falega, syna Ebera, syna Sali,"
"Łk3,36": "Syna Kainana, syna Arfaksada, syna Sema, syna Noego, syna Lamecha,"
"Łk3,37": "Syna Matusali, syna Henocha, syna Jareda, syna Malaleela, syna Kainana,"
"Łk3,38": "Syna Enosza, syna Seta, syna Adama, syna Boga."
