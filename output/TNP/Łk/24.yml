"Łk24,1":
  text: "A pierwszego dnia tygodnia, bardzo wczesnym rankiem przyszły do grobowca, niosąc wonności, które przygotowały; a z nimi i inne kobiety;"
  tags: []
"Łk24,2":
  text: "I znalazły kamień odtoczony od grobowca."
  tags: []
"Łk24,3":
  text: "A gdy tam weszły, nie znalazły ciała Pana Jezusa."
  tags: []
"Łk24,4":
  text: "I gdy zaczęły się tym niepokoić, oto nagle dwaj mężczyźni w lśniących szatach stanęli obok nich."
  tags: []
"Łk24,5":
  text: "A one przestraszone, skłoniły twarz ku ziemi; wtedy oni powiedzieli do nich: Dlaczego szukacie żyjącego między umarłymi?"
  tags: []
"Łk24,6":
  text: "Nie ma Go tutaj, ale został wzbudzony z martwych; przypomnijcie sobie, jak wam to powiedział, gdy jeszcze był w Galilei,"
  tags: []
"Łk24,7":
  text: "Mówiąc, że Syn Człowieczy musi być wydany w ręce grzesznych ludzi, i być ukrzyżowany, a trzeciego dnia powstać z martwych."
  tags: []
"Łk24,8":
  text: "I przypomniały sobie Jego słowa."
  tags: []
"Łk24,9":
  text: "A gdy wróciły od grobowca, oznajmiły to wszystko jedenastu i wszystkim pozostałym."
  tags: []
"Łk24,10":
  text: "Tymi więc, które mówiły to apostołom, były: Maria Magdalena i Joanna, i Maria, matka Jakuba, oraz pozostałe z nimi."
  tags: []
"Łk24,11":
  text: "A słowa ich wydawały się im niedorzeczne i nie wierzyli im."
  tags: []
"Łk24,12":
  text: "Piotr jednak powstał i pobiegł do grobowca, a gdy się nachylił, ujrzał jedynie złożone płótna; i odszedł do siebie, dziwiąc się temu, co się stało."
  tags: []
"Łk24,13":
  text: "A oto dwaj z nich w tym samym dniu szli do miasteczka, które było oddalone sześćdziesiąt stadiów od Jerozolimy, które zwano Emaus."
  tags: []
"Łk24,14":
  text: "I ci rozmawiali ze sobą o tym wszystkim, co się zdarzyło."
  tags: []
"Łk24,15":
  text: "I stało się, że gdy oni rozmawiali i stawiali sobie nawzajem pytania, sam Jezus zbliżył się i szedł razem z nimi."
  tags: []
"Łk24,16":
  text: "Ale oczy ich zostały zakryte, żeby Go nie rozpoznali."
  tags: []
"Łk24,17":
  text: "I powiedział do nich: Cóż to za myśli wymieniacie między sobą idąc, i dlaczego jesteście smutni?"
  tags: []
"Łk24,18":
  text: "A jeden z nich o imieniu Kleofas w odpowiedzi, rzekł Mu: Czy Ty jesteś jedynym przybyszem w Jerozolimie, który nie wie o tym, co się w niej stało w tych dniach?"
  tags: []
"Łk24,19":
  text: "I powiedział im: Co takiego? A oni Mu powiedzieli o Jezusie Nazarejczyku, który był mężem i prorokiem, mocnym w czynie i w słowie przed Bogiem i całym ludem;"
  tags: []
"Łk24,20":
  text: "I jak Go wydali arcykapłani i nasi przywódcy na karę śmierci; i ukrzyżowali Go."
  tags: []
"Łk24,21":
  text: "A my mieliśmy nadzieję, że On jest tym, który ma odkupić Izraela. Lecz właśnie dziś upływa trzeci dzień po tym wszystkim, jak to się stało."
  tags: []
"Łk24,22":
  text: "Lecz niektóre z naszych kobiet zadziwiły nas. Wcześnie rano, gdy były przy grobowcu,"
  tags: []
"Łk24,23":
  text: "Nie znalazły Jego ciała, a gdy przyszły, mówiły, że miały widzenie aniołów, którzy mówili, że On żyje."
  tags: []
"Łk24,24":
  text: "I udali się niektórzy z naszych do grobowca, i znaleźli wszystko tak, jak powiedziały kobiety; ale Jego nie widzieli."
  tags: []
"Łk24,25":
  text: "A On powiedział do nich: O nierozumni z sercem nieskorym, by uwierzyć we wszystko, co powiedzieli prorocy!"
  tags: []
"Łk24,26":
  text: "Czyż Mesjasz nie musiał tego wycierpieć i tak wejść do swojej chwały?"
  tags: []
"Łk24,27":
  text: "I zaczynając od Mojżesza i przez wszystkich proroków, wykładał im ze wszystkich Pism to, co o Nim samym jest napisane."
  tags: []
"Łk24,28":
  text: "I zbliżyli się do miasteczka, do którego szli, a On sprawiał wrażenie, jakby miał iść dalej."
  tags: []
"Łk24,29":
  text: "I przymusili Go, mówiąc: Zostań z nami, bo ma się ku wieczorowi i już się dzień nachylił ku końcowi. I wstąpił, aby z nimi pozostać."
  tags: []
"Łk24,30":
  text: "I stało się, gdy On spoczął z nimi przy stole, że wziął chleb, pobłogosławił, a gdy złamał, podawał im."
  tags: []
"Łk24,31":
  text: "I oczy ich zostały otworzone, i rozpoznali Go; a On stał się niewidzialny dla nich."
  tags: []
"Łk24,32":
  text: "I mówili do siebie: Czyż nasze serce nie pałało w nas, gdy mówił do nas w drodze i gdy otwierał nam Pisma?"
  tags: []
"Łk24,33":
  text: "I wstali w tej samej godzinie, i wrócili do Jerozolimy i znaleźli zgromadzonych jedenastu, i tych, którzy byli z nimi,"
  tags: []
"Łk24,34":
  text: "Mówiących, że prawdziwie Pan powstał z martwych i ukazał się Szymonowi."
  tags: []
"Łk24,35":
  text: "A oni wyjaśnili, co stało się w drodze, i jak dał się im poznać przy łamaniu chleba."
  tags: []
"Łk24,36":
  text: "A gdy oni to mówili, sam Jezus stanął pośrodku nich i powiedział im: Pokój wam!"
  tags: []
"Łk24,37":
  text: "A oni przerazili się i przestraszyli, albowiem myśleli, że widzą ducha."
  tags: []
"Łk24,38":
  text: "A On im powiedział: Dlaczego jesteście zatrwożeni i dlaczego wątpliwości wstępują do waszych serc?"
  tags: []
"Łk24,39":
  text: "Zobaczcie moje ręce i moje stopy, że to jestem ja sam; dotknijcie mnie i zobaczcie, że duch nie ma ciała ani kości, tak jak widzicie, że ja mam."
  tags: []
"Łk24,40":
  text: "I gdy to powiedział, pokazał im swoje ręce i stopy."
  tags: []
"Łk24,41":
  text: "A gdy oni jeszcze z radości nie wierzyli i dziwili się, powiedział im: Macie tutaj coś do jedzenia?"
  tags: []
"Łk24,42":
  text: "A oni Mu podali kawałek pieczonej ryby i plaster z pszczelego miodu."
  tags: []
"Łk24,43":
  text: "A On wziął i jadł przy nich."
  tags: []
"Łk24,44":
  text: "I powiedział im: To są słowa, które mówiłem do was, gdy byłem jeszcze z wami, że musi zostać wypełnione wszystko to, co zostało napisane w Prawie Mojżesza, i u Proroków, i w Psalmach o mnie."
  tags: []
"Łk24,45":
  text: "Wtedy otworzył ich umysły, aby rozumieli Pisma."
  tags: []
"Łk24,46":
  text: "I powiedział im: Tak jest napisane, tak też Mesjasz musiał cierpieć i powstać z martwych trzeciego dnia;"
  tags: []
"Łk24,47":
  text: "A w Jego imię ma być głoszone upamiętanie i odpuszczenie grzechów dla wszystkich narodów, zaczynając od Jeruzalem."
  tags: []
"Łk24,48":
  text: "A wy jesteście tego świadkami."
  tags: []
"Łk24,49":
  text: "I oto ja posyłam do was obietnicę Ojca mojego, a wy pozostańcie w mieście Jeruzalem, aż zostaniecie przyobleczeni w moc z wysokości."
  tags: []
"Łk24,50":
  text: "A wyprowadził ich na zewnątrz miasta, aż do Betanii, i gdy podniósł swoje ręce, błogosławił ich."
  tags: []
"Łk24,51":
  text: "I stało się, gdy ich błogosławił, że rozstał się z nimi i został uniesiony do nieba."
  tags: []
"Łk24,52":
  text: "A oni oddali Mu pokłon i wrócili do Jerozolimy z wielką radością."
  tags: []
"Łk24,53":
  text: "I byli stale w świątyni, chwaląc i błogosławiąc Boga. Amen."
  tags: []
