"Łk24,1": "A pierwszego dnia tygodnia, bardzo wczesnym rankiem przyszły do grobowca, niosąc wonności, które przygotowały; a z nimi i inne kobiety;"
"Łk24,2": "I znalazły kamień odtoczony od grobowca."
"Łk24,3": "A gdy tam weszły, nie znalazły ciała Pana Jezusa."
"Łk24,4": "I gdy zaczęły się tym niepokoić, oto nagle dwaj mężczyźni w lśniących szatach stanęli obok nich."
"Łk24,5": "A one przestraszone, skłoniły twarz ku ziemi; wtedy oni powiedzieli do nich: Dlaczego szukacie żyjącego między umarłymi?"
"Łk24,6": "Nie ma Go tutaj, ale został wzbudzony z martwych; przypomnijcie sobie, jak wam to powiedział, gdy jeszcze był w Galilei,"
"Łk24,7": "Mówiąc, że Syn Człowieczy musi być wydany w ręce grzesznych ludzi, i być ukrzyżowany, a trzeciego dnia powstać z martwych."
"Łk24,8": "I przypomniały sobie Jego słowa."
"Łk24,9": "A gdy wróciły od grobowca, oznajmiły to wszystko jedenastu i wszystkim pozostałym."
"Łk24,10": "Tymi więc, które mówiły to apostołom, były: Maria Magdalena i Joanna, i Maria, matka Jakuba, oraz pozostałe z nimi."
"Łk24,11": "A słowa ich wydawały się im niedorzeczne i nie wierzyli im."
"Łk24,12": "Piotr jednak powstał i pobiegł do grobowca, a gdy się nachylił, ujrzał jedynie złożone płótna; i odszedł do siebie, dziwiąc się temu, co się stało."
"Łk24,13": "A oto dwaj z nich w tym samym dniu szli do miasteczka, które było oddalone sześćdziesiąt stadiów od Jerozolimy, które zwano Emaus."
"Łk24,14": "I ci rozmawiali ze sobą o tym wszystkim, co się zdarzyło."
"Łk24,15": "I stało się, że gdy oni rozmawiali i stawiali sobie nawzajem pytania, sam Jezus zbliżył się i szedł razem z nimi."
"Łk24,16": "Ale oczy ich zostały zakryte, żeby Go nie rozpoznali."
"Łk24,17": "I powiedział do nich: Cóż to za myśli wymieniacie między sobą idąc, i dlaczego jesteście smutni?"
"Łk24,18": "A jeden z nich o imieniu Kleofas w odpowiedzi, rzekł Mu: Czy Ty jesteś jedynym przybyszem w Jerozolimie, który nie wie o tym, co się w niej stało w tych dniach?"
"Łk24,19": "I powiedział im: Co takiego? A oni Mu powiedzieli o Jezusie Nazarejczyku, który był mężem i prorokiem, mocnym w czynie i w słowie przed Bogiem i całym ludem;"
"Łk24,20": "I jak Go wydali arcykapłani i nasi przywódcy na karę śmierci; i ukrzyżowali Go."
"Łk24,21": "A my mieliśmy nadzieję, że On jest tym, który ma odkupić Izraela. Lecz właśnie dziś upływa trzeci dzień po tym wszystkim, jak to się stało."
"Łk24,22": "Lecz niektóre z naszych kobiet zadziwiły nas. Wcześnie rano, gdy były przy grobowcu,"
"Łk24,23": "Nie znalazły Jego ciała, a gdy przyszły, mówiły, że miały widzenie aniołów, którzy mówili, że On żyje."
"Łk24,24": "I udali się niektórzy z naszych do grobowca, i znaleźli wszystko tak, jak powiedziały kobiety; ale Jego nie widzieli."
"Łk24,25": "A On powiedział do nich: O nierozumni z sercem nieskorym, by uwierzyć we wszystko, co powiedzieli prorocy!"
"Łk24,26": "Czyż Mesjasz nie musiał tego wycierpieć i tak wejść do swojej chwały?"
"Łk24,27": "I zaczynając od Mojżesza i przez wszystkich proroków, wykładał im ze wszystkich Pism to, co o Nim samym jest napisane."
"Łk24,28": "I zbliżyli się do miasteczka, do którego szli, a On sprawiał wrażenie, jakby miał iść dalej."
"Łk24,29": "I przymusili Go, mówiąc: Zostań z nami, bo ma się ku wieczorowi i już się dzień nachylił ku końcowi. I wstąpił, aby z nimi pozostać."
"Łk24,30": "I stało się, gdy On spoczął z nimi przy stole, że wziął chleb, pobłogosławił, a gdy złamał, podawał im."
"Łk24,31": "I oczy ich zostały otworzone, i rozpoznali Go; a On stał się niewidzialny dla nich."
"Łk24,32": "I mówili do siebie: Czyż nasze serce nie pałało w nas, gdy mówił do nas w drodze i gdy otwierał nam Pisma?"
"Łk24,33": "I wstali w tej samej godzinie, i wrócili do Jerozolimy i znaleźli zgromadzonych jedenastu, i tych, którzy byli z nimi,"
"Łk24,34": "Mówiących, że prawdziwie Pan powstał z martwych i ukazał się Szymonowi."
"Łk24,35": "A oni wyjaśnili, co stało się w drodze, i jak dał się im poznać przy łamaniu chleba."
"Łk24,36": "A gdy oni to mówili, sam Jezus stanął pośrodku nich i powiedział im: Pokój wam!"
"Łk24,37": "A oni przerazili się i przestraszyli, albowiem myśleli, że widzą ducha."
"Łk24,38": "A On im powiedział: Dlaczego jesteście zatrwożeni i dlaczego wątpliwości wstępują do waszych serc?"
"Łk24,39": "Zobaczcie moje ręce i moje stopy, że to jestem ja sam; dotknijcie mnie i zobaczcie, że duch nie ma ciała ani kości, tak jak widzicie, że ja mam."
"Łk24,40": "I gdy to powiedział, pokazał im swoje ręce i stopy."
"Łk24,41": "A gdy oni jeszcze z radości nie wierzyli i dziwili się, powiedział im: Macie tutaj coś do jedzenia?"
"Łk24,42": "A oni Mu podali kawałek pieczonej ryby i plaster z pszczelego miodu."
"Łk24,43": "A On wziął i jadł przy nich."
"Łk24,44": "I powiedział im: To są słowa, które mówiłem do was, gdy byłem jeszcze z wami, że musi zostać wypełnione wszystko to, co zostało napisane w Prawie Mojżesza, i u Proroków, i w Psalmach o mnie."
"Łk24,45": "Wtedy otworzył ich umysły, aby rozumieli Pisma."
"Łk24,46": "I powiedział im: Tak jest napisane, tak też Mesjasz musiał cierpieć i powstać z martwych trzeciego dnia;"
"Łk24,47": "A w Jego imię ma być głoszone upamiętanie i odpuszczenie grzechów dla wszystkich narodów, zaczynając od Jeruzalem."
"Łk24,48": "A wy jesteście tego świadkami."
"Łk24,49": "I oto ja posyłam do was obietnicę Ojca mojego, a wy pozostańcie w mieście Jeruzalem, aż zostaniecie przyobleczeni w moc z wysokości."
"Łk24,50": "A wyprowadził ich na zewnątrz miasta, aż do Betanii, i gdy podniósł swoje ręce, błogosławił ich."
"Łk24,51": "I stało się, gdy ich błogosławił, że rozstał się z nimi i został uniesiony do nieba."
"Łk24,52": "A oni oddali Mu pokłon i wrócili do Jerozolimy z wielką radością."
"Łk24,53": "I byli stale w świątyni, chwaląc i błogosławiąc Boga. Amen."
