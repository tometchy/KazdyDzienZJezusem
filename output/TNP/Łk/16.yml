"Łk16,1":
  text: "Mówił też i do swoich uczniów: Był pewien bogaty człowiek, który miał zarządcę, i ten został oskarżony przed nim, o to, że roztrwonił jego mienie."
  tags: []
"Łk16,2":
  text: "I gdy go zawołał, powiedział mu: Cóż to słyszę o tobie? Zdaj rachunek ze swojego zarządzania; gdyż nie będziesz mógł już zarządzać."
  tags: []
"Łk16,3":
  text: "I powiedział zarządca do siebie: Co uczynię, gdyż pan mój odbiera mi zarządzanie? Kopać nie mam siły, a żebrać się wstydzę."
  tags: []
"Łk16,4":
  text: "Wiem, co uczynię, żeby przyjęli mnie do swoich domów, gdy zostanę odsunięty od zarządzania."
  tags: []
"Łk16,5":
  text: "I przywołał pojedynczo do siebie każdego z dłużników swojego pana, i powiedział pierwszemu: Ile jesteś winien mojemu panu?"
  tags: []
"Łk16,6":
  text: "A on powiedział: Sto baryłek oliwy. I powiedział mu: Weź swój zapis dłużny, usiądź i szybko napisz pięćdziesiąt."
  tags: []
"Łk16,7":
  text: "Potem drugiemu powiedział: A ty ile jesteś winien? A on mu powiedział: Sto korców pszenicy. I powiedział mu: Weź swój zapis dłużny i napisz osiemdziesiąt."
  tags: []
"Łk16,8":
  text: "I pochwalił pan niesprawiedliwego zarządcę, że uczynił roztropnie; gdyż synowie tego wieku roztropniejsi są od synów światłości w swoim pokoleniu."
  tags: []
"Łk16,9":
  text: "I ja wam mówię: Czyńcie sobie przyjaciół mamoną niesprawiedliwości, aby gdy się skończy, przyjęli was do wiecznych przybytków."
  tags: []
"Łk16,10":
  text: "Wierny w najmniejszym i w wielkim jest wierny; a w najmniejszym niesprawiedliwy, jest i w wielkim niesprawiedliwy."
  tags: []
"Łk16,11":
  text: "Jeśli więc w niesprawiedliwej mamonie nie staliście się wierni, kto wam powierzy prawdziwą wartość?"
  tags: []
"Łk16,12":
  text: "A jeśli w tym, co cudze nie staliście się wierni, kto wam da wasze własne?"
  tags: []
"Łk16,13":
  text: "Żaden sługa domu nie może służyć dwom panom, gdyż albo jednego znienawidzi, a drugiego będzie miłował; albo do jednego przylgnie, a drugim pogardzi; nie możecie Bogu służyć i mamonie."
  tags: []
"Łk16,14":
  text: "Tego wszystkiego słuchali faryzeusze, którzy miłowali pieniądze i naśmiewali się z Niego."
  tags: []
"Łk16,15":
  text: "I powiedział im: Wy jesteście tymi, którzy sami siebie uznajecie za sprawiedliwych przed ludźmi, lecz Bóg zna wasze serca; bo co wśród ludzi jest wyniosłe, obrzydliwością jest przed Bogiem."
  tags: []
"Łk16,16":
  text: "Aż do czasów Jana było Prawo i Prorocy; odtąd jest głoszona dobra nowina o Królestwie Boga i każdy się do niego wdziera gwałtem."
  tags: []
"Łk16,17":
  text: "A łatwiej jest niebu i ziemi przeminąć, niż odpaść jednej kresce z literki Prawa."
  tags: []
"Łk16,18":
  text: "Każdy, kto oddala swoją żonę i inną poślubia, cudzołoży; i każdy kto oddaloną przez męża poślubia, cudzołoży."
  tags: []
"Łk16,19":
  text: "A był pewien bogaty człowiek, który ubierał się w purpurę i w delikatny len, i co dzień wspaniale się bawił."
  tags: []
"Łk16,20":
  text: "Był też pewien żebrak o imieniu Łazarz, który został porzucony przy jego bramie, cały owrzodziały,"
  tags: []
"Łk16,21":
  text: "I pragnął nasycić się z okruszyn, które spadały ze stołu bogacza; a psy przychodziły i lizały jego wrzody."
  tags: []
"Łk16,22":
  text: "I stało się, że umarł ów żebrak, i aniołowie zanieśli go na łono Abrahama; umarł też i bogacz, i został pogrzebany."
  tags: []
"Łk16,23":
  text: "A gdy w Hadesie cierpiał męki i podniósł swoje oczy, ujrzał z daleka Abrahama i Łazarza na jego łonie."
  tags: []
"Łk16,24":
  text: "I on zawołał, mówiąc: Ojcze Abrahamie! Zmiłuj się nade mną i poślij Łazarza, aby umoczył koniec swojego palca w wodzie i ochłodził mój język, bo doznaję bólu w tym płomieniu."
  tags: []
"Łk16,25":
  text: "A Abraham powiedział: Dziecko! Wspomnij, że ty otrzymałeś swoje dobro za swojego życia, podobnie jak Łazarz zło; a on tutaj jest pocieszany, a ty doznajesz bólu."
  tags: []
"Łk16,26":
  text: "I nad to wszystko, między nami a wami znajduje się wielka przepaść, aby ci, którzy chcą stąd przejść do was, nie mogli, ani też stamtąd do nas nie mogli się przeprawić."
  tags: []
"Łk16,27":
  text: "Wtedy powiedział: Proszę cię więc, Ojcze! Abyś go posłał do domu mojego ojca,"
  tags: []
"Łk16,28":
  text: "Albowiem mam pięciu braci; niech zaświadczy im, żeby i oni nie przyszli na to miejsce męczarni."
  tags: []
"Łk16,29":
  text: "Abraham powiedział mu: Mają Mojżesza i Proroków; niech ich słuchają."
  tags: []
"Łk16,30":
  text: "A on powiedział: Nie, Ojcze Abrahamie! Lecz jeśli ktoś z umarłych do nich pójdzie, upamiętają się."
  tags: []
"Łk16,31":
  text: "Powiedział mu więc: Jeśli Mojżesza i Proroków nie słuchają, to choćby też ktoś powstał z martwych, nie dadzą się przekonać."
  tags: []
