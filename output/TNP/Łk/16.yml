"Łk16,1": "Mówił też i do swoich uczniów: Był pewien bogaty człowiek, który miał zarządcę, i ten został oskarżony przed nim, o to, że roztrwonił jego mienie."
"Łk16,2": "I gdy go zawołał, powiedział mu: Cóż to słyszę o tobie? Zdaj rachunek ze swojego zarządzania; gdyż nie będziesz mógł już zarządzać."
"Łk16,3": "I powiedział zarządca do siebie: Co uczynię, gdyż pan mój odbiera mi zarządzanie? Kopać nie mam siły, a żebrać się wstydzę."
"Łk16,4": "Wiem, co uczynię, żeby przyjęli mnie do swoich domów, gdy zostanę odsunięty od zarządzania."
"Łk16,5": "I przywołał pojedynczo do siebie każdego z dłużników swojego pana, i powiedział pierwszemu: Ile jesteś winien mojemu panu?"
"Łk16,6": "A on powiedział: Sto baryłek oliwy. I powiedział mu: Weź swój zapis dłużny, usiądź i szybko napisz pięćdziesiąt."
"Łk16,7": "Potem drugiemu powiedział: A ty ile jesteś winien? A on mu powiedział: Sto korców pszenicy. I powiedział mu: Weź swój zapis dłużny i napisz osiemdziesiąt."
"Łk16,8": "I pochwalił pan niesprawiedliwego zarządcę, że uczynił roztropnie; gdyż synowie tego wieku roztropniejsi są od synów światłości w swoim pokoleniu."
"Łk16,9": "I ja wam mówię: Czyńcie sobie przyjaciół mamoną niesprawiedliwości, aby gdy się skończy, przyjęli was do wiecznych przybytków."
"Łk16,10": "Wierny w najmniejszym i w wielkim jest wierny; a w najmniejszym niesprawiedliwy, jest i w wielkim niesprawiedliwy."
"Łk16,11": "Jeśli więc w niesprawiedliwej mamonie nie staliście się wierni, kto wam powierzy prawdziwą wartość?"
"Łk16,12": "A jeśli w tym, co cudze nie staliście się wierni, kto wam da wasze własne?"
"Łk16,13": "Żaden sługa domu nie może służyć dwom panom, gdyż albo jednego znienawidzi, a drugiego będzie miłował; albo do jednego przylgnie, a drugim pogardzi; nie możecie Bogu służyć i mamonie."
"Łk16,14": "Tego wszystkiego słuchali faryzeusze, którzy miłowali pieniądze i naśmiewali się z Niego."
"Łk16,15": "I powiedział im: Wy jesteście tymi, którzy sami siebie uznajecie za sprawiedliwych przed ludźmi, lecz Bóg zna wasze serca; bo co wśród ludzi jest wyniosłe, obrzydliwością jest przed Bogiem."
"Łk16,16": "Aż do czasów Jana było Prawo i Prorocy; odtąd jest głoszona dobra nowina o Królestwie Boga i każdy się do niego wdziera gwałtem."
"Łk16,17": "A łatwiej jest niebu i ziemi przeminąć, niż odpaść jednej kresce z literki Prawa."
"Łk16,18": "Każdy, kto oddala swoją żonę i inną poślubia, cudzołoży; i każdy kto oddaloną przez męża poślubia, cudzołoży."
"Łk16,19": "A był pewien bogaty człowiek, który ubierał się w purpurę i w delikatny len, i co dzień wspaniale się bawił."
"Łk16,20": "Był też pewien żebrak o imieniu Łazarz, który został porzucony przy jego bramie, cały owrzodziały,"
"Łk16,21": "I pragnął nasycić się z okruszyn, które spadały ze stołu bogacza; a psy przychodziły i lizały jego wrzody."
"Łk16,22": "I stało się, że umarł ów żebrak, i aniołowie zanieśli go na łono Abrahama; umarł też i bogacz, i został pogrzebany."
"Łk16,23": "A gdy w Hadesie cierpiał męki i podniósł swoje oczy, ujrzał z daleka Abrahama i Łazarza na jego łonie."
"Łk16,24": "I on zawołał, mówiąc: Ojcze Abrahamie! Zmiłuj się nade mną i poślij Łazarza, aby umoczył koniec swojego palca w wodzie i ochłodził mój język, bo doznaję bólu w tym płomieniu."
"Łk16,25": "A Abraham powiedział: Dziecko! Wspomnij, że ty otrzymałeś swoje dobro za swojego życia, podobnie jak Łazarz zło; a on tutaj jest pocieszany, a ty doznajesz bólu."
"Łk16,26": "I nad to wszystko, między nami a wami znajduje się wielka przepaść, aby ci, którzy chcą stąd przejść do was, nie mogli, ani też stamtąd do nas nie mogli się przeprawić."
"Łk16,27": "Wtedy powiedział: Proszę cię więc, Ojcze! Abyś go posłał do domu mojego ojca,"
"Łk16,28": "Albowiem mam pięciu braci; niech zaświadczy im, żeby i oni nie przyszli na to miejsce męczarni."
"Łk16,29": "Abraham powiedział mu: Mają Mojżesza i Proroków; niech ich słuchają."
"Łk16,30": "A on powiedział: Nie, Ojcze Abrahamie! Lecz jeśli ktoś z umarłych do nich pójdzie, upamiętają się."
"Łk16,31": "Powiedział mu więc: Jeśli Mojżesza i Proroków nie słuchają, to choćby też ktoś powstał z martwych, nie dadzą się przekonać."
