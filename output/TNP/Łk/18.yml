"Łk18,1": "A powiedział im też podobieństwo dotyczące tego, że zawsze potrzeba się modlić i nie zniechęcać się,"
"Łk18,2": "Mówiąc: W jednym mieście był pewien sędzia, który nie bał się Boga, a człowieka nie szanował."
"Łk18,3": "Była też w tym mieście pewna wdowa, która przychodziła do niego, mówiąc: Wymierz mi sprawiedliwość wobec mojego przeciwnika."
"Łk18,4": "I przez pewien czas nie chciał. Ale potem powiedział do siebie: Chociaż się nie boję Boga i nie szanuję człowieka,"
"Łk18,5": "To jednak, ponieważ ta wdowa przysparza mi trudności, wymierzę jej sprawiedliwość, aby w końcu nie przyszła i nie uderzyła mnie w twarz."
"Łk18,6": "A Pan powiedział: Posłuchajcie, co mówi ten niesprawiedliwy sędzia;"
"Łk18,7": "A czy Bóg z pewnością nie wywrze pomsty za wybranych, którzy wołają do Niego dniem i nocą, chociaż zwleka w ich sprawie?"
"Łk18,8": "Mówię wam, że szybko wywrze pomstę. Tylko czy Syn Człowieczy, gdy przyjdzie znajdzie taką wiarę na ziemi?"
"Łk18,9": "I powiedział także do tych, którzy pokładali ufność w samych sobie, że są sprawiedliwi, a innych mieli za nic, to podobieństwo:"
"Łk18,10": "Dwóch ludzi weszło do świątyni, aby się modlić, jeden faryzeusz, a drugi celnik."
"Łk18,11": "Faryzeusz stanął i tak się sam w sobie modlił: Boże! Dziękuję Ci, że nie jestem jak pozostali ludzie, drapieżni, niesprawiedliwi, cudzołożni, albo jak i ten celnik."
"Łk18,12": "Poszczę dwa razy w tygodniu, daję dziesięcinę ze wszystkiego, co zyskam."
"Łk18,13": "A celnik, stojąc z daleka, nie chciał nawet oczu podnieść do nieba, ale bił się w swoją pierś, mówiąc: Boże! Okaż miłosierdzie mnie grzesznemu."
"Łk18,14": "Mówię wam: Ten odszedł usprawiedliwiony do swojego domu, a tamten nie; gdyż każdy, kto siebie wywyższa, zostanie poniżony, a kto się uniża, zostanie wywyższony."
"Łk18,15": "A przynieśli do Niego też niemowlęta, aby ich dotknął; widząc to uczniowie, surowo napominali ich."
"Łk18,16": "Lecz Jezus przywołał je i powiedział: Pozwólcie dzieciątkom przyjść do mnie, i nie zabraniajcie im; takich bowiem jest Królestwo Boże."
"Łk18,17": "Zaprawdę mówię wam: Jeśli ktoś nie przyjmie Królestwa Bożego jak dzieciątko, nie wejdzie do niego."
"Łk18,18": "I pytał Go pewien dostojnik, mówiąc: Nauczycielu dobry! Co mam czynić, abym odziedziczył życie wieczne?"
"Łk18,19": "A Jezus powiedział mu: Czemu nazywasz mnie dobrym? Nikt nie jest dobry, tylko jeden, Bóg."
"Łk18,20": "Znasz przykazania? Nie cudzołóż, nie morduj, nie kradnij, nie mów fałszywego świadectwa, czcij swojego ojca i swoją matkę."
"Łk18,21": "A on powiedział: Tego wszystkiego przestrzegałem od swojej młodości."
"Łk18,22": "Jezus słysząc to, powiedział mu: Jeszcze jednego ci brak: sprzedaj wszystko co masz i rozdaj ubogim, a będziesz miał skarb w niebie; i przyjdź tu, i podążaj za mną."
"Łk18,23": "A on słysząc to, bardzo się zasmucił; był bowiem bardzo bogaty."
"Łk18,24": "A gdy Jezus ujrzał go, tak bardzo zasmuconego, powiedział: Z jakim trudem ci, którzy mają bogactwa, wejdą do Królestwa Bożego!"
"Łk18,25": "Łatwiej bowiem jest wielbłądowi przejść przez ucho igły, niż bogatemu wejść do Królestwa Boga."
"Łk18,26": "Wtedy powiedzieli ci, którzy to słyszeli: Kto więc może zostać zbawiony?"
"Łk18,27": "On natomiast powiedział: Co niemożliwe jest u ludzi, możliwe jest u Boga."
"Łk18,28": "A Piotr powiedział: Oto my opuściliśmy wszystko i poszliśmy za Tobą."
"Łk18,29": "A On powiedział im: Zaprawdę mówię wam, że nie ma nikogo, kto opuściłby dom, albo rodziców, albo braci, albo żonę, albo dzieci ze względu na Królestwo Boże,"
"Łk18,30": "Kto nie odbierze daleko więcej w obecnym czasie, a w nadchodzącym wieku – życie wieczne."
"Łk18,31": "I wziął ze sobą dwunastu, i powiedział do nich: Oto zmierzamy do Jerozolimy i dopełni się wszystko, co jest napisane przez proroków o Synu Człowieczym."
"Łk18,32": "Bo zostanie wydany poganom, i będzie wyśmiany, znieważony i opluty;"
"Łk18,33": "A po ubiczowaniu zabiją Go; ale trzeciego dnia powstanie z martwych."
"Łk18,34": "A oni nic z tego nie zrozumieli, i było to słowo zakryte przed nimi, i nie pojęli tego, co było powiedziane."
"Łk18,35": "I stało się, gdy zbliżał się do Jerycha, że pewien ślepiec siedział przy drodze żebrząc."
"Łk18,36": "A słysząc, że tłum przechodził, pytał, co to może być."
"Łk18,37": "I oznajmili mu, że właśnie obok przechodzi Jezus z Nazaretu."
"Łk18,38": "I zawołał, mówiąc: Jezusie, Synu Dawida! Zmiłuj się nade mną."
"Łk18,39": "A ci, co szli na przedzie, upominali go surowo, aby milczał. Ale on tym bardziej krzyczał: Synu Dawida! Zmiłuj się nade mną."
"Łk18,40": "A gdy Jezus stanął, kazał go przyprowadzić do siebie; i gdy on się przybliżył,"
"Łk18,41": "Zapytał go, mówiąc: Co chcesz, abym ci uczynił? A on powiedział: Panie! Abym przejrzał."
"Łk18,42": "A Jezus mu powiedział: Przejrzyj! Wiara twoja cię ocaliła."
"Łk18,43": "I natychmiast przejrzał, i podążał za Nim, chwaląc Boga. A cały lud widząc to, oddał chwałę Bogu."
