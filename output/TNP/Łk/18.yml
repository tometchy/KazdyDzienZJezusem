"Łk18,1":
  text: "A powiedział im też podobieństwo dotyczące tego, że zawsze potrzeba się modlić i nie zniechęcać się,"
  tags: []
"Łk18,2":
  text: "Mówiąc: W jednym mieście był pewien sędzia, który nie bał się Boga, a człowieka nie szanował."
  tags: []
"Łk18,3":
  text: "Była też w tym mieście pewna wdowa, która przychodziła do niego, mówiąc: Wymierz mi sprawiedliwość wobec mojego przeciwnika."
  tags: []
"Łk18,4":
  text: "I przez pewien czas nie chciał. Ale potem powiedział do siebie: Chociaż się nie boję Boga i nie szanuję człowieka,"
  tags: []
"Łk18,5":
  text: "To jednak, ponieważ ta wdowa przysparza mi trudności, wymierzę jej sprawiedliwość, aby w końcu nie przyszła i nie uderzyła mnie w twarz."
  tags: []
"Łk18,6":
  text: "A Pan powiedział: Posłuchajcie, co mówi ten niesprawiedliwy sędzia;"
  tags: []
"Łk18,7":
  text: "A czy Bóg z pewnością nie wywrze pomsty za wybranych, którzy wołają do Niego dniem i nocą, chociaż zwleka w ich sprawie?"
  tags: []
"Łk18,8":
  text: "Mówię wam, że szybko wywrze pomstę. Tylko czy Syn Człowieczy, gdy przyjdzie znajdzie taką wiarę na ziemi?"
  tags: []
"Łk18,9":
  text: "I powiedział także do tych, którzy pokładali ufność w samych sobie, że są sprawiedliwi, a innych mieli za nic, to podobieństwo:"
  tags: []
"Łk18,10":
  text: "Dwóch ludzi weszło do świątyni, aby się modlić, jeden faryzeusz, a drugi celnik."
  tags: []
"Łk18,11":
  text: "Faryzeusz stanął i tak się sam w sobie modlił: Boże! Dziękuję Ci, że nie jestem jak pozostali ludzie, drapieżni, niesprawiedliwi, cudzołożni, albo jak i ten celnik."
  tags: []
"Łk18,12":
  text: "Poszczę dwa razy w tygodniu, daję dziesięcinę ze wszystkiego, co zyskam."
  tags: []
"Łk18,13":
  text: "A celnik, stojąc z daleka, nie chciał nawet oczu podnieść do nieba, ale bił się w swoją pierś, mówiąc: Boże! Okaż miłosierdzie mnie grzesznemu."
  tags: []
"Łk18,14":
  text: "Mówię wam: Ten odszedł usprawiedliwiony do swojego domu, a tamten nie; gdyż każdy, kto siebie wywyższa, zostanie poniżony, a kto się uniża, zostanie wywyższony."
  tags: []
"Łk18,15":
  text: "A przynieśli do Niego też niemowlęta, aby ich dotknął; widząc to uczniowie, surowo napominali ich."
  tags: []
"Łk18,16":
  text: "Lecz Jezus przywołał je i powiedział: Pozwólcie dzieciątkom przyjść do mnie, i nie zabraniajcie im; takich bowiem jest Królestwo Boże."
  tags: []
"Łk18,17":
  text: "Zaprawdę mówię wam: Jeśli ktoś nie przyjmie Królestwa Bożego jak dzieciątko, nie wejdzie do niego."
  tags: []
"Łk18,18":
  text: "I pytał Go pewien dostojnik, mówiąc: Nauczycielu dobry! Co mam czynić, abym odziedziczył życie wieczne?"
  tags: []
"Łk18,19":
  text: "A Jezus powiedział mu: Czemu nazywasz mnie dobrym? Nikt nie jest dobry, tylko jeden, Bóg."
  tags: []
"Łk18,20":
  text: "Znasz przykazania? Nie cudzołóż, nie morduj, nie kradnij, nie mów fałszywego świadectwa, czcij swojego ojca i swoją matkę."
  tags: []
"Łk18,21":
  text: "A on powiedział: Tego wszystkiego przestrzegałem od swojej młodości."
  tags: []
"Łk18,22":
  text: "Jezus słysząc to, powiedział mu: Jeszcze jednego ci brak: sprzedaj wszystko co masz i rozdaj ubogim, a będziesz miał skarb w niebie; i przyjdź tu, i podążaj za mną."
  tags: []
"Łk18,23":
  text: "A on słysząc to, bardzo się zasmucił; był bowiem bardzo bogaty."
  tags: []
"Łk18,24":
  text: "A gdy Jezus ujrzał go, tak bardzo zasmuconego, powiedział: Z jakim trudem ci, którzy mają bogactwa, wejdą do Królestwa Bożego!"
  tags: []
"Łk18,25":
  text: "Łatwiej bowiem jest wielbłądowi przejść przez ucho igły, niż bogatemu wejść do Królestwa Boga."
  tags: []
"Łk18,26":
  text: "Wtedy powiedzieli ci, którzy to słyszeli: Kto więc może zostać zbawiony?"
  tags: []
"Łk18,27":
  text: "On natomiast powiedział: Co niemożliwe jest u ludzi, możliwe jest u Boga."
  tags: []
"Łk18,28":
  text: "A Piotr powiedział: Oto my opuściliśmy wszystko i poszliśmy za Tobą."
  tags: []
"Łk18,29":
  text: "A On powiedział im: Zaprawdę mówię wam, że nie ma nikogo, kto opuściłby dom, albo rodziców, albo braci, albo żonę, albo dzieci ze względu na Królestwo Boże,"
  tags: []
"Łk18,30":
  text: "Kto nie odbierze daleko więcej w obecnym czasie, a w nadchodzącym wieku – życie wieczne."
  tags: []
"Łk18,31":
  text: "I wziął ze sobą dwunastu, i powiedział do nich: Oto zmierzamy do Jerozolimy i dopełni się wszystko, co jest napisane przez proroków o Synu Człowieczym."
  tags: []
"Łk18,32":
  text: "Bo zostanie wydany poganom, i będzie wyśmiany, znieważony i opluty;"
  tags: []
"Łk18,33":
  text: "A po ubiczowaniu zabiją Go; ale trzeciego dnia powstanie z martwych."
  tags: []
"Łk18,34":
  text: "A oni nic z tego nie zrozumieli, i było to słowo zakryte przed nimi, i nie pojęli tego, co było powiedziane."
  tags: []
"Łk18,35":
  text: "I stało się, gdy zbliżał się do Jerycha, że pewien ślepiec siedział przy drodze żebrząc."
  tags: []
"Łk18,36":
  text: "A słysząc, że tłum przechodził, pytał, co to może być."
  tags: []
"Łk18,37":
  text: "I oznajmili mu, że właśnie obok przechodzi Jezus z Nazaretu."
  tags: []
"Łk18,38":
  text: "I zawołał, mówiąc: Jezusie, Synu Dawida! Zmiłuj się nade mną."
  tags: []
"Łk18,39":
  text: "A ci, co szli na przedzie, upominali go surowo, aby milczał. Ale on tym bardziej krzyczał: Synu Dawida! Zmiłuj się nade mną."
  tags: []
"Łk18,40":
  text: "A gdy Jezus stanął, kazał go przyprowadzić do siebie; i gdy on się przybliżył,"
  tags: []
"Łk18,41":
  text: "Zapytał go, mówiąc: Co chcesz, abym ci uczynił? A on powiedział: Panie! Abym przejrzał."
  tags: []
"Łk18,42":
  text: "A Jezus mu powiedział: Przejrzyj! Wiara twoja cię ocaliła."
  tags: []
"Łk18,43":
  text: "I natychmiast przejrzał, i podążał za Nim, chwaląc Boga. A cały lud widząc to, oddał chwałę Bogu."
  tags: []
