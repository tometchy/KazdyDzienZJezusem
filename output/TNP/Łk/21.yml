"Łk21,1": "A gdy podniósł wzrok, ujrzał bogaczy, którzy wrzucali swoje dary do skarbca."
"Łk21,2": "Ujrzał też i pewną ubogą wdowę, wrzucającą tam dwa leptony."
"Łk21,3": "I powiedział: Prawdziwie mówię wam, że ta uboga wdowa wrzuciła więcej, niż ci wszyscy."
"Łk21,4": "Albowiem oni wszyscy z tego, co mieli w nadmiarze, wrzucili do darów Bożych, ale ona ze swojego niedostatku wrzuciła wszystkie swoje środki na życie."
"Łk21,5": "A gdy niektórzy mówili o świątyni, że jest przyozdobiona pięknymi kamieniami i darami, powiedział:"
"Łk21,6": "Przyjdą dni, w których, z tego, co widzicie, nie zostanie kamień na kamieniu, którego by nie zwalono."
"Łk21,7": "I pytali Go, mówiąc: Nauczycielu! Kiedy to będzie? I jaki jest znak, kiedy miałoby się to stać?"
"Łk21,8": "A On powiedział: Uważajcie, abyście nie byli wprowadzeni w błąd; albowiem wielu przyjdzie w moim imieniu, mówiąc: Ja jestem; oraz: Czas się przybliżył; nie udawajcie się jednak za nimi."
"Łk21,9": "A gdy usłyszycie o wojnach i o zamieszkach, nie bądźcie przerażeni; albowiem to musi się stać najpierw; ale nie zaraz nastąpi koniec."
"Łk21,10": "Wtedy mówił im: Powstanie naród przeciwko narodowi i królestwo przeciwko królestwu;"
"Łk21,11": "I będą miejscami wielkie trzęsienia ziemi, i głód, i zarazy, i zjawiska budzące strach, i wielkie znaki z nieba."
"Łk21,12": "Ale przed tym wszystkim pochwycą was w swoje ręce i będą was prześladować, wydadzą do synagog i do więzień, poprowadzą przed królów i przed namiestników ze względu na moje imię."
"Łk21,13": "A to was spotka na świadectwo."
"Łk21,14": "Złóżcie więc to do swoich serc, aby nie przygotowywać wcześniej, jak macie się bronić;"
"Łk21,15": "Albowiem ja dam wam usta i mądrość, której nie będą mogli odeprzeć, ani przeciwstawić się, wszyscy wasi przeciwnicy."
"Łk21,16": "A wydani zostaniecie i przez rodziców, i przez braci, i przez krewnych, i przez przyjaciół, i doprowadzą do śmierci niektórych z was;"
"Łk21,17": "I będziecie znienawidzeni przez wszystkich z powodu mojego imienia."
"Łk21,18": "Ale i włos z waszej głowy nie zginie."
"Łk21,19": "Przez swoją wytrwałość zyskacie swoje dusze."
"Łk21,20": "A gdy ujrzycie Jerozolimę otoczoną przez wojska, wtedy wiedzcie, że bliskie jest jej spustoszenie."
"Łk21,21": "Wtedy ci, którzy są w Judei, niech uciekają w góry; a ci, którzy są w jej środku, niech wyjdą na zewnątrz; a ci, którzy są na polach, niech do niej nie wchodzą."
"Łk21,22": "Gdyż są to dni pomsty, aby zostało wypełnione wszystko, co jest napisane."
"Łk21,23": "A w te dni biada kobietom w ciąży i karmiącym piersią! Albowiem będzie wielki ucisk na tej ziemi i gniew nad tym ludem."
"Łk21,24": "I padną od ostrza miecza, i zostaną zabrani w niewolę między wszystkie narody, a Jerozolima będzie deptana przez pogan, aż wypełnią się czasy pogan."
"Łk21,25": "I będą znaki na słońcu i na księżycu, i na gwiazdach, a na ziemi udręka narodów, bezradnych jak wobec szumu morza i rozhukanej fali;"
"Łk21,26": "I ludzie będą mdleć ze strachu i w oczekiwaniu tego, co przychodzi na zamieszkały świat; albowiem moce niebieskie zostaną poruszone."
"Łk21,27": "I wówczas zobaczą Syna Człowieczego, przychodzącego w obłoku z wielką mocą i chwałą."
"Łk21,28": "A gdy zaczną dziać się te rzeczy, wyprostujcie się i podnieście swoje głowy, dlatego że zbliża się wasze odkupienie."
"Łk21,29": "I powiedział im podobieństwo: Spójrzcie na figowiec i na wszystkie drzewa;"
"Łk21,30": "Gdy widzicie, że już pączkują, sami poznajecie, że lato jest już blisko."
"Łk21,31": "Tak i wy, gdy ujrzycie, że to się dzieje, wiedzcie, że Królestwo Boże jest blisko."
"Łk21,32": "Zaprawdę mówię wam, że nie przeminie to pokolenie, aż wszystko to się stanie."
"Łk21,33": "Niebo i ziemia przeminą, ale moje słowa na pewno nie przeminą."
"Łk21,34": "Uważajcie na siebie, aby czasem wasze serca nie zostały obciążone obżarstwem i pijaństwem, i troską o to życie, aby na was nagle nie przyszedł ten dzień."
"Łk21,35": "Nadejdzie bowiem jak sidło na wszystkich zamieszkujących na obliczu całej ziemi."
"Łk21,36": "Czuwajcie więc, modląc się w każdym czasie, abyście zostali uznani za godnych, by uciec od tego wszystkiego, co ma nastąpić, i stanąć przed Synem Człowieczym."
"Łk21,37": "I nauczał we dnie w świątyni; a wieczorami wychodził, by spędzać noc na Górze, zwanej Oliwną."
"Łk21,38": "A cały lud już wczesnym rankiem schodził się do Niego, aby Go słuchać w świątyni."
