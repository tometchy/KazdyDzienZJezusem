"Łk21,1":
  text: "A gdy podniósł wzrok, ujrzał bogaczy, którzy wrzucali swoje dary do skarbca."
  tags: []
"Łk21,2":
  text: "Ujrzał też i pewną ubogą wdowę, wrzucającą tam dwa leptony."
  tags: []
"Łk21,3":
  text: "I powiedział: Prawdziwie mówię wam, że ta uboga wdowa wrzuciła więcej, niż ci wszyscy."
  tags: []
"Łk21,4":
  text: "Albowiem oni wszyscy z tego, co mieli w nadmiarze, wrzucili do darów Bożych, ale ona ze swojego niedostatku wrzuciła wszystkie swoje środki na życie."
  tags: []
"Łk21,5":
  text: "A gdy niektórzy mówili o świątyni, że jest przyozdobiona pięknymi kamieniami i darami, powiedział:"
  tags: []
"Łk21,6":
  text: "Przyjdą dni, w których, z tego, co widzicie, nie zostanie kamień na kamieniu, którego by nie zwalono."
  tags: []
"Łk21,7":
  text: "I pytali Go, mówiąc: Nauczycielu! Kiedy to będzie? I jaki jest znak, kiedy miałoby się to stać?"
  tags: []
"Łk21,8":
  text: "A On powiedział: Uważajcie, abyście nie byli wprowadzeni w błąd; albowiem wielu przyjdzie w moim imieniu, mówiąc: Ja jestem; oraz: Czas się przybliżył; nie udawajcie się jednak za nimi."
  tags: []
"Łk21,9":
  text: "A gdy usłyszycie o wojnach i o zamieszkach, nie bądźcie przerażeni; albowiem to musi się stać najpierw; ale nie zaraz nastąpi koniec."
  tags: []
"Łk21,10":
  text: "Wtedy mówił im: Powstanie naród przeciwko narodowi i królestwo przeciwko królestwu;"
  tags: []
"Łk21,11":
  text: "I będą miejscami wielkie trzęsienia ziemi, i głód, i zarazy, i zjawiska budzące strach, i wielkie znaki z nieba."
  tags: []
"Łk21,12":
  text: "Ale przed tym wszystkim pochwycą was w swoje ręce i będą was prześladować, wydadzą do synagog i do więzień, poprowadzą przed królów i przed namiestników ze względu na moje imię."
  tags: []
"Łk21,13":
  text: "A to was spotka na świadectwo."
  tags: []
"Łk21,14":
  text: "Złóżcie więc to do swoich serc, aby nie przygotowywać wcześniej, jak macie się bronić;"
  tags: []
"Łk21,15":
  text: "Albowiem ja dam wam usta i mądrość, której nie będą mogli odeprzeć, ani przeciwstawić się, wszyscy wasi przeciwnicy."
  tags: []
"Łk21,16":
  text: "A wydani zostaniecie i przez rodziców, i przez braci, i przez krewnych, i przez przyjaciół, i doprowadzą do śmierci niektórych z was;"
  tags: []
"Łk21,17":
  text: "I będziecie znienawidzeni przez wszystkich z powodu mojego imienia."
  tags: []
"Łk21,18":
  text: "Ale i włos z waszej głowy nie zginie."
  tags: []
"Łk21,19":
  text: "Przez swoją wytrwałość zyskacie swoje dusze."
  tags: []
"Łk21,20":
  text: "A gdy ujrzycie Jerozolimę otoczoną przez wojska, wtedy wiedzcie, że bliskie jest jej spustoszenie."
  tags: []
"Łk21,21":
  text: "Wtedy ci, którzy są w Judei, niech uciekają w góry; a ci, którzy są w jej środku, niech wyjdą na zewnątrz; a ci, którzy są na polach, niech do niej nie wchodzą."
  tags: []
"Łk21,22":
  text: "Gdyż są to dni pomsty, aby zostało wypełnione wszystko, co jest napisane."
  tags: []
"Łk21,23":
  text: "A w te dni biada kobietom w ciąży i karmiącym piersią! Albowiem będzie wielki ucisk na tej ziemi i gniew nad tym ludem."
  tags: []
"Łk21,24":
  text: "I padną od ostrza miecza, i zostaną zabrani w niewolę między wszystkie narody, a Jerozolima będzie deptana przez pogan, aż wypełnią się czasy pogan."
  tags: []
"Łk21,25":
  text: "I będą znaki na słońcu i na księżycu, i na gwiazdach, a na ziemi udręka narodów, bezradnych jak wobec szumu morza i rozhukanej fali;"
  tags: []
"Łk21,26":
  text: "I ludzie będą mdleć ze strachu i w oczekiwaniu tego, co przychodzi na zamieszkały świat; albowiem moce niebieskie zostaną poruszone."
  tags: []
"Łk21,27":
  text: "I wówczas zobaczą Syna Człowieczego, przychodzącego w obłoku z wielką mocą i chwałą."
  tags: []
"Łk21,28":
  text: "A gdy zaczną dziać się te rzeczy, wyprostujcie się i podnieście swoje głowy, dlatego że zbliża się wasze odkupienie."
  tags: []
"Łk21,29":
  text: "I powiedział im podobieństwo: Spójrzcie na figowiec i na wszystkie drzewa;"
  tags: []
"Łk21,30":
  text: "Gdy widzicie, że już pączkują, sami poznajecie, że lato jest już blisko."
  tags: []
"Łk21,31":
  text: "Tak i wy, gdy ujrzycie, że to się dzieje, wiedzcie, że Królestwo Boże jest blisko."
  tags: []
"Łk21,32":
  text: "Zaprawdę mówię wam, że nie przeminie to pokolenie, aż wszystko to się stanie."
  tags: []
"Łk21,33":
  text: "Niebo i ziemia przeminą, ale moje słowa na pewno nie przeminą."
  tags: []
"Łk21,34":
  text: "Uważajcie na siebie, aby czasem wasze serca nie zostały obciążone obżarstwem i pijaństwem, i troską o to życie, aby na was nagle nie przyszedł ten dzień."
  tags: []
"Łk21,35":
  text: "Nadejdzie bowiem jak sidło na wszystkich zamieszkujących na obliczu całej ziemi."
  tags: []
"Łk21,36":
  text: "Czuwajcie więc, modląc się w każdym czasie, abyście zostali uznani za godnych, by uciec od tego wszystkiego, co ma nastąpić, i stanąć przed Synem Człowieczym."
  tags: []
"Łk21,37":
  text: "I nauczał we dnie w świątyni; a wieczorami wychodził, by spędzać noc na Górze, zwanej Oliwną."
  tags: []
"Łk21,38":
  text: "A cały lud już wczesnym rankiem schodził się do Niego, aby Go słuchać w świątyni."
  tags: []
