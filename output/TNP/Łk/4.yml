"Łk4,1":
  text: "A Jezus, pełen Ducha Świętego, powrócił znad Jordanu i prowadzony był w Duchu na pustkowie,"
  tags: []
"Łk4,2":
  text: "Przez czterdzieści dni był poddawany próbie przez diabła, a przez te dni nic nie jadł; a gdy one się dopełniły, był głodny."
  tags: []
"Łk4,3":
  text: "I diabeł powiedział do Niego: Jeśli jesteś Synem Boga, powiedz temu kamieniowi, aby stał się chlebem."
  tags: []
"Łk4,4":
  text: "A Jezus w odpowiedzi, rzekł do niego: Napisano: Nie samym chlebem żyć będzie człowiek, ale każdym słowem Boga."
  tags: []
"Łk4,5":
  text: "I zaprowadził Go diabeł na wysoką górę, i w ułamku czasu pokazał Mu wszystkie królestwa zamieszkałego świata."
  tags: []
"Łk4,6":
  text: "I diabeł powiedział do Niego: Dam Ci tę całą władzę i ich chwałę; bo jest mi ona dana, a jeśli zechcę daję ją tym, którym chcę."
  tags: []
"Łk4,7":
  text: "Jeśli więc Ty oddasz mi pokłon, wszystko to będzie Twoje."
  tags: []
"Łk4,8":
  text: "A Jezus w odpowiedzi, rzekł mu: Zejdź mi z drogi, szatanie! Bowiem jest napisane: PANU, Bogu twojemu, będziesz się kłaniał i Jemu samemu będziesz służyć."
  tags: []
"Łk4,9":
  text: "Potem przyprowadził Go do Jerozolimy, postawił Go na szczycie świątyni i powiedział do Niego: Jeśli jesteś Synem Boga, rzuć się stąd w dół;"
  tags: []
"Łk4,10":
  text: "Napisano bowiem: Aniołom swoim przykaże o Tobie, aby Cię strzegli,"
  tags: []
"Łk4,11":
  text: "I że, na rękach Cię poniosą, byś czasem nie uraził o kamień swojej stopy."
  tags: []
"Łk4,12":
  text: "A Jezus w odpowiedzi, rzekł mu: Powiedziano: Nie będziesz kusił PANA, Boga twojego."
  tags: []
"Łk4,13":
  text: "I gdy dokończył diabeł wszystkich prób, odstąpił od Niego, aż do pewnego czasu."
  tags: []
"Łk4,14":
  text: "A Jezus wrócił w mocy Ducha do Galilei, a wieść o Nim rozeszła się po całej okolicy."
  tags: []
"Łk4,15":
  text: "A On, wysławiany przez wszystkich nauczał w ich synagogach."
  tags: []
"Łk4,16":
  text: "I przyszedł do Nazaretu, gdzie był wychowany, i wszedł według swojego zwyczaju w dzień szabatu do synagogi, i wstał, aby czytać."
  tags: []
"Łk4,17":
  text: "I podano Mu zwój proroka Izajasza; i gdy rozwinął zwój, znalazł miejsce, gdzie było napisane:"
  tags: []
"Łk4,18":
  text: "Duch PANA nade mną; On ze względu na to, namaścił mnie, abym ogłosił dobrą nowinę ubogim; posłał mnie, abym uzdrowił skruszonych na sercu, abym pojmanym ogłosił wyzwolenie i ślepym przejrzenie, abym złamanych odesłał w wolności,"
  tags: []
"Łk4,19":
  text: "Bym ogłosił rok przychylności PANA."
  tags: []
"Łk4,20":
  text: "A gdy zwinął zwój i oddał go słudze, usiadł; a oczy wszystkich w synagodze były skierowane wprost w Niego."
  tags: []
"Łk4,21":
  text: "Zaczął więc do nich mówić: Dziś to Pismo, które usłyszeliście, wypełniło się."
  tags: []
"Łk4,22":
  text: "A wszyscy wystawiali mu świadectwo, i dziwili się słowom łaski, które wychodziły z Jego ust, i mówili: Czy Ten nie jest synem Józefa?"
  tags: []
"Łk4,23":
  text: "I powiedział do nich: Z pewnością powiecie mi to przysłowie: Lekarzu! Ulecz samego siebie! Tyle słyszeliśmy o tym, co się stało w Kafarnaum, uczyń to i tu w swojej ojczyźnie."
  tags: []
"Łk4,24":
  text: "I powiedział: Zaprawdę mówię wam: Żaden prorok nie jest uznany w swojej ojczyźnie."
  tags: []
"Łk4,25":
  text: "A mówię wam zgodnie z prawdą, że wiele wdów było w Izraelu za dni Eliasza, gdy niebo zostało zamknięte na trzy lata i sześć miesięcy, tak że nastał wielki głód na całej ziemi;"
  tags: []
"Łk4,26":
  text: "A do żadnej z nich nie został posłany Eliasz, tylko do Sarepty Sydońskiej, do kobiety będącej wdową."
  tags: []
"Łk4,27":
  text: "I wielu było trędowatych w Izraelu za proroka Elizeusza; a żaden z nich nie został oczyszczony, tylko Naaman, Syryjczyk."
  tags: []
"Łk4,28":
  text: "A wszyscy w synagodze, gdy to słyszeli, unieśli się gniewem."
  tags: []
"Łk4,29":
  text: "I gdy wstali, wypchnęli Go poza miasto, i przyprowadzili Go aż do krawędzi góry, na której miasto zostało zbudowane, aby Go strącić w dół."
  tags: []
"Łk4,30":
  text: "On natomiast przeszedł przez sam środek nich i odszedł."
  tags: []
"Łk4,31":
  text: "I zszedł do Kafarnaum, miasta w Galilei, i tam ich nauczał w szabaty."
  tags: []
"Łk4,32":
  text: "I zdumiewali się nad Jego nauką; bo słowo Jego było wypowiadane z mocą."
  tags: []
"Łk4,33":
  text: "A był w synagodze człowiek, który miał ducha, demona nieczystego, i krzyknął donośnym głosem,"
  tags: []
"Łk4,34":
  text: "Mówiąc: Ach! Co nam i Tobie, Jezusie Nazareńczyku? Przyszedłeś nas zniszczyć; wiem, kim Ty jesteś – Święty Boży."
  tags: []
"Łk4,35":
  text: "I zgromił go Jezus, mówiąc: Umilknij i wyjdź z niego. Wtedy demon rzucił go na środek, i wyszedł z niego, nie wyrządzając mu żadnej szkody."
  tags: []
"Łk4,36":
  text: "I wszystkich ogarnęło zdumienie, i rozmawiali między sobą, mówiąc: Co to za nauka, że z władzą i mocą rozkazuje duchom nieczystym, i wychodzą?"
  tags: []
"Łk4,37":
  text: "I rozchodziła się wieść o Nim po wszystkich miejscach tej okolicy."
  tags: []
"Łk4,38":
  text: "A gdy wstał, wyszedł z synagogi i poszedł do domu Szymona, a teściowa Szymona była ogarnięta wysoką gorączką; i prosili Go w jej sprawie."
  tags: []
"Łk4,39":
  text: "I gdy stanął nad nią, zgromił gorączkę, a opuściła ją; i zaraz wstała i im usługiwała."
  tags: []
"Łk4,40":
  text: "A gdy zachodziło słońce, wszyscy, którzy mieli cierpiących na rozmaite choroby, przyprowadzali ich do Niego, a On na każdego z nich nałożył ręce i uzdrowił ich."
  tags: []
"Łk4,41":
  text: "I z wielu wychodziły też demony, które krzyczały i mówiły: Ty jesteś Mesjasz, Syn Boży; i gromił je, i nie pozwalał im mówić, gdyż wiedziały, że On jest Mesjaszem."
  tags: []
"Łk4,42":
  text: "A gdy nastał dzień, wyszedł i udał się na odludne miejsce. I tłumy szukały Go, i przyszli do Niego, i zatrzymywali Go, aby od nich nie odchodził."
  tags: []
"Łk4,43":
  text: "A On powiedział do nich: Konieczne jest, abym i innym miastom ogłaszał dobrą nowinę o Królestwie Boga; bo na to jestem posłany."
  tags: []
"Łk4,44":
  text: "I głosił w synagogach Galilei."
  tags: []
