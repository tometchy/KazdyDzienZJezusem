"Łk4,1": "A Jezus, pełen Ducha Świętego, powrócił znad Jordanu i prowadzony był w Duchu na pustkowie,"
"Łk4,2": "Przez czterdzieści dni był poddawany próbie przez diabła, a przez te dni nic nie jadł; a gdy one się dopełniły, był głodny."
"Łk4,3": "I diabeł powiedział do Niego: Jeśli jesteś Synem Boga, powiedz temu kamieniowi, aby stał się chlebem."
"Łk4,4": "A Jezus w odpowiedzi, rzekł do niego: Napisano: Nie samym chlebem żyć będzie człowiek, ale każdym słowem Boga."
"Łk4,5": "I zaprowadził Go diabeł na wysoką górę, i w ułamku czasu pokazał Mu wszystkie królestwa zamieszkałego świata."
"Łk4,6": "I diabeł powiedział do Niego: Dam Ci tę całą władzę i ich chwałę; bo jest mi ona dana, a jeśli zechcę daję ją tym, którym chcę."
"Łk4,7": "Jeśli więc Ty oddasz mi pokłon, wszystko to będzie Twoje."
"Łk4,8": "A Jezus w odpowiedzi, rzekł mu: Zejdź mi z drogi, szatanie! Bowiem jest napisane: PANU, Bogu twojemu, będziesz się kłaniał i Jemu samemu będziesz służyć."
"Łk4,9": "Potem przyprowadził Go do Jerozolimy, postawił Go na szczycie świątyni i powiedział do Niego: Jeśli jesteś Synem Boga, rzuć się stąd w dół;"
"Łk4,10": "Napisano bowiem: Aniołom swoim przykaże o Tobie, aby Cię strzegli,"
"Łk4,11": "I że, na rękach Cię poniosą, byś czasem nie uraził o kamień swojej stopy."
"Łk4,12": "A Jezus w odpowiedzi, rzekł mu: Powiedziano: Nie będziesz kusił PANA, Boga twojego."
"Łk4,13": "I gdy dokończył diabeł wszystkich prób, odstąpił od Niego, aż do pewnego czasu."
"Łk4,14": "A Jezus wrócił w mocy Ducha do Galilei, a wieść o Nim rozeszła się po całej okolicy."
"Łk4,15": "A On, wysławiany przez wszystkich nauczał w ich synagogach."
"Łk4,16": "I przyszedł do Nazaretu, gdzie był wychowany, i wszedł według swojego zwyczaju w dzień szabatu do synagogi, i wstał, aby czytać."
"Łk4,17": "I podano Mu zwój proroka Izajasza; i gdy rozwinął zwój, znalazł miejsce, gdzie było napisane:"
"Łk4,18": "Duch PANA nade mną; On ze względu na to, namaścił mnie, abym ogłosił dobrą nowinę ubogim; posłał mnie, abym uzdrowił skruszonych na sercu, abym pojmanym ogłosił wyzwolenie i ślepym przejrzenie, abym złamanych odesłał w wolności,"
"Łk4,19": "Bym ogłosił rok przychylności PANA."
"Łk4,20": "A gdy zwinął zwój i oddał go słudze, usiadł; a oczy wszystkich w synagodze były skierowane wprost w Niego."
"Łk4,21": "Zaczął więc do nich mówić: Dziś to Pismo, które usłyszeliście, wypełniło się."
"Łk4,22": "A wszyscy wystawiali mu świadectwo, i dziwili się słowom łaski, które wychodziły z Jego ust, i mówili: Czy Ten nie jest synem Józefa?"
"Łk4,23": "I powiedział do nich: Z pewnością powiecie mi to przysłowie: Lekarzu! Ulecz samego siebie! Tyle słyszeliśmy o tym, co się stało w Kafarnaum, uczyń to i tu w swojej ojczyźnie."
"Łk4,24": "I powiedział: Zaprawdę mówię wam: Żaden prorok nie jest uznany w swojej ojczyźnie."
"Łk4,25": "A mówię wam zgodnie z prawdą, że wiele wdów było w Izraelu za dni Eliasza, gdy niebo zostało zamknięte na trzy lata i sześć miesięcy, tak że nastał wielki głód na całej ziemi;"
"Łk4,26": "A do żadnej z nich nie został posłany Eliasz, tylko do Sarepty Sydońskiej, do kobiety będącej wdową."
"Łk4,27": "I wielu było trędowatych w Izraelu za proroka Elizeusza; a żaden z nich nie został oczyszczony, tylko Naaman, Syryjczyk."
"Łk4,28": "A wszyscy w synagodze, gdy to słyszeli, unieśli się gniewem."
"Łk4,29": "I gdy wstali, wypchnęli Go poza miasto, i przyprowadzili Go aż do krawędzi góry, na której miasto zostało zbudowane, aby Go strącić w dół."
"Łk4,30": "On natomiast przeszedł przez sam środek nich i odszedł."
"Łk4,31": "I zszedł do Kafarnaum, miasta w Galilei, i tam ich nauczał w szabaty."
"Łk4,32": "I zdumiewali się nad Jego nauką; bo słowo Jego było wypowiadane z mocą."
"Łk4,33": "A był w synagodze człowiek, który miał ducha, demona nieczystego, i krzyknął donośnym głosem,"
"Łk4,34": "Mówiąc: Ach! Co nam i Tobie, Jezusie Nazareńczyku? Przyszedłeś nas zniszczyć; wiem, kim Ty jesteś – Święty Boży."
"Łk4,35": "I zgromił go Jezus, mówiąc: Umilknij i wyjdź z niego. Wtedy demon rzucił go na środek, i wyszedł z niego, nie wyrządzając mu żadnej szkody."
"Łk4,36": "I wszystkich ogarnęło zdumienie, i rozmawiali między sobą, mówiąc: Co to za nauka, że z władzą i mocą rozkazuje duchom nieczystym, i wychodzą?"
"Łk4,37": "I rozchodziła się wieść o Nim po wszystkich miejscach tej okolicy."
"Łk4,38": "A gdy wstał, wyszedł z synagogi i poszedł do domu Szymona, a teściowa Szymona była ogarnięta wysoką gorączką; i prosili Go w jej sprawie."
"Łk4,39": "I gdy stanął nad nią, zgromił gorączkę, a opuściła ją; i zaraz wstała i im usługiwała."
"Łk4,40": "A gdy zachodziło słońce, wszyscy, którzy mieli cierpiących na rozmaite choroby, przyprowadzali ich do Niego, a On na każdego z nich nałożył ręce i uzdrowił ich."
"Łk4,41": "I z wielu wychodziły też demony, które krzyczały i mówiły: Ty jesteś Mesjasz, Syn Boży; i gromił je, i nie pozwalał im mówić, gdyż wiedziały, że On jest Mesjaszem."
"Łk4,42": "A gdy nastał dzień, wyszedł i udał się na odludne miejsce. I tłumy szukały Go, i przyszli do Niego, i zatrzymywali Go, aby od nich nie odchodził."
"Łk4,43": "A On powiedział do nich: Konieczne jest, abym i innym miastom ogłaszał dobrą nowinę o Królestwie Boga; bo na to jestem posłany."
"Łk4,44": "I głosił w synagogach Galilei."
