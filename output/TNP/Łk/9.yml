"Łk9,1": "A gdy Jezus przywołał do siebie dwunastu swoich uczniów, dał im moc i władzę nad wszystkimi demonami, i moc, aby uzdrawiali choroby."
"Łk9,2": "I wysłał ich, aby głosili Królestwo Boże i uzdrawiali chorych."
"Łk9,3": "I powiedział do nich: Niczego nie zabierajcie w drogę, ani lasek, ani torby, ani chleba, ani srebra, ani też nie bierzcie po dwie tuniki."
"Łk9,4": "A do któregokolwiek domu wejdziecie, tam pozostańcie, i stamtąd wychodźcie."
"Łk9,5": "A jeśli ktoś nie przyjąłby was, wychodząc z tego miasta, strząśnijcie proch ze swoich stóp na świadectwo dla nich."
"Łk9,6": "Wyszli więc, i chodzili po wszystkich wioskach, głosząc dobrą nowinę i wszędzie uzdrawiając."
"Łk9,7": "I usłyszał tetrarcha Herod o wszystkim, co działo się za Jego sprawą, i był zaniepokojony, dlatego że niektórzy mówili, że Jan został wzbudzony z martwych;"
"Łk9,8": "Niektórzy natomiast, że ukazał się Eliasz; a inni, że powstał z martwych jeden z dawnych proroków."
"Łk9,9": "I powiedział Herod: Janowi ja ściąłem głowę, ale kim jest Ten, o którym słyszę takie rzeczy? I szukał sposobności, aby Go zobaczyć."
"Łk9,10": "A gdy wrócili apostołowie, opowiedzieli Mu, co uczynili. A On wziął ich ze sobą i usunął się na osobność, na miejsce pustynne przy mieście, które nazwano Betsaida."
"Łk9,11": "Tłumy jednak dowiedziały się o tym i podążały za Nim; i gdy je przyjął, mówił im o Królestwie Bożym; i uzdrawiał tych, którzy potrzebowali uzdrowienia."
"Łk9,12": "A gdy dzień chylił się ku wieczorowi, przystąpiło więc dwunastu, mówiąc do Niego: Rozpuść tłum, aby odszedł do okolicznych miasteczek i wsi, tam się zatrzymali i znaleźli żywność; bo tu jesteśmy na miejscu pustynnym."
"Łk9,13": "A On powiedział do nich: Dajcie wy im jeść. A oni powiedzieli: Nie mamy więcej niż pięć chlebów i dwie ryby, chyba że pójdziemy i kupimy żywności dla całego tego ludu."
"Łk9,14": "Było tam bowiem około pięciu tysięcy mężczyzn. I powiedział do swoich uczniów: Rozłóżcie ich grupami po pięćdziesięciu."
"Łk9,15": "I uczynili tak, i posadzili wszystkich."
"Łk9,16": "A On wziął owe pięć chlebów i dwie ryby, podniósł wzrok ku niebu, błogosławił je, i połamał, i dawał uczniom, aby podawali tej rzeszy."
"Łk9,17": "I zjedli, i wszyscy byli nasyceni; i zebrano pozostałych kawałków dwanaście koszy."
"Łk9,18": "I stało się, gdy modlił się samotnie, a byli razem z Nim uczniowie, że zapytał ich, mówiąc: Co mówią o mnie tłumy? Kim ja jestem według nich?"
"Łk9,19": "A oni w odpowiedzi, rzekli: Janem Chrzcicielem, a inni Eliaszem, jeszcze inni mówią, że powstał z martwych jeden z dawnych proroków."
"Łk9,20": "I powiedział im: Wy natomiast mówicie, że kim ja jestem? A w odpowiedzi Piotr, rzekł: Mesjaszem Boga."
"Łk9,21": "Ale On surowo napomniał ich i rozkazał, aby nikomu o tym nie mówili,"
"Łk9,22": "Mówiąc, że Syn Człowieczy musi wiele wycierpieć i być odrzucony przez starszych, arcykapłanów i uczonych w Piśmie, i zostać zabity, a trzeciego dnia zostać wzbudzonym z martwych."
"Łk9,23": "I mówił też do wszystkich: Jeśli ktoś chce iść za mną, niech wyprze się samego siebie i niech weźmie swój krzyż codziennie, i niech idzie za mną."
"Łk9,24": "Albowiem kto chce zachować swoje życie, straci je; a kto straci swoje życie dla mnie, ten je ocali."
"Łk9,25": "Bo co za korzyść odniesie człowiek, gdy cały świat pozyska, a samego siebie zgubi lub poniesie szkodę."
"Łk9,26": "Albowiem kto wstydzi się mnie i moich słów, tego i Syn Człowieczy będzie się wstydzić, kiedy przyjdzie w chwale swojej, Ojca i świętych aniołów."
"Łk9,27": "Ale prawdziwie mówię wam: Niektórzy z tych, którzy tutaj stoją, nie skosztują śmierci, aż ujrzą Królestwo Boże."
"Łk9,28": "I stało się w jakieś osiem dni po tych słowach, że wziął ze sobą Piotra i Jana, i Jakuba i wszedł na górę, aby się modlić."
"Łk9,29": "I gdy modlił się, zmienił się wygląd Jego oblicza, a Jego szaty stały się białe i promieniejące."
"Łk9,30": "I oto dwaj mężowie rozmawiali z Nim, a byli to Mojżesz i Eliasz;"
"Łk9,31": "Którzy ukazali się w chwale i mówili o Jego odejściu, którego zamierzał dokonać w Jerozolimie."
"Łk9,32": "A Piotra i tych, którzy byli z Nim, zmógł sen; a gdy ocknęli się, ujrzeli Jego chwałę, i dwóch mężów, którzy razem z Nim stali."
"Łk9,33": "I stało się, w chwili gdy oni się z Nim rozstawali, że Piotr powiedział do Jezusa: Mistrzu! Dobrze nam tu być; uczyńmy trzy namioty: Tobie jeden i Mojżeszowi jeden, i Eliaszowi jeden; nie wiedział bowiem co mówi."
"Łk9,34": "A gdy on to mówił, pojawił się obłok i zacienił ich; i bali się, gdy tamci wchodzili w obłok."
"Łk9,35": "I rozległ się głos z obłoku, mówiący: To jest mój Syn umiłowany, Jego słuchajcie."
"Łk9,36": "A gdy przebrzmiał ten głos, Jezus znalazł się sam. A oni zamilkli, i o tym, co widzieli nikomu w tych dniach nic nie oznajmili."
"Łk9,37": "I stało się, że w następnym dniu, gdy zeszli z góry, wyszedł Mu na spotkanie liczny tłum."
"Łk9,38": "I oto pewien mężczyzna z tłumu zawołał, mówiąc: Nauczycielu! Proszę Cię, spójrz na mojego syna, bo jest moim jedynakiem."
"Łk9,39": "I oto duch chwyta go, i nagle krzyczy, i szarpie nim tak, że aż się pieni, i z trudem odstępuje od niego, tłukąc nim."
"Łk9,40": "I prosiłem Twoich uczniów, aby go wyrzucili, a nie mogli."
"Łk9,41": "Wtedy Jezus w odpowiedzi, rzekł: O pokolenie bez wiary i przewrotne! Jak długo będę z wami, i będę was znosił? Przyprowadź tu swojego syna."
"Łk9,42": "A wtedy, gdy on podchodził, szarpnął nim zły duch i potrząsnął nim; ale Jezus zgromił ducha nieczystego i uzdrowił chłopca, i oddał go jego ojcu."
"Łk9,43": "A wszyscy zdumiewali się nad wielkością Boga. A gdy wszyscy byli pełni podziwu nad tym wszystkim, co Jezus uczynił, powiedział do swoich uczniów:"
"Łk9,44": "Nastawcie swoje uszy na te słowa; bowiem Syn Człowieczy ma być wydany w ręce ludzi."
"Łk9,45": "Lecz oni nie rozumieli tej wypowiedzi, i była zakryta przed nimi, tak, aby jej nie pojęli, a bali się Go spytać o tę wypowiedź."
"Łk9,46": "A przyszło im na myśl, kto z nich mógłby być większy."
"Łk9,47": "A Jezus, poznając myśli ich serca, wziął dziecko i postawił je przy sobie,"
"Łk9,48": "I powiedział im: Kto przyjąłby to dziecko w moim imieniu, mnie przyjmuje; jeśli ktoś mnie przyjmuje, przyjmuje Tego, który mnie posłał; albowiem kto jest najmniejszy między wami wszystkimi, ten będzie wielki."
"Łk9,49": "A Jan w odpowiedzi, rzekł: Mistrzu! Widzieliśmy kogoś, kto w Twoim imieniu wygania demony i zabroniliśmy mu, dlatego że nie chodzi z nami."
"Łk9,50": "I powiedział do niego Jezus: Nie zabraniajcie mu; bo kto nie jest przeciwko nam, ten jest z nami."
"Łk9,51": "A gdy się wypełniły Jego dni, że miał być wzięty w górę, stało się, że On zwrócił swoje oblicze, aby iść do Jerozolimy."
"Łk9,52": "I wysłał posłańców przed sobą, którzy idąc weszli do miasteczka Samarytan, aby przygotować dla Niego miejsce."
"Łk9,53": "Lecz oni Go nie przyjęli, dlatego że zmierzał ku Jerozolimie."
"Łk9,54": "A widząc to uczniowie Jego, Jakub i Jan, powiedzieli: Panie! Chcesz, a powiemy, żeby z nieba zstąpił ogień i ich zniszczył, tak jak to uczynił Eliasz?"
"Łk9,55": "Ale Jezus obrócił się i surowo napomniał ich, mówiąc: Wy nie wiecie, jakiego jesteście ducha."
"Łk9,56": "Albowiem Syn Człowieczy nie przyszedł zatracić dusze ludzkie, ale je zbawić. I poszli do innego miasteczka."
"Łk9,57": "I stało się, gdy oni szli, że w drodze ktoś powiedział do Niego: Pójdę za Tobą, dokądkolwiek pójdziesz, Panie!"
"Łk9,58": "A Jezus powiedział do niego: Lisy mają jamy, a ptaki z nieba gniazda; lecz Syn Człowieczy nie ma, gdzie by skłonił głowę."
"Łk9,59": "I powiedział do innego: Pójdź za mną! Ale on powiedział: Panie! Pozwól mi najpierw odejść i pogrzebać mojego ojca."
"Łk9,60": "Ale Jezus powiedział mu: Pozwól umarłym pogrzebać swoich umarłych, a ty idź i rozgłaszaj Królestwo Boże."
"Łk9,61": "Powiedział też i inny: Pójdę za Tobą, Panie! Ale najpierw pozwól mi pożegnać się z tymi, którzy są w moim domu."
"Łk9,62": "A Jezus powiedział do niego: Nikt, kto przykłada swoją rękę do pługa i spogląda do tyłu, nie jest zdatny do Królestwa Bożego."
