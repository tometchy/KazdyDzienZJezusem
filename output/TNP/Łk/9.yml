"Łk9,1":
  text: "A gdy Jezus przywołał do siebie dwunastu swoich uczniów, dał im moc i władzę nad wszystkimi demonami, i moc, aby uzdrawiali choroby."
  tags: []
"Łk9,2":
  text: "I wysłał ich, aby głosili Królestwo Boże i uzdrawiali chorych."
  tags: []
"Łk9,3":
  text: "I powiedział do nich: Niczego nie zabierajcie w drogę, ani lasek, ani torby, ani chleba, ani srebra, ani też nie bierzcie po dwie tuniki."
  tags: []
"Łk9,4":
  text: "A do któregokolwiek domu wejdziecie, tam pozostańcie, i stamtąd wychodźcie."
  tags: []
"Łk9,5":
  text: "A jeśli ktoś nie przyjąłby was, wychodząc z tego miasta, strząśnijcie proch ze swoich stóp na świadectwo dla nich."
  tags: []
"Łk9,6":
  text: "Wyszli więc, i chodzili po wszystkich wioskach, głosząc dobrą nowinę i wszędzie uzdrawiając."
  tags: []
"Łk9,7":
  text: "I usłyszał tetrarcha Herod o wszystkim, co działo się za Jego sprawą, i był zaniepokojony, dlatego że niektórzy mówili, że Jan został wzbudzony z martwych;"
  tags: []
"Łk9,8":
  text: "Niektórzy natomiast, że ukazał się Eliasz; a inni, że powstał z martwych jeden z dawnych proroków."
  tags: []
"Łk9,9":
  text: "I powiedział Herod: Janowi ja ściąłem głowę, ale kim jest Ten, o którym słyszę takie rzeczy? I szukał sposobności, aby Go zobaczyć."
  tags: []
"Łk9,10":
  text: "A gdy wrócili apostołowie, opowiedzieli Mu, co uczynili. A On wziął ich ze sobą i usunął się na osobność, na miejsce pustynne przy mieście, które nazwano Betsaida."
  tags: []
"Łk9,11":
  text: "Tłumy jednak dowiedziały się o tym i podążały za Nim; i gdy je przyjął, mówił im o Królestwie Bożym; i uzdrawiał tych, którzy potrzebowali uzdrowienia."
  tags: []
"Łk9,12":
  text: "A gdy dzień chylił się ku wieczorowi, przystąpiło więc dwunastu, mówiąc do Niego: Rozpuść tłum, aby odszedł do okolicznych miasteczek i wsi, tam się zatrzymali i znaleźli żywność; bo tu jesteśmy na miejscu pustynnym."
  tags: []
"Łk9,13":
  text: "A On powiedział do nich: Dajcie wy im jeść. A oni powiedzieli: Nie mamy więcej niż pięć chlebów i dwie ryby, chyba że pójdziemy i kupimy żywności dla całego tego ludu."
  tags: []
"Łk9,14":
  text: "Było tam bowiem około pięciu tysięcy mężczyzn. I powiedział do swoich uczniów: Rozłóżcie ich grupami po pięćdziesięciu."
  tags: []
"Łk9,15":
  text: "I uczynili tak, i posadzili wszystkich."
  tags: []
"Łk9,16":
  text: "A On wziął owe pięć chlebów i dwie ryby, podniósł wzrok ku niebu, błogosławił je, i połamał, i dawał uczniom, aby podawali tej rzeszy."
  tags: []
"Łk9,17":
  text: "I zjedli, i wszyscy byli nasyceni; i zebrano pozostałych kawałków dwanaście koszy."
  tags: []
"Łk9,18":
  text: "I stało się, gdy modlił się samotnie, a byli razem z Nim uczniowie, że zapytał ich, mówiąc: Co mówią o mnie tłumy? Kim ja jestem według nich?"
  tags: []
"Łk9,19":
  text: "A oni w odpowiedzi, rzekli: Janem Chrzcicielem, a inni Eliaszem, jeszcze inni mówią, że powstał z martwych jeden z dawnych proroków."
  tags: []
"Łk9,20":
  text: "I powiedział im: Wy natomiast mówicie, że kim ja jestem? A w odpowiedzi Piotr, rzekł: Mesjaszem Boga."
  tags: []
"Łk9,21":
  text: "Ale On surowo napomniał ich i rozkazał, aby nikomu o tym nie mówili,"
  tags: []
"Łk9,22":
  text: "Mówiąc, że Syn Człowieczy musi wiele wycierpieć i być odrzucony przez starszych, arcykapłanów i uczonych w Piśmie, i zostać zabity, a trzeciego dnia zostać wzbudzonym z martwych."
  tags: []
"Łk9,23":
  text: "I mówił też do wszystkich: Jeśli ktoś chce iść za mną, niech wyprze się samego siebie i niech weźmie swój krzyż codziennie, i niech idzie za mną."
  tags: []
"Łk9,24":
  text: "Albowiem kto chce zachować swoje życie, straci je; a kto straci swoje życie dla mnie, ten je ocali."
  tags: []
"Łk9,25":
  text: "Bo co za korzyść odniesie człowiek, gdy cały świat pozyska, a samego siebie zgubi lub poniesie szkodę."
  tags: []
"Łk9,26":
  text: "Albowiem kto wstydzi się mnie i moich słów, tego i Syn Człowieczy będzie się wstydzić, kiedy przyjdzie w chwale swojej, Ojca i świętych aniołów."
  tags: []
"Łk9,27":
  text: "Ale prawdziwie mówię wam: Niektórzy z tych, którzy tutaj stoją, nie skosztują śmierci, aż ujrzą Królestwo Boże."
  tags: []
"Łk9,28":
  text: "I stało się w jakieś osiem dni po tych słowach, że wziął ze sobą Piotra i Jana, i Jakuba i wszedł na górę, aby się modlić."
  tags: []
"Łk9,29":
  text: "I gdy modlił się, zmienił się wygląd Jego oblicza, a Jego szaty stały się białe i promieniejące."
  tags: []
"Łk9,30":
  text: "I oto dwaj mężowie rozmawiali z Nim, a byli to Mojżesz i Eliasz;"
  tags: []
"Łk9,31":
  text: "Którzy ukazali się w chwale i mówili o Jego odejściu, którego zamierzał dokonać w Jerozolimie."
  tags: []
"Łk9,32":
  text: "A Piotra i tych, którzy byli z Nim, zmógł sen; a gdy ocknęli się, ujrzeli Jego chwałę, i dwóch mężów, którzy razem z Nim stali."
  tags: []
"Łk9,33":
  text: "I stało się, w chwili gdy oni się z Nim rozstawali, że Piotr powiedział do Jezusa: Mistrzu! Dobrze nam tu być; uczyńmy trzy namioty: Tobie jeden i Mojżeszowi jeden, i Eliaszowi jeden; nie wiedział bowiem co mówi."
  tags: []
"Łk9,34":
  text: "A gdy on to mówił, pojawił się obłok i zacienił ich; i bali się, gdy tamci wchodzili w obłok."
  tags: []
"Łk9,35":
  text: "I rozległ się głos z obłoku, mówiący: To jest mój Syn umiłowany, Jego słuchajcie."
  tags: []
"Łk9,36":
  text: "A gdy przebrzmiał ten głos, Jezus znalazł się sam. A oni zamilkli, i o tym, co widzieli nikomu w tych dniach nic nie oznajmili."
  tags: []
"Łk9,37":
  text: "I stało się, że w następnym dniu, gdy zeszli z góry, wyszedł Mu na spotkanie liczny tłum."
  tags: []
"Łk9,38":
  text: "I oto pewien mężczyzna z tłumu zawołał, mówiąc: Nauczycielu! Proszę Cię, spójrz na mojego syna, bo jest moim jedynakiem."
  tags: []
"Łk9,39":
  text: "I oto duch chwyta go, i nagle krzyczy, i szarpie nim tak, że aż się pieni, i z trudem odstępuje od niego, tłukąc nim."
  tags: []
"Łk9,40":
  text: "I prosiłem Twoich uczniów, aby go wyrzucili, a nie mogli."
  tags: []
"Łk9,41":
  text: "Wtedy Jezus w odpowiedzi, rzekł: O pokolenie bez wiary i przewrotne! Jak długo będę z wami, i będę was znosił? Przyprowadź tu swojego syna."
  tags: []
"Łk9,42":
  text: "A wtedy, gdy on podchodził, szarpnął nim zły duch i potrząsnął nim; ale Jezus zgromił ducha nieczystego i uzdrowił chłopca, i oddał go jego ojcu."
  tags: []
"Łk9,43":
  text: "A wszyscy zdumiewali się nad wielkością Boga. A gdy wszyscy byli pełni podziwu nad tym wszystkim, co Jezus uczynił, powiedział do swoich uczniów:"
  tags: []
"Łk9,44":
  text: "Nastawcie swoje uszy na te słowa; bowiem Syn Człowieczy ma być wydany w ręce ludzi."
  tags: []
"Łk9,45":
  text: "Lecz oni nie rozumieli tej wypowiedzi, i była zakryta przed nimi, tak, aby jej nie pojęli, a bali się Go spytać o tę wypowiedź."
  tags: []
"Łk9,46":
  text: "A przyszło im na myśl, kto z nich mógłby być większy."
  tags: []
"Łk9,47":
  text: "A Jezus, poznając myśli ich serca, wziął dziecko i postawił je przy sobie,"
  tags: []
"Łk9,48":
  text: "I powiedział im: Kto przyjąłby to dziecko w moim imieniu, mnie przyjmuje; jeśli ktoś mnie przyjmuje, przyjmuje Tego, który mnie posłał; albowiem kto jest najmniejszy między wami wszystkimi, ten będzie wielki."
  tags: []
"Łk9,49":
  text: "A Jan w odpowiedzi, rzekł: Mistrzu! Widzieliśmy kogoś, kto w Twoim imieniu wygania demony i zabroniliśmy mu, dlatego że nie chodzi z nami."
  tags: []
"Łk9,50":
  text: "I powiedział do niego Jezus: Nie zabraniajcie mu; bo kto nie jest przeciwko nam, ten jest z nami."
  tags: []
"Łk9,51":
  text: "A gdy się wypełniły Jego dni, że miał być wzięty w górę, stało się, że On zwrócił swoje oblicze, aby iść do Jerozolimy."
  tags: []
"Łk9,52":
  text: "I wysłał posłańców przed sobą, którzy idąc weszli do miasteczka Samarytan, aby przygotować dla Niego miejsce."
  tags: []
"Łk9,53":
  text: "Lecz oni Go nie przyjęli, dlatego że zmierzał ku Jerozolimie."
  tags: []
"Łk9,54":
  text: "A widząc to uczniowie Jego, Jakub i Jan, powiedzieli: Panie! Chcesz, a powiemy, żeby z nieba zstąpił ogień i ich zniszczył, tak jak to uczynił Eliasz?"
  tags: []
"Łk9,55":
  text: "Ale Jezus obrócił się i surowo napomniał ich, mówiąc: Wy nie wiecie, jakiego jesteście ducha."
  tags: []
"Łk9,56":
  text: "Albowiem Syn Człowieczy nie przyszedł zatracić dusze ludzkie, ale je zbawić. I poszli do innego miasteczka."
  tags: []
"Łk9,57":
  text: "I stało się, gdy oni szli, że w drodze ktoś powiedział do Niego: Pójdę za Tobą, dokądkolwiek pójdziesz, Panie!"
  tags: []
"Łk9,58":
  text: "A Jezus powiedział do niego: Lisy mają jamy, a ptaki z nieba gniazda; lecz Syn Człowieczy nie ma, gdzie by skłonił głowę."
  tags: []
"Łk9,59":
  text: "I powiedział do innego: Pójdź za mną! Ale on powiedział: Panie! Pozwól mi najpierw odejść i pogrzebać mojego ojca."
  tags: []
"Łk9,60":
  text: "Ale Jezus powiedział mu: Pozwól umarłym pogrzebać swoich umarłych, a ty idź i rozgłaszaj Królestwo Boże."
  tags: []
"Łk9,61":
  text: "Powiedział też i inny: Pójdę za Tobą, Panie! Ale najpierw pozwól mi pożegnać się z tymi, którzy są w moim domu."
  tags: []
"Łk9,62":
  text: "A Jezus powiedział do niego: Nikt, kto przykłada swoją rękę do pługa i spogląda do tyłu, nie jest zdatny do Królestwa Bożego."
  tags: []
