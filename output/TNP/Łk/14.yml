"Łk14,1":
  text: "I stało się, gdy Jezus wszedł w szabat do domu jednego z przywódców faryzeuszów, aby zjeść posiłek – oni Go uważnie obserwowali."
  tags: []
"Łk14,2":
  text: "I oto zjawił się pewien człowiek chory na puchlinę wodną."
  tags: []
"Łk14,3":
  text: "A Jezus w reakcji na to, powiedział do znawców Prawa i do faryzeuszów, mówiąc: Czy wolno w szabat uzdrawiać? A oni milczeli."
  tags: []
"Łk14,4":
  text: "Wtedy On ujął go, uzdrowił i odesłał."
  tags: []
"Łk14,5":
  text: "I powiedział do nich: Kto z was, gdy jego osioł albo wół wpadnie do studni, nie wyciągnie go od razu w dniu szabatu?"
  tags: []
"Łk14,6":
  text: "I nie byli w stanie Mu na to odpowiedzieć."
  tags: []
"Łk14,7":
  text: "I powiedział zaproszonym podobieństwo, gdy dostrzegł, jak obierali pierwsze miejsca, i mówił do nich:"
  tags: []
"Łk14,8":
  text: "Kiedy jesteś przez kogoś zaproszony na wesele, nie zajmuj pierwszego miejsca przy ławie, aby czasem ktoś zacniejszy od ciebie nie został przez niego zaproszony;"
  tags: []
"Łk14,9":
  text: "A gdy ten, który ciebie i jego zaprosił, podejdzie i powie ci: Ustąp temu miejsca; i wtedy ze wstydem będziesz musiał spocząć na ostatnim miejscu."
  tags: []
"Łk14,10":
  text: "Ale kiedy zostałeś zaproszony, pójdź i spocznij na ostatnim miejscu; aby, gdy przyjdzie ten, który cię zaprosił, powiedział tobie: Przyjacielu! Przesuń się wyżej; wtedy będziesz miał chwałę wobec wszystkich współspoczywających z tobą."
  tags: []
"Łk14,11":
  text: "Gdyż każdy, kto siebie wywyższa, będzie poniżony, a kto się uniża, będzie wywyższony."
  tags: []
"Łk14,12":
  text: "A mówił i temu, który Go zaprosił: Gdy wyprawiasz obiad albo wieczerzę, nie zwołuj swoich przyjaciół, ani swoich braci, ani swoich krewnych, ani bogatych sąsiadów, żeby cię czasem i oni w zamian nie zaprosili, i to stałoby się twoją odpłatą."
  tags: []
"Łk14,13":
  text: "Ale gdy wyprawiasz ucztę, wezwij ubogich, ułomnych, chromych i ślepych,"
  tags: []
"Łk14,14":
  text: "A będziesz błogosławiony; gdyż nie mają ci czym odpłacić, będzie ci bowiem odpłacone przy powstaniu z martwych sprawiedliwych."
  tags: []
"Łk14,15":
  text: "A słysząc to jeden ze współspoczywających, powiedział do niego: Błogosławiony, który będzie jadł chleb w Królestwie Boga."
  tags: []
"Łk14,16":
  text: "On natomiast powiedział do niego: Pewien człowiek wyprawił wielką wieczerzę, i wielu zaprosił;"
  tags: []
"Łk14,17":
  text: "I w godzinie wieczerzy, posłał swojego sługę, aby powiedzieć zaproszonym: Przychodźcie, bo wszystko jest już gotowe."
  tags: []
"Łk14,18":
  text: "I zaczęli się wszyscy, jak jeden wymawiać. Pierwszy powiedział mu: Kupiłem pole, muszę iść i je zobaczyć; proszę cię, miej mnie za wymówionego."
  tags: []
"Łk14,19":
  text: "A drugi powiedział: Kupiłem pięć par wołów i idę je wypróbować; proszę cię, miej mnie za wymówionego."
  tags: []
"Łk14,20":
  text: "A inny powiedział: Pojąłem żonę, dlatego nie mogę przyjść."
  tags: []
"Łk14,21":
  text: "I wrócił ów sługa, i oznajmił to swojemu panu. Wtedy rozgniewał się gospodarz i powiedział swojemu słudze: Wyjdź szybko na place i ulice miasta, i wprowadź tu ubogich, ułomnych, chromych i ślepych."
  tags: []
"Łk14,22":
  text: "I powiedział sługa: Panie! Stało się, jak rozkazałeś, i jeszcze jest miejsce."
  tags: []
"Łk14,23":
  text: "I powiedział pan do sługi: Wyjdź na drogi i między płoty, i przymuszaj wejść, aby został napełniony mój dom."
  tags: []
"Łk14,24":
  text: "Albowiem mówię wam, że nikt z owych mężów, którzy są zaproszeni, nie skosztuje mojej wieczerzy."
  tags: []
"Łk14,25":
  text: "I gdy szły razem z Nim wielkie tłumy, obrócił się i powiedział do nich:"
  tags: []
"Łk14,26":
  text: "Jeśli ktoś przychodzi do mnie, a nie ma w nienawiści swojego ojca i matki, i żony, i dzieci, i braci, i sióstr, a nawet i swojego życia, nie może być moim uczniem."
  tags: []
"Łk14,27":
  text: "I ktokolwiek nie niesie swojego krzyża, a idzie za mną, nie może być moim uczniem."
  tags: []
"Łk14,28":
  text: "Bo kto z was, chcąc zbudować wieżę, najpierw nie usiądzie i nie obliczy kosztu, czy ma na dokończenie?"
  tags: []
"Łk14,29":
  text: "Aby czasem, gdy położy fundament, a nie będzie mógł dokończyć, wszyscy, którzy to widzą, nie zaczęli kpić z niego,"
  tags: []
"Łk14,30":
  text: "Mówiąc: Ten człowiek zaczął budować, a nie mógł dokończyć."
  tags: []
"Łk14,31":
  text: "Albo, jaki król jadąc potykać się na wojnę z drugim królem, nie usiądzie i najpierw nie rozważa, czy jest na tyle silny, by z dziesięcioma tysiącami ludzi stanąć naprzeciw temu, który idzie na niego z dwudziestoma tysiącami?"
  tags: []
"Łk14,32":
  text: "A jeśli nie, to gdy tamten jeszcze jest daleko, wysyła do niego posłów, prosząc o pokój."
  tags: []
"Łk14,33":
  text: "Tak i każdy z was, kto nie rozstanie się ze wszystkim co posiada, nie może być moim uczniem."
  tags: []
"Łk14,34":
  text: "Dobra jest sól; lecz jeśli sól straci swój smak, czym zostanie przyprawiona?"
  tags: []
"Łk14,35":
  text: "Nie nadaje się ani do ziemi, ani do nawozu; wyrzucają ją na zewnątrz. Kto ma uszy by słuchać, niech słucha."
  tags: []
