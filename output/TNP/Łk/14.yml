"Łk14,1": "I stało się, gdy Jezus wszedł w szabat do domu jednego z przywódców faryzeuszów, aby zjeść posiłek – oni Go uważnie obserwowali."
"Łk14,2": "I oto zjawił się pewien człowiek chory na puchlinę wodną."
"Łk14,3": "A Jezus w reakcji na to, powiedział do znawców Prawa i do faryzeuszów, mówiąc: Czy wolno w szabat uzdrawiać? A oni milczeli."
"Łk14,4": "Wtedy On ujął go, uzdrowił i odesłał."
"Łk14,5": "I powiedział do nich: Kto z was, gdy jego osioł albo wół wpadnie do studni, nie wyciągnie go od razu w dniu szabatu?"
"Łk14,6": "I nie byli w stanie Mu na to odpowiedzieć."
"Łk14,7": "I powiedział zaproszonym podobieństwo, gdy dostrzegł, jak obierali pierwsze miejsca, i mówił do nich:"
"Łk14,8": "Kiedy jesteś przez kogoś zaproszony na wesele, nie zajmuj pierwszego miejsca przy ławie, aby czasem ktoś zacniejszy od ciebie nie został przez niego zaproszony;"
"Łk14,9": "A gdy ten, który ciebie i jego zaprosił, podejdzie i powie ci: Ustąp temu miejsca; i wtedy ze wstydem będziesz musiał spocząć na ostatnim miejscu."
"Łk14,10": "Ale kiedy zostałeś zaproszony, pójdź i spocznij na ostatnim miejscu; aby, gdy przyjdzie ten, który cię zaprosił, powiedział tobie: Przyjacielu! Przesuń się wyżej; wtedy będziesz miał chwałę wobec wszystkich współspoczywających z tobą."
"Łk14,11": "Gdyż każdy, kto siebie wywyższa, będzie poniżony, a kto się uniża, będzie wywyższony."
"Łk14,12": "A mówił i temu, który Go zaprosił: Gdy wyprawiasz obiad albo wieczerzę, nie zwołuj swoich przyjaciół, ani swoich braci, ani swoich krewnych, ani bogatych sąsiadów, żeby cię czasem i oni w zamian nie zaprosili, i to stałoby się twoją odpłatą."
"Łk14,13": "Ale gdy wyprawiasz ucztę, wezwij ubogich, ułomnych, chromych i ślepych,"
"Łk14,14": "A będziesz błogosławiony; gdyż nie mają ci czym odpłacić, będzie ci bowiem odpłacone przy powstaniu z martwych sprawiedliwych."
"Łk14,15": "A słysząc to jeden ze współspoczywających, powiedział do niego: Błogosławiony, który będzie jadł chleb w Królestwie Boga."
"Łk14,16": "On natomiast powiedział do niego: Pewien człowiek wyprawił wielką wieczerzę, i wielu zaprosił;"
"Łk14,17": "I w godzinie wieczerzy, posłał swojego sługę, aby powiedzieć zaproszonym: Przychodźcie, bo wszystko jest już gotowe."
"Łk14,18": "I zaczęli się wszyscy, jak jeden wymawiać. Pierwszy powiedział mu: Kupiłem pole, muszę iść i je zobaczyć; proszę cię, miej mnie za wymówionego."
"Łk14,19": "A drugi powiedział: Kupiłem pięć par wołów i idę je wypróbować; proszę cię, miej mnie za wymówionego."
"Łk14,20": "A inny powiedział: Pojąłem żonę, dlatego nie mogę przyjść."
"Łk14,21": "I wrócił ów sługa, i oznajmił to swojemu panu. Wtedy rozgniewał się gospodarz i powiedział swojemu słudze: Wyjdź szybko na place i ulice miasta, i wprowadź tu ubogich, ułomnych, chromych i ślepych."
"Łk14,22": "I powiedział sługa: Panie! Stało się, jak rozkazałeś, i jeszcze jest miejsce."
"Łk14,23": "I powiedział pan do sługi: Wyjdź na drogi i między płoty, i przymuszaj wejść, aby został napełniony mój dom."
"Łk14,24": "Albowiem mówię wam, że nikt z owych mężów, którzy są zaproszeni, nie skosztuje mojej wieczerzy."
"Łk14,25": "I gdy szły razem z Nim wielkie tłumy, obrócił się i powiedział do nich:"
"Łk14,26": "Jeśli ktoś przychodzi do mnie, a nie ma w nienawiści swojego ojca i matki, i żony, i dzieci, i braci, i sióstr, a nawet i swojego życia, nie może być moim uczniem."
"Łk14,27": "I ktokolwiek nie niesie swojego krzyża, a idzie za mną, nie może być moim uczniem."
"Łk14,28": "Bo kto z was, chcąc zbudować wieżę, najpierw nie usiądzie i nie obliczy kosztu, czy ma na dokończenie?"
"Łk14,29": "Aby czasem, gdy położy fundament, a nie będzie mógł dokończyć, wszyscy, którzy to widzą, nie zaczęli kpić z niego,"
"Łk14,30": "Mówiąc: Ten człowiek zaczął budować, a nie mógł dokończyć."
"Łk14,31": "Albo, jaki król jadąc potykać się na wojnę z drugim królem, nie usiądzie i najpierw nie rozważa, czy jest na tyle silny, by z dziesięcioma tysiącami ludzi stanąć naprzeciw temu, który idzie na niego z dwudziestoma tysiącami?"
"Łk14,32": "A jeśli nie, to gdy tamten jeszcze jest daleko, wysyła do niego posłów, prosząc o pokój."
"Łk14,33": "Tak i każdy z was, kto nie rozstanie się ze wszystkim co posiada, nie może być moim uczniem."
"Łk14,34": "Dobra jest sól; lecz jeśli sól straci swój smak, czym zostanie przyprawiona?"
"Łk14,35": "Nie nadaje się ani do ziemi, ani do nawozu; wyrzucają ją na zewnątrz. Kto ma uszy by słuchać, niech słucha."
