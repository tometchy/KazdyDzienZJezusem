"Łk6,1": "A stało się w kolejny szabat, że przechodził On przez zboża; a Jego uczniowie rwali kłosy i rozcierając je rękami, jedli."
"Łk6,2": "A niektórzy z faryzeuszów powiedzieli do nich: Dlaczego czynicie to, czego nie wolno czynić w dni szabatu?"
"Łk6,3": "A Jezus w odpowiedzi, rzekł do nich: Czy nie czytaliście o tym, co uczynił Dawid, gdy był głodny, on i ci, którzy byli z nim?"
"Łk6,4": "Jak wszedł do domu Bożego i wziął chleby ofiarne, i jadł, dał też tym, którzy byli z nim; a których nie wolno jeść, jak tylko kapłanom."
"Łk6,5": "I powiedział im: Syn Człowieczy jest Panem też szabatu."
"Łk6,6": "Stało się też w inny szabat, że Jezus wszedł do synagogi i nauczał; a był tam pewien człowiek z uschłą prawą ręką."
"Łk6,7": "I śledzili Go uczeni w Piśmie i faryzeusze, czy będzie uzdrawiał w szabat, aby znaleźć powód do oskarżenia."
"Łk6,8": "A On znając ich myśli, powiedział człowiekowi, który miał uschłą rękę: Podnieś się i stań na środku. A on podniósł się i stanął."
"Łk6,9": "Jezus więc powiedział do nich: Zapytam was: Czy wolno w dni szabatu dobrze czynić, czy czynić źle? Życie zachować, czy zniszczyć?"
"Łk6,10": "I spojrzał dookoła po wszystkich, i powiedział temu człowiekowi: Wyciągnij swoją rękę! A on tak uczynił; i ręka jego stała się znów zdrowa, jak druga."
"Łk6,11": "Ale oni, pełni szaleństwa, rozmawiali między sobą, co mogliby uczynić Jezusowi."
"Łk6,12": "A stało się w te dni, że odszedł na górę modlić się; i spędził tam noc na modlitwie do Boga."
"Łk6,13": "A gdy nastał dzień, przywołał swoich uczniów i wybrał sobie z nich dwunastu, których też nazwał apostołami:"
"Łk6,14": "Szymona, którego też nazwał Piotrem, i Andrzeja, jego brata, Jakuba i Jana, Filipa i Bartłomieja,"
"Łk6,15": "Mateusza i Tomasza, Jakuba syna Alfeusza, i Szymona, zwanego Zelotą,"
"Łk6,16": "Judę syna Jakuba i Judasza Iskariotę, który stał się zdrajcą."
"Łk6,17": "I zstąpił z nimi w dół, i stanął na równinie, a był tam tłum Jego uczniów i wielkie rzesze ludu z całej Judei i z Jerozolimy, i z wybrzeża Tyru i Sydonu, którzy przyszli, aby Go słuchać i zostać uzdrowionymi ze swoich chorób,"
"Łk6,18": "I ci, którzy byli dręczeni przez duchy nieczyste, byli uzdrawiani."
"Łk6,19": "I cały lud szukał sposobu, by Go dotknąć; gdyż moc wychodziła z Niego i uzdrawiała wszystkich."
"Łk6,20": "A On, podniósł swoje oczy na swoich uczniów i mówił: Błogosławieni, ubodzy! Bo wasze jest Królestwo Boże."
"Łk6,21": "Błogosławieni, którzy teraz głodujecie; gdyż zostaniecie nasyceni. Błogosławieni, którzy teraz płaczecie; gdyż będziecie się śmiać."
"Łk6,22": "Błogosławieni jesteście, gdy ludzie będą was nienawidzić, i gdy was odłączą, i będą was lżyć, i odrzucą wasze imię jako złe, z powodu Syna Człowieczego."
"Łk6,23": "Cieszcie się w tym dniu i podskoczcie z radości; oto bowiem zapłata wasza wielka jest w niebie; bo ich ojcowie tak samo czynili prorokom."
"Łk6,24": "Ale biada wam bogatym! Bo już odbieracie swoją pociechę."
"Łk6,25": "Biada wam, którzy jesteście nasyceni! Bo będziecie głodować. Biada wam, którzy teraz się śmiejecie! Bo będziecie smucić się i płakać."
"Łk6,26": "Biada wam, jeśli dobrze będą o was mówić wszyscy ludzie; bo ich ojcowie tak czynili fałszywym prorokom."
"Łk6,27": "Ale mówię wam, którzy słuchacie: Miłujcie swoich nieprzyjaciół; dobrze czyńcie tym, którzy was nienawidzą."
"Łk6,28": "Błogosławcie tym, którzy was przeklinają; i módlcie się za tych, którzy was znieważają."
"Łk6,29": "Temu, który cię uderza w policzek, nadstaw i drugi; a temu, który odbiera ci płaszcz, i koszuli wziąć nie zabraniaj."
"Łk6,30": "A każdemu, który cię prosi, daj; a od tego, kto bierze, co twoje, nie żądaj zwrotu."
"Łk6,31": "A jak chcecie, aby wam ludzie czynili, tak i wy czyńcie im podobnie."
"Łk6,32": "I jeśli miłujecie tych, którzy was miłują, jaka się wam należy wdzięczność? Albowiem i grzesznicy miłują tych, którzy ich miłują."
"Łk6,33": "A jeśli dobrze czynicie tym, którzy wam dobrze czynią, jaka się wam należy wdzięczność? Albowiem i grzesznicy to samo czynią."
"Łk6,34": "I jeślibyście pożyczali tym, od których spodziewacie się zwrotu, jaka się wam należy wdzięczność? Albowiem i grzesznicy grzesznikom pożyczają, aby tyle samo otrzymać z powrotem."
"Łk6,35": "Ale miłujcie swoich nieprzyjaciół i czyńcie im dobrze, i pożyczajcie nie spodziewając się niczego w zamian, a wielka będzie wasza zapłata, i będziecie synami Najwyższego; On bowiem dobrotliwy jest dla niewdzięcznych i złych."
"Łk6,36": "Dlatego bądźcie miłosierni, jak i Ojciec wasz jest miłosierny."
"Łk6,37": "I nie sądźcie, a nie będziecie sądzeni; nie potępiajcie, a nie będziecie potępieni; odpuszczajcie, a będzie wam odpuszczone."
"Łk6,38": "Dawajcie, a będzie wam dane; miarą dobrą, napchaną i potrzęsioną, i przelewającą dadzą w zanadrze wasze; jaką bowiem miarą mierzycie, taką i wam odmierzą."
"Łk6,39": "Powiedział też im podobieństwo: Czy może ślepy prowadzić ślepego? Czyż obaj nie wpadną w dół?"
"Łk6,40": "Nie jest uczeń ponad swojego nauczyciela; lecz doskonały będzie każdy, jeśli będzie jak jego nauczyciel."
"Łk6,41": "A dlaczego widzisz drzazgę w oku swojego brata, a belki we własnym oku nie dostrzegasz?"
"Łk6,42": "Lub jak możesz powiedzieć swojemu bratu: Bracie! Pozwól, że wyrwę drzazgę z twojego oka; a sam nie widzisz belki, która jest w twoim oku. Obłudniku! Wyrwij wpierw belkę ze swojego oka; a wtedy przejrzysz, abyś wyrwał drzazgę, która jest w oku twojego brata."
"Łk6,43": "Nie ma bowiem drzewa dobrego, które przynosiłoby zgniły owoc; ani zgniłego drzewa, które przynosiłoby owoc dobry."
"Łk6,44": "Gdyż każde drzewo znane jest z własnego owocu; bo nie zbierają z ciernia fig, ani z jeżyn nie zbierają winnych gron."
"Łk6,45": "Dobry człowiek z dobrego skarbca swego serca wydobywa dobre rzeczy, a zły człowiek ze złego skarbca swego serca wydobywa złe rzeczy; albowiem z obfitości serca mówią jego usta."
"Łk6,46": "Dlaczego wzywacie mnie: Panie, Panie! A nie czynicie tego, co mówię?"
"Łk6,47": "Pokażę wam, do kogo podobny jest każdy, kto przychodzi do mnie, i słucha moich słów i je czyni."
"Łk6,48": "Podobny jest do człowieka budującego dom, który kopał i wydrążył głęboko, i założył fundament na skale; a gdy przyszła powódź, uderzyła rzeka w ten dom i nie mogła go zachwiać; bo miał założony fundament na skale."
"Łk6,49": "A kto słucha, a nie czyni, podobny jest do człowieka, który zbudował swój dom na ziemi bez fundamentu, w który uderzyła rzeka, i zaraz upadł; a ruina tego domu była wielka."
