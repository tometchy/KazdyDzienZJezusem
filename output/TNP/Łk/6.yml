"Łk6,1":
  text: "A stało się w kolejny szabat, że przechodził On przez zboża; a Jego uczniowie rwali kłosy i rozcierając je rękami, jedli."
  tags: []
"Łk6,2":
  text: "A niektórzy z faryzeuszów powiedzieli do nich: Dlaczego czynicie to, czego nie wolno czynić w dni szabatu?"
  tags: []
"Łk6,3":
  text: "A Jezus w odpowiedzi, rzekł do nich: Czy nie czytaliście o tym, co uczynił Dawid, gdy był głodny, on i ci, którzy byli z nim?"
  tags: []
"Łk6,4":
  text: "Jak wszedł do domu Bożego i wziął chleby ofiarne, i jadł, dał też tym, którzy byli z nim; a których nie wolno jeść, jak tylko kapłanom."
  tags: []
"Łk6,5":
  text: "I powiedział im: Syn Człowieczy jest Panem też szabatu."
  tags: []
"Łk6,6":
  text: "Stało się też w inny szabat, że Jezus wszedł do synagogi i nauczał; a był tam pewien człowiek z uschłą prawą ręką."
  tags: []
"Łk6,7":
  text: "I śledzili Go uczeni w Piśmie i faryzeusze, czy będzie uzdrawiał w szabat, aby znaleźć powód do oskarżenia."
  tags: []
"Łk6,8":
  text: "A On znając ich myśli, powiedział człowiekowi, który miał uschłą rękę: Podnieś się i stań na środku. A on podniósł się i stanął."
  tags: []
"Łk6,9":
  text: "Jezus więc powiedział do nich: Zapytam was: Czy wolno w dni szabatu dobrze czynić, czy czynić źle? Życie zachować, czy zniszczyć?"
  tags: []
"Łk6,10":
  text: "I spojrzał dookoła po wszystkich, i powiedział temu człowiekowi: Wyciągnij swoją rękę! A on tak uczynił; i ręka jego stała się znów zdrowa, jak druga."
  tags: []
"Łk6,11":
  text: "Ale oni, pełni szaleństwa, rozmawiali między sobą, co mogliby uczynić Jezusowi."
  tags: []
"Łk6,12":
  text: "A stało się w te dni, że odszedł na górę modlić się; i spędził tam noc na modlitwie do Boga."
  tags: []
"Łk6,13":
  text: "A gdy nastał dzień, przywołał swoich uczniów i wybrał sobie z nich dwunastu, których też nazwał apostołami:"
  tags: []
"Łk6,14":
  text: "Szymona, którego też nazwał Piotrem, i Andrzeja, jego brata, Jakuba i Jana, Filipa i Bartłomieja,"
  tags: []
"Łk6,15":
  text: "Mateusza i Tomasza, Jakuba syna Alfeusza, i Szymona, zwanego Zelotą,"
  tags: []
"Łk6,16":
  text: "Judę syna Jakuba i Judasza Iskariotę, który stał się zdrajcą."
  tags: []
"Łk6,17":
  text: "I zstąpił z nimi w dół, i stanął na równinie, a był tam tłum Jego uczniów i wielkie rzesze ludu z całej Judei i z Jerozolimy, i z wybrzeża Tyru i Sydonu, którzy przyszli, aby Go słuchać i zostać uzdrowionymi ze swoich chorób,"
  tags: []
"Łk6,18":
  text: "I ci, którzy byli dręczeni przez duchy nieczyste, byli uzdrawiani."
  tags: []
"Łk6,19":
  text: "I cały lud szukał sposobu, by Go dotknąć; gdyż moc wychodziła z Niego i uzdrawiała wszystkich."
  tags: []
"Łk6,20":
  text: "A On, podniósł swoje oczy na swoich uczniów i mówił: Błogosławieni, ubodzy! Bo wasze jest Królestwo Boże."
  tags: []
"Łk6,21":
  text: "Błogosławieni, którzy teraz głodujecie; gdyż zostaniecie nasyceni. Błogosławieni, którzy teraz płaczecie; gdyż będziecie się śmiać."
  tags: []
"Łk6,22":
  text: "Błogosławieni jesteście, gdy ludzie będą was nienawidzić, i gdy was odłączą, i będą was lżyć, i odrzucą wasze imię jako złe, z powodu Syna Człowieczego."
  tags: []
"Łk6,23":
  text: "Cieszcie się w tym dniu i podskoczcie z radości; oto bowiem zapłata wasza wielka jest w niebie; bo ich ojcowie tak samo czynili prorokom."
  tags: []
"Łk6,24":
  text: "Ale biada wam bogatym! Bo już odbieracie swoją pociechę."
  tags: []
"Łk6,25":
  text: "Biada wam, którzy jesteście nasyceni! Bo będziecie głodować. Biada wam, którzy teraz się śmiejecie! Bo będziecie smucić się i płakać."
  tags: []
"Łk6,26":
  text: "Biada wam, jeśli dobrze będą o was mówić wszyscy ludzie; bo ich ojcowie tak czynili fałszywym prorokom."
  tags: []
"Łk6,27":
  text: "Ale mówię wam, którzy słuchacie: Miłujcie swoich nieprzyjaciół; dobrze czyńcie tym, którzy was nienawidzą."
  tags: []
"Łk6,28":
  text: "Błogosławcie tym, którzy was przeklinają; i módlcie się za tych, którzy was znieważają."
  tags: []
"Łk6,29":
  text: "Temu, który cię uderza w policzek, nadstaw i drugi; a temu, który odbiera ci płaszcz, i koszuli wziąć nie zabraniaj."
  tags: []
"Łk6,30":
  text: "A każdemu, który cię prosi, daj; a od tego, kto bierze, co twoje, nie żądaj zwrotu."
  tags: []
"Łk6,31":
  text: "A jak chcecie, aby wam ludzie czynili, tak i wy czyńcie im podobnie."
  tags: []
"Łk6,32":
  text: "I jeśli miłujecie tych, którzy was miłują, jaka się wam należy wdzięczność? Albowiem i grzesznicy miłują tych, którzy ich miłują."
  tags: []
"Łk6,33":
  text: "A jeśli dobrze czynicie tym, którzy wam dobrze czynią, jaka się wam należy wdzięczność? Albowiem i grzesznicy to samo czynią."
  tags: []
"Łk6,34":
  text: "I jeślibyście pożyczali tym, od których spodziewacie się zwrotu, jaka się wam należy wdzięczność? Albowiem i grzesznicy grzesznikom pożyczają, aby tyle samo otrzymać z powrotem."
  tags: []
"Łk6,35":
  text: "Ale miłujcie swoich nieprzyjaciół i czyńcie im dobrze, i pożyczajcie nie spodziewając się niczego w zamian, a wielka będzie wasza zapłata, i będziecie synami Najwyższego; On bowiem dobrotliwy jest dla niewdzięcznych i złych."
  tags: []
"Łk6,36":
  text: "Dlatego bądźcie miłosierni, jak i Ojciec wasz jest miłosierny."
  tags: []
"Łk6,37":
  text: "I nie sądźcie, a nie będziecie sądzeni; nie potępiajcie, a nie będziecie potępieni; odpuszczajcie, a będzie wam odpuszczone."
  tags: []
"Łk6,38":
  text: "Dawajcie, a będzie wam dane; miarą dobrą, napchaną i potrzęsioną, i przelewającą dadzą w zanadrze wasze; jaką bowiem miarą mierzycie, taką i wam odmierzą."
  tags: []
"Łk6,39":
  text: "Powiedział też im podobieństwo: Czy może ślepy prowadzić ślepego? Czyż obaj nie wpadną w dół?"
  tags: []
"Łk6,40":
  text: "Nie jest uczeń ponad swojego nauczyciela; lecz doskonały będzie każdy, jeśli będzie jak jego nauczyciel."
  tags: []
"Łk6,41":
  text: "A dlaczego widzisz drzazgę w oku swojego brata, a belki we własnym oku nie dostrzegasz?"
  tags: []
"Łk6,42":
  text: "Lub jak możesz powiedzieć swojemu bratu: Bracie! Pozwól, że wyrwę drzazgę z twojego oka; a sam nie widzisz belki, która jest w twoim oku. Obłudniku! Wyrwij wpierw belkę ze swojego oka; a wtedy przejrzysz, abyś wyrwał drzazgę, która jest w oku twojego brata."
  tags: []
"Łk6,43":
  text: "Nie ma bowiem drzewa dobrego, które przynosiłoby zgniły owoc; ani zgniłego drzewa, które przynosiłoby owoc dobry."
  tags: []
"Łk6,44":
  text: "Gdyż każde drzewo znane jest z własnego owocu; bo nie zbierają z ciernia fig, ani z jeżyn nie zbierają winnych gron."
  tags: []
"Łk6,45":
  text: "Dobry człowiek z dobrego skarbca swego serca wydobywa dobre rzeczy, a zły człowiek ze złego skarbca swego serca wydobywa złe rzeczy; albowiem z obfitości serca mówią jego usta."
  tags: []
"Łk6,46":
  text: "Dlaczego wzywacie mnie: Panie, Panie! A nie czynicie tego, co mówię?"
  tags: []
"Łk6,47":
  text: "Pokażę wam, do kogo podobny jest każdy, kto przychodzi do mnie, i słucha moich słów i je czyni."
  tags: []
"Łk6,48":
  text: "Podobny jest do człowieka budującego dom, który kopał i wydrążył głęboko, i założył fundament na skale; a gdy przyszła powódź, uderzyła rzeka w ten dom i nie mogła go zachwiać; bo miał założony fundament na skale."
  tags: []
"Łk6,49":
  text: "A kto słucha, a nie czyni, podobny jest do człowieka, który zbudował swój dom na ziemi bez fundamentu, w który uderzyła rzeka, i zaraz upadł; a ruina tego domu była wielka."
  tags: []
