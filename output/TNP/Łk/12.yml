"Łk12,1": "Wtedy, gdy zgromadziło się wiele tysięcy ludu, tak że jedni po drugich deptali, zaczął mówić do swoich uczniów: Przede wszystkim zważcie na zakwas faryzeuszów, którym jest obłuda."
"Łk12,2": "A nie ma nic zakrytego, co nie zostanie odsłonięte, i nic tajemnego, co nie byłoby poznane."
"Łk12,3": "Dlatego, co mówiliście w ciemności, będzie słyszane w świetle, i co szeptaliście do ucha w alkierzach, głoszone będzie na tarasach."
"Łk12,4": "A mówię wam, moim przyjaciołom: Nie bójcie się tych, którzy zabijają ciało, a potem nie mają już nic więcej, co mogliby uczynić."
"Łk12,5": "Pokażę wam natomiast, kogo macie się bać: Bójcie się Tego, który, gdy zabije, ma władzę wrzucić do Gehenny, to wam mówię, Tego się bójcie."
"Łk12,6": "Czyż pięciu wróbli nie sprzedają za dwa assariony? I ani jeden z nich nie jest zapomniany przed obliczem Boga."
"Łk12,7": "Ale i włosy na waszej głowie wszystkie są policzone. Nie bójcie się więc; więcej znaczycie niż wiele wróbli."
"Łk12,8": "A mówię wam: Każdy kto przyzna się do mnie przed ludźmi, do tego i Syn Człowieczy przyzna się przed aniołami Boga;"
"Łk12,9": "A kto wyparłby się mnie przed ludźmi, ten dozna odrzucenia przed aniołami Boga."
"Łk12,10": "I każdy, kto powie jakieś słowo na Syna Człowieczego, temu będzie odpuszczone; a temu, kto by bluźnił przeciwko Duchowi Świętemu, nie zostanie odpuszczone."
"Łk12,11": "A gdy was będą prowadzić do synagog, i przed rządzących i władze, nie martwcie się, jak macie się bronić, i co macie mówić."
"Łk12,12": "Duch Święty bowiem nauczy was w tej godzinie, co trzeba powiedzieć."
"Łk12,13": "I powiedział do Niego ktoś z ludu: Nauczycielu! Powiedz mojemu bratu, aby podzielił się ze mną dziedzictwem."
"Łk12,14": "A On powiedział do niego: Człowieku! Kto mnie ustanowił sędzią lub rozjemcą nad wami?"
"Łk12,15": "I powiedział do nich: Uważajcie i strzeżcie się chciwości, gdyż życie człowieka nie jest zależne od obfitości jego majętności."
"Łk12,16": "I powiedział im podobieństwo, mówiąc: U pewnego bogatego człowieka obrodziło pole."
"Łk12,17": "I rozważał w sobie, mówiąc: Co mam zrobić, skoro nie mam gdzie gromadzić moich plonów?"
"Łk12,18": "I powiedział: To uczynię: Zburzę swoje spichlerze i większe pobuduję, i zgromadzę wszystkie moje plony i wszystkie swoje dobra;"
"Łk12,19": "I powiem mojej duszy: Duszo! Masz wiele dóbr złożonych na wiele lat; odpocznij, jedz, pij, i bądź dobrej myśli."
"Łk12,20": "Ale Bóg powiedział do niego: Bezmyślny! Tej nocy zażądają od ciebie twojej duszy, a to, co przygotowałeś, czyje będzie?"
"Łk12,21": "Tak będzie i z tym, który dla siebie gromadzi skarby, a nie wzbogaca się u Boga."
"Łk12,22": "Do swoich uczniów natomiast powiedział: Dlatego mówię wam: Nie troszczcie się o swoje życie, co będziecie jeść, ani o ciało, w co się przyodziejecie."
"Łk12,23": "Dusza więcej znaczy niż pokarm, a ciało niż ubranie."
"Łk12,24": "Przyjrzyjcie się krukom, że nie sieją ani żną, nie mają spiżarni ani spichlerza, a Bóg je żywi; o ile bardziej wy jesteście ważniejsi niż ptaki?"
"Łk12,25": "A któż z was, troszcząc się, może dodać do swojego wzrostu jeden łokieć?"
"Łk12,26": "Jeśli więc nawet najmniejszej rzeczy nie możecie uczynić, dlaczego troszczycie się o pozostałe?"
"Łk12,27": "Przypatrzcie się liliom, jak rosną; nie trudzą się, ani nie przędą; a mówię wam: Nawet Salomon w całej swojej chwale nie był tak przyodziany, jak jedna z nich."
"Łk12,28": "Jeśli więc trawę na polu, która dziś jest, a jutro będzie w piec wrzucona, Bóg tak przyodziewa, o ile bardziej was, o małej wiary!"
"Łk12,29": "Nie pytajcie się więc, co będziecie jeść albo pić, i nie bądźcie niespokojni."
"Łk12,30": "Tego wszystkiego bowiem szukają narody świata; ale Ojciec wasz wie, że tego potrzebujecie."
"Łk12,31": "Jednak wy szukajcie Królestwa Bożego, a to wszystko będzie wam dodane."
"Łk12,32": "Nie bój się, mała trzódko! Upodobało się Ojcu waszemu dać wam Królestwo."
"Łk12,33": "Sprzedajcie swoje majętności i ofiarujcie dar miłosierdzia; sprawcie sobie sakiewki, które nie niszczeją, skarb niewyczerpany w niebiosach, gdzie złodziej nie podchodzi, i mól nie niszczy."
"Łk12,34": "Albowiem gdzie jest wasz skarb, tam będzie i wasze serce."
"Łk12,35": "Niech będą przepasane wasze biodra, i lampy zapalone."
"Łk12,36": "A wy, bądźcie podobni ludziom oczekującym swojego pana, kiedy powróci z wesela, aby kiedy przyjdzie i zapuka, zaraz mu otworzono."
"Łk12,37": "Błogosławieni ci słudzy, których pan, gdy przyjdzie, znajdzie czuwających. Zaprawdę mówię wam, że przepasze się i położy ich przy stole, i podejdzie, i będzie im służył."
"Łk12,38": "I jeśli przyszedłby podczas drugiej, lub przyszedłby podczas trzeciej straży, błogosławieni są ci słudzy, jeśli ich tak znajdzie."
"Łk12,39": "To natomiast wiedzcie, że gdyby wiedział gospodarz, o której godzinie ma przyjść złodziej, czuwałby i nie dopuściłby, aby podkopano się do jego domu."
"Łk12,40": "I wy więc bądźcie gotowi; bo Syn Człowieczy przyjdzie o godzinie, której się nie domyślacie."
"Łk12,41": "Wtedy Piotr powiedział Mu: Panie? Czy do nas mówisz to podobieństwo, czy też do wszystkich?"
"Łk12,42": "Pan natomiast powiedział: Kto zatem jest tym wiernym i roztropnym zarządcą, którego pan postawi nad swoją służbą, aby im dawał przydział zboża we właściwym czasie?"
"Łk12,43": "Błogosławiony ten sługa, którego pan jego, gdy przyjdzie, znajdzie tak czyniącego;"
"Łk12,44": "Prawdziwie mówię wam, że go postawi nad wszystkimi swoimi dobrami."
"Łk12,45": "A jeśli powiedziałby ów sługa w swoim sercu: Mój pan zwleka ze swoim przyjściem, i zacząłby bić sługi i służebnice, a jeść, pić i upijać się,"
"Łk12,46": "Przyjdzie pan owego sługi w dniu, którego nie oczekuje, i w godzinie, której nie zna, i rozetnie go, i położy dział jego z niewierzącymi."
"Łk12,47": "Ten sługa natomiast, który poznał wolę swojego pana i nie przygotował się, i nie czynił zgodnie z jego wolą, odbierze wiele razów;"
"Łk12,48": "Ten natomiast, który nie znał, a uczynił rzeczy godne batów, będzie mniej chłostany. Od każdego bowiem, komu wiele dano, wiele będzie się żądać; a komu wiele powierzono, od tego więcej będą wymagać."
"Łk12,49": "Przyszedłem ogień zrzucić na ziemię, i tego chcę, aby już zapłonął!"
"Łk12,50": "Mam też zostać zanurzony w chrzcie; i jakże jestem utrapiony, dopóki się to nie dopełni!"
"Łk12,51": "Czy wydaje się wam, że przybyłem, aby przynieść pokój na ziemi? Wcale nie, mówię wam, raczej podział."
"Łk12,52": "Albowiem od teraz będzie pięciu w jednym domu podzielonych, trzech przeciwko dwóm, i dwóch przeciwko trzem."
"Łk12,53": "Podzieleni będą: ojciec przeciwko synowi i syn przeciwko ojcu, matka przeciwko córce i córka przeciwko matce, teściowa przeciwko swojej synowej i synowa przeciwko swojej teściowej."
"Łk12,54": "I mówił do tłumów: Gdy widzicie obłok wznoszący się od zachodu, zaraz mówicie: Ulewa nadchodzi; i tak się dzieje;"
"Łk12,55": "I gdy wiatr wiejący od południa, mówicie: Będzie upał; i jest."
"Łk12,56": "Obłudnicy! Oblicze ziemi i nieba wiecie jak rozpoznawać, natomiast tego czasu nie rozpoznajecie?"
"Łk12,57": "A dlaczego sami z siebie nie osądzacie, co jest sprawiedliwe?"
"Łk12,58": "Gdy więc idziesz ze swoim przeciwnikiem do urzędnika, już w drodze zadaj sobie trud, aby uwolnić się od niego, aby cię czasem nie zaciągnął przed sędziego, a sędzia nie wydał poborcy, a poborca nie wrzucił cię do więzienia."
"Łk12,59": "Mówię ci: Nie wyjdziesz stamtąd, póki nie oddasz ostatniego leptona."
