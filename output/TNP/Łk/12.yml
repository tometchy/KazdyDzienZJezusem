"Łk12,1":
  text: "Wtedy, gdy zgromadziło się wiele tysięcy ludu, tak że jedni po drugich deptali, zaczął mówić do swoich uczniów: Przede wszystkim zważcie na zakwas faryzeuszów, którym jest obłuda."
  tags: []
"Łk12,2":
  text: "A nie ma nic zakrytego, co nie zostanie odsłonięte, i nic tajemnego, co nie byłoby poznane."
  tags: []
"Łk12,3":
  text: "Dlatego, co mówiliście w ciemności, będzie słyszane w świetle, i co szeptaliście do ucha w alkierzach, głoszone będzie na tarasach."
  tags: []
"Łk12,4":
  text: "A mówię wam, moim przyjaciołom: Nie bójcie się tych, którzy zabijają ciało, a potem nie mają już nic więcej, co mogliby uczynić."
  tags: []
"Łk12,5":
  text: "Pokażę wam natomiast, kogo macie się bać: Bójcie się Tego, który, gdy zabije, ma władzę wrzucić do Gehenny, to wam mówię, Tego się bójcie."
  tags: []
"Łk12,6":
  text: "Czyż pięciu wróbli nie sprzedają za dwa assariony? I ani jeden z nich nie jest zapomniany przed obliczem Boga."
  tags: []
"Łk12,7":
  text: "Ale i włosy na waszej głowie wszystkie są policzone. Nie bójcie się więc; więcej znaczycie niż wiele wróbli."
  tags: []
"Łk12,8":
  text: "A mówię wam: Każdy kto przyzna się do mnie przed ludźmi, do tego i Syn Człowieczy przyzna się przed aniołami Boga;"
  tags: []
"Łk12,9":
  text: "A kto wyparłby się mnie przed ludźmi, ten dozna odrzucenia przed aniołami Boga."
  tags: []
"Łk12,10":
  text: "I każdy, kto powie jakieś słowo na Syna Człowieczego, temu będzie odpuszczone; a temu, kto by bluźnił przeciwko Duchowi Świętemu, nie zostanie odpuszczone."
  tags: []
"Łk12,11":
  text: "A gdy was będą prowadzić do synagog, i przed rządzących i władze, nie martwcie się, jak macie się bronić, i co macie mówić."
  tags: []
"Łk12,12":
  text: "Duch Święty bowiem nauczy was w tej godzinie, co trzeba powiedzieć."
  tags: []
"Łk12,13":
  text: "I powiedział do Niego ktoś z ludu: Nauczycielu! Powiedz mojemu bratu, aby podzielił się ze mną dziedzictwem."
  tags: []
"Łk12,14":
  text: "A On powiedział do niego: Człowieku! Kto mnie ustanowił sędzią lub rozjemcą nad wami?"
  tags: []
"Łk12,15":
  text: "I powiedział do nich: Uważajcie i strzeżcie się chciwości, gdyż życie człowieka nie jest zależne od obfitości jego majętności."
  tags: []
"Łk12,16":
  text: "I powiedział im podobieństwo, mówiąc: U pewnego bogatego człowieka obrodziło pole."
  tags: []
"Łk12,17":
  text: "I rozważał w sobie, mówiąc: Co mam zrobić, skoro nie mam gdzie gromadzić moich plonów?"
  tags: []
"Łk12,18":
  text: "I powiedział: To uczynię: Zburzę swoje spichlerze i większe pobuduję, i zgromadzę wszystkie moje plony i wszystkie swoje dobra;"
  tags: []
"Łk12,19":
  text: "I powiem mojej duszy: Duszo! Masz wiele dóbr złożonych na wiele lat; odpocznij, jedz, pij, i bądź dobrej myśli."
  tags: []
"Łk12,20":
  text: "Ale Bóg powiedział do niego: Bezmyślny! Tej nocy zażądają od ciebie twojej duszy, a to, co przygotowałeś, czyje będzie?"
  tags: []
"Łk12,21":
  text: "Tak będzie i z tym, który dla siebie gromadzi skarby, a nie wzbogaca się u Boga."
  tags: []
"Łk12,22":
  text: "Do swoich uczniów natomiast powiedział: Dlatego mówię wam: Nie troszczcie się o swoje życie, co będziecie jeść, ani o ciało, w co się przyodziejecie."
  tags: []
"Łk12,23":
  text: "Dusza więcej znaczy niż pokarm, a ciało niż ubranie."
  tags: []
"Łk12,24":
  text: "Przyjrzyjcie się krukom, że nie sieją ani żną, nie mają spiżarni ani spichlerza, a Bóg je żywi; o ile bardziej wy jesteście ważniejsi niż ptaki?"
  tags: []
"Łk12,25":
  text: "A któż z was, troszcząc się, może dodać do swojego wzrostu jeden łokieć?"
  tags: []
"Łk12,26":
  text: "Jeśli więc nawet najmniejszej rzeczy nie możecie uczynić, dlaczego troszczycie się o pozostałe?"
  tags: []
"Łk12,27":
  text: "Przypatrzcie się liliom, jak rosną; nie trudzą się, ani nie przędą; a mówię wam: Nawet Salomon w całej swojej chwale nie był tak przyodziany, jak jedna z nich."
  tags: []
"Łk12,28":
  text: "Jeśli więc trawę na polu, która dziś jest, a jutro będzie w piec wrzucona, Bóg tak przyodziewa, o ile bardziej was, o małej wiary!"
  tags: []
"Łk12,29":
  text: "Nie pytajcie się więc, co będziecie jeść albo pić, i nie bądźcie niespokojni."
  tags: []
"Łk12,30":
  text: "Tego wszystkiego bowiem szukają narody świata; ale Ojciec wasz wie, że tego potrzebujecie."
  tags: []
"Łk12,31":
  text: "Jednak wy szukajcie Królestwa Bożego, a to wszystko będzie wam dodane."
  tags: []
"Łk12,32":
  text: "Nie bój się, mała trzódko! Upodobało się Ojcu waszemu dać wam Królestwo."
  tags: []
"Łk12,33":
  text: "Sprzedajcie swoje majętności i ofiarujcie dar miłosierdzia; sprawcie sobie sakiewki, które nie niszczeją, skarb niewyczerpany w niebiosach, gdzie złodziej nie podchodzi, i mól nie niszczy."
  tags: []
"Łk12,34":
  text: "Albowiem gdzie jest wasz skarb, tam będzie i wasze serce."
  tags: []
"Łk12,35":
  text: "Niech będą przepasane wasze biodra, i lampy zapalone."
  tags: []
"Łk12,36":
  text: "A wy, bądźcie podobni ludziom oczekującym swojego pana, kiedy powróci z wesela, aby kiedy przyjdzie i zapuka, zaraz mu otworzono."
  tags: []
"Łk12,37":
  text: "Błogosławieni ci słudzy, których pan, gdy przyjdzie, znajdzie czuwających. Zaprawdę mówię wam, że przepasze się i położy ich przy stole, i podejdzie, i będzie im służył."
  tags: []
"Łk12,38":
  text: "I jeśli przyszedłby podczas drugiej, lub przyszedłby podczas trzeciej straży, błogosławieni są ci słudzy, jeśli ich tak znajdzie."
  tags: []
"Łk12,39":
  text: "To natomiast wiedzcie, że gdyby wiedział gospodarz, o której godzinie ma przyjść złodziej, czuwałby i nie dopuściłby, aby podkopano się do jego domu."
  tags: []
"Łk12,40":
  text: "I wy więc bądźcie gotowi; bo Syn Człowieczy przyjdzie o godzinie, której się nie domyślacie."
  tags: []
"Łk12,41":
  text: "Wtedy Piotr powiedział Mu: Panie? Czy do nas mówisz to podobieństwo, czy też do wszystkich?"
  tags: []
"Łk12,42":
  text: "Pan natomiast powiedział: Kto zatem jest tym wiernym i roztropnym zarządcą, którego pan postawi nad swoją służbą, aby im dawał przydział zboża we właściwym czasie?"
  tags: []
"Łk12,43":
  text: "Błogosławiony ten sługa, którego pan jego, gdy przyjdzie, znajdzie tak czyniącego;"
  tags: []
"Łk12,44":
  text: "Prawdziwie mówię wam, że go postawi nad wszystkimi swoimi dobrami."
  tags: []
"Łk12,45":
  text: "A jeśli powiedziałby ów sługa w swoim sercu: Mój pan zwleka ze swoim przyjściem, i zacząłby bić sługi i służebnice, a jeść, pić i upijać się,"
  tags: []
"Łk12,46":
  text: "Przyjdzie pan owego sługi w dniu, którego nie oczekuje, i w godzinie, której nie zna, i rozetnie go, i położy dział jego z niewierzącymi."
  tags: []
"Łk12,47":
  text: "Ten sługa natomiast, który poznał wolę swojego pana i nie przygotował się, i nie czynił zgodnie z jego wolą, odbierze wiele razów;"
  tags: []
"Łk12,48":
  text: "Ten natomiast, który nie znał, a uczynił rzeczy godne batów, będzie mniej chłostany. Od każdego bowiem, komu wiele dano, wiele będzie się żądać; a komu wiele powierzono, od tego więcej będą wymagać."
  tags: []
"Łk12,49":
  text: "Przyszedłem ogień zrzucić na ziemię, i tego chcę, aby już zapłonął!"
  tags: []
"Łk12,50":
  text: "Mam też zostać zanurzony w chrzcie; i jakże jestem utrapiony, dopóki się to nie dopełni!"
  tags: []
"Łk12,51":
  text: "Czy wydaje się wam, że przybyłem, aby przynieść pokój na ziemi? Wcale nie, mówię wam, raczej podział."
  tags: []
"Łk12,52":
  text: "Albowiem od teraz będzie pięciu w jednym domu podzielonych, trzech przeciwko dwóm, i dwóch przeciwko trzem."
  tags: []
"Łk12,53":
  text: "Podzieleni będą: ojciec przeciwko synowi i syn przeciwko ojcu, matka przeciwko córce i córka przeciwko matce, teściowa przeciwko swojej synowej i synowa przeciwko swojej teściowej."
  tags: []
"Łk12,54":
  text: "I mówił do tłumów: Gdy widzicie obłok wznoszący się od zachodu, zaraz mówicie: Ulewa nadchodzi; i tak się dzieje;"
  tags: []
"Łk12,55":
  text: "I gdy wiatr wiejący od południa, mówicie: Będzie upał; i jest."
  tags: []
"Łk12,56":
  text: "Obłudnicy! Oblicze ziemi i nieba wiecie jak rozpoznawać, natomiast tego czasu nie rozpoznajecie?"
  tags: []
"Łk12,57":
  text: "A dlaczego sami z siebie nie osądzacie, co jest sprawiedliwe?"
  tags: []
"Łk12,58":
  text: "Gdy więc idziesz ze swoim przeciwnikiem do urzędnika, już w drodze zadaj sobie trud, aby uwolnić się od niego, aby cię czasem nie zaciągnął przed sędziego, a sędzia nie wydał poborcy, a poborca nie wrzucił cię do więzienia."
  tags: []
"Łk12,59":
  text: "Mówię ci: Nie wyjdziesz stamtąd, póki nie oddasz ostatniego leptona."
  tags: []
