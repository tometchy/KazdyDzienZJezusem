"Łk2,1":
  text: "I stało się w te dni, że wyszedł dekret od Cezara Augusta, aby spisano cały zamieszkany świat."
  tags: []
"Łk2,2":
  text: "Pierwszy ten spis odbył się, gdy Kwiryniusz był namiestnikiem Syrii."
  tags: []
"Łk2,3":
  text: "I wszyscy szli, by dać się spisać, każdy do swojego miasta."
  tags: []
"Łk2,4":
  text: "Poszedł też i Józef z Galilei, z miasta Nazaret, do ziemi judzkiej, do miasta Dawida, które nazywa się Betlejem, dlatego że był z domu i z rodu Dawida,"
  tags: []
"Łk2,5":
  text: "Aby był spisany z Marią, poślubioną mu żoną, która była w ciąży."
  tags: []
"Łk2,6":
  text: "I stało się, gdy tam byli, że wypełniły się dni, aby urodziła."
  tags: []
"Łk2,7":
  text: "I urodziła swojego pierworodnego syna, i owinęła Go w pieluszki, i położyła Go w żłobie, dlatego że nie było dla nich miejsca na kwaterze."
  tags: []
"Łk2,8":
  text: "A byli pasterze w tej krainie, którzy nocowali w polu i trzymali nocą straż nad swoim stadem."
  tags: []
"Łk2,9":
  text: "I naraz, anioł PANA stanął obok nich, a chwała PANA zewsząd ich oświeciła i ogarnął ich wielki strach."
  tags: []
"Łk2,10":
  text: "A anioł powiedział im: Nie bójcie się; bo oto ogłaszam wam dobrą nowinę o wielkiej radości, która będzie udziałem całego ludu:"
  tags: []
"Łk2,11":
  text: "Gdyż dziś został zrodzony dla was Zbawiciel, którym jest Mesjasz Pan, w mieście Dawida,"
  tags: []
"Łk2,12":
  text: "I to będzie wam znakiem: Znajdziecie niemowlę owinięte w pieluszki, leżące w żłobie."
  tags: []
"Łk2,13":
  text: "I nagle stało się, że razem z aniołem pojawiło się mnóstwo wojska niebiańskiego, które chwaliło Boga i mówiło:"
  tags: []
"Łk2,14":
  text: "Chwała na wysokościach Bogu, a na ziemi pokój, w ludziach dobrej woli."
  tags: []
"Łk2,15":
  text: "I stało się, gdy odeszli od nich aniołowie do nieba – ludzie, pasterze mówili jeden do drugiego: Udajmy się więc aż do Betlejem i zobaczmy jak spełnia się słowo, które nam PAN Bóg oznajmił."
  tags: []
"Łk2,16":
  text: "I śpiesznie przybyli, i znaleźli Marię i Józefa, i niemowlę leżące w żłobie."
  tags: []
"Łk2,17":
  text: "A gdy to zobaczyli, rozgłosili słowo, które zostało im powiedziane o tym dziecku."
  tags: []
"Łk2,18":
  text: "I wszyscy, którzy to słyszeli, dziwili się temu, co powiedzieli im pasterze."
  tags: []
"Łk2,19":
  text: "A Maria zachowywała wszystkie te słowa, rozważając je w swoim sercu."
  tags: []
"Łk2,20":
  text: "I wrócili pasterze, oddając chwałę i wielbiąc Boga za wszystko, co słyszeli i widzieli, tak, jak im zostało powiedziane."
  tags: []
"Łk2,21":
  text: "I gdy wypełniło się osiem dni, aby obrzezano dziecię, nazwano Go imieniem Jezus, tak, jak zostało nazwane przez anioła, przed poczęciem Go w łonie matki."
  tags: []
"Łk2,22":
  text: "A gdy wypełniły się dni jej oczyszczenia zgodnie z Prawem Mojżesza, przynieśli Go do Jerozolimy, by stawić Go przed PANEM,"
  tags: []
"Łk2,23":
  text: "Jak napisano w Prawie PANA: Każdy męski potomek otwierający łono zostanie nazwany poświęconym dla PANA;"
  tags: []
"Łk2,24":
  text: "I aby dać ofiarę według tego, co powiedziano w Prawie PANA: parę synogarlic lub dwa młode gołębie."
  tags: []
"Łk2,25":
  text: "A oto w Jerozolimie był człowiek o imieniu Symeon; a człowiek ten był sprawiedliwy i pobożny, wyczekujący pociechy Izraela, a Duch Święty był na nim."
  tags: []
"Łk2,26":
  text: "I zostało mu objawione przez Ducha Świętego, że nie ujrzy śmierci, zanim nie zobaczy Mesjasza PANA."
  tags: []
"Łk2,27":
  text: "I on przyszedł wiedziony w Duchu do świątyni; a gdy rodzice wnosili dziecię Jezus, aby uczynić z Nim według zwyczaju Prawa, który odnosił się do Niego,"
  tags: []
"Łk2,28":
  text: "On wziął je w swoje ramiona, wysławiał Boga i powiedział:"
  tags: []
"Łk2,29":
  text: "Teraz Władco, uwalniasz swojego sługę w pokoju, według Twojego Słowa;"
  tags: []
"Łk2,30":
  text: "Gdyż oczy moje zobaczyły Twoje zbawienie,"
  tags: []
"Łk2,31":
  text: "Które przygotowałeś przed obliczem wszystkich ludzi,"
  tags: []
"Łk2,32":
  text: "Światło objawienia dla pogan i chwałę ludu Twojego – Izraela."
  tags: []
"Łk2,33":
  text: "A Józef i Jego matka byli zdziwieni tym, co o Nim mówiono."
  tags: []
"Łk2,34":
  text: "I błogosławił im Symeon, i powiedział do Marii, Jego matki: Oto Ten jest ustanowiony na upadek i na powstanie wielu w Izraelu, i na znak, któremu się sprzeciwią."
  tags: []
"Łk2,35":
  text: "I twoją własną duszę przeszyje miecz, aby w ten sposób zostały objawione zamysły z wielu serc."
  tags: []
"Łk2,36":
  text: "I była też Anna prorokini, córka Fanuela, z plemienia Aser, która była bardzo posunięta w swoich dniach, a od czasu swojego panieństwa żyła siedem lat ze swoim mężem."
  tags: []
"Łk2,37":
  text: "A ta była wdową, mającą około osiemdziesiąt cztery lata, która nie opuszczała świątyni, w postach i w błaganiach służąc Bogu, w nocy i we dnie."
  tags: []
"Łk2,38":
  text: "Ta też, w tej godzinie stanęła obok i dziękowała PANU, i mówiła o Nim wszystkim, którzy oczekiwali odkupienia w Jerozolimie."
  tags: []
"Łk2,39":
  text: "A gdy dopełnili wszystko zgodnie z Prawem PANA, wrócili do Galilei, do swojego miasta Nazaret."
  tags: []
"Łk2,40":
  text: "A dziecko rosło i umacniało się w Duchu, będąc pełne mądrości, i łaska Boża była nad Nim."
  tags: []
"Łk2,41":
  text: "A Jego rodzice chodzili co roku do Jerozolimy na Święto Paschy."
  tags: []
"Łk2,42":
  text: "I gdy miał dwanaście lat, wstąpili do Jerozolimy według zwyczaju tego święta;"
  tags: []
"Łk2,43":
  text: "I po skończeniu tych dni, gdy wracali, pozostał chłopiec Jezus w Jerozolimie, a Józef i Jego matka o tym nie wiedzieli."
  tags: []
"Łk2,44":
  text: "A sądząc, że jest w gromadzie podróżnych, uszli dzień drogi i szukali Go między krewnymi i znajomymi."
  tags: []
"Łk2,45":
  text: "I gdy Go nie znaleźli, wrócili do Jerozolimy, nadal szukając Go."
  tags: []
"Łk2,46":
  text: "I stało się, że po trzech dniach, znaleźli Go siedzącego w świątyni pośrodku nauczycieli, gdy ich słuchał i zadawał im pytania."
  tags: []
"Łk2,47":
  text: "A zdumiewali się wszyscy, którzy Go słuchali, Jego zrozumieniem i Jego odpowiedziami."
  tags: []
"Łk2,48":
  text: "I gdy Go zobaczyli, zdziwili się. I powiedziała do Niego matka Jego: Dziecko! Dlaczego nam to uczyniłeś? Oto Twój ojciec i ja z bólem Ciebie szukaliśmy."
  tags: []
"Łk2,49":
  text: "I powiedział do nich: Dlaczego mnie szukaliście? Czy nie wiedzieliście, że ja muszę być w tym, co jest mojego Ojca?"
  tags: []
"Łk2,50":
  text: "Lecz oni nie zrozumieli tych słów, które im powiedział."
  tags: []
"Łk2,51":
  text: "I zszedł z nimi, i przyszedł do Nazaretu, i był im poddany. A matka Jego zachowywała wszystkie te słowa w swoim sercu."
  tags: []
"Łk2,52":
  text: "A Jezus wzrastał w mądrości i dojrzałości, i w łasce u Boga i ludzi."
  tags: []
