"Łk2,1": "I stało się w te dni, że wyszedł dekret od Cezara Augusta, aby spisano cały zamieszkany świat."
"Łk2,2": "Pierwszy ten spis odbył się, gdy Kwiryniusz był namiestnikiem Syrii."
"Łk2,3": "I wszyscy szli, by dać się spisać, każdy do swojego miasta."
"Łk2,4": "Poszedł też i Józef z Galilei, z miasta Nazaret, do ziemi judzkiej, do miasta Dawida, które nazywa się Betlejem, dlatego że był z domu i z rodu Dawida,"
"Łk2,5": "Aby był spisany z Marią, poślubioną mu żoną, która była w ciąży."
"Łk2,6": "I stało się, gdy tam byli, że wypełniły się dni, aby urodziła."
"Łk2,7": "I urodziła swojego pierworodnego syna, i owinęła Go w pieluszki, i położyła Go w żłobie, dlatego że nie było dla nich miejsca na kwaterze."
"Łk2,8": "A byli pasterze w tej krainie, którzy nocowali w polu i trzymali nocą straż nad swoim stadem."
"Łk2,9": "I naraz, anioł PANA stanął obok nich, a chwała PANA zewsząd ich oświeciła i ogarnął ich wielki strach."
"Łk2,10": "A anioł powiedział im: Nie bójcie się; bo oto ogłaszam wam dobrą nowinę o wielkiej radości, która będzie udziałem całego ludu:"
"Łk2,11": "Gdyż dziś został zrodzony dla was Zbawiciel, którym jest Mesjasz Pan, w mieście Dawida,"
"Łk2,12": "I to będzie wam znakiem: Znajdziecie niemowlę owinięte w pieluszki, leżące w żłobie."
"Łk2,13": "I nagle stało się, że razem z aniołem pojawiło się mnóstwo wojska niebiańskiego, które chwaliło Boga i mówiło:"
"Łk2,14": "Chwała na wysokościach Bogu, a na ziemi pokój, w ludziach dobrej woli."
"Łk2,15": "I stało się, gdy odeszli od nich aniołowie do nieba – ludzie, pasterze mówili jeden do drugiego: Udajmy się więc aż do Betlejem i zobaczmy jak spełnia się słowo, które nam PAN Bóg oznajmił."
"Łk2,16": "I śpiesznie przybyli, i znaleźli Marię i Józefa, i niemowlę leżące w żłobie."
"Łk2,17": "A gdy to zobaczyli, rozgłosili słowo, które zostało im powiedziane o tym dziecku."
"Łk2,18": "I wszyscy, którzy to słyszeli, dziwili się temu, co powiedzieli im pasterze."
"Łk2,19": "A Maria zachowywała wszystkie te słowa, rozważając je w swoim sercu."
"Łk2,20": "I wrócili pasterze, oddając chwałę i wielbiąc Boga za wszystko, co słyszeli i widzieli, tak, jak im zostało powiedziane."
"Łk2,21": "I gdy wypełniło się osiem dni, aby obrzezano dziecię, nazwano Go imieniem Jezus, tak, jak zostało nazwane przez anioła, przed poczęciem Go w łonie matki."
"Łk2,22": "A gdy wypełniły się dni jej oczyszczenia zgodnie z Prawem Mojżesza, przynieśli Go do Jerozolimy, by stawić Go przed PANEM,"
"Łk2,23": "Jak napisano w Prawie PANA: Każdy męski potomek otwierający łono zostanie nazwany poświęconym dla PANA;"
"Łk2,24": "I aby dać ofiarę według tego, co powiedziano w Prawie PANA: parę synogarlic lub dwa młode gołębie."
"Łk2,25": "A oto w Jerozolimie był człowiek o imieniu Symeon; a człowiek ten był sprawiedliwy i pobożny, wyczekujący pociechy Izraela, a Duch Święty był na nim."
"Łk2,26": "I zostało mu objawione przez Ducha Świętego, że nie ujrzy śmierci, zanim nie zobaczy Mesjasza PANA."
"Łk2,27": "I on przyszedł wiedziony w Duchu do świątyni; a gdy rodzice wnosili dziecię Jezus, aby uczynić z Nim według zwyczaju Prawa, który odnosił się do Niego,"
"Łk2,28": "On wziął je w swoje ramiona, wysławiał Boga i powiedział:"
"Łk2,29": "Teraz Władco, uwalniasz swojego sługę w pokoju, według Twojego Słowa;"
"Łk2,30": "Gdyż oczy moje zobaczyły Twoje zbawienie,"
"Łk2,31": "Które przygotowałeś przed obliczem wszystkich ludzi,"
"Łk2,32": "Światło objawienia dla pogan i chwałę ludu Twojego – Izraela."
"Łk2,33": "A Józef i Jego matka byli zdziwieni tym, co o Nim mówiono."
"Łk2,34": "I błogosławił im Symeon, i powiedział do Marii, Jego matki: Oto Ten jest ustanowiony na upadek i na powstanie wielu w Izraelu, i na znak, któremu się sprzeciwią."
"Łk2,35": "I twoją własną duszę przeszyje miecz, aby w ten sposób zostały objawione zamysły z wielu serc."
"Łk2,36": "I była też Anna prorokini, córka Fanuela, z plemienia Aser, która była bardzo posunięta w swoich dniach, a od czasu swojego panieństwa żyła siedem lat ze swoim mężem."
"Łk2,37": "A ta była wdową, mającą około osiemdziesiąt cztery lata, która nie opuszczała świątyni, w postach i w błaganiach służąc Bogu, w nocy i we dnie."
"Łk2,38": "Ta też, w tej godzinie stanęła obok i dziękowała PANU, i mówiła o Nim wszystkim, którzy oczekiwali odkupienia w Jerozolimie."
"Łk2,39": "A gdy dopełnili wszystko zgodnie z Prawem PANA, wrócili do Galilei, do swojego miasta Nazaret."
"Łk2,40": "A dziecko rosło i umacniało się w Duchu, będąc pełne mądrości, i łaska Boża była nad Nim."
"Łk2,41": "A Jego rodzice chodzili co roku do Jerozolimy na Święto Paschy."
"Łk2,42": "I gdy miał dwanaście lat, wstąpili do Jerozolimy według zwyczaju tego święta;"
"Łk2,43": "I po skończeniu tych dni, gdy wracali, pozostał chłopiec Jezus w Jerozolimie, a Józef i Jego matka o tym nie wiedzieli."
"Łk2,44": "A sądząc, że jest w gromadzie podróżnych, uszli dzień drogi i szukali Go między krewnymi i znajomymi."
"Łk2,45": "I gdy Go nie znaleźli, wrócili do Jerozolimy, nadal szukając Go."
"Łk2,46": "I stało się, że po trzech dniach, znaleźli Go siedzącego w świątyni pośrodku nauczycieli, gdy ich słuchał i zadawał im pytania."
"Łk2,47": "A zdumiewali się wszyscy, którzy Go słuchali, Jego zrozumieniem i Jego odpowiedziami."
"Łk2,48": "I gdy Go zobaczyli, zdziwili się. I powiedziała do Niego matka Jego: Dziecko! Dlaczego nam to uczyniłeś? Oto Twój ojciec i ja z bólem Ciebie szukaliśmy."
"Łk2,49": "I powiedział do nich: Dlaczego mnie szukaliście? Czy nie wiedzieliście, że ja muszę być w tym, co jest mojego Ojca?"
"Łk2,50": "Lecz oni nie zrozumieli tych słów, które im powiedział."
"Łk2,51": "I zszedł z nimi, i przyszedł do Nazaretu, i był im poddany. A matka Jego zachowywała wszystkie te słowa w swoim sercu."
"Łk2,52": "A Jezus wzrastał w mądrości i dojrzałości, i w łasce u Boga i ludzi."
