"Łk19,1": "I wszedł do Jerycha, i przechodził przez nie."
"Łk19,2": "I oto pewien mężczyzna, zwany z imienia Zacheusz, a był on przełożonym nad celnikami, i był bogaty,"
"Łk19,3": "I usilnie starał się zobaczyć Jezusa, kto to jest; i nie mógł z powodu tłumu, bo był niskiego wzrostu."
"Łk19,4": "I pobiegł naprzód, wszedł na sykomorę, aby Go zobaczyć; bo miał tamtędy przechodzić."
"Łk19,5": "A gdy Jezus przyszedł na to miejsce, spojrzał w górę; i gdy go ujrzał, powiedział do niego: Zacheuszu! Zejdź szybko, albowiem dziś muszę zatrzymać się w twoim domu."
"Łk19,6": "I zszedł pośpiesznie, i podjął Go z radością."
"Łk19,7": "A gdy wszyscy to zobaczyli, zaczęli szemrać, mówiąc: Do człowieka grzesznego przyszedł, aby spocząć w gościnie."
"Łk19,8": "Zacheusz natomiast stanął i powiedział do Pana: Panie, oto połowę swojego majątku daję ubogim, a jeśli na kimś coś wymusiłem, oddaję to w czwórnasób."
"Łk19,9": "A Jezus powiedział mu: Dziś zbawienie stało się udziałem tego domu, dlatego że i on jest synem Abrahama."
"Łk19,10": "Przyszedł bowiem Syn Człowieczy, aby odszukać i zbawić to, co zginęło."
"Łk19,11": "A gdy oni słuchali tego, dodał jeszcze to podobieństwo, dlatego że był blisko Jerozolimy, a im wydawało się, że już zaraz ma się ukazać Królestwo Boże."
"Łk19,12": "Powiedział więc: Pewien człowiek szlachetnego rodu udał się do odległej krainy, żeby objąć dla siebie królestwo i powrócić."
"Łk19,13": "I przywołał dziesięciu swoich sług, dał im dziesięć min, i powiedział do nich: Obracajcie nimi, aż przyjadę."
"Łk19,14": "Natomiast poddani jego nienawidzili go i wysłali za nim poselstwo, mówiąc: Nie chcemy, aby ten królował nad nami."
"Łk19,15": "I stało się, że on powrócił po przyjęciu królestwa, i powiedział, aby przywołano do niego te sługi, którym dał srebro, żeby się dowiedzieć, kto ile zyskał z handlu."
"Łk19,16": "Przyszedł więc pierwszy, mówiąc: Panie! Twoja mina zyskała dziesięć min."
"Łk19,17": "I powiedział mu: Dobrze, sługo dobry! Dlatego, że stałeś się wierny w najmniejszym, miej władzę nad dziesięcioma miastami."
"Łk19,18": "Przyszedł i drugi, mówiąc: Panie! Twoja mina przyniosła pięć min."
"Łk19,19": "I temu też powiedział: I ty stań nad pięcioma miastami."
"Łk19,20": "A inny przyszedł, mówiąc: Panie! Oto twoja mina, którą miałem odłożoną w chustce,"
"Łk19,21": "Bałem się bowiem ciebie, gdyż jesteś człowiekiem srogim; że podnosisz, czego nie położyłeś, i żniesz, czego nie zasiałeś."
"Łk19,22": "Wtedy powiedział mu: Na podstawie twoich słów sądzę ciebie, zły sługo! Wiedziałeś, że jestem człowiekiem srogim, podnoszę, czego nie położyłem, i żnę, czego nie zasiałem;"
"Łk19,23": "Dlaczego więc nie oddałeś mojego srebra do banku? A ja po powrocie podjąłbym je z odsetkami."
"Łk19,24": "I powiedział tym, którzy stali obok: Weźcie od niego tę minę i dajcie temu, który ma dziesięć min."
"Łk19,25": "I powiedzieli mu: Panie! Ma dziesięć min."
"Łk19,26": "Albowiem mówię wam, że każdemu, który ma, zostanie dane, a temu, który nie ma, i to, co ma, zostanie mu zabrane."
"Łk19,27": "Nadto moich nieprzyjaciół, tych, którzy nie chcieli, abym zakrólował nad nimi, przyprowadźcie tu i zabijcie ich przede mną."
"Łk19,28": "A gdy Jezus to powiedział, ruszył przodem, zmierzając do Jerozolimy."
"Łk19,29": "I stało się, gdy przybliżył się do Betfage i Betanii, ku Górze, zwanej Oliwną, że wysłał dwóch ze swoich uczniów,"
"Łk19,30": "Mówiąc: Idźcie do miasteczka, które jest przed wami, a gdy wejdziecie do niego, znajdziecie uwiązane oślę, na którym nikt z ludzi nigdy nie siedział; odwiążcie je i przyprowadźcie."
"Łk19,31": "A jeśli ktoś spytałby was, dlaczego je odwiązujecie, tak mu powiecie: Pan go potrzebuje."
"Łk19,32": "Odeszli więc ci, którzy byli wysłani, i znaleźli wszystko, jak im powiedział."
"Łk19,33": "A gdy oni odwiązywali oślę, powiedzieli jego właściciele do nich: Dlaczego odwiązujecie oślę?"
"Łk19,34": "A oni powiedzieli: Pan go potrzebuje."
"Łk19,35": "I przyprowadzili je do Jezusa, narzucili swoje szaty na oślę i posadzili na nim Jezusa."
"Łk19,36": "A gdy On jechał, ludzie słali swoje szaty na drodze."
"Łk19,37": "A gdy przybliżał się już do podnóża Góry Oliwnej, zaczęło całe mnóstwo uczniów potężnym głosem radośnie chwalić Boga za wszystkie dzieła mocy, które widzieli, mówiąc:"
"Łk19,38": "Błogosławiony król, który przychodzi w imieniu PANA! Pokój w niebie i chwała na wysokościach!"
"Łk19,39": "A jacyś z faryzeuszów spośród tłumu powiedzieli do Niego: Nauczycielu! Napomnij surowo swoich uczniów."
"Łk19,40": "A On w odpowiedzi, rzekł im: Mówię wam, że jeśli ci umilkną, krzyczeć będą kamienie."
"Łk19,41": "A gdy przybliżył się, ujrzał miasto i zapłakał nad nim, mówiąc:"
"Łk19,42": "O gdybyś i ty prawdziwie poznało, w tym dniu twoim, co prowadzi do twojego pokoju! Jednak teraz, zostało to zakryte dla twoich oczu."
"Łk19,43": "Gdyż przyjdą na ciebie dni, gdy otoczą cię twoi nieprzyjaciele wałem i oblegną cię, i ścisną cię zewsząd,"
"Łk19,44": "I powalą cię i twoje dzieci w tobie, i nie zostawią w tobie kamienia na kamieniu, dlatego żeś nie poznało czasu swojego nawiedzenia."
"Łk19,45": "A gdy wszedł do świątyni, zaczął wyganiać tych, którzy w niej sprzedawali i kupowali,"
"Łk19,46": "Mówiąc im: Napisane jest: Dom mój jest domem modlitwy, a wy uczyniliście z niego jaskinię rozbójników."
"Łk19,47": "I codziennie nauczał w świątyni; a arcykapłani i uczeni w Piśmie, i przedniejsi z ludu szukali sposobu, aby Go zniszczyć;"
"Łk19,48": "Lecz nie znajdowali nic, co mogliby Mu uczynić; albowiem cały lud wręcz zawisł na Nim, słuchając Go."
