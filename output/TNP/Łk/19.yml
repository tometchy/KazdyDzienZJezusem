"Łk19,1":
  text: "I wszedł do Jerycha, i przechodził przez nie."
  tags: []
"Łk19,2":
  text: "I oto pewien mężczyzna, zwany z imienia Zacheusz, a był on przełożonym nad celnikami, i był bogaty,"
  tags: []
"Łk19,3":
  text: "I usilnie starał się zobaczyć Jezusa, kto to jest; i nie mógł z powodu tłumu, bo był niskiego wzrostu."
  tags: []
"Łk19,4":
  text: "I pobiegł naprzód, wszedł na sykomorę, aby Go zobaczyć; bo miał tamtędy przechodzić."
  tags: []
"Łk19,5":
  text: "A gdy Jezus przyszedł na to miejsce, spojrzał w górę; i gdy go ujrzał, powiedział do niego: Zacheuszu! Zejdź szybko, albowiem dziś muszę zatrzymać się w twoim domu."
  tags: []
"Łk19,6":
  text: "I zszedł pośpiesznie, i podjął Go z radością."
  tags: []
"Łk19,7":
  text: "A gdy wszyscy to zobaczyli, zaczęli szemrać, mówiąc: Do człowieka grzesznego przyszedł, aby spocząć w gościnie."
  tags: []
"Łk19,8":
  text: "Zacheusz natomiast stanął i powiedział do Pana: Panie, oto połowę swojego majątku daję ubogim, a jeśli na kimś coś wymusiłem, oddaję to w czwórnasób."
  tags: []
"Łk19,9":
  text: "A Jezus powiedział mu: Dziś zbawienie stało się udziałem tego domu, dlatego że i on jest synem Abrahama."
  tags: []
"Łk19,10":
  text: "Przyszedł bowiem Syn Człowieczy, aby odszukać i zbawić to, co zginęło."
  tags: []
"Łk19,11":
  text: "A gdy oni słuchali tego, dodał jeszcze to podobieństwo, dlatego że był blisko Jerozolimy, a im wydawało się, że już zaraz ma się ukazać Królestwo Boże."
  tags: []
"Łk19,12":
  text: "Powiedział więc: Pewien człowiek szlachetnego rodu udał się do odległej krainy, żeby objąć dla siebie królestwo i powrócić."
  tags: []
"Łk19,13":
  text: "I przywołał dziesięciu swoich sług, dał im dziesięć min, i powiedział do nich: Obracajcie nimi, aż przyjadę."
  tags: []
"Łk19,14":
  text: "Natomiast poddani jego nienawidzili go i wysłali za nim poselstwo, mówiąc: Nie chcemy, aby ten królował nad nami."
  tags: []
"Łk19,15":
  text: "I stało się, że on powrócił po przyjęciu królestwa, i powiedział, aby przywołano do niego te sługi, którym dał srebro, żeby się dowiedzieć, kto ile zyskał z handlu."
  tags: []
"Łk19,16":
  text: "Przyszedł więc pierwszy, mówiąc: Panie! Twoja mina zyskała dziesięć min."
  tags: []
"Łk19,17":
  text: "I powiedział mu: Dobrze, sługo dobry! Dlatego, że stałeś się wierny w najmniejszym, miej władzę nad dziesięcioma miastami."
  tags: []
"Łk19,18":
  text: "Przyszedł i drugi, mówiąc: Panie! Twoja mina przyniosła pięć min."
  tags: []
"Łk19,19":
  text: "I temu też powiedział: I ty stań nad pięcioma miastami."
  tags: []
"Łk19,20":
  text: "A inny przyszedł, mówiąc: Panie! Oto twoja mina, którą miałem odłożoną w chustce,"
  tags: []
"Łk19,21":
  text: "Bałem się bowiem ciebie, gdyż jesteś człowiekiem srogim; że podnosisz, czego nie położyłeś, i żniesz, czego nie zasiałeś."
  tags: []
"Łk19,22":
  text: "Wtedy powiedział mu: Na podstawie twoich słów sądzę ciebie, zły sługo! Wiedziałeś, że jestem człowiekiem srogim, podnoszę, czego nie położyłem, i żnę, czego nie zasiałem;"
  tags: []
"Łk19,23":
  text: "Dlaczego więc nie oddałeś mojego srebra do banku? A ja po powrocie podjąłbym je z odsetkami."
  tags: []
"Łk19,24":
  text: "I powiedział tym, którzy stali obok: Weźcie od niego tę minę i dajcie temu, który ma dziesięć min."
  tags: []
"Łk19,25":
  text: "I powiedzieli mu: Panie! Ma dziesięć min."
  tags: []
"Łk19,26":
  text: "Albowiem mówię wam, że każdemu, który ma, zostanie dane, a temu, który nie ma, i to, co ma, zostanie mu zabrane."
  tags: []
"Łk19,27":
  text: "Nadto moich nieprzyjaciół, tych, którzy nie chcieli, abym zakrólował nad nimi, przyprowadźcie tu i zabijcie ich przede mną."
  tags: []
"Łk19,28":
  text: "A gdy Jezus to powiedział, ruszył przodem, zmierzając do Jerozolimy."
  tags: []
"Łk19,29":
  text: "I stało się, gdy przybliżył się do Betfage i Betanii, ku Górze, zwanej Oliwną, że wysłał dwóch ze swoich uczniów,"
  tags: []
"Łk19,30":
  text: "Mówiąc: Idźcie do miasteczka, które jest przed wami, a gdy wejdziecie do niego, znajdziecie uwiązane oślę, na którym nikt z ludzi nigdy nie siedział; odwiążcie je i przyprowadźcie."
  tags: []
"Łk19,31":
  text: "A jeśli ktoś spytałby was, dlaczego je odwiązujecie, tak mu powiecie: Pan go potrzebuje."
  tags: []
"Łk19,32":
  text: "Odeszli więc ci, którzy byli wysłani, i znaleźli wszystko, jak im powiedział."
  tags: []
"Łk19,33":
  text: "A gdy oni odwiązywali oślę, powiedzieli jego właściciele do nich: Dlaczego odwiązujecie oślę?"
  tags: []
"Łk19,34":
  text: "A oni powiedzieli: Pan go potrzebuje."
  tags: []
"Łk19,35":
  text: "I przyprowadzili je do Jezusa, narzucili swoje szaty na oślę i posadzili na nim Jezusa."
  tags: []
"Łk19,36":
  text: "A gdy On jechał, ludzie słali swoje szaty na drodze."
  tags: []
"Łk19,37":
  text: "A gdy przybliżał się już do podnóża Góry Oliwnej, zaczęło całe mnóstwo uczniów potężnym głosem radośnie chwalić Boga za wszystkie dzieła mocy, które widzieli, mówiąc:"
  tags: []
"Łk19,38":
  text: "Błogosławiony król, który przychodzi w imieniu PANA! Pokój w niebie i chwała na wysokościach!"
  tags: []
"Łk19,39":
  text: "A jacyś z faryzeuszów spośród tłumu powiedzieli do Niego: Nauczycielu! Napomnij surowo swoich uczniów."
  tags: []
"Łk19,40":
  text: "A On w odpowiedzi, rzekł im: Mówię wam, że jeśli ci umilkną, krzyczeć będą kamienie."
  tags: []
"Łk19,41":
  text: "A gdy przybliżył się, ujrzał miasto i zapłakał nad nim, mówiąc:"
  tags: []
"Łk19,42":
  text: "O gdybyś i ty prawdziwie poznało, w tym dniu twoim, co prowadzi do twojego pokoju! Jednak teraz, zostało to zakryte dla twoich oczu."
  tags: []
"Łk19,43":
  text: "Gdyż przyjdą na ciebie dni, gdy otoczą cię twoi nieprzyjaciele wałem i oblegną cię, i ścisną cię zewsząd,"
  tags: []
"Łk19,44":
  text: "I powalą cię i twoje dzieci w tobie, i nie zostawią w tobie kamienia na kamieniu, dlatego żeś nie poznało czasu swojego nawiedzenia."
  tags: []
"Łk19,45":
  text: "A gdy wszedł do świątyni, zaczął wyganiać tych, którzy w niej sprzedawali i kupowali,"
  tags: []
"Łk19,46":
  text: "Mówiąc im: Napisane jest: Dom mój jest domem modlitwy, a wy uczyniliście z niego jaskinię rozbójników."
  tags: []
"Łk19,47":
  text: "I codziennie nauczał w świątyni; a arcykapłani i uczeni w Piśmie, i przedniejsi z ludu szukali sposobu, aby Go zniszczyć;"
  tags: []
"Łk19,48":
  text: "Lecz nie znajdowali nic, co mogliby Mu uczynić; albowiem cały lud wręcz zawisł na Nim, słuchając Go."
  tags: []
