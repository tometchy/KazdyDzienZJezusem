"Łk22,1":
  text: "A zbliżało się święto Przaśników, zwane Paschą."
  tags: []
"Łk22,2":
  text: "A bojąc się ludu, arcykapłani i uczeni w Piśmie szukali sposobu jak by Go zabić;"
  tags: []
"Łk22,3":
  text: "A w Judasza, zwanego Iskariotą, jednego z grona dwunastu, wstąpił szatan."
  tags: []
"Łk22,4":
  text: "Odszedł więc i umówił się z arcykapłanami, i z przełożonymi straży, jak by Go im wydać."
  tags: []
"Łk22,5":
  text: "I uradowali się, i ułożyli się z nim, że mu dadzą srebro."
  tags: []
"Łk22,6":
  text: "A on zgodził się i szukał dogodnej chwili, aby im Go wydać z dala od tłumu."
  tags: []
"Łk22,7":
  text: "A przyszedł dzień Przaśników, w którym należało ofiarować Paschę."
  tags: []
"Łk22,8":
  text: "I wysłał Piotra i Jana, mówiąc: Idźcie i przygotujcie nam Paschę, abyśmy spożyli."
  tags: []
"Łk22,9":
  text: "A oni powiedzieli Mu: Gdzie chcesz, abyśmy ją przygotowali?"
  tags: []
"Łk22,10":
  text: "A On powiedział do nich: Oto gdy wejdziecie do miasta, wyjdzie wam na spotkanie człowiek niosący dzban wody; idźcie za nim do domu, do którego wejdzie,"
  tags: []
"Łk22,11":
  text: "I powiedzcie gospodarzowi tego domu: Nauczyciel pyta cię: Gdzie jest pokój gościnny, gdzie mógłbym spożyć Paschę ze swoimi uczniami?"
  tags: []
"Łk22,12":
  text: "A on wam wskaże duży, przygotowany pokój na piętrze; tam ją przygotujcie."
  tags: []
"Łk22,13":
  text: "Odeszli więc i znaleźli, jak im powiedział, i przygotowali Paschę."
  tags: []
"Łk22,14":
  text: "I gdy nadeszła właściwa godzina, spoczął u stołu, a z Nim dwunastu apostołów."
  tags: []
"Łk22,15":
  text: "I powiedział do nich: Gorąco pragnąłem spożyć z wami tę Paschę, przed moją męką."
  tags: []
"Łk22,16":
  text: "Albowiem mówię wam, że już więcej z pewnością nie będę z niej spożywał, aż nastąpi wypełnienie w Królestwie Boga."
  tags: []
"Łk22,17":
  text: "I wziął kielich, podziękował i rzekł: Weźcie go i rozdzielcie między siebie."
  tags: []
"Łk22,18":
  text: "Albowiem mówię wam: Nie będę odtąd pił z plonu winorośli, aż do przyjścia Królestwa Boga."
  tags: []
"Łk22,19":
  text: "I wziął chleb, podziękował, łamał i dawał im, mówiąc: To jest moje ciało, które za was jest wydawane; to czyńcie na moją pamiątkę."
  tags: []
"Łk22,20":
  text: "Podobnie i kielich, gdy było po wieczerzy, mówiąc: Ten kielich to Nowe Przymierze we krwi mojej, która za was jest wylewana."
  tags: []
"Łk22,21":
  text: "Ale oto ręka tego, który mnie wydaje, jest ze mną przy stole."
  tags: []
"Łk22,22":
  text: "A wprawdzie Syn Człowieczy odchodzi, zgodnie z tym jak jest postanowione, jednakże biada temu człowiekowi, przez którego jest wydawany!"
  tags: []
"Łk22,23":
  text: "A oni zaczęli dochodzić między sobą, kto z nich miałby to uczynić."
  tags: []
"Łk22,24":
  text: "I wszczął się też spór między nimi o to, kto z nich wydaje się być większy."
  tags: []
"Łk22,25":
  text: "A On powiedział im: Królowie narodów panują nad nimi, a którzy nad nimi sprawują władzę, są nazywani dobroczyńcami."
  tags: []
"Łk22,26":
  text: "Wy natomiast nie tak czyńcie; lecz kto większy jest wśród was, niech stanie się jak młodszy, a ten który przewodzi, jak sługa."
  tags: []
"Łk22,27":
  text: "Kto bowiem jest większy? Spoczywający przy stole czy służący? Ale ja jestem pośrodku was jak ten, co usługuje."
  tags: []
"Łk22,28":
  text: "Wy natomiast jesteście tymi, którzy wytrwali ze mną w moich próbach."
  tags: []
"Łk22,29":
  text: "I ja przekazuję wam Królestwo, jak mnie przekazał je Ojciec mój"
  tags: []
"Łk22,30":
  text: "Byście jedli i pili przy moim stole w moim Królestwie, i usiedli na tronach, sądząc dwanaście pokoleń Izraela."
  tags: []
"Łk22,31":
  text: "I powiedział Pan: Szymonie, Szymonie! Oto szatan wyprosił sobie, aby was przesiać jak pszenicę;"
  tags: []
"Łk22,32":
  text: "Ale ja prosiłem za tobą, aby nie ustała twoja wiara; a ty, gdy kiedyś się nawrócisz, utwierdź swoich braci."
  tags: []
"Łk22,33":
  text: "On natomiast powiedział do Niego: Panie! Gotów jestem iść z Tobą i do więzienia, i na śmierć."
  tags: []
"Łk22,34":
  text: "On jednak powiedział: Mówię ci, Piotrze! Z pewnością nie zapieje dzisiaj kogut, zanim trzykrotnie wyprzesz się, mówiąc, że mnie nie znasz."
  tags: []
"Łk22,35":
  text: "I powiedział im: Gdy posyłałem was bez sakiewki, bez torby i bez sandałów, czy czegoś wam brakowało? A oni powiedzieli: Niczego."
  tags: []
"Łk22,36":
  text: "Powiedział więc im: Ale teraz, kto ma sakiewkę, niech ją weźmie, podobnie i torbę; a kto nie ma miecza, niech sprzeda swoją suknię i kupi miecz."
  tags: []
"Łk22,37":
  text: "Albowiem mówię wam, że jeszcze to, co jest napisane, musi się już wypełnić na mnie: Do przestępców został zaliczony; bo dobiega końca to, co o mnie napisano."
  tags: []
"Łk22,38":
  text: "A oni powiedzieli: Panie! Oto tutaj dwa miecze. A On powiedział im: Wystarczy."
  tags: []
"Łk22,39":
  text: "I gdy wyszedł, udał się według zwyczaju na Górę Oliwną, a Jego uczniowie podążali za Nim."
  tags: []
"Łk22,40":
  text: "A gdy stanął na tym miejscu, powiedział im: Módlcie się, abyście nie weszli w próbę."
  tags: []
"Łk22,41":
  text: "A sam oddalił się od nich, jakby na rzut kamieniem, upadł na kolana i modlił się,"
  tags: []
"Łk22,42":
  text: "Mówiąc: Ojcze! Jeśli chcesz, oddal ten kielich ode mnie; jednak nie moja wola, lecz Twoja niech się stanie."
  tags: []
"Łk22,43":
  text: "Wówczas ukazał Mu się anioł z nieba, wzmacniając Go."
  tags: []
"Łk22,44":
  text: "A gdy stanął do śmiertelnego boju, jeszcze gorliwiej się modlił, a Jego pot stał się jak krople krwi spadające na ziemię."
  tags: []
"Łk22,45":
  text: "I gdy wstał od modlitwy, przyszedł do swoich uczniów i znalazł ich śpiących ze smutku."
  tags: []
"Łk22,46":
  text: "I powiedział im: Dlaczego śpicie? Wstańcie i módlcie się, abyście nie weszli w próbę."
  tags: []
"Łk22,47":
  text: "A gdy On jeszcze to mówił, oto tłum i ten, zwany Judaszem, jeden z dwunastu, szedł przed nimi, i zbliżył się do Jezusa, aby Go pocałować."
  tags: []
"Łk22,48":
  text: "A Jezus powiedział mu: Judaszu! Pocałunkiem wydajesz Syna Człowieczego?"
  tags: []
"Łk22,49":
  text: "A widząc ci, którzy byli przy Nim, na co się zanosi, powiedzieli do Niego: Panie! Czy mamy uderzyć mieczem?"
  tags: []
"Łk22,50":
  text: "I uderzył jeden z nich sługę arcykapłana, i odciął mu prawe ucho."
  tags: []
"Łk22,51":
  text: "Ale Jezus w odpowiedzi, rzekł: Dopuścicie aż do tego? I dotknął jego ucha, i go uzdrowił."
  tags: []
"Łk22,52":
  text: "Powiedział więc Jezus do arcykapłanów i do przełożonych straży świątyni, i do starszych, którzy przybyli do Niego: Jak na bandytę wyszliście z mieczami i z kijami."
  tags: []
"Łk22,53":
  text: "Gdy byłem codziennie z wami w świątyni, nie podnieśliście na mnie rąk; ale to jest wasza godzina i władza ciemności."
  tags: []
"Łk22,54":
  text: "Wtedy Go pojmali, poprowadzili i wprowadzili do domu arcykapłana; a Piotr z daleka podążał za Nim."
  tags: []
"Łk22,55":
  text: "A gdy oni na środku dziedzińca rozniecili ogień, usiedli razem i Piotr usiadł pośród nich."
  tags: []
"Łk22,56":
  text: "A gdy ujrzała go jakaś służąca, siedzącego przy ognisku, uważnie patrząc na niego, powiedziała: I ten był z Nim."
  tags: []
"Łk22,57":
  text: "On jednak wyparł się Go, mówiąc: Kobieto! Nie znam Go."
  tags: []
"Łk22,58":
  text: "A po krótkiej chwili ujrzał go ktoś inny i powiedział: I ty jesteś z nich; a Piotr powiedział: Człowieku! Nie jestem."
  tags: []
"Łk22,59":
  text: "I gdy upłynęło około godziny, ktoś inny stanowczo twierdził, mówiąc: Naprawdę i ten był z Nim; bo także jest Galilejczykiem."
  tags: []
"Łk22,60":
  text: "Piotr natomiast powiedział: Człowieku! Nie wiem o czym mówisz; i zaraz, gdy on jeszcze mówił, zapiał kogut."
  tags: []
"Łk22,61":
  text: "A Pan obrócił się i spojrzał uważnie na Piotra. I przypomniał sobie Piotr słowo Pana, jak mu powiedział: Zanim kogut zapieje, trzykrotnie mnie się wyrzekniesz."
  tags: []
"Łk22,62":
  text: "A Piotr wyszedł na zewnątrz i gorzko zapłakał."
  tags: []
"Łk22,63":
  text: "A mężczyźni, którzy trzymali Jezusa, szydzili z Niego i bili Go;"
  tags: []
"Łk22,64":
  text: "I zasłonili Mu oczy, i bijąc Go w twarz, pytali się, mówiąc: Prorokuj, kim jest ten, który Ciebie uderzył."
  tags: []
"Łk22,65":
  text: "I wiele innych bluźnierstw mówili do Niego."
  tags: []
"Łk22,66":
  text: "A gdy nastał dzień, zebrali się starsi ludu i arcykapłani, a także uczeni w Piśmie, i przyprowadzili Go przed Sanhedryn, mówiąc: Czy Ty jesteś Mesjaszem? Powiedz nam."
  tags: []
"Łk22,67":
  text: "I powiedział im: Jeśli wam powiem, nie uwierzycie;"
  tags: []
"Łk22,68":
  text: "A jeśli zapytam, nie odpowiecie mi i nie wypuścicie mnie."
  tags: []
"Łk22,69":
  text: "Od teraz Syn Człowieczy będzie siedział po prawicy mocy Boga."
  tags: []
"Łk22,70":
  text: "I powiedzieli wszyscy: Ty więc jesteś Synem Boga? A On powiedział do nich: Wy mówicie, że ja jestem Nim."
  tags: []
"Łk22,71":
  text: "A oni powiedzieli: Czy jeszcze potrzebne jest nam świadectwo? Sami je przecież usłyszeliśmy z Jego ust."
  tags: []
