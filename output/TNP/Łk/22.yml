"Łk22,1": "A zbliżało się święto Przaśników, zwane Paschą."
"Łk22,2": "A bojąc się ludu, arcykapłani i uczeni w Piśmie szukali sposobu jak by Go zabić;"
"Łk22,3": "A w Judasza, zwanego Iskariotą, jednego z grona dwunastu, wstąpił szatan."
"Łk22,4": "Odszedł więc i umówił się z arcykapłanami, i z przełożonymi straży, jak by Go im wydać."
"Łk22,5": "I uradowali się, i ułożyli się z nim, że mu dadzą srebro."
"Łk22,6": "A on zgodził się i szukał dogodnej chwili, aby im Go wydać z dala od tłumu."
"Łk22,7": "A przyszedł dzień Przaśników, w którym należało ofiarować Paschę."
"Łk22,8": "I wysłał Piotra i Jana, mówiąc: Idźcie i przygotujcie nam Paschę, abyśmy spożyli."
"Łk22,9": "A oni powiedzieli Mu: Gdzie chcesz, abyśmy ją przygotowali?"
"Łk22,10": "A On powiedział do nich: Oto gdy wejdziecie do miasta, wyjdzie wam na spotkanie człowiek niosący dzban wody; idźcie za nim do domu, do którego wejdzie,"
"Łk22,11": "I powiedzcie gospodarzowi tego domu: Nauczyciel pyta cię: Gdzie jest pokój gościnny, gdzie mógłbym spożyć Paschę ze swoimi uczniami?"
"Łk22,12": "A on wam wskaże duży, przygotowany pokój na piętrze; tam ją przygotujcie."
"Łk22,13": "Odeszli więc i znaleźli, jak im powiedział, i przygotowali Paschę."
"Łk22,14": "I gdy nadeszła właściwa godzina, spoczął u stołu, a z Nim dwunastu apostołów."
"Łk22,15": "I powiedział do nich: Gorąco pragnąłem spożyć z wami tę Paschę, przed moją męką."
"Łk22,16": "Albowiem mówię wam, że już więcej z pewnością nie będę z niej spożywał, aż nastąpi wypełnienie w Królestwie Boga."
"Łk22,17": "I wziął kielich, podziękował i rzekł: Weźcie go i rozdzielcie między siebie."
"Łk22,18": "Albowiem mówię wam: Nie będę odtąd pił z plonu winorośli, aż do przyjścia Królestwa Boga."
"Łk22,19": "I wziął chleb, podziękował, łamał i dawał im, mówiąc: To jest moje ciało, które za was jest wydawane; to czyńcie na moją pamiątkę."
"Łk22,20": "Podobnie i kielich, gdy było po wieczerzy, mówiąc: Ten kielich to Nowe Przymierze we krwi mojej, która za was jest wylewana."
"Łk22,21": "Ale oto ręka tego, który mnie wydaje, jest ze mną przy stole."
"Łk22,22": "A wprawdzie Syn Człowieczy odchodzi, zgodnie z tym jak jest postanowione, jednakże biada temu człowiekowi, przez którego jest wydawany!"
"Łk22,23": "A oni zaczęli dochodzić między sobą, kto z nich miałby to uczynić."
"Łk22,24": "I wszczął się też spór między nimi o to, kto z nich wydaje się być większy."
"Łk22,25": "A On powiedział im: Królowie narodów panują nad nimi, a którzy nad nimi sprawują władzę, są nazywani dobroczyńcami."
"Łk22,26": "Wy natomiast nie tak czyńcie; lecz kto większy jest wśród was, niech stanie się jak młodszy, a ten który przewodzi, jak sługa."
"Łk22,27": "Kto bowiem jest większy? Spoczywający przy stole czy służący? Ale ja jestem pośrodku was jak ten, co usługuje."
"Łk22,28": "Wy natomiast jesteście tymi, którzy wytrwali ze mną w moich próbach."
"Łk22,29": "I ja przekazuję wam Królestwo, jak mnie przekazał je Ojciec mój"
"Łk22,30": "Byście jedli i pili przy moim stole w moim Królestwie, i usiedli na tronach, sądząc dwanaście pokoleń Izraela."
"Łk22,31": "I powiedział Pan: Szymonie, Szymonie! Oto szatan wyprosił sobie, aby was przesiać jak pszenicę;"
"Łk22,32": "Ale ja prosiłem za tobą, aby nie ustała twoja wiara; a ty, gdy kiedyś się nawrócisz, utwierdź swoich braci."
"Łk22,33": "On natomiast powiedział do Niego: Panie! Gotów jestem iść z Tobą i do więzienia, i na śmierć."
"Łk22,34": "On jednak powiedział: Mówię ci, Piotrze! Z pewnością nie zapieje dzisiaj kogut, zanim trzykrotnie wyprzesz się, mówiąc, że mnie nie znasz."
"Łk22,35": "I powiedział im: Gdy posyłałem was bez sakiewki, bez torby i bez sandałów, czy czegoś wam brakowało? A oni powiedzieli: Niczego."
"Łk22,36": "Powiedział więc im: Ale teraz, kto ma sakiewkę, niech ją weźmie, podobnie i torbę; a kto nie ma miecza, niech sprzeda swoją suknię i kupi miecz."
"Łk22,37": "Albowiem mówię wam, że jeszcze to, co jest napisane, musi się już wypełnić na mnie: Do przestępców został zaliczony; bo dobiega końca to, co o mnie napisano."
"Łk22,38": "A oni powiedzieli: Panie! Oto tutaj dwa miecze. A On powiedział im: Wystarczy."
"Łk22,39": "I gdy wyszedł, udał się według zwyczaju na Górę Oliwną, a Jego uczniowie podążali za Nim."
"Łk22,40": "A gdy stanął na tym miejscu, powiedział im: Módlcie się, abyście nie weszli w próbę."
"Łk22,41": "A sam oddalił się od nich, jakby na rzut kamieniem, upadł na kolana i modlił się,"
"Łk22,42": "Mówiąc: Ojcze! Jeśli chcesz, oddal ten kielich ode mnie; jednak nie moja wola, lecz Twoja niech się stanie."
"Łk22,43": "Wówczas ukazał Mu się anioł z nieba, wzmacniając Go."
"Łk22,44": "A gdy stanął do śmiertelnego boju, jeszcze gorliwiej się modlił, a Jego pot stał się jak krople krwi spadające na ziemię."
"Łk22,45": "I gdy wstał od modlitwy, przyszedł do swoich uczniów i znalazł ich śpiących ze smutku."
"Łk22,46": "I powiedział im: Dlaczego śpicie? Wstańcie i módlcie się, abyście nie weszli w próbę."
"Łk22,47": "A gdy On jeszcze to mówił, oto tłum i ten, zwany Judaszem, jeden z dwunastu, szedł przed nimi, i zbliżył się do Jezusa, aby Go pocałować."
"Łk22,48": "A Jezus powiedział mu: Judaszu! Pocałunkiem wydajesz Syna Człowieczego?"
"Łk22,49": "A widząc ci, którzy byli przy Nim, na co się zanosi, powiedzieli do Niego: Panie! Czy mamy uderzyć mieczem?"
"Łk22,50": "I uderzył jeden z nich sługę arcykapłana, i odciął mu prawe ucho."
"Łk22,51": "Ale Jezus w odpowiedzi, rzekł: Dopuścicie aż do tego? I dotknął jego ucha, i go uzdrowił."
"Łk22,52": "Powiedział więc Jezus do arcykapłanów i do przełożonych straży świątyni, i do starszych, którzy przybyli do Niego: Jak na bandytę wyszliście z mieczami i z kijami."
"Łk22,53": "Gdy byłem codziennie z wami w świątyni, nie podnieśliście na mnie rąk; ale to jest wasza godzina i władza ciemności."
"Łk22,54": "Wtedy Go pojmali, poprowadzili i wprowadzili do domu arcykapłana; a Piotr z daleka podążał za Nim."
"Łk22,55": "A gdy oni na środku dziedzińca rozniecili ogień, usiedli razem i Piotr usiadł pośród nich."
"Łk22,56": "A gdy ujrzała go jakaś służąca, siedzącego przy ognisku, uważnie patrząc na niego, powiedziała: I ten był z Nim."
"Łk22,57": "On jednak wyparł się Go, mówiąc: Kobieto! Nie znam Go."
"Łk22,58": "A po krótkiej chwili ujrzał go ktoś inny i powiedział: I ty jesteś z nich; a Piotr powiedział: Człowieku! Nie jestem."
"Łk22,59": "I gdy upłynęło około godziny, ktoś inny stanowczo twierdził, mówiąc: Naprawdę i ten był z Nim; bo także jest Galilejczykiem."
"Łk22,60": "Piotr natomiast powiedział: Człowieku! Nie wiem o czym mówisz; i zaraz, gdy on jeszcze mówił, zapiał kogut."
"Łk22,61": "A Pan obrócił się i spojrzał uważnie na Piotra. I przypomniał sobie Piotr słowo Pana, jak mu powiedział: Zanim kogut zapieje, trzykrotnie mnie się wyrzekniesz."
"Łk22,62": "A Piotr wyszedł na zewnątrz i gorzko zapłakał."
"Łk22,63": "A mężczyźni, którzy trzymali Jezusa, szydzili z Niego i bili Go;"
"Łk22,64": "I zasłonili Mu oczy, i bijąc Go w twarz, pytali się, mówiąc: Prorokuj, kim jest ten, który Ciebie uderzył."
"Łk22,65": "I wiele innych bluźnierstw mówili do Niego."
"Łk22,66": "A gdy nastał dzień, zebrali się starsi ludu i arcykapłani, a także uczeni w Piśmie, i przyprowadzili Go przed Sanhedryn, mówiąc: Czy Ty jesteś Mesjaszem? Powiedz nam."
"Łk22,67": "I powiedział im: Jeśli wam powiem, nie uwierzycie;"
"Łk22,68": "A jeśli zapytam, nie odpowiecie mi i nie wypuścicie mnie."
"Łk22,69": "Od teraz Syn Człowieczy będzie siedział po prawicy mocy Boga."
"Łk22,70": "I powiedzieli wszyscy: Ty więc jesteś Synem Boga? A On powiedział do nich: Wy mówicie, że ja jestem Nim."
"Łk22,71": "A oni powiedzieli: Czy jeszcze potrzebne jest nam świadectwo? Sami je przecież usłyszeliśmy z Jego ust."
