"Łk23,1":
  text: "I gdy powstało całe to mnóstwo ludzi, zaprowadzili Go do Piłata."
  tags: []
"Łk23,2":
  text: "I zaczęli Go oskarżać, mówiąc: Tego znaleźliśmy, że odwraca naród i zakazuje dawać podatki Cezarowi, mówiąc o sobie, że jest Mesjaszem, Królem."
  tags: []
"Łk23,3":
  text: "I pytał Go Piłat, mówiąc: Ty jesteś Królem Żydów? A On w odpowiedzi, rzekł mu: Ty to mówisz."
  tags: []
"Łk23,4":
  text: "Wtedy powiedział Piłat do arcykapłanów i do tłumów: Żadnej winy w tym człowieku nie znajduję."
  tags: []
"Łk23,5":
  text: "Lecz oni jeszcze bardziej napierali, mówiąc: Podburza lud, nauczając po całej Judei; zaczął od Galilei i dotarł aż dotąd."
  tags: []
"Łk23,6":
  text: "A Piłat, słysząc o Galilei, zapytał, czy ten człowiek jest Galilejczykiem."
  tags: []
"Łk23,7":
  text: "I gdy dowiedział się, że jest podległym władzy Heroda, odesłał Go do Heroda, który także w te dni był w Jerozolimie."
  tags: []
"Łk23,8":
  text: "Herod natomiast bardzo się uradował, gdy ujrzał Jezusa; bo od dawna chciał Go zobaczyć, dlatego że wiele o Nim słyszał i miał nadzieję, iż zobaczy jakiś cudowny znak, który dokona się przez Niego."
  tags: []
"Łk23,9":
  text: "I zadawał Mu wiele pytań; ale On nic mu nie odpowiedział."
  tags: []
"Łk23,10":
  text: "A stali tam arcykapłani i uczeni w Piśmie, gwałtownie Go oskarżając."
  tags: []
"Łk23,11":
  text: "Herod natomiast ze swoimi żołnierzami okazał Mu pogardę i wyszydził Go, oblekł w lśniącą szatę i odesłał Go z powrotem do Piłata."
  tags: []
"Łk23,12":
  text: "I stali się Piłat i Herod w tym dniu przyjaciółmi, wcześniej bowiem byli sobie wrogami."
  tags: []
"Łk23,13":
  text: "A Piłat, zwołał arcykapłanów, przełożonych i lud,"
  tags: []
"Łk23,14":
  text: "I powiedział do nich: Przyprowadziliście do mnie tego człowieka, jako zwodziciela ludu; i oto ja po przesłuchaniu Go wobec was, nie znalazłem w tym człowieku żadnej winy, o którą Go oskarżacie,"
  tags: []
"Łk23,15":
  text: "Ani też Herod, albowiem odesłałem was do niego; otóż nie uczynił On nic takiego, co zasługiwałoby na śmierć."
  tags: []
"Łk23,16":
  text: "Dlatego ukarzę Go i wypuszczę."
  tags: []
"Łk23,17":
  text: "A musiał im Piłat wypuszczać jednego co święto."
  tags: []
"Łk23,18":
  text: "I krzyczeli więc wszyscy razem, mówiąc: Usuń tego, a wypuść nam Barabasza!"
  tags: []
"Łk23,19":
  text: "Który był wtrącony do więzienia z powodu jakiegoś rozruchu w mieście i morderstwa."
  tags: []
"Łk23,20":
  text: "Piłat więc ponownie przemówił do nich, chcąc uwolnić Jezusa."
  tags: []
"Łk23,21":
  text: "Ale oni wołali, mówiąc: Ukrzyżuj, ukrzyżuj Go!"
  tags: []
"Łk23,22":
  text: "A on po raz trzeci powiedział do nich: Co więc złego Ten uczynił? Nie znalazłem w Nim żadnej z win, z powodu których zasługiwałby na śmierć; dlatego ukarzę Go i wypuszczę."
  tags: []
"Łk23,23":
  text: "A oni jednak nalegali donośnym głosem, domagając się, aby On został ukrzyżowany; a krzyki ich i arcykapłanów przybierały na sile."
  tags: []
"Łk23,24":
  text: "Piłat orzekł więc, aby stało się według ich żądania;"
  tags: []
"Łk23,25":
  text: "I wypuścił im tego, który był wtrącony do więzienia za rozruch i morderstwo, o którego prosili; a Jezusa zdał na ich wolę."
  tags: []
"Łk23,26":
  text: "I gdy Go odprowadzali, pochwycili niejakiego Szymona Cyrenejczyka, który szedł z pola, włożyli na niego krzyż, aby go niósł za Jezusem."
  tags: []
"Łk23,27":
  text: "A szły za Nim wielkie rzesze ludu i kobiet, które uderzały się w piersi i lamentowały nad Nim."
  tags: []
"Łk23,28":
  text: "A Jezus, obrócił się do nich i powiedział: Córki Jerozolimy! Nie płaczcie nade mną, tylko płaczcie nad sobą i nad swoimi dziećmi."
  tags: []
"Łk23,29":
  text: "Oto bowiem nadchodzą dni, kiedy będą mówić: Błogosławione niepłodne i łona, które nie rodziły i piersi, które nie karmiły."
  tags: []
"Łk23,30":
  text: "Wtedy zaczną mówić do gór: Padnijcie na nas! A do wzgórz: Przykryjcie nas!"
  tags: []
"Łk23,31":
  text: "Bo jeśli z zielonym drzewem te rzeczy czynią, to co stanie się z suchym?"
  tags: []
"Łk23,32":
  text: "Prowadzeni byli też i dwaj inni przestępcy, aby razem z Nim zostali straceni."
  tags: []
"Łk23,33":
  text: "I gdy przyszli na miejsce, zwane Czaszką, tam Go ukrzyżowali i przestępców, jednego z prawej, a drugiego z lewej strony."
  tags: []
"Łk23,34":
  text: "A Jezus mówił: Ojcze! Odpuść im, bo nie wiedzą, co czynią. A gdy rozdarli Jego szaty, rzucili o nie los."
  tags: []
"Łk23,35":
  text: "A lud stał i przypatrywał się, a razem z nimi przywódcy, którzy naśmiewali się z Niego, mówiąc: Innych ratował, niech ratuje samego siebie, jeśli Ten jest Mesjaszem – wybranym przez Boga."
  tags: []
"Łk23,36":
  text: "Naśmiewali się też z Niego i żołnierze, podchodząc i podając Mu kwaśne wino,"
  tags: []
"Łk23,37":
  text: "Mówiąc: Jeśli Ty jesteś Królem Żydów, ratuj samego siebie."
  tags: []
"Łk23,38":
  text: "Nad Nim natomiast był napis, wyryty literami greckimi i łacińskimi, i hebrajskimi: Ten jest Królem Żydów."
  tags: []
"Łk23,39":
  text: "A jeden z powieszonych przestępców bluźnił Mu, mówiąc: Jeśli Ty jesteś Mesjaszem, ratuj samego siebie i nas."
  tags: []
"Łk23,40":
  text: "A odpowiadając, drugi gromił go, mówiąc: Czy ty Boga się nie boisz, choć taki sam wyrok ciąży na tobie?"
  tags: []
"Łk23,41":
  text: "My wprawdzie sprawiedliwy, bo słusznie odbieramy karę za to, co uczyniliśmy, ale Ten nie uczynił nic niegodziwego."
  tags: []
"Łk23,42":
  text: "I powiedział: Jezusie, Panie! Wspomnij na mnie, gdy przyjdziesz do swojego Królestwa."
  tags: []
"Łk23,43":
  text: "I Jezus powiedział mu: Zaprawdę, mówię ci dziś będziesz ze mną w raju."
  tags: []
"Łk23,44":
  text: "A było około szóstej godziny, i stała się ciemność na całej ziemi aż do godziny dziewiątej."
  tags: []
"Łk23,45":
  text: "I słońce się zaćmiło, a zasłona w świątyni została rozdarta przez środek."
  tags: []
"Łk23,46":
  text: "A Jezus zawołał potężnym głosem, mówiąc: Ojcze! W Twoje ręce składam mojego ducha; a gdy to powiedział, wydał ostatnie tchnienie."
  tags: []
"Łk23,47":
  text: "A setnik widząc to, co się działo, oddał chwałę Bogu, mówiąc: Istotnie, ten człowiek był sprawiedliwy."
  tags: []
"Łk23,48":
  text: "I wszystkie tłumy, które zeszły się razem na to widowisko, widząc co się stało, wracały bijąc się w swoje piersi."
  tags: []
"Łk23,49":
  text: "I stali z daleka wszyscy, którzy Go znali, i kobiety, które współtowarzyszyły Mu od Galilei, patrzące na to."
  tags: []
"Łk23,50":
  text: "A oto mąż, imieniem Józef, który był członkiem Rady, mąż dobry i sprawiedliwy,"
  tags: []
"Łk23,51":
  text: "Z Arymatei, miasta Judei, który też sam oczekiwał Królestwa Bożego, który nie głosował za postanowieniem Rady i ich czynem,"
  tags: []
"Łk23,52":
  text: "Ten udał się do Piłata i prosił o ciało Jezusa."
  tags: []
"Łk23,53":
  text: "I zdjął je, owinął w płótno i złożył je w grobowcu wykutym w skale, w którym nikt jeszcze nigdy nie był złożony."
  tags: []
"Łk23,54":
  text: "A był to Dzień Przygotowania, i nastawał szabat."
  tags: []
"Łk23,55":
  text: "A poszły za nim i kobiety, które razem z Jezusem przyszły z Galilei, oglądając grobowiec i jak zostało położone Jego ciało."
  tags: []
"Łk23,56":
  text: "A gdy wróciły, przygotowały wonności i olejki; a w szabat oczywiście odpoczęły według przykazania."
  tags: []
