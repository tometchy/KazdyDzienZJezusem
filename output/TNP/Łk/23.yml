"Łk23,1": "I gdy powstało całe to mnóstwo ludzi, zaprowadzili Go do Piłata."
"Łk23,2": "I zaczęli Go oskarżać, mówiąc: Tego znaleźliśmy, że odwraca naród i zakazuje dawać podatki Cezarowi, mówiąc o sobie, że jest Mesjaszem, Królem."
"Łk23,3": "I pytał Go Piłat, mówiąc: Ty jesteś Królem Żydów? A On w odpowiedzi, rzekł mu: Ty to mówisz."
"Łk23,4": "Wtedy powiedział Piłat do arcykapłanów i do tłumów: Żadnej winy w tym człowieku nie znajduję."
"Łk23,5": "Lecz oni jeszcze bardziej napierali, mówiąc: Podburza lud, nauczając po całej Judei; zaczął od Galilei i dotarł aż dotąd."
"Łk23,6": "A Piłat, słysząc o Galilei, zapytał, czy ten człowiek jest Galilejczykiem."
"Łk23,7": "I gdy dowiedział się, że jest podległym władzy Heroda, odesłał Go do Heroda, który także w te dni był w Jerozolimie."
"Łk23,8": "Herod natomiast bardzo się uradował, gdy ujrzał Jezusa; bo od dawna chciał Go zobaczyć, dlatego że wiele o Nim słyszał i miał nadzieję, iż zobaczy jakiś cudowny znak, który dokona się przez Niego."
"Łk23,9": "I zadawał Mu wiele pytań; ale On nic mu nie odpowiedział."
"Łk23,10": "A stali tam arcykapłani i uczeni w Piśmie, gwałtownie Go oskarżając."
"Łk23,11": "Herod natomiast ze swoimi żołnierzami okazał Mu pogardę i wyszydził Go, oblekł w lśniącą szatę i odesłał Go z powrotem do Piłata."
"Łk23,12": "I stali się Piłat i Herod w tym dniu przyjaciółmi, wcześniej bowiem byli sobie wrogami."
"Łk23,13": "A Piłat, zwołał arcykapłanów, przełożonych i lud,"
"Łk23,14": "I powiedział do nich: Przyprowadziliście do mnie tego człowieka, jako zwodziciela ludu; i oto ja po przesłuchaniu Go wobec was, nie znalazłem w tym człowieku żadnej winy, o którą Go oskarżacie,"
"Łk23,15": "Ani też Herod, albowiem odesłałem was do niego; otóż nie uczynił On nic takiego, co zasługiwałoby na śmierć."
"Łk23,16": "Dlatego ukarzę Go i wypuszczę."
"Łk23,17": "A musiał im Piłat wypuszczać jednego co święto."
"Łk23,18": "I krzyczeli więc wszyscy razem, mówiąc: Usuń tego, a wypuść nam Barabasza!"
"Łk23,19": "Który był wtrącony do więzienia z powodu jakiegoś rozruchu w mieście i morderstwa."
"Łk23,20": "Piłat więc ponownie przemówił do nich, chcąc uwolnić Jezusa."
"Łk23,21": "Ale oni wołali, mówiąc: Ukrzyżuj, ukrzyżuj Go!"
"Łk23,22": "A on po raz trzeci powiedział do nich: Co więc złego Ten uczynił? Nie znalazłem w Nim żadnej z win, z powodu których zasługiwałby na śmierć; dlatego ukarzę Go i wypuszczę."
"Łk23,23": "A oni jednak nalegali donośnym głosem, domagając się, aby On został ukrzyżowany; a krzyki ich i arcykapłanów przybierały na sile."
"Łk23,24": "Piłat orzekł więc, aby stało się według ich żądania;"
"Łk23,25": "I wypuścił im tego, który był wtrącony do więzienia za rozruch i morderstwo, o którego prosili; a Jezusa zdał na ich wolę."
"Łk23,26": "I gdy Go odprowadzali, pochwycili niejakiego Szymona Cyrenejczyka, który szedł z pola, włożyli na niego krzyż, aby go niósł za Jezusem."
"Łk23,27": "A szły za Nim wielkie rzesze ludu i kobiet, które uderzały się w piersi i lamentowały nad Nim."
"Łk23,28": "A Jezus, obrócił się do nich i powiedział: Córki Jerozolimy! Nie płaczcie nade mną, tylko płaczcie nad sobą i nad swoimi dziećmi."
"Łk23,29": "Oto bowiem nadchodzą dni, kiedy będą mówić: Błogosławione niepłodne i łona, które nie rodziły i piersi, które nie karmiły."
"Łk23,30": "Wtedy zaczną mówić do gór: Padnijcie na nas! A do wzgórz: Przykryjcie nas!"
"Łk23,31": "Bo jeśli z zielonym drzewem te rzeczy czynią, to co stanie się z suchym?"
"Łk23,32": "Prowadzeni byli też i dwaj inni przestępcy, aby razem z Nim zostali straceni."
"Łk23,33": "I gdy przyszli na miejsce, zwane Czaszką, tam Go ukrzyżowali i przestępców, jednego z prawej, a drugiego z lewej strony."
"Łk23,34": "A Jezus mówił: Ojcze! Odpuść im, bo nie wiedzą, co czynią. A gdy rozdarli Jego szaty, rzucili o nie los."
"Łk23,35": "A lud stał i przypatrywał się, a razem z nimi przywódcy, którzy naśmiewali się z Niego, mówiąc: Innych ratował, niech ratuje samego siebie, jeśli Ten jest Mesjaszem – wybranym przez Boga."
"Łk23,36": "Naśmiewali się też z Niego i żołnierze, podchodząc i podając Mu kwaśne wino,"
"Łk23,37": "Mówiąc: Jeśli Ty jesteś Królem Żydów, ratuj samego siebie."
"Łk23,38": "Nad Nim natomiast był napis, wyryty literami greckimi i łacińskimi, i hebrajskimi: Ten jest Królem Żydów."
"Łk23,39": "A jeden z powieszonych przestępców bluźnił Mu, mówiąc: Jeśli Ty jesteś Mesjaszem, ratuj samego siebie i nas."
"Łk23,40": "A odpowiadając, drugi gromił go, mówiąc: Czy ty Boga się nie boisz, choć taki sam wyrok ciąży na tobie?"
"Łk23,41": "My wprawdzie sprawiedliwy, bo słusznie odbieramy karę za to, co uczyniliśmy, ale Ten nie uczynił nic niegodziwego."
"Łk23,42": "I powiedział: Jezusie, Panie! Wspomnij na mnie, gdy przyjdziesz do swojego Królestwa."
"Łk23,43": "I Jezus powiedział mu: Zaprawdę, mówię ci dziś będziesz ze mną w raju."
"Łk23,44": "A było około szóstej godziny, i stała się ciemność na całej ziemi aż do godziny dziewiątej."
"Łk23,45": "I słońce się zaćmiło, a zasłona w świątyni została rozdarta przez środek."
"Łk23,46": "A Jezus zawołał potężnym głosem, mówiąc: Ojcze! W Twoje ręce składam mojego ducha; a gdy to powiedział, wydał ostatnie tchnienie."
"Łk23,47": "A setnik widząc to, co się działo, oddał chwałę Bogu, mówiąc: Istotnie, ten człowiek był sprawiedliwy."
"Łk23,48": "I wszystkie tłumy, które zeszły się razem na to widowisko, widząc co się stało, wracały bijąc się w swoje piersi."
"Łk23,49": "I stali z daleka wszyscy, którzy Go znali, i kobiety, które współtowarzyszyły Mu od Galilei, patrzące na to."
"Łk23,50": "A oto mąż, imieniem Józef, który był członkiem Rady, mąż dobry i sprawiedliwy,"
"Łk23,51": "Z Arymatei, miasta Judei, który też sam oczekiwał Królestwa Bożego, który nie głosował za postanowieniem Rady i ich czynem,"
"Łk23,52": "Ten udał się do Piłata i prosił o ciało Jezusa."
"Łk23,53": "I zdjął je, owinął w płótno i złożył je w grobowcu wykutym w skale, w którym nikt jeszcze nigdy nie był złożony."
"Łk23,54": "A był to Dzień Przygotowania, i nastawał szabat."
"Łk23,55": "A poszły za nim i kobiety, które razem z Jezusem przyszły z Galilei, oglądając grobowiec i jak zostało położone Jego ciało."
"Łk23,56": "A gdy wróciły, przygotowały wonności i olejki; a w szabat oczywiście odpoczęły według przykazania."
