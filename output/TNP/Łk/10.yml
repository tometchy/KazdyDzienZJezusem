"Łk10,1":
  text: "A potem wyznaczył Pan i innych siedemdziesięciu, i wysłał ich po dwóch przed sobą do każdego miasta i miejsca, do którego sam miał przyjść."
  tags: []
"Łk10,2":
  text: "I mówił im: Żniwo wprawdzie wielkie, ale robotników mało; proście więc Pana żniwa, aby wypychał robotników na swoje żniwo."
  tags: []
"Łk10,3":
  text: "Idźcie; oto ja posyłam was jak jagnięta w sam środek wilków."
  tags: []
"Łk10,4":
  text: "Nie noście ze sobą sakiewki, torby, ani sandałów, i nikogo w drodze nie pozdrawiajcie."
  tags: []
"Łk10,5":
  text: "A do jakiegokolwiek domu wejdziecie, najpierw mówcie: Pokój temu domowi."
  tags: []
"Łk10,6":
  text: "I jeśli tam rzeczywiście będzie syn pokoju, spocznie na nim wasz pokój; a jeśli nie, wróci do was."
  tags: []
"Łk10,7":
  text: "A w tym domu pozostańcie, jedząc i pijąc u nich, albowiem godny jest robotnik swojej zapłaty; nie przechodźcie z domu do domu."
  tags: []
"Łk10,8":
  text: "A gdy wejdziecie do jakiegoś miasta, a tam was przyjmą, jedzcie to, co wam podadzą;"
  tags: []
"Łk10,9":
  text: "I uzdrawiajcie w nim chorych, i mówcie im: Przybliżyło się do was Królestwo Boże."
  tags: []
"Łk10,10":
  text: "A gdy wejdziecie do jakiegoś miasta, a tam nie przyjmą was, wyjdźcie na jego ulice i powiedzcie:"
  tags: []
"Łk10,11":
  text: "Nawet pył, który przylgnął do nas z waszego miasta, na was strząsamy; ale wiedzcie to, że przybliżyło się do was Królestwo Boże."
  tags: []
"Łk10,12":
  text: "A mówię wam, że w owym dniu lżej będzie Sodomie, niż temu miastu."
  tags: []
"Łk10,13":
  text: "Biada tobie, Chorazynie! Biada tobie, Betsaido! Bo gdyby w Tyrze i w Sydonie dokonały się te dzieła mocy, które dokonały się wśród was, dawno by w worze i w popiele siedząc, upamiętały się."
  tags: []
"Łk10,14":
  text: "Dlatego Tyrowi i Sydonowi lżej będzie na sądzie, niż wam."
  tags: []
"Łk10,15":
  text: "A ty, Kafarnaum, aż do nieba będąc wywyższone, aż do Hadesu zostaniesz strącone."
  tags: []
"Łk10,16":
  text: "Kto was słucha, mnie słucha; a kto was odrzuca, mnie odrzuca; a kto mnie odrzuca, odrzuca Tego, który mnie posłał."
  tags: []
"Łk10,17":
  text: "I wróciło owych siedemdziesięciu z radością, mówiąc: Panie! W Twoim imieniu demony są nam podległe."
  tags: []
"Łk10,18":
  text: "A wtedy powiedział im: Widziałem jak szatan niby błyskawica spadł z nieba."
  tags: []
"Łk10,19":
  text: "Oto daję wam władzę, abyście deptali po wężach i po skorpionach, i po całej mocy nieprzyjaciela, a nic wam na pewno nie wyrządzi krzywdy."
  tags: []
"Łk10,20":
  text: "Jednak nie radujcie się z tego, że duchy są wam poddane; ale radujcie się raczej z tego, że imiona wasze zostały zapisane w niebiosach."
  tags: []
"Łk10,21":
  text: "W tej właśnie godzinie rozradował się Jezus w duchu i powiedział: Wyznaję Ojcze, PANIE nieba i ziemi, że zakryłeś te rzeczy przed mądrymi i roztropnymi, a objawiłeś je niemowlętom! Tak, Ojcze – gdyż uznałeś to za dobre przed Tobą."
  tags: []
"Łk10,22":
  text: "Wszystko zostało mi przekazane od Ojca mojego; i nikt nie wie, kim jest Syn, tylko Ojciec, i kim jest Ojciec, tylko Syn, i ten, komu Syn zechce to objawić."
  tags: []
"Łk10,23":
  text: "Wtedy odwrócił się do uczniów i na osobności powiedział im: Błogosławione oczy, które widzą to, co wy widzicie."
  tags: []
"Łk10,24":
  text: "Bo mówię wam, że wielu proroków i królów chciało widzieć to, co wy widzicie, a nie widzieli; i słyszeć to, co wy słyszycie, a nie słyszeli."
  tags: []
"Łk10,25":
  text: "I oto powstał pewien znawca Prawa, wystawiając Go na próbę, pytał: Nauczycielu! Co mam czynić, abym odziedziczył życie wieczne?"
  tags: []
"Łk10,26":
  text: "A On powiedział do niego: Co zostało napisane w Prawie? Jak czytasz?"
  tags: []
"Łk10,27":
  text: "A on w odpowiedzi, rzekł: Będziesz miłował PANA, Boga twojego, z całego swojego serca, i z całej swojej duszy, i z całej swojej siły, i z całej swojej myśli; a swojego bliźniego – jak samego siebie."
  tags: []
"Łk10,28":
  text: "I powiedział mu: Dobrze odpowiedziałeś; to czyń, a będziesz żył."
  tags: []
"Łk10,29":
  text: "A on, chcąc samego siebie usprawiedliwić, powiedział do Jezusa: A kto jest moim bliźnim?"
  tags: []
"Łk10,30":
  text: "A Jezus, nawiązując do tego, powiedział: Pewien człowiek schodził z Jerozolimy do Jerycha i wpadł w ręce bandytów, którzy go obdarli i zadali mu ciosy, odeszli, zostawiając go losowi na pół umarłego."
  tags: []
"Łk10,31":
  text: "A przez przypadek schodził tą drogą pewien kapłan, a gdy go zobaczył, przeszedł na drugą stronę."
  tags: []
"Łk10,32":
  text: "Podobnie i Lewita, który zjawił się na tym miejscu, podszedł, a gdy go zobaczył, przeszedł na drugą stronę."
  tags: []
"Łk10,33":
  text: "Natomiast pewien Samarytanin podróżując, przechodził obok niego i gdy go zobaczył, zlitował się."
  tags: []
"Łk10,34":
  text: "I gdy przystąpił, owinął jego rany, polewając je oliwą i winem, i wsadził go na swoje zwierzę, przyprowadził go do gospody i zaopiekował się nim."
  tags: []
"Łk10,35":
  text: "A nazajutrz, gdy wyruszał, wyjął dwa denary i dał gospodarzowi zajazdu, mówiąc do niego: Otocz go opieką, a cokolwiek ponad to wydasz, ja, gdy wrócę, oddam ci."
  tags: []
"Łk10,36":
  text: "Jak ci się wydaje, który więc z tych trzech, był bliźnim tego, który wpadł w ręce bandytów?"
  tags: []
"Łk10,37":
  text: "A on powiedział: Ten, który mu okazał miłosierdzie. Powiedział więc mu Jezus: Idź, i ty czyń podobnie."
  tags: []
"Łk10,38":
  text: "I stało się, gdy oni szli, że On wszedł do jednego miasteczka, a pewna kobieta o imieniu Marta, ugościła Go w swoim domu."
  tags: []
"Łk10,39":
  text: "Miała ona siostrę, która nazywała się Maria; ta przysiadła u stóp Jezusa i słuchała Jego słowa."
  tags: []
"Łk10,40":
  text: "Ale Marta zajęta była przy wielu posługach, przystąpiła więc i powiedziała: Panie! Czy nie obchodzi Cię to, że moja siostra zostawiła mnie samą, abym usługiwała? Powiedz więc jej, aby mnie wsparła."
  tags: []
"Łk10,41":
  text: "A Jezus w odpowiedzi, rzekł jej: Marto, Marto, troszczysz i kłopoczesz się o wiele;"
  tags: []
"Łk10,42":
  text: "A tylko jedno jest potrzebne. A Maria dobrą cząstkę wybrała, która nie będzie jej odjęta."
  tags: []
