"Łk10,1": "A potem wyznaczył Pan i innych siedemdziesięciu, i wysłał ich po dwóch przed sobą do każdego miasta i miejsca, do którego sam miał przyjść."
"Łk10,2": "I mówił im: Żniwo wprawdzie wielkie, ale robotników mało; proście więc Pana żniwa, aby wypychał robotników na swoje żniwo."
"Łk10,3": "Idźcie; oto ja posyłam was jak jagnięta w sam środek wilków."
"Łk10,4": "Nie noście ze sobą sakiewki, torby, ani sandałów, i nikogo w drodze nie pozdrawiajcie."
"Łk10,5": "A do jakiegokolwiek domu wejdziecie, najpierw mówcie: Pokój temu domowi."
"Łk10,6": "I jeśli tam rzeczywiście będzie syn pokoju, spocznie na nim wasz pokój; a jeśli nie, wróci do was."
"Łk10,7": "A w tym domu pozostańcie, jedząc i pijąc u nich, albowiem godny jest robotnik swojej zapłaty; nie przechodźcie z domu do domu."
"Łk10,8": "A gdy wejdziecie do jakiegoś miasta, a tam was przyjmą, jedzcie to, co wam podadzą;"
"Łk10,9": "I uzdrawiajcie w nim chorych, i mówcie im: Przybliżyło się do was Królestwo Boże."
"Łk10,10": "A gdy wejdziecie do jakiegoś miasta, a tam nie przyjmą was, wyjdźcie na jego ulice i powiedzcie:"
"Łk10,11": "Nawet pył, który przylgnął do nas z waszego miasta, na was strząsamy; ale wiedzcie to, że przybliżyło się do was Królestwo Boże."
"Łk10,12": "A mówię wam, że w owym dniu lżej będzie Sodomie, niż temu miastu."
"Łk10,13": "Biada tobie, Chorazynie! Biada tobie, Betsaido! Bo gdyby w Tyrze i w Sydonie dokonały się te dzieła mocy, które dokonały się wśród was, dawno by w worze i w popiele siedząc, upamiętały się."
"Łk10,14": "Dlatego Tyrowi i Sydonowi lżej będzie na sądzie, niż wam."
"Łk10,15": "A ty, Kafarnaum, aż do nieba będąc wywyższone, aż do Hadesu zostaniesz strącone."
"Łk10,16": "Kto was słucha, mnie słucha; a kto was odrzuca, mnie odrzuca; a kto mnie odrzuca, odrzuca Tego, który mnie posłał."
"Łk10,17": "I wróciło owych siedemdziesięciu z radością, mówiąc: Panie! W Twoim imieniu demony są nam podległe."
"Łk10,18": "A wtedy powiedział im: Widziałem jak szatan niby błyskawica spadł z nieba."
"Łk10,19": "Oto daję wam władzę, abyście deptali po wężach i po skorpionach, i po całej mocy nieprzyjaciela, a nic wam na pewno nie wyrządzi krzywdy."
"Łk10,20": "Jednak nie radujcie się z tego, że duchy są wam poddane; ale radujcie się raczej z tego, że imiona wasze zostały zapisane w niebiosach."
"Łk10,21": "W tej właśnie godzinie rozradował się Jezus w duchu i powiedział: Wyznaję Ojcze, PANIE nieba i ziemi, że zakryłeś te rzeczy przed mądrymi i roztropnymi, a objawiłeś je niemowlętom! Tak, Ojcze – gdyż uznałeś to za dobre przed Tobą."
"Łk10,22": "Wszystko zostało mi przekazane od Ojca mojego; i nikt nie wie, kim jest Syn, tylko Ojciec, i kim jest Ojciec, tylko Syn, i ten, komu Syn zechce to objawić."
"Łk10,23": "Wtedy odwrócił się do uczniów i na osobności powiedział im: Błogosławione oczy, które widzą to, co wy widzicie."
"Łk10,24": "Bo mówię wam, że wielu proroków i królów chciało widzieć to, co wy widzicie, a nie widzieli; i słyszeć to, co wy słyszycie, a nie słyszeli."
"Łk10,25": "I oto powstał pewien znawca Prawa, wystawiając Go na próbę, pytał: Nauczycielu! Co mam czynić, abym odziedziczył życie wieczne?"
"Łk10,26": "A On powiedział do niego: Co zostało napisane w Prawie? Jak czytasz?"
"Łk10,27": "A on w odpowiedzi, rzekł: Będziesz miłował PANA, Boga twojego, z całego swojego serca, i z całej swojej duszy, i z całej swojej siły, i z całej swojej myśli; a swojego bliźniego – jak samego siebie."
"Łk10,28": "I powiedział mu: Dobrze odpowiedziałeś; to czyń, a będziesz żył."
"Łk10,29": "A on, chcąc samego siebie usprawiedliwić, powiedział do Jezusa: A kto jest moim bliźnim?"
"Łk10,30": "A Jezus, nawiązując do tego, powiedział: Pewien człowiek schodził z Jerozolimy do Jerycha i wpadł w ręce bandytów, którzy go obdarli i zadali mu ciosy, odeszli, zostawiając go losowi na pół umarłego."
"Łk10,31": "A przez przypadek schodził tą drogą pewien kapłan, a gdy go zobaczył, przeszedł na drugą stronę."
"Łk10,32": "Podobnie i Lewita, który zjawił się na tym miejscu, podszedł, a gdy go zobaczył, przeszedł na drugą stronę."
"Łk10,33": "Natomiast pewien Samarytanin podróżując, przechodził obok niego i gdy go zobaczył, zlitował się."
"Łk10,34": "I gdy przystąpił, owinął jego rany, polewając je oliwą i winem, i wsadził go na swoje zwierzę, przyprowadził go do gospody i zaopiekował się nim."
"Łk10,35": "A nazajutrz, gdy wyruszał, wyjął dwa denary i dał gospodarzowi zajazdu, mówiąc do niego: Otocz go opieką, a cokolwiek ponad to wydasz, ja, gdy wrócę, oddam ci."
"Łk10,36": "Jak ci się wydaje, który więc z tych trzech, był bliźnim tego, który wpadł w ręce bandytów?"
"Łk10,37": "A on powiedział: Ten, który mu okazał miłosierdzie. Powiedział więc mu Jezus: Idź, i ty czyń podobnie."
"Łk10,38": "I stało się, gdy oni szli, że On wszedł do jednego miasteczka, a pewna kobieta o imieniu Marta, ugościła Go w swoim domu."
"Łk10,39": "Miała ona siostrę, która nazywała się Maria; ta przysiadła u stóp Jezusa i słuchała Jego słowa."
"Łk10,40": "Ale Marta zajęta była przy wielu posługach, przystąpiła więc i powiedziała: Panie! Czy nie obchodzi Cię to, że moja siostra zostawiła mnie samą, abym usługiwała? Powiedz więc jej, aby mnie wsparła."
"Łk10,41": "A Jezus w odpowiedzi, rzekł jej: Marto, Marto, troszczysz i kłopoczesz się o wiele;"
"Łk10,42": "A tylko jedno jest potrzebne. A Maria dobrą cząstkę wybrała, która nie będzie jej odjęta."
