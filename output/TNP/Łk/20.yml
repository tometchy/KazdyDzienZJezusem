"Łk20,1": "I stało się jednego z owych dni, gdy nauczał lud w świątyni i głosił Ewangelię, że stanęli obok arcykapłani i uczeni w Piśmie ze starszymi,"
"Łk20,2": "I powiedzieli do Niego, mówiąc: Powiedz nam, jakim prawem to czynisz, albo kim jest Ten, który dał Ci to prawo?"
"Łk20,3": "A On w odpowiedzi, rzekł do nich: Zapytam i ja was o jedną rzecz. Powiedzcie mi:"
"Łk20,4": "Chrzest Jana był z nieba, czy z ludzi?"
"Łk20,5": "A oni wspólnie zastanawiali się i mówili do siebie: Jeśli powiemy: Z nieba, powie: Czemu więc mu nie uwierzyliście?"
"Łk20,6": "Jeśli natomiast powiemy: Z ludzi, cały lud nas ukamienuje, ponieważ są przekonani, że Jan był prorokiem."
"Łk20,7": "Odpowiedzieli więc, że nie wiedzą skąd."
"Łk20,8": "A Jezus powiedział im: I ja wam nie powiem, jakim prawem to czynię."
"Łk20,9": "I zaczął do ludu mówić to podobieństwo: Pewien człowiek zasadził winnicę i wynajął ją rolnikom, i odjechał na dłuższy czas."
"Łk20,10": "A we właściwym czasie posłał sługę do rolników, aby dali mu jego część z plonów winnicy; ale rolnicy pobili go i odesłali z niczym."
"Łk20,11": "I ponownie posłał drugiego sługę; ale oni i tego pobili, znieważyli i odesłali z niczym."
"Łk20,12": "I nadto posłał trzeciego; ale oni i tego poranili i wyrzucili."
"Łk20,13": "I powiedział pan winnicy: Co uczynię? Poślę swojego umiłowanego syna, może tego uszanują."
"Łk20,14": "Ale rolnicy, gdy go ujrzeli, rozważali między sobą, mówiąc: To jest dziedzic; zabijmy go, aby dziedzictwo stało się nasze."
"Łk20,15": "I wyrzucili go na zewnątrz winnicy, i zabili. Co więc uczyni im pan winnicy?"
"Łk20,16": "Przyjdzie i wytraci tych rolników, a winnicę odda innym. Gdy to usłyszeli, powiedzieli: Oby się tak nie stało!"
"Łk20,17": "Lecz On spojrzał na nich i powiedział: Co więc znaczy to, co napisano: Kamień, który odrzucili budujący, ten właśnie stał się głowicą węgła?"
"Łk20,18": "Każdy, kto upadnie na ten kamień, roztrzaska się, a na kogo by on upadł, zetrze go."
"Łk20,19": "I starali się arcykapłani i uczeni w Piśmie, aby Go w tej godzinie dostać w swoje ręce, ale bali się ludu; poznali bowiem, że do nich powiedział to podobieństwo."
"Łk20,20": "I zaczęli Go śledzić; wysyłali szpiegów, którzy udawali, że sami są sprawiedliwi, aby pochwycić Go na jakimś słowie i wydać Go urzędowi i władzy namiestnika."
"Łk20,21": "I zapytali Go, mówiąc: Nauczycielu! Wiemy, że poprawnie mówisz i nauczasz, i nie masz względu na osobę, ale zgodnie z prawdą nauczasz Bożej drogi."
"Łk20,22": "Czy wolno nam płacić podatek Cezarowi, czy nie?"
"Łk20,23": "On jednak dostrzegł ich podstęp i powiedział do nich: Czemu mnie kusicie?"
"Łk20,24": "Pokażcie mi denara; kogo ma wizerunek i napis? A w odpowiedzi, rzekli: Cezara."
"Łk20,25": "A On powiedział im: Oddawajcie więc, co jest Cezara, Cezarowi, a co jest Boga, Bogu."
"Łk20,26": "I nie mogli złapać Go za słowo wobec ludu, a zdziwieni Jego odpowiedzią, zamilkli."
"Łk20,27": "A podeszli jacyś saduceusze, którzy zaprzeczają, że nie ma powstania z martwych, i zapytali Go,"
"Łk20,28": "Mówiąc: Nauczycielu! Mojżesz napisał nam, że jeśli czyjś brat umrze, mając żonę, a umrze bezdzietny, to brat jego ma wziąć jego żonę i wzbudzić potomka swojemu bratu."
"Łk20,29": "Było więc siedmiu braci; pierwszy wziął ją za żonę i umarł bezdzietny."
"Łk20,30": "I drugi wziął ją za żonę, i on umarł bezdzietny."
"Łk20,31": "I wziął ją trzeci, i tak samo kolejno siedmiu, nie pozostawili dzieci, i umarli."
"Łk20,32": "Na końcu, po wszystkich umarła i ta kobieta."
"Łk20,33": "Przy powstaniu z martwych, którego z nich zatem zostanie żoną, albowiem siedmiu miało ją za żonę?"
"Łk20,34": "A Jezus w odpowiedzi, rzekł im: Synowie tego wieku zaślubiają i wychodzą za mąż."
"Łk20,35": "Ale ci, którzy są godni dostąpić tamtego wieku i powstać z martwych, ani się nie zaślubiają, ani nie wychodzą za mąż."
"Łk20,36": "Ani nie mogą już więcej umrzeć; bo będąc równi aniołom, są synami Boga, gdyż są synami powstania z martwych."
"Łk20,37": "A że umarli są wzbudzani, to i Mojżesz ujawnił przy krzaku cierniowym, gdy mówi: PAN, Bóg Abrahama i Bóg Izaaka, i Bóg Jakuba."
"Łk20,38": "Bóg więc nie jest Bogiem umarłych, ale żywych; wszyscy bowiem dla Niego żyją."
"Łk20,39": "A w odpowiedzi, niektórzy z uczonych w Piśmie powiedzieli: Nauczycielu! Dobrze powiedziałeś."
"Łk20,40": "I już nie śmieli Go więcej o nic pytać."
"Łk20,41": "I powiedział do nich: Jak mogą mówić, że Mesjasz jest synem Dawida?"
"Łk20,42": "A sam Dawid mówi w zwoju psalmów: Powiedział PAN mojemu Panu: Siądź po mojej prawicy,"
"Łk20,43": "Aż położę nieprzyjaciół twoich jako podnóżek twoich stóp."
"Łk20,44": "Dawid więc nazywa Go Panem, to jakże jest jego synem?"
"Łk20,45": "Gdy słuchał Go cały lud, powiedział swoim uczniom:"
"Łk20,46": "Uważajcie na uczonych w Piśmie, którzy chcą chodzić w długich szatach, i miłują pozdrowienia na rynkach i pierwsze ławy w synagogach, i pierwsze miejsca na wieczerzach;"
"Łk20,47": "Którzy objadają domy wdów i dla pozoru długo się modlą. Tacy otrzymają wyższy wyrok."
