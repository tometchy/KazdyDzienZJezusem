"Łk20,1":
  text: "I stało się jednego z owych dni, gdy nauczał lud w świątyni i głosił Ewangelię, że stanęli obok arcykapłani i uczeni w Piśmie ze starszymi,"
  tags: []
"Łk20,2":
  text: "I powiedzieli do Niego, mówiąc: Powiedz nam, jakim prawem to czynisz, albo kim jest Ten, który dał Ci to prawo?"
  tags: []
"Łk20,3":
  text: "A On w odpowiedzi, rzekł do nich: Zapytam i ja was o jedną rzecz. Powiedzcie mi:"
  tags: []
"Łk20,4":
  text: "Chrzest Jana był z nieba, czy z ludzi?"
  tags: []
"Łk20,5":
  text: "A oni wspólnie zastanawiali się i mówili do siebie: Jeśli powiemy: Z nieba, powie: Czemu więc mu nie uwierzyliście?"
  tags: []
"Łk20,6":
  text: "Jeśli natomiast powiemy: Z ludzi, cały lud nas ukamienuje, ponieważ są przekonani, że Jan był prorokiem."
  tags: []
"Łk20,7":
  text: "Odpowiedzieli więc, że nie wiedzą skąd."
  tags: []
"Łk20,8":
  text: "A Jezus powiedział im: I ja wam nie powiem, jakim prawem to czynię."
  tags: []
"Łk20,9":
  text: "I zaczął do ludu mówić to podobieństwo: Pewien człowiek zasadził winnicę i wynajął ją rolnikom, i odjechał na dłuższy czas."
  tags: []
"Łk20,10":
  text: "A we właściwym czasie posłał sługę do rolników, aby dali mu jego część z plonów winnicy; ale rolnicy pobili go i odesłali z niczym."
  tags: []
"Łk20,11":
  text: "I ponownie posłał drugiego sługę; ale oni i tego pobili, znieważyli i odesłali z niczym."
  tags: []
"Łk20,12":
  text: "I nadto posłał trzeciego; ale oni i tego poranili i wyrzucili."
  tags: []
"Łk20,13":
  text: "I powiedział pan winnicy: Co uczynię? Poślę swojego umiłowanego syna, może tego uszanują."
  tags: []
"Łk20,14":
  text: "Ale rolnicy, gdy go ujrzeli, rozważali między sobą, mówiąc: To jest dziedzic; zabijmy go, aby dziedzictwo stało się nasze."
  tags: []
"Łk20,15":
  text: "I wyrzucili go na zewnątrz winnicy, i zabili. Co więc uczyni im pan winnicy?"
  tags: []
"Łk20,16":
  text: "Przyjdzie i wytraci tych rolników, a winnicę odda innym. Gdy to usłyszeli, powiedzieli: Oby się tak nie stało!"
  tags: []
"Łk20,17":
  text: "Lecz On spojrzał na nich i powiedział: Co więc znaczy to, co napisano: Kamień, który odrzucili budujący, ten właśnie stał się głowicą węgła?"
  tags: []
"Łk20,18":
  text: "Każdy, kto upadnie na ten kamień, roztrzaska się, a na kogo by on upadł, zetrze go."
  tags: []
"Łk20,19":
  text: "I starali się arcykapłani i uczeni w Piśmie, aby Go w tej godzinie dostać w swoje ręce, ale bali się ludu; poznali bowiem, że do nich powiedział to podobieństwo."
  tags: []
"Łk20,20":
  text: "I zaczęli Go śledzić; wysyłali szpiegów, którzy udawali, że sami są sprawiedliwi, aby pochwycić Go na jakimś słowie i wydać Go urzędowi i władzy namiestnika."
  tags: []
"Łk20,21":
  text: "I zapytali Go, mówiąc: Nauczycielu! Wiemy, że poprawnie mówisz i nauczasz, i nie masz względu na osobę, ale zgodnie z prawdą nauczasz Bożej drogi."
  tags: []
"Łk20,22":
  text: "Czy wolno nam płacić podatek Cezarowi, czy nie?"
  tags: []
"Łk20,23":
  text: "On jednak dostrzegł ich podstęp i powiedział do nich: Czemu mnie kusicie?"
  tags: []
"Łk20,24":
  text: "Pokażcie mi denara; kogo ma wizerunek i napis? A w odpowiedzi, rzekli: Cezara."
  tags: []
"Łk20,25":
  text: "A On powiedział im: Oddawajcie więc, co jest Cezara, Cezarowi, a co jest Boga, Bogu."
  tags: []
"Łk20,26":
  text: "I nie mogli złapać Go za słowo wobec ludu, a zdziwieni Jego odpowiedzią, zamilkli."
  tags: []
"Łk20,27":
  text: "A podeszli jacyś saduceusze, którzy zaprzeczają, że nie ma powstania z martwych, i zapytali Go,"
  tags: []
"Łk20,28":
  text: "Mówiąc: Nauczycielu! Mojżesz napisał nam, że jeśli czyjś brat umrze, mając żonę, a umrze bezdzietny, to brat jego ma wziąć jego żonę i wzbudzić potomka swojemu bratu."
  tags: []
"Łk20,29":
  text: "Było więc siedmiu braci; pierwszy wziął ją za żonę i umarł bezdzietny."
  tags: []
"Łk20,30":
  text: "I drugi wziął ją za żonę, i on umarł bezdzietny."
  tags: []
"Łk20,31":
  text: "I wziął ją trzeci, i tak samo kolejno siedmiu, nie pozostawili dzieci, i umarli."
  tags: []
"Łk20,32":
  text: "Na końcu, po wszystkich umarła i ta kobieta."
  tags: []
"Łk20,33":
  text: "Przy powstaniu z martwych, którego z nich zatem zostanie żoną, albowiem siedmiu miało ją za żonę?"
  tags: []
"Łk20,34":
  text: "A Jezus w odpowiedzi, rzekł im: Synowie tego wieku zaślubiają i wychodzą za mąż."
  tags: []
"Łk20,35":
  text: "Ale ci, którzy są godni dostąpić tamtego wieku i powstać z martwych, ani się nie zaślubiają, ani nie wychodzą za mąż."
  tags: []
"Łk20,36":
  text: "Ani nie mogą już więcej umrzeć; bo będąc równi aniołom, są synami Boga, gdyż są synami powstania z martwych."
  tags: []
"Łk20,37":
  text: "A że umarli są wzbudzani, to i Mojżesz ujawnił przy krzaku cierniowym, gdy mówi: PAN, Bóg Abrahama i Bóg Izaaka, i Bóg Jakuba."
  tags: []
"Łk20,38":
  text: "Bóg więc nie jest Bogiem umarłych, ale żywych; wszyscy bowiem dla Niego żyją."
  tags: []
"Łk20,39":
  text: "A w odpowiedzi, niektórzy z uczonych w Piśmie powiedzieli: Nauczycielu! Dobrze powiedziałeś."
  tags: []
"Łk20,40":
  text: "I już nie śmieli Go więcej o nic pytać."
  tags: []
"Łk20,41":
  text: "I powiedział do nich: Jak mogą mówić, że Mesjasz jest synem Dawida?"
  tags: []
"Łk20,42":
  text: "A sam Dawid mówi w zwoju psalmów: Powiedział PAN mojemu Panu: Siądź po mojej prawicy,"
  tags: []
"Łk20,43":
  text: "Aż położę nieprzyjaciół twoich jako podnóżek twoich stóp."
  tags: []
"Łk20,44":
  text: "Dawid więc nazywa Go Panem, to jakże jest jego synem?"
  tags: []
"Łk20,45":
  text: "Gdy słuchał Go cały lud, powiedział swoim uczniom:"
  tags: []
"Łk20,46":
  text: "Uważajcie na uczonych w Piśmie, którzy chcą chodzić w długich szatach, i miłują pozdrowienia na rynkach i pierwsze ławy w synagogach, i pierwsze miejsca na wieczerzach;"
  tags: []
"Łk20,47":
  text: "Którzy objadają domy wdów i dla pozoru długo się modlą. Tacy otrzymają wyższy wyrok."
  tags: []
