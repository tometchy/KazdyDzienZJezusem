"Łk1,1":
  text: "Skoro już wielu próbowało uporządkować opis wydarzeń, które się wśród nas dopełniły,"
  tags: []
"Łk1,2":
  text: "Tak, jak nam to przekazali ci, którzy od początku byli naocznymi świadkami i sługami Słowa,"
  tags: []
"Łk1,3":
  text: "Także i mnie wydało się słuszne, wszystko dokładnie od początku zbadać i opisać ci to po kolei, dostojny Teofilu!"
  tags: []
"Łk1,4":
  text: "Tak, abyś całkowicie poznał niezawodność tych słów, których cię ustnie nauczono."
  tags: []
"Łk1,5":
  text: "Za dni Heroda, króla Judei, żył pewien kapłan o imieniu Zachariasz, ze zmiany Abiasza, a żona jego była jedną z córek Aarona. Jej imię – Elżbieta."
  tags: []
"Łk1,6":
  text: "A oboje byli sprawiedliwi przed obliczem Boga, chodząc nienagannie we wszystkich przykazaniach i ustawach PANA."
  tags: []
"Łk1,7":
  text: "I nie mieli dziecka, jako że Elżbieta była niepłodna, a byli oboje w podeszłym wieku."
  tags: []
"Łk1,8":
  text: "I stało się, gdy sprawował posługę kapłańską przed Bogiem, w kolejności przypadającej na niego zmiany,"
  tags: []
"Łk1,9":
  text: "Że według zwyczaju kapłaństwa padł na niego los, aby wejść do świątyni PANA i spalić kadzidło w ofierze."
  tags: []
"Łk1,10":
  text: "A całe mnóstwo ludu było na zewnątrz, modląc się w godzinie spalania kadzidła."
  tags: []
"Łk1,11":
  text: "I ukazał mu się anioł PANA, stojący po prawej stronie ołtarza kadzidlanego."
  tags: []
"Łk1,12":
  text: "I zatrwożył się Zachariasz, gdy go zobaczył, i ogarnął go lęk."
  tags: []
"Łk1,13":
  text: "I powiedział do niego anioł: Nie bój się Zachariaszu! Bo wysłuchana została twoja modlitwa, a twoja żona Elżbieta urodzi ci syna, i nazwiesz go imieniem Jan."
  tags: []
"Łk1,14":
  text: "I będziesz miał radość i wesele, i wielu będzie się radować z jego narodzenia."
  tags: []
"Łk1,15":
  text: "Albowiem będzie wielki przed obliczem PANA, z pewnością nie będzie pić wina ani sycery, a zostanie napełniony Duchem Świętym jeszcze będąc w łonie swojej matki."
  tags: []
"Łk1,16":
  text: "I wielu z synów Izraela nawróci do PANA, ich Boga."
  tags: []
"Łk1,17":
  text: "A sam pójdzie przed Jego obliczem w duchu i w mocy Eliasza, aby zawrócić serca ojców do dzieci, i nieposłusznych ku rozsądkowi sprawiedliwych, aby przysposobić dla PANA lud, który jest przygotowany."
  tags: []
"Łk1,18":
  text: "A Zachariasz powiedział do anioła: Po czym to poznam? Bo ja jestem stary, a moja żona jest już w podeszłym wieku."
  tags: []
"Łk1,19":
  text: "I w odpowiedzi, anioł rzekł do niego: Ja jestem Gabriel, ten, który staje przed obliczem Boga, a zostałem posłany, abym mówił do ciebie i ogłosił ci tę dobrą nowinę."
  tags: []
"Łk1,20":
  text: "I oto będziesz milczał, i nie będziesz mógł mówić aż do dnia, kiedy to się stanie, za to, że nie uwierzyłeś moim słowom, które wypełnią się w swoim czasie."
  tags: []
"Łk1,21":
  text: "A lud oczekiwał Zachariasza i dziwił się jego zwlekaniu w świątyni."
  tags: []
"Łk1,22":
  text: "A gdy wyszedł, nie mógł do nich mówić; i poznali, że miał widzenie w świątyni, bo dawał im znaki i pozostał niemy."
  tags: []
"Łk1,23":
  text: "I stało się, gdy wypełniły się dni jego służby, że odszedł do swojego domu."
  tags: []
"Łk1,24":
  text: "A po tych dniach Elżbieta, żona jego, poczęła i ukrywała się przez pięć miesięcy, mówiąc:"
  tags: []
"Łk1,25":
  text: "Tak mi uczynił PAN w tych dniach, gdy wejrzał na mnie, aby zdjąć moją hańbę pośród ludzi."
  tags: []
"Łk1,26":
  text: "A w szóstym miesiącu posłany został przez Boga anioł Gabriel do miasta Galilei, zwanego Nazaret,"
  tags: []
"Łk1,27":
  text: "Do dziewicy zaręczonej z mężem, któremu było na imię Józef, z domu Dawida, a imię tej dziewicy – Maria."
  tags: []
"Łk1,28":
  text: "A po wejściu do niej, anioł powiedział: Witaj, obdarowana łaską; PAN z tobą; to ty błogosławiona jesteś pośród kobiet."
  tags: []
"Łk1,29":
  text: "Ale ona, gdy go ujrzała, zmieszała się na jego słowo i rozważała skąd takie pozdrowienie."
  tags: []
"Łk1,30":
  text: "I anioł powiedział jej: Nie bój się, Mario! Albowiem znalazłaś łaskę u Boga."
  tags: []
"Łk1,31":
  text: "I oto poczniesz w łonie, i urodzisz syna, i nazwiesz Go imieniem Jezus."
  tags: []
"Łk1,32":
  text: "Będzie On wielki i zostanie nazwany Synem Najwyższego, i da Mu PAN Bóg tron Dawida, Jego ojca,"
  tags: []
"Łk1,33":
  text: "I będzie królował nad domem Jakuba na wieki, a Królestwu Jego nie będzie końca."
  tags: []
"Łk1,34":
  text: "A Maria powiedziała do anioła: Jak to się stanie, skoro nie obcowałam z mężem?"
  tags: []
"Łk1,35":
  text: "I anioł w odpowiedzi, rzekł do niej: Duch Święty zstąpi na ciebie i moc Najwyższego cię zacieni; dlatego narodzone z ciebie Święte, zostanie nazwane Synem Boga."
  tags: []
"Łk1,36":
  text: "A oto Elżbieta, twoja krewna, i ona poczęła syna w swej starości, a jest to już szósty miesiąc dla tej, którą nazywają niepłodną,"
  tags: []
"Łk1,37":
  text: "Gdyż u Boga nie będzie niemożliwe, cokolwiek wypowie."
  tags: []
"Łk1,38":
  text: "Wtedy Maria powiedziała: Oto jestem służebnicą PANA; oby mi się stało według twojego słowa. I anioł odszedł od niej."
  tags: []
"Łk1,39":
  text: "W tych dniach wstała Maria i udała się śpiesznie w górzyste strony do miasta Judy."
  tags: []
"Łk1,40":
  text: "I gdy weszła do domu Zachariasza, pozdrowiła Elżbietę."
  tags: []
"Łk1,41":
  text: "I stało się, gdy Elżbieta usłyszała pozdrowienie Marii, że poruszyło się w jej łonie dziecko, i Elżbieta została napełniona Duchem Świętym."
  tags: []
"Łk1,42":
  text: "I zawołała donośnym głosem, i powiedziała: Błogosławiona jesteś wśród kobiet, i błogosławiony jest owoc twojego łona!"
  tags: []
"Łk1,43":
  text: "A skądże mi to, że matka mojego Pana przyszła do mnie?"
  tags: []
"Łk1,44":
  text: "Oto bowiem, gdy do moich uszu dotarł głos twojego pozdrowienia, w moim łonie z radości poruszyło się dziecko."
  tags: []
"Łk1,45":
  text: "A błogosławiona, która uwierzyła, że spełni się to, co zostało powiedziane przez PANA."
  tags: []
"Łk1,46":
  text: "I wtedy Maria powiedziała: Moja dusza wywyższa PANA,"
  tags: []
"Łk1,47":
  text: "A mój duch rozradował się w Bogu, moim Zbawicielu,"
  tags: []
"Łk1,48":
  text: "Gdyż wejrzał na uniżenie swojej służebnicy; bowiem odtąd będą uważać mnie za błogosławioną wszystkie pokolenia;"
  tags: []
"Łk1,49":
  text: "Gdyż wielkie rzeczy uczynił mi Mocny i święte jest Jego imię,"
  tags: []
"Łk1,50":
  text: "A Jego miłosierdzie z pokolenia na pokolenie dla tych, którzy się Go boją."
  tags: []
"Łk1,51":
  text: "I okazał siłę w swoim ramieniu i rozproszył pysznych i zamysły ich serc;"
  tags: []
"Łk1,52":
  text: "Strącił władców z tronów i wywyższył uniżonych;"
  tags: []
"Łk1,53":
  text: "Łaknących napełnił dobrami, a bogatych odprawił z niczym;"
  tags: []
"Łk1,54":
  text: "Ujął się za Izraelem, swoim sługą, aby zostało zapamiętane Jego miłosierdzie,"
  tags: []
"Łk1,55":
  text: "Tak, jak powiedział do ojców naszych, do Abrahama i jego potomka na wieki."
  tags: []
"Łk1,56":
  text: "A Maria została z nią około trzech miesięcy; następnie wróciła do swojego domu."
  tags: []
"Łk1,57":
  text: "A Elżbiecie wypełnił się czas jej rozwiązania, i urodziła syna."
  tags: []
"Łk1,58":
  text: "A gdy usłyszeli sąsiedzi i jej krewni, że PAN okazał swoje wielkie miłosierdzie nad nią, radowali się razem z nią."
  tags: []
"Łk1,59":
  text: "I stało się, że przyszli ósmego dnia, aby obrzezać dziecię; i chcieli nazwać je tak, jak imię jego ojca – Zachariasz."
  tags: []
"Łk1,60":
  text: "A w odpowiedzi, jego matka powiedziała: O nie! Ale będzie nazwany – Jan."
  tags: []
"Łk1,61":
  text: "I powiedzieli do niej: Nikt w twojej rodzinie nie jest nazwany tym imieniem."
  tags: []
"Łk1,62":
  text: "I skinęli więc na jego ojca, jak chciałby go nazwać."
  tags: []
"Łk1,63":
  text: "A on poprosił o tabliczkę i napisał tak: Jan jest jego imię. I dziwili się wszyscy."
  tags: []
"Łk1,64":
  text: "I od razu zostały otworzone jego usta i rozwiązał się jego język, i mówił, wysławiając Boga."
  tags: []
"Łk1,65":
  text: "I ogarnął strach wszystkich ich sąsiadów, a po całej górzystej Judei rozeszły się wszystkie te słowa."
  tags: []
"Łk1,66":
  text: "A wszyscy, którzy o tym słyszeli, wzięli te słowa do serca, mówiąc: Kim więc będzie to dziecię? A ręka PANA była z nim."
  tags: []
"Łk1,67":
  text: "A Zachariasz, jego ojciec, został napełniony Duchem Świętym i prorokował, mówiąc:"
  tags: []
"Łk1,68":
  text: "Błogosławiony niech będzie PAN, Bóg Izraela, że nawiedził swój lud i dokonał jego odkupienia,"
  tags: []
"Łk1,69":
  text: "I wzbudził nam róg zbawienia w domu swojego sługi Dawida,"
  tags: []
"Łk1,70":
  text: "Tak, jak zapowiedział przez usta swoich świętych proroków z dawnych czasów:"
  tags: []
"Łk1,71":
  text: "Zbawienie od naszych wrogów i z ręki wszystkich, którzy nas nienawidzą,"
  tags: []
"Łk1,72":
  text: "Aby uczynić miłosierdzie naszym ojcom i przypomnieć o swoim świętym przymierzu,"
  tags: []
"Łk1,73":
  text: "Na przysięgę, którą złożył Abrahamowi, naszemu ojcu, że da nam,"
  tags: []
"Łk1,74":
  text: "Abyśmy, wybawieni z ręki naszych nieprzyjaciół, bez bojaźni Mu służyli,"
  tags: []
"Łk1,75":
  text: "W świętości i w sprawiedliwości przed Jego obliczem, po wszystkie dni naszego życia."
  tags: []
"Łk1,76":
  text: "A ty, dziecię, prorokiem Najwyższego zostaniesz nazwane; bo pójdziesz przed obliczem PANA przygotować Jego drogi,"
  tags: []
"Łk1,77":
  text: "I dać poznanie zbawienia Jego ludowi przez odpuszczenie ich grzechów,"
  tags: []
"Łk1,78":
  text: "Dzięki głębi miłosierdzia naszego Boga, przez które nawiedziła nas jutrzenka z wysokości,"
  tags: []
"Łk1,79":
  text: "Aby ukazać się siedzącym w ciemności i w cieniu śmierci, i ukierunkować nasze stopy na drogę pokoju."
  tags: []
"Łk1,80":
  text: "A dziecię rosło i wzmacniało się duchem, i było na pustkowiu aż do dnia swego ukazania przed Izraelem."
  tags: []
