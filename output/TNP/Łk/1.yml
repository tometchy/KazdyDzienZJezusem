"Łk1,1": "Skoro już wielu próbowało uporządkować opis wydarzeń, które się wśród nas dopełniły,"
"Łk1,2": "Tak, jak nam to przekazali ci, którzy od początku byli naocznymi świadkami i sługami Słowa,"
"Łk1,3": "Także i mnie wydało się słuszne, wszystko dokładnie od początku zbadać i opisać ci to po kolei, dostojny Teofilu!"
"Łk1,4": "Tak, abyś całkowicie poznał niezawodność tych słów, których cię ustnie nauczono."
"Łk1,5": "Za dni Heroda, króla Judei, żył pewien kapłan o imieniu Zachariasz, ze zmiany Abiasza, a żona jego była jedną z córek Aarona. Jej imię – Elżbieta."
"Łk1,6": "A oboje byli sprawiedliwi przed obliczem Boga, chodząc nienagannie we wszystkich przykazaniach i ustawach PANA."
"Łk1,7": "I nie mieli dziecka, jako że Elżbieta była niepłodna, a byli oboje w podeszłym wieku."
"Łk1,8": "I stało się, gdy sprawował posługę kapłańską przed Bogiem, w kolejności przypadającej na niego zmiany,"
"Łk1,9": "Że według zwyczaju kapłaństwa padł na niego los, aby wejść do świątyni PANA i spalić kadzidło w ofierze."
"Łk1,10": "A całe mnóstwo ludu było na zewnątrz, modląc się w godzinie spalania kadzidła."
"Łk1,11": "I ukazał mu się anioł PANA, stojący po prawej stronie ołtarza kadzidlanego."
"Łk1,12": "I zatrwożył się Zachariasz, gdy go zobaczył, i ogarnął go lęk."
"Łk1,13": "I powiedział do niego anioł: Nie bój się Zachariaszu! Bo wysłuchana została twoja modlitwa, a twoja żona Elżbieta urodzi ci syna, i nazwiesz go imieniem Jan."
"Łk1,14": "I będziesz miał radość i wesele, i wielu będzie się radować z jego narodzenia."
"Łk1,15": "Albowiem będzie wielki przed obliczem PANA, z pewnością nie będzie pić wina ani sycery, a zostanie napełniony Duchem Świętym jeszcze będąc w łonie swojej matki."
"Łk1,16": "I wielu z synów Izraela nawróci do PANA, ich Boga."
"Łk1,17": "A sam pójdzie przed Jego obliczem w duchu i w mocy Eliasza, aby zawrócić serca ojców do dzieci, i nieposłusznych ku rozsądkowi sprawiedliwych, aby przysposobić dla PANA lud, który jest przygotowany."
"Łk1,18": "A Zachariasz powiedział do anioła: Po czym to poznam? Bo ja jestem stary, a moja żona jest już w podeszłym wieku."
"Łk1,19": "I w odpowiedzi, anioł rzekł do niego: Ja jestem Gabriel, ten, który staje przed obliczem Boga, a zostałem posłany, abym mówił do ciebie i ogłosił ci tę dobrą nowinę."
"Łk1,20": "I oto będziesz milczał, i nie będziesz mógł mówić aż do dnia, kiedy to się stanie, za to, że nie uwierzyłeś moim słowom, które wypełnią się w swoim czasie."
"Łk1,21": "A lud oczekiwał Zachariasza i dziwił się jego zwlekaniu w świątyni."
"Łk1,22": "A gdy wyszedł, nie mógł do nich mówić; i poznali, że miał widzenie w świątyni, bo dawał im znaki i pozostał niemy."
"Łk1,23": "I stało się, gdy wypełniły się dni jego służby, że odszedł do swojego domu."
"Łk1,24": "A po tych dniach Elżbieta, żona jego, poczęła i ukrywała się przez pięć miesięcy, mówiąc:"
"Łk1,25": "Tak mi uczynił PAN w tych dniach, gdy wejrzał na mnie, aby zdjąć moją hańbę pośród ludzi."
"Łk1,26": "A w szóstym miesiącu posłany został przez Boga anioł Gabriel do miasta Galilei, zwanego Nazaret,"
"Łk1,27": "Do dziewicy zaręczonej z mężem, któremu było na imię Józef, z domu Dawida, a imię tej dziewicy – Maria."
"Łk1,28": "A po wejściu do niej, anioł powiedział: Witaj, obdarowana łaską; PAN z tobą; to ty błogosławiona jesteś pośród kobiet."
"Łk1,29": "Ale ona, gdy go ujrzała, zmieszała się na jego słowo i rozważała skąd takie pozdrowienie."
"Łk1,30": "I anioł powiedział jej: Nie bój się, Mario! Albowiem znalazłaś łaskę u Boga."
"Łk1,31": "I oto poczniesz w łonie, i urodzisz syna, i nazwiesz Go imieniem Jezus."
"Łk1,32": "Będzie On wielki i zostanie nazwany Synem Najwyższego, i da Mu PAN Bóg tron Dawida, Jego ojca,"
"Łk1,33": "I będzie królował nad domem Jakuba na wieki, a Królestwu Jego nie będzie końca."
"Łk1,34": "A Maria powiedziała do anioła: Jak to się stanie, skoro nie obcowałam z mężem?"
"Łk1,35": "I anioł w odpowiedzi, rzekł do niej: Duch Święty zstąpi na ciebie i moc Najwyższego cię zacieni; dlatego narodzone z ciebie Święte, zostanie nazwane Synem Boga."
"Łk1,36": "A oto Elżbieta, twoja krewna, i ona poczęła syna w swej starości, a jest to już szósty miesiąc dla tej, którą nazywają niepłodną,"
"Łk1,37": "Gdyż u Boga nie będzie niemożliwe, cokolwiek wypowie."
"Łk1,38": "Wtedy Maria powiedziała: Oto jestem służebnicą PANA; oby mi się stało według twojego słowa. I anioł odszedł od niej."
"Łk1,39": "W tych dniach wstała Maria i udała się śpiesznie w górzyste strony do miasta Judy."
"Łk1,40": "I gdy weszła do domu Zachariasza, pozdrowiła Elżbietę."
"Łk1,41": "I stało się, gdy Elżbieta usłyszała pozdrowienie Marii, że poruszyło się w jej łonie dziecko, i Elżbieta została napełniona Duchem Świętym."
"Łk1,42": "I zawołała donośnym głosem, i powiedziała: Błogosławiona jesteś wśród kobiet, i błogosławiony jest owoc twojego łona!"
"Łk1,43": "A skądże mi to, że matka mojego Pana przyszła do mnie?"
"Łk1,44": "Oto bowiem, gdy do moich uszu dotarł głos twojego pozdrowienia, w moim łonie z radości poruszyło się dziecko."
"Łk1,45": "A błogosławiona, która uwierzyła, że spełni się to, co zostało powiedziane przez PANA."
"Łk1,46": "I wtedy Maria powiedziała: Moja dusza wywyższa PANA,"
"Łk1,47": "A mój duch rozradował się w Bogu, moim Zbawicielu,"
"Łk1,48": "Gdyż wejrzał na uniżenie swojej służebnicy; bowiem odtąd będą uważać mnie za błogosławioną wszystkie pokolenia;"
"Łk1,49": "Gdyż wielkie rzeczy uczynił mi Mocny i święte jest Jego imię,"
"Łk1,50": "A Jego miłosierdzie z pokolenia na pokolenie dla tych, którzy się Go boją."
"Łk1,51": "I okazał siłę w swoim ramieniu i rozproszył pysznych i zamysły ich serc;"
"Łk1,52": "Strącił władców z tronów i wywyższył uniżonych;"
"Łk1,53": "Łaknących napełnił dobrami, a bogatych odprawił z niczym;"
"Łk1,54": "Ujął się za Izraelem, swoim sługą, aby zostało zapamiętane Jego miłosierdzie,"
"Łk1,55": "Tak, jak powiedział do ojców naszych, do Abrahama i jego potomka na wieki."
"Łk1,56": "A Maria została z nią około trzech miesięcy; następnie wróciła do swojego domu."
"Łk1,57": "A Elżbiecie wypełnił się czas jej rozwiązania, i urodziła syna."
"Łk1,58": "A gdy usłyszeli sąsiedzi i jej krewni, że PAN okazał swoje wielkie miłosierdzie nad nią, radowali się razem z nią."
"Łk1,59": "I stało się, że przyszli ósmego dnia, aby obrzezać dziecię; i chcieli nazwać je tak, jak imię jego ojca – Zachariasz."
"Łk1,60": "A w odpowiedzi, jego matka powiedziała: O nie! Ale będzie nazwany – Jan."
"Łk1,61": "I powiedzieli do niej: Nikt w twojej rodzinie nie jest nazwany tym imieniem."
"Łk1,62": "I skinęli więc na jego ojca, jak chciałby go nazwać."
"Łk1,63": "A on poprosił o tabliczkę i napisał tak: Jan jest jego imię. I dziwili się wszyscy."
"Łk1,64": "I od razu zostały otworzone jego usta i rozwiązał się jego język, i mówił, wysławiając Boga."
"Łk1,65": "I ogarnął strach wszystkich ich sąsiadów, a po całej górzystej Judei rozeszły się wszystkie te słowa."
"Łk1,66": "A wszyscy, którzy o tym słyszeli, wzięli te słowa do serca, mówiąc: Kim więc będzie to dziecię? A ręka PANA była z nim."
"Łk1,67": "A Zachariasz, jego ojciec, został napełniony Duchem Świętym i prorokował, mówiąc:"
"Łk1,68": "Błogosławiony niech będzie PAN, Bóg Izraela, że nawiedził swój lud i dokonał jego odkupienia,"
"Łk1,69": "I wzbudził nam róg zbawienia w domu swojego sługi Dawida,"
"Łk1,70": "Tak, jak zapowiedział przez usta swoich świętych proroków z dawnych czasów:"
"Łk1,71": "Zbawienie od naszych wrogów i z ręki wszystkich, którzy nas nienawidzą,"
"Łk1,72": "Aby uczynić miłosierdzie naszym ojcom i przypomnieć o swoim świętym przymierzu,"
"Łk1,73": "Na przysięgę, którą złożył Abrahamowi, naszemu ojcu, że da nam,"
"Łk1,74": "Abyśmy, wybawieni z ręki naszych nieprzyjaciół, bez bojaźni Mu służyli,"
"Łk1,75": "W świętości i w sprawiedliwości przed Jego obliczem, po wszystkie dni naszego życia."
"Łk1,76": "A ty, dziecię, prorokiem Najwyższego zostaniesz nazwane; bo pójdziesz przed obliczem PANA przygotować Jego drogi,"
"Łk1,77": "I dać poznanie zbawienia Jego ludowi przez odpuszczenie ich grzechów,"
"Łk1,78": "Dzięki głębi miłosierdzia naszego Boga, przez które nawiedziła nas jutrzenka z wysokości,"
"Łk1,79": "Aby ukazać się siedzącym w ciemności i w cieniu śmierci, i ukierunkować nasze stopy na drogę pokoju."
"Łk1,80": "A dziecię rosło i wzmacniało się duchem, i było na pustkowiu aż do dnia swego ukazania przed Izraelem."
