"Łk11,1":
  text: "I stało się, że Jezus modlił się w pewnym miejscu, i gdy skończył, jeden z Jego uczniów powiedział: Panie! Naucz nas modlić się, jak i Jan nauczył swoich uczniów."
  tags: []
"Łk11,2":
  text: "Powiedział więc im: Kiedy modlicie się, mówcie: Ojcze nasz, który jesteś w niebiosach! Niech Twoje imię zostanie uświęcone; niech przyjdzie Twoje Królestwo; niech się stanie Twoja wola, jak w niebie, tak i na ziemi."
  tags: []
"Łk11,3":
  text: "Chleba naszego codziennego daj nam na każdy dzień."
  tags: []
"Łk11,4":
  text: "I odpuść nam nasze grzechy; albowiem i my sami odpuszczamy każdemu, kto wobec nas jest winny. I nie wprowadź nas w pokusę, ale nas uratuj od złego."
  tags: []
"Łk11,5":
  text: "I powiedział do nich: Kto z was mając przyjaciela, pójdzie do niego o północy i powie do niego: Przyjacielu! Pożycz mi trzy chleby;"
  tags: []
"Łk11,6":
  text: "Ponieważ przyjaciel mój przybył do mnie z drogi, a nie mam, co przed nim położyć."
  tags: []
"Łk11,7":
  text: "A on będąc w środku, w odpowiedzi, rzekłby: Nie zadawaj mi trudu; już drzwi zamknięte, a dzieciątka moje są ze mną w łóżku; nie mogę wstać i dać ci."
  tags: []
"Łk11,8":
  text: "Mówię wam: Nawet gdyby nie wstał i nie dał, mimo że jest jego przyjacielem, to wstanie i na pewno da z powodu jego natręctwa, tyle ile potrzebuje."
  tags: []
"Łk11,9":
  text: "I ja wam mówię: Proście, a będzie wam dane; szukajcie, a znajdziecie; pukajcie, a będzie wam otworzone."
  tags: []
"Łk11,10":
  text: "Każdy bowiem, kto prosi, otrzymuje; a kto szuka, znajduje; a temu, co puka, zostanie otworzone."
  tags: []
"Łk11,11":
  text: "A jeśli jakiegoś ojca pośród was, syn poprosi o chleb, czy poda mu kamień? A jeśli o rybę, czy zamiast ryby poda mu węża?"
  tags: []
"Łk11,12":
  text: "A jeśli prosi o jajko, czy poda mu skorpiona?"
  tags: []
"Łk11,13":
  text: "Jeśli więc wy, będąc złymi, umiecie dawać dobre dary swoim dzieciom, o ileż bardziej Ojciec wasz z nieba da Ducha Świętego tym, którzy Go proszą?"
  tags: []
"Łk11,14":
  text: "I wypędzał demona z człowieka, a ten był niemy; stało się, gdy wyszedł ów demon, że niemy przemówił; a tłumy zdziwiły się."
  tags: []
"Łk11,15":
  text: "Lecz niektórzy z nich mówili: Przez Belzebuba, władcę demonów, wyrzuca demony."
  tags: []
"Łk11,16":
  text: "A inni, wystawiając Go na próbę, żądali od Niego znaku z nieba."
  tags: []
"Łk11,17":
  text: "Ale On, znając ich myśli, powiedział im: Każde królestwo, które zostało podzielone samo w sobie, pustoszeje, a dom na dom się wali."
  tags: []
"Łk11,18":
  text: "A jeśli i szatan podzielony jest sam w sobie, jak ostoi się jego królestwo? Bo mówicie, że ja przez Belzebuba wyganiam demony."
  tags: []
"Łk11,19":
  text: "A jeśli ja przez Belzebuba wyrzucam demony, to synowie wasi przez kogo wyrzucają? Dlatego oni będą waszymi sędziami."
  tags: []
"Łk11,20":
  text: "A jeśli ja palcem Boga wyganiam demony, wtedy przyszło do was Królestwo Boga."
  tags: []
"Łk11,21":
  text: "Gdy uzbrojony siłacz strzeże swego dziedzińca, jego mienie spoczywa w pokoju;"
  tags: []
"Łk11,22":
  text: "Ale kiedy mocniejszy od niego przychodzi i zwycięża go, zabiera całą jego zbroję, w której pokładał ufność, a łupy jego rozdaje."
  tags: []
"Łk11,23":
  text: "Kto nie jest ze mną, jest przeciwko mnie, a kto nie zbiera ze mną, rozprasza."
  tags: []
"Łk11,24":
  text: "Gdy duch nieczysty wychodzi z człowieka, przechodzi przez miejsca suche, szukając odpoczynku, i gdy go nie znajdzie, mówi: Wrócę do mojego domu, skąd wyszedłem."
  tags: []
"Łk11,25":
  text: "I gdy przychodzi, znajduje go wymieciony i przyozdobiony."
  tags: []
"Łk11,26":
  text: "Wtedy idzie i bierze z sobą siedem innych duchów bardziej niegodziwych od siebie, i gdy wchodzą, mieszkają tam; i końcowy stan tego człowieka staje się gorszy niż pierwszy."
  tags: []
"Łk11,27":
  text: "I stało się, gdy On to mówił, że pewna kobieta z tłumu podniosła swój głos i powiedziała: Błogosławione łono, które Cię nosiło, i piersi, które ssałeś!"
  tags: []
"Łk11,28":
  text: "A On powiedział: Błogosławieni są raczej ci, którzy słuchają Słowa Bożego i go strzegą."
  tags: []
"Łk11,29":
  text: "A gdy zgromadzał się tłum, zaczął mówić: To pokolenie jest złe; żąda znaku, ale nie będzie mu dany znak, jak tylko znak proroka Jonasza."
  tags: []
"Łk11,30":
  text: "Albowiem jak Jonasz stał się znakiem dla mieszkańców Niniwy, tak będzie i Syn Człowieczy znakiem dla tego pokolenia."
  tags: []
"Łk11,31":
  text: "Królowa z południa powstanie na sąd z mężami tego pokolenia i uzna ich za zasługujących na karę; bo przyszła z krańców ziemi, aby słuchać mądrości Salomona; a oto tutaj ktoś więcej niż Salomon."
  tags: []
"Łk11,32":
  text: "Mężowie z Niniwy staną na sądzie z tym pokoleniem i uznają ich za zasługujących na karę; bo upamiętali się wskutek głoszenia Jonasza; a oto tutaj ktoś więcej niż Jonasz."
  tags: []
"Łk11,33":
  text: "A nikt, gdy zapali lampę, nie stawia jej w ukryciu, ani pod korcem, ale na świeczniku, aby ci, którzy wchodzą, widzieli światło."
  tags: []
"Łk11,34":
  text: "Lampą ciała jest oko; jeśli więc twoje oko jest prosto patrzące, całe twoje ciało jest jasne; a jeśli byłoby złe, i twoje ciało będzie ciemne."
  tags: []
"Łk11,35":
  text: "Uważaj więc, czy światło w tobie nie jest ciemnością."
  tags: []
"Łk11,36":
  text: "Jeśli więc całe twoje ciało jest jasne, nie mając w sobie jakiejś części ciemnej, będzie całe tak jasne, jak gdyby cię lampa blaskiem oświeciła."
  tags: []
"Łk11,37":
  text: "A gdy to mówił, zaprosił Go pewien faryzeusz, aby u niego zjadł obiad; a gdy wszedł, spoczął przy stole."
  tags: []
"Łk11,38":
  text: "A widząc to faryzeusz, zdziwił się, że najpierw nie zanurzył rąk przed obiadem."
  tags: []
"Łk11,39":
  text: "A Pan powiedział do niego: Teraz wy, faryzeusze, oczyszczacie to, co jest na zewnątrz kubka i misy; ale to, co jest wewnątrz was, pełne jest grabieży i niegodziwości."
  tags: []
"Łk11,40":
  text: "Bezmyślni! Czy ten, który uczynił to, co jest zewnątrz, nie uczynił też tego, co jest wewnątrz?"
  tags: []
"Łk11,41":
  text: "Raczej z tego, co jest wewnątrz, ofiarujcie dar miłosierdzia; a oto, wszystko będzie dla was czyste."
  tags: []
"Łk11,42":
  text: "Ale biada wam faryzeuszom, gdyż dajecie dziesięcinę z mięty i z ruty, i z każdego ziela, a omijacie sprawiedliwość i miłość Boga; te rzeczy trzeba było czynić, a tamtych nie opuszczać."
  tags: []
"Łk11,43":
  text: "Biada wam faryzeuszom, gdyż miłujecie pierwsze ławy w synagogach i pozdrowienia na rynkach."
  tags: []
"Łk11,44":
  text: "Biada wam, uczeni w Piśmie i faryzeusze, obłudnicy! Bo jesteście jak grobowce nieoznaczone, a ludzie, którzy po nich chodzą, nie wiedzą o tym."
  tags: []
"Łk11,45":
  text: "A w odpowiedzi, pewien znawca Prawa powiedział do niego: Nauczycielu! To mówiąc i nas znieważasz."
  tags: []
"Łk11,46":
  text: "A On powiedział: I wam, znawcom Prawa biada, że obciążacie ludzi ciężarami niemożliwymi do uniesienia, a sami nawet jednym ze swoich palców tych ciężarów nie dotykacie."
  tags: []
"Łk11,47":
  text: "Biada wam, że budujecie grobowce prorokom, a wasi ojcowie ich pozabijali."
  tags: []
"Łk11,48":
  text: "A zatem świadczycie, że zgadzacie się z czynami swoich ojców. Oni ich wprawdzie pozabijali, a wy budujecie ich grobowce."
  tags: []
"Łk11,49":
  text: "Dlatego też i Mądrość Boża powiedziała: Poślę do nich proroków i apostołów, a z nich niektórych zabiją i będą prześladować;"
  tags: []
"Łk11,50":
  text: "Aby zażądano od tego pokolenia krwi wszystkich proroków, która jest przelana od założenia świata,"
  tags: []
"Łk11,51":
  text: "Od krwi Abla aż do krwi Zachariasza, który zginął pomiędzy ołtarzem a domem Boga; tak, mówię wam, zostanie zażądana od tego pokolenia."
  tags: []
"Łk11,52":
  text: "Biada wam, znawcom Prawa, że zabraliście klucz poznania; sami nie weszliście, a tym, którzy chcą wejść, przeszkodziliście."
  tags: []
"Łk11,53":
  text: "A gdy im to mówił, zaczęli uczeni w Piśmie i faryzeusze gwałtownie występować przeciwko Niemu i wypytywać Go odnośnie wielu rzeczy,"
  tags: []
"Łk11,54":
  text: "Zastawiając pułapkę na Niego i dążąc, aby Go pochwycić na jakimś słowie z Jego ust, aby Go oskarżyć."
  tags: []
