"Łk11,1": "I stało się, że Jezus modlił się w pewnym miejscu, i gdy skończył, jeden z Jego uczniów powiedział: Panie! Naucz nas modlić się, jak i Jan nauczył swoich uczniów."
"Łk11,2": "Powiedział więc im: Kiedy modlicie się, mówcie: Ojcze nasz, który jesteś w niebiosach! Niech Twoje imię zostanie uświęcone; niech przyjdzie Twoje Królestwo; niech się stanie Twoja wola, jak w niebie, tak i na ziemi."
"Łk11,3": "Chleba naszego codziennego daj nam na każdy dzień."
"Łk11,4": "I odpuść nam nasze grzechy; albowiem i my sami odpuszczamy każdemu, kto wobec nas jest winny. I nie wprowadź nas w pokusę, ale nas uratuj od złego."
"Łk11,5": "I powiedział do nich: Kto z was mając przyjaciela, pójdzie do niego o północy i powie do niego: Przyjacielu! Pożycz mi trzy chleby;"
"Łk11,6": "Ponieważ przyjaciel mój przybył do mnie z drogi, a nie mam, co przed nim położyć."
"Łk11,7": "A on będąc w środku, w odpowiedzi, rzekłby: Nie zadawaj mi trudu; już drzwi zamknięte, a dzieciątka moje są ze mną w łóżku; nie mogę wstać i dać ci."
"Łk11,8": "Mówię wam: Nawet gdyby nie wstał i nie dał, mimo że jest jego przyjacielem, to wstanie i na pewno da z powodu jego natręctwa, tyle ile potrzebuje."
"Łk11,9": "I ja wam mówię: Proście, a będzie wam dane; szukajcie, a znajdziecie; pukajcie, a będzie wam otworzone."
"Łk11,10": "Każdy bowiem, kto prosi, otrzymuje; a kto szuka, znajduje; a temu, co puka, zostanie otworzone."
"Łk11,11": "A jeśli jakiegoś ojca pośród was, syn poprosi o chleb, czy poda mu kamień? A jeśli o rybę, czy zamiast ryby poda mu węża?"
"Łk11,12": "A jeśli prosi o jajko, czy poda mu skorpiona?"
"Łk11,13": "Jeśli więc wy, będąc złymi, umiecie dawać dobre dary swoim dzieciom, o ileż bardziej Ojciec wasz z nieba da Ducha Świętego tym, którzy Go proszą?"
"Łk11,14": "I wypędzał demona z człowieka, a ten był niemy; stało się, gdy wyszedł ów demon, że niemy przemówił; a tłumy zdziwiły się."
"Łk11,15": "Lecz niektórzy z nich mówili: Przez Belzebuba, władcę demonów, wyrzuca demony."
"Łk11,16": "A inni, wystawiając Go na próbę, żądali od Niego znaku z nieba."
"Łk11,17": "Ale On, znając ich myśli, powiedział im: Każde królestwo, które zostało podzielone samo w sobie, pustoszeje, a dom na dom się wali."
"Łk11,18": "A jeśli i szatan podzielony jest sam w sobie, jak ostoi się jego królestwo? Bo mówicie, że ja przez Belzebuba wyganiam demony."
"Łk11,19": "A jeśli ja przez Belzebuba wyrzucam demony, to synowie wasi przez kogo wyrzucają? Dlatego oni będą waszymi sędziami."
"Łk11,20": "A jeśli ja palcem Boga wyganiam demony, wtedy przyszło do was Królestwo Boga."
"Łk11,21": "Gdy uzbrojony siłacz strzeże swego dziedzińca, jego mienie spoczywa w pokoju;"
"Łk11,22": "Ale kiedy mocniejszy od niego przychodzi i zwycięża go, zabiera całą jego zbroję, w której pokładał ufność, a łupy jego rozdaje."
"Łk11,23": "Kto nie jest ze mną, jest przeciwko mnie, a kto nie zbiera ze mną, rozprasza."
"Łk11,24": "Gdy duch nieczysty wychodzi z człowieka, przechodzi przez miejsca suche, szukając odpoczynku, i gdy go nie znajdzie, mówi: Wrócę do mojego domu, skąd wyszedłem."
"Łk11,25": "I gdy przychodzi, znajduje go wymieciony i przyozdobiony."
"Łk11,26": "Wtedy idzie i bierze z sobą siedem innych duchów bardziej niegodziwych od siebie, i gdy wchodzą, mieszkają tam; i końcowy stan tego człowieka staje się gorszy niż pierwszy."
"Łk11,27": "I stało się, gdy On to mówił, że pewna kobieta z tłumu podniosła swój głos i powiedziała: Błogosławione łono, które Cię nosiło, i piersi, które ssałeś!"
"Łk11,28": "A On powiedział: Błogosławieni są raczej ci, którzy słuchają Słowa Bożego i go strzegą."
"Łk11,29": "A gdy zgromadzał się tłum, zaczął mówić: To pokolenie jest złe; żąda znaku, ale nie będzie mu dany znak, jak tylko znak proroka Jonasza."
"Łk11,30": "Albowiem jak Jonasz stał się znakiem dla mieszkańców Niniwy, tak będzie i Syn Człowieczy znakiem dla tego pokolenia."
"Łk11,31": "Królowa z południa powstanie na sąd z mężami tego pokolenia i uzna ich za zasługujących na karę; bo przyszła z krańców ziemi, aby słuchać mądrości Salomona; a oto tutaj ktoś więcej niż Salomon."
"Łk11,32": "Mężowie z Niniwy staną na sądzie z tym pokoleniem i uznają ich za zasługujących na karę; bo upamiętali się wskutek głoszenia Jonasza; a oto tutaj ktoś więcej niż Jonasz."
"Łk11,33": "A nikt, gdy zapali lampę, nie stawia jej w ukryciu, ani pod korcem, ale na świeczniku, aby ci, którzy wchodzą, widzieli światło."
"Łk11,34": "Lampą ciała jest oko; jeśli więc twoje oko jest prosto patrzące, całe twoje ciało jest jasne; a jeśli byłoby złe, i twoje ciało będzie ciemne."
"Łk11,35": "Uważaj więc, czy światło w tobie nie jest ciemnością."
"Łk11,36": "Jeśli więc całe twoje ciało jest jasne, nie mając w sobie jakiejś części ciemnej, będzie całe tak jasne, jak gdyby cię lampa blaskiem oświeciła."
"Łk11,37": "A gdy to mówił, zaprosił Go pewien faryzeusz, aby u niego zjadł obiad; a gdy wszedł, spoczął przy stole."
"Łk11,38": "A widząc to faryzeusz, zdziwił się, że najpierw nie zanurzył rąk przed obiadem."
"Łk11,39": "A Pan powiedział do niego: Teraz wy, faryzeusze, oczyszczacie to, co jest na zewnątrz kubka i misy; ale to, co jest wewnątrz was, pełne jest grabieży i niegodziwości."
"Łk11,40": "Bezmyślni! Czy ten, który uczynił to, co jest zewnątrz, nie uczynił też tego, co jest wewnątrz?"
"Łk11,41": "Raczej z tego, co jest wewnątrz, ofiarujcie dar miłosierdzia; a oto, wszystko będzie dla was czyste."
"Łk11,42": "Ale biada wam faryzeuszom, gdyż dajecie dziesięcinę z mięty i z ruty, i z każdego ziela, a omijacie sprawiedliwość i miłość Boga; te rzeczy trzeba było czynić, a tamtych nie opuszczać."
"Łk11,43": "Biada wam faryzeuszom, gdyż miłujecie pierwsze ławy w synagogach i pozdrowienia na rynkach."
"Łk11,44": "Biada wam, uczeni w Piśmie i faryzeusze, obłudnicy! Bo jesteście jak grobowce nieoznaczone, a ludzie, którzy po nich chodzą, nie wiedzą o tym."
"Łk11,45": "A w odpowiedzi, pewien znawca Prawa powiedział do niego: Nauczycielu! To mówiąc i nas znieważasz."
"Łk11,46": "A On powiedział: I wam, znawcom Prawa biada, że obciążacie ludzi ciężarami niemożliwymi do uniesienia, a sami nawet jednym ze swoich palców tych ciężarów nie dotykacie."
"Łk11,47": "Biada wam, że budujecie grobowce prorokom, a wasi ojcowie ich pozabijali."
"Łk11,48": "A zatem świadczycie, że zgadzacie się z czynami swoich ojców. Oni ich wprawdzie pozabijali, a wy budujecie ich grobowce."
"Łk11,49": "Dlatego też i Mądrość Boża powiedziała: Poślę do nich proroków i apostołów, a z nich niektórych zabiją i będą prześladować;"
"Łk11,50": "Aby zażądano od tego pokolenia krwi wszystkich proroków, która jest przelana od założenia świata,"
"Łk11,51": "Od krwi Abla aż do krwi Zachariasza, który zginął pomiędzy ołtarzem a domem Boga; tak, mówię wam, zostanie zażądana od tego pokolenia."
"Łk11,52": "Biada wam, znawcom Prawa, że zabraliście klucz poznania; sami nie weszliście, a tym, którzy chcą wejść, przeszkodziliście."
"Łk11,53": "A gdy im to mówił, zaczęli uczeni w Piśmie i faryzeusze gwałtownie występować przeciwko Niemu i wypytywać Go odnośnie wielu rzeczy,"
"Łk11,54": "Zastawiając pułapkę na Niego i dążąc, aby Go pochwycić na jakimś słowie z Jego ust, aby Go oskarżyć."
