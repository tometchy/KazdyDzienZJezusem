"Łk8,1":
  text: "I stało się, że przechodził On kolejno po miastach i wioskach, głosząc i opowiadając dobrą nowinę o Królestwie Bożym, a wraz z Nim dwunastu,"
  tags: []
"Łk8,2":
  text: "I pewne kobiety, które uzdrowił od złych duchów i od chorób: Maria, którą nazywano Magdaleną, z której wyszło siedem demonów,"
  tags: []
"Łk8,3":
  text: "I Joanna, żona Chuzy, zarządcy Heroda, i Zuzanna, i wiele innych, które Mu służyły ze swojego mienia."
  tags: []
"Łk8,4":
  text: "A gdy gromadził się wielki tłum, a ludzie przybywali z różnych miast do Niego, powiedział w podobieństwie:"
  tags: []
"Łk8,5":
  text: "Siewca wyszedł zasiać swoje ziarno; a gdy on siał, jedno padło przy drodze, i zostało podeptane; a ptaki z nieba je wyjadły."
  tags: []
"Łk8,6":
  text: "A drugie padło na skałę; gdy wzeszło, uschło, gdyż nie miało wilgoci."
  tags: []
"Łk8,7":
  text: "A inne padło w sam środek cierni; a ciernie razem z nim wzrosły i zadusiły je."
  tags: []
"Łk8,8":
  text: "A jeszcze inne padło na dobrą ziemię, i gdy wzeszło, wydało plon stokrotny. To mówiąc, zawołał: Kto ma uszy, by słuchać, niech słucha!"
  tags: []
"Łk8,9":
  text: "I pytali Go uczniowie Jego, mówiąc: Co może znaczyć to podobieństwo?"
  tags: []
"Łk8,10":
  text: "A On powiedział im: Wam dane jest poznać tajemnice Królestwa Bożego, lecz pozostałym podaje się je w podobieństwach, aby patrząc nie widzieli i słysząc nie rozumieli."
  tags: []
"Łk8,11":
  text: "A to podobieństwo ma takie znaczenie: Ziarnem jest Słowo Boże,"
  tags: []
"Łk8,12":
  text: "A tymi przy drodze są ci, którzy słuchają; potem przychodzi diabeł i wybiera słowo z ich serca, aby nie uwierzyli i nie byli zbawieni."
  tags: []
"Łk8,13":
  text: "A tymi na skale są ci, którzy słuchają i z radością przyjmują słowo; lecz nie mają korzenia, do czasu wierzą, a w czasie próby odstępują."
  tags: []
"Łk8,14":
  text: "A to, które padło między ciernie, to ci, którzy słuchają słowa; ale idąc, są zaduszeni przez troski i bogactwa oraz przyjemności życia, i nie dochodzą do dojrzałości."
  tags: []
"Łk8,15":
  text: "A to, które padło na dobrą ziemię, to ci, którzy w szlachetnym i dobrym sercu zachowują w wytrwałości usłyszane słowo i przynoszą plon."
  tags: []
"Łk8,16":
  text: "A nikt, kto zapalił lampę, nie nakrywa jej naczyniem, ani nie wkłada pod łóżko; ale ją stawia na świeczniku, aby ci, którzy wchodzą, widzieli światło."
  tags: []
"Łk8,17":
  text: "Bo nie ma nic ukrytego, co nie stanie się widoczne, ani zakrytego, co nie zostanie poznane i nie wyjdzie na jaw."
  tags: []
"Łk8,18":
  text: "Dlatego zwróćcie uwagę, jak słuchacie; albowiem kto ma, temu będzie dane, a kto nie ma, i to, co wydaje się mu, że ma, będzie odebrane."
  tags: []
"Łk8,19":
  text: "Wtedy przybyli do Niego matka i Jego bracia; i nie mogli spotkać się z Nim z powodu tłumu."
  tags: []
"Łk8,20":
  text: "I oznajmiono Mu, mówiąc: Twoja matka i Twoi bracia stoją na zewnątrz i chcą Cię zobaczyć."
  tags: []
"Łk8,21":
  text: "A On w odpowiedzi, rzekł do nich: Matką moją i moimi braćmi są ci, którzy słuchają Słowa Bożego i je wykonują."
  tags: []
"Łk8,22":
  text: "I stało się jednego dnia, że wstąpił do łodzi On i Jego uczniowie, i powiedział do nich: Przeprawmy się na drugą stronę jeziora. I wypłynęli."
  tags: []
"Łk8,23":
  text: "A gdy oni płynęli, zasnął. Wtedy spadło na jezioro potężne uderzenie wiatru i zostali zalani wodą, i byli w niebezpieczeństwie."
  tags: []
"Łk8,24":
  text: "Zbliżyli się więc i obudzili Go, mówiąc: Mistrzu, Mistrzu! Giniemy. A On rozbudził się, zgromił wiatr i wzburzone fale; i przestały, i nastała cisza."
  tags: []
"Łk8,25":
  text: "Powiedział więc im: Gdzie jest wasza wiara? A oni zalęknieni, dziwili się i mówili jedni do drugich: Kim więc jest Ten, że i wiatrom i wodzie rozkazuje, i są Mu posłuszne?"
  tags: []
"Łk8,26":
  text: "I przybyli do brzegu, do krainy Gadareńczyków, która jest naprzeciwko Galilei."
  tags: []
"Łk8,27":
  text: "A gdy On wyszedł na ląd, wyszedł Mu naprzeciw pewien człowiek z miasta, który miał demony i od dłuższego czasu nie zakładał szaty, i nie mieszkał w domu, tylko w grobowcach."
  tags: []
"Łk8,28":
  text: "A gdy ten ujrzał Jezusa, z krzykiem przypadł do Niego i potężnym głosem powiedział: Co ja mam z Tobą, Jezusie, Synu Boga Najwyższego?! Proszę Cię, abyś mnie nie dręczył."
  tags: []
"Łk8,29":
  text: "Rozkazał bowiem duchowi nieczystemu wyjść z tego człowieka; bo od dłuższego czasu porywał go, a chociaż go wiązano łańcuchami i strzeżono go w dybach, jednak rwał te więzy i był pędzony przez demona na pustkowia."
  tags: []
"Łk8,30":
  text: "A Jezus zapytał go, mówiąc: Jakie jest twoje imię? A on powiedział: Legion; albowiem wiele demonów w niego wstąpiło."
  tags: []
"Łk8,31":
  text: "I prosiły Go, aby im nie kazał odejść do otchłani."
  tags: []
"Łk8,32":
  text: "A była tam wielka trzoda świń, które pasły się na górze; i prosiły Go, aby im pozwolił w nie wejść. I pozwolił im."
  tags: []
"Łk8,33":
  text: "A gdy demony wyszły z tego człowieka, weszły w świnie i stado ruszyło w dół zbocza do jeziora, i utonęło."
  tags: []
"Łk8,34":
  text: "Pasterze więc widząc, co się stało, uciekli; odeszli i oznajmili to w mieście i w wioskach."
  tags: []
"Łk8,35":
  text: "Ludzie natomiast wyszli, aby zobaczyć, co się stało; a gdy przyszli do Jezusa, znaleźli człowieka, z którego wyszły demony, ubranego i przy zdrowych zmysłach siedzącego u stóp Jezusa, i przestraszyli się."
  tags: []
"Łk8,36":
  text: "A opowiedzieli im ci, którzy widzieli, jak ten opętany został uzdrowiony."
  tags: []
"Łk8,37":
  text: "I prosiło Go całe mnóstwo Gadareńczyków z okolicznej krainy, aby odszedł od nich; albowiem ogarnął ich wielki strach. A On, wstąpił do łodzi i zawrócił."
  tags: []
"Łk8,38":
  text: "I prosił Go mężczyzna, z którego wyszły demony, by mógł z Nim być; lecz Jezus odprawił go, mówiąc:"
  tags: []
"Łk8,39":
  text: "Wróć do swojego domu i opowiadaj, jak wiele uczynił dla ciebie Bóg. I odszedł, głosząc po całym mieście, jak wiele uczynił mu Jezus."
  tags: []
"Łk8,40":
  text: "I stało się, gdy Jezus wrócił, że tłum przyjął Go z radością; albowiem wszyscy Go oczekiwali."
  tags: []
"Łk8,41":
  text: "A oto przyszedł mąż, imieniem Jair, a był on przełożonym synagogi. A gdy upadł do stóp Jezusa, prosił Go, aby wszedł do jego domu."
  tags: []
"Łk8,42":
  text: "Albowiem miał córkę jedynaczkę, która miała około dwunastu lat, a ta umierała. A gdy On szedł, naciskały na Niego tłumy."
  tags: []
"Łk8,43":
  text: "A kobieta, mająca od dwunastu lat upływ krwi, która wszystkie swoje środki na życie wydała u lekarzy, a nie mogła zostać przez żadnego z nich uleczona,"
  tags: []
"Łk8,44":
  text: "Podeszła z tyłu i dotknęła się skraju Jego szaty; i natychmiast ustał jej upływ krwi."
  tags: []
"Łk8,45":
  text: "I Jezus powiedział: Kto mnie dotknął? A gdy wszyscy wypierali się, powiedział Piotr i ci, którzy byli z Nim: Mistrzu! Tłumy cisną się i tłoczą, a Ty mówisz: Kto mnie dotknął?"
  tags: []
"Łk8,46":
  text: "A Jezus powiedział: Ktoś mnie dotknął, bo poznałem, że moc wyszła ze mnie."
  tags: []
"Łk8,47":
  text: "A widząc kobieta, że nie uszła uwadze, przystąpiła z drżeniem i padła przed Nim, i powiedziała Mu przed całym ludem, z jakiego powodu dotknęła się Go, i jak od razu została uzdrowiona."
  tags: []
"Łk8,48":
  text: "A On jej powiedział: Ufaj, córko! Wiara twoja cię ocaliła. Idź w pokoju."
  tags: []
"Łk8,49":
  text: "Gdy On jeszcze to mówił, przyszedł ktoś z domu przełożonego synagogi, mówiąc: Twoja córka umarła, nie trudź nauczyciela."
  tags: []
"Łk8,50":
  text: "Ale Jezus, gdy to usłyszał, odpowiedział mu, mówiąc: Nie bój się; jedynie wierz, a zostanie ocalona."
  tags: []
"Łk8,51":
  text: "A po przybyciu do domu, nie pozwolił wejść nikomu, tylko Piotrowi i Jakubowi, i Janowi, ojcu i matce dziewczynki."
  tags: []
"Łk8,52":
  text: "A wszyscy płakali i bili się w pierś z żalu za nią. Lecz On powiedział: Nie płaczcie! Nie umarła, ale śpi."
  tags: []
"Łk8,53":
  text: "I naśmiewali się z Niego, wiedząc, że umarła."
  tags: []
"Łk8,54":
  text: "A On usunął wszystkich na zewnątrz, ujął ją za rękę i głośno powiedział: Dziewczynko, wstań!"
  tags: []
"Łk8,55":
  text: "I duch jej powrócił, i natychmiast wstała; i zarządził, aby dano jej jeść."
  tags: []
"Łk8,56":
  text: "I zdumieli się jej rodzice. A On im nakazał, aby nikomu nie opowiadali o tym, co się stało."
  tags: []
