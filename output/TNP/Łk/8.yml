"Łk8,1": "I stało się, że przechodził On kolejno po miastach i wioskach, głosząc i opowiadając dobrą nowinę o Królestwie Bożym, a wraz z Nim dwunastu,"
"Łk8,2": "I pewne kobiety, które uzdrowił od złych duchów i od chorób: Maria, którą nazywano Magdaleną, z której wyszło siedem demonów,"
"Łk8,3": "I Joanna, żona Chuzy, zarządcy Heroda, i Zuzanna, i wiele innych, które Mu służyły ze swojego mienia."
"Łk8,4": "A gdy gromadził się wielki tłum, a ludzie przybywali z różnych miast do Niego, powiedział w podobieństwie:"
"Łk8,5": "Siewca wyszedł zasiać swoje ziarno; a gdy on siał, jedno padło przy drodze, i zostało podeptane; a ptaki z nieba je wyjadły."
"Łk8,6": "A drugie padło na skałę; gdy wzeszło, uschło, gdyż nie miało wilgoci."
"Łk8,7": "A inne padło w sam środek cierni; a ciernie razem z nim wzrosły i zadusiły je."
"Łk8,8": "A jeszcze inne padło na dobrą ziemię, i gdy wzeszło, wydało plon stokrotny. To mówiąc, zawołał: Kto ma uszy, by słuchać, niech słucha!"
"Łk8,9": "I pytali Go uczniowie Jego, mówiąc: Co może znaczyć to podobieństwo?"
"Łk8,10": "A On powiedział im: Wam dane jest poznać tajemnice Królestwa Bożego, lecz pozostałym podaje się je w podobieństwach, aby patrząc nie widzieli i słysząc nie rozumieli."
"Łk8,11": "A to podobieństwo ma takie znaczenie: Ziarnem jest Słowo Boże,"
"Łk8,12": "A tymi przy drodze są ci, którzy słuchają; potem przychodzi diabeł i wybiera słowo z ich serca, aby nie uwierzyli i nie byli zbawieni."
"Łk8,13": "A tymi na skale są ci, którzy słuchają i z radością przyjmują słowo; lecz nie mają korzenia, do czasu wierzą, a w czasie próby odstępują."
"Łk8,14": "A to, które padło między ciernie, to ci, którzy słuchają słowa; ale idąc, są zaduszeni przez troski i bogactwa oraz przyjemności życia, i nie dochodzą do dojrzałości."
"Łk8,15": "A to, które padło na dobrą ziemię, to ci, którzy w szlachetnym i dobrym sercu zachowują w wytrwałości usłyszane słowo i przynoszą plon."
"Łk8,16": "A nikt, kto zapalił lampę, nie nakrywa jej naczyniem, ani nie wkłada pod łóżko; ale ją stawia na świeczniku, aby ci, którzy wchodzą, widzieli światło."
"Łk8,17": "Bo nie ma nic ukrytego, co nie stanie się widoczne, ani zakrytego, co nie zostanie poznane i nie wyjdzie na jaw."
"Łk8,18": "Dlatego zwróćcie uwagę, jak słuchacie; albowiem kto ma, temu będzie dane, a kto nie ma, i to, co wydaje się mu, że ma, będzie odebrane."
"Łk8,19": "Wtedy przybyli do Niego matka i Jego bracia; i nie mogli spotkać się z Nim z powodu tłumu."
"Łk8,20": "I oznajmiono Mu, mówiąc: Twoja matka i Twoi bracia stoją na zewnątrz i chcą Cię zobaczyć."
"Łk8,21": "A On w odpowiedzi, rzekł do nich: Matką moją i moimi braćmi są ci, którzy słuchają Słowa Bożego i je wykonują."
"Łk8,22": "I stało się jednego dnia, że wstąpił do łodzi On i Jego uczniowie, i powiedział do nich: Przeprawmy się na drugą stronę jeziora. I wypłynęli."
"Łk8,23": "A gdy oni płynęli, zasnął. Wtedy spadło na jezioro potężne uderzenie wiatru i zostali zalani wodą, i byli w niebezpieczeństwie."
"Łk8,24": "Zbliżyli się więc i obudzili Go, mówiąc: Mistrzu, Mistrzu! Giniemy. A On rozbudził się, zgromił wiatr i wzburzone fale; i przestały, i nastała cisza."
"Łk8,25": "Powiedział więc im: Gdzie jest wasza wiara? A oni zalęknieni, dziwili się i mówili jedni do drugich: Kim więc jest Ten, że i wiatrom i wodzie rozkazuje, i są Mu posłuszne?"
"Łk8,26": "I przybyli do brzegu, do krainy Gadareńczyków, która jest naprzeciwko Galilei."
"Łk8,27": "A gdy On wyszedł na ląd, wyszedł Mu naprzeciw pewien człowiek z miasta, który miał demony i od dłuższego czasu nie zakładał szaty, i nie mieszkał w domu, tylko w grobowcach."
"Łk8,28": "A gdy ten ujrzał Jezusa, z krzykiem przypadł do Niego i potężnym głosem powiedział: Co ja mam z Tobą, Jezusie, Synu Boga Najwyższego?! Proszę Cię, abyś mnie nie dręczył."
"Łk8,29": "Rozkazał bowiem duchowi nieczystemu wyjść z tego człowieka; bo od dłuższego czasu porywał go, a chociaż go wiązano łańcuchami i strzeżono go w dybach, jednak rwał te więzy i był pędzony przez demona na pustkowia."
"Łk8,30": "A Jezus zapytał go, mówiąc: Jakie jest twoje imię? A on powiedział: Legion; albowiem wiele demonów w niego wstąpiło."
"Łk8,31": "I prosiły Go, aby im nie kazał odejść do otchłani."
"Łk8,32": "A była tam wielka trzoda świń, które pasły się na górze; i prosiły Go, aby im pozwolił w nie wejść. I pozwolił im."
"Łk8,33": "A gdy demony wyszły z tego człowieka, weszły w świnie i stado ruszyło w dół zbocza do jeziora, i utonęło."
"Łk8,34": "Pasterze więc widząc, co się stało, uciekli; odeszli i oznajmili to w mieście i w wioskach."
"Łk8,35": "Ludzie natomiast wyszli, aby zobaczyć, co się stało; a gdy przyszli do Jezusa, znaleźli człowieka, z którego wyszły demony, ubranego i przy zdrowych zmysłach siedzącego u stóp Jezusa, i przestraszyli się."
"Łk8,36": "A opowiedzieli im ci, którzy widzieli, jak ten opętany został uzdrowiony."
"Łk8,37": "I prosiło Go całe mnóstwo Gadareńczyków z okolicznej krainy, aby odszedł od nich; albowiem ogarnął ich wielki strach. A On, wstąpił do łodzi i zawrócił."
"Łk8,38": "I prosił Go mężczyzna, z którego wyszły demony, by mógł z Nim być; lecz Jezus odprawił go, mówiąc:"
"Łk8,39": "Wróć do swojego domu i opowiadaj, jak wiele uczynił dla ciebie Bóg. I odszedł, głosząc po całym mieście, jak wiele uczynił mu Jezus."
"Łk8,40": "I stało się, gdy Jezus wrócił, że tłum przyjął Go z radością; albowiem wszyscy Go oczekiwali."
"Łk8,41": "A oto przyszedł mąż, imieniem Jair, a był on przełożonym synagogi. A gdy upadł do stóp Jezusa, prosił Go, aby wszedł do jego domu."
"Łk8,42": "Albowiem miał córkę jedynaczkę, która miała około dwunastu lat, a ta umierała. A gdy On szedł, naciskały na Niego tłumy."
"Łk8,43": "A kobieta, mająca od dwunastu lat upływ krwi, która wszystkie swoje środki na życie wydała u lekarzy, a nie mogła zostać przez żadnego z nich uleczona,"
"Łk8,44": "Podeszła z tyłu i dotknęła się skraju Jego szaty; i natychmiast ustał jej upływ krwi."
"Łk8,45": "I Jezus powiedział: Kto mnie dotknął? A gdy wszyscy wypierali się, powiedział Piotr i ci, którzy byli z Nim: Mistrzu! Tłumy cisną się i tłoczą, a Ty mówisz: Kto mnie dotknął?"
"Łk8,46": "A Jezus powiedział: Ktoś mnie dotknął, bo poznałem, że moc wyszła ze mnie."
"Łk8,47": "A widząc kobieta, że nie uszła uwadze, przystąpiła z drżeniem i padła przed Nim, i powiedziała Mu przed całym ludem, z jakiego powodu dotknęła się Go, i jak od razu została uzdrowiona."
"Łk8,48": "A On jej powiedział: Ufaj, córko! Wiara twoja cię ocaliła. Idź w pokoju."
"Łk8,49": "Gdy On jeszcze to mówił, przyszedł ktoś z domu przełożonego synagogi, mówiąc: Twoja córka umarła, nie trudź nauczyciela."
"Łk8,50": "Ale Jezus, gdy to usłyszał, odpowiedział mu, mówiąc: Nie bój się; jedynie wierz, a zostanie ocalona."
"Łk8,51": "A po przybyciu do domu, nie pozwolił wejść nikomu, tylko Piotrowi i Jakubowi, i Janowi, ojcu i matce dziewczynki."
"Łk8,52": "A wszyscy płakali i bili się w pierś z żalu za nią. Lecz On powiedział: Nie płaczcie! Nie umarła, ale śpi."
"Łk8,53": "I naśmiewali się z Niego, wiedząc, że umarła."
"Łk8,54": "A On usunął wszystkich na zewnątrz, ujął ją za rękę i głośno powiedział: Dziewczynko, wstań!"
"Łk8,55": "I duch jej powrócił, i natychmiast wstała; i zarządził, aby dano jej jeść."
"Łk8,56": "I zdumieli się jej rodzice. A On im nakazał, aby nikomu nie opowiadali o tym, co się stało."
