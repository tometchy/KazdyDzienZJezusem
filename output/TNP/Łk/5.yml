"Łk5,1": "I stało się, gdy lud napierał na Niego, by słuchać Słowa Bożego, a On stał nad jeziorem Genezaret,"
"Łk5,2": "Że zobaczył dwie łodzie stojące przy jeziorze; a rybacy wyszli z nich i płukali sieci."
"Łk5,3": "A gdy wstąpił do jednej z tych łodzi, która była Szymona, poprosił go, aby nieco odpłynął od lądu; a gdy usiadł, nauczał tłumy z łodzi."
"Łk5,4": "A gdy przestał mówić, powiedział do Szymona: Wypłyń na głębię i zapuśćcie swoje sieci rybackie na połów."
"Łk5,5": "A Szymon w odpowiedzi, rzekł Mu: Mistrzu! Całą noc trudziliśmy się, nic nie złowiliśmy; lecz na słowo Twoje zapuszczę sieć."
"Łk5,6": "I gdy to uczynili, wspólnie zagarnęli wielką liczbę ryb, aż rwała im się sieć."
"Łk5,7": "I skinęli na współtowarzyszy, którzy byli w drugiej łodzi, aby im przyszli na pomoc; i przyszli, i napełnili obie łodzie, aż one zaczęły się zanurzać."
"Łk5,8": "A widząc to Szymon Piotr, przypadł do kolan Jezusa, mówiąc: Odejdź ode mnie Panie, bo jestem grzesznym człowiekiem!"
"Łk5,9": "Jego bowiem i wszystkich, co byli z nim, ogarnęło zdumienie z powodu połowu ryb, które złapali,"
"Łk5,10": "Podobnie i Jakuba, i Jana, synów Zebedeusza, którzy byli towarzyszami Szymona. I powiedział Jezus do Szymona: Nie bój się; od teraz będziesz łowić żywych ludzi."
"Łk5,11": "A gdy wyciągnęli łodzie na ląd, opuścili wszystko i poszli za Nim."
"Łk5,12": "I stało się, gdy był w jednym z miast, że oto zjawił się tam człowiek cały pokryty trądem; gdy ujrzał Jezusa, padł na twarz i prosił Go, mówiąc: Panie! Jeśli zechcesz, możesz mnie oczyścić."
"Łk5,13": "I Jezus wyciągnął rękę, i dotknął go, mówiąc: Chcę, zostań oczyszczony; i zaraz trąd odszedł od niego."
"Łk5,14": "A On nakazał mu, aby o tym nikomu nie mówił, lecz rzekł: Oddal się teraz i pokaż się kapłanowi, i ofiaruj za swoje oczyszczenie, tak jak nakazał Mojżesz, na świadectwo dla nich."
"Łk5,15": "Tym bardziej więc rozchodziła się wieść o Nim; i schodziły się wielkie tłumy, aby Go słuchać i być przez Niego uzdrowionymi ze swoich chorób."
"Łk5,16": "On sam natomiast usuwał się na pustkowia i tam się modlił."
"Łk5,17": "I stało się jednego dnia, gdy nauczał, a siedzieli tam faryzeusze i nauczyciele Prawa, którzy przybyli ze wszystkich miasteczek Galilei i Judy, i z Jerozolimy, że była tam obecna moc PANA, aby ich uzdrawiać."
"Łk5,18": "A oto, jacyś mężczyźni nieśli na posłaniu sparaliżowanego człowieka i szukali sposobu, by go wnieść i położyć przed Nim."
"Łk5,19": "I gdy nie znaleźli drogi, jaką mogliby go wnieść z powodu tłumu, weszli na dach, i przez pokrycie z dachówek spuścili go z łożem do środka przed Jezusa."
"Łk5,20": "A gdy zobaczył ich wiarę, powiedział do niego: Człowieku! Odpuszczone są ci twoje grzechy."
"Łk5,21": "I zaczęli rozważać uczeni w Piśmie i faryzeusze, myśląc: Kim jest Ten, co mówi te bluźnierstwa? Kto może odpuszczać grzechy, jeśli nie sam Bóg?"
"Łk5,22": "Ale Jezus dokładnie poznając ich myśli, w odpowiedzi, rzekł im: Co rozważacie w swoich sercach?"
"Łk5,23": "Co łatwiej jest powiedzieć: Odpuszczone są ci twoje grzechy, czy powiedzieć: Wstań i chodź?"
"Łk5,24": "Lecz abyście wiedzieli, że Syn Człowieczy ma władzę na ziemi odpuszczać grzechy – powiedział do sparaliżowanego: Mówię ci: Wstań, weź swoje łoże i idź do swojego domu."
"Łk5,25": "I natychmiast wstał przed nimi, wziął to, na czym leżał, i poszedł do swojego domu, chwaląc Boga."
"Łk5,26": "Wtedy uniesienie ogarnęło wszystkich i chwalili Boga, i byli wypełnieni bojaźnią, mówiąc: Widzieliśmy dziś niezwykłe rzeczy."
"Łk5,27": "A potem wyszedł i ujrzał celnika, o imieniu Lewi, siedzącego przy cle, i powiedział mu: Pójdź za mną."
"Łk5,28": "I zostawił wszystko, wstał i poszedł za Nim."
"Łk5,29": "A wyprawił Mu Lewi wielkie przyjęcie w swoim domu; i była tam wielka gromada celników i innych, którzy z Nim spoczywali przy stole."
"Łk5,30": "I szemrali uczeni w Piśmie i faryzeusze, mówiąc do Jego uczniów: Czemu jecie i pijecie z celnikami i grzesznikami?"
"Łk5,31": "A Jezus w odpowiedzi, rzekł do nich: Nie potrzebują zdrowi lekarza, ale ci, co się mają źle;"
"Łk5,32": "Nie przyszedłem wzywać do upamiętania sprawiedliwych, ale grzeszników."
"Łk5,33": "Oni jednak powiedzieli do Niego: Dlaczego uczniowie Jana często poszczą i zanoszą prośby do Boga, podobnie jak i ci uczniowie faryzeuszów, a Twoi jedzą i piją?"
"Łk5,34": "A On powiedział im: Czy możecie nakłonić przyjaciół domu weselnego, aby pościli, dopóki oblubieniec jest z nimi?"
"Łk5,35": "Ale przyjdą dni, gdy zostanie zabrany od nich oblubieniec; wówczas będą pościć."
"Łk5,36": "Powiedział im też podobieństwo: Nikt kawałkiem z nowej szaty, nie łata szaty starej; bo inaczej, to nowe jest porwane, a łata z nowego nie połączy się ze starym."
"Łk5,37": "I nikt nie leje wina młodego w stare bukłaki; bo inaczej, młode wino rozsadzi bukłaki, i wino się wyleje, a bukłaki się zniszczą."
"Łk5,38": "Ale młode wino wlewa się w nowe bukłaki, wtedy jedno i drugie jest zachowane."
"Łk5,39": "I nikt też, kto napił się starego, nie chce zaraz młodego, ale mówi: Stare jest lepsze."
