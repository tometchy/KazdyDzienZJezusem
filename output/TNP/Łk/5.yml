"Łk5,1":
  text: "I stało się, gdy lud napierał na Niego, by słuchać Słowa Bożego, a On stał nad jeziorem Genezaret,"
  tags: []
"Łk5,2":
  text: "Że zobaczył dwie łodzie stojące przy jeziorze; a rybacy wyszli z nich i płukali sieci."
  tags: []
"Łk5,3":
  text: "A gdy wstąpił do jednej z tych łodzi, która była Szymona, poprosił go, aby nieco odpłynął od lądu; a gdy usiadł, nauczał tłumy z łodzi."
  tags: []
"Łk5,4":
  text: "A gdy przestał mówić, powiedział do Szymona: Wypłyń na głębię i zapuśćcie swoje sieci rybackie na połów."
  tags: []
"Łk5,5":
  text: "A Szymon w odpowiedzi, rzekł Mu: Mistrzu! Całą noc trudziliśmy się, nic nie złowiliśmy; lecz na słowo Twoje zapuszczę sieć."
  tags: []
"Łk5,6":
  text: "I gdy to uczynili, wspólnie zagarnęli wielką liczbę ryb, aż rwała im się sieć."
  tags: []
"Łk5,7":
  text: "I skinęli na współtowarzyszy, którzy byli w drugiej łodzi, aby im przyszli na pomoc; i przyszli, i napełnili obie łodzie, aż one zaczęły się zanurzać."
  tags: []
"Łk5,8":
  text: "A widząc to Szymon Piotr, przypadł do kolan Jezusa, mówiąc: Odejdź ode mnie Panie, bo jestem grzesznym człowiekiem!"
  tags: []
"Łk5,9":
  text: "Jego bowiem i wszystkich, co byli z nim, ogarnęło zdumienie z powodu połowu ryb, które złapali,"
  tags: []
"Łk5,10":
  text: "Podobnie i Jakuba, i Jana, synów Zebedeusza, którzy byli towarzyszami Szymona. I powiedział Jezus do Szymona: Nie bój się; od teraz będziesz łowić żywych ludzi."
  tags: []
"Łk5,11":
  text: "A gdy wyciągnęli łodzie na ląd, opuścili wszystko i poszli za Nim."
  tags: []
"Łk5,12":
  text: "I stało się, gdy był w jednym z miast, że oto zjawił się tam człowiek cały pokryty trądem; gdy ujrzał Jezusa, padł na twarz i prosił Go, mówiąc: Panie! Jeśli zechcesz, możesz mnie oczyścić."
  tags: []
"Łk5,13":
  text: "I Jezus wyciągnął rękę, i dotknął go, mówiąc: Chcę, zostań oczyszczony; i zaraz trąd odszedł od niego."
  tags: []
"Łk5,14":
  text: "A On nakazał mu, aby o tym nikomu nie mówił, lecz rzekł: Oddal się teraz i pokaż się kapłanowi, i ofiaruj za swoje oczyszczenie, tak jak nakazał Mojżesz, na świadectwo dla nich."
  tags: []
"Łk5,15":
  text: "Tym bardziej więc rozchodziła się wieść o Nim; i schodziły się wielkie tłumy, aby Go słuchać i być przez Niego uzdrowionymi ze swoich chorób."
  tags: []
"Łk5,16":
  text: "On sam natomiast usuwał się na pustkowia i tam się modlił."
  tags: []
"Łk5,17":
  text: "I stało się jednego dnia, gdy nauczał, a siedzieli tam faryzeusze i nauczyciele Prawa, którzy przybyli ze wszystkich miasteczek Galilei i Judy, i z Jerozolimy, że była tam obecna moc PANA, aby ich uzdrawiać."
  tags: []
"Łk5,18":
  text: "A oto, jacyś mężczyźni nieśli na posłaniu sparaliżowanego człowieka i szukali sposobu, by go wnieść i położyć przed Nim."
  tags: []
"Łk5,19":
  text: "I gdy nie znaleźli drogi, jaką mogliby go wnieść z powodu tłumu, weszli na dach, i przez pokrycie z dachówek spuścili go z łożem do środka przed Jezusa."
  tags: []
"Łk5,20":
  text: "A gdy zobaczył ich wiarę, powiedział do niego: Człowieku! Odpuszczone są ci twoje grzechy."
  tags: []
"Łk5,21":
  text: "I zaczęli rozważać uczeni w Piśmie i faryzeusze, myśląc: Kim jest Ten, co mówi te bluźnierstwa? Kto może odpuszczać grzechy, jeśli nie sam Bóg?"
  tags: []
"Łk5,22":
  text: "Ale Jezus dokładnie poznając ich myśli, w odpowiedzi, rzekł im: Co rozważacie w swoich sercach?"
  tags: []
"Łk5,23":
  text: "Co łatwiej jest powiedzieć: Odpuszczone są ci twoje grzechy, czy powiedzieć: Wstań i chodź?"
  tags: []
"Łk5,24":
  text: "Lecz abyście wiedzieli, że Syn Człowieczy ma władzę na ziemi odpuszczać grzechy – powiedział do sparaliżowanego: Mówię ci: Wstań, weź swoje łoże i idź do swojego domu."
  tags: []
"Łk5,25":
  text: "I natychmiast wstał przed nimi, wziął to, na czym leżał, i poszedł do swojego domu, chwaląc Boga."
  tags: []
"Łk5,26":
  text: "Wtedy uniesienie ogarnęło wszystkich i chwalili Boga, i byli wypełnieni bojaźnią, mówiąc: Widzieliśmy dziś niezwykłe rzeczy."
  tags: []
"Łk5,27":
  text: "A potem wyszedł i ujrzał celnika, o imieniu Lewi, siedzącego przy cle, i powiedział mu: Pójdź za mną."
  tags: []
"Łk5,28":
  text: "I zostawił wszystko, wstał i poszedł za Nim."
  tags: []
"Łk5,29":
  text: "A wyprawił Mu Lewi wielkie przyjęcie w swoim domu; i była tam wielka gromada celników i innych, którzy z Nim spoczywali przy stole."
  tags: []
"Łk5,30":
  text: "I szemrali uczeni w Piśmie i faryzeusze, mówiąc do Jego uczniów: Czemu jecie i pijecie z celnikami i grzesznikami?"
  tags: []
"Łk5,31":
  text: "A Jezus w odpowiedzi, rzekł do nich: Nie potrzebują zdrowi lekarza, ale ci, co się mają źle;"
  tags: []
"Łk5,32":
  text: "Nie przyszedłem wzywać do upamiętania sprawiedliwych, ale grzeszników."
  tags: []
"Łk5,33":
  text: "Oni jednak powiedzieli do Niego: Dlaczego uczniowie Jana często poszczą i zanoszą prośby do Boga, podobnie jak i ci uczniowie faryzeuszów, a Twoi jedzą i piją?"
  tags: []
"Łk5,34":
  text: "A On powiedział im: Czy możecie nakłonić przyjaciół domu weselnego, aby pościli, dopóki oblubieniec jest z nimi?"
  tags: []
"Łk5,35":
  text: "Ale przyjdą dni, gdy zostanie zabrany od nich oblubieniec; wówczas będą pościć."
  tags: []
"Łk5,36":
  text: "Powiedział im też podobieństwo: Nikt kawałkiem z nowej szaty, nie łata szaty starej; bo inaczej, to nowe jest porwane, a łata z nowego nie połączy się ze starym."
  tags: []
"Łk5,37":
  text: "I nikt nie leje wina młodego w stare bukłaki; bo inaczej, młode wino rozsadzi bukłaki, i wino się wyleje, a bukłaki się zniszczą."
  tags: []
"Łk5,38":
  text: "Ale młode wino wlewa się w nowe bukłaki, wtedy jedno i drugie jest zachowane."
  tags: []
"Łk5,39":
  text: "I nikt też, kto napił się starego, nie chce zaraz młodego, ale mówi: Stare jest lepsze."
  tags: []
