"Łk7,1":
  text: "A gdy dokończył wypowiadać wszystkie swoje słowa do słuchającego Go ludu, wszedł do Kafarnaum;"
  tags: []
"Łk7,2":
  text: "A sługa pewnego setnika, bardzo ceniony przez niego, chorował i miał już umrzeć."
  tags: []
"Łk7,3":
  text: "A gdy usłyszał o Jezusie, posłał do Niego starszych żydowskich, prosząc Go, aby przyszedł i uzdrowił jego sługę."
  tags: []
"Łk7,4":
  text: "A gdy oni przybyli do Jezusa, prosili Go gorliwie, mówiąc: Godny jest tego, abyś mu to uczynił;"
  tags: []
"Łk7,5":
  text: "Albowiem miłuje nasz naród i sam zbudował nam synagogę."
  tags: []
"Łk7,6":
  text: "Wtedy Jezus wyruszył z nimi. A gdy już był blisko, niedaleko od domu, posłał setnik do Niego przyjaciół, mówiąc Mu: Panie! Nie kłopocz się; nie jestem bowiem godny, abyś wszedł pod mój dach."
  tags: []
"Łk7,7":
  text: "Dlatego i samego siebie nie uważałem za godnego, aby przyjść do Ciebie; ale nakaż słowem, a zostanie uzdrowiony mój chłopiec."
  tags: []
"Łk7,8":
  text: "Gdyż i ja jestem człowiekiem podległym władzy, a mając pod sobą żołnierzy, mówię temu: Idź, a idzie; i drugiemu: Przyjdź, a przychodzi; i swojemu słudze: Czyń to, a czyni."
  tags: []
"Łk7,9":
  text: "A gdy Jezus to usłyszał, zadziwił się nim, i obrócił się do ludu, który za Nim podążał, i powiedział: Mówię wam: Nawet w Izraelu nie znalazłem tak wielkiej wiary."
  tags: []
"Łk7,10":
  text: "A gdy wrócili do domu ci, którzy byli posłani, znaleźli chorego sługę zdrowego."
  tags: []
"Łk7,11":
  text: "I zdarzyło się w następnym dniu, że poszedł do miasta zwanego Nain, i wielu Jego uczniów szło razem z Nim oraz wielki tłum."
  tags: []
"Łk7,12":
  text: "A gdy przybliżył się do bramy miasta, oto wynoszono umarłego, jedynego syna matki, a ta była wdową, i był z nią znaczny tłum z tego miasta;"
  tags: []
"Łk7,13":
  text: "A gdy Pan ją ujrzał, ulitował się nad nią i powiedział jej: Nie płacz!"
  tags: []
"Łk7,14":
  text: "I gdy przystąpił, dotknął mar; a ci, co je nieśli, stanęli. I powiedział: Młodzieńcze! Tobie mówię, wstań."
  tags: []
"Łk7,15":
  text: "I usiadł umarły, i zaczął mówić; i oddał go jego matce."
  tags: []
"Łk7,16":
  text: "A wszystkich ogarnął lęk, i wielbili Boga, mówiąc: Wielki prorok powstał wśród nas i Bóg nawiedził swój lud."
  tags: []
"Łk7,17":
  text: "I rozeszła się o Nim ta wieść po całej Judei i po całej okolicy."
  tags: []
"Łk7,18":
  text: "O tym wszystkim oznajmili Janowi jego uczniowie."
  tags: []
"Łk7,19":
  text: "A Jan, przywołał dwóch swoich uczniów i posłał ich do Jezusa, mówiąc: Czy Ty jesteś tym, który ma przyjść, czy mamy oczekiwać innego?"
  tags: []
"Łk7,20":
  text: "A gdy owi mężowie przyszli do Niego, powiedzieli: Jan Chrzciciel posyła nas do Ciebie, mówiąc: Czy Ty jesteś tym, który ma przyjść, czy mamy oczekiwać innego?"
  tags: []
"Łk7,21":
  text: "A w tej właśnie godzinie wielu uzdrowił z chorób i udręk, od złych duchów, i wielu ślepym darował by mogli widzieć."
  tags: []
"Łk7,22":
  text: "A Jezus w odpowiedzi, rzekł im: Idźcie, oznajmijcie Janowi co widzieliście i słyszeliście, że ślepi odzyskują wzrok, chromi chodzą, trędowaci zostają oczyszczeni, głuchoniemi słyszą, umarli powstają z martwych, ubogim głoszona jest dobra nowina."
  tags: []
"Łk7,23":
  text: "A błogosławiony jest ten, który się mną nie zgorszy."
  tags: []
"Łk7,24":
  text: "A gdy odeszli posłańcy Jana, zaczął mówić do ludu o Janie: Co wyszliście zobaczyć na pustkowiu? Czy trzcinę chwiejącą się od wiatru?"
  tags: []
"Łk7,25":
  text: "Ale co wyszliście zobaczyć? Czy człowieka w miękkie szaty odzianego? Oto ci, którzy noszą wspaniałe odzienie i żyją w przepychu, są w pałacach królewskich."
  tags: []
"Łk7,26":
  text: "Ale co wyszliście zobaczyć? Czy proroka? Tak, mówię wam, i więcej niż proroka."
  tags: []
"Łk7,27":
  text: "On jest tym, o którym jest napisane: Oto Ja wysyłam swojego posłańca przed Twoim obliczem, który pójdzie przed Tobą przygotować Ci drogę."
  tags: []
"Łk7,28":
  text: "Albowiem mówię wam: Pośród narodzonych z kobiet, nikt nie jest większym prorokiem od Jana Chrzciciela; ale najmniejszy w Królestwie Bożym większy jest od niego."
  tags: []
"Łk7,29":
  text: "A cały lud, gdy to usłyszał, a także celnicy, uznali sprawiedliwość Boga; ci, którzy zostali ochrzczeni chrztem Jana."
  tags: []
"Łk7,30":
  text: "A faryzeusze i znawcy Prawa odrzucili postanowienie Boże o nich samych, bo nie zostali przez niego ochrzczeni."
  tags: []
"Łk7,31":
  text: "I powiedział Pan: Do kogo przyrównam ludzi tego pokolenia, i do kogo są podobni?"
  tags: []
"Łk7,32":
  text: "Podobni są do dzieci, siedzących na rynku i wytykających sobie nawzajem, mówiąc: Graliśmy wam na fujarce, a nie tańczyliście; śpiewaliśmy pieśni żałobne, a nie płakaliście."
  tags: []
"Łk7,33":
  text: "Albowiem przyszedł Jan Chrzciciel, nie jadł chleba i nie pił wina, a mówicie: Ma demona."
  tags: []
"Łk7,34":
  text: "Przyszedł Syn Człowieczy, je i pije, a mówicie: Oto człowiek, żarłok i pijak, przyjaciel celników i grzeszników."
  tags: []
"Łk7,35":
  text: "I tak mądrość została uznana za sprawiedliwą przez wszystkie swoje dzieci."
  tags: []
"Łk7,36":
  text: "I prosił Go pewien faryzeusz, aby z nim spożył posiłek; a gdy wszedł do domu faryzeusza, spoczął przy stole."
  tags: []
"Łk7,37":
  text: "A oto kobieta, która była w mieście grzesznicą, gdy dowiedziała się, że spoczywa przy stole w domu faryzeusza, przyniosła alabastrowy flakonik olejku,"
  tags: []
"Łk7,38":
  text: "I stanęła przy stopach Jego z tyłu, płacząc zaczęła łzami zraszać Jego stopy, a włosami swojej głowy obcierała i czule całowała Jego stopy, i namaszczała je olejkiem."
  tags: []
"Łk7,39":
  text: "A widząc to faryzeusz, który Go zaprosił, powiedział w sobie, mówiąc: Gdyby Ten był prorokiem, wiedziałby, kim i jaką jest ta kobieta, która się Go dotyka; że jest grzeszna."
  tags: []
"Łk7,40":
  text: "I Jezus w odpowiedzi, rzekł do niego: Szymonie! Mam ci coś do powiedzenia. A on powiedział: Mów, Nauczycielu!"
  tags: []
"Łk7,41":
  text: "Pewien wierzyciel miał dwóch dłużników; jeden dłużny był mu pięćset denarów, a drugi pięćdziesiąt."
  tags: []
"Łk7,42":
  text: "A gdy nie mieli czym zapłacić, obydwom darował. Powiedz więc, który z nich, będzie miłować go bardziej?"
  tags: []
"Łk7,43":
  text: "A odpowiadając Szymon, powiedział do Niego: Przypuszczam, że ten, któremu więcej darował. A On mu powiedział: Poprawnie to osądziłeś."
  tags: []
"Łk7,44":
  text: "I obrócił się do kobiety, i powiedział Szymonowi: Widzisz tę kobietę? Wszedłem do twojego domu, a nie podałeś wody dla moich stóp; ale ta łzami zrosiła moje stopy, i swoimi włosami je otarła."
  tags: []
"Łk7,45":
  text: "Nie udzieliłeś mi pocałunku; ale ta, gdy weszła, nie przestała całować moich stóp."
  tags: []
"Łk7,46":
  text: "Nie namaściłeś oliwą mojej głowy; ale ta olejkiem namaściła moje stopy."
  tags: []
"Łk7,47":
  text: "Z tego powodu mówię ci: Odpuszczone są jej grzechy, które były liczne, bo bardzo umiłowała; a komu mało jest odpuszczone, ten mało miłuje."
  tags: []
"Łk7,48":
  text: "A On powiedział do niej: Grzechy twoje są ci odpuszczone."
  tags: []
"Łk7,49":
  text: "I zaczęli ci, którzy razem z Nim spoczywali przy stole, mówić w sobie: Kim jest Ten, który i grzechy odpuszcza?"
  tags: []
"Łk7,50":
  text: "I powiedział do kobiety: Wiara twoja zbawiła cię. Idź w pokoju."
  tags: []
