"Łk7,1": "A gdy dokończył wypowiadać wszystkie swoje słowa do słuchającego Go ludu, wszedł do Kafarnaum;"
"Łk7,2": "A sługa pewnego setnika, bardzo ceniony przez niego, chorował i miał już umrzeć."
"Łk7,3": "A gdy usłyszał o Jezusie, posłał do Niego starszych żydowskich, prosząc Go, aby przyszedł i uzdrowił jego sługę."
"Łk7,4": "A gdy oni przybyli do Jezusa, prosili Go gorliwie, mówiąc: Godny jest tego, abyś mu to uczynił;"
"Łk7,5": "Albowiem miłuje nasz naród i sam zbudował nam synagogę."
"Łk7,6": "Wtedy Jezus wyruszył z nimi. A gdy już był blisko, niedaleko od domu, posłał setnik do Niego przyjaciół, mówiąc Mu: Panie! Nie kłopocz się; nie jestem bowiem godny, abyś wszedł pod mój dach."
"Łk7,7": "Dlatego i samego siebie nie uważałem za godnego, aby przyjść do Ciebie; ale nakaż słowem, a zostanie uzdrowiony mój chłopiec."
"Łk7,8": "Gdyż i ja jestem człowiekiem podległym władzy, a mając pod sobą żołnierzy, mówię temu: Idź, a idzie; i drugiemu: Przyjdź, a przychodzi; i swojemu słudze: Czyń to, a czyni."
"Łk7,9": "A gdy Jezus to usłyszał, zadziwił się nim, i obrócił się do ludu, który za Nim podążał, i powiedział: Mówię wam: Nawet w Izraelu nie znalazłem tak wielkiej wiary."
"Łk7,10": "A gdy wrócili do domu ci, którzy byli posłani, znaleźli chorego sługę zdrowego."
"Łk7,11": "I zdarzyło się w następnym dniu, że poszedł do miasta zwanego Nain, i wielu Jego uczniów szło razem z Nim oraz wielki tłum."
"Łk7,12": "A gdy przybliżył się do bramy miasta, oto wynoszono umarłego, jedynego syna matki, a ta była wdową, i był z nią znaczny tłum z tego miasta;"
"Łk7,13": "A gdy Pan ją ujrzał, ulitował się nad nią i powiedział jej: Nie płacz!"
"Łk7,14": "I gdy przystąpił, dotknął mar; a ci, co je nieśli, stanęli. I powiedział: Młodzieńcze! Tobie mówię, wstań."
"Łk7,15": "I usiadł umarły, i zaczął mówić; i oddał go jego matce."
"Łk7,16": "A wszystkich ogarnął lęk, i wielbili Boga, mówiąc: Wielki prorok powstał wśród nas i Bóg nawiedził swój lud."
"Łk7,17": "I rozeszła się o Nim ta wieść po całej Judei i po całej okolicy."
"Łk7,18": "O tym wszystkim oznajmili Janowi jego uczniowie."
"Łk7,19": "A Jan, przywołał dwóch swoich uczniów i posłał ich do Jezusa, mówiąc: Czy Ty jesteś tym, który ma przyjść, czy mamy oczekiwać innego?"
"Łk7,20": "A gdy owi mężowie przyszli do Niego, powiedzieli: Jan Chrzciciel posyła nas do Ciebie, mówiąc: Czy Ty jesteś tym, który ma przyjść, czy mamy oczekiwać innego?"
"Łk7,21": "A w tej właśnie godzinie wielu uzdrowił z chorób i udręk, od złych duchów, i wielu ślepym darował by mogli widzieć."
"Łk7,22": "A Jezus w odpowiedzi, rzekł im: Idźcie, oznajmijcie Janowi co widzieliście i słyszeliście, że ślepi odzyskują wzrok, chromi chodzą, trędowaci zostają oczyszczeni, głuchoniemi słyszą, umarli powstają z martwych, ubogim głoszona jest dobra nowina."
"Łk7,23": "A błogosławiony jest ten, który się mną nie zgorszy."
"Łk7,24": "A gdy odeszli posłańcy Jana, zaczął mówić do ludu o Janie: Co wyszliście zobaczyć na pustkowiu? Czy trzcinę chwiejącą się od wiatru?"
"Łk7,25": "Ale co wyszliście zobaczyć? Czy człowieka w miękkie szaty odzianego? Oto ci, którzy noszą wspaniałe odzienie i żyją w przepychu, są w pałacach królewskich."
"Łk7,26": "Ale co wyszliście zobaczyć? Czy proroka? Tak, mówię wam, i więcej niż proroka."
"Łk7,27": "On jest tym, o którym jest napisane: Oto Ja wysyłam swojego posłańca przed Twoim obliczem, który pójdzie przed Tobą przygotować Ci drogę."
"Łk7,28": "Albowiem mówię wam: Pośród narodzonych z kobiet, nikt nie jest większym prorokiem od Jana Chrzciciela; ale najmniejszy w Królestwie Bożym większy jest od niego."
"Łk7,29": "A cały lud, gdy to usłyszał, a także celnicy, uznali sprawiedliwość Boga; ci, którzy zostali ochrzczeni chrztem Jana."
"Łk7,30": "A faryzeusze i znawcy Prawa odrzucili postanowienie Boże o nich samych, bo nie zostali przez niego ochrzczeni."
"Łk7,31": "I powiedział Pan: Do kogo przyrównam ludzi tego pokolenia, i do kogo są podobni?"
"Łk7,32": "Podobni są do dzieci, siedzących na rynku i wytykających sobie nawzajem, mówiąc: Graliśmy wam na fujarce, a nie tańczyliście; śpiewaliśmy pieśni żałobne, a nie płakaliście."
"Łk7,33": "Albowiem przyszedł Jan Chrzciciel, nie jadł chleba i nie pił wina, a mówicie: Ma demona."
"Łk7,34": "Przyszedł Syn Człowieczy, je i pije, a mówicie: Oto człowiek, żarłok i pijak, przyjaciel celników i grzeszników."
"Łk7,35": "I tak mądrość została uznana za sprawiedliwą przez wszystkie swoje dzieci."
"Łk7,36": "I prosił Go pewien faryzeusz, aby z nim spożył posiłek; a gdy wszedł do domu faryzeusza, spoczął przy stole."
"Łk7,37": "A oto kobieta, która była w mieście grzesznicą, gdy dowiedziała się, że spoczywa przy stole w domu faryzeusza, przyniosła alabastrowy flakonik olejku,"
"Łk7,38": "I stanęła przy stopach Jego z tyłu, płacząc zaczęła łzami zraszać Jego stopy, a włosami swojej głowy obcierała i czule całowała Jego stopy, i namaszczała je olejkiem."
"Łk7,39": "A widząc to faryzeusz, który Go zaprosił, powiedział w sobie, mówiąc: Gdyby Ten był prorokiem, wiedziałby, kim i jaką jest ta kobieta, która się Go dotyka; że jest grzeszna."
"Łk7,40": "I Jezus w odpowiedzi, rzekł do niego: Szymonie! Mam ci coś do powiedzenia. A on powiedział: Mów, Nauczycielu!"
"Łk7,41": "Pewien wierzyciel miał dwóch dłużników; jeden dłużny był mu pięćset denarów, a drugi pięćdziesiąt."
"Łk7,42": "A gdy nie mieli czym zapłacić, obydwom darował. Powiedz więc, który z nich, będzie miłować go bardziej?"
"Łk7,43": "A odpowiadając Szymon, powiedział do Niego: Przypuszczam, że ten, któremu więcej darował. A On mu powiedział: Poprawnie to osądziłeś."
"Łk7,44": "I obrócił się do kobiety, i powiedział Szymonowi: Widzisz tę kobietę? Wszedłem do twojego domu, a nie podałeś wody dla moich stóp; ale ta łzami zrosiła moje stopy, i swoimi włosami je otarła."
"Łk7,45": "Nie udzieliłeś mi pocałunku; ale ta, gdy weszła, nie przestała całować moich stóp."
"Łk7,46": "Nie namaściłeś oliwą mojej głowy; ale ta olejkiem namaściła moje stopy."
"Łk7,47": "Z tego powodu mówię ci: Odpuszczone są jej grzechy, które były liczne, bo bardzo umiłowała; a komu mało jest odpuszczone, ten mało miłuje."
"Łk7,48": "A On powiedział do niej: Grzechy twoje są ci odpuszczone."
"Łk7,49": "I zaczęli ci, którzy razem z Nim spoczywali przy stole, mówić w sobie: Kim jest Ten, który i grzechy odpuszcza?"
"Łk7,50": "I powiedział do kobiety: Wiara twoja zbawiła cię. Idź w pokoju."
