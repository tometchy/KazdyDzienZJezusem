"Łk15,1": "A byli tam wszyscy celnicy i grzesznicy, którzy przybliżali się do Niego, aby Go słuchać."
"Łk15,2": "I szemrali faryzeusze i uczeni w Piśmie, mówiąc: Ten przyjmuje grzeszników i jada z nimi."
"Łk15,3": "I powiedział do nich to podobieństwo, mówiąc:"
"Łk15,4": "Który człowiek spośród was, mając sto owiec, i zgubi jedną z nich, nie zostawia dziewięćdziesięciu dziewięciu na pustkowiu, i nie idzie za zaginioną, aż ją znajdzie?"
"Łk15,5": "A gdy ją znajdzie, kładzie na swoje ramiona, radując się."
"Łk15,6": "I gdy przyjdzie do domu, zwołuje przyjaciół i sąsiadów, mówiąc im: Radujcie się ze mną, bo znalazłem swoją owcę, która mi zaginęła."
"Łk15,7": "Mówię wam, że taka będzie radość w niebie z jednego grzesznika, który się upamięta, i to bardziej niż z dziewięćdziesięciu dziewięciu sprawiedliwych, którzy nie potrzebują upamiętania."
"Łk15,8": "A która kobieta, mając dziesięć drachm, jeśli zgubiłaby jedną drachmę, nie zapala lampy i nie zamiata domu, starannie szukając, aż znajdzie?"
"Łk15,9": "A gdy znajdzie, zwołuje przyjaciółki i sąsiadki, mówiąc: Radujcie się ze mną, albowiem znalazłam drachmę, którą zgubiłam."
"Łk15,10": "Taka, mówię wam, będzie radość przed aniołami Boga z jednego grzesznika, który się upamiętał."
"Łk15,11": "Powiedział też: Pewien człowiek miał dwóch synów;"
"Łk15,12": "I młodszy z nich powiedział ojcu: Ojcze! Daj mi przypadającą na mnie część majątku. I podzielił im majętność."
"Łk15,13": "A po niewielu dniach, młodszy syn zabrał wszystko i odjechał do dalekiej krainy, i żyjąc rozwiąźle, roztrwonił tam swoją majętność."
"Łk15,14": "A gdy wszystko wydał, nastał wielki głód w tej krainie, i on zaczął cierpieć niedostatek."
"Łk15,15": "Poszedł więc, przyłączył się do jednego z obywateli tej krainy, który posłał go do swoich wiejskich posiadłości, aby pasł świnie."
"Łk15,16": "I pragnął napełnić żołądek swój strąkami, które jadały świnie; a nikt mu nie dawał."
"Łk15,17": "A gdy wejrzał w siebie, powiedział: Jak wielu najemników mojego ojca ma obfitość chleba, a ja tu głodny ginę!"
"Łk15,18": "Wstanę, pójdę do mojego ojca i powiem mu: Ojcze! Zgrzeszyłem przeciwko niebu i wobec ciebie,"
"Łk15,19": "Już nie jestem godny zostać nazwany twoim synem; uczyń mnie jednym ze swoich najemników."
"Łk15,20": "Wstał więc i poszedł do swojego ojca. A gdy był jeszcze daleko, ujrzał go jego ojciec, zlitował się, wybiegł, rzucił się mu na szyję i pocałował go."
"Łk15,21": "I powiedział mu syn: Ojcze! Zgrzeszyłem przeciwko niebu i wobec ciebie, i nie jestem już godny zostać nazwany twoim synem."
"Łk15,22": "A ojciec powiedział do swoich sług: Przynieście najlepszą szatę i ubierzcie go, dajcie pierścień na jego rękę i sandały na stopy;"
"Łk15,23": "I przyprowadźcie tłuste cielę, zabijcie, a gdy się najemy, będziemy się cieszyć."
"Łk15,24": "Gdyż ten mój syn był martwy, a ożył, i był zgubiony, a odnalazł się; i zaczęli się cieszyć."
"Łk15,25": "A jego starszy syn był w polu; i gdy wracając zbliżył się do domu, usłyszał muzykę i tańce;"
"Łk15,26": "I zawołał jednego ze sług, i pytał się, co się dzieje."
"Łk15,27": "A on powiedział do niego: Przyszedł twój brat i twój ojciec zabił tłuste cielę, bo otrzymał go z powrotem zdrowego."
"Łk15,28": "A on rozgniewał się i nie chciał wejść; więc jego ojciec wyszedł i go prosił."
"Łk15,29": "A on w odpowiedzi, rzekł ojcu: Oto tyle lat ci służę i nigdy nie przekroczyłem twojego przykazania; a mnie nigdy nie dałeś koźlęcia, abym radował się ze swoimi przyjaciółmi."
"Łk15,30": "Ale gdy przyszedł ten twój syn, który pożarł twój majątek z nierządnicami, dla niego zabiłeś tłuste cielę."
"Łk15,31": "A on powiedział mu: Dziecko! Ty zawsze jesteś ze mną, i wszystko, co jest moje, jest i twoje."
"Łk15,32": "Lecz trzeba było weselić się i radować, że twój brat był martwy, a ożył, i był zgubiony, a odnalazł się."
