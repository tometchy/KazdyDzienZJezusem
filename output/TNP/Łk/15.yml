"Łk15,1":
  text: "A byli tam wszyscy celnicy i grzesznicy, którzy przybliżali się do Niego, aby Go słuchać."
  tags: []
"Łk15,2":
  text: "I szemrali faryzeusze i uczeni w Piśmie, mówiąc: Ten przyjmuje grzeszników i jada z nimi."
  tags: []
"Łk15,3":
  text: "I powiedział do nich to podobieństwo, mówiąc:"
  tags: []
"Łk15,4":
  text: "Który człowiek spośród was, mając sto owiec, i zgubi jedną z nich, nie zostawia dziewięćdziesięciu dziewięciu na pustkowiu, i nie idzie za zaginioną, aż ją znajdzie?"
  tags: []
"Łk15,5":
  text: "A gdy ją znajdzie, kładzie na swoje ramiona, radując się."
  tags: []
"Łk15,6":
  text: "I gdy przyjdzie do domu, zwołuje przyjaciół i sąsiadów, mówiąc im: Radujcie się ze mną, bo znalazłem swoją owcę, która mi zaginęła."
  tags: []
"Łk15,7":
  text: "Mówię wam, że taka będzie radość w niebie z jednego grzesznika, który się upamięta, i to bardziej niż z dziewięćdziesięciu dziewięciu sprawiedliwych, którzy nie potrzebują upamiętania."
  tags: []
"Łk15,8":
  text: "A która kobieta, mając dziesięć drachm, jeśli zgubiłaby jedną drachmę, nie zapala lampy i nie zamiata domu, starannie szukając, aż znajdzie?"
  tags: []
"Łk15,9":
  text: "A gdy znajdzie, zwołuje przyjaciółki i sąsiadki, mówiąc: Radujcie się ze mną, albowiem znalazłam drachmę, którą zgubiłam."
  tags: []
"Łk15,10":
  text: "Taka, mówię wam, będzie radość przed aniołami Boga z jednego grzesznika, który się upamiętał."
  tags: []
"Łk15,11":
  text: "Powiedział też: Pewien człowiek miał dwóch synów;"
  tags: []
"Łk15,12":
  text: "I młodszy z nich powiedział ojcu: Ojcze! Daj mi przypadającą na mnie część majątku. I podzielił im majętność."
  tags: []
"Łk15,13":
  text: "A po niewielu dniach, młodszy syn zabrał wszystko i odjechał do dalekiej krainy, i żyjąc rozwiąźle, roztrwonił tam swoją majętność."
  tags: []
"Łk15,14":
  text: "A gdy wszystko wydał, nastał wielki głód w tej krainie, i on zaczął cierpieć niedostatek."
  tags: []
"Łk15,15":
  text: "Poszedł więc, przyłączył się do jednego z obywateli tej krainy, który posłał go do swoich wiejskich posiadłości, aby pasł świnie."
  tags: []
"Łk15,16":
  text: "I pragnął napełnić żołądek swój strąkami, które jadały świnie; a nikt mu nie dawał."
  tags: []
"Łk15,17":
  text: "A gdy wejrzał w siebie, powiedział: Jak wielu najemników mojego ojca ma obfitość chleba, a ja tu głodny ginę!"
  tags: []
"Łk15,18":
  text: "Wstanę, pójdę do mojego ojca i powiem mu: Ojcze! Zgrzeszyłem przeciwko niebu i wobec ciebie,"
  tags: []
"Łk15,19":
  text: "Już nie jestem godny zostać nazwany twoim synem; uczyń mnie jednym ze swoich najemników."
  tags: []
"Łk15,20":
  text: "Wstał więc i poszedł do swojego ojca. A gdy był jeszcze daleko, ujrzał go jego ojciec, zlitował się, wybiegł, rzucił się mu na szyję i pocałował go."
  tags: []
"Łk15,21":
  text: "I powiedział mu syn: Ojcze! Zgrzeszyłem przeciwko niebu i wobec ciebie, i nie jestem już godny zostać nazwany twoim synem."
  tags: []
"Łk15,22":
  text: "A ojciec powiedział do swoich sług: Przynieście najlepszą szatę i ubierzcie go, dajcie pierścień na jego rękę i sandały na stopy;"
  tags: []
"Łk15,23":
  text: "I przyprowadźcie tłuste cielę, zabijcie, a gdy się najemy, będziemy się cieszyć."
  tags: []
"Łk15,24":
  text: "Gdyż ten mój syn był martwy, a ożył, i był zgubiony, a odnalazł się; i zaczęli się cieszyć."
  tags: []
"Łk15,25":
  text: "A jego starszy syn był w polu; i gdy wracając zbliżył się do domu, usłyszał muzykę i tańce;"
  tags: []
"Łk15,26":
  text: "I zawołał jednego ze sług, i pytał się, co się dzieje."
  tags: []
"Łk15,27":
  text: "A on powiedział do niego: Przyszedł twój brat i twój ojciec zabił tłuste cielę, bo otrzymał go z powrotem zdrowego."
  tags: []
"Łk15,28":
  text: "A on rozgniewał się i nie chciał wejść; więc jego ojciec wyszedł i go prosił."
  tags: []
"Łk15,29":
  text: "A on w odpowiedzi, rzekł ojcu: Oto tyle lat ci służę i nigdy nie przekroczyłem twojego przykazania; a mnie nigdy nie dałeś koźlęcia, abym radował się ze swoimi przyjaciółmi."
  tags: []
"Łk15,30":
  text: "Ale gdy przyszedł ten twój syn, który pożarł twój majątek z nierządnicami, dla niego zabiłeś tłuste cielę."
  tags: []
"Łk15,31":
  text: "A on powiedział mu: Dziecko! Ty zawsze jesteś ze mną, i wszystko, co jest moje, jest i twoje."
  tags: []
"Łk15,32":
  text: "Lecz trzeba było weselić się i radować, że twój brat był martwy, a ożył, i był zgubiony, a odnalazł się."
  tags: []
