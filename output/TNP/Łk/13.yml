"Łk13,1":
  text: "W tym samym czasie, niektórzy z tam obecnych, oznajmili mu o Galilejczykach, których krew Piłat zmieszał z krwią ich ofiar."
  tags: []
"Łk13,2":
  text: "A Jezus w odpowiedzi, rzekł im: Czy wydaje się wam, że ci Galilejczycy byli większymi grzesznikami od wszystkich innych Galilejczyków, że tak ucierpieli?"
  tags: []
"Łk13,3":
  text: "Wcale nie, mówię wam; ale jeśli się nie upamiętacie, wszyscy podobnie zginiecie."
  tags: []
"Łk13,4":
  text: "Albo tych osiemnastu, na których upadła wieża w Syloe i zabiła ich; czy wydaje się wam, że oni byli bardziej winni niż wszyscy ludzie mieszkający w Jerozolimie?"
  tags: []
"Łk13,5":
  text: "Wcale nie, mówię wam; ale jeśli się nie upamiętacie, wszyscy tak samo zginiecie."
  tags: []
"Łk13,6":
  text: "I powiedział im to podobieństwo: Pewien człowiek miał figowca zasadzonego w swojej winnicy, przyszedł więc i szukał na nim owocu, i nie znalazł."
  tags: []
"Łk13,7":
  text: "Wtedy powiedział do winogrodnika: Oto przez trzy lata przychodzę i szukam owocu na tym drzewie, i nie znajduję. Wytnij je; po co zajmuje ziemię bezużytecznie?"
  tags: []
"Łk13,8":
  text: "Ale on w odpowiedzi, rzekł do niego: Panie! Pozostaw je jeszcze na ten rok, aż je okopię i obłożę nawozem;"
  tags: []
"Łk13,9":
  text: "Może potem przyniesie owoc; a jeśli nie, wytniesz je w przyszłości."
  tags: []
"Łk13,10":
  text: "A w szabaty nauczał w jednej z synagog."
  tags: []
"Łk13,11":
  text: "I oto była tam kobieta, która miała ducha niemocy od osiemnastu lat, a była tak pochylona, że nie mogła się w ogóle wyprostować."
  tags: []
"Łk13,12":
  text: "Gdy Jezus ujrzał ją, zawołał do siebie i powiedział jej: Kobieto! Uwolniona jesteś od swojej słabości."
  tags: []
"Łk13,13":
  text: "I nałożył na nią ręce, i od razu się wyprostowała i wysławiała Boga."
  tags: []
"Łk13,14":
  text: "A przełożony synagogi powiedział oburzony, że Jezus uzdrawiał w szabat, mówiąc do tłumu: Jest sześć dni, w które trzeba pracować; w te więc dni przychodźcie po uzdrowienie, a nie w dzień szabatu."
  tags: []
"Łk13,15":
  text: "Wtedy Pan w odpowiedzi, rzekł do niego: Obłudniku, czy każdy z was w szabat nie odwiązuje swojego wołu albo osła od żłobu, i nie prowadzi, żeby go napoić?"
  tags: []
"Łk13,16":
  text: "Czy więc tej córki Abrahama, którą szatan związał – spójrzcie! – na osiemnaście lat, nie należało rozwiązać z tych więzów w dzień szabatu?"
  tags: []
"Łk13,17":
  text: "I gdy On to mówił, zawstydzili się wszyscy Jego przeciwnicy, i cały lud radował się ze wszystkich chwalebnych czynów, które działy się przez Niego."
  tags: []
"Łk13,18":
  text: "Mówił też: Do czego podobne jest Królestwo Boże, i do czego je przyrównam?"
  tags: []
"Łk13,19":
  text: "Podobne jest do ziarna gorczycy, które człowiek wziął i wrzucił do swojego ogrodu; i rosło, i stało się wielkim drzewem, a ptaki z nieba zagnieździły się w jego gałęziach."
  tags: []
"Łk13,20":
  text: "I powiedział ponownie: Do czego przyrównam Królestwo Boże?"
  tags: []
"Łk13,21":
  text: "Podobne jest do kwasu, który wzięła kobieta i zmieszała z trzema miarami mąki, aż całe się zakwasiło."
  tags: []
"Łk13,22":
  text: "I chodził po miastach i miasteczkach, nauczając i zmierzając ku Jerozolimie."
  tags: []
"Łk13,23":
  text: "I powiedział do Niego pewien człowiek: Panie! Czy niewielu będzie zbawionych? A On powiedział do nich:"
  tags: []
"Łk13,24":
  text: "Zmagajcie się, aby wejść przez ciasną bramę; albowiem mówię wam: Wielu będzie starało się wejść, ale nie będą w stanie."
  tags: []
"Łk13,25":
  text: "Kiedy wstanie gospodarz i zamknie bramę, a wy stojąc na zewnątrz zaczęlibyście pukać w bramę, mówiąc: Panie, panie, otwórz nam! A on w odpowiedzi powie wam: Nie znam was. Skąd jesteście?"
  tags: []
"Łk13,26":
  text: "Wtedy zaczniecie mówić: Jedliśmy z tobą i piliśmy, i nauczałeś na naszych ulicach."
  tags: []
"Łk13,27":
  text: "A on powie: Mówię wam, nie znam was. Skąd jesteście? Odstąpcie ode mnie wszyscy, sprawcy bezprawia."
  tags: []
"Łk13,28":
  text: "Tam będzie płacz i zgrzytanie zębów, gdy zobaczycie Abrahama, Izaaka, Jakuba i wszystkich proroków w Królestwie Boga, a was samych na zewnątrz wyrzuconych."
  tags: []
"Łk13,29":
  text: "I przyjdą ze wschodu i z zachodu, i z północy i z południa, i spoczną za stołem w Królestwie Bożym."
  tags: []
"Łk13,30":
  text: "I oto są ostatni, którzy będą pierwszymi, i są pierwsi, którzy będą ostatnimi."
  tags: []
"Łk13,31":
  text: "W tym dniu podeszli niektórzy faryzeusze, mówiąc do Niego: Wyjdź i idź stąd, bo Herod chce Cię zabić."
  tags: []
"Łk13,32":
  text: "I powiedział im: Idźcie i powiedzcie temu lisowi: Oto wyrzucam demony i dokonuję uzdrowień dziś i jutro, a trzeciego dnia kończę."
  tags: []
"Łk13,33":
  text: "Jednakże trzeba mi dziś i jutro, i następnego dnia być w drodze; gdyż niedopuszczalne jest, aby prorok miał zginąć poza Jerozolimą."
  tags: []
"Łk13,34":
  text: "Jeruzalem! Jeruzalem! Które zabijasz proroków i kamienujesz tych, którzy posyłani są do ciebie; ile razy chciałem zgromadzić twoje dzieci, w ten sposób jak kwoka zgromadza swoje kurczęta pod skrzydła, a nie chcieliście."
  tags: []
"Łk13,35":
  text: "Oto wasz dom będzie zostawiony pusty. A zaprawdę mówię wam, że nie zobaczycie mnie, aż przyjdzie czas, gdy powiecie: Błogosławiony, który przychodzi w imieniu PANA."
  tags: []
