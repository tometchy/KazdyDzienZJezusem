"Łk13,1": "W tym samym czasie, niektórzy z tam obecnych, oznajmili mu o Galilejczykach, których krew Piłat zmieszał z krwią ich ofiar."
"Łk13,2": "A Jezus w odpowiedzi, rzekł im: Czy wydaje się wam, że ci Galilejczycy byli większymi grzesznikami od wszystkich innych Galilejczyków, że tak ucierpieli?"
"Łk13,3": "Wcale nie, mówię wam; ale jeśli się nie upamiętacie, wszyscy podobnie zginiecie."
"Łk13,4": "Albo tych osiemnastu, na których upadła wieża w Syloe i zabiła ich; czy wydaje się wam, że oni byli bardziej winni niż wszyscy ludzie mieszkający w Jerozolimie?"
"Łk13,5": "Wcale nie, mówię wam; ale jeśli się nie upamiętacie, wszyscy tak samo zginiecie."
"Łk13,6": "I powiedział im to podobieństwo: Pewien człowiek miał figowca zasadzonego w swojej winnicy, przyszedł więc i szukał na nim owocu, i nie znalazł."
"Łk13,7": "Wtedy powiedział do winogrodnika: Oto przez trzy lata przychodzę i szukam owocu na tym drzewie, i nie znajduję. Wytnij je; po co zajmuje ziemię bezużytecznie?"
"Łk13,8": "Ale on w odpowiedzi, rzekł do niego: Panie! Pozostaw je jeszcze na ten rok, aż je okopię i obłożę nawozem;"
"Łk13,9": "Może potem przyniesie owoc; a jeśli nie, wytniesz je w przyszłości."
"Łk13,10": "A w szabaty nauczał w jednej z synagog."
"Łk13,11": "I oto była tam kobieta, która miała ducha niemocy od osiemnastu lat, a była tak pochylona, że nie mogła się w ogóle wyprostować."
"Łk13,12": "Gdy Jezus ujrzał ją, zawołał do siebie i powiedział jej: Kobieto! Uwolniona jesteś od swojej słabości."
"Łk13,13": "I nałożył na nią ręce, i od razu się wyprostowała i wysławiała Boga."
"Łk13,14": "A przełożony synagogi powiedział oburzony, że Jezus uzdrawiał w szabat, mówiąc do tłumu: Jest sześć dni, w które trzeba pracować; w te więc dni przychodźcie po uzdrowienie, a nie w dzień szabatu."
"Łk13,15": "Wtedy Pan w odpowiedzi, rzekł do niego: Obłudniku, czy każdy z was w szabat nie odwiązuje swojego wołu albo osła od żłobu, i nie prowadzi, żeby go napoić?"
"Łk13,16": "Czy więc tej córki Abrahama, którą szatan związał – spójrzcie! – na osiemnaście lat, nie należało rozwiązać z tych więzów w dzień szabatu?"
"Łk13,17": "I gdy On to mówił, zawstydzili się wszyscy Jego przeciwnicy, i cały lud radował się ze wszystkich chwalebnych czynów, które działy się przez Niego."
"Łk13,18": "Mówił też: Do czego podobne jest Królestwo Boże, i do czego je przyrównam?"
"Łk13,19": "Podobne jest do ziarna gorczycy, które człowiek wziął i wrzucił do swojego ogrodu; i rosło, i stało się wielkim drzewem, a ptaki z nieba zagnieździły się w jego gałęziach."
"Łk13,20": "I powiedział ponownie: Do czego przyrównam Królestwo Boże?"
"Łk13,21": "Podobne jest do kwasu, który wzięła kobieta i zmieszała z trzema miarami mąki, aż całe się zakwasiło."
"Łk13,22": "I chodził po miastach i miasteczkach, nauczając i zmierzając ku Jerozolimie."
"Łk13,23": "I powiedział do Niego pewien człowiek: Panie! Czy niewielu będzie zbawionych? A On powiedział do nich:"
"Łk13,24": "Zmagajcie się, aby wejść przez ciasną bramę; albowiem mówię wam: Wielu będzie starało się wejść, ale nie będą w stanie."
"Łk13,25": "Kiedy wstanie gospodarz i zamknie bramę, a wy stojąc na zewnątrz zaczęlibyście pukać w bramę, mówiąc: Panie, panie, otwórz nam! A on w odpowiedzi powie wam: Nie znam was. Skąd jesteście?"
"Łk13,26": "Wtedy zaczniecie mówić: Jedliśmy z tobą i piliśmy, i nauczałeś na naszych ulicach."
"Łk13,27": "A on powie: Mówię wam, nie znam was. Skąd jesteście? Odstąpcie ode mnie wszyscy, sprawcy bezprawia."
"Łk13,28": "Tam będzie płacz i zgrzytanie zębów, gdy zobaczycie Abrahama, Izaaka, Jakuba i wszystkich proroków w Królestwie Boga, a was samych na zewnątrz wyrzuconych."
"Łk13,29": "I przyjdą ze wschodu i z zachodu, i z północy i z południa, i spoczną za stołem w Królestwie Bożym."
"Łk13,30": "I oto są ostatni, którzy będą pierwszymi, i są pierwsi, którzy będą ostatnimi."
"Łk13,31": "W tym dniu podeszli niektórzy faryzeusze, mówiąc do Niego: Wyjdź i idź stąd, bo Herod chce Cię zabić."
"Łk13,32": "I powiedział im: Idźcie i powiedzcie temu lisowi: Oto wyrzucam demony i dokonuję uzdrowień dziś i jutro, a trzeciego dnia kończę."
"Łk13,33": "Jednakże trzeba mi dziś i jutro, i następnego dnia być w drodze; gdyż niedopuszczalne jest, aby prorok miał zginąć poza Jerozolimą."
"Łk13,34": "Jeruzalem! Jeruzalem! Które zabijasz proroków i kamienujesz tych, którzy posyłani są do ciebie; ile razy chciałem zgromadzić twoje dzieci, w ten sposób jak kwoka zgromadza swoje kurczęta pod skrzydła, a nie chcieliście."
"Łk13,35": "Oto wasz dom będzie zostawiony pusty. A zaprawdę mówię wam, że nie zobaczycie mnie, aż przyjdzie czas, gdy powiecie: Błogosławiony, który przychodzi w imieniu PANA."
