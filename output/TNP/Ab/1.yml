"Ab1,1": "Widzenie Abdiasza. Tak mówi JHWH PAN Edomowi: Usłyszeliśmy wieść od JHWH, a posłaniec został wysłany do narodów: Wstańcie, podnieśmy się przeciw niemu do bitwy."
"Ab1,2": "Oto uczyniłem cię małym wśród narodów – zostaniesz bardzo wzgardzony."
"Ab1,3": "Pycha twojego serca zwiodła cię; ty, który mieszkasz w rozpadlinach skalnych, siedzibę swoją masz wysoko, więc mówisz w swoim sercu: Kto mnie ściągnie na ziemię?"
"Ab1,4": "Choćbyś wzbił się wysoko jak orzeł, i choćbyś założył swoje gniazdo pośród gwiazd, stamtąd cię ściągnę – oświadczenie JHWH."
"Ab1,5": "Gdyby złodzieje przyszli do ciebie, gdyby rabusie zjawili się nocą – o jakże będziesz zniszczony! Czy nie ukradliby, ile tylko zdołają? Gdyby przyszli do ciebie zbieracze winogron, czy nie zostawiliby pozostałości z gron?"
"Ab1,6": "Jakże zostanie obnażony Ezaw i przeszukane jego tajne skarbce!"
"Ab1,7": "Aż do granicy cię wyrzucili wszyscy mężowie związani z tobą przymierzem. Mężowie żyjący z tobą w pokoju zwiedli cię i zyskali nad tobą przewagę; ci, którzy jedli twój chleb zastawiają pułapkę. Nie ma w tym zrozumienia."
"Ab1,8": "Czyż w tym dniu – oświadczenie JHWH – nie wytracę mędrców z Edomu, a rozumnych z góry Ezawa?"
"Ab1,9": "I tak przerażą się twoi bohaterowie, Temanie, że z tego powodu zostaną wycięci wszyscy z góry Ezawa – z powodu zbrodni."
"Ab1,10": "Ze względu na gwałt na twoim bracie Jakubie okryjesz się hańbą i zostaniesz wycięty na wieki."
"Ab1,11": "W dniu, gdy stałeś na uboczu, w dniu, gdy obcy brali do niewoli jego wojsko i gdy cudzoziemcy wchodzili w jego bramę i o Jerozolimę rzucali los, także ty byłeś jak jeden z nich."
"Ab1,12": "I nie powinieneś był przyglądać się w dniu swojego brata, w dniu jego klęski, ani cieszyć się z powodu synów Judy w dniu ich zniszczenia, ani mówić zuchwale w dniu niedoli."
"Ab1,13": "Nie powinieneś był wchodzić w bramę mojego ludu w dniu jego klęski nie przyglądaj się także i ty jego nieszczęściu w dniu jego klęski, i nie sięgaj po jego bogactwo w dniu jego klęski;"
"Ab1,14": "Nie powinieneś był stać na rozstaju dróg, aby wycinać jego uchodźców ani wydać jego ocalonych w dniu niedoli."
"Ab1,15": "Bo bliski jest dzień JHWH dla wszystkich narodów. Tak jak postępowałeś, tak postąpią z tobą. Twoja odpłata wróci na twoją głowę."
"Ab1,16": "Bo jak wy piliście na mojej świętej górze, tak pić będą stale wszystkie narody; będą pić i łykać, i stanie się z nimi tak, jak gdyby ich nie było."
"Ab1,17": "A na górze Syjon będzie wybawienie i będzie ona święta, a dom Jakuba obejmie w posiadanie ich dziedzictwo."
"Ab1,18": "Dom Jakuba stanie się ogniem, a dom Józefa płomieniem, dom Ezawa natomiast ścierniskiem. Podpalą go i strawią, i nie będzie ocalonego z domu Ezawa, bo JHWH to powiedział."
"Ab1,19": "Ci z Negew obejmą w posiadanie górę Ezawa, ci z Szefeli – Filistynów. Obejmą w posiadanie też pola Efraima i pola Samarii, a Beniamin zajmie Gilead."
"Ab1,20": "A wygnańcy z twierdzy synów Izraela posiądą to, co Kananejczyków aż po Sareptę; a wygnańcy z Jerozolimy, którzy są w Sefarad, obejmą w posiadanie miasta Negewu."
"Ab1,21": "I wstąpią wybawcy na górę Syjon, aby sądzić górę Ezawa. I królestwo będzie należeć do JHWH."
