"Ag1,1":
  text: "Roku drugiego króla Dariusza, szóstego miesiąca, pierwszego dnia tego miesiąca, stało się Słowo JHWH przez rękę Aggeusza proroka do Zorobabela, syna Szealtiela, namiestnika Judei, i do Jozuego, syna Jehosadaka, arcykapłana, głoszące:"
  tags: []
"Ag1,2":
  text: "Tak mówi JHWH Zastępów, głosząc: Ten lud mówi: Jeszcze nie nadszedł czas, czas, by budować dom JHWH."
  tags: []
"Ag1,3":
  text: "I wtedy stało się Słowo JHWH przez proroka Aggeusza, głoszące:"
  tags: []
"Ag1,4":
  text: "Czy dla was samych jest czas, abyście mieszkali w domach waszych wykładanych drewnem, a dom ten był spustoszony?"
  tags: []
"Ag1,5":
  text: "Teraz więc tak mówi JHWH Zastępów: Zastanówcie się w swoich sercach nad swoimi drogami;"
  tags: []
"Ag1,6":
  text: "Siejecie wiele, a mało zbieracie; jecie, ale nie jesteście nasyceni, pijecie, ale nie możecie się upić, okrywacie się, ale nikomu nie jest ciepło, a ten, co zarabia, zarabia do dziurawego worka."
  tags: []
"Ag1,7":
  text: "Tak mówi JHWH Zastępów: Zastanówcie się w swoich sercach nad swoimi drogami;"
  tags: []
"Ag1,8":
  text: "Wstąpcie na tę górę i zgromadźcie drzewo; budujcie ten dom, a będę miał w nim upodobanie i zostanę uwielbiony, mówi JHWH."
  tags: []
"Ag1,9":
  text: "Liczyliście na wiele, a oto jest mało, a to, co wnosicie do domu, to ja rozdmuchuję. Z jakiego powodu? Oświadczenie JHWH Zastępów: Dlatego, że dom mój jest spustoszony, a wy zabiegacie każdy o swój dom."
  tags: []
"Ag1,10":
  text: "Dlatego też niebiosa wstrzymały rosę nad wami, a ziemia, wstrzymała swój plon."
  tags: []
"Ag1,11":
  text: "I wezwałem suszę na tę ziemię, i na te góry, i na tę pszenicę, i na ten moszcz, i na tę oliwę, i na to, co wydaje rola, i na tych ludzi, i na to bydło, i na cały trud rąk."
  tags: []
"Ag1,12":
  text: "I usłuchał Zorobabel, syn Szealtiela, i Jozue, syn Jehosadaka, arcykapłan, i cała reszta ludu, głosu JHWH, swojego Boga i słów proroka Aggeusza, ponieważ posłał go JHWH, ich Bóg; bo lud bał się oblicza JHWH."
  tags: []
"Ag1,13":
  text: "I przemówił Aggeusz, posłaniec JHWH do ludu, w poselstwie JHWH, głosząc: Ja jestem z wami – oświadczenie JHWH."
  tags: []
"Ag1,14":
  text: "I wzbudził JHWH ducha Zorobabela, syna Szealtiela, namiestnika Judei, i ducha Jozuego, syna Jehosadaka, arcykapłana, i ducha całej reszty ludu, że przyszli i pracowali w domu JHWH Zastępów, swojego Boga."
  tags: []
"Ag1,15":
  text: "Było to dwudziestego czwartego dnia, szóstego miesiąca, w drugim roku panowania króla Dariusza;"
  tags: []
