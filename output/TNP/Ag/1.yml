"Ag1,1": "Roku drugiego króla Dariusza, szóstego miesiąca, pierwszego dnia tego miesiąca, stało się Słowo JHWH przez rękę Aggeusza proroka do Zorobabela, syna Szealtiela, namiestnika Judei, i do Jozuego, syna Jehosadaka, arcykapłana, głoszące:"
"Ag1,2": "Tak mówi JHWH Zastępów, głosząc: Ten lud mówi: Jeszcze nie nadszedł czas, czas, by budować dom JHWH."
"Ag1,3": "I wtedy stało się Słowo JHWH przez proroka Aggeusza, głoszące:"
"Ag1,4": "Czy dla was samych jest czas, abyście mieszkali w domach waszych wykładanych drewnem, a dom ten był spustoszony?"
"Ag1,5": "Teraz więc tak mówi JHWH Zastępów: Zastanówcie się w swoich sercach nad swoimi drogami;"
"Ag1,6": "Siejecie wiele, a mało zbieracie; jecie, ale nie jesteście nasyceni, pijecie, ale nie możecie się upić, okrywacie się, ale nikomu nie jest ciepło, a ten, co zarabia, zarabia do dziurawego worka."
"Ag1,7": "Tak mówi JHWH Zastępów: Zastanówcie się w swoich sercach nad swoimi drogami;"
"Ag1,8": "Wstąpcie na tę górę i zgromadźcie drzewo; budujcie ten dom, a będę miał w nim upodobanie i zostanę uwielbiony, mówi JHWH."
"Ag1,9": "Liczyliście na wiele, a oto jest mało, a to, co wnosicie do domu, to ja rozdmuchuję. Z jakiego powodu? Oświadczenie JHWH Zastępów: Dlatego, że dom mój jest spustoszony, a wy zabiegacie każdy o swój dom."
"Ag1,10": "Dlatego też niebiosa wstrzymały rosę nad wami, a ziemia, wstrzymała swój plon."
"Ag1,11": "I wezwałem suszę na tę ziemię, i na te góry, i na tę pszenicę, i na ten moszcz, i na tę oliwę, i na to, co wydaje rola, i na tych ludzi, i na to bydło, i na cały trud rąk."
"Ag1,12": "I usłuchał Zorobabel, syn Szealtiela, i Jozue, syn Jehosadaka, arcykapłan, i cała reszta ludu, głosu JHWH, swojego Boga i słów proroka Aggeusza, ponieważ posłał go JHWH, ich Bóg; bo lud bał się oblicza JHWH."
"Ag1,13": "I przemówił Aggeusz, posłaniec JHWH do ludu, w poselstwie JHWH, głosząc: Ja jestem z wami – oświadczenie JHWH."
"Ag1,14": "I wzbudził JHWH ducha Zorobabela, syna Szealtiela, namiestnika Judei, i ducha Jozuego, syna Jehosadaka, arcykapłana, i ducha całej reszty ludu, że przyszli i pracowali w domu JHWH Zastępów, swojego Boga."
"Ag1,15": "Było to dwudziestego czwartego dnia, szóstego miesiąca, w drugim roku panowania króla Dariusza;"
