"Ag2,1":
  text: "Siódmego miesiąca, dwudziestego pierwszego dnia tego miesiąca stało się Słowo JHWH przez rękę Aggeusza proroka, głoszące:"
  tags: []
"Ag2,2":
  text: "Mów proszę do Zorobabela, syna Szealtiela, namiestnika Judei, i do Jozuego, syna Jehosadaka, arcykapłana, i do reszty ludu, głosząc:"
  tags: []
"Ag2,3":
  text: "Kto pozostał między wami, co widział ten dom w pierwszej jego chwale? A jakim wy teraz go widzicie? Czy nie jest tak jak gdyby nic w waszych oczach?"
  tags: []
"Ag2,4":
  text: "Teraz jednak wzmocnij się Zorobabelu! – oświadczenie JHWH; wzmocnij się Jozue, synu Jehosadaka, arcykapłanie! Wzmocnij się też cały ludu tej ziemi – oświadczenie JHWH, do dzieła! Bo ja jestem z wami – oświadczenie JHWH Zastępów."
  tags: []
"Ag2,5":
  text: "Zgodnie ze słowem przymierza, które zawarłem z wami, gdy wychodziliście z Egiptu; mój Duch stoi wśród was, nie bójcie się."
  tags: []
"Ag2,6":
  text: "Bo tak mówi JHWH Zastępów: Ja jeszcze raz, i to za małą chwilę, potrząsnę niebiosami i ziemią, morzem i suchym lądem;"
  tags: []
"Ag2,7":
  text: "I potrząsnę wszystkie te narody, i przyjdą do Upragnionego wszystkie narody, i napełnię ten dom chwałą, mówi JHWH Zastępów."
  tags: []
"Ag2,8":
  text: "Moje jest srebro i moje złoto – oświadczenie JHWH Zastępów."
  tags: []
"Ag2,9":
  text: "Większa będzie przyszła chwała tego domu, niż ta wcześniejsza, mówi JHWH Zastępów; i na miejscu tym zostanie dany pokój – oświadczenie JHWH Zastępów."
  tags: []
"Ag2,10":
  text: "Dwudziestego czwartego dnia, dziewiątego miesiąca, drugiego roku panowania Dariusza, stało się Słowo JHWH przez rękę Aggeusza proroka, głoszące:"
  tags: []
"Ag2,11":
  text: "Tak mówi JHWH Zastępów: Zapytaj proszę kapłanów o to Prawo, mówiąc:"
  tags: []
"Ag2,12":
  text: "Gdyby ktoś niósł poświęcone mięso zawinięte w skraj swojej szaty i dotknąłby skrajem swojej szaty chleba lub czegoś gotowanego, lub wina, lub oliwy, lub jakiegokolwiek pokarmu, czy staje się to poświęcone? I odpowiedzieli kapłani, mówiąc: Nie."
  tags: []
"Ag2,13":
  text: "Wtedy powiedział Aggeusz: Jeśli ktoś będąc nieczysty przez dotknięcie zwłok, dotknąłby się czegoś z tego wszystkiego, będzie to nieczyste? I odpowiedzieli kapłani, mówiąc: Będzie nieczyste."
  tags: []
"Ag2,14":
  text: "Wtedy w odpowiedzi, Aggeusz rzekł: Tak też i ten lud, i też ten naród przed moim obliczem – oświadczenie JHWH, i też wszelkie dzieło ich rąk, i to, co tam ofiarują – jest to nieczyste."
  tags: []
"Ag2,15":
  text: "A teraz zastanówcie się, proszę w waszych sercach: Od tego dnia i potem, przedtem nim położono kamień na kamieniu w świątyni JHWH;"
  tags: []
"Ag2,16":
  text: "Czy nie było tak, że gdy ktoś przyszedł do stogu zboża z dwudziestu miar, było ich dziesięć; gdy przyszedł do kadzi, aby naczerpać pięćdziesiąt miar wina, byłotylko dwadzieścia;"
  tags: []
"Ag2,17":
  text: "Smagałem was posuchą zbóż i pleśnią, a wszystkie dzieła waszych rąk gradem; a nikt z was nie zawrócił do mnie – oświadczenie JHWH."
  tags: []
"Ag2,18":
  text: "Zastanówcie się, proszę w waszych sercach: Od tego dnia i potem, od dnia dwudziestego czwartego miesiąca dziewiątego od dnia, w którym został posadowiony fundament świątyni JHWH, zastanówcie się w waszych sercach, mówię:"
  tags: []
"Ag2,19":
  text: "Czy jest jeszcze ziarno w spichlerzu? A jeszcze krzew winorośli, figowiec, drzewo granatu, drzewo oliwne nie zaowocowały; lecz od tego dnia będę błogosławił."
  tags: []
"Ag2,20":
  text: "I stało się Słowo JHWH ponownie do Aggeusza dwudziestego czwartego dnia tego miesiąca, głoszące:"
  tags: []
"Ag2,21":
  text: "Mów do Zorobabela, namiestnika Judei, głosząc: Ja potrząsnę niebiosa i ziemię;"
  tags: []
"Ag2,22":
  text: "I przewrócę trony królestw, i zniszczę siłę królestw narodów; przewrócę rydwan, i nim jadących, i padną konie i jadący na nich, każdy od miecza swojego brata."
  tags: []
"Ag2,23":
  text: "W tym dniu – oświadczenie JHWH Zastępów, wezmę ciebie, Zorobabelu, synu Szealtiela, mój sługo – oświadczenie JHWH, i uczynię cię jako sygnet; bo wybrałem ciebie – oświadczenie JHWH Zastępów."
  tags: []
