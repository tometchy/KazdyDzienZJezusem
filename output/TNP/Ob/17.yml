"Ob17,1": "I przyszedł jeden z siedmiu aniołów, mających siedem czasz, i powiedział do mnie, mówiąc mi: Chodź, pokażę ci sąd nad wielką nierządnicą, siedzącą nad wielkimi wodami,"
"Ob17,2": "Z którą oddali się nierządowi królowie ziemi, a mieszkańcy ziemi zostali upojeni winem jej nierządu."
"Ob17,3": "I przeniósł mnie w duchu na pustynię. I widziałem kobietę siedzącą na szkarłatnym dzikim zwierzęciu, które jest pełne bluźnierczych imion, mającym siedem głów i dziesięć rogów."
"Ob17,4": "A kobieta była przyobleczona w purpurę i w szkarłat, i ozdobiona złotem i drogim kamieniem, i perłami, mając w swojej ręce złoty kielich pełen obrzydliwości i nieczystości swojego nierządu."
"Ob17,5": "A na jej czole wypisane jest imię: „Tajemnica, Wielki Babilon, matka nierządnic i obrzydliwości ziemi”."
"Ob17,6": "I widziałem kobietę, która jest pijana od krwi świętych i od krwi męczenników Jezusa; i zdziwiłem się, gdy ją zobaczyłem. Cudactwo wielkie."
"Ob17,7": "I powiedział mi anioł: Dlaczego się zdziwiłeś? Ja ci oznajmię tajemnicę tej kobiety i dzikiego zwierzęcia, które ją nosi, i ma siedem głów i dziesięć rogów."
"Ob17,8": "Dzikie zwierzę, które widziałeś, było i już go nie ma, i ma wyjść z otchłani, i idzie na zgubę; i zdziwią się mieszkańcy ziemi, których imiona od założenia świata nie są zapisane w zwoju życia, widząc dzikie zwierzę, które było i nie ma, chociaż jest."
"Ob17,9": "Tu potrzeba umysłu mającego mądrość. Siedem głów to siedem gór, na których siedzi ta kobieta,"
"Ob17,10": "I jest siedmiu królów; pięciu upadło i jeden jest, inny jeszcze nie przyszedł, a gdy przyjdzie, musi on pozostać na krótko."
"Ob17,11": "I dzikie zwierzę, które było i nie ma go, ono jest ósmym, i jest z owych siedmiu, i idzie na zgubę."
"Ob17,12": "A dziesięć rogów, które widziałeś, to jest dziesięciu królów, którzy jeszcze nie wzięli królestwa; ale przyjmują władzę jako królowie z dzikim zwierzęciem na jedną godzinę."
"Ob17,13": "Ci mają jeden zamysł, i oddadzą swoją moc i władzę dzikiemu zwierzęciu."
"Ob17,14": "Ci będą walczyć z Barankiem, a Baranek ich zwycięży, bo jest Panem panów i Królem królów, a z Nim ci, którzy są powołani, wybrani i wierni."
"Ob17,15": "I mówi do mnie: Wody, które widziałeś, gdzie siedzi nierządnica, to są ludy i tłumy, i narody, i języki."
"Ob17,16": "A dziesięć rogów, które widziałeś na dzikim zwierzęciu, to ci, którzy znienawidzą nierządnicę i uczynią ją spustoszoną i nagą, a jej ciała zjedzą, i ją spalą w ogniu."
"Ob17,17": "Bóg bowiem wlał do ich serc, aby uczynili Jego zamysł, i uczynili to jednomyślnie, by oddali swoje królowanie dzikiemu zwierzęciu, aż dokonają się Słowa Boże."
"Ob17,18": "A kobieta, którą widziałeś, jest wielkim miastem, mającym władzę królewską nad królami ziemi."
