"Ob17,1":
  text: "I przyszedł jeden z siedmiu aniołów, mających siedem czasz, i powiedział do mnie, mówiąc mi: Chodź, pokażę ci sąd nad wielką nierządnicą, siedzącą nad wielkimi wodami,"
  tags: []
"Ob17,2":
  text: "Z którą oddali się nierządowi królowie ziemi, a mieszkańcy ziemi zostali upojeni winem jej nierządu."
  tags: []
"Ob17,3":
  text: "I przeniósł mnie w duchu na pustynię. I widziałem kobietę siedzącą na szkarłatnym dzikim zwierzęciu, które jest pełne bluźnierczych imion, mającym siedem głów i dziesięć rogów."
  tags: []
"Ob17,4":
  text: "A kobieta była przyobleczona w purpurę i w szkarłat, i ozdobiona złotem i drogim kamieniem, i perłami, mając w swojej ręce złoty kielich pełen obrzydliwości i nieczystości swojego nierządu."
  tags: []
"Ob17,5":
  text: "A na jej czole wypisane jest imię: „Tajemnica, Wielki Babilon, matka nierządnic i obrzydliwości ziemi”."
  tags: []
"Ob17,6":
  text: "I widziałem kobietę, która jest pijana od krwi świętych i od krwi męczenników Jezusa; i zdziwiłem się, gdy ją zobaczyłem. Cudactwo wielkie."
  tags: []
"Ob17,7":
  text: "I powiedział mi anioł: Dlaczego się zdziwiłeś? Ja ci oznajmię tajemnicę tej kobiety i dzikiego zwierzęcia, które ją nosi, i ma siedem głów i dziesięć rogów."
  tags: []
"Ob17,8":
  text: "Dzikie zwierzę, które widziałeś, było i już go nie ma, i ma wyjść z otchłani, i idzie na zgubę; i zdziwią się mieszkańcy ziemi, których imiona od założenia świata nie są zapisane w zwoju życia, widząc dzikie zwierzę, które było i nie ma, chociaż jest."
  tags: []
"Ob17,9":
  text: "Tu potrzeba umysłu mającego mądrość. Siedem głów to siedem gór, na których siedzi ta kobieta,"
  tags: []
"Ob17,10":
  text: "I jest siedmiu królów; pięciu upadło i jeden jest, inny jeszcze nie przyszedł, a gdy przyjdzie, musi on pozostać na krótko."
  tags: []
"Ob17,11":
  text: "I dzikie zwierzę, które było i nie ma go, ono jest ósmym, i jest z owych siedmiu, i idzie na zgubę."
  tags: []
"Ob17,12":
  text: "A dziesięć rogów, które widziałeś, to jest dziesięciu królów, którzy jeszcze nie wzięli królestwa; ale przyjmują władzę jako królowie z dzikim zwierzęciem na jedną godzinę."
  tags: []
"Ob17,13":
  text: "Ci mają jeden zamysł, i oddadzą swoją moc i władzę dzikiemu zwierzęciu."
  tags: []
"Ob17,14":
  text: "Ci będą walczyć z Barankiem, a Baranek ich zwycięży, bo jest Panem panów i Królem królów, a z Nim ci, którzy są powołani, wybrani i wierni."
  tags: []
"Ob17,15":
  text: "I mówi do mnie: Wody, które widziałeś, gdzie siedzi nierządnica, to są ludy i tłumy, i narody, i języki."
  tags: []
"Ob17,16":
  text: "A dziesięć rogów, które widziałeś na dzikim zwierzęciu, to ci, którzy znienawidzą nierządnicę i uczynią ją spustoszoną i nagą, a jej ciała zjedzą, i ją spalą w ogniu."
  tags: []
"Ob17,17":
  text: "Bóg bowiem wlał do ich serc, aby uczynili Jego zamysł, i uczynili to jednomyślnie, by oddali swoje królowanie dzikiemu zwierzęciu, aż dokonają się Słowa Boże."
  tags: []
"Ob17,18":
  text: "A kobieta, którą widziałeś, jest wielkim miastem, mającym władzę królewską nad królami ziemi."
  tags: []
