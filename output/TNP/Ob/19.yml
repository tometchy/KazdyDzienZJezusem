"Ob19,1":
  text: "I po tych wydarzeniach usłyszałem potężny głos licznego tłumu w niebie, mówiącego: Hallelujah! Zbawienie, chwała, cześć i moc PANU, Bogu naszemu."
  tags: []
"Ob19,2":
  text: "Bo prawdziwe i sprawiedliwe są Jego sądy; gdyż osądził wielką nierządnicę, która niszczyła ziemię swoim nierządem, i pomścił krew swoich sług przelaną z jej ręki."
  tags: []
"Ob19,3":
  text: "I powiedzieli powtórnie: Hallelujah! I dym jej wznosi się na wieki wieków."
  tags: []
"Ob19,4":
  text: "I upadło dwudziestu czterech starszych i cztery stworzenia, i oddali pokłon Bogu, siedzącemu na tronie, mówiąc: Amen, Hallelujah!"
  tags: []
"Ob19,5":
  text: "I wyszedł głos od tronu, mówiący: Chwalcie Boga naszego, wszyscy Jego słudzy i ci, którzy się Go boją, mali i wielcy."
  tags: []
"Ob19,6":
  text: "I słyszałem jakby głos wielkiego tłumu, i jakby głos wielu wód, i jakby głos potężnych grzmotów, mówiących: Hallelujah! Gdyż zakrólował PAN, Bóg Wszechmogący;"
  tags: []
"Ob19,7":
  text: "Radujmy się i weselmy się, i oddajmy Mu chwałę; bo nadeszło wesele Baranka, a małżonka Jego przygotowała się."
  tags: []
"Ob19,8":
  text: "I zostało jej dane, aby przywdziała cienki len, czysty i lśniący; albowiem cienki len, są to sprawiedliwe czyny świętych."
  tags: []
"Ob19,9":
  text: "A do mnie mówi: Napisz: Błogosławieni ci, którzy są wezwani na wieczerzę weselną Baranka. I mówi mi: To są prawdziwe Słowa Boże."
  tags: []
"Ob19,10":
  text: "I upadłem przed jego stopami, aby mu oddać pokłon; i mówi mi: Uważaj, abyś tego nie czynił; ja jestem współsługą twoim i twoich braci, którzy mają świadectwo Jezusa. Bogu oddaj pokłon; bowiem świadectwem Jezusa jest duch proroctwa."
  tags: []
"Ob19,11":
  text: "I widziałem otwarte niebo, a oto biały koń; a Ten, który na nim siedzi, nazywa się Wierny i Prawdziwy, i w sprawiedliwości sądzi i walczy."
  tags: []
"Ob19,12":
  text: "A oczy Jego jak płomień ognia, i na głowie Jego wiele koron; ma napisane imię, którego nikt nie zna, tylko On sam."
  tags: []
"Ob19,13":
  text: "I odziany był w szatę zanurzoną we krwi, a imię, którym Go zwą – Słowo Boże."
  tags: []
"Ob19,14":
  text: "I wojska w niebie podążały za Nim na białych koniach, obleczone w cienki len, biały i czysty."
  tags: []
"Ob19,15":
  text: "A z Jego ust wychodzi ostry miecz, aby nim wymierzyć cios narodom; i sam będzie je pasł laską żelazną, i sam depcze tłocznię wina zapalczywości i gniewu Boga Wszechmogącego."
  tags: []
"Ob19,16":
  text: "I ma na szacie i na swoim biodrze wypisane imię: Król królów i Pan panów."
  tags: []
"Ob19,17":
  text: "I zobaczyłem jednego anioła stojącego w słońcu, i zawołał potężnym głosem, mówiąc wszystkim ptakom latającym środkiem nieba: Przyjdźcie i zgromadzajcie się na wieczerzę wielkiego Boga."
  tags: []
"Ob19,18":
  text: "Abyście jedli ciała królów i ciała wodzów, i ciała mocarzy, i ciała koni, i tych, którzy siedzą na nich, i ciała wszystkich wolnych, a także i niewolników, małych i wielkich."
  tags: []
"Ob19,19":
  text: "I zobaczyłem dzikie zwierzę i królów ziemi, i wojska ich zebrane, aby stoczyć bitwę z siedzącym na koniu i z Jego wojskiem."
  tags: []
"Ob19,20":
  text: "I pojmane zostało dzikie zwierzę a potem fałszywy prorok, który przed nim uczynił cudowne znaki, którymi zwiódł tych, którzy przyjęli znamię dzikiego zwierzęcia i oddawali pokłon jego obrazowi. Obaj żywcem zostali wrzuceni do jeziora ognia, płonącego siarką."
  tags: []
"Ob19,21":
  text: "A pozostali zostali pobici przez siedzącego na koniu, mieczem wychodzącym z Jego ust, i wszystkie ptaki nasyciły się ich ciałami."
  tags: []
