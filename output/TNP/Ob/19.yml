"Ob19,1": "I po tych wydarzeniach usłyszałem potężny głos licznego tłumu w niebie, mówiącego: Hallelujah! Zbawienie, chwała, cześć i moc PANU, Bogu naszemu."
"Ob19,2": "Bo prawdziwe i sprawiedliwe są Jego sądy; gdyż osądził wielką nierządnicę, która niszczyła ziemię swoim nierządem, i pomścił krew swoich sług przelaną z jej ręki."
"Ob19,3": "I powiedzieli powtórnie: Hallelujah! I dym jej wznosi się na wieki wieków."
"Ob19,4": "I upadło dwudziestu czterech starszych i cztery stworzenia, i oddali pokłon Bogu, siedzącemu na tronie, mówiąc: Amen, Hallelujah!"
"Ob19,5": "I wyszedł głos od tronu, mówiący: Chwalcie Boga naszego, wszyscy Jego słudzy i ci, którzy się Go boją, mali i wielcy."
"Ob19,6": "I słyszałem jakby głos wielkiego tłumu, i jakby głos wielu wód, i jakby głos potężnych grzmotów, mówiących: Hallelujah! Gdyż zakrólował PAN, Bóg Wszechmogący;"
"Ob19,7": "Radujmy się i weselmy się, i oddajmy Mu chwałę; bo nadeszło wesele Baranka, a małżonka Jego przygotowała się."
"Ob19,8": "I zostało jej dane, aby przywdziała cienki len, czysty i lśniący; albowiem cienki len, są to sprawiedliwe czyny świętych."
"Ob19,9": "A do mnie mówi: Napisz: Błogosławieni ci, którzy są wezwani na wieczerzę weselną Baranka. I mówi mi: To są prawdziwe Słowa Boże."
"Ob19,10": "I upadłem przed jego stopami, aby mu oddać pokłon; i mówi mi: Uważaj, abyś tego nie czynił; ja jestem współsługą twoim i twoich braci, którzy mają świadectwo Jezusa. Bogu oddaj pokłon; bowiem świadectwem Jezusa jest duch proroctwa."
"Ob19,11": "I widziałem otwarte niebo, a oto biały koń; a Ten, który na nim siedzi, nazywa się Wierny i Prawdziwy, i w sprawiedliwości sądzi i walczy."
"Ob19,12": "A oczy Jego jak płomień ognia, i na głowie Jego wiele koron; ma napisane imię, którego nikt nie zna, tylko On sam."
"Ob19,13": "I odziany był w szatę zanurzoną we krwi, a imię, którym Go zwą – Słowo Boże."
"Ob19,14": "I wojska w niebie podążały za Nim na białych koniach, obleczone w cienki len, biały i czysty."
"Ob19,15": "A z Jego ust wychodzi ostry miecz, aby nim wymierzyć cios narodom; i sam będzie je pasł laską żelazną, i sam depcze tłocznię wina zapalczywości i gniewu Boga Wszechmogącego."
"Ob19,16": "I ma na szacie i na swoim biodrze wypisane imię: Król królów i Pan panów."
"Ob19,17": "I zobaczyłem jednego anioła stojącego w słońcu, i zawołał potężnym głosem, mówiąc wszystkim ptakom latającym środkiem nieba: Przyjdźcie i zgromadzajcie się na wieczerzę wielkiego Boga."
"Ob19,18": "Abyście jedli ciała królów i ciała wodzów, i ciała mocarzy, i ciała koni, i tych, którzy siedzą na nich, i ciała wszystkich wolnych, a także i niewolników, małych i wielkich."
"Ob19,19": "I zobaczyłem dzikie zwierzę i królów ziemi, i wojska ich zebrane, aby stoczyć bitwę z siedzącym na koniu i z Jego wojskiem."
"Ob19,20": "I pojmane zostało dzikie zwierzę a potem fałszywy prorok, który przed nim uczynił cudowne znaki, którymi zwiódł tych, którzy przyjęli znamię dzikiego zwierzęcia i oddawali pokłon jego obrazowi. Obaj żywcem zostali wrzuceni do jeziora ognia, płonącego siarką."
"Ob19,21": "A pozostali zostali pobici przez siedzącego na koniu, mieczem wychodzącym z Jego ust, i wszystkie ptaki nasyciły się ich ciałami."
