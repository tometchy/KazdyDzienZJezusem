"Ob20,1":
  text: "I widziałem anioła zstępującego z nieba, który miał klucz do otchłani i wielki łańcuch w swojej ręce."
  tags: []
"Ob20,2":
  text: "I pochwycił smoka, węża starodawnego, którym jest diabeł i szatan, i związał go na tysiąc lat;"
  tags: []
"Ob20,3":
  text: "I wrzucił go do otchłani, i zamknął go, i położył nad nim pieczęć, aby już nie zwodził więcej narodów, aż się wypełni tysiąc lat; a po tych wydarzeniach trzeba, by został rozwiązany na krótki czas."
  tags: []
"Ob20,4":
  text: "I widziałem trony; i zasiedli na nich, i dany był im sąd; zobaczyłem dusze tych, którzy zostali ścięci toporem z powodu świadectwa Jezusa i z powodu Słowa Bożego, i tych, którzy nie oddali pokłonu dzikiemu zwierzęciu, ani jego obrazowi, i nie przyjęli jego znamienia na swoje czoło i na swoją rękę; ci ożyli i zaczęli królować z Chrystusem tysiąc lat."
  tags: []
"Ob20,5":
  text: "Natomiast ci pozostali z umarłych nie ożyli, aż dopełni się tysiąc lat. To jest pierwsze powstanie z martwych."
  tags: []
"Ob20,6":
  text: "Błogosławiony i święty ten, który ma udział w pierwszym powstaniu z martwych; nad tymi druga śmierć nie ma władzy, ale będą kapłanami Boga i Chrystusa, i będą z Nim królować tysiąc lat."
  tags: []
"Ob20,7":
  text: "A gdy dopełni się tysiąc lat, uwolniony zostanie szatan ze swojego więzienia,"
  tags: []
"Ob20,8":
  text: "I wyjdzie zwieść narody, które są na czterech krańcach ziemi, Goga i Magoga, aby je zgromadzić na bitwę; a liczba ich jak piasek morza."
  tags: []
"Ob20,9":
  text: "I wstąpili na szerokość ziemi, i otoczyli obóz świętych i miasto umiłowane. I zstąpił ogień z nieba od Boga i pochłonął ich."
  tags: []
"Ob20,10":
  text: "A diabeł, który ich zwodzi, został wrzucony do jeziora ognia i siarki, gdzie dzikie zwierzę i fałszywy prorok; i będą męczeni dniem i nocą na wieki wieków."
  tags: []
"Ob20,11":
  text: "I widziałem wielki biały tron, i siedzącego na nim, od którego oblicza uciekła ziemia i niebo, i nie znalazło się miejsce dla nich."
  tags: []
"Ob20,12":
  text: "I widziałem umarłych, małych i wielkich, stojących przed Bogiem; i zostały otwarte zwoje i inny zwój został otwarty, to jest zwój życia; i umarli z tych, którzy są zapisani w zwojach, zostali osądzeni według swoich czynów."
  tags: []
"Ob20,13":
  text: "I morze wydało umarłych, którzy w nim byli, i Śmierć, i Hades wydały umarłych, którzy w nich byli; i zostali osądzeni, każdy według swoich czynów."
  tags: []
"Ob20,14":
  text: "I Śmierć, i Hades zostały wrzucone w jezioro ognia. To jest ta druga śmierć."
  tags: []
"Ob20,15":
  text: "A jeśli ktoś nie został znaleziony jako zapisany w zwoju życia, został wrzucony do jeziora ognia."
  tags: []
