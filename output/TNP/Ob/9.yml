"Ob9,1": "I zatrąbił piąty anioł, i widziałem spadającą z nieba na ziemię gwiazdę, i został mu dany klucz od studni otchłani."
"Ob9,2": "I otworzył studnię otchłani; i wzniósł się dym ze studni jak dym z wielkiego pieca, i słońce, i powietrze zostało zaćmione od dymu studni."
"Ob9,3": "I z dymu wyszły na ziemię szarańcze; i dano im władzę, władzę, jaką na tej ziemi mają skorpiony,"
"Ob9,4": "I powiedziano im, żeby nie zaszkodziły trawie ziemi, ani żadnej zieleni, ani żadnemu drzewu, a tylko samym ludziom, którzy nie mają pieczęci Boga na swoich czołach."
"Ob9,5": "I dano im nakaz, żeby ich nie zabijały, lecz aby byli dręczeni przez pięć miesięcy; a ból ich jest jak ból ukłucia skorpiona, gdy rani człowieka."
"Ob9,6": "I w tych dniach ludzie będą szukać śmierci, ale jej nie znajdą; i będą pragnąć umrzeć, ale śmierć od nich ucieknie."
"Ob9,7": "A z wyglądu szarańcze były podobne do koni przygotowanych do wojny, a na ich głowach były jakby wieńce podobne do złota, a twarze ich jak twarze ludzi;"
"Ob9,8": "I miały włosy jak włosy kobiet, a zęby ich były jak zęby lwów;"
"Ob9,9": "I miały pancerze jakby pancerze żelazne, a szum ich skrzydeł jak głos wozów, gdy wiele koni biegnie do bitwy;"
"Ob9,10": "I ogony miały podobne jak u skorpionów, a żądła były w ich ogonach, a moc ich – szkodzić ludziom przez pięć miesięcy;"
"Ob9,11": "I mają nad sobą króla, anioła otchłani, na imię mu po hebrajsku Abaddon, a w greckim ma imię Apollon."
"Ob9,12": "Jedno biada odeszło; oto nadchodzą po tych wydarzeniach jeszcze dwa biada."
"Ob9,13": "I zatrąbił szósty anioł, i słyszałem głos jeden z czterech rogów złotego ołtarza, który jest przed Bogiem,"
"Ob9,14": "Mówiący szóstemu aniołowi, który miał trąbę: Rozwiąż czterech aniołów związanych nad wielką rzeką Eufrat."
"Ob9,15": "I zostali rozwiązani czterej aniołowie, przygotowani na tę godzinę i dzień, i miesiąc, i na rok, aby zabijali trzecią część ludzi."
"Ob9,16": "I liczba wojsk konnych była dwie miriady miriad; i usłyszałem jego liczbę."
"Ob9,17": "I tak zobaczyłem w tym widzeniu konie; a ci, którzy siedzą na nich mieli pancerze barwy ognistoczerwonej, i hiacyntu, i siarki; a głowy koni były jak głowy lwów, i z ich pysków wychodzi ogień, dym i siarka."
"Ob9,18": "Przez tych trzech została zabita trzecia część ludzi: od ognia, od dymu i od siarki, które wychodziły z ich pysków."
"Ob9,19": "Albowiem moc ich jest w ich pyskach i w ich ogonach; bo ich ogony są podobne do węży mających głowy; i nimi szkodzą."
"Ob9,20": "A pozostali ludzie, którzy nie zostali zabici tymi ciosami, nie upamiętali się z dzieł swoich rąk, tak by nie kłaniali się demonom i bożkom złotym, i srebrnym, i miedzianym, i kamiennym, i drewnianym, które nie mogą ani widzieć, ani słuchać, ani chodzić;"
"Ob9,21": "I oni nie upamiętali się ani ze swoich morderstw, ani ze swoich czarów, ani ze swojego nierządu, ani ze swoich kradzieży."
