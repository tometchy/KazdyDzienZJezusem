"Ob9,1":
  text: "I zatrąbił piąty anioł, i widziałem spadającą z nieba na ziemię gwiazdę, i został mu dany klucz od studni otchłani."
  tags: []
"Ob9,2":
  text: "I otworzył studnię otchłani; i wzniósł się dym ze studni jak dym z wielkiego pieca, i słońce, i powietrze zostało zaćmione od dymu studni."
  tags: []
"Ob9,3":
  text: "I z dymu wyszły na ziemię szarańcze; i dano im władzę, władzę, jaką na tej ziemi mają skorpiony,"
  tags: []
"Ob9,4":
  text: "I powiedziano im, żeby nie zaszkodziły trawie ziemi, ani żadnej zieleni, ani żadnemu drzewu, a tylko samym ludziom, którzy nie mają pieczęci Boga na swoich czołach."
  tags: []
"Ob9,5":
  text: "I dano im nakaz, żeby ich nie zabijały, lecz aby byli dręczeni przez pięć miesięcy; a ból ich jest jak ból ukłucia skorpiona, gdy rani człowieka."
  tags: []
"Ob9,6":
  text: "I w tych dniach ludzie będą szukać śmierci, ale jej nie znajdą; i będą pragnąć umrzeć, ale śmierć od nich ucieknie."
  tags: []
"Ob9,7":
  text: "A z wyglądu szarańcze były podobne do koni przygotowanych do wojny, a na ich głowach były jakby wieńce podobne do złota, a twarze ich jak twarze ludzi;"
  tags: []
"Ob9,8":
  text: "I miały włosy jak włosy kobiet, a zęby ich były jak zęby lwów;"
  tags: []
"Ob9,9":
  text: "I miały pancerze jakby pancerze żelazne, a szum ich skrzydeł jak głos wozów, gdy wiele koni biegnie do bitwy;"
  tags: []
"Ob9,10":
  text: "I ogony miały podobne jak u skorpionów, a żądła były w ich ogonach, a moc ich – szkodzić ludziom przez pięć miesięcy;"
  tags: []
"Ob9,11":
  text: "I mają nad sobą króla, anioła otchłani, na imię mu po hebrajsku Abaddon, a w greckim ma imię Apollon."
  tags: []
"Ob9,12":
  text: "Jedno biada odeszło; oto nadchodzą po tych wydarzeniach jeszcze dwa biada."
  tags: []
"Ob9,13":
  text: "I zatrąbił szósty anioł, i słyszałem głos jeden z czterech rogów złotego ołtarza, który jest przed Bogiem,"
  tags: []
"Ob9,14":
  text: "Mówiący szóstemu aniołowi, który miał trąbę: Rozwiąż czterech aniołów związanych nad wielką rzeką Eufrat."
  tags: []
"Ob9,15":
  text: "I zostali rozwiązani czterej aniołowie, przygotowani na tę godzinę i dzień, i miesiąc, i na rok, aby zabijali trzecią część ludzi."
  tags: []
"Ob9,16":
  text: "I liczba wojsk konnych była dwie miriady miriad; i usłyszałem jego liczbę."
  tags: []
"Ob9,17":
  text: "I tak zobaczyłem w tym widzeniu konie; a ci, którzy siedzą na nich mieli pancerze barwy ognistoczerwonej, i hiacyntu, i siarki; a głowy koni były jak głowy lwów, i z ich pysków wychodzi ogień, dym i siarka."
  tags: []
"Ob9,18":
  text: "Przez tych trzech została zabita trzecia część ludzi: od ognia, od dymu i od siarki, które wychodziły z ich pysków."
  tags: []
"Ob9,19":
  text: "Albowiem moc ich jest w ich pyskach i w ich ogonach; bo ich ogony są podobne do węży mających głowy; i nimi szkodzą."
  tags: []
"Ob9,20":
  text: "A pozostali ludzie, którzy nie zostali zabici tymi ciosami, nie upamiętali się z dzieł swoich rąk, tak by nie kłaniali się demonom i bożkom złotym, i srebrnym, i miedzianym, i kamiennym, i drewnianym, które nie mogą ani widzieć, ani słuchać, ani chodzić;"
  tags: []
"Ob9,21":
  text: "I oni nie upamiętali się ani ze swoich morderstw, ani ze swoich czarów, ani ze swojego nierządu, ani ze swoich kradzieży."
  tags: []
