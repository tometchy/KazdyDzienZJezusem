"Ob22,1": "I pokazał mi czystą rzekę wody życia, jasną jak kryształ, wychodzącą z tronu Boga i Baranka."
"Ob22,2": "Na środku jego placu i po obu brzegach rzeki – drzewo życia, przynoszące dwanaście owoców. Każdego miesiąca oddające po jednym owocu; a liście drzewa służą leczeniu narodów."
"Ob22,3": "I nie będzie już nic przeklętego, i będzie w nim tron Boga i Baranka, a Jego słudzy będą Mu służyć,"
"Ob22,4": "I ujrzą Jego oblicze, a imię Jego będzie na ich czołach."
"Ob22,5": "I nocy tam nie będzie, i nie ma już potrzeby światła lampy i słońca; bo oświeca ich PAN Bóg, i będą królować na wieki wieków."
"Ob22,6": "I powiedział mi: Te słowa są godne zaufania i prawdziwe, a PAN, Bóg świętych proroków, posłał swojego anioła, aby pokazać swoim sługom to, co koniecznie musi stać się szybko."
"Ob22,7": "Oto przychodzę śpiesznie. Błogosławiony ten, kto zachowuje słowa proroctwa tego zwoju."
"Ob22,8": "A ja, Jan, patrząc i słuchając, gdy to usłyszałem i zobaczyłem, upadłem, aby oddać pokłon przed stopami anioła, który mi to ukazywał."
"Ob22,9": "I mówi mi: Uważaj – nie rób tego; bo jestem współsługą twoim i twoich braci proroków, i tych, którzy zachowują słowa tego zwoju; Bogu oddaj pokłon."
"Ob22,10": "I mówi mi: Nie pieczętuj słów proroctwa tego zwoju; gdyż czas jest bliski."
"Ob22,11": "Kto czyni niesprawiedliwość niech nadal czyni niesprawiedliwość, brudny niech nadal się pobrudzi; sprawiedliwy niech nadal czyni sprawiedliwość, a kto święty niech nadal da się uświęcić."
"Ob22,12": "I oto przychodzę śpiesznie, a zapłata moja jest ze mną, aby oddać każdemu zgodnie z tym jakie będzie jego dzieło."
"Ob22,13": "Ja jestem Alfa i Omega, początek i koniec, pierwszy i ostatni."
"Ob22,14": "Błogosławieni, którzy zachowują Jego przykazania, aby do nich należało prawo do drzewa życia, i by weszli bramami do miasta."
"Ob22,15": "Na zewnątrz natomiast są psy i czarownicy, i nierządnicy, i mordercy, i bałwochwalcy, i każdy, kto miłuje kłamstwo i dopuszcza się go."
"Ob22,16": "Ja, Jezus, posłałem mojego anioła, aby wam świadczył o tych wydarzeniach w zborach. Ja jestem korzeń i ród Dawida, gwiazda jasna i poranna."
"Ob22,17": "A Duch i oblubienica mówią: Przyjdź! A kto słyszy, niech powie: Przyjdź! A kto pragnie, niech przyjdzie; a kto chce, niech weźmie wodę życia darmo."
"Ob22,18": "Współświadczę bowiem każdemu słuchającemu słów proroctwa tego zwoju: Jeśli ktoś dodaje coś do tego zwoju, doda mu też Bóg plag opisanych w tym zwoju."
"Ob22,19": "A jeśli ktoś odejmuje ze słów proroctwa tego zwoju, Bóg odejmie dział jego ze zwoju życia i z miasta świętego, i które są opisane w tym zwoju."
"Ob22,20": "Mówi Ten, który świadczy o tym: Tak, przychodzę śpiesznie. Amen. Tak, przyjdź Panie Jezu!"
"Ob22,21": "Łaska Pana naszego Jezusa Chrystusa z wami wszystkimi. Amen."
