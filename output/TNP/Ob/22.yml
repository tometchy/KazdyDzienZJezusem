"Ob22,1":
  text: "I pokazał mi czystą rzekę wody życia, jasną jak kryształ, wychodzącą z tronu Boga i Baranka."
  tags: []
"Ob22,2":
  text: "Na środku jego placu i po obu brzegach rzeki – drzewo życia, przynoszące dwanaście owoców. Każdego miesiąca oddające po jednym owocu; a liście drzewa służą leczeniu narodów."
  tags: []
"Ob22,3":
  text: "I nie będzie już nic przeklętego, i będzie w nim tron Boga i Baranka, a Jego słudzy będą Mu służyć,"
  tags: []
"Ob22,4":
  text: "I ujrzą Jego oblicze, a imię Jego będzie na ich czołach."
  tags: []
"Ob22,5":
  text: "I nocy tam nie będzie, i nie ma już potrzeby światła lampy i słońca; bo oświeca ich PAN Bóg, i będą królować na wieki wieków."
  tags: []
"Ob22,6":
  text: "I powiedział mi: Te słowa są godne zaufania i prawdziwe, a PAN, Bóg świętych proroków, posłał swojego anioła, aby pokazać swoim sługom to, co koniecznie musi stać się szybko."
  tags: []
"Ob22,7":
  text: "Oto przychodzę śpiesznie. Błogosławiony ten, kto zachowuje słowa proroctwa tego zwoju."
  tags: []
"Ob22,8":
  text: "A ja, Jan, patrząc i słuchając, gdy to usłyszałem i zobaczyłem, upadłem, aby oddać pokłon przed stopami anioła, który mi to ukazywał."
  tags: []
"Ob22,9":
  text: "I mówi mi: Uważaj – nie rób tego; bo jestem współsługą twoim i twoich braci proroków, i tych, którzy zachowują słowa tego zwoju; Bogu oddaj pokłon."
  tags: []
"Ob22,10":
  text: "I mówi mi: Nie pieczętuj słów proroctwa tego zwoju; gdyż czas jest bliski."
  tags: []
"Ob22,11":
  text: "Kto czyni niesprawiedliwość niech nadal czyni niesprawiedliwość, brudny niech nadal się pobrudzi; sprawiedliwy niech nadal czyni sprawiedliwość, a kto święty niech nadal da się uświęcić."
  tags: []
"Ob22,12":
  text: "I oto przychodzę śpiesznie, a zapłata moja jest ze mną, aby oddać każdemu zgodnie z tym jakie będzie jego dzieło."
  tags: []
"Ob22,13":
  text: "Ja jestem Alfa i Omega, początek i koniec, pierwszy i ostatni."
  tags: []
"Ob22,14":
  text: "Błogosławieni, którzy zachowują Jego przykazania, aby do nich należało prawo do drzewa życia, i by weszli bramami do miasta."
  tags: []
"Ob22,15":
  text: "Na zewnątrz natomiast są psy i czarownicy, i nierządnicy, i mordercy, i bałwochwalcy, i każdy, kto miłuje kłamstwo i dopuszcza się go."
  tags: []
"Ob22,16":
  text: "Ja, Jezus, posłałem mojego anioła, aby wam świadczył o tych wydarzeniach w zborach. Ja jestem korzeń i ród Dawida, gwiazda jasna i poranna."
  tags: []
"Ob22,17":
  text: "A Duch i oblubienica mówią: Przyjdź! A kto słyszy, niech powie: Przyjdź! A kto pragnie, niech przyjdzie; a kto chce, niech weźmie wodę życia darmo."
  tags: []
"Ob22,18":
  text: "Współświadczę bowiem każdemu słuchającemu słów proroctwa tego zwoju: Jeśli ktoś dodaje coś do tego zwoju, doda mu też Bóg plag opisanych w tym zwoju."
  tags: []
"Ob22,19":
  text: "A jeśli ktoś odejmuje ze słów proroctwa tego zwoju, Bóg odejmie dział jego ze zwoju życia i z miasta świętego, i które są opisane w tym zwoju."
  tags: []
"Ob22,20":
  text: "Mówi Ten, który świadczy o tym: Tak, przychodzę śpiesznie. Amen. Tak, przyjdź Panie Jezu!"
  tags: []
"Ob22,21":
  text: "Łaska Pana naszego Jezusa Chrystusa z wami wszystkimi. Amen."
  tags: []
