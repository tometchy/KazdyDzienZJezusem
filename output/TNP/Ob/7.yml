"Ob7,1":
  text: "I potem zobaczyłem czterech aniołów, stojących na czterech węgłach ziemi, trzymających cztery wiatry ziemi, aby nie wiał wiatr na ziemię, ani na morze, ani na żadne drzewo."
  tags: []
"Ob7,2":
  text: "I zobaczyłem innego anioła wstępującego od wschodu słońca, mającego pieczęć Boga żywego; i zawołał potężnym głosem do czterech aniołów, którym zostało dane uczynić szkodę ziemi i morzu,"
  tags: []
"Ob7,3":
  text: "Mówiąc: Nie wyrządźcie szkody ani ziemi, ani morzu, ani drzewom, aż odciśniemy pieczęć na czołach sług Boga naszego."
  tags: []
"Ob7,4":
  text: "I usłyszałem liczbę tych, którzy są opieczętowani: sto czterdzieści cztery tysiące opieczętowanych ze wszystkich pokoleń synów Izraela:"
  tags: []
"Ob7,5":
  text: "Z pokolenia Judy dwanaście tysięcy opieczętowanych, z pokolenia Rubena dwanaście tysięcy opieczętowanych, z pokolenia Gada dwanaście tysięcy opieczętowanych,"
  tags: []
"Ob7,6":
  text: "Z pokolenia Asera dwanaście tysięcy opieczętowanych, z pokolenia Naftalego dwanaście tysięcy opieczętowanych, z pokolenia Manassesa dwanaście tysięcy opieczętowanych,"
  tags: []
"Ob7,7":
  text: "Z pokolenia Symeona dwanaście tysięcy opieczętowanych, z pokolenia Lewiego dwanaście tysięcy opieczętowanych, z pokolenia Issachara dwanaście tysięcy opieczętowanych,"
  tags: []
"Ob7,8":
  text: "Z pokolenia Zebulona dwanaście tysięcy opieczętowanych, z pokolenia Józefa dwanaście tysięcy opieczętowanych, z pokolenia Beniamina dwanaście tysięcy opieczętowanych."
  tags: []
"Ob7,9":
  text: "Potem zobaczyłem, a oto wielki tłum ludzi, których nikt nie mógł zliczyć, z każdego narodu i plemion, i ludów, i języków, stojących przed tronem i przed Barankiem, odzianych w długie białe szaty, a w ich rękach były palmy."
  tags: []
"Ob7,10":
  text: "I wołają potężnym głosem, mówiąc: Zbawienie w Bogu naszym, siedzącym na tronie, i w Baranku."
  tags: []
"Ob7,11":
  text: "I wszyscy aniołowie stali wokół tronu i wokół starszych i czterech stworzeń, upadli przed tronem na swoje oblicze i oddali pokłon Bogu, mówiąc:"
  tags: []
"Ob7,12":
  text: "Amen. Błogosławieństwo i chwała, i mądrość, i dziękczynienie, i cześć, i moc, i siła Bogu naszemu na wieki wieków. Amen."
  tags: []
"Ob7,13":
  text: "A w odpowiedzi, jeden ze starszych powiedział do mnie: Kim są ci, którzy obleczeni są w długie białe szaty i skąd przyszli?"
  tags: []
"Ob7,14":
  text: "I powiedziałem mu: Panie, ty wiesz. I powiedział mi: To są ci, którzy przychodzą z wielkiego ucisku i wyprali swoje szaty, i wybielili je we krwi Baranka."
  tags: []
"Ob7,15":
  text: "Dlatego są przed tronem Boga i służą Mu dniem i nocą w Jego świątyni, a Ten, który siedzi na tronie, rozciągnie nad nimi namiot."
  tags: []
"Ob7,16":
  text: "Nie będą głodować, ani pragnąć i nie uderzy na nich żar słońca, ani żaden upał."
  tags: []
"Ob7,17":
  text: "Baranek bowiem, który jest pośrodku tronu, będzie ich pasł i poprowadzi ich do źródła wód żywych; i otrze Bóg wszelką łzę z ich oczu."
  tags: []
