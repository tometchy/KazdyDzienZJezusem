"Ob7,1": "I potem zobaczyłem czterech aniołów, stojących na czterech węgłach ziemi, trzymających cztery wiatry ziemi, aby nie wiał wiatr na ziemię, ani na morze, ani na żadne drzewo."
"Ob7,2": "I zobaczyłem innego anioła wstępującego od wschodu słońca, mającego pieczęć Boga żywego; i zawołał potężnym głosem do czterech aniołów, którym zostało dane uczynić szkodę ziemi i morzu,"
"Ob7,3": "Mówiąc: Nie wyrządźcie szkody ani ziemi, ani morzu, ani drzewom, aż odciśniemy pieczęć na czołach sług Boga naszego."
"Ob7,4": "I usłyszałem liczbę tych, którzy są opieczętowani: sto czterdzieści cztery tysiące opieczętowanych ze wszystkich pokoleń synów Izraela:"
"Ob7,5": "Z pokolenia Judy dwanaście tysięcy opieczętowanych, z pokolenia Rubena dwanaście tysięcy opieczętowanych, z pokolenia Gada dwanaście tysięcy opieczętowanych,"
"Ob7,6": "Z pokolenia Asera dwanaście tysięcy opieczętowanych, z pokolenia Naftalego dwanaście tysięcy opieczętowanych, z pokolenia Manassesa dwanaście tysięcy opieczętowanych,"
"Ob7,7": "Z pokolenia Symeona dwanaście tysięcy opieczętowanych, z pokolenia Lewiego dwanaście tysięcy opieczętowanych, z pokolenia Issachara dwanaście tysięcy opieczętowanych,"
"Ob7,8": "Z pokolenia Zebulona dwanaście tysięcy opieczętowanych, z pokolenia Józefa dwanaście tysięcy opieczętowanych, z pokolenia Beniamina dwanaście tysięcy opieczętowanych."
"Ob7,9": "Potem zobaczyłem, a oto wielki tłum ludzi, których nikt nie mógł zliczyć, z każdego narodu i plemion, i ludów, i języków, stojących przed tronem i przed Barankiem, odzianych w długie białe szaty, a w ich rękach były palmy."
"Ob7,10": "I wołają potężnym głosem, mówiąc: Zbawienie w Bogu naszym, siedzącym na tronie, i w Baranku."
"Ob7,11": "I wszyscy aniołowie stali wokół tronu i wokół starszych i czterech stworzeń, upadli przed tronem na swoje oblicze i oddali pokłon Bogu, mówiąc:"
"Ob7,12": "Amen. Błogosławieństwo i chwała, i mądrość, i dziękczynienie, i cześć, i moc, i siła Bogu naszemu na wieki wieków. Amen."
"Ob7,13": "A w odpowiedzi, jeden ze starszych powiedział do mnie: Kim są ci, którzy obleczeni są w długie białe szaty i skąd przyszli?"
"Ob7,14": "I powiedziałem mu: Panie, ty wiesz. I powiedział mi: To są ci, którzy przychodzą z wielkiego ucisku i wyprali swoje szaty, i wybielili je we krwi Baranka."
"Ob7,15": "Dlatego są przed tronem Boga i służą Mu dniem i nocą w Jego świątyni, a Ten, który siedzi na tronie, rozciągnie nad nimi namiot."
"Ob7,16": "Nie będą głodować, ani pragnąć i nie uderzy na nich żar słońca, ani żaden upał."
"Ob7,17": "Baranek bowiem, który jest pośrodku tronu, będzie ich pasł i poprowadzi ich do źródła wód żywych; i otrze Bóg wszelką łzę z ich oczu."
