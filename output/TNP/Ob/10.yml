"Ob10,1": "I zobaczyłem innego mocarnego anioła zstępującego z nieba, odzianego w obłok, a nad jego głową była tęcza, a jego oblicze jak słońce, i jego stopy jak kolumny ognia."
"Ob10,2": "I miał w swojej ręce otwarty mały zwój, i postawił swoją prawą stopę na morzu, a lewą na ziemi."
"Ob10,3": "I zawołał potężnym głosem, tak jak lew ryczy; a gdy zawołał, przemówiło siedem gromów swoimi głosami."
"Ob10,4": "I gdy siedem gromów przemówiło swoimi głosami, zamierzałem pisać; ale usłyszałem głos z nieba, mówiący do mnie: Zapieczętuj to, co mówiło siedem gromów i nie zapisuj tego."
"Ob10,5": "A anioł, którego zobaczyłem stojącego na morzu i na ziemi, podniósł swoją rękę ku niebu,"
"Ob10,6": "I przysiągł na żyjącego na wieki wieków, który stworzył niebo i to, co jest w nim, i ziemię i to, co jest na niej, i morze i to, co jest w nim, że czasu już nie będzie."
"Ob10,7": "Ale w dniach głosu siódmego anioła, gdy będzie miał trąbić, dokona się tajemnica Boga, jak ogłosił to jako dobrą nowinę swoim sługom, prorokom."
"Ob10,8": "A głos, który słyszałem z nieba, ponownie mówił ze mną i powiedział: Idź, weź mały zwój, który jest otwarty w ręce anioła stojącego na morzu i na ziemi."
"Ob10,9": "I poszedłem do anioła, i powiedziałem mu: Daj mi mały zwój. I powiedział mi: Weź i go zjedz, a będzie gorzki w twoich wnętrznościach, ale w twoich ustach będzie słodki jak miód."
"Ob10,10": "I wziąłem mały zwój z ręki anioła, i go zjadłem, i był w moich ustach słodki jak miód; ale gdy go zjadłem, stał się gorzki w moich wnętrznościach."
"Ob10,11": "I powiedział mi: Trzeba ci ponownie prorokować nad ludami i narodami, i językami, i wieloma królami."
