"Ob10,1":
  text: "I zobaczyłem innego mocarnego anioła zstępującego z nieba, odzianego w obłok, a nad jego głową była tęcza, a jego oblicze jak słońce, i jego stopy jak kolumny ognia."
  tags: []
"Ob10,2":
  text: "I miał w swojej ręce otwarty mały zwój, i postawił swoją prawą stopę na morzu, a lewą na ziemi."
  tags: []
"Ob10,3":
  text: "I zawołał potężnym głosem, tak jak lew ryczy; a gdy zawołał, przemówiło siedem gromów swoimi głosami."
  tags: []
"Ob10,4":
  text: "I gdy siedem gromów przemówiło swoimi głosami, zamierzałem pisać; ale usłyszałem głos z nieba, mówiący do mnie: Zapieczętuj to, co mówiło siedem gromów i nie zapisuj tego."
  tags: []
"Ob10,5":
  text: "A anioł, którego zobaczyłem stojącego na morzu i na ziemi, podniósł swoją rękę ku niebu,"
  tags: []
"Ob10,6":
  text: "I przysiągł na żyjącego na wieki wieków, który stworzył niebo i to, co jest w nim, i ziemię i to, co jest na niej, i morze i to, co jest w nim, że czasu już nie będzie."
  tags: []
"Ob10,7":
  text: "Ale w dniach głosu siódmego anioła, gdy będzie miał trąbić, dokona się tajemnica Boga, jak ogłosił to jako dobrą nowinę swoim sługom, prorokom."
  tags: []
"Ob10,8":
  text: "A głos, który słyszałem z nieba, ponownie mówił ze mną i powiedział: Idź, weź mały zwój, który jest otwarty w ręce anioła stojącego na morzu i na ziemi."
  tags: []
"Ob10,9":
  text: "I poszedłem do anioła, i powiedziałem mu: Daj mi mały zwój. I powiedział mi: Weź i go zjedz, a będzie gorzki w twoich wnętrznościach, ale w twoich ustach będzie słodki jak miód."
  tags: []
"Ob10,10":
  text: "I wziąłem mały zwój z ręki anioła, i go zjadłem, i był w moich ustach słodki jak miód; ale gdy go zjadłem, stał się gorzki w moich wnętrznościach."
  tags: []
"Ob10,11":
  text: "I powiedział mi: Trzeba ci ponownie prorokować nad ludami i narodami, i językami, i wieloma królami."
  tags: []
