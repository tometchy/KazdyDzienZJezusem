"Ob6,1": "I zobaczyłem, gdy Baranek otworzył jedną z pieczęci, i usłyszałem jedno z czterech stworzeń, mówiące jakby głosem gromu: Chodź i patrz."
"Ob6,2": "I zobaczyłem, a oto biały koń; a ten, który na nim siedział miał łuk, i dano mu wieniec, i wyszedł zwyciężając, i aby zwyciężył."
"Ob6,3": "A gdy otworzył drugą pieczęć, słyszałem drugie stworzenie, mówiące: Chodź i patrz."
"Ob6,4": "I wyszedł drugi koń, ognistoczerwony; a siedzącemu na nim, zostało dane zabrać pokój z ziemi, aby jedni drugich zabili, i został mu dany wielki miecz."
"Ob6,5": "A gdy otworzył trzecią pieczęć, słyszałem trzecie stworzenie, mówiące: Chodź i patrz. I widziałem, a oto koń czarny; a ten, który na nim siedział, miał wagę w swojej ręce."
"Ob6,6": "I słyszałem głos pośrodku czterech stworzeń, mówiący: Kwarta pszenicy za denara, i trzy kwarty jęczmienia za denara, a oliwie i winu nie wyrządź szkody."
"Ob6,7": "A gdy zdjął czwartą pieczęć, słyszałem głos czwartego stworzenia, mówiący: Chodź i patrz."
"Ob6,8": "I zobaczyłem, a oto koń bladozielony, a ten, który na nim siedział, miał na imię Śmierć, i Hades idzie z nim; i dano im władzę nad czwartą częścią ziemi, aby zabić mieczem i głodem, i śmiercią, i przez dzikie zwierzęta ziemi."
"Ob6,9": "A gdy otworzył piątą pieczęć, zobaczyłem poniżej ołtarza dusze zabitych z powodu Słowa Bożego i z powodu świadectwa, które posiadali."
"Ob6,10": "I zawołali potężnym głosem, mówiąc: Jak długo, Panie, Święty i Prawdziwy, nie osądzasz i nie dokonujesz pomsty naszej krwi na mieszkańcach ziemi?"
"Ob6,11": "I dano każdemu z nich długą białą szatę, i powiedziano im, aby odpoczęli jeszcze krótki czas, aż wypełnią liczbę ich współsług i ich braci, którzy mają być zabici, jak i oni."
"Ob6,12": "I zobaczyłem, gdy otworzył szóstą pieczęć, a oto nastało wielkie trzęsienie ziemi, i słońce stało się czarne jak wór włosienny, i księżyc stał się jak krew,"
"Ob6,13": "I gwiazdy nieba spadły na ziemię, jak potrząsany przez gwałtowny wiatr figowiec zrzuca z siebie swoje niedojrzałe figi."
"Ob6,14": "I niebo zostało rozdzielone jak zwój, który jest rolowany, i każda góra i wyspa ze swoich miejsc została poruszona"
"Ob6,15": "I królowie ziemi, i dostojnicy, i bogaci, i dowódcy wojskowi, i mocarze, i każdy niewolnik, i każdy wolny ukryli się w jaskiniach i w skałach gór,"
"Ob6,16": "I mówią do gór i skał: Padnijcie na nas i ukryjcie nas przed obliczem Tego, który siedzi na tronie, i przed gniewem Baranka;"
"Ob6,17": "Nadszedł bowiem wielki dzień Jego gniewu, a kto może się ostać?"
