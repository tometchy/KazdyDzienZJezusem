"Ob18,1":
  text: "A po tych wydarzeniach widziałem anioła zstępującego z nieba, mającego wielką władzę; a od jego chwały ziemia została rozświetlona."
  tags: []
"Ob18,2":
  text: "I zawołał w mocy swojego potężnego głosu, mówiąc: Upadł, upadł Wielki Babilon i stał się mieszkaniem demonów i więzieniem wszelkiego nieczystego ducha, i więzieniem wszelkiego nieczystego i wstrętnego ptactwa,"
  tags: []
"Ob18,3":
  text: "Gdyż z wina zapalczywości jego nierządu piły wszystkie narody, a królowie ziemi oddali się z nim nierządowi, i kupcy ziemscy wzbogacili się na mocy jego przepychu."
  tags: []
"Ob18,4":
  text: "I słyszałem inny głos, mówiący z nieba: Wyjdźcie z niego, mój ludu, abyście nie byli współuczestnikami jego grzechów, i abyście nie otrzymali z jego plag."
  tags: []
"Ob18,5":
  text: "Albowiem jego grzechy sięgnęły aż do nieba, i wspomniał Bóg na jego niesprawiedliwe czyny."
  tags: []
"Ob18,6":
  text: "Oddajcie mu, jak i on wam oddał, dwa razy tyle, oddajcie mu podwójnie według jego czynów; w kielichu, w którym nalał, nalejcie mu podwójnie."
  tags: []
"Ob18,7":
  text: "Ile oddał sobie chwały i żył w przepychu, tak wiele dajcie mu męczarni i smutku; bo mówi w swoim sercu: Siedzę jak królowa, i nie jestem wdową, a smutku z pewnością nie zobaczę."
  tags: []
"Ob18,8":
  text: "Dlatego w jednym dniu nadejdą jego plagi, śmierć i smutek, i głód, i zostanie spalony w ogniu; bo mocny jest PAN Bóg, który go osądza."
  tags: []
"Ob18,9":
  text: "I zapłaczą nad nim, i uderzą się w pierś nad nim, gdy ujrzą dym jego pożaru, królowie ziemi, którzy z nim oddawali się nierządowi i żyli w przepychu,"
  tags: []
"Ob18,10":
  text: "Stojąc z daleka z powodu strachu przed jego męką i mówiąc: Biada, biada, Babilonie, miasto wielkie, miasto mocne, gdyż w jednej godzinie nadszedł twój sąd!"
  tags: []
"Ob18,11":
  text: "A kupcy ziemscy płaczą i smucą się nad nim, bo towaru ich nikt już nie kupuje,"
  tags: []
"Ob18,12":
  text: "Towaru ze złota i srebra, i drogiego kamienia, i pereł, i cienkiego lnu, i purpury, i jedwabiu, i szkarłatu, i z wszelkiego drzewa tujowego, i wszelkiego naczynia z kości słoniowej, i z wszelkiego najdroższego drzewa, i miedzi, i żelaza, i marmuru,"
  tags: []
"Ob18,13":
  text: "I cynamonu, i wonności, i mirry, i kadzidła, i wina, i oliwy, i czystej mąki pszennej, i pszenicy, i bydła, i owiec, i koni, i wozów, i ciał, i dusz ludzi."
  tags: []
"Ob18,14":
  text: "A dojrzały owoc pożądliwości twojej duszy odszedł od ciebie i odeszły od ciebie wszystkie rzeczy wystawne i wspaniałe, których już więcej nie znajdziesz."
  tags: []
"Ob18,15":
  text: "Kupcy tych towarów, ci którzy wzbogacili się na nim, staną z daleka z powodu strachu przed jego męką, płacząc i smucąc się,"
  tags: []
"Ob18,16":
  text: "I mówiąc: Biada, biada, ci miasto wielkie, które jesteś okryte w cienki len i purpurę, i szkarłat, i przyozdobione w złocie i drogimi kamieniami, i perłami, gdyż w jednej godzinie po tak wielkim bogactwie została pustka."
  tags: []
"Ob18,17":
  text: "I każdy sternik, i każdy zespół na okrętach, i żeglarze, i ci, co na morzu pracują, stanęli z daleka,"
  tags: []
"Ob18,18":
  text: "I zawołali, widząc dym jego pożaru, mówiąc: Które miasto jest podobne do tego wielkiego miasta!"
  tags: []
"Ob18,19":
  text: "I rzucali proch na swoje głowy, i wołali, płacząc i smucąc się, mówiąc: Biada, biada, ci miasto wielkie, w którym wzbogacili się wszyscy z jego dostatku, mający okręty na morzu, gdyż w jednej godzinie zostało spustoszone."
  tags: []
"Ob18,20":
  text: "Rozraduj się nad nim, niebo i święci apostołowie, i prorocy, ponieważ Bóg zasądził wasz wyrok nad nim."
  tags: []
"Ob18,21":
  text: "I jeden mocarny anioł podniósł jakby wielki młyński kamień i rzucił go w morze, mówiąc: Z takim rozmachem zostanie wrzucony Babilon, miasto wielkie, i już nigdy nie zostanie znaleziony."
  tags: []
"Ob18,22":
  text: "I głos cytrzystów i śpiewaków, i flecistów, i trębaczy nie będzie już w tobie słyszany, i żaden rzemieślnik jakiegokolwiek rzemiosła więcej nie znajdzie się w tobie, i odgłos tarcia kamienia młyńskiego już w tobie nigdy nie będzie słyszany,"
  tags: []
"Ob18,23":
  text: "I światło lampy nie będzie już w tobie widoczne, i głos oblubieńca i oblubienicy nie zostanie już w tobie usłyszany; gdyż kupcy twoi byli możnowładcami ziemi, gdyż twoimi czarami zwiedzione zostały wszystkie narody."
  tags: []
"Ob18,24":
  text: "I w nim została znaleziona krew proroków, świętych i wszystkich pomordowanych na ziemi."
  tags: []
