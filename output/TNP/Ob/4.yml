"Ob4,1":
  text: "Po tych wydarzeniach zobaczyłem, a oto drzwi otwarte są w niebie, i głos pierwszy, który słyszałem jakby trąby rozmawiający ze mną, mówiący: Wstąp tutaj, a pokażę ci, co musi się stać po tych wydarzeniach."
  tags: []
"Ob4,2":
  text: "I natychmiast znalazłem się w Duchu, i oto ujrzałem tron umieszczony w niebie, a na tronie ktoś siedzący."
  tags: []
"Ob4,3":
  text: "A Ten, który siedzi, podobny był z wyglądu do kamienia jaspisu i sardynu; a wokoło tronu była tęcza podobna z wyglądu do szmaragdu."
  tags: []
"Ob4,4":
  text: "A wokół tronu dwadzieścia i cztery trony; a na tronach widziałem siedzących dwudziestu i czterech starszych, odzianych w białe szaty, a mieli na swoich głowach złote wieńce."
  tags: []
"Ob4,5":
  text: "A z tronu wychodzą błyskawice, gromy, głosy i siedem lamp ognistych płonących przed tronem, to jest siedem duchów Boga."
  tags: []
"Ob4,6":
  text: "A przed tronem szkliste morze, podobne do kryształu, a pośrodku tronu i wokoło tronu cztery stworzenia, pełne oczu z przodu i z tyłu."
  tags: []
"Ob4,7":
  text: "I pierwsze stworzenie było podobne do lwa, a drugie stworzenie podobne do cielęcia, a trzecie stworzenie miało twarz jak człowiek, a czwarte stworzenie było podobne do lecącego orła."
  tags: []
"Ob4,8":
  text: "I każde z czterech stworzeń miało dookoła po sześć skrzydeł, i wewnątrz są pełne oczu; i nie mają odpoczynku ani we dnie ani w nocy, mówiąc: Święty, Święty, Święty jest PAN, Bóg Wszechmogący, który był i jest, i który przychodzi."
  tags: []
"Ob4,9":
  text: "A kiedy cztery stworzenia oddadzą chwałę i cześć, i dziękczynienie Temu, który siedzi na tronie, i żyjącemu na wieki wieków,"
  tags: []
"Ob4,10":
  text: "Dwudziestu i czterech starszych upada przed obliczem Tego, który siedzi na tronie, i oddają pokłon żyjącemu na wieki wieków, i rzucają swoje wieńce przed tronem, mówiąc:"
  tags: []
"Ob4,11":
  text: "Godny jesteś, PANIE, przyjąć chwałę i cześć, i moc; gdyż Ty stworzyłeś wszystkie rzeczy i z Twojej woli trwają i zostały stworzone."
  tags: []
