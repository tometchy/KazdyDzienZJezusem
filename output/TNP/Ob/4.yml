"Ob4,1": "Po tych wydarzeniach zobaczyłem, a oto drzwi otwarte są w niebie, i głos pierwszy, który słyszałem jakby trąby rozmawiający ze mną, mówiący: Wstąp tutaj, a pokażę ci, co musi się stać po tych wydarzeniach."
"Ob4,2": "I natychmiast znalazłem się w Duchu, i oto ujrzałem tron umieszczony w niebie, a na tronie ktoś siedzący."
"Ob4,3": "A Ten, który siedzi, podobny był z wyglądu do kamienia jaspisu i sardynu; a wokoło tronu była tęcza podobna z wyglądu do szmaragdu."
"Ob4,4": "A wokół tronu dwadzieścia i cztery trony; a na tronach widziałem siedzących dwudziestu i czterech starszych, odzianych w białe szaty, a mieli na swoich głowach złote wieńce."
"Ob4,5": "A z tronu wychodzą błyskawice, gromy, głosy i siedem lamp ognistych płonących przed tronem, to jest siedem duchów Boga."
"Ob4,6": "A przed tronem szkliste morze, podobne do kryształu, a pośrodku tronu i wokoło tronu cztery stworzenia, pełne oczu z przodu i z tyłu."
"Ob4,7": "I pierwsze stworzenie było podobne do lwa, a drugie stworzenie podobne do cielęcia, a trzecie stworzenie miało twarz jak człowiek, a czwarte stworzenie było podobne do lecącego orła."
"Ob4,8": "I każde z czterech stworzeń miało dookoła po sześć skrzydeł, i wewnątrz są pełne oczu; i nie mają odpoczynku ani we dnie ani w nocy, mówiąc: Święty, Święty, Święty jest PAN, Bóg Wszechmogący, który był i jest, i który przychodzi."
"Ob4,9": "A kiedy cztery stworzenia oddadzą chwałę i cześć, i dziękczynienie Temu, który siedzi na tronie, i żyjącemu na wieki wieków,"
"Ob4,10": "Dwudziestu i czterech starszych upada przed obliczem Tego, który siedzi na tronie, i oddają pokłon żyjącemu na wieki wieków, i rzucają swoje wieńce przed tronem, mówiąc:"
"Ob4,11": "Godny jesteś, PANIE, przyjąć chwałę i cześć, i moc; gdyż Ty stworzyłeś wszystkie rzeczy i z Twojej woli trwają i zostały stworzone."
