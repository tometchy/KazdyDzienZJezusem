"Ob16,1": "I słyszałem potężny głos ze świątyni, mówiący do siedmiu aniołów: Idźcie i wylejcie czasze gniewu Bożego na ziemię."
"Ob16,2": "I wyszedł pierwszy, i wylał swoją czaszę na ziemię; i pojawił się złośliwy i ropiejący wrzód na ludziach, którzy mieli znamię dzikiego zwierzęcia, i którzy oddawali pokłon jego obrazowi."
"Ob16,3": "I drugi anioł wylał swoją czaszę na morze; i stało się ono jakby krwią martwego, i wszelka istota żywa w morzu umarła."
"Ob16,4": "I trzeci anioł wylał swoją czaszę na rzeki i na źródła wód; i pojawiła się krew."
"Ob16,5": "I słyszałem anioła wód, mówiącego: Sprawiedliwy jesteś PANIE, Ty który jesteś i byłeś i będziesz święty, bo tak osądziłeś."
"Ob16,6": "Ponieważ wylali krew świętych i proroków, dałeś im też pić krew; bo są tego warci."
"Ob16,7": "I słyszałem inny głos z ołtarza, mówiący: Tak, PANIE, Boże Wszechmogący! Prawdziwe i sprawiedliwe są Twoje sądy."
"Ob16,8": "I czwarty anioł wylał swoją czaszę na słońce; i zostało mu dane spiec ludzi ogniem."
"Ob16,9": "I byli popaleni ludzie wielkim żarem, i bluźnili imieniu Boga, który ma władzę nad tymi plagami; a nie upamiętali się, aby oddać Mu chwałę."
"Ob16,10": "I piąty anioł wylał swoją czaszę na tron dzikiego zwierzęcia; i w jego królestwie stała się ciemność, i gryźli swoje języki z bólu,"
"Ob16,11": "I bluźnili Bogu nieba za swój ból i za swoje wrzody; i nie upamiętali się ze swoich czynów."
"Ob16,12": "I szósty anioł wylał swoją czaszę na wielką rzekę Eufrat; i wyschła jej woda, aby została przygotowana droga dla królów ze wschodu słońca."
"Ob16,13": "I widziałem z ust smoka i z ust dzikiego zwierzęcia, i z ust fałszywego proroka wychodzące trzy nieczyste duchy, podobne do żab."
"Ob16,14": "To bowiem są czyniące cudowne znaki duchy demonów, które wychodzą do królów ziemi i do całego zamieszkałego świata, aby ich zgromadzić na wojnę w ów wielki dzień Boga Wszechmogącego."
"Ob16,15": "Oto przychodzę jak złodziej; błogosławiony, który czuwa i strzeże swoich szat, aby nie chodził nago i nie widziano jego hańby."
"Ob16,16": "I zgromadził ich w miejscu, zwanym po hebrajsku Armageddon."
"Ob16,17": "I siódmy anioł wylał swoją czaszę w powietrze; i wyszedł potężny głos ze świątyni nieba od tronu, mówiący: Stało się."
"Ob16,18": "I nastały głosy i gromy, i błyskawice, i nastało wielkie trzęsienie ziemi, jakiego nigdy nie było, odkąd ludzie pojawili się na ziemi, tak ogromne trzęsienie ziemi, tak wielkie."
"Ob16,19": "I stało się, że miasto wielkie rozpadło się na trzy części, i upadły miasta pogan; i został wspomniany przed Bogiem Wielki Babilon, aby dać mu kielich wina zapalczywości Jego gniewu."
"Ob16,20": "I każda wyspa uciekła i góry nie zostały znalezione."
"Ob16,21": "I wielki grad, o wadze jakby talentu, spadł z nieba na ludzi; i bluźnili ludzie Bogu z powodu plagi gradu, gdyż plaga jego była bardzo wielka."
