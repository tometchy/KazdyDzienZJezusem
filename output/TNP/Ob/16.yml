"Ob16,1":
  text: "I słyszałem potężny głos ze świątyni, mówiący do siedmiu aniołów: Idźcie i wylejcie czasze gniewu Bożego na ziemię."
  tags: []
"Ob16,2":
  text: "I wyszedł pierwszy, i wylał swoją czaszę na ziemię; i pojawił się złośliwy i ropiejący wrzód na ludziach, którzy mieli znamię dzikiego zwierzęcia, i którzy oddawali pokłon jego obrazowi."
  tags: []
"Ob16,3":
  text: "I drugi anioł wylał swoją czaszę na morze; i stało się ono jakby krwią martwego, i wszelka istota żywa w morzu umarła."
  tags: []
"Ob16,4":
  text: "I trzeci anioł wylał swoją czaszę na rzeki i na źródła wód; i pojawiła się krew."
  tags: []
"Ob16,5":
  text: "I słyszałem anioła wód, mówiącego: Sprawiedliwy jesteś PANIE, Ty który jesteś i byłeś i będziesz święty, bo tak osądziłeś."
  tags: []
"Ob16,6":
  text: "Ponieważ wylali krew świętych i proroków, dałeś im też pić krew; bo są tego warci."
  tags: []
"Ob16,7":
  text: "I słyszałem inny głos z ołtarza, mówiący: Tak, PANIE, Boże Wszechmogący! Prawdziwe i sprawiedliwe są Twoje sądy."
  tags: []
"Ob16,8":
  text: "I czwarty anioł wylał swoją czaszę na słońce; i zostało mu dane spiec ludzi ogniem."
  tags: []
"Ob16,9":
  text: "I byli popaleni ludzie wielkim żarem, i bluźnili imieniu Boga, który ma władzę nad tymi plagami; a nie upamiętali się, aby oddać Mu chwałę."
  tags: []
"Ob16,10":
  text: "I piąty anioł wylał swoją czaszę na tron dzikiego zwierzęcia; i w jego królestwie stała się ciemność, i gryźli swoje języki z bólu,"
  tags: []
"Ob16,11":
  text: "I bluźnili Bogu nieba za swój ból i za swoje wrzody; i nie upamiętali się ze swoich czynów."
  tags: []
"Ob16,12":
  text: "I szósty anioł wylał swoją czaszę na wielką rzekę Eufrat; i wyschła jej woda, aby została przygotowana droga dla królów ze wschodu słońca."
  tags: []
"Ob16,13":
  text: "I widziałem z ust smoka i z ust dzikiego zwierzęcia, i z ust fałszywego proroka wychodzące trzy nieczyste duchy, podobne do żab."
  tags: []
"Ob16,14":
  text: "To bowiem są czyniące cudowne znaki duchy demonów, które wychodzą do królów ziemi i do całego zamieszkałego świata, aby ich zgromadzić na wojnę w ów wielki dzień Boga Wszechmogącego."
  tags: []
"Ob16,15":
  text: "Oto przychodzę jak złodziej; błogosławiony, który czuwa i strzeże swoich szat, aby nie chodził nago i nie widziano jego hańby."
  tags: []
"Ob16,16":
  text: "I zgromadził ich w miejscu, zwanym po hebrajsku Armageddon."
  tags: []
"Ob16,17":
  text: "I siódmy anioł wylał swoją czaszę w powietrze; i wyszedł potężny głos ze świątyni nieba od tronu, mówiący: Stało się."
  tags: []
"Ob16,18":
  text: "I nastały głosy i gromy, i błyskawice, i nastało wielkie trzęsienie ziemi, jakiego nigdy nie było, odkąd ludzie pojawili się na ziemi, tak ogromne trzęsienie ziemi, tak wielkie."
  tags: []
"Ob16,19":
  text: "I stało się, że miasto wielkie rozpadło się na trzy części, i upadły miasta pogan; i został wspomniany przed Bogiem Wielki Babilon, aby dać mu kielich wina zapalczywości Jego gniewu."
  tags: []
"Ob16,20":
  text: "I każda wyspa uciekła i góry nie zostały znalezione."
  tags: []
"Ob16,21":
  text: "I wielki grad, o wadze jakby talentu, spadł z nieba na ludzi; i bluźnili ludzie Bogu z powodu plagi gradu, gdyż plaga jego była bardzo wielka."
  tags: []
