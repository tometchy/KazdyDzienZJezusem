"Ob13,1": "I zostałem postawiony na piasku z morza, i zobaczyłem dzikie zwierzę występujące z morza, mające siedem głów i dziesięć rogów; a na jego rogach było dziesięć diademów, a na jego głowach bluźniercze imię."
"Ob13,2": "A dzikie zwierzę, które widziałem, było podobne do pantery, a stopy jego jak niedźwiedzia, a paszcza jego jak paszcza lwa; i dał mu smok swoją moc i swój tron, i wielką władzę."
"Ob13,3": "I widziałem jedną z jego głów jakby zabitą na śmierć; ale jego śmiertelna rana została uleczona. I zdziwiła się cała ziemia idąc za dzikim zwierzęciem."
"Ob13,4": "I pokłonili się smokowi, który dał władzę dzikiemu zwierzęciu, i pokłonili się dzikiemu zwierzęciu, mówiąc: Kto jest podobny do dzikiego zwierzęcia? Kto może z nim walczyć?"
"Ob13,5": "I dano mu usta mówiące wyniosłe i bluźniercze słowa; i dano mu władzę działania przez czterdzieści dwa miesiące."
"Ob13,6": "I otworzyło swoje usta, by bluźnić przeciwko Bogu, aby bluźnić Jego imieniu i Jego przybytkowi, i tym, którzy mieszkają w niebie."
"Ob13,7": "Dano mu też podjąć walkę ze świętymi i ich zwyciężać. I dano mu władzę nad każdym plemieniem i językiem, i narodem."
"Ob13,8": "I oddadzą mu pokłon wszyscy mieszkańcy ziemi, których imiona nie są napisane w zwoju życia Baranka zabitego od założenia świata."
"Ob13,9": "Jeśli ktoś ma ucho, niech usłyszy!"
"Ob13,10": "Jeśli ktoś bierze do niewoli, idzie do niewoli; jeśli ktoś zabija mieczem, musi i on zostać zabity mieczem. Tu zaznacza się wytrwałość i wiara świętych."
"Ob13,11": "I widziałem inne dzikie zwierzę wychodzące z ziemi, i miało dwa rogi podobne do rogów Baranka, a mówiło jak smok."
"Ob13,12": "I sprawuje przed nim całą władzę pierwszego dzikiego zwierzęcia, i czyni, że ziemia i jej mieszkańcy oddadzą pokłon pierwszemu dzikiemu zwierzęciu, którego śmiertelna rana została uleczona;"
"Ob13,13": "I czyni wielkie znaki, tak że i ogień sprowadza na ziemię z nieba przed ludźmi;"
"Ob13,14": "I zwodzi mieszkańców ziemi przez znaki, które mu dano czynić przed obliczem dzikiego zwierzęcia, mówiąc mieszkańcom ziemi, aby uczynili obraz dzikiego zwierzęcia, które ma ranę od miecza, a ożyło."
"Ob13,15": "I pozwolono mu dać ducha owemu obrazowi dzikiego zwierzęcia, aby obraz zwierzęcia przemówił, i uczynił on, by ktokolwiek, kto nie pokłoni się obrazowi zwierzęcia, został zabity."
"Ob13,16": "I sprawia, że wszyscy, mali i wielcy, bogaci i ubodzy, wolni i niewolnicy, dostali znamię na swoją prawą rękę lub na swe czoła,"
"Ob13,17": "I aby nie mógł kupować lub sprzedawać, ktoś nie mający znamienia lub imienia dzikiego zwierzęcia, lub liczby jego imienia."
"Ob13,18": "Tu jest potrzebna mądrość. Kto ma rozum, niech obliczy liczbę dzikiego zwierzęcia; bo jest to liczba człowieka. A liczba jego jest sześćset sześćdziesiąt sześć."
