"Ob13,1":
  text: "I zostałem postawiony na piasku z morza, i zobaczyłem dzikie zwierzę występujące z morza, mające siedem głów i dziesięć rogów; a na jego rogach było dziesięć diademów, a na jego głowach bluźniercze imię."
  tags: []
"Ob13,2":
  text: "A dzikie zwierzę, które widziałem, było podobne do pantery, a stopy jego jak niedźwiedzia, a paszcza jego jak paszcza lwa; i dał mu smok swoją moc i swój tron, i wielką władzę."
  tags: []
"Ob13,3":
  text: "I widziałem jedną z jego głów jakby zabitą na śmierć; ale jego śmiertelna rana została uleczona. I zdziwiła się cała ziemia idąc za dzikim zwierzęciem."
  tags: []
"Ob13,4":
  text: "I pokłonili się smokowi, który dał władzę dzikiemu zwierzęciu, i pokłonili się dzikiemu zwierzęciu, mówiąc: Kto jest podobny do dzikiego zwierzęcia? Kto może z nim walczyć?"
  tags: []
"Ob13,5":
  text: "I dano mu usta mówiące wyniosłe i bluźniercze słowa; i dano mu władzę działania przez czterdzieści dwa miesiące."
  tags: []
"Ob13,6":
  text: "I otworzyło swoje usta, by bluźnić przeciwko Bogu, aby bluźnić Jego imieniu i Jego przybytkowi, i tym, którzy mieszkają w niebie."
  tags: []
"Ob13,7":
  text: "Dano mu też podjąć walkę ze świętymi i ich zwyciężać. I dano mu władzę nad każdym plemieniem i językiem, i narodem."
  tags: []
"Ob13,8":
  text: "I oddadzą mu pokłon wszyscy mieszkańcy ziemi, których imiona nie są napisane w zwoju życia Baranka zabitego od założenia świata."
  tags: []
"Ob13,9":
  text: "Jeśli ktoś ma ucho, niech usłyszy!"
  tags: []
"Ob13,10":
  text: "Jeśli ktoś bierze do niewoli, idzie do niewoli; jeśli ktoś zabija mieczem, musi i on zostać zabity mieczem. Tu zaznacza się wytrwałość i wiara świętych."
  tags: []
"Ob13,11":
  text: "I widziałem inne dzikie zwierzę wychodzące z ziemi, i miało dwa rogi podobne do rogów Baranka, a mówiło jak smok."
  tags: []
"Ob13,12":
  text: "I sprawuje przed nim całą władzę pierwszego dzikiego zwierzęcia, i czyni, że ziemia i jej mieszkańcy oddadzą pokłon pierwszemu dzikiemu zwierzęciu, którego śmiertelna rana została uleczona;"
  tags: []
"Ob13,13":
  text: "I czyni wielkie znaki, tak że i ogień sprowadza na ziemię z nieba przed ludźmi;"
  tags: []
"Ob13,14":
  text: "I zwodzi mieszkańców ziemi przez znaki, które mu dano czynić przed obliczem dzikiego zwierzęcia, mówiąc mieszkańcom ziemi, aby uczynili obraz dzikiego zwierzęcia, które ma ranę od miecza, a ożyło."
  tags: []
"Ob13,15":
  text: "I pozwolono mu dać ducha owemu obrazowi dzikiego zwierzęcia, aby obraz zwierzęcia przemówił, i uczynił on, by ktokolwiek, kto nie pokłoni się obrazowi zwierzęcia, został zabity."
  tags: []
"Ob13,16":
  text: "I sprawia, że wszyscy, mali i wielcy, bogaci i ubodzy, wolni i niewolnicy, dostali znamię na swoją prawą rękę lub na swe czoła,"
  tags: []
"Ob13,17":
  text: "I aby nie mógł kupować lub sprzedawać, ktoś nie mający znamienia lub imienia dzikiego zwierzęcia, lub liczby jego imienia."
  tags: []
"Ob13,18":
  text: "Tu jest potrzebna mądrość. Kto ma rozum, niech obliczy liczbę dzikiego zwierzęcia; bo jest to liczba człowieka. A liczba jego jest sześćset sześćdziesiąt sześć."
  tags: []
