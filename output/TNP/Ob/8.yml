"Ob8,1":
  text: "A gdy zdjął siódmą pieczęć, nastała cisza w niebie na jakieś pół godziny."
  tags: []
"Ob8,2":
  text: "I zobaczyłem siedmiu aniołów, którzy stali przed Bogiem, i dano im siedem trąb."
  tags: []
"Ob8,3":
  text: "A inny anioł przyszedł i został postawiony przy ołtarzu, mając złotą kadzielnicę; i dano mu wiele kadzidła, aby ofiarował je z modlitwami wszystkich świętych na złotym ołtarzu, który jest przed tronem."
  tags: []
"Ob8,4":
  text: "I wzniósł się dym kadzideł z modlitwami świętych z ręki anioła przed Bogiem."
  tags: []
"Ob8,5":
  text: "I wziął anioł kadzielnicę, i napełnił ją ogniem z ołtarza, i zrzucił na ziemię, i zabrzmiały głosy i grzmoty, i błyskawice, i trzęsienie ziemi."
  tags: []
"Ob8,6":
  text: "A siedmiu aniołów, którzy mieli siedem trąb, przygotowało siebie, aby zatrąbić."
  tags: []
"Ob8,7":
  text: "I zatrąbił pierwszy anioł, i powstał grad i ogień zmieszane z krwią, i zostały zrzucone na ziemię, a trzecia część drzew została spalona, i cała zielona trawa została spalona."
  tags: []
"Ob8,8":
  text: "I zatrąbił drugi anioł, i jakby wielka góra płonąca ogniem została zrzucona w morze, i trzecia część morza stała się krwią."
  tags: []
"Ob8,9":
  text: "I zginęła w morzu trzecia część stworzeń mających dusze, i trzecia część okrętów uległa zniszczeniu."
  tags: []
"Ob8,10":
  text: "I zatrąbił trzeci anioł, i spadła z nieba wielka gwiazda, płonąca jak pochodnia, i spadła na trzecią część rzek i na źródła wód."
  tags: []
"Ob8,11":
  text: "A imię tej gwiazdy brzmi Piołun; i zamienia się trzecia część wód w piołun, i wielu ludzi pomarło od tych wód, bo stały się gorzkie."
  tags: []
"Ob8,12":
  text: "I zatrąbił czwarty anioł, i została uderzona trzecia część słońca i trzecia część księżyca, i trzecia część gwiazd, aby trzecia część ich została pogrążona w ciemności, i trzecia część dnia nie jaśniała, podobnie i noc."
  tags: []
"Ob8,13":
  text: "I zobaczyłem, i słyszałem jednego anioła, lecącego środkiem nieba, mówiącego potężnym głosem: Biada, biada, biada mieszkającym na ziemi, z powodu głosów trąb pozostałych trzech aniołów, którzy mają zatrąbić."
  tags: []
