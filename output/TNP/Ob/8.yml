"Ob8,1": "A gdy zdjął siódmą pieczęć, nastała cisza w niebie na jakieś pół godziny."
"Ob8,2": "I zobaczyłem siedmiu aniołów, którzy stali przed Bogiem, i dano im siedem trąb."
"Ob8,3": "A inny anioł przyszedł i został postawiony przy ołtarzu, mając złotą kadzielnicę; i dano mu wiele kadzidła, aby ofiarował je z modlitwami wszystkich świętych na złotym ołtarzu, który jest przed tronem."
"Ob8,4": "I wzniósł się dym kadzideł z modlitwami świętych z ręki anioła przed Bogiem."
"Ob8,5": "I wziął anioł kadzielnicę, i napełnił ją ogniem z ołtarza, i zrzucił na ziemię, i zabrzmiały głosy i grzmoty, i błyskawice, i trzęsienie ziemi."
"Ob8,6": "A siedmiu aniołów, którzy mieli siedem trąb, przygotowało siebie, aby zatrąbić."
"Ob8,7": "I zatrąbił pierwszy anioł, i powstał grad i ogień zmieszane z krwią, i zostały zrzucone na ziemię, a trzecia część drzew została spalona, i cała zielona trawa została spalona."
"Ob8,8": "I zatrąbił drugi anioł, i jakby wielka góra płonąca ogniem została zrzucona w morze, i trzecia część morza stała się krwią."
"Ob8,9": "I zginęła w morzu trzecia część stworzeń mających dusze, i trzecia część okrętów uległa zniszczeniu."
"Ob8,10": "I zatrąbił trzeci anioł, i spadła z nieba wielka gwiazda, płonąca jak pochodnia, i spadła na trzecią część rzek i na źródła wód."
"Ob8,11": "A imię tej gwiazdy brzmi Piołun; i zamienia się trzecia część wód w piołun, i wielu ludzi pomarło od tych wód, bo stały się gorzkie."
"Ob8,12": "I zatrąbił czwarty anioł, i została uderzona trzecia część słońca i trzecia część księżyca, i trzecia część gwiazd, aby trzecia część ich została pogrążona w ciemności, i trzecia część dnia nie jaśniała, podobnie i noc."
"Ob8,13": "I zobaczyłem, i słyszałem jednego anioła, lecącego środkiem nieba, mówiącego potężnym głosem: Biada, biada, biada mieszkającym na ziemi, z powodu głosów trąb pozostałych trzech aniołów, którzy mają zatrąbić."
