"Ob12,1": "I został ukazany na niebie wielki znak: kobieta odziana w słońce, a księżyc pod jej stopami, i na jej głowie wieniec z dwunastu gwiazd;"
"Ob12,2": "A jest w ciąży, krzyczy wśród bólów porodowych i mąk rodzenia."
"Ob12,3": "I został ukazany inny znak na niebie: a oto wielki ognisty smok, mający siedem głów i dziesięć rogów, a na głowach jego siedem diademów;"
"Ob12,4": "A jego ogon ciągnie trzecią część gwiazd nieba i zrzucił je na ziemię; i smok stał przed kobietą, która ma urodzić, aby, kiedy urodzi, pożreć jej dziecko."
"Ob12,5": "I urodziła syna, mężczyznę, który ma paść wszystkie narody laską żelazną; a jej dziecko zostało porwane do Boga i do Jego tronu,"
"Ob12,6": "A kobieta uciekła na pustynię, gdzie ma miejsce przygotowane przez Boga, aby tam ją żywiono przez tysiąc dwieście sześćdziesiąt dni."
"Ob12,7": "I nastąpiła wojna w niebie. Michał i jego aniołowie walczyli przeciwko smokowi, i walczył smok i jego aniołowie."
"Ob12,8": "Ale nie przemogli, i nie znalazło się już miejsce dla nich w niebie."
"Ob12,9": "I został zrzucony smok wielki, wąż starodawny, który jest nazywany diabłem i szatanem, który zwodzi cały zamieszkały świat, został zrzucony na ziemię, i zostali z nim zrzuceni jego aniołowie."
"Ob12,10": "I usłyszałem potężny głos, mówiący w niebie: Teraz nastało zbawienie i moc, i Królestwo Boga naszego, i władza Jego Mesjasza, ponieważ zrzucony został oskarżyciel naszych braci, który ich oskarżał przed Bogiem naszym dniem i nocą."
"Ob12,11": "A oni zwyciężyli go przez krew Baranka i przez słowo swojego świadectwa, i nie umiłowali swojej duszy aż do śmierci."
"Ob12,12": "Dlatego weselcie się niebiosa i wy, w nich zamieszkujący! Biada zamieszkującym ziemię i morza, bo zstąpił do was diabeł z wielkim gniewem, wiedząc, że ma mało czasu."
"Ob12,13": "A gdy widział smok, że został zrzucony na ziemię, prześladował kobietę, która urodziła mężczyznę."
"Ob12,14": "I dano kobiecie dwa skrzydła wielkiego orła, aby odleciała na swoje miejsce z dala od oblicza węża na pustynię, tam, gdzie jest żywiona przez czas i czasy, i połowę czasu."
"Ob12,15": "I wypuścił wąż ze swoich ust za kobietą wodę jak rzekę, aby spowodować, by uniósł ją nurt rzeki."
"Ob12,16": "A ziemia pomogła kobiecie; i otworzyła ziemia swoje usta, i pochłonęła rzekę, którą wypuścił smok ze swoich ust."
"Ob12,17": "I rozgniewał się smok na kobietę, i odszedł walczyć z pozostałymi z jej potomstwa, którzy zachowują przykazania Boga i mają świadectwo Jezusa Chrystusa."
