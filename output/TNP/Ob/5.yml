"Ob5,1": "I zobaczyłem w prawej ręce siedzącego na tronie zwój zapisany wewnątrz i zewnątrz, zapieczętowany siedmioma pieczęciami."
"Ob5,2": "I zobaczyłem mocarnego anioła, obwieszczającego potężnym głosem: Kto jest godny otworzyć zwój i złamać jego pieczęcie?"
"Ob5,3": "I nikt nie mógł, ani w niebie, ani na ziemi, ani pod ziemią otworzyć zwoju, ani zaglądać do niego."
"Ob5,4": "I bardzo płakałem, że nie został znaleziony nikt godny, by otworzyć i przeczytać zwój, ani zaglądać do niego."
"Ob5,5": "I jeden ze starszych mówi do mnie: Nie płacz; oto zwyciężył lew, który jest z pokolenia Judy, korzeń Dawida, by otworzyć i złamać siedem jego pieczęci."
"Ob5,6": "I zobaczyłem, a oto pośrodku tronu i czterech stworzeń, i pośrodku starszych stoi Baranek, jakby zabity, mający siedem rogów i siedem oczu, które są siedmioma duchami Boga, posłanymi na całą ziemię."
"Ob5,7": "I przyszedł, i wziął zwój z prawej ręki siedzącego na tronie."
"Ob5,8": "I gdy wziął zwój, czworo stworzeń i dwudziestu czterech starszych upadło przed Barankiem, a każdy z nich ma cytrę i złotą czaszę pełną kadzidła, którymi są modlitwy świętych."
"Ob5,9": "I śpiewają nową pieśń, mówiąc: Godny jesteś wziąć zwój i otworzyć jego pieczęć; bo byłeś zabity, i odkupiłeś nas Bogu swoją krwią z każdego pokolenia, języka, ludu i narodu,"
"Ob5,10": "I uczyniłeś nas królami i kapłanami Bogu naszemu, i królować będziemy nad ziemią."
"Ob5,11": "I zobaczyłem, i usłyszałem głos wielu aniołów wokoło tronu i stworzeń, i starszych; a ich liczba była miriady miriad i tysiące tysięcy,"
"Ob5,12": "Mówiących potężnym głosem: Godny jest ten Baranek, który został zabity, wziąć moc i bogactwo, i mądrość, i siłę, i cześć, i chwałę, i błogosławieństwo."
"Ob5,13": "A wszelkie stworzenie, które jest w niebie i na ziemi, i pod ziemią, i na morzu, i wszystko, co w nich jest, słyszałem jak mówi: Siedzącemu na tronie i Barankowi błogosławieństwo, cześć, chwała i moc na wieki wieków."
"Ob5,14": "I cztery stworzenia mówiły: Amen. I dwudziestu czterech starszych upadło i oddało pokłon żyjącemu na wieki wieków."
