"Ob5,1":
  text: "I zobaczyłem w prawej ręce siedzącego na tronie zwój zapisany wewnątrz i zewnątrz, zapieczętowany siedmioma pieczęciami."
  tags: []
"Ob5,2":
  text: "I zobaczyłem mocarnego anioła, obwieszczającego potężnym głosem: Kto jest godny otworzyć zwój i złamać jego pieczęcie?"
  tags: []
"Ob5,3":
  text: "I nikt nie mógł, ani w niebie, ani na ziemi, ani pod ziemią otworzyć zwoju, ani zaglądać do niego."
  tags: []
"Ob5,4":
  text: "I bardzo płakałem, że nie został znaleziony nikt godny, by otworzyć i przeczytać zwój, ani zaglądać do niego."
  tags: []
"Ob5,5":
  text: "I jeden ze starszych mówi do mnie: Nie płacz; oto zwyciężył lew, który jest z pokolenia Judy, korzeń Dawida, by otworzyć i złamać siedem jego pieczęci."
  tags: []
"Ob5,6":
  text: "I zobaczyłem, a oto pośrodku tronu i czterech stworzeń, i pośrodku starszych stoi Baranek, jakby zabity, mający siedem rogów i siedem oczu, które są siedmioma duchami Boga, posłanymi na całą ziemię."
  tags: []
"Ob5,7":
  text: "I przyszedł, i wziął zwój z prawej ręki siedzącego na tronie."
  tags: []
"Ob5,8":
  text: "I gdy wziął zwój, czworo stworzeń i dwudziestu czterech starszych upadło przed Barankiem, a każdy z nich ma cytrę i złotą czaszę pełną kadzidła, którymi są modlitwy świętych."
  tags: []
"Ob5,9":
  text: "I śpiewają nową pieśń, mówiąc: Godny jesteś wziąć zwój i otworzyć jego pieczęć; bo byłeś zabity, i odkupiłeś nas Bogu swoją krwią z każdego pokolenia, języka, ludu i narodu,"
  tags: []
"Ob5,10":
  text: "I uczyniłeś nas królami i kapłanami Bogu naszemu, i królować będziemy nad ziemią."
  tags: []
"Ob5,11":
  text: "I zobaczyłem, i usłyszałem głos wielu aniołów wokoło tronu i stworzeń, i starszych; a ich liczba była miriady miriad i tysiące tysięcy,"
  tags: []
"Ob5,12":
  text: "Mówiących potężnym głosem: Godny jest ten Baranek, który został zabity, wziąć moc i bogactwo, i mądrość, i siłę, i cześć, i chwałę, i błogosławieństwo."
  tags: []
"Ob5,13":
  text: "A wszelkie stworzenie, które jest w niebie i na ziemi, i pod ziemią, i na morzu, i wszystko, co w nich jest, słyszałem jak mówi: Siedzącemu na tronie i Barankowi błogosławieństwo, cześć, chwała i moc na wieki wieków."
  tags: []
"Ob5,14":
  text: "I cztery stworzenia mówiły: Amen. I dwudziestu czterech starszych upadło i oddało pokłon żyjącemu na wieki wieków."
  tags: []
