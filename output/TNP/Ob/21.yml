"Ob21,1":
  text: "I widziałem nowe niebo i nową ziemię; bowiem pierwsze niebo i pierwsza ziemia przeminęły, i nie ma już morza."
  tags: []
"Ob21,2":
  text: "A ja, Jan, widziałem miasto święte, Nowe Jeruzalem, zstępujące z nieba od Boga, które jest przygotowane jako oblubienica przyozdobiona dla swojego męża."
  tags: []
"Ob21,3":
  text: "I słyszałem potężny głos z nieba, mówiący: Oto przybytek Boga z ludźmi, i zamieszka z nimi; a oni będą Jego ludem, i sam Bóg będzie z nimi – ich Bóg."
  tags: []
"Ob21,4":
  text: "I otrze Bóg wszelką łzę z ich oczu; i nie będzie już śmierci, ani bólu, ani krzyku, ani znoju już nie będzie; gdyż pierwsze rzeczy odeszły."
  tags: []
"Ob21,5":
  text: "A siedzący na tronie powiedział: Oto wszystko nowe czynię. I mówi mi: Napisz, bo te słowa są prawdziwe i godne zaufania."
  tags: []
"Ob21,6":
  text: "I powiedział mi: Stało się. Ja jestem Alfa i Omega, początek i koniec. Ja pragnącemu dam darmo ze źródła wody życia."
  tags: []
"Ob21,7":
  text: "Kto zwycięży, odziedziczy wszystko, i będę mu Bogiem, a on będzie mi synem."
  tags: []
"Ob21,8":
  text: "A tchórzliwym i niewierzącym, i czyniącym obrzydliwości, i mordercom, i nierządnikom, i czarownikom, i bałwochwalcom, i wszystkim kłamcom ich dział będzie w jeziorze, które płonie ogniem i siarką; to jest śmierć druga."
  tags: []
"Ob21,9":
  text: "I przyszedł do mnie jeden z siedmiu aniołów, którzy mają siedem czasz napełnionych siedmioma ostatecznymi plagami, a rozmawiając ze mną, powiedział: Chodź, pokażę ci oblubienicę, małżonkę Baranka."
  tags: []
"Ob21,10":
  text: "I przeniósł mnie w duchu na wielką, wysoką górę, i pokazał mi wielkie miasto, święte Jeruzalem, zstępujące z nieba od Boga,"
  tags: []
"Ob21,11":
  text: "Mające chwałę Boga; a światło jego podobne do najdroższego kamienia, jakby kamienia jaspisu, który jest jasny jak kryształ;"
  tags: []
"Ob21,12":
  text: "Ma ono także wielki i wysoki mur, mający dwanaście bram, a na bramach dwunastu aniołów i wyryte imiona dwunastu pokoleń synów Izraela."
  tags: []
"Ob21,13":
  text: "Od wschodu trzy bramy, od północy trzy bramy, od południa trzy bramy, od zachodu trzy bramy."
  tags: []
"Ob21,14":
  text: "A mur miasta ma dwanaście fundamentów, a na nich imiona dwunastu apostołów Baranka."
  tags: []
"Ob21,15":
  text: "A ten, który rozmawiał ze mną, miał złotą trzcinę, aby zmierzyć miasto i jego bramy, i jego mury."
  tags: []
"Ob21,16":
  text: "A miasto położone jest jako czworokąt i długość jego jest tak wielka, jak i szerokość. I zmierzył miasto trzciną na dwanaście tysięcy stadiów; i długość, i szerokość, i wysokość jego jest równa."
  tags: []
"Ob21,17":
  text: "I zmierzył jego mur – sto czterdzieści cztery łokcie według miary człowieka, która jest miarą anioła."
  tags: []
"Ob21,18":
  text: "I budulcem jego muru był jaspis; a samo miasto z czystego złota, podobne do czystego szkła."
  tags: []
"Ob21,19":
  text: "A fundamenty muru miasta ozdobione były wszelkimi drogimi kamieniami. Pierwszy fundament jaspis, drugi szafir, trzeci chalcedon, czwarty szmaragd,"
  tags: []
"Ob21,20":
  text: "Piąty sardoniks, szósty karneol, siódmy chryzolit, ósmy beryl, dziewiąty topaz, dziesiąty chryzopraz, jedenasty hiacynt, dwunasty ametyst."
  tags: []
"Ob21,21":
  text: "A dwanaście bram, to dwanaście pojedynczych pereł, każda brama była z jednej perły; a ulica miasta to czyste złoto, przezroczyste jak szkło."
  tags: []
"Ob21,22":
  text: "I nie widziałem w nim świątyni; albowiem PAN, Bóg Wszechmogący jest jego świątynią, i Baranek."
  tags: []
"Ob21,23":
  text: "A miasto nie potrzebuje słońca ani księżyca, aby w nim świeciły, oświeca je bowiem chwała Boga, a lampą jego jest Baranek."
  tags: []
"Ob21,24":
  text: "I narody, które są zbawiane będą chodzić w jego świetle, a królowie ziemi niosą do niego swoją chwałę i cześć."
  tags: []
"Ob21,25":
  text: "A bramy jego nie będą nigdy zamykane we dnie; nocy tam bowiem nie będzie."
  tags: []
"Ob21,26":
  text: "I zaniosą do niego chwałę i cześć narodów."
  tags: []
"Ob21,27":
  text: "I nie wejdzie do niego nic nieczystego, ani nikt, kto popełnia obrzydliwość i kłamstwo, tylko ci, którzy są zapisani w zwoju życia Baranka."
  tags: []
