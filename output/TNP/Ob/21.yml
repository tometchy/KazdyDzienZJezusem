"Ob21,1": "I widziałem nowe niebo i nową ziemię; bowiem pierwsze niebo i pierwsza ziemia przeminęły, i nie ma już morza."
"Ob21,2": "A ja, Jan, widziałem miasto święte, Nowe Jeruzalem, zstępujące z nieba od Boga, które jest przygotowane jako oblubienica przyozdobiona dla swojego męża."
"Ob21,3": "I słyszałem potężny głos z nieba, mówiący: Oto przybytek Boga z ludźmi, i zamieszka z nimi; a oni będą Jego ludem, i sam Bóg będzie z nimi – ich Bóg."
"Ob21,4": "I otrze Bóg wszelką łzę z ich oczu; i nie będzie już śmierci, ani bólu, ani krzyku, ani znoju już nie będzie; gdyż pierwsze rzeczy odeszły."
"Ob21,5": "A siedzący na tronie powiedział: Oto wszystko nowe czynię. I mówi mi: Napisz, bo te słowa są prawdziwe i godne zaufania."
"Ob21,6": "I powiedział mi: Stało się. Ja jestem Alfa i Omega, początek i koniec. Ja pragnącemu dam darmo ze źródła wody życia."
"Ob21,7": "Kto zwycięży, odziedziczy wszystko, i będę mu Bogiem, a on będzie mi synem."
"Ob21,8": "A tchórzliwym i niewierzącym, i czyniącym obrzydliwości, i mordercom, i nierządnikom, i czarownikom, i bałwochwalcom, i wszystkim kłamcom ich dział będzie w jeziorze, które płonie ogniem i siarką; to jest śmierć druga."
"Ob21,9": "I przyszedł do mnie jeden z siedmiu aniołów, którzy mają siedem czasz napełnionych siedmioma ostatecznymi plagami, a rozmawiając ze mną, powiedział: Chodź, pokażę ci oblubienicę, małżonkę Baranka."
"Ob21,10": "I przeniósł mnie w duchu na wielką, wysoką górę, i pokazał mi wielkie miasto, święte Jeruzalem, zstępujące z nieba od Boga,"
"Ob21,11": "Mające chwałę Boga; a światło jego podobne do najdroższego kamienia, jakby kamienia jaspisu, który jest jasny jak kryształ;"
"Ob21,12": "Ma ono także wielki i wysoki mur, mający dwanaście bram, a na bramach dwunastu aniołów i wyryte imiona dwunastu pokoleń synów Izraela."
"Ob21,13": "Od wschodu trzy bramy, od północy trzy bramy, od południa trzy bramy, od zachodu trzy bramy."
"Ob21,14": "A mur miasta ma dwanaście fundamentów, a na nich imiona dwunastu apostołów Baranka."
"Ob21,15": "A ten, który rozmawiał ze mną, miał złotą trzcinę, aby zmierzyć miasto i jego bramy, i jego mury."
"Ob21,16": "A miasto położone jest jako czworokąt i długość jego jest tak wielka, jak i szerokość. I zmierzył miasto trzciną na dwanaście tysięcy stadiów; i długość, i szerokość, i wysokość jego jest równa."
"Ob21,17": "I zmierzył jego mur – sto czterdzieści cztery łokcie według miary człowieka, która jest miarą anioła."
"Ob21,18": "I budulcem jego muru był jaspis; a samo miasto z czystego złota, podobne do czystego szkła."
"Ob21,19": "A fundamenty muru miasta ozdobione były wszelkimi drogimi kamieniami. Pierwszy fundament jaspis, drugi szafir, trzeci chalcedon, czwarty szmaragd,"
"Ob21,20": "Piąty sardoniks, szósty karneol, siódmy chryzolit, ósmy beryl, dziewiąty topaz, dziesiąty chryzopraz, jedenasty hiacynt, dwunasty ametyst."
"Ob21,21": "A dwanaście bram, to dwanaście pojedynczych pereł, każda brama była z jednej perły; a ulica miasta to czyste złoto, przezroczyste jak szkło."
"Ob21,22": "I nie widziałem w nim świątyni; albowiem PAN, Bóg Wszechmogący jest jego świątynią, i Baranek."
"Ob21,23": "A miasto nie potrzebuje słońca ani księżyca, aby w nim świeciły, oświeca je bowiem chwała Boga, a lampą jego jest Baranek."
"Ob21,24": "I narody, które są zbawiane będą chodzić w jego świetle, a królowie ziemi niosą do niego swoją chwałę i cześć."
"Ob21,25": "A bramy jego nie będą nigdy zamykane we dnie; nocy tam bowiem nie będzie."
"Ob21,26": "I zaniosą do niego chwałę i cześć narodów."
"Ob21,27": "I nie wejdzie do niego nic nieczystego, ani nikt, kto popełnia obrzydliwość i kłamstwo, tylko ci, którzy są zapisani w zwoju życia Baranka."
