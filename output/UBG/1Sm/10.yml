"1Sm10,1":
  text: "Wtedy Samuel wziął flakonik oliwy i wylał ją na jego głowę, pocałował go i powiedział: Czyż PAN nie namaścił cię na wodza nad swoim dziedzictwem?"
  tags: []
"1Sm10,2":
  text: "Gdy dziś odejdziesz ode mnie, spotkasz dwóch mężczyzn przy grobie Racheli, na granicy Beniamina w Celcach, którzy ci powiedzą: Znalazły się oślice, których poszedłeś szukać, a twój ojciec zaniechał troski o oślice i martwi się o was, mówiąc: Cóż mam uczynić dla swego syna?"
  tags: []
"1Sm10,3":
  text: "A gdy odejdziesz stamtąd dalej i przyjdziesz aż na pole Tabor, spotkają cię tam trzej mężczyźni idący do Boga, do Betel. Jeden będzie niósł troje koźląt, drugi będzie niósł trzy bochenki chleba, a trzeci będzie niósł bukłak wina."
  tags: []
"1Sm10,4":
  text: "I pozdrowią cię w pokoju, i dadzą ci dwa chleby, które weźmiesz z ich rąk."
  tags: []
"1Sm10,5":
  text: "Potem przyjdziesz na pagórek Boży, gdzie jest załoga filistyńska. A gdy tam będziesz wchodził do miasta, spotkasz się z gromadą proroków schodzących z wyżyny. Przed nimi będą: cytra, bęben, flet i harfa, a oni będą prorokować."
  tags: []
"1Sm10,6":
  text: "Wtedy zstąpi na ciebie Duch PANA i będziesz prorokował wraz z nimi, i przemienisz się w innego człowieka."
  tags: []
"1Sm10,7":
  text: "A gdy te znaki spełnią się na tobie, czyń wszystko, co zdoła zrobić twoja ręka, gdyż Bóg jest z tobą."
  tags: []
"1Sm10,8":
  text: "Potem pójdziesz przede mną do Gilgal, a ja przyjdę do ciebie, aby złożyć całopalenia i ofiary pojednawcze. Przez siedem dni będziesz czekał, aż przyjdę do ciebie i pokażę to, co masz czynić."
  tags: []
"1Sm10,9":
  text: "I kiedy odwrócił się, aby odejść od Samuela, Bóg przemienił mu serce na inne i w tym dniu spełniły się wszystkie te znaki."
  tags: []
"1Sm10,10":
  text: "I gdy przybyli na pagórek, spotkała go gromada proroków i spoczął na nim Duch Boży, i prorokował pośród nich."
  tags: []
"1Sm10,11":
  text: "A kiedy wszyscy, którzy go wcześniej znali, zobaczyli, że prorokuje razem z prorokami, mówili jeden do drugiego: Cóż się stało synowi Kisza? Czy również Saul jest wśród proroków?"
  tags: []
"1Sm10,12":
  text: "Pewien człowiek spośród nich zapytał: A kto jest ich ojcem? Dlatego powstało przysłowie: Czyż i Saul jest wśród proroków?"
  tags: []
"1Sm10,13":
  text: "A kiedy przestał prorokować, przyszedł na wyżynę."
  tags: []
"1Sm10,14":
  text: "Potem stryj Saula powiedział do niego i do jego sługi: Gdzie byliście? I odpowiedział: Szukaliśmy oślic. A widząc, że ich nie ma, poszliśmy do Samuela."
  tags: []
"1Sm10,15":
  text: "I stryj Saula powiedział: Powiedz mi, proszę, co wam powiedział Samuel."
  tags: []
"1Sm10,16":
  text: "Saul odpowiedział swemu stryjowi: Zapewnił nas, że oślice się znalazły. Lecz nie powiedział mu o sprawie królestwa, o którym Samuel mówił."
  tags: []
"1Sm10,17":
  text: "Potem Samuel zwołał lud do PANA do Mispy."
  tags: []
"1Sm10,18":
  text: "I przemówił do synów Izraela: Tak mówi PAN, Bóg Izraela: Ja wyprowadziłem Izraela z Egiptu i wybawiłem was z rąk Egipcjan oraz z rąk wszystkich królestw, które was uciskały;"
  tags: []
"1Sm10,19":
  text: "Lecz wy dziś odrzuciliście waszego Boga, który was wybawił od wszystkich nieszczęść i ucisków, i powiedzieliście mu: Ustanów króla nad nami. Teraz więc ustawcie się przed PANEM według waszych pokoleń i według waszych tysięcy."
  tags: []
"1Sm10,20":
  text: "A gdy Samuel kazał zbliżyć się wszystkim pokoleniom Izraela, los padł na pokolenie Beniamina."
  tags: []
"1Sm10,21":
  text: "Potem kazał zbliżyć się pokoleniu Beniamina według jego rodzin i los padł na dom Matriego i trafił na Saula, syna Kisza. I szukali go, lecz go nie znaleźli."
  tags: []
"1Sm10,22":
  text: "Pytali więc PANA znowu: Czy przyjdzie jeszcze ten człowiek? PAN odpowiedział: Oto ukrył się wśród tobołów."
  tags: []
"1Sm10,23":
  text: "Pobiegli i przyprowadzili go stamtąd. Gdy stanął pośród ludu, wzrostem przewyższał o głowę cały lud."
  tags: []
"1Sm10,24":
  text: "I Samuel powiedział do całego ludu: Widzicie, kogo wybrał sobie PAN – że wśród całego ludu nie ma mu równego? A cały lud krzyknął: Niech żyje król!"
  tags: []
"1Sm10,25":
  text: "Wtedy Samuel ogłosił ludowi prawo królewskie, spisał je w księdze i złożył przed PANEM. Potem Samuel odesłał cały lud, każdego do swego domu."
  tags: []
"1Sm10,26":
  text: "Również i Saul poszedł do swego domu do Gibea. A szli za nim wojownicy, których serca Bóg dotknął."
  tags: []
"1Sm10,27":
  text: "Lecz synowie Beliala powiedzieli: Ten ma nas wybawić? Wzgardzili nim i nie przynieśli mu żadnych darów. On zaś milczał."
  tags: []
