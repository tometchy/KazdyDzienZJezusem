"1Sm19,1": "Wtedy Saul mówił do swego syna Jonatana i do wszystkich swoich sług, aby zabili Dawida."
"1Sm19,2": "Lecz Jonatan, syn Saula, bardzo miłował Dawida. I Jonatan doniósł Dawidowi, mówiąc: Mój ojciec Saul chce cię zabić. Teraz więc strzeż się do rana i siedź w ukryciu."
"1Sm19,3": "A ja wyjdę i stanę przy swoim ojcu na polu, tam gdzie ty będziesz. Będę rozmawiał o tobie ze swoim ojcem, a cokolwiek zobaczę, powiadomię cię o tym."
"1Sm19,4": "Jonatan mówił więc dobrze o Dawidzie ze swym ojcem Saulem i powiedział mu: Niech król nie grzeszy przeciwko swemu słudze Dawidowi, gdyż on nie zgrzeszył przeciw tobie, a jego czyny są raczej dla ciebie bardzo pożyteczne:"
"1Sm19,5": "On przecież narażał swoje życie i zabił Filistyna, i PAN dokonał wielkiego wybawienia dla całego Izraela. Sam to widziałeś i uradowałeś się. Dlaczego więc miałbyś grzeszyć przeciw niewinnej krwi i bez powodu zabić Dawida?"
"1Sm19,6": "I Saul posłuchał słów Jonatana, i przysiągł: Jak żyje PAN, nie zostanie zabity."
"1Sm19,7": "Jonatan zawołał więc Dawida i powtórzył mu wszystkie te słowa. Potem Jonatan przyprowadził Dawida do Saula i przebywał z nim, tak jak poprzednio."
"1Sm19,8": "Gdy znowu wybuchła wojna, Dawid wyruszył przeciw Filistynom i walczył z nimi, i zadał im wielką klęskę tak, że uciekli przed nim."
"1Sm19,9": "A zły duch od PANA opanował Saula, kiedy siedział w swym domu, trzymając włócznię w ręku, Dawid zaś grał swą ręką melodię."
"1Sm19,10": "I Saul chciał przybić Dawida włócznią do ściany, lecz ten wymknął się Saulowi i włócznia utkwiła w ścianie, a Dawid wybiegł i uciekł tej nocy."
"1Sm19,11": "Potem Saul wysłał posłańców do domu Dawida, aby go pilnowali i rano zabili. Lecz Mikal, jego żona, powiedziała o tym Dawidowi: Jeśli nie ujdziesz z życiem tej nocy, jutro zostaniesz zabity."
"1Sm19,12": "Mikal spuściła więc Dawida przez okno, a on odszedł, uciekł i ocalał."
"1Sm19,13": "A Mikal wzięła bożka i położyła na łożu, a poduszkę z koziej sierści umieściła pod jego głową i przykryła szatą."
"1Sm19,14": "Gdy Saul wysłał posłańców, aby porwali Dawida, powiedziała: Jest chory."
"1Sm19,15": "Saul znowu wysłał posłańców, aby zobaczyli Dawida, nakazując: Przynieście go do mnie na łożu, abym go zabił."
"1Sm19,16": "A gdy posłańcy przyszli, oto na łożu był bożek, a poduszka z koziej skóry była pod jego głową."
"1Sm19,17": "I Saul powiedział do Mikal: Dlaczego mnie tak oszukałaś i wypuściłaś mego wroga, aby uszedł? Mikal odpowiedziała Saulowi: On mi powiedział: Puść mnie, dlaczego miałbym cię zabić?"
"1Sm19,18": "Dawid uciekł więc i ocalał, następnie przybył do Samuela, do Rama, i opowiedział mu wszystko, co Saul mu uczynił. Potem wraz z Samuelem poszli do Najot i tam zamieszkali."
"1Sm19,19": "I doniesiono Saulowi: Oto Dawid jest w Najot, w Rama."
"1Sm19,20": "Wtedy Saul wysłał posłańców, aby pojmali Dawida. Gdy zobaczyli gromadę prorokujących proroków oraz Samuela stojącego na ich czele, Duch Boży zstąpił na posłańców i oni także zaczęli prorokować."
"1Sm19,21": "Kiedy doniesiono o tym Saulowi, wysłał innych posłańców, lecz i oni prorokowali. Saul wysłał i trzecich posłańców, lecz także i ci prorokowali."
"1Sm19,22": "Potem on sam poszedł do Rama i gdy przyszedł do wielkiej studni, która jest w Seku, zapytał: Gdzie jest Samuel i Dawid? Odpowiedziano mu: Oto są w Najot, w Rama."
"1Sm19,23": "I szedł stamtąd do Najot w Rama, lecz na niego też zstąpił Duch Boży, tak że idąc, prorokował, aż przyszedł do Najot w Rama."
"1Sm19,24": "I zdjął z siebie szaty i także prorokował przed Samuelem, leżąc nagi przez cały dzień i całą noc. Stąd powiedzenie: Czyż i Saul jest między prorokami?"
