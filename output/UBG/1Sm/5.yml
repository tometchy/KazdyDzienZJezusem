"1Sm5,1":
  text: "A Filistyni wzięli arkę Boga i zanieśli ją z Ebenezer do Aszdodu."
  tags: []
"1Sm5,2":
  text: "Następnie Filistyni wzięli arkę Boga i wprowadzili do świątyni Dagona, i postawili obok Dagona."
  tags: []
"1Sm5,3":
  text: "A gdy nazajutrz rano Aszdodyci wstali, oto Dagon leżał twarzą do ziemi przed arką PANA. Podnieśli więc Dagona i postawili go na swoim miejscu."
  tags: []
"1Sm5,4":
  text: "Gdy zaś wstali kolejnego dnia rano, oto Dagon leżał twarzą do ziemi przed arką PANA. Głowa Dagona i obie dłonie jego rąk leżały odcięte na progu, z Dagona pozostał tylko tułów."
  tags: []
"1Sm5,5":
  text: "Dlatego kapłani Dagona i wszyscy, którzy wchodzą do świątyni Dagona, nie stąpają na progu Dagona w Aszdodzie aż do dziś."
  tags: []
"1Sm5,6":
  text: "Lecz ręka PANA zaciążyła nad mieszkańcami Aszdodu i niszczyła ich. Ukarał ich wrzodami – zarówno Aszdod, jak i jego okolice."
  tags: []
"1Sm5,7":
  text: "Gdy więc mieszkańcy Aszdodu zauważyli, co się działo, powiedzieli: Arka Boga Izraela nie może z nami zostać, gdyż jego ręka jest surowa wobec nas i wobec Dagona, naszego boga."
  tags: []
"1Sm5,8":
  text: "Zwołali więc i zebrali u siebie wszystkich książąt filistyńskich i powiedzieli: Co mamy zrobić z arką Boga Izraela? I odpowiedzieli: Niech arka Boga Izraela zostanie przeniesiona do Gat. I przeniesiono tam arkę Boga Izraela."
  tags: []
"1Sm5,9":
  text: "A gdy ją przenieśli, ręka PANA powstała przeciwko miastu i dotknęła je wielkim uciskiem. Pokarała mieszkańców miasta, od najmniejszego do największego, i pojawiły się u nich wrzody w ukrytych miejscach."
  tags: []
"1Sm5,10":
  text: "Wysłali więc arkę Boga do Ekronu. A gdy arka Boga przybyła do Ekronu, Ekronici zawołali: Przynieśli do nas arkę Boga Izraela, aby zgładzić nas i nasz lud."
  tags: []
"1Sm5,11":
  text: "Dlatego zwołali i zgromadzili wszystkich książąt filistyńskich, i powiedzieli: Odeślijcie arkę Boga Izraela, niech powróci na swoje miejsce, aby nie zabiła nas i naszego ludu. W całym mieście panował bowiem śmiertelny strach i bardzo zaciążyła tam ręka Boga."
  tags: []
"1Sm5,12":
  text: "A mieszkańcy, którzy nie umarli, byli dotknięci wrzodami. I krzyk miasta wznosił się ku niebu."
  tags: []
