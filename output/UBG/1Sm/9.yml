"1Sm9,1":
  text: "Był pewien człowiek z pokolenia Beniamina, któremu na imię było Kisz – syn Abiela, syna Cerora, syna Bekorata, syna Afiacha, Beniaminita, dzielny mąż."
  tags: []
"1Sm9,2":
  text: "Miał on syna imieniem Saul, urodziwego młodzieńca. Nie było nikogo spośród synów Izraela przystojniejszego niż on. Wzrostem o głowę przewyższał cały lud."
  tags: []
"1Sm9,3":
  text: "A zaginęły oślice Kisza, ojca Saula. Wtedy Kisz powiedział do swego syna Saula: Weź teraz ze sobą jednego ze sług i wstań, idź, poszukaj oślic."
  tags: []
"1Sm9,4":
  text: "Przeszedł więc przez górę Efraim i przez ziemię Szalisza, lecz ich nie znaleźli. Przeszli także przez ziemię Szaalim, ale ich nie znaleźli. Przeszli też przez ziemię Beniamina i ich nie znaleźli."
  tags: []
"1Sm9,5":
  text: "Kiedy przyszli do ziemi Suf, Saul powiedział do swego sługi, który z nim był: Chodź, wracajmy, by czasem mój ojciec nie zaniechał troski o oślice i nie martwił się o nas."
  tags: []
"1Sm9,6":
  text: "Ten mu odpowiedział: Oto teraz w tym mieście jest mąż Boży, człowiek szanowany; wszystko, co mówi, spełnia się. Pójdźmy więc tam, może wskaże nam drogę, którą mamy iść."
  tags: []
"1Sm9,7":
  text: "Wtedy Saul odpowiedział swemu słudze: Jeśli pójdziemy, cóż przyniesiemy temu człowiekowi? Chleb bowiem wyczerpał się już w naszych torbach i nie mamy podarunku, który moglibyśmy przynieść mężowi Bożemu. Cóż mamy?"
  tags: []
"1Sm9,8":
  text: "Sługa znowu odpowiedział Saulowi: Oto mam przy sobie ćwierć srebrnego sykla. Dam to mężowi Bożemu, aby oznajmił nam naszą drogę."
  tags: []
"1Sm9,9":
  text: "Dawniej w Izraelu, kiedy ktoś szedł poradzić się Boga, tak mówił: Chodźcie, pójdziemy do widzącego. Dzisiejszego proroka bowiem dawniej nazywano widzącym."
  tags: []
"1Sm9,10":
  text: "Wtedy Saul powiedział do swego sługi: Słuszne jest twoje słowo, chodź, pójdziemy. I udali się do miasta, w którym był mąż Boży."
  tags: []
"1Sm9,11":
  text: "A gdy wchodzili na górę do miasta, spotkali dziewczęta, które wyszły naczerpać wody. I zapytali je: Czy jest tu widzący?"
  tags: []
"1Sm9,12":
  text: "One odpowiedziały im: Tak, oto jest przed tobą. Pośpiesz się, dziś bowiem przyszedł do miasta, gdyż dziś lud składa ofiary na wyżynie."
  tags: []
"1Sm9,13":
  text: "Gdy wejdziecie do miasta, znajdziecie go, zanim pójdzie na wyżynę na posiłek. Lud bowiem nie będzie jadł, dopóki on nie przyjdzie, gdyż on błogosławi ofiarę. Dopiero potem jedzą zaproszeni. Idźcie więc, bo właśnie teraz go spotkacie."
  tags: []
"1Sm9,14":
  text: "Ruszyli więc do miasta. A gdy wchodzili do miasta, oto Samuel wychodził im naprzeciw, udając się na wyżynę."
  tags: []
"1Sm9,15":
  text: "A PAN wyjawił Samuelowi na dzień przed przybyciem Saula, mówiąc mu:"
  tags: []
"1Sm9,16":
  text: "Jutro w tym czasie wyślę do ciebie człowieka z ziemi Beniamina. Jego namaścisz na wodza nad moim ludem Izraelem; a on wybawi mój lud z rąk Filistynów. Wejrzałem bowiem na swój lud, gdyż jego lament dotarł do mnie."
  tags: []
"1Sm9,17":
  text: "A gdy Samuel zobaczył Saula, PAN mu powiedział: Oto człowiek, o którym ci powiedziałem. Właśnie on będzie panował nad moim ludem."
  tags: []
"1Sm9,18":
  text: "Wtedy Saul zbliżył się do Samuela w bramie i powiedział: Proszę, powiedz mi, gdzie jest dom widzącego?"
  tags: []
"1Sm9,19":
  text: "Samuel odpowiedział Saulowi: Ja jestem widzący. Idź przede mną na wyżynę. Dziś będziecie jeść ze mną, a jutro rano odprawię cię i powiem ci wszystko, co jest w twoim sercu."
  tags: []
"1Sm9,20":
  text: "A co do oślic, które ci zaginęły trzy dni temu, nie martw się, bo już się znalazły. I na kogo jest zwrócone wszelkie pragnienie Izraela? Czy nie na ciebie i na cały dom twego ojca?"
  tags: []
"1Sm9,21":
  text: "Saul odpowiedział: Czyż nie jestem Beniaminitą – z najmniejszego pokolenia Izraela? I czyż moja rodzina nie jest najmniejsza ze wszystkich rodzin pokolenia Beniamina? Dlaczego więc mówisz do mnie takie słowa?"
  tags: []
"1Sm9,22":
  text: "I Samuel zabrał Saula i jego sługę, zaprowadził ich do sali i dał im pierwsze miejsce wśród zaproszonych, a było ich około trzydziestu ludzi."
  tags: []
"1Sm9,23":
  text: "Wtedy Samuel powiedział do kucharza: Podaj tę część, którą ci dałem i o której ci mówiłem: Zatrzymaj ją u siebie;"
  tags: []
"1Sm9,24":
  text: "Kucharz przyniósł łopatkę i to, co było na niej, i położył przed Saulem, a Samuel powiedział: Oto co zostało, połóż to przed sobą i jedz, bo kiedy powiedziałem: Wezwałem lud – zostało to zachowane dla ciebie na tę chwilę. I Saul jadł razem z Samuelem tego dnia."
  tags: []
"1Sm9,25":
  text: "A gdy zeszli z wyżyny do miasta, Samuel rozmawiał z Saulem na dachu."
  tags: []
"1Sm9,26":
  text: "Potem wstali wcześnie rano. I gdy zaczęło świtać, Samuel zawołał Saula na dach, mówiąc: Wstań, a wyprawię cię. Saul wstał więc i obaj wyszli z domu, on i Samuel."
  tags: []
"1Sm9,27":
  text: "A gdy schodzili ku granicy miasta, Samuel odezwał się do Saula: Powiedz słudze, aby poszedł przed nami. I gdy ten poszedł, dodał: Ty zaś zatrzymaj się na chwilę, abym ci oznajmił słowo Boże."
  tags: []
