"1Sm1,1":
  text: "Był pewien człowiek z Ramataim-Sofim, z góry Efraim, imieniem Elkana, syn Jerochama, syna Elihu, syna Tochu, syna Sufa Efratejczyka."
  tags: []
"1Sm1,2":
  text: "Miał on dwie żony, jednej było na imię Anna, a drugiej – Peninna. Peninna miała dzieci, Anna zaś była bezdzietna."
  tags: []
"1Sm1,3":
  text: "Człowiek ten co roku udawał się ze swego miasta, aby oddać cześć i złożyć ofiarę PANU zastępów w Szilo. Tam byli dwaj synowie Helego, Chofni i Pinchas, kapłani PANA."
  tags: []
"1Sm1,4":
  text: "A gdy nadszedł dzień, w którym Elkana składał ofiarę, dał swojej żonie Peninnie oraz wszystkim jej synom i córkom części z ofiary;"
  tags: []
"1Sm1,5":
  text: "Ale Annie dał jedną wyborną część, gdyż miłował Annę, choć PAN zamknął jej łono."
  tags: []
"1Sm1,6":
  text: "Jej przeciwniczka zaś bardzo jej dokuczała, aby tylko ją rozgniewać z tego powodu, że PAN zamknął jej łono."
  tags: []
"1Sm1,7":
  text: "I tak Elkana czynił każdego roku, a ilekroć Anna przychodziła do domu PANA, w ten sposób Peninna jej dokuczała. Ta zaś płakała i nie jadła."
  tags: []
"1Sm1,8":
  text: "Wtedy Elkana, jej mąż, powiedział do niej: Anno, czemu płaczesz? Dlaczego nie jesz? Czemu tak smuci się twoje serce? Czy ja nie jestem dla ciebie lepszy niż dziesięciu synów?"
  tags: []
"1Sm1,9":
  text: "I gdy najedli się, i napili w Szilo, Anna wstała. A kapłan Heli siedział na krześle przy odrzwiach świątyni PANA."
  tags: []
"1Sm1,10":
  text: "A ona, z goryczą w duszy, modliła się do PANA i strasznie płakała."
  tags: []
"1Sm1,11":
  text: "I złożyła ślub, mówiąc: PANIE zastępów, jeśli wejrzysz na utrapienie swojej służącej i wspomnisz na mnie, i nie zapomnisz swojej służącej, ale dasz swej służącej męskiego potomka, wtedy oddam go PANU na wszystkie dni jego życia, a brzytwa nie dotknie jego głowy."
  tags: []
"1Sm1,12":
  text: "A gdy długo modliła się przed PANEM, Heli przypatrywał się jej ustom."
  tags: []
"1Sm1,13":
  text: "Lecz Anna mówiła w swym sercu i tylko jej wargi się poruszały, ale jej głosu nie było słychać. Heli sądził więc, że jest pijana."
  tags: []
"1Sm1,14":
  text: "I Heli powiedział do niej: Jak długo będziesz pijana? Wytrzeźwiej od swego wina."
  tags: []
"1Sm1,15":
  text: "Anna zaś odpowiedziała: Nie, mój panie. Jestem kobietą utrapionego ducha. Nie piłam ani wina, ani mocnego napoju, lecz wylałam swoją duszę przed PANEM."
  tags: []
"1Sm1,16":
  text: "Nie uważaj swojej służącej za kobietę Beliala, gdyż z nadmiaru troski i smutku aż dotąd mówiłam."
  tags: []
"1Sm1,17":
  text: "Wtedy Heli odpowiedział: Idź w pokoju, a niech Bóg Izraela spełni twoją prośbę, którą zaniosłaś do niego."
  tags: []
"1Sm1,18":
  text: "I powiedziała: Niech twoja służąca znajdzie łaskę w twoich oczach. I ta kobieta poszła swoją drogą, i jadła, a jej twarz już nie była smutna."
  tags: []
"1Sm1,19":
  text: "Nazajutrz wstali wcześnie rano, pokłonili się przed PANEM, wrócili się i przybyli do swego domu w Rama. I Elkana obcował z Anną, swoją żoną, a PAN wspomniał na nią."
  tags: []
"1Sm1,20":
  text: "I gdy się wypełniły dni potem, jak Anna poczęła, urodziła syna i nadała mu imię Samuel, gdyż mówiła: Uprosiłam go u PANA."
  tags: []
"1Sm1,21":
  text: "Potem ten człowiek, Elkana, wraz z całym swoim domem udał się, aby złożyć PANU doroczną ofiarę oraz wypełnić swój ślub."
  tags: []
"1Sm1,22":
  text: "Lecz Anna nie poszła, bo mówiła swemu mężowi: Nie pójdę, aż dziecko będzie odstawione od piersi, potem je zaprowadzę, żeby ukazało się przed PANEM i zostało tam na zawsze."
  tags: []
"1Sm1,23":
  text: "Jej mąż Elkana odpowiedział: Czyń to, co ci się wydaje słuszne; pozostań, aż go odstawisz. Niech tylko PAN utwierdzi swoje słowo. Kobieta pozostała więc i karmiła piersią swego syna, aż do odstawienia go od piersi."
  tags: []
"1Sm1,24":
  text: "A gdy go odstawiła, wzięła go ze sobą wraz z trzema cielcami, z jedną efą mąki i bukłakiem wina i przyprowadziła go do domu PANA w Szilo; a dziecko było małe."
  tags: []
"1Sm1,25":
  text: "I zabili cielca, i przyprowadzili dziecko do Heliego."
  tags: []
"1Sm1,26":
  text: "A ona powiedziała: Proszę, mój panie! Jak żyje twoja dusza, mój panie, to ja jestem tą kobietą, która stała tu przy tobie, modląc się do PANA."
  tags: []
"1Sm1,27":
  text: "Prosiłam o to dziecko i PAN spełnił moją prośbę, którą zaniosłam do niego."
  tags: []
"1Sm1,28":
  text: "Dlatego też oddaję je PANU. Na wszystkie dni jego życia zostaje oddane PANU. I oddał tam pokłon PANU."
  tags: []
