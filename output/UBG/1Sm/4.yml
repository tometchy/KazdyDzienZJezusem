"1Sm4,1":
  text: "I słowo Samuela dotarło do całego Izraela. W tym czasie Izrael wyruszył przeciwko Filistynom do walki i rozbili obóz koło Ebenezer. Filistyni zaś rozbili obóz w Afek."
  tags: []
"1Sm4,2":
  text: "Wtedy Filistyni ustawili się w szyku bojowym przeciwko Izraelowi. Gdy walka rozgorzała, Izrael został pobity przez Filistynów, którzy zabili na polu bitwy około czterech tysięcy ludzi."
  tags: []
"1Sm4,3":
  text: "I kiedy lud wrócił do obozu, starsi Izraela powiedzieli: Dlaczego PAN pobił nas dziś przed Filistynami? Sprowadźmy do siebie z Szilo arkę przymierza PANA, by weszła między nas i wybawiła nas z rąk naszych wrogów."
  tags: []
"1Sm4,4":
  text: "Posłał więc lud do Szilo, by sprowadzić stamtąd arkę przymierza PANA zastępów, który zasiada między cherubinami. Byli tam też z arką przymierza Boga dwaj synowie Helego, Chofni i Pinchas."
  tags: []
"1Sm4,5":
  text: "A gdy arka przymierza PANA przybyła do obozu, cały Izrael zawołał wielkim głosem, że aż ziemia zadrżała."
  tags: []
"1Sm4,6":
  text: "Kiedy Filistyni usłyszeli ten okrzyk, pytali: Cóż to za wielki okrzyk w obozie Hebrajczyków? I dowiedzieli się, że arka PANA przybyła do obozu."
  tags: []
"1Sm4,7":
  text: "I Filistyni zlękli się, gdyż mówiono: Bóg przybył do ich obozu. I mówili: Biada nam, bo czegoś takiego nigdy przedtem nie było."
  tags: []
"1Sm4,8":
  text: "Biada nam! Któż nas wybawi z rąk tych potężnych bogów? To są ci bogowie, którzy porazili Egipt wszelką plagą na pustyni."
  tags: []
"1Sm4,9":
  text: "Umacniajcie się i bądźcie mężni, o Filistyni, abyście nie służyli Hebrajczykom, tak jak oni wam służyli. Bądźcie więc mężni i walczcie!"
  tags: []
"1Sm4,10":
  text: "Wtedy Filistyni walczyli, a Izrael został pokonany i każdy uciekał do swego namiotu. Była to wielka klęska, gdyż poległo trzydzieści tysięcy z piechoty Izraela."
  tags: []
"1Sm4,11":
  text: "I arka Boga została zabrana, a dwaj synowie Heliego, Chofni i Pinchas, polegli."
  tags: []
"1Sm4,12":
  text: "A pewien Beniaminita uciekł z bitwy i przyszedł do Szilo tego samego dnia w podartej szacie i z prochem na swojej głowie."
  tags: []
"1Sm4,13":
  text: "Kiedy przyszedł, oto Heli siedział na krześle przy drodze i wyczekiwał, bo jego serce drżało o arkę Boga. Gdy ten człowiek przyszedł do miasta i opowiedział o tym, całe miasto podniosło krzyk."
  tags: []
"1Sm4,14":
  text: "I kiedy Heli usłyszał ten krzyk, powiedział: Cóż to za zgiełk? A ten człowiek śpiesznie przyszedł i oznajmił o tym Heliemu."
  tags: []
"1Sm4,15":
  text: "A Heli miał już dziewięćdziesiąt osiem lat i jego oczy tak zasłabły, że nie mógł nic widzieć."
  tags: []
"1Sm4,16":
  text: "Człowiek ten powiedział do Heliego: Przychodzę z bitwy, bo dziś z niej uciekłem. On zaś zapytał: Cóż tam się stało, mój synu?"
  tags: []
"1Sm4,17":
  text: "Posłaniec odpowiedział: Izrael uciekł przed Filistynami i lud poniósł wielką klęskę. Zginęli także twoi dwaj synowie, Chofni i Pinchas, a arka Boga została zabrana."
  tags: []
"1Sm4,18":
  text: "A gdy wspomniał o arce Boga, Heli spadł z krzesła na wznak obok bramy, złamał sobie kark i umarł. Był bowiem człowiekiem starym i ociężałym, a sądził Izraela przez czterdzieści lat."
  tags: []
"1Sm4,19":
  text: "Jego synowa, żona Pinchasa, była brzemienna i bliska porodu, a gdy usłyszała wieści o zabraniu arki Bożej i o śmierci jej teścia i męża, skuliła się i urodziła. Dosięgły ją bowiem bóle porodowe."
  tags: []
"1Sm4,20":
  text: "Gdy umierała, kobiety, które były przy niej, powiedziały: Nie bój się, bo urodziłaś syna. Lecz ona nic nie odpowiedziała ani nie zwróciła na to uwagi."
  tags: []
"1Sm4,21":
  text: "I nazwała dziecko Ikabod, mówiąc: Odeszła chwała od Izraela – z powodu zabrania arki Boga i z powodu jej teścia i męża."
  tags: []
"1Sm4,22":
  text: "Dlatego powiedziała: Odeszła chwała od Izraela, gdyż arka Boga została zabrana."
  tags: []
