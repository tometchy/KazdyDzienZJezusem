"1Sm14,1":
  text: "Pewnego dnia Jonatan, syn Saula, powiedział do swego giermka: Chodź, pójdziemy do załogi Filistynów, która jest po tamtej stronie. Lecz swemu ojcu nic o tym nie powiedział."
  tags: []
"1Sm14,2":
  text: "Saul zaś pozostał na krańcu Gibea pod drzewem granatu, które było w Migron. A lud, który był z nim, liczył około sześciuset mężczyzn."
  tags: []
"1Sm14,3":
  text: "A Achiasz, syn Achituba, brata Ikaboda, syna Pinchasa, syna Helego, kapłana PANA w Szilo, nosił wtedy efod. Lud zaś nie wiedział, że Jonatan odszedł."
  tags: []
"1Sm14,4":
  text: "Między przełęczami, gdzie Jonatan chciał przejść do załogi Filistynów, była ostra skała po jednej stronie i ostra skała po drugiej stronie; jedną z nich nazywano Boses, a drugą – Senne."
  tags: []
"1Sm14,5":
  text: "Jedna skała była zwrócona na północ, naprzeciw Mikmas, a druga – na południe, naprzeciw Gibea."
  tags: []
"1Sm14,6":
  text: "I Jonatan powiedział do swego giermka: Chodź, pójdziemy do załogi tych nieobrzezanych, może PAN zadziała dla nas, gdyż PANU nietrudno wybawić przez wielu czy przez niewielu."
  tags: []
"1Sm14,7":
  text: "Jego giermek odpowiedział mu: Czyń wszystko, co jest w twoim sercu. Idź, oto ja jestem z tobą według twojej woli."
  tags: []
"1Sm14,8":
  text: "Wtedy Jonatan powiedział: Pójdziemy do tych ludzi i pokażemy się im."
  tags: []
"1Sm14,9":
  text: "Jeśli powiedzą nam: Czekajcie, aż przyjdziemy do was, to zatrzymamy się na swym miejscu i nie pójdziemy do nich;"
  tags: []
"1Sm14,10":
  text: "Lecz jeśli powiedzą: Chodźcie do nas, to pójdziemy, gdyż PAN wydał ich w nasze ręce. To będzie dla nas znakiem."
  tags: []
"1Sm14,11":
  text: "Pokazali się więc obaj straży filistyńskiej. I Filistyni powiedzieli: Oto Hebrajczycy wychodzą z nor, w których się ukryli."
  tags: []
"1Sm14,12":
  text: "I ludzie ze straży odezwali się do Jonatana i giermka: Podejdźcie do nas, a pokażemy wam coś. Jonatan powiedział do swego giermka: Chodź za mną, gdyż PAN wydał ich w ręce Izraela."
  tags: []
"1Sm14,13":
  text: "Jonatan wspinał się na swych rękach i nogach, a jego giermek szedł za nim. I padali przed Jonatanem, a jego giermek, idący za nim, dobijał ich."
  tags: []
"1Sm14,14":
  text: "To była pierwsza klęska, jaką zadali Jonatan i jego giermek. Zabili około dwudziestu ludzi, na przestrzeni około morgi pola."
  tags: []
"1Sm14,15":
  text: "I padł strach na obóz w polu i na cały lud. Przeraziły się także załoga oraz łupieżcy, a ziemia zatrzęsła się, wywołując wielką trwogę."
  tags: []
"1Sm14,16":
  text: "I strażnicy Saula w Gibea Beniamina zobaczyli, że tłum się rozpierzchł i biegł w bezładzie."
  tags: []
"1Sm14,17":
  text: "Wtedy Saul powiedział do ludu, który przy nim był: Dokonajcie przeglądu i zobaczcie, kto od nas odszedł. A gdy dokonali przeglądu, okazało się, że nie było Jonatana i jego giermka."
  tags: []
"1Sm14,18":
  text: "Saul powiedział do Achiasza: Przynieś arkę Boga, gdyż arka Boga była w tym czasie u synów Izraela."
  tags: []
"1Sm14,19":
  text: "Kiedy Saul jeszcze mówił do kapłana, zamieszanie w obozie filistyńskim trwało i coraz bardziej się wzmagało. Saul powiedział więc do kapłana: Cofnij rękę."
  tags: []
"1Sm14,20":
  text: "Potem Saul i cały lud, który z nim był, zebrali się i przyszli na miejsce bitwy, a miecz każdego był zwrócony przeciwko drugiemu i porażka była bardzo wielka."
  tags: []
"1Sm14,21":
  text: "A Hebrajczycy, którzy byli przedtem z Filistynami i którzy zewsząd z nimi wyruszyli do obozu, również przeszli na stronę Izraelitów, którzy byli z Saulem i Jonatanem."
  tags: []
"1Sm14,22":
  text: "Wszyscy też Izraelici, którzy ukryli się na górze Efraim, gdy usłyszeli, że Filistyni uciekają, wyruszyli za nimi w pościg w tej bitwie."
  tags: []
"1Sm14,23":
  text: "I PAN wybawił Izraela w tym dniu, bitwa zaś przeniosła się aż do Bet-Awen."
  tags: []
"1Sm14,24":
  text: "A Izraelici byli strudzeni w tym dniu. Saul bowiem zaprzysiągł lud, mówiąc: Przeklęty człowiek, który jadłby jakikolwiek posiłek przed wieczorem, dopóki nie zemszczę się na swoich wrogach. Dlatego nikt z ludu nie skosztował żadnego posiłku."
  tags: []
"1Sm14,25":
  text: "Wtedy cały lud tej ziemi przyszedł do lasu, gdzie był miód na ziemi."
  tags: []
"1Sm14,26":
  text: "A gdy lud wszedł do lasu, ujrzał spływający miód. Nikt jednak nie podniósł ręki do ust, bo lud bał się tej przysięgi."
  tags: []
"1Sm14,27":
  text: "Lecz Jonatan nie słyszał, jak jego ojciec zaprzysięgał lud. Ściągnął więc koniec laski, którą miał w ręku, namoczył go w plastrze miodu i podniósł rękę do ust, a jego oczy rozbłysły."
  tags: []
"1Sm14,28":
  text: "Wtedy ktoś z ludu odezwał się: Twój ojciec zaprzysiągł lud, mówiąc: Przeklęty człowiek, który jadłby dzisiaj posiłek. A lud był wyczerpany."
  tags: []
"1Sm14,29":
  text: "Jonatan odpowiedział: Mój ojciec sprowadza nieszczęście na ziemię. Patrzcie, proszę, jak rozbłysły moje oczy, dlatego że skosztowałem trochę tego miodu."
  tags: []
"1Sm14,30":
  text: "Co dopiero, gdyby lud najadł się dziś z łupu swoich wrogów, który zdobył! Czy klęska wśród Filistynów nie byłaby większa?"
  tags: []
"1Sm14,31":
  text: "W tym dniu pobili Filistynów od Mikmas aż do Ajjalon, a lud był bardzo wyczerpany."
  tags: []
"1Sm14,32":
  text: "Wtedy lud rzucił się na łup, brał owce, woły i cielęta i zarzynał je na ziemi, i jadł je razem z krwią."
  tags: []
"1Sm14,33":
  text: "I doniesiono o tym Saulowi: Oto lud grzeszy przeciw PANU, jedząc razem z krwią. A on powiedział: Zgrzeszyliście. Przytoczcie do mnie teraz wielki kamień."
  tags: []
"1Sm14,34":
  text: "Potem Saul powiedział: Rozproszcie się między ludem i powiedzcie mu: Niech każdy przyprowadzi do mnie swego wołu i swoją owcę, zabijajcie je tu i jedzcie, a nie grzeszcie przeciwko PANU, jedząc razem z krwią. Każdy więc z ludu przyprowadził tej nocy własnoręcznie swego wołu i tam go zabijał."
  tags: []
"1Sm14,35":
  text: "Saul zbudował też ołtarz dla PANA. Był to pierwszy ołtarz, który zbudował dla PANA."
  tags: []
"1Sm14,36":
  text: "Następnie Saul powiedział: Puśćmy się w pogoń za Filistynami nocą, łupmy ich aż do świtu, a nie zostawmy ani jednego z nich. Odpowiedzieli mu: Czyń wszystko, co ci się wydaje słuszne. Kapłan zaś powiedział: Przystąpmy tu do Boga."
  tags: []
"1Sm14,37":
  text: "Saul zapytał więc Boga: Czy mam puścić się w pogoń za Filistynami? Czy wydasz ich w ręce Izraela? Lecz nie odpowiedział mu tego dnia."
  tags: []
"1Sm14,38":
  text: "Wtedy Saul powiedział: Zbliżcie się wszyscy przywódcy ludu, zbadajcie i zobaczcie, na czym polega ten dzisiejszy grzech."
  tags: []
"1Sm14,39":
  text: "Bo jak żyje PAN, który wybawia Izraela, choćby to był grzech mego syna Jonatana, poniesie śmierć. I nikt z całego ludu mu nie odpowiedział."
  tags: []
"1Sm14,40":
  text: "Potem rzekł do całego Izraela: Wy będziecie po jednej stronie, a ja i mój syn Jonatan będziemy po drugiej stronie. I lud odpowiedział Saulowi: Czyń, co uważasz za słuszne."
  tags: []
"1Sm14,41":
  text: "Saul powiedział więc do PANA, Boga Izraela: Okaż prawdę. I los padł na Jonatana i Saula, a lud z tego uszedł."
  tags: []
"1Sm14,42":
  text: "Potem Saul powiedział: Rzućcie los między mną a moim synem Jonatanem. I los padł na Jonatana."
  tags: []
"1Sm14,43":
  text: "Wtedy Saul powiedział do Jonatana: Powiedz mi, co uczyniłeś? Jonatan odpowiedział mu: Skosztowałem tylko trochę miodu końcem laski, którą miałem w ręku. Oto mam umrzeć."
  tags: []
"1Sm14,44":
  text: "Saul odpowiedział: Niech mi to Bóg uczyni, a do tego dorzuci. Musisz umrzeć, Jonatanie."
  tags: []
"1Sm14,45":
  text: "Lud jednak powiedział do Saula: Czy ma umrzeć Jonatan, który uczynił to wielkie wybawienie w Izraelu? Nie daj Boże! Jak żyje PAN, ani jeden włos z jego głowy nie spadnie na ziemię, gdyż z pomocą Bożą uczynił to dzisiaj. I tak lud wybawił Jonatana, i nie umarł."
  tags: []
"1Sm14,46":
  text: "Wtedy Saul zaniechał pościgu za Filistynami, Filistyni zaś powrócili do swego miejsca."
  tags: []
"1Sm14,47":
  text: "A Saul objął królestwo nad Izraelem i walczył ze wszystkimi swymi wrogami dokoła: z Moabem, synami Ammona, Edomem, królami Soby i Filistynami. I gdziekolwiek się zwrócił, zwyciężał."
  tags: []
"1Sm14,48":
  text: "Zebrał również wojsko, pobił Amalekitów i wyrwał Izraela z rąk tych, którzy go pustoszyli."
  tags: []
"1Sm14,49":
  text: "Synami Saula byli: Jonatan, Jiszwi i Malkiszua. Imiona jego dwóch córek: imię pierworodnej – Merab, a młodszej – Mikal;"
  tags: []
"1Sm14,50":
  text: "Żona Saula miała na imię Achinoam, była córką Achimaasa. Wódz jego wojska miał na imię Abner, był synem Nera, stryja Saula."
  tags: []
"1Sm14,51":
  text: "Kisz był ojcem Saula, a Ner, ojciec Abnera, był synem Abiela."
  tags: []
"1Sm14,52":
  text: "Przez całe życie Saula trwała zacięta wojna z Filistynami. A gdy Saul zobaczył jakiegoś silnego i dzielnego mężczyznę, zabierał go do siebie."
  tags: []
