"1Sm14,1": "Pewnego dnia Jonatan, syn Saula, powiedział do swego giermka: Chodź, pójdziemy do załogi Filistynów, która jest po tamtej stronie. Lecz swemu ojcu nic o tym nie powiedział."
"1Sm14,2": "Saul zaś pozostał na krańcu Gibea pod drzewem granatu, które było w Migron. A lud, który był z nim, liczył około sześciuset mężczyzn."
"1Sm14,3": "A Achiasz, syn Achituba, brata Ikaboda, syna Pinchasa, syna Helego, kapłana PANA w Szilo, nosił wtedy efod. Lud zaś nie wiedział, że Jonatan odszedł."
"1Sm14,4": "Między przełęczami, gdzie Jonatan chciał przejść do załogi Filistynów, była ostra skała po jednej stronie i ostra skała po drugiej stronie; jedną z nich nazywano Boses, a drugą – Senne."
"1Sm14,5": "Jedna skała była zwrócona na północ, naprzeciw Mikmas, a druga – na południe, naprzeciw Gibea."
"1Sm14,6": "I Jonatan powiedział do swego giermka: Chodź, pójdziemy do załogi tych nieobrzezanych, może PAN zadziała dla nas, gdyż PANU nietrudno wybawić przez wielu czy przez niewielu."
"1Sm14,7": "Jego giermek odpowiedział mu: Czyń wszystko, co jest w twoim sercu. Idź, oto ja jestem z tobą według twojej woli."
"1Sm14,8": "Wtedy Jonatan powiedział: Pójdziemy do tych ludzi i pokażemy się im."
"1Sm14,9": "Jeśli powiedzą nam: Czekajcie, aż przyjdziemy do was, to zatrzymamy się na swym miejscu i nie pójdziemy do nich;"
"1Sm14,10": "Lecz jeśli powiedzą: Chodźcie do nas, to pójdziemy, gdyż PAN wydał ich w nasze ręce. To będzie dla nas znakiem."
"1Sm14,11": "Pokazali się więc obaj straży filistyńskiej. I Filistyni powiedzieli: Oto Hebrajczycy wychodzą z nor, w których się ukryli."
"1Sm14,12": "I ludzie ze straży odezwali się do Jonatana i giermka: Podejdźcie do nas, a pokażemy wam coś. Jonatan powiedział do swego giermka: Chodź za mną, gdyż PAN wydał ich w ręce Izraela."
"1Sm14,13": "Jonatan wspinał się na swych rękach i nogach, a jego giermek szedł za nim. I padali przed Jonatanem, a jego giermek, idący za nim, dobijał ich."
"1Sm14,14": "To była pierwsza klęska, jaką zadali Jonatan i jego giermek. Zabili około dwudziestu ludzi, na przestrzeni około morgi pola."
"1Sm14,15": "I padł strach na obóz w polu i na cały lud. Przeraziły się także załoga oraz łupieżcy, a ziemia zatrzęsła się, wywołując wielką trwogę."
"1Sm14,16": "I strażnicy Saula w Gibea Beniamina zobaczyli, że tłum się rozpierzchł i biegł w bezładzie."
"1Sm14,17": "Wtedy Saul powiedział do ludu, który przy nim był: Dokonajcie przeglądu i zobaczcie, kto od nas odszedł. A gdy dokonali przeglądu, okazało się, że nie było Jonatana i jego giermka."
"1Sm14,18": "Saul powiedział do Achiasza: Przynieś arkę Boga, gdyż arka Boga była w tym czasie u synów Izraela."
"1Sm14,19": "Kiedy Saul jeszcze mówił do kapłana, zamieszanie w obozie filistyńskim trwało i coraz bardziej się wzmagało. Saul powiedział więc do kapłana: Cofnij rękę."
"1Sm14,20": "Potem Saul i cały lud, który z nim był, zebrali się i przyszli na miejsce bitwy, a miecz każdego był zwrócony przeciwko drugiemu i porażka była bardzo wielka."
"1Sm14,21": "A Hebrajczycy, którzy byli przedtem z Filistynami i którzy zewsząd z nimi wyruszyli do obozu, również przeszli na stronę Izraelitów, którzy byli z Saulem i Jonatanem."
"1Sm14,22": "Wszyscy też Izraelici, którzy ukryli się na górze Efraim, gdy usłyszeli, że Filistyni uciekają, wyruszyli za nimi w pościg w tej bitwie."
"1Sm14,23": "I PAN wybawił Izraela w tym dniu, bitwa zaś przeniosła się aż do Bet-Awen."
"1Sm14,24": "A Izraelici byli strudzeni w tym dniu. Saul bowiem zaprzysiągł lud, mówiąc: Przeklęty człowiek, który jadłby jakikolwiek posiłek przed wieczorem, dopóki nie zemszczę się na swoich wrogach. Dlatego nikt z ludu nie skosztował żadnego posiłku."
"1Sm14,25": "Wtedy cały lud tej ziemi przyszedł do lasu, gdzie był miód na ziemi."
"1Sm14,26": "A gdy lud wszedł do lasu, ujrzał spływający miód. Nikt jednak nie podniósł ręki do ust, bo lud bał się tej przysięgi."
"1Sm14,27": "Lecz Jonatan nie słyszał, jak jego ojciec zaprzysięgał lud. Ściągnął więc koniec laski, którą miał w ręku, namoczył go w plastrze miodu i podniósł rękę do ust, a jego oczy rozbłysły."
"1Sm14,28": "Wtedy ktoś z ludu odezwał się: Twój ojciec zaprzysiągł lud, mówiąc: Przeklęty człowiek, który jadłby dzisiaj posiłek. A lud był wyczerpany."
"1Sm14,29": "Jonatan odpowiedział: Mój ojciec sprowadza nieszczęście na ziemię. Patrzcie, proszę, jak rozbłysły moje oczy, dlatego że skosztowałem trochę tego miodu."
"1Sm14,30": "Co dopiero, gdyby lud najadł się dziś z łupu swoich wrogów, który zdobył! Czy klęska wśród Filistynów nie byłaby większa?"
"1Sm14,31": "W tym dniu pobili Filistynów od Mikmas aż do Ajjalon, a lud był bardzo wyczerpany."
"1Sm14,32": "Wtedy lud rzucił się na łup, brał owce, woły i cielęta i zarzynał je na ziemi, i jadł je razem z krwią."
"1Sm14,33": "I doniesiono o tym Saulowi: Oto lud grzeszy przeciw PANU, jedząc razem z krwią. A on powiedział: Zgrzeszyliście. Przytoczcie do mnie teraz wielki kamień."
"1Sm14,34": "Potem Saul powiedział: Rozproszcie się między ludem i powiedzcie mu: Niech każdy przyprowadzi do mnie swego wołu i swoją owcę, zabijajcie je tu i jedzcie, a nie grzeszcie przeciwko PANU, jedząc razem z krwią. Każdy więc z ludu przyprowadził tej nocy własnoręcznie swego wołu i tam go zabijał."
"1Sm14,35": "Saul zbudował też ołtarz dla PANA. Był to pierwszy ołtarz, który zbudował dla PANA."
"1Sm14,36": "Następnie Saul powiedział: Puśćmy się w pogoń za Filistynami nocą, łupmy ich aż do świtu, a nie zostawmy ani jednego z nich. Odpowiedzieli mu: Czyń wszystko, co ci się wydaje słuszne. Kapłan zaś powiedział: Przystąpmy tu do Boga."
"1Sm14,37": "Saul zapytał więc Boga: Czy mam puścić się w pogoń za Filistynami? Czy wydasz ich w ręce Izraela? Lecz nie odpowiedział mu tego dnia."
"1Sm14,38": "Wtedy Saul powiedział: Zbliżcie się wszyscy przywódcy ludu, zbadajcie i zobaczcie, na czym polega ten dzisiejszy grzech."
"1Sm14,39": "Bo jak żyje PAN, który wybawia Izraela, choćby to był grzech mego syna Jonatana, poniesie śmierć. I nikt z całego ludu mu nie odpowiedział."
"1Sm14,40": "Potem rzekł do całego Izraela: Wy będziecie po jednej stronie, a ja i mój syn Jonatan będziemy po drugiej stronie. I lud odpowiedział Saulowi: Czyń, co uważasz za słuszne."
"1Sm14,41": "Saul powiedział więc do PANA, Boga Izraela: Okaż prawdę. I los padł na Jonatana i Saula, a lud z tego uszedł."
"1Sm14,42": "Potem Saul powiedział: Rzućcie los między mną a moim synem Jonatanem. I los padł na Jonatana."
"1Sm14,43": "Wtedy Saul powiedział do Jonatana: Powiedz mi, co uczyniłeś? Jonatan odpowiedział mu: Skosztowałem tylko trochę miodu końcem laski, którą miałem w ręku. Oto mam umrzeć."
"1Sm14,44": "Saul odpowiedział: Niech mi to Bóg uczyni, a do tego dorzuci. Musisz umrzeć, Jonatanie."
"1Sm14,45": "Lud jednak powiedział do Saula: Czy ma umrzeć Jonatan, który uczynił to wielkie wybawienie w Izraelu? Nie daj Boże! Jak żyje PAN, ani jeden włos z jego głowy nie spadnie na ziemię, gdyż z pomocą Bożą uczynił to dzisiaj. I tak lud wybawił Jonatana, i nie umarł."
"1Sm14,46": "Wtedy Saul zaniechał pościgu za Filistynami, Filistyni zaś powrócili do swego miejsca."
"1Sm14,47": "A Saul objął królestwo nad Izraelem i walczył ze wszystkimi swymi wrogami dokoła: z Moabem, synami Ammona, Edomem, królami Soby i Filistynami. I gdziekolwiek się zwrócił, zwyciężał."
"1Sm14,48": "Zebrał również wojsko, pobił Amalekitów i wyrwał Izraela z rąk tych, którzy go pustoszyli."
"1Sm14,49": "Synami Saula byli: Jonatan, Jiszwi i Malkiszua. Imiona jego dwóch córek: imię pierworodnej – Merab, a młodszej – Mikal;"
"1Sm14,50": "Żona Saula miała na imię Achinoam, była córką Achimaasa. Wódz jego wojska miał na imię Abner, był synem Nera, stryja Saula."
"1Sm14,51": "Kisz był ojcem Saula, a Ner, ojciec Abnera, był synem Abiela."
"1Sm14,52": "Przez całe życie Saula trwała zacięta wojna z Filistynami. A gdy Saul zobaczył jakiegoś silnego i dzielnego mężczyznę, zabierał go do siebie."
