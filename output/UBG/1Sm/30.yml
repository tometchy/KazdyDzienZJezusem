"1Sm30,1":
  text: "A gdy trzeciego dnia Dawid i jego ludzie przybyli do Siklag, Amalekici najechali już na południe i na Siklag, zburzyli Siklag i spalili go ogniem;"
  tags: []
"1Sm30,2":
  text: "I zabrali do niewoli kobiety, które w nim były. Nikogo nie zabili, od najmniejszego aż do wielkiego, ale uprowadzili ich i odeszli swoją drogą."
  tags: []
"1Sm30,3":
  text: "A gdy Dawid i jego ludzie przyszli do miasta, było ono spalone ogniem, a ich żony, synów i córki zabrano do niewoli."
  tags: []
"1Sm30,4":
  text: "Wtedy Dawid i lud, który z nim był, podnieśli swój głos i płakali, aż im zabrakło sił do płaczu."
  tags: []
"1Sm30,5":
  text: "Zabrano do niewoli także obie żony Dawida: Achinoam Jizreelitkę i Abigail, dawną żonę Nabala z Karmelu."
  tags: []
"1Sm30,6":
  text: "I Dawid znalazł się w wielkim utrapieniu, bo lud chciał go ukamienować. Dusza całego ludu bowiem była rozgoryczona z powodu swoich synów i córek. Dawid zaś wzmocnił się w PANU, swym Bogu."
  tags: []
"1Sm30,7":
  text: "Wtedy Dawid powiedział do kapłana Abiatara, syna Achimeleka: Przynieś mi, proszę, efod. I Abiatar przyniósł efod Dawidowi."
  tags: []
"1Sm30,8":
  text: "I Dawid radził się PANA, pytając: Czy mam ścigać to wojsko? Czy je dogonię? PAN odpowiedział mu: Ścigaj, bo na pewno dogonisz i na pewno odbierzesz łup."
  tags: []
"1Sm30,9":
  text: "Dawid wyruszył więc, on i sześciuset ludzi, których miał ze sobą, i dotarli do potoku Besor. Tam niektórzy pozostali."
  tags: []
"1Sm30,10":
  text: "Dawid zaś ścigał ich wraz z czterystu ludźmi. Dwustu ludzi bowiem pozostało, gdyż byli zbyt zmęczeni, żeby przejść przez potok Besor."
  tags: []
"1Sm30,11":
  text: "A w polu natknęli się na Egipcjanina i przyprowadzili go do Dawida. Dali mu chleba i jadł, dali mu też wody i pił;"
  tags: []
"1Sm30,12":
  text: "Dali mu także kawałek placka figowego i dwa pęczki rodzynków. Kiedy to zjadł, ożył w nim jego duch, gdyż przez trzy dni i trzy noce nie jadł chleba ani nie pił wody."
  tags: []
"1Sm30,13":
  text: "Wtedy Dawid zapytał go: Do kogo należysz? Skąd jesteś? Odpowiedział: Jestem młodym Egipcjaninem, sługą Amalekity. Mój pan porzucił mnie, bo zachorowałem trzy dni temu."
  tags: []
"1Sm30,14":
  text: "Najechaliśmy na południe od Keretytów, obszar Judy i na południe od Kaleba i podpaliliśmy Siklag ogniem."
  tags: []
"1Sm30,15":
  text: "Dawid zapytał go: Czy mógłbyś mnie zaprowadzić do tej zgrai? Odpowiedział: Przysięgnij mi na Boga, że mnie nie zabijesz ani mnie nie wydasz w ręce mego pana, a zaprowadzę cię do tej zgrai."
  tags: []
"1Sm30,16":
  text: "I zaprowadził go, a oto byli rozproszeni po całej ziemi, jedli, pili i świętowali z powodu całego tego wielkiego łupu, który zabrali z ziemi Filistynów i z ziemi Judy."
  tags: []
"1Sm30,17":
  text: "I Dawid bił ich od zmierzchu aż do wieczora dnia następnego. Żaden z nich nie ocalał oprócz czterystu młodzieńców, którzy wsiedli na wielbłądy i uciekli."
  tags: []
"1Sm30,18":
  text: "Tak Dawid odzyskał wszystko, co zabrali Amalekici. Dawid uratował także swoje dwie żony."
  tags: []
"1Sm30,19":
  text: "Nie zabrakło im nikogo, od najmniejszego do największego, ani synów, ani córek, ani łupu, ani niczego, co im zabrali. Dawid odzyskał wszystko."
  tags: []
"1Sm30,20":
  text: "Potem Dawid zabrał wszystkie trzody i stada, które pędzono przed jego dobytkiem, i mówiono: To jest łup Dawida."
  tags: []
"1Sm30,21":
  text: "I Dawid przybył do tych dwustu ludzi, którzy byli tak zmęczeni, że nie mogli iść za Dawidem, i którym kazał zostać przy potoku Besor. Wyszli oni naprzeciw Dawida i naprzeciw ludzi, którzy z nim byli. A gdy Dawid zbliżył się do tych ludzi, pozdrowił ich."
  tags: []
"1Sm30,22":
  text: "Lecz wszyscy źli ludzie i synowie Beliala, którzy poszli z Dawidem, powiedzieli: Ponieważ ci nie poszli z nami, nie damy im nic z łupu, który odzyskaliśmy, oddamy tylko każdemu jego żonę i dzieci. Niech ich wezmą i odejdą."
  tags: []
"1Sm30,23":
  text: "Wtedy Dawid powiedział: Moi bracia, nie uczynicie tak z tym, co PAN nam dał. On nas strzegł i wydał w nasze ręce zgraję, która na nas napadła."
  tags: []
"1Sm30,24":
  text: "I któż was posłucha w tej sprawie? Bo jaki jest udział tego, który wyruszył na bitwę, taki też będzie udział tego, który został przy taborze; jednakowo się podzielą."
  tags: []
"1Sm30,25":
  text: "I tak zostało od tego dnia na przyszłość: ustalono to jako prawo i zwyczaj w Izraelu aż do dziś."
  tags: []
"1Sm30,26":
  text: "A gdy Dawid przybył do Siklag, posłał część łupu starszym Judy, swym przyjaciołom, ze słowami: Oto błogosławieństwo dla was z łupu wrogów PANA;"
  tags: []
"1Sm30,27":
  text: "Tym, którzy byli w Betel, i tym w Ramat na południu, i tym w Jattir;"
  tags: []
"1Sm30,28":
  text: "I tym w Aroerze, i tym w Sifmot, i tym w Esztemoa;"
  tags: []
"1Sm30,29":
  text: "I tym w Rachal, i tym w miastach Jerachmeelitów, i tym w miastach Kenitów;"
  tags: []
"1Sm30,30":
  text: "I tym w Chorma, i tym w Choraszan, i tym w Atach;"
  tags: []
"1Sm30,31":
  text: "I tym w Hebronie, i tym we wszystkich miejscach, gdzie pomieszkiwał Dawid wraz ze swymi ludźmi."
  tags: []
