"1Sm8,1":
  text: "A gdy Samuel zestarzał się, ustanowił swoich synów sędziami nad Izraelem."
  tags: []
"1Sm8,2":
  text: "Jego pierworodny syn miał na imię Joel, a drugi syn – Abija; byli oni sędziami w Beer-Szebie."
  tags: []
"1Sm8,3":
  text: "Jednak jego synowie nie chodzili jego drogami, lecz skłaniali się ku zyskowi, brali łapówki i wypaczali sąd."
  tags: []
"1Sm8,4":
  text: "Zebrali się więc wszyscy starsi Izraela i przyszli do Samuela, do Rama;"
  tags: []
"1Sm8,5":
  text: "I powiedzieli mu: Oto zestarzałeś się, a twoi synowie nie chodzą twoimi drogami. Ustanów nam więc króla, aby nas sądził, jak to jest u wszystkich narodów."
  tags: []
"1Sm8,6":
  text: "Lecz Samuelowi nie podobało się to, że mówili: Daj nam króla, aby nas sądził. I modlił się Samuel do PANA."
  tags: []
"1Sm8,7":
  text: "Wtedy PAN powiedział do Samuela: Posłuchaj głosu tego ludu we wszystkim, co ci powiedzą, gdyż nie tobą wzgardzili, ale mną wzgardzili, abym nie królował nad nimi."
  tags: []
"1Sm8,8":
  text: "A zgodnie ze wszystkim, co uczynili od tego dnia, kiedy wyprowadziłem ich z Egiptu, aż do dziś, gdy mnie opuścili i służyli obcym bogom, tak też czynią z tobą."
  tags: []
"1Sm8,9":
  text: "Teraz więc posłuchaj ich głosu, ale stanowczo ostrzeż ich i oznajmij im prawo króla, który będzie nad nimi panować."
  tags: []
"1Sm8,10":
  text: "I Samuel powiedział wszystkie słowa PANA do ludu, który go prosił o króla;"
  tags: []
"1Sm8,11":
  text: "I mówił: Takie będzie prawo króla, który będzie panował nad wami: Będzie brał waszych synów, by ich osadzić w swych rydwanach, ustanowić ich jeźdźcami, a inni będą biegać przed jego rydwanem;"
  tags: []
"1Sm8,12":
  text: "I ustanowi ich sobie dowódcami nad tysiącami i nad pięćdziesiątkami; wyznaczy ich, aby uprawiali jego rolę i zbierali jego plony, i robili sprzęt wojenny oraz sprzęt do jego rydwanów."
  tags: []
"1Sm8,13":
  text: "Wasze córki również zabierze, aby przyrządzały wonności oraz aby były kucharkami i piekarkami."
  tags: []
"1Sm8,14":
  text: "Zabierze też wasze pola, winnice i sady oliwne, te najlepsze, i da swoim sługom."
  tags: []
"1Sm8,15":
  text: "Z waszych zasiewów i winnic będzie pobierał dziesięcinę i odda ją swoim urzędnikom i sługom."
  tags: []
"1Sm8,16":
  text: "Weźmie również wasze sługi i służące oraz waszych najlepszych młodzieńców, a także wasze osły, i zatrudni w swojej pracy."
  tags: []
"1Sm8,17":
  text: "Pobierze dziesięcinę z waszych trzód, a wy będziecie jego sługami."
  tags: []
"1Sm8,18":
  text: "I będziecie wołać tego dnia z powodu waszego króla, którego sobie wybraliście, a PAN nie wysłucha was w tym dniu."
  tags: []
"1Sm8,19":
  text: "Lud jednak nie chciał posłuchać głosu Samuela i mówił: Nie tak, ale niech będzie król nad nami;"
  tags: []
"1Sm8,20":
  text: "Abyśmy też byli jak wszystkie narody – aby nasz król sądził nas, aby nam przewodził i prowadził nasze wojny."
  tags: []
"1Sm8,21":
  text: "A Samuel wysłuchał wszystkich słów ludu i powtórzył je do uszu PANA."
  tags: []
"1Sm8,22":
  text: "I PAN powiedział do Samuela: Posłuchaj ich głosu i ustanów nad nimi króla. Samuel powiedział więc do mężczyzn Izraela: Idźcie każdy do swego miasta."
  tags: []
