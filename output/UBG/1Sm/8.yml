"1Sm8,1": "A gdy Samuel zestarzał się, ustanowił swoich synów sędziami nad Izraelem."
"1Sm8,2": "Jego pierworodny syn miał na imię Joel, a drugi syn – Abija; byli oni sędziami w Beer-Szebie."
"1Sm8,3": "Jednak jego synowie nie chodzili jego drogami, lecz skłaniali się ku zyskowi, brali łapówki i wypaczali sąd."
"1Sm8,4": "Zebrali się więc wszyscy starsi Izraela i przyszli do Samuela, do Rama;"
"1Sm8,5": "I powiedzieli mu: Oto zestarzałeś się, a twoi synowie nie chodzą twoimi drogami. Ustanów nam więc króla, aby nas sądził, jak to jest u wszystkich narodów."
"1Sm8,6": "Lecz Samuelowi nie podobało się to, że mówili: Daj nam króla, aby nas sądził. I modlił się Samuel do PANA."
"1Sm8,7": "Wtedy PAN powiedział do Samuela: Posłuchaj głosu tego ludu we wszystkim, co ci powiedzą, gdyż nie tobą wzgardzili, ale mną wzgardzili, abym nie królował nad nimi."
"1Sm8,8": "A zgodnie ze wszystkim, co uczynili od tego dnia, kiedy wyprowadziłem ich z Egiptu, aż do dziś, gdy mnie opuścili i służyli obcym bogom, tak też czynią z tobą."
"1Sm8,9": "Teraz więc posłuchaj ich głosu, ale stanowczo ostrzeż ich i oznajmij im prawo króla, który będzie nad nimi panować."
"1Sm8,10": "I Samuel powiedział wszystkie słowa PANA do ludu, który go prosił o króla;"
"1Sm8,11": "I mówił: Takie będzie prawo króla, który będzie panował nad wami: Będzie brał waszych synów, by ich osadzić w swych rydwanach, ustanowić ich jeźdźcami, a inni będą biegać przed jego rydwanem;"
"1Sm8,12": "I ustanowi ich sobie dowódcami nad tysiącami i nad pięćdziesiątkami; wyznaczy ich, aby uprawiali jego rolę i zbierali jego plony, i robili sprzęt wojenny oraz sprzęt do jego rydwanów."
"1Sm8,13": "Wasze córki również zabierze, aby przyrządzały wonności oraz aby były kucharkami i piekarkami."
"1Sm8,14": "Zabierze też wasze pola, winnice i sady oliwne, te najlepsze, i da swoim sługom."
"1Sm8,15": "Z waszych zasiewów i winnic będzie pobierał dziesięcinę i odda ją swoim urzędnikom i sługom."
"1Sm8,16": "Weźmie również wasze sługi i służące oraz waszych najlepszych młodzieńców, a także wasze osły, i zatrudni w swojej pracy."
"1Sm8,17": "Pobierze dziesięcinę z waszych trzód, a wy będziecie jego sługami."
"1Sm8,18": "I będziecie wołać tego dnia z powodu waszego króla, którego sobie wybraliście, a PAN nie wysłucha was w tym dniu."
"1Sm8,19": "Lud jednak nie chciał posłuchać głosu Samuela i mówił: Nie tak, ale niech będzie król nad nami;"
"1Sm8,20": "Abyśmy też byli jak wszystkie narody – aby nasz król sądził nas, aby nam przewodził i prowadził nasze wojny."
"1Sm8,21": "A Samuel wysłuchał wszystkich słów ludu i powtórzył je do uszu PANA."
"1Sm8,22": "I PAN powiedział do Samuela: Posłuchaj ich głosu i ustanów nad nimi króla. Samuel powiedział więc do mężczyzn Izraela: Idźcie każdy do swego miasta."
