"1Sm25,1":
  text: "Tymczasem Samuel umarł. I zebrali się wszyscy Izraelici, opłakiwali go i pogrzebali go w jego domu w Rama. Wtedy Dawid wstał i udał się na pustynię Paran."
  tags: []
"1Sm25,2":
  text: "A był pewien człowiek w Maon, który miał posiadłość w Karmelu. Był to człowiek zamożny: miał bowiem trzy tysiące owiec i tysiąc kóz. Wtedy właśnie strzygł swoje owce w Karmelu."
  tags: []
"1Sm25,3":
  text: "Człowiek ten miał na imię Nabal, a jego żona nazywała się Abigail. Była to kobieta roztropna i piękna, ale jej mąż był nieokrzesany i występny, pochodził z rodu Kaleba."
  tags: []
"1Sm25,4":
  text: "Gdy Dawid dowiedział się na pustyni, że Nabal strzyże swoje owce;"
  tags: []
"1Sm25,5":
  text: "Posłał dziesięciu sług i powiedział im: Idźcie do Karmelu i udajcie się do Nabala, i pozdrówcie go w moim imieniu;"
  tags: []
"1Sm25,6":
  text: "I tak powiecie do tego, który żyje spokojnie: Pokój niech będzie tobie, pokój twemu domowi i pokój wszystkiemu, co posiadasz!"
  tags: []
"1Sm25,7":
  text: "Właśnie słyszałem, że u ciebie strzygą owce. Gdy twoi pasterze przebywali z nami, nie wyrządziliśmy im żadnej krzywdy i nic im nie zginęło przez cały czas ich pobytu w Karmelu."
  tags: []
"1Sm25,8":
  text: "Zapytaj swoich sług, a powiedzą ci. Niech więc my, twoi słudzy, znajdziemy łaskę w twoich oczach, gdyż przybyliśmy w dobrym dniu. Daj, proszę, swoim sługom i twemu synowi Dawidowi cokolwiek znajdzie twoja ręka."
  tags: []
"1Sm25,9":
  text: "Przyszli więc słudzy Dawida i powtórzyli Nabalowi wszystkie te słowa w imieniu Dawida, i czekali."
  tags: []
"1Sm25,10":
  text: "Nabal odpowiedział sługom Dawida: Któż to jest Dawid? Któż to jest syn Jessego? Wielu sług ucieka dziś od swoich panów."
  tags: []
"1Sm25,11":
  text: "Czyż mam wziąć swój chleb, swoją wodę i mięso swego bydła, które zabiłem dla strzygących moje owce, i dać ludziom, o których nie wiem, skąd są?"
  tags: []
"1Sm25,12":
  text: "Słudzy Dawida zawrócili i udali się w drogę, a gdy przybyli, powiedzieli mu wszystkie te słowa."
  tags: []
"1Sm25,13":
  text: "Wtedy Dawid powiedział swym ludziom: Niech każdy przypasze swój miecz. Każdy więc przypasał swój miecz, Dawid również przypasał swój miecz. I wyruszyło za Dawidem około czterystu ludzi, a dwustu zostało przy taborze."
  tags: []
"1Sm25,14":
  text: "Tymczasem jeden ze sług doniósł o tym Abigail, żonie Nabala: Oto Dawid przysłał posłańców z pustyni, aby błogosławić naszemu panu, lecz on ich zwymyślał."
  tags: []
"1Sm25,15":
  text: "Ale ludzie ci byli dla nas bardzo dobrzy i nie wyrządzili nam żadnej krzywdy ani nic nam nie zginęło przez cały czas, gdy przebywaliśmy z nimi w polu."
  tags: []
"1Sm25,16":
  text: "Byli dla nas murem zarówno w nocy, jak i w dzień, przez cały czas, kiedy byliśmy z nimi, pasąc trzodę."
  tags: []
"1Sm25,17":
  text: "Teraz zatem wiedz o tym i rozważ to, co masz czynić, gdyż postanowiono nieszczęście wobec naszego pana i całego jego domu. On bowiem jest synem Beliala, tak że nie można z nim rozmawiać."
  tags: []
"1Sm25,18":
  text: "Wtedy Abigail pośpieszyła się, wzięła dwieście chlebów, dwa bukłaki wina, pięć przyrządzonych owiec, pięć miar prażonego ziarna, sto pęczków rodzynków oraz dwieście placków figowych i załadowała to na osły."
  tags: []
"1Sm25,19":
  text: "Potem powiedziała swoim sługom: Idźcie przede mną, a ja podążę za wami. Lecz swemu mężowi Nabalowi nie powiedziała o tym."
  tags: []
"1Sm25,20":
  text: "I gdy jechała na ośle, i zjeżdżała pod osłoną góry, oto Dawid i jego ludzie zjeżdżali naprzeciwko niej i spotkała ich."
  tags: []
"1Sm25,21":
  text: "Tymczasem Dawid powiedział: Naprawdę, niepotrzebnie strzegłem na pustyni wszystkiego, co należało do tego człowieka, tak że nic nie zginęło ze wszystkiego, co ma, bo on odpłaca mi złem za dobre."
  tags: []
"1Sm25,22":
  text: "Niech to uczyni Bóg wrogom Dawida i niech do tego dorzuci, jeśli do rana pozostawię ze wszystkich, co do niego należą, aż do najmniejszego szczenięcia."
  tags: []
"1Sm25,23":
  text: "Kiedy Abigail zobaczyła Dawida, pośpiesznie zsiadła z osła i upadła przed Dawidem na twarz, i pokłoniła się aż do ziemi;"
  tags: []
"1Sm25,24":
  text: "Potem upadła mu do nóg i powiedziała: Niech na mnie spadnie nieprawość, mój panie. Pozwól, proszę, by twoja służąca przemówiła do ciebie i posłuchaj słów swojej służącej."
  tags: []
"1Sm25,25":
  text: "Niech mój pan, proszę, nie obraża się na tego syna Beliala, Nabala, gdyż jest on jak jego imię. Na imię ma Nabal i jest w nim głupota. Ja zaś, twoja służąca, nie widziałam sług mego pana, które przysłałeś."
  tags: []
"1Sm25,26":
  text: "Teraz więc, mój panie, jak żyje PAN i jak żyje twoja dusza, skoro PAN powstrzymał cię od rozlewu krwi i od dokonania zemsty twoją własną ręką, to niech teraz będą jak Nabal twoi wrogowie i ci, którzy pragną krzywdy mego pana."
  tags: []
"1Sm25,27":
  text: "Teraz więc to błogosławieństwo, które twoja służąca przyniosła swemu panu, niech będzie oddane sługom, którzy chodzą za moim panem."
  tags: []
"1Sm25,28":
  text: "Przebacz, proszę, występek swojej służącej, gdyż PAN z pewnością uczyni memu panu trwały dom, ponieważ mój pan prowadzi walki PANA, a nie znaleziono zła w tobie przez wszystkie twoje dni."
  tags: []
"1Sm25,29":
  text: "Lecz pewien człowiek powstał, by cię prześladować i czyhać na twoje życie, ale dusza mego pana będzie zachowana w wiązance życia u PANA, twego Boga. Dusze zaś twych wrogów wyrzuci on jak z procy."
  tags: []
"1Sm25,30":
  text: "A gdy PAN uczyni memu panu wszystko dobre, co wypowiedział o tobie, i ustanowi cię władcą nad Izraelem;"
  tags: []
"1Sm25,31":
  text: "Wtedy nie będzie to dla ciebie strapieniem ani wyrzutem sumienia mego pana, że przelałeś niewinną krew bądź dokonałeś zemsty. Gdy więc PAN dobrze uczyni memu panu, wspomnij na swoją służącą."
  tags: []
"1Sm25,32":
  text: "I Dawid powiedział do Abigail: Błogosławiony niech będzie PAN, Bóg Izraela, który wysłał cię dziś na spotkanie ze mną."
  tags: []
"1Sm25,33":
  text: "Błogosławiony twój rozsądek, błogosławiona bądź i ty, która powstrzymałaś mnie dzisiaj od rozlewu krwi i od dokonania zemsty moją własną ręką."
  tags: []
"1Sm25,34":
  text: "Zaprawdę bowiem, jak żyje PAN, Bóg Izraela, który powstrzymał mnie od wyrządzenia ci krzywdy, gdybyś się nie pośpieszyła i nie zajechała mi drogi, to Nabalowi nie pozostałby do świtu nikt, aż do najmniejszego szczenięcia."
  tags: []
"1Sm25,35":
  text: "Dawid przyjął więc z jej ręki to, co mu przyniosła, i powiedział do niej: Idź w pokoju do swego domu. Oto wysłuchałem twego głosu i przyjąłem cię łaskawie."
  tags: []
"1Sm25,36":
  text: "A gdy Abigail wróciła do Nabala, oto wyprawiał ucztę w swoim domu niczym ucztę królewską. A serce Nabala było w nim wesołe, gdyż był bardzo pijany, toteż nie powiedziała mu żadnego słowa aż do świtu."
  tags: []
"1Sm25,37":
  text: "Lecz rano, gdy Nabal wytrzeźwiał od wina, jego żona opowiedziała mu o wszystkim, a jego serce w nim zamarło i stał się on jak kamień."
  tags: []
"1Sm25,38":
  text: "A gdy minęło mniej więcej dziesięć dni, PAN poraził Nabala, tak że umarł."
  tags: []
"1Sm25,39":
  text: "Gdy Dawid usłyszał, że Nabal umarł, powiedział: Błogosławiony PAN, który pomścił mnie na Nabalu za wyrządzoną mi zniewagę, swego sługę powstrzymał od zła, a niegodziwość Nabala zwrócił PAN na jego głowę. Potem Dawid posłał po Abigail i rozmówił się z nią, chcąc ją pojąć za żonę."
  tags: []
"1Sm25,40":
  text: "Słudzy Dawida przybyli więc do Abigail do Karmelu i powiedzieli do niej: Dawid przysłał nas do ciebie, by pojąć cię za żonę."
  tags: []
"1Sm25,41":
  text: "Ona wstała, pokłoniła się twarzą do ziemi i powiedziała: Oto niech twoja służąca będzie sługą do obmywania stóp sługom mego pana."
  tags: []
"1Sm25,42":
  text: "Wtedy Abigail wstała pośpiesznie i wsiadła na osła z pięcioma swymi dziewczętami, które z nią chodziły. I tak pojechała za posłańcami Dawida, i została jego żoną."
  tags: []
"1Sm25,43":
  text: "Dawid wziął też Achinoam z Jizreel i obie zostały jego żonami."
  tags: []
"1Sm25,44":
  text: "Tymczasem Saul oddał swoją córkę Mikal, żonę Dawida, Paltiemu, synowi Lajisza z Gallim."
  tags: []
