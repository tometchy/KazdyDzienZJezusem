"1Sm17,1":
  text: "Wtedy Filistyni zebrali swoje wojska do walki i zgromadzili się w Soko, które należy do Judy, rozbili obóz między Soko a Azeką, w Efes-Dammim."
  tags: []
"1Sm17,2":
  text: "Saul zaś i Izraelici zebrali się i rozbili obóz w dolinie Ela, i ustawili się w szyku bojowym przeciw Filistynom."
  tags: []
"1Sm17,3":
  text: "Filistyni stali na górze po jednej stronie, Izraelici zaś stali na górze po drugiej stronie, a między nimi była dolina."
  tags: []
"1Sm17,4":
  text: "Wtedy z obozu Filistynów wyszedł pewien wojownik z Gat imieniem Goliat, wysoki na sześć łokci i jedną piędź."
  tags: []
"1Sm17,5":
  text: "Na głowie miał spiżowy hełm i był ubrany w łuskowy pancerz; waga pancerza wynosiła pięć tysięcy syklów miedzi."
  tags: []
"1Sm17,6":
  text: "Miał również spiżowe nagolenice na nogach i spiżową tarczę między ramionami."
  tags: []
"1Sm17,7":
  text: "Drzewce jego włóczni były jak wał tkacki, grot jego włóczni ważył sześćset syklów żelaza, a przed nim szedł człowiek niosący jego tarczę."
  tags: []
"1Sm17,8":
  text: "Stanął on i zawołał do wojsk Izraela: Po co ustawiacie się w szyku bojowym? Czy ja nie jestem Filistynem, a wy sługami Saula? Wybierzcie spośród siebie człowieka i niech zejdzie do mnie."
  tags: []
"1Sm17,9":
  text: "Jeśli zdoła ze mną walczyć i zabije mnie, będziemy waszymi niewolnikami. Lecz jeśli ja go pokonam i go zabiję, wy będziecie naszymi niewolnikami i będziecie nam służyć."
  tags: []
"1Sm17,10":
  text: "Filistyn dodał: Rzucam dziś wyzwanie wojskom Izraela. Dajcie mi człowieka, a będziemy ze sobą walczyć."
  tags: []
"1Sm17,11":
  text: "Gdy Saul i cały Izrael usłyszeli słowa Filistyna, zlękli się i bardzo zatrwożyli."
  tags: []
"1Sm17,12":
  text: "Dawid był synem tego Efratejczyka z Betlejem judzkiego, imieniem Jesse, który miał ośmiu synów. Za czasów Saula był on stary i podeszły w latach."
  tags: []
"1Sm17,13":
  text: "Trzej starsi synowie Jessego wyruszyli i udali się za Saulem na wojnę. Imiona jego trzech synów, którzy poszli na wojnę, to: Eliab, pierworodny, drugi po nim – Abinadab i trzeci – Szamma."
  tags: []
"1Sm17,14":
  text: "A Dawid był najmłodszy, a trzej najstarsi poszli za Saulem."
  tags: []
"1Sm17,15":
  text: "Dawid zaś odchodził od Saula i wracał, aby paść trzodę swego ojca w Betlejem."
  tags: []
"1Sm17,16":
  text: "A Filistyn występował rano i wieczorem i stawał tak przez czterdzieści dni."
  tags: []
"1Sm17,17":
  text: "I Jesse powiedział do swego syna Dawida: Weź teraz dla swych braci tę efę prażonego ziarna i tych dziesięć chlebów i biegnij do obozu, do swoich braci."
  tags: []
"1Sm17,18":
  text: "Zanieś też tych dziesięć serów dowódcy oddziału, dowiedz się, jak się mają twoi bracia, i weź ich zastaw."
  tags: []
"1Sm17,19":
  text: "A Saul wraz z nimi i wszystkimi synami Izraela byli w dolinie Ela, walcząc z Filistynami."
  tags: []
"1Sm17,20":
  text: "Wstał więc Dawid wcześnie rano, powierzył trzodę stróżowi, zabrał to wszystko i wyruszył, tak jak mu Jesse nakazał. Gdy przybył do obozu, wojsko wyruszało do bitwy i wydało okrzyk wojenny."
  tags: []
"1Sm17,21":
  text: "Izraelici i Filistyni ustawili się już bowiem w szyku bojowym, szyk przeciwko szykowi."
  tags: []
"1Sm17,22":
  text: "Wtedy Dawid zostawił toboły pod opieką stróża taboru i pobiegł na pole bitwy. Gdy przybył, przywitał się ze swoimi braćmi."
  tags: []
"1Sm17,23":
  text: "Gdy z nimi rozmawiał, oto wojownik imieniem Goliat, Filistyn z Gat, wystąpił z szeregów filistyńskich i zaczął wypowiadać te same słowa. I Dawid to usłyszał."
  tags: []
"1Sm17,24":
  text: "A wszyscy Izraelici na widok tego człowieka uciekali przed nim i bardzo się bali."
  tags: []
"1Sm17,25":
  text: "I Izraelici mówili: Czy widzicie tego człowieka, który występuje? Występuje, by rzucać wyzwanie Izraelowi. Lecz tego, kto go zabije, król wzbogaci wielkim bogactwem i da mu swoją córkę, a dom jego ojca uczyni wolnym w Izraelu."
  tags: []
"1Sm17,26":
  text: "Wtedy Dawid zapytał ludzi stojących przy nim: Co dadzą temu, kto zabije tego Filistyna i odejmie hańbę z Izraela? Bo kim jest ten nieobrzezany Filistyn, że rzuca wyzwanie wojskom Boga żywego?"
  tags: []
"1Sm17,27":
  text: "I lud odpowiedział mu te same słowa: To dadzą temu, kto go zabije."
  tags: []
"1Sm17,28":
  text: "A jego starszy brat, Eliab, usłyszał, że rozmawia z tymi ludźmi. I Eliab zapłonął gniewem na Dawida, i powiedział: Po co tu przyszedłeś i komu zostawiłeś tych parę owiec na pustyni? Znam twoją pychę i przewrotność twego serca, bo przyszedłeś, aby przypatrywać się bitwie."
  tags: []
"1Sm17,29":
  text: "Wtedy Dawid powiedział: Cóż teraz uczyniłem? Czy nie mam tu sprawy?"
  tags: []
"1Sm17,30":
  text: "I odwrócił się od niego do kogoś innego, i pytał się jak przedtem. A lud odpowiedział mu tak jak poprzednio."
  tags: []
"1Sm17,31":
  text: "I usłyszano słowa, które wypowiedział Dawid, i powtórzono je Saulowi. Saul wezwał go więc do siebie."
  tags: []
"1Sm17,32":
  text: "Wtedy Dawid powiedział do Saula: Niech niczyje serce nie upada z jego powodu. Twój sługa pójdzie i będzie walczył z tym Filistynem."
  tags: []
"1Sm17,33":
  text: "Lecz Saul odpowiedział Dawidowi: Ty nie możesz iść przeciwko temu Filistynowi, by z nim walczyć. Jesteś bowiem chłopcem, a on jest wojownikiem od swojej młodości."
  tags: []
"1Sm17,34":
  text: "Dawid odpowiedział Saulowi: Twój sługa pasł trzodę swego ojca, a gdy przychodził lew lub niedźwiedź i porywał barana z trzody;"
  tags: []
"1Sm17,35":
  text: "Wtedy goniłem go, uderzałem na niego i wyrywałem mu go z paszczy. I kiedy rzucał się na mnie, chwytałem go za gardło, biłem i zabijałem go."
  tags: []
"1Sm17,36":
  text: "Twój sługa zabił i lwa, i niedźwiedzia. Ten nieobrzezany Filistyn będzie jak jeden z nich, gdyż rzucił wyzwanie wojskom Boga żywego."
  tags: []
"1Sm17,37":
  text: "Ponadto Dawid powiedział: PAN, który wyrwał mnie z łapy lwa i niedźwiedzia, wyrwie mnie również z rąk tego Filistyna. Wtedy Saul powiedział do Dawida: Idź i niech PAN będzie z tobą."
  tags: []
"1Sm17,38":
  text: "I Saul ubrał Dawida w swoją zbroję, włożył mu na głowę spiżowy hełm i ubrał go w pancerz."
  tags: []
"1Sm17,39":
  text: "Dawid przypasał też jego miecz do swojej zbroi i próbował chodzić, bo nigdy wcześniej tego nie nosił. Wtedy Dawid powiedział do Saula: Nie mogę w tym chodzić, bo nie przywykłem do tego. I Dawid zdjął to z siebie."
  tags: []
"1Sm17,40":
  text: "Potem wziął do ręki swój kij i wybrał sobie pięć gładkich kamieni z potoku, i włożył je do torby pasterskiej, którą miał przy sobie, i z procą w ręku przybliżył się do Filistyna."
  tags: []
"1Sm17,41":
  text: "Filistyn również ruszył i zbliżał się do Dawida, a jego giermek szedł przed nim."
  tags: []
"1Sm17,42":
  text: "A gdy Filistyn spojrzał i zobaczył Dawida, wzgardził nim, dlatego że był młodzieńcem – rudym i przystojnym."
  tags: []
"1Sm17,43":
  text: "I Filistyn powiedział do Dawida: Czyż jestem psem, że przychodzisz do mnie z kijem? I przeklinał Filistyn Dawida przez swoich bogów."
  tags: []
"1Sm17,44":
  text: "Filistyn powiedział jeszcze do Dawida: Chodź do mnie, a dam twoje ciało ptakom powietrznym i zwierzętom polnym."
  tags: []
"1Sm17,45":
  text: "Wtedy Dawid odpowiedział Filistynowi: Ty przychodzisz do mnie z mieczem, włócznią i tarczą, a ja przychodzę do ciebie w imię PANA zastępów, Boga wojsk Izraela, któremu rzuciłeś wyzwanie."
  tags: []
"1Sm17,46":
  text: "Dziś PAN wyda cię w moje ręce, a ja cię zabiję i odetnę ci głowę, i dam dzisiaj trupy wojsk Filistynów ptakom powietrznym i dzikim zwierzętom. I cała ziemia pozna, że jest Bóg w Izraelu;"
  tags: []
"1Sm17,47":
  text: "I całe to zgromadzenie pozna, że nie mieczem ani włócznią wybawia PAN, gdyż walka należy do PANA i on wyda was w nasze ręce."
  tags: []
"1Sm17,48":
  text: "A gdy Filistyn wstał, ruszył i zbliżał się do Dawida, Dawid również pośpiesznie pobiegł na pole walki naprzeciw Filistyna."
  tags: []
"1Sm17,49":
  text: "I Dawid sięgnął ręką do torby, wyjął z niej kamień, cisnął go z procy i ugodził Filistyna w czoło tak, że kamień utkwił mu w czole. I ten upadł twarzą na ziemię."
  tags: []
"1Sm17,50":
  text: "Tak Dawid zwyciężył Filistyna procą i kamieniem. Uderzył Filistyna i zabił go, choć Dawid nie miał w ręku miecza."
  tags: []
"1Sm17,51":
  text: "Dawid podbiegł, stanął nad Filistynem, wziął jego miecz, dobył go z pochwy, zabił go i odciął mu nim głowę. A kiedy Filistyni zobaczyli, że ich bohater umarł, uciekli."
  tags: []
"1Sm17,52":
  text: "Wtedy powstali Izraelici i Judejczycy, wydali okrzyk i ścigali Filistynów aż do wejścia do doliny i aż do bram Ekronu. I ranni Filistyni padali na drodze od Szaaraim aż do Gat i Ekronu."
  tags: []
"1Sm17,53":
  text: "Potem synowie Izraela wrócili z pościgu za Filistynami i złupili ich obóz."
  tags: []
"1Sm17,54":
  text: "A Dawid wziął głowę tego Filistyna i przyniósł ją do Jerozolimy, a jego zbroję włożył do swego namiotu."
  tags: []
"1Sm17,55":
  text: "Gdy Saul zobaczył, że Dawid wyrusza naprzeciw Filistyna, zapytał Abnera, dowódcę wojska: Czyim synem jest ten młodzieniec, Abnerze? Abner odpowiedział: Jak żyje twoja dusza, królu, nie wiem."
  tags: []
"1Sm17,56":
  text: "Wtedy król powiedział: Dowiedz się, czyim synem jest ten młodzieniec."
  tags: []
"1Sm17,57":
  text: "Kiedy Dawid wracał po zabiciu Filistynów, Abner wziął go i przyprowadził przed Saula, a głowa Filistyna była jeszcze w jego ręku."
  tags: []
"1Sm17,58":
  text: "I Saul zapytał go: Czyim synem jesteś, młodzieńcze? Dawid odpowiedział: Jestem synem twego sługi Jessego Betlejemity."
  tags: []
