"1Sm11,1":
  text: "Wtedy nadciągnął Nachasz Ammonita i rozbił obóz przeciwko Jabesz-Gilead. I wszyscy mieszkańcy Jabesz powiedzieli do Nachasza: Zawrzyj z nami przymierze, a będziemy ci służyć."
  tags: []
"1Sm11,2":
  text: "Odpowiedział im Nachasz Ammonita: Zawrę z wami przymierze, pod warunkiem że każdemu z was wyłupię prawe oko i będzie to hańba dla całego Izraela."
  tags: []
"1Sm11,3":
  text: "Starsi z Jabesz odpowiedzieli mu: Daj nam siedem dni na rozesłanie posłańców po wszystkich granicach Izraela. A jeśli nie będzie nikogo, kto by nas uratował, wtedy wyjdziemy do ciebie."
  tags: []
"1Sm11,4":
  text: "Przyszli więc posłańcy do Gibea, miasta Saula, i powtórzyli te słowa do uszu ludu. Cały lud zaś podniósł donośny lament i płakał."
  tags: []
"1Sm11,5":
  text: "A oto Saul wracał za wołami z pola i pytał się: Co się stało ludowi, że płacze? I opowiedzieli mu wszystkie słowa mieszkańców Jabesz."
  tags: []
"1Sm11,6":
  text: "Gdy Saul usłyszał te słowa, zstąpił na niego Duch Boży i Saul zapałał wielkim gniewem."
  tags: []
"1Sm11,7":
  text: "I wziął parę wołów, rozrąbał je na części i rozesłał je przez posłańców po wszystkich granicach Izraela, mówiąc: Tak się stanie z wołami każdego, kto nie wyruszy za Saulem i Samuelem. I padł strach PANA na lud, i wyruszyli jak jeden mąż."
  tags: []
"1Sm11,8":
  text: "Potem dokonał ich przeglądu w Bezek – było trzysta tysięcy synów Izraela, a mężczyzn Judy trzydzieści tysięcy."
  tags: []
"1Sm11,9":
  text: "I powiedzieli posłańcom, którzy przyszli: Tak powiedzcie mieszkańcom Jabesz-Gilead: Jutro, gdy przygrzeje słońce, zostaniecie wybawieni. Posłańcy wrócili więc i oznajmili to mieszkańcom Jabesz, a oni ucieszyli się."
  tags: []
"1Sm11,10":
  text: "Wtedy mieszkańcy Jabesz powiedzieli: Jutro wyjdziemy do was i uczynicie z nami wszystko, co się wam podoba."
  tags: []
"1Sm11,11":
  text: "Nazajutrz Saul podzielił lud na trzy oddziały. One wtargnęły do środka obozu podczas straży porannej i biły Ammonitów aż do dziennej spiekoty. Ci, którzy pozostali, rozpierzchli się tak, że dwóch razem nie zostało."
  tags: []
"1Sm11,12":
  text: "Wtedy lud powiedział do Samuela: Kto to mówił: Czy Saul będzie królować nad nami? Wydajcie tych ludzi, abyśmy ich zabili."
  tags: []
"1Sm11,13":
  text: "I Saul odpowiedział: Nikt nie zostanie zabity w tym dniu, gdyż dzisiaj PAN dokonał wybawienia w Izraelu."
  tags: []
"1Sm11,14":
  text: "Potem Samuel odezwał się do ludu: Chodźcie, pójdziemy do Gilgal i tam odnowimy królestwo."
  tags: []
"1Sm11,15":
  text: "Cały lud wyruszył więc do Gilgal i tam ustanowili Saula królem przed PANEM w Gilgal. Tam też składali ofiary pojednawcze przed PANEM i bardzo się radowali, Saul i wszyscy Izraelici."
  tags: []
