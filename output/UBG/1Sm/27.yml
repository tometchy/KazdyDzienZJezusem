"1Sm27,1": "Dawid jednak powiedział sobie w sercu: Któregoś dnia zginę z ręki Saula. Nie ma dla mnie nic lepszego, niż bym uszedł szybko do ziemi Filistynów. Wtedy Saul będzie zrozpaczony szukaniem mnie po wszystkich granicach Izraela. I tak ujdę z jego rąk."
"1Sm27,2": "Powstał więc Dawid i wraz z sześciuset ludźmi, którzy byli z nim, poszedł do Akisza, syna Maoka, króla Gat."
"1Sm27,3": "I Dawid mieszkał u Akisza w Gat, on i jego ludzie, każdy ze swoją rodziną: Dawid i jego dwie żony, Achinoam Jizreelitka i Abigail, dawna żona Nabala, Karmelitka."
"1Sm27,4": "A gdy doniesiono Saulowi, że Dawid uciekł do Gat, przestał go szukać."
"1Sm27,5": "I Dawid powiedział do Akisza: Jeśli teraz znalazłem łaskę w twoich oczach, niech mi dadzą miejsce w jednym z miast tego kraju, abym tam mieszkał. Dlaczego bowiem twój sługa miałby mieszkać w mieście królewskim wraz z tobą?"
"1Sm27,6": "Akisz dał mu więc w tym dniu Siklag. Dlatego Siklag należy do królów Judy aż do dziś."
"1Sm27,7": "A okres, przez który Dawid przebywał w krainie Filistynów, wynosił rok i cztery miesiące."
"1Sm27,8": "Dawid i jego ludzie wyprawiali się i najeżdżali Geszurytów, Girzytów i Amalekitów. Ci bowiem od dawna mieszkali w tej ziemi leżącej przy wejściu do Szur aż do ziemi Egiptu."
"1Sm27,9": "I Dawid pustoszył tę ziemię, i nie pozostawiał przy życiu ani mężczyzny, ani kobiety. Zabierał zaś owce, woły, osły i wielbłądy, a także szaty, zawracał i przybywał do Akisza."
"1Sm27,10": "A gdy Akisz pytał: Gdzie byliście dzisiaj na wyprawie? Dawid odpowiadał: Na południu Judy, na południe od Jerachmeelitów i na południe od Kenitów."
"1Sm27,11": "Dawid nie zostawiał przy życiu ani mężczyzny, ani kobiety, aby ich nie przyprowadzić do Gat. Mówił: Aby nie skarżyli na nas i nie mówili: Tak uczynił Dawid i taki był jego zwyczaj przez wszystkie dni, kiedy mieszkał w ziemi Filistynów."
"1Sm27,12": "Akisz zaś wierzył Dawidowi i mówił: Został znienawidzony przez swój lud, Izrael. Pozostanie więc moim sługą na zawsze."
