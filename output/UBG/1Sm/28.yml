"1Sm28,1": "W tym czasie Filistyni zgromadzili swe wojska na wojnę, aby walczyć z Izraelem. Wtedy Akisz powiedział do Dawida: Na pewno wiesz, że razem ze mną wyruszysz na wojnę, ty i twoi ludzie."
"1Sm28,2": "Dawid odpowiedział Akiszowi: Sam się przekonasz, co uczyni twój sługa. Akisz powiedział do Dawida: Ustanowię więc ciebie stróżem swojej głowy na zawsze."
"1Sm28,3": "A Samuel już umarł i opłakiwał go cały Izrael, i pogrzebali go w jego mieście, Rama. Saul zaś usunął czarowników i wróżbitów z ziemi."
"1Sm28,4": "Wtedy Filistyni zebrali się, nadciągnęli i rozbili obóz w Szunem. Saul również zgromadził cały Izrael i rozbił obóz w Gilboa."
"1Sm28,5": "A gdy Saul zobaczył obóz Filistynów, zląkł się i jego serce mocno zadrżało."
"1Sm28,6": "I Saul radził się PANA, lecz PAN mu nie odpowiedział ani przez sny, ani przez Urim, ani przez proroków."
"1Sm28,7": "Saul zwrócił się więc do swoich sług: Poszukajcie mi kobiety czarownicy, a pójdę do niej i poradzę się jej. Jego słudzy odpowiedzieli mu: Oto jest w Endor kobieta czarownica."
"1Sm28,8": "Wtedy Saul przebrał się, wkładając inne szaty, poszedł wraz z dwoma mężczyznami i przyszli do tej kobiety w nocy. I powiedział: Proszę cię, powróż mi przez ducha wieszczego, a wywołaj mi tego, kogo ci wymienię."
"1Sm28,9": "Lecz kobieta odpowiedziała mu: Ty wiesz, co uczynił Saul – że zgładził czarowników i wróżbitów z ziemi. Czemu zastawiasz sidła na moje życie, by wydać mnie na śmierć?"
"1Sm28,10": "Saul przysiągł jej na PANA: Jak żyje PAN, nie spadnie na ciebie żadna kara z tego powodu."
"1Sm28,11": "Wtedy kobieta zapytała: Kogo mam ci wywołać? A on odpowiedział: Wywołaj mi Samuela."
"1Sm28,12": "A gdy kobieta zobaczyła Samuela, krzyknęła głośno i powiedziała do Saula: Czemu mnie oszukałeś? Przecież ty jesteś Saul!"
"1Sm28,13": "Król powiedział do niej: Nie bój się. Cóż widziałaś? Kobieta odpowiedziała Saulowi: Widziałam bogów wstępujących z ziemi."
"1Sm28,14": "Pytał dalej: Jak wyglądał? Odpowiedziała: Wstępuje stary mężczyzna, a jest on ubrany w płaszcz. I Saul poznał, że to Samuel, schylił się twarzą do ziemi i pokłonił."
"1Sm28,15": "Samuel zaś powiedział do Saula: Dlaczego nie dajesz mi spokoju i wywołujesz mnie? Saul odpowiedział: Jestem w wielkim ucisku, gdyż Filistyni walczą ze mną, a Bóg odstąpił ode mnie i już nie odpowiada mi ani przez proroków, ani przez sny. Dlatego cię przyzwałem, abyś mi oznajmił, co mam czynić."
"1Sm28,16": "Samuel powiedział: Czemu więc mnie pytasz, skoro PAN odstąpił od ciebie i stał się twoim wrogiem?"
"1Sm28,17": "I PAN uczynił mu, jak zapowiedział przeze mnie: PAN wyrwał królestwo z twoich rąk i dał je twemu bliźniemu – Dawidowi."
"1Sm28,18": "Ponieważ nie byłeś posłuszny głosowi PANA ani nie wykonałeś jego srogiego gniewu nad Amalekiem, PAN tak ci dzisiaj uczynił."
"1Sm28,19": "Ponadto PAN wyda Izraela wraz z tobą w ręce Filistynów, a jutro ty i twoi synowie będziecie ze mną. PAN wyda również wojsko Izraela w ręce Filistynów."
"1Sm28,20": "Saul natychmiast upadł jak długi na ziemię, bo bardzo się zląkł słów Samuela. Nie było w nim też siły, gdyż nic nie jadł przez cały dzień i całą noc."
"1Sm28,21": "Potem kobieta podeszła do Saula, a widząc, że bardzo się zląkł, powiedziała mu: Oto twoja służąca posłuchała twego głosu, naraziłam swoje życie i posłuchałam twoich słów, które mówiłeś do mnie."
"1Sm28,22": "Teraz więc posłuchaj i ty, proszę, głosu swojej służącej. Położę przed tobą kawałek chleba, abyś zjadł i posilił się, zanim wyruszysz w drogę."
"1Sm28,23": "Lecz on wzbraniał się i mówił: Nie będę jadł. Jego słudzy zaś wraz z kobietą przymusili go. I posłuchał ich głosu, wstał z ziemi i usiadł na łóżku."
"1Sm28,24": "A ta kobieta miała w domu tuczne cielę. Pośpieszyła więc i zabiła je, potem wzięła mąkę, rozczyniła ją i upiekła z niej przaśniki."
"1Sm28,25": "Następnie przyniosła to przed Saula i przed jego sługi, a gdy zjedli, powstali i poszli tej samej nocy."
