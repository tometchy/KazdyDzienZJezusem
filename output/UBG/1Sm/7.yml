"1Sm7,1": "Przyszli więc ludzie z Kiriat-Jearim, zabrali arkę PANA i wnieśli ją do domu Abinadaba na wzgórzu. Eleazara zaś, jego syna, poświęcili, aby strzegł arki PANA."
"1Sm7,2": "A od dnia przybycia arki do Kiriat-Jearim upłynęło dużo czasu, to jest dwadzieścia lat, a cały dom Izraela płakał za PANEM."
"1Sm7,3": "I Samuel powiedział do całego domu Izraela: Jeśli z całego swego serca nawrócicie się do PANA, wyrzućcie spośród siebie obcych bogów oraz Asztarty i przygotujcie swoje serce PANU, i służcie tylko jemu. Wtedy wybawi was z ręki Filistynów."
"1Sm7,4": "Synowie Izraela usunęli więc Baalów i Asztarty i służyli tylko PANU."
"1Sm7,5": "Wtedy Samuel powiedział: Zgromadźcie całego Izraela w Mispie, a ja będę modlił się za wami do PANA."
"1Sm7,6": "Zgromadzili się więc w Mispie i czerpali wodę, którą wylewali przed PANEM. Pościli tam tego dnia i mówili: Zgrzeszyliśmy przeciw PANU. A Samuel sądził synów Izraela w Mispie."
"1Sm7,7": "A gdy Filistyni usłyszeli, że synowie Izraela zgromadzili się w Mispie, wyruszyli książęta filistyńscy przeciw Izraelowi. Kiedy usłyszeli o tym synowie Izraela, zlękli się Filistynów."
"1Sm7,8": "I synowie Izraela powiedzieli do Samuela: Nie przestawaj wołać za nami do PANA, naszego Boga, aby nas wybawił z ręki Filistynów."
"1Sm7,9": "Samuel wziął więc jedno jagnię ssące i złożył je PANU w ofierze całopalnej. I Samuel wołał do PANA za Izraelem, a PAN go wysłuchał."
"1Sm7,10": "A kiedy Samuel składał całopalenie, Filistyni nadciągnęli, aby walczyć z Izraelem. Lecz w tym dniu PAN zagrzmiał wielkim grzmotem nad Filistynami i rozproszył ich tak, że zostali pobici przed Izraelem."
"1Sm7,11": "A Izraelici wyruszyli z Mispy, gonili Filistynów i bili ich aż pod Bet-Kar."
"1Sm7,12": "Wtedy Samuel wziął kamień, ustawił go między Mispą a Szen i nazwał go Ebenezer, mówiąc: Aż dotąd pomagał nam PAN."
"1Sm7,13": "Tak zostali upokorzeni Filistyni i już nie przekraczali granic Izraela, a ręka PANA była przeciwko Filistynom po wszystkie dni Samuela."
"1Sm7,14": "Izraelowi zostały przywrócone miasta, które Filistyni zabrali Izraelowi, od Ekronu aż do Gat, a ich granice wyzwolił Izrael z ręki Filistynów. I pokój panował między Izraelem a Amorytami."
"1Sm7,15": "A Samuel sądził Izraela po wszystkie dni swego życia."
"1Sm7,16": "Co roku chodził też i obchodził Betel, Gilgal i Mispę i sądził Izraela we wszystkich tych miejscach."
"1Sm7,17": "Potem wracał do Rama, ponieważ tam był jego dom. Tam sądził Izraela i tam też zbudował ołtarz PANU."
