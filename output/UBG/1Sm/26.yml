"1Sm26,1": "Zifejczycy przyszli do Saula, do Gibea, i powiedzieli: Czy Dawid nie ukrywa się na wzgórzu Hakila, naprzeciwko Jeszimonu?"
"1Sm26,2": "Saul wyruszył więc i udał się na pustynię Zif, a razem z nim trzy tysiące doborowych mężczyzn spośród Izraela, aby szukać Dawida na pustyni Zif."
"1Sm26,3": "Saul rozbił obóz na wzgórzu Hakila, które leży naprzeciwko Jeszimonu, przy drodze. Dawid zaś przebywał na pustyni i dowiedział się, że Saul przybył za nim na pustynię."
"1Sm26,4": "Dawid wysłał więc zwiadowców i przekonał się, że Saul rzeczywiście przybył."
"1Sm26,5": "Wtedy Dawid wstał i przybył na miejsce, gdzie Saul rozbił obóz. I Dawid spostrzegł miejsce, gdzie leżeli Saul i Abner, syn Nera, dowódca jego wojska. Saul bowiem spał w środku obozu, a ludzie leżeli wokół niego."
"1Sm26,6": "I Dawid odezwał się do Achimeleka Chetyty i do Abiszaja, syna Serui, brata Joaba: Kto pójdzie ze mną do Saula do obozu? Abiszaj odpowiedział: Ja pójdę z tobą."
"1Sm26,7": "Przyszli więc Dawid i Abiszaj w nocy do tych ludzi. I oto Saul, leżąc, spał w środku obozu, a jego włócznia była wbita w ziemię przy jego głowie. Abner zaś i ludzie leżeli dokoła niego."
"1Sm26,8": "Wtedy Abiszaj powiedział do Dawida: Dziś Bóg wydał twego wroga w twoje ręce. Pozwól mi więc teraz go przybić włócznią do ziemi jeden raz, drugiego nie będzie trzeba."
"1Sm26,9": "Ale Dawid odpowiedział Abiszajowi: Nie zabijaj go, bo któż może wyciągnąć rękę na pomazańca PANA i pozostać niewinny?"
"1Sm26,10": "Dawid dodał: Jak żyje PAN, sam PAN go zabije albo nadejdzie jego dzień i umrze, albo wyruszy na wojnę i zginie."
"1Sm26,11": "Nie daj Boże, abym miał wyciągnąć swoją rękę na pomazańca PANA. Tylko weź, proszę, włócznię, która jest przy jego głowie, oraz dzban na wodę i odejdźmy."
"1Sm26,12": "Dawid wziął więc włócznię i dzban na wodę, które leżały przy głowie Saula, i odeszli. Nikt tego nie widział ani nie zauważył, ani się nie obudził, bo wszyscy spali. Spadł na nich bowiem twardy sen od PANA."
"1Sm26,13": "Potem Dawid przeszedł na drugą stronę i stanął na szczycie góry daleko od obozu, tak że odległość między nimi była wielka."
"1Sm26,14": "Wtedy Dawid zawołał do ludzi i do Abnera, syna Nera: Czy nie odezwiesz się, Abnerze? Abner odpowiedział: Któż ty jesteś, który wołasz do króla?"
"1Sm26,15": "Dawid odpowiedział Abnerowi: Czy ty nie jesteś dzielnym mężczyzną? A któż w Izraelu jest jak ty? Dlaczego więc nie strzegłeś króla, swego pana? Przyszedł bowiem jeden z ludu, aby zabić króla, twego pana."
"1Sm26,16": "Nie jest dobre to, co uczyniłeś. Jak żyje PAN, zasługujecie na śmierć, bo nie strzegliście swojego pana, pomazańca PANA. A teraz patrz, gdzie jest włócznia króla i dzban na wodę, które były przy jego głowie."
"1Sm26,17": "Wtedy Saul rozpoznał głos Dawida i zawołał: Czy to twój głos, mój synu, Dawidzie? Dawid odpowiedział: To mój głos, mój panie, królu."
"1Sm26,18": "I dodał: Dlaczego mój pan ściga swego sługę? Cóż bowiem uczyniłem? A jakież zło znajduje się w moich rękach?"
"1Sm26,19": "Teraz więc, proszę, niech mój pan, król, posłucha słów swego sługi. Jeśli PAN pobudził cię przeciwko mnie, niech przyjmie ofiary. Lecz jeśli synowie ludzcy, to niech będą przeklęci przed PANEM, gdyż wypędzają mnie dziś, abym nie mieszkał w dziedzictwie PANA, mówiąc: Idź, służ obcym bogom."
"1Sm26,20": "A teraz niech moja krew nie zostanie wylana na ziemię przed obliczem PANA. Wyszedł bowiem król Izraela, aby szukać jednej pchły, jak wtedy, gdy poluje się na kuropatwę w górach."
"1Sm26,21": "Wtedy Saul powiedział: Zgrzeszyłem. Wróć, mój synu, Dawidzie, bo nie uczynię ci już nic złego, ponieważ dziś moja dusza była cenna w twoich oczach. Oto głupio postąpiłem i wielce zbłądziłem."
"1Sm26,22": "Dawid odpowiedział: Oto włócznia króla. Niech przyjdzie jeden ze sług i ją odbierze."
"1Sm26,23": "I niech PAN wynagrodzi każdemu za jego sprawiedliwość i wierność. PAN bowiem wydał cię dziś w moje ręce, ale nie chciałem wyciągnąć swojej ręki na pomazańca PANA."
"1Sm26,24": "Oto jak poważane było dziś twoje życie w moich oczach, tak niech będzie poważane moje życie w oczach PANA i niech mnie PAN wybawi z wszelkiego ucisku."
"1Sm26,25": "Wtedy Saul powiedział do Dawida: Bądź błogosławiony ty, mój synu, Dawidzie. Wielu dzieł dokonasz i będziesz zwyciężał. Potem Dawid poszedł swoją drogą, a Saul wrócił na swoje miejsce."
