"1Sm18,1":
  text: "Kiedy przestał rozmawiać z Saulem, dusza Jonatana związała się z duszą Dawida i Jonatan umiłował go jak własną duszę."
  tags: []
"1Sm18,2":
  text: "I Saul wziął go tego dnia, i nie pozwolił mu wrócić do domu swego ojca."
  tags: []
"1Sm18,3":
  text: "A Jonatan zawarł z Dawidem przymierze, bo miłował go jak własną duszę."
  tags: []
"1Sm18,4":
  text: "Jonatan zdjął płaszcz, który miał na sobie, dał go Dawidowi, podobnie jak swoje szaty – aż do miecza, łuku i pasa."
  tags: []
"1Sm18,5":
  text: "I Dawid wyruszał, dokądkolwiek Saul go posyłał, i postępował roztropnie. Saul ustanowił go więc nad wojownikami, a on zyskał przychylność w oczach całego ludu, a także w oczach sług Saula."
  tags: []
"1Sm18,6":
  text: "A gdy wracali, a Dawid też wracał po zabiciu Filistyna, kobiety ze wszystkich miast Izraela wyszły na spotkanie królowi Saulowi ze śpiewem, pląsami i radością – z bębnami i gęślami."
  tags: []
"1Sm18,7":
  text: "Kobiety śpiewały na przemian, grały i mówiły: Saul pobił swoje tysiące, ale Dawid swoje dziesiątki tysięcy."
  tags: []
"1Sm18,8":
  text: "I Saul bardzo się rozgniewał, gdyż nie podobały mu się te słowa. Powiedział: Przyznali Dawidowi dziesiątki tysięcy, a mnie przyznali tylko tysiące. Czego mu brak? Tylko królestwa."
  tags: []
"1Sm18,9":
  text: "Od tego dnia Saul nieprzychylnie patrzył na Dawida."
  tags: []
"1Sm18,10":
  text: "Następnego dnia zły duch od Boga zstąpił na Saula i on prorokował pośrodku domu, a Dawid grał swą ręką melodię – jak przedtem. Saul zaś trzymał w ręku włócznię."
  tags: []
"1Sm18,11":
  text: "I Saul rzucił włócznię, bo myślał: Przybiję Dawida do ściany. Lecz Dawid dwukrotnie się przed nim uchylił."
  tags: []
"1Sm18,12":
  text: "I Saul zaczął bać się Dawida, ponieważ PAN był z nim, a od Saula odstąpił."
  tags: []
"1Sm18,13":
  text: "Saul oddalił go więc od siebie i uczynił go dowódcą nad tysiącem, a on wyruszał i powracał przed ludem."
  tags: []
"1Sm18,14":
  text: "We wszystkich swoich drogach Dawid postępował roztropnie, gdyż PAN był z nim."
  tags: []
"1Sm18,15":
  text: "Gdy Saul widział, że tak bardzo roztropnie postępuje, bał się go."
  tags: []
"1Sm18,16":
  text: "Lecz cały Izrael i Juda kochali Dawida, bo on wyruszał i powracał przed nimi."
  tags: []
"1Sm18,17":
  text: "I Saul powiedział do Dawida: Oto moja najstarsza córka Merab. Dam ci ją za żonę, tylko bądź dla mnie dzielnym mężem i prowadź wojny PANA. Saul bowiem mówił sobie tak: Niech moja ręka go nie dosięgnie, ale niech go dosięgnie ręka Filistynów."
  tags: []
"1Sm18,18":
  text: "Wtedy Dawid powiedział do Saula: Kim jestem i czym jest moje życie lub rodzina mojego ojca w Izraelu, żebym miał zostać zięciem króla?"
  tags: []
"1Sm18,19":
  text: "Gdy jednak przyszedł czas oddania Dawidowi córki Saula, Merab, oddano ją za żonę Adrielowi z Mecholi."
  tags: []
"1Sm18,20":
  text: "Ale Mikal, córka Saula, pokochała Dawida. Gdy więc doniesiono o tym Saulowi, spodobało mu się to."
  tags: []
"1Sm18,21":
  text: "I Saul powiedział: Dam mu ją, aby była dla niego sidłem i aby ręka Filistynów była na nim. Powiedział więc Saul do Dawida: Zostaniesz dzisiaj moim zięciem z moją drugą córką."
  tags: []
"1Sm18,22":
  text: "Wtedy Saul nakazał swoim sługom: Powiedzcie do Dawida w tajemnicy: Oto król ma w tobie upodobanie i wszyscy jego słudzy kochają cię. Zostań więc teraz zięciem króla."
  tags: []
"1Sm18,23":
  text: "Słudzy Saula powtórzyli te słowa do uszu Dawida, a Dawid odpowiedział: Czy wam się wydaje, że to błaha rzecz być zięciem króla? Jestem przecież człowiekiem ubogim i mało znaczącym."
  tags: []
"1Sm18,24":
  text: "Wtedy słudzy Saula oznajmili mu: Tak powiedział Dawid."
  tags: []
"1Sm18,25":
  text: "Saul odpowiedział: Tak powiedzcie Dawidowi: Król nie chce innego wiana jak tylko sto napletków filistyńskich, aby się zemścić na swoich wrogach. Saul planował bowiem, że Dawid wpadnie w ręce Filistynów."
  tags: []
"1Sm18,26":
  text: "Gdy jego słudzy powtórzyli te słowa Dawidowi, spodobało się to Dawidowi, że ma zostać zięciem króla. A te dni jeszcze się nie wypełniły."
  tags: []
"1Sm18,27":
  text: "Wstał więc Dawid i poszedł, on i jego ludzie, i zabił spośród Filistynów dwustu mężczyzn. Potem Dawid przyniósł ich napletki i oddał je w pełnej liczbie królowi, aby zostać zięciem króla. I Saul dał mu swą córkę Mikal za żonę."
  tags: []
"1Sm18,28":
  text: "A gdy Saul zobaczył i przekonał się, że PAN jest z Dawidem i że jego córka Mikal go kocha;"
  tags: []
"1Sm18,29":
  text: "Tym bardziej Saul obawiał się Dawida. I Saul stał się wrogiem Dawida na zawsze."
  tags: []
"1Sm18,30":
  text: "A książęta Filistynów robili wypady. A przy każdym ich wypadzie Dawid postępował roztropniej niż wszyscy słudzy Saula, tak że jego imię stało się bardzo sławne."
  tags: []
