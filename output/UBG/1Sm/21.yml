"1Sm21,1":
  text: "Potem Dawid przyszedł do Nob, do kapłana Achimeleka. Achimelek wyszedł przestraszony naprzeciw Dawida i zapytał go: Dlaczego jesteś sam i nie ma z tobą nikogo?"
  tags: []
"1Sm21,2":
  text: "Dawid odpowiedział kapłanowi Achimelekowi: Król zlecił mi pewną sprawę, nakazując: Niech nikt nie wie o tej sprawie, z którą cię wysyłam i którą ci zleciłem. Z tego powodu umówiłem się ze swoimi sługami w pewnym miejscu."
  tags: []
"1Sm21,3":
  text: "Teraz więc, co masz pod ręką? Daj mi do ręki pięć chlebów lub cokolwiek się znajdzie."
  tags: []
"1Sm21,4":
  text: "Kapłan odpowiedział Dawidowi: Nie mam pod ręką zwykłego chleba, tylko chleb poświęcony. Dam ci go, ale pod warunkiem, że słudzy wstrzymali się od kobiet."
  tags: []
"1Sm21,5":
  text: "Dawid odpowiedział kapłanowi: Na pewno kobiety były oddalone od nas przez trzy dni, odkąd wyruszyłem. Naczynia młodzieńców są więc święte. A chleb jest w pewien sposób zwykły, chociaż został dziś poświęcony w naczyniu."
  tags: []
"1Sm21,6":
  text: "Kapłan dał mu więc poświęcony chleb, gdyż nie było tam innego chleba oprócz chleba pokładnego, który zabrano sprzed oblicza PANA, aby w dniu jego usunięcia położyć świeży chleb."
  tags: []
"1Sm21,7":
  text: "W tym dniu był tam pewien człowiek spośród sług Saula, zatrzymany przed PANEM. Miał na imię Doeg, był to Edomita, przełożony nad pasterzami Saula."
  tags: []
"1Sm21,8":
  text: "I Dawid zapytał Achimeleka: Czy nie masz tu pod ręką włóczni albo miecza? Bo nie wziąłem ze sobą ani swego miecza, ani żadnej swojej broni, gdyż sprawa króla była pilna."
  tags: []
"1Sm21,9":
  text: "Kapłan odpowiedział: Miecz Goliata, Filistyna, którego zabiłeś w dolinie Ela, jest zawinięty w szatę za efodem. Jeśli chcesz go sobie wziąć, weź. Nie ma tu bowiem innego oprócz tego. Dawid odpowiedział: Nie ma od niego lepszego. Daj mi go."
  tags: []
"1Sm21,10":
  text: "Dawid wstał więc i uciekł tego dnia przed Saulem, i przybył do Akisza, króla Gat."
  tags: []
"1Sm21,11":
  text: "A słudzy Akisza mówili do niego: Czy to nie jest Dawid, król ziemi? Czy nie o nim śpiewano wśród pląsów: Saul pobił swoje tysiące, a Dawid swoje dziesiątki tysięcy?"
  tags: []
"1Sm21,12":
  text: "I Dawid wziął sobie te słowa do serca, i bardzo się bał Akisza, króla Gat."
  tags: []
"1Sm21,13":
  text: "Zmienił więc przed nimi swoje zachowanie i udawał szalonego w ich rękach, bazgrał na wrotach bramy i pozwalał, aby ślina spływała mu po brodzie."
  tags: []
"1Sm21,14":
  text: "Wtedy Akisz powiedział do swoich sług: Oto widzicie człowieka szalonego. Dlaczego przyprowadziliście go do mnie?"
  tags: []
"1Sm21,15":
  text: "Czy brakuje mi szaleńców, że przyprowadziliście tego, aby szalał przede mną? Czy on ma wejść do mego domu?"
  tags: []
