"1Sm20,1":
  text: "Tymczasem Dawid uciekł z Najot w Rama, przyszedł do Jonatana i mówił przed nim: Cóż uczyniłem? Jaka jest moja nieprawość? Jaki jest mój grzech wobec twego ojca, że czyha na moje życie?"
  tags: []
"1Sm20,2":
  text: "Odpowiedział mu: Nie daj Boże! Nie umrzesz. Oto mój ojciec nie czyni niczego wielkiego ani małego, zanim mnie o tym nie powiadomi. Czyż mój ojciec miałby to przede mną ukrywać? Nie uczyni tego."
  tags: []
"1Sm20,3":
  text: "Lecz Dawid przysiągł: Na pewno twój ojciec wie, że znalazłem łaskę w twoich oczach i myśli: Niech o tym nie wie Jonatan, żeby się nie martwił. Zaprawdę jednak, jak żyje PAN i jak żyje twoja dusza, tylko jeden krok dzieli mnie od śmierci."
  tags: []
"1Sm20,4":
  text: "Jonatan odpowiedział Dawidowi: Czegokolwiek twoja dusza pragnie, uczynię to dla ciebie."
  tags: []
"1Sm20,5":
  text: "Wtedy Dawid powiedział do Jonatana: Oto jutro jest nów księżyca, a ja zwykle zasiadam z królem przy stole. Pozwól mi odejść i ukryć się w polu aż do wieczora trzeciego dnia."
  tags: []
"1Sm20,6":
  text: "Jeśli twój ojciec będzie o mnie wypytywał, odpowiesz: Dawid bardzo mnie prosił, aby mógł pobiec do swego miasta, Betlejem, gdyż tam cała rodzina składa doroczną ofiarę."
  tags: []
"1Sm20,7":
  text: "Jeśli odpowie: Dobrze – będzie to oznaczać pokój dla twego sługi. Lecz jeśli się rozgniewa, wiedz, że postanowił coś złego."
  tags: []
"1Sm20,8":
  text: "Okaż więc miłosierdzie swemu słudze, gdyż doprowadziłeś swego sługę do przymierza PANA z tobą. Jeśli jednak jest we mnie jakaś nieprawość, to ty mnie zabij. Po co masz mnie prowadzić do swego ojca?"
  tags: []
"1Sm20,9":
  text: "Jonatan odpowiedział: Nie daj Boże! Gdybym rzeczywiście wiedział, że mój ojciec postanowił coś złego względem ciebie, czyżbym cię o tym nie powiadomił?"
  tags: []
"1Sm20,10":
  text: "I Dawid powiedział do Jonatana: Któż mnie powiadomi, jeśli twój ojciec da ci surową odpowiedź?"
  tags: []
"1Sm20,11":
  text: "Jonatan odpowiedział Dawidowi: Chodź, wyjdźmy na pole. I obaj wyszli na pole."
  tags: []
"1Sm20,12":
  text: "Wtedy Jonatan powiedział do Dawida: Niech PAN, Bóg Izraela – gdy jutro o tej porze lub pojutrze wybadam swego ojca, i jeśli to będzie coś dobrego o Dawidzie, a nie poślę do ciebie ani nie powiadomię cię o tym;"
  tags: []
"1Sm20,13":
  text: "To niech PAN odpłaci Jonatanowi i do tego dorzuci. Lecz jeśli mój ojciec będzie chciał wyrządzić ci zło, to powiadomię cię o tym i odprawię cię, abyś mógł odejść w pokoju. A niech PAN będzie z tobą, jak był z moim ojcem."
  tags: []
"1Sm20,14":
  text: "I jeśli będę żył, okaż mi miłosierdzie PANA, ale choćbym i umarł;"
  tags: []
"1Sm20,15":
  text: "Nie odbieraj swego miłosierdzia memu domowi na wieki, nawet gdy PAN wytraci wszystkich wrogów Dawida z powierzchni ziemi."
  tags: []
"1Sm20,16":
  text: "Jonatan zawarł więc przymierze z domem Dawida, mówiąc: Niech PAN szuka tego z ręki wrogów Dawida."
  tags: []
"1Sm20,17":
  text: "Jonatan ponownie przysiągł Dawidowi, gdyż go miłował. Miłował go bowiem, jak miłował własną duszę."
  tags: []
"1Sm20,18":
  text: "Wtedy Jonatan powiedział do niego: Jutro jest nów. Zauważą, że ciebie nie ma, ponieważ twoje miejsce będzie puste."
  tags: []
"1Sm20,19":
  text: "Po trzech dniach w ukryciu udasz się szybko na miejsce, gdzie ukrywałeś się, gdy omawialiśmy sprawę, i zatrzymasz się przy kamieniu Ezel."
  tags: []
"1Sm20,20":
  text: "A ja wypuszczę trzy strzały obok niego, jak gdyby do celu."
  tags: []
"1Sm20,21":
  text: "A potem poślę chłopca, mówiąc mu: Idź, znajdź strzały. Jeśli powiem chłopcu: Oto strzały znajdują się za tobą, bliżej, przynieś je – wtedy przyjdź, gdyż będzie to oznaczać dla ciebie pokój i nie stanie ci się nic złego, jak żyje PAN."
  tags: []
"1Sm20,22":
  text: "Jeśli zaś powiem chłopcu: Oto strzały znajdują się przed tobą, tam dalej – to idź, bo PAN cię wypuścił."
  tags: []
"1Sm20,23":
  text: "A co do sprawy, o której rozmawialiśmy, PAN będzie świadkiem między mną a tobą na wieki."
  tags: []
"1Sm20,24":
  text: "Dawid ukrył się więc w polu. A gdy nastał nów, król zasiadł do stołu, aby się posilić."
  tags: []
"1Sm20,25":
  text: "A gdy król zasiadł na swoim miejscu jak zazwyczaj, na miejscu przy ścianie, Jonatan powstał. Abner siedział obok Saula, miejsce zaś Dawida było puste."
  tags: []
"1Sm20,26":
  text: "Saul jednak nie powiedział nic tego dnia, bo myślał: Coś mu się przydarzyło i jest nieczysty, a nie oczyścił się."
  tags: []
"1Sm20,27":
  text: "A gdy następnego dnia, drugiego po nowiu, miejsce Dawida pozostało puste, Saul zapytał swego syna Jonatana: Dlaczego syn Jessego nie przyszedł na posiłek ani wczoraj, ani dziś?"
  tags: []
"1Sm20,28":
  text: "Jonatan odpowiedział Saulowi: Dawid usilnie mnie prosił, aby mógł pójść do Betlejem;"
  tags: []
"1Sm20,29":
  text: "Mówił: Pozwól mi pójść, proszę, bo nasza rodzina składa ofiarę w mieście i mój brat wezwał mnie tam. Teraz więc, jeśli znalazłem łaskę w twoich oczach, pozwól mi iść i zobaczyć swoich braci. Dlatego nie przyszedł do stołu królewskiego."
  tags: []
"1Sm20,30":
  text: "Wtedy Saul zapłonął gniewem na Jonatana i powiedział mu: Synu przewrotnej i upornej kobiety, czyż nie wiem, że wybrałeś sobie syna Jessego na własną hańbę i na hańbę nagości swojej matki?"
  tags: []
"1Sm20,31":
  text: "Jak długo bowiem syn Jessego będzie żył na ziemi, nie ostoisz się ty ani twoje królestwo. Teraz więc poślij po niego i przyprowadź go do mnie, bo musi umrzeć."
  tags: []
"1Sm20,32":
  text: "Wtedy Jonatan odpowiedział swemu ojcu Saulowi: Dlaczego ma umrzeć? Cóż uczynił?"
  tags: []
"1Sm20,33":
  text: "I Saul rzucił w niego włócznię, aby go przebić. Przez to Jonatan wiedział, że jego ojciec postanowił zabić Dawida."
  tags: []
"1Sm20,34":
  text: "Jonatan wstał więc od stołu w wielkim gniewie i nie jadł już posiłku w drugim dniu po nowiu. Martwił się bowiem o Dawida, bo jego ojciec tak go zelżył."
  tags: []
"1Sm20,35":
  text: "Rankiem Jonatan wyszedł w pole o czasie umówionym z Dawidem, a był z nim mały chłopiec."
  tags: []
"1Sm20,36":
  text: "I powiedział do swego chłopca: Biegnij i poszukaj strzał, które wypuszczę. Gdy chłopiec biegł, on wypuścił strzałę, by padła dalej, przed nim."
  tags: []
"1Sm20,37":
  text: "A gdy chłopiec dotarł na miejsce, gdzie była strzała, którą Jonatan wypuścił, zawołał Jonatan za chłopcem i powiedział: Czyż strzała nie jest dalej od ciebie?"
  tags: []
"1Sm20,38":
  text: "I Jonatan wołał za chłopcem: Szybko, pośpiesz się, nie stój! Chłopiec Jonatana zebrał strzały i przyszedł do swego pana."
  tags: []
"1Sm20,39":
  text: "Lecz chłopiec nic nie wiedział, tylko Jonatan i Dawid znali sprawę."
  tags: []
"1Sm20,40":
  text: "I Jonatan oddał swój oręż swemu chłopcu, i powiedział mu: Idź, odnieś to do miasta."
  tags: []
"1Sm20,41":
  text: "A gdy chłopiec odszedł, Dawid wstał z miejsca, od strony południowej, upadł twarzą na ziemię i ukłonił się trzy razy. Potem pocałowali się wzajemnie i razem płakali, a Dawid obficiej."
  tags: []
"1Sm20,42":
  text: "I Jonatan powiedział do Dawida: Idź w pokoju. Obaj bowiem poprzysięgliśmy sobie w imię PANA, mówiąc: Niech PAN będzie między mną a tobą i między moim potomstwem a twoim potomstwem na wieki. Wstał więc i odszedł, a Jonatan wszedł do miasta."
  tags: []
