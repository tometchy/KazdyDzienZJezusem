"1Sm31,1":
  text: "Tymczasem Filistyni walczyli z Izraelem, a Izraelici uciekli przed Filistynami i polegli na górze Gilboa."
  tags: []
"1Sm31,2":
  text: "Wtedy Filistyni ścigali Saula i jego synów i zabili Jonatana, Abinadaba i Malkiszuę, synów Saula."
  tags: []
"1Sm31,3":
  text: "A gdy rozgorzała bitwa przeciwko Saulowi, łucznicy trafili na niego i został przez nich ciężko zraniony."
  tags: []
"1Sm31,4":
  text: "I Saul powiedział do swego giermka: Dobądź swój miecz i przebij mnie nim, aby nie przyszli ci nieobrzezani i nie przebili mnie, i nie znęcali się nade mną. Ale jego giermek nie chciał, ponieważ bardzo się bał. Saul wziął więc miecz i sam rzucił się na niego."
  tags: []
"1Sm31,5":
  text: "A gdy jego giermek zobaczył, że Saul umarł, rzucił się i on na swój miecz i umarł razem z nim."
  tags: []
"1Sm31,6":
  text: "Tego dnia umarli więc razem Saul, jego trzej synowie, jego giermek oraz wszyscy jego ludzie."
  tags: []
"1Sm31,7":
  text: "A gdy Izraelici, którzy mieszkali po tamtej stronie doliny i którzy mieszkali za Jordanem, zobaczyli, że Izraelici uciekali i że Saul i jego synowie umarli, opuścili miasta i uciekli. Przyszli więc Filistyni i mieszkali w nich."
  tags: []
"1Sm31,8":
  text: "Kiedy nazajutrz Filistyni przyszli, aby złupić zabitych, znaleźli Saula i jego trzech synów leżących na górze Gilboa."
  tags: []
"1Sm31,9":
  text: "Odcięli mu głowę, zdarli z niego zbroję i posłali po całej ziemi filistyńskiej, aby obwieścić o tym w świątyni swoich bożków i wśród ludu."
  tags: []
"1Sm31,10":
  text: "Jego zbroję położyli w świątyni Asztarty, a jego ciało przybili do muru Bet-Szean."
  tags: []
"1Sm31,11":
  text: "Kiedy mieszkańcy Jabesz-Gilead usłyszeli o tym, co Filistyni uczynili Saulowi;"
  tags: []
"1Sm31,12":
  text: "Powstali wszyscy dzielni mężczyźni i szli przez całą noc, i zdjęli ciało Saula oraz ciała jego synów z muru Bet-Szean, po czym wrócili do Jabesz i tam je spalili."
  tags: []
"1Sm31,13":
  text: "Wzięli potem ich kości i pogrzebali je pod drzewem w Jabesz. I pościli przez siedem dni."
  tags: []
