"1Sm15,1":
  text: "Potem Samuel powiedział do Saula: PAN zesłał mnie, abym cię namaścił na króla nad jego ludem, nad Izraelem. Teraz więc posłuchaj głosu słów PANA."
  tags: []
"1Sm15,2":
  text: "Tak mówi PAN zastępów: Wspomniałem na to, co Amalek uczynił Izraelowi, jak się na niego zasadził na drodze, gdy wychodził z Egiptu."
  tags: []
"1Sm15,3":
  text: "Teraz idź, pobij Amaleka i zniszcz wszystko, co ma. Nie lituj się nad nimi, lecz zabijaj i mężczyzn, i kobiety, dzieci i niemowlęta, woły i owce, wielbłądy i osły."
  tags: []
"1Sm15,4":
  text: "Saul zebrał więc lud i policzył go w Telaim: było dwieście tysięcy pieszych i dziesięć tysięcy mężczyzn z Judy."
  tags: []
"1Sm15,5":
  text: "Potem Saul przybył do miasta Amaleka i urządził zasadzkę w dolinie."
  tags: []
"1Sm15,6":
  text: "I Saul powiedział do Kenitów: Idźcie, odstąpcie od Amalekitów i wyjdźcie spośród nich, abym was nie wytracił wraz z nimi. Okazaliście bowiem życzliwość wszystkim synom Izraela, gdy wychodzili z Egiptu. I tak Kenici odstąpili od Amalekitów."
  tags: []
"1Sm15,7":
  text: "Wtedy Saul pobił Amalekitów od Chawila aż do wejścia do Szur, leżącego naprzeciw Egiptu."
  tags: []
"1Sm15,8":
  text: "Pochwycił żywcem Agaga, króla Amalekitów, a cały lud zgładził ostrzem miecza."
  tags: []
"1Sm15,9":
  text: "Lecz Saul i lud oszczędzili Agaga i to, co najlepsze z owiec, wołów, tłustych zwierząt, baranów, oraz wszystko, co było dobre i nie chcieli tego zniszczyć. Zniszczyli zaś wszystko, co było nikczemne i nędzne."
  tags: []
"1Sm15,10":
  text: "Wtedy doszło do Samuela słowo PANA:"
  tags: []
"1Sm15,11":
  text: "Żałuję, że ustanowiłem Saula królem. Odwrócił się bowiem ode mnie i nie wypełnił mego słowa. I Samuel bardzo się rozgniewał, i wołał do PANA przez całą noc."
  tags: []
"1Sm15,12":
  text: "A gdy Samuel wstał wcześnie rano, by spotkać się z Saulem, doniesiono Samuelowi: Saul przybył do Karmelu i tam właśnie postawił sobie pomnik, po czym zawrócił, poszedł i przybył do Gilgal."
  tags: []
"1Sm15,13":
  text: "A gdy Samuel przyszedł do Saula, Saul mu powiedział: Błogosławiony jesteś przez PANA. Wypełniłem słowo PANA."
  tags: []
"1Sm15,14":
  text: "Lecz Samuel powiedział: A co to za beczenie owiec w moich uszach i co to za ryk wołów, który słyszę?"
  tags: []
"1Sm15,15":
  text: "Saul odpowiedział: Przyprowadzili je od Amalekitów. Lud bowiem oszczędził to, co najlepsze z owiec i wołów, aby je ofiarować PANU, twemu Bogu. To zaś, co pozostało, wytępiliśmy."
  tags: []
"1Sm15,16":
  text: "Wtedy Samuel powiedział do Saula: Stój, a powiem ci, co PAN mówił do mnie tej nocy. Odpowiedział mu: Powiedz."
  tags: []
"1Sm15,17":
  text: "Samuel rzekł: Czyż to nie wtedy, gdy byłeś mały w swoich oczach, stałeś się głową pokoleń Izraela i PAN namaścił cię na króla nad Izraelem?"
  tags: []
"1Sm15,18":
  text: "Potem PAN posłał cię w drogę i powiedział: Idź, wytrać tych grzeszników, Amalekitów, i walcz z nimi, aż ich wytępisz."
  tags: []
"1Sm15,19":
  text: "Dlaczego więc nie posłuchałeś głosu PANA, lecz rzuciłeś się na łup i uczyniłeś to zło w oczach PANA?"
  tags: []
"1Sm15,20":
  text: "Wtedy Saul odpowiedział Samuelowi: Przecież posłuchałem głosu PANA. Poszedłem drogą, którą mnie posłał PAN, i przyprowadziłem Agaga, króla Amalekitów, a Amalekitów wytraciłem."
  tags: []
"1Sm15,21":
  text: "Lud natomiast wziął z łupu owce i woły, najlepsze z tego, co miało być zniszczone, aby je ofiarować PANU, twemu Bogu, w Gilgal."
  tags: []
"1Sm15,22":
  text: "Samuel odpowiedział: Czy PAN ma takie samo upodobanie w całopaleniach i ofiarach jak w posłuszeństwie głosowi PANA? Oto posłuszeństwo jest lepsze niż ofiara, lepiej jest słuchać, niż ofiarowywać tłuszcz baranów."
  tags: []
"1Sm15,23":
  text: "Bunt bowiem jest jak grzech czarów, a upór jest jak nieprawość i bałwochwalstwo. Ponieważ odrzuciłeś słowo PANA, on także odrzucił cię jako króla."
  tags: []
"1Sm15,24":
  text: "Wtedy Saul powiedział do Samuela: Zgrzeszyłem, ponieważ przekroczyłem rozkaz PANA i twoje słowa, gdyż bałem się ludu i posłuchałem jego głosu."
  tags: []
"1Sm15,25":
  text: "Teraz jednak przebacz mi, proszę, mój grzech i zawróć ze mną, abym oddał pokłon PANU."
  tags: []
"1Sm15,26":
  text: "Lecz Samuel odpowiedział Saulowi: Nie zawrócę z tobą, ponieważ odrzuciłeś słowo PANA, a PAN odrzucił ciebie, abyś nie był już królem nad Izraelem."
  tags: []
"1Sm15,27":
  text: "A gdy Samuel odwrócił się, aby odejść, Saul chwycił skraj jego płaszcza i ten rozdarł się."
  tags: []
"1Sm15,28":
  text: "Wtedy Samuel powiedział mu: PAN oddarł ci dziś królestwo Izraela i dał je twemu bliźniemu, lepszemu od ciebie."
  tags: []
"1Sm15,29":
  text: "Ponadto Mocarz Izraela nie kłamie i nie będzie żałować, gdyż nie jest człowiekiem, aby miał żałować."
  tags: []
"1Sm15,30":
  text: "A on odpowiedział: Zgrzeszyłem. Teraz jednak uszanuj mnie, proszę, wobec starszych mego ludu i wobec Izraela i zawróć ze mną, abym oddał pokłon PANU, twemu Bogu."
  tags: []
"1Sm15,31":
  text: "Zawrócił więc Samuel i szedł za Saulem, a Saul oddał pokłon PANU."
  tags: []
"1Sm15,32":
  text: "Potem Samuel rzekł: Przyprowadźcie do mnie Agaga, króla Amalekitów. Agag podszedł do niego odważnie i powiedział: Na pewno ustąpiła gorycz śmierci."
  tags: []
"1Sm15,33":
  text: "Lecz Samuel powiedział: Jak twój miecz pozbawiał kobiety ich dzieci, tak wśród kobiet twoja matka będzie pozbawiona dzieci. I Samuel posiekał Agaga na kawałki przed PANEM w Gilgal."
  tags: []
"1Sm15,34":
  text: "Potem Samuel udał się do Rama, a Saul poszedł do swego domu w Gibea Saulowym."
  tags: []
"1Sm15,35":
  text: "I Samuel nie zobaczył już Saula aż do dnia swojej śmierci. Bolał jednak Samuel nad Saulem, a PAN żałował, że uczynił Saula królem nad Izraelem."
  tags: []
