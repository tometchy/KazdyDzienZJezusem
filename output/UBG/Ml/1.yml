"Ml1,1":
  text: "Brzemię słowa PANA do Izraela przez Malachiasza."
  tags: []
"Ml1,2":
  text: "Umiłowałem was, mówi PAN, a wy mówicie: W czym nas umiłowałeś? Czy Ezaw nie był bratem Jakuba? – mówi PAN, a jednak umiłowałem Jakuba;"
  tags: []
"Ml1,3":
  text: "A Ezawa znienawidziłem i wydałem jego góry na spustoszenie, a jego dziedzictwo – smokom na pustkowiu."
  tags: []
"Ml1,4":
  text: "Choćby Edom powiedział: Staliśmy się ubodzy, ale wrócimy i odbudujemy spustoszone miejsca, to tak mówi PAN zastępów: Niech oni budują, a ja zburzę; i nazwą ich granicą bezbożności oraz ludem, na który PAN zapałał gniewem aż na wieki."
  tags: []
"Ml1,5":
  text: "Wasze oczy spojrzą i powiecie: PAN będzie uwielbiony w granicach Izraela."
  tags: []
"Ml1,6":
  text: "Syn czci ojca, a sługa swego pana. Jeśli więc jestem ojcem, gdzie jest moja cześć? Jeśli jestem panem, gdzie jest bojaźń przede mną? – mówi PAN zastępów do was, kapłani, którzy lekceważycie moje imię. Wy jednak mówicie: W czym lekceważymy twoje imię?"
  tags: []
"Ml1,7":
  text: "Przynosicie na mój ołtarz pokarm nieczysty i mówicie: Czym cię zanieczyściliśmy? Tym, że mówicie: Stołem PANA można wzgardzić."
  tags: []
"Ml1,8":
  text: "Gdy bowiem przyprowadzacie na ofiarę to, co jest ślepe, czyż nie jest to zła rzecz? I gdy przyprowadzacie kulawe i chore, czy to nie jest zła rzecz? Ofiaruj to twemu namiestnikowi, zobaczysz, czy będzie mu się podobać. Czy przyjmie twoją osobę? – mówi PAN zastępów."
  tags: []
"Ml1,9":
  text: "Dlatego teraz, proszę, przebłagajcie Boga, aby się zlitował nad nami. To się dzieje z waszych rąk, czy więc przyjmie waszą osobę? – mówi PAN zastępów."
  tags: []
"Ml1,10":
  text: "Kto spośród was za darmo zamknąłby drzwi albo zapaliłby ogień na moim ołtarzu? Nie mam w was upodobania, mówi PAN zastępów, i nie przyjmę ofiary z waszej ręki."
  tags: []
"Ml1,11":
  text: "Od wschodu słońca bowiem aż do jego zachodu moje imię będzie wielkie wśród pogan; na każdym miejscu będą składane mojemu imieniu kadzidło i ofiara czysta. Moje imię bowiem będzie wielkie wśród narodów, mówi PAN zastępów."
  tags: []
"Ml1,12":
  text: "Lecz wy bezcześcicie je, gdy mówicie: Stół PANA jest nieczysty; a to, co kładziecie na nim, jest wzgardzonym pokarmem."
  tags: []
"Ml1,13":
  text: "Mówicie też: Jakiż to wysiłek! I parskacie na to, co mówi PAN zastępów, i przynosicie to, co jest rozszarpane, kulawe i chore, takie ofiary przynosicie. Czy mam to przyjąć z waszej ręki? – mówi PAN."
  tags: []
"Ml1,14":
  text: "Niech będzie przeklęty oszust, który mając w swej trzodzie samca, ślubuje, a składa Panu w ofierze to, co jest ułomne. Jestem bowiem wielkim Królem, mówi PAN zastępów, a moje imię jest straszne między narodami."
  tags: []
