"Ml2,1":
  text: "Teraz, kapłani, ten rozkaz dotyczy was."
  tags: []
"Ml2,2":
  text: "Jeśli nie usłuchacie i nie weźmiecie tego do serca, aby oddać chwałę mojemu imieniu, mówi PAN zastępów, wtedy ześlę na was przekleństwo i będę przeklinać wasze błogosławieństwa. I już je przekląłem, bo nie bierzecie tego do serca."
  tags: []
"Ml2,3":
  text: "Oto wam zepsuję wasze siewy i rzucę wam gnojem w twarz, gnojem waszych ofiar. I zabiorą was razem z nim."
  tags: []
"Ml2,4":
  text: "I dowiecie się, że posłałem do was ten rozkaz, aby moje przymierze było z Lewim, mówi PAN zastępów."
  tags: []
"Ml2,5":
  text: "Moje przymierze z nim było przymierzem życia i pokoju; dałem mu je z powodu bojaźni, którą mnie się bał, i ponieważ przed moim imieniem był zatrwożony."
  tags: []
"Ml2,6":
  text: "Prawo prawdy było na jego ustach i nie znaleziono na jego wargach nieprawości. Chodził ze mną w pokoju i prawości i wielu odwrócił od nieprawości."
  tags: []
"Ml2,7":
  text: "Wargi kapłana bowiem mają strzec poznania i jego ustami ludzie mają pytać o prawo, gdyż on jest posłańcem PANA zastępów."
  tags: []
"Ml2,8":
  text: "Ale wy zboczyliście z drogi i byliście powodem potknięcia o prawo dla wielu, zepsuliście przymierze Lewiego, mówi PAN zastępów."
  tags: []
"Ml2,9":
  text: "Dlatego i ja sprawiłem, że zostaliście wzgardzeni i poniżeni u wszystkich ludzi, ponieważ nie strzegliście moich dróg i jesteście stronniczy w stosowaniu prawa."
  tags: []
"Ml2,10":
  text: "Czy nie mamy wszyscy jednego ojca? Czy nie stworzył nas jeden Bóg? Czemu więc brat zdradza swego brata, naruszając przymierze naszych ojców?"
  tags: []
"Ml2,11":
  text: "Juda postępuje zdradliwie, obrzydliwość dzieje się w Izraelu i Jerozolimie. Juda bowiem zbezcześcił świętość PANA, którą miał kochać, i pojął za żonę córkę obcego boga."
  tags: []
"Ml2,12":
  text: "PAN wykorzeni z namiotów Jakuba tego człowieka, który to czyni, zarówno czuwającego, jak i odpowiadającego oraz składającego ofiarę PANU zastępów."
  tags: []
"Ml2,13":
  text: "A oto kolejna rzecz, którą uczyniliście: okrywacie ołtarz PANA łzami, płaczem i wołaniem, tak że już nie patrzy na ofiarę ani już nie przyjmuje chętnie ofiary z waszej ręki."
  tags: []
"Ml2,14":
  text: "Wy jednak mówicie: Dlaczego? Dlatego że PAN jest świadkiem między tobą a żoną twojej młodości, którą zdradziłeś. Ona przecież jest twoją towarzyszką i żoną twego przymierza."
  tags: []
"Ml2,15":
  text: "Czy nie uczynił jednej, choć mu jeszcze zostało ducha? A czemu jedną? Aby szukał potomstwa Bożego. Tak więc strzeżcie swego ducha i niech nikt nie postępuje zdradliwie z żoną swojej młodości."
  tags: []
"Ml2,16":
  text: "Mówi bowiem PAN, Bóg Izraela, że nienawidzi oddalania, gdyż ten, kto to robi, okrywa swoim płaszczem okrucieństwo, mówi PAN zastępów. Tak więc strzeżcie swego ducha i nie postępujcie zdradliwie."
  tags: []
"Ml2,17":
  text: "Naprzykrzaliście się PANU swoimi słowami. A mówicie: W czym mu się naprzykrzaliśmy? W tym, gdy mówicie: Każdy, kto czyni zło, podoba się PANU i w takich ma on swe upodobanie; albo: Gdzież jest Bóg sądu?"
  tags: []
