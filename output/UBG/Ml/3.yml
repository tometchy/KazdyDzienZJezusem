"Ml3,1":
  text: "Oto posyłam mego posłańca, który przygotuje drogę przed moim obliczem. I nagle przybędzie do swojej świątyni Pan, którego wy szukacie, Posłaniec przymierza, którego wy pragniecie. Oto przyjdzie, mówi PAN zastępów."
  tags: []
"Ml3,2":
  text: "Lecz któż będzie mógł znieść dzień jego przyjścia? I kto się ostanie, gdy on się ukaże? Jest bowiem jak ogień złotnika i jak mydło foluszników."
  tags: []
"Ml3,3":
  text: "I zasiądzie jako ten, kto roztapia i oczyszcza srebro: oczyści synów Lewiego, oczyści ich jak złoto i srebro i będą składać PANU ofiarę w sprawiedliwości."
  tags: []
"Ml3,4":
  text: "Wtedy ofiara Judy i Jerozolimy będzie miła PANU, jak za dawnych dni i jak za lat minionych."
  tags: []
"Ml3,5":
  text: "I zbliżę się do was na sąd, i będę rychłym świadkiem przeciwko czarownikom, przeciwko cudzołożnikom, przeciwko krzywoprzysięzcom, przeciwko tym, którzy uciskają najemników przy ich zapłatach oraz wdowy i sieroty i krzywdzą cudzoziemca, a nie boją się mnie, mówi PAN zastępów."
  tags: []
"Ml3,6":
  text: "Gdyż ja, PAN, nie zmieniam się, dlatego wy, synowie Jakuba, nie zostaliście zniszczeni."
  tags: []
"Ml3,7":
  text: "Od dni waszych ojców odstępowaliście od moich ustaw i nie przestrzegaliście ich. Zawróćcie do mnie, a ja zawrócę do was, mówi PAN zastępów. Ale wy mówicie: Pod jakim względem mamy zawrócić?"
  tags: []
"Ml3,8":
  text: "Czy człowiek okradnie Boga? Wy jednak mnie okradacie. Lecz mówicie: Z czego cię okradamy? Z dziesięcin i ofiar."
  tags: []
"Ml3,9":
  text: "Jesteście zupełnie przeklęci, ponieważ mnie okradacie, wy i cały wasz naród."
  tags: []
"Ml3,10":
  text: "Przynieście całą dziesięcinę do spichlerza, aby żywność była w moim domu, a doświadczcie mnie teraz w tym, mówi PAN zastępów, czy wam nie otworzę okien niebios i nie wyleję na was błogosławieństwa, tak że nie będziecie mieli gdzie go podziać;"
  tags: []
"Ml3,11":
  text: "I zgromię ze względu na was tego, który pożera, a nie popsuje wam plonu ziemi i winorośl nie będzie pozbawiona owocu na polu, mówi PAN zastępów."
  tags: []
"Ml3,12":
  text: "I wszystkie narody będą was nazywać błogosławionymi, bo będziecie ziemią rozkoszną, mówi PAN zastępów."
  tags: []
"Ml3,13":
  text: "Zuchwałe są wasze słowa przeciwko mnie, mówi PAN. Wy jednak mówicie: Cóż powiedzieliśmy przeciwko tobie?"
  tags: []
"Ml3,14":
  text: "Mówiliście: Na próżno służyć Bogu. Co za pożytek z tego, że przestrzegaliśmy jego przykazań i chodziliśmy smutni przed PANEM zastępów?"
  tags: []
"Ml3,15":
  text: "A teraz pysznych mamy za błogosławionych, ponieważ ci się budują, którzy czynią niegodziwość, a ci, którzy kuszą Boga, są wybawieni."
  tags: []
"Ml3,16":
  text: "Wtedy rozmawiali o tym między sobą ci, którzy się bali PANA. PAN zobaczył to i usłyszał, i napisano księgę wspomnień przed nim z powodu tych, którzy się boją PANA i rozmyślają o jego imieniu."
  tags: []
"Ml3,17":
  text: "Oni będą moimi, mówi PAN zastępów, w dniu, kiedy uczynię ich moją własnością. Zlituję się nad nimi, jak się lituje ojciec nad swoim synem, który mu służy."
  tags: []
"Ml3,18":
  text: "Wtedy zawrócicie i zobaczycie różnicę między sprawiedliwym i bezbożnym, między tym, który służy Bogu, i tym, który mu nie służy."
  tags: []
