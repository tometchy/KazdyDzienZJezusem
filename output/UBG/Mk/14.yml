"Mk14,1":
  text: "A po dwóch dniach była Pascha i święto Przaśników. I naczelni kapłani oraz uczeni w Piśmie szukali sposobu, jak by go podstępnie schwytać i zabić."
  tags: []
"Mk14,2":
  text: "Lecz mówili: Nie w święto, aby czasem nie wywołać rozruchów wśród ludu."
  tags: []
"Mk14,3":
  text: "A gdy był w Betanii, w domu Szymona Trędowatego, i siedział przy stole, przyszła kobieta, która miała alabastrowe naczynie pełne bardzo drogiego olejku nardowego. Rozbiła naczynie i wylała mu olejek na głowę."
  tags: []
"Mk14,4":
  text: "Niektórzy oburzyli się i mówili: Po co takie marnotrawstwo olejku?"
  tags: []
"Mk14,5":
  text: "Przecież można to było sprzedać drożej niż za trzysta groszy i rozdać je ubogim. I szemrali przeciwko niej."
  tags: []
"Mk14,6":
  text: "Lecz Jezus powiedział: Zostawcie ją! Dlaczego sprawiacie jej przykrość? Dobry uczynek spełniła wobec mnie."
  tags: []
"Mk14,7":
  text: "Ubogich bowiem zawsze macie u siebie i kiedy zechcecie, możecie im dobrze czynić. Mnie jednak nie zawsze będziecie mieć."
  tags: []
"Mk14,8":
  text: "Ona zrobiła, co mogła. Zawczasu namaściła moje ciało na pogrzeb."
  tags: []
"Mk14,9":
  text: "Zaprawdę powiadam wam: Gdziekolwiek po całym świecie będzie głoszona ta ewangelia, będzie się również opowiadać na jej pamiątkę to, co zrobiła."
  tags: []
"Mk14,10":
  text: "Wtedy Judasz Iskariota, jeden z dwunastu, poszedł do naczelnych kapłanów, aby im go wydać."
  tags: []
"Mk14,11":
  text: "A gdy oni to usłyszeli, ucieszyli się i obiecali dać mu pieniądze. I szukał sposobności, aby go wydać."
  tags: []
"Mk14,12":
  text: "W pierwszy dzień Przaśników, gdy zabijano baranka paschalnego, zapytali go jego uczniowie: Gdzie chcesz, abyśmy poszli i przygotowali ci Paschę do spożycia?"
  tags: []
"Mk14,13":
  text: "I posłał dwóch spośród swych uczniów, i powiedział im: Idźcie do miasta, a spotka się z wami człowiek niosący dzban wody. Idźcie za nim."
  tags: []
"Mk14,14":
  text: "Tam zaś, gdzie wejdzie, powiecie gospodarzowi: Nauczyciel pyta: Gdzie jest pokój, w którym będę jadł Paschę z moimi uczniami?"
  tags: []
"Mk14,15":
  text: "A on wam pokaże wielką salę na piętrze, urządzoną i przygotowaną. Tam dla nas wszystko przygotujcie."
  tags: []
"Mk14,16":
  text: "Odeszli więc jego uczniowie i przyszli do miasta, gdzie znaleźli wszystko tak, jak im powiedział, i przygotowali Paschę."
  tags: []
"Mk14,17":
  text: "A gdy nastał wieczór, przyszedł z dwunastoma."
  tags: []
"Mk14,18":
  text: "Kiedy siedzieli za stołem i jedli, Jezus powiedział: Zaprawdę powiadam wam, że jeden z was, jedzący ze mną, wyda mnie."
  tags: []
"Mk14,19":
  text: "Wtedy zaczęli się smucić i pytać jeden po drugim: Czy to ja? a inny: Czy ja?"
  tags: []
"Mk14,20":
  text: "Lecz on im odpowiedział: Jeden z dwunastu, ten, który ze mną macza w misie."
  tags: []
"Mk14,21":
  text: "Syn Człowieczy odchodzi, jak jest o nim napisane, ale biada temu człowiekowi, przez którego Syn Człowieczy będzie wydany! Lepiej byłoby dla tego człowieka, gdyby się nie urodził."
  tags: []
"Mk14,22":
  text: "A gdy jedli, Jezus wziął chleb, pobłogosławił, połamał i dał im, mówiąc: Bierzcie, jedzcie, to jest moje ciało."
  tags: []
"Mk14,23":
  text: "Potem wziął kielich, złożył dziękczynienie i dał im. I pili z niego wszyscy."
  tags: []
"Mk14,24":
  text: "I powiedział im: To jest moja krew nowego testamentu, która się za wielu wylewa."
  tags: []
"Mk14,25":
  text: "Zaprawdę powiadam wam: Nie będę więcej pił z owocu winorośli aż do tego dnia, gdy go będę pił nowy w królestwie Bożym."
  tags: []
"Mk14,26":
  text: "A gdy zaśpiewali hymn, wyszli ku Górze Oliwnej."
  tags: []
"Mk14,27":
  text: "Potem Jezus im powiedział: Wy wszyscy zgorszycie się z mojego powodu tej nocy, bo jest napisane: Uderzę pasterza, a rozproszą się owce."
  tags: []
"Mk14,28":
  text: "Lecz gdy zmartwychwstanę, udam się do Galilei przed wami."
  tags: []
"Mk14,29":
  text: "Ale Piotr mu powiedział: Jeśli nawet wszyscy się zgorszą, jednak nie ja."
  tags: []
"Mk14,30":
  text: "I powiedział mu Jezus: Zaprawdę powiadam ci, że dziś, tej nocy, zanim kogut dwa razy zapieje, trzy razy się mnie wyprzesz."
  tags: []
"Mk14,31":
  text: "Ale on tym bardziej zapewniał: Choćbym miał z tobą i umrzeć, nie wyprę się ciebie. Tak samo mówili wszyscy."
  tags: []
"Mk14,32":
  text: "I przyszli na miejsce zwane Getsemani. Wtedy powiedział do swoich uczniów: Siedźcie tu, ja tymczasem będę się modlił."
  tags: []
"Mk14,33":
  text: "Wziąwszy ze sobą Piotra, Jakuba i Jana, zaczął odczuwać lęk i udrękę."
  tags: []
"Mk14,34":
  text: "I powiedział do nich: Bardzo smutna jest moja dusza aż do śmierci. Zostańcie tu i czuwajcie."
  tags: []
"Mk14,35":
  text: "A odszedłszy trochę dalej, upadł na ziemię i modlił się, aby, jeśli to możliwe, ominęła go ta godzina."
  tags: []
"Mk14,36":
  text: "I powiedział: Abba, Ojcze, dla ciebie wszystko jest możliwe, zabierz ode mnie ten kielich. Jednak niech się stanie nie to, co ja chcę, ale to, co ty."
  tags: []
"Mk14,37":
  text: "Potem przyszedł i zastał ich śpiących. I powiedział do Piotra: Szymonie, śpisz? Nie mogłeś czuwać jednej godziny?"
  tags: []
"Mk14,38":
  text: "Czuwajcie i módlcie się, abyście nie ulegli pokusie. Duch wprawdzie jest ochoczy, ale ciało słabe."
  tags: []
"Mk14,39":
  text: "I odszedłszy znowu, modlił się tymi samymi słowami."
  tags: []
"Mk14,40":
  text: "A gdy wrócił, ponownie zastał ich śpiących, bo oczy same im się zamykały; i nie wiedzieli, co mu odpowiedzieć."
  tags: []
"Mk14,41":
  text: "I przyszedł po raz trzeci, i powiedział im: Śpijcie dalej i odpoczywajcie! Dosyć! Nadeszła godzina, oto Syn Człowieczy będzie wydany w ręce grzeszników."
  tags: []
"Mk14,42":
  text: "Wstańcie, chodźmy! Oto zbliża się ten, który mnie wydaje."
  tags: []
"Mk14,43":
  text: "I zaraz, gdy on jeszcze mówił, nadszedł Judasz, jeden z dwunastu, a z nim wielka zgraja z mieczami i kijami od naczelnych kapłanów, uczonych w Piśmie i starszych."
  tags: []
"Mk14,44":
  text: "A ten, który go zdradził, ustalił z nimi znak, mówiąc: Ten, którego pocałuję, to on, schwytajcie go i prowadźcie ostrożnie."
  tags: []
"Mk14,45":
  text: "Gdy tylko przyszedł, natychmiast zbliżył się do niego i powiedział: Mistrzu, Mistrzu! I pocałował go."
  tags: []
"Mk14,46":
  text: "Wtedy tamci rzucili się na niego i schwytali go."
  tags: []
"Mk14,47":
  text: "A jeden z tych, którzy tam stali, dobył miecz, uderzył sługę najwyższego kapłana i odciął mu ucho."
  tags: []
"Mk14,48":
  text: "Jezus zaś powiedział do nich: Wyszliście jak na bandytę z mieczami i kijami, aby mnie schwytać."
  tags: []
"Mk14,49":
  text: "Codziennie bywałem u was w świątyni, nauczając, a nie schwytaliście mnie. Ale Pisma muszą się wypełnić."
  tags: []
"Mk14,50":
  text: "Wtedy wszyscy opuścili go i uciekli."
  tags: []
"Mk14,51":
  text: "A szedł za nim pewien młody człowiek mający płótno narzucone na gołe ciało. I pochwycili go młodzieńcy."
  tags: []
"Mk14,52":
  text: "Ale on zostawił płótno i nago uciekł od nich."
  tags: []
"Mk14,53":
  text: "Wtedy przyprowadzili Jezusa do najwyższego kapłana, gdzie zeszli się wszyscy naczelni kapłani, starsi i uczeni w Piśmie."
  tags: []
"Mk14,54":
  text: "Piotr zaś szedł za nim z daleka aż do dziedzińca najwyższego kapłana i siedział ze sługami, grzejąc się przy ogniu."
  tags: []
"Mk14,55":
  text: "Tymczasem naczelni kapłani i cała Rada szukali świadectwa przeciwko Jezusowi, aby go skazać na śmierć, ale nie znaleźli."
  tags: []
"Mk14,56":
  text: "Wielu bowiem fałszywie świadczyło przeciwko niemu, lecz ich świadectwa nie były zgodne."
  tags: []
"Mk14,57":
  text: "Wtedy niektórzy wystąpili i fałszywie świadczyli przeciwko niemu, mówiąc:"
  tags: []
"Mk14,58":
  text: "Słyszeliśmy, jak mówił: Zburzę tę świątynię ręką uczynioną, a w trzy dni zbuduję inną, nie ręką uczynioną."
  tags: []
"Mk14,59":
  text: "Lecz i tak ich świadectwo nie było zgodne."
  tags: []
"Mk14,60":
  text: "Wtedy najwyższy kapłan, stanąwszy na środku, zapytał Jezusa: Nic nie odpowiadasz? Cóż to jest, co oni przeciwko tobie zeznają?"
  tags: []
"Mk14,61":
  text: "Ale on milczał i nic nie odpowiedział. Znowu zapytał go najwyższy kapłan: Czy ty jesteś Chrystusem, Synem Błogosławionego?"
  tags: []
"Mk14,62":
  text: "A Jezus odpowiedział: Ja jestem. I ujrzycie Syna Człowieczego siedzącego po prawicy mocy Boga i przychodzącego z obłokami nieba."
  tags: []
"Mk14,63":
  text: "Wtedy najwyższy kapłan rozdarł swoje szaty i powiedział: Czyż potrzebujemy jeszcze świadków?"
  tags: []
"Mk14,64":
  text: "Słyszeliście bluźnierstwo. Jak wam się zdaje? A oni wszyscy wydali wyrok, że zasługuje na śmierć."
  tags: []
"Mk14,65":
  text: "I niektórzy zaczęli pluć na niego, zakrywali mu twarz, bili go pięściami i mówili: Prorokuj! A słudzy go policzkowali."
  tags: []
"Mk14,66":
  text: "Kiedy Piotr był na dole, na dziedzińcu, przyszła jedna ze służących najwyższego kapłana."
  tags: []
"Mk14,67":
  text: "A gdy zobaczyła, że Piotr grzeje się przy ogniu, popatrzyła na niego i powiedziała: I ty byłeś z Jezusem z Nazaretu."
  tags: []
"Mk14,68":
  text: "Lecz on się wyparł, mówiąc: Nie wiem i nie rozumiem, o czym mówisz. I wyszedł na zewnątrz do przedsionka, a kogut zapiał."
  tags: []
"Mk14,69":
  text: "Wtedy służąca zobaczyła go znowu i zaczęła mówić do tych, którzy tam stali: To jest jeden z nich."
  tags: []
"Mk14,70":
  text: "A on ponownie się wyparł. I znowu, po chwili ci, którzy tam stali, powiedzieli do Piotra: Na pewno jesteś jednym z nich, bo jesteś Galilejczykiem i twoja mowa jest podobna."
  tags: []
"Mk14,71":
  text: "Lecz on zaczął się zaklinać i przysięgać: Nie znam tego człowieka, o którym mówicie."
  tags: []
"Mk14,72":
  text: "Wtedy kogut zapiał po raz drugi. I przypomniał sobie Piotr słowa, które powiedział mu Jezus: Zanim kogut dwa razy zapieje, trzy razy się mnie wyprzesz. I wyszedłszy, zapłakał."
  tags: []
