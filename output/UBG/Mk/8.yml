"Mk8,1": "A w tych dniach, gdy było z nim bardzo wielu ludzi i nie mieli co jeść, Jezus przywołał swoich uczniów i powiedział do nich:"
"Mk8,2": "Żal mi tych ludzi, bo już trzy dni przy mnie trwają, a nie mają co jeść."
"Mk8,3": "A jeśli odprawię ich głodnych do domów, zasłabną w drodze, bo niektórzy z nich przyszli z daleka."
"Mk8,4": "Wtedy jego uczniowie odpowiedzieli mu: Skąd tu na pustyni będzie ktoś mógł nakarmić ich chlebem?"
"Mk8,5": "I zapytał ich: Ile macie chlebów? A oni odpowiedzieli: Siedem."
"Mk8,6": "Wtedy nakazał ludziom usiąść na ziemi. I wziął te siedem chlebów, a podziękowawszy, łamał i dawał swoim uczniom, aby kładli przed nimi. I kładli przed ludźmi."
"Mk8,7": "Mieli też kilka rybek, które pobłogosławiwszy, również kazał kłaść przed ludźmi."
"Mk8,8": "Jedli więc do syta, a pozostałych kawałków zebrali siedem koszy."
"Mk8,9": "A tych, którzy jedli, było około czterech tysięcy. Potem ich odprawił."
"Mk8,10": "Zaraz też wsiadł do łodzi ze swoimi uczniami i przybył w okolice Dalmanuty."
"Mk8,11": "Wtedy nadeszli faryzeusze i zaczęli z nim rozprawiać, a wystawiając go na próbę, żądali od niego znaku z nieba."
"Mk8,12": "On zaś, westchnąwszy głęboko w duchu, powiedział: Dlaczego to pokolenie żąda znaku? Zaprawdę powiadam wam, że żaden znak nie będzie dany temu pokoleniu."
"Mk8,13": "I opuściwszy ich, ponownie wsiadł do łodzi i przeprawił się na drugą stronę."
"Mk8,14": "A uczniowie zapomnieli wziąć chleba i nie mieli ze sobą w łodzi nic więcej oprócz jednego bochenka."
"Mk8,15": "Wtedy przykazał im: Uważajcie i strzeżcie się zakwasu faryzeuszy i zakwasu Heroda."
"Mk8,16": "I rozmawiali między sobą: Powiedział tak, bo nie mamy chleba."
"Mk8,17": "Jezus, poznawszy to, powiedział do nich: Czemu rozmawiacie o tym, że nie macie chleba? Jeszcze nie pojmujecie i nie rozumiecie? Jeszcze wasze serce jest odrętwiałe?"
"Mk8,18": "Macie oczy, a nie widzicie, i macie uszy, a nie słyszycie? I nie pamiętacie?"
"Mk8,19": "Gdy łamałem te pięć chlebów dla pięciu tysięcy ludzi, ile pełnych koszy kawałków zebraliście? Odpowiedzieli mu: Dwanaście."
"Mk8,20": "A gdy łamałem tych siedem chlebów dla czterech tysięcy ludzi, ile pełnych koszy kawałków zebraliście? A oni odpowiedzieli: Siedem."
"Mk8,21": "I zapytał ich: Jakże więc nie rozumiecie?"
"Mk8,22": "Potem przyszedł do Betsaidy. I przyprowadzili do niego ślepego, prosząc go, aby go dotknął."
"Mk8,23": "A ująwszy ślepego za rękę, wyprowadził go poza miasteczko i plunąwszy na jego oczy, położył na niego ręce i zapytał, czy coś widzi."
"Mk8,24": "A on spojrzał w górę i powiedział: Widzę chodzących ludzi, jakby drzewa."
"Mk8,25": "Potem znowu położył ręce na jego oczy i kazał mu spojrzeć w górę. I został uzdrowiony, tak że nawet z daleka widział wszystkich wyraźnie."
"Mk8,26": "I odesłał go do domu, mówiąc: Nie wchodź do tego miasteczka i nikomu z miasteczka o tym nie mów."
"Mk8,27": "Wtedy Jezus poszedł ze swymi uczniami do wiosek należących do Cezarei Filipowej, a w drodze pytał swoich uczniów: Za kogo mnie ludzie uważają?"
"Mk8,28": "A oni mu odpowiedzieli: Jedni za Jana Chrzciciela, inni za Eliasza, a jeszcze inni za jednego z proroków."
"Mk8,29": "Wtedy zapytał ich: A wy za kogo mnie uważacie? A Piotr mu odpowiedział: Ty jesteś Chrystusem."
"Mk8,30": "I przykazał im, aby nikomu o nim nie mówili."
"Mk8,31": "I zaczął ich nauczać, że Syn Człowieczy musi wiele cierpieć i zostać odrzucony przez starszych, naczelnych kapłanów i uczonych w Piśmie, i być zabity, a po trzech dniach zmartwychwstać."
"Mk8,32": "A mówił to otwarcie. Wtedy Piotr, wziąwszy go na bok, zaczął go strofować."
"Mk8,33": "Lecz on odwrócił się, spojrzał na swoich uczniów i zgromił Piotra, mówiąc: Odejdź ode mnie, szatanie, bo nie pojmujesz tego, co Boże, ale to, co ludzkie."
"Mk8,34": "Potem przywołał do siebie lud wraz ze swoimi uczniami i powiedział do nich: Ktokolwiek chce pójść za mną, niech się zaprze samego siebie, weźmie swój krzyż i idzie za mną."
"Mk8,35": "Bo kto chce zachować swoje życie, straci je, a kto straci swoje życie z mojego powodu i dla ewangelii, ten je zachowa."
"Mk8,36": "Cóż pomoże człowiekowi, choćby cały świat pozyskał, a na swojej duszy poniósł szkodę?"
"Mk8,37": "Albo co da człowiek w zamian za swoją duszę?"
"Mk8,38": "Kto się bowiem wstydzi mnie i moich słów wobec tego pokolenia cudzołożnego i grzesznego, tego i Syn Człowieczy będzie się wstydził, gdy przyjdzie w chwale swego Ojca ze świętymi aniołami."
