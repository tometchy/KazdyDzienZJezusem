"Mk8,1":
  text: "A w tych dniach, gdy było z nim bardzo wielu ludzi i nie mieli co jeść, Jezus przywołał swoich uczniów i powiedział do nich:"
  tags: []
"Mk8,2":
  text: "Żal mi tych ludzi, bo już trzy dni przy mnie trwają, a nie mają co jeść."
  tags: []
"Mk8,3":
  text: "A jeśli odprawię ich głodnych do domów, zasłabną w drodze, bo niektórzy z nich przyszli z daleka."
  tags: []
"Mk8,4":
  text: "Wtedy jego uczniowie odpowiedzieli mu: Skąd tu na pustyni będzie ktoś mógł nakarmić ich chlebem?"
  tags: []
"Mk8,5":
  text: "I zapytał ich: Ile macie chlebów? A oni odpowiedzieli: Siedem."
  tags: []
"Mk8,6":
  text: "Wtedy nakazał ludziom usiąść na ziemi. I wziął te siedem chlebów, a podziękowawszy, łamał i dawał swoim uczniom, aby kładli przed nimi. I kładli przed ludźmi."
  tags: []
"Mk8,7":
  text: "Mieli też kilka rybek, które pobłogosławiwszy, również kazał kłaść przed ludźmi."
  tags: []
"Mk8,8":
  text: "Jedli więc do syta, a pozostałych kawałków zebrali siedem koszy."
  tags: []
"Mk8,9":
  text: "A tych, którzy jedli, było około czterech tysięcy. Potem ich odprawił."
  tags: []
"Mk8,10":
  text: "Zaraz też wsiadł do łodzi ze swoimi uczniami i przybył w okolice Dalmanuty."
  tags: []
"Mk8,11":
  text: "Wtedy nadeszli faryzeusze i zaczęli z nim rozprawiać, a wystawiając go na próbę, żądali od niego znaku z nieba."
  tags: []
"Mk8,12":
  text: "On zaś, westchnąwszy głęboko w duchu, powiedział: Dlaczego to pokolenie żąda znaku? Zaprawdę powiadam wam, że żaden znak nie będzie dany temu pokoleniu."
  tags: []
"Mk8,13":
  text: "I opuściwszy ich, ponownie wsiadł do łodzi i przeprawił się na drugą stronę."
  tags: []
"Mk8,14":
  text: "A uczniowie zapomnieli wziąć chleba i nie mieli ze sobą w łodzi nic więcej oprócz jednego bochenka."
  tags: []
"Mk8,15":
  text: "Wtedy przykazał im: Uważajcie i strzeżcie się zakwasu faryzeuszy i zakwasu Heroda."
  tags: []
"Mk8,16":
  text: "I rozmawiali między sobą: Powiedział tak, bo nie mamy chleba."
  tags: []
"Mk8,17":
  text: "Jezus, poznawszy to, powiedział do nich: Czemu rozmawiacie o tym, że nie macie chleba? Jeszcze nie pojmujecie i nie rozumiecie? Jeszcze wasze serce jest odrętwiałe?"
  tags: []
"Mk8,18":
  text: "Macie oczy, a nie widzicie, i macie uszy, a nie słyszycie? I nie pamiętacie?"
  tags: []
"Mk8,19":
  text: "Gdy łamałem te pięć chlebów dla pięciu tysięcy ludzi, ile pełnych koszy kawałków zebraliście? Odpowiedzieli mu: Dwanaście."
  tags: []
"Mk8,20":
  text: "A gdy łamałem tych siedem chlebów dla czterech tysięcy ludzi, ile pełnych koszy kawałków zebraliście? A oni odpowiedzieli: Siedem."
  tags: []
"Mk8,21":
  text: "I zapytał ich: Jakże więc nie rozumiecie?"
  tags: []
"Mk8,22":
  text: "Potem przyszedł do Betsaidy. I przyprowadzili do niego ślepego, prosząc go, aby go dotknął."
  tags: []
"Mk8,23":
  text: "A ująwszy ślepego za rękę, wyprowadził go poza miasteczko i plunąwszy na jego oczy, położył na niego ręce i zapytał, czy coś widzi."
  tags: []
"Mk8,24":
  text: "A on spojrzał w górę i powiedział: Widzę chodzących ludzi, jakby drzewa."
  tags: []
"Mk8,25":
  text: "Potem znowu położył ręce na jego oczy i kazał mu spojrzeć w górę. I został uzdrowiony, tak że nawet z daleka widział wszystkich wyraźnie."
  tags: []
"Mk8,26":
  text: "I odesłał go do domu, mówiąc: Nie wchodź do tego miasteczka i nikomu z miasteczka o tym nie mów."
  tags: []
"Mk8,27":
  text: "Wtedy Jezus poszedł ze swymi uczniami do wiosek należących do Cezarei Filipowej, a w drodze pytał swoich uczniów: Za kogo mnie ludzie uważają?"
  tags: []
"Mk8,28":
  text: "A oni mu odpowiedzieli: Jedni za Jana Chrzciciela, inni za Eliasza, a jeszcze inni za jednego z proroków."
  tags: []
"Mk8,29":
  text: "Wtedy zapytał ich: A wy za kogo mnie uważacie? A Piotr mu odpowiedział: Ty jesteś Chrystusem."
  tags: []
"Mk8,30":
  text: "I przykazał im, aby nikomu o nim nie mówili."
  tags: []
"Mk8,31":
  text: "I zaczął ich nauczać, że Syn Człowieczy musi wiele cierpieć i zostać odrzucony przez starszych, naczelnych kapłanów i uczonych w Piśmie, i być zabity, a po trzech dniach zmartwychwstać."
  tags: []
"Mk8,32":
  text: "A mówił to otwarcie. Wtedy Piotr, wziąwszy go na bok, zaczął go strofować."
  tags: []
"Mk8,33":
  text: "Lecz on odwrócił się, spojrzał na swoich uczniów i zgromił Piotra, mówiąc: Odejdź ode mnie, szatanie, bo nie pojmujesz tego, co Boże, ale to, co ludzkie."
  tags: []
"Mk8,34":
  text: "Potem przywołał do siebie lud wraz ze swoimi uczniami i powiedział do nich: Ktokolwiek chce pójść za mną, niech się zaprze samego siebie, weźmie swój krzyż i idzie za mną."
  tags: []
"Mk8,35":
  text: "Bo kto chce zachować swoje życie, straci je, a kto straci swoje życie z mojego powodu i dla ewangelii, ten je zachowa."
  tags: []
"Mk8,36":
  text: "Cóż pomoże człowiekowi, choćby cały świat pozyskał, a na swojej duszy poniósł szkodę?"
  tags: []
"Mk8,37":
  text: "Albo co da człowiek w zamian za swoją duszę?"
  tags: []
"Mk8,38":
  text: "Kto się bowiem wstydzi mnie i moich słów wobec tego pokolenia cudzołożnego i grzesznego, tego i Syn Człowieczy będzie się wstydził, gdy przyjdzie w chwale swego Ojca ze świętymi aniołami."
  tags: []
