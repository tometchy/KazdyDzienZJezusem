"Mk10,1":
  text: "Potem wyruszył stamtąd i przyszedł w granice Judei przez krainę leżącą za Jordanem; i ponownie zeszli się do niego ludzie, i znowu ich nauczał, jak miał w zwyczaju."
  tags: []
"Mk10,2":
  text: "Wtedy faryzeusze podeszli i pytali go: Czy wolno mężowi oddalić żonę? A robili to, wystawiając go na próbę."
  tags: []
"Mk10,3":
  text: "Lecz on im odpowiedział: Co wam nakazał Mojżesz?"
  tags: []
"Mk10,4":
  text: "A oni powiedzieli: Mojżesz pozwolił napisać list rozwodowy i oddalić ją."
  tags: []
"Mk10,5":
  text: "Jezus odpowiedział im: Z powodu zatwardziałości waszego serca napisał wam to przykazanie."
  tags: []
"Mk10,6":
  text: "Lecz od początku stworzenia Bóg uczynił ich mężczyzną i kobietą."
  tags: []
"Mk10,7":
  text: "Dlatego opuści mężczyzna swego ojca i matkę i połączy się ze swoją żoną;"
  tags: []
"Mk10,8":
  text: "I będą dwoje jednym ciałem. A tak już nie są dwoje, ale jedno ciało."
  tags: []
"Mk10,9":
  text: "Co więc Bóg złączył, człowiek niech nie rozłącza."
  tags: []
"Mk10,10":
  text: "A w domu jego uczniowie znowu go o to pytali."
  tags: []
"Mk10,11":
  text: "I powiedział im: Kto oddala swą żonę i żeni się z inną, cudzołoży wobec niej."
  tags: []
"Mk10,12":
  text: "A jeśli kobieta opuści swego męża i wyjdzie za innego, cudzołoży."
  tags: []
"Mk10,13":
  text: "I przynoszono do niego dzieci, aby ich dotknął, ale uczniowie gromili tych, którzy je przynosili."
  tags: []
"Mk10,14":
  text: "Gdy Jezus to zobaczył, oburzył się i powiedział do nich: Pozwólcie dzieciom przychodzić do mnie i nie zabraniajcie im. Do takich bowiem należy królestwo Boże."
  tags: []
"Mk10,15":
  text: "Zaprawdę powiadam wam: Kto nie przyjmie królestwa Bożego jak dziecko, nie wejdzie do niego."
  tags: []
"Mk10,16":
  text: "I brał je na ręce, a kładąc na nie ręce, błogosławił je."
  tags: []
"Mk10,17":
  text: "A gdy wyruszał w drogę, przybiegł pewien człowiek, upadł przed nim na kolana i zapytał: Nauczycielu dobry, co mam czynić, aby odziedziczyć życie wieczne?"
  tags: []
"Mk10,18":
  text: "Lecz Jezus mu odpowiedział: Dlaczego nazywasz mnie dobrym? Nikt nie jest dobry, tylko jeden – Bóg."
  tags: []
"Mk10,19":
  text: "Znasz przykazania: Nie będziesz cudzołożył, nie będziesz zabijał, nie będziesz kradł, nie będziesz mówił fałszywego świadectwa, nie będziesz oszukiwał, czcij swego ojca i matkę."
  tags: []
"Mk10,20":
  text: "A on mu odpowiedział: Nauczycielu, tego wszystkiego przestrzegałem od mojej młodości."
  tags: []
"Mk10,21":
  text: "Wtedy Jezus, spojrzawszy na niego, umiłował go i powiedział: Jednego ci brakuje. Idź, sprzedaj wszystko, co masz i rozdaj ubogim, a będziesz miał skarb w niebie. Potem przyjdź, weź krzyż i chodź za mną."
  tags: []
"Mk10,22":
  text: "Lecz on zmartwił się z powodu tych słów i odszedł smutny, miał bowiem wiele dóbr."
  tags: []
"Mk10,23":
  text: "A Jezus, spojrzawszy wokoło, powiedział do swoich uczniów: Jakże trudno tym, którzy mają bogactwa, wejść do królestwa Bożego!"
  tags: []
"Mk10,24":
  text: "I uczniowie zdumieli się jego słowami. Lecz Jezus znowu powiedział: Dzieci, jakże trudno jest tym, którzy ufają bogactwom, wejść do królestwa Bożego!"
  tags: []
"Mk10,25":
  text: "Łatwiej jest wielbłądowi przejść przez ucho igielne, niż bogatemu wejść do królestwa Bożego."
  tags: []
"Mk10,26":
  text: "A oni tym bardziej się zdumiewali i mówili między sobą: Któż więc może być zbawiony?"
  tags: []
"Mk10,27":
  text: "A Jezus, spojrzawszy na nich, powiedział: U ludzi to niemożliwe, ale nie u Boga. U Boga bowiem wszystko jest możliwe."
  tags: []
"Mk10,28":
  text: "Wtedy Piotr zaczął mówić do niego: Oto my opuściliśmy wszystko i poszliśmy za tobą."
  tags: []
"Mk10,29":
  text: "A Jezus odpowiedział: Zaprawdę powiadam wam: Nie ma nikogo, kto by opuścił dom, braci lub siostry, ojca lub matkę, żonę, dzieci lub pole ze względu na mnie i na ewangelię;"
  tags: []
"Mk10,30":
  text: "A kto by nie otrzymał stokrotnie więcej teraz, w tym czasie, domów, braci, sióstr, matek, dzieci i pól, wśród prześladowań, a w przyszłym świecie życia wiecznego."
  tags: []
"Mk10,31":
  text: "Ale wielu pierwszych będzie ostatnimi, a ostatnich pierwszymi."
  tags: []
"Mk10,32":
  text: "I byli w drodze, zdążając do Jerozolimy, a Jezus szedł przed nimi. I zdumiewali się, a idąc za nim, bali się. On zaś znowu wziął ze sobą dwunastu i zaczął im mówić o tym, co miało go spotkać:"
  tags: []
"Mk10,33":
  text: "Oto idziemy do Jerozolimy, a Syn Człowieczy zostanie wydany naczelnym kapłanom i uczonym w Piśmie. Oni skażą go na śmierć i wydadzą poganom."
  tags: []
"Mk10,34":
  text: "I będą się z niego naśmiewać, ubiczują go, będą na niego pluć i zabiją go, ale trzeciego dnia zmartwychwstanie."
  tags: []
"Mk10,35":
  text: "Wtedy podeszli do niego Jakub i Jan, synowie Zebedeusza, i powiedzieli: Nauczycielu, chcemy, żebyś zrobił dla nas to, o co cię poprosimy."
  tags: []
"Mk10,36":
  text: "A on ich zapytał: Co chcecie, żebym dla was zrobił?"
  tags: []
"Mk10,37":
  text: "Odpowiedzieli mu: Spraw, abyśmy siedzieli jeden po twojej prawej, a drugi po lewej stronie w twojej chwale."
  tags: []
"Mk10,38":
  text: "Lecz Jezus im powiedział: Nie wiecie, o co prosicie. Czy możecie pić kielich, który ja piję, i być ochrzczeni chrztem, którym ja się chrzczę?"
  tags: []
"Mk10,39":
  text: "Odpowiedzieli mu: Możemy. A Jezus im powiedział: Istotnie, kielich, który ja piję, będziecie pić i chrztem, którym ja się chrzczę, będziecie ochrzczeni."
  tags: []
"Mk10,40":
  text: "Nie do mnie jednak należy danie miejsca po mojej prawej albo lewej stronie, ale będzie dane tym, którym zostało przygotowane."
  tags: []
"Mk10,41":
  text: "A gdy dziesięciu to usłyszało, zaczęli się oburzać na Jakuba i Jana."
  tags: []
"Mk10,42":
  text: "Ale Jezus przywołał ich do siebie i powiedział: Wiecie, że ci, którzy uchodzą za władców narodów, panują nad nimi, a ich wielcy sprawują nad nimi swą władzę."
  tags: []
"Mk10,43":
  text: "Lecz nie tak ma być wśród was, ale kto między wami chce być wielki, niech będzie waszym sługą."
  tags: []
"Mk10,44":
  text: "A kto z was chce być pierwszy, niech będzie sługą wszystkich."
  tags: []
"Mk10,45":
  text: "Bo i Syn Człowieczy nie przyszedł, aby mu służono, ale aby służyć i aby dać swe życie na okup za wielu."
  tags: []
"Mk10,46":
  text: "I przyszli do Jerycha. A gdy on wychodził z Jerycha ze swoimi uczniami oraz mnóstwem ludzi, ślepy Bartymeusz, syn Tymeusza, siedział przy drodze, żebrząc."
  tags: []
"Mk10,47":
  text: "A słysząc, że to Jezus z Nazaretu, zaczął wołać: Jezusie, Synu Dawida, zmiłuj się nade mną!"
  tags: []
"Mk10,48":
  text: "I wielu nakazywało mu milczeć. Lecz on tym głośniej wołał: Synu Dawida, zmiłuj się nade mną!"
  tags: []
"Mk10,49":
  text: "Wtedy Jezus zatrzymał się i kazał go zawołać. Zawołali więc ślepego i powiedzieli do niego: Ufaj! Wstań, woła cię."
  tags: []
"Mk10,50":
  text: "A on zrzucił swój płaszcz, wstał i przyszedł do Jezusa."
  tags: []
"Mk10,51":
  text: "I zapytał go Jezus: Co chcesz, abym ci uczynił? Ślepiec mu odpowiedział: Mistrzu, żebym widział."
  tags: []
"Mk10,52":
  text: "A Jezus mu powiedział: Idź, twoja wiara cię uzdrowiła. Zaraz też odzyskał wzrok i szedł drogą za Jezusem."
  tags: []
