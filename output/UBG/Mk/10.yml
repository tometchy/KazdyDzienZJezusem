"Mk10,1": "Potem wyruszył stamtąd i przyszedł w granice Judei przez krainę leżącą za Jordanem; i ponownie zeszli się do niego ludzie, i znowu ich nauczał, jak miał w zwyczaju."
"Mk10,2": "Wtedy faryzeusze podeszli i pytali go: Czy wolno mężowi oddalić żonę? A robili to, wystawiając go na próbę."
"Mk10,3": "Lecz on im odpowiedział: Co wam nakazał Mojżesz?"
"Mk10,4": "A oni powiedzieli: Mojżesz pozwolił napisać list rozwodowy i oddalić ją."
"Mk10,5": "Jezus odpowiedział im: Z powodu zatwardziałości waszego serca napisał wam to przykazanie."
"Mk10,6": "Lecz od początku stworzenia Bóg uczynił ich mężczyzną i kobietą."
"Mk10,7": "Dlatego opuści mężczyzna swego ojca i matkę i połączy się ze swoją żoną;"
"Mk10,8": "I będą dwoje jednym ciałem. A tak już nie są dwoje, ale jedno ciało."
"Mk10,9": "Co więc Bóg złączył, człowiek niech nie rozłącza."
"Mk10,10": "A w domu jego uczniowie znowu go o to pytali."
"Mk10,11": "I powiedział im: Kto oddala swą żonę i żeni się z inną, cudzołoży wobec niej."
"Mk10,12": "A jeśli kobieta opuści swego męża i wyjdzie za innego, cudzołoży."
"Mk10,13": "I przynoszono do niego dzieci, aby ich dotknął, ale uczniowie gromili tych, którzy je przynosili."
"Mk10,14": "Gdy Jezus to zobaczył, oburzył się i powiedział do nich: Pozwólcie dzieciom przychodzić do mnie i nie zabraniajcie im. Do takich bowiem należy królestwo Boże."
"Mk10,15": "Zaprawdę powiadam wam: Kto nie przyjmie królestwa Bożego jak dziecko, nie wejdzie do niego."
"Mk10,16": "I brał je na ręce, a kładąc na nie ręce, błogosławił je."
"Mk10,17": "A gdy wyruszał w drogę, przybiegł pewien człowiek, upadł przed nim na kolana i zapytał: Nauczycielu dobry, co mam czynić, aby odziedziczyć życie wieczne?"
"Mk10,18": "Lecz Jezus mu odpowiedział: Dlaczego nazywasz mnie dobrym? Nikt nie jest dobry, tylko jeden – Bóg."
"Mk10,19": "Znasz przykazania: Nie będziesz cudzołożył, nie będziesz zabijał, nie będziesz kradł, nie będziesz mówił fałszywego świadectwa, nie będziesz oszukiwał, czcij swego ojca i matkę."
"Mk10,20": "A on mu odpowiedział: Nauczycielu, tego wszystkiego przestrzegałem od mojej młodości."
"Mk10,21": "Wtedy Jezus, spojrzawszy na niego, umiłował go i powiedział: Jednego ci brakuje. Idź, sprzedaj wszystko, co masz i rozdaj ubogim, a będziesz miał skarb w niebie. Potem przyjdź, weź krzyż i chodź za mną."
"Mk10,22": "Lecz on zmartwił się z powodu tych słów i odszedł smutny, miał bowiem wiele dóbr."
"Mk10,23": "A Jezus, spojrzawszy wokoło, powiedział do swoich uczniów: Jakże trudno tym, którzy mają bogactwa, wejść do królestwa Bożego!"
"Mk10,24": "I uczniowie zdumieli się jego słowami. Lecz Jezus znowu powiedział: Dzieci, jakże trudno jest tym, którzy ufają bogactwom, wejść do królestwa Bożego!"
"Mk10,25": "Łatwiej jest wielbłądowi przejść przez ucho igielne, niż bogatemu wejść do królestwa Bożego."
"Mk10,26": "A oni tym bardziej się zdumiewali i mówili między sobą: Któż więc może być zbawiony?"
"Mk10,27": "A Jezus, spojrzawszy na nich, powiedział: U ludzi to niemożliwe, ale nie u Boga. U Boga bowiem wszystko jest możliwe."
"Mk10,28": "Wtedy Piotr zaczął mówić do niego: Oto my opuściliśmy wszystko i poszliśmy za tobą."
"Mk10,29": "A Jezus odpowiedział: Zaprawdę powiadam wam: Nie ma nikogo, kto by opuścił dom, braci lub siostry, ojca lub matkę, żonę, dzieci lub pole ze względu na mnie i na ewangelię;"
"Mk10,30": "A kto by nie otrzymał stokrotnie więcej teraz, w tym czasie, domów, braci, sióstr, matek, dzieci i pól, wśród prześladowań, a w przyszłym świecie życia wiecznego."
"Mk10,31": "Ale wielu pierwszych będzie ostatnimi, a ostatnich pierwszymi."
"Mk10,32": "I byli w drodze, zdążając do Jerozolimy, a Jezus szedł przed nimi. I zdumiewali się, a idąc za nim, bali się. On zaś znowu wziął ze sobą dwunastu i zaczął im mówić o tym, co miało go spotkać:"
"Mk10,33": "Oto idziemy do Jerozolimy, a Syn Człowieczy zostanie wydany naczelnym kapłanom i uczonym w Piśmie. Oni skażą go na śmierć i wydadzą poganom."
"Mk10,34": "I będą się z niego naśmiewać, ubiczują go, będą na niego pluć i zabiją go, ale trzeciego dnia zmartwychwstanie."
"Mk10,35": "Wtedy podeszli do niego Jakub i Jan, synowie Zebedeusza, i powiedzieli: Nauczycielu, chcemy, żebyś zrobił dla nas to, o co cię poprosimy."
"Mk10,36": "A on ich zapytał: Co chcecie, żebym dla was zrobił?"
"Mk10,37": "Odpowiedzieli mu: Spraw, abyśmy siedzieli jeden po twojej prawej, a drugi po lewej stronie w twojej chwale."
"Mk10,38": "Lecz Jezus im powiedział: Nie wiecie, o co prosicie. Czy możecie pić kielich, który ja piję, i być ochrzczeni chrztem, którym ja się chrzczę?"
"Mk10,39": "Odpowiedzieli mu: Możemy. A Jezus im powiedział: Istotnie, kielich, który ja piję, będziecie pić i chrztem, którym ja się chrzczę, będziecie ochrzczeni."
"Mk10,40": "Nie do mnie jednak należy danie miejsca po mojej prawej albo lewej stronie, ale będzie dane tym, którym zostało przygotowane."
"Mk10,41": "A gdy dziesięciu to usłyszało, zaczęli się oburzać na Jakuba i Jana."
"Mk10,42": "Ale Jezus przywołał ich do siebie i powiedział: Wiecie, że ci, którzy uchodzą za władców narodów, panują nad nimi, a ich wielcy sprawują nad nimi swą władzę."
"Mk10,43": "Lecz nie tak ma być wśród was, ale kto między wami chce być wielki, niech będzie waszym sługą."
"Mk10,44": "A kto z was chce być pierwszy, niech będzie sługą wszystkich."
"Mk10,45": "Bo i Syn Człowieczy nie przyszedł, aby mu służono, ale aby służyć i aby dać swe życie na okup za wielu."
"Mk10,46": "I przyszli do Jerycha. A gdy on wychodził z Jerycha ze swoimi uczniami oraz mnóstwem ludzi, ślepy Bartymeusz, syn Tymeusza, siedział przy drodze, żebrząc."
"Mk10,47": "A słysząc, że to Jezus z Nazaretu, zaczął wołać: Jezusie, Synu Dawida, zmiłuj się nade mną!"
"Mk10,48": "I wielu nakazywało mu milczeć. Lecz on tym głośniej wołał: Synu Dawida, zmiłuj się nade mną!"
"Mk10,49": "Wtedy Jezus zatrzymał się i kazał go zawołać. Zawołali więc ślepego i powiedzieli do niego: Ufaj! Wstań, woła cię."
"Mk10,50": "A on zrzucił swój płaszcz, wstał i przyszedł do Jezusa."
"Mk10,51": "I zapytał go Jezus: Co chcesz, abym ci uczynił? Ślepiec mu odpowiedział: Mistrzu, żebym widział."
"Mk10,52": "A Jezus mu powiedział: Idź, twoja wiara cię uzdrowiła. Zaraz też odzyskał wzrok i szedł drogą za Jezusem."
