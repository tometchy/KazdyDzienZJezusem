"Mk13,1": "Gdy wychodził ze świątyni, jeden z jego uczniów powiedział do niego: Nauczycielu, patrz, jakie kamienie i jakie budowle!"
"Mk13,2": "A Jezus mu odpowiedział: Widzisz te wielkie budowle? Nie zostanie kamień na kamieniu, który by nie został zwalony."
"Mk13,3": "A gdy siedział na Górze Oliwnej, naprzeciwko świątyni, Piotr, Jakub, Jan i Andrzej pytali go na osobności:"
"Mk13,4": "Powiedz nam, kiedy się to stanie i jaki będzie znak, gdy to wszystko będzie się spełniać?"
"Mk13,5": "A Jezus w odpowiedzi zaczął im mówić: Uważajcie, aby was ktoś nie zwiódł."
"Mk13,6": "Wielu bowiem przyjdzie pod moim imieniem, mówiąc: Ja jestem Chrystusem. I wielu zwiodą."
"Mk13,7": "Gdy więc usłyszycie o wojnach i pogłoski o wojnach, nie lękajcie się. To musi się stać, ale to jeszcze nie koniec."
"Mk13,8": "Powstanie bowiem naród przeciwko narodowi i królestwo przeciwko królestwu, będą też miejscami trzęsienia ziemi, a także głód i zamęt. To jest początek boleści."
"Mk13,9": "Lecz miejcie się na baczności, bo będą was wydawać sądom i biczować w synagogach. Staniecie przed namiestnikami i królami z mojego powodu, na świadectwo przeciwko nim."
"Mk13,10": "A ewangelia musi być najpierw głoszona wszystkim narodom."
"Mk13,11": "A gdy będą was prowadzić, żeby was wydać, nie martwcie się wcześniej, co macie mówić, ani o tym nie rozmyślajcie, ale mówcie to, co wam będzie dane w tej godzinie. Nie wy bowiem będziecie mówić, ale Duch Święty."
"Mk13,12": "I wyda na śmierć brat brata, a ojciec syna. Dzieci powstaną przeciwko rodzicom i spowodują ich śmierć."
"Mk13,13": "I będziecie znienawidzeni przez wszystkich z powodu mego imienia. Kto jednak wytrwa do końca, będzie zbawiony."
"Mk13,14": "Gdy więc zobaczycie obrzydliwość spustoszenia, o której mówił prorok Daniel, stojącą tam, gdzie stać nie powinna (kto czyta, niech rozumie), wtedy ci, którzy będą w Judei, niech uciekają w góry;"
"Mk13,15": "A kto będzie na dachu, niech nie schodzi ani nie wchodzi do domu, aby coś z niego zabrać;"
"Mk13,16": "Kto zaś będzie w polu, niech nie wraca, aby wziąć swoją szatę."
"Mk13,17": "Lecz biada brzemiennym i karmiącym w tych dniach!"
"Mk13,18": "Módlcie się więc, aby wasza ucieczka nie wypadła w zimie."
"Mk13,19": "Będą to bowiem dni takiego ucisku, jakiego nie było od początku stworzenia, którego dokonał Bóg, aż dotąd i nigdy nie będzie."
"Mk13,20": "A gdyby Pan nie skrócił tych dni, żadne ciało nie byłoby zbawione. Lecz ze względu na wybranych, których sobie obrał, skrócił te dni."
"Mk13,21": "Jeśli wtedy ktoś wam powie: Oto tu jest Chrystus, albo: Oto tam jest – nie wierzcie."
"Mk13,22": "Powstaną bowiem fałszywi Chrystusowie i fałszywi prorocy i będą czynić znaki i cuda, aby zwieść, o ile można, nawet wybranych."
"Mk13,23": "Wy więc uważajcie. Wszystko wam przepowiedziałem."
"Mk13,24": "Ale w tych dniach, po tym ucisku, zaćmi się słońce i księżyc nie da swego blasku;"
"Mk13,25": "Gwiazdy nieba będą spadać i moce, które są na niebie, zostaną poruszone."
"Mk13,26": "A wtedy ujrzą Syna Człowieczego przychodzącego w obłokach z wielką mocą i chwałą."
"Mk13,27": "Wówczas pośle swoich aniołów i zgromadzi swoich wybranych z czterech stron świata, od krańca ziemi aż do krańca nieba."
"Mk13,28": "A od drzewa figowego uczcie się przez podobieństwo: Gdy już jego gałąź staje się miękka i wypuszcza liście, poznajecie, że lato jest blisko."
"Mk13,29": "Tak i wy, gdy ujrzycie, że to się dzieje, wiedzcie, że jest blisko, u drzwi."
"Mk13,30": "Zaprawdę powiadam wam: Nie przeminie to pokolenie, aż się to wszystko stanie."
"Mk13,31": "Niebo i ziemia przeminą, ale moje słowa nie przeminą."
"Mk13,32": "Lecz o tym dniu i godzinie nikt nie wie, ani aniołowie, którzy są w niebie, ani Syn, tylko Ojciec."
"Mk13,33": "Uważajcie, czuwajcie i módlcie się, bo nie wiecie, kiedy ten czas nadejdzie."
"Mk13,34": "Syn Człowieczy bowiem jest jak człowiek, który wyjeżdżając, zostawił swój dom, dał władzę swoim sługom i każdemu jego pracę, a odźwiernemu nakazał czuwać."
"Mk13,35": "Czuwajcie więc, bo nie wiecie, kiedy pan domu przyjdzie: wieczorem czy o północy, gdy pieją koguty czy rano;"
"Mk13,36": "By przypadkiem, przyszedłszy niespodziewanie, nie zastał was śpiących."
"Mk13,37": "A to, co wam mówię, mówię wszystkim: Czuwajcie!"
