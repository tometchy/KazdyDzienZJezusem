"Mk13,1":
  text: "Gdy wychodził ze świątyni, jeden z jego uczniów powiedział do niego: Nauczycielu, patrz, jakie kamienie i jakie budowle!"
  tags: []
"Mk13,2":
  text: "A Jezus mu odpowiedział: Widzisz te wielkie budowle? Nie zostanie kamień na kamieniu, który by nie został zwalony."
  tags: []
"Mk13,3":
  text: "A gdy siedział na Górze Oliwnej, naprzeciwko świątyni, Piotr, Jakub, Jan i Andrzej pytali go na osobności:"
  tags: []
"Mk13,4":
  text: "Powiedz nam, kiedy się to stanie i jaki będzie znak, gdy to wszystko będzie się spełniać?"
  tags: []
"Mk13,5":
  text: "A Jezus w odpowiedzi zaczął im mówić: Uważajcie, aby was ktoś nie zwiódł."
  tags: []
"Mk13,6":
  text: "Wielu bowiem przyjdzie pod moim imieniem, mówiąc: Ja jestem Chrystusem. I wielu zwiodą."
  tags: []
"Mk13,7":
  text: "Gdy więc usłyszycie o wojnach i pogłoski o wojnach, nie lękajcie się. To musi się stać, ale to jeszcze nie koniec."
  tags: []
"Mk13,8":
  text: "Powstanie bowiem naród przeciwko narodowi i królestwo przeciwko królestwu, będą też miejscami trzęsienia ziemi, a także głód i zamęt. To jest początek boleści."
  tags: []
"Mk13,9":
  text: "Lecz miejcie się na baczności, bo będą was wydawać sądom i biczować w synagogach. Staniecie przed namiestnikami i królami z mojego powodu, na świadectwo przeciwko nim."
  tags: []
"Mk13,10":
  text: "A ewangelia musi być najpierw głoszona wszystkim narodom."
  tags: []
"Mk13,11":
  text: "A gdy będą was prowadzić, żeby was wydać, nie martwcie się wcześniej, co macie mówić, ani o tym nie rozmyślajcie, ale mówcie to, co wam będzie dane w tej godzinie. Nie wy bowiem będziecie mówić, ale Duch Święty."
  tags: []
"Mk13,12":
  text: "I wyda na śmierć brat brata, a ojciec syna. Dzieci powstaną przeciwko rodzicom i spowodują ich śmierć."
  tags: []
"Mk13,13":
  text: "I będziecie znienawidzeni przez wszystkich z powodu mego imienia. Kto jednak wytrwa do końca, będzie zbawiony."
  tags: []
"Mk13,14":
  text: "Gdy więc zobaczycie obrzydliwość spustoszenia, o której mówił prorok Daniel, stojącą tam, gdzie stać nie powinna (kto czyta, niech rozumie), wtedy ci, którzy będą w Judei, niech uciekają w góry;"
  tags: []
"Mk13,15":
  text: "A kto będzie na dachu, niech nie schodzi ani nie wchodzi do domu, aby coś z niego zabrać;"
  tags: []
"Mk13,16":
  text: "Kto zaś będzie w polu, niech nie wraca, aby wziąć swoją szatę."
  tags: []
"Mk13,17":
  text: "Lecz biada brzemiennym i karmiącym w tych dniach!"
  tags: []
"Mk13,18":
  text: "Módlcie się więc, aby wasza ucieczka nie wypadła w zimie."
  tags: []
"Mk13,19":
  text: "Będą to bowiem dni takiego ucisku, jakiego nie było od początku stworzenia, którego dokonał Bóg, aż dotąd i nigdy nie będzie."
  tags: []
"Mk13,20":
  text: "A gdyby Pan nie skrócił tych dni, żadne ciało nie byłoby zbawione. Lecz ze względu na wybranych, których sobie obrał, skrócił te dni."
  tags: []
"Mk13,21":
  text: "Jeśli wtedy ktoś wam powie: Oto tu jest Chrystus, albo: Oto tam jest – nie wierzcie."
  tags: []
"Mk13,22":
  text: "Powstaną bowiem fałszywi Chrystusowie i fałszywi prorocy i będą czynić znaki i cuda, aby zwieść, o ile można, nawet wybranych."
  tags: []
"Mk13,23":
  text: "Wy więc uważajcie. Wszystko wam przepowiedziałem."
  tags: []
"Mk13,24":
  text: "Ale w tych dniach, po tym ucisku, zaćmi się słońce i księżyc nie da swego blasku;"
  tags: []
"Mk13,25":
  text: "Gwiazdy nieba będą spadać i moce, które są na niebie, zostaną poruszone."
  tags: []
"Mk13,26":
  text: "A wtedy ujrzą Syna Człowieczego przychodzącego w obłokach z wielką mocą i chwałą."
  tags: []
"Mk13,27":
  text: "Wówczas pośle swoich aniołów i zgromadzi swoich wybranych z czterech stron świata, od krańca ziemi aż do krańca nieba."
  tags: []
"Mk13,28":
  text: "A od drzewa figowego uczcie się przez podobieństwo: Gdy już jego gałąź staje się miękka i wypuszcza liście, poznajecie, że lato jest blisko."
  tags: []
"Mk13,29":
  text: "Tak i wy, gdy ujrzycie, że to się dzieje, wiedzcie, że jest blisko, u drzwi."
  tags: []
"Mk13,30":
  text: "Zaprawdę powiadam wam: Nie przeminie to pokolenie, aż się to wszystko stanie."
  tags: []
"Mk13,31":
  text: "Niebo i ziemia przeminą, ale moje słowa nie przeminą."
  tags: []
"Mk13,32":
  text: "Lecz o tym dniu i godzinie nikt nie wie, ani aniołowie, którzy są w niebie, ani Syn, tylko Ojciec."
  tags: []
"Mk13,33":
  text: "Uważajcie, czuwajcie i módlcie się, bo nie wiecie, kiedy ten czas nadejdzie."
  tags: []
"Mk13,34":
  text: "Syn Człowieczy bowiem jest jak człowiek, który wyjeżdżając, zostawił swój dom, dał władzę swoim sługom i każdemu jego pracę, a odźwiernemu nakazał czuwać."
  tags: []
"Mk13,35":
  text: "Czuwajcie więc, bo nie wiecie, kiedy pan domu przyjdzie: wieczorem czy o północy, gdy pieją koguty czy rano;"
  tags: []
"Mk13,36":
  text: "By przypadkiem, przyszedłszy niespodziewanie, nie zastał was śpiących."
  tags: []
"Mk13,37":
  text: "A to, co wam mówię, mówię wszystkim: Czuwajcie!"
  tags: []
