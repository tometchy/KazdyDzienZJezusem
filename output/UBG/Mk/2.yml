"Mk2,1":
  text: "A po kilku dniach znowu przyszedł do Kafarnaum i usłyszano, że jest w domu."
  tags: []
"Mk2,2":
  text: "I zaraz zeszło się tak wielu ludzi, że nie mogli się zmieścić nawet przed drzwiami. I głosił im słowo Boże."
  tags: []
"Mk2,3":
  text: "Wtedy przyszli do niego, niosąc sparaliżowanego, a niosło go czterech ludzi."
  tags: []
"Mk2,4":
  text: "A gdy nie mogli do niego podejść z powodu tłumu, odkryli dach nad miejscem, gdzie był Jezus, wyłamali go i spuścili na dół posłanie, na którym leżał sparaliżowany."
  tags: []
"Mk2,5":
  text: "A Jezus, widząc ich wiarę, powiedział do sparaliżowanego: Synu, twoje grzechy są ci przebaczone."
  tags: []
"Mk2,6":
  text: "A byli tam niektórzy z uczonych w Piśmie, siedząc i myśląc w swoich sercach:"
  tags: []
"Mk2,7":
  text: "Czemu on mówi takie bluźnierstwa? Któż może przebaczać grzechy oprócz samego Boga?"
  tags: []
"Mk2,8":
  text: "A zaraz Jezus, poznawszy w swym duchu, że tak myśleli, powiedział do nich: Czemuż tak myślicie w swoich sercach?"
  tags: []
"Mk2,9":
  text: "Cóż jest łatwiej – powiedzieć sparaliżowanemu: Przebaczone są ci grzechy, czy powiedzieć: Wstań, weź swoje posłanie i chodź?"
  tags: []
"Mk2,10":
  text: "Ale żebyście wiedzieli, że Syn Człowieczy ma na ziemi moc przebaczać grzechy – powiedział do sparaliżowanego:"
  tags: []
"Mk2,11":
  text: "Mówię ci: Wstań, weź swoje posłanie i idź do domu."
  tags: []
"Mk2,12":
  text: "A on natychmiast wstał, wziął swoje posłanie i wyszedł na oczach wszystkich, tak że wszyscy byli zdumieni i chwalili Boga, mówiąc: Nigdy nie widzieliśmy czegoś takiego."
  tags: []
"Mk2,13":
  text: "I wyszedł znów nad morze. I przychodził do niego cały lud, a on ich nauczał."
  tags: []
"Mk2,14":
  text: "A przechodząc, zobaczył Lewiego, syna Alfeusza, siedzącego w punkcie celnym, i powiedział do niego: Pójdź za mną. A on wstał i poszedł za nim."
  tags: []
"Mk2,15":
  text: "Kiedy Jezus siedział za stołem w jego domu, razem z Jezusem i jego uczniami siedziało wielu celników i grzeszników. Było ich bowiem wielu i chodzili za nim."
  tags: []
"Mk2,16":
  text: "A uczeni w Piśmie i faryzeusze, widząc, że je z celnikami i grzesznikami, mówili do jego uczniów: Cóż to jest, że on je i pije z celnikami i grzesznikami?"
  tags: []
"Mk2,17":
  text: "A Jezus, usłyszawszy to, powiedział im: Nie zdrowi, lecz chorzy potrzebują lekarza. Nie przyszedłem wzywać do pokuty sprawiedliwych, ale grzeszników."
  tags: []
"Mk2,18":
  text: "A uczniowie Jana i faryzeuszy pościli. Przyszli więc i pytali go: Czemu uczniowie Jana i faryzeuszy poszczą, a twoi uczniowie nie poszczą?"
  tags: []
"Mk2,19":
  text: "I odpowiedział im Jezus: Czy przyjaciele oblubieńca mogą pościć, gdy jest z nimi oblubieniec? Dopóki mają ze sobą oblubieńca, nie mogą pościć."
  tags: []
"Mk2,20":
  text: "Lecz przyjdą dni, gdy oblubieniec zostanie od nich zabrany, a wtedy, w tych dniach, będą pościć."
  tags: []
"Mk2,21":
  text: "Nikt nie przyszywa łaty z nowego sukna do starej szaty, inaczej nowa łata ujmuje nieco od starej szaty i rozdarcie staje się gorsze."
  tags: []
"Mk2,22":
  text: "Nikt też nie wlewa młodego wina do starych bukłaków, bo inaczej młode wino rozsadza bukłaki i wino wycieka, a bukłaki się psują. Lecz nowe wino należy wlewać do nowych bukłaków."
  tags: []
"Mk2,23":
  text: "A gdy Jezus szedł w szabat przez zboża, jego uczniowie zaczęli po drodze zrywać kłosy."
  tags: []
"Mk2,24":
  text: "Wtedy faryzeusze mówili do niego: Spójrz, czemu oni robią w szabat to, czego nie wolno robić?"
  tags: []
"Mk2,25":
  text: "A on im odpowiedział: Nigdy nie czytaliście, co zrobił Dawid, gdy znalazł się w potrzebie i był głodny, on i ci, którzy z nim byli?"
  tags: []
"Mk2,26":
  text: "Jak wszedł do domu Bożego za Abiatara, najwyższego kapłana, i jadł chleby pokładne, których nie wolno było jeść nikomu oprócz kapłanów, i dał również tym, którzy z nim byli?"
  tags: []
"Mk2,27":
  text: "Powiedział im także: Szabat został ustanowiony dla człowieka, a nie człowiek dla szabatu."
  tags: []
"Mk2,28":
  text: "Dlatego Syn Człowieczy jest też Panem szabatu."
  tags: []
