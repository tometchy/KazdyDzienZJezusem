"Mk9,1":
  text: "I mówił im: Zaprawdę powiadam wam, że niektórzy z tych, co tu stoją, nie zakosztują śmierci, aż ujrzą królestwo Boże przychodzące w mocy."
  tags: []
"Mk9,2":
  text: "A po sześciu dniach Jezus wziął ze sobą Piotra, Jakuba i Jana i wprowadził ich samych na wysoką górę, żeby byli na osobności. I przemienił się przed nimi."
  tags: []
"Mk9,3":
  text: "A jego szaty stały się lśniące i bardzo białe, jak śnieg, jak żaden folusznik na ziemi nie potrafi wybielić."
  tags: []
"Mk9,4":
  text: "I ukazał się im Eliasz z Mojżeszem, którzy rozmawiali z Jezusem."
  tags: []
"Mk9,5":
  text: "Wtedy Piotr powiedział do Jezusa: Mistrzu, dobrze nam tu być. Postawmy więc trzy namioty: jeden dla ciebie, jeden dla Mojżesza i jeden dla Eliasza."
  tags: []
"Mk9,6":
  text: "Nie wiedział bowiem, co ma powiedzieć, gdyż byli przestraszeni."
  tags: []
"Mk9,7":
  text: "I pojawił się obłok, który ich zacienił, a z obłoku rozległ się głos: To jest mój umiłowany Syn, jego słuchajcie."
  tags: []
"Mk9,8":
  text: "A nagle, gdy się rozejrzeli, nikogo już nie widzieli obok siebie, tylko samego Jezusa."
  tags: []
"Mk9,9":
  text: "A gdy schodzili z góry, przykazał im, aby nikomu nie mówili o tym, co widzieli, aż Syn Człowieczy powstanie z martwych."
  tags: []
"Mk9,10":
  text: "I zachowali te słowa dla siebie, rozprawiając między sobą, co znaczy powstać z martwych."
  tags: []
"Mk9,11":
  text: "I pytali go: Dlaczego uczeni w Piśmie mówią, że najpierw ma przyjść Eliasz?"
  tags: []
"Mk9,12":
  text: "A on im odpowiedział: Istotnie, najpierw przyjdzie Eliasz i wszystko odnowi, a jak jest napisane o Synu Człowieczym, że musi wiele cierpieć i za nic być poczytany."
  tags: []
"Mk9,13":
  text: "Ale mówię wam, że Eliasz już przyszedł i zrobili z nim, co chcieli, jak jest o nim napisane."
  tags: []
"Mk9,14":
  text: "A przyszedłszy do uczniów, zobaczył wielki tłum wokół nich oraz uczonych w Piśmie, którzy rozprawiali z nimi."
  tags: []
"Mk9,15":
  text: "Wszyscy ludzie, gdy tylko go zobaczyli, zdumieli się i przybiegłszy, witali go."
  tags: []
"Mk9,16":
  text: "I zapytał uczonych w Piśmie: O czym rozprawiacie z nimi?"
  tags: []
"Mk9,17":
  text: "A jeden z tłumu odpowiedział: Nauczycielu, przyprowadziłem do ciebie mego syna, który ma ducha niemego."
  tags: []
"Mk9,18":
  text: "Ten, gdziekolwiek go chwyci, szarpie nim, a on się pieni, zgrzyta zębami i schnie. I mówiłem twoim uczniom, aby go wypędzili, ale nie mogli."
  tags: []
"Mk9,19":
  text: "A on mu odpowiedział: O pokolenie bez wiary! Jak długo będę z wami? Jak długo mam was znosić? Przyprowadźcie go do mnie."
  tags: []
"Mk9,20":
  text: "I przyprowadzili go do niego. A gdy tylko go zobaczył, zaraz duch nim szarpnął, a on upadł na ziemię i tarzał się z pianą na ustach."
  tags: []
"Mk9,21":
  text: "Jezus zapytał jego ojca: Od jak dawna mu się to zdarza? A on odpowiedział: Od dzieciństwa."
  tags: []
"Mk9,22":
  text: "I często wrzucał go w ogień i w wodę, żeby go zgubić. Ale jeśli możesz coś zrobić, zlituj się nad nami i pomóż nam."
  tags: []
"Mk9,23":
  text: "Jezus mu powiedział: Jeśli możesz wierzyć. Wszystko jest możliwe dla tego, kto wierzy."
  tags: []
"Mk9,24":
  text: "I natychmiast ojciec tego chłopca zawołał ze łzami: Wierzę, Panie! Pomóż mojej niewierze!"
  tags: []
"Mk9,25":
  text: "A Jezus, widząc, że ludzie się zbiegają, zgromił ducha nieczystego, mówiąc: Duchu niemy i głuchy! Rozkazuję ci, wyjdź z niego i więcej w niego nie wchodź."
  tags: []
"Mk9,26":
  text: "Wtedy duch krzyknął i szarpiąc nim gwałtownie, wyszedł. A chłopiec wyglądał jak martwy, tak że wielu mówiło, iż umarł."
  tags: []
"Mk9,27":
  text: "Lecz Jezus ujął go za rękę i podniósł, a on wstał."
  tags: []
"Mk9,28":
  text: "A gdy wszedł do domu, jego uczniowie pytali go na osobności: Czemu my nie mogliśmy go wypędzić?"
  tags: []
"Mk9,29":
  text: "I odpowiedział im: Ten rodzaj demonów nie wychodzi inaczej, jak tylko przez modlitwę i post."
  tags: []
"Mk9,30":
  text: "A wyszedłszy stamtąd, przechodzili przez Galileę. On jednak nie chciał, aby ktoś o tym wiedział."
  tags: []
"Mk9,31":
  text: "Nauczał bowiem swoich uczniów i mówił im: Syn Człowieczy będzie wydany w ręce ludzi i zabiją go, ale gdy będzie zabity, trzeciego dnia zmartwychwstanie."
  tags: []
"Mk9,32":
  text: "Oni jednak nie rozumieli tych słów, a bali się go zapytać."
  tags: []
"Mk9,33":
  text: "I przyszedł do Kafarnaum. A gdy był w domu, zapytał ich: O czym rozmawialiście między sobą w drodze?"
  tags: []
"Mk9,34":
  text: "Lecz oni milczeli. W drodze bowiem rozmawiali między sobą o tym, kto z nich jest największy."
  tags: []
"Mk9,35":
  text: "A usiadłszy, zawołał dwunastu i powiedział im: Jeśli ktoś chce być pierwszy, niech będzie ostatnim ze wszystkich i sługą wszystkich."
  tags: []
"Mk9,36":
  text: "I wziął dziecko, postawił je pośrodku nich, a wziąwszy je na ręce, powiedział do nich:"
  tags: []
"Mk9,37":
  text: "Kto przyjmie jedno z takich dzieci w moje imię, mnie przyjmuje, a kto mnie przyjmie, nie mnie przyjmuje, ale tego, który mnie posłał."
  tags: []
"Mk9,38":
  text: "Wtedy Jan powiedział do niego: Nauczycielu, widzieliśmy kogoś, kto w twoim imieniu wypędzał demony, a nie chodzi z nami. Zabranialiśmy mu więc, bo nie chodzi z nami."
  tags: []
"Mk9,39":
  text: "Ale Jezus powiedział: Nie zabraniajcie mu. Nie ma bowiem nikogo, kto czyniłby cuda w moim imieniu i mógł tak łatwo źle o mnie mówić."
  tags: []
"Mk9,40":
  text: "Bo kto nie jest przeciwko nam, ten jest z nami."
  tags: []
"Mk9,41":
  text: "Kto bowiem poda wam kubek wody w moje imię, dlatego że należycie do Chrystusa, zaprawdę powiadam wam, nie straci swojej nagrody."
  tags: []
"Mk9,42":
  text: "A kto zgorszy jednego z tych małych, którzy we mnie wierzą, o wiele lepiej byłoby dla niego, gdyby zawieszono mu u szyi kamień młyński i wrzucono go do morza."
  tags: []
"Mk9,43":
  text: "Jeśli twoja ręka jest ci powodem upadku, odetnij ją. Lepiej bowiem jest dla ciebie ułomnym wejść do życia, niż mając dwie ręce, pójść do piekła, w ogień nieugaszony;"
  tags: []
"Mk9,44":
  text: "Gdzie robak ich nie umiera, a ogień nie gaśnie."
  tags: []
"Mk9,45":
  text: "A jeśli twoja noga jest ci powodem upadku, odetnij ją. Lepiej bowiem jest dla ciebie chromym wejść do życia, niż mając dwie nogi, zostać wrzuconym do piekła, w ogień nieugaszony;"
  tags: []
"Mk9,46":
  text: "Gdzie robak ich nie umiera, a ogień nie gaśnie."
  tags: []
"Mk9,47":
  text: "Jeśli zaś twoje oko jest ci powodem upadku, wyłup je. Lepiej bowiem jest dla ciebie jednookim wejść do królestwa Bożego, niż mając dwoje oczu, zostać wrzuconym do ognia piekielnego;"
  tags: []
"Mk9,48":
  text: "Gdzie robak ich nie umiera, a ogień nie gaśnie."
  tags: []
"Mk9,49":
  text: "Każdy bowiem ogniem będzie posolony i każda ofiara solą będzie posolona."
  tags: []
"Mk9,50":
  text: "Dobra jest sól. Lecz jeśli sól przestanie być słona, czymże ją przyprawicie? Miejcie sól w samych sobie i zachowujcie pokój między sobą."
  tags: []
