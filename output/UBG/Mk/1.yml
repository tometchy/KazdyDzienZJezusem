"Mk1,1":
  text: "Początek ewangelii Jezusa Chrystusa, Syna Bożego."
  tags: []
"Mk1,2":
  text: "Jak jest napisane u Proroków: Oto ja posyłam mego posłańca przed twoim obliczem, który przygotuje twoją drogę przed tobą."
  tags: []
"Mk1,3":
  text: "Głos wołającego na pustyni: Przygotujcie drogę Pana, prostujcie jego ścieżki."
  tags: []
"Mk1,4":
  text: "Jan chrzcił na pustyni i głosił chrzest pokuty na przebaczenie grzechów."
  tags: []
"Mk1,5":
  text: "I przychodziła do niego cała kraina judzka i mieszkańcy Jerozolimy, i wszyscy byli chrzczeni przez niego w rzece Jordan, wyznając swoje grzechy."
  tags: []
"Mk1,6":
  text: "Jan ubierał się w sierść wielbłądzią i miał skórzany pas wokół swoich bioder, a jadał szarańczę i miód leśny."
  tags: []
"Mk1,7":
  text: "I głosił: Idzie za mną mocniejszy ode mnie, któremu nie jestem godny, schyliwszy się, rozwiązać rzemyka u jego obuwia."
  tags: []
"Mk1,8":
  text: "Ja chrzciłem was wodą, ale on będzie was chrzcił Duchem Świętym."
  tags: []
"Mk1,9":
  text: "A w tych dniach przyszedł Jezus z Nazaretu w Galilei i został ochrzczony przez Jana w Jordanie."
  tags: []
"Mk1,10":
  text: "A zaraz, wychodząc z wody, ujrzał rozstępujące się niebiosa i Ducha jak gołębicę zstępującego na niego."
  tags: []
"Mk1,11":
  text: "I rozległ się głos z nieba: Ty jesteś moim umiłowanym Synem, w którym mam upodobanie."
  tags: []
"Mk1,12":
  text: "I zaraz Duch zapędził go na pustynię."
  tags: []
"Mk1,13":
  text: "Był tam na pustyni czterdzieści dni, będąc kuszony przez szatana. I przebywał wśród zwierząt, a aniołowie służyli mu."
  tags: []
"Mk1,14":
  text: "Lecz potem, gdy Jan został wtrącony do więzienia, Jezus przyszedł do Galilei, głosząc ewangelię królestwa Bożego;"
  tags: []
"Mk1,15":
  text: "I mówiąc: Wypełnił się czas i przybliżyło się królestwo Boże. Pokutujcie i wierzcie ewangelii."
  tags: []
"Mk1,16":
  text: "A przechadzając się nad Morzem Galilejskim, zobaczył Szymona i Andrzeja, jego brata, zarzucających sieć w morze; byli bowiem rybakami."
  tags: []
"Mk1,17":
  text: "I powiedział do nich Jezus: Pójdźcie za mną, a sprawię, że staniecie się rybakami ludzi."
  tags: []
"Mk1,18":
  text: "A oni natychmiast zostawili swoje sieci i poszli za nim."
  tags: []
"Mk1,19":
  text: "Gdy zaś odszedł stamtąd nieco dalej, zobaczył Jakuba, syna Zebedeusza, i Jana, jego brata, którzy w łodzi naprawiali sieci."
  tags: []
"Mk1,20":
  text: "I zaraz ich powołał, a oni zostawili swego ojca Zebedeusza w łodzi z najemnikami i poszli za nim."
  tags: []
"Mk1,21":
  text: "Potem weszli do Kafarnaum, a zaraz w szabat Jezus wszedł do synagogi i nauczał."
  tags: []
"Mk1,22":
  text: "I zdumiewali się jego nauką, uczył ich bowiem jak ten, który ma moc, a nie jak uczeni w Piśmie."
  tags: []
"Mk1,23":
  text: "A w ich synagodze był człowiek mający ducha nieczystego, który zawołał:"
  tags: []
"Mk1,24":
  text: "Ach, cóż my z tobą mamy, Jezusie z Nazaretu? Przyszedłeś nas zniszczyć? Wiem, kim jesteś: Świętym Boga."
  tags: []
"Mk1,25":
  text: "I zgromił go Jezus: Zamilcz i wyjdź z niego!"
  tags: []
"Mk1,26":
  text: "Wtedy duch nieczysty szarpnął nim i zawoławszy donośnym głosem, wyszedł z niego."
  tags: []
"Mk1,27":
  text: "I zdumieli się wszyscy, tak że pytali się między sobą: Cóż to jest? Co to za nowa nauka, że z mocą rozkazuje nawet duchom nieczystym i są mu posłuszne?"
  tags: []
"Mk1,28":
  text: "I wieść o nim szybko się rozeszła po całej okolicy wokół Galilei."
  tags: []
"Mk1,29":
  text: "A zaraz po wyjściu z synagogi przyszli z Jakubem i Janem do domu Szymona i Andrzeja."
  tags: []
"Mk1,30":
  text: "A teściowa Szymona leżała w gorączce. Od razu też powiedzieli mu o niej."
  tags: []
"Mk1,31":
  text: "Podszedł więc i podniósł ją, ująwszy za rękę, i natychmiast opuściła ją gorączka. A ona usługiwała im."
  tags: []
"Mk1,32":
  text: "Kiedy nastał wieczór i zaszło słońce, przynosili do niego wszystkich chorych oraz opętanych."
  tags: []
"Mk1,33":
  text: "A całe miasto zgromadziło się przed drzwiami."
  tags: []
"Mk1,34":
  text: "On zaś uzdrowił wielu cierpiących na różne choroby i wypędził wiele demonów, a nie pozwolił demonom mówić, bo go znały."
  tags: []
"Mk1,35":
  text: "A wstawszy wczesnym rankiem, przed świtem, wyszedł i udał się na odludne miejsce, i tam się modlił."
  tags: []
"Mk1,36":
  text: "Poszli też za nim Szymon i ci, którzy z nim byli."
  tags: []
"Mk1,37":
  text: "A znalazłszy go, powiedzieli mu: Wszyscy cię szukają."
  tags: []
"Mk1,38":
  text: "Wtedy im powiedział: Chodźmy do przyległych miasteczek, abym i tam głosił, bo po to przyszedłem."
  tags: []
"Mk1,39":
  text: "I głosił w ich synagogach po całej Galilei, i wypędzał demony."
  tags: []
"Mk1,40":
  text: "Wtedy przyszedł do niego trędowaty, upadł przed nim na kolana i prosił go: Jeśli chcesz, możesz mnie oczyścić."
  tags: []
"Mk1,41":
  text: "A Jezus, zdjęty litością, wyciągnął rękę, dotknął go i powiedział do niego: Chcę, bądź oczyszczony!"
  tags: []
"Mk1,42":
  text: "Gdy Pan to powiedział, natychmiast trąd go opuścił i został oczyszczony."
  tags: []
"Mk1,43":
  text: "A Jezus surowo mu przykazał i zaraz go odprawił;"
  tags: []
"Mk1,44":
  text: "Mówiąc: Uważaj, abyś nikomu nic nie mówił, ale idź, pokaż się kapłanowi i ofiaruj za swoje oczyszczenie to, co nakazał Mojżesz, na świadectwo dla nich."
  tags: []
"Mk1,45":
  text: "Lecz on odszedł i zaczął bardzo to rozpowiadać i rozgłaszać, tak że Jezus nie mógł już jawnie wejść do miasta, ale przebywał na zewnątrz, w miejscach odludnych. A ludzie zewsząd schodzili się do niego."
  tags: []
