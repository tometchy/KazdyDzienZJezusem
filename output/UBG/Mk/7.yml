"Mk7,1":
  text: "Wtedy zgromadzili się wokół niego faryzeusze i pewni uczeni w Piśmie, którzy przybyli z Jerozolimy."
  tags: []
"Mk7,2":
  text: "A gdy zobaczyli, że niektórzy z jego uczniów jedzą chleb nieczystymi, to znaczy nieumytymi rękami, ganili to."
  tags: []
"Mk7,3":
  text: "Faryzeusze bowiem i wszyscy Żydzi, trzymając się tradycji starszych, nie jedzą, jeśli dokładnie nie umyją rąk."
  tags: []
"Mk7,4":
  text: "I po powrocie z rynku nie jedzą, jeśli się nie umyją. Jest jeszcze wiele innych zwyczajów, które przyjęli po to, by je zachowywać, jak obmywanie kubków, dzbanów, naczyń miedzianych i stołów."
  tags: []
"Mk7,5":
  text: "Zapytali go więc faryzeusze i uczeni w Piśmie: Dlaczego twoi uczniowie nie postępują według tradycji starszych, lecz jedzą chleb nieumytymi rękami?"
  tags: []
"Mk7,6":
  text: "Wtedy on im odpowiedział: Dobrze Izajasz prorokował o was, obłudnikach, jak jest napisane: Ten lud czci mnie wargami, ale ich serce daleko jest ode mnie."
  tags: []
"Mk7,7":
  text: "Lecz na próżno mnie czczą, ucząc nauk, które są nakazami ludzkimi."
  tags: []
"Mk7,8":
  text: "Wy bowiem, opuściwszy przykazania Boże, trzymacie się tradycji ludzkiej, obmywania dzbanków i kubków. I wiele innych tym podobnych rzeczy czynicie."
  tags: []
"Mk7,9":
  text: "Mówił im też: Całkowicie znosicie przykazanie Boże, aby zachować swoją tradycję."
  tags: []
"Mk7,10":
  text: "Mojżesz bowiem powiedział: Czcij swego ojca i swoją matkę, oraz: Kto złorzeczy ojcu albo matce, niech poniesie śmierć."
  tags: []
"Mk7,11":
  text: "Ale wy mówicie: Jeśli człowiek powie ojcu albo matce: To, co powinieneś otrzymać ode mnie jako pomoc, to Korban, to znaczy dar przeznaczony na ofiarę – będzie bez winy."
  tags: []
"Mk7,12":
  text: "I nie pozwalacie mu nic więcej uczynić dla swego ojca albo matki;"
  tags: []
"Mk7,13":
  text: "Wniwecz obracając słowo Boże przez waszą tradycję, którą przekazaliście. I wiele innych tym podobnych rzeczy czynicie."
  tags: []
"Mk7,14":
  text: "A zwoławszy wszystkich ludzi, mówił do nich: Słuchajcie mnie wszyscy i zrozumiejcie."
  tags: []
"Mk7,15":
  text: "Nie ma nic z zewnątrz, co wchodząc w człowieka, mogłoby go skalać, ale to, co z niego wychodzi, to kala człowieka."
  tags: []
"Mk7,16":
  text: "Jeśli ktoś ma uszy do słuchania, niech słucha."
  tags: []
"Mk7,17":
  text: "A gdy oddalił się od ludzi i wszedł do domu, jego uczniowie pytali go o tę przypowieść."
  tags: []
"Mk7,18":
  text: "Wtedy powiedział im: Czy i wy jesteście tak bezrozumni? Czyż nie rozumiecie, że wszystko, co z zewnątrz wchodzi w człowieka, nie może go skalać?"
  tags: []
"Mk7,19":
  text: "Nie wchodzi bowiem do jego serca, ale do żołądka i zostaje wydalone do ustępu, oczyszczając wszystkie pokarmy."
  tags: []
"Mk7,20":
  text: "I powiedział: Co wychodzi z człowieka, to kala człowieka."
  tags: []
"Mk7,21":
  text: "Z wnętrza bowiem, z serca ludzkiego pochodzą złe myśli, cudzołóstwa, nierząd, zabójstwa;"
  tags: []
"Mk7,22":
  text: "Kradzieże, chciwość, niegodziwość, podstęp, wyuzdanie, oko złe, bluźnierstwo, pycha, głupota."
  tags: []
"Mk7,23":
  text: "Całe to zło pochodzi z wnętrza i kala człowieka."
  tags: []
"Mk7,24":
  text: "Odszedł stamtąd i udał się w okolice Tyru i Sydonu. A wszedłszy do pewnego domu, nie chciał, aby ktoś o tym wiedział. Nie mógł się jednak ukryć."
  tags: []
"Mk7,25":
  text: "Usłyszała bowiem o nim kobieta, której córeczka miała ducha nieczystego, i przyszła, i upadła mu do nóg."
  tags: []
"Mk7,26":
  text: "A kobieta ta była Greczynką, rodem z Syrofenicji, i prosiła go, aby wypędził demona z jej córki."
  tags: []
"Mk7,27":
  text: "Ale Jezus jej powiedział: Niech najpierw nasycą się dzieci, bo niedobrze jest brać chleb dzieci i rzucać szczeniętom."
  tags: []
"Mk7,28":
  text: "A ona odpowiedziała mu: Tak, Panie, lecz i szczenięta jadają pod stołem z okruszyn dzieci."
  tags: []
"Mk7,29":
  text: "I powiedział do niej: Ze względu na te słowa idź, demon wyszedł z twojej córki."
  tags: []
"Mk7,30":
  text: "A gdy wróciła do swego domu, spostrzegła, że demon wyszedł, a córka leżała na łóżku."
  tags: []
"Mk7,31":
  text: "Kiedy znowu opuścił okolice Tyru i Sydonu, przyszedł nad Morze Galilejskie przez środek krainy Dekapolu."
  tags: []
"Mk7,32":
  text: "I przyprowadzili do niego głuchego, który miał trudności z mówieniem, i prosili go, aby położył na niego rękę."
  tags: []
"Mk7,33":
  text: "Pan, wziąwszy go z tłumu na bok, włożył palce w jego uszy i splunąwszy, dotknął jego języka;"
  tags: []
"Mk7,34":
  text: "A spojrzawszy w niebo, westchnął i powiedział do niego: Effatha, to znaczy: Otwórz się."
  tags: []
"Mk7,35":
  text: "Zaraz też otworzyły się jego uszy i rozwiązały się więzy jego języka, i mówił poprawnie."
  tags: []
"Mk7,36":
  text: "Wtedy im nakazał, aby tego nikomu nie mówili. Ale im bardziej im nakazywał, tym bardziej to rozgłaszali."
  tags: []
"Mk7,37":
  text: "I niezmiernie się zdumiewali, mówiąc: Dobrze wszystko uczynił. Sprawia, że głusi słyszą i niemi mówią."
  tags: []
