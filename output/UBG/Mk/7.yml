"Mk7,1": "Wtedy zgromadzili się wokół niego faryzeusze i pewni uczeni w Piśmie, którzy przybyli z Jerozolimy."
"Mk7,2": "A gdy zobaczyli, że niektórzy z jego uczniów jedzą chleb nieczystymi, to znaczy nieumytymi rękami, ganili to."
"Mk7,3": "Faryzeusze bowiem i wszyscy Żydzi, trzymając się tradycji starszych, nie jedzą, jeśli dokładnie nie umyją rąk."
"Mk7,4": "I po powrocie z rynku nie jedzą, jeśli się nie umyją. Jest jeszcze wiele innych zwyczajów, które przyjęli po to, by je zachowywać, jak obmywanie kubków, dzbanów, naczyń miedzianych i stołów."
"Mk7,5": "Zapytali go więc faryzeusze i uczeni w Piśmie: Dlaczego twoi uczniowie nie postępują według tradycji starszych, lecz jedzą chleb nieumytymi rękami?"
"Mk7,6": "Wtedy on im odpowiedział: Dobrze Izajasz prorokował o was, obłudnikach, jak jest napisane: Ten lud czci mnie wargami, ale ich serce daleko jest ode mnie."
"Mk7,7": "Lecz na próżno mnie czczą, ucząc nauk, które są nakazami ludzkimi."
"Mk7,8": "Wy bowiem, opuściwszy przykazania Boże, trzymacie się tradycji ludzkiej, obmywania dzbanków i kubków. I wiele innych tym podobnych rzeczy czynicie."
"Mk7,9": "Mówił im też: Całkowicie znosicie przykazanie Boże, aby zachować swoją tradycję."
"Mk7,10": "Mojżesz bowiem powiedział: Czcij swego ojca i swoją matkę, oraz: Kto złorzeczy ojcu albo matce, niech poniesie śmierć."
"Mk7,11": "Ale wy mówicie: Jeśli człowiek powie ojcu albo matce: To, co powinieneś otrzymać ode mnie jako pomoc, to Korban, to znaczy dar przeznaczony na ofiarę – będzie bez winy."
"Mk7,12": "I nie pozwalacie mu nic więcej uczynić dla swego ojca albo matki;"
"Mk7,13": "Wniwecz obracając słowo Boże przez waszą tradycję, którą przekazaliście. I wiele innych tym podobnych rzeczy czynicie."
"Mk7,14": "A zwoławszy wszystkich ludzi, mówił do nich: Słuchajcie mnie wszyscy i zrozumiejcie."
"Mk7,15": "Nie ma nic z zewnątrz, co wchodząc w człowieka, mogłoby go skalać, ale to, co z niego wychodzi, to kala człowieka."
"Mk7,16": "Jeśli ktoś ma uszy do słuchania, niech słucha."
"Mk7,17": "A gdy oddalił się od ludzi i wszedł do domu, jego uczniowie pytali go o tę przypowieść."
"Mk7,18": "Wtedy powiedział im: Czy i wy jesteście tak bezrozumni? Czyż nie rozumiecie, że wszystko, co z zewnątrz wchodzi w człowieka, nie może go skalać?"
"Mk7,19": "Nie wchodzi bowiem do jego serca, ale do żołądka i zostaje wydalone do ustępu, oczyszczając wszystkie pokarmy."
"Mk7,20": "I powiedział: Co wychodzi z człowieka, to kala człowieka."
"Mk7,21": "Z wnętrza bowiem, z serca ludzkiego pochodzą złe myśli, cudzołóstwa, nierząd, zabójstwa;"
"Mk7,22": "Kradzieże, chciwość, niegodziwość, podstęp, wyuzdanie, oko złe, bluźnierstwo, pycha, głupota."
"Mk7,23": "Całe to zło pochodzi z wnętrza i kala człowieka."
"Mk7,24": "Odszedł stamtąd i udał się w okolice Tyru i Sydonu. A wszedłszy do pewnego domu, nie chciał, aby ktoś o tym wiedział. Nie mógł się jednak ukryć."
"Mk7,25": "Usłyszała bowiem o nim kobieta, której córeczka miała ducha nieczystego, i przyszła, i upadła mu do nóg."
"Mk7,26": "A kobieta ta była Greczynką, rodem z Syrofenicji, i prosiła go, aby wypędził demona z jej córki."
"Mk7,27": "Ale Jezus jej powiedział: Niech najpierw nasycą się dzieci, bo niedobrze jest brać chleb dzieci i rzucać szczeniętom."
"Mk7,28": "A ona odpowiedziała mu: Tak, Panie, lecz i szczenięta jadają pod stołem z okruszyn dzieci."
"Mk7,29": "I powiedział do niej: Ze względu na te słowa idź, demon wyszedł z twojej córki."
"Mk7,30": "A gdy wróciła do swego domu, spostrzegła, że demon wyszedł, a córka leżała na łóżku."
"Mk7,31": "Kiedy znowu opuścił okolice Tyru i Sydonu, przyszedł nad Morze Galilejskie przez środek krainy Dekapolu."
"Mk7,32": "I przyprowadzili do niego głuchego, który miał trudności z mówieniem, i prosili go, aby położył na niego rękę."
"Mk7,33": "Pan, wziąwszy go z tłumu na bok, włożył palce w jego uszy i splunąwszy, dotknął jego języka;"
"Mk7,34": "A spojrzawszy w niebo, westchnął i powiedział do niego: Effatha, to znaczy: Otwórz się."
"Mk7,35": "Zaraz też otworzyły się jego uszy i rozwiązały się więzy jego języka, i mówił poprawnie."
"Mk7,36": "Wtedy im nakazał, aby tego nikomu nie mówili. Ale im bardziej im nakazywał, tym bardziej to rozgłaszali."
"Mk7,37": "I niezmiernie się zdumiewali, mówiąc: Dobrze wszystko uczynił. Sprawia, że głusi słyszą i niemi mówią."
