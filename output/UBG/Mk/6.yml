"Mk6,1": "I wyszedłszy stamtąd, przyszedł w swoje rodzinne strony, a szli za nim jego uczniowie."
"Mk6,2": "A gdy nadszedł szabat, zaczął nauczać w synagodze. Wielu zaś, słuchając go, zdumiewało się i pytało: Skąd on ma to wszystko? I co to za mądrość, która jest mu dana, że nawet takie cuda dzieją się przez jego ręce?"
"Mk6,3": "Czy to nie jest cieśla, syn Marii, a brat Jakuba, Józefa, Judy i Szymona? Czyż nie ma tu wśród nas także jego sióstr? I gorszyli się z jego powodu."
"Mk6,4": "Ale Jezus powiedział do nich: Nigdzie nie jest prorok bez czci, tylko w swojej ojczyźnie, wśród swoich krewnych i w swoim domu."
"Mk6,5": "I nie mógł tam uczynić żadnego cudu oprócz tego, że uzdrowił niektórych chorych, kładąc na nich ręce."
"Mk6,6": "I dziwił się ich niedowiarstwu. Potem obchodził okoliczne wioski, nauczając."
"Mk6,7": "Wtedy, przywoławszy do siebie dwunastu, zaczął ich rozsyłać po dwóch. Dał im też moc nad duchami nieczystymi."
"Mk6,8": "I nakazał im, aby oprócz laski nie brali na drogę niczego: ani torby, ani chleba, ani pieniędzy w trzosie;"
"Mk6,9": "Lecz żeby założyli sandały i nie wkładali dwóch szat."
"Mk6,10": "Potem mówił do nich: Gdziekolwiek wejdziecie do jakiegoś domu, zostańcie tam, dopóki stamtąd nie odejdziecie."
"Mk6,11": "A jeśli was ktoś nie przyjmie i nie usłucha, wyszedłszy stamtąd, strząśnijcie pył z waszych nóg na świadectwo przeciwko nim. Zaprawdę powiadam wam: Lżej będzie Sodomie i Gomorze w dzień sądu niż temu miastu."
"Mk6,12": "Wtedy wyszli i głosili, że ludzie powinni pokutować."
"Mk6,13": "I wypędzali wiele demonów, i wielu chorych namaszczali olejkiem, i uzdrawiali."
"Mk6,14": "I usłyszał o nim król Herod (bo jego imię się rozsławiło), i powiedział: Jan Chrzciciel zmartwychwstał, dlatego cuda dokonują się przez niego."
"Mk6,15": "A inni mówili: To Eliasz; jeszcze inni mówili: To prorok albo ktoś jak jeden z proroków."
"Mk6,16": "Gdy Herod o tym usłyszał, powiedział: To Jan, którego ściąłem. On zmartwychwstał."
"Mk6,17": "Sam Herod bowiem kazał schwytać Jana i wtrącić go do więzienia z powodu Herodiady, żony swego brata Filipa, gdyż pojął ją za żonę."
"Mk6,18": "Bo Jan mówił Herodowi: Nie wolno ci mieć żony swego brata."
"Mk6,19": "A Herodiada zawzięła się na niego i chciała go zabić, ale nie mogła."
"Mk6,20": "Herod bowiem obawiał się Jana, wiedząc, że jest człowiekiem sprawiedliwym i świętym, i miał wzgląd na niego, a słuchając go, wiele czynił; i chętnie go słuchał."
"Mk6,21": "A gdy nadeszła odpowiednia chwila, Herod, obchodząc dzień swoich urodzin, wyprawił ucztę dla swoich dostojników, dowódców wojskowych i znakomitości z Galilei."
"Mk6,22": "Kiedy córka tej Herodiady weszła i tańczyła, spodobała się Herodowi i współbiesiadnikom. Wtedy król powiedział do dziewczyny: Proś mnie, o co chcesz, a dam ci."
"Mk6,23": "I przysiągł jej: O cokolwiek mnie poprosisz, dam ci, aż do połowy mego królestwa."
"Mk6,24": "Ona więc wyszła i zapytała swoją matkę: O co mam prosić? A ta odpowiedziała: O głowę Jana Chrzciciela."
"Mk6,25": "Natychmiast też weszła z pośpiechem do króla i prosiła: Chcę, żebyś mi zaraz dał na misie głowę Jana Chrzciciela."
"Mk6,26": "I zasmucił się król bardzo, jednak ze względu na przysięgę i współbiesiadników nie chciał jej odmówić."
"Mk6,27": "Król natychmiast posłał kata i rozkazał przynieść jego głowę. A ten, poszedłszy, ściął go w więzieniu."
"Mk6,28": "Potem przyniósł na misie jego głowę i dał ją dziewczynie, a dziewczyna dała ją swojej matce."
"Mk6,29": "Gdy usłyszeli o tym jego uczniowie, przyszli, zabrali jego ciało i złożyli w grobie."
"Mk6,30": "A apostołowie zebrali się u Jezusa i opowiedzieli mu wszystko, co czynili i czego nauczali."
"Mk6,31": "I powiedział do nich: Pójdźcie wy na odludne miejsce i odpocznijcie trochę. Wielu bowiem przychodziło i odchodziło, tak że nie mieli wolnego czasu, żeby zjeść."
"Mk6,32": "I odpłynęli w łodzi na odludne miejsce, żeby być na osobności."
"Mk6,33": "A ludzie widzieli, że odpływają. Wielu go poznało i zbiegli się tam pieszo ze wszystkich miast, wyprzedzili ich i zgromadzili się przy nim."
"Mk6,34": "Kiedy Jezus wyszedł, zobaczył mnóstwo ludzi i ulitował się nad nimi, bo byli jak owce niemające pasterza. I zaczął nauczać ich wielu rzeczy."
"Mk6,35": "A gdy było już późno, jego uczniowie podeszli do niego i powiedzieli: Miejsce to jest puste, a pora już późna."
"Mk6,36": "Odpraw ich, aby poszli do okolicznych osad i wsi i kupili sobie chleba, bo nie mają co jeść."
"Mk6,37": "Lecz on im odpowiedział: Wy dajcie im jeść. Zapytali go więc: Czy mamy pójść i za dwieście groszy kupić chleba, i dać im jeść?"
"Mk6,38": "A on im powiedział: Ile macie chlebów? Idźcie i zobaczcie. A oni, dowiedziawszy się, powiedzieli: Pięć i dwie ryby."
"Mk6,39": "Wtedy kazał im posadzić wszystkich w grupach na zielonej trawie."
"Mk6,40": "I usiedli w grupach, po stu i po pięćdziesięciu."
"Mk6,41": "A wziąwszy te pięć chlebów i dwie ryby, spojrzał w niebo i pobłogosławił. I połamał te chleby i dawał swoim uczniom, aby kładli przed nimi. Także te dwie ryby rozdzielił między wszystkich."
"Mk6,42": "I jedli wszyscy do syta."
"Mk6,43": "I zebrali dwanaście pełnych koszy kawałków i resztek z ryb."
"Mk6,44": "A tych, którzy jedli chleby, było około pięciu tysięcy mężczyzn."
"Mk6,45": "I zaraz przymusił swoich uczniów, aby wsiedli do łodzi i popłynęli przed nim na drugi brzeg w kierunku Betsaidy, a on tymczasem odprawi ludzi."
"Mk6,46": "A gdy ich odprawił, odszedł na górę, aby się modlić."
"Mk6,47": "Kiedy nastał wieczór, łódź znajdowała się na środku morza, a on był sam na lądzie."
"Mk6,48": "I widział, że są zmęczeni wiosłowaniem, bo wiatr mieli przeciwny. I tak około czwartej straży nocnej przyszedł do nich, idąc po morzu, i chciał ich wyminąć."
"Mk6,49": "Ale oni, ujrzawszy go chodzącego po morzu, myśleli, że to zjawa, i krzyknęli."
"Mk6,50": "Wszyscy bowiem go widzieli i przestraszyli się. Ale on zaraz przemówił do nich tymi słowami: Ufajcie, to ja jestem! Nie bójcie się!"
"Mk6,51": "I wszedł do nich do łodzi, i uciszył się wiatr. A oni się bardzo zdumiewali i dziwili."
"Mk6,52": "Nie zrozumieli bowiem cudu z chlebami, gdyż ich serce było odrętwiałe."
"Mk6,53": "A przeprawiwszy się, przypłynęli do ziemi Genezaret i przybili do brzegu."
"Mk6,54": "A gdy wyszli z łodzi, ludzie zaraz go poznali;"
"Mk6,55": "Rozbiegli się po całej tej okolicy i zaczęli przynosić na posłaniach chorych tam, gdzie, jak słyszeli, przebywa."
"Mk6,56": "A gdziekolwiek wszedł, do wsi, miast czy osad, kładli chorych na ulicach i prosili go, aby mogli dotknąć choćby brzegu jego szaty. A wszyscy, którzy go dotknęli, zostali uzdrowieni."
