"Mk6,1":
  text: "I wyszedłszy stamtąd, przyszedł w swoje rodzinne strony, a szli za nim jego uczniowie."
  tags: []
"Mk6,2":
  text: "A gdy nadszedł szabat, zaczął nauczać w synagodze. Wielu zaś, słuchając go, zdumiewało się i pytało: Skąd on ma to wszystko? I co to za mądrość, która jest mu dana, że nawet takie cuda dzieją się przez jego ręce?"
  tags: []
"Mk6,3":
  text: "Czy to nie jest cieśla, syn Marii, a brat Jakuba, Józefa, Judy i Szymona? Czyż nie ma tu wśród nas także jego sióstr? I gorszyli się z jego powodu."
  tags: []
"Mk6,4":
  text: "Ale Jezus powiedział do nich: Nigdzie nie jest prorok bez czci, tylko w swojej ojczyźnie, wśród swoich krewnych i w swoim domu."
  tags: []
"Mk6,5":
  text: "I nie mógł tam uczynić żadnego cudu oprócz tego, że uzdrowił niektórych chorych, kładąc na nich ręce."
  tags: []
"Mk6,6":
  text: "I dziwił się ich niedowiarstwu. Potem obchodził okoliczne wioski, nauczając."
  tags: []
"Mk6,7":
  text: "Wtedy, przywoławszy do siebie dwunastu, zaczął ich rozsyłać po dwóch. Dał im też moc nad duchami nieczystymi."
  tags: []
"Mk6,8":
  text: "I nakazał im, aby oprócz laski nie brali na drogę niczego: ani torby, ani chleba, ani pieniędzy w trzosie;"
  tags: []
"Mk6,9":
  text: "Lecz żeby założyli sandały i nie wkładali dwóch szat."
  tags: []
"Mk6,10":
  text: "Potem mówił do nich: Gdziekolwiek wejdziecie do jakiegoś domu, zostańcie tam, dopóki stamtąd nie odejdziecie."
  tags: []
"Mk6,11":
  text: "A jeśli was ktoś nie przyjmie i nie usłucha, wyszedłszy stamtąd, strząśnijcie pył z waszych nóg na świadectwo przeciwko nim. Zaprawdę powiadam wam: Lżej będzie Sodomie i Gomorze w dzień sądu niż temu miastu."
  tags: []
"Mk6,12":
  text: "Wtedy wyszli i głosili, że ludzie powinni pokutować."
  tags: []
"Mk6,13":
  text: "I wypędzali wiele demonów, i wielu chorych namaszczali olejkiem, i uzdrawiali."
  tags: []
"Mk6,14":
  text: "I usłyszał o nim król Herod (bo jego imię się rozsławiło), i powiedział: Jan Chrzciciel zmartwychwstał, dlatego cuda dokonują się przez niego."
  tags: []
"Mk6,15":
  text: "A inni mówili: To Eliasz; jeszcze inni mówili: To prorok albo ktoś jak jeden z proroków."
  tags: []
"Mk6,16":
  text: "Gdy Herod o tym usłyszał, powiedział: To Jan, którego ściąłem. On zmartwychwstał."
  tags: []
"Mk6,17":
  text: "Sam Herod bowiem kazał schwytać Jana i wtrącić go do więzienia z powodu Herodiady, żony swego brata Filipa, gdyż pojął ją za żonę."
  tags: []
"Mk6,18":
  text: "Bo Jan mówił Herodowi: Nie wolno ci mieć żony swego brata."
  tags: []
"Mk6,19":
  text: "A Herodiada zawzięła się na niego i chciała go zabić, ale nie mogła."
  tags: []
"Mk6,20":
  text: "Herod bowiem obawiał się Jana, wiedząc, że jest człowiekiem sprawiedliwym i świętym, i miał wzgląd na niego, a słuchając go, wiele czynił; i chętnie go słuchał."
  tags: []
"Mk6,21":
  text: "A gdy nadeszła odpowiednia chwila, Herod, obchodząc dzień swoich urodzin, wyprawił ucztę dla swoich dostojników, dowódców wojskowych i znakomitości z Galilei."
  tags: []
"Mk6,22":
  text: "Kiedy córka tej Herodiady weszła i tańczyła, spodobała się Herodowi i współbiesiadnikom. Wtedy król powiedział do dziewczyny: Proś mnie, o co chcesz, a dam ci."
  tags: []
"Mk6,23":
  text: "I przysiągł jej: O cokolwiek mnie poprosisz, dam ci, aż do połowy mego królestwa."
  tags: []
"Mk6,24":
  text: "Ona więc wyszła i zapytała swoją matkę: O co mam prosić? A ta odpowiedziała: O głowę Jana Chrzciciela."
  tags: []
"Mk6,25":
  text: "Natychmiast też weszła z pośpiechem do króla i prosiła: Chcę, żebyś mi zaraz dał na misie głowę Jana Chrzciciela."
  tags: []
"Mk6,26":
  text: "I zasmucił się król bardzo, jednak ze względu na przysięgę i współbiesiadników nie chciał jej odmówić."
  tags: []
"Mk6,27":
  text: "Król natychmiast posłał kata i rozkazał przynieść jego głowę. A ten, poszedłszy, ściął go w więzieniu."
  tags: []
"Mk6,28":
  text: "Potem przyniósł na misie jego głowę i dał ją dziewczynie, a dziewczyna dała ją swojej matce."
  tags: []
"Mk6,29":
  text: "Gdy usłyszeli o tym jego uczniowie, przyszli, zabrali jego ciało i złożyli w grobie."
  tags: []
"Mk6,30":
  text: "A apostołowie zebrali się u Jezusa i opowiedzieli mu wszystko, co czynili i czego nauczali."
  tags: []
"Mk6,31":
  text: "I powiedział do nich: Pójdźcie wy na odludne miejsce i odpocznijcie trochę. Wielu bowiem przychodziło i odchodziło, tak że nie mieli wolnego czasu, żeby zjeść."
  tags: []
"Mk6,32":
  text: "I odpłynęli w łodzi na odludne miejsce, żeby być na osobności."
  tags: []
"Mk6,33":
  text: "A ludzie widzieli, że odpływają. Wielu go poznało i zbiegli się tam pieszo ze wszystkich miast, wyprzedzili ich i zgromadzili się przy nim."
  tags: []
"Mk6,34":
  text: "Kiedy Jezus wyszedł, zobaczył mnóstwo ludzi i ulitował się nad nimi, bo byli jak owce niemające pasterza. I zaczął nauczać ich wielu rzeczy."
  tags: []
"Mk6,35":
  text: "A gdy było już późno, jego uczniowie podeszli do niego i powiedzieli: Miejsce to jest puste, a pora już późna."
  tags: []
"Mk6,36":
  text: "Odpraw ich, aby poszli do okolicznych osad i wsi i kupili sobie chleba, bo nie mają co jeść."
  tags: []
"Mk6,37":
  text: "Lecz on im odpowiedział: Wy dajcie im jeść. Zapytali go więc: Czy mamy pójść i za dwieście groszy kupić chleba, i dać im jeść?"
  tags: []
"Mk6,38":
  text: "A on im powiedział: Ile macie chlebów? Idźcie i zobaczcie. A oni, dowiedziawszy się, powiedzieli: Pięć i dwie ryby."
  tags: []
"Mk6,39":
  text: "Wtedy kazał im posadzić wszystkich w grupach na zielonej trawie."
  tags: []
"Mk6,40":
  text: "I usiedli w grupach, po stu i po pięćdziesięciu."
  tags: []
"Mk6,41":
  text: "A wziąwszy te pięć chlebów i dwie ryby, spojrzał w niebo i pobłogosławił. I połamał te chleby i dawał swoim uczniom, aby kładli przed nimi. Także te dwie ryby rozdzielił między wszystkich."
  tags: []
"Mk6,42":
  text: "I jedli wszyscy do syta."
  tags: []
"Mk6,43":
  text: "I zebrali dwanaście pełnych koszy kawałków i resztek z ryb."
  tags: []
"Mk6,44":
  text: "A tych, którzy jedli chleby, było około pięciu tysięcy mężczyzn."
  tags: []
"Mk6,45":
  text: "I zaraz przymusił swoich uczniów, aby wsiedli do łodzi i popłynęli przed nim na drugi brzeg w kierunku Betsaidy, a on tymczasem odprawi ludzi."
  tags: []
"Mk6,46":
  text: "A gdy ich odprawił, odszedł na górę, aby się modlić."
  tags: []
"Mk6,47":
  text: "Kiedy nastał wieczór, łódź znajdowała się na środku morza, a on był sam na lądzie."
  tags: []
"Mk6,48":
  text: "I widział, że są zmęczeni wiosłowaniem, bo wiatr mieli przeciwny. I tak około czwartej straży nocnej przyszedł do nich, idąc po morzu, i chciał ich wyminąć."
  tags: []
"Mk6,49":
  text: "Ale oni, ujrzawszy go chodzącego po morzu, myśleli, że to zjawa, i krzyknęli."
  tags: []
"Mk6,50":
  text: "Wszyscy bowiem go widzieli i przestraszyli się. Ale on zaraz przemówił do nich tymi słowami: Ufajcie, to ja jestem! Nie bójcie się!"
  tags: []
"Mk6,51":
  text: "I wszedł do nich do łodzi, i uciszył się wiatr. A oni się bardzo zdumiewali i dziwili."
  tags: []
"Mk6,52":
  text: "Nie zrozumieli bowiem cudu z chlebami, gdyż ich serce było odrętwiałe."
  tags: []
"Mk6,53":
  text: "A przeprawiwszy się, przypłynęli do ziemi Genezaret i przybili do brzegu."
  tags: []
"Mk6,54":
  text: "A gdy wyszli z łodzi, ludzie zaraz go poznali;"
  tags: []
"Mk6,55":
  text: "Rozbiegli się po całej tej okolicy i zaczęli przynosić na posłaniach chorych tam, gdzie, jak słyszeli, przebywa."
  tags: []
"Mk6,56":
  text: "A gdziekolwiek wszedł, do wsi, miast czy osad, kładli chorych na ulicach i prosili go, aby mogli dotknąć choćby brzegu jego szaty. A wszyscy, którzy go dotknęli, zostali uzdrowieni."
  tags: []
