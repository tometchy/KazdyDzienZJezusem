"Mk15,1": "Wczesnym rankiem naczelni kapłani, naradziwszy się razem ze starszymi, uczonymi w Piśmie i całą Radą, związali Jezusa, odprowadzili go i wydali Piłatowi."
"Mk15,2": "A Piłat zapytał go: Czy ty jesteś królem Żydów? On mu odpowiedział: Ty sam to mówisz."
"Mk15,3": "I oskarżali go naczelni kapłani o wiele rzeczy, ale on nic nie odpowiedział."
"Mk15,4": "Wtedy Piłat znowu go zapytał: Nic nie odpowiadasz? Zobacz, jak wiele zeznają przeciwko tobie."
"Mk15,5": "Jezus jednak nic nie odpowiedział, tak że Piłat się dziwił."
"Mk15,6": "Na święto miał on zwyczaj wypuszczać im jednego więźnia, o którego prosili."
"Mk15,7": "A był jeden, zwany Barabaszem, więziony wraz z buntownikami, którzy podczas rozruchów popełnili zabójstwo."
"Mk15,8": "I tłum zaczął wołać i prosić, żeby zrobił to, co zawsze dla nich robił."
"Mk15,9": "Lecz Piłat im odpowiedział: Chcecie, abym wam wypuścił króla Żydów?"
"Mk15,10": "Wiedział bowiem, że naczelni kapłani wydali go z zawiści."
"Mk15,11": "Ale naczelni kapłani podburzyli tłum, żeby raczej wypuścił im Barabasza."
"Mk15,12": "A Piłat znowu im odpowiedział: Cóż więc chcecie, abym uczynił z tym, którego nazywacie królem Żydów?"
"Mk15,13": "A oni znowu zawołali: Ukrzyżuj go!"
"Mk15,14": "Wtedy Piłat zapytał: Cóż on złego uczynił? Lecz oni jeszcze głośniej wołali: Ukrzyżuj go!"
"Mk15,15": "Piłat więc, chcąc zadowolić tłum, wypuścił im Barabasza, a Jezusa ubiczował i wydał im na ukrzyżowanie."
"Mk15,16": "Żołnierze wprowadzili go do sali, czyli do ratusza, i zwołali cały oddział."
"Mk15,17": "Potem ubrali go w purpurę, a uplótłszy koronę z cierni, włożyli mu na głowę."
"Mk15,18": "I zaczęli go pozdrawiać: Witaj, królu Żydów!"
"Mk15,19": "Bili go trzciną po głowie i pluli na niego, a upadając na kolana, oddawali mu pokłon."
"Mk15,20": "A gdy go wyszydzili, zdjęli z niego purpurę, ubrali go w jego własne szaty i wyprowadzili na ukrzyżowanie."
"Mk15,21": "I przymusili przechodzącego obok niejakiego Szymona z Cyreny, który szedł z pola, ojca Aleksandra i Rufusa, aby niósł jego krzyż."
"Mk15,22": "I przyprowadzili go na miejsce zwane Golgotą, co się tłumaczy: Miejsce Czaszki."
"Mk15,23": "Dawali mu do picia wino z mirrą, ale go nie przyjął."
"Mk15,24": "A gdy go ukrzyżowali, rozdzielili jego szaty, rzucając o nie losy, by rozstrzygnąć, co kto ma wziąć."
"Mk15,25": "A była godzina trzecia, gdy go ukrzyżowali."
"Mk15,26": "Był też napis z podaniem jego winy: Król Żydów."
"Mk15,27": "I ukrzyżowali z nim dwóch bandytów, jednego po prawej, a drugiego po jego lewej stronie."
"Mk15,28": "Tak wypełniło się Pismo, które mówi: Zaliczono go w poczet złoczyńców."
"Mk15,29": "A ci, którzy przechodzili obok, bluźnili mu, kiwając głowami i mówiąc: Ej! Ty, który burzysz świątynię i w trzy dni ją odbudowujesz;"
"Mk15,30": "Ratuj samego siebie i zejdź z krzyża!"
"Mk15,31": "Podobnie naczelni kapłani wraz z uczonymi w Piśmie, naśmiewając się, mówili między sobą: Innych ratował, a samego siebie uratować nie może."
"Mk15,32": "Niech Chrystus, król Izraela, zejdzie teraz z krzyża, żebyśmy ujrzeli i uwierzyli. Urągali mu także ci, którzy byli z nim ukrzyżowani."
"Mk15,33": "A gdy była szósta godzina, ciemność ogarnęła całą ziemię aż do godziny dziewiątej."
"Mk15,34": "O godzinie dziewiątej Jezus zawołał donośnym głosem: Eloi, Eloi, lama sabachthani? – co się tłumaczy: Boże mój, Boże mój, czemu mnie opuściłeś?"
"Mk15,35": "A niektórzy ze stojących tam ludzi, usłyszawszy to, mówili: Woła Eliasza."
"Mk15,36": "Wtedy ktoś podbiegł, napełnił gąbkę octem i włożywszy na trzcinę, dał mu pić, mówiąc: Przestańcie, zobaczymy, czy przyjdzie Eliasz, aby go zdjąć."
"Mk15,37": "A Jezus zawołał donośnym głosem i oddał ducha."
"Mk15,38": "I rozerwała się na pół zasłona świątyni, od góry aż do dołu."
"Mk15,39": "A setnik, który stał naprzeciw, widząc, że tak wołając, oddał ducha, powiedział: Ten człowiek prawdziwie był Synem Bożym."
"Mk15,40": "Były tam też kobiety, które przypatrywały się z daleka, a wśród nich Maria Magdalena i Maria, matka Jakuba Mniejszego i Józefa, oraz Salome."
"Mk15,41": "One to, gdy jeszcze był w Galilei, chodziły za nim i usługiwały mu. Było też wiele innych, które wraz z nim przyszły do Jerozolimy."
"Mk15,42": "A ponieważ był dzień przygotowania, który jest przed szabatem, i nastał już wieczór;"
"Mk15,43": "Przyszedł Józef z Arymatei, ważny członek Rady, który sam też oczekiwał królestwa Bożego, śmiało wszedł do Piłata i poprosił o ciało Jezusa."
"Mk15,44": "A Piłat zdziwił się, że już nie żyje, i zawoławszy setnika, zapytał go, czy dawno umarł."
"Mk15,45": "I upewniony przez setnika, wydał ciało Józefowi."
"Mk15,46": "Ten kupił płótno, zdjął go, owinął płótnem i złożył w grobowcu, który był wykuty w skale, a przed wejście do grobowca zatoczył kamień."
"Mk15,47": "A Maria Magdalena i Maria, matka Józefa, patrzyły, gdzie go złożono."
