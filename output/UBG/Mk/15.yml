"Mk15,1":
  text: "Wczesnym rankiem naczelni kapłani, naradziwszy się razem ze starszymi, uczonymi w Piśmie i całą Radą, związali Jezusa, odprowadzili go i wydali Piłatowi."
  tags: []
"Mk15,2":
  text: "A Piłat zapytał go: Czy ty jesteś królem Żydów? On mu odpowiedział: Ty sam to mówisz."
  tags: []
"Mk15,3":
  text: "I oskarżali go naczelni kapłani o wiele rzeczy, ale on nic nie odpowiedział."
  tags: []
"Mk15,4":
  text: "Wtedy Piłat znowu go zapytał: Nic nie odpowiadasz? Zobacz, jak wiele zeznają przeciwko tobie."
  tags: []
"Mk15,5":
  text: "Jezus jednak nic nie odpowiedział, tak że Piłat się dziwił."
  tags: []
"Mk15,6":
  text: "Na święto miał on zwyczaj wypuszczać im jednego więźnia, o którego prosili."
  tags: []
"Mk15,7":
  text: "A był jeden, zwany Barabaszem, więziony wraz z buntownikami, którzy podczas rozruchów popełnili zabójstwo."
  tags: []
"Mk15,8":
  text: "I tłum zaczął wołać i prosić, żeby zrobił to, co zawsze dla nich robił."
  tags: []
"Mk15,9":
  text: "Lecz Piłat im odpowiedział: Chcecie, abym wam wypuścił króla Żydów?"
  tags: []
"Mk15,10":
  text: "Wiedział bowiem, że naczelni kapłani wydali go z zawiści."
  tags: []
"Mk15,11":
  text: "Ale naczelni kapłani podburzyli tłum, żeby raczej wypuścił im Barabasza."
  tags: []
"Mk15,12":
  text: "A Piłat znowu im odpowiedział: Cóż więc chcecie, abym uczynił z tym, którego nazywacie królem Żydów?"
  tags: []
"Mk15,13":
  text: "A oni znowu zawołali: Ukrzyżuj go!"
  tags: []
"Mk15,14":
  text: "Wtedy Piłat zapytał: Cóż on złego uczynił? Lecz oni jeszcze głośniej wołali: Ukrzyżuj go!"
  tags: []
"Mk15,15":
  text: "Piłat więc, chcąc zadowolić tłum, wypuścił im Barabasza, a Jezusa ubiczował i wydał im na ukrzyżowanie."
  tags: []
"Mk15,16":
  text: "Żołnierze wprowadzili go do sali, czyli do ratusza, i zwołali cały oddział."
  tags: []
"Mk15,17":
  text: "Potem ubrali go w purpurę, a uplótłszy koronę z cierni, włożyli mu na głowę."
  tags: []
"Mk15,18":
  text: "I zaczęli go pozdrawiać: Witaj, królu Żydów!"
  tags: []
"Mk15,19":
  text: "Bili go trzciną po głowie i pluli na niego, a upadając na kolana, oddawali mu pokłon."
  tags: []
"Mk15,20":
  text: "A gdy go wyszydzili, zdjęli z niego purpurę, ubrali go w jego własne szaty i wyprowadzili na ukrzyżowanie."
  tags: []
"Mk15,21":
  text: "I przymusili przechodzącego obok niejakiego Szymona z Cyreny, który szedł z pola, ojca Aleksandra i Rufusa, aby niósł jego krzyż."
  tags: []
"Mk15,22":
  text: "I przyprowadzili go na miejsce zwane Golgotą, co się tłumaczy: Miejsce Czaszki."
  tags: []
"Mk15,23":
  text: "Dawali mu do picia wino z mirrą, ale go nie przyjął."
  tags: []
"Mk15,24":
  text: "A gdy go ukrzyżowali, rozdzielili jego szaty, rzucając o nie losy, by rozstrzygnąć, co kto ma wziąć."
  tags: []
"Mk15,25":
  text: "A była godzina trzecia, gdy go ukrzyżowali."
  tags: []
"Mk15,26":
  text: "Był też napis z podaniem jego winy: Król Żydów."
  tags: []
"Mk15,27":
  text: "I ukrzyżowali z nim dwóch bandytów, jednego po prawej, a drugiego po jego lewej stronie."
  tags: []
"Mk15,28":
  text: "Tak wypełniło się Pismo, które mówi: Zaliczono go w poczet złoczyńców."
  tags: []
"Mk15,29":
  text: "A ci, którzy przechodzili obok, bluźnili mu, kiwając głowami i mówiąc: Ej! Ty, który burzysz świątynię i w trzy dni ją odbudowujesz;"
  tags: []
"Mk15,30":
  text: "Ratuj samego siebie i zejdź z krzyża!"
  tags: []
"Mk15,31":
  text: "Podobnie naczelni kapłani wraz z uczonymi w Piśmie, naśmiewając się, mówili między sobą: Innych ratował, a samego siebie uratować nie może."
  tags: []
"Mk15,32":
  text: "Niech Chrystus, król Izraela, zejdzie teraz z krzyża, żebyśmy ujrzeli i uwierzyli. Urągali mu także ci, którzy byli z nim ukrzyżowani."
  tags: []
"Mk15,33":
  text: "A gdy była szósta godzina, ciemność ogarnęła całą ziemię aż do godziny dziewiątej."
  tags: []
"Mk15,34":
  text: "O godzinie dziewiątej Jezus zawołał donośnym głosem: Eloi, Eloi, lama sabachthani? – co się tłumaczy: Boże mój, Boże mój, czemu mnie opuściłeś?"
  tags: []
"Mk15,35":
  text: "A niektórzy ze stojących tam ludzi, usłyszawszy to, mówili: Woła Eliasza."
  tags: []
"Mk15,36":
  text: "Wtedy ktoś podbiegł, napełnił gąbkę octem i włożywszy na trzcinę, dał mu pić, mówiąc: Przestańcie, zobaczymy, czy przyjdzie Eliasz, aby go zdjąć."
  tags: []
"Mk15,37":
  text: "A Jezus zawołał donośnym głosem i oddał ducha."
  tags: []
"Mk15,38":
  text: "I rozerwała się na pół zasłona świątyni, od góry aż do dołu."
  tags: []
"Mk15,39":
  text: "A setnik, który stał naprzeciw, widząc, że tak wołając, oddał ducha, powiedział: Ten człowiek prawdziwie był Synem Bożym."
  tags: []
"Mk15,40":
  text: "Były tam też kobiety, które przypatrywały się z daleka, a wśród nich Maria Magdalena i Maria, matka Jakuba Mniejszego i Józefa, oraz Salome."
  tags: []
"Mk15,41":
  text: "One to, gdy jeszcze był w Galilei, chodziły za nim i usługiwały mu. Było też wiele innych, które wraz z nim przyszły do Jerozolimy."
  tags: []
"Mk15,42":
  text: "A ponieważ był dzień przygotowania, który jest przed szabatem, i nastał już wieczór;"
  tags: []
"Mk15,43":
  text: "Przyszedł Józef z Arymatei, ważny członek Rady, który sam też oczekiwał królestwa Bożego, śmiało wszedł do Piłata i poprosił o ciało Jezusa."
  tags: []
"Mk15,44":
  text: "A Piłat zdziwił się, że już nie żyje, i zawoławszy setnika, zapytał go, czy dawno umarł."
  tags: []
"Mk15,45":
  text: "I upewniony przez setnika, wydał ciało Józefowi."
  tags: []
"Mk15,46":
  text: "Ten kupił płótno, zdjął go, owinął płótnem i złożył w grobowcu, który był wykuty w skale, a przed wejście do grobowca zatoczył kamień."
  tags: []
"Mk15,47":
  text: "A Maria Magdalena i Maria, matka Józefa, patrzyły, gdzie go złożono."
  tags: []
