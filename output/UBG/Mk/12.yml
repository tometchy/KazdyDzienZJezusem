"Mk12,1":
  text: "Wtedy zaczął do nich mówić w przypowieściach: Pewien człowiek założył winnicę, ogrodził ją płotem, wykopał prasę, zbudował wieżę i wydzierżawił ją rolnikom, i wyjechał."
  tags: []
"Mk12,2":
  text: "A gdy nadszedł czas, posłał do rolników sługę, aby odebrał od nich plony winnicy."
  tags: []
"Mk12,3":
  text: "Lecz oni schwytali go, pobili i odesłali z niczym."
  tags: []
"Mk12,4":
  text: "I znowu posłał do nich innego sługę, którego ukamienowali, zranili w głowę i odesłali znieważonego."
  tags: []
"Mk12,5":
  text: "Ponownie posłał innego sługę, lecz i tego zabili. I wielu innych, z których jednych pobili, a innych pozabijali."
  tags: []
"Mk12,6":
  text: "A mając jeszcze jednego, swego umiłowanego syna, posłał do nich na koniec i jego, mówiąc: Uszanują mego syna."
  tags: []
"Mk12,7":
  text: "Ale rolnicy mówili między sobą: To jest dziedzic. Chodźmy, zabijmy go, a dziedzictwo będzie nasze."
  tags: []
"Mk12,8":
  text: "I schwytawszy go, zabili i wyrzucili z winnicy."
  tags: []
"Mk12,9":
  text: "Cóż więc zrobi pan winnicy? Przyjdzie i wytraci tych rolników, a winnicę odda innym."
  tags: []
"Mk12,10":
  text: "Czy nie czytaliście tych słów Pisma: Kamień, który odrzucili budujący, stał się kamieniem węgielnym;"
  tags: []
"Mk12,11":
  text: "Pan to sprawił i jest to cudowne w naszych oczach?"
  tags: []
"Mk12,12":
  text: "Starali się więc go schwytać, ale bali się ludu. Wiedzieli bowiem, że przeciwko nim powiedział tę przypowieść. Zostawili go więc i odeszli."
  tags: []
"Mk12,13":
  text: "Potem posłali do niego niektórych z faryzeuszy i herodianów, aby go pochwycili w mowie."
  tags: []
"Mk12,14":
  text: "Gdy przyszli, powiedzieli mu: Nauczycielu, wiemy, że jesteś prawdziwy i nie zważasz na nikogo. Nie oglądasz się bowiem na osobę ludzką, ale drogi Bożej w prawdzie uczysz. Czy wolno płacić podatek cesarzowi, czy nie? Mamy go płacić czy nie płacić?"
  tags: []
"Mk12,15":
  text: "A on poznał ich obłudę i powiedział do nich: Czemu wystawiacie mnie na próbę? Przynieście mi grosz, żebym mógł go zobaczyć."
  tags: []
"Mk12,16":
  text: "I przynieśli mu. A on ich zapytał: Czyj to wizerunek i napis? Odpowiedzieli mu: Cesarza."
  tags: []
"Mk12,17":
  text: "Wtedy Jezus im powiedział: Oddawajcie więc cesarzowi to, co należy do cesarza, a co należy do Boga – Bogu. I podziwiali go."
  tags: []
"Mk12,18":
  text: "Potem przyszli do niego saduceusze, którzy mówią, że nie ma zmartwychwstania, i pytali go:"
  tags: []
"Mk12,19":
  text: "Nauczycielu, Mojżesz nam napisał, że jeśli czyjś brat umrze i pozostawi żonę, a nie pozostawi dzieci, to jego brat ma ożenić się z jego żoną i wzbudzić potomstwo swemu bratu."
  tags: []
"Mk12,20":
  text: "Otóż było siedmiu braci. Pierwszy ożenił się i umarł, nie zostawiwszy potomstwa."
  tags: []
"Mk12,21":
  text: "Potem ożenił się z nią drugi i umarł, lecz i ten nie zostawił potomstwa, tak samo trzeci."
  tags: []
"Mk12,22":
  text: "I tak pojęło ją siedmiu braci, ale nie zostawili potomstwa. Na koniec, po wszystkich umarła i ta kobieta."
  tags: []
"Mk12,23":
  text: "Przy zmartwychwstaniu więc, gdy powstaną, którego z nich będzie żoną? Bo siedmiu miało ją za żonę."
  tags: []
"Mk12,24":
  text: "Na to Jezus im odpowiedział: Czyż nie dlatego błądzicie, że nie znacie Pisma ani mocy Boga?"
  tags: []
"Mk12,25":
  text: "Gdy bowiem zmartwychwstaną, ani się żenić nie będą, ani za mąż wychodzić, ale będą jak aniołowie w niebie."
  tags: []
"Mk12,26":
  text: "A o umarłych, że będą wskrzeszeni, nie czytaliście w księdze Mojżesza, jak Bóg do niego z krzaka przemówił: Ja jestem Bogiem Abrahama, Bogiem Izaaka i Bogiem Jakuba?"
  tags: []
"Mk12,27":
  text: "Bóg nie jest Bogiem umarłych, ale Bogiem żywych. Wy więc bardzo błądzicie."
  tags: []
"Mk12,28":
  text: "Podszedł jeden z uczonych w Piśmie i słysząc, że ze sobą rozmawiali oraz widząc, że im dobrze odpowiedział, zapytał go: Które przykazanie jest pierwsze ze wszystkich?"
  tags: []
"Mk12,29":
  text: "A Jezus mu odpowiedział: Pierwsze przykazanie ze wszystkich jest to: Słuchaj, Izraelu! Pan, nasz Bóg, Pan jest jeden."
  tags: []
"Mk12,30":
  text: "Będziesz więc miłował Pana, swego Boga, całym swym sercem, całą swą duszą, całym swym umysłem i z całej swojej siły. To jest pierwsze przykazanie."
  tags: []
"Mk12,31":
  text: "A drugie jest do niego podobne: Będziesz miłował swego bliźniego jak samego siebie. Nie ma innego przykazania większego od tych."
  tags: []
"Mk12,32":
  text: "Wtedy powiedział mu uczony w Piśmie: Nauczycielu, zaprawdę dobrze powiedziałeś, że jeden jest Bóg i nie ma innego oprócz niego."
  tags: []
"Mk12,33":
  text: "Miłować go całym sercem, całym umysłem, całą duszą i z całej siły i miłować bliźniego jak samego siebie znaczy więcej niż wszystkie całopalenia i ofiary."
  tags: []
"Mk12,34":
  text: "A Jezus, widząc, że mądrze odpowiedział, rzekł do niego: Niedaleko jesteś od królestwa Bożego. I nikt nie śmiał go więcej pytać."
  tags: []
"Mk12,35":
  text: "Nauczając w świątyni, Jezus zapytał: Jak to jest, że uczeni w Piśmie mówią, że Chrystus jest Synem Dawida?"
  tags: []
"Mk12,36":
  text: "Sam Dawid bowiem powiedział przez Ducha Świętego: Rzekł Pan memu Panu: Siądź po mojej prawicy, aż położę twoich nieprzyjaciół jako podnóżek pod twoje stopy."
  tags: []
"Mk12,37":
  text: "Skoro sam Dawid nazywa go Panem, to jak może być jego synem? A wielki tłum chętnie go słuchał."
  tags: []
"Mk12,38":
  text: "I mówił do nich w swoim nauczaniu: Strzeżcie się uczonych w Piśmie, którzy lubią chodzić w długich szatach i lubią pozdrowienia na rynkach;"
  tags: []
"Mk12,39":
  text: "I pierwsze krzesła w synagogach, i pierwsze miejsca na ucztach."
  tags: []
"Mk12,40":
  text: "Pożerają oni domy wdów i dla pozoru odprawiają długie modlitwy. Ci otrzymają surowszy wyrok."
  tags: []
"Mk12,41":
  text: "A siedząc naprzeciw skarbony, Jezus przypatrywał się, jak ludzie wrzucali do niej pieniądze. Wielu bogaczy wrzucało wiele."
  tags: []
"Mk12,42":
  text: "Przyszła też pewna uboga wdowa i wrzuciła dwie drobne monety, czyli kwartnik."
  tags: []
"Mk12,43":
  text: "Wtedy zawołał swoich uczniów i powiedział im: Zaprawdę powiadam wam, że ta uboga wdowa wrzuciła więcej niż wszyscy, którzy wrzucali do skarbony."
  tags: []
"Mk12,44":
  text: "Wszyscy bowiem wrzucali z tego, co im zbywało, ale ona ze swego ubóstwa wrzuciła wszystko, co miała, całe swoje utrzymanie."
  tags: []
