"Mk12,1": "Wtedy zaczął do nich mówić w przypowieściach: Pewien człowiek założył winnicę, ogrodził ją płotem, wykopał prasę, zbudował wieżę i wydzierżawił ją rolnikom, i wyjechał."
"Mk12,2": "A gdy nadszedł czas, posłał do rolników sługę, aby odebrał od nich plony winnicy."
"Mk12,3": "Lecz oni schwytali go, pobili i odesłali z niczym."
"Mk12,4": "I znowu posłał do nich innego sługę, którego ukamienowali, zranili w głowę i odesłali znieważonego."
"Mk12,5": "Ponownie posłał innego sługę, lecz i tego zabili. I wielu innych, z których jednych pobili, a innych pozabijali."
"Mk12,6": "A mając jeszcze jednego, swego umiłowanego syna, posłał do nich na koniec i jego, mówiąc: Uszanują mego syna."
"Mk12,7": "Ale rolnicy mówili między sobą: To jest dziedzic. Chodźmy, zabijmy go, a dziedzictwo będzie nasze."
"Mk12,8": "I schwytawszy go, zabili i wyrzucili z winnicy."
"Mk12,9": "Cóż więc zrobi pan winnicy? Przyjdzie i wytraci tych rolników, a winnicę odda innym."
"Mk12,10": "Czy nie czytaliście tych słów Pisma: Kamień, który odrzucili budujący, stał się kamieniem węgielnym;"
"Mk12,11": "Pan to sprawił i jest to cudowne w naszych oczach?"
"Mk12,12": "Starali się więc go schwytać, ale bali się ludu. Wiedzieli bowiem, że przeciwko nim powiedział tę przypowieść. Zostawili go więc i odeszli."
"Mk12,13": "Potem posłali do niego niektórych z faryzeuszy i herodianów, aby go pochwycili w mowie."
"Mk12,14": "Gdy przyszli, powiedzieli mu: Nauczycielu, wiemy, że jesteś prawdziwy i nie zważasz na nikogo. Nie oglądasz się bowiem na osobę ludzką, ale drogi Bożej w prawdzie uczysz. Czy wolno płacić podatek cesarzowi, czy nie? Mamy go płacić czy nie płacić?"
"Mk12,15": "A on poznał ich obłudę i powiedział do nich: Czemu wystawiacie mnie na próbę? Przynieście mi grosz, żebym mógł go zobaczyć."
"Mk12,16": "I przynieśli mu. A on ich zapytał: Czyj to wizerunek i napis? Odpowiedzieli mu: Cesarza."
"Mk12,17": "Wtedy Jezus im powiedział: Oddawajcie więc cesarzowi to, co należy do cesarza, a co należy do Boga – Bogu. I podziwiali go."
"Mk12,18": "Potem przyszli do niego saduceusze, którzy mówią, że nie ma zmartwychwstania, i pytali go:"
"Mk12,19": "Nauczycielu, Mojżesz nam napisał, że jeśli czyjś brat umrze i pozostawi żonę, a nie pozostawi dzieci, to jego brat ma ożenić się z jego żoną i wzbudzić potomstwo swemu bratu."
"Mk12,20": "Otóż było siedmiu braci. Pierwszy ożenił się i umarł, nie zostawiwszy potomstwa."
"Mk12,21": "Potem ożenił się z nią drugi i umarł, lecz i ten nie zostawił potomstwa, tak samo trzeci."
"Mk12,22": "I tak pojęło ją siedmiu braci, ale nie zostawili potomstwa. Na koniec, po wszystkich umarła i ta kobieta."
"Mk12,23": "Przy zmartwychwstaniu więc, gdy powstaną, którego z nich będzie żoną? Bo siedmiu miało ją za żonę."
"Mk12,24": "Na to Jezus im odpowiedział: Czyż nie dlatego błądzicie, że nie znacie Pisma ani mocy Boga?"
"Mk12,25": "Gdy bowiem zmartwychwstaną, ani się żenić nie będą, ani za mąż wychodzić, ale będą jak aniołowie w niebie."
"Mk12,26": "A o umarłych, że będą wskrzeszeni, nie czytaliście w księdze Mojżesza, jak Bóg do niego z krzaka przemówił: Ja jestem Bogiem Abrahama, Bogiem Izaaka i Bogiem Jakuba?"
"Mk12,27": "Bóg nie jest Bogiem umarłych, ale Bogiem żywych. Wy więc bardzo błądzicie."
"Mk12,28": "Podszedł jeden z uczonych w Piśmie i słysząc, że ze sobą rozmawiali oraz widząc, że im dobrze odpowiedział, zapytał go: Które przykazanie jest pierwsze ze wszystkich?"
"Mk12,29": "A Jezus mu odpowiedział: Pierwsze przykazanie ze wszystkich jest to: Słuchaj, Izraelu! Pan, nasz Bóg, Pan jest jeden."
"Mk12,30": "Będziesz więc miłował Pana, swego Boga, całym swym sercem, całą swą duszą, całym swym umysłem i z całej swojej siły. To jest pierwsze przykazanie."
"Mk12,31": "A drugie jest do niego podobne: Będziesz miłował swego bliźniego jak samego siebie. Nie ma innego przykazania większego od tych."
"Mk12,32": "Wtedy powiedział mu uczony w Piśmie: Nauczycielu, zaprawdę dobrze powiedziałeś, że jeden jest Bóg i nie ma innego oprócz niego."
"Mk12,33": "Miłować go całym sercem, całym umysłem, całą duszą i z całej siły i miłować bliźniego jak samego siebie znaczy więcej niż wszystkie całopalenia i ofiary."
"Mk12,34": "A Jezus, widząc, że mądrze odpowiedział, rzekł do niego: Niedaleko jesteś od królestwa Bożego. I nikt nie śmiał go więcej pytać."
"Mk12,35": "Nauczając w świątyni, Jezus zapytał: Jak to jest, że uczeni w Piśmie mówią, że Chrystus jest Synem Dawida?"
"Mk12,36": "Sam Dawid bowiem powiedział przez Ducha Świętego: Rzekł Pan memu Panu: Siądź po mojej prawicy, aż położę twoich nieprzyjaciół jako podnóżek pod twoje stopy."
"Mk12,37": "Skoro sam Dawid nazywa go Panem, to jak może być jego synem? A wielki tłum chętnie go słuchał."
"Mk12,38": "I mówił do nich w swoim nauczaniu: Strzeżcie się uczonych w Piśmie, którzy lubią chodzić w długich szatach i lubią pozdrowienia na rynkach;"
"Mk12,39": "I pierwsze krzesła w synagogach, i pierwsze miejsca na ucztach."
"Mk12,40": "Pożerają oni domy wdów i dla pozoru odprawiają długie modlitwy. Ci otrzymają surowszy wyrok."
"Mk12,41": "A siedząc naprzeciw skarbony, Jezus przypatrywał się, jak ludzie wrzucali do niej pieniądze. Wielu bogaczy wrzucało wiele."
"Mk12,42": "Przyszła też pewna uboga wdowa i wrzuciła dwie drobne monety, czyli kwartnik."
"Mk12,43": "Wtedy zawołał swoich uczniów i powiedział im: Zaprawdę powiadam wam, że ta uboga wdowa wrzuciła więcej niż wszyscy, którzy wrzucali do skarbony."
"Mk12,44": "Wszyscy bowiem wrzucali z tego, co im zbywało, ale ona ze swego ubóstwa wrzuciła wszystko, co miała, całe swoje utrzymanie."
