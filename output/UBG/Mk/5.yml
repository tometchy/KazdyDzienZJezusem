"Mk5,1":
  text: "I przeprawili się za morze do krainy Gadareńczyków."
  tags: []
"Mk5,2":
  text: "A gdy on wyszedł z łodzi, zaraz wybiegł mu naprzeciw z grobowców człowiek mający ducha nieczystego."
  tags: []
"Mk5,3":
  text: "Mieszkał on w grobowcach i nawet łańcuchami nikt nie mógł go związać."
  tags: []
"Mk5,4":
  text: "Często bowiem był wiązany pętami i łańcuchami, ale rwał łańcuchy i kruszył pęta, i nikt nie mógł go poskromić."
  tags: []
"Mk5,5":
  text: "A zawsze, we dnie i w nocy, przebywał w górach i grobowcach, krzycząc i tłukąc siebie kamieniami."
  tags: []
"Mk5,6":
  text: "Gdy więc zobaczył Jezusa z daleka, przybiegł i oddał mu pokłon;"
  tags: []
"Mk5,7":
  text: "A wołając donośnym głosem, powiedział: Cóż mam z tobą, Jezusie, Synu Boga najwyższego? Zaklinam cię na Boga, abyś mnie nie dręczył."
  tags: []
"Mk5,8":
  text: "Powiedział mu bowiem: Wyjdź, duchu nieczysty, z tego człowieka!"
  tags: []
"Mk5,9":
  text: "I zapytał go: Jak ci na imię? A on odpowiedział: Na imię mi Legion, bo jest nas wielu."
  tags: []
"Mk5,10":
  text: "I prosił go bardzo, aby nie wyganiał ich z tej krainy."
  tags: []
"Mk5,11":
  text: "A pasło się tam w pobliżu góry wielkie stado świń."
  tags: []
"Mk5,12":
  text: "I wszystkie te demony prosiły go: Poślij nas w te świnie, abyśmy mogły w nie wejść."
  tags: []
"Mk5,13":
  text: "I Jezus zaraz im pozwolił. A duchy nieczyste, wyszedłszy, weszły w świnie. Wtedy stado, liczące około dwóch tysięcy, ruszyło pędem po urwisku do morza i utonęło w nim."
  tags: []
"Mk5,14":
  text: "Ci zaś, którzy paśli świnie, uciekli i opowiedzieli o tym w mieście i we wsiach. I wyszli ludzie, aby zobaczyć, co się stało."
  tags: []
"Mk5,15":
  text: "Przyszli więc do Jezusa i zobaczyli tego, który był opętany, w którym był legion demonów, jak siedział ubrany i przy zdrowych zmysłach. I bali się."
  tags: []
"Mk5,16":
  text: "A ci, którzy to widzieli, opowiedzieli im, co się stało z opętanym, a także o świniach."
  tags: []
"Mk5,17":
  text: "Wtedy zaczęli go prosić, aby odszedł z ich granic."
  tags: []
"Mk5,18":
  text: "A gdy wsiadł do łodzi, prosił go ten, który był opętany, aby mógł przy nim zostać."
  tags: []
"Mk5,19":
  text: "Lecz Jezus mu nie pozwolił, ale powiedział: Idź do domu, do swoich, i opowiedz im, jak wielkie rzeczy Pan ci uczynił i jak się nad tobą zmiłował."
  tags: []
"Mk5,20":
  text: "Odszedł więc i zaczął w Dekapolu opowiadać, jak wielkie rzeczy Jezus mu uczynił. I wszyscy się dziwili."
  tags: []
"Mk5,21":
  text: "A gdy Jezus przeprawił się z powrotem w łodzi na drugą stronę, zebrało się wokół niego mnóstwo ludzi. A on był nad morzem."
  tags: []
"Mk5,22":
  text: "Wtedy przyszedł jeden z przełożonych synagogi, imieniem Jair, a gdy go zobaczył, padł mu do nóg."
  tags: []
"Mk5,23":
  text: "I prosił go usilnie: Moja córeczka umiera. Przyjdź, połóż na nią ręce, aby została uzdrowiona, a będzie żyła."
  tags: []
"Mk5,24":
  text: "I poszedł z nim. Szło zaś za nim mnóstwo ludzi, którzy na niego napierali."
  tags: []
"Mk5,25":
  text: "Wtedy pewna kobieta, która od dwunastu lat cierpiała na upływ krwi;"
  tags: []
"Mk5,26":
  text: "I wiele wycierpiała od licznych lekarzy, i wydała wszystko, co miała, a nic jej nie pomogło, przeciwnie, pogarszało jej się;"
  tags: []
"Mk5,27":
  text: "Usłyszawszy o Jezusie, podeszła w tłumie od tyłu i dotknęła jego szaty."
  tags: []
"Mk5,28":
  text: "Mówiła bowiem: Jeśli dotknę choćby jego szaty, będę zdrowa."
  tags: []
"Mk5,29":
  text: "I natychmiast ustał jej upływ krwi, i poczuła w ciele, że została uzdrowiona ze swojej choroby."
  tags: []
"Mk5,30":
  text: "A Jezus od razu poznał, że wyszła z niego moc, odwrócił się do tłumu i zapytał: Kto dotknął moich szat?"
  tags: []
"Mk5,31":
  text: "Odpowiedzieli mu jego uczniowie: Widzisz, że tłum na ciebie napiera, a pytasz: Kto mnie dotknął?"
  tags: []
"Mk5,32":
  text: "I spojrzał wokoło, aby zobaczyć tę, która to uczyniła."
  tags: []
"Mk5,33":
  text: "Wtedy kobieta ze strachem i z drżeniem, wiedząc, co się z nią stało, podeszła, upadła przed nim i wyznała mu całą prawdę."
  tags: []
"Mk5,34":
  text: "A on powiedział do niej: Córko, twoja wiara cię uzdrowiła, idź w pokoju i bądź uzdrowiona ze swojej choroby."
  tags: []
"Mk5,35":
  text: "A gdy jeszcze mówił, przyszli ludzie od przełożonego synagogi i powiedzieli: Twoja córka umarła. Czemu jeszcze trudzisz Nauczyciela?"
  tags: []
"Mk5,36":
  text: "Ale Jezus, gdy tylko usłyszał, co mówili, powiedział do przełożonego synagogi: Nie bój się, tylko wierz!"
  tags: []
"Mk5,37":
  text: "I nie pozwolił iść za sobą nikomu oprócz Piotra, Jakuba i Jana, brata Jakuba."
  tags: []
"Mk5,38":
  text: "A gdy przyszedł do domu przełożonego synagogi, zobaczył tam zamieszanie oraz płaczących i bardzo zawodzących."
  tags: []
"Mk5,39":
  text: "Wszedłszy więc, powiedział do nich: Dlaczego robicie zamieszanie i płaczecie? Dziewczynka nie umarła, tylko śpi."
  tags: []
"Mk5,40":
  text: "I naśmiewali się z niego. Ale on wyrzucił wszystkich, wziął ze sobą ojca i matkę dziewczynki oraz tych, którzy przy nim byli, i wszedł tam, gdzie leżała dziewczynka."
  tags: []
"Mk5,41":
  text: "Ujął dziewczynkę za rękę i powiedział do niej: Talitha kumi! – co się tłumaczy: Dziewczynko, mówię ci, wstań!"
  tags: []
"Mk5,42":
  text: "I natychmiast dziewczynka wstała i chodziła, miała bowiem dwanaście lat. I ogarnęło ich wielkie zdumienie."
  tags: []
"Mk5,43":
  text: "Wtedy przykazał im surowo, aby nikt się o tym nie dowiedział, i polecił, aby dano jej jeść."
  tags: []
