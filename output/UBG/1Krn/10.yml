"1Krn10,1":
  text: "Gdy Filistyni walczyli z Izraelem, Izraelici uciekli przed nimi i padli zabici na górze Gilboa."
  tags: []
"1Krn10,2":
  text: "I Filistyni ścigali Saula i jego synów, i zabili Jonatana, Abinadaba i Malkiszuę, synów Saula."
  tags: []
"1Krn10,3":
  text: "A gdy rozgorzała bitwa przeciw Saulowi, łucznicy trafili w niego i został przez nich ciężko zraniony."
  tags: []
"1Krn10,4":
  text: "Wtedy Saul powiedział do swego giermka: Dobądź swój miecz i przebij mnie nim, aby nie przyszli ci nieobrzezani i nie znęcali się nade mną. Ale jego giermek nie chciał tego zrobić, ponieważ bardzo się bał. Saul więc wziął miecz i sam rzucił się na niego."
  tags: []
"1Krn10,5":
  text: "A gdy jego giermek zobaczył, że Saul umarł, rzucił się i on na swój miecz i umarł."
  tags: []
"1Krn10,6":
  text: "Tak umarli Saul i jego trzej synowie, a cały jego dom zginął razem z nim."
  tags: []
"1Krn10,7":
  text: "A gdy wszyscy Izraelici, którzy mieszkali w dolinie, zobaczyli, że Izraelici uciekli oraz że Saul i jego synowie umarli, opuścili swoje miasta i uciekli. Przyszli więc Filistyni i mieszkali w nich."
  tags: []
"1Krn10,8":
  text: "Kiedy nazajutrz Filistyni przyszli, aby złupić zabitych, znaleźli Saula i jego synów poległych na górze Gilboa."
  tags: []
"1Krn10,9":
  text: "Obdarli go więc z szat, wzięli jego głowę i zbroję i rozesłali po całej ziemi filistyńskiej, aby ogłosić radosną wieść swoim bożkom i swojemu ludowi."
  tags: []
"1Krn10,10":
  text: "Jego zbroję położyli w domu swoich bogów, a jego głowę powiesili w świątyni Dagona."
  tags: []
"1Krn10,11":
  text: "Kiedy wszyscy mieszkańcy Jabesz-Gilead usłyszeli o wszystkim, co Filistyni uczynili Saulowi;"
  tags: []
"1Krn10,12":
  text: "Powstali wszyscy waleczni mężczyźni, wzięli ciało Saula oraz ciała jego synów, przynieśli je do Jabesz i pogrzebali ich kości pod dębem w Jabesz. Potem pościli przez siedem dni."
  tags: []
"1Krn10,13":
  text: "Tak umarł Saul z powodu swojego przestępstwa, które popełnił przeciwko PANU i przeciwko słowu PANA, którego nie przestrzegał, oraz za to, że szukał rady czarownika;"
  tags: []
"1Krn10,14":
  text: "A nie radził się PANA. PAN zabił go więc i przeniósł królestwo na Dawida, syna Jessego."
  tags: []
