"1Krn4,1": "Synowie Judy: Peres, Chesron, Karmi, Chur i Szobal."
"1Krn4,2": "A Reajasz, syn Szobala, spłodził Jachata, a Jachat spłodził Achumaja i Lahada. To są rody Soreatytów."
"1Krn4,3": "A ci pochodzą od ojca Etama: Jizreel, Jiszma i Jidbasz, a ich siostra miała na imię Haselelponi."
"1Krn4,4": "Penuel był ojcem Gedora, a Ezer – ojcem Chuszy. To są synowie Chura, pierworodnego Efraty, ojca Betlejema."
"1Krn4,5": "A Aszur, ojciec Tekoa, miał dwie żony: Chelę i Naarę."
"1Krn4,6": "I Naara urodziła mu Achuzama, Chefera, Temniego i Achasztariego. Ci byli synami Naary."
"1Krn4,7": "Synowie Cheli: Seret, Jesochar i Etnan."
"1Krn4,8": "A Koz spłodził Anuba, Zobeba i rody Acharchela, syna Haruma."
"1Krn4,9": "A Jabes był bardziej poważany niż jego bracia. Jego matka dała mu na imię Jabes, mówiąc: Ponieważ urodziłam go w bólu."
"1Krn4,10": "I Jabes wzywał Boga Izraela, mówiąc: Obyś mi naprawdę błogosławił i rozszerzył moje granice, oby twoja ręka była ze mną, obyś zachował mnie od zła, abym nie był utrapiony. I Bóg spełnił to, o co go prosił."
"1Krn4,11": "A Kelub, brat Szuchy, spłodził Mechira, który był ojcem Esztona."
"1Krn4,12": "A Eszton spłodził Betrafę, Paseacha i Techinnę, ojca Irnachasza. To są mężczyźni z Rechy."
"1Krn4,13": "Synowie Kenaza: Otniel i Serajasz, a synowie Otniela: Chatat i Meonotaj."
"1Krn4,14": "Meonotaj spłodził Ofrę. Serajasz zaś spłodził Joaba, ojca Charaszimów mieszkających w dolinie – byli bowiem rzemieślnikami."
"1Krn4,15": "Synowie Kaleba, syna Jefunnego: Iru, Ela i Naam. A synem Eli był Kenaz."
"1Krn4,16": "Synowie Jehalleleela: Zif, Zifa, Tiria i Asareel."
"1Krn4,17": "Synowie Ezry: Jeter, Mered, Efer i Jalon. A żona Mereda urodziła Miriama, Szammaja i Iszbacha, ojca Esztemoi."
"1Krn4,18": "Jego żona Jehudaja urodziła Jereda, ojca Gedora, Chebera, ojca Soko, i Jekutiela, ojca Zanoacha. To są synowie Bitii, córki faraona, którą pojął za żonę Mered."
"1Krn4,19": "Synowie jego żony Hodijji, siostry Nahama, ojca Keili: Garmity i Esztemoa, Maakatyta."
"1Krn4,20": "Synowie Szimona: Amnon, Rinna, Benchanan i Tilon. A synowie Jisziego: Zochet i Benzochet."
"1Krn4,21": "Synowie Szeli, syna Judy: Er, ojciec Leki, Laada, ojciec Mareszy i tych rodów, które wytwarzały bisior w domu Aszbea;"
"1Krn4,22": "Jokim i mężczyźni Kozeby oraz Joasz i Saraf, którzy panowali w Moabie, a także Jaszubilechem. To są dawne wydarzenia."
"1Krn4,23": "Byli oni garncarzami i mieszkali w sadach i między płotami. Mieszkali tam przy królu i pracowali dla niego."
"1Krn4,24": "Synowie Symeona: Nemuel, Jamin, Jarib, Zerach i Saul."
"1Krn4,25": "Jego syn Szallum, jego syn Mibsam, jego syn Miszma."
"1Krn4,26": "A synowie Miszmy: jego syn Chamuel, jego syn Zakkur, jego syn Szimei."
"1Krn4,27": "Szimei miał szesnastu synów i sześć córek, lecz jego bracia nie mieli wielu synów i wszystkie ich rody nie były tak liczne jak rody synów Judy."
"1Krn4,28": "Mieszkali oni w Beer-Szebie, Molada i w Chasar-Szual;"
"1Krn4,29": "W Bilha, Esem i Tolad;"
"1Krn4,30": "W Betuel, Chorma i Siklag;"
"1Krn4,31": "W Bet-Markabot, Chasar-Susim, Bet-Birei i Szaaraim. To były ich miasta aż do panowania Dawida."
"1Krn4,32": "A ich wioskami były: Etam, Ain, Rimmon, Token i Aszan, pięć miast;"
"1Krn4,33": "Oraz wszystkie ich wioski położone dokoła tych miast aż do Baal. To były ich miejsca zamieszkania i spisy ich rodów."
"1Krn4,34": "Meszobab, Jamlek i Josza, syn Amazjasza;"
"1Krn4,35": "Joel i Jehu, syn Joszibiasza, syna Serajasza, syna Asiela;"
"1Krn4,36": "I Elioenaj, Jaakoba, Jeszochajasz, Asajasz, Adiel, Jesimiel i Benajasz;"
"1Krn4,37": "Ziza, syn Szifiego, syna Allona, syna Jedajasza, syna Szimriego, syna Semajasza."
"1Krn4,38": "Ci wymienieni imiennie byli naczelnikami w swoich rodach, a rodziny ich ojców bardzo się rozrosły."
"1Krn4,39": "I dotarli aż do wejścia do Gedor, aż na wschodnią stronę doliny, szukając pastwiska dla swych trzód."
"1Krn4,40": "I znaleźli obfite i dobre pastwiska oraz ziemię obszerną, spokojną i bezpieczną. Tam bowiem mieszkali przedtem Chamici."
"1Krn4,41": "Zapisani tu imiennie przyszli za czasów Ezechiasza, króla Judy, zniszczyli ich namioty i przybytki, które się tam znajdowały, doszczętnie wygubili ich i osiedlili się na ich miejscu. Tam bowiem były pastwiska dla ich trzód."
"1Krn4,42": "Niektórzy z nich, pięciuset mężczyzn spośród synów Symeona, udali się na górę Seir, a ich przywódcami byli: Pelatiasz, Neariasz, Refajasz i Uzziel, synowie Jisziego."
"1Krn4,43": "I pobili resztę ocalałych Amalekitów, i zamieszkali tam do dziś."
