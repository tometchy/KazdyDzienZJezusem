"1Krn4,1":
  text: "Synowie Judy: Peres, Chesron, Karmi, Chur i Szobal."
  tags: []
"1Krn4,2":
  text: "A Reajasz, syn Szobala, spłodził Jachata, a Jachat spłodził Achumaja i Lahada. To są rody Soreatytów."
  tags: []
"1Krn4,3":
  text: "A ci pochodzą od ojca Etama: Jizreel, Jiszma i Jidbasz, a ich siostra miała na imię Haselelponi."
  tags: []
"1Krn4,4":
  text: "Penuel był ojcem Gedora, a Ezer – ojcem Chuszy. To są synowie Chura, pierworodnego Efraty, ojca Betlejema."
  tags: []
"1Krn4,5":
  text: "A Aszur, ojciec Tekoa, miał dwie żony: Chelę i Naarę."
  tags: []
"1Krn4,6":
  text: "I Naara urodziła mu Achuzama, Chefera, Temniego i Achasztariego. Ci byli synami Naary."
  tags: []
"1Krn4,7":
  text: "Synowie Cheli: Seret, Jesochar i Etnan."
  tags: []
"1Krn4,8":
  text: "A Koz spłodził Anuba, Zobeba i rody Acharchela, syna Haruma."
  tags: []
"1Krn4,9":
  text: "A Jabes był bardziej poważany niż jego bracia. Jego matka dała mu na imię Jabes, mówiąc: Ponieważ urodziłam go w bólu."
  tags: []
"1Krn4,10":
  text: "I Jabes wzywał Boga Izraela, mówiąc: Obyś mi naprawdę błogosławił i rozszerzył moje granice, oby twoja ręka była ze mną, obyś zachował mnie od zła, abym nie był utrapiony. I Bóg spełnił to, o co go prosił."
  tags: []
"1Krn4,11":
  text: "A Kelub, brat Szuchy, spłodził Mechira, który był ojcem Esztona."
  tags: []
"1Krn4,12":
  text: "A Eszton spłodził Betrafę, Paseacha i Techinnę, ojca Irnachasza. To są mężczyźni z Rechy."
  tags: []
"1Krn4,13":
  text: "Synowie Kenaza: Otniel i Serajasz, a synowie Otniela: Chatat i Meonotaj."
  tags: []
"1Krn4,14":
  text: "Meonotaj spłodził Ofrę. Serajasz zaś spłodził Joaba, ojca Charaszimów mieszkających w dolinie – byli bowiem rzemieślnikami."
  tags: []
"1Krn4,15":
  text: "Synowie Kaleba, syna Jefunnego: Iru, Ela i Naam. A synem Eli był Kenaz."
  tags: []
"1Krn4,16":
  text: "Synowie Jehalleleela: Zif, Zifa, Tiria i Asareel."
  tags: []
"1Krn4,17":
  text: "Synowie Ezry: Jeter, Mered, Efer i Jalon. A żona Mereda urodziła Miriama, Szammaja i Iszbacha, ojca Esztemoi."
  tags: []
"1Krn4,18":
  text: "Jego żona Jehudaja urodziła Jereda, ojca Gedora, Chebera, ojca Soko, i Jekutiela, ojca Zanoacha. To są synowie Bitii, córki faraona, którą pojął za żonę Mered."
  tags: []
"1Krn4,19":
  text: "Synowie jego żony Hodijji, siostry Nahama, ojca Keili: Garmity i Esztemoa, Maakatyta."
  tags: []
"1Krn4,20":
  text: "Synowie Szimona: Amnon, Rinna, Benchanan i Tilon. A synowie Jisziego: Zochet i Benzochet."
  tags: []
"1Krn4,21":
  text: "Synowie Szeli, syna Judy: Er, ojciec Leki, Laada, ojciec Mareszy i tych rodów, które wytwarzały bisior w domu Aszbea;"
  tags: []
"1Krn4,22":
  text: "Jokim i mężczyźni Kozeby oraz Joasz i Saraf, którzy panowali w Moabie, a także Jaszubilechem. To są dawne wydarzenia."
  tags: []
"1Krn4,23":
  text: "Byli oni garncarzami i mieszkali w sadach i między płotami. Mieszkali tam przy królu i pracowali dla niego."
  tags: []
"1Krn4,24":
  text: "Synowie Symeona: Nemuel, Jamin, Jarib, Zerach i Saul."
  tags: []
"1Krn4,25":
  text: "Jego syn Szallum, jego syn Mibsam, jego syn Miszma."
  tags: []
"1Krn4,26":
  text: "A synowie Miszmy: jego syn Chamuel, jego syn Zakkur, jego syn Szimei."
  tags: []
"1Krn4,27":
  text: "Szimei miał szesnastu synów i sześć córek, lecz jego bracia nie mieli wielu synów i wszystkie ich rody nie były tak liczne jak rody synów Judy."
  tags: []
"1Krn4,28":
  text: "Mieszkali oni w Beer-Szebie, Molada i w Chasar-Szual;"
  tags: []
"1Krn4,29":
  text: "W Bilha, Esem i Tolad;"
  tags: []
"1Krn4,30":
  text: "W Betuel, Chorma i Siklag;"
  tags: []
"1Krn4,31":
  text: "W Bet-Markabot, Chasar-Susim, Bet-Birei i Szaaraim. To były ich miasta aż do panowania Dawida."
  tags: []
"1Krn4,32":
  text: "A ich wioskami były: Etam, Ain, Rimmon, Token i Aszan, pięć miast;"
  tags: []
"1Krn4,33":
  text: "Oraz wszystkie ich wioski położone dokoła tych miast aż do Baal. To były ich miejsca zamieszkania i spisy ich rodów."
  tags: []
"1Krn4,34":
  text: "Meszobab, Jamlek i Josza, syn Amazjasza;"
  tags: []
"1Krn4,35":
  text: "Joel i Jehu, syn Joszibiasza, syna Serajasza, syna Asiela;"
  tags: []
"1Krn4,36":
  text: "I Elioenaj, Jaakoba, Jeszochajasz, Asajasz, Adiel, Jesimiel i Benajasz;"
  tags: []
"1Krn4,37":
  text: "Ziza, syn Szifiego, syna Allona, syna Jedajasza, syna Szimriego, syna Semajasza."
  tags: []
"1Krn4,38":
  text: "Ci wymienieni imiennie byli naczelnikami w swoich rodach, a rodziny ich ojców bardzo się rozrosły."
  tags: []
"1Krn4,39":
  text: "I dotarli aż do wejścia do Gedor, aż na wschodnią stronę doliny, szukając pastwiska dla swych trzód."
  tags: []
"1Krn4,40":
  text: "I znaleźli obfite i dobre pastwiska oraz ziemię obszerną, spokojną i bezpieczną. Tam bowiem mieszkali przedtem Chamici."
  tags: []
"1Krn4,41":
  text: "Zapisani tu imiennie przyszli za czasów Ezechiasza, króla Judy, zniszczyli ich namioty i przybytki, które się tam znajdowały, doszczętnie wygubili ich i osiedlili się na ich miejscu. Tam bowiem były pastwiska dla ich trzód."
  tags: []
"1Krn4,42":
  text: "Niektórzy z nich, pięciuset mężczyzn spośród synów Symeona, udali się na górę Seir, a ich przywódcami byli: Pelatiasz, Neariasz, Refajasz i Uzziel, synowie Jisziego."
  tags: []
"1Krn4,43":
  text: "I pobili resztę ocalałych Amalekitów, i zamieszkali tam do dziś."
  tags: []
