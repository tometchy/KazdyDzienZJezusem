"1Krn19,1":
  text: "Potem umarł Nachasz, król synów Ammona, a jego syn królował w jego miejsce."
  tags: []
"1Krn19,2":
  text: "Wtedy Dawid powiedział: Okażę życzliwość Chanunowi, synowi Nachasza, bo jego ojciec mnie okazał życzliwość. I Dawid wysłał posłańców, aby go pocieszyć po stracie jego ojca. Przyszli więc słudzy Dawida do ziemi synów Ammona, do Chanuna, aby go pocieszyć."
  tags: []
"1Krn19,3":
  text: "Lecz książęta synów Ammona powiedzieli do Chanuna: Czy myślisz, że Dawid chce uczcić twego ojca i dlatego przysłał do ciebie pocieszycieli? Czy nie po to raczej przyszli jego słudzy do ciebie, aby przypatrzyć się tej ziemi, przeszpiegować ją i zburzyć?"
  tags: []
"1Krn19,4":
  text: "Chanun wziął więc sługi Dawida, ogolił ich, obciął ich szaty do połowy, aż do pośladków, i odesłał ich."
  tags: []
"1Krn19,5":
  text: "Wtedy niektórzy poszli i donieśli Dawidowi o tych ludziach. I wysłał posłów naprzeciw nich, ponieważ ci mężczyźni byli bardzo znieważeni. Król powiedział im: Zostańcie w Jerychu, aż wam brody odrosną, a potem wróćcie."
  tags: []
"1Krn19,6":
  text: "Gdy synowie Ammona spostrzegli, że obrzydli Dawidowi, Chanun i synowie Ammona posłali tysiąc talentów srebra, aby sobie wynająć za te pieniądze rydwany i jeźdźców z Mezopotamii, z Syrii-Maaka i z Soby."
  tags: []
"1Krn19,7":
  text: "I najęli sobie za te pieniądze trzydzieści dwa tysiące rydwanów oraz króla Maaki wraz z jego ludem. Przybyli i rozbili obóz naprzeciw Medeby, a synowie Ammona zebrali się ze swoich miast i ustawili się do bitwy."
  tags: []
"1Krn19,8":
  text: "A gdy Dawid usłyszał o tym, wysłał Joaba z całym zastępem dzielnych wojowników."
  tags: []
"1Krn19,9":
  text: "Ruszyli więc synowie Ammona i ustawili się w szyku bojowym przed bramą miejską. Królowie zaś, którzy przybyli na pomoc, stanęli osobno w polu."
  tags: []
"1Krn19,10":
  text: "Gdy Joab zobaczył, że wojsko szykuje walkę przeciwko niemu z przodu i z tyłu, wybrał mężczyzn spośród wszystkich wyborowych wojowników w Izraelu i ustawił ich w szyku bojowym przeciw Syryjczykom."
  tags: []
"1Krn19,11":
  text: "A resztę ludzi oddał pod rękę swego brata Abiszaja – oni ustawili się w szyku bojowym przeciw synom Ammona."
  tags: []
"1Krn19,12":
  text: "I powiedział: Jeśli Syryjczycy będą silniejsi ode mnie, przyjdziesz mi na pomoc, a jeśli synowie Ammona będą silniejsi od ciebie, ja przyjdę tobie na pomoc."
  tags: []
"1Krn19,13":
  text: "Bądź odważny i walczmy mężnie za nasz lud i za miasta naszego Boga, a niech PAN uczyni to, co jest dobre w jego oczach."
  tags: []
"1Krn19,14":
  text: "Joab więc wraz z ludem, który był z nim, wyruszył do bitwy z Syryjczykami. A oni uciekli przed nim."
  tags: []
"1Krn19,15":
  text: "Gdy synowie Ammona zobaczyli, że Syryjczycy uciekli, również i oni uciekli przed jego bratem Abiszajem i weszli do miasta. Wtedy Joab wrócił do Jerozolimy."
  tags: []
"1Krn19,16":
  text: "Kiedy Syryjczycy zobaczyli, że są pobici przez Izraela, wyprawili posłańców i sprowadzili Syryjczyków, którzy byli za rzeką. I Szofak, dowódca wojska Hadadezera, prowadził ich."
  tags: []
"1Krn19,17":
  text: "Gdy doniesiono o tym Dawidowi, ten zebrał cały Izrael, przeprawił się przez Jordan, przybył do nich i ustawił wojsko przeciwko nim w szyku bojowym. A gdy Dawid ustawił wojsko w szyku bojowym przeciwko Syryjczykom, oni walczyli z nim."
  tags: []
"1Krn19,18":
  text: "Lecz Syryjczycy uciekli przed Izraelem i spośród nich Dawid zabił siedem tysięcy ludzi walczących na rydwanach oraz czterdzieści tysięcy pieszych. Zabił również Szofaka, dowódcę wojska."
  tags: []
"1Krn19,19":
  text: "Kiedy słudzy Hadadezera zobaczyli, że zostali pokonani przez Izraela, zawarli pokój z Dawidem i zostali jego poddanymi. Potem Syryjczycy już nie chcieli udzielić pomocy synom Ammona."
  tags: []
