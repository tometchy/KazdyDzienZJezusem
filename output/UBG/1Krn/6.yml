"1Krn6,1":
  text: "Synowie Lewiego: Gerszom, Kehat i Merari."
  tags: []
"1Krn6,2":
  text: "A synowie Kehata: Amram, Ishar, Chebron i Uzziel."
  tags: []
"1Krn6,3":
  text: "A dzieci Amrama: Aaron, Mojżesz i Miriam. Synowie Aarona: Nadab, Abihu, Eleazar i Itamar."
  tags: []
"1Krn6,4":
  text: "Eleazar spłodził Pinchasa, a Pinchas spłodził Abiszuę."
  tags: []
"1Krn6,5":
  text: "Abiszua spłodził Bukkiego, a Bukki spłodził Uzziego."
  tags: []
"1Krn6,6":
  text: "Uzzi spłodził Zerachiasza, a Zerachiasz spłodził Merajota."
  tags: []
"1Krn6,7":
  text: "Merajot spłodził Amariasza, a Amariasz spłodził Achituba."
  tags: []
"1Krn6,8":
  text: "Achitub spłodził Sadoka, a Sadok spłodził Achimaasa."
  tags: []
"1Krn6,9":
  text: "Achimaas spłodził Azariasza, a Azariasz spłodził Jochanana."
  tags: []
"1Krn6,10":
  text: "Jochanan spłodził Azariasza. On to sprawował urząd kapłański w świątyni, którą Salomon zbudował w Jerozolimie."
  tags: []
"1Krn6,11":
  text: "Azariasz spłodził Amariasza, a Amariasz spłodził Achituba."
  tags: []
"1Krn6,12":
  text: "Achitub spłodził Sadoka, a Sadok spłodził Szalluma."
  tags: []
"1Krn6,13":
  text: "Szallum spłodził Chilkiasza, a Chilkiasz spłodził Azariasza."
  tags: []
"1Krn6,14":
  text: "Azariasz spłodził Serajasza, a Serajasz spłodził Jehocadaka."
  tags: []
"1Krn6,15":
  text: "A Jehocadak trafił do niewoli, gdy PAN uprowadził Judę i Jerozolimę przez Nabuchodonozora."
  tags: []
"1Krn6,16":
  text: "Synowie Lewiego: Gerszom, Kehat i Merari."
  tags: []
"1Krn6,17":
  text: "A to są imiona synów Gerszoma: Libni i Szimei."
  tags: []
"1Krn6,18":
  text: "A synowie Kehata: Amram, Ishar, Chebron i Uzziel."
  tags: []
"1Krn6,19":
  text: "Synowie Merariego: Machli i Muszi. A to są rody Lewitów według ich ojców."
  tags: []
"1Krn6,20":
  text: "Od Gerszoma: jego syn Libni, jego syn Jachat, jego syn Zimma;"
  tags: []
"1Krn6,21":
  text: "Jego syn Joach, jego syn Iddo, jego syn Zerach, jego syn Jeatraj."
  tags: []
"1Krn6,22":
  text: "Synowie Kehata: jego syn Amminadab, jego syn Korach, jego syn Assir;"
  tags: []
"1Krn6,23":
  text: "Jego syn Elkana, jego syn Ebiasaf, jego syn Assir;"
  tags: []
"1Krn6,24":
  text: "Jego syn Tachat, jego syn Uriel, jego syn Uzjasz, jego syn Saul."
  tags: []
"1Krn6,25":
  text: "Synowie Elkany: Amasaj, Achimot i Elkana."
  tags: []
"1Krn6,26":
  text: "Synowie Elkany: jego syn Sofaj, jego syn Nachat;"
  tags: []
"1Krn6,27":
  text: "Jego syn Eliab, jego syn Jerocham, jego syn Elkana."
  tags: []
"1Krn6,28":
  text: "Synowie Samuela: pierworodny Waszni i Abiasz."
  tags: []
"1Krn6,29":
  text: "Synowie Merariego: Machli, jego syn Libni, jego syn Szimei, jego syn Uzza;"
  tags: []
"1Krn6,30":
  text: "Jego syn Szimea, jego syn Chaggiasz, jego syn Asajasz."
  tags: []
"1Krn6,31":
  text: "To są ci, których Dawid ustanowił do prowadzenia śpiewu w domu PANA, odkąd spoczęła tam arka."
  tags: []
"1Krn6,32":
  text: "I posługiwali śpiewem przed przybytkiem, czyli Namiotem Zgromadzenia, aż Salomon zbudował dom PANA w Jerozolimie. Stawali do swojej służby według swego porządku."
  tags: []
"1Krn6,33":
  text: "A oto ci, którzy stawali wraz ze swoimi synami: spośród synów Kehata – śpiewak Heman, syn Joela, syna Samuela;"
  tags: []
"1Krn6,34":
  text: "Syna Elkany, syna Jerochama, syna Eliela, syna Toacha;"
  tags: []
"1Krn6,35":
  text: "Syna Sufa, syna Elkany, syna Machata, syna Amasaja;"
  tags: []
"1Krn6,36":
  text: "Syna Elkany, syna Joela, syna Azariasza, syna Sofoniasza;"
  tags: []
"1Krn6,37":
  text: "Syna Tachata, syna Assira, syna Ebiasafa, syna Koracha;"
  tags: []
"1Krn6,38":
  text: "Syna Ishara, syna Kehata, syna Lewiego, syna Izraela."
  tags: []
"1Krn6,39":
  text: "Oraz jego brat Asaf, który stawał po jego prawicy. Asaf, syn Berechiasza, syna Szimei;"
  tags: []
"1Krn6,40":
  text: "Syna Mikaela, syna Baasejasza, syna Malkiasza;"
  tags: []
"1Krn6,41":
  text: "Syna Etniego, syna Zeracha, syna Adajasza;"
  tags: []
"1Krn6,42":
  text: "Syna Etana, syna Zimmy, syna Szimejego;"
  tags: []
"1Krn6,43":
  text: "Syna Jachata, syna Gerszoma, syna Lewiego."
  tags: []
"1Krn6,44":
  text: "A ich bracia, synowie Merariego, stawali po lewej stronie: Etan, syn Kisziego, syna Abdiego, syna Malluka;"
  tags: []
"1Krn6,45":
  text: "Syna Chaszabiasza, syna Amaziasza, syna Chilkiasza."
  tags: []
"1Krn6,46":
  text: "Syna Amsjego, syna Baniego, syna Szamera;"
  tags: []
"1Krn6,47":
  text: "Syna Mochliego, syna Musziego, syna Merariego, syna Lewiego."
  tags: []
"1Krn6,48":
  text: "A ich bracia, Lewici, byli ustanowieni do wszelkiej posługi w przybytku domu Boga."
  tags: []
"1Krn6,49":
  text: "Aaron zaś i jego synowie palili kadzidło na ołtarzu całopalenia i na ołtarzu kadzenia, byli odpowiedzialni za wszelką posługę w Miejscu Najświętszym i za dokonywanie przebłagania za Izraela według wszystkiego, co nakazał Mojżesz, sługa Boży."
  tags: []
"1Krn6,50":
  text: "A oto synowie Aarona: jego syn Eleazar, jego syn Pinchas;"
  tags: []
"1Krn6,51":
  text: "Jego syn Abiszua, jego syn Bukki, jego syn Uzzi, jego syn Zerachiasz;"
  tags: []
"1Krn6,52":
  text: "Jego syn Merajot, jego syn Amariasz, jego syn Achitub;"
  tags: []
"1Krn6,53":
  text: "Jego syn Sadok, jego syn Achimaas."
  tags: []
"1Krn6,54":
  text: "A to są ich mieszkania według ich wieży w ich obszarze, to jest synów Aarona, według rodu Kehatytów. Był to bowiem ich los."
  tags: []
"1Krn6,55":
  text: "Oddano im Hebron w ziemi Judy wraz z pastwiskami dokoła niego;"
  tags: []
"1Krn6,56":
  text: "Lecz pola miasta i jego wsie dano Kalebowi, synowi Jefunnego."
  tags: []
"1Krn6,57":
  text: "Synom Aarona zaś dano spośród miast Judy miasta schronienia: Hebron, Libnę z jego pastwiskami, Jattir i Esztemoę wraz z ich pastwiskami;"
  tags: []
"1Krn6,58":
  text: "I Chilen z jego pastwiskami, Debir z jego pastwiskami;"
  tags: []
"1Krn6,59":
  text: "Aszan z jego pastwiskami i Bet-Szemesz z jego pastwiskami."
  tags: []
"1Krn6,60":
  text: "A od pokolenia Beniamina: Geba z jego pastwiskami, Alemet z jego pastwiskami i Anatot z jego pastwiskami. Wszystkich ich miast było trzynaście według ich rodzin."
  tags: []
"1Krn6,61":
  text: "A pozostałym synom Kehata, spośród rodziny tego pokolenia, przypadło losem dziesięć miast od połowy pokolenia Manassesa."
  tags: []
"1Krn6,62":
  text: "A synom Gerszoma według ich rodzin przypadło od pokolenia Issachara, od pokolenia Aszera, od pokolenia Neftalego i od pokolenia Manassesa w Baszanie – trzynaście miast."
  tags: []
"1Krn6,63":
  text: "Synom Merariego według ich rodzin przypadło losem od pokolenia Rubena, od pokolenia Gada i od pokolenia Zebulona – dwanaście miast."
  tags: []
"1Krn6,64":
  text: "Synowie Izraela dali Lewitom te miasta wraz z ich pastwiskami."
  tags: []
"1Krn6,65":
  text: "A dali przez los od pokolenia synów Judy, od pokolenia synów Symeona i od pokolenia synów Beniamina te miasta, którym nadali ich imiona."
  tags: []
"1Krn6,66":
  text: "A ci, którzy pochodzili z rodu synów Kehata, mieli miasta w granicach pokolenia Efraima."
  tags: []
"1Krn6,67":
  text: "Dano im z miast schronienia: Sychem z jego pastwiskami na górze Efraim i Gezer z jego pastwiskami;"
  tags: []
"1Krn6,68":
  text: "Jokmeam z jego pastwiskami, Bet-Choron z jego pastwiskami;"
  tags: []
"1Krn6,69":
  text: "Ajjalon z jego pastwiskami i Gat-Rimmon z jego pastwiskami."
  tags: []
"1Krn6,70":
  text: "Od połowy pokolenia Manassesa: Aner z jego pastwiskami, Bileam z jego pastwiskami. Dano to rodzinie pozostałych synów Kehata."
  tags: []
"1Krn6,71":
  text: "Synom Gerszoma dano od połowy pokolenia Manassesa Golan w Baszanie z jego pastwiskami i Asztarot z jego pastwiskami;"
  tags: []
"1Krn6,72":
  text: "Od pokolenia Issachara – Kedesz z jego pastwiskami, Daberat z jego pastwiskami;"
  tags: []
"1Krn6,73":
  text: "Ramot z jego pastwiskami i Anem z jego pastwiskami."
  tags: []
"1Krn6,74":
  text: "Od pokolenia Aszera: Maszal z jego pastwiskami, Abdon z jego pastwiskami;"
  tags: []
"1Krn6,75":
  text: "Chukok z jego pastwiskami i Rechob z jego pastwiskami."
  tags: []
"1Krn6,76":
  text: "Od pokolenia Neftalego: Kedesz w Galilei z jego pastwiskami, Chammon z jego pastwiskami i Kiriataim z jego pastwiskami."
  tags: []
"1Krn6,77":
  text: "Pozostałym synom Merariego dano od pokolenia Zebulona Rimmon z jego pastwiskami i Tabor z jego pastwiskami."
  tags: []
"1Krn6,78":
  text: "A po drugiej stronie Jordanu koło Jerycha, na wschód od Jordanu, dano od pokolenia Rubena: Beser na pustyni z jego pastwiskami, Jahazę z jej pastwiskami;"
  tags: []
"1Krn6,79":
  text: "Kedemot z jego pastwiskami i Mefaat z jego pastwiskami."
  tags: []
"1Krn6,80":
  text: "Od pokolenia Gada: Ramot w Gileadzie z jego pastwiskami, Machanaim z jego pastwiskami;"
  tags: []
"1Krn6,81":
  text: "Cheszbon z jego pastwiskami i Jazer z jego pastwiskami."
  tags: []
