"1Krn6,1": "Synowie Lewiego: Gerszom, Kehat i Merari."
"1Krn6,2": "A synowie Kehata: Amram, Ishar, Chebron i Uzziel."
"1Krn6,3": "A dzieci Amrama: Aaron, Mojżesz i Miriam. Synowie Aarona: Nadab, Abihu, Eleazar i Itamar."
"1Krn6,4": "Eleazar spłodził Pinchasa, a Pinchas spłodził Abiszuę."
"1Krn6,5": "Abiszua spłodził Bukkiego, a Bukki spłodził Uzziego."
"1Krn6,6": "Uzzi spłodził Zerachiasza, a Zerachiasz spłodził Merajota."
"1Krn6,7": "Merajot spłodził Amariasza, a Amariasz spłodził Achituba."
"1Krn6,8": "Achitub spłodził Sadoka, a Sadok spłodził Achimaasa."
"1Krn6,9": "Achimaas spłodził Azariasza, a Azariasz spłodził Jochanana."
"1Krn6,10": "Jochanan spłodził Azariasza. On to sprawował urząd kapłański w świątyni, którą Salomon zbudował w Jerozolimie."
"1Krn6,11": "Azariasz spłodził Amariasza, a Amariasz spłodził Achituba."
"1Krn6,12": "Achitub spłodził Sadoka, a Sadok spłodził Szalluma."
"1Krn6,13": "Szallum spłodził Chilkiasza, a Chilkiasz spłodził Azariasza."
"1Krn6,14": "Azariasz spłodził Serajasza, a Serajasz spłodził Jehocadaka."
"1Krn6,15": "A Jehocadak trafił do niewoli, gdy PAN uprowadził Judę i Jerozolimę przez Nabuchodonozora."
"1Krn6,16": "Synowie Lewiego: Gerszom, Kehat i Merari."
"1Krn6,17": "A to są imiona synów Gerszoma: Libni i Szimei."
"1Krn6,18": "A synowie Kehata: Amram, Ishar, Chebron i Uzziel."
"1Krn6,19": "Synowie Merariego: Machli i Muszi. A to są rody Lewitów według ich ojców."
"1Krn6,20": "Od Gerszoma: jego syn Libni, jego syn Jachat, jego syn Zimma;"
"1Krn6,21": "Jego syn Joach, jego syn Iddo, jego syn Zerach, jego syn Jeatraj."
"1Krn6,22": "Synowie Kehata: jego syn Amminadab, jego syn Korach, jego syn Assir;"
"1Krn6,23": "Jego syn Elkana, jego syn Ebiasaf, jego syn Assir;"
"1Krn6,24": "Jego syn Tachat, jego syn Uriel, jego syn Uzjasz, jego syn Saul."
"1Krn6,25": "Synowie Elkany: Amasaj, Achimot i Elkana."
"1Krn6,26": "Synowie Elkany: jego syn Sofaj, jego syn Nachat;"
"1Krn6,27": "Jego syn Eliab, jego syn Jerocham, jego syn Elkana."
"1Krn6,28": "Synowie Samuela: pierworodny Waszni i Abiasz."
"1Krn6,29": "Synowie Merariego: Machli, jego syn Libni, jego syn Szimei, jego syn Uzza;"
"1Krn6,30": "Jego syn Szimea, jego syn Chaggiasz, jego syn Asajasz."
"1Krn6,31": "To są ci, których Dawid ustanowił do prowadzenia śpiewu w domu PANA, odkąd spoczęła tam arka."
"1Krn6,32": "I posługiwali śpiewem przed przybytkiem, czyli Namiotem Zgromadzenia, aż Salomon zbudował dom PANA w Jerozolimie. Stawali do swojej służby według swego porządku."
"1Krn6,33": "A oto ci, którzy stawali wraz ze swoimi synami: spośród synów Kehata – śpiewak Heman, syn Joela, syna Samuela;"
"1Krn6,34": "Syna Elkany, syna Jerochama, syna Eliela, syna Toacha;"
"1Krn6,35": "Syna Sufa, syna Elkany, syna Machata, syna Amasaja;"
"1Krn6,36": "Syna Elkany, syna Joela, syna Azariasza, syna Sofoniasza;"
"1Krn6,37": "Syna Tachata, syna Assira, syna Ebiasafa, syna Koracha;"
"1Krn6,38": "Syna Ishara, syna Kehata, syna Lewiego, syna Izraela."
"1Krn6,39": "Oraz jego brat Asaf, który stawał po jego prawicy. Asaf, syn Berechiasza, syna Szimei;"
"1Krn6,40": "Syna Mikaela, syna Baasejasza, syna Malkiasza;"
"1Krn6,41": "Syna Etniego, syna Zeracha, syna Adajasza;"
"1Krn6,42": "Syna Etana, syna Zimmy, syna Szimejego;"
"1Krn6,43": "Syna Jachata, syna Gerszoma, syna Lewiego."
"1Krn6,44": "A ich bracia, synowie Merariego, stawali po lewej stronie: Etan, syn Kisziego, syna Abdiego, syna Malluka;"
"1Krn6,45": "Syna Chaszabiasza, syna Amaziasza, syna Chilkiasza."
"1Krn6,46": "Syna Amsjego, syna Baniego, syna Szamera;"
"1Krn6,47": "Syna Mochliego, syna Musziego, syna Merariego, syna Lewiego."
"1Krn6,48": "A ich bracia, Lewici, byli ustanowieni do wszelkiej posługi w przybytku domu Boga."
"1Krn6,49": "Aaron zaś i jego synowie palili kadzidło na ołtarzu całopalenia i na ołtarzu kadzenia, byli odpowiedzialni za wszelką posługę w Miejscu Najświętszym i za dokonywanie przebłagania za Izraela według wszystkiego, co nakazał Mojżesz, sługa Boży."
"1Krn6,50": "A oto synowie Aarona: jego syn Eleazar, jego syn Pinchas;"
"1Krn6,51": "Jego syn Abiszua, jego syn Bukki, jego syn Uzzi, jego syn Zerachiasz;"
"1Krn6,52": "Jego syn Merajot, jego syn Amariasz, jego syn Achitub;"
"1Krn6,53": "Jego syn Sadok, jego syn Achimaas."
"1Krn6,54": "A to są ich mieszkania według ich wieży w ich obszarze, to jest synów Aarona, według rodu Kehatytów. Był to bowiem ich los."
"1Krn6,55": "Oddano im Hebron w ziemi Judy wraz z pastwiskami dokoła niego;"
"1Krn6,56": "Lecz pola miasta i jego wsie dano Kalebowi, synowi Jefunnego."
"1Krn6,57": "Synom Aarona zaś dano spośród miast Judy miasta schronienia: Hebron, Libnę z jego pastwiskami, Jattir i Esztemoę wraz z ich pastwiskami;"
"1Krn6,58": "I Chilen z jego pastwiskami, Debir z jego pastwiskami;"
"1Krn6,59": "Aszan z jego pastwiskami i Bet-Szemesz z jego pastwiskami."
"1Krn6,60": "A od pokolenia Beniamina: Geba z jego pastwiskami, Alemet z jego pastwiskami i Anatot z jego pastwiskami. Wszystkich ich miast było trzynaście według ich rodzin."
"1Krn6,61": "A pozostałym synom Kehata, spośród rodziny tego pokolenia, przypadło losem dziesięć miast od połowy pokolenia Manassesa."
"1Krn6,62": "A synom Gerszoma według ich rodzin przypadło od pokolenia Issachara, od pokolenia Aszera, od pokolenia Neftalego i od pokolenia Manassesa w Baszanie – trzynaście miast."
"1Krn6,63": "Synom Merariego według ich rodzin przypadło losem od pokolenia Rubena, od pokolenia Gada i od pokolenia Zebulona – dwanaście miast."
"1Krn6,64": "Synowie Izraela dali Lewitom te miasta wraz z ich pastwiskami."
"1Krn6,65": "A dali przez los od pokolenia synów Judy, od pokolenia synów Symeona i od pokolenia synów Beniamina te miasta, którym nadali ich imiona."
"1Krn6,66": "A ci, którzy pochodzili z rodu synów Kehata, mieli miasta w granicach pokolenia Efraima."
"1Krn6,67": "Dano im z miast schronienia: Sychem z jego pastwiskami na górze Efraim i Gezer z jego pastwiskami;"
"1Krn6,68": "Jokmeam z jego pastwiskami, Bet-Choron z jego pastwiskami;"
"1Krn6,69": "Ajjalon z jego pastwiskami i Gat-Rimmon z jego pastwiskami."
"1Krn6,70": "Od połowy pokolenia Manassesa: Aner z jego pastwiskami, Bileam z jego pastwiskami. Dano to rodzinie pozostałych synów Kehata."
"1Krn6,71": "Synom Gerszoma dano od połowy pokolenia Manassesa Golan w Baszanie z jego pastwiskami i Asztarot z jego pastwiskami;"
"1Krn6,72": "Od pokolenia Issachara – Kedesz z jego pastwiskami, Daberat z jego pastwiskami;"
"1Krn6,73": "Ramot z jego pastwiskami i Anem z jego pastwiskami."
"1Krn6,74": "Od pokolenia Aszera: Maszal z jego pastwiskami, Abdon z jego pastwiskami;"
"1Krn6,75": "Chukok z jego pastwiskami i Rechob z jego pastwiskami."
"1Krn6,76": "Od pokolenia Neftalego: Kedesz w Galilei z jego pastwiskami, Chammon z jego pastwiskami i Kiriataim z jego pastwiskami."
"1Krn6,77": "Pozostałym synom Merariego dano od pokolenia Zebulona Rimmon z jego pastwiskami i Tabor z jego pastwiskami."
"1Krn6,78": "A po drugiej stronie Jordanu koło Jerycha, na wschód od Jordanu, dano od pokolenia Rubena: Beser na pustyni z jego pastwiskami, Jahazę z jej pastwiskami;"
"1Krn6,79": "Kedemot z jego pastwiskami i Mefaat z jego pastwiskami."
"1Krn6,80": "Od pokolenia Gada: Ramot w Gileadzie z jego pastwiskami, Machanaim z jego pastwiskami;"
"1Krn6,81": "Cheszbon z jego pastwiskami i Jazer z jego pastwiskami."
