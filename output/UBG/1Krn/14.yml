"1Krn14,1":
  text: "Potem Hiram, król Tyru, wysłał posłów do Dawida wraz z drewnem cedrowym, murarzami i cieślami, aby mu zbudowali dom."
  tags: []
"1Krn14,2":
  text: "I Dawid poznał, że PAN potwierdził jego królowanie nad Izraelem, gdyż wywyższył jego królestwo ze względu na swój lud Izraela."
  tags: []
"1Krn14,3":
  text: "Dawid pojął więcej żon w Jerozolimie i spłodził więcej synów i córek."
  tags: []
"1Krn14,4":
  text: "A oto imiona tych, którzy mu się urodzili w Jerozolimie: Szammua, Szobab, Natan, Salomon;"
  tags: []
"1Krn14,5":
  text: "Jibchar, Eliszua, Elpalet;"
  tags: []
"1Krn14,6":
  text: "Noga, Nefeg, Jafia;"
  tags: []
"1Krn14,7":
  text: "Eliszama, Beeliada i Elifelet."
  tags: []
"1Krn14,8":
  text: "Kiedy Filistyni usłyszeli, że Dawid został namaszczony na króla nad całym Izraelem, wszyscy Filistyni wyruszyli, aby go szukać. Gdy Dawid usłyszał o tym, wyszedł naprzeciw nich."
  tags: []
"1Krn14,9":
  text: "Filistyni przybyli i rozciągnęli się w dolinie Refaim."
  tags: []
"1Krn14,10":
  text: "I Dawid radził się Boga, mówiąc: Czy mam wyruszyć przeciw Filistynom i czy wydasz ich w moje ręce? PAN mu odpowiedział: Wyruszaj, a wydam ich w twoje ręce."
  tags: []
"1Krn14,11":
  text: "A gdy przybyli do Baal-Perasim, tam Dawid ich pobił. Wtedy Dawid powiedział: Bóg rozerwał moich wrogów przez moją rękę, jak rozrywają się wody. Dlatego nazwał to miejsce Baal-Perasim."
  tags: []
"1Krn14,12":
  text: "I porzucili tam swoje bożki, a Dawid rozkazał spalić je ogniem."
  tags: []
"1Krn14,13":
  text: "Lecz Filistyni znowu rozciągnęli się w dolinie."
  tags: []
"1Krn14,14":
  text: "Dawid więc ponownie radził się Boga, a Bóg mu odpowiedział: Nie ruszaj na nich, ale odwróć się od nich, abyś natarł na nich od strony drzew morwowych."
  tags: []
"1Krn14,15":
  text: "A gdy usłyszysz odgłos kroków wśród wierzchołków drzew morwowych, wtedy wyruszysz do bitwy, gdyż Bóg wyruszył przed tobą, aby pobić wojska Filistynów."
  tags: []
"1Krn14,16":
  text: "I Dawid uczynił tak, jak mu rozkazał Bóg, i pobili wojska Filistynów od Gibeonu aż do Gezer."
  tags: []
"1Krn14,17":
  text: "I w ten sposób rozsławiło się imię Dawida na wszystkich ziemiach, a PAN sprawił, że bały się go wszystkie narody."
  tags: []
