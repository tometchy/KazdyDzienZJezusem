"1Krn7,1":
  text: "Synami Issachara byli: Tola, Pua, Jaszub, Szimron – czterej."
  tags: []
"1Krn7,2":
  text: "Synowie Tolego: Uzzi, Refajasz, Jeriel, Jachmaj, Jibsam i Szemuel – naczelnicy rodów Toli. Byli oni dzielnymi wojownikami w swoich czasach. Ich liczba za czasów Dawida wynosiła dwadzieścia dwa tysiące sześciuset."
  tags: []
"1Krn7,3":
  text: "Synowie Uzziego: Izrachiasz, a synowie Izrachiasza: Mikael, Obadiasz, Joel i Jeszijasz, pięciu – wszyscy naczelnicy."
  tags: []
"1Krn7,4":
  text: "A z nimi, według rodowodów, według domów ich ojców, były oddziały zbrojne do walki w liczbie trzydziestu sześciu tysięcy. Mieli bowiem wiele żon i synów."
  tags: []
"1Krn7,5":
  text: "Ich bracia według wszystkich rodów Issachara, dzielni wojownicy, liczyli osiemdziesiąt siedem tysięcy, wszyscy spisani byli według rodowodów."
  tags: []
"1Krn7,6":
  text: "Synowie Beniamina: Bela, Beker i Jediael, trzej."
  tags: []
"1Krn7,7":
  text: "Synowie Beli: Eszbon, Uzzi, Uzziel, Jerimot i Iri, pięciu – naczelnicy domów ojców, dzielni wojownicy; spisani według rodowodu liczyli dwadzieścia dwa tysiące trzydziestu czterech."
  tags: []
"1Krn7,8":
  text: "Synowie Bekera: Zemira, Joasz, Eliezer, Elioenaj, Omri, Jerimot, Abiasz, Anatot i Alamet. Ci wszyscy byli synami Bekera."
  tags: []
"1Krn7,9":
  text: "A spisani według swoich rodowodów, naczelnicy domów swoich ojców, dzielni wojownicy, liczyli dwadzieścia tysięcy dwustu mężczyzn."
  tags: []
"1Krn7,10":
  text: "Synowie Jediaela: Bilhan, a synowie Bilhana: Jehusz, Beniamin, Ehud, Kenaana, Zetan, Tarszisz i Achiszachar."
  tags: []
"1Krn7,11":
  text: "Ci wszyscy synowie Jediaela, naczelnicy rodów, dzielni wojownicy, liczyli siedemnaście tysięcy dwustu wyruszających na wojnę do bitwy;"
  tags: []
"1Krn7,12":
  text: "Także Szuppim i Chuppim, synowie Ira, oraz Chuszim, synowie Achera."
  tags: []
"1Krn7,13":
  text: "Synowie Neftalego: Jachasjel, Guni, Jeser i Szallum, synowie Bilhy."
  tags: []
"1Krn7,14":
  text: "Synowie Manassesa: Asriel, którego urodziła mu żona (a jego nałożnica Aramejka urodziła Makira, ojca Gileada;"
  tags: []
"1Krn7,15":
  text: "A Makir wziął sobie za żonę siostrę Chuppima i Szuppima, która miała na imię Maaka); drugi syn miał na imię Selofchad. Selofchad zaś miał tylko córki."
  tags: []
"1Krn7,16":
  text: "Maaka, żona Makira, urodziła syna i nadała mu imię Peresz. Jego brat miał na imię Szeresz, a jego synami byli Ulam i Rekiem."
  tags: []
"1Krn7,17":
  text: "Synowie Ulama: Bedon. To są synowie Gileada, syna Makira, syna Manassesa."
  tags: []
"1Krn7,18":
  text: "Jego siostra Hammoleket urodziła Iszhoda, Abiezera i Machlę."
  tags: []
"1Krn7,19":
  text: "Synowie Szemidy: Achian, Szekem, Likchi i Aniam."
  tags: []
"1Krn7,20":
  text: "Synowie Efraima: Szutelach, jego syn Bered, jego syn Tachat, jego syn Elada, jego syn Tachat;"
  tags: []
"1Krn7,21":
  text: "Jego syn Zabad, jego syn Szutelach, a także Eser i Elad, których zabili ludzie z Gat urodzeni w tej ziemi. Wtargnęli bowiem, aby zabrać ich stada."
  tags: []
"1Krn7,22":
  text: "Ich ojciec Efraim opłakiwał ich przez wiele dni, a jego bracia przyszli, aby go pocieszyć."
  tags: []
"1Krn7,23":
  text: "Potem obcował ze swoją żoną, a ona poczęła i urodziła syna, i nadał mu imię Beria, ponieważ stało się nieszczęście w jego domu."
  tags: []
"1Krn7,24":
  text: "Jego córką była Szeera, która zbudowała Bet-Choron dolne i górne oraz Uzen-Szeera."
  tags: []
"1Krn7,25":
  text: "I jego syn Refach, i Reszef, a jego syn Telach, jego syn Tachan;"
  tags: []
"1Krn7,26":
  text: "Jego syn Ladan, jego syn Ammihud, jego syn Eliszama;"
  tags: []
"1Krn7,27":
  text: "Jego syn Nun, jego syn Jozue."
  tags: []
"1Krn7,28":
  text: "A ich posiadłości i miejsca zamieszkania to Betel i należące do niego miejscowości, na wschód – Naaran, a na zachód – Gezer i należące do niego miejscowości, a także Sychem i należące do niego miejscowości; aż do Gazy i należących do niej miejscowości."
  tags: []
"1Krn7,29":
  text: "I aż do granic synów Manassesa, które stanowiły Bet-Szean i należące do niego miejscowości, Tanak i należące do niego miejscowości, Megiddo i należące do niego miejscowości oraz Dor i należące do niego miejscowości. W nich mieszkali synowie Józefa, syna Izraela."
  tags: []
"1Krn7,30":
  text: "Synowie Aszera: Jimna, Jiszwa, Jiszwi, Beria i Sera, ich siostra."
  tags: []
"1Krn7,31":
  text: "Synowie Berii: Cheber i Malkiel, który jest ojcem Birzaita."
  tags: []
"1Krn7,32":
  text: "A Cheber spłodził Jafleta, Szomera, Chotama oraz ich siostrę Szuę."
  tags: []
"1Krn7,33":
  text: "Synowie Jafleta: Pasak, Bimhal i Aszwat. To są synowie Jafleta."
  tags: []
"1Krn7,34":
  text: "Synowie Szomera: Achi, Rohga, Jechubba i Aram."
  tags: []
"1Krn7,35":
  text: "Synowie jego brata Chelema: Sofach, Jimna, Szelesz i Amal."
  tags: []
"1Krn7,36":
  text: "Synowie Sofacha: Suach, Charnefer, Szual, Beri, Jimra;"
  tags: []
"1Krn7,37":
  text: "Beser, Hod, Szamma, Szilsza, Jitran i Beera."
  tags: []
"1Krn7,38":
  text: "Synowie Jetera: Jefunne, Pispa i Ara."
  tags: []
"1Krn7,39":
  text: "Synowie Ulli: Arach, Channiel i Risja."
  tags: []
"1Krn7,40":
  text: "Ci wszyscy to synowie Aszera, naczelnicy rodów, wyborowi i dzielni wojownicy, pierwsi wśród książąt. Ich liczba spisana według rodowodu wynosiła dwadzieścia sześć tysięcy zdolnych do walki."
  tags: []
