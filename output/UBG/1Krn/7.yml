"1Krn7,1": "Synami Issachara byli: Tola, Pua, Jaszub, Szimron – czterej."
"1Krn7,2": "Synowie Tolego: Uzzi, Refajasz, Jeriel, Jachmaj, Jibsam i Szemuel – naczelnicy rodów Toli. Byli oni dzielnymi wojownikami w swoich czasach. Ich liczba za czasów Dawida wynosiła dwadzieścia dwa tysiące sześciuset."
"1Krn7,3": "Synowie Uzziego: Izrachiasz, a synowie Izrachiasza: Mikael, Obadiasz, Joel i Jeszijasz, pięciu – wszyscy naczelnicy."
"1Krn7,4": "A z nimi, według rodowodów, według domów ich ojców, były oddziały zbrojne do walki w liczbie trzydziestu sześciu tysięcy. Mieli bowiem wiele żon i synów."
"1Krn7,5": "Ich bracia według wszystkich rodów Issachara, dzielni wojownicy, liczyli osiemdziesiąt siedem tysięcy, wszyscy spisani byli według rodowodów."
"1Krn7,6": "Synowie Beniamina: Bela, Beker i Jediael, trzej."
"1Krn7,7": "Synowie Beli: Eszbon, Uzzi, Uzziel, Jerimot i Iri, pięciu – naczelnicy domów ojców, dzielni wojownicy; spisani według rodowodu liczyli dwadzieścia dwa tysiące trzydziestu czterech."
"1Krn7,8": "Synowie Bekera: Zemira, Joasz, Eliezer, Elioenaj, Omri, Jerimot, Abiasz, Anatot i Alamet. Ci wszyscy byli synami Bekera."
"1Krn7,9": "A spisani według swoich rodowodów, naczelnicy domów swoich ojców, dzielni wojownicy, liczyli dwadzieścia tysięcy dwustu mężczyzn."
"1Krn7,10": "Synowie Jediaela: Bilhan, a synowie Bilhana: Jehusz, Beniamin, Ehud, Kenaana, Zetan, Tarszisz i Achiszachar."
"1Krn7,11": "Ci wszyscy synowie Jediaela, naczelnicy rodów, dzielni wojownicy, liczyli siedemnaście tysięcy dwustu wyruszających na wojnę do bitwy;"
"1Krn7,12": "Także Szuppim i Chuppim, synowie Ira, oraz Chuszim, synowie Achera."
"1Krn7,13": "Synowie Neftalego: Jachasjel, Guni, Jeser i Szallum, synowie Bilhy."
"1Krn7,14": "Synowie Manassesa: Asriel, którego urodziła mu żona (a jego nałożnica Aramejka urodziła Makira, ojca Gileada;"
"1Krn7,15": "A Makir wziął sobie za żonę siostrę Chuppima i Szuppima, która miała na imię Maaka); drugi syn miał na imię Selofchad. Selofchad zaś miał tylko córki."
"1Krn7,16": "Maaka, żona Makira, urodziła syna i nadała mu imię Peresz. Jego brat miał na imię Szeresz, a jego synami byli Ulam i Rekiem."
"1Krn7,17": "Synowie Ulama: Bedon. To są synowie Gileada, syna Makira, syna Manassesa."
"1Krn7,18": "Jego siostra Hammoleket urodziła Iszhoda, Abiezera i Machlę."
"1Krn7,19": "Synowie Szemidy: Achian, Szekem, Likchi i Aniam."
"1Krn7,20": "Synowie Efraima: Szutelach, jego syn Bered, jego syn Tachat, jego syn Elada, jego syn Tachat;"
"1Krn7,21": "Jego syn Zabad, jego syn Szutelach, a także Eser i Elad, których zabili ludzie z Gat urodzeni w tej ziemi. Wtargnęli bowiem, aby zabrać ich stada."
"1Krn7,22": "Ich ojciec Efraim opłakiwał ich przez wiele dni, a jego bracia przyszli, aby go pocieszyć."
"1Krn7,23": "Potem obcował ze swoją żoną, a ona poczęła i urodziła syna, i nadał mu imię Beria, ponieważ stało się nieszczęście w jego domu."
"1Krn7,24": "Jego córką była Szeera, która zbudowała Bet-Choron dolne i górne oraz Uzen-Szeera."
"1Krn7,25": "I jego syn Refach, i Reszef, a jego syn Telach, jego syn Tachan;"
"1Krn7,26": "Jego syn Ladan, jego syn Ammihud, jego syn Eliszama;"
"1Krn7,27": "Jego syn Nun, jego syn Jozue."
"1Krn7,28": "A ich posiadłości i miejsca zamieszkania to Betel i należące do niego miejscowości, na wschód – Naaran, a na zachód – Gezer i należące do niego miejscowości, a także Sychem i należące do niego miejscowości; aż do Gazy i należących do niej miejscowości."
"1Krn7,29": "I aż do granic synów Manassesa, które stanowiły Bet-Szean i należące do niego miejscowości, Tanak i należące do niego miejscowości, Megiddo i należące do niego miejscowości oraz Dor i należące do niego miejscowości. W nich mieszkali synowie Józefa, syna Izraela."
"1Krn7,30": "Synowie Aszera: Jimna, Jiszwa, Jiszwi, Beria i Sera, ich siostra."
"1Krn7,31": "Synowie Berii: Cheber i Malkiel, który jest ojcem Birzaita."
"1Krn7,32": "A Cheber spłodził Jafleta, Szomera, Chotama oraz ich siostrę Szuę."
"1Krn7,33": "Synowie Jafleta: Pasak, Bimhal i Aszwat. To są synowie Jafleta."
"1Krn7,34": "Synowie Szomera: Achi, Rohga, Jechubba i Aram."
"1Krn7,35": "Synowie jego brata Chelema: Sofach, Jimna, Szelesz i Amal."
"1Krn7,36": "Synowie Sofacha: Suach, Charnefer, Szual, Beri, Jimra;"
"1Krn7,37": "Beser, Hod, Szamma, Szilsza, Jitran i Beera."
"1Krn7,38": "Synowie Jetera: Jefunne, Pispa i Ara."
"1Krn7,39": "Synowie Ulli: Arach, Channiel i Risja."
"1Krn7,40": "Ci wszyscy to synowie Aszera, naczelnicy rodów, wyborowi i dzielni wojownicy, pierwsi wśród książąt. Ich liczba spisana według rodowodu wynosiła dwadzieścia sześć tysięcy zdolnych do walki."
