"1Krn5,1":
  text: "Synowie Rubena, pierworodnego Izraela. Był on pierworodnym, ale ponieważ zbezcześcił łoże swego ojca, jego pierworództwo zostało dane synom Józefa, syna Izraela. Nie spisano więc rodowodu według pierworództwa."
  tags: []
"1Krn5,2":
  text: "Juda bowiem był najpotężniejszy wśród swoich braci i od niego pochodził władca, lecz pierworództwo należało do Józefa."
  tags: []
"1Krn5,3":
  text: "Synami Rubena, pierworodnego Izraela, byli: Henoch, Pallu, Chesron i Karmi."
  tags: []
"1Krn5,4":
  text: "Synowie Joela: jego syn Szemajasz, jego syn Gog, jego syn Szimei;"
  tags: []
"1Krn5,5":
  text: "Jego syn Micheasz, jego syn Reajasz, jego syn Baal;"
  tags: []
"1Krn5,6":
  text: "Jego syn Beera, którego Tiglat-Pileser, król Asyrii, wziął do niewoli. On był księciem Rubenitów."
  tags: []
"1Krn5,7":
  text: "Jego braćmi według swoich rodzin, gdy spisywano rodowody ich pokoleń, byli naczelnicy: Jejel, Zachariasz;"
  tags: []
"1Krn5,8":
  text: "I Bela, syn Azaza, syna Szemy, syna Joela, który zamieszkiwał w Aroerze aż po Nebo i Baal-Meon."
  tags: []
"1Krn5,9":
  text: "A na wschodzie zamieszkiwał aż do wejścia na pustkowie od rzeki Eufrat. Ich stada bowiem pomnożyły się w ziemi Gilead."
  tags: []
"1Krn5,10":
  text: "Za czasów Saula prowadzili wojnę z Hagrytami, którzy zostali przez nich pokonani. Zamieszkali więc w ich namiotach w całej wschodniej części Gileadu."
  tags: []
"1Krn5,11":
  text: "A synowie Gada mieszkali naprzeciw nich w ziemi Baszanu, aż do Salka."
  tags: []
"1Krn5,12":
  text: "Joel był zwierzchnikiem, potem Szafam, następnie Janaj i Szafat w Baszanie."
  tags: []
"1Krn5,13":
  text: "A ich braćmi według domów swoich ojców byli: Mikael, Meszullam, Szeba, Joraj, Jakan, Zija i Eber – siedmiu."
  tags: []
"1Krn5,14":
  text: "Ci są synami Abichaila, syna Churiego, syna Jaroacha, syna Gileada, syna Mikaela, syna Jesziszaja, syna Jachdo, syna Buza;"
  tags: []
"1Krn5,15":
  text: "Achi, syn Abdiela, syna Guniego – głowa domu ich ojców."
  tags: []
"1Krn5,16":
  text: "I mieszkali w Gileadzie, w Baszanie, w jego miasteczkach i na wszystkich pastwiskach Szaronu aż po ich krańce."
  tags: []
"1Krn5,17":
  text: "Wszyscy oni spisani zostali według rodowodów za czasów Jotama, króla Judy, i za czasów Jeroboama, króla Izraela."
  tags: []
"1Krn5,18":
  text: "Synów Rubena i Gada oraz połowy pokolenia Manassesa, dzielnych wojowników zdolnych do noszenia tarczy i miecza i do strzelania z łuku i wyćwiczonych w boju, było czterdzieści cztery tysiące siedmiuset sześćdziesięciu wyruszających do bitwy."
  tags: []
"1Krn5,19":
  text: "Oni prowadzili wojnę z Hagrytami, z Jeturem, z Nafiszem i Nodabem;"
  tags: []
"1Krn5,20":
  text: "I otrzymali pomoc przeciwko nim. Wydano więc w ich ręce Hagrytów wraz ze wszystkimi, którzy z nimi byli. Podczas walki bowiem wołali do Boga, a on ich wysłuchał, bo pokładali w nim ufność."
  tags: []
"1Krn5,21":
  text: "I zabrali z ich stad: pięćdziesiąt tysięcy wielbłądów, dwieście pięćdziesiąt tysięcy owiec, dwa tysiące osłów, a ludzi – sto tysięcy."
  tags: []
"1Krn5,22":
  text: "Wielu bowiem poległo, gdyż wojna ta wyszła od Boga. I mieszkali na ich miejscu aż do uprowadzenia do niewoli."
  tags: []
"1Krn5,23":
  text: "Ale synowie połowy pokolenia Manassesa mieszkali w tej ziemi i rozmnożyli się od Baszanu aż do Baal-Chermon i Seniru, i do góry Hermon."
  tags: []
"1Krn5,24":
  text: "A oto są naczelnicy domów ich ojców: Efer, Jiszi, Eliel, Azriel, Jeremiasz, Hodawiasz i Jachdiel, dzielni wojownicy, ludzie sławni, naczelnicy domu swoich ojców."
  tags: []
"1Krn5,25":
  text: "Lecz zgrzeszyli przeciw Bogu swoich ojców i cudzołożyli, idąc za bogami narodów tej ziemi, które Bóg zniszczył przed nimi."
  tags: []
"1Krn5,26":
  text: "Wtedy Bóg Izraela pobudził ducha Pula, króla Asyrii, i ducha Tiglat-Pilesera, króla Asyrii, i uprowadził Rubenitów i Gadytów oraz połowę pokolenia Manassesa i zaprowadził ich do Chalach, do Chabor, do Hara i do rzeki Gozan; są tam aż do dziś."
  tags: []
