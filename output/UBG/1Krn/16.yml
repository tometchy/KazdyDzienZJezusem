"1Krn16,1":
  text: "A gdy przynieśli arkę Boga i umieścili ją pośrodku namiotu wzniesionego przez Dawida, złożyli całopalenia i ofiary pojednawcze przed Bogiem."
  tags: []
"1Krn16,2":
  text: "A gdy Dawid skończył składanie całopaleń i ofiar pojednawczych, błogosławił lud w imię PANA."
  tags: []
"1Krn16,3":
  text: "I rozdał wszystkim Izraelitom, tak mężczyźnie, jak i kobiecie, po bochenku chleba i po kawałku mięsa oraz po bukłaku wina."
  tags: []
"1Krn16,4":
  text: "Ustanowił też niektórych Lewitów sługami przed arką PANA, aby wspominali i chwalili go, i dziękowali PANU, Bogu Izraela:"
  tags: []
"1Krn16,5":
  text: "Asafa, naczelnika, a po nim Zachariasza, Jejela, Szemiramota, Jechiela, Mattitiasza, Eliaba, Benajasza i Obed-Edoma: Jejela do gry na instrumentach: cytrach i harfach, a Asafa – na cymbałach;"
  tags: []
"1Krn16,6":
  text: "A kapłanów Benajasza i Jachaziela, aby stali nieustannie z trąbami przed arką przymierza Boga."
  tags: []
"1Krn16,7":
  text: "Wtedy w tym dniu Dawid postanowił po raz pierwszy, aby Asaf i jego bracia chwalili PANA tym psalmem:"
  tags: []
"1Krn16,8":
  text: "Wysławiajcie PANA, wzywajcie jego imienia, opowiadajcie między narodami sprawy jego."
  tags: []
"1Krn16,9":
  text: "Śpiewajcie mu, śpiewajcie mu psalmy, rozmawiajcie o wszystkich jego cudach."
  tags: []
"1Krn16,10":
  text: "Chlubcie się jego świętym imieniem, niech się raduje serce szukających PANA."
  tags: []
"1Krn16,11":
  text: "Szukajcie PANA i jego mocy, szukajcie zawsze jego oblicza."
  tags: []
"1Krn16,12":
  text: "Przypominajcie sobie dzieła, które czynił, jego cuda i wyroki jego ust."
  tags: []
"1Krn16,13":
  text: "Wy, potomkowie Izraela, jego sługi; wy, synowie Jakuba, jego wybrańcy!"
  tags: []
"1Krn16,14":
  text: "On jest PANEM, naszym Bogiem, jego sądy na całej ziemi."
  tags: []
"1Krn16,15":
  text: "Pamiętajcie zawsze o jego przymierzu, o słowie, które nakazał po tysiąc pokoleń;"
  tags: []
"1Krn16,16":
  text: "O przymierzu, które zawarł z Abrahamem, i o przysiędze złożonej Izaakowi."
  tags: []
"1Krn16,17":
  text: "Ustanowił je jako prawo dla Jakuba, jako wieczne przymierze dla Izraela;"
  tags: []
"1Krn16,18":
  text: "Mówiąc: Tobie dam ziemię Kanaan jako dział waszego dziedzictwa;"
  tags: []
"1Krn16,19":
  text: "Kiedy było was niewielu, byliście nieliczni i obcy w niej."
  tags: []
"1Krn16,20":
  text: "I wędrowali od narodu do narodu, z jednego królestwa do innego ludu;"
  tags: []
"1Krn16,21":
  text: "Nikomu nie pozwolił ich krzywdzić, nawet karcił królów z ich powodu, mówiąc;"
  tags: []
"1Krn16,22":
  text: "Nie dotykajcie moich pomazańców, a moim prorokom nie czyńcie nic złego."
  tags: []
"1Krn16,23":
  text: "Śpiewaj PANU, cała ziemio, opowiadajcie dzień po dniu o jego zbawieniu."
  tags: []
"1Krn16,24":
  text: "Głoście wśród narodów jego chwałę, pośród wszystkich ludów – jego cudowne dzieła;"
  tags: []
"1Krn16,25":
  text: "Wielki bowiem jest PAN i godny wszelkiej chwały, straszliwszy nad wszystkich bogów;"
  tags: []
"1Krn16,26":
  text: "Gdyż wszyscy bogowie narodów są bożkami, a PAN uczynił niebiosa."
  tags: []
"1Krn16,27":
  text: "Chwała i cześć przed nim, moc i radość w jego przybytku."
  tags: []
"1Krn16,28":
  text: "Oddajcie PANU, rodziny narodów, oddajcie PANU chwałę i moc."
  tags: []
"1Krn16,29":
  text: "Oddajcie PANU chwałę jego imienia. Przynoście dary i przychodźcie przed jego oblicze. Oddajcie PANU pokłon w ozdobie świętości."
  tags: []
"1Krn16,30":
  text: "Zadrżyj przed nim, cała ziemio. Świat będzie utwierdzony, aby się nie poruszył."
  tags: []
"1Krn16,31":
  text: "Niech się weselą niebiosa i niech się raduje ziemia, niech mówią wśród narodów: PAN króluje!"
  tags: []
"1Krn16,32":
  text: "Niech zaszumi morze i to, co je napełnia, niech radują się pola i wszystko, co jest na nich."
  tags: []
"1Krn16,33":
  text: "Wtedy radośnie wykrzykną leśne drzewa przed PANEM, bo idzie, aby sądzić ziemię."
  tags: []
"1Krn16,34":
  text: "Wysławiajcie PANA, bo jest dobry, bo jego miłosierdzie trwa na wieki."
  tags: []
"1Krn16,35":
  text: "I mówcie: Zbaw nas, BOŻE naszego zbawienia, i zgromadź nas, i wybaw nas od pogan, abyśmy wielbili twoje święte imię i chlubili się twoją chwałą."
  tags: []
"1Krn16,36":
  text: "Błogosławiony PAN, Bóg Izraela, na wieki wieków. I cały lud powiedział: Amen i chwalił PANA."
  tags: []
"1Krn16,37":
  text: "I Dawid zostawił tam przed arką przymierza PANA Asafa i jego braci, aby nieustannie pełnili służbę przed arką, według potrzeby każdego dnia;"
  tags: []
"1Krn16,38":
  text: "Także Obed-Edoma i ich braci, sześćdziesięciu ośmiu; a Obed-Edoma, syna Jedutuna, i Chosę uczynił odźwiernymi."
  tags: []
"1Krn16,39":
  text: "Kapłana Sadoka i jego braci kapłanów pozostawił przed przybytkiem PANA na wyżynie w Gibeonie;"
  tags: []
"1Krn16,40":
  text: "Aby składali PANU nieustannie, rano i wieczorem, całopalenia na ołtarzu całopaleń, zgodnie ze wszystkim, co jest napisane w Prawie PANA, które nadał on Izraelowi;"
  tags: []
"1Krn16,41":
  text: "A z nimi pozostawił Hemana i Jedutuna oraz resztę wybranych, imiennie wyznaczonych, aby chwalili PANA, bo jego miłosierdzie trwa na wieki."
  tags: []
"1Krn16,42":
  text: "I u nich, u Hemana i Jedutuna, pozostawił trąby i cymbały dla grających na tych i na innych instrumentach muzycznych dla Boga. Synowie zaś Jedutuna byli odźwiernymi."
  tags: []
"1Krn16,43":
  text: "Potem cały lud się rozszedł, każdy do swego domu. Dawid też wrócił, aby błogosławić swojemu domowi."
  tags: []
