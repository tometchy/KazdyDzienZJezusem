"1Krn25,1": "Dawid wraz z dowódcami wojska przydzielił do służby synów Asafa, Hemana i Jedutuna, którzy mieli prorokować przy harfach, cytrach i cymbałach. A oto liczba pełniących tę służbę:"
"1Krn25,2": "Z synów Asafa – Zakkur, Józef, Netaniasz i Asarela. Synowie Asafa zależni od Asafa, który prorokował pod kierownictwem króla."
"1Krn25,3": "Z Jedutuna – synowie Jedutuna: Gedaliasz, Seri, Jeszajasz, Chaszabiasz, Mattitiasz i Szimei, sześciu, pod kierunkiem ich ojca Jedutuna, który prorokował przy harfie, dziękując PANU i wychwalając go."
"1Krn25,4": "Z Hemana – synowie Hemana: Bukkiasz, Mattaniasz, Uzziel, Szebuel, Jerimot, Chananiasz, Chanani, Eliata, Giddalti, Romamtiezer, Joszbekasza, Malloti, Hotir i Machaziot."
"1Krn25,5": "Ci wszyscy byli synami Hemana, widzącego królewskiego w słowach Bożych, dla podnoszenia rogu. I Bóg dał Hemanowi czternastu synów i trzy córki."
"1Krn25,6": "Ci wszyscy byli pod kierownictwem swego ojca, przeznaczeni do śpiewu w domu PANA przy cymbałach, cytrach i harfach, do służby w domu Bożym, tak jak król rozkazał Asafowi, Jedutunowi i Hemanowi."
"1Krn25,7": "A liczba ich wraz z ich braćmi wyćwiczonymi w pieśniach PANA, wszystkich uzdolnionych, wynosiła dwieście osiemdziesiąt osiem."
"1Krn25,8": "I rzucali losy co do swej służby, tak mały, jak i wielki, tak mistrz, jak i uczeń."
"1Krn25,9": "Pierwszy los padł na Asafa i na Józefa, drugi – na Gedaliasza wraz z jego braćmi i synami, razem było ich dwunastu."
"1Krn25,10": "Trzeci – na Zakkura, na jego synów i braci, razem dwunastu."
"1Krn25,11": "Czwarty – na Jisriego, na jego synów i braci, razem dwunastu."
"1Krn25,12": "Piąty – na Netaniasza, na jego synów i braci, razem dwunastu."
"1Krn25,13": "Szósty – na Bukkiasza, na jego synów i braci, razem dwunastu."
"1Krn25,14": "Siódmy – na Jesarela, na jego synów i braci, razem dwunastu."
"1Krn25,15": "Ósmy – na Jeszajasza, na jego synów i braci, razem dwunastu."
"1Krn25,16": "Dziewiąty – na Mattaniasza, na jego synów i braci, razem dwunastu."
"1Krn25,17": "Dziesiąty – na Szimejego, na jego synów i braci, razem dwunastu."
"1Krn25,18": "Jedenasty – na Azarela, na jego synów i braci, razem dwunastu."
"1Krn25,19": "Dwunasty – na Chaszabiasza, na jego synów i braci, razem dwunastu."
"1Krn25,20": "Trzynasty – na Szubaela, na jego synów i braci, razem dwunastu."
"1Krn25,21": "Czternasty – na Mattitiasza, na jego synów i braci, razem dwunastu."
"1Krn25,22": "Piętnasty – na Jeremota, na jego synów i braci, razem dwunastu."
"1Krn25,23": "Szesnasty – na Chananiasza, na jego synów i braci, razem dwunastu."
"1Krn25,24": "Siedemnasty – na Joszbekasza, na jego synów i braci, razem dwunastu."
"1Krn25,25": "Osiemnasty – na Chananiego, na jego synów i braci, razem dwunastu."
"1Krn25,26": "Dziewiętnasty – na Mallotiego, na jego synów i braci, razem dwunastu."
"1Krn25,27": "Dwudziesty – na Eliatę, na jego synów i braci, razem dwunastu."
"1Krn25,28": "Dwudziesty pierwszy – na Hotira, na jego synów i braci, razem dwunastu."
"1Krn25,29": "Dwudziesty drugi – na Giddaltiego, na jego synów i braci, razem dwunastu."
"1Krn25,30": "Dwudziesty trzeci – na Machaziota, na jego synów i braci, razem dwunastu."
"1Krn25,31": "Dwudziesty czwarty – na Romamtiezera, na jego synów i braci, razem dwunastu."
