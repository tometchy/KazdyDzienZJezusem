"1Krn25,1":
  text: "Dawid wraz z dowódcami wojska przydzielił do służby synów Asafa, Hemana i Jedutuna, którzy mieli prorokować przy harfach, cytrach i cymbałach. A oto liczba pełniących tę służbę:"
  tags: []
"1Krn25,2":
  text: "Z synów Asafa – Zakkur, Józef, Netaniasz i Asarela. Synowie Asafa zależni od Asafa, który prorokował pod kierownictwem króla."
  tags: []
"1Krn25,3":
  text: "Z Jedutuna – synowie Jedutuna: Gedaliasz, Seri, Jeszajasz, Chaszabiasz, Mattitiasz i Szimei, sześciu, pod kierunkiem ich ojca Jedutuna, który prorokował przy harfie, dziękując PANU i wychwalając go."
  tags: []
"1Krn25,4":
  text: "Z Hemana – synowie Hemana: Bukkiasz, Mattaniasz, Uzziel, Szebuel, Jerimot, Chananiasz, Chanani, Eliata, Giddalti, Romamtiezer, Joszbekasza, Malloti, Hotir i Machaziot."
  tags: []
"1Krn25,5":
  text: "Ci wszyscy byli synami Hemana, widzącego królewskiego w słowach Bożych, dla podnoszenia rogu. I Bóg dał Hemanowi czternastu synów i trzy córki."
  tags: []
"1Krn25,6":
  text: "Ci wszyscy byli pod kierownictwem swego ojca, przeznaczeni do śpiewu w domu PANA przy cymbałach, cytrach i harfach, do służby w domu Bożym, tak jak król rozkazał Asafowi, Jedutunowi i Hemanowi."
  tags: []
"1Krn25,7":
  text: "A liczba ich wraz z ich braćmi wyćwiczonymi w pieśniach PANA, wszystkich uzdolnionych, wynosiła dwieście osiemdziesiąt osiem."
  tags: []
"1Krn25,8":
  text: "I rzucali losy co do swej służby, tak mały, jak i wielki, tak mistrz, jak i uczeń."
  tags: []
"1Krn25,9":
  text: "Pierwszy los padł na Asafa i na Józefa, drugi – na Gedaliasza wraz z jego braćmi i synami, razem było ich dwunastu."
  tags: []
"1Krn25,10":
  text: "Trzeci – na Zakkura, na jego synów i braci, razem dwunastu."
  tags: []
"1Krn25,11":
  text: "Czwarty – na Jisriego, na jego synów i braci, razem dwunastu."
  tags: []
"1Krn25,12":
  text: "Piąty – na Netaniasza, na jego synów i braci, razem dwunastu."
  tags: []
"1Krn25,13":
  text: "Szósty – na Bukkiasza, na jego synów i braci, razem dwunastu."
  tags: []
"1Krn25,14":
  text: "Siódmy – na Jesarela, na jego synów i braci, razem dwunastu."
  tags: []
"1Krn25,15":
  text: "Ósmy – na Jeszajasza, na jego synów i braci, razem dwunastu."
  tags: []
"1Krn25,16":
  text: "Dziewiąty – na Mattaniasza, na jego synów i braci, razem dwunastu."
  tags: []
"1Krn25,17":
  text: "Dziesiąty – na Szimejego, na jego synów i braci, razem dwunastu."
  tags: []
"1Krn25,18":
  text: "Jedenasty – na Azarela, na jego synów i braci, razem dwunastu."
  tags: []
"1Krn25,19":
  text: "Dwunasty – na Chaszabiasza, na jego synów i braci, razem dwunastu."
  tags: []
"1Krn25,20":
  text: "Trzynasty – na Szubaela, na jego synów i braci, razem dwunastu."
  tags: []
"1Krn25,21":
  text: "Czternasty – na Mattitiasza, na jego synów i braci, razem dwunastu."
  tags: []
"1Krn25,22":
  text: "Piętnasty – na Jeremota, na jego synów i braci, razem dwunastu."
  tags: []
"1Krn25,23":
  text: "Szesnasty – na Chananiasza, na jego synów i braci, razem dwunastu."
  tags: []
"1Krn25,24":
  text: "Siedemnasty – na Joszbekasza, na jego synów i braci, razem dwunastu."
  tags: []
"1Krn25,25":
  text: "Osiemnasty – na Chananiego, na jego synów i braci, razem dwunastu."
  tags: []
"1Krn25,26":
  text: "Dziewiętnasty – na Mallotiego, na jego synów i braci, razem dwunastu."
  tags: []
"1Krn25,27":
  text: "Dwudziesty – na Eliatę, na jego synów i braci, razem dwunastu."
  tags: []
"1Krn25,28":
  text: "Dwudziesty pierwszy – na Hotira, na jego synów i braci, razem dwunastu."
  tags: []
"1Krn25,29":
  text: "Dwudziesty drugi – na Giddaltiego, na jego synów i braci, razem dwunastu."
  tags: []
"1Krn25,30":
  text: "Dwudziesty trzeci – na Machaziota, na jego synów i braci, razem dwunastu."
  tags: []
"1Krn25,31":
  text: "Dwudziesty czwarty – na Romamtiezera, na jego synów i braci, razem dwunastu."
  tags: []
