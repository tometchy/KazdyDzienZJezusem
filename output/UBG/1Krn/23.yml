"1Krn23,1": "Gdy więc Dawid był już stary i syty dni, ustanowił swego syna Salomona królem nad Izraelem."
"1Krn23,2": "I zgromadził wszystkich książąt Izraela oraz kapłanów i Lewitów."
"1Krn23,3": "Lewitów policzono od trzydziestu lat wzwyż, a ich liczba według głów wynosiła trzydzieści osiem tysięcy."
"1Krn23,4": "Spośród nich dwadzieścia cztery tysiące ustanowiono na służbę w domu PANA, a urzędników i sędziów było sześć tysięcy."
"1Krn23,5": "Ponadto – cztery tysiące odźwiernych i cztery tysiące chwalących PANA na instrumentach, które sporządziłem – powiedział Dawid – ku uwielbieniu Boga."
"1Krn23,6": "Dawid podzielił ich na zmiany według synów Lewiego: Gerszona, Kehata i Merariego."
"1Krn23,7": "Z Gerszona byli Ladan i Szimei."
"1Krn23,8": "Synowie Ladana: pierwszy Jechiel, potem Zetam i Joel – ci trzej."
"1Krn23,9": "Synowie Szimejego: Szelomit, Chaziel i Haran – ci trzej byli naczelnikami rodów Ladana."
"1Krn23,10": "A synowie Szimejego: Jachat, Zina, Jeusz i Beria. Ci czterej byli synami Szimejego."
"1Krn23,11": "Jachat był pierwszy, a Ziza drugi. Ale Jeusz i Beria nie mieli wielu synów i dlatego zostali policzeni jako jeden ród."
"1Krn23,12": "Synowie Kehata: Amram, Ishar, Chebron i Uzziel – czterej."
"1Krn23,13": "Synowie Amrama: Aaron i Mojżesz. Lecz Aaron został odłączony, aby poświęcić najświętsze rzeczy, on i jego synowie, aż na wieki – by spalać kadzidło przed PANEM, służyć mu i błogosławić w jego imieniu na wieki."
"1Krn23,14": "Ale synowie Mojżesza, męża Bożego, zostali zaliczeni do pokolenia Lewiego."
"1Krn23,15": "Synowie Mojżesza: Gerszon i Eliezer."
"1Krn23,16": "Synowie Gerszona: pierwszy Szebuel."
"1Krn23,17": "Synowie Eliezera: pierwszy Rechabiasz. Eliezer nie miał innych synów, ale synowie Rechabiasza bardzo się rozmnożyli."
"1Krn23,18": "Synowie Ishara: pierwszy Szelomit."
"1Krn23,19": "Synowie Chebrona: pierwszy Jeriasz, drugi Amariasz, trzeci Jachaziel, a czwarty Jekameam."
"1Krn23,20": "Synowie Uzziela: pierwszy Mika i drugi Jeszijasz."
"1Krn23,21": "Synowie Merariego: Machli i Muszi. Synowie Machliego: Eleazar i Kisz."
"1Krn23,22": "I Eleazar umarł, nie mając synów, tylko córki. Pojęli je za żony synowie Kisza, ich bracia."
"1Krn23,23": "Synowie Musziego: Machli, Eder i Jeremot – trzej."
"1Krn23,24": "To są synowie Lewiego według swych rodów, głów rodzin, policzeni według liczby imion, głowa po głowie, którzy pełnili służbę w domu PANA od lat dwudziestu wzwyż."
"1Krn23,25": "Dawid bowiem powiedział: PAN, Bóg Izraela, dał odpoczynek swemu ludowi i będzie mieszkał w Jerozolimie na wieki."
"1Krn23,26": "A Lewici już nie będą nosić przybytku ani wszelkich jego naczyń do jego obsługi."
"1Krn23,27": "Według ostatnich postanowień Dawida Lewici zostali policzeni od lat dwudziestu wzwyż;"
"1Krn23,28": "Ich stanowisko bowiem polegało na posługiwaniu synom Aarona w służbie domu PANA: na dziedzińcach, w komnatach, przy oczyszczaniu wszelkich rzeczy poświęconych i przy pracy wokół służby domu Bożego;"
"1Krn23,29": "I przy chlebie pokładnym, przy mące na ofiarę z pokarmów, przy plackach niekwaszonych, przy tym, co pieczone, i tym, co smażone, i przy wszystkim, co ważone i mierzone."
"1Krn23,30": "Mieli stawać każdego poranka, by dziękować PANU i wychwalać go, i tak samo wieczorem;"
"1Krn23,31": "Ponadto, mieli składać PANU wszelkie całopalenia w każdy szabat, w czasie nowiu księżyca i w uroczyste święta, według liczby wynikającej z ustalonego porządku – ustawicznie przed PANEM."
"1Krn23,32": "I mieli pełnić straż przy Namiocie Zgromadzenia, straż przy świątyni i straż przy synach Aarona, swych braciach, w służbie domu PANA."
