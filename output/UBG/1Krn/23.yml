"1Krn23,1":
  text: "Gdy więc Dawid był już stary i syty dni, ustanowił swego syna Salomona królem nad Izraelem."
  tags: []
"1Krn23,2":
  text: "I zgromadził wszystkich książąt Izraela oraz kapłanów i Lewitów."
  tags: []
"1Krn23,3":
  text: "Lewitów policzono od trzydziestu lat wzwyż, a ich liczba według głów wynosiła trzydzieści osiem tysięcy."
  tags: []
"1Krn23,4":
  text: "Spośród nich dwadzieścia cztery tysiące ustanowiono na służbę w domu PANA, a urzędników i sędziów było sześć tysięcy."
  tags: []
"1Krn23,5":
  text: "Ponadto – cztery tysiące odźwiernych i cztery tysiące chwalących PANA na instrumentach, które sporządziłem – powiedział Dawid – ku uwielbieniu Boga."
  tags: []
"1Krn23,6":
  text: "Dawid podzielił ich na zmiany według synów Lewiego: Gerszona, Kehata i Merariego."
  tags: []
"1Krn23,7":
  text: "Z Gerszona byli Ladan i Szimei."
  tags: []
"1Krn23,8":
  text: "Synowie Ladana: pierwszy Jechiel, potem Zetam i Joel – ci trzej."
  tags: []
"1Krn23,9":
  text: "Synowie Szimejego: Szelomit, Chaziel i Haran – ci trzej byli naczelnikami rodów Ladana."
  tags: []
"1Krn23,10":
  text: "A synowie Szimejego: Jachat, Zina, Jeusz i Beria. Ci czterej byli synami Szimejego."
  tags: []
"1Krn23,11":
  text: "Jachat był pierwszy, a Ziza drugi. Ale Jeusz i Beria nie mieli wielu synów i dlatego zostali policzeni jako jeden ród."
  tags: []
"1Krn23,12":
  text: "Synowie Kehata: Amram, Ishar, Chebron i Uzziel – czterej."
  tags: []
"1Krn23,13":
  text: "Synowie Amrama: Aaron i Mojżesz. Lecz Aaron został odłączony, aby poświęcić najświętsze rzeczy, on i jego synowie, aż na wieki – by spalać kadzidło przed PANEM, służyć mu i błogosławić w jego imieniu na wieki."
  tags: []
"1Krn23,14":
  text: "Ale synowie Mojżesza, męża Bożego, zostali zaliczeni do pokolenia Lewiego."
  tags: []
"1Krn23,15":
  text: "Synowie Mojżesza: Gerszon i Eliezer."
  tags: []
"1Krn23,16":
  text: "Synowie Gerszona: pierwszy Szebuel."
  tags: []
"1Krn23,17":
  text: "Synowie Eliezera: pierwszy Rechabiasz. Eliezer nie miał innych synów, ale synowie Rechabiasza bardzo się rozmnożyli."
  tags: []
"1Krn23,18":
  text: "Synowie Ishara: pierwszy Szelomit."
  tags: []
"1Krn23,19":
  text: "Synowie Chebrona: pierwszy Jeriasz, drugi Amariasz, trzeci Jachaziel, a czwarty Jekameam."
  tags: []
"1Krn23,20":
  text: "Synowie Uzziela: pierwszy Mika i drugi Jeszijasz."
  tags: []
"1Krn23,21":
  text: "Synowie Merariego: Machli i Muszi. Synowie Machliego: Eleazar i Kisz."
  tags: []
"1Krn23,22":
  text: "I Eleazar umarł, nie mając synów, tylko córki. Pojęli je za żony synowie Kisza, ich bracia."
  tags: []
"1Krn23,23":
  text: "Synowie Musziego: Machli, Eder i Jeremot – trzej."
  tags: []
"1Krn23,24":
  text: "To są synowie Lewiego według swych rodów, głów rodzin, policzeni według liczby imion, głowa po głowie, którzy pełnili służbę w domu PANA od lat dwudziestu wzwyż."
  tags: []
"1Krn23,25":
  text: "Dawid bowiem powiedział: PAN, Bóg Izraela, dał odpoczynek swemu ludowi i będzie mieszkał w Jerozolimie na wieki."
  tags: []
"1Krn23,26":
  text: "A Lewici już nie będą nosić przybytku ani wszelkich jego naczyń do jego obsługi."
  tags: []
"1Krn23,27":
  text: "Według ostatnich postanowień Dawida Lewici zostali policzeni od lat dwudziestu wzwyż;"
  tags: []
"1Krn23,28":
  text: "Ich stanowisko bowiem polegało na posługiwaniu synom Aarona w służbie domu PANA: na dziedzińcach, w komnatach, przy oczyszczaniu wszelkich rzeczy poświęconych i przy pracy wokół służby domu Bożego;"
  tags: []
"1Krn23,29":
  text: "I przy chlebie pokładnym, przy mące na ofiarę z pokarmów, przy plackach niekwaszonych, przy tym, co pieczone, i tym, co smażone, i przy wszystkim, co ważone i mierzone."
  tags: []
"1Krn23,30":
  text: "Mieli stawać każdego poranka, by dziękować PANU i wychwalać go, i tak samo wieczorem;"
  tags: []
"1Krn23,31":
  text: "Ponadto, mieli składać PANU wszelkie całopalenia w każdy szabat, w czasie nowiu księżyca i w uroczyste święta, według liczby wynikającej z ustalonego porządku – ustawicznie przed PANEM."
  tags: []
"1Krn23,32":
  text: "I mieli pełnić straż przy Namiocie Zgromadzenia, straż przy świątyni i straż przy synach Aarona, swych braciach, w służbie domu PANA."
  tags: []
