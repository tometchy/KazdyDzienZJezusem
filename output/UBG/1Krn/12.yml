"1Krn12,1": "Oto ci, którzy przyszli do Dawida w Siklag, gdy ukrywał się przed Saulem, synem Kisza. Należeli oni do dzielnych wojowników, którzy wspierali go w walce."
"1Krn12,2": "Byli uzbrojeni w łuki i potrafili prawą i lewą ręką miotać kamieniami i strzelać z łuku, a wywodzili się z braci Saula, z Beniamina."
"1Krn12,3": "Naczelnikiem był Achiezer, potem Joasz, synowie Szemajasza Gibeatczyka, Jezjel i Pelet, synowie Azmaweta, Beraka i Jehu Anatotczyk;"
"1Krn12,4": "I Jiszmaja Gibeonita, dzielny wojownik spośród trzydziestu i dowodzący trzydziestoma, Jeremiasz, Jachaziel, Jochanan i Jozabad Gederatyta;"
"1Krn12,5": "Eluzaj, Jerimot, Bealiasz, Szemariasz i Szefatiasz Charufita;"
"1Krn12,6": "Elkana, Jiszijasz, Azareel, Joezer i Jaszobam – Korachici;"
"1Krn12,7": "Joela i Zebadiasz, synowie Jerochama z Gedoru."
"1Krn12,8": "Z pokolenia Gada w warowni na pustyni do Dawida przyłączyli się dzielni wojownicy, żołnierze sprawni w boju, noszący tarczę i dzidę, ich twarze były jak twarze lwów, a byli zwinni jak sarny w górach;"
"1Krn12,9": "Ezer pierwszy, Obadiasz drugi, Eliab trzeci;"
"1Krn12,10": "Miszmanna czwarty, Jeremiasz piąty;"
"1Krn12,11": "Attaj szósty, Eliel siódmy;"
"1Krn12,12": "Jochanan ósmy, Elzabad dziewiąty;"
"1Krn12,13": "Jeremiasz dziesiąty, Makbanaj jedenasty."
"1Krn12,14": "Wywodzili się oni z synów Gada, dowódcy wojska: najmniejszy był nad stu, a największy – nad tysiącem."
"1Krn12,15": "To są ci, którzy przeszli przez Jordan w pierwszym miesiącu, kiedy wylał na wszystkie brzegi, i zmusili do ucieczki wszystkich mieszkańców dolin na wschód i na zachód."
"1Krn12,16": "Do warowni do Dawida przyszli także niektórzy z synów Beniamina i Judy."
"1Krn12,17": "I Dawid wyszedł naprzeciw nich, i odpowiedział: Jeśli przyszliście do mnie w pokoju, aby mi pomóc, moje serce połączy się z wami. Lecz jeśli przyszliście, aby mnie wydać moim wrogom, choć moje ręce są wolne od nieprawości, niech wejrzy w to Bóg naszych ojców i niech osądzi."
"1Krn12,18": "Wtedy Duch ogarnął Amasaja, naczelnika dowódców, i powiedział: Jesteśmy twoi, Dawidzie, i jesteśmy z tobą, synu Jessego. Pokój, pokój tobie i pokój twoim pomocnikom! Gdyż tobie pomaga twój Bóg. Dawid więc przyjął ich i ustanowił dowódcami oddziałów."
"1Krn12,19": "Z pokolenia Manassesa niektórzy przyłączyli się do Dawida, gdy wyruszył z Filistynami na wojnę przeciwko Saulowi. Lecz nie pomogli im, gdyż książęta Filistynów po naradzie odesłali go, mówiąc: Ten za cenę naszych głów wróci do swego pana Saula."
"1Krn12,20": "Gdy szedł do Siklag, przyłączyli się do niego z Manassesa: Adnach, Jozabad, Jediael, Mikael, Jozabad, Elihu i Silletaj, dowódcy nad tysiącami w pokoleniu Manassesa."
"1Krn12,21": "Oni to pomogli Dawidowi przeciw bandzie, bo byli wszyscy dzielnymi wojownikami i dowódcami wojska."
"1Krn12,22": "W tym czasie dzień za dniem ludzie przybywali do Dawida, aby mu pomagać, aż powstało wielkie wojsko jak wojsko Boże."
"1Krn12,23": "A oto liczba oddziałów gotowych do boju, które przyszły do Dawida w Hebronie, aby przenieść na niego królestwo Saula zgodnie ze słowem PANA."
"1Krn12,24": "Z synów Judy, noszących tarczę i włócznię, sześć tysięcy ośmiuset uzbrojonych do boju."
"1Krn12,25": "Z synów Symeona, dzielnych wojowników na wojnę, siedem tysięcy stu."
"1Krn12,26": "Z synów Lewiego cztery tysiące sześciuset."
"1Krn12,27": "Także Jehojada, przywódca synów Aarona, a z nim trzy tysiące siedmiuset."
"1Krn12,28": "I Sadok, młody, dzielny wojownik wraz z domem swego ojca – dwudziestu dwóch dowódców."
"1Krn12,29": "Z synów Beniamina, braci Saula, trzy tysiące. Dotąd bowiem większość z nich pozostawała w służbie domu Saula."
"1Krn12,30": "Z synów Efraima dwadzieścia tysięcy ośmiuset dzielnych wojowników, ludzi sławnych w domach swych ojców."
"1Krn12,31": "Z połowy pokolenia Manassesa osiemnaście tysięcy, którzy imiennie zostali wyznaczeni, aby przyjść i ustanowić Dawida królem."
"1Krn12,32": "Z synów Issachara, umiejących rozpoznać czasy, tak że wiedzieli, co Izrael ma czynić – dwustu naczelników, a wszyscy ich bracia stawali na ich rozkazy."
"1Krn12,33": "Z pokolenia Zebulona tych, którzy wychodzili na wojnę, wyćwiczonych w walce wszelką bronią wojenną – pięćdziesiąt tysięcy stających w szyku bojowym i niemających dwoistego serca."
"1Krn12,34": "Z pokolenia Neftalego – tysiąc dowódców, a z nimi trzydzieści siedem tysięcy uzbrojonych w tarcze i włócznie."
"1Krn12,35": "Z pokolenia Dana gotowych do boju było dwadzieścia osiem tysięcy sześciuset mężczyzn."
"1Krn12,36": "Z pokolenia Aszera tych, którzy wychodzili na wojnę, wyćwiczonych w walce – czterdzieści tysięcy."
"1Krn12,37": "Z drugiej strony Jordanu z pokolenia Rubena i Gada oraz z połowy pokolenia Manassesa w pełnym uzbrojeniu wojennym – sto dwadzieścia tysięcy mężczyzn."
"1Krn12,38": "Ci wszyscy wojownicy, którzy stawali w szyku bojowym, całym sercem przyszli do Hebronu, aby ustanowić Dawida królem nad całym Izraelem. Również i cała reszta Izraela była jednomyślna w tym, aby ustanowić Dawida królem."
"1Krn12,39": "I byli tam z Dawidem przez trzy dni, jedząc i pijąc, gdyż ich bracia przygotowali to dla nich."
"1Krn12,40": "Również ci, którzy byli w ich pobliżu, aż po Issachara i Zebulona, i Neftalego, przynosili żywność na osłach, na wielbłądach, na mułach i na wołach: potrawy, mąkę, figi, rodzynki, wino, oliwę oraz woły i owce w wielkiej ilości, bo zapanowała radość w Izraelu."
