"1Krn12,1":
  text: "Oto ci, którzy przyszli do Dawida w Siklag, gdy ukrywał się przed Saulem, synem Kisza. Należeli oni do dzielnych wojowników, którzy wspierali go w walce."
  tags: []
"1Krn12,2":
  text: "Byli uzbrojeni w łuki i potrafili prawą i lewą ręką miotać kamieniami i strzelać z łuku, a wywodzili się z braci Saula, z Beniamina."
  tags: []
"1Krn12,3":
  text: "Naczelnikiem był Achiezer, potem Joasz, synowie Szemajasza Gibeatczyka, Jezjel i Pelet, synowie Azmaweta, Beraka i Jehu Anatotczyk;"
  tags: []
"1Krn12,4":
  text: "I Jiszmaja Gibeonita, dzielny wojownik spośród trzydziestu i dowodzący trzydziestoma, Jeremiasz, Jachaziel, Jochanan i Jozabad Gederatyta;"
  tags: []
"1Krn12,5":
  text: "Eluzaj, Jerimot, Bealiasz, Szemariasz i Szefatiasz Charufita;"
  tags: []
"1Krn12,6":
  text: "Elkana, Jiszijasz, Azareel, Joezer i Jaszobam – Korachici;"
  tags: []
"1Krn12,7":
  text: "Joela i Zebadiasz, synowie Jerochama z Gedoru."
  tags: []
"1Krn12,8":
  text: "Z pokolenia Gada w warowni na pustyni do Dawida przyłączyli się dzielni wojownicy, żołnierze sprawni w boju, noszący tarczę i dzidę, ich twarze były jak twarze lwów, a byli zwinni jak sarny w górach;"
  tags: []
"1Krn12,9":
  text: "Ezer pierwszy, Obadiasz drugi, Eliab trzeci;"
  tags: []
"1Krn12,10":
  text: "Miszmanna czwarty, Jeremiasz piąty;"
  tags: []
"1Krn12,11":
  text: "Attaj szósty, Eliel siódmy;"
  tags: []
"1Krn12,12":
  text: "Jochanan ósmy, Elzabad dziewiąty;"
  tags: []
"1Krn12,13":
  text: "Jeremiasz dziesiąty, Makbanaj jedenasty."
  tags: []
"1Krn12,14":
  text: "Wywodzili się oni z synów Gada, dowódcy wojska: najmniejszy był nad stu, a największy – nad tysiącem."
  tags: []
"1Krn12,15":
  text: "To są ci, którzy przeszli przez Jordan w pierwszym miesiącu, kiedy wylał na wszystkie brzegi, i zmusili do ucieczki wszystkich mieszkańców dolin na wschód i na zachód."
  tags: []
"1Krn12,16":
  text: "Do warowni do Dawida przyszli także niektórzy z synów Beniamina i Judy."
  tags: []
"1Krn12,17":
  text: "I Dawid wyszedł naprzeciw nich, i odpowiedział: Jeśli przyszliście do mnie w pokoju, aby mi pomóc, moje serce połączy się z wami. Lecz jeśli przyszliście, aby mnie wydać moim wrogom, choć moje ręce są wolne od nieprawości, niech wejrzy w to Bóg naszych ojców i niech osądzi."
  tags: []
"1Krn12,18":
  text: "Wtedy Duch ogarnął Amasaja, naczelnika dowódców, i powiedział: Jesteśmy twoi, Dawidzie, i jesteśmy z tobą, synu Jessego. Pokój, pokój tobie i pokój twoim pomocnikom! Gdyż tobie pomaga twój Bóg. Dawid więc przyjął ich i ustanowił dowódcami oddziałów."
  tags: []
"1Krn12,19":
  text: "Z pokolenia Manassesa niektórzy przyłączyli się do Dawida, gdy wyruszył z Filistynami na wojnę przeciwko Saulowi. Lecz nie pomogli im, gdyż książęta Filistynów po naradzie odesłali go, mówiąc: Ten za cenę naszych głów wróci do swego pana Saula."
  tags: []
"1Krn12,20":
  text: "Gdy szedł do Siklag, przyłączyli się do niego z Manassesa: Adnach, Jozabad, Jediael, Mikael, Jozabad, Elihu i Silletaj, dowódcy nad tysiącami w pokoleniu Manassesa."
  tags: []
"1Krn12,21":
  text: "Oni to pomogli Dawidowi przeciw bandzie, bo byli wszyscy dzielnymi wojownikami i dowódcami wojska."
  tags: []
"1Krn12,22":
  text: "W tym czasie dzień za dniem ludzie przybywali do Dawida, aby mu pomagać, aż powstało wielkie wojsko jak wojsko Boże."
  tags: []
"1Krn12,23":
  text: "A oto liczba oddziałów gotowych do boju, które przyszły do Dawida w Hebronie, aby przenieść na niego królestwo Saula zgodnie ze słowem PANA."
  tags: []
"1Krn12,24":
  text: "Z synów Judy, noszących tarczę i włócznię, sześć tysięcy ośmiuset uzbrojonych do boju."
  tags: []
"1Krn12,25":
  text: "Z synów Symeona, dzielnych wojowników na wojnę, siedem tysięcy stu."
  tags: []
"1Krn12,26":
  text: "Z synów Lewiego cztery tysiące sześciuset."
  tags: []
"1Krn12,27":
  text: "Także Jehojada, przywódca synów Aarona, a z nim trzy tysiące siedmiuset."
  tags: []
"1Krn12,28":
  text: "I Sadok, młody, dzielny wojownik wraz z domem swego ojca – dwudziestu dwóch dowódców."
  tags: []
"1Krn12,29":
  text: "Z synów Beniamina, braci Saula, trzy tysiące. Dotąd bowiem większość z nich pozostawała w służbie domu Saula."
  tags: []
"1Krn12,30":
  text: "Z synów Efraima dwadzieścia tysięcy ośmiuset dzielnych wojowników, ludzi sławnych w domach swych ojców."
  tags: []
"1Krn12,31":
  text: "Z połowy pokolenia Manassesa osiemnaście tysięcy, którzy imiennie zostali wyznaczeni, aby przyjść i ustanowić Dawida królem."
  tags: []
"1Krn12,32":
  text: "Z synów Issachara, umiejących rozpoznać czasy, tak że wiedzieli, co Izrael ma czynić – dwustu naczelników, a wszyscy ich bracia stawali na ich rozkazy."
  tags: []
"1Krn12,33":
  text: "Z pokolenia Zebulona tych, którzy wychodzili na wojnę, wyćwiczonych w walce wszelką bronią wojenną – pięćdziesiąt tysięcy stających w szyku bojowym i niemających dwoistego serca."
  tags: []
"1Krn12,34":
  text: "Z pokolenia Neftalego – tysiąc dowódców, a z nimi trzydzieści siedem tysięcy uzbrojonych w tarcze i włócznie."
  tags: []
"1Krn12,35":
  text: "Z pokolenia Dana gotowych do boju było dwadzieścia osiem tysięcy sześciuset mężczyzn."
  tags: []
"1Krn12,36":
  text: "Z pokolenia Aszera tych, którzy wychodzili na wojnę, wyćwiczonych w walce – czterdzieści tysięcy."
  tags: []
"1Krn12,37":
  text: "Z drugiej strony Jordanu z pokolenia Rubena i Gada oraz z połowy pokolenia Manassesa w pełnym uzbrojeniu wojennym – sto dwadzieścia tysięcy mężczyzn."
  tags: []
"1Krn12,38":
  text: "Ci wszyscy wojownicy, którzy stawali w szyku bojowym, całym sercem przyszli do Hebronu, aby ustanowić Dawida królem nad całym Izraelem. Również i cała reszta Izraela była jednomyślna w tym, aby ustanowić Dawida królem."
  tags: []
"1Krn12,39":
  text: "I byli tam z Dawidem przez trzy dni, jedząc i pijąc, gdyż ich bracia przygotowali to dla nich."
  tags: []
"1Krn12,40":
  text: "Również ci, którzy byli w ich pobliżu, aż po Issachara i Zebulona, i Neftalego, przynosili żywność na osłach, na wielbłądach, na mułach i na wołach: potrawy, mąkę, figi, rodzynki, wino, oliwę oraz woły i owce w wielkiej ilości, bo zapanowała radość w Izraelu."
  tags: []
