"1Krn29,1":
  text: "Potem król Dawid przemówił do całego zgromadzenia: Mój syn Salomon, jedyny, którego Bóg wybrał, jest jeszcze młody i niedoświadczony, a dzieło jest wielkie. Ten pałac bowiem nie jest dla człowieka, ale dla PANA Boga."
  tags: []
"1Krn29,2":
  text: "Według wszystkich swoich sił przygotowałem na dom swojego Boga złoto na przedmioty złote, srebro – na srebrne, brąz – na brązowe, żelazo – na żelazne, drewno – na drewniane, kamienie onyksowe i do osadzania, kamienie błyszczące i różnokolorowe, wszelkiego rodzaju drogie kamienie i marmur w obfitości."
  tags: []
"1Krn29,3":
  text: "Ponadto z miłości do domu swego Boga oddaję ze swojego skarbca na dom mego Boga złota i srebra – poza tym wszystkim, co już przygotowałem na święty dom;"
  tags: []
"1Krn29,4":
  text: "Mianowicie trzy tysiące talentów złota, złota z Ofiru, i siedem tysięcy talentów najczystszego srebra na pokrycie ścian budynków;"
  tags: []
"1Krn29,5":
  text: "Złoto – na przedmioty złote, a srebro – na srebrne i na wszelkie ręczne prace rzemieślników. A kto jeszcze chciałby dziś dobrowolnie złożyć PANU dar?"
  tags: []
"1Krn29,6":
  text: "Wtedy dobrowolne dary złożyli naczelnicy rodów, książęta pokoleń Izraela, tysiącznicy, setnicy oraz przełożeni nad robotami króla."
  tags: []
"1Krn29,7":
  text: "I złożyli na służbę domu Bożego pięć tysięcy talentów złota, dziesięć tysięcy darejków, dziesięć tysięcy talentów srebra, osiemnaście tysięcy talentów brązu oraz sto tysięcy talentów żelaza."
  tags: []
"1Krn29,8":
  text: "Ci, którzy mieli drogie kamienie, oddali je do skarbca domu PANA na rękę Jechiela Gerszonity."
  tags: []
"1Krn29,9":
  text: "I radował się lud z tego, że tak dobrowolnie złożono dary, gdyż sercem doskonałym, chętnie ofiarowywano PANU. Także i król Dawid wielce się radował."
  tags: []
"1Krn29,10":
  text: "Dawid więc błogosławił PANU przed całym zgromadzeniem i powiedział: Błogosławiony jesteś, PANIE, Boże Izraela, naszego ojca, na wieki wieków."
  tags: []
"1Krn29,11":
  text: "Twoja, PANIE, jest wielkość, moc, chwała, zwycięstwo i majestat. Wszystko bowiem, co jest na niebie i na ziemi, jest twoje. Do ciebie należy królestwo, a ty jako głowa jesteś wyniesiony ponad wszystko."
  tags: []
"1Krn29,12":
  text: "I bogactwo, i sława pochodzą od ciebie i ty panujesz nad wszystkimi; w twoich rękach jest moc i siła i w twojej ręce jest to, aby wywyższyć i umocnić wszystko."
  tags: []
"1Krn29,13":
  text: "Teraz więc, Boże nasz, dziękujemy ci i wychwalamy chwalebne imię twoje."
  tags: []
"1Krn29,14":
  text: "Lecz kim ja jestem i czym jest mój lud, żebyśmy zdołali ofiarować dobrowolnie te rzeczy? Od ciebie bowiem pochodzi wszystko i daliśmy tobie to, co z twojej ręki otrzymaliśmy."
  tags: []
"1Krn29,15":
  text: "Jesteśmy bowiem pielgrzymami i przychodniami przed tobą, tak jak wszyscy nasi ojcowie. Nasze dni na ziemi są jak cień i nie ma czego oczekiwać."
  tags: []
"1Krn29,16":
  text: "O PANIE, Boże nasz, cały ten dostatek, który przygotowaliśmy dla ciebie na budowę domu dla twojego świętego imienia, pochodzi z twojej ręki i twoje jest to wszystko."
  tags: []
"1Krn29,17":
  text: "Wiem ja, mój Boże, że badasz serca i upodobałeś sobie prawość. Dlatego w prawości swego serca dobrowolnie złożyłem w ofierze to wszystko. Teraz z radością widzę, że również twój lud, który znajduje się tutaj, dobrowolnie składa ci ofiary."
  tags: []
"1Krn29,18":
  text: "PANIE, Boże Abrahama, Izaaka i Izraela, naszych ojców, zachowaj na wieki te zamiary i myśli serca swego ludu i skłoń jego serca ku sobie."
  tags: []
"1Krn29,19":
  text: "Salomonowi, mojemu synowi, daj serce doskonałe, aby strzegł twoich przykazań, świadectw i ustaw, aby wykonał to wszystko i aby zbudował dom, do którego poczyniłem przygotowania."
  tags: []
"1Krn29,20":
  text: "Potem Dawid przemówił do całego zgromadzenia: Błogosławcie teraz PANU, waszemu Bogu. I całe zgromadzenie błogosławiło PANU, Bogu swoich ojców – pochylili się i oddali pokłon PANU i królowi."
  tags: []
"1Krn29,21":
  text: "Następnie złożyli PANU ofiary. Nazajutrz złożyli PANU całopalenia: tysiąc wołów, tysiąc baranów, tysiąc jagniąt wraz z ofiarami z płynów i mnóstwem innych ofiar, za całego Izraela."
  tags: []
"1Krn29,22":
  text: "Jedli i pili przed PANEM tego dnia z wielką radością. I po raz drugi ustanowili królem Salomona, syna Dawida, i namaścili go dla PANA na władcę, a Sadoka na kapłana."
  tags: []
"1Krn29,23":
  text: "Tak więc zasiadł Salomon na tronie PANA jako król po swoim ojcu Dawidzie i powodziło mu się, a cały Izrael był mu posłuszny."
  tags: []
"1Krn29,24":
  text: "Również wszyscy książęta i dzielni ludzie, a także wszyscy synowie króla Dawida poddali się królowi Salomonowi."
  tags: []
"1Krn29,25":
  text: "I PAN wielce wywyższył Salomona przed całym Izraelem i dał mu chwałę królewską, jakiej żaden król przed nim nie miał w Izraelu."
  tags: []
"1Krn29,26":
  text: "Tak to Dawid, syn Jessego, królował nad całym Izraelem."
  tags: []
"1Krn29,27":
  text: "A czas jego panowania nad Izraelem wynosił czterdzieści lat: w Hebronie królował siedem lat, a w Jerozolimie królował trzydzieści trzy lata."
  tags: []
"1Krn29,28":
  text: "I umarł w późnej starości, syty dni, bogactw i sławy. A w jego miejsce królował Salomon, jego syn."
  tags: []
"1Krn29,29":
  text: "A dzieje króla Dawida, pierwsze i ostatnie, oto zapisane są w księdze Samuela widzącego, w księdze proroka Natana i w księdze Gada widzącego;"
  tags: []
"1Krn29,30":
  text: "Wraz z całym jego panowaniem, jego potęgą i wydarzeniami, które dotyczyły jego, Izraela i wszystkich królestw tej ziemi."
  tags: []
