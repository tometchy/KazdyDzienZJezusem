"1Krn28,1":
  text: "Potem Dawid zgromadził w Jerozolimie wszystkich książąt Izraela, książąt pokoleń i dowódców oddziałów, którzy służyli królowi, tysiączników, setników i zarządców całego dobytku i posiadłości króla i jego synów, a także urzędników, walecznych i wszystkich dzielnych wojowników."
  tags: []
"1Krn28,2":
  text: "Wtedy król Dawid powstał i przemówił: Słuchajcie mnie, moi bracia i ludu mój! Moim pragnieniem było zbudować dom odpoczynku dla arki przymierza PANA i jako podnóżek naszego Boga i poczyniłem przygotowania do budowy."
  tags: []
"1Krn28,3":
  text: "Lecz Bóg powiedział do mnie: Nie zbudujesz domu dla mego imienia, ponieważ jesteś wojownikiem i rozlewałeś krew."
  tags: []
"1Krn28,4":
  text: "Wybrał mnie jednak PAN, Bóg Izraela, spośród całego domu mego ojca, abym był królem nad Izraelem na wieki. Judę bowiem wybrał na władcę, spośród rodu Judy – dom mego ojca, a spośród synów mego ojca, mnie sobie upodobał ustanowić królem nad całym Izraelem."
  tags: []
"1Krn28,5":
  text: "Spośród zaś wszystkich moich synów – wielu bowiem synów dał mi PAN – wybrał mego syna Salomona, aby zasiadł na tronie królestwa PANA nad Izraelem."
  tags: []
"1Krn28,6":
  text: "I powiedział do mnie: Salomon, twój syn – to on zbuduje mój dom i moje dziedzińce. Jego bowiem wybrałem sobie za syna, a ja mu będę ojcem."
  tags: []
"1Krn28,7":
  text: "I utwierdzę jego królestwo na wieki, jeśli podobnie jak dzisiaj będzie trwał w wypełnianiu moich przykazań i praw."
  tags: []
"1Krn28,8":
  text: "Teraz więc na oczach całego Izraela, zgromadzenia PANA, i wobec naszego Boga nakazuję wam: Przestrzegajcie i szukajcie wszystkich przykazań PANA, waszego Boga, abyście mogli posiadać tę dobrą ziemię i zostawić ją jako dziedzictwo swoim dzieciom po was – na wieki."
  tags: []
"1Krn28,9":
  text: "A ty, Salomonie, mój synu, poznawaj Boga swego ojca i służ mu sercem doskonałym i dobrowolnym umysłem. PAN bowiem przenika wszystkie serca i zna wszystkie zamysły i myśli. Jeśli będziesz go szukać, znajdziesz go, a jeśli go opuścisz, on odrzuci cię na wieki."
  tags: []
"1Krn28,10":
  text: "Miej się teraz na baczności, gdyż PAN cię wybrał, abyś zbudował dom na świątynię; bądź mocny i wykonaj to."
  tags: []
"1Krn28,11":
  text: "Wtedy Dawid przekazał swojemu synowi Salomonowi wzór przedsionka świątyni, jej domów, jej skarbców, jej komnat górnych, jej pomieszczeń wewnętrznych oraz domu dla przebłagalni."
  tags: []
"1Krn28,12":
  text: "Do tego wzór wszystkiego, co zaplanował: dziedzińców domu PANA, wszystkich komnat dokoła oraz wszystkich skarbców domu Bożego i skarbców rzeczy poświęconych."
  tags: []
"1Krn28,13":
  text: "Także wskazówki co do zmian kapłańskich i lewickich, wszelkiej pracy w służbie domu PANA i co do wszelkich naczyń służby w domu PANA."
  tags: []
"1Krn28,14":
  text: "Dał także odpowiednią wagę złota na wszystkie naczynia złote do każdej posługi; również odpowiednią wagę srebra na wszystkie naczynia srebrne, na wszystkie naczynia do wszelkich posług;"
  tags: []
"1Krn28,15":
  text: "Mianowicie odpowiednią wagę na świeczniki złote i ich lampy złote według wagi każdego świecznika i jego lamp, i na świeczniki srebrne według wagi każdego świecznika i jego lamp, stosownie do użycia każdego świecznika."
  tags: []
"1Krn28,16":
  text: "Również dał odpowiednią wagę złota na stoły chlebów pokładnych, na każdy stół, oraz srebra – na stoły srebrne;"
  tags: []
"1Krn28,17":
  text: "I szczere złoto na widełki, miednice i kubki, na czasze złote, określoną wagę na każdy z tych przedmiotów i na czasze srebrne – określoną wagę na każdą z nich;"
  tags: []
"1Krn28,18":
  text: "Także na ołtarz kadzenia dał określoną wagę szczerego złota oraz złoto na wzór wozu cherubinów, którzy swoimi rozpostartymi skrzydłami okrywali arkę przymierza PANA."
  tags: []
"1Krn28,19":
  text: "To wszystko – powiedział Dawid – przyszło do mnie na piśmie z ręki PANA, abym mógł zrozumieć, jak wykonać ten plan."
  tags: []
"1Krn28,20":
  text: "Dawid powiedział do swego syna Salomona: Bądź mocny i dzielny i wykonaj to. Nie bój się ani się nie lękaj, bo PAN Bóg, mój Bóg, będzie z tobą, nie porzuci cię ani nie opuści, dopóki nie dokończysz wszelkiej pracy wokół służby domu PANA."
  tags: []
"1Krn28,21":
  text: "A oto zmiany kapłanów i Lewitów do każdej posługi w domu Bożym będą z tobą w każdej pracy; każdy ochotny i zdolny do wszelkiej posługi. Także książęta i cały lud stawią się na każdy twój rozkaz."
  tags: []
