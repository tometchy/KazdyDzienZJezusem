"1Krn2,1": "Oto są synowie Izraela: Ruben, Symeon, Lewi i Juda, Issachar i Zebulon;"
"1Krn2,2": "Dan, Józef, Beniamin, Neftali, Gad i Aszer."
"1Krn2,3": "Synowie Judy: Er, Onan i Szela. Ci trzej urodzili mu się z córki Szui, Kananejki. Ale Er, pierworodny Judy, był zły w oczach PANA, dlatego go zabił."
"1Krn2,4": "Tamar zaś, jego synowa, urodziła mu Peresa i Zeracha. Wszystkich synów Judy było pięciu."
"1Krn2,5": "Synowie Peresa: Chesron i Chamul."
"1Krn2,6": "Synowie Zeracha: Zimri, Etan, Heman, Kalkol i Dara, wszystkich ich było pięciu."
"1Krn2,7": "Synowie Karmiego: Achar, który sprowadził nieszczęście na Izraela, gdy zgrzeszył przy rzeczach przeklętych."
"1Krn2,8": "Synowie Etana: Azariasz."
"1Krn2,9": "Synowie Chesrona, którzy mu się urodzili: Jerachmeel, Ram i Kelubaj."
"1Krn2,10": "Ram zaś spłodził Amminadaba, a Amminadab spłodził Nachszona, księcia synów Judy."
"1Krn2,11": "A Nachszon spłodził Salmę, a Salma spłodził Boaza."
"1Krn2,12": "A Boaz spłodził Obeda, a Obed spłodził Jessego."
"1Krn2,13": "A Jesse spłodził swego pierworodnego Eliaba, jako drugiego – Abinadaba, trzeciego – Szimeę;"
"1Krn2,14": "Czwartego – Netaneela, piątego – Raddaja;"
"1Krn2,15": "Szóstego – Osema, siódmego – Dawida."
"1Krn2,16": "A ich siostry to Seruja i Abigail. Synowie Serui: Abiszaj, Joab i Asahel – ci trzej."
"1Krn2,17": "Abigail zaś urodziła Amasę, ojcem Amasy był Jeter, Izmaelita."
"1Krn2,18": "Kaleb, syn Chesrona, spłodził dzieci z Azubą, swoją żoną, i z Jeriotą. A jej synami byli: Jeszer, Szobab i Ardon."
"1Krn2,19": "A gdy Azuba umarła, Kaleb pojął sobie za żonę Efratę, która urodziła mu Chura."
"1Krn2,20": "A Chur spłodził Uriego, a Uri spłodził Besaleela."
"1Krn2,21": "Potem Chesron obcował z córką Makira, ojca Gileada, i wziął ją za żonę, mając sześćdziesiąt lat, a ta urodziła mu Seguba."
"1Krn2,22": "A Segub spłodził Jaira, który miał dwadzieścia trzy miasta w ziemi Gilead."
"1Krn2,23": "Zabrał bowiem Geszurze i Aramowi wsie Jaira oraz Kenat i przyległe do niego miasteczka: razem sześćdziesiąt miast. Wszystkie one należały do synów Makira, ojca Gileada."
"1Krn2,24": "Po śmierci Chesrona w Kaleb-Efrata, żona Chesrona, Abija, urodziła mu Aszura, ojca Tekoa."
"1Krn2,25": "Synami Jerachmeela, pierworodnego Chesrona, byli: pierworodny Ram, następnie Buna, Oren, Ozem i Achiasz."
"1Krn2,26": "Jerachmeel miał także drugą żonę imieniem Atara. Była ona matką Onama."
"1Krn2,27": "Synami Rama, pierworodnego Jerachmeela, byli: Maas, Jamin i Eker."
"1Krn2,28": "Synami Onama byli Szammaj i Jada. Synami Szammaja: Nadab i Abiszur."
"1Krn2,29": "Żona Abiszura miała na imię Abihail i urodziła mu Achbana i Molida."
"1Krn2,30": "Synowie Nadaba: Seled i Appaim. Lecz Seled umarł bez potomstwa."
"1Krn2,31": "Synowie Appaima: Jiszi. Synowie Jisziego: Szeszan, a córka Szeszana: Achlaj."
"1Krn2,32": "Synowie Jady, brata Szammaja: Jeter i Jonatan. A Jeter umarł bez potomstwa."
"1Krn2,33": "Synowie Jonatana: Pelet i Zaza. Byli oni synami Jerachmeela."
"1Krn2,34": "Lecz Szeszan nie miał synów, tylko córki. Miał też Szeszan sługę Egipcjanina imieniem Jarcha."
"1Krn2,35": "Dał więc Szeszan swemu słudze Jarsze swoją córkę za żonę, a ona urodziła mu Attaja."
"1Krn2,36": "Attaj spłodził Natana, a Natan spłodził Zabada."
"1Krn2,37": "Zabad spłodził Eflala, a Eflal spłodził Obeda."
"1Krn2,38": "Obed spłodził Jehu, a Jehu spłodził Azariasza."
"1Krn2,39": "Azariasz spłodził Chelesa, a Cheles spłodził Eleasę."
"1Krn2,40": "Eleasa spłodził Sismaja, a Sismaj spłodził Szalluma."
"1Krn2,41": "A Szallum spłodził Jekamiasza, a Jekamiasz spłodził Eliszamę."
"1Krn2,42": "Synami Kaleba, brata Jerachmeela, byli: jego pierworodny Mesza, który był ojcem Zifa, i synowie Mareszy – ojcem Chebrona."
"1Krn2,43": "Synowie Chebrona: Korach, Tappuach, Rekem i Szema."
"1Krn2,44": "Szema spłodził Rachama, syna Jorkoama, a Rekem spłodził Szammaja."
"1Krn2,45": "Synem Szammaja był Maon, a Maon był ojcem Bet-Sura."
"1Krn2,46": "Efa, nałożnica Kaleba, urodziła Charana, Mosę i Gazeza, a Charan spłodził Gazeza."
"1Krn2,47": "Synowie Jahdaja: Regem, Jotam, Geszan, Pelet, Efa i Szaaf."
"1Krn2,48": "Maaka, druga nałożnica Kaleba, urodziła Szebera i Tyrchanę."
"1Krn2,49": "Urodziła również Szaafa, ojca Madmanny, i Szewę, ojca Makbeny i Gibea. A córką Kaleba była Aksa."
"1Krn2,50": "Ci byli synami Kaleba, syna Chura, pierworodnego Efraty: Szobal, ojciec Kiriat-Jearima;"
"1Krn2,51": "Salma, ojciec Betlejema, i Charef, ojciec Bet-Gadera."
"1Krn2,52": "Szobal, ojciec Kiriat-Jearima, miał synów: Haroego i połowę Manachytów."
"1Krn2,53": "A rodziny Kiriat-Jearima to: Jitryci, Putyci, Szumatyci i Mirzaici, od których wywodzą się Soreatyci i Esztaolici."
"1Krn2,54": "Synowie Salmy: Betlejem, Netofatyci, Atrot, rodzina Joaba i połowa Manachytów, Soreici;"
"1Krn2,55": "Rodziny pisarzy mieszkających w Jabes: Tyratyci, Szimeatyci i Sukatyci. Ci są Kenitami, którzy wywodzili się od Chamata, ojca domu Rechaba."
