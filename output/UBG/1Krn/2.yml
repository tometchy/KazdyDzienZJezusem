"1Krn2,1":
  text: "Oto są synowie Izraela: Ruben, Symeon, Lewi i Juda, Issachar i Zebulon;"
  tags: []
"1Krn2,2":
  text: "Dan, Józef, Beniamin, Neftali, Gad i Aszer."
  tags: []
"1Krn2,3":
  text: "Synowie Judy: Er, Onan i Szela. Ci trzej urodzili mu się z córki Szui, Kananejki. Ale Er, pierworodny Judy, był zły w oczach PANA, dlatego go zabił."
  tags: []
"1Krn2,4":
  text: "Tamar zaś, jego synowa, urodziła mu Peresa i Zeracha. Wszystkich synów Judy było pięciu."
  tags: []
"1Krn2,5":
  text: "Synowie Peresa: Chesron i Chamul."
  tags: []
"1Krn2,6":
  text: "Synowie Zeracha: Zimri, Etan, Heman, Kalkol i Dara, wszystkich ich było pięciu."
  tags: []
"1Krn2,7":
  text: "Synowie Karmiego: Achar, który sprowadził nieszczęście na Izraela, gdy zgrzeszył przy rzeczach przeklętych."
  tags: []
"1Krn2,8":
  text: "Synowie Etana: Azariasz."
  tags: []
"1Krn2,9":
  text: "Synowie Chesrona, którzy mu się urodzili: Jerachmeel, Ram i Kelubaj."
  tags: []
"1Krn2,10":
  text: "Ram zaś spłodził Amminadaba, a Amminadab spłodził Nachszona, księcia synów Judy."
  tags: []
"1Krn2,11":
  text: "A Nachszon spłodził Salmę, a Salma spłodził Boaza."
  tags: []
"1Krn2,12":
  text: "A Boaz spłodził Obeda, a Obed spłodził Jessego."
  tags: []
"1Krn2,13":
  text: "A Jesse spłodził swego pierworodnego Eliaba, jako drugiego – Abinadaba, trzeciego – Szimeę;"
  tags: []
"1Krn2,14":
  text: "Czwartego – Netaneela, piątego – Raddaja;"
  tags: []
"1Krn2,15":
  text: "Szóstego – Osema, siódmego – Dawida."
  tags: []
"1Krn2,16":
  text: "A ich siostry to Seruja i Abigail. Synowie Serui: Abiszaj, Joab i Asahel – ci trzej."
  tags: []
"1Krn2,17":
  text: "Abigail zaś urodziła Amasę, ojcem Amasy był Jeter, Izmaelita."
  tags: []
"1Krn2,18":
  text: "Kaleb, syn Chesrona, spłodził dzieci z Azubą, swoją żoną, i z Jeriotą. A jej synami byli: Jeszer, Szobab i Ardon."
  tags: []
"1Krn2,19":
  text: "A gdy Azuba umarła, Kaleb pojął sobie za żonę Efratę, która urodziła mu Chura."
  tags: []
"1Krn2,20":
  text: "A Chur spłodził Uriego, a Uri spłodził Besaleela."
  tags: []
"1Krn2,21":
  text: "Potem Chesron obcował z córką Makira, ojca Gileada, i wziął ją za żonę, mając sześćdziesiąt lat, a ta urodziła mu Seguba."
  tags: []
"1Krn2,22":
  text: "A Segub spłodził Jaira, który miał dwadzieścia trzy miasta w ziemi Gilead."
  tags: []
"1Krn2,23":
  text: "Zabrał bowiem Geszurze i Aramowi wsie Jaira oraz Kenat i przyległe do niego miasteczka: razem sześćdziesiąt miast. Wszystkie one należały do synów Makira, ojca Gileada."
  tags: []
"1Krn2,24":
  text: "Po śmierci Chesrona w Kaleb-Efrata, żona Chesrona, Abija, urodziła mu Aszura, ojca Tekoa."
  tags: []
"1Krn2,25":
  text: "Synami Jerachmeela, pierworodnego Chesrona, byli: pierworodny Ram, następnie Buna, Oren, Ozem i Achiasz."
  tags: []
"1Krn2,26":
  text: "Jerachmeel miał także drugą żonę imieniem Atara. Była ona matką Onama."
  tags: []
"1Krn2,27":
  text: "Synami Rama, pierworodnego Jerachmeela, byli: Maas, Jamin i Eker."
  tags: []
"1Krn2,28":
  text: "Synami Onama byli Szammaj i Jada. Synami Szammaja: Nadab i Abiszur."
  tags: []
"1Krn2,29":
  text: "Żona Abiszura miała na imię Abihail i urodziła mu Achbana i Molida."
  tags: []
"1Krn2,30":
  text: "Synowie Nadaba: Seled i Appaim. Lecz Seled umarł bez potomstwa."
  tags: []
"1Krn2,31":
  text: "Synowie Appaima: Jiszi. Synowie Jisziego: Szeszan, a córka Szeszana: Achlaj."
  tags: []
"1Krn2,32":
  text: "Synowie Jady, brata Szammaja: Jeter i Jonatan. A Jeter umarł bez potomstwa."
  tags: []
"1Krn2,33":
  text: "Synowie Jonatana: Pelet i Zaza. Byli oni synami Jerachmeela."
  tags: []
"1Krn2,34":
  text: "Lecz Szeszan nie miał synów, tylko córki. Miał też Szeszan sługę Egipcjanina imieniem Jarcha."
  tags: []
"1Krn2,35":
  text: "Dał więc Szeszan swemu słudze Jarsze swoją córkę za żonę, a ona urodziła mu Attaja."
  tags: []
"1Krn2,36":
  text: "Attaj spłodził Natana, a Natan spłodził Zabada."
  tags: []
"1Krn2,37":
  text: "Zabad spłodził Eflala, a Eflal spłodził Obeda."
  tags: []
"1Krn2,38":
  text: "Obed spłodził Jehu, a Jehu spłodził Azariasza."
  tags: []
"1Krn2,39":
  text: "Azariasz spłodził Chelesa, a Cheles spłodził Eleasę."
  tags: []
"1Krn2,40":
  text: "Eleasa spłodził Sismaja, a Sismaj spłodził Szalluma."
  tags: []
"1Krn2,41":
  text: "A Szallum spłodził Jekamiasza, a Jekamiasz spłodził Eliszamę."
  tags: []
"1Krn2,42":
  text: "Synami Kaleba, brata Jerachmeela, byli: jego pierworodny Mesza, który był ojcem Zifa, i synowie Mareszy – ojcem Chebrona."
  tags: []
"1Krn2,43":
  text: "Synowie Chebrona: Korach, Tappuach, Rekem i Szema."
  tags: []
"1Krn2,44":
  text: "Szema spłodził Rachama, syna Jorkoama, a Rekem spłodził Szammaja."
  tags: []
"1Krn2,45":
  text: "Synem Szammaja był Maon, a Maon był ojcem Bet-Sura."
  tags: []
"1Krn2,46":
  text: "Efa, nałożnica Kaleba, urodziła Charana, Mosę i Gazeza, a Charan spłodził Gazeza."
  tags: []
"1Krn2,47":
  text: "Synowie Jahdaja: Regem, Jotam, Geszan, Pelet, Efa i Szaaf."
  tags: []
"1Krn2,48":
  text: "Maaka, druga nałożnica Kaleba, urodziła Szebera i Tyrchanę."
  tags: []
"1Krn2,49":
  text: "Urodziła również Szaafa, ojca Madmanny, i Szewę, ojca Makbeny i Gibea. A córką Kaleba była Aksa."
  tags: []
"1Krn2,50":
  text: "Ci byli synami Kaleba, syna Chura, pierworodnego Efraty: Szobal, ojciec Kiriat-Jearima;"
  tags: []
"1Krn2,51":
  text: "Salma, ojciec Betlejema, i Charef, ojciec Bet-Gadera."
  tags: []
"1Krn2,52":
  text: "Szobal, ojciec Kiriat-Jearima, miał synów: Haroego i połowę Manachytów."
  tags: []
"1Krn2,53":
  text: "A rodziny Kiriat-Jearima to: Jitryci, Putyci, Szumatyci i Mirzaici, od których wywodzą się Soreatyci i Esztaolici."
  tags: []
"1Krn2,54":
  text: "Synowie Salmy: Betlejem, Netofatyci, Atrot, rodzina Joaba i połowa Manachytów, Soreici;"
  tags: []
"1Krn2,55":
  text: "Rodziny pisarzy mieszkających w Jabes: Tyratyci, Szimeatyci i Sukatyci. Ci są Kenitami, którzy wywodzili się od Chamata, ojca domu Rechaba."
  tags: []
