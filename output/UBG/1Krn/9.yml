"1Krn9,1":
  text: "Tak wszyscy Izraelici byli spisani w rodowodach, a oto zostały one zapisane w księdze królów Izraela i Judy, a ci zostali uprowadzeni do Babilonu z powodu swego przestępstwa."
  tags: []
"1Krn9,2":
  text: "Pierwszymi mieszkańcami, którzy weszli do swych posiadłości w swoich miastach, byli Izraelici, kapłani, Lewici i Netinici."
  tags: []
"1Krn9,3":
  text: "W Jerozolimie mieszkali spośród synów Judy, Beniamina, Efraima i Manassesa:"
  tags: []
"1Krn9,4":
  text: "Utaj, syn Ammihuda, syna Omriego, syna Imriego, syna Baniego, z synów Peresa, syna Judy."
  tags: []
"1Krn9,5":
  text: "Z Szilonitów: pierworodny Asajasz i jego synowie."
  tags: []
"1Krn9,6":
  text: "Z synów Zeracha: Jeuel i ich braci, sześciuset dziewięćdziesięciu."
  tags: []
"1Krn9,7":
  text: "Z synów Beniamina: Sallu, syn Meszullama, syna Hodawiasza, syna Hassenuy;"
  tags: []
"1Krn9,8":
  text: "I Jibnejasz, syn Jerochama, Ela, syn Uzziego, syna Mikriego, i Meszullam, syn Szefatiasza, syna Reuela, syna Jibniasza."
  tags: []
"1Krn9,9":
  text: "Ich braci według rodowodów było dziewięćset pięćdziesięciu sześciu. Ci wszyscy byli naczelnikami rodów według domów swoich ojców."
  tags: []
"1Krn9,10":
  text: "Z kapłanów: Jedajasz, Jehojarib, Jakin;"
  tags: []
"1Krn9,11":
  text: "I Azariasz, syn Chilkiasza, syna Meszullama, syna Sadoka, syna Merajota, syna Achituba, przełożonego domu Bożego;"
  tags: []
"1Krn9,12":
  text: "I Adajasz, syn Jerochama, syna Paszchura, syna Malkiasza, i Maasaj, syn Adiela, syna Jachzery, syna Meszullama, syna Meszillemita, syna Immera;"
  tags: []
"1Krn9,13":
  text: "Ich braci, naczelników swoich rodów, było tysiąc siedmiuset sześćdziesięciu, ludzi zdolnych do pełnienia służby w domu Bożym."
  tags: []
"1Krn9,14":
  text: "A z Lewitów: Szemejasz, syn Chaszuba, syna Azrikama, syna Chaszabiasza, z synów Merariego;"
  tags: []
"1Krn9,15":
  text: "I Bakbakar, Cheresz, Galal, Mattaniasz, syn Micheasza, syna Zikriego, syna Asafa;"
  tags: []
"1Krn9,16":
  text: "I Obadiasz, syn Szemajasza, syna Galala, syna Jedutuna, i Berechiasz, syn Asy, syna Elkany, który mieszkał we wsiach Netofatytów."
  tags: []
"1Krn9,17":
  text: "A odźwierni: Szallum, Akkub, Talmon, Achiman i ich bracia. Szallum był ich zwierzchnikiem;"
  tags: []
"1Krn9,18":
  text: "Który aż dotąd stawał przy bramie królewskiej od wschodu. Ci byli odźwiernymi w obozach synów Lewiego."
  tags: []
"1Krn9,19":
  text: "Szallum, syn Korego, syna Ebiazafa, syna Koracha, i jego bracia z domu jego ojca, Korachici, pełnili służbę, byli stróżami progów namiotu, a ich ojcowie byli stróżami wejścia do obozu PANA."
  tags: []
"1Krn9,20":
  text: "Pinchas, syn Eleazara, był niegdyś zwierzchnikiem nad nimi, a PAN był z nim."
  tags: []
"1Krn9,21":
  text: "Zachariasz, syn Meszelemiasza, był odźwiernym przy wejściu do Namiotu Zgromadzenia."
  tags: []
"1Krn9,22":
  text: "Wszystkich wybranych na odźwiernych przy bramach było dwustu dwunastu. Byli oni policzeni według ich rodowodu w swoich osiedlach, a ustanowił ich Dawid i Samuel, widzący."
  tags: []
"1Krn9,23":
  text: "Oni więc i ich synowie czuwali nad bramami domu PANA, w domu namiotu, jako stróże."
  tags: []
"1Krn9,24":
  text: "Odźwierni znajdowali się z czterech stron: od wschodu, od zachodu, od północy i od południa."
  tags: []
"1Krn9,25":
  text: "Ich bracia zaś, mieszkający w swoich osiedlach, przychodzili co siódmy dzień, w swoich porach, aby być z nimi."
  tags: []
"1Krn9,26":
  text: "Czterej bowiem naczelni odźwierni pełnili stałą służbę. Byli to Lewici odpowiedzialni za komnaty i skarbiec domu Bożego;"
  tags: []
"1Krn9,27":
  text: "I nocowali dokoła domu Bożego, gdyż do nich należała straż i obowiązek otwierania go każdego ranka."
  tags: []
"1Krn9,28":
  text: "Niektórzy z nich mieli pieczę nad naczyniami do służby, by je wnosić i wynosić w tej samej liczbie."
  tags: []
"1Krn9,29":
  text: "Inni spośród nich byli ustanowieni do opieki nad naczyniami i przyborami Miejsca Najświętszego – nad mąką pszenną, winem, oliwą, kadzidłem i wonnościami."
  tags: []
"1Krn9,30":
  text: "A niektórzy z synów kapłanów sporządzali olejki z wonności."
  tags: []
"1Krn9,31":
  text: "Mattitiasz, spośród Lewitów, pierworodny Szalluma Korachity, był przełożonym nad tym, co przygotowane w patelniach."
  tags: []
"1Krn9,32":
  text: "Niektórzy ich bracia spośród synów Kehata byli ustanowieni do opieki nad chlebami pokładnymi, aby je przygotowywać w każdy szabat."
  tags: []
"1Krn9,33":
  text: "Ci byli śpiewakami, naczelnikami rodów Lewitów, którzy mieszkają w komnatach; byli wolni od innych zajęć, gdyż we dnie i w nocy zajmowali się tą służbą."
  tags: []
"1Krn9,34":
  text: "Byli oni naczelnikami rodów Lewitów, naczelnikami według swoich rodowodów, a mieszkali w Jerozolimie."
  tags: []
"1Krn9,35":
  text: "W Gibeonie mieszkał Jejel, ojciec Gibeona, a jego żona miała na imię Maaka;"
  tags: []
"1Krn9,36":
  text: "A jego synem pierworodnym był Abdon, a następni to: Sur, Kisz, Baal, Neer, Nadab;"
  tags: []
"1Krn9,37":
  text: "I Gedor, Achio, Zachariasz, i Miklot."
  tags: []
"1Krn9,38":
  text: "A Miklot spłodził Szimmeama. Tamci również mieszkali ze swoimi braćmi w Jerozolimie naprzeciw swoich braci."
  tags: []
"1Krn9,39":
  text: "Neer spłodził Kisza, a Kisz spłodził Saula, a Saul spłodził Jonatana, Malkiszuę, Abinadaba i Eszbaala."
  tags: []
"1Krn9,40":
  text: "Synem Jonatana był Meribbaal, a Meribbaal spłodził Micheasza."
  tags: []
"1Krn9,41":
  text: "Synowie zaś Micheasza to: Piton, Melek, Tarea i Achaz."
  tags: []
"1Krn9,42":
  text: "Achaz spłodził Jarę, a Jara spłodził Alemeta, Azmaweta i Zimriego, a Zimri spłodził Mosę."
  tags: []
"1Krn9,43":
  text: "Mosa spłodził Bineę, a jego synem był Rafa, jego synem był Elasa, jego synem był Asel."
  tags: []
"1Krn9,44":
  text: "Asel miał sześciu synów, a oto ich imiona: Azrikam, Bokru, Izmael, Szeariasz, Obadiasz i Chanan. Ci byli synami Asela."
  tags: []
