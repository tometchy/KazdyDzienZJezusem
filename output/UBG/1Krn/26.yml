"1Krn26,1": "Co do zmiany odźwiernych: z Korachitów był Meszelemiasz, syn Korego, z synów Asafa."
"1Krn26,2": "A z synów Meszelemiasza: pierworodny Zachariasz, drugi Jediael, trzeci Zebadiasz, czwarty Jatniel;"
"1Krn26,3": "Piąty Elam, szósty Jehochanan, siódmy Elioenaj."
"1Krn26,4": "A z synów Obed-Edoma: pierworodny Szemajasz, drugi Jehozabad, trzeci Joach, czwarty Sakar, piąty Netaneel;"
"1Krn26,5": "Szósty Ammiel, siódmy Issachar, ósmy Peulletaj. Bóg bowiem mu błogosławił."
"1Krn26,6": "Również jego synowi Szemajaszowi urodzili się synowie, którzy rządzili swoim rodem. Byli bowiem bardzo dzielnymi ludźmi."
"1Krn26,7": "Synowie Szemajasza: Otni, Rafael, Obed, Elzabad i ich bracia, ludzie mocni – Elihu i Semakiasz."
"1Krn26,8": "Wszyscy ci byli z synów Obed-Edoma, oni, ich synowie i bracia, mężczyźni bardzo mocni i zdolni do służby, razem sześćdziesięciu dwóch z Obed-Edoma."
"1Krn26,9": "I Meszelemiasz miał synów i braci, ludzi mocnych – osiemnastu."
"1Krn26,10": "Również Chosa, który był z synów Merariego, miał synów: Szimri zwierzchnik, bo chociaż nie był pierworodnym, jego ojciec ustanowił go zwierzchnikiem;"
"1Krn26,11": "Drugi Chilkiasz, trzeci Tebaliasz, czwarty Zachariasz. Wszystkich synów i braci Chosy było trzynastu."
"1Krn26,12": "Spośród nich wyznaczono zmiany odźwiernych, spośród naczelników, którzy pełnili straż na przemian ze swoimi braćmi przy służbie w domu PANA."
"1Krn26,13": "I rzucali losy o każdą bramę, tak mały, jak i wielki, według swoich rodów."
"1Krn26,14": "Los dla Szelemiasza padł na stronę wschodnią. Potem rzucili los dla jego syna Zachariasza, mądrego doradcy, i jego los padł na stronę północną;"
"1Krn26,15": "Dla Obed-Edoma – na południową, a jego synom przypadła składnica."
"1Krn26,16": "Dla Szuppima i Chosy – na stronę zachodnią wraz z bramą Szalleket, przy drodze wiodącej ku górze, straż naprzeciw straży."
"1Krn26,17": "Od wschodu było sześciu Lewitów, od północy czterech na dzień, od południa czterech na dzień i przy składnicy po dwóch."
"1Krn26,18": "Przy Parbar na zachodzie: czterech przy drodze, a dwóch przy Parbar."
"1Krn26,19": "Takie są zmiany odźwiernych spośród synów Koracha i spośród synów Merariego."
"1Krn26,20": "A z pozostałych Lewitów Achiasz postawiony był nad skarbcami domu Bożego i nad skarbcami rzeczy poświęconych."
"1Krn26,21": "Synowie Ladana, którzy byli z synów Gerszonity: z Ladana Gerszonity naczelnicy rodów, Jechiel."
"1Krn26,22": "Synowie Jechiela: Zetam i jego brat Joel; oni byli postawieni nad skarbcami domu PANA."
"1Krn26,23": "Spośród Amramitów, Isharytów, Chebronitów i Uzzielitów:"
"1Krn26,24": "Szebuel, syn Gerszoma, syna Mojżesza, przełożony nad skarbcami."
"1Krn26,25": "A jego bracia, od strony Eliezera, to: jego syn Rechabiasz, jego syn Jeszajasz, jego syn Joram, jego syn Zikri i jego syn Szelomit."
"1Krn26,26": "Szelomit i jego bracia byli postawieni nad wszystkimi skarbcami rzeczy poświęconych, które poświęcił król Dawid, naczelnicy rodów, tysiącznicy, setnicy i dowódcy wojska."
"1Krn26,27": "To, co zdobyli z wojen i łupów, poświęcali na utrzymanie domu PANA."
"1Krn26,28": "I wszystko, co poświęcił Samuel, widzący, a także Saul, syn Kisza, Abner, syn Nera, i Joab, syn Serui, oraz wszystko, co zostało poświęcone, było pod opieką Szelomita i jego braci."
"1Krn26,29": "Spośród Isharytów: Kenaniasz i jego synowie zajmowali się sprawami zewnętrznymi Izraela jako urzędnicy i sędziowie."
"1Krn26,30": "Spośród Chebronitów: Chaszabiasz i jego bracia, ludzie dzielni, było ich tysiąc siedemset przełożonych nad Izraelem po zachodniej stronie Jordanu, odpowiadali za każdą sprawę PANA i służbę dla króla."
"1Krn26,31": "Spośród Chebronitów pochodził Jeriasz, naczelnik Chebronitów, według rodowodów jego ojców. W czterdziestym roku panowania Dawida szukano i znaleziono pośród nich bardzo dzielnych ludzi w Jazer w Gileadzie."
"1Krn26,32": "A jego braci, ludzi dzielnych, było dwa tysiące siedmiuset naczelników rodów, których król Dawid ustanowił zwierzchnikami nad Rubenitami, nad Gadytami i nad połową pokolenia Manassesa, by byli odpowiedzialni za wszystkie sprawy Boże i sprawy króla."
