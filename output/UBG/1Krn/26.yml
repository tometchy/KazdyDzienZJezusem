"1Krn26,1":
  text: "Co do zmiany odźwiernych: z Korachitów był Meszelemiasz, syn Korego, z synów Asafa."
  tags: []
"1Krn26,2":
  text: "A z synów Meszelemiasza: pierworodny Zachariasz, drugi Jediael, trzeci Zebadiasz, czwarty Jatniel;"
  tags: []
"1Krn26,3":
  text: "Piąty Elam, szósty Jehochanan, siódmy Elioenaj."
  tags: []
"1Krn26,4":
  text: "A z synów Obed-Edoma: pierworodny Szemajasz, drugi Jehozabad, trzeci Joach, czwarty Sakar, piąty Netaneel;"
  tags: []
"1Krn26,5":
  text: "Szósty Ammiel, siódmy Issachar, ósmy Peulletaj. Bóg bowiem mu błogosławił."
  tags: []
"1Krn26,6":
  text: "Również jego synowi Szemajaszowi urodzili się synowie, którzy rządzili swoim rodem. Byli bowiem bardzo dzielnymi ludźmi."
  tags: []
"1Krn26,7":
  text: "Synowie Szemajasza: Otni, Rafael, Obed, Elzabad i ich bracia, ludzie mocni – Elihu i Semakiasz."
  tags: []
"1Krn26,8":
  text: "Wszyscy ci byli z synów Obed-Edoma, oni, ich synowie i bracia, mężczyźni bardzo mocni i zdolni do służby, razem sześćdziesięciu dwóch z Obed-Edoma."
  tags: []
"1Krn26,9":
  text: "I Meszelemiasz miał synów i braci, ludzi mocnych – osiemnastu."
  tags: []
"1Krn26,10":
  text: "Również Chosa, który był z synów Merariego, miał synów: Szimri zwierzchnik, bo chociaż nie był pierworodnym, jego ojciec ustanowił go zwierzchnikiem;"
  tags: []
"1Krn26,11":
  text: "Drugi Chilkiasz, trzeci Tebaliasz, czwarty Zachariasz. Wszystkich synów i braci Chosy było trzynastu."
  tags: []
"1Krn26,12":
  text: "Spośród nich wyznaczono zmiany odźwiernych, spośród naczelników, którzy pełnili straż na przemian ze swoimi braćmi przy służbie w domu PANA."
  tags: []
"1Krn26,13":
  text: "I rzucali losy o każdą bramę, tak mały, jak i wielki, według swoich rodów."
  tags: []
"1Krn26,14":
  text: "Los dla Szelemiasza padł na stronę wschodnią. Potem rzucili los dla jego syna Zachariasza, mądrego doradcy, i jego los padł na stronę północną;"
  tags: []
"1Krn26,15":
  text: "Dla Obed-Edoma – na południową, a jego synom przypadła składnica."
  tags: []
"1Krn26,16":
  text: "Dla Szuppima i Chosy – na stronę zachodnią wraz z bramą Szalleket, przy drodze wiodącej ku górze, straż naprzeciw straży."
  tags: []
"1Krn26,17":
  text: "Od wschodu było sześciu Lewitów, od północy czterech na dzień, od południa czterech na dzień i przy składnicy po dwóch."
  tags: []
"1Krn26,18":
  text: "Przy Parbar na zachodzie: czterech przy drodze, a dwóch przy Parbar."
  tags: []
"1Krn26,19":
  text: "Takie są zmiany odźwiernych spośród synów Koracha i spośród synów Merariego."
  tags: []
"1Krn26,20":
  text: "A z pozostałych Lewitów Achiasz postawiony był nad skarbcami domu Bożego i nad skarbcami rzeczy poświęconych."
  tags: []
"1Krn26,21":
  text: "Synowie Ladana, którzy byli z synów Gerszonity: z Ladana Gerszonity naczelnicy rodów, Jechiel."
  tags: []
"1Krn26,22":
  text: "Synowie Jechiela: Zetam i jego brat Joel; oni byli postawieni nad skarbcami domu PANA."
  tags: []
"1Krn26,23":
  text: "Spośród Amramitów, Isharytów, Chebronitów i Uzzielitów:"
  tags: []
"1Krn26,24":
  text: "Szebuel, syn Gerszoma, syna Mojżesza, przełożony nad skarbcami."
  tags: []
"1Krn26,25":
  text: "A jego bracia, od strony Eliezera, to: jego syn Rechabiasz, jego syn Jeszajasz, jego syn Joram, jego syn Zikri i jego syn Szelomit."
  tags: []
"1Krn26,26":
  text: "Szelomit i jego bracia byli postawieni nad wszystkimi skarbcami rzeczy poświęconych, które poświęcił król Dawid, naczelnicy rodów, tysiącznicy, setnicy i dowódcy wojska."
  tags: []
"1Krn26,27":
  text: "To, co zdobyli z wojen i łupów, poświęcali na utrzymanie domu PANA."
  tags: []
"1Krn26,28":
  text: "I wszystko, co poświęcił Samuel, widzący, a także Saul, syn Kisza, Abner, syn Nera, i Joab, syn Serui, oraz wszystko, co zostało poświęcone, było pod opieką Szelomita i jego braci."
  tags: []
"1Krn26,29":
  text: "Spośród Isharytów: Kenaniasz i jego synowie zajmowali się sprawami zewnętrznymi Izraela jako urzędnicy i sędziowie."
  tags: []
"1Krn26,30":
  text: "Spośród Chebronitów: Chaszabiasz i jego bracia, ludzie dzielni, było ich tysiąc siedemset przełożonych nad Izraelem po zachodniej stronie Jordanu, odpowiadali za każdą sprawę PANA i służbę dla króla."
  tags: []
"1Krn26,31":
  text: "Spośród Chebronitów pochodził Jeriasz, naczelnik Chebronitów, według rodowodów jego ojców. W czterdziestym roku panowania Dawida szukano i znaleziono pośród nich bardzo dzielnych ludzi w Jazer w Gileadzie."
  tags: []
"1Krn26,32":
  text: "A jego braci, ludzi dzielnych, było dwa tysiące siedmiuset naczelników rodów, których król Dawid ustanowił zwierzchnikami nad Rubenitami, nad Gadytami i nad połową pokolenia Manassesa, by byli odpowiedzialni za wszystkie sprawy Boże i sprawy króla."
  tags: []
