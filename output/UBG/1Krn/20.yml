"1Krn20,1":
  text: "A na początku roku, w czasie, gdy królowie zwykli wyjeżdżać na wojnę, Joab poprowadził potężne wojsko i spustoszył ziemię synów Ammona, potem nadciągnął i obległ Rabbę, Dawid tymczasem pozostał w Jerozolimie. I Joab zdobył Rabbę, i zburzył ją."
  tags: []
"1Krn20,2":
  text: "Wtedy Dawid zdjął koronę jej króla z jego głowy, a okazało się, że waży ona talent złota, była też ozdobiona drogocennymi kamieniami. I włożono ją na głowę Dawida. Wywiózł też z miasta bardzo dużo łupów."
  tags: []
"1Krn20,3":
  text: "Lud, który był w nim, wyprowadził i przeciął piłami, bronami żelaznymi i siekierami. Tak uczynił Dawid ze wszystkimi miastami synów Ammona. Potem Dawid wrócił wraz z całym ludem do Jerozolimy."
  tags: []
"1Krn20,4":
  text: "Następnie doszło do wojny z Filistynami w Gezer. Wtedy to Sibbekaj Chuszatyta zabił Sippaja z rodu olbrzyma i tak Filistyni zostali pokonani."
  tags: []
"1Krn20,5":
  text: "I znowu była wojna z Filistynami, kiedy Elchanan, syn Jaira, zabił Lachmiego, brata Goliata Gittyty, którego drzewce włóczni było jak wał tkacki."
  tags: []
"1Krn20,6":
  text: "I była jeszcze wojna w Gat, gdzie znajdował się człowiek wysokiego wzrostu, który miał po sześć palców u rąk i nóg, razem – dwadzieścia cztery palce. On również pochodził z rodu tego olbrzyma."
  tags: []
"1Krn20,7":
  text: "A gdy wyzywał Izraela, zabił go Jonatan, syn Szimei, brata Dawida."
  tags: []
"1Krn20,8":
  text: "Ci byli synami jednego olbrzyma z Gat, a polegli z ręki Dawida i z rąk jego sług."
  tags: []
