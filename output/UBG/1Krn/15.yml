"1Krn15,1":
  text: "A gdy Dawid zbudował sobie domy w mieście Dawida, przygotował miejsce dla arki Boga i rozbił jej namiot."
  tags: []
"1Krn15,2":
  text: "Wtedy Dawid powiedział: Nie wolno nikomu nosić arki Boga oprócz Lewitów. Ich bowiem wybrał PAN, aby nosili arkę Boga i aby służyli mu na wieki."
  tags: []
"1Krn15,3":
  text: "Dawid więc zebrał całego Izraela w Jerozolimie, aby przenieść arkę PANA na miejsce, które dla niej przygotował."
  tags: []
"1Krn15,4":
  text: "Zgromadził też Dawid synów Aarona i Lewitów:"
  tags: []
"1Krn15,5":
  text: "Z synów Kehata: Uriela naczelnika i jego braci – stu dwudziestu;"
  tags: []
"1Krn15,6":
  text: "Z synów Merariego: Asajasza naczelnika i jego braci – dwustu dwudziestu;"
  tags: []
"1Krn15,7":
  text: "Z synów Gerszoma: Joela naczelnika i jego braci – stu trzydziestu;"
  tags: []
"1Krn15,8":
  text: "Z synów Elisafana: Szemajasza naczelnika i jego braci – dwustu;"
  tags: []
"1Krn15,9":
  text: "Z synów Chebrona: Eliela naczelnika i jego braci – osiemdziesięciu;"
  tags: []
"1Krn15,10":
  text: "Z synów Uzziela: Amminadaba naczelnika i jego braci – stu dwunastu."
  tags: []
"1Krn15,11":
  text: "Wtedy Dawid wezwał kapłanów Sadoka i Abiatara oraz Lewitów: Uriela, Asajasza, Joela, Szemajasza, Eliela i Amminadaba;"
  tags: []
"1Krn15,12":
  text: "I powiedział do nich: Jesteście naczelnikami rodów lewickich. Poświęćcie się wy i wasi bracia, abyście mogli przenieść arkę PANA, Boga Izraela, na miejsce, które dla niej przygotowałem."
  tags: []
"1Krn15,13":
  text: "Ponieważ za pierwszym razem tego nie uczyniliście, PAN, nasz Bóg, zesłał na nas nieszczęście, bo nie szukaliśmy go tak, jak należy."
  tags: []
"1Krn15,14":
  text: "Poświęcili się więc kapłani i Lewici, aby przenieść arkę PANA, Boga Izraela."
  tags: []
"1Krn15,15":
  text: "Synowie Lewitów nieśli arkę Boga, jak rozkazał Mojżesz według słowa PANA, na swoich ramionach na drążkach, które przy niej były."
  tags: []
"1Krn15,16":
  text: "Potem Dawid rozkazał naczelnikom Lewitów, aby ustanowili swoich braci śpiewakami przy instrumentach muzycznych: cytrach, harfach i cymbałach, aby rozbrzmiewał donośny głos pełen radości."
  tags: []
"1Krn15,17":
  text: "Lewici ustanowili Hemana, syna Joela, a z jego braci – Asafa, syna Berechiasza, a z synów Merariego, ich braci – Etana, syna Kuszajasza;"
  tags: []
"1Krn15,18":
  text: "A z nimi braci ich drugiego stopnia: Zachariasza, Bena, Jaaziela, Szemiramota, Jechiela, Unniego, Eliaba, Benajasza, Maasejasza, Mattitiasza, Elifela, Miknejasza, Obed-Edoma i Jejela – odźwiernych."
  tags: []
"1Krn15,19":
  text: "A śpiewacy Heman, Asaf i Etan grali głośno na cymbałach z brązu."
  tags: []
"1Krn15,20":
  text: "Zachariasz, Jaziel, Szemiramot, Jechiel, Unni, Elijab, Maasejasz i Benajasz grali na cytrach na Alamot."
  tags: []
"1Krn15,21":
  text: "A Mattitiasz, Elifel, Miknejasz, Obed-Edom, Jejel i Azaziasz grali na harfach na Seminit i prowadzili śpiew."
  tags: []
"1Krn15,22":
  text: "A Kenaniasz, naczelnik Lewitów, odpowiadał za pieśni. Kierował śpiewaniem, bo był uzdolniony."
  tags: []
"1Krn15,23":
  text: "Berekiasz i Elkana byli odźwiernymi przy arce."
  tags: []
"1Krn15,24":
  text: "A kapłani: Szebaniasz, Joszafat, Netaneel, Amasaj, Zachariasz, Benajasz i Eliezer grali na trąbach przed arką Boga, a Obed-Edom i Jechiasz byli odźwiernymi przy arce."
  tags: []
"1Krn15,25":
  text: "Tak więc Dawid, starsi Izraela i tysiącznicy wyruszyli, aby z radością przenieść arkę przymierza PANA z domu Obed-Edoma."
  tags: []
"1Krn15,26":
  text: "I kiedy Bóg wspomógł Lewitów niosących arkę przymierza PANA, złożyli w ofierze siedem wołów i siedem baranów."
  tags: []
"1Krn15,27":
  text: "A Dawid był ubrany w szatę z bisioru, podobnie jak wszyscy Lewici, którzy nieśli arkę, śpiewacy i Kenaniasz, kierujący śpiewem. Dawid miał także na sobie lniany efod."
  tags: []
"1Krn15,28":
  text: "I w ten sposób cały Izrael prowadził arkę przymierza PANA wśród radosnych okrzyków, przy dźwięku kornetu, trąb i cymbałów, grając na cytrach i harfach."
  tags: []
"1Krn15,29":
  text: "I kiedy arka przymierza PANA wchodziła do miasta Dawida, Mikal, córka Saula, wyglądała przez okno i zobaczyła króla Dawida tańczącego i grającego. I wzgardziła nim w swoim sercu."
  tags: []
