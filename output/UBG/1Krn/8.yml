"1Krn8,1": "Beniamin spłodził Belę, swego pierworodnego, Aszbela – drugiego, Achracha – trzeciego;"
"1Krn8,2": "Nocha – czwartego, Rafa – piątego."
"1Krn8,3": "Synami Beli byli: Addar, Gera, Abihud;"
"1Krn8,4": "Abiszua, Naaman, Achoach;"
"1Krn8,5": "Gera, Szefufan i Huram."
"1Krn8,6": "Oto synowie Ehuda – byli oni naczelnikami rodów mieszkających w Geba i zostali przesiedleni do Manachat;"
"1Krn8,7": "Byli to: Naaman, Achiasz i Gera. On ich przesiedlił i potem spłodził Uzzę i Ahiuda."
"1Krn8,8": "A Sacharaim spłodził dzieci w krainie Moabu po odprawieniu swoich żon Chuszimy i Baary."
"1Krn8,9": "Spłodził więc ze swojej żony Chodeszy Jobaba, Sibię, Meszę, Malkoma;"
"1Krn8,10": "Jeusa, Sakiasza i Mirmę. Ci byli jego synami, naczelnikami rodów."
"1Krn8,11": "Z Chuszimy spłodził Abituba i Elpaala."
"1Krn8,12": "Synowie Elpaala: Eber, Miszam i Szemed, który zbudował Ono i Lod oraz należące do niego miejscowości;"
"1Krn8,13": "A także Beria i Szema, którzy byli naczelnikami rodów mieszkających w Ajjalonie. To oni wypędzili mieszkańców Gat."
"1Krn8,14": "A Achio, Szaszak, Jeremot;"
"1Krn8,15": "Zebadiasz, Arad, Eder;"
"1Krn8,16": "Mikael, Jiszpa i Jocha – byli to synowie Berii."
"1Krn8,17": "A Zebadiasz, Meszullam, Chiszki, Cheber;"
"1Krn8,18": "Jiszmeraj, Jiszlia i Jobab – byli synami Elpaala."
"1Krn8,19": "A Jakim, Zikri, Zabdi;"
"1Krn8,20": "Elioenaj, Silletaj, Eliel;"
"1Krn8,21": "Adajasz, Berajasz, Szimrat – to synowie Szimejego."
"1Krn8,22": "A Jiszpan, Eber, Eliel;"
"1Krn8,23": "Abdon, Zikri, Chanan;"
"1Krn8,24": "Chananiasz, Elam i Antotiasz;"
"1Krn8,25": "Jifdejasz i Penuel – to synowie Szaszaka."
"1Krn8,26": "A Szamszeraj, Szechariasz, Ataliasz;"
"1Krn8,27": "Jaareszjasz, Eliasz i Zikri – to synowie Jerochama."
"1Krn8,28": "Ci byli naczelnikami rodów, przywódcami według swoich rodowodów, a zamieszkali w Jerozolimie."
"1Krn8,29": "W Gibeonie mieszkał ojciec Gibeona, a jego żona miała na imię Maaka."
"1Krn8,30": "Jego pierworodnym synem był Abdon, a następni to: Sur, Kisz, Baal, Nadab;"
"1Krn8,31": "Gedor, Achio i Zakir."
"1Krn8,32": "Miklot spłodził Szimeę. Oni także mieszkali ze swoimi braćmi w Jerozolimie, naprzeciw swoich braci."
"1Krn8,33": "Ner spłodził Kisza, a Kisz spłodził Saula, Saul zaś spłodził Jonatana, Malkiszuę, Abinadaba i Eszbaala."
"1Krn8,34": "Synem Jonatana był Meribbaal, Meribbaal zaś spłodził Micheasza."
"1Krn8,35": "Synowie Micheasza: Piton, Melek, Tarea i Achaz."
"1Krn8,36": "Achaz spłodził Jehoaddę, a Jehoadda spłodził Alemeta, Azmaweta i Zimriego, a Zimri spłodził Mosę;"
"1Krn8,37": "Mosa spłodził Bineę, jego synem był Rafa, jego synem był Eleasa, jego synem był Asel."
"1Krn8,38": "Asel miał sześciu synów, a oto ich imiona: Azrikam, Bokru, Izmael, Szeariasz, Obadiasz i Chanan. Ci wszyscy byli synami Asela."
"1Krn8,39": "Synowie jego brata Eszeka: Ulam, jego pierworodny, Jeusz – drugi, Elifelet – trzeci;"
"1Krn8,40": "Synowie Ulama byli dzielnymi wojownikami, sprawnymi łucznikami, a mieli wielu synów i wnuków, razem – stu pięćdziesięciu. Ci wszyscy pochodzili z synów Beniamina."
