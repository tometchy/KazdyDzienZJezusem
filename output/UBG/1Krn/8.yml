"1Krn8,1":
  text: "Beniamin spłodził Belę, swego pierworodnego, Aszbela – drugiego, Achracha – trzeciego;"
  tags: []
"1Krn8,2":
  text: "Nocha – czwartego, Rafa – piątego."
  tags: []
"1Krn8,3":
  text: "Synami Beli byli: Addar, Gera, Abihud;"
  tags: []
"1Krn8,4":
  text: "Abiszua, Naaman, Achoach;"
  tags: []
"1Krn8,5":
  text: "Gera, Szefufan i Huram."
  tags: []
"1Krn8,6":
  text: "Oto synowie Ehuda – byli oni naczelnikami rodów mieszkających w Geba i zostali przesiedleni do Manachat;"
  tags: []
"1Krn8,7":
  text: "Byli to: Naaman, Achiasz i Gera. On ich przesiedlił i potem spłodził Uzzę i Ahiuda."
  tags: []
"1Krn8,8":
  text: "A Sacharaim spłodził dzieci w krainie Moabu po odprawieniu swoich żon Chuszimy i Baary."
  tags: []
"1Krn8,9":
  text: "Spłodził więc ze swojej żony Chodeszy Jobaba, Sibię, Meszę, Malkoma;"
  tags: []
"1Krn8,10":
  text: "Jeusa, Sakiasza i Mirmę. Ci byli jego synami, naczelnikami rodów."
  tags: []
"1Krn8,11":
  text: "Z Chuszimy spłodził Abituba i Elpaala."
  tags: []
"1Krn8,12":
  text: "Synowie Elpaala: Eber, Miszam i Szemed, który zbudował Ono i Lod oraz należące do niego miejscowości;"
  tags: []
"1Krn8,13":
  text: "A także Beria i Szema, którzy byli naczelnikami rodów mieszkających w Ajjalonie. To oni wypędzili mieszkańców Gat."
  tags: []
"1Krn8,14":
  text: "A Achio, Szaszak, Jeremot;"
  tags: []
"1Krn8,15":
  text: "Zebadiasz, Arad, Eder;"
  tags: []
"1Krn8,16":
  text: "Mikael, Jiszpa i Jocha – byli to synowie Berii."
  tags: []
"1Krn8,17":
  text: "A Zebadiasz, Meszullam, Chiszki, Cheber;"
  tags: []
"1Krn8,18":
  text: "Jiszmeraj, Jiszlia i Jobab – byli synami Elpaala."
  tags: []
"1Krn8,19":
  text: "A Jakim, Zikri, Zabdi;"
  tags: []
"1Krn8,20":
  text: "Elioenaj, Silletaj, Eliel;"
  tags: []
"1Krn8,21":
  text: "Adajasz, Berajasz, Szimrat – to synowie Szimejego."
  tags: []
"1Krn8,22":
  text: "A Jiszpan, Eber, Eliel;"
  tags: []
"1Krn8,23":
  text: "Abdon, Zikri, Chanan;"
  tags: []
"1Krn8,24":
  text: "Chananiasz, Elam i Antotiasz;"
  tags: []
"1Krn8,25":
  text: "Jifdejasz i Penuel – to synowie Szaszaka."
  tags: []
"1Krn8,26":
  text: "A Szamszeraj, Szechariasz, Ataliasz;"
  tags: []
"1Krn8,27":
  text: "Jaareszjasz, Eliasz i Zikri – to synowie Jerochama."
  tags: []
"1Krn8,28":
  text: "Ci byli naczelnikami rodów, przywódcami według swoich rodowodów, a zamieszkali w Jerozolimie."
  tags: []
"1Krn8,29":
  text: "W Gibeonie mieszkał ojciec Gibeona, a jego żona miała na imię Maaka."
  tags: []
"1Krn8,30":
  text: "Jego pierworodnym synem był Abdon, a następni to: Sur, Kisz, Baal, Nadab;"
  tags: []
"1Krn8,31":
  text: "Gedor, Achio i Zakir."
  tags: []
"1Krn8,32":
  text: "Miklot spłodził Szimeę. Oni także mieszkali ze swoimi braćmi w Jerozolimie, naprzeciw swoich braci."
  tags: []
"1Krn8,33":
  text: "Ner spłodził Kisza, a Kisz spłodził Saula, Saul zaś spłodził Jonatana, Malkiszuę, Abinadaba i Eszbaala."
  tags: []
"1Krn8,34":
  text: "Synem Jonatana był Meribbaal, Meribbaal zaś spłodził Micheasza."
  tags: []
"1Krn8,35":
  text: "Synowie Micheasza: Piton, Melek, Tarea i Achaz."
  tags: []
"1Krn8,36":
  text: "Achaz spłodził Jehoaddę, a Jehoadda spłodził Alemeta, Azmaweta i Zimriego, a Zimri spłodził Mosę;"
  tags: []
"1Krn8,37":
  text: "Mosa spłodził Bineę, jego synem był Rafa, jego synem był Eleasa, jego synem był Asel."
  tags: []
"1Krn8,38":
  text: "Asel miał sześciu synów, a oto ich imiona: Azrikam, Bokru, Izmael, Szeariasz, Obadiasz i Chanan. Ci wszyscy byli synami Asela."
  tags: []
"1Krn8,39":
  text: "Synowie jego brata Eszeka: Ulam, jego pierworodny, Jeusz – drugi, Elifelet – trzeci;"
  tags: []
"1Krn8,40":
  text: "Synowie Ulama byli dzielnymi wojownikami, sprawnymi łucznikami, a mieli wielu synów i wnuków, razem – stu pięćdziesięciu. Ci wszyscy pochodzili z synów Beniamina."
  tags: []
