"1Krn17,1": "Kiedy Dawid zamieszkał w swoim domu, powiedział do proroka Natana: Oto mieszkam w domu cedrowym, a arka przymierza PANA pod zasłonami."
"1Krn17,2": "Natan powiedział do Dawida: Uczyń wszystko, co jest w twoim sercu, gdyż Bóg jest z tobą."
"1Krn17,3": "Lecz tej samej nocy doszło do Natana słowo Boże, mówiące:"
"1Krn17,4": "Idź i powiedz mojemu słudze Dawidowi: Tak mówi PAN: Nie ty zbudujesz mi dom, w którym zamieszkam."
"1Krn17,5": "Nie mieszkałem bowiem w żadnym domu od dnia, w którym wyprowadziłem synów Izraela, aż do dziś, ale przechodziłem z namiotu do namiotu i z przybytku do przybytku."
"1Krn17,6": "Wszędzie, gdziekolwiek chodziłem z całym Izraelem, czy powiedziałem do któregoś z sędziów Izraela, którym nakazałem paść mój lud: Dlaczego nie zbudowaliście mi domu cedrowego?"
"1Krn17,7": "Teraz więc tak powiesz mojemu słudze Dawidowi: Tak mówi PAN zastępów: Ja wziąłem ciebie z owczarni od chodzenia za trzodą, abyś był dowódcą nad moim ludem Izraelem."
"1Krn17,8": "I byłem z tobą wszędzie, dokądkolwiek chodziłeś, wytraciłem przed tobą wszystkich twoich wrogów i uczyniłem twoje imię jak imię wielkich ludzi, którzy są na ziemi."
"1Krn17,9": "Ustanowię miejsce dla swego ludu Izraela i zasadzę go tam, i będzie mieszkał na swoim miejscu, i nie poruszy się więcej ani już nie będą go gnębić synowie nieprawości jak dawniej;"
"1Krn17,10": "Od czasu, kiedy ustanowiłem sędziów nad swoim ludem Izraelem, i ujarzmię wszystkich twoich wrogów. Oznajmiam ci też, że PAN zbuduje ci dom."
"1Krn17,11": "Gdy się wypełnią twoje dni i będziesz musiał odejść do swoich ojców, wzbudzę po tobie twego potomka, który będzie spośród twoich synów, i utwierdzę jego królestwo."
"1Krn17,12": "On zbuduje mi dom i utwierdzę jego tron na wieki."
"1Krn17,13": "Ja będę mu ojcem, a on będzie mi synem. Nie cofnę od niego swojego miłosierdzia, jak je cofnąłem od tego, który był przed tobą."
"1Krn17,14": "Ustanowię go w moim domu i w moim królestwie na wieki, jego tron będzie utwierdzony na wieki."
"1Krn17,15": "Zgodnie z tymi wszystkimi słowami i zgodnie z całym tym widzeniem, tak mówił Natan do Dawida."
"1Krn17,16": "Przyszedł więc król Dawid, usiadł przed PANEM i powiedział: Kim ja jestem, PANIE Boże, i czym jest mój dom, że doprowadziłeś mnie dotąd?"
"1Krn17,17": "Lecz i to było jeszcze mało w twoich oczach, Boże, gdyż złożyłeś też obietnicę o domu swego sługi na daleką przyszłość i wejrzałeś na mnie jak na człowieka wysokiego stanu, PANIE Boże."
"1Krn17,18": "Co więcej może ci powiedzieć Dawid za taką chwałę okazaną twemu słudze? Ty bowiem znasz swego sługę."
"1Krn17,19": "PANIE, przez wzgląd na swego sługę i według swego serca uczyniłeś te wszystkie wielkie rzeczy, dając poznać te wszystkie wspaniałe sprawy."
"1Krn17,20": "PANIE, nie ma nikogo podobnego do ciebie i nie ma Boga oprócz ciebie według wszystkiego, co słyszeliśmy na własne uszy."
"1Krn17,21": "I czy jest taki naród na ziemi, jak twój lud Izrael, dla którego Bóg wyruszył, aby go sobie wykupić jako swój lud, a przez to uczynić swoje imię wielkim i straszliwym, wypędzając narody przed swoim ludem, który wykupiłeś z Egiptu?"
"1Krn17,22": "Uczyniłeś bowiem twój lud Izraela swoim ludem na wieki i ty, PANIE, stałeś się jego Bogiem."
"1Krn17,23": "Teraz więc, PANIE, niech słowo, które wypowiedziałeś o swoim słudze i o jego domu, będzie utwierdzone na wieki i uczyń, jak powiedziałeś."
"1Krn17,24": "Niech stanie się tak, aby twoje imię było uwielbione na wieki, aby mówiono: PAN zastępów, Bóg Izraela, jest Bogiem nad Izraelem; niech dom Dawida, twego sługi, będzie utwierdzony przed tobą."
"1Krn17,25": "Ty bowiem, mój Boże, objawiłeś swemu słudze, że zbudujesz mu dom. Dlatego twój sługa ośmielił się modlić przed tobą."
"1Krn17,26": "A teraz, PANIE, ty jesteś Bogiem i obiecałeś takie dobro swemu słudze."
"1Krn17,27": "Racz więc błogosławić dom swego sługi, aby trwał na wieki przed tobą. Co bowiem ty, PANIE, błogosławisz, będzie błogosławione na wieki."
