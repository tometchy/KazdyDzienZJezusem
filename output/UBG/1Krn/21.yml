"1Krn21,1": "Wtedy szatan powstał przeciwko Izraelowi i pobudził Dawida, aby policzył Izraela."
"1Krn21,2": "Dawid więc powiedział do Joaba i do przełożonych nad ludem: Idźcie, policzcie Izraela od Beer-Szeby aż do Dan i donieście mi o ich liczbie, abym ją poznał."
"1Krn21,3": "Lecz Joab odpowiedział: Niech PAN pomnoży swój lud sto razy tyle, ile go jest. Lecz, mój panie, królu, czy nie są oni wszyscy sługami mego pana? Czemu mój pan żąda tego? Czemu miałoby to być przyczyną grzechu dla Izraela?"
"1Krn21,4": "Słowo króla jednak przemogło Joaba. Wyszedł więc Joab, obszedł całego Izraela i wrócił do Jerozolimy."
"1Krn21,5": "I podał Joab Dawidowi liczbę policzonych. A było wszystkich w Izraelu milion sto tysięcy mężczyzn dobywających miecz, a z Judy – czterysta siedemdziesiąt tysięcy mężczyzn dobywających miecz."
"1Krn21,6": "Lecz Lewitów i Beniaminitów nie policzył razem z nimi, gdyż rozkaz króla budził odrazę w Joabie."
"1Krn21,7": "Nie podobała się też Bogu ta rzecz, więc ukarał Izraela."
"1Krn21,8": "Wtedy Dawid powiedział do Boga: Zgrzeszyłem bardzo, czyniąc tę rzecz. Lecz teraz, proszę, zgładź nieprawość swego sługi, gdyż bardzo głupio postąpiłem."
"1Krn21,9": "I PAN powiedział do Gada, widzącego Dawida:"
"1Krn21,10": "Idź i powiedz Dawidowi: Tak mówi PAN: Trzy rzeczy ci przedstawiam, wybierz sobie jedną z nich, abym ci uczynił."
"1Krn21,11": "Przyszedł więc Gad do Dawida i powiedział mu: Tak mówi PAN: Wybierz sobie:"
"1Krn21,12": "Albo trzy lata głodu, albo trzy miesiące klęsk od twoich wrogów, podczas których miecz twoich wrogów będzie cię ścigał, albo trzy dni miecza PANA i zarazy w ziemi, kiedy Anioł PANA będzie niszczył wszystkie granice Izraela. Teraz więc rozważ, co mam odpowiedzieć temu, który mnie posłał."
"1Krn21,13": "Dawid odpowiedział Gadowi: Jestem w wielkiej rozterce. Niech wpadnę raczej w ręce PANA, gdyż wielkie jest jego miłosierdzie. Niech nie wpadnę w ręce człowieka."
"1Krn21,14": "Zesłał więc PAN zarazę na Izraela. I poległo z Izraela siedemdziesiąt tysięcy mężczyzn."
"1Krn21,15": "Posłał też Bóg Anioła do Jerozolimy, aby ją zniszczyć. A gdy ją niszczył, wejrzał PAN i użalił się nad tym nieszczęściem i powiedział do Anioła, który niszczył: Dosyć już, powstrzymaj rękę. A Anioł PANA stał obok klepiska Ornana Jebusyty."
"1Krn21,16": "Gdy Dawid podniósł oczy, ujrzał Anioła PANA stojącego między ziemią a niebem, a w jego ręce dobyty miecz wyciągnięty nad Jerozolimą. Wtedy Dawid i starsi, ubrani w wory, upadli na twarze."
"1Krn21,17": "I Dawid powiedział do Boga: Czy nie ja rozkazałem policzyć lud? Ja jestem tym, który zgrzeszył i bardzo źle uczynił, ale te owce, co uczyniły? PANIE, mój Boże, błagam, niech się obróci twoja ręka przeciwko mnie, domowi mego ojca. Lecz niech się nie rozprzestrzenia ta plaga przeciwko twemu ludowi."
"1Krn21,18": "Wtedy Anioł PANA powiedział do Gada, aby oznajmił Dawidowi, że ma iść i zbudować PANU ołtarz na klepisku Ornana Jebusyty."
"1Krn21,19": "Dawid więc poszedł według słowa Gada, który mówił w imieniu PANA."
"1Krn21,20": "Wtedy Ornan obrócił się i ujrzał Anioła, a jego czterej synowie, którzy byli z nim, ukryli się. A Ornan młócił pszenicę."
"1Krn21,21": "Gdy Dawid przyszedł do Ornana, ten spojrzał i zobaczył Dawida. Wyszedł więc z klepiska i pokłonił się Dawidowi twarzą do ziemi."
"1Krn21,22": "I Dawid powiedział do Ornana: Odstąp mi miejsce tego klepiska, abym zbudował na nim ołtarz PANU. Oddaj mi je za pełną cenę, aby plaga odstąpiła od ludu."
"1Krn21,23": "Ornan odpowiedział Dawidowi: Weź je sobie i niech mój pan, król, uczyni, co uważa za słuszne. Oto oddaję też woły na całopalenia, sprzęty młocarskie na drwa i pszenicę na ofiarę z pokarmów – to wszystko daję."
"1Krn21,24": "I król Dawid powiedział do Ornana: Nie, raczej kupię wszystko za pełną cenę. Nie wezmę bowiem dla PANA tego, co jest twoje, ani nie będę ofiarowywał całopaleń, które nic nie kosztują."
"1Krn21,25": "Dał więc Dawid Ornanowi za to miejsce sykle złota w wadze sześciuset."
"1Krn21,26": "I Dawid zbudował tam PANU ołtarz, złożył całopalenia i ofiary pojednawcze i wzywał PANA, a on mu odpowiedział z nieba, spuszczając ogień na ołtarz całopalenia."
"1Krn21,27": "I PAN rozkazał Aniołowi, by schował swój miecz do pochwy."
"1Krn21,28": "Wtedy Dawid, widząc, że PAN go wysłuchał na klepisku Ornana Jebusyty, składał tam ofiary."
"1Krn21,29": "Przybytek PANA bowiem, który Mojżesz zbudował na pustyni, oraz ołtarz całopalenia były w tym czasie na wyżynie w Gibeonie."
"1Krn21,30": "Lecz Dawid nie mógł iść do niego, aby radzić się Boga, gdyż bał się miecza Anioła PANA."
