"1Krn1,1": "Adam, Set, Enosz;"
"1Krn1,2": "Kenan, Mahalaleel, Jered;"
"1Krn1,3": "Henoch, Matuzalem, Lamech;"
"1Krn1,4": "Noe, Sem, Cham i Jafet."
"1Krn1,5": "Synowie Jafeta: Gomer, Magog, Madaj, Jawan, Tubal, Meszek i Tiras."
"1Krn1,6": "A synowie Gomera: Aszkenaz, Rifat i Togarma."
"1Krn1,7": "A synowie Jawana: Elisa i Tarszisz, Cytym i Dodanim."
"1Krn1,8": "Synowie Chama: Kusz, Misraim, Put i Kanaan."
"1Krn1,9": "A synowie Kusza: Seba, Chaawila, Sabta, Rama i Sabteka. A synowie Ramy: Szeba i Dedan."
"1Krn1,10": "Kusz spłodził Nimroda, który zaczął być mocarzem na ziemi."
"1Krn1,11": "Misraim spłodził Ludima, Ananima, Lahabima i Naftuchima;"
"1Krn1,12": "Oraz Patrusyma, Kasluchima, od których wywodzą się Filistyni, i Kaftoryma."
"1Krn1,13": "Kanaan zaś spłodził Sidona, swego pierworodnego, i Cheta;"
"1Krn1,14": "Jebusytę, Amorytę i Girgaszytę;"
"1Krn1,15": "Chiwwitę, Arkitę i Sinitę;"
"1Krn1,16": "Arwadytę, Semarytę i Chamatytę."
"1Krn1,17": "Synowie Sema: Elam, Assur, Arpachszad, Lud, Aram, Us, Chul, Geter i Meszek."
"1Krn1,18": "Arpachszad spłodził Szelacha, a Szelach spłodził Ebera."
"1Krn1,19": "Eberowi zaś urodzili się dwaj synowie: jeden miał na imię Peleg, gdyż za jego czasów ziemia została rozdzielona, a imię brata jego – Joktan."
"1Krn1,20": "Joktan spłodził Almodada, Szelefa, Chasarmaweta i Jeracha;"
"1Krn1,21": "Hadorama, Uzala i Diklę;"
"1Krn1,22": "Ebala, Abimaela i Szeba;"
"1Krn1,23": "Ofira, Chawila i Jobaba. Wszyscy ci byli synami Joktana."
"1Krn1,24": "Sem, Arpachszad, Szelach;"
"1Krn1,25": "Eber, Peleg, Reu;"
"1Krn1,26": "Serug, Nachor, Terach;"
"1Krn1,27": "Abram, to jest Abraham."
"1Krn1,28": "Synowie Abrahama: Izaak i Izmael."
"1Krn1,29": "A oto są ich rody: pierworodny Izmaela – Nebajot, następnie Kedar, Abdeel i Mibsam;"
"1Krn1,30": "Miszma, Duma, Massa, Hadad i Tema;"
"1Krn1,31": "Jetur, Nafisz i Kedma. Byli oni synami Izmaela."
"1Krn1,32": "A oto synowie Ketury, nałożnicy Abrahama: urodziła ona Zimrana, Jokszana, Medana, Midiana, Jiszbaka i Szuacha. A synowie Jokszana: Szeba i Dedan."
"1Krn1,33": "Synowie Midiana: Efa, Efer, Henoch, Abida i Eldaa. Oni wszyscy byli synami Ketury."
"1Krn1,34": "I Abraham spłodził Izaaka. Synowie Izaaka: Ezaw i Izrael."
"1Krn1,35": "A synowie Ezawa: Elifaz, Rehuel, Jeusz, Jalam i Korach."
"1Krn1,36": "Synowie Elifaza: Teman, Omar, Sefo, Gatam, Kenaz, Timna i Amalek."
"1Krn1,37": "Synowie Rehuela: Nachat, Zerach, Szamma i Mizza."
"1Krn1,38": "A synowie Seira: Lotan, Szobal, Sibeon, Ana, Diszon, Eser i Diszan."
"1Krn1,39": "A synowie Lotana: Chori, Homam; a siostrą Lotana była Timna."
"1Krn1,40": "Synowie Szobala: Alian, Manachat, Ebal, Szefo i Onam. A synowie Sibeona: Ajja i Ana."
"1Krn1,41": "Synowie Any: Diszon. Synowie Diszona: Chamran i Eszban, Jitran i Keran."
"1Krn1,42": "Synowie Esera: Bilhan, Zaawan i Jaakan. Synowie Diszana: Us i Aran."
"1Krn1,43": "To byli królowie, którzy panowali w ziemi Edomu, zanim zapanował król nad synami Izraela: Bela, syn Beora, a jego miasto nazywało się Dinhaba."
"1Krn1,44": "A gdy Bela umarł, królował w jego miejsce Jobab, syn Zeracha z Bosry."
"1Krn1,45": "A gdy Jobab umarł, królował w jego miejsce Chuszam z ziemi Temanitów."
"1Krn1,46": "A gdy Chuszam umarł, królował w jego miejsce Hadad, syn Bedada, który pobił Midianitów na polu Moabu. A jego miasto nazywało się Awit."
"1Krn1,47": "A gdy Hadad umarł, królował w jego miejsce Samla z Masreki."
"1Krn1,48": "A gdy Samla umarł, królował w jego miejsce Szaul z Rechobot nad Rzeką."
"1Krn1,49": "A gdy Szaul umarł, królował w jego miejsce Baalchanan, syn Akbora."
"1Krn1,50": "A gdy Baalchanan umarł, królował w jego miejsce Hadad. Jego miasto nazywało się Pai, a jego żona miała na imię Mehetabel, była to córka Matredy, córki Mezahaba."
"1Krn1,51": "I Hadad umarł. A książętami Edomu byli: książę Timna, książę Alia, książę Jetet;"
"1Krn1,52": "Książę Oholibama, książę Ela, książę Pinon;"
"1Krn1,53": "Książę Kenaz, książę Teman, książę Mibsar;"
"1Krn1,54": "Książę Magdiel, książę Iram. Oni byli książętami Edomu."
