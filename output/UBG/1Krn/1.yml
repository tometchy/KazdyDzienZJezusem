"1Krn1,1":
  text: "Adam, Set, Enosz;"
  tags: []
"1Krn1,2":
  text: "Kenan, Mahalaleel, Jered;"
  tags: []
"1Krn1,3":
  text: "Henoch, Matuzalem, Lamech;"
  tags: []
"1Krn1,4":
  text: "Noe, Sem, Cham i Jafet."
  tags: []
"1Krn1,5":
  text: "Synowie Jafeta: Gomer, Magog, Madaj, Jawan, Tubal, Meszek i Tiras."
  tags: []
"1Krn1,6":
  text: "A synowie Gomera: Aszkenaz, Rifat i Togarma."
  tags: []
"1Krn1,7":
  text: "A synowie Jawana: Elisa i Tarszisz, Cytym i Dodanim."
  tags: []
"1Krn1,8":
  text: "Synowie Chama: Kusz, Misraim, Put i Kanaan."
  tags: []
"1Krn1,9":
  text: "A synowie Kusza: Seba, Chaawila, Sabta, Rama i Sabteka. A synowie Ramy: Szeba i Dedan."
  tags: []
"1Krn1,10":
  text: "Kusz spłodził Nimroda, który zaczął być mocarzem na ziemi."
  tags: []
"1Krn1,11":
  text: "Misraim spłodził Ludima, Ananima, Lahabima i Naftuchima;"
  tags: []
"1Krn1,12":
  text: "Oraz Patrusyma, Kasluchima, od których wywodzą się Filistyni, i Kaftoryma."
  tags: []
"1Krn1,13":
  text: "Kanaan zaś spłodził Sidona, swego pierworodnego, i Cheta;"
  tags: []
"1Krn1,14":
  text: "Jebusytę, Amorytę i Girgaszytę;"
  tags: []
"1Krn1,15":
  text: "Chiwwitę, Arkitę i Sinitę;"
  tags: []
"1Krn1,16":
  text: "Arwadytę, Semarytę i Chamatytę."
  tags: []
"1Krn1,17":
  text: "Synowie Sema: Elam, Assur, Arpachszad, Lud, Aram, Us, Chul, Geter i Meszek."
  tags: []
"1Krn1,18":
  text: "Arpachszad spłodził Szelacha, a Szelach spłodził Ebera."
  tags: []
"1Krn1,19":
  text: "Eberowi zaś urodzili się dwaj synowie: jeden miał na imię Peleg, gdyż za jego czasów ziemia została rozdzielona, a imię brata jego – Joktan."
  tags: []
"1Krn1,20":
  text: "Joktan spłodził Almodada, Szelefa, Chasarmaweta i Jeracha;"
  tags: []
"1Krn1,21":
  text: "Hadorama, Uzala i Diklę;"
  tags: []
"1Krn1,22":
  text: "Ebala, Abimaela i Szeba;"
  tags: []
"1Krn1,23":
  text: "Ofira, Chawila i Jobaba. Wszyscy ci byli synami Joktana."
  tags: []
"1Krn1,24":
  text: "Sem, Arpachszad, Szelach;"
  tags: []
"1Krn1,25":
  text: "Eber, Peleg, Reu;"
  tags: []
"1Krn1,26":
  text: "Serug, Nachor, Terach;"
  tags: []
"1Krn1,27":
  text: "Abram, to jest Abraham."
  tags: []
"1Krn1,28":
  text: "Synowie Abrahama: Izaak i Izmael."
  tags: []
"1Krn1,29":
  text: "A oto są ich rody: pierworodny Izmaela – Nebajot, następnie Kedar, Abdeel i Mibsam;"
  tags: []
"1Krn1,30":
  text: "Miszma, Duma, Massa, Hadad i Tema;"
  tags: []
"1Krn1,31":
  text: "Jetur, Nafisz i Kedma. Byli oni synami Izmaela."
  tags: []
"1Krn1,32":
  text: "A oto synowie Ketury, nałożnicy Abrahama: urodziła ona Zimrana, Jokszana, Medana, Midiana, Jiszbaka i Szuacha. A synowie Jokszana: Szeba i Dedan."
  tags: []
"1Krn1,33":
  text: "Synowie Midiana: Efa, Efer, Henoch, Abida i Eldaa. Oni wszyscy byli synami Ketury."
  tags: []
"1Krn1,34":
  text: "I Abraham spłodził Izaaka. Synowie Izaaka: Ezaw i Izrael."
  tags: []
"1Krn1,35":
  text: "A synowie Ezawa: Elifaz, Rehuel, Jeusz, Jalam i Korach."
  tags: []
"1Krn1,36":
  text: "Synowie Elifaza: Teman, Omar, Sefo, Gatam, Kenaz, Timna i Amalek."
  tags: []
"1Krn1,37":
  text: "Synowie Rehuela: Nachat, Zerach, Szamma i Mizza."
  tags: []
"1Krn1,38":
  text: "A synowie Seira: Lotan, Szobal, Sibeon, Ana, Diszon, Eser i Diszan."
  tags: []
"1Krn1,39":
  text: "A synowie Lotana: Chori, Homam; a siostrą Lotana była Timna."
  tags: []
"1Krn1,40":
  text: "Synowie Szobala: Alian, Manachat, Ebal, Szefo i Onam. A synowie Sibeona: Ajja i Ana."
  tags: []
"1Krn1,41":
  text: "Synowie Any: Diszon. Synowie Diszona: Chamran i Eszban, Jitran i Keran."
  tags: []
"1Krn1,42":
  text: "Synowie Esera: Bilhan, Zaawan i Jaakan. Synowie Diszana: Us i Aran."
  tags: []
"1Krn1,43":
  text: "To byli królowie, którzy panowali w ziemi Edomu, zanim zapanował król nad synami Izraela: Bela, syn Beora, a jego miasto nazywało się Dinhaba."
  tags: []
"1Krn1,44":
  text: "A gdy Bela umarł, królował w jego miejsce Jobab, syn Zeracha z Bosry."
  tags: []
"1Krn1,45":
  text: "A gdy Jobab umarł, królował w jego miejsce Chuszam z ziemi Temanitów."
  tags: []
"1Krn1,46":
  text: "A gdy Chuszam umarł, królował w jego miejsce Hadad, syn Bedada, który pobił Midianitów na polu Moabu. A jego miasto nazywało się Awit."
  tags: []
"1Krn1,47":
  text: "A gdy Hadad umarł, królował w jego miejsce Samla z Masreki."
  tags: []
"1Krn1,48":
  text: "A gdy Samla umarł, królował w jego miejsce Szaul z Rechobot nad Rzeką."
  tags: []
"1Krn1,49":
  text: "A gdy Szaul umarł, królował w jego miejsce Baalchanan, syn Akbora."
  tags: []
"1Krn1,50":
  text: "A gdy Baalchanan umarł, królował w jego miejsce Hadad. Jego miasto nazywało się Pai, a jego żona miała na imię Mehetabel, była to córka Matredy, córki Mezahaba."
  tags: []
"1Krn1,51":
  text: "I Hadad umarł. A książętami Edomu byli: książę Timna, książę Alia, książę Jetet;"
  tags: []
"1Krn1,52":
  text: "Książę Oholibama, książę Ela, książę Pinon;"
  tags: []
"1Krn1,53":
  text: "Książę Kenaz, książę Teman, książę Mibsar;"
  tags: []
"1Krn1,54":
  text: "Książę Magdiel, książę Iram. Oni byli książętami Edomu."
  tags: []
