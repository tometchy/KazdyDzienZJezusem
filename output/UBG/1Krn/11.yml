"1Krn11,1":
  text: "Wtedy cały Izrael zebrał się przy Dawidzie w Hebronie, mówiąc: Oto jesteśmy twoją kością i twoim ciałem."
  tags: []
"1Krn11,2":
  text: "Już przedtem, gdy jeszcze Saul był królem, wyprowadzałeś i wprowadzałeś Izraela. I PAN, twój Bóg, powiedział ci: Ty będziesz pasł mój lud Izraela i ty będziesz wodzem nad moim ludem, Izraelem."
  tags: []
"1Krn11,3":
  text: "Przyszli więc wszyscy starsi Izraela do króla do Hebronu i Dawid zawarł z nimi przymierze w Hebronie przed PANEM. Namaścili Dawida na króla nad Izraelem zgodnie ze słowem PANA, które wypowiedział przez Samuela."
  tags: []
"1Krn11,4":
  text: "I Dawid wyruszył wraz z całym Izraelem do Jerozolimy, to jest Jebus; mieszkańcami tej ziemi byli Jebusyci."
  tags: []
"1Krn11,5":
  text: "Wtedy mieszkańcy Jebus powiedzieli do Dawida: Nie wejdziesz tutaj. Dawid jednak zdobył twierdzę Syjon, to jest miasto Dawida."
  tags: []
"1Krn11,6":
  text: "Potem Dawid powiedział: Kto pierwszy pokona Jebusytów, będzie wodzem i naczelnikiem. Wystąpił więc jako pierwszy Joab, syn Serui, i został wodzem."
  tags: []
"1Krn11,7":
  text: "I Dawid zamieszkał w twierdzy, dlatego nazwano ją miastem Dawida."
  tags: []
"1Krn11,8":
  text: "Rozbudował miasto wokoło, od Millo, a Joab odbudował resztę miasta."
  tags: []
"1Krn11,9":
  text: "A Dawid stawał się coraz potężniejszy, ponieważ PAN zastępów był z nim."
  tags: []
"1Krn11,10":
  text: "Oto naczelnicy spośród dzielnych wojowników, których miał Dawid i którzy dzielnie starali się z nim o jego królestwo wraz z całym Izraelem, aby uczynić go królem zgodnie ze słowem PANA o Izraelu."
  tags: []
"1Krn11,11":
  text: "A oto spis dzielnych wojowników, których miał Dawid: Jaszobeam, syn Chakmoniego, naczelnik dowódców. On to podniósł swoją włócznię przeciw trzystu i pobił ich za jednym razem."
  tags: []
"1Krn11,12":
  text: "Po nim Eleazar, syn Dodo, Achochita, jeden spośród trzech dzielnych."
  tags: []
"1Krn11,13":
  text: "Był on z Dawidem w Pas-Dammim, gdzie Filistyni zebrali się do walki. Było tam pole pełne jęczmienia, a lud uciekał przed Filistynami."
  tags: []
"1Krn11,14":
  text: "I stanęli na środku tego pola, obronili je i pobili Filistynów. Tak dokonał PAN wielkiego wybawienia."
  tags: []
"1Krn11,15":
  text: "A trzej spośród trzydziestu dowódców zeszli po skale do Dawida, do jaskini Adullam, podczas gdy wojsko Filistynów obozowało w dolinie Rafaim."
  tags: []
"1Krn11,16":
  text: "Dawid bowiem przebywał w tym czasie w miejscu obronnym, a załoga Filistynów znajdowała się wtedy w Betlejem."
  tags: []
"1Krn11,17":
  text: "Dawid poczuł wówczas pragnienie i powiedział: Oby ktoś dał mi się napić wody ze studni w Betlejem, która jest przy bramie!"
  tags: []
"1Krn11,18":
  text: "Wtedy ci trzej przebili się przez wojsko Filistynów i zaczerpnęli wody ze studni w Betlejem, która jest przy bramie. Zabrali ją i przynieśli do Dawida. Dawid jednak nie chciał jej pić, ale wylał ją na ofiarę dla PANA."
  tags: []
"1Krn11,19":
  text: "I powiedział: Niech PAN mnie strzeże od tego, abym miał to uczynić. Czy mam pić krew tych ludzi, którzy narażali swoje życie? Przynieśli bowiem wodę z narażeniem swego życia. I nie chciał jej pić. Tych dzieł dokonali ci trzej najdzielniejsi."
  tags: []
"1Krn11,20":
  text: "A Abiszaj, brat Joaba, stał na czele tych trzech. On to podniósł swoją włócznię przeciw trzystu i pobił ich, i miał sławę wśród tych trzech."
  tags: []
"1Krn11,21":
  text: "Wśród tych trzech był on sławniejszy od pozostałych dwóch i był ich dowódcą. Nie dorównał jednak tamtym trzem."
  tags: []
"1Krn11,22":
  text: "Benajasz, syn Jehojady, syn walecznego męża z Kabseela, który dokonał wielu czynów, zabił dwóch wojowników z Moabu. On też zszedł do jamy i zabił lwa w śnieżnym dniu."
  tags: []
"1Krn11,23":
  text: "Zabił również Egipcjanina, człowieka o wzroście pięciu łokci. Egipcjanin miał w ręku włócznię, grubą jak wał tkacki. On zaś zszedł do niego z kijem, wyrwał włócznię z ręki Egipcjanina i zabił go jego własną włócznią."
  tags: []
"1Krn11,24":
  text: "Tego dokonał Benajasz, syn Jehojady, i miał sławę wśród tych trzech dzielnych."
  tags: []
"1Krn11,25":
  text: "Wśród trzydziestu był on sławny, ale nie dorównał tamtym trzem. I Dawid postawił go na czele swojej straży przybocznej."
  tags: []
"1Krn11,26":
  text: "Dzielnymi wojownikami wojska byli: Asahel, brat Joaba, Elchanan, syn Dodo z Betlejem;"
  tags: []
"1Krn11,27":
  text: "Szammot z Harodi, Cheles Pelonita;"
  tags: []
"1Krn11,28":
  text: "Ira, syn Ikkesza, Tekoitczyk, Abiezer Anatotczyk;"
  tags: []
"1Krn11,29":
  text: "Sibbekaj Chuszatyta, Ilaj Achochita;"
  tags: []
"1Krn11,30":
  text: "Maharaj Netofatyta, Cheled, syn Baany, Netofatyta;"
  tags: []
"1Krn11,31":
  text: "Itaj, syn Ribaja, z Gibea synów Beniamina, Benajasz Piratończyk;"
  tags: []
"1Krn11,32":
  text: "Churaj z potoków Gaasz, Abiel Arbatczyk;"
  tags: []
"1Krn11,33":
  text: "Azmawet Bacharumczyk, Eliachba Szaalbończyk;"
  tags: []
"1Krn11,34":
  text: "Synowie Chaszema Gisończyka, Jonatan, syn Szagiego, Hararyta;"
  tags: []
"1Krn11,35":
  text: "Achiam, syn Sakara, Hararyta, Elifal, syn Ura;"
  tags: []
"1Krn11,36":
  text: "Chefer Mekeratyta, Achiasz Pelonita;"
  tags: []
"1Krn11,37":
  text: "Chesro Karmelita, Naaraj, syn Ezbaja;"
  tags: []
"1Krn11,38":
  text: "Joel, brat Natana, Mibchar, syn Hagriego;"
  tags: []
"1Krn11,39":
  text: "Selek Ammonita, Nacharaj Berotczyk, giermek Joaba, syna Serui;"
  tags: []
"1Krn11,40":
  text: "Ira Jitryta, Gareb Jitryta;"
  tags: []
"1Krn11,41":
  text: "Uriasz Chetyta, Zabad, syn Achlaja;"
  tags: []
"1Krn11,42":
  text: "Adina, syn Szizy, Rubenita, naczelnik Rubenitów, a wraz z nim trzydziestu;"
  tags: []
"1Krn11,43":
  text: "Chanan, syn Maaki, Joszafat Mitnita;"
  tags: []
"1Krn11,44":
  text: "Uziasz Aszteratczyk, Szama i Jejel, synowie Chotamy Aroerczyka;"
  tags: []
"1Krn11,45":
  text: "Jediael, syn Szimriego, i jego brat Jocha, Tizyta;"
  tags: []
"1Krn11,46":
  text: "Eliel Machawita, Jeribaj i Joszawiasz, synowie Elnaama, Jitma Moabita;"
  tags: []
"1Krn11,47":
  text: "Eliel, Obed i Jaasiel Mezobata."
  tags: []
