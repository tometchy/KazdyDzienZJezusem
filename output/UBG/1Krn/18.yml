"1Krn18,1":
  text: "Po tych wydarzeniach Dawid pobił Filistynów, ujarzmił ich i zabrał z ich rąk Gat i jego wioski."
  tags: []
"1Krn18,2":
  text: "Pobił też Moab i Moabici stali się sługami Dawida składającymi daninę."
  tags: []
"1Krn18,3":
  text: "Dawid pobił też Hadadezera, króla Soby w Chamat, gdy ten wyprawił się, aby rozciągnąć swoją władzę nad rzeką Eufrat."
  tags: []
"1Krn18,4":
  text: "Dawid zabrał mu wtedy tysiąc rydwanów, siedem tysięcy jeźdźców i dwadzieścia tysięcy pieszych. I popodcinał Dawid ścięgna wszystkim koniom zaprzęgowym, zostawiając z nich tylko tyle, ile potrzeba do stu rydwanów."
  tags: []
"1Krn18,5":
  text: "Kiedy Syryjczycy z Damaszku przybyli na pomoc Hadadezerowi, królowi Soby, Dawid pobił spośród nich dwadzieścia dwa tysiące ludzi."
  tags: []
"1Krn18,6":
  text: "Potem Dawid umieścił załogi w Syrii damasceńskiej, a Syryjczycy stali się sługami Dawida składającymi daninę. Tak PAN zachowywał Dawida, dokądkolwiek ten się udał."
  tags: []
"1Krn18,7":
  text: "Dawid zabrał też złote tarcze, które mieli słudzy Hadadezera, i przyniósł je do Jerozolimy."
  tags: []
"1Krn18,8":
  text: "Również z Tibchat i Kun, miast Hadadezera, Dawid zabrał bardzo dużo brązu, z którego Salomon wykonał morze brązowe, słupy i naczynia brązowe."
  tags: []
"1Krn18,9":
  text: "A gdy usłyszał Tou, król Chamatu, że Dawid pobił całe wojsko Hadadezera, króla Soby;"
  tags: []
"1Krn18,10":
  text: "Posłał swego syna Hadorama do króla Dawida, aby go pozdrowił w pokoju i aby mu powinszował tego, że walczył z Hadadezerem i pokonał go – Hadadezer bowiem prowadził wojnę z Tou – i Hadoram przyniósł ze sobą wszelkiego rodzaju naczynia złote, srebrne i brązowe."
  tags: []
"1Krn18,11":
  text: "Również i je król Dawid poświęcił PANU wraz ze srebrem i złotem, które pobrał od wszystkich narodów: od Edomu, od Moabu, od synów Ammona, od Filistynów i od Amaleka."
  tags: []
"1Krn18,12":
  text: "I Abiszaj, syn Serui, pobił w Dolinie Soli osiemnaście tysięcy Edomitów."
  tags: []
"1Krn18,13":
  text: "I umieścił w Edomie załogi, a wszyscy Edomici stali się sługami Dawida. Tak PAN zachowywał Dawida, dokądkolwiek ten się udał."
  tags: []
"1Krn18,14":
  text: "Dawid więc królował nad całym Izraelem i sprawował sąd nad całym swym ludem, i wymierzał mu sprawiedliwość."
  tags: []
"1Krn18,15":
  text: "Joab, syn Serui, był postawiony nad wojskiem, a Jehoszafat, syn Achiluda, był kronikarzem."
  tags: []
"1Krn18,16":
  text: "Sadok, syn Achituba, i Abimelek, syn Abiatara, byli kapłanami, a Szawsza był pisarzem."
  tags: []
"1Krn18,17":
  text: "Benajasz, syn Jehojady, był postawiony nad Keretytami i Peletytami, a synowie Dawida byli pierwszymi przy królu."
  tags: []
