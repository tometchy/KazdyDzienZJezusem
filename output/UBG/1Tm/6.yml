"1Tm6,1":
  text: "Wszyscy słudzy, którzy są pod jarzmem, niech uważają swych panów za godnych wszelkiej czci, aby nie bluźniono imieniu Boga i nauce."
  tags: []
"1Tm6,2":
  text: "A ci, którzy mają panów wierzących, niech ich nie lekceważą dlatego, że są braćmi, ale tym bardziej niech im służą, bo są wiernymi i umiłowanymi, uczestnikami dobrodziejstwa. Tego nauczaj i do tego zachęcaj."
  tags: []
"1Tm6,3":
  text: "Jeśli ktoś inaczej naucza i nie trzyma się zdrowych słów naszego Pana Jezusa Chrystusa i nauki zgodnej z pobożnością;"
  tags: []
"1Tm6,4":
  text: "Ten jest nadęty i nic nie wie, lecz ma chorobliwą skłonność do dociekań i sporów o słowa, z których rodzą się zawiść, spory, złorzeczenia, złośliwe podejrzenia;"
  tags: []
"1Tm6,5":
  text: "Przewrotne spory ludzi o wypaczonym umyśle, pozbawionych prawdy, którzy uważają, że pobożność jest zyskiem cielesnym. Strońcie od takich."
  tags: []
"1Tm6,6":
  text: "Wielkim zaś zyskiem jest pobożność wraz z poprzestawaniem na tym, co się ma."
  tags: []
"1Tm6,7":
  text: "Niczego bowiem nie przynieśliśmy na ten świat, z pewnością też niczego wynieść nie możemy."
  tags: []
"1Tm6,8":
  text: "Mając natomiast jedzenie i ubranie, poprzestawajmy na tym."
  tags: []
"1Tm6,9":
  text: "A ci, którzy chcą być bogaci, wpadają w pokusy i w sidła oraz w wiele głupich i szkodliwych pożądliwości, które pogrążają ludzi w zgubie i zatraceniu."
  tags: []
"1Tm6,10":
  text: "Korzeniem bowiem wszelkiego zła jest miłość do pieniędzy; niektórzy, pragnąc ich, zboczyli z drogi wiary i poprzebijali się wieloma boleściami."
  tags: []
"1Tm6,11":
  text: "Ty zaś, człowieku Boży, uciekaj od tego wszystkiego, a podążaj za sprawiedliwością, pobożnością, wiarą, miłością, cierpliwością, łagodnością."
  tags: []
"1Tm6,12":
  text: "Staczaj dobrą walkę wiary, uchwyć się życia wiecznego, do którego też zostałeś powołany i o którym złożyłeś dobre wyznanie wobec wielu świadków."
  tags: []
"1Tm6,13":
  text: "Nakazuję ci przed Bogiem, który ożywia wszystko, i przed Chrystusem Jezusem, który złożył dobre wyznanie przed Poncjuszem Piłatem;"
  tags: []
"1Tm6,14":
  text: "Abyś zachował to przykazanie bez skazy i bez zarzutu aż do objawienia się naszego Pana Jezusa Chrystusa;"
  tags: []
"1Tm6,15":
  text: "Które we właściwym czasie ukaże błogosławiony i jedyny Władca, Król królów i Pan panów;"
  tags: []
"1Tm6,16":
  text: "Jedyny mający nieśmiertelność i mieszkający w światłości niedostępnej, którego żaden z ludzi nie widział ani widzieć nie może; jemu niech będzie cześć i moc wieczna. Amen."
  tags: []
"1Tm6,17":
  text: "Bogaczom tego świata nakazuj, aby się nie wynosili i nie pokładali nadziei w niepewnym bogactwie, lecz w Bogu żywym, który nam wszystkiego obficie udziela, abyśmy z tego korzystali."
  tags: []
"1Tm6,18":
  text: "Niech innym dobrze czynią, bogacą się w dobre uczynki, chętnie dają i dzielą się z innymi;"
  tags: []
"1Tm6,19":
  text: "Gromadząc sobie skarby jako dobry fundament na przyszłość, aby uchwycić się życia wiecznego."
  tags: []
"1Tm6,20":
  text: "Tymoteuszu, strzeż tego, co ci powierzono, unikaj pospolitej, czczej gadaniny i sprzecznych twierdzeń rzekomej wiedzy;"
  tags: []
"1Tm6,21":
  text: "Którą się niektórzy szczycąc, pobłądzili w wierze. Łaska niech będzie z tobą. Amen."
  tags: []
