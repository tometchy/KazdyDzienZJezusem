"1Tm6,1": "Wszyscy słudzy, którzy są pod jarzmem, niech uważają swych panów za godnych wszelkiej czci, aby nie bluźniono imieniu Boga i nauce."
"1Tm6,2": "A ci, którzy mają panów wierzących, niech ich nie lekceważą dlatego, że są braćmi, ale tym bardziej niech im służą, bo są wiernymi i umiłowanymi, uczestnikami dobrodziejstwa. Tego nauczaj i do tego zachęcaj."
"1Tm6,3": "Jeśli ktoś inaczej naucza i nie trzyma się zdrowych słów naszego Pana Jezusa Chrystusa i nauki zgodnej z pobożnością;"
"1Tm6,4": "Ten jest nadęty i nic nie wie, lecz ma chorobliwą skłonność do dociekań i sporów o słowa, z których rodzą się zawiść, spory, złorzeczenia, złośliwe podejrzenia;"
"1Tm6,5": "Przewrotne spory ludzi o wypaczonym umyśle, pozbawionych prawdy, którzy uważają, że pobożność jest zyskiem cielesnym. Strońcie od takich."
"1Tm6,6": "Wielkim zaś zyskiem jest pobożność wraz z poprzestawaniem na tym, co się ma."
"1Tm6,7": "Niczego bowiem nie przynieśliśmy na ten świat, z pewnością też niczego wynieść nie możemy."
"1Tm6,8": "Mając natomiast jedzenie i ubranie, poprzestawajmy na tym."
"1Tm6,9": "A ci, którzy chcą być bogaci, wpadają w pokusy i w sidła oraz w wiele głupich i szkodliwych pożądliwości, które pogrążają ludzi w zgubie i zatraceniu."
"1Tm6,10": "Korzeniem bowiem wszelkiego zła jest miłość do pieniędzy; niektórzy, pragnąc ich, zboczyli z drogi wiary i poprzebijali się wieloma boleściami."
"1Tm6,11": "Ty zaś, człowieku Boży, uciekaj od tego wszystkiego, a podążaj za sprawiedliwością, pobożnością, wiarą, miłością, cierpliwością, łagodnością."
"1Tm6,12": "Staczaj dobrą walkę wiary, uchwyć się życia wiecznego, do którego też zostałeś powołany i o którym złożyłeś dobre wyznanie wobec wielu świadków."
"1Tm6,13": "Nakazuję ci przed Bogiem, który ożywia wszystko, i przed Chrystusem Jezusem, który złożył dobre wyznanie przed Poncjuszem Piłatem;"
"1Tm6,14": "Abyś zachował to przykazanie bez skazy i bez zarzutu aż do objawienia się naszego Pana Jezusa Chrystusa;"
"1Tm6,15": "Które we właściwym czasie ukaże błogosławiony i jedyny Władca, Król królów i Pan panów;"
"1Tm6,16": "Jedyny mający nieśmiertelność i mieszkający w światłości niedostępnej, którego żaden z ludzi nie widział ani widzieć nie może; jemu niech będzie cześć i moc wieczna. Amen."
"1Tm6,17": "Bogaczom tego świata nakazuj, aby się nie wynosili i nie pokładali nadziei w niepewnym bogactwie, lecz w Bogu żywym, który nam wszystkiego obficie udziela, abyśmy z tego korzystali."
"1Tm6,18": "Niech innym dobrze czynią, bogacą się w dobre uczynki, chętnie dają i dzielą się z innymi;"
"1Tm6,19": "Gromadząc sobie skarby jako dobry fundament na przyszłość, aby uchwycić się życia wiecznego."
"1Tm6,20": "Tymoteuszu, strzeż tego, co ci powierzono, unikaj pospolitej, czczej gadaniny i sprzecznych twierdzeń rzekomej wiedzy;"
"1Tm6,21": "Którą się niektórzy szczycąc, pobłądzili w wierze. Łaska niech będzie z tobą. Amen."
