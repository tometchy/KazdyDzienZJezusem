"1Tm4,1": "A Duch otwarcie mówi, że w czasach ostatecznych niektórzy odstąpią od wiary, dając posłuch zwodniczym duchom i naukom demonów;"
"1Tm4,2": "Mówiąc kłamstwo w obłudzie, mając napiętnowane sumienie;"
"1Tm4,3": "Zabraniając wstępować w związki małżeńskie, nakazując powstrzymywać się od pokarmów, które Bóg stworzył, aby je przyjmowali z dziękczynieniem wierzący i ci, którzy poznali prawdę."
"1Tm4,4": "Wszelkie bowiem stworzenie Boże jest dobre i nie należy odrzucać niczego, co się przyjmuje z dziękczynieniem."
"1Tm4,5": "Uświęcone bowiem zostaje przez słowo Boże i modlitwę."
"1Tm4,6": "Przedkładając to braciom, będziesz dobrym sługą Chrystusa Jezusa, wykarmionym słowami wiary i dobrej nauki, za którą poszedłeś."
"1Tm4,7": "Odrzucaj natomiast pospolite i babskie baśnie. Sam zaś ćwicz się w pobożności."
"1Tm4,8": "Ćwiczenie cielesne bowiem przynosi niewiele pożytku, lecz pobożność do wszystkiego jest przydatna, gdyż zawiera obietnicę życia obecnego i przyszłego."
"1Tm4,9": "Wiarygodne to słowa i godne całkowitego przyjęcia."
"1Tm4,10": "Dlatego pracujemy i jesteśmy lżeni, że pokładamy nadzieję w Bogu żywym, który jest Zbawicielem wszystkich ludzi, zwłaszcza wierzących."
"1Tm4,11": "To nakazuj i tego nauczaj."
"1Tm4,12": "Niech nikt nie lekceważy twego młodego wieku; lecz bądź dla wierzących przykładem w mowie, w postępowaniu, w miłości, w duchu, w wierze, w czystości."
"1Tm4,13": "Dopóki nie przyjdę, pilnuj czytania, zachęcania i nauki."
"1Tm4,14": "Nie zaniedbuj daru, który jest w tobie, który został ci dany przez proroctwo wraz z nałożeniem rąk starszych."
"1Tm4,15": "O tym rozmyślaj, temu się oddawaj, aby twoje postępy były widoczne dla wszystkich."
"1Tm4,16": "Pilnuj samego siebie i nauki, trwaj w tych rzeczach, bo to czyniąc, i samego siebie zbawisz, i tych, którzy cię słuchają."
