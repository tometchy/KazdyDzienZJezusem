"1Tm4,1":
  text: "A Duch otwarcie mówi, że w czasach ostatecznych niektórzy odstąpią od wiary, dając posłuch zwodniczym duchom i naukom demonów;"
  tags: []
"1Tm4,2":
  text: "Mówiąc kłamstwo w obłudzie, mając napiętnowane sumienie;"
  tags: []
"1Tm4,3":
  text: "Zabraniając wstępować w związki małżeńskie, nakazując powstrzymywać się od pokarmów, które Bóg stworzył, aby je przyjmowali z dziękczynieniem wierzący i ci, którzy poznali prawdę."
  tags: []
"1Tm4,4":
  text: "Wszelkie bowiem stworzenie Boże jest dobre i nie należy odrzucać niczego, co się przyjmuje z dziękczynieniem."
  tags: []
"1Tm4,5":
  text: "Uświęcone bowiem zostaje przez słowo Boże i modlitwę."
  tags: []
"1Tm4,6":
  text: "Przedkładając to braciom, będziesz dobrym sługą Chrystusa Jezusa, wykarmionym słowami wiary i dobrej nauki, za którą poszedłeś."
  tags: []
"1Tm4,7":
  text: "Odrzucaj natomiast pospolite i babskie baśnie. Sam zaś ćwicz się w pobożności."
  tags: []
"1Tm4,8":
  text: "Ćwiczenie cielesne bowiem przynosi niewiele pożytku, lecz pobożność do wszystkiego jest przydatna, gdyż zawiera obietnicę życia obecnego i przyszłego."
  tags: []
"1Tm4,9":
  text: "Wiarygodne to słowa i godne całkowitego przyjęcia."
  tags: []
"1Tm4,10":
  text: "Dlatego pracujemy i jesteśmy lżeni, że pokładamy nadzieję w Bogu żywym, który jest Zbawicielem wszystkich ludzi, zwłaszcza wierzących."
  tags: []
"1Tm4,11":
  text: "To nakazuj i tego nauczaj."
  tags: []
"1Tm4,12":
  text: "Niech nikt nie lekceważy twego młodego wieku; lecz bądź dla wierzących przykładem w mowie, w postępowaniu, w miłości, w duchu, w wierze, w czystości."
  tags: []
"1Tm4,13":
  text: "Dopóki nie przyjdę, pilnuj czytania, zachęcania i nauki."
  tags: []
"1Tm4,14":
  text: "Nie zaniedbuj daru, który jest w tobie, który został ci dany przez proroctwo wraz z nałożeniem rąk starszych."
  tags: []
"1Tm4,15":
  text: "O tym rozmyślaj, temu się oddawaj, aby twoje postępy były widoczne dla wszystkich."
  tags: []
"1Tm4,16":
  text: "Pilnuj samego siebie i nauki, trwaj w tych rzeczach, bo to czyniąc, i samego siebie zbawisz, i tych, którzy cię słuchają."
  tags: []
