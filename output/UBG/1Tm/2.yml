"1Tm2,1": "Zachęcam więc przede wszystkim, aby zanoszone były prośby, modlitwy, wstawiennictwa i dziękczynienia za wszystkich ludzi;"
"1Tm2,2": "Za królów i za wszystkich sprawujących władzę, abyśmy mogli prowadzić życie ciche i spokojne, z całą pobożnością i uczciwością."
"1Tm2,3": "Jest to bowiem rzecz dobra i miła w oczach Boga, naszego Zbawiciela;"
"1Tm2,4": "Który chce, aby wszyscy ludzie zostali zbawieni i doszli do poznania prawdy."
"1Tm2,5": "Jeden bowiem jest Bóg, jeden też pośrednik między Bogiem a ludźmi, człowiek Chrystus Jezus;"
"1Tm2,6": "Który wydał samego siebie na okup za wszystkich, na świadectwo we właściwym czasie."
"1Tm2,7": "Ze względu na nie zostałem ustanowiony kaznodzieją i apostołem – mówię prawdę w Chrystusie, nie kłamię – nauczycielem pogan w wierze i prawdzie."
"1Tm2,8": "Chcę więc, aby mężczyźni modlili się na każdym miejscu, podnosząc ręce czyste, bez gniewu i sporu."
"1Tm2,9": "Podobnie też kobiety niech się zdobią ubiorem przyzwoitym, ze wstydliwością i umiarem, nie z zaplatanymi włosami albo złotem, albo perłami, albo kosztownymi strojami;"
"1Tm2,10": "Lecz dobrymi uczynkami, jak przystoi kobietom, które uznają się za pobożne."
"1Tm2,11": "Kobieta niech się uczy w cichości, w pełnej uległości."
"1Tm2,12": "Nie pozwalam zaś kobiecie nauczać ani mieć władzy nad mężczyzną, lecz aby trwała w cichości."
"1Tm2,13": "Bo Adam został stworzony najpierw, potem Ewa."
"1Tm2,14": "I nie Adam został zwiedziony, lecz kobieta, gdy została zwiedziona, popadła w przestępstwo."
"1Tm2,15": "Lecz będzie zbawiona przez rodzenie dzieci, jeśli zostaną w wierze, miłości i świętości z umiarem."
