"1Tm2,1":
  text: "Zachęcam więc przede wszystkim, aby zanoszone były prośby, modlitwy, wstawiennictwa i dziękczynienia za wszystkich ludzi;"
  tags: []
"1Tm2,2":
  text: "Za królów i za wszystkich sprawujących władzę, abyśmy mogli prowadzić życie ciche i spokojne, z całą pobożnością i uczciwością."
  tags: []
"1Tm2,3":
  text: "Jest to bowiem rzecz dobra i miła w oczach Boga, naszego Zbawiciela;"
  tags: []
"1Tm2,4":
  text: "Który chce, aby wszyscy ludzie zostali zbawieni i doszli do poznania prawdy."
  tags: []
"1Tm2,5":
  text: "Jeden bowiem jest Bóg, jeden też pośrednik między Bogiem a ludźmi, człowiek Chrystus Jezus;"
  tags: []
"1Tm2,6":
  text: "Który wydał samego siebie na okup za wszystkich, na świadectwo we właściwym czasie."
  tags: []
"1Tm2,7":
  text: "Ze względu na nie zostałem ustanowiony kaznodzieją i apostołem – mówię prawdę w Chrystusie, nie kłamię – nauczycielem pogan w wierze i prawdzie."
  tags: []
"1Tm2,8":
  text: "Chcę więc, aby mężczyźni modlili się na każdym miejscu, podnosząc ręce czyste, bez gniewu i sporu."
  tags: []
"1Tm2,9":
  text: "Podobnie też kobiety niech się zdobią ubiorem przyzwoitym, ze wstydliwością i umiarem, nie z zaplatanymi włosami albo złotem, albo perłami, albo kosztownymi strojami;"
  tags: []
"1Tm2,10":
  text: "Lecz dobrymi uczynkami, jak przystoi kobietom, które uznają się za pobożne."
  tags: []
"1Tm2,11":
  text: "Kobieta niech się uczy w cichości, w pełnej uległości."
  tags: []
"1Tm2,12":
  text: "Nie pozwalam zaś kobiecie nauczać ani mieć władzy nad mężczyzną, lecz aby trwała w cichości."
  tags: []
"1Tm2,13":
  text: "Bo Adam został stworzony najpierw, potem Ewa."
  tags: []
"1Tm2,14":
  text: "I nie Adam został zwiedziony, lecz kobieta, gdy została zwiedziona, popadła w przestępstwo."
  tags: []
"1Tm2,15":
  text: "Lecz będzie zbawiona przez rodzenie dzieci, jeśli zostaną w wierze, miłości i świętości z umiarem."
  tags: []
