"1Tm1,1":
  text: "Paweł, apostoł Jezusa Chrystusa według nakazu Boga, naszego Zbawiciela, i Pana Jezusa Chrystusa, który jest naszą nadzieją;"
  tags: []
"1Tm1,2":
  text: "Do Tymoteusza, mego własnego syna w wierze. Łaska, miłosierdzie i pokój od Boga, naszego Ojca, i Chrystusa Jezusa, naszego Pana."
  tags: []
"1Tm1,3":
  text: "Jak cię prosiłem, gdy wybierałem się do Macedonii, byś pozostał w Efezie, tak teraz proszę, abyś nakazał niektórym, żeby inaczej nie nauczali;"
  tags: []
"1Tm1,4":
  text: "I nie zajmowali się baśniami i niekończącymi się rodowodami, które wywołują raczej spory niż zbudowanie Boże, które oparte jest na wierze."
  tags: []
"1Tm1,5":
  text: "Końcem zaś przykazania jest miłość płynąca z czystego serca, z prawego sumienia i wiary nieobłudnej;"
  tags: []
"1Tm1,6":
  text: "Od czego niektórzy odstąpili i zwrócili się ku czczej gadaninie;"
  tags: []
"1Tm1,7":
  text: "Chcąc być nauczycielami prawa, nie rozumiejąc ani tego, co mówią, ani tego, co stanowczo twierdzą."
  tags: []
"1Tm1,8":
  text: "Wiemy zaś, że prawo jest dobre, jeśli ktoś je właściwie stosuje."
  tags: []
"1Tm1,9":
  text: "Rozumiemy, że prawo nie jest ustanowione dla sprawiedliwego, ale dla nieprawych i nieposłusznych, dla bezbożnych i grzeszników, dla niegodziwych i nieczystych, dla ojcobójców, matkobójców i morderców;"
  tags: []
"1Tm1,10":
  text: "Dla rozpustników, mężczyzn współżyjących ze sobą, handlarzy ludźmi, dla kłamców, krzywoprzysięzców i dla wszystkiego, co jest przeciwne zdrowej nauce;"
  tags: []
"1Tm1,11":
  text: "Zgodnie z chwalebną ewangelią błogosławionego Boga, którą mi powierzono."
  tags: []
"1Tm1,12":
  text: "Dziękuję więc temu, który mnie umocnił, Chrystusowi Jezusowi, naszemu Panu, że uznał mnie za wiernego, przeznaczając mnie do posługi;"
  tags: []
"1Tm1,13":
  text: "Mnie, który przedtem byłem bluźniercą, prześladowcą i gnębicielem, ale dostąpiłem miłosierdzia, bo czyniłem to nieświadomie, w niewierze."
  tags: []
"1Tm1,14":
  text: "A łaska naszego Pana stała się bardzo obfita wraz z wiarą i miłością, która jest w Chrystusie Jezusie."
  tags: []
"1Tm1,15":
  text: "Wiarygodne to słowa i godne całkowitego przyjęcia, że Chrystus Jezus przyszedł na świat, aby zbawić grzeszników, z których ja jestem pierwszy."
  tags: []
"1Tm1,16":
  text: "Lecz dostąpiłem miłosierdzia po to, aby we mnie pierwszym Jezus Chrystus okazał wszelką cierpliwość jako przykład dla tych, którzy mają w niego uwierzyć ku życiu wiecznemu."
  tags: []
"1Tm1,17":
  text: "A Królowi wieków, nieśmiertelnemu, niewidzialnemu, jedynemu mądremu Bogu niech będzie cześć i chwała na wieki wieków. Amen."
  tags: []
"1Tm1,18":
  text: "Ten nakaz daję tobie, synu Tymoteuszu, według wcześniej wygłoszonych o tobie proroctw, abyś toczył zgodnie z nimi dobry bój;"
  tags: []
"1Tm1,19":
  text: "Mając wiarę i czyste sumienie, które niektórzy odrzucili i stali się rozbitkami w wierze."
  tags: []
"1Tm1,20":
  text: "Do nich należą Hymenajos i Aleksander, których oddałem szatanowi, aby nauczyli się nie bluźnić."
  tags: []
