"1Tm3,1": "Wiarygodne to słowa: Jeśli ktoś pragnie biskupstwa, pragnie dobrej pracy."
"1Tm3,2": "Biskup więc ma być nienaganny, mąż jednej żony, czujny, trzeźwy, przyzwoity, gościnny, zdolny do nauczania;"
"1Tm3,3": "Nieoddający się piciu wina, nieskłonny do bicia, niełakomy na brudny zysk, ale opanowany, niekłótliwy, niechciwy;"
"1Tm3,4": "Dobrze rządzący własnym domem, trzymający dzieci w posłuszeństwie i wszelkim szacunku;"
"1Tm3,5": "Jeśli bowiem ktoś nie umie rządzić własnym domem, jakże będzie mógł troszczyć się o kościół Boży?"
"1Tm3,6": "Nie nowicjusz, żeby nie wbił się w pychę i nie wpadł w potępienie diabelskie."
"1Tm3,7": "Musi też mieć dobre świadectwo od tych, którzy są na zewnątrz, żeby nie ściągał na siebie hańby i nie wpadł w sidła diabła."
"1Tm3,8": "Diakoni także mają być poważni, niedwulicowi, nienadużywający wina, niełakomi na brudny zysk;"
"1Tm3,9": "Zachowujący tajemnicę wiary w czystym sumieniu."
"1Tm3,10": "I niech będą najpierw wypróbowani, a potem niech służą, jeśli są nienaganni."
"1Tm3,11": "Ich żony także niech będą poważne, nierzucające oszczerstw, trzeźwe, wierne we wszystkim."
"1Tm3,12": "Diakoni niech będą mężami jednej żony, rządzący dobrze dziećmi i własnymi domami."
"1Tm3,13": "Ci bowiem, którzy dobrze pełnią służbę, zyskują sobie zaszczytny stopień i wielką śmiałość w wierze, która jest w Chrystusie Jezusie."
"1Tm3,14": "Piszę ci to, mając nadzieję, że wkrótce przybędę do ciebie."
"1Tm3,15": "A gdybym się opóźniał, piszę, abyś wiedział, jak należy postępować w domu Bożym, który jest kościołem Boga żywego, filarem i podporą prawdy."
"1Tm3,16": "A bez wątpienia wielka jest tajemnica pobożności: Bóg objawiony został w ciele, usprawiedliwiony w Duchu, widziany był przez anioły, głoszony był poganom, uwierzono mu na świecie, wzięty został w górę do chwały."
