"1Tm3,1":
  text: "Wiarygodne to słowa: Jeśli ktoś pragnie biskupstwa, pragnie dobrej pracy."
  tags: []
"1Tm3,2":
  text: "Biskup więc ma być nienaganny, mąż jednej żony, czujny, trzeźwy, przyzwoity, gościnny, zdolny do nauczania;"
  tags: []
"1Tm3,3":
  text: "Nieoddający się piciu wina, nieskłonny do bicia, niełakomy na brudny zysk, ale opanowany, niekłótliwy, niechciwy;"
  tags: []
"1Tm3,4":
  text: "Dobrze rządzący własnym domem, trzymający dzieci w posłuszeństwie i wszelkim szacunku;"
  tags: []
"1Tm3,5":
  text: "Jeśli bowiem ktoś nie umie rządzić własnym domem, jakże będzie mógł troszczyć się o kościół Boży?"
  tags: []
"1Tm3,6":
  text: "Nie nowicjusz, żeby nie wbił się w pychę i nie wpadł w potępienie diabelskie."
  tags: []
"1Tm3,7":
  text: "Musi też mieć dobre świadectwo od tych, którzy są na zewnątrz, żeby nie ściągał na siebie hańby i nie wpadł w sidła diabła."
  tags: []
"1Tm3,8":
  text: "Diakoni także mają być poważni, niedwulicowi, nienadużywający wina, niełakomi na brudny zysk;"
  tags: []
"1Tm3,9":
  text: "Zachowujący tajemnicę wiary w czystym sumieniu."
  tags: []
"1Tm3,10":
  text: "I niech będą najpierw wypróbowani, a potem niech służą, jeśli są nienaganni."
  tags: []
"1Tm3,11":
  text: "Ich żony także niech będą poważne, nierzucające oszczerstw, trzeźwe, wierne we wszystkim."
  tags: []
"1Tm3,12":
  text: "Diakoni niech będą mężami jednej żony, rządzący dobrze dziećmi i własnymi domami."
  tags: []
"1Tm3,13":
  text: "Ci bowiem, którzy dobrze pełnią służbę, zyskują sobie zaszczytny stopień i wielką śmiałość w wierze, która jest w Chrystusie Jezusie."
  tags: []
"1Tm3,14":
  text: "Piszę ci to, mając nadzieję, że wkrótce przybędę do ciebie."
  tags: []
"1Tm3,15":
  text: "A gdybym się opóźniał, piszę, abyś wiedział, jak należy postępować w domu Bożym, który jest kościołem Boga żywego, filarem i podporą prawdy."
  tags: []
"1Tm3,16":
  text: "A bez wątpienia wielka jest tajemnica pobożności: Bóg objawiony został w ciele, usprawiedliwiony w Duchu, widziany był przez anioły, głoszony był poganom, uwierzono mu na świecie, wzięty został w górę do chwały."
  tags: []
