"2Krn28,1":
  text: "Achaz miał dwadzieścia lat, kiedy zaczął królować, i królował szesnaście lat w Jerozolimie. Nie czynił jednak tego, co prawe w oczach PANA, jak jego ojciec Dawid."
  tags: []
"2Krn28,2":
  text: "Chodził raczej drogami królów Izraela i sporządził lane posągi dla Baalów."
  tags: []
"2Krn28,3":
  text: "Palił też kadzidło w dolinie syna Hinnom i spalił swoich synów w ogniu, naśladując obrzydliwości pogan, których PAN wygnał przed synami Izraela."
  tags: []
"2Krn28,4":
  text: "Składał także ofiary i palił kadzidło na wyżynach, na wzgórzach i pod każdym zielonym drzewem."
  tags: []
"2Krn28,5":
  text: "Dlatego PAN, jego Bóg, wydał go w ręce króla Syrii. Pokonali go i uprowadzili z jego ludu wielu więźniów, i przyprowadzili ich do Damaszku. Został też wydany w ręce króla Izraela, który zadał mu wielką klęskę."
  tags: []
"2Krn28,6":
  text: "Pekach, syn Remaliasza, zabił bowiem w Judzie jednego dnia sto dwadzieścia tysięcy samych dzielnych wojowników, ponieważ opuścili PANA, Boga swoich ojców."
  tags: []
"2Krn28,7":
  text: "I Zikri, wojownik z Efraima, zabił Maasejasza, syna króla, Azrikama, przełożonego jego domu, oraz Elkanę, zastępcę króla."
  tags: []
"2Krn28,8":
  text: "Synowie Izraela wzięli też do niewoli spośród ich braci dwieście tysięcy kobiet, synów i córek, zabrali od nich bardzo dużo łupów i uprowadzili całą zdobycz do Samarii."
  tags: []
"2Krn28,9":
  text: "A był tam prorok PANA o imieniu Obed, który wyszedł naprzeciw wojska, kiedy wracało do Samarii, i powiedział im: Oto PAN, Bóg waszych ojców, rozgniewał się na Judę i wydał ich w wasze ręce, a wy ich wymordowaliście z wściekłością, która dosięgła aż nieba."
  tags: []
"2Krn28,10":
  text: "A teraz chcecie jeszcze podbić lud z Judy i z Jerozolimy i uczynić z niego niewolników i niewolnice. Czy sami nie macie grzechów wobec PANA, waszego Boga?"
  tags: []
"2Krn28,11":
  text: "Teraz więc posłuchajcie mnie i odeślijcie jeńców, których uprowadziliście spośród waszych braci, gdyż zapalczywość gniewu PANA wisi nad wami."
  tags: []
"2Krn28,12":
  text: "Wtedy niektórzy z naczelników spośród synów Efraima: Azariasz, syn Jochanana, Berechiasz, syn Meszillemota, Ezechiasz, syn Szalluma, i Amasa, syn Chadlaja, wystąpili przeciwko tym, którzy wracali z wojny."
  tags: []
"2Krn28,13":
  text: "I powiedzieli do nich: Nie wprowadzajcie tutaj tych jeńców, gdyż będzie to grzechem wobec PANA, którym zamierzacie nas obciążyć, dołączając go do naszych występków. Wielki bowiem jest nasz grzech i zapalczywość gniewu ciąży nad Izraelem."
  tags: []
"2Krn28,14":
  text: "Wojsko więc pozostawiło jeńców i łupy przed książętami i całym zgromadzeniem."
  tags: []
"2Krn28,15":
  text: "A mężczyźni, którzy zostali wyznaczeni imiennie, wystąpili i zajęli się jeńcami: korzystając z łupów, przyodziali wszystkich nagich, ubrali ich, dali im obuwie, nakarmili ich i napoili, i namaścili, a słabych odprowadzili na osłach. Wtedy przyprowadzili ich do Jerycha, miasta palm, do ich braci. Potem wrócili do Samarii."
  tags: []
"2Krn28,16":
  text: "W tym czasie król Achaz posłał do królów Asyrii prośbę o pomoc."
  tags: []
"2Krn28,17":
  text: "Znowu bowiem Edomici nadciągnęli, pobili Judę i uprowadzili jeńców."
  tags: []
"2Krn28,18":
  text: "Ponadto Filistyni wtargnęli do miast na równinach i na południu Judy i zdobyli Bet-Szemesz, Ajjalon, Gederot, Soko i podległe im miejscowości oraz Timnę i Gimzo z podległymi im miejscowościami i tam zamieszkali."
  tags: []
"2Krn28,19":
  text: "PAN bowiem poniżył Judę z powodu Achaza, króla Izraela, gdyż obnażył on Judę i przewrotnie zgrzeszył wobec PANA."
  tags: []
"2Krn28,20":
  text: "I przybył do niego Tiglat-Pileser, król Asyrii, który go raczej ucisnął, niż wspomógł."
  tags: []
"2Krn28,21":
  text: "Bo choć Achaz wziął skarby z domu PANA, z domu królewskiego oraz od książąt i dał to królowi Asyrii, ten go nie wspomógł."
  tags: []
"2Krn28,22":
  text: "A w czasie największego ucisku król Achaz grzeszył jeszcze bardziej przeciwko PANU. Taki to był król Achaz."
  tags: []
"2Krn28,23":
  text: "Składał bowiem ofiary bogom z Damaszku, którzy go pokonali, i mówił: Ponieważ bogowie królów Syrii wspomagają ich, będę im składał ofiary, aby i mnie wspomagali. Ale oni stali się przyczyną upadku dla niego i całego Izraela."
  tags: []
"2Krn28,24":
  text: "Achaz zabrał naczynia z domu Bożego i pokruszył je. Zamknął też bramy domu PANA i pobudował sobie ołtarze po wszystkich zaułkach Jerozolimy."
  tags: []
"2Krn28,25":
  text: "W każdym mieście Judy ustanowił wyżyny, aby tam palono kadzidło innym bogom, i pobudził do gniewu PANA, Boga swoich ojców."
  tags: []
"2Krn28,26":
  text: "A pozostałe jego dzieje i wszystkie jego drogi, od pierwszych do ostatnich, są zapisane w księdze królów Judy i Izraela."
  tags: []
"2Krn28,27":
  text: "I Achaz zasnął ze swoimi ojcami, i pogrzebali go w mieście w Jerozolimie. Ale nie wprowadzili do grobów królów Izraela. A Ezechiasz, jego syn, królował w jego miejsce."
  tags: []
