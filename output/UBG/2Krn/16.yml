"2Krn16,1":
  text: "W trzydziestym szóstym roku panowania Asy nadciągnął przeciw Judzie Basza, król Izraela, i zbudował Rama, aby nikt nie mógł wychodzić od Asy, króla Judy, i wchodzić do niego."
  tags: []
"2Krn16,2":
  text: "Wtedy Asa wziął srebro i złoto ze skarbców domu PANA i domu królewskiego i posłał je do Ben-Hadada, króla Syrii, który mieszkał w Damaszku, mówiąc:"
  tags: []
"2Krn16,3":
  text: "Trwa przymierze między mną a tobą, jak było między moim ojcem a twoim ojcem. Oto posyłam ci srebro i złoto. Idź i zerwij swoje przymierze z Baszą, królem Izraela, aby odstąpił ode mnie."
  tags: []
"2Krn16,4":
  text: "I Ben-Hadad posłuchał króla Asy, i posłał dowódców swoich wojsk przeciwko miastom Izraela. Uderzyli na Ijjon, Dan i Abelmaim oraz wszystkie miasta spichlerze Neftalego."
  tags: []
"2Krn16,5":
  text: "Kiedy Basza o tym usłyszał, przestał budować Rama i przerwał swoje roboty."
  tags: []
"2Krn16,6":
  text: "Wtedy król Asa wziął ze sobą cały lud Judy i zabrali z Rama kamienie i drewno, z którego budował Basza, a zbudował z niego Geba i Mispę."
  tags: []
"2Krn16,7":
  text: "A w tym czasie widzący Chanani przyszedł do Asy, króla Judy, i powiedział mu: Ponieważ polegałeś na królu Syrii, a nie na PANU, swoim Bogu, wojsko króla Syrii uszło ci z ręki."
  tags: []
"2Krn16,8":
  text: "Czyż Etiopczycy i Libijczycy nie mieli ogromnego wojska z mnóstwem rydwanów i jeźdźców? A jednak, ponieważ polegałeś na PANU, oddał ich w twoją rękę."
  tags: []
"2Krn16,9":
  text: "Oczy PANA przebiegają bowiem całą ziemię, aby pokazywał on swoją moc dla tych, których serce jest doskonałe wobec niego. Głupio postąpiłeś; z tego powodu odtąd będziesz miał wojny."
  tags: []
"2Krn16,10":
  text: "Wtedy Asa rozgniewał się na widzącego i wtrącił go do więzienia, bo był tym wzburzony. W tym czasie Asa uciskał także niektórych z ludu."
  tags: []
"2Krn16,11":
  text: "Ale pozostałe dzieje Asy, od pierwszych do ostatnich, są zapisane w księdze królów Judy i Izraela."
  tags: []
"2Krn16,12":
  text: "I w trzydziestym dziewiątym roku swojego panowania Asa rozchorował się na nogi, a choroba była bardzo ciężka. Jednak w swojej chorobie nie szukał PANA, lecz lekarzy."
  tags: []
"2Krn16,13":
  text: "I tak Asa zasnął ze swoimi ojcami, i umarł w czterdziestym pierwszym roku swojego panowania."
  tags: []
"2Krn16,14":
  text: "I pogrzebano go w jego grobie, który sobie przygotował w mieście Dawida. Położono go na łożu wypełnionym wonnościami i rozmaitymi maściami przygotowanymi według sztuki aptekarskiej. I rozpalono mu wielki ogień."
  tags: []
