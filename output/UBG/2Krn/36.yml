"2Krn36,1":
  text: "Wtedy lud ziemi wziął Jehoachaza, syna Jozjasza, i ustanowił go królem w miejsce jego ojca w Jerozolimie."
  tags: []
"2Krn36,2":
  text: "Jehoachaz miał dwadzieścia trzy lata, kiedy zaczął królować, i królował trzy miesiące w Jerozolimie."
  tags: []
"2Krn36,3":
  text: "Król Egiptu usunął go z tronu w Jerozolimie i nałożył na ziemię daninę w wysokości stu talentów srebra i jednego talentu złota."
  tags: []
"2Krn36,4":
  text: "Potem król Egiptu ustanowił Eliakima, jego brata, królem nad Judą i Jerozolimą i zmienił jego imię na Joakim. A jego brata Jehoachaza Necho pojmał i uprowadził do Egiptu."
  tags: []
"2Krn36,5":
  text: "Joakim miał dwadzieścia pięć lat, kiedy zaczął królować, i królował jedenaście lat w Jerozolimie. Czynił on to, co złe w oczach PANA, swego Boga."
  tags: []
"2Krn36,6":
  text: "Nadciągnął przeciw niemu Nabuchodonozor, król Babilonu, i związał go łańcuchami, aby go uprowadzić do Babilonu."
  tags: []
"2Krn36,7":
  text: "Nabuchodonozor zabrał też do Babilonu część naczyń z domu PANA i złożył je w swojej świątyni w Babilonie."
  tags: []
"2Krn36,8":
  text: "A pozostałe dzieje Joakima i obrzydliwości, które czynił, i cokolwiek się znajdowało w nim, są zapisane w księdze królów Izraela i Judy. A jego syn Joachin królował w jego miejsce."
  tags: []
"2Krn36,9":
  text: "Joachin miał osiem lat, kiedy zaczął królować, i królował trzy miesiące i dziesięć dni w Jerozolimie. Czynił on to, co złe w oczach PANA."
  tags: []
"2Krn36,10":
  text: "Na początku roku król Nabuchodonozor posłał po niego i kazał go przyprowadzić do Babilonu, razem z kosztownymi naczyniami domu PANA, a królem nad Judą i Jerozolimą ustanowił jego brata Sedekiasza."
  tags: []
"2Krn36,11":
  text: "Sedekiasz miał dwadzieścia jeden lat, kiedy zaczął królować, i królował jedenaście lat w Jerozolimie."
  tags: []
"2Krn36,12":
  text: "Czynił on to, co złe w oczach PANA, swego Boga, i nie ukorzył się przed prorokiem Jeremiaszem, który mówił z ust PANA."
  tags: []
"2Krn36,13":
  text: "Zbuntował się również przeciwko królowi Nabuchodonozorowi, który go zaprzysiągł na Boga. Uczynił twardym swój kark i zatwardził swoje serce, aby się nie nawrócić do PANA, Boga Izraela."
  tags: []
"2Krn36,14":
  text: "Również wszyscy przedniejsi kapłani oraz lud bardzo mnożyli nieprawości, naśladując wszystkie obrzydliwości pogan, i zbezcześcili dom PANA, który on poświęcił w Jerozolimie."
  tags: []
"2Krn36,15":
  text: "A PAN, Bóg ich ojców, posyłał do nich swoich posłańców, a posyłał, wstając rankiem, ponieważ litował się nad swoim ludem i nad miejscem swego przybytku."
  tags: []
"2Krn36,16":
  text: "Ale oni szydzili z posłańców Boga, lekceważyli sobie jego słowa i naśmiewali się z jego proroków, aż gniew PANA na jego lud wzmógł się tak, że nie było już żadnego ratunku."
  tags: []
"2Krn36,17":
  text: "Sprowadził więc na nich króla Chaldejczyków, który zabił mieczem ich młodzieńców w domu ich świątyni, a nie zlitował się nad młodzieńcem ani panną, ani starcem, ani sędziwym. Wydał wszystkich w jego ręce."
  tags: []
"2Krn36,18":
  text: "Wszystkie naczynia domu Bożego, wielkie i małe, skarby domu PANA i skarby królewskie, i jego książąt, wszystko to wywiózł do Babilonu."
  tags: []
"2Krn36,19":
  text: "Potem spalili dom Boży i zburzyli mur Jerozolimy; wszystkie jej pałace spalili ogniem i wszystkie jej kosztowne naczynia zniszczyli."
  tags: []
"2Krn36,20":
  text: "A tych, którzy ocaleli od miecza, król uprowadził do Babilonu, tam byli niewolnikami jego i jego synów aż do panowania króla Persji;"
  tags: []
"2Krn36,21":
  text: "Żeby wypełniło się słowo PANA wypowiedziane przez usta Jeremiasza, dopóki ziemia nie odprawiła swoich szabatów. Dopóki bowiem ziemia leżała odłogiem, wypełniła szabaty, aż się wypełniło siedemdziesiąt lat."
  tags: []
"2Krn36,22":
  text: "A w pierwszym roku Cyrusa, króla Persji – żeby wypełniło się słowo PANA wypowiedziane przez usta Jeremiasza – PAN wzbudził ducha Cyrusa, króla Persji, aby nakazał ogłosić i rozpisać po całym swoim królestwie, co następuje:"
  tags: []
"2Krn36,23":
  text: "Tak mówi Cyrus, król Persji: Wszystkie królestwa ziemi dał mi PAN, Bóg nieba, i on rozkazał mi, abym mu zbudował dom w Jerozolimie, która jest w Judzie. Kto z całego jego ludu jest wśród was, niech PAN, jego Bóg, będzie z nim, i ten niech wyrusza w drogę."
  tags: []
