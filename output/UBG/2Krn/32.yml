"2Krn32,1":
  text: "Po tych sprawach oraz ich ustanowieniu nadciągnął Sennacheryb, król Asyrii, wkroczył do Judy, rozbił obóz naprzeciwko warownych miast i zamierzał je zdobyć dla siebie."
  tags: []
"2Krn32,2":
  text: "Gdy Ezechiasz zobaczył, że nadciągnął Sennacheryb i że ma zamiar walczyć przeciw Jerozolimie;"
  tags: []
"2Krn32,3":
  text: "Naradzał się ze swoimi książętami i wojownikami, aby zatkać źródła wód, które były za miastem, a oni pomogli mu."
  tags: []
"2Krn32,4":
  text: "Zebrał się więc wielki lud, który zatkał wszystkie źródła oraz potok płynący przez środek ziemi, mówiąc: Czemu nadciągający królowie Asyrii mieliby znaleźć tak wiele wody?"
  tags: []
"2Krn32,5":
  text: "Pokrzepił się i odbudował cały zburzony mur, wznosząc go aż do wież, do tego drugi zewnętrzny mur. Umocnił także Millo w mieście Dawida i sporządził wiele włóczni oraz tarcz."
  tags: []
"2Krn32,6":
  text: "Ustanowił też dowódców wojska nad ludem, których zgromadził przy sobie na placu bramy miejskiej, i mówił do nich łagodnie:"
  tags: []
"2Krn32,7":
  text: "Umacniajcie się i bądźcie mężni, nie bójcie się ani nie lękajcie widoku króla Asyrii ani widoku całego mnóstwa, które jest z nim. Więcej bowiem jest z nami aniżeli z nim."
  tags: []
"2Krn32,8":
  text: "Z nim jest ramię cielesne, lecz z nami jest PAN, nasz Bóg, aby nam pomóc, ratować nas i prowadzić nasze wojny. Lud więc zaufał słowom Ezechiasza, króla Judy."
  tags: []
"2Krn32,9":
  text: "Potem Sennacheryb, król Asyrii, podczas gdy zdobywał Lakisz wraz z całym swoim wojskiem, posłał swoje sługi do Jerozolimy, do Ezechiasza, króla Judy, oraz do wszystkich z Judy, którzy byli w Jerozolimie, aby oznajmić:"
  tags: []
"2Krn32,10":
  text: "Tak mówi Sennacheryb, król Asyrii: W czym pokładacie swoją ufność, że pozostajecie w oblężonej Jerozolimie?"
  tags: []
"2Krn32,11":
  text: "Czy Ezechiasz nie zwodzi was, abyście wydali siebie na śmierć z głodu i pragnienia, mówiąc: PAN, nasz Bóg, wybawi nas z ręki króla Asyrii?"
  tags: []
"2Krn32,12":
  text: "Czy to nie ten Ezechiasz zniósł jego wyżyny i ołtarze, po czym rozkazał Judzie i Jerozolimie: Przed jednym tylko ołtarzem będziecie oddawać pokłon i na nim palić kadzidło?"
  tags: []
"2Krn32,13":
  text: "Czy nie wiecie, co ja i moi ojcowie uczyniliśmy wszystkim ludom innych ziem? Czyż bogowie narodów tych ziem mogli w jakiś sposób wyrwać ich ziemie z mojej ręki?"
  tags: []
"2Krn32,14":
  text: "Kto spośród wszystkich bogów tych narodów, które moi ojcowie wytracili, mógł wybawić swój lud z mojej ręki, aby też wasz Bóg mógł wyrwać was z mojej ręki?"
  tags: []
"2Krn32,15":
  text: "Teraz więc nie dajcie się zwodzić Ezechiaszowi i niech was nie łudzi w ten sposób ani mu nie wierzcie, gdyż żaden bóg spośród wszystkich narodów i królestw nie mógł wyrwać swego ludu z mojej ręki i z ręki moich ojców. Tym bardziej wasz Bóg nie wyrwie was z mojej ręki!"
  tags: []
"2Krn32,16":
  text: "Jego słudzy jeszcze więcej mówili przeciw PANU Bogu i przeciwko jego słudze Ezechiaszowi."
  tags: []
"2Krn32,17":
  text: "Napisał też listy, aby znieważać PANA, Boga Izraela, mówiąc przeciwko niemu tymi słowami: Jak bogowie narodów innych ziem nie wyrwali swego ludu z mojej ręki, tak Bóg Ezechiasza nie wyrwie swego ludu z mojej ręki."
  tags: []
"2Krn32,18":
  text: "Potem wołali donośnym głosem w języku hebrajskim do ludu Jerozolimy, który był na murze, aby go przestraszyć i przerazić, i tak zdobyć miasto."
  tags: []
"2Krn32,19":
  text: "A mówili o Bogu Jerozolimy jak o bogach narodów ziemi, którzy są dziełem rąk ludzkich."
  tags: []
"2Krn32,20":
  text: "Z tego powodu król Ezechiasz i prorok Izajasz, syn Amosa, modlili się i wołali do nieba."
  tags: []
"2Krn32,21":
  text: "I PAN posłał Anioła, który wytracił wszystkich dzielnych wojowników, dowódców i naczelników w obozie króla Asyrii. Okryty wstydem, wrócił on do swojej ziemi. A gdy wszedł do domu swojego boga, ci, którzy wyszli z jego bioder, zabili go tam mieczem."
  tags: []
"2Krn32,22":
  text: "Tak więc PAN wybawił Ezechiasza i mieszkańców Jerozolimy z rąk Sennacheryba, króla Asyrii, i z rąk wszystkich innych wrogów, i zapewnił im pokój ze wszystkich stron."
  tags: []
"2Krn32,23":
  text: "Wtedy wielu przynosiło PANU ofiary do Jerozolimy oraz kosztowne dary dla Ezechiasza, króla Judy. A od tego czasu był wielce poważany w oczach wszystkich narodów."
  tags: []
"2Krn32,24":
  text: "W tych dniach Ezechiasz śmiertelnie zachorował. Modlił się do PANA, a on przemówił do niego i dał mu znak."
  tags: []
"2Krn32,25":
  text: "Ezechiasz jednak nie odwdzięczył się za dobrodziejstwa, które zostały mu wyświadczone, gdyż jego serce uniosło się pychą. Dlatego powstał gniew przeciw niemu i przeciw Judzie oraz Jerozolimie."
  tags: []
"2Krn32,26":
  text: "Ale Ezechiasz ukorzył się za wyniosłość swojego serca – on i mieszkańcy Jerozolimy – i nie spadł na nich gniew PANA za dni Ezechiasza."
  tags: []
"2Krn32,27":
  text: "Ezechiasz posiadał bardzo dużo bogactwa i wielką sławę. Uczynił sobie skarbce na srebro i złoto, drogie kamienie, wonności, tarcze oraz wszelkie kosztowne przedmioty."
  tags: []
"2Krn32,28":
  text: "Miał też spichlerze na zbiory zboża, wina i oliwy, obory dla wszelkiego gatunku bydła i zagrody dla trzód."
  tags: []
"2Krn32,29":
  text: "Pobudował sobie miasta i miał liczne stada owiec i wołów, gdyż Bóg dał mu wielki majątek."
  tags: []
"2Krn32,30":
  text: "To właśnie Ezechiasz zatkał źródło wód w górnym Gichonie i przeprowadził je dołem po zachodniej stronie miasta Dawida. I powodziło się Ezechiaszowi we wszystkich jego działaniach."
  tags: []
"2Krn32,31":
  text: "Jednak z powodu posłów książąt Babilonu wysłanych do niego, aby dowiedzieć się o znaku, który się wydarzył w ziemi, opuścił go Bóg, aby wystawić go na próbę i poznać wszystko, co było w jego sercu."
  tags: []
"2Krn32,32":
  text: "Ale pozostałe dzieje Ezechiasza i jego życzliwość są zapisane w widzeniu proroka Izajasza, syna Amosa, i w księdze królów Judy i Izraela."
  tags: []
"2Krn32,33":
  text: "I Ezechiasz zasnął ze swoimi ojcami, i został pogrzebany w najlepszych grobach synów Dawida. A po śmierci cała Juda oraz mieszkańcy Jerozolimy złożyli mu hołd. I jego syn Manasses królował w jego miejsce."
  tags: []
