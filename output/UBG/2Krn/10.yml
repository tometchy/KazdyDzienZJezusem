"2Krn10,1":
  text: "Roboam udał się do Sychem, gdyż do Sychem przybył cały Izrael, aby ustanowić go królem."
  tags: []
"2Krn10,2":
  text: "A gdy usłyszał o tym Jeroboam, syn Nebata, który był w Egipcie, dokąd uciekł przed królem Salomonem, wrócił z Egiptu;"
  tags: []
"2Krn10,3":
  text: "Wtedy posłano po niego i wezwano go. Przyszedł więc Jeroboam wraz z całym Izraelem i powiedzieli do Roboama:"
  tags: []
"2Krn10,4":
  text: "Twój ojciec włożył na nas ciężkie jarzmo. Teraz więc ty ulżyj nam w srogiej niewoli swego ojca i w ciężkim jarzmie, które włożył na nas, a będziemy ci służyć."
  tags: []
"2Krn10,5":
  text: "Odpowiedział im: Wróćcie do mnie po trzech dniach. I lud odszedł."
  tags: []
"2Krn10,6":
  text: "Wtedy król Roboam radził się starszych, którzy stawali przed Salomonem, jego ojcem, gdy jeszcze żył, pytając: Jaką odpowiedź radzicie dać temu ludowi?"
  tags: []
"2Krn10,7":
  text: "Odpowiedzieli mu: Jeśli będziesz dla tego ludu dobry, okażesz im życzliwość i będziesz mówił do nich łagodne słowa, to będą twoimi sługami przez wszystkie dni."
  tags: []
"2Krn10,8":
  text: "Ale on odrzucił radę starszych, którą mu dali, i radził się młodzieńców, którzy razem z nim wzrośli i stawali przed nim."
  tags: []
"2Krn10,9":
  text: "I zapytał ich: A co wy radzicie odpowiedzieć temu ludowi, który poprosił mnie: Ulżyj nam w jarzmie, które włożył na nas twój ojciec?"
  tags: []
"2Krn10,10":
  text: "Wtedy młodzieńcy, którzy razem z nim wzrośli, odpowiedzieli mu: Tak odpowiesz temu ludowi, który powiedział tobie: Twój ojciec włożył na nas ciężkie jarzmo, ale ty nam ulżyj; tak im powiesz: Mój mały palec jest grubszy niż biodra mojego ojca."
  tags: []
"2Krn10,11":
  text: "Teraz więc chociaż mój ojciec nałożył na was ciężkie jarzmo, ja dołożę do waszego jarzma. Mój ojciec karcił was biczami, ale ja będę was karcił skorpionami."
  tags: []
"2Krn10,12":
  text: "Przyszedł więc Jeroboam i cały lud do Roboama trzeciego dnia, tak jak król nakazał, mówiąc: Wróćcie do mnie na trzeci dzień."
  tags: []
"2Krn10,13":
  text: "I król odpowiedział im surowo, bo odrzucił król Roboam radę starców."
  tags: []
"2Krn10,14":
  text: "I przemówił do nich według rady młodzieńców, mówiąc: Mój ojciec obciążył was ciężkim jarzmem, ale ja dołożę do niego. Mój ojciec karcił was biczami, ale ja będę was karcił skorpionami."
  tags: []
"2Krn10,15":
  text: "Król więc nie usłuchał ludu, sprawa bowiem wyszła od Boga, aby PAN spełnił swoje słowo, które wypowiedział przez Achiasza Szilonitę do Jeroboama, syna Nebata."
  tags: []
"2Krn10,16":
  text: "A gdy cały Izrael zobaczył, że król ich nie usłuchał, lud odpowiedział królowi: Jakiż dział mamy w Dawidzie? Nie mamy dziedzictwa w synu Jessego. Idźcie każdy do swoich namiotów, Izraelu! A ty, Dawidzie, troszcz się teraz o swój dom. I rozszedł się cały Izrael do swoich namiotów."
  tags: []
"2Krn10,17":
  text: "Tylko nad synami Izraela, którzy mieszkali w miastach Judy, królował Roboam."
  tags: []
"2Krn10,18":
  text: "Wtedy król Roboam posłał do synów Izraela Hadorama, który był poborcą, a oni ukamienowali go tak, że umarł. Król Roboam wsiadł więc w pośpiechu na rydwan i uciekł do Jerozolimy."
  tags: []
"2Krn10,19":
  text: "I w ten sposób Izrael zbuntował się przeciwko domowi Dawida aż do dziś."
  tags: []
