"2Krn15,1":
  text: "Wtedy Duch Boży zstąpił na Azariasza, syna Obeda."
  tags: []
"2Krn15,2":
  text: "I wyszedł on naprzeciw Asy, i powiedział mu: Słuchajcie mnie, Aso i całe pokolenie Judy i Beniamina. PAN jest z wami, dopóki jesteście z nim. Jeśli go szukać będziecie, znajdziecie go, ale jeśli go opuścicie, on opuści was."
  tags: []
"2Krn15,3":
  text: "Przez wiele dni Izrael był bez prawdziwego Boga, bez nauczającego kapłana i bez prawa."
  tags: []
"2Krn15,4":
  text: "Gdy jednak w swoim nieszczęściu nawrócili się do PANA, Boga Izraela, i szukali go, dawał się im odnaleźć."
  tags: []
"2Krn15,5":
  text: "W tamtych czasach nie było pokoju ani dla wychodzącego, ani dla wchodzącego, gdyż wielkie udręki spotkały wszystkich mieszkańców ziemi."
  tags: []
"2Krn15,6":
  text: "I naród występował przeciw narodowi, a miasto – przeciw miastu, ponieważ Bóg ich zatrważał wszelkim nieszczęściem."
  tags: []
"2Krn15,7":
  text: "Wy więc umacniajcie się i niech nie słabną wasze ręce, bo czeka was zapłata za waszą pracę."
  tags: []
"2Krn15,8":
  text: "A gdy Asa usłyszał te słowa i proroctwo proroka Obeda, umocnił się i usunął obrzydliwości z całej ziemi Judy i Beniamina, a także z miast, które zdobył na górze Efraim, i odnowił ołtarz PANA, który stał przed przedsionkiem PANA."
  tags: []
"2Krn15,9":
  text: "Potem zebrał cały lud z Judy i Beniamina oraz przybyszów, którzy byli z nimi z Efraima, Manassesa i Symeona. Bardzo wielu bowiem zbiegło z Izraela do niego, widząc, że z nim był PAN, jego Bóg."
  tags: []
"2Krn15,10":
  text: "Zgromadzili się więc w Jerozolimie w trzecim miesiącu, w piętnastym roku panowania Asy."
  tags: []
"2Krn15,11":
  text: "W tym dniu złożyli PANU ofiary z łupów, które przynieśli: siedemset wołów i siedem tysięcy owiec."
  tags: []
"2Krn15,12":
  text: "I zobowiązali się przymierzem szukać PANA, Boga swoich ojców, z całego swego serca i całą swoją duszą;"
  tags: []
"2Krn15,13":
  text: "I że ktokolwiek nie będzie szukał PANA, Boga Izraela, poniesie śmierć – czy to mały, czy wielki, mężczyzna czy kobieta."
  tags: []
"2Krn15,14":
  text: "I przysięgli PANU donośnym głosem, wśród okrzyków oraz dźwięków trąb i kornetów."
  tags: []
"2Krn15,15":
  text: "A cały lud Judy radował się z tej przysięgi, ponieważ przysięgli z całego serca i z całą chęcią szukali go, a dał się im odnaleźć. I dał im PAN odpoczynek ze wszystkich stron."
  tags: []
"2Krn15,16":
  text: "Ponadto nawet swoją matkę Maakę król Asa pozbawił godności królowej, ponieważ sporządziła posąg w gaju. I Asa ściął jej posąg, pokruszył go i spalił przy potoku Cedron."
  tags: []
"2Krn15,17":
  text: "A choć wyżyny nie zostały zniesione z Izraela, to jednak serce Asy było doskonałe przez wszystkie jego dni."
  tags: []
"2Krn15,18":
  text: "Sprowadził też do domu Bożego to, co poświęcił jego ojciec i co on sam poświęcił: srebro, złoto i naczynia."
  tags: []
"2Krn15,19":
  text: "I nie było wojny aż do trzydziestego piątego roku panowania Asy."
  tags: []
