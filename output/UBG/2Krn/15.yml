"2Krn15,1": "Wtedy Duch Boży zstąpił na Azariasza, syna Obeda."
"2Krn15,2": "I wyszedł on naprzeciw Asy, i powiedział mu: Słuchajcie mnie, Aso i całe pokolenie Judy i Beniamina. PAN jest z wami, dopóki jesteście z nim. Jeśli go szukać będziecie, znajdziecie go, ale jeśli go opuścicie, on opuści was."
"2Krn15,3": "Przez wiele dni Izrael był bez prawdziwego Boga, bez nauczającego kapłana i bez prawa."
"2Krn15,4": "Gdy jednak w swoim nieszczęściu nawrócili się do PANA, Boga Izraela, i szukali go, dawał się im odnaleźć."
"2Krn15,5": "W tamtych czasach nie było pokoju ani dla wychodzącego, ani dla wchodzącego, gdyż wielkie udręki spotkały wszystkich mieszkańców ziemi."
"2Krn15,6": "I naród występował przeciw narodowi, a miasto – przeciw miastu, ponieważ Bóg ich zatrważał wszelkim nieszczęściem."
"2Krn15,7": "Wy więc umacniajcie się i niech nie słabną wasze ręce, bo czeka was zapłata za waszą pracę."
"2Krn15,8": "A gdy Asa usłyszał te słowa i proroctwo proroka Obeda, umocnił się i usunął obrzydliwości z całej ziemi Judy i Beniamina, a także z miast, które zdobył na górze Efraim, i odnowił ołtarz PANA, który stał przed przedsionkiem PANA."
"2Krn15,9": "Potem zebrał cały lud z Judy i Beniamina oraz przybyszów, którzy byli z nimi z Efraima, Manassesa i Symeona. Bardzo wielu bowiem zbiegło z Izraela do niego, widząc, że z nim był PAN, jego Bóg."
"2Krn15,10": "Zgromadzili się więc w Jerozolimie w trzecim miesiącu, w piętnastym roku panowania Asy."
"2Krn15,11": "W tym dniu złożyli PANU ofiary z łupów, które przynieśli: siedemset wołów i siedem tysięcy owiec."
"2Krn15,12": "I zobowiązali się przymierzem szukać PANA, Boga swoich ojców, z całego swego serca i całą swoją duszą;"
"2Krn15,13": "I że ktokolwiek nie będzie szukał PANA, Boga Izraela, poniesie śmierć – czy to mały, czy wielki, mężczyzna czy kobieta."
"2Krn15,14": "I przysięgli PANU donośnym głosem, wśród okrzyków oraz dźwięków trąb i kornetów."
"2Krn15,15": "A cały lud Judy radował się z tej przysięgi, ponieważ przysięgli z całego serca i z całą chęcią szukali go, a dał się im odnaleźć. I dał im PAN odpoczynek ze wszystkich stron."
"2Krn15,16": "Ponadto nawet swoją matkę Maakę król Asa pozbawił godności królowej, ponieważ sporządziła posąg w gaju. I Asa ściął jej posąg, pokruszył go i spalił przy potoku Cedron."
"2Krn15,17": "A choć wyżyny nie zostały zniesione z Izraela, to jednak serce Asy było doskonałe przez wszystkie jego dni."
"2Krn15,18": "Sprowadził też do domu Bożego to, co poświęcił jego ojciec i co on sam poświęcił: srebro, złoto i naczynia."
"2Krn15,19": "I nie było wojny aż do trzydziestego piątego roku panowania Asy."
