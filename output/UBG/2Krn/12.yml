"2Krn12,1": "A gdy Roboam utwierdził swoje królestwo i umocnił je, opuścił prawo PANA, a wraz z nim cały Izrael."
"2Krn12,2": "I w piątym roku panowania Roboama Sziszak, król Egiptu, nadciągnął przeciw Jerozolimie, oni bowiem zgrzeszyli przeciw PANU;"
"2Krn12,3": "Wyruszył z tysiącem i dwustu rydwanami i z sześćdziesięcioma tysiącami jeźdźców oraz niezliczonym ludem, który nadciągnął z nim z Egiptu: Libijczykami, Sukkijczykami i Kuszytami."
"2Krn12,4": "I zdobył warowne miasta, które były w Judzie, i dotarł aż do Jerozolimy."
"2Krn12,5": "Wtedy prorok Szemajasz przyszedł do Roboama i do książąt Judy, którzy zebrali się w Jerozolimie z obawy przed Sziszakiem, i powiedział do nich: Tak mówi PAN: Wy mnie opuściliście, dlatego i ja was opuściłem i poddałem w ręce Sziszaka."
"2Krn12,6": "Wtedy książęta Izraela i król ukorzyli się i powiedzieli: Sprawiedliwy jest PAN."
"2Krn12,7": "A gdy PAN zobaczył, że się ukorzyli, słowo PANA doszło do Szemajasza: Ponieważ ukorzyli się, nie wytracę ich, lecz nieco ich wyzwolę, a mój gniew nie wyleje się na Jerozolimę przez ręce Sziszaka."
"2Krn12,8": "Staną się jednak jego sługami, aby wiedzieli, co znaczy służyć mnie, a co królestwom ziemskim."
"2Krn12,9": "Nadciągnął więc Sziszak, król Egiptu, przeciw Jerozolimie i zabrał skarby domu PANA oraz skarby domu królewskiego – zabrał wszystko. Wziął też złote tarcze, które wykonał Salomon."
"2Krn12,10": "Zamiast nich król Roboam wykonał spiżowe tarcze i powierzył je dowódcom straży przybocznej, którzy strzegli wejścia do domu królewskiego."
"2Krn12,11": "A gdy król wchodził do domu PANA, straż przyboczna przychodziła po nie, a potem odnosiła je do wartowni."
"2Krn12,12": "A ponieważ król się ukorzył, odwrócił się od niego gniew PANA i PAN nie wytracił go całkowicie. Również w Judzie działy się rzeczy dobre."
"2Krn12,13": "Umocnił się więc król Roboam w Jerozolimie i królował. Roboam miał czterdzieści jeden lat, kiedy zaczął królować, i królował siedemnaście lat w Jerozolimie, w mieście, które PAN wybrał spośród wszystkich pokoleń Izraela, aby tam przebywało jego imię. Jego matka miała na imię Naama i była Ammonitką."
"2Krn12,14": "On zaś czynił to, co złe, bo nie przygotował swojego serca, aby szukać PANA."
"2Krn12,15": "Ale dzieje Roboama, od pierwszych do ostatnich, czy nie są zapisane w księdze proroka Szemajasza oraz widzącego Iddo w opisie rodowodów? A między Roboamem i Jeroboamem toczyły się wojny po wszystkie ich dni."
"2Krn12,16": "Potem Roboam zasnął ze swoimi ojcami i został pogrzebany w mieście Dawida, a jego syn Abiasz królował w jego miejsce."
