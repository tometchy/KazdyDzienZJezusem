"2Krn24,1": "Joasz miał siedem lat, kiedy zaczął królować, i królował czterdzieści lat w Jerozolimie. Jego matka miała na imię Sibia, była z Beer-Szeby."
"2Krn24,2": "I Joasz czynił to, co dobre w oczach PANA, przez wszystkie dni kapłana Jehojady."
"2Krn24,3": "A Jehojada dał mu dwie żony; i spłodził synów i córki."
"2Krn24,4": "Potem w sercu Joasza powstał zamiar, aby odnowić dom PANA."
"2Krn24,5": "Zebrał więc kapłanów i Lewitów i powiedział do nich: Wyjdźcie do miast Judy i zbierajcie od całego Izraela pieniądze na coroczną naprawę domu waszego Boga. Pospieszcie się z tym. Lewici jednak nie spieszyli się."
"2Krn24,6": "Wówczas król wezwał najwyższego kapłana Jehojadę i zapytał go: Czemu nie pilnujesz Lewitów, aby przynosili z Judy i Jerozolimy ofiarę na Namiot Świadectwa ustanowioną przez Mojżesza, sługę PANA, i zgromadzenie Izraela?"
"2Krn24,7": "Bezbożna Atalia i jej synowie złupili bowiem dom Boży, a wszystkie rzeczy poświęcone z domu PANA oddali Baalom."
"2Krn24,8": "Król więc rozkazał, aby wykonano skrzynię i umieszczono ją przed bramą domu PANA."
"2Krn24,9": "I ogłoszono w Judzie i Jerozolimie, aby przynoszono PANU ofiarę nałożoną na Izraela przez Mojżesza, sługę Bożego, na pustyni."
"2Krn24,10": "I radowali się wszyscy książęta oraz cały lud. Przynosili ją i rzucali do tej skrzyni, aż ją napełnili."
"2Krn24,11": "A kiedy Lewici przynosili skrzynię do urzędu królewskiego i gdy widzieli, że było już wiele pieniędzy, przychodził pisarz królewski oraz pełnomocnik najwyższego kapłana i wypróżniali skrzynię, a potem ją odnosili z powrotem na swoje miejsce. Tak czynili codziennie i zebrali bardzo dużo pieniędzy."
"2Krn24,12": "Król i Jehojada dawali je kierownikom robót domu PANA, a ci najmowali kamieniarzy i cieśli do naprawy domu PANA, a także kowali i brązowników – do umocnienia domu PANA."
"2Krn24,13": "Tak więc robotnicy pracowali i dzięki nim dzieło zostało wykonane. Doprowadzili dom Boży do właściwego stanu i umocnili go."
"2Krn24,14": "A gdy skończyli, przynieśli przed króla i Jehojadę resztę pieniędzy, za które sporządzono naczynia do domu PANA: naczynia do służby i składania ofiar, czasze oraz inne naczynia złote i srebrne. I nieustannie składali całopalenia w domu PANA przez wszystkie dni Jehojady."
"2Krn24,15": "Potem Jehojada zestarzał się i umarł, będąc syty dni. Miał sto trzydzieści lat, gdy umarł."
"2Krn24,16": "I pogrzebano go w mieście Dawida razem z królami, dlatego że czynił dobrze w Izraelu: i względem Boga, i względem jego domu."
"2Krn24,17": "Po śmierci Jehojady przyszli książęta Judy i pokłonili się królowi. Wtedy król ich usłuchał."
"2Krn24,18": "Opuścili dom PANA, Boga swoich ojców, i służyli gajom oraz posągom. Spadł więc gniew na Judę i Jerozolimę z powodu tego występku."
"2Krn24,19": "I posyłał do nich proroków, żeby ich nawrócić do PANA. A choć świadczyli przeciwko nim, nie usłuchali ich."
"2Krn24,20": "Wówczas Duch Boży zstąpił na Zachariasza, syna kapłana Jehojady, który stanął przed ludem i powiedział im: Tak mówi Bóg: Czemu przekraczacie przykazania PANA? Nie powodzi się wam. Skoro wy opuściliście PANA, on też was opuścił."
"2Krn24,21": "Wtedy sprzysięgli się przeciwko niemu i ukamienowali go na rozkaz króla na dziedzińcu domu PANA."
"2Krn24,22": "I nie pamiętał król Joasz o dobrodziejstwie, jakie wyświadczył mu jego ojciec Jehojada, ale zabił jego syna. Kiedy ten umierał, powiedział: Niech PAN to zobaczy i zemści się."
"2Krn24,23": "A po upływie roku przeciwko niemu nadciągnęło wojsko Syrii. Przybyło do Judy i Jerozolimy i wyniszczyło z ludu wszystkich książąt, a wszystkie jego łupy posłano królowi Damaszku."
"2Krn24,24": "Przybyło bowiem wojsko Syrii z niewielką liczbą ludzi, a PAN wydał w ich ręce bardzo liczne wojsko, dlatego że opuścili PANA, Boga swoich ojców. I tak dokonano sądu nad Joaszem."
"2Krn24,25": "A gdy się od niego oddalili, zostawiając go w ciężkiej chorobie, jego słudzy sprzysięgli się przeciwko niemu, z powodu krwi synów kapłana Jehojady, i zabili go na jego łożu. Tak więc umarł i pogrzebano go w mieście Dawida, ale nie w grobach królewskich."
"2Krn24,26": "A oto są ci, którzy sprzysięgli się przeciw niemu: Zabad, syn Szimeat, Ammonitki, i Jehozabad, syn Szimrit, Moabitki."
"2Krn24,27": "O jego synach zaś, o wielkim ciężarze nałożonym na niego i o naprawie domu Bożego, jest zapisane w księdze królewskiej. I królował jego syn Amazjasz w jego miejsce."
