"2Krn29,1":
  text: "Ezechiasz miał dwadzieścia pięć lat, kiedy zaczął królować, i królował dwadzieścia dziewięć lat w Jerozolimie. Jego matka miała na imię Abijja, była córką Zachariasza."
  tags: []
"2Krn29,2":
  text: "A czynił to, co prawe w oczach PANA, według wszystkiego, co czynił jego ojciec Dawid."
  tags: []
"2Krn29,3":
  text: "On to w pierwszym roku swego panowania, w pierwszym miesiącu, otworzył bramy domu PANA i naprawił je."
  tags: []
"2Krn29,4":
  text: "Przyprowadził kapłanów i Lewitów, zgromadził ich na ulicy wschodniej;"
  tags: []
"2Krn29,5":
  text: "I powiedział do nich: Słuchajcie mnie, Lewici! Poświęćcie się teraz, poświęćcie też i dom PANA, Boga waszych ojców, i usuńcie plugastwo ze świątyni."
  tags: []
"2Krn29,6":
  text: "Nasi ojcowie bowiem zgrzeszyli i czynili to, co złe w oczach PANA, naszego Boga. Opuścili go, odwrócili swoje oblicze od przybytku PANA i odwrócili się do niego tyłem."
  tags: []
"2Krn29,7":
  text: "Zamknęli też bramy przedsionka, pogasili lampy, nie palili kadzidła ani nie składali Bogu Izraela ofiar całopalnych w świątyni."
  tags: []
"2Krn29,8":
  text: "Dlatego gniew PANA spadł na Judę i Jerozolimę i PAN wydał ich na rozproszenie, na zdumienie i na pośmiewisko, jak sami widzicie swoimi oczami."
  tags: []
"2Krn29,9":
  text: "Oto bowiem z tego powodu nasi ojcowie polegli od miecza, a naszych synów, nasze córki i żony uprowadzono do niewoli."
  tags: []
"2Krn29,10":
  text: "Teraz więc postanowiłem zawrzeć przymierze z PANEM, Bogiem Izraela, aby odwrócił od nas zapalczywość swojego gniewu."
  tags: []
"2Krn29,11":
  text: "Moi synowie, nie bądźcie już niedbali, gdyż PAN wybrał was, abyście stali przed nim i służyli mu, abyście byli jego sługami i palili kadzidło."
  tags: []
"2Krn29,12":
  text: "Powstali więc Lewici: Machat, syn Amasaja, Joel, syn Azariasza, z synów Kehata; a z synów Merariego: Kisz, syn Abdiego, i Azariasz, syn Jehallela; a z Gerszonitów: Joach, syn Zimmy, i Eden, syn Joacha;"
  tags: []
"2Krn29,13":
  text: "Z synów Elisafana: Szimri i Jejel; z synów Asafa: Zachariasz i Mattaniasz;"
  tags: []
"2Krn29,14":
  text: "Z synów Hemana: Jechiel i Szimei; z synów Jedutuna: Szemajasz i Uzziel."
  tags: []
"2Krn29,15":
  text: "I zgromadzili swoich braci, poświęcili się i przyszli zgodnie z rozkazem króla oraz ze słowami PANA, aby oczyścić dom PANA."
  tags: []
"2Krn29,16":
  text: "Wtedy kapłani weszli do wnętrza domu PANA, aby go oczyścić, i wynieśli na dziedziniec domu PANA wszelkie plugastwo, które znaleźli w świątyni PANA. Następnie Lewici zabierali to i wynosili precz do potoku Cedron."
  tags: []
"2Krn29,17":
  text: "Zaczęli poświęcenie w pierwszym dniu pierwszego miesiąca, a ósmego dnia tego miesiąca weszli do przedsionka PANA. Poświęcali dom PANA przez osiem dni i dokończyli szesnastego dnia pierwszego miesiąca."
  tags: []
"2Krn29,18":
  text: "Potem poszli do króla Ezechiasza i powiedzieli: Oczyściliśmy cały dom PANA, ołtarz całopalenia i wszystkie jego przedmioty, stół pokładny i wszystkie jego naczynia."
  tags: []
"2Krn29,19":
  text: "Wszystkie też naczynia, które król Achaz odrzucił podczas swojego panowania, kiedy zgrzeszył, przygotowaliśmy i poświęciliśmy, a oto są przed ołtarzem PANA."
  tags: []
"2Krn29,20":
  text: "Wstał więc król Ezechiasz o poranku, zgromadził naczelników miasta i poszedł do domu PANA."
  tags: []
"2Krn29,21":
  text: "I przyprowadzono mu siedem cielców, siedem baranów, siedem jagniąt i siedem kozłów na ofiarę za grzech, za królestwo, za świątynię i za Judę. I rozkazał kapłanom, synom Aarona, by złożyli je na ołtarzu PANA."
  tags: []
"2Krn29,22":
  text: "Zabito więc woły, a kapłani wzięli krew i pokropili ołtarz. Zabili też barany i pokropili ołtarz ich krwią. Zabili także jagnięta i pokropili ołtarz ich krwią."
  tags: []
"2Krn29,23":
  text: "Następnie przyprowadzili przed króla i zgromadzenie kozły na ofiarę za grzech, a oni włożyli na nie swoje ręce."
  tags: []
"2Krn29,24":
  text: "Potem kapłani je zabili i dokonali na ołtarzu oczyszczenia ich krwią na przebłaganie za całego Izraela. Król bowiem rozkazał złożyć całopalenie i ofiarę za grzech za całego Izraela."
  tags: []
"2Krn29,25":
  text: "Postawił też Lewitów w domu PANA z cymbałami, cytrami i harfami, według rozkazu Dawida, Gada, widzącego króla, oraz proroka Natana, gdyż był to rozkaz PANA przez jego proroków."
  tags: []
"2Krn29,26":
  text: "Stanęli więc Lewici z instrumentami Dawida, a kapłani z trąbami."
  tags: []
"2Krn29,27":
  text: "I Ezechiasz rozkazał złożyć całopalenie na ołtarzu. A gdy rozpoczęło się całopalenie, zaczęto też śpiewać PANU przy dźwiękach trąb i instrumentów Dawida, króla Izraela."
  tags: []
"2Krn29,28":
  text: "Wtedy całe zgromadzenie oddało pokłon, śpiewacy śpiewali i trębacze trąbili. To wszystko trwało aż do końca całopalenia."
  tags: []
"2Krn29,29":
  text: "A gdy skończyło się całopalenie, król oraz wszyscy, którzy z nim byli, uklękli i oddali pokłon."
  tags: []
"2Krn29,30":
  text: "Wówczas król Ezechiasz i książęta rozkazali Lewitom, by wysławiali PANA słowami Dawida i Asafa widzącego. I wysławiali z wielką radością, kłaniali się i oddali pokłon."
  tags: []
"2Krn29,31":
  text: "Potem Ezechiasz powiedział: Teraz poświęciliście się PANU. Przystąpcie i przyprowadźcie ofiary pojednawcze i dziękczynne do domu PANA. Zgromadzenie przyprowadziło więc ofiary pojednawcze i dziękczynne, a każdy, kto pragnął – ofiary na całopalenie."
  tags: []
"2Krn29,32":
  text: "Liczba ofiar na całopalenie, które przyprowadziło zgromadzenie, wynosiła siedemdziesiąt wołów, sto baranów i dwieście jagniąt – wszystko to na całopalenie dla PANA."
  tags: []
"2Krn29,33":
  text: "Jako dary poświęconych było: sześćset wołów i trzy tysiące owiec."
  tags: []
"2Krn29,34":
  text: "Lecz kapłanów było zbyt mało i nie zdołali obedrzeć ze skóry wszystkich ofiar całopalnych. Pomagali im więc ich bracia Lewici, dopóki nie dokończyli tej pracy i dopóki nie poświęcili się inni kapłani. Lewici bowiem bardziej ochotnie poświęcili się niż kapłani."
  tags: []
"2Krn29,35":
  text: "Ponadto było też wiele ofiar całopalnych, z tłuszczem ofiar pojednawczych i z ofiarami z płynów na każde całopalenie. Tak została ustanowiona służba w domu PANA."
  tags: []
"2Krn29,36":
  text: "I Ezechiasz wraz z całym ludem radował się z tego, co Bóg przygotował ludowi, gdyż ta rzecz stała się nieoczekiwanie."
  tags: []
