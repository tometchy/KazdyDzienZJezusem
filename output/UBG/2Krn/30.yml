"2Krn30,1":
  text: "Potem Ezechiasz rozesłał posłańców do całego Izraela i Judy, a do Efraima i Manassesa napisał także listy, aby przybyli do domu PANA w Jerozolimie i obchodzili święto Paschy dla PANA, Boga Izraela."
  tags: []
"2Krn30,2":
  text: "Król bowiem postanowił wraz z książętami i całym zgromadzeniem w Jerozolimie, aby obchodzić święto Paschy w drugim miesiącu;"
  tags: []
"2Krn30,3":
  text: "Gdyż nie mogli go obchodzić w owym czasie, ponieważ liczba poświęconych kapłanów nie była wystarczająca, a i lud nie zgromadził się jeszcze w Jerozolimie."
  tags: []
"2Krn30,4":
  text: "Sprawa ta podobała się królowi i całemu zgromadzeniu."
  tags: []
"2Krn30,5":
  text: "Postanowili więc ogłosić w całym Izraelu, od Beer-Szeby aż do Dan, aby przybyto do Jerozolimy obchodzić święto Paschy dla PANA, Boga Izraela. Już dawno bowiem go nie obchodzili, jak to było przepisane."
  tags: []
"2Krn30,6":
  text: "Ruszyli więc posłańcy z listami od króla i od jego książąt po całym Izraelu i Judzie, zgodnie z rozkazem króla, mówiąc: Synowie Izraela! Powróćcie do PANA, Boga Abrahama, Izaaka i Izraela, a on powróci do ostatków, które spośród was ocalały z rąk królów Asyrii."
  tags: []
"2Krn30,7":
  text: "I nie bądźcie jak wasi ojcowie i jak wasi bracia, którzy zgrzeszyli przeciwko PANU, Bogu swoich ojców, który wydał ich na spustoszenie, jak to sami widzicie."
  tags: []
"2Krn30,8":
  text: "Teraz więc nie zatwardzajcie waszego karku, jak wasi ojcowie. Poddajcie się PANU, przyjdźcie do jego świątyni, którą poświęcił na wieki, i służcie PANU, waszemu Bogu, a odstąpi od was zapalczywość jego gniewu."
  tags: []
"2Krn30,9":
  text: "Jeśli bowiem powrócicie do PANA, wasi bracia i synowie otrzymają miłosierdzie u tych, którzy uprowadzili ich w niewolę, tak że powrócą do tej ziemi, bo PAN, wasz Bóg, jest łaskawy i miłosierny i nie odwróci od was swojego oblicza, jeśli powrócicie do niego."
  tags: []
"2Krn30,10":
  text: "A gdy posłańcy chodzili od miasta do miasta przez ziemię Efraima i Manassesa aż do Zebulona, naśmiewano się z nich i szydzono."
  tags: []
"2Krn30,11":
  text: "Niektórzy jednak z Aszera, Manassesa i Zebulona ukorzyli się i przyszli do Jerozolimy."
  tags: []
"2Krn30,12":
  text: "W Judzie też działała ręka Boża, dając im jedno serce, aby wypełnili rozkaz króla i książąt, według słowa PANA."
  tags: []
"2Krn30,13":
  text: "I zebrało się w Jerozolimie wielu ludzi, aby obchodzić w drugim miesiącu Święto Przaśników. Było to niezmiernie wielkie zgromadzenie."
  tags: []
"2Krn30,14":
  text: "Wtedy powstali i usunęli ołtarze, które były w Jerozolimie, wszystkie też ołtarze, na których palono kadzidło, usunęli i wrzucili do potoku Cedron."
  tags: []
"2Krn30,15":
  text: "Potem zabili baranka paschalnego czternastego dnia, w drugim miesiącu. A kapłani i Lewici, będąc zawstydzeni, poświęcili się i przyprowadzili całopalenia do domu PANA."
  tags: []
"2Krn30,16":
  text: "I stali na swoich miejscach według swego urzędu i według prawa Mojżesza, męża Bożego. Kapłani kropili krwią, którą brali z rąk Lewitów."
  tags: []
"2Krn30,17":
  text: "Wielu bowiem było w zgromadzeniu, którzy jeszcze się nie poświęcili, dlatego Lewici ofiarowali baranki paschalne za każdego nieczystego, aby go poświęcić PANU."
  tags: []
"2Krn30,18":
  text: "Bo wielka liczba tego ludu, zwłaszcza wielu z Efraima, Manassesa, Issachara i Zebulona, nie była oczyszczona i jedli baranka paschalnego niezgodnie z przepisami. Lecz Ezechiasz modlił się za nich, mówiąc: Niech dobrotliwy PAN przebaczy każdemu;"
  tags: []
"2Krn30,19":
  text: "Kto przygotował swoje serce, aby szukać Boga, PANA Boga swoich ojców, choćby nie był oczyszczony według oczyszczenia świątyni."
  tags: []
"2Krn30,20":
  text: "I PAN wysłuchał Ezechiasza, i uzdrowił lud."
  tags: []
"2Krn30,21":
  text: "Tak więc synowie Izraela, którzy byli w Jerozolimie, obchodzili Święto Przaśników przez siedem dni z wielką radością. A Lewici i kapłani wysławiali PANA każdego dnia, śpiewając PANU przy głośnych instrumentach."
  tags: []
"2Krn30,22":
  text: "Wtedy Ezechiasz przemówił łaskawie do wszystkich Lewitów, którzy wykazywali dobre rozeznanie w sprawach PANA. I jedli przez siedem dni tego święta, składając ofiary pojednawcze i wyznając grzechy PANU, Bogu swoich ojców."
  tags: []
"2Krn30,23":
  text: "Potem całe zgromadzenie postanowiło obchodzić święto przez drugie siedem dni. Obchodzili więc święto z radością przez kolejne siedem dni."
  tags: []
"2Krn30,24":
  text: "Ezechiasz bowiem, król Judy, dał zgromadzeniu tysiąc cielców i siedem tysięcy owiec, a książęta dali zgromadzeniu tysiąc cielców i dziesięć tysięcy owiec. I poświęciło się bardzo wielu kapłanów."
  tags: []
"2Krn30,25":
  text: "Tak więc radowało się całe zgromadzenie Judy, kapłani, Lewici oraz całe zgromadzenie, które przybyło z Izraela, a także przybysze, którzy przyszli z ziemi Izraela, i ci, którzy mieszkali w Judzie."
  tags: []
"2Krn30,26":
  text: "I panowała wielka radość w Jerozolimie, gdyż od czasów Salomona, syna Dawida, króla Izraela, nic podobnego nie wydarzyło się w Jerozolimie."
  tags: []
"2Krn30,27":
  text: "Potem powstali kapłani i Lewici i błogosławili ludowi. A ich głos został wysłuchany i ich modlitwa dotarła do świętego przybytku PANA, do nieba."
  tags: []
