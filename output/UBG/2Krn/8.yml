"2Krn8,1":
  text: "A po upływie dwudziestu lat, w których Salomon zbudował dom PANA i swój dom;"
  tags: []
"2Krn8,2":
  text: "Odbudował też miasta, które Huram zwrócił Salomonowi, i oddał je na mieszkanie synom Izraela."
  tags: []
"2Krn8,3":
  text: "Potem Salomon wyruszył do Chamat Soby i zdobył je."
  tags: []
"2Krn8,4":
  text: "Odbudował też Tadmor na pustyni oraz wszystkie miasta, w których miał składy, a które zbudował w Chamat."
  tags: []
"2Krn8,5":
  text: "Odbudował także Bet-Choron górne i Bet-Choron dolne, miasta warowne, z murami, bramami i ryglami;"
  tags: []
"2Krn8,6":
  text: "Również Baalat i wszystkie miasta, w których Salomon miał składy, wszystkie też miasta rydwanów i miasta jeźdźców i wszystko to, co mu się podobało wybudować w Jerozolimie, w Libanie i w całej ziemi swego panowania."
  tags: []
"2Krn8,7":
  text: "A wszystkie ludy, które ocalały spośród Chetytów, Amorytów, Peryzzytów, Chiwwitów i Jebusytów, które nie były z Izraela;"
  tags: []
"2Krn8,8":
  text: "Lecz stanowiły potomstwo tych, którzy pozostali po nich w ziemi, a których synowie Izraela nie mogli wytracić – te Salomon obciążył pracą przymusową aż do dziś."
  tags: []
"2Krn8,9":
  text: "Ale z synów Izraela Salomon nie uczynił niewolników do swoich prac, byli tylko dzielnymi wojownikami, naczelnikami jego dowódców i przełożonymi nad jego rydwanami i jeźdźcami."
  tags: []
"2Krn8,10":
  text: "Ci byli naczelnikami spośród wodzów, których miał król Salomon; było ich dwustu pięćdziesięciu, którzy panowali nad ludem."
  tags: []
"2Krn8,11":
  text: "Lecz córkę faraona Salomon przeniósł z miasta Dawida do domu, który jej zbudował. Powiedział bowiem: Moja żona nie będzie mieszkała w domu Dawida, króla Izraela, bo jest święty przez to, że weszła do niego arka PANA."
  tags: []
"2Krn8,12":
  text: "Wtedy Salomon złożył PANU całopalenia na ołtarzu PANA, który zbudował przed przedsionkiem;"
  tags: []
"2Krn8,13":
  text: "Zgodnie ze zwyczajem, składając każdego dnia według nakazu Mojżesza, w szabaty, w dni nowiu księżyca i w uroczyste święta, trzy razy w roku: w Święto Przaśników, w Święto Tygodni i w Święto Namiotów."
  tags: []
"2Krn8,14":
  text: "I ustanowił według rozporządzenia Dawida, swojego ojca, zmiany kapłanów w ich służbie oraz Lewitów w ich obowiązkach, aby chwalili Boga i służyli przy kapłanach według ustalonego porządku każdego dnia. Odźwiernych też ustanowił według ich zmian przy każdej bramie. Taki bowiem był rozkaz Dawida, męża Bożego."
  tags: []
"2Krn8,15":
  text: "I nie odstąpiono w żadnej sprawie od rozkazu króla dotyczącego kapłanów i Lewitów oraz skarbów."
  tags: []
"2Krn8,16":
  text: "I tak zostały przygotowane wszystkie dzieła Salomona od dnia, w którym położono fundamenty domu PANA, aż do jego ukończenia. W ten sposób został dokończony dom PANA."
  tags: []
"2Krn8,17":
  text: "Wtedy Salomon wyruszył do Esjon-Geber i do Elot nad brzegiem morza w ziemi Edomu."
  tags: []
"2Krn8,18":
  text: "I Huram za pośrednictwem swoich sług, posłał mu okręty i żeglarzy obeznanych z morzem. Wraz ze sługami Salomona popłynęli do Ofiru, wzięli stamtąd czterysta pięćdziesiąt talentów złota i przywieźli je do króla Salomona."
  tags: []
