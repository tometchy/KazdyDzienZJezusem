"2Krn4,1":
  text: "Uczynił też ołtarz z brązu długi na dwadzieścia łokci, szeroki na dwadzieścia łokci, a na dziesięć łokci wysoki."
  tags: []
"2Krn4,2":
  text: "Wykonał również odlewane morze na dziesięć łokci od brzegu do brzegu. Było ono dokładnie okrągłe, miało pięć łokci wysokości i trzydzieści łokci obwodu."
  tags: []
"2Krn4,3":
  text: "A pod nim dokoła znajdowały się podobizny wołów, których było po dziesięć na każdym łokciu, a otaczały morze dokoła. Były dwa rzędy tych wołów odlanych razem z morzem."
  tags: []
"2Krn4,4":
  text: "Stało ono na dwunastu wołach, z których trzy spoglądały na północ, trzy spoglądały na zachód, trzy spoglądały na południe, a trzy spoglądały na wschód. Morze stało na nich na wierzchu, a wszystkie ich zady były zwrócone do środka."
  tags: []
"2Krn4,5":
  text: "Jego grubość była na szerokość dłoni; a jego brzeg był wykonany jak brzeg kielicha, w kształcie kwiatu lilii. Mieściło w sobie trzy tysiące bat."
  tags: []
"2Krn4,6":
  text: "Wykonał również dziesięć kadzi do obmywania w nich wszystkiego, co należało do całopalenia, i postawił pięć po prawej i pięć po lewej stronie. Ale morze służyło do obmywania się w nim kapłanów."
  tags: []
"2Krn4,7":
  text: "Uczynił też dziesięć złotych świeczników w kształcie, jaki miały mieć, i postawił je w świątyni, pięć po prawej i pięć po lewej stronie."
  tags: []
"2Krn4,8":
  text: "Uczynił też dziesięć stołów, które postawił w świątyni, pięć po prawej i pięć po lewej stronie. Wykonał też sto złotych czasz."
  tags: []
"2Krn4,9":
  text: "Zbudował również dziedziniec kapłanów i wielki dziedziniec oraz bramy do dziedzińca, a bramy pokrył brązem."
  tags: []
"2Krn4,10":
  text: "A morze postawił po prawej stronie na południowy wschód."
  tags: []
"2Krn4,11":
  text: "Huram uczynił kociołki, łopatki i miednice. Tak ukończył Huram pracę, którą miał wykonać dla króla Salomona, dla domu Bożego."
  tags: []
"2Krn4,12":
  text: "Mianowicie: dwie kolumny z okrągłymi głowicami na wierzchu tych dwóch kolumn oraz dwie siatki, które okrywały dwie okrągłe głowice na szczycie kolumn;"
  tags: []
"2Krn4,13":
  text: "I czterysta jabłek granatu do tych dwóch siatek, po dwa rzędy jabłek granatu na każdej siatce, do pokrycia dwóch okrągłych głowic na wierzchach kolumn."
  tags: []
"2Krn4,14":
  text: "Porobił także podstawy oraz kadzie na tych podstawach;"
  tags: []
"2Krn4,15":
  text: "Jedno morze i dwanaście wołów pod nim."
  tags: []
"2Krn4,16":
  text: "Do tego kociołki, łopatki, widełki i wszystkie naczynia do nich porobił Huram-Abi dla króla Salomona, do domu PANA z polerowanego brązu."
  tags: []
"2Krn4,17":
  text: "Na równinach Jordanu król odlewał je w gliniastej ziemi, między Sukkot i Seredatą."
  tags: []
"2Krn4,18":
  text: "Salomon sporządził więc wszystkie te naczynia w tak wielkiej liczbie, że nie można było obliczyć wagi brązu."
  tags: []
"2Krn4,19":
  text: "Sporządził także Salomon wszystkie naczynia, które należały do domu Bożego: złoty ołtarz i stoły, na których składano chleby pokładne;"
  tags: []
"2Krn4,20":
  text: "Także świeczniki i ich lampy ze szczerego złota, aby je rozpalano według zwyczaju przed Miejscem Najświętszym;"
  tags: []
"2Krn4,21":
  text: "Ponadto kwiaty, lampy i szczypce ze złota, i to z wybornego złota;"
  tags: []
"2Krn4,22":
  text: "Do tego nożyce, miednice, czasze i kadzielnice ze szczerego złota; bramy do domu, bramy wewnętrzne do Najświętszego Miejsca oraz drzwi domu, czyli świątyni, ze złota."
  tags: []
