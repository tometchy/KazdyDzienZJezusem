"2Krn27,1":
  text: "Jotam miał dwadzieścia pięć lat, kiedy zaczął królować, i królował szesnaście lat w Jerozolimie. Jego matka miała na imię Jerusza, była córką Sadoka."
  tags: []
"2Krn27,2":
  text: "Czynił on to, co prawe w oczach PANA, według wszystkiego, co czynił jego ojciec Uzjasz, tylko nie wchodził do świątyni PANA. Ale lud był nadal zepsuty."
  tags: []
"2Krn27,3":
  text: "On zbudował bramę górną domu PANA i wykonał wiele prac na murach Ofelu."
  tags: []
"2Krn27,4":
  text: "Ponadto pobudował miasta w górach Judy, a w lasach pobudował zamki i wieże."
  tags: []
"2Krn27,5":
  text: "Walczył również z królem Ammonitów i pokonał ich. Synowie Ammona dali mu tego roku sto talentów srebra i dziesięć tysięcy kor pszenicy oraz dziesięć tysięcy kor jęczmienia. Tyle samo dali mu synowie Ammona w drugim i trzecim roku."
  tags: []
"2Krn27,6":
  text: "A tak Jotam umocnił się, gdyż przygotował swoje drogi przed PANEM, swoim Bogiem."
  tags: []
"2Krn27,7":
  text: "A pozostałe dzieje Jotama, wszystkie jego wojny i jego drogi, są zapisane w księdze królów Izraela i Judy."
  tags: []
"2Krn27,8":
  text: "Miał dwadzieścia pięć lat, kiedy zaczął królować, i królował szesnaście lat w Jerozolimie."
  tags: []
"2Krn27,9":
  text: "Potem Jotam zasnął ze swoimi ojcami i pogrzebano go w mieście Dawida. A jego syn Achaz królował w jego miejsce."
  tags: []
