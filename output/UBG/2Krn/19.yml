"2Krn19,1":
  text: "A Jehoszafat, król Judy, wrócił do swojego domu w pokoju, do Jerozolimy."
  tags: []
"2Krn19,2":
  text: "I wyszedł mu naprzeciw widzący Jehu, syn Chananiego, i powiedział do króla Jehoszafata: Czy powinieneś był pomagać bezbożnym i miłować tych, którzy nienawidzą PANA? Przez to właśnie wisi nad tobą gniew PANA."
  tags: []
"2Krn19,3":
  text: "Znalazły się jednak dobre czyny w tobie, bo powycinałeś gaje z ziemi i przygotowałeś swoje serce, aby szukać Boga."
  tags: []
"2Krn19,4":
  text: "Zamieszkał więc Jehoszafat w Jerozolimie. I znowu wyruszył na objazd do ludu, od Beer-Szeby aż do góry Efraim, i nawrócił ich do PANA, Boga swoich ojców."
  tags: []
"2Krn19,5":
  text: "I ustanowił sędziów w ziemi we wszystkich warownych miastach Judy, w każdym mieście."
  tags: []
"2Krn19,6":
  text: "I powiedział do sędziów: Uważajcie na to, co czynicie, bo sądzicie nie dla człowieka, ale dla PANA, który jest z wami podczas sprawowania sądu."
  tags: []
"2Krn19,7":
  text: "Niech więc będzie w was bojaźń PANA. Strzeżcie się i czyńcie sprawiedliwość. Nie ma bowiem nieprawości u PANA, Boga naszego, i nie ma względu na osoby ani przyjmowania darów."
  tags: []
"2Krn19,8":
  text: "Także i w Jerozolimie Jehoszafat ustanowił niektórych spośród Lewitów, kapłanów i naczelników rodów Izraela dla sądu PANA i do rozstrzygania sporów tych, którzy się udawali do Jerozolimy."
  tags: []
"2Krn19,9":
  text: "I nakazał im: Czyńcie to w bojaźni PANA, wiernie i doskonałym sercem."
  tags: []
"2Krn19,10":
  text: "A przy wszystkich sporach, które wam przedłożą wasi bracia mieszkający w swoich miastach, czy dotyczą one przelania krwi, czy prawa, przykazania, ustaw czy sądów, napominajcie ich, aby nie grzeszyli przeciwko PANU, aby gniew nie spadł na was i na waszych braci. Tak czyńcie, a nie zgrzeszycie."
  tags: []
"2Krn19,11":
  text: "A oto najwyższy kapłan Amariasz będzie postawiony nad wami we wszystkich sprawach PANA, a Zebadiasz, syn Izmaela, książę w domu Judy – we wszystkich sprawach króla. Lewici będą również waszymi urzędnikami. Umacniajcie się i czyńcie tak, a PAN będzie z dobrym."
  tags: []
