"2Krn2,1":
  text: "Wtedy Salomon postanowił zbudować dom dla imienia PANA oraz pałac królewski dla siebie."
  tags: []
"2Krn2,2":
  text: "I odliczył Salomon siedemdziesiąt tysięcy mężczyzn do noszenia ciężarów i osiemdziesiąt tysięcy mężczyzn do ciosania na górze, a nad nimi – trzy tysiące sześciuset nadzorców."
  tags: []
"2Krn2,3":
  text: "Salomon posłał też do Hurama, króla Tyru, wiadomość: Jak postąpiłeś z moim ojcem Dawidem, gdy przysłałeś mu drzewa cedrowego, aby zbudował sobie dom na mieszkanie, tak postąp ze mną."
  tags: []
"2Krn2,4":
  text: "Oto chcę budować dom dla imienia PANA, swego Boga, aby mu go poświęcić i aby palić przed nim wonne kadzidło, składać nieustannie chleb pokładny oraz całopalenia poranne i wieczorne – w szabaty, w dni nowiu oraz w uroczyste święta PANA, naszego Boga. To jest wieczny nakaz w Izraelu."
  tags: []
"2Krn2,5":
  text: "A dom, który mam zbudować, będzie wielki, gdyż nasz Bóg jest większy od wszystkich bogów."
  tags: []
"2Krn2,6":
  text: "Któż jednak zdoła zbudować mu dom, skoro niebiosa i niebiosa niebios nie mogą go ogarnąć? A kim jestem ja, żebym miał mu dom zbudować? Chyba tylko do palenia przed nim kadzidła."
  tags: []
"2Krn2,7":
  text: "Dlatego więc przyślij mi teraz człowieka uzdolnionego w obróbce złota, srebra, brązu, żelaza, purpury, karmazynu i błękitu, i który umie rzeźbić wraz z innymi rzemieślnikami będącymi przy mnie w Judzie i Jerozolimie, wyznaczonymi przez mego ojca Dawida."
  tags: []
"2Krn2,8":
  text: "Przyślij mi też z Libanu drzewa cedrowego, cyprysowego i sandałowego, bo wiem, że twoi słudzy umieją rąbać drzewa w Libanie, a oto moi słudzy będą z twoimi sługami;"
  tags: []
"2Krn2,9":
  text: "Aby przygotowali mi jak najwięcej drzewa. Dom bowiem, który chcę zbudować, ma być nad podziw wielki."
  tags: []
"2Krn2,10":
  text: "A oto twoim sługom, robotnikom, którzy mają wycinać drzewo, dam dwadzieścia tysięcy kor wymłóconej pszenicy, dwadzieścia tysięcy kor jęczmienia, dwadzieścia tysięcy bat wina oraz dwadzieścia tysięcy bat oliwy."
  tags: []
"2Krn2,11":
  text: "Wtedy Huram, król Tyru, odpowiedział w piśmie, które wysłał do Salomona: Ponieważ PAN umiłował swój lud, ustanowił cię nad nim królem."
  tags: []
"2Krn2,12":
  text: "Huram mówił dalej: Błogosławiony niech będzie PAN, Bóg Izraela, który uczynił niebo i ziemię, który dał królowi Dawidowi syna mądrego, zdolnego, rozumnego i roztropnego, aby zbudował dom dla PANA oraz pałac królewski dla siebie."
  tags: []
"2Krn2,13":
  text: "Posyłam ci więc człowieka mądrego, zdolnego i roztropnego: Hurama-Abiego;"
  tags: []
"2Krn2,14":
  text: "Syna kobiety spośród córek Dana, którego ojcem był mieszkaniec Tyru, a który umie pracować przy złocie, srebrze, brązie, żelazie, kamieniu, drewnie – z purpurą, błękitem, bisiorem i karmazynem, który umie wykonywać wszelkie rzeźby i obmyślać każdą powierzoną mu pracę, razem z twymi rzemieślnikami i rzemieślnikami mego pana Dawida, twojego ojca."
  tags: []
"2Krn2,15":
  text: "Teraz więc niech mój pan przyśle swoim sługom pszenicę, jęczmień, oliwę i wino, o których mówił."
  tags: []
"2Krn2,16":
  text: "A my nawycinamy drzew z Libanu, ile ci będzie potrzeba, i sprowadzimy je morzem na tratwach do Jafy, a ty je każesz sprowadzić do Jerozolimy."
  tags: []
"2Krn2,17":
  text: "Wtedy Salomon obliczył wszystkich cudzoziemców, którzy byli w ziemi Izraela po tym spisie, którego dokonał jego ojciec Dawid, i znalazło się ich sto pięćdziesiąt trzy tysiące sześciuset."
  tags: []
"2Krn2,18":
  text: "I przeznaczył z nich siedemdziesiąt tysięcy do dźwigania ciężarów, osiemdziesiąt tysięcy do ciosania w górach i trzy tysiące sześciuset nadzorców nad robotami ludu."
  tags: []
