"2Krn18,1": "I Jehoszafat miał wiele bogactwa i wielką sławę, i spokrewnił się z Achabem."
"2Krn18,2": "Po kilku latach przybył do Achaba do Samarii. I Achab zabił dla niego i dla ludu, który z nim był, wiele owiec i wołów i namówił go, aby wyruszył do Ramot-Gilead."
"2Krn18,3": "Achab, król Izraela, zapytał Jehoszafata, króla Judy: Czy wyruszysz ze mną do Ramot-Gilead? A on mu odpowiedział: Ja tak, jak i ty; mój lud, jak i twój lud, będziemy z tobą na wojnie."
"2Krn18,4": "Jehoszafat powiedział jeszcze do króla Izraela: Zapytaj dziś, proszę, o słowo PANA."
"2Krn18,5": "Zebrał więc król Izraela czterystu proroków i zapytał ich: Czy mamy wyruszyć na wojnę do Ramot-Gilead, czy mam tego zaniechać? A oni odpowiedzieli: Wyrusz, bo Bóg wyda je w ręce króla."
"2Krn18,6": "Ale Jehoszafat zapytał: Czy nie ma tu jeszcze jakiegoś proroka PANA, abyśmy mogli go zapytać?"
"2Krn18,7": "Król Izraela odpowiedział Jehoszafatowi: Jest jeszcze jeden człowiek, przez którego moglibyśmy radzić się PANA, ale ja go nienawidzę, bo nie prorokuje mi nic dobrego, tylko zawsze to, co złe. Jest to Micheasz, syn Jimli. Jehoszafat powiedział: Niech król tak nie mówi."
"2Krn18,8": "Wtedy król Izraela zawołał pewnego dworzanina i polecił mu: Przyprowadź tu szybko Micheasza, syna Jimli."
"2Krn18,9": "Tymczasem król Izraela i Jehoszafat, król Judy, siedzieli na swoich tronach ubrani w królewskie szaty na placu przed wejściem do Samarii, u jej bramy, a przed nimi prorokowali wszyscy prorocy."
"2Krn18,10": "A Sedekiasz, syn Kenaany, sporządził sobie rogi żelazne i powiedział: Tak mówi PAN: Nimi będziesz bódł Syryjczyków, aż ich wytępisz."
"2Krn18,11": "Tak samo prorokowali wszyscy prorocy, mówiąc: Wyrusz do Ramot-Gilead, a poszczęści ci się. PAN bowiem wyda je w ręce króla."
"2Krn18,12": "Wtedy posłaniec, który poszedł, aby przywołać Micheasza, powiedział do niego: Oto słowa proroków jednomyślnie wypowiadają królowi to, co dobre. Niech twoje słowo, proszę, będzie jak słowo jednego z nich i mów to, co dobre."
"2Krn18,13": "Micheasz odpowiedział: Jak żyje PAN, będę mówił to, co Bóg mi rozkaże."
"2Krn18,14": "A gdy przyszedł do króla, król powiedział do niego: Micheaszu, czy mamy wyruszyć na wojnę przeciw Ramot-Gilead, czy tego zaniechać? Odpowiedział: Wyruszcie, a poszczęści się wam, i będą oddani w wasze ręce."
"2Krn18,15": "I król powiedział do niego: Ile razy mam cię zaprzysięgać, abyś mi nie mówił nic innego, jak tylko prawdę w imieniu PANA?"
"2Krn18,16": "Powiedział więc: Widziałem całego Izraela rozproszonego po górach jak owce niemające pasterza. A PAN powiedział: Oni nie mają pana. Niech każdy wraca do swego domu w pokoju."
"2Krn18,17": "Wtedy król Izraela powiedział do Jehoszafata: Czyż nie mówiłem ci, że nie będzie mi prorokować nic dobrego, tylko to, co złe?"
"2Krn18,18": "Tamten powiedział: Słuchaj więc słowa PANA: Widziałem PANA siedzącego na swoim tronie, a wszystkie zastępy niebieskie stojące po jego prawicy i lewicy."
"2Krn18,19": "I PAN zapytał: Kto zwiedzie Achaba, króla Izraela, aby wyruszył do Ramot-Gilead i poległ tam? I jeden mówił tak, a drugi inaczej."
"2Krn18,20": "Wtedy wystąpił duch, stanął przed PANEM i powiedział: Ja go zwiodę. PAN zapytał go: Jak?"
"2Krn18,21": "Odpowiedział: Wyjdę i będę duchem kłamliwym w ustach wszystkich jego proroków. PAN powiedział: Zwiedziesz go, na pewno ci się uda: Idź i uczyń tak."
"2Krn18,22": "Teraz więc oto PAN włożył ducha kłamliwego w usta tych twoich proroków, gdyż PAN zapowiedział ci nieszczęście."
"2Krn18,23": "Podbiegł wtedy Sedekiasz, syn Kenaany, i uderzył Micheasza w policzek, mówiąc: Którędy odszedł ode mnie Duch PANA, aby mówić z tobą?"
"2Krn18,24": "Micheasz odpowiedział: Oto ty sam zobaczysz tego dnia, kiedy wejdziesz do najskrytszej komnaty, aby się ukryć."
"2Krn18,25": "Król Izraela powiedział: Weźcie Micheasza i zaprowadźcie go do Amona, namiestnika miasta, i do Joasza, syna królewskiego;"
"2Krn18,26": "I powiecie: Tak mówi król: Wtrąćcie tego człowieka do więzienia i żywcie go chlebem utrapienia i wodą ucisku, aż wrócę w pokoju."
"2Krn18,27": "Ale Micheasz odpowiedział: Jeśli rzeczywiście wrócisz w pokoju, to PAN nie mówił przeze mnie. I dodał: Słuchajcie wszyscy ludzie."
"2Krn18,28": "Tak więc król Izraela i Jehoszafat, król Judy, wyruszyli do Ramot-Gilead."
"2Krn18,29": "I król Izraela powiedział do Jehoszafata: Przebiorę się i pójdę na bitwę, ty zaś ubierz się w swoje szaty. Następnie król Izraela przebrał się i poszli na bitwę."
"2Krn18,30": "A król Syrii rozkazał swoim dowódcom rydwanów: Nie walczcie ani z małym, ani z wielkim, tylko z samym królem Izraela."
"2Krn18,31": "A gdy dowódcy rydwanów zobaczyli Jehoszafata, powiedzieli: To jest król Izraela. I otoczyli go, aby z nim walczyć. Ale Jehoszafat zawołał i PAN go wspomógł. I Bóg odwrócił ich od niego."
"2Krn18,32": "Kiedy dowódcy rydwanów zobaczyli bowiem, że nie był to król Izraela, odwrócili się od niego."
"2Krn18,33": "A pewien mężczyzna na ślepo naciągnął łuk i ugodził króla Izraela między spojenia pancerza. A ten powiedział swojemu woźnicy: Zawróć i wywieź mnie z pola bitwy, bo jestem ranny."
"2Krn18,34": "I bitwa wzmogła się tego dnia, a król Izraela stał w rydwanie naprzeciw Syryjczykom aż do wieczora. I umarł, gdy zachodziło słońce."
