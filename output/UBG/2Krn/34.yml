"2Krn34,1":
  text: "Jozjasz miał osiem lat, kiedy zaczął królować, i królował trzydzieści jeden lat w Jerozolimie."
  tags: []
"2Krn34,2":
  text: "Czynił on to, co prawe w oczach PANA, chodząc drogami swego ojca Dawida, i nie zbaczał z nich ani na prawo, ani na lewo."
  tags: []
"2Krn34,3":
  text: "Bo w ósmym roku swojego królowania, gdy był jeszcze chłopcem, zaczął szukać Boga swego ojca Dawida, a w dwunastym roku zaczął oczyszczać Judę i Jerozolimę z wyżyn, gajów, rzeźbionych i odlewanych posągów."
  tags: []
"2Krn34,4":
  text: "Na jego oczach zburzono ołtarze Baalów i ściął posągi słoneczne umieszczone wysoko nad nimi. Także gaje oraz rzeźbione i odlewane posągi pokruszył i starł, a ich pył rozsypał po grobach tych, którzy im składali ofiary."
  tags: []
"2Krn34,5":
  text: "Kości kapłanów spalił na ich ołtarzach i oczyścił Judę i Jerozolimę."
  tags: []
"2Krn34,6":
  text: "Podobnie czynił w miastach Manassesa, Efraima i Symeona, aż do Neftalego, wszędzie dokoła za pomocą kilofów."
  tags: []
"2Krn34,7":
  text: "A kiedy zburzył ołtarze i gaje, starł posągi na proch i ściął wszystkie posągi słoneczne w całej ziemi Izraela, wtedy wrócił do Jerozolimy."
  tags: []
"2Krn34,8":
  text: "A w osiemnastym roku swego panowania, po oczyszczeniu ziemi i domu PANA, posłał Szafana, syna Azaliasza, Maasejasza, namiestnika miasta, oraz Joacha, syna Joachaza, kronikarza, aby naprawili dom PANA, jego Boga."
  tags: []
"2Krn34,9":
  text: "Kiedy przybyli do najwyższego kapłana Chilkiasza, oddali pieniądze przyniesione do domu Bożego – które Lewici, stróże bram, zebrali od synów Manassesa i Efraima, od całej reszty Izraela i od całej Judy i Beniamina – po czym wrócili do Jerozolimy."
  tags: []
"2Krn34,10":
  text: "I oddali je w ręce rzemieślników, którzy mieli nadzór nad pracami w domu PANA, a oni je wypłacili robotnikom, którzy pracowali w domu PANA, naprawiając i umacniając dom."
  tags: []
"2Krn34,11":
  text: "Wypłacili je cieślom i murarzom na zakup kamienia ciosanego i drzewa na wiązania i na podłogi domów, które zniszczyli królowie Judy."
  tags: []
"2Krn34,12":
  text: "Ci mężczyźni wykonywali tę pracę wiernie. Ich przełożonymi byli: Jachat i Obadiasz, Lewici, z synów Merariego, oraz Zachariasz i Meszullam, z synów Kehata, aby kierowali pracami, oraz każdy Lewita, który umiał grać na instrumentach muzycznych."
  tags: []
"2Krn34,13":
  text: "Postawieni byli też nad tymi, którzy nosili ciężary, i nadzorowali robotników przy każdej pracy, a spośród Lewitów byli pisarze, dozorcy i odźwierni."
  tags: []
"2Krn34,14":
  text: "A gdy wynoszono pieniądze przyniesione do domu PANA, kapłan Chilkiasz znalazł księgę Prawa PANA, przekazaną przez Mojżesza."
  tags: []
"2Krn34,15":
  text: "Wtedy Chilkiasz powiedział do pisarza Szafana: Znalazłem księgę Prawa w domu PANA. I Chilkiasz dał księgę Szafanowi."
  tags: []
"2Krn34,16":
  text: "Szafan zaniósł księgę królowi i zdał mu sprawę, mówiąc: Twoi słudzy wykonują wszystko, co im poleciłeś;"
  tags: []
"2Krn34,17":
  text: "Zebrali bowiem pieniądze, które znajdowały się w domu PANA, i oddali je do rąk nadzorców i robotników."
  tags: []
"2Krn34,18":
  text: "Ponadto pisarz Szafan powiedział królowi: Kapłan Chilkiasz dał mi księgę. I czytał ją Szafan przed królem."
  tags: []
"2Krn34,19":
  text: "A gdy król usłyszał słowa prawa, rozdarł swoje szaty."
  tags: []
"2Krn34,20":
  text: "Potem król rozkazał Chilkiaszowi, synowi Szafana, Achikamowi, synowi Micheasza, Abdonowi, a także pisarzowi Szafanowi oraz słudze króla Asajaszowi:"
  tags: []
"2Krn34,21":
  text: "Idźcie, poradźcie się PANA co do mnie i co do reszty ludu w Izraelu i Judzie w związku ze słowami tej księgi, którą znaleziono. Wielki bowiem jest gniew PANA, który został wylany na nas za to, że nasi ojcowie nie strzegli słowa PANA, aby czynić wszystko, co jest napisane w tej księdze."
  tags: []
"2Krn34,22":
  text: "Tak więc poszedł Chilkiasz wraz z tymi, którzy byli przy królu, do prorokini Chuldy, żony Szalluma, syna Tikwy, syna Chasry, strażnika szat – mieszkała ona w Jerozolimie, po drugiej stronie miasta – i opowiedzieli jej o tej sprawie."
  tags: []
"2Krn34,23":
  text: "Ona zaś powiedziała im: Tak mówi PAN, Bóg Izraela: Powiedzcie mężczyźnie, który was posłał do mnie:"
  tags: []
"2Krn34,24":
  text: "Tak mówi PAN: Oto sprowadzę nieszczęście na to miejsce i na jego mieszkańców, wszystkie przekleństwa zapisane w tej księdze, którą czytali przed królem Judy;"
  tags: []
"2Krn34,25":
  text: "Za to, że mnie opuścili i palili kadzidło innym bogom, aby pobudzić mnie do gniewu wszystkimi dziełami swoich rąk. Dlatego mój gniew zostanie wylany na to miejsce i nie zagaśnie."
  tags: []
"2Krn34,26":
  text: "A królowi Judy, który was posłał po radę do PANA, powiedzcie: Tak mówi PAN, Bóg Izraela, o słowach, które słyszałeś:"
  tags: []
"2Krn34,27":
  text: "Ponieważ twoje serce zmiękło i ukorzyłeś się przed obliczem Boga, gdy usłyszałeś jego słowa przeciwko temu miejscu i przeciwko jego mieszkańcom, a ukorzyłeś się przede mną, rozdarłeś swoje szaty i płakałeś przede mną, to również i ja wysłuchałem ciebie, mówi PAN;"
  tags: []
"2Krn34,28":
  text: "Oto przyłączę cię do twoich ojców i będziesz złożony w swoim grobie w pokoju, aby twoje oczy nie oglądały całego nieszczęścia, które sprowadzam na to miejsce i jego mieszkańców. I zanieśli tę odpowiedź królowi."
  tags: []
"2Krn34,29":
  text: "Wtedy król posłał po wszystkich starszych Judy i Jerozolimy i zgromadził ich."
  tags: []
"2Krn34,30":
  text: "Następnie udał się do domu PANA, a wraz z nim wszyscy mężczyźni Judy, mieszkańcy Jerozolimy, kapłani i Lewici oraz cały lud, od największych do najmniejszych. I czytał do ich uszu wszystkie słowa księgi przymierza, którą znaleziono w domu PANA."
  tags: []
"2Krn34,31":
  text: "Potem król stanął na swoim miejscu i zawarł przymierze przed PANEM, że będą szli za PANEM i będą przestrzegać jego przykazań, świadectw, nakazów z całego serca, całą swoją duszą i wypełniać słowa tego przymierza, które zostały zapisane w tej księdze."
  tags: []
"2Krn34,32":
  text: "Wtedy król nakazał przystąpić do przymierza wszystkim, którzy znajdowali się w Jerozolimie i Beniaminie. I mieszkańcy Jerozolimy postąpili zgodnie z przymierzem Boga, Boga swoich ojców."
  tags: []
"2Krn34,33":
  text: "Wówczas Jozjasz usunął wszystkie obrzydliwości ze wszystkich ziem synów Izraela i zobowiązał wszystkich, którzy się znajdowali w Izraelu, aby służyli PANU, swemu Bogu. Przez wszystkie jego dni nie odstąpili od naśladowania PANA, Boga swoich ojców."
  tags: []
