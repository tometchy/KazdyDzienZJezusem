"2Krn26,1": "Wtedy cały lud Judy wziął Uzjasza, który miał szesnaście lat, i ustanowił go królem w miejsce jego ojca Amazjasza."
"2Krn26,2": "Ten odbudował Elat i przywrócił go do Judy, kiedy król już zasnął ze swoimi ojcami."
"2Krn26,3": "Uzjasz miał szesnaście lat, kiedy zaczął królować, i królował pięćdziesiąt dwa lata w Jerozolimie. Jego matka miała na imię Jekolia, była z Jerozolimy."
"2Krn26,4": "Czynił on to, co prawe w oczach PANA, według wszystkiego, co czynił jego ojciec Amazjasz."
"2Krn26,5": "I szukał Boga, dopóki żył Zachariasz, który miał rozeznanie w widzeniach Bożych. A przez te wszystkie dni, kiedy szukał PANA, Bóg darzył go powodzeniem."
"2Krn26,6": "Wyruszył do walki z Filistynami, zburzył mury Gat, Jabne i Aszdodu, a odbudował miasta w okolicy Aszdodu i w ziemi Filistynów."
"2Krn26,7": "Wspomagał go bowiem Bóg przeciw Filistynom i Arabom, którzy mieszkali w Gur-Baal, i przeciw Meunitom."
"2Krn26,8": "Ammonici dawali Uzjaszowi daniny, a sława jego imienia rozeszła się aż do wejścia do Egiptu, bo wielce się umocnił."
"2Krn26,9": "I Uzjasz zbudował wieże w Jerozolimie nad Bramą Narożną, nad Bramą Doliny i nad Narożnikiem i umocnił je."
"2Krn26,10": "Zbudował też wieże na pustyni i wykopał wiele studni, ponieważ miał bardzo dużo stad, zarówno w dolinach, jak i na równinach, także rolników i uprawiających winnice na górach i na Karmelu. Był bowiem rozmiłowany w uprawie ziemi."
"2Krn26,11": "Uzjasz miał też wojsko gotowe do bitwy, które wyruszało na wojnę w odliczonych oddziałach, według spisu dokonanego przez pisarza Jejela i urzędnika Maasejasza, pod nadzorem Chananiasza, jednego z dowódców króla."
"2Krn26,12": "Całkowita liczba naczelników rodów postawionych nad dzielnymi wojownikami wynosiła dwa tysiące sześciuset."
"2Krn26,13": "A pod ich rozkazami stało wojsko złożone z trzystu siedmiu tysięcy pięciuset wojowników gotowych do wojny z wielką siłą, aby wesprzeć króla przeciw wrogowi."
"2Krn26,14": "Uzjasz przygotował całemu wojsku tarcze, włócznie, hełmy, pancerze, łuki oraz kamienie do proc."
"2Krn26,15": "Sporządził w Jerozolimie machiny wojenne wymyślone przez zdolnych ludzi, aby stały na wieżach i na narożnikach w celu ciskania strzał i wielkich kamieni. Jego sława rozeszła się daleko, ponieważ doznawał cudownej pomocy, aż stał się potężny."
"2Krn26,16": "Ale kiedy się umocnił, uniosło się jego serce ku jego własnej zgubie. Zgrzeszył przeciw PANU, swemu Bogu, gdyż wszedł do świątyni PANA, aby palić kadzidło na ołtarzu kadzenia."
"2Krn26,17": "Wszedł za nim kapłan Azariasz, a z nim osiemdziesięciu kapłanów PANA, odważnych mężczyzn."
"2Krn26,18": "I sprzeciwili się królowi Uzjaszowi, i powiedzieli mu: Nie do ciebie, Uzjaszu, należy palenie kadzidła PANU, lecz do kapłanów, synów Aarona, którzy są poświęceni, aby palić kadzidło. Wyjdź ze świątyni. Zgrzeszyłeś bowiem i nie przynosi ci to chwały od PANA Boga."
"2Krn26,19": "Wtedy Uzjasz rozgniewał się, mając w ręku kadzielnicę, by spalić kadzidło. A gdy pałał gniewem na kapłanów, pojawił się trąd na jego czole przed kapłanami w domu PANA, przy ołtarzu kadzenia."
"2Krn26,20": "Kiedy najwyższy kapłan Azariasz i wszyscy kapłani spojrzeli na niego, oto miał trąd na czole. Wypchnęli go więc stamtąd, a i on sam spieszył się z wyjściem, bo dotknął go PAN."
"2Krn26,21": "I tak król Uzjasz był trędowaty aż do dnia swojej śmierci i jako trędowaty mieszkał w domu odosobnienia. Został bowiem wyłączony z domu PANA. W tym czasie jego syn Jotam zarządzał domem królewskim i sądził lud ziemi."
"2Krn26,22": "A pozostałe dzieje Uzjasza, od pierwszych do ostatnich, opisał prorok Izajasz, syn Amosa."
"2Krn26,23": "Zasnął więc Uzjasz ze swoimi ojcami i pogrzebali go z nimi na polu grobów królewskich, gdyż mówili: Trędowaty jest. A jego syn Jotam królował w jego miejsce."
