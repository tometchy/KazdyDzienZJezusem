"2Krn25,1":
  text: "Amazjasz miał dwadzieścia pięć lat, kiedy zaczął królować, i królował dwadzieścia dziewięć lat w Jerozolimie. Jego matka miała na imię Jehoaddan, była z Jerozolimy."
  tags: []
"2Krn25,2":
  text: "I czynił to, co dobre w oczach PANA, ale niedoskonałym sercem."
  tags: []
"2Krn25,3":
  text: "I kiedy jego królestwo było utwierdzone, zabił te spośród swoich sług, które zabiły króla, jego ojca."
  tags: []
"2Krn25,4":
  text: "Ich synów jednak nie zabił. Postąpił tak, jak jest napisane w prawie, w Księdze Mojżesza, gdzie PAN dał nakaz, mówiąc: Nie umrą ojcowie za synów ani synowie nie umrą za ojców, ale każdy umrze za swój własny grzech."
  tags: []
"2Krn25,5":
  text: "Wtedy Amazjasz zgromadził lud Judy i ustanowił nad nim dowódców nad tysiącami i setników, według ich rodów, dla całej Judy i Beniamina. Następnie policzył tych, którzy mieli dwadzieścia lat i więcej, a było ich trzysta tysięcy wyborowych mężczyzn gotowych do boju, uzbrojonych w dzidę i tarczę."
  tags: []
"2Krn25,6":
  text: "Najął też z Izraela sto tysięcy dzielnych wojowników za sto talentów srebra."
  tags: []
"2Krn25,7":
  text: "Lecz przybył do niego mąż Boży i powiedział: Królu, niech wojsko Izraela nie wyrusza z tobą, bo PAN nie jest z Izraelem, z nikim spośród synów Efraima."
  tags: []
"2Krn25,8":
  text: "Ale jeśli chcesz, idź i umocnij się do bitwy, a Bóg powali cię przed wrogiem. Bóg bowiem ma moc i wspomagać, i przywieść do upadku."
  tags: []
"2Krn25,9":
  text: "Wtedy Amazjasz zapytał męża Bożego: A co mam czynić ze stoma talentami, które dałem wojsku Izraela? Mąż Boży odpowiedział: PAN może ci dać o wiele więcej niż to."
  tags: []
"2Krn25,10":
  text: "Oddzielił więc Amazjasz to wojsko, które przybyło do niego z Efraima, aby wróciło do siebie. I rozgniewali się bardzo na Judę, i wrócili do siebie w wielkim gniewie."
  tags: []
"2Krn25,11":
  text: "Lecz Amazjasz umocnił się, wyprowadził swój lud i nadciągnął do Doliny Soli, i pobił dziesięć tysięcy synów Seiru."
  tags: []
"2Krn25,12":
  text: "A synowie Judy uprowadzili dziesięć tysięcy żywych, przyprowadzili ich na szczyt skały i zrzucili stamtąd, tak że się wszyscy porozbijali."
  tags: []
"2Krn25,13":
  text: "Żołnierze wojska zaś, których Amazjasz odesłał, aby nie ruszyli z nim na wojnę, wtargnęli do miast Judy, od Samarii aż do Bet-Choron. Zabili w nich trzy tysiące ludzi i zebrali wielką zdobycz."
  tags: []
"2Krn25,14":
  text: "Kiedy Amazjasz wrócił po porażce Edomitów, przyniósł ze sobą bogów synów Seiru i postawił ich jako swoich bogów. Kłaniał się przed nimi i palił im kadzidło."
  tags: []
"2Krn25,15":
  text: "PAN więc rozgniewał się bardzo na Amazjasza i posłał do niego proroka, który mu powiedział: Czemu szukasz bogów tego ludu, którzy nie potrafili wyrwać swojego ludu z twojej ręki?"
  tags: []
"2Krn25,16":
  text: "A gdy on do niego mówił, król mu powiedział: Czy wybrano cię doradcą króla? Przestań. Po co mają cię zabić? Prorok więc zaprzestał, ale dodał: Wiem, że Bóg zamierza cię zniszczyć za to, że to uczyniłeś i nie posłuchałeś mojej rady."
  tags: []
"2Krn25,17":
  text: "Wtedy Amazjasz, król Judy, naradził się i posłał sługę do Joasza, syna Jehoachaza, syna Jehu, króla Izraela, ze słowami: Przyjdź i spójrzmy sobie w oczy."
  tags: []
"2Krn25,18":
  text: "A Joasz, król Izraela, posłał do Amazjasza, króla Judy, odpowiedź: Oset w Libanie posłał do cedru w Libanie prośbę: Daj swoją córkę mojemu synowi za żonę. Wtedy przechodził dziki zwierz z Libanu i podeptał oset."
  tags: []
"2Krn25,19":
  text: "Myślisz: Oto pobiłem Edomitów – dlatego uniosło się twoje serce, by się chlubić. Siedź teraz w domu. Po co masz się narażać na nieszczęście, abyś upadł ty i Juda z tobą?"
  tags: []
"2Krn25,20":
  text: "Ale Amazjasz nie posłuchał, a było to od Boga, aby ich wydać w ręce wrogów za to, że szukali bogów Edomu."
  tags: []
"2Krn25,21":
  text: "Wyruszył więc Joasz, król Izraela, i spojrzeli sobie w oczy, on i Amazjasz, król Judy, w Bet-Szemesz, które należy do Judy."
  tags: []
"2Krn25,22":
  text: "I Juda został rozgromiony przez Izraela, i każdy uciekał do swojego namiotu."
  tags: []
"2Krn25,23":
  text: "A Joasz, król Izraela, pojmał w Bet-Szemesz Amazjasza, króla Judy, syna Joasza, syna Jehoachaza, i przyprowadził go do Jerozolimy, gdzie zburzył mur Jerozolimy od Bramy Efraima aż do Bramy Narożnej – na czterysta łokci."
  tags: []
"2Krn25,24":
  text: "I zabrał całe złoto i srebro oraz wszystkie naczynia, które znajdowały się w domu Bożym u Obed-Edoma i w skarbcach domu królewskiego, a także zakładników, i wrócił do Samarii."
  tags: []
"2Krn25,25":
  text: "Amazjasz, syn Joasza, król Judy, żył jeszcze piętnaście lat po śmierci Joasza, syna Jehoachaza, króla Izraela."
  tags: []
"2Krn25,26":
  text: "A pozostałe dzieje Amazjasza, od pierwszych do ostatnich, czy nie są zapisane w księdze królów Judy i Izraela?"
  tags: []
"2Krn25,27":
  text: "A od czasu, kiedy Amazjasz odwrócił się od PANA, uknuli przeciwko niemu spisek w Jerozolimie. Uciekł więc do Lakisz, lecz wysłali za nim pościg do Lakisz i tam go zabili."
  tags: []
"2Krn25,28":
  text: "Potem przywieźli go na koniach i pogrzebali go z jego ojcami w mieście Judy."
  tags: []
