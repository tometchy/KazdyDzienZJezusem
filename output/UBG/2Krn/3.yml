"2Krn3,1":
  text: "Wtedy Salomon zaczął budować dom PANA w Jerozolimie na górze Moria, która została wskazana Dawidowi, jego ojcu, na miejscu, które Dawid przygotował na klepisku Ornana Jebusyty."
  tags: []
"2Krn3,2":
  text: "A zaczął go budować w drugim miesiącu, drugiego dnia, w czwartym roku swojego panowania."
  tags: []
"2Krn3,3":
  text: "Takie są wymiary, według których Salomon zbudował dom Boży: długość – sześćdziesiąt łokci, w łokciach według miary dawnej, szerokość – dwadzieścia łokci."
  tags: []
"2Krn3,4":
  text: "Przedsionek zaś, który był przed domem i odpowiadał jego szerokości, miał dwadzieścia łokci długości i sto dwadzieścia łokci wysokości. Wewnątrz pokrył go szczerym złotem."
  tags: []
"2Krn3,5":
  text: "A wnętrze wielkiego domu wyłożył drzewem cyprysowym i pokrył czystym złotem, a na wierzchu przyozdobił je palmami i łańcuchami."
  tags: []
"2Krn3,6":
  text: "Pokrył też dom drogocennymi kamieniami dla ozdoby, a złoto było złotem z Parwaim."
  tags: []
"2Krn3,7":
  text: "Ponadto złotem pokrył dom, belki, odrzwia, jego ściany i jego drzwi, a na ścianach wyrzeźbił cherubiny."
  tags: []
"2Krn3,8":
  text: "Zbudował też dom najświętszy, którego długość odpowiadała szerokości domu – dwadzieścia łokci, a jego szerokość – dwadzieścia łokci; i pokrył go czystym złotem o wadze sześciuset talentów."
  tags: []
"2Krn3,9":
  text: "Gwoździe ważyły pięćdziesiąt syklów złota. Górne sale także pokrył złotem."
  tags: []
"2Krn3,10":
  text: "Wykonał też w domu najświętszym dwa cherubiny misternie rzeźbione i pokrył je złotem."
  tags: []
"2Krn3,11":
  text: "A skrzydła cherubinów były długie na dwadzieścia łokci. Skrzydło jednego, na pięć łokci, sięgało ściany domu, a drugie skrzydło, także na pięć łokci, sięgało skrzydła drugiego cherubina."
  tags: []
"2Krn3,12":
  text: "Także skrzydło drugiego cherubina, na pięć łokci, sięgało ściany domu, a drugie skrzydło, na pięć łokci, sięgało skrzydła drugiego cherubina."
  tags: []
"2Krn3,13":
  text: "W ten sposób skrzydła tych cherubinów rozciągały się na dwadzieścia łokci. Stały one na swoich nogach, a ich twarze były zwrócone ku domowi."
  tags: []
"2Krn3,14":
  text: "Wykonał też zasłonę z błękitu, purpury, karmazynu i bisioru oraz wyhaftował na niej cherubiny."
  tags: []
"2Krn3,15":
  text: "Uczynił też przed domem dwie kolumny wysokie na trzydzieści pięć łokci, a głowice, które były na ich wierzchach miały po pięć łokci."
  tags: []
"2Krn3,16":
  text: "Zrobił też łańcuszki, jak w Miejscu Najświętszym, a umieścił je na wierzchołkach tych kolumn, wykonał też sto jabłek granatu, które zawiesił na tych łańcuszkach."
  tags: []
"2Krn3,17":
  text: "Wzniósł te kolumny przed świątynią, jedną po prawej, a drugą po lewej stronie; prawą nazwał Jakin, a lewą – Boaz."
  tags: []
