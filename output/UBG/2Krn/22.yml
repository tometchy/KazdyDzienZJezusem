"2Krn22,1":
  text: "Potem mieszkańcy Jerozolimy ustanowili Achazjasza, jego najmłodszego syna, królem na jego miejscu, gdyż wszystkich starszych jego braci wymordowała zgraja, która razem z Arabami wtargnęła do obozu. Tak więc zaczął królować Achazjasz, syn Jorama, króla Judy."
  tags: []
"2Krn22,2":
  text: "Achazjasz miał czterdzieści dwa lata, kiedy zaczął królować, i królował jeden rok w Jerozolimie. Jego matka miała na imię Atalia i była córką Omriego."
  tags: []
"2Krn22,3":
  text: "On również kroczył drogami domu Achaba, bo jego matka radziła mu, aby postępował niegodziwie."
  tags: []
"2Krn22,4":
  text: "Czynił więc to, co złe w oczach PANA, tak jak dom Achaba. Oni bowiem na jego zgubę byli jego doradcami po śmierci ojca."
  tags: []
"2Krn22,5":
  text: "Chodził za ich radą i wyruszył z Joramem, synem Achaba, królem Izraela, na wojnę przeciw Chazaelowi, królowi Syrii, do Ramot-Gilead. Tam Syryjczycy zranili Jorama."
  tags: []
"2Krn22,6":
  text: "Wrócił więc, aby się leczyć w Jizreel z ran, które zadano mu w Rama, gdy walczył z Chazaelem, królem Syrii. Wtedy Azariasz, syn Jorama, króla Judy, przybył do Jizreel, aby odwiedzić Jorama, syna Achaba, bo był chory."
  tags: []
"2Krn22,7":
  text: "A to, że przybył do Jorama, było od Boga na zgubę Achazjasza. Kiedy bowiem przybył, wyjechał z Joramem przeciw Jehu, synowi Nimsziego, którego PAN namaścił, aby wytracić dom Achaba."
  tags: []
"2Krn22,8":
  text: "I kiedy Jehu dokonywał sądu nad domem Achaba, znalazł niektórych książąt Judy i synów braci Achazjasza, którzy służyli Achazjaszowi, i zabił ich."
  tags: []
"2Krn22,9":
  text: "Potem szukał Achazjasza i pojmano go, gdy ukrywał się w Samarii. Przyprowadzili go do Jehu i zabili. Potem pogrzebali go, bo mówili: To jest syn Jehoszafata, który szukał PANA całym swoim sercem. I tak już nie było nikogo w domu Achazjasza, kto by mógł przejąć królestwo."
  tags: []
"2Krn22,10":
  text: "Kiedy Atalia, matka Achazjasza, zobaczyła, że jej syn umarł, wstała i zgładziła całe potomstwo królewskie z domu Judy."
  tags: []
"2Krn22,11":
  text: "Ale Jehoszaba, córka króla, wzięła Joasza, syna Achazjasza, wykradła go spośród synów króla, których potem zabito, i ukryła go wraz z jego mamką w pokoju sypialnym. Tak to ukryła go Jehoszaba, córka króla Jorama, żona kapłana Jehojady i siostra Achazjasza, przed Atalią, aby ta go nie zabiła."
  tags: []
"2Krn22,12":
  text: "I przebywał z nimi ukryty w domu Bożym przez sześć lat, podczas gdy Atalia królowała nad ziemią."
  tags: []
