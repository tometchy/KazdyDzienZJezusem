"2Krn17,1":
  text: "Potem w jego miejsce królował Jehoszafat, jego syn, i umocnił się przeciwko Izraelowi."
  tags: []
"2Krn17,2":
  text: "I umieścił wojska we wszystkich warownych miastach Judy. Umieścił też załogi w ziemi Judy i w miastach Efraima, które zdobył Asa, jego ojciec."
  tags: []
"2Krn17,3":
  text: "A PAN był z Jehoszafatem, ponieważ chodził on pierwszymi drogami swego ojca Dawida i nie szukał Baalów;"
  tags: []
"2Krn17,4":
  text: "Lecz szukał Boga swego ojca i postępował według jego przykazań, a nie według czynów ludu Izraela."
  tags: []
"2Krn17,5":
  text: "I PAN utwierdził królestwo w jego rękach, a cały lud Judy składał dary Jehoszafatowi, tak że miał wiele bogactwa i wielką sławę."
  tags: []
"2Krn17,6":
  text: "Umocniło się jego serce w drogach PANA, tym bardziej więc znosił wyżyny i gaje z ziemi Judy."
  tags: []
"2Krn17,7":
  text: "Potem w trzecim roku swojego panowania posłał swoich książąt: Ben-Chaila, Obadiasza, Zachariasza, Netaneela i Micheasza, aby nauczali w miastach Judy."
  tags: []
"2Krn17,8":
  text: "Posłał z nimi także Lewitów: Szemajasza, Netaniasza, Zebadiasza, Asahela, Szemiramota, Jehonatana, Adoniasza, Tobiasza i Tobadoniasza – Lewitów, a z nimi Eliszamę i Jehorama, kapłanów."
  tags: []
"2Krn17,9":
  text: "Nauczali oni w Judzie, mając ze sobą księgę Prawa PANA, i obchodzili wszystkie miasta Judy, i nauczali lud."
  tags: []
"2Krn17,10":
  text: "A bojaźń PANA padła na wszystkie królestwa ziemi położone dokoła Judy i nie śmiały walczyć przeciwko Jehoszafatowi."
  tags: []
"2Krn17,11":
  text: "Niektórzy z Filistynów przynosili Jehoszafatowi dary i daniny w srebrze. Arabowie przyprowadzili mu trzody: siedem tysięcy siedemset baranów i siedem tysięcy siedemset kozłów."
  tags: []
"2Krn17,12":
  text: "I Jehoszafat wzrastał coraz bardziej w potęgę, i budował w Judzie zamki oraz miasta spichlerze."
  tags: []
"2Krn17,13":
  text: "Podjął wiele prac w miastach Judy. I miał wielu dzielnych i potężnych wojowników w Jerozolimie."
  tags: []
"2Krn17,14":
  text: "A oto jest ich spis według ich rodów: z Judy tysiącznikami byli: dowódca Adna, a z nim trzysta tysięcy dzielnych wojowników."
  tags: []
"2Krn17,15":
  text: "Przy nim stał dowódca Jehochanan, a z nim dwieście osiemdziesiąt tysięcy."
  tags: []
"2Krn17,16":
  text: "Przy nim – Amazjasz, syn Zikriego, który dobrowolnie poświęcił się PANU, a z nim dwieście tysięcy dzielnych wojowników."
  tags: []
"2Krn17,17":
  text: "A z synów Beniamina: Eliada, dzielny wojownik, a z nim dwieście tysięcy mężczyzn uzbrojonych w łuki i tarcze."
  tags: []
"2Krn17,18":
  text: "A przy nim – Jehozabad, a z nim sto osiemdziesiąt tysięcy gotowych do boju."
  tags: []
"2Krn17,19":
  text: "Oni służyli królowi, nie licząc tych, których król rozmieścił w warownych miastach po całej ziemi Judy."
  tags: []
