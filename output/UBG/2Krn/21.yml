"2Krn21,1":
  text: "Potem Jehoszafat zasnął ze swoimi ojcami i został pogrzebany z nimi w mieście Dawida, a jego syn Joram królował w jego miejsce."
  tags: []
"2Krn21,2":
  text: "Ten miał braci, synów Jehoszafata: Azariasza, Jechiela, Zachariasza, Azariasza, Mikaela i Szefatiasza. Ci wszyscy byli synami Jehoszafata, króla Izraela."
  tags: []
"2Krn21,3":
  text: "Ich ojciec dał im wiele darów w srebrze i złocie oraz kosztowności wraz z warownymi miastami w Judzie. Ale królestwo oddał Joramowi, ponieważ on był pierworodnym."
  tags: []
"2Krn21,4":
  text: "Kiedy Joram objął władzę w królestwie swojego ojca, umocnił się i pozabijał mieczem wszystkich swoich braci, a także niektórych z książąt Izraela."
  tags: []
"2Krn21,5":
  text: "Joram miał trzydzieści dwa lata, kiedy zaczął królować, i królował osiem lat w Jerozolimie."
  tags: []
"2Krn21,6":
  text: "I chodził drogami królów Izraela, tak jak to czynił dom Achaba, bo córka Achaba była jego żoną. I czynił to, co złe w oczach PANA."
  tags: []
"2Krn21,7":
  text: "PAN jednak nie chciał wytracić domu Dawida ze względu na przymierze, które zawarł z Dawidem, i ponieważ obiecał dać pochodnię jemu oraz jego synom, po wszystkie dni."
  tags: []
"2Krn21,8":
  text: "Za jego dni Edomici wyzwolili się spod panowania Judy i ustanowili nad sobą króla."
  tags: []
"2Krn21,9":
  text: "Wyruszył więc Joram wraz ze swoimi dowódcami i wszystkimi swoimi rydwanami. I powstał w nocy, i uderzył na Edomitów, którzy otoczyli jego i dowódców jego rydwanów."
  tags: []
"2Krn21,10":
  text: "Edomici jednak wyzwolili się spod ręki Judy i tak jest aż do dziś. W tym czasie również Libna wyzwoliła się spod jego ręki, dlatego że Joram opuścił PANA, Boga swoich ojców."
  tags: []
"2Krn21,11":
  text: "Ponadto pobudował wyżyny w górach Judy i przywiódł mieszkańców Jerozolimy do cudzołóstwa, do tego też skłonił Judę."
  tags: []
"2Krn21,12":
  text: "Wtedy przyszło do niego pismo od proroka Eliasza tej treści: Tak mówi PAN, Bóg Dawida, twego ojca: Ponieważ nie chodziłeś drogami swego ojca Jehoszafata i drogami Asy, króla Judy;"
  tags: []
"2Krn21,13":
  text: "Ale chodziłeś drogą królów Izraela i przywiodłeś do cudzołóstwa Judę i mieszkańców Jerozolimy, tak jak cudzołożył dom Achaba, ponadto wymordowałeś swoich braci z domu swego ojca – lepszych od ciebie;"
  tags: []
"2Krn21,14":
  text: "Oto PAN uderzy wielką plagą twój lud, twoich synów, twoje żony i cały twój majątek;"
  tags: []
"2Krn21,15":
  text: "Na ciebie też przyjdzie ciężka choroba, choroba wnętrzności, aż z powodu choroby dzień za dniem będą wypływać twoje wnętrzności."
  tags: []
"2Krn21,16":
  text: "PAN pobudził również przeciw Joramowi ducha Filistynów i Arabów, którzy mieszkali obok Etiopczyków;"
  tags: []
"2Krn21,17":
  text: "Wtargnęli oni do Judy, spustoszyli ją i zabrali cały majątek, który znajdował się w domu króla, uprowadzili też jego synów i jego żony, tak że nie pozostał mu żaden syn oprócz Jehoachaza, najmłodszego z jego synów."
  tags: []
"2Krn21,18":
  text: "Po tym wszystkim PAN dotknął go nieuleczalną chorobą wnętrzności."
  tags: []
"2Krn21,19":
  text: "A gdy tak mijał dzień po dniu, upłynął okres dwóch lat i wypłynęły jego wnętrzności z powodu tej choroby, i umarł w ciężkich bólach. A lud nie palił mu żadnego ognia, jak to uczynił dla jego ojców."
  tags: []
"2Krn21,20":
  text: "Miał trzydzieści dwa lata, kiedy zaczął królować, i królował osiem lat w Jerozolimie, a odszedł tak, że nikt go nie żałował. I został pogrzebany w mieście Dawida, ale nie w grobach królewskich."
  tags: []
