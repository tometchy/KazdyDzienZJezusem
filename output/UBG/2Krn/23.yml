"2Krn23,1":
  text: "W roku siódmym Jehojada umocnił się i zawarł przymierze z setnikami: Azariaszem, synem Jerochama, Izmaelem, synem Jochanana, Azariaszem, synem Obeda, Maasejaszem, synem Adajasza, i Elisafatem, synem Zikriego."
  tags: []
"2Krn23,2":
  text: "Obeszli oni ziemię Judy, zebrali Lewitów ze wszystkich miast Judy oraz naczelników rodów Izraela i przybyli do Jerozolimy."
  tags: []
"2Krn23,3":
  text: "Całe to zgromadzenie zawarło z królem przymierze w domu Bożym. I powiedział im: Oto syn króla będzie królował, tak jak PAN zapowiedział o synach Dawida."
  tags: []
"2Krn23,4":
  text: "Oto co macie uczynić: Trzecia część z was – kapłanów i Lewitów, którzy przychodzicie w szabat – będzie odźwiernymi przy bramach."
  tags: []
"2Krn23,5":
  text: "Trzecia część będzie w domu królewskim i trzecia część będzie w bramie fundamentu. Cały zaś lud zostanie w dziedzińcach domu PANA."
  tags: []
"2Krn23,6":
  text: "Niech nikt nie wchodzi do domu PANA prócz kapłanów i usługujących Lewitów. Oni mogą wchodzić, gdyż są poświęceni. A cały lud niech trzyma straż PANA."
  tags: []
"2Krn23,7":
  text: "Lewici otoczą króla ze wszystkich stron, każdy z bronią w ręku. Ktokolwiek wejdzie do domu, poniesie śmierć. Bądźcie przy królu, gdy będzie wchodził i gdy będzie wychodził."
  tags: []
"2Krn23,8":
  text: "I uczynili Lewici oraz cały lud Judy według wszystkiego, co rozkazał kapłan Jehojada. Każdy wziął swoich ludzi, którzy przychodzili w szabat, i tych, którzy odchodzili w szabat, bo kapłan Jehojada nie zwolnił tych zmian."
  tags: []
"2Krn23,9":
  text: "I kapłan Jehojada rozdał setnikom włócznie, tarcze i puklerze, które należały do króla Dawida, a które znajdowały się w domu Bożym."
  tags: []
"2Krn23,10":
  text: "Ustawił też cały lud, a każdy miał broń w ręku, od prawej strony domu aż do lewej strony domu, przy ołtarzu i domu, dokoła króla."
  tags: []
"2Krn23,11":
  text: "Wtedy wyprowadzili syna króla, włożyli mu koronę, wręczyli mu Świadectwo i ustanowili go królem. Jehojada i jego synowie namaścili go i wołali: Niech żyje król!"
  tags: []
"2Krn23,12":
  text: "Kiedy Atalia usłyszała krzyk zbiegającego się ludu, który chwalił króla, przyszła do ludu do domu PANA."
  tags: []
"2Krn23,13":
  text: "A gdy spojrzała, oto król stał przy kolumnie u wejścia, a wokół króla książęta i trąby. Cały lud tej ziemi radował się i dął w trąby, także śpiewacy z instrumentami muzycznymi oraz ci, którzy kierowali śpiewem. Wtedy Atalia rozdarła swoje szaty, mówiąc: Zdrada! Zdrada!"
  tags: []
"2Krn23,14":
  text: "Wówczas kapłan Jehojada rozkazał wystąpić setnikom dowodzącym wojskiem i powiedział do nich: Wyprowadźcie ją poza szeregi, a ktokolwiek pójdzie za nią, niech będzie zabity mieczem. Kapłan bowiem powiedział: Nie zabijajcie jej w domu PANA."
  tags: []
"2Krn23,15":
  text: "Pochwycili ją więc, a gdy przyszła do wejścia Bramy Końskiej przy domu królewskim, tam ją zabili."
  tags: []
"2Krn23,16":
  text: "Wtedy Jehojada zawarł przymierze między nim a całym ludem i królem, aby byli ludem PANA."
  tags: []
"2Krn23,17":
  text: "Potem cały lud wszedł do domu Baala i zburzył go. Pokruszyli jego ołtarze i posągi, a Mattana, kapłana Baala, zabili przed ołtarzami."
  tags: []
"2Krn23,18":
  text: "I Jehojada ustanowił przełożonych nad domem PANA pod władzą kapłanów i Lewitów, których Dawid podzielił w domu PANA, aby z radością i pieśniami składali PANU całopalenia, jak jest napisane w Prawie Mojżesza, według rozporządzenia Dawida."
  tags: []
"2Krn23,19":
  text: "Postawił też odźwiernych przy bramach domu PANA, aby nie wchodził nikt, kto byłby w jakikolwiek sposób nieczysty."
  tags: []
"2Krn23,20":
  text: "Potem wziął setników, dostojników i przełożonych ludu oraz cały lud ziemi i wyprowadzili króla z domu PANA. Przeszli przez bramę wyższą do domu królewskiego i posadzili króla na tronie królestwa."
  tags: []
"2Krn23,21":
  text: "I radował się cały lud ziemi. A miasto zaznało pokoju, gdy Atalię zabito mieczem."
  tags: []
