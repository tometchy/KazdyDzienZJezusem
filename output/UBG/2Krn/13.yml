"2Krn13,1":
  text: "W osiemnastym roku króla Jeroboama zaczął królować Abiasz nad Judą."
  tags: []
"2Krn13,2":
  text: "Trzy lata królował w Jerozolimie, a jego matka miała na imię Maaka i była córką Uriela z Gibea. I trwała wojna między Abiaszem a Jeroboamem."
  tags: []
"2Krn13,3":
  text: "Abiasz więc przyszykował wojsko liczące czterysta tysięcy dzielnych wojowników, wyborowych mężczyzn. Jeroboam także przyszykował przeciwko niemu osiemset tysięcy wyborowych mężczyzn, dzielnych wojowników."
  tags: []
"2Krn13,4":
  text: "Wtedy Abiasz stanął na szczycie góry Semaraim, położonej wśród gór Efraim, i powiedział: Słuchajcie mnie, Jeroboamie i cały Izraelu!"
  tags: []
"2Krn13,5":
  text: "Czy nie powinniście wiedzieć, że PAN, Bóg Izraela, dał Dawidowi panowanie nad Izraelem na wieki – jemu i jego synom – przymierzem soli?"
  tags: []
"2Krn13,6":
  text: "Lecz powstał Jeroboam, syn Nebata, sługa Salomona, syna Dawida, i zbuntował się przeciw swojemu panu."
  tags: []
"2Krn13,7":
  text: "I zebrali się u niego lekkomyślni mężczyźni, synowie Beliala, i wzmocnili się przeciw Roboamowi, synowi Salomona. A Roboam, będąc młodzieńcem i lękliwego serca, nie mógł się im mężnie oprzeć."
  tags: []
"2Krn13,8":
  text: "A wy teraz zamierzacie przeciwstawić się królestwu PANA, które jest w rękach synów Dawida; jesteście wielkim tłumem i macie ze sobą złote cielce, które Jeroboam wykonał wam jako bogów."
  tags: []
"2Krn13,9":
  text: "Czy nie odrzuciliście kapłanów PANA, synów Aarona, i Lewitów i czy nie ustanowiliście sobie kapłanów jak inne narody ziemi? Ktokolwiek przychodzi z młodym cielcem i siedmioma baranami, aby się poświęcić, staje się kapłanem tych, którzy nie są bogami."
  tags: []
"2Krn13,10":
  text: "Ale dla nas PAN jest naszym Bogiem i nie opuściliśmy go. Kapłani, którzy służą PANU, są synami Aarona, a Lewici pełnią swoje obowiązki."
  tags: []
"2Krn13,11":
  text: "I każdego ranka i wieczora składają PANU w ofierze całopalenia i wonności oraz układają chleby pokładne na czystym stole, przygotowują także złoty świecznik i jego lampy, aby płonęły co wieczór. W ten oto sposób przestrzegamy rozkazu PANA, naszego Boga, ale wy go opuściliście."
  tags: []
"2Krn13,12":
  text: "Oto więc z nami na czele jest Bóg wraz ze swoimi kapłanami mającymi głośne trąby, aby grzmiały przeciwko wam. Synowie Izraela, nie walczcie z PANEM, Bogiem waszych ojców, bo wam się nie powiedzie."
  tags: []
"2Krn13,13":
  text: "Tymczasem Jeroboam rozkazał uczynić zasadzkę i napaść ich od tyłu. I stali oni przed Judą, a zasadzka była na tyłach."
  tags: []
"2Krn13,14":
  text: "Gdy synowie Judy zobaczyli, że walka toczy się z przodu i z tyłu, wołali do PANA, a kapłani zadęli w trąby."
  tags: []
"2Krn13,15":
  text: "Mężczyźni Judy wydali też okrzyk. I kiedy wydali okrzyk, Bóg poraził Jeroboama i całego Izraela przed Abiaszem i Judą."
  tags: []
"2Krn13,16":
  text: "I synowie Izraela uciekali przed Judą, ale Bóg wydał ich w ich ręce."
  tags: []
"2Krn13,17":
  text: "I Abiasz i jego lud zadali im wielką klęskę, tak że spośród Izraela poległo pięćset tysięcy wyborowych mężczyzn."
  tags: []
"2Krn13,18":
  text: "W tym czasie więc synowie Izraela zostali upokorzeni, a umocnili się synowie Judy, ponieważ polegali na PANU, Bogu swoich ojców."
  tags: []
"2Krn13,19":
  text: "I Abiasz ścigał Jeroboama, i odebrał mu miasta: Betel, Jeszanę i Efron razem z należącymi do nich wioskami."
  tags: []
"2Krn13,20":
  text: "Jeroboam nie mógł powrócić już do sił za dni Abiasza i PAN poraził go tak, że umarł."
  tags: []
"2Krn13,21":
  text: "A Abiasz umocnił się i wziął sobie czternaście żon, i spłodził dwudziestu dwóch synów i szesnaście córek."
  tags: []
"2Krn13,22":
  text: "Ale pozostałe dzieje Abiasza, jego czyny i słowa są zapisane w księdze proroka Iddo."
  tags: []
