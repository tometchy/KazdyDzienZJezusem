"2Krn9,1":
  text: "A gdy królowa Saby usłyszała o sławie Salomona, przybyła do Jerozolimy, aby przez zagadki poddać go próbie. Przybyła z bardzo wielkim orszakiem, z wielbłądami niosącymi wonności, bardzo dużo złota i drogocennych kamieni. Gdy przyszła do Salomona, rozmawiała z nim o wszystkim, co leżało jej na sercu."
  tags: []
"2Krn9,2":
  text: "Salomon zaś odpowiedział na wszystkie jej pytania. Nie było nic tajemnego dla Salomona, na co nie mógłby jej odpowiedzieć."
  tags: []
"2Krn9,3":
  text: "Gdy więc królowa Saby ujrzała mądrość Salomona i dom, który zbudował;"
  tags: []
"2Krn9,4":
  text: "A także potrawy jego stołu, siadanie jego sług, stawanie jego służących, ich szaty, jego podczaszych i ich szaty oraz schody, po których wstępował do domu PANA, dech zamarł jej w piersi."
  tags: []
"2Krn9,5":
  text: "Wtedy przemówiła do króla: Prawdziwa była ta wieść, którą słyszałam w mojej ziemi o twoich dziełach i twojej mądrości."
  tags: []
"2Krn9,6":
  text: "Jednak nie wierzyłam ich słowom, aż przybyłam i zobaczyłam to wszystko na własne oczy. I oto nie powiedziano mi nawet połowy o twojej wielkiej mądrości. Przeszedłeś bowiem sławę, o której słyszałam."
  tags: []
"2Krn9,7":
  text: "Błogosławieni twoi ludzie i błogosławieni twoi słudzy, którzy zawsze stoją przed tobą i słuchają twojej mądrości."
  tags: []
"2Krn9,8":
  text: "Niech będzie błogosławiony PAN, twój Bóg, który cię sobie upodobał, aby cię posadzić na swoim tronie jako króla dla PANA, twojego Boga. A ponieważ twój Bóg umiłował Izraela, aby go umocnić na wieki, dlatego ustanowił cię królem nad nimi, abyś czynił sąd i sprawiedliwość."
  tags: []
"2Krn9,9":
  text: "I dała królowi sto dwadzieścia talentów złota i bardzo wiele wonności oraz drogocennych kamieni. Nigdy nie przywieziono takich wonności, jakie królowa Saby dała królowi Salomonowi."
  tags: []
"2Krn9,10":
  text: "Ponadto słudzy Hurama i słudzy Salomona, którzy przywieźli złoto z Ofiru, sprowadzili także drzewa sandałowe i drogocenne kamienie."
  tags: []
"2Krn9,11":
  text: "Z tego drzewa sandałowego król wykonał schody do domu PANA i do domu królewskiego oraz harfy i cytry dla śpiewaków. Nigdy przedtem nie widziano takich rzeczy w ziemi Judy."
  tags: []
"2Krn9,12":
  text: "Król Salomon dał królowej Saby wszystko, czego zapragnęła i o co poprosiła, nie licząc daru za to, co przyniosła do króla. Potem odjechała i wróciła do swojej ziemi razem ze swoimi sługami."
  tags: []
"2Krn9,13":
  text: "A waga złota, które wpływało do Salomona w ciągu jednego roku, wynosiła sześćset sześćdziesiąt sześć talentów złota;"
  tags: []
"2Krn9,14":
  text: "Nie licząc tego, co dostawał od kupców i handlarzy. Także wszyscy królowie arabscy i namiestnicy ziemi przywozili złoto i srebro Salomonowi."
  tags: []
"2Krn9,15":
  text: "Wykonał więc król Salomon dwieście tarczy z kutego złota. Na każdą tarczę wychodziło sześćset syklów kutego złota."
  tags: []
"2Krn9,16":
  text: "Wykonał także trzysta puklerzy z kutego złota. Na każdy puklerz wychodziło trzysta syklów złota. I król umieścił je w domu lasu Libanu."
  tags: []
"2Krn9,17":
  text: "Król sporządził także wielki tron z kości słoniowej i pokrył go szczerym złotem."
  tags: []
"2Krn9,18":
  text: "Tron miał sześć stopni, a podnóżek był ze złota, przymocowany do tronu. Po obu stronach siedzenia były poręcze, a przy poręczach stały dwa lwy."
  tags: []
"2Krn9,19":
  text: "Dwanaście lwów stało na tych sześciu stopniach po obu stronach. Czegoś takiego nie uczyniono w żadnym innym królestwie."
  tags: []
"2Krn9,20":
  text: "Wszystkie też naczynia, z których pił król Salomon, były złote, i wszystkie sprzęty w domu lasu Libanu były ze szczerego złota. Nie było nic ze srebra, gdyż nie uważano go za cenne w czasach Salomona."
  tags: []
"2Krn9,21":
  text: "Królewskie okręty pływały bowiem do Tarszisz wraz ze sługami Hurama. Raz na trzy lata okręty wracały z Tarszisz, przywożąc złoto, srebro, kości słoniowe, małpy i pawie."
  tags: []
"2Krn9,22":
  text: "I tak król Salomon przewyższał wszystkich królów ziemi bogactwem i mądrością."
  tags: []
"2Krn9,23":
  text: "Wszyscy więc królowie ziemi pragnęli widzieć Salomona, aby słuchać jego mądrości, którą Bóg włożył w jego serce."
  tags: []
"2Krn9,24":
  text: "Każdy z nich przynosił mu swoje dary: naczynia srebrne i złote, szaty, zbroje, wonności, konie i muły, rokrocznie."
  tags: []
"2Krn9,25":
  text: "I Salomon miał cztery tysiące przegród dla koni i rydwanów oraz dwanaście tysięcy jeźdźców, których rozmieścił po miastach rydwanów i przy królu w Jerozolimie."
  tags: []
"2Krn9,26":
  text: "I panował nad wszystkimi królami od rzeki aż do ziemi Filistynów i do granicy Egiptu."
  tags: []
"2Krn9,27":
  text: "Król sprawił, że srebro w Jerozolimie było jak kamienie, a cedry tak liczne jak sykomory na nizinie."
  tags: []
"2Krn9,28":
  text: "Sprowadzono też dla Salomona konie z Egiptu i ze wszystkich innych ziem."
  tags: []
"2Krn9,29":
  text: "A pozostałych dziejów Salomona, od pierwszych do ostatnich, czy nie zapisano w księdze proroka Natana, w proroctwie Achiasza Szilonity i w widzeniach Jeddo widzącego przeciw Jeroboamowi, synowi Nebata?"
  tags: []
"2Krn9,30":
  text: "I Salomon królował w Jerozolimie nad całym Izraelem czterdzieści lat."
  tags: []
"2Krn9,31":
  text: "Potem Salomon zasnął ze swoimi ojcami i pochowano go w mieście Dawida, jego ojca, a syn jego Roboam królował w jego miejsce."
  tags: []
