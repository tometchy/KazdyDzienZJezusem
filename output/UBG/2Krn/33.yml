"2Krn33,1":
  text: "Manasses miał dwanaście lat, kiedy zaczął królować, i królował pięćdziesiąt pięć lat w Jerozolimie."
  tags: []
"2Krn33,2":
  text: "Czynił on to, co złe w oczach PANA, według obrzydliwości tych narodów, które PAN wypędził przed synami Izraela."
  tags: []
"2Krn33,3":
  text: "Odbudował bowiem wyżyny, które zburzył jego ojciec Ezechiasz, wznosił ołtarze dla Baalów, posadził gaje i oddawał pokłon całemu zastępowi nieba, i służył im."
  tags: []
"2Krn33,4":
  text: "Zbudował też ołtarze w domu PANA, o którym PAN powiedział: W Jerozolimie będzie moje imię na wieki."
  tags: []
"2Krn33,5":
  text: "Ponadto zbudował ołtarze całemu zastępowi nieba w obydwu dziedzińcach domu PANA."
  tags: []
"2Krn33,6":
  text: "Przeprowadził swoich synów przez ogień w dolinie syna Hinnom. Uprawiał wróżbiarstwo, czary i magię, ustanowił czarowników i czarnoksiężników. Bardzo dużo złego czynił w oczach PANA, pobudzając go do gniewu."
  tags: []
"2Krn33,7":
  text: "Postawił też posąg rzeźbiony, który wykonał, w domu Bożym, o którym Bóg powiedział do Dawida i do jego syna Salomona: W tym domu i w Jerozolimie, które wybrałem spośród wszystkich pokoleń Izraela, umieszczę swoje imię na wieki;"
  tags: []
"2Krn33,8":
  text: "A już nie dopuszczę, by noga Izraela opuściła ziemię, którą przeznaczyłem waszym ojcom, jeśli tylko pilnie będą przestrzegali wszystkiego, co im nakazałem, według całego prawa, nakazów i ustaw przekazanych przez Mojżesza."
  tags: []
"2Krn33,9":
  text: "Manasses zwiódł Judę i mieszkańców Jerozolimy tak, że postępowali gorzej niż narody, które PAN wytracił przed synami Izraela."
  tags: []
"2Krn33,10":
  text: "Chociaż bowiem PAN mówił do Manassesa i do jego ludu, oni nie słuchali."
  tags: []
"2Krn33,11":
  text: "Dlatego PAN sprowadził na nich dowódców wojska króla Asyrii, którzy pojmali Manassesa spośród cierni, zakuli go w łańcuchy i zaprowadzili do Babilonu."
  tags: []
"2Krn33,12":
  text: "Kiedy znalazł się w ucisku, modlił się do PANA, swego Boga, i bardzo się ukorzył przed Bogiem swoich ojców;"
  tags: []
"2Krn33,13":
  text: "I modlił się do niego. A on dał się przebłagać, wysłuchał jego modlitwy i przywrócił go do Jerozolimy, do jego królestwa. Wtedy Manasses uznał, że PAN jest Bogiem."
  tags: []
"2Krn33,14":
  text: "Potem zbudował zewnętrzny mur miasta Dawida, na zachód w kierunku Gichonu, w dolinie, aż do wejścia do Bramy Rybnej, otoczył nim Ofel i wzniósł go bardzo wysoko. Ustanowił też dowódców we wszystkich warownych miastach Judy."
  tags: []
"2Krn33,15":
  text: "Usunął również cudzych bogów i posąg z domu PANA oraz wszystkie ołtarze, które zbudował na górze domu PANA i w Jerozolimie, następnie wyrzucił poza miasto."
  tags: []
"2Krn33,16":
  text: "Odnowił ołtarz PANA i złożył na nim ofiary pojednawcze i dziękczynne, i nakazał Judzie służyć PANU, Bogu Izraela."
  tags: []
"2Krn33,17":
  text: "Lud jednak jeszcze składał ofiary na wyżynach, ale tylko PANU, swemu Bogu."
  tags: []
"2Krn33,18":
  text: "A pozostałe dzieje Manassesa, jego modlitwa do swojego Boga i słowa widzących, którzy przemawiali do niego w imię PANA, Boga Izraela, są zapisane w księdze królów Izraela."
  tags: []
"2Krn33,19":
  text: "Jego modlitwa, to, jak został wysłuchany, każdy jego grzech, każde przewinienie oraz miejsca, na których zbudował wyżyny i wystawił gaje i posągi, zanim się ukorzył, są zapisane w księgach widzących."
  tags: []
"2Krn33,20":
  text: "Potem Manasses zasnął ze swoimi ojcami i pogrzebano go w jego domu, a jego syn Amon królował w jego miejsce."
  tags: []
"2Krn33,21":
  text: "Amon miał dwadzieścia dwa lata, kiedy zaczął królować, i królował dwa lata w Jerozolimie."
  tags: []
"2Krn33,22":
  text: "I czynił to, co złe w oczach PANA, tak jak czynił jego ojciec Manasses. Amon bowiem składał ofiary wszystkim posągom, które sporządził jego ojciec Manasses, i służył im."
  tags: []
"2Krn33,23":
  text: "A nie ukorzył się przed PANEM, tak jak ukorzył się jego ojciec Manasses. Przeciwnie, Amon grzeszył coraz bardziej."
  tags: []
"2Krn33,24":
  text: "I jego słudzy sprzysięgli się przeciwko niemu, i zabili go w jego domu."
  tags: []
"2Krn33,25":
  text: "Ale lud tej ziemi zabił wszystkich, którzy sprzysięgli się przeciw królowi Amonowi, a potem ustanowił jego syna Jozjasza królem w jego miejsce."
  tags: []
