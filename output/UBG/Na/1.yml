"Na1,1": "Brzemię Niniwy. Księga widzenia Nahuma Elkoszyty."
"Na1,2": "PAN jest Bogiem zazdrosnym i mściwym; PAN jest mściwy i pełen gniewu; PAN mści się nad swoimi przeciwnikami i zachowuje gniew wobec swoich wrogów."
"Na1,3": "PAN jest nieskory do gniewu i wielki w mocy, a winnego nie uniewinni. Droga PANA jest w wichrze i w burzy, a obłok jest prochem pod jego stopami."
"Na1,4": "On gromi morze i je wysusza, wysusza też wszystkie rzeki. Przed nim Baszan i Karmel mdleje, a kwiat Libanu więdnie;"
"Na1,5": "Góry drżą przed nim, a pagórki się rozpływają; ziemia płonie przed jego obliczem, okrąg ziemi i wszyscy jej mieszkańcy."
"Na1,6": "Któż się ostoi przed jego oburzeniem? Kto wytrzyma zapalczywość jego gniewu? Jego gniew wylewa się jak ogień, a skały rozpadają się przed nim."
"Na1,7": "Dobry jest PAN – warownia w dniu ucisku; zna tych, którzy mu ufają."
"Na1,8": "Ale gwałtowną powodzią zniszczy jej miejsce, ciemność będzie ścigała jego wrogów."
"Na1,9": "Co zamierzacie przeciwko PANU? On dokona zniszczenia, ucisk nie powstanie po raz drugi."
"Na1,10": "Gdy bowiem będą jak splecione ciernie i jak pijacy upojeni winem, jak suche ściernisko do szczętu spłoną."
"Na1,11": "Z ciebie wyszedł ten, który obmyślił zło przeciwko PANU, doradca nikczemny."
"Na1,12": "Tak mówi PAN: Chociaż są spokojni i tak liczni, będą jednak skoszeni, gdy przejdzie. Chociaż cię trapiłem, już więcej nie będę cię trapił."
"Na1,13": "Teraz bowiem złamię jego jarzmo, aby na tobie nie leżało, a rozerwę twoje więzy."
"Na1,14": "O tobie PAN rozkazał, że twoje imię już nie będzie miało więcej potomstwa. Wyniszczę z domu twoich bogów rzeźbione i lane posągi. Przygotuję ci grób, gdyż jesteś nikczemny."
"Na1,15": "Oto na górach nogi opowiadającego dobre wieści, zwiastującego pokój. Obchodź, Judo, swoje uroczyste święta, wypełniaj swoje śluby. Nikczemnik bowiem już nie przejdzie przez ciebie, został doszczętnie zgładzony."
