"Na1,1":
  text: "Brzemię Niniwy. Księga widzenia Nahuma Elkoszyty."
  tags: []
"Na1,2":
  text: "PAN jest Bogiem zazdrosnym i mściwym; PAN jest mściwy i pełen gniewu; PAN mści się nad swoimi przeciwnikami i zachowuje gniew wobec swoich wrogów."
  tags: []
"Na1,3":
  text: "PAN jest nieskory do gniewu i wielki w mocy, a winnego nie uniewinni. Droga PANA jest w wichrze i w burzy, a obłok jest prochem pod jego stopami."
  tags: []
"Na1,4":
  text: "On gromi morze i je wysusza, wysusza też wszystkie rzeki. Przed nim Baszan i Karmel mdleje, a kwiat Libanu więdnie;"
  tags: []
"Na1,5":
  text: "Góry drżą przed nim, a pagórki się rozpływają; ziemia płonie przed jego obliczem, okrąg ziemi i wszyscy jej mieszkańcy."
  tags: []
"Na1,6":
  text: "Któż się ostoi przed jego oburzeniem? Kto wytrzyma zapalczywość jego gniewu? Jego gniew wylewa się jak ogień, a skały rozpadają się przed nim."
  tags: []
"Na1,7":
  text: "Dobry jest PAN – warownia w dniu ucisku; zna tych, którzy mu ufają."
  tags: []
"Na1,8":
  text: "Ale gwałtowną powodzią zniszczy jej miejsce, ciemność będzie ścigała jego wrogów."
  tags: []
"Na1,9":
  text: "Co zamierzacie przeciwko PANU? On dokona zniszczenia, ucisk nie powstanie po raz drugi."
  tags: []
"Na1,10":
  text: "Gdy bowiem będą jak splecione ciernie i jak pijacy upojeni winem, jak suche ściernisko do szczętu spłoną."
  tags: []
"Na1,11":
  text: "Z ciebie wyszedł ten, który obmyślił zło przeciwko PANU, doradca nikczemny."
  tags: []
"Na1,12":
  text: "Tak mówi PAN: Chociaż są spokojni i tak liczni, będą jednak skoszeni, gdy przejdzie. Chociaż cię trapiłem, już więcej nie będę cię trapił."
  tags: []
"Na1,13":
  text: "Teraz bowiem złamię jego jarzmo, aby na tobie nie leżało, a rozerwę twoje więzy."
  tags: []
"Na1,14":
  text: "O tobie PAN rozkazał, że twoje imię już nie będzie miało więcej potomstwa. Wyniszczę z domu twoich bogów rzeźbione i lane posągi. Przygotuję ci grób, gdyż jesteś nikczemny."
  tags: []
"Na1,15":
  text: "Oto na górach nogi opowiadającego dobre wieści, zwiastującego pokój. Obchodź, Judo, swoje uroczyste święta, wypełniaj swoje śluby. Nikczemnik bowiem już nie przejdzie przez ciebie, został doszczętnie zgładzony."
  tags: []
