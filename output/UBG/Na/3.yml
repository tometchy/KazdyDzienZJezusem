"Na3,1": "Biada krwawemu miastu! Jest ono całe pełne kłamstwa i grabieży, a łup z niego nie wychodzi."
"Na3,2": "Słychać trzask biczów, grzmot kół, tupanie koni i podskakiwanie rydwanów."
"Na3,3": "Jeździec dobywa błyszczący miecz i lśniący oszczep. Mnóstwo rannych i tak wielka ilość trupów, że nie można ich zliczyć; potykają się o zwłoki."
"Na3,4": "Z powodu mnóstwa czynów nierządu tej rozkosznej nierządnicy, mistrzyni czarów, która zaprzedawała narody swoim nierządem i ludy swoimi czarami."
"Na3,5": "Oto jestem przeciwko tobie, mówi PAN zastępów, odkryję poły twojej szaty aż do twarzy i ukażę narodom twoją nagość, a królestwom – twoją hańbę."
"Na3,6": "Rzucę na ciebie obrzydliwości, znieważę cię i wystawię cię na widowisko."
"Na3,7": "Ten, kto cię ujrzy, oddali się od ciebie i powie: Zburzona jest Niniwa, któż będzie jej żałował? Gdzie mam szukać dla ciebie pocieszycieli?"
"Na3,8": "Czy jesteś lepsza niż ludne miasto No, które leżało pomiędzy rzekami, otoczone wodami, którego wałem było morze i morze jego murem?"
"Na3,9": "Etiopia i Egipt były jego siłą, nieograniczona; Put i Libijczycy byli jego pomocą."
"Na3,10": "Ono jednak zostało uprowadzone do niewoli, jego niemowlęta roztrzaskiwano na rogach wszystkich ulic, o jego najsławniejszych rzucano losy i wszystkich jego wielkich zakuto w kajdany."
"Na3,11": "Także i ty będziesz upojona. Ukryjesz się i będziesz szukać pomocy przeciwko wrogowi."
"Na3,12": "Wszystkie twoje twierdze są jak drzewo figowe z wczesnymi owocami. Gdy się nimi potrząśnie, wpadają do ust jedzącego."
"Na3,13": "Oto twój lud pośród ciebie to kobiety. Bramy twojej ziemi będą szeroko otwarte przed twoimi wrogami. Ogień strawi twoje rygle."
"Na3,14": "Naczerp sobie wody na oblężenie, umacniaj swoje twierdze. Wejdź w błoto, depcz glinę i napraw piec."
"Na3,15": "Tam cię pochłonie ogień, wytnie cię miecz, pożre cię jak larwa. Rozmnóż się jak larwa, rozmnóż się jak szarańcza."
"Na3,16": "Rozmnożyłaś swoich kupców ponad gwiazdy niebios. Jak larwa pożerają i odlatują."
"Na3,17": "Twoi szlachetni są jak szarańcza, twoi dowódcy – jak wielkie koniki polne, które siadają na płotach w czasie zimy, lecz gdy słońce wschodzi, odlatują i nie wiadomo, gdzie są."
"Na3,18": "Drzemią twoi pasterze, królu Asyrii! Twoi sławni będą leżeć, twój lud rozproszył się po górach, ale nikt go nie zgromadzi."
"Na3,19": "Nie ma lekarstwa na twoją ranę, twoje zranienie jest nieuleczalne. Wszyscy, którzy usłyszą wieść o tobie, będą klaskać w dłonie nad tobą. Kogo bowiem nie dotykało nieustannie twoje okrucieństwo?"
