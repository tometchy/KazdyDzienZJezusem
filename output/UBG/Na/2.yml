"Na2,1":
  text: "Nadciąga niszczyciel przeciwko tobie! Strzeż miejsc obronnych, obserwuj drogę, wzmocnij biodra i zbierz wszystkie swe siły."
  tags: []
"Na2,2":
  text: "PAN bowiem odwrócił pychę Jakuba jak pychę Izraela, gdyż złupili ich grabieżcy i zniszczyli ich latorośle."
  tags: []
"Na2,3":
  text: "Tarcza jego mocarzy czerwona, jego wojownicy ubrani w szkarłat, rydwany będą jak płonące pochodnie w dniu jego przygotowania, a jodły będą strasznie się trząść."
  tags: []
"Na2,4":
  text: "Rydwany po ulicach będą szaleć i na rynku skrzypieć. Z wyglądu będą podobne do pochodni, jak błyskawice będą pędzić."
  tags: []
"Na2,5":
  text: "Wezwie swoich mocarzy; zatoczą się w swoim pochodzie, pospieszą się do murów, obrona będzie przygotowana."
  tags: []
"Na2,6":
  text: "Bramy przy rzekach otworzą się i pałac się rozpłynie;"
  tags: []
"Na2,7":
  text: "A Chusab zostanie uprowadzona do niewoli, jej służące będą ją prowadzić, jęcząc jak gołębie i bijąc się w piersi."
  tags: []
"Na2,8":
  text: "A Niniwa od swego początku była jak sadzawka wód, ale uciekną. I choć ktoś powie: Stójcie, stójcie! – nikt jednak się nie obejrzy."
  tags: []
"Na2,9":
  text: "Rabujcie srebro, rabujcie złoto, bo nie ma końca bogactwo i przepych wszystkich kosztowności."
  tags: []
"Na2,10":
  text: "Pusta, opróżniona i spustoszona! Serce topnieje, trzęsą się kolana, czuć ból w biodrach wszystkich ludzi, a twarze wszystkich czernieją."
  tags: []
"Na2,11":
  text: "Gdzie jest jaskinia lwów i pastwisko lwiąt, dokąd chodziły lew, ten wielki lew, oraz lwięta, a nie było nikogo, kto by je straszył?"
  tags: []
"Na2,12":
  text: "Lew już dosyć rozszarpał ofiar dla swych lwiąt i zadusił je dla swoich lwic, napełniał łupem swoje jaskinie, a zdobyczą swoje legowiska."
  tags: []
"Na2,13":
  text: "Oto jestem przeciwko tobie, mówi PAN zastępów, spalę na proch twoje rydwany i twoje lwięta pożre miecz. Wykorzenię z ziemi twój łup i nie będzie już słychać głosu twoich posłów."
  tags: []
