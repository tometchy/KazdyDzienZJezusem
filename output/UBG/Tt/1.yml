"Tt1,1":
  text: "Paweł, sługa Boga i apostoł Jezusa Chrystusa według wiary wybranych Bożych i poznania prawdy, która jest zgodna z pobożnością;"
  tags: []
"Tt1,2":
  text: "W nadziei życia wiecznego, które obiecał przed dawnymi wiekami ten, który nie kłamie, Bóg;"
  tags: []
"Tt1,3":
  text: "I we właściwym czasie objawił swoje słowo przez głoszenie, które zostało mi powierzone zgodnie z nakazem Boga, naszego Zbawiciela;"
  tags: []
"Tt1,4":
  text: "Do Tytusa, mego własnego syna we wspólnej wierze. Łaska, miłosierdzie i pokój od Boga Ojca i Pana Jezusa Chrystusa, naszego Zbawiciela."
  tags: []
"Tt1,5":
  text: "Zostawiłem cię na Krecie w tym celu, abyś uporządkował to, co tam jeszcze zostało do zrobienia, i ustanowił w każdym mieście starszych, jak ci nakazałem;"
  tags: []
"Tt1,6":
  text: "Jeśli ktoś jest nienaganny, mąż jednej żony, mający dzieci wierne, nieobwiniane o hulaszcze życie lub niekarność."
  tags: []
"Tt1,7":
  text: "Biskup bowiem, jako szafarz Boży, ma być nienaganny, niesamowolny, nieskory do gniewu, nieoddający się piciu wina, nieskłonny do bicia, niegoniący za brudnym zyskiem;"
  tags: []
"Tt1,8":
  text: "Lecz gościnny, miłujący dobro, roztropny, sprawiedliwy, święty, powściągliwy;"
  tags: []
"Tt1,9":
  text: "Trzymający się wiernego słowa, zgodnego z nauką, aby też mógł przez zdrową naukę napominać i przekonywać tych, którzy się sprzeciwiają."
  tags: []
"Tt1,10":
  text: "Jest bowiem wielu niekarnych, oddających się czczej gadaninie i zwodzicieli, zwłaszcza wśród obrzezanych."
  tags: []
"Tt1,11":
  text: "Im trzeba zamknąć usta, gdyż całe domy wywracają, nauczając, czego nie należy, dla brudnego zysku."
  tags: []
"Tt1,12":
  text: "Jeden z nich, ich własny prorok, powiedział: Kreteńczycy to zawsze kłamcy, złe bestie, brzuchy leniwe."
  tags: []
"Tt1,13":
  text: "Świadectwo to jest prawdziwe. Dlatego karć ich surowo, aby byli zdrowi w wierze;"
  tags: []
"Tt1,14":
  text: "I nie zajmowali się żydowskimi baśniami i przykazaniami ludzi odwracających się od prawdy."
  tags: []
"Tt1,15":
  text: "Dla czystych wszystko jest czyste, natomiast dla skalanych i niewierzących nie ma nic czystego, lecz skalany jest zarówno ich umysł, jak i sumienie."
  tags: []
"Tt1,16":
  text: "Twierdzą, że znają Boga, ale swymi uczynkami temu przeczą, budząc obrzydzenie, będąc nieposłusznymi i niezdolnymi do wszelkiego dobrego uczynku."
  tags: []
