"Tt1,1": "Paweł, sługa Boga i apostoł Jezusa Chrystusa według wiary wybranych Bożych i poznania prawdy, która jest zgodna z pobożnością;"
"Tt1,2": "W nadziei życia wiecznego, które obiecał przed dawnymi wiekami ten, który nie kłamie, Bóg;"
"Tt1,3": "I we właściwym czasie objawił swoje słowo przez głoszenie, które zostało mi powierzone zgodnie z nakazem Boga, naszego Zbawiciela;"
"Tt1,4": "Do Tytusa, mego własnego syna we wspólnej wierze. Łaska, miłosierdzie i pokój od Boga Ojca i Pana Jezusa Chrystusa, naszego Zbawiciela."
"Tt1,5": "Zostawiłem cię na Krecie w tym celu, abyś uporządkował to, co tam jeszcze zostało do zrobienia, i ustanowił w każdym mieście starszych, jak ci nakazałem;"
"Tt1,6": "Jeśli ktoś jest nienaganny, mąż jednej żony, mający dzieci wierne, nieobwiniane o hulaszcze życie lub niekarność."
"Tt1,7": "Biskup bowiem, jako szafarz Boży, ma być nienaganny, niesamowolny, nieskory do gniewu, nieoddający się piciu wina, nieskłonny do bicia, niegoniący za brudnym zyskiem;"
"Tt1,8": "Lecz gościnny, miłujący dobro, roztropny, sprawiedliwy, święty, powściągliwy;"
"Tt1,9": "Trzymający się wiernego słowa, zgodnego z nauką, aby też mógł przez zdrową naukę napominać i przekonywać tych, którzy się sprzeciwiają."
"Tt1,10": "Jest bowiem wielu niekarnych, oddających się czczej gadaninie i zwodzicieli, zwłaszcza wśród obrzezanych."
"Tt1,11": "Im trzeba zamknąć usta, gdyż całe domy wywracają, nauczając, czego nie należy, dla brudnego zysku."
"Tt1,12": "Jeden z nich, ich własny prorok, powiedział: Kreteńczycy to zawsze kłamcy, złe bestie, brzuchy leniwe."
"Tt1,13": "Świadectwo to jest prawdziwe. Dlatego karć ich surowo, aby byli zdrowi w wierze;"
"Tt1,14": "I nie zajmowali się żydowskimi baśniami i przykazaniami ludzi odwracających się od prawdy."
"Tt1,15": "Dla czystych wszystko jest czyste, natomiast dla skalanych i niewierzących nie ma nic czystego, lecz skalany jest zarówno ich umysł, jak i sumienie."
"Tt1,16": "Twierdzą, że znają Boga, ale swymi uczynkami temu przeczą, budząc obrzydzenie, będąc nieposłusznymi i niezdolnymi do wszelkiego dobrego uczynku."
