"Tt2,1": "Ty zaś mów to, co jest zgodne ze zdrową nauką."
"Tt2,2": "Starsi mężczyźni niech będą trzeźwi, poważni, roztropni, zdrowi w wierze, w miłości, w cierpliwości."
"Tt2,3": "Podobnie starsze kobiety niech zachowują się w sposób godny świętych, niech nie oczerniają, nie nadużywają wina, uczą tego, co dobre."
"Tt2,4": "Niech uczą młodsze kobiety rozsądku, jak mają kochać swoich mężów i dzieci;"
"Tt2,5": "Żeby były roztropne, czyste, żeby zajmowały się domem, były dobre, posłuszne swoim mężom, aby nie bluźniono słowu Bożemu."
"Tt2,6": "Młodzieńców także napominaj, aby byli trzeźwi."
"Tt2,7": "We wszystkim stawiaj samego siebie za wzór dobrych uczynków. W nauczaniu okazuj prawość, powagę;"
"Tt2,8": "Słowa zdrowe, nienaganne, aby ten, kto się sprzeciwia, był zawstydzony, nie mając o was nic złego do powiedzenia."
"Tt2,9": "Sługi nauczaj, aby byli poddani swoim panom i we wszystkim się im podobali, nie sprzeciwiając się;"
"Tt2,10": "Niczego sobie nie przywłaszczając, ale we wszystkim okazując doskonałą wierność, aby we wszystkim zdobili naukę Boga, naszego Zbawiciela."
"Tt2,11": "Objawiła się bowiem łaska Boga, niosąca zbawienie wszystkim ludziom;"
"Tt2,12": "Pouczająca nas, abyśmy wyrzekłszy się bezbożności i światowych pożądliwości, trzeźwo, sprawiedliwie i pobożnie żyli na tym świecie;"
"Tt2,13": "Oczekując błogosławionej nadziei i chwalebnego objawienia się wielkiego Boga i Zbawiciela naszego, Jezusa Chrystusa;"
"Tt2,14": "Który wydał samego siebie za nas, aby nas wykupić od wszelkiej nieprawości i oczyścić sobie lud na własność, gorliwy w spełnianiu dobrych uczynków."
"Tt2,15": "To mów, do tego zachęcaj i strofuj z całą powagą; niech nikt tobą nie gardzi."
