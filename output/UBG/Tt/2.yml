"Tt2,1":
  text: "Ty zaś mów to, co jest zgodne ze zdrową nauką."
  tags: []
"Tt2,2":
  text: "Starsi mężczyźni niech będą trzeźwi, poważni, roztropni, zdrowi w wierze, w miłości, w cierpliwości."
  tags: []
"Tt2,3":
  text: "Podobnie starsze kobiety niech zachowują się w sposób godny świętych, niech nie oczerniają, nie nadużywają wina, uczą tego, co dobre."
  tags: []
"Tt2,4":
  text: "Niech uczą młodsze kobiety rozsądku, jak mają kochać swoich mężów i dzieci;"
  tags: []
"Tt2,5":
  text: "Żeby były roztropne, czyste, żeby zajmowały się domem, były dobre, posłuszne swoim mężom, aby nie bluźniono słowu Bożemu."
  tags: []
"Tt2,6":
  text: "Młodzieńców także napominaj, aby byli trzeźwi."
  tags: []
"Tt2,7":
  text: "We wszystkim stawiaj samego siebie za wzór dobrych uczynków. W nauczaniu okazuj prawość, powagę;"
  tags: []
"Tt2,8":
  text: "Słowa zdrowe, nienaganne, aby ten, kto się sprzeciwia, był zawstydzony, nie mając o was nic złego do powiedzenia."
  tags: []
"Tt2,9":
  text: "Sługi nauczaj, aby byli poddani swoim panom i we wszystkim się im podobali, nie sprzeciwiając się;"
  tags: []
"Tt2,10":
  text: "Niczego sobie nie przywłaszczając, ale we wszystkim okazując doskonałą wierność, aby we wszystkim zdobili naukę Boga, naszego Zbawiciela."
  tags: []
"Tt2,11":
  text: "Objawiła się bowiem łaska Boga, niosąca zbawienie wszystkim ludziom;"
  tags: []
"Tt2,12":
  text: "Pouczająca nas, abyśmy wyrzekłszy się bezbożności i światowych pożądliwości, trzeźwo, sprawiedliwie i pobożnie żyli na tym świecie;"
  tags: []
"Tt2,13":
  text: "Oczekując błogosławionej nadziei i chwalebnego objawienia się wielkiego Boga i Zbawiciela naszego, Jezusa Chrystusa;"
  tags: []
"Tt2,14":
  text: "Który wydał samego siebie za nas, aby nas wykupić od wszelkiej nieprawości i oczyścić sobie lud na własność, gorliwy w spełnianiu dobrych uczynków."
  tags: []
"Tt2,15":
  text: "To mów, do tego zachęcaj i strofuj z całą powagą; niech nikt tobą nie gardzi."
  tags: []
