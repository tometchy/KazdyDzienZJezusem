"Tt3,1":
  text: "Przypominaj im, aby zwierzchnościom i władzom byli poddani i posłuszni, gotowi do każdego dobrego uczynku;"
  tags: []
"Tt3,2":
  text: "Nikomu nie ubliżali, nie byli kłótliwi, ale uprzejmi, okazujący wszelką łagodność wobec wszystkich ludzi."
  tags: []
"Tt3,3":
  text: "Niegdyś bowiem i my byliśmy głupi, oporni, błądzący, służący rozmaitym pożądliwościom i rozkoszom, żyjący w złośliwości i zazdrości, znienawidzeni i nienawidzący jedni drugich."
  tags: []
"Tt3,4":
  text: "Lecz gdy się objawiła dobroć i miłość Boga, naszego Zbawiciela, względem ludzi;"
  tags: []
"Tt3,5":
  text: "Nie z uczynków sprawiedliwości, które my spełniliśmy, ale według swego miłosierdzia zbawił nas przez obmycie odrodzenia i odnowienie Ducha Świętego;"
  tags: []
"Tt3,6":
  text: "Którego wylał na nas obficie przez Jezusa Chrystusa, naszego Zbawiciela;"
  tags: []
"Tt3,7":
  text: "Abyśmy, usprawiedliwieni jego łaską, stali się dziedzicami zgodnie z nadzieją życia wiecznego."
  tags: []
"Tt3,8":
  text: "Wiarygodne to słowo i chcę, abyś o tym zapewniał, żeby ci, którzy uwierzyli Bogu, zabiegali o celowanie w dobrych uczynkach. Jest to dobre i pożyteczne dla ludzi."
  tags: []
"Tt3,9":
  text: "Unikaj zaś głupich dociekań, rodowodów, sporów i kłótni o prawo; są bowiem nieużyteczne i próżne."
  tags: []
"Tt3,10":
  text: "Heretyka po pierwszym i drugim upomnieniu unikaj;"
  tags: []
"Tt3,11":
  text: "Wiedząc, że taki człowiek jest przewrotny i grzeszy, i sam siebie osądza."
  tags: []
"Tt3,12":
  text: "Gdy poślę do ciebie Artemasa lub Tychika, staraj się przybyć do mnie do Nikopolis, bo tam postanowiłem spędzić zimę."
  tags: []
"Tt3,13":
  text: "Zenasa, uczonego w prawie, i Apollosa starannie wypraw, aby im niczego nie brakowało."
  tags: []
"Tt3,14":
  text: "A niech i nasi uczą się przodować w dobrych uczynkach, gdzie tego potrzeba, żeby nie byli bezowocni."
  tags: []
"Tt3,15":
  text: "Pozdrawiają cię wszyscy, którzy są ze mną. Pozdrów tych, którzy nas miłują w wierze. Łaska niech będzie z wami wszystkimi. Amen."
  tags: []
