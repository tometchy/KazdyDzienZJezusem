"Ne13,1":
  text: "W tym dniu odczytano wobec ludu fragment z księgi Mojżesza. I znaleziono w niej zapis o tym, że Ammonita ani Moabita nigdy nie wejdzie do zgromadzenia Bożego;"
  tags: []
"Ne13,2":
  text: "Ponieważ nie wyszli synom Izraela na spotkanie z chlebem i wodą, lecz wynajęli przeciwko nim Balaama, aby ich przeklął. Nasz Bóg jednak przemienił przekleństwo w błogosławieństwo."
  tags: []
"Ne13,3":
  text: "A gdy usłyszeli to prawo, odłączyli od Izraela wszystkich mieszanego pochodzenia."
  tags: []
"Ne13,4":
  text: "Jakiś czas przedtem kapłan Eliaszib, przełożony nad komnatą domu naszego Boga, spowinowacony z Tobiaszem;"
  tags: []
"Ne13,5":
  text: "Przygotował dla niego wielką komnatę, w której składano wcześniej ofiary z pokarmów, kadzidło, naczynia, dziesięciny zboża, moszczu i oliwy, przysługujące Lewitom, śpiewakom i odźwiernym, a także ofiary dla kapłanów."
  tags: []
"Ne13,6":
  text: "Ale przy tym wszystkim nie było mnie w Jerozolimie, gdyż w trzydziestym drugim roku Artakserksesa, króla Babilonu, przyszedłem do króla, a po pewnym czasie wyprosiłem od króla zezwolenie na powrót;"
  tags: []
"Ne13,7":
  text: "A gdy przybyłem do Jerozolimy, dowiedziałem się o występku, którego dopuścił się Eliaszib na korzyść Tobiasza – o tym, że przygotował dla niego komnatę w dziedzińcach domu Bożego."
  tags: []
"Ne13,8":
  text: "A to bardzo mnie oburzyło. Wyrzuciłem więc wszystkie sprzęty domu Tobiasza z komnaty."
  tags: []
"Ne13,9":
  text: "Kazałem wtedy oczyścić te komnaty i z powrotem wniosłem tam sprzęty domu Bożego, dary i kadzidło."
  tags: []
"Ne13,10":
  text: "Dowiedziałem się także, że Lewitom nie dostarczono ich przydziałów im, a Lewici i śpiewacy, którzy wykonywali pracę, rozbiegli się, każdy do swojego pola."
  tags: []
"Ne13,11":
  text: "Zgromiłem więc przełożonych, mówiąc: Czemu dom Boży jest opuszczony? Potem zebrałem ich i postawiłem na ich stanowiskach."
  tags: []
"Ne13,12":
  text: "A cały Juda przyniósł dziesięciny ze zboża, moszczu i oliwy do składnic."
  tags: []
"Ne13,13":
  text: "I nad składnicami ustanowiłem dozorcami Szelemiasza, kapłana, Sadoka, uczonego w Piśmie, i Pedajasza, z Lewitów. Do pomocy mieli Chanana, syna Zakkura, syna Mattaniasza. Oni bowiem uchodzili za wiernych, a ich obowiązkiem było rozdzielanie przydziałów swoim braciom."
  tags: []
"Ne13,14":
  text: "Wspomnij na mnie, mój Boże, za to i nie wymazuj moich dobrych uczynków, których dokonałem dla domu swojego Boga i dla jego służb."
  tags: []
"Ne13,15":
  text: "W tych dniach widziałem w Judzie ludzi tłoczących prasy w szabat i noszących snopy, które kładli na osły, także winogrona, figi i wszelkie ciężary, które przywozili do Jerozolimy w dzień szabatu. I zgromiłem ich za to, że w ten dzień sprzedają żywność."
  tags: []
"Ne13,16":
  text: "Także Tyryjczycy, którzy tam mieszkali, przynosili ryby i wszelki towar, a sprzedawali w szabat synom Judy i w Jerozolimie."
  tags: []
"Ne13,17":
  text: "Dlatego zgromiłem przełożonych w Judzie i powiedziałem do nich: Cóż to jest za nieprawość, której się dopuszczacie, bezczeszcząc dzień szabatu?"
  tags: []
"Ne13,18":
  text: "Czy nie tak postępowali wasi ojcowie, za co nasz Bóg sprowadził całe to nieszczęście na nas i na to miasto? A wy ściągacie jeszcze większy gniew na Izraela, bezczeszcząc szabat."
  tags: []
"Ne13,19":
  text: "A gdy mrok okrył bramy Jerozolimy przed szabatem, rozkazałem zamknąć wrota. Nakazałem też, aby ich nie otwierać aż dopiero po szabacie. Postawiłem również niektórych z moich sług przy bramach, aby nie wnoszono żadnych ciężarów w dzień szabatu."
  tags: []
"Ne13,20":
  text: "Tak więc handlarze i sprzedawcy wszelkiego towaru nocowali raz czy dwa razy poza Jerozolimą."
  tags: []
"Ne13,21":
  text: "Świadczyłem przeciwko nim i powiedziałem do nich: Dlaczego nocujecie przy murze? Jeśli uczynicie to jeszcze raz, podniosę rękę na was. I tak od tego czasu nie przychodzili już w szabat."
  tags: []
"Ne13,22":
  text: "Następnie rozkazałem Lewitom, aby się oczyścili i przyszli czuwać przy bramach, aby uświęcić dzień szabatu. I pamiętaj mnie za to, mój Boże, i zmiłuj się nade mną według obfitości swojego miłosierdzia."
  tags: []
"Ne13,23":
  text: "W tych dniach widziałem też Żydów, którzy pojęli sobie żony aszdodskie, ammonickie i moabskie."
  tags: []
"Ne13,24":
  text: "A połowa ich dzieci mówiła w języku aszdodskim, nie umiejąc mówić po hebrajsku, ale każdy według języka swego narodu."
  tags: []
"Ne13,25":
  text: "Dlatego zgromiłem ich i przekląłem, a niektórych z nich biłem, wyrwałem ich włosy i zaprzysiągłem ich na Boga: Nie wydawajcie swoich córek ich synom ani nie bierzcie ich córek dla waszych synów ani dla siebie."
  tags: []
"Ne13,26":
  text: "Czy nie przez to zgrzeszył Salomon, król Izraela? A przecież wśród wielu narodów nie było króla jak on, był umiłowany przez swego Boga, a Bóg ustanowił go królem nad całym Izraelem. A przecież nawet jego przywiodły do grzechu cudzoziemskie kobiety."
  tags: []
"Ne13,27":
  text: "Czyż i wam pozwolimy na to, abyście dopuszczali się tego wielkiego zła i grzeszyli przeciwko naszemu Bogu, pojmując za żony cudzoziemki?"
  tags: []
"Ne13,28":
  text: "A jeden z synów Jojady, syna arcykapłana Eliasziba, był zięciem Choronity Sanballata. Wygnałem go więc od siebie."
  tags: []
"Ne13,29":
  text: "Zapamiętaj im, mój Boże, że splamili kapłaństwo i przymierze z kapłanami i Lewitami."
  tags: []
"Ne13,30":
  text: "I oczyściłem ich od wszelkiego cudzoziemca, i ustaliłem obowiązki kapłanom i Lewitom, każdemu w swojej służbie;"
  tags: []
"Ne13,31":
  text: "I przepisy dotyczące ofiary drewna w ustalonym czasie, a także pierwocin. Wspomnij na mnie, mój Boże, dla mojego dobra."
  tags: []
