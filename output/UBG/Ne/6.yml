"Ne6,1": "A gdy Sanballat, Tobiasz, Geszem Arab i pozostali nasi wrogowie usłyszeli, że zbudowałem mur i że nie pozostał w nim żaden wyłom, chociaż jeszcze w tym czasie nie wstawiłem wrót do bram;"
"Ne6,2": "Wtedy Sanballat i Geszem wysłali do mnie poselstwo ze słowami: Przyjdź, spotkajmy się razem w jednej ze wsi, na równinie Ono. Lecz oni mieli zamiar uczynić mi coś złego."
"Ne6,3": "Wysłałem więc do nich posłańców z taką odpowiedzią: Wykonuję wielką pracę i nie mogę zejść. Czemu miałaby stanąć ta praca, gdybym jej zaniechał, by zejść do was?"
"Ne6,4": "Cztery razy przysłali do mnie poselstwo w tej sprawie, a ja odpowiedziałem im tak samo."
"Ne6,5": "Potem Sanballat po raz piąty przysłał do mnie w ten sam sposób swego sługę z otwartym listem w ręku;"
"Ne6,6": "A było w nim napisane: Wśród pogan krąży pogłoska – jak powiada Gaszmu – że ty i Żydzi zamierzacie się zbuntować. Dlatego budujesz mur, abyś był ich królem, według tych słów."
"Ne6,7": "Krąży też pogłoska, że ustanowiłeś proroków, aby opowiadali o tobie w Jerozolimie, mówiąc: Jest król w Judzie. Teraz te słowa dotrą do króla. Przyjdź więc i naradzimy się wspólnie."
"Ne6,8": "Lecz ja wysłałem do niego taką odpowiedź: Nie jest tak, jak powiadasz, ale sam sobie to wymyślasz."
"Ne6,9": "Oni wszyscy bowiem straszyli nas, mówiąc: Ich ręce osłabną od tej pracy i nie zostanie dokonana. Teraz więc, Boże, wzmocnij moje ręce."
"Ne6,10": "A gdy wszedłem do domu Szemajasza, syna Delajasza, syna Mehetabeela, gdzie był zamknięty, powiedział mi: Zejdźmy się w domu Bożym, w świątyni, i zamknijmy drzwi. Przyjdą bowiem, aby cię zabić. Tej nocy przyjdą, aby cię zabić."
"Ne6,11": "A ja odpowiedziałem: Czy człowiek taki jak ja miałby uciekać? Czy ktoś taki jak ja wszedłby do świątyni, aby się ratować? Nie wejdę."
"Ne6,12": "I poznałem, że to nie Bóg go posłał, ale wypowiedział to proroctwo przeciwko mnie, bo Tobiasz i Sanballat przekupili go."
"Ne6,13": "Został przekupiony, abym się uląkł i tak uczynił, i zgrzeszył, aby posłużyło to do zniesławienia mnie, by mnie zhańbić."
"Ne6,14": "Mój Boże, pamiętaj o Tobiaszu i Sanballacie, według ich uczynków, także o prorokini Noadzie oraz pozostałych prorokach, którzy chcieli mnie straszyć."
"Ne6,15": "A mur został ukończony dwudziestego piątego dnia miesiąca Elul, w ciągu pięćdziesięciu dwóch dni."
"Ne6,16": "A gdy usłyszeli o tym wszyscy nasi wrogowie i gdy widzieli to wszyscy poganie, którzy byli wokół nas, bardzo się zniechęcili. Poznali bowiem, że to dzieło zostało wykonane przez naszego Boga."
"Ne6,17": "W te dni dostojnicy z Judy wysyłali wiele listów do Tobiasza, a także listy od Tobiasza przychodziły do nich."
"Ne6,18": "Wielu bowiem w Judzie było z nim związanych przysięgą, gdyż był on zięciem Szekaniasza, syna Aracha; a jego syn Jochanan pojął za żonę córkę Meszullama, syna Berechiasza."
"Ne6,19": "Opowiadali także przede mną jego dobre czyny i moje słowa donosili jemu. Tobiasz zaś wysyłał listy, aby mnie zastraszyć."
