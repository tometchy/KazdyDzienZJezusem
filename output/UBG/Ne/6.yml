"Ne6,1":
  text: "A gdy Sanballat, Tobiasz, Geszem Arab i pozostali nasi wrogowie usłyszeli, że zbudowałem mur i że nie pozostał w nim żaden wyłom, chociaż jeszcze w tym czasie nie wstawiłem wrót do bram;"
  tags: []
"Ne6,2":
  text: "Wtedy Sanballat i Geszem wysłali do mnie poselstwo ze słowami: Przyjdź, spotkajmy się razem w jednej ze wsi, na równinie Ono. Lecz oni mieli zamiar uczynić mi coś złego."
  tags: []
"Ne6,3":
  text: "Wysłałem więc do nich posłańców z taką odpowiedzią: Wykonuję wielką pracę i nie mogę zejść. Czemu miałaby stanąć ta praca, gdybym jej zaniechał, by zejść do was?"
  tags: []
"Ne6,4":
  text: "Cztery razy przysłali do mnie poselstwo w tej sprawie, a ja odpowiedziałem im tak samo."
  tags: []
"Ne6,5":
  text: "Potem Sanballat po raz piąty przysłał do mnie w ten sam sposób swego sługę z otwartym listem w ręku;"
  tags: []
"Ne6,6":
  text: "A było w nim napisane: Wśród pogan krąży pogłoska – jak powiada Gaszmu – że ty i Żydzi zamierzacie się zbuntować. Dlatego budujesz mur, abyś był ich królem, według tych słów."
  tags: []
"Ne6,7":
  text: "Krąży też pogłoska, że ustanowiłeś proroków, aby opowiadali o tobie w Jerozolimie, mówiąc: Jest król w Judzie. Teraz te słowa dotrą do króla. Przyjdź więc i naradzimy się wspólnie."
  tags: []
"Ne6,8":
  text: "Lecz ja wysłałem do niego taką odpowiedź: Nie jest tak, jak powiadasz, ale sam sobie to wymyślasz."
  tags: []
"Ne6,9":
  text: "Oni wszyscy bowiem straszyli nas, mówiąc: Ich ręce osłabną od tej pracy i nie zostanie dokonana. Teraz więc, Boże, wzmocnij moje ręce."
  tags: []
"Ne6,10":
  text: "A gdy wszedłem do domu Szemajasza, syna Delajasza, syna Mehetabeela, gdzie był zamknięty, powiedział mi: Zejdźmy się w domu Bożym, w świątyni, i zamknijmy drzwi. Przyjdą bowiem, aby cię zabić. Tej nocy przyjdą, aby cię zabić."
  tags: []
"Ne6,11":
  text: "A ja odpowiedziałem: Czy człowiek taki jak ja miałby uciekać? Czy ktoś taki jak ja wszedłby do świątyni, aby się ratować? Nie wejdę."
  tags: []
"Ne6,12":
  text: "I poznałem, że to nie Bóg go posłał, ale wypowiedział to proroctwo przeciwko mnie, bo Tobiasz i Sanballat przekupili go."
  tags: []
"Ne6,13":
  text: "Został przekupiony, abym się uląkł i tak uczynił, i zgrzeszył, aby posłużyło to do zniesławienia mnie, by mnie zhańbić."
  tags: []
"Ne6,14":
  text: "Mój Boże, pamiętaj o Tobiaszu i Sanballacie, według ich uczynków, także o prorokini Noadzie oraz pozostałych prorokach, którzy chcieli mnie straszyć."
  tags: []
"Ne6,15":
  text: "A mur został ukończony dwudziestego piątego dnia miesiąca Elul, w ciągu pięćdziesięciu dwóch dni."
  tags: []
"Ne6,16":
  text: "A gdy usłyszeli o tym wszyscy nasi wrogowie i gdy widzieli to wszyscy poganie, którzy byli wokół nas, bardzo się zniechęcili. Poznali bowiem, że to dzieło zostało wykonane przez naszego Boga."
  tags: []
"Ne6,17":
  text: "W te dni dostojnicy z Judy wysyłali wiele listów do Tobiasza, a także listy od Tobiasza przychodziły do nich."
  tags: []
"Ne6,18":
  text: "Wielu bowiem w Judzie było z nim związanych przysięgą, gdyż był on zięciem Szekaniasza, syna Aracha; a jego syn Jochanan pojął za żonę córkę Meszullama, syna Berechiasza."
  tags: []
"Ne6,19":
  text: "Opowiadali także przede mną jego dobre czyny i moje słowa donosili jemu. Tobiasz zaś wysyłał listy, aby mnie zastraszyć."
  tags: []
