"Ne1,1":
  text: "Słowa Nehemiasza, syna Chakaliasza. Oto w miesiącu Kislew, dwudziestego roku, gdy przebywałem w pałacu Suza;"
  tags: []
"Ne1,2":
  text: "Przyszedł Chanani, jeden z moich braci, a wraz z nim niektórzy mężczyźni z Judy. Zapytałem ich o ocalałych Żydów, którzy przeżyli niewolę, i o Jerozolimę."
  tags: []
"Ne1,3":
  text: "I odpowiedzieli mi: Ostatki spośród tych, którzy w tamtej prowincji przeżyli niewolę, są w wielkim utrapieniu i pohańbieniu; ponadto mur Jerozolimy jest zburzony i jej bramy zostały spalone ogniem."
  tags: []
"Ne1,4":
  text: "A gdy usłyszałem te słowa, usiadłem, płakałem i smuciłem się przez kilka dni, pościłem i modliłem się przed Bogiem niebios."
  tags: []
"Ne1,5":
  text: "I powiedziałem: Ach PANIE, Boże niebios, Boże wielki i straszny, który zachowujesz przymierze i okazujesz miłosierdzie tym, którzy cię miłują i przestrzegają twoich przykazań."
  tags: []
"Ne1,6":
  text: "Niech twoje ucho będzie uważne, a twoje oczy będą otwarte, aby wysłuchać modlitwy twego sługi, którą teraz zanoszę do ciebie dniem i nocą za synów Izraela, twoje sługi, i w której wyznaję grzechy synów Izraela, które popełniliśmy przeciwko tobie. Również ja i dom mego ojca zgrzeszyliśmy."
  tags: []
"Ne1,7":
  text: "Postąpiliśmy bardzo niegodziwie wobec ciebie i nie przestrzegaliśmy przykazań, ustaw ani praw, które nakazałeś Mojżeszowi, swemu słudze."
  tags: []
"Ne1,8":
  text: "Wspomnij, proszę, na słowo, które przekazałeś Mojżeszowi, swemu słudze, gdy powiedziałeś: Jeśli przekroczycie moje przykazania, to rozproszę was między narodami;"
  tags: []
"Ne1,9":
  text: "Lecz jeśli nawrócicie się do mnie i będziecie przestrzegać moich przykazań i wypełniać je, to choćby wasi wygnańcy byli na krańcu nieba, zgromadzę ich stamtąd i przyprowadzę na miejsce, które wybrałem, aby tam przebywało moje imię."
  tags: []
"Ne1,10":
  text: "Oni bowiem są twoimi sługami i twoim ludem, który odkupiłeś swoją wielką mocą i silną ręką."
  tags: []
"Ne1,11":
  text: "Proszę, Panie, niech twoje ucho będzie uważne na modlitwę twego sługi i na modlitwę twoich sług, którzy pragną bać się twego imienia. Spraw dziś, proszę, aby poszczęściło się twemu słudze, i okaż mu łaskę na oczach tego człowieka. Byłem bowiem podczaszym króla."
  tags: []
