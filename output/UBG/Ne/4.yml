"Ne4,1":
  text: "A gdy Sanballat usłyszał, że odbudowujemy mur, rozgniewał się i bardzo się oburzył, i zaczął szydzić z Żydów."
  tags: []
"Ne4,2":
  text: "I powiedział wobec swoich braci i wojska Samarii: Co ci niedołężni Żydzi wyprawiają? Czy pozwolimy im na to? Czy będą składać ofiary? Czy zdołają to skończyć w jeden dzień? Czy wskrzeszą kamienie z kupy gruzu, które spalono?"
  tags: []
"Ne4,3":
  text: "Ale Tobiasz Ammonita, który stał obok niego, powiedział: Nawet jeśli zbudują, przyjdzie lis i przewróci ich kamienny mur."
  tags: []
"Ne4,4":
  text: "Wysłuchaj, nasz Boże, bo jesteśmy wzgardzeni, i odwróć ich zhańbienie na ich głowę, i wydaj ich na łup w ziemi niewoli."
  tags: []
"Ne4,5":
  text: "Nie zakrywaj ich nieprawości, a niech ich grzech nie będzie wymazany przed tobą. Ciebie bowiem pobudzili do gniewu na oczach budujących."
  tags: []
"Ne4,6":
  text: "Lecz my nadal odbudowywaliśmy ten mur i mur został spojony aż do połowy, bo lud miał serce do pracy."
  tags: []
"Ne4,7":
  text: "Gdy Sanballat i Tobiasz, Arabowie, Ammonici i Aszdodyci usłyszeli, że mury Jerozolimy są odbudowywane, że wyłomy zaczęły się wypełniać, bardzo się rozgniewali."
  tags: []
"Ne4,8":
  text: "I wszyscy sprzysięgli się razem, aby przyjść i walczyć przeciw Jerozolimie, i przeszkadzać w robocie."
  tags: []
"Ne4,9":
  text: "My jednak modliliśmy się do naszego Boga i postawiliśmy przeciwko nim straż we dnie i w nocy, ponieważ się ich baliśmy."
  tags: []
"Ne4,10":
  text: "I Judejczycy powiedzieli: Osłabła siła dźwigających, a gruzu jeszcze wiele. Nie będziemy mogli odbudować muru."
  tags: []
"Ne4,11":
  text: "Ponadto nasi wrogowie powiedzieli: Zanim się dowiedzą i spostrzegą, przyjdziemy między nich i ich wymordujemy, i wstrzymamy tę pracę."
  tags: []
"Ne4,12":
  text: "A gdy Żydzi mieszkający obok nich przyszli, powiedzieli nam dziesięć razy: Ze wszystkich miejsc, z których przyjdziecie do nas, oni przyjdą na was."
  tags: []
"Ne4,13":
  text: "Ustawiłem więc lud w niższych miejscach za murem i na wysokich miejscach; ustawiłem ich według rodzin z ich mieczami, włóczniami i łukami."
  tags: []
"Ne4,14":
  text: "A gdy popatrzyłem, wstałem i powiedziałem do dostojników, przełożonych i pozostałych z ludu: Nie bójcie się ich. Wspomnijcie na PANA, wielkiego i budzącego grozę, i walczcie za swoich braci, za swoich synów i swoje córki, za swoje żony i domy."
  tags: []
"Ne4,15":
  text: "I kiedy nasi wrogowie usłyszeli, że nam to oznajmiono, Bóg zniweczył ich radę, a my wszyscy wróciliśmy do muru, każdy do swojej pracy."
  tags: []
"Ne4,16":
  text: "Jednak od tego czasu połowa moich sług pracowała, a druga połowa trzymała włócznie, tarcze, łuki i pancerze. Naczelnicy zaś stali za całym domem Judy."
  tags: []
"Ne4,17":
  text: "Ci, którzy odbudowywali mur, i ci, którzy dźwigali ciężar, i ci, którzy go nakładali, każdy z nich jedną ręką pracował, a w drugiej trzymał broń."
  tags: []
"Ne4,18":
  text: "A z tych, którzy budowali, każdy miał swój miecz przypasany do boku i tak budowali. A trębacz stał obok mnie."
  tags: []
"Ne4,19":
  text: "Powiedziałem bowiem do dostojników, przełożonych i pozostałych z ludu: Praca jest wielka i rozległa, a my jesteśmy rozdzieleni na murze, jeden z dala od drugiego."
  tags: []
"Ne4,20":
  text: "W jakimkolwiek miejscu usłyszycie dźwięk trąby, tam ruszajcie do nas. Nasz Bóg będzie walczył za nas."
  tags: []
"Ne4,21":
  text: "Pracowaliśmy więc przy tym dziele, a druga połowa trzymała włócznie, od pojawienia się zorzy aż do wzejścia gwiazd."
  tags: []
"Ne4,22":
  text: "W tym czasie powiedziałem też do ludu: Niech każdy nocuje ze swoim sługą w Jerozolimie, aby w nocy słudzy trzymali straż, a w dzień pracowali."
  tags: []
"Ne4,23":
  text: "Tak więc ani ja, ani moi bracia, ani moi słudzy, ani straż, która była przy mnie, nie zdejmowaliśmy swoich szat, zrobiliśmy to wyłącznie przy obmywaniu."
  tags: []
