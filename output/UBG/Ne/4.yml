"Ne4,1": "A gdy Sanballat usłyszał, że odbudowujemy mur, rozgniewał się i bardzo się oburzył, i zaczął szydzić z Żydów."
"Ne4,2": "I powiedział wobec swoich braci i wojska Samarii: Co ci niedołężni Żydzi wyprawiają? Czy pozwolimy im na to? Czy będą składać ofiary? Czy zdołają to skończyć w jeden dzień? Czy wskrzeszą kamienie z kupy gruzu, które spalono?"
"Ne4,3": "Ale Tobiasz Ammonita, który stał obok niego, powiedział: Nawet jeśli zbudują, przyjdzie lis i przewróci ich kamienny mur."
"Ne4,4": "Wysłuchaj, nasz Boże, bo jesteśmy wzgardzeni, i odwróć ich zhańbienie na ich głowę, i wydaj ich na łup w ziemi niewoli."
"Ne4,5": "Nie zakrywaj ich nieprawości, a niech ich grzech nie będzie wymazany przed tobą. Ciebie bowiem pobudzili do gniewu na oczach budujących."
"Ne4,6": "Lecz my nadal odbudowywaliśmy ten mur i mur został spojony aż do połowy, bo lud miał serce do pracy."
"Ne4,7": "Gdy Sanballat i Tobiasz, Arabowie, Ammonici i Aszdodyci usłyszeli, że mury Jerozolimy są odbudowywane, że wyłomy zaczęły się wypełniać, bardzo się rozgniewali."
"Ne4,8": "I wszyscy sprzysięgli się razem, aby przyjść i walczyć przeciw Jerozolimie, i przeszkadzać w robocie."
"Ne4,9": "My jednak modliliśmy się do naszego Boga i postawiliśmy przeciwko nim straż we dnie i w nocy, ponieważ się ich baliśmy."
"Ne4,10": "I Judejczycy powiedzieli: Osłabła siła dźwigających, a gruzu jeszcze wiele. Nie będziemy mogli odbudować muru."
"Ne4,11": "Ponadto nasi wrogowie powiedzieli: Zanim się dowiedzą i spostrzegą, przyjdziemy między nich i ich wymordujemy, i wstrzymamy tę pracę."
"Ne4,12": "A gdy Żydzi mieszkający obok nich przyszli, powiedzieli nam dziesięć razy: Ze wszystkich miejsc, z których przyjdziecie do nas, oni przyjdą na was."
"Ne4,13": "Ustawiłem więc lud w niższych miejscach za murem i na wysokich miejscach; ustawiłem ich według rodzin z ich mieczami, włóczniami i łukami."
"Ne4,14": "A gdy popatrzyłem, wstałem i powiedziałem do dostojników, przełożonych i pozostałych z ludu: Nie bójcie się ich. Wspomnijcie na PANA, wielkiego i budzącego grozę, i walczcie za swoich braci, za swoich synów i swoje córki, za swoje żony i domy."
"Ne4,15": "I kiedy nasi wrogowie usłyszeli, że nam to oznajmiono, Bóg zniweczył ich radę, a my wszyscy wróciliśmy do muru, każdy do swojej pracy."
"Ne4,16": "Jednak od tego czasu połowa moich sług pracowała, a druga połowa trzymała włócznie, tarcze, łuki i pancerze. Naczelnicy zaś stali za całym domem Judy."
"Ne4,17": "Ci, którzy odbudowywali mur, i ci, którzy dźwigali ciężar, i ci, którzy go nakładali, każdy z nich jedną ręką pracował, a w drugiej trzymał broń."
"Ne4,18": "A z tych, którzy budowali, każdy miał swój miecz przypasany do boku i tak budowali. A trębacz stał obok mnie."
"Ne4,19": "Powiedziałem bowiem do dostojników, przełożonych i pozostałych z ludu: Praca jest wielka i rozległa, a my jesteśmy rozdzieleni na murze, jeden z dala od drugiego."
"Ne4,20": "W jakimkolwiek miejscu usłyszycie dźwięk trąby, tam ruszajcie do nas. Nasz Bóg będzie walczył za nas."
"Ne4,21": "Pracowaliśmy więc przy tym dziele, a druga połowa trzymała włócznie, od pojawienia się zorzy aż do wzejścia gwiazd."
"Ne4,22": "W tym czasie powiedziałem też do ludu: Niech każdy nocuje ze swoim sługą w Jerozolimie, aby w nocy słudzy trzymali straż, a w dzień pracowali."
"Ne4,23": "Tak więc ani ja, ani moi bracia, ani moi słudzy, ani straż, która była przy mnie, nie zdejmowaliśmy swoich szat, zrobiliśmy to wyłącznie przy obmywaniu."
