"Ne12,1": "A oto kapłani i Lewici, którzy przybyli z Zorobabelem, synem Szealtiela, i z Jeszuą: Serajasz, Jeremiasz, Ezdrasz;"
"Ne12,2": "Amariasz, Malluk, Chattusz;"
"Ne12,3": "Szekaniasz, Rechum, Meremot;"
"Ne12,4": "Iddo, Ginneton, Abiasz;"
"Ne12,5": "Mijamin, Maadiasz, Bilga;"
"Ne12,6": "Szemajasz, Jojarib, Jedajasz;"
"Ne12,7": "Sallu, Amok, Chilkiasz, Jedajasz. To byli przedniejsi z kapłanów i ze swoich braci za dni Jeszuy."
"Ne12,8": "A Lewici: Jeszua, Binnuj, Kadmiel, Szerebiasz, Juda i Mattaniasz, który wraz z braćmi kierował śpiewem pieśni dziękczynnych."
"Ne12,9": "A Bakbukiasz i Unni, ich bracia, stali naprzeciw nich w swoich służbach."
"Ne12,10": "Jeszua spłodził Jojakima, a Jojakim spłodził Eliasziba, a Eliaszib spłodził Jojadę;"
"Ne12,11": "Jojada spłodził Jonatana, a Jonatan spłodził Jadduę."
"Ne12,12": "A za dni Jojakima naczelnikami rodu byli następujący kapłani: z Serajasza – Merajasz, z Jeremiasza – Chananiasz;"
"Ne12,13": "Z Ezdrasza – Meszullam, z Amariasza – Jehochanan;"
"Ne12,14": "Z Malluki – Jonatan, z Szebaniasza – Józef;"
"Ne12,15": "Z Charima – Adna, z Merajota – Chelkaj;"
"Ne12,16": "Z Iddo – Zachariasz, z Ginneto – Meszullam;"
"Ne12,17": "Z Abiasza – Zikri, z Miniamina i Moadiasza – Piltaj;"
"Ne12,18": "Z Bilgi – Szammua, z Szemajasza – Jonatan;"
"Ne12,19": "A z Jojariba – Mattenaj, z Jedajasza – Uzzi;"
"Ne12,20": "Z Sallaj – Kallaj, z Amoka – Eber;"
"Ne12,21": "Z Chilkiasza – Chaszabiasz, z Jedajasza – Netanaeel."
"Ne12,22": "Za dni Eliasziba, Jojady, Jochanana i Jadduy Lewici zostali spisani jako naczelnicy rodów, a także kapłani, aż do panowania Dariusza Persa."
"Ne12,23": "Synowie Lewiego, naczelnicy rodów, zostali spisani w księdze kronik aż do dni Jochanana, syna Eliasziba."
"Ne12,24": "Naczelnikami Lewitów byli: Chaszabiasz, Szerebiasz, Jeszua, syn Kadmiela, i ich bracia, którzy stali naprzeciw nich, straż przy straży, aby chwalić i dziękować, według rozkazu Dawida, męża Bożego."
"Ne12,25": "Mattaniasz i Bakbukiasz, Obadiasz, Meszullam, Talmon i Akkub jako odźwierni trzymali straż przy składnicach u bram."
"Ne12,26": "Ci żyli za dni Jojakima, syna Jeszuy, syna Jocadaka, i za dni namiestnika Nehemiasza i Ezdrasza, kapłana i uczonego w Piśmie."
"Ne12,27": "I na poświęcanie muru Jerozolimy odszukano Lewitów ze wszystkich ich miejsc, aby ich przyprowadzić do Jerozolimy, by mogli obchodzić poświęcenie z radością, dziękczynieniem, przy śpiewaniu, cymbałach, cytrach i harfach."
"Ne12,28": "Zgromadzili się więc synowie śpiewaków, z równin wokół Jerozolimy i ze wsi Netofatytów;"
"Ne12,29": "Także z domu Gilgal, z pól Geba i z Azmawet. Śpiewacy bowiem zbudowali sobie wsie wokół Jerozolimy."
"Ne12,30": "Wtedy kapłani i Lewici oczyścili się, po czym oczyścili też lud, bramy i mur."
"Ne12,31": "Następnie kazałem przełożonym Judy wstąpić na mur i ustawiłem dwa wielkie zespoły dziękczynne, z których jeden szedł po murze na prawo, w kierunku Bramy Gnojnej."
"Ne12,32": "Za nim szedł Hoszajasz i połowa przełożonych Judy;"
"Ne12,33": "Także Azariasz, Ezdrasz i Meszullam;"
"Ne12,34": "Juda, Beniamin, Szemajasz i Jeremiasz;"
"Ne12,35": "Potem szli z trąbami niektórzy z synów kapłanów, mianowicie: Zachariasz, syn Jonatana, syna Szemajasza, syna Mattaniasza, syna Michajasza, syna Zakkura, syna Asafa;"
"Ne12,36": "I jego bracia: Szemajasz, Azarel, Milalaj, Gilalaj, Maaj, Netaneel, Juda, Chanani z instrumentami muzycznymi Dawida, męża Bożego, a Ezdrasz, uczony w Piśmie, szedł przed nimi."
"Ne12,37": "Następnie przy Bramie Źródlanej, która była naprzeciw nich, szli po schodach miasta Dawida, które prowadzą na mur, znad domu Dawida aż do Bramy Wodnej na wschodzie."
"Ne12,38": "A drugi zespół dziękczynny, a ja za nim, szedł po murze w lewo z drugą połową przełożonych, od Wieży Pieców aż do Muru Szerokiego;"
"Ne12,39": "I znad Bramy Efraima, nad Bramą Starą, nad Bramą Rybną, obok Wieży Chananeela i Wieży Mea, aż do Bramy Owczej. I stanęli u Bramy Więziennej."
"Ne12,40": "A tak stanęły oba zespoły dziękczynne w domu Bożym, a wraz z nimi ja i połowa przełożonych ze mną."
"Ne12,41": "Także kapłani: Eliakim, Maasejasz, Miniamin, Michajasz, Elioenaj, Zachariasz, Chananiasz, z trąbami;"
"Ne12,42": "I Maasejasz, Szemajasz, Eleazar, Uzzi, Jehochanan, Malkiasz, Elam i Ezer. Śpiewacy głośno śpiewali, a Jizrachiasz był ich kierownikiem."
"Ne12,43": "Tego dnia składali także wielkie ofiary i radowali się. Bóg bowiem dał im wielką radość. Również kobiety i dzieci radowały się, a radość Jerozolimy słychać było z daleka."
"Ne12,44": "W tym czasie ustanowiono mężczyzn nad składnicami dla skarbów, ofiar, pierwocin i dziesięcin, aby w nich zgromadzono dla kapłanów i Lewitów udziały przyznane im przez Prawo z pól miejskich. Juda bowiem cieszył się z powodu kapłanów i Lewitów pełniących służbę;"
"Ne12,45": "I śpiewacy i odźwierni pełnili służbę dla swego Boga i służbę oczyszczenia, według rozkazu Dawida i jego syna Salomona."
"Ne12,46": "Już bowiem dawno, za dni Dawida i Asafa, byli ustanowieni przełożeni nad śpiewakami oraz były ustalone pieśni pochwalne i dziękczynienia dla Boga."
"Ne12,47": "Cały Izrael więc za dni Zorobabela i za dni Nehemiasza dawał porcje śpiewakom i odźwiernym na codzienne utrzymanie. Oddawali Lewitom to, co poświęcili, Lewici zaś oddawali to synom Aarona."
