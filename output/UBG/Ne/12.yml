"Ne12,1":
  text: "A oto kapłani i Lewici, którzy przybyli z Zorobabelem, synem Szealtiela, i z Jeszuą: Serajasz, Jeremiasz, Ezdrasz;"
  tags: []
"Ne12,2":
  text: "Amariasz, Malluk, Chattusz;"
  tags: []
"Ne12,3":
  text: "Szekaniasz, Rechum, Meremot;"
  tags: []
"Ne12,4":
  text: "Iddo, Ginneton, Abiasz;"
  tags: []
"Ne12,5":
  text: "Mijamin, Maadiasz, Bilga;"
  tags: []
"Ne12,6":
  text: "Szemajasz, Jojarib, Jedajasz;"
  tags: []
"Ne12,7":
  text: "Sallu, Amok, Chilkiasz, Jedajasz. To byli przedniejsi z kapłanów i ze swoich braci za dni Jeszuy."
  tags: []
"Ne12,8":
  text: "A Lewici: Jeszua, Binnuj, Kadmiel, Szerebiasz, Juda i Mattaniasz, który wraz z braćmi kierował śpiewem pieśni dziękczynnych."
  tags: []
"Ne12,9":
  text: "A Bakbukiasz i Unni, ich bracia, stali naprzeciw nich w swoich służbach."
  tags: []
"Ne12,10":
  text: "Jeszua spłodził Jojakima, a Jojakim spłodził Eliasziba, a Eliaszib spłodził Jojadę;"
  tags: []
"Ne12,11":
  text: "Jojada spłodził Jonatana, a Jonatan spłodził Jadduę."
  tags: []
"Ne12,12":
  text: "A za dni Jojakima naczelnikami rodu byli następujący kapłani: z Serajasza – Merajasz, z Jeremiasza – Chananiasz;"
  tags: []
"Ne12,13":
  text: "Z Ezdrasza – Meszullam, z Amariasza – Jehochanan;"
  tags: []
"Ne12,14":
  text: "Z Malluki – Jonatan, z Szebaniasza – Józef;"
  tags: []
"Ne12,15":
  text: "Z Charima – Adna, z Merajota – Chelkaj;"
  tags: []
"Ne12,16":
  text: "Z Iddo – Zachariasz, z Ginneto – Meszullam;"
  tags: []
"Ne12,17":
  text: "Z Abiasza – Zikri, z Miniamina i Moadiasza – Piltaj;"
  tags: []
"Ne12,18":
  text: "Z Bilgi – Szammua, z Szemajasza – Jonatan;"
  tags: []
"Ne12,19":
  text: "A z Jojariba – Mattenaj, z Jedajasza – Uzzi;"
  tags: []
"Ne12,20":
  text: "Z Sallaj – Kallaj, z Amoka – Eber;"
  tags: []
"Ne12,21":
  text: "Z Chilkiasza – Chaszabiasz, z Jedajasza – Netanaeel."
  tags: []
"Ne12,22":
  text: "Za dni Eliasziba, Jojady, Jochanana i Jadduy Lewici zostali spisani jako naczelnicy rodów, a także kapłani, aż do panowania Dariusza Persa."
  tags: []
"Ne12,23":
  text: "Synowie Lewiego, naczelnicy rodów, zostali spisani w księdze kronik aż do dni Jochanana, syna Eliasziba."
  tags: []
"Ne12,24":
  text: "Naczelnikami Lewitów byli: Chaszabiasz, Szerebiasz, Jeszua, syn Kadmiela, i ich bracia, którzy stali naprzeciw nich, straż przy straży, aby chwalić i dziękować, według rozkazu Dawida, męża Bożego."
  tags: []
"Ne12,25":
  text: "Mattaniasz i Bakbukiasz, Obadiasz, Meszullam, Talmon i Akkub jako odźwierni trzymali straż przy składnicach u bram."
  tags: []
"Ne12,26":
  text: "Ci żyli za dni Jojakima, syna Jeszuy, syna Jocadaka, i za dni namiestnika Nehemiasza i Ezdrasza, kapłana i uczonego w Piśmie."
  tags: []
"Ne12,27":
  text: "I na poświęcanie muru Jerozolimy odszukano Lewitów ze wszystkich ich miejsc, aby ich przyprowadzić do Jerozolimy, by mogli obchodzić poświęcenie z radością, dziękczynieniem, przy śpiewaniu, cymbałach, cytrach i harfach."
  tags: []
"Ne12,28":
  text: "Zgromadzili się więc synowie śpiewaków, z równin wokół Jerozolimy i ze wsi Netofatytów;"
  tags: []
"Ne12,29":
  text: "Także z domu Gilgal, z pól Geba i z Azmawet. Śpiewacy bowiem zbudowali sobie wsie wokół Jerozolimy."
  tags: []
"Ne12,30":
  text: "Wtedy kapłani i Lewici oczyścili się, po czym oczyścili też lud, bramy i mur."
  tags: []
"Ne12,31":
  text: "Następnie kazałem przełożonym Judy wstąpić na mur i ustawiłem dwa wielkie zespoły dziękczynne, z których jeden szedł po murze na prawo, w kierunku Bramy Gnojnej."
  tags: []
"Ne12,32":
  text: "Za nim szedł Hoszajasz i połowa przełożonych Judy;"
  tags: []
"Ne12,33":
  text: "Także Azariasz, Ezdrasz i Meszullam;"
  tags: []
"Ne12,34":
  text: "Juda, Beniamin, Szemajasz i Jeremiasz;"
  tags: []
"Ne12,35":
  text: "Potem szli z trąbami niektórzy z synów kapłanów, mianowicie: Zachariasz, syn Jonatana, syna Szemajasza, syna Mattaniasza, syna Michajasza, syna Zakkura, syna Asafa;"
  tags: []
"Ne12,36":
  text: "I jego bracia: Szemajasz, Azarel, Milalaj, Gilalaj, Maaj, Netaneel, Juda, Chanani z instrumentami muzycznymi Dawida, męża Bożego, a Ezdrasz, uczony w Piśmie, szedł przed nimi."
  tags: []
"Ne12,37":
  text: "Następnie przy Bramie Źródlanej, która była naprzeciw nich, szli po schodach miasta Dawida, które prowadzą na mur, znad domu Dawida aż do Bramy Wodnej na wschodzie."
  tags: []
"Ne12,38":
  text: "A drugi zespół dziękczynny, a ja za nim, szedł po murze w lewo z drugą połową przełożonych, od Wieży Pieców aż do Muru Szerokiego;"
  tags: []
"Ne12,39":
  text: "I znad Bramy Efraima, nad Bramą Starą, nad Bramą Rybną, obok Wieży Chananeela i Wieży Mea, aż do Bramy Owczej. I stanęli u Bramy Więziennej."
  tags: []
"Ne12,40":
  text: "A tak stanęły oba zespoły dziękczynne w domu Bożym, a wraz z nimi ja i połowa przełożonych ze mną."
  tags: []
"Ne12,41":
  text: "Także kapłani: Eliakim, Maasejasz, Miniamin, Michajasz, Elioenaj, Zachariasz, Chananiasz, z trąbami;"
  tags: []
"Ne12,42":
  text: "I Maasejasz, Szemajasz, Eleazar, Uzzi, Jehochanan, Malkiasz, Elam i Ezer. Śpiewacy głośno śpiewali, a Jizrachiasz był ich kierownikiem."
  tags: []
"Ne12,43":
  text: "Tego dnia składali także wielkie ofiary i radowali się. Bóg bowiem dał im wielką radość. Również kobiety i dzieci radowały się, a radość Jerozolimy słychać było z daleka."
  tags: []
"Ne12,44":
  text: "W tym czasie ustanowiono mężczyzn nad składnicami dla skarbów, ofiar, pierwocin i dziesięcin, aby w nich zgromadzono dla kapłanów i Lewitów udziały przyznane im przez Prawo z pól miejskich. Juda bowiem cieszył się z powodu kapłanów i Lewitów pełniących służbę;"
  tags: []
"Ne12,45":
  text: "I śpiewacy i odźwierni pełnili służbę dla swego Boga i służbę oczyszczenia, według rozkazu Dawida i jego syna Salomona."
  tags: []
"Ne12,46":
  text: "Już bowiem dawno, za dni Dawida i Asafa, byli ustanowieni przełożeni nad śpiewakami oraz były ustalone pieśni pochwalne i dziękczynienia dla Boga."
  tags: []
"Ne12,47":
  text: "Cały Izrael więc za dni Zorobabela i za dni Nehemiasza dawał porcje śpiewakom i odźwiernym na codzienne utrzymanie. Oddawali Lewitom to, co poświęcili, Lewici zaś oddawali to synom Aarona."
  tags: []
