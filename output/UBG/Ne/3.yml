"Ne3,1": "Potem powstał najwyższy kapłan Eliaszib wraz ze swoimi braćmi kapłanami i odbudowali Bramę Owczą. Poświęcili ją i wstawili jej wrota. Poświęcili ją aż do wieży Mea i aż do wieży Chananeela."
"Ne3,2": "Obok niego budowali mężczyźni z Jerycha, a obok nich budował Zakkur, syn Imriego."
"Ne3,3": "A Bramę Rybną budowali synowie Senaa, którzy założyli też jej belki, wstawili jej wrota, zamki i rygle."
"Ne3,4": "Obok nich naprawiał Meremot, syn Uriasza, syna Kosa, a obok nich naprawiał Meszullam, syn Berechiasza, syna Meszezabeela. Obok nich naprawiał Sadok, syn Baany."
"Ne3,5": "Obok nich naprawiali Tekoici, lecz ich dostojnicy nie ugięli swego karku do pracy dla swego Pana."
"Ne3,6": "A Bramę Starą naprawiali Jojada, syn Paseacha, i Meszullam, syn Besodiasza. Założyli jej belki i wstawili jej wrota, zamki i rygle."
"Ne3,7": "Obok nich naprawiali Melatiasz Gibeonita, Jadon Meronotyta oraz mężczyźni z Gibeonu i Mispy aż do tronu namiestnika z tej strony rzeki."
"Ne3,8": "Obok nich naprawiał Uzziel, syn Charchajasza, jeden ze złotników, a obok niego naprawiał Chananiasz, syn aptekarza. Obwarowali Jerozolimę aż do Muru Szerokiego."
"Ne3,9": "Obok nich naprawiał Refajasz, syn Chura, przełożony połowy okręgu Jerozolimy."
"Ne3,10": "Obok nich naprawiał Jedajasz, syn Charumafa, naprzeciw swego domu. A obok niego naprawiał Chattusz, syn Chaszabnejasza."
"Ne3,11": "Drugi odcinek i Wieżę Pieców zaś naprawiał Malkiasz, syn Charima, i Chaszub, syn Pachat-Moaba."
"Ne3,12": "Obok niego naprawiał Szallum, syn Hallochesza, przełożony połowy okręgu Jerozolimy, on i jego córki."
"Ne3,13": "Bramę nad Doliną naprawiali Chanun i mieszkańcy Zanoach. Odbudowali ją, wstawili jej wrota, zamki i rygle i naprawili tysiąc łokci muru aż do Bramy Gnojnej."
"Ne3,14": "Lecz Bramę Gnojną naprawiał Malkiasz, syn Rekaba, przełożony okręgu Bet-Hakkerem. On ją odbudował i wstawił jej wrota, zamki i rygle;"
"Ne3,15": "Bramę Źródlaną naprawiał Szallun, syn Kol-Chozego, przełożony okręgu Mispa. On ją zbudował, pokrył dachem i wstawił jej wrota, zamki i rygle oraz wzniósł mur nad stawem Sziloach przy ogrodzie królewskim aż do schodów prowadzących do miasta Dawida."
"Ne3,16": "Za nim naprawiał Nehemiasz, syn Azbuka, przełożony połowy okręgu Bet-Sur, aż do miejsca naprzeciw grobów Dawida i aż do stawu sztucznego, i aż do domu mocarzy."
"Ne3,17": "Za nim naprawiali Lewici: Rechum, syn Baniego, obok niego naprawiał Chaszabiasz, przełożony połowy okręgu Keila, w swoim okręgu."
"Ne3,18": "Za nim naprawiali ich bracia: Bawaj, syn Chenadada, przełożony połowy okręgu Keila."
"Ne3,19": "Obok niego naprawiał Ezer, syn Jeszuy, przełożony Mispy, następny odcinek naprzeciw wejścia do zbrojowni przy rogu."
"Ne3,20": "Za nim naprawiał gorliwie Baruch, syn Zabbaja, dalszy odcinek od rogu aż do drzwi domu arcykapłana Eliasziba."
"Ne3,21": "Za nim naprawiał Meremot, syn Uriasza, syn Kosa, następny odcinek od drzwi domu Eliasziba aż do końca jego domu."
"Ne3,22": "Za nim naprawiali kapłani, którzy mieszkali na równinie."
"Ne3,23": "Za nimi naprawiali Beniamin i Chaszub, naprzeciw swoich domów. Za nimi naprawiał Azariasz, syn Maasejasza, syna Ananiasza, obok swego domu."
"Ne3,24": "Za nim naprawiał Binnuj, syn Chenadada, następny odcinek od domu Azariasza aż do zakrętu i do narożnika."
"Ne3,25": "Palal, syn Uzaja, naprawiał naprzeciw rogu i wieży wystającej z domu królewskiego, która była przy więzieniu. Za nim naprawiał Pedajasz, syn Parosza."
"Ne3,26": "A Netinici, mieszkający na Ofelu, naprawiali aż naprzeciw Bramy Wodnej na wschodzie i do wieży wystającej."
"Ne3,27": "Za nimi naprawiali Tekoici dalszy odcinek, naprzeciw wielkiej wieży wystającej aż do muru Ofel."
"Ne3,28": "Znad Bramy Końskiej naprawiali kapłani, każdy naprzeciw swego domu."
"Ne3,29": "Za nimi naprawiał Sadok, syn Immera, naprzeciw swego domu, a za nim naprawiał Szemajasz, syn Szekaniasza, stróż Bramy Wschodniej."
"Ne3,30": "Za nim naprawiał Chananiasz, syn Szelemiasza, i Chanun, szósty syn Salafa, następny odcinek. Za nim naprawiał Meszullam, syn Berechiasza, naprzeciw swojej komnaty."
"Ne3,31": "Za nim naprawiał Malkiasz, syn złotnika, aż do domu Netinitów i handlarzy, naprzeciw Bramy Sądowej i aż do Sali Narożnej."
"Ne3,32": "A pomiędzy Salą Narożną a Bramą Owczą naprawiali złotnicy i handlarze."
