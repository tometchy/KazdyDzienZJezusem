"Ne3,1":
  text: "Potem powstał najwyższy kapłan Eliaszib wraz ze swoimi braćmi kapłanami i odbudowali Bramę Owczą. Poświęcili ją i wstawili jej wrota. Poświęcili ją aż do wieży Mea i aż do wieży Chananeela."
  tags: []
"Ne3,2":
  text: "Obok niego budowali mężczyźni z Jerycha, a obok nich budował Zakkur, syn Imriego."
  tags: []
"Ne3,3":
  text: "A Bramę Rybną budowali synowie Senaa, którzy założyli też jej belki, wstawili jej wrota, zamki i rygle."
  tags: []
"Ne3,4":
  text: "Obok nich naprawiał Meremot, syn Uriasza, syna Kosa, a obok nich naprawiał Meszullam, syn Berechiasza, syna Meszezabeela. Obok nich naprawiał Sadok, syn Baany."
  tags: []
"Ne3,5":
  text: "Obok nich naprawiali Tekoici, lecz ich dostojnicy nie ugięli swego karku do pracy dla swego Pana."
  tags: []
"Ne3,6":
  text: "A Bramę Starą naprawiali Jojada, syn Paseacha, i Meszullam, syn Besodiasza. Założyli jej belki i wstawili jej wrota, zamki i rygle."
  tags: []
"Ne3,7":
  text: "Obok nich naprawiali Melatiasz Gibeonita, Jadon Meronotyta oraz mężczyźni z Gibeonu i Mispy aż do tronu namiestnika z tej strony rzeki."
  tags: []
"Ne3,8":
  text: "Obok nich naprawiał Uzziel, syn Charchajasza, jeden ze złotników, a obok niego naprawiał Chananiasz, syn aptekarza. Obwarowali Jerozolimę aż do Muru Szerokiego."
  tags: []
"Ne3,9":
  text: "Obok nich naprawiał Refajasz, syn Chura, przełożony połowy okręgu Jerozolimy."
  tags: []
"Ne3,10":
  text: "Obok nich naprawiał Jedajasz, syn Charumafa, naprzeciw swego domu. A obok niego naprawiał Chattusz, syn Chaszabnejasza."
  tags: []
"Ne3,11":
  text: "Drugi odcinek i Wieżę Pieców zaś naprawiał Malkiasz, syn Charima, i Chaszub, syn Pachat-Moaba."
  tags: []
"Ne3,12":
  text: "Obok niego naprawiał Szallum, syn Hallochesza, przełożony połowy okręgu Jerozolimy, on i jego córki."
  tags: []
"Ne3,13":
  text: "Bramę nad Doliną naprawiali Chanun i mieszkańcy Zanoach. Odbudowali ją, wstawili jej wrota, zamki i rygle i naprawili tysiąc łokci muru aż do Bramy Gnojnej."
  tags: []
"Ne3,14":
  text: "Lecz Bramę Gnojną naprawiał Malkiasz, syn Rekaba, przełożony okręgu Bet-Hakkerem. On ją odbudował i wstawił jej wrota, zamki i rygle;"
  tags: []
"Ne3,15":
  text: "Bramę Źródlaną naprawiał Szallun, syn Kol-Chozego, przełożony okręgu Mispa. On ją zbudował, pokrył dachem i wstawił jej wrota, zamki i rygle oraz wzniósł mur nad stawem Sziloach przy ogrodzie królewskim aż do schodów prowadzących do miasta Dawida."
  tags: []
"Ne3,16":
  text: "Za nim naprawiał Nehemiasz, syn Azbuka, przełożony połowy okręgu Bet-Sur, aż do miejsca naprzeciw grobów Dawida i aż do stawu sztucznego, i aż do domu mocarzy."
  tags: []
"Ne3,17":
  text: "Za nim naprawiali Lewici: Rechum, syn Baniego, obok niego naprawiał Chaszabiasz, przełożony połowy okręgu Keila, w swoim okręgu."
  tags: []
"Ne3,18":
  text: "Za nim naprawiali ich bracia: Bawaj, syn Chenadada, przełożony połowy okręgu Keila."
  tags: []
"Ne3,19":
  text: "Obok niego naprawiał Ezer, syn Jeszuy, przełożony Mispy, następny odcinek naprzeciw wejścia do zbrojowni przy rogu."
  tags: []
"Ne3,20":
  text: "Za nim naprawiał gorliwie Baruch, syn Zabbaja, dalszy odcinek od rogu aż do drzwi domu arcykapłana Eliasziba."
  tags: []
"Ne3,21":
  text: "Za nim naprawiał Meremot, syn Uriasza, syn Kosa, następny odcinek od drzwi domu Eliasziba aż do końca jego domu."
  tags: []
"Ne3,22":
  text: "Za nim naprawiali kapłani, którzy mieszkali na równinie."
  tags: []
"Ne3,23":
  text: "Za nimi naprawiali Beniamin i Chaszub, naprzeciw swoich domów. Za nimi naprawiał Azariasz, syn Maasejasza, syna Ananiasza, obok swego domu."
  tags: []
"Ne3,24":
  text: "Za nim naprawiał Binnuj, syn Chenadada, następny odcinek od domu Azariasza aż do zakrętu i do narożnika."
  tags: []
"Ne3,25":
  text: "Palal, syn Uzaja, naprawiał naprzeciw rogu i wieży wystającej z domu królewskiego, która była przy więzieniu. Za nim naprawiał Pedajasz, syn Parosza."
  tags: []
"Ne3,26":
  text: "A Netinici, mieszkający na Ofelu, naprawiali aż naprzeciw Bramy Wodnej na wschodzie i do wieży wystającej."
  tags: []
"Ne3,27":
  text: "Za nimi naprawiali Tekoici dalszy odcinek, naprzeciw wielkiej wieży wystającej aż do muru Ofel."
  tags: []
"Ne3,28":
  text: "Znad Bramy Końskiej naprawiali kapłani, każdy naprzeciw swego domu."
  tags: []
"Ne3,29":
  text: "Za nimi naprawiał Sadok, syn Immera, naprzeciw swego domu, a za nim naprawiał Szemajasz, syn Szekaniasza, stróż Bramy Wschodniej."
  tags: []
"Ne3,30":
  text: "Za nim naprawiał Chananiasz, syn Szelemiasza, i Chanun, szósty syn Salafa, następny odcinek. Za nim naprawiał Meszullam, syn Berechiasza, naprzeciw swojej komnaty."
  tags: []
"Ne3,31":
  text: "Za nim naprawiał Malkiasz, syn złotnika, aż do domu Netinitów i handlarzy, naprzeciw Bramy Sądowej i aż do Sali Narożnej."
  tags: []
"Ne3,32":
  text: "A pomiędzy Salą Narożną a Bramą Owczą naprawiali złotnicy i handlarze."
  tags: []
