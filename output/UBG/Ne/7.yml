"Ne7,1":
  text: "A gdy mur został odbudowany i wstawiłem wrota, gdy ustanowiono odźwiernych, śpiewaków i Lewitów;"
  tags: []
"Ne7,2":
  text: "Nad Jerozolimą postawiłem Chananiego, swojego brata, a Chananiasza ustanowiłem dowódcą pałacu. On bowiem był wiernym człowiekiem i bał się Boga bardziej niż wielu innych;"
  tags: []
"Ne7,3":
  text: "I powiedziałem do nich: Niech nie otwierają bram Jerozolimy, aż słońce będzie dopiekać; a póki tam stoją, niech zamkną bramy i zaryglują je. Należy ustanowić straż spośród mieszkańców Jerozolimy, każdego na jego posterunku i każdego naprzeciwko własnego domu."
  tags: []
"Ne7,4":
  text: "A miasto było przestronne i wielkie, ale ludu w jego murach było niewiele, a domy jeszcze nie zostały odbudowane."
  tags: []
"Ne7,5":
  text: "I mój Bóg położył mi na sercu, abym zebrał dostojników, przełożonych i lud, aby zostali spisani według rodowodów. Wtedy znalazłem księgę rodowodów tych, którzy pierwsi powrócili, a znalazłem w niej taki zapis."
  tags: []
"Ne7,6":
  text: "Oto ludzie tej prowincji, którzy przybyli z niewoli, dokąd zostali uprowadzeni, których uprowadził Nabuchodonozor, król Babilonu, a powrócili do Jerozolimy i do Judy, każdy do swego miasta."
  tags: []
"Ne7,7":
  text: "Przyszli z Zorobabelem, z Jeszuą, Nehemiaszem, Azariaszem, Raamiaszem, Nachamanim, Mardocheuszem, Bilszanem, Misperetem, Bigwajem, Nechumem i Baaną. Oto liczba mężczyzn ludu Izraela:"
  tags: []
"Ne7,8":
  text: "Synów Parosza – dwa tysiące stu siedemdziesięciu dwóch;"
  tags: []
"Ne7,9":
  text: "Synów Szefatiasza – trzystu siedemdziesięciu dwóch;"
  tags: []
"Ne7,10":
  text: "Synów Aracha – sześciuset pięćdziesięciu dwóch;"
  tags: []
"Ne7,11":
  text: "Synów Pachat-Moaba, synów Jeszuy i Joaba – dwa tysiące ośmiuset osiemnastu;"
  tags: []
"Ne7,12":
  text: "Synów Elama – tysiąc dwustu pięćdziesięciu czterech;"
  tags: []
"Ne7,13":
  text: "Synów Zattua – ośmiuset czterdziestu pięciu;"
  tags: []
"Ne7,14":
  text: "Synów Zakkaja – siedmiuset sześćdziesięciu;"
  tags: []
"Ne7,15":
  text: "Synów Binnuja – sześciuset czterdziestu ośmiu;"
  tags: []
"Ne7,16":
  text: "Synów Bebaja – sześciuset dwudziestu ośmiu;"
  tags: []
"Ne7,17":
  text: "Synów Azgada – dwa tysiące trzystu dwudziestu dwóch;"
  tags: []
"Ne7,18":
  text: "Synów Adonikama – sześciuset sześćdziesięciu siedmiu;"
  tags: []
"Ne7,19":
  text: "Synów Bigwaja – dwa tysiące sześćdziesięciu siedmiu;"
  tags: []
"Ne7,20":
  text: "Synów Adina – sześciuset pięćdziesięciu pięciu;"
  tags: []
"Ne7,21":
  text: "Synów Atera, z linii Ezechiasza – dziewięćdziesięciu ośmiu;"
  tags: []
"Ne7,22":
  text: "Synów Chaszuma – trzystu dwudziestu ośmiu;"
  tags: []
"Ne7,23":
  text: "Synów Besaja – trzystu dwudziestu czterech;"
  tags: []
"Ne7,24":
  text: "Synów Charifa – stu dwunastu;"
  tags: []
"Ne7,25":
  text: "Synów z Gibeonu – dziewięćdziesięciu pięciu."
  tags: []
"Ne7,26":
  text: "Mężczyzn z Betlejem i Netofy – stu osiemdziesięciu ośmiu;"
  tags: []
"Ne7,27":
  text: "Mężczyzn z Anatot – stu dwudziestu ośmiu;"
  tags: []
"Ne7,28":
  text: "Mężczyzn z Bet-Azmawet – czterdziestu dwóch;"
  tags: []
"Ne7,29":
  text: "Mężczyzn z Kiriat-Jearim, Kefiry i Beerot – siedmiuset czterdziestu trzech;"
  tags: []
"Ne7,30":
  text: "Mężczyzn z Rama i Geba – sześciuset dwudziestu jeden;"
  tags: []
"Ne7,31":
  text: "Mężczyzn z Mikmas – stu dwudziestu dwóch;"
  tags: []
"Ne7,32":
  text: "Mężczyzn z Betel i Aj – stu dwudziestu i trzech;"
  tags: []
"Ne7,33":
  text: "Mężczyzn z drugiego Nebo – pięćdziesięciu dwóch;"
  tags: []
"Ne7,34":
  text: "Synów drugiego Elama – tysiąc dwustu pięćdziesięciu czterech;"
  tags: []
"Ne7,35":
  text: "Synów Charima – trzystu dwudziestu;"
  tags: []
"Ne7,36":
  text: "Synów Jerycha – trzystu czterdziestu pięciu;"
  tags: []
"Ne7,37":
  text: "Synów z Lod, Chadida i Ono – siedmiuset dwudziestu jeden;"
  tags: []
"Ne7,38":
  text: "Synów Senai – trzy tysiące dziewięciuset trzydziestu."
  tags: []
"Ne7,39":
  text: "Kapłani: synów Jedajasza, z domu Jeszuy – dziewięciuset siedemdziesięciu trzech;"
  tags: []
"Ne7,40":
  text: "Synów Immera – tysiąc pięćdziesięciu dwóch;"
  tags: []
"Ne7,41":
  text: "Synów Paszchura – tysiąc dwustu czterdziestu siedmiu;"
  tags: []
"Ne7,42":
  text: "Synów Charima – tysiąc siedemnastu."
  tags: []
"Ne7,43":
  text: "Lewici: synów Jeszuy, Kadmiela, z synów Hodwy – siedemdziesięciu czterech."
  tags: []
"Ne7,44":
  text: "Śpiewacy: synów Asafa – stu czterdziestu ośmiu."
  tags: []
"Ne7,45":
  text: "Odźwiernych: synów Szalluma, synów Atera, synów Talmona, synów Akkuba, synów Chatity, synów Szobaja – stu trzydziestu ośmiu."
  tags: []
"Ne7,46":
  text: "Netinici: synowie Sichy, synowie Chaszufy, synowie Tabbaota;"
  tags: []
"Ne7,47":
  text: "Synowie Kerosa, synowie Sii, synowie Padona;"
  tags: []
"Ne7,48":
  text: "Synowie Lebana, synowie Chagaby, synowie Szalmaja;"
  tags: []
"Ne7,49":
  text: "Synowie Chanana, synowie Giddela, synowie Gachara;"
  tags: []
"Ne7,50":
  text: "Synowie Reajasza, synowie Resina, synowie Nekody;"
  tags: []
"Ne7,51":
  text: "Synowie Gazzama, synowie Uzzy, synowie Paseacha;"
  tags: []
"Ne7,52":
  text: "Synowie Besaja, synowie Meunitów, synowie Nefisytów;"
  tags: []
"Ne7,53":
  text: "Synowie Bakbuka, synowie Chakufy, synowie Charchura;"
  tags: []
"Ne7,54":
  text: "Synowie Baslita, synowie Mechidy, synowie Charszy;"
  tags: []
"Ne7,55":
  text: "Synowie Barkosa, synowie Sisery, synowie Tamacha;"
  tags: []
"Ne7,56":
  text: "Synowie Nesjacha, synowie Chatify;"
  tags: []
"Ne7,57":
  text: "Synowie sług Salomona: synowie Sotaja, synowie Sofereta, synowie Peridy;"
  tags: []
"Ne7,58":
  text: "Synowie Jaali, synowie Darkona, synowie Giddela;"
  tags: []
"Ne7,59":
  text: "Synowie Szefatiasza, synowie Chattila, synowie Pocheret-Hassebaima, synowie Amona."
  tags: []
"Ne7,60":
  text: "Wszystkich Netinitów i synów sług Salomona – trzystu dziewięćdziesięciu dwóch."
  tags: []
"Ne7,61":
  text: "A oto ci, którzy przybyli z Tel-Melach, Tel-Charsza, Kerub, Addan i Immer, ale nie mogli wykazać domu swoich ojców i swego potomstwa – tego, czy pochodzą z Izraela."
  tags: []
"Ne7,62":
  text: "Synów Delajasza, synów Tobiasza, synów Nekody – sześciuset czterdziestu dwóch."
  tags: []
"Ne7,63":
  text: "A z kapłanów: synowie Chobajasza, synowie Kosa, synowie Barzillaja, który pojął za żonę jedną z córek Barzillaja Gileadczyka i przybrał ich imię."
  tags: []
"Ne7,64":
  text: "Ci szukali swego spisu według rodowodu, ale nie znaleźli, toteż zostali wykluczeni z kapłaństwa."
  tags: []
"Ne7,65":
  text: "Tirszata zakazał im spożywać z pokarmów najświętszych, dopóki nie pojawi się kapłan z Urim i Tummim."
  tags: []
"Ne7,66":
  text: "Całe to zgromadzenie liczyło czterdzieści dwa tysiące trzysta sześćdziesiąt osób;"
  tags: []
"Ne7,67":
  text: "Nie licząc ich sług i służących, których było siedem tysięcy trzysta trzydzieścioro siedmioro. A wśród nich było dwieście czterdzieścioro pięcioro śpiewaków i śpiewaczek."
  tags: []
"Ne7,68":
  text: "Ich koni – siedemset trzydzieści sześć. Ich mułów – dwieście czterdzieści pięć."
  tags: []
"Ne7,69":
  text: "Wielbłądów – czterysta trzydzieści pięć. Osłów – sześć tysięcy siedemset dwadzieścia."
  tags: []
"Ne7,70":
  text: "A niektórzy z naczelników rodów dali na prace. Tirszata dał do skarbca tysiąc drachm złota, pięćdziesiąt czasz i pięćset trzydzieści szat kapłańskich."
  tags: []
"Ne7,71":
  text: "Niektórzy też z przedniejszych rodów dali do skarbca na pracę dwadzieścia tysięcy drachm złota i dwa tysiące dwieście min srebra."
  tags: []
"Ne7,72":
  text: "A to, co dała reszta ludu, wynosiło dwadzieścia tysięcy drachm złota, dwa tysiące min srebra i sześćdziesiąt siedem szat kapłańskich."
  tags: []
"Ne7,73":
  text: "Tak więc kapłani, Lewici, odźwierni, śpiewacy, część ludu, Netinici i cały Izrael osiedlili się w swoich miastach. A gdy nastał siódmy miesiąc, synowie Izraela mieszkali w swoich miastach."
  tags: []
