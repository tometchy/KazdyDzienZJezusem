"Ne7,1": "A gdy mur został odbudowany i wstawiłem wrota, gdy ustanowiono odźwiernych, śpiewaków i Lewitów;"
"Ne7,2": "Nad Jerozolimą postawiłem Chananiego, swojego brata, a Chananiasza ustanowiłem dowódcą pałacu. On bowiem był wiernym człowiekiem i bał się Boga bardziej niż wielu innych;"
"Ne7,3": "I powiedziałem do nich: Niech nie otwierają bram Jerozolimy, aż słońce będzie dopiekać; a póki tam stoją, niech zamkną bramy i zaryglują je. Należy ustanowić straż spośród mieszkańców Jerozolimy, każdego na jego posterunku i każdego naprzeciwko własnego domu."
"Ne7,4": "A miasto było przestronne i wielkie, ale ludu w jego murach było niewiele, a domy jeszcze nie zostały odbudowane."
"Ne7,5": "I mój Bóg położył mi na sercu, abym zebrał dostojników, przełożonych i lud, aby zostali spisani według rodowodów. Wtedy znalazłem księgę rodowodów tych, którzy pierwsi powrócili, a znalazłem w niej taki zapis."
"Ne7,6": "Oto ludzie tej prowincji, którzy przybyli z niewoli, dokąd zostali uprowadzeni, których uprowadził Nabuchodonozor, król Babilonu, a powrócili do Jerozolimy i do Judy, każdy do swego miasta."
"Ne7,7": "Przyszli z Zorobabelem, z Jeszuą, Nehemiaszem, Azariaszem, Raamiaszem, Nachamanim, Mardocheuszem, Bilszanem, Misperetem, Bigwajem, Nechumem i Baaną. Oto liczba mężczyzn ludu Izraela:"
"Ne7,8": "Synów Parosza – dwa tysiące stu siedemdziesięciu dwóch;"
"Ne7,9": "Synów Szefatiasza – trzystu siedemdziesięciu dwóch;"
"Ne7,10": "Synów Aracha – sześciuset pięćdziesięciu dwóch;"
"Ne7,11": "Synów Pachat-Moaba, synów Jeszuy i Joaba – dwa tysiące ośmiuset osiemnastu;"
"Ne7,12": "Synów Elama – tysiąc dwustu pięćdziesięciu czterech;"
"Ne7,13": "Synów Zattua – ośmiuset czterdziestu pięciu;"
"Ne7,14": "Synów Zakkaja – siedmiuset sześćdziesięciu;"
"Ne7,15": "Synów Binnuja – sześciuset czterdziestu ośmiu;"
"Ne7,16": "Synów Bebaja – sześciuset dwudziestu ośmiu;"
"Ne7,17": "Synów Azgada – dwa tysiące trzystu dwudziestu dwóch;"
"Ne7,18": "Synów Adonikama – sześciuset sześćdziesięciu siedmiu;"
"Ne7,19": "Synów Bigwaja – dwa tysiące sześćdziesięciu siedmiu;"
"Ne7,20": "Synów Adina – sześciuset pięćdziesięciu pięciu;"
"Ne7,21": "Synów Atera, z linii Ezechiasza – dziewięćdziesięciu ośmiu;"
"Ne7,22": "Synów Chaszuma – trzystu dwudziestu ośmiu;"
"Ne7,23": "Synów Besaja – trzystu dwudziestu czterech;"
"Ne7,24": "Synów Charifa – stu dwunastu;"
"Ne7,25": "Synów z Gibeonu – dziewięćdziesięciu pięciu."
"Ne7,26": "Mężczyzn z Betlejem i Netofy – stu osiemdziesięciu ośmiu;"
"Ne7,27": "Mężczyzn z Anatot – stu dwudziestu ośmiu;"
"Ne7,28": "Mężczyzn z Bet-Azmawet – czterdziestu dwóch;"
"Ne7,29": "Mężczyzn z Kiriat-Jearim, Kefiry i Beerot – siedmiuset czterdziestu trzech;"
"Ne7,30": "Mężczyzn z Rama i Geba – sześciuset dwudziestu jeden;"
"Ne7,31": "Mężczyzn z Mikmas – stu dwudziestu dwóch;"
"Ne7,32": "Mężczyzn z Betel i Aj – stu dwudziestu i trzech;"
"Ne7,33": "Mężczyzn z drugiego Nebo – pięćdziesięciu dwóch;"
"Ne7,34": "Synów drugiego Elama – tysiąc dwustu pięćdziesięciu czterech;"
"Ne7,35": "Synów Charima – trzystu dwudziestu;"
"Ne7,36": "Synów Jerycha – trzystu czterdziestu pięciu;"
"Ne7,37": "Synów z Lod, Chadida i Ono – siedmiuset dwudziestu jeden;"
"Ne7,38": "Synów Senai – trzy tysiące dziewięciuset trzydziestu."
"Ne7,39": "Kapłani: synów Jedajasza, z domu Jeszuy – dziewięciuset siedemdziesięciu trzech;"
"Ne7,40": "Synów Immera – tysiąc pięćdziesięciu dwóch;"
"Ne7,41": "Synów Paszchura – tysiąc dwustu czterdziestu siedmiu;"
"Ne7,42": "Synów Charima – tysiąc siedemnastu."
"Ne7,43": "Lewici: synów Jeszuy, Kadmiela, z synów Hodwy – siedemdziesięciu czterech."
"Ne7,44": "Śpiewacy: synów Asafa – stu czterdziestu ośmiu."
"Ne7,45": "Odźwiernych: synów Szalluma, synów Atera, synów Talmona, synów Akkuba, synów Chatity, synów Szobaja – stu trzydziestu ośmiu."
"Ne7,46": "Netinici: synowie Sichy, synowie Chaszufy, synowie Tabbaota;"
"Ne7,47": "Synowie Kerosa, synowie Sii, synowie Padona;"
"Ne7,48": "Synowie Lebana, synowie Chagaby, synowie Szalmaja;"
"Ne7,49": "Synowie Chanana, synowie Giddela, synowie Gachara;"
"Ne7,50": "Synowie Reajasza, synowie Resina, synowie Nekody;"
"Ne7,51": "Synowie Gazzama, synowie Uzzy, synowie Paseacha;"
"Ne7,52": "Synowie Besaja, synowie Meunitów, synowie Nefisytów;"
"Ne7,53": "Synowie Bakbuka, synowie Chakufy, synowie Charchura;"
"Ne7,54": "Synowie Baslita, synowie Mechidy, synowie Charszy;"
"Ne7,55": "Synowie Barkosa, synowie Sisery, synowie Tamacha;"
"Ne7,56": "Synowie Nesjacha, synowie Chatify;"
"Ne7,57": "Synowie sług Salomona: synowie Sotaja, synowie Sofereta, synowie Peridy;"
"Ne7,58": "Synowie Jaali, synowie Darkona, synowie Giddela;"
"Ne7,59": "Synowie Szefatiasza, synowie Chattila, synowie Pocheret-Hassebaima, synowie Amona."
"Ne7,60": "Wszystkich Netinitów i synów sług Salomona – trzystu dziewięćdziesięciu dwóch."
"Ne7,61": "A oto ci, którzy przybyli z Tel-Melach, Tel-Charsza, Kerub, Addan i Immer, ale nie mogli wykazać domu swoich ojców i swego potomstwa – tego, czy pochodzą z Izraela."
"Ne7,62": "Synów Delajasza, synów Tobiasza, synów Nekody – sześciuset czterdziestu dwóch."
"Ne7,63": "A z kapłanów: synowie Chobajasza, synowie Kosa, synowie Barzillaja, który pojął za żonę jedną z córek Barzillaja Gileadczyka i przybrał ich imię."
"Ne7,64": "Ci szukali swego spisu według rodowodu, ale nie znaleźli, toteż zostali wykluczeni z kapłaństwa."
"Ne7,65": "Tirszata zakazał im spożywać z pokarmów najświętszych, dopóki nie pojawi się kapłan z Urim i Tummim."
"Ne7,66": "Całe to zgromadzenie liczyło czterdzieści dwa tysiące trzysta sześćdziesiąt osób;"
"Ne7,67": "Nie licząc ich sług i służących, których było siedem tysięcy trzysta trzydzieścioro siedmioro. A wśród nich było dwieście czterdzieścioro pięcioro śpiewaków i śpiewaczek."
"Ne7,68": "Ich koni – siedemset trzydzieści sześć. Ich mułów – dwieście czterdzieści pięć."
"Ne7,69": "Wielbłądów – czterysta trzydzieści pięć. Osłów – sześć tysięcy siedemset dwadzieścia."
"Ne7,70": "A niektórzy z naczelników rodów dali na prace. Tirszata dał do skarbca tysiąc drachm złota, pięćdziesiąt czasz i pięćset trzydzieści szat kapłańskich."
"Ne7,71": "Niektórzy też z przedniejszych rodów dali do skarbca na pracę dwadzieścia tysięcy drachm złota i dwa tysiące dwieście min srebra."
"Ne7,72": "A to, co dała reszta ludu, wynosiło dwadzieścia tysięcy drachm złota, dwa tysiące min srebra i sześćdziesiąt siedem szat kapłańskich."
"Ne7,73": "Tak więc kapłani, Lewici, odźwierni, śpiewacy, część ludu, Netinici i cały Izrael osiedlili się w swoich miastach. A gdy nastał siódmy miesiąc, synowie Izraela mieszkali w swoich miastach."
