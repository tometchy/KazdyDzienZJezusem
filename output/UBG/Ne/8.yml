"Ne8,1": "Wówczas zebrał się cały lud jak jeden mąż na placu, który był przed Bramą Wodną, i powiedział do Ezdrasza, uczonego w Piśmie, aby przyniósł księgę Prawa Mojżesza, które PAN nadał Izraelowi."
"Ne8,2": "Wtedy Ezdrasz, kapłan, przyniósł Prawo przed zgromadzenie mężczyzn i kobiet oraz wszystkich, którzy mogli słuchać i rozumieć, a działo się to pierwszego dnia siódmego miesiąca."
"Ne8,3": "I czytał je przed tym placem, który znajdował się przed Bramą Wodną, od rana aż do południa, przed mężczyznami i kobietami oraz tymi, którzy mogli zrozumieć; a uszy całego ludu były skupione na księdze Prawa."
"Ne8,4": "Ezdrasz, uczony w Piśmie, stanął na drewnianym podwyższeniu, które przygotowano na ten cel, a obok niego, po prawej stronie, stali: Mattitiasz, Szema, Ananiasz, Uriasz, Chilkiasz i Maasejasz, a po lewej stronie: Pedajasz, Miszael, Malkiasz, Chaszum, Chaszbadana, Zachariasz i Meszullam."
"Ne8,5": "Ezdrasz otworzył księgę na oczach całego ludu – gdyż stał wyżej niż on – a gdy ją otworzył, cały lud powstał."
"Ne8,6": "I Ezdrasz błogosławił PANU, wielkiemu Bogu, a cały lud, podnosząc ręce, odpowiadał: Amen! Amen! Potem skłonili głowy i oddali pokłon PANU, padając twarzą ku ziemi."
"Ne8,7": "Także Jeszua, Bani, Szerebiasz, Jamin, Akkub, Szabbetaj, Hodiasz, Maasejasz, Kelita, Azariasz, Jozabad, Chanan, Pelajasz i Lewici nauczali lud prawa. A lud stał na swoim miejscu."
"Ne8,8": "Czytali więc z księgi Prawa Bożego wyraźnie i wyjaśniali znaczenie tak, żeby zrozumiano to, co czytali."
"Ne8,9": "Potem Nehemiasz, to jest Tirszata, i Ezdrasz, kapłan i uczony w Piśmie, oraz Lewici, którzy nauczali lud, powiedzieli do całego ludu: Ten dzień jest poświęcony PANU, waszemu Bogu. Nie smućcie się ani nie płaczcie. Cały lud bowiem płakał, słuchając słowa Prawa."
"Ne8,10": "I powiedział im: Idźcie, jedzcie tłuste potrawy i pijcie słodki napój, i poślijcie porcje tym, którzy sobie nic nie przygotowali. Dzień ten jest bowiem święty dla naszego Pana. Dlatego nie smućcie się, gdyż radość PANA jest waszą siłą."
"Ne8,11": "A Lewici uspokajali cały lud, mówiąc: Uciszcie się, bo ten dzień jest święty. Nie smućcie się."
"Ne8,12": "Rozszedł się więc cały lud, aby jeść i pić, aby rozsyłać porcje i radować się bardzo, gdyż zrozumiał słowa, które mu ogłoszono."
"Ne8,13": "Następnego dnia naczelnicy rodów całego ludu, kapłani i Lewici zebrali się wokół Ezdrasza, uczonego w Piśmie, aby zrozumieć słowa Prawa."
"Ne8,14": "I znaleźli przepis w Prawie, które PAN nadał przez Mojżesza, aby synowie Izraela mieszkali w szałasach podczas święta siódmego miesiąca;"
"Ne8,15": "I aby ogłoszono i obwieszczono we wszystkich ich miastach i w Jerozolimie: Wejdźcie na górę i przynieście gałęzie oliwne, gałęzie sosnowe i gałęzie mirtowe, gałęzie palmowe i gałęzie drzew gęstych, abyście czynili szałasy, jak jest napisane."
"Ne8,16": "Lud więc wyszedł i przyniósł je, i czynił sobie szałasy, każdy na swoim dachu, na swoich dziedzińcach, na dziedzińcach domu Bożego, na placu Bramy Wodnej i na placu Bramy Efraima."
"Ne8,17": "Całe zgromadzenie, wszyscy, którzy powrócili z niewoli, uczynili szałasy i mieszkali w nich, gdyż synowie Izraela nie czynili tego od dni Jozuego, syna Nuna, aż do tego dnia. I panowała wielka radość."
"Ne8,18": "I Ezdrasz czytał z księgi Prawa Bożego każdego dnia, od pierwszego dnia aż do ostatniego. Przez siedem dni obchodzili święto, a dnia ósmego odbyło się uroczyste zgromadzenie według zwyczaju."
