"Ne5,1": "I podniósł się wielki krzyk ludu i ich żon przeciwko swym braciom Żydom."
"Ne5,2": "Niektórzy bowiem mówili: Jest nas wielu wraz z synami i córkami i musimy nabyć zboża, abyśmy mogli jeść i żyć."
"Ne5,3": "Inni zaś mówili: Nasze pola, winnice i domy musimy dać pod zastaw, aby nabyć zboża na czas głodu."
"Ne5,4": "Jeszcze inni mówili: Pożyczyliśmy pieniądze, aby dać podatek królowi, zastawiając nasze pola i nasze winnice."
"Ne5,5": "A przecież nasze ciało jest jak ciało naszych braci, a nasi synowie są jak ich synowie. A jednak to my musimy oddać naszych synów i nasze córki w niewolę i niektóre z naszych córek są już zaprzedane w niewolę, a my nie mamy siły w naszych rękach, aby je odkupić, gdyż nasze pola i winnice należą do innych."
"Ne5,6": "I rozgniewałem się bardzo, gdy usłyszałem ich wołanie i te słowa."
"Ne5,7": "Rozważyłem to w swoim sercu, po czym skarciłem dostojników i przełożonych, mówiąc do nich: Każdy z was uprawia lichwę wobec swoich braci. Zebrałem więc wielkie zgromadzenie przeciwko nim;"
"Ne5,8": "I powiedziałem do nich: My według naszych możliwości odkupiliśmy swoich braci Żydów, którzy zostali zaprzedani poganom, a wy chcecie sprzedać swoich braci? Chcielibyście ich nam sprzedać? Oni zamilkli, nie znajdując odpowiedzi."
"Ne5,9": "Ponadto powiedziałem: Nie jest dobre to, co czynicie. Czy nie powinniście kroczyć w bojaźni naszego Boga, by uniknąć zhańbienia od pogan, naszych wrogów?"
"Ne5,10": "Także ja i moi bracia oraz moi słudzy pożyczyliśmy im pieniądze i zboże. Porzućmy, proszę, tę lichwę."
"Ne5,11": "Zwróćcie im, proszę, ich pola, winnice, oliwniki i domy oraz setną część pieniędzy, zboża, wina i oliwy, którą od nich pobieracie."
"Ne5,12": "Wtedy odpowiedzieli: Zwrócimy i nie będziemy domagać się niczego od nich. Uczynimy tak, jak ty powiedziałeś. Wezwałem więc kapłanów i kazałem przysiąc wierzycielom, że postąpią według tej obietnicy."
"Ne5,13": "Potem wytrząsnąłem swoje zanadrze i powiedziałem: Tak niech Bóg wytrząśnie każdego z jego domu i z owocu jego pracy, kto nie dotrzyma tej obietnicy. Niech tak będzie wytrząśnięty i ogołocony. I całe zgromadzenie powiedziało: Amen. I chwalili PANA. I lud postąpił według tej obietnicy."
"Ne5,14": "Również od dnia, w którym ustanowiono mnie ich namiestnikiem w ziemi Judy, od dwudziestego aż do trzydziestego drugiego roku króla Artakserksesa, przez dwanaście lat, ja i moi bracia nie jedliśmy chleba przysługującego namiestnikowi."
"Ne5,15": "Dawni namiestnicy, którzy byli przede mną, obciążali lud, pobierając od niego chleb i wino, a ponadto czterdzieści syklów srebra. Ich słudzy również wykorzystywali lud. Lecz ja tak nie postępowałem z bojaźni Bożej."
"Ne5,16": "Także pracowałem przy naprawie tego muru, a pola nie kupiłem. Wszyscy też moi słudzy zgromadzili się tam do pracy."
"Ne5,17": "Ponadto przy moim stole byli Żydzi i przełożeni w liczbie stu pięćdziesięciu oraz ci, którzy przychodzili do nas spośród okolicznych pogan."
"Ne5,18": "Przygotowywano więc dla mnie każdego dnia jednego wołu, sześć wybornych owiec oraz drób, a co dziesięć dni rozmaite wino. Mimo to nie domagałem się chleba przysługującego namiestnikowi, gdyż niewola ciążyła nad tym ludem."
"Ne5,19": "Wspomnij na mnie, mój Boże, ku memu dobru, ze względu na wszystko, co czyniłem dla tego ludu."
