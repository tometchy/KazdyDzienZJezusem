"Lb15,1": "I PAN powiedział do Mojżesza:"
"Lb15,2": "Przemów do synów Izraela i powiedz im: Gdy przyjdziecie do ziemi waszego mieszkania, którą wam daję;"
"Lb15,3": "I będziecie chcieli złożyć PANU ofiarę spalaną na całopalenie, ofiarę bądź poślubioną, bądź dobrowolną lub też w wasze uroczyste święta, aby złożyć PANU miłą woń z wołów albo z owiec;"
"Lb15,4": "To niech składający PANU ofiarę złoży na ofiarę pokarmową dziesiątą część efy mąki pszennej zmieszanej z czwartą częścią hinu oliwy."
"Lb15,5": "A czwartą część hinu wina na ofiarę z płynów przygotujesz przy całopaleniu lub innej ofierze na każde jagnię."
"Lb15,6": "Przy baranie zaś złożysz na ofiarę pokarmową dwie dziesiąte efy mąki pszennej zmieszanej z trzecią częścią hinu oliwy."
"Lb15,7": "A na ofiarę z płynów złożysz jedną trzecią hinu wina jako miłą woń dla PANA."
"Lb15,8": "Gdy zaś będziesz składał cielca na ofiarę całopalną lub na ofiarę wypełnienia ślubu albo na ofiarę pojednawczą dla PANA;"
"Lb15,9": "Wtedy wraz z cielcem złożysz na ofiarę pokarmową trzy dziesiąte efy mąki pszennej zmieszanej z połową hinu oliwy."
"Lb15,10": "Na ofiarę pokarmową złożysz też połowę hinu wina, na ofiarę spalaną jako miłą woń dla PANA."
"Lb15,11": "Tak należy postąpić przy każdym wole, przy każdym baranie, jagnięciu lub koźlęciu."
"Lb15,12": "Według liczby, którą składacie, tak uczynicie z każdą ich sztuką według ich liczby."
"Lb15,13": "Każdy rodowity mieszkaniec postąpi w ten sposób, gdy będzie składał ofiarę spalaną jako miłą woń dla PANA."
"Lb15,14": "A jeśli obcy gości u was lub mieszka z wami od pokoleń i będzie chciał złożyć ofiarę spalaną jako miłą woń dla PANA, uczyni to tak, jak wy czynicie."
"Lb15,15": "Będzie jedna ustawa dla was i dla przybysza, który mieszka wśród was; będzie to ustawa wieczysta przez wszystkie wasze pokolenia. Przybysz będzie przed PANEM tak jak wy."
"Lb15,16": "Będzie jedno prawo i jeden sąd dla was i przybysza, który mieszka wśród was."
"Lb15,17": "I PAN powiedział do Mojżesza:"
"Lb15,18": "Przemów do synów Izraela i powiedz im: Gdy wejdziecie do ziemi, do której was wprowadzę;"
"Lb15,19": "A będziecie jeść chleb tej ziemi, to złożycie PANU ofiarę wzniesienia."
"Lb15,20": "Złożycie jako ofiarę wzniesienia placek z pierwocin waszych ciast; złożycie go tak jak ofiarę wzniesienia z klepiska."
"Lb15,21": "Będziecie składać PANU ofiarę wzniesienia z pierwocin waszych ciast przez wszystkie wasze pokolenia."
"Lb15,22": "A gdybyście zbłądzili i nie wypełnili wszystkich tych przykazań, które PAN nadał przez Mojżesza;"
"Lb15,23": "Tego wszystkiego, co PAN wam rozkazał przez Mojżesza, od tego dnia, w którym PAN to nakazał, i potem przez wszystkie wasze pokolenia;"
"Lb15,24": "Jeśli popełniono ten błąd nieświadomie przez zgromadzenie, to całe zgromadzenie złoży jednego młodego cielca na całopalenie, na miłą woń dla PANA, wraz z jego ofiarą pokarmową i ofiarą z płynów według zwyczaju, oraz jednego kozła ze stada na ofiarę za grzech."
"Lb15,25": "I kapłan dokona przebłagania za całe zgromadzenie synów Izraela, i będzie im przebaczone, gdyż stało się to nieświadomie. A oni przyniosą PANU swoją ofiarę na ofiarę spalaną i swoją ofiarę za grzech przed PANEM za swój błąd."
"Lb15,26": "I będzie przebaczone całemu zgromadzeniu synów Izraela i przybyszowi, który mieszka pośród nich, ponieważ cały lud popełnił to nieświadomie."
"Lb15,27": "A jeśli tylko jedna osoba zgrzeszy nieświadomie, wtedy przyniesie roczną kozę na ofiarę za grzech;"
"Lb15,28": "I kapłan dokona przebłagania za człowieka, który zbłądził, grzesząc wobec PANA nieświadomie; dokona za niego przebłagania i będzie mu przebaczone."
"Lb15,29": "Będzie jedno prawo dla tego, który grzeszy nieświadomie, zarówno dla rodowitego mieszkańca wśród synów Izraela, jak i dla przybysza, który mieszka pośród nich."
"Lb15,30": "Lecz człowiek, który bezczelnie zgrzeszy świadomie, zarówno rodowity mieszkaniec, jak i przybysz, znieważa PANA; człowiek ten zostanie wykluczony spośród swego ludu."
"Lb15,31": "Wzgardził bowiem słowem PANA i złamał jego przykazanie; taki człowiek musi zostać wykluczony; na nim ciąży jego nieprawość."
"Lb15,32": "A gdy synowie Izraela byli na pustyni, spotkali człowieka zbierającego drwa w dzień szabatu."
"Lb15,33": "I ci, którzy go spotkali zbierającego drwa, przyprowadzili go do Mojżesza i Aarona, i do całego zgromadzenia."
"Lb15,34": "I osadzili go pod strażą, bo jeszcze im nie oznajmiono, jak należy z takim postąpić."
"Lb15,35": "Wtedy PAN powiedział do Mojżesza: Ten człowiek musi ponieść śmierć; niech całe zgromadzenie go ukamienuje poza obozem."
"Lb15,36": "Całe zgromadzenie wyprowadziło go poza obóz i ukamienowało, i umarł, jak PAN rozkazał Mojżeszowi."
"Lb15,37": "I PAN powiedział do Mojżesza:"
"Lb15,38": "Przemów do synów Izraela i powiedz im, aby robili sobie frędzle na skrajach swoich szat przez wszystkie pokolenia, a do frędzli niech przyprawią sznurek z błękitnej tkaniny."
"Lb15,39": "I będziecie mieć te frędzle, żebyście na nie spoglądali i przypominali sobie wszystkie przykazania PANA, aby je wypełnić, a nie podążali za własnym sercem i własnymi oczami, za którymi idąc, cudzołożylibyście;"
"Lb15,40": "Abyście pamiętali i wypełniali wszystkie moje przykazania, i byli święci dla waszego Boga."
"Lb15,41": "Ja jestem PAN, wasz Bóg, który was wyprowadził z ziemi Egiptu, aby być waszym Bogiem. Ja jestem PAN, wasz Bóg."
