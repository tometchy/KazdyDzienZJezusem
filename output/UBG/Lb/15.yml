"Lb15,1":
  text: "I PAN powiedział do Mojżesza:"
  tags: []
"Lb15,2":
  text: "Przemów do synów Izraela i powiedz im: Gdy przyjdziecie do ziemi waszego mieszkania, którą wam daję;"
  tags: []
"Lb15,3":
  text: "I będziecie chcieli złożyć PANU ofiarę spalaną na całopalenie, ofiarę bądź poślubioną, bądź dobrowolną lub też w wasze uroczyste święta, aby złożyć PANU miłą woń z wołów albo z owiec;"
  tags: []
"Lb15,4":
  text: "To niech składający PANU ofiarę złoży na ofiarę pokarmową dziesiątą część efy mąki pszennej zmieszanej z czwartą częścią hinu oliwy."
  tags: []
"Lb15,5":
  text: "A czwartą część hinu wina na ofiarę z płynów przygotujesz przy całopaleniu lub innej ofierze na każde jagnię."
  tags: []
"Lb15,6":
  text: "Przy baranie zaś złożysz na ofiarę pokarmową dwie dziesiąte efy mąki pszennej zmieszanej z trzecią częścią hinu oliwy."
  tags: []
"Lb15,7":
  text: "A na ofiarę z płynów złożysz jedną trzecią hinu wina jako miłą woń dla PANA."
  tags: []
"Lb15,8":
  text: "Gdy zaś będziesz składał cielca na ofiarę całopalną lub na ofiarę wypełnienia ślubu albo na ofiarę pojednawczą dla PANA;"
  tags: []
"Lb15,9":
  text: "Wtedy wraz z cielcem złożysz na ofiarę pokarmową trzy dziesiąte efy mąki pszennej zmieszanej z połową hinu oliwy."
  tags: []
"Lb15,10":
  text: "Na ofiarę pokarmową złożysz też połowę hinu wina, na ofiarę spalaną jako miłą woń dla PANA."
  tags: []
"Lb15,11":
  text: "Tak należy postąpić przy każdym wole, przy każdym baranie, jagnięciu lub koźlęciu."
  tags: []
"Lb15,12":
  text: "Według liczby, którą składacie, tak uczynicie z każdą ich sztuką według ich liczby."
  tags: []
"Lb15,13":
  text: "Każdy rodowity mieszkaniec postąpi w ten sposób, gdy będzie składał ofiarę spalaną jako miłą woń dla PANA."
  tags: []
"Lb15,14":
  text: "A jeśli obcy gości u was lub mieszka z wami od pokoleń i będzie chciał złożyć ofiarę spalaną jako miłą woń dla PANA, uczyni to tak, jak wy czynicie."
  tags: []
"Lb15,15":
  text: "Będzie jedna ustawa dla was i dla przybysza, który mieszka wśród was; będzie to ustawa wieczysta przez wszystkie wasze pokolenia. Przybysz będzie przed PANEM tak jak wy."
  tags: []
"Lb15,16":
  text: "Będzie jedno prawo i jeden sąd dla was i przybysza, który mieszka wśród was."
  tags: []
"Lb15,17":
  text: "I PAN powiedział do Mojżesza:"
  tags: []
"Lb15,18":
  text: "Przemów do synów Izraela i powiedz im: Gdy wejdziecie do ziemi, do której was wprowadzę;"
  tags: []
"Lb15,19":
  text: "A będziecie jeść chleb tej ziemi, to złożycie PANU ofiarę wzniesienia."
  tags: []
"Lb15,20":
  text: "Złożycie jako ofiarę wzniesienia placek z pierwocin waszych ciast; złożycie go tak jak ofiarę wzniesienia z klepiska."
  tags: []
"Lb15,21":
  text: "Będziecie składać PANU ofiarę wzniesienia z pierwocin waszych ciast przez wszystkie wasze pokolenia."
  tags: []
"Lb15,22":
  text: "A gdybyście zbłądzili i nie wypełnili wszystkich tych przykazań, które PAN nadał przez Mojżesza;"
  tags: []
"Lb15,23":
  text: "Tego wszystkiego, co PAN wam rozkazał przez Mojżesza, od tego dnia, w którym PAN to nakazał, i potem przez wszystkie wasze pokolenia;"
  tags: []
"Lb15,24":
  text: "Jeśli popełniono ten błąd nieświadomie przez zgromadzenie, to całe zgromadzenie złoży jednego młodego cielca na całopalenie, na miłą woń dla PANA, wraz z jego ofiarą pokarmową i ofiarą z płynów według zwyczaju, oraz jednego kozła ze stada na ofiarę za grzech."
  tags: []
"Lb15,25":
  text: "I kapłan dokona przebłagania za całe zgromadzenie synów Izraela, i będzie im przebaczone, gdyż stało się to nieświadomie. A oni przyniosą PANU swoją ofiarę na ofiarę spalaną i swoją ofiarę za grzech przed PANEM za swój błąd."
  tags: []
"Lb15,26":
  text: "I będzie przebaczone całemu zgromadzeniu synów Izraela i przybyszowi, który mieszka pośród nich, ponieważ cały lud popełnił to nieświadomie."
  tags: []
"Lb15,27":
  text: "A jeśli tylko jedna osoba zgrzeszy nieświadomie, wtedy przyniesie roczną kozę na ofiarę za grzech;"
  tags: []
"Lb15,28":
  text: "I kapłan dokona przebłagania za człowieka, który zbłądził, grzesząc wobec PANA nieświadomie; dokona za niego przebłagania i będzie mu przebaczone."
  tags: []
"Lb15,29":
  text: "Będzie jedno prawo dla tego, który grzeszy nieświadomie, zarówno dla rodowitego mieszkańca wśród synów Izraela, jak i dla przybysza, który mieszka pośród nich."
  tags: []
"Lb15,30":
  text: "Lecz człowiek, który bezczelnie zgrzeszy świadomie, zarówno rodowity mieszkaniec, jak i przybysz, znieważa PANA; człowiek ten zostanie wykluczony spośród swego ludu."
  tags: []
"Lb15,31":
  text: "Wzgardził bowiem słowem PANA i złamał jego przykazanie; taki człowiek musi zostać wykluczony; na nim ciąży jego nieprawość."
  tags: []
"Lb15,32":
  text: "A gdy synowie Izraela byli na pustyni, spotkali człowieka zbierającego drwa w dzień szabatu."
  tags: []
"Lb15,33":
  text: "I ci, którzy go spotkali zbierającego drwa, przyprowadzili go do Mojżesza i Aarona, i do całego zgromadzenia."
  tags: []
"Lb15,34":
  text: "I osadzili go pod strażą, bo jeszcze im nie oznajmiono, jak należy z takim postąpić."
  tags: []
"Lb15,35":
  text: "Wtedy PAN powiedział do Mojżesza: Ten człowiek musi ponieść śmierć; niech całe zgromadzenie go ukamienuje poza obozem."
  tags: []
"Lb15,36":
  text: "Całe zgromadzenie wyprowadziło go poza obóz i ukamienowało, i umarł, jak PAN rozkazał Mojżeszowi."
  tags: []
"Lb15,37":
  text: "I PAN powiedział do Mojżesza:"
  tags: []
"Lb15,38":
  text: "Przemów do synów Izraela i powiedz im, aby robili sobie frędzle na skrajach swoich szat przez wszystkie pokolenia, a do frędzli niech przyprawią sznurek z błękitnej tkaniny."
  tags: []
"Lb15,39":
  text: "I będziecie mieć te frędzle, żebyście na nie spoglądali i przypominali sobie wszystkie przykazania PANA, aby je wypełnić, a nie podążali za własnym sercem i własnymi oczami, za którymi idąc, cudzołożylibyście;"
  tags: []
"Lb15,40":
  text: "Abyście pamiętali i wypełniali wszystkie moje przykazania, i byli święci dla waszego Boga."
  tags: []
"Lb15,41":
  text: "Ja jestem PAN, wasz Bóg, który was wyprowadził z ziemi Egiptu, aby być waszym Bogiem. Ja jestem PAN, wasz Bóg."
  tags: []
