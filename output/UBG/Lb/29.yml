"Lb29,1":
  text: "Pierwszego dnia siódmego miesiąca będziecie mieli święte zgromadzenie; nie będziecie wykonywać żadnej ciężkiej pracy. Będzie to dla was dzień wesołego trąbienia."
  tags: []
"Lb29,2":
  text: "I złożycie jako całopalenie, na miłą woń dla PANA, jednego młodego cielca, jednego barana oraz siedem rocznych baranków bez skazy;"
  tags: []
"Lb29,3":
  text: "A ich ofiarą pokarmową z mąki pszennej zmieszanej z oliwą będzie: trzy dziesiąte efy na cielca, dwie dziesiąte części na barana;"
  tags: []
"Lb29,4":
  text: "I jedna dziesiąta na każdego baranka z tych siedmiu baranków;"
  tags: []
"Lb29,5":
  text: "Oraz jednego kozła z kóz jako ofiarę za grzech, by dokonać za was przebłagania;"
  tags: []
"Lb29,6":
  text: "Oprócz comiesięcznego całopalenia i jego ofiary pokarmowej, oprócz nieustannego całopalenia i jego ofiary pokarmowej oraz ich ofiar z płynów, zgodnie z ich przepisem, na miłą woń; będzie to ofiara spalana dla PANA."
  tags: []
"Lb29,7":
  text: "Dziesiątego dnia tego siódmego miesiąca będziecie mieć święte zgromadzenie i będziecie trapić swoje dusze. Nie będziecie wykonywać żadnej ciężkiej pracy."
  tags: []
"Lb29,8":
  text: "I złożycie PANU całopalenie, na miłą woń, jednego młodego cielca, jednego barana i siedem rocznych baranków. Mają być bez skazy."
  tags: []
"Lb29,9":
  text: "A ich ofiarą pokarmową z mąki pszennej zmieszanej z oliwą będzie: trzy dziesiąte efy na cielca, dwie dziesiąte na barana;"
  tags: []
"Lb29,10":
  text: "I jedna dziesiąta na każdego baranka z tych siedmiu baranków;"
  tags: []
"Lb29,11":
  text: "Oraz jednego kozła z kóz na ofiarę za grzech oprócz ofiary za grzech na przebłaganie i oprócz nieustannego całopalenia i jego ofiary pokarmowej oraz ich ofiar z płynów."
  tags: []
"Lb29,12":
  text: "A piętnastego dnia tego siódmego miesiąca będziecie mieć święte zgromadzenie. Nie będziecie wykonywać żadnej ciężkiej pracy, lecz będziecie obchodzić święto dla PANA przez siedem dni."
  tags: []
"Lb29,13":
  text: "I złożycie całopalenie jako ofiarę spalaną, na miłą woń dla PANA, trzynaście młodych cielców, dwa barany i czternaście rocznych baranków. Mają być bez skazy."
  tags: []
"Lb29,14":
  text: "A ich ofiarą pokarmową z mąki pszennej zmieszanej z oliwą będzie: trzy dziesiąte efy na każdego cielca z tych trzynastu cielców i dwie dziesiąte na każdego barana z tych dwóch baranów;"
  tags: []
"Lb29,15":
  text: "I jedna dziesiąta na każdego baranka z tych czternastu baranków;"
  tags: []
"Lb29,16":
  text: "Oraz jednego kozła z kóz na ofiarę za grzech oprócz nieustannego całopalenia, jego ofiary pokarmowej i jego ofiary z płynów."
  tags: []
"Lb29,17":
  text: "A drugiego dnia złożycie dwanaście młodych cielców, dwa barany, czternaście rocznych baranków bez skazy;"
  tags: []
"Lb29,18":
  text: "I ich ofiarę pokarmową, i ich ofiary z płynów do każdego cielca, do każdego barana i do każdego baranka, według ich liczby i według ich przepisów;"
  tags: []
"Lb29,19":
  text: "Oraz jednego kozła z kóz na ofiarę za grzech, oprócz nieustannego całopalenia, jego ofiary pokarmowej i ich ofiar z płynów."
  tags: []
"Lb29,20":
  text: "A trzeciego dnia złożycie jedenaście cielców, dwa barany, czternaście rocznych baranków bez skazy;"
  tags: []
"Lb29,21":
  text: "I ich ofiarę pokarmową, i ich ofiary z płynów do każdego cielca, do każdego barana i do każdego baranka, według ich liczby i według ich przepisów;"
  tags: []
"Lb29,22":
  text: "Oraz jednego kozła na ofiarę za grzech oprócz nieustannego całopalenia, jego ofiary pokarmowej i jego ofiary z płynów."
  tags: []
"Lb29,23":
  text: "A czwartego dnia złożycie dziesięć cielców, dwa barany, czternaście rocznych baranków bez skazy;"
  tags: []
"Lb29,24":
  text: "Ich ofiarę pokarmową i ich ofiary z płynów do każdego cielca, do każdego barana i do każdego baranka, według ich liczby i według ich przepisów;"
  tags: []
"Lb29,25":
  text: "Oraz jednego kozła z kóz na ofiarę za grzech oprócz nieustannego całopalenia, jego ofiary pokarmowej i jego ofiary z płynów."
  tags: []
"Lb29,26":
  text: "A piątego dnia złożycie dziewięć cielców, dwa barany, czternaście rocznych baranków bez skazy;"
  tags: []
"Lb29,27":
  text: "I ich ofiarę pokarmową, i ich ofiary z płynów do każdego cielca, do każdego barana i do każdego baranka, według ich liczby i według ich przepisów;"
  tags: []
"Lb29,28":
  text: "Oraz jednego kozła na ofiarę za grzech oprócz nieustannego całopalenia, jego ofiary pokarmowej i jego ofiary z płynów."
  tags: []
"Lb29,29":
  text: "A szóstego dnia złożycie osiem cielców, dwa barany, czternaście rocznych baranków bez skazy;"
  tags: []
"Lb29,30":
  text: "I ich ofiarę pokarmową, i ich ofiary z płynów do każdego cielca, do każdego barana i do każdego baranka, według ich liczby i według ich przepisów;"
  tags: []
"Lb29,31":
  text: "Oraz jednego kozła na ofiarę za grzech oprócz nieustannego całopalenia, jego ofiary pokarmowej i jego ofiar z płynów."
  tags: []
"Lb29,32":
  text: "A siódmego dnia złożycie siedem cielców, dwa barany, czternaście rocznych baranków bez skazy;"
  tags: []
"Lb29,33":
  text: "I ich ofiarę pokarmową, i ich ofiary z płynów do każdego cielca, do każdego barana i do każdego baranka, według ich liczby i według ich przepisów;"
  tags: []
"Lb29,34":
  text: "Oraz jednego kozła na ofiarę za grzech oprócz nieustannego całopalenia, jego ofiary pokarmowej i jego ofiary z płynów."
  tags: []
"Lb29,35":
  text: "A ósmego dnia będziecie mieli uroczyste święto. Nie będziecie wykonywać żadnej ciężkiej pracy."
  tags: []
"Lb29,36":
  text: "Złożycie całopalenie jako ofiarę spalaną, na miłą woń dla PANA, jednego cielca, jednego barana, siedem rocznych baranków bez skazy;"
  tags: []
"Lb29,37":
  text: "Ich ofiarę pokarmową i ich ofiary z płynów do cielca, do barana i do każdego baranka, według ich liczby i według ich przepisów;"
  tags: []
"Lb29,38":
  text: "Oraz jednego kozła na ofiarę za grzech oprócz nieustannego całopalenia, jego ofiary pokarmowej i jego ofiary z płynów."
  tags: []
"Lb29,39":
  text: "To wszystko będziecie składać PANU podczas waszych uroczystych świąt oprócz waszych ślubów i dobrowolnych ofiar na wasze całopalenia, na wasze ofiary pokarmowe, na wasze ofiary z płynów i na wasze ofiary pojednawcze."
  tags: []
"Lb29,40":
  text: "I Mojżesz powiedział synom Izraela wszystko, co PAN mu rozkazał."
  tags: []
