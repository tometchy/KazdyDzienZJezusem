"Lb29,1": "Pierwszego dnia siódmego miesiąca będziecie mieli święte zgromadzenie; nie będziecie wykonywać żadnej ciężkiej pracy. Będzie to dla was dzień wesołego trąbienia."
"Lb29,2": "I złożycie jako całopalenie, na miłą woń dla PANA, jednego młodego cielca, jednego barana oraz siedem rocznych baranków bez skazy;"
"Lb29,3": "A ich ofiarą pokarmową z mąki pszennej zmieszanej z oliwą będzie: trzy dziesiąte efy na cielca, dwie dziesiąte części na barana;"
"Lb29,4": "I jedna dziesiąta na każdego baranka z tych siedmiu baranków;"
"Lb29,5": "Oraz jednego kozła z kóz jako ofiarę za grzech, by dokonać za was przebłagania;"
"Lb29,6": "Oprócz comiesięcznego całopalenia i jego ofiary pokarmowej, oprócz nieustannego całopalenia i jego ofiary pokarmowej oraz ich ofiar z płynów, zgodnie z ich przepisem, na miłą woń; będzie to ofiara spalana dla PANA."
"Lb29,7": "Dziesiątego dnia tego siódmego miesiąca będziecie mieć święte zgromadzenie i będziecie trapić swoje dusze. Nie będziecie wykonywać żadnej ciężkiej pracy."
"Lb29,8": "I złożycie PANU całopalenie, na miłą woń, jednego młodego cielca, jednego barana i siedem rocznych baranków. Mają być bez skazy."
"Lb29,9": "A ich ofiarą pokarmową z mąki pszennej zmieszanej z oliwą będzie: trzy dziesiąte efy na cielca, dwie dziesiąte na barana;"
"Lb29,10": "I jedna dziesiąta na każdego baranka z tych siedmiu baranków;"
"Lb29,11": "Oraz jednego kozła z kóz na ofiarę za grzech oprócz ofiary za grzech na przebłaganie i oprócz nieustannego całopalenia i jego ofiary pokarmowej oraz ich ofiar z płynów."
"Lb29,12": "A piętnastego dnia tego siódmego miesiąca będziecie mieć święte zgromadzenie. Nie będziecie wykonywać żadnej ciężkiej pracy, lecz będziecie obchodzić święto dla PANA przez siedem dni."
"Lb29,13": "I złożycie całopalenie jako ofiarę spalaną, na miłą woń dla PANA, trzynaście młodych cielców, dwa barany i czternaście rocznych baranków. Mają być bez skazy."
"Lb29,14": "A ich ofiarą pokarmową z mąki pszennej zmieszanej z oliwą będzie: trzy dziesiąte efy na każdego cielca z tych trzynastu cielców i dwie dziesiąte na każdego barana z tych dwóch baranów;"
"Lb29,15": "I jedna dziesiąta na każdego baranka z tych czternastu baranków;"
"Lb29,16": "Oraz jednego kozła z kóz na ofiarę za grzech oprócz nieustannego całopalenia, jego ofiary pokarmowej i jego ofiary z płynów."
"Lb29,17": "A drugiego dnia złożycie dwanaście młodych cielców, dwa barany, czternaście rocznych baranków bez skazy;"
"Lb29,18": "I ich ofiarę pokarmową, i ich ofiary z płynów do każdego cielca, do każdego barana i do każdego baranka, według ich liczby i według ich przepisów;"
"Lb29,19": "Oraz jednego kozła z kóz na ofiarę za grzech, oprócz nieustannego całopalenia, jego ofiary pokarmowej i ich ofiar z płynów."
"Lb29,20": "A trzeciego dnia złożycie jedenaście cielców, dwa barany, czternaście rocznych baranków bez skazy;"
"Lb29,21": "I ich ofiarę pokarmową, i ich ofiary z płynów do każdego cielca, do każdego barana i do każdego baranka, według ich liczby i według ich przepisów;"
"Lb29,22": "Oraz jednego kozła na ofiarę za grzech oprócz nieustannego całopalenia, jego ofiary pokarmowej i jego ofiary z płynów."
"Lb29,23": "A czwartego dnia złożycie dziesięć cielców, dwa barany, czternaście rocznych baranków bez skazy;"
"Lb29,24": "Ich ofiarę pokarmową i ich ofiary z płynów do każdego cielca, do każdego barana i do każdego baranka, według ich liczby i według ich przepisów;"
"Lb29,25": "Oraz jednego kozła z kóz na ofiarę za grzech oprócz nieustannego całopalenia, jego ofiary pokarmowej i jego ofiary z płynów."
"Lb29,26": "A piątego dnia złożycie dziewięć cielców, dwa barany, czternaście rocznych baranków bez skazy;"
"Lb29,27": "I ich ofiarę pokarmową, i ich ofiary z płynów do każdego cielca, do każdego barana i do każdego baranka, według ich liczby i według ich przepisów;"
"Lb29,28": "Oraz jednego kozła na ofiarę za grzech oprócz nieustannego całopalenia, jego ofiary pokarmowej i jego ofiary z płynów."
"Lb29,29": "A szóstego dnia złożycie osiem cielców, dwa barany, czternaście rocznych baranków bez skazy;"
"Lb29,30": "I ich ofiarę pokarmową, i ich ofiary z płynów do każdego cielca, do każdego barana i do każdego baranka, według ich liczby i według ich przepisów;"
"Lb29,31": "Oraz jednego kozła na ofiarę za grzech oprócz nieustannego całopalenia, jego ofiary pokarmowej i jego ofiar z płynów."
"Lb29,32": "A siódmego dnia złożycie siedem cielców, dwa barany, czternaście rocznych baranków bez skazy;"
"Lb29,33": "I ich ofiarę pokarmową, i ich ofiary z płynów do każdego cielca, do każdego barana i do każdego baranka, według ich liczby i według ich przepisów;"
"Lb29,34": "Oraz jednego kozła na ofiarę za grzech oprócz nieustannego całopalenia, jego ofiary pokarmowej i jego ofiary z płynów."
"Lb29,35": "A ósmego dnia będziecie mieli uroczyste święto. Nie będziecie wykonywać żadnej ciężkiej pracy."
"Lb29,36": "Złożycie całopalenie jako ofiarę spalaną, na miłą woń dla PANA, jednego cielca, jednego barana, siedem rocznych baranków bez skazy;"
"Lb29,37": "Ich ofiarę pokarmową i ich ofiary z płynów do cielca, do barana i do każdego baranka, według ich liczby i według ich przepisów;"
"Lb29,38": "Oraz jednego kozła na ofiarę za grzech oprócz nieustannego całopalenia, jego ofiary pokarmowej i jego ofiary z płynów."
"Lb29,39": "To wszystko będziecie składać PANU podczas waszych uroczystych świąt oprócz waszych ślubów i dobrowolnych ofiar na wasze całopalenia, na wasze ofiary pokarmowe, na wasze ofiary z płynów i na wasze ofiary pojednawcze."
"Lb29,40": "I Mojżesz powiedział synom Izraela wszystko, co PAN mu rozkazał."
