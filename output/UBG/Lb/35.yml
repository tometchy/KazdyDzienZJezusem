"Lb35,1": "I PAN powiedział do Mojżesza na równinach Moabu, nad Jordanem, naprzeciw Jerycha:"
"Lb35,2": "Rozkaż synom Izraela, aby dali Lewitom ze swej dziedzicznej posiadłości miasta na zamieszkanie, dacie Lewitom też pastwiska dokoła ich miast."
"Lb35,3": "Będą mieli miasta na mieszkanie, a ich pastwiska będą dla ich bydła, dla ich dobytku i dla wszystkich ich zwierząt."
"Lb35,4": "Pastwiska miast, które dacie Lewitom, będą rozciągać się na tysiąc łokci wokół murów miasta."
"Lb35,5": "Odmierzycie również poza miastem dwa tysiące łokci po stronie wschodniej, po stronie południowej też dwa tysiące łokci, także po stronie zachodniej dwa tysiące łokci i po stronie północnej dwa tysiące łokci, a miasto będzie w środku. To będą pastwiska ich miast."
"Lb35,6": "A spośród tych miast, które dacie Lewitom, sześć będzie miastami schronienia, które przekażecie, aby mógł tam uciec zabójca. Oprócz nich dacie im czterdzieści dwa miasta."
"Lb35,7": "Wszystkich miast, które dacie Lewitom, będzie czterdzieści osiem wraz z ich pastwiskami."
"Lb35,8": "A miasta, które im dacie, będą pochodziły z posiadłości synów Izraela; od liczniejszego dacie więcej, a od mniej licznego dacie mniej; każdy da Lewitom ze swoich miast stosownie do otrzymanego dziedzictwa."
"Lb35,9": "Potem PAN powiedział do Mojżesza:"
"Lb35,10": "Przemów do synów Izraela i powiedz im: Gdy przejdziecie przez Jordan do ziemi Kanaan;"
"Lb35,11": "Wyznaczcie sobie miasta, które będą dla was miastami schronienia, aby mógł tam uciec zabójca, który zabił kogoś nieumyślnie."
"Lb35,12": "Te miasta będą dla was miastami schronienia przed mścicielem, aby zabójca nie poniósł śmierci, zanim nie stanie przed zgromadzeniem na sąd."
"Lb35,13": "A z miast, które oddacie, sześć będzie dla was miastami schronienia."
"Lb35,14": "Trzy miasta dacie z tej strony Jordanu, a trzy miasta dacie w ziemi Kanaan; będą one miastami schronienia."
"Lb35,15": "Tych sześć miast będzie schronieniem dla synów Izraela, dla obcego i dla przybysza, który mieszka wśród was, aby mógł tam uciec każdy, kto by zabił człowieka nieumyślnie."
"Lb35,16": "Jeśli jednak uderzy go przedmiotem żelaznym, tak że ten umrze, jest mordercą. Morderca poniesie śmierć."
"Lb35,17": "Jeśli uderzy go kamieniem, który ma w ręce i którym można zabić, a ten umrze, jest mordercą. Morderca poniesie śmierć."
"Lb35,18": "Albo jeśli uderzy go ręcznym przedmiotem drewnianym, którym można zabić, a ten umrze, jest mordercą. Morderca poniesie śmierć."
"Lb35,19": "Mściciel krwi sam zabije tego mordercę. Gdziekolwiek go spotka, sam go zabije."
"Lb35,20": "Jeśli z nienawiści popchnie go albo rzuci w niego czymś z zasadzki, a ten umrze;"
"Lb35,21": "Albo jeśli z wrogości uderzy go ręką, a ten umrze, to ten, który uderzył, poniesie śmierć, bo jest mordercą. Mściciel krwi zabije mordercę, gdziekolwiek go spotka."
"Lb35,22": "Lecz jeśli niespodziewanie i bez wrogości go popchnie albo rzuci w niego czymkolwiek bez zasadzki;"
"Lb35,23": "Albo jeśli nie widząc, upuści na niego jakiś kamień, którym można zabić, a ten umrze, chociaż nie był jego wrogiem ani nie szukał jego krzywdy;"
"Lb35,24": "Wtedy zgromadzenie rozsądzi pomiędzy tym, który zabił, a między mścicielem krwi według tych praw."
"Lb35,25": "I zgromadzenie wybawi zabójcę z rąk mściciela krwi; zgromadzenie też przekaże go miastu schronienia, do którego uciekł. Tam będzie mieszkał aż do śmierci najwyższego kapłana, namaszczonego olejem świętym."
"Lb35,26": "Lecz jeśli zabójca wyjdzie poza granice swojego miasta schronienia, do którego uciekł;"
"Lb35,27": "I mściciel trafi tam na niego poza granicą jego miasta schronienia, i zabije zabójcę, to nie będzie winien krwi."
"Lb35,28": "Ten bowiem ma mieszkać w swoim mieście schronienia aż do śmierci najwyższego kapłana. Lecz po śmierci najwyższego kapłana zabójca może wrócić do ziemi swojej posiadłości."
"Lb35,29": "To będzie dla was ustawa prawna przez wszystkie wasze pokolenia, we wszystkich waszych domach."
"Lb35,30": "Ktokolwiek zabije człowieka, to na podstawie zeznania świadków zostanie zabity zabójca. Lecz jeden świadek nie może świadczyć przeciwko komuś, by skazać go na śmierć."
"Lb35,31": "Nie weźmiecie też okupu za życie zabójcy, który zasługuje na śmierć. Musi ponieść śmierć."
"Lb35,32": "Nie weźmiecie też okupu od tego, który uciekł do swojego miasta schronienia, aby mógł wrócić i zamieszkać w swojej ziemi, zanim umrze kapłan;"
"Lb35,33": "Abyście nie bezcześcili ziemi, w której będziecie, gdyż krew bezcześci ziemię; a ziemia nie może być inaczej oczyszczona od przelanej w niej krwi jak tylko krwią tego, który ją przelał."
"Lb35,34": "Nie zanieczyszczajcie więc ziemi, w której mieszkacie, w której przebywam też ja. Ja bowiem jestem PAN, który przebywa wśród synów Izraela."
