"Lb13,1":
  text: "I PAN powiedział do Mojżesza:"
  tags: []
"Lb13,2":
  text: "Wyślij mężczyzn, aby wyszpiegowali ziemię Kanaan, którą daję synom Izraela. Z każdego pokolenia ich ojców wyślecie po jednym mężczyźnie; tych, którzy są wśród nich wodzami."
  tags: []
"Lb13,3":
  text: "Wysłał ich więc Mojżesz z pustyni Paran, zgodnie z rozkazem PANA. Wszyscy ci mężczyźni byli naczelnikami wśród synów Izraela."
  tags: []
"Lb13,4":
  text: "A oto są ich imiona: z pokolenia Rubena – Szamua, syn Zakkura."
  tags: []
"Lb13,5":
  text: "Z pokolenia Symeona – Szafat, syn Choriego."
  tags: []
"Lb13,6":
  text: "Z pokolenia Judy – Kaleb, syn Jefunnego."
  tags: []
"Lb13,7":
  text: "Z pokolenia Issachara – Jigal, syn Józefa."
  tags: []
"Lb13,8":
  text: "Z pokolenia Efraima – Ozeasz, syn Nuna."
  tags: []
"Lb13,9":
  text: "Z pokolenia Beniamina – Palti, syn Rafua."
  tags: []
"Lb13,10":
  text: "Z pokolenia Zebulona – Gaddiel, syn Sodiego."
  tags: []
"Lb13,11":
  text: "Z pokolenia Józefa, to jest z potomstwa Manassesa – Gaddi, syn Susiego."
  tags: []
"Lb13,12":
  text: "Z pokolenia Dana – Ammiel, syn Gemalliego."
  tags: []
"Lb13,13":
  text: "Z pokolenia Aszera – Setur, syn Mikaela."
  tags: []
"Lb13,14":
  text: "Z pokolenia Neftalego – Nachbi, syn Wafsiego."
  tags: []
"Lb13,15":
  text: "Z pokolenia Gada – Geuel, syn Makiego."
  tags: []
"Lb13,16":
  text: "To są imiona mężczyzn, których Mojżesz wysłał, aby wyszpiegowali ziemię. A Ozeaszowi, synowi Nuna, nadał imię Jozue."
  tags: []
"Lb13,17":
  text: "A gdy Mojżesz wysłał ich, aby wyszpiegowali ziemię Kanaan, powiedział do nich: Idźcie w tę stronę, na południe, i wejdźcie na górę;"
  tags: []
"Lb13,18":
  text: "I obejrzyjcie ziemię, jaka ona jest, oraz lud, który w niej mieszka, czy jest silny, czy słaby, czy jest ich mało, czy wielu."
  tags: []
"Lb13,19":
  text: "I jaka jest ziemia, w której mieszkają: czy jest dobra, czy zła. I jakie są miasta, w których mieszkają: czy to są obozowiska, czy warownie."
  tags: []
"Lb13,20":
  text: "I jaka jest ziemia: czy urodzajna, czy jałowa; czy są na niej drzewa, czy nie. Bądźcie odważni i przynieście nam z owocu tamtej ziemi. A był to czas dojrzewania winogron."
  tags: []
"Lb13,21":
  text: "Poszli więc i wyszpiegowali ziemię, od pustyni Syn aż do Rechob, którędy wchodzi się do Chamat."
  tags: []
"Lb13,22":
  text: "A kierując się na południe, dotarli do Hebronu, gdzie byli Achiman, Szeszaj i Talmaj, synowie Anaka; a Hebron zbudowano siedem lat przed Soan w Egipcie."
  tags: []
"Lb13,23":
  text: "Potem przybyli do potoku Eszkol i ucięli tam gałąź z jedną kiścią winogron, i nieśli ją we dwóch na drążku; wzięli też jabłka granatu i figi."
  tags: []
"Lb13,24":
  text: "I nazwano to miejsce potokiem Eszkol od winogrona, które synowie Izraela tam ucięli."
  tags: []
"Lb13,25":
  text: "I po czterdziestu dniach wrócili z wyszpiegowania ziemi."
  tags: []
"Lb13,26":
  text: "A kiedy wrócili, przyszli do Mojżesza, Aarona i całego zgromadzenia synów Izraela na pustynię Paran, do Kadesz; zdali sprawę im oraz całemu zgromadzeniu, pokazali im też owoce tej ziemi."
  tags: []
"Lb13,27":
  text: "I opowiedzieli mu: Przyszliśmy do ziemi, do której nas wysłałeś. Ona rzeczywiście opływa mlekiem i miodem, a to są jej owoce;"
  tags: []
"Lb13,28":
  text: "Tylko że lud, który mieszka w tej ziemi, jest silny, a miasta są obwarowane i bardzo wielkie; widzieliśmy tam również synów Anaka."
  tags: []
"Lb13,29":
  text: "Amalekici mieszkają w południowej części ziemi, a Chetyci, Jebusyci, Amoryci mieszkają w górach; Kananejczycy zaś mieszkają nad morzem i nad brzegiem Jordanu."
  tags: []
"Lb13,30":
  text: "Wtedy Kaleb uspokajał lud szemrzący przeciw Mojżeszowi i mówił: Pójdźmy i posiądźmy ziemię, bo zdołamy ją podbić."
  tags: []
"Lb13,31":
  text: "Lecz mężczyźni, którzy z nim poszli, powiedzieli: Nie możemy wyruszyć przeciw tamtemu ludowi, bo jest silniejszy od nas."
  tags: []
"Lb13,32":
  text: "I rozpuścili wśród synów Izraela złą wieść o ziemi, którą wyszpiegowali, mówiąc: Ziemia, przez którą przeszliśmy, aby ją zbadać, jest ziemią, która pożera swoich mieszkańców, a wszyscy ludzie, których w niej widzieliśmy, to ludzie wysokiego wzrostu."
  tags: []
"Lb13,33":
  text: "Tam też widzieliśmy olbrzymów, synów Anaka, pochodzących od olbrzymów. Przy nich wydaliśmy się sobie jak szarańcza, takimi też byliśmy w ich oczach."
  tags: []
