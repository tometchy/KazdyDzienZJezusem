"Lb14,1":
  text: "Wtedy całe zgromadzenie podniosło donośny lament i lud płakał tej nocy."
  tags: []
"Lb14,2":
  text: "I wszyscy synowie Izraela szemrali przeciwko Mojżeszowi i Aaronowi; i całe zgromadzenie mówiło do nich: Obyśmy pomarli w ziemi Egiptu albo na tej pustyni!"
  tags: []
"Lb14,3":
  text: "Po co PAN prowadzi nas do tej ziemi? Abyśmy padli od miecza? Aby nasze żony i dzieci stały się łupem? Czy nie lepiej nam wrócić do Egiptu?"
  tags: []
"Lb14,4":
  text: "I mówili między sobą: Ustanówmy sobie wodza i wróćmy do Egiptu."
  tags: []
"Lb14,5":
  text: "Wtedy Mojżesz i Aaron upadli na twarz przed całym zgromadzeniem synów Izraela."
  tags: []
"Lb14,6":
  text: "A Jozue, syn Nuna, i Kaleb, syn Jefunnego, którzy byli wśród tych, co wyszpiegowali ziemię, rozdarli swoje szaty;"
  tags: []
"Lb14,7":
  text: "I powiedzieli do całego zgromadzenia synów Izraela: Ziemia, przez którą przeszliśmy, aby ją wyszpiegować, jest ziemią bardzo dobrą."
  tags: []
"Lb14,8":
  text: "Jeśli PAN upodoba nas sobie, to wprowadzi nas do tej ziemi i da ją nam – tę ziemię, która opływa mlekiem i miodem."
  tags: []
"Lb14,9":
  text: "Tylko nie buntujcie się przeciwko PANU ani nie bójcie się ludu tej ziemi, bo będą naszym chlebem; ich obrona odwróciła się od nich, a PAN jest z nami. Nie bójcie się ich."
  tags: []
"Lb14,10":
  text: "I całe zgromadzenie mówiło, aby ich ukamienować; ale chwała PANA ukazała się wszystkim synom Izraela nad Namiotem Zgromadzenia."
  tags: []
"Lb14,11":
  text: "I PAN powiedział do Mojżesza: Jak długo ten lud będzie mnie drażnić? Jak długo nie będzie mi wierzyć pomimo tych wszystkich znaków, które wśród nich uczyniłem?"
  tags: []
"Lb14,12":
  text: "Uderzę ich zarazą i wydziedziczę, a ciebie uczynię narodem większym i silniejszym niż oni."
  tags: []
"Lb14,13":
  text: "Lecz Mojżesz powiedział do PANA: Usłyszą o tym Egipcjanie, spośród których wyprowadziłeś ten lud swoją mocą;"
  tags: []
"Lb14,14":
  text: "I opowiedzą o tym obywatelom tej ziemi. Gdyż słyszeli, że ty, PANIE, jesteś pośród tego ludu, że ty, PANIE, bywasz widziany twarzą w twarz, że twój obłok stoi nad nimi i że kroczysz przed nimi w słupie obłoku za dnia, a w słupie ognia w nocy."
  tags: []
"Lb14,15":
  text: "Gdybyś więc zabił ten lud jak jednego człowieka, to narody, które słyszały o twojej sławie, mówiłyby tak:"
  tags: []
"Lb14,16":
  text: "Ponieważ PAN nie mógł wprowadzić tego ludu do ziemi, którą im przysiągł, to zabił ich na pustyni."
  tags: []
"Lb14,17":
  text: "Teraz więc proszę, niech się okaże wielka moc mojego PANA, jak powiedziałeś:"
  tags: []
"Lb14,18":
  text: "PAN nierychły do gniewu i pełen wielkiego miłosierdzia, przebaczający nieprawość i przestępstwo, który nie uniewinnia winnego, lecz nawiedza nieprawość ojców na synach do trzeciego i czwartego pokolenia."
  tags: []
"Lb14,19":
  text: "Przebacz, proszę, nieprawość twego ludu według wielkości twego miłosierdzia, tak jak przebaczałeś temu ludowi od Egiptu aż dotąd."
  tags: []
"Lb14,20":
  text: "Wtedy PAN powiedział: Przebaczyłem według twego słowa."
  tags: []
"Lb14,21":
  text: "Ale jak żyję i jak cała ziemia jest napełniona chwałą PANA;"
  tags: []
"Lb14,22":
  text: "Tak wszyscy, którzy widzieli moją chwałę i moje znaki, które czyniłem w Egipcie i na pustyni, a wystawiali mnie na próbę już dziesięciokrotnie i nie słuchali mego głosu;"
  tags: []
"Lb14,23":
  text: "Nie zobaczą tej ziemi, którą przysiągłem ich ojcom, a żaden z tych, którzy mnie rozdrażnili, nie zobaczy jej."
  tags: []
"Lb14,24":
  text: "Ale mojego sługę Kaleba za to, że był w nim inny duch i trwał całkowicie przy mnie, wprowadzę do ziemi, do której wszedł, a jego potomstwo ją odziedziczy."
  tags: []
"Lb14,25":
  text: "A ponieważ Amalekici i Kananejczycy mieszkają w dolinie, to jutro zawróćcie i wyruszcie na pustynię, w kierunku Morza Czerwonego."
  tags: []
"Lb14,26":
  text: "Ponadto PAN powiedział do Mojżesza i Aarona:"
  tags: []
"Lb14,27":
  text: "Jak długo mam znosić ten zły lud, który szemrze przeciwko mnie? Słyszałem szemrania synów Izraela, jakie mówią przeciwko mnie."
  tags: []
"Lb14,28":
  text: "Powiedz im: Jak żyję, mówi PAN, uczynię wam, jak mówiliście do moich uszu."
  tags: []
"Lb14,29":
  text: "Na tej pustyni legną wasze trupy i wszyscy spisani wśród was, w pełnej liczbie, od dwudziestu lat wzwyż, którzy szemraliście przeciwko mnie;"
  tags: []
"Lb14,30":
  text: "Nie wejdziecie do tej ziemi, którą przysiągłem dać wam na mieszkanie, z wyjątkiem Kaleba, syna Jefunnego, i Jozuego, syna Nuna;"
  tags: []
"Lb14,31":
  text: "A wasze dzieci, o których mówiliście, że staną się łupem, te wprowadzę i one zobaczą ziemię, którą wy wzgardziliście."
  tags: []
"Lb14,32":
  text: "Wasze trupy zaś legną na tej pustyni;"
  tags: []
"Lb14,33":
  text: "A wasi synowie będą się tułali po tej pustyni przez czterdzieści lat i poniosą karę za wasze cudzołóstwa, aż wasze trupy zniszczeją na pustyni."
  tags: []
"Lb14,34":
  text: "Według liczby dni, w ciągu których wyszpiegowaliście ziemię, to znaczy czterdzieści dni, dzień za rok, będziecie ponosić karę za wasze nieprawości przez czterdzieści lat i poznacie pomstę za odstąpienie ode mnie."
  tags: []
"Lb14,35":
  text: "Ja, PAN, powiedziałem, że tak postąpię z całym tym niegodziwym zgromadzeniem, które się zmówiło przeciwko mnie; na tej pustyni zginą i tu pomrą."
  tags: []
"Lb14,36":
  text: "Wtedy mężczyźni, których Mojżesz wysłał na wyszpiegowanie ziemi, a po powrocie pobudzili całe zgromadzenie do szemrania przeciwko niemu, rozpuszczając złą wieść o tej ziemi;"
  tags: []
"Lb14,37":
  text: "Ci mężczyźni, którzy rozpowiadali złą wieść o ziemi, pomarli przed PANEM wskutek plagi."
  tags: []
"Lb14,38":
  text: "Lecz Jozue, syn Nuna, i Kaleb, syn Jefunnego, pozostali żywi spośród tych mężczyzn, którzy poszli wyszpiegować ziemię."
  tags: []
"Lb14,39":
  text: "I Mojżesz powtórzył te słowa wszystkim synom Izraela, i lud bardzo płakał."
  tags: []
"Lb14,40":
  text: "Wstali więc wcześnie rano, wstąpili na szczyt góry i powiedzieli: Oto jesteśmy, pójdziemy na to miejsce, o którym PAN nam powiedział, bo zgrzeszyliśmy."
  tags: []
"Lb14,41":
  text: "Lecz Mojżesz powiedział im: Dlaczego przekraczacie słowo PANA? To się wam nie uda."
  tags: []
"Lb14,42":
  text: "Nie wyruszajcie, ponieważ nie ma PANA wśród was, abyście nie zostali pobici przez waszych wrogów."
  tags: []
"Lb14,43":
  text: "Gdyż Amalekici i Kananejczycy są tam przed wami i polegniecie od miecza. Ponieważ odwróciliście się od PANA, to PAN nie będzie z wami."
  tags: []
"Lb14,44":
  text: "Oni jednak uparli się, by wejść na szczyt góry. Lecz arka przymierza PANA i Mojżesz nie oddalili się z obozu."
  tags: []
"Lb14,45":
  text: "Wtedy Amalekici i Kananejczycy mieszkający na tej górze zstąpili, pobili ich i ścigali aż do Chormy."
  tags: []
