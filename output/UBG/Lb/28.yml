"Lb28,1": "I PAN powiedział do Mojżesza:"
"Lb28,2": "Rozkaż synom Izraela i powiedz im: Przestrzegajcie składania mi w wyznaczonym czasie mojej ofiary, mojego pokarmu dla moich spalanych ofiar na miłą woń dla mnie."
"Lb28,3": "I powiedz im: To jest ofiara spalana, którą będziecie składać PANU: dwa roczne baranki bez skazy codziennie, na nieustanne całopalenie;"
"Lb28,4": "Jednego baranka będziesz składać rankiem, a drugiego wieczorem."
"Lb28,5": "Do tego na ofiarę pokarmową jedną dziesiątą efy mąki pszennej zmieszanej z jedną czwartą hinu wytłoczonej oliwy."
"Lb28,6": "To jest nieustanne całopalenie, które ustalono na górze Synaj jako miłą woń, ofiarę spalaną dla PANA."
"Lb28,7": "A jej ofiarą z płynów będzie jedna czwarta hinu na jednego baranka; ofiarę z płynów, z mocnego napoju, wylejesz w miejscu świętym dla PANA."
"Lb28,8": "Drugiego baranka będziesz składał wieczorem; złożysz go podobnie jak poranną ofiarę pokarmową i ofiarę z płynów – jako ofiarę spalaną na miłą woń dla PANA."
"Lb28,9": "Lecz w dniu szabatu złożysz dwa roczne baranki bez skazy i dwie dziesiąte efy mąki pszennej zmieszanej z oliwą na ofiarę z pokarmów wraz z jej ofiarą z płynów."
"Lb28,10": "To jest całopalenie sobotnie w każdy szabat, oprócz nieustannego całopalenia i jego ofiary z płynów."
"Lb28,11": "A na początku każdego waszego miesiąca będziecie składać PANU całopalenie: dwa młode cielce, jednego barana, siedem rocznych baranków bez skazy;"
"Lb28,12": "I trzy dziesiąte efy mąki pszennej zmieszanej z oliwą na ofiarę pokarmową na każdego cielca oraz dwie dziesiąte efy mąki pszennej zmieszanej z oliwą na ofiarę pokarmową na każdego barana;"
"Lb28,13": "I jedną dziesiątą efy mąki pszennej zmieszanej z oliwą na ofiarę pokarmową na każdego baranka jako całopalenie na miłą woń, ofiarę spalaną dla PANA."
"Lb28,14": "Ich ofiarami z płynów będą: pół hinu wina na każdego cielca, jedna trzecia hinu na każdego barana i jedna czwarta hinu na każdego baranka; to jest całopalenie na nowiu księżyca przez wszystkie miesiące roku."
"Lb28,15": "Także jednego kozła ze stada jako ofiarę za grzech będziecie składać PANU oprócz nieustannego całopalenia oraz jego ofiary z płynów."
"Lb28,16": "A pierwszego miesiąca, czternastego dnia, jest Pascha PANA."
"Lb28,17": "A piętnastego dnia tego miesiąca jest uroczyste święto: przez siedem dni będziecie jeść przaśne chleby."
"Lb28,18": "Pierwszego dnia będzie święte zgromadzenie, nie będziecie wykonywać żadnej ciężkiej pracy."
"Lb28,19": "Lecz złożycie PANU ofiarę spalaną na całopalenie: dwa młode cielce, jednego barana i siedem rocznych baranków. Mają być bez skazy."
"Lb28,20": "A ich ofiara pokarmowa będzie z mąki pszennej zmieszanej z oliwą: będziecie składać trzy dziesiąte efy na każdego cielca, a dwie dziesiąte na każdego barana;"
"Lb28,21": "Po jednej dziesiątej efy złożysz na każdego baranka z tych siedmiu baranków;"
"Lb28,22": "I jednego kozła na ofiarę za grzech, na dokonanie przebłagania za was."
"Lb28,23": "Będziecie to wszystko składać oprócz porannego całopalenia, które jest nieustannym całopaleniem."
"Lb28,24": "Tak każdego dnia przez te siedem dni będziecie składać pokarm ofiary spalanej na miłą woń dla PANA. Będziecie to składać oprócz nieustannego całopalenia i jego ofiary z płynów."
"Lb28,25": "A siódmego dnia będziecie mieli święte zgromadzenie; nie będziecie wykonywać żadnej ciężkiej pracy."
"Lb28,26": "A w dniu pierwocin, gdy będziecie składać PANU nową ofiarę pokarmową, gdy się wypełnią wasze tygodnie, będziecie mieli święte zgromadzenie; nie będziecie wykonywać żadnej ciężkiej pracy."
"Lb28,27": "I złożycie PANU całopalenie na miłą woń: dwa młode cielce, jednego barana, siedem rocznych baranków."
"Lb28,28": "A na ich ofiarę pokarmową z mąki pszennej zmieszanej z oliwą: trzy dziesiąte efy na każdego cielca, dwie dziesiąte na każdego barana;"
"Lb28,29": "Po jednej dziesiątej na każdego baranka z tych siedmiu baranków;"
"Lb28,30": "I jednego kozła z kóz na dokonanie przebłagania za was."
"Lb28,31": "Będziecie to wszystko składać oprócz nieustannego całopalenia i jego ofiary pokarmowej, które mają być bez skazy, wraz z ich ofiarami z płynów."
