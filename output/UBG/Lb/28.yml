"Lb28,1":
  text: "I PAN powiedział do Mojżesza:"
  tags: []
"Lb28,2":
  text: "Rozkaż synom Izraela i powiedz im: Przestrzegajcie składania mi w wyznaczonym czasie mojej ofiary, mojego pokarmu dla moich spalanych ofiar na miłą woń dla mnie."
  tags: []
"Lb28,3":
  text: "I powiedz im: To jest ofiara spalana, którą będziecie składać PANU: dwa roczne baranki bez skazy codziennie, na nieustanne całopalenie;"
  tags: []
"Lb28,4":
  text: "Jednego baranka będziesz składać rankiem, a drugiego wieczorem."
  tags: []
"Lb28,5":
  text: "Do tego na ofiarę pokarmową jedną dziesiątą efy mąki pszennej zmieszanej z jedną czwartą hinu wytłoczonej oliwy."
  tags: []
"Lb28,6":
  text: "To jest nieustanne całopalenie, które ustalono na górze Synaj jako miłą woń, ofiarę spalaną dla PANA."
  tags: []
"Lb28,7":
  text: "A jej ofiarą z płynów będzie jedna czwarta hinu na jednego baranka; ofiarę z płynów, z mocnego napoju, wylejesz w miejscu świętym dla PANA."
  tags: []
"Lb28,8":
  text: "Drugiego baranka będziesz składał wieczorem; złożysz go podobnie jak poranną ofiarę pokarmową i ofiarę z płynów – jako ofiarę spalaną na miłą woń dla PANA."
  tags: []
"Lb28,9":
  text: "Lecz w dniu szabatu złożysz dwa roczne baranki bez skazy i dwie dziesiąte efy mąki pszennej zmieszanej z oliwą na ofiarę z pokarmów wraz z jej ofiarą z płynów."
  tags: []
"Lb28,10":
  text: "To jest całopalenie sobotnie w każdy szabat, oprócz nieustannego całopalenia i jego ofiary z płynów."
  tags: []
"Lb28,11":
  text: "A na początku każdego waszego miesiąca będziecie składać PANU całopalenie: dwa młode cielce, jednego barana, siedem rocznych baranków bez skazy;"
  tags: []
"Lb28,12":
  text: "I trzy dziesiąte efy mąki pszennej zmieszanej z oliwą na ofiarę pokarmową na każdego cielca oraz dwie dziesiąte efy mąki pszennej zmieszanej z oliwą na ofiarę pokarmową na każdego barana;"
  tags: []
"Lb28,13":
  text: "I jedną dziesiątą efy mąki pszennej zmieszanej z oliwą na ofiarę pokarmową na każdego baranka jako całopalenie na miłą woń, ofiarę spalaną dla PANA."
  tags: []
"Lb28,14":
  text: "Ich ofiarami z płynów będą: pół hinu wina na każdego cielca, jedna trzecia hinu na każdego barana i jedna czwarta hinu na każdego baranka; to jest całopalenie na nowiu księżyca przez wszystkie miesiące roku."
  tags: []
"Lb28,15":
  text: "Także jednego kozła ze stada jako ofiarę za grzech będziecie składać PANU oprócz nieustannego całopalenia oraz jego ofiary z płynów."
  tags: []
"Lb28,16":
  text: "A pierwszego miesiąca, czternastego dnia, jest Pascha PANA."
  tags: []
"Lb28,17":
  text: "A piętnastego dnia tego miesiąca jest uroczyste święto: przez siedem dni będziecie jeść przaśne chleby."
  tags: []
"Lb28,18":
  text: "Pierwszego dnia będzie święte zgromadzenie, nie będziecie wykonywać żadnej ciężkiej pracy."
  tags: []
"Lb28,19":
  text: "Lecz złożycie PANU ofiarę spalaną na całopalenie: dwa młode cielce, jednego barana i siedem rocznych baranków. Mają być bez skazy."
  tags: []
"Lb28,20":
  text: "A ich ofiara pokarmowa będzie z mąki pszennej zmieszanej z oliwą: będziecie składać trzy dziesiąte efy na każdego cielca, a dwie dziesiąte na każdego barana;"
  tags: []
"Lb28,21":
  text: "Po jednej dziesiątej efy złożysz na każdego baranka z tych siedmiu baranków;"
  tags: []
"Lb28,22":
  text: "I jednego kozła na ofiarę za grzech, na dokonanie przebłagania za was."
  tags: []
"Lb28,23":
  text: "Będziecie to wszystko składać oprócz porannego całopalenia, które jest nieustannym całopaleniem."
  tags: []
"Lb28,24":
  text: "Tak każdego dnia przez te siedem dni będziecie składać pokarm ofiary spalanej na miłą woń dla PANA. Będziecie to składać oprócz nieustannego całopalenia i jego ofiary z płynów."
  tags: []
"Lb28,25":
  text: "A siódmego dnia będziecie mieli święte zgromadzenie; nie będziecie wykonywać żadnej ciężkiej pracy."
  tags: []
"Lb28,26":
  text: "A w dniu pierwocin, gdy będziecie składać PANU nową ofiarę pokarmową, gdy się wypełnią wasze tygodnie, będziecie mieli święte zgromadzenie; nie będziecie wykonywać żadnej ciężkiej pracy."
  tags: []
"Lb28,27":
  text: "I złożycie PANU całopalenie na miłą woń: dwa młode cielce, jednego barana, siedem rocznych baranków."
  tags: []
"Lb28,28":
  text: "A na ich ofiarę pokarmową z mąki pszennej zmieszanej z oliwą: trzy dziesiąte efy na każdego cielca, dwie dziesiąte na każdego barana;"
  tags: []
"Lb28,29":
  text: "Po jednej dziesiątej na każdego baranka z tych siedmiu baranków;"
  tags: []
"Lb28,30":
  text: "I jednego kozła z kóz na dokonanie przebłagania za was."
  tags: []
"Lb28,31":
  text: "Będziecie to wszystko składać oprócz nieustannego całopalenia i jego ofiary pokarmowej, które mają być bez skazy, wraz z ich ofiarami z płynów."
  tags: []
