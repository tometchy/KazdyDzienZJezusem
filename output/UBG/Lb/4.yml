"Lb4,1":
  text: "I PAN przemówił do Mojżesza i Aarona tymi słowy:"
  tags: []
"Lb4,2":
  text: "Policz synów Kehata spośród synów Lewiego według ich rodzin i według domów ich ojców;"
  tags: []
"Lb4,3":
  text: "Od trzydziestego roku życia wzwyż aż do pięćdziesiątego roku życia; wszystkich, którzy są zdolni do służby, aby wykonywali pracę w Namiocie Zgromadzenia."
  tags: []
"Lb4,4":
  text: "Służbą synów Kehata w Namiocie Zgromadzenia będzie troska o rzeczy najświętsze."
  tags: []
"Lb4,5":
  text: "Gdy obóz będzie ruszał, przyjdzie Aaron ze swymi synami i zdejmą zasłonę okrywającą, którą okryją arkę świadectwa."
  tags: []
"Lb4,6":
  text: "A położą na niej przykrycie ze skór borsuczych i na tym rozciągną nakrycie z błękitnej tkaniny, i założą jej drążki."
  tags: []
"Lb4,7":
  text: "Stół chlebów pokładnych również przykryją tkaniną z błękitu i położą na nim misy, czasze, przystawki i kubki do nalewania; a będzie na nim nieustanny chleb."
  tags: []
"Lb4,8":
  text: "I rozciągną na tym tkaninę karmazynową i przykryją to przykryciem ze skór borsuczych, i założą jego drążki."
  tags: []
"Lb4,9":
  text: "Wezmą też tkaninę z błękitu, którą okryją świecznik do świecenia i jego lampy, szczypce, naczynia na popiół oraz wszystkie jego naczynia na oliwę, których się przy nim używa;"
  tags: []
"Lb4,10":
  text: "I owiną go wraz ze wszystkimi jego naczyniami przykryciem ze skór borsuczych i umieszczą na drążkach."
  tags: []
"Lb4,11":
  text: "Rozciągną nad złotym ołtarzem tkaninę z błękitu i przykryją go przykryciem ze skór borsuczych, i założą jego drążki."
  tags: []
"Lb4,12":
  text: "Wezmą też wszystkie sprzęty do służby, którymi służą w świątyni, owiną je tkaniną z błękitu, przykryją je okryciem ze skór borsuczych i umieszczą na drążkach."
  tags: []
"Lb4,13":
  text: "Następnie oczyszczą ołtarz z popiołu i rozciągną na nim purpurową tkaninę;"
  tags: []
"Lb4,14":
  text: "I położą na nim wszystkie jego sprzęty używane do służby przy nim: kadzielnice, widełki, łopatki i kropielnice, wszystkie naczynia ołtarza, i rozciągną na nim przykrycie ze skór borsuczych, i założą jego drążki."
  tags: []
"Lb4,15":
  text: "Kiedy Aaron i jego synowie skończą przykrywanie świątyni wraz ze wszystkimi jej naczyniami, gdy obóz będzie miał wyruszyć, wtedy przyjdą synowie Kehata, aby je nieść. Lecz nie będą dotykać świętych przedmiotów, aby nie umarli. To jest służba synów Kehata przy Namiocie Zgromadzenia."
  tags: []
"Lb4,16":
  text: "A Eleazar, syn kapłana Aarona, będzie troszczył się o oliwę do oświetlenia, wonne kadzidło, stałą ofiarę pokarmową i oliwę do namaszczania oraz będzie doglądał przybytku i wszystkiego, co w nim jest, i w miejscu świętym i przy jego naczyniach."
  tags: []
"Lb4,17":
  text: "Potem PAN powiedział do Mojżesza i Aarona:"
  tags: []
"Lb4,18":
  text: "Nie pozwólcie, by pokolenie rodzin Kehatytów zostało wycięte spośród Lewitów."
  tags: []
"Lb4,19":
  text: "Ale to im uczynicie, aby żyli i nie pomarli, gdy będą się zbliżać do rzeczy najświętszych: Aaron i jego synowie przyjdą i wyznaczą każdemu z nich, co ma czynić i co ma nieść."
  tags: []
"Lb4,20":
  text: "Lecz niech nie wchodzą się przyglądać, kiedy rzeczy święte będą przykrywane, by nie pomarli."
  tags: []
"Lb4,21":
  text: "PAN dalej mówił do Mojżesza:"
  tags: []
"Lb4,22":
  text: "Policz synów Gerszona według domów ich ojców i według ich rodzin;"
  tags: []
"Lb4,23":
  text: "Policz tych, którzy są w wieku od trzydziestu lat wzwyż aż do lat pięćdziesięciu; wszystkich, którzy są zdolni do tej pracy, aby mogli pełnić służbę przy Namiocie Zgromadzenia."
  tags: []
"Lb4,24":
  text: "A to będzie zadanie rodzin Gerszonitów, do służby i do noszenia."
  tags: []
"Lb4,25":
  text: "Będą nosić zasłony przybytku, Namiot Zgromadzenia, jego przykrycie i przykrycie borsucze, które jest na wierzchu, oraz zasłonę u wejścia do Namiotu Zgromadzenia;"
  tags: []
"Lb4,26":
  text: "Zasłony dziedzińca i zasłonę u bramy wejściowej na dziedziniec, który otacza przybytek i ołtarz wokoło, ich sznury i wszystkie przybory do pracy przy nich oraz wszystko, co jest do tego zrobione; tak będą służyć."
  tags: []
"Lb4,27":
  text: "Wszelka służba synów Gerszonitów związana ze wszystkimi ich ciężarami oraz z całą ich służbą ma odbywać się zgodnie z rozkazem Aarona i jego synów; i powierzycie im troskę o wszystkie ich ciężary."
  tags: []
"Lb4,28":
  text: "To będzie zadanie rodzin synów Gerszonitów w Namiocie Zgromadzenia, a nadzór nad nimi będzie miał Itamar, syn kapłana Aarona."
  tags: []
"Lb4,29":
  text: "A synów Merariego policzysz według ich rodzin i według domów ich ojców;"
  tags: []
"Lb4,30":
  text: "Policzysz tych, którzy są w wieku od trzydziestu lat wzwyż aż do lat pięćdziesięciu, wszystkich zdolnych do tej pracy, aby mogli pełnić służbę przy Namiocie Zgromadzenia."
  tags: []
"Lb4,31":
  text: "A to będzie ich zadanie przy służbie w Namiocie Zgromadzenia: będą nosić deski przybytku, jego drążki, słupy i podstawki;"
  tags: []
"Lb4,32":
  text: "Słupy otaczające dziedziniec, ich podstawki, kołki i sznury wraz ze wszystkimi ich przyborami oraz wszystko, co należy do ich służby. A z przedmiotów, które są im powierzone do noszenia, zrobicie wykaz według nazw."
  tags: []
"Lb4,33":
  text: "To będzie zadanie rodzin synów Merariego według całej ich służby przy Namiocie Zgromadzenia pod nadzorem Itamara, syna kapłana Aarona."
  tags: []
"Lb4,34":
  text: "Mojżesz, Aaron i naczelnicy zgromadzenia policzyli synów Kehata według ich rodzin i według domów ich ojców;"
  tags: []
"Lb4,35":
  text: "Tych będących w wieku od trzydziestu lat wzwyż aż do lat pięćdziesięciu, którzy byli zdolni do tej pracy, aby mogli pełnić służbę przy Namiocie Zgromadzenia."
  tags: []
"Lb4,36":
  text: "A policzonych według ich rodzin było dwa tysiące siedmiuset pięćdziesięciu."
  tags: []
"Lb4,37":
  text: "Byli to ci policzeni z rodzin Kehatytów, wszyscy, którzy mieli pełnić służbę przy Namiocie Zgromadzenia, których policzyli Mojżesz i Aaron zgodnie z rozkazem PANA przekazanym przez Mojżesza."
  tags: []
"Lb4,38":
  text: "A policzonych synów Gerszona według ich rodzin i według domów ich ojców;"
  tags: []
"Lb4,39":
  text: "Tych, którzy byli w wieku od trzydziestu lat wzwyż aż do lat pięćdziesięciu, zdolnych do pracy, aby mogli pełnić służbę przy Namiocie Zgromadzenia;"
  tags: []
"Lb4,40":
  text: "Policzonych według ich rodzin i domów ich ojców było dwa tysiące sześciuset trzydziestu."
  tags: []
"Lb4,41":
  text: "Byli to ci policzeni z rodzin synów Gerszona, wszyscy, którzy mieli pełnić służbę w Namiocie Zgromadzenia, których policzyli Mojżesz i Aaron zgodnie z rozkazem PANA."
  tags: []
"Lb4,42":
  text: "A policzonych z rodzin synów Merariego według ich rodzin i domów ich ojców;"
  tags: []
"Lb4,43":
  text: "Tych, którzy byli w wieku trzydziestu lat wzwyż aż do lat pięćdziesięciu, zdolnych do pracy, aby mogli pełnić służbę przy Namiocie Zgromadzenia;"
  tags: []
"Lb4,44":
  text: "A policzonych według ich rodzin było trzy tysiące dwustu."
  tags: []
"Lb4,45":
  text: "A to są policzeni z rodzin synów Merariego, których policzyli Mojżesz i Aaron zgodnie z rozkazem PANA przekazanym przez Mojżesza."
  tags: []
"Lb4,46":
  text: "Wszystkich Lewitów policzonych, których policzyli Mojżesz, Aaron i naczelnicy Izraela według ich rodzin i domów ich ojców;"
  tags: []
"Lb4,47":
  text: "W wieku trzydziestu lat wzwyż aż do lat pięćdziesięciu; wszystkich policzonych, którzy przychodzili pełnić zadanie służby i noszenia ciężarów w Namiocie Zgromadzenia;"
  tags: []
"Lb4,48":
  text: "Było osiem tysięcy pięciuset osiemdziesięciu."
  tags: []
"Lb4,49":
  text: "Zgodnie z rozkazem PANA zostali policzeni przez Mojżesza, każdy z osobna według jego służby i według jego ciężaru. Policzono tych, których PAN rozkazał liczyć Mojżeszowi."
  tags: []
