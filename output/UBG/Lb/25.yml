"Lb25,1": "Potem Izrael zamieszkał w Szittim i lud zaczął uprawiać nierząd z córkami Moabu."
"Lb25,2": "One zapraszały lud do ofiar swoich bogów. A lud jadł i oddawał pokłon ich bogom."
"Lb25,3": "I Izrael przyłączył się do Baal-Peora, i PAN bardzo rozgniewał się na Izraela."
"Lb25,4": "Wtedy PAN powiedział do Mojżesza: Zbierz wszystkich naczelników ludu i powieś ich przed PANEM na słońcu, aby zapalczywość gniewu PANA odwróciła się od Izraela."
"Lb25,5": "Mojżesz powiedział więc do sędziów Izraela: Niech każdy z was zabije swoich ludzi, którzy przyłączyli się do Baal-Peora."
"Lb25,6": "A oto jeden z synów Izraela przyszedł i przyprowadził do swoich braci Midianitkę na oczach Mojżesza i na oczach całego zgromadzenia synów Izraela, którzy płakali przed wejściem do Namiotu Zgromadzenia."
"Lb25,7": "Gdy zobaczył to Pinchas, syn Eleazara, syna Aarona, kapłana, wstał spośród zgromadzenia i wziął do ręki oszczep."
"Lb25,8": "I poszedł za tym Izraelitą do namiotu, przebił oboje, tego Izraelitę oraz kobietę przez jej podbrzusze. I plaga wśród synów Izraela została powstrzymana."
"Lb25,9": "A tych, którzy umarli od tej plagi, było dwadzieścia cztery tysiące."
"Lb25,10": "Potem PAN powiedział do Mojżesza:"
"Lb25,11": "Pinchas, syn Eleazara, syna Aarona, kapłana, odwrócił mój gniew od synów Izraela, gdyż okazał wśród nich gorliwość ze względu na mnie, tak że nie wytraciłem synów Izraela w mojej zazdrości."
"Lb25,12": "Dlatego powiedz mu: Oto zawieram z nim moje przymierze pokoju;"
"Lb25,13": "Będzie to dla niego i dla jego potomstwa po nim przymierze wiecznego kapłaństwa, ponieważ okazał gorliwość o swego Boga i dokonał przebłagania za synów Izraela."
"Lb25,14": "A imię tego Izraelity, który został zabity wraz z Midianitką, było Zimri; był to syn Salu, naczelnika domu swego ojca, z pokolenia Symeona."
"Lb25,15": "Imię zabitej Midianitki było Kozbi, była to córka Sura, naczelnika w swoim narodzie i w domu swego ojca w Midianie."
"Lb25,16": "I PAN powiedział do Mojżesza:"
"Lb25,17": "Odnoście się wrogo do Midianitów i pobijcie ich;"
"Lb25,18": "Ponieważ oni odnosili się wrogo do was przez swoje podstępy, a podeszli was przez Baal-Peora i przez ich siostrę Kozbi, córkę księcia Midianu, która została zabita w dniu plagi z powodu Peora."
