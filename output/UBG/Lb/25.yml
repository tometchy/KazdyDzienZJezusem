"Lb25,1":
  text: "Potem Izrael zamieszkał w Szittim i lud zaczął uprawiać nierząd z córkami Moabu."
  tags: []
"Lb25,2":
  text: "One zapraszały lud do ofiar swoich bogów. A lud jadł i oddawał pokłon ich bogom."
  tags: []
"Lb25,3":
  text: "I Izrael przyłączył się do Baal-Peora, i PAN bardzo rozgniewał się na Izraela."
  tags: []
"Lb25,4":
  text: "Wtedy PAN powiedział do Mojżesza: Zbierz wszystkich naczelników ludu i powieś ich przed PANEM na słońcu, aby zapalczywość gniewu PANA odwróciła się od Izraela."
  tags: []
"Lb25,5":
  text: "Mojżesz powiedział więc do sędziów Izraela: Niech każdy z was zabije swoich ludzi, którzy przyłączyli się do Baal-Peora."
  tags: []
"Lb25,6":
  text: "A oto jeden z synów Izraela przyszedł i przyprowadził do swoich braci Midianitkę na oczach Mojżesza i na oczach całego zgromadzenia synów Izraela, którzy płakali przed wejściem do Namiotu Zgromadzenia."
  tags: []
"Lb25,7":
  text: "Gdy zobaczył to Pinchas, syn Eleazara, syna Aarona, kapłana, wstał spośród zgromadzenia i wziął do ręki oszczep."
  tags: []
"Lb25,8":
  text: "I poszedł za tym Izraelitą do namiotu, przebił oboje, tego Izraelitę oraz kobietę przez jej podbrzusze. I plaga wśród synów Izraela została powstrzymana."
  tags: []
"Lb25,9":
  text: "A tych, którzy umarli od tej plagi, było dwadzieścia cztery tysiące."
  tags: []
"Lb25,10":
  text: "Potem PAN powiedział do Mojżesza:"
  tags: []
"Lb25,11":
  text: "Pinchas, syn Eleazara, syna Aarona, kapłana, odwrócił mój gniew od synów Izraela, gdyż okazał wśród nich gorliwość ze względu na mnie, tak że nie wytraciłem synów Izraela w mojej zazdrości."
  tags: []
"Lb25,12":
  text: "Dlatego powiedz mu: Oto zawieram z nim moje przymierze pokoju;"
  tags: []
"Lb25,13":
  text: "Będzie to dla niego i dla jego potomstwa po nim przymierze wiecznego kapłaństwa, ponieważ okazał gorliwość o swego Boga i dokonał przebłagania za synów Izraela."
  tags: []
"Lb25,14":
  text: "A imię tego Izraelity, który został zabity wraz z Midianitką, było Zimri; był to syn Salu, naczelnika domu swego ojca, z pokolenia Symeona."
  tags: []
"Lb25,15":
  text: "Imię zabitej Midianitki było Kozbi, była to córka Sura, naczelnika w swoim narodzie i w domu swego ojca w Midianie."
  tags: []
"Lb25,16":
  text: "I PAN powiedział do Mojżesza:"
  tags: []
"Lb25,17":
  text: "Odnoście się wrogo do Midianitów i pobijcie ich;"
  tags: []
"Lb25,18":
  text: "Ponieważ oni odnosili się wrogo do was przez swoje podstępy, a podeszli was przez Baal-Peora i przez ich siostrę Kozbi, córkę księcia Midianu, która została zabita w dniu plagi z powodu Peora."
  tags: []
