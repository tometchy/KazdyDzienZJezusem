"Lb30,1":
  text: "Potem Mojżesz powiedział do naczelników pokoleń pośród synów Izraela: Oto co PAN rozkazał."
  tags: []
"Lb30,2":
  text: "Jeśli mężczyzna złoży PANU ślub lub przysięgę i zwiąże swoją duszę zobowiązaniem, to nie złamie swego słowa; wypełni wszystko według tego, co wyszło z jego ust."
  tags: []
"Lb30,3":
  text: "Jeśli kobieta złoży PANU ślub i zwiąże się zobowiązaniem w domu swego ojca, w swojej młodości;"
  tags: []
"Lb30,4":
  text: "A jej ojciec usłyszy ślub i zobowiązanie, którym związała swoją duszę, a jej ojciec będzie milczał o tym, wtedy wszystkie jej śluby będą ważne i każde zobowiązanie, którym związała swą duszę, będzie ważne."
  tags: []
"Lb30,5":
  text: "Lecz jeśli jej ojciec sprzeciwi się jej w dniu, kiedy usłyszy o wszystkich jej ślubach i zobowiązaniach, którymi związała swoją duszę, wtedy nie będą ważne; PAN przebaczy jej, gdyż jej ojciec sprzeciwił się temu."
  tags: []
"Lb30,6":
  text: "Ale jeśli mając męża, złożyła ślub lub wypowiedziała swymi ustami coś, czym związała swoją duszę;"
  tags: []
"Lb30,7":
  text: "A jej mąż to usłyszał i milczał o tym w dniu, gdy to usłyszał, to jej śluby będą ważne i jej zobowiązania, którymi związała swoją duszę, będą ważne."
  tags: []
"Lb30,8":
  text: "Lecz jeśli w dniu, gdy jej mąż usłyszał o tym, sprzeciwił się temu, to unieważnia jej ślub, który złożyła, i to, co wypowiedziała swymi ustami, czym związała swoją duszę; a PAN jej przebaczy."
  tags: []
"Lb30,9":
  text: "Ale każdy ślub wdowy i rozwiedzionej, którym związały swoją duszę, będzie ważny."
  tags: []
"Lb30,10":
  text: "Lecz jeśli w domu swego męża złożyła ślub lub związała swoją duszę zobowiązaniem przysięgi;"
  tags: []
"Lb30,11":
  text: "A jej mąż usłyszał to i milczał o tym, i nie sprzeciwił się temu, wtedy wszystkie jej śluby będą ważne i każdy obowiązek, którym zobowiązała swoją duszę, będzie ważny."
  tags: []
"Lb30,12":
  text: "Ale jeśli jej mąż sprzeciwił się temu w dniu, kiedy to usłyszał, to wszelki ślub i zobowiązanie, jakie padły z jej ust, będą nieważne; jej mąż je unieważnił; a PAN jej przebaczy."
  tags: []
"Lb30,13":
  text: "Wszelki ślub i wszelką przysięgę zobowiązania na trapienie duszy może jej mąż potwierdzić lub może unieważnić."
  tags: []
"Lb30,14":
  text: "A jeśli jej mąż będzie milczał dzień po dniu, to potwierdza wszystkie jej śluby i wszystkie jej zobowiązania, które ją wiążą. Potwierdza je, ponieważ milczał o tym w dniu, kiedy je usłyszał;"
  tags: []
"Lb30,15":
  text: "Lecz jeśli je usłyszał i dopiero później unieważni, to poniesie jej nieprawość."
  tags: []
"Lb30,16":
  text: "To są ustawy, które PAN przykazał Mojżeszowi, między mężem a jego żoną, między ojcem a jego córką w jej młodości, póki jest w domu swego ojca."
  tags: []
