"Lb34,1": "Potem PAN powiedział do Mojżesza:"
"Lb34,2": "Rozkaż synom Izraela i powiedz im: Gdy wejdziecie do ziemi Kanaan, to jest ziemia, która wam przypadnie jako dziedzictwo, ziemia Kanaan w swoich granicach;"
"Lb34,3": "Wasza południowa granica będzie od pustyni Syn wzdłuż granic Edomu, a granica południowa pobiegnie od brzegu Morza Słonego, od wschodu."
"Lb34,4": "Granica ta skręci od południa ku Maale-Akrabbim i pobiegnie aż do Syn, i dojdzie od południa do Kadesz-Barnea. Stamtąd pobiegnie do Chasar-Addar i przejdzie aż do Asmon."
"Lb34,5": "A ta granica skręci od Asmon aż do rzeki Egiptu, a skończy się przy morzu."
"Lb34,6": "Jako zachodnią granicę będziecie mieli Morze Wielkie – ono będzie waszą zachodnią granicą."
"Lb34,7": "A to będzie wasza północna granica: od Morza Wielkiego wymierzycie sobie do góry Hor."
"Lb34,8": "Potem od góry Hor wymierzycie granicę aż do wejścia do Hemat; a krańce tej granicy sięgną do Sedada."
"Lb34,9": "Następnie granica ta pobiegnie aż do Zifronu, a skończy się w Chasar-Enan. To będzie wasza północna granica."
"Lb34,10": "A wschodnią granicę wymierzycie od Chasar-Enan do Szefam."
"Lb34,11": "Granica ta pobiegnie od Szefam aż do Ribla, od wschodu Ain; i ta granica zejdzie w dół, i dosięgnie brzegu morza Kinneret od wschodu."
"Lb34,12": "Następnie ta granica zejdzie ku Jordanowi, a zakończy się przy Morzu Słonym. To będzie wasza ziemia ze swymi granicami wokoło."
"Lb34,13": "Wtedy Mojżesz rozkazał synom Izraela: To jest ziemia, którą odziedziczycie przez losowanie, którą PAN rozkazał dać dziewięciu i pół pokoleniu."
"Lb34,14": "Bo pokolenie synów Rubena według domów swych ojców i pokolenie synów Gada według domów swych ojców już otrzymały swoje dziedzictwo i połowa pokolenia Manassesa już otrzymała swoje dziedzictwo."
"Lb34,15": "Te dwa i pół pokolenia otrzymały swoje dziedzictwo po tej stronie Jordanu, naprzeciw Jerycha, na wschodzie."
"Lb34,16": "I PAN powiedział do Mojżesza:"
"Lb34,17": "Oto imiona mężczyzn, którzy rozdzielą wam ziemię: kapłan Eleazar i Jozue, syn Nuna."
"Lb34,18": "Weźmiecie też po jednym naczelniku z każdego pokolenia do rozdzielenia ziemi w dziedzictwo."
"Lb34,19": "A oto imiona tych mężczyzn: z pokolenia Judy – Kaleb, syn Jefunnego."
"Lb34,20": "Z pokolenia synów Symeona – Samuel, syn Ammihuda."
"Lb34,21": "Z pokolenia Beniamina – Eliad, syn Kislona."
"Lb34,22": "Z pokolenia synów Dana – naczelnik Bukki, syn Jogliego."
"Lb34,23": "Z synów Józefa, z pokolenia synów Manassesa – naczelnik Channiel, syn Efoda;"
"Lb34,24": "A z pokolenia synów Efraima – naczelnik Kemuel, syn Sziftana."
"Lb34,25": "Z pokolenia Zebulona – naczelnik Elisafan, syn Parnacha."
"Lb34,26": "Z pokolenia synów Issachara – naczelnik Paltiel, syn Azzana."
"Lb34,27": "Z pokolenia synów Aszera – naczelnik Achihud, syn Szelomiego."
"Lb34,28": "A z pokolenia synów Neftalego – naczelnik Pedahel, syn Ammihuda."
"Lb34,29": "To są ci, którym PAN rozkazał rozdzielić dziedzictwo synom Izraela w ziemi Kanaan."
