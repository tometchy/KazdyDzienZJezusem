"Lb34,1":
  text: "Potem PAN powiedział do Mojżesza:"
  tags: []
"Lb34,2":
  text: "Rozkaż synom Izraela i powiedz im: Gdy wejdziecie do ziemi Kanaan, to jest ziemia, która wam przypadnie jako dziedzictwo, ziemia Kanaan w swoich granicach;"
  tags: []
"Lb34,3":
  text: "Wasza południowa granica będzie od pustyni Syn wzdłuż granic Edomu, a granica południowa pobiegnie od brzegu Morza Słonego, od wschodu."
  tags: []
"Lb34,4":
  text: "Granica ta skręci od południa ku Maale-Akrabbim i pobiegnie aż do Syn, i dojdzie od południa do Kadesz-Barnea. Stamtąd pobiegnie do Chasar-Addar i przejdzie aż do Asmon."
  tags: []
"Lb34,5":
  text: "A ta granica skręci od Asmon aż do rzeki Egiptu, a skończy się przy morzu."
  tags: []
"Lb34,6":
  text: "Jako zachodnią granicę będziecie mieli Morze Wielkie – ono będzie waszą zachodnią granicą."
  tags: []
"Lb34,7":
  text: "A to będzie wasza północna granica: od Morza Wielkiego wymierzycie sobie do góry Hor."
  tags: []
"Lb34,8":
  text: "Potem od góry Hor wymierzycie granicę aż do wejścia do Hemat; a krańce tej granicy sięgną do Sedada."
  tags: []
"Lb34,9":
  text: "Następnie granica ta pobiegnie aż do Zifronu, a skończy się w Chasar-Enan. To będzie wasza północna granica."
  tags: []
"Lb34,10":
  text: "A wschodnią granicę wymierzycie od Chasar-Enan do Szefam."
  tags: []
"Lb34,11":
  text: "Granica ta pobiegnie od Szefam aż do Ribla, od wschodu Ain; i ta granica zejdzie w dół, i dosięgnie brzegu morza Kinneret od wschodu."
  tags: []
"Lb34,12":
  text: "Następnie ta granica zejdzie ku Jordanowi, a zakończy się przy Morzu Słonym. To będzie wasza ziemia ze swymi granicami wokoło."
  tags: []
"Lb34,13":
  text: "Wtedy Mojżesz rozkazał synom Izraela: To jest ziemia, którą odziedziczycie przez losowanie, którą PAN rozkazał dać dziewięciu i pół pokoleniu."
  tags: []
"Lb34,14":
  text: "Bo pokolenie synów Rubena według domów swych ojców i pokolenie synów Gada według domów swych ojców już otrzymały swoje dziedzictwo i połowa pokolenia Manassesa już otrzymała swoje dziedzictwo."
  tags: []
"Lb34,15":
  text: "Te dwa i pół pokolenia otrzymały swoje dziedzictwo po tej stronie Jordanu, naprzeciw Jerycha, na wschodzie."
  tags: []
"Lb34,16":
  text: "I PAN powiedział do Mojżesza:"
  tags: []
"Lb34,17":
  text: "Oto imiona mężczyzn, którzy rozdzielą wam ziemię: kapłan Eleazar i Jozue, syn Nuna."
  tags: []
"Lb34,18":
  text: "Weźmiecie też po jednym naczelniku z każdego pokolenia do rozdzielenia ziemi w dziedzictwo."
  tags: []
"Lb34,19":
  text: "A oto imiona tych mężczyzn: z pokolenia Judy – Kaleb, syn Jefunnego."
  tags: []
"Lb34,20":
  text: "Z pokolenia synów Symeona – Samuel, syn Ammihuda."
  tags: []
"Lb34,21":
  text: "Z pokolenia Beniamina – Eliad, syn Kislona."
  tags: []
"Lb34,22":
  text: "Z pokolenia synów Dana – naczelnik Bukki, syn Jogliego."
  tags: []
"Lb34,23":
  text: "Z synów Józefa, z pokolenia synów Manassesa – naczelnik Channiel, syn Efoda;"
  tags: []
"Lb34,24":
  text: "A z pokolenia synów Efraima – naczelnik Kemuel, syn Sziftana."
  tags: []
"Lb34,25":
  text: "Z pokolenia Zebulona – naczelnik Elisafan, syn Parnacha."
  tags: []
"Lb34,26":
  text: "Z pokolenia synów Issachara – naczelnik Paltiel, syn Azzana."
  tags: []
"Lb34,27":
  text: "Z pokolenia synów Aszera – naczelnik Achihud, syn Szelomiego."
  tags: []
"Lb34,28":
  text: "A z pokolenia synów Neftalego – naczelnik Pedahel, syn Ammihuda."
  tags: []
"Lb34,29":
  text: "To są ci, którym PAN rozkazał rozdzielić dziedzictwo synom Izraela w ziemi Kanaan."
  tags: []
