"Lb1,1":
  text: "PAN przemówił do Mojżesza na pustyni Synaj, w Namiocie Zgromadzenia, pierwszego dnia drugiego miesiąca, w drugim roku po ich wyjściu z ziemi Egiptu, tymi słowy:"
  tags: []
"Lb1,2":
  text: "Policzcie całe zgromadzenie synów Izraela według ich rodzin i według domów ich ojców, licząc imiona wszystkich mężczyzn, głowa po głowie;"
  tags: []
"Lb1,3":
  text: "Od dwudziestu lat wzwyż, wszystkich w Izraelu zdolnych do walki. Ty i Aaron policzycie ich według ich oddziałów."
  tags: []
"Lb1,4":
  text: "I będzie z wami jeden mężczyzna z każdego pokolenia, głowa domu swoich ojców."
  tags: []
"Lb1,5":
  text: "A oto imiona mężczyzn, którzy będą z wami: z pokolenia Rubena – Elizur, syn Szedeura;"
  tags: []
"Lb1,6":
  text: "Z Symeona – Szelumiel, syn Suriszaddaja;"
  tags: []
"Lb1,7":
  text: "Z Judy – Nachszon, syn Amminadaba;"
  tags: []
"Lb1,8":
  text: "Z Issachara – Netaneel, syn Suara;"
  tags: []
"Lb1,9":
  text: "Z Zebulona – Eliab, syn Chelona;"
  tags: []
"Lb1,10":
  text: "Z synów Józefa: z Efraima – Eliszama, syn Ammihuda, z Manassesa – Gamliel, syn Pedahsura;"
  tags: []
"Lb1,11":
  text: "Z Beniamina – Abidan, syn Gideoniego;"
  tags: []
"Lb1,12":
  text: "Z Dana – Achiezer, syn Ammiszaddaja;"
  tags: []
"Lb1,13":
  text: "Z Aszera – Pagiel, syn Okrana;"
  tags: []
"Lb1,14":
  text: "Z Gada – Eliasaf, syn Deuela;"
  tags: []
"Lb1,15":
  text: "Z Neftalego – Achira, syn Enana."
  tags: []
"Lb1,16":
  text: "Ci powołani, sławni spośród zgromadzenia, byli naczelnikami pokoleń swych ojców, wodzami tysięcy w Izraelu."
  tags: []
"Lb1,17":
  text: "Mojżesz i Aaron przyjęli więc tych mężczyzn, którzy zostali imiennie wyznaczeni."
  tags: []
"Lb1,18":
  text: "I zebrali całe zgromadzenie w pierwszym dniu drugiego miesiąca, a każdy podawał swoje pochodzenie według swych rodzin, według domów swych ojców i według liczby imion, od dwudziestu lat wzwyż, głowa po głowie."
  tags: []
"Lb1,19":
  text: "Jak PAN rozkazał Mojżeszowi, tak policzył ich na pustyni Synaj."
  tags: []
"Lb1,20":
  text: "Synów Rubena, pierworodnego Izraela, ich potomków według ich rodzin, według domów ich ojców, według liczby imion, głowa po głowie, wszystkich mężczyzn od dwudziestu lat wzwyż, wszystkich zdolnych do walki;"
  tags: []
"Lb1,21":
  text: "Naliczono z pokolenia Rubena czterdzieści sześć tysięcy pięciuset."
  tags: []
"Lb1,22":
  text: "Synów Symeona, ich potomków według ich rodzin, według domów ich ojców, naliczonych według liczby imion, głowa po głowie, wszystkich mężczyzn od dwudziestu lat wzwyż, wszystkich zdolnych do walki;"
  tags: []
"Lb1,23":
  text: "Naliczono z pokolenia Symeona pięćdziesiąt dziewięć tysięcy trzystu."
  tags: []
"Lb1,24":
  text: "Synów Gada, ich potomków według ich rodzin, według domów ich ojców, według liczby imion, od dwudziestu lat wzwyż, wszystkich zdolnych do walki;"
  tags: []
"Lb1,25":
  text: "Naliczono z pokolenia Gada czterdzieści pięć tysięcy sześciuset pięćdziesięciu."
  tags: []
"Lb1,26":
  text: "Synów Judy, ich potomków według ich rodzin, według domów ich ojców, według liczby imion, od dwudziestu lat wzwyż, wszystkich zdolnych do walki;"
  tags: []
"Lb1,27":
  text: "Naliczono z pokolenia Judy siedemdziesiąt cztery tysiące sześciuset."
  tags: []
"Lb1,28":
  text: "Synów Issachara, ich potomków według ich rodzin, według domów ich ojców, według liczby imion, od dwudziestu lat wzwyż, wszystkich zdolnych do walki;"
  tags: []
"Lb1,29":
  text: "Naliczono z pokolenia Issachara pięćdziesiąt cztery tysiące czterystu."
  tags: []
"Lb1,30":
  text: "Synów Zebulona, ich potomków według ich rodzin, według domów ich ojców, według liczby imion, od dwudziestu lat wzwyż, wszystkich zdolnych do walki;"
  tags: []
"Lb1,31":
  text: "Naliczono z pokolenia Zebulona pięćdziesiąt siedem tysięcy czterystu."
  tags: []
"Lb1,32":
  text: "Synów Józefa, z synów Efraima, ich potomków według ich rodzin, według domów ich ojców, według liczby imion, od dwudziestu lat wzwyż, wszystkich zdolnych do walki;"
  tags: []
"Lb1,33":
  text: "Naliczono z pokolenia Efraima czterdzieści tysięcy pięciuset."
  tags: []
"Lb1,34":
  text: "Synów Manassesa, ich potomków według ich rodzin, według domów ich ojców, według liczby imion, od dwudziestu lat wzwyż, wszystkich zdolnych do walki;"
  tags: []
"Lb1,35":
  text: "Naliczono z pokolenia Manassesa trzydzieści dwa tysiące dwustu."
  tags: []
"Lb1,36":
  text: "Synów Beniamina, ich potomków według ich rodzin, według domów ich ojców, według liczby imion, od dwudziestu lat wzwyż, wszystkich zdolnych do walki;"
  tags: []
"Lb1,37":
  text: "Naliczono z pokolenia Beniamina trzydzieści pięć tysięcy czterystu."
  tags: []
"Lb1,38":
  text: "Synów Dana, ich potomków według ich rodzin, według domów ich ojców, według liczby imion, od dwudziestu lat wzwyż, wszystkich zdolnych do walki;"
  tags: []
"Lb1,39":
  text: "Naliczono z pokolenia Dana sześćdziesiąt dwa tysiące siedmiuset."
  tags: []
"Lb1,40":
  text: "Synów Aszera, ich potomków według ich rodzin, według domów ich ojców, według liczby imion, od dwudziestu lat wzwyż, wszystkich zdolnych do walki;"
  tags: []
"Lb1,41":
  text: "Naliczono z pokolenia Aszera czterdzieści jeden tysięcy pięciuset."
  tags: []
"Lb1,42":
  text: "Synów Neftalego, ich potomków według ich rodzin, według domów ich ojców, według liczby imion, od dwudziestu lat wzwyż, wszystkich zdolnych do walki;"
  tags: []
"Lb1,43":
  text: "Naliczono z pokolenia Neftalego pięćdziesiąt trzy tysiące czterystu."
  tags: []
"Lb1,44":
  text: "To są ci, których policzyli Mojżesz, Aaron i książęta Izraela, dwunastu mężczyzn, po jednym z każdego domu swych ojców."
  tags: []
"Lb1,45":
  text: "I było wszystkich policzonych synów Izraela, według domów ich ojców, od dwudziestu lat wzwyż, wszystkich zdolnych do walki w Izraelu;"
  tags: []
"Lb1,46":
  text: "Wszystkich policzonych było sześćset trzy tysiące pięciuset pięćdziesięciu."
  tags: []
"Lb1,47":
  text: "Lecz Lewici nie zostali policzeni z nimi według pokolenia swych ojców."
  tags: []
"Lb1,48":
  text: "PAN rozkazał bowiem Mojżeszowi:"
  tags: []
"Lb1,49":
  text: "Tylko pokolenia Lewiego nie spisuj i nie licz go razem z synami Izraela;"
  tags: []
"Lb1,50":
  text: "Lecz ustanowisz Lewitów nad Przybytkiem Świadectwa i nad wszystkimi jego naczyniami, i nad wszystkim, co do niego należy. Oni będą nosić przybytek i wszystkie jego sprzęty; oni też będą go obsługiwać i rozbijać obóz dokoła przybytku."
  tags: []
"Lb1,51":
  text: "A gdy przybytek będzie miał wyruszyć, Lewici go rozbiorą; także gdy przybytek ma być wznoszony, Lewici ustawią go; a obcy, który się do niego zbliży, poniesie śmierć."
  tags: []
"Lb1,52":
  text: "I synowie Izraela będą rozbijać namioty, każdy w swoim obozie i każdy pod swoim sztandarem, według swych zastępów."
  tags: []
"Lb1,53":
  text: "Lecz Lewici rozbiją obóz wokół Przybytku Świadectwa, aby gniew nie spadł na zgromadzenie synów Izraela. Lewici będą pełnić straż przy Przybytku Świadectwa."
  tags: []
"Lb1,54":
  text: "I synowie Izraela uczynili zgodnie ze wszystkim, co PAN rozkazał Mojżeszowi, tak właśnie uczynili."
  tags: []
