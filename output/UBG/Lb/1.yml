"Lb1,1": "PAN przemówił do Mojżesza na pustyni Synaj, w Namiocie Zgromadzenia, pierwszego dnia drugiego miesiąca, w drugim roku po ich wyjściu z ziemi Egiptu, tymi słowy:"
"Lb1,2": "Policzcie całe zgromadzenie synów Izraela według ich rodzin i według domów ich ojców, licząc imiona wszystkich mężczyzn, głowa po głowie;"
"Lb1,3": "Od dwudziestu lat wzwyż, wszystkich w Izraelu zdolnych do walki. Ty i Aaron policzycie ich według ich oddziałów."
"Lb1,4": "I będzie z wami jeden mężczyzna z każdego pokolenia, głowa domu swoich ojców."
"Lb1,5": "A oto imiona mężczyzn, którzy będą z wami: z pokolenia Rubena – Elizur, syn Szedeura;"
"Lb1,6": "Z Symeona – Szelumiel, syn Suriszaddaja;"
"Lb1,7": "Z Judy – Nachszon, syn Amminadaba;"
"Lb1,8": "Z Issachara – Netaneel, syn Suara;"
"Lb1,9": "Z Zebulona – Eliab, syn Chelona;"
"Lb1,10": "Z synów Józefa: z Efraima – Eliszama, syn Ammihuda, z Manassesa – Gamliel, syn Pedahsura;"
"Lb1,11": "Z Beniamina – Abidan, syn Gideoniego;"
"Lb1,12": "Z Dana – Achiezer, syn Ammiszaddaja;"
"Lb1,13": "Z Aszera – Pagiel, syn Okrana;"
"Lb1,14": "Z Gada – Eliasaf, syn Deuela;"
"Lb1,15": "Z Neftalego – Achira, syn Enana."
"Lb1,16": "Ci powołani, sławni spośród zgromadzenia, byli naczelnikami pokoleń swych ojców, wodzami tysięcy w Izraelu."
"Lb1,17": "Mojżesz i Aaron przyjęli więc tych mężczyzn, którzy zostali imiennie wyznaczeni."
"Lb1,18": "I zebrali całe zgromadzenie w pierwszym dniu drugiego miesiąca, a każdy podawał swoje pochodzenie według swych rodzin, według domów swych ojców i według liczby imion, od dwudziestu lat wzwyż, głowa po głowie."
"Lb1,19": "Jak PAN rozkazał Mojżeszowi, tak policzył ich na pustyni Synaj."
"Lb1,20": "Synów Rubena, pierworodnego Izraela, ich potomków według ich rodzin, według domów ich ojców, według liczby imion, głowa po głowie, wszystkich mężczyzn od dwudziestu lat wzwyż, wszystkich zdolnych do walki;"
"Lb1,21": "Naliczono z pokolenia Rubena czterdzieści sześć tysięcy pięciuset."
"Lb1,22": "Synów Symeona, ich potomków według ich rodzin, według domów ich ojców, naliczonych według liczby imion, głowa po głowie, wszystkich mężczyzn od dwudziestu lat wzwyż, wszystkich zdolnych do walki;"
"Lb1,23": "Naliczono z pokolenia Symeona pięćdziesiąt dziewięć tysięcy trzystu."
"Lb1,24": "Synów Gada, ich potomków według ich rodzin, według domów ich ojców, według liczby imion, od dwudziestu lat wzwyż, wszystkich zdolnych do walki;"
"Lb1,25": "Naliczono z pokolenia Gada czterdzieści pięć tysięcy sześciuset pięćdziesięciu."
"Lb1,26": "Synów Judy, ich potomków według ich rodzin, według domów ich ojców, według liczby imion, od dwudziestu lat wzwyż, wszystkich zdolnych do walki;"
"Lb1,27": "Naliczono z pokolenia Judy siedemdziesiąt cztery tysiące sześciuset."
"Lb1,28": "Synów Issachara, ich potomków według ich rodzin, według domów ich ojców, według liczby imion, od dwudziestu lat wzwyż, wszystkich zdolnych do walki;"
"Lb1,29": "Naliczono z pokolenia Issachara pięćdziesiąt cztery tysiące czterystu."
"Lb1,30": "Synów Zebulona, ich potomków według ich rodzin, według domów ich ojców, według liczby imion, od dwudziestu lat wzwyż, wszystkich zdolnych do walki;"
"Lb1,31": "Naliczono z pokolenia Zebulona pięćdziesiąt siedem tysięcy czterystu."
"Lb1,32": "Synów Józefa, z synów Efraima, ich potomków według ich rodzin, według domów ich ojców, według liczby imion, od dwudziestu lat wzwyż, wszystkich zdolnych do walki;"
"Lb1,33": "Naliczono z pokolenia Efraima czterdzieści tysięcy pięciuset."
"Lb1,34": "Synów Manassesa, ich potomków według ich rodzin, według domów ich ojców, według liczby imion, od dwudziestu lat wzwyż, wszystkich zdolnych do walki;"
"Lb1,35": "Naliczono z pokolenia Manassesa trzydzieści dwa tysiące dwustu."
"Lb1,36": "Synów Beniamina, ich potomków według ich rodzin, według domów ich ojców, według liczby imion, od dwudziestu lat wzwyż, wszystkich zdolnych do walki;"
"Lb1,37": "Naliczono z pokolenia Beniamina trzydzieści pięć tysięcy czterystu."
"Lb1,38": "Synów Dana, ich potomków według ich rodzin, według domów ich ojców, według liczby imion, od dwudziestu lat wzwyż, wszystkich zdolnych do walki;"
"Lb1,39": "Naliczono z pokolenia Dana sześćdziesiąt dwa tysiące siedmiuset."
"Lb1,40": "Synów Aszera, ich potomków według ich rodzin, według domów ich ojców, według liczby imion, od dwudziestu lat wzwyż, wszystkich zdolnych do walki;"
"Lb1,41": "Naliczono z pokolenia Aszera czterdzieści jeden tysięcy pięciuset."
"Lb1,42": "Synów Neftalego, ich potomków według ich rodzin, według domów ich ojców, według liczby imion, od dwudziestu lat wzwyż, wszystkich zdolnych do walki;"
"Lb1,43": "Naliczono z pokolenia Neftalego pięćdziesiąt trzy tysiące czterystu."
"Lb1,44": "To są ci, których policzyli Mojżesz, Aaron i książęta Izraela, dwunastu mężczyzn, po jednym z każdego domu swych ojców."
"Lb1,45": "I było wszystkich policzonych synów Izraela, według domów ich ojców, od dwudziestu lat wzwyż, wszystkich zdolnych do walki w Izraelu;"
"Lb1,46": "Wszystkich policzonych było sześćset trzy tysiące pięciuset pięćdziesięciu."
"Lb1,47": "Lecz Lewici nie zostali policzeni z nimi według pokolenia swych ojców."
"Lb1,48": "PAN rozkazał bowiem Mojżeszowi:"
"Lb1,49": "Tylko pokolenia Lewiego nie spisuj i nie licz go razem z synami Izraela;"
"Lb1,50": "Lecz ustanowisz Lewitów nad Przybytkiem Świadectwa i nad wszystkimi jego naczyniami, i nad wszystkim, co do niego należy. Oni będą nosić przybytek i wszystkie jego sprzęty; oni też będą go obsługiwać i rozbijać obóz dokoła przybytku."
"Lb1,51": "A gdy przybytek będzie miał wyruszyć, Lewici go rozbiorą; także gdy przybytek ma być wznoszony, Lewici ustawią go; a obcy, który się do niego zbliży, poniesie śmierć."
"Lb1,52": "I synowie Izraela będą rozbijać namioty, każdy w swoim obozie i każdy pod swoim sztandarem, według swych zastępów."
"Lb1,53": "Lecz Lewici rozbiją obóz wokół Przybytku Świadectwa, aby gniew nie spadł na zgromadzenie synów Izraela. Lewici będą pełnić straż przy Przybytku Świadectwa."
"Lb1,54": "I synowie Izraela uczynili zgodnie ze wszystkim, co PAN rozkazał Mojżeszowi, tak właśnie uczynili."
