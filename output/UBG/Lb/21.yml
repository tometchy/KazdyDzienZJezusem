"Lb21,1": "A gdy król Aradu, Kananejczyk, który mieszkał na południu, usłyszał, że Izrael nadciąga drogą, którą przeszli szpiedzy, stoczył walkę z Izraelem i wziął jeńców."
"Lb21,2": "Wtedy Izrael złożył PANU ślub, mówiąc: Jeśli wydasz ten lud w moje ręce, całkowicie zniszczę ich miasta."
"Lb21,3": "I PAN wysłuchał głosu Izraela, i wydał mu Kananejczyków. Całkowicie zniszczyli ich oraz ich miasta, a nadano temu miejscu nazwę Chorma."
"Lb21,4": "Potem wyruszyli od góry Hor w kierunku Morza Czerwonego, aby obejść ziemię Edom. I lud bardzo się zniechęcił w drodze."
"Lb21,5": "Lud zaczął więc mówić przeciw Bogu i Mojżeszowi: Dlaczego wyprowadziliście nas z Egiptu, abyśmy pomarli na tej pustyni? Bo nie ma chleba ani wody, a nasza dusza obrzydziła sobie ten cienki chleb."
"Lb21,6": "Zesłał więc PAN na lud węże jadowite, które go kąsały; i pomarło wiele osób z Izraela."
"Lb21,7": "I lud przyszedł do Mojżesza, i powiedział: Zgrzeszyliśmy przez to, że mówiliśmy przeciw PANU i przeciw tobie. Módl się do PANA, aby oddalił od nas te węże. I Mojżesz modlił się za lud."
"Lb21,8": "Wtedy PAN powiedział do Mojżesza: Wykonaj jadowitego węża i umieść go na drzewcu. I stanie się tak, że każdy ukąszony, kiedy spojrzy na niego, będzie żył."
"Lb21,9": "Mojżesz wykonał więc węża miedzianego i umieścił go na drzewcu; gdy wąż kogoś ukąsił, a ten spojrzał na węża miedzianego, pozostawał przy życiu."
"Lb21,10": "I wyruszyli synowie Izraela, i rozbili obóz w Obot."
"Lb21,11": "A z Obot wyruszyli i rozbili obóz w Ijje-Haabarim na pustyni, która leży naprzeciw Moabu ku wschodowi słońca."
"Lb21,12": "Stamtąd wyruszyli i rozbili obóz nad potokiem Zered."
"Lb21,13": "Stamtąd wyruszyli i rozbili obóz po drugiej stronie rzeki Arnon, która wypływa na pustyni od granicy Amorytów; Arnon stanowi bowiem granicę Moabu między Moabitami a Amorytami."
"Lb21,14": "Dlatego jest powiedziane w księdze wojen PANA: Jak uczynił w Morzu Czerwonym i w potokach Arnonu;"
"Lb21,15": "U ujścia tych potoków, które ciągnie się ku osadzie Ar i przylega do granicy Moabu."
"Lb21,16": "Stamtąd udali się do Beer; to jest ta studnia, o której PAN powiedział do Mojżesza: Zgromadź lud, a dam mu wody."
"Lb21,17": "Wtedy Izrael śpiewał tę pieśń: Wzbierz studnio! Śpiewajcie o niej."
"Lb21,18": "To studnia, którą wykopali naczelnicy; wykopali ją dostojnicy ludu wraz z prawodawcą swoimi laskami. A z tej pustyni poszli do Mattany;"
"Lb21,19": "A z Mattany do Nahalielu, a z Nahalielu do Bamot;"
"Lb21,20": "A z Bamot do kotliny, która jest w ziemi Moabu, i do szczytu Pizga wznoszącego się nad Jeszimonem."
"Lb21,21": "I Izrael wysłał posłańców do Sichona, króla Amorytów, mówiąc:"
"Lb21,22": "Pozwól nam przejść przez twoją ziemię; nie pójdziemy ani przez pola, ani przez winnice; nie będziemy pić wód ze studni. Pójdziemy drogą królewską, dopóki nie przejdziemy twoich granic."
"Lb21,23": "Sichon jednak nie pozwolił Izraelowi przejść przez swoją granicę; Sichon zebrał cały swój lud i wyszedł przeciw Izraelowi na pustynię, a gdy przyszedł do Jahazy, stoczył bitwę z Izraelem."
"Lb21,24": "I Izrael pobił go ostrzem miecza, i wziął w posiadanie jego ziemię od Arnonu do Jabboku, aż do ziemi synów Ammona, gdyż granica Ammonitów była silna."
"Lb21,25": "Wtedy Izrael zdobył wszystkie te miasta i zamieszkał we wszystkich miastach Amorytów, w Cheszbonie i we wszystkich przylegających do niego wsiach."
"Lb21,26": "Cheszbon był miastem Sichona, króla Amorytów, który walczył z królem Moabu i zabrał mu z rąk całą jego ziemię aż po Arnon."
"Lb21,27": "Dlatego mówią w przypowieści: Wejdźcie do Cheszbonu i niech się odbuduje, i umocni miasto Sichona."
"Lb21,28": "Ponieważ ogień wyszedł z Cheszbonu, płomień z miasta Sichona; i pochłonął Ar moabskie oraz wzgórza Arnonu."
"Lb21,29": "Biada tobie, Moabie! Zginąłeś, ludu Kemosza! Wydał swoich synów na tułaczkę i swoje córki w niewolę Sichonowi, królowi Amorytów."
"Lb21,30": "Strzelaliśmy do nich, zginął Cheszbon aż po Dibon; a zburzyliśmy je aż do Nofach, które idzie aż do Medeby."
"Lb21,31": "Tak to Izrael zamieszkał w ziemi Amorytów."
"Lb21,32": "Wtedy Mojżesz wysłał wywiadowców do Jazer na wyszpiegowanie, a oni zdobyli jego wsie i wypędzili Amorytów, którzy tam byli."
"Lb21,33": "Potem zawrócili i poszli w kierunku Baszanu; tam Og, król Baszanu, wyszedł przeciwko nim, on i cały jego lud, do walki w Edre."
"Lb21,34": "Wtedy PAN powiedział do Mojżesza: Nie bój się go, gdyż wydałem go w twoje ręce wraz z całym jego ludem i ziemią i uczynisz z nim tak, jak uczyniłeś z Sichonem, królem Amorytów, który mieszkał w Cheszbonie."
"Lb21,35": "I pobili go i jego synów oraz cały jego lud, tak że nikogo z niego nie pozostawili przy życiu, i wzięli w posiadanie jego ziemię."
