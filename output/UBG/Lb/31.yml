"Lb31,1":
  text: "I PAN powiedział do Mojżesza:"
  tags: []
"Lb31,2":
  text: "Pomścij krzywdy synów Izraela na Midianitach. Potem zostaniesz przyłączony do swego ludu."
  tags: []
"Lb31,3":
  text: "Mojżesz powiedział więc do ludu: Przygotujcie spośród siebie mężczyzn do bitwy, aby wyruszyli przeciw Midianitom i dokonali na nich zemsty PANA."
  tags: []
"Lb31,4":
  text: "Wyślecie na wojnę po tysiącu z każdego pokolenia, ze wszystkich pokoleń Izraela."
  tags: []
"Lb31,5":
  text: "I wyznaczono z tysięcy Izraela po tysiącu z każdego pokolenia, dwanaście tysięcy gotowych do walki."
  tags: []
"Lb31,6":
  text: "I Mojżesz wysłał ich na wojnę po tysiącu z każdego pokolenia; posłał też z nimi Pinchasa, syna kapłana Eleazara, na wojnę, a w jego ręku były święte sprzęty i trąby sygnałowe."
  tags: []
"Lb31,7":
  text: "Wtedy walczyli z Midianitami, jak PAN rozkazał Mojżeszowi, i pozabijali wszystkich mężczyzn."
  tags: []
"Lb31,8":
  text: "Oprócz innych zabitych, zabili też królów Midianu: Ewiego, Rekema, Sura, Chura i Rebę – pięciu królów Midianu. Zabili też mieczem Balaama, syna Beora."
  tags: []
"Lb31,9":
  text: "Synowie Izraela wzięli do niewoli kobiety Midianu i ich dzieci; zabrali też całe ich bydło i trzody, i cały ich majątek;"
  tags: []
"Lb31,10":
  text: "Spalili też ogniem wszystkie ich miasta, w których mieszkali, oraz wszystkie ich zamki;"
  tags: []
"Lb31,11":
  text: "I zabrali cały łup oraz całą zdobycz zarówno z ludzi, jak i ze zwierząt;"
  tags: []
"Lb31,12":
  text: "I przyprowadzili więźniów, zdobycz i łup do Mojżesza, do kapłana Eleazara i do zgromadzenia synów Izraela, do obozu na równinach Moabu, które są nad Jordanem, naprzeciw Jerycha."
  tags: []
"Lb31,13":
  text: "A Mojżesz, kapłan Eleazar i wszyscy naczelnicy zgromadzenia wyszli im naprzeciw poza obóz."
  tags: []
"Lb31,14":
  text: "I Mojżesz bardzo się rozgniewał na dowódców wojska, tysiączników i setników, którzy wrócili z walki."
  tags: []
"Lb31,15":
  text: "I mówił do nich Mojżesz: Czy zostawiliście przy życiu wszystkie kobiety?"
  tags: []
"Lb31,16":
  text: "Oto one za radą Balaama spowodowały, że synowie Izraela dopuścili się przewinienia przeciwko PANU w związku z Peorem, a to sprowadziło plagę na zgromadzenie PANA."
  tags: []
"Lb31,17":
  text: "Zabijcie więc teraz wszystkich chłopców spośród dzieci, zabijcie też każdą kobietę, która obcowała z mężczyzną;"
  tags: []
"Lb31,18":
  text: "Lecz wszystkie dziewczyny, które nie obcowały z mężczyzną, zostawcie przy życiu dla siebie."
  tags: []
"Lb31,19":
  text: "A wy sami zostańcie przez siedem dni poza obozem. Każdy, kto zabił człowieka, i każdy, kto dotknął zabitego, niech się oczyści trzeciego i siódmego dnia, wy i wasi jeńcy."
  tags: []
"Lb31,20":
  text: "Oczyśćcie również każdą szatę, wszelkie przedmioty skórzane i wszystko, co wykonano z koziej sierści, a także wszelkie drewniane przedmioty."
  tags: []
"Lb31,21":
  text: "Potem kapłan Eleazar powiedział do wojowników, którzy wyruszyli na wojnę: Taka jest ustawa prawa, którą PAN nadał Mojżeszowi:"
  tags: []
"Lb31,22":
  text: "Tylko złoto, srebro, miedź, żelazo, cynę i ołów;"
  tags: []
"Lb31,23":
  text: "Wszystko, co może znieść ogień, przeprowadzicie przez ogień i będzie czyste; jednak najpierw będzie oczyszczone wodą oczyszczenia. Wszystko zaś, co nie może znieść ognia, oczyścicie wodą."
  tags: []
"Lb31,24":
  text: "Siódmego dnia wypierzecie też swoje szaty i będziecie czyści, a potem wejdziecie do obozu."
  tags: []
"Lb31,25":
  text: "Następnie PAN powiedział do Mojżesza:"
  tags: []
"Lb31,26":
  text: "Razem z kapłanem Eleazarem i głowami spośród ojców zgromadzenia policz całą zdobycz uprowadzoną w ludziach i zwierzętach;"
  tags: []
"Lb31,27":
  text: "I podziel zdobycz na dwie części: pomiędzy tych, którzy wyruszyli na wojnę, i pomiędzy całe zgromadzenie."
  tags: []
"Lb31,28":
  text: "Od wojowników, którzy wyruszyli na wojnę, pobierz też daninę dla PANA, po jednym na pięćset, tak z ludzi, jak i wołów, osłów i owiec;"
  tags: []
"Lb31,29":
  text: "Weź to z ich połowy i oddaj kapłanowi Eleazarowi na ofiarę wzniesienia dla PANA."
  tags: []
"Lb31,30":
  text: "A z połowy synów Izraela weź po jednym z pięćdziesięciu z ludzi, wołów, osłów, owiec, słowem ze wszystkich zwierząt, i oddaj to Lewitom, którzy pełnią straż przy przybytku PANA."
  tags: []
"Lb31,31":
  text: "I Mojżesz, i kapłan Eleazar uczynili tak, jak PAN rozkazał Mojżeszowi."
  tags: []
"Lb31,32":
  text: "A zdobycz z pozostałego łupu, który zdobyli wojownicy, wynosiła sześćset siedemdziesiąt pięć tysięcy owiec;"
  tags: []
"Lb31,33":
  text: "Siedemdziesiąt dwa tysiące wołów;"
  tags: []
"Lb31,34":
  text: "Sześćdziesiąt jeden tysięcy osłów;"
  tags: []
"Lb31,35":
  text: "I trzydzieści dwa tysiące kobiet, które nie obcowały z mężczyzną."
  tags: []
"Lb31,36":
  text: "Połowa przypadająca w udziale tym, którzy wyruszyli na wojnę, wynosiła trzysta trzydzieści siedem tysięcy pięćset owiec."
  tags: []
"Lb31,37":
  text: "Danina dla PANA z tych owiec wynosiła sześćset siedemdziesiąt pięć sztuk."
  tags: []
"Lb31,38":
  text: "Wołów było trzydzieści sześć tysięcy, a z tego danina dla PANA – siedemdziesiąt dwie;"
  tags: []
"Lb31,39":
  text: "Osłów było trzydzieści tysięcy pięćset, a z tego danina dla PANA – sześćdziesiąt jeden."
  tags: []
"Lb31,40":
  text: "Ludzi było szesnaście tysięcy, a z tego danina dla PANA – trzydzieści dwie osoby."
  tags: []
"Lb31,41":
  text: "I Mojżesz oddał kapłanowi Eleazarowi daninę na ofiarę wzniesienia dla PANA, tak jak PAN rozkazał Mojżeszowi."
  tags: []
"Lb31,42":
  text: "A z połowy należącej do synów Izraela, którą Mojżesz oddzielił od tych, którzy wyruszyli na wojnę;"
  tags: []
"Lb31,43":
  text: "(Połowa należąca do zgromadzenia wynosiła trzysta trzydzieści siedem tysięcy pięćset owiec;"
  tags: []
"Lb31,44":
  text: "Trzydzieści sześć tysięcy wołów;"
  tags: []
"Lb31,45":
  text: "Trzydzieści tysięcy pięćset osłów;"
  tags: []
"Lb31,46":
  text: "I szesnaście tysięcy osób)."
  tags: []
"Lb31,47":
  text: "Z tej połowy należącej do synów Izraela Mojżesz wziął po jednym na pięćdziesiąt z ludzi i zwierząt, i dał to Lewitom pełniącym straż przy przybytku PANA, tak jak PAN rozkazał Mojżeszowi."
  tags: []
"Lb31,48":
  text: "Wtedy przyszli do Mojżesza dowódcy wojska, tysiącznicy i setnicy."
  tags: []
"Lb31,49":
  text: "I powiedzieli do niego: My, twoi słudzy, policzyliśmy wojowników, którzy byli pod naszym dowództwem, i nie brakuje z nas ani jednego."
  tags: []
"Lb31,50":
  text: "Dlatego przynieśliśmy na ofiarę dla PANA to, co każdy zdobył: złote przedmioty, łańcuszki, bransolety, pierścienie, kolczyki i naszyjniki, by dokonać przebłagania za nasze dusze przed PANEM."
  tags: []
"Lb31,51":
  text: "Mojżesz i kapłan Eleazar przyjęli więc od nich to złoto, wszystkie wykonane przedmioty."
  tags: []
"Lb31,52":
  text: "A całego złota tej ofiary, którą oddali PANU, od tysiączników i setników, było szesnaście tysięcy siedemset pięćdziesiąt syklów."
  tags: []
"Lb31,53":
  text: "Wojownicy bowiem zatrzymali łup, każdy dla siebie."
  tags: []
"Lb31,54":
  text: "Mojżesz i kapłan Eleazar przyjęli to złoto od tysiączników i setników i zanieśli do Namiotu Zgromadzenia jako pamiątkę synów Izraela przed PANEM."
  tags: []
