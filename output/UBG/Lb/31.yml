"Lb31,1": "I PAN powiedział do Mojżesza:"
"Lb31,2": "Pomścij krzywdy synów Izraela na Midianitach. Potem zostaniesz przyłączony do swego ludu."
"Lb31,3": "Mojżesz powiedział więc do ludu: Przygotujcie spośród siebie mężczyzn do bitwy, aby wyruszyli przeciw Midianitom i dokonali na nich zemsty PANA."
"Lb31,4": "Wyślecie na wojnę po tysiącu z każdego pokolenia, ze wszystkich pokoleń Izraela."
"Lb31,5": "I wyznaczono z tysięcy Izraela po tysiącu z każdego pokolenia, dwanaście tysięcy gotowych do walki."
"Lb31,6": "I Mojżesz wysłał ich na wojnę po tysiącu z każdego pokolenia; posłał też z nimi Pinchasa, syna kapłana Eleazara, na wojnę, a w jego ręku były święte sprzęty i trąby sygnałowe."
"Lb31,7": "Wtedy walczyli z Midianitami, jak PAN rozkazał Mojżeszowi, i pozabijali wszystkich mężczyzn."
"Lb31,8": "Oprócz innych zabitych, zabili też królów Midianu: Ewiego, Rekema, Sura, Chura i Rebę – pięciu królów Midianu. Zabili też mieczem Balaama, syna Beora."
"Lb31,9": "Synowie Izraela wzięli do niewoli kobiety Midianu i ich dzieci; zabrali też całe ich bydło i trzody, i cały ich majątek;"
"Lb31,10": "Spalili też ogniem wszystkie ich miasta, w których mieszkali, oraz wszystkie ich zamki;"
"Lb31,11": "I zabrali cały łup oraz całą zdobycz zarówno z ludzi, jak i ze zwierząt;"
"Lb31,12": "I przyprowadzili więźniów, zdobycz i łup do Mojżesza, do kapłana Eleazara i do zgromadzenia synów Izraela, do obozu na równinach Moabu, które są nad Jordanem, naprzeciw Jerycha."
"Lb31,13": "A Mojżesz, kapłan Eleazar i wszyscy naczelnicy zgromadzenia wyszli im naprzeciw poza obóz."
"Lb31,14": "I Mojżesz bardzo się rozgniewał na dowódców wojska, tysiączników i setników, którzy wrócili z walki."
"Lb31,15": "I mówił do nich Mojżesz: Czy zostawiliście przy życiu wszystkie kobiety?"
"Lb31,16": "Oto one za radą Balaama spowodowały, że synowie Izraela dopuścili się przewinienia przeciwko PANU w związku z Peorem, a to sprowadziło plagę na zgromadzenie PANA."
"Lb31,17": "Zabijcie więc teraz wszystkich chłopców spośród dzieci, zabijcie też każdą kobietę, która obcowała z mężczyzną;"
"Lb31,18": "Lecz wszystkie dziewczyny, które nie obcowały z mężczyzną, zostawcie przy życiu dla siebie."
"Lb31,19": "A wy sami zostańcie przez siedem dni poza obozem. Każdy, kto zabił człowieka, i każdy, kto dotknął zabitego, niech się oczyści trzeciego i siódmego dnia, wy i wasi jeńcy."
"Lb31,20": "Oczyśćcie również każdą szatę, wszelkie przedmioty skórzane i wszystko, co wykonano z koziej sierści, a także wszelkie drewniane przedmioty."
"Lb31,21": "Potem kapłan Eleazar powiedział do wojowników, którzy wyruszyli na wojnę: Taka jest ustawa prawa, którą PAN nadał Mojżeszowi:"
"Lb31,22": "Tylko złoto, srebro, miedź, żelazo, cynę i ołów;"
"Lb31,23": "Wszystko, co może znieść ogień, przeprowadzicie przez ogień i będzie czyste; jednak najpierw będzie oczyszczone wodą oczyszczenia. Wszystko zaś, co nie może znieść ognia, oczyścicie wodą."
"Lb31,24": "Siódmego dnia wypierzecie też swoje szaty i będziecie czyści, a potem wejdziecie do obozu."
"Lb31,25": "Następnie PAN powiedział do Mojżesza:"
"Lb31,26": "Razem z kapłanem Eleazarem i głowami spośród ojców zgromadzenia policz całą zdobycz uprowadzoną w ludziach i zwierzętach;"
"Lb31,27": "I podziel zdobycz na dwie części: pomiędzy tych, którzy wyruszyli na wojnę, i pomiędzy całe zgromadzenie."
"Lb31,28": "Od wojowników, którzy wyruszyli na wojnę, pobierz też daninę dla PANA, po jednym na pięćset, tak z ludzi, jak i wołów, osłów i owiec;"
"Lb31,29": "Weź to z ich połowy i oddaj kapłanowi Eleazarowi na ofiarę wzniesienia dla PANA."
"Lb31,30": "A z połowy synów Izraela weź po jednym z pięćdziesięciu z ludzi, wołów, osłów, owiec, słowem ze wszystkich zwierząt, i oddaj to Lewitom, którzy pełnią straż przy przybytku PANA."
"Lb31,31": "I Mojżesz, i kapłan Eleazar uczynili tak, jak PAN rozkazał Mojżeszowi."
"Lb31,32": "A zdobycz z pozostałego łupu, który zdobyli wojownicy, wynosiła sześćset siedemdziesiąt pięć tysięcy owiec;"
"Lb31,33": "Siedemdziesiąt dwa tysiące wołów;"
"Lb31,34": "Sześćdziesiąt jeden tysięcy osłów;"
"Lb31,35": "I trzydzieści dwa tysiące kobiet, które nie obcowały z mężczyzną."
"Lb31,36": "Połowa przypadająca w udziale tym, którzy wyruszyli na wojnę, wynosiła trzysta trzydzieści siedem tysięcy pięćset owiec."
"Lb31,37": "Danina dla PANA z tych owiec wynosiła sześćset siedemdziesiąt pięć sztuk."
"Lb31,38": "Wołów było trzydzieści sześć tysięcy, a z tego danina dla PANA – siedemdziesiąt dwie;"
"Lb31,39": "Osłów było trzydzieści tysięcy pięćset, a z tego danina dla PANA – sześćdziesiąt jeden."
"Lb31,40": "Ludzi było szesnaście tysięcy, a z tego danina dla PANA – trzydzieści dwie osoby."
"Lb31,41": "I Mojżesz oddał kapłanowi Eleazarowi daninę na ofiarę wzniesienia dla PANA, tak jak PAN rozkazał Mojżeszowi."
"Lb31,42": "A z połowy należącej do synów Izraela, którą Mojżesz oddzielił od tych, którzy wyruszyli na wojnę;"
"Lb31,43": "(Połowa należąca do zgromadzenia wynosiła trzysta trzydzieści siedem tysięcy pięćset owiec;"
"Lb31,44": "Trzydzieści sześć tysięcy wołów;"
"Lb31,45": "Trzydzieści tysięcy pięćset osłów;"
"Lb31,46": "I szesnaście tysięcy osób)."
"Lb31,47": "Z tej połowy należącej do synów Izraela Mojżesz wziął po jednym na pięćdziesiąt z ludzi i zwierząt, i dał to Lewitom pełniącym straż przy przybytku PANA, tak jak PAN rozkazał Mojżeszowi."
"Lb31,48": "Wtedy przyszli do Mojżesza dowódcy wojska, tysiącznicy i setnicy."
"Lb31,49": "I powiedzieli do niego: My, twoi słudzy, policzyliśmy wojowników, którzy byli pod naszym dowództwem, i nie brakuje z nas ani jednego."
"Lb31,50": "Dlatego przynieśliśmy na ofiarę dla PANA to, co każdy zdobył: złote przedmioty, łańcuszki, bransolety, pierścienie, kolczyki i naszyjniki, by dokonać przebłagania za nasze dusze przed PANEM."
"Lb31,51": "Mojżesz i kapłan Eleazar przyjęli więc od nich to złoto, wszystkie wykonane przedmioty."
"Lb31,52": "A całego złota tej ofiary, którą oddali PANU, od tysiączników i setników, było szesnaście tysięcy siedemset pięćdziesiąt syklów."
"Lb31,53": "Wojownicy bowiem zatrzymali łup, każdy dla siebie."
"Lb31,54": "Mojżesz i kapłan Eleazar przyjęli to złoto od tysiączników i setników i zanieśli do Namiotu Zgromadzenia jako pamiątkę synów Izraela przed PANEM."
