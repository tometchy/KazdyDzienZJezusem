"Lb19,1":
  text: "I PAN powiedział do Mojżesza i Aarona:"
  tags: []
"Lb19,2":
  text: "To jest ustawa prawa, którą nadał PAN: Powiedz synom Izraela, aby przyprowadzili do ciebie czerwoną jałówkę, zdrową i bez skazy, na której jeszcze nie było jarzma."
  tags: []
"Lb19,3":
  text: "Oddacie ją kapłanowi Eleazarowi, który ją wyprowadzi poza obóz, i zostanie przed nim zabita."
  tags: []
"Lb19,4":
  text: "A kapłan Eleazar weźmie nieco z jej krwi na swój palec i pokropi nią siedem razy na wprost przed Namiotem Zgromadzenia."
  tags: []
"Lb19,5":
  text: "Potem każe spalić jałówkę na swoich oczach: spali jej skórę, mięso, krew wraz z jej odchodami."
  tags: []
"Lb19,6":
  text: "I kapłan weźmie drewno cedrowe, hizop i karmazyn i wrzuci to do ognia, w którym płonie jałówka."
  tags: []
"Lb19,7":
  text: "Wtedy kapłan wypierze swoje szaty i umyje swoje ciało wodą; potem wejdzie do obozu i będzie nieczysty do wieczora."
  tags: []
"Lb19,8":
  text: "Również ten, który ją będzie palić, wypierze swoje szaty w wodzie i umyje swoje ciało wodą, i będzie nieczysty do wieczora."
  tags: []
"Lb19,9":
  text: "Człowiek czysty zbierze popiół tej jałówki i złoży go poza obozem na miejscu czystym; będzie on przechowywany dla zgromadzenia synów Izraela do wody oczyszczenia; jest to ofiara za grzech."
  tags: []
"Lb19,10":
  text: "Ten, który zbierał popiół jałówki, wypierze swoje szaty i będzie nieczysty do wieczora. Będzie to ustawa wieczysta dla synów Izraela i dla przybysza mieszkającego wśród was."
  tags: []
"Lb19,11":
  text: "Kto dotknie jakiegokolwiek ludzkiego trupa, będzie nieczysty przez siedem dni."
  tags: []
"Lb19,12":
  text: "Taki oczyści się tą wodą w trzecim i siódmym dniu i będzie czysty. Jeśli jednak nie oczyści się w trzecim i siódmym dniu, będzie nieczysty."
  tags: []
"Lb19,13":
  text: "Kto dotknie zwłok człowieka zmarłego, a nie oczyści się, ten zanieczyści przybytek PANA; ta dusza będzie wykluczona z Izraela. Człowiek ten nie został bowiem pokropiony wodą oczyszczenia; będzie nieczysty, a jego nieczystość pozostanie na nim."
  tags: []
"Lb19,14":
  text: "Taka jest ustawa, gdy człowiek umrze w namiocie: ktokolwiek wejdzie do tego namiotu i cokolwiek znajduje się w tym namiocie będzie nieczyste przez siedem dni."
  tags: []
"Lb19,15":
  text: "Każde naczynie odkryte, które nie ma przymocowanej pokrywy, będzie nieczyste."
  tags: []
"Lb19,16":
  text: "Kto dotknie na polu zabitego mieczem lub umarłego, lub kości ludzkich, lub grobu będzie nieczysty przez siedem dni."
  tags: []
"Lb19,17":
  text: "Wezmą dla tego nieczystego nieco popiołu jałówki spalonej za grzech i na to wleją do naczynia źródlanej wody."
  tags: []
"Lb19,18":
  text: "Człowiek czysty weźmie hizop, zmoczy go w tej wodzie i pokropi namiot oraz wszystkie naczynia i wszystkich ludzi, którzy tam byli, także tego, który dotknął kości lub zabitego, lub zmarłego, lub grobu."
  tags: []
"Lb19,19":
  text: "Człowiek czysty pokropi nieczystego w trzecim i siódmym dniu, a gdy go oczyści w siódmym dniu, wypierze on swoje szaty i umyje się wodą, i wieczorem będzie czysty."
  tags: []
"Lb19,20":
  text: "A człowiek, który stał się nieczysty, a nie oczyścił się, zostanie wykluczony spośród zgromadzenia, gdyż ta dusza zbezcześciła świątynię PANA. Człowiek ten nie został pokropiony wodą oczyszczenia i jest nieczysty."
  tags: []
"Lb19,21":
  text: "Będzie to dla nich ustawą wieczystą: kto skrapia wodą oczyszczenia, wypierze swoje szaty, a kto dotknie tej wody oczyszczenia, będzie nieczysty do wieczora."
  tags: []
"Lb19,22":
  text: "Czegokolwiek dotknie nieczysty, będzie nieczyste; również człowiek, który tego dotknie, będzie nieczysty do wieczora."
  tags: []
