"Lb23,1": "I Balaam powiedział do Balaka: Zbuduj mi tu siedem ołtarzy i przygotuj mi tu siedem cielców i siedem baranów."
"Lb23,2": "Uczynił więc Balak tak, jak powiedział Balaam; potem Balak i Balaam ofiarowali po jednym cielcu i jednym baranie na każdym ołtarzu."
"Lb23,3": "Wtedy Balaam powiedział do Balaka: Pozostań przy swoim całopaleniu, a ja pójdę; może PAN spotka się ze mną, a cokolwiek mi objawi, powiem ci. I poszedł na wzgórze."
"Lb23,4": "I Bóg spotkał się z Balaamem; i Balaam powiedział do niego: Postawiłem siedem ołtarzy i ofiarowałem po jednym cielcu i jednym baranie na każdym ołtarzu."
"Lb23,5": "Wówczas PAN włożył słowa w usta Balaama i powiedział: Wróć do Balaka i tak mu powiedz."
"Lb23,6": "I wrócił do niego, a oto stał przy swoim całopaleniu, on i wszyscy książęta Moabu."
"Lb23,7": "I rozpoczął swą przypowieść, mówiąc: Balak, król Moabu, sprowadził mnie z Aramu, z gór wschodnich tymi słowy: Przyjdź, przeklnij mi Jakuba, przyjdź, złorzecz Izraelowi."
"Lb23,8": "Jakże mam przeklinać tego, kogo Bóg nie przeklął? I jak mam złorzeczyć temu, komu PAN nie złorzeczył?"
"Lb23,9": "Gdyż widzę go ze szczytu skał, spoglądam na niego z pagórków; oto ten lud będzie mieszkać osobno, do innych narodów nie będzie zaliczony."
"Lb23,10": "Któż policzy proch Jakuba, któż policzy choćby czwartą część Izraela? Niech umrę śmiercią sprawiedliwych i niech mój koniec będzie taki jak ich."
"Lb23,11": "Wtedy Balak powiedział do Balaama: Cóż mi uczyniłeś? Sprowadziłem cię, abyś przeklął moich wrogów, a oto ty im wielce błogosławiłeś."
"Lb23,12": "A on odpowiedział: Czy nie mam pilnować tego, by mówić to, co PAN włożył w moje usta?"
"Lb23,13": "I Balak powiedział do niego: Chodź, proszę, ze mną na inne miejsce, z którego będziesz mógł ich widzieć; zobaczysz tylko ich skraj, wszystkich nie zobaczysz. Przeklnij mi ich stamtąd."
"Lb23,14": "I zaprowadził go na pole Sofim, na szczyt góry Pizga; tam zbudował siedem ołtarzy i ofiarował po jednym cielcu i jednym baranie na każdym ołtarzu."
"Lb23,15": "I powiedział do Balaka: Pozostań tu przy swoim całopaleniu, a ja pójdę tam na spotkanie PANA."
"Lb23,16": "I PAN wyszedł na spotkanie z Balaamem, włożył słowa w jego usta i powiedział: Wróć do Balaka i tak mu powiedz."
"Lb23,17": "Przyszedł więc do niego, a oto on stał przy swoim całopaleniu, a z nim książęta Moabu. I Balak zapytał go: Cóż ci PAN powiedział?"
"Lb23,18": "I rozpoczął swą przypowieść tymi słowy: Wstań, Balaku, i słuchaj; nakłoń swego ucha, synu Sippora."
"Lb23,19": "Bóg nie jest człowiekiem, aby miał kłamać, ani synem człowieczym, żeby miał żałować. Czy on powie coś, a tego nie uczyni? Czy wypowie, a nie spełni?"
"Lb23,20": "Oto otrzymałem rozkaz, żeby błogosławić; on błogosławił, a ja tego nie mogę odwrócić."
"Lb23,21": "Nie dostrzegł nieprawości w Jakubie ani nie widział przestępstwa w Izraelu. PAN, jego Bóg, jest z nim, a okrzyk króla – przy nim."
"Lb23,22": "Bóg wyprowadził ich z Egiptu, jego moc jest jak u jednorożca."
"Lb23,23": "Nie ma bowiem zaklęcia przeciw Jakubowi ani wróżby przeciw Izraelowi. Już od tego czasu będzie się mówić o Jakubie i o Izraelu: Czego dokonał Bóg!"
"Lb23,24": "Oto lud powstanie jak silny lew, jak młody lew się podnosi; nie położy się, aż pożre zdobycz i wypije krew zabitych."
"Lb23,25": "Wtedy Balak powiedział do Balaama: Ani ich nie przeklinaj więcej, ani im też nie błogosław."
"Lb23,26": "I Balaam odpowiedział Balakowi: Czy nie powiedziałem ci, że cokolwiek powie PAN, to uczynię?"
"Lb23,27": "Balak powiedział do Balaama: Chodź, proszę, zaprowadzę cię na inne miejsce, może się spodoba Bogu, żebyś ich stamtąd przeklął."
"Lb23,28": "Wtedy Balak wziął Balaama na szczyt Peor, który wznosi się nad pustynią."
"Lb23,29": "I Balaam powiedział do Balaka: Zbuduj mi siedem ołtarzy i przygotuj mi tu siedem cielców i siedem baranów."
"Lb23,30": "Balak uczynił więc tak, jak mu rozkazał Balaam, i ofiarował po jednym cielcu i jednym baranie na każdym ołtarzu."
