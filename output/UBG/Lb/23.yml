"Lb23,1":
  text: "I Balaam powiedział do Balaka: Zbuduj mi tu siedem ołtarzy i przygotuj mi tu siedem cielców i siedem baranów."
  tags: []
"Lb23,2":
  text: "Uczynił więc Balak tak, jak powiedział Balaam; potem Balak i Balaam ofiarowali po jednym cielcu i jednym baranie na każdym ołtarzu."
  tags: []
"Lb23,3":
  text: "Wtedy Balaam powiedział do Balaka: Pozostań przy swoim całopaleniu, a ja pójdę; może PAN spotka się ze mną, a cokolwiek mi objawi, powiem ci. I poszedł na wzgórze."
  tags: []
"Lb23,4":
  text: "I Bóg spotkał się z Balaamem; i Balaam powiedział do niego: Postawiłem siedem ołtarzy i ofiarowałem po jednym cielcu i jednym baranie na każdym ołtarzu."
  tags: []
"Lb23,5":
  text: "Wówczas PAN włożył słowa w usta Balaama i powiedział: Wróć do Balaka i tak mu powiedz."
  tags: []
"Lb23,6":
  text: "I wrócił do niego, a oto stał przy swoim całopaleniu, on i wszyscy książęta Moabu."
  tags: []
"Lb23,7":
  text: "I rozpoczął swą przypowieść, mówiąc: Balak, król Moabu, sprowadził mnie z Aramu, z gór wschodnich tymi słowy: Przyjdź, przeklnij mi Jakuba, przyjdź, złorzecz Izraelowi."
  tags: []
"Lb23,8":
  text: "Jakże mam przeklinać tego, kogo Bóg nie przeklął? I jak mam złorzeczyć temu, komu PAN nie złorzeczył?"
  tags: []
"Lb23,9":
  text: "Gdyż widzę go ze szczytu skał, spoglądam na niego z pagórków; oto ten lud będzie mieszkać osobno, do innych narodów nie będzie zaliczony."
  tags: []
"Lb23,10":
  text: "Któż policzy proch Jakuba, któż policzy choćby czwartą część Izraela? Niech umrę śmiercią sprawiedliwych i niech mój koniec będzie taki jak ich."
  tags: []
"Lb23,11":
  text: "Wtedy Balak powiedział do Balaama: Cóż mi uczyniłeś? Sprowadziłem cię, abyś przeklął moich wrogów, a oto ty im wielce błogosławiłeś."
  tags: []
"Lb23,12":
  text: "A on odpowiedział: Czy nie mam pilnować tego, by mówić to, co PAN włożył w moje usta?"
  tags: []
"Lb23,13":
  text: "I Balak powiedział do niego: Chodź, proszę, ze mną na inne miejsce, z którego będziesz mógł ich widzieć; zobaczysz tylko ich skraj, wszystkich nie zobaczysz. Przeklnij mi ich stamtąd."
  tags: []
"Lb23,14":
  text: "I zaprowadził go na pole Sofim, na szczyt góry Pizga; tam zbudował siedem ołtarzy i ofiarował po jednym cielcu i jednym baranie na każdym ołtarzu."
  tags: []
"Lb23,15":
  text: "I powiedział do Balaka: Pozostań tu przy swoim całopaleniu, a ja pójdę tam na spotkanie PANA."
  tags: []
"Lb23,16":
  text: "I PAN wyszedł na spotkanie z Balaamem, włożył słowa w jego usta i powiedział: Wróć do Balaka i tak mu powiedz."
  tags: []
"Lb23,17":
  text: "Przyszedł więc do niego, a oto on stał przy swoim całopaleniu, a z nim książęta Moabu. I Balak zapytał go: Cóż ci PAN powiedział?"
  tags: []
"Lb23,18":
  text: "I rozpoczął swą przypowieść tymi słowy: Wstań, Balaku, i słuchaj; nakłoń swego ucha, synu Sippora."
  tags: []
"Lb23,19":
  text: "Bóg nie jest człowiekiem, aby miał kłamać, ani synem człowieczym, żeby miał żałować. Czy on powie coś, a tego nie uczyni? Czy wypowie, a nie spełni?"
  tags: []
"Lb23,20":
  text: "Oto otrzymałem rozkaz, żeby błogosławić; on błogosławił, a ja tego nie mogę odwrócić."
  tags: []
"Lb23,21":
  text: "Nie dostrzegł nieprawości w Jakubie ani nie widział przestępstwa w Izraelu. PAN, jego Bóg, jest z nim, a okrzyk króla – przy nim."
  tags: []
"Lb23,22":
  text: "Bóg wyprowadził ich z Egiptu, jego moc jest jak u jednorożca."
  tags: []
"Lb23,23":
  text: "Nie ma bowiem zaklęcia przeciw Jakubowi ani wróżby przeciw Izraelowi. Już od tego czasu będzie się mówić o Jakubie i o Izraelu: Czego dokonał Bóg!"
  tags: []
"Lb23,24":
  text: "Oto lud powstanie jak silny lew, jak młody lew się podnosi; nie położy się, aż pożre zdobycz i wypije krew zabitych."
  tags: []
"Lb23,25":
  text: "Wtedy Balak powiedział do Balaama: Ani ich nie przeklinaj więcej, ani im też nie błogosław."
  tags: []
"Lb23,26":
  text: "I Balaam odpowiedział Balakowi: Czy nie powiedziałem ci, że cokolwiek powie PAN, to uczynię?"
  tags: []
"Lb23,27":
  text: "Balak powiedział do Balaama: Chodź, proszę, zaprowadzę cię na inne miejsce, może się spodoba Bogu, żebyś ich stamtąd przeklął."
  tags: []
"Lb23,28":
  text: "Wtedy Balak wziął Balaama na szczyt Peor, który wznosi się nad pustynią."
  tags: []
"Lb23,29":
  text: "I Balaam powiedział do Balaka: Zbuduj mi siedem ołtarzy i przygotuj mi tu siedem cielców i siedem baranów."
  tags: []
"Lb23,30":
  text: "Balak uczynił więc tak, jak mu rozkazał Balaam, i ofiarował po jednym cielcu i jednym baranie na każdym ołtarzu."
  tags: []
