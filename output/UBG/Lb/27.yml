"Lb27,1":
  text: "Wtedy przyszły córki Selofchada, syna Chefera, syna Gileada, syna Makira, syna Manassesa, z rodu Manassesa, syna Józefa; a to są imiona jego córek: Machla, Noa, Chogla, Milka i Tirsa."
  tags: []
"Lb27,2":
  text: "I stanęły przed Mojżeszem, przed kapłanem Eleazarem, przed naczelnikami i całym zgromadzeniem u wejścia do Namiotu Zgromadzenia i powiedziały:"
  tags: []
"Lb27,3":
  text: "Nasz ojciec umarł na pustyni, ale nie należał do zgrai tych, którzy zbuntowali się przeciw PANU w gromadzie Koracha. Umarł za własny grzech, a nie miał synów."
  tags: []
"Lb27,4":
  text: "Dlaczego imię naszego ojca miałoby zniknąć z jego rodziny przez to, że nie miał syna? Dajcie nam posiadłość pośród braci naszego ojca."
  tags: []
"Lb27,5":
  text: "Mojżesz przedstawił więc ich sprawę PANU."
  tags: []
"Lb27,6":
  text: "I PAN powiedział do Mojżesza:"
  tags: []
"Lb27,7":
  text: "Córki Selofchada słusznie mówią: Daj im koniecznie dziedziczną posiadłość pośród braci ich ojca, a przenieś na nie dziedzictwo ich ojca."
  tags: []
"Lb27,8":
  text: "I przemów do synów Izraela tak: Jeśli ktoś umrze, a nie miał syna, wtedy przeniesiecie jego dziedzictwo na jego córkę."
  tags: []
"Lb27,9":
  text: "A jeśli nie miał córki, to dacie jego dziedzictwo jego braciom."
  tags: []
"Lb27,10":
  text: "A jeśli nie miał braci, to dacie jego dziedzictwo braciom jego ojca."
  tags: []
"Lb27,11":
  text: "A jeśli jego ojciec nie miał braci, to dacie jego dziedzictwo najbliższemu krewnemu z jego rodziny, aby je odziedziczył. I będzie to dla synów Izraela ustawą prawną, jak PAN rozkazał Mojżeszowi."
  tags: []
"Lb27,12":
  text: "Potem PAN powiedział do Mojżesza: Wstąp na tę górę Abarim i spójrz na ziemię, którą dałem synom Izraela."
  tags: []
"Lb27,13":
  text: "A gdy ją zobaczysz, zostaniesz i ty przyłączony do swego ludu, jak został przyłączony twój brat Aaron."
  tags: []
"Lb27,14":
  text: "Dlatego że sprzeciwiliście się mojemu rozkazowi na pustyni Syn, podczas buntu zgromadzenia, i nie uświęciliście mnie na ich oczach u tych wód. To są wody Meriba w Kadesz, na pustyni Syn."
  tags: []
"Lb27,15":
  text: "Wtedy Mojżesz powiedział do PANA:"
  tags: []
"Lb27,16":
  text: "Niech PAN, Bóg duchów wszelkiego ciała, ustanowi męża nad zgromadzeniem;"
  tags: []
"Lb27,17":
  text: "Który będzie wychodził przed nim i który będzie wchodził przed nim, który będzie je wyprowadzał i który będzie je przyprowadzał, aby zgromadzenie PANA nie było jak owce, które nie mają pasterza."
  tags: []
"Lb27,18":
  text: "PAN powiedział do Mojżesza: Weź do siebie Jozuego, syna Nuna, męża, w którym jest mój Duch, i połóż na nim swoją rękę;"
  tags: []
"Lb27,19":
  text: "I postaw go przed kapłanem Eleazarem i przed całym zgromadzeniem, i na ich oczach daj mu polecenie;"
  tags: []
"Lb27,20":
  text: "I przenieś na niego część swojej godności, aby go słuchało całe zgromadzenie synów Izraela."
  tags: []
"Lb27,21":
  text: "Będzie on stawał przed kapłanem Eleazarem, aby ten za niego radził się przed PANEM za pośrednictwem sądu Urim. Na jego rozkaz będą wychodzić i na jego rozkaz będą wchodzić – on, a z nim wszyscy synowie Izraela, całe zgromadzenie."
  tags: []
"Lb27,22":
  text: "I Mojżesz uczynił tak, jak PAN mu rozkazał. Wziął Jozuego i postawił go przed kapłanem Eleazarem i przed całym zgromadzeniem."
  tags: []
"Lb27,23":
  text: "Następnie położył na niego swoje ręce i dał mu polecenie, tak jak PAN nakazał przez Mojżesza."
  tags: []
