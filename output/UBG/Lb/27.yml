"Lb27,1": "Wtedy przyszły córki Selofchada, syna Chefera, syna Gileada, syna Makira, syna Manassesa, z rodu Manassesa, syna Józefa; a to są imiona jego córek: Machla, Noa, Chogla, Milka i Tirsa."
"Lb27,2": "I stanęły przed Mojżeszem, przed kapłanem Eleazarem, przed naczelnikami i całym zgromadzeniem u wejścia do Namiotu Zgromadzenia i powiedziały:"
"Lb27,3": "Nasz ojciec umarł na pustyni, ale nie należał do zgrai tych, którzy zbuntowali się przeciw PANU w gromadzie Koracha. Umarł za własny grzech, a nie miał synów."
"Lb27,4": "Dlaczego imię naszego ojca miałoby zniknąć z jego rodziny przez to, że nie miał syna? Dajcie nam posiadłość pośród braci naszego ojca."
"Lb27,5": "Mojżesz przedstawił więc ich sprawę PANU."
"Lb27,6": "I PAN powiedział do Mojżesza:"
"Lb27,7": "Córki Selofchada słusznie mówią: Daj im koniecznie dziedziczną posiadłość pośród braci ich ojca, a przenieś na nie dziedzictwo ich ojca."
"Lb27,8": "I przemów do synów Izraela tak: Jeśli ktoś umrze, a nie miał syna, wtedy przeniesiecie jego dziedzictwo na jego córkę."
"Lb27,9": "A jeśli nie miał córki, to dacie jego dziedzictwo jego braciom."
"Lb27,10": "A jeśli nie miał braci, to dacie jego dziedzictwo braciom jego ojca."
"Lb27,11": "A jeśli jego ojciec nie miał braci, to dacie jego dziedzictwo najbliższemu krewnemu z jego rodziny, aby je odziedziczył. I będzie to dla synów Izraela ustawą prawną, jak PAN rozkazał Mojżeszowi."
"Lb27,12": "Potem PAN powiedział do Mojżesza: Wstąp na tę górę Abarim i spójrz na ziemię, którą dałem synom Izraela."
"Lb27,13": "A gdy ją zobaczysz, zostaniesz i ty przyłączony do swego ludu, jak został przyłączony twój brat Aaron."
"Lb27,14": "Dlatego że sprzeciwiliście się mojemu rozkazowi na pustyni Syn, podczas buntu zgromadzenia, i nie uświęciliście mnie na ich oczach u tych wód. To są wody Meriba w Kadesz, na pustyni Syn."
"Lb27,15": "Wtedy Mojżesz powiedział do PANA:"
"Lb27,16": "Niech PAN, Bóg duchów wszelkiego ciała, ustanowi męża nad zgromadzeniem;"
"Lb27,17": "Który będzie wychodził przed nim i który będzie wchodził przed nim, który będzie je wyprowadzał i który będzie je przyprowadzał, aby zgromadzenie PANA nie było jak owce, które nie mają pasterza."
"Lb27,18": "PAN powiedział do Mojżesza: Weź do siebie Jozuego, syna Nuna, męża, w którym jest mój Duch, i połóż na nim swoją rękę;"
"Lb27,19": "I postaw go przed kapłanem Eleazarem i przed całym zgromadzeniem, i na ich oczach daj mu polecenie;"
"Lb27,20": "I przenieś na niego część swojej godności, aby go słuchało całe zgromadzenie synów Izraela."
"Lb27,21": "Będzie on stawał przed kapłanem Eleazarem, aby ten za niego radził się przed PANEM za pośrednictwem sądu Urim. Na jego rozkaz będą wychodzić i na jego rozkaz będą wchodzić – on, a z nim wszyscy synowie Izraela, całe zgromadzenie."
"Lb27,22": "I Mojżesz uczynił tak, jak PAN mu rozkazał. Wziął Jozuego i postawił go przed kapłanem Eleazarem i przed całym zgromadzeniem."
"Lb27,23": "Następnie położył na niego swoje ręce i dał mu polecenie, tak jak PAN nakazał przez Mojżesza."
