"Lb6,1": "I PAN powiedział do Mojżesza:"
"Lb6,2": "Przemów do synów Izraela i powiedz do nich: Gdy mężczyzna albo kobieta złoży szczególny ślub nazirejczyka, aby się poświęcić PANU;"
"Lb6,3": "Niech powstrzyma się od wina i mocnego napoju; nie będzie pił octu z wina i octu z mocnego napoju; nie będzie pił żadnego soku z winogron i nie będzie jeść winogron, ani świeżych, ani suszonych."
"Lb6,4": "Przez wszystkie dni swego oddzielenia nie będzie jeść niczego, co pochodzi z winorośli, od ziarenka aż do łupiny."
"Lb6,5": "Przez wszystkie dni ślubu swego oddzielenia brzytwa nie dotknie jego głowy. Dopóki nie wypełni się czas, na który poświęcił się PANU, będzie święty i zapuści włosy na swojej głowie."
"Lb6,6": "Nie zbliży się do umarłego przez cały okres swego oddzielenia dla PANA."
"Lb6,7": "Nie zanieczyści się przy ojcu, matce, bracie czy siostrze, którzy umarli, gdyż ma na głowie poświęcenie dla swego Boga."
"Lb6,8": "Przez wszystkie dni swego oddzielenia będzie świętym dla PANA."
"Lb6,9": "I gdyby ktoś nagle przy nim umarł i zanieczyścił jego poświęconą głowę, to ogoli swoją głowę w dniu swego oczyszczenia; ogoli ją siódmego dnia."
"Lb6,10": "A ósmego dnia przyniesie dwie synogarlice lub dwa młode gołębie do kapłana, przed wejście do Namiotu Zgromadzenia;"
"Lb6,11": "I kapłan złoży jednego na ofiarę za grzech, a drugiego na ofiarę całopalenia, i dokona za niego przebłagania za to, że zgrzeszył przy umarłym, i tego samego dnia poświęci jego głowę."
"Lb6,12": "Potem poświęci PANU dni swego oddzielenia i przyniesie rocznego baranka za przewinienie. Minione dni jednak przepadną, gdyż jego oddzielenie zostało zanieczyszczone."
"Lb6,13": "A takie jest prawo nazirejczyka: Gdy wypełnią się dni jego oddzielenia, przyprowadzi się go przed wejście do Namiotu Zgromadzenia;"
"Lb6,14": "I złoży PANU w ofierze jednego rocznego baranka bez skazy na ofiarę całopalenia, jedną roczną owcę bez skazy na ofiarę za grzech i jednego barana bez skazy na ofiarę pojednawczą;"
"Lb6,15": "Do tego kosz przaśnych chlebów z mąki pszennej, placki zmieszane z oliwą oraz przaśne podpłomyki pomazane oliwą z ich ofiarą pokarmową i ofiarą z płynów."
"Lb6,16": "I kapłan przyniesie to przed PANA i złoży jego ofiarę za grzech oraz jego całopalenie."
"Lb6,17": "Barana zaś złoży PANU na ofiarę pojednawczą wraz z koszem przaśnych chlebów. Kapłan złoży też jego ofiarę pokarmową oraz jego ofiarę z płynów."
"Lb6,18": "I nazirejczyk ogoli swoją poświęconą głowę u wejścia do Namiotu Zgromadzenia i weźmie włosy ze swojej poświęconej głowy, i położy je na ogień, który jest pod ofiarą pojednawczą."
"Lb6,19": "Następnie kapłan weźmie ugotowaną łopatkę barana, jeden przaśny placek z kosza i jeden przaśny podpłomyk i złoży to w ręce nazirejczyka, gdy ten ogoli swoje poświęcone włosy;"
"Lb6,20": "I kapłan będzie to kołysał jako ofiarę kołysania przed PANEM; jest to święta rzecz i należy do kapłana wraz z mostkiem kołysania i łopatką wzniesienia. Potem nazirejczyk będzie mógł pić wino."
"Lb6,21": "Takie jest prawo dotyczące nazirejczyka, który składa ślub, jak i jego ofiary dla PANA za jego oddzielenie, oprócz tego, na co go stać. Zgodnie ze swoim ślubem, który złożył, tak uczyni według prawa swego oddzielenia."
"Lb6,22": "Potem PAN powiedział do Mojżesza:"
"Lb6,23": "Powiedz Aaronowi i jego synom: Tak będziecie błogosławić synów Izraela, mówiąc do nich:"
"Lb6,24": "Niech ci błogosławi PAN i niech cię strzeże;"
"Lb6,25": "Niech PAN rozjaśni nad tobą swoje oblicze i niech ci będzie łaskawy;"
"Lb6,26": "Niech PAN zwróci ku tobie swoje oblicze i niech da ci pokój."
"Lb6,27": "I będą wzywać mojego imienia nad synami Izraela, a ja im będę błogosławił."
