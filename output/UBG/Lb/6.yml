"Lb6,1":
  text: "I PAN powiedział do Mojżesza:"
  tags: []
"Lb6,2":
  text: "Przemów do synów Izraela i powiedz do nich: Gdy mężczyzna albo kobieta złoży szczególny ślub nazirejczyka, aby się poświęcić PANU;"
  tags: []
"Lb6,3":
  text: "Niech powstrzyma się od wina i mocnego napoju; nie będzie pił octu z wina i octu z mocnego napoju; nie będzie pił żadnego soku z winogron i nie będzie jeść winogron, ani świeżych, ani suszonych."
  tags: []
"Lb6,4":
  text: "Przez wszystkie dni swego oddzielenia nie będzie jeść niczego, co pochodzi z winorośli, od ziarenka aż do łupiny."
  tags: []
"Lb6,5":
  text: "Przez wszystkie dni ślubu swego oddzielenia brzytwa nie dotknie jego głowy. Dopóki nie wypełni się czas, na który poświęcił się PANU, będzie święty i zapuści włosy na swojej głowie."
  tags: []
"Lb6,6":
  text: "Nie zbliży się do umarłego przez cały okres swego oddzielenia dla PANA."
  tags: []
"Lb6,7":
  text: "Nie zanieczyści się przy ojcu, matce, bracie czy siostrze, którzy umarli, gdyż ma na głowie poświęcenie dla swego Boga."
  tags: []
"Lb6,8":
  text: "Przez wszystkie dni swego oddzielenia będzie świętym dla PANA."
  tags: []
"Lb6,9":
  text: "I gdyby ktoś nagle przy nim umarł i zanieczyścił jego poświęconą głowę, to ogoli swoją głowę w dniu swego oczyszczenia; ogoli ją siódmego dnia."
  tags: []
"Lb6,10":
  text: "A ósmego dnia przyniesie dwie synogarlice lub dwa młode gołębie do kapłana, przed wejście do Namiotu Zgromadzenia;"
  tags: []
"Lb6,11":
  text: "I kapłan złoży jednego na ofiarę za grzech, a drugiego na ofiarę całopalenia, i dokona za niego przebłagania za to, że zgrzeszył przy umarłym, i tego samego dnia poświęci jego głowę."
  tags: []
"Lb6,12":
  text: "Potem poświęci PANU dni swego oddzielenia i przyniesie rocznego baranka za przewinienie. Minione dni jednak przepadną, gdyż jego oddzielenie zostało zanieczyszczone."
  tags: []
"Lb6,13":
  text: "A takie jest prawo nazirejczyka: Gdy wypełnią się dni jego oddzielenia, przyprowadzi się go przed wejście do Namiotu Zgromadzenia;"
  tags: []
"Lb6,14":
  text: "I złoży PANU w ofierze jednego rocznego baranka bez skazy na ofiarę całopalenia, jedną roczną owcę bez skazy na ofiarę za grzech i jednego barana bez skazy na ofiarę pojednawczą;"
  tags: []
"Lb6,15":
  text: "Do tego kosz przaśnych chlebów z mąki pszennej, placki zmieszane z oliwą oraz przaśne podpłomyki pomazane oliwą z ich ofiarą pokarmową i ofiarą z płynów."
  tags: []
"Lb6,16":
  text: "I kapłan przyniesie to przed PANA i złoży jego ofiarę za grzech oraz jego całopalenie."
  tags: []
"Lb6,17":
  text: "Barana zaś złoży PANU na ofiarę pojednawczą wraz z koszem przaśnych chlebów. Kapłan złoży też jego ofiarę pokarmową oraz jego ofiarę z płynów."
  tags: []
"Lb6,18":
  text: "I nazirejczyk ogoli swoją poświęconą głowę u wejścia do Namiotu Zgromadzenia i weźmie włosy ze swojej poświęconej głowy, i położy je na ogień, który jest pod ofiarą pojednawczą."
  tags: []
"Lb6,19":
  text: "Następnie kapłan weźmie ugotowaną łopatkę barana, jeden przaśny placek z kosza i jeden przaśny podpłomyk i złoży to w ręce nazirejczyka, gdy ten ogoli swoje poświęcone włosy;"
  tags: []
"Lb6,20":
  text: "I kapłan będzie to kołysał jako ofiarę kołysania przed PANEM; jest to święta rzecz i należy do kapłana wraz z mostkiem kołysania i łopatką wzniesienia. Potem nazirejczyk będzie mógł pić wino."
  tags: []
"Lb6,21":
  text: "Takie jest prawo dotyczące nazirejczyka, który składa ślub, jak i jego ofiary dla PANA za jego oddzielenie, oprócz tego, na co go stać. Zgodnie ze swoim ślubem, który złożył, tak uczyni według prawa swego oddzielenia."
  tags: []
"Lb6,22":
  text: "Potem PAN powiedział do Mojżesza:"
  tags: []
"Lb6,23":
  text: "Powiedz Aaronowi i jego synom: Tak będziecie błogosławić synów Izraela, mówiąc do nich:"
  tags: []
"Lb6,24":
  text: "Niech ci błogosławi PAN i niech cię strzeże;"
  tags: []
"Lb6,25":
  text: "Niech PAN rozjaśni nad tobą swoje oblicze i niech ci będzie łaskawy;"
  tags: []
"Lb6,26":
  text: "Niech PAN zwróci ku tobie swoje oblicze i niech da ci pokój."
  tags: []
"Lb6,27":
  text: "I będą wzywać mojego imienia nad synami Izraela, a ja im będę błogosławił."
  tags: []
