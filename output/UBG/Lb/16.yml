"Lb16,1":
  text: "Wtedy Korach, syn Ishara, syna Kehata, syna Lewiego, oraz Datan i Abiram, synowie Eliaba, i On, syn Peleta, synowie Rubena, wzięli ludzi;"
  tags: []
"Lb16,2":
  text: "I powstali przeciw Mojżeszowi, a wraz z nimi dwustu pięćdziesięciu mężczyzn spośród synów Izraela, naczelników zgromadzenia powołanych do rady, ludzi poważanych."
  tags: []
"Lb16,3":
  text: "Zebrali się oni przeciw Mojżeszowi i Aaronowi i powiedzieli do nich: Bierzecie zbyt dużo na siebie! Przecież całe to zgromadzenie, wszyscy oni są święci i wśród nich jest PAN. Dlaczego więc wynosicie się ponad zgromadzenie PANA?"
  tags: []
"Lb16,4":
  text: "Gdy Mojżesz to usłyszał, upadł na twarz;"
  tags: []
"Lb16,5":
  text: "I powiedział do Koracha i do całej jego gromady: Jutro rano PAN pokaże, kto jest jego, kto jest święty i może zbliżyć się do niego. Kogo bowiem wybrał, temu pozwoli zbliżyć się do siebie."
  tags: []
"Lb16,6":
  text: "Tak więc uczynicie: Weźcie sobie kadzielnice, ty, Korach i cała twoja gromada."
  tags: []
"Lb16,7":
  text: "I włóżcie w nie ogień, i jutro umieśćcie w nich kadzidło przed PANEM; a ten człowiek, którego PAN wybierze, będzie święty. Bierzecie zbyt dużo na siebie, synowie Lewiego."
  tags: []
"Lb16,8":
  text: "I powiedział Mojżesz do Koracha: Słuchajcie, proszę, synowie Lewiego;"
  tags: []
"Lb16,9":
  text: "Czy wam to mało, że Bóg Izraela oddzielił was od zgromadzenia Izraela, aby zbliżyć was do siebie, abyście pełnili służbę w przybytku PANA i abyście stali przed zgromadzeniem, i mu służyli?"
  tags: []
"Lb16,10":
  text: "I ciebie, a wraz z tobą wszystkich twoich braci, synów Lewiego, zbliżył do siebie, a wy jeszcze zabiegacie o kapłaństwo?"
  tags: []
"Lb16,11":
  text: "Dlatego ty i cała twoja gromada zbuntowaliście się przeciw PANU, bo kim jest Aaron, że szemracie przeciw niemu?"
  tags: []
"Lb16,12":
  text: "Wtedy Mojżesz kazał przywołać Datana i Abirama, synów Eliaba, lecz oni odpowiedzieli: Nie przyjdziemy."
  tags: []
"Lb16,13":
  text: "Nie dość, że nas wyprowadziłeś z ziemi opływającej mlekiem i miodem, aby nas uśmiercić na tej pustyni, to jeszcze chcesz obwołać się naszym władcą?"
  tags: []
"Lb16,14":
  text: "Ponadto nie wprowadziłeś nas do ziemi opływającej mlekiem i miodem ani nie dałeś nam w dziedzictwo pól i winnic. Czy chcesz tym mężczyznom wyłupić oczy? Nie przyjdziemy."
  tags: []
"Lb16,15":
  text: "Wtedy Mojżesz bardzo się rozgniewał i powiedział do PANA: Nie zważaj na ich ofiarę. Nie wziąłem od nich żadnego osła ani też nikogo z nich nie skrzywdziłem."
  tags: []
"Lb16,16":
  text: "Potem Mojżesz powiedział do Koracha: Ty i cała twoja gromada stawcie się jutro przed PANEM; ty, oni i Aaron:"
  tags: []
"Lb16,17":
  text: "Każdy z was niech weźmie swoją kadzielnicę i nałoży w nią kadzidła, i niech każdy przyniesie przed PANA swoją kadzielnicę, razem dwieście pięćdziesiąt kadzielnic, również ty i Aaron; każdy przyniesie swoją kadzielnicę."
  tags: []
"Lb16,18":
  text: "Każdy więc wziął swoją kadzielnicę, włożył w nią ogień, nałożył na niego kadzidła i stanęli u wejścia do Namiotu Zgromadzenia wraz z Mojżeszem i Aaronem."
  tags: []
"Lb16,19":
  text: "A Korach zebrał przeciwko nim całe zgromadzenie u wejścia do Namiotu Zgromadzenia i wtedy chwała PANA ukazała się całemu ludowi."
  tags: []
"Lb16,20":
  text: "I PAN powiedział do Mojżesza i Aarona:"
  tags: []
"Lb16,21":
  text: "Odłączcie się od tego zgromadzenia, abym mógł je w jednej chwili zniszczyć."
  tags: []
"Lb16,22":
  text: "Lecz oni upadli na twarz i powiedzieli: O Boże, Boże duchów wszelkiego ciała! Czy jeśli zgrzeszy jeden człowiek, będziesz się gniewał na całe zgromadzenie?"
  tags: []
"Lb16,23":
  text: "PAN powiedział do Mojżesza:"
  tags: []
"Lb16,24":
  text: "Przemów do zgromadzenia i powiedz im: Oddalcie się od namiotu Koracha, Datana i Abirama."
  tags: []
"Lb16,25":
  text: "Mojżesz wstał więc i podszedł do Datana i Abirama, a za nim poszli starsi Izraela."
  tags: []
"Lb16,26":
  text: "I powiedział do zgromadzenia: Oddalcie się, proszę, od namiotów tych bezbożnych ludzi i nie dotykajcie niczego, co do nich należy, abyście nie zginęli przez wszystkie ich grzechy."
  tags: []
"Lb16,27":
  text: "I oddalili się od namiotów Koracha, Datana i Abirama z każdej strony. Datan zaś i Abiram wyszli i stali u wejścia do swoich namiotów razem ze swoimi żonami, synami i małymi dziećmi."
  tags: []
"Lb16,28":
  text: "Wtedy Mojżesz powiedział: Po tym poznacie, że PAN mnie posłał, abym dokonał wszystkich tych dzieł, i że nic z własnej woli nie czynię."
  tags: []
"Lb16,29":
  text: "Jeśli ci ludzie umrą taką śmiercią jak wszyscy ludzie albo zostaną ukarani tak jak inni, to nie PAN mnie posłał."
  tags: []
"Lb16,30":
  text: "Ale jeśli PAN uczyni coś nowego i ziemia otworzy swoją paszczę, i pochłonie ich oraz wszystko, co do nich należy, i żywcem zstąpią do piekła, wtedy poznacie, że ci mężczyźni rozdrażnili PANA."
  tags: []
"Lb16,31":
  text: "Gdy tylko skończył wypowiadać wszystkie te słowa, ziemia rozstąpiła się pod nimi."
  tags: []
"Lb16,32":
  text: "A ziemia otworzyła swoją paszczę, i pochłonęła ich oraz ich domy i wszystkich ludzi, którzy byli przy Korachu, i cały ich dobytek."
  tags: []
"Lb16,33":
  text: "I zstąpili oni razem ze wszystkim, co mieli, żywcem do piekła, i ziemia ich okryła; tak zginęli spośród zgromadzenia."
  tags: []
"Lb16,34":
  text: "Wszyscy zaś Izraelici, którzy stali wokół nich, uciekli na ich krzyk, bo mówili: By i nas ziemia nie pochłonęła."
  tags: []
"Lb16,35":
  text: "Wyszedł też ogień od PANA i pochłonął tych dwustu pięćdziesięciu mężczyzn, którzy ofiarowali kadzidło."
  tags: []
"Lb16,36":
  text: "I PAN powiedział do Mojżesza:"
  tags: []
"Lb16,37":
  text: "Powiedz do Eleazara, syna kapłana Aarona, niech pozbiera kadzielnice z tego pogorzeliska, a ogień niech rozrzuci dalej. Są bowiem poświęcone."
  tags: []
"Lb16,38":
  text: "A kadzielnice tych, którzy zgrzeszyli przeciwko własnym duszom, rozbijcie na blachy na pokrycie ołtarza. Ofiarowali je bowiem przed PANEM, są więc poświęcone. Dlatego będą znakiem dla synów Izraela."
  tags: []
"Lb16,39":
  text: "Pozbierał więc kapłan Eleazar miedziane kadzielnice, w których ofiarowali ci, którzy spłonęli, i rozbito je na blachy na pokrycie ołtarza;"
  tags: []
"Lb16,40":
  text: "Na pamiątkę dla synów Izraela, aby żaden obcy, który nie jest z potomstwa Aarona, nie zbliżał się do składania kadzidła przed PANEM i żeby go nie spotkało to, co spotkało Koracha i jego gromady, jak PAN mu powiedział przez Mojżesza."
  tags: []
"Lb16,41":
  text: "A nazajutrz całe zgromadzenie synów Izraela szemrało przeciwko Mojżeszowi i Aaronowi: Wy spowodowaliście śmierć ludu PANA."
  tags: []
"Lb16,42":
  text: "I gdy zgromadzenie zbierało się przeciw Mojżeszowi i Aaronowi, spojrzeli w stronę Namiotu Zgromadzenia, a oto okrył go obłok i ukazała się chwała PANA."
  tags: []
"Lb16,43":
  text: "Wtedy Mojżesz z Aaronem przyszli przed Namiot Zgromadzenia."
  tags: []
"Lb16,44":
  text: "I PAN powiedział do Mojżesza:"
  tags: []
"Lb16,45":
  text: "Wyjdźcie spośród tego zgromadzenia, a zniszczę je w mgnieniu oka; i upadli na twarz."
  tags: []
"Lb16,46":
  text: "Potem Mojżesz powiedział do Aarona: Weź kadzielnicę, włóż w nią ogień z ołtarza, nałóż też kadzidła i pójdź szybko do zgromadzenia, i zrób przebłaganie za nich, bo już wyszedł gniew od PANA i już zaczęła się plaga."
  tags: []
"Lb16,47":
  text: "Aaron wziął więc kadzielnicę, jak mu rozkazał Mojżesz, i pobiegł w środek zgromadzenia, a oto już zaczęła się plaga wśród ludzi; nałożył kadzidła i dokonał przebłagania za lud."
  tags: []
"Lb16,48":
  text: "I Aaron stał między umarłymi i żywymi i plaga została powstrzymana."
  tags: []
"Lb16,49":
  text: "Tych, co umarli od tej plagi, było czternaście tysięcy siedemset, oprócz tych, którzy umarli w związku ze sprawą Koracha."
  tags: []
"Lb16,50":
  text: "Potem Aaron wrócił do Mojżesza przed wejście do Namiotu Zgromadzenia, a plaga została zatrzymana."
  tags: []
