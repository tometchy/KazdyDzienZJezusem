"Lb16,1": "Wtedy Korach, syn Ishara, syna Kehata, syna Lewiego, oraz Datan i Abiram, synowie Eliaba, i On, syn Peleta, synowie Rubena, wzięli ludzi;"
"Lb16,2": "I powstali przeciw Mojżeszowi, a wraz z nimi dwustu pięćdziesięciu mężczyzn spośród synów Izraela, naczelników zgromadzenia powołanych do rady, ludzi poważanych."
"Lb16,3": "Zebrali się oni przeciw Mojżeszowi i Aaronowi i powiedzieli do nich: Bierzecie zbyt dużo na siebie! Przecież całe to zgromadzenie, wszyscy oni są święci i wśród nich jest PAN. Dlaczego więc wynosicie się ponad zgromadzenie PANA?"
"Lb16,4": "Gdy Mojżesz to usłyszał, upadł na twarz;"
"Lb16,5": "I powiedział do Koracha i do całej jego gromady: Jutro rano PAN pokaże, kto jest jego, kto jest święty i może zbliżyć się do niego. Kogo bowiem wybrał, temu pozwoli zbliżyć się do siebie."
"Lb16,6": "Tak więc uczynicie: Weźcie sobie kadzielnice, ty, Korach i cała twoja gromada."
"Lb16,7": "I włóżcie w nie ogień, i jutro umieśćcie w nich kadzidło przed PANEM; a ten człowiek, którego PAN wybierze, będzie święty. Bierzecie zbyt dużo na siebie, synowie Lewiego."
"Lb16,8": "I powiedział Mojżesz do Koracha: Słuchajcie, proszę, synowie Lewiego;"
"Lb16,9": "Czy wam to mało, że Bóg Izraela oddzielił was od zgromadzenia Izraela, aby zbliżyć was do siebie, abyście pełnili służbę w przybytku PANA i abyście stali przed zgromadzeniem, i mu służyli?"
"Lb16,10": "I ciebie, a wraz z tobą wszystkich twoich braci, synów Lewiego, zbliżył do siebie, a wy jeszcze zabiegacie o kapłaństwo?"
"Lb16,11": "Dlatego ty i cała twoja gromada zbuntowaliście się przeciw PANU, bo kim jest Aaron, że szemracie przeciw niemu?"
"Lb16,12": "Wtedy Mojżesz kazał przywołać Datana i Abirama, synów Eliaba, lecz oni odpowiedzieli: Nie przyjdziemy."
"Lb16,13": "Nie dość, że nas wyprowadziłeś z ziemi opływającej mlekiem i miodem, aby nas uśmiercić na tej pustyni, to jeszcze chcesz obwołać się naszym władcą?"
"Lb16,14": "Ponadto nie wprowadziłeś nas do ziemi opływającej mlekiem i miodem ani nie dałeś nam w dziedzictwo pól i winnic. Czy chcesz tym mężczyznom wyłupić oczy? Nie przyjdziemy."
"Lb16,15": "Wtedy Mojżesz bardzo się rozgniewał i powiedział do PANA: Nie zważaj na ich ofiarę. Nie wziąłem od nich żadnego osła ani też nikogo z nich nie skrzywdziłem."
"Lb16,16": "Potem Mojżesz powiedział do Koracha: Ty i cała twoja gromada stawcie się jutro przed PANEM; ty, oni i Aaron:"
"Lb16,17": "Każdy z was niech weźmie swoją kadzielnicę i nałoży w nią kadzidła, i niech każdy przyniesie przed PANA swoją kadzielnicę, razem dwieście pięćdziesiąt kadzielnic, również ty i Aaron; każdy przyniesie swoją kadzielnicę."
"Lb16,18": "Każdy więc wziął swoją kadzielnicę, włożył w nią ogień, nałożył na niego kadzidła i stanęli u wejścia do Namiotu Zgromadzenia wraz z Mojżeszem i Aaronem."
"Lb16,19": "A Korach zebrał przeciwko nim całe zgromadzenie u wejścia do Namiotu Zgromadzenia i wtedy chwała PANA ukazała się całemu ludowi."
"Lb16,20": "I PAN powiedział do Mojżesza i Aarona:"
"Lb16,21": "Odłączcie się od tego zgromadzenia, abym mógł je w jednej chwili zniszczyć."
"Lb16,22": "Lecz oni upadli na twarz i powiedzieli: O Boże, Boże duchów wszelkiego ciała! Czy jeśli zgrzeszy jeden człowiek, będziesz się gniewał na całe zgromadzenie?"
"Lb16,23": "PAN powiedział do Mojżesza:"
"Lb16,24": "Przemów do zgromadzenia i powiedz im: Oddalcie się od namiotu Koracha, Datana i Abirama."
"Lb16,25": "Mojżesz wstał więc i podszedł do Datana i Abirama, a za nim poszli starsi Izraela."
"Lb16,26": "I powiedział do zgromadzenia: Oddalcie się, proszę, od namiotów tych bezbożnych ludzi i nie dotykajcie niczego, co do nich należy, abyście nie zginęli przez wszystkie ich grzechy."
"Lb16,27": "I oddalili się od namiotów Koracha, Datana i Abirama z każdej strony. Datan zaś i Abiram wyszli i stali u wejścia do swoich namiotów razem ze swoimi żonami, synami i małymi dziećmi."
"Lb16,28": "Wtedy Mojżesz powiedział: Po tym poznacie, że PAN mnie posłał, abym dokonał wszystkich tych dzieł, i że nic z własnej woli nie czynię."
"Lb16,29": "Jeśli ci ludzie umrą taką śmiercią jak wszyscy ludzie albo zostaną ukarani tak jak inni, to nie PAN mnie posłał."
"Lb16,30": "Ale jeśli PAN uczyni coś nowego i ziemia otworzy swoją paszczę, i pochłonie ich oraz wszystko, co do nich należy, i żywcem zstąpią do piekła, wtedy poznacie, że ci mężczyźni rozdrażnili PANA."
"Lb16,31": "Gdy tylko skończył wypowiadać wszystkie te słowa, ziemia rozstąpiła się pod nimi."
"Lb16,32": "A ziemia otworzyła swoją paszczę, i pochłonęła ich oraz ich domy i wszystkich ludzi, którzy byli przy Korachu, i cały ich dobytek."
"Lb16,33": "I zstąpili oni razem ze wszystkim, co mieli, żywcem do piekła, i ziemia ich okryła; tak zginęli spośród zgromadzenia."
"Lb16,34": "Wszyscy zaś Izraelici, którzy stali wokół nich, uciekli na ich krzyk, bo mówili: By i nas ziemia nie pochłonęła."
"Lb16,35": "Wyszedł też ogień od PANA i pochłonął tych dwustu pięćdziesięciu mężczyzn, którzy ofiarowali kadzidło."
"Lb16,36": "I PAN powiedział do Mojżesza:"
"Lb16,37": "Powiedz do Eleazara, syna kapłana Aarona, niech pozbiera kadzielnice z tego pogorzeliska, a ogień niech rozrzuci dalej. Są bowiem poświęcone."
"Lb16,38": "A kadzielnice tych, którzy zgrzeszyli przeciwko własnym duszom, rozbijcie na blachy na pokrycie ołtarza. Ofiarowali je bowiem przed PANEM, są więc poświęcone. Dlatego będą znakiem dla synów Izraela."
"Lb16,39": "Pozbierał więc kapłan Eleazar miedziane kadzielnice, w których ofiarowali ci, którzy spłonęli, i rozbito je na blachy na pokrycie ołtarza;"
"Lb16,40": "Na pamiątkę dla synów Izraela, aby żaden obcy, który nie jest z potomstwa Aarona, nie zbliżał się do składania kadzidła przed PANEM i żeby go nie spotkało to, co spotkało Koracha i jego gromady, jak PAN mu powiedział przez Mojżesza."
"Lb16,41": "A nazajutrz całe zgromadzenie synów Izraela szemrało przeciwko Mojżeszowi i Aaronowi: Wy spowodowaliście śmierć ludu PANA."
"Lb16,42": "I gdy zgromadzenie zbierało się przeciw Mojżeszowi i Aaronowi, spojrzeli w stronę Namiotu Zgromadzenia, a oto okrył go obłok i ukazała się chwała PANA."
"Lb16,43": "Wtedy Mojżesz z Aaronem przyszli przed Namiot Zgromadzenia."
"Lb16,44": "I PAN powiedział do Mojżesza:"
"Lb16,45": "Wyjdźcie spośród tego zgromadzenia, a zniszczę je w mgnieniu oka; i upadli na twarz."
"Lb16,46": "Potem Mojżesz powiedział do Aarona: Weź kadzielnicę, włóż w nią ogień z ołtarza, nałóż też kadzidła i pójdź szybko do zgromadzenia, i zrób przebłaganie za nich, bo już wyszedł gniew od PANA i już zaczęła się plaga."
"Lb16,47": "Aaron wziął więc kadzielnicę, jak mu rozkazał Mojżesz, i pobiegł w środek zgromadzenia, a oto już zaczęła się plaga wśród ludzi; nałożył kadzidła i dokonał przebłagania za lud."
"Lb16,48": "I Aaron stał między umarłymi i żywymi i plaga została powstrzymana."
"Lb16,49": "Tych, co umarli od tej plagi, było czternaście tysięcy siedemset, oprócz tych, którzy umarli w związku ze sprawą Koracha."
"Lb16,50": "Potem Aaron wrócił do Mojżesza przed wejście do Namiotu Zgromadzenia, a plaga została zatrzymana."
