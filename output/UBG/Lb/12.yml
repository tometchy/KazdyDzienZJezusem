"Lb12,1": "Wtedy Miriam i Aaron mówili źle przeciwko Mojżeszowi z powodu etiopskiej kobiety, którą pojął. Pojął bowiem za żonę Etiopkę;"
"Lb12,2": "I mówili: Czy PAN przemawiał tylko przez Mojżesza? Czy nie przemawiał też przez nas? A PAN to usłyszał."
"Lb12,3": "A Mojżesz był człowiekiem bardzo pokornym, najbardziej ze wszystkich ludzi, którzy żyli na ziemi."
"Lb12,4": "I nagle PAN powiedział do Mojżesza, Aarona i Miriam: Wyjdźcie we troje do Namiotu Zgromadzenia. I wyszli we troje."
"Lb12,5": "Wtedy PAN zstąpił w słupie obłoku, stanął u wejścia do namiotu i wezwał Aarona i Miriam; a oni przyszli oboje."
"Lb12,6": "I powiedział do nich: Słuchajcie teraz moich słów: Jeśli będzie wśród was prorok, ja, PAN, objawię mu się w widzeniu, będę mówił do niego we śnie."
"Lb12,7": "Lecz nie tak jest z moim sługą Mojżeszem, który jest wierny w całym moim domu."
"Lb12,8": "Z ust do ust mówię do niego, jawnie, a nie w zagadkach; on ogląda postać PANA. Dlaczego nie baliście się mówić źle przeciwko memu słudze Mojżeszowi?"
"Lb12,9": "I zapłonął gniew PANA przeciwko nim, i odszedł."
"Lb12,10": "Obłok także odstąpił znad namiotu i oto Miriam stała się trędowata, biała jak śnieg. Gdy Aaron spojrzał na Miriam, oto była trędowata."
"Lb12,11": "Wtedy Aaron powiedział do Mojżesza: Ach, mój panie! Proszę, nie poczytaj nam tego grzechu, że głupio postąpiliśmy i zgrzeszyliśmy."
"Lb12,12": "Niech ona nie będzie jak martwy płód, którego ciało jest już na wpół rozłożone, gdy wychodzi z łona swojej matki."
"Lb12,13": "Wtedy Mojżesz zawołał do PANA: Boże, proszę, uzdrów ją teraz."
"Lb12,14": "I PAN odpowiedział Mojżeszowi: Gdyby jej ojciec plunął jej w twarz, czyż nie musiałaby się wstydzić przez siedem dni? Niech przez siedem dni będzie wyłączona z obozu, a potem zostanie przyjęta."
"Lb12,15": "I Miriam została wyłączona z obozu na siedem dni. Lud jednak nie wyruszył, póki Miriam nie została przyjęta."
"Lb12,16": "Potem lud wyruszył z Chaserot i rozbił obóz na pustyni Paran."
