"Lb12,1":
  text: "Wtedy Miriam i Aaron mówili źle przeciwko Mojżeszowi z powodu etiopskiej kobiety, którą pojął. Pojął bowiem za żonę Etiopkę;"
  tags: []
"Lb12,2":
  text: "I mówili: Czy PAN przemawiał tylko przez Mojżesza? Czy nie przemawiał też przez nas? A PAN to usłyszał."
  tags: []
"Lb12,3":
  text: "A Mojżesz był człowiekiem bardzo pokornym, najbardziej ze wszystkich ludzi, którzy żyli na ziemi."
  tags: []
"Lb12,4":
  text: "I nagle PAN powiedział do Mojżesza, Aarona i Miriam: Wyjdźcie we troje do Namiotu Zgromadzenia. I wyszli we troje."
  tags: []
"Lb12,5":
  text: "Wtedy PAN zstąpił w słupie obłoku, stanął u wejścia do namiotu i wezwał Aarona i Miriam; a oni przyszli oboje."
  tags: []
"Lb12,6":
  text: "I powiedział do nich: Słuchajcie teraz moich słów: Jeśli będzie wśród was prorok, ja, PAN, objawię mu się w widzeniu, będę mówił do niego we śnie."
  tags: []
"Lb12,7":
  text: "Lecz nie tak jest z moim sługą Mojżeszem, który jest wierny w całym moim domu."
  tags: []
"Lb12,8":
  text: "Z ust do ust mówię do niego, jawnie, a nie w zagadkach; on ogląda postać PANA. Dlaczego nie baliście się mówić źle przeciwko memu słudze Mojżeszowi?"
  tags: []
"Lb12,9":
  text: "I zapłonął gniew PANA przeciwko nim, i odszedł."
  tags: []
"Lb12,10":
  text: "Obłok także odstąpił znad namiotu i oto Miriam stała się trędowata, biała jak śnieg. Gdy Aaron spojrzał na Miriam, oto była trędowata."
  tags: []
"Lb12,11":
  text: "Wtedy Aaron powiedział do Mojżesza: Ach, mój panie! Proszę, nie poczytaj nam tego grzechu, że głupio postąpiliśmy i zgrzeszyliśmy."
  tags: []
"Lb12,12":
  text: "Niech ona nie będzie jak martwy płód, którego ciało jest już na wpół rozłożone, gdy wychodzi z łona swojej matki."
  tags: []
"Lb12,13":
  text: "Wtedy Mojżesz zawołał do PANA: Boże, proszę, uzdrów ją teraz."
  tags: []
"Lb12,14":
  text: "I PAN odpowiedział Mojżeszowi: Gdyby jej ojciec plunął jej w twarz, czyż nie musiałaby się wstydzić przez siedem dni? Niech przez siedem dni będzie wyłączona z obozu, a potem zostanie przyjęta."
  tags: []
"Lb12,15":
  text: "I Miriam została wyłączona z obozu na siedem dni. Lud jednak nie wyruszył, póki Miriam nie została przyjęta."
  tags: []
"Lb12,16":
  text: "Potem lud wyruszył z Chaserot i rozbił obóz na pustyni Paran."
  tags: []
