"Lb8,1":
  text: "I PAN przemówił do Mojżesza tymi słowy:"
  tags: []
"Lb8,2":
  text: "Powiedz Aaronowi: Gdy zapalisz lampy, siedem lamp ma rzucać światło na przednią stronę świecznika."
  tags: []
"Lb8,3":
  text: "I Aaron tak uczynił. Z przedniej strony świecznika zapalił lampy, tak jak PAN rozkazał Mojżeszowi."
  tags: []
"Lb8,4":
  text: "Świecznik był wykuty ze złota, od trzonu aż po kwiaty był kuty. Zgodnie ze wzorem, który PAN pokazał Mojżeszowi, tak zrobił świecznik."
  tags: []
"Lb8,5":
  text: "Potem PAN powiedział do Mojżesza:"
  tags: []
"Lb8,6":
  text: "Weź Lewitów spośród synów Izraela i oczyść ich."
  tags: []
"Lb8,7":
  text: "I tak postąpisz z nimi, aby ich oczyścić: Pokrop ich wodą oczyszczenia, a oni niech ogolą całe swoje ciało i wypiorą swoje szaty, wtedy będą czyści."
  tags: []
"Lb8,8":
  text: "Następnie niech wezmą młodego cielca wraz z jego ofiarą pokarmową z mąki pszennej zmieszanej z oliwą, drugiego zaś młodego cielca weźmiesz na ofiarę za grzech."
  tags: []
"Lb8,9":
  text: "I przyprowadzisz Lewitów przed Namiot Zgromadzenia, i zbierzesz całe zgromadzenie synów Izraela;"
  tags: []
"Lb8,10":
  text: "I przyprowadzisz Lewitów przed PANA, a synowie Izraela położą na nich swoje ręce."
  tags: []
"Lb8,11":
  text: "Wtedy Aaron przedstawi Lewitów przed PANEM jako ofiarę od synów Izraela, aby pełnili służbę dla PANA."
  tags: []
"Lb8,12":
  text: "Lewici zaś położą swoje ręce na głowy cielców. Ty złożysz jednego na ofiarę za grzech, a drugiego na ofiarę całopalną dla PANA, aby dokonać przebłagania za Lewitów."
  tags: []
"Lb8,13":
  text: "Następnie postawisz Lewitów przed Aaronem i przed jego synami i przedstawisz ich jako ofiarę dla PANA."
  tags: []
"Lb8,14":
  text: "W ten sposób oddzielisz Lewitów spośród synów Izraela i Lewici będą należeć do mnie."
  tags: []
"Lb8,15":
  text: "Potem Lewici wejdą, aby służyć w Namiocie Zgromadzenia, gdy ich oczyścisz i przedstawisz jako ofiarę."
  tags: []
"Lb8,16":
  text: "Oni bowiem są mi oddani spośród synów Izraela; w miejsce każdego, kto otwiera łono, w miejsce wszystkich pierworodnych synów Izraela wziąłem ich sobie."
  tags: []
"Lb8,17":
  text: "Gdyż do mnie należy wszystko, co pierworodne wśród synów Izraela, zarówno z ludzi, jak i ze zwierząt. Poświęciłem ich sobie w dniu, w którym zabiłem wszystko, co pierworodne w ziemi Egiptu."
  tags: []
"Lb8,18":
  text: "Wziąłem Lewitów w zamian za wszystkich pierworodnych wśród synów Izraela."
  tags: []
"Lb8,19":
  text: "I dałem Lewitów jako dar Aaronowi i jego synom spośród synów Izraela, aby pełnili służbę synów Izraela w Namiocie Zgromadzenia i dokonywali przebłagania za nich, aby nie spadła na synów Izraela żadna kara, gdy będą zbliżać się do świątyni."
  tags: []
"Lb8,20":
  text: "Wtedy Mojżesz i Aaron oraz całe zgromadzenie synów Izraela postąpili z Lewitami tak, jak PAN rozkazał Mojżeszowi o Lewitach; tak postąpili z nimi synowie Izraela."
  tags: []
"Lb8,21":
  text: "Lewici oczyścili się i wyprali swoje szaty, a Aaron przedstawił ich jako ofiarę przed PANEM i dokonał przebłagania za nich, aby ich oczyścić."
  tags: []
"Lb8,22":
  text: "Potem Lewici weszli, aby pełnić swoją służbę w Namiocie Zgromadzenia przed Aaronem i przed jego synami. Jak PAN rozkazał Mojżeszowi odnośnie do Lewitów, tak z nimi postąpili."
  tags: []
"Lb8,23":
  text: "I PAN powiedział do Mojżesza:"
  tags: []
"Lb8,24":
  text: "Oto co dotyczy Lewitów: Od dwudziestego piątego roku życia wzwyż przystąpią, by pełnić służbę w Namiocie Zgromadzenia."
  tags: []
"Lb8,25":
  text: "A od pięćdziesiątego roku życia przestaną pełnić służbę i więcej nie będą służyć."
  tags: []
"Lb8,26":
  text: "Będą jednak usługiwać swym braciom w Namiocie Zgromadzenia w pełnieniu straży, lecz samej służby nie będą pełnić. Tak postąpisz z Lewitami w sprawie ich służby."
  tags: []
