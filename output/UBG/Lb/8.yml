"Lb8,1": "I PAN przemówił do Mojżesza tymi słowy:"
"Lb8,2": "Powiedz Aaronowi: Gdy zapalisz lampy, siedem lamp ma rzucać światło na przednią stronę świecznika."
"Lb8,3": "I Aaron tak uczynił. Z przedniej strony świecznika zapalił lampy, tak jak PAN rozkazał Mojżeszowi."
"Lb8,4": "Świecznik był wykuty ze złota, od trzonu aż po kwiaty był kuty. Zgodnie ze wzorem, który PAN pokazał Mojżeszowi, tak zrobił świecznik."
"Lb8,5": "Potem PAN powiedział do Mojżesza:"
"Lb8,6": "Weź Lewitów spośród synów Izraela i oczyść ich."
"Lb8,7": "I tak postąpisz z nimi, aby ich oczyścić: Pokrop ich wodą oczyszczenia, a oni niech ogolą całe swoje ciało i wypiorą swoje szaty, wtedy będą czyści."
"Lb8,8": "Następnie niech wezmą młodego cielca wraz z jego ofiarą pokarmową z mąki pszennej zmieszanej z oliwą, drugiego zaś młodego cielca weźmiesz na ofiarę za grzech."
"Lb8,9": "I przyprowadzisz Lewitów przed Namiot Zgromadzenia, i zbierzesz całe zgromadzenie synów Izraela;"
"Lb8,10": "I przyprowadzisz Lewitów przed PANA, a synowie Izraela położą na nich swoje ręce."
"Lb8,11": "Wtedy Aaron przedstawi Lewitów przed PANEM jako ofiarę od synów Izraela, aby pełnili służbę dla PANA."
"Lb8,12": "Lewici zaś położą swoje ręce na głowy cielców. Ty złożysz jednego na ofiarę za grzech, a drugiego na ofiarę całopalną dla PANA, aby dokonać przebłagania za Lewitów."
"Lb8,13": "Następnie postawisz Lewitów przed Aaronem i przed jego synami i przedstawisz ich jako ofiarę dla PANA."
"Lb8,14": "W ten sposób oddzielisz Lewitów spośród synów Izraela i Lewici będą należeć do mnie."
"Lb8,15": "Potem Lewici wejdą, aby służyć w Namiocie Zgromadzenia, gdy ich oczyścisz i przedstawisz jako ofiarę."
"Lb8,16": "Oni bowiem są mi oddani spośród synów Izraela; w miejsce każdego, kto otwiera łono, w miejsce wszystkich pierworodnych synów Izraela wziąłem ich sobie."
"Lb8,17": "Gdyż do mnie należy wszystko, co pierworodne wśród synów Izraela, zarówno z ludzi, jak i ze zwierząt. Poświęciłem ich sobie w dniu, w którym zabiłem wszystko, co pierworodne w ziemi Egiptu."
"Lb8,18": "Wziąłem Lewitów w zamian za wszystkich pierworodnych wśród synów Izraela."
"Lb8,19": "I dałem Lewitów jako dar Aaronowi i jego synom spośród synów Izraela, aby pełnili służbę synów Izraela w Namiocie Zgromadzenia i dokonywali przebłagania za nich, aby nie spadła na synów Izraela żadna kara, gdy będą zbliżać się do świątyni."
"Lb8,20": "Wtedy Mojżesz i Aaron oraz całe zgromadzenie synów Izraela postąpili z Lewitami tak, jak PAN rozkazał Mojżeszowi o Lewitach; tak postąpili z nimi synowie Izraela."
"Lb8,21": "Lewici oczyścili się i wyprali swoje szaty, a Aaron przedstawił ich jako ofiarę przed PANEM i dokonał przebłagania za nich, aby ich oczyścić."
"Lb8,22": "Potem Lewici weszli, aby pełnić swoją służbę w Namiocie Zgromadzenia przed Aaronem i przed jego synami. Jak PAN rozkazał Mojżeszowi odnośnie do Lewitów, tak z nimi postąpili."
"Lb8,23": "I PAN powiedział do Mojżesza:"
"Lb8,24": "Oto co dotyczy Lewitów: Od dwudziestego piątego roku życia wzwyż przystąpią, by pełnić służbę w Namiocie Zgromadzenia."
"Lb8,25": "A od pięćdziesiątego roku życia przestaną pełnić służbę i więcej nie będą służyć."
"Lb8,26": "Będą jednak usługiwać swym braciom w Namiocie Zgromadzenia w pełnieniu straży, lecz samej służby nie będą pełnić. Tak postąpisz z Lewitami w sprawie ich służby."
