"Lb32,1":
  text: "A synowie Rubena i synowie Gada mieli bardzo liczne stada. Gdy zobaczyli ziemię Jazer i ziemię Gilead, że jest to miejsce odpowiednie dla bydła;"
  tags: []
"Lb32,2":
  text: "Przyszli ci synowie Gada i synowie Rubena i powiedzieli do Mojżesza, kapłana Eleazara oraz do naczelników zgromadzenia:"
  tags: []
"Lb32,3":
  text: "Atarot, Dibon, Jazer, Nimra, Cheszbon, Eleale, Sebam, Nebo i Beon;"
  tags: []
"Lb32,4":
  text: "Ziemia, którą PAN podbił przed zgromadzeniem Izraela, jest ziemią odpowiednią dla bydła, a twoi słudzy mają liczne bydło."
  tags: []
"Lb32,5":
  text: "Mówili dalej: Jeśli znaleźliśmy łaskę w twoich oczach, niech ta ziemia będzie dana twoim sługom w posiadanie, a nie przeprowadzaj nas za Jordan."
  tags: []
"Lb32,6":
  text: "Wtedy Mojżesz odpowiedział synom Gada i synom Rubena: Czy wasi bracia pójdą na wojnę, a wy tu będziecie siedzieć?"
  tags: []
"Lb32,7":
  text: "Dlaczego zniechęcacie serca synów Izraela, aby nie przeprawili się do ziemi, którą dał im PAN?"
  tags: []
"Lb32,8":
  text: "Tak właśnie postępowali wasi ojcowie, gdy ich posłałem z Kadesz-Barnea, aby wyszpiegowali tę ziemię."
  tags: []
"Lb32,9":
  text: "Kiedy dotarli aż do doliny Eszkol i zobaczyli ziemię, zniechęcili serca synów Izraela, aby nie weszli do ziemi, którą PAN im dał;"
  tags: []
"Lb32,10":
  text: "Dlatego w tym dniu zapłonął gniew PANA i przysiągł:"
  tags: []
"Lb32,11":
  text: "Na pewno nikt z tych ludzi, którzy wyszli z Egiptu, od dwudziestego roku życia wzwyż, nie ujrzy tej ziemi, którą przysiągłem Abrahamowi, Izaakowi i Jakubowi, ponieważ nie szli za mną w pełni;"
  tags: []
"Lb32,12":
  text: "Oprócz Kaleba, syna Jefunnego, Kenizyty, i Jozuego, syna Nuna, ponieważ oni w pełni szli za PANEM."
  tags: []
"Lb32,13":
  text: "I zapłonął gniew PANA na Izraela, i sprawił, że tułali się po pustyni przez czterdzieści lat, aż wyginęło całe pokolenie, które czyniło źle w oczach PANA."
  tags: []
"Lb32,14":
  text: "A oto powstaliście w miejsce waszych ojców jako plemię grzesznych ludzi, aby jeszcze bardziej wzmóc zapalczywość gniewu PANA przeciw Izraelowi."
  tags: []
"Lb32,15":
  text: "Jeśli bowiem odwrócicie się od kroczenia za nim, wtedy on znowu pozostawi ich na tej pustyni, a w ten sposób zgubicie cały ten lud."
  tags: []
"Lb32,16":
  text: "Wtedy zbliżyli się do niego i powiedzieli: Tu zbudujemy zagrody dla naszego bydła i miasta dla naszych dzieci;"
  tags: []
"Lb32,17":
  text: "My zaś sami zbrojnie i ochoczo pójdziemy przed synami Izraela, aż zaprowadzimy ich na ich miejsce, a nasze dzieci będą mieszkały w miastach obwarowanych ze względu na mieszkańców tej ziemi."
  tags: []
"Lb32,18":
  text: "Nie wrócimy do swoich domów, dopóki każdy spośród synów Izraela nie otrzyma swojego dziedzictwa;"
  tags: []
"Lb32,19":
  text: "Nie weźmiemy dziedzictwa razem z nimi po tamtej stronie Jordanu i dalej, ponieważ nasze dziedzictwo przypadło nam po tej stronie Jordanu, po stronie wschodniej."
  tags: []
"Lb32,20":
  text: "Mojżesz powiedział im: Jeśli uczynicie to, co powiedzieliście, i uzbrojeni pójdziecie przed PANEM na wojnę;"
  tags: []
"Lb32,21":
  text: "I każdy z was zbrojnie przejdzie Jordan przed PANEM, aż wypędzi swoich wrogów przed sobą;"
  tags: []
"Lb32,22":
  text: "I ziemia zostanie podbita przed PANEM, a potem wrócicie, to będziecie niewinni przed PANEM i przed Izraelem; a ta ziemia będzie waszą posiadłością przed PANEM."
  tags: []
"Lb32,23":
  text: "Lecz jeśli nie uczynicie tego, oto zgrzeszycie przeciw PANU, a wiedzcie, że wasz grzech was znajdzie."
  tags: []
"Lb32,24":
  text: "Budujcie więc miasta dla waszych dzieci i zagrody dla waszych owiec; uczyńcie to, co wyszło z waszych ust."
  tags: []
"Lb32,25":
  text: "Wtedy synowie Gada i synowie Rubena powiedzieli do Mojżesza: Twoi słudzy uczynią tak, jak nasz pan rozkazuje."
  tags: []
"Lb32,26":
  text: "Nasze dzieci, nasze żony, nasze trzody i całe nasze bydło pozostaną tu, w miastach Gileadu;"
  tags: []
"Lb32,27":
  text: "Twoi słudzy natomiast, wszyscy uzbrojeni na wojnę, pójdą przed PANEM, jak mówi nasz pan."
  tags: []
"Lb32,28":
  text: "I Mojżesz wydał rozkaz o nich kapłanowi Eleazarowi, Jozuemu, synowi Nuna, i naczelnikom spośród ojców pokoleń synów Izraela;"
  tags: []
"Lb32,29":
  text: "Mojżesz powiedział im: Jeśli synowie Gada i synowie Rubena przejdą z wami za Jordan, wszyscy uzbrojeni do wojny przed PANEM, a ziemia zostanie podbita przed wami, wtedy dacie im ziemię Gilead w posiadanie;"
  tags: []
"Lb32,30":
  text: "Lecz jeśli uzbrojeni nie przejdą z wami, wtedy otrzymają dziedzictwo pośród was w ziemi Kanaan."
  tags: []
"Lb32,31":
  text: "Synowie Gada i synowie Rubena odpowiedzieli: Uczynimy to, co PAN powiedział do twoich sług;"
  tags: []
"Lb32,32":
  text: "Pójdziemy uzbrojeni przed PANEM do ziemi Kanaan, a posiadłość naszego dziedzictwa zostanie po tej stronie Jordanu."
  tags: []
"Lb32,33":
  text: "Mojżesz dał wtedy synom Gada, synom Rubena i połowie pokolenia Manassesa, syna Józefa, królestwo Sichona, króla Amorytów, i królestwo Oga, króla Baszanu, ziemię z jej miastami i granicami, a także miasta tej ziemi dokoła."
  tags: []
"Lb32,34":
  text: "I synowie Gada odbudowali Dibon, Atarot i Aroer;"
  tags: []
"Lb32,35":
  text: "Atrot, Szofan, Jazer i Jogboha;"
  tags: []
"Lb32,36":
  text: "Bet-Nimra, Bet-Haran, miasta warowne i zagrody dla stad."
  tags: []
"Lb32,37":
  text: "Synowie Rubena zaś odbudowali Cheszbon, Eleale i Kiriataim;"
  tags: []
"Lb32,38":
  text: "Nebo, Baal-Meon, ich nazwy zmieniono, także Sybma; a miasta, które zbudowali, nazwali od swoich imion."
  tags: []
"Lb32,39":
  text: "Synowie Makira, syna Manassesa, poszli do Gileadu, zdobyli go i wypędzili Amorytów, którzy tam mieszkali."
  tags: []
"Lb32,40":
  text: "I Mojżesz dał Gilead Makirowi, synowi Manassesa, a ten w nim zamieszkał."
  tags: []
"Lb32,41":
  text: "Potem Jair, syn Manassesa, poszedł i zdobył ich wsie, które nazwał Chawot-Jair."
  tags: []
"Lb32,42":
  text: "Także i Nobe poszedł i zdobył Kenat z jego wioskami, które nazwał Nobe, od swojego imienia."
  tags: []
