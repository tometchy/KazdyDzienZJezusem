"Lb24,1":
  text: "Gdy Balaam zauważył, że PAN upodobał sobie błogosławić Izraela, nie poszedł jak przedtem szukać wróżby, lecz zwrócił swoją twarz ku pustyni."
  tags: []
"Lb24,2":
  text: "I Balaam podniósł swoje oczy, i zobaczył Izraela obozującego według swoich pokoleń. Wtedy Duch Boży spoczął na nim."
  tags: []
"Lb24,3":
  text: "I rozpoczął swoją przypowieść tymi słowy: Wypowiedź Balaama, syna Beora, wypowiedź człowieka, który ma otwarte oczy;"
  tags: []
"Lb24,4":
  text: "Wypowiedź tego, który słyszał słowa Boga, który miał widzenie Wszechmocnego, a padając, miał otwarte oczy:"
  tags: []
"Lb24,5":
  text: "Jak piękne są twoje namioty, Jakubie, twoje przybytki, Izraelu!"
  tags: []
"Lb24,6":
  text: "Rozciągnęły się jak doliny, jak ogrody przy rzece, jak aloesy, które PAN zasadził, jak cedry nad wodami."
  tags: []
"Lb24,7":
  text: "Popłynie woda z jego wiadra, jego nasienie będzie w wielu wodach, jego król przewyższy Agaga i jego królestwo będzie wyniesione."
  tags: []
"Lb24,8":
  text: "Bóg wyprowadził go z Egiptu, jego moc jest jak u jednorożca; pożre wrogie sobie narody, pokruszy ich kości i przeszyje je swymi strzałami."
  tags: []
"Lb24,9":
  text: "Położył się, leży jak lew, jak silny lew: któż go obudzi? Błogosławiony ten, kto cię błogosławi, a przeklęty ten, kto cię przeklina."
  tags: []
"Lb24,10":
  text: "Wtedy zapłonął gniew Balaka na Balaama i klasnął w dłonie. I Balak powiedział do Balaama: Wezwałem cię, abyś przeklinał moich wrogów, a oto już trzy razy ich błogosławiłeś."
  tags: []
"Lb24,11":
  text: "Uciekaj więc teraz do siebie. Powiedziałem, że wielce cię uczczę, lecz oto PAN pozbawił cię tej czci."
  tags: []
"Lb24,12":
  text: "I Balaam powiedział do Balaka: Czy i twoim posłom, których do mnie wysłałeś, nie powiedziałem:"
  tags: []
"Lb24,13":
  text: "Choćby Balak dał mi swój dom pełen srebra i złota, nie będę mógł przekroczyć słowa PANA, bym sam z siebie uczynił coś dobrego lub złego; co PAN mi powie, to będę mówił."
  tags: []
"Lb24,14":
  text: "Teraz idę do mego ludu, ale chodź i oznajmię ci, co ten lud uczyni twemu ludowi w przyszłości."
  tags: []
"Lb24,15":
  text: "I rozpoczął swoją przypowieść tymi słowy: Wypowiedź Balaama, syna Beora, wypowiedź człowieka, który ma otwarte oczy;"
  tags: []
"Lb24,16":
  text: "Wypowiedź tego, który słyszał słowa Boga, który ma wiedzę o Najwyższym, który miał widzenie Wszechmocnego, a padając, miał otwarte oczy:"
  tags: []
"Lb24,17":
  text: "Ujrzę go, ale nie teraz; zobaczę go, ale nie z bliska; gwiazda wzejdzie z Jakuba, berło powstanie z Izraela i pobije książąt Moabu oraz wytraci wszystkich synów Seta."
  tags: []
"Lb24,18":
  text: "Edom stanie się posiadłością, Seir też stanie się posiadłością swoich wrogów, a Izrael będzie sobie poczynał mężnie."
  tags: []
"Lb24,19":
  text: "Z Jakuba powstanie władca i wyniszczy resztki miasta."
  tags: []
"Lb24,20":
  text: "A gdy spojrzał na Amaleka, rozpoczął swą przypowieść tymi słowy: Amalek był pierwszym z narodów, lecz jego końcem będzie wieczna zguba."
  tags: []
"Lb24,21":
  text: "Potem spojrzał na Kenitów i rozpoczął swą przypowieść tymi słowy: Twoje mieszkanie jest mocne, a swoje gniazdo założyłeś na skale;"
  tags: []
"Lb24,22":
  text: "A jednak Kenita będzie spustoszony, aż Aszszur weźmie cię w niewolę."
  tags: []
"Lb24,23":
  text: "Znowu rozpoczął swą przypowieść tymi słowy: Ach! Któż żyw zostanie, gdy Bóg to uczyni?"
  tags: []
"Lb24,24":
  text: "Przypłyną bowiem okręty od wybrzeża Kittim i pognębią Aszszur, pognębią też Eber; lecz i oni sami zginą na zawsze."
  tags: []
"Lb24,25":
  text: "Potem Balaam wstał i odszedł, i wrócił do siebie. Balak także poszedł swoją drogą."
  tags: []
