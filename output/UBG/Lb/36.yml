"Lb36,1":
  text: "Wtedy przystąpili naczelnicy spośród ojców synów Gileada, syna Makira, syna Manassesa, z domów Józefa, i mówili przed Mojżeszem i przed książętami, naczelnikami ojców synów Izraela:"
  tags: []
"Lb36,2":
  text: "PAN nakazał memu panu rozdzielić ziemię w dziedzictwo synom Izraela przez losowanie; mojemu panu rozkazano też przez PANA dać dziedzictwo naszego brata Selofchada jego córkom."
  tags: []
"Lb36,3":
  text: "Jeśli więc któryś z synów innego pokolenia synów Izraela pojmie je za żony, to ich dziedzictwo zostanie odjęte od dziedzictwa naszych ojców i przyłączone do dziedzictwa pokolenia, do którego będą należeć; w ten sposób nasze dziedzictwo się zmniejszy."
  tags: []
"Lb36,4":
  text: "A gdy nadejdzie rok jubileuszowy dla synów Izraela, wtedy ich dziedzictwo zostanie przyłączone do dziedzictwa pokolenia, do którego będą należeć; i tak ich dziedzictwo zostanie odjęte od dziedzictwa pokolenia naszych ojców."
  tags: []
"Lb36,5":
  text: "Wtedy Mojżesz rozkazał synom Izraela zgodnie ze słowem PANA: Słusznie mówi pokolenie synów Józefa."
  tags: []
"Lb36,6":
  text: "Oto co PAN rozkazał w sprawie córek Selofchada: Niech wychodzą za mąż, za kogo chcą, ale mogą wyjść tylko za kogoś z domu pokolenia swoich ojców;"
  tags: []
"Lb36,7":
  text: "Aby dziedzictwo synów Izraela nie było przenoszone z jednego pokolenia na drugie pokolenie. Każdy bowiem z synów Izraela ma pozostać przy dziedzictwie pokolenia swoich ojców."
  tags: []
"Lb36,8":
  text: "I każda córka, która posiada dziedzictwo w jakimś pokoleniu synów Izraela, wyjdzie za mąż za kogoś z domu pokolenia swego ojca, aby synowie Izraela dziedziczyli, każdy dziedzictwo swoich ojców."
  tags: []
"Lb36,9":
  text: "Dziedzictwo bowiem nie będzie przenoszone z jednego pokolenia na drugie pokolenie, lecz każde z pokoleń synów Izraela ma pozostać przy swoim dziedzictwie."
  tags: []
"Lb36,10":
  text: "Jak PAN rozkazał Mojżeszowi, tak uczyniły córki Selofchada."
  tags: []
"Lb36,11":
  text: "Bo Machla, Tirsa, Chogla, Milka i Noa, córki Selofchada, wyszły za mąż za synów swoich stryjów."
  tags: []
"Lb36,12":
  text: "Wyszły za mąż w rodzinach synów Manassesa, syna Józefa; w ten sposób ich dziedzictwo pozostało przy pokoleniu domu ich ojca."
  tags: []
"Lb36,13":
  text: "To są przykazania i prawa, które PAN nakazał synom Izraela przez Mojżesza na równinach Moabu, nad Jordanem, naprzeciw Jerycha."
  tags: []
