"Lb18,1":
  text: "Potem PAN powiedział do Aarona: Ty, twoi synowie i dom twego ojca z tobą, odpowiecie za nieprawość świątyni. Ty i twoi synowie z tobą również odpowiecie za nieprawość waszego kapłaństwa."
  tags: []
"Lb18,2":
  text: "A twoim braciom z pokolenia Lewiego, z rodu twego ojca, pozwól do siebie przychodzić, aby dołączyli do ciebie i usługiwali tobie; ty zaś i twoi synowie z tobą będziecie pełnić służbę przed Namiotem Świadectwa."
  tags: []
"Lb18,3":
  text: "Oni będą przestrzegać twego nakazu i pełnić straż nad całym namiotem. Nie mogą jednak zbliżać się do sprzętów świątyni i do ołtarza, żeby nie pomarli ani oni, ani wy."
  tags: []
"Lb18,4":
  text: "Przyłączą się do ciebie i będą pełnić straż przy Namiocie Zgromadzenia, przy każdej służbie namiotu. Lecz żaden obcy niech się do was nie zbliża."
  tags: []
"Lb18,5":
  text: "Wy będziecie pełnić straż w świątyni i straż przy ołtarzu, aby już nie spadł gniew na synów Izraela."
  tags: []
"Lb18,6":
  text: "Oto wziąłem waszych braci Lewitów spośród synów Izraela. Oni są wam oddani jako dar dla PANA, aby pełnili służbę w Namiocie Zgromadzenia."
  tags: []
"Lb18,7":
  text: "Ty zaś i twoi synowie z tobą będziecie strzec waszego kapłaństwa przy każdej służbie ołtarza i poza zasłoną, i będziecie służyć. Dałem wam urząd waszego kapłaństwa jako dar; obcy, który się zbliży, poniesie śmierć."
  tags: []
"Lb18,8":
  text: "PAN mówił dalej do Aarona: Oto dałem tobie pod straż moje ofiary wzniesione ze wszystkich poświęconych rzeczy synów Izraela. Z powodu namaszczenia dałem je tobie i twoim synom prawem wieczystym."
  tags: []
"Lb18,9":
  text: "To będzie należeć do ciebie z rzeczy najświętszych, które nie zostaną spalone: każda ich ofiara, każda ich ofiara pokarmowa, każda ich ofiara za grzech i każda ich ofiara za przewinienie, które będą mi składać, będą to rzeczy najświętsze dla ciebie i twoich synów."
  tags: []
"Lb18,10":
  text: "W miejscu najświętszym będziesz to jeść; wszyscy mężczyźni będą z tego jedli. Będzie to dla ciebie rzeczą świętą."
  tags: []
"Lb18,11":
  text: "To też będzie dla ciebie: ofiara wzniesienia ich darów ze wszystkimi ofiarami kołysania synów Izraela. Daję je tobie, twoim synom i twoim córkom z tobą prawem wieczystym. Każdy czysty w twoim domu będzie je spożywać."
  tags: []
"Lb18,12":
  text: "Wszystko, co najlepsze z oliwy, i wszystko, co najlepsze z wina, oraz zboże, ich pierwociny, które ofiarują PANU, dałem tobie."
  tags: []
"Lb18,13":
  text: "Pierwociny ze wszystkich rzeczy znajdujących się w ich ziemi, które przyniosą PANU, będą twoje. Każdy czysty w twoim domu będzie je spożywać."
  tags: []
"Lb18,14":
  text: "Wszystko, co jest poświęcone w Izraelu, będzie twoje."
  tags: []
"Lb18,15":
  text: "Wszystko, co otwiera łono wszelkiego ciała, które przynoszą PANU, zarówno z ludzi, jak i z bydła, będzie twoje; lecz pierworodnego z ludzi wykupisz, także pierworodne z nieczystych zwierząt wykupisz."
  tags: []
"Lb18,16":
  text: "A wykup tego, który ma jeden miesiąc, dasz według twego oszacowania pięć syklów srebra według sykla świątynnego, który wynosi dwadzieścia ger."
  tags: []
"Lb18,17":
  text: "Ale pierworodnego z krowy, pierworodnego z owcy lub pierworodnego z kozy nie wykupisz; są one święte. Ich krew wylejesz na ołtarz, a ich tłuszcz spalisz jako ofiarę spaloną, jako miłą woń dla PANA."
  tags: []
"Lb18,18":
  text: "Ale ich mięso będzie twoje, podobnie jak mostek wzniesienia i prawa łopatka są twoje."
  tags: []
"Lb18,19":
  text: "Wszystkie ofiary wzniesienia z poświęconych rzeczy, które będą przynosić PANU synowie Izraela, daję tobie, twoim synom i twoim córkom z tobą prawem wieczystym. Jest to wieczyste przymierze soli przed PANEM, dla ciebie i twojego potomstwa wraz z tobą."
  tags: []
"Lb18,20":
  text: "Potem PAN powiedział do Aarona: Nie będziesz miał dziedzictwa w ich ziemi i nie będziesz miał żadnego działu wśród nich. Ja jestem twoim działem i twoim dziedzictwem pośród synów Izraela."
  tags: []
"Lb18,21":
  text: "Oto zaś synom Lewiego dałem jako dziedzictwo wszystkie dziesięciny w Izraelu za ich służbę, którą pełnią w Namiocie Zgromadzenia."
  tags: []
"Lb18,22":
  text: "A niech synowie Izraela nie zbliżają się już do Namiotu Zgromadzenia, aby nie obciążyli się grzechem i nie umarli;"
  tags: []
"Lb18,23":
  text: "Ale sami Lewici będą pełnić służbę w Namiocie Zgromadzenia i sami poniosą karę za swoją nieprawość. Będzie to ustawa wieczysta przez wszystkie wasze pokolenia, że Lewici nie będą mieli dziedzictwa pośród synów Izraela."
  tags: []
"Lb18,24":
  text: "Dałem bowiem Lewitom w dziedzictwo dziesięciny synów Izraela, które przynoszą PANU jako ofiarę wzniesienia. Dlatego powiedziałem o nich: Nie będą mieli dziedzictwa pośród synów Izraela."
  tags: []
"Lb18,25":
  text: "Potem PAN powiedział do Mojżesza:"
  tags: []
"Lb18,26":
  text: "Przemów do Lewitów i powiedz im: Gdy przyjmujecie od synów Izraela dziesięciny, które dałem wam od nich jako wasze dziedzictwo, wtedy złożycie PANU jako ofiarę wzniesienia dziesiątą część z dziesięciny."
  tags: []
"Lb18,27":
  text: "A wasza ofiara wzniesienia będzie wam poczytana za zboże z klepiska i za obfitość z tłoczni winnej."
  tags: []
"Lb18,28":
  text: "W ten sposób też i wy macie składać PANU ofiarę wzniesienia ze wszystkich waszych dziesięcin, które przyjmujecie od synów Izraela; kapłanowi Aaronowi oddacie z nich ofiarę wzniesienia należną PANU."
  tags: []
"Lb18,29":
  text: "Ze wszystkich waszych darów będziecie składać PANU wszelką ofiarę wzniesienia; ze wszystkiego, co najlepsze, ofiarujcie jego poświęconą część."
  tags: []
"Lb18,30":
  text: "Powiesz im też: Gdy będziecie oddawać z tego, co najlepsze, wtedy będzie to poczytane Lewitom jako plon z klepiska i jako plon z tłoczni winnej."
  tags: []
"Lb18,31":
  text: "I będziecie to jeść na każdym miejscu, wy i wasi domownicy, ponieważ to jest wasza zapłata za waszą służbę w Namiocie Zgromadzenia;"
  tags: []
"Lb18,32":
  text: "I nie obciążycie się grzechem za to, gdy będziecie składać, co najlepsze z tego, i nie splugawicie rzeczy poświęconych synów Izraela, i nie umrzecie."
  tags: []
