"Lb3,1": "To są dzieje rodu Aarona i Mojżesza w dniu, w którym PAN rozmawiał z Mojżeszem na górze Synaj."
"Lb3,2": "A to są imiona synów Aarona: pierworodny Nadab, potem Abihu, Eleazar i Itamar."
"Lb3,3": "To są imiona synów Aarona, namaszczonych kapłanów, których poświęcił, aby pełnili urząd kapłański."
"Lb3,4": "Lecz Nadab i Abihu umarli przed PANEM, gdy ofiarowali inny ogień przed PANEM na pustyni Synaj, i odeszli bez potomków. Eleazar i Itamar pełnili więc urząd kapłański przed obliczem swego ojca Aarona."
"Lb3,5": "Wtedy PAN powiedział do Mojżesza:"
"Lb3,6": "Każ się zbliżyć pokoleniu Lewiego i postaw ich przed kapłanem Aaronem, aby mu służyli;"
"Lb3,7": "I pełnili straż, która go obowiązuje oraz straż całego zgromadzenia, przed Namiotem Zgromadzenia, wykonując służbę przybytku."
"Lb3,8": "Będą strzec wszystkich sprzętów Namiotu Zgromadzenia i pełnić straż synów Izraela, wykonując służbę przybytku."
"Lb3,9": "Oddasz więc Lewitów Aaronowi i jego synom; będą mu całkowicie oddani spośród synów Izraela."
"Lb3,10": "Aarona zaś i jego synów ustanowisz, aby pełnili swoje kapłaństwo. A obcy, który się zbliży, poniesie śmierć."
"Lb3,11": "Potem PAN powiedział do Mojżesza:"
"Lb3,12": "Oto wziąłem Lewitów spośród synów Izraela na miejsce wszystkich pierworodnych, którzy otwierają łono wśród synów Izraela, i dlatego Lewici będą należeć do mnie."
"Lb3,13": "Do mnie bowiem należy wszystko, co pierworodne. W dniu, kiedy zabiłem wszystko, co pierworodne w ziemi Egiptu, poświęciłem sobie wszystko, co pierworodne w Izraelu, od człowieka aż do zwierzęcia. Będą należeć do mnie; ja jestem PAN."
"Lb3,14": "PAN powiedział też do Mojżesza na pustyni Synaj:"
"Lb3,15": "Policz synów Lewiego według domów ich ojców i według ich rodzin. Policzysz każdego mężczyznę w wieku od jednego miesiąca wzwyż."
"Lb3,16": "I Mojżesz policzył ich według słowa PANA, jak mu rozkazano."
"Lb3,17": "Oto imiona synów Lewiego: Gerszon, Kehat i Merari."
"Lb3,18": "A imiona synów Gerszona według ich domów: Libni i Szimei."
"Lb3,19": "A synowie Kehata według swych domów: Amram, Ishar, Chebron i Uzziel."
"Lb3,20": "Synowie zaś Merariego według swych domów: Machli i Muszi. To są rodziny Lewiego według domów ich ojców."
"Lb3,21": "Od Gerszona pochodzi rodzina Libnitów i rodzina Szimeitów. To są rodziny Gerszonitów."
"Lb3,22": "Liczba wszystkich policzonych mężczyzn w wieku od jednego miesiąca wzwyż wynosiła u nich siedem tysięcy pięciuset."
"Lb3,23": "Rodziny Gerszonitów rozbiją obóz za przybytkiem od strony zachodniej."
"Lb3,24": "A wodzem domu ojca Gerszonitów będzie Eliasaf, syn Laela."
"Lb3,25": "A pod strażą synów Gerszona w Namiocie Zgromadzenia będzie przybytek i namiot, jego przykrycie i zasłona u wejścia do Namiotu Zgromadzenia;"
"Lb3,26": "I zasłony dziedzińca, zasłona u wejścia na dziedziniec, który otacza przybytek i ołtarz wokoło, oraz jego sznury potrzebne do wszelkich prac."
"Lb3,27": "Od Kehata zaś pochodzą rodziny: Amramitów, Isharytów, Chebronitów i Uzzielitów. To są rodziny Kehatytów."
"Lb3,28": "Liczba wszystkich mężczyzn w wieku od jednego miesiąca wzwyż wynosiła osiem tysięcy sześciuset pełniących straż w świątyni."
"Lb3,29": "Rodziny synów Kehata rozbiją obóz po południowej stronie przybytku;"
"Lb3,30": "A wodzem domu ojca rodziny Kehatytów będzie Elisafan, syn Uzziela."
"Lb3,31": "Pod ich strażą będzie arka, stół, świecznik, ołtarze i sprzęty świątyni, którymi będą usługiwać, oraz zasłona wraz z całą jej obsługą."
"Lb3,32": "Naczelnym wodzem Lewitów będzie Eleazar, syn kapłana Aarona, on będzie miał nadzór nad tymi, którzy pełnią straż w świątyni."
"Lb3,33": "Od Merariego pochodzą zaś rodziny Machlitów i Muszytów. To są rodziny Merarytów."
"Lb3,34": "A liczba wszystkich policzonych mężczyzn w wieku od jednego miesiąca wzwyż wynosiła u nich sześć tysięcy dwustu."
"Lb3,35": "Wodzem zaś domu ojca rodzin Merariego był Suriel, syn Abichaila. Oni rozbiją obóz po stronie północnej przybytku."
"Lb3,36": "A pod nadzorem i strażą synów Merariego będą deski przybytku, jego drążki, słupy i podstawki oraz wszystkie jego sprzęty wraz z całą jego obsługą;"
"Lb3,37": "Także słupy wokoło dziedzińca, ich podstawki, kołki i ich sznury."
"Lb3,38": "A przed przybytkiem od strony wschodniej, przed Namiotem Zgromadzenia, rozbiją obóz Mojżesz, Aaron i jego synowie, pełniący straż w świątyni za synów Izraela; a obcy, który się zbliży, poniesie śmierć."
"Lb3,39": "Wszystkich Lewitów policzonych przez Mojżesza i Aarona na rozkaz PANA według ich rodzin, wszystkich mężczyzn w wieku od jednego miesiąca wzwyż było dwadzieścia dwa tysiące."
"Lb3,40": "Wtedy PAN powiedział do Mojżesza: Policz wszystkich pierworodnych mężczyzn spośród synów Izraela w wieku od jednego miesiąca wzwyż i sporządź spis ich imion."
"Lb3,41": "I weźmiesz dla mnie Lewitów – ja jestem PAN – w zamian za wszystkich pierworodnych spośród synów Izraela, a także bydła Lewitów zamiast wszystkiego, co pierworodne, wśród bydła synów Izraela."
"Lb3,42": "Mojżesz policzył więc wszystkich pierworodnych spośród synów Izraela, tak jak PAN mu rozkazał."
"Lb3,43": "A liczba wszystkich pierworodnych mężczyzn w wieku od jednego miesiąca wzwyż, według liczby imion, wynosiła dwadzieścia dwa tysiące dwieście siedemdziesiąt trzy."
"Lb3,44": "I PAN powiedział do Mojżesza:"
"Lb3,45": "Weź Lewitów na miejsce wszystkich pierworodnych spośród synów Izraela, a także bydło Lewitów na miejsce ich bydła; i Lewici będą należeć do mnie. Ja jestem PAN."
"Lb3,46": "A jako wykup za tych dwustu siedemdziesięciu trzech pierworodnych spośród synów Izraela, którzy przewyższają liczbę Lewitów;"
"Lb3,47": "Weźmiesz po pięć syklów na głowę według sykla świątynnego: sykl po dwadzieścia ger."
"Lb3,48": "I oddasz te pieniądze Aaronowi i jego synom jako wykup za tych, którzy przewyższają ich liczbę."
"Lb3,49": "Mojżesz wziął więc pieniądze wykupu od tych, którzy przewyższali liczbę wykupionych przez Lewitów."
"Lb3,50": "Od pierworodnych synów Izraela wziął tysiąc trzysta sześćdziesiąt pięć syklów według sykla świątynnego."
"Lb3,51": "I Mojżesz oddał te pieniądze wykupu Aaronowi i jego synom według słowa PANA, tak jak PAN rozkazał Mojżeszowi."
