"Lb3,1":
  text: "To są dzieje rodu Aarona i Mojżesza w dniu, w którym PAN rozmawiał z Mojżeszem na górze Synaj."
  tags: []
"Lb3,2":
  text: "A to są imiona synów Aarona: pierworodny Nadab, potem Abihu, Eleazar i Itamar."
  tags: []
"Lb3,3":
  text: "To są imiona synów Aarona, namaszczonych kapłanów, których poświęcił, aby pełnili urząd kapłański."
  tags: []
"Lb3,4":
  text: "Lecz Nadab i Abihu umarli przed PANEM, gdy ofiarowali inny ogień przed PANEM na pustyni Synaj, i odeszli bez potomków. Eleazar i Itamar pełnili więc urząd kapłański przed obliczem swego ojca Aarona."
  tags: []
"Lb3,5":
  text: "Wtedy PAN powiedział do Mojżesza:"
  tags: []
"Lb3,6":
  text: "Każ się zbliżyć pokoleniu Lewiego i postaw ich przed kapłanem Aaronem, aby mu służyli;"
  tags: []
"Lb3,7":
  text: "I pełnili straż, która go obowiązuje oraz straż całego zgromadzenia, przed Namiotem Zgromadzenia, wykonując służbę przybytku."
  tags: []
"Lb3,8":
  text: "Będą strzec wszystkich sprzętów Namiotu Zgromadzenia i pełnić straż synów Izraela, wykonując służbę przybytku."
  tags: []
"Lb3,9":
  text: "Oddasz więc Lewitów Aaronowi i jego synom; będą mu całkowicie oddani spośród synów Izraela."
  tags: []
"Lb3,10":
  text: "Aarona zaś i jego synów ustanowisz, aby pełnili swoje kapłaństwo. A obcy, który się zbliży, poniesie śmierć."
  tags: []
"Lb3,11":
  text: "Potem PAN powiedział do Mojżesza:"
  tags: []
"Lb3,12":
  text: "Oto wziąłem Lewitów spośród synów Izraela na miejsce wszystkich pierworodnych, którzy otwierają łono wśród synów Izraela, i dlatego Lewici będą należeć do mnie."
  tags: []
"Lb3,13":
  text: "Do mnie bowiem należy wszystko, co pierworodne. W dniu, kiedy zabiłem wszystko, co pierworodne w ziemi Egiptu, poświęciłem sobie wszystko, co pierworodne w Izraelu, od człowieka aż do zwierzęcia. Będą należeć do mnie; ja jestem PAN."
  tags: []
"Lb3,14":
  text: "PAN powiedział też do Mojżesza na pustyni Synaj:"
  tags: []
"Lb3,15":
  text: "Policz synów Lewiego według domów ich ojców i według ich rodzin. Policzysz każdego mężczyznę w wieku od jednego miesiąca wzwyż."
  tags: []
"Lb3,16":
  text: "I Mojżesz policzył ich według słowa PANA, jak mu rozkazano."
  tags: []
"Lb3,17":
  text: "Oto imiona synów Lewiego: Gerszon, Kehat i Merari."
  tags: []
"Lb3,18":
  text: "A imiona synów Gerszona według ich domów: Libni i Szimei."
  tags: []
"Lb3,19":
  text: "A synowie Kehata według swych domów: Amram, Ishar, Chebron i Uzziel."
  tags: []
"Lb3,20":
  text: "Synowie zaś Merariego według swych domów: Machli i Muszi. To są rodziny Lewiego według domów ich ojców."
  tags: []
"Lb3,21":
  text: "Od Gerszona pochodzi rodzina Libnitów i rodzina Szimeitów. To są rodziny Gerszonitów."
  tags: []
"Lb3,22":
  text: "Liczba wszystkich policzonych mężczyzn w wieku od jednego miesiąca wzwyż wynosiła u nich siedem tysięcy pięciuset."
  tags: []
"Lb3,23":
  text: "Rodziny Gerszonitów rozbiją obóz za przybytkiem od strony zachodniej."
  tags: []
"Lb3,24":
  text: "A wodzem domu ojca Gerszonitów będzie Eliasaf, syn Laela."
  tags: []
"Lb3,25":
  text: "A pod strażą synów Gerszona w Namiocie Zgromadzenia będzie przybytek i namiot, jego przykrycie i zasłona u wejścia do Namiotu Zgromadzenia;"
  tags: []
"Lb3,26":
  text: "I zasłony dziedzińca, zasłona u wejścia na dziedziniec, który otacza przybytek i ołtarz wokoło, oraz jego sznury potrzebne do wszelkich prac."
  tags: []
"Lb3,27":
  text: "Od Kehata zaś pochodzą rodziny: Amramitów, Isharytów, Chebronitów i Uzzielitów. To są rodziny Kehatytów."
  tags: []
"Lb3,28":
  text: "Liczba wszystkich mężczyzn w wieku od jednego miesiąca wzwyż wynosiła osiem tysięcy sześciuset pełniących straż w świątyni."
  tags: []
"Lb3,29":
  text: "Rodziny synów Kehata rozbiją obóz po południowej stronie przybytku;"
  tags: []
"Lb3,30":
  text: "A wodzem domu ojca rodziny Kehatytów będzie Elisafan, syn Uzziela."
  tags: []
"Lb3,31":
  text: "Pod ich strażą będzie arka, stół, świecznik, ołtarze i sprzęty świątyni, którymi będą usługiwać, oraz zasłona wraz z całą jej obsługą."
  tags: []
"Lb3,32":
  text: "Naczelnym wodzem Lewitów będzie Eleazar, syn kapłana Aarona, on będzie miał nadzór nad tymi, którzy pełnią straż w świątyni."
  tags: []
"Lb3,33":
  text: "Od Merariego pochodzą zaś rodziny Machlitów i Muszytów. To są rodziny Merarytów."
  tags: []
"Lb3,34":
  text: "A liczba wszystkich policzonych mężczyzn w wieku od jednego miesiąca wzwyż wynosiła u nich sześć tysięcy dwustu."
  tags: []
"Lb3,35":
  text: "Wodzem zaś domu ojca rodzin Merariego był Suriel, syn Abichaila. Oni rozbiją obóz po stronie północnej przybytku."
  tags: []
"Lb3,36":
  text: "A pod nadzorem i strażą synów Merariego będą deski przybytku, jego drążki, słupy i podstawki oraz wszystkie jego sprzęty wraz z całą jego obsługą;"
  tags: []
"Lb3,37":
  text: "Także słupy wokoło dziedzińca, ich podstawki, kołki i ich sznury."
  tags: []
"Lb3,38":
  text: "A przed przybytkiem od strony wschodniej, przed Namiotem Zgromadzenia, rozbiją obóz Mojżesz, Aaron i jego synowie, pełniący straż w świątyni za synów Izraela; a obcy, który się zbliży, poniesie śmierć."
  tags: []
"Lb3,39":
  text: "Wszystkich Lewitów policzonych przez Mojżesza i Aarona na rozkaz PANA według ich rodzin, wszystkich mężczyzn w wieku od jednego miesiąca wzwyż było dwadzieścia dwa tysiące."
  tags: []
"Lb3,40":
  text: "Wtedy PAN powiedział do Mojżesza: Policz wszystkich pierworodnych mężczyzn spośród synów Izraela w wieku od jednego miesiąca wzwyż i sporządź spis ich imion."
  tags: []
"Lb3,41":
  text: "I weźmiesz dla mnie Lewitów – ja jestem PAN – w zamian za wszystkich pierworodnych spośród synów Izraela, a także bydła Lewitów zamiast wszystkiego, co pierworodne, wśród bydła synów Izraela."
  tags: []
"Lb3,42":
  text: "Mojżesz policzył więc wszystkich pierworodnych spośród synów Izraela, tak jak PAN mu rozkazał."
  tags: []
"Lb3,43":
  text: "A liczba wszystkich pierworodnych mężczyzn w wieku od jednego miesiąca wzwyż, według liczby imion, wynosiła dwadzieścia dwa tysiące dwieście siedemdziesiąt trzy."
  tags: []
"Lb3,44":
  text: "I PAN powiedział do Mojżesza:"
  tags: []
"Lb3,45":
  text: "Weź Lewitów na miejsce wszystkich pierworodnych spośród synów Izraela, a także bydło Lewitów na miejsce ich bydła; i Lewici będą należeć do mnie. Ja jestem PAN."
  tags: []
"Lb3,46":
  text: "A jako wykup za tych dwustu siedemdziesięciu trzech pierworodnych spośród synów Izraela, którzy przewyższają liczbę Lewitów;"
  tags: []
"Lb3,47":
  text: "Weźmiesz po pięć syklów na głowę według sykla świątynnego: sykl po dwadzieścia ger."
  tags: []
"Lb3,48":
  text: "I oddasz te pieniądze Aaronowi i jego synom jako wykup za tych, którzy przewyższają ich liczbę."
  tags: []
"Lb3,49":
  text: "Mojżesz wziął więc pieniądze wykupu od tych, którzy przewyższali liczbę wykupionych przez Lewitów."
  tags: []
"Lb3,50":
  text: "Od pierworodnych synów Izraela wziął tysiąc trzysta sześćdziesiąt pięć syklów według sykla świątynnego."
  tags: []
"Lb3,51":
  text: "I Mojżesz oddał te pieniądze wykupu Aaronowi i jego synom według słowa PANA, tak jak PAN rozkazał Mojżeszowi."
  tags: []
