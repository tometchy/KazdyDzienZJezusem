"Lb9,1":
  text: "I przemówił PAN do Mojżesza na pustyni Synaj, w pierwszym miesiącu drugiego roku po ich wyjściu z ziemi Egiptu, tymi słowy:"
  tags: []
"Lb9,2":
  text: "Niech synowie Izraela obchodzą Paschę w wyznaczonym czasie."
  tags: []
"Lb9,3":
  text: "Będziecie ją obchodzić w wyznaczonym czasie, czternastego dnia tego miesiąca pod wieczór; macie ją obchodzić według wszystkich jej obrzędów i wszystkich jej ceremonii."
  tags: []
"Lb9,4":
  text: "Mojżesz nakazał więc synom Izraela, aby obchodzili Paschę."
  tags: []
"Lb9,5":
  text: "I obchodzili Paschę w pierwszym miesiącu, czternastego dnia, pod wieczór, na pustyni Synaj. Zgodnie ze wszystkim, co PAN nakazał Mojżeszowi, tak synowie Izraela uczynili."
  tags: []
"Lb9,6":
  text: "Byli jednak pewni ludzie, którzy zanieczyścili się przy zwłokach ludzkich, i nie mogli obchodzić Paschy tego dnia. Przyszli więc w tym dniu do Mojżesza i Aarona;"
  tags: []
"Lb9,7":
  text: "I powiedzieli do niego: Zanieczyściliśmy się przy zwłokach ludzkich. Czemu nie będzie nam wolno złożyć PANU ofiar w wyznaczonym czasie wspólnie z synami Izraela?"
  tags: []
"Lb9,8":
  text: "Mojżesz odpowiedział im: Stójcie, a ja posłucham, co PAN rozkaże o was."
  tags: []
"Lb9,9":
  text: "Wtedy PAN powiedział do Mojżesza:"
  tags: []
"Lb9,10":
  text: "Powiedz synom Izraela tak: Jeśli kto z was lub z waszych potomków zanieczyści się przy zmarłym albo też będzie w dalekiej podróży, mimo to będzie obchodził Paschę dla PANA."
  tags: []
"Lb9,11":
  text: "Będą ją obchodzić w drugim miesiącu, czternastego dnia, pod wieczór, i będą ją jeść z przaśnymi chlebami i z gorzkimi ziołami."
  tags: []
"Lb9,12":
  text: "Nie pozostawią z niej nic do rana ani nie połamią jej kości. Zgodnie ze wszystkimi przepisami Paschy będą ją obchodzić."
  tags: []
"Lb9,13":
  text: "Lecz człowiek, który jest czysty, a nie znajduje się w drodze, i nie będzie obchodził Paschy, to ta dusza będzie wykluczona ze swego ludu, bo ofiary PANA nie złożyła w wyznaczonym czasie. Ten człowiek obciąża się grzechem."
  tags: []
"Lb9,14":
  text: "A jeśli przybysz, który mieszka pośród was, będzie obchodził Paschę dla PANA, to ma ją obchodzić według ustawy i zwyczajów Paschy. Będzie jedna ustawa dla was, zarówno dla przybysza, jak i dla rodowitego mieszkańca ziemi."
  tags: []
"Lb9,15":
  text: "W dniu, w którym wystawiono przybytek, obłok okrył przybytek, czyli Namiot Świadectwa, a wieczorem był nad przybytkiem i przypominał z wyglądu ogień, aż do rana."
  tags: []
"Lb9,16":
  text: "Tak było stale: obłok okrywał go w dzień, a w nocy jakby ogień."
  tags: []
"Lb9,17":
  text: "A gdy obłok unosił się znad namiotu, wtedy synowie Izraela wyruszali, a gdziekolwiek obłok zatrzymał się, tam synowie Izraela rozbijali obóz."
  tags: []
"Lb9,18":
  text: "Na rozkaz PANA synowie Izraela wyruszali i na rozkaz PANA rozbijali obóz. Przez wszystkie dni, w których obłok pozostawał nad przybytkiem, stali obozem."
  tags: []
"Lb9,19":
  text: "A kiedy obłok pozostawał nad przybytkiem przez wiele dni, wtedy synowie Izraela przestrzegali rozkazu PANA i nie wyruszali."
  tags: []
"Lb9,20":
  text: "Lecz gdy obłok pozostawał nad przybytkiem przez kilka dni, na rozkaz PANA stawali obozem i na rozkaz PANA wyruszali."
  tags: []
"Lb9,21":
  text: "A gdy obłok pozostawał od wieczora do rana i unosił się rano, wówczas wyruszali. Czy obłok unosił się za dnia, czy w nocy, oni wyruszali."
  tags: []
"Lb9,22":
  text: "A jeśli obłok trwał i pozostawał nad przybytkiem przez dwa dni albo przez miesiąc bądź też przez rok, synowie Izraela stali obozem i nie wyruszali, lecz gdy się unosił, wyruszali."
  tags: []
"Lb9,23":
  text: "Na rozkaz PANA stawali obozem i na rozkaz PANA wyruszali. Przestrzegali nakazu PANA, tak jak PAN rozkazał przez Mojżesza."
  tags: []
