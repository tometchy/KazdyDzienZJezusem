"Lb9,1": "I przemówił PAN do Mojżesza na pustyni Synaj, w pierwszym miesiącu drugiego roku po ich wyjściu z ziemi Egiptu, tymi słowy:"
"Lb9,2": "Niech synowie Izraela obchodzą Paschę w wyznaczonym czasie."
"Lb9,3": "Będziecie ją obchodzić w wyznaczonym czasie, czternastego dnia tego miesiąca pod wieczór; macie ją obchodzić według wszystkich jej obrzędów i wszystkich jej ceremonii."
"Lb9,4": "Mojżesz nakazał więc synom Izraela, aby obchodzili Paschę."
"Lb9,5": "I obchodzili Paschę w pierwszym miesiącu, czternastego dnia, pod wieczór, na pustyni Synaj. Zgodnie ze wszystkim, co PAN nakazał Mojżeszowi, tak synowie Izraela uczynili."
"Lb9,6": "Byli jednak pewni ludzie, którzy zanieczyścili się przy zwłokach ludzkich, i nie mogli obchodzić Paschy tego dnia. Przyszli więc w tym dniu do Mojżesza i Aarona;"
"Lb9,7": "I powiedzieli do niego: Zanieczyściliśmy się przy zwłokach ludzkich. Czemu nie będzie nam wolno złożyć PANU ofiar w wyznaczonym czasie wspólnie z synami Izraela?"
"Lb9,8": "Mojżesz odpowiedział im: Stójcie, a ja posłucham, co PAN rozkaże o was."
"Lb9,9": "Wtedy PAN powiedział do Mojżesza:"
"Lb9,10": "Powiedz synom Izraela tak: Jeśli kto z was lub z waszych potomków zanieczyści się przy zmarłym albo też będzie w dalekiej podróży, mimo to będzie obchodził Paschę dla PANA."
"Lb9,11": "Będą ją obchodzić w drugim miesiącu, czternastego dnia, pod wieczór, i będą ją jeść z przaśnymi chlebami i z gorzkimi ziołami."
"Lb9,12": "Nie pozostawią z niej nic do rana ani nie połamią jej kości. Zgodnie ze wszystkimi przepisami Paschy będą ją obchodzić."
"Lb9,13": "Lecz człowiek, który jest czysty, a nie znajduje się w drodze, i nie będzie obchodził Paschy, to ta dusza będzie wykluczona ze swego ludu, bo ofiary PANA nie złożyła w wyznaczonym czasie. Ten człowiek obciąża się grzechem."
"Lb9,14": "A jeśli przybysz, który mieszka pośród was, będzie obchodził Paschę dla PANA, to ma ją obchodzić według ustawy i zwyczajów Paschy. Będzie jedna ustawa dla was, zarówno dla przybysza, jak i dla rodowitego mieszkańca ziemi."
"Lb9,15": "W dniu, w którym wystawiono przybytek, obłok okrył przybytek, czyli Namiot Świadectwa, a wieczorem był nad przybytkiem i przypominał z wyglądu ogień, aż do rana."
"Lb9,16": "Tak było stale: obłok okrywał go w dzień, a w nocy jakby ogień."
"Lb9,17": "A gdy obłok unosił się znad namiotu, wtedy synowie Izraela wyruszali, a gdziekolwiek obłok zatrzymał się, tam synowie Izraela rozbijali obóz."
"Lb9,18": "Na rozkaz PANA synowie Izraela wyruszali i na rozkaz PANA rozbijali obóz. Przez wszystkie dni, w których obłok pozostawał nad przybytkiem, stali obozem."
"Lb9,19": "A kiedy obłok pozostawał nad przybytkiem przez wiele dni, wtedy synowie Izraela przestrzegali rozkazu PANA i nie wyruszali."
"Lb9,20": "Lecz gdy obłok pozostawał nad przybytkiem przez kilka dni, na rozkaz PANA stawali obozem i na rozkaz PANA wyruszali."
"Lb9,21": "A gdy obłok pozostawał od wieczora do rana i unosił się rano, wówczas wyruszali. Czy obłok unosił się za dnia, czy w nocy, oni wyruszali."
"Lb9,22": "A jeśli obłok trwał i pozostawał nad przybytkiem przez dwa dni albo przez miesiąc bądź też przez rok, synowie Izraela stali obozem i nie wyruszali, lecz gdy się unosił, wyruszali."
"Lb9,23": "Na rozkaz PANA stawali obozem i na rozkaz PANA wyruszali. Przestrzegali nakazu PANA, tak jak PAN rozkazał przez Mojżesza."
