"Lb33,1":
  text: "Oto miejsca postojów synów Izraela, którzy wyszli z ziemi Egiptu ze swymi zastępami pod wodzą Mojżesza i Aarona."
  tags: []
"Lb33,2":
  text: "Na rozkaz PANA Mojżesz spisał ich wymarsze według etapów. A oto ich wymarsze według etapów:"
  tags: []
"Lb33,3":
  text: "Wyruszyli z Ramses w pierwszym miesiącu, piętnastego dnia tego pierwszego miesiąca; nazajutrz po święcie Paschy synowie Izraela wyszli pod potężną ręką na oczach wszystkich Egipcjan;"
  tags: []
"Lb33,4":
  text: "Podczas gdy Egipcjanie grzebali wszystkich pierworodnych, których PAN zabił wśród nich. Także i nad ich bogami PAN dokonał sądu."
  tags: []
"Lb33,5":
  text: "Wyruszyli więc synowie Izraela z Ramses i rozbili obóz w Sukkot."
  tags: []
"Lb33,6":
  text: "Wyruszyli z Sukkot i rozbili obóz w Etam, które leży na skraju pustyni."
  tags: []
"Lb33,7":
  text: "Wyruszyli z Etam i wrócili do Pi-Hachirot, które leży naprzeciw Baal-Sefon, i rozbili obóz przed Migdol."
  tags: []
"Lb33,8":
  text: "Wyruszyli z Pi-Hachirot, przeszli przez środek morza na pustyni i po trzech dniach drogi po pustyni Etam rozbili obóz w Mara."
  tags: []
"Lb33,9":
  text: "Wyruszyli z Mara i przyszli do Elim. A w Elim było dwanaście źródeł wody i siedemdziesiąt palm i tam rozbili obóz."
  tags: []
"Lb33,10":
  text: "Wyruszyli z Elim i rozbili obóz nad Morzem Czerwonym."
  tags: []
"Lb33,11":
  text: "Wyruszyli znad Morza Czerwonego i rozbili obóz na pustyni Sin."
  tags: []
"Lb33,12":
  text: "Wyruszyli z pustyni Sin i rozbili obóz w Dofka."
  tags: []
"Lb33,13":
  text: "Wyruszyli z Dofka i rozbili obóz w Alusz."
  tags: []
"Lb33,14":
  text: "Wyruszyli z Alusz i rozbili obóz w Refidim, gdzie lud nie miał wody do picia."
  tags: []
"Lb33,15":
  text: "Wyruszyli z Refidim i rozbili obóz na pustyni Synaj."
  tags: []
"Lb33,16":
  text: "Wyruszyli z pustyni Synaj i rozbili obóz w Kibrot-Hattaawa."
  tags: []
"Lb33,17":
  text: "Wyruszyli z Kibrot-Hattaawa i rozbili obóz w Chaserot."
  tags: []
"Lb33,18":
  text: "Wyruszyli z Chaserot i rozbili obóz w Ritma."
  tags: []
"Lb33,19":
  text: "Wyruszyli z Ritma i rozbili obóz w Rimmon-Peres."
  tags: []
"Lb33,20":
  text: "Wyruszyli z Rimmon-Peres i rozbili obóz w Libnie."
  tags: []
"Lb33,21":
  text: "Wyruszyli z Libny i rozbili obóz w Rissa."
  tags: []
"Lb33,22":
  text: "Wyruszyli z Rissa i rozbili obóz w Kehelata."
  tags: []
"Lb33,23":
  text: "Wyruszyli z Kehelata i rozbili obóz na górze Szefer."
  tags: []
"Lb33,24":
  text: "Wyruszyli z góry Szefer i rozbili obóz w Charada."
  tags: []
"Lb33,25":
  text: "Wyruszyli z Charada i rozbili obóz w Makhelot."
  tags: []
"Lb33,26":
  text: "Wyruszyli z Makhelot i rozbili obóz w Tachat."
  tags: []
"Lb33,27":
  text: "Wyruszyli z Tachat i rozbili obóz w Terach."
  tags: []
"Lb33,28":
  text: "Wyruszyli z Terach i rozbili obóz w Mitka."
  tags: []
"Lb33,29":
  text: "Wyruszyli z Mitka i rozbili obóz w Chaszmona."
  tags: []
"Lb33,30":
  text: "Wyruszyli z Chaszmona i rozbili obóz w Moserot."
  tags: []
"Lb33,31":
  text: "Wyruszyli z Moserot i rozbili obóz w Bene-Jaakan."
  tags: []
"Lb33,32":
  text: "Wyruszyli z Bene-Jaakan i rozbili obóz w Chor-Haggidgad."
  tags: []
"Lb33,33":
  text: "Wyruszyli z Chor-Haggidgad i rozbili obóz w Jotbata."
  tags: []
"Lb33,34":
  text: "Wyruszyli z Jotbata i rozbili obóz w Abrona."
  tags: []
"Lb33,35":
  text: "Wyruszyli z Abrona i rozbili obóz w Esjon-Geber."
  tags: []
"Lb33,36":
  text: "Wyruszyli z Esjon-Geber i rozbili obóz na pustyni Syn, to jest w Kadesz."
  tags: []
"Lb33,37":
  text: "Wyruszyli z Kadesz i rozbili obóz na górze Hor, na granicy ziemi Edomu."
  tags: []
"Lb33,38":
  text: "Wtedy wstąpił kapłan Aaron na górę Hor na rozkaz PANA i tam umarł w czterdziestym roku po wyjściu synów Izraela z ziemi Egiptu, w pierwszym dniu piątego miesiąca."
  tags: []
"Lb33,39":
  text: "Aaron miał sto dwadzieścia trzy lata, kiedy umarł na górze Hor."
  tags: []
"Lb33,40":
  text: "A król Aradu, Kananejczyk, który mieszkał na południu w ziemi Kanaan, usłyszał, że nadciągają synowie Izraela."
  tags: []
"Lb33,41":
  text: "Wyruszyli z góry Hor i rozbili obóz w Salmona."
  tags: []
"Lb33,42":
  text: "Wyruszyli z Salmona i rozbili obóz w Punon."
  tags: []
"Lb33,43":
  text: "Wyruszyli z Punon i rozbili obóz w Obot."
  tags: []
"Lb33,44":
  text: "Wyruszyli z Obot i rozbili obóz w Ijje-Abarim, na granicy Moabu."
  tags: []
"Lb33,45":
  text: "Wyruszyli z Ijjim i rozbili obóz w Dibon-Gad."
  tags: []
"Lb33,46":
  text: "Wyruszyli z Dibon-Gad i rozbili obóz w Almon-Diblataim."
  tags: []
"Lb33,47":
  text: "Wyruszyli z Almon-Diblataim i rozbili obóz na górach Abarim, naprzeciwko Nebo."
  tags: []
"Lb33,48":
  text: "Wyruszyli z gór Abarim i rozbili obóz na równinach Moabu, nad Jordanem, naprzeciw Jerycha."
  tags: []
"Lb33,49":
  text: "I rozłożyli się nad Jordanem, od Bet-Jeszimot aż do Abel-Szittim, na równinach Moabu."
  tags: []
"Lb33,50":
  text: "I PAN przemówił do Mojżesza na równinach Moabu, nad Jordanem, naprzeciw Jerycha, tymi słowy:"
  tags: []
"Lb33,51":
  text: "Przemów do synów Izraela i powiedz im: Gdy przeprawicie się przez Jordan do ziemi Kanaan;"
  tags: []
"Lb33,52":
  text: "Wtedy wypędzicie przed sobą wszystkich mieszkańców tej ziemi i zniszczycie wszystkie ich obrazy i wszystkie ich odlane posągi i spustoszycie wszystkie ich wyżyny."
  tags: []
"Lb33,53":
  text: "A wypędziwszy mieszkańców ziemi, zamieszkacie w niej, gdyż dałem wam tę ziemię w posiadanie."
  tags: []
"Lb33,54":
  text: "I rozdzielicie tę ziemię przez losowanie jako dziedzictwo, według waszych rodzin. Liczniejszemu dacie większe dziedzictwo, a mniej licznemu dacie mniejsze dziedzictwo. Gdzie komu los przypadnie, to będzie jego; otrzymacie dziedzictwo według pokolenia waszych ojców."
  tags: []
"Lb33,55":
  text: "Jeśli jednak nie wypędzicie przed sobą mieszkańców tej ziemi, wtedy ci, których z nich pozostawicie, będą jak ciernie w waszych oczach i jak kolce dla waszych boków i będą was gnębić w tej ziemi, w której będziecie mieszkać."
  tags: []
"Lb33,56":
  text: "Wtedy uczynię wam to, co zamierzałem uczynić im."
  tags: []
