"Lb33,1": "Oto miejsca postojów synów Izraela, którzy wyszli z ziemi Egiptu ze swymi zastępami pod wodzą Mojżesza i Aarona."
"Lb33,2": "Na rozkaz PANA Mojżesz spisał ich wymarsze według etapów. A oto ich wymarsze według etapów:"
"Lb33,3": "Wyruszyli z Ramses w pierwszym miesiącu, piętnastego dnia tego pierwszego miesiąca; nazajutrz po święcie Paschy synowie Izraela wyszli pod potężną ręką na oczach wszystkich Egipcjan;"
"Lb33,4": "Podczas gdy Egipcjanie grzebali wszystkich pierworodnych, których PAN zabił wśród nich. Także i nad ich bogami PAN dokonał sądu."
"Lb33,5": "Wyruszyli więc synowie Izraela z Ramses i rozbili obóz w Sukkot."
"Lb33,6": "Wyruszyli z Sukkot i rozbili obóz w Etam, które leży na skraju pustyni."
"Lb33,7": "Wyruszyli z Etam i wrócili do Pi-Hachirot, które leży naprzeciw Baal-Sefon, i rozbili obóz przed Migdol."
"Lb33,8": "Wyruszyli z Pi-Hachirot, przeszli przez środek morza na pustyni i po trzech dniach drogi po pustyni Etam rozbili obóz w Mara."
"Lb33,9": "Wyruszyli z Mara i przyszli do Elim. A w Elim było dwanaście źródeł wody i siedemdziesiąt palm i tam rozbili obóz."
"Lb33,10": "Wyruszyli z Elim i rozbili obóz nad Morzem Czerwonym."
"Lb33,11": "Wyruszyli znad Morza Czerwonego i rozbili obóz na pustyni Sin."
"Lb33,12": "Wyruszyli z pustyni Sin i rozbili obóz w Dofka."
"Lb33,13": "Wyruszyli z Dofka i rozbili obóz w Alusz."
"Lb33,14": "Wyruszyli z Alusz i rozbili obóz w Refidim, gdzie lud nie miał wody do picia."
"Lb33,15": "Wyruszyli z Refidim i rozbili obóz na pustyni Synaj."
"Lb33,16": "Wyruszyli z pustyni Synaj i rozbili obóz w Kibrot-Hattaawa."
"Lb33,17": "Wyruszyli z Kibrot-Hattaawa i rozbili obóz w Chaserot."
"Lb33,18": "Wyruszyli z Chaserot i rozbili obóz w Ritma."
"Lb33,19": "Wyruszyli z Ritma i rozbili obóz w Rimmon-Peres."
"Lb33,20": "Wyruszyli z Rimmon-Peres i rozbili obóz w Libnie."
"Lb33,21": "Wyruszyli z Libny i rozbili obóz w Rissa."
"Lb33,22": "Wyruszyli z Rissa i rozbili obóz w Kehelata."
"Lb33,23": "Wyruszyli z Kehelata i rozbili obóz na górze Szefer."
"Lb33,24": "Wyruszyli z góry Szefer i rozbili obóz w Charada."
"Lb33,25": "Wyruszyli z Charada i rozbili obóz w Makhelot."
"Lb33,26": "Wyruszyli z Makhelot i rozbili obóz w Tachat."
"Lb33,27": "Wyruszyli z Tachat i rozbili obóz w Terach."
"Lb33,28": "Wyruszyli z Terach i rozbili obóz w Mitka."
"Lb33,29": "Wyruszyli z Mitka i rozbili obóz w Chaszmona."
"Lb33,30": "Wyruszyli z Chaszmona i rozbili obóz w Moserot."
"Lb33,31": "Wyruszyli z Moserot i rozbili obóz w Bene-Jaakan."
"Lb33,32": "Wyruszyli z Bene-Jaakan i rozbili obóz w Chor-Haggidgad."
"Lb33,33": "Wyruszyli z Chor-Haggidgad i rozbili obóz w Jotbata."
"Lb33,34": "Wyruszyli z Jotbata i rozbili obóz w Abrona."
"Lb33,35": "Wyruszyli z Abrona i rozbili obóz w Esjon-Geber."
"Lb33,36": "Wyruszyli z Esjon-Geber i rozbili obóz na pustyni Syn, to jest w Kadesz."
"Lb33,37": "Wyruszyli z Kadesz i rozbili obóz na górze Hor, na granicy ziemi Edomu."
"Lb33,38": "Wtedy wstąpił kapłan Aaron na górę Hor na rozkaz PANA i tam umarł w czterdziestym roku po wyjściu synów Izraela z ziemi Egiptu, w pierwszym dniu piątego miesiąca."
"Lb33,39": "Aaron miał sto dwadzieścia trzy lata, kiedy umarł na górze Hor."
"Lb33,40": "A król Aradu, Kananejczyk, który mieszkał na południu w ziemi Kanaan, usłyszał, że nadciągają synowie Izraela."
"Lb33,41": "Wyruszyli z góry Hor i rozbili obóz w Salmona."
"Lb33,42": "Wyruszyli z Salmona i rozbili obóz w Punon."
"Lb33,43": "Wyruszyli z Punon i rozbili obóz w Obot."
"Lb33,44": "Wyruszyli z Obot i rozbili obóz w Ijje-Abarim, na granicy Moabu."
"Lb33,45": "Wyruszyli z Ijjim i rozbili obóz w Dibon-Gad."
"Lb33,46": "Wyruszyli z Dibon-Gad i rozbili obóz w Almon-Diblataim."
"Lb33,47": "Wyruszyli z Almon-Diblataim i rozbili obóz na górach Abarim, naprzeciwko Nebo."
"Lb33,48": "Wyruszyli z gór Abarim i rozbili obóz na równinach Moabu, nad Jordanem, naprzeciw Jerycha."
"Lb33,49": "I rozłożyli się nad Jordanem, od Bet-Jeszimot aż do Abel-Szittim, na równinach Moabu."
"Lb33,50": "I PAN przemówił do Mojżesza na równinach Moabu, nad Jordanem, naprzeciw Jerycha, tymi słowy:"
"Lb33,51": "Przemów do synów Izraela i powiedz im: Gdy przeprawicie się przez Jordan do ziemi Kanaan;"
"Lb33,52": "Wtedy wypędzicie przed sobą wszystkich mieszkańców tej ziemi i zniszczycie wszystkie ich obrazy i wszystkie ich odlane posągi i spustoszycie wszystkie ich wyżyny."
"Lb33,53": "A wypędziwszy mieszkańców ziemi, zamieszkacie w niej, gdyż dałem wam tę ziemię w posiadanie."
"Lb33,54": "I rozdzielicie tę ziemię przez losowanie jako dziedzictwo, według waszych rodzin. Liczniejszemu dacie większe dziedzictwo, a mniej licznemu dacie mniejsze dziedzictwo. Gdzie komu los przypadnie, to będzie jego; otrzymacie dziedzictwo według pokolenia waszych ojców."
"Lb33,55": "Jeśli jednak nie wypędzicie przed sobą mieszkańców tej ziemi, wtedy ci, których z nich pozostawicie, będą jak ciernie w waszych oczach i jak kolce dla waszych boków i będą was gnębić w tej ziemi, w której będziecie mieszkać."
"Lb33,56": "Wtedy uczynię wam to, co zamierzałem uczynić im."
