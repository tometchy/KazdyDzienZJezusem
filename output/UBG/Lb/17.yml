"Lb17,1":
  text: "Potem PAN powiedział do Mojżesza:"
  tags: []
"Lb17,2":
  text: "Mów do synów Izraela i weź od każdego z nich po lasce według domów ich ojców, od wszystkich ich naczelników według domów ich ojców dwanaście lasek, a imię każdego napisz na jego lasce."
  tags: []
"Lb17,3":
  text: "A imię Aarona napiszesz na lasce Lewiego, gdyż jedna laska będzie dla każdego naczelnika z domu ich ojców."
  tags: []
"Lb17,4":
  text: "I położysz je w Namiocie Zgromadzenia przed Świadectwem, gdzie się z wami spotykam."
  tags: []
"Lb17,5":
  text: "I stanie się tak, że laska tego, kogo wybiorę, zakwitnie; i uśmierzę przed sobą szemrania synów Izraela, jakie kierują przeciwko wam."
  tags: []
"Lb17,6":
  text: "Gdy Mojżesz przekazał to synom Izraela, wszyscy ich naczelnicy oddali mu swoje laski, po jednej lasce od każdego naczelnika z domu swego ojca, razem dwanaście lasek. Wśród ich lasek była też laska Aarona."
  tags: []
"Lb17,7":
  text: "Potem Mojżesz złożył te laski przed PANEM w Namiocie Świadectwa."
  tags: []
"Lb17,8":
  text: "Nazajutrz, gdy Mojżesz przyszedł do Namiotu Świadectwa, oto laska Aarona, z domu Lewiego, zakwitła, wypuściła pączki, wydała kwiat i dojrzałe migdały."
  tags: []
"Lb17,9":
  text: "Wtedy Mojżesz wyniósł wszystkie laski sprzed PANA do wszystkich synów Izraela; a gdy je ujrzeli, każdy z nich wziął swoją laskę."
  tags: []
"Lb17,10":
  text: "I PAN powiedział do Mojżesza: Połóż laskę Aarona z powrotem przed Świadectwem, aby była zachowana na znak dla buntowników, a położysz kres ich szemraniu przeciwko mnie, aby nie pomarli."
  tags: []
"Lb17,11":
  text: "I Mojżesz tak uczynił; jak PAN mu rozkazał, tak uczynił."
  tags: []
"Lb17,12":
  text: "I synowie Izraela powiedzieli do Mojżesza: Oto umieramy, giniemy, wszyscy giniemy;"
  tags: []
"Lb17,13":
  text: "Każdy, kto zbliża się do przybytku PANA, umrze. Czy mamy doszczętnie zginąć?"
  tags: []
