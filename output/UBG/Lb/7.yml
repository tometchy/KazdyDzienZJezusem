"Lb7,1":
  text: "W dniu, w którym Mojżesz zakończył wznoszenie przybytku, namaścił go i poświęcił wraz ze wszystkimi jego sprzętami, a także ołtarz ze wszystkimi jego naczyniami, namaścił je i poświęcił."
  tags: []
"Lb7,2":
  text: "Naczelnicy Izraela, głowy domów swoich ojców, którzy byli naczelnikami z każdego pokolenia i przełożonymi nad tymi, którzy zostali spisani, złożyli ofiary."
  tags: []
"Lb7,3":
  text: "Przynieśli swoje ofiary przed PANA: sześć krytych wozów, dwanaście wołów, po jednym wozie na dwóch naczelników i po jednym wole na każdego, i przyprowadzili to przed przybytek."
  tags: []
"Lb7,4":
  text: "Wtedy PAN powiedział do Mojżesza:"
  tags: []
"Lb7,5":
  text: "Weź to od nich na potrzebę służby w Namiocie Zgromadzenia i oddaj to Lewitom, każdemu według potrzeby jego służby."
  tags: []
"Lb7,6":
  text: "Mojżesz wziął więc te wozy i woły i oddał je Lewitom."
  tags: []
"Lb7,7":
  text: "Dwa wozy i cztery woły dał synom Gerszona według potrzeby ich służby."
  tags: []
"Lb7,8":
  text: "Cztery zaś wozy i osiem wołów dał synom Merariego według potrzeby ich służby, pod nadzorem Itamara, syna kapłana Aarona."
  tags: []
"Lb7,9":
  text: "Ale synom Kehata nie dał nic, bo ich służba w świątyni polegała na noszeniu na ramionach."
  tags: []
"Lb7,10":
  text: "Naczelnicy ofiarowali swoje dary przed ołtarzem na jego poświęcenie, w tym dniu, w którym został namaszczony."
  tags: []
"Lb7,11":
  text: "I PAN powiedział do Mojżesza: Niech złożą swoje ofiary, inny naczelnik każdego dnia, na poświęcenie ołtarza."
  tags: []
"Lb7,12":
  text: "Pierwszego dnia swoją ofiarę złożył Nachszon, syn Amminadaba, z pokolenia Judy."
  tags: []
"Lb7,13":
  text: "A jego ofiarę stanowiły: jedna srebrna misa wagi stu trzydziestu syklów, jedna srebrna czasza wagi siedemdziesięciu syklów według sykla świątynnego, obydwie pełne mąki pszennej zmieszanej z oliwą, na ofiarę pokarmową;"
  tags: []
"Lb7,14":
  text: "Jedna czara z dziesięciu syklów złota pełna kadzidła;"
  tags: []
"Lb7,15":
  text: "Jeden młody cielec, jeden baran i jedno roczne jagnię na ofiarę całopalną;"
  tags: []
"Lb7,16":
  text: "Jeden kozioł z kóz na ofiarę za grzech;"
  tags: []
"Lb7,17":
  text: "A na ofiarę pojednawczą – dwa woły, pięć baranów, pięć kozłów i pięć jednorocznych jagniąt. To była ofiara Nachszona, syna Amminadaba."
  tags: []
"Lb7,18":
  text: "Drugiego dnia ofiarę złożył Netaneel, syn Suara, naczelnik z pokolenia Issachara."
  tags: []
"Lb7,19":
  text: "Złożył on w ofierze jedną srebrną misę wagi stu trzydziestu syklów, jedną srebrną czaszę wagi siedemdziesięciu syklów według sykla świątynnego, obydwie pełne mąki pszennej zmieszanej z oliwą, na ofiarę pokarmową;"
  tags: []
"Lb7,20":
  text: "Jedną czarę z dziesięciu syklów złota pełną kadzidła;"
  tags: []
"Lb7,21":
  text: "Jednego młodego cielca, jednego barana i jedno roczne jagnię na ofiarę całopalną;"
  tags: []
"Lb7,22":
  text: "Jednego kozła z kóz na ofiarę za grzech;"
  tags: []
"Lb7,23":
  text: "A na ofiarę pojednawczą – dwa woły, pięć baranów, pięć kozłów i pięć jednorocznych jagniąt. To była ofiara Netaneela, syna Suara."
  tags: []
"Lb7,24":
  text: "Trzeciego dnia ofiarę złożył naczelnik synów Zebulona Eliab, syn Chelona."
  tags: []
