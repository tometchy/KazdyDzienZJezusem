"Lb7,1": "W dniu, w którym Mojżesz zakończył wznoszenie przybytku, namaścił go i poświęcił wraz ze wszystkimi jego sprzętami, a także ołtarz ze wszystkimi jego naczyniami, namaścił je i poświęcił."
"Lb7,2": "Naczelnicy Izraela, głowy domów swoich ojców, którzy byli naczelnikami z każdego pokolenia i przełożonymi nad tymi, którzy zostali spisani, złożyli ofiary."
"Lb7,3": "Przynieśli swoje ofiary przed PANA: sześć krytych wozów, dwanaście wołów, po jednym wozie na dwóch naczelników i po jednym wole na każdego, i przyprowadzili to przed przybytek."
"Lb7,4": "Wtedy PAN powiedział do Mojżesza:"
"Lb7,5": "Weź to od nich na potrzebę służby w Namiocie Zgromadzenia i oddaj to Lewitom, każdemu według potrzeby jego służby."
"Lb7,6": "Mojżesz wziął więc te wozy i woły i oddał je Lewitom."
"Lb7,7": "Dwa wozy i cztery woły dał synom Gerszona według potrzeby ich służby."
"Lb7,8": "Cztery zaś wozy i osiem wołów dał synom Merariego według potrzeby ich służby, pod nadzorem Itamara, syna kapłana Aarona."
"Lb7,9": "Ale synom Kehata nie dał nic, bo ich służba w świątyni polegała na noszeniu na ramionach."
"Lb7,10": "Naczelnicy ofiarowali swoje dary przed ołtarzem na jego poświęcenie, w tym dniu, w którym został namaszczony."
"Lb7,11": "I PAN powiedział do Mojżesza: Niech złożą swoje ofiary, inny naczelnik każdego dnia, na poświęcenie ołtarza."
"Lb7,12": "Pierwszego dnia swoją ofiarę złożył Nachszon, syn Amminadaba, z pokolenia Judy."
"Lb7,13": "A jego ofiarę stanowiły: jedna srebrna misa wagi stu trzydziestu syklów, jedna srebrna czasza wagi siedemdziesięciu syklów według sykla świątynnego, obydwie pełne mąki pszennej zmieszanej z oliwą, na ofiarę pokarmową;"
"Lb7,14": "Jedna czara z dziesięciu syklów złota pełna kadzidła;"
"Lb7,15": "Jeden młody cielec, jeden baran i jedno roczne jagnię na ofiarę całopalną;"
"Lb7,16": "Jeden kozioł z kóz na ofiarę za grzech;"
"Lb7,17": "A na ofiarę pojednawczą – dwa woły, pięć baranów, pięć kozłów i pięć jednorocznych jagniąt. To była ofiara Nachszona, syna Amminadaba."
"Lb7,18": "Drugiego dnia ofiarę złożył Netaneel, syn Suara, naczelnik z pokolenia Issachara."
"Lb7,19": "Złożył on w ofierze jedną srebrną misę wagi stu trzydziestu syklów, jedną srebrną czaszę wagi siedemdziesięciu syklów według sykla świątynnego, obydwie pełne mąki pszennej zmieszanej z oliwą, na ofiarę pokarmową;"
"Lb7,20": "Jedną czarę z dziesięciu syklów złota pełną kadzidła;"
"Lb7,21": "Jednego młodego cielca, jednego barana i jedno roczne jagnię na ofiarę całopalną;"
"Lb7,22": "Jednego kozła z kóz na ofiarę za grzech;"
"Lb7,23": "A na ofiarę pojednawczą – dwa woły, pięć baranów, pięć kozłów i pięć jednorocznych jagniąt. To była ofiara Netaneela, syna Suara."
"Lb7,24": "Trzeciego dnia ofiarę złożył naczelnik synów Zebulona Eliab, syn Chelona."
"Lb7,25": "Jego ofiarę stanowiły: jedna srebrna misa wagi stu trzydziestu syklów, jedna srebrna czasza wagi siedemdziesięciu syklów według sykla świątynnego, obydwie pełne mąki pszennej zmieszanej z oliwą, na ofiarę pokarmową;"
