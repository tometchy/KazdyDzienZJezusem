  tags: []
"Lb7,83":
  text: "A na ofiarę pojednawczą – dwa woły, pięć baranów, pięć kozłów i pięć jednorocznych jagniąt. To była ofiara Achiry, syna Enana."
  tags: []
"Lb7,84":
  text: "To było poświęcenie ołtarza, w tym dniu, w którym został namaszczony przez naczelników Izraela: dwanaście srebrnych mis, dwanaście srebrnych czasz, dwanaście złotych czar;"
  tags: []
"Lb7,85":
  text: "Każda srebrna misa ważyła sto trzydzieści syklów, każda czasza – siedemdziesiąt syklów. Całego srebra w tych naczyniach było dwa tysiące czterysta syklów według sykla świątynnego;"
  tags: []
"Lb7,86":
  text: "Złotych czar było dwanaście, pełnych kadzidła; każda ważyła dziesięć syklów według sykla świątynnego. Całego złota w tych czarach było sto dwadzieścia syklów."
  tags: []
"Lb7,87":
  text: "Wszystkich zwierząt na ofiarę całopalną było: dwanaście cielców, dwanaście baranów, dwanaście jednorocznych jagniąt wraz z ich ofiarą pokarmową i dwanaście kozłów z kóz na ofiarę za grzech."
  tags: []
"Lb7,88":
  text: "A wszystkich zwierząt na ofiarę pojednawczą było: dwadzieścia cztery woły, sześćdziesiąt baranów, sześćdziesiąt kozłów i sześćdziesiąt jednorocznych jagniąt. To było poświęcenie ołtarza po jego namaszczeniu."
  tags: []
"Lb7,89":
  text: "A gdy Mojżesz wchodził do Namiotu Zgromadzenia, aby rozmawiać z Bogiem, wtedy słyszał głos mówiącego do niego z przebłagalni, która była nad arką świadectwa, spomiędzy dwóch cherubinów. I przemawiał do niego."
  tags: []
