"Lb7,78": "Dwunastego dnia ofiarę złożył naczelnik synów Neftalego Achira, syn Enana."
"Lb7,79": "Jego ofiarę stanowiły: jedna srebrna misa wagi stu trzydziestu syklów, jedna srebrna czasza wagi siedemdziesięciu syklów według sykla świątynnego, obydwie pełne mąki pszennej zmieszanej z oliwą, na ofiarę pokarmową;"
