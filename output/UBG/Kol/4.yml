"Kol4,1":
  text: "Panowie, obchodźcie się ze sługami sprawiedliwie i słusznie, wiedząc, że i wy macie Pana w niebie."
  tags: []
"Kol4,2":
  text: "Trwajcie w modlitwie, czuwając na niej z dziękczynieniem;"
  tags: []
"Kol4,3":
  text: "Modląc się jednocześnie i za nas, aby Bóg otworzył nam drzwi słowa, żebyśmy mówili o tajemnicy Chrystusa, z powodu której też jestem więziony;"
  tags: []
"Kol4,4":
  text: "Abym ją objawił i mówił tak, jak powinienem."
  tags: []
"Kol4,5":
  text: "Postępujcie mądrze wobec tych, którzy są z zewnątrz, odkupując czas."
  tags: []
"Kol4,6":
  text: "Wasza mowa niech zawsze będzie miła, zaprawiona solą, abyście wiedzieli, jak należy każdemu odpowiedzieć."
  tags: []
"Kol4,7":
  text: "O wszystkim, co się ze mną dzieje, opowie wam Tychik, umiłowany brat, wierny sługa i współsługa w Panu."
  tags: []
"Kol4,8":
  text: "Posłałem go do was właśnie po to, aby się dowiedział, co się u was dzieje i pocieszył wasze serca;"
  tags: []
"Kol4,9":
  text: "Wraz z Onezymem, wiernym i umiłowanym bratem, który pochodzi spośród was. Oni oznajmią wam wszystko, co się tutaj dzieje."
  tags: []
"Kol4,10":
  text: "Pozdrawia was Arystarch, mój współwięzień, i Marek, siostrzeniec Barnaby (co do którego otrzymaliście polecenie: Przyjmijcie go, jeśli do was przybędzie);"
  tags: []
"Kol4,11":
  text: "I Jezus, zwany Justusem, którzy są z obrzezania. Ci są moimi jedynymi współpracownikami dla królestwa Bożego, którzy stali się dla mnie pociechą."
  tags: []
"Kol4,12":
  text: "Pozdrawia was Epafras, który pochodzi spośród was, sługa Chrystusa, zawsze o to walczący za was w modlitwach, abyście byli doskonali i zupełni we wszelkiej woli Boga."
  tags: []
"Kol4,13":
  text: "Wydaję mu bowiem świadectwo, że gorliwie troszczy się o was i o tych, którzy są w Laodycei i Hierapolis."
  tags: []
"Kol4,14":
  text: "Pozdrawia was Łukasz, umiłowany lekarz, i Demas."
  tags: []
"Kol4,15":
  text: "Pozdrówcie braci w Laodycei i Nimfasa oraz kościół, który jest w jego domu."
  tags: []
"Kol4,16":
  text: "A gdy ten list zostanie u was przeczytany, dopilnujcie, aby przeczytano go także w kościele w Laodycei, a wy abyście przeczytali ten z Laodycei."
  tags: []
"Kol4,17":
  text: "Powiedzcie też Archipowi: Uważaj, abyś wypełnił posługę, którą przyjąłeś w Panu."
  tags: []
"Kol4,18":
  text: "Pozdrowienie moją, Pawła, ręką. Pamiętajcie o moich więzach. Łaska niech będzie z wami. Amen."
  tags: []
