"Kol4,1": "Panowie, obchodźcie się ze sługami sprawiedliwie i słusznie, wiedząc, że i wy macie Pana w niebie."
"Kol4,2": "Trwajcie w modlitwie, czuwając na niej z dziękczynieniem;"
"Kol4,3": "Modląc się jednocześnie i za nas, aby Bóg otworzył nam drzwi słowa, żebyśmy mówili o tajemnicy Chrystusa, z powodu której też jestem więziony;"
"Kol4,4": "Abym ją objawił i mówił tak, jak powinienem."
"Kol4,5": "Postępujcie mądrze wobec tych, którzy są z zewnątrz, odkupując czas."
"Kol4,6": "Wasza mowa niech zawsze będzie miła, zaprawiona solą, abyście wiedzieli, jak należy każdemu odpowiedzieć."
"Kol4,7": "O wszystkim, co się ze mną dzieje, opowie wam Tychik, umiłowany brat, wierny sługa i współsługa w Panu."
"Kol4,8": "Posłałem go do was właśnie po to, aby się dowiedział, co się u was dzieje i pocieszył wasze serca;"
"Kol4,9": "Wraz z Onezymem, wiernym i umiłowanym bratem, który pochodzi spośród was. Oni oznajmią wam wszystko, co się tutaj dzieje."
"Kol4,10": "Pozdrawia was Arystarch, mój współwięzień, i Marek, siostrzeniec Barnaby (co do którego otrzymaliście polecenie: Przyjmijcie go, jeśli do was przybędzie);"
"Kol4,11": "I Jezus, zwany Justusem, którzy są z obrzezania. Ci są moimi jedynymi współpracownikami dla królestwa Bożego, którzy stali się dla mnie pociechą."
"Kol4,12": "Pozdrawia was Epafras, który pochodzi spośród was, sługa Chrystusa, zawsze o to walczący za was w modlitwach, abyście byli doskonali i zupełni we wszelkiej woli Boga."
"Kol4,13": "Wydaję mu bowiem świadectwo, że gorliwie troszczy się o was i o tych, którzy są w Laodycei i Hierapolis."
"Kol4,14": "Pozdrawia was Łukasz, umiłowany lekarz, i Demas."
"Kol4,15": "Pozdrówcie braci w Laodycei i Nimfasa oraz kościół, który jest w jego domu."
"Kol4,16": "A gdy ten list zostanie u was przeczytany, dopilnujcie, aby przeczytano go także w kościele w Laodycei, a wy abyście przeczytali ten z Laodycei."
"Kol4,17": "Powiedzcie też Archipowi: Uważaj, abyś wypełnił posługę, którą przyjąłeś w Panu."
"Kol4,18": "Pozdrowienie moją, Pawła, ręką. Pamiętajcie o moich więzach. Łaska niech będzie z wami. Amen."
