"Kol3,1":
  text: "Jeśli więc razem z Chrystusem powstaliście z martwych, szukajcie tego, co w górze, gdzie Chrystus zasiada po prawicy Boga."
  tags: []
"Kol3,2":
  text: "Myślcie o tym, co w górze, nie o tym, co na ziemi."
  tags: []
"Kol3,3":
  text: "Umarliście bowiem i wasze życie jest ukryte z Chrystusem w Bogu."
  tags: []
"Kol3,4":
  text: "Lecz gdy się Chrystus, nasze życie, ukaże, wtedy i wy razem z nim ukażecie się w chwale."
  tags: []
"Kol3,5":
  text: "Umartwiajcie więc wasze członki, które są na ziemi: nierząd, nieczystość, namiętność, złe żądze i chciwość, która jest bałwochwalstwem;"
  tags: []
"Kol3,6":
  text: "Z powodu których przychodzi gniew Boży na synów nieposłuszeństwa."
  tags: []
"Kol3,7":
  text: "I wy niegdyś tak postępowaliście, gdy żyliście w nich."
  tags: []
"Kol3,8":
  text: "Lecz teraz i wy odrzućcie to wszystko: gniew, zapalczywość, złośliwość, bluźnierstwo i nieprzyzwoite słowa z waszych ust."
  tags: []
"Kol3,9":
  text: "Nie okłamujcie się wzajemnie, skoro zrzuciliście z siebie starego człowieka z jego uczynkami;"
  tags: []
"Kol3,10":
  text: "A przyodzialiście się w nowego, który się odnawia w poznaniu na obraz tego, który go stworzył."
  tags: []
"Kol3,11":
  text: "Gdzie nie ma Greka ani Żyda, obrzezanego ani nieobrzezanego, cudzoziemca ani Scyty, niewolnika ani wolnego, ale wszystkim i we wszystkich Chrystus."
  tags: []
"Kol3,12":
  text: "Tak więc jako wybrani Boga, święci i umiłowani, przyodziejcie się w serdeczne miłosierdzie, dobroć, pokorę, łagodność, cierpliwość;"
  tags: []
"Kol3,13":
  text: "Znosząc jedni drugich i przebaczając sobie nawzajem, jeśli ktoś ma skargę przeciw drugiemu: jak i Chrystus przebaczył wam, tak i wy."
  tags: []
"Kol3,14":
  text: "A nade wszystko przyodziejcie się w miłość, która jest więzią doskonałości."
  tags: []
"Kol3,15":
  text: "A pokój Boży niech rządzi w waszych sercach, do którego też jesteście powołani w jednym ciele. Bądźcie też wdzięczni."
  tags: []
"Kol3,16":
  text: "Słowo Chrystusa niech mieszka w was obficie ze wszelką mądrością, nauczajcie i napominajcie się wzajemnie przez psalmy, hymny i pieśni duchowe, z wdzięcznością śpiewając w waszych sercach Panu."
  tags: []
"Kol3,17":
  text: "A wszystko, co czynicie w słowie lub w uczynku, wszystko czyńcie w imię Pana Jezusa, dziękując Bogu i Ojcu przez niego."
  tags: []
"Kol3,18":
  text: "Żony, bądźcie poddane swym mężom, jak przystoi w Panu."
  tags: []
"Kol3,19":
  text: "Mężowie, miłujcie wasze żony i nie bądźcie surowi wobec nich."
  tags: []
"Kol3,20":
  text: "Dzieci, bądźcie posłuszne rodzicom we wszystkim, to bowiem podoba się Panu."
  tags: []
"Kol3,21":
  text: "Ojcowie, nie pobudzajcie do gniewu waszych dzieci, aby nie upadały na duchu."
  tags: []
"Kol3,22":
  text: "Słudzy, bądźcie posłuszni we wszystkim ziemskim panom, nie służąc dla oka, jak ci, którzy chcą się podobać ludziom, lecz w szczerości serca, bojąc się Boga."
  tags: []
"Kol3,23":
  text: "A wszystko, co czynicie, z serca czyńcie, jak dla Pana, a nie dla ludzi;"
  tags: []
"Kol3,24":
  text: "Wiedząc, że od Pana otrzymacie dziedzictwo jako zapłatę, gdyż służycie Panu Chrystusowi."
  tags: []
"Kol3,25":
  text: "A ten, kto wyrządza krzywdę, otrzyma zapłatę za krzywdę, a u Boga nie ma względu na osobę."
  tags: []
