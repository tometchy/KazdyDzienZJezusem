"Kol3,1": "Jeśli więc razem z Chrystusem powstaliście z martwych, szukajcie tego, co w górze, gdzie Chrystus zasiada po prawicy Boga."
"Kol3,2": "Myślcie o tym, co w górze, nie o tym, co na ziemi."
"Kol3,3": "Umarliście bowiem i wasze życie jest ukryte z Chrystusem w Bogu."
"Kol3,4": "Lecz gdy się Chrystus, nasze życie, ukaże, wtedy i wy razem z nim ukażecie się w chwale."
"Kol3,5": "Umartwiajcie więc wasze członki, które są na ziemi: nierząd, nieczystość, namiętność, złe żądze i chciwość, która jest bałwochwalstwem;"
"Kol3,6": "Z powodu których przychodzi gniew Boży na synów nieposłuszeństwa."
"Kol3,7": "I wy niegdyś tak postępowaliście, gdy żyliście w nich."
"Kol3,8": "Lecz teraz i wy odrzućcie to wszystko: gniew, zapalczywość, złośliwość, bluźnierstwo i nieprzyzwoite słowa z waszych ust."
"Kol3,9": "Nie okłamujcie się wzajemnie, skoro zrzuciliście z siebie starego człowieka z jego uczynkami;"
"Kol3,10": "A przyodzialiście się w nowego, który się odnawia w poznaniu na obraz tego, który go stworzył."
"Kol3,11": "Gdzie nie ma Greka ani Żyda, obrzezanego ani nieobrzezanego, cudzoziemca ani Scyty, niewolnika ani wolnego, ale wszystkim i we wszystkich Chrystus."
"Kol3,12": "Tak więc jako wybrani Boga, święci i umiłowani, przyodziejcie się w serdeczne miłosierdzie, dobroć, pokorę, łagodność, cierpliwość;"
"Kol3,13": "Znosząc jedni drugich i przebaczając sobie nawzajem, jeśli ktoś ma skargę przeciw drugiemu: jak i Chrystus przebaczył wam, tak i wy."
"Kol3,14": "A nade wszystko przyodziejcie się w miłość, która jest więzią doskonałości."
"Kol3,15": "A pokój Boży niech rządzi w waszych sercach, do którego też jesteście powołani w jednym ciele. Bądźcie też wdzięczni."
"Kol3,16": "Słowo Chrystusa niech mieszka w was obficie ze wszelką mądrością, nauczajcie i napominajcie się wzajemnie przez psalmy, hymny i pieśni duchowe, z wdzięcznością śpiewając w waszych sercach Panu."
"Kol3,17": "A wszystko, co czynicie w słowie lub w uczynku, wszystko czyńcie w imię Pana Jezusa, dziękując Bogu i Ojcu przez niego."
"Kol3,18": "Żony, bądźcie poddane swym mężom, jak przystoi w Panu."
"Kol3,19": "Mężowie, miłujcie wasze żony i nie bądźcie surowi wobec nich."
"Kol3,20": "Dzieci, bądźcie posłuszne rodzicom we wszystkim, to bowiem podoba się Panu."
"Kol3,21": "Ojcowie, nie pobudzajcie do gniewu waszych dzieci, aby nie upadały na duchu."
"Kol3,22": "Słudzy, bądźcie posłuszni we wszystkim ziemskim panom, nie służąc dla oka, jak ci, którzy chcą się podobać ludziom, lecz w szczerości serca, bojąc się Boga."
"Kol3,23": "A wszystko, co czynicie, z serca czyńcie, jak dla Pana, a nie dla ludzi;"
"Kol3,24": "Wiedząc, że od Pana otrzymacie dziedzictwo jako zapłatę, gdyż służycie Panu Chrystusowi."
"Kol3,25": "A ten, kto wyrządza krzywdę, otrzyma zapłatę za krzywdę, a u Boga nie ma względu na osobę."
