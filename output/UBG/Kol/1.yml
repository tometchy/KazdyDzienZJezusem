"Kol1,1":
  text: "Paweł, apostoł Jezusa Chrystusa z woli Boga, i Tymoteusz, brat;"
  tags: []
"Kol1,2":
  text: "Do świętych i wiernych braci w Chrystusie Jezusie, którzy są w Kolosach. Łaska wam i pokój od Boga, naszego Ojca, i od Pana Jezusa Chrystusa."
  tags: []
"Kol1,3":
  text: "Dziękujemy Bogu i Ojcu naszego Pana Jezusa Chrystusa, nieustannie modląc się za was;"
  tags: []
"Kol1,4":
  text: "Odkąd usłyszeliśmy o waszej wierze w Chrystusa Jezusa i o miłości względem wszystkich świętych;"
  tags: []
"Kol1,5":
  text: "Z powodu nadziei odłożonej dla was w niebie. O niej to przedtem słyszeliście w słowie prawdy ewangelii;"
  tags: []
"Kol1,6":
  text: "Która dotarła do was, jak i na cały świat, i wydaje owoc, tak jak u was od dnia, w którym usłyszeliście i poznaliście łaskę Boga w prawdzie;"
  tags: []
"Kol1,7":
  text: "Jak też nauczyliście się od naszego umiłowanego współsługi Epafrasa, który jest wiernym sługą Chrystusa dla was;"
  tags: []
"Kol1,8":
  text: "Który też oznajmił nam waszą miłość w Duchu."
  tags: []
"Kol1,9":
  text: "Dlatego i my od tego dnia, w którym to usłyszeliśmy, nie przestajemy za was się modlić i prosić, abyście byli napełnieni poznaniem jego woli we wszelkiej mądrości i duchowym zrozumieniu;"
  tags: []
"Kol1,10":
  text: "Abyście postępowali w sposób godny Pana, by podobać mu się we wszystkim, w każdym dobrym uczynku wydając owoc i wzrastając w poznawaniu Boga;"
  tags: []
"Kol1,11":
  text: "Umocnieni wszelką mocą według jego chwalebnej potęgi, ku wszelkiej cierpliwości i wytrwałości z radością;"
  tags: []
"Kol1,12":
  text: "Dziękując Ojcu, który nas uzdolnił do uczestnictwa w dziedzictwie świętych w światłości;"
  tags: []
"Kol1,13":
  text: "Który nas wyrwał z mocy ciemności i przeniósł do królestwa swego umiłowanego Syna;"
  tags: []
"Kol1,14":
  text: "W którym mamy odkupienie przez jego krew, przebaczenie grzechów."
  tags: []
"Kol1,15":
  text: "On jest obrazem Boga niewidzialnego i pierworodnym wszelkiego stworzenia."
  tags: []
"Kol1,16":
  text: "Przez niego bowiem wszystko zostało stworzone, to, co w niebie i to, co na ziemi, to, co widzialne i co niewidzialne, czy trony, czy panowania, czy zwierzchności, czy władze. Wszystko przez niego i dla niego zostało stworzone."
  tags: []
"Kol1,17":
  text: "On jest przed wszystkim i wszystko istnieje dzięki niemu."
  tags: []
"Kol1,18":
  text: "On też jest głową ciała – kościoła; on jest początkiem i pierworodnym z umarłych, aby we wszystkim był pierwszy;"
  tags: []
"Kol1,19":
  text: "Ponieważ upodobał sobie Ojciec, aby w nim zamieszkała cała pełnia;"
  tags: []
"Kol1,20":
  text: "I żeby przez niego pojednał wszystko ze sobą, czyniąc pokój przez krew jego krzyża; przez niego, mówię, to, co jest na ziemi, jak i to, co jest w niebie."
  tags: []
"Kol1,21":
  text: "I was, którzy kiedyś byliście obcymi i wrogami umysłem w niegodziwych uczynkach, teraz pojednał;"
  tags: []
"Kol1,22":
  text: "W jego doczesnym ciele przez śmierć, aby was przedstawić jako świętych, nieskalanych i nienagannych przed swoim obliczem;"
  tags: []
"Kol1,23":
  text: "Jeśli tylko trwacie w wierze, ugruntowani i utwierdzeni, niedający się odwieść od nadziei ewangelii, którą usłyszeliście, a która jest głoszona wszelkiemu stworzeniu pod niebem, której ja, Paweł, stałem się sługą;"
  tags: []
"Kol1,24":
  text: "Teraz raduję się w swoich cierpieniach dla was i tego, czego z udręk Chrystusa brakuje w moim ciele, dopełniam dla jego ciała, którym jest kościół."
  tags: []
"Kol1,25":
  text: "Jego sługą stałem się zgodnie z zarządzeniem Boga, danym mi dla was, abym wypełnił słowo Boże;"
  tags: []
"Kol1,26":
  text: "Tajemnicę, która była ukryta od wieków i pokoleń, ale teraz została objawiona jego świętym;"
  tags: []
"Kol1,27":
  text: "Którym Bóg zechciał oznajmić, jakie jest wśród pogan bogactwo chwały tej tajemnicy, którą jest Chrystus w was, nadzieja chwały."
  tags: []
"Kol1,28":
  text: "Jego to głosimy, napominając każdego człowieka i nauczając każdego człowieka we wszelkiej mądrości, aby każdego człowieka przedstawić doskonałym w Chrystusie Jezusie."
  tags: []
"Kol1,29":
  text: "Nad tym też się trudzę, walcząc według jego mocy, która potężnie działa we mnie."
  tags: []
