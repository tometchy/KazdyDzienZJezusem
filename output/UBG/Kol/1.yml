"Kol1,1": "Paweł, apostoł Jezusa Chrystusa z woli Boga, i Tymoteusz, brat;"
"Kol1,2": "Do świętych i wiernych braci w Chrystusie Jezusie, którzy są w Kolosach. Łaska wam i pokój od Boga, naszego Ojca, i od Pana Jezusa Chrystusa."
"Kol1,3": "Dziękujemy Bogu i Ojcu naszego Pana Jezusa Chrystusa, nieustannie modląc się za was;"
"Kol1,4": "Odkąd usłyszeliśmy o waszej wierze w Chrystusa Jezusa i o miłości względem wszystkich świętych;"
"Kol1,5": "Z powodu nadziei odłożonej dla was w niebie. O niej to przedtem słyszeliście w słowie prawdy ewangelii;"
"Kol1,6": "Która dotarła do was, jak i na cały świat, i wydaje owoc, tak jak u was od dnia, w którym usłyszeliście i poznaliście łaskę Boga w prawdzie;"
"Kol1,7": "Jak też nauczyliście się od naszego umiłowanego współsługi Epafrasa, który jest wiernym sługą Chrystusa dla was;"
"Kol1,8": "Który też oznajmił nam waszą miłość w Duchu."
"Kol1,9": "Dlatego i my od tego dnia, w którym to usłyszeliśmy, nie przestajemy za was się modlić i prosić, abyście byli napełnieni poznaniem jego woli we wszelkiej mądrości i duchowym zrozumieniu;"
"Kol1,10": "Abyście postępowali w sposób godny Pana, by podobać mu się we wszystkim, w każdym dobrym uczynku wydając owoc i wzrastając w poznawaniu Boga;"
"Kol1,11": "Umocnieni wszelką mocą według jego chwalebnej potęgi, ku wszelkiej cierpliwości i wytrwałości z radością;"
"Kol1,12": "Dziękując Ojcu, który nas uzdolnił do uczestnictwa w dziedzictwie świętych w światłości;"
"Kol1,13": "Który nas wyrwał z mocy ciemności i przeniósł do królestwa swego umiłowanego Syna;"
"Kol1,14": "W którym mamy odkupienie przez jego krew, przebaczenie grzechów."
"Kol1,15": "On jest obrazem Boga niewidzialnego i pierworodnym wszelkiego stworzenia."
"Kol1,16": "Przez niego bowiem wszystko zostało stworzone, to, co w niebie i to, co na ziemi, to, co widzialne i co niewidzialne, czy trony, czy panowania, czy zwierzchności, czy władze. Wszystko przez niego i dla niego zostało stworzone."
"Kol1,17": "On jest przed wszystkim i wszystko istnieje dzięki niemu."
"Kol1,18": "On też jest głową ciała – kościoła; on jest początkiem i pierworodnym z umarłych, aby we wszystkim był pierwszy;"
"Kol1,19": "Ponieważ upodobał sobie Ojciec, aby w nim zamieszkała cała pełnia;"
"Kol1,20": "I żeby przez niego pojednał wszystko ze sobą, czyniąc pokój przez krew jego krzyża; przez niego, mówię, to, co jest na ziemi, jak i to, co jest w niebie."
"Kol1,21": "I was, którzy kiedyś byliście obcymi i wrogami umysłem w niegodziwych uczynkach, teraz pojednał;"
"Kol1,22": "W jego doczesnym ciele przez śmierć, aby was przedstawić jako świętych, nieskalanych i nienagannych przed swoim obliczem;"
"Kol1,23": "Jeśli tylko trwacie w wierze, ugruntowani i utwierdzeni, niedający się odwieść od nadziei ewangelii, którą usłyszeliście, a która jest głoszona wszelkiemu stworzeniu pod niebem, której ja, Paweł, stałem się sługą;"
"Kol1,24": "Teraz raduję się w swoich cierpieniach dla was i tego, czego z udręk Chrystusa brakuje w moim ciele, dopełniam dla jego ciała, którym jest kościół."
"Kol1,25": "Jego sługą stałem się zgodnie z zarządzeniem Boga, danym mi dla was, abym wypełnił słowo Boże;"
"Kol1,26": "Tajemnicę, która była ukryta od wieków i pokoleń, ale teraz została objawiona jego świętym;"
"Kol1,27": "Którym Bóg zechciał oznajmić, jakie jest wśród pogan bogactwo chwały tej tajemnicy, którą jest Chrystus w was, nadzieja chwały."
"Kol1,28": "Jego to głosimy, napominając każdego człowieka i nauczając każdego człowieka we wszelkiej mądrości, aby każdego człowieka przedstawić doskonałym w Chrystusie Jezusie."
"Kol1,29": "Nad tym też się trudzę, walcząc według jego mocy, która potężnie działa we mnie."
