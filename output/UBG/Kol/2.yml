"Kol2,1":
  text: "Chcę bowiem, abyście wiedzieli, jak wielką walkę toczę o was, o tych, którzy są w Laodycei, i o tych wszystkich, którzy nie widzieli mego oblicza w ciele;"
  tags: []
"Kol2,2":
  text: "Aby ich serca były pocieszone, będąc zespolone w miłości, a to ku wszelkiemu bogactwu zupełnej pewności zrozumienia, ku poznaniu tajemnicy Boga, Ojca i Chrystusa;"
  tags: []
"Kol2,3":
  text: "W którym są ukryte wszystkie skarby mądrości i poznania."
  tags: []
"Kol2,4":
  text: "A mówię to, aby was nikt nie zwodził podstępnymi słowami."
  tags: []
"Kol2,5":
  text: "Choć bowiem ciałem jestem nieobecny, to jednak duchem jestem z wami i raduję się, widząc wasz porządek i stałość waszej wiary w Chrystusa."
  tags: []
"Kol2,6":
  text: "Jak więc przyjęliście Pana Jezusa Chrystusa, tak w nim postępujcie;"
  tags: []
"Kol2,7":
  text: "Zakorzenieni i zbudowani na nim, i utwierdzeni w wierze, jak was nauczono, obfitując w niej z dziękczynieniem."
  tags: []
"Kol2,8":
  text: "Uważajcie, żeby was ktoś nie obrócił na własną korzyść przez filozofię i próżne oszustwo, oparte na ludzkiej tradycji, na żywiołach świata, a nie na Chrystusie."
  tags: []
"Kol2,9":
  text: "Gdyż w nim mieszka cieleśnie cała pełnia Bóstwa."
  tags: []
"Kol2,10":
  text: "I jesteście dopełnieni w nim, który jest głową wszelkiej zwierzchności i władzy;"
  tags: []
"Kol2,11":
  text: "W nim też zostaliście obrzezani obrzezaniem nie ręką uczynionym, lecz obrzezaniem Chrystusa, przez zrzucenie grzesznego ciała doczesnego;"
  tags: []
"Kol2,12":
  text: "Pogrzebani z nim w chrzcie, w którym też razem z nim zostaliście wskrzeszeni przez wiarę, która jest działaniem Boga, który go wskrzesił z martwych."
  tags: []
"Kol2,13":
  text: "I was, gdy byliście umarłymi w grzechach i w nieobrzezaniu waszego ciała, razem z nim ożywił, przebaczając wam wszystkie grzechy;"
  tags: []
"Kol2,14":
  text: "Wymazał obciążający nas wykaz zawarty w przepisach, który był przeciwko nam, i usunął go z drogi, przybiwszy do krzyża;"
  tags: []
"Kol2,15":
  text: "I rozbroiwszy zwierzchności i władze, jawnie wystawił je na pokaz, gdy przez niego odniósł triumf nad nimi."
  tags: []
"Kol2,16":
  text: "Niech więc nikt was nie osądza z powodu jedzenia lub picia, co do święta, nowiu księżyca lub szabatów."
  tags: []
"Kol2,17":
  text: "Są to cienie rzeczy przyszłych, ciało zaś jest Chrystusa."
  tags: []
"Kol2,18":
  text: "Niech nikt, kto ma upodobanie w poniżaniu siebie i kulcie aniołów, nie pozbawia was nagrody, wdając się w to, czego nie widział, i pyszniąc się bezpodstawnie cielesnym sposobem myślenia;"
  tags: []
"Kol2,19":
  text: "A nie trzyma się głowy, z której całe ciało, odżywiane i wespół zespolone przez stawy i ścięgna, rośnie wzrostem Bożym."
  tags: []
"Kol2,20":
  text: "Jeśli więc umarliście z Chrystusem dla żywiołów tego świata, to dlaczego – jakbyście jeszcze żyli dla świata – poddajecie się nakazom:"
  tags: []
"Kol2,21":
  text: "Nie dotykaj, nie kosztuj, nie ruszaj;"
  tags: []
"Kol2,22":
  text: "(To wszystko niszczeje przez używanie), według przykazań i nauk ludzkich?"
  tags: []
"Kol2,23":
  text: "Mają one pozór mądrości w religijności według własnego upodobania, w poniżaniu siebie i nieoszczędzaniu ciała, jednak nie mają żadnej wartości, służą tylko do nasycenia ciała."
  tags: []
