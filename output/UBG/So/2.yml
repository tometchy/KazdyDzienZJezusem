"So2,1":
  text: "Zbierzcie się, zbierzcie, narodzie wstrętny;"
  tags: []
"So2,2":
  text: "Zanim wyjdzie dekret i dzień przeminie jak plewy; zanim przyjdzie na was zapalczywość gniewu PANA, zanim przyjdzie na was dzień gniewu PANA."
  tags: []
"So2,3":
  text: "Szukajcie PANA, wszyscy pokorni ziemi, którzy wypełniacie jego prawo; szukajcie sprawiedliwości, szukajcie pokory, może ukryjecie się w dniu gniewu PANA."
  tags: []
"So2,4":
  text: "Gaza bowiem będzie opuszczona i Aszkelon spustoszony, Aszdod w południe wyrzucą, a Ekron będzie wykorzeniony."
  tags: []
"So2,5":
  text: "Biada mieszkańcom wybrzeża morskiego, narodowi Keretytów! Słowo PANA jest przeciwko wam, Kanaanie, ziemio Filistynów; wytracę cię tak, że nie będzie żadnego mieszkańca."
  tags: []
"So2,6":
  text: "Wybrzeże morskie będzie przeznaczone na schroniska i budki dla pasterzy, i na zagrody dla trzód."
  tags: []
"So2,7":
  text: "Wybrzeże też przypadnie reszcie domu Judy i będą na nim wypasać. W domach Aszkelonu będą się kłaść wieczorem, gdyż nawiedzi ich PAN, ich Bóg, i odwróci ich niewolę."
  tags: []
"So2,8":
  text: "Słyszałem obelgi Moabu i lżenie synów Ammona, którymi urągali mojemu ludowi i wynosili się na jego granicach."
  tags: []
"So2,9":
  text: "Dlatego jak żyję, mówi PAN zastępów, Bóg Izraela, Moab stanie się jak Sodoma, a synowie Ammona jak Gomora – miejscem pokrzyw, dołem soli i pustynią aż na wieki. Resztka mego ludu złupi ich i pozostali z mego ludu posiądą ich."
  tags: []
"So2,10":
  text: "To ich spotka za ich pychę, gdyż lżyli i wynosili się nad lud PANA zastępów."
  tags: []
"So2,11":
  text: "PAN okaże się dla nich straszny, bo sprawi, że zmarnieją wszyscy bogowie ziemi; i wszystkie wyspy pogan będą mu oddawać pokłon, każdy ze swego miejsca."
  tags: []
"So2,12":
  text: "Wy też, Etiopczycy, będziecie pobici moim mieczem."
  tags: []
"So2,13":
  text: "Wyciągnie bowiem swoją rękę na północ i wytraci Asyrię; zamieni Niniwę w spustoszenie i suchy obszar jak pustynię."
  tags: []
"So2,14":
  text: "I będą się w niej wylegiwać trzody, wszelkie zwierzęta narodów; i pelikan, i bąk na głowicach jej kolumn będą nocować, ich głos będzie słychać w oknach, jej filary spustoszą, gdyż zerwą cedrowe obicie."
  tags: []
"So2,15":
  text: "Takie będzie to wesołe miasto, które mieszkało bezpiecznie i mówiło w swoim sercu: Ja jestem i oprócz mnie nie ma innego. Jakże stało się spustoszeniem, legowiskiem zwierząt! Każdy, kto będzie przechodził obok niego, zaświśnie i machnie ręką."
  tags: []
