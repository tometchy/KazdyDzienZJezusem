"So1,1":
  text: "Słowo PANA, które doszło do Sofoniasza, syna Kusziego, syna Gedaliasza, syna Amariasza, syna Ezechiasza, za dni Jozjasza, syna Amona, króla Judy."
  tags: []
"So1,2":
  text: "Zgładzę całkowicie wszystko z powierzchni tej ziemi, mówi PAN."
  tags: []
"So1,3":
  text: "Zgładzę ludzi i zwierzęta, zgładzę ptactwo niebieskie i ryby morskie, i zgorszenia wraz z bezbożnymi. Wykorzenię człowieka z powierzchni tej ziemi, mówi PAN."
  tags: []
"So1,4":
  text: "Wyciągnę bowiem swoją rękę na Judę i na wszystkich mieszkańców Jerozolimy; wykorzenię z tego miejsca pozostałości Baala i imiona bałwochwalczych kapłanów wraz z kapłanami;"
  tags: []
"So1,5":
  text: "I tych, którzy na dachach oddają pokłon wojsku niebieskiemu; i tych, którzy oddają pokłon, przysięgając na PANA i na Milkoma;"
  tags: []
"So1,6":
  text: "I tych, którzy się odwracają od naśladowania PANA i którzy nie szukali PANA ani o niego nie pytali."
  tags: []
"So1,7":
  text: "Umilknij przed obliczem Pana BOGA, gdyż bliski jest dzień PANA. PAN bowiem przygotował ofiarę i poświęcił swoich zaproszonych."
  tags: []
"So1,8":
  text: "I stanie się w dniu ofiary PANA, że ukarzę książąt i synów króla oraz wszystkich, którzy się ubierają w szaty cudzoziemskie."
  tags: []
"So1,9":
  text: "Ukarzę też w tym dniu tych, którzy przeskakują próg, którzy napełniają domy swoich panów grabieżą i bezprawiem."
  tags: []
"So1,10":
  text: "W tym dniu, mówi PAN, będzie słychać głos wołania od Bramy Rybnej, zawodzenie od drugiej strony miasta i wielki trzask od pagórków."
  tags: []
"So1,11":
  text: "Zawódźcie, mieszkańcy Maktesz, bo będzie zniszczony cały lud kupiecki, będą wykorzenieni wszyscy, którzy noszą srebro."
  tags: []
"So1,12":
  text: "I stanie się w tym czasie, że będę przeszukiwał Jerozolimę z pochodniami i ukarzę mężczyzn, którzy spoczywali na swoich drożdżach, mówiąc w swoim sercu: PAN nie uczyni dobrze ani źle nie uczyni."
  tags: []
"So1,13":
  text: "Dlatego ich mienie będzie łupem, a ich domy – spustoszeniem. Pobudują domy, lecz nie będą w nich mieszkać; zasadzą winnice, ale nie będą pić z nich wina."
  tags: []
"So1,14":
  text: "Bliski jest wielki dzień PANA, bliski jest i bardzo szybko nadchodzi głos dnia PANA. Tam nawet mocarz zawoła gorzko."
  tags: []
"So1,15":
  text: "Ten dzień będzie dniem gniewu, dniem utrapienia i ucisku, dniem ruiny i spustoszenia, dniem ciemności i mroku, dniem obłoku i gęstych chmur;"
  tags: []
"So1,16":
  text: "Dniem trąby i trąbienia przeciwko miastom warownym i przeciwko basztom wysokim."
  tags: []
"So1,17":
  text: "Ścisnę ludzi utrapieniem, tak że będą chodzić jak ślepi, ponieważ zgrzeszyli przeciwko PANU. Ich krew będzie rozlana jak proch, a ich ciała – jak gnój."
  tags: []
"So1,18":
  text: "Ani ich srebro, ani ich złoto nie zdołają ich wybawić w dniu gniewu PANA, bo cała ziemia będzie pożarta ogniem jego zapalczywości. Z pewnością bowiem dokona rychłego końca wszystkich mieszkańców ziemi."
  tags: []
