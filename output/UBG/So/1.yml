"So1,1": "Słowo PANA, które doszło do Sofoniasza, syna Kusziego, syna Gedaliasza, syna Amariasza, syna Ezechiasza, za dni Jozjasza, syna Amona, króla Judy."
"So1,2": "Zgładzę całkowicie wszystko z powierzchni tej ziemi, mówi PAN."
"So1,3": "Zgładzę ludzi i zwierzęta, zgładzę ptactwo niebieskie i ryby morskie, i zgorszenia wraz z bezbożnymi. Wykorzenię człowieka z powierzchni tej ziemi, mówi PAN."
"So1,4": "Wyciągnę bowiem swoją rękę na Judę i na wszystkich mieszkańców Jerozolimy; wykorzenię z tego miejsca pozostałości Baala i imiona bałwochwalczych kapłanów wraz z kapłanami;"
"So1,5": "I tych, którzy na dachach oddają pokłon wojsku niebieskiemu; i tych, którzy oddają pokłon, przysięgając na PANA i na Milkoma;"
"So1,6": "I tych, którzy się odwracają od naśladowania PANA i którzy nie szukali PANA ani o niego nie pytali."
"So1,7": "Umilknij przed obliczem Pana BOGA, gdyż bliski jest dzień PANA. PAN bowiem przygotował ofiarę i poświęcił swoich zaproszonych."
"So1,8": "I stanie się w dniu ofiary PANA, że ukarzę książąt i synów króla oraz wszystkich, którzy się ubierają w szaty cudzoziemskie."
"So1,9": "Ukarzę też w tym dniu tych, którzy przeskakują próg, którzy napełniają domy swoich panów grabieżą i bezprawiem."
"So1,10": "W tym dniu, mówi PAN, będzie słychać głos wołania od Bramy Rybnej, zawodzenie od drugiej strony miasta i wielki trzask od pagórków."
"So1,11": "Zawódźcie, mieszkańcy Maktesz, bo będzie zniszczony cały lud kupiecki, będą wykorzenieni wszyscy, którzy noszą srebro."
"So1,12": "I stanie się w tym czasie, że będę przeszukiwał Jerozolimę z pochodniami i ukarzę mężczyzn, którzy spoczywali na swoich drożdżach, mówiąc w swoim sercu: PAN nie uczyni dobrze ani źle nie uczyni."
"So1,13": "Dlatego ich mienie będzie łupem, a ich domy – spustoszeniem. Pobudują domy, lecz nie będą w nich mieszkać; zasadzą winnice, ale nie będą pić z nich wina."
"So1,14": "Bliski jest wielki dzień PANA, bliski jest i bardzo szybko nadchodzi głos dnia PANA. Tam nawet mocarz zawoła gorzko."
"So1,15": "Ten dzień będzie dniem gniewu, dniem utrapienia i ucisku, dniem ruiny i spustoszenia, dniem ciemności i mroku, dniem obłoku i gęstych chmur;"
"So1,16": "Dniem trąby i trąbienia przeciwko miastom warownym i przeciwko basztom wysokim."
"So1,17": "Ścisnę ludzi utrapieniem, tak że będą chodzić jak ślepi, ponieważ zgrzeszyli przeciwko PANU. Ich krew będzie rozlana jak proch, a ich ciała – jak gnój."
"So1,18": "Ani ich srebro, ani ich złoto nie zdołają ich wybawić w dniu gniewu PANA, bo cała ziemia będzie pożarta ogniem jego zapalczywości. Z pewnością bowiem dokona rychłego końca wszystkich mieszkańców ziemi."
