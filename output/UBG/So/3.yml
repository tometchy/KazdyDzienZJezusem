"So3,1":
  text: "Biada brudnemu i splugawionemu miastu ucisku!"
  tags: []
"So3,2":
  text: "Nie słuchało głosu ani nie przyjmuje upomnienia, nie zaufało PANU, nie zbliżyło się do swego Boga."
  tags: []
"So3,3":
  text: "Jego książęta pośrodku niego są lwami ryczącymi, jego sędziowie są wilkami nocnymi, które nie gryzą kości aż do rana."
  tags: []
"So3,4":
  text: "Jego prorocy są lekkomyślni, to ludzie przewrotni; jego kapłani zbezcześcili świątynię, pogwałcili prawo."
  tags: []
"So3,5":
  text: "PAN sprawiedliwy jest pośród niego, nie czyni nieprawości; każdego poranka wystawia swój sąd na światłość i nie zawodzi; lecz złośnik nie zna wstydu."
  tags: []
"So3,6":
  text: "Wykorzeniłem narody, ich baszty są spustoszone, spustoszyłem ich ulice, tak że nikt nie przechodzi. Ich miasta są zniszczone, tak że nie ma ani człowieka, ani żadnego mieszkańca."
  tags: []
"So3,7":
  text: "Powiedziałem: Teraz na pewno będziesz się mnie bać, przyjmiesz upomnienie, aby nie zostało zniszczone twoje mieszkanie, jakkolwiek cię ukarzę. Ale wstali rano i psuli wszystkie swoje czyny."
  tags: []
"So3,8":
  text: "Dlatego oczekujcie mnie, mówi PAN, do dnia, w którym powstanę do łupu. Postanowiłem bowiem zebrać narody i zgromadzić królestwa, aby wylać na nie swoje rozgniewanie, całą zapalczywość swojego gniewu. Zaprawdę, cała ziemia będzie pożarta ogniem mojej gorliwości."
  tags: []
"So3,9":
  text: "Wówczas bowiem przywrócę narodom czyste wargi, aby wszyscy wzywali imienia PANA i służyli mu jednomyślnie."
  tags: []
"So3,10":
  text: "Zza rzek Etiopii przyniosą mi dary moi czciciele, córa moich rozproszonych."
  tags: []
"So3,11":
  text: "W tym dniu nie zawstydzisz się z powodu wszystkich twoich uczynków, którymi wystąpiłeś przeciwko mnie. Wtedy bowiem usunę spośród ciebie tych, którzy chełpią się twoją sławą, i już nie będziesz się wywyższać na mojej świętej górze."
  tags: []
"So3,12":
  text: "I pozostawię pośród ciebie lud ubogi i nędzny, i będzie ufać imieniu PANA."
  tags: []
"So3,13":
  text: "Resztka Izraela nie będzie czynić nieprawości ani nie będzie mówić kłamstwa; nie znajdzie się w jej ustach język zdradliwy. Ale będzie się paść i odpoczywać, a nikt nie będzie jej straszyć."
  tags: []
"So3,14":
  text: "Zaśpiewaj, córko Syjonu! Wykrzykuj, Izraelu! Ciesz się i raduj z całego serca, córko Jerozolimy!"
  tags: []
"So3,15":
  text: "PAN oddalił twoje sądy, usunął twojego wroga. Król Izraela, PAN, jest pośród ciebie. Nie będziesz już oglądał zła."
  tags: []
"So3,16":
  text: "W tym dniu powiedzą do Jerozolimy: Nie bój się! A do Syjonu: Niech nie mdleją twoje ręce!"
  tags: []
"So3,17":
  text: "PAN, twój Bóg, pośród ciebie jest potężny; on cię zbawi i rozraduje się wielce nad tobą; będzie się cieszyć ze swojej miłości wobec ciebie i rozweseli się nad tobą ze śpiewaniem, mówiąc:"
  tags: []
"So3,18":
  text: "Zbiorę tęskniących za uroczystym zgromadzeniem, bo wśród ciebie są też smutni z powodu brzemienia zniewagi włożonego na ciebie."
  tags: []
"So3,19":
  text: "Oto w tym czasie uczynię kres wszystkim, którzy cię trapią, a zbawię chromą i zgromadzę wygnaną; okryję ich chwałą i imieniem w całej ziemi, w której doznawali hańby."
  tags: []
"So3,20":
  text: "W tym czasie przyprowadzę was, w tym czasie, mówię, zgromadzę was. Dam wam bowiem imię i chwałę pośród wszystkich narodów ziemi, gdy na waszych oczach odwrócę waszą niewolę – mówi PAN."
  tags: []
