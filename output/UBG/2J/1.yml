"2J1,1": "Starszy do wybranej pani i do jej dzieci, które miłuję w prawdzie, a nie tylko ja, ale i wszyscy, którzy poznali prawdę;"
"2J1,2": "Ze względu na prawdę, która pozostaje w nas i będzie z nami na wieki."
"2J1,3": "Łaska, miłosierdzie i pokój od Boga Ojca i od Pana Jezusa Chrystusa, Syna Ojca, niech będzie z wami w prawdzie i miłości."
"2J1,4": "Ucieszyłem się bardzo, że wśród twoich dzieci znalazłem takie, które postępują w prawdzie, jak otrzymaliśmy przykazanie od Ojca."
"2J1,5": "A teraz proszę cię, pani, nie piszę ci jako nowe przykazanie, ale jako to, które mieliśmy od początku, abyśmy się wzajemnie miłowali."
"2J1,6": "A na tym polega miłość, żebyśmy postępowali według jego przykazań. A przykazanie jest takie, jak słyszeliście od początku, że macie według niego postępować."
"2J1,7": "Gdyż pojawiło się na świecie wielu zwodzicieli, którzy nie uznają, że Jezus Chrystus przyszedł w ciele. Taki jest zwodzicielem i antychrystem."
"2J1,8": "Miejcie się na baczności, żebyśmy nie stracili tego, nad czym pracowaliśmy, ale żebyśmy otrzymali pełną zapłatę."
"2J1,9": "Każdy, kto wykracza poza naukę Chrystusa, a nie pozostaje w niej, ten nie ma Boga. Kto pozostaje w nauce Chrystusa, ten ma i Ojca, i Syna."
"2J1,10": "Jeśli ktoś przychodzi do was i nie przynosi tej nauki, nie przyjmujcie go do domu ani go nie pozdrawiajcie."
"2J1,11": "Kto bowiem takiego pozdrawia, staje się uczestnikiem jego złych uczynków."
"2J1,12": "Mam wam wiele do napisania, ale nie chcę posługiwać się papierem i atramentem. Mam jednak nadzieję, że przybędę do was i porozmawiam z wami osobiście, aby nasza radość była pełna."
"2J1,13": "Pozdrawiają cię dzieci twojej wybranej siostry. Amen."
