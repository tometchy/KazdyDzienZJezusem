"2J1,1":
  text: "Starszy do wybranej pani i do jej dzieci, które miłuję w prawdzie, a nie tylko ja, ale i wszyscy, którzy poznali prawdę;"
  tags: []
"2J1,2":
  text: "Ze względu na prawdę, która pozostaje w nas i będzie z nami na wieki."
  tags: []
"2J1,3":
  text: "Łaska, miłosierdzie i pokój od Boga Ojca i od Pana Jezusa Chrystusa, Syna Ojca, niech będzie z wami w prawdzie i miłości."
  tags: []
"2J1,4":
  text: "Ucieszyłem się bardzo, że wśród twoich dzieci znalazłem takie, które postępują w prawdzie, jak otrzymaliśmy przykazanie od Ojca."
  tags: []
"2J1,5":
  text: "A teraz proszę cię, pani, nie piszę ci jako nowe przykazanie, ale jako to, które mieliśmy od początku, abyśmy się wzajemnie miłowali."
  tags: []
"2J1,6":
  text: "A na tym polega miłość, żebyśmy postępowali według jego przykazań. A przykazanie jest takie, jak słyszeliście od początku, że macie według niego postępować."
  tags: []
"2J1,7":
  text: "Gdyż pojawiło się na świecie wielu zwodzicieli, którzy nie uznają, że Jezus Chrystus przyszedł w ciele. Taki jest zwodzicielem i antychrystem."
  tags: []
"2J1,8":
  text: "Miejcie się na baczności, żebyśmy nie stracili tego, nad czym pracowaliśmy, ale żebyśmy otrzymali pełną zapłatę."
  tags: []
"2J1,9":
  text: "Każdy, kto wykracza poza naukę Chrystusa, a nie pozostaje w niej, ten nie ma Boga. Kto pozostaje w nauce Chrystusa, ten ma i Ojca, i Syna."
  tags: []
"2J1,10":
  text: "Jeśli ktoś przychodzi do was i nie przynosi tej nauki, nie przyjmujcie go do domu ani go nie pozdrawiajcie."
  tags: []
"2J1,11":
  text: "Kto bowiem takiego pozdrawia, staje się uczestnikiem jego złych uczynków."
  tags: []
"2J1,12":
  text: "Mam wam wiele do napisania, ale nie chcę posługiwać się papierem i atramentem. Mam jednak nadzieję, że przybędę do was i porozmawiam z wami osobiście, aby nasza radość była pełna."
  tags: []
"2J1,13":
  text: "Pozdrawiają cię dzieci twojej wybranej siostry. Amen."
  tags: []
