"Kaz8,1":
  text: "Kto jest mądrym człowiekiem? Kto zna wyjaśnienie rzeczy? Mądrość człowieka rozjaśnia jego oblicze i odmienia srogość jego twarzy."
  tags: []
"Kaz8,2":
  text: "Radzę ci, abyś przestrzegał rozkazu króla, a to ze względu na przysięgę Boga."
  tags: []
"Kaz8,3":
  text: "Nie spiesz się z odejściem sprzed jego oblicza ani nie upieraj się przy złej sprawie. Czyni bowiem wszystko tak, jak mu się podoba."
  tags: []
"Kaz8,4":
  text: "Gdzie słowo króla, tam i jego moc. Któż mu powie: Co czynisz?"
  tags: []
"Kaz8,5":
  text: "Kto przestrzega przykazania, nie zazna niczego złego. A serce mądrego zna czas i sąd."
  tags: []
"Kaz8,6":
  text: "Na każdą sprawę jest czas i sąd, dlatego wielkie nieszczęście trzyma się człowieka."
  tags: []
"Kaz8,7":
  text: "Nie wie bowiem, co będzie. Kto mu oznajmi, kiedy co się przydarzy?"
  tags: []
"Kaz8,8":
  text: "Nie ma człowieka, który miałby władzę nad duchem, żeby powstrzymać ducha, ani moc nad dniem śmierci. Nie ma też zwolnienia z tego boju, a niegodziwych nie wybawi ich niegodziwość."
  tags: []
"Kaz8,9":
  text: "To wszystko widziałem, gdy zwróciłem swoje serce do każdego dzieła, którego się dokonuje pod słońcem. Bywa czas, kiedy jeden człowiek panuje nad drugim ku jego krzywdzie."
  tags: []
"Kaz8,10":
  text: "Widziałem więc niegodziwych pogrzebanych, którzy przychodzili do miejsca świętego i odchodzili z niego, a zapomniano o nich w mieście, gdzie tak czynili. I to również jest marnością."
  tags: []
"Kaz8,11":
  text: "Ponieważ wyroku za zły czyn nie wykonuje się od razu, serce synów ludzkich jest w nich zawzięte i gotowe na to, aby popełniali zło."
  tags: []
"Kaz8,12":
  text: "I chociaż grzesznik po stokroć czyni zło i jego dni się przedłużą, to jednak wiem, że szczęści się tym, którzy boją się Boga, którzy się boją jego oblicza."
  tags: []
"Kaz8,13":
  text: "Ale niegodziwemu nie szczęści się i nie przedłuży on swoich dni, przeminą bowiem jak cień, ponieważ nie boi się Boga."
  tags: []
"Kaz8,14":
  text: "Jest też marność, która się dzieje na ziemi: są ludzie sprawiedliwi, którym się zdarza to, na co zasługują uczynki niegodziwych; są też ludzie niegodziwi, którym się zdarza to, na co zasługują uczynki sprawiedliwych. Powiedziałem, że i to jest marnością."
  tags: []
"Kaz8,15":
  text: "Chwaliłem więc radość, gdyż nie ma dla człowieka nic lepszego pod słońcem nad to, by jadł, pił i radował się. To bowiem zostanie mu z jego trudu po wszystkie dni jego życia, które pod słońcem dał mu Bóg."
  tags: []
"Kaz8,16":
  text: "Gdy zwróciłem swoje serce na to, aby poznać mądrość i rozważać sprawy, jakie się dzieją na ziemi, z powodu których oczy człowieka nie zaznają snu ani we dnie, ani w nocy;"
  tags: []
"Kaz8,17":
  text: "Wówczas zobaczyłem całe dzieło Boga – to, że człowiek nie potrafi zgłębić sprawy, która się dzieje pod słońcem. Choćby człowiek starał się do tego dojść, nie zgłębi tego; choćby nawet mądry zamierzył to poznać, nie zdoła tego zgłębić."
  tags: []
