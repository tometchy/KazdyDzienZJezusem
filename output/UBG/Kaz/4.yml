"Kaz4,1":
  text: "Potem zwróciłem się w stronę wszystkich ucisków, jakie zdarzają się pod słońcem, i przyjrzałem się im. I oto widziałem łzy uciśnionych, a nie mieli pocieszyciela. Siła była w rękach ciemięzców, a tamci nie mieli pocieszyciela."
  tags: []
"Kaz4,2":
  text: "Dlatego chwaliłem umarłych, którzy już odeszli, bardziej niż żywych, którzy jeszcze żyją."
  tags: []
"Kaz4,3":
  text: "Nawet lepszy od nich obu jest ten, którego jeszcze nie było i który nie widział zła, jakie się dzieje pod słońcem."
  tags: []
"Kaz4,4":
  text: "Zobaczyłem też, że wszelka praca i każde dobre dzieło wywołują tylko zazdrość jednego wobec drugiego. Także i to jest marnością i utrapieniem ducha."
  tags: []
"Kaz4,5":
  text: "Głupi składa swoje ręce i zjada własne ciało."
  tags: []
"Kaz4,6":
  text: "Lepsza jest pełna garść z pokojem niż obie pełne garści z trudem i utrapieniem ducha."
  tags: []
"Kaz4,7":
  text: "Znowu obróciłem się i zobaczyłem kolejną marność pod słońcem."
  tags: []
"Kaz4,8":
  text: "Jest to człowiek samotny, bez towarzysza, nie ma ani syna, ani brata i nie ma końca wszelki jego trud, a jego oczy nie mogą nasycić się bogactwem. Nie myśli: Dla kogo ja pracuję i odmawiam dobra swojej duszy? Także i to jest marnością i ciężką udręką."
  tags: []
"Kaz4,9":
  text: "Lepiej jest dwom niż jednemu, gdyż mają dobry pożytek ze swojej pracy."
  tags: []
"Kaz4,10":
  text: "Jeśli bowiem jeden upadnie, drugi podniesie swego towarzysza. Lecz biada samotnemu, gdy upadnie, bo nie ma drugiego, który by go podniósł."
  tags: []
"Kaz4,11":
  text: "Także jeśli dwoje ludzi śpi razem, grzeją się wzajemnie. Ale jeden jakże się ogrzeje?"
  tags: []
"Kaz4,12":
  text: "A jeśli kto przemaga jednego, to dwaj stawią mu czoła, a potrójny sznur nie rozerwie się tak łatwo."
  tags: []
"Kaz4,13":
  text: "Lepszy jest chłopiec ubogi i mądry niż król stary i głupi, który nie potrafi już przyjmować napomnienia."
  tags: []
"Kaz4,14":
  text: "Bo tamten wychodzi z więzienia, aby królować, a ten urodzony w swoim królestwie zubożeje."
  tags: []
"Kaz4,15":
  text: "Widziałem, jak wszyscy żyjący, którzy chodzą pod słońcem, przestawali z chłopcem, potomkiem, który miał wstąpić na miejsce tamtego."
  tags: []
"Kaz4,16":
  text: "Niezliczony jest cały lud, jaki żył przed nimi. Lecz następni nie będą się z niego cieszyć. A tak i to jest marność i utrapienie ducha."
  tags: []
