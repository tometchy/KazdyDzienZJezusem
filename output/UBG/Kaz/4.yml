"Kaz4,1": "Potem zwróciłem się w stronę wszystkich ucisków, jakie zdarzają się pod słońcem, i przyjrzałem się im. I oto widziałem łzy uciśnionych, a nie mieli pocieszyciela. Siła była w rękach ciemięzców, a tamci nie mieli pocieszyciela."
"Kaz4,2": "Dlatego chwaliłem umarłych, którzy już odeszli, bardziej niż żywych, którzy jeszcze żyją."
"Kaz4,3": "Nawet lepszy od nich obu jest ten, którego jeszcze nie było i który nie widział zła, jakie się dzieje pod słońcem."
"Kaz4,4": "Zobaczyłem też, że wszelka praca i każde dobre dzieło wywołują tylko zazdrość jednego wobec drugiego. Także i to jest marnością i utrapieniem ducha."
"Kaz4,5": "Głupi składa swoje ręce i zjada własne ciało."
"Kaz4,6": "Lepsza jest pełna garść z pokojem niż obie pełne garści z trudem i utrapieniem ducha."
"Kaz4,7": "Znowu obróciłem się i zobaczyłem kolejną marność pod słońcem."
"Kaz4,8": "Jest to człowiek samotny, bez towarzysza, nie ma ani syna, ani brata i nie ma końca wszelki jego trud, a jego oczy nie mogą nasycić się bogactwem. Nie myśli: Dla kogo ja pracuję i odmawiam dobra swojej duszy? Także i to jest marnością i ciężką udręką."
"Kaz4,9": "Lepiej jest dwom niż jednemu, gdyż mają dobry pożytek ze swojej pracy."
"Kaz4,10": "Jeśli bowiem jeden upadnie, drugi podniesie swego towarzysza. Lecz biada samotnemu, gdy upadnie, bo nie ma drugiego, który by go podniósł."
"Kaz4,11": "Także jeśli dwoje ludzi śpi razem, grzeją się wzajemnie. Ale jeden jakże się ogrzeje?"
"Kaz4,12": "A jeśli kto przemaga jednego, to dwaj stawią mu czoła, a potrójny sznur nie rozerwie się tak łatwo."
"Kaz4,13": "Lepszy jest chłopiec ubogi i mądry niż król stary i głupi, który nie potrafi już przyjmować napomnienia."
"Kaz4,14": "Bo tamten wychodzi z więzienia, aby królować, a ten urodzony w swoim królestwie zubożeje."
"Kaz4,15": "Widziałem, jak wszyscy żyjący, którzy chodzą pod słońcem, przestawali z chłopcem, potomkiem, który miał wstąpić na miejsce tamtego."
"Kaz4,16": "Niezliczony jest cały lud, jaki żył przed nimi. Lecz następni nie będą się z niego cieszyć. A tak i to jest marność i utrapienie ducha."
