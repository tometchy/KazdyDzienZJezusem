"Kaz9,1":
  text: "Zaprawdę, wszystko to rozważałem w swoim sercu po to, aby to wszystko wyjaśnić – że sprawiedliwi i mądrzy oraz ich dzieła są w rękach Boga. Człowiek nie zna ani miłości, ani nienawiści ze wszystkich rzeczy, które są przed nim."
  tags: []
"Kaz9,2":
  text: "Wszystkich spotyka to samo: ten sam los spotyka sprawiedliwego i niegodziwego, dobrego i czystego, i nieczystego, składającego ofiary i tego, który nie składa ofiar, zarówno dobrego, jak i grzesznika, przysięgającego i tego, kto boi się przysięgi."
  tags: []
"Kaz9,3":
  text: "Jest takie zło we wszystkim, co się dzieje pod słońcem: jeden los spotyka wszystkich. A przy tym serce synów ludzkich jest pełne zła, a głupota znajduje się w ich sercach, póki żyją, a potem idą do zmarłych."
  tags: []
"Kaz9,4":
  text: "Ktokolwiek bowiem jest złączony ze wszystkimi żyjącymi, ma nadzieję, gdyż lepszy jest żywy pies niż zdechły lew."
  tags: []
"Kaz9,5":
  text: "Żyjący bowiem wiedzą, że umrą, ale umarli o niczym nie wiedzą i nie mają już żadnej zapłaty, gdyż pamięć o nich uległa zapomnieniu."
  tags: []
"Kaz9,6":
  text: "Tak samo ich miłość, nienawiść i zazdrość już zginęły. I już nigdy więcej nie będą mieć działu we wszystkim, co się dzieje pod słońcem."
  tags: []
"Kaz9,7":
  text: "Idź więc, jedz z radością swój chleb i pij z wesołym sercem swe wino, gdyż Bóg już przyjął twoje dzieła."
  tags: []
"Kaz9,8":
  text: "Niech twoje szaty będą zawsze białe i niech nie zabraknie olejku na twoją głowę."
  tags: []
"Kaz9,9":
  text: "Ciesz się życiem z żoną, którą ukochałeś po wszystkie dni swego marnego życia, jakie dał ci Bóg pod słońcem, po wszystkie dni swojej marności. To jest bowiem twój dział w życiu i w trudzie, który podejmujesz pod słońcem."
  tags: []
"Kaz9,10":
  text: "Wszystko, cokolwiek twoja ręka postanowi czynić, czyń z całej swojej siły; nie ma bowiem żadnej pracy ani zamysłu, ani wiedzy, ani mądrości w grobie, do którego zmierzasz."
  tags: []
"Kaz9,11":
  text: "Potem obróciłem się i widziałem pod słońcem, że bieg nie należy do szybkich ani wojna do dzielnych, ani żywność do mądrych, ani bogactwo do roztropnych, ani łaska do zdolnych, lecz czas i przypadek spotyka wszystkich."
  tags: []
"Kaz9,12":
  text: "Człowiek bowiem nie zna swojego czasu, ale jak ryby, które się łowi szkodliwą siecią, i jak ptaki chwytane w sidła, tak synowie ludzcy są uwikłani w złej chwili, gdy ta nagle na nich spadnie."
  tags: []
"Kaz9,13":
  text: "Widziałem również tę mądrość pod słońcem, która wydała mi się wielka:"
  tags: []
"Kaz9,14":
  text: "Było małe miasto, a w nim niewielu ludzi. I wyruszył przeciw niemu potężny król, obległ je i zbudował przeciwko niemu wielkie wały."
  tags: []
"Kaz9,15":
  text: "I znalazł się w nim człowiek ubogi i mądry, który wybawił to miasto przez swoją mądrość. Nikt jednak nie pamiętał tego ubogiego człowieka."
  tags: []
"Kaz9,16":
  text: "I powiedziałem: Lepsza jest mądrość niż siła. Lecz mądrość ubogiego bywa wzgardzona i jego słów nikt nie słucha."
  tags: []
"Kaz9,17":
  text: "Spokojnych słów ludzi mądrych należy słuchać bardziej niż krzyku tego, który panuje wśród głupców."
  tags: []
"Kaz9,18":
  text: "Lepsza jest mądrość niż oręż wojenny, ale jeden grzesznik niszczy wiele dobrego."
  tags: []
