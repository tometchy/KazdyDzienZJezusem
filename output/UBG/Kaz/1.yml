"Kaz1,1": "Słowa Kaznodziei, syna Dawida, króla w Jerozolimie."
"Kaz1,2": "Marność nad marnościami – mówi Kaznodzieja – marność nad marnościami. Wszystko jest marnością."
"Kaz1,3": "Jaki pożytek ma człowiek z całego swego trudu, który podejmuje pod słońcem?"
"Kaz1,4": "Jedno pokolenie przemija, drugie pokolenie przychodzi, lecz ziemia trwa na wieki."
"Kaz1,5": "Słońce wschodzi i słońce zachodzi, i spieszy do swego miejsca, z którego znów wschodzi."
"Kaz1,6": "Wiatr idzie na południe i zawraca na północ, krąży nieustannie i znowu wraca na drogę swego krążenia."
"Kaz1,7": "Wszystkie rzeki płyną do morza, lecz morze się nie przepełnia; do miejsca, z którego rzeki płyną, znowu wracają."
"Kaz1,8": "Wszystkie rzeczy są pełne trudu, a człowiek nie zdoła tego wyrazić. Oko nie nasyci się patrzeniem ani ucho nie napełni się słuchaniem."
"Kaz1,9": "To, co było, jest tym, co będzie; a to, co się stało, jest tym, co się stanie. I nie ma nic nowego pod słońcem."
"Kaz1,10": "Czy jest coś, o czym można by powiedzieć: Patrz, to jest coś nowego? I to już było w dawnych czasach, które były przed nami."
"Kaz1,11": "Nie ma pamięci o dawnych rzeczach; także o tych, które będą, nie będzie pamięci u tych, którzy potem nastaną."
"Kaz1,12": "Ja, Kaznodzieja, byłem królem nad Izraelem w Jerozolimie."
"Kaz1,13": "I przyłożyłem się w swoim sercu do tego, aby mądrością szukać wszystkiego i wybadać wszystko, co się dzieje pod niebem. To uciążliwe zadanie Bóg dał synom ludzkim, aby się nim trudzili."
"Kaz1,14": "Widziałem wszystkie sprawy, jakie się dzieją pod słońcem, a oto wszystko jest marnością i utrapieniem ducha."
"Kaz1,15": "Tego, co krzywe, nie da się wyprostować, a tego, czego brak, nie da się policzyć."
"Kaz1,16": "Tak więc pomyślałem w swoim sercu: Oto wzbogaciłem się i dano mi więcej mądrości niż wszystkim, którzy byli przede mną w Jerozolimie. I moje serce doświadczyło wielkiej mądrości i wiedzy."
"Kaz1,17": "I przyłożyłem się w swoim sercu do tego, aby poznać mądrość, a także by poznać szaleństwo i głupotę. Ale poznałem, że i to jest utrapieniem ducha."
"Kaz1,18": "Gdzie bowiem jest wiele mądrości, tam jest wiele smutku. A kto przysparza wiedzy, przysparza i cierpienia."
