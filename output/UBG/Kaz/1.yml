"Kaz1,1":
  text: "Słowa Kaznodziei, syna Dawida, króla w Jerozolimie."
  tags: []
"Kaz1,2":
  text: "Marność nad marnościami – mówi Kaznodzieja – marność nad marnościami. Wszystko jest marnością."
  tags: []
"Kaz1,3":
  text: "Jaki pożytek ma człowiek z całego swego trudu, który podejmuje pod słońcem?"
  tags: []
"Kaz1,4":
  text: "Jedno pokolenie przemija, drugie pokolenie przychodzi, lecz ziemia trwa na wieki."
  tags: []
"Kaz1,5":
  text: "Słońce wschodzi i słońce zachodzi, i spieszy do swego miejsca, z którego znów wschodzi."
  tags: []
"Kaz1,6":
  text: "Wiatr idzie na południe i zawraca na północ, krąży nieustannie i znowu wraca na drogę swego krążenia."
  tags: []
"Kaz1,7":
  text: "Wszystkie rzeki płyną do morza, lecz morze się nie przepełnia; do miejsca, z którego rzeki płyną, znowu wracają."
  tags: []
"Kaz1,8":
  text: "Wszystkie rzeczy są pełne trudu, a człowiek nie zdoła tego wyrazić. Oko nie nasyci się patrzeniem ani ucho nie napełni się słuchaniem."
  tags: []
"Kaz1,9":
  text: "To, co było, jest tym, co będzie; a to, co się stało, jest tym, co się stanie. I nie ma nic nowego pod słońcem."
  tags: []
"Kaz1,10":
  text: "Czy jest coś, o czym można by powiedzieć: Patrz, to jest coś nowego? I to już było w dawnych czasach, które były przed nami."
  tags: []
"Kaz1,11":
  text: "Nie ma pamięci o dawnych rzeczach; także o tych, które będą, nie będzie pamięci u tych, którzy potem nastaną."
  tags: []
"Kaz1,12":
  text: "Ja, Kaznodzieja, byłem królem nad Izraelem w Jerozolimie."
  tags: []
"Kaz1,13":
  text: "I przyłożyłem się w swoim sercu do tego, aby mądrością szukać wszystkiego i wybadać wszystko, co się dzieje pod niebem. To uciążliwe zadanie Bóg dał synom ludzkim, aby się nim trudzili."
  tags: []
"Kaz1,14":
  text: "Widziałem wszystkie sprawy, jakie się dzieją pod słońcem, a oto wszystko jest marnością i utrapieniem ducha."
  tags: []
"Kaz1,15":
  text: "Tego, co krzywe, nie da się wyprostować, a tego, czego brak, nie da się policzyć."
  tags: []
"Kaz1,16":
  text: "Tak więc pomyślałem w swoim sercu: Oto wzbogaciłem się i dano mi więcej mądrości niż wszystkim, którzy byli przede mną w Jerozolimie. I moje serce doświadczyło wielkiej mądrości i wiedzy."
  tags: []
"Kaz1,17":
  text: "I przyłożyłem się w swoim sercu do tego, aby poznać mądrość, a także by poznać szaleństwo i głupotę. Ale poznałem, że i to jest utrapieniem ducha."
  tags: []
"Kaz1,18":
  text: "Gdzie bowiem jest wiele mądrości, tam jest wiele smutku. A kto przysparza wiedzy, przysparza i cierpienia."
  tags: []
