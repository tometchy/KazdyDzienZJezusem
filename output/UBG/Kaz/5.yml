"Kaz5,1": "Pilnuj swoich kroków, gdy idziesz do domu Bożego, i bądź skłonny raczej ku temu, aby słuchać, niż dawać ofiarę głupich. Nie wiedzą oni bowiem, że źle czynią."
"Kaz5,2": "Nie mów pochopnie i niech twoje serce nie wypowiada pospiesznie słów przed Bogiem. Bóg bowiem jest w niebie, a ty na ziemi. Niech więc niewiele będzie twoich słów."
"Kaz5,3": "Bo z wielu zajęć przychodzi sen, a mowa głupca z wielu słów."
"Kaz5,4": "Gdy złożysz Bogu jakiś ślub, nie zwlekaj z jego wypełnieniem, gdyż w głupcach nie ma on upodobania. Cokolwiek ślubujesz, wypełnij."
"Kaz5,5": "Lepiej jest nie ślubować, niż ślubować i tego nie wypełnić."
"Kaz5,6": "Nie pozwól, by twoje usta przywiodły do grzechu twoje ciało i nie mów przed aniołem, że to był błąd. Dlaczego Bóg miałby się gniewać na twoje słowa i obrócić wniwecz dzieło twoich rąk?"
"Kaz5,7": "Gdzie bowiem jest wiele snów, tam też wiele słów i marności. Ale ty bój się Boga."
"Kaz5,8": "Jeśli widzisz w prowincji ucisk ubogiego i wypaczanie sądu i sprawiedliwości, nie dziw się temu, gdyż ten, który jest wyższy od najwyższych, czuwa, a są wyżsi od nich."
"Kaz5,9": "Korzyści z ziemi służą wszystkim. Nawet królowi służy pole."
"Kaz5,10": "Kto kocha pieniądze, nie nasyci się pieniędzmi, a kto kocha bogactwa, nie będzie miał z nich pożytku. Także i to jest marnością."
"Kaz5,11": "Gdy dobra się mnożą, mnożą się też ci, którzy je zjadają. Cóż więc za pożytek ma z tego właściciel? Jedynie to, że patrzy na nie swoimi oczami."
"Kaz5,12": "Słodki jest sen robotnika, czy je mało, czy dużo, ale obfitość bogatego nie daje mu spać."
"Kaz5,13": "Jest ciężka bieda, którą widziałem pod słońcem: bogactwo przechowywane dla właściciela na jego własną szkodę."
"Kaz5,14": "Takie bogactwo bowiem przepada przez złe zajęcia. A syn, którego spłodzi, nie będzie miał nic w swoich rękach."
"Kaz5,15": "Jak wyszedł z łona swojej matki, tak też nagi wróci, jak przyszedł, i nie zabierze nic ze swojej pracy, co mógłby wziąć do ręki."
"Kaz5,16": "Także i to jest ciężką niedolą, że jak przyszedł, tak odejdzie. Cóż więc za pożytek, że trudził się na wiatr?"
"Kaz5,17": "Po wszystkie swoje dni jadał w ciemności, smutku, chorobie i gniewie."
"Kaz5,18": "Oto co zobaczyłem: rzecz dobra i piękna to jeść i pić, i cieszyć się dobrem ze wszelkiego swego trudu, który człowiek podejmuje pod słońcem po wszystkie dni swego życia, jakie dał mu Bóg. To bowiem jest jego działem."
"Kaz5,19": "Dla każdego też człowieka, któremu Bóg dał majątek i bogactwo, i dał mu możliwość, by z nich korzystał i odbierał swój dział i radował się ze swojego trudu – to jest dar Boga."
"Kaz5,20": "Nie będzie bowiem wiele pamiętał o dniach swego życia, gdyż Bóg go wysłuchuje, napełniając jego serce radością."
