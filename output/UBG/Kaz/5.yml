"Kaz5,1":
  text: "Pilnuj swoich kroków, gdy idziesz do domu Bożego, i bądź skłonny raczej ku temu, aby słuchać, niż dawać ofiarę głupich. Nie wiedzą oni bowiem, że źle czynią."
  tags: []
"Kaz5,2":
  text: "Nie mów pochopnie i niech twoje serce nie wypowiada pospiesznie słów przed Bogiem. Bóg bowiem jest w niebie, a ty na ziemi. Niech więc niewiele będzie twoich słów."
  tags: []
"Kaz5,3":
  text: "Bo z wielu zajęć przychodzi sen, a mowa głupca z wielu słów."
  tags: []
"Kaz5,4":
  text: "Gdy złożysz Bogu jakiś ślub, nie zwlekaj z jego wypełnieniem, gdyż w głupcach nie ma on upodobania. Cokolwiek ślubujesz, wypełnij."
  tags: []
"Kaz5,5":
  text: "Lepiej jest nie ślubować, niż ślubować i tego nie wypełnić."
  tags: []
"Kaz5,6":
  text: "Nie pozwól, by twoje usta przywiodły do grzechu twoje ciało i nie mów przed aniołem, że to był błąd. Dlaczego Bóg miałby się gniewać na twoje słowa i obrócić wniwecz dzieło twoich rąk?"
  tags: []
"Kaz5,7":
  text: "Gdzie bowiem jest wiele snów, tam też wiele słów i marności. Ale ty bój się Boga."
  tags: []
"Kaz5,8":
  text: "Jeśli widzisz w prowincji ucisk ubogiego i wypaczanie sądu i sprawiedliwości, nie dziw się temu, gdyż ten, który jest wyższy od najwyższych, czuwa, a są wyżsi od nich."
  tags: []
"Kaz5,9":
  text: "Korzyści z ziemi służą wszystkim. Nawet królowi służy pole."
  tags: []
"Kaz5,10":
  text: "Kto kocha pieniądze, nie nasyci się pieniędzmi, a kto kocha bogactwa, nie będzie miał z nich pożytku. Także i to jest marnością."
  tags: []
"Kaz5,11":
  text: "Gdy dobra się mnożą, mnożą się też ci, którzy je zjadają. Cóż więc za pożytek ma z tego właściciel? Jedynie to, że patrzy na nie swoimi oczami."
  tags: []
"Kaz5,12":
  text: "Słodki jest sen robotnika, czy je mało, czy dużo, ale obfitość bogatego nie daje mu spać."
  tags: []
"Kaz5,13":
  text: "Jest ciężka bieda, którą widziałem pod słońcem: bogactwo przechowywane dla właściciela na jego własną szkodę."
  tags: []
"Kaz5,14":
  text: "Takie bogactwo bowiem przepada przez złe zajęcia. A syn, którego spłodzi, nie będzie miał nic w swoich rękach."
  tags: []
"Kaz5,15":
  text: "Jak wyszedł z łona swojej matki, tak też nagi wróci, jak przyszedł, i nie zabierze nic ze swojej pracy, co mógłby wziąć do ręki."
  tags: []
"Kaz5,16":
  text: "Także i to jest ciężką niedolą, że jak przyszedł, tak odejdzie. Cóż więc za pożytek, że trudził się na wiatr?"
  tags: []
"Kaz5,17":
  text: "Po wszystkie swoje dni jadał w ciemności, smutku, chorobie i gniewie."
  tags: []
"Kaz5,18":
  text: "Oto co zobaczyłem: rzecz dobra i piękna to jeść i pić, i cieszyć się dobrem ze wszelkiego swego trudu, który człowiek podejmuje pod słońcem po wszystkie dni swego życia, jakie dał mu Bóg. To bowiem jest jego działem."
  tags: []
"Kaz5,19":
  text: "Dla każdego też człowieka, któremu Bóg dał majątek i bogactwo, i dał mu możliwość, by z nich korzystał i odbierał swój dział i radował się ze swojego trudu – to jest dar Boga."
  tags: []
"Kaz5,20":
  text: "Nie będzie bowiem wiele pamiętał o dniach swego życia, gdyż Bóg go wysłuchuje, napełniając jego serce radością."
  tags: []
