"Kaz7,1":
  text: "Lepsze jest dobre imię niż wyborny olejek, a dzień śmierci niż dzień urodzenia."
  tags: []
"Kaz7,2":
  text: "Lepiej iść do domu żałoby niż do domu wesela, gdyż w tamtym widzimy koniec każdego człowieka, a człowiek żyjący weźmie to sobie do serca."
  tags: []
"Kaz7,3":
  text: "Lepszy jest smutek niż śmiech, bo przez smutek twarzy serce szlachetnieje."
  tags: []
"Kaz7,4":
  text: "Serce mądrych jest w domu żałoby, ale serce głupich w domu wesela."
  tags: []
"Kaz7,5":
  text: "Lepiej jest słuchać upomnień mądrego niż pieśni głupców."
  tags: []
"Kaz7,6":
  text: "Czym bowiem jest trzaskanie cierni pod kotłem, tym jest śmiech głupca. Także i to jest marnością."
  tags: []
"Kaz7,7":
  text: "Doprawdy, ucisk doprowadza mądrego do szaleństwa, a dar psuje serce."
  tags: []
"Kaz7,8":
  text: "Lepsze jest dokończenie sprawy niż jej początek. Lepszy jest człowiek cierpliwego ducha niż człowiek wyniosłego ducha."
  tags: []
"Kaz7,9":
  text: "Nie bądź w duchu skory do gniewu, gdyż gniew spoczywa w piersi głupich."
  tags: []
"Kaz7,10":
  text: "Nie mów: Jak to jest, że dawne dni były lepsze niż te obecne? Bo niemądrze byś o to pytał."
  tags: []
"Kaz7,11":
  text: "Dobra jest mądrość przy dziedzictwie i jest pożyteczna dla tych, którzy widzą słońce."
  tags: []
"Kaz7,12":
  text: "Mądrość bowiem jest osłoną, osłoną są też pieniądze; lecz korzyść z poznania jest taka: mądrość daje życie tym, którzy ją mają."
  tags: []
"Kaz7,13":
  text: "Przypatrz się dziełu Boga. Kto bowiem może wyprostować to, co on krzywym uczynił?"
  tags: []
"Kaz7,14":
  text: "W dniu powodzenia raduj się, a w dniu nieszczęścia rozważaj: Bóg uczynił zarówno jedno, jak i drugie po to, aby człowiek nie dociekł tego, co po nim nastanie."
  tags: []
"Kaz7,15":
  text: "Wszystko widziałem za swych marnych dni: niejeden sprawiedliwy ginie w swojej sprawiedliwości, a niejeden niegodziwiec żyje długo w swojej niegodziwości."
  tags: []
"Kaz7,16":
  text: "Nie bądź przesadnie sprawiedliwy ani przesadnie mądry. Czemu miałbyś się sam do zguby prowadzić?"
  tags: []
"Kaz7,17":
  text: "Nie bądź zbyt niegodziwy i nie bądź głupi. Czemu miałbyś umrzeć przed swoim czasem?"
  tags: []
"Kaz7,18":
  text: "Dobrze będzie, jeśli będziesz się tego trzymał, ale i tamtego z rąk nie wypuszczaj. Kto bowiem boi się Boga, uniknie tego wszystkiego."
  tags: []
"Kaz7,19":
  text: "Mądrość daje mądremu więcej siły, niż posiada ją dziesięciu mocarzy, którzy są w mieście."
  tags: []
"Kaz7,20":
  text: "Doprawdy, nie ma człowieka sprawiedliwego na ziemi, który czyniłby dobrze i nie grzeszył."
  tags: []
"Kaz7,21":
  text: "Nie zwracaj też uwagi na wszystkie słowa, które wypowiadają ludzie, byś nie usłyszał, jak ci złorzeczy twój sługa."
  tags: []
"Kaz7,22":
  text: "Wie bowiem twoje serce, że i ty wielokroć złorzeczyłeś innym."
  tags: []
"Kaz7,23":
  text: "Tego wszystkiego doświadczyłem mądrością i powiedziałem: Będę mądry. Ale mądrość oddaliła się ode mnie."
  tags: []
"Kaz7,24":
  text: "To, co jest dalekie, i to, co jest bardzo głębokie – któż to może zgłębić?"
  tags: []
"Kaz7,25":
  text: "Zwróciłem swoje serce ku poznaniu, badaniu i szukaniu mądrości oraz rozeznaniu rzeczy, by poznać niegodziwość głupstwa, głupoty i szaleństwa."
  tags: []
"Kaz7,26":
  text: "I odkryłem, że bardziej gorzka niż śmierć jest kobieta, której serce jest jak sieć i sidło, a jej ręce jak pęta. Kto się Bogu podoba, uwolni się od niej, ale grzesznik będzie przez nią usidlony."
  tags: []
"Kaz7,27":
  text: "Oto co odkryłem – mówi Kaznodzieja – badając jedną po drugiej, aby dojść do istoty rzeczy;"
  tags: []
"Kaz7,28":
  text: "Czego jeszcze szuka moja dusza, lecz nie znajduje: Jednego mężczyznę spośród tysiąca znalazłem, ale kobiety spośród wszystkich nie znalazłem."
  tags: []
"Kaz7,29":
  text: "Oto to tylko odkryłem: Bóg stworzył człowieka prawego, ale oni szukali rozlicznych wymysłów."
  tags: []
