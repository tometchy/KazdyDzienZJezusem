"Kaz7,1": "Lepsze jest dobre imię niż wyborny olejek, a dzień śmierci niż dzień urodzenia."
"Kaz7,2": "Lepiej iść do domu żałoby niż do domu wesela, gdyż w tamtym widzimy koniec każdego człowieka, a człowiek żyjący weźmie to sobie do serca."
"Kaz7,3": "Lepszy jest smutek niż śmiech, bo przez smutek twarzy serce szlachetnieje."
"Kaz7,4": "Serce mądrych jest w domu żałoby, ale serce głupich w domu wesela."
"Kaz7,5": "Lepiej jest słuchać upomnień mądrego niż pieśni głupców."
"Kaz7,6": "Czym bowiem jest trzaskanie cierni pod kotłem, tym jest śmiech głupca. Także i to jest marnością."
"Kaz7,7": "Doprawdy, ucisk doprowadza mądrego do szaleństwa, a dar psuje serce."
"Kaz7,8": "Lepsze jest dokończenie sprawy niż jej początek. Lepszy jest człowiek cierpliwego ducha niż człowiek wyniosłego ducha."
"Kaz7,9": "Nie bądź w duchu skory do gniewu, gdyż gniew spoczywa w piersi głupich."
"Kaz7,10": "Nie mów: Jak to jest, że dawne dni były lepsze niż te obecne? Bo niemądrze byś o to pytał."
"Kaz7,11": "Dobra jest mądrość przy dziedzictwie i jest pożyteczna dla tych, którzy widzą słońce."
"Kaz7,12": "Mądrość bowiem jest osłoną, osłoną są też pieniądze; lecz korzyść z poznania jest taka: mądrość daje życie tym, którzy ją mają."
"Kaz7,13": "Przypatrz się dziełu Boga. Kto bowiem może wyprostować to, co on krzywym uczynił?"
"Kaz7,14": "W dniu powodzenia raduj się, a w dniu nieszczęścia rozważaj: Bóg uczynił zarówno jedno, jak i drugie po to, aby człowiek nie dociekł tego, co po nim nastanie."
"Kaz7,15": "Wszystko widziałem za swych marnych dni: niejeden sprawiedliwy ginie w swojej sprawiedliwości, a niejeden niegodziwiec żyje długo w swojej niegodziwości."
"Kaz7,16": "Nie bądź przesadnie sprawiedliwy ani przesadnie mądry. Czemu miałbyś się sam do zguby prowadzić?"
"Kaz7,17": "Nie bądź zbyt niegodziwy i nie bądź głupi. Czemu miałbyś umrzeć przed swoim czasem?"
"Kaz7,18": "Dobrze będzie, jeśli będziesz się tego trzymał, ale i tamtego z rąk nie wypuszczaj. Kto bowiem boi się Boga, uniknie tego wszystkiego."
"Kaz7,19": "Mądrość daje mądremu więcej siły, niż posiada ją dziesięciu mocarzy, którzy są w mieście."
"Kaz7,20": "Doprawdy, nie ma człowieka sprawiedliwego na ziemi, który czyniłby dobrze i nie grzeszył."
"Kaz7,21": "Nie zwracaj też uwagi na wszystkie słowa, które wypowiadają ludzie, byś nie usłyszał, jak ci złorzeczy twój sługa."
"Kaz7,22": "Wie bowiem twoje serce, że i ty wielokroć złorzeczyłeś innym."
"Kaz7,23": "Tego wszystkiego doświadczyłem mądrością i powiedziałem: Będę mądry. Ale mądrość oddaliła się ode mnie."
"Kaz7,24": "To, co jest dalekie, i to, co jest bardzo głębokie – któż to może zgłębić?"
"Kaz7,25": "Zwróciłem swoje serce ku poznaniu, badaniu i szukaniu mądrości oraz rozeznaniu rzeczy, by poznać niegodziwość głupstwa, głupoty i szaleństwa."
"Kaz7,26": "I odkryłem, że bardziej gorzka niż śmierć jest kobieta, której serce jest jak sieć i sidło, a jej ręce jak pęta. Kto się Bogu podoba, uwolni się od niej, ale grzesznik będzie przez nią usidlony."
"Kaz7,27": "Oto co odkryłem – mówi Kaznodzieja – badając jedną po drugiej, aby dojść do istoty rzeczy;"
"Kaz7,28": "Czego jeszcze szuka moja dusza, lecz nie znajduje: Jednego mężczyznę spośród tysiąca znalazłem, ale kobiety spośród wszystkich nie znalazłem."
"Kaz7,29": "Oto to tylko odkryłem: Bóg stworzył człowieka prawego, ale oni szukali rozlicznych wymysłów."
