"Kaz6,1":
  text: "Jest zło, które widziałem pod słońcem i które jest powszechne wśród ludzi:"
  tags: []
"Kaz6,2":
  text: "Gdy jakiemuś człowiekowi Bóg dał bogactwo, majątek i sławę, tak że nie brakuje jego duszy nic z tego, czegokolwiek by pragnął, jednak Bóg nie daje mu możliwości spożywać tego, ale spożywa to obcy człowiek. Jest to marnością i ciężką niedolą."
  tags: []
"Kaz6,3":
  text: "Choćby ktoś spłodził stu synów, żył wiele lat i dni jego lat się przedłużyły, a jego dusza nie była nasycona dobrem i nie miał nawet pogrzebu, powiadam: lepszy jest od niego martwy płód."
  tags: []
"Kaz6,4":
  text: "Ten bowiem przychodzi w marności i odchodzi w ciemności, a jego imię zostaje okryte ciemnością."
  tags: []
"Kaz6,5":
  text: "Nie widział nawet słońca i nic nie wie. Ma on większy spokój niż tamten."
  tags: []
"Kaz6,6":
  text: "Bo choćby nawet żył przez dwa tysiące lat, nie zaznałby żadnego dobra. Czy wszyscy nie idą do jednego miejsca?"
  tags: []
"Kaz6,7":
  text: "Wszelki trud człowieka jest dla jego ust, a jednak jego dusza nie może się nasycić."
  tags: []
"Kaz6,8":
  text: "Czego więcej ma bowiem mądry od głupca? Albo czego więcej ma ubogi, który umie postępować wśród żyjących?"
  tags: []
"Kaz6,9":
  text: "Lepsze jest to, co oczy widzą, niż ciągłe pragnienie. To również jest marnością i utrapieniem ducha."
  tags: []
"Kaz6,10":
  text: "Temu, kto jest, już nadano imię i wiadomo, że jest człowiekiem i że nie może się on spierać z mocniejszym od siebie."
  tags: []
"Kaz6,11":
  text: "Ponieważ wiele jest rzeczy, które pomnażają marność, jaką z nich korzyść ma człowiek?"
  tags: []
"Kaz6,12":
  text: "Któż bowiem wie, co jest dobre dla człowieka w tym życiu po wszystkie dni jego marnego życia, które jak cień przemijają? Albo kto oznajmi człowiekowi, co po nim będzie pod słońcem?"
  tags: []
