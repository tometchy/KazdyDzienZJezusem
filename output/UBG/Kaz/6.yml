"Kaz6,1": "Jest zło, które widziałem pod słońcem i które jest powszechne wśród ludzi:"
"Kaz6,2": "Gdy jakiemuś człowiekowi Bóg dał bogactwo, majątek i sławę, tak że nie brakuje jego duszy nic z tego, czegokolwiek by pragnął, jednak Bóg nie daje mu możliwości spożywać tego, ale spożywa to obcy człowiek. Jest to marnością i ciężką niedolą."
"Kaz6,3": "Choćby ktoś spłodził stu synów, żył wiele lat i dni jego lat się przedłużyły, a jego dusza nie była nasycona dobrem i nie miał nawet pogrzebu, powiadam: lepszy jest od niego martwy płód."
"Kaz6,4": "Ten bowiem przychodzi w marności i odchodzi w ciemności, a jego imię zostaje okryte ciemnością."
"Kaz6,5": "Nie widział nawet słońca i nic nie wie. Ma on większy spokój niż tamten."
"Kaz6,6": "Bo choćby nawet żył przez dwa tysiące lat, nie zaznałby żadnego dobra. Czy wszyscy nie idą do jednego miejsca?"
"Kaz6,7": "Wszelki trud człowieka jest dla jego ust, a jednak jego dusza nie może się nasycić."
"Kaz6,8": "Czego więcej ma bowiem mądry od głupca? Albo czego więcej ma ubogi, który umie postępować wśród żyjących?"
"Kaz6,9": "Lepsze jest to, co oczy widzą, niż ciągłe pragnienie. To również jest marnością i utrapieniem ducha."
"Kaz6,10": "Temu, kto jest, już nadano imię i wiadomo, że jest człowiekiem i że nie może się on spierać z mocniejszym od siebie."
"Kaz6,11": "Ponieważ wiele jest rzeczy, które pomnażają marność, jaką z nich korzyść ma człowiek?"
"Kaz6,12": "Któż bowiem wie, co jest dobre dla człowieka w tym życiu po wszystkie dni jego marnego życia, które jak cień przemijają? Albo kto oznajmi człowiekowi, co po nim będzie pod słońcem?"
