"Kaz12,1":
  text: "Pamiętaj więc o swoim Stwórcy w dniach swojej młodości, zanim nastaną złe dni i przyjdą lata, o których powiesz: Nie podobają mi się."
  tags: []
"Kaz12,2":
  text: "Zanim zaćmią się słońce, światło, księżyc i gwiazdy, a chmury powrócą po deszczu."
  tags: []
"Kaz12,3":
  text: "W dzień, w którym trząść się będą stróże domu i pochylą się silni mężczyźni, ustaną mielący, gdyż będzie ich mało, i zaćmią się patrzące przez okna;"
  tags: []
"Kaz12,4":
  text: "I zamkną się drzwi na ulicę, gdy odgłos mielenia osłabnie, gdy będzie się wstawać na głos ptaków i przycichną wszystkie córki śpiewające."
  tags: []
"Kaz12,5":
  text: "Gdy też będą się bać wysokich miejsc i lękać na drodze, gdy zakwitnie drzewo migdałowe i szarańcza będzie ciężka i pragnienie ustanie, bo człowiek idzie do swego wiecznego domu, a płaczący będą chodzić po ulicach;"
  tags: []
"Kaz12,6":
  text: "Zanim się zerwie srebrny sznur i stłucze złota czasza, nim rozbije się dzban u źródła i złamie się koło przy studni."
  tags: []
"Kaz12,7":
  text: "Wtedy proch powróci do ziemi, jak nią był, a duch powróci do Boga, który go dał."
  tags: []
"Kaz12,8":
  text: "Marność nad marnościami – mówi Kaznodzieja – wszystko to marność."
  tags: []
"Kaz12,9":
  text: "A poza tym, że Kaznodzieja był mądry, uczył lud wiedzy; rozważał, badał i ułożył wiele przysłów."
  tags: []
"Kaz12,10":
  text: "Kaznodzieja starał się znaleźć słowa przyjemne i napisał to, co jest dobre – słowa prawdy."
  tags: []
"Kaz12,11":
  text: "Słowa mądrych są jak ościenie i jak gwoździe wbite przez tych, którzy je złożyli, i pochodzą od jednego pasterza."
  tags: []
"Kaz12,12":
  text: "Ponadto, mój synu, przyjmij przestrogę z tych słów: Pisaniu wielu ksiąg nie ma końca, a wiele nauki męczy ciało."
  tags: []
"Kaz12,13":
  text: "Wysłuchaj podsumowania wszystkiego: Bój się Boga i przestrzegaj jego przykazań. Ponieważ to jest cały obowiązek człowieka."
  tags: []
"Kaz12,14":
  text: "Bóg przywiedzie bowiem każdy uczynek na sąd, nawet każdą rzecz utajoną, czy dobrą, czy złą."
  tags: []
