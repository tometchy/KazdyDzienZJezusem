"Kaz2,1": "Powiedziałem w sercu: Niech teraz doświadczę cię w radości, zażywaj więc przyjemności. Lecz to także jest marnością."
"Kaz2,2": "O śmiechu powiedziałem: To szaleństwo, a o radości: Co to daje?"
"Kaz2,3": "Postanowiłem w sercu, że poddam swoje ciało winu – serce jednak kierowałem mądrością – i że będę się trzymać głupoty, aż zobaczę, co dla synów ludzkich jest dobrem spośród tego, co mają czynić pod niebem, przez wszystkie dni ich życia."
"Kaz2,4": "Dokonałem wielkich dzieł, zbudowałem sobie domy, zasadziłem sobie winnice."
"Kaz2,5": "Założyłem sobie ogrody i sady i posadziłem w nich wszelkiego rodzaju drzewa owocowe."
"Kaz2,6": "Zbudowałem też sobie stawy na wodę, by nawadniać nią las rosnących drzew."
"Kaz2,7": "Nabyłem sługi i służące, miałem też sługi urodzone w swoim domu. Posiadałem również stada wołów i trzody owiec większe niż wszyscy, którzy byli przede mną w Jerozolimie."
"Kaz2,8": "Zgromadziłem sobie srebro i złoto, i klejnoty królów i prowincji. Przygotowałem sobie śpiewaków i śpiewaczki, i inne rozkosze synów ludzkich oraz liczne instrumenty muzyczne."
"Kaz2,9": "I tak stałem się większy i możniejszy niż wszyscy, którzy byli przede mną w Jerozolimie. W dodatku moja mądrość pozostała przy mnie."
"Kaz2,10": "Nie wzbraniałem swoim oczom niczego, czego pragnęły, nie odmawiałem swemu sercu żadnej uciechy; moje serce bowiem radowało się z całego mojego trudu. A to był mój dział za cały mój trud."
"Kaz2,11": "Następnie przyjrzałem się wszystkim dziełom, jakich dokonały moje ręce, i trudowi, jaki podjąłem dla ich wykonania, a oto wszystko to marność i utrapienie ducha i nie ma żadnego pożytku pod słońcem."
"Kaz2,12": "Odwróciłem się więc, aby przyjrzeć się mądrości, szaleństwu i głupocie. Co bowiem może uczynić człowiek, który nastąpi po królu? To, co czynili już inni."
"Kaz2,13": "I zobaczyłem, że mądrość jest pożyteczniejsza od głupoty, tak jak światło jest pożyteczniejsze od ciemności."
"Kaz2,14": "Mądry ma oczy w swojej głowie, głupi zaś chodzi w ciemności. A poznałem, że ten sam los spotyka wszystkich."
"Kaz2,15": "Dlatego powiedziałem w sercu: Los, który spotyka głupiego, spotka również mnie. Po co więc przewyższyłem go mądrością? Wtedy powiedziałem w sercu, że to także jest marnością."
"Kaz2,16": "Nie ma bowiem pamięci zarówno o mądrym, jak i o głupcu na wieki, gdyż to, co jest teraz, w najbliższych dniach pójdzie w niepamięć. A jak umiera mądry? Tak jak głupi."
"Kaz2,17": "Dlatego obrzydło mi życie, gdyż przykre mi są wszystkie sprawy dokonane pod słońcem. Wszystko bowiem jest marnością i utrapieniem ducha."
"Kaz2,18": "Zbrzydł mi nawet cały mój trud, który podejmowałem pod słońcem, gdyż muszę go zostawić człowiekowi, który przyjdzie po mnie."
"Kaz2,19": "A kto wie, czy będzie mądry, czy głupi? A jednak będzie władać całą moją pracą, w którą włożyłem swój trud i mądrość pod słońcem. Także i to jest marnością."
"Kaz2,20": "Doszedłem więc do tego, że zwątpiłem w sercu w cały swój trud, jaki podjąłem pod słońcem."
"Kaz2,21": "Gdyż niejeden człowiek pracuje mądrze, umiejętnie i sprawiedliwie, a swój dział pozostawia innemu, który się nim nie trudził. Także i to jest marnością i wielkim złem."
"Kaz2,22": "Cóż bowiem ma człowiek z całej swojej pracy i z utrapienia swego serca, którymi się trudzi pod słońcem?"
"Kaz2,23": "Bo wszystkie jego dni są cierpieniem, a jego zajęcie – smutkiem; nawet w nocy jego serce nie zaznaje spokoju. Także i to jest marnością."
"Kaz2,24": "Nie ma nic lepszego dla człowieka, niż aby jadł i pił, i czynił dobrze swojej duszy przy swojej pracy. Zobaczyłem też, że pochodzi to z ręki Boga."
"Kaz2,25": "Kto bowiem potrafi jeść i cieszyć się tym słuszniej niż ja?"
"Kaz2,26": "Bo człowiekowi, który mu się podoba, daje mądrość, wiedzę i radość. Ale grzesznikowi zadaje trud, aby zbierał i gromadził, i potem zostawił to temu, który się Bogu podoba. Także i to jest marnością i utrapieniem ducha."
