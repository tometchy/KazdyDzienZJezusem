"Wj27,1":
  text: "Uczynisz też ołtarz z drewna akacjowego, długi na pięć łokci i szeroki na pięć łokci. Ołtarz będzie kwadratowy i wysoki na trzy łokcie."
  tags: []
"Wj27,2":
  text: "I uczynisz rogi na jego czterech narożnikach; jego rogi będą z tego samego. I pokryjesz go miedzią."
  tags: []
"Wj27,3":
  text: "Uczynisz też do niego kociołki do zsypywania popiołu oraz szufle, miednice, widełki i łopaty na rozżarzone węgle. Wszystkie naczynia do niego uczynisz z miedzi."
  tags: []
"Wj27,4":
  text: "Uczynisz też do niego miedzianą kratę na kształt sieci, a na tej kracie, na czterech jej narożnikach, uczynisz cztery miedziane pierścienie."
  tags: []
"Wj27,5":
  text: "I umieścisz ją u dołu pod obramowaniem ołtarza, tak aby krata sięgała do połowy ołtarza."
  tags: []
"Wj27,6":
  text: "Uczynisz też drążki do ołtarza, drążki z drewna akacjowego, i pokryjesz je miedzią."
  tags: []
"Wj27,7":
  text: "Drążki te będą włożone w pierścienie i będą one na obydwu stronach ołtarza, aby można go było nosić."
  tags: []
"Wj27,8":
  text: "Uczynisz go z desek, aby był pusty wewnątrz. Niech go uczynią tak, jak ci pokazano na górze."
  tags: []
"Wj27,9":
  text: "Uczynisz też dziedziniec przybytku. Na południu po prawej stronie zasłony dziedzińca będą ze skręconego bisioru o długości stu łokci na jedną stronę."
  tags: []
"Wj27,10":
  text: "Do tego dwadzieścia słupów i dwadzieścia miedzianych podstawek. Haczyki na słupach i ich klamry będą ze srebra."
  tags: []
"Wj27,11":
  text: "Podobnie wzdłuż strony północnej będą zasłony o długości stu łokci, do tego dwadzieścia słupów i dwadzieścia miedzianych podstawek. Haczyki na słupach i ich klamry będą ze srebra."
  tags: []
"Wj27,12":
  text: "A na szerokości dziedzińca od strony zachodniej będą zasłony na pięćdziesiąt łokci, a do tego dziesięć słupów i dziesięć podstawek."
  tags: []
"Wj27,13":
  text: "Szerokość dziedzińca z przodu, po stronie wschodniej, będzie wynosić pięćdziesiąt łokci."
  tags: []
"Wj27,14":
  text: "Po jednej stronie wejścia będą zasłony na piętnaście łokci, a do tego trzy słupy i trzy podstawki."
  tags: []
"Wj27,15":
  text: "Po drugiej stronie będą zasłony na piętnaście łokci, a do tego trzy słupy i trzy podstawki."
  tags: []
"Wj27,16":
  text: "A do wejścia dziedzińca będzie zasłona na dwadzieścia łokci z błękitnej tkaniny, z purpury i karmazynu oraz skręconego bisioru, haftowana. Do tego cztery słupy i cztery podstawki."
  tags: []
"Wj27,17":
  text: "Wszystkie słupy dokoła dziedzińca będą miały srebrne klamry. Ich haczyki będą ze srebra, a ich podstawki – z miedzi."
  tags: []
"Wj27,18":
  text: "Długość dziedzińca będzie wynosić sto łokci, a szerokość – pięćdziesiąt, wszędzie jednakowa, a wysokość – pięć łokci, zasłony będą ze skręconego bisioru, jej podstawki zaś z miedzi."
  tags: []
"Wj27,19":
  text: "Wszystkie naczynia przybytku do wszelkiej służby w nim i wszystkie jego kołki, i wszystkie kołki dziedzińca będą z miedzi."
  tags: []
"Wj27,20":
  text: "Rozkażesz synom Izraela, aby przynieśli do ciebie czystą, wytłoczoną oliwę do oświetlenia, aby lampy zawsze się paliły."
  tags: []
"Wj27,21":
  text: "W Namiocie Zgromadzenia przed zasłoną, za którą jest arka świadectwa, Aaron i jego synowie będą je stawiać przed PANEM od wieczora aż do poranka. Będzie to wieczna ustawa wśród ich potomków dla synów Izraela."
  tags: []
