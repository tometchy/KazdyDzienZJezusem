"Wj27,1": "Uczynisz też ołtarz z drewna akacjowego, długi na pięć łokci i szeroki na pięć łokci. Ołtarz będzie kwadratowy i wysoki na trzy łokcie."
"Wj27,2": "I uczynisz rogi na jego czterech narożnikach; jego rogi będą z tego samego. I pokryjesz go miedzią."
"Wj27,3": "Uczynisz też do niego kociołki do zsypywania popiołu oraz szufle, miednice, widełki i łopaty na rozżarzone węgle. Wszystkie naczynia do niego uczynisz z miedzi."
"Wj27,4": "Uczynisz też do niego miedzianą kratę na kształt sieci, a na tej kracie, na czterech jej narożnikach, uczynisz cztery miedziane pierścienie."
"Wj27,5": "I umieścisz ją u dołu pod obramowaniem ołtarza, tak aby krata sięgała do połowy ołtarza."
"Wj27,6": "Uczynisz też drążki do ołtarza, drążki z drewna akacjowego, i pokryjesz je miedzią."
"Wj27,7": "Drążki te będą włożone w pierścienie i będą one na obydwu stronach ołtarza, aby można go było nosić."
"Wj27,8": "Uczynisz go z desek, aby był pusty wewnątrz. Niech go uczynią tak, jak ci pokazano na górze."
"Wj27,9": "Uczynisz też dziedziniec przybytku. Na południu po prawej stronie zasłony dziedzińca będą ze skręconego bisioru o długości stu łokci na jedną stronę."
"Wj27,10": "Do tego dwadzieścia słupów i dwadzieścia miedzianych podstawek. Haczyki na słupach i ich klamry będą ze srebra."
"Wj27,11": "Podobnie wzdłuż strony północnej będą zasłony o długości stu łokci, do tego dwadzieścia słupów i dwadzieścia miedzianych podstawek. Haczyki na słupach i ich klamry będą ze srebra."
"Wj27,12": "A na szerokości dziedzińca od strony zachodniej będą zasłony na pięćdziesiąt łokci, a do tego dziesięć słupów i dziesięć podstawek."
"Wj27,13": "Szerokość dziedzińca z przodu, po stronie wschodniej, będzie wynosić pięćdziesiąt łokci."
"Wj27,14": "Po jednej stronie wejścia będą zasłony na piętnaście łokci, a do tego trzy słupy i trzy podstawki."
"Wj27,15": "Po drugiej stronie będą zasłony na piętnaście łokci, a do tego trzy słupy i trzy podstawki."
"Wj27,16": "A do wejścia dziedzińca będzie zasłona na dwadzieścia łokci z błękitnej tkaniny, z purpury i karmazynu oraz skręconego bisioru, haftowana. Do tego cztery słupy i cztery podstawki."
"Wj27,17": "Wszystkie słupy dokoła dziedzińca będą miały srebrne klamry. Ich haczyki będą ze srebra, a ich podstawki – z miedzi."
"Wj27,18": "Długość dziedzińca będzie wynosić sto łokci, a szerokość – pięćdziesiąt, wszędzie jednakowa, a wysokość – pięć łokci, zasłony będą ze skręconego bisioru, jej podstawki zaś z miedzi."
"Wj27,19": "Wszystkie naczynia przybytku do wszelkiej służby w nim i wszystkie jego kołki, i wszystkie kołki dziedzińca będą z miedzi."
"Wj27,20": "Rozkażesz synom Izraela, aby przynieśli do ciebie czystą, wytłoczoną oliwę do oświetlenia, aby lampy zawsze się paliły."
"Wj27,21": "W Namiocie Zgromadzenia przed zasłoną, za którą jest arka świadectwa, Aaron i jego synowie będą je stawiać przed PANEM od wieczora aż do poranka. Będzie to wieczna ustawa wśród ich potomków dla synów Izraela."
