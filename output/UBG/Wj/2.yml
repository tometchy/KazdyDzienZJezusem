"Wj2,1":
  text: "Pewien mężczyzna z rodu Lewiego pojął za żonę córkę z rodu Lewiego."
  tags: []
"Wj2,2":
  text: "Kobieta ta poczęła i urodziła syna, a gdy zobaczyła, że jest piękny, ukrywała go przez trzy miesiące."
  tags: []
"Wj2,3":
  text: "Ale gdy nie mogła go dłużej ukrywać, wzięła koszyk z sitowia, wysmarowała żywicą i smołą, włożyła do niego dziecko i umieściła między trzcinami na brzegu rzeki."
  tags: []
"Wj2,4":
  text: "A jego siostra stała daleko, aby wiedzieć, co się z nim stanie."
  tags: []
"Wj2,5":
  text: "Wtedy zeszła do rzeki córka faraona, aby się wykąpać, a jej służące przechadzały się po brzegu rzeki. Gdy zobaczyła koszyk w trzcinie, posłała swą służącą, aby go wzięła."
  tags: []
"Wj2,6":
  text: "Kiedy go otworzyła, zobaczyła dziecko, a chłopiec płakał. Ulitowała się nad nim i powiedziała: To jedno z hebrajskich dzieci."
  tags: []
"Wj2,7":
  text: "Wówczas jego siostra zapytała córkę faraona: Czy mam pójść i zawołać ci mamkę spośród hebrajskich kobiet, aby ci wykarmiła to dziecko?"
  tags: []
"Wj2,8":
  text: "Córka faraona odpowiedziała jej: Idź. Dziewczynka poszła więc i zawołała matkę tego dziecka."
  tags: []
"Wj2,9":
  text: "Do niej powiedziała córka faraona: Weź to dziecko i wykarm mi je, a ja dam ci należną zapłatę. Kobieta wzięła więc dziecko i wykarmiła je."
  tags: []
"Wj2,10":
  text: "A gdy dziecko podrosło, przyprowadziła je do córki faraona i stało się jej synem. I nadała mu imię Mojżesz, bo mówiła: Wyciągnęłam go z wody."
  tags: []
"Wj2,11":
  text: "Kiedy Mojżesz dorósł, wyszedł do swych braci i widział ich ciężary. Zobaczył też Egipcjanina, który bił Hebrajczyka, jednego z jego braci."
  tags: []
"Wj2,12":
  text: "Rozejrzał się na wszystkie strony, a gdy zobaczył, że nikogo nie ma, zabił Egipcjanina i ukrył go w piasku."
  tags: []
"Wj2,13":
  text: "A gdy wyszedł następnego dnia, oto kłócili się dwaj Hebrajczycy. Wtedy zapytał tego, który wyrządzał krzywdę: Dlaczego bijesz swego bliźniego?"
  tags: []
"Wj2,14":
  text: "Ten mu odpowiedział: Któż cię ustanowił przełożonym i sędzią nad nami? Czy zamierzasz mnie zabić, jak zabiłeś Egipcjanina? Wtedy Mojżesz zląkł się i powiedział: Na pewno sprawa wyszła na jaw."
  tags: []
"Wj2,15":
  text: "Gdy faraon usłyszał o sprawie, usiłował zabić Mojżesza. Lecz Mojżesz uciekł przed faraonem i zamieszkał w ziemi Midian. I zatrzymał się tam przy pewnej studni."
  tags: []
"Wj2,16":
  text: "A kapłan Midianitów miał siedem córek. Przyszły one, naczerpały wody i napełniły koryta, aby napoić stado swego ojca;"
  tags: []
"Wj2,17":
  text: "Ale nadeszli pasterze i odganiali je. Wtedy Mojżesz wstał, obronił je i napoił ich bydło."
  tags: []
"Wj2,18":
  text: "Gdy wróciły do swego ojca Reuela, ten zapytał: Dlaczego dziś przyszłyście tak szybko?"
  tags: []
"Wj2,19":
  text: "One odpowiedziały: Jakiś Egipcjanin wybawił nas z rąk pasterzy, naczerpał nam też wody i napoił stado."
  tags: []
"Wj2,20":
  text: "Wtedy zapytał swoje córki: A gdzie on jest? Dlaczego zostawiłyście tego człowieka? Zawołajcie go, aby zjadł chleb."
  tags: []
"Wj2,21":
  text: "Mojżesz zgodził się zamieszkać u tego człowieka, a ten dał Mojżeszowi swoją córkę Seforę."
  tags: []
"Wj2,22":
  text: "Ta urodziła mu syna, któremu nadał imię Gerszom, bo mówił: Byłem przybyszem w obcej ziemi."
  tags: []
"Wj2,23":
  text: "Po dłuższym czasie umarł król Egiptu, a synowie Izraela wzdychali i wołali z powodu niewoli. Ich wołanie z powodu niewoli dotarło do Boga."
  tags: []
"Wj2,24":
  text: "Bóg usłyszał ich jęk i wspomniał Bóg na swoje przymierze z Abrahamem, Izaakiem i Jakubem."
  tags: []
"Wj2,25":
  text: "I spojrzał Bóg na synów Izraela, i miał Bóg na nich wzgląd."
  tags: []
