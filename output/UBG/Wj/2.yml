"Wj2,1": "Pewien mężczyzna z rodu Lewiego pojął za żonę córkę z rodu Lewiego."
"Wj2,2": "Kobieta ta poczęła i urodziła syna, a gdy zobaczyła, że jest piękny, ukrywała go przez trzy miesiące."
"Wj2,3": "Ale gdy nie mogła go dłużej ukrywać, wzięła koszyk z sitowia, wysmarowała żywicą i smołą, włożyła do niego dziecko i umieściła między trzcinami na brzegu rzeki."
"Wj2,4": "A jego siostra stała daleko, aby wiedzieć, co się z nim stanie."
"Wj2,5": "Wtedy zeszła do rzeki córka faraona, aby się wykąpać, a jej służące przechadzały się po brzegu rzeki. Gdy zobaczyła koszyk w trzcinie, posłała swą służącą, aby go wzięła."
"Wj2,6": "Kiedy go otworzyła, zobaczyła dziecko, a chłopiec płakał. Ulitowała się nad nim i powiedziała: To jedno z hebrajskich dzieci."
"Wj2,7": "Wówczas jego siostra zapytała córkę faraona: Czy mam pójść i zawołać ci mamkę spośród hebrajskich kobiet, aby ci wykarmiła to dziecko?"
"Wj2,8": "Córka faraona odpowiedziała jej: Idź. Dziewczynka poszła więc i zawołała matkę tego dziecka."
"Wj2,9": "Do niej powiedziała córka faraona: Weź to dziecko i wykarm mi je, a ja dam ci należną zapłatę. Kobieta wzięła więc dziecko i wykarmiła je."
"Wj2,10": "A gdy dziecko podrosło, przyprowadziła je do córki faraona i stało się jej synem. I nadała mu imię Mojżesz, bo mówiła: Wyciągnęłam go z wody."
"Wj2,11": "Kiedy Mojżesz dorósł, wyszedł do swych braci i widział ich ciężary. Zobaczył też Egipcjanina, który bił Hebrajczyka, jednego z jego braci."
"Wj2,12": "Rozejrzał się na wszystkie strony, a gdy zobaczył, że nikogo nie ma, zabił Egipcjanina i ukrył go w piasku."
"Wj2,13": "A gdy wyszedł następnego dnia, oto kłócili się dwaj Hebrajczycy. Wtedy zapytał tego, który wyrządzał krzywdę: Dlaczego bijesz swego bliźniego?"
"Wj2,14": "Ten mu odpowiedział: Któż cię ustanowił przełożonym i sędzią nad nami? Czy zamierzasz mnie zabić, jak zabiłeś Egipcjanina? Wtedy Mojżesz zląkł się i powiedział: Na pewno sprawa wyszła na jaw."
"Wj2,15": "Gdy faraon usłyszał o sprawie, usiłował zabić Mojżesza. Lecz Mojżesz uciekł przed faraonem i zamieszkał w ziemi Midian. I zatrzymał się tam przy pewnej studni."
"Wj2,16": "A kapłan Midianitów miał siedem córek. Przyszły one, naczerpały wody i napełniły koryta, aby napoić stado swego ojca;"
"Wj2,17": "Ale nadeszli pasterze i odganiali je. Wtedy Mojżesz wstał, obronił je i napoił ich bydło."
"Wj2,18": "Gdy wróciły do swego ojca Reuela, ten zapytał: Dlaczego dziś przyszłyście tak szybko?"
"Wj2,19": "One odpowiedziały: Jakiś Egipcjanin wybawił nas z rąk pasterzy, naczerpał nam też wody i napoił stado."
"Wj2,20": "Wtedy zapytał swoje córki: A gdzie on jest? Dlaczego zostawiłyście tego człowieka? Zawołajcie go, aby zjadł chleb."
"Wj2,21": "Mojżesz zgodził się zamieszkać u tego człowieka, a ten dał Mojżeszowi swoją córkę Seforę."
"Wj2,22": "Ta urodziła mu syna, któremu nadał imię Gerszom, bo mówił: Byłem przybyszem w obcej ziemi."
"Wj2,23": "Po dłuższym czasie umarł król Egiptu, a synowie Izraela wzdychali i wołali z powodu niewoli. Ich wołanie z powodu niewoli dotarło do Boga."
"Wj2,24": "Bóg usłyszał ich jęk i wspomniał Bóg na swoje przymierze z Abrahamem, Izaakiem i Jakubem."
"Wj2,25": "I spojrzał Bóg na synów Izraela, i miał Bóg na nich wzgląd."
