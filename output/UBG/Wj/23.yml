"Wj23,1": "Nie będziesz rozgłaszał fałszywych wieści. Nie wchodź w spółkę z bezbożnym, by być fałszywym świadkiem."
"Wj23,2": "Nie idź za większością, aby wyrządzić zło, i nie zeznawaj w sprawie, ulegając zdaniu większości, by naginać sąd."
"Wj23,3": "I nie okazuj przychylności ubogiemu w jego sprawie."
"Wj23,4": "Jeśli napotkasz błądzącego wołu swego wroga lub jego osła, musisz odprowadzić go do niego."
"Wj23,5": "Jeśli zobaczysz, że osioł tego, który cię nienawidzi, leży pod swoim ciężarem, nie odmówisz mu pomocy. Owszem, masz mu z nim pomóc."
"Wj23,6": "Nie naginaj sądu twego ubogiego w jego sprawie."
"Wj23,7": "Trzymaj się z dala od nieuczciwej sprawy. Nie zabijaj niewinnego i sprawiedliwego, bo nie usprawiedliwię bezbożnego."
"Wj23,8": "Nie będziesz też brać darów, ponieważ dar zaślepia mądrych i wypacza słowa sprawiedliwych."
"Wj23,9": "Nie uciskaj również przybysza, bo sami wiecie, jak się czuje przybysz, gdyż byliście przybyszami w ziemi Egiptu."
"Wj23,10": "Przez sześć lat będziesz obsiewał swoją ziemię i zbierał jej plony;"
"Wj23,11": "A w siódmym roku zostawisz ją odłogiem, żeby odpoczęła, aby jedli ubodzy twego ludu, a co zostanie po nich, zjedzą zwierzęta polne. Tak też postąpisz ze swoją winnicą i swoim sadem oliwnym."
"Wj23,12": "Przez sześć dni będziesz wykonywać swoją pracę, ale siódmego dnia odpoczniesz, aby odpoczął twój wół i twój osioł i żeby odetchnął syn twojej niewolnicy i przybysz."
"Wj23,13": "A we wszystkim, co wam powiedziałem, bądźcie ostrożni. Nie wspominajcie też imienia obcych bogów, niech nie będzie słyszane z twoich ust."
"Wj23,14": "Trzy razy w roku będziesz obchodzić dla mnie święto."
"Wj23,15": "Będziesz obchodzić Święto Przaśników. Siedem dni będziesz jeść przaśniki, jak ci nakazałem, w miesiącu Abib, bo w nim wyszedłeś z Egiptu. Nie pokażecie się przede mną z pustymi rękami."
"Wj23,16": "I Święto Żniw, pierwocin twojej pracy, tego, co posiałeś na polu. I także Święto Zbiorów pod koniec roku, gdy zbierzesz z pola owoce swojej pracy."
"Wj23,17": "Trzy razy w roku wszyscy twoi mężczyźni mają się pokazać przed Panem BOGIEM."
"Wj23,18": "Nie będziesz ofiarował krwi mojej ofiary z chlebem kwaszonym, a tłuszcz mojej ofiary nie zostanie przez noc aż do poranka."
"Wj23,19": "Przyniesiesz do domu PANA, twego Boga, pierwociny z pierwszych plonów swojej ziemi. Nie będziesz gotował koźlęcia w mleku jego matki."
"Wj23,20": "Oto posyłam Anioła przed tobą, aby cię strzegł w drodze i doprowadził do miejsca, które przygotowałem."
"Wj23,21": "Zważaj na niego i słuchaj jego głosu; nie pobudzaj go do gniewu, bo nie przebaczy waszych przestępstw, gdyż moje imię jest w nim."
"Wj23,22": "Bo jeśli będziesz pilnie słuchać jego głosu i uczynisz wszystko, co powiem, będę wrogiem twoich wrogów i będę dręczyć tych, którzy cię dręczyli."
"Wj23,23": "Mój Anioł bowiem pójdzie przed tobą i wprowadzi cię do Amorytów, Chetytów, Peryzzytów, Kananejczyków, Chiwwitów i Jebusytów, i wytracę ich."
"Wj23,24": "Nie będziesz oddawał pokłonu ich bogom ani nie będziesz im służył, ani nie postępuj według ich czynów, ale do gruntu zburz ich i doszczętnie pokrusz ich posągi."
"Wj23,25": "Będziecie służyć PANU, waszemu Bogu, a on będzie błogosławić twój chleb i twoją wodę; i oddalę od ciebie chorobę."
"Wj23,26": "Nie będzie w twojej ziemi roniącej ani niepłodnej. Dopełnię liczbę twoich dni."
"Wj23,27": "Poślę mój strach przed tobą i strwożę wszelki lud, przeciw któremu pójdziesz, i sprawię, że wszyscy twoi wrogowie uciekną przed tobą."
"Wj23,28": "Poślę też przed tobą szerszenie, które wypędzą Chiwwitów, Kananejczyków i Chetytów sprzed twego oblicza."
"Wj23,29": "Nie wypędzę ich sprzed twojego oblicza w jednym roku, by ziemia nie zmieniła się w pustynię i nie namnożył się przeciwko tobie dziki zwierz."
"Wj23,30": "Pomału będę ich wypędzał sprzed twego oblicza, aż się rozmnożysz i posiądziesz ziemię."
"Wj23,31": "A ustanowię twoje granice od Morza Czerwonego aż do Morza Filistynów, od pustyni aż do rzeki. Oddam bowiem w wasze ręce mieszkańców tej ziemi, a ty wypędzisz ich sprzed twego oblicza."
"Wj23,32": "Nie zawrzesz przymierza z nimi ani z ich bogami."
"Wj23,33": "Nie wolno im mieszkać w twojej ziemi, by cię nie doprowadzili do grzechu przeciwko mnie. Jeśli bowiem będziesz służył ich bogom, będzie to dla ciebie sidłem."
