"Wj23,1":
  text: "Nie będziesz rozgłaszał fałszywych wieści. Nie wchodź w spółkę z bezbożnym, by być fałszywym świadkiem."
  tags: []
"Wj23,2":
  text: "Nie idź za większością, aby wyrządzić zło, i nie zeznawaj w sprawie, ulegając zdaniu większości, by naginać sąd."
  tags: []
"Wj23,3":
  text: "I nie okazuj przychylności ubogiemu w jego sprawie."
  tags: []
"Wj23,4":
  text: "Jeśli napotkasz błądzącego wołu swego wroga lub jego osła, musisz odprowadzić go do niego."
  tags: []
"Wj23,5":
  text: "Jeśli zobaczysz, że osioł tego, który cię nienawidzi, leży pod swoim ciężarem, nie odmówisz mu pomocy. Owszem, masz mu z nim pomóc."
  tags: []
"Wj23,6":
  text: "Nie naginaj sądu twego ubogiego w jego sprawie."
  tags: []
"Wj23,7":
  text: "Trzymaj się z dala od nieuczciwej sprawy. Nie zabijaj niewinnego i sprawiedliwego, bo nie usprawiedliwię bezbożnego."
  tags: []
"Wj23,8":
  text: "Nie będziesz też brać darów, ponieważ dar zaślepia mądrych i wypacza słowa sprawiedliwych."
  tags: []
"Wj23,9":
  text: "Nie uciskaj również przybysza, bo sami wiecie, jak się czuje przybysz, gdyż byliście przybyszami w ziemi Egiptu."
  tags: []
"Wj23,10":
  text: "Przez sześć lat będziesz obsiewał swoją ziemię i zbierał jej plony;"
  tags: []
"Wj23,11":
  text: "A w siódmym roku zostawisz ją odłogiem, żeby odpoczęła, aby jedli ubodzy twego ludu, a co zostanie po nich, zjedzą zwierzęta polne. Tak też postąpisz ze swoją winnicą i swoim sadem oliwnym."
  tags: []
"Wj23,12":
  text: "Przez sześć dni będziesz wykonywać swoją pracę, ale siódmego dnia odpoczniesz, aby odpoczął twój wół i twój osioł i żeby odetchnął syn twojej niewolnicy i przybysz."
  tags: []
"Wj23,13":
  text: "A we wszystkim, co wam powiedziałem, bądźcie ostrożni. Nie wspominajcie też imienia obcych bogów, niech nie będzie słyszane z twoich ust."
  tags: []
"Wj23,14":
  text: "Trzy razy w roku będziesz obchodzić dla mnie święto."
  tags: []
"Wj23,15":
  text: "Będziesz obchodzić Święto Przaśników. Siedem dni będziesz jeść przaśniki, jak ci nakazałem, w miesiącu Abib, bo w nim wyszedłeś z Egiptu. Nie pokażecie się przede mną z pustymi rękami."
  tags: []
"Wj23,16":
  text: "I Święto Żniw, pierwocin twojej pracy, tego, co posiałeś na polu. I także Święto Zbiorów pod koniec roku, gdy zbierzesz z pola owoce swojej pracy."
  tags: []
"Wj23,17":
  text: "Trzy razy w roku wszyscy twoi mężczyźni mają się pokazać przed Panem BOGIEM."
  tags: []
"Wj23,18":
  text: "Nie będziesz ofiarował krwi mojej ofiary z chlebem kwaszonym, a tłuszcz mojej ofiary nie zostanie przez noc aż do poranka."
  tags: []
"Wj23,19":
  text: "Przyniesiesz do domu PANA, twego Boga, pierwociny z pierwszych plonów swojej ziemi. Nie będziesz gotował koźlęcia w mleku jego matki."
  tags: []
"Wj23,20":
  text: "Oto posyłam Anioła przed tobą, aby cię strzegł w drodze i doprowadził do miejsca, które przygotowałem."
  tags: []
"Wj23,21":
  text: "Zważaj na niego i słuchaj jego głosu; nie pobudzaj go do gniewu, bo nie przebaczy waszych przestępstw, gdyż moje imię jest w nim."
  tags: []
"Wj23,22":
  text: "Bo jeśli będziesz pilnie słuchać jego głosu i uczynisz wszystko, co powiem, będę wrogiem twoich wrogów i będę dręczyć tych, którzy cię dręczyli."
  tags: []
"Wj23,23":
  text: "Mój Anioł bowiem pójdzie przed tobą i wprowadzi cię do Amorytów, Chetytów, Peryzzytów, Kananejczyków, Chiwwitów i Jebusytów, i wytracę ich."
  tags: []
"Wj23,24":
  text: "Nie będziesz oddawał pokłonu ich bogom ani nie będziesz im służył, ani nie postępuj według ich czynów, ale do gruntu zburz ich i doszczętnie pokrusz ich posągi."
  tags: []
"Wj23,25":
  text: "Będziecie służyć PANU, waszemu Bogu, a on będzie błogosławić twój chleb i twoją wodę; i oddalę od ciebie chorobę."
  tags: []
"Wj23,26":
  text: "Nie będzie w twojej ziemi roniącej ani niepłodnej. Dopełnię liczbę twoich dni."
  tags: []
"Wj23,27":
  text: "Poślę mój strach przed tobą i strwożę wszelki lud, przeciw któremu pójdziesz, i sprawię, że wszyscy twoi wrogowie uciekną przed tobą."
  tags: []
"Wj23,28":
  text: "Poślę też przed tobą szerszenie, które wypędzą Chiwwitów, Kananejczyków i Chetytów sprzed twego oblicza."
  tags: []
"Wj23,29":
  text: "Nie wypędzę ich sprzed twojego oblicza w jednym roku, by ziemia nie zmieniła się w pustynię i nie namnożył się przeciwko tobie dziki zwierz."
  tags: []
"Wj23,30":
  text: "Pomału będę ich wypędzał sprzed twego oblicza, aż się rozmnożysz i posiądziesz ziemię."
  tags: []
"Wj23,31":
  text: "A ustanowię twoje granice od Morza Czerwonego aż do Morza Filistynów, od pustyni aż do rzeki. Oddam bowiem w wasze ręce mieszkańców tej ziemi, a ty wypędzisz ich sprzed twego oblicza."
  tags: []
"Wj23,32":
  text: "Nie zawrzesz przymierza z nimi ani z ich bogami."
  tags: []
"Wj23,33":
  text: "Nie wolno im mieszkać w twojej ziemi, by cię nie doprowadzili do grzechu przeciwko mnie. Jeśli bowiem będziesz służył ich bogom, będzie to dla ciebie sidłem."
  tags: []
