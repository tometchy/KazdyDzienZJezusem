"Wj33,1": "Potem PAN mówił do Mojżesza: Idź, wyrusz stąd, ty i lud, który wyprowadziłeś z ziemi Egiptu, do ziemi, którą przysiągłem Abrahamowi, Izaakowi i Jakubowi, mówiąc: Dam ją twemu potomstwu."
"Wj33,2": "Poślę przed tobą Anioła i wyrzucę Kananejczyka, Amorytę, Chetytę, Peryzzytę, Chiwwitę i Jebusytę;"
"Wj33,3": "Do ziemi opływającej mlekiem i miodem. Lecz sam nie pójdę z tobą, bo jesteś ludem twardego karku, bym cię w drodze nie wytracił."
"Wj33,4": "Gdy lud usłyszał te złe wieści, zasmucił się i nikt nie włożył na siebie swoich ozdób."
"Wj33,5": "PAN bowiem powiedział do Mojżesza: Powiedz synom Izraela: Jesteście ludem twardego karku. Przyjdę niespodziewanie pośród ciebie i wytracę cię. Teraz więc zdejmij z siebie swoje ozdoby, abym wiedział, co mam ci uczynić."
"Wj33,6": "I synowie Izraela zdjęli swoje ozdoby przy górze Horeb."
"Wj33,7": "A Mojżesz wziął namiot i rozbił go poza obozem, z dala od obozu, i nazwał go Namiotem Zgromadzenia. Każdy, kto chciał się poradzić PANA, wychodził do Namiotu Zgromadzenia, który był poza obozem."
"Wj33,8": "A gdy Mojżesz wychodził do namiotu, cały lud powstawał i każdy stał u wejścia do swego namiotu, i patrzył na Mojżesza, aż wszedł do namiotu."
"Wj33,9": "Gdy Mojżesz wchodził do namiotu, słup obłoku zstępował i stawał u wejścia do namiotu, i PAN rozmawiał z Mojżeszem."
"Wj33,10": "A cały lud widział słup obłoku stojący u wejścia do namiotu. Wtedy cały lud powstawał i oddawał pokłon, każdy u wejścia do swego namiotu."
"Wj33,11": "I PAN rozmawiał z Mojżeszem twarzą w twarz, jak człowiek rozmawia ze swoim przyjacielem. Potem Mojżesz wracał do obozu, a jego sługa Jozue, syn Nuna, młodzieniec, nie opuszczał namiotu."
"Wj33,12": "I Mojżesz powiedział do PANA: Oto mówisz mi: Prowadź ten lud, a nie oznajmiłeś mi, kogo poślesz ze mną. Ponadto powiedziałeś: Znam cię po imieniu, znalazłeś też łaskę w moich oczach."
"Wj33,13": "Teraz więc, jeśli znalazłem łaskę w twoich oczach, ukaż mi, proszę, twoją drogę, żebym cię poznał i żebym znalazł łaskę w twoich oczach. Zważ także, że ten naród jest twoim ludem."
"Wj33,14": "I PAN odpowiedział: Moje oblicze pójdzie przed tobą i dam ci odpoczynek."
"Wj33,15": "Mojżesz powiedział do niego: Jeśli twoje oblicze nie pójdzie z nami, nie wyprowadzaj nas stąd."
"Wj33,16": "Po czym bowiem będzie można poznać, że ja i twój lud znaleźliśmy łaskę w twoich oczach? Czy nie po tym, że pójdziesz z nami? W ten sposób ja i twój lud będziemy wyróżnieni spośród wszystkich ludów, które są na ziemi."
"Wj33,17": "I PAN powiedział do Mojżesza: Uczynię także to, o czym mówiłeś, bo znalazłeś łaskę w moich oczach i znam cię po imieniu."
"Wj33,18": "Mojżesz powiedział też: Ukaż mi, proszę, twoją chwałę."
"Wj33,19": "A on odpowiedział: Sprawię, że cała moja dobroć przejdzie przed twoją twarzą, i wypowiem imię PANA przed tobą. Zmiłuję się, nad kim się zmiłuję, i zlituję się, nad kim się zlituję."
"Wj33,20": "I dodał: Nie będziesz mógł widzieć mego oblicza, bo nie może człowiek ujrzeć mnie i pozostać przy życiu."
"Wj33,21": "PAN mówił dalej: Oto miejsce przy mnie, staniesz na skale."
"Wj33,22": "A gdy będzie przechodzić moja chwała, postawię cię w rozpadlinie skalnej i zakryję cię swoją dłonią, aż przejdę."
"Wj33,23": "Potem odejmę dłoń i ujrzysz mnie od tyłu, ale moje oblicze nie będzie widziane."
