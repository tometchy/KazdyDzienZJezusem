"Wj33,1":
  text: "Potem PAN mówił do Mojżesza: Idź, wyrusz stąd, ty i lud, który wyprowadziłeś z ziemi Egiptu, do ziemi, którą przysiągłem Abrahamowi, Izaakowi i Jakubowi, mówiąc: Dam ją twemu potomstwu."
  tags: []
"Wj33,2":
  text: "Poślę przed tobą Anioła i wyrzucę Kananejczyka, Amorytę, Chetytę, Peryzzytę, Chiwwitę i Jebusytę;"
  tags: []
"Wj33,3":
  text: "Do ziemi opływającej mlekiem i miodem. Lecz sam nie pójdę z tobą, bo jesteś ludem twardego karku, bym cię w drodze nie wytracił."
  tags: []
"Wj33,4":
  text: "Gdy lud usłyszał te złe wieści, zasmucił się i nikt nie włożył na siebie swoich ozdób."
  tags: []
"Wj33,5":
  text: "PAN bowiem powiedział do Mojżesza: Powiedz synom Izraela: Jesteście ludem twardego karku. Przyjdę niespodziewanie pośród ciebie i wytracę cię. Teraz więc zdejmij z siebie swoje ozdoby, abym wiedział, co mam ci uczynić."
  tags: []
"Wj33,6":
  text: "I synowie Izraela zdjęli swoje ozdoby przy górze Horeb."
  tags: []
"Wj33,7":
  text: "A Mojżesz wziął namiot i rozbił go poza obozem, z dala od obozu, i nazwał go Namiotem Zgromadzenia. Każdy, kto chciał się poradzić PANA, wychodził do Namiotu Zgromadzenia, który był poza obozem."
  tags: []
"Wj33,8":
  text: "A gdy Mojżesz wychodził do namiotu, cały lud powstawał i każdy stał u wejścia do swego namiotu, i patrzył na Mojżesza, aż wszedł do namiotu."
  tags: []
"Wj33,9":
  text: "Gdy Mojżesz wchodził do namiotu, słup obłoku zstępował i stawał u wejścia do namiotu, i PAN rozmawiał z Mojżeszem."
  tags: []
"Wj33,10":
  text: "A cały lud widział słup obłoku stojący u wejścia do namiotu. Wtedy cały lud powstawał i oddawał pokłon, każdy u wejścia do swego namiotu."
  tags: []
"Wj33,11":
  text: "I PAN rozmawiał z Mojżeszem twarzą w twarz, jak człowiek rozmawia ze swoim przyjacielem. Potem Mojżesz wracał do obozu, a jego sługa Jozue, syn Nuna, młodzieniec, nie opuszczał namiotu."
  tags: []
"Wj33,12":
  text: "I Mojżesz powiedział do PANA: Oto mówisz mi: Prowadź ten lud, a nie oznajmiłeś mi, kogo poślesz ze mną. Ponadto powiedziałeś: Znam cię po imieniu, znalazłeś też łaskę w moich oczach."
  tags: []
"Wj33,13":
  text: "Teraz więc, jeśli znalazłem łaskę w twoich oczach, ukaż mi, proszę, twoją drogę, żebym cię poznał i żebym znalazł łaskę w twoich oczach. Zważ także, że ten naród jest twoim ludem."
  tags: []
"Wj33,14":
  text: "I PAN odpowiedział: Moje oblicze pójdzie przed tobą i dam ci odpoczynek."
  tags: []
"Wj33,15":
  text: "Mojżesz powiedział do niego: Jeśli twoje oblicze nie pójdzie z nami, nie wyprowadzaj nas stąd."
  tags: []
"Wj33,16":
  text: "Po czym bowiem będzie można poznać, że ja i twój lud znaleźliśmy łaskę w twoich oczach? Czy nie po tym, że pójdziesz z nami? W ten sposób ja i twój lud będziemy wyróżnieni spośród wszystkich ludów, które są na ziemi."
  tags: []
"Wj33,17":
  text: "I PAN powiedział do Mojżesza: Uczynię także to, o czym mówiłeś, bo znalazłeś łaskę w moich oczach i znam cię po imieniu."
  tags: []
"Wj33,18":
  text: "Mojżesz powiedział też: Ukaż mi, proszę, twoją chwałę."
  tags: []
"Wj33,19":
  text: "A on odpowiedział: Sprawię, że cała moja dobroć przejdzie przed twoją twarzą, i wypowiem imię PANA przed tobą. Zmiłuję się, nad kim się zmiłuję, i zlituję się, nad kim się zlituję."
  tags: []
"Wj33,20":
  text: "I dodał: Nie będziesz mógł widzieć mego oblicza, bo nie może człowiek ujrzeć mnie i pozostać przy życiu."
  tags: []
"Wj33,21":
  text: "PAN mówił dalej: Oto miejsce przy mnie, staniesz na skale."
  tags: []
"Wj33,22":
  text: "A gdy będzie przechodzić moja chwała, postawię cię w rozpadlinie skalnej i zakryję cię swoją dłonią, aż przejdę."
  tags: []
"Wj33,23":
  text: "Potem odejmę dłoń i ujrzysz mnie od tyłu, ale moje oblicze nie będzie widziane."
  tags: []
