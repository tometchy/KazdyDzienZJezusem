"Wj36,1":
  text: "Tak więc wykonali Besalel i Oholiab, i wszyscy uzdolnieni mężczyźni, którym Bóg dał mądrość i rozum, aby umieli wykonać każdą pracę do służby w świątyni, według wszystkiego, co PAN rozkazał."
  tags: []
"Wj36,2":
  text: "I Mojżesz wezwał Besalela i Oholiaba, i każdego uzdolnionego mężczyznę, któremu PAN włożył w serce mądrość, którego serce pobudziło, aby przystąpić do wykonywania tej pracy."
  tags: []
"Wj36,3":
  text: "I wzięli od Mojżesza wszystkie dary, które synowie Izraela przynieśli na dzieło służby w świątyni, aby ją wykonać. Oni zaś nadal przynosili mu dobrowolne dary każdego poranka."
  tags: []
"Wj36,4":
  text: "Przyszli więc wszyscy uzdolnieni, którzy wykonywali wszelką pracę przy świątyni, każdy od swojej pracy, którą wykonywał;"
  tags: []
"Wj36,5":
  text: "I powiedzieli do Mojżesza: Lud przynosi dużo więcej niż potrzeba do wykonania tej służby, którą PAN rozkazał uczynić."
  tags: []
"Wj36,6":
  text: "Mojżesz rozkazał więc, aby ogłoszono w obozie: Niech już ani mężczyzna, ani kobieta nie przynosi więcej ofiar na budowę świątyni. I powstrzymano lud od ich przynoszenia."
  tags: []
"Wj36,7":
  text: "Bo to, co mieli, wystarczyło do wykonania wszelkiej pracy, a nawet zbywało."
  tags: []
"Wj36,8":
  text: "I wszyscy uzdolnieni rzemieślnicy wykonali pracę przybytku: dziesięć zasłon ze skręconego bisioru, błękitnej tkaniny, purpury i karmazynu. Zrobili je z haftowanymi cherubinami."
  tags: []
"Wj36,9":
  text: "Długość jednej zasłony była na dwadzieścia osiem łokci, a jej szerokość – na cztery łokcie. Wszystkie zasłony miały jednakowe wymiary."
  tags: []
"Wj36,10":
  text: "I spięli pięć zasłon jedną z drugą, także drugie pięć zasłon spięli jedną z drugą."
  tags: []
"Wj36,11":
  text: "Porobili też pętle z błękitnej tkaniny na brzegu jednej zasłony, na końcu, gdzie mają się spinać. Zrobili je także na brzegu drugiej zasłony, na końcu, gdzie mają się spinać."
  tags: []
"Wj36,12":
  text: "Pięćdziesiąt pętli zrobili na jednej zasłonie i pięćdziesiąt pętli zrobili na brzegu zasłony, w miejscu, gdzie ma być spięta z drugą. Pętle były jedna naprzeciw drugiej."
  tags: []
"Wj36,13":
  text: "Zrobili też pięćdziesiąt złotych haczyków i spięli jedną zasłonę z drugą tymi haczykami. I tak przybytek stanowił jedną całość."
  tags: []
"Wj36,14":
  text: "Wykonali też zasłony z koziej sierści na namiot do przykrycia przybytku z wierzchu, zrobili jedenaście zasłon."
  tags: []
"Wj36,15":
  text: "Długość jednej zasłony była na trzydzieści łokci, a jej szerokość – na cztery łokcie. Jedenaście zasłon miało jednakowe wymiary."
  tags: []
"Wj36,16":
  text: "I spięli pięć zasłon osobno, a sześć zasłon osobno."
  tags: []
"Wj36,17":
  text: "Zrobili też pięćdziesiąt pętli na brzegu jednej zasłony, na końcu, gdzie ma być spięta, i pięćdziesiąt pętli zrobili na brzegu drugiej zasłony do spięcia."
  tags: []
"Wj36,18":
  text: "Zrobili też pięćdziesiąt miedzianych haczyków do spięcia namiotu, aby stanowił jedną całość."
  tags: []
"Wj36,19":
  text: "Zrobili ponadto przykrycie na namiot ze skór baranich czerwono farbowanych i przykrycie ze skór borsuczych na wierzch."
  tags: []
"Wj36,20":
  text: "Zrobili też prosto stojące deski do przybytku z drewna akacjowego."
  tags: []
"Wj36,21":
  text: "Długość jednej deski wynosiła dziesięć łokci, a jej szerokość – półtora łokcia."
  tags: []
"Wj36,22":
  text: "Jedna deska miała dwa czopy ułożone jeden naprzeciw drugiego. Tak zrobili przy wszystkich deskach przybytku."
  tags: []
"Wj36,23":
  text: "Zrobili też deski do przybytku, dwadzieścia desek na stronę południową, ku południowemu wiatrowi."
  tags: []
"Wj36,24":
  text: "I zrobili ze srebra czterdzieści podstawek pod dwadzieścia desek: dwie podstawki pod jedną deskę do dwóch jej czopów, także dwie podstawki pod drugą deskę do dwóch jej czopów."
  tags: []
"Wj36,25":
  text: "Także na drugim boku przybytku od strony północnej zrobili dwadzieścia desek;"
  tags: []
"Wj36,26":
  text: "I do nich czterdzieści srebrnych podstawek: dwie podstawki pod jedną deskę i dwie podstawki pod drugą deskę."
  tags: []
"Wj36,27":
  text: "Ale po zachodniej stronie przybytku zrobili sześć desek."
  tags: []
"Wj36,28":
  text: "Dwie deski zrobili na narożniki przybytku po obydwu stronach;"
  tags: []
"Wj36,29":
  text: "A były złączone od spodu, były też złączone u góry do jednego pierścienia. Tak zrobili po obu stronach na dwóch narożnikach."
  tags: []
"Wj36,30":
  text: "Było więc osiem desek i do nich szesnaście srebrnych podstawek, po dwie podstawki pod każdą deską."
  tags: []
"Wj36,31":
  text: "Zrobili też drążki z drewna akacjowego; pięć do desek jednej strony przybytku;"
  tags: []
"Wj36,32":
  text: "A także pięć drążków do desek drugiej strony przybytku, również pięć drążków do desek zachodniej strony przybytku."
  tags: []
"Wj36,33":
  text: "I zrobili też środkowy drążek, aby przechodził przez środek desek od końca do końca."
  tags: []
"Wj36,34":
  text: "A deski pokryli złotem i zrobili do nich pierścienie ze złota jako uchwyty dla drążków, i drążki pokryli złotem."
  tags: []
"Wj36,35":
  text: "Zrobili też zasłonę z błękitnej tkaniny, purpury, karmazynu i skręconego bisioru. Zrobili ją z misternie wyhaftowanymi cherubinami."
  tags: []
"Wj36,36":
  text: "A do niej zrobili cztery słupy z drewna akacjowego i pokryli je złotem, haki do nich też były ze złota, i odlali do nich cztery srebrne podstawki."
  tags: []
"Wj36,37":
  text: "Zrobili też zasłonę do wejścia do namiotu z błękitnej tkaniny, purpury, karmazynu i skręconego bisioru, haftowaną;"
  tags: []
"Wj36,38":
  text: "A do niej pięć słupów z haczykami i pokryli złotem ich głowice i klamry, a pięć podstawek do nich było z miedzi."
  tags: []
