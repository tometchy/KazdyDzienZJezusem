"Wj36,1": "Tak więc wykonali Besalel i Oholiab, i wszyscy uzdolnieni mężczyźni, którym Bóg dał mądrość i rozum, aby umieli wykonać każdą pracę do służby w świątyni, według wszystkiego, co PAN rozkazał."
"Wj36,2": "I Mojżesz wezwał Besalela i Oholiaba, i każdego uzdolnionego mężczyznę, któremu PAN włożył w serce mądrość, którego serce pobudziło, aby przystąpić do wykonywania tej pracy."
"Wj36,3": "I wzięli od Mojżesza wszystkie dary, które synowie Izraela przynieśli na dzieło służby w świątyni, aby ją wykonać. Oni zaś nadal przynosili mu dobrowolne dary każdego poranka."
"Wj36,4": "Przyszli więc wszyscy uzdolnieni, którzy wykonywali wszelką pracę przy świątyni, każdy od swojej pracy, którą wykonywał;"
"Wj36,5": "I powiedzieli do Mojżesza: Lud przynosi dużo więcej niż potrzeba do wykonania tej służby, którą PAN rozkazał uczynić."
"Wj36,6": "Mojżesz rozkazał więc, aby ogłoszono w obozie: Niech już ani mężczyzna, ani kobieta nie przynosi więcej ofiar na budowę świątyni. I powstrzymano lud od ich przynoszenia."
"Wj36,7": "Bo to, co mieli, wystarczyło do wykonania wszelkiej pracy, a nawet zbywało."
"Wj36,8": "I wszyscy uzdolnieni rzemieślnicy wykonali pracę przybytku: dziesięć zasłon ze skręconego bisioru, błękitnej tkaniny, purpury i karmazynu. Zrobili je z haftowanymi cherubinami."
"Wj36,9": "Długość jednej zasłony była na dwadzieścia osiem łokci, a jej szerokość – na cztery łokcie. Wszystkie zasłony miały jednakowe wymiary."
"Wj36,10": "I spięli pięć zasłon jedną z drugą, także drugie pięć zasłon spięli jedną z drugą."
"Wj36,11": "Porobili też pętle z błękitnej tkaniny na brzegu jednej zasłony, na końcu, gdzie mają się spinać. Zrobili je także na brzegu drugiej zasłony, na końcu, gdzie mają się spinać."
"Wj36,12": "Pięćdziesiąt pętli zrobili na jednej zasłonie i pięćdziesiąt pętli zrobili na brzegu zasłony, w miejscu, gdzie ma być spięta z drugą. Pętle były jedna naprzeciw drugiej."
"Wj36,13": "Zrobili też pięćdziesiąt złotych haczyków i spięli jedną zasłonę z drugą tymi haczykami. I tak przybytek stanowił jedną całość."
"Wj36,14": "Wykonali też zasłony z koziej sierści na namiot do przykrycia przybytku z wierzchu, zrobili jedenaście zasłon."
"Wj36,15": "Długość jednej zasłony była na trzydzieści łokci, a jej szerokość – na cztery łokcie. Jedenaście zasłon miało jednakowe wymiary."
"Wj36,16": "I spięli pięć zasłon osobno, a sześć zasłon osobno."
"Wj36,17": "Zrobili też pięćdziesiąt pętli na brzegu jednej zasłony, na końcu, gdzie ma być spięta, i pięćdziesiąt pętli zrobili na brzegu drugiej zasłony do spięcia."
"Wj36,18": "Zrobili też pięćdziesiąt miedzianych haczyków do spięcia namiotu, aby stanowił jedną całość."
"Wj36,19": "Zrobili ponadto przykrycie na namiot ze skór baranich czerwono farbowanych i przykrycie ze skór borsuczych na wierzch."
"Wj36,20": "Zrobili też prosto stojące deski do przybytku z drewna akacjowego."
"Wj36,21": "Długość jednej deski wynosiła dziesięć łokci, a jej szerokość – półtora łokcia."
"Wj36,22": "Jedna deska miała dwa czopy ułożone jeden naprzeciw drugiego. Tak zrobili przy wszystkich deskach przybytku."
"Wj36,23": "Zrobili też deski do przybytku, dwadzieścia desek na stronę południową, ku południowemu wiatrowi."
"Wj36,24": "I zrobili ze srebra czterdzieści podstawek pod dwadzieścia desek: dwie podstawki pod jedną deskę do dwóch jej czopów, także dwie podstawki pod drugą deskę do dwóch jej czopów."
"Wj36,25": "Także na drugim boku przybytku od strony północnej zrobili dwadzieścia desek;"
"Wj36,26": "I do nich czterdzieści srebrnych podstawek: dwie podstawki pod jedną deskę i dwie podstawki pod drugą deskę."
"Wj36,27": "Ale po zachodniej stronie przybytku zrobili sześć desek."
"Wj36,28": "Dwie deski zrobili na narożniki przybytku po obydwu stronach;"
"Wj36,29": "A były złączone od spodu, były też złączone u góry do jednego pierścienia. Tak zrobili po obu stronach na dwóch narożnikach."
"Wj36,30": "Było więc osiem desek i do nich szesnaście srebrnych podstawek, po dwie podstawki pod każdą deską."
"Wj36,31": "Zrobili też drążki z drewna akacjowego; pięć do desek jednej strony przybytku;"
"Wj36,32": "A także pięć drążków do desek drugiej strony przybytku, również pięć drążków do desek zachodniej strony przybytku."
"Wj36,33": "I zrobili też środkowy drążek, aby przechodził przez środek desek od końca do końca."
"Wj36,34": "A deski pokryli złotem i zrobili do nich pierścienie ze złota jako uchwyty dla drążków, i drążki pokryli złotem."
"Wj36,35": "Zrobili też zasłonę z błękitnej tkaniny, purpury, karmazynu i skręconego bisioru. Zrobili ją z misternie wyhaftowanymi cherubinami."
"Wj36,36": "A do niej zrobili cztery słupy z drewna akacjowego i pokryli je złotem, haki do nich też były ze złota, i odlali do nich cztery srebrne podstawki."
"Wj36,37": "Zrobili też zasłonę do wejścia do namiotu z błękitnej tkaniny, purpury, karmazynu i skręconego bisioru, haftowaną;"
"Wj36,38": "A do niej pięć słupów z haczykami i pokryli złotem ich głowice i klamry, a pięć podstawek do nich było z miedzi."
