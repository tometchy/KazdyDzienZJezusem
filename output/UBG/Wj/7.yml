"Wj7,1":
  text: "I PAN powiedział do Mojżesza: Oto ustanowiłem cię bogiem dla faraona, a twój brat Aaron będzie twoim prorokiem."
  tags: []
"Wj7,2":
  text: "Ty powiesz wszystko, co ci rozkażę. A twój brat Aaron będzie mówił do faraona, aby wypuścił synów Izraela ze swojej ziemi."
  tags: []
"Wj7,3":
  text: "A ja zatwardzę serce faraona i pomnożę moje znaki i cuda w ziemi Egiptu."
  tags: []
"Wj7,4":
  text: "Faraon was nie posłucha, lecz ja położę moją rękę na Egipcie i wyprowadzę moje zastępy, mój lud, synów Izraela, z ziemi Egiptu przez wielkie sądy."
  tags: []
"Wj7,5":
  text: "A Egipcjanie poznają, że ja jestem PAN, gdy wyciągnę rękę na Egipt i wyprowadzę synów Izraela spośród nich."
  tags: []
"Wj7,6":
  text: "Mojżesz i Aaron uczynili więc, jak im PAN przykazał; tak właśnie uczynili."
  tags: []
"Wj7,7":
  text: "Mojżesz miał osiemdziesiąt lat, a Aaron osiemdziesiąt trzy lata, gdy mówili do faraona."
  tags: []
"Wj7,8":
  text: "Wtedy PAN powiedział do Mojżesza i Aarona:"
  tags: []
"Wj7,9":
  text: "Gdy faraon powie wam: Uczyńcie jakiś cud, wtedy powiesz do Aarona: Weź swą laskę i rzuć ją przed faraonem, a zamieni się w węża."
  tags: []
"Wj7,10":
  text: "Mojżesz i Aaron przyszli do faraona i uczynili tak, jak PAN rozkazał. Aaron rzucił swoją laskę przed faraonem i jego sługami, a ona zamieniła się w węża."
  tags: []
"Wj7,11":
  text: "Wtedy faraon wezwał mędrców i czarowników. I ci egipscy czarownicy uczynili to samo swoimi czarami."
  tags: []
"Wj7,12":
  text: "Każdy z nich rzucił swoją laskę, a zamieniły się w węże. Lecz laska Aarona pożarła ich laski."
  tags: []
"Wj7,13":
  text: "Serce faraona stało się jednak zatwardziałe i nie posłuchał ich, jak PAN zapowiedział."
  tags: []
"Wj7,14":
  text: "Potem PAN powiedział do Mojżesza: Serce faraona jest zatwardziałe, wzbrania się wypuścić lud."
  tags: []
"Wj7,15":
  text: "Idź do faraona rankiem, kiedy wyjdzie nad wodę. Staniesz naprzeciwko niego nad brzegiem rzeki i weźmiesz do ręki laskę, która się zamieniła w węża;"
  tags: []
"Wj7,16":
  text: "I powiesz mu: PAN, Bóg Hebrajczyków, posłał mnie do ciebie, mówiąc: Wypuść mój lud, aby mi służył na pustyni, a oto dotąd nie posłuchałeś."
  tags: []
"Wj7,17":
  text: "Dlatego tak mówi PAN: Po tym poznasz, że ja jestem PAN. Oto uderzę laską, która jest w mojej ręce, w wody, które są w rzece, a one zamienią się w krew."
  tags: []
"Wj7,18":
  text: "Ryby, które są w rzece, pozdychają i rzeka będzie cuchnąć. Egipcjanie się zmęczą poszukiwaniem wody z rzeki do picia."
  tags: []
"Wj7,19":
  text: "PAN mówił dalej do Mojżesza: Powiedz Aaronowi: Weź swoją laskę i wyciągnij rękę nad wody Egiptu, nad ich rzeki, nad ich strugi, nad ich jeziora i nad wszelkie zbiorowiska wód, a one zamienią się w krew. Krew będzie na całej ziemi Egiptu, tak w naczyniach drewnianych, jak i w kamiennych."
  tags: []
"Wj7,20":
  text: "Mojżesz i Aaron uczynili tak, jak PAN rozkazał. Aaron podniósł laskę i uderzył wody rzeki na oczach faraona i jego sług. I wszystkie wody rzeki zamieniły się w krew."
  tags: []
"Wj7,21":
  text: "Ryby, które były w rzece, pozdychały i rzeka zaczęła cuchnąć, tak że Egipcjanie nie mogli pić z niej wody. A krew była w całej ziemi Egiptu."
  tags: []
"Wj7,22":
  text: "Lecz egipscy czarownicy uczynili to samo swoimi czarami. Pozostało więc zatwardziałe serce faraona i nie posłuchał ich, jak PAN zapowiedział."
  tags: []
"Wj7,23":
  text: "Faraon odwrócił się i poszedł do swego domu, i tego również nie wziął sobie do serca."
  tags: []
"Wj7,24":
  text: "I wszyscy Egipcjanie kopali wokół rzeki w poszukiwaniu wody do picia, bo nie mogli pić wody z rzeki."
  tags: []
"Wj7,25":
  text: "I upłynęło siedem dni od chwili, gdy PAN uderzył rzekę."
  tags: []
