"Wj7,1": "I PAN powiedział do Mojżesza: Oto ustanowiłem cię bogiem dla faraona, a twój brat Aaron będzie twoim prorokiem."
"Wj7,2": "Ty powiesz wszystko, co ci rozkażę. A twój brat Aaron będzie mówił do faraona, aby wypuścił synów Izraela ze swojej ziemi."
"Wj7,3": "A ja zatwardzę serce faraona i pomnożę moje znaki i cuda w ziemi Egiptu."
"Wj7,4": "Faraon was nie posłucha, lecz ja położę moją rękę na Egipcie i wyprowadzę moje zastępy, mój lud, synów Izraela, z ziemi Egiptu przez wielkie sądy."
"Wj7,5": "A Egipcjanie poznają, że ja jestem PAN, gdy wyciągnę rękę na Egipt i wyprowadzę synów Izraela spośród nich."
"Wj7,6": "Mojżesz i Aaron uczynili więc, jak im PAN przykazał; tak właśnie uczynili."
"Wj7,7": "Mojżesz miał osiemdziesiąt lat, a Aaron osiemdziesiąt trzy lata, gdy mówili do faraona."
"Wj7,8": "Wtedy PAN powiedział do Mojżesza i Aarona:"
"Wj7,9": "Gdy faraon powie wam: Uczyńcie jakiś cud, wtedy powiesz do Aarona: Weź swą laskę i rzuć ją przed faraonem, a zamieni się w węża."
"Wj7,10": "Mojżesz i Aaron przyszli do faraona i uczynili tak, jak PAN rozkazał. Aaron rzucił swoją laskę przed faraonem i jego sługami, a ona zamieniła się w węża."
"Wj7,11": "Wtedy faraon wezwał mędrców i czarowników. I ci egipscy czarownicy uczynili to samo swoimi czarami."
"Wj7,12": "Każdy z nich rzucił swoją laskę, a zamieniły się w węże. Lecz laska Aarona pożarła ich laski."
"Wj7,13": "Serce faraona stało się jednak zatwardziałe i nie posłuchał ich, jak PAN zapowiedział."
"Wj7,14": "Potem PAN powiedział do Mojżesza: Serce faraona jest zatwardziałe, wzbrania się wypuścić lud."
"Wj7,15": "Idź do faraona rankiem, kiedy wyjdzie nad wodę. Staniesz naprzeciwko niego nad brzegiem rzeki i weźmiesz do ręki laskę, która się zamieniła w węża;"
"Wj7,16": "I powiesz mu: PAN, Bóg Hebrajczyków, posłał mnie do ciebie, mówiąc: Wypuść mój lud, aby mi służył na pustyni, a oto dotąd nie posłuchałeś."
"Wj7,17": "Dlatego tak mówi PAN: Po tym poznasz, że ja jestem PAN. Oto uderzę laską, która jest w mojej ręce, w wody, które są w rzece, a one zamienią się w krew."
"Wj7,18": "Ryby, które są w rzece, pozdychają i rzeka będzie cuchnąć. Egipcjanie się zmęczą poszukiwaniem wody z rzeki do picia."
"Wj7,19": "PAN mówił dalej do Mojżesza: Powiedz Aaronowi: Weź swoją laskę i wyciągnij rękę nad wody Egiptu, nad ich rzeki, nad ich strugi, nad ich jeziora i nad wszelkie zbiorowiska wód, a one zamienią się w krew. Krew będzie na całej ziemi Egiptu, tak w naczyniach drewnianych, jak i w kamiennych."
"Wj7,20": "Mojżesz i Aaron uczynili tak, jak PAN rozkazał. Aaron podniósł laskę i uderzył wody rzeki na oczach faraona i jego sług. I wszystkie wody rzeki zamieniły się w krew."
"Wj7,21": "Ryby, które były w rzece, pozdychały i rzeka zaczęła cuchnąć, tak że Egipcjanie nie mogli pić z niej wody. A krew była w całej ziemi Egiptu."
"Wj7,22": "Lecz egipscy czarownicy uczynili to samo swoimi czarami. Pozostało więc zatwardziałe serce faraona i nie posłuchał ich, jak PAN zapowiedział."
"Wj7,23": "Faraon odwrócił się i poszedł do swego domu, i tego również nie wziął sobie do serca."
"Wj7,24": "I wszyscy Egipcjanie kopali wokół rzeki w poszukiwaniu wody do picia, bo nie mogli pić wody z rzeki."
"Wj7,25": "I upłynęło siedem dni od chwili, gdy PAN uderzył rzekę."
