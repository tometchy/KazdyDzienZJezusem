"Wj26,1":
  text: "Uczynisz też przybytek z dziesięciu zasłon ze skręconego bisioru, z błękitnej tkaniny oraz z purpury i karmazynu, na których wyhaftujesz cherubiny."
  tags: []
"Wj26,2":
  text: "Długość jednej zasłony ma wynosić dwadzieścia osiem łokci, a szerokość jednej zasłony – cztery łokcie. Wszystkie zasłony będą miały jednakowe wymiary."
  tags: []
"Wj26,3":
  text: "Pięć zasłon będzie spiętych jedna z drugą; także drugie pięć zasłon będzie spiętych jedna z drugą."
  tags: []
"Wj26,4":
  text: "I uczynisz błękitne pętle na brzegu jednej zasłony, gdzie skraje mają się spinać. Uczynisz je też na brzegu drugiej zasłony, gdzie skraje mają się spinać."
  tags: []
"Wj26,5":
  text: "Pięćdziesiąt pętli uczynisz na jednej zasłonie i pięćdziesiąt pętli uczynisz na brzegu drugiej zasłony, w miejscu, gdzie ma być spięta z drugą. Pętle będą jedna naprzeciw drugiej."
  tags: []
"Wj26,6":
  text: "Uczynisz też pięćdziesiąt złotych haczyków i złączysz jedną zasłonę z drugą tymi haczykami. I tak przybytek będzie stanowił jedną całość."
  tags: []
"Wj26,7":
  text: "Uczynisz też zasłony z koziej sierści do przykrycia przybytku z wierzchu. Uczynisz jedenaście takich zasłon."
  tags: []
"Wj26,8":
  text: "Długość jednej zasłony ma wynosić trzydzieści łokci, a szerokość jednej zasłony – cztery łokcie. Wszystkie jedenaście zasłon będzie mieć jednakowe wymiary."
  tags: []
"Wj26,9":
  text: "I zepniesz pięć zasłon osobno, a sześć zasłon osobno. Szóstą zasłonę złożysz we dwoje na przodzie namiotu."
  tags: []
"Wj26,10":
  text: "Uczynisz też pięćdziesiąt pętli na brzegu jednej zasłony, na końcu, gdzie ma być spięta, i pięćdziesiąt pętli z brzegu drugiej zasłony do spinania drugiego brzegu."
  tags: []
"Wj26,11":
  text: "Uczynisz też pięćdziesiąt miedzianych haczyków i włożysz haczyki w pętle, i zepniesz namiot, aby stanowił jedną całość."
  tags: []
"Wj26,12":
  text: "A część, która zbywa z zasłon namiotu, to jest pozostała połowa zasłony, będzie zwisać z tyłu przybytku."
  tags: []
"Wj26,13":
  text: "A łokieć z jednej i łokieć z drugiej strony, który zbywa z długości zasłon namiotu, będzie wisiał po obu stronach przybytku, po jednej i drugiej, żeby go okrywać."
  tags: []
"Wj26,14":
  text: "Uczynisz też przykrycie na namiot ze skór baranich farbowanych na czerwono i przykrycie ze skór borsuczych na wierzch."
  tags: []
"Wj26,15":
  text: "Uczynisz też do przybytku prosto stojące deski z drewna akacjowego."
  tags: []
"Wj26,16":
  text: "Długość jednej deski ma wynosić dziesięć łokci, a szerokość jednej deski – półtora łokcia."
  tags: []
"Wj26,17":
  text: "Jedna deska będzie miała dwa czopy, ułożone jeden naprzeciw drugiego. Tak uczynisz przy wszystkich deskach przybytku."
  tags: []
"Wj26,18":
  text: "Uczynisz więc deski do przybytku: dwadzieścia desek na stronę południową, ku południu."
  tags: []
"Wj26,19":
  text: "Uczynisz też czterdzieści srebrnych podstawek pod tych dwadzieścia desek; dwie podstawki pod jedną deskę do dwóch jej czopów, także do drugiej deski dwie podstawki do dwóch jej czopów."
  tags: []
"Wj26,20":
  text: "Na drugim boku przybytku od strony północnej uczynisz dwadzieścia desek."
  tags: []
"Wj26,21":
  text: "A do nich czterdzieści srebrnych podstawek: dwie podstawki pod jedną deskę i dwie podstawki pod drugą deskę."
  tags: []
"Wj26,22":
  text: "A na zachodnią stronę przybytku uczynisz sześć desek."
  tags: []
"Wj26,23":
  text: "Uczynisz dwie deski jako narożniki przybytku po obydwu stronach."
  tags: []
"Wj26,24":
  text: "Będą one złączone od spodu, będą także złączone u góry do jednego pierścienia. Tak będzie przy tych obu, będą dla dwóch narożników."
  tags: []
"Wj26,25":
  text: "I tak będzie osiem desek, a ich srebrnych podstawek szesnaście, dwie podstawki pod jedną deską i dwie podstawki pod drugą deską."
  tags: []
"Wj26,26":
  text: "Uczynisz też drążki z drewna akacjowego: będzie ich pięć do desek jednej strony przybytku;"
  tags: []
"Wj26,27":
  text: "Pięć także drążków do desek drugiej strony przybytku, a także pięć drążków do desek zachodniej strony przybytku."
  tags: []
"Wj26,28":
  text: "Środkowy drążek w połowie wysokości desek będzie przechodzić od jednego końca do drugiego."
  tags: []
"Wj26,29":
  text: "Deski pokryjesz złotem i uczynisz do nich złote pierścienie, przez które mają przechodzić drążki. Drążki też pokryjesz złotem."
  tags: []
"Wj26,30":
  text: "Wystawisz więc przybytek według wzoru, który ci ukazano na górze."
  tags: []
"Wj26,31":
  text: "Uczynisz też zasłonę z błękitnej tkaniny, purpury, karmazynu i skręconego bisioru; na niej wyhaftujesz cherubiny."
  tags: []
"Wj26,32":
  text: "I zawiesisz ją na czterech słupach z drewna akacjowego pokrytych złotem – ich haki też będą złote – stojących na czterech srebrnych podstawkach."
  tags: []
"Wj26,33":
  text: "A zasłonę zawiesisz na haczykach i wniesiesz za zasłonę arkę świadectwa, a ta zasłona będzie oddzielać wam Miejsce Święte od Najświętszego."
  tags: []
"Wj26,34":
  text: "Położysz też przebłagalnię na arce świadectwa w Miejscu Najświętszym."
  tags: []
"Wj26,35":
  text: "A przed zasłoną postawisz stół, a naprzeciw stołu, po południowej stronie przybytku – świecznik, a stół postawisz po stronie północnej."
  tags: []
"Wj26,36":
  text: "Uczynisz też do wejścia namiotu zasłonę z błękitnej tkaniny, purpury, karmazynu i skręconego bisioru, haftowaną."
  tags: []
"Wj26,37":
  text: "A do tej zasłony uczynisz pięć słupów z drewna akacjowego, które pokryjesz złotem, i ich haki będą złote. I ulejesz do nich pięć miedzianych podstawek."
  tags: []
