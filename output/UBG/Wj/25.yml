"Wj25,1":
  text: "I PAN powiedział do Mojżesza:"
  tags: []
"Wj25,2":
  text: "Powiedz synom Izraela, aby przynieśli mi dar. Od każdego człowieka, który daje dobrowolnie ze swego serca, zbierzcie dar dla mnie."
  tags: []
"Wj25,3":
  text: "A to są dary, które zbierzecie od nich: złoto, srebro i miedź;"
  tags: []
"Wj25,4":
  text: "Błękitna tkanina, purpura, karmazyn, bisior i sierść kozia;"
  tags: []
"Wj25,5":
  text: "Skóry baranie farbowane na czerwono, skóry borsucze i drewno akacjowe;"
  tags: []
"Wj25,6":
  text: "Oliwa do oświetlenia, wonności na olejek do namaszczania i na wonne kadzidło;"
  tags: []
"Wj25,7":
  text: "Kamienie onyksowe i kamienie do osadzenia efodu i pektorału."
  tags: []
"Wj25,8":
  text: "I zbudują mi świątynię, abym mieszkał pośród nich."
  tags: []
"Wj25,9":
  text: "Według wszystkiego, co ci ukażę, według wzoru przybytku i wzoru wszystkich jego naczyń, tak uczynicie."
  tags: []
"Wj25,10":
  text: "Uczynią też arkę z drewna akacjowego. Jej długość będzie na dwa i pół łokcia, jej szerokość – na półtora łokcia, a jej wysokość – na półtora łokcia."
  tags: []
"Wj25,11":
  text: "I pokryjesz ją szczerym złotem, wewnątrz i na zewnątrz pokryjesz ją, a na niej dokoła uczynisz złotą listwę."
  tags: []
"Wj25,12":
  text: "Odlejesz też do niej cztery złote pierścienie, które przymocujesz do czterech jej narożników: dwa pierścienie do jednego jej boku i dwa pierścienie do drugiego jej boku."
  tags: []
"Wj25,13":
  text: "Uczynisz drążki z drewna akacjowego i pokryjesz je złotem."
  tags: []
"Wj25,14":
  text: "I włożysz drążki w pierścienie na bokach arki, aby na nich noszono arkę."
  tags: []
"Wj25,15":
  text: "Drążki te pozostaną w pierścieniach arki; nie będą z niej wyjmowane."
  tags: []
"Wj25,16":
  text: "W arkę włożysz świadectwo, które ci dam."
  tags: []
"Wj25,17":
  text: "Uczynisz też przebłagalnię ze szczerego złota. Jej długość będzie na dwa i pół łokcia, a jej szerokość – na półtora łokcia."
  tags: []
"Wj25,18":
  text: "I uczynisz dwa złote cherubiny: wykujesz je ze złota na obu końcach przebłagalni."
  tags: []
"Wj25,19":
  text: "Jednego cherubina uczynisz na jednym końcu, a drugiego cherubina na drugim końcu. Z samej przebłagalni uczynicie cherubiny na obu jej końcach."
  tags: []
"Wj25,20":
  text: "A cherubiny będą mieć skrzydła rozpostarte ku górze, zakrywając swymi skrzydłami przebłagalnię. Ich twarze zaś będą zwrócone ku sobie, twarze cherubinów będą zwrócone ku przebłagalni."
  tags: []
"Wj25,21":
  text: "I położysz przebłagalnię na wierzchu arki, a w arkę włożysz świadectwo, które ci dam."
  tags: []
"Wj25,22":
  text: "Tam będę się z tobą spotykać i sponad przebłagalni, spomiędzy dwóch cherubinów, którzy są nad arką świadectwa, będę z tobą rozmawiać o wszystkim, co ci rozkażę dla synów Izraela."
  tags: []
"Wj25,23":
  text: "Uczynisz też stół z drewna akacjowego. Jego długość będzie na dwa łokcie, jego szerokość – na jeden łokieć, a jego wysokość – na półtora łokcia."
  tags: []
"Wj25,24":
  text: "I pokryjesz go szczerym złotem, i uczynisz dokoła niego złotą listwę."
  tags: []
"Wj25,25":
  text: "Uczynisz też dokoła niego obramowanie szerokie na cztery palce i złotą listwę dokoła obramowania."
  tags: []
"Wj25,26":
  text: "Uczynisz też do niego cztery złote pierścienie i przymocujesz je na czterech narożnikach, które są przy jego czterech nogach."
  tags: []
"Wj25,27":
  text: "Przy tym obramowaniu będą pierścienie, przez które przewloką drążki do noszenia stołu."
  tags: []
"Wj25,28":
  text: "A te drążki uczynisz z drewna akacjowego i pokryjesz je złotem, i będzie na nich noszony stół."
  tags: []
"Wj25,29":
  text: "Uczynisz też jego misy, czasze, przykrycia i kubki do nalewania; wykonasz je ze szczerego złota."
  tags: []
"Wj25,30":
  text: "I na ten stół nieustannie będziesz kłaść przede mną chleby pokładne."
  tags: []
"Wj25,31":
  text: "Uczynisz też świecznik ze szczerego złota. Ów świecznik będzie wykuty: jego podstawa, ramiona, kielichy, gałki i kwiaty będą z tej samej bryły."
  tags: []
"Wj25,32":
  text: "Z jego boków będzie wychodzić sześć ramion: trzy ramiona świecznika z jednego boku i trzy ramiona świecznika z drugiego boku."
  tags: []
"Wj25,33":
  text: "Trzy kielichy na kształt migdału na jednym ramieniu, wraz z gałką i kwiatem; i trzy kielichy na kształt migdału na drugim ramieniu, wraz z gałką i kwiatem. Tak będzie na wszystkich sześciu ramionach wychodzących ze świecznika."
  tags: []
"Wj25,34":
  text: "Ale na trzonie świecznika będą cztery kielichy na kształt migdału, z gałkami i kwiatami."
  tags: []
"Wj25,35":
  text: "I będzie gałka pod dwoma jego ramionami, także gałka pod następnymi dwoma ramionami i gałka pod innymi dwoma ramionami: tak będzie pod sześcioma ramionami wychodzącymi ze świecznika."
  tags: []
"Wj25,36":
  text: "Z niego samego będą wychodzić gałki i ramiona, wszystko to w całości będzie wykute ze szczerego złota."
  tags: []
"Wj25,37":
  text: "Uczynisz też do niego siedem lamp i zapalisz je, aby świeciły w przeciwległą stronę."
  tags: []
"Wj25,38":
  text: "Także jego szczypce i naczynia na popiół mają być ze szczerego złota."
  tags: []
"Wj25,39":
  text: "Uczynisz go i wszystkie naczynia z talentu szczerego złota."
  tags: []
"Wj25,40":
  text: "Uważaj, abyś uczynił wszystko według wzoru tego, co ci ukazano na górze."
  tags: []
