"Wj25,1": "I PAN powiedział do Mojżesza:"
"Wj25,2": "Powiedz synom Izraela, aby przynieśli mi dar. Od każdego człowieka, który daje dobrowolnie ze swego serca, zbierzcie dar dla mnie."
"Wj25,3": "A to są dary, które zbierzecie od nich: złoto, srebro i miedź;"
"Wj25,4": "Błękitna tkanina, purpura, karmazyn, bisior i sierść kozia;"
"Wj25,5": "Skóry baranie farbowane na czerwono, skóry borsucze i drewno akacjowe;"
"Wj25,6": "Oliwa do oświetlenia, wonności na olejek do namaszczania i na wonne kadzidło;"
"Wj25,7": "Kamienie onyksowe i kamienie do osadzenia efodu i pektorału."
"Wj25,8": "I zbudują mi świątynię, abym mieszkał pośród nich."
"Wj25,9": "Według wszystkiego, co ci ukażę, według wzoru przybytku i wzoru wszystkich jego naczyń, tak uczynicie."
"Wj25,10": "Uczynią też arkę z drewna akacjowego. Jej długość będzie na dwa i pół łokcia, jej szerokość – na półtora łokcia, a jej wysokość – na półtora łokcia."
"Wj25,11": "I pokryjesz ją szczerym złotem, wewnątrz i na zewnątrz pokryjesz ją, a na niej dokoła uczynisz złotą listwę."
"Wj25,12": "Odlejesz też do niej cztery złote pierścienie, które przymocujesz do czterech jej narożników: dwa pierścienie do jednego jej boku i dwa pierścienie do drugiego jej boku."
"Wj25,13": "Uczynisz drążki z drewna akacjowego i pokryjesz je złotem."
"Wj25,14": "I włożysz drążki w pierścienie na bokach arki, aby na nich noszono arkę."
"Wj25,15": "Drążki te pozostaną w pierścieniach arki; nie będą z niej wyjmowane."
"Wj25,16": "W arkę włożysz świadectwo, które ci dam."
"Wj25,17": "Uczynisz też przebłagalnię ze szczerego złota. Jej długość będzie na dwa i pół łokcia, a jej szerokość – na półtora łokcia."
"Wj25,18": "I uczynisz dwa złote cherubiny: wykujesz je ze złota na obu końcach przebłagalni."
"Wj25,19": "Jednego cherubina uczynisz na jednym końcu, a drugiego cherubina na drugim końcu. Z samej przebłagalni uczynicie cherubiny na obu jej końcach."
"Wj25,20": "A cherubiny będą mieć skrzydła rozpostarte ku górze, zakrywając swymi skrzydłami przebłagalnię. Ich twarze zaś będą zwrócone ku sobie, twarze cherubinów będą zwrócone ku przebłagalni."
"Wj25,21": "I położysz przebłagalnię na wierzchu arki, a w arkę włożysz świadectwo, które ci dam."
"Wj25,22": "Tam będę się z tobą spotykać i sponad przebłagalni, spomiędzy dwóch cherubinów, którzy są nad arką świadectwa, będę z tobą rozmawiać o wszystkim, co ci rozkażę dla synów Izraela."
"Wj25,23": "Uczynisz też stół z drewna akacjowego. Jego długość będzie na dwa łokcie, jego szerokość – na jeden łokieć, a jego wysokość – na półtora łokcia."
"Wj25,24": "I pokryjesz go szczerym złotem, i uczynisz dokoła niego złotą listwę."
"Wj25,25": "Uczynisz też dokoła niego obramowanie szerokie na cztery palce i złotą listwę dokoła obramowania."
"Wj25,26": "Uczynisz też do niego cztery złote pierścienie i przymocujesz je na czterech narożnikach, które są przy jego czterech nogach."
"Wj25,27": "Przy tym obramowaniu będą pierścienie, przez które przewloką drążki do noszenia stołu."
"Wj25,28": "A te drążki uczynisz z drewna akacjowego i pokryjesz je złotem, i będzie na nich noszony stół."
"Wj25,29": "Uczynisz też jego misy, czasze, przykrycia i kubki do nalewania; wykonasz je ze szczerego złota."
"Wj25,30": "I na ten stół nieustannie będziesz kłaść przede mną chleby pokładne."
"Wj25,31": "Uczynisz też świecznik ze szczerego złota. Ów świecznik będzie wykuty: jego podstawa, ramiona, kielichy, gałki i kwiaty będą z tej samej bryły."
"Wj25,32": "Z jego boków będzie wychodzić sześć ramion: trzy ramiona świecznika z jednego boku i trzy ramiona świecznika z drugiego boku."
"Wj25,33": "Trzy kielichy na kształt migdału na jednym ramieniu, wraz z gałką i kwiatem; i trzy kielichy na kształt migdału na drugim ramieniu, wraz z gałką i kwiatem. Tak będzie na wszystkich sześciu ramionach wychodzących ze świecznika."
"Wj25,34": "Ale na trzonie świecznika będą cztery kielichy na kształt migdału, z gałkami i kwiatami."
"Wj25,35": "I będzie gałka pod dwoma jego ramionami, także gałka pod następnymi dwoma ramionami i gałka pod innymi dwoma ramionami: tak będzie pod sześcioma ramionami wychodzącymi ze świecznika."
"Wj25,36": "Z niego samego będą wychodzić gałki i ramiona, wszystko to w całości będzie wykute ze szczerego złota."
"Wj25,37": "Uczynisz też do niego siedem lamp i zapalisz je, aby świeciły w przeciwległą stronę."
"Wj25,38": "Także jego szczypce i naczynia na popiół mają być ze szczerego złota."
"Wj25,39": "Uczynisz go i wszystkie naczynia z talentu szczerego złota."
"Wj25,40": "Uważaj, abyś uczynił wszystko według wzoru tego, co ci ukazano na górze."
