"Wj9,1":
  text: "Potem PAN powiedział do Mojżesza: Idź do faraona i powiedz mu: Tak mówi PAN, Bóg Hebrajczyków: Wypuść mój lud, aby mi służył;"
  tags: []
"Wj9,2":
  text: "Bo jeśli będziesz się wzbraniał go wypuścić i nadal będziesz go zatrzymywał;"
  tags: []
"Wj9,3":
  text: "Oto ręka PANA będzie na twoich stadach, które są na polu, na koniach, na osłach, na wielbłądach, na wołach i na owcach. Będzie bardzo ciężka zaraza."
  tags: []
"Wj9,4":
  text: "PAN rozdzieli stada Izraela i stada Egiptu, aby nie zdechło nic ze wszystkiego, co należy do synów Izraela."
  tags: []
"Wj9,5":
  text: "I PAN wyznaczył czas, mówiąc: Jutro PAN to uczyni na tej ziemi."
  tags: []
"Wj9,6":
  text: "Nazajutrz PAN tak uczynił. Pozdychały wszystkie stada Egiptu, lecz ze stad synów Izraela nie zdechło ani jedno."
  tags: []
"Wj9,7":
  text: "Faraon posłał więc na zwiady, a oto z bydła Izraela nie zdechło ani jedno. Ale serce faraona pozostało zatwardziałe i nie wypuścił ludu."
  tags: []
"Wj9,8":
  text: "Potem PAN powiedział do Mojżesza i Aarona: Weźcie pełne garści popiołu z pieca i niech Mojżesz rozrzuci go ku niebu na oczach faraona."
  tags: []
"Wj9,9":
  text: "Zamieni się w pył na całej ziemi Egiptu, który spowoduje wrzody pęczniejące ropą na ludziach i na zwierzętach na całej ziemi Egiptu."
  tags: []
"Wj9,10":
  text: "Wzięli więc popiół z pieca i stanęli przed faraonem, a Mojżesz rozrzucił popiół ku niebu i powstały wrzody pęczniejące ropą na ludziach i na zwierzętach."
  tags: []
"Wj9,11":
  text: "Czarownicy zaś nie mogli stanąć przed Mojżeszem z powodu wrzodów, bo wrzody były na nich i na wszystkich Egipcjanach."
  tags: []
"Wj9,12":
  text: "I PAN zatwardził serce faraona, i ten nie posłuchał ich, jak PAN zapowiedział Mojżeszowi."
  tags: []
"Wj9,13":
  text: "PAN powiedział do Mojżesza: Wstań rano, stań przed faraonem i powiedz mu: Tak mówi PAN, Bóg Hebrajczyków: Wypuść mój lud, aby mi służył;"
  tags: []
"Wj9,14":
  text: "Tym razem bowiem ześlę wszystkie moje plagi na twoje serce, na twoje sługi i na twój lud, abyś wiedział, że nie ma równego mi na całej ziemi."
  tags: []
"Wj9,15":
  text: "Bo teraz wyciągnę rękę i uderzę ciebie i twój lud zarazą, i będziesz wytracony z ziemi."
  tags: []
"Wj9,16":
  text: "Lecz dlatego cię postawiłem, aby okazać na tobie moją moc i żeby rozgłaszano moje imię na całej ziemi."
  tags: []
"Wj9,17":
  text: "A ty jeszcze się wynosisz i stajesz przeciw memu ludowi, nie chcąc go wypuścić?"
  tags: []
"Wj9,18":
  text: "Jutro o tej porze spuszczę bardzo ciężki grad, jakiego nie było w Egipcie od dnia jego założenia aż do tego czasu."
  tags: []
"Wj9,19":
  text: "Poślij więc teraz i zgromadź swoje bydło i wszystko, co masz na polu; bo każdy człowiek i każde zwierzę, które znajdzie się na polu, a nie zostanie zegnane do domu, zginie, gdy na nich spadnie grad."
  tags: []
"Wj9,20":
  text: "Kto więc ze sług faraona uląkł się słowa PANA, kazał uciekać swym sługom wraz z bydłem do domu;"
  tags: []
"Wj9,21":
  text: "Ale kto nie wziął do serca słowa PANA, ten zostawił swe sługi i bydło na polu."
  tags: []
"Wj9,22":
  text: "PAN powiedział do Mojżesza: Wyciągnij rękę ku niebu, by spadł grad na całej ziemi Egiptu, na ludzi, na bydło i na wszelkie rośliny polne w ziemi Egiptu."
  tags: []
"Wj9,23":
  text: "I Mojżesz wyciągnął swą laskę ku niebu, a PAN zesłał grzmoty i grad i na ziemię zstąpił ogień. PAN spuścił grad na ziemię Egiptu."
  tags: []
"Wj9,24":
  text: "I był grad i ogień zmieszany z bardzo ciężkim gradem, jakiego nie było w całej ziemi Egiptu, odkąd stał się narodem."
  tags: []
"Wj9,25":
  text: "Grad poraził na całej ziemi Egiptu cokolwiek było na polu, od człowieka aż do zwierzęcia. Poraził też wszelkie rośliny polne i połamał wszystkie drzewa na polu;"
  tags: []
"Wj9,26":
  text: "Tylko w ziemi Goszen, gdzie mieszkali synowie Izraela, nie było gradu."
  tags: []
"Wj9,27":
  text: "Faraon kazał więc wezwać Mojżesza i Aarona i powiedział do nich: Tym razem zgrzeszyłem. PAN jest sprawiedliwy, a ja i mój lud jesteśmy niegodziwi."
  tags: []
"Wj9,28":
  text: "Wstawcie się u PANA, aby ustały Boże grzmoty i grad, bo już dość. Wypuszczę was i nie będziecie tu dłużej mieszkać."
  tags: []
"Wj9,29":
  text: "Mojżesz powiedział do niego: Gdy wyjdę z miasta, wyciągnę ręce do PANA, a grzmoty ustaną i nie będzie więcej gradu, abyś wiedział, że ziemia należy do PANA."
  tags: []
"Wj9,30":
  text: "Ale wiem, że ty i twoi słudzy jeszcze nie boicie się PANA Boga."
  tags: []
"Wj9,31":
  text: "Len i jęczmień zostały zbite, bo jęczmień miał już kłosy, a len zakwitł."
  tags: []
"Wj9,32":
  text: "Pszenica jednak i żyto nie zostały zbite, bo były późniejsze."
  tags: []
"Wj9,33":
  text: "Mojżesz wyszedł więc od faraona za miasto i wyciągnął ręce do PANA. Ustały wtedy grzmoty i grad, a deszcz nie padał na ziemię."
  tags: []
"Wj9,34":
  text: "Kiedy faraon zobaczył, że deszcz, grad i grzmoty ustały, jeszcze bardziej zgrzeszył i zatwardził serce, on i jego słudzy."
  tags: []
"Wj9,35":
  text: "I serce faraona pozostało zatwardziałe i nie wypuścił synów Izraela, jak PAN zapowiedział przez Mojżesza."
  tags: []
