"Wj5,1":
  text: "Potem Mojżesz i Aaron przyszli do faraona i powiedzieli: Tak mówi PAN, Bóg Izraela: Wypuść mój lud, aby dla mnie obchodził święto na pustyni."
  tags: []
"Wj5,2":
  text: "Faraon odparł: Któż to jest PAN, abym miał słuchać jego głosu i wypuścić Izraela? Nie znam PANA, a Izraela też nie wypuszczę."
  tags: []
"Wj5,3":
  text: "I odpowiedzieli: Bóg Hebrajczyków ukazał się nam. Pozwól nam iść trzy dni drogą na pustynię i złożyć ofiarę PANU, naszemu Bogu, by nie nawiedził nas zarazą albo mieczem."
  tags: []
"Wj5,4":
  text: "Król Egiptu zapytał ich: Dlaczego wy, Mojżeszu i Aaronie, odrywacie lud od pracy? Idźcie do waszych robót."
  tags: []
"Wj5,5":
  text: "I faraon dodał: Oto lud tej ziemi jest teraz liczny, a wy go odrywacie od robót."
  tags: []
"Wj5,6":
  text: "Rozkazał więc faraon tego dnia nadzorcom ludu i jego przełożonym:"
  tags: []
"Wj5,7":
  text: "Już więcej nie będziecie dawać ludowi słomy do wyrobu cegły, jak dotychczas. Niech sami idą i zbierają sobie słomę."
  tags: []
"Wj5,8":
  text: "Wyznaczcie im tę samą liczbę cegieł, jaką wyrabiali poprzednio, nic nie zmniejszajcie. Próżnują bowiem i dlatego wołają: Pozwól nam pójść i złożyć ofiarę naszemu Bogu."
  tags: []
"Wj5,9":
  text: "Niech praca tych ludzi będzie cięższa, aby byli nią zajęci, a nie ufali kłamliwym słowom."
  tags: []
"Wj5,10":
  text: "Wtedy wyszli nadzorcy ludu i jego przełożeni i powiedzieli do ludu: Tak mówi faraon: Nie będę wam dawał słomy."
  tags: []
"Wj5,11":
  text: "Sami idźcie, zbierajcie sobie słomę, gdzie ją możecie znaleźć. Mimo to nic nie będzie odjęte z waszej pracy."
  tags: []
"Wj5,12":
  text: "Lud rozproszył się więc po całej ziemi Egiptu, aby zbierać ścierń zamiast słomy."
  tags: []
"Wj5,13":
  text: "A nadzorcy przynaglali, mówiąc: Wykonujcie wasze roboty, codzienną pracę jak wtedy, gdy wam dawano słomę."
  tags: []
"Wj5,14":
  text: "I bito przełożonych spośród synów Izraela, których nadzorcy faraona postawili nad nimi, i pytano ich: Dlaczego ani wczoraj, ani dzisiaj nie wykonaliście tej ilości cegieł jak poprzednio?"
  tags: []
"Wj5,15":
  text: "Przełożeni spośród synów Izraela przyszli więc do faraona i wołali: Czemu postępujesz tak ze swoimi sługami?"
  tags: []
"Wj5,16":
  text: "Nie dają twoim sługom słomy, a mówią: Róbcie cegłę. I oto biją twe sługi, a to wina twojego ludu."
  tags: []
"Wj5,17":
  text: "On odpowiedział: Próżnujecie, próżnujecie i dlatego mówicie: Pozwól nam pójść i złożyć ofiarę PANU."
  tags: []
"Wj5,18":
  text: "Teraz więc idźcie i pracujcie. Słomy wam nie dadzą, ale macie dostarczać taką samą ilość cegieł."
  tags: []
"Wj5,19":
  text: "A przełożeni spośród synów Izraela zobaczyli, że są w złym położeniu, ponieważ mówiono: Nie zmniejszacie nic z dziennego wyrobu cegieł."
  tags: []
"Wj5,20":
  text: "Gdy wychodzili od faraona, spotkali Mojżesza i Aarona, którzy na nich czekali."
  tags: []
"Wj5,21":
  text: "I powiedzieli do nich: Niech PAN wejrzy na was i osądzi, bo sprawiliście, że staliśmy się wstrętni w oczach faraona i w oczach jego sług, i daliście im do ręki miecz, aby nas zabili."
  tags: []
"Wj5,22":
  text: "Wtedy Mojżesz wrócił do PANA i powiedział: Panie, dlaczego wyrządziłeś to zło twojemu ludowi? Dlaczego mnie tu posłałeś?"
  tags: []
"Wj5,23":
  text: "Odkąd bowiem poszedłem do faraona, aby mówić w twoim imieniu, gorzej się obchodzi z tym ludem; a ty nie wybawiłeś swego ludu."
  tags: []
