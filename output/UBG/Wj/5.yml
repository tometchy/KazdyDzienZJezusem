"Wj5,1": "Potem Mojżesz i Aaron przyszli do faraona i powiedzieli: Tak mówi PAN, Bóg Izraela: Wypuść mój lud, aby dla mnie obchodził święto na pustyni."
"Wj5,2": "Faraon odparł: Któż to jest PAN, abym miał słuchać jego głosu i wypuścić Izraela? Nie znam PANA, a Izraela też nie wypuszczę."
"Wj5,3": "I odpowiedzieli: Bóg Hebrajczyków ukazał się nam. Pozwól nam iść trzy dni drogą na pustynię i złożyć ofiarę PANU, naszemu Bogu, by nie nawiedził nas zarazą albo mieczem."
"Wj5,4": "Król Egiptu zapytał ich: Dlaczego wy, Mojżeszu i Aaronie, odrywacie lud od pracy? Idźcie do waszych robót."
"Wj5,5": "I faraon dodał: Oto lud tej ziemi jest teraz liczny, a wy go odrywacie od robót."
"Wj5,6": "Rozkazał więc faraon tego dnia nadzorcom ludu i jego przełożonym:"
"Wj5,7": "Już więcej nie będziecie dawać ludowi słomy do wyrobu cegły, jak dotychczas. Niech sami idą i zbierają sobie słomę."
"Wj5,8": "Wyznaczcie im tę samą liczbę cegieł, jaką wyrabiali poprzednio, nic nie zmniejszajcie. Próżnują bowiem i dlatego wołają: Pozwól nam pójść i złożyć ofiarę naszemu Bogu."
"Wj5,9": "Niech praca tych ludzi będzie cięższa, aby byli nią zajęci, a nie ufali kłamliwym słowom."
"Wj5,10": "Wtedy wyszli nadzorcy ludu i jego przełożeni i powiedzieli do ludu: Tak mówi faraon: Nie będę wam dawał słomy."
"Wj5,11": "Sami idźcie, zbierajcie sobie słomę, gdzie ją możecie znaleźć. Mimo to nic nie będzie odjęte z waszej pracy."
"Wj5,12": "Lud rozproszył się więc po całej ziemi Egiptu, aby zbierać ścierń zamiast słomy."
"Wj5,13": "A nadzorcy przynaglali, mówiąc: Wykonujcie wasze roboty, codzienną pracę jak wtedy, gdy wam dawano słomę."
"Wj5,14": "I bito przełożonych spośród synów Izraela, których nadzorcy faraona postawili nad nimi, i pytano ich: Dlaczego ani wczoraj, ani dzisiaj nie wykonaliście tej ilości cegieł jak poprzednio?"
"Wj5,15": "Przełożeni spośród synów Izraela przyszli więc do faraona i wołali: Czemu postępujesz tak ze swoimi sługami?"
"Wj5,16": "Nie dają twoim sługom słomy, a mówią: Róbcie cegłę. I oto biją twe sługi, a to wina twojego ludu."
"Wj5,17": "On odpowiedział: Próżnujecie, próżnujecie i dlatego mówicie: Pozwól nam pójść i złożyć ofiarę PANU."
"Wj5,18": "Teraz więc idźcie i pracujcie. Słomy wam nie dadzą, ale macie dostarczać taką samą ilość cegieł."
"Wj5,19": "A przełożeni spośród synów Izraela zobaczyli, że są w złym położeniu, ponieważ mówiono: Nie zmniejszacie nic z dziennego wyrobu cegieł."
"Wj5,20": "Gdy wychodzili od faraona, spotkali Mojżesza i Aarona, którzy na nich czekali."
"Wj5,21": "I powiedzieli do nich: Niech PAN wejrzy na was i osądzi, bo sprawiliście, że staliśmy się wstrętni w oczach faraona i w oczach jego sług, i daliście im do ręki miecz, aby nas zabili."
"Wj5,22": "Wtedy Mojżesz wrócił do PANA i powiedział: Panie, dlaczego wyrządziłeś to zło twojemu ludowi? Dlaczego mnie tu posłałeś?"
"Wj5,23": "Odkąd bowiem poszedłem do faraona, aby mówić w twoim imieniu, gorzej się obchodzi z tym ludem; a ty nie wybawiłeś swego ludu."
