"Wj37,1":
  text: "I Besalel zrobił arkę z drewna akacjowego, a jej długość była na dwa i pół łokcia, a jej szerokość – na półtora łokcia, także jej wysokość to półtora łokcia."
  tags: []
"Wj37,2":
  text: "I pokrył ją szczerym złotem wewnątrz i na zewnątrz i zrobił wokół niej złotą listwę."
  tags: []
"Wj37,3":
  text: "Odlał też do niej cztery złote pierścienie do czterech jej narożników: dwa pierścienie po jednej jej stronie, a dwa pierścienie po drugiej jej stronie."
  tags: []
"Wj37,4":
  text: "Zrobił również drążki z drewna akacjowego i pokrył je złotem."
  tags: []
"Wj37,5":
  text: "I włożył drążki w pierścienie po obu stronach arki, aby arka była na nich noszona."
  tags: []
"Wj37,6":
  text: "Zrobił też przebłagalnię ze szczerego złota: jej długość była na dwa i pół łokcia, a jej szerokość – na półtora łokcia."
  tags: []
"Wj37,7":
  text: "Zrobił dwa cherubiny wykute ze złota na obu końcach przebłagalni."
  tags: []
"Wj37,8":
  text: "Jednego cherubina na jednym końcu, a drugiego cherubina na drugim końcu. Zrobił cherubiny z przebłagalni wystające na obu jej końcach."
  tags: []
"Wj37,9":
  text: "A cherubiny miały rozpostarte skrzydła, z wierzchu zakrywały swymi skrzydłami przebłagalnię, a ich twarze były zwrócone ku sobie, twarze cherubinów były zwrócone ku przebłagalni."
  tags: []
"Wj37,10":
  text: "Zrobił też stół z drewna akacjowego, jego długość była na dwa łokcie, jego szerokość – na jeden łokieć, a wysokość – na półtora łokcia."
  tags: []
"Wj37,11":
  text: "I pokrył go szczerym złotem, i zrobił wokół niego złotą listwę."
  tags: []
"Wj37,12":
  text: "Zrobił wokół niego też listwę o szerokości dłoni; zrobił również złote obramowanie wokoło tej listwy."
  tags: []
"Wj37,13":
  text: "I odlał do niego cztery złote pierścienie, i przyprawił je do czterech narożników u jego czterech nóg."
  tags: []
"Wj37,14":
  text: "Naprzeciwko tej listwy były pierścienie, przez które przewleczono drążki do noszenia stołu."
  tags: []
"Wj37,15":
  text: "Porobił drążki z drewna akacjowego do noszenia stołu i powlókł je złotem."
  tags: []
"Wj37,16":
  text: "Zrobił też ze szczerego złota naczynia do stołu, misy do niego, czasze, przykrycia i kubki do nalewania."
  tags: []
"Wj37,17":
  text: "Zrobił także świecznik ze szczerego złota. Wykuł ze złota ten świecznik. Jego podstawa, ramiona, kielichy, gałki i kwiaty były z tej samej bryły."
  tags: []
"Wj37,18":
  text: "Sześć ramion wychodziło z obu boków: trzy ramiona z jednego boku świecznika i trzy ramiona z drugiego boku świecznika."
  tags: []
"Wj37,19":
  text: "Trzy kielichy na kształt migdała na jednym ramieniu, także gałka i kwiat; i trzy kielichy na kształt migdała na drugim ramieniu, także gałka i kwiat. Tak było na wszystkich sześciu ramionach wychodzących ze świecznika."
  tags: []
"Wj37,20":
  text: "Ale na samym świeczniku były cztery kielichy na kształt migdała, jego gałki i jego kwiaty."
  tags: []
"Wj37,21":
  text: "I była gałka pod dwoma jego ramionami, także gałka pod następnymi dwoma jego ramionami, i znów gałka pod dwoma innymi jego ramionami. Tak było pod sześcioma ramionami wychodzącymi z niego."
  tags: []
"Wj37,22":
  text: "Ich gałki i ramiona były z tej samej bryły. Wszystko to w całości było wykute ze szczerego złota."
  tags: []
"Wj37,23":
  text: "Zrobił też do niego siedem lamp oraz szczypce i naczynia na popiół ze szczerego złota."
  tags: []
"Wj37,24":
  text: "Zrobił go i wszystkie naczynia do niego z talentu szczerego złota."
  tags: []
"Wj37,25":
  text: "Zrobił także ołtarz do kadzenia z drewna akacjowego, na łokieć długi i na łokieć szeroki, kwadratowy, na dwa łokcie wysoki, a z niego wychodziły rogi."
  tags: []
"Wj37,26":
  text: "I pokrył go szczerym złotem – jego wierzch, jego ściany wokoło i jego rogi. Zrobił też dokoła niego złotą listwę."
  tags: []
"Wj37,27":
  text: "Zrobił dwa złote pierścienie do niego, pod jego listwą, na dwóch jego narożnikach, po obu bokach, przez które przewleczono drążki, aby był na nich noszony."
  tags: []
"Wj37,28":
  text: "Zrobił także drążki z drewna akacjowego i pokrył je złotem."
  tags: []
"Wj37,29":
  text: "Sporządził też olejek do świętego namaszczenia i wonne kadzidło, tak jak się robi wonności."
  tags: []
