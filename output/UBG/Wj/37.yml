"Wj37,1": "I Besalel zrobił arkę z drewna akacjowego, a jej długość była na dwa i pół łokcia, a jej szerokość – na półtora łokcia, także jej wysokość to półtora łokcia."
"Wj37,2": "I pokrył ją szczerym złotem wewnątrz i na zewnątrz i zrobił wokół niej złotą listwę."
"Wj37,3": "Odlał też do niej cztery złote pierścienie do czterech jej narożników: dwa pierścienie po jednej jej stronie, a dwa pierścienie po drugiej jej stronie."
"Wj37,4": "Zrobił również drążki z drewna akacjowego i pokrył je złotem."
"Wj37,5": "I włożył drążki w pierścienie po obu stronach arki, aby arka była na nich noszona."
"Wj37,6": "Zrobił też przebłagalnię ze szczerego złota: jej długość była na dwa i pół łokcia, a jej szerokość – na półtora łokcia."
"Wj37,7": "Zrobił dwa cherubiny wykute ze złota na obu końcach przebłagalni."
"Wj37,8": "Jednego cherubina na jednym końcu, a drugiego cherubina na drugim końcu. Zrobił cherubiny z przebłagalni wystające na obu jej końcach."
"Wj37,9": "A cherubiny miały rozpostarte skrzydła, z wierzchu zakrywały swymi skrzydłami przebłagalnię, a ich twarze były zwrócone ku sobie, twarze cherubinów były zwrócone ku przebłagalni."
"Wj37,10": "Zrobił też stół z drewna akacjowego, jego długość była na dwa łokcie, jego szerokość – na jeden łokieć, a wysokość – na półtora łokcia."
"Wj37,11": "I pokrył go szczerym złotem, i zrobił wokół niego złotą listwę."
"Wj37,12": "Zrobił wokół niego też listwę o szerokości dłoni; zrobił również złote obramowanie wokoło tej listwy."
"Wj37,13": "I odlał do niego cztery złote pierścienie, i przyprawił je do czterech narożników u jego czterech nóg."
"Wj37,14": "Naprzeciwko tej listwy były pierścienie, przez które przewleczono drążki do noszenia stołu."
"Wj37,15": "Porobił drążki z drewna akacjowego do noszenia stołu i powlókł je złotem."
"Wj37,16": "Zrobił też ze szczerego złota naczynia do stołu, misy do niego, czasze, przykrycia i kubki do nalewania."
"Wj37,17": "Zrobił także świecznik ze szczerego złota. Wykuł ze złota ten świecznik. Jego podstawa, ramiona, kielichy, gałki i kwiaty były z tej samej bryły."
"Wj37,18": "Sześć ramion wychodziło z obu boków: trzy ramiona z jednego boku świecznika i trzy ramiona z drugiego boku świecznika."
"Wj37,19": "Trzy kielichy na kształt migdała na jednym ramieniu, także gałka i kwiat; i trzy kielichy na kształt migdała na drugim ramieniu, także gałka i kwiat. Tak było na wszystkich sześciu ramionach wychodzących ze świecznika."
"Wj37,20": "Ale na samym świeczniku były cztery kielichy na kształt migdała, jego gałki i jego kwiaty."
"Wj37,21": "I była gałka pod dwoma jego ramionami, także gałka pod następnymi dwoma jego ramionami, i znów gałka pod dwoma innymi jego ramionami. Tak było pod sześcioma ramionami wychodzącymi z niego."
"Wj37,22": "Ich gałki i ramiona były z tej samej bryły. Wszystko to w całości było wykute ze szczerego złota."
"Wj37,23": "Zrobił też do niego siedem lamp oraz szczypce i naczynia na popiół ze szczerego złota."
"Wj37,24": "Zrobił go i wszystkie naczynia do niego z talentu szczerego złota."
"Wj37,25": "Zrobił także ołtarz do kadzenia z drewna akacjowego, na łokieć długi i na łokieć szeroki, kwadratowy, na dwa łokcie wysoki, a z niego wychodziły rogi."
"Wj37,26": "I pokrył go szczerym złotem – jego wierzch, jego ściany wokoło i jego rogi. Zrobił też dokoła niego złotą listwę."
"Wj37,27": "Zrobił dwa złote pierścienie do niego, pod jego listwą, na dwóch jego narożnikach, po obu bokach, przez które przewleczono drążki, aby był na nich noszony."
"Wj37,28": "Zrobił także drążki z drewna akacjowego i pokrył je złotem."
"Wj37,29": "Sporządził też olejek do świętego namaszczenia i wonne kadzidło, tak jak się robi wonności."
