"Wj4,1":
  text: "Potem Mojżesz odpowiedział: Lecz oni mi nie uwierzą i nie usłuchają mego głosu, bo powiedzą: PAN ci się nie ukazał."
  tags: []
"Wj4,2":
  text: "PAN zapytał go: Co masz w swojej ręce? Odpowiedział: Laskę."
  tags: []
"Wj4,3":
  text: "I rozkazał: Rzuć ją na ziemię. Rzucił ją więc na ziemię i zamieniła się w węża; i Mojżesz przed nim uciekał."
  tags: []
"Wj4,4":
  text: "Następnie PAN powiedział do Mojżesza: Wyciągnij rękę i chwyć go za ogon. Wyciągnął więc rękę i chwycił go, i ten zamienił się w laskę w jego ręce."
  tags: []
"Wj4,5":
  text: "Uczyń tak, aby uwierzyli, że ukazał ci się PAN, Bóg ich ojców, Bóg Abrahama, Bóg Izaaka i Bóg Jakuba."
  tags: []
"Wj4,6":
  text: "PAN powiedział mu jeszcze: Włóż teraz rękę w zanadrze. Włożył więc rękę w zanadrze, a gdy ją wyjął, była pokryta trądem jak śniegiem."
  tags: []
"Wj4,7":
  text: "I powiedział: Włóż ponownie rękę w zanadrze. I włożył znowu rękę w zanadrze, a gdy ją wyjął, stała się znowu jak reszta jego ciała."
  tags: []
"Wj4,8":
  text: "Jeśli więc ci nie uwierzą i nie usłuchają głosu pierwszego znaku, to uwierzą głosowi drugiego znaku."
  tags: []
"Wj4,9":
  text: "A jeśli nie uwierzą obu tym znakom i nie usłuchają twego głosu, to weźmiesz wody z rzeki i wylejesz ją na ziemię. Wtedy ta woda, którą weźmiesz z rzeki, zamieni się na ziemi w krew."
  tags: []
"Wj4,10":
  text: "Mojżesz powiedział do PANA: Proszę, Panie, nie jestem wymowny – ani przedtem, ani odkąd przemówiłeś do twego sługi, bo mam powolną mowę i ociężały język."
  tags: []
"Wj4,11":
  text: "PAN mu odpowiedział: Któż uczynił usta człowieka? Albo kto czyni niemego lub głuchego, widzącego lub ślepego? Czyż nie ja, PAN?"
  tags: []
"Wj4,12":
  text: "Teraz więc idź, a ja będę przy twoich ustach i pouczę cię, co masz mówić."
  tags: []
"Wj4,13":
  text: "Mojżesz powiedział: Proszę, Panie, poślij tego, kogo masz posłać."
  tags: []
"Wj4,14":
  text: "Wtedy zapalił się gniew PANA na Mojżesza i powiedział: Czyż Aaron, Lewita, nie jest twoim bratem? Wiem, że on potrafi dobrze mówić. Oto on wyjdzie ci na spotkanie, a gdy cię zobaczy, uraduje się w swoim sercu."
  tags: []
"Wj4,15":
  text: "Ty będziesz mówił do niego i włożysz słowa w jego usta. A ja będę przy twoich ustach i przy jego ustach i pouczę was, co macie czynić."
  tags: []
"Wj4,16":
  text: "On będzie mówił za ciebie do ludu. On będzie dla ciebie jakby ustami, a ty dla niego będziesz jakby Bogiem."
  tags: []
"Wj4,17":
  text: "I weź w rękę tę laskę, którą będziesz czynił znaki."
  tags: []
"Wj4,18":
  text: "Odszedł więc Mojżesz i wrócił do swego teścia Jetra, i powiedział do niego: Pozwól mi wrócić do moich braci, którzy są w Egipcie, aby zobaczyć, czy jeszcze żyją. Jetro odpowiedział Mojżeszowi: Idź w pokoju."
  tags: []
"Wj4,19":
  text: "PAN rzekł do Mojżesza w ziemi Midian: Idź, wróć do Egiptu, bo pomarli wszyscy, którzy czyhali na twoje życie."
  tags: []
"Wj4,20":
  text: "Mojżesz więc wziął swoją żonę i swoich synów, wsadził ich na osła i wyruszył do ziemi Egiptu. Wziął też Mojżesz laskę Boga do ręki."
  tags: []
"Wj4,21":
  text: "PAN powiedział do Mojżesza: Gdy pójdziesz i wrócisz do Egiptu, dopilnuj, abyś wszystkich cudów, które dałem ci do ręki, dokonał przed faraonem. A ja zatwardzę jego serce, tak że nie wypuści ludu."
  tags: []
"Wj4,22":
  text: "I powiesz do faraona: Tak mówi PAN: Izrael jest moim synem, moim pierworodnym."
  tags: []
"Wj4,23":
  text: "Mówię ci: Wypuść mego syna, aby mi służył. Jeśli będziesz się wzbraniał wypuścić go, zabiję twojego syna, twego pierworodnego."
  tags: []
"Wj4,24":
  text: "A w czasie drogi, w gospodzie, PAN zastąpił drogę Mojżeszowi i chciał go zabić."
  tags: []
"Wj4,25":
  text: "Wtedy Sefora wzięła ostry kamień, odcięła napletek swego syna i rzuciła do jego stóp, i powiedziała: Naprawdę jesteś dla mnie oblubieńcem krwi."
  tags: []
"Wj4,26":
  text: "I PAN odstąpił od niego. Wtedy nazwała go oblubieńcem krwi z powodu obrzezania."
  tags: []
"Wj4,27":
  text: "A do Aarona PAN powiedział: Wyjdź naprzeciw Mojżeszowi na pustynię. Wyszedł więc i spotkał go na górze Boga, i pocałował go."
  tags: []
"Wj4,28":
  text: "Wtedy Mojżesz powtórzył Aaronowi wszystkie słowa PANA, który go posłał, i wszystkie znaki, które nakazał mu uczynić."
  tags: []
"Wj4,29":
  text: "Mojżesz i Aaron poszli więc i zebrali wszystkich starszych synów Izraela."
  tags: []
"Wj4,30":
  text: "I Aaron powiedział wszystkie słowa, które PAN mówił do Mojżesza, a Mojżesz czynił znaki na oczach ludu."
  tags: []
"Wj4,31":
  text: "I lud uwierzył. I gdy usłyszeli, że PAN nawiedził synów Izraela i że wejrzał na ich utrapienie, pochylili się i oddali pokłon."
  tags: []
