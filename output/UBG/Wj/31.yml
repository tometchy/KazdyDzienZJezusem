"Wj31,1":
  text: "Potem PAN powiedział do Mojżesza:"
  tags: []
"Wj31,2":
  text: "Oto powołałem po imieniu Besalela, syna Uriego, syna Chura, z pokolenia Judy;"
  tags: []
"Wj31,3":
  text: "I napełniłem go Duchem Bożym, mądrością, rozumem, wiedzą i znajomością we wszelkim rzemiośle;"
  tags: []
"Wj31,4":
  text: "Aby umiejętnie obmyślał projekty, do wyrobu ze złota, srebra i miedzi;"
  tags: []
"Wj31,5":
  text: "Do obrabiania kamieni do oprawy i do ciosania drewna, aby wykonał wszelkie rodzaje dzieła."
  tags: []
"Wj31,6":
  text: "Oto dałem mu Oholiaba, syna Achisamaka, z pokolenia Dana. Wlałem też mądrość w serce każdego uzdolnionego, aby uczynili wszystko, co ci przykazałem:"
  tags: []
"Wj31,7":
  text: "Namiot Zgromadzenia, arkę świadectwa, przebłagalnię, która ma być nad nią, i wszystkie sprzęty namiotu;"
  tags: []
"Wj31,8":
  text: "Stół i naczynia do niego, szczerozłoty świecznik ze wszystkimi naczyniami do niego i ołtarz kadzenia;"
  tags: []
"Wj31,9":
  text: "Ołtarz całopalenia ze wszystkimi naczyniami do niego i kadź wraz z jej podstawą;"
  tags: []
"Wj31,10":
  text: "Szaty do służby, święte szaty dla Aarona, kapłana, i szaty dla jego synów do sprawowania kapłaństwa;"
  tags: []
"Wj31,11":
  text: "Olejek namaszczenia i wonne kadzidło do Miejsca Świętego. Wykonają według wszystkiego, co ci przykazałem."
  tags: []
"Wj31,12":
  text: "Potem PAN powiedział do Mojżesza:"
  tags: []
"Wj31,13":
  text: "Powiedz też synom Izraela: Koniecznie macie przestrzegać moich szabatów, bo to jest znak między mną a wami przez wszystkie wasze pokolenia, abyście wiedzieli, że ja jestem PAN, który was uświęca."
  tags: []
"Wj31,14":
  text: "Przestrzegajcie więc szabatu, gdyż jest on dla was święty. Kto by go naruszył, poniesie śmierć. Każdy bowiem, kto wykonuje pracę w tym dniu, zostanie wytracony spośród swego ludu."
  tags: []
"Wj31,15":
  text: "Przez sześć dni będzie się wykonywać pracę, ale siódmy dzień jest szabatem odpoczynku, świętym dla PANA. Ktokolwiek wykona pracę w dniu szabatu, poniesie śmierć."
  tags: []
"Wj31,16":
  text: "Dlatego synowie Izraela będą przestrzegać szabatu, zachowując szabat przez wszystkie pokolenia jako wieczną ustawę."
  tags: []
"Wj31,17":
  text: "Jest on wiecznym znakiem między mną a synami Izraela, bo w sześć dni PAN uczynił niebo i ziemię, a siódmego dnia przestał i odpoczął."
  tags: []
"Wj31,18":
  text: "A gdy dokończył rozmowę z Mojżeszem na górze Synaj, PAN dał mu dwie tablice świadectwa, tablice kamienne napisane palcem Boga."
  tags: []
