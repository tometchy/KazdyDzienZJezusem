"Wj31,1": "Potem PAN powiedział do Mojżesza:"
"Wj31,2": "Oto powołałem po imieniu Besalela, syna Uriego, syna Chura, z pokolenia Judy;"
"Wj31,3": "I napełniłem go Duchem Bożym, mądrością, rozumem, wiedzą i znajomością we wszelkim rzemiośle;"
"Wj31,4": "Aby umiejętnie obmyślał projekty, do wyrobu ze złota, srebra i miedzi;"
"Wj31,5": "Do obrabiania kamieni do oprawy i do ciosania drewna, aby wykonał wszelkie rodzaje dzieła."
"Wj31,6": "Oto dałem mu Oholiaba, syna Achisamaka, z pokolenia Dana. Wlałem też mądrość w serce każdego uzdolnionego, aby uczynili wszystko, co ci przykazałem:"
"Wj31,7": "Namiot Zgromadzenia, arkę świadectwa, przebłagalnię, która ma być nad nią, i wszystkie sprzęty namiotu;"
"Wj31,8": "Stół i naczynia do niego, szczerozłoty świecznik ze wszystkimi naczyniami do niego i ołtarz kadzenia;"
"Wj31,9": "Ołtarz całopalenia ze wszystkimi naczyniami do niego i kadź wraz z jej podstawą;"
"Wj31,10": "Szaty do służby, święte szaty dla Aarona, kapłana, i szaty dla jego synów do sprawowania kapłaństwa;"
"Wj31,11": "Olejek namaszczenia i wonne kadzidło do Miejsca Świętego. Wykonają według wszystkiego, co ci przykazałem."
"Wj31,12": "Potem PAN powiedział do Mojżesza:"
"Wj31,13": "Powiedz też synom Izraela: Koniecznie macie przestrzegać moich szabatów, bo to jest znak między mną a wami przez wszystkie wasze pokolenia, abyście wiedzieli, że ja jestem PAN, który was uświęca."
"Wj31,14": "Przestrzegajcie więc szabatu, gdyż jest on dla was święty. Kto by go naruszył, poniesie śmierć. Każdy bowiem, kto wykonuje pracę w tym dniu, zostanie wytracony spośród swego ludu."
"Wj31,15": "Przez sześć dni będzie się wykonywać pracę, ale siódmy dzień jest szabatem odpoczynku, świętym dla PANA. Ktokolwiek wykona pracę w dniu szabatu, poniesie śmierć."
"Wj31,16": "Dlatego synowie Izraela będą przestrzegać szabatu, zachowując szabat przez wszystkie pokolenia jako wieczną ustawę."
"Wj31,17": "Jest on wiecznym znakiem między mną a synami Izraela, bo w sześć dni PAN uczynił niebo i ziemię, a siódmego dnia przestał i odpoczął."
"Wj31,18": "A gdy dokończył rozmowę z Mojżeszem na górze Synaj, PAN dał mu dwie tablice świadectwa, tablice kamienne napisane palcem Boga."
