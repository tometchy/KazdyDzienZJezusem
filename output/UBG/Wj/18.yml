"Wj18,1":
  text: "A gdy teść Mojżesza Jetro, kapłan Midianitów, usłyszał o wszystkim, co Bóg uczynił dla Mojżesza i swego ludu Izraela, że PAN wyprowadził Izraela z Egiptu;"
  tags: []
"Wj18,2":
  text: "Wtedy Jetro, teść Mojżesza, wziął żonę Mojżesza Seforę, którą ten wcześniej odesłał;"
  tags: []
"Wj18,3":
  text: "Oraz jej dwóch synów, z których jednemu było na imię Gerszom, bo Mojżesz powiedział: Jestem przybyszem w cudzej ziemi;"
  tags: []
"Wj18,4":
  text: "Drugi zaś miał na imię Eliezer, bo mówił: Bóg mego ojca był moją pomocą i wybawił mnie od miecza faraona."
  tags: []
"Wj18,5":
  text: "Jetro, teść Mojżesza, przybył wraz z jego synami i żoną do Mojżesza na pustynię, gdzie obozował przy górze Boga."
  tags: []
"Wj18,6":
  text: "I kazał powiedzieć Mojżeszowi: Ja, twój teść Jetro, idę do ciebie wraz z twoją żoną i z oboma jej synami."
  tags: []
"Wj18,7":
  text: "Mojżesz wyszedł więc swemu teściowi naprzeciw, pokłonił się i ucałował go. Potem wypytywali się wzajemnie o powodzenie i weszli do namiotu."
  tags: []
"Wj18,8":
  text: "Mojżesz opowiedział swemu teściowi wszystko, co PAN uczynił faraonowi i Egipcjanom ze względu na Izraela, o całym trudzie, który ich spotkał w drodze, i jak PAN ich wybawił."
  tags: []
"Wj18,9":
  text: "Jetro cieszył się ze wszelkiego dobra, które PAN uczynił Izraelowi, że wybawił go z ręki Egipcjan."
  tags: []
"Wj18,10":
  text: "I Jetro powiedział: Niech będzie błogosławiony PAN, który was wybawił z ręki Egipcjan i z ręki faraona i który wybawił lud z niewoli egipskiej."
  tags: []
"Wj18,11":
  text: "Teraz wiem, że PAN jest większy od wszystkich bogów, bo gdy oni zuchwale powstawali przeciwko niemu, to od tego poginęli."
  tags: []
"Wj18,12":
  text: "Potem Jetro, teść Mojżesza, wziął całopalenie i ofiary dla Boga. Przyszedł też Aaron i wszyscy starsi Izraela, aby jeść chleb z teściem Mojżesza przed Bogiem."
  tags: []
"Wj18,13":
  text: "Nazajutrz Mojżesz usiadł, aby sądzić lud. I lud stał przed Mojżeszem od rana aż do wieczora."
  tags: []
"Wj18,14":
  text: "Gdy teść Mojżesza zobaczył wszystko, co on czynił dla ludu, powiedział: Cóż to jest, co ty czynisz dla ludu? Dlaczego ty siedzisz sam, a cały lud stoi przed tobą od rana aż do wieczora?"
  tags: []
"Wj18,15":
  text: "Wtedy Mojżesz odpowiedział swemu teściowi: Bo lud przychodzi do mnie, aby się radzić Boga."
  tags: []
"Wj18,16":
  text: "Gdy mają jakąś sprawę, przychodzą do mnie, a ja rozsądzam między nimi i oznajmiam ustawy Boga i jego prawa."
  tags: []
"Wj18,17":
  text: "Teść Mojżesza powiedział do niego: Niedobra to rzecz, którą czynisz."
  tags: []
"Wj18,18":
  text: "Zamęczycie się i ty, i ten lud, który jest z tobą, bo ta sprawa jest zbyt ciężka dla ciebie. Sam jej nie podołasz."
  tags: []
"Wj18,19":
  text: "Dlatego posłuchaj teraz mego głosu, poradzę ci, a Bóg będzie z tobą. Wstawiaj się za ludem przed Bogiem i zanoś sprawy Bogu;"
  tags: []
"Wj18,20":
  text: "Nauczaj go też ustaw i praw, wskazuj im drogę, którą mają chodzić, i czyny, które mają spełniać."
  tags: []
"Wj18,21":
  text: "Upatrz też sobie wśród całego ludu mężczyzn dzielnych i bojących się Boga, mężczyzn prawdomównych, którzy nienawidzą chciwości, i ustanów ich przełożonymi nad tysiącem, nad setką, nad pięćdziesiątką i nad dziesiątką."
  tags: []
"Wj18,22":
  text: "Niech oni sądzą lud w każdym czasie. A gdy będzie ważniejsza sprawa, zaniosą ją do ciebie, ale każdą mniej ważną sprawę sami będą sądzić. W ten sposób ulżysz sobie, gdy poniosą ciężar z tobą."
  tags: []
"Wj18,23":
  text: "Jeśli tak uczynisz, a Bóg tak ci nakaże, wytrwasz i cały ten lud będzie wracać na swoje miejsce w pokoju."
  tags: []
"Wj18,24":
  text: "Mojżesz usłuchał więc rady swego teścia i uczynił wszystko, jak mu powiedział."
  tags: []
"Wj18,25":
  text: "I Mojżesz wybrał z całego Izraela dzielnych mężczyzn, i ustanowił ich przełożonymi nad ludem, nad tysiącem, nad setką, nad pięćdziesiątką i nad dziesiątką;"
  tags: []
"Wj18,26":
  text: "I sądzili lud w każdym czasie. Trudne sprawy zanosili do Mojżesza, a każdą drobniejszą sprawę sami sądzili."
  tags: []
"Wj18,27":
  text: "Potem Mojżesz odprawił swego teścia, który odszedł do swej ziemi."
  tags: []
