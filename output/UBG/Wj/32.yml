"Wj32,1": "A gdy lud widział, że Mojżesz opóźnia swoje zejście z góry, zebrał się przed Aaronem i mówił do niego: Wstań, zrób nam bogów, którzy by szli przed nami, bo nie wiemy, co się stało z Mojżeszem, tym mężem, który nas wyprowadził z ziemi Egiptu."
"Wj32,2": "Wtedy Aaron im powiedział: Zdejmijcie złote kolczyki, które są w uszach waszych żon, waszych synów i córek, i przynieście do mnie."
"Wj32,3": "I cały lud pozdejmował złote kolczyki, które były w ich uszach, i zanieśli je do Aarona."
"Wj32,4": "Gdy on przyjął je z ich rąk, ukształtował je rylcem i uczynił z nich odlanego cielca. I powiedzieli: Oto są twoi bogowie, Izraelu, którzy cię wyprowadzili z ziemi Egiptu."
"Wj32,5": "Widząc to, Aaron zbudował przed nim ołtarz i zawołał: Jutro będzie święto PANA."
"Wj32,6": "A nazajutrz wstali wcześnie rano, ofiarowali całopalenia i przynieśli ofiary pojednawcze. I lud usiadł, aby jeść i pić, i wstał, aby się bawić."
"Wj32,7": "Wtedy PAN powiedział do Mojżesza: Idź, zejdź na dół, bo zepsuł się twój lud, który wyprowadziłeś z ziemi Egiptu."
"Wj32,8": "Szybko zboczyli z drogi, którą im przykazałem. Zrobili sobie odlanego cielca, oddali mu pokłon i złożyli mu ofiary, mówiąc: Oto są twoi bogowie, Izraelu, którzy cię wyprowadzili z ziemi Egiptu."
"Wj32,9": "PAN mówił dalej do Mojżesza: Widziałem ten lud, a oto jest on ludem twardego karku."
"Wj32,10": "Teraz więc zostaw mnie, aby się rozpalił mój gniew na nich i abym ich zgładził, a z ciebie uczynię wielki naród."
"Wj32,11": "I Mojżesz modlił się do PANA, swego Boga, i powiedział: Dlaczego, PANIE, rozpala się twój gniew przeciwko twemu ludowi, który wyprowadziłeś z ziemi Egiptu wielką mocą i potężną ręką?"
"Wj32,12": "Dlaczego Egipcjanie mieliby mówić: Wyprowadził ich ku złemu, aby ich pozabijać w górach i aby zgładzić ich z powierzchni ziemi? Odwróć się od zapalczywości twojego gniewu i żałuj nieszczęścia, jakie chcesz zesłać na twój lud."
"Wj32,13": "Wspomnij na Abrahama, Izaaka i Izraela, twoje sługi, którym przysiągłeś na samego siebie i mówiłeś do nich: Rozmnożę wasze potomstwo jak gwiazdy na niebie i całą tę ziemię, o której mówiłem, dam waszemu potomstwu i odziedziczą ją na wieki."
"Wj32,14": "I PAN żałował nieszczęścia, które miał zesłać na swój lud."
"Wj32,15": "Mojżesz odwrócił się więc i zszedł z góry, mając w ręku dwie tablice świadectwa, tablice zapisane po obu stronach. Były zapisane i na jednej, i na drugiej stronie."
"Wj32,16": "Tablice te były dziełem Boga, a pismo też było pismem Boga wyrytym na tablicach."
"Wj32,17": "Gdy Jozue usłyszał głos wołającego ludu, powiedział do Mojżesza: Odgłosy bitwy w obozie."
"Wj32,18": "On odpowiedział: Nie jest to głos zwyciężających ani głos pokonanych. Słyszę raczej głos śpiewających."
"Wj32,19": "Gdy się przybliżył do obozu, zobaczył cielca i tańce. Mojżesz wówczas rozgniewał się bardzo, rzucił z rąk tablice i stłukł je pod górą."
"Wj32,20": "Wziął też cielca, którego zrobili, spalił go w ogniu, skruszył na proch, wysypał na wodę i kazał ją pić synom Izraela."
"Wj32,21": "Potem Mojżesz powiedział do Aarona: Cóż ci ten lud zrobił, że sprowadziłeś na niego tak wielki grzech?"
"Wj32,22": "Aaron odpowiedział: Niech się nie rozpala gniew mego pana. Ty znasz ten lud i wiesz, jak jest skłonny do zła."
"Wj32,23": "Mówili mi bowiem: Zrób nam bogów, którzy by szli przed nami, gdyż nie wiemy, co się stało z Mojżeszem, tym mężem, który nas wyprowadził z ziemi Egiptu."
"Wj32,24": "I odpowiedziałem im: Kto ma złoto, niech je zdejmie z siebie. Dali mi je i wrzuciłem je w ogień, i tak powstał ten cielec."
"Wj32,25": "Gdy Mojżesz widział obnażony lud, bo Aaron uczynił go nagim ku jego hańbie wobec jego wrogów;"
"Wj32,26": "Wtedy Mojżesz stanął w bramie obozu i powiedział: Kto jest za PANEM, niech przystąpi do mnie. I zebrali się przy nim wszyscy synowie Lewiego."
"Wj32,27": "I powiedział do nich: Tak mówi PAN, Bóg Izraela: Niech każdy przypasze swój miecz do swojego boku. Przejdźcie przez obóz tam i z powrotem, od jednej bramy do drugiej, i zabijajcie każdy swego brata i każdy swego przyjaciela, i każdy swego bliźniego."
"Wj32,28": "I synowie Lewiego postąpili według słowa Mojżesza. Tego dnia poległo z ludu około trzech tysięcy mężczyzn."
"Wj32,29": "Bo Mojżesz powiedział: Poświęćcie dziś PANU swoje ręce, każdy na swego syna i na swego brata, aby dał wam dziś błogosławieństwo."
"Wj32,30": "Nazajutrz zaś Mojżesz powiedział do ludu: Popełniliście wielki grzech. Wstąpię teraz do PANA, może go przebłagam za wasz grzech."
"Wj32,31": "Mojżesz więc wrócił do PANA i powiedział: Proszę, ten lud popełnił wielki grzech, bo zrobił sobie bogów ze złota."
"Wj32,32": "Teraz jednak przebacz ich grzech, a jeśli nie, wymaż mnie, proszę, z twojej księgi, którą napisałeś."
"Wj32,33": "PAN powiedział do Mojżesza: Tego wymażę z mojej księgi, kto zgrzeszył przeciwko mnie."
"Wj32,34": "Idź teraz, prowadź ten lud, gdzie ci rozkazałem. Oto mój Anioł pójdzie przed tobą. Ale w dniu mego nawiedzenia ich też nawiedzę za ich grzech."
"Wj32,35": "PAN ukarał więc lud za to, że zrobił cielca, którego sporządził Aaron."
