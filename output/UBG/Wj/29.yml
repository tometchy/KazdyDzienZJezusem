"Wj29,1":
  text: "Oto co masz uczynić, aby poświęcić ich do sprawowania mi urzędu kapłańskiego: Weź jednego młodego cielca i dwa barany bez skazy;"
  tags: []
"Wj29,2":
  text: "I przaśne chleby, przaśne placki zaprawione oliwą i przaśne podpłomyki posmarowane oliwą. Uczynisz je z wybornej mąki pszennej."
  tags: []
"Wj29,3":
  text: "Włożysz je do jednego kosza i przyniesiesz je w tym koszu z cielcem i z dwoma baranami."
  tags: []
"Wj29,4":
  text: "Aaronowi i jego synom każesz zbliżyć się do wejścia do Namiotu Zgromadzenia i obmyjesz ich wodą."
  tags: []
"Wj29,5":
  text: "Potem weźmiesz szaty i ubierzesz Aarona w tunikę, w ornat pod efod, w efod i pektorał i opaszesz go pasem efodu;"
  tags: []
"Wj29,6":
  text: "I włożysz mu na głowę mitrę, a na mitrę wstawisz świętą koronę."
  tags: []
"Wj29,7":
  text: "Następnie weźmiesz olejek do namaszczenia i wylejesz na jego głowę, i namaścisz go."
  tags: []
"Wj29,8":
  text: "Potem każesz się przybliżyć jego synom i ubierzesz ich w szaty;"
  tags: []
"Wj29,9":
  text: "I przepaszesz ich pasem, Aarona i jego synów, i włożysz na nich mitry, i będzie do nich należało kapłaństwo na mocy wiecznej ustawy. Poświęcisz też Aarona i jego synów."
  tags: []
"Wj29,10":
  text: "Przyprowadzisz też cielca przed Namiot Zgromadzenia i Aaron oraz jego synowie włożą swoje ręce na głowę cielca."
  tags: []
"Wj29,11":
  text: "I zabijesz cielca przed PANEM u wejścia do Namiotu Zgromadzenia."
  tags: []
"Wj29,12":
  text: "Potem weźmiesz krew cielca i pomażesz swym palcem rogi ołtarza, a resztkę krwi wylejesz u podnóża ołtarza."
  tags: []
"Wj29,13":
  text: "Weźmiesz też cały tłuszcz okrywający wnętrzności, płat wątroby i obie nerki z tłuszczem na nich i spalisz to na ołtarzu."
  tags: []
"Wj29,14":
  text: "A mięso cielca, jego skórę i jego odchody spalisz w ogniu za obozem, bo to jest ofiara za grzech."
  tags: []
"Wj29,15":
  text: "Weźmiesz także jednego barana, na którego głowę Aaron i jego synowie włożą swoje ręce."
  tags: []
"Wj29,16":
  text: "Następnie zabijesz tego barana i weźmiesz jego krew, i pokropisz dokoła wierzch ołtarza."
  tags: []
"Wj29,17":
  text: "Barana porąbiesz na części, opłuczesz jego trzewia i nogi i położysz je na jego częściach i na jego głowie."
  tags: []
"Wj29,18":
  text: "I spalisz całego tego barana na ołtarzu. Jest to całopalenie dla PANA, miła woń, ofiara spalona dla PANA."
  tags: []
"Wj29,19":
  text: "Potem weźmiesz drugiego barana, a Aaron i jego synowie włożą swoje ręce na głowę barana."
  tags: []
"Wj29,20":
  text: "Wtedy zabijesz tego barana, weźmiesz nieco z jego krwi i posmarujesz koniec ucha Aarona, końce prawych uszu jego synów i wielkie palce ich prawych rąk, także wielkie palce ich prawych stóp, i pokropisz tą krwią ołtarz dokoła."
  tags: []
"Wj29,21":
  text: "Weźmiesz też nieco z krwi, która jest na ołtarzu, także z olejku do namaszczenia, i pokropisz Aarona, jego szaty oraz jego synów i szaty jego synów wraz z nim. Tak zostanie poświęcony on i jego szaty, a wraz z nim jego synowie i szaty jego synów."
  tags: []
"Wj29,22":
  text: "Potem weźmiesz z barana łój, ogon, tłuszcz okrywający wnętrzności, płat wątroby, obie nerki, łój, który jest na nich, i prawą łopatkę, bo to jest baran poświęcenia;"
  tags: []
"Wj29,23":
  text: "I jeden bochen chleba, jeden placek chlebowy na oliwie i jeden podpłomyk z kosza przaśników, który jest przed PANEM."
  tags: []
"Wj29,24":
  text: "To wszystko położysz na ręce Aarona i na ręce jego synów i będziesz tym kołysać jako ofiarą kołysania przed PANEM."
  tags: []
"Wj29,25":
  text: "Potem weźmiesz to z ich rąk i spalisz na ołtarzu jako całopalenie, na miłą woń przed PANEM. Jest to ofiara spalona dla PANA."
  tags: []
"Wj29,26":
  text: "Weźmiesz też pierś barana poświęcenia Aarona i będziesz ją kołysać jako ofiarą kołysania przed PANEM. A to będzie twój dział."
  tags: []
"Wj29,27":
  text: "Poświęcisz też pierś kołysania i łopatkę wzniesienia, którą kołysano i którą wznoszono, z barana poświęcenia dla Aarona i dla jego synów."
  tags: []
"Wj29,28":
  text: "A będzie to dla Aarona i jego synów od synów Izraela na mocy wiecznej ustawy, gdyż jest to ofiara wzniesienia. Ofiara wzniesienia będzie wzięta od synów Izraela z ich ofiar pojednawczych. To będzie ich ofiara wzniesienia dla PANA."
  tags: []
"Wj29,29":
  text: "A święte szaty Aarona będą należeć po nim do jego synów, aby byli w nich namaszczeni i poświęceni."
  tags: []
"Wj29,30":
  text: "Siedem dni będzie w nich chodził kapłan, jego syn, który zajmie jego miejsce, gdy będzie wchodził do Namiotu Zgromadzenia, aby służyć w Miejscu Świętym."
  tags: []
"Wj29,31":
  text: "Weźmiesz też barana poświęcenia i ugotujesz jego mięso w miejscu świętym."
  tags: []
"Wj29,32":
  text: "Aaron i jego synowie będą jeść mięso tego barana i chleb, który jest w koszu, przy wejściu do Namiotu Zgromadzenia."
  tags: []
"Wj29,33":
  text: "Będą jeść to, czym dokonano przebłagania, gdy ich poświęcono i uświęcono. Obcy zaś nie będzie z tego jadł, bo jest to rzecz święta."
  tags: []
"Wj29,34":
  text: "A jeśli zostałoby coś z mięsa poświęcenia lub z chleba aż do poranka, spalisz resztki w ogniu. Nie wolno tego jeść, bo jest to rzecz święta."
  tags: []
"Wj29,35":
  text: "Tak więc postąpisz z Aaronem i jego synami według wszystkiego, co ci przykazałem. Przez siedem dni będziesz ich poświęcać."
  tags: []
"Wj29,36":
  text: "Każdego dnia złożysz cielca na ofiarę za grzech dla przebłagania. Oczyścisz ołtarz, dokonując na nim przebłagania, i namaścisz go, aby go poświęcić."
  tags: []
"Wj29,37":
  text: "Siedem dni będziesz dokonywał przebłagania za ołtarz i poświęcisz go, i będzie to ołtarz najświętszy. Ktokolwiek dotknie się ołtarza, musi być poświęcony."
  tags: []
"Wj29,38":
  text: "Oto co masz składać na ołtarzu: dwa roczne baranki, codziennie i ustawicznie."
  tags: []
"Wj29,39":
  text: "Jednego baranka złożysz w ofierze rano, a drugiego baranka złożysz w ofierze wieczorem;"
  tags: []
"Wj29,40":
  text: "I wraz z pierwszym barankiem dziesiątą część efy mąki pszennej zmieszanej z czwartą częścią hinu wytłoczonej oliwy, a na ofiarę z płynów czwartą część hinu wina."
  tags: []
"Wj29,41":
  text: "A drugiego baranka złożysz w ofierze wieczorem według obrzędu porannej ofiary i według ofiary z płynów, jako miłą woń i spaloną ofiarę dla PANA."
  tags: []
"Wj29,42":
  text: "To będzie nieustanne całopalenie przez wszystkie pokolenia u wejścia do Namiotu Zgromadzenia przed PANEM, gdzie będę się z wami spotykać, aby tam z tobą rozmawiać."
  tags: []
"Wj29,43":
  text: "Tam też będę się spotykać z synami Izraela i to miejsce zostanie poświęcone moją chwałą."
  tags: []
"Wj29,44":
  text: "Bo poświęcę Namiot Zgromadzenia i ołtarz, poświęcę też Aarona i jego synów, aby mi sprawowali urząd kapłański."
  tags: []
"Wj29,45":
  text: "I będę mieszkał pośród synów Izraela, i będę ich Bogiem."
  tags: []
"Wj29,46":
  text: "I poznają, że ja jestem PAN, ich Bóg, który wyprowadził ich z ziemi Egiptu, aby mieszkać pośród nich, ja, PAN, ich Bóg."
  tags: []
