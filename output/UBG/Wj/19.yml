"Wj19,1":
  text: "W trzecim miesiącu od wyjścia synów Izraela z ziemi Egiptu, w tym samym dniu, przyszli na pustynię Synaj."
  tags: []
"Wj19,2":
  text: "Bo wyruszyli z Refidim i po przybyciu na pustynię Synaj rozbili obóz na pustyni; tam Izrael obozował naprzeciw góry."
  tags: []
"Wj19,3":
  text: "A Mojżesz wstąpił do Boga i PAN zawołał do niego z góry: Tak powiesz domowi Jakuba i oznajmisz synom Izraela:"
  tags: []
"Wj19,4":
  text: "Widzieliście, co uczyniłem Egipcjanom i jak niosłem was na skrzydłach orłów, i przyprowadziłem was do siebie."
  tags: []
"Wj19,5":
  text: "Dlatego teraz, jeśli posłuchacie mego głosu i będziecie przestrzegać mojego przymierza, będziecie moją szczególną własnością ponad wszystkie narody, bo do mnie należy cała ziemia."
  tags: []
"Wj19,6":
  text: "A wy będziecie mi królestwem kapłanów i narodem świętym. To są słowa, które będziesz mówić do synów Izraela."
  tags: []
"Wj19,7":
  text: "Wtedy Mojżesz przyszedł i zwołał starszych ludu, i wyłożył im wszystkie te słowa, które mu PAN nakazał."
  tags: []
"Wj19,8":
  text: "Cały lud odpowiedział wspólnie: Uczynimy wszystko, co PAN powiedział. I Mojżesz zaniósł słowa ludu do PANA."
  tags: []
"Wj19,9":
  text: "PAN powiedział do Mojżesza: Oto przyjdę do ciebie w gęstym obłoku, aby lud słyszał, gdy będę z tobą rozmawiał, i uwierzył ci na zawsze. A Mojżesz przekazał PANU słowa ludu."
  tags: []
"Wj19,10":
  text: "PAN zaś mówił do Mojżesza: Idź do ludu i uświęć ich dziś i jutro, i niech wypiorą swoje szaty."
  tags: []
"Wj19,11":
  text: "Niech będą gotowi na trzeci dzień. Trzeciego dnia bowiem PAN zstąpi na oczach całego ludu na górę Synaj."
  tags: []
"Wj19,12":
  text: "I wyznaczysz ludowi granice dokoła, mówiąc: Strzeżcie się, abyście nie wstępowali na górę ani nie dotykali jej podnóża. Każdy, kto dotknie góry, poniesie śmierć."
  tags: []
"Wj19,13":
  text: "Nie dotknie go ręka, ale ukamienują go albo przeszyją strzałami; czy to zwierzę, czy człowiek, nie będzie żyć. Gdy przeciągle będą trąbić, niech podejdą do góry."
  tags: []
"Wj19,14":
  text: "Mojżesz zstąpił więc z góry do ludu i uświęcił lud, a oni uprali swoje szaty."
  tags: []
"Wj19,15":
  text: "I mówił do ludu: Bądźcie gotowi na trzeci dzień, nie zbliżajcie się do żon."
  tags: []
"Wj19,16":
  text: "Trzeciego dnia o poranku pojawiły się grzmoty i błyskawice, i gęsty obłok nad górą, i bardzo potężny głos trąby, tak że cały lud, który był w obozie, zadrżał."
  tags: []
"Wj19,17":
  text: "I Mojżesz wyprowadził lud z obozu na spotkanie z Bogiem, i stanęli u stóp góry."
  tags: []
"Wj19,18":
  text: "A góra Synaj cała dymiła, gdyż PAN zstąpił na nią w ogniu. Dym unosił się z niej jak dym z pieca i cała góra bardzo się trzęsła."
  tags: []
"Wj19,19":
  text: "A gdy głos trąby się przeciągał i coraz bardziej się rozlegał, Mojżesz mówił, a Bóg odpowiadał mu głosem."
  tags: []
"Wj19,20":
  text: "I PAN zstąpił na górę Synaj, na szczyt góry. Wtedy PAN wezwał Mojżesza na szczyt góry i Mojżesz tam wstąpił."
  tags: []
"Wj19,21":
  text: "Potem PAN powiedział do Mojżesza: Zejdź, przestrzeż lud, by nie przekroczył granicy, aby zobaczyć PANA, i aby wielu z nich nie zginęło."
  tags: []
"Wj19,22":
  text: "Nawet kapłani, którzy zbliżają się do PANA, niech się uświęcą, by ich PAN nie wytracił."
  tags: []
"Wj19,23":
  text: "I Mojżesz powiedział do PANA: Lud nie może wejść na górę Synaj, ponieważ ty nas przestrzegłeś, mówiąc: Wyznacz granice wokół góry i uświęć ją."
  tags: []
"Wj19,24":
  text: "PAN powiedział do niego: Idź, zejdź, a potem wstąpisz ty i Aaron z tobą. Lecz kapłani i lud niech nie przekraczają granicy, by wstąpić do PANA, aby ich nie wytracił."
  tags: []
"Wj19,25":
  text: "Mojżesz zszedł więc do ludu i powiedział im to."
  tags: []
