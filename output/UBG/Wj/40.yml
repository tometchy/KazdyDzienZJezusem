"Wj40,1": "Potem PAN powiedział do Mojżesza:"
"Wj40,2": "W pierwszym dniu, pierwszego miesiąca, wystawisz przybytek, czyli Namiot Zgromadzenia."
"Wj40,3": "I postawisz tam arkę świadectwa, i zakryjesz ją zasłoną."
"Wj40,4": "Wstawisz stół i ustawisz na nim to, co należy; wniesiesz także świecznik i zapalisz jego lampy."
"Wj40,5": "Postawisz też złoty ołtarz do kadzenia przed arką świadectwa i zawiesisz zasłonę przy wejściu do przybytku."
"Wj40,6": "Postawisz także ołtarz całopalenia przed wejściem do przybytku, do Namiotu Zgromadzenia."
"Wj40,7": "Postawisz też kadź między Namiotem Zgromadzenia a ołtarzem i nalejesz do niej wody."
"Wj40,8": "Wystawisz również i dziedziniec wokoło i zawiesisz zasłonę w bramie dziedzińca."
"Wj40,9": "Potem weźmiesz olejek do namaszczania i namaścisz przybytek i wszystko, co w nim jest, i poświęcisz go ze wszystkimi jego naczyniami, a będzie święty."
"Wj40,10": "Namaścisz też ołtarz całopalenia i wszystkie jego naczynia i poświęcisz ołtarz, a stanie się najświętszym ołtarzem."
"Wj40,11": "I namaścisz kadź i jej podstawę, i poświęcisz ją."
"Wj40,12": "Potem każesz podejść Aaronowi i jego synom przed wejście do Namiotu Zgromadzenia i umyjesz ich wodą."
"Wj40,13": "Obleczesz Aarona w święte szaty i namaścisz go, i poświęcisz go, aby mi sprawował urząd kapłański."
"Wj40,14": "Także jego synom każesz podejść i obleczesz ich w szaty;"
"Wj40,15": "I namaścisz ich, jak namaściłeś ich ojca, aby mi sprawowali urząd kapłański. A ich namaszczenie będzie dla nich wiecznym kapłaństwem po wszystkie ich pokolenia."
"Wj40,16": "Mojżesz uczynił więc wszystko, jak mu PAN rozkazał; tak uczynił."
"Wj40,17": "I tak pierwszego miesiąca, drugiego roku, pierwszego dnia miesiąca, został wzniesiony przybytek."
"Wj40,18": "I Mojżesz wystawił przybytek, podstawił jego podstawki, postawił deski, włożył drążki i postawił jego słupy."
"Wj40,19": "Rozciągnął też namiot nad przybytkiem i z wierzchu nałożył przykrycie namiotu nad nim, jak PAN rozkazał Mojżeszowi."
"Wj40,20": "Potem wziął świadectwo i włożył je do arki, i włożył drążki u arki, i umieścił przebłagalnię z wierzchu na arce."
"Wj40,21": "I wniósł arkę do przybytku, i zawiesił zasłonę zakrywającą, i zasłonił arkę świadectwa, jak PAN rozkazał Mojżeszowi."
"Wj40,22": "Postawił też stół w Namiocie Zgromadzenia po północnej stronie przybytku przed zasłoną."
"Wj40,23": "I poukładał na nim chleby przed PANEM, jak PAN rozkazał Mojżeszowi."
"Wj40,24": "Postawił też świecznik w Namiocie Zgromadzenia naprzeciwko stołu, po południowej stronie przybytku."
"Wj40,25": "Zapalił też lampy przed PANEM, jak PAN rozkazał Mojżeszowi."
"Wj40,26": "Ustawił i złoty ołtarz w Namiocie Zgromadzenia przed zasłoną;"
"Wj40,27": "I zapalił na nim wonne kadzidło, jak PAN rozkazał Mojżeszowi."
"Wj40,28": "Potem zawiesił zasłonę u wejścia do przybytku."
"Wj40,29": "Postawił też ołtarz całopalenia u wejścia do przybytku, czyli do Namiotu Zgromadzenia, i złożył na nim całopalenie i ofiarę pokarmową, jak PAN rozkazał Mojżeszowi."
"Wj40,30": "Potem umieścił kadź między Namiotem Zgromadzenia a ołtarzem i nalał do niej wody do obmywania."
"Wj40,31": "I Mojżesz, Aaron i jego synowie obmyli w niej swoje ręce i nogi."
"Wj40,32": "Gdy wchodzili do Namiotu Zgromadzenia i gdy zbliżali się do ołtarza, obmywali się, jak PAN rozkazał Mojżeszowi."
"Wj40,33": "Na koniec wystawił dziedziniec dokoła przybytku i ołtarza oraz zawiesił zasłonę w bramie dziedzińca. I tak Mojżesz zakończył tę pracę."
"Wj40,34": "Wtedy obłok okrył Namiot Zgromadzenia, a chwała PANA napełniła przybytek."
"Wj40,35": "I Mojżesz nie mógł wejść do Namiotu Zgromadzenia, bo spoczywał nad nim obłok, a chwała PANA napełniła przybytek."
"Wj40,36": "A gdy obłok wznosił się znad przybytku, synowie Izraela wyruszali w swoje wędrówki."
"Wj40,37": "A jeśli obłok nie wznosił się, nie wyruszali aż do dnia, kiedy się unosił."
"Wj40,38": "A obłok PANA był nad przybytkiem w ciągu dnia, w nocy zaś ogień był nad nim na oczach całego domu Izraela, w czasie całej ich wędrówki."
