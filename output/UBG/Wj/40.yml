"Wj40,1":
  text: "Potem PAN powiedział do Mojżesza:"
  tags: []
"Wj40,2":
  text: "W pierwszym dniu, pierwszego miesiąca, wystawisz przybytek, czyli Namiot Zgromadzenia."
  tags: []
"Wj40,3":
  text: "I postawisz tam arkę świadectwa, i zakryjesz ją zasłoną."
  tags: []
"Wj40,4":
  text: "Wstawisz stół i ustawisz na nim to, co należy; wniesiesz także świecznik i zapalisz jego lampy."
  tags: []
"Wj40,5":
  text: "Postawisz też złoty ołtarz do kadzenia przed arką świadectwa i zawiesisz zasłonę przy wejściu do przybytku."
  tags: []
"Wj40,6":
  text: "Postawisz także ołtarz całopalenia przed wejściem do przybytku, do Namiotu Zgromadzenia."
  tags: []
"Wj40,7":
  text: "Postawisz też kadź między Namiotem Zgromadzenia a ołtarzem i nalejesz do niej wody."
  tags: []
"Wj40,8":
  text: "Wystawisz również i dziedziniec wokoło i zawiesisz zasłonę w bramie dziedzińca."
  tags: []
"Wj40,9":
  text: "Potem weźmiesz olejek do namaszczania i namaścisz przybytek i wszystko, co w nim jest, i poświęcisz go ze wszystkimi jego naczyniami, a będzie święty."
  tags: []
"Wj40,10":
  text: "Namaścisz też ołtarz całopalenia i wszystkie jego naczynia i poświęcisz ołtarz, a stanie się najświętszym ołtarzem."
  tags: []
"Wj40,11":
  text: "I namaścisz kadź i jej podstawę, i poświęcisz ją."
  tags: []
"Wj40,12":
  text: "Potem każesz podejść Aaronowi i jego synom przed wejście do Namiotu Zgromadzenia i umyjesz ich wodą."
  tags: []
"Wj40,13":
  text: "Obleczesz Aarona w święte szaty i namaścisz go, i poświęcisz go, aby mi sprawował urząd kapłański."
  tags: []
"Wj40,14":
  text: "Także jego synom każesz podejść i obleczesz ich w szaty;"
  tags: []
"Wj40,15":
  text: "I namaścisz ich, jak namaściłeś ich ojca, aby mi sprawowali urząd kapłański. A ich namaszczenie będzie dla nich wiecznym kapłaństwem po wszystkie ich pokolenia."
  tags: []
"Wj40,16":
  text: "Mojżesz uczynił więc wszystko, jak mu PAN rozkazał; tak uczynił."
  tags: []
"Wj40,17":
  text: "I tak pierwszego miesiąca, drugiego roku, pierwszego dnia miesiąca, został wzniesiony przybytek."
  tags: []
"Wj40,18":
  text: "I Mojżesz wystawił przybytek, podstawił jego podstawki, postawił deski, włożył drążki i postawił jego słupy."
  tags: []
"Wj40,19":
  text: "Rozciągnął też namiot nad przybytkiem i z wierzchu nałożył przykrycie namiotu nad nim, jak PAN rozkazał Mojżeszowi."
  tags: []
"Wj40,20":
  text: "Potem wziął świadectwo i włożył je do arki, i włożył drążki u arki, i umieścił przebłagalnię z wierzchu na arce."
  tags: []
"Wj40,21":
  text: "I wniósł arkę do przybytku, i zawiesił zasłonę zakrywającą, i zasłonił arkę świadectwa, jak PAN rozkazał Mojżeszowi."
  tags: []
"Wj40,22":
  text: "Postawił też stół w Namiocie Zgromadzenia po północnej stronie przybytku przed zasłoną."
  tags: []
"Wj40,23":
  text: "I poukładał na nim chleby przed PANEM, jak PAN rozkazał Mojżeszowi."
  tags: []
"Wj40,24":
  text: "Postawił też świecznik w Namiocie Zgromadzenia naprzeciwko stołu, po południowej stronie przybytku."
  tags: []
"Wj40,25":
  text: "Zapalił też lampy przed PANEM, jak PAN rozkazał Mojżeszowi."
  tags: []
"Wj40,26":
  text: "Ustawił i złoty ołtarz w Namiocie Zgromadzenia przed zasłoną;"
  tags: []
"Wj40,27":
  text: "I zapalił na nim wonne kadzidło, jak PAN rozkazał Mojżeszowi."
  tags: []
"Wj40,28":
  text: "Potem zawiesił zasłonę u wejścia do przybytku."
  tags: []
"Wj40,29":
  text: "Postawił też ołtarz całopalenia u wejścia do przybytku, czyli do Namiotu Zgromadzenia, i złożył na nim całopalenie i ofiarę pokarmową, jak PAN rozkazał Mojżeszowi."
  tags: []
"Wj40,30":
  text: "Potem umieścił kadź między Namiotem Zgromadzenia a ołtarzem i nalał do niej wody do obmywania."
  tags: []
"Wj40,31":
  text: "I Mojżesz, Aaron i jego synowie obmyli w niej swoje ręce i nogi."
  tags: []
"Wj40,32":
  text: "Gdy wchodzili do Namiotu Zgromadzenia i gdy zbliżali się do ołtarza, obmywali się, jak PAN rozkazał Mojżeszowi."
  tags: []
"Wj40,33":
  text: "Na koniec wystawił dziedziniec dokoła przybytku i ołtarza oraz zawiesił zasłonę w bramie dziedzińca. I tak Mojżesz zakończył tę pracę."
  tags: []
"Wj40,34":
  text: "Wtedy obłok okrył Namiot Zgromadzenia, a chwała PANA napełniła przybytek."
  tags: []
"Wj40,35":
  text: "I Mojżesz nie mógł wejść do Namiotu Zgromadzenia, bo spoczywał nad nim obłok, a chwała PANA napełniła przybytek."
  tags: []
"Wj40,36":
  text: "A gdy obłok wznosił się znad przybytku, synowie Izraela wyruszali w swoje wędrówki."
  tags: []
"Wj40,37":
  text: "A jeśli obłok nie wznosił się, nie wyruszali aż do dnia, kiedy się unosił."
  tags: []
"Wj40,38":
  text: "A obłok PANA był nad przybytkiem w ciągu dnia, w nocy zaś ogień był nad nim na oczach całego domu Izraela, w czasie całej ich wędrówki."
  tags: []
