"Wj15,1":
  text: "Wówczas Mojżesz i synowie Izraela zaśpiewali PANU tę pieśń: Będę śpiewał PANU, bo bardzo się wywyższył. Konia i jego jeźdźca wrzucił w morze."
  tags: []
"Wj15,2":
  text: "PAN moją mocą i moją chwałą, bo stał się dla mnie zbawieniem. To mój Bóg, dlatego zbuduję mu przybytek, to Bóg mego ojca, dlatego będę go wywyższał."
  tags: []
"Wj15,3":
  text: "PAN jest wojownikiem, PAN to jego imię."
  tags: []
"Wj15,4":
  text: "Rydwany faraona i jego wojsko wrzucił w morze, a jego wyborni wodzowie zostali potopieni w Morzu Czerwonym."
  tags: []
"Wj15,5":
  text: "Okryły ich głębiny, poszli w głębię jak kamień."
  tags: []
"Wj15,6":
  text: "Twoja prawica, PANIE, jest uwielbiona w mocy. Twoja prawica, PANIE, starła nieprzyjaciela."
  tags: []
"Wj15,7":
  text: "A w wielkości twego majestatu powaliłeś swoich przeciwników. Zesłałeś swój gniew, który pożarł ich jak słomę."
  tags: []
"Wj15,8":
  text: "Pod tchnieniem twoich nozdrzy zebrały się wody, cieknące wody stanęły jak wał i głębiny osiadły pośrodku morza."
  tags: []
"Wj15,9":
  text: "Nieprzyjaciel mówił: Będę ścigał, dogonię, będę dzielił łupy; nasyci się nimi moja dusza, dobędę swój miecz, zgładzi ich moja ręka."
  tags: []
"Wj15,10":
  text: "Powiałeś swoim wiatrem, okryło ich morze. Zatonęli jak ołów w potężnych wodach."
  tags: []
"Wj15,11":
  text: "Któż jest podobny do ciebie wśród bogów, PANIE? Któż jest jak ty, wspaniały w świętości, straszliwy w chwale, czyniący cuda?"
  tags: []
"Wj15,12":
  text: "Wyciągnąłeś swoją prawicę, pochłonęła ich ziemia."
  tags: []
"Wj15,13":
  text: "Wiedziesz w swoim miłosierdziu ten lud, który odkupiłeś. Prowadzisz w swej potędze do swego świętego przybytku."
  tags: []
"Wj15,14":
  text: "Usłyszą o tym narody i zadrżą. Smutek przejmie obywateli Filistei."
  tags: []
"Wj15,15":
  text: "Wtedy zlękną się książęta Edomu, mocarzy Moabu ogarnie strach; struchleją wszyscy obywatele Kanaanu."
  tags: []
"Wj15,16":
  text: "Padnie na nich strach i lęk; z powodu potęgi twego ramienia zamilkną jak kamień, aż przejdzie twój lud, PANIE, aż przejdzie lud, który sobie nabyłeś."
  tags: []
"Wj15,17":
  text: "Wprowadzisz go i zasadzisz na górze twego dziedzictwa, na miejscu, PANIE, które uczyniłeś swoim mieszkaniem, w świątyni, Panie, którą umocniły twoje ręce."
  tags: []
"Wj15,18":
  text: "PAN będzie królował na wieki wieków."
  tags: []
"Wj15,19":
  text: "Weszły bowiem konie faraona z jego rydwanami i z jego jeźdźcami w morze, a PAN skierował na nich wody morskie; synowie Izraela zaś szli po suchej ziemi środkiem morza."
  tags: []
"Wj15,20":
  text: "Wtedy prorokini Miriam, siostra Aarona, wzięła bęben w rękę, a wszystkie kobiety wyszły za nią z bębnami i w pląsach."
  tags: []
"Wj15,21":
  text: "I Miriam powiedziała do nich: Śpiewajcie PANU, bo jest bardzo wywyższony; konia i jego jeźdźca wrzucił do morza."
  tags: []
"Wj15,22":
  text: "Potem Mojżesz poprowadził Izraela znad Morza Czerwonego i wyszli na pustynię Szur. Szli trzy dni przez pustynię i nie znaleźli wody."
  tags: []
"Wj15,23":
  text: "A gdy przybyli do Mary, nie mogli pić z wód Mary, bo były gorzkie. Dlatego nazwano to miejsce Mara."
  tags: []
"Wj15,24":
  text: "Wtedy lud szemrał przeciw Mojżeszowi, mówiąc: Cóż będziemy pić?"
  tags: []
"Wj15,25":
  text: "I Mojżesz wołał do PANA, a PAN wskazał mu drzewo, które on wrzucił do wody, a woda stała się słodka. Tam ustanowił dla nich ustawę i prawo i tam ich wystawił na próbę;"
  tags: []
"Wj15,26":
  text: "I powiedział: Jeśli będziesz pilnie słuchał głosu PANA, twego Boga, i będziesz robił to, co prawe w jego oczach, i nakłonisz uszy ku jego przykazaniom, i będziesz przestrzegał wszystkich jego ustaw, to nie ześlę na ciebie żadnej choroby, jaką zesłałem na Egipt, gdyż ja jestem PAN, który cię uzdrawia."
  tags: []
"Wj15,27":
  text: "I przybyli do Elim, gdzie było dwanaście źródeł wody i siedemdziesiąt palm; tam rozbili obóz nad wodami."
  tags: []
