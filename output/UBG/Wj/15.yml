"Wj15,1": "Wówczas Mojżesz i synowie Izraela zaśpiewali PANU tę pieśń: Będę śpiewał PANU, bo bardzo się wywyższył. Konia i jego jeźdźca wrzucił w morze."
"Wj15,2": "PAN moją mocą i moją chwałą, bo stał się dla mnie zbawieniem. To mój Bóg, dlatego zbuduję mu przybytek, to Bóg mego ojca, dlatego będę go wywyższał."
"Wj15,3": "PAN jest wojownikiem, PAN to jego imię."
"Wj15,4": "Rydwany faraona i jego wojsko wrzucił w morze, a jego wyborni wodzowie zostali potopieni w Morzu Czerwonym."
"Wj15,5": "Okryły ich głębiny, poszli w głębię jak kamień."
"Wj15,6": "Twoja prawica, PANIE, jest uwielbiona w mocy. Twoja prawica, PANIE, starła nieprzyjaciela."
"Wj15,7": "A w wielkości twego majestatu powaliłeś swoich przeciwników. Zesłałeś swój gniew, który pożarł ich jak słomę."
"Wj15,8": "Pod tchnieniem twoich nozdrzy zebrały się wody, cieknące wody stanęły jak wał i głębiny osiadły pośrodku morza."
"Wj15,9": "Nieprzyjaciel mówił: Będę ścigał, dogonię, będę dzielił łupy; nasyci się nimi moja dusza, dobędę swój miecz, zgładzi ich moja ręka."
"Wj15,10": "Powiałeś swoim wiatrem, okryło ich morze. Zatonęli jak ołów w potężnych wodach."
"Wj15,11": "Któż jest podobny do ciebie wśród bogów, PANIE? Któż jest jak ty, wspaniały w świętości, straszliwy w chwale, czyniący cuda?"
"Wj15,12": "Wyciągnąłeś swoją prawicę, pochłonęła ich ziemia."
"Wj15,13": "Wiedziesz w swoim miłosierdziu ten lud, który odkupiłeś. Prowadzisz w swej potędze do swego świętego przybytku."
"Wj15,14": "Usłyszą o tym narody i zadrżą. Smutek przejmie obywateli Filistei."
"Wj15,15": "Wtedy zlękną się książęta Edomu, mocarzy Moabu ogarnie strach; struchleją wszyscy obywatele Kanaanu."
"Wj15,16": "Padnie na nich strach i lęk; z powodu potęgi twego ramienia zamilkną jak kamień, aż przejdzie twój lud, PANIE, aż przejdzie lud, który sobie nabyłeś."
"Wj15,17": "Wprowadzisz go i zasadzisz na górze twego dziedzictwa, na miejscu, PANIE, które uczyniłeś swoim mieszkaniem, w świątyni, Panie, którą umocniły twoje ręce."
"Wj15,18": "PAN będzie królował na wieki wieków."
"Wj15,19": "Weszły bowiem konie faraona z jego rydwanami i z jego jeźdźcami w morze, a PAN skierował na nich wody morskie; synowie Izraela zaś szli po suchej ziemi środkiem morza."
"Wj15,20": "Wtedy prorokini Miriam, siostra Aarona, wzięła bęben w rękę, a wszystkie kobiety wyszły za nią z bębnami i w pląsach."
"Wj15,21": "I Miriam powiedziała do nich: Śpiewajcie PANU, bo jest bardzo wywyższony; konia i jego jeźdźca wrzucił do morza."
"Wj15,22": "Potem Mojżesz poprowadził Izraela znad Morza Czerwonego i wyszli na pustynię Szur. Szli trzy dni przez pustynię i nie znaleźli wody."
"Wj15,23": "A gdy przybyli do Mary, nie mogli pić z wód Mary, bo były gorzkie. Dlatego nazwano to miejsce Mara."
"Wj15,24": "Wtedy lud szemrał przeciw Mojżeszowi, mówiąc: Cóż będziemy pić?"
"Wj15,25": "I Mojżesz wołał do PANA, a PAN wskazał mu drzewo, które on wrzucił do wody, a woda stała się słodka. Tam ustanowił dla nich ustawę i prawo i tam ich wystawił na próbę;"
"Wj15,26": "I powiedział: Jeśli będziesz pilnie słuchał głosu PANA, twego Boga, i będziesz robił to, co prawe w jego oczach, i nakłonisz uszy ku jego przykazaniom, i będziesz przestrzegał wszystkich jego ustaw, to nie ześlę na ciebie żadnej choroby, jaką zesłałem na Egipt, gdyż ja jestem PAN, który cię uzdrawia."
"Wj15,27": "I przybyli do Elim, gdzie było dwanaście źródeł wody i siedemdziesiąt palm; tam rozbili obóz nad wodami."
