"Wj3,1": "Mojżesz pasał stado swego teścia Jetra, kapłana Midianitów. Zaprowadził stado na drugą stronę pustyni i przyszedł do góry Bożej, do Horebu."
"Wj3,2": "I Anioł PANA ukazał mu się w płomieniu ognia, ze środka krzewu. Spojrzał, a oto krzew płonął ogniem, lecz nie spłonął."
"Wj3,3": "Wtedy Mojżesz powiedział: Podejdę i zobaczę to wielkie zjawisko, dlaczego ten krzew się nie spala."
"Wj3,4": "A gdy PAN widział, że podchodził, aby to zobaczyć, zawołał do niego Bóg ze środka tego krzewu: Mojżeszu, Mojżeszu! A on odpowiedział: Oto jestem."
"Wj3,5": "Wtedy powiedział: Nie zbliżaj się tu. Zdejmij buty z nóg, bo miejsce, na którym stoisz, jest ziemią świętą."
"Wj3,6": "I dodał: Ja jestem Bogiem twego ojca, Bogiem Abrahama, Bogiem Izaaka i Bogiem Jakuba. I Mojżesz zakrył twarz, bo bał się patrzeć na Boga."
"Wj3,7": "PAN powiedział: Przyjrzałem się utrapieniom mojego ludu, który jest w Egipcie, i słyszałem ich krzyk z powodu nadzorców, gdyż znam jego cierpienia."
"Wj3,8": "Dlatego zstąpiłem, aby wybawić go z ręki Egipcjan i wyprowadzić z tej ziemi do ziemi dobrej i przestronnej, do ziemi opływającej mlekiem i miodem, na miejsce Kananejczyków, Chetytów, Amorytów, Peryzzytów, Chiwwitów i Jebusytów."
"Wj3,9": "Teraz oto dotarł do mnie krzyk synów Izraela. Widziałem też ucisk, jakim dręczą ich Egipcjanie."
"Wj3,10": "Dlatego teraz idź, poślę cię do faraona, abyś wyprowadził mój lud, synów Izraela, z Egiptu."
"Wj3,11": "Mojżesz powiedział do Boga: Kimże ja jestem, abym miał iść do faraona i wyprowadzić synów Izraela z Egiptu?"
"Wj3,12": "Bóg odpowiedział: Oto ja będę z tobą, a to będzie znakiem dla ciebie, że ja cię posłałem: gdy wyprowadzisz ten lud z Egiptu, będziecie służyć Bogu na tej górze."
"Wj3,13": "Mojżesz powiedział do Boga: Kiedy pójdę do synów Izraela i powiem im: Bóg waszych ojców posłał mnie do was, a oni zapytają mnie, jakie jest jego imię, cóż im odpowiem?"
"Wj3,14": "Wtedy Bóg odrzekł do Mojżesza: JESTEM, KTÓRY JESTEM. I dodał: Tak powiesz synom Izraela: JESTEM posłał mnie do was."
"Wj3,15": "I mówił jeszcze Bóg do Mojżesza: Tak powiesz synom Izraela: PAN, Bóg waszych ojców, Bóg Abrahama, Bóg Izaaka i Bóg Jakuba, posłał mnie do was. To jest moje imię na wieki i takim ma pozostać w pamięci po wszystkie pokolenia."
"Wj3,16": "Idź, zgromadź starszych Izraela i mów do nich: Ukazał mi się PAN, Bóg waszych ojców, Bóg Abrahama, Izaaka i Jakuba, i powiedział: Nawiedziłem was i widziałem, co wam uczyniono w Egipcie."
"Wj3,17": "I postanowiłem: Wyprowadzę was z utrapienia Egiptu do ziemi Kananejczyków, Chetytów, Amorytów, Peryzzytów, Chiwwitów i Jebusytów, do ziemi opływającej mlekiem i miodem."
"Wj3,18": "Wtedy usłuchają twego głosu. I pójdziesz ty i starsi Izraela do króla Egiptu i powiecie do niego: PAN, Bóg Hebrajczyków, spotkał się z nami. Dlatego teraz pozwól nam pójść, proszę, w trzy dni drogi na pustynię, aby złożyć ofiarę PANU, naszemu Bogu."
"Wj3,19": "Wiem, że król Egiptu nie pozwoli wam odejść, chyba że przez potężną rękę."
"Wj3,20": "Wyciągnę więc rękę i uderzę Egipt wszystkimi moimi cudami, które będę czynił pośród niego. A potem was wypuści."
"Wj3,21": "Sprawię, że ten lud znajdzie przychylność w oczach Egipcjan. I stanie się tak, gdy będziecie wychodzić, że nie wyjdziecie z pustymi rękami."
"Wj3,22": "Ale każda kobieta pożyczy od swojej sąsiadki i od tej, która u niej przebywa, srebrne i złote przedmioty oraz szaty. Włożycie je na waszych synów i na wasze córki i złupicie Egipt."
