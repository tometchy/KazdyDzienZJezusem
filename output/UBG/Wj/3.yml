"Wj3,1":
  text: "Mojżesz pasał stado swego teścia Jetra, kapłana Midianitów. Zaprowadził stado na drugą stronę pustyni i przyszedł do góry Bożej, do Horebu."
  tags: []
"Wj3,2":
  text: "I Anioł PANA ukazał mu się w płomieniu ognia, ze środka krzewu. Spojrzał, a oto krzew płonął ogniem, lecz nie spłonął."
  tags: []
"Wj3,3":
  text: "Wtedy Mojżesz powiedział: Podejdę i zobaczę to wielkie zjawisko, dlaczego ten krzew się nie spala."
  tags: []
"Wj3,4":
  text: "A gdy PAN widział, że podchodził, aby to zobaczyć, zawołał do niego Bóg ze środka tego krzewu: Mojżeszu, Mojżeszu! A on odpowiedział: Oto jestem."
  tags: []
"Wj3,5":
  text: "Wtedy powiedział: Nie zbliżaj się tu. Zdejmij buty z nóg, bo miejsce, na którym stoisz, jest ziemią świętą."
  tags: []
"Wj3,6":
  text: "I dodał: Ja jestem Bogiem twego ojca, Bogiem Abrahama, Bogiem Izaaka i Bogiem Jakuba. I Mojżesz zakrył twarz, bo bał się patrzeć na Boga."
  tags: []
"Wj3,7":
  text: "PAN powiedział: Przyjrzałem się utrapieniom mojego ludu, który jest w Egipcie, i słyszałem ich krzyk z powodu nadzorców, gdyż znam jego cierpienia."
  tags: []
"Wj3,8":
  text: "Dlatego zstąpiłem, aby wybawić go z ręki Egipcjan i wyprowadzić z tej ziemi do ziemi dobrej i przestronnej, do ziemi opływającej mlekiem i miodem, na miejsce Kananejczyków, Chetytów, Amorytów, Peryzzytów, Chiwwitów i Jebusytów."
  tags: []
"Wj3,9":
  text: "Teraz oto dotarł do mnie krzyk synów Izraela. Widziałem też ucisk, jakim dręczą ich Egipcjanie."
  tags: []
"Wj3,10":
  text: "Dlatego teraz idź, poślę cię do faraona, abyś wyprowadził mój lud, synów Izraela, z Egiptu."
  tags: []
"Wj3,11":
  text: "Mojżesz powiedział do Boga: Kimże ja jestem, abym miał iść do faraona i wyprowadzić synów Izraela z Egiptu?"
  tags: []
"Wj3,12":
  text: "Bóg odpowiedział: Oto ja będę z tobą, a to będzie znakiem dla ciebie, że ja cię posłałem: gdy wyprowadzisz ten lud z Egiptu, będziecie służyć Bogu na tej górze."
  tags: []
"Wj3,13":
  text: "Mojżesz powiedział do Boga: Kiedy pójdę do synów Izraela i powiem im: Bóg waszych ojców posłał mnie do was, a oni zapytają mnie, jakie jest jego imię, cóż im odpowiem?"
  tags: []
"Wj3,14":
  text: "Wtedy Bóg odrzekł do Mojżesza: JESTEM, KTÓRY JESTEM. I dodał: Tak powiesz synom Izraela: JESTEM posłał mnie do was."
  tags: []
"Wj3,15":
  text: "I mówił jeszcze Bóg do Mojżesza: Tak powiesz synom Izraela: PAN, Bóg waszych ojców, Bóg Abrahama, Bóg Izaaka i Bóg Jakuba, posłał mnie do was. To jest moje imię na wieki i takim ma pozostać w pamięci po wszystkie pokolenia."
  tags: []
"Wj3,16":
  text: "Idź, zgromadź starszych Izraela i mów do nich: Ukazał mi się PAN, Bóg waszych ojców, Bóg Abrahama, Izaaka i Jakuba, i powiedział: Nawiedziłem was i widziałem, co wam uczyniono w Egipcie."
  tags: []
"Wj3,17":
  text: "I postanowiłem: Wyprowadzę was z utrapienia Egiptu do ziemi Kananejczyków, Chetytów, Amorytów, Peryzzytów, Chiwwitów i Jebusytów, do ziemi opływającej mlekiem i miodem."
  tags: []
"Wj3,18":
  text: "Wtedy usłuchają twego głosu. I pójdziesz ty i starsi Izraela do króla Egiptu i powiecie do niego: PAN, Bóg Hebrajczyków, spotkał się z nami. Dlatego teraz pozwól nam pójść, proszę, w trzy dni drogi na pustynię, aby złożyć ofiarę PANU, naszemu Bogu."
  tags: []
"Wj3,19":
  text: "Wiem, że król Egiptu nie pozwoli wam odejść, chyba że przez potężną rękę."
  tags: []
"Wj3,20":
  text: "Wyciągnę więc rękę i uderzę Egipt wszystkimi moimi cudami, które będę czynił pośród niego. A potem was wypuści."
  tags: []
"Wj3,21":
  text: "Sprawię, że ten lud znajdzie przychylność w oczach Egipcjan. I stanie się tak, gdy będziecie wychodzić, że nie wyjdziecie z pustymi rękami."
  tags: []
"Wj3,22":
  text: "Ale każda kobieta pożyczy od swojej sąsiadki i od tej, która u niej przebywa, srebrne i złote przedmioty oraz szaty. Włożycie je na waszych synów i na wasze córki i złupicie Egipt."
  tags: []
