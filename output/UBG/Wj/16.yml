"Wj16,1":
  text: "Potem wyruszyli z Elim i całe zgromadzenie synów Izraela przybyło na pustynię Sin, która leży między Elim a Synajem, piętnastego dnia drugiego miesiąca po ich wyjściu z ziemi Egiptu."
  tags: []
"Wj16,2":
  text: "I całe zgromadzenie synów Izraela szemrało przeciw Mojżeszowi i Aaronowi na pustyni."
  tags: []
"Wj16,3":
  text: "Synowie Izraela mówili do nich: Obyśmy pomarli z ręki PANA w ziemi Egiptu, gdy siadaliśmy nad garncami mięsa, gdy najadaliśmy się chleba do syta! Bo wyprowadziliście nas na tę pustynię, by całą tę rzeszę zamorzyć głodem."
  tags: []
"Wj16,4":
  text: "Wtedy PAN powiedział do Mojżesza: Oto spuszczę wam jak deszcz chleb z nieba. Lud będzie wychodził i każdego dnia będzie zbierał według potrzeby dziennej, abym mógł go wystawić na próbę, czy będzie postępował zgodnie z moim prawem, czy nie."
  tags: []
"Wj16,5":
  text: "A szóstego dnia przyrządzą to, co przyniosą, a będzie tego dwa razy tyle, co zbierają codziennie."
  tags: []
"Wj16,6":
  text: "Mojżesz i Aaron mówili do wszystkich synów Izraela: Wieczorem poznacie, że PAN wyprowadził was z ziemi Egiptu;"
  tags: []
"Wj16,7":
  text: "A rano ujrzycie chwałę PANA, usłyszał bowiem wasze szemrania przeciw PANU. A my, czym jesteśmy, że szemrzecie przeciwko nam?"
  tags: []
"Wj16,8":
  text: "Mojżesz mówił dalej: PAN da wam wieczorem mięso do jedzenia, a rano chleb do syta. PAN bowiem usłyszał wasze szemrania, które podnosicie przeciw niemu. A my, czym jesteśmy? Wasze szemrania nie są przeciwko nam, ale przeciwko PANU."
  tags: []
"Wj16,9":
  text: "Mojżesz powiedział do Aarona: Powiedz całemu zgromadzeniu synów Izraela: Zbliżcie się przed oblicze PANA, gdyż usłyszał wasze szemranie."
  tags: []
"Wj16,10":
  text: "Gdy Aaron mówił do całego zgromadzenia synów Izraela, spojrzeli w stronę pustyni, a oto chwała PANA ukazała się w obłoku."
  tags: []
"Wj16,11":
  text: "Potem PAN powiedział do Mojżesza:"
  tags: []
"Wj16,12":
  text: "Usłyszałem szemranie synów Izraela. Powiedz do nich: Pod wieczór będziecie jeść mięso, a rano będziecie nasyceni chlebem. I poznacie, że ja jestem PAN, wasz Bóg."
  tags: []
"Wj16,13":
  text: "Wieczorem stało się tak, że zleciały się przepiórki i pokryły obóz, a rano dokoła obozu leżała rosa;"
  tags: []
"Wj16,14":
  text: "A gdy warstwa rosy się uniosła, ukazało się na powierzchni pustyni coś bardzo małego, okrągłego, drobnego jak szron na ziemi."
  tags: []
"Wj16,15":
  text: "Gdy synowie Izraela to zobaczyli, mówili jeden do drugiego: To manna, gdyż nie wiedzieli, co to było. I Mojżesz powiedział do nich: To jest chleb, który PAN dał wam do jedzenia."
  tags: []
"Wj16,16":
  text: "Oto co PAN rozkazał: Niech każdy zbiera z niego tyle, ile trzeba do jedzenia, omer na osobę, według liczby osób. Niech każdy zbiera dla tych, którzy są w jego namiocie."
  tags: []
"Wj16,17":
  text: "I synowie Izraela tak uczynili, i zbierali jedni więcej, drudzy mniej."
  tags: []
"Wj16,18":
  text: "A gdy to mierzyli omerem, to ten, kto nazbierał więcej, nie miał nadmiaru, temu zaś, kto nazbierał mało, nie zabrakło. Każdy zbierał według tego, co mógł zjeść."
  tags: []
"Wj16,19":
  text: "Mojżesz mówił też do nich: Niech nikt nie pozostawia z tego nic do rana."
  tags: []
"Wj16,20":
  text: "Jednak nie usłuchali Mojżesza i zostawili niektórzy z tego aż do rana, i zamieniło się w robaki, i cuchnęło. I Mojżesz rozgniewał się na nich."
  tags: []
"Wj16,21":
  text: "Zbierali to więc każdego ranka, każdy według tego, co mógł zjeść. A gdy słońce zaczynało grzać, topniało."
  tags: []
"Wj16,22":
  text: "A gdy nastał szósty dzień, zbierali dwa razy więcej chleba, po dwa omery na każdego. I wszyscy przełożeni zgromadzenia przyszli i powiedzieli o tym Mojżeszowi."
  tags: []
"Wj16,23":
  text: "On zaś powiedział im: Oto co PAN mówił: Jutro będzie odpoczynek, święty szabat dla PANA. Upieczcie, co macie upiec, ugotujcie, co macie ugotować, a co zostanie, zostawcie sobie i zachowajcie do jutra."
  tags: []
"Wj16,24":
  text: "Zostawili więc to do rana, jak Mojżesz rozkazał, i nie cuchnęło ani nie było w tym robaków."
  tags: []
"Wj16,25":
  text: "I Mojżesz powiedział: Jedzcie to dziś, bo dziś jest szabat dla PANA. Dziś nie znajdziecie tego na polu."
  tags: []
"Wj16,26":
  text: "Przez sześć dni będziecie to zbierać, a w siódmym dniu jest szabat, w nim tego nie będzie."
  tags: []
"Wj16,27":
  text: "A siódmego dnia niektórzy z ludu wyszli, aby zbierać, ale nic nie znaleźli."
  tags: []
"Wj16,28":
  text: "Wtedy PAN powiedział do Mojżesza: Jak długo będziecie się wzbraniać przed przestrzeganiem moich przykazań i moich praw?"
  tags: []
"Wj16,29":
  text: "Patrzcie, PAN dał wam szabat, dlatego w szóstym dniu daje wam chleb na dwa dni. Niech każdy zostanie na swoim miejscu, niech nikt nie wychodzi ze swego miejsca w siódmym dniu."
  tags: []
"Wj16,30":
  text: "Odpoczywał więc lud siódmego dnia."
  tags: []
"Wj16,31":
  text: "I dom Izraela nadał temu pokarmowi nazwę manna. Była jak nasienie kolendry, biała, o smaku placków z miodem."
  tags: []
"Wj16,32":
  text: "Mojżesz powiedział: Tak rozkazał PAN: Napełnij nim omer na przechowanie dla waszych przyszłych pokoleń, aby widziały ten chleb, którym was karmiłem na pustyni, gdy wyprowadziłem was z ziemi Egiptu."
  tags: []
"Wj16,33":
  text: "Potem Mojżesz powiedział do Aarona: Weź naczynie, wsyp do niego pełen omer manny i postaw je przed PANEM na przechowanie dla waszych przyszłych pokoleń."
  tags: []
"Wj16,34":
  text: "Jak PAN przykazał Mojżeszowi, tak Aaron postawił je przed Świadectwem na przechowanie."
  tags: []
"Wj16,35":
  text: "A synowie Izraela jedli mannę przez czterdzieści lat, aż przybyli do ziemi zamieszkałej. Jedli mannę, aż przybyli do granic ziemi Kanaan."
  tags: []
"Wj16,36":
  text: "A omer to dziesiąta część efy."
  tags: []
