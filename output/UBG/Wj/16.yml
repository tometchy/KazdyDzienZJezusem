"Wj16,1": "Potem wyruszyli z Elim i całe zgromadzenie synów Izraela przybyło na pustynię Sin, która leży między Elim a Synajem, piętnastego dnia drugiego miesiąca po ich wyjściu z ziemi Egiptu."
"Wj16,2": "I całe zgromadzenie synów Izraela szemrało przeciw Mojżeszowi i Aaronowi na pustyni."
"Wj16,3": "Synowie Izraela mówili do nich: Obyśmy pomarli z ręki PANA w ziemi Egiptu, gdy siadaliśmy nad garncami mięsa, gdy najadaliśmy się chleba do syta! Bo wyprowadziliście nas na tę pustynię, by całą tę rzeszę zamorzyć głodem."
"Wj16,4": "Wtedy PAN powiedział do Mojżesza: Oto spuszczę wam jak deszcz chleb z nieba. Lud będzie wychodził i każdego dnia będzie zbierał według potrzeby dziennej, abym mógł go wystawić na próbę, czy będzie postępował zgodnie z moim prawem, czy nie."
"Wj16,5": "A szóstego dnia przyrządzą to, co przyniosą, a będzie tego dwa razy tyle, co zbierają codziennie."
"Wj16,6": "Mojżesz i Aaron mówili do wszystkich synów Izraela: Wieczorem poznacie, że PAN wyprowadził was z ziemi Egiptu;"
"Wj16,7": "A rano ujrzycie chwałę PANA, usłyszał bowiem wasze szemrania przeciw PANU. A my, czym jesteśmy, że szemrzecie przeciwko nam?"
"Wj16,8": "Mojżesz mówił dalej: PAN da wam wieczorem mięso do jedzenia, a rano chleb do syta. PAN bowiem usłyszał wasze szemrania, które podnosicie przeciw niemu. A my, czym jesteśmy? Wasze szemrania nie są przeciwko nam, ale przeciwko PANU."
"Wj16,9": "Mojżesz powiedział do Aarona: Powiedz całemu zgromadzeniu synów Izraela: Zbliżcie się przed oblicze PANA, gdyż usłyszał wasze szemranie."
"Wj16,10": "Gdy Aaron mówił do całego zgromadzenia synów Izraela, spojrzeli w stronę pustyni, a oto chwała PANA ukazała się w obłoku."
"Wj16,11": "Potem PAN powiedział do Mojżesza:"
"Wj16,12": "Usłyszałem szemranie synów Izraela. Powiedz do nich: Pod wieczór będziecie jeść mięso, a rano będziecie nasyceni chlebem. I poznacie, że ja jestem PAN, wasz Bóg."
"Wj16,13": "Wieczorem stało się tak, że zleciały się przepiórki i pokryły obóz, a rano dokoła obozu leżała rosa;"
"Wj16,14": "A gdy warstwa rosy się uniosła, ukazało się na powierzchni pustyni coś bardzo małego, okrągłego, drobnego jak szron na ziemi."
"Wj16,15": "Gdy synowie Izraela to zobaczyli, mówili jeden do drugiego: To manna, gdyż nie wiedzieli, co to było. I Mojżesz powiedział do nich: To jest chleb, który PAN dał wam do jedzenia."
"Wj16,16": "Oto co PAN rozkazał: Niech każdy zbiera z niego tyle, ile trzeba do jedzenia, omer na osobę, według liczby osób. Niech każdy zbiera dla tych, którzy są w jego namiocie."
"Wj16,17": "I synowie Izraela tak uczynili, i zbierali jedni więcej, drudzy mniej."
"Wj16,18": "A gdy to mierzyli omerem, to ten, kto nazbierał więcej, nie miał nadmiaru, temu zaś, kto nazbierał mało, nie zabrakło. Każdy zbierał według tego, co mógł zjeść."
"Wj16,19": "Mojżesz mówił też do nich: Niech nikt nie pozostawia z tego nic do rana."
"Wj16,20": "Jednak nie usłuchali Mojżesza i zostawili niektórzy z tego aż do rana, i zamieniło się w robaki, i cuchnęło. I Mojżesz rozgniewał się na nich."
"Wj16,21": "Zbierali to więc każdego ranka, każdy według tego, co mógł zjeść. A gdy słońce zaczynało grzać, topniało."
"Wj16,22": "A gdy nastał szósty dzień, zbierali dwa razy więcej chleba, po dwa omery na każdego. I wszyscy przełożeni zgromadzenia przyszli i powiedzieli o tym Mojżeszowi."
"Wj16,23": "On zaś powiedział im: Oto co PAN mówił: Jutro będzie odpoczynek, święty szabat dla PANA. Upieczcie, co macie upiec, ugotujcie, co macie ugotować, a co zostanie, zostawcie sobie i zachowajcie do jutra."
"Wj16,24": "Zostawili więc to do rana, jak Mojżesz rozkazał, i nie cuchnęło ani nie było w tym robaków."
"Wj16,25": "I Mojżesz powiedział: Jedzcie to dziś, bo dziś jest szabat dla PANA. Dziś nie znajdziecie tego na polu."
"Wj16,26": "Przez sześć dni będziecie to zbierać, a w siódmym dniu jest szabat, w nim tego nie będzie."
"Wj16,27": "A siódmego dnia niektórzy z ludu wyszli, aby zbierać, ale nic nie znaleźli."
"Wj16,28": "Wtedy PAN powiedział do Mojżesza: Jak długo będziecie się wzbraniać przed przestrzeganiem moich przykazań i moich praw?"
"Wj16,29": "Patrzcie, PAN dał wam szabat, dlatego w szóstym dniu daje wam chleb na dwa dni. Niech każdy zostanie na swoim miejscu, niech nikt nie wychodzi ze swego miejsca w siódmym dniu."
"Wj16,30": "Odpoczywał więc lud siódmego dnia."
"Wj16,31": "I dom Izraela nadał temu pokarmowi nazwę manna. Była jak nasienie kolendry, biała, o smaku placków z miodem."
"Wj16,32": "Mojżesz powiedział: Tak rozkazał PAN: Napełnij nim omer na przechowanie dla waszych przyszłych pokoleń, aby widziały ten chleb, którym was karmiłem na pustyni, gdy wyprowadziłem was z ziemi Egiptu."
"Wj16,33": "Potem Mojżesz powiedział do Aarona: Weź naczynie, wsyp do niego pełen omer manny i postaw je przed PANEM na przechowanie dla waszych przyszłych pokoleń."
"Wj16,34": "Jak PAN przykazał Mojżeszowi, tak Aaron postawił je przed Świadectwem na przechowanie."
"Wj16,35": "A synowie Izraela jedli mannę przez czterdzieści lat, aż przybyli do ziemi zamieszkałej. Jedli mannę, aż przybyli do granic ziemi Kanaan."
"Wj16,36": "A omer to dziesiąta część efy."
