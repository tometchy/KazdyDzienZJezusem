"Wj6,1": "Wtedy PAN powiedział do Mojżesza: Teraz zobaczysz, co uczynię faraonowi. Mocną ręką bowiem wypuści ich i mocną ręką wypędzi ich ze swojej ziemi."
"Wj6,2": "Nadto Bóg mówił do Mojżesza: Ja jestem PANEM."
"Wj6,3": "Objawiłem się Abrahamowi, Izaakowi i Jakubowi pod tym imieniem: Bóg Wszechmogący, ale z mojego imienia JEHOWA nie byłem przez nich poznany."
"Wj6,4": "Ustanowiłem też z nimi moje przymierze, aby dać im ziemię Kanaan, ziemię ich pielgrzymowania, w której przebywali jako obcy."
"Wj6,5": "Usłyszałem także jęk synów Izraela, których Egipcjanie trzymają w niewoli, i wspomniałem na moje przymierze."
"Wj6,6": "Dlatego powiedz synom Izraela: Ja jestem PAN, wyprowadzę was spod ciężarów Egipcjan, wyrwę was z ich niewoli i wybawię was wyciągniętym ramieniem i przez wielkie sądy."
"Wj6,7": "Wezmę was sobie za lud i będę wam Bogiem. Poznacie, że ja jestem PAN, wasz Bóg, który was wyprowadza spod ciężarów Egipcjan."
"Wj6,8": "I wprowadzę was do ziemi, którą przysiągłem dać Abrahamowi, Izaakowi i Jakubowi; i dam ją wam w dziedzictwo. Ja jestem PAN."
"Wj6,9": "I Mojżesz mówił tak do synów Izraela, ale nie usłuchali go z powodu udręki ducha i ciężkiej niewoli."
"Wj6,10": "Wtedy PAN powiedział do Mojżesza:"
"Wj6,11": "Idź, powiedz faraonowi, królowi Egiptu, żeby wypuścił synów Izraela ze swej ziemi."
"Wj6,12": "Mojżesz zaś odpowiedział przed PANEM: Oto synowie Izraela nie posłuchali mnie, jakże więc posłucha mnie faraon? Jestem przecież nieobrzezanych warg."
"Wj6,13": "Wtedy PAN przemówił do Mojżesza i Aarona i dał im rozkaz dla synów Izraela i dla faraona, króla Egiptu, aby wyprowadzili synów Izraela z ziemi Egiptu."
"Wj6,14": "Oto naczelnicy domów ich ojców: synowie Rubena, pierworodnego Izraela: Henoch, Pallu, Chesron i Karmi. To są rodziny Rubena."
"Wj6,15": "Synowie Symeona: Jemuel, Jamin, Ohad, Jakin, Sochar i Szaul, syn Kananejki. To są rodziny Symeona."
"Wj6,16": "Oto imiona synów Lewiego według ich pokoleń: Gerszon, Kehat i Merari. A lat życia Lewiego było sto trzydzieści siedem."
"Wj6,17": "Synowie Gerszona: Libni i Szimei, według ich rodzin."
"Wj6,18": "Synowie Kehata: Amram, Ishar, Chebron i Uzziel. A lat życia Kehata było sto trzydzieści trzy."
"Wj6,19": "Synowie Merariego: Machli i Muszi. To są rodziny Lewiego według ich pokoleń."
"Wj6,20": "I Amram pojął za żonę Jokebed, swoją ciotkę, która urodziła mu Aarona i Mojżesza. A lat życia Amrama było sto trzydzieści siedem."
"Wj6,21": "Synowie Ishara: Korach, Nefeg i Zikri."
"Wj6,22": "Synowie Uzziela: Miszael, Elsafan i Sitri."
"Wj6,23": "I Aaron pojął za żonę Eliszebę, córkę Aminadaba, siostrę Nachszona. Ona mu urodziła Nadaba, Abihu, Eleazara i Itamara."
"Wj6,24": "A synowie Koracha: Assir, Elkana i Abiasaf. To są rodziny Korachitów."
"Wj6,25": "I Eleazar, syn Aarona, pojął za żonę jedną z córek Putiela. Ona mu urodziła Pinchasa. Oto są naczelnicy ojców Lewitów według ich rodzin."
"Wj6,26": "To są ci właśnie Aaron i Mojżesz, do których mówił PAN: Wyprowadźcie synów Izraela z ziemi Egiptu według ich zastępów."
"Wj6,27": "To oni mówili do faraona, króla Egiptu, aby wyprowadzić synów Izraela z Egiptu. To jest właśnie Mojżesz i Aaron."
"Wj6,28": "A w tym dniu, kiedy PAN mówił do Mojżesza w ziemi Egiptu;"
"Wj6,29": "PAN powiedział do niego: Ja jestem PAN. Mów do faraona, króla Egiptu, wszystko, co do ciebie mówię."
"Wj6,30": "Mojżesz zaś odpowiedział przed PANEM: Oto jestem nieobrzezanych warg, jakże posłucha mnie faraon?"
