"Wj6,1":
  text: "Wtedy PAN powiedział do Mojżesza: Teraz zobaczysz, co uczynię faraonowi. Mocną ręką bowiem wypuści ich i mocną ręką wypędzi ich ze swojej ziemi."
  tags: []
"Wj6,2":
  text: "Nadto Bóg mówił do Mojżesza: Ja jestem PANEM."
  tags: []
"Wj6,3":
  text: "Objawiłem się Abrahamowi, Izaakowi i Jakubowi pod tym imieniem: Bóg Wszechmogący, ale z mojego imienia JEHOWA nie byłem przez nich poznany."
  tags: []
"Wj6,4":
  text: "Ustanowiłem też z nimi moje przymierze, aby dać im ziemię Kanaan, ziemię ich pielgrzymowania, w której przebywali jako obcy."
  tags: []
"Wj6,5":
  text: "Usłyszałem także jęk synów Izraela, których Egipcjanie trzymają w niewoli, i wspomniałem na moje przymierze."
  tags: []
"Wj6,6":
  text: "Dlatego powiedz synom Izraela: Ja jestem PAN, wyprowadzę was spod ciężarów Egipcjan, wyrwę was z ich niewoli i wybawię was wyciągniętym ramieniem i przez wielkie sądy."
  tags: []
"Wj6,7":
  text: "Wezmę was sobie za lud i będę wam Bogiem. Poznacie, że ja jestem PAN, wasz Bóg, który was wyprowadza spod ciężarów Egipcjan."
  tags: []
"Wj6,8":
  text: "I wprowadzę was do ziemi, którą przysiągłem dać Abrahamowi, Izaakowi i Jakubowi; i dam ją wam w dziedzictwo. Ja jestem PAN."
  tags: []
"Wj6,9":
  text: "I Mojżesz mówił tak do synów Izraela, ale nie usłuchali go z powodu udręki ducha i ciężkiej niewoli."
  tags: []
"Wj6,10":
  text: "Wtedy PAN powiedział do Mojżesza:"
  tags: []
"Wj6,11":
  text: "Idź, powiedz faraonowi, królowi Egiptu, żeby wypuścił synów Izraela ze swej ziemi."
  tags: []
"Wj6,12":
  text: "Mojżesz zaś odpowiedział przed PANEM: Oto synowie Izraela nie posłuchali mnie, jakże więc posłucha mnie faraon? Jestem przecież nieobrzezanych warg."
  tags: []
"Wj6,13":
  text: "Wtedy PAN przemówił do Mojżesza i Aarona i dał im rozkaz dla synów Izraela i dla faraona, króla Egiptu, aby wyprowadzili synów Izraela z ziemi Egiptu."
  tags: []
"Wj6,14":
  text: "Oto naczelnicy domów ich ojców: synowie Rubena, pierworodnego Izraela: Henoch, Pallu, Chesron i Karmi. To są rodziny Rubena."
  tags: []
"Wj6,15":
  text: "Synowie Symeona: Jemuel, Jamin, Ohad, Jakin, Sochar i Szaul, syn Kananejki. To są rodziny Symeona."
  tags: []
"Wj6,16":
  text: "Oto imiona synów Lewiego według ich pokoleń: Gerszon, Kehat i Merari. A lat życia Lewiego było sto trzydzieści siedem."
  tags: []
"Wj6,17":
  text: "Synowie Gerszona: Libni i Szimei, według ich rodzin."
  tags: []
"Wj6,18":
  text: "Synowie Kehata: Amram, Ishar, Chebron i Uzziel. A lat życia Kehata było sto trzydzieści trzy."
  tags: []
"Wj6,19":
  text: "Synowie Merariego: Machli i Muszi. To są rodziny Lewiego według ich pokoleń."
  tags: []
"Wj6,20":
  text: "I Amram pojął za żonę Jokebed, swoją ciotkę, która urodziła mu Aarona i Mojżesza. A lat życia Amrama było sto trzydzieści siedem."
  tags: []
"Wj6,21":
  text: "Synowie Ishara: Korach, Nefeg i Zikri."
  tags: []
"Wj6,22":
  text: "Synowie Uzziela: Miszael, Elsafan i Sitri."
  tags: []
"Wj6,23":
  text: "I Aaron pojął za żonę Eliszebę, córkę Aminadaba, siostrę Nachszona. Ona mu urodziła Nadaba, Abihu, Eleazara i Itamara."
  tags: []
"Wj6,24":
  text: "A synowie Koracha: Assir, Elkana i Abiasaf. To są rodziny Korachitów."
  tags: []
"Wj6,25":
  text: "I Eleazar, syn Aarona, pojął za żonę jedną z córek Putiela. Ona mu urodziła Pinchasa. Oto są naczelnicy ojców Lewitów według ich rodzin."
  tags: []
"Wj6,26":
  text: "To są ci właśnie Aaron i Mojżesz, do których mówił PAN: Wyprowadźcie synów Izraela z ziemi Egiptu według ich zastępów."
  tags: []
"Wj6,27":
  text: "To oni mówili do faraona, króla Egiptu, aby wyprowadzić synów Izraela z Egiptu. To jest właśnie Mojżesz i Aaron."
  tags: []
"Wj6,28":
  text: "A w tym dniu, kiedy PAN mówił do Mojżesza w ziemi Egiptu;"
  tags: []
"Wj6,29":
  text: "PAN powiedział do niego: Ja jestem PAN. Mów do faraona, króla Egiptu, wszystko, co do ciebie mówię."
  tags: []
"Wj6,30":
  text: "Mojżesz zaś odpowiedział przed PANEM: Oto jestem nieobrzezanych warg, jakże posłucha mnie faraon?"
  tags: []
