"Wj39,1": "Także z błękitnej tkaniny, purpury i karmazynu zrobili szaty do służby, do posługiwania w świątyni. Zrobili też święte szaty dla Aarona, jak PAN rozkazał Mojżeszowi."
"Wj39,2": "I zrobili efod ze złota, błękitnej tkaniny, purpury, karmazynu i skręconego bisioru."
"Wj39,3": "Naklepali też złote blaszki i nacięli z nich nici do przetykania haftem błękitnej tkaniny, purpury, karmazynu i bisioru."
"Wj39,4": "Zrobili do niego naramienniki, aby się jeden z drugim mógł złączyć. Łączyły się na dwóch końcach."
"Wj39,5": "Także pas do efodu, który był na nim, z tego samego był i tak samo zrobiony: ze złota, błękitnej tkaniny, purpury, karmazynu i skręconego bisioru, jak PAN rozkazał Mojżeszowi."
"Wj39,6": "Do tego obrobili kamienie onyksu osadzone w złotych oprawkach, wyryte tak jak pieczęci bywają ryte, z imionami synów Izraela."
"Wj39,7": "I umieścili je na naramiennikach efodu, aby były kamieniami pamiątkowymi dla synów Izraela, jak PAN rozkazał Mojżeszowi."
"Wj39,8": "Zrobili też haftowany pektorał podobnie jak efod: ze złota, błękitnej tkaniny, purpury, karmazynu i skręconego bisioru."
"Wj39,9": "Był kwadratowy; zrobili podwójny pektorał, na piędź długości i na piędź szerokości, złożony we dwoje."
"Wj39,10": "I osadzili w nim cztery rzędy kamieni w tym porządku: karneol, topaz i szmaragd w pierwszym rzędzie."
"Wj39,11": "A w drugim rzędzie: karbunkuł, szafir i diament."
"Wj39,12": "A w trzecim rzędzie: hiacynt, agat i ametyst."
"Wj39,13": "A w czwartym rzędzie: beryl, onyks i jaspis, wszystkie osadzone w złotych oprawach."
"Wj39,14": "A tych kamieni z imionami synów Izraela było dwanaście, według ich imion, które ryte były jak na pieczęci; każdy według swego imienia, według dwunastu pokoleń."
"Wj39,15": "Zrobili też do pektorału łańcuszki plecione ze szczerego złota."
"Wj39,16": "Zrobili także dwie złote oprawki i dwa złote pierścienie i przyczepili te dwa pierścienie do obu rogów pektorału."
"Wj39,17": "I włożyli te dwa złote łańcuszki w oba pierścienie u rogów pektorału."
"Wj39,18": "Drugie zaś końce obu łańcuszków przymocowali do tych dwóch oprawek i przyprawili z przodu do naramienników efodu."
"Wj39,19": "Zrobili również dwa złote pierścienie, które przymocowali do dwóch rogów pektorału na jego wewnętrznym brzegu, który był od strony efodu."
"Wj39,20": "Zrobili jeszcze dwa złote pierścienie, które przyprawili na dwie strony efodu, u dołu, naprzeciwko jego spojenia, ponad pasem efodu."
"Wj39,21": "I przywiązali pektorał jego pierścieniami do pierścieni efodu sznurem błękitnym, aby był nad pasem efodu, żeby pektorał nie odstawał od efodu, jak PAN rozkazał Mojżeszowi."
"Wj39,22": "Zrobili także tkany płaszcz pod efod, cały z błękitnej tkaniny;"
"Wj39,23": "A pośrodku płaszcza otwór, jak otwór w pancerzu, i obwódkę dokoła brzegu, aby się nie rozdzierał."
"Wj39,24": "Także u dołu tego płaszcza zrobili jabłka granatu z błękitnej tkaniny, purpury, karmazynu i skręconego bisioru."
"Wj39,25": "Zrobili też dzwonki ze szczerego złota i pozawieszali te dzwonki między te jabłka granatu u dołu dokoła płaszcza, pośród jabłek granatu;"
"Wj39,26": "Dzwonek, a potem jabłko granatu i znów dzwonek, i jabłko granatu, u dołu dokoła płaszcza do usługiwania, jak PAN rozkazał Mojżeszowi."
"Wj39,27": "Zrobili też dla Aarona i jego synów szaty tkane z bisioru."
"Wj39,28": "Mitrę także z bisioru i ozdobne mitry z bisioru, i spodnie ze skręconego bisioru."
"Wj39,29": "Pas także ze skręconego bisioru, błękitnej tkaniny, purpury i karmazynu, haftowany, jak PAN rozkazał Mojżeszowi."
"Wj39,30": "Zrobili też blaszkę do świętej korony ze szczerego złota i wyryli na niej napis jak na pieczęci: Świętość PANU."
"Wj39,31": "A przymocowali do niej sznur z błękitnej tkaniny, aby była przywiązana na przodzie mitry, jak PAN rozkazał Mojżeszowi."
"Wj39,32": "I tak skończyły się wszystkie prace około przybytku, czyli Namiotu Zgromadzenia. I synowie Izraela zrobili wszystko, jak PAN rozkazał Mojżeszowi; tak zrobili."
"Wj39,33": "I przynieśli ten przybytek do Mojżesza, namiot i wszystkie naczynia do niego, jego haki, deski, drążki, słupy i podstawki;"
"Wj39,34": "Przykrycie ze skór baranich farbowanych na czerwono, przykrycie ze skór borsuczych i zasłonę do osłonięcia;"
"Wj39,35": "Arkę świadectwa i drążki do niej, i przebłagalnię;"
"Wj39,36": "Stół, wszystkie naczynia do niego i chleb pokładny;"
"Wj39,37": "Szczerozłoty świecznik, lampy do niego – lampy ustawione w porządku – i wszystkie naczynia do niego, i oliwę do świecenia;"
"Wj39,38": "Także złoty ołtarz, olejek do namaszczania, wonne kadzidło i zasłonę do wejścia do namiotu;"
"Wj39,39": "Miedziany ołtarz i do niego miedzianą kratę, drążki i wszystkie naczynia do niego, kadź i podstawę do niej."
"Wj39,40": "Zasłony do dziedzińca, słupy i podstawki do niego, zasłonę do bramy dziedzińca, sznury i kołki do niej i wszelkie naczynia do służby w przybytku, czyli do Namiotu Zgromadzenia;"
"Wj39,41": "Szaty do służby w posługiwaniu w świątyni, święte szaty dla kapłana Aarona i szaty jego synów do sprawowania urzędu kapłańskiego."
"Wj39,42": "Według wszystkiego, co PAN rozkazał Mojżeszowi, tak synowie Izraela wykonali całą tę pracę."
"Wj39,43": "I Mojżesz obejrzał tę całą robotę, a zrobili ją, jak PAN rozkazał; tak właśnie zrobili. I Mojżesz im błogosławił."
