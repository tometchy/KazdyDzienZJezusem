"Wj39,1":
  text: "Także z błękitnej tkaniny, purpury i karmazynu zrobili szaty do służby, do posługiwania w świątyni. Zrobili też święte szaty dla Aarona, jak PAN rozkazał Mojżeszowi."
  tags: []
"Wj39,2":
  text: "I zrobili efod ze złota, błękitnej tkaniny, purpury, karmazynu i skręconego bisioru."
  tags: []
"Wj39,3":
  text: "Naklepali też złote blaszki i nacięli z nich nici do przetykania haftem błękitnej tkaniny, purpury, karmazynu i bisioru."
  tags: []
"Wj39,4":
  text: "Zrobili do niego naramienniki, aby się jeden z drugim mógł złączyć. Łączyły się na dwóch końcach."
  tags: []
"Wj39,5":
  text: "Także pas do efodu, który był na nim, z tego samego był i tak samo zrobiony: ze złota, błękitnej tkaniny, purpury, karmazynu i skręconego bisioru, jak PAN rozkazał Mojżeszowi."
  tags: []
"Wj39,6":
  text: "Do tego obrobili kamienie onyksu osadzone w złotych oprawkach, wyryte tak jak pieczęci bywają ryte, z imionami synów Izraela."
  tags: []
"Wj39,7":
  text: "I umieścili je na naramiennikach efodu, aby były kamieniami pamiątkowymi dla synów Izraela, jak PAN rozkazał Mojżeszowi."
  tags: []
"Wj39,8":
  text: "Zrobili też haftowany pektorał podobnie jak efod: ze złota, błękitnej tkaniny, purpury, karmazynu i skręconego bisioru."
  tags: []
"Wj39,9":
  text: "Był kwadratowy; zrobili podwójny pektorał, na piędź długości i na piędź szerokości, złożony we dwoje."
  tags: []
"Wj39,10":
  text: "I osadzili w nim cztery rzędy kamieni w tym porządku: karneol, topaz i szmaragd w pierwszym rzędzie."
  tags: []
"Wj39,11":
  text: "A w drugim rzędzie: karbunkuł, szafir i diament."
  tags: []
"Wj39,12":
  text: "A w trzecim rzędzie: hiacynt, agat i ametyst."
  tags: []
"Wj39,13":
  text: "A w czwartym rzędzie: beryl, onyks i jaspis, wszystkie osadzone w złotych oprawach."
  tags: []
"Wj39,14":
  text: "A tych kamieni z imionami synów Izraela było dwanaście, według ich imion, które ryte były jak na pieczęci; każdy według swego imienia, według dwunastu pokoleń."
  tags: []
"Wj39,15":
  text: "Zrobili też do pektorału łańcuszki plecione ze szczerego złota."
  tags: []
"Wj39,16":
  text: "Zrobili także dwie złote oprawki i dwa złote pierścienie i przyczepili te dwa pierścienie do obu rogów pektorału."
  tags: []
"Wj39,17":
  text: "I włożyli te dwa złote łańcuszki w oba pierścienie u rogów pektorału."
  tags: []
"Wj39,18":
  text: "Drugie zaś końce obu łańcuszków przymocowali do tych dwóch oprawek i przyprawili z przodu do naramienników efodu."
  tags: []
"Wj39,19":
  text: "Zrobili również dwa złote pierścienie, które przymocowali do dwóch rogów pektorału na jego wewnętrznym brzegu, który był od strony efodu."
  tags: []
"Wj39,20":
  text: "Zrobili jeszcze dwa złote pierścienie, które przyprawili na dwie strony efodu, u dołu, naprzeciwko jego spojenia, ponad pasem efodu."
  tags: []
"Wj39,21":
  text: "I przywiązali pektorał jego pierścieniami do pierścieni efodu sznurem błękitnym, aby był nad pasem efodu, żeby pektorał nie odstawał od efodu, jak PAN rozkazał Mojżeszowi."
  tags: []
"Wj39,22":
  text: "Zrobili także tkany płaszcz pod efod, cały z błękitnej tkaniny;"
  tags: []
"Wj39,23":
  text: "A pośrodku płaszcza otwór, jak otwór w pancerzu, i obwódkę dokoła brzegu, aby się nie rozdzierał."
  tags: []
"Wj39,24":
  text: "Także u dołu tego płaszcza zrobili jabłka granatu z błękitnej tkaniny, purpury, karmazynu i skręconego bisioru."
  tags: []
"Wj39,25":
  text: "Zrobili też dzwonki ze szczerego złota i pozawieszali te dzwonki między te jabłka granatu u dołu dokoła płaszcza, pośród jabłek granatu;"
  tags: []
"Wj39,26":
  text: "Dzwonek, a potem jabłko granatu i znów dzwonek, i jabłko granatu, u dołu dokoła płaszcza do usługiwania, jak PAN rozkazał Mojżeszowi."
  tags: []
"Wj39,27":
  text: "Zrobili też dla Aarona i jego synów szaty tkane z bisioru."
  tags: []
"Wj39,28":
  text: "Mitrę także z bisioru i ozdobne mitry z bisioru, i spodnie ze skręconego bisioru."
  tags: []
"Wj39,29":
  text: "Pas także ze skręconego bisioru, błękitnej tkaniny, purpury i karmazynu, haftowany, jak PAN rozkazał Mojżeszowi."
  tags: []
"Wj39,30":
  text: "Zrobili też blaszkę do świętej korony ze szczerego złota i wyryli na niej napis jak na pieczęci: Świętość PANU."
  tags: []
"Wj39,31":
  text: "A przymocowali do niej sznur z błękitnej tkaniny, aby była przywiązana na przodzie mitry, jak PAN rozkazał Mojżeszowi."
  tags: []
"Wj39,32":
  text: "I tak skończyły się wszystkie prace około przybytku, czyli Namiotu Zgromadzenia. I synowie Izraela zrobili wszystko, jak PAN rozkazał Mojżeszowi; tak zrobili."
  tags: []
"Wj39,33":
  text: "I przynieśli ten przybytek do Mojżesza, namiot i wszystkie naczynia do niego, jego haki, deski, drążki, słupy i podstawki;"
  tags: []
"Wj39,34":
  text: "Przykrycie ze skór baranich farbowanych na czerwono, przykrycie ze skór borsuczych i zasłonę do osłonięcia;"
  tags: []
"Wj39,35":
  text: "Arkę świadectwa i drążki do niej, i przebłagalnię;"
  tags: []
"Wj39,36":
  text: "Stół, wszystkie naczynia do niego i chleb pokładny;"
  tags: []
"Wj39,37":
  text: "Szczerozłoty świecznik, lampy do niego – lampy ustawione w porządku – i wszystkie naczynia do niego, i oliwę do świecenia;"
  tags: []
"Wj39,38":
  text: "Także złoty ołtarz, olejek do namaszczania, wonne kadzidło i zasłonę do wejścia do namiotu;"
  tags: []
"Wj39,39":
  text: "Miedziany ołtarz i do niego miedzianą kratę, drążki i wszystkie naczynia do niego, kadź i podstawę do niej."
  tags: []
"Wj39,40":
  text: "Zasłony do dziedzińca, słupy i podstawki do niego, zasłonę do bramy dziedzińca, sznury i kołki do niej i wszelkie naczynia do służby w przybytku, czyli do Namiotu Zgromadzenia;"
  tags: []
"Wj39,41":
  text: "Szaty do służby w posługiwaniu w świątyni, święte szaty dla kapłana Aarona i szaty jego synów do sprawowania urzędu kapłańskiego."
  tags: []
"Wj39,42":
  text: "Według wszystkiego, co PAN rozkazał Mojżeszowi, tak synowie Izraela wykonali całą tę pracę."
  tags: []
"Wj39,43":
  text: "I Mojżesz obejrzał tę całą robotę, a zrobili ją, jak PAN rozkazał; tak właśnie zrobili. I Mojżesz im błogosławił."
  tags: []
