"Wj1,1":
  text: "Oto imiona synów Izraela, którzy przybyli z Jakubem do Egiptu; każdy przybył ze swoją rodziną:"
  tags: []
"Wj1,2":
  text: "Ruben, Symeon, Lewi i Juda;"
  tags: []
"Wj1,3":
  text: "Issachar, Zebulon i Beniamin;"
  tags: []
"Wj1,4":
  text: "Dan, Neftali, Gad i Aszer."
  tags: []
"Wj1,5":
  text: "A wszystkich dusz, które wyszły z bioder Jakuba, było siedemdziesiąt. Józef zaś już był w Egipcie."
  tags: []
"Wj1,6":
  text: "Potem umarli Józef, wszyscy jego bracia i całe to pokolenie."
  tags: []
"Wj1,7":
  text: "A synowie Izraela byli płodni, rozrodzili się, rozmnożyli i bardzo umacniali, a ziemia była ich pełna."
  tags: []
"Wj1,8":
  text: "Wówczas nastał nad Egiptem nowy król, który nie znał Józefa."
  tags: []
"Wj1,9":
  text: "I powiedział do swego ludu: Oto lud synów Izraela stał się liczniejszy i potężniejszy od nas."
  tags: []
"Wj1,10":
  text: "Postąpmy więc z nimi mądrze, by się nie rozmnożyli, bo gdyby przyszła wojna, mogliby przyłączyć się do naszych wrogów i walczyć przeciwko nam, i opuścić ziemię."
  tags: []
"Wj1,11":
  text: "Ustanowiono więc nad nimi nadzorców, aby ich gnębili ciężarami. I lud Izraela zbudował dla faraona miasta na składy: Pitom i Ramzes."
  tags: []
"Wj1,12":
  text: "Ale im bardziej ich gnębili, tym bardziej się rozmnażali i rośli, tak że zatrwożyli się z powodu synów Izraela."
  tags: []
"Wj1,13":
  text: "I Egipcjanie zmuszali synów Izraela do ciężkiej pracy."
  tags: []
"Wj1,14":
  text: "I uprzykrzali im życie uciążliwą pracą przy glinie i przy cegłach, i przy każdej robocie na polu. Do wszelkiej pracy zmuszali ich bez litości."
  tags: []
"Wj1,15":
  text: "I król Egiptu rozkazał hebrajskim położnym, z których jedna miała na imię Szifra, a druga Pua;"
  tags: []
"Wj1,16":
  text: "Powiedział: Gdy będziecie przy porodach hebrajskich kobiet i zobaczycie, że urodził się syn, zabijcie go, a jeśli córka, niech zostanie przy życiu."
  tags: []
"Wj1,17":
  text: "Lecz położne bały się Boga i nie robiły tak, jak im rozkazał król Egiptu, ale pozostawiały chłopców przy życiu."
  tags: []
"Wj1,18":
  text: "Wtedy król Egiptu wezwał położne i powiedział do nich: Dlaczego tak postąpiłyście, że pozostawiłyście chłopców przy życiu?"
  tags: []
"Wj1,19":
  text: "Położne odpowiedziały faraonowi: Hebrajskie kobiety nie są takie jak egipskie kobiety. Są bowiem żywotne, rodzą wcześniej, zanim przyjdzie do nich położna."
  tags: []
"Wj1,20":
  text: "I Bóg dobrze czynił tym położnym, a lud się mnożył i bardzo się wzmocnił."
  tags: []
"Wj1,21":
  text: "A ponieważ położne bały się Boga, zbudował im domy."
  tags: []
"Wj1,22":
  text: "Wtedy faraon rozkazał całemu swemu ludowi: Każdego syna, który się urodzi, wrzućcie do rzeki, a każdą córkę pozostawcie przy życiu."
  tags: []
