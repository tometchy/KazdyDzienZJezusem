"Wj12,1":
  text: "PAN powiedział jeszcze do Mojżesza i Aarona w ziemi Egiptu:"
  tags: []
"Wj12,2":
  text: "Ten miesiąc będzie dla was początkiem miesięcy, będzie dla was pierwszym miesiącem roku."
  tags: []
"Wj12,3":
  text: "Powiedzcie całemu zgromadzeniu Izraela: Dziesiątego dnia tego miesiąca każdy weźmie sobie baranka dla rodziny, jednego baranka dla domu."
  tags: []
"Wj12,4":
  text: "A jeśli rodzina jest zbyt mała, aby zjeść baranka, niech dobierze go razem z sąsiadem, który jest najbliższy jej domu, według liczby dusz, naliczywszy tyle osób, ile mogłoby zjeść baranka."
  tags: []
"Wj12,5":
  text: "Wasz baranek ma być bez skazy, jednoroczny samiec. Weźmiecie go spośród owiec albo kóz."
  tags: []
"Wj12,6":
  text: "Będziecie go strzegli aż do czternastego dnia tego miesiąca, a wtedy całe zgromadzenie Izraela zabije go pod wieczór."
  tags: []
"Wj12,7":
  text: "Potem wezmą z jego krwi i pokropią oba węgary i nadproże domu, w którym będą go spożywać."
  tags: []
"Wj12,8":
  text: "I będą jeść tej nocy mięso pieczone przy ogniu i przaśny chleb; będą je jeść z gorzkimi ziołami."
  tags: []
"Wj12,9":
  text: "Nie jedzcie z niego nic surowego ani ugotowanego w wodzie, lecz tylko upieczone przy ogniu, z jego głową, nogami i wnętrznościami."
  tags: []
"Wj12,10":
  text: "Nie zostawicie z niego niczego do rana; a jeśliby coś z niego zostało do rana, spalicie to w ogniu."
  tags: []
"Wj12,11":
  text: "Tak oto będziecie go spożywać: Wasze biodra będą przepasane, obuwie na waszych nogach i laska w waszym ręku. Będziecie go jeść pośpiesznie. To Pascha PANA."
  tags: []
"Wj12,12":
  text: "Gdyż tej nocy przejdę przez ziemię Egiptu i zabiję wszystko, co pierworodne w ziemi Egiptu, od człowieka aż do zwierzęcia, a nad wszystkimi bogami Egiptu dokonam sądu, ja, PAN."
  tags: []
"Wj12,13":
  text: "A ta krew będzie dla was znakiem na domach, w których będziecie. Gdy bowiem ujrzę krew, ominę was i nie dotknie was plaga zniszczenia, gdy będę zabijał w ziemi Egiptu."
  tags: []
"Wj12,14":
  text: "Ten dzień będzie dla was pamiątką i będziecie go obchodzić jako święto dla PANA po wszystkie pokolenia. Będziecie go obchodzić jako ustawę wieczną."
  tags: []
"Wj12,15":
  text: "Przez siedem dni będziecie jeść przaśny chleb. Już w pierwszym dniu usuniecie zakwas z waszych domów, bo ktokolwiek będzie jadł coś kwaszonego, od pierwszego dnia aż do siódmego, ta dusza zostanie wykluczona z Izraela."
  tags: []
"Wj12,16":
  text: "W tym pierwszym dniu będzie święte zgromadzenie, także siódmego dnia będziecie mieć święte zgromadzenie. W tych dniach nie będziecie wykonywać żadnej pracy. Będzie wam tylko wolno przygotować to, czego każdy potrzebuje do jedzenia."
  tags: []
"Wj12,17":
  text: "I będziecie obchodzić Święto Przaśników, bo w tym właśnie dniu wyprowadziłem wasze zastępy z ziemi Egiptu. Dlatego będziecie obchodzić ten dzień po wszystkie pokolenia jako ustawę wieczną."
  tags: []
"Wj12,18":
  text: "W pierwszym miesiącu, od wieczora czternastego dnia tego miesiąca do wieczora dnia dwudziestego pierwszego tego miesiąca, będziecie jeść przaśny chleb."
  tags: []
"Wj12,19":
  text: "Przez siedem dni nie znajdzie się żaden zakwas w waszych domach. Ktokolwiek bowiem będzie jadł coś kwaszonego, ta dusza zostanie wykluczona ze zgromadzenia Izraela, zarówno przybysz, jak i urodzony w tej ziemi."
  tags: []
"Wj12,20":
  text: "Nie będziecie jeść nic kwaszonego; we wszystkich waszych domach będziecie jeść przaśne chleby."
  tags: []
"Wj12,21":
  text: "Wtedy Mojżesz wezwał wszystkich starszych Izraela i powiedział im: Wybierzcie i weźcie sobie baranka dla swych rodzin i zabijcie go jako paschę."
  tags: []
"Wj12,22":
  text: "Weźmiecie też wiązkę hizopu i zanurzycie we krwi, która jest w misie, i pokropicie nadproże i oba węgary tą krwią, która jest w misie. Niech nikt z was nie wychodzi za drzwi swego domu aż do rana."
  tags: []
"Wj12,23":
  text: "PAN bowiem przejdzie, aby zabijać Egipcjan, a gdy ujrzy krew na nadprożu i na obu węgarach, PAN ominie drzwi i nie pozwoli niszczycielowi wejść do waszych domów, aby was zabić."
  tags: []
"Wj12,24":
  text: "Będziecie przestrzegać tego jako ustawy dla ciebie i twoich synów aż na wieki."
  tags: []
"Wj12,25":
  text: "Kiedy wejdziecie do ziemi, którą da wam PAN, jak to obiecał, będziecie przestrzegać tego obrzędu."
  tags: []
"Wj12,26":
  text: "A gdy wasi synowie zapytają was: Co oznacza ten wasz obrzęd?"
  tags: []
"Wj12,27":
  text: "Wtedy odpowiecie: To ofiara paschy PANA, który ominął domy synów Izraela w Egipcie, gdy zabijał Egipcjan, a nasze domy ocalił. Potem lud schylił się i oddał pokłon."
  tags: []
"Wj12,28":
  text: "I synowie Izraela odeszli, i uczynili, jak PAN rozkazał Mojżeszowi i Aaronowi, tak właśnie zrobili."
  tags: []
"Wj12,29":
  text: "A o północy PAN zabił wszystko, co pierworodne w ziemi Egiptu, od pierworodnego syna faraona, zasiadającego na jego tronie, aż do pierworodnego więźnia, który był w więzieniu, oraz wszystko, co pierworodne z bydła."
  tags: []
"Wj12,30":
  text: "Wstał tej nocy faraon, a z nim wszyscy jego słudzy oraz wszyscy Egipcjanie; i podniósł się w Egipcie wielki krzyk, bo nie było domu, w którym nie byłoby umarłego."
  tags: []
"Wj12,31":
  text: "Faraon wezwał Mojżesza i Aarona w nocy i powiedział: Wstańcie, wyjdźcie spośród mego ludu, wy i synowie Izraela. Idźcie i służcie PANU, jak mówiliście."
  tags: []
"Wj12,32":
  text: "Zabierzcie też swoje trzody i bydła, jak żądaliście, i idźcie. Mnie też błogosławcie."
  tags: []
"Wj12,33":
  text: "I Egipcjanie przynaglali lud, aby ich jak najszybciej wyprawić z ziemi, bo mówili: Wszyscy pomrzemy."
  tags: []
"Wj12,34":
  text: "Wziął więc lud swoje ciasto, zanim się zakwasiło, i dzieże owinięte w swoje szaty i kładli je na swoje ramiona."
  tags: []
"Wj12,35":
  text: "Synowie Izraela postąpili według nakazu Mojżesza i pożyczyli od Egipcjan srebrne i złote przedmioty oraz szaty."
  tags: []
"Wj12,36":
  text: "A PAN dał ludowi łaskę w oczach Egipcjan, tak że im pożyczyli. I złupili Egipcjan."
  tags: []
"Wj12,37":
  text: "Wyruszyli więc synowie Izraela z Ramzes do Sukkot, około sześciuset tysięcy pieszych mężczyzn, nie licząc dzieci."
  tags: []
"Wj12,38":
  text: "Ale szło z nimi też mnóstwo obcego ludu oraz owce i bydło, bardzo liczny dobytek."
  tags: []
"Wj12,39":
  text: "I popiekli przaśne placki z ciasta, które wynieśli z Egiptu, bo nie było zakwaszone. Ponieważ zostali wygnani z Egiptu, nie mogli zwlekać i nie przygotowali sobie też żadnej żywności."
  tags: []
"Wj12,40":
  text: "A czas przebywania synów Izraela, którzy mieszkali w Egipcie, wynosił czterysta trzydzieści lat."
  tags: []
"Wj12,41":
  text: "I stało się tak, że po upływie czterystu trzydziestu lat, tego samego dnia, wszystkie zastępy PANA wyszły z ziemi Egiptu."
  tags: []
"Wj12,42":
  text: "Ta noc ma być obchodzona dla PANA, dlatego że wyprowadził ich z ziemi Egiptu. Ta noc ma być więc obchodzona dla PANA przez wszystkich synów Izraela po wszystkie ich pokolenia."
  tags: []
"Wj12,43":
  text: "I PAN powiedział do Mojżesza i Aarona: Taka jest ustawa Paschy: Żaden obcy nie będzie z niej spożywał."
  tags: []
"Wj12,44":
  text: "Każdy jednak wasz sługa nabyty za pieniądze będzie mógł z niej spożywać, jeśli tylko go obrzezacie."
  tags: []
"Wj12,45":
  text: "Cudzoziemiec i najemnik nie będą z niej spożywać."
  tags: []
"Wj12,46":
  text: "W jednym domu będzie spożywany baranek. Nie wyniesiesz z domu nic z jego mięsa i nie złamiecie jego kości."
  tags: []
"Wj12,47":
  text: "Całe zgromadzenie Izraela tak z nim postąpi."
  tags: []
"Wj12,48":
  text: "A jeśli jakiś cudzoziemiec będzie twoim gościem i będzie chciał obchodzić Paschę dla PANA, niech najpierw zostanie obrzezany każdy mężczyzna jego domu, a potem niech przystąpi i obchodzi ją. Wtedy będzie jak urodzony w tej ziemi. A ktokolwiek nie jest obrzezany, nie będzie z niej spożywał."
  tags: []
"Wj12,49":
  text: "Jedno prawo będzie dla urodzonego w ziemi i dla cudzoziemca, który jest gościem wśród was."
  tags: []
"Wj12,50":
  text: "Wszyscy synowie Izraela uczynili więc, jak PAN rozkazał Mojżeszowi i Aaronowi, tak właśnie uczynili."
  tags: []
"Wj12,51":
  text: "Tego samego dnia PAN wyprowadził synów Izraela z ziemi Egiptu według ich zastępów."
  tags: []
