"Wj8,1":
  text: "Potem PAN powiedział do Mojżesza: Idź do faraona i powiedz mu: Tak mówi PAN: Wypuść mój lud, aby mi służył."
  tags: []
"Wj8,2":
  text: "A jeśli będziesz się wzbraniał wypuścić go, oto dotknę żabami wszystkich twoich granic."
  tags: []
"Wj8,3":
  text: "Rzeka zaroi się od żab, które wypełzną i wedrą się do twego domu, do twej sypialni, na twoje łoże, do domu twoich sług, między twój lud, do twoich pieców i w twoje dzieże."
  tags: []
"Wj8,4":
  text: "Żaby wpełzną zarówno na ciebie, jak i na twój lud i na wszystkie twoje sługi."
  tags: []
"Wj8,5":
  text: "PAN dalej mówił do Mojżesza: Powiedz Aaronowi: Wyciągnij rękę ze swą laską nad rzeki, nad strugi i nad jeziora i sprowadź żaby na ziemię Egiptu."
  tags: []
"Wj8,6":
  text: "Aaron wyciągnął więc rękę nad wody Egiptu, a żaby wypełzły i pokryły ziemię Egiptu."
  tags: []
"Wj8,7":
  text: "Lecz czarownicy uczynili to samo swoimi czarami i sprowadzili żaby na ziemię Egiptu."
  tags: []
"Wj8,8":
  text: "Potem faraon wezwał Mojżesza i Aarona i powiedział: Módlcie się do PANA, aby oddalił żaby ode mnie i od mojego ludu, a wypuszczę lud, aby złożył ofiarę PANU."
  tags: []
"Wj8,9":
  text: "Mojżesz odpowiedział faraonowi: Dam ci ten zaszczyt. Powiedz, kiedy mam się modlić za ciebie, za twoje sługi i za twój lud, aby wyginęły żaby u ciebie i w twoich domach, a zostały tylko te w rzece."
  tags: []
"Wj8,10":
  text: "A on powiedział: Jutro. Wtedy Mojżesz odpowiedział: Stanie się według twego słowa, abyś wiedział, że nie ma nikogo jak PAN, nasz Bóg."
  tags: []
"Wj8,11":
  text: "Żaby odejdą od ciebie, z twoich domów, od twoich sług i twego ludu, zostaną tylko w rzece."
  tags: []
"Wj8,12":
  text: "Wtedy Mojżesz i Aaron wyszli od faraona. I Mojżesz zawołał do PANA z powodu żab, które zesłał na faraona."
  tags: []
"Wj8,13":
  text: "I PAN uczynił według słowa Mojżesza, że żaby wyginęły z domów, ze wsi i z pól."
  tags: []
"Wj8,14":
  text: "Zbierano je na stosy i ziemia zaczęła cuchnąć."
  tags: []
"Wj8,15":
  text: "Gdy faraon zauważył, że nadeszło wytchnienie, zatwardził swoje serce i nie posłuchał ich, jak PAN zapowiedział."
  tags: []
"Wj8,16":
  text: "I PAN powiedział do Mojżesza: Powiedz Aaronowi: Wyciągnij swoją laskę i uderz pył ziemi, aby zamienił się we wszy na całej ziemi Egiptu."
  tags: []
"Wj8,17":
  text: "I tak uczynili. Aaron wyciągnął rękę ze swoją laską i uderzył pył ziemi, który zamienił się we wszy na ludziach i na bydle. Wszelki pył ziemi zamienił się we wszy na całej ziemi Egiptu."
  tags: []
"Wj8,18":
  text: "Czarownicy czynili to samo swoimi czarami, aby sprowadzić wszy, ale nie mogli. I wszy były na ludziach i na bydle."
  tags: []
"Wj8,19":
  text: "Wtedy czarownicy powiedzieli do faraona: To jest palec Boży. Ale serce faraona pozostało zatwardziałe i nie posłuchał ich, jak PAN zapowiedział."
  tags: []
"Wj8,20":
  text: "I PAN powiedział do Mojżesza: Wstań rano i stań przed faraonem, kiedy wyjdzie nad wodę, i powiedz mu: Tak mówi PAN: Wypuść mój lud, aby mi służył;"
  tags: []
"Wj8,21":
  text: "Bo jeśli nie wypuścisz mego ludu, ześlę rozmaite muchy na ciebie, na twe sługi, na twój lud i na twoje domy. I domy Egipcjan, a także ziemia, na której są, będą pełne rozmaitych much."
  tags: []
"Wj8,22":
  text: "W owym dniu oddzielę ziemię Goszen, w której mieszka mój lud, aby tam nie było rozmaitych much. I poznasz, że ja jestem PAN pośrodku ziemi."
  tags: []
"Wj8,23":
  text: "Oddzielę znakiem odkupienia mój lud od twojego ludu. Jutro ten znak nastąpi."
  tags: []
"Wj8,24":
  text: "I PAN tak uczynił. Rozmaite uciążliwe muchy naszły dom faraona, domy jego sług i całą ziemię Egiptu. I ziemia została zniszczona przez rozmaite muchy."
  tags: []
"Wj8,25":
  text: "Faraon wezwał wówczas Mojżesza i Aarona i powiedział: Idźcie, złóżcie na tej ziemi ofiarę waszemu Bogu."
  tags: []
"Wj8,26":
  text: "Mojżesz odpowiedział: Nie godzi się tak czynić; bo to, co złożylibyśmy w ofierze PANU, naszemu Bogu, byłoby zgorszeniem dla Egipcjan. A gdybyśmy na oczach Egipcjan złożyli w ofierze to, co jest zgorszeniem, czyż nie ukamienowaliby nas?"
  tags: []
"Wj8,27":
  text: "Pójdziemy w trzy dni drogi na pustynię i złożymy ofiarę PANU, naszemu Bogu, jak nam rozkaże."
  tags: []
"Wj8,28":
  text: "Faraon odpowiedział: Wypuszczę was, abyście mogli złożyć ofiarę PANU, waszemu Bogu, na pustyni, tylko nie oddalajcie się zbytnio. Wstawcie się też za mną."
  tags: []
"Wj8,29":
  text: "Mojżesz powiedział: Wychodzę od ciebie i wstawię się za tobą u PANA, aby rozmaite muchy odeszły jutro od faraona, od jego sług i od jego ludu. Tylko niech faraon już więcej nie oszukuje, nie chcąc wypuścić ludu, by złożył ofiarę PANU."
  tags: []
"Wj8,30":
  text: "Mojżesz wyszedł więc od faraona i wstawił się u PANA."
  tags: []
"Wj8,31":
  text: "I PAN uczynił według słowa Mojżesza, i oddalił rozmaite muchy od faraona, od jego sług i od jego ludu. Nie została ani jedna."
  tags: []
"Wj8,32":
  text: "Jednak faraon i tym razem zatwardził swe serce i nie wypuścił ludu."
  tags: []
