"Wj24,1":
  text: "I powiedział do Mojżesza: Wstąpcie do PANA ty i Aaron, Nadab i Abihu oraz siedemdziesięciu ze starszych Izraela i oddajcie pokłon z daleka."
  tags: []
"Wj24,2":
  text: "Tylko sam Mojżesz zbliży się do PANA. Oni zaś nie zbliżą się ani lud nie wstąpi z nim."
  tags: []
"Wj24,3":
  text: "Mojżesz przyszedł więc i opowiedział ludowi wszystkie słowa PANA i wszystkie prawa. I cały lud odpowiedział jednym głosem: Wypełnimy wszystkie słowa, które PAN powiedział."
  tags: []
"Wj24,4":
  text: "Wtedy Mojżesz spisał wszystkie słowa PANA. A kiedy rano wstał, zbudował ołtarz u stóp góry i ustawił dwanaście słupów, według liczby dwunastu pokoleń Izraela."
  tags: []
"Wj24,5":
  text: "I posłał młodzieńców z synów Izraela, i ci ofiarowali całopalenia, i złożyli PANU cielce jako ofiary pojednawcze."
  tags: []
"Wj24,6":
  text: "Potem Mojżesz wziął połowę krwi i wlał do czaszy, a drugą połową pokropił ołtarz."
  tags: []
"Wj24,7":
  text: "Następnie wziął księgę przymierza i czytał ludowi, a oni powiedzieli: Wypełnimy wszystko, co PAN mówił, i będziemy posłuszni."
  tags: []
"Wj24,8":
  text: "Mojżesz wziął też krew i pokropił lud, mówiąc: Oto krew przymierza, które PAN zawarł z wami, według wszystkich tych słów."
  tags: []
"Wj24,9":
  text: "I wstąpili Mojżesz, Aaron, Nadab i Abihu oraz siedemdziesięciu ze starszych Izraela;"
  tags: []
"Wj24,10":
  text: "I widzieli Boga Izraela, a pod jego nogami było jakby dzieło z szafirowego kamienia jak niebo, gdy jest jasne."
  tags: []
"Wj24,11":
  text: "A na przywódców synów Izraela PAN nie wyciągnął swej ręki, choć widzieli Boga, jedli i pili."
  tags: []
"Wj24,12":
  text: "Wtedy PAN powiedział do Mojżesza: Wstąp do mnie na górę i bądź tam, a dam ci kamienne tablice, prawo i przykazania, które napisałem, abyś ich nauczał."
  tags: []
"Wj24,13":
  text: "Mojżesz wstał więc wraz z Jozuem, swoim sługą; i Mojżesz wstąpił na górę Boga."
  tags: []
"Wj24,14":
  text: "A do starszych powiedział: Zostańcie tu, aż wrócimy do was. A oto Aaron i Chur będą z wami. Kto by miał jakąś sprawę, niech idzie do nich."
  tags: []
"Wj24,15":
  text: "Wtedy Mojżesz wstąpił na górę, a obłok zakrył górę."
  tags: []
"Wj24,16":
  text: "I chwała PANA spoczęła na górze Synaj, a obłok okrywał ją przez sześć dni. W siódmym dniu PAN zawołał na Mojżesza spośród obłoku."
  tags: []
"Wj24,17":
  text: "A wygląd chwały PANA w oczach synów Izraela był jak ogień pożerający na szczycie góry."
  tags: []
"Wj24,18":
  text: "I Mojżesz wszedł w środek obłoku, i wstąpił na górę. A był Mojżesz na górze czterdzieści dni i czterdzieści nocy."
  tags: []
