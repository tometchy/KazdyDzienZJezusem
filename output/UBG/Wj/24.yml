"Wj24,1": "I powiedział do Mojżesza: Wstąpcie do PANA ty i Aaron, Nadab i Abihu oraz siedemdziesięciu ze starszych Izraela i oddajcie pokłon z daleka."
"Wj24,2": "Tylko sam Mojżesz zbliży się do PANA. Oni zaś nie zbliżą się ani lud nie wstąpi z nim."
"Wj24,3": "Mojżesz przyszedł więc i opowiedział ludowi wszystkie słowa PANA i wszystkie prawa. I cały lud odpowiedział jednym głosem: Wypełnimy wszystkie słowa, które PAN powiedział."
"Wj24,4": "Wtedy Mojżesz spisał wszystkie słowa PANA. A kiedy rano wstał, zbudował ołtarz u stóp góry i ustawił dwanaście słupów, według liczby dwunastu pokoleń Izraela."
"Wj24,5": "I posłał młodzieńców z synów Izraela, i ci ofiarowali całopalenia, i złożyli PANU cielce jako ofiary pojednawcze."
"Wj24,6": "Potem Mojżesz wziął połowę krwi i wlał do czaszy, a drugą połową pokropił ołtarz."
"Wj24,7": "Następnie wziął księgę przymierza i czytał ludowi, a oni powiedzieli: Wypełnimy wszystko, co PAN mówił, i będziemy posłuszni."
"Wj24,8": "Mojżesz wziął też krew i pokropił lud, mówiąc: Oto krew przymierza, które PAN zawarł z wami, według wszystkich tych słów."
"Wj24,9": "I wstąpili Mojżesz, Aaron, Nadab i Abihu oraz siedemdziesięciu ze starszych Izraela;"
"Wj24,10": "I widzieli Boga Izraela, a pod jego nogami było jakby dzieło z szafirowego kamienia jak niebo, gdy jest jasne."
"Wj24,11": "A na przywódców synów Izraela PAN nie wyciągnął swej ręki, choć widzieli Boga, jedli i pili."
"Wj24,12": "Wtedy PAN powiedział do Mojżesza: Wstąp do mnie na górę i bądź tam, a dam ci kamienne tablice, prawo i przykazania, które napisałem, abyś ich nauczał."
"Wj24,13": "Mojżesz wstał więc wraz z Jozuem, swoim sługą; i Mojżesz wstąpił na górę Boga."
"Wj24,14": "A do starszych powiedział: Zostańcie tu, aż wrócimy do was. A oto Aaron i Chur będą z wami. Kto by miał jakąś sprawę, niech idzie do nich."
"Wj24,15": "Wtedy Mojżesz wstąpił na górę, a obłok zakrył górę."
"Wj24,16": "I chwała PANA spoczęła na górze Synaj, a obłok okrywał ją przez sześć dni. W siódmym dniu PAN zawołał na Mojżesza spośród obłoku."
"Wj24,17": "A wygląd chwały PANA w oczach synów Izraela był jak ogień pożerający na szczycie góry."
"Wj24,18": "I Mojżesz wszedł w środek obłoku, i wstąpił na górę. A był Mojżesz na górze czterdzieści dni i czterdzieści nocy."
