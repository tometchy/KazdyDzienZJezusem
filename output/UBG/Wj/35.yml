"Wj35,1":
  text: "Potem Mojżesz zebrał całe zgromadzenie synów Izraela i mówił do nich: Oto są słowa, które PAN rozkazał, abyście je wypełnili."
  tags: []
"Wj35,2":
  text: "Przez sześć dni będzie wykonywana praca, ale siódmy dzień będzie dla was świętem, szabatem odpoczynku dla PANA. Kto w nim wykona pracę, poniesie śmierć."
  tags: []
"Wj35,3":
  text: "Nie rozniecicie ognia w żadnym z waszych mieszkań w dzień szabatu."
  tags: []
"Wj35,4":
  text: "Mojżesz powiedział też do całego zgromadzenia synów Izraela: Oto słowo, które PAN przykazał:"
  tags: []
"Wj35,5":
  text: "Złóżcie PANU dar od siebie: każdy, kto jest ochotnego serca, niech przyniesie PANU dar: złoto, srebro i miedź;"
  tags: []
"Wj35,6":
  text: "Błękitną tkaninę, purpurę, karmazyn, bisior i kozią sierść;"
  tags: []
"Wj35,7":
  text: "I skóry baranie farbowane na czerwono i skóry borsucze, i drewno akacjowe;"
  tags: []
"Wj35,8":
  text: "Oliwę do oświetlenia, wonności na olejek do namaszczania i na wonne kadzidło;"
  tags: []
"Wj35,9":
  text: "Kamienie onyksu i kamienie do osadzenia efodu i pektorału."
  tags: []
"Wj35,10":
  text: "A wszyscy spośród was, którzy są uzdolnieni, przyjdą i będą robić wszystko, co PAN rozkazał:"
  tags: []
"Wj35,11":
  text: "Przybytek, jego namiot i przykrycie, haczyki do niego i deski, drążki do niego, słupy i podstawki;"
  tags: []
"Wj35,12":
  text: "Arkę i drążki do niej, przebłagalnię i zasłonę do osłonięcia;"
  tags: []
"Wj35,13":
  text: "Stół i drążki do niego, wszystkie jego naczynia i chleby pokładne;"
  tags: []
"Wj35,14":
  text: "Świecznik do oświetlenia i jego przybory, lampy do niego i oliwę do świecenia."
  tags: []
"Wj35,15":
  text: "Także ołtarz kadzenia z drążkami do niego, olejek do namaszczania, wonne kadzidło i zasłonę do wejścia do przybytku;"
  tags: []
"Wj35,16":
  text: "Ołtarz całopalenia, miedzianą kratę do niego, drążki i wszystkie naczynia do niego, kadź i jej podstawę;"
  tags: []
"Wj35,17":
  text: "Zasłony do dziedzińca, słupy i podstawki do nich, zasłonę do wejścia na dziedziniec."
  tags: []
"Wj35,18":
  text: "Kołki do przybytku i kołki do dziedzińca z ich sznurami."
  tags: []
"Wj35,19":
  text: "Szaty służebne do usługiwania w Miejscu Świętym, święte szaty kapłana Aarona i szaty dla jego synów, do sprawowania urzędu kapłańskiego."
  tags: []
"Wj35,20":
  text: "Wtedy całe zgromadzenie synów Izraela odeszło od Mojżesza."
  tags: []
"Wj35,21":
  text: "I przyszedł każdy, kogo serce pobudziło, i każdy, w którym duch był ochoczy; i przynieśli PANU dar do wykonania Namiotu Zgromadzenia, na wszelką służbę w nim i na święte szaty."
  tags: []
"Wj35,22":
  text: "Przychodzili więc mężczyźni i kobiety, każdy, kto był ochotnego serca, i przynosili bransoletki, kolczyki, pierścienie, naszyjniki i wszelkie złote przedmioty i każdy przynosił PANU ofiarę ze złota."
  tags: []
"Wj35,23":
  text: "Każdy też, kto miał błękitną tkaninę, purpurę, karmazyn, bisior, kozią sierść, skóry baranie farbowane na czerwono i skóry borsucze, przynosił je."
  tags: []
"Wj35,24":
  text: "Każdy, kto ofiarował dar ze srebra i miedzi, przynosił na ofiarę dla PANA; każdy też, kto miał drewno akacjowe, do wszelkiej pracy tej służby, przynosił je."
  tags: []
"Wj35,25":
  text: "I wszystkie uzdolnione kobiety przędły swymi rękami i przynosiły to, co naprzędły: z błękitnej tkaniny, purpury, karmazynu i bisioru."
  tags: []
"Wj35,26":
  text: "A wszystkie kobiety, których serca były obdarzone zdolnością, przędły kozią sierść."
  tags: []
"Wj35,27":
  text: "Przełożeni zaś przynosili kamienie onyksu i kamienie do osadzenia efodu i pektorału;"
  tags: []
"Wj35,28":
  text: "Także wonności i oliwę do świecenia i na olejek do namaszczania, i na wonne kadzidła."
  tags: []
"Wj35,29":
  text: "Wszyscy synowie Izraela przynosili PANU dobrowolną ofiarę, każdy mężczyzna i każda kobieta, w których było serce ochocze do składania ofiar na każde dzieło, które PAN przez Mojżesza rozkazał wykonać."
  tags: []
"Wj35,30":
  text: "Potem Mojżesz powiedział do synów Izraela: Oto PAN powołał po imieniu Besalela, syna Uriego, syna Chura, z pokolenia Judy;"
  tags: []
"Wj35,31":
  text: "I napełnił go Duchem Bożym, mądrością, rozumem i umiejętnością we wszelkim rzemiośle;"
  tags: []
"Wj35,32":
  text: "Aby umiejętnie wymyślał wzory, aby wyrabiał ze złota, srebra i miedzi;"
  tags: []
"Wj35,33":
  text: "Do obrabiania kamieni do oprawy, do ciosania drewna, aby wykonał wszelkie rodzaje dzieła."
  tags: []
"Wj35,34":
  text: "Włożył mu w serce też zdolność, aby mógł uczyć innych, on, i Oholiab, syn Achisamaka, z pokolenia Dana."
  tags: []
"Wj35,35":
  text: "Napełnił ich mądrością serca, aby wykonywali wszelkie rzemiosło rytownicze, obmyślania projektów, hafciarskie z błękitnej tkaniny, purpury, karmazynu i bisioru i tkackie, aby obmyślali i zręcznie wykonywali każdą pracę."
  tags: []
