"Wj35,1": "Potem Mojżesz zebrał całe zgromadzenie synów Izraela i mówił do nich: Oto są słowa, które PAN rozkazał, abyście je wypełnili."
"Wj35,2": "Przez sześć dni będzie wykonywana praca, ale siódmy dzień będzie dla was świętem, szabatem odpoczynku dla PANA. Kto w nim wykona pracę, poniesie śmierć."
"Wj35,3": "Nie rozniecicie ognia w żadnym z waszych mieszkań w dzień szabatu."
"Wj35,4": "Mojżesz powiedział też do całego zgromadzenia synów Izraela: Oto słowo, które PAN przykazał:"
"Wj35,5": "Złóżcie PANU dar od siebie: każdy, kto jest ochotnego serca, niech przyniesie PANU dar: złoto, srebro i miedź;"
"Wj35,6": "Błękitną tkaninę, purpurę, karmazyn, bisior i kozią sierść;"
"Wj35,7": "I skóry baranie farbowane na czerwono i skóry borsucze, i drewno akacjowe;"
"Wj35,8": "Oliwę do oświetlenia, wonności na olejek do namaszczania i na wonne kadzidło;"
"Wj35,9": "Kamienie onyksu i kamienie do osadzenia efodu i pektorału."
"Wj35,10": "A wszyscy spośród was, którzy są uzdolnieni, przyjdą i będą robić wszystko, co PAN rozkazał:"
"Wj35,11": "Przybytek, jego namiot i przykrycie, haczyki do niego i deski, drążki do niego, słupy i podstawki;"
"Wj35,12": "Arkę i drążki do niej, przebłagalnię i zasłonę do osłonięcia;"
"Wj35,13": "Stół i drążki do niego, wszystkie jego naczynia i chleby pokładne;"
"Wj35,14": "Świecznik do oświetlenia i jego przybory, lampy do niego i oliwę do świecenia."
"Wj35,15": "Także ołtarz kadzenia z drążkami do niego, olejek do namaszczania, wonne kadzidło i zasłonę do wejścia do przybytku;"
"Wj35,16": "Ołtarz całopalenia, miedzianą kratę do niego, drążki i wszystkie naczynia do niego, kadź i jej podstawę;"
"Wj35,17": "Zasłony do dziedzińca, słupy i podstawki do nich, zasłonę do wejścia na dziedziniec."
"Wj35,18": "Kołki do przybytku i kołki do dziedzińca z ich sznurami."
"Wj35,19": "Szaty służebne do usługiwania w Miejscu Świętym, święte szaty kapłana Aarona i szaty dla jego synów, do sprawowania urzędu kapłańskiego."
"Wj35,20": "Wtedy całe zgromadzenie synów Izraela odeszło od Mojżesza."
"Wj35,21": "I przyszedł każdy, kogo serce pobudziło, i każdy, w którym duch był ochoczy; i przynieśli PANU dar do wykonania Namiotu Zgromadzenia, na wszelką służbę w nim i na święte szaty."
"Wj35,22": "Przychodzili więc mężczyźni i kobiety, każdy, kto był ochotnego serca, i przynosili bransoletki, kolczyki, pierścienie, naszyjniki i wszelkie złote przedmioty i każdy przynosił PANU ofiarę ze złota."
"Wj35,23": "Każdy też, kto miał błękitną tkaninę, purpurę, karmazyn, bisior, kozią sierść, skóry baranie farbowane na czerwono i skóry borsucze, przynosił je."
"Wj35,24": "Każdy, kto ofiarował dar ze srebra i miedzi, przynosił na ofiarę dla PANA; każdy też, kto miał drewno akacjowe, do wszelkiej pracy tej służby, przynosił je."
"Wj35,25": "I wszystkie uzdolnione kobiety przędły swymi rękami i przynosiły to, co naprzędły: z błękitnej tkaniny, purpury, karmazynu i bisioru."
"Wj35,26": "A wszystkie kobiety, których serca były obdarzone zdolnością, przędły kozią sierść."
"Wj35,27": "Przełożeni zaś przynosili kamienie onyksu i kamienie do osadzenia efodu i pektorału;"
"Wj35,28": "Także wonności i oliwę do świecenia i na olejek do namaszczania, i na wonne kadzidła."
"Wj35,29": "Wszyscy synowie Izraela przynosili PANU dobrowolną ofiarę, każdy mężczyzna i każda kobieta, w których było serce ochocze do składania ofiar na każde dzieło, które PAN przez Mojżesza rozkazał wykonać."
"Wj35,30": "Potem Mojżesz powiedział do synów Izraela: Oto PAN powołał po imieniu Besalela, syna Uriego, syna Chura, z pokolenia Judy;"
"Wj35,31": "I napełnił go Duchem Bożym, mądrością, rozumem i umiejętnością we wszelkim rzemiośle;"
"Wj35,32": "Aby umiejętnie wymyślał wzory, aby wyrabiał ze złota, srebra i miedzi;"
"Wj35,33": "Do obrabiania kamieni do oprawy, do ciosania drewna, aby wykonał wszelkie rodzaje dzieła."
"Wj35,34": "Włożył mu w serce też zdolność, aby mógł uczyć innych, on, i Oholiab, syn Achisamaka, z pokolenia Dana."
"Wj35,35": "Napełnił ich mądrością serca, aby wykonywali wszelkie rzemiosło rytownicze, obmyślania projektów, hafciarskie z błękitnej tkaniny, purpury, karmazynu i bisioru i tkackie, aby obmyślali i zręcznie wykonywali każdą pracę."
