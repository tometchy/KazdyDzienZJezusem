"Wj38,1":
  text: "Zrobił również ołtarz do całopalenia z drewna akacjowego, na pięć łokci długi i na pięć łokci szeroki, kwadratowy, na trzy łokcie wysoki."
  tags: []
"Wj38,2":
  text: "I zrobił rogi na jego czterech narożnikach, rogi wychodziły z niego. I pokrył go miedzią."
  tags: []
"Wj38,3":
  text: "Zrobił też wszystkie naczynia do ołtarza, kociołki, szufle, miednice, widełki i łopaty na rozżarzone węgle. Wszystkie naczynia do niego zrobił z miedzi."
  tags: []
"Wj38,4":
  text: "Zrobił także do ołtarza miedzianą kratę na kształt sieci pod obramowaniem, od spodu aż do połowy wysokości."
  tags: []
"Wj38,5":
  text: "I odlał cztery pierścienie na czterech rogach miedzianej kraty jako uchwyty na drążki."
  tags: []
"Wj38,6":
  text: "Porobił również drążki z drewna akacjowego i pokrył je miedzią."
  tags: []
"Wj38,7":
  text: "I włożył drążki w te pierścienie po obu bokach ołtarza, aby był na nich noszony; zrobił go z desek, wewnątrz był pusty."
  tags: []
"Wj38,8":
  text: "Zrobił też kadź z miedzi i do niej miedzianą podstawę ze zwierciadeł kobiet, które gromadnie przychodziły przed wejście do Namiotu Zgromadzenia."
  tags: []
"Wj38,9":
  text: "Zrobił także dziedziniec: na południu po prawej stronie zasłony dziedzińca były ze skręconego bisioru, na sto łokci;"
  tags: []
"Wj38,10":
  text: "Do nich dwadzieścia słupów, a do nich dwadzieścia miedzianych podstawek; haki na słupach i ich klamry ze srebra."
  tags: []
"Wj38,11":
  text: "Także po stronie północnej zasłony na sto łokci; do nich dwadzieścia słupów i do nich dwadzieścia miedzianych podstawek; haki na słupach i ich klamry ze srebra."
  tags: []
"Wj38,12":
  text: "A od zachodniej strony były zasłony na pięćdziesiąt łokci; do nich dziesięć słupów i do nich dziesięć podstawek; haki na słupach i ich klamry ze srebra."
  tags: []
"Wj38,13":
  text: "A z przodu po stronie wschodniej były zasłony na pięćdziesiąt łokci."
  tags: []
"Wj38,14":
  text: "Zasłony na piętnaście łokci były po jednej stronie, do nich trzy słupy i trzy podstawki."
  tags: []
"Wj38,15":
  text: "I po drugiej stronie bramy dziedzińca, z jednej i z drugiej strony, piętnaście łokci zasłon, do nich trzy słupy i trzy podstawki."
  tags: []
"Wj38,16":
  text: "Wszystkie zasłony dziedzińca wokoło były ze skręconego bisioru;"
  tags: []
"Wj38,17":
  text: "A podstawki słupów z miedzi, haki na słupach i klamry ze srebra, także pokrycia ich głowic ze srebra; wszystkie słupy dziedzińca były oklamrowane srebrem."
  tags: []
"Wj38,18":
  text: "Zasłona do bramy dziedzińca była haftowana, z błękitnej tkaniny, purpury, karmazynu i skręconego bisioru; długa na dwadzieścia łokci, wysoka na pięć łokci jak inne zasłony dziedzińca."
  tags: []
"Wj38,19":
  text: "A do nich cztery słupy i cztery miedziane podstawki; haki do nich były ze srebra, pokrycia ich głowic i klamry też były ze srebra."
  tags: []
"Wj38,20":
  text: "Wszystkie kołki przybytku i dziedzińca wokoło były z miedzi."
  tags: []
"Wj38,21":
  text: "Oto obliczenie rzeczy do przybytku, do Przybytku Świadectwa, które zostały obliczone na rozkaz Mojżesza przez Itamara, syna kapłana Aarona, do służby Lewitów."
  tags: []
"Wj38,22":
  text: "A Besalel, syn Uriego, syna Chura, z pokolenia Judy, zrobił wszystko, co PAN rozkazał Mojżeszowi;"
  tags: []
"Wj38,23":
  text: "A z nim Oholiab, syn Achisamaka, z pokolenia Dana, rytownik, wybitny rzemieślnik i haftujący na błękitnej tkaninie, na purpurze, na karmazynie i na bisiorze."
  tags: []
"Wj38,24":
  text: "Całego złota zużytego na wykonanie wszelkich robót świątyni – złota z darów – było dwadzieścia dziewięć talentów i siedemset trzydzieści syklów według sykla świątynnego."
  tags: []
"Wj38,25":
  text: "Srebra zaś od przeliczonych spośród zgromadzenia było sto talentów i tysiąc siedemset siedemdziesiąt pięć syklów według sykla świątynnego."
  tags: []
"Wj38,26":
  text: "Od każdej głowy pół sykla według sykla świątynnego, od wszystkich, którzy zostali policzeni, od dwudziestu lat i wyżej, a ludzi tych było sześćset trzy tysiące pięciuset pięćdziesięciu."
  tags: []
"Wj38,27":
  text: "A było sto talentów srebra do odlewania podstawek świątyni i podstawek zasłony; sto podstawek ze stu talentów; talent na podstawkę."
  tags: []
"Wj38,28":
  text: "A z tysiąca siedmiuset siedemdziesięciu pięciu syklów zrobił haki na słupy i pokrył ich głowice, i oklamrował je."
  tags: []
"Wj38,29":
  text: "Miedzi zaś złożonej w ofierze było siedemdziesiąt talentów i dwa tysiące czterysta syklów."
  tags: []
"Wj38,30":
  text: "I odlał z niej podstawki do wejścia do Namiotu Zgromadzenia i miedziany ołtarz, i do niego miedzianą kratę oraz wszystkie naczynia do ołtarza."
  tags: []
"Wj38,31":
  text: "I podstawki do dziedzińca wokoło, podstawki do bramy dziedzińca, wszystkie kołki przybytku oraz kołki dziedzińca wokoło."
  tags: []
