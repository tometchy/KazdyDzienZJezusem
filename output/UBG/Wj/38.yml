"Wj38,1": "Zrobił również ołtarz do całopalenia z drewna akacjowego, na pięć łokci długi i na pięć łokci szeroki, kwadratowy, na trzy łokcie wysoki."
"Wj38,2": "I zrobił rogi na jego czterech narożnikach, rogi wychodziły z niego. I pokrył go miedzią."
"Wj38,3": "Zrobił też wszystkie naczynia do ołtarza, kociołki, szufle, miednice, widełki i łopaty na rozżarzone węgle. Wszystkie naczynia do niego zrobił z miedzi."
"Wj38,4": "Zrobił także do ołtarza miedzianą kratę na kształt sieci pod obramowaniem, od spodu aż do połowy wysokości."
"Wj38,5": "I odlał cztery pierścienie na czterech rogach miedzianej kraty jako uchwyty na drążki."
"Wj38,6": "Porobił również drążki z drewna akacjowego i pokrył je miedzią."
"Wj38,7": "I włożył drążki w te pierścienie po obu bokach ołtarza, aby był na nich noszony; zrobił go z desek, wewnątrz był pusty."
"Wj38,8": "Zrobił też kadź z miedzi i do niej miedzianą podstawę ze zwierciadeł kobiet, które gromadnie przychodziły przed wejście do Namiotu Zgromadzenia."
"Wj38,9": "Zrobił także dziedziniec: na południu po prawej stronie zasłony dziedzińca były ze skręconego bisioru, na sto łokci;"
"Wj38,10": "Do nich dwadzieścia słupów, a do nich dwadzieścia miedzianych podstawek; haki na słupach i ich klamry ze srebra."
"Wj38,11": "Także po stronie północnej zasłony na sto łokci; do nich dwadzieścia słupów i do nich dwadzieścia miedzianych podstawek; haki na słupach i ich klamry ze srebra."
"Wj38,12": "A od zachodniej strony były zasłony na pięćdziesiąt łokci; do nich dziesięć słupów i do nich dziesięć podstawek; haki na słupach i ich klamry ze srebra."
"Wj38,13": "A z przodu po stronie wschodniej były zasłony na pięćdziesiąt łokci."
"Wj38,14": "Zasłony na piętnaście łokci były po jednej stronie, do nich trzy słupy i trzy podstawki."
"Wj38,15": "I po drugiej stronie bramy dziedzińca, z jednej i z drugiej strony, piętnaście łokci zasłon, do nich trzy słupy i trzy podstawki."
"Wj38,16": "Wszystkie zasłony dziedzińca wokoło były ze skręconego bisioru;"
"Wj38,17": "A podstawki słupów z miedzi, haki na słupach i klamry ze srebra, także pokrycia ich głowic ze srebra; wszystkie słupy dziedzińca były oklamrowane srebrem."
"Wj38,18": "Zasłona do bramy dziedzińca była haftowana, z błękitnej tkaniny, purpury, karmazynu i skręconego bisioru; długa na dwadzieścia łokci, wysoka na pięć łokci jak inne zasłony dziedzińca."
"Wj38,19": "A do nich cztery słupy i cztery miedziane podstawki; haki do nich były ze srebra, pokrycia ich głowic i klamry też były ze srebra."
"Wj38,20": "Wszystkie kołki przybytku i dziedzińca wokoło były z miedzi."
"Wj38,21": "Oto obliczenie rzeczy do przybytku, do Przybytku Świadectwa, które zostały obliczone na rozkaz Mojżesza przez Itamara, syna kapłana Aarona, do służby Lewitów."
"Wj38,22": "A Besalel, syn Uriego, syna Chura, z pokolenia Judy, zrobił wszystko, co PAN rozkazał Mojżeszowi;"
"Wj38,23": "A z nim Oholiab, syn Achisamaka, z pokolenia Dana, rytownik, wybitny rzemieślnik i haftujący na błękitnej tkaninie, na purpurze, na karmazynie i na bisiorze."
"Wj38,24": "Całego złota zużytego na wykonanie wszelkich robót świątyni – złota z darów – było dwadzieścia dziewięć talentów i siedemset trzydzieści syklów według sykla świątynnego."
"Wj38,25": "Srebra zaś od przeliczonych spośród zgromadzenia było sto talentów i tysiąc siedemset siedemdziesiąt pięć syklów według sykla świątynnego."
"Wj38,26": "Od każdej głowy pół sykla według sykla świątynnego, od wszystkich, którzy zostali policzeni, od dwudziestu lat i wyżej, a ludzi tych było sześćset trzy tysiące pięciuset pięćdziesięciu."
"Wj38,27": "A było sto talentów srebra do odlewania podstawek świątyni i podstawek zasłony; sto podstawek ze stu talentów; talent na podstawkę."
"Wj38,28": "A z tysiąca siedmiuset siedemdziesięciu pięciu syklów zrobił haki na słupy i pokrył ich głowice, i oklamrował je."
"Wj38,29": "Miedzi zaś złożonej w ofierze było siedemdziesiąt talentów i dwa tysiące czterysta syklów."
"Wj38,30": "I odlał z niej podstawki do wejścia do Namiotu Zgromadzenia i miedziany ołtarz, i do niego miedzianą kratę oraz wszystkie naczynia do ołtarza."
"Wj38,31": "I podstawki do dziedzińca wokoło, podstawki do bramy dziedzińca, wszystkie kołki przybytku oraz kołki dziedzińca wokoło."
