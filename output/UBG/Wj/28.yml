"Wj28,1": "Przywołaj do siebie twego brata Aarona i wraz z nim jego synów, spośród synów Izraela, aby sprawowali dla mnie urząd kapłański: Aarona, Nadaba i Abihu, Eleazara i Itamara, synów Aarona."
"Wj28,2": "Uczynisz święte szaty dla twego brata Aarona, na cześć i na ozdobę."
"Wj28,3": "Porozmawiasz też ze wszystkimi zdolnymi rzemieślnikami, których napełniłem duchem mądrości, aby wykonali szaty dla Aarona na jego poświęcenie, aby mi sprawował urząd kapłański."
"Wj28,4": "Oto szaty, które wykonają: pektorał, efod, ornat, tunika haftowana, mitra i pas. I uczynią te święte szaty dla twego brata Aarona i jego synów, aby mi sprawowali urząd kapłański."
"Wj28,5": "I wezmą złoto, błękitną tkaninę, purpurę, karmazyn i bisior."
"Wj28,6": "I uczynią efod ze złota, błękitnej tkaniny, purpury, karmazynu i skręconego bisioru, haftowany."
"Wj28,7": "Będzie on miał dwa naramienniki zszyte na dwóch końcach i tak będą razem połączone."
"Wj28,8": "A pas, którym będzie przepasany efod, zostanie podobnie uczyniony ze złota, błękitnej tkaniny, purpury, karmazynu i skręconego bisioru."
"Wj28,9": "I weźmiesz dwa kamienie onyksu i wyryjesz na nich imiona synów Izraela;"
"Wj28,10": "Sześć ich imion na jednym kamieniu i sześć pozostałych imion na drugim kamieniu, według kolejności ich narodzenia."
"Wj28,11": "Tak jak rytownik, który wykuwa pieczęć, wyryjesz na obu kamieniach imiona synów Izraela i osadzisz je w złotych oprawach."
"Wj28,12": "I umieścisz te dwa kamienie na naramiennikach efodu jako kamienie pamiątkowe dla synów Izraela. I Aaron będzie nosić ich imiona przed PANEM na obu swych ramionach na pamiątkę."
"Wj28,13": "Uczynisz też złote oprawy;"
"Wj28,14": "A także dwa łańcuszki ze szczerego złota. Upleciesz je i przymocujesz te plecione łańcuszki do opraw."
"Wj28,15": "Uczynisz też pektorał wyrokowania, wyhaftowany, podobnie jak efod. Uczynisz go ze złota, błękitnej tkaniny, purpury, karmazynu i skręconego bisioru."
"Wj28,16": "Będzie kwadratowy, złożony we dwoje, na piędź długości i na piędź szerokości."
"Wj28,17": "I uczynisz w nim oprawy dla kamieni, cztery rzędy kamieni, w tym porządku: karneol, topaz i szmaragd w pierwszym rzędzie;"
"Wj28,18": "W drugim zaś rzędzie: karbunkuł, szafir i diament;"
"Wj28,19": "W trzecim rzędzie: hiacynt, agat i ametyst;"
"Wj28,20": "W czwartym rzędzie: beryl, onyks i jaspis. Będą one osadzone w złotych oprawach."
"Wj28,21": "A tych kamieni z imionami synów Izraela będzie dwanaście, według ich imion. Będą ryte jak na pieczęci, każdy z własnym imieniem, według dwunastu pokoleń."
"Wj28,22": "Uczynisz do pektorału łańcuszki plecione ze szczerego złota."
"Wj28,23": "Do pektorału uczynisz też dwa złote pierścienie i przymocujesz te dwa pierścienie do obu jego rogów."
"Wj28,24": "I przewleczesz dwa złote łańcuszki przez oba pierścienie na rogach pektorału."
"Wj28,25": "Drugie zaś końce obu łańcuszków przymocujesz do dwóch opraw i przytwierdzisz z przodu do naramienników efodu."
"Wj28,26": "Uczynisz też dwa złote pierścienie, które przymocujesz do dwóch rogów pektorału na wewnętrznym brzegu, który jest od strony efodu."
"Wj28,27": "Do tego uczynisz kolejne dwa złote pierścienie, które przymocujesz do dwóch stron efodu u dołu, naprzeciwko jego połączenia, powyżej pasa efodu."
"Wj28,28": "Te pierścienie zwiążą pektorał z pierścieniami efodu sznurem z błękitnej tkaniny, aby był nad pasem efodu, żeby pektorał nie odstawał od efodu."
"Wj28,29": "I Aaron będzie nosił imiona synów Izraela na pektorale wyrokowania, na swych piersiach, gdy będzie wchodził do Miejsca Świętego, na wieczną pamiątkę przed PANEM."
"Wj28,30": "Włożysz też do pektorału wyrokowania Urim i Tummim, które będą na sercu Aarona, gdy będzie wchodził przed PANA. I Aaron nieustannie będzie nosił na sercu przed PANEM sąd synów Izraela."
"Wj28,31": "Uczynisz też ornat pod efod, cały z błękitnej tkaniny."
"Wj28,32": "A na wierzchu w środku będzie miał otwór. Dokoła otworu będzie pleciona obwódka na wzór pancerza, aby się nie rozdzierał."
"Wj28,33": "Uczynisz też u jego dołu jabłka granatu z błękitnej tkaniny, purpury i karmazynu dokoła brzegu, a między nimi dokoła złote dzwonki;"
"Wj28,34": "Złoty dzwonek i jabłko granatu i znowu złoty dzwonek i jabłko granatu, dokoła dolnego brzegu ornatu."
"Wj28,35": "I Aaron będzie to miał na sobie podczas służby, aby słychać było jego dźwięk, gdy będzie wchodził do Miejsca Świętego przed PANA i gdy będzie wychodzić, żeby nie umarł."
"Wj28,36": "Uczynisz też blaszkę ze szczerego złota, a na niej wyryjesz jak na pieczęci: Świętość PANU."
"Wj28,37": "Przymocujesz ją do sznura z błękitnej tkaniny i będzie na mitrze, będzie na przodzie mitry."
"Wj28,38": "I będzie na czole Aarona, aby nosił Aaron nieprawość poświęconych rzeczy, które synowie Izraela poświęcać będą przy wszystkich świętych darach. Będzie nieustannie na jego czole, aby im zjednał łaskę u PANA."
"Wj28,39": "Utkasz tunikę z bisioru, mitrę także uczynisz z bisioru, wyhaftujesz też pas."
"Wj28,40": "Również dla synów Aarona wykonasz szaty, też pasy i mitry uczynisz im na cześć i na ozdobę."
"Wj28,41": "I ubierzesz w nie twego brata Aarona i wraz z nim jego synów. Namaścisz ich, poświęcisz i uświęcisz, aby mi sprawowali urząd kapłański."
"Wj28,42": "Wykonasz im też lniane spodnie dla zakrycia nagości ciała. Będą od bioder aż po uda."
"Wj28,43": "A będą one na Aaronie i na jego synach, gdy będą wchodzić do Namiotu Zgromadzenia lub gdy będą przystępować do ołtarza, aby służyć w Miejscu Świętym, aby nie ściągnęli na siebie winy i nie pomarli. Będzie to wieczna ustawa dla niego i jego potomstwa po nim."
