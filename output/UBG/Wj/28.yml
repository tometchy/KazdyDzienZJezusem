"Wj28,1":
  text: "Przywołaj do siebie twego brata Aarona i wraz z nim jego synów, spośród synów Izraela, aby sprawowali dla mnie urząd kapłański: Aarona, Nadaba i Abihu, Eleazara i Itamara, synów Aarona."
  tags: []
"Wj28,2":
  text: "Uczynisz święte szaty dla twego brata Aarona, na cześć i na ozdobę."
  tags: []
"Wj28,3":
  text: "Porozmawiasz też ze wszystkimi zdolnymi rzemieślnikami, których napełniłem duchem mądrości, aby wykonali szaty dla Aarona na jego poświęcenie, aby mi sprawował urząd kapłański."
  tags: []
"Wj28,4":
  text: "Oto szaty, które wykonają: pektorał, efod, ornat, tunika haftowana, mitra i pas. I uczynią te święte szaty dla twego brata Aarona i jego synów, aby mi sprawowali urząd kapłański."
  tags: []
"Wj28,5":
  text: "I wezmą złoto, błękitną tkaninę, purpurę, karmazyn i bisior."
  tags: []
"Wj28,6":
  text: "I uczynią efod ze złota, błękitnej tkaniny, purpury, karmazynu i skręconego bisioru, haftowany."
  tags: []
"Wj28,7":
  text: "Będzie on miał dwa naramienniki zszyte na dwóch końcach i tak będą razem połączone."
  tags: []
"Wj28,8":
  text: "A pas, którym będzie przepasany efod, zostanie podobnie uczyniony ze złota, błękitnej tkaniny, purpury, karmazynu i skręconego bisioru."
  tags: []
"Wj28,9":
  text: "I weźmiesz dwa kamienie onyksu i wyryjesz na nich imiona synów Izraela;"
  tags: []
"Wj28,10":
  text: "Sześć ich imion na jednym kamieniu i sześć pozostałych imion na drugim kamieniu, według kolejności ich narodzenia."
  tags: []
"Wj28,11":
  text: "Tak jak rytownik, który wykuwa pieczęć, wyryjesz na obu kamieniach imiona synów Izraela i osadzisz je w złotych oprawach."
  tags: []
"Wj28,12":
  text: "I umieścisz te dwa kamienie na naramiennikach efodu jako kamienie pamiątkowe dla synów Izraela. I Aaron będzie nosić ich imiona przed PANEM na obu swych ramionach na pamiątkę."
  tags: []
"Wj28,13":
  text: "Uczynisz też złote oprawy;"
  tags: []
"Wj28,14":
  text: "A także dwa łańcuszki ze szczerego złota. Upleciesz je i przymocujesz te plecione łańcuszki do opraw."
  tags: []
"Wj28,15":
  text: "Uczynisz też pektorał wyrokowania, wyhaftowany, podobnie jak efod. Uczynisz go ze złota, błękitnej tkaniny, purpury, karmazynu i skręconego bisioru."
  tags: []
"Wj28,16":
  text: "Będzie kwadratowy, złożony we dwoje, na piędź długości i na piędź szerokości."
  tags: []
"Wj28,17":
  text: "I uczynisz w nim oprawy dla kamieni, cztery rzędy kamieni, w tym porządku: karneol, topaz i szmaragd w pierwszym rzędzie;"
  tags: []
"Wj28,18":
  text: "W drugim zaś rzędzie: karbunkuł, szafir i diament;"
  tags: []
"Wj28,19":
  text: "W trzecim rzędzie: hiacynt, agat i ametyst;"
  tags: []
"Wj28,20":
  text: "W czwartym rzędzie: beryl, onyks i jaspis. Będą one osadzone w złotych oprawach."
  tags: []
"Wj28,21":
  text: "A tych kamieni z imionami synów Izraela będzie dwanaście, według ich imion. Będą ryte jak na pieczęci, każdy z własnym imieniem, według dwunastu pokoleń."
  tags: []
"Wj28,22":
  text: "Uczynisz do pektorału łańcuszki plecione ze szczerego złota."
  tags: []
"Wj28,23":
  text: "Do pektorału uczynisz też dwa złote pierścienie i przymocujesz te dwa pierścienie do obu jego rogów."
  tags: []
"Wj28,24":
  text: "I przewleczesz dwa złote łańcuszki przez oba pierścienie na rogach pektorału."
  tags: []
"Wj28,25":
  text: "Drugie zaś końce obu łańcuszków przymocujesz do dwóch opraw i przytwierdzisz z przodu do naramienników efodu."
  tags: []
"Wj28,26":
  text: "Uczynisz też dwa złote pierścienie, które przymocujesz do dwóch rogów pektorału na wewnętrznym brzegu, który jest od strony efodu."
  tags: []
"Wj28,27":
  text: "Do tego uczynisz kolejne dwa złote pierścienie, które przymocujesz do dwóch stron efodu u dołu, naprzeciwko jego połączenia, powyżej pasa efodu."
  tags: []
"Wj28,28":
  text: "Te pierścienie zwiążą pektorał z pierścieniami efodu sznurem z błękitnej tkaniny, aby był nad pasem efodu, żeby pektorał nie odstawał od efodu."
  tags: []
"Wj28,29":
  text: "I Aaron będzie nosił imiona synów Izraela na pektorale wyrokowania, na swych piersiach, gdy będzie wchodził do Miejsca Świętego, na wieczną pamiątkę przed PANEM."
  tags: []
"Wj28,30":
  text: "Włożysz też do pektorału wyrokowania Urim i Tummim, które będą na sercu Aarona, gdy będzie wchodził przed PANA. I Aaron nieustannie będzie nosił na sercu przed PANEM sąd synów Izraela."
  tags: []
"Wj28,31":
  text: "Uczynisz też ornat pod efod, cały z błękitnej tkaniny."
  tags: []
"Wj28,32":
  text: "A na wierzchu w środku będzie miał otwór. Dokoła otworu będzie pleciona obwódka na wzór pancerza, aby się nie rozdzierał."
  tags: []
"Wj28,33":
  text: "Uczynisz też u jego dołu jabłka granatu z błękitnej tkaniny, purpury i karmazynu dokoła brzegu, a między nimi dokoła złote dzwonki;"
  tags: []
"Wj28,34":
  text: "Złoty dzwonek i jabłko granatu i znowu złoty dzwonek i jabłko granatu, dokoła dolnego brzegu ornatu."
  tags: []
"Wj28,35":
  text: "I Aaron będzie to miał na sobie podczas służby, aby słychać było jego dźwięk, gdy będzie wchodził do Miejsca Świętego przed PANA i gdy będzie wychodzić, żeby nie umarł."
  tags: []
"Wj28,36":
  text: "Uczynisz też blaszkę ze szczerego złota, a na niej wyryjesz jak na pieczęci: Świętość PANU."
  tags: []
"Wj28,37":
  text: "Przymocujesz ją do sznura z błękitnej tkaniny i będzie na mitrze, będzie na przodzie mitry."
  tags: []
"Wj28,38":
  text: "I będzie na czole Aarona, aby nosił Aaron nieprawość poświęconych rzeczy, które synowie Izraela poświęcać będą przy wszystkich świętych darach. Będzie nieustannie na jego czole, aby im zjednał łaskę u PANA."
  tags: []
"Wj28,39":
  text: "Utkasz tunikę z bisioru, mitrę także uczynisz z bisioru, wyhaftujesz też pas."
  tags: []
"Wj28,40":
  text: "Również dla synów Aarona wykonasz szaty, też pasy i mitry uczynisz im na cześć i na ozdobę."
  tags: []
"Wj28,41":
  text: "I ubierzesz w nie twego brata Aarona i wraz z nim jego synów. Namaścisz ich, poświęcisz i uświęcisz, aby mi sprawowali urząd kapłański."
  tags: []
"Wj28,42":
  text: "Wykonasz im też lniane spodnie dla zakrycia nagości ciała. Będą od bioder aż po uda."
  tags: []
"Wj28,43":
  text: "A będą one na Aaronie i na jego synach, gdy będą wchodzić do Namiotu Zgromadzenia lub gdy będą przystępować do ołtarza, aby służyć w Miejscu Świętym, aby nie ściągnęli na siebie winy i nie pomarli. Będzie to wieczna ustawa dla niego i jego potomstwa po nim."
  tags: []
