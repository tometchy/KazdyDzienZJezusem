"Wj30,1": "Uczynisz też ołtarz do spalania kadzidła. Uczynisz go z drewna akacjowego."
"Wj30,2": "Na łokieć długi i na łokieć szeroki, będzie kwadratowy, na dwa łokcie wysoki. Jego rogi będą z tego samego."
"Wj30,3": "Pokryjesz go szczerym złotem, jego wierzch i ściany wokoło oraz rogi. Uczynisz też dokoła niego złotą listwę."
"Wj30,4": "Pod listwą, na dwóch jego narożnikach, po obu jego stronach, uczynisz też dwa złote pierścienie, a przez nie przewleczesz drążki, aby był na nich noszony."
"Wj30,5": "Drążki te uczynisz z drewna akacjowego i pokryjesz je złotem."
"Wj30,6": "Następnie postawisz go przed zasłoną, za którą jest arka świadectwa, przed przebłagalnią, która jest nad świadectwem, gdzie będę się z tobą spotykać."
"Wj30,7": "I każdego poranka Aaron będzie spalał na nim wonne kadzidło. Gdy będzie przygotowywał lampy, będzie je spalał."
"Wj30,8": "Także wieczorem, gdy Aaron rozpali lampy, będzie spalał kadzidło, będzie to ustawiczne kadzenie przed PANEM przez wszystkie wasze pokolenia."
"Wj30,9": "Nie składajcie na nim obcego kadzidła ani całopalenia, ani ofiary pokarmowej, nie będziecie też na nim składać ofiary z płynów."
"Wj30,10": "Tylko raz do roku Aaron dokona na jego rogach przebłagania krwią z ofiary na przebłaganie grzechu. Raz do roku odprawi przebłaganie na nim przez wszystkie wasze pokolenia. Będzie to najświętsza rzecz dla PANA."
"Wj30,11": "Potem PAN powiedział do Mojżesza:"
"Wj30,12": "Gdy przeliczysz synów Izraela podlegających spisowi, każdy da PANU okup za swą duszę podczas spisu, aby nie dotknęła ich plaga, gdy będą zliczeni."
"Wj30,13": "To będzie dawać każdy, kto podlega spisowi: pół sykla według sykla świątynnego – sykl to dwadzieścia ger. Pół sykla wyniesie więc ofiara dla PANA."
"Wj30,14": "Każdy podległy spisowi, od dwudziestego roku życia wzwyż, odda PANU ofiarę."
"Wj30,15": "Bogaty nie da więcej, a ubogi nie da mniej niż pół sykla, gdy będą dawać PANU ofiarę na przebłaganie za swoje dusze."
"Wj30,16": "A weźmiesz pieniądze przebłagania od synów Izraela i dasz je na służbę Namiotu Zgromadzenia. Będzie to dla synów Izraela pamiątką przed PANEM, na przebłaganie za wasze dusze."
"Wj30,17": "Potem PAN powiedział do Mojżesza:"
"Wj30,18": "Uczynisz też miedzianą kadź do obmywania i do niej miedzianą podstawę i postawisz ją między Namiotem Zgromadzenia a ołtarzem, i nalejesz do niej wody."
"Wj30,19": "Aaron i jego synowie będą w niej obmywać swoje ręce i nogi."
"Wj30,20": "Gdy będą wchodzić do Namiotu Zgromadzenia, obmyją się wodą, aby nie pomarli. Podobnie gdy będą przystępować do ołtarza, aby służyć i spalać ofiarę ogniową dla PANA;"
"Wj30,21": "Obmyją swoje ręce i nogi, aby nie pomarli. Będzie to dla nich wieczną ustawą, dla niego i jego potomstwa, przez wszystkie ich pokolenia."
"Wj30,22": "PAN powiedział jeszcze do Mojżesza:"
"Wj30,23": "Weź sobie też najlepsze wonności: pięćset syklów najczystszej mirry, połowę tego, czyli dwieście pięćdziesiąt syklów, wonnego cynamonu i dwieście pięćdziesiąt syklów ziela tataraku;"
"Wj30,24": "Pięćset syklów kasji według sykla świątynnego i hin oliwy z oliwek."
"Wj30,25": "Uczynisz z tego święty olejek do namaszczenia, wyborną maść, dzieło zielarza. Będzie to święty olejek do namaszczenia."
"Wj30,26": "Namaścisz nim Namiot Zgromadzenia i arkę świadectwa;"
"Wj30,27": "I stół wraz ze wszystkimi jego naczyniami, świecznik i jego przybory oraz ołtarz kadzenia;"
"Wj30,28": "Ołtarz do całopalenia ze wszystkimi jego naczyniami i kadź z jej podstawą."
"Wj30,29": "I poświęcisz je, aby stały się najświętsze. Ktokolwiek się ich dotknie, musi być poświęcony."
"Wj30,30": "Namaścisz też Aarona i jego synów i poświęcisz ich, aby mi sprawowali urząd kapłański."
"Wj30,31": "Synom Izraela powiesz: To będzie dla mnie świętym olejkiem namaszczenia przez wszystkie wasze pokolenia;"
"Wj30,32": "Nie wolno go wylewać na ciało człowieka i nie wolno sporządzić innego o podobnym składzie, bo jest święty i dla was będzie święty."
"Wj30,33": "Ktokolwiek sporządzi podobny i namaści nim kogoś obcego, będzie wykluczony ze swego ludu."
"Wj30,34": "I PAN powiedział do Mojżesza: Weź sobie wonności: balsam, onychę, wonne galbanum i czyste kadzidło, wszystko o takiej samej wadze;"
"Wj30,35": "I uczynisz z tego wonne kadzidło, dzieło zielarza, dobrze mieszane, czyste i święte."
"Wj30,36": "Część z niego zetrzesz na proszek i będziesz go kłaść przed świadectwem w Namiocie Zgromadzenia, gdzie będę się z tobą spotykać. Będzie to najświętsze."
"Wj30,37": "Kadzideł, które sporządzicie według tego składu, nie sporządzicie dla siebie. Będzie to święte dla PANA."
"Wj30,38": "Ktokolwiek by uczynił coś podobnego, aby rozkoszować się jego wonią, będzie wykluczony ze swego ludu."
