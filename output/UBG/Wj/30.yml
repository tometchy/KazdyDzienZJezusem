"Wj30,1":
  text: "Uczynisz też ołtarz do spalania kadzidła. Uczynisz go z drewna akacjowego."
  tags: []
"Wj30,2":
  text: "Na łokieć długi i na łokieć szeroki, będzie kwadratowy, na dwa łokcie wysoki. Jego rogi będą z tego samego."
  tags: []
"Wj30,3":
  text: "Pokryjesz go szczerym złotem, jego wierzch i ściany wokoło oraz rogi. Uczynisz też dokoła niego złotą listwę."
  tags: []
"Wj30,4":
  text: "Pod listwą, na dwóch jego narożnikach, po obu jego stronach, uczynisz też dwa złote pierścienie, a przez nie przewleczesz drążki, aby był na nich noszony."
  tags: []
"Wj30,5":
  text: "Drążki te uczynisz z drewna akacjowego i pokryjesz je złotem."
  tags: []
"Wj30,6":
  text: "Następnie postawisz go przed zasłoną, za którą jest arka świadectwa, przed przebłagalnią, która jest nad świadectwem, gdzie będę się z tobą spotykać."
  tags: []
"Wj30,7":
  text: "I każdego poranka Aaron będzie spalał na nim wonne kadzidło. Gdy będzie przygotowywał lampy, będzie je spalał."
  tags: []
"Wj30,8":
  text: "Także wieczorem, gdy Aaron rozpali lampy, będzie spalał kadzidło, będzie to ustawiczne kadzenie przed PANEM przez wszystkie wasze pokolenia."
  tags: []
"Wj30,9":
  text: "Nie składajcie na nim obcego kadzidła ani całopalenia, ani ofiary pokarmowej, nie będziecie też na nim składać ofiary z płynów."
  tags: []
"Wj30,10":
  text: "Tylko raz do roku Aaron dokona na jego rogach przebłagania krwią z ofiary na przebłaganie grzechu. Raz do roku odprawi przebłaganie na nim przez wszystkie wasze pokolenia. Będzie to najświętsza rzecz dla PANA."
  tags: []
"Wj30,11":
  text: "Potem PAN powiedział do Mojżesza:"
  tags: []
"Wj30,12":
  text: "Gdy przeliczysz synów Izraela podlegających spisowi, każdy da PANU okup za swą duszę podczas spisu, aby nie dotknęła ich plaga, gdy będą zliczeni."
  tags: []
"Wj30,13":
  text: "To będzie dawać każdy, kto podlega spisowi: pół sykla według sykla świątynnego – sykl to dwadzieścia ger. Pół sykla wyniesie więc ofiara dla PANA."
  tags: []
"Wj30,14":
  text: "Każdy podległy spisowi, od dwudziestego roku życia wzwyż, odda PANU ofiarę."
  tags: []
"Wj30,15":
  text: "Bogaty nie da więcej, a ubogi nie da mniej niż pół sykla, gdy będą dawać PANU ofiarę na przebłaganie za swoje dusze."
  tags: []
"Wj30,16":
  text: "A weźmiesz pieniądze przebłagania od synów Izraela i dasz je na służbę Namiotu Zgromadzenia. Będzie to dla synów Izraela pamiątką przed PANEM, na przebłaganie za wasze dusze."
  tags: []
"Wj30,17":
  text: "Potem PAN powiedział do Mojżesza:"
  tags: []
"Wj30,18":
  text: "Uczynisz też miedzianą kadź do obmywania i do niej miedzianą podstawę i postawisz ją między Namiotem Zgromadzenia a ołtarzem, i nalejesz do niej wody."
  tags: []
"Wj30,19":
  text: "Aaron i jego synowie będą w niej obmywać swoje ręce i nogi."
  tags: []
"Wj30,20":
  text: "Gdy będą wchodzić do Namiotu Zgromadzenia, obmyją się wodą, aby nie pomarli. Podobnie gdy będą przystępować do ołtarza, aby służyć i spalać ofiarę ogniową dla PANA;"
  tags: []
"Wj30,21":
  text: "Obmyją swoje ręce i nogi, aby nie pomarli. Będzie to dla nich wieczną ustawą, dla niego i jego potomstwa, przez wszystkie ich pokolenia."
  tags: []
"Wj30,22":
  text: "PAN powiedział jeszcze do Mojżesza:"
  tags: []
"Wj30,23":
  text: "Weź sobie też najlepsze wonności: pięćset syklów najczystszej mirry, połowę tego, czyli dwieście pięćdziesiąt syklów, wonnego cynamonu i dwieście pięćdziesiąt syklów ziela tataraku;"
  tags: []
"Wj30,24":
  text: "Pięćset syklów kasji według sykla świątynnego i hin oliwy z oliwek."
  tags: []
"Wj30,25":
  text: "Uczynisz z tego święty olejek do namaszczenia, wyborną maść, dzieło zielarza. Będzie to święty olejek do namaszczenia."
  tags: []
"Wj30,26":
  text: "Namaścisz nim Namiot Zgromadzenia i arkę świadectwa;"
  tags: []
"Wj30,27":
  text: "I stół wraz ze wszystkimi jego naczyniami, świecznik i jego przybory oraz ołtarz kadzenia;"
  tags: []
"Wj30,28":
  text: "Ołtarz do całopalenia ze wszystkimi jego naczyniami i kadź z jej podstawą."
  tags: []
"Wj30,29":
  text: "I poświęcisz je, aby stały się najświętsze. Ktokolwiek się ich dotknie, musi być poświęcony."
  tags: []
"Wj30,30":
  text: "Namaścisz też Aarona i jego synów i poświęcisz ich, aby mi sprawowali urząd kapłański."
  tags: []
"Wj30,31":
  text: "Synom Izraela powiesz: To będzie dla mnie świętym olejkiem namaszczenia przez wszystkie wasze pokolenia;"
  tags: []
"Wj30,32":
  text: "Nie wolno go wylewać na ciało człowieka i nie wolno sporządzić innego o podobnym składzie, bo jest święty i dla was będzie święty."
  tags: []
"Wj30,33":
  text: "Ktokolwiek sporządzi podobny i namaści nim kogoś obcego, będzie wykluczony ze swego ludu."
  tags: []
"Wj30,34":
  text: "I PAN powiedział do Mojżesza: Weź sobie wonności: balsam, onychę, wonne galbanum i czyste kadzidło, wszystko o takiej samej wadze;"
  tags: []
"Wj30,35":
  text: "I uczynisz z tego wonne kadzidło, dzieło zielarza, dobrze mieszane, czyste i święte."
  tags: []
"Wj30,36":
  text: "Część z niego zetrzesz na proszek i będziesz go kłaść przed świadectwem w Namiocie Zgromadzenia, gdzie będę się z tobą spotykać. Będzie to najświętsze."
  tags: []
"Wj30,37":
  text: "Kadzideł, które sporządzicie według tego składu, nie sporządzicie dla siebie. Będzie to święte dla PANA."
  tags: []
"Wj30,38":
  text: "Ktokolwiek by uczynił coś podobnego, aby rozkoszować się jego wonią, będzie wykluczony ze swego ludu."
  tags: []
