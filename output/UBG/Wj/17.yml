"Wj17,1":
  text: "Całe zgromadzenie synów Izraela wyruszyło z pustyni Sin, robiąc postoje, według rozkazu PANA, i rozbili obóz w Refidim, gdzie nie było wody, aby lud mógł się napić."
  tags: []
"Wj17,2":
  text: "Dlatego lud spierał się z Mojżeszem, mówiąc: Dajcie nam wody, abyśmy się napili. Mojżesz odpowiedział im: Dlaczego kłócicie się ze mną? Czemu wystawiacie PANA na próbę?"
  tags: []
"Wj17,3":
  text: "Lud zaś pragnął tam wody i szemrał przeciwko Mojżeszowi, mówiąc: Po co wyprowadziłeś nas z Egiptu, aby uśmiercić nas, nasze dzieci i nasze bydło pragnieniem?"
  tags: []
"Wj17,4":
  text: "Wtedy Mojżesz zawołał do PANA: Cóż mam uczynić z tym ludem? Jeszcze trochę, a mnie ukamienują."
  tags: []
"Wj17,5":
  text: "I PAN powiedział do Mojżesza: Idź przed ludem i weź ze sobą niektórych ze starszych Izraela. Weź także w rękę swoją laskę, którą uderzyłeś w rzekę, i idź."
  tags: []
"Wj17,6":
  text: "Oto stanę przed tobą tam, na skale na Horebie, i uderzysz w skałę, a wypłynie z niej woda, którą lud będzie pił. I Mojżesz uczynił tak na oczach starszych Izraela."
  tags: []
"Wj17,7":
  text: "I nadał temu miejscu nazwę Massa i Meriba z powodu kłótni synów Izraela i dlatego, że wystawili na próbę PANA, mówiąc: Czy PAN jest wśród nas, czy nie?"
  tags: []
"Wj17,8":
  text: "Tymczasem Amalek nadciągnął, aby walczyć z Izraelem w Refidim."
  tags: []
"Wj17,9":
  text: "I Mojżesz powiedział do Jozuego: Wybierz nam mężczyzn, wyrusz i stocz bitwę z Amalekiem. Ja zaś jutro stanę na szczycie wzgórza z laską Boga w ręku."
  tags: []
"Wj17,10":
  text: "Jozue uczynił więc, jak mu Mojżesz rozkazał, i stoczył bitwę z Amalekiem. A Mojżesz, Aaron i Chur weszli na szczyt wzgórza."
  tags: []
"Wj17,11":
  text: "Gdy Mojżesz podnosił rękę, przeważał Izrael, a gdy opuszczał rękę, przeważał Amalek."
  tags: []
"Wj17,12":
  text: "Ale ręce Mojżesza były ociężałe. Wzięli więc kamień i podłożyli pod niego, i usiadł na nim. A Aaron i Chur podpierali jego ręce, jeden z jednej, drugi z drugiej strony. I jego ręce były stale podniesione aż do zachodu słońca."
  tags: []
"Wj17,13":
  text: "Jozue rozgromił więc Amaleka i jego lud ostrzem miecza."
  tags: []
"Wj17,14":
  text: "Wtedy PAN powiedział do Mojżesza: Zapisz to na pamiątkę w księdze i powtórz do uszu Jozuego, że wymażę zupełnie pamięć o Amaleku pod niebem."
  tags: []
"Wj17,15":
  text: "Potem Mojżesz zbudował ołtarz i nadał mu nazwę: PAN moją chorągwią;"
  tags: []
"Wj17,16":
  text: "Bo powiedział: Ręka tronu PANA i wojna PANA będzie przeciwko Amalekowi z pokolenia na pokolenie."
  tags: []
