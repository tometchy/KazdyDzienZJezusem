"Mt6,1":
  text: "Pilnujcie się, abyście waszej jałmużny nie dawali przed ludźmi po to, aby was widzieli, inaczej nie będziecie mieli nagrody u waszego Ojca, który jest w niebie."
  tags: []
"Mt6,2":
  text: "Dlatego, gdy dajesz jałmużnę, nie trąb przed sobą, jak to robią obłudnicy w synagogach i na ulicach, aby ich ludzie chwalili. Zaprawdę powiadam wam: Odbierają swoją nagrodę."
  tags: []
"Mt6,3":
  text: "Ale ty, gdy dajesz jałmużnę, niech nie wie twoja lewa ręka, co czyni prawa;"
  tags: []
"Mt6,4":
  text: "Aby twoja jałmużna pozostała w ukryciu, a twój Ojciec, który widzi w ukryciu, odda ci jawnie."
  tags: []
"Mt6,5":
  text: "A gdy się modlisz, nie bądź jak obłudnicy. Oni bowiem chętnie modlą się, stojąc w synagogach i na rogach ulic, aby ludzie ich widzieli. Zaprawdę powiadam wam: Odbierają swoją nagrodę."
  tags: []
"Mt6,6":
  text: "Ale ty, gdy się modlisz, wejdź do swego pokoju, zamknij drzwi i módl się do twego Ojca, który jest w ukryciu, a twój Ojciec, który widzi w ukryciu, odda ci jawnie."
  tags: []
"Mt6,7":
  text: "A modląc się, nie bądźcie wielomówni jak poganie; oni bowiem sądzą, że ze względu na swoją wielomówność będą wysłuchani."
  tags: []
"Mt6,8":
  text: "Nie bądźcie do nich podobni, gdyż wasz Ojciec wie, czego potrzebujecie, zanim go poprosicie."
  tags: []
"Mt6,9":
  text: "Wy więc tak się módlcie: Ojcze nasz, który jesteś w niebie, niech będzie uświęcone twoje imię."
  tags: []
"Mt6,10":
  text: "Niech przyjdzie twoje królestwo, niech się dzieje twoja wola na ziemi, tak jak w niebie."
  tags: []
"Mt6,11":
  text: "Daj nam dzisiaj naszego powszedniego chleba."
  tags: []
"Mt6,12":
  text: "I przebacz nam nasze winy, jak i my przebaczamy tym, którzy przeciw nam zawinili."
  tags: []
"Mt6,13":
  text: "I nie wystawiaj nas na pokusę, ale wybaw nas od złego; twoje bowiem jest królestwo, moc i chwała na wieki. Amen."
  tags: []
"Mt6,14":
  text: "Bo jeśli przebaczycie ludziom ich przewinienia, i wam przebaczy wasz Ojciec niebieski."
  tags: []
"Mt6,15":
  text: "Lecz jeśli nie przebaczycie ludziom ich przewinień, to i wasz Ojciec nie przebaczy wam waszych przewinień."
  tags: []
"Mt6,16":
  text: "A gdy pościcie, nie miejcie twarzy smutnej jak obłudnicy; szpecą bowiem swoje twarze, aby ludzie widzieli, że poszczą. Zaprawdę powiadam wam: Odbierają swoją nagrodę."
  tags: []
"Mt6,17":
  text: "Ale ty, gdy pościsz, namaść sobie głowę i umyj twarz;"
  tags: []
"Mt6,18":
  text: "Aby nie ludzie widzieli, że pościsz, lecz twój Ojciec, który jest w ukryciu; a twój Ojciec, który widzi w ukryciu, odda ci jawnie."
  tags: []
"Mt6,19":
  text: "Nie gromadźcie sobie skarbów na ziemi, gdzie mól i rdza niszczą i gdzie złodzieje włamują się i kradną;"
  tags: []
"Mt6,20":
  text: "Ale gromadźcie sobie skarby w niebie, gdzie ani mól, ani rdza nie niszczą i gdzie złodzieje nie włamują się i nie kradną."
  tags: []
"Mt6,21":
  text: "Gdzie bowiem jest wasz skarb, tam będzie i wasze serce."
  tags: []
"Mt6,22":
  text: "Światłem ciała jest oko. Jeśli więc twoje oko jest szczere, całe twoje ciało będzie pełne światła."
  tags: []
"Mt6,23":
  text: "Jeśli zaś twoje oko jest złe, całe twoje ciało będzie pełne ciemności. Jeśli więc światło, które jest w tobie, jest ciemnością, sama ciemność jakaż będzie?"
  tags: []
"Mt6,24":
  text: "Nikt nie może dwom panom służyć, gdyż albo jednego będzie nienawidził, a drugiego będzie miłował, albo jednego będzie się trzymał, a drugim pogardzi. Nie możecie służyć Bogu i mamonie."
  tags: []
"Mt6,25":
  text: "Dlatego mówię wam: Nie troszczcie się o wasze życie, co będziecie jeść albo co będziecie pić, ani o wasze ciało, w co będziecie się ubierać. Czyż życie nie jest czymś więcej niż pokarm, a ciało niż ubranie?"
  tags: []
"Mt6,26":
  text: "Spójrzcie na ptaki nieba, że nie sieją ani nie żną, ani nie zbierają do spichlerzy, a jednak wasz Ojciec niebieski żywi je. Czy wy nie jesteście o wiele cenniejsi niż one?"
  tags: []
"Mt6,27":
  text: "I któż z was, martwiąc się, może dodać do swego wzrostu jeden łokieć?"
  tags: []
"Mt6,28":
  text: "A o ubranie dlaczego się troszczycie? Przypatrzcie się liliom polnym, jak rosną; nie pracują ani nie przędą."
  tags: []
"Mt6,29":
  text: "A mówię wam, że nawet Salomon w całej swojej chwale nie był tak ubrany, jak jedna z nich."
  tags: []
"Mt6,30":
  text: "Jeśli więc trawę polną, która dziś jest, a jutro zostanie wrzucona do pieca, Bóg tak ubiera, czyż nie tym bardziej was, ludzie małej wiary?"
  tags: []
"Mt6,31":
  text: "Nie troszczcie się więc, mówiąc: Cóż będziemy jeść? albo: Co będziemy pić? albo: W co się ubierzemy?"
  tags: []
"Mt6,32":
  text: "Bo o to wszystko poganie zabiegają. Wie bowiem wasz Ojciec niebieski, że tego wszystkiego potrzebujecie."
  tags: []
"Mt6,33":
  text: "Ale szukajcie najpierw królestwa Bożego i jego sprawiedliwości, a to wszystko będzie wam dodane."
  tags: []
"Mt6,34":
  text: "Dlatego nie troszczcie się o dzień jutrzejszy, gdyż dzień jutrzejszy sam się zatroszczy o swoje potrzeby. Dosyć ma dzień swego utrapienia."
  tags: []
