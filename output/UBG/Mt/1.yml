"Mt1,1": "Księga rodu Jezusa Chrystusa, syna Dawida, syna Abrahama."
"Mt1,2": "Abraham spłodził Izaaka, a Izaak spłodził Jakuba, a Jakub spłodził Judę i jego braci."
"Mt1,3": "A Juda spłodził z Tamar Faresa i Zarę, a Fares spłodził Ezroma, a Ezrom spłodził Arama."
"Mt1,4": "A Aram spłodził Aminadaba, a Aminadab spłodził Naasona, a Naason spłodził Salmona."
"Mt1,5": "A Salmon spłodził z Rachab Booza, a Booz spłodził z Rut Obeda, a Obed spłodził Jessego."
"Mt1,6": "A Jesse spłodził króla Dawida, a król Dawid spłodził Salomona z tej, która była żoną Uriasza."
"Mt1,7": "A Salomon spłodził Roboama, a Roboam spłodził Abiasza, a Abiasz spłodził Azę."
"Mt1,8": "A Aza spłodził Jozafata, a Jozafat spłodził Jorama, a Joram spłodził Ozjasza."
"Mt1,9": "A Ozjasz spłodził Joatama, a Joatam spłodził Achaza, a Achaz spłodził Ezechiasza."
"Mt1,10": "A Ezechiasz spłodził Manassesa, a Manasses spłodził Amona, a Amon spłodził Jozjasza."
"Mt1,11": "A Jozjasz spłodził Jechoniasza i jego braci w czasie uprowadzenia do Babilonu."
"Mt1,12": "A po uprowadzeniu do Babilonu Jechoniasz spłodził Salatiela, a Salatiel spłodził Zorobabela."
"Mt1,13": "A Zorobabel spłodził Abiuda, a Abiud spłodził Eliakima, a Eliakim spłodził Azora."
"Mt1,14": "A Azor spłodził Sadoka, a Sadok spłodził Achima, a Achim spłodził Eliuda."
"Mt1,15": "A Eliud spłodził Eleazara, a Eleazar spłodził Matana, a Matan spłodził Jakuba."
"Mt1,16": "A Jakub spłodził Józefa, męża Marii, z której narodził się Jezus, zwany Chrystusem."
"Mt1,17": "Tak więc wszystkich pokoleń od Abrahama aż do Dawida jest czternaście; a od Dawida aż do uprowadzenia do Babilonu – pokoleń czternaście; a od uprowadzenia do Babilonu aż do Chrystusa – pokoleń czternaście."
"Mt1,18": "A z narodzeniem Jezusa Chrystusa było tak: Gdy Maria, jego matka, została zaślubiona Józefowi, zanim się zeszli, okazało się, że jest brzemienna z Ducha Świętego."
"Mt1,19": "Ale Józef, jej mąż, będąc sprawiedliwym i nie chcąc jej zniesławić, chciał ją potajemnie oddalić."
"Mt1,20": "A gdy o tym rozmyślał, oto anioł Pana ukazał mu się we śnie i powiedział: Józefie, synu Dawida, nie bój się przyjąć Marii, twojej żony. To bowiem, co się w niej poczęło, jest z Ducha Świętego."
"Mt1,21": "I urodzi syna, któremu nadasz imię Jezus. On bowiem zbawi swój lud od jego grzechów."
"Mt1,22": "A to wszystko się stało, aby się wypełniło, co powiedział Pan przez proroka:"
"Mt1,23": "Oto dziewica będzie brzemienna i urodzi syna, któremu nadadzą imię Emmanuel, co się tłumaczy: Bóg z nami."
"Mt1,24": "Wtedy Józef, obudziwszy się ze snu, uczynił tak, jak mu rozkazał anioł Pana, i przyjął swoją żonę."
"Mt1,25": "Ale nie obcował z nią, dopóki nie urodziła swego pierworodnego syna, któremu nadał imię Jezus."
