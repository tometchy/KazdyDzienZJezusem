"Mt5,1":
  text: "A Jezus, widząc tłumy, wszedł na górę, a gdy usiadł, podeszli do niego jego uczniowie."
  tags: []
"Mt5,2":
  text: "Wtedy otworzył usta i nauczał ich:"
  tags: []
"Mt5,3":
  text: "Błogosławieni ubodzy w duchu, ponieważ do nich należy królestwo niebieskie."
  tags: []
"Mt5,4":
  text: "Błogosławieni, którzy się smucą, ponieważ oni będą pocieszeni."
  tags: []
"Mt5,5":
  text: "Błogosławieni cisi, ponieważ oni odziedziczą ziemię."
  tags: []
"Mt5,6":
  text: "Błogosławieni, którzy łakną i pragną sprawiedliwości, ponieważ oni będą nasyceni."
  tags: []
"Mt5,7":
  text: "Błogosławieni miłosierni, ponieważ oni dostąpią miłosierdzia."
  tags: []
"Mt5,8":
  text: "Błogosławieni czystego serca, ponieważ oni zobaczą Boga."
  tags: []
"Mt5,9":
  text: "Błogosławieni czyniący pokój, ponieważ oni będą nazwani synami Bożymi."
  tags: []
"Mt5,10":
  text: "Błogosławieni, którzy cierpią prześladowanie z powodu sprawiedliwości, ponieważ do nich należy królestwo niebieskie."
  tags: []
"Mt5,11":
  text: "Błogosławieni jesteście, gdy z mego powodu będą wam złorzeczyć, prześladować was i mówić kłamliwie wszystko, co złe, przeciwko wam."
  tags: []
"Mt5,12":
  text: "Radujcie się i weselcie, ponieważ obfita jest wasza nagroda w niebie; tak bowiem prześladowali proroków, którzy byli przed wami."
  tags: []
"Mt5,13":
  text: "Wy jesteście solą ziemi; lecz jeśli sól zwietrzeje, czym ją posolą? Na nic się już nie przyda, tylko na wyrzucenie i podeptanie przez ludzi."
  tags: []
"Mt5,14":
  text: "Wy jesteście światłością świata. Nie może się ukryć miasto położone na górze."
  tags: []
"Mt5,15":
  text: "Nie zapala się świecy i nie stawia jej pod naczyniem, ale na świeczniku, i świeci wszystkim, którzy są w domu."
  tags: []
"Mt5,16":
  text: "Tak niech wasza światłość świeci przed ludźmi, aby widzieli wasze dobre uczynki i chwalili waszego Ojca, który jest w niebie."
  tags: []
"Mt5,17":
  text: "Nie sądźcie, że przyszedłem znieść Prawo albo Proroków. Nie przyszedłem znieść, ale wypełnić."
  tags: []
"Mt5,18":
  text: "Zaprawdę bowiem powiadam wam: Dopóki niebo i ziemia nie przeminą, ani jedna jota, ani jedna kreska nie przeminie z prawa, aż wszystko się wypełni."
  tags: []
"Mt5,19":
  text: "Kto by więc złamał jedno z tych najmniejszych przykazań i uczyłby tak ludzi, będzie nazwany najmniejszym w królestwie niebieskim. A kto by je wypełniał i uczył, ten będzie nazwany wielkim w królestwie niebieskim."
  tags: []
"Mt5,20":
  text: "Mówię wam bowiem: Jeśli wasza sprawiedliwość nie będzie obfitsza niż uczonych w Piśmie i faryzeuszy, żadnym sposobem nie wejdziecie do królestwa niebieskiego."
  tags: []
"Mt5,21":
  text: "Słyszeliście, że powiedziano przodkom: Nie będziesz zabijał, a kto by zabił, podlega sądowi."
  tags: []
"Mt5,22":
  text: "Lecz ja wam mówię: Każdy, kto się gniewa na swego brata bez przyczyny, podlega sądowi, a kto powie swemu bratu: Raka, podlega Radzie, a kto powie: Głupcze, podlega karze ognia piekielnego."
  tags: []
"Mt5,23":
  text: "Jeśli więc przyniesiesz swój dar na ołtarz i tam przypomnisz sobie, że twój brat ma coś przeciwko tobie;"
  tags: []
"Mt5,24":
  text: "Zostaw swój dar tam przed ołtarzem, idź i najpierw pojednaj się ze swoim bratem, a potem przyjdź i ofiaruj swój dar."
  tags: []
"Mt5,25":
  text: "Pogódź się ze swoim przeciwnikiem szybko, dopóki jesteś z nim w drodze, aby przeciwnik nie wydał cię sędziemu, a sędzia strażnikowi, i aby nie wtrącono cię do więzienia."
  tags: []
"Mt5,26":
  text: "Zaprawdę powiadam ci: Nie wyjdziesz stamtąd, dopóki nie oddasz ostatniego grosza."
  tags: []
"Mt5,27":
  text: "Słyszeliście, że powiedziano przodkom: Nie będziesz cudzołożył."
  tags: []
"Mt5,28":
  text: "Lecz ja wam mówię: Każdy, kto patrzy na kobietę, aby jej pożądać, już popełnił z nią cudzołóstwo w swoim sercu."
  tags: []
"Mt5,29":
  text: "Jeśli więc twoje prawe oko jest ci powodem upadku, wyłup je i odrzuć od siebie. Pożyteczniej bowiem jest dla ciebie, aby zginął jeden z twoich członków, niż żeby całe twoje ciało było wrzucone do ognia piekielnego."
  tags: []
"Mt5,30":
  text: "A jeśli twoja prawa ręka jest ci powodem upadku, odetnij ją i odrzuć od siebie. Pożyteczniej bowiem jest dla ciebie, aby zginął jeden z twoich członków, niż żeby całe twoje ciało było wrzucone do ognia piekielnego."
  tags: []
"Mt5,31":
  text: "Powiedziano też: Kto oddala swoją żonę, niech jej da list rozwodowy."
  tags: []
"Mt5,32":
  text: "Lecz ja wam mówię: Kto oddala swoją żonę – poza przypadkiem nierządu – prowadzi ją do cudzołóstwa, a kto żeni się z oddaloną, cudzołoży."
  tags: []
"Mt5,33":
  text: "Słyszeliście też, że powiedziano przodkom: Nie będziesz fałszywie przysięgał, ale dotrzymasz Panu swych przysiąg."
  tags: []
"Mt5,34":
  text: "Lecz ja wam mówię: Wcale nie przysięgajcie – ani na niebo, gdyż jest tronem Boga;"
  tags: []
"Mt5,35":
  text: "Ani na ziemię, gdyż jest podnóżkiem jego stóp, ani na Jerozolimę, gdyż jest miastem wielkiego króla."
  tags: []
"Mt5,36":
  text: "Ani na swoją głowę nie będziesz przysięgał, gdyż nie możesz jednego włosa uczynić białym albo czarnym."
  tags: []
"Mt5,37":
  text: "Ale wasza mowa niech będzie: Tak – tak, nie – nie. A co jest ponadto, pochodzi od złego."
  tags: []
"Mt5,38":
  text: "Słyszeliście, że powiedziano: Oko za oko i ząb za ząb."
  tags: []
"Mt5,39":
  text: "Lecz ja wam mówię: Nie sprzeciwiajcie się złemu, ale jeśli ktoś uderzy cię w prawy policzek, nadstaw mu i drugi."
  tags: []
"Mt5,40":
  text: "Temu, kto chce się z tobą procesować i wziąć twoją szatę, zostaw i płaszcz."
  tags: []
"Mt5,41":
  text: "A jeśli ktoś cię przymusza, żebyś szedł z nim jedną milę, idź z nim i dwie."
  tags: []
"Mt5,42":
  text: "Temu, kto cię prosi, daj, a od tego, kto chce od ciebie pożyczyć, nie odwracaj się."
  tags: []
"Mt5,43":
  text: "Słyszeliście, że powiedziano: Będziesz miłował swego bliźniego, a swego nieprzyjaciela będziesz nienawidził."
  tags: []
"Mt5,44":
  text: "Lecz ja wam mówię: Miłujcie waszych nieprzyjaciół, błogosławcie tym, którzy was przeklinają, dobrze czyńcie tym, którzy was nienawidzą i módlcie się za tych, którzy wam wyrządzają zło i prześladują was;"
  tags: []
"Mt5,45":
  text: "Abyście byli synami waszego Ojca, który jest w niebie. On bowiem sprawia, że jego słońce wschodzi nad złymi i nad dobrymi i deszcz zsyła na sprawiedliwych i niesprawiedliwych."
  tags: []
"Mt5,46":
  text: "Jeśli bowiem miłujecie tych, którzy was miłują, jakąż macie nagrodę? Czyż i celnicy tego nie czynią?"
  tags: []
"Mt5,47":
  text: "A jeśli tylko waszych braci pozdrawiacie, cóż szczególnego czynicie? Czyż i celnicy tak nie czynią?"
  tags: []
"Mt5,48":
  text: "Bądźcie więc doskonali, tak jak doskonały jest wasz Ojciec, który jest w niebie."
  tags: []
