"Mt4,1":
  text: "Wtedy Jezus został zaprowadzony przez Ducha na pustynię, aby był kuszony przez diabła."
  tags: []
"Mt4,2":
  text: "A po czterdziestu dniach i czterdziestu nocach postu poczuł głód."
  tags: []
"Mt4,3":
  text: "Wówczas przystąpił do niego kusiciel i powiedział: Jeśli jesteś Synem Bożym, powiedz, aby te kamienie stały się chlebem."
  tags: []
"Mt4,4":
  text: "A on odpowiedział: Jest napisane: Nie samym chlebem będzie żył człowiek, ale każdym słowem pochodzącym z ust Boga."
  tags: []
"Mt4,5":
  text: "Wtedy diabeł wziął go do miasta świętego i postawił na szczycie świątyni."
  tags: []
"Mt4,6":
  text: "I powiedział mu: Jeśli jesteś Synem Bożym, rzuć się w dół, jest bowiem napisane: Rozkaże o tobie swoim aniołom i będą cię nosić na rękach, abyś nie uderzył swojej nogi o kamień."
  tags: []
"Mt4,7":
  text: "Jezus mu odpowiedział: Jest też napisane: Nie będziesz wystawiał na próbę Pana, swego Boga."
  tags: []
"Mt4,8":
  text: "Znowu wziął go diabeł na bardzo wysoką górę i pokazał mu wszystkie królestwa świata oraz ich wspaniałość."
  tags: []
"Mt4,9":
  text: "I powiedział do niego: Dam ci to wszystko, jeśli upadniesz i oddasz mi pokłon."
  tags: []
"Mt4,10":
  text: "Wtedy Jezus powiedział mu: Idź precz, szatanie! Jest bowiem napisane: Panu, swemu Bogu, będziesz oddawał pokłon i tylko jemu będziesz służył."
  tags: []
"Mt4,11":
  text: "Wówczas diabeł go opuścił, a oto aniołowie przystąpili do niego i mu służyli."
  tags: []
"Mt4,12":
  text: "A gdy Jezus usłyszał, że Jan został wtrącony do więzienia, wrócił do Galilei."
  tags: []
"Mt4,13":
  text: "A opuściwszy Nazaret, przyszedł i zamieszkał w Kafarnaum, które leży nad morzem, w granicach Zabulona i Neftalego;"
  tags: []
"Mt4,14":
  text: "Aby się wypełniło, co zostało powiedziane przez proroka Izajasza:"
  tags: []
"Mt4,15":
  text: "Ziemia Zabulona i ziemia Neftalego, wzdłuż drogi nadmorskiej, za Jordanem, Galilea pogan."
  tags: []
"Mt4,16":
  text: "Lud, który siedział w ciemności, ujrzał światłość wielką, a siedzącym w krainie i cieniu śmierci wzeszła światłość."
  tags: []
"Mt4,17":
  text: "Od tego czasu Jezus zaczął głosić i mówić: Pokutujcie, przybliżyło się bowiem królestwo niebieskie."
  tags: []
"Mt4,18":
  text: "A gdy Jezus przechodził nad Morzem Galilejskim, zobaczył dwóch braci: Szymona, zwanego Piotrem, i Andrzeja, jego brata, którzy zapuszczali sieć w morze; byli bowiem rybakami."
  tags: []
"Mt4,19":
  text: "I powiedział im: Chodźcie za mną, a uczynię was rybakami ludzi."
  tags: []
"Mt4,20":
  text: "Oni natychmiast porzucili sieci i poszli za nim."
  tags: []
"Mt4,21":
  text: "A gdy poszedł stamtąd dalej, zobaczył innych dwóch braci, Jakuba, syna Zebedeusza, i Jana, jego brata, jak ze swoim ojcem Zebedeuszem naprawiali w łodzi swoje sieci. I wezwał ich."
  tags: []
"Mt4,22":
  text: "A oni natychmiast opuścili łódź i swego ojca i poszli za nim."
  tags: []
"Mt4,23":
  text: "I obchodził Jezus całą Galileę, nauczając w ich synagogach, głosząc ewangelię królestwa i uzdrawiając wszystkie choroby i wszelkie dolegliwości wśród ludzi."
  tags: []
"Mt4,24":
  text: "A wieść o nim rozeszła się po całej Syrii. I przyprowadzano do niego wszystkich, którzy się źle czuli, którzy byli nękani różnymi chorobami i cierpieniami, a także opętanych, obłąkanych i sparaliżowanych, a on ich uzdrawiał."
  tags: []
"Mt4,25":
  text: "A szło za nim mnóstwo ludzi z Galilei i Dekapolu, Jerozolimy, Judei i Zajordania."
  tags: []
