"Mt4,1": "Wtedy Jezus został zaprowadzony przez Ducha na pustynię, aby był kuszony przez diabła."
"Mt4,2": "A po czterdziestu dniach i czterdziestu nocach postu poczuł głód."
"Mt4,3": "Wówczas przystąpił do niego kusiciel i powiedział: Jeśli jesteś Synem Bożym, powiedz, aby te kamienie stały się chlebem."
"Mt4,4": "A on odpowiedział: Jest napisane: Nie samym chlebem będzie żył człowiek, ale każdym słowem pochodzącym z ust Boga."
"Mt4,5": "Wtedy diabeł wziął go do miasta świętego i postawił na szczycie świątyni."
"Mt4,6": "I powiedział mu: Jeśli jesteś Synem Bożym, rzuć się w dół, jest bowiem napisane: Rozkaże o tobie swoim aniołom i będą cię nosić na rękach, abyś nie uderzył swojej nogi o kamień."
"Mt4,7": "Jezus mu odpowiedział: Jest też napisane: Nie będziesz wystawiał na próbę Pana, swego Boga."
"Mt4,8": "Znowu wziął go diabeł na bardzo wysoką górę i pokazał mu wszystkie królestwa świata oraz ich wspaniałość."
"Mt4,9": "I powiedział do niego: Dam ci to wszystko, jeśli upadniesz i oddasz mi pokłon."
"Mt4,10": "Wtedy Jezus powiedział mu: Idź precz, szatanie! Jest bowiem napisane: Panu, swemu Bogu, będziesz oddawał pokłon i tylko jemu będziesz służył."
"Mt4,11": "Wówczas diabeł go opuścił, a oto aniołowie przystąpili do niego i mu służyli."
"Mt4,12": "A gdy Jezus usłyszał, że Jan został wtrącony do więzienia, wrócił do Galilei."
"Mt4,13": "A opuściwszy Nazaret, przyszedł i zamieszkał w Kafarnaum, które leży nad morzem, w granicach Zabulona i Neftalego;"
"Mt4,14": "Aby się wypełniło, co zostało powiedziane przez proroka Izajasza:"
"Mt4,15": "Ziemia Zabulona i ziemia Neftalego, wzdłuż drogi nadmorskiej, za Jordanem, Galilea pogan."
"Mt4,16": "Lud, który siedział w ciemności, ujrzał światłość wielką, a siedzącym w krainie i cieniu śmierci wzeszła światłość."
"Mt4,17": "Od tego czasu Jezus zaczął głosić i mówić: Pokutujcie, przybliżyło się bowiem królestwo niebieskie."
"Mt4,18": "A gdy Jezus przechodził nad Morzem Galilejskim, zobaczył dwóch braci: Szymona, zwanego Piotrem, i Andrzeja, jego brata, którzy zapuszczali sieć w morze; byli bowiem rybakami."
"Mt4,19": "I powiedział im: Chodźcie za mną, a uczynię was rybakami ludzi."
"Mt4,20": "Oni natychmiast porzucili sieci i poszli za nim."
"Mt4,21": "A gdy poszedł stamtąd dalej, zobaczył innych dwóch braci, Jakuba, syna Zebedeusza, i Jana, jego brata, jak ze swoim ojcem Zebedeuszem naprawiali w łodzi swoje sieci. I wezwał ich."
"Mt4,22": "A oni natychmiast opuścili łódź i swego ojca i poszli za nim."
"Mt4,23": "I obchodził Jezus całą Galileę, nauczając w ich synagogach, głosząc ewangelię królestwa i uzdrawiając wszystkie choroby i wszelkie dolegliwości wśród ludzi."
"Mt4,24": "A wieść o nim rozeszła się po całej Syrii. I przyprowadzano do niego wszystkich, którzy się źle czuli, którzy byli nękani różnymi chorobami i cierpieniami, a także opętanych, obłąkanych i sparaliżowanych, a on ich uzdrawiał."
"Mt4,25": "A szło za nim mnóstwo ludzi z Galilei i Dekapolu, Jerozolimy, Judei i Zajordania."
