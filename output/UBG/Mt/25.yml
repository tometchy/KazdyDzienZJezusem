"Mt25,1": "Wtedy królestwo niebieskie będzie podobne do dziesięciu dziewic, które wzięły swoje lampy i wyszły na spotkanie oblubieńca."
"Mt25,2": "Pięć z nich było mądrych, a pięć głupich."
"Mt25,3": "Te głupie, wziąwszy swoje lampy, nie wzięły ze sobą oliwy."
"Mt25,4": "Lecz mądre wraz z lampami zabrały oliwę w naczyniach."
"Mt25,5": "A gdy oblubieniec zwlekał z przyjściem, wszystkie zmorzył sen i zasnęły."
"Mt25,6": "O północy zaś rozległ się krzyk: Oblubieniec idzie, wyjdźcie mu na spotkanie!"
"Mt25,7": "Wtedy wstały wszystkie te dziewice i przygotowały swoje lampy."
"Mt25,8": "A głupie powiedziały do mądrych: Dajcie nam ze swej oliwy, bo nasze lampy gasną."
"Mt25,9": "I odpowiedziały mądre: Nie damy, bo mogłoby i nam, i wam nie wystarczyć. Idźcie raczej do sprzedawców i kupcie sobie."
"Mt25,10": "A gdy odeszły kupić, nadszedł oblubieniec. Te, które były gotowe, weszły z nim na wesele i zamknięto drzwi."
"Mt25,11": "Potem przyszły też pozostałe dziewice i powiedziały: Panie, Panie, otwórz nam!"
"Mt25,12": "Lecz on odpowiedział: Zaprawdę powiadam wam, nie znam was."
"Mt25,13": "Czuwajcie więc, bo nie znacie dnia ani godziny, o której Syn Człowieczy przyjdzie."
"Mt25,14": "Królestwo niebieskie bowiem podobne jest do człowieka, który odjeżdżając, zwołał swoje sługi i powierzył im swoje dobra."
"Mt25,15": "Jednemu dał pięć talentów, drugiemu dwa, a trzeciemu jeden, każdemu według jego zdolności, i zaraz odjechał."
"Mt25,16": "A ten, który otrzymał pięć talentów, poszedł, obracał nimi i zyskał drugie pięć talentów."
"Mt25,17": "Tak samo i ten, który otrzymał dwa, zyskał drugie dwa."
"Mt25,18": "Ten zaś, który otrzymał jeden, poszedł, wykopał dół w ziemi i ukrył pieniądze swego pana."
"Mt25,19": "A po dłuższym czasie przybył pan tych sług i zaczął się z nimi rozliczać."
"Mt25,20": "Wówczas przyszedł ten, który otrzymał pięć talentów, przyniósł drugie pięć talentów i powiedział: Panie, powierzyłeś mi pięć talentów, oto drugie pięć talentów zyskałem."
"Mt25,21": "I powiedział mu jego pan: Dobrze, sługo dobry i wierny! W niewielu rzeczach byłeś wierny, nad wieloma cię ustanowię. Wejdź do radości swego pana."
"Mt25,22": "Przyszedł i ten, który otrzymał dwa talenty i powiedział: Panie, powierzyłeś mi dwa talenty, oto drugie dwa talenty zyskałem."
"Mt25,23": "Powiedział mu jego pan: Dobrze, sługo dobry i wierny! Ponieważ byłeś wierny w niewielu rzeczach, nad wieloma cię ustanowię. Wejdź do radości swego pana."
"Mt25,24": "Przyszedł i ten, który otrzymał jeden talent i powiedział: Panie, wiedziałem, że jesteś człowiekiem surowym: żniesz, gdzie nie posiałeś i zbierasz, gdzie nie rozsypałeś."
"Mt25,25": "Bojąc się więc, poszedłem i ukryłem twój talent w ziemi. Oto masz, co twoje."
"Mt25,26": "A jego pan mu odpowiedział: Sługo zły i leniwy! Wiedziałeś, że żnę, gdzie nie posiałem i zbieram, gdzie nie rozsypałem."
"Mt25,27": "Powinieneś więc był dać moje pieniądze bankierom, a ja po powrocie odebrałbym to, co moje, z zyskiem."
"Mt25,28": "Dlatego odbierzcie mu ten talent i dajcie temu, który ma dziesięć talentów."
"Mt25,29": "Każdemu bowiem, kto ma, będzie dane i będzie miał w obfitości. Temu zaś, kto nie ma, zostanie zabrane nawet to, co ma."
"Mt25,30": "A nieużytecznego sługę wrzućcie w ciemności zewnętrzne. Tam będzie płacz i zgrzytanie zębów."
"Mt25,31": "Gdy Syn Człowieczy przyjdzie w swojej chwale i wszyscy święci aniołowie z nim, wtedy zasiądzie na tronie swojej chwały."
"Mt25,32": "I będą zgromadzone przed nim wszystkie narody, a on odłączy jedne od drugich, jak pasterz odłącza owce od kozłów."
"Mt25,33": "I postawi owce po swojej prawej, a kozły po lewej stronie."
"Mt25,34": "Wtedy król powie do tych, którzy będą po jego prawej stronie: Przyjdźcie, błogosławieni mego Ojca, odziedziczcie królestwo przygotowane dla was od założenia świata."
"Mt25,35": "Byłem bowiem głodny, a daliście mi jeść, byłem spragniony, a daliście mi pić, byłem obcym, a przyjęliście mnie;"
"Mt25,36": "Byłem nagi, a ubraliście mnie, byłem chory, a odwiedziliście mnie, byłem w więzieniu, a przyszliście do mnie."
"Mt25,37": "Wtedy sprawiedliwi mu odpowiedzą: Panie, kiedy widzieliśmy cię głodnym i nakarmiliśmy cię albo spragnionym i daliśmy ci pić?"
"Mt25,38": "I kiedy widzieliśmy cię obcym i przyjęliśmy cię albo nagim i ubraliśmy cię?"
"Mt25,39": "Albo kiedy widzieliśmy cię chorym lub w więzieniu i przyszliśmy do ciebie?"
"Mt25,40": "A król im odpowie: Zaprawdę powiadam wam: To, co uczyniliście jednemu z tych moich braci najmniejszych, mnie uczyniliście."
"Mt25,41": "Potem powie i do tych, którzy będą po lewej stronie: Idźcie ode mnie, przeklęci, w ogień wieczny, przygotowany dla diabła i jego aniołów."
"Mt25,42": "Byłem bowiem głodny, a nie daliście mi jeść, byłem spragniony, a nie daliście mi pić;"
"Mt25,43": "Byłem obcym, a nie przyjęliście mnie, byłem nagi, a nie ubraliście mnie, byłem chory i w więzieniu, a nie odwiedziliście mnie."
"Mt25,44": "Wtedy i oni mu odpowiedzą: Panie, kiedy widzieliśmy cię głodnym albo spragnionym, albo obcym, albo nagim, albo chorym, albo w więzieniu, a nie usłużyliśmy tobie?"
"Mt25,45": "Wówczas im odpowie: Zaprawdę powiadam wam, czego nie uczyniliście jednemu z tych najmniejszych, nie uczyniliście i mnie."
"Mt25,46": "I pójdą ci na męki wieczne, sprawiedliwi zaś do życia wiecznego."
