"Mt25,1":
  text: "Wtedy królestwo niebieskie będzie podobne do dziesięciu dziewic, które wzięły swoje lampy i wyszły na spotkanie oblubieńca."
  tags: []
"Mt25,2":
  text: "Pięć z nich było mądrych, a pięć głupich."
  tags: []
"Mt25,3":
  text: "Te głupie, wziąwszy swoje lampy, nie wzięły ze sobą oliwy."
  tags: []
"Mt25,4":
  text: "Lecz mądre wraz z lampami zabrały oliwę w naczyniach."
  tags: []
"Mt25,5":
  text: "A gdy oblubieniec zwlekał z przyjściem, wszystkie zmorzył sen i zasnęły."
  tags: []
"Mt25,6":
  text: "O północy zaś rozległ się krzyk: Oblubieniec idzie, wyjdźcie mu na spotkanie!"
  tags: []
"Mt25,7":
  text: "Wtedy wstały wszystkie te dziewice i przygotowały swoje lampy."
  tags: []
"Mt25,8":
  text: "A głupie powiedziały do mądrych: Dajcie nam ze swej oliwy, bo nasze lampy gasną."
  tags: []
"Mt25,9":
  text: "I odpowiedziały mądre: Nie damy, bo mogłoby i nam, i wam nie wystarczyć. Idźcie raczej do sprzedawców i kupcie sobie."
  tags: []
"Mt25,10":
  text: "A gdy odeszły kupić, nadszedł oblubieniec. Te, które były gotowe, weszły z nim na wesele i zamknięto drzwi."
  tags: []
"Mt25,11":
  text: "Potem przyszły też pozostałe dziewice i powiedziały: Panie, Panie, otwórz nam!"
  tags: []
"Mt25,12":
  text: "Lecz on odpowiedział: Zaprawdę powiadam wam, nie znam was."
  tags: []
"Mt25,13":
  text: "Czuwajcie więc, bo nie znacie dnia ani godziny, o której Syn Człowieczy przyjdzie."
  tags: []
"Mt25,14":
  text: "Królestwo niebieskie bowiem podobne jest do człowieka, który odjeżdżając, zwołał swoje sługi i powierzył im swoje dobra."
  tags: []
"Mt25,15":
  text: "Jednemu dał pięć talentów, drugiemu dwa, a trzeciemu jeden, każdemu według jego zdolności, i zaraz odjechał."
  tags: []
"Mt25,16":
  text: "A ten, który otrzymał pięć talentów, poszedł, obracał nimi i zyskał drugie pięć talentów."
  tags: []
"Mt25,17":
  text: "Tak samo i ten, który otrzymał dwa, zyskał drugie dwa."
  tags: []
"Mt25,18":
  text: "Ten zaś, który otrzymał jeden, poszedł, wykopał dół w ziemi i ukrył pieniądze swego pana."
  tags: []
"Mt25,19":
  text: "A po dłuższym czasie przybył pan tych sług i zaczął się z nimi rozliczać."
  tags: []
"Mt25,20":
  text: "Wówczas przyszedł ten, który otrzymał pięć talentów, przyniósł drugie pięć talentów i powiedział: Panie, powierzyłeś mi pięć talentów, oto drugie pięć talentów zyskałem."
  tags: []
"Mt25,21":
  text: "I powiedział mu jego pan: Dobrze, sługo dobry i wierny! W niewielu rzeczach byłeś wierny, nad wieloma cię ustanowię. Wejdź do radości swego pana."
  tags: []
"Mt25,22":
  text: "Przyszedł i ten, który otrzymał dwa talenty i powiedział: Panie, powierzyłeś mi dwa talenty, oto drugie dwa talenty zyskałem."
  tags: []
"Mt25,23":
  text: "Powiedział mu jego pan: Dobrze, sługo dobry i wierny! Ponieważ byłeś wierny w niewielu rzeczach, nad wieloma cię ustanowię. Wejdź do radości swego pana."
  tags: []
"Mt25,24":
  text: "Przyszedł i ten, który otrzymał jeden talent i powiedział: Panie, wiedziałem, że jesteś człowiekiem surowym: żniesz, gdzie nie posiałeś i zbierasz, gdzie nie rozsypałeś."
  tags: []
"Mt25,25":
  text: "Bojąc się więc, poszedłem i ukryłem twój talent w ziemi. Oto masz, co twoje."
  tags: []
"Mt25,26":
  text: "A jego pan mu odpowiedział: Sługo zły i leniwy! Wiedziałeś, że żnę, gdzie nie posiałem i zbieram, gdzie nie rozsypałem."
  tags: []
"Mt25,27":
  text: "Powinieneś więc był dać moje pieniądze bankierom, a ja po powrocie odebrałbym to, co moje, z zyskiem."
  tags: []
"Mt25,28":
  text: "Dlatego odbierzcie mu ten talent i dajcie temu, który ma dziesięć talentów."
  tags: []
"Mt25,29":
  text: "Każdemu bowiem, kto ma, będzie dane i będzie miał w obfitości. Temu zaś, kto nie ma, zostanie zabrane nawet to, co ma."
  tags: []
"Mt25,30":
  text: "A nieużytecznego sługę wrzućcie w ciemności zewnętrzne. Tam będzie płacz i zgrzytanie zębów."
  tags: []
"Mt25,31":
  text: "Gdy Syn Człowieczy przyjdzie w swojej chwale i wszyscy święci aniołowie z nim, wtedy zasiądzie na tronie swojej chwały."
  tags: []
"Mt25,32":
  text: "I będą zgromadzone przed nim wszystkie narody, a on odłączy jedne od drugich, jak pasterz odłącza owce od kozłów."
  tags: []
"Mt25,33":
  text: "I postawi owce po swojej prawej, a kozły po lewej stronie."
  tags: []
"Mt25,34":
  text: "Wtedy król powie do tych, którzy będą po jego prawej stronie: Przyjdźcie, błogosławieni mego Ojca, odziedziczcie królestwo przygotowane dla was od założenia świata."
  tags: []
"Mt25,35":
  text: "Byłem bowiem głodny, a daliście mi jeść, byłem spragniony, a daliście mi pić, byłem obcym, a przyjęliście mnie;"
  tags: []
"Mt25,36":
  text: "Byłem nagi, a ubraliście mnie, byłem chory, a odwiedziliście mnie, byłem w więzieniu, a przyszliście do mnie."
  tags: []
"Mt25,37":
  text: "Wtedy sprawiedliwi mu odpowiedzą: Panie, kiedy widzieliśmy cię głodnym i nakarmiliśmy cię albo spragnionym i daliśmy ci pić?"
  tags: []
"Mt25,38":
  text: "I kiedy widzieliśmy cię obcym i przyjęliśmy cię albo nagim i ubraliśmy cię?"
  tags: []
"Mt25,39":
  text: "Albo kiedy widzieliśmy cię chorym lub w więzieniu i przyszliśmy do ciebie?"
  tags: []
"Mt25,40":
  text: "A król im odpowie: Zaprawdę powiadam wam: To, co uczyniliście jednemu z tych moich braci najmniejszych, mnie uczyniliście."
  tags: []
"Mt25,41":
  text: "Potem powie i do tych, którzy będą po lewej stronie: Idźcie ode mnie, przeklęci, w ogień wieczny, przygotowany dla diabła i jego aniołów."
  tags: []
"Mt25,42":
  text: "Byłem bowiem głodny, a nie daliście mi jeść, byłem spragniony, a nie daliście mi pić;"
  tags: []
"Mt25,43":
  text: "Byłem obcym, a nie przyjęliście mnie, byłem nagi, a nie ubraliście mnie, byłem chory i w więzieniu, a nie odwiedziliście mnie."
  tags: []
"Mt25,44":
  text: "Wtedy i oni mu odpowiedzą: Panie, kiedy widzieliśmy cię głodnym albo spragnionym, albo obcym, albo nagim, albo chorym, albo w więzieniu, a nie usłużyliśmy tobie?"
  tags: []
"Mt25,45":
  text: "Wówczas im odpowie: Zaprawdę powiadam wam, czego nie uczyniliście jednemu z tych najmniejszych, nie uczyniliście i mnie."
  tags: []
"Mt25,46":
  text: "I pójdą ci na męki wieczne, sprawiedliwi zaś do życia wiecznego."
  tags: []
