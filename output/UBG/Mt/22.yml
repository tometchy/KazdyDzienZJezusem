"Mt22,1": "A Jezus, odpowiadając, znowu mówił do nich w przypowieściach tymi słowy:"
"Mt22,2": "Królestwo niebieskie podobne jest do króla, który wyprawił wesele swemu synowi."
"Mt22,3": "I posłał swe sługi, aby wezwali zaproszonych na wesele, ale oni nie chcieli przyjść."
"Mt22,4": "Ponownie posłał inne sługi, mówiąc: Powiedzcie zaproszonym: Oto przygotowałem moją ucztę, zabito moje woły i tuczne zwierzęta i wszystko jest gotowe. Chodźcie na wesele."
"Mt22,5": "Lecz oni zlekceważyli to i odeszli, jeden na swoje pole, a inny do swego kupiectwa;"
"Mt22,6": "A inni schwytali jego sługi, znieważyli ich i zabili."
"Mt22,7": "Gdy król to usłyszał, rozgniewał się, a posławszy swoje wojska, wytracił tych morderców i spalił ich miasto."
"Mt22,8": "Potem powiedział swoim sługom: Wesele wprawdzie jest gotowe, lecz zaproszeni nie byli godni."
"Mt22,9": "Idźcie więc na rozstaje dróg i zaproście na wesele wszystkich, których spotkacie."
"Mt22,10": "Wtedy słudzy ci wyszli na drogi i zgromadzili wszystkich, których spotkali, złych i dobrych. I sala weselna napełniła się gośćmi."
"Mt22,11": "A gdy król wszedł, aby zobaczyć gości, ujrzał tam człowieka, który nie był ubrany w strój weselny."
"Mt22,12": "I zapytał go: Przyjacielu, jak tu wszedłeś, nie mając stroju weselnego? A on zaniemówił."
"Mt22,13": "Wtedy król powiedział sługom: Zwiążcie mu nogi i ręce, weźcie go i wrzućcie do ciemności zewnętrznych. Tam będzie płacz i zgrzytanie zębów."
"Mt22,14": "Wielu jest bowiem wezwanych, lecz mało wybranych."
"Mt22,15": "Wtedy faryzeusze odeszli i naradzali się, jak by go usidlić w mowie."
"Mt22,16": "I posłali do niego swoich uczniów wraz z herodianami, którzy powiedzieli: Nauczycielu, wiemy, że jesteś prawdziwy i drogi Bożej w prawdzie nauczasz, i nie zważasz na nikogo. Nie oglądasz się bowiem na osobę ludzką."
"Mt22,17": "Powiedz nam więc, jak ci się wydaje: Czy wolno płacić podatek cesarzowi, czy nie?"
"Mt22,18": "Ale Jezus poznał ich niegodziwość i powiedział: Czemu wystawiacie mnie na próbę, obłudnicy?"
"Mt22,19": "Pokażcie mi monetę podatkową. I podali mu grosz."
"Mt22,20": "A on ich zapytał: Czyj to wizerunek i napis?"
"Mt22,21": "Odpowiedzieli mu: Cesarza. Wtedy powiedział im: Oddajcie więc cesarzowi to, co należy do cesarza, a Bogu to, co należy do Boga."
"Mt22,22": "A gdy to usłyszeli, zdziwili się, zostawili go i odeszli."
"Mt22,23": "Tego dnia przyszli do niego saduceusze, którzy mówią, że nie ma zmartwychwstania, i pytali go:"
"Mt22,24": "Nauczycielu, Mojżesz powiedział: Jeśli ktoś umrze, nie mając dzieci, to jego brat ma ożenić się z jego żoną i wzbudzić potomstwo swemu bratu."
"Mt22,25": "Było więc u nas siedmiu braci. Pierwszy ożenił się i umarł, a nie mając potomstwa, zostawił żonę swemu bratu."
"Mt22,26": "Podobnie drugi i trzeci, aż do siódmego."
"Mt22,27": "A w końcu po wszystkich umarła też ta kobieta."
"Mt22,28": "Żoną którego z tych siedmiu będzie więc przy zmartwychwstaniu? Gdyż wszyscy ją mieli za żonę."
"Mt22,29": "A Jezus im odpowiedział: Błądzicie, nie znając Pisma ani mocy Boga."
"Mt22,30": "Przy zmartwychwstaniu bowiem ani nie będą się żenić, ani za mąż wychodzić, ale będą jak aniołowie Boga w niebie."
"Mt22,31": "A co do zmartwychwstania umarłych, czy nie czytaliście, co wam zostało powiedziane przez Boga:"
"Mt22,32": "Ja jestem Bogiem Abrahama, Bogiem Izaaka i Bogiem Jakuba? Bóg nie jest Bogiem umarłych, ale żywych."
"Mt22,33": "A tłumy, słysząc to, zdumiewały się jego nauką."
"Mt22,34": "Lecz gdy faryzeusze usłyszeli, że zamknął usta saduceuszom, zeszli się razem."
"Mt22,35": "I jeden z nich, znawca prawa, wystawiając go na próbę, spytał:"
"Mt22,36": "Nauczycielu, które przykazanie w prawie jest największe?"
"Mt22,37": "A Jezus mu odpowiedział: Będziesz miłował Pana, swego Boga, całym swym sercem, całą swą duszą i całym swym umysłem."
"Mt22,38": "To jest pierwsze i największe przykazanie."
"Mt22,39": "A drugie jest do niego podobne: Będziesz miłował swego bliźniego jak samego siebie."
"Mt22,40": "Na tych dwóch przykazaniach opiera się całe Prawo i Prorocy."
"Mt22,41": "A gdy faryzeusze byli zebrani, Jezus ich zapytał:"
"Mt22,42": "Co sądzicie o Chrystusie? Czyim jest synem? Odpowiedzieli mu: Dawida."
"Mt22,43": "I powiedział im: Jakże więc Dawid w Duchu nazywa go Panem, mówiąc:"
"Mt22,44": "Powiedział Pan memu Panu: Siądź po mojej prawicy, aż położę twoich nieprzyjaciół jako podnóżek pod twoje stopy?"
"Mt22,45": "Jeśli więc Dawid nazywa go Panem, to jakże może być jego synem?"
"Mt22,46": "I nikt nie mógł mu odpowiedzieć ani słowa. Od tego też dnia nikt nie śmiał go więcej pytać."
