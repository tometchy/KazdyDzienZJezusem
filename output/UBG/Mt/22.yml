"Mt22,1":
  text: "A Jezus, odpowiadając, znowu mówił do nich w przypowieściach tymi słowy:"
  tags: []
"Mt22,2":
  text: "Królestwo niebieskie podobne jest do króla, który wyprawił wesele swemu synowi."
  tags: []
"Mt22,3":
  text: "I posłał swe sługi, aby wezwali zaproszonych na wesele, ale oni nie chcieli przyjść."
  tags: []
"Mt22,4":
  text: "Ponownie posłał inne sługi, mówiąc: Powiedzcie zaproszonym: Oto przygotowałem moją ucztę, zabito moje woły i tuczne zwierzęta i wszystko jest gotowe. Chodźcie na wesele."
  tags: []
"Mt22,5":
  text: "Lecz oni zlekceważyli to i odeszli, jeden na swoje pole, a inny do swego kupiectwa;"
  tags: []
"Mt22,6":
  text: "A inni schwytali jego sługi, znieważyli ich i zabili."
  tags: []
"Mt22,7":
  text: "Gdy król to usłyszał, rozgniewał się, a posławszy swoje wojska, wytracił tych morderców i spalił ich miasto."
  tags: []
"Mt22,8":
  text: "Potem powiedział swoim sługom: Wesele wprawdzie jest gotowe, lecz zaproszeni nie byli godni."
  tags: []
"Mt22,9":
  text: "Idźcie więc na rozstaje dróg i zaproście na wesele wszystkich, których spotkacie."
  tags: []
"Mt22,10":
  text: "Wtedy słudzy ci wyszli na drogi i zgromadzili wszystkich, których spotkali, złych i dobrych. I sala weselna napełniła się gośćmi."
  tags: []
"Mt22,11":
  text: "A gdy król wszedł, aby zobaczyć gości, ujrzał tam człowieka, który nie był ubrany w strój weselny."
  tags: []
"Mt22,12":
  text: "I zapytał go: Przyjacielu, jak tu wszedłeś, nie mając stroju weselnego? A on zaniemówił."
  tags: []
"Mt22,13":
  text: "Wtedy król powiedział sługom: Zwiążcie mu nogi i ręce, weźcie go i wrzućcie do ciemności zewnętrznych. Tam będzie płacz i zgrzytanie zębów."
  tags: []
"Mt22,14":
  text: "Wielu jest bowiem wezwanych, lecz mało wybranych."
  tags: []
"Mt22,15":
  text: "Wtedy faryzeusze odeszli i naradzali się, jak by go usidlić w mowie."
  tags: []
"Mt22,16":
  text: "I posłali do niego swoich uczniów wraz z herodianami, którzy powiedzieli: Nauczycielu, wiemy, że jesteś prawdziwy i drogi Bożej w prawdzie nauczasz, i nie zważasz na nikogo. Nie oglądasz się bowiem na osobę ludzką."
  tags: []
"Mt22,17":
  text: "Powiedz nam więc, jak ci się wydaje: Czy wolno płacić podatek cesarzowi, czy nie?"
  tags: []
"Mt22,18":
  text: "Ale Jezus poznał ich niegodziwość i powiedział: Czemu wystawiacie mnie na próbę, obłudnicy?"
  tags: []
"Mt22,19":
  text: "Pokażcie mi monetę podatkową. I podali mu grosz."
  tags: []
"Mt22,20":
  text: "A on ich zapytał: Czyj to wizerunek i napis?"
  tags: []
"Mt22,21":
  text: "Odpowiedzieli mu: Cesarza. Wtedy powiedział im: Oddajcie więc cesarzowi to, co należy do cesarza, a Bogu to, co należy do Boga."
  tags: []
"Mt22,22":
  text: "A gdy to usłyszeli, zdziwili się, zostawili go i odeszli."
  tags: []
"Mt22,23":
  text: "Tego dnia przyszli do niego saduceusze, którzy mówią, że nie ma zmartwychwstania, i pytali go:"
  tags: []
"Mt22,24":
  text: "Nauczycielu, Mojżesz powiedział: Jeśli ktoś umrze, nie mając dzieci, to jego brat ma ożenić się z jego żoną i wzbudzić potomstwo swemu bratu."
  tags: []
"Mt22,25":
  text: "Było więc u nas siedmiu braci. Pierwszy ożenił się i umarł, a nie mając potomstwa, zostawił żonę swemu bratu."
  tags: []
"Mt22,26":
  text: "Podobnie drugi i trzeci, aż do siódmego."
  tags: []
"Mt22,27":
  text: "A w końcu po wszystkich umarła też ta kobieta."
  tags: []
"Mt22,28":
  text: "Żoną którego z tych siedmiu będzie więc przy zmartwychwstaniu? Gdyż wszyscy ją mieli za żonę."
  tags: []
"Mt22,29":
  text: "A Jezus im odpowiedział: Błądzicie, nie znając Pisma ani mocy Boga."
  tags: []
"Mt22,30":
  text: "Przy zmartwychwstaniu bowiem ani nie będą się żenić, ani za mąż wychodzić, ale będą jak aniołowie Boga w niebie."
  tags: []
"Mt22,31":
  text: "A co do zmartwychwstania umarłych, czy nie czytaliście, co wam zostało powiedziane przez Boga:"
  tags: []
"Mt22,32":
  text: "Ja jestem Bogiem Abrahama, Bogiem Izaaka i Bogiem Jakuba? Bóg nie jest Bogiem umarłych, ale żywych."
  tags: []
"Mt22,33":
  text: "A tłumy, słysząc to, zdumiewały się jego nauką."
  tags: []
"Mt22,34":
  text: "Lecz gdy faryzeusze usłyszeli, że zamknął usta saduceuszom, zeszli się razem."
  tags: []
"Mt22,35":
  text: "I jeden z nich, znawca prawa, wystawiając go na próbę, spytał:"
  tags: []
"Mt22,36":
  text: "Nauczycielu, które przykazanie w prawie jest największe?"
  tags: []
"Mt22,37":
  text: "A Jezus mu odpowiedział: Będziesz miłował Pana, swego Boga, całym swym sercem, całą swą duszą i całym swym umysłem."
  tags: []
"Mt22,38":
  text: "To jest pierwsze i największe przykazanie."
  tags: []
"Mt22,39":
  text: "A drugie jest do niego podobne: Będziesz miłował swego bliźniego jak samego siebie."
  tags: []
"Mt22,40":
  text: "Na tych dwóch przykazaniach opiera się całe Prawo i Prorocy."
  tags: []
"Mt22,41":
  text: "A gdy faryzeusze byli zebrani, Jezus ich zapytał:"
  tags: []
"Mt22,42":
  text: "Co sądzicie o Chrystusie? Czyim jest synem? Odpowiedzieli mu: Dawida."
  tags: []
"Mt22,43":
  text: "I powiedział im: Jakże więc Dawid w Duchu nazywa go Panem, mówiąc:"
  tags: []
"Mt22,44":
  text: "Powiedział Pan memu Panu: Siądź po mojej prawicy, aż położę twoich nieprzyjaciół jako podnóżek pod twoje stopy?"
  tags: []
"Mt22,45":
  text: "Jeśli więc Dawid nazywa go Panem, to jakże może być jego synem?"
  tags: []
"Mt22,46":
  text: "I nikt nie mógł mu odpowiedzieć ani słowa. Od tego też dnia nikt nie śmiał go więcej pytać."
  tags: []
