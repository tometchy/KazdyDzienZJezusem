"Mt19,1":
  text: "A gdy Jezus dokończył tych mów, odszedł z Galilei i przybył na pogranicze Judei za Jordan."
  tags: []
"Mt19,2":
  text: "I poszły za nim wielkie tłumy, a on ich tam uzdrowił."
  tags: []
"Mt19,3":
  text: "Wtedy przyszli do niego faryzeusze, wystawiając go na próbę i pytając: Czy wolno człowiekowi oddalić swoją żonę z jakiegokolwiek powodu?"
  tags: []
"Mt19,4":
  text: "A on im odpowiedział: Nie czytaliście, że ten, który stworzył ich na początku, uczynił ich mężczyzną i kobietą?"
  tags: []
"Mt19,5":
  text: "I powiedział: Dlatego opuści mężczyzna ojca i matkę i połączy się ze swoją żoną, i będą dwoje jednym ciałem."
  tags: []
"Mt19,6":
  text: "A tak już nie są dwoje, ale jedno ciało. Co więc Bóg złączył, człowiek niech nie rozłącza."
  tags: []
"Mt19,7":
  text: "Zapytali go: Dlaczego więc Mojżesz nakazał dać list rozwodowy i oddalić ją?"
  tags: []
"Mt19,8":
  text: "Odpowiedział im: Z powodu zatwardziałości waszego serca Mojżesz pozwolił wam oddalić wasze żony, ale od początku tak nie było."
  tags: []
"Mt19,9":
  text: "Lecz ja wam mówię: Kto oddala swoją żonę – z wyjątkiem przypadku nierządu – i żeni się z inną, cudzołoży, a kto żeni się z oddaloną, cudzołoży."
  tags: []
"Mt19,10":
  text: "Powiedzieli mu jego uczniowie: Jeśli tak ma się sprawa mężczyzny z jego żoną, to lepiej się nie żenić."
  tags: []
"Mt19,11":
  text: "A on im powiedział: Nie wszyscy to pojmują, ale tylko ci, którym to jest dane."
  tags: []
"Mt19,12":
  text: "Są bowiem eunuchowie, którzy tacy wyszli z łona matki; są też eunuchowie, których ludzie takimi uczynili; są również eunuchowie, którzy się sami takimi uczynili dla królestwa niebieskiego. Kto może pojąć, niech pojmuje."
  tags: []
"Mt19,13":
  text: "Wtedy przyniesiono mu dzieci, aby położył na nie ręce i pomodlił się, ale uczniowie ich gromili."
  tags: []
"Mt19,14":
  text: "Lecz Jezus powiedział: Zostawcie dzieci i nie zabraniajcie im przychodzić do mnie, bo do takich należy królestwo niebieskie."
  tags: []
"Mt19,15":
  text: "Położył na nie ręce i odszedł stamtąd."
  tags: []
"Mt19,16":
  text: "A oto pewien człowiek podszedł i zapytał go: Nauczycielu dobry, co dobrego mam czynić, aby mieć życie wieczne?"
  tags: []
"Mt19,17":
  text: "Lecz on mu odpowiedział: Dlaczego nazywasz mnie dobrym? Nikt nie jest dobry, tylko jeden – Bóg. A jeśli chcesz wejść do życia, przestrzegaj przykazań."
  tags: []
"Mt19,18":
  text: "I zapytał go: Których? Jezus odpowiedział: Nie będziesz zabijał, nie będziesz cudzołożył, nie będziesz kradł, nie będziesz mówił fałszywego świadectwa;"
  tags: []
"Mt19,19":
  text: "Czcij swego ojca i matkę oraz będziesz miłował swego bliźniego jak samego siebie."
  tags: []
"Mt19,20":
  text: "Powiedział mu młodzieniec: Tego wszystkiego przestrzegałem od mojej młodości. Czego mi jeszcze brakuje?"
  tags: []
"Mt19,21":
  text: "Jezus mu odpowiedział: Jeśli chcesz być doskonały, idź, sprzedaj, co posiadasz, i rozdaj ubogim, a będziesz miał skarb w niebie. Potem przyjdź i chodź za mną."
  tags: []
"Mt19,22":
  text: "Kiedy młodzieniec usłyszał te słowa, odszedł smutny, miał bowiem wiele dóbr."
  tags: []
"Mt19,23":
  text: "Wtedy Jezus powiedział swoim uczniom: Zaprawdę powiadam wam, że bogaty z trudnością wejdzie do królestwa niebieskiego."
  tags: []
"Mt19,24":
  text: "Mówię wam też: Łatwiej jest wielbłądowi przejść przez ucho igielne, niż bogatemu wejść do królestwa Bożego."
  tags: []
"Mt19,25":
  text: "Gdy jego uczniowie to usłyszeli, zdumieli się bardzo i pytali: Któż więc może być zbawiony?"
  tags: []
"Mt19,26":
  text: "A Jezus, spojrzawszy na nich, powiedział im: U ludzi to niemożliwe, lecz u Boga wszystko jest możliwe."
  tags: []
"Mt19,27":
  text: "Wtedy Piotr odezwał się do niego: Oto my opuściliśmy wszystko i poszliśmy za tobą. Cóż za to będziemy mieli?"
  tags: []
"Mt19,28":
  text: "A Jezus im powiedział: Zaprawdę powiadam wam, że przy odrodzeniu, gdy Syn Człowieczy zasiądzie na tronie swojej chwały, i wy, którzy poszliście za mną, zasiądziecie na dwunastu tronach, sądząc dwanaście pokoleń Izraela."
  tags: []
"Mt19,29":
  text: "I każdy, kto opuści domy, braci lub siostry, ojca lub matkę, żonę, dzieci lub pole dla mego imienia, stokroć więcej otrzyma i odziedziczy życie wieczne."
  tags: []
"Mt19,30":
  text: "A wielu pierwszych będzie ostatnimi, a ostatnich pierwszymi."
  tags: []
