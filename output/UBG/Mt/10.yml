"Mt10,1":
  text: "A przywoławszy swoich dwunastu uczniów, dał im moc nad duchami nieczystymi, aby je wypędzali i aby uzdrawiali wszystkie choroby i wszelkie słabości."
  tags: []
"Mt10,2":
  text: "A takie są imiona dwunastu apostołów: pierwszy Szymon, zwany Piotrem, i jego brat Andrzej, Jakub, syn Zebedeusza, i Jan, jego brat;"
  tags: []
"Mt10,3":
  text: "Filip i Bartłomiej, Tomasz i celnik Mateusz, Jakub, syn Alfeusza, i Lebeusz, nazwany Tadeuszem;"
  tags: []
"Mt10,4":
  text: "Szymon Kananejczyk i Judasz Iskariota, ten, który go zdradził."
  tags: []
"Mt10,5":
  text: "Tych dwunastu posłał Jezus i nakazał im: Nie wchodźcie na drogę pogan i nie wstępujcie do żadnego miasta Samarytan."
  tags: []
"Mt10,6":
  text: "Idźcie raczej do owiec zaginionych z domu Izraela."
  tags: []
"Mt10,7":
  text: "A idąc, głoście: Przybliżyło się królestwo niebieskie."
  tags: []
"Mt10,8":
  text: "Uzdrawiajcie chorych, oczyszczajcie trędowatych, wskrzeszajcie umarłych, wypędzajcie demony. Darmo otrzymaliście, darmo dawajcie."
  tags: []
"Mt10,9":
  text: "Nie bierzcie ze sobą do trzosa złota ani srebra, ani miedzi;"
  tags: []
"Mt10,10":
  text: "Ani torby na drogę, ani dwóch ubrań, ani obuwia, ani laski. Godny jest bowiem pracownik swego wyżywienia."
  tags: []
"Mt10,11":
  text: "A gdy wejdziecie do jakiegoś miasta albo wioski, dowiedzcie się, kto w nim jest godny i tam mieszkajcie, dopóki nie odejdziecie."
  tags: []
"Mt10,12":
  text: "A wchodząc do domu, pozdrówcie go."
  tags: []
"Mt10,13":
  text: "Jeśli ten dom jest tego godny, niech zstąpi na niego wasz pokój, a jeśli nie jest godny, niech wasz pokój powróci do was."
  tags: []
"Mt10,14":
  text: "A jeśli ktoś was nie przyjmie i nie usłucha waszych słów, wychodząc z tego domu albo miasta, strząśnijcie pył z waszych nóg."
  tags: []
"Mt10,15":
  text: "Zaprawdę powiadam wam: Lżej będzie ziemi sodomskiej i gomorskiej w dzień sądu niż temu miastu."
  tags: []
"Mt10,16":
  text: "Oto ja was posyłam jak owce między wilki. Bądźcie więc roztropni jak węże i niewinni jak gołębice."
  tags: []
"Mt10,17":
  text: "I strzeżcie się ludzi. Będą was bowiem wydawać radom i będą was biczować w swoich synagogach."
  tags: []
"Mt10,18":
  text: "Także przed namiestników i przed królów będą was prowadzić z mego powodu, na świadectwo przeciwko nim i poganom."
  tags: []
"Mt10,19":
  text: "Ale gdy was wydadzą, nie martwcie się, jak i co macie mówić. Będzie wam bowiem dane w tej godzinie, co macie mówić."
  tags: []
"Mt10,20":
  text: "Bo nie wy mówicie, ale Duch waszego Ojca mówi w was."
  tags: []
"Mt10,21":
  text: "I wyda na śmierć brat brata, a ojciec syna. Dzieci powstaną przeciwko rodzicom i spowodują ich śmierć."
  tags: []
"Mt10,22":
  text: "I będziecie znienawidzeni przez wszystkich z powodu mego imienia. Lecz kto wytrwa do końca, będzie zbawiony."
  tags: []
"Mt10,23":
  text: "A gdy będą was prześladować w tym mieście, uciekajcie do innego. Zaprawdę powiadam wam, że nie obejdziecie miast Izraela, aż przyjdzie Syn Człowieczy."
  tags: []
"Mt10,24":
  text: "Uczeń nie przewyższa mistrza ani sługa swego pana."
  tags: []
"Mt10,25":
  text: "Wystarczy uczniowi, że będzie jak jego mistrz, a sługa jak jego pan. Jeśli gospodarza nazywali Belzebubem, o ile bardziej będą tak nazywać jego domowników."
  tags: []
"Mt10,26":
  text: "Dlatego nie bójcie się ich. Nie ma bowiem nic ukrytego, co by nie miało być ujawnione, ani nic tajemnego, o czym by się nie miano dowiedzieć."
  tags: []
"Mt10,27":
  text: "Co mówię wam w ciemności, opowiadajcie w świetle, a co słyszycie na ucho, rozgłaszajcie na dachach."
  tags: []
"Mt10,28":
  text: "Nie bójcie się tych, którzy zabijają ciało, lecz nie mogą zabić duszy. Bójcie się raczej tego, który może i duszę, i ciało zatracić w piekielnym ogniu."
  tags: []
"Mt10,29":
  text: "Czy nie sprzedają dwóch wróbli za pieniążek? A jednak żaden z nich nie spadnie na ziemię bez woli waszego Ojca."
  tags: []
"Mt10,30":
  text: "Nawet wszystkie włosy na waszej głowie są policzone."
  tags: []
"Mt10,31":
  text: "Nie bójcie się więc, jesteście cenniejsi niż wiele wróbli."
  tags: []
"Mt10,32":
  text: "Każdego więc, kto mnie wyzna przed ludźmi, i ja wyznam przed moim Ojcem, który jest w niebie."
  tags: []
"Mt10,33":
  text: "A tego, kto się mnie wyprze przed ludźmi, i ja się wyprę przed moim Ojcem, który jest w niebie."
  tags: []
"Mt10,34":
  text: "Nie sądźcie, że przyszedłem przynieść pokój na ziemię. Nie przyszedłem przynieść pokoju, ale miecz."
  tags: []
"Mt10,35":
  text: "Bo przyszedłem poróżnić syna z jego ojcem i córkę z jej matką, a synową z teściową."
  tags: []
"Mt10,36":
  text: "I nieprzyjaciółmi człowieka będą jego domownicy."
  tags: []
"Mt10,37":
  text: "Kto miłuje ojca albo matkę bardziej niż mnie, nie jest mnie godny. I kto miłuje syna albo córkę bardziej niż mnie, nie jest mnie godny."
  tags: []
"Mt10,38":
  text: "Kto nie bierze swego krzyża i nie idzie za mną, nie jest mnie godny."
  tags: []
"Mt10,39":
  text: "Kto znajdzie swoje życie, straci je, a kto straci swoje życie z mego powodu, znajdzie je."
  tags: []
"Mt10,40":
  text: "Kto was przyjmuje, mnie przyjmuje, a kto mnie przyjmuje, przyjmuje tego, który mnie posłał."
  tags: []
"Mt10,41":
  text: "Kto przyjmuje proroka w imię proroka, otrzyma nagrodę proroka. Kto przyjmuje sprawiedliwego w imię sprawiedliwego, otrzyma nagrodę sprawiedliwego."
  tags: []
"Mt10,42":
  text: "A kto poda jednemu z tych małych choćby kubek zimnej wody w imię ucznia, zaprawdę powiadam wam, nie straci swojej nagrody."
  tags: []
