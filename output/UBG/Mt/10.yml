"Mt10,1": "A przywoławszy swoich dwunastu uczniów, dał im moc nad duchami nieczystymi, aby je wypędzali i aby uzdrawiali wszystkie choroby i wszelkie słabości."
"Mt10,2": "A takie są imiona dwunastu apostołów: pierwszy Szymon, zwany Piotrem, i jego brat Andrzej, Jakub, syn Zebedeusza, i Jan, jego brat;"
"Mt10,3": "Filip i Bartłomiej, Tomasz i celnik Mateusz, Jakub, syn Alfeusza, i Lebeusz, nazwany Tadeuszem;"
"Mt10,4": "Szymon Kananejczyk i Judasz Iskariota, ten, który go zdradził."
"Mt10,5": "Tych dwunastu posłał Jezus i nakazał im: Nie wchodźcie na drogę pogan i nie wstępujcie do żadnego miasta Samarytan."
"Mt10,6": "Idźcie raczej do owiec zaginionych z domu Izraela."
"Mt10,7": "A idąc, głoście: Przybliżyło się królestwo niebieskie."
"Mt10,8": "Uzdrawiajcie chorych, oczyszczajcie trędowatych, wskrzeszajcie umarłych, wypędzajcie demony. Darmo otrzymaliście, darmo dawajcie."
"Mt10,9": "Nie bierzcie ze sobą do trzosa złota ani srebra, ani miedzi;"
"Mt10,10": "Ani torby na drogę, ani dwóch ubrań, ani obuwia, ani laski. Godny jest bowiem pracownik swego wyżywienia."
"Mt10,11": "A gdy wejdziecie do jakiegoś miasta albo wioski, dowiedzcie się, kto w nim jest godny i tam mieszkajcie, dopóki nie odejdziecie."
"Mt10,12": "A wchodząc do domu, pozdrówcie go."
"Mt10,13": "Jeśli ten dom jest tego godny, niech zstąpi na niego wasz pokój, a jeśli nie jest godny, niech wasz pokój powróci do was."
"Mt10,14": "A jeśli ktoś was nie przyjmie i nie usłucha waszych słów, wychodząc z tego domu albo miasta, strząśnijcie pył z waszych nóg."
"Mt10,15": "Zaprawdę powiadam wam: Lżej będzie ziemi sodomskiej i gomorskiej w dzień sądu niż temu miastu."
"Mt10,16": "Oto ja was posyłam jak owce między wilki. Bądźcie więc roztropni jak węże i niewinni jak gołębice."
"Mt10,17": "I strzeżcie się ludzi. Będą was bowiem wydawać radom i będą was biczować w swoich synagogach."
"Mt10,18": "Także przed namiestników i przed królów będą was prowadzić z mego powodu, na świadectwo przeciwko nim i poganom."
"Mt10,19": "Ale gdy was wydadzą, nie martwcie się, jak i co macie mówić. Będzie wam bowiem dane w tej godzinie, co macie mówić."
"Mt10,20": "Bo nie wy mówicie, ale Duch waszego Ojca mówi w was."
"Mt10,21": "I wyda na śmierć brat brata, a ojciec syna. Dzieci powstaną przeciwko rodzicom i spowodują ich śmierć."
"Mt10,22": "I będziecie znienawidzeni przez wszystkich z powodu mego imienia. Lecz kto wytrwa do końca, będzie zbawiony."
"Mt10,23": "A gdy będą was prześladować w tym mieście, uciekajcie do innego. Zaprawdę powiadam wam, że nie obejdziecie miast Izraela, aż przyjdzie Syn Człowieczy."
"Mt10,24": "Uczeń nie przewyższa mistrza ani sługa swego pana."
"Mt10,25": "Wystarczy uczniowi, że będzie jak jego mistrz, a sługa jak jego pan. Jeśli gospodarza nazywali Belzebubem, o ile bardziej będą tak nazywać jego domowników."
"Mt10,26": "Dlatego nie bójcie się ich. Nie ma bowiem nic ukrytego, co by nie miało być ujawnione, ani nic tajemnego, o czym by się nie miano dowiedzieć."
"Mt10,27": "Co mówię wam w ciemności, opowiadajcie w świetle, a co słyszycie na ucho, rozgłaszajcie na dachach."
"Mt10,28": "Nie bójcie się tych, którzy zabijają ciało, lecz nie mogą zabić duszy. Bójcie się raczej tego, który może i duszę, i ciało zatracić w piekielnym ogniu."
"Mt10,29": "Czy nie sprzedają dwóch wróbli za pieniążek? A jednak żaden z nich nie spadnie na ziemię bez woli waszego Ojca."
"Mt10,30": "Nawet wszystkie włosy na waszej głowie są policzone."
"Mt10,31": "Nie bójcie się więc, jesteście cenniejsi niż wiele wróbli."
"Mt10,32": "Każdego więc, kto mnie wyzna przed ludźmi, i ja wyznam przed moim Ojcem, który jest w niebie."
"Mt10,33": "A tego, kto się mnie wyprze przed ludźmi, i ja się wyprę przed moim Ojcem, który jest w niebie."
"Mt10,34": "Nie sądźcie, że przyszedłem przynieść pokój na ziemię. Nie przyszedłem przynieść pokoju, ale miecz."
"Mt10,35": "Bo przyszedłem poróżnić syna z jego ojcem i córkę z jej matką, a synową z teściową."
"Mt10,36": "I nieprzyjaciółmi człowieka będą jego domownicy."
"Mt10,37": "Kto miłuje ojca albo matkę bardziej niż mnie, nie jest mnie godny. I kto miłuje syna albo córkę bardziej niż mnie, nie jest mnie godny."
"Mt10,38": "Kto nie bierze swego krzyża i nie idzie za mną, nie jest mnie godny."
"Mt10,39": "Kto znajdzie swoje życie, straci je, a kto straci swoje życie z mego powodu, znajdzie je."
"Mt10,40": "Kto was przyjmuje, mnie przyjmuje, a kto mnie przyjmuje, przyjmuje tego, który mnie posłał."
"Mt10,41": "Kto przyjmuje proroka w imię proroka, otrzyma nagrodę proroka. Kto przyjmuje sprawiedliwego w imię sprawiedliwego, otrzyma nagrodę sprawiedliwego."
"Mt10,42": "A kto poda jednemu z tych małych choćby kubek zimnej wody w imię ucznia, zaprawdę powiadam wam, nie straci swojej nagrody."
