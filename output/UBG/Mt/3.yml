"Mt3,1": "W tych dniach przyszedł Jan Chrzciciel, głosząc na pustyni judzkiej:"
"Mt3,2": "Pokutujcie, bo przybliżyło się królestwo niebieskie."
"Mt3,3": "To bowiem jest ten, o którym powiedziano przez proroka Izajasza: Głos wołającego na pustyni: Przygotujcie drogę Pana, prostujcie jego ścieżki."
"Mt3,4": "A ów Jan miał ubranie z sierści wielbłądziej i pas skórzany wokół bioder, a jego pokarmem była szarańcza i miód leśny."
"Mt3,5": "Wtedy przychodziła do niego Jerozolima oraz cała Judea i cała okolica nad Jordanem."
"Mt3,6": "I byli przez niego chrzczeni w Jordanie, wyznając swoje grzechy."
"Mt3,7": "A gdy zobaczył wielu spośród faryzeuszy i saduceuszy przychodzących do chrztu, powiedział im: Plemię żmijowe, któż was ostrzegł, żebyście uciekali przed nadchodzącym gniewem?"
"Mt3,8": "Wydajcie więc owoce godne pokuty;"
"Mt3,9": "A nie myślcie, że możecie sobie mówić: Naszym ojcem jest Abraham. Mówię wam bowiem, że Bóg może i z tych kamieni wzbudzić dzieci Abrahamowi."
"Mt3,10": "Już i siekiera do korzenia drzew jest przyłożona. Każde więc drzewo, które nie wydaje dobrego owocu, zostaje wycięte i wrzucone w ogień."
"Mt3,11": "Ja was chrzczę wodą ku pokucie; ten zaś, który idzie za mną, jest mocniejszy ode mnie; nie jestem godny nosić mu obuwia. On będzie was chrzcił Duchem Świętym i ogniem."
"Mt3,12": "Ma swoje wiejadło w ręku i wyczyści swoje klepisko, i zgromadzi swoją pszenicę do spichlerza, a plewy spali w ogniu nieugaszonym."
"Mt3,13": "Wtedy Jezus przyszedł z Galilei nad Jordan do Jana, aby być przez niego ochrzczonym."
"Mt3,14": "Ale Jan powstrzymywał go, mówiąc: Ja potrzebuję być ochrzczonym przez ciebie, a ty przychodzisz do mnie?"
"Mt3,15": "A Jezus mu odpowiedział: Ustąp teraz, bo tak godzi się nam wypełnić wszelką sprawiedliwość. Wtedy mu ustąpił."
"Mt3,16": "A gdy Jezus został ochrzczony, zaraz wyszedł z wody, a oto otworzyły mu się niebiosa i ujrzał Ducha Bożego zstępującego jak gołębica i przychodzącego na niego."
"Mt3,17": "I rozległ się głos z nieba: To jest mój umiłowany Syn, w którym mam upodobanie."
