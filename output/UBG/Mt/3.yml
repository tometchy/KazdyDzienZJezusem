"Mt3,1":
  text: "W tych dniach przyszedł Jan Chrzciciel, głosząc na pustyni judzkiej:"
  tags: []
"Mt3,2":
  text: "Pokutujcie, bo przybliżyło się królestwo niebieskie."
  tags: []
"Mt3,3":
  text: "To bowiem jest ten, o którym powiedziano przez proroka Izajasza: Głos wołającego na pustyni: Przygotujcie drogę Pana, prostujcie jego ścieżki."
  tags: []
"Mt3,4":
  text: "A ów Jan miał ubranie z sierści wielbłądziej i pas skórzany wokół bioder, a jego pokarmem była szarańcza i miód leśny."
  tags: []
"Mt3,5":
  text: "Wtedy przychodziła do niego Jerozolima oraz cała Judea i cała okolica nad Jordanem."
  tags: []
"Mt3,6":
  text: "I byli przez niego chrzczeni w Jordanie, wyznając swoje grzechy."
  tags: []
"Mt3,7":
  text: "A gdy zobaczył wielu spośród faryzeuszy i saduceuszy przychodzących do chrztu, powiedział im: Plemię żmijowe, któż was ostrzegł, żebyście uciekali przed nadchodzącym gniewem?"
  tags: []
"Mt3,8":
  text: "Wydajcie więc owoce godne pokuty;"
  tags: []
"Mt3,9":
  text: "A nie myślcie, że możecie sobie mówić: Naszym ojcem jest Abraham. Mówię wam bowiem, że Bóg może i z tych kamieni wzbudzić dzieci Abrahamowi."
  tags: []
"Mt3,10":
  text: "Już i siekiera do korzenia drzew jest przyłożona. Każde więc drzewo, które nie wydaje dobrego owocu, zostaje wycięte i wrzucone w ogień."
  tags: []
"Mt3,11":
  text: "Ja was chrzczę wodą ku pokucie; ten zaś, który idzie za mną, jest mocniejszy ode mnie; nie jestem godny nosić mu obuwia. On będzie was chrzcił Duchem Świętym i ogniem."
  tags: []
"Mt3,12":
  text: "Ma swoje wiejadło w ręku i wyczyści swoje klepisko, i zgromadzi swoją pszenicę do spichlerza, a plewy spali w ogniu nieugaszonym."
  tags: []
"Mt3,13":
  text: "Wtedy Jezus przyszedł z Galilei nad Jordan do Jana, aby być przez niego ochrzczonym."
  tags: []
"Mt3,14":
  text: "Ale Jan powstrzymywał go, mówiąc: Ja potrzebuję być ochrzczonym przez ciebie, a ty przychodzisz do mnie?"
  tags: []
"Mt3,15":
  text: "A Jezus mu odpowiedział: Ustąp teraz, bo tak godzi się nam wypełnić wszelką sprawiedliwość. Wtedy mu ustąpił."
  tags: []
"Mt3,16":
  text: "A gdy Jezus został ochrzczony, zaraz wyszedł z wody, a oto otworzyły mu się niebiosa i ujrzał Ducha Bożego zstępującego jak gołębica i przychodzącego na niego."
  tags: []
"Mt3,17":
  text: "I rozległ się głos z nieba: To jest mój umiłowany Syn, w którym mam upodobanie."
  tags: []
