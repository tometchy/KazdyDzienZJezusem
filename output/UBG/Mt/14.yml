"Mt14,1": "W tym czasie tetrarcha Herod usłyszał wieść o Jezusie."
"Mt14,2": "I powiedział swoim sługom: To jest Jan Chrzciciel. On zmartwychwstał i dlatego cuda dokonują się przez niego."
"Mt14,3": "Herod bowiem schwytał Jana, związał go i wtrącił do więzienia z powodu Herodiady, żony swego brata Filipa."
"Mt14,4": "Bo Jan mówił mu: Nie wolno ci jej mieć."
"Mt14,5": "I chciał go zabić, ale bał się ludu, bo uważano go za proroka."
"Mt14,6": "A gdy obchodzono dzień urodzin Heroda, córka Herodiady tańczyła wśród gości i spodobała się Herodowi."
"Mt14,7": "Dlatego pod przysięgą obiecał jej dać, o cokolwiek poprosi."
"Mt14,8": "A ona, namówiona przedtem przez swoją matkę, powiedziała: Daj mi tu na misie głowę Jana Chrzciciela."
"Mt14,9": "I zasmucił się król, ale ze względu na przysięgę i współbiesiadników kazał jej dać."
"Mt14,10": "A posławszy kata, ściął Jana w więzieniu."
"Mt14,11": "I przyniesiono jego głowę na misie, i dano dziewczynie, a ona zaniosła ją swojej matce."
"Mt14,12": "Potem przyszli jego uczniowie, zabrali ciało i pogrzebali je, a poszedłszy, powiedzieli o tym Jezusowi."
"Mt14,13": "A Jezus, usłyszawszy to, oddalił się stamtąd łodzią na miejsce odludne, żeby być na osobności. Kiedy ludzie o tym usłyszeli, pieszo poszli za nim z miast."
"Mt14,14": "Gdy Jezus wyszedł z łodzi, zobaczył wielki tłum, ulitował się nad nimi i uzdrawiał ich chorych."
"Mt14,15": "A gdy nastał wieczór, podeszli do niego jego uczniowie i powiedzieli: Miejsce to jest puste, a pora już późna. Odpraw tych ludzi, aby poszli do wiosek i kupili sobie żywności."
"Mt14,16": "Lecz Jezus im odpowiedział: Nie muszą odchodzić, wy dajcie im jeść."
"Mt14,17": "A oni mu powiedzieli: Nie mamy tu nic prócz pięciu chlebów i dwóch ryb."
"Mt14,18": "On powiedział: Przynieście mi je tutaj."
"Mt14,19": "Wtedy nakazał ludziom usiąść na trawie, wziął te pięć chlebów i dwie ryby, a spojrzawszy w niebo, pobłogosławił i łamiąc chleby, dawał uczniom, a uczniowie ludziom."
"Mt14,20": "I jedli wszyscy do syta. I zebrali z pozostałych kawałków dwanaście pełnych koszy."
"Mt14,21": "A tych, którzy jedli, było około pięciu tysięcy mężczyzn, nie licząc kobiet i dzieci."
"Mt14,22": "Zaraz też Jezus przymusił swoich uczniów, aby wsiedli do łodzi i wyprzedzili go na drugi brzeg, a on tymczasem odprawi tłumy."
"Mt14,23": "A odprawiwszy je, wszedł sam na górę, aby się modlić. A gdy nastał wieczór, nadal był tam sam."
"Mt14,24": "Łódź tymczasem była już na środku morza, miotana przez fale, bo wiatr był przeciwny."
"Mt14,25": "Lecz o czwartej straży nocnej przyszedł do nich Jezus, idąc po morzu."
"Mt14,26": "A uczniowie, gdy ujrzeli go idącego po morzu, przerazili się i powiedzieli: To zjawa! I krzyknęli ze strachu."
"Mt14,27": "Ale Jezus zaraz do nich powiedział: Ufajcie, to ja jestem! Nie bójcie się!"
"Mt14,28": "Piotr odezwał się do niego: Panie, jeśli to jesteś ty, każ mi przyjść do siebie po wodzie."
"Mt14,29": "A on powiedział: Przyjdź! I Piotr, wyszedłszy z łodzi, szedł po wodzie, aby przyjść do Jezusa."
"Mt14,30": "Lecz widząc gwałtowny wiatr, zląkł się, a gdy zaczął tonąć, krzyknął: Panie, ratuj mnie!"
"Mt14,31": "Jezus natychmiast wyciągnął rękę, uchwycił go i powiedział: Człowieku małej wiary, dlaczego zwątpiłeś?"
"Mt14,32": "A gdy wsiedli do łodzi, wiatr się uciszył."
"Mt14,33": "Ci zaś, którzy byli w łodzi, podeszli i oddali mu pokłon, mówiąc: Naprawdę jesteś Synem Bożym."
"Mt14,34": "I przeprawiwszy się, przybyli do ziemi Genezaret."
"Mt14,35": "A ludzie z tamtych okolic, poznawszy go, rozesłali wiadomość po całej okolicy i przyniesiono do niego wszystkich chorych."
"Mt14,36": "I prosili go, aby mogli dotknąć tylko brzegu jego szaty, a ci, którzy dotknęli, zostali uzdrowieni."
