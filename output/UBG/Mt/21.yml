"Mt21,1":
  text: "A gdy się przybliżyli do Jerozolimy i przyszli do Betfage na Górę Oliwną, wtedy Jezus posłał dwóch uczniów;"
  tags: []
"Mt21,2":
  text: "Mówiąc im: Idźcie do wsi, która jest przed wami, a zaraz znajdziecie uwiązaną oślicę i oślątko z nią. Odwiążcie je i przyprowadźcie do mnie."
  tags: []
"Mt21,3":
  text: "A gdyby wam ktoś coś mówił, powiedzcie: Pan ich potrzebuje, a zaraz je puści."
  tags: []
"Mt21,4":
  text: "To wszystko się stało, aby się wypełniło, co zostało powiedziane przez proroka:"
  tags: []
"Mt21,5":
  text: "Powiedzcie córce Syjonu: Oto twój król przychodzi do ciebie cichy, siedzący na ośle, na oślątku, źrebięciu oślicy."
  tags: []
"Mt21,6":
  text: "Poszli więc uczniowie i uczynili tak, jak im nakazał Jezus."
  tags: []
"Mt21,7":
  text: "Przyprowadzili oślicę i oślątko, położyli na nie swoje szaty i posadzili go na nich."
  tags: []
"Mt21,8":
  text: "A wielki tłum słał swoje szaty na drodze, inni zaś obcinali gałązki z drzew i kładli na drodze."
  tags: []
"Mt21,9":
  text: "A tłumy, które szły przed nim i za nim, wołały: Hosanna Synowi Dawida! Błogosławiony, który przychodzi w imieniu Pana! Hosanna na wysokościach!"
  tags: []
"Mt21,10":
  text: "Kiedy wjechał do Jerozolimy, poruszyło się całe miasto i pytano: Któż to jest?"
  tags: []
"Mt21,11":
  text: "A tłumy odpowiadały: To jest Jezus, prorok z Nazaretu w Galilei."
  tags: []
"Mt21,12":
  text: "Wtedy Jezus wszedł do świątyni Boga i wypędził wszystkich sprzedających i kupujących w świątyni; poprzewracał stoły wymieniających pieniądze i stołki sprzedających gołębie."
  tags: []
"Mt21,13":
  text: "I powiedział im: Jest napisane: Mój dom będzie nazwany domem modlitwy, a wy zrobiliście z niego jaskinię zbójców."
  tags: []
"Mt21,14":
  text: "Wtedy ślepi i chromi podeszli do niego w świątyni, a on ich uzdrowił."
  tags: []
"Mt21,15":
  text: "A gdy naczelni kapłani i uczeni w Piśmie zobaczyli cuda, które czynił, i dzieci wołające w świątyni: Hosanna Synowi Dawida, rozgniewali się."
  tags: []
"Mt21,16":
  text: "I zapytali go: Słyszysz, co one mówią? A Jezus im odpowiedział: Tak. Czy nigdy nie czytaliście: Przez usta niemowląt i ssących przygotowałeś sobie chwałę?"
  tags: []
"Mt21,17":
  text: "A opuściwszy ich, wyszedł z miasta do Betanii i tam przenocował."
  tags: []
"Mt21,18":
  text: "A wracając rano do miasta, poczuł głód."
  tags: []
"Mt21,19":
  text: "I widząc przy drodze drzewo figowe, podszedł do niego, ale nie znalazł na nim nic oprócz samych liści. I powiedział do niego: Niech się już nigdy nie rodzi z ciebie owoc. I drzewo figowe natychmiast uschło."
  tags: []
"Mt21,20":
  text: "A gdy uczniowie to zobaczyli, dziwili się, mówiąc: Jak szybko uschło to drzewo figowe!"
  tags: []
"Mt21,21":
  text: "Wtedy Jezus im odpowiedział: Zaprawdę powiadam wam: Jeśli będziecie mieć wiarę i nie zwątpicie, nie tylko to, co się stało z drzewem figowym, uczynicie, ale jeśli i tej górze powiecie: Podnieś się i rzuć się do morza, stanie się tak."
  tags: []
"Mt21,22":
  text: "I wszystko, o cokolwiek poprosicie w modlitwie, wierząc, otrzymacie."
  tags: []
"Mt21,23":
  text: "A gdy przyszedł do świątyni i nauczał, podeszli do niego naczelni kapłani i starsi ludu, pytając: Jakim prawem to czynisz? I kto dał ci tę władzę?"
  tags: []
"Mt21,24":
  text: "A Jezus im odpowiedział: I ja was spytam o pewną rzecz. Jeśli mi odpowiecie, i ja wam powiem, jakim prawem to czynię."
  tags: []
"Mt21,25":
  text: "Skąd pochodził chrzest Jana? Z nieba czy od ludzi? A oni zastanawiali się między sobą i mówili: Jeśli powiemy, że z nieba, zapyta nas: Czemu więc mu nie uwierzyliście?"
  tags: []
"Mt21,26":
  text: "Jeśli zaś powiemy, że od ludzi – boimy się tłumu, bo wszyscy uważają Jana za proroka."
  tags: []
"Mt21,27":
  text: "Odpowiedzieli więc Jezusowi: Nie wiemy. On również im odpowiedział: I ja wam nie powiem, jakim prawem to czynię."
  tags: []
"Mt21,28":
  text: "Jak wam się wydaje? Pewien człowiek miał dwóch synów. Podszedł do pierwszego i powiedział: Synu, idź, pracuj dziś w mojej winnicy."
  tags: []
"Mt21,29":
  text: "Ale on odpowiedział: Nie chcę. Lecz potem odczuł żal i poszedł."
  tags: []
"Mt21,30":
  text: "Podszedł do drugiego i powiedział to samo. On zaś odpowiedział: Idę, panie. Ale nie poszedł."
  tags: []
"Mt21,31":
  text: "Który z tych dwóch wypełnił wolę ojca? Odpowiedzieli mu: Ten pierwszy. Jezus im powiedział: Zaprawdę powiadam wam, że celnicy i nierządnice wchodzą przed wami do królestwa Bożego."
  tags: []
"Mt21,32":
  text: "Przyszedł bowiem do was Jan drogą sprawiedliwości, a nie uwierzyliście mu, ale celnicy i nierządnice mu uwierzyli. A wy, chociaż to widzieliście, nie odczuliście żalu, aby mu uwierzyć."
  tags: []
"Mt21,33":
  text: "Posłuchajcie innej przypowieści: Był pewien gospodarz, który założył winnicę. Ogrodził ją płotem, wykopał w niej prasę, zbudował wieżę i wydzierżawił ją rolnikom, i wyjechał."
  tags: []
"Mt21,34":
  text: "A gdy nadszedł czas zbiorów, posłał swoje sługi do rolników, aby odebrali plony tej winnicy."
  tags: []
"Mt21,35":
  text: "Lecz rolnicy schwytali jego sługi, jednego pobili, innego zabili, a jeszcze innego ukamienowali."
  tags: []
"Mt21,36":
  text: "Wtedy posłał inne sługi, więcej niż za pierwszym razem, ale postąpili z nimi tak samo."
  tags: []
"Mt21,37":
  text: "W końcu posłał do nich swego syna, mówiąc: Uszanują mego syna."
  tags: []
"Mt21,38":
  text: "Lecz rolnicy, gdy zobaczyli syna, mówili między sobą: To jest dziedzic. Chodźmy, zabijmy go, a posiądziemy jego dziedzictwo."
  tags: []
"Mt21,39":
  text: "I schwytali go, wyrzucili z winnicy i zabili."
  tags: []
"Mt21,40":
  text: "Gdy więc przyjdzie pan winnicy, co zrobi z tymi rolnikami?"
  tags: []
"Mt21,41":
  text: "Odpowiedzieli mu: Złych srogo wytraci, a winnicę wydzierżawi innym rolnikom, którzy będą mu oddawać plony we właściwym czasie."
  tags: []
"Mt21,42":
  text: "Powiedział im Jezus: Czy nigdy nie czytaliście w Pismach: Kamień, który odrzucili budujący, stał się kamieniem węgielnym; Pan to sprawił i jest to cudowne w naszych oczach?"
  tags: []
"Mt21,43":
  text: "Dlatego mówię wam: Królestwo Boże zostanie wam zabrane, a dane narodowi, który wyda jego owoce."
  tags: []
"Mt21,44":
  text: "A kto upadnie na ten kamień, rozbije się, na kogo zaś on upadnie, zmiażdży go."
  tags: []
"Mt21,45":
  text: "Kiedy naczelni kapłani i faryzeusze usłyszeli jego przypowieści, domyślili się, że o nich mówił."
  tags: []
"Mt21,46":
  text: "I chcieli go schwytać, ale bali się tłumów, ponieważ uważały go za proroka."
  tags: []
