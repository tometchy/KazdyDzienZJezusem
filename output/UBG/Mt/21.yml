"Mt21,1": "A gdy się przybliżyli do Jerozolimy i przyszli do Betfage na Górę Oliwną, wtedy Jezus posłał dwóch uczniów;"
"Mt21,2": "Mówiąc im: Idźcie do wsi, która jest przed wami, a zaraz znajdziecie uwiązaną oślicę i oślątko z nią. Odwiążcie je i przyprowadźcie do mnie."
"Mt21,3": "A gdyby wam ktoś coś mówił, powiedzcie: Pan ich potrzebuje, a zaraz je puści."
"Mt21,4": "To wszystko się stało, aby się wypełniło, co zostało powiedziane przez proroka:"
"Mt21,5": "Powiedzcie córce Syjonu: Oto twój król przychodzi do ciebie cichy, siedzący na ośle, na oślątku, źrebięciu oślicy."
"Mt21,6": "Poszli więc uczniowie i uczynili tak, jak im nakazał Jezus."
"Mt21,7": "Przyprowadzili oślicę i oślątko, położyli na nie swoje szaty i posadzili go na nich."
"Mt21,8": "A wielki tłum słał swoje szaty na drodze, inni zaś obcinali gałązki z drzew i kładli na drodze."
"Mt21,9": "A tłumy, które szły przed nim i za nim, wołały: Hosanna Synowi Dawida! Błogosławiony, który przychodzi w imieniu Pana! Hosanna na wysokościach!"
"Mt21,10": "Kiedy wjechał do Jerozolimy, poruszyło się całe miasto i pytano: Któż to jest?"
"Mt21,11": "A tłumy odpowiadały: To jest Jezus, prorok z Nazaretu w Galilei."
"Mt21,12": "Wtedy Jezus wszedł do świątyni Boga i wypędził wszystkich sprzedających i kupujących w świątyni; poprzewracał stoły wymieniających pieniądze i stołki sprzedających gołębie."
"Mt21,13": "I powiedział im: Jest napisane: Mój dom będzie nazwany domem modlitwy, a wy zrobiliście z niego jaskinię zbójców."
"Mt21,14": "Wtedy ślepi i chromi podeszli do niego w świątyni, a on ich uzdrowił."
"Mt21,15": "A gdy naczelni kapłani i uczeni w Piśmie zobaczyli cuda, które czynił, i dzieci wołające w świątyni: Hosanna Synowi Dawida, rozgniewali się."
"Mt21,16": "I zapytali go: Słyszysz, co one mówią? A Jezus im odpowiedział: Tak. Czy nigdy nie czytaliście: Przez usta niemowląt i ssących przygotowałeś sobie chwałę?"
"Mt21,17": "A opuściwszy ich, wyszedł z miasta do Betanii i tam przenocował."
"Mt21,18": "A wracając rano do miasta, poczuł głód."
"Mt21,19": "I widząc przy drodze drzewo figowe, podszedł do niego, ale nie znalazł na nim nic oprócz samych liści. I powiedział do niego: Niech się już nigdy nie rodzi z ciebie owoc. I drzewo figowe natychmiast uschło."
"Mt21,20": "A gdy uczniowie to zobaczyli, dziwili się, mówiąc: Jak szybko uschło to drzewo figowe!"
"Mt21,21": "Wtedy Jezus im odpowiedział: Zaprawdę powiadam wam: Jeśli będziecie mieć wiarę i nie zwątpicie, nie tylko to, co się stało z drzewem figowym, uczynicie, ale jeśli i tej górze powiecie: Podnieś się i rzuć się do morza, stanie się tak."
"Mt21,22": "I wszystko, o cokolwiek poprosicie w modlitwie, wierząc, otrzymacie."
"Mt21,23": "A gdy przyszedł do świątyni i nauczał, podeszli do niego naczelni kapłani i starsi ludu, pytając: Jakim prawem to czynisz? I kto dał ci tę władzę?"
"Mt21,24": "A Jezus im odpowiedział: I ja was spytam o pewną rzecz. Jeśli mi odpowiecie, i ja wam powiem, jakim prawem to czynię."
"Mt21,25": "Skąd pochodził chrzest Jana? Z nieba czy od ludzi? A oni zastanawiali się między sobą i mówili: Jeśli powiemy, że z nieba, zapyta nas: Czemu więc mu nie uwierzyliście?"
"Mt21,26": "Jeśli zaś powiemy, że od ludzi – boimy się tłumu, bo wszyscy uważają Jana za proroka."
"Mt21,27": "Odpowiedzieli więc Jezusowi: Nie wiemy. On również im odpowiedział: I ja wam nie powiem, jakim prawem to czynię."
"Mt21,28": "Jak wam się wydaje? Pewien człowiek miał dwóch synów. Podszedł do pierwszego i powiedział: Synu, idź, pracuj dziś w mojej winnicy."
"Mt21,29": "Ale on odpowiedział: Nie chcę. Lecz potem odczuł żal i poszedł."
"Mt21,30": "Podszedł do drugiego i powiedział to samo. On zaś odpowiedział: Idę, panie. Ale nie poszedł."
"Mt21,31": "Który z tych dwóch wypełnił wolę ojca? Odpowiedzieli mu: Ten pierwszy. Jezus im powiedział: Zaprawdę powiadam wam, że celnicy i nierządnice wchodzą przed wami do królestwa Bożego."
"Mt21,32": "Przyszedł bowiem do was Jan drogą sprawiedliwości, a nie uwierzyliście mu, ale celnicy i nierządnice mu uwierzyli. A wy, chociaż to widzieliście, nie odczuliście żalu, aby mu uwierzyć."
"Mt21,33": "Posłuchajcie innej przypowieści: Był pewien gospodarz, który założył winnicę. Ogrodził ją płotem, wykopał w niej prasę, zbudował wieżę i wydzierżawił ją rolnikom, i wyjechał."
"Mt21,34": "A gdy nadszedł czas zbiorów, posłał swoje sługi do rolników, aby odebrali plony tej winnicy."
"Mt21,35": "Lecz rolnicy schwytali jego sługi, jednego pobili, innego zabili, a jeszcze innego ukamienowali."
"Mt21,36": "Wtedy posłał inne sługi, więcej niż za pierwszym razem, ale postąpili z nimi tak samo."
"Mt21,37": "W końcu posłał do nich swego syna, mówiąc: Uszanują mego syna."
"Mt21,38": "Lecz rolnicy, gdy zobaczyli syna, mówili między sobą: To jest dziedzic. Chodźmy, zabijmy go, a posiądziemy jego dziedzictwo."
"Mt21,39": "I schwytali go, wyrzucili z winnicy i zabili."
"Mt21,40": "Gdy więc przyjdzie pan winnicy, co zrobi z tymi rolnikami?"
"Mt21,41": "Odpowiedzieli mu: Złych srogo wytraci, a winnicę wydzierżawi innym rolnikom, którzy będą mu oddawać plony we właściwym czasie."
"Mt21,42": "Powiedział im Jezus: Czy nigdy nie czytaliście w Pismach: Kamień, który odrzucili budujący, stał się kamieniem węgielnym; Pan to sprawił i jest to cudowne w naszych oczach?"
"Mt21,43": "Dlatego mówię wam: Królestwo Boże zostanie wam zabrane, a dane narodowi, który wyda jego owoce."
"Mt21,44": "A kto upadnie na ten kamień, rozbije się, na kogo zaś on upadnie, zmiażdży go."
"Mt21,45": "Kiedy naczelni kapłani i faryzeusze usłyszeli jego przypowieści, domyślili się, że o nich mówił."
"Mt21,46": "I chcieli go schwytać, ale bali się tłumów, ponieważ uważały go za proroka."
