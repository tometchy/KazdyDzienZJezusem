"Mt20,1":
  text: "Królestwo niebieskie bowiem podobne jest do gospodarza, który wyszedł wczesnym rankiem, aby nająć robotników do swojej winnicy."
  tags: []
"Mt20,2":
  text: "I umówił się z robotnikami na grosz za dzień i posłał ich do winnicy."
  tags: []
"Mt20,3":
  text: "A wyszedłszy około godziny trzeciej, zobaczył innych, którzy stali bezczynnie na rynku;"
  tags: []
"Mt20,4":
  text: "I powiedział do nich: Idźcie i wy do winnicy, a co będzie słuszne, dam wam. I poszli."
  tags: []
"Mt20,5":
  text: "Około godziny szóstej i dziewiątej wyszedł znowu i zrobił tak samo."
  tags: []
"Mt20,6":
  text: "Potem wyszedł około godziny jedenastej i znalazł innych, którzy stali bez zajęcia, i zapytał ich: Dlaczego tu bezczynnie stoicie cały dzień?"
  tags: []
"Mt20,7":
  text: "Odpowiedzieli mu: Bo nikt nas nie najął. I powiedział im: Idźcie i wy do winnicy, a co będzie słuszne, otrzymacie."
  tags: []
"Mt20,8":
  text: "A gdy nastał wieczór, pan winnicy powiedział do swego zarządcy: Zwołaj robotników i wypłać im należność, zaczynając od ostatnich aż do pierwszych."
  tags: []
"Mt20,9":
  text: "Kiedy przyszli ci, którzy byli najęci około godziny jedenastej, każdy z nich otrzymał po groszu."
  tags: []
"Mt20,10":
  text: "Gdy przyszli pierwsi, sądzili, że dostaną więcej, ale również każdy z nich otrzymał po groszu."
  tags: []
"Mt20,11":
  text: "A otrzymawszy, szemrali przeciwko gospodarzowi;"
  tags: []
"Mt20,12":
  text: "Mówiąc: Ci ostatni jedną godzinę pracowali, a zrównałeś ich z nami, którzy znosiliśmy ciężar dnia i upał."
  tags: []
"Mt20,13":
  text: "A on odpowiedział jednemu z nich: Przyjacielu, nie robię ci krzywdy. Czyż nie umówiłeś się ze mną na grosz?"
  tags: []
"Mt20,14":
  text: "Weź, co jest twoje, i odejdź. Chcę bowiem temu ostatniemu dać tyle, co tobie."
  tags: []
"Mt20,15":
  text: "Czyż z tym, co moje, nie wolno mi robić, co chcę? Czy twoje oko jest złe dlatego, że ja jestem dobry?"
  tags: []
"Mt20,16":
  text: "Tak to ostatni będą pierwszymi, a pierwsi ostatnimi. Wielu bowiem jest wezwanych, ale mało wybranych."
  tags: []
"Mt20,17":
  text: "A gdy Jezus szedł do Jerozolimy, w drodze wziął ze sobą na ubocze dwunastu uczniów i powiedział do nich:"
  tags: []
"Mt20,18":
  text: "Oto idziemy do Jerozolimy, a Syn Człowieczy zostanie wydany naczelnym kapłanom i uczonym w Piśmie, a oni skażą go na śmierć."
  tags: []
"Mt20,19":
  text: "I wydadzą go poganom na pośmiewisko, ubiczowanie i ukrzyżowanie, ale trzeciego dnia zmartwychwstanie."
  tags: []
"Mt20,20":
  text: "Wtedy podeszła do niego matka synów Zebedeusza ze swoimi synami, oddając mu pokłon i prosząc go o coś."
  tags: []
"Mt20,21":
  text: "A on ją zapytał: Czego chcesz? Odpowiedziała mu: Powiedz, aby ci dwaj moi synowie siedzieli jeden po twojej prawej, a drugi po lewej stronie w twoim królestwie."
  tags: []
"Mt20,22":
  text: "Ale Jezus odpowiedział: Nie wiecie, o co prosicie. Czy możecie pić kielich, który ja będę pił, i być ochrzczeni chrztem, którym ja się chrzczę? Odpowiedzieli mu: Możemy."
  tags: []
"Mt20,23":
  text: "Wtedy im powiedział: Mój kielich będziecie pić i chrztem, którym ja się chrzczę, będziecie ochrzczeni, ale nie do mnie należy danie miejsca po mojej prawej i lewej stronie, lecz będzie dane tym, którym zostało przygotowane przez mojego Ojca."
  tags: []
"Mt20,24":
  text: "A gdy owych dziesięciu to usłyszało, oburzyli się na tych dwóch braci."
  tags: []
"Mt20,25":
  text: "Ale Jezus przywołał ich do siebie i powiedział: Wiecie, że władcy narodów panują nad nimi, a ci, którzy są wielcy, sprawują swą władzę nad nimi."
  tags: []
"Mt20,26":
  text: "Lecz nie tak ma być wśród was, ale kto między wami chce być wielki, niech będzie waszym sługą."
  tags: []
"Mt20,27":
  text: "I kto wśród was chce być pierwszy, niech będzie waszym sługą."
  tags: []
"Mt20,28":
  text: "Tak jak Syn Człowieczy nie przyszedł, aby mu służono, ale aby służyć i oddać swoje życie na okup za wielu."
  tags: []
"Mt20,29":
  text: "A gdy wychodzili z Jerycha, szedł za nim wielki tłum."
  tags: []
"Mt20,30":
  text: "A oto dwaj ślepi, siedzący przy drodze, usłyszawszy, że Jezus przechodzi, zawołali: Zmiłuj się nad nami, Panie, Synu Dawida!"
  tags: []
"Mt20,31":
  text: "Tłum surowo nakazywał im milczeć, lecz oni tym bardziej wołali: Zmiłuj się nad nami, Panie, Synu Dawida!"
  tags: []
"Mt20,32":
  text: "Wtedy Jezus zatrzymał się, zawołał ich i zapytał: Co chcecie, abym dla was zrobił?"
  tags: []
"Mt20,33":
  text: "Odpowiedzieli mu: Panie, aby się otworzyły nasze oczy."
  tags: []
"Mt20,34":
  text: "Wtedy Jezus ulitował się nad nimi, dotknął ich oczu, a natychmiast odzyskali wzrok i poszli za nim."
  tags: []
