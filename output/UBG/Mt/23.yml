"Mt23,1":
  text: "Wtedy Jezus powiedział do tłumów i do swoich uczniów:"
  tags: []
"Mt23,2":
  text: "Na katedrze Mojżesza zasiedli uczeni w Piśmie i faryzeusze."
  tags: []
"Mt23,3":
  text: "Czyńcie więc i przestrzegajcie wszystkiego, co nakazują wam przestrzegać, ale według ich uczynków nie postępujcie. Mówią bowiem, ale nie czynią."
  tags: []
"Mt23,4":
  text: "Bo wiążą brzemiona ciężkie i nie do uniesienia i kładą je na barki ludzi, lecz sami nie chcą ich ruszyć nawet palcem."
  tags: []
"Mt23,5":
  text: "A wszystkie swoje uczynki spełniają, aby ludzie ich widzieli. Poszerzają swoje filakterie i wydłużają frędzle swoich płaszczy."
  tags: []
"Mt23,6":
  text: "Kochają też pierwsze miejsca na ucztach i pierwsze krzesła w synagogach;"
  tags: []
"Mt23,7":
  text: "I pozdrowienia na rynkach, i aby ludzie nazywali ich: Rabbi, Rabbi!"
  tags: []
"Mt23,8":
  text: "Ale wy nie nazywajcie się Rabbi. Jeden bowiem jest wasz Mistrz, Chrystus, a wy wszyscy jesteście braćmi."
  tags: []
"Mt23,9":
  text: "I nikogo na ziemi nie nazywajcie waszym ojcem. Jeden bowiem jest wasz Ojciec, który jest w niebie."
  tags: []
"Mt23,10":
  text: "Niech też was nie nazywają mistrzami, gdyż jeden jest wasz Mistrz, Chrystus."
  tags: []
"Mt23,11":
  text: "Ale kto z was jest największy, będzie waszym sługą."
  tags: []
"Mt23,12":
  text: "Kto się wywyższa, będzie poniżony, a kto się poniża, będzie wywyższony."
  tags: []
"Mt23,13":
  text: "Lecz biada wam, uczeni w Piśmie i faryzeusze, obłudnicy, bo zamykacie królestwo niebieskie przed ludźmi. Sami bowiem tam nie wchodzicie ani wchodzącym nie pozwalacie wejść."
  tags: []
"Mt23,14":
  text: "Biada wam, uczeni w Piśmie i faryzeusze, obłudnicy, bo pożeracie domy wdów i dla pozoru odprawiacie długie modlitwy. Dlatego otrzymacie surowszy wyrok."
  tags: []
"Mt23,15":
  text: "Biada wam, uczeni w Piśmie i faryzeusze, obłudnicy, bo obchodzicie morza i lądy, aby pozyskać jednego współwyznawcę, a gdy się nim stanie, czynicie go synem piekła dwa razy takim jak wy sami."
  tags: []
"Mt23,16":
  text: "Biada wam, ślepi przewodnicy, którzy mówicie: Kto przysięga na świątynię, to nic nie znaczy, ale kto przysięga na złoto świątyni, jest związany przysięgą."
  tags: []
"Mt23,17":
  text: "Głupi i ślepi! Cóż bowiem jest ważniejsze: złoto czy świątynia, która uświęca złoto?"
  tags: []
"Mt23,18":
  text: "A kto przysięga na ołtarz, to nic nie znaczy, lecz kto przysięga na ofiarę, która jest na nim, jest związany przysięgą."
  tags: []
"Mt23,19":
  text: "Głupi i ślepi! Cóż bowiem jest ważniejsze: ofiara czy ołtarz, który uświęca ofiarę?"
  tags: []
"Mt23,20":
  text: "Kto więc przysięga na ołtarz, przysięga na niego i na to wszystko, co na nim leży."
  tags: []
"Mt23,21":
  text: "A kto przysięga na świątynię, przysięga na nią i na tego, który w niej mieszka."
  tags: []
"Mt23,22":
  text: "I kto przysięga na niebo, przysięga na tron Boga i na tego, który na nim zasiada."
  tags: []
"Mt23,23":
  text: "Biada wam, uczeni w Piśmie i faryzeusze, obłudnicy, bo dajecie dziesięcinę z mięty, anyżu i kminku, a opuszczacie to, co ważniejsze w prawie: sąd, miłosierdzie i wiarę. To należało czynić i tamtego nie zaniedbywać."
  tags: []
"Mt23,24":
  text: "Ślepi przewodnicy! Przecedzacie komara, a połykacie wielbłąda."
  tags: []
"Mt23,25":
  text: "Biada wam, uczeni w Piśmie i faryzeusze, obłudnicy, bo oczyszczacie kubek i misę z zewnątrz, a wewnątrz pełne są zdzierstwa i niepowściągliwości."
  tags: []
"Mt23,26":
  text: "Ślepy faryzeuszu, oczyść najpierw wnętrze kubka i misy, aby i to, co jest na zewnątrz, było czyste."
  tags: []
"Mt23,27":
  text: "Biada wam, uczeni w Piśmie i faryzeusze, obłudnicy, bo jesteście podobni do grobów pobielanych, które z zewnątrz wydają się piękne, ale wewnątrz pełne są kości umarłych i wszelkiej nieczystości."
  tags: []
"Mt23,28":
  text: "Tak i wy na zewnątrz wydajecie się ludziom sprawiedliwi, ale wewnątrz jesteście pełni obłudy i nieprawości."
  tags: []
"Mt23,29":
  text: "Biada wam, uczeni w Piśmie i faryzeusze, obłudnicy, bo budujecie grobowce proroków i zdobicie nagrobki sprawiedliwych;"
  tags: []
"Mt23,30":
  text: "I mówicie: Gdybyśmy żyli za dni naszych ojców, nie bylibyśmy ich wspólnikami w przelewaniu krwi proroków."
  tags: []
"Mt23,31":
  text: "A tak sami sobie wystawiacie świadectwo, że jesteście synami tych, którzy pozabijali proroków."
  tags: []
"Mt23,32":
  text: "I wy dopełnijcie miary waszych ojców!"
  tags: []
"Mt23,33":
  text: "Węże, plemię żmijowe! Jakże będziecie mogli uniknąć potępienia ognia piekielnego?"
  tags: []
"Mt23,34":
  text: "Dlatego ja posyłam do was proroków, mędrców i uczonych w Piśmie. Niektórych z nich zabijecie i ukrzyżujecie, a niektórych ubiczujecie w waszych synagogach i będziecie ich prześladować od miasta do miasta;"
  tags: []
"Mt23,35":
  text: "Aby spadła na was wszelka krew sprawiedliwa przelana na ziemi, od krwi sprawiedliwego Abla aż do krwi Zachariasza, syna Barachiasza, którego zabiliście między świątynią a ołtarzem."
  tags: []
"Mt23,36":
  text: "Zaprawdę powiadam wam: Spadnie to wszystko na to pokolenie."
  tags: []
"Mt23,37":
  text: "Jeruzalem, Jeruzalem, które zabijasz proroków i kamienujesz tych, którzy są do ciebie posłani! Ile razy chciałem zgromadzić twoje dzieci, tak jak kokoszka gromadzi swe kurczęta pod skrzydła, a nie chcieliście!"
  tags: []
"Mt23,38":
  text: "Oto wasz dom zostanie wam pusty."
  tags: []
"Mt23,39":
  text: "Mówię wam bowiem: Odtąd nie ujrzycie mnie, aż powiecie: Błogosławiony, który przychodzi w imieniu Pana."
  tags: []
