"Mt23,1": "Wtedy Jezus powiedział do tłumów i do swoich uczniów:"
"Mt23,2": "Na katedrze Mojżesza zasiedli uczeni w Piśmie i faryzeusze."
"Mt23,3": "Czyńcie więc i przestrzegajcie wszystkiego, co nakazują wam przestrzegać, ale według ich uczynków nie postępujcie. Mówią bowiem, ale nie czynią."
"Mt23,4": "Bo wiążą brzemiona ciężkie i nie do uniesienia i kładą je na barki ludzi, lecz sami nie chcą ich ruszyć nawet palcem."
"Mt23,5": "A wszystkie swoje uczynki spełniają, aby ludzie ich widzieli. Poszerzają swoje filakterie i wydłużają frędzle swoich płaszczy."
"Mt23,6": "Kochają też pierwsze miejsca na ucztach i pierwsze krzesła w synagogach;"
"Mt23,7": "I pozdrowienia na rynkach, i aby ludzie nazywali ich: Rabbi, Rabbi!"
"Mt23,8": "Ale wy nie nazywajcie się Rabbi. Jeden bowiem jest wasz Mistrz, Chrystus, a wy wszyscy jesteście braćmi."
"Mt23,9": "I nikogo na ziemi nie nazywajcie waszym ojcem. Jeden bowiem jest wasz Ojciec, który jest w niebie."
"Mt23,10": "Niech też was nie nazywają mistrzami, gdyż jeden jest wasz Mistrz, Chrystus."
"Mt23,11": "Ale kto z was jest największy, będzie waszym sługą."
"Mt23,12": "Kto się wywyższa, będzie poniżony, a kto się poniża, będzie wywyższony."
"Mt23,13": "Lecz biada wam, uczeni w Piśmie i faryzeusze, obłudnicy, bo zamykacie królestwo niebieskie przed ludźmi. Sami bowiem tam nie wchodzicie ani wchodzącym nie pozwalacie wejść."
"Mt23,14": "Biada wam, uczeni w Piśmie i faryzeusze, obłudnicy, bo pożeracie domy wdów i dla pozoru odprawiacie długie modlitwy. Dlatego otrzymacie surowszy wyrok."
"Mt23,15": "Biada wam, uczeni w Piśmie i faryzeusze, obłudnicy, bo obchodzicie morza i lądy, aby pozyskać jednego współwyznawcę, a gdy się nim stanie, czynicie go synem piekła dwa razy takim jak wy sami."
"Mt23,16": "Biada wam, ślepi przewodnicy, którzy mówicie: Kto przysięga na świątynię, to nic nie znaczy, ale kto przysięga na złoto świątyni, jest związany przysięgą."
"Mt23,17": "Głupi i ślepi! Cóż bowiem jest ważniejsze: złoto czy świątynia, która uświęca złoto?"
"Mt23,18": "A kto przysięga na ołtarz, to nic nie znaczy, lecz kto przysięga na ofiarę, która jest na nim, jest związany przysięgą."
"Mt23,19": "Głupi i ślepi! Cóż bowiem jest ważniejsze: ofiara czy ołtarz, który uświęca ofiarę?"
"Mt23,20": "Kto więc przysięga na ołtarz, przysięga na niego i na to wszystko, co na nim leży."
"Mt23,21": "A kto przysięga na świątynię, przysięga na nią i na tego, który w niej mieszka."
"Mt23,22": "I kto przysięga na niebo, przysięga na tron Boga i na tego, który na nim zasiada."
"Mt23,23": "Biada wam, uczeni w Piśmie i faryzeusze, obłudnicy, bo dajecie dziesięcinę z mięty, anyżu i kminku, a opuszczacie to, co ważniejsze w prawie: sąd, miłosierdzie i wiarę. To należało czynić i tamtego nie zaniedbywać."
"Mt23,24": "Ślepi przewodnicy! Przecedzacie komara, a połykacie wielbłąda."
"Mt23,25": "Biada wam, uczeni w Piśmie i faryzeusze, obłudnicy, bo oczyszczacie kubek i misę z zewnątrz, a wewnątrz pełne są zdzierstwa i niepowściągliwości."
"Mt23,26": "Ślepy faryzeuszu, oczyść najpierw wnętrze kubka i misy, aby i to, co jest na zewnątrz, było czyste."
"Mt23,27": "Biada wam, uczeni w Piśmie i faryzeusze, obłudnicy, bo jesteście podobni do grobów pobielanych, które z zewnątrz wydają się piękne, ale wewnątrz pełne są kości umarłych i wszelkiej nieczystości."
"Mt23,28": "Tak i wy na zewnątrz wydajecie się ludziom sprawiedliwi, ale wewnątrz jesteście pełni obłudy i nieprawości."
"Mt23,29": "Biada wam, uczeni w Piśmie i faryzeusze, obłudnicy, bo budujecie grobowce proroków i zdobicie nagrobki sprawiedliwych;"
"Mt23,30": "I mówicie: Gdybyśmy żyli za dni naszych ojców, nie bylibyśmy ich wspólnikami w przelewaniu krwi proroków."
"Mt23,31": "A tak sami sobie wystawiacie świadectwo, że jesteście synami tych, którzy pozabijali proroków."
"Mt23,32": "I wy dopełnijcie miary waszych ojców!"
"Mt23,33": "Węże, plemię żmijowe! Jakże będziecie mogli uniknąć potępienia ognia piekielnego?"
"Mt23,34": "Dlatego ja posyłam do was proroków, mędrców i uczonych w Piśmie. Niektórych z nich zabijecie i ukrzyżujecie, a niektórych ubiczujecie w waszych synagogach i będziecie ich prześladować od miasta do miasta;"
"Mt23,35": "Aby spadła na was wszelka krew sprawiedliwa przelana na ziemi, od krwi sprawiedliwego Abla aż do krwi Zachariasza, syna Barachiasza, którego zabiliście między świątynią a ołtarzem."
"Mt23,36": "Zaprawdę powiadam wam: Spadnie to wszystko na to pokolenie."
"Mt23,37": "Jeruzalem, Jeruzalem, które zabijasz proroków i kamienujesz tych, którzy są do ciebie posłani! Ile razy chciałem zgromadzić twoje dzieci, tak jak kokoszka gromadzi swe kurczęta pod skrzydła, a nie chcieliście!"
"Mt23,38": "Oto wasz dom zostanie wam pusty."
"Mt23,39": "Mówię wam bowiem: Odtąd nie ujrzycie mnie, aż powiecie: Błogosławiony, który przychodzi w imieniu Pana."
