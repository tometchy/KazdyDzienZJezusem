"Mt2,1":
  text: "A gdy Jezus urodził się w Betlejem w Judei za dni króla Heroda, oto mędrcy ze Wschodu przybyli do Jerozolimy i pytali:"
  tags: []
"Mt2,2":
  text: "Gdzież jest ten król Żydów, który się urodził? Widzieliśmy bowiem jego gwiazdę na Wschodzie i przyjechaliśmy, aby oddać mu pokłon."
  tags: []
"Mt2,3":
  text: "Gdy król Herod to usłyszał, przeraził się, a z nim cała Jerozolima."
  tags: []
"Mt2,4":
  text: "Zebrawszy więc wszystkich naczelnych kapłanów i nauczycieli ludu, wypytywał ich, gdzie miał się urodzić Chrystus."
  tags: []
"Mt2,5":
  text: "A oni mu powiedzieli: W Betlejem w Judei; bo tak jest napisane przez proroka:"
  tags: []
"Mt2,6":
  text: "A ty, Betlejem, ziemio Judy, wcale nie jesteś najmniejsze wśród władców Judei, z ciebie bowiem wyjdzie władca, który będzie rządził moim ludem, Izraelem."
  tags: []
"Mt2,7":
  text: "Wtedy Herod wezwał potajemnie mędrców i dowiadywał się dokładnie o czas ukazania się gwiazdy."
  tags: []
"Mt2,8":
  text: "A posyłając ich do Betlejem, powiedział: Jedźcie i wypytajcie się dokładnie o to dziecko, a gdy je znajdziecie, donieście mi, abym i ja pojechał i oddał mu pokłon."
  tags: []
"Mt2,9":
  text: "Oni więc, wysłuchawszy króla, odeszli. A oto gwiazda, którą widzieli na Wschodzie, prowadziła ich, aż przyszła i zatrzymała się nad miejscem, gdzie było dziecko."
  tags: []
"Mt2,10":
  text: "A gdy zobaczyli gwiazdę, ogromnie się ucieszyli."
  tags: []
"Mt2,11":
  text: "Kiedy weszli do domu, zobaczyli dziecko z Marią, jego matką, i upadłszy, oddali mu pokłon, potem otworzyli swoje skarby i ofiarowali mu dary: złoto, kadzidło i mirrę."
  tags: []
"Mt2,12":
  text: "Lecz będąc ostrzeżeni przez Boga we śnie, aby nie wracali do Heroda, powrócili do swojej ziemi inną drogą."
  tags: []
"Mt2,13":
  text: "A gdy oni odeszli, oto anioł Pana ukazał się we śnie Józefowi i powiedział: Wstań, weź dziecko oraz jego matkę i uciekaj do Egiptu, i zostań tam, aż ci powiem. Herod bowiem będzie szukał dziecka, aby je zabić."
  tags: []
"Mt2,14":
  text: "Wstał więc, wziął w nocy dziecko oraz jego matkę i uciekł do Egiptu."
  tags: []
"Mt2,15":
  text: "I przebywał tam aż do śmierci Heroda, aby się wypełniło, co powiedział Pan przez proroka: Z Egiptu wezwałem mego syna."
  tags: []
"Mt2,16":
  text: "Wówczas Herod, widząc, że został oszukany przez mędrców, bardzo się rozgniewał i kazał zabić wszystkie dzieci, które były w Betlejem i całej okolicy, w wieku do dwóch lat, stosownie do czasu, o którym się dokładnie dowiedział od mędrców."
  tags: []
"Mt2,17":
  text: "Wtedy wypełniło się to, co zostało powiedziane przez proroka Jeremiasza:"
  tags: []
"Mt2,18":
  text: "Słychać głos w Rama, lament, płacz i wielkie zawodzenie. Rachel opłakuje swoje dzieci i nie daje się pocieszyć, bo już ich nie ma."
  tags: []
"Mt2,19":
  text: "A gdy Herod umarł, oto anioł Pana ukazał się we śnie Józefowi w Egipcie;"
  tags: []
"Mt2,20":
  text: "I powiedział: Wstań, weź dziecko oraz jego matkę i idź do ziemi izraelskiej. Umarli bowiem ci, którzy czyhali na życie dziecka."
  tags: []
"Mt2,21":
  text: "Wstał więc, wziął dziecko oraz jego matkę i przybył do ziemi izraelskiej."
  tags: []
"Mt2,22":
  text: "Lecz gdy usłyszał, że Archelaus króluje w Judei w miejsce Heroda, swego ojca, bał się tam iść. Ale będąc napomniany przez Boga we śnie, odszedł w strony Galilei."
  tags: []
"Mt2,23":
  text: "A przyszedłszy, mieszkał w mieście zwanym Nazaret, aby się wypełniło to, co zostało powiedziane przez proroków: Będzie nazwany Nazarejczykiem."
  tags: []
