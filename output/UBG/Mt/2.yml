"Mt2,1": "A gdy Jezus urodził się w Betlejem w Judei za dni króla Heroda, oto mędrcy ze Wschodu przybyli do Jerozolimy i pytali:"
"Mt2,2": "Gdzież jest ten król Żydów, który się urodził? Widzieliśmy bowiem jego gwiazdę na Wschodzie i przyjechaliśmy, aby oddać mu pokłon."
"Mt2,3": "Gdy król Herod to usłyszał, przeraził się, a z nim cała Jerozolima."
"Mt2,4": "Zebrawszy więc wszystkich naczelnych kapłanów i nauczycieli ludu, wypytywał ich, gdzie miał się urodzić Chrystus."
"Mt2,5": "A oni mu powiedzieli: W Betlejem w Judei; bo tak jest napisane przez proroka:"
"Mt2,6": "A ty, Betlejem, ziemio Judy, wcale nie jesteś najmniejsze wśród władców Judei, z ciebie bowiem wyjdzie władca, który będzie rządził moim ludem, Izraelem."
"Mt2,7": "Wtedy Herod wezwał potajemnie mędrców i dowiadywał się dokładnie o czas ukazania się gwiazdy."
"Mt2,8": "A posyłając ich do Betlejem, powiedział: Jedźcie i wypytajcie się dokładnie o to dziecko, a gdy je znajdziecie, donieście mi, abym i ja pojechał i oddał mu pokłon."
"Mt2,9": "Oni więc, wysłuchawszy króla, odeszli. A oto gwiazda, którą widzieli na Wschodzie, prowadziła ich, aż przyszła i zatrzymała się nad miejscem, gdzie było dziecko."
"Mt2,10": "A gdy zobaczyli gwiazdę, ogromnie się ucieszyli."
"Mt2,11": "Kiedy weszli do domu, zobaczyli dziecko z Marią, jego matką, i upadłszy, oddali mu pokłon, potem otworzyli swoje skarby i ofiarowali mu dary: złoto, kadzidło i mirrę."
"Mt2,12": "Lecz będąc ostrzeżeni przez Boga we śnie, aby nie wracali do Heroda, powrócili do swojej ziemi inną drogą."
"Mt2,13": "A gdy oni odeszli, oto anioł Pana ukazał się we śnie Józefowi i powiedział: Wstań, weź dziecko oraz jego matkę i uciekaj do Egiptu, i zostań tam, aż ci powiem. Herod bowiem będzie szukał dziecka, aby je zabić."
"Mt2,14": "Wstał więc, wziął w nocy dziecko oraz jego matkę i uciekł do Egiptu."
"Mt2,15": "I przebywał tam aż do śmierci Heroda, aby się wypełniło, co powiedział Pan przez proroka: Z Egiptu wezwałem mego syna."
"Mt2,16": "Wówczas Herod, widząc, że został oszukany przez mędrców, bardzo się rozgniewał i kazał zabić wszystkie dzieci, które były w Betlejem i całej okolicy, w wieku do dwóch lat, stosownie do czasu, o którym się dokładnie dowiedział od mędrców."
"Mt2,17": "Wtedy wypełniło się to, co zostało powiedziane przez proroka Jeremiasza:"
"Mt2,18": "Słychać głos w Rama, lament, płacz i wielkie zawodzenie. Rachel opłakuje swoje dzieci i nie daje się pocieszyć, bo już ich nie ma."
"Mt2,19": "A gdy Herod umarł, oto anioł Pana ukazał się we śnie Józefowi w Egipcie;"
"Mt2,20": "I powiedział: Wstań, weź dziecko oraz jego matkę i idź do ziemi izraelskiej. Umarli bowiem ci, którzy czyhali na życie dziecka."
"Mt2,21": "Wstał więc, wziął dziecko oraz jego matkę i przybył do ziemi izraelskiej."
"Mt2,22": "Lecz gdy usłyszał, że Archelaus króluje w Judei w miejsce Heroda, swego ojca, bał się tam iść. Ale będąc napomniany przez Boga we śnie, odszedł w strony Galilei."
"Mt2,23": "A przyszedłszy, mieszkał w mieście zwanym Nazaret, aby się wypełniło to, co zostało powiedziane przez proroków: Będzie nazwany Nazarejczykiem."
