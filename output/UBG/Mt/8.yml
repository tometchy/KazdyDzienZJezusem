"Mt8,1":
  text: "A gdy zszedł z góry, poszło za nim mnóstwo ludzi."
  tags: []
"Mt8,2":
  text: "A oto trędowaty podszedł i oddał mu pokłon, mówiąc: Panie, jeśli chcesz, możesz mnie oczyścić."
  tags: []
"Mt8,3":
  text: "Jezus wyciągnął rękę i dotknął go, mówiąc: Chcę, bądź oczyszczony. I natychmiast został oczyszczony z trądu."
  tags: []
"Mt8,4":
  text: "Wtedy Jezus powiedział do niego: Uważaj, abyś nikomu nie mówił, ale idź, pokaż się kapłanowi i ofiaruj dar, który nakazał Mojżesz, na świadectwo dla nich."
  tags: []
"Mt8,5":
  text: "A gdy Jezus wszedł do Kafarnaum, przyszedł do niego setnik i prosił go:"
  tags: []
"Mt8,6":
  text: "Panie, mój sługa leży w domu sparaliżowany i bardzo cierpi."
  tags: []
"Mt8,7":
  text: "I powiedział mu Jezus: Przyjdę i uzdrowię go."
  tags: []
"Mt8,8":
  text: "Lecz setnik odpowiedział: Panie, nie jestem godny, abyś wszedł pod mój dach, ale powiedz tylko słowo, a mój sługa będzie uzdrowiony."
  tags: []
"Mt8,9":
  text: "Bo i ja jestem człowiekiem podległym władzy i mam pod sobą żołnierzy. Mówię jednemu: Idź, a idzie; a drugiemu: Chodź tu, a przychodzi; a memu słudze: Zrób to, a robi."
  tags: []
"Mt8,10":
  text: "A gdy Jezus to usłyszał, zdziwił się i powiedział do tych, którzy szli za nim: Zaprawdę powiadam wam: Nawet w Izraelu nie znalazłem tak wielkiej wiary."
  tags: []
"Mt8,11":
  text: "A mówię wam: Wielu przyjdzie ze wschodu i z zachodu i zasiądą za stołem z Abrahamem, Izaakiem i Jakubem w królestwie niebieskim."
  tags: []
"Mt8,12":
  text: "Lecz synowie królestwa będą wyrzuceni do ciemności zewnętrznych. Tam będzie płacz i zgrzytanie zębów."
  tags: []
"Mt8,13":
  text: "I powiedział Jezus setnikowi: Idź, a jak uwierzyłeś, tak niech ci się stanie. I o tej godzinie jego sługa został uzdrowiony."
  tags: []
"Mt8,14":
  text: "A gdy Jezus przyszedł do domu Piotra, zobaczył jego teściową, która leżała w gorączce."
  tags: []
"Mt8,15":
  text: "Dotknął więc jej ręki i opuściła ją gorączka. Ona zaś wstała i usługiwała im."
  tags: []
"Mt8,16":
  text: "Kiedy nastał wieczór, przyprowadzono do niego wielu opętanych. A on wypędził duchy słowem i uzdrowił wszystkich chorych;"
  tags: []
"Mt8,17":
  text: "Aby się wypełniło, co zostało powiedziane przez proroka Izajasza: On nasze słabości wziął na siebie i nosił nasze choroby."
  tags: []
"Mt8,18":
  text: "A Jezus, widząc wokół siebie mnóstwo ludzi, kazał przeprawić się na drugi brzeg."
  tags: []
"Mt8,19":
  text: "Wtedy podszedł pewien uczony w Piśmie i powiedział do niego: Mistrzu, pójdę za tobą, dokądkolwiek pójdziesz."
  tags: []
"Mt8,20":
  text: "I powiedział mu Jezus: Lisy mają nory, a ptaki niebieskie – gniazda, ale Syn Człowieczy nie ma gdzie położyć głowy."
  tags: []
"Mt8,21":
  text: "A inny spośród jego uczniów powiedział do niego: Panie, pozwól mi najpierw pójść i pogrzebać mego ojca."
  tags: []
"Mt8,22":
  text: "Ale Jezus mu odpowiedział: Pójdź za mną, a umarli niech grzebią swoich umarłych."
  tags: []
"Mt8,23":
  text: "Gdy wsiadł do łodzi, weszli za nim i jego uczniowie."
  tags: []
"Mt8,24":
  text: "A oto zerwała się na morzu wielka burza, tak że fale zalewały łódź. On zaś spał."
  tags: []
"Mt8,25":
  text: "A jego uczniowie, podszedłszy, obudzili go, mówiąc: Panie, ratuj nas! Giniemy!"
  tags: []
"Mt8,26":
  text: "I powiedział do nich: Czemu się boicie, ludzie małej wiary? Potem wstał, zgromił wichry i morze i nastała wielka cisza."
  tags: []
"Mt8,27":
  text: "A ludzie dziwili się i mówili: Cóż to za człowiek, że nawet wichry i morze są mu posłuszne?"
  tags: []
"Mt8,28":
  text: "Kiedy przeprawił się na drugą stronę do krainy Gerazeńczyków, zabiegli mu drogę dwaj opętani, którzy wyszli z grobowców, tak bardzo groźni, że nikt nie mógł przechodzić tą drogą."
  tags: []
"Mt8,29":
  text: "I zaczęli krzyczeć: Cóż my mamy z tobą, Jezusie, Synu Boży? Przyszedłeś tu przed czasem dręczyć nas?"
  tags: []
"Mt8,30":
  text: "Z dala od nich pasło się wielkie stado świń."
  tags: []
"Mt8,31":
  text: "Demony więc prosiły go: Jeśli nas wypędzasz, pozwól nam wejść w to stado świń."
  tags: []
"Mt8,32":
  text: "I powiedział im: Idźcie. A one, wyszedłszy, weszły w to stado świń. Naraz całe stado ruszyło pędem po urwisku do morza i zginęło w wodach."
  tags: []
"Mt8,33":
  text: "A pasterze uciekli i poszedłszy do miasta, opowiedzieli wszystko, także to, co się stało z opętanymi."
  tags: []
"Mt8,34":
  text: "Wówczas całe miasto wyszło Jezusowi na spotkanie, a ujrzawszy go, prosili, aby odszedł z ich granic."
  tags: []
