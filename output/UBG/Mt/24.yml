"Mt24,1": "A Jezus wyszedł ze świątyni i oddalił się. I podeszli do niego jego uczniowie, aby pokazać mu zabudowania świątynne."
"Mt24,2": "Lecz Jezus powiedział do nich: Czyż nie widzicie tego wszystkiego? Zaprawdę powiadam wam, nie zostanie tu kamień na kamieniu, który by nie został zwalony."
"Mt24,3": "A gdy siedział na Górze Oliwnej, podeszli do niego uczniowie i pytali na osobności: Powiedz nam, kiedy się to stanie i jaki będzie znak twego przyjścia i końca świata?"
"Mt24,4": "I odpowiedział im Jezus: Uważajcie, aby was ktoś nie zwiódł."
"Mt24,5": "Wielu bowiem przyjdzie pod moim imieniem, mówiąc: Ja jestem Chrystusem. I wielu zwiodą."
"Mt24,6": "Usłyszycie też o wojnach i pogłoski o wojnach. Uważajcie, abyście się nie trwożyli. Wszystko to bowiem musi się stać, ale to jeszcze nie koniec."
"Mt24,7": "Powstanie bowiem naród przeciwko narodowi i królestwo przeciwko królestwu i będzie głód, zaraza i trzęsienia ziemi miejscami."
"Mt24,8": "Lecz to wszystko jest początkiem boleści."
"Mt24,9": "Wtedy wydadzą was na udrękę, będą was zabijać i będziecie znienawidzeni przez wszystkie narody z powodu mego imienia."
"Mt24,10": "A wówczas wielu się zgorszy, będą się wzajemnie wydawać i jedni drugich nienawidzić."
"Mt24,11": "Powstanie też wielu fałszywych proroków i wielu zwiodą."
"Mt24,12": "A ponieważ wzmoże się nieprawość, miłość wielu oziębnie."
"Mt24,13": "Lecz kto wytrwa aż do końca, ten będzie zbawiony."
"Mt24,14": "A ta ewangelia królestwa będzie głoszona po całym świecie na świadectwo wszystkim narodom. I wtedy przyjdzie koniec."
"Mt24,15": "Gdy więc zobaczycie obrzydliwość spustoszenia, o której mówił prorok Daniel, stojącą w miejscu świętym (kto czyta, niech rozumie);"
"Mt24,16": "Wtedy ci, którzy będą w Judei, niech uciekają w góry."
"Mt24,17": "Kto będzie na dachu, niech nie schodzi, aby coś zabrać ze swego domu."
"Mt24,18": "Kto zaś będzie w polu, niech nie wraca, aby wziąć swe szaty."
"Mt24,19": "A biada brzemiennym i karmiącym w tych dniach!"
"Mt24,20": "Módlcie się więc, aby wasza ucieczka nie wypadła w zimie albo w szabat."
"Mt24,21": "Wtedy bowiem będzie wielki ucisk, jakiego nie było od początku świata aż dotąd ani nigdy nie będzie."
"Mt24,22": "A gdyby te dni nie były skrócone, żadne ciało nie byłoby zbawione. Ale ze względu na wybranych dni te będą skrócone."
"Mt24,23": "Jeśli wtedy ktoś wam powie: Oto tu jest Chrystus, albo: Jest tam – nie wierzcie."
"Mt24,24": "Powstaną bowiem fałszywi Chrystusowie i fałszywi prorocy i będą czynić wielkie znaki i cuda, żeby zwieść, o ile można, nawet wybranych."
"Mt24,25": "Oto wam przepowiedziałem."
"Mt24,26": "Jeśli więc wam powiedzą: Oto jest na pustyni – nie wychodźcie; Oto wewnątrz domu – nie wierzcie."
"Mt24,27": "Jak bowiem błyskawica pojawia się na wschodzie i jest widoczna aż na zachodzie, tak będzie z przyjściem Syna Człowieczego."
"Mt24,28": "Bo gdzie jest padlina, tam się zgromadzą i orły."
"Mt24,29": "A zaraz po ucisku tych dni słońce się zaćmi i księżyc nie da swego blasku, gwiazdy będą spadać z nieba i moce niebieskie zostaną poruszone."
"Mt24,30": "Wówczas ukaże się na niebie znak Syna Człowieczego. Wtedy będą lamentować wszystkie ludy ziemi i ujrzą Syna Człowieczego przychodzącego na obłokach niebieskich z mocą i wielką chwałą."
"Mt24,31": "Pośle on swoich aniołów z potężnym głosem trąby i zgromadzą jego wybranych z czterech stron świata, od jednego krańca nieba aż do drugiego."
"Mt24,32": "A od drzewa figowego uczcie się przez podobieństwo: Gdy jego gałąź już staje się miękka i wypuszcza liście, poznajecie, że lato jest blisko."
"Mt24,33": "Tak i wy, gdy ujrzycie to wszystko, wiedzcie, że jest blisko, u drzwi."
"Mt24,34": "Zaprawdę powiadam wam: Nie przeminie to pokolenie, aż się to wszystko stanie."
"Mt24,35": "Niebo i ziemia przeminą, ale moje słowa nie przeminą."
"Mt24,36": "Lecz o tym dniu i godzinie nikt nie wie, nawet aniołowie niebiescy, tylko sam mój Ojciec."
"Mt24,37": "A jak było za dni Noego, tak będzie z przyjściem Syna Człowieczego."
"Mt24,38": "Jak bowiem za tych dni przed potopem jedli i pili, żenili się i za mąż wydawali aż do tego dnia, w którym Noe wszedł do arki;"
"Mt24,39": "I nie spostrzegli się, aż przyszedł potop i zabrał wszystkich – tak będzie i z przyjściem Syna Człowieczego."
"Mt24,40": "Wtedy dwóch będzie w polu, jeden będzie wzięty, a drugi zostawiony."
"Mt24,41": "Dwie będą mleć na żarnach, jedna będzie wzięta, a druga zostawiona."
"Mt24,42": "Czuwajcie więc, ponieważ nie wiecie, o której godzinie wasz Pan przyjdzie."
"Mt24,43": "A to wiedzcie, że gdyby gospodarz wiedział, o jakiej porze ma przyjść złodziej, czuwałby i nie pozwoliłby włamać się do swego domu."
"Mt24,44": "Dlatego i wy bądźcie gotowi, bo Syn Człowieczy przyjdzie o godzinie, której się nie spodziewacie."
"Mt24,45": "Któż więc jest sługą wiernym i roztropnym, którego pan ustanowił nad swoją służbą, aby im dawał pokarm o właściwej porze?"
"Mt24,46": "Błogosławiony ten sługa, którego pan, gdy przyjdzie, zastanie tak czyniącego."
"Mt24,47": "Zaprawdę powiadam wam, że ustanowi go nad wszystkimi swymi dobrami."
"Mt24,48": "Lecz jeśli powie ten zły sługa w swoim sercu: Mój pan zwleka z przyjściem;"
"Mt24,49": "I zacznie bić współsługi, jeść i pić z pijakami;"
"Mt24,50": "Przyjdzie pan tego sługi w dniu, w którym się nie spodziewa, i o godzinie, której nie zna."
"Mt24,51": "Wtedy odłączy go i wyznaczy mu dział z obłudnikami. Tam będzie płacz i zgrzytanie zębów."
