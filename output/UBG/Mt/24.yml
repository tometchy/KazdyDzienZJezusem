"Mt24,1":
  text: "A Jezus wyszedł ze świątyni i oddalił się. I podeszli do niego jego uczniowie, aby pokazać mu zabudowania świątynne."
  tags: []
"Mt24,2":
  text: "Lecz Jezus powiedział do nich: Czyż nie widzicie tego wszystkiego? Zaprawdę powiadam wam, nie zostanie tu kamień na kamieniu, który by nie został zwalony."
  tags: []
"Mt24,3":
  text: "A gdy siedział na Górze Oliwnej, podeszli do niego uczniowie i pytali na osobności: Powiedz nam, kiedy się to stanie i jaki będzie znak twego przyjścia i końca świata?"
  tags: []
"Mt24,4":
  text: "I odpowiedział im Jezus: Uważajcie, aby was ktoś nie zwiódł."
  tags: []
"Mt24,5":
  text: "Wielu bowiem przyjdzie pod moim imieniem, mówiąc: Ja jestem Chrystusem. I wielu zwiodą."
  tags: []
"Mt24,6":
  text: "Usłyszycie też o wojnach i pogłoski o wojnach. Uważajcie, abyście się nie trwożyli. Wszystko to bowiem musi się stać, ale to jeszcze nie koniec."
  tags: []
"Mt24,7":
  text: "Powstanie bowiem naród przeciwko narodowi i królestwo przeciwko królestwu i będzie głód, zaraza i trzęsienia ziemi miejscami."
  tags: []
"Mt24,8":
  text: "Lecz to wszystko jest początkiem boleści."
  tags: []
"Mt24,9":
  text: "Wtedy wydadzą was na udrękę, będą was zabijać i będziecie znienawidzeni przez wszystkie narody z powodu mego imienia."
  tags: []
"Mt24,10":
  text: "A wówczas wielu się zgorszy, będą się wzajemnie wydawać i jedni drugich nienawidzić."
  tags: []
"Mt24,11":
  text: "Powstanie też wielu fałszywych proroków i wielu zwiodą."
  tags: []
"Mt24,12":
  text: "A ponieważ wzmoże się nieprawość, miłość wielu oziębnie."
  tags: []
"Mt24,13":
  text: "Lecz kto wytrwa aż do końca, ten będzie zbawiony."
  tags: []
"Mt24,14":
  text: "A ta ewangelia królestwa będzie głoszona po całym świecie na świadectwo wszystkim narodom. I wtedy przyjdzie koniec."
  tags: []
"Mt24,15":
  text: "Gdy więc zobaczycie obrzydliwość spustoszenia, o której mówił prorok Daniel, stojącą w miejscu świętym (kto czyta, niech rozumie);"
  tags: []
"Mt24,16":
  text: "Wtedy ci, którzy będą w Judei, niech uciekają w góry."
  tags: []
"Mt24,17":
  text: "Kto będzie na dachu, niech nie schodzi, aby coś zabrać ze swego domu."
  tags: []
"Mt24,18":
  text: "Kto zaś będzie w polu, niech nie wraca, aby wziąć swe szaty."
  tags: []
"Mt24,19":
  text: "A biada brzemiennym i karmiącym w tych dniach!"
  tags: []
"Mt24,20":
  text: "Módlcie się więc, aby wasza ucieczka nie wypadła w zimie albo w szabat."
  tags: []
"Mt24,21":
  text: "Wtedy bowiem będzie wielki ucisk, jakiego nie było od początku świata aż dotąd ani nigdy nie będzie."
  tags: []
"Mt24,22":
  text: "A gdyby te dni nie były skrócone, żadne ciało nie byłoby zbawione. Ale ze względu na wybranych dni te będą skrócone."
  tags: []
"Mt24,23":
  text: "Jeśli wtedy ktoś wam powie: Oto tu jest Chrystus, albo: Jest tam – nie wierzcie."
  tags: []
"Mt24,24":
  text: "Powstaną bowiem fałszywi Chrystusowie i fałszywi prorocy i będą czynić wielkie znaki i cuda, żeby zwieść, o ile można, nawet wybranych."
  tags: []
"Mt24,25":
  text: "Oto wam przepowiedziałem."
  tags: []
"Mt24,26":
  text: "Jeśli więc wam powiedzą: Oto jest na pustyni – nie wychodźcie; Oto wewnątrz domu – nie wierzcie."
  tags: []
"Mt24,27":
  text: "Jak bowiem błyskawica pojawia się na wschodzie i jest widoczna aż na zachodzie, tak będzie z przyjściem Syna Człowieczego."
  tags: []
"Mt24,28":
  text: "Bo gdzie jest padlina, tam się zgromadzą i orły."
  tags: []
"Mt24,29":
  text: "A zaraz po ucisku tych dni słońce się zaćmi i księżyc nie da swego blasku, gwiazdy będą spadać z nieba i moce niebieskie zostaną poruszone."
  tags: []
"Mt24,30":
  text: "Wówczas ukaże się na niebie znak Syna Człowieczego. Wtedy będą lamentować wszystkie ludy ziemi i ujrzą Syna Człowieczego przychodzącego na obłokach niebieskich z mocą i wielką chwałą."
  tags: []
"Mt24,31":
  text: "Pośle on swoich aniołów z potężnym głosem trąby i zgromadzą jego wybranych z czterech stron świata, od jednego krańca nieba aż do drugiego."
  tags: []
"Mt24,32":
  text: "A od drzewa figowego uczcie się przez podobieństwo: Gdy jego gałąź już staje się miękka i wypuszcza liście, poznajecie, że lato jest blisko."
  tags: []
"Mt24,33":
  text: "Tak i wy, gdy ujrzycie to wszystko, wiedzcie, że jest blisko, u drzwi."
  tags: []
"Mt24,34":
  text: "Zaprawdę powiadam wam: Nie przeminie to pokolenie, aż się to wszystko stanie."
  tags: []
"Mt24,35":
  text: "Niebo i ziemia przeminą, ale moje słowa nie przeminą."
  tags: []
"Mt24,36":
  text: "Lecz o tym dniu i godzinie nikt nie wie, nawet aniołowie niebiescy, tylko sam mój Ojciec."
  tags: []
"Mt24,37":
  text: "A jak było za dni Noego, tak będzie z przyjściem Syna Człowieczego."
  tags: []
"Mt24,38":
  text: "Jak bowiem za tych dni przed potopem jedli i pili, żenili się i za mąż wydawali aż do tego dnia, w którym Noe wszedł do arki;"
  tags: []
"Mt24,39":
  text: "I nie spostrzegli się, aż przyszedł potop i zabrał wszystkich – tak będzie i z przyjściem Syna Człowieczego."
  tags: []
"Mt24,40":
  text: "Wtedy dwóch będzie w polu, jeden będzie wzięty, a drugi zostawiony."
  tags: []
"Mt24,41":
  text: "Dwie będą mleć na żarnach, jedna będzie wzięta, a druga zostawiona."
  tags: []
"Mt24,42":
  text: "Czuwajcie więc, ponieważ nie wiecie, o której godzinie wasz Pan przyjdzie."
  tags: []
"Mt24,43":
  text: "A to wiedzcie, że gdyby gospodarz wiedział, o jakiej porze ma przyjść złodziej, czuwałby i nie pozwoliłby włamać się do swego domu."
  tags: []
"Mt24,44":
  text: "Dlatego i wy bądźcie gotowi, bo Syn Człowieczy przyjdzie o godzinie, której się nie spodziewacie."
  tags: []
"Mt24,45":
  text: "Któż więc jest sługą wiernym i roztropnym, którego pan ustanowił nad swoją służbą, aby im dawał pokarm o właściwej porze?"
  tags: []
"Mt24,46":
  text: "Błogosławiony ten sługa, którego pan, gdy przyjdzie, zastanie tak czyniącego."
  tags: []
"Mt24,47":
  text: "Zaprawdę powiadam wam, że ustanowi go nad wszystkimi swymi dobrami."
  tags: []
"Mt24,48":
  text: "Lecz jeśli powie ten zły sługa w swoim sercu: Mój pan zwleka z przyjściem;"
  tags: []
"Mt24,49":
  text: "I zacznie bić współsługi, jeść i pić z pijakami;"
  tags: []
"Mt24,50":
  text: "Przyjdzie pan tego sługi w dniu, w którym się nie spodziewa, i o godzinie, której nie zna."
  tags: []
"Mt24,51":
  text: "Wtedy odłączy go i wyznaczy mu dział z obłudnikami. Tam będzie płacz i zgrzytanie zębów."
  tags: []
