"Mt28,1": "A gdy skończył się szabat i świtało pierwszego dnia tygodnia, Maria Magdalena i druga Maria przyszły obejrzeć grób."
"Mt28,2": "A oto powstało wielkie trzęsienie ziemi. Anioł Pana bowiem, zstąpiwszy z nieba, podszedł, odwalił kamień od wejścia i usiadł na nim."
"Mt28,3": "Jego oblicze było jak błyskawica, a jego szaty białe jak śnieg."
"Mt28,4": "A strażnicy drżeli ze strachu i stali się jak umarli."
"Mt28,5": "Anioł zaś powiedział do kobiet: Wy się nie bójcie! Wiem bowiem, że szukacie ukrzyżowanego Jezusa."
"Mt28,6": "Nie ma go tu. Powstał bowiem, jak powiedział. Chodźcie, zobaczcie miejsce, gdzie leżał Pan."
"Mt28,7": "Idźcie szybko i powiedzcie jego uczniom, że zmartwychwstał i oto udaje się do Galilei przed wami. Tam go ujrzycie. Oto wam powiedziałem."
"Mt28,8": "Odeszły więc szybko od grobu z bojaźnią i z wielką radością i pobiegły przekazać to jego uczniom."
"Mt28,9": "Kiedy szły przekazać to jego uczniom, nagle Jezus wyszedł im na spotkanie i powiedział: Witajcie! A one podeszły, objęły go za nogi i oddały mu pokłon."
"Mt28,10": "Wtedy Jezus powiedział do nich: Nie bójcie się! Idźcie, powiedzcie moim braciom, aby poszli do Galilei. Tam mnie ujrzą."
"Mt28,11": "A gdy one poszły, niektórzy ze straży przyszli do miasta i oznajmili naczelnym kapłanom wszystko, co się stało."
"Mt28,12": "Ci zaś zebrali się ze starszymi i naradziwszy się, dali żołnierzom sporo pieniędzy;"
"Mt28,13": "I powiedzieli: Mówcie, że jego uczniowie przyszli w nocy i wykradli go, gdy spaliście."
"Mt28,14": "A gdyby to doszło do namiestnika, my go przekonamy, a wam zapewnimy bezpieczeństwo."
"Mt28,15": "Wzięli więc pieniądze i zrobili, jak ich pouczono. I rozniosła się ta wieść wśród Żydów, i trwa aż do dziś."
"Mt28,16": "Potem jedenastu uczniów poszło do Galilei na górę, na którą Jezus im polecił."
"Mt28,17": "A gdy go ujrzeli, oddali mu pokłon. Niektórzy jednak wątpili."
"Mt28,18": "Wtedy Jezus podszedł i powiedział do nich: Dana mi jest wszelka władza na niebie i na ziemi."
"Mt28,19": "Idźcie więc i nauczajcie wszystkie narody, chrzcząc je w imię Ojca i Syna, i Ducha Świętego;"
"Mt28,20": "Ucząc je przestrzegać wszystkiego, co wam przykazałem. A oto ja jestem z wami przez wszystkie dni aż do końca świata. Amen."
