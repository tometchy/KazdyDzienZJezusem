"Mt28,1":
  text: "A gdy skończył się szabat i świtało pierwszego dnia tygodnia, Maria Magdalena i druga Maria przyszły obejrzeć grób."
  tags: []
"Mt28,2":
  text: "A oto powstało wielkie trzęsienie ziemi. Anioł Pana bowiem, zstąpiwszy z nieba, podszedł, odwalił kamień od wejścia i usiadł na nim."
  tags: []
"Mt28,3":
  text: "Jego oblicze było jak błyskawica, a jego szaty białe jak śnieg."
  tags: []
"Mt28,4":
  text: "A strażnicy drżeli ze strachu i stali się jak umarli."
  tags: []
"Mt28,5":
  text: "Anioł zaś powiedział do kobiet: Wy się nie bójcie! Wiem bowiem, że szukacie ukrzyżowanego Jezusa."
  tags: []
"Mt28,6":
  text: "Nie ma go tu. Powstał bowiem, jak powiedział. Chodźcie, zobaczcie miejsce, gdzie leżał Pan."
  tags: []
"Mt28,7":
  text: "Idźcie szybko i powiedzcie jego uczniom, że zmartwychwstał i oto udaje się do Galilei przed wami. Tam go ujrzycie. Oto wam powiedziałem."
  tags: []
"Mt28,8":
  text: "Odeszły więc szybko od grobu z bojaźnią i z wielką radością i pobiegły przekazać to jego uczniom."
  tags: []
"Mt28,9":
  text: "Kiedy szły przekazać to jego uczniom, nagle Jezus wyszedł im na spotkanie i powiedział: Witajcie! A one podeszły, objęły go za nogi i oddały mu pokłon."
  tags: []
"Mt28,10":
  text: "Wtedy Jezus powiedział do nich: Nie bójcie się! Idźcie, powiedzcie moim braciom, aby poszli do Galilei. Tam mnie ujrzą."
  tags: []
"Mt28,11":
  text: "A gdy one poszły, niektórzy ze straży przyszli do miasta i oznajmili naczelnym kapłanom wszystko, co się stało."
  tags: []
"Mt28,12":
  text: "Ci zaś zebrali się ze starszymi i naradziwszy się, dali żołnierzom sporo pieniędzy;"
  tags: []
"Mt28,13":
  text: "I powiedzieli: Mówcie, że jego uczniowie przyszli w nocy i wykradli go, gdy spaliście."
  tags: []
"Mt28,14":
  text: "A gdyby to doszło do namiestnika, my go przekonamy, a wam zapewnimy bezpieczeństwo."
  tags: []
"Mt28,15":
  text: "Wzięli więc pieniądze i zrobili, jak ich pouczono. I rozniosła się ta wieść wśród Żydów, i trwa aż do dziś."
  tags: []
"Mt28,16":
  text: "Potem jedenastu uczniów poszło do Galilei na górę, na którą Jezus im polecił."
  tags: []
"Mt28,17":
  text: "A gdy go ujrzeli, oddali mu pokłon. Niektórzy jednak wątpili."
  tags: []
"Mt28,18":
  text: "Wtedy Jezus podszedł i powiedział do nich: Dana mi jest wszelka władza na niebie i na ziemi."
  tags: []
"Mt28,19":
  text: "Idźcie więc i nauczajcie wszystkie narody, chrzcząc je w imię Ojca i Syna, i Ducha Świętego;"
  tags: []
"Mt28,20":
  text: "Ucząc je przestrzegać wszystkiego, co wam przykazałem. A oto ja jestem z wami przez wszystkie dni aż do końca świata. Amen."
  tags: []
