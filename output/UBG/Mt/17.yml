"Mt17,1": "A po sześciu dniach wziął Jezus Piotra, Jakuba i Jana, jego brata, i wprowadził ich na wysoką górę, żeby byli na osobności."
"Mt17,2": "I został przemieniony przed nimi: jego oblicze zajaśniało jak słońce, a jego szaty stały się białe jak światło."
"Mt17,3": "A oto ukazali się im Mojżesz i Eliasz, którzy z nim rozmawiali."
"Mt17,4": "Wtedy Piotr powiedział do Jezusa: Panie, dobrze nam tu być. Jeśli chcesz, postawimy tu trzy namioty: jeden dla ciebie, jeden dla Mojżesza i jeden dla Eliasza."
"Mt17,5": "Kiedy on jeszcze mówił, oto jasny obłok zacienił ich, a z obłoku rozległ się głos: To jest mój umiłowany Syn, w którym mam upodobanie, jego słuchajcie."
"Mt17,6": "Uczniowie, słysząc to, upadli na twarz i bardzo się bali."
"Mt17,7": "Wtedy Jezus podszedł, dotknął ich i powiedział: Wstańcie, nie bójcie się."
"Mt17,8": "Oni zaś, podniósłszy oczy, nikogo nie widzieli, tylko samego Jezusa."
"Mt17,9": "A gdy schodzili z góry, Jezus im przykazał: Nikomu nie mówcie o tym widzeniu, aż Syn Człowieczy zmartwychwstanie."
"Mt17,10": "I pytali go jego uczniowie: Dlaczego więc uczeni w Piśmie mówią, że najpierw ma przyjść Eliasz?"
"Mt17,11": "A Jezus im odpowiedział: Istotnie, najpierw przyjdzie Eliasz i wszystko odnowi."
"Mt17,12": "Lecz mówię wam, że Eliasz już przyszedł, jednak nie poznali go, ale zrobili z nim, co chcieli. Tak i Syn Człowieczy dozna od nich cierpień."
"Mt17,13": "Wtedy uczniowie zrozumieli, że mówił im o Janie Chrzcicielu."
"Mt17,14": "A gdy przyszli do tłumu, podszedł do niego pewien człowiek, upadł przed nim na kolana;"
"Mt17,15": "I powiedział: Panie, zmiłuj się nad moim synem, bo jest obłąkanym i bardzo cierpi. Często bowiem wpada w ogień i często w wodę."
"Mt17,16": "Przyprowadziłem go do twoich uczniów, ale nie mogli go uzdrowić."
"Mt17,17": "A Jezus odpowiedział: O pokolenie bez wiary i przewrotne! Jak długo będę z wami? Jak długo mam was znosić? Przyprowadźcie mi go tutaj."
"Mt17,18": "I zgromił Jezus tego demona, i wyszedł z niego. Od tej chwili chłopiec był zdrowy."
"Mt17,19": "Wtedy uczniowie, podszedłszy do Jezusa, zapytali go na osobności: Czemu my nie mogliśmy go wypędzić?"
"Mt17,20": "A Jezus im odpowiedział: Z powodu waszej niewiary. Zaprawdę bowiem powiadam wam: Jeśli będziecie mieć wiarę jak ziarno gorczycy, powiecie tej górze: Przenieś się stąd na tamto miejsce, a przeniesie się. I nic nie będzie dla was niemożliwe."
"Mt17,21": "Lecz ten rodzaj nie wychodzi inaczej, jak tylko przez modlitwę i post."
"Mt17,22": "A gdy przebywali w Galilei, Jezus powiedział do nich: Syn Człowieczy zostanie wydany w ręce ludzi;"
"Mt17,23": "I zabiją go, ale trzeciego dnia zmartwychwstanie. I bardzo się zasmucili."
"Mt17,24": "A gdy przyszli do Kafarnaum, podeszli do Piotra poborcy podatku i zapytali: Czy wasz nauczyciel nie płaci podatku?"
"Mt17,25": "On odpowiedział: Płaci. A gdy wchodził do domu, uprzedził go Jezus, mówiąc: Jak ci się wydaje, Szymonie? Od kogo królowie ziemscy pobierają cło albo podatek? Od swoich synów czy od obcych?"
"Mt17,26": "Piotr mu odpowiedział: Od obcych. I powiedział mu Jezus: A więc synowie są wolni."
"Mt17,27": "Ale żebyśmy ich nie zgorszyli, idź nad morze, zarzuć wędkę, weź pierwszą złowioną rybę i otwórz jej pyszczek, a znajdziesz statera. Weź go i daj im za mnie i za siebie."
