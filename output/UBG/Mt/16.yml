"Mt16,1":
  text: "Podeszli faryzeusze i saduceusze i wystawiając go na próbę, prosili, aby pokazał im znak z nieba."
  tags: []
"Mt16,2":
  text: "A on im odpowiedział: Gdy nastaje wieczór, mówicie: Będzie pogoda, bo niebo się czerwieni."
  tags: []
"Mt16,3":
  text: "Rano zaś: Dziś będzie niepogoda, bo niebo się czerwieni i jest zachmurzone. Obłudnicy, wygląd nieba umiecie rozpoznać, a znaków tych czasów nie możecie?"
  tags: []
"Mt16,4":
  text: "Pokolenie złe i cudzołożne żąda znaku, ale żaden znak nie będzie mu dany oprócz znaku proroka Jonasza. I opuściwszy ich, odszedł."
  tags: []
"Mt16,5":
  text: "A gdy jego uczniowie przeprawili się na drugą stronę morza, zapomnieli wziąć chleba."
  tags: []
"Mt16,6":
  text: "I powiedział im Jezus: Uważajcie i strzeżcie się zakwasu faryzeuszy i saduceuszy."
  tags: []
"Mt16,7":
  text: "A oni rozmawiali między sobą: Nie wzięliśmy chleba."
  tags: []
"Mt16,8":
  text: "Gdy Jezus to zauważył, powiedział im: Ludzie małej wiary, czemu rozmawiacie między sobą o tym, że nie wzięliście chleba?"
  tags: []
"Mt16,9":
  text: "Jeszcze nie rozumiecie ani nie pamiętacie tych pięciu chlebów i pięciu tysięcy ludzi oraz ile koszy zebraliście?"
  tags: []
"Mt16,10":
  text: "Ani tych siedmiu chlebów i czterech tysięcy ludzi oraz ile koszy zebraliście?"
  tags: []
"Mt16,11":
  text: "Jak to jest, że nie rozumiecie, iż nie o chlebie wam powiedziałem, mówiąc, abyście się strzegli zakwasu faryzeuszy i saduceuszy?"
  tags: []
"Mt16,12":
  text: "Wtedy zrozumieli, że nie mówił, aby się strzegli zakwasu chlebowego, ale nauki faryzeuszy i saduceuszy."
  tags: []
"Mt16,13":
  text: "A gdy Jezus przyszedł w okolice Cezarei Filipowej, pytał swoich uczniów: Za kogo mnie, Syna Człowieczego, uważają ludzie?"
  tags: []
"Mt16,14":
  text: "A oni odpowiedzieli: Jedni za Jana Chrzciciela, inni za Eliasza, a jeszcze inni za Jeremiasza albo za jednego z proroków."
  tags: []
"Mt16,15":
  text: "I zapytał ich: A wy za kogo mnie uważacie?"
  tags: []
"Mt16,16":
  text: "Szymon Piotr odpowiedział: Ty jesteś Chrystusem, Synem Boga żywego."
  tags: []
"Mt16,17":
  text: "Wtedy Jezus powiedział do niego: Błogosławiony jesteś, Szymonie, synu Jonasza, bo nie objawiły ci tego ciało i krew, ale mój Ojciec, który jest w niebie."
  tags: []
"Mt16,18":
  text: "Ja ci też mówię, że ty jesteś Piotr, a na tej skale zbuduję mój kościół, a bramy piekła go nie przemogą."
  tags: []
"Mt16,19":
  text: "I tobie dam klucze królestwa niebieskiego. Cokolwiek zwiążesz na ziemi, będzie związane i w niebie, a cokolwiek rozwiążesz na ziemi, będzie rozwiązane i w niebie."
  tags: []
"Mt16,20":
  text: "Wtedy przykazał swoim uczniom, aby nikomu nie mówili, że on, Jezus, jest Chrystusem."
  tags: []
"Mt16,21":
  text: "I odtąd zaczął Jezus tłumaczyć swoim uczniom, że musi iść do Jerozolimy i wiele cierpieć od starszych, od naczelnych kapłanów i uczonych w Piśmie, i być zabity, a trzeciego dnia zmartwychwstać."
  tags: []
"Mt16,22":
  text: "A Piotr, wziąwszy go na bok, zaczął go strofować, mówiąc: Zmiłuj się nad sobą, Panie! Nie przyjdzie to na ciebie."
  tags: []
"Mt16,23":
  text: "Lecz on odwrócił się i powiedział do Piotra: Odejdź ode mnie, szatanie! Jesteś dla mnie zgorszeniem, bo nie pojmujesz tego, co Boże, ale to, co ludzkie."
  tags: []
"Mt16,24":
  text: "Wtedy Jezus powiedział do swoich uczniów: Jeśli ktoś chce pójść za mną, niech się wyprze samego siebie, weźmie swój krzyż i idzie za mną."
  tags: []
"Mt16,25":
  text: "Bo kto chce zachować swoje życie, straci je, a kto straci swoje życie z mojego powodu, znajdzie je."
  tags: []
"Mt16,26":
  text: "Cóż pomoże człowiekowi, choćby cały świat pozyskał, a na swojej duszy poniósł szkodę? Albo co da człowiek w zamian za swoją duszę?"
  tags: []
"Mt16,27":
  text: "Syn Człowieczy przyjdzie bowiem w chwale swego Ojca ze swoimi aniołami i wtedy odda każdemu według jego uczynków."
  tags: []
"Mt16,28":
  text: "Zaprawdę powiadam wam: Są wśród stojących tutaj tacy, którzy nie zakosztują śmierci, aż ujrzą Syna Człowieczego przychodzącego w swoim królestwie."
  tags: []
