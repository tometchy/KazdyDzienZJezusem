"Mt16,1": "Podeszli faryzeusze i saduceusze i wystawiając go na próbę, prosili, aby pokazał im znak z nieba."
"Mt16,2": "A on im odpowiedział: Gdy nastaje wieczór, mówicie: Będzie pogoda, bo niebo się czerwieni."
"Mt16,3": "Rano zaś: Dziś będzie niepogoda, bo niebo się czerwieni i jest zachmurzone. Obłudnicy, wygląd nieba umiecie rozpoznać, a znaków tych czasów nie możecie?"
"Mt16,4": "Pokolenie złe i cudzołożne żąda znaku, ale żaden znak nie będzie mu dany oprócz znaku proroka Jonasza. I opuściwszy ich, odszedł."
"Mt16,5": "A gdy jego uczniowie przeprawili się na drugą stronę morza, zapomnieli wziąć chleba."
"Mt16,6": "I powiedział im Jezus: Uważajcie i strzeżcie się zakwasu faryzeuszy i saduceuszy."
"Mt16,7": "A oni rozmawiali między sobą: Nie wzięliśmy chleba."
"Mt16,8": "Gdy Jezus to zauważył, powiedział im: Ludzie małej wiary, czemu rozmawiacie między sobą o tym, że nie wzięliście chleba?"
"Mt16,9": "Jeszcze nie rozumiecie ani nie pamiętacie tych pięciu chlebów i pięciu tysięcy ludzi oraz ile koszy zebraliście?"
"Mt16,10": "Ani tych siedmiu chlebów i czterech tysięcy ludzi oraz ile koszy zebraliście?"
"Mt16,11": "Jak to jest, że nie rozumiecie, iż nie o chlebie wam powiedziałem, mówiąc, abyście się strzegli zakwasu faryzeuszy i saduceuszy?"
"Mt16,12": "Wtedy zrozumieli, że nie mówił, aby się strzegli zakwasu chlebowego, ale nauki faryzeuszy i saduceuszy."
"Mt16,13": "A gdy Jezus przyszedł w okolice Cezarei Filipowej, pytał swoich uczniów: Za kogo mnie, Syna Człowieczego, uważają ludzie?"
"Mt16,14": "A oni odpowiedzieli: Jedni za Jana Chrzciciela, inni za Eliasza, a jeszcze inni za Jeremiasza albo za jednego z proroków."
"Mt16,15": "I zapytał ich: A wy za kogo mnie uważacie?"
"Mt16,16": "Szymon Piotr odpowiedział: Ty jesteś Chrystusem, Synem Boga żywego."
"Mt16,17": "Wtedy Jezus powiedział do niego: Błogosławiony jesteś, Szymonie, synu Jonasza, bo nie objawiły ci tego ciało i krew, ale mój Ojciec, który jest w niebie."
"Mt16,18": "Ja ci też mówię, że ty jesteś Piotr, a na tej skale zbuduję mój kościół, a bramy piekła go nie przemogą."
"Mt16,19": "I tobie dam klucze królestwa niebieskiego. Cokolwiek zwiążesz na ziemi, będzie związane i w niebie, a cokolwiek rozwiążesz na ziemi, będzie rozwiązane i w niebie."
"Mt16,20": "Wtedy przykazał swoim uczniom, aby nikomu nie mówili, że on, Jezus, jest Chrystusem."
"Mt16,21": "I odtąd zaczął Jezus tłumaczyć swoim uczniom, że musi iść do Jerozolimy i wiele cierpieć od starszych, od naczelnych kapłanów i uczonych w Piśmie, i być zabity, a trzeciego dnia zmartwychwstać."
"Mt16,22": "A Piotr, wziąwszy go na bok, zaczął go strofować, mówiąc: Zmiłuj się nad sobą, Panie! Nie przyjdzie to na ciebie."
"Mt16,23": "Lecz on odwrócił się i powiedział do Piotra: Odejdź ode mnie, szatanie! Jesteś dla mnie zgorszeniem, bo nie pojmujesz tego, co Boże, ale to, co ludzkie."
"Mt16,24": "Wtedy Jezus powiedział do swoich uczniów: Jeśli ktoś chce pójść za mną, niech się wyprze samego siebie, weźmie swój krzyż i idzie za mną."
"Mt16,25": "Bo kto chce zachować swoje życie, straci je, a kto straci swoje życie z mojego powodu, znajdzie je."
"Mt16,26": "Cóż pomoże człowiekowi, choćby cały świat pozyskał, a na swojej duszy poniósł szkodę? Albo co da człowiek w zamian za swoją duszę?"
"Mt16,27": "Syn Człowieczy przyjdzie bowiem w chwale swego Ojca ze swoimi aniołami i wtedy odda każdemu według jego uczynków."
"Mt16,28": "Zaprawdę powiadam wam: Są wśród stojących tutaj tacy, którzy nie zakosztują śmierci, aż ujrzą Syna Człowieczego przychodzącego w swoim królestwie."
