"Mt26,1":
  text: "A gdy Jezus dokończył tych wszystkich mów, powiedział do swoich uczniów:"
  tags: []
"Mt26,2":
  text: "Wiecie, że za dwa dni będzie Pascha, a Syn Człowieczy zostanie wydany na ukrzyżowanie."
  tags: []
"Mt26,3":
  text: "Wtedy to naczelni kapłani, uczeni w Piśmie i starsi ludu zebrali się na dziedzińcu najwyższego kapłana, zwanego Kajfaszem;"
  tags: []
"Mt26,4":
  text: "I naradzali się, jak by podstępnie schwytać i zabić Jezusa."
  tags: []
"Mt26,5":
  text: "Lecz mówili: Nie w święto, aby nie wywołać rozruchu wśród ludu."
  tags: []
"Mt26,6":
  text: "A gdy Jezus był w Betanii, w domu Szymona Trędowatego;"
  tags: []
"Mt26,7":
  text: "Przyszła do niego kobieta, która miała alabastrowe naczynie bardzo drogiego olejku, i wylała go na jego głowę, gdy siedział przy stole."
  tags: []
"Mt26,8":
  text: "Widząc to, jego uczniowie oburzyli się i powiedzieli: I na cóż to marnotrawstwo?"
  tags: []
"Mt26,9":
  text: "Przecież można było ten olejek drogo sprzedać, a pieniądze rozdać ubogim."
  tags: []
"Mt26,10":
  text: "Gdy Jezus to zauważył, powiedział im: Dlaczego sprawiacie przykrość tej kobiecie? Przecież dobry uczynek spełniła wobec mnie."
  tags: []
"Mt26,11":
  text: "Ubogich bowiem zawsze macie u siebie, ale mnie nie zawsze mieć będziecie."
  tags: []
"Mt26,12":
  text: "Bo ona, wylewając ten olejek na moje ciało, zrobiła to, aby przygotować mnie na mój pogrzeb."
  tags: []
"Mt26,13":
  text: "Zaprawdę powiadam wam: Gdziekolwiek po całym świecie będzie głoszona ta ewangelia, będzie się też opowiadać na jej pamiątkę to, co zrobiła."
  tags: []
"Mt26,14":
  text: "Wtedy jeden z dwunastu, zwany Judaszem Iskariotą, poszedł do naczelnych kapłanów;"
  tags: []
"Mt26,15":
  text: "I powiedział: Co chcecie mi dać, a ja wam go wydam. A oni wyznaczyli mu trzydzieści srebrników."
  tags: []
"Mt26,16":
  text: "I odtąd szukał sposobności, aby go wydać."
  tags: []
"Mt26,17":
  text: "W pierwszy dzień Przaśników uczniowie podeszli do Jezusa i zapytali go: Gdzie chcesz, abyśmy przygotowali ci Paschę do spożycia?"
  tags: []
"Mt26,18":
  text: "A on odpowiedział: Idźcie do miasta, do pewnego człowieka i powiedzcie mu: Nauczyciel mówi: Mój czas jest bliski; u ciebie będę obchodził Paschę z moimi uczniami."
  tags: []
"Mt26,19":
  text: "Uczniowie zrobili tak, jak im nakazał Jezus, i przygotowali Paschę."
  tags: []
"Mt26,20":
  text: "Kiedy nastał wieczór, usiadł za stołem z dwunastoma."
  tags: []
"Mt26,21":
  text: "A gdy jedli, powiedział: Zaprawdę powiadam wam, że jeden z was mnie wyda."
  tags: []
"Mt26,22":
  text: "I bardzo zasmuceni zaczęli pytać jeden po drugim: Czy to ja, Panie?"
  tags: []
"Mt26,23":
  text: "A on odpowiedział: Ten, który macza ze mną rękę w misie, on mnie wyda."
  tags: []
"Mt26,24":
  text: "Syn Człowieczy odchodzi, jak jest o nim napisane, ale biada człowiekowi, przez którego Syn Człowieczy będzie wydany! Lepiej byłoby dla tego człowieka, aby się nie urodził."
  tags: []
"Mt26,25":
  text: "Wtedy Judasz, który go zdradził, zapytał: Czy to ja, Mistrzu? Odpowiedział mu: Ty sam to powiedziałeś."
  tags: []
"Mt26,26":
  text: "A gdy jedli, Jezus wziął chleb, pobłogosławił, połamał i dał uczniom, mówiąc: Bierzcie, jedzcie, to jest moje ciało."
  tags: []
"Mt26,27":
  text: "Potem wziął kielich, złożył dziękczynienie i dał im, mówiąc: Pijcie z niego wszyscy;"
  tags: []
"Mt26,28":
  text: "To bowiem jest moja krew nowego testamentu, która wylewa się za wielu na przebaczenie grzechów."
  tags: []
"Mt26,29":
  text: "Ale mówię wam: Odtąd nie będę pił z tego owocu winorośli aż do dnia, gdy go będę pił z wami nowy w królestwie mego Ojca."
  tags: []
"Mt26,30":
  text: "A gdy zaśpiewali hymn, wyszli ku Górze Oliwnej."
  tags: []
"Mt26,31":
  text: "Wtedy Jezus powiedział do nich: Wy wszyscy zgorszycie się z mojego powodu tej nocy. Jest bowiem napisane: Uderzę pasterza i rozproszą się owce stada."
  tags: []
"Mt26,32":
  text: "Lecz gdy zmartwychwstanę, udam się do Galilei przed wami."
  tags: []
"Mt26,33":
  text: "A Piotr odezwał się do niego: Choćby się wszyscy zgorszyli z twojego powodu, ja się nigdy nie zgorszę."
  tags: []
"Mt26,34":
  text: "Powiedział mu Jezus: Zaprawdę powiadam ci, że tej nocy, zanim kogut zapieje, trzy razy się mnie wyprzesz."
  tags: []
"Mt26,35":
  text: "Odpowiedział mu Piotr: Choćbym miał z tobą umrzeć, nie wyprę się ciebie. Podobnie mówili wszyscy uczniowie."
  tags: []
"Mt26,36":
  text: "Wtedy Jezus przyszedł z nimi na miejsce zwane Getsemani i powiedział do uczniów: Siądźcie tu, a ja tymczasem odejdę tam i będę się modlił."
  tags: []
"Mt26,37":
  text: "A wziąwszy ze sobą Piotra i dwóch synów Zebedeusza, zaczął się smucić i odczuwać udrękę."
  tags: []
"Mt26,38":
  text: "Wtedy Jezus powiedział do nich: Smutna jest moja dusza aż do śmierci. Zostańcie tu i czuwajcie ze mną."
  tags: []
"Mt26,39":
  text: "A odszedłszy trochę dalej, upadł na twarz i modlił się, mówiąc: Mój Ojcze, jeśli to możliwe, niech mnie ominie ten kielich. Jednak niech się stanie nie jak ja chcę, ale jak ty."
  tags: []
"Mt26,40":
  text: "Potem przyszedł do uczniów i zastał ich śpiących, i powiedział do Piotra: Czy nie mogliście przez jedną godzinę czuwać ze mną?"
  tags: []
"Mt26,41":
  text: "Czuwajcie i módlcie się, abyście nie ulegli pokusie. Duch wprawdzie jest ochoczy, ale ciało słabe."
  tags: []
"Mt26,42":
  text: "Znowu, po raz drugi odszedł i modlił się, mówiąc: Mój Ojcze, jeśli ten kielich nie może mnie minąć, tylko abym go wypił, niech się stanie twoja wola."
  tags: []
"Mt26,43":
  text: "A gdy przyszedł, znowu zastał ich śpiących, bo oczy same im się zamykały."
  tags: []
"Mt26,44":
  text: "I zostawiwszy ich, odszedł znowu i modlił się po raz trzeci tymi samymi słowami."
  tags: []
"Mt26,45":
  text: "Potem przyszedł do swoich uczniów i powiedział do nich: Śpijcie jeszcze i odpoczywajcie. Oto nadchodzi godzina i Syn Człowieczy będzie wydany w ręce grzeszników."
  tags: []
"Mt26,46":
  text: "Wstańcie, chodźmy! Oto zbliża się ten, który mnie wyda."
  tags: []
"Mt26,47":
  text: "A gdy on jeszcze mówił, nadszedł Judasz, jeden z dwunastu, a z nim liczny tłum z mieczami i kijami, od naczelnych kapłanów i starszych ludu."
  tags: []
"Mt26,48":
  text: "Ten zaś, który go zdradził, ustalił z nimi znak, mówiąc: Ten, którego pocałuję, to on. Schwytajcie go."
  tags: []
"Mt26,49":
  text: "Zaraz też podszedł do Jezusa i powiedział: Witaj, Mistrzu! I pocałował go."
  tags: []
"Mt26,50":
  text: "Jezus powiedział do niego: Przyjacielu, po co przyszedłeś? Wtedy podeszli, rzucili się na Jezusa i schwytali go."
  tags: []
"Mt26,51":
  text: "A oto jeden z tych, którzy byli z Jezusem, wyciągnął rękę i dobył miecz, a uderzywszy sługę najwyższego kapłana, odciął mu ucho."
  tags: []
"Mt26,52":
  text: "Wtedy Jezus powiedział do niego: Schowaj miecz na swoje miejsce. Wszyscy bowiem, którzy za miecz chwytają, od miecza zginą."
  tags: []
"Mt26,53":
  text: "Czy sądzisz, że nie mógłbym teraz prosić mego Ojca, a wystawiłby mi więcej niż dwanaście legionów aniołów?"
  tags: []
"Mt26,54":
  text: "Ale jakże wypełniłyby się Pisma, które mówią, że musi się tak stać?"
  tags: []
"Mt26,55":
  text: "W tym momencie Jezus powiedział do tłumów: Wyszliście jak na bandytę z mieczami i kijami, aby mnie schwytać. Codziennie siadałem z wami, nauczając w świątyni, a nie schwytaliście mnie."
  tags: []
"Mt26,56":
  text: "Ale to wszystko się stało, aby się wypełniły Pisma proroków. Wtedy wszyscy uczniowie opuścili go i uciekli."
  tags: []
"Mt26,57":
  text: "A ci, którzy schwytali Jezusa, zaprowadzili go do Kajfasza, najwyższego kapłana, gdzie zebrali się uczeni w Piśmie i starsi."
  tags: []
"Mt26,58":
  text: "Piotr zaś szedł za nim z daleka aż do dziedzińca najwyższego kapłana i wszedłszy tam, siedział ze sługami, aby zobaczyć, jak to się skończy."
  tags: []
"Mt26,59":
  text: "Tymczasem naczelni kapłani, starsi i cała Rada szukali fałszywego świadectwa przeciwko Jezusowi, aby go skazać na śmierć;"
  tags: []
"Mt26,60":
  text: "Lecz nie znaleźli. I chociaż przychodziło wielu fałszywych świadków, jednak niczego nie znaleźli. A na koniec wystąpili dwaj fałszywi świadkowie;"
  tags: []
"Mt26,61":
  text: "Mówiąc: On powiedział: Mogę zburzyć świątynię Bożą i w trzy dni ją odbudować."
  tags: []
"Mt26,62":
  text: "Wtedy najwyższy kapłan powstał i zapytał go: Nic nie odpowiadasz? Cóż znaczy to, co oni przeciwko tobie zeznają?"
  tags: []
"Mt26,63":
  text: "Lecz Jezus milczał. A najwyższy kapłan powiedział mu: Zaklinam cię na Boga żywego, abyś nam powiedział, czy ty jesteś Chrystusem, Synem Bożym?"
  tags: []
"Mt26,64":
  text: "Odpowiedział mu Jezus: Ty powiedziałeś. Ale mówię wam: Odtąd ujrzycie Syna Człowieczego siedzącego po prawicy mocy Boga i przychodzącego na obłokach niebieskich."
  tags: []
"Mt26,65":
  text: "Wtedy najwyższy kapłan rozdarł swoje szaty i powiedział: Zbluźnił! Czyż potrzebujemy jeszcze świadków? Oto teraz słyszeliście bluźnierstwo."
  tags: []
"Mt26,66":
  text: "Jak wam się zdaje? A oni odpowiedzieli: Zasługuje na śmierć."
  tags: []
"Mt26,67":
  text: "Wówczas zaczęli pluć mu w twarz i bili go pięściami, a inni go policzkowali;"
  tags: []
"Mt26,68":
  text: "Mówiąc: Prorokuj nam, Chrystusie: Kto cię uderzył?"
  tags: []
"Mt26,69":
  text: "Piotr zaś siedział na zewnątrz, na dziedzińcu. Podeszła do niego pewna dziewczyna i powiedziała: Ty też byłeś z Jezusem z Galilei."
  tags: []
"Mt26,70":
  text: "Lecz on wyparł się wobec wszystkich, mówiąc: Nie wiem, o czym mówisz."
  tags: []
"Mt26,71":
  text: "A gdy wyszedł do przedsionka, zobaczyła go inna dziewczyna i powiedziała do tych, którzy tam byli: On też był z Jezusem z Nazaretu."
  tags: []
"Mt26,72":
  text: "I znowu wyparł się pod przysięgą: Nie znam tego człowieka."
  tags: []
"Mt26,73":
  text: "Po chwili ci, którzy tam stali, podeszli i powiedzieli do Piotra: Na pewno ty też jesteś jednym z nich, bo i twoja mowa cię zdradza."
  tags: []
"Mt26,74":
  text: "Wtedy zaczął się zaklinać i przysięgać: Nie znam tego człowieka. I zaraz zapiał kogut."
  tags: []
"Mt26,75":
  text: "I przypomniał sobie Piotr słowa Jezusa, który mu powiedział: Zanim kogut zapieje, trzy razy się mnie wyprzesz. Wyszedł na zewnątrz i gorzko zapłakał."
  tags: []
