"Mt12,1":
  text: "W tym czasie Jezus przechodził w szabat wśród zbóż, a jego uczniowie byli głodni i zaczęli zrywać kłosy, i jeść."
  tags: []
"Mt12,2":
  text: "Kiedy faryzeusze to zobaczyli, powiedzieli mu: Oto twoi uczniowie robią to, czego nie wolno robić w szabat."
  tags: []
"Mt12,3":
  text: "A on im powiedział: Czy nie czytaliście, co zrobił Dawid, gdy był głodny, on i ci, którzy z nim byli?"
  tags: []
"Mt12,4":
  text: "Jak wszedł do domu Bożego i jadł chleby pokładne, których nie wolno było jeść jemu ani tym, którzy z nim byli, tylko samym kapłanom?"
  tags: []
"Mt12,5":
  text: "Albo czy nie czytaliście w prawie, że w szabat kapłani w świątyni naruszają szabat, a są bez winy?"
  tags: []
"Mt12,6":
  text: "Ale mówię wam, że tu jest ktoś większy niż świątynia."
  tags: []
"Mt12,7":
  text: "A gdybyście wiedzieli, co to znaczy: Miłosierdzia chcę, a nie ofiary, nie potępialibyście niewinnych."
  tags: []
"Mt12,8":
  text: "Syn Człowieczy bowiem jest też Panem szabatu."
  tags: []
"Mt12,9":
  text: "I odszedłszy stamtąd, wszedł do ich synagogi."
  tags: []
"Mt12,10":
  text: "A był tam człowiek, który miał uschłą rękę. I chcąc go oskarżyć, zapytali: Czy wolno uzdrawiać w szabat?"
  tags: []
"Mt12,11":
  text: "A on im odpowiedział: Któż z was, mając jedną owcę, która w szabat wpadłaby do dołu, nie chwyci jej i nie wyciągnie?"
  tags: []
"Mt12,12":
  text: "A o ileż ważniejszy jest człowiek niż owca! Tak więc wolno w szabat dobrze czynić."
  tags: []
"Mt12,13":
  text: "Wtedy powiedział do tego człowieka: Wyciągnij rękę. On ją wyciągnął i znowu stała się zdrowa jak i druga."
  tags: []
"Mt12,14":
  text: "A faryzeusze, wyszedłszy, naradzali się przeciwko niemu, w jaki sposób go zgładzić."
  tags: []
"Mt12,15":
  text: "Lecz Jezus, poznawszy to, odszedł stamtąd. Poszło za nim mnóstwo ludzi, a on uzdrowił ich wszystkich."
  tags: []
"Mt12,16":
  text: "I przykazał im, aby go nie ujawniali;"
  tags: []
"Mt12,17":
  text: "Żeby się wypełniło, co zostało powiedziane przez proroka Izajasza, który powiedział:"
  tags: []
"Mt12,18":
  text: "Oto mój sługa, którego wybrałem, mój umiłowany, w którym moja dusza ma upodobanie. Złożę na nim mojego Ducha, a on ogłosi sąd narodom."
  tags: []
"Mt12,19":
  text: "Nie będzie się spierał ani krzyczał i nikt nie usłyszy na ulicach jego głosu."
  tags: []
"Mt12,20":
  text: "Trzciny nadłamanej nie złamie, a knota tlącego się nie zagasi, dopóki nie doprowadzi sądu do zwycięstwa."
  tags: []
"Mt12,21":
  text: "A w jego imieniu narody będą pokładać nadzieję."
  tags: []
"Mt12,22":
  text: "Wtedy przyprowadzono do niego opętanego, który był ślepy i niemy. I uzdrowił go tak, że ten ślepy i niemy mówił i widział."
  tags: []
"Mt12,23":
  text: "A wszyscy ludzie, zdumieni, mówili: Czyż to nie jest syn Dawida?"
  tags: []
"Mt12,24":
  text: "Ale faryzeusze, usłyszawszy to, powiedzieli: On nie wypędza demonów inaczej, jak tylko przez Belzebuba, władcę demonów."
  tags: []
"Mt12,25":
  text: "Lecz Jezus, znając ich myśli, powiedział im: Każde królestwo podzielone wewnętrznie pustoszeje i żadne miasto albo dom podzielony wewnętrznie nie przetrwa."
  tags: []
"Mt12,26":
  text: "A jeśli szatan wypędza szatana, jest podzielony wewnętrznie. Jakże więc przetrwa jego królestwo?"
  tags: []
"Mt12,27":
  text: "Jeśli ja przez Belzebuba wypędzam demony, to przez kogo wypędzają wasi synowie? Dlatego oni będą waszymi sędziami."
  tags: []
"Mt12,28":
  text: "A jeśli ja wypędzam demony Duchem Bożym, to przyszło do was królestwo Boże."
  tags: []
"Mt12,29":
  text: "Albo jak może ktoś wejść do domu mocarza i zagrabić jego własność, jeśli najpierw nie zwiąże mocarza? Dopiero wtedy ograbi jego dom."
  tags: []
"Mt12,30":
  text: "Kto nie jest ze mną, jest przeciwko mnie, a kto nie zbiera ze mną, rozprasza."
  tags: []
"Mt12,31":
  text: "Dlatego mówię wam: Każdy grzech i bluźnierstwo będzie ludziom przebaczone, ale bluźnierstwo przeciwko Duchowi Świętemu nie będzie ludziom przebaczone."
  tags: []
"Mt12,32":
  text: "I ktokolwiek powie słowo przeciwko Synowi Człowieczemu, będzie mu przebaczone, ale kto mówi przeciwko Duchowi Świętemu, nie będzie mu przebaczone ani w tym świecie, ani w przyszłym."
  tags: []
"Mt12,33":
  text: "Sprawcie, aby drzewo było dobre i jego owoc dobry, albo sprawcie, aby drzewo było złe i jego owoc zły. Po owocu bowiem poznaje się drzewo."
  tags: []
"Mt12,34":
  text: "Plemię żmijowe! Jakże możecie mówić dobre rzeczy, będąc złymi? Gdyż z obfitości serca mówią usta."
  tags: []
"Mt12,35":
  text: "Dobry człowiek wydobywa z dobrego skarbca serca dobre rzeczy, a zły człowiek wydobywa ze złego skarbca złe rzeczy."
  tags: []
"Mt12,36":
  text: "Ale mówię wam, że z każdego bezużytecznego słowa, które wypowiedzą ludzie, zdadzą sprawę w dzień sądu."
  tags: []
"Mt12,37":
  text: "Bo na podstawie twoich słów będziesz usprawiedliwiony i na podstawie twoich słów będziesz potępiony."
  tags: []
"Mt12,38":
  text: "Wtedy niektórzy z uczonych w Piśmie i z faryzeuszy odpowiedzieli: Nauczycielu, chcemy widzieć znak od ciebie."
  tags: []
"Mt12,39":
  text: "A on odpowiedział im: Pokolenie złe i cudzołożne żąda znaku, ale żaden znak nie będzie mu dany, oprócz znaku proroka Jonasza."
  tags: []
"Mt12,40":
  text: "Jak bowiem Jonasz był w brzuchu wieloryba trzy dni i trzy noce, tak Syn Człowieczy będzie w sercu ziemi trzy dni i trzy noce."
  tags: []
"Mt12,41":
  text: "Ludzie z Niniwy staną na sądzie z tym pokoleniem i potępią je, ponieważ pokutowali wskutek głoszenia Jonasza, a oto tu ktoś więcej niż Jonasz."
  tags: []
"Mt12,42":
  text: "Królowa z Południa stanie na sądzie z tym pokoleniem i potępi je, bo przybyła z krańców ziemi, aby słuchać mądrości Salomona, a oto tu ktoś więcej niż Salomon."
  tags: []
"Mt12,43":
  text: "Kiedy nieczysty duch wychodzi z człowieka, przechadza się po miejscach bezwodnych, szukając odpoczynku, ale nie znajduje."
  tags: []
"Mt12,44":
  text: "Wtedy mówi: Wrócę do swego domu, z którego wyszedłem. A przyszedłszy, zastaje go pustym, zamiecionym i przyozdobionym."
  tags: []
"Mt12,45":
  text: "Wówczas idzie i bierze ze sobą siedem innych duchów gorszych niż on sam i wszedłszy, mieszkają tam. I końcowy stan tego człowieka staje się gorszy niż początkowy. Tak będzie i z tym złym pokoleniem."
  tags: []
"Mt12,46":
  text: "A gdy on jeszcze mówił do ludzi, jego matka i bracia stanęli przed domem, chcąc z nim rozmawiać."
  tags: []
"Mt12,47":
  text: "I powiedział mu ktoś: Oto twoja matka i twoi bracia stoją przed domem, chcąc z tobą mówić."
  tags: []
"Mt12,48":
  text: "Lecz on odpowiedział temu, który mu to oznajmił: Któż jest moją matką i kto to są moi bracia?"
  tags: []
"Mt12,49":
  text: "A wyciągnąwszy rękę ku swoim uczniom, powiedział: Oto moja matka i moi bracia!"
  tags: []
"Mt12,50":
  text: "Kto bowiem wypełnia wolę mojego Ojca, który jest w niebie, ten jest moim bratem i siostrą, i matką."
  tags: []
