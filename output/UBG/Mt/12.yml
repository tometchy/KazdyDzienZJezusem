"Mt12,1": "W tym czasie Jezus przechodził w szabat wśród zbóż, a jego uczniowie byli głodni i zaczęli zrywać kłosy, i jeść."
"Mt12,2": "Kiedy faryzeusze to zobaczyli, powiedzieli mu: Oto twoi uczniowie robią to, czego nie wolno robić w szabat."
"Mt12,3": "A on im powiedział: Czy nie czytaliście, co zrobił Dawid, gdy był głodny, on i ci, którzy z nim byli?"
"Mt12,4": "Jak wszedł do domu Bożego i jadł chleby pokładne, których nie wolno było jeść jemu ani tym, którzy z nim byli, tylko samym kapłanom?"
"Mt12,5": "Albo czy nie czytaliście w prawie, że w szabat kapłani w świątyni naruszają szabat, a są bez winy?"
"Mt12,6": "Ale mówię wam, że tu jest ktoś większy niż świątynia."
"Mt12,7": "A gdybyście wiedzieli, co to znaczy: Miłosierdzia chcę, a nie ofiary, nie potępialibyście niewinnych."
"Mt12,8": "Syn Człowieczy bowiem jest też Panem szabatu."
"Mt12,9": "I odszedłszy stamtąd, wszedł do ich synagogi."
"Mt12,10": "A był tam człowiek, który miał uschłą rękę. I chcąc go oskarżyć, zapytali: Czy wolno uzdrawiać w szabat?"
"Mt12,11": "A on im odpowiedział: Któż z was, mając jedną owcę, która w szabat wpadłaby do dołu, nie chwyci jej i nie wyciągnie?"
"Mt12,12": "A o ileż ważniejszy jest człowiek niż owca! Tak więc wolno w szabat dobrze czynić."
"Mt12,13": "Wtedy powiedział do tego człowieka: Wyciągnij rękę. On ją wyciągnął i znowu stała się zdrowa jak i druga."
"Mt12,14": "A faryzeusze, wyszedłszy, naradzali się przeciwko niemu, w jaki sposób go zgładzić."
"Mt12,15": "Lecz Jezus, poznawszy to, odszedł stamtąd. Poszło za nim mnóstwo ludzi, a on uzdrowił ich wszystkich."
"Mt12,16": "I przykazał im, aby go nie ujawniali;"
"Mt12,17": "Żeby się wypełniło, co zostało powiedziane przez proroka Izajasza, który powiedział:"
"Mt12,18": "Oto mój sługa, którego wybrałem, mój umiłowany, w którym moja dusza ma upodobanie. Złożę na nim mojego Ducha, a on ogłosi sąd narodom."
"Mt12,19": "Nie będzie się spierał ani krzyczał i nikt nie usłyszy na ulicach jego głosu."
"Mt12,20": "Trzciny nadłamanej nie złamie, a knota tlącego się nie zagasi, dopóki nie doprowadzi sądu do zwycięstwa."
"Mt12,21": "A w jego imieniu narody będą pokładać nadzieję."
"Mt12,22": "Wtedy przyprowadzono do niego opętanego, który był ślepy i niemy. I uzdrowił go tak, że ten ślepy i niemy mówił i widział."
"Mt12,23": "A wszyscy ludzie, zdumieni, mówili: Czyż to nie jest syn Dawida?"
"Mt12,24": "Ale faryzeusze, usłyszawszy to, powiedzieli: On nie wypędza demonów inaczej, jak tylko przez Belzebuba, władcę demonów."
"Mt12,25": "Lecz Jezus, znając ich myśli, powiedział im: Każde królestwo podzielone wewnętrznie pustoszeje i żadne miasto albo dom podzielony wewnętrznie nie przetrwa."
"Mt12,26": "A jeśli szatan wypędza szatana, jest podzielony wewnętrznie. Jakże więc przetrwa jego królestwo?"
"Mt12,27": "Jeśli ja przez Belzebuba wypędzam demony, to przez kogo wypędzają wasi synowie? Dlatego oni będą waszymi sędziami."
"Mt12,28": "A jeśli ja wypędzam demony Duchem Bożym, to przyszło do was królestwo Boże."
"Mt12,29": "Albo jak może ktoś wejść do domu mocarza i zagrabić jego własność, jeśli najpierw nie zwiąże mocarza? Dopiero wtedy ograbi jego dom."
"Mt12,30": "Kto nie jest ze mną, jest przeciwko mnie, a kto nie zbiera ze mną, rozprasza."
"Mt12,31": "Dlatego mówię wam: Każdy grzech i bluźnierstwo będzie ludziom przebaczone, ale bluźnierstwo przeciwko Duchowi Świętemu nie będzie ludziom przebaczone."
"Mt12,32": "I ktokolwiek powie słowo przeciwko Synowi Człowieczemu, będzie mu przebaczone, ale kto mówi przeciwko Duchowi Świętemu, nie będzie mu przebaczone ani w tym świecie, ani w przyszłym."
"Mt12,33": "Sprawcie, aby drzewo było dobre i jego owoc dobry, albo sprawcie, aby drzewo było złe i jego owoc zły. Po owocu bowiem poznaje się drzewo."
"Mt12,34": "Plemię żmijowe! Jakże możecie mówić dobre rzeczy, będąc złymi? Gdyż z obfitości serca mówią usta."
"Mt12,35": "Dobry człowiek wydobywa z dobrego skarbca serca dobre rzeczy, a zły człowiek wydobywa ze złego skarbca złe rzeczy."
"Mt12,36": "Ale mówię wam, że z każdego bezużytecznego słowa, które wypowiedzą ludzie, zdadzą sprawę w dzień sądu."
"Mt12,37": "Bo na podstawie twoich słów będziesz usprawiedliwiony i na podstawie twoich słów będziesz potępiony."
"Mt12,38": "Wtedy niektórzy z uczonych w Piśmie i z faryzeuszy odpowiedzieli: Nauczycielu, chcemy widzieć znak od ciebie."
"Mt12,39": "A on odpowiedział im: Pokolenie złe i cudzołożne żąda znaku, ale żaden znak nie będzie mu dany, oprócz znaku proroka Jonasza."
"Mt12,40": "Jak bowiem Jonasz był w brzuchu wieloryba trzy dni i trzy noce, tak Syn Człowieczy będzie w sercu ziemi trzy dni i trzy noce."
"Mt12,41": "Ludzie z Niniwy staną na sądzie z tym pokoleniem i potępią je, ponieważ pokutowali wskutek głoszenia Jonasza, a oto tu ktoś więcej niż Jonasz."
"Mt12,42": "Królowa z Południa stanie na sądzie z tym pokoleniem i potępi je, bo przybyła z krańców ziemi, aby słuchać mądrości Salomona, a oto tu ktoś więcej niż Salomon."
"Mt12,43": "Kiedy nieczysty duch wychodzi z człowieka, przechadza się po miejscach bezwodnych, szukając odpoczynku, ale nie znajduje."
"Mt12,44": "Wtedy mówi: Wrócę do swego domu, z którego wyszedłem. A przyszedłszy, zastaje go pustym, zamiecionym i przyozdobionym."
"Mt12,45": "Wówczas idzie i bierze ze sobą siedem innych duchów gorszych niż on sam i wszedłszy, mieszkają tam. I końcowy stan tego człowieka staje się gorszy niż początkowy. Tak będzie i z tym złym pokoleniem."
"Mt12,46": "A gdy on jeszcze mówił do ludzi, jego matka i bracia stanęli przed domem, chcąc z nim rozmawiać."
"Mt12,47": "I powiedział mu ktoś: Oto twoja matka i twoi bracia stoją przed domem, chcąc z tobą mówić."
"Mt12,48": "Lecz on odpowiedział temu, który mu to oznajmił: Któż jest moją matką i kto to są moi bracia?"
"Mt12,49": "A wyciągnąwszy rękę ku swoim uczniom, powiedział: Oto moja matka i moi bracia!"
"Mt12,50": "Kto bowiem wypełnia wolę mojego Ojca, który jest w niebie, ten jest moim bratem i siostrą, i matką."
