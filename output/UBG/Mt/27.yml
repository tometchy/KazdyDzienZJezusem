"Mt27,1":
  text: "A gdy nastał ranek, wszyscy naczelni kapłani i starsi ludu naradzili się przeciwko Jezusowi, aby go zabić."
  tags: []
"Mt27,2":
  text: "Związali go, odprowadzili i wydali namiestnikowi Poncjuszowi Piłatowi."
  tags: []
"Mt27,3":
  text: "Wtedy Judasz, który go wydał, widząc, że został skazany, żałował tego i zwrócił trzydzieści srebrników naczelnym kapłanom i starszym;"
  tags: []
"Mt27,4":
  text: "Mówiąc: Zgrzeszyłem, wydając krew niewinną. A oni powiedzieli: Cóż nam do tego? To twoja sprawa."
  tags: []
"Mt27,5":
  text: "Wtedy rzucił te srebrniki w świątyni i oddalił się, a potem poszedł i powiesił się."
  tags: []
"Mt27,6":
  text: "A naczelni kapłani wzięli srebrniki i mówili: Nie wolno ich kłaść do skarbca świątynnego, gdyż jest to zapłata za krew."
  tags: []
"Mt27,7":
  text: "I naradziwszy się, kupili za nie pole garncarza, aby grzebać na nim cudzoziemców."
  tags: []
"Mt27,8":
  text: "Dlatego to pole aż do dziś nazywa się Polem Krwi."
  tags: []
"Mt27,9":
  text: "Wtedy się wypełniło, co zostało powiedziane przez proroka Jeremiasza: I wzięli trzydzieści srebrników, zapłatę za oszacowanego, którego oszacowali synowie Izraela;"
  tags: []
"Mt27,10":
  text: "I dali je za pole garncarza, jak mi nakazał Pan."
  tags: []
"Mt27,11":
  text: "Jezus stał przed namiestnikiem. I zapytał go namiestnik: Czy ty jesteś królem Żydów? Jezus mu odpowiedział: Ty sam to mówisz."
  tags: []
"Mt27,12":
  text: "A gdy oskarżali go naczelni kapłani i starsi, nic nie odpowiedział."
  tags: []
"Mt27,13":
  text: "Wtedy Piłat zapytał go: Nie słyszysz, jak wiele zeznają przeciwko tobie?"
  tags: []
"Mt27,14":
  text: "Lecz mu nie odpowiedział na żadne słowo, tak że namiestnik bardzo się dziwił."
  tags: []
"Mt27,15":
  text: "A na święto namiestnik miał zwyczaj wypuszczać ludowi jednego więźnia, tego, którego chcieli."
  tags: []
"Mt27,16":
  text: "Trzymano zaś w tym czasie osławionego więźnia, zwanego Barabaszem."
  tags: []
"Mt27,17":
  text: "Gdy więc się zebrali, zapytał ich Piłat: Którego chcecie, abym wam wypuścił? Barabasza czy Jezusa, zwanego Chrystusem?"
  tags: []
"Mt27,18":
  text: "Wiedział bowiem, że wydali go z zawiści."
  tags: []
"Mt27,19":
  text: "A gdy on siedział na krześle sędziowskim, jego żona posłała wiadomość do niego: Nie miej nic do czynienia z tym sprawiedliwym, bo dzisiaj we śnie wiele wycierpiałam z jego powodu."
  tags: []
"Mt27,20":
  text: "Tymczasem naczelni kapłani i starsi namówili tłumy, aby prosiły o Barabasza, a domagały się stracenia Jezusa."
  tags: []
"Mt27,21":
  text: "Namiestnik zapytał ich: Którego z tych dwóch chcecie, abym wam wypuścił? A oni odpowiedzieli: Barabasza."
  tags: []
"Mt27,22":
  text: "Piłat zapytał ich: Cóż więc mam zrobić z Jezusem, którego nazywają Chrystusem? Odpowiedzieli mu wszyscy: Niech będzie ukrzyżowany!"
  tags: []
"Mt27,23":
  text: "Namiestnik zaś zapytał: Cóż właściwie złego uczynił? Lecz oni jeszcze głośniej wołali: Niech będzie ukrzyżowany!"
  tags: []
"Mt27,24":
  text: "Gdy Piłat zobaczył, że nic nie osiąga, ale przeciwnie, zamieszanie staje się większe, wziął wodę i umył ręce przed tłumem, mówiąc: Nie jestem winny krwi tego sprawiedliwego. To wasza sprawa."
  tags: []
"Mt27,25":
  text: "A cały lud odpowiedział: Krew jego na nas i na nasze dzieci."
  tags: []
"Mt27,26":
  text: "Wtedy wypuścił im Barabasza, a Jezusa, po ubiczowaniu, wydał na ukrzyżowanie."
  tags: []
"Mt27,27":
  text: "Wówczas żołnierze namiestnika zaprowadzili Jezusa na ratusz i zebrali wokół niego cały oddział."
  tags: []
"Mt27,28":
  text: "A rozebrawszy go, ubrali go w szkarłatny płaszcz."
  tags: []
"Mt27,29":
  text: "Upletli koronę z cierni i włożyli mu na głowę, a w prawą rękę dali trzcinę. I padając przed nim na kolana, naśmiewali się z niego, mówiąc: Witaj, królu Żydów!"
  tags: []
"Mt27,30":
  text: "A plując na niego, brali tę trzcinę i bili go po głowie."
  tags: []
"Mt27,31":
  text: "Kiedy go wyszydzili, zdjęli z niego płaszcz, ubrali go w jego szaty i odprowadzili na ukrzyżowanie."
  tags: []
"Mt27,32":
  text: "A wychodząc, spotkali człowieka z Cyreny, imieniem Szymon. Tego przymusili, aby niósł jego krzyż."
  tags: []
"Mt27,33":
  text: "Gdy przyszli na miejsce zwane Golgotą, czyli Miejscem Czaszki;"
  tags: []
"Mt27,34":
  text: "Dali mu do picia ocet zmieszany z żółcią. Skosztował, ale nie chciał pić."
  tags: []
"Mt27,35":
  text: "A gdy go ukrzyżowali, rozdzielili jego szaty i rzucali losy, aby się wypełniło, co zostało powiedziane przez proroka: Rozdzielili między siebie moje szaty, a o moje ubranie rzucali losy."
  tags: []
"Mt27,36":
  text: "A siedząc, tam go pilnowali."
  tags: []
"Mt27,37":
  text: "I umieścili nad jego głową napis z podaniem jego winy: To jest Jezus, król Żydów."
  tags: []
"Mt27,38":
  text: "Ukrzyżowano też z nim dwóch bandytów, jednego po prawej, a drugiego po lewej stronie."
  tags: []
"Mt27,39":
  text: "A ci, którzy przechodzili obok, bluźnili mu, kiwając głowami;"
  tags: []
"Mt27,40":
  text: "I mówiąc: Ty, który burzysz świątynię i w trzy dni ją odbudowujesz, ratuj samego siebie. Jeśli jesteś Synem Bożym, zejdź z krzyża."
  tags: []
"Mt27,41":
  text: "Podobnie naczelni kapłani z uczonymi w Piśmie i starszymi, naśmiewając się, mówili:"
  tags: []
"Mt27,42":
  text: "Innych ratował, a samego siebie uratować nie może. Jeśli jest królem Izraela, niech teraz zejdzie z krzyża, a uwierzymy mu."
  tags: []
"Mt27,43":
  text: "Ufał Bogu, niech go teraz wybawi, jeśli go sobie upodobał. Przecież powiedział: Jestem Synem Bożym."
  tags: []
"Mt27,44":
  text: "Tak samo urągali mu też bandyci, którzy byli z nim ukrzyżowani."
  tags: []
"Mt27,45":
  text: "A od godziny szóstej aż do dziewiątej ciemność ogarnęła całą ziemię."
  tags: []
"Mt27,46":
  text: "Około godziny dziewiątej Jezus zawołał donośnym głosem: Eli, Eli, lama sabachthani? To znaczy: Boże mój, Boże mój, czemu mnie opuściłeś?"
  tags: []
"Mt27,47":
  text: "Wtedy niektórzy z tych, co tam stali, usłyszawszy to, mówili: On woła Eliasza."
  tags: []
"Mt27,48":
  text: "I zaraz jeden z nich podbiegł, wziął gąbkę i napełnił ją octem, a włożywszy na trzcinę, dał mu pić."
  tags: []
"Mt27,49":
  text: "Lecz inni mówili: Przestań, zobaczmy, czy przyjdzie Eliasz, aby go wybawić."
  tags: []
"Mt27,50":
  text: "Jezus zaś zawołał ponownie donośnym głosem i oddał ducha."
  tags: []
"Mt27,51":
  text: "A oto zasłona świątyni rozerwała się na pół, od góry aż do dołu, ziemia się zatrzęsła i skały popękały."
  tags: []
"Mt27,52":
  text: "Grobowce się otworzyły, a wiele ciał świętych, którzy zasnęli, powstało."
  tags: []
"Mt27,53":
  text: "I wyszli z grobów po jego zmartwychwstaniu, weszli do miasta świętego i ukazali się wielu."
  tags: []
"Mt27,54":
  text: "Wtedy setnik i ci, którzy z nim pilnowali Jezusa, widząc trzęsienie ziemi i to, co się działo, bardzo się zlękli i powiedzieli: On prawdziwie był Synem Bożym."
  tags: []
"Mt27,55":
  text: "A było tam wiele kobiet, które przypatrywały się z daleka. Szły one za Jezusem od Galilei i usługiwały mu."
  tags: []
"Mt27,56":
  text: "Wśród nich były: Maria Magdalena, Maria, matka Jakuba i Józefa, oraz matka synów Zebedeusza."
  tags: []
"Mt27,57":
  text: "A gdy nastał wieczór, przyszedł bogaty człowiek z Arymatei, imieniem Józef, który też był uczniem Jezusa."
  tags: []
"Mt27,58":
  text: "Udał się on do Piłata i poprosił o ciało Jezusa. Wtedy Piłat rozkazał, aby mu je wydano."
  tags: []
"Mt27,59":
  text: "A Józef zabrał ciało, owinął je w czyste płótno;"
  tags: []
"Mt27,60":
  text: "I złożył w swoim nowym grobowcu, który wykuł w skale. Przed wejście do grobowca zatoczył wielki kamień i odszedł."
  tags: []
"Mt27,61":
  text: "A Maria Magdalena i druga Maria siedziały tam naprzeciw grobowca."
  tags: []
"Mt27,62":
  text: "Następnego dnia, pierwszego po dniu przygotowania, naczelni kapłani i faryzeusze zebrali się u Piłata;"
  tags: []
"Mt27,63":
  text: "I oznajmili: Panie, przypomnieliśmy sobie, że ten zwodziciel powiedział, gdy jeszcze żył: Po trzech dniach zmartwychwstanę."
  tags: []
"Mt27,64":
  text: "Rozkaż więc zabezpieczyć grobowiec aż do trzeciego dnia, by przypadkiem jego uczniowie nie przyszli w nocy, nie wykradli go i nie powiedzieli ludowi: Powstał z martwych. I ostatni błąd będzie gorszy niż pierwszy."
  tags: []
"Mt27,65":
  text: "Piłat powiedział im: Macie straż. Idźcie, zabezpieczcie, jak umiecie."
  tags: []
"Mt27,66":
  text: "Poszli więc i zabezpieczyli grobowiec, pieczętując kamień i stawiając straż."
  tags: []
