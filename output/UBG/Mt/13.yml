"Mt13,1":
  text: "A tego dnia Jezus wyszedł z domu i usiadł nad brzegiem morza."
  tags: []
"Mt13,2":
  text: "I zebrały się wokół niego wielkie tłumy, dlatego wszedł do łodzi i usiadł, a wszyscy ludzie stali na brzegu."
  tags: []
"Mt13,3":
  text: "I mówił do nich wiele w przypowieściach. I powiedział: Oto siewca wyszedł siać."
  tags: []
"Mt13,4":
  text: "A gdy siał, niektóre ziarna padły przy drodze, przyleciały ptaki i wydziobały je."
  tags: []
"Mt13,5":
  text: "Inne padły na miejsca skaliste, gdzie nie miały wiele ziemi. Zaraz wzeszły, bo ziemia nie była głęboka."
  tags: []
"Mt13,6":
  text: "Lecz gdy wzeszło słońce, zostały spalone, a ponieważ nie miały korzenia, uschły."
  tags: []
"Mt13,7":
  text: "Inne padły między ciernie, a ciernie wyrosły i zagłuszyły je."
  tags: []
"Mt13,8":
  text: "Inne zaś padły na dobrą ziemię i wydały plon, jedne stokrotny, inne sześćdziesięciokrotny, a jeszcze inne trzydziestokrotny."
  tags: []
"Mt13,9":
  text: "Kto ma uszy do słuchania, niech słucha."
  tags: []
"Mt13,10":
  text: "Wtedy uczniowie podeszli i zapytali go: Dlaczego mówisz do nich w przypowieściach?"
  tags: []
"Mt13,11":
  text: "A on odpowiedział im: Wam dano poznać tajemnice królestwa niebieskiego, ale im nie jest dane."
  tags: []
"Mt13,12":
  text: "Kto bowiem ma, temu będzie dodane i będzie miał w obfitości, ale kto nie ma, zostanie mu zabrane nawet to, co ma."
  tags: []
"Mt13,13":
  text: "Dlatego mówię do nich w przypowieściach, bo patrzą, a nie widzą, i słuchają, a nie słyszą ani nie rozumieją."
  tags: []
"Mt13,14":
  text: "I spełnia się na nich proroctwo Izajasza, które mówi: Słuchając, będziecie słyszeć, ale nie zrozumiecie i patrząc, będziecie widzieć, ale nie zobaczycie."
  tags: []
"Mt13,15":
  text: "Utyło bowiem serce tego ludu, stępiały ich uszy i zamknęli swe oczy, żeby przypadkiem oczami nie widzieli ani uszami nie słyszeli, a sercem nie zrozumieli i nie nawrócili się, i żebym ich nie uzdrowił."
  tags: []
"Mt13,16":
  text: "Ale błogosławione wasze oczy, bo widzą, i wasze uszy, bo słyszą."
  tags: []
"Mt13,17":
  text: "Bo zaprawdę powiadam wam: Wielu proroków i sprawiedliwych pragnęło widzieć to, co wy widzicie, ale nie zobaczyli, i słyszeć to, co wy słyszycie, ale nie usłyszeli."
  tags: []
"Mt13,18":
  text: "Wysłuchajcie więc przypowieści o siewcy."
  tags: []
"Mt13,19":
  text: "Gdy ktoś słucha słowa o królestwie, a nie rozumie, przychodzi zły i porywa to, co zostało zasiane w jego sercu. To jest ten posiany przy drodze."
  tags: []
"Mt13,20":
  text: "A posiany na miejscach skalistych to ten, który słucha słowa i natychmiast z radością je przyjmuje."
  tags: []
"Mt13,21":
  text: "Nie ma jednak w sobie korzenia, lecz trwa do czasu. Gdy bowiem przychodzi ucisk albo prześladowanie z powodu słowa, zaraz się gorszy."
  tags: []
"Mt13,22":
  text: "A posiany między ciernie to ten, który słucha słowa, ale troski tego świata i ułuda bogactwa zagłuszają słowo i staje się on bezowocny."
  tags: []
"Mt13,23":
  text: "A posiany na dobrej ziemi to ten, który słucha słowa i rozumie je. On też wydaje plon: jeden stokrotny, inny sześćdziesięciokrotny, a jeszcze inny trzydziestokrotny."
  tags: []
"Mt13,24":
  text: "Podał im też inną przypowieść: Królestwo niebieskie podobne jest do człowieka, który zasiał dobre ziarno na swoim polu."
  tags: []
"Mt13,25":
  text: "Lecz gdy ludzie spali, przyszedł jego nieprzyjaciel, nasiał kąkolu między pszenicę i odszedł."
  tags: []
"Mt13,26":
  text: "A gdy zboże urosło i wydało plon, wtedy ukazał się też kąkol."
  tags: []
"Mt13,27":
  text: "Wówczas słudzy gospodarza przyszli i zapytali go: Panie, czy nie posiałeś na swoim polu dobrego ziarna? Skąd więc ten kąkol?"
  tags: []
"Mt13,28":
  text: "A on im odpowiedział: Nieprzyjaciel to zrobił. I zapytali go słudzy: Czy chcesz, żebyśmy poszli i zebrali go?"
  tags: []
"Mt13,29":
  text: "Lecz on odpowiedział: Nie, żebyście przypadkiem, zbierając kąkol, nie wykorzenili razem z nim i pszenicy."
  tags: []
"Mt13,30":
  text: "Pozwólcie obydwu razem rosnąć aż do żniwa, a w czasie żniwa powiem żniwiarzom: Zbierzcie najpierw kąkol i zwiążcie go w snopki na spalenie, pszenicę zaś zgromadźcie w moim spichlerzu."
  tags: []
"Mt13,31":
  text: "Podał im też inną przypowieść: Królestwo niebieskie podobne jest do ziarna gorczycy, które człowiek, wziąwszy, zasiał na swoim polu."
  tags: []
"Mt13,32":
  text: "Jest ono najmniejsze ze wszystkich nasion, ale kiedy wyrośnie, jest największe ze wszystkich jarzyn i staje się drzewem, tak że ptaki niebieskie przylatują i gnieżdżą się w jego gałęziach."
  tags: []
"Mt13,33":
  text: "Opowiedział im jeszcze inną przypowieść: Królestwo niebieskie podobne jest do zakwasu, który kobieta wzięła i włożyła w trzy miary mąki, aż wszystko się zakwasiło."
  tags: []
"Mt13,34":
  text: "To wszystko mówił Jezus do tłumu w przypowieściach, a bez przypowieści nic do nich nie mówił;"
  tags: []
"Mt13,35":
  text: "Aby się wypełniło, co zostało powiedziane przez proroka: Otworzę moje usta w przypowieściach, wypowiem rzeczy ukryte od założenia świata."
  tags: []
"Mt13,36":
  text: "Wtedy Jezus odprawił tłum i przyszedł do domu. Podeszli do niego jego uczniowie i mówili: Wyjaśnij nam przypowieść o kąkolu na polu."
  tags: []
"Mt13,37":
  text: "A on odpowiedział im: Tym, który sieje dobre ziarno, jest Syn Człowieczy."
  tags: []
"Mt13,38":
  text: "Polem jest świat, dobrym ziarnem są synowie królestwa, kąkolem zaś są synowie złego."
  tags: []
"Mt13,39":
  text: "Nieprzyjacielem, który go posiał, jest diabeł, żniwem jest koniec świata, a żniwiarzami są aniołowie."
  tags: []
"Mt13,40":
  text: "Jak więc zbiera się kąkol i spala w ogniu, tak będzie przy końcu tego świata."
  tags: []
"Mt13,41":
  text: "Syn Człowieczy pośle swoich aniołów, a oni zbiorą z jego królestwa wszystkie zgorszenia i tych, którzy popełniają nieprawość;"
  tags: []
"Mt13,42":
  text: "I wrzucą ich do pieca ognistego. Tam będzie płacz i zgrzytanie zębów."
  tags: []
"Mt13,43":
  text: "Wtedy sprawiedliwi będą jaśnieć jak słońce w królestwie swego Ojca. Kto ma uszy do słuchania, niech słucha."
  tags: []
"Mt13,44":
  text: "Ponownie królestwo niebieskie jest podobne do skarbu ukrytego w polu, który człowiek znalazł i ukrył. Uradowany nim poszedł, sprzedał wszystko, co miał, i kupił to pole."
  tags: []
"Mt13,45":
  text: "Królestwo niebieskie podobne jest też do kupca, który szukał pięknych pereł."
  tags: []
"Mt13,46":
  text: "A znalazłszy jedną bardzo cenną perłę, poszedł, sprzedał wszystko, co miał, i kupił ją."
  tags: []
"Mt13,47":
  text: "Królestwo niebieskie podobne jest również do sieci zarzuconej w morze i zagarniającej ryby wszelkiego rodzaju."
  tags: []
"Mt13,48":
  text: "Gdy się napełniła, rybacy wyciągnęli ją na brzeg, a usiadłszy, dobre ryby wybrali do naczyń, a złe wyrzucili."
  tags: []
"Mt13,49":
  text: "Tak będzie przy końcu świata: wyjdą aniołowie i wyłączą złych spośród sprawiedliwych;"
  tags: []
"Mt13,50":
  text: "I wrzucą ich do pieca ognistego. Tam będzie płacz i zgrzytanie zębów."
  tags: []
"Mt13,51":
  text: "Jezus ich zapytał: Zrozumieliście to wszystko? Odpowiedzieli mu: Tak, Panie."
  tags: []
"Mt13,52":
  text: "A on powiedział do nich: Dlatego każdy uczony w Piśmie, który jest pouczony o królestwie niebieskim, podobny jest do gospodarza, który wydobywa ze swego skarbca nowe i stare rzeczy."
  tags: []
"Mt13,53":
  text: "Kiedy Jezus dokończył tych przypowieści, odszedł stamtąd."
  tags: []
"Mt13,54":
  text: "A przyszedłszy w swoje rodzinne strony, nauczał ludzi w ich synagodze, tak że się bardzo zdumiewali i mówili: Skąd on ma tę mądrość i moc?"
  tags: []
"Mt13,55":
  text: "Czyż to nie jest syn cieśli? Czyż jego matce nie jest na imię Maria, a jego bracia to Jakub, Józef, Szymon i Juda?"
  tags: []
"Mt13,56":
  text: "A jego siostry, czyż wszystkie nie są wśród nas? Skąd więc on ma to wszystko?"
  tags: []
"Mt13,57":
  text: "I byli nim zgorszeni. Lecz Jezus powiedział do nich: Nigdzie nie jest prorok bez czci, tylko w swojej ojczyźnie i w swoim domu."
  tags: []
"Mt13,58":
  text: "I nie uczynił tam wielu cudów z powodu ich niewiary."
  tags: []
