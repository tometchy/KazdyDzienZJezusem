"Mt13,1": "A tego dnia Jezus wyszedł z domu i usiadł nad brzegiem morza."
"Mt13,2": "I zebrały się wokół niego wielkie tłumy, dlatego wszedł do łodzi i usiadł, a wszyscy ludzie stali na brzegu."
"Mt13,3": "I mówił do nich wiele w przypowieściach. I powiedział: Oto siewca wyszedł siać."
"Mt13,4": "A gdy siał, niektóre ziarna padły przy drodze, przyleciały ptaki i wydziobały je."
"Mt13,5": "Inne padły na miejsca skaliste, gdzie nie miały wiele ziemi. Zaraz wzeszły, bo ziemia nie była głęboka."
"Mt13,6": "Lecz gdy wzeszło słońce, zostały spalone, a ponieważ nie miały korzenia, uschły."
"Mt13,7": "Inne padły między ciernie, a ciernie wyrosły i zagłuszyły je."
"Mt13,8": "Inne zaś padły na dobrą ziemię i wydały plon, jedne stokrotny, inne sześćdziesięciokrotny, a jeszcze inne trzydziestokrotny."
"Mt13,9": "Kto ma uszy do słuchania, niech słucha."
"Mt13,10": "Wtedy uczniowie podeszli i zapytali go: Dlaczego mówisz do nich w przypowieściach?"
"Mt13,11": "A on odpowiedział im: Wam dano poznać tajemnice królestwa niebieskiego, ale im nie jest dane."
"Mt13,12": "Kto bowiem ma, temu będzie dodane i będzie miał w obfitości, ale kto nie ma, zostanie mu zabrane nawet to, co ma."
"Mt13,13": "Dlatego mówię do nich w przypowieściach, bo patrzą, a nie widzą, i słuchają, a nie słyszą ani nie rozumieją."
"Mt13,14": "I spełnia się na nich proroctwo Izajasza, które mówi: Słuchając, będziecie słyszeć, ale nie zrozumiecie i patrząc, będziecie widzieć, ale nie zobaczycie."
"Mt13,15": "Utyło bowiem serce tego ludu, stępiały ich uszy i zamknęli swe oczy, żeby przypadkiem oczami nie widzieli ani uszami nie słyszeli, a sercem nie zrozumieli i nie nawrócili się, i żebym ich nie uzdrowił."
"Mt13,16": "Ale błogosławione wasze oczy, bo widzą, i wasze uszy, bo słyszą."
"Mt13,17": "Bo zaprawdę powiadam wam: Wielu proroków i sprawiedliwych pragnęło widzieć to, co wy widzicie, ale nie zobaczyli, i słyszeć to, co wy słyszycie, ale nie usłyszeli."
"Mt13,18": "Wysłuchajcie więc przypowieści o siewcy."
"Mt13,19": "Gdy ktoś słucha słowa o królestwie, a nie rozumie, przychodzi zły i porywa to, co zostało zasiane w jego sercu. To jest ten posiany przy drodze."
"Mt13,20": "A posiany na miejscach skalistych to ten, który słucha słowa i natychmiast z radością je przyjmuje."
"Mt13,21": "Nie ma jednak w sobie korzenia, lecz trwa do czasu. Gdy bowiem przychodzi ucisk albo prześladowanie z powodu słowa, zaraz się gorszy."
"Mt13,22": "A posiany między ciernie to ten, który słucha słowa, ale troski tego świata i ułuda bogactwa zagłuszają słowo i staje się on bezowocny."
"Mt13,23": "A posiany na dobrej ziemi to ten, który słucha słowa i rozumie je. On też wydaje plon: jeden stokrotny, inny sześćdziesięciokrotny, a jeszcze inny trzydziestokrotny."
"Mt13,24": "Podał im też inną przypowieść: Królestwo niebieskie podobne jest do człowieka, który zasiał dobre ziarno na swoim polu."
"Mt13,25": "Lecz gdy ludzie spali, przyszedł jego nieprzyjaciel, nasiał kąkolu między pszenicę i odszedł."
"Mt13,26": "A gdy zboże urosło i wydało plon, wtedy ukazał się też kąkol."
"Mt13,27": "Wówczas słudzy gospodarza przyszli i zapytali go: Panie, czy nie posiałeś na swoim polu dobrego ziarna? Skąd więc ten kąkol?"
"Mt13,28": "A on im odpowiedział: Nieprzyjaciel to zrobił. I zapytali go słudzy: Czy chcesz, żebyśmy poszli i zebrali go?"
"Mt13,29": "Lecz on odpowiedział: Nie, żebyście przypadkiem, zbierając kąkol, nie wykorzenili razem z nim i pszenicy."
"Mt13,30": "Pozwólcie obydwu razem rosnąć aż do żniwa, a w czasie żniwa powiem żniwiarzom: Zbierzcie najpierw kąkol i zwiążcie go w snopki na spalenie, pszenicę zaś zgromadźcie w moim spichlerzu."
"Mt13,31": "Podał im też inną przypowieść: Królestwo niebieskie podobne jest do ziarna gorczycy, które człowiek, wziąwszy, zasiał na swoim polu."
"Mt13,32": "Jest ono najmniejsze ze wszystkich nasion, ale kiedy wyrośnie, jest największe ze wszystkich jarzyn i staje się drzewem, tak że ptaki niebieskie przylatują i gnieżdżą się w jego gałęziach."
"Mt13,33": "Opowiedział im jeszcze inną przypowieść: Królestwo niebieskie podobne jest do zakwasu, który kobieta wzięła i włożyła w trzy miary mąki, aż wszystko się zakwasiło."
"Mt13,34": "To wszystko mówił Jezus do tłumu w przypowieściach, a bez przypowieści nic do nich nie mówił;"
"Mt13,35": "Aby się wypełniło, co zostało powiedziane przez proroka: Otworzę moje usta w przypowieściach, wypowiem rzeczy ukryte od założenia świata."
"Mt13,36": "Wtedy Jezus odprawił tłum i przyszedł do domu. Podeszli do niego jego uczniowie i mówili: Wyjaśnij nam przypowieść o kąkolu na polu."
"Mt13,37": "A on odpowiedział im: Tym, który sieje dobre ziarno, jest Syn Człowieczy."
"Mt13,38": "Polem jest świat, dobrym ziarnem są synowie królestwa, kąkolem zaś są synowie złego."
"Mt13,39": "Nieprzyjacielem, który go posiał, jest diabeł, żniwem jest koniec świata, a żniwiarzami są aniołowie."
"Mt13,40": "Jak więc zbiera się kąkol i spala w ogniu, tak będzie przy końcu tego świata."
"Mt13,41": "Syn Człowieczy pośle swoich aniołów, a oni zbiorą z jego królestwa wszystkie zgorszenia i tych, którzy popełniają nieprawość;"
"Mt13,42": "I wrzucą ich do pieca ognistego. Tam będzie płacz i zgrzytanie zębów."
"Mt13,43": "Wtedy sprawiedliwi będą jaśnieć jak słońce w królestwie swego Ojca. Kto ma uszy do słuchania, niech słucha."
"Mt13,44": "Ponownie królestwo niebieskie jest podobne do skarbu ukrytego w polu, który człowiek znalazł i ukrył. Uradowany nim poszedł, sprzedał wszystko, co miał, i kupił to pole."
"Mt13,45": "Królestwo niebieskie podobne jest też do kupca, który szukał pięknych pereł."
"Mt13,46": "A znalazłszy jedną bardzo cenną perłę, poszedł, sprzedał wszystko, co miał, i kupił ją."
"Mt13,47": "Królestwo niebieskie podobne jest również do sieci zarzuconej w morze i zagarniającej ryby wszelkiego rodzaju."
"Mt13,48": "Gdy się napełniła, rybacy wyciągnęli ją na brzeg, a usiadłszy, dobre ryby wybrali do naczyń, a złe wyrzucili."
"Mt13,49": "Tak będzie przy końcu świata: wyjdą aniołowie i wyłączą złych spośród sprawiedliwych;"
"Mt13,50": "I wrzucą ich do pieca ognistego. Tam będzie płacz i zgrzytanie zębów."
"Mt13,51": "Jezus ich zapytał: Zrozumieliście to wszystko? Odpowiedzieli mu: Tak, Panie."
"Mt13,52": "A on powiedział do nich: Dlatego każdy uczony w Piśmie, który jest pouczony o królestwie niebieskim, podobny jest do gospodarza, który wydobywa ze swego skarbca nowe i stare rzeczy."
"Mt13,53": "Kiedy Jezus dokończył tych przypowieści, odszedł stamtąd."
"Mt13,54": "A przyszedłszy w swoje rodzinne strony, nauczał ludzi w ich synagodze, tak że się bardzo zdumiewali i mówili: Skąd on ma tę mądrość i moc?"
"Mt13,55": "Czyż to nie jest syn cieśli? Czyż jego matce nie jest na imię Maria, a jego bracia to Jakub, Józef, Szymon i Juda?"
"Mt13,56": "A jego siostry, czyż wszystkie nie są wśród nas? Skąd więc on ma to wszystko?"
"Mt13,57": "I byli nim zgorszeni. Lecz Jezus powiedział do nich: Nigdzie nie jest prorok bez czci, tylko w swojej ojczyźnie i w swoim domu."
"Mt13,58": "I nie uczynił tam wielu cudów z powodu ich niewiary."
