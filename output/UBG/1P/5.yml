"1P5,1": "Starszych, którzy są wśród was, proszę jako również starszy i świadek cierpień Chrystusa oraz uczestnik chwały, która ma się objawić:"
"1P5,2": "Paście stado Boga, które jest wśród was, doglądając go nie z przymusu, ale dobrowolnie, nie dla brudnego zysku, ale z ochotą;"
"1P5,3": "I nie jak ci, którzy panują nad dziedzictwem Pana, lecz jako wzór dla stada."
"1P5,4": "A gdy się objawi Najwyższy Pasterz, otrzymacie niewiędnącą koronę chwały."
"1P5,5": "Podobnie młodsi, bądźcie poddani starszym. Wszyscy zaś wobec siebie bądźcie poddani. Przyobleczcie się w pokorę, gdyż Bóg pysznym się sprzeciwia, a pokornym łaskę daje."
"1P5,6": "Uniżcie się więc pod potężną ręką Boga, aby was wywyższył w odpowiednim czasie."
"1P5,7": "Wszystkie wasze troski przerzućcie na niego, gdyż on troszczy się o was."
"1P5,8": "Bądźcie trzeźwi, czuwajcie, bo wasz przeciwnik, diabeł, jak lew ryczący krąży, szukając, kogo by pożreć."
"1P5,9": "Przeciwstawiajcie się mu, mocni w wierze, wiedząc, że te same cierpienia są udziałem waszych braci na świecie."
"1P5,10": "A Bóg wszelkiej łaski, ten, który nas powołał do swojej wiecznej chwały w Chrystusie Jezusie, po krótkotrwałych cierpieniach waszych niech uczyni was doskonałymi, utwierdzi, umocni i ugruntuje."
"1P5,11": "Jemu chwała i moc na wieki wieków. Amen."
"1P5,12": "Przez Sylwana, wiernego wam brata, jak sądzę, napisałem krótko, napominając i świadcząc, że to jest prawdziwa łaska Boga, w której trwacie."
"1P5,13": "Pozdrawia was kościół w Babilonie, razem z wami wybrany, i Marek, mój syn."
"1P5,14": "Pozdrówcie się nawzajem pocałunkiem miłości. Pokój wam wszystkim, którzy jesteście w Chrystusie Jezusie. Amen."
