"1P5,1":
  text: "Starszych, którzy są wśród was, proszę jako również starszy i świadek cierpień Chrystusa oraz uczestnik chwały, która ma się objawić:"
  tags: []
"1P5,2":
  text: "Paście stado Boga, które jest wśród was, doglądając go nie z przymusu, ale dobrowolnie, nie dla brudnego zysku, ale z ochotą;"
  tags: []
"1P5,3":
  text: "I nie jak ci, którzy panują nad dziedzictwem Pana, lecz jako wzór dla stada."
  tags: []
"1P5,4":
  text: "A gdy się objawi Najwyższy Pasterz, otrzymacie niewiędnącą koronę chwały."
  tags: []
"1P5,5":
  text: "Podobnie młodsi, bądźcie poddani starszym. Wszyscy zaś wobec siebie bądźcie poddani. Przyobleczcie się w pokorę, gdyż Bóg pysznym się sprzeciwia, a pokornym łaskę daje."
  tags: []
"1P5,6":
  text: "Uniżcie się więc pod potężną ręką Boga, aby was wywyższył w odpowiednim czasie."
  tags: []
"1P5,7":
  text: "Wszystkie wasze troski przerzućcie na niego, gdyż on troszczy się o was."
  tags: []
"1P5,8":
  text: "Bądźcie trzeźwi, czuwajcie, bo wasz przeciwnik, diabeł, jak lew ryczący krąży, szukając, kogo by pożreć."
  tags: []
"1P5,9":
  text: "Przeciwstawiajcie się mu, mocni w wierze, wiedząc, że te same cierpienia są udziałem waszych braci na świecie."
  tags: []
"1P5,10":
  text: "A Bóg wszelkiej łaski, ten, który nas powołał do swojej wiecznej chwały w Chrystusie Jezusie, po krótkotrwałych cierpieniach waszych niech uczyni was doskonałymi, utwierdzi, umocni i ugruntuje."
  tags: []
"1P5,11":
  text: "Jemu chwała i moc na wieki wieków. Amen."
  tags: []
"1P5,12":
  text: "Przez Sylwana, wiernego wam brata, jak sądzę, napisałem krótko, napominając i świadcząc, że to jest prawdziwa łaska Boga, w której trwacie."
  tags: []
"1P5,13":
  text: "Pozdrawia was kościół w Babilonie, razem z wami wybrany, i Marek, mój syn."
  tags: []
"1P5,14":
  text: "Pozdrówcie się nawzajem pocałunkiem miłości. Pokój wam wszystkim, którzy jesteście w Chrystusie Jezusie. Amen."
  tags: []
