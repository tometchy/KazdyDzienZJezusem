"1P1,1": "Piotr, apostoł Jezusa Chrystusa, do wychodźców rozproszonych w Poncie, Galacji, Kapadocji, Azji i Bitynii;"
"1P1,2": "Wybranych według uprzedniej wiedzy Boga Ojca, przez uświęcenie Ducha dla posłuszeństwa i pokropienia krwią Jezusa Chrystusa. Łaska i pokój niech się wam pomnożą."
"1P1,3": "Błogosławiony niech będzie Bóg i Ojciec naszego Pana Jezusa Chrystusa, który według swego wielkiego miłosierdzia zrodził nas na nowo do żywej nadziei przez wskrzeszenie Jezusa Chrystusa z martwych;"
"1P1,4": "Do dziedzictwa niezniszczalnego i nieskalanego, i niewiędnącego, zachowanego w niebie dla was;"
"1P1,5": "Którzy jesteście strzeżeni mocą Boga przez wiarę ku zbawieniu, przygotowanemu do objawienia się w czasie ostatecznym."
"1P1,6": "Z tego się radujecie, choć teraz na krótko, jeśli trzeba, zasmuceni jesteście z powodu rozmaitych prób;"
"1P1,7": "Aby doświadczenie waszej wiary, o wiele cenniejszej od zniszczalnego złota, które jednak próbuje się w ogniu, okazało się ku chwale, czci i sławie przy objawieniu Jezusa Chrystusa;"
"1P1,8": "A choć go nie widzieliście, miłujecie; i w niego, choć teraz go nie widzicie, wierzycie; i cieszycie się radością niewysłowioną i pełną chwały;"
"1P1,9": "Otrzymując koniec waszej wiary – zbawienie dusz."
"1P1,10": "O to zbawienie wywiadywali się i badali je prorocy, którzy prorokowali o przeznaczonej dla was łasce."
"1P1,11": "Badali oni, na jaką i jakiego rodzaju porę wskazywał Duch Chrystusa, który był w nich, przepowiadając cierpienia, które miały przyjść na Chrystusa i mającą potem nastąpić chwałę."
"1P1,12": "Zostało im objawione, że nie im samym, lecz nam służyły sprawy wam teraz zwiastowane przez tych, którzy wam głosili ewangelię przez Ducha Świętego zesłanego z nieba. W te sprawy pragną wejrzeć aniołowie."
"1P1,13": "Dlatego przepaszcie biodra waszego umysłu i bądźcie trzeźwi, pokładając doskonałą nadzieję w łasce, która będzie wam dana przy objawieniu Jezusa Chrystusa."
"1P1,14": "Jak posłuszne dzieci nie ulegajcie pożądliwościom, jakie władały wami wcześniej, w czasie waszej nieświadomości;"
"1P1,15": "Lecz jak ten, który was powołał, jest święty, tak i wy bądźcie świętymi we wszelkim waszym postępowaniu;"
"1P1,16": "Gdyż jest napisane: Świętymi bądźcie, bo ja jestem święty."
"1P1,17": "A jeżeli Ojcem nazywacie tego, który bez względu na osobę sądzi każdego według uczynków, spędzajcie czas waszego pielgrzymowania w bojaźni;"
"1P1,18": "Wiedząc, że nie tym, co zniszczalne, srebrem lub złotem, zostaliście wykupieni z waszego marnego postępowania przekazanego przez ojców;"
"1P1,19": "Lecz drogą krwią Chrystusa jako baranka niewinnego i nieskalanego;"
"1P1,20": "Przeznaczonego do tego przed założeniem świata, a objawionego w czasach ostatecznych ze względu na was."
"1P1,21": "Wy przez niego uwierzyliście w Boga, który go wskrzesił z martwych i dał mu chwałę, aby wasza wiara i nadzieja były w Bogu."
"1P1,22": "Skoro oczyściliście swoje dusze, będąc posłuszni prawdzie przez Ducha ku nieobłudnej braterskiej miłości, czystym sercem jedni drugich gorąco miłujcie;"
"1P1,23": "Będąc odrodzeni nie z nasienia zniszczalnego, ale z niezniszczalnego, przez słowo Boże, które jest żywe i trwa na wieki."
"1P1,24": "Gdyż wszelkie ciało jest jak trawa, a wszelka chwała człowieka jak kwiat trawy. Trawa uschła, a jej kwiat opadł;"
"1P1,25": "Lecz słowo Pana trwa na wieki. A jest to słowo, które zostało wam zwiastowane."
