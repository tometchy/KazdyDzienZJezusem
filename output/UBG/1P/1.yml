"1P1,1":
  text: "Piotr, apostoł Jezusa Chrystusa, do wychodźców rozproszonych w Poncie, Galacji, Kapadocji, Azji i Bitynii;"
  tags: []
"1P1,2":
  text: "Wybranych według uprzedniej wiedzy Boga Ojca, przez uświęcenie Ducha dla posłuszeństwa i pokropienia krwią Jezusa Chrystusa. Łaska i pokój niech się wam pomnożą."
  tags: []
"1P1,3":
  text: "Błogosławiony niech będzie Bóg i Ojciec naszego Pana Jezusa Chrystusa, który według swego wielkiego miłosierdzia zrodził nas na nowo do żywej nadziei przez wskrzeszenie Jezusa Chrystusa z martwych;"
  tags: []
"1P1,4":
  text: "Do dziedzictwa niezniszczalnego i nieskalanego, i niewiędnącego, zachowanego w niebie dla was;"
  tags: []
"1P1,5":
  text: "Którzy jesteście strzeżeni mocą Boga przez wiarę ku zbawieniu, przygotowanemu do objawienia się w czasie ostatecznym."
  tags: []
"1P1,6":
  text: "Z tego się radujecie, choć teraz na krótko, jeśli trzeba, zasmuceni jesteście z powodu rozmaitych prób;"
  tags: []
"1P1,7":
  text: "Aby doświadczenie waszej wiary, o wiele cenniejszej od zniszczalnego złota, które jednak próbuje się w ogniu, okazało się ku chwale, czci i sławie przy objawieniu Jezusa Chrystusa;"
  tags: []
"1P1,8":
  text: "A choć go nie widzieliście, miłujecie; i w niego, choć teraz go nie widzicie, wierzycie; i cieszycie się radością niewysłowioną i pełną chwały;"
  tags: []
"1P1,9":
  text: "Otrzymując koniec waszej wiary – zbawienie dusz."
  tags: []
"1P1,10":
  text: "O to zbawienie wywiadywali się i badali je prorocy, którzy prorokowali o przeznaczonej dla was łasce."
  tags: []
"1P1,11":
  text: "Badali oni, na jaką i jakiego rodzaju porę wskazywał Duch Chrystusa, który był w nich, przepowiadając cierpienia, które miały przyjść na Chrystusa i mającą potem nastąpić chwałę."
  tags: []
"1P1,12":
  text: "Zostało im objawione, że nie im samym, lecz nam służyły sprawy wam teraz zwiastowane przez tych, którzy wam głosili ewangelię przez Ducha Świętego zesłanego z nieba. W te sprawy pragną wejrzeć aniołowie."
  tags: []
"1P1,13":
  text: "Dlatego przepaszcie biodra waszego umysłu i bądźcie trzeźwi, pokładając doskonałą nadzieję w łasce, która będzie wam dana przy objawieniu Jezusa Chrystusa."
  tags: []
"1P1,14":
  text: "Jak posłuszne dzieci nie ulegajcie pożądliwościom, jakie władały wami wcześniej, w czasie waszej nieświadomości;"
  tags: []
"1P1,15":
  text: "Lecz jak ten, który was powołał, jest święty, tak i wy bądźcie świętymi we wszelkim waszym postępowaniu;"
  tags: []
"1P1,16":
  text: "Gdyż jest napisane: Świętymi bądźcie, bo ja jestem święty."
  tags: []
"1P1,17":
  text: "A jeżeli Ojcem nazywacie tego, który bez względu na osobę sądzi każdego według uczynków, spędzajcie czas waszego pielgrzymowania w bojaźni;"
  tags: []
"1P1,18":
  text: "Wiedząc, że nie tym, co zniszczalne, srebrem lub złotem, zostaliście wykupieni z waszego marnego postępowania przekazanego przez ojców;"
  tags: []
"1P1,19":
  text: "Lecz drogą krwią Chrystusa jako baranka niewinnego i nieskalanego;"
  tags: []
"1P1,20":
  text: "Przeznaczonego do tego przed założeniem świata, a objawionego w czasach ostatecznych ze względu na was."
  tags: []
"1P1,21":
  text: "Wy przez niego uwierzyliście w Boga, który go wskrzesił z martwych i dał mu chwałę, aby wasza wiara i nadzieja były w Bogu."
  tags: []
"1P1,22":
  text: "Skoro oczyściliście swoje dusze, będąc posłuszni prawdzie przez Ducha ku nieobłudnej braterskiej miłości, czystym sercem jedni drugich gorąco miłujcie;"
  tags: []
"1P1,23":
  text: "Będąc odrodzeni nie z nasienia zniszczalnego, ale z niezniszczalnego, przez słowo Boże, które jest żywe i trwa na wieki."
  tags: []
"1P1,24":
  text: "Gdyż wszelkie ciało jest jak trawa, a wszelka chwała człowieka jak kwiat trawy. Trawa uschła, a jej kwiat opadł;"
  tags: []
"1P1,25":
  text: "Lecz słowo Pana trwa na wieki. A jest to słowo, które zostało wam zwiastowane."
  tags: []
