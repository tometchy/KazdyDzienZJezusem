"1P3,1":
  text: "Podobnie żony, bądźcie poddane swoim mężom, aby nawet ci, którzy nie wierzą słowu, przez postępowanie żon zostali pozyskani bez słowa;"
  tags: []
"1P3,2":
  text: "Widząc wasze czyste, pełne bojaźni postępowanie."
  tags: []
"1P3,3":
  text: "Niech waszą ozdobą nie będzie to, co zewnętrzne: zaplatanie włosów, obłożenie się złotem lub strojenie w szaty;"
  tags: []
"1P3,4":
  text: "Lecz ukryty, wewnętrzny człowiek w niezniszczalnej ozdobie łagodności i spokoju ducha, który jest cenny w oczach Boga."
  tags: []
"1P3,5":
  text: "Tak bowiem niegdyś przyozdabiały się święte kobiety, pokładające nadzieję w Bogu, będąc poddane swoim mężom."
  tags: []
"1P3,6":
  text: "Tak też Sara była posłuszna Abrahamowi, nazywając go panem. Jej córkami jesteście wy, jeśli tylko dobrze czynicie i nie dajecie się niczym zastraszyć."
  tags: []
"1P3,7":
  text: "Podobnie wy, mężowie, żyjcie z nimi umiejętnie, okazując im szacunek jako słabszemu naczyniu kobiecemu i jako tym, które współdziedziczą łaskę życia, aby wasze modlitwy nie doznały przeszkód."
  tags: []
"1P3,8":
  text: "Na koniec zaś wszyscy bądźcie jednomyślni, współczujący, miłujący braci, miłosierni i uprzejmi."
  tags: []
"1P3,9":
  text: "Nie oddawajcie złem za zło ani obelgą za obelgę. Przeciwnie, błogosławcie, gdyż wiecie, że do tego zostaliście powołani, abyście odziedziczyli błogosławieństwo."
  tags: []
"1P3,10":
  text: "Kto bowiem chce miłować życie i oglądać dni dobre, niech powstrzyma język od zła, a usta od podstępnej mowy."
  tags: []
"1P3,11":
  text: "Niech odwróci się od zła i czyni dobro, niech szuka pokoju i dąży do niego."
  tags: []
"1P3,12":
  text: "Oczy Pana bowiem zwrócone są na sprawiedliwych, a jego uszy ku ich prośbom, lecz oblicze Pana przeciwko tym, którzy źle czynią."
  tags: []
"1P3,13":
  text: "Kto wyrządzi wam zło, jeśli będziecie naśladowcami dobra?"
  tags: []
"1P3,14":
  text: "Ale jeśli nawet cierpicie dla sprawiedliwości, błogosławieni jesteście. Nie bójcie się ich gróźb ani się nie lękajcie."
  tags: []
"1P3,15":
  text: "Lecz Pana Boga uświęcajcie w waszych sercach i bądźcie zawsze gotowi udzielić odpowiedzi każdemu, kto domaga się od was uzasadnienia waszej nadziei, z łagodnością i bojaźnią."
  tags: []
"1P3,16":
  text: "Miejcie czyste sumienie, aby za to, że mówią o was źle, jak o złoczyńcach, zostali zawstydzeni ci, którzy zniesławiają wasze dobre postępowanie w Chrystusie."
  tags: []
"1P3,17":
  text: "Lepiej bowiem – jeśli taka jest wola Boga – cierpieć, czyniąc dobrze, aniżeli czyniąc źle."
  tags: []
"1P3,18":
  text: "Gdyż i Chrystus raz za grzechy cierpiał, sprawiedliwy za niesprawiedliwych, aby nas przyprowadzić do Boga; uśmiercony w ciele, lecz ożywiony Duchem;"
  tags: []
"1P3,19":
  text: "W którym poszedł i głosił też duchom będącym w więzieniu;"
  tags: []
"1P3,20":
  text: "Niegdyś nieposłusznym, gdy za dni Noego raz oczekiwała Boża cierpliwość, kiedy budowano arkę, w której niewiele, to jest osiem dusz, zostało uratowanych przez wodę."
  tags: []
"1P3,21":
  text: "Teraz też chrzest, będąc tego odbiciem, zbawia nas – nie jest usunięciem cielesnego brudu, ale odpowiedzią czystego sumienia wobec Boga – przez zmartwychwstanie Jezusa Chrystusa;"
  tags: []
"1P3,22":
  text: "Który, poszedłszy do nieba, jest po prawicy Boga, a zostali mu poddani aniołowie, zwierzchności i moce."
  tags: []
