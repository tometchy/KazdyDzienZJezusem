"1P3,1": "Podobnie żony, bądźcie poddane swoim mężom, aby nawet ci, którzy nie wierzą słowu, przez postępowanie żon zostali pozyskani bez słowa;"
"1P3,2": "Widząc wasze czyste, pełne bojaźni postępowanie."
"1P3,3": "Niech waszą ozdobą nie będzie to, co zewnętrzne: zaplatanie włosów, obłożenie się złotem lub strojenie w szaty;"
"1P3,4": "Lecz ukryty, wewnętrzny człowiek w niezniszczalnej ozdobie łagodności i spokoju ducha, który jest cenny w oczach Boga."
"1P3,5": "Tak bowiem niegdyś przyozdabiały się święte kobiety, pokładające nadzieję w Bogu, będąc poddane swoim mężom."
"1P3,6": "Tak też Sara była posłuszna Abrahamowi, nazywając go panem. Jej córkami jesteście wy, jeśli tylko dobrze czynicie i nie dajecie się niczym zastraszyć."
"1P3,7": "Podobnie wy, mężowie, żyjcie z nimi umiejętnie, okazując im szacunek jako słabszemu naczyniu kobiecemu i jako tym, które współdziedziczą łaskę życia, aby wasze modlitwy nie doznały przeszkód."
"1P3,8": "Na koniec zaś wszyscy bądźcie jednomyślni, współczujący, miłujący braci, miłosierni i uprzejmi."
"1P3,9": "Nie oddawajcie złem za zło ani obelgą za obelgę. Przeciwnie, błogosławcie, gdyż wiecie, że do tego zostaliście powołani, abyście odziedziczyli błogosławieństwo."
"1P3,10": "Kto bowiem chce miłować życie i oglądać dni dobre, niech powstrzyma język od zła, a usta od podstępnej mowy."
"1P3,11": "Niech odwróci się od zła i czyni dobro, niech szuka pokoju i dąży do niego."
"1P3,12": "Oczy Pana bowiem zwrócone są na sprawiedliwych, a jego uszy ku ich prośbom, lecz oblicze Pana przeciwko tym, którzy źle czynią."
"1P3,13": "Kto wyrządzi wam zło, jeśli będziecie naśladowcami dobra?"
"1P3,14": "Ale jeśli nawet cierpicie dla sprawiedliwości, błogosławieni jesteście. Nie bójcie się ich gróźb ani się nie lękajcie."
"1P3,15": "Lecz Pana Boga uświęcajcie w waszych sercach i bądźcie zawsze gotowi udzielić odpowiedzi każdemu, kto domaga się od was uzasadnienia waszej nadziei, z łagodnością i bojaźnią."
"1P3,16": "Miejcie czyste sumienie, aby za to, że mówią o was źle, jak o złoczyńcach, zostali zawstydzeni ci, którzy zniesławiają wasze dobre postępowanie w Chrystusie."
"1P3,17": "Lepiej bowiem – jeśli taka jest wola Boga – cierpieć, czyniąc dobrze, aniżeli czyniąc źle."
"1P3,18": "Gdyż i Chrystus raz za grzechy cierpiał, sprawiedliwy za niesprawiedliwych, aby nas przyprowadzić do Boga; uśmiercony w ciele, lecz ożywiony Duchem;"
"1P3,19": "W którym poszedł i głosił też duchom będącym w więzieniu;"
"1P3,20": "Niegdyś nieposłusznym, gdy za dni Noego raz oczekiwała Boża cierpliwość, kiedy budowano arkę, w której niewiele, to jest osiem dusz, zostało uratowanych przez wodę."
"1P3,21": "Teraz też chrzest, będąc tego odbiciem, zbawia nas – nie jest usunięciem cielesnego brudu, ale odpowiedzią czystego sumienia wobec Boga – przez zmartwychwstanie Jezusa Chrystusa;"
"1P3,22": "Który, poszedłszy do nieba, jest po prawicy Boga, a zostali mu poddani aniołowie, zwierzchności i moce."
