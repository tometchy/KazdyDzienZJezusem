"Rdz43,1":
  text: "A ciężki głód panował w tej ziemi."
  tags: []
"Rdz43,2":
  text: "I gdy zużyli zboże, które przynieśli z Egiptu, ich ojciec powiedział do nich: Idźcie znowu i kupcie nam trochę żywności."
  tags: []
"Rdz43,3":
  text: "Juda powiedział do niego: Ten człowiek uroczyście nam oświadczył: Nie zobaczycie mojej twarzy, jeśli nie będzie z wami waszego brata."
  tags: []
"Rdz43,4":
  text: "Jeśli więc poślesz naszego brata z nami, pojedziemy i nakupimy ci żywności;"
  tags: []
"Rdz43,5":
  text: "Ale jeśli nie poślesz, nie pojedziemy, bo ten człowiek mówił do nas: Nie zobaczycie mojej twarzy, jeśli nie będzie z wami waszego brata."
  tags: []
"Rdz43,6":
  text: "Izrael zapytał: Dlaczego sprawiliście mi ból, mówiąc temu człowiekowi, że macie jeszcze brata?"
  tags: []
"Rdz43,7":
  text: "Odpowiedzieli: Ten człowiek dokładnie się wypytał o nas i naszą rodzinę: Żyje jeszcze wasz ojciec? Macie jeszcze jakiegoś brata? I odpowiedzieliśmy mu na jego pytania. Skąd mogliśmy wiedzieć, że powie: Przyprowadźcie mi tu waszego brata?"
  tags: []
"Rdz43,8":
  text: "I Juda powiedział do swego ojca Izraela: Poślij chłopca ze mną. Powstaniemy i pojedziemy, abyśmy żyli, a nie pomarli z głodu, tak my, jak i ty, i nasze dzieci."
  tags: []
"Rdz43,9":
  text: "Ja biorę odpowiedzialność za niego, ode mnie się go domagaj. Jeśli nie przyprowadzę go do ciebie i nie stawię go przed tobą, na zawsze będę ponosił za to winę."
  tags: []
"Rdz43,10":
  text: "Gdybyśmy bowiem nie zwlekali, wrócilibyśmy już dwa razy."
  tags: []
"Rdz43,11":
  text: "Wtedy Izrael, ich ojciec, powiedział do nich: Jeśli tak musi być, zróbcie w ten sposób: weźcie z najlepszych owoców ziemi w wasze naczynia i zanieście je temu człowiekowi w darze – trochę balsamu, trochę miodu, wonności, mirry, orzechów i migdałów."
  tags: []
"Rdz43,12":
  text: "Weźcie też ze sobą podwójną sumę pieniędzy, a pieniądze wrzucone na wierzch waszych worów zabierzcie ze sobą, bo może to była pomyłka."
  tags: []
"Rdz43,13":
  text: "Weźcie także waszego brata, wstańcie i jedźcie znowu do tego człowieka;"
  tags: []
"Rdz43,14":
  text: "A niech Bóg Wszechmogący da wam miłosierdzie przed tym człowiekiem, aby wam wypuścił waszego drugiego brata i Beniamina. A jeśli mam stracić swoje dzieci, to je stracę."
  tags: []
"Rdz43,15":
  text: "Mężczyźni wzięli więc ten dar, zabrali ze sobą podwójną sumę pieniędzy oraz Beniamina, wstali i pojechali do Egiptu, i stanęli przed Józefem."
  tags: []
"Rdz43,16":
  text: "A gdy Józef zobaczył z nimi Beniamina, powiedział do zarządcy jego domu: Wprowadź tych ludzi do domu, zabij bydlę i przyrządź, bo ci ludzie w południe będą jedli ze mną."
  tags: []
"Rdz43,17":
  text: "Człowiek ten zrobił, jak mu Józef rozkazał, i wprowadził tych ludzi do domu Józefa."
  tags: []
"Rdz43,18":
  text: "Gdy zostali wprowadzeni do domu Józefa, bali się i mówili: Wprowadzono nas tu z powodu tych pieniędzy, które za pierwszym razem włożono do naszych worów, aby rzucić na nas oszczerstwo, napaść na nas i wziąć w niewolę nas i nasze osły."
  tags: []
"Rdz43,19":
  text: "Podeszli do zarządcy domu Józefa i rozmawiali z nim w drzwiach domu."
  tags: []
"Rdz43,20":
  text: "I powiedzieli: Pozwól, panie. Przyjechaliśmy za pierwszym razem kupić żywności."
  tags: []
"Rdz43,21":
  text: "A gdy przyjechaliśmy do gospody i rozwiązaliśmy nasze wory, pieniądze każdego były na wierzchu jego wora, nasze pieniądze w pełnej wadze. Przywieźliśmy je więc ze sobą."
  tags: []
"Rdz43,22":
  text: "Przywieźliśmy też inne pieniądze ze sobą, aby nakupić żywności. Nie wiemy, kto włożył nasze pieniądze do naszych worów."
  tags: []
"Rdz43,23":
  text: "A on powiedział: Pokój wam, nie bójcie się. Bóg wasz, Bóg waszego ojca, dał wam skarb do waszych worów. Wasze pieniądze doszły do mnie. I wyprowadził do nich Symeona."
  tags: []
"Rdz43,24":
  text: "Człowiek ten wprowadził tych ludzi do domu Józefa, dał im wody, aby umyli sobie nogi; dał też karmę ich osłom."
  tags: []
"Rdz43,25":
  text: "Potem przygotowali dar, zanim Józef przyszedł w południe. Słyszeli bowiem, że tam mieli jeść chleb."
  tags: []
"Rdz43,26":
  text: "A gdy Józef wszedł do domu, przynieśli mu dar, który mieli ze sobą w tym domu, i pokłonili mu się aż do ziemi."
  tags: []
"Rdz43,27":
  text: "I dowiadywał się, jak się im powodzi, i zapytał: Czy wasz ojciec jest zdrowy, ten starzec, o którym mi opowiadaliście? Czy jeszcze żyje?"
  tags: []
"Rdz43,28":
  text: "A oni odpowiedzieli: Twój sługa, nasz ojciec, jest zdrowy, jeszcze żyje. I uklękli, i pokłonili mu się."
  tags: []
"Rdz43,29":
  text: "Wtedy podniósł swe oczy i zobaczył swego brata Beniamina, syna swej matki, i zapytał: Czy to jest wasz najmłodszy brat, o którym mi opowiadaliście? I powiedział mu: Niech Bóg będzie ci miłosierny, miły synu."
  tags: []
"Rdz43,30":
  text: "I nagle Józef wyszedł, bo wzruszył się do głębi swym bratem, i szukał miejsca, gdzie mógłby zapłakać. Wszedł więc do komnaty i tam płakał."
  tags: []
"Rdz43,31":
  text: "Potem umył swoją twarz, wyszedł i gdy się opanował, powiedział: Kładźcie chleb."
  tags: []
"Rdz43,32":
  text: "Położono jemu osobno, im osobno i osobno Egipcjanom, którzy z nim jedli. Egipcjanie bowiem nie mogą jeść chleba z Hebrajczykami, gdyż to budzi odrazę u Egipcjan."
  tags: []
"Rdz43,33":
  text: "I usiedli przed nim, pierworodny według swego pierworództwa, a młodszy według swej młodości. I dziwili się ci mężczyźni, patrząc jeden na drugiego."
  tags: []
"Rdz43,34":
  text: "Potem brał potrawy sprzed siebie i kazał im zanieść. A porcja Beniamina była pięciokrotnie większa od porcji ich wszystkich. Pili i podpili sobie z nim."
  tags: []
