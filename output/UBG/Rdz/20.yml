"Rdz20,1":
  text: "Potem Abraham wyruszył stamtąd do ziemi południowej i zamieszkał między Kadesz a Szur, i był przybyszem w Gerarze."
  tags: []
"Rdz20,2":
  text: "Tam Abraham powiedział o swej żonie Sarze: Ona jest moją siostrą. Dlatego Abimelek, król Geraru, posłał po Sarę i wziął ją."
  tags: []
"Rdz20,3":
  text: "Lecz Bóg przyszedł do Abimeleka we śnie w nocy i powiedział mu: Umrzesz z powodu tej kobiety, którą wziąłeś, bo ona ma męża."
  tags: []
"Rdz20,4":
  text: "Ale Abimelek jeszcze nie zbliżył się do niej i powiedział: Panie, czy zabijesz też lud sprawiedliwy?"
  tags: []
"Rdz20,5":
  text: "Czy on sam nie mówił mi: Ona jest moją siostrą? I czy ona również nie mówiła: On jest moim bratem? Uczyniłem to w prostocie mego serca i z czystymi rękami."
  tags: []
"Rdz20,6":
  text: "Wtedy Bóg powiedział mu we śnie: Wiem, że uczyniłeś to w prostocie swego serca. Dlatego powstrzymałem cię, abyś nie zgrzeszył przeciwko mnie, i nie dopuściłem, abyś jej dotknął."
  tags: []
"Rdz20,7":
  text: "Teraz więc zwróć żonę mężowi, bo on jest prorokiem i będzie się modlił za ciebie, a będziesz żył. Jeśli jej nie zwrócisz, wiedz, że na pewno umrzesz, ty i wszystko, co jest twoje."
  tags: []
"Rdz20,8":
  text: "Abimelek wstał zatem wcześnie rano, zwołał wszystkie swoje sługi i do ich uszu opowiedział wszystko. Gdy ci mężczyźni to usłyszeli, bardzo się przestraszyli."
  tags: []
"Rdz20,9":
  text: "Potem Abimelek wezwał Abrahama i powiedział mu: Co nam uczyniłeś? W czym zgrzeszyłem przeciwko tobie, że sprowadziłeś na mnie i na moje królestwo tak wielki grzech? Postąpiłeś ze mną tak, jak nie należy postępować."
  tags: []
"Rdz20,10":
  text: "Abimelek zapytał jeszcze Abrahama: Co widziałeś, że tak postąpiłeś?"
  tags: []
"Rdz20,11":
  text: "Abraham odpowiedział: Bo myślałem – na pewno nie ma w tym miejscu bojaźni Bożej i zabiją mnie z powodu mojej żony."
  tags: []
"Rdz20,12":
  text: "Zresztą ona naprawdę jest moją siostrą, córką mego ojca, choć nie córką mojej matki. I została moją żoną."
  tags: []
"Rdz20,13":
  text: "Gdy więc Bóg wyprawił mnie na wędrówkę z domu mego ojca, powiedziałem do niej: Oto przysługa, jaką mi wyświadczysz – w każdym miejscu, do którego przyjdziemy, mów o mnie: To jest mój brat."
  tags: []
"Rdz20,14":
  text: "Wtedy Abimelek wziął owce i woły oraz służących i służące i dał Abrahamowi, i zwrócił mu jego żonę Sarę."
  tags: []
"Rdz20,15":
  text: "I Abimelek powiedział: Oto moja ziemia jest przed tobą. Zamieszkaj, gdzie ci się podoba."
  tags: []
"Rdz20,16":
  text: "A do Sary powiedział: Dałem twemu bratu tysiąc srebrników. Oto on jest zasłoną twoich oczu u wszystkich, którzy są z tobą, i u wszystkich innych. O tym Sara została pouczona."
  tags: []
"Rdz20,17":
  text: "Wtedy Abraham modlił się do Boga i Bóg uzdrowił Abimeleka, a także jego żonę i jego służące, i one rodziły."
  tags: []
"Rdz20,18":
  text: "PAN bowiem zamknął wszystkie łona domu Abimeleka z powodu Sary, żony Abrahama."
  tags: []
