"Rdz23,1":
  text: "A Sara dożyła stu dwudziestu siedmiu lat. Tyle było lat życia Sary."
  tags: []
"Rdz23,2":
  text: "Sara umarła w mieście Kiriat-Arba, czyli w Hebronie, w ziemi Kanaan. I Abraham przyszedł, aby odbyć żałobę po Sarze i opłakiwać ją."
  tags: []
"Rdz23,3":
  text: "Potem Abraham wstał od swej zmarłej i powiedział do synów Cheta:"
  tags: []
"Rdz23,4":
  text: "Jestem wśród was przybyszem i przychodniem. Dajcie mi na własność grób między wami, abym pogrzebał moją zmarłą sprzed mojego oblicza."
  tags: []
"Rdz23,5":
  text: "Synowie Cheta odpowiedzieli Abrahamowi:"
  tags: []
"Rdz23,6":
  text: "Słuchaj nas, mój panie: Jesteś księciem Boga wśród nas. Pochowaj swoją zmarłą w naszych najlepszych grobach. Nikt z nas nie odmówi ci swego grobu, abyś pochował swoją zmarłą."
  tags: []
"Rdz23,7":
  text: "Wtedy Abraham wstał, pokłonił się ludowi tej ziemi, czyli synom Cheta;"
  tags: []
"Rdz23,8":
  text: "I powiedział do nich: Jeśli zgadzacie się, abym pochował moją zmarłą sprzed mojego oblicza, posłuchajcie mnie i wstawcie się za mną do Efrona, syna Sochara;"
  tags: []
"Rdz23,9":
  text: "Aby mi ustąpił swą jaskinię Makpela, która znajduje się na końcu jego pola. Niech mi ją odda za odpowiednią cenę jako grób na własność wśród was."
  tags: []
"Rdz23,10":
  text: "A Efron siedział wśród synów Cheta. Odpowiedział więc Efron Chetyta Abrahamowi w obecności synów Cheta i wszystkich, którzy wchodzili w bramę jego miasta:"
  tags: []
"Rdz23,11":
  text: "Nie, panie mój, posłuchaj mnie. Daję ci to pole i jaskinię, która na nim jest. Daję ją tobie w obecności synów mego ludu. Pochowaj swoją zmarłą."
  tags: []
"Rdz23,12":
  text: "Wtedy Abraham pokłonił się przed ludem tej ziemi;"
  tags: []
"Rdz23,13":
  text: "I powiedział do Efrona w obecności ludu tej ziemi: Raczej jeśli się da, proszę, posłuchaj mnie. Dam ci pieniądze za pole, weź je ode mnie, a pochowam tam moją zmarłą."
  tags: []
"Rdz23,14":
  text: "Efron odpowiedział Abrahamowi:"
  tags: []
"Rdz23,15":
  text: "Mój panie, posłuchaj mnie. Ta ziemia jest warta czterysta syklów srebra, ale cóż to jest między mną a tobą? Pochowaj swoją zmarłą."
  tags: []
"Rdz23,16":
  text: "I Abraham wysłuchał Efrona. Odważył więc Abraham Efronowi srebro, które ten wymienił w obecności synów Cheta: czterysta syklów srebra, jakie były w obiegu u kupców."
  tags: []
"Rdz23,17":
  text: "Tak więc pole Efrona, które jest w Makpelu naprzeciw Mamre, pole i jaskinia, która na nim jest, i wszystkie drzewa, które były na polu i wkoło na wszystkich jego granicach, przeszły;"
  tags: []
"Rdz23,18":
  text: "Na własność Abrahama w obecności synów Cheta i wszystkich, którzy wchodzili w bramę tego miasta."
  tags: []
"Rdz23,19":
  text: "Potem Abraham pochował swoją żonę Sarę w jaskini pola w Makpelu naprzeciwko Mamre, czyli Hebronie, w ziemi Kanaan."
  tags: []
"Rdz23,20":
  text: "I zostały oddane Abrahamowi pole i jaskinia, która była na nim, jako grób na własność, przez synów Cheta."
  tags: []
