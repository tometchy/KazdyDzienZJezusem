"Rdz23,1": "A Sara dożyła stu dwudziestu siedmiu lat. Tyle było lat życia Sary."
"Rdz23,2": "Sara umarła w mieście Kiriat-Arba, czyli w Hebronie, w ziemi Kanaan. I Abraham przyszedł, aby odbyć żałobę po Sarze i opłakiwać ją."
"Rdz23,3": "Potem Abraham wstał od swej zmarłej i powiedział do synów Cheta:"
"Rdz23,4": "Jestem wśród was przybyszem i przychodniem. Dajcie mi na własność grób między wami, abym pogrzebał moją zmarłą sprzed mojego oblicza."
"Rdz23,5": "Synowie Cheta odpowiedzieli Abrahamowi:"
"Rdz23,6": "Słuchaj nas, mój panie: Jesteś księciem Boga wśród nas. Pochowaj swoją zmarłą w naszych najlepszych grobach. Nikt z nas nie odmówi ci swego grobu, abyś pochował swoją zmarłą."
"Rdz23,7": "Wtedy Abraham wstał, pokłonił się ludowi tej ziemi, czyli synom Cheta;"
"Rdz23,8": "I powiedział do nich: Jeśli zgadzacie się, abym pochował moją zmarłą sprzed mojego oblicza, posłuchajcie mnie i wstawcie się za mną do Efrona, syna Sochara;"
"Rdz23,9": "Aby mi ustąpił swą jaskinię Makpela, która znajduje się na końcu jego pola. Niech mi ją odda za odpowiednią cenę jako grób na własność wśród was."
"Rdz23,10": "A Efron siedział wśród synów Cheta. Odpowiedział więc Efron Chetyta Abrahamowi w obecności synów Cheta i wszystkich, którzy wchodzili w bramę jego miasta:"
"Rdz23,11": "Nie, panie mój, posłuchaj mnie. Daję ci to pole i jaskinię, która na nim jest. Daję ją tobie w obecności synów mego ludu. Pochowaj swoją zmarłą."
"Rdz23,12": "Wtedy Abraham pokłonił się przed ludem tej ziemi;"
"Rdz23,13": "I powiedział do Efrona w obecności ludu tej ziemi: Raczej jeśli się da, proszę, posłuchaj mnie. Dam ci pieniądze za pole, weź je ode mnie, a pochowam tam moją zmarłą."
"Rdz23,14": "Efron odpowiedział Abrahamowi:"
"Rdz23,15": "Mój panie, posłuchaj mnie. Ta ziemia jest warta czterysta syklów srebra, ale cóż to jest między mną a tobą? Pochowaj swoją zmarłą."
"Rdz23,16": "I Abraham wysłuchał Efrona. Odważył więc Abraham Efronowi srebro, które ten wymienił w obecności synów Cheta: czterysta syklów srebra, jakie były w obiegu u kupców."
"Rdz23,17": "Tak więc pole Efrona, które jest w Makpelu naprzeciw Mamre, pole i jaskinia, która na nim jest, i wszystkie drzewa, które były na polu i wkoło na wszystkich jego granicach, przeszły;"
"Rdz23,18": "Na własność Abrahama w obecności synów Cheta i wszystkich, którzy wchodzili w bramę tego miasta."
"Rdz23,19": "Potem Abraham pochował swoją żonę Sarę w jaskini pola w Makpelu naprzeciwko Mamre, czyli Hebronie, w ziemi Kanaan."
"Rdz23,20": "I zostały oddane Abrahamowi pole i jaskinia, która była na nim, jako grób na własność, przez synów Cheta."
