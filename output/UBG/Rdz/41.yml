"Rdz41,1":
  text: "Po upływie dwóch lat śniło się faraonowi, że stał nad rzeką."
  tags: []
"Rdz41,2":
  text: "A oto z rzeki wychodziło siedem pięknych i tłustych krów, które się pasły na łące."
  tags: []
"Rdz41,3":
  text: "Oto też za nimi wychodziło z rzeki siedem innych krów, brzydkich i chudych, które stanęły obok pierwszych krów nad brzegiem rzeki."
  tags: []
"Rdz41,4":
  text: "I te brzydkie i chude krowy pożarły siedem pięknych i tłustych krów. Wtedy faraon się obudził."
  tags: []
"Rdz41,5":
  text: "A gdy usnął, śnił po raz drugi. A oto siedem pełnych i cudnych kłosów wyrastało z jednego źdźbła."
  tags: []
"Rdz41,6":
  text: "Oto też siedem kłosów cienkich i wysuszonych od wiatru wschodniego wyrastało za nimi."
  tags: []
"Rdz41,7":
  text: "I te cienkie kłosy pożarły siedem pięknych i pełnych kłosów. Wtedy faraon się obudził, a był to sen."
  tags: []
"Rdz41,8":
  text: "A gdy nastał ranek, był zaniepokojony w duchu i kazał wezwać wszystkich wróżbitów i mędrców Egiptu. I opowiedział im faraon swoje sny, ale nie było nikogo, kto by potrafił je faraonowi wytłumaczyć."
  tags: []
"Rdz41,9":
  text: "Wtedy przełożony podczaszych powiedział do faraona: Przypominam sobie dziś moje grzechy."
  tags: []
"Rdz41,10":
  text: "Faraon rozgniewał się na swoje sługi i oddał mnie pod straż w domu dowódcy straży, mnie i przełożonego piekarzy."
  tags: []
"Rdz41,11":
  text: "Tam jednej nocy śnił się nam sen, mnie i jemu; każdemu śnił się sen według jego wytłumaczenia."
  tags: []
"Rdz41,12":
  text: "A był tam z nami młodzieniec, Hebrajczyk, sługa dowódcy straży, któremu opowiedzieliśmy nasze sny, a on wytłumaczył je nam, każdemu według jego snu."
  tags: []
"Rdz41,13":
  text: "I stało się tak, jak nam wytłumaczył: Mnie faraon przywrócił na moje miejsce, a tamtego powiesił."
  tags: []
"Rdz41,14":
  text: "Faraon kazał więc wezwać Józefa i prędko go wyprowadzono z więzienia. Ostrzygł się, zmienił szaty i przyszedł do faraona."
  tags: []
"Rdz41,15":
  text: "I faraon powiedział do Józefa: Śnił mi się sen, a nie ma nikogo, kto potrafi mi go wytłumaczyć. Ale słyszałem, jak mówiono o tobie, że gdy usłyszysz sen, umiesz go wytłumaczyć."
  tags: []
"Rdz41,16":
  text: "Józef odpowiedział faraonowi: To nie ja, ale Bóg da faraonowi szczęśliwą odpowiedź."
  tags: []
"Rdz41,17":
  text: "Faraon powiedział więc do Józefa: Oto w moim śnie stałem na brzegu rzeki."
  tags: []
"Rdz41,18":
  text: "A z rzeki wychodziło siedem tłustych i pięknych krów i pasły się na łące."
  tags: []
"Rdz41,19":
  text: "Za nimi zaś wychodziło siedem innych krów, nędznych, szpetnych i chudych; w całej ziemi Egiptu nie widziałem tak brzydkich."
  tags: []
"Rdz41,20":
  text: "I chude i szpetne krowy pożarły siedem pierwszych tłustych krów."
  tags: []
"Rdz41,21":
  text: "A choć je zjadły, nie było widać, że zjadły, ale były szpetne jak i przedtem. I obudziłem się."
  tags: []
"Rdz41,22":
  text: "Potem widziałem we śnie, jak oto siedem kłosów, pełnych i dorodnych, wyrastało z jednego źdźbła."
  tags: []
"Rdz41,23":
  text: "A za nimi wyrastało siedem kłosów suchych, cienkich i wyschniętych od wschodniego wiatru."
  tags: []
"Rdz41,24":
  text: "I te cienkie kłosy pożarły tych siedem dorodnych kłosów. I opowiedziałem to wróżbitom, ale nie było nikogo, kto by potrafił mi to wytłumaczyć."
  tags: []
"Rdz41,25":
  text: "Wtedy Józef powiedział do faraona: Sen faraona jest jeden – Bóg oznajmił faraonowi, co uczyni."
  tags: []
"Rdz41,26":
  text: "Siedem pięknych krów to siedem lat, a siedem dorodnych kłosów to też siedem lat. Jest to jeden sen."
  tags: []
"Rdz41,27":
  text: "Siedem zaś chudych i szpetnych krów, które wychodziły za nimi, to siedem lat; a siedem pustych kłosów i wyschniętych od wschodniego wiatru to będzie siedem lat głodu."
  tags: []
"Rdz41,28":
  text: "A oto, co powiedziałem faraonowi: Bóg ukazał faraonowi, co uczyni."
  tags: []
"Rdz41,29":
  text: "Nadchodzi siedem lat wielkiej obfitości w całej ziemi Egiptu."
  tags: []
"Rdz41,30":
  text: "A po nich nastąpi siedem lat głodu i cała obfitość ziemi Egiptu pójdzie w zapomnienie, i głód wytrawi ziemię;"
  tags: []
"Rdz41,31":
  text: "Tak że obfitość ziemi nie będzie znana z powodu przyszłego głodu, bo będzie bardzo ciężki."
  tags: []
"Rdz41,32":
  text: "A skoro sen śnił się faraonowi dwukrotnie, oznacza to, że ta rzecz jest postanowiona przez Boga i Bóg śpieszy ją wykonać."
  tags: []
"Rdz41,33":
  text: "Teraz więc niech faraon znajdzie roztropnego i mądrego człowieka i postawi go nad ziemią Egiptu."
  tags: []
"Rdz41,34":
  text: "Niech faraon tak postąpi i ustanowi urzędników nad ziemią, i zbierze piątą część plonów ziemi Egiptu przez te siedem lat obfitości."
  tags: []
"Rdz41,35":
  text: "Niech zbierają wszelką żywność w tych nadchodzących dobrych latach i zgromadzą zboża do dyspozycji faraona, i niech przechowują żywność w miastach."
  tags: []
"Rdz41,36":
  text: "Żywność ta będzie zapasem dla ziemi na te siedem lat głodu, które będą w ziemi Egiptu, aby ziemia nie niszczała od głodu."
  tags: []
"Rdz41,37":
  text: "I podobało się to faraonowi i wszystkim jego sługom."
  tags: []
"Rdz41,38":
  text: "Faraon zapytał więc swoje sługi: Czy znajdziemy człowieka mu podobnego, w którym jest Duch Boży?"
  tags: []
"Rdz41,39":
  text: "Potem faraon powiedział do Józefa: Skoro Bóg oznajmił ci to wszystko, nie ma żadnego tak rozumnego i mądrego jak ty."
  tags: []
"Rdz41,40":
  text: "Ty będziesz nad moim domem, a cały mój lud będzie postępować według rozkazu twoich ust. Tylko tronem będę większy od ciebie."
  tags: []
"Rdz41,41":
  text: "Faraon powiedział jeszcze do Józefa: Oto ustanowiłem cię nad całą ziemią Egiptu."
  tags: []
"Rdz41,42":
  text: "Zdjął więc faraon pierścień z ręki i włożył go na rękę Józefa, oblekł go też w szatę bisiorową, a na szyję włożył mu złoty łańcuch."
  tags: []
"Rdz41,43":
  text: "I kazał go wozić na swoim drugim rydwanie, i wołano przed nim: Na kolana! I ustanowił go rządcą całej ziemi Egiptu."
  tags: []
"Rdz41,44":
  text: "Potem faraon powiedział do Józefa: Ja jestem faraonem, a bez twego pozwolenia nikt na całej ziemi Egiptu nie podniesie ani ręki, ani nogi."
  tags: []
"Rdz41,45":
  text: "I faraon nadał Józefowi imię Safnat Paneach, i dał mu za żonę Asenat, córkę Poti-Fery, kapłana z On. I Józef wyjechał na całą ziemię Egiptu."
  tags: []
"Rdz41,46":
  text: "Józef miał trzydzieści lat, gdy stanął przed faraonem, królem Egiptu. Potem Józef odszedł od faraona i objechał całą ziemię Egiptu."
  tags: []
"Rdz41,47":
  text: "A przez tych siedem urodzajnych lat ziemia rodziła obficie."
  tags: []
"Rdz41,48":
  text: "I Józef zgromadził całą żywność tych siedmiu lat, która była w ziemi Egiptu, i składał żywność w miastach. Składał w miastach urodzajne plony z otaczających je pól."
  tags: []
"Rdz41,49":
  text: "Józef więc nagromadził zboża tak wiele jak piasku morskiego, aż przestano je liczyć, bo było go bez liku."
  tags: []
"Rdz41,50":
  text: "A zanim nastały lata głodu, Józefowi urodzili się dwaj synowie, których mu urodziła Asenat, córka Poti-Fery, kapłana z On."
  tags: []
"Rdz41,51":
  text: "Józef nadał pierworodnemu imię Manasses, gdyż mówił: Bóg dał mi zapomnieć o całej mojej udręce i o całym domu mego ojca."
  tags: []
"Rdz41,52":
  text: "A drugiemu nadał imię Efraim, gdyż mówił: Bóg rozmnożył mnie w ziemi mego utrapienia."
  tags: []
"Rdz41,53":
  text: "I skończyło się siedem lat obfitości, która była w ziemi Egiptu."
  tags: []
"Rdz41,54":
  text: "I nadeszło siedem lat głodu, tak jak Józef przepowiedział. I głód był we wszystkich krainach, ale w całej ziemi Egiptu był chleb."
  tags: []
"Rdz41,55":
  text: "Gdy jednak na całej ziemi Egiptu był głód, lud wołał do faraona o chleb. I faraon powiedział wszystkim Egipcjanom: Idźcie do Józefa, a co wam powie, zróbcie."
  tags: []
"Rdz41,56":
  text: "I na całej ziemi był głód. Józef otworzył więc wszystkie spichlerze, w których było zboże, i sprzedawał Egipcjanom, bo głód wzmógł się w ziemi Egiptu."
  tags: []
"Rdz41,57":
  text: "I ze wszystkich krajów przyjeżdżano do Egiptu, by kupować żywność od Józefa, bo wzmógł się głód na całej ziemi."
  tags: []
