"Rdz46,1":
  text: "Tak więc Izrael wyruszył w drogę ze wszystkim, co miał; a gdy przybył do Beer-Szeby, złożył ofiary Bogu swego ojca Izaaka."
  tags: []
"Rdz46,2":
  text: "Wtedy Bóg powiedział do Izraela w nocnym widzeniu: Jakubie, Jakubie! A on odpowiedział: Oto jestem."
  tags: []
"Rdz46,3":
  text: "I powiedział: Ja jestem Bogiem, Bogiem twego ojca. Nie bój się zejść do Egiptu, bo tam cię rozmnożę w wielki naród."
  tags: []
"Rdz46,4":
  text: "Pójdę z tobą do Egiptu i wyprowadzę cię stamtąd z powrotem, a Józef położy swoją rękę na twoje oczy."
  tags: []
"Rdz46,5":
  text: "I Jakub wyruszył z Beer-Szeby. I synowie Izraela wzięli swego ojca Jakuba, swoje dzieci i swe żony na wozy, które faraon posłał, aby go przywieziono."
  tags: []
"Rdz46,6":
  text: "Zebrali też swe stada i swój dobytek, który zdobyli w ziemi Kanaan, i przyjechali do Egiptu, Jakub i całe jego potomstwo razem z nim;"
  tags: []
"Rdz46,7":
  text: "Swych synów i synów swoich synów, swoje córki i córki swoich synów oraz całe swoje potomstwo prowadził ze sobą do Egiptu."
  tags: []
"Rdz46,8":
  text: "A to są imiona synów Izraela, którzy weszli do Egiptu – Jakub i jego synowie: pierworodny Jakuba, Ruben."
  tags: []
"Rdz46,9":
  text: "Synowie Rubena: Henoch, Pallu, Chesron i Karmi."
  tags: []
"Rdz46,10":
  text: "Synowie Symeona: Jemuel, Jamin, Ohad, Jakin, Sochar i Szaul, syn kobiety Kananejki."
  tags: []
"Rdz46,11":
  text: "Synowie Lewiego: Gerszon, Kehat i Merari."
  tags: []
"Rdz46,12":
  text: "Synowie Judy: Er, Onan, Szela, Peres i Zerach. Lecz Er i Onan umarli w ziemi Kanaan. A synami Peresa byli: Chesron i Chamul."
  tags: []
"Rdz46,13":
  text: "Synowie Issachara: Tola, Puwwa, Job i Szimron."
  tags: []
"Rdz46,14":
  text: "Synowie Zebulona: Sered, Elon i Jachleel."
  tags: []
"Rdz46,15":
  text: "A to są synowie Lei, których – jak i córkę Dinę, urodziła Jakubowi w Paddan-Aram. Wszystkich dusz jego synów i córek było trzydzieści trzy."
  tags: []
"Rdz46,16":
  text: "Synowie Gada: Sifion, Chaggi, Szuni, Esbon, Eri, Arodi i Areli."
  tags: []
"Rdz46,17":
  text: "Synowie Aszera: Jimna, Jiszwa, Jiszwi, Beria i siostra ich Serach. A synowie Berii: Cheber i Malkiel."
  tags: []
"Rdz46,18":
  text: "To są synowie Zilpy, którą Laban dał swej córce Lei, których ona urodziła Jakubowi – szesnaście dusz."
  tags: []
"Rdz46,19":
  text: "Synowie Racheli, żony Jakuba: Józef i Beniamin."
  tags: []
"Rdz46,20":
  text: "Józefowi zaś urodzili się w ziemi Egiptu Manasses i Efraim, których urodziła Asenat, córka Poti-Fery, kapłana z On."
  tags: []
"Rdz46,21":
  text: "Synowie Beniamina: Bela, Beker, Aszbel, Gera, Naaman, Echi, Rosz, Muppim, Chuppim i Ard."
  tags: []
"Rdz46,22":
  text: "To są synowie Racheli, którzy się urodzili Jakubowi. Wszystkich dusz – czternaście."
  tags: []
"Rdz46,23":
  text: "Synowie Dana: Chuszim."
  tags: []
"Rdz46,24":
  text: "Synowie Neftalego: Jachseel, Guni, Jeser i Szillem."
  tags: []
"Rdz46,25":
  text: "To są synowie Bilhy, którą Laban dał swej córce Racheli, i których urodziła Jakubowi. Wszystkich dusz – siedem."
  tags: []
"Rdz46,26":
  text: "Wszystkich, którzy przyszli z Jakubem do Egiptu, pochodzących z jego lędźwi, oprócz żon synów Jakuba, wszystkich dusz było sześćdziesiąt sześć."
  tags: []
"Rdz46,27":
  text: "A synów Józefa, którzy mu się urodzili w Egipcie, były dwie dusze. I tak wszystkich dusz z domu Jakuba, które weszły do Egiptu, było siedemdziesiąt."
  tags: []
"Rdz46,28":
  text: "I Jakub posłał przed sobą Judę do Józefa, aby go uprzedził, zanim przybędzie do Goszen. I przybyli do ziemi Goszen."
  tags: []
"Rdz46,29":
  text: "I Józef zaprzągł swój wóz, i wyjechał naprzeciw swemu ojcu Izraelowi do Goszen. A gdy go zobaczył, rzucił mu się na szyję i długo płakał na jego szyi."
  tags: []
"Rdz46,30":
  text: "Wtedy Izrael powiedział do Józefa: Mogę już umrzeć, skoro ujrzałem twoją twarz, że jeszcze żyjesz."
  tags: []
"Rdz46,31":
  text: "Józef powiedział do swoich braci i do domu swego ojca: Pójdę zawiadomić faraona i powiem mu: Moi bracia i dom mego ojca, którzy byli w ziemi Kanaan, przyjechali do mnie;"
  tags: []
"Rdz46,32":
  text: "A ci mężczyźni są pasterzami, bo zajmowali się hodowlą bydła. Przyprowadzili więc swoje owce i woły, i wszystko, co mieli."
  tags: []
"Rdz46,33":
  text: "A gdy wezwie was faraon i zapyta: Czym się zajmujecie?"
  tags: []
"Rdz46,34":
  text: "Odpowiecie: Twoi słudzy od swego dzieciństwa aż do dziś są pasterzami, my i nasi ojcowie. W ten sposób będziecie mogli mieszkać w ziemi Goszen, bo Egipcjanie brzydzą się każdym pasterzem."
  tags: []
