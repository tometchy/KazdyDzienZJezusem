"Rdz46,1": "Tak więc Izrael wyruszył w drogę ze wszystkim, co miał; a gdy przybył do Beer-Szeby, złożył ofiary Bogu swego ojca Izaaka."
"Rdz46,2": "Wtedy Bóg powiedział do Izraela w nocnym widzeniu: Jakubie, Jakubie! A on odpowiedział: Oto jestem."
"Rdz46,3": "I powiedział: Ja jestem Bogiem, Bogiem twego ojca. Nie bój się zejść do Egiptu, bo tam cię rozmnożę w wielki naród."
"Rdz46,4": "Pójdę z tobą do Egiptu i wyprowadzę cię stamtąd z powrotem, a Józef położy swoją rękę na twoje oczy."
"Rdz46,5": "I Jakub wyruszył z Beer-Szeby. I synowie Izraela wzięli swego ojca Jakuba, swoje dzieci i swe żony na wozy, które faraon posłał, aby go przywieziono."
"Rdz46,6": "Zebrali też swe stada i swój dobytek, który zdobyli w ziemi Kanaan, i przyjechali do Egiptu, Jakub i całe jego potomstwo razem z nim;"
"Rdz46,7": "Swych synów i synów swoich synów, swoje córki i córki swoich synów oraz całe swoje potomstwo prowadził ze sobą do Egiptu."
"Rdz46,8": "A to są imiona synów Izraela, którzy weszli do Egiptu – Jakub i jego synowie: pierworodny Jakuba, Ruben."
"Rdz46,9": "Synowie Rubena: Henoch, Pallu, Chesron i Karmi."
"Rdz46,10": "Synowie Symeona: Jemuel, Jamin, Ohad, Jakin, Sochar i Szaul, syn kobiety Kananejki."
"Rdz46,11": "Synowie Lewiego: Gerszon, Kehat i Merari."
"Rdz46,12": "Synowie Judy: Er, Onan, Szela, Peres i Zerach. Lecz Er i Onan umarli w ziemi Kanaan. A synami Peresa byli: Chesron i Chamul."
"Rdz46,13": "Synowie Issachara: Tola, Puwwa, Job i Szimron."
"Rdz46,14": "Synowie Zebulona: Sered, Elon i Jachleel."
"Rdz46,15": "A to są synowie Lei, których – jak i córkę Dinę, urodziła Jakubowi w Paddan-Aram. Wszystkich dusz jego synów i córek było trzydzieści trzy."
"Rdz46,16": "Synowie Gada: Sifion, Chaggi, Szuni, Esbon, Eri, Arodi i Areli."
"Rdz46,17": "Synowie Aszera: Jimna, Jiszwa, Jiszwi, Beria i siostra ich Serach. A synowie Berii: Cheber i Malkiel."
"Rdz46,18": "To są synowie Zilpy, którą Laban dał swej córce Lei, których ona urodziła Jakubowi – szesnaście dusz."
"Rdz46,19": "Synowie Racheli, żony Jakuba: Józef i Beniamin."
"Rdz46,20": "Józefowi zaś urodzili się w ziemi Egiptu Manasses i Efraim, których urodziła Asenat, córka Poti-Fery, kapłana z On."
"Rdz46,21": "Synowie Beniamina: Bela, Beker, Aszbel, Gera, Naaman, Echi, Rosz, Muppim, Chuppim i Ard."
"Rdz46,22": "To są synowie Racheli, którzy się urodzili Jakubowi. Wszystkich dusz – czternaście."
"Rdz46,23": "Synowie Dana: Chuszim."
"Rdz46,24": "Synowie Neftalego: Jachseel, Guni, Jeser i Szillem."
"Rdz46,25": "To są synowie Bilhy, którą Laban dał swej córce Racheli, i których urodziła Jakubowi. Wszystkich dusz – siedem."
"Rdz46,26": "Wszystkich, którzy przyszli z Jakubem do Egiptu, pochodzących z jego lędźwi, oprócz żon synów Jakuba, wszystkich dusz było sześćdziesiąt sześć."
"Rdz46,27": "A synów Józefa, którzy mu się urodzili w Egipcie, były dwie dusze. I tak wszystkich dusz z domu Jakuba, które weszły do Egiptu, było siedemdziesiąt."
"Rdz46,28": "I Jakub posłał przed sobą Judę do Józefa, aby go uprzedził, zanim przybędzie do Goszen. I przybyli do ziemi Goszen."
"Rdz46,29": "I Józef zaprzągł swój wóz, i wyjechał naprzeciw swemu ojcu Izraelowi do Goszen. A gdy go zobaczył, rzucił mu się na szyję i długo płakał na jego szyi."
"Rdz46,30": "Wtedy Izrael powiedział do Józefa: Mogę już umrzeć, skoro ujrzałem twoją twarz, że jeszcze żyjesz."
"Rdz46,31": "Józef powiedział do swoich braci i do domu swego ojca: Pójdę zawiadomić faraona i powiem mu: Moi bracia i dom mego ojca, którzy byli w ziemi Kanaan, przyjechali do mnie;"
"Rdz46,32": "A ci mężczyźni są pasterzami, bo zajmowali się hodowlą bydła. Przyprowadzili więc swoje owce i woły, i wszystko, co mieli."
"Rdz46,33": "A gdy wezwie was faraon i zapyta: Czym się zajmujecie?"
"Rdz46,34": "Odpowiecie: Twoi słudzy od swego dzieciństwa aż do dziś są pasterzami, my i nasi ojcowie. W ten sposób będziecie mogli mieszkać w ziemi Goszen, bo Egipcjanie brzydzą się każdym pasterzem."
