"Rdz48,1":
  text: "Gdy to się stało, dano znać Józefowi: Oto twój ojciec zachorował. Wziął więc ze sobą swoich dwóch synów, Manassesa i Efraima."
  tags: []
"Rdz48,2":
  text: "I powiedziano Jakubowi: Oto twój syn Józef idzie do ciebie. A Izrael zebrał siłę i usiadł na łożu."
  tags: []
"Rdz48,3":
  text: "Wtedy Jakub powiedział do Józefa: Bóg Wszechmogący ukazał mi się w Luz, w ziemi Kanaan, i błogosławił mi."
  tags: []
"Rdz48,4":
  text: "I powiedział do mnie: Oto ja uczynię cię płodnym i rozmnożę cię, i wywiodę z ciebie wielki lud. I dam tę ziemię twemu potomstwu po tobie w wieczne dziedzictwo."
  tags: []
"Rdz48,5":
  text: "Dlatego teraz twoi dwaj synowie, Efraim i Manasses, którzy urodzili ci się w ziemi Egiptu, zanim przyszedłem tu do ciebie do Egiptu, są moimi. Będą moi jak Ruben i Symeon."
  tags: []
"Rdz48,6":
  text: "Ale twoje dzieci, które spłodzisz po nich, będą twoje; będą zwane w swych posiadłościach imieniem swoich braci."
  tags: []
"Rdz48,7":
  text: "A gdy wracałem z Paddan, umarła mi Rachela w ziemi Kanaan, w drodze, gdy byłem jeszcze w niewielkiej odległości od Efraty, i pogrzebałem ją tam przy drodze do Efraty, czyli Betlejem."
  tags: []
"Rdz48,8":
  text: "A gdy Izrael zobaczył synów Józefa, zapytał: Czyi oni są?"
  tags: []
"Rdz48,9":
  text: "Józef odpowiedział swemu ojcu: To są moi synowie, których Bóg dał mi tutaj. A on powiedział: Proszę, przyprowadź ich do mnie, abym im błogosławił."
  tags: []
"Rdz48,10":
  text: "A oczy Izraela były tak słabe ze starości, że nie mógł widzieć. I przyprowadził ich do niego, a Jakub ich pocałował i uścisnął."
  tags: []
"Rdz48,11":
  text: "Potem Izrael powiedział do Józefa: Nie spodziewałem się, że będę jeszcze oglądał twoją twarz, a oto Bóg dał mi widzieć nawet twoje potomstwo."
  tags: []
"Rdz48,12":
  text: "Wtedy Józef odsunął ich od jego kolan i pokłonił się twarzą aż do ziemi."
  tags: []
"Rdz48,13":
  text: "Potem Józef wziął obydwu i postawił Efraima po swojej prawej ręce, czyli po lewej stronie Izraela; a Manassesa po swojej lewej ręce, czyli po prawej stronie Izraela, i przyprowadził ich do niego."
  tags: []
"Rdz48,14":
  text: "Izrael wyciągnął swoją prawą rękę, położył ją na głowę Efraima, który był młodszy, a swoją lewą rękę na głowę Manassesa, umyślnie pokładając swoje ręce, choć pierworodny był Manasses."
  tags: []
"Rdz48,15":
  text: "I błogosławił Józefowi, mówiąc: Bóg, przed którego obliczem chodzili moi ojcowie, Abraham i Izaak, Bóg, który mnie żywił od mej młodości aż do dziś;"
  tags: []
"Rdz48,16":
  text: "Anioł, który wybawił mnie ze wszelkiego zła, niech błogosławi tym chłopcom i niech będą nazywani od mego imienia i od imienia moich ojców, Abrahama i Izaaka, i niech się rozmnożą na ziemi."
  tags: []
"Rdz48,17":
  text: "A gdy Józef zobaczył, że jego ojciec położył swoją prawą rękę na głowę Efraima, nie podobało mu się to. Wziął więc rękę swego ojca, aby ją przenieść z głowy Efraima na głowę Manassesa."
  tags: []
"Rdz48,18":
  text: "I Józef powiedział do swego ojca: Nie tak, mój ojcze. Ten bowiem jest pierworodny, połóż swoją prawą rękę na jego głowę."
  tags: []
"Rdz48,19":
  text: "Ale jego ojciec wzbraniał się i powiedział: Wiem, mój synu, wiem. Ten też stanie się ludem i on też urośnie, ale jego młodszy brat go przewyższy, a z jego potomstwa wyjdzie mnóstwo narodów."
  tags: []
"Rdz48,20":
  text: "Błogosławił im więc tego dnia, mówiąc: Przez ciebie Izrael będzie błogosławił, mówiąc: Niech Bóg cię uczyni jak Efraim i jak Manasses. Tak wyróżnił Efraima przed Manassesem."
  tags: []
"Rdz48,21":
  text: "Potem Izrael powiedział do Józefa: Oto ja umieram, ale Bóg będzie z wami i przywróci was do ziemi waszych ojców."
  tags: []
"Rdz48,22":
  text: "Oto daję ci jedną część więcej niż twoim braciom, którą nabyłem moim mieczem i moim łukiem z ręki Amorytów."
  tags: []
