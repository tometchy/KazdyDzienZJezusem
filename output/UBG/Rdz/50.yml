"Rdz50,1": "Wtedy Józef przypadł do twarzy swego ojca i płakał nad nim, i całował go."
"Rdz50,2": "Potem Józef rozkazał swoim sługom, lekarzom, aby zabalsamowali jego ojca. I lekarze zabalsamowali Izraela."
"Rdz50,3": "I minęło czterdzieści dni, bo tyle trwa balsamowanie. Egipcjanie opłakiwali go przez siedemdziesiąt dni."
"Rdz50,4": "Po upływie dni żałoby Józef powiedział do domowników faraona: Jeśli znalazłem teraz łaskę w waszych oczach, powiedzcie, proszę, do uszu faraona:"
"Rdz50,5": "Mój ojciec zobowiązał mnie przysięgą i powiedział: Oto ja umieram. Pogrzebiesz mnie w moim grobie, który sobie wykopałem w ziemi Kanaan. Teraz, proszę, pozwól mi pojechać i pogrzebać mego ojca, a potem wrócę."
"Rdz50,6": "Faraon powiedział: Jedź i pogrzeb twego ojca, jak cię zobowiązał przysięgą."
"Rdz50,7": "Józef pojechał więc, aby pogrzebać swego ojca. Jechali też z nim wszyscy słudzy faraona, także starsi jego domu i wszyscy starsi ziemi Egiptu;"
"Rdz50,8": "I cały dom Józefa, jego bracia i dom jego ojca. Tylko swoje dzieci, swoje owce i swoje woły zostawili w ziemi Goszen."
"Rdz50,9": "Wyruszyły też z nimi wozy i wyruszyli jeźdźcy. A orszak był bardzo wielki."
"Rdz50,10": "I przyjechali aż do klepiska Atad, które jest za Jordanem, i tam opłakiwali go wielkim i bardzo głębokim lamentem. Józef przez siedem dni obchodził żałobę po swym ojcu."
"Rdz50,11": "A gdy obywatele ziemi Kanaan zobaczyli tę żałobę na klepisku Atad, mówili: To ciężka żałoba Egipcjan. Dlatego nazwano to miejsce Ebel-Misraim; leży ono za Jordanem."
"Rdz50,12": "Jego synowie uczynili więc z nim tak, jak im rozkazał."
"Rdz50,13": "Jego synowie zawieźli go do ziemi Kanaan i pogrzebali go w jaskini na polu Makpela naprzeciwko Mamre, którą kupił Abraham wraz z polem od Efrona Chetyty jako grób na własność."
"Rdz50,14": "Po pogrzebie swego ojca Józef wrócił do Egiptu wraz ze swymi braćmi i ze wszystkimi, którzy pojechali z nim na pogrzeb jego ojca."
"Rdz50,15": "A bracia Józefa, widząc, że ich ojciec umarł, mówili: Może Józef będzie nas nienawidził i odpłaci nam sowicie za to wszystko zło, które mu uczyniliśmy."
"Rdz50,16": "Kazali więc powiedzieć do Józefa: Twój ojciec, zanim umarł, nakazał:"
"Rdz50,17": "Tak powiedzcie Józefowi: Proszę, wybacz teraz przestępstwo twoich braci i ich grzech, że wyrządzili ci zło. Proszę, wybacz teraz występek sługom Boga twego ojca. I Józef płakał, gdy to mówili do niego."
"Rdz50,18": "I jego bracia podeszli, i upadli przed nim, mówiąc: Oto jesteśmy twoimi sługami."
"Rdz50,19": "Józef powiedział do nich: Nie bójcie się. Czyż ja jestem na miejscu Boga?"
"Rdz50,20": "Obmyśliliście zło przeciwko mnie, ale Bóg obrócił to w dobro, żeby sprawić to, co się dziś dzieje, aby zachować tak wielki lud."
"Rdz50,21": "Teraz więc nie bójcie się. Ja będę żywić was i wasze dzieci. I tak ich pocieszał, i serdecznie z nimi rozmawiał."
"Rdz50,22": "I Józef mieszkał w Egipcie, on sam i dom jego ojca. A Józef żył sto dziesięć lat."
"Rdz50,23": "Józef oglądał synów Efraima aż do trzeciego pokolenia. Także synowie Makira, syna Manassesa, wychowali się na kolanach Józefa."
"Rdz50,24": "Potem Józef powiedział do swoich braci: Ja umrę, ale Bóg na pewno was nawiedzi i wyprowadzi z tej ziemi do ziemi, którą przysiągł Abrahamowi, Izaakowi i Jakubowi."
"Rdz50,25": "Józef zobowiązał więc przysięgą synów Izraela i powiedział: Bóg na pewno was nawiedzi, a wtedy zabierzcie stąd moje kości."
"Rdz50,26": "I Józef umarł, mając sto dziesięć lat. Zabalsamowano go i złożono do trumny w Egipcie."
