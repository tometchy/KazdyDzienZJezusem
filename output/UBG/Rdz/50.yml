"Rdz50,1":
  text: "Wtedy Józef przypadł do twarzy swego ojca i płakał nad nim, i całował go."
  tags: []
"Rdz50,2":
  text: "Potem Józef rozkazał swoim sługom, lekarzom, aby zabalsamowali jego ojca. I lekarze zabalsamowali Izraela."
  tags: []
"Rdz50,3":
  text: "I minęło czterdzieści dni, bo tyle trwa balsamowanie. Egipcjanie opłakiwali go przez siedemdziesiąt dni."
  tags: []
"Rdz50,4":
  text: "Po upływie dni żałoby Józef powiedział do domowników faraona: Jeśli znalazłem teraz łaskę w waszych oczach, powiedzcie, proszę, do uszu faraona:"
  tags: []
"Rdz50,5":
  text: "Mój ojciec zobowiązał mnie przysięgą i powiedział: Oto ja umieram. Pogrzebiesz mnie w moim grobie, który sobie wykopałem w ziemi Kanaan. Teraz, proszę, pozwól mi pojechać i pogrzebać mego ojca, a potem wrócę."
  tags: []
"Rdz50,6":
  text: "Faraon powiedział: Jedź i pogrzeb twego ojca, jak cię zobowiązał przysięgą."
  tags: []
"Rdz50,7":
  text: "Józef pojechał więc, aby pogrzebać swego ojca. Jechali też z nim wszyscy słudzy faraona, także starsi jego domu i wszyscy starsi ziemi Egiptu;"
  tags: []
"Rdz50,8":
  text: "I cały dom Józefa, jego bracia i dom jego ojca. Tylko swoje dzieci, swoje owce i swoje woły zostawili w ziemi Goszen."
  tags: []
"Rdz50,9":
  text: "Wyruszyły też z nimi wozy i wyruszyli jeźdźcy. A orszak był bardzo wielki."
  tags: []
"Rdz50,10":
  text: "I przyjechali aż do klepiska Atad, które jest za Jordanem, i tam opłakiwali go wielkim i bardzo głębokim lamentem. Józef przez siedem dni obchodził żałobę po swym ojcu."
  tags: []
"Rdz50,11":
  text: "A gdy obywatele ziemi Kanaan zobaczyli tę żałobę na klepisku Atad, mówili: To ciężka żałoba Egipcjan. Dlatego nazwano to miejsce Ebel-Misraim; leży ono za Jordanem."
  tags: []
"Rdz50,12":
  text: "Jego synowie uczynili więc z nim tak, jak im rozkazał."
  tags: []
"Rdz50,13":
  text: "Jego synowie zawieźli go do ziemi Kanaan i pogrzebali go w jaskini na polu Makpela naprzeciwko Mamre, którą kupił Abraham wraz z polem od Efrona Chetyty jako grób na własność."
  tags: []
"Rdz50,14":
  text: "Po pogrzebie swego ojca Józef wrócił do Egiptu wraz ze swymi braćmi i ze wszystkimi, którzy pojechali z nim na pogrzeb jego ojca."
  tags: []
"Rdz50,15":
  text: "A bracia Józefa, widząc, że ich ojciec umarł, mówili: Może Józef będzie nas nienawidził i odpłaci nam sowicie za to wszystko zło, które mu uczyniliśmy."
  tags: []
"Rdz50,16":
  text: "Kazali więc powiedzieć do Józefa: Twój ojciec, zanim umarł, nakazał:"
  tags: []
"Rdz50,17":
  text: "Tak powiedzcie Józefowi: Proszę, wybacz teraz przestępstwo twoich braci i ich grzech, że wyrządzili ci zło. Proszę, wybacz teraz występek sługom Boga twego ojca. I Józef płakał, gdy to mówili do niego."
  tags: []
"Rdz50,18":
  text: "I jego bracia podeszli, i upadli przed nim, mówiąc: Oto jesteśmy twoimi sługami."
  tags: []
"Rdz50,19":
  text: "Józef powiedział do nich: Nie bójcie się. Czyż ja jestem na miejscu Boga?"
  tags: []
"Rdz50,20":
  text: "Obmyśliliście zło przeciwko mnie, ale Bóg obrócił to w dobro, żeby sprawić to, co się dziś dzieje, aby zachować tak wielki lud."
  tags: []
"Rdz50,21":
  text: "Teraz więc nie bójcie się. Ja będę żywić was i wasze dzieci. I tak ich pocieszał, i serdecznie z nimi rozmawiał."
  tags: []
"Rdz50,22":
  text: "I Józef mieszkał w Egipcie, on sam i dom jego ojca. A Józef żył sto dziesięć lat."
  tags: []
"Rdz50,23":
  text: "Józef oglądał synów Efraima aż do trzeciego pokolenia. Także synowie Makira, syna Manassesa, wychowali się na kolanach Józefa."
  tags: []
"Rdz50,24":
  text: "Potem Józef powiedział do swoich braci: Ja umrę, ale Bóg na pewno was nawiedzi i wyprowadzi z tej ziemi do ziemi, którą przysiągł Abrahamowi, Izaakowi i Jakubowi."
  tags: []
"Rdz50,25":
  text: "Józef zobowiązał więc przysięgą synów Izraela i powiedział: Bóg na pewno was nawiedzi, a wtedy zabierzcie stąd moje kości."
  tags: []
"Rdz50,26":
  text: "I Józef umarł, mając sto dziesięć lat. Zabalsamowano go i złożono do trumny w Egipcie."
  tags: []
