"Rdz29,1":
  text: "Wtedy Jakub wyruszył w drogę i poszedł do ziemi ludów Wschodu."
  tags: []
"Rdz29,2":
  text: "I spojrzał, a oto w polu studnia i trzy stada owiec leżących przy niej. Z tej studni pojono bowiem stada, a wielki kamień przykrywał wierzch tej studni."
  tags: []
"Rdz29,3":
  text: "A gdy schodziły się wszystkie stada, odsuwano kamień z wierzchu studni i pojono owce. Potem znów zasuwano kamień na wierzch studni na jego miejsce."
  tags: []
"Rdz29,4":
  text: "Jakub zapytał ich: Moi bracia, skąd jesteście? I odpowiedzieli: Jesteśmy z Charanu."
  tags: []
"Rdz29,5":
  text: "Zapytał ich: Czy znacie Labana, syna Nachora? Odpowiedzieli: Znamy."
  tags: []
"Rdz29,6":
  text: "Potem zapytał: Czy dobrze się miewa? A oni odpowiedzieli: Dobrze. Oto właśnie jego córka Rachela nadchodzi ze stadem."
  tags: []
"Rdz29,7":
  text: "Wtedy powiedział: Oto jeszcze jest jasny dzień i nie czas zganiać stada. Napójcie owce i idźcie, popaście je."
  tags: []
"Rdz29,8":
  text: "Oni odpowiedzieli: Nie możemy, dopóki nie zbiorą się wszystkie stada i nie odsuną kamienia z wierzchu studni. Wtedy napoimy stada."
  tags: []
"Rdz29,9":
  text: "A gdy jeszcze tak z nimi rozmawiał, nadeszła Rachela z owcami swego ojca, bo je pasła."
  tags: []
"Rdz29,10":
  text: "I gdy Jakub ujrzał Rachelę, córkę Labana, brata swej matki, z owcami Labana, brata swej matki, podszedł, odsunął kamień z wierzchu studni i napoił owce Labana, brata swojej matki."
  tags: []
"Rdz29,11":
  text: "Potem Jakub pocałował Rachelę i głośno zapłakał."
  tags: []
"Rdz29,12":
  text: "I Jakub powiedział Racheli, że jest bratem jej ojca i że jest synem Rebeki. Ona pobiegła więc i oznajmiła to swemu ojcu."
  tags: []
"Rdz29,13":
  text: "A gdy Laban usłyszał wieść o Jakubie, synu swojej siostry, wybiegł mu naprzeciw, objął go, ucałował i zaprowadził do swego domu. A on opowiedział Labanowi o wszystkim."
  tags: []
"Rdz29,14":
  text: "Wtedy Laban powiedział mu: Ty naprawdę jesteś z moich kości i z mojego ciała. I Jakub mieszkał u niego przez cały miesiąc."
  tags: []
"Rdz29,15":
  text: "Potem Laban powiedział do Jakuba: Czyż dlatego, że jesteś moim bratem, będziesz mi służyć za darmo? Powiedz mi, jaka ma być twoja zapłata."
  tags: []
"Rdz29,16":
  text: "A Laban miał dwie córki: starsza miała na imię Lea, młodsza zaś Rachela."
  tags: []
"Rdz29,17":
  text: "Lea miała czułe oczy, Rachela zaś była piękna i miła dla oka."
  tags: []
"Rdz29,18":
  text: "Jakub kochał Rachelę i powiedział: Będę ci służył siedem lat za twoją młodszą córkę Rachelę."
  tags: []
"Rdz29,19":
  text: "Laban odpowiedział: Lepiej mi ją dać tobie niż innemu mężczyźnie. Zamieszkaj ze mną."
  tags: []
"Rdz29,20":
  text: "I Jakub służył za Rachelę siedem lat, które wydawały mu się jak kilka dni, bo ją kochał."
  tags: []
"Rdz29,21":
  text: "Potem Jakub powiedział do Labana: Daj mi moją żonę, bo wypełniły się moje dni, abym z nią obcował."
  tags: []
"Rdz29,22":
  text: "Wtedy Laban zebrał wszystkich mężczyzn tego miejsca i wyprawił ucztę."
  tags: []
"Rdz29,23":
  text: "A gdy nastał wieczór, wziął swoją córkę Leę i wprowadził ją do Jakuba, a on obcował z nią."
  tags: []
"Rdz29,24":
  text: "Laban dał też swoją służącą Zilpę swej córce Lei za służącą."
  tags: []
"Rdz29,25":
  text: "Rano okazało się, że to była Lea. Powiedział więc do Labana: Cóż mi zrobiłeś? Czy nie za Rachelę ci służyłem? Dlaczego mnie oszukałeś?"
  tags: []
"Rdz29,26":
  text: "Laban odpowiedział: Nie ma u nas zwyczaju, aby młodszą wydawać za mąż przed starszą."
  tags: []
"Rdz29,27":
  text: "Dopełnij jej tydzień, a dam ci i tę za służbę, którą mi odsłużysz drugie siedem lat."
  tags: []
"Rdz29,28":
  text: "I Jakub tak zrobił, i dopełnił jej tydzień. Potem Laban dał mu swoją córkę Rachelę za żonę."
  tags: []
"Rdz29,29":
  text: "Laban dał też swoją służącą Bilhę swej córce Racheli za służącą."
  tags: []
"Rdz29,30":
  text: "Wtedy Jakub obcował też z Rachelą i kochał Rachelę bardziej niż Leę, i służył mu jeszcze drugie siedem lat."
  tags: []
"Rdz29,31":
  text: "A gdy PAN widział, że Lea była znienawidzona, otworzył jej łono. Rachela zaś była bezpłodna."
  tags: []
"Rdz29,32":
  text: "Lea poczęła więc i urodziła syna, i nadała mu imię Ruben. Powiedziała bowiem: PAN naprawdę wejrzał na moje utrapienie. Dlatego teraz mój mąż będzie mnie kochać."
  tags: []
"Rdz29,33":
  text: "Gdy znów poczęła i urodziła syna, powiedziała: PAN usłyszał, że byłam znienawidzona. Dlatego dał mi także tego syna. I nadała mu imię Symeon."
  tags: []
"Rdz29,34":
  text: "Potem znów poczęła i urodziła syna, i powiedziała: Tym razem mój mąż przywiąże się do mnie, bo urodziłam mu trzech synów. Dlatego nadała mu imię Lewi."
  tags: []
"Rdz29,35":
  text: "Gdy jeszcze raz poczęła i urodziła syna, powiedziała: Teraz już będę chwalić PANA. Dlatego nadała mu imię Juda. I przestała rodzić."
  tags: []
