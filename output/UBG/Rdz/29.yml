"Rdz29,1": "Wtedy Jakub wyruszył w drogę i poszedł do ziemi ludów Wschodu."
"Rdz29,2": "I spojrzał, a oto w polu studnia i trzy stada owiec leżących przy niej. Z tej studni pojono bowiem stada, a wielki kamień przykrywał wierzch tej studni."
"Rdz29,3": "A gdy schodziły się wszystkie stada, odsuwano kamień z wierzchu studni i pojono owce. Potem znów zasuwano kamień na wierzch studni na jego miejsce."
"Rdz29,4": "Jakub zapytał ich: Moi bracia, skąd jesteście? I odpowiedzieli: Jesteśmy z Charanu."
"Rdz29,5": "Zapytał ich: Czy znacie Labana, syna Nachora? Odpowiedzieli: Znamy."
"Rdz29,6": "Potem zapytał: Czy dobrze się miewa? A oni odpowiedzieli: Dobrze. Oto właśnie jego córka Rachela nadchodzi ze stadem."
"Rdz29,7": "Wtedy powiedział: Oto jeszcze jest jasny dzień i nie czas zganiać stada. Napójcie owce i idźcie, popaście je."
"Rdz29,8": "Oni odpowiedzieli: Nie możemy, dopóki nie zbiorą się wszystkie stada i nie odsuną kamienia z wierzchu studni. Wtedy napoimy stada."
"Rdz29,9": "A gdy jeszcze tak z nimi rozmawiał, nadeszła Rachela z owcami swego ojca, bo je pasła."
"Rdz29,10": "I gdy Jakub ujrzał Rachelę, córkę Labana, brata swej matki, z owcami Labana, brata swej matki, podszedł, odsunął kamień z wierzchu studni i napoił owce Labana, brata swojej matki."
"Rdz29,11": "Potem Jakub pocałował Rachelę i głośno zapłakał."
"Rdz29,12": "I Jakub powiedział Racheli, że jest bratem jej ojca i że jest synem Rebeki. Ona pobiegła więc i oznajmiła to swemu ojcu."
"Rdz29,13": "A gdy Laban usłyszał wieść o Jakubie, synu swojej siostry, wybiegł mu naprzeciw, objął go, ucałował i zaprowadził do swego domu. A on opowiedział Labanowi o wszystkim."
"Rdz29,14": "Wtedy Laban powiedział mu: Ty naprawdę jesteś z moich kości i z mojego ciała. I Jakub mieszkał u niego przez cały miesiąc."
"Rdz29,15": "Potem Laban powiedział do Jakuba: Czyż dlatego, że jesteś moim bratem, będziesz mi służyć za darmo? Powiedz mi, jaka ma być twoja zapłata."
"Rdz29,16": "A Laban miał dwie córki: starsza miała na imię Lea, młodsza zaś Rachela."
"Rdz29,17": "Lea miała czułe oczy, Rachela zaś była piękna i miła dla oka."
"Rdz29,18": "Jakub kochał Rachelę i powiedział: Będę ci służył siedem lat za twoją młodszą córkę Rachelę."
"Rdz29,19": "Laban odpowiedział: Lepiej mi ją dać tobie niż innemu mężczyźnie. Zamieszkaj ze mną."
"Rdz29,20": "I Jakub służył za Rachelę siedem lat, które wydawały mu się jak kilka dni, bo ją kochał."
"Rdz29,21": "Potem Jakub powiedział do Labana: Daj mi moją żonę, bo wypełniły się moje dni, abym z nią obcował."
"Rdz29,22": "Wtedy Laban zebrał wszystkich mężczyzn tego miejsca i wyprawił ucztę."
"Rdz29,23": "A gdy nastał wieczór, wziął swoją córkę Leę i wprowadził ją do Jakuba, a on obcował z nią."
"Rdz29,24": "Laban dał też swoją służącą Zilpę swej córce Lei za służącą."
"Rdz29,25": "Rano okazało się, że to była Lea. Powiedział więc do Labana: Cóż mi zrobiłeś? Czy nie za Rachelę ci służyłem? Dlaczego mnie oszukałeś?"
"Rdz29,26": "Laban odpowiedział: Nie ma u nas zwyczaju, aby młodszą wydawać za mąż przed starszą."
"Rdz29,27": "Dopełnij jej tydzień, a dam ci i tę za służbę, którą mi odsłużysz drugie siedem lat."
"Rdz29,28": "I Jakub tak zrobił, i dopełnił jej tydzień. Potem Laban dał mu swoją córkę Rachelę za żonę."
"Rdz29,29": "Laban dał też swoją służącą Bilhę swej córce Racheli za służącą."
"Rdz29,30": "Wtedy Jakub obcował też z Rachelą i kochał Rachelę bardziej niż Leę, i służył mu jeszcze drugie siedem lat."
"Rdz29,31": "A gdy PAN widział, że Lea była znienawidzona, otworzył jej łono. Rachela zaś była bezpłodna."
"Rdz29,32": "Lea poczęła więc i urodziła syna, i nadała mu imię Ruben. Powiedziała bowiem: PAN naprawdę wejrzał na moje utrapienie. Dlatego teraz mój mąż będzie mnie kochać."
"Rdz29,33": "Gdy znów poczęła i urodziła syna, powiedziała: PAN usłyszał, że byłam znienawidzona. Dlatego dał mi także tego syna. I nadała mu imię Symeon."
"Rdz29,34": "Potem znów poczęła i urodziła syna, i powiedziała: Tym razem mój mąż przywiąże się do mnie, bo urodziłam mu trzech synów. Dlatego nadała mu imię Lewi."
"Rdz29,35": "Gdy jeszcze raz poczęła i urodziła syna, powiedziała: Teraz już będę chwalić PANA. Dlatego nadała mu imię Juda. I przestała rodzić."
