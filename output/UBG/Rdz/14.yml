"Rdz14,1":
  text: "Za dni Amrafela, króla Szinearu, Arioka, króla Ellasaru, Kedorlaomera, króla Elamu i Tidala, króla narodów;"
  tags: []
"Rdz14,2":
  text: "Prowadzili wojnę z Berą, królem Sodomy, z Birszą, królem Gomory, z Szinabem, królem Admy, z Szemeberem, królem Seboim, i z królem miasta Beli, czyli Soaru."
  tags: []
"Rdz14,3":
  text: "Wszyscy oni połączyli się w dolinie Siddim, gdzie dziś jest Morze Słone."
  tags: []
"Rdz14,4":
  text: "Dwanaście lat służyli Kedorlaomerowi, a w trzynastym roku zbuntowali się."
  tags: []
"Rdz14,5":
  text: "I tak w roku czternastym nadciągnął Kedorlaomer z królami, którzy z nim byli, i pobił Rafaitów w Asztarot-Karnaim, Zuzytów w Ham, Emitów w Szawe-Kiriataim;"
  tags: []
"Rdz14,6":
  text: "I Chorytów na ich górze Seir aż do równiny Paran, która jest przy pustyni."
  tags: []
"Rdz14,7":
  text: "Potem zawrócili i przybyli do En-Miszpat, czyli Kadesz, i wybili całą krainę Amalekitów, a także Amorytów mieszkających w Chasason-Tamar."
  tags: []
"Rdz14,8":
  text: "Wtedy wyruszyli król Sodomy oraz król Gomory, król Admy, król Seboim i król Beli, czyli Soaru, i ustawili się do bitwy z nimi w dolinie Siddim."
  tags: []
"Rdz14,9":
  text: "Z Kedorlaomerem, królem Elamu, Tidalem, królem narodów, Amrafelem, królem Szinearu i Ariokiem, królem Ellasaru – czterech królów przeciw pięciu."
  tags: []
"Rdz14,10":
  text: "A dolina Siddim była pełna dołów ze smołą. Gdy uciekali królowie Sodomy i Gomory, wpadli tam, a pozostali uciekli na górę."
  tags: []
"Rdz14,11":
  text: "A tamci zabrali wszelkie mienie Sodomy i Gomory oraz całą ich żywność i odeszli."
  tags: []
"Rdz14,12":
  text: "Zabrali też Lota, bratanka Abrama, wraz z jego mieniem i odeszli. Mieszkał on bowiem w Sodomie."
  tags: []
"Rdz14,13":
  text: "I przyszedł jeden zbieg, i oznajmił to Abramowi Hebrajczykowi, który mieszkał na równinach Mamrego Amoryty, brata Eszkola i Anera. Oni bowiem byli sprzymierzeni z Abramem."
  tags: []
"Rdz14,14":
  text: "Gdy Abram usłyszał, że jego brat został pojmany, wyprawił swoich trzystu osiemnastu wyszkolonych sług, urodzonych w jego domu, i ścigał ich aż do Dan."
  tags: []
"Rdz14,15":
  text: "W nocy podzielili się, on i jego słudzy, napadli na nich i pobili ich. Potem ścigali ich aż do Choby, która leży po lewej stronie Damaszku."
  tags: []
"Rdz14,16":
  text: "Odzyskał całe mienie i odbił swego brata Lota wraz z jego mieniem, a także kobiety i ludzi."
  tags: []
"Rdz14,17":
  text: "Gdy wracał po pobiciu Kedorlaomera i królów, którzy z nim byli, król Sodomy wyszedł mu na spotkanie w dolinie Szawe, czyli w dolinie królewskiej."
  tags: []
"Rdz14,18":
  text: "A Melchisedek, król Salemu, wyniósł chleb i wino. Był on kapłanem Boga Najwyższego."
  tags: []
"Rdz14,19":
  text: "I błogosławił mu, mówiąc: Niech będzie błogosławiony Abram przez Boga Najwyższego, właściciela nieba i ziemi."
  tags: []
"Rdz14,20":
  text: "I niech będzie błogosławiony Bóg Najwyższy, który wydał twoich wrogów w twoje ręce. I Abram dał mu dziesięcinę ze wszystkiego."
  tags: []
"Rdz14,21":
  text: "A król Sodomy powiedział do Abrama: Oddaj mi ludzi, a mienie weź dla siebie."
  tags: []
"Rdz14,22":
  text: "Lecz Abram odpowiedział królowi Sodomy: Podniosłem swą rękę do PANA Boga Najwyższego, właściciela nieba i ziemi;"
  tags: []
"Rdz14,23":
  text: "Że nie wezmę najmniejszej nitki ani rzemyka od obuwia, ani niczego, co należy do ciebie, abyś nie powiedział: Ja wzbogaciłem Abrama."
  tags: []
"Rdz14,24":
  text: "Tylko to, co moi słudzy zjedli, oraz przydział mężczyzn, którzy poszli ze mną: Anera, Eszkola i Mamrego; niech oni wezmą swój przydział."
  tags: []
