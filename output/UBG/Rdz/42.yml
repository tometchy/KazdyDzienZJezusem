"Rdz42,1":
  text: "Gdy Jakub dowiedział się, że w Egipcie jest zboże, powiedział do swoich synów: Czemu się patrzycie jeden na drugiego?"
  tags: []
"Rdz42,2":
  text: "I mówił im: Oto słyszałem, że w Egipcie jest zboże. Jedźcie tam i kupcie je nam stamtąd, abyśmy żyli, a nie pomarli."
  tags: []
"Rdz42,3":
  text: "Dziesięciu braci Józefa wyruszyło więc do Egiptu, aby kupić zboże."
  tags: []
"Rdz42,4":
  text: "Ale Jakub nie posłał Beniamina, brata Józefa, z jego braćmi, bo powiedział: By nie spotkało go jakieś nieszczęście."
  tags: []
"Rdz42,5":
  text: "Synowie Izraela przybyli więc wraz z innymi, aby kupić zboże, gdyż był głód w ziemi Kanaan."
  tags: []
"Rdz42,6":
  text: "A Józef był rządcą tej ziemi i to on sprzedawał zboża całej ludności tej ziemi. A gdy przyszli bracia Józefa, pokłonili mu się twarzą do ziemi."
  tags: []
"Rdz42,7":
  text: "Gdy Józef ujrzał swych braci, poznał ich, lecz udawał przed nimi obcego i rozmawiał z nimi surowo. Zapytał ich: Skąd przyszliście? Odpowiedzieli: Z ziemi Kanaan, aby nakupić żywności."
  tags: []
"Rdz42,8":
  text: "Józef rozpoznał swoich braci, ale oni go nie poznali."
  tags: []
"Rdz42,9":
  text: "I Józef przypomniał sobie sny, które mu się śniły o nich, i powiedział im: Jesteście szpiegami i przyszliście, aby wypatrzyć nieobronne miejsca tej ziemi."
  tags: []
"Rdz42,10":
  text: "A oni mu odpowiedzieli: Nie, mój panie. Twoi słudzy przyszli, aby nakupić żywności."
  tags: []
"Rdz42,11":
  text: "Wszyscy jesteśmy synami jednego człowieka. Jesteśmy uczciwi. Twoi słudzy nie są szpiegami."
  tags: []
"Rdz42,12":
  text: "A on powiedział do nich: Nie, ale przyszliście wypatrzyć nieobronne miejsca tej ziemi."
  tags: []
"Rdz42,13":
  text: "Powiedzieli: Było nas, twoich sług, dwunastu braci, synów jednego człowieka w ziemi Kanaan. Najmłodszy jest z naszym ojcem w domu, a jednego już nie ma."
  tags: []
"Rdz42,14":
  text: "Józef rzekł im: Jest tak, jak wam powiedziałem – jesteście szpiegami."
  tags: []
"Rdz42,15":
  text: "Zostaniecie co do tego wybadani: Na życie faraona, nie wyjdziecie stąd, dopóki nie przyjdzie tu wasz młodszy brat."
  tags: []
"Rdz42,16":
  text: "Wyślijcie jednego z was, aby przyprowadził waszego brata, a wy zostaniecie w więzieniu, aż wasze słowa się potwierdzą, czy mówicie prawdę. A jeśli nie, na życie faraona, jesteście szpiegami."
  tags: []
"Rdz42,17":
  text: "I oddał ich pod straż na trzy dni."
  tags: []
"Rdz42,18":
  text: "A trzeciego dnia Józef powiedział do nich: Zróbcie tak, a będziecie żyć, bo ja się boję Boga."
  tags: []
"Rdz42,19":
  text: "Jeśli jesteście uczciwi, niech jeden z waszych braci pozostanie związany tu w więzieniu; a wy jedźcie i odnieście zboże, aby się pozbyć głodu z waszych domów."
  tags: []
"Rdz42,20":
  text: "I przyprowadźcie do mnie waszego najmłodszego brata, a wasze słowa sprawdzą się i nie umrzecie. I tak zrobili."
  tags: []
"Rdz42,21":
  text: "Mówili jeden do drugiego: Naprawdę zgrzeszyliśmy przeciwko naszemu bratu, bo widząc strapienie jego duszy, gdy nas błagał, nie wysłuchaliśmy go. Dlatego przyszło na nas to utrapienie."
  tags: []
"Rdz42,22":
  text: "Wtedy Ruben odpowiedział im: Czyż nie mówiłem wam: Nie grzeszcie przeciw chłopcu? A nie usłuchaliście. Oto teraz żąda się odpowiedzialności za jego krew."
  tags: []
"Rdz42,23":
  text: "Lecz oni nie wiedzieli, że Józef rozumie, bo rozmawiał z nimi przez tłumacza."
  tags: []
"Rdz42,24":
  text: "Wtedy odwrócił się od nich i zapłakał. Potem obrócił się do nich i rozmawiał z nimi. Wziął spośród nich Symeona i związał go na ich oczach."
  tags: []
"Rdz42,25":
  text: "Potem Józef rozkazał, aby napełniono ich wory zbożem i każdemu z nich wrzucono do jego wora pieniądze, i żeby dano im żywność na drogę. I tak zrobiono."
  tags: []
"Rdz42,26":
  text: "Wtedy oni włożyli zboża na swoje osły i odjechali stamtąd."
  tags: []
"Rdz42,27":
  text: "I gdy jeden z nich rozwiązał swój wór, aby w gospodzie dać karmę swemu osłu, zobaczył swoje pieniądze; były bowiem na wierzchu jego wora."
  tags: []
"Rdz42,28":
  text: "I powiedział do swoich braci: Zwrócono mi pieniądze, oto są w moim worze. Wtedy zamarło im serce i przerazili się, mówiąc jeden do drugiego: Cóż to nam Bóg uczynił?"
  tags: []
"Rdz42,29":
  text: "Potem przyszli do swego ojca Jakuba, do ziemi Kanaan, i opowiedzieli mu wszystko, co im się przydarzyło:"
  tags: []
"Rdz42,30":
  text: "Ten człowiek, pan tej ziemi, rozmawiał z nami surowo i wziął nas za szpiegów ziemi;"
  tags: []
"Rdz42,31":
  text: "Powiedzieliśmy mu: Jesteśmy uczciwi, nie jesteśmy szpiegami;"
  tags: []
"Rdz42,32":
  text: "Było nas dwunastu braci, synów naszego ojca; jednego już nie ma, a najmłodszy jest teraz z naszym ojcem w ziemi Kanaan."
  tags: []
"Rdz42,33":
  text: "I ten człowiek, pan tej ziemi, powiedział do nas: Po tym poznam, że jesteście uczciwi; zostawcie jednego z waszych braci u mnie, weźcie zboże, aby pozbyć się głodu z waszych domów, i idźcie;"
  tags: []
"Rdz42,34":
  text: "Potem przyprowadźcie waszego najmłodszego brata do mnie, abym poznał, że nie jesteście szpiegami, ale ludźmi uczciwymi. Wtedy oddam wam waszego brata, a w tej ziemi będziecie mogli handlować."
  tags: []
"Rdz42,35":
  text: "A gdy opróżniali swoje wory, każdy znalazł w swoim worze węzeł pieniędzy. Gdy wraz ze swoim ojcem zobaczyli węzły z pieniędzmi, przerazili się."
  tags: []
"Rdz42,36":
  text: "Wtedy ich ojciec Jakub powiedział im: Osierociliście mnie. Nie ma Józefa i Symeona, a weźmiecie Beniamina; całe zło się na mnie zwaliło."
  tags: []
"Rdz42,37":
  text: "Ruben powiedział do swego ojca: Zabij moich dwóch synów, jeśli go z powrotem nie przyprowadzę. Oddaj go pod moją opiekę, a ja ci go zwrócę."
  tags: []
"Rdz42,38":
  text: "Ale on powiedział: Mój syn nie pójdzie z wami, gdyż jego brat umarł i tylko on jeden został. Jeśli przydarzy mu się nieszczęście na drodze, którą pójdziecie, w żalu doprowadzicie mnie, osiwiałego, do grobu."
  tags: []
