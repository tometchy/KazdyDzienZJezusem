"Rdz4,1": "Potem Adam obcował ze swoją żoną Ewą, a ta poczęła i urodziła Kaina. I powiedziała: Otrzymałam mężczyznę od PANA."
"Rdz4,2": "I urodziła jeszcze jego brata Abla. Abel był pasterzem owiec, a Kain był rolnikiem."
"Rdz4,3": "Z biegiem czasu zdarzyło się, że Kain przyniósł PANU ofiarę z plonów ziemi."
"Rdz4,4": "Także Abel przyniósł z pierworodnych swej trzody i z ich tłuszczu. A PAN wejrzał na Abla i jego ofiarę."
"Rdz4,5": "Lecz na Kaina i jego ofiarę nie wejrzał. Kain rozgniewał się bardzo i spochmurniała jego twarz."
"Rdz4,6": "Wtedy PAN zapytał Kaina: Dlaczego się rozgniewałeś? Czemu spochmurniała twoja twarz?"
"Rdz4,7": "Jeśli będziesz dobrze czynił, czy nie zostaniesz wywyższony? A jeśli nie będziesz dobrze czynił, grzech leży u drzwi; a do ciebie będzie jego pragnienie, a ty będziesz nad nim panować."
"Rdz4,8": "I Kain rozmawiał ze swoim bratem Ablem. A gdy byli na polu, Kain powstał przeciwko swemu bratu Ablowi i zabił go."
"Rdz4,9": "Wtedy PAN zapytał Kaina: Gdzie jest twój brat Abel? On odpowiedział: Nie wiem. Czy ja jestem stróżem mego brata?"
"Rdz4,10": "Bóg zapytał: Cóż uczyniłeś? Głos krwi twego brata woła do mnie z ziemi."
"Rdz4,11": "Teraz więc przeklęty będziesz na ziemi, która otworzyła swe usta, aby przyjąć krew twego brata przelaną przez twoją rękę."
"Rdz4,12": "Gdy będziesz uprawiał ziemię, nie da ci już swego plonu. Tułaczem i zbiegiem będziesz na ziemi."
"Rdz4,13": "Wtedy Kain powiedział do PANA: Zbyt ciężka jest moja kara, bym mógł ją znieść."
"Rdz4,14": "Oto wyganiasz mnie dziś z powierzchni ziemi, a przed twoją twarzą będę ukryty. Będę tułaczem i zbiegiem na ziemi, a stanie się tak, że ktokolwiek mnie spotka, zabije mnie."
"Rdz4,15": "PAN mu odpowiedział: Zaprawdę, ktokolwiek zabije Kaina, poniesie siedmiokrotną zemstę. I nałożył PAN na Kaina piętno, aby nie zabił go nikt, kto by go spotkał."
"Rdz4,16": "Wtedy odszedł Kain sprzed oblicza PANA i zamieszkał w ziemi Nod, na wschód od Edenu."
"Rdz4,17": "I Kain obcował ze swoją żoną, a ona poczęła i urodziła Henocha. Zbudował też miasto i nazwał je imieniem swego syna – Henoch."
"Rdz4,18": "Henochowi urodził się Irad, a Irad spłodził Mechujaela, a Mechujael spłodził Matuszaela, a Matuszael spłodził Lameka."
"Rdz4,19": "I Lamek pojął sobie dwie żony. Imię jednej było Ada, a drugiej – Silla."
"Rdz4,20": "Ada urodziła Jabala, który był ojcem mieszkających w namiotach i pasterzy."
"Rdz4,21": "Jego brat miał na imię Jubal, a był on ojcem wszystkich grających na harfie i na flecie."
"Rdz4,22": "Silla urodziła Tubalkaina, który był rzemieślnikiem wszelkiej roboty od miedzi i żelaza. Siostrą Tubalkaina była Noema."
"Rdz4,23": "I Lamek powiedział swym żonom, Adzie i Silli: Słuchajcie mego głosu, żony Lameka, posłuchajcie moich słów; zabiłem mężczyznę za zranienie mnie i młodzieńca za siniec."
"Rdz4,24": "Jeśli Kain ma być pomszczony siedem razy, to Lamek siedemdziesiąt siedem razy."
"Rdz4,25": "I Adam znów obcował ze swoją żoną, a ona urodziła syna i nadała mu imię Set, mówiąc: Dał mi Bóg inne potomstwo za Abla, którego zabił Kain."
"Rdz4,26": "Setowi też urodził się syn i nadał mu imię Enosz. Wtedy zaczęto wzywać imienia PANA."
