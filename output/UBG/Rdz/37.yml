"Rdz37,1":
  text: "Jakub mieszkał w ziemi, gdzie jego ojciec był przybyszem, w ziemi Kanaan."
  tags: []
"Rdz37,2":
  text: "To są dzieje rodu Jakuba: Gdy Józef miał siedemnaście lat, pasł stada ze swoimi braćmi; młodzieniec był z synami Bilhy i z synami Zilpy, żony swego ojca. I Józef donosił ojcu o ich złej sławie."
  tags: []
"Rdz37,3":
  text: "A Izrael kochał Józefa najbardziej ze wszystkich swoich synów, bo urodził mu się w starości. I zrobił mu szatę wielobarwną."
  tags: []
"Rdz37,4":
  text: "Gdy jego bracia widzieli, że ojciec kocha go bardziej niż wszystkich jego braci, znienawidzili go i nie potrafili przyjaźnie z nim rozmawiać."
  tags: []
"Rdz37,5":
  text: "Pewnego razu Józefowi przyśnił się sen, a gdy opowiedział go swoim braciom, tym bardziej go znienawidzili."
  tags: []
"Rdz37,6":
  text: "Bo powiedział im: Posłuchajcie, proszę, snu, który mi się przyśnił."
  tags: []
"Rdz37,7":
  text: "Wiązaliśmy snopy na polu, a oto mój snop podniósł się i stanął, a wasze snopy otoczyły go i pokłoniły się mojemu snopowi."
  tags: []
"Rdz37,8":
  text: "I odpowiedzieli mu jego bracia: Czyżbyś miał królować nad nami? Czyż miałbyś nami rządzić? I jeszcze bardziej go znienawidzili z powodu snów i słów jego."
  tags: []
"Rdz37,9":
  text: "Śnił mu się jeszcze drugi sen i opowiedział go swoim braciom: Znowu śnił mi się sen, a oto słońce, księżyc i jedenaście gwiazd pokłoniły mi się."
  tags: []
"Rdz37,10":
  text: "Gdy opowiedział to swemu ojcu i swoim braciom, jego ojciec zgromił go i powiedział mu: Cóż to za sen, który ci się śnił? Czy ja i twoja matka przyjdziemy z twoimi braćmi, aby ci się kłaniać aż do ziemi?"
  tags: []
"Rdz37,11":
  text: "I jego bracia zazdrościli mu, ale jego ojciec rozważał tę sprawę."
  tags: []
"Rdz37,12":
  text: "Potem jego bracia odeszli, aby paść trzody swego ojca w Sychem."
  tags: []
"Rdz37,13":
  text: "I Izrael powiedział do Józefa: Czy twoi bracia nie pasą trzody w Sychem? Chodź, a poślę cię do nich. A on odpowiedział: Oto jestem."
  tags: []
"Rdz37,14":
  text: "Wtedy powiedział mu: Idź teraz i dowiedz się, jak się mają twoi bracia i co się dzieje z trzodami, i daj mi znać. Wysłał go więc z doliny Hebronu, a on przyszedł do Sychem."
  tags: []
"Rdz37,15":
  text: "I spotkał go pewien człowiek, gdy błąkał się po polu. I człowiek ten zapytał go: Czego szukasz?"
  tags: []
"Rdz37,16":
  text: "A on odpowiedział: Szukam moich braci. Powiedz mi, proszę, gdzie oni pasą trzody."
  tags: []
"Rdz37,17":
  text: "Człowiek ten odpowiedział: Odeszli stąd, bo słyszałem, jak mówili: Pójdźmy do Dotan. I Józef poszedł za swoimi braćmi i znalazł ich w Dotan."
  tags: []
"Rdz37,18":
  text: "Gdy ujrzeli go z daleka, zanim do nich przyszedł, naradzali się, aby go zabić."
  tags: []
"Rdz37,19":
  text: "I mówili jeden do drugiego: Oto idzie mistrz od snów."
  tags: []
"Rdz37,20":
  text: "Teraz więc chodźcie, zabijmy go i wrzućmy do jakiejś studni, i powiemy: Pożarł go zły zwierz. I zobaczymy, co będzie z jego snów."
  tags: []
"Rdz37,21":
  text: "Ruben, gdy to usłyszał, chciał go wybawić z ich rąk i powiedział: Nie zabijajmy go."
  tags: []
"Rdz37,22":
  text: "Ruben powiedział też do nich: Nie wylewajcie krwi, ale wrzućcie go do tej studni, która jest na pustyni, i nie podnoście na niego ręki. A mówił to, aby go wybawić z ich rąk i przywrócić go swemu ojcu."
  tags: []
"Rdz37,23":
  text: "Gdy Józef przyszedł do swoich braci, obdarli go z jego szaty, z szaty wielobarwnej, którą miał na sobie."
  tags: []
"Rdz37,24":
  text: "Następnie chwycili go i wrzucili do studni, która była pusta, bez wody."
  tags: []
"Rdz37,25":
  text: "Potem usiedli, aby jeść chleb, a gdy podnieśli swoje oczy, zobaczyli grupę Izmaelitów idących z Gileadu. Ich wielbłądy niosły wonne korzenie, kadzidło i mirrę, a szły, aby to zanieść do Egiptu."
  tags: []
"Rdz37,26":
  text: "Wtedy Juda powiedział do swoich braci: Jaki pożytek będzie z tego, że zabijemy naszego brata i zataimy jego krew?"
  tags: []
"Rdz37,27":
  text: "Chodźcie, sprzedajmy go Izmaelitom, a nie podnośmy na niego naszej ręki, bo to jest nasz brat i nasze ciało. I bracia go usłuchali."
  tags: []
"Rdz37,28":
  text: "A gdy przechodzili Midianici, kupcy, wyciągnęli Józefa ze studni i sprzedali go Izmaelitom za dwadzieścia srebrników, a oni zaprowadzili Józefa do Egiptu."
  tags: []
"Rdz37,29":
  text: "Gdy Ruben wrócił do tej studni, Józefa już w studni nie było. I rozdarł swoje szaty."
  tags: []
"Rdz37,30":
  text: "Potem wrócił do swoich braci i powiedział: Nie ma chłopca, a ja dokąd pójdę?"
  tags: []
"Rdz37,31":
  text: "Wtedy wzięli szatę Józefa, zabili kozła i umoczyli szatę we krwi."
  tags: []
"Rdz37,32":
  text: "I posłali tę wielobarwną szatę, aby ją zaniesiono do jego ojca, i powiedzieli: Znaleźliśmy to. Zobacz, czy to szata twego syna, czy nie."
  tags: []
"Rdz37,33":
  text: "A on rozpoznał ją i powiedział: To jest szata mego syna, pożarł go zły zwierz. Józef na pewno został rozszarpany."
  tags: []
"Rdz37,34":
  text: "Wtedy Jakub rozdarł swoje szaty, włożył wór na biodra i opłakiwał swego syna przez wiele dni."
  tags: []
"Rdz37,35":
  text: "I zeszli się wszyscy jego synowie i wszystkie jego córki, aby go pocieszyć, lecz nie dał się pocieszyć, ale mówił: Naprawdę zstąpię za moim synem do grobu. I opłakiwał go jego ojciec."
  tags: []
"Rdz37,36":
  text: "A Midianici sprzedali Józefa do Egiptu Potifarowi, dworzaninowi faraona, dowódcy straży."
  tags: []
