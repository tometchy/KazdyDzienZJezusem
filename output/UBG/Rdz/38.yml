"Rdz38,1":
  text: "W tym czasie Juda odszedł od swoich braci i wstąpił do pewnego mieszkańca Adullam, który miał na imię Chira."
  tags: []
"Rdz38,2":
  text: "I Juda zobaczył tam córkę Kananejczyka, który miał na imię Szua; pojął ją i obcował z nią."
  tags: []
"Rdz38,3":
  text: "A ona poczęła i urodziła syna, i nadał mu imię Er."
  tags: []
"Rdz38,4":
  text: "I znów poczęła i urodziła syna, i nadała mu imię Onan."
  tags: []
"Rdz38,5":
  text: "Potem znowu urodziła syna i nadała mu imię Szela. A Juda był w Kezib, gdy mu go urodziła."
  tags: []
"Rdz38,6":
  text: "I Juda wziął dla swojego pierworodnego syna Era żonę imieniem Tamar."
  tags: []
"Rdz38,7":
  text: "A Er, pierworodny Judy, był zły w oczach PANA, więc PAN go zabił."
  tags: []
"Rdz38,8":
  text: "Wtedy Juda powiedział do Onana: Obcuj z żoną twego brata i ożeń się z nią, i wzbudź twemu bratu potomstwo."
  tags: []
"Rdz38,9":
  text: "Lecz Onan wiedział, że to potomstwo nie miało być jego; gdy obcował z żoną swego brata, wyrzucał swoje nasienie na ziemię, aby nie wzbudzić potomstwa swemu bratu."
  tags: []
"Rdz38,10":
  text: "I nie podobało się PANU to, co Onan robił, dlatego i jego PAN zabił."
  tags: []
"Rdz38,11":
  text: "Wtedy Juda powiedział do swojej synowej Tamar: Mieszkaj w domu twego ojca jako wdowa, aż dorośnie mój syn Szela. Powiedział bowiem: Oby on też nie umarł jak jego bracia. I Tamar odeszła, i mieszkała w domu swego ojca."
  tags: []
"Rdz38,12":
  text: "Po długim czasie umarła córka Szuy, żona Judy. Gdy Juda już pocieszył się, poszedł wraz ze swoim przyjacielem Chirą Adullamitą do Timny, do tych, co strzygli jego owce."
  tags: []
"Rdz38,13":
  text: "I powiedziano o tym Tamarze: Oto twój teść idzie do Timny, aby strzyc swoje owce."
  tags: []
"Rdz38,14":
  text: "Zdjęła więc z siebie wdowie szaty, okryła się welonem i tak zasłonięta usiadła na rozstaju drogi, która prowadziła do Timny. Widziała bowiem, że Szela dorósł, a ona nie została mu dana za żonę."
  tags: []
"Rdz38,15":
  text: "A gdy Juda zobaczył ją, pomyślał, że to nierządnica, bo zakryła swoją twarz."
  tags: []
"Rdz38,16":
  text: "Zszedł więc do niej z drogi i powiedział: Proszę, pozwól mi obcować z tobą. Nie wiedział bowiem, że to była jego synowa. I powiedziała: Co mi dasz, abyś mógł ze mną obcować?"
  tags: []
"Rdz38,17":
  text: "I odpowiedział: Poślę ci koźlątko ze stada. A ona rzekła: Dasz mi zastaw, dopóki nie przyślesz?"
  tags: []
"Rdz38,18":
  text: "I powiedział: Cóż mam ci dać w zastaw? A ona odpowiedziała: Twój pierścień, twój sznur i twoją laskę, którą masz w ręce. Dał jej więc i obcował z nią; a ona poczęła z niego."
  tags: []
"Rdz38,19":
  text: "Potem wstała, odeszła, zdjęła z siebie welon i włożyła wdowie szaty."
  tags: []
"Rdz38,20":
  text: "A Juda posłał koźlątko przez swego przyjaciela Adullamitę, aby odebrał zastaw z ręki tej kobiety, ale ten jej nie znalazł."
  tags: []
"Rdz38,21":
  text: "I pytał ludzi w tym miejscu: Gdzie jest ta nierządnica, która była na rozstaju tej drogi? Oni odpowiedzieli: Nie było tu żadnej nierządnicy."
  tags: []
"Rdz38,22":
  text: "Wrócił więc do Judy i powiedział: Nie znalazłem jej. I ludzie w tym miejscu powiedzieli: Nie było tu żadnej nierządnicy."
  tags: []
"Rdz38,23":
  text: "Wtedy Juda powiedział: Niech sobie zatrzyma ten zastaw, abyśmy nie stali się pośmiewiskiem. Oto posyłałem to koźlątko, a ty jej nie znalazłeś."
  tags: []
"Rdz38,24":
  text: "Po upływie około trzech miesięcy powiedziano Judzie: Twoja synowa Tamar stała się nierządnicą i oto jest brzemienna z nierządu. Wtedy Juda powiedział: Wyprowadźcie ją i niech będzie spalona."
  tags: []
"Rdz38,25":
  text: "A gdy została wyprowadzona, posłała do swego teścia wiadomość: Jestem brzemienna z mężczyzny, do którego należą te rzeczy. Powiedziała przy tym: Rozpoznaj, proszę, czyj to pierścień, sznur i laska."
  tags: []
"Rdz38,26":
  text: "Wtedy Juda rozpoznał je i powiedział: Ona jest sprawiedliwsza ode mnie, ponieważ nie dałem jej memu synowi Szeli. I więcej z nią nie obcował."
  tags: []
"Rdz38,27":
  text: "Gdy nadszedł czas jej porodu, okazało się, że w jej łonie są bliźnięta."
  tags: []
"Rdz38,28":
  text: "A gdy rodziła, jedno dziecko wytknęło rękę, a położna ujęła ją i zawiązała na ręce czerwoną nić, mówiąc: Ten wyszedł pierwszy."
  tags: []
"Rdz38,29":
  text: "Gdy on cofnął swoją rękę, oto wyszedł jego brat i powiedziała: Jak się przedarłeś? Na tobie niech będzie rozerwanie. I nadała mu imię Peres."
  tags: []
"Rdz38,30":
  text: "A potem wyszedł jego brat, na którego ręce była czerwona nić. I nadała mu imię Zerach."
  tags: []
