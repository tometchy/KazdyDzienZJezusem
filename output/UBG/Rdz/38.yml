"Rdz38,1": "W tym czasie Juda odszedł od swoich braci i wstąpił do pewnego mieszkańca Adullam, który miał na imię Chira."
"Rdz38,2": "I Juda zobaczył tam córkę Kananejczyka, który miał na imię Szua; pojął ją i obcował z nią."
"Rdz38,3": "A ona poczęła i urodziła syna, i nadał mu imię Er."
"Rdz38,4": "I znów poczęła i urodziła syna, i nadała mu imię Onan."
"Rdz38,5": "Potem znowu urodziła syna i nadała mu imię Szela. A Juda był w Kezib, gdy mu go urodziła."
"Rdz38,6": "I Juda wziął dla swojego pierworodnego syna Era żonę imieniem Tamar."
"Rdz38,7": "A Er, pierworodny Judy, był zły w oczach PANA, więc PAN go zabił."
"Rdz38,8": "Wtedy Juda powiedział do Onana: Obcuj z żoną twego brata i ożeń się z nią, i wzbudź twemu bratu potomstwo."
"Rdz38,9": "Lecz Onan wiedział, że to potomstwo nie miało być jego; gdy obcował z żoną swego brata, wyrzucał swoje nasienie na ziemię, aby nie wzbudzić potomstwa swemu bratu."
"Rdz38,10": "I nie podobało się PANU to, co Onan robił, dlatego i jego PAN zabił."
"Rdz38,11": "Wtedy Juda powiedział do swojej synowej Tamar: Mieszkaj w domu twego ojca jako wdowa, aż dorośnie mój syn Szela. Powiedział bowiem: Oby on też nie umarł jak jego bracia. I Tamar odeszła, i mieszkała w domu swego ojca."
"Rdz38,12": "Po długim czasie umarła córka Szuy, żona Judy. Gdy Juda już pocieszył się, poszedł wraz ze swoim przyjacielem Chirą Adullamitą do Timny, do tych, co strzygli jego owce."
"Rdz38,13": "I powiedziano o tym Tamarze: Oto twój teść idzie do Timny, aby strzyc swoje owce."
"Rdz38,14": "Zdjęła więc z siebie wdowie szaty, okryła się welonem i tak zasłonięta usiadła na rozstaju drogi, która prowadziła do Timny. Widziała bowiem, że Szela dorósł, a ona nie została mu dana za żonę."
"Rdz38,15": "A gdy Juda zobaczył ją, pomyślał, że to nierządnica, bo zakryła swoją twarz."
"Rdz38,16": "Zszedł więc do niej z drogi i powiedział: Proszę, pozwól mi obcować z tobą. Nie wiedział bowiem, że to była jego synowa. I powiedziała: Co mi dasz, abyś mógł ze mną obcować?"
"Rdz38,17": "I odpowiedział: Poślę ci koźlątko ze stada. A ona rzekła: Dasz mi zastaw, dopóki nie przyślesz?"
"Rdz38,18": "I powiedział: Cóż mam ci dać w zastaw? A ona odpowiedziała: Twój pierścień, twój sznur i twoją laskę, którą masz w ręce. Dał jej więc i obcował z nią; a ona poczęła z niego."
"Rdz38,19": "Potem wstała, odeszła, zdjęła z siebie welon i włożyła wdowie szaty."
"Rdz38,20": "A Juda posłał koźlątko przez swego przyjaciela Adullamitę, aby odebrał zastaw z ręki tej kobiety, ale ten jej nie znalazł."
"Rdz38,21": "I pytał ludzi w tym miejscu: Gdzie jest ta nierządnica, która była na rozstaju tej drogi? Oni odpowiedzieli: Nie było tu żadnej nierządnicy."
"Rdz38,22": "Wrócił więc do Judy i powiedział: Nie znalazłem jej. I ludzie w tym miejscu powiedzieli: Nie było tu żadnej nierządnicy."
"Rdz38,23": "Wtedy Juda powiedział: Niech sobie zatrzyma ten zastaw, abyśmy nie stali się pośmiewiskiem. Oto posyłałem to koźlątko, a ty jej nie znalazłeś."
"Rdz38,24": "Po upływie około trzech miesięcy powiedziano Judzie: Twoja synowa Tamar stała się nierządnicą i oto jest brzemienna z nierządu. Wtedy Juda powiedział: Wyprowadźcie ją i niech będzie spalona."
"Rdz38,25": "A gdy została wyprowadzona, posłała do swego teścia wiadomość: Jestem brzemienna z mężczyzny, do którego należą te rzeczy. Powiedziała przy tym: Rozpoznaj, proszę, czyj to pierścień, sznur i laska."
"Rdz38,26": "Wtedy Juda rozpoznał je i powiedział: Ona jest sprawiedliwsza ode mnie, ponieważ nie dałem jej memu synowi Szeli. I więcej z nią nie obcował."
"Rdz38,27": "Gdy nadszedł czas jej porodu, okazało się, że w jej łonie są bliźnięta."
"Rdz38,28": "A gdy rodziła, jedno dziecko wytknęło rękę, a położna ujęła ją i zawiązała na ręce czerwoną nić, mówiąc: Ten wyszedł pierwszy."
"Rdz38,29": "Gdy on cofnął swoją rękę, oto wyszedł jego brat i powiedziała: Jak się przedarłeś? Na tobie niech będzie rozerwanie. I nadała mu imię Peres."
"Rdz38,30": "A potem wyszedł jego brat, na którego ręce była czerwona nić. I nadała mu imię Zerach."
