"Rdz17,1":
  text: "Gdy Abram miał dziewięćdziesiąt dziewięć lat, PAN ukazał się Abramowi i powiedział do niego: Ja jestem Bogiem Wszechmogącym. Chodź przed moim obliczem i bądź doskonały."
  tags: []
"Rdz17,2":
  text: "A zawrę moje przymierze między mną a tobą i rozmnożę cię bardzo obficie."
  tags: []
"Rdz17,3":
  text: "Wtedy Abram upadł na twarz, a Bóg powiedział do niego:"
  tags: []
"Rdz17,4":
  text: "Oto ja ustanawiam moje przymierze z tobą i będziesz ojcem wielu narodów."
  tags: []
"Rdz17,5":
  text: "Nie będziesz już się nazywał Abram, ale twoje imię będzie Abraham, bo ustanowiłem cię ojcem wielu narodów."
  tags: []
"Rdz17,6":
  text: "Uczynię cię niezmiernie płodnym i od ciebie wywiodę narody, i od ciebie będą pochodzić królowie."
  tags: []
"Rdz17,7":
  text: "I utwierdzę moje przymierze między mną a tobą oraz twoim potomstwem po tobie przez wszystkie pokolenia jako wieczne przymierze, abym był ci Bogiem i twemu potomstwu po tobie."
  tags: []
"Rdz17,8":
  text: "Dam tobie i twemu potomstwu po tobie ziemię, w której teraz przebywasz, całą ziemię Kanaan, jako własność na wieki, i będę ich Bogiem."
  tags: []
"Rdz17,9":
  text: "Potem Bóg powiedział Abrahamowi: Ty zaś zachowuj moje przymierze, ty i twoje potomstwo po tobie przez wszystkie pokolenia."
  tags: []
"Rdz17,10":
  text: "A takie jest moje przymierze, które będziecie zachowywać, między mną a wami i między twoim potomstwem po tobie: Każdy mężczyzna wśród was ma być obrzezany."
  tags: []
"Rdz17,11":
  text: "Obrzezacie więc ciało waszego napletka; to będzie znakiem przymierza między mną a wami."
  tags: []
"Rdz17,12":
  text: "Każdy syn wśród was w ósmym dniu życia będzie obrzezany, każdy mężczyzna przez wszystkie pokolenia, tak narodzony w domu, jak i nabyty za pieniądze od jakiegokolwiek cudzoziemca, który nie pochodzi z twego potomstwa."
  tags: []
"Rdz17,13":
  text: "Urodzony w twoim domu i nabyty za twoje pieniądze musi być obrzezany. A moje przymierze będzie na waszym ciele jako wieczne przymierze."
  tags: []
"Rdz17,14":
  text: "A nieobrzezany mężczyzna, któremu nie obrzezano ciała jego napletka, ta dusza będzie wykluczona ze swego ludu, bo złamała moje przymierze."
  tags: []
"Rdz17,15":
  text: "Potem Bóg powiedział do Abrahama: Twojej żony Saraj nie będziesz już nazywał imieniem Saraj, ale jej imię będzie Sara."
  tags: []
"Rdz17,16":
  text: "I będę jej błogosławił, i dam ci z niej syna. Będę jej błogosławił i będzie matką narodów, i od niej będą pochodzić królowie narodów."
  tags: []
"Rdz17,17":
  text: "Wtedy Abraham upadł na twarz i roześmiał się, i mówił w swoim sercu: Czy stuletniemu człowiekowi urodzi się syn? I czy Sara w wieku dziewięćdziesięciu lat urodzi?"
  tags: []
"Rdz17,18":
  text: "I Abraham powiedział do Boga: Oby tylko Izmael żył przed twoim obliczem!"
  tags: []
"Rdz17,19":
  text: "A Bóg powiedział: Naprawdę, twoja żona Sara urodzi ci syna i nadasz mu imię Izaak. I utwierdzę moje przymierze z nim jako wieczne przymierze i z jego potomstwem po nim."
  tags: []
"Rdz17,20":
  text: "Co do Izmaela też cię wysłuchałem. Oto błogosławiłem mu i uczynię go płodnym, i rozmnożę go bardzo obficie. Spłodzi on dwunastu książąt i uczynię go wielkim narodem."
  tags: []
"Rdz17,21":
  text: "Ale moje przymierze utwierdzę z Izaakiem, którego Sara urodzi ci za rok o tej porze."
  tags: []
"Rdz17,22":
  text: "Gdy skończył z nim rozmowę, Bóg wzniósł się nad Abrahama."
  tags: []
"Rdz17,23":
  text: "Wtedy Abraham wziął swego syna Izmaela, wszystkich urodzonych w swym domu oraz wszystkich nabytych za pieniądze, wszystkich mężczyzn wśród domowników Abrahama, i obrzezał ciała ich napletków tego samego dnia, jak Bóg mu mówił."
  tags: []
"Rdz17,24":
  text: "Abraham miał dziewięćdziesiąt dziewięć lat, gdy obrzezano ciało jego napletka."
  tags: []
"Rdz17,25":
  text: "A jego syn Izmael miał trzynaście lat, gdy obrzezano ciało jego napletka."
  tags: []
"Rdz17,26":
  text: "Tego samego dnia obrzezano Abrahama i jego syna Izmaela."
  tags: []
"Rdz17,27":
  text: "I wszyscy mężczyźni jego domu, urodzeni w domu i nabyci za pieniądze od cudzoziemców, zostali obrzezani z nim."
  tags: []
