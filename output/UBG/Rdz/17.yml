"Rdz17,1": "Gdy Abram miał dziewięćdziesiąt dziewięć lat, PAN ukazał się Abramowi i powiedział do niego: Ja jestem Bogiem Wszechmogącym. Chodź przed moim obliczem i bądź doskonały."
"Rdz17,2": "A zawrę moje przymierze między mną a tobą i rozmnożę cię bardzo obficie."
"Rdz17,3": "Wtedy Abram upadł na twarz, a Bóg powiedział do niego:"
"Rdz17,4": "Oto ja ustanawiam moje przymierze z tobą i będziesz ojcem wielu narodów."
"Rdz17,5": "Nie będziesz już się nazywał Abram, ale twoje imię będzie Abraham, bo ustanowiłem cię ojcem wielu narodów."
"Rdz17,6": "Uczynię cię niezmiernie płodnym i od ciebie wywiodę narody, i od ciebie będą pochodzić królowie."
"Rdz17,7": "I utwierdzę moje przymierze między mną a tobą oraz twoim potomstwem po tobie przez wszystkie pokolenia jako wieczne przymierze, abym był ci Bogiem i twemu potomstwu po tobie."
"Rdz17,8": "Dam tobie i twemu potomstwu po tobie ziemię, w której teraz przebywasz, całą ziemię Kanaan, jako własność na wieki, i będę ich Bogiem."
"Rdz17,9": "Potem Bóg powiedział Abrahamowi: Ty zaś zachowuj moje przymierze, ty i twoje potomstwo po tobie przez wszystkie pokolenia."
"Rdz17,10": "A takie jest moje przymierze, które będziecie zachowywać, między mną a wami i między twoim potomstwem po tobie: Każdy mężczyzna wśród was ma być obrzezany."
"Rdz17,11": "Obrzezacie więc ciało waszego napletka; to będzie znakiem przymierza między mną a wami."
"Rdz17,12": "Każdy syn wśród was w ósmym dniu życia będzie obrzezany, każdy mężczyzna przez wszystkie pokolenia, tak narodzony w domu, jak i nabyty za pieniądze od jakiegokolwiek cudzoziemca, który nie pochodzi z twego potomstwa."
"Rdz17,13": "Urodzony w twoim domu i nabyty za twoje pieniądze musi być obrzezany. A moje przymierze będzie na waszym ciele jako wieczne przymierze."
"Rdz17,14": "A nieobrzezany mężczyzna, któremu nie obrzezano ciała jego napletka, ta dusza będzie wykluczona ze swego ludu, bo złamała moje przymierze."
"Rdz17,15": "Potem Bóg powiedział do Abrahama: Twojej żony Saraj nie będziesz już nazywał imieniem Saraj, ale jej imię będzie Sara."
"Rdz17,16": "I będę jej błogosławił, i dam ci z niej syna. Będę jej błogosławił i będzie matką narodów, i od niej będą pochodzić królowie narodów."
"Rdz17,17": "Wtedy Abraham upadł na twarz i roześmiał się, i mówił w swoim sercu: Czy stuletniemu człowiekowi urodzi się syn? I czy Sara w wieku dziewięćdziesięciu lat urodzi?"
"Rdz17,18": "I Abraham powiedział do Boga: Oby tylko Izmael żył przed twoim obliczem!"
"Rdz17,19": "A Bóg powiedział: Naprawdę, twoja żona Sara urodzi ci syna i nadasz mu imię Izaak. I utwierdzę moje przymierze z nim jako wieczne przymierze i z jego potomstwem po nim."
"Rdz17,20": "Co do Izmaela też cię wysłuchałem. Oto błogosławiłem mu i uczynię go płodnym, i rozmnożę go bardzo obficie. Spłodzi on dwunastu książąt i uczynię go wielkim narodem."
"Rdz17,21": "Ale moje przymierze utwierdzę z Izaakiem, którego Sara urodzi ci za rok o tej porze."
"Rdz17,22": "Gdy skończył z nim rozmowę, Bóg wzniósł się nad Abrahama."
"Rdz17,23": "Wtedy Abraham wziął swego syna Izmaela, wszystkich urodzonych w swym domu oraz wszystkich nabytych za pieniądze, wszystkich mężczyzn wśród domowników Abrahama, i obrzezał ciała ich napletków tego samego dnia, jak Bóg mu mówił."
"Rdz17,24": "Abraham miał dziewięćdziesiąt dziewięć lat, gdy obrzezano ciało jego napletka."
"Rdz17,25": "A jego syn Izmael miał trzynaście lat, gdy obrzezano ciało jego napletka."
"Rdz17,26": "Tego samego dnia obrzezano Abrahama i jego syna Izmaela."
"Rdz17,27": "I wszyscy mężczyźni jego domu, urodzeni w domu i nabyci za pieniądze od cudzoziemców, zostali obrzezani z nim."
