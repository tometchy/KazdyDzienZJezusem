"Rdz16,1":
  text: "Saraj, żona Abrama, nie urodziła mu dzieci. Miała zaś służącą Egipcjankę, która miała na imię Hagar."
  tags: []
"Rdz16,2":
  text: "I powiedziała Saraj do Abrama: Oto PAN nie pozwolił mi urodzić. Wejdź, proszę, do mojej służącej, może z niej będę miała dzieci. I Abram usłuchał głosu Saraj."
  tags: []
"Rdz16,3":
  text: "Wzięła więc Saraj, żona Abrama, swoją służącą Hagar, Egipcjankę, i dała ją swemu mężowi Abramowi za żonę po dziesięciu latach zamieszkania Abrama w ziemi Kanaan."
  tags: []
"Rdz16,4":
  text: "Obcował więc z Hagar, a ona poczęła. A gdy spostrzegła, że poczęła, ze wzgardą patrzyła na swoją panią."
  tags: []
"Rdz16,5":
  text: "I Saraj powiedziała do Abrama: Jesteś winien mojej krzywdy. Dałam moją służącą w twe ramiona. Ona jednak, widząc, że poczęła, patrzyła na mnie ze wzgardą. Niech PAN rozsądzi między mną a tobą."
  tags: []
"Rdz16,6":
  text: "Abram powiedział do Saraj: Oto twoja służąca jest w twoim ręku, zrób z nią, co uważasz za słuszne. I gdy Saraj dręczyła ją, uciekła od niej."
  tags: []
"Rdz16,7":
  text: "I Anioł PANA znalazł ją u źródła wód na pustyni, u źródła przy drodze do Szur."
  tags: []
"Rdz16,8":
  text: "I zapytał: Hagar, służąco Saraj, skąd przyszłaś i dokąd idziesz? Ona odpowiedziała: Uciekam od swojej pani Saraj."
  tags: []
"Rdz16,9":
  text: "Anioł PANA powiedział jej: Wróć do swojej pani i poddaj się pod jej władzę."
  tags: []
"Rdz16,10":
  text: "Powiedział jej też Anioł PANA: Rozmnożę twoje potomstwo tak bardzo, że z powodu jego mnogości nie będzie go można policzyć."
  tags: []
"Rdz16,11":
  text: "Potem Anioł PANA powiedział jej: Oto poczęłaś i urodzisz syna, a nadasz mu imię Izmael, bo PAN usłyszał twoje cierpienie."
  tags: []
"Rdz16,12":
  text: "Będzie on dzikim człowiekiem: jego ręka będzie przeciwko wszystkim, a ręka wszystkich przeciwko jemu; i będzie mieszkać w obecności wszystkich swoich braci."
  tags: []
"Rdz16,13":
  text: "I nazwała PANA, który mówił do niej: Ty jesteś Bogiem, który mnie widzi. Powiedziała bowiem: Czyż tu nie spoglądałam na tego, który widzi mnie?"
  tags: []
"Rdz16,14":
  text: "Dlatego nazwała tę studnię studnią Żyjącego, który widzi mnie. Jest ona między Kadesz i Bered."
  tags: []
"Rdz16,15":
  text: "Potem Hagar urodziła Abramowi syna. I nadał Abram swemu synowi, którego urodziła Hagar, imię Izmael."
  tags: []
"Rdz16,16":
  text: "A Abram miał osiemdziesiąt sześć lat, gdy Hagar urodziła mu Izmaela."
  tags: []
