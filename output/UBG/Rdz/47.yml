"Rdz47,1":
  text: "Józef więc przyszedł i powiedział faraonowi: Mój ojciec i moi bracia ze swymi owcami, wołami i ze wszystkim, co mają, przybyli z ziemi Kanaan; oto są w ziemi Goszen."
  tags: []
"Rdz47,2":
  text: "A spośród swych braci wziął pięciu mężczyzn i przedstawił ich faraonowi."
  tags: []
"Rdz47,3":
  text: "I faraon zapytał jego braci: Czym się zajmujecie? A oni odpowiedzieli faraonowi: Twoi słudzy są pasterzami, my i nasi ojcowie."
  tags: []
"Rdz47,4":
  text: "Powiedzieli jeszcze do faraona: Przyszliśmy, aby przebywać w tej ziemi, bo nie ma paszy dla stad, które mają twoi słudzy, gdyż ciężki głód panuje w ziemi Kanaan. Teraz prosimy, pozwól, aby twoi słudzy mieszkali w ziemi Goszen."
  tags: []
"Rdz47,5":
  text: "Wtedy faraon powiedział do Józefa: Twój ojciec i twoi bracia przybyli do ciebie."
  tags: []
"Rdz47,6":
  text: "Ziemia Egiptu jest przed tobą. W najlepszym miejscu tej ziemi osadź twego ojca i twoich braci, niech mieszkają w ziemi Goszen. A jeśli wiesz, że są wśród nich dzielni ludzie, uczyń ich przełożonymi nad moimi stadami."
  tags: []
"Rdz47,7":
  text: "I Józef przyprowadził swego ojca Jakuba, i postawił go przed faraonem. A Jakub błogosławił faraona."
  tags: []
"Rdz47,8":
  text: "Faraon zapytał Jakuba: Ile lat życia sobie liczysz?"
  tags: []
"Rdz47,9":
  text: "Jakub odpowiedział faraonowi: Liczba lat mego pielgrzymowania to sto trzydzieści. Krótkie i złe były lata mego życia i nie osiągnąłem wieku moich ojców podczas ich pielgrzymowania."
  tags: []
"Rdz47,10":
  text: "Potem Jakub pobłogosławił faraona i odszedł sprzed jego oblicza."
  tags: []
"Rdz47,11":
  text: "Wtedy Józef osiedlił swego ojca i swoich braci i dał im posiadłość w ziemi Egiptu, w najlepszym miejscu tej krainy, w ziemi Ramses, jak rozkazał faraon."
  tags: []
"Rdz47,12":
  text: "I Józef żywił chlebem swego ojca i swoich braci, i cały dom swego ojca, aż do najmniejszego."
  tags: []
"Rdz47,13":
  text: "A w całej ziemi nie było chleba, bo panował bardzo ciężki głód i była utrapiona przez głód ziemia Egiptu i ziemia Kanaan."
  tags: []
"Rdz47,14":
  text: "Józef zebrał więc wszystkie pieniądze, które znajdowały się w ziemi Egiptu i w ziemi Kanaan, za żywność, którą kupowano. I Józef wniósł te pieniądze do skarbu faraona."
  tags: []
"Rdz47,15":
  text: "A gdy zabrakło pieniędzy w ziemi Egiptu i w ziemi Kanaan, wszyscy Egipcjanie przyszli do Józefa i powiedzieli: Daj nam chleba. Dlaczego mamy umierać na twoich oczach? Gdyż nam już zabrakło pieniędzy."
  tags: []
"Rdz47,16":
  text: "Józef na to odpowiedział: Dajcie wasze bydła, a dam wam żywność za wasze bydła, skoro zabrakło wam pieniędzy."
  tags: []
"Rdz47,17":
  text: "Przyprowadzili więc swoje bydła do Józefa; i Józef dał im chleb za konie, za trzody owiec, za stada wołów i za osły. W tym roku zaopatrywał ich w żywność w zamian za wszelkie ich bydło."
  tags: []
"Rdz47,18":
  text: "A gdy minął ten rok, przyszli do niego w następnym roku i powiedzieli: Nie ukryjemy przed naszym panem, że już skończyły się nam pieniądze, a stada bydła należą do naszego pana. Nie zostaje nam nic przed naszym panem jak tylko nasze ciała i nasze pole."
  tags: []
"Rdz47,19":
  text: "Dlaczego mamy umierać na twoich oczach, zarówno my, jak i nasza ziemia? Kupuj za chleb nas i nasze pole, a my i nasza ziemia będziemy w niewoli u faraona. Daj nam tylko ziarno, abyśmy żyli, a nie pomarli, i by ziemia nie opustoszała."
  tags: []
"Rdz47,20":
  text: "I tak kupił Józef całą ziemię Egiptu dla faraona, bo każdy Egipcjanin sprzedał swoje pole, gdyż wzmógł się wśród nich głód. I cała ziemia stała się własnością faraona."
  tags: []
"Rdz47,21":
  text: "I przeniósł lud do miast, od jednego krańca Egiptu do drugiego."
  tags: []
"Rdz47,22":
  text: "Nie kupił tylko ziemi kapłanów, bo kapłani mieli żywność przydzieloną im przez faraona i żywili się swoją żywnością, którą dał im faraon. Dlatego nie sprzedali swej ziemi."
  tags: []
"Rdz47,23":
  text: "Potem Józef powiedział do ludu: Oto teraz kupiłem was i waszą ziemię dla faraona. Macie tu ziarno, obsiejcie nim pola."
  tags: []
"Rdz47,24":
  text: "A piątą część waszych plonów oddacie faraonowi, cztery zaś części będą wasze – na obsianie pól i na żywność dla tych, którzy są w waszych domach, i na żywność dla waszych dzieci."
  tags: []
"Rdz47,25":
  text: "Wtedy odpowiedzieli: Uratowałeś nam życie! Obyśmy znaleźli łaskę w oczach swego pana, a będziemy niewolnikami faraona."
  tags: []
"Rdz47,26":
  text: "I Józef ustanowił to jako prawo aż do dziś w ziemi Egiptu, aby faraonowi oddawano piątą część plonów. Tylko ziemia samych kapłanów nie stała się własnością faraona."
  tags: []
"Rdz47,27":
  text: "Izrael mieszkał w ziemi Egiptu, w ziemi Goszen. Nabywali w niej posiadłości na własność, byli płodni i bardzo się rozmnożyli."
  tags: []
"Rdz47,28":
  text: "I Jakub żył w ziemi Egiptu siedemnaście lat. A w sumie Jakub przeżył sto czterdzieści siedem lat."
  tags: []
"Rdz47,29":
  text: "I zbliżył się czas śmierci Izraela. Wezwał więc swego syna Józefa i powiedział do niego: Jeśli teraz znalazłem łaskę w twoich oczach, połóż, proszę, twoją rękę pod moje biodro, a wyświadcz mi tę łaskę i wierność: Proszę, nie chowaj mnie w Egipcie;"
  tags: []
"Rdz47,30":
  text: "Ale gdy zasnę z moimi ojcami, wywieziesz mnie z Egiptu i pochowasz mnie w ich grobie. A on powiedział: Uczynię według twego słowa."
  tags: []
"Rdz47,31":
  text: "A Jakub powiedział: Przysięgnij mi. I przysiągł mu. Potem Izrael pokłonił się na wezgłowie łoża."
  tags: []
