"Rdz21,1":
  text: "A PAN nawiedził Sarę, jak powiedział, i uczynił PAN Sarze, jak zapowiedział."
  tags: []
"Rdz21,2":
  text: "Sara poczęła bowiem i urodziła Abrahamowi syna w jego starości w tym czasie, który przepowiedział mu Bóg."
  tags: []
"Rdz21,3":
  text: "Abraham nadał swemu synowi, który mu się urodził, którego mu urodziła Sara, imię Izaak."
  tags: []
"Rdz21,4":
  text: "I Abraham obrzezał swego syna Izaaka, gdy ten miał osiem dni, jak Bóg mu rozkazał."
  tags: []
"Rdz21,5":
  text: "A Abraham miał sto lat, gdy mu się urodził jego syn Izaak."
  tags: []
"Rdz21,6":
  text: "Wtedy Sara powiedziała: Bóg dał mi powód do śmiechu; ktokolwiek o tym usłyszy, będzie się śmiał ze mną."
  tags: []
"Rdz21,7":
  text: "I dodała: Kto by powiedział Abrahamowi, że Sara będzie karmiła piersią dzieci? Gdyż urodziłam mu syna w jego starości."
  tags: []
"Rdz21,8":
  text: "Dziecko rosło i zostało odstawione od piersi. I Abraham wyprawił wielką ucztę w dniu odstawienia Izaaka."
  tags: []
"Rdz21,9":
  text: "Gdy Sara zobaczyła syna Egipcjanki Hagar, którego ta urodziła Abrahamowi, szydzącego;"
  tags: []
"Rdz21,10":
  text: "Powiedziała do Abrahama: Wyrzuć tę niewolnicę i jej syna, bo syn tej niewolnicy nie będzie dziedziczyć z moim synem Izaakiem."
  tags: []
"Rdz21,11":
  text: "Słowa te wydały się Abrahamowi bardzo przykre ze względu na jego syna."
  tags: []
"Rdz21,12":
  text: "Wtedy Bóg powiedział do Abrahama: Niech ci nie będzie przykro z powodu chłopca i twojej niewolnicy. Posłuchaj wszystkiego, co Sara mówi do ciebie, bo w Izaaku będzie nazwane twoje potomstwo."
  tags: []
"Rdz21,13":
  text: "Syna zaś tej niewolnicy również uczynię narodem, bo jest on twoim potomstwem."
  tags: []
"Rdz21,14":
  text: "Abraham wstał więc wcześnie rano, wziął chleb i bukłak wody i dał Hagar, wkładając jej to na ramię, oraz wziął dziecko i odprawił ją. Ona zaś odeszła i błąkała się po pustyni Beer-Szeby."
  tags: []
"Rdz21,15":
  text: "A gdy skończyła się woda w bukłaku, porzuciła dziecko pod jednym z krzewów."
  tags: []
"Rdz21,16":
  text: "Potem odeszła i usiadła naprzeciw niego w odległości strzału z łuku. Mówiła bowiem: Nie będę patrzyła na śmierć dziecka. Usiadła więc naprzeciw niego i zaczęła głośno płakać."
  tags: []
"Rdz21,17":
  text: "I Bóg usłyszał głos chłopca, i Anioł Boga zawołał na Hagar z nieba: Co ci jest, Hagar? Nie bój się, bo Bóg usłyszał głos chłopca tam, gdzie jest."
  tags: []
"Rdz21,18":
  text: "Wstań, podnieś chłopca i weź go za rękę, bo uczynię go wielkim narodem."
  tags: []
"Rdz21,19":
  text: "Wtedy Bóg otworzył jej oczy i zobaczyła studnię z wodą. Poszła więc, napełniła bukłak wodą i dała chłopcu pić."
  tags: []
"Rdz21,20":
  text: "I Bóg był z chłopcem. Urósł i mieszkał na pustyni, i stał się łucznikiem."
  tags: []
"Rdz21,21":
  text: "A mieszkał na pustyni Paran. I jego matka wzięła dla niego żonę z ziemi Egiptu."
  tags: []
"Rdz21,22":
  text: "W tym czasie Abimelek wraz z dowódcą swego wojska Pikolem powiedział do Abrahama: Bóg jest z tobą we wszystkim, co czynisz."
  tags: []
"Rdz21,23":
  text: "Teraz więc przysięgnij mi tu na Boga, że nie postąpisz zdradliwie wobec mnie ani mego syna, ani mego wnuka. Ale według miłosierdzia, które ci okazałem, postąpisz ze mną i z ziemią, w której jesteś przybyszem."
  tags: []
"Rdz21,24":
  text: "Abraham odpowiedział: Przysięgam."
  tags: []
"Rdz21,25":
  text: "I Abraham poskarżył się Abimelekowi z powodu studni z wodą, którą mu przemocą zabrali słudzy Abimeleka."
  tags: []
"Rdz21,26":
  text: "Abimelek powiedział: Nie wiem, kto to uczynił. Ani nie powiedziałeś mi o tym, ani nie słyszałem o tym aż dopiero dziś."
  tags: []
"Rdz21,27":
  text: "Abraham wziął więc owce i woły i dał je Abimelekowi, i obaj zawarli przymierze."
  tags: []
"Rdz21,28":
  text: "I Abraham wydzielił z trzody siedmioro jagniąt."
  tags: []
"Rdz21,29":
  text: "Abimelek zapytał Abrahama: Po co te siedmioro jagniąt, które postawiłeś osobno?"
  tags: []
"Rdz21,30":
  text: "A on odpowiedział: Te siedem owiec weźmiesz z moich rąk, aby były świadectwem, że wykopałem tę studnię."
  tags: []
"Rdz21,31":
  text: "Dlatego nazwano to miejsce Beer-Szeba, bo tam obaj sobie przysięgli."
  tags: []
"Rdz21,32":
  text: "Tak zawarli przymierze w Beer-Szebie. Potem Abimelek i Pikol, dowódca jego wojska, wstali i wrócili do ziemi Filistynów."
  tags: []
"Rdz21,33":
  text: "Abraham zaś zasadził drzewa w Beer-Szebie i wzywał tam imienia PANA, Boga wiecznego."
  tags: []
"Rdz21,34":
  text: "I Abraham gościł w ziemi Filistynów przez wiele dni."
  tags: []
