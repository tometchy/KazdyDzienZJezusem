"Rdz21,1": "A PAN nawiedził Sarę, jak powiedział, i uczynił PAN Sarze, jak zapowiedział."
"Rdz21,2": "Sara poczęła bowiem i urodziła Abrahamowi syna w jego starości w tym czasie, który przepowiedział mu Bóg."
"Rdz21,3": "Abraham nadał swemu synowi, który mu się urodził, którego mu urodziła Sara, imię Izaak."
"Rdz21,4": "I Abraham obrzezał swego syna Izaaka, gdy ten miał osiem dni, jak Bóg mu rozkazał."
"Rdz21,5": "A Abraham miał sto lat, gdy mu się urodził jego syn Izaak."
"Rdz21,6": "Wtedy Sara powiedziała: Bóg dał mi powód do śmiechu; ktokolwiek o tym usłyszy, będzie się śmiał ze mną."
"Rdz21,7": "I dodała: Kto by powiedział Abrahamowi, że Sara będzie karmiła piersią dzieci? Gdyż urodziłam mu syna w jego starości."
"Rdz21,8": "Dziecko rosło i zostało odstawione od piersi. I Abraham wyprawił wielką ucztę w dniu odstawienia Izaaka."
"Rdz21,9": "Gdy Sara zobaczyła syna Egipcjanki Hagar, którego ta urodziła Abrahamowi, szydzącego;"
"Rdz21,10": "Powiedziała do Abrahama: Wyrzuć tę niewolnicę i jej syna, bo syn tej niewolnicy nie będzie dziedziczyć z moim synem Izaakiem."
"Rdz21,11": "Słowa te wydały się Abrahamowi bardzo przykre ze względu na jego syna."
"Rdz21,12": "Wtedy Bóg powiedział do Abrahama: Niech ci nie będzie przykro z powodu chłopca i twojej niewolnicy. Posłuchaj wszystkiego, co Sara mówi do ciebie, bo w Izaaku będzie nazwane twoje potomstwo."
"Rdz21,13": "Syna zaś tej niewolnicy również uczynię narodem, bo jest on twoim potomstwem."
"Rdz21,14": "Abraham wstał więc wcześnie rano, wziął chleb i bukłak wody i dał Hagar, wkładając jej to na ramię, oraz wziął dziecko i odprawił ją. Ona zaś odeszła i błąkała się po pustyni Beer-Szeby."
"Rdz21,15": "A gdy skończyła się woda w bukłaku, porzuciła dziecko pod jednym z krzewów."
"Rdz21,16": "Potem odeszła i usiadła naprzeciw niego w odległości strzału z łuku. Mówiła bowiem: Nie będę patrzyła na śmierć dziecka. Usiadła więc naprzeciw niego i zaczęła głośno płakać."
"Rdz21,17": "I Bóg usłyszał głos chłopca, i Anioł Boga zawołał na Hagar z nieba: Co ci jest, Hagar? Nie bój się, bo Bóg usłyszał głos chłopca tam, gdzie jest."
"Rdz21,18": "Wstań, podnieś chłopca i weź go za rękę, bo uczynię go wielkim narodem."
"Rdz21,19": "Wtedy Bóg otworzył jej oczy i zobaczyła studnię z wodą. Poszła więc, napełniła bukłak wodą i dała chłopcu pić."
"Rdz21,20": "I Bóg był z chłopcem. Urósł i mieszkał na pustyni, i stał się łucznikiem."
"Rdz21,21": "A mieszkał na pustyni Paran. I jego matka wzięła dla niego żonę z ziemi Egiptu."
"Rdz21,22": "W tym czasie Abimelek wraz z dowódcą swego wojska Pikolem powiedział do Abrahama: Bóg jest z tobą we wszystkim, co czynisz."
"Rdz21,23": "Teraz więc przysięgnij mi tu na Boga, że nie postąpisz zdradliwie wobec mnie ani mego syna, ani mego wnuka. Ale według miłosierdzia, które ci okazałem, postąpisz ze mną i z ziemią, w której jesteś przybyszem."
"Rdz21,24": "Abraham odpowiedział: Przysięgam."
"Rdz21,25": "I Abraham poskarżył się Abimelekowi z powodu studni z wodą, którą mu przemocą zabrali słudzy Abimeleka."
"Rdz21,26": "Abimelek powiedział: Nie wiem, kto to uczynił. Ani nie powiedziałeś mi o tym, ani nie słyszałem o tym aż dopiero dziś."
"Rdz21,27": "Abraham wziął więc owce i woły i dał je Abimelekowi, i obaj zawarli przymierze."
"Rdz21,28": "I Abraham wydzielił z trzody siedmioro jagniąt."
"Rdz21,29": "Abimelek zapytał Abrahama: Po co te siedmioro jagniąt, które postawiłeś osobno?"
"Rdz21,30": "A on odpowiedział: Te siedem owiec weźmiesz z moich rąk, aby były świadectwem, że wykopałem tę studnię."
"Rdz21,31": "Dlatego nazwano to miejsce Beer-Szeba, bo tam obaj sobie przysięgli."
"Rdz21,32": "Tak zawarli przymierze w Beer-Szebie. Potem Abimelek i Pikol, dowódca jego wojska, wstali i wrócili do ziemi Filistynów."
"Rdz21,33": "Abraham zaś zasadził drzewa w Beer-Szebie i wzywał tam imienia PANA, Boga wiecznego."
"Rdz21,34": "I Abraham gościł w ziemi Filistynów przez wiele dni."
