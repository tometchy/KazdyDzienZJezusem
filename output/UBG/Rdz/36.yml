"Rdz36,1": "To są dzieje rodu Ezawa, czyli Edomu."
"Rdz36,2": "Ezaw pojął swoje żony z córek Kanaanu: Adę, córkę Elona Chetyty, Oholibamę, córkę Any, córki Sibeona Chiwwity;"
"Rdz36,3": "I Basmat, córkę Izmaela, siostrę Nebajota."
"Rdz36,4": "I Ada urodziła Ezawowi Elifaza, a Basmat urodziła Rehuela."
"Rdz36,5": "Oholibama urodziła Jeusza, Jalama i Koracha. To są synowie Ezawa, którzy mu się urodzili w ziemi Kanaan."
"Rdz36,6": "I Ezaw wziął swoje żony, synów, córki i wszystkich domowników, swoje stada, wszystkie bydła i całe swoje mienie, które zdobył w ziemi Kanaan, i odszedł od swego brata Jakuba do innej ziemi;"
"Rdz36,7": "Bo ich majątek był tak wielki, że nie mogli mieszkać razem, i ziemia, na której przebywali, nie mogła ich utrzymać z powodu mnóstwa ich stad."
"Rdz36,8": "I Ezaw zamieszkał na górze Seir. Ezaw to Edom."
"Rdz36,9": "A to są dzieje rodu Ezawa, ojca Edomitów, na górze Seir."
"Rdz36,10": "I to są imiona synów Ezawa: Elifaz, syn Ady, żony Ezawa, Rehuel, syn Basmat, żony Ezawa."
"Rdz36,11": "Synami zaś Elifaza byli: Teman, Omar, Sefo, Gatam i Kenaz."
"Rdz36,12": "A Timna była nałożnicą Elifaza, syna Ezawa, i urodziła Elifazowi Amaleka. To są synowie Ady, żony Ezawa."
"Rdz36,13": "To są synowie Rehuela: Nachat, Zerach, Szamma i Mizza. Byli oni synami Basmat, żony Ezawa."
"Rdz36,14": "A ci byli synami żony Ezawa Oholibamy, córki Any, córki Sibeona. Urodziła ona Ezawowi Jeusza, Jalama i Koracha."
"Rdz36,15": "To są książęta spośród synów Ezawa, synowie Elifaza, pierworodnego Ezawa: książę Teman, książę Omar, książę Sefo, książę Kenaz."
"Rdz36,16": "Książę Korach, książę Gatam, książę Amalek. Ci książęta pochodzą z Elifaza, w ziemi Edom, to są synowie Ady."
"Rdz36,17": "To są synowie Rehuela, syna Ezawa: książę Nachat, książę Zerach, książę Szamma, książę Mizza. Ci książęta pochodzą z Rehuela, w ziemi Edom. Oni są synami Basmat, żony Ezawa."
"Rdz36,18": "A to są synowie Oholibamy, żony Ezawa: książę Jeusz, książę Jalam, książę Korach. Ci książęta pochodzą z Oholibamy, córki Any, żony Ezawa."
"Rdz36,19": "To są synowie Ezawa, czyli Edom, i to są ich książęta."
"Rdz36,20": "A to są synowie Seira, Choryty, mieszkańcy tej ziemi: Lotan, Szobal, Sibeon i Ana;"
"Rdz36,21": "Diszon, Eser i Diszan. To są książęta Chorytów, synowie Seira w ziemi Edom."
"Rdz36,22": "Synami Lotana byli: Chori i Hemam; a siostrą Lotana była Tamna."
"Rdz36,23": "Synowie zaś Szobala: Alwan, Manachat, Ebal, Szefo i Onam."
"Rdz36,24": "Synami Sibeona są Ajja i Ana. To ten Ana, który znalazł muły na pustyni, gdy pasł osły swego ojca Sibeona."
"Rdz36,25": "A to są dzieci Any: Diszon i Oholibama, córka Any."
"Rdz36,26": "I synowie Diszona: Chemdan, Eszban, Jitran i Keran."
"Rdz36,27": "To są synowie Esera: Bilhan, Zaawan i Akan."
"Rdz36,28": "I synowie Diszana: Us i Aran."
"Rdz36,29": "To są książęta Chorytów: książę Lotan, książę Szobal, książę Sibeon, książę Ana."
"Rdz36,30": "Książę Diszon, książę Eser, książę Diszan. Są to książęta Chorytów, według ich księstw, w ziemi Seir."
"Rdz36,31": "To są królowie, którzy panowali w ziemi Edom, zanim panował król nad synami Izraela."
"Rdz36,32": "W Edomie panował Bela, syn Beora, a nazwa jego miasta – Dinhaba."
"Rdz36,33": "I Bela umarł, a w jego miejsce panował Jobab, syn Zeracha z Bosry."
"Rdz36,34": "Jobab umarł, a w jego miejsce panował Chuszam z ziemi Temanitów."
"Rdz36,35": "Chuszam umarł, a w jego miejsce panował Hadad, syn Bedada, który pokonał Midianitów na polu Moab, a nazwa jego miasta – Awit."
"Rdz36,36": "Hadad umarł, a w jego miejsce panował Samla z Masreki."
"Rdz36,37": "Samla umarł, a w jego miejsce panował Saul z Rechobot nad Rzeką."
"Rdz36,38": "Saul umarł, a w jego miejsce panował Baalchanan, syn Akbora."
"Rdz36,39": "Baalchanan, syn Akbora, umarł, a w jego miejsce panował Hadar, a nazwa jego miasta – Pahu, a imię jego żony to Mehetabel, była to córka Matredy, córki Mezahaba."
"Rdz36,40": "To są imiona książąt Ezawa, według ich rodów i miejscowości i według ich imion: książę Timna, książę Alwa, książę Jetet."
"Rdz36,41": "Książę Oholibama, książę Ela, książę Pinon."
"Rdz36,42": "Książę Kenaz, książę Teman, książę Mibsar."
"Rdz36,43": "Książę Magdiel, książę Iram. To są książęta Edomu według miejsca ich zamieszkania w ziemi ich posiadłości. To jest Ezaw, ojciec Edomitów."
