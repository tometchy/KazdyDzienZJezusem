"Rdz36,1":
  text: "To są dzieje rodu Ezawa, czyli Edomu."
  tags: []
"Rdz36,2":
  text: "Ezaw pojął swoje żony z córek Kanaanu: Adę, córkę Elona Chetyty, Oholibamę, córkę Any, córki Sibeona Chiwwity;"
  tags: []
"Rdz36,3":
  text: "I Basmat, córkę Izmaela, siostrę Nebajota."
  tags: []
"Rdz36,4":
  text: "I Ada urodziła Ezawowi Elifaza, a Basmat urodziła Rehuela."
  tags: []
"Rdz36,5":
  text: "Oholibama urodziła Jeusza, Jalama i Koracha. To są synowie Ezawa, którzy mu się urodzili w ziemi Kanaan."
  tags: []
"Rdz36,6":
  text: "I Ezaw wziął swoje żony, synów, córki i wszystkich domowników, swoje stada, wszystkie bydła i całe swoje mienie, które zdobył w ziemi Kanaan, i odszedł od swego brata Jakuba do innej ziemi;"
  tags: []
"Rdz36,7":
  text: "Bo ich majątek był tak wielki, że nie mogli mieszkać razem, i ziemia, na której przebywali, nie mogła ich utrzymać z powodu mnóstwa ich stad."
  tags: []
"Rdz36,8":
  text: "I Ezaw zamieszkał na górze Seir. Ezaw to Edom."
  tags: []
"Rdz36,9":
  text: "A to są dzieje rodu Ezawa, ojca Edomitów, na górze Seir."
  tags: []
"Rdz36,10":
  text: "I to są imiona synów Ezawa: Elifaz, syn Ady, żony Ezawa, Rehuel, syn Basmat, żony Ezawa."
  tags: []
"Rdz36,11":
  text: "Synami zaś Elifaza byli: Teman, Omar, Sefo, Gatam i Kenaz."
  tags: []
"Rdz36,12":
  text: "A Timna była nałożnicą Elifaza, syna Ezawa, i urodziła Elifazowi Amaleka. To są synowie Ady, żony Ezawa."
  tags: []
"Rdz36,13":
  text: "To są synowie Rehuela: Nachat, Zerach, Szamma i Mizza. Byli oni synami Basmat, żony Ezawa."
  tags: []
"Rdz36,14":
  text: "A ci byli synami żony Ezawa Oholibamy, córki Any, córki Sibeona. Urodziła ona Ezawowi Jeusza, Jalama i Koracha."
  tags: []
"Rdz36,15":
  text: "To są książęta spośród synów Ezawa, synowie Elifaza, pierworodnego Ezawa: książę Teman, książę Omar, książę Sefo, książę Kenaz."
  tags: []
"Rdz36,16":
  text: "Książę Korach, książę Gatam, książę Amalek. Ci książęta pochodzą z Elifaza, w ziemi Edom, to są synowie Ady."
  tags: []
"Rdz36,17":
  text: "To są synowie Rehuela, syna Ezawa: książę Nachat, książę Zerach, książę Szamma, książę Mizza. Ci książęta pochodzą z Rehuela, w ziemi Edom. Oni są synami Basmat, żony Ezawa."
  tags: []
"Rdz36,18":
  text: "A to są synowie Oholibamy, żony Ezawa: książę Jeusz, książę Jalam, książę Korach. Ci książęta pochodzą z Oholibamy, córki Any, żony Ezawa."
  tags: []
"Rdz36,19":
  text: "To są synowie Ezawa, czyli Edom, i to są ich książęta."
  tags: []
"Rdz36,20":
  text: "A to są synowie Seira, Choryty, mieszkańcy tej ziemi: Lotan, Szobal, Sibeon i Ana;"
  tags: []
"Rdz36,21":
  text: "Diszon, Eser i Diszan. To są książęta Chorytów, synowie Seira w ziemi Edom."
  tags: []
"Rdz36,22":
  text: "Synami Lotana byli: Chori i Hemam; a siostrą Lotana była Tamna."
  tags: []
"Rdz36,23":
  text: "Synowie zaś Szobala: Alwan, Manachat, Ebal, Szefo i Onam."
  tags: []
"Rdz36,24":
  text: "Synami Sibeona są Ajja i Ana. To ten Ana, który znalazł muły na pustyni, gdy pasł osły swego ojca Sibeona."
  tags: []
"Rdz36,25":
  text: "A to są dzieci Any: Diszon i Oholibama, córka Any."
  tags: []
"Rdz36,26":
  text: "I synowie Diszona: Chemdan, Eszban, Jitran i Keran."
  tags: []
"Rdz36,27":
  text: "To są synowie Esera: Bilhan, Zaawan i Akan."
  tags: []
"Rdz36,28":
  text: "I synowie Diszana: Us i Aran."
  tags: []
"Rdz36,29":
  text: "To są książęta Chorytów: książę Lotan, książę Szobal, książę Sibeon, książę Ana."
  tags: []
"Rdz36,30":
  text: "Książę Diszon, książę Eser, książę Diszan. Są to książęta Chorytów, według ich księstw, w ziemi Seir."
  tags: []
"Rdz36,31":
  text: "To są królowie, którzy panowali w ziemi Edom, zanim panował król nad synami Izraela."
  tags: []
"Rdz36,32":
  text: "W Edomie panował Bela, syn Beora, a nazwa jego miasta – Dinhaba."
  tags: []
"Rdz36,33":
  text: "I Bela umarł, a w jego miejsce panował Jobab, syn Zeracha z Bosry."
  tags: []
"Rdz36,34":
  text: "Jobab umarł, a w jego miejsce panował Chuszam z ziemi Temanitów."
  tags: []
"Rdz36,35":
  text: "Chuszam umarł, a w jego miejsce panował Hadad, syn Bedada, który pokonał Midianitów na polu Moab, a nazwa jego miasta – Awit."
  tags: []
"Rdz36,36":
  text: "Hadad umarł, a w jego miejsce panował Samla z Masreki."
  tags: []
"Rdz36,37":
  text: "Samla umarł, a w jego miejsce panował Saul z Rechobot nad Rzeką."
  tags: []
"Rdz36,38":
  text: "Saul umarł, a w jego miejsce panował Baalchanan, syn Akbora."
  tags: []
"Rdz36,39":
  text: "Baalchanan, syn Akbora, umarł, a w jego miejsce panował Hadar, a nazwa jego miasta – Pahu, a imię jego żony to Mehetabel, była to córka Matredy, córki Mezahaba."
  tags: []
"Rdz36,40":
  text: "To są imiona książąt Ezawa, według ich rodów i miejscowości i według ich imion: książę Timna, książę Alwa, książę Jetet."
  tags: []
"Rdz36,41":
  text: "Książę Oholibama, książę Ela, książę Pinon."
  tags: []
"Rdz36,42":
  text: "Książę Kenaz, książę Teman, książę Mibsar."
  tags: []
"Rdz36,43":
  text: "Książę Magdiel, książę Iram. To są książęta Edomu według miejsca ich zamieszkania w ziemi ich posiadłości. To jest Ezaw, ojciec Edomitów."
  tags: []
