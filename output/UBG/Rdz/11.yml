"Rdz11,1":
  text: "Na całej ziemi był jeden język i jedna mowa."
  tags: []
"Rdz11,2":
  text: "A gdy wędrowali od wschodu, znaleźli równinę w ziemi Szinear i tam mieszkali."
  tags: []
"Rdz11,3":
  text: "I mówili jeden do drugiego: Chodźcie, zróbmy cegły i wypalmy je w ogniu; i mieli cegłę zamiast kamienia, a smołę zamiast zaprawy."
  tags: []
"Rdz11,4":
  text: "Potem powiedzieli: Chodźcie, zbudujmy sobie miasto i wieżę, której szczyt sięgałby do nieba, i uczyńmy sobie imię, abyśmy się nie rozproszyli po powierzchni całej ziemi."
  tags: []
"Rdz11,5":
  text: "A PAN zstąpił, aby zobaczyć miasto i wieżę, które synowie ludzcy budowali."
  tags: []
"Rdz11,6":
  text: "I PAN powiedział: Oto lud jest jeden i wszyscy mają jeden język, a jest to dopiero początek ich dzieła. Teraz nic nie powstrzyma ich od wykonania tego, co zamierzają uczynić."
  tags: []
"Rdz11,7":
  text: "Zstąpmy więc i pomieszajmy tam ich język, aby jeden nie zrozumiał języka drugiego."
  tags: []
"Rdz11,8":
  text: "I tak PAN rozproszył ich stamtąd po całej powierzchni ziemi; i przestali budować miasto."
  tags: []
"Rdz11,9":
  text: "Dlatego nazwano je Babel, bo tam PAN pomieszał język całej ziemi. I stamtąd PAN rozproszył ich po całej powierzchni ziemi."
  tags: []
"Rdz11,10":
  text: "To są dzieje rodu Sema: Gdy Sem miał sto lat, spłodził Arpachszada, dwa lata po potopie."
  tags: []
"Rdz11,11":
  text: "Po spłodzeniu Arpachszada Sem żył pięćset lat i spłodził synów i córki."
  tags: []
"Rdz11,12":
  text: "Arpachszad żył trzydzieści pięć lat i spłodził Szelacha."
  tags: []
"Rdz11,13":
  text: "Po spłodzeniu Szelacha Arpachszad żył czterysta trzy lata i spłodził synów i córki."
  tags: []
"Rdz11,14":
  text: "Szelach żył trzydzieści lat i spłodził Ebera."
  tags: []
"Rdz11,15":
  text: "Po spłodzeniu Ebera Szelach żył czterysta trzy lata i spłodził synów i córki."
  tags: []
"Rdz11,16":
  text: "Eber żył trzydzieści cztery lata i spłodził Pelega."
  tags: []
"Rdz11,17":
  text: "Po spłodzeniu Pelega Eber żył czterysta trzydzieści lat i spłodził synów i córki."
  tags: []
"Rdz11,18":
  text: "Peleg żył trzydzieści lat i spłodził Reu."
  tags: []
"Rdz11,19":
  text: "Po spłodzeniu Reu Peleg żył dwieście dziewięć lat i spłodził synów i córki."
  tags: []
"Rdz11,20":
  text: "Reu żył trzydzieści dwa lata i spłodził Seruga."
  tags: []
"Rdz11,21":
  text: "Po spłodzeniu Seruga Reu żył dwieście siedem lat i spłodził synów i córki."
  tags: []
"Rdz11,22":
  text: "Serug żył trzydzieści lat i spłodził Nachora."
  tags: []
"Rdz11,23":
  text: "Po spłodzeniu Nachora Serug żył dwieście lat i spłodził synów i córki."
  tags: []
"Rdz11,24":
  text: "Nachor żył dwadzieścia dziewięć lat i spłodził Teracha."
  tags: []
"Rdz11,25":
  text: "Po spłodzeniu Teracha Nachor żył sto dziewiętnaście lat i spłodził synów i córki."
  tags: []
"Rdz11,26":
  text: "Terach żył siedemdziesiąt lat i spłodził Abrama, Nachora i Harana."
  tags: []
"Rdz11,27":
  text: "A to są rody Teracha: Terach spłodził Abrama, Nachora i Harana. Haran zaś spłodził Lota."
  tags: []
"Rdz11,28":
  text: "I Haran umarł za życia swego ojca Teracha w ziemi swego urodzenia, w Ur chaldejskim."
  tags: []
"Rdz11,29":
  text: "I Abram, i Nachor pojęli sobie żony: imię żony Abrama było Saraj, a imię żony Nachora – Milka. Była ona córką Harana, ojca Milki i Jeski."
  tags: []
"Rdz11,30":
  text: "A Saraj była niepłodna, nie miała dzieci."
  tags: []
"Rdz11,31":
  text: "I Terach wziął swego syna Abrama i swego wnuka Lota, syna Harana, i swoją synową Saraj, żonę swego syna Abrama; i wyruszyli razem z Ur chaldejskiego, aby udać się do ziemi Kanaan. Gdy przybyli do Charanu, zamieszkali tam."
  tags: []
"Rdz11,32":
  text: "I dni Teracha było dwieście pięć lat, i umarł w Charanie."
  tags: []
