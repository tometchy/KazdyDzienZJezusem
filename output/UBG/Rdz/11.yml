"Rdz11,1": "Na całej ziemi był jeden język i jedna mowa."
"Rdz11,2": "A gdy wędrowali od wschodu, znaleźli równinę w ziemi Szinear i tam mieszkali."
"Rdz11,3": "I mówili jeden do drugiego: Chodźcie, zróbmy cegły i wypalmy je w ogniu; i mieli cegłę zamiast kamienia, a smołę zamiast zaprawy."
"Rdz11,4": "Potem powiedzieli: Chodźcie, zbudujmy sobie miasto i wieżę, której szczyt sięgałby do nieba, i uczyńmy sobie imię, abyśmy się nie rozproszyli po powierzchni całej ziemi."
"Rdz11,5": "A PAN zstąpił, aby zobaczyć miasto i wieżę, które synowie ludzcy budowali."
"Rdz11,6": "I PAN powiedział: Oto lud jest jeden i wszyscy mają jeden język, a jest to dopiero początek ich dzieła. Teraz nic nie powstrzyma ich od wykonania tego, co zamierzają uczynić."
"Rdz11,7": "Zstąpmy więc i pomieszajmy tam ich język, aby jeden nie zrozumiał języka drugiego."
"Rdz11,8": "I tak PAN rozproszył ich stamtąd po całej powierzchni ziemi; i przestali budować miasto."
"Rdz11,9": "Dlatego nazwano je Babel, bo tam PAN pomieszał język całej ziemi. I stamtąd PAN rozproszył ich po całej powierzchni ziemi."
"Rdz11,10": "To są dzieje rodu Sema: Gdy Sem miał sto lat, spłodził Arpachszada, dwa lata po potopie."
"Rdz11,11": "Po spłodzeniu Arpachszada Sem żył pięćset lat i spłodził synów i córki."
"Rdz11,12": "Arpachszad żył trzydzieści pięć lat i spłodził Szelacha."
"Rdz11,13": "Po spłodzeniu Szelacha Arpachszad żył czterysta trzy lata i spłodził synów i córki."
"Rdz11,14": "Szelach żył trzydzieści lat i spłodził Ebera."
"Rdz11,15": "Po spłodzeniu Ebera Szelach żył czterysta trzy lata i spłodził synów i córki."
"Rdz11,16": "Eber żył trzydzieści cztery lata i spłodził Pelega."
"Rdz11,17": "Po spłodzeniu Pelega Eber żył czterysta trzydzieści lat i spłodził synów i córki."
"Rdz11,18": "Peleg żył trzydzieści lat i spłodził Reu."
"Rdz11,19": "Po spłodzeniu Reu Peleg żył dwieście dziewięć lat i spłodził synów i córki."
"Rdz11,20": "Reu żył trzydzieści dwa lata i spłodził Seruga."
"Rdz11,21": "Po spłodzeniu Seruga Reu żył dwieście siedem lat i spłodził synów i córki."
"Rdz11,22": "Serug żył trzydzieści lat i spłodził Nachora."
"Rdz11,23": "Po spłodzeniu Nachora Serug żył dwieście lat i spłodził synów i córki."
"Rdz11,24": "Nachor żył dwadzieścia dziewięć lat i spłodził Teracha."
"Rdz11,25": "Po spłodzeniu Teracha Nachor żył sto dziewiętnaście lat i spłodził synów i córki."
"Rdz11,26": "Terach żył siedemdziesiąt lat i spłodził Abrama, Nachora i Harana."
"Rdz11,27": "A to są rody Teracha: Terach spłodził Abrama, Nachora i Harana. Haran zaś spłodził Lota."
"Rdz11,28": "I Haran umarł za życia swego ojca Teracha w ziemi swego urodzenia, w Ur chaldejskim."
"Rdz11,29": "I Abram, i Nachor pojęli sobie żony: imię żony Abrama było Saraj, a imię żony Nachora – Milka. Była ona córką Harana, ojca Milki i Jeski."
"Rdz11,30": "A Saraj była niepłodna, nie miała dzieci."
"Rdz11,31": "I Terach wziął swego syna Abrama i swego wnuka Lota, syna Harana, i swoją synową Saraj, żonę swego syna Abrama; i wyruszyli razem z Ur chaldejskiego, aby udać się do ziemi Kanaan. Gdy przybyli do Charanu, zamieszkali tam."
"Rdz11,32": "I dni Teracha było dwieście pięć lat, i umarł w Charanie."
