"Rdz13,1":
  text: "Tak więc Abram wyszedł z Egiptu, on i jego żona, i wszystko, co miał, i Lot z nim, i udali się ku południu."
  tags: []
"Rdz13,2":
  text: "A Abram był bardzo bogaty w bydło, srebro i złoto."
  tags: []
"Rdz13,3":
  text: "I szedł, robiąc postoje, od południa aż do Betel, do tego miejsca, gdzie poprzednio był jego namiot, między Betel a Aj;"
  tags: []
"Rdz13,4":
  text: "Do miejsca, gdzie poprzednio zbudował ołtarz. Tam wezwał Abram imienia PANA."
  tags: []
"Rdz13,5":
  text: "Lot, który szedł z Abramem, również miał owce, woły i namioty."
  tags: []
"Rdz13,6":
  text: "A ziemia ta nie mogła ich pomieścić, żeby mieszkali razem, bo ich majątek był tak wielki, że nie mogli mieszkać razem."
  tags: []
"Rdz13,7":
  text: "I wynikła sprzeczka między pasterzami stad Abrama a pasterzami stad Lota. Kananejczycy i Peryzzyci mieszkali wówczas na tej ziemi."
  tags: []
"Rdz13,8":
  text: "Abram powiedział więc do Lota: Proszę, niech nie będzie sporu między mną a tobą, także między moimi pasterzami a twoimi pasterzami, bo jesteśmy braćmi."
  tags: []
"Rdz13,9":
  text: "Czyż cała ziemia nie stoi przed tobą? Odłącz się, proszę, ode mnie. Jeśli pójdziesz w lewo, ja pójdę w prawo, a jeśli ty pójdziesz w prawo, ja pójdę w lewo."
  tags: []
"Rdz13,10":
  text: "Wtedy Lot podniósł swe oczy i zobaczył, że cała równina nad Jordanem była dobrze nawodniona – zanim PAN zniszczył Sodomę i Gomorę – jak ogród PANA, jak ziemia Egiptu, aż do Zoar."
  tags: []
"Rdz13,11":
  text: "Lot wybrał więc sobie całą tę równinę nad Jordanem i udał się na wschód. I rozłączyli się bracia jeden od drugiego."
  tags: []
"Rdz13,12":
  text: "Abram mieszkał w ziemi Kanaan, a Lot mieszkał w miastach tej równiny i rozbił swój namiot aż do Sodomy."
  tags: []
"Rdz13,13":
  text: "Ale mężczyźni Sodomy byli źli i wielkimi grzesznikami przed PANEM."
  tags: []
"Rdz13,14":
  text: "I PAN powiedział do Abrama, gdy Lot już odłączył się od niego: Podnieś teraz swe oczy i spójrz z miejsca, na którym teraz jesteś, na północ i na południe, na wschód i na zachód."
  tags: []
"Rdz13,15":
  text: "Bo całą ziemię, którą widzisz, dam tobie i twemu potomstwu na wieki."
  tags: []
"Rdz13,16":
  text: "I rozmnożę twoje potomstwo jak proch ziemi, tak że jeśli ktoś będzie mógł zliczyć proch ziemi, to również twoje potomstwo będzie policzone."
  tags: []
"Rdz13,17":
  text: "Wstań i przejdź tę ziemię wzdłuż i wszerz, bo dam ci ją."
  tags: []
"Rdz13,18":
  text: "Abram zwinął więc namiot, przyszedł i mieszkał na równinach Mamre, które są w Hebronie, i tam zbudował ołtarz dla PANA."
  tags: []
