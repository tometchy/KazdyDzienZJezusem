"Rdz13,1": "Tak więc Abram wyszedł z Egiptu, on i jego żona, i wszystko, co miał, i Lot z nim, i udali się ku południu."
"Rdz13,2": "A Abram był bardzo bogaty w bydło, srebro i złoto."
"Rdz13,3": "I szedł, robiąc postoje, od południa aż do Betel, do tego miejsca, gdzie poprzednio był jego namiot, między Betel a Aj;"
"Rdz13,4": "Do miejsca, gdzie poprzednio zbudował ołtarz. Tam wezwał Abram imienia PANA."
"Rdz13,5": "Lot, który szedł z Abramem, również miał owce, woły i namioty."
"Rdz13,6": "A ziemia ta nie mogła ich pomieścić, żeby mieszkali razem, bo ich majątek był tak wielki, że nie mogli mieszkać razem."
"Rdz13,7": "I wynikła sprzeczka między pasterzami stad Abrama a pasterzami stad Lota. Kananejczycy i Peryzzyci mieszkali wówczas na tej ziemi."
"Rdz13,8": "Abram powiedział więc do Lota: Proszę, niech nie będzie sporu między mną a tobą, także między moimi pasterzami a twoimi pasterzami, bo jesteśmy braćmi."
"Rdz13,9": "Czyż cała ziemia nie stoi przed tobą? Odłącz się, proszę, ode mnie. Jeśli pójdziesz w lewo, ja pójdę w prawo, a jeśli ty pójdziesz w prawo, ja pójdę w lewo."
"Rdz13,10": "Wtedy Lot podniósł swe oczy i zobaczył, że cała równina nad Jordanem była dobrze nawodniona – zanim PAN zniszczył Sodomę i Gomorę – jak ogród PANA, jak ziemia Egiptu, aż do Zoar."
"Rdz13,11": "Lot wybrał więc sobie całą tę równinę nad Jordanem i udał się na wschód. I rozłączyli się bracia jeden od drugiego."
"Rdz13,12": "Abram mieszkał w ziemi Kanaan, a Lot mieszkał w miastach tej równiny i rozbił swój namiot aż do Sodomy."
"Rdz13,13": "Ale mężczyźni Sodomy byli źli i wielkimi grzesznikami przed PANEM."
"Rdz13,14": "I PAN powiedział do Abrama, gdy Lot już odłączył się od niego: Podnieś teraz swe oczy i spójrz z miejsca, na którym teraz jesteś, na północ i na południe, na wschód i na zachód."
"Rdz13,15": "Bo całą ziemię, którą widzisz, dam tobie i twemu potomstwu na wieki."
"Rdz13,16": "I rozmnożę twoje potomstwo jak proch ziemi, tak że jeśli ktoś będzie mógł zliczyć proch ziemi, to również twoje potomstwo będzie policzone."
"Rdz13,17": "Wstań i przejdź tę ziemię wzdłuż i wszerz, bo dam ci ją."
"Rdz13,18": "Abram zwinął więc namiot, przyszedł i mieszkał na równinach Mamre, które są w Hebronie, i tam zbudował ołtarz dla PANA."
