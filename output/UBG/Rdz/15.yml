"Rdz15,1": "Po tych wydarzeniach słowo PANA doszło do Abrama w widzeniu: Nie bój się, Abramie. Ja jestem twoją tarczą i twoją niezmiernie obfitą nagrodą."
"Rdz15,2": "I Abram powiedział: Panie BOŻE, co mi dasz, skoro ja jestem bezdzietny, a szafarzem mego domu jest ten Damasceńczyk Eliezer?"
"Rdz15,3": "Abram dodał: Oto nie dałeś mi potomka, a sługa urodzony w moim domu będzie moim dziedzicem."
"Rdz15,4": "A oto dotarło do niego słowo PANA: Nie on będzie twoim dziedzicem, lecz ten, który wyjdzie z twego wnętrza, będzie twoim dziedzicem."
"Rdz15,5": "Potem wyprowadził go na dwór i powiedział: Spójrz teraz na niebo i policz gwiazdy, jeśli będziesz mógł je policzyć; i powiedział mu: Takie będzie twoje potomstwo."
"Rdz15,6": "I uwierzył PANU, i poczytano mu to za sprawiedliwość."
"Rdz15,7": "Potem powiedział do niego: Ja jestem PANEM, który cię wyprowadził z Ur chaldejskiego, aby ci dać tę ziemię w posiadanie."
"Rdz15,8": "Abram zapytał: Panie BOŻE, po czym poznam, że ją odziedziczę?"
"Rdz15,9": "I odpowiedział mu: Weź dla mnie trzyletnią jałówkę, trzyletnią kozę i trzyletniego barana, a także synogarlicę i pisklę gołębia."
"Rdz15,10": "Wziął więc to wszystko i rozciął na połowy; a jedną część położył naprzeciwko drugiej, ale ptaków nie rozcinał."
"Rdz15,11": "Kiedy zleciało się ptactwo do tej padliny, Abram je odganiał."
"Rdz15,12": "Gdy słońce zachodziło, głęboki sen ogarnął Abrama i oto groza wielkiej ciemności zapadła na niego."
"Rdz15,13": "I PAN powiedział do Abrama: Wiedz o tym dobrze, że twoje potomstwo będzie przybyszem w cudzej ziemi i wezmą je w niewolę, i będzie uciskane przez czterysta lat."
"Rdz15,14": "A ja osądzę ten naród, któremu będą służyć; a potem wyjdą stamtąd z wielkim dobytkiem."
"Rdz15,15": "Ale ty odejdziesz w pokoju do twoich ojców i będziesz pochowany w dobrej starości."
"Rdz15,16": "A w czwartym pokoleniu wrócą tutaj, bo jeszcze nie dopełniła się nieprawość Amorytów."
"Rdz15,17": "Gdy słońce zaszło i nastała ciemność, oto ukazał się dymiący piec i ognista pochodnia, która przechodziła między tymi połowami zwierząt."
"Rdz15,18": "W tym właśnie dniu PAN zawarł przymierze z Abramem, mówiąc: Twemu potomstwu dam tę ziemię, od rzeki Egiptu aż do wielkiej rzeki, rzeki Eufrat;"
"Rdz15,19": "Kenitów, Kenizytów i Kadmonitów;"
"Rdz15,20": "Chetytów, Peryzzytów i Refaitów;"
"Rdz15,21": "Amorytów, Kananejczyków, Girgaszytów i Jebusytów."
