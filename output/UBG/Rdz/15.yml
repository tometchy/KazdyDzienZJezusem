"Rdz15,1":
  text: "Po tych wydarzeniach słowo PANA doszło do Abrama w widzeniu: Nie bój się, Abramie. Ja jestem twoją tarczą i twoją niezmiernie obfitą nagrodą."
  tags: []
"Rdz15,2":
  text: "I Abram powiedział: Panie BOŻE, co mi dasz, skoro ja jestem bezdzietny, a szafarzem mego domu jest ten Damasceńczyk Eliezer?"
  tags: []
"Rdz15,3":
  text: "Abram dodał: Oto nie dałeś mi potomka, a sługa urodzony w moim domu będzie moim dziedzicem."
  tags: []
"Rdz15,4":
  text: "A oto dotarło do niego słowo PANA: Nie on będzie twoim dziedzicem, lecz ten, który wyjdzie z twego wnętrza, będzie twoim dziedzicem."
  tags: []
"Rdz15,5":
  text: "Potem wyprowadził go na dwór i powiedział: Spójrz teraz na niebo i policz gwiazdy, jeśli będziesz mógł je policzyć; i powiedział mu: Takie będzie twoje potomstwo."
  tags: []
"Rdz15,6":
  text: "I uwierzył PANU, i poczytano mu to za sprawiedliwość."
  tags: []
"Rdz15,7":
  text: "Potem powiedział do niego: Ja jestem PANEM, który cię wyprowadził z Ur chaldejskiego, aby ci dać tę ziemię w posiadanie."
  tags: []
"Rdz15,8":
  text: "Abram zapytał: Panie BOŻE, po czym poznam, że ją odziedziczę?"
  tags: []
"Rdz15,9":
  text: "I odpowiedział mu: Weź dla mnie trzyletnią jałówkę, trzyletnią kozę i trzyletniego barana, a także synogarlicę i pisklę gołębia."
  tags: []
"Rdz15,10":
  text: "Wziął więc to wszystko i rozciął na połowy; a jedną część położył naprzeciwko drugiej, ale ptaków nie rozcinał."
  tags: []
"Rdz15,11":
  text: "Kiedy zleciało się ptactwo do tej padliny, Abram je odganiał."
  tags: []
"Rdz15,12":
  text: "Gdy słońce zachodziło, głęboki sen ogarnął Abrama i oto groza wielkiej ciemności zapadła na niego."
  tags: []
"Rdz15,13":
  text: "I PAN powiedział do Abrama: Wiedz o tym dobrze, że twoje potomstwo będzie przybyszem w cudzej ziemi i wezmą je w niewolę, i będzie uciskane przez czterysta lat."
  tags: []
"Rdz15,14":
  text: "A ja osądzę ten naród, któremu będą służyć; a potem wyjdą stamtąd z wielkim dobytkiem."
  tags: []
"Rdz15,15":
  text: "Ale ty odejdziesz w pokoju do twoich ojców i będziesz pochowany w dobrej starości."
  tags: []
"Rdz15,16":
  text: "A w czwartym pokoleniu wrócą tutaj, bo jeszcze nie dopełniła się nieprawość Amorytów."
  tags: []
"Rdz15,17":
  text: "Gdy słońce zaszło i nastała ciemność, oto ukazał się dymiący piec i ognista pochodnia, która przechodziła między tymi połowami zwierząt."
  tags: []
"Rdz15,18":
  text: "W tym właśnie dniu PAN zawarł przymierze z Abramem, mówiąc: Twemu potomstwu dam tę ziemię, od rzeki Egiptu aż do wielkiej rzeki, rzeki Eufrat;"
  tags: []
"Rdz15,19":
  text: "Kenitów, Kenizytów i Kadmonitów;"
  tags: []
"Rdz15,20":
  text: "Chetytów, Peryzzytów i Refaitów;"
  tags: []
"Rdz15,21":
  text: "Amorytów, Kananejczyków, Girgaszytów i Jebusytów."
  tags: []
