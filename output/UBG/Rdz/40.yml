"Rdz40,1":
  text: "Po tych wydarzeniach podczaszy króla Egiptu i jego piekarz dopuścili się wykroczenia przeciwko swojemu panu, królowi Egiptu."
  tags: []
"Rdz40,2":
  text: "Faraon więc rozgniewał się na obu swoich dworzan, na przełożonego podczaszych i na przełożonego piekarzy."
  tags: []
"Rdz40,3":
  text: "I oddał ich do więzienia w domu dowódcy straży, na miejsce, gdzie Józef był więźniem."
  tags: []
"Rdz40,4":
  text: "A dowódca straży oddał ich pod nadzór Józefa, który im służył. I przebywali jakiś czas w więzieniu."
  tags: []
"Rdz40,5":
  text: "Pewnej nocy obydwaj – podczaszy i piekarz króla Egiptu, którzy byli więźniami w więzieniu – mieli sen, każdy inny, według swego tłumaczenia."
  tags: []
"Rdz40,6":
  text: "A Józef przyszedł do nich rano i spostrzegł, że są smutni."
  tags: []
"Rdz40,7":
  text: "I zapytał dworzan faraona, którzy byli z nim w więzieniu, w domu jego pana: Czemu macie dziś tak smutne twarze?"
  tags: []
"Rdz40,8":
  text: "I odpowiedzieli mu: Śnił się nam sen, a nie ma nikogo, kto by go wytłumaczył. Józef powiedział do nich: Czy nie do Boga należą wytłumaczenia? Opowiedzcie mi, proszę."
  tags: []
"Rdz40,9":
  text: "Wtedy przełożony podczaszych opowiedział swój sen Józefowi: Śniło mi się, że przede mną była winorośl;"
  tags: []
"Rdz40,10":
  text: "I na winorośli były trzy gałązki. A ona jakby wypuszczała pąki i wychodził jej kwiat, i jej grona wydały dojrzałe winogrona."
  tags: []
"Rdz40,11":
  text: "A kubek faraona był w mojej ręce. Wziąłem więc winogrona i wyciskałem je do kubka faraona, i podawałem kubek w ręce faraona."
  tags: []
"Rdz40,12":
  text: "Wtedy Józef powiedział mu: Takie jest wytłumaczenie tego snu: Trzy gałązki to trzy dni."
  tags: []
"Rdz40,13":
  text: "Po trzech dniach faraon wywyższy twą głowę i przywróci cię na twój urząd, i będziesz podawał kubek faraona w jego rękę jak dawniej, gdy byłeś jego podczaszym."
  tags: []
"Rdz40,14":
  text: "Tylko wspomnij na mnie, gdy się będziesz miał dobrze, i wyświadcz mi, proszę, tę przysługę i wspomnij o mnie faraonowi, i uwolnij mnie z tego domu;"
  tags: []
"Rdz40,15":
  text: "Bo siłą uprowadzono mnie z ziemi hebrajskiej, a do tego nic złego tu nie zrobiłem, żeby mnie wrzucono do tego więzienia."
  tags: []
"Rdz40,16":
  text: "A przełożony piekarzy, widząc, że dobrze wytłumaczył sen, powiedział do Józefa: Ja też miałem sen, a oto trzy białe kosze na mojej głowie;"
  tags: []
"Rdz40,17":
  text: "A w najwyższym koszu były wszelkie rodzaje pieczywa dla faraona, a ptaki jadły je z kosza, który był na mojej głowie."
  tags: []
"Rdz40,18":
  text: "Wtedy Józef odpowiedział: Takie jest wytłumaczenie snu: Trzy kosze to trzy dni."
  tags: []
"Rdz40,19":
  text: "Po trzech dniach faraon zetnie ci głowę i powiesi cię na drzewie, a ptaki będą jadły twoje ciało."
  tags: []
"Rdz40,20":
  text: "A trzeciego dnia, w dniu urodzin faraona, urządził on ucztę dla wszystkich swoich sług i w ich obecności kazał sprowadzić przełożonego podczaszych i przełożonego piekarzy."
  tags: []
"Rdz40,21":
  text: "I przywrócił przełożonego podczaszych na jego urząd, aby podawał kubek do rąk faraona."
  tags: []
"Rdz40,22":
  text: "A przełożonego piekarzy powiesił, jak im Józef wytłumaczył."
  tags: []
"Rdz40,23":
  text: "Jednak przełożony podczaszych nie pamiętał o Józefie, ale zapomniał o nim."
  tags: []
