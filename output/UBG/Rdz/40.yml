"Rdz40,1": "Po tych wydarzeniach podczaszy króla Egiptu i jego piekarz dopuścili się wykroczenia przeciwko swojemu panu, królowi Egiptu."
"Rdz40,2": "Faraon więc rozgniewał się na obu swoich dworzan, na przełożonego podczaszych i na przełożonego piekarzy."
"Rdz40,3": "I oddał ich do więzienia w domu dowódcy straży, na miejsce, gdzie Józef był więźniem."
"Rdz40,4": "A dowódca straży oddał ich pod nadzór Józefa, który im służył. I przebywali jakiś czas w więzieniu."
"Rdz40,5": "Pewnej nocy obydwaj – podczaszy i piekarz króla Egiptu, którzy byli więźniami w więzieniu – mieli sen, każdy inny, według swego tłumaczenia."
"Rdz40,6": "A Józef przyszedł do nich rano i spostrzegł, że są smutni."
"Rdz40,7": "I zapytał dworzan faraona, którzy byli z nim w więzieniu, w domu jego pana: Czemu macie dziś tak smutne twarze?"
"Rdz40,8": "I odpowiedzieli mu: Śnił się nam sen, a nie ma nikogo, kto by go wytłumaczył. Józef powiedział do nich: Czy nie do Boga należą wytłumaczenia? Opowiedzcie mi, proszę."
"Rdz40,9": "Wtedy przełożony podczaszych opowiedział swój sen Józefowi: Śniło mi się, że przede mną była winorośl;"
"Rdz40,10": "I na winorośli były trzy gałązki. A ona jakby wypuszczała pąki i wychodził jej kwiat, i jej grona wydały dojrzałe winogrona."
"Rdz40,11": "A kubek faraona był w mojej ręce. Wziąłem więc winogrona i wyciskałem je do kubka faraona, i podawałem kubek w ręce faraona."
"Rdz40,12": "Wtedy Józef powiedział mu: Takie jest wytłumaczenie tego snu: Trzy gałązki to trzy dni."
"Rdz40,13": "Po trzech dniach faraon wywyższy twą głowę i przywróci cię na twój urząd, i będziesz podawał kubek faraona w jego rękę jak dawniej, gdy byłeś jego podczaszym."
"Rdz40,14": "Tylko wspomnij na mnie, gdy się będziesz miał dobrze, i wyświadcz mi, proszę, tę przysługę i wspomnij o mnie faraonowi, i uwolnij mnie z tego domu;"
"Rdz40,15": "Bo siłą uprowadzono mnie z ziemi hebrajskiej, a do tego nic złego tu nie zrobiłem, żeby mnie wrzucono do tego więzienia."
"Rdz40,16": "A przełożony piekarzy, widząc, że dobrze wytłumaczył sen, powiedział do Józefa: Ja też miałem sen, a oto trzy białe kosze na mojej głowie;"
"Rdz40,17": "A w najwyższym koszu były wszelkie rodzaje pieczywa dla faraona, a ptaki jadły je z kosza, który był na mojej głowie."
"Rdz40,18": "Wtedy Józef odpowiedział: Takie jest wytłumaczenie snu: Trzy kosze to trzy dni."
"Rdz40,19": "Po trzech dniach faraon zetnie ci głowę i powiesi cię na drzewie, a ptaki będą jadły twoje ciało."
"Rdz40,20": "A trzeciego dnia, w dniu urodzin faraona, urządził on ucztę dla wszystkich swoich sług i w ich obecności kazał sprowadzić przełożonego podczaszych i przełożonego piekarzy."
"Rdz40,21": "I przywrócił przełożonego podczaszych na jego urząd, aby podawał kubek do rąk faraona."
"Rdz40,22": "A przełożonego piekarzy powiesił, jak im Józef wytłumaczył."
"Rdz40,23": "Jednak przełożony podczaszych nie pamiętał o Józefie, ale zapomniał o nim."
