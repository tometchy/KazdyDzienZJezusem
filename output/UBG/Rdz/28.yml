"Rdz28,1":
  text: "Wtedy Izaak wezwał Jakuba i błogosławił mu, i rozkazał: Nie bierz sobie żony z córek Kanaanu."
  tags: []
"Rdz28,2":
  text: "Ale wstań i idź do krainy Paddan-Aram, do domu Betuela, ojca twojej matki, i weź sobie stamtąd żonę z córek Labana, brata twojej matki."
  tags: []
"Rdz28,3":
  text: "A Bóg Wszechmogący niech ci błogosławi i niech cię uczyni płodnym i rozmnoży, abyś stał się licznym ludem;"
  tags: []
"Rdz28,4":
  text: "I niech ci da błogosławieństwo Abrahama, tobie i twemu potomstwu z tobą, abyś odziedziczył ziemię, na której jesteś przybyszem, którą Bóg dał Abrahamowi."
  tags: []
"Rdz28,5":
  text: "I tak Izaak wysłał Jakuba, który udał się do krainy Paddan-Aram, do Labana, syna Betuela, Syryjczyka, brata Rebeki, matki Jakuba i Ezawa."
  tags: []
"Rdz28,6":
  text: "A Ezaw widział, że Izaak błogosławił Jakubowi i posłał go do krainy Paddan-Aram, aby stamtąd wziął sobie żonę, i że błogosławiąc mu, przykazał: Nie weźmiesz żony z córek Kanaanu;"
  tags: []
"Rdz28,7":
  text: "I że Jakub był posłuszny swemu ojcu oraz swojej matce, i poszedł do krainy Paddan-Aram;"
  tags: []
"Rdz28,8":
  text: "Widział też Ezaw, że córki Kanaanu nie podobają się jego ojcu Izaakowi;"
  tags: []
"Rdz28,9":
  text: "Wtedy Ezaw poszedł do Izmaela i oprócz żon, które już miał, wziął za żonę Machalat, córkę Izmaela, syna Abrahama, siostrę Nebajota."
  tags: []
"Rdz28,10":
  text: "A Jakub wyszedł z Beer-Szeby i udał się do Charanu."
  tags: []
"Rdz28,11":
  text: "Przyszedł na pewne miejsce i tam nocował, bo słońce już zaszło. Wziął jeden z kamieni z tego miejsca, podłożył go sobie pod głowę i zasnął na tym miejscu."
  tags: []
"Rdz28,12":
  text: "I śniło mu się, że na ziemi stała drabina, a jej szczyt sięgał nieba. A oto aniołowie Boży wstępowali i zstępowali po niej."
  tags: []
"Rdz28,13":
  text: "A PAN stał nad nią i powiedział: Ja jestem PAN, Bóg twego ojca Abrahama i Bóg Izaaka. Ziemię, na której leżysz, dam tobie i twemu potomstwu."
  tags: []
"Rdz28,14":
  text: "A twoje potomstwo będzie jak proch ziemi i rozprzestrzenisz się na zachód i na wschód, na północ i na południe. A w tobie i w twoim potomstwie będą błogosławione wszystkie narody ziemi."
  tags: []
"Rdz28,15":
  text: "Oto ja jestem z tobą i będę cię strzegł, gdziekolwiek pójdziesz, i przyprowadzę cię z powrotem do tej ziemi. Bo nie opuszczę cię, aż spełnię to, co ci obiecałem."
  tags: []
"Rdz28,16":
  text: "Gdy Jakub zbudził się ze snu, powiedział: Naprawdę PAN jest na tym miejscu, a ja o tym nie wiedziałem."
  tags: []
"Rdz28,17":
  text: "I przestraszył się, i powiedział: O, jakie straszne to miejsce! To nie może być nic innego jak dom Boży i brama nieba."
  tags: []
"Rdz28,18":
  text: "I Jakub wstał wcześnie rano, wziął kamień, który podłożył sobie pod głowę i postawił go na znak, i nalał oliwy na jego wierzch."
  tags: []
"Rdz28,19":
  text: "I nadał temu miejscu nazwę Betel, lecz przedtem miasto nazywało się Luz."
  tags: []
"Rdz28,20":
  text: "Wtedy Jakub złożył ślub, mówiąc: Jeśli Bóg będzie ze mną i będzie mnie strzegł na tej drodze, którą idę, jeśli da mi chleb do jedzenia i odzież do ubrania;"
  tags: []
"Rdz28,21":
  text: "I jeśli wrócę w pokoju do domu mego ojca, to PAN będzie moim Bogiem."
  tags: []
"Rdz28,22":
  text: "A ten kamień, który postawiłem na znak, będzie domem Bożym. I ze wszystkiego, co mi dasz, będę ci na pewno oddawał dziesięcinę."
  tags: []
