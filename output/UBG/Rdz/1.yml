"Rdz1,1":
  text: "Na początku Bóg stworzył niebo i ziemię."
  tags: []
"Rdz1,2":
  text: "A ziemia była bezkształtna i pusta i ciemność była nad głębią, a Duch Boży unosił się nad wodami."
  tags: []
"Rdz1,3":
  text: "I Bóg powiedział: Niech stanie się światłość. I stała się światłość."
  tags: []
"Rdz1,4":
  text: "Bóg widział, że światłość była dobra. I oddzielił Bóg światłość od ciemności."
  tags: []
"Rdz1,5":
  text: "I nazwał Bóg światłość dniem, a ciemność nazwał nocą. I nastał wieczór i poranek, dzień pierwszy."
  tags: []
"Rdz1,6":
  text: "Potem Bóg powiedział: Niech stanie się firmament pośrodku wód i niech oddzieli wody od wód."
  tags: []
"Rdz1,7":
  text: "I uczynił Bóg firmament, i oddzielił wody, które są pod firmamentem, od wód, które są nad firmamentem. I tak się stało."
  tags: []
"Rdz1,8":
  text: "I Bóg nazwał firmament niebem. I nastał wieczór i poranek, dzień drugi."
  tags: []
"Rdz1,9":
  text: "Potem Bóg powiedział: Niech się zbiorą w jednym miejscu wody, które są pod niebem, i niech się ukaże sucha powierzchnia. I tak się stało."
  tags: []
"Rdz1,10":
  text: "I Bóg nazwał suchą powierzchnię ziemią, a zbiorowisko wód – morzami. I Bóg widział, że to było dobre."
  tags: []
"Rdz1,11":
  text: "Potem Bóg powiedział: Niech ziemia zrodzi trawę, rośliny wydające nasiona i drzewo urodzajne przynoszące owoc według swego rodzaju, którego nasienie będzie w nim na ziemi. I tak się stało."
  tags: []
"Rdz1,12":
  text: "I ziemia wydała trawę, rośliny wydające nasienie według swego rodzaju i drzewo przynoszące owoc, w którym było nasienie według swego rodzaju. I Bóg widział, że to było dobre."
  tags: []
"Rdz1,13":
  text: "I nastał wieczór i poranek, dzień trzeci."
  tags: []
"Rdz1,14":
  text: "Potem Bóg powiedział: Niech się staną światła na firmamencie nieba, by oddzielały dzień od nocy, i niech stanowią znaki, pory roku, dni i lata."
  tags: []
"Rdz1,15":
  text: "I niech będą światłami na firmamencie nieba, aby świeciły nad ziemią. I tak się stało."
  tags: []
"Rdz1,16":
  text: "I Bóg uczynił dwa wielkie światła: światło większe, aby rządziło dniem, i światło mniejsze, aby rządziło nocą, oraz gwiazdy."
  tags: []
"Rdz1,17":
  text: "I Bóg umieścił je na firmamencie nieba, aby świeciły nad ziemią;"
  tags: []
"Rdz1,18":
  text: "I żeby rządziły dniem i nocą, i oddzielały światłość od ciemności. I Bóg widział, że to było dobre."
  tags: []
"Rdz1,19":
  text: "I nastał wieczór i poranek, dzień czwarty."
  tags: []
"Rdz1,20":
  text: "Potem Bóg powiedział: Niech wody hojnie wydadzą żywe istoty, a ptactwo niech lata nad ziemią, pod firmamentem nieba."
  tags: []
"Rdz1,21":
  text: "I Bóg stworzył wielkie wieloryby i wszelkie pływające istoty żywe, które hojnie wydały wody, według ich rodzaju oraz wszelkie ptactwo skrzydlate według jego rodzaju. I Bóg widział, że to było dobre."
  tags: []
"Rdz1,22":
  text: "Bóg błogosławił je, mówiąc: Bądźcie płodne i rozmnażajcie się, i wypełniajcie wody morskie, a ptactwo niech się rozmnaża na ziemi."
  tags: []
"Rdz1,23":
  text: "I nastał wieczór i poranek, dzień piąty."
  tags: []
"Rdz1,24":
  text: "Bóg powiedział też: Niech ziemia wyda istoty żywe według swego rodzaju: bydło, zwierzęta pełzające i zwierzęta ziemi według swego rodzaju. I tak się stało."
  tags: []
"Rdz1,25":
  text: "I Bóg uczynił zwierzęta ziemi według swego rodzaju i bydło według swego rodzaju, i wszelkie zwierzęta, które pełzają po ziemi według swego rodzaju. I Bóg widział, że to było dobre."
  tags: []
"Rdz1,26":
  text: "Potem Bóg powiedział: Uczyńmy człowieka na nasz obraz według naszego podobieństwa; niech panuje nad rybami morskimi i ptactwem niebieskim, nad bydłem i całą ziemią oraz nad wszelkimi zwierzętami pełzającymi, które pełzają po ziemi."
  tags: []
"Rdz1,27":
  text: "Stworzył więc Bóg człowieka na swój obraz, na obraz Boga go stworzył; stworzył ich mężczyzną i kobietą."
  tags: []
"Rdz1,28":
  text: "I Bóg błogosławił im. Potem Bóg powiedział do nich: Bądźcie płodni i rozmnażajcie się, napełniajcie ziemię i czyńcie ją sobie poddaną; panujcie nad rybami morskimi i nad ptactwem niebieskim, i nad wszelkimi zwierzętami, które poruszają się po ziemi."
  tags: []
"Rdz1,29":
  text: "I Bóg powiedział: Oto dałem wam wszelkie rośliny wydające z siebie nasienie, które są na powierzchni całej ziemi, i wszelkie drzewo mające owoc drzewa, wydające z siebie nasienie – będą one dla was pokarmem."
  tags: []
"Rdz1,30":
  text: "I wszelkim zwierzętom ziemi, i wszelkiemu ptactwu niebieskiemu, i wszystkiemu, co pełza po ziemi i ma w sobie życie, pokarmem będą wszelkie rośliny zielone. I tak się stało."
  tags: []
"Rdz1,31":
  text: "I Bóg widział wszystko, co uczynił, a było to bardzo dobre. I nastał wieczór i poranek, dzień szósty."
  tags: []
