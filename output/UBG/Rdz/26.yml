"Rdz26,1":
  text: "Potem nastał głód na ziemi, po tym pierwszym głodzie, który był za dni Abrahama. Izaak udał się więc do Abimeleka, króla Filistynów, do Geraru."
  tags: []
"Rdz26,2":
  text: "Wtedy PAN ukazał mu się i powiedział: Nie idź do Egiptu, ale mieszkaj w ziemi, którą ci wskażę."
  tags: []
"Rdz26,3":
  text: "Bądź przybyszem w tej ziemi, a ja będę z tobą i będę ci błogosławił. Tobie bowiem i twemu potomstwu dam te wszystkie krainy i dotrzymam przysięgi, którą złożyłem twemu ojcu Abrahamowi."
  tags: []
"Rdz26,4":
  text: "I rozmnożę twoje potomstwo jak gwiazdy na niebie, i dam twemu potomstwu wszystkie te krainy. A będą błogosławione w twoim potomstwie wszystkie narody ziemi;"
  tags: []
"Rdz26,5":
  text: "Dlatego że Abraham posłuchał mego głosu i strzegł mego nakazu, moich przykazań, moich ustaw i moich praw."
  tags: []
"Rdz26,6":
  text: "Izaak zamieszkał więc w Gerarze."
  tags: []
"Rdz26,7":
  text: "A gdy mężczyźni tego miejsca pytali o jego żonę, odpowiedział: To moja siostra. Bał się bowiem mówić: To moja żona, by mężczyźni tego miejsca nie zabili go z powodu Rebeki, bo była bardzo piękna."
  tags: []
"Rdz26,8":
  text: "Gdy mieszkał tam już dłuższy czas, król Filistynów Abimelek wyjrzał przez okno i zobaczył, że Izaak pieścił swą żonę Rebekę."
  tags: []
"Rdz26,9":
  text: "Abimelek wezwał więc Izaaka i powiedział: To jest na pewno twoja żona. Dlaczego mówiłeś: To moja siostra? Izaak mu odpowiedział: Bo mówiłem sobie: Abym nie umarł z jej powodu."
  tags: []
"Rdz26,10":
  text: "Abimelek powiedział: Coś ty nam zrobił? Mało brakowało, a ktoś z ludu spałby z twoją żoną i tak sprowadziłbyś na nas grzech."
  tags: []
"Rdz26,11":
  text: "Rozkazał więc Abimelek całemu ludowi: Kto by dotknął tego człowieka albo jego żony, na pewno umrze."
  tags: []
"Rdz26,12":
  text: "Wówczas Izaak posiał w tej ziemi i zebrał w tym roku stokrotny plon, bo PAN mu błogosławił."
  tags: []
"Rdz26,13":
  text: "I wzbogacił się ów człowiek, i rozwijał się coraz bardziej, aż stał się bardzo zamożny."
  tags: []
"Rdz26,14":
  text: "Miał trzody owiec i stada wołów oraz wiele sług, tak że Filistyni mu zazdrościli."
  tags: []
"Rdz26,15":
  text: "I wszystkie studnie, które wykopali słudzy jego ojca, za dni jego ojca Abrahama, Filistyni zasypali i napełnili je ziemią."
  tags: []
"Rdz26,16":
  text: "I Abimelek powiedział do Izaaka: Odejdź od nas, bo jesteś dużo zamożniejszy od nas."
  tags: []
"Rdz26,17":
  text: "Izaak odszedł więc stamtąd i rozbił namioty w dolinie Gerar, i tam zamieszkał."
  tags: []
"Rdz26,18":
  text: "Potem Izaak na nowo odkopał studnie, które wykopali za dni jego ojca Abrahama, a które Filistyni zasypali po śmierci Abrahama, i nadał im te same nazwy, jakie nadał im jego ojciec."
  tags: []
"Rdz26,19":
  text: "Wtedy słudzy Izaaka kopali w tej dolinie i znaleźli tam studnię ze źródlaną wodą."
  tags: []
"Rdz26,20":
  text: "Lecz pasterze z Geraru kłócili się z pasterzami Izaaka, mówiąc: To nasza woda. Nazwał więc tę studnię Esek, bo spierali się z nim."
  tags: []
"Rdz26,21":
  text: "Gdy wykopali drugą studnię, również kłócili się o nią. Dlatego nazwał ją Sitna."
  tags: []
"Rdz26,22":
  text: "Potem przeniósł się stamtąd i wykopał kolejną studnię, o którą już nie było sporu. Nazwał ją więc Rechobot i mówił: Oto teraz PAN dał nam miejsce, abyśmy się rozmnażali na ziemi."
  tags: []
"Rdz26,23":
  text: "I wyruszył stamtąd do Beer-Szeby."
  tags: []
"Rdz26,24":
  text: "Tej nocy ukazał mu się PAN i powiedział: Ja jestem Bogiem twego ojca Abrahama. Nie bój się, bo jestem z tobą. Będę ci błogosławił i rozmnożę twoje potomstwo ze względu na mego sługę Abrahama."
  tags: []
"Rdz26,25":
  text: "Zbudował więc tam ołtarz i wzywał imienia PANA, i rozbił tam swój namiot. Tam też słudzy Izaaka wykopali studnię."
  tags: []
"Rdz26,26":
  text: "Wtedy przybyli do niego z Geraru Abimelek i Achuzat, jeden z jego przyjaciół, oraz dowódca jego wojska Pikol."
  tags: []
"Rdz26,27":
  text: "Izaak zapytał ich: Po co przybyliście do mnie, skoro mnie nienawidzicie i wypędziliście mnie od siebie?"
  tags: []
"Rdz26,28":
  text: "A oni odpowiedzieli: Zobaczyliśmy naprawdę, że PAN jest z tobą, więc powiedzieliśmy: Niech będzie teraz przysięga między nami, między nami a tobą, i ustanowimy przymierze z tobą;"
  tags: []
"Rdz26,29":
  text: "Abyś nam nie czynił nic złego, jak i my też nie dotknęliśmy ciebie i tylko dobrze ci czyniliśmy, i pozwoliliśmy ci odejść w pokoju; a ty teraz jesteś błogosławiony przez PANA."
  tags: []
"Rdz26,30":
  text: "Wtedy wyprawił im ucztę; jedli więc i pili."
  tags: []
"Rdz26,31":
  text: "Nazajutrz wstali wcześnie rano i złożyli sobie wzajemnie przysięgę. Potem Izaak pożegnał się z nimi i odeszli od niego w pokoju."
  tags: []
"Rdz26,32":
  text: "Tego samego dnia słudzy Izaaka przyszli i opowiedzieli mu o studni, którą wykopali: Znaleźliśmy wodę."
  tags: []
"Rdz26,33":
  text: "I nazwał ją Szibea. Dlatego to miasto nazywa się Beer-Szeba aż do dzisiaj."
  tags: []
"Rdz26,34":
  text: "Gdy Ezaw miał czterdzieści lat, pojął sobie za żonę Judytę, córkę Beeriego Chetyty, i Bosmat, córkę Elona Chetyty."
  tags: []
"Rdz26,35":
  text: "Były one przyczyną utrapień Izaaka i Rebeki."
  tags: []
