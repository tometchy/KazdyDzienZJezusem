"Rdz26,1": "Potem nastał głód na ziemi, po tym pierwszym głodzie, który był za dni Abrahama. Izaak udał się więc do Abimeleka, króla Filistynów, do Geraru."
"Rdz26,2": "Wtedy PAN ukazał mu się i powiedział: Nie idź do Egiptu, ale mieszkaj w ziemi, którą ci wskażę."
"Rdz26,3": "Bądź przybyszem w tej ziemi, a ja będę z tobą i będę ci błogosławił. Tobie bowiem i twemu potomstwu dam te wszystkie krainy i dotrzymam przysięgi, którą złożyłem twemu ojcu Abrahamowi."
"Rdz26,4": "I rozmnożę twoje potomstwo jak gwiazdy na niebie, i dam twemu potomstwu wszystkie te krainy. A będą błogosławione w twoim potomstwie wszystkie narody ziemi;"
"Rdz26,5": "Dlatego że Abraham posłuchał mego głosu i strzegł mego nakazu, moich przykazań, moich ustaw i moich praw."
"Rdz26,6": "Izaak zamieszkał więc w Gerarze."
"Rdz26,7": "A gdy mężczyźni tego miejsca pytali o jego żonę, odpowiedział: To moja siostra. Bał się bowiem mówić: To moja żona, by mężczyźni tego miejsca nie zabili go z powodu Rebeki, bo była bardzo piękna."
"Rdz26,8": "Gdy mieszkał tam już dłuższy czas, król Filistynów Abimelek wyjrzał przez okno i zobaczył, że Izaak pieścił swą żonę Rebekę."
"Rdz26,9": "Abimelek wezwał więc Izaaka i powiedział: To jest na pewno twoja żona. Dlaczego mówiłeś: To moja siostra? Izaak mu odpowiedział: Bo mówiłem sobie: Abym nie umarł z jej powodu."
"Rdz26,10": "Abimelek powiedział: Coś ty nam zrobił? Mało brakowało, a ktoś z ludu spałby z twoją żoną i tak sprowadziłbyś na nas grzech."
"Rdz26,11": "Rozkazał więc Abimelek całemu ludowi: Kto by dotknął tego człowieka albo jego żony, na pewno umrze."
"Rdz26,12": "Wówczas Izaak posiał w tej ziemi i zebrał w tym roku stokrotny plon, bo PAN mu błogosławił."
"Rdz26,13": "I wzbogacił się ów człowiek, i rozwijał się coraz bardziej, aż stał się bardzo zamożny."
"Rdz26,14": "Miał trzody owiec i stada wołów oraz wiele sług, tak że Filistyni mu zazdrościli."
"Rdz26,15": "I wszystkie studnie, które wykopali słudzy jego ojca, za dni jego ojca Abrahama, Filistyni zasypali i napełnili je ziemią."
"Rdz26,16": "I Abimelek powiedział do Izaaka: Odejdź od nas, bo jesteś dużo zamożniejszy od nas."
"Rdz26,17": "Izaak odszedł więc stamtąd i rozbił namioty w dolinie Gerar, i tam zamieszkał."
"Rdz26,18": "Potem Izaak na nowo odkopał studnie, które wykopali za dni jego ojca Abrahama, a które Filistyni zasypali po śmierci Abrahama, i nadał im te same nazwy, jakie nadał im jego ojciec."
"Rdz26,19": "Wtedy słudzy Izaaka kopali w tej dolinie i znaleźli tam studnię ze źródlaną wodą."
"Rdz26,20": "Lecz pasterze z Geraru kłócili się z pasterzami Izaaka, mówiąc: To nasza woda. Nazwał więc tę studnię Esek, bo spierali się z nim."
"Rdz26,21": "Gdy wykopali drugą studnię, również kłócili się o nią. Dlatego nazwał ją Sitna."
"Rdz26,22": "Potem przeniósł się stamtąd i wykopał kolejną studnię, o którą już nie było sporu. Nazwał ją więc Rechobot i mówił: Oto teraz PAN dał nam miejsce, abyśmy się rozmnażali na ziemi."
"Rdz26,23": "I wyruszył stamtąd do Beer-Szeby."
"Rdz26,24": "Tej nocy ukazał mu się PAN i powiedział: Ja jestem Bogiem twego ojca Abrahama. Nie bój się, bo jestem z tobą. Będę ci błogosławił i rozmnożę twoje potomstwo ze względu na mego sługę Abrahama."
"Rdz26,25": "Zbudował więc tam ołtarz i wzywał imienia PANA, i rozbił tam swój namiot. Tam też słudzy Izaaka wykopali studnię."
"Rdz26,26": "Wtedy przybyli do niego z Geraru Abimelek i Achuzat, jeden z jego przyjaciół, oraz dowódca jego wojska Pikol."
"Rdz26,27": "Izaak zapytał ich: Po co przybyliście do mnie, skoro mnie nienawidzicie i wypędziliście mnie od siebie?"
"Rdz26,28": "A oni odpowiedzieli: Zobaczyliśmy naprawdę, że PAN jest z tobą, więc powiedzieliśmy: Niech będzie teraz przysięga między nami, między nami a tobą, i ustanowimy przymierze z tobą;"
"Rdz26,29": "Abyś nam nie czynił nic złego, jak i my też nie dotknęliśmy ciebie i tylko dobrze ci czyniliśmy, i pozwoliliśmy ci odejść w pokoju; a ty teraz jesteś błogosławiony przez PANA."
"Rdz26,30": "Wtedy wyprawił im ucztę; jedli więc i pili."
"Rdz26,31": "Nazajutrz wstali wcześnie rano i złożyli sobie wzajemnie przysięgę. Potem Izaak pożegnał się z nimi i odeszli od niego w pokoju."
"Rdz26,32": "Tego samego dnia słudzy Izaaka przyszli i opowiedzieli mu o studni, którą wykopali: Znaleźliśmy wodę."
"Rdz26,33": "I nazwał ją Szibea. Dlatego to miasto nazywa się Beer-Szeba aż do dzisiaj."
"Rdz26,34": "Gdy Ezaw miał czterdzieści lat, pojął sobie za żonę Judytę, córkę Beeriego Chetyty, i Bosmat, córkę Elona Chetyty."
"Rdz26,35": "Były one przyczyną utrapień Izaaka i Rebeki."
