"Rdz39,1":
  text: "A Józef został zaprowadzony do Egiptu. I Potifar, dworzanin faraona, dowódca straży, Egipcjanin, kupił go od Izmaelitów, którzy go tam zaprowadzili."
  tags: []
"Rdz39,2":
  text: "PAN był z Józefem, tak że stał się człowiekiem, któremu się dobrze powodziło, i mieszkał w domu swego pana Egipcjanina."
  tags: []
"Rdz39,3":
  text: "Jego pan widział, że PAN jest z nim i że PAN szczęści mu we wszystkim, co on czyni."
  tags: []
"Rdz39,4":
  text: "I Józef znalazł łaskę w jego oczach, i służył mu. Uczynił go zarządcą swego domu i wszystko, co miał, oddał w jego ręce."
  tags: []
"Rdz39,5":
  text: "A od tego czasu, gdy uczynił go zarządcą swego domu i wszystkiego, co miał, PAN błogosławił domowi Egipcjanina ze względu na Józefa. I błogosławieństwo PANA było nad wszystkim, co miał w domu i na polu."
  tags: []
"Rdz39,6":
  text: "Dlatego oddał wszystko, co miał, w ręce Józefa i o niczym u siebie nie wiedział, tylko o chlebie, który spożywał. A Józef był przystojny i miły dla oka."
  tags: []
"Rdz39,7":
  text: "Po tych wydarzeniach żona jego pana zwróciła swe oczy na Józefa i powiedziała: Połóż się ze mną."
  tags: []
"Rdz39,8":
  text: "Ale odmówił i powiedział do żony swego pana: Mój pan nie wie tak dobrze jak ja, co jest w jego domu, bo wszystko, co miał, oddał w moje ręce."
  tags: []
"Rdz39,9":
  text: "I nie ma w tym domu nikogo większego ode mnie, i nie zabronił mi niczego oprócz ciebie, bo ty jesteś jego żoną. Jak więc mógłbym popełnić tak wielkie zło i zgrzeszyć przeciwko Bogu?"
  tags: []
"Rdz39,10":
  text: "I chociaż namawiała Józefa dzień w dzień, on nie zgadzał się z nią położyć ani z nią być."
  tags: []
"Rdz39,11":
  text: "Pewnego dnia, gdy wszedł do domu, aby wykonać swoje obowiązki, a nie było tam nikogo z domowników;"
  tags: []
"Rdz39,12":
  text: "Uchwyciła go za szatę i powiedziała: Połóż się ze mną. Ale on zostawił swoją szatę w jej ręku, uciekł i wyszedł na zewnątrz."
  tags: []
"Rdz39,13":
  text: "A gdy ona zobaczyła, że zostawił szatę w jej ręku i uciekł na zewnątrz;"
  tags: []
"Rdz39,14":
  text: "Zawołała swoich domowników i powiedziała do nich: Patrzcie, pan sprowadził do nas Hebrajczyka, aby nas zelżył. Przyszedł bowiem do mnie, aby się ze mną położyć, ale krzyknęłam donośnym głosem."
  tags: []
"Rdz39,15":
  text: "A gdy usłyszał, że podnoszę swój głos i wołam, zostawił szatę u mnie, uciekł i wyszedł na zewnątrz."
  tags: []
"Rdz39,16":
  text: "I zatrzymała u siebie jego szatę, aż przyszedł do domu jego pan;"
  tags: []
"Rdz39,17":
  text: "I powiedziała do niego te słowa: Przyszedł do mnie sługa, ten Hebrajczyk, którego przyprowadziłeś do nas, aby mnie zelżyć."
  tags: []
"Rdz39,18":
  text: "A gdy podniosłam swój głos i zawołałam, zostawił szatę u mnie i uciekł na zewnątrz."
  tags: []
"Rdz39,19":
  text: "Gdy jego pan usłyszał słowa swojej żony, które do niego powiedziała: Tak mi uczynił twój sługa, rozgniewał się bardzo."
  tags: []
"Rdz39,20":
  text: "Potem pan Józefa wziął go i oddał do więzienia, tam gdzie sadzano więźniów królewskich. I przebywał tam w więzieniu."
  tags: []
"Rdz39,21":
  text: "A PAN był z Józefem, okazał mu miłosierdzie i dał mu łaskę w oczach przełożonego więzienia."
  tags: []
"Rdz39,22":
  text: "Przełożony więzienia oddał więc pod władzę Józefa wszystkich więźniów, którzy byli w więzieniu; a wszystkim, co tam się działo, on zarządzał."
  tags: []
"Rdz39,23":
  text: "A przełożony więzienia nie doglądał tego, co mu powierzył, bo PAN był z nim, i co on czynił, to PAN szczęścił."
  tags: []
