"Rdz25,1":
  text: "Potem Abraham pojął drugą żonę, której było na imię Ketura."
  tags: []
"Rdz25,2":
  text: "Ona urodziła mu Zimrana, Jokszana, Medana, Midiana, Jiszbaka i Szuacha."
  tags: []
"Rdz25,3":
  text: "Jokszan spłodził Szebę i Dedana. A synami Dedana byli Aszszurim, Letuszim i Leummim."
  tags: []
"Rdz25,4":
  text: "Synami Midiana byli: Efa, Efer, Henoch, Abida i Eldaa. Wszyscy oni byli synami Ketury."
  tags: []
"Rdz25,5":
  text: "I Abraham dał Izaakowi wszystko, co miał."
  tags: []
"Rdz25,6":
  text: "A synom nałożnic, które miał, Abraham dał upominki i jeszcze za swojego życia wyprawił ich z dala od swego syna Izaaka ku wschodowi, do ziemi wschodniej."
  tags: []
"Rdz25,7":
  text: "Oto liczba lat życia, których dożył Abraham: sto siedemdziesiąt pięć lat."
  tags: []
"Rdz25,8":
  text: "Abraham oddał ducha i umarł w dobrej starości, podeszły w latach i syty życia; i został przyłączony do swego ludu."
  tags: []
"Rdz25,9":
  text: "I jego synowie, Izaak i Izmael, pochowali go w jaskini Makpela, na polu Efrona, syna Sochara Chetyty, które było naprzeciwko Mamre;"
  tags: []
"Rdz25,10":
  text: "Na polu, które Abraham kupił od synów Cheta. Tam zostali pochowani Abraham i Sara, jego żona."
  tags: []
"Rdz25,11":
  text: "A po śmierci Abrahama Bóg błogosławił jego synowi Izaakowi, a Izaak mieszkał przy studni Lachaj-Roj."
  tags: []
"Rdz25,12":
  text: "To są dzieje rodu Izmaela, syna Abrahama, którego urodziła Abrahamowi Hagar, Egipcjanka, służąca Sary."
  tags: []
"Rdz25,13":
  text: "I to są imiona synów Izmaela według ich rodów: Nebajot, pierworodny Izmaela, po nim Kedar, Abdeel i Mibsam;"
  tags: []
"Rdz25,14":
  text: "Miszma, Duma i Massa;"
  tags: []
"Rdz25,15":
  text: "Chadar, Tema, Jetur, Nafisz i Kedma."
  tags: []
"Rdz25,16":
  text: "To są synowie Izmaela, a to ich imiona według ich miasteczek i zamków; dwunastu książąt w ich narodach."
  tags: []
"Rdz25,17":
  text: "A lat życia Izmaela było sto trzydzieści siedem. Oddał ducha i umarł, i został przyłączony do swego ludu."
  tags: []
"Rdz25,18":
  text: "I mieszkali od Chawila aż do Szur, który leży naprzeciwko Egiptu, na drodze do Asyrii. I umarł w obecności wszystkich swych braci."
  tags: []
"Rdz25,19":
  text: "To zaś są dzieje rodu Izaaka, syna Abrahama: Abraham spłodził Izaaka."
  tags: []
"Rdz25,20":
  text: "Izaak miał czterdzieści lat, gdy pojął za żonę Rebekę, córkę Betuela Syryjczyka, z Paddan-Aram, siostrę Labana, Syryjczyka."
  tags: []
"Rdz25,21":
  text: "A Izaak modlił się do PANA za swoją żonę, gdyż była niepłodna. I PAN go wysłuchał, i jego żona Rebeka poczęła."
  tags: []
"Rdz25,22":
  text: "A gdy dzieci walczyły ze sobą w jej łonie, powiedziała: Jeśli tak się zdarza, dlaczego poczęłam? Poszła więc, aby zapytać PANA."
  tags: []
"Rdz25,23":
  text: "I PAN jej odpowiedział: Dwa narody są w twoim łonie i dwa ludy wyjdą z twego wnętrza. Jeden lud będzie mocniejszy niż drugi i starszy będzie służył młodszemu."
  tags: []
"Rdz25,24":
  text: "A gdy nadszedł czas porodu, okazało się, że w jej łonie były bliźnięta."
  tags: []
"Rdz25,25":
  text: "I wyszedł pierwszy syn czerwony i cały pokryty owłosieniem jak szatą; i nadali mu imię Ezaw."
  tags: []
"Rdz25,26":
  text: "A potem wyszedł jego brat, trzymając swą ręką za piętę Ezawa, i nadano mu imię Jakub. Izaak miał sześćdziesiąt lat, gdy oni mu się urodzili."
  tags: []
"Rdz25,27":
  text: "A gdy dzieci urosły, Ezaw został człowiekiem biegłym w myślistwie i człowiekiem pola. Jakub zaś był człowiekiem spokojnym, mieszkającym w namiotach."
  tags: []
"Rdz25,28":
  text: "I Izaak kochał Ezawa, bo jadał z jego łowu, Rebeka zaś kochała Jakuba."
  tags: []
"Rdz25,29":
  text: "I Jakub ugotował sobie potrawę, a w tym czasie przyszedł Ezaw z pola spracowany."
  tags: []
"Rdz25,30":
  text: "Ezaw powiedział więc do Jakuba: Daj mi jeść, proszę cię, z tej czerwonej potrawy, bo jestem spracowany. Dlatego nadano mu imię Edom."
  tags: []
"Rdz25,31":
  text: "Jakub powiedział: Sprzedaj mi dziś twoje pierworództwo."
  tags: []
"Rdz25,32":
  text: "A Ezaw odpowiedział: Oto jestem bliski śmierci, na cóż mi pierworództwo?"
  tags: []
"Rdz25,33":
  text: "Jakub powiedział: Przysięgnij mi dziś. Przysiągł mu więc i sprzedał Jakubowi swoje pierworództwo."
  tags: []
"Rdz25,34":
  text: "Jakub dał więc Ezawowi chleba i potrawę z soczewicy, a on jadł i pił, a potem powstał i poszedł. W ten sposób Ezaw pogardził swoim pierworództwem."
  tags: []
