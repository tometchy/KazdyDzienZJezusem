"Rdz5,1": "To jest księga rodu Adama. W dniu, w którym Bóg stworzył człowieka, uczynił go na podobieństwo Boga."
"Rdz5,2": "Stworzył ich mężczyzną i kobietą; błogosławił ich i nadał im imię Adam w dniu, w którym zostali stworzeni."
"Rdz5,3": "Adam żył sto trzydzieści lat i spłodził syna na swoje podobieństwo, na swój obraz, i nadał mu imię Set."
"Rdz5,4": "A dni Adama po spłodzeniu Seta było osiemset lat i spłodził synów i córki."
"Rdz5,5": "A tak wszystkich dni, które żył Adam, było dziewięćset trzydzieści lat i umarł."
"Rdz5,6": "Set żył sto pięć lat i spłodził Enosza."
"Rdz5,7": "Po spłodzeniu Enosza Set żył osiemset siedem lat i spłodził synów i córki."
"Rdz5,8": "Wszystkich dni Seta było dziewięćset dwanaście lat i umarł."
"Rdz5,9": "Enosz żył dziewięćdziesiąt lat i spłodził Kenana."
"Rdz5,10": "Po spłodzeniu Kenana Enosz żył osiemset piętnaście lat i spłodził synów i córki."
"Rdz5,11": "Wszystkich dni Enosza było dziewięćset pięć lat i umarł."
"Rdz5,12": "Kenan żył siedemdziesiąt lat i spłodził Mahalaleela."
"Rdz5,13": "Po spłodzeniu Mahalaleela Kenan żył osiemset czterdzieści lat i spłodził synów i córki."
"Rdz5,14": "Wszystkich dni Kenana było dziewięćset dziesięć lat i umarł."
"Rdz5,15": "Mahalaleel żył sześćdziesiąt pięć lat i spłodził Jareda."
"Rdz5,16": "Po spłodzeniu Jareda Mahalaleel żył osiemset trzydzieści lat i spłodził synów i córki."
"Rdz5,17": "Wszystkich dni Mahalaleela było osiemset dziewięćdziesiąt pięć lat i umarł."
"Rdz5,18": "Jared żył sto sześćdziesiąt dwa lata i spłodził Henocha."
"Rdz5,19": "Po spłodzeniu Henocha Jared żył osiemset lat i spłodził synów i córki."
"Rdz5,20": "Wszystkich dni Jareda było dziewięćset sześćdziesiąt dwa lata i umarł."
"Rdz5,21": "Henoch żył sześćdziesiąt pięć lat i spłodził Matuzalema."
"Rdz5,22": "Po spłodzeniu Matuzalema Henoch chodził z Bogiem trzysta lat i spłodził synów i córki."
"Rdz5,23": "Wszystkich dni Henocha było trzysta sześćdziesiąt pięć lat."
"Rdz5,24": "Henoch chodził z Bogiem, a potem już go nie było, bo Bóg go zabrał."
"Rdz5,25": "Matuzalem żył sto osiemdziesiąt siedem lat i spłodził Lameka."
"Rdz5,26": "Po spłodzeniu Lameka Matuzalem żył siedemset osiemdziesiąt dwa lata i spłodził synów i córki."
"Rdz5,27": "Wszystkich dni Matuzalema było dziewięćset sześćdziesiąt dziewięć lat i umarł."
"Rdz5,28": "Lamek żył sto osiemdziesiąt dwa lata i spłodził syna."
"Rdz5,29": "I nadał mu imię Noe, mówiąc: Ten nas pocieszy w naszej pracy i w trudzie naszych rąk, z powodu ziemi, którą PAN przeklął."
"Rdz5,30": "Po spłodzeniu Noego Lamek żył pięćset dziewięćdziesiąt pięć lat i spłodził synów i córki."
"Rdz5,31": "Wszystkich dni Lameka było siedemset siedemdziesiąt siedem lat i umarł."
"Rdz5,32": "A gdy Noe miał pięćset lat, spłodził Sema, Chama i Jafeta."
