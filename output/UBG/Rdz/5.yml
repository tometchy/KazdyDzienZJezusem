"Rdz5,1":
  text: "To jest księga rodu Adama. W dniu, w którym Bóg stworzył człowieka, uczynił go na podobieństwo Boga."
  tags: []
"Rdz5,2":
  text: "Stworzył ich mężczyzną i kobietą; błogosławił ich i nadał im imię Adam w dniu, w którym zostali stworzeni."
  tags: []
"Rdz5,3":
  text: "Adam żył sto trzydzieści lat i spłodził syna na swoje podobieństwo, na swój obraz, i nadał mu imię Set."
  tags: []
"Rdz5,4":
  text: "A dni Adama po spłodzeniu Seta było osiemset lat i spłodził synów i córki."
  tags: []
"Rdz5,5":
  text: "A tak wszystkich dni, które żył Adam, było dziewięćset trzydzieści lat i umarł."
  tags: []
"Rdz5,6":
  text: "Set żył sto pięć lat i spłodził Enosza."
  tags: []
"Rdz5,7":
  text: "Po spłodzeniu Enosza Set żył osiemset siedem lat i spłodził synów i córki."
  tags: []
"Rdz5,8":
  text: "Wszystkich dni Seta było dziewięćset dwanaście lat i umarł."
  tags: []
"Rdz5,9":
  text: "Enosz żył dziewięćdziesiąt lat i spłodził Kenana."
  tags: []
"Rdz5,10":
  text: "Po spłodzeniu Kenana Enosz żył osiemset piętnaście lat i spłodził synów i córki."
  tags: []
"Rdz5,11":
  text: "Wszystkich dni Enosza było dziewięćset pięć lat i umarł."
  tags: []
"Rdz5,12":
  text: "Kenan żył siedemdziesiąt lat i spłodził Mahalaleela."
  tags: []
"Rdz5,13":
  text: "Po spłodzeniu Mahalaleela Kenan żył osiemset czterdzieści lat i spłodził synów i córki."
  tags: []
"Rdz5,14":
  text: "Wszystkich dni Kenana było dziewięćset dziesięć lat i umarł."
  tags: []
"Rdz5,15":
  text: "Mahalaleel żył sześćdziesiąt pięć lat i spłodził Jareda."
  tags: []
"Rdz5,16":
  text: "Po spłodzeniu Jareda Mahalaleel żył osiemset trzydzieści lat i spłodził synów i córki."
  tags: []
"Rdz5,17":
  text: "Wszystkich dni Mahalaleela było osiemset dziewięćdziesiąt pięć lat i umarł."
  tags: []
"Rdz5,18":
  text: "Jared żył sto sześćdziesiąt dwa lata i spłodził Henocha."
  tags: []
"Rdz5,19":
  text: "Po spłodzeniu Henocha Jared żył osiemset lat i spłodził synów i córki."
  tags: []
"Rdz5,20":
  text: "Wszystkich dni Jareda było dziewięćset sześćdziesiąt dwa lata i umarł."
  tags: []
"Rdz5,21":
  text: "Henoch żył sześćdziesiąt pięć lat i spłodził Matuzalema."
  tags: []
"Rdz5,22":
  text: "Po spłodzeniu Matuzalema Henoch chodził z Bogiem trzysta lat i spłodził synów i córki."
  tags: []
"Rdz5,23":
  text: "Wszystkich dni Henocha było trzysta sześćdziesiąt pięć lat."
  tags: []
"Rdz5,24":
  text: "Henoch chodził z Bogiem, a potem już go nie było, bo Bóg go zabrał."
  tags: []
"Rdz5,25":
  text: "Matuzalem żył sto osiemdziesiąt siedem lat i spłodził Lameka."
  tags: []
"Rdz5,26":
  text: "Po spłodzeniu Lameka Matuzalem żył siedemset osiemdziesiąt dwa lata i spłodził synów i córki."
  tags: []
"Rdz5,27":
  text: "Wszystkich dni Matuzalema było dziewięćset sześćdziesiąt dziewięć lat i umarł."
  tags: []
"Rdz5,28":
  text: "Lamek żył sto osiemdziesiąt dwa lata i spłodził syna."
  tags: []
"Rdz5,29":
  text: "I nadał mu imię Noe, mówiąc: Ten nas pocieszy w naszej pracy i w trudzie naszych rąk, z powodu ziemi, którą PAN przeklął."
  tags: []
"Rdz5,30":
  text: "Po spłodzeniu Noego Lamek żył pięćset dziewięćdziesiąt pięć lat i spłodził synów i córki."
  tags: []
"Rdz5,31":
  text: "Wszystkich dni Lameka było siedemset siedemdziesiąt siedem lat i umarł."
  tags: []
"Rdz5,32":
  text: "A gdy Noe miał pięćset lat, spłodził Sema, Chama i Jafeta."
  tags: []
