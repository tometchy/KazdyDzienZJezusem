"Rdz44,1":
  text: "Wtedy Józef rozkazał zarządcy swego domu: Napełnij wory tych ludzi zbożem, ile tylko mogą unieść, a pieniądze każdego włóż na wierzch jego wora."
  tags: []
"Rdz44,2":
  text: "Mój kielich też, kielich srebrny, włóż na wierzch wora najmłodszego razem z pieniędzmi za zboże. I zrobił według słów Józefa, jak mu rozkazał."
  tags: []
"Rdz44,3":
  text: "O świcie wyprawiono tych ludzi razem z ich osłami."
  tags: []
"Rdz44,4":
  text: "Gdy wyszli z miasta i byli niedaleko, Józef powiedział do zarządcy swego domu: Wstań, goń tych ludzi, a gdy ich dogonisz, powiedz do nich: Czemu oddaliście złem za dobro?"
  tags: []
"Rdz44,5":
  text: "Czy to nie jest kielich, z którego pija mój pan i z którego wróży? Źle postąpiliście, dopuszczając się tego."
  tags: []
"Rdz44,6":
  text: "Ten dogonił ich więc i powiedział do nich te słowa."
  tags: []
"Rdz44,7":
  text: "Ale oni mu odpowiedzieli: Dlaczego mój pan mówi takie słowa? Nie daj Boże, aby twoi słudzy mieli tak postąpić."
  tags: []
"Rdz44,8":
  text: "Przecież pieniądze, które znaleźliśmy na wierzchu naszych worów, przynieśliśmy do ciebie z powrotem z ziemi Kanaan. Jakże mielibyśmy kraść z domu twego pana srebro lub złoto?"
  tags: []
"Rdz44,9":
  text: "U którego z twoich sług to się znajdzie, niech umrze, a my będziemy niewolnikami mego pana."
  tags: []
"Rdz44,10":
  text: "On powiedział: Niech będzie tak, jak mówicie. Przy którym znajdzie się kielich, ten będzie niewolnikiem, a wy będziecie niewinni."
  tags: []
"Rdz44,11":
  text: "Wtedy każdy szybko zdjął swój wór na ziemię i rozwiązał go."
  tags: []
"Rdz44,12":
  text: "I szukał, zaczynając od starszego, a kończąc na najmłodszym. I znalazł kielich w worze Beniamina."
  tags: []
"Rdz44,13":
  text: "Wtedy rozdarli swoje szaty, każdy załadował swego osła i wrócili do miasta."
  tags: []
"Rdz44,14":
  text: "Przyszedł więc Juda i jego bracia do domu Józefa, który tam jeszcze był. I upadli przed nim na ziemię."
  tags: []
"Rdz44,15":
  text: "I Józef zapytał ich: Co zrobiliście? Czy nie wiedzieliście, że taki człowiek jak ja potrafi wróżyć?"
  tags: []
"Rdz44,16":
  text: "Wtedy Juda odpowiedział: Cóż możemy odpowiedzieć memu panu? Co możemy mówić i jak mamy się usprawiedliwić? Bóg znalazł nieprawość u twoich sług. Oto jesteśmy niewolnikami mego pana, zarówno my, jak i ten, u którego znalazł się kielich."
  tags: []
"Rdz44,17":
  text: "A on odpowiedział: Nie daj Boże, abym miał tak uczynić. Człowiek, w którego ręku znaleziono kielich, będzie moim niewolnikiem. Wy zaś jedźcie w pokoju do waszego ojca."
  tags: []
"Rdz44,18":
  text: "Wtedy Juda podszedł do niego i powiedział: Mój panie! Pozwól twemu słudze mówić słowo do uszu mego pana, a niech nie zapala się twój gniew na twego sługę, gdyż ty jesteś jak sam faraon."
  tags: []
"Rdz44,19":
  text: "Mój pan pytał swoich sług: Czy macie ojca albo brata?"
  tags: []
"Rdz44,20":
  text: "Wtedy odpowiedzieliśmy memu panu: Mamy ojca, starca, i chłopca małego spłodzonego w jego starości. Jego brat umarł i tylko on został po swej matce, i jego ojciec go kocha."
  tags: []
"Rdz44,21":
  text: "Potem mówiłeś do nas, swoich sług: Przyprowadźcie go do mnie, abym mógł go zobaczyć własnymi oczyma."
  tags: []
"Rdz44,22":
  text: "I mówiliśmy do mego pana: Chłopiec nie będzie mógł opuścić swego ojca, bo gdyby opuścił swego ojca, ten by umarł."
  tags: []
"Rdz44,23":
  text: "Wtedy powiedziałeś do swoich sług: Jeśli nie przyjdzie z wami wasz najmłodszy brat, więcej nie zobaczycie mojej twarzy."
  tags: []
"Rdz44,24":
  text: "Gdy więc przyszliśmy do twego sługi, mego ojca, powtórzyliśmy mu te słowa mego pana."
  tags: []
"Rdz44,25":
  text: "Wtedy nasz ojciec powiedział: Jedźcie znowu i kupcie nam trochę żywności."
  tags: []
"Rdz44,26":
  text: "I powiedzieliśmy: Nie możemy tam iść. Lecz jeśli będzie z nami nasz najmłodszy brat, wtedy pojedziemy. Bo nie będziemy mogli zobaczyć twarzy tego człowieka, jeśli nie będzie z nami naszego najmłodszego brata."
  tags: []
"Rdz44,27":
  text: "I twój sługa, mój ojciec, powiedział do nas: Wy wiecie, że moja żona urodziła mi dwóch synów."
  tags: []
"Rdz44,28":
  text: "Jeden wyszedł ode mnie i powiedziałem: Na pewno został rozszarpany przez zwierzę i nie widziałem go do dziś."
  tags: []
"Rdz44,29":
  text: "A jeśli zabierzecie mi też tego i spotka go nieszczęście, wtedy w żalu doprowadzicie mnie, osiwiałego, do grobu."
  tags: []
"Rdz44,30":
  text: "Dlatego jeśli przyjdę do twego sługi, mojego ojca, a nie będzie z nami chłopca, z którym jest bardzo związany;"
  tags: []
"Rdz44,31":
  text: "Stanie się tak, że jak tylko zobaczy, że chłopca nie ma, umrze. A twoi słudzy doprowadzą twego sługę, naszego ojca, osiwiałego, z żalu do grobu."
  tags: []
"Rdz44,32":
  text: "Bo twój sługa wziął na siebie odpowiedzialność przed ojcem i mówił: Jeśli go nie przyprowadzę, będę po wszystkie dni winien grzechu przeciw mojemu ojcu."
  tags: []
"Rdz44,33":
  text: "Teraz więc, proszę, niech twój sługa zostanie niewolnikiem mego pana zamiast tego chłopca, a niech chłopak idzie ze swymi braćmi."
  tags: []
"Rdz44,34":
  text: "Bo jak ja mam wrócić do mego ojca, gdy nie będzie ze mną tego chłopca? Nie chciałbym patrzeć na rozpacz, która by dotknęła mego ojca."
  tags: []
