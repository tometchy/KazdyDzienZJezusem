"Rdz9,1":
  text: "I Bóg błogosławił Noego i jego synów, i powiedział im: Bądźcie płodni i rozmnażajcie się, i napełniajcie ziemię."
  tags: []
"Rdz9,2":
  text: "A strach i lęk przed wami będzie nad wszelkim zwierzęciem ziemi, nad wszelkim ptactwem nieba, nad wszystkim, co się porusza na ziemi, i nad wszelkimi rybami morza; oddane są w wasze ręce."
  tags: []
"Rdz9,3":
  text: "Wszystko, co się porusza i żyje, będzie dla was pokarmem, podobnie jak rośliny zielone, daję wam to wszystko."
  tags: []
"Rdz9,4":
  text: "Lecz nie będziecie jeść mięsa z jego życiem, to jest z jego krwią."
  tags: []
"Rdz9,5":
  text: "A ja będę żądał waszej krwi, to jest waszego życia; od każdego zwierzęcia będę jej żądał, jak i od ręki człowieka; od ręki każdego brata jego będę żądał życia człowieka."
  tags: []
"Rdz9,6":
  text: "Kto przeleje krew człowieka, przez człowieka będzie przelana jego krew, bo na obraz Boga człowiek został stworzony."
  tags: []
"Rdz9,7":
  text: "Wy zaś bądźcie płodni i rozmnażajcie się; rozradzajcie się na ziemi i rozmnażajcie się na niej."
  tags: []
"Rdz9,8":
  text: "Potem Bóg powiedział do Noego i do jego synów z nim:"
  tags: []
"Rdz9,9":
  text: "A ja, oto ja ustanawiam moje przymierze z wami i z waszym potomstwem po was;"
  tags: []
"Rdz9,10":
  text: "I z wszelką żywą istotą, która jest z wami, z ptactwem, bydłem oraz z wszelkim zwierzęciem ziemi, które jest z wami, od wszystkich, które wyszły z arki, aż do każdego zwierzęcia ziemi."
  tags: []
"Rdz9,11":
  text: "Ustanowię moje przymierze z wami. Nie będzie już więcej zgładzone wszelkie ciało wodami potopu ani nie będzie już więcej potopu, który miałby zniszczyć ziemię."
  tags: []
"Rdz9,12":
  text: "I Bóg powiedział: To jest znak przymierza, które ja ustanawiam między mną a wami i między wszelką żywą istotą, która jest z wami, na wieczne pokolenia."
  tags: []
"Rdz9,13":
  text: "Kładę na obłoku mój łuk, który będzie na znak przymierza między mną a ziemią."
  tags: []
"Rdz9,14":
  text: "I stanie się, gdy wzbudzę obłok nad ziemią, że ukaże się łuk na obłoku;"
  tags: []
"Rdz9,15":
  text: "I wspomnę na moje przymierze, które jest między mną a wami oraz wszelką żywą istotą cielesną. Nie będzie już więcej wód potopu, który miałby zniszczyć wszelkie ciało."
  tags: []
"Rdz9,16":
  text: "Będzie więc ten łuk na obłoku i spojrzę na niego, aby przypomnieć sobie wieczne przymierze między Bogiem a wszelką żywą istotą cielesną, która jest na ziemi."
  tags: []
"Rdz9,17":
  text: "I Bóg powiedział do Noego: To jest znak przymierza, które ustanowiłem między mną a wszelkim ciałem, które jest na ziemi."
  tags: []
"Rdz9,18":
  text: "A synami Noego, którzy wyszli z arki, byli: Sem, Cham i Jafet. Cham jest ojcem Kanaana."
  tags: []
"Rdz9,19":
  text: "To są trzej synowie Noego, przez których napełniła się ludem cała ziemia."
  tags: []
"Rdz9,20":
  text: "Wtedy Noe zaczął uprawiać ziemię i zasadził winnicę."
  tags: []
"Rdz9,21":
  text: "Potem pił wino i upił się; i leżał odkryty w swoim namiocie."
  tags: []
"Rdz9,22":
  text: "A Cham, ojciec Kanaana, zobaczył nagość swego ojca i opowiedział o tym dwom swoim braciom na dworze."
  tags: []
"Rdz9,23":
  text: "Wtedy Sem i Jafet wzięli szatę, założyli ją sobie na ramiona, weszli tyłem i zakryli nagość swego ojca; a ich twarze były odwrócone, tak że nie widzieli nagości swego ojca."
  tags: []
"Rdz9,24":
  text: "A gdy Noe obudził się po winie, dowiedział się, co mu zrobił jego młodszy syn;"
  tags: []
"Rdz9,25":
  text: "I powiedział: Niech będzie przeklęty Kanaan, będzie sługą sług swoich braci."
  tags: []
"Rdz9,26":
  text: "Potem dodał: Niech będzie błogosławiony PAN Bóg Sema, a niech Kanaan będzie jego sługą."
  tags: []
"Rdz9,27":
  text: "Niech Bóg rozprzestrzeni Jafeta i niech mieszka on w namiotach Sema, a niech będzie Kanaan jego sługą."
  tags: []
"Rdz9,28":
  text: "I Noe żył po potopie trzysta pięćdziesiąt lat."
  tags: []
"Rdz9,29":
  text: "I wszystkich dni Noego było dziewięćset pięćdziesiąt lat i umarł."
  tags: []
