"Rdz49,1":
  text: "Potem Jakub wezwał swoich synów i powiedział: Zbierzcie się, a oznajmię wam, co was spotka w waszych ostatnich dniach."
  tags: []
"Rdz49,2":
  text: "Zbierzcie się i słuchajcie, synowie Jakuba, a słuchajcie waszego ojca Izraela."
  tags: []
"Rdz49,3":
  text: "Rubenie, mój pierworodny, ty jesteś moją mocą i początkiem mojej siły, pierwszy dostojeństwem i pierwszy męstwem."
  tags: []
"Rdz49,4":
  text: "Niestabilny jak woda, nie będziesz przodować, bo wstąpiłeś do łoża twego ojca; wstępując do mojego posłania, zbezcześciłeś je."
  tags: []
"Rdz49,5":
  text: "Symeon i Lewi, bracia, ich miecze to narzędzia przemocy."
  tags: []
"Rdz49,6":
  text: "Niech moja dusza nie wchodzi w ich radę, niech moja sława nie jednoczy się z ich zgromadzeniem, bo w swej zapalczywości zabili człowieka, a w samowoli wywrócili mur."
  tags: []
"Rdz49,7":
  text: "Przeklęta ich zapalczywość, bo uparta, i ich gniew, bo zatwardziały. Rozdzielę ich w Jakubie, a rozproszę ich w Izraelu."
  tags: []
"Rdz49,8":
  text: "Judo, to ciebie będą chwalić twoi bracia, twoja ręka będzie na karku twoich nieprzyjaciół, synowie twego ojca będą ci się kłaniać."
  tags: []
"Rdz49,9":
  text: "Judo, szczenię lwie, wróciłeś od łupu, mój synu. Skłonił się i położył się jak lew i jak lwica. Któż go obudzi?"
  tags: []
"Rdz49,10":
  text: "Nie będzie odjęte berło od Judy ani prawodawca spomiędzy jego nóg, aż przyjdzie Szylo i jemu będą posłuszne narody."
  tags: []
"Rdz49,11":
  text: "Przywiąże do winorośli swoje oślę, a do wybornej winorośli – oślątko swojej oślicy. Wypierze w winie swoją szatę, a we krwi winogron – swoje odzienie."
  tags: []
"Rdz49,12":
  text: "Jego oczy czerwone od wina, a zęby białe od mleka."
  tags: []
"Rdz49,13":
  text: "Zebulon będzie mieszkać na morskim brzegu, przy porcie okrętów, a jego granice będą aż do Sydonu."
  tags: []
"Rdz49,14":
  text: "Issachar jak osioł kościsty leżący między dwoma brzemionami."
  tags: []
"Rdz49,15":
  text: "Zobaczył, że spoczynek jest dobry i ziemię, że jest urocza, nachylił swe ramię, by dźwigać, i stał się sługą składającym daninę."
  tags: []
"Rdz49,16":
  text: "Dan będzie sądzić swój lud jako jedno z pokoleń Izraela."
  tags: []
"Rdz49,17":
  text: "Dan będzie wężem na drodze, żmiją na ścieżce kąsającą końskie pięty, tak że jeździec spadnie do tyłu."
  tags: []
"Rdz49,18":
  text: "Oczekuję twego zbawienia, PANIE!"
  tags: []
"Rdz49,19":
  text: "Gad będzie zwyciężony przez wojsko, ale on na koniec zwycięży."
  tags: []
"Rdz49,20":
  text: "Od Aszera będzie tłusty chleb, a on dostarczy przysmaków królewskich."
  tags: []
"Rdz49,21":
  text: "Neftali jak wypuszczona łania, mówiący piękne słowa."
  tags: []
"Rdz49,22":
  text: "Józef, latorośl płodna, latorośl płodna przy źródle, a jej szczepy rozchodzą się po murze."
  tags: []
"Rdz49,23":
  text: "Choć napoili go goryczą i strzelali do niego, i nienawidzili go strzelcy;"
  tags: []
"Rdz49,24":
  text: "Jednak jego łuk został potężny i wzmocniły się ramiona jego rąk dzięki rękom mocnego Boga Jakuba, stamtąd pasterz i opoka Izraela."
  tags: []
"Rdz49,25":
  text: "Od Boga twego ojca, który będzie cię wspomagał, i od Wszechmogącego, który ci pobłogosławi błogosławieństwami nieba z wysoka i błogosławieństwami głębin leżących na dole, i błogosławieństwami piersi i łona."
  tags: []
"Rdz49,26":
  text: "Błogosławieństwa twego ojca będą mocniejsze niż błogosławieństwa moich przodków aż do granic pagórków wiecznych. Będą nad głową Józefa i nad wierzchem głowy odłączonego od swych braci."
  tags: []
"Rdz49,27":
  text: "Beniamin jak drapieżny wilk, rano będzie jeść zdobycz, a wieczorem będzie dzielił łupy."
  tags: []
"Rdz49,28":
  text: "Oto wszystkich dwanaście pokoleń Izraela i to, co im powiedział ich ojciec, gdy im błogosławił. Każdemu według jego błogosławieństwa błogosławił."
  tags: []
"Rdz49,29":
  text: "Potem im nakazał: Ja będę przyłączony do mojego ludu. Pogrzebcie mnie z moimi ojcami w jaskini, która jest na polu Efrona Chetyty;"
  tags: []
"Rdz49,30":
  text: "W jaskini, która jest na polu Makpela naprzeciwko Mamre w ziemi Kanaan. Kupił ją wraz z polem Abraham od Efrona Chetyty jako grób na własność."
  tags: []
"Rdz49,31":
  text: "Tam pogrzebano Abrahama i jego żonę Sarę, tam pogrzebano Izaaka i jego żonę Rebekę. Tam też pogrzebałem Leę."
  tags: []
"Rdz49,32":
  text: "Pole to i jaskinię na nim kupiono od synów Cheta."
  tags: []
"Rdz49,33":
  text: "A gdy Jakub przestał mówić do swoich synów, złożył swoje nogi na łoże i umarł, i został przyłączony do swego ludu."
  tags: []
