"Rdz49,1": "Potem Jakub wezwał swoich synów i powiedział: Zbierzcie się, a oznajmię wam, co was spotka w waszych ostatnich dniach."
"Rdz49,2": "Zbierzcie się i słuchajcie, synowie Jakuba, a słuchajcie waszego ojca Izraela."
"Rdz49,3": "Rubenie, mój pierworodny, ty jesteś moją mocą i początkiem mojej siły, pierwszy dostojeństwem i pierwszy męstwem."
"Rdz49,4": "Niestabilny jak woda, nie będziesz przodować, bo wstąpiłeś do łoża twego ojca; wstępując do mojego posłania, zbezcześciłeś je."
"Rdz49,5": "Symeon i Lewi, bracia, ich miecze to narzędzia przemocy."
"Rdz49,6": "Niech moja dusza nie wchodzi w ich radę, niech moja sława nie jednoczy się z ich zgromadzeniem, bo w swej zapalczywości zabili człowieka, a w samowoli wywrócili mur."
"Rdz49,7": "Przeklęta ich zapalczywość, bo uparta, i ich gniew, bo zatwardziały. Rozdzielę ich w Jakubie, a rozproszę ich w Izraelu."
"Rdz49,8": "Judo, to ciebie będą chwalić twoi bracia, twoja ręka będzie na karku twoich nieprzyjaciół, synowie twego ojca będą ci się kłaniać."
"Rdz49,9": "Judo, szczenię lwie, wróciłeś od łupu, mój synu. Skłonił się i położył się jak lew i jak lwica. Któż go obudzi?"
"Rdz49,10": "Nie będzie odjęte berło od Judy ani prawodawca spomiędzy jego nóg, aż przyjdzie Szylo i jemu będą posłuszne narody."
"Rdz49,11": "Przywiąże do winorośli swoje oślę, a do wybornej winorośli – oślątko swojej oślicy. Wypierze w winie swoją szatę, a we krwi winogron – swoje odzienie."
"Rdz49,12": "Jego oczy czerwone od wina, a zęby białe od mleka."
"Rdz49,13": "Zebulon będzie mieszkać na morskim brzegu, przy porcie okrętów, a jego granice będą aż do Sydonu."
"Rdz49,14": "Issachar jak osioł kościsty leżący między dwoma brzemionami."
"Rdz49,15": "Zobaczył, że spoczynek jest dobry i ziemię, że jest urocza, nachylił swe ramię, by dźwigać, i stał się sługą składającym daninę."
"Rdz49,16": "Dan będzie sądzić swój lud jako jedno z pokoleń Izraela."
"Rdz49,17": "Dan będzie wężem na drodze, żmiją na ścieżce kąsającą końskie pięty, tak że jeździec spadnie do tyłu."
"Rdz49,18": "Oczekuję twego zbawienia, PANIE!"
"Rdz49,19": "Gad będzie zwyciężony przez wojsko, ale on na koniec zwycięży."
"Rdz49,20": "Od Aszera będzie tłusty chleb, a on dostarczy przysmaków królewskich."
"Rdz49,21": "Neftali jak wypuszczona łania, mówiący piękne słowa."
"Rdz49,22": "Józef, latorośl płodna, latorośl płodna przy źródle, a jej szczepy rozchodzą się po murze."
"Rdz49,23": "Choć napoili go goryczą i strzelali do niego, i nienawidzili go strzelcy;"
"Rdz49,24": "Jednak jego łuk został potężny i wzmocniły się ramiona jego rąk dzięki rękom mocnego Boga Jakuba, stamtąd pasterz i opoka Izraela."
"Rdz49,25": "Od Boga twego ojca, który będzie cię wspomagał, i od Wszechmogącego, który ci pobłogosławi błogosławieństwami nieba z wysoka i błogosławieństwami głębin leżących na dole, i błogosławieństwami piersi i łona."
"Rdz49,26": "Błogosławieństwa twego ojca będą mocniejsze niż błogosławieństwa moich przodków aż do granic pagórków wiecznych. Będą nad głową Józefa i nad wierzchem głowy odłączonego od swych braci."
"Rdz49,27": "Beniamin jak drapieżny wilk, rano będzie jeść zdobycz, a wieczorem będzie dzielił łupy."
"Rdz49,28": "Oto wszystkich dwanaście pokoleń Izraela i to, co im powiedział ich ojciec, gdy im błogosławił. Każdemu według jego błogosławieństwa błogosławił."
"Rdz49,29": "Potem im nakazał: Ja będę przyłączony do mojego ludu. Pogrzebcie mnie z moimi ojcami w jaskini, która jest na polu Efrona Chetyty;"
"Rdz49,30": "W jaskini, która jest na polu Makpela naprzeciwko Mamre w ziemi Kanaan. Kupił ją wraz z polem Abraham od Efrona Chetyty jako grób na własność."
"Rdz49,31": "Tam pogrzebano Abrahama i jego żonę Sarę, tam pogrzebano Izaaka i jego żonę Rebekę. Tam też pogrzebałem Leę."
"Rdz49,32": "Pole to i jaskinię na nim kupiono od synów Cheta."
"Rdz49,33": "A gdy Jakub przestał mówić do swoich synów, złożył swoje nogi na łoże i umarł, i został przyłączony do swego ludu."
