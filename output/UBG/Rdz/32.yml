"Rdz32,1": "Jakub też poszedł swoją drogą i spotkali go aniołowie Boga."
"Rdz32,2": "Gdy Jakub ich ujrzał, powiedział: To obóz Boga. I nadał temu miejscu nazwę Machanaim."
"Rdz32,3": "Potem Jakub wysłał przed sobą posłańców do swego brata Ezawa, do ziemi Seir, do krainy Edomu."
"Rdz32,4": "I rozkazał im: Tak powiecie do mego pana Ezawa: To mówi twój sługa Jakub: Byłem gościem u Labana i przebywałem z nim aż do tego czasu."
"Rdz32,5": "Mam woły, osły i owce, służących i służące, a posyłam oznajmić to memu panu, żebym znalazł łaskę w twoich oczach."
"Rdz32,6": "Posłańcy wrócili do Jakuba i mówili: Przyszliśmy do twego brata Ezawa, a on też idzie naprzeciwko ciebie, a z nim czterystu mężów."
"Rdz32,7": "Jakub bardzo się przestraszył i ogarnęła go trwoga. Podzielił więc lud, który z nim był, oraz owce, woły i wielbłądy na dwa obozy."
"Rdz32,8": "I powiedział: Jeśli Ezaw przyjdzie do jednego obozu i uderzy na niego, to drugi obóz ocaleje."
"Rdz32,9": "Potem Jakub powiedział: Boże mego ojca Abrahama i Boże mego ojca Izaaka, PANIE, który do mnie powiedziałeś: Wróć do twojej ziemi i do twojej rodziny, a będę ci wyświadczał dobro."
"Rdz32,10": "Nie jestem godzien wszelkiego miłosierdzia i całej wierności, które okazałeś swemu słudze. Bo tylko o lasce przeszedłem ten Jordan, a teraz mam dwa obozy."
"Rdz32,11": "Wyrwij mnie, proszę, z ręki mego brata, z ręki Ezawa, bo się go boję, że przyjdzie i zabije mnie i matki z dziećmi."
"Rdz32,12": "Ty bowiem powiedziałeś: Na pewno będę ci wyświadczał dobro i rozmnożę twoje potomstwo jak piasek morski, który nie może być zliczony z powodu jego mnóstwa."
"Rdz32,13": "I przenocował tam tej nocy, i wziął z tego, co miał pod ręką, dar dla swego brata Ezawa;"
"Rdz32,14": "Dwieście kóz i dwadzieścia kozłów, dwieście owiec i dwadzieścia baranów;"
"Rdz32,15": "Trzydzieści karmiących wielbłądzic z młodymi, czterdzieści krów i dziesięć wołów, dwadzieścia oślic i dziesięcioro ośląt."
"Rdz32,16": "I oddał je w ręce swoich sług, każde stado oddzielnie, i powiedział do swoich sług: Idźcie przede mną i zachowajcie odstęp między stadami."
"Rdz32,17": "I rozkazał pierwszemu: Gdy spotka cię mój brat Ezaw, a spyta cię: Czyj jesteś? I dokąd idziesz? A czyje to stado przed tobą?"
"Rdz32,18": "Wtedy odpowiesz: To jest dar od twego sługi Jakuba, posłany memu panu Ezawowi. A oto on sam idzie za nami."
"Rdz32,19": "Tak też rozkazał drugiemu i trzeciemu, i wszystkim idącym za tymi stadami: Tymi słowy mówcie do Ezawa, gdy go spotkacie."
"Rdz32,20": "Powiecie mu też: Oto twój sługa Jakub idzie za nami. Myślał bowiem: Przebłagam go darem, który idzie przede mną, a potem zobaczę jego oblicze. Może mnie przyjmie łaskawie."
"Rdz32,21": "I poszedł przed nim ten dar, a sam przenocował tej nocy ze swoim obozem."
"Rdz32,22": "Wstał tej nocy, wziął obie swe żony i dwie swoje służebnice oraz jedenastu swoich synów i przeszedł przez bród Jabboku."
"Rdz32,23": "I wziął ich, przeprawił przez tę rzekę i przeprowadził wszystko, co miał."
"Rdz32,24": "Jakub zaś został sam. I walczył z nim pewien mężczyzna aż do wzejścia zorzy."
"Rdz32,25": "A widząc, że nie może go pokonać, dotknął go w staw biodrowy i wytrącił biodro Jakubowi ze stawu, gdy się z nim mocował."
"Rdz32,26": "I powiedział: Puść mnie, bo już wzeszła zorza. Odpowiedział: Nie puszczę cię, aż mi pobłogosławisz."
"Rdz32,27": "Wtedy mu powiedział: Jakie jest twoje imię? I odpowiedział: Jakub."
"Rdz32,28": "I powiedział: Twoim imieniem nie będzie już Jakub, ale Izrael, bo mężnie zmagałeś się z Bogiem i z ludźmi i zwyciężyłeś."
"Rdz32,29": "I Jakub spytał: Powiedz mi, proszę, twoje imię. A on odpowiedział: Czemu pytasz o moje imię? I tam mu błogosławił."
"Rdz32,30": "Jakub nadał więc temu miejscu nazwę Penuel, mówiąc: Widziałem bowiem Boga twarzą w twarz, a moja dusza została zachowana."
"Rdz32,31": "I kiedy minął miejsce Penuel, wzeszło słońce, a on utykał z powodu swojego biodra."
"Rdz32,32": "Dlatego do dziś synowie Izraela nie jadają ścięgna, które jest w stawie biodrowym, gdyż dotknął Jakuba w staw biodrowy, w ścięgno, które się skurczyło."
