"Rdz32,1":
  text: "Jakub też poszedł swoją drogą i spotkali go aniołowie Boga."
  tags: []
"Rdz32,2":
  text: "Gdy Jakub ich ujrzał, powiedział: To obóz Boga. I nadał temu miejscu nazwę Machanaim."
  tags: []
"Rdz32,3":
  text: "Potem Jakub wysłał przed sobą posłańców do swego brata Ezawa, do ziemi Seir, do krainy Edomu."
  tags: []
"Rdz32,4":
  text: "I rozkazał im: Tak powiecie do mego pana Ezawa: To mówi twój sługa Jakub: Byłem gościem u Labana i przebywałem z nim aż do tego czasu."
  tags: []
"Rdz32,5":
  text: "Mam woły, osły i owce, służących i służące, a posyłam oznajmić to memu panu, żebym znalazł łaskę w twoich oczach."
  tags: []
"Rdz32,6":
  text: "Posłańcy wrócili do Jakuba i mówili: Przyszliśmy do twego brata Ezawa, a on też idzie naprzeciwko ciebie, a z nim czterystu mężów."
  tags: []
"Rdz32,7":
  text: "Jakub bardzo się przestraszył i ogarnęła go trwoga. Podzielił więc lud, który z nim był, oraz owce, woły i wielbłądy na dwa obozy."
  tags: []
"Rdz32,8":
  text: "I powiedział: Jeśli Ezaw przyjdzie do jednego obozu i uderzy na niego, to drugi obóz ocaleje."
  tags: []
"Rdz32,9":
  text: "Potem Jakub powiedział: Boże mego ojca Abrahama i Boże mego ojca Izaaka, PANIE, który do mnie powiedziałeś: Wróć do twojej ziemi i do twojej rodziny, a będę ci wyświadczał dobro."
  tags: []
"Rdz32,10":
  text: "Nie jestem godzien wszelkiego miłosierdzia i całej wierności, które okazałeś swemu słudze. Bo tylko o lasce przeszedłem ten Jordan, a teraz mam dwa obozy."
  tags: []
"Rdz32,11":
  text: "Wyrwij mnie, proszę, z ręki mego brata, z ręki Ezawa, bo się go boję, że przyjdzie i zabije mnie i matki z dziećmi."
  tags: []
"Rdz32,12":
  text: "Ty bowiem powiedziałeś: Na pewno będę ci wyświadczał dobro i rozmnożę twoje potomstwo jak piasek morski, który nie może być zliczony z powodu jego mnóstwa."
  tags: []
"Rdz32,13":
  text: "I przenocował tam tej nocy, i wziął z tego, co miał pod ręką, dar dla swego brata Ezawa;"
  tags: []
"Rdz32,14":
  text: "Dwieście kóz i dwadzieścia kozłów, dwieście owiec i dwadzieścia baranów;"
  tags: []
"Rdz32,15":
  text: "Trzydzieści karmiących wielbłądzic z młodymi, czterdzieści krów i dziesięć wołów, dwadzieścia oślic i dziesięcioro ośląt."
  tags: []
"Rdz32,16":
  text: "I oddał je w ręce swoich sług, każde stado oddzielnie, i powiedział do swoich sług: Idźcie przede mną i zachowajcie odstęp między stadami."
  tags: []
"Rdz32,17":
  text: "I rozkazał pierwszemu: Gdy spotka cię mój brat Ezaw, a spyta cię: Czyj jesteś? I dokąd idziesz? A czyje to stado przed tobą?"
  tags: []
"Rdz32,18":
  text: "Wtedy odpowiesz: To jest dar od twego sługi Jakuba, posłany memu panu Ezawowi. A oto on sam idzie za nami."
  tags: []
"Rdz32,19":
  text: "Tak też rozkazał drugiemu i trzeciemu, i wszystkim idącym za tymi stadami: Tymi słowy mówcie do Ezawa, gdy go spotkacie."
  tags: []
"Rdz32,20":
  text: "Powiecie mu też: Oto twój sługa Jakub idzie za nami. Myślał bowiem: Przebłagam go darem, który idzie przede mną, a potem zobaczę jego oblicze. Może mnie przyjmie łaskawie."
  tags: []
"Rdz32,21":
  text: "I poszedł przed nim ten dar, a sam przenocował tej nocy ze swoim obozem."
  tags: []
"Rdz32,22":
  text: "Wstał tej nocy, wziął obie swe żony i dwie swoje służebnice oraz jedenastu swoich synów i przeszedł przez bród Jabboku."
  tags: []
"Rdz32,23":
  text: "I wziął ich, przeprawił przez tę rzekę i przeprowadził wszystko, co miał."
  tags: []
"Rdz32,24":
  text: "Jakub zaś został sam. I walczył z nim pewien mężczyzna aż do wzejścia zorzy."
  tags: []
"Rdz32,25":
  text: "A widząc, że nie może go pokonać, dotknął go w staw biodrowy i wytrącił biodro Jakubowi ze stawu, gdy się z nim mocował."
  tags: []
"Rdz32,26":
  text: "I powiedział: Puść mnie, bo już wzeszła zorza. Odpowiedział: Nie puszczę cię, aż mi pobłogosławisz."
  tags: []
"Rdz32,27":
  text: "Wtedy mu powiedział: Jakie jest twoje imię? I odpowiedział: Jakub."
  tags: []
"Rdz32,28":
  text: "I powiedział: Twoim imieniem nie będzie już Jakub, ale Izrael, bo mężnie zmagałeś się z Bogiem i z ludźmi i zwyciężyłeś."
  tags: []
"Rdz32,29":
  text: "I Jakub spytał: Powiedz mi, proszę, twoje imię. A on odpowiedział: Czemu pytasz o moje imię? I tam mu błogosławił."
  tags: []
"Rdz32,30":
  text: "Jakub nadał więc temu miejscu nazwę Penuel, mówiąc: Widziałem bowiem Boga twarzą w twarz, a moja dusza została zachowana."
  tags: []
"Rdz32,31":
  text: "I kiedy minął miejsce Penuel, wzeszło słońce, a on utykał z powodu swojego biodra."
  tags: []
"Rdz32,32":
  text: "Dlatego do dziś synowie Izraela nie jadają ścięgna, które jest w stawie biodrowym, gdyż dotknął Jakuba w staw biodrowy, w ścięgno, które się skurczyło."
  tags: []
