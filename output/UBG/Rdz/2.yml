"Rdz2,1": "Tak ukończone zostały niebiosa i ziemia oraz wszystkie ich zastępy."
"Rdz2,2": "W siódmym dniu Bóg ukończył swe dzieło, które uczynił; i odpoczął siódmego dnia od wszelkiego swego dzieła, które stworzył."
"Rdz2,3": "I Bóg błogosławił siódmy dzień, i poświęcił go, bo w nim odpoczął od wszelkiego swego dzieła, które Bóg stworzył i uczynił."
"Rdz2,4": "Takie są dzieje stworzenia niebios i ziemi w dniu, w którym PAN Bóg uczynił ziemię i niebiosa;"
"Rdz2,5": "Wszelkie krzewy polne, zanim były na ziemi, i wszelkie rośliny polne, nim wzeszły. Bo PAN Bóg jeszcze nie spuścił deszczu na ziemię i nie było człowieka, który by uprawiał ziemię."
"Rdz2,6": "Ale z ziemi wychodziła para, która nawilżała całą powierzchnię ziemi."
"Rdz2,7": "Wtedy PAN Bóg ukształtował człowieka z prochu ziemi i tchnął w jego nozdrza tchnienie życia. I człowiek stał się żywą duszą."
"Rdz2,8": "PAN Bóg zasadził też ogród w Edenie, na wschodzie, i umieścił tam człowieka, którego ukształtował."
"Rdz2,9": "I wywiódł PAN Bóg z ziemi wszelkie drzewa miłe dla oka i których owoce były dobre do jedzenia oraz drzewo życia pośrodku ogrodu i drzewo poznania dobra i zła."
"Rdz2,10": "A z Edenu wypływała rzeka, aby nawadniać ogród; i stamtąd dzieliła się na cztery główne rzeki."
"Rdz2,11": "Nazwa pierwszej – Piszon; to ta, która okrąża całą ziemię Chawila, gdzie znajduje się złoto."
"Rdz2,12": "A złoto tej ziemi jest wyborne. Tam też jest bdellium i kamień onyksowy."
"Rdz2,13": "Nazwa drugiej rzeki – Gichon; ta okrąża całą ziemię Kusz."
"Rdz2,14": "Nazwa zaś trzeciej rzeki – Chiddekel; płynie ona na wschód ku Asyrii. A czwarta rzeka to Eufrat."
"Rdz2,15": "PAN Bóg wziął więc człowieka i umieścił go w ogrodzie Eden, aby go uprawiał i strzegł."
"Rdz2,16": "I rozkazał PAN Bóg człowiekowi: Możesz jeść do woli z każdego drzewa ogrodu;"
"Rdz2,17": "Ale z drzewa poznania dobra i zła jeść nie będziesz, bo tego dnia, kiedy zjesz z niego, na pewno umrzesz."
"Rdz2,18": "PAN Bóg powiedział też: Niedobrze, by człowiek był sam; uczynię mu odpowiednią dla niego pomoc."
"Rdz2,19": "I ukształtował PAN Bóg z ziemi wszelkie zwierzęta polne i wszelkie ptactwo niebieskie, i przyprowadził je do Adama, aby zobaczyć, jak je nazwie; a jak Adam nazwał każdą istotę żywą, taka była jej nazwa."
"Rdz2,20": "I Adam nadał nazwy wszelkiemu bydłu i ptactwu niebieskiemu, i wszelkim zwierzętom polnym. Dla Adama jednak nie znalazła się pomoc odpowiednia dla niego."
"Rdz2,21": "Wtedy PAN Bóg zesłał głęboki sen na Adama; a gdy zasnął, wyjął jedno z jego żeber i zapełnił ciałem miejsce po nim."
"Rdz2,22": "I z tego żebra, które PAN Bóg wyjął z Adama, utworzył kobietę i przyprowadził ją do Adama."
"Rdz2,23": "I Adam powiedział: To teraz jest kość z moich kości i ciało z mojego ciała; dlatego będzie nazwana kobietą, bo z mężczyzny została wzięta."
"Rdz2,24": "Dlatego opuści mężczyzna swojego ojca i swoją matkę i połączy się ze swoją żoną, i będą jednym ciałem."
"Rdz2,25": "I oboje, Adam i jego żona, byli nadzy, a nie wstydzili się."
