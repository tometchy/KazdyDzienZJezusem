"Rdz2,1":
  text: "Tak ukończone zostały niebiosa i ziemia oraz wszystkie ich zastępy."
  tags: []
"Rdz2,2":
  text: "W siódmym dniu Bóg ukończył swe dzieło, które uczynił; i odpoczął siódmego dnia od wszelkiego swego dzieła, które stworzył."
  tags: []
"Rdz2,3":
  text: "I Bóg błogosławił siódmy dzień, i poświęcił go, bo w nim odpoczął od wszelkiego swego dzieła, które Bóg stworzył i uczynił."
  tags: []
"Rdz2,4":
  text: "Takie są dzieje stworzenia niebios i ziemi w dniu, w którym PAN Bóg uczynił ziemię i niebiosa;"
  tags: []
"Rdz2,5":
  text: "Wszelkie krzewy polne, zanim były na ziemi, i wszelkie rośliny polne, nim wzeszły. Bo PAN Bóg jeszcze nie spuścił deszczu na ziemię i nie było człowieka, który by uprawiał ziemię."
  tags: []
"Rdz2,6":
  text: "Ale z ziemi wychodziła para, która nawilżała całą powierzchnię ziemi."
  tags: []
"Rdz2,7":
  text: "Wtedy PAN Bóg ukształtował człowieka z prochu ziemi i tchnął w jego nozdrza tchnienie życia. I człowiek stał się żywą duszą."
  tags: []
"Rdz2,8":
  text: "PAN Bóg zasadził też ogród w Edenie, na wschodzie, i umieścił tam człowieka, którego ukształtował."
  tags: []
"Rdz2,9":
  text: "I wywiódł PAN Bóg z ziemi wszelkie drzewa miłe dla oka i których owoce były dobre do jedzenia oraz drzewo życia pośrodku ogrodu i drzewo poznania dobra i zła."
  tags: []
"Rdz2,10":
  text: "A z Edenu wypływała rzeka, aby nawadniać ogród; i stamtąd dzieliła się na cztery główne rzeki."
  tags: []
"Rdz2,11":
  text: "Nazwa pierwszej – Piszon; to ta, która okrąża całą ziemię Chawila, gdzie znajduje się złoto."
  tags: []
"Rdz2,12":
  text: "A złoto tej ziemi jest wyborne. Tam też jest bdellium i kamień onyksowy."
  tags: []
"Rdz2,13":
  text: "Nazwa drugiej rzeki – Gichon; ta okrąża całą ziemię Kusz."
  tags: []
"Rdz2,14":
  text: "Nazwa zaś trzeciej rzeki – Chiddekel; płynie ona na wschód ku Asyrii. A czwarta rzeka to Eufrat."
  tags: []
"Rdz2,15":
  text: "PAN Bóg wziął więc człowieka i umieścił go w ogrodzie Eden, aby go uprawiał i strzegł."
  tags: []
"Rdz2,16":
  text: "I rozkazał PAN Bóg człowiekowi: Możesz jeść do woli z każdego drzewa ogrodu;"
  tags: []
"Rdz2,17":
  text: "Ale z drzewa poznania dobra i zła jeść nie będziesz, bo tego dnia, kiedy zjesz z niego, na pewno umrzesz."
  tags: []
"Rdz2,18":
  text: "PAN Bóg powiedział też: Niedobrze, by człowiek był sam; uczynię mu odpowiednią dla niego pomoc."
  tags: []
"Rdz2,19":
  text: "I ukształtował PAN Bóg z ziemi wszelkie zwierzęta polne i wszelkie ptactwo niebieskie, i przyprowadził je do Adama, aby zobaczyć, jak je nazwie; a jak Adam nazwał każdą istotę żywą, taka była jej nazwa."
  tags: []
"Rdz2,20":
  text: "I Adam nadał nazwy wszelkiemu bydłu i ptactwu niebieskiemu, i wszelkim zwierzętom polnym. Dla Adama jednak nie znalazła się pomoc odpowiednia dla niego."
  tags: []
"Rdz2,21":
  text: "Wtedy PAN Bóg zesłał głęboki sen na Adama; a gdy zasnął, wyjął jedno z jego żeber i zapełnił ciałem miejsce po nim."
  tags: []
"Rdz2,22":
  text: "I z tego żebra, które PAN Bóg wyjął z Adama, utworzył kobietę i przyprowadził ją do Adama."
  tags: []
"Rdz2,23":
  text: "I Adam powiedział: To teraz jest kość z moich kości i ciało z mojego ciała; dlatego będzie nazwana kobietą, bo z mężczyzny została wzięta."
  tags: []
"Rdz2,24":
  text: "Dlatego opuści mężczyzna swojego ojca i swoją matkę i połączy się ze swoją żoną, i będą jednym ciałem."
  tags: []
"Rdz2,25":
  text: "I oboje, Adam i jego żona, byli nadzy, a nie wstydzili się."
  tags: []
