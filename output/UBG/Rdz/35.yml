"Rdz35,1":
  text: "Potem Bóg powiedział do Jakuba: Wstań, wstąp do Betel i tam zamieszkaj. Zbuduj tam ołtarz Bogu, który ci się ukazał, gdy uciekałeś przed swoim bratem Ezawem."
  tags: []
"Rdz35,2":
  text: "Wtedy Jakub powiedział do swych domowników i do wszystkich, którzy z nim byli: Usuńcie obcych bogów, którzy są wśród was, oczyśćcie się i zmieńcie swoje szaty."
  tags: []
"Rdz35,3":
  text: "Wstańmy i pójdźmy do Betel; tam zbuduję ołtarz Bogu, który mnie wysłuchał w dniu mego utrapienia i był ze mną w drodze, którą chodziłem."
  tags: []
"Rdz35,4":
  text: "Oddali więc Jakubowi wszystkich obcych bogów, których mieli, i kolczyki, które mieli w uszach, i Jakub zakopał je pod tym dębem, który był niedaleko Sychem."
  tags: []
"Rdz35,5":
  text: "Potem wyruszyli w drogę. A strach Boży padł na okoliczne miasta i nie ścigali synów Jakuba."
  tags: []
"Rdz35,6":
  text: "Jakub przyszedł więc do Luz, które jest w ziemi Kanaan, czyli do Betel, on i cały lud, który z nim był."
  tags: []
"Rdz35,7":
  text: "I zbudował tam ołtarz, a nazwał to miejsce El-Betel, bo tam ukazał mu się Bóg, gdy uciekał przed swoim bratem."
  tags: []
"Rdz35,8":
  text: "Wtedy umarła Debora, mamka Rebeki, i została pogrzebana przy Betel pod dębem. I nazwano go Allon-Bachut."
  tags: []
"Rdz35,9":
  text: "I Bóg znowu ukazał się Jakubowi, gdy ten wracał z Paddan-Aram, i błogosławił mu."
  tags: []
"Rdz35,10":
  text: "I powiedział mu Bóg: Twoje imię jest Jakub. Nie będziesz już jednak zwany Jakubem, ale twoim imieniem będzie Izrael. I nadał mu imię Izrael."
  tags: []
"Rdz35,11":
  text: "I Bóg mu powiedział: Ja jestem Bóg Wszechmogący. Bądź płodny i rozmnażaj się. Z ciebie powstanie naród i wiele narodów, a z twoich bioder wyjdą królowie."
  tags: []
"Rdz35,12":
  text: "Ziemię, którą dałem Abrahamowi i Izaakowi, dam tobie i twemu potomstwu po tobie dam tę ziemię."
  tags: []
"Rdz35,13":
  text: "I Bóg odszedł od niego z miejsca, na którym z nim rozmawiał."
  tags: []
"Rdz35,14":
  text: "Potem Jakub postawił pomnik na tym miejscu, gdzie Bóg z nim rozmawiał, pomnik kamienny, i wylał na nim ofiarę z płynów, i polał go oliwą."
  tags: []
"Rdz35,15":
  text: "I Jakub nadał temu miejscu, gdzie Bóg z nim rozmawiał, nazwę Betel."
  tags: []
"Rdz35,16":
  text: "Potem wyruszyli z Betel i gdy mieli kawałek drogi do Efraty, Rachela zaczęła rodzić, a poród miała ciężki."
  tags: []
"Rdz35,17":
  text: "Gdy rodziła w wielkich bólach, położna powiedziała do niej: Nie bój się, bo i tego syna będziesz miała."
  tags: []
"Rdz35,18":
  text: "Kiedy uchodziła z niej dusza, bo tam umarła, nadała mu imię Benoni; ale jego ojciec nazwał go Beniamin."
  tags: []
"Rdz35,19":
  text: "Tak to umarła Rachela i została pogrzebana na drodze do Efraty, czyli Betlejem."
  tags: []
"Rdz35,20":
  text: "I Jakub postawił pomnik na jej grobie. To jest pomnik grobu Racheli aż do dziś."
  tags: []
"Rdz35,21":
  text: "Potem Izrael wyruszył stamtąd i rozbił swój namiot za wieżą Eder."
  tags: []
"Rdz35,22":
  text: "A gdy Izrael mieszkał w tej krainie, Ruben poszedł i spał z Bilhą, nałożnicą swego ojca, i Izrael usłyszał o tym. A synów Jakuba było dwunastu."
  tags: []
"Rdz35,23":
  text: "Synowie Lei: Ruben, pierworodny Jakuba, potem Symeon, Lewi, Juda, Issachar i Zebulon."
  tags: []
"Rdz35,24":
  text: "Synowie Racheli: Józef i Beniamin."
  tags: []
"Rdz35,25":
  text: "A synowie Bilhy, służącej Racheli: Dan i Neftali."
  tags: []
"Rdz35,26":
  text: "Synowie Zilpy, służącej Lei: Gad i Aszer. To są synowie Jakuba, którzy mu się urodzili w Paddan-Aram."
  tags: []
"Rdz35,27":
  text: "I Jakub przyszedł do swego ojca Izaaka, do Mamre, do miasta Arba, czyli Hebronu, gdzie przebywali Abraham i Izaak."
  tags: []
"Rdz35,28":
  text: "A dni Izaaka było sto osiemdziesiąt lat."
  tags: []
"Rdz35,29":
  text: "I Izaak oddał ducha, i umarł, i został przyłączony do swego ludu, stary i syty dni; a pogrzebali go jego synowie, Ezaw i Jakub."
  tags: []
