"Rdz35,1": "Potem Bóg powiedział do Jakuba: Wstań, wstąp do Betel i tam zamieszkaj. Zbuduj tam ołtarz Bogu, który ci się ukazał, gdy uciekałeś przed swoim bratem Ezawem."
"Rdz35,2": "Wtedy Jakub powiedział do swych domowników i do wszystkich, którzy z nim byli: Usuńcie obcych bogów, którzy są wśród was, oczyśćcie się i zmieńcie swoje szaty."
"Rdz35,3": "Wstańmy i pójdźmy do Betel; tam zbuduję ołtarz Bogu, który mnie wysłuchał w dniu mego utrapienia i był ze mną w drodze, którą chodziłem."
"Rdz35,4": "Oddali więc Jakubowi wszystkich obcych bogów, których mieli, i kolczyki, które mieli w uszach, i Jakub zakopał je pod tym dębem, który był niedaleko Sychem."
"Rdz35,5": "Potem wyruszyli w drogę. A strach Boży padł na okoliczne miasta i nie ścigali synów Jakuba."
"Rdz35,6": "Jakub przyszedł więc do Luz, które jest w ziemi Kanaan, czyli do Betel, on i cały lud, który z nim był."
"Rdz35,7": "I zbudował tam ołtarz, a nazwał to miejsce El-Betel, bo tam ukazał mu się Bóg, gdy uciekał przed swoim bratem."
"Rdz35,8": "Wtedy umarła Debora, mamka Rebeki, i została pogrzebana przy Betel pod dębem. I nazwano go Allon-Bachut."
"Rdz35,9": "I Bóg znowu ukazał się Jakubowi, gdy ten wracał z Paddan-Aram, i błogosławił mu."
"Rdz35,10": "I powiedział mu Bóg: Twoje imię jest Jakub. Nie będziesz już jednak zwany Jakubem, ale twoim imieniem będzie Izrael. I nadał mu imię Izrael."
"Rdz35,11": "I Bóg mu powiedział: Ja jestem Bóg Wszechmogący. Bądź płodny i rozmnażaj się. Z ciebie powstanie naród i wiele narodów, a z twoich bioder wyjdą królowie."
"Rdz35,12": "Ziemię, którą dałem Abrahamowi i Izaakowi, dam tobie i twemu potomstwu po tobie dam tę ziemię."
"Rdz35,13": "I Bóg odszedł od niego z miejsca, na którym z nim rozmawiał."
"Rdz35,14": "Potem Jakub postawił pomnik na tym miejscu, gdzie Bóg z nim rozmawiał, pomnik kamienny, i wylał na nim ofiarę z płynów, i polał go oliwą."
"Rdz35,15": "I Jakub nadał temu miejscu, gdzie Bóg z nim rozmawiał, nazwę Betel."
"Rdz35,16": "Potem wyruszyli z Betel i gdy mieli kawałek drogi do Efraty, Rachela zaczęła rodzić, a poród miała ciężki."
"Rdz35,17": "Gdy rodziła w wielkich bólach, położna powiedziała do niej: Nie bój się, bo i tego syna będziesz miała."
"Rdz35,18": "Kiedy uchodziła z niej dusza, bo tam umarła, nadała mu imię Benoni; ale jego ojciec nazwał go Beniamin."
"Rdz35,19": "Tak to umarła Rachela i została pogrzebana na drodze do Efraty, czyli Betlejem."
"Rdz35,20": "I Jakub postawił pomnik na jej grobie. To jest pomnik grobu Racheli aż do dziś."
"Rdz35,21": "Potem Izrael wyruszył stamtąd i rozbił swój namiot za wieżą Eder."
"Rdz35,22": "A gdy Izrael mieszkał w tej krainie, Ruben poszedł i spał z Bilhą, nałożnicą swego ojca, i Izrael usłyszał o tym. A synów Jakuba było dwunastu."
"Rdz35,23": "Synowie Lei: Ruben, pierworodny Jakuba, potem Symeon, Lewi, Juda, Issachar i Zebulon."
"Rdz35,24": "Synowie Racheli: Józef i Beniamin."
"Rdz35,25": "A synowie Bilhy, służącej Racheli: Dan i Neftali."
"Rdz35,26": "Synowie Zilpy, służącej Lei: Gad i Aszer. To są synowie Jakuba, którzy mu się urodzili w Paddan-Aram."
"Rdz35,27": "I Jakub przyszedł do swego ojca Izaaka, do Mamre, do miasta Arba, czyli Hebronu, gdzie przebywali Abraham i Izaak."
"Rdz35,28": "A dni Izaaka było sto osiemdziesiąt lat."
"Rdz35,29": "I Izaak oddał ducha, i umarł, i został przyłączony do swego ludu, stary i syty dni; a pogrzebali go jego synowie, Ezaw i Jakub."
