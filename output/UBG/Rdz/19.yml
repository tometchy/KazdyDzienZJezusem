"Rdz19,1":
  text: "I dwaj aniołowie przyszli wieczorem do Sodomy, a Lot siedział w bramie Sodomy. Gdy Lot ich zobaczył, wstał i wyszedł im naprzeciw, i skłonił się twarzą do ziemi."
  tags: []
"Rdz19,2":
  text: "I powiedział: Oto proszę, moi panowie, wstąpcie teraz do domu swego sługi, przenocujcie i umyjcie sobie nogi. Potem rano wstaniecie i pójdziecie w swoją drogę. Oni odpowiedzieli: Nie, przenocujemy na ulicy."
  tags: []
"Rdz19,3":
  text: "Gdy bardzo na nich nalegał, zboczyli do niego i weszli do jego domu. Wtedy wyprawił im ucztę i napiekł przaśnego chleba, i jedli."
  tags: []
"Rdz19,4":
  text: "Lecz zanim się położyli, mężczyźni z miasta, mężczyźni z Sodomy, młodzi i starzy, mieszkańcy ze wszystkich stron, otoczyli dom."
  tags: []
"Rdz19,5":
  text: "I wołali do Lota, i zapytali go: Gdzie są ci mężczyźni, którzy przyszli do ciebie w nocy? Wyprowadź ich do nas, abyśmy z nimi obcowali."
  tags: []
"Rdz19,6":
  text: "Wtedy Lot wyszedł do nich do wejścia i zamknął za sobą drzwi."
  tags: []
"Rdz19,7":
  text: "I powiedział: Moi bracia, proszę was, nie czyńcie tak niegodziwie."
  tags: []
"Rdz19,8":
  text: "Mam dwie córki, które jeszcze nie obcowały z mężczyzną. Pozwólcie, że wyprowadzę je do was, a czyńcie z nimi, co się wam podoba. Tylko tym mężczyznom nic nie czyńcie, bo dlatego weszli pod cień mego dachu."
  tags: []
"Rdz19,9":
  text: "A oni odpowiedzieli: Odsuń się! I dodali: Ten przyszedł tu jako przybysz, a nas chce sądzić? Z tobą postąpimy gorzej niż z nimi. I napierali gwałtownie na tego mężczyznę, na Lota, i przybliżyli się, aby wyważyć drzwi."
  tags: []
"Rdz19,10":
  text: "Ale ci mężczyźni wysunęli ręce, wciągnęli Lota do siebie, do domu, i zamknęli drzwi."
  tags: []
"Rdz19,11":
  text: "Mężczyzn zaś, którzy byli u drzwi domu, od najmniejszego aż do największego, porazili ślepotą, tak że na próżno usiłowali znaleźć drzwi."
  tags: []
"Rdz19,12":
  text: "Potem ci mężczyźni powiedzieli do Lota: Jeśli masz tu kogoś jeszcze, zięcia, synów i córki lub kogokolwiek innego w mieście, wyprowadź ich z tego miejsca."
  tags: []
"Rdz19,13":
  text: "Zniszczymy bowiem to miejsce, ponieważ ich okrzyk wzmógł się przed PANEM i PAN posłał nas, abyśmy je zniszczyli."
  tags: []
"Rdz19,14":
  text: "Lot wyszedł więc i powiedział do swoich zięciów, którzy mieli poślubić jego córki: Wstańcie, wyjdźcie z tego miejsca, bo PAN zniszczy to miasto. Ale jego zięciom wydawało się, że żartuje."
  tags: []
"Rdz19,15":
  text: "A gdy już zaczynało świtać, aniołowie ponaglali Lota, mówiąc: Wstań, weź swoją żonę i swoje dwie córki, które tu są, abyś nie zginął z powodu nieprawości tego miasta."
  tags: []
"Rdz19,16":
  text: "A gdy się ociągał, ci mężczyźni chwycili jego rękę, rękę jego żony i ręce jego dwóch córek – PAN bowiem ulitował się nad nim – i wyprowadzili go, i pozostawili go poza miastem."
  tags: []
"Rdz19,17":
  text: "I gdy wyprowadzili ich stamtąd, on powiedział: Uciekaj, abyś ocalił swoje życie. Nie oglądaj się wstecz ani nie zatrzymuj się nigdzie na tej równinie. Uciekaj na górę, abyś nie zginął."
  tags: []
"Rdz19,18":
  text: "A Lot powiedział do nich: O nie, Panie!"
  tags: []
"Rdz19,19":
  text: "Oto twój sługa znalazł łaskę w twoich oczach i pomnożyłeś swoje miłosierdzie, które mi wyświadczyłeś, ratując mi życie; ale ja nie mogę uciec na tę górę, bo może dosięgnie mnie jakieś nieszczęście i zginę."
  tags: []
"Rdz19,20":
  text: "Oto jest tu w pobliżu miasto, do którego mógłbym uciec, i jest małe. Proszę, pozwól mi tam uciec (czyż nie jest ono małe?), a moja dusza będzie żyć."
  tags: []
"Rdz19,21":
  text: "Odpowiedział mu: Oto wysłuchałem cię w tej sprawie. Nie zniszczę tego miasta, o którym mówiłeś."
  tags: []
"Rdz19,22":
  text: "Spiesz się i uchodź tam, bo nie będę mógł nic uczynić, dopóki tam nie dojdziesz. Dlatego dano temu miastu nazwę Soar."
  tags: []
"Rdz19,23":
  text: "Słońce wzeszło nad ziemią, gdy Lot wszedł do Soaru."
  tags: []
"Rdz19,24":
  text: "Wtedy PAN spuścił deszcz siarki i ognia od PANA z nieba na Sodomę i Gomorę."
  tags: []
"Rdz19,25":
  text: "I zniszczył te miasta, całą tę równinę i wszystkich mieszkańców tych miast, a także roślinność tej ziemi."
  tags: []
"Rdz19,26":
  text: "Lecz żona Lota, idąc za nim, obejrzała się wstecz i stała się słupem soli."
  tags: []
"Rdz19,27":
  text: "Abraham zaś wstał rano i udał się na to miejsce, gdzie stał przed PANEM."
  tags: []
"Rdz19,28":
  text: "Gdy spojrzał w stronę Sodomy i Gomory, i całej ziemi tej równiny, zobaczył, że dym unosił się nad tą ziemią jak dym z pieca."
  tags: []
"Rdz19,29":
  text: "A gdy Bóg zniszczył miasta tej równiny, pamiętał Bóg o Abrahamie i wybawił Lota z samego środka zagłady, kiedy zniszczył te miasta, w których Lot mieszkał."
  tags: []
"Rdz19,30":
  text: "Potem Lot wyszedł z Soaru i mieszkał na górze ze swoimi dwiema córkami, bo bał się mieszkać w Soarze. Zamieszkał więc w jaskini, on i jego dwie córki."
  tags: []
"Rdz19,31":
  text: "I starsza powiedziała do młodszej: Nasz ojciec jest stary, a nie ma na ziemi mężczyzny, który by obcował z nami według zwyczaju całej ziemi."
  tags: []
"Rdz19,32":
  text: "Chodź, upójmy naszego ojca winem i położymy się z nim, abyśmy zachowały potomstwo naszego ojca."
  tags: []
"Rdz19,33":
  text: "Upoiły więc swego ojca winem tej nocy. I starsza weszła i spała ze swym ojcem, ale on nie spostrzegł ani kiedy się położyła, ani kiedy wstała."
  tags: []
"Rdz19,34":
  text: "Nazajutrz starsza powiedziała do młodszej: Oto zeszłej nocy spałam ze swym ojcem, upójmy go winem także tej nocy, wtedy wejdź ty i połóż się z nim, a tak zachowamy potomstwo naszego ojca."
  tags: []
"Rdz19,35":
  text: "Upoiły więc swego ojca winem także i tej nocy. Wtedy młodsza poszła i spała z nim, ale on nie spostrzegł ani kiedy się położyła, ani kiedy wstała."
  tags: []
"Rdz19,36":
  text: "Tak obie córki Lota poczęły ze swego ojca."
  tags: []
"Rdz19,37":
  text: "Gdy starsza urodziła syna, nadała mu imię Moab. On jest ojcem dzisiejszych Moabitów."
  tags: []
"Rdz19,38":
  text: "Młodsza również urodziła syna i nadała mu imię Ben-Ammi. On jest ojcem synów dzisiejszych Ammonitów."
  tags: []
