"Rdz19,1": "I dwaj aniołowie przyszli wieczorem do Sodomy, a Lot siedział w bramie Sodomy. Gdy Lot ich zobaczył, wstał i wyszedł im naprzeciw, i skłonił się twarzą do ziemi."
"Rdz19,2": "I powiedział: Oto proszę, moi panowie, wstąpcie teraz do domu swego sługi, przenocujcie i umyjcie sobie nogi. Potem rano wstaniecie i pójdziecie w swoją drogę. Oni odpowiedzieli: Nie, przenocujemy na ulicy."
"Rdz19,3": "Gdy bardzo na nich nalegał, zboczyli do niego i weszli do jego domu. Wtedy wyprawił im ucztę i napiekł przaśnego chleba, i jedli."
"Rdz19,4": "Lecz zanim się położyli, mężczyźni z miasta, mężczyźni z Sodomy, młodzi i starzy, mieszkańcy ze wszystkich stron, otoczyli dom."
"Rdz19,5": "I wołali do Lota, i zapytali go: Gdzie są ci mężczyźni, którzy przyszli do ciebie w nocy? Wyprowadź ich do nas, abyśmy z nimi obcowali."
"Rdz19,6": "Wtedy Lot wyszedł do nich do wejścia i zamknął za sobą drzwi."
"Rdz19,7": "I powiedział: Moi bracia, proszę was, nie czyńcie tak niegodziwie."
"Rdz19,8": "Mam dwie córki, które jeszcze nie obcowały z mężczyzną. Pozwólcie, że wyprowadzę je do was, a czyńcie z nimi, co się wam podoba. Tylko tym mężczyznom nic nie czyńcie, bo dlatego weszli pod cień mego dachu."
"Rdz19,9": "A oni odpowiedzieli: Odsuń się! I dodali: Ten przyszedł tu jako przybysz, a nas chce sądzić? Z tobą postąpimy gorzej niż z nimi. I napierali gwałtownie na tego mężczyznę, na Lota, i przybliżyli się, aby wyważyć drzwi."
"Rdz19,10": "Ale ci mężczyźni wysunęli ręce, wciągnęli Lota do siebie, do domu, i zamknęli drzwi."
"Rdz19,11": "Mężczyzn zaś, którzy byli u drzwi domu, od najmniejszego aż do największego, porazili ślepotą, tak że na próżno usiłowali znaleźć drzwi."
"Rdz19,12": "Potem ci mężczyźni powiedzieli do Lota: Jeśli masz tu kogoś jeszcze, zięcia, synów i córki lub kogokolwiek innego w mieście, wyprowadź ich z tego miejsca."
"Rdz19,13": "Zniszczymy bowiem to miejsce, ponieważ ich okrzyk wzmógł się przed PANEM i PAN posłał nas, abyśmy je zniszczyli."
"Rdz19,14": "Lot wyszedł więc i powiedział do swoich zięciów, którzy mieli poślubić jego córki: Wstańcie, wyjdźcie z tego miejsca, bo PAN zniszczy to miasto. Ale jego zięciom wydawało się, że żartuje."
"Rdz19,15": "A gdy już zaczynało świtać, aniołowie ponaglali Lota, mówiąc: Wstań, weź swoją żonę i swoje dwie córki, które tu są, abyś nie zginął z powodu nieprawości tego miasta."
"Rdz19,16": "A gdy się ociągał, ci mężczyźni chwycili jego rękę, rękę jego żony i ręce jego dwóch córek – PAN bowiem ulitował się nad nim – i wyprowadzili go, i pozostawili go poza miastem."
"Rdz19,17": "I gdy wyprowadzili ich stamtąd, on powiedział: Uciekaj, abyś ocalił swoje życie. Nie oglądaj się wstecz ani nie zatrzymuj się nigdzie na tej równinie. Uciekaj na górę, abyś nie zginął."
"Rdz19,18": "A Lot powiedział do nich: O nie, Panie!"
"Rdz19,19": "Oto twój sługa znalazł łaskę w twoich oczach i pomnożyłeś swoje miłosierdzie, które mi wyświadczyłeś, ratując mi życie; ale ja nie mogę uciec na tę górę, bo może dosięgnie mnie jakieś nieszczęście i zginę."
"Rdz19,20": "Oto jest tu w pobliżu miasto, do którego mógłbym uciec, i jest małe. Proszę, pozwól mi tam uciec (czyż nie jest ono małe?), a moja dusza będzie żyć."
"Rdz19,21": "Odpowiedział mu: Oto wysłuchałem cię w tej sprawie. Nie zniszczę tego miasta, o którym mówiłeś."
"Rdz19,22": "Spiesz się i uchodź tam, bo nie będę mógł nic uczynić, dopóki tam nie dojdziesz. Dlatego dano temu miastu nazwę Soar."
"Rdz19,23": "Słońce wzeszło nad ziemią, gdy Lot wszedł do Soaru."
"Rdz19,24": "Wtedy PAN spuścił deszcz siarki i ognia od PANA z nieba na Sodomę i Gomorę."
"Rdz19,25": "I zniszczył te miasta, całą tę równinę i wszystkich mieszkańców tych miast, a także roślinność tej ziemi."
"Rdz19,26": "Lecz żona Lota, idąc za nim, obejrzała się wstecz i stała się słupem soli."
"Rdz19,27": "Abraham zaś wstał rano i udał się na to miejsce, gdzie stał przed PANEM."
"Rdz19,28": "Gdy spojrzał w stronę Sodomy i Gomory, i całej ziemi tej równiny, zobaczył, że dym unosił się nad tą ziemią jak dym z pieca."
"Rdz19,29": "A gdy Bóg zniszczył miasta tej równiny, pamiętał Bóg o Abrahamie i wybawił Lota z samego środka zagłady, kiedy zniszczył te miasta, w których Lot mieszkał."
"Rdz19,30": "Potem Lot wyszedł z Soaru i mieszkał na górze ze swoimi dwiema córkami, bo bał się mieszkać w Soarze. Zamieszkał więc w jaskini, on i jego dwie córki."
"Rdz19,31": "I starsza powiedziała do młodszej: Nasz ojciec jest stary, a nie ma na ziemi mężczyzny, który by obcował z nami według zwyczaju całej ziemi."
"Rdz19,32": "Chodź, upójmy naszego ojca winem i położymy się z nim, abyśmy zachowały potomstwo naszego ojca."
"Rdz19,33": "Upoiły więc swego ojca winem tej nocy. I starsza weszła i spała ze swym ojcem, ale on nie spostrzegł ani kiedy się położyła, ani kiedy wstała."
"Rdz19,34": "Nazajutrz starsza powiedziała do młodszej: Oto zeszłej nocy spałam ze swym ojcem, upójmy go winem także tej nocy, wtedy wejdź ty i połóż się z nim, a tak zachowamy potomstwo naszego ojca."
"Rdz19,35": "Upoiły więc swego ojca winem także i tej nocy. Wtedy młodsza poszła i spała z nim, ale on nie spostrzegł ani kiedy się położyła, ani kiedy wstała."
"Rdz19,36": "Tak obie córki Lota poczęły ze swego ojca."
"Rdz19,37": "Gdy starsza urodziła syna, nadała mu imię Moab. On jest ojcem dzisiejszych Moabitów."
"Rdz19,38": "Młodsza również urodziła syna i nadała mu imię Ben-Ammi. On jest ojcem synów dzisiejszych Ammonitów."
