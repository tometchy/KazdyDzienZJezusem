"Rdz33,1": "Potem Jakub podniósł oczy i zobaczył, że Ezaw nadchodzi, a z nim czterystu mężczyzn. Podzielił więc dzieci między Leę, Rachelę a dwie służące."
"Rdz33,2": "I postawił na przodzie służące i ich dzieci, za nimi Leę i jej dzieci, a na końcu Rachelę z Józefem."
"Rdz33,3": "Sam zaś wyszedł przed nich i pokłonił się siedem razy aż do ziemi, zanim doszedł do swego brata."
"Rdz33,4": "Ale Ezaw wybiegł mu naprzeciw, objął go, rzucił mu się na szyję i całował go. I płakali."
"Rdz33,5": "Potem podniósł oczy, zobaczył żony i dzieci i zapytał: A kim są ci przy tobie? I odpowiedział: To są dzieci, które Bóg w swej łaskawości dał twemu słudze."
"Rdz33,6": "Wtedy przybliżyły się służące ze swoimi dziećmi i pokłoniły się."
"Rdz33,7": "Przybliżyła się też Lea ze swoimi dziećmi i pokłoniły się. Potem przybliżyli się Józef i Rachela i pokłonili się."
"Rdz33,8": "I Ezaw zapytał: Co znaczy cały ten obóz, z którym się spotkałem? Jakub odpowiedział: Abym znalazł łaskę w oczach mego pana."
"Rdz33,9": "Wtedy Ezaw powiedział: Ja mam dosyć, mój bracie, zatrzymaj to, co twoje."
"Rdz33,10": "I Jakub powiedział: Nie, proszę, jeśli znalazłem teraz łaskę w twoich oczach, przyjmij dar z mojej ręki, bo gdy zobaczyłem twoje oblicze, to jakbym widział oblicze Boga, i ty łaskawie mnie przyjąłeś."
"Rdz33,11": "Przyjmij, proszę, mój dar, który ci przyniosłem, bo Bóg hojnie mi błogosławił, a mam dość wszystkiego. I tak nalegał na niego, że to przyjął."
"Rdz33,12": "Ezaw powiedział: Ruszajmy w drogę i chodźmy, a ja pójdę przed tobą."
"Rdz33,13": "I Jakub mu odpowiedział: Mój pan wie, że mam ze sobą dzieci wątłe, a owce i krowy karmią młode. Jeśli popędzi się je przez cały dzień, zginie całe stado."
"Rdz33,14": "Niech mój pan, proszę, idzie przed swoim sługą, a ja będę szedł powoli, jak nadąży stado, które jest przede mną, i jak nadążą dzieci, aż przyjdę do mego pana do Seiru."
"Rdz33,15": "Wtedy Ezaw powiedział: Zostawię więc przy tobie część ludzi, którzy są ze mną. A on odpowiedział: A na cóż to? Obym znalazł łaskę w oczach mego pana."
"Rdz33,16": "I tego dnia Ezaw wrócił swą drogą do Seiru."
"Rdz33,17": "A Jakub wyruszył do Sukkot i zbudował sobie dom, i zrobił szałasy dla swoich stad. Dlatego nazwał to miejsce Sukkot."
"Rdz33,18": "I Jakub przyszedł szczęśliwie do miasta Sychem, które było w ziemi Kanaan, gdy wrócił z Paddan-Aram, i rozbił obóz przed miastem."
"Rdz33,19": "I za sto monet kupił od synów Hemora, ojca Sychema, część pola, na którym rozbił swój namiot."
"Rdz33,20": "Tam też postawił ołtarz i nazwał go: Mocny Bóg Izraela."
