"Rdz33,1":
  text: "Potem Jakub podniósł oczy i zobaczył, że Ezaw nadchodzi, a z nim czterystu mężczyzn. Podzielił więc dzieci między Leę, Rachelę a dwie służące."
  tags: []
"Rdz33,2":
  text: "I postawił na przodzie służące i ich dzieci, za nimi Leę i jej dzieci, a na końcu Rachelę z Józefem."
  tags: []
"Rdz33,3":
  text: "Sam zaś wyszedł przed nich i pokłonił się siedem razy aż do ziemi, zanim doszedł do swego brata."
  tags: []
"Rdz33,4":
  text: "Ale Ezaw wybiegł mu naprzeciw, objął go, rzucił mu się na szyję i całował go. I płakali."
  tags: []
"Rdz33,5":
  text: "Potem podniósł oczy, zobaczył żony i dzieci i zapytał: A kim są ci przy tobie? I odpowiedział: To są dzieci, które Bóg w swej łaskawości dał twemu słudze."
  tags: []
"Rdz33,6":
  text: "Wtedy przybliżyły się służące ze swoimi dziećmi i pokłoniły się."
  tags: []
"Rdz33,7":
  text: "Przybliżyła się też Lea ze swoimi dziećmi i pokłoniły się. Potem przybliżyli się Józef i Rachela i pokłonili się."
  tags: []
"Rdz33,8":
  text: "I Ezaw zapytał: Co znaczy cały ten obóz, z którym się spotkałem? Jakub odpowiedział: Abym znalazł łaskę w oczach mego pana."
  tags: []
"Rdz33,9":
  text: "Wtedy Ezaw powiedział: Ja mam dosyć, mój bracie, zatrzymaj to, co twoje."
  tags: []
"Rdz33,10":
  text: "I Jakub powiedział: Nie, proszę, jeśli znalazłem teraz łaskę w twoich oczach, przyjmij dar z mojej ręki, bo gdy zobaczyłem twoje oblicze, to jakbym widział oblicze Boga, i ty łaskawie mnie przyjąłeś."
  tags: []
"Rdz33,11":
  text: "Przyjmij, proszę, mój dar, który ci przyniosłem, bo Bóg hojnie mi błogosławił, a mam dość wszystkiego. I tak nalegał na niego, że to przyjął."
  tags: []
"Rdz33,12":
  text: "Ezaw powiedział: Ruszajmy w drogę i chodźmy, a ja pójdę przed tobą."
  tags: []
"Rdz33,13":
  text: "I Jakub mu odpowiedział: Mój pan wie, że mam ze sobą dzieci wątłe, a owce i krowy karmią młode. Jeśli popędzi się je przez cały dzień, zginie całe stado."
  tags: []
"Rdz33,14":
  text: "Niech mój pan, proszę, idzie przed swoim sługą, a ja będę szedł powoli, jak nadąży stado, które jest przede mną, i jak nadążą dzieci, aż przyjdę do mego pana do Seiru."
  tags: []
"Rdz33,15":
  text: "Wtedy Ezaw powiedział: Zostawię więc przy tobie część ludzi, którzy są ze mną. A on odpowiedział: A na cóż to? Obym znalazł łaskę w oczach mego pana."
  tags: []
"Rdz33,16":
  text: "I tego dnia Ezaw wrócił swą drogą do Seiru."
  tags: []
"Rdz33,17":
  text: "A Jakub wyruszył do Sukkot i zbudował sobie dom, i zrobił szałasy dla swoich stad. Dlatego nazwał to miejsce Sukkot."
  tags: []
"Rdz33,18":
  text: "I Jakub przyszedł szczęśliwie do miasta Sychem, które było w ziemi Kanaan, gdy wrócił z Paddan-Aram, i rozbił obóz przed miastem."
  tags: []
"Rdz33,19":
  text: "I za sto monet kupił od synów Hemora, ojca Sychema, część pola, na którym rozbił swój namiot."
  tags: []
"Rdz33,20":
  text: "Tam też postawił ołtarz i nazwał go: Mocny Bóg Izraela."
  tags: []
