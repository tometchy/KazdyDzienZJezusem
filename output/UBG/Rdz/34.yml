"Rdz34,1":
  text: "I Dina, córka Lei, którą urodziła Jakubowi, wyszła, aby zobaczyć córki tej ziemi."
  tags: []
"Rdz34,2":
  text: "A gdy zobaczył ją Sychem, syn Chamora Chiwwity, książę tej ziemi, porwał ją, spał z nią i ją zhańbił."
  tags: []
"Rdz34,3":
  text: "I przylgnęła jego dusza do Diny, córki Jakuba, a zakochał się w dziewczynie i czule do niej mówił."
  tags: []
"Rdz34,4":
  text: "Potem Sychem powiedział do swego ojca Chamora: Weź mi tę dziewczynę za żonę."
  tags: []
"Rdz34,5":
  text: "A Jakub usłyszał, że jego córka Dina została zhańbiona, a jego synowie byli przy jego stadach na polu. Jakub więc milczał aż do ich przyjścia."
  tags: []
"Rdz34,6":
  text: "Wtedy Chamor, ojciec Sychema, wyszedł do Jakuba, aby z nim porozmawiać."
  tags: []
"Rdz34,7":
  text: "A gdy synowie Jakuba przyszli z pola i to usłyszeli, ubolewali nad tym i bardzo się rozgniewali, że dopuścił się haniebnego czynu w Izraelu, śpiąc z córką Jakuba, czego nie wolno robić."
  tags: []
"Rdz34,8":
  text: "I Chamor powiedział do nich: Mój syn Sychem przylgnął duszą do waszej córki. Dajcie mu ją, proszę, za żonę."
  tags: []
"Rdz34,9":
  text: "Spowinowaćcie się z nami. Dajcie nam wasze córki i bierzcie sobie nasze córki."
  tags: []
"Rdz34,10":
  text: "I będziecie z nami mieszkać, a ziemia będzie przed wami. Mieszkajcie i handlujcie w niej, i osadzajcie się w niej."
  tags: []
"Rdz34,11":
  text: "I Sychem mówił też do jej ojca i braci: Niech znajdę łaskę w waszych oczach, a co mi powiecie, to dam."
  tags: []
"Rdz34,12":
  text: "Zażądajcie ode mnie jak największego wiana i darów, a dam, jak mi powiecie; tylko dajcie mi tę dziewczynę za żonę."
  tags: []
"Rdz34,13":
  text: "Wtedy synowie Jakuba odpowiedzieli Sychemowi i jego ojcu Chamorowi, mówiąc podstępnie, bo zhańbił ich siostrę Dinę."
  tags: []
"Rdz34,14":
  text: "I powiedzieli im: Nie możemy dać naszej siostry nieobrzezanemu mężczyźnie, gdyż byłaby to dla nas hańba."
  tags: []
"Rdz34,15":
  text: "Zgodzimy się z wami tylko w ten sposób, jeśli zechcecie być do nas podobni i każdy z waszych mężczyzn będzie obrzezany."
  tags: []
"Rdz34,16":
  text: "Wtedy damy wam nasze córki, a wasze córki weźmiemy sobie. Zamieszkamy z wami i staniemy się jednym ludem."
  tags: []
"Rdz34,17":
  text: "Ale jeśli nas nie usłuchacie i nie dacie się obrzezać, weźmiemy naszą córkę i odejdziemy."
  tags: []
"Rdz34,18":
  text: "I słowa ich spodobały się Chamorowi i jego synowi Sychemowi."
  tags: []
"Rdz34,19":
  text: "Młodzieniec nie odkładał więc tego, bo zakochał się w córce Jakuba. A był on ze wszystkich najbardziej szanowany w domu swego ojca."
  tags: []
"Rdz34,20":
  text: "Gdy Chamor i jego syn Sychem przyszli do bramy swego miasta, powiedzieli do mężczyzn swego miasta:"
  tags: []
"Rdz34,21":
  text: "Ci mężczyźni spokojnie z nami żyją. Niech więc mieszkają w tej ziemi i handlują w niej, bo oto nasza ziemia jest dość przestronna dla nich. Będziemy brać sobie ich córki za żony, a nasze córki będziemy im dawać."
  tags: []
"Rdz34,22":
  text: "Zgodzą się ci mężczyźni mieszkać z nami, byśmy byli jednym ludem, ale pod warunkiem, że każdy mężczyzna u nas będzie obrzezany, tak jak i oni są obrzezani."
  tags: []
"Rdz34,23":
  text: "Czyż ich stada i dobytek oraz wszelkie ich bydło nie będą nasze? Na to tylko im pozwólmy, a zamieszkają z nami."
  tags: []
"Rdz34,24":
  text: "I usłuchali Chamora i jego syna Sychema wszyscy wychodzący z bramy swego miasta. I został obrzezany każdy mężczyzna, który wychodził z bramy swego miasta."
  tags: []
"Rdz34,25":
  text: "A trzeciego dnia, gdy najbardziej cierpieli, dwaj synowie Jakuba, Symeon i Lewi, bracia Diny, wzięli swoje miecze i śmiało weszli do miasta, i pomordowali wszystkich mężczyzn."
  tags: []
"Rdz34,26":
  text: "Zabili ostrzem miecza także Chamora oraz jego syna Sychema i zabrali Dinę z domu Sychema, i odeszli."
  tags: []
"Rdz34,27":
  text: "Synowie Jakuba wpadli do pomordowanych i złupili miasto za to, że zhańbili ich siostrę."
  tags: []
"Rdz34,28":
  text: "Zabrali ich owce, woły i osły oraz to, co było w mieście i na polu."
  tags: []
"Rdz34,29":
  text: "Cały ich majątek, wszystkie ich dzieci i żony wzięli do niewoli i zrabowali wszystko, co było w domach."
  tags: []
"Rdz34,30":
  text: "Wtedy Jakub powiedział do Symeona i Lewiego: Zaniepokoiliście mnie, czyniąc mnie obrzydliwym u mieszkańców tej ziemi, u Kananejczyków i Peryzzytów. Ja mam niewielką liczbę ludzi, a oni zbiorą się przeciwko mnie i uderzą na mnie. I tak zginę ja i mój dom."
  tags: []
"Rdz34,31":
  text: "A oni odpowiedzieli: Czyż miał traktować naszą siostrę jak nierządnicę?"
  tags: []
