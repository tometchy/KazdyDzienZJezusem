"Rdz34,1": "I Dina, córka Lei, którą urodziła Jakubowi, wyszła, aby zobaczyć córki tej ziemi."
"Rdz34,2": "A gdy zobaczył ją Sychem, syn Chamora Chiwwity, książę tej ziemi, porwał ją, spał z nią i ją zhańbił."
"Rdz34,3": "I przylgnęła jego dusza do Diny, córki Jakuba, a zakochał się w dziewczynie i czule do niej mówił."
"Rdz34,4": "Potem Sychem powiedział do swego ojca Chamora: Weź mi tę dziewczynę za żonę."
"Rdz34,5": "A Jakub usłyszał, że jego córka Dina została zhańbiona, a jego synowie byli przy jego stadach na polu. Jakub więc milczał aż do ich przyjścia."
"Rdz34,6": "Wtedy Chamor, ojciec Sychema, wyszedł do Jakuba, aby z nim porozmawiać."
"Rdz34,7": "A gdy synowie Jakuba przyszli z pola i to usłyszeli, ubolewali nad tym i bardzo się rozgniewali, że dopuścił się haniebnego czynu w Izraelu, śpiąc z córką Jakuba, czego nie wolno robić."
"Rdz34,8": "I Chamor powiedział do nich: Mój syn Sychem przylgnął duszą do waszej córki. Dajcie mu ją, proszę, za żonę."
"Rdz34,9": "Spowinowaćcie się z nami. Dajcie nam wasze córki i bierzcie sobie nasze córki."
"Rdz34,10": "I będziecie z nami mieszkać, a ziemia będzie przed wami. Mieszkajcie i handlujcie w niej, i osadzajcie się w niej."
"Rdz34,11": "I Sychem mówił też do jej ojca i braci: Niech znajdę łaskę w waszych oczach, a co mi powiecie, to dam."
"Rdz34,12": "Zażądajcie ode mnie jak największego wiana i darów, a dam, jak mi powiecie; tylko dajcie mi tę dziewczynę za żonę."
"Rdz34,13": "Wtedy synowie Jakuba odpowiedzieli Sychemowi i jego ojcu Chamorowi, mówiąc podstępnie, bo zhańbił ich siostrę Dinę."
"Rdz34,14": "I powiedzieli im: Nie możemy dać naszej siostry nieobrzezanemu mężczyźnie, gdyż byłaby to dla nas hańba."
"Rdz34,15": "Zgodzimy się z wami tylko w ten sposób, jeśli zechcecie być do nas podobni i każdy z waszych mężczyzn będzie obrzezany."
"Rdz34,16": "Wtedy damy wam nasze córki, a wasze córki weźmiemy sobie. Zamieszkamy z wami i staniemy się jednym ludem."
"Rdz34,17": "Ale jeśli nas nie usłuchacie i nie dacie się obrzezać, weźmiemy naszą córkę i odejdziemy."
"Rdz34,18": "I słowa ich spodobały się Chamorowi i jego synowi Sychemowi."
"Rdz34,19": "Młodzieniec nie odkładał więc tego, bo zakochał się w córce Jakuba. A był on ze wszystkich najbardziej szanowany w domu swego ojca."
"Rdz34,20": "Gdy Chamor i jego syn Sychem przyszli do bramy swego miasta, powiedzieli do mężczyzn swego miasta:"
"Rdz34,21": "Ci mężczyźni spokojnie z nami żyją. Niech więc mieszkają w tej ziemi i handlują w niej, bo oto nasza ziemia jest dość przestronna dla nich. Będziemy brać sobie ich córki za żony, a nasze córki będziemy im dawać."
"Rdz34,22": "Zgodzą się ci mężczyźni mieszkać z nami, byśmy byli jednym ludem, ale pod warunkiem, że każdy mężczyzna u nas będzie obrzezany, tak jak i oni są obrzezani."
"Rdz34,23": "Czyż ich stada i dobytek oraz wszelkie ich bydło nie będą nasze? Na to tylko im pozwólmy, a zamieszkają z nami."
"Rdz34,24": "I usłuchali Chamora i jego syna Sychema wszyscy wychodzący z bramy swego miasta. I został obrzezany każdy mężczyzna, który wychodził z bramy swego miasta."
"Rdz34,25": "A trzeciego dnia, gdy najbardziej cierpieli, dwaj synowie Jakuba, Symeon i Lewi, bracia Diny, wzięli swoje miecze i śmiało weszli do miasta, i pomordowali wszystkich mężczyzn."
"Rdz34,26": "Zabili ostrzem miecza także Chamora oraz jego syna Sychema i zabrali Dinę z domu Sychema, i odeszli."
"Rdz34,27": "Synowie Jakuba wpadli do pomordowanych i złupili miasto za to, że zhańbili ich siostrę."
"Rdz34,28": "Zabrali ich owce, woły i osły oraz to, co było w mieście i na polu."
"Rdz34,29": "Cały ich majątek, wszystkie ich dzieci i żony wzięli do niewoli i zrabowali wszystko, co było w domach."
"Rdz34,30": "Wtedy Jakub powiedział do Symeona i Lewiego: Zaniepokoiliście mnie, czyniąc mnie obrzydliwym u mieszkańców tej ziemi, u Kananejczyków i Peryzzytów. Ja mam niewielką liczbę ludzi, a oni zbiorą się przeciwko mnie i uderzą na mnie. I tak zginę ja i mój dom."
"Rdz34,31": "A oni odpowiedzieli: Czyż miał traktować naszą siostrę jak nierządnicę?"
