"Rdz22,1":
  text: "Po tych wydarzeniach Bóg wystawił Abrahama na próbę i powiedział do niego: Abrahamie! A on odpowiedział: Oto jestem."
  tags: []
"Rdz22,2":
  text: "I Bóg powiedział: Weź teraz swego syna, twego jedynego, którego miłujesz, Izaaka, idź do ziemi Moria i tam złóż go na ofiarę całopalną na jednej górze, o której ci powiem."
  tags: []
"Rdz22,3":
  text: "Abraham wstał więc wcześnie rano, osiodłał swego osła i wziął ze sobą dwóch służących i swego syna Izaaka, narąbał drew na ofiarę całopalną, wstał i poszedł na miejsce, o którym mu Bóg powiedział."
  tags: []
"Rdz22,4":
  text: "A trzeciego dnia Abraham podniósł swe oczy i zobaczył z daleka to miejsce."
  tags: []
"Rdz22,5":
  text: "Wtedy Abraham powiedział do swoich służących: Zostańcie tu z osłem, a ja i chłopiec pójdziemy tam, oddamy cześć Bogu i wrócimy do was."
  tags: []
"Rdz22,6":
  text: "Wziął więc Abraham drwa na ofiarę całopalną i włożył je na swego syna Izaaka, a sam wziął do ręki ogień i nóż i poszli obaj razem."
  tags: []
"Rdz22,7":
  text: "I Izaak powiedział do swego ojca Abrahama: Mój ojcze! A on odpowiedział: Oto jestem, mój synu. I Izaak zapytał: Oto ogień i drwa, a gdzie jest baranek na ofiarę całopalną?"
  tags: []
"Rdz22,8":
  text: "Abraham odpowiedział: Bóg sobie upatrzy baranka na ofiarę całopalną, mój synu. I szli obaj razem."
  tags: []
"Rdz22,9":
  text: "A gdy przyszli na miejsce, o którym mu Bóg powiedział, Abraham zbudował tam ołtarz, ułożył na nim drwa, związał swego syna Izaaka i położył go na ołtarzu na drwach."
  tags: []
"Rdz22,10":
  text: "Potem Abraham wyciągnął rękę i wziął nóż, aby zabić swego syna."
  tags: []
"Rdz22,11":
  text: "Lecz Anioł PANA zawołał do niego z nieba: Abrahamie, Abrahamie! A on odpowiedział: Oto jestem."
  tags: []
"Rdz22,12":
  text: "Anioł powiedział: Nie podnoś ręki na chłopca i nic mu nie czyń, bo teraz wiem, że boisz się Boga i nie odmówiłeś mi swego jedynego syna."
  tags: []
"Rdz22,13":
  text: "A Abraham podniósł swe oczy i spojrzał, a oto za nim baran zaplątał się rogami w zaroślach. Abraham poszedł więc i wziął barana, i złożył go na ofiarę całopalną zamiast swego syna."
  tags: []
"Rdz22,14":
  text: "I Abraham nadał temu miejscu nazwę: PAN upatrzy. Dlatego po dziś dzień mówią: Na górze PANA będzie upatrzony."
  tags: []
"Rdz22,15":
  text: "Wtedy Anioł PANA ponownie zawołał z nieba na Abrahama:"
  tags: []
"Rdz22,16":
  text: "Przysiągłem na siebie samego, mówi PAN: Ponieważ to uczyniłeś i nie odmówiłeś mi swego syna, twego jedynego;"
  tags: []
"Rdz22,17":
  text: "Błogosławiąc, będę ci błogosławić, a rozmnażając, rozmnożę twoje potomstwo jak gwiazdy na niebie i jak piasek na brzegu morza; a twoje potomstwo odziedziczy bramy swoich nieprzyjaciół."
  tags: []
"Rdz22,18":
  text: "I w twoim potomstwie będą błogosławione wszystkie narody ziemi, dlatego że posłuchałeś mojego głosu."
  tags: []
"Rdz22,19":
  text: "Abraham wrócił więc do swoich służących i wstali, i wspólnie udali się do Beer-Szeby. Abraham bowiem mieszkał w Beer-Szebie."
  tags: []
"Rdz22,20":
  text: "Po tych wydarzeniach doniesiono Abrahamowi: Oto Milka również urodziła dzieci twemu bratu Nachorowi;"
  tags: []
"Rdz22,21":
  text: "Usa, jego pierworodnego, Buza, jego brata, i Kemuela, ojca Arama;"
  tags: []
"Rdz22,22":
  text: "I Keseda, Chazo, Pildasza, Jidlafa i Betuela."
  tags: []
"Rdz22,23":
  text: "Betuel zaś spłodził Rebekę. Tych ośmiu urodziła Milka Nachorowi, bratu Abrahama."
  tags: []
"Rdz22,24":
  text: "A jego nałożnica, której imię było Reuma, urodziła też Tebacha, Gachama, Tachasza i Maakę."
  tags: []
