"Rdz30,1": "Gdy Rachela widziała, że nie rodzi dzieci Jakubowi, zazdrościła swej siostrze i powiedziała do Jakuba: Daj mi dzieci, bo inaczej umrę."
"Rdz30,2": "Jakub rozgniewał się na Rachelę i powiedział: Czy ja jestem Bogiem, który odmówił ci owocu twego łona?"
"Rdz30,3": "A ona odpowiedziała: Oto moja służąca Bilha. Obcuj z nią i urodzi na moich kolanach, i będę miała z niej dzieci."
"Rdz30,4": "Dała mu więc swoją służącą Bilhę za żonę, a Jakub z nią obcował."
"Rdz30,5": "Bilha poczęła i urodziła Jakubowi syna."
"Rdz30,6": "I Rachela powiedziała: Bóg mnie osądził i usłyszał mój głos, i dał mi syna. Dlatego nadała mu imię Dan."
"Rdz30,7": "Potem Bilha, służąca Racheli, znowu poczęła i urodziła Jakubowi drugiego syna."
"Rdz30,8": "Wtedy Rachela powiedziała: Dzielnie walczyłam z moją siostrą i zwyciężyłam. I nadała mu imię Neftali."
"Rdz30,9": "A gdy Lea widziała, że przestała rodzić, wzięła swoją służącą Zilpę i dała ją Jakubowi za żonę."
"Rdz30,10": "I Zilpa, służąca Lei, urodziła Jakubowi syna."
"Rdz30,11": "Wtedy Lea powiedziała: Przyszedł oddział. I nadała mu imię Gad."
"Rdz30,12": "Potem Zilpa, służąca Lei, urodziła Jakubowi drugiego syna."
"Rdz30,13": "I Lea powiedziała: To na moje szczęście, bo kobiety będą mnie nazywać szczęśliwą. I nadała mu imię Aszer."
"Rdz30,14": "A w czasie żniwa pszenicznego Ruben wyszedł i znalazł na polu mandragory, i przyniósł je do swojej matki Lei. Wtedy Rachela powiedziała do Lei: Daj mi, proszę, z mandragor twego syna."
"Rdz30,15": "A ona jej odpowiedziała: Mało ci, że zabrałaś mi mojego męża, to teraz chcesz też zabrać mandragory mego syna? Wtedy Rachela powiedziała: Niech śpi z tobą tej nocy za mandragory twego syna."
"Rdz30,16": "A gdy Jakub wracał wieczorem z pola, Lea wyszła mu naprzeciw i powiedziała: Masz do mnie przyjść, bo nabyłam cię za mandragory mego syna. I spał z nią tej nocy."
"Rdz30,17": "A Bóg wysłuchał Leę i poczęła, i urodziła Jakubowi piątego syna."
"Rdz30,18": "I Lea powiedziała: Bóg mi oddał moją zapłatę za to, że dałam moją służącą swemu mężowi. I nadała mu imię Issachar."
"Rdz30,19": "Potem Lea znowu poczęła i urodziła Jakubowi szóstego syna."
"Rdz30,20": "I Lea mówiła: Bóg obdarzył mnie wspaniałym darem. Teraz mój mąż będzie ze mną mieszkał, bo urodziłam mu sześciu synów. I nadała mu imię Zebulon."
"Rdz30,21": "Potem urodziła córkę i nadała jej imię Dina."
"Rdz30,22": "Bóg wspomniał też na Rachelę i wysłuchał ją Bóg, i otworzył jej łono."
"Rdz30,23": "Poczęła więc i urodziła syna, i powiedziała: Bóg zabrał moją hańbę."
"Rdz30,24": "Nadała mu imię Józef i powiedziała: Niech PAN da mi drugiego syna."
"Rdz30,25": "Gdy Rachela urodziła Józefa, Jakub powiedział do Labana: Puść mnie, abym wrócił do mego miejsca i do mojej ziemi."
"Rdz30,26": "Daj mi moje żony i moje dzieci, za które ci służyłem, abym mógł iść. Wiesz przecież, jak ci służyłem."
"Rdz30,27": "I Laban powiedział do niego: Proszę, jeśli znalazłem łaskę w twoich oczach, zostań ze mną. Doznałem bowiem tego, że PAN mi błogosławił ze względu na ciebie."
"Rdz30,28": "Mówił dalej: Wyznacz swoją zapłatę, a dam ci ją."
"Rdz30,29": "Wtedy Jakub mu odpowiedział: Ty wiesz, jak ci służyłem i jaki stał się przy mnie twój dobytek."
"Rdz30,30": "Miałeś bowiem niewiele przed moim przyjściem, a bardzo się to pomnożyło i PAN błogosławił ci, odkąd tu jestem. Kiedy jednak mam się starać o swój dom?"
"Rdz30,31": "I Laban zapytał: Cóż mam ci dać? Jakub odpowiedział: Nic mi nie dasz. Ale jeśli zrobisz to, co ci powiem, wtedy wrócę i będę pasł twoje stado, i strzegł go."
"Rdz30,32": "Obejdę dziś wszystkie twoje stada i odłączę z nich każde bydło pstre i nakrapiane i każde bydło ciemne wśród owiec, a nakrapiane i pstre wśród kóz. To będzie moja zapłata."
"Rdz30,33": "Potem moja sprawiedliwość da świadectwo o mnie, gdy przyjdzie czas, abyś mi zapłacił. Wszystko, co nie będzie pstre i nakrapiane wśród kóz, a ciemne wśród owiec, niech będzie mi poczytane za kradzież."
"Rdz30,34": "Laban powiedział: Niech się stanie według twego słowa."
"Rdz30,35": "W tym dniu odłączył kozły prążkowane i nakrapiane i wszystkie kozy pstre i nakrapiane, i wszystkie, które miały jakąś białą plamkę, także i czarne wśród owiec, i oddał je w ręce swych synów."
"Rdz30,36": "I Laban odłączył się od Jakuba na odległość trzech dni drogi. A Jakub pasł resztę stada Labana."
"Rdz30,37": "Wtedy Jakub nabrał zielonych prętów topolowych, laskowych i kasztanowych i miejscami poobdzierał je z kory do białego, obnażając białość, która była na prętach."
"Rdz30,38": "Gdy stada przychodziły pić, przed stadami nakładł do rynien i koryt z wodą tych prętów, które poobdzierał z kory, aby parzyły się stada, przychodząc pić."
"Rdz30,39": "I stada parzyły się przy tych prętach i rodziły jagnięta prążkowane, pstre i nakrapiane."
"Rdz30,40": "I Jakub odłączył jagnięta, a owce stawiał przodem do jagniąt prążkowanych i do wszystkich ciemnych w stadzie Labana, a swoje stada stawiał osobno i nie łączył ich ze stadem Labana."
"Rdz30,41": "A gdy silniejsze zwierzęta się parzyły, Jakub kładł pręty w koryta, przed oczy zwierząt, aby parzyły się przed prętami."
"Rdz30,42": "Lecz gdy przychodziły słabsze zwierzęta, nie kładł ich. I słabsze były Labana, a silniejsze Jakuba."
"Rdz30,43": "I tak wzbogacił się bardzo ten człowiek, i miał wiele stad, a także służące i służących oraz wielbłądy i osły."
