"Rdz30,1":
  text: "Gdy Rachela widziała, że nie rodzi dzieci Jakubowi, zazdrościła swej siostrze i powiedziała do Jakuba: Daj mi dzieci, bo inaczej umrę."
  tags: []
"Rdz30,2":
  text: "Jakub rozgniewał się na Rachelę i powiedział: Czy ja jestem Bogiem, który odmówił ci owocu twego łona?"
  tags: []
"Rdz30,3":
  text: "A ona odpowiedziała: Oto moja służąca Bilha. Obcuj z nią i urodzi na moich kolanach, i będę miała z niej dzieci."
  tags: []
"Rdz30,4":
  text: "Dała mu więc swoją służącą Bilhę za żonę, a Jakub z nią obcował."
  tags: []
"Rdz30,5":
  text: "Bilha poczęła i urodziła Jakubowi syna."
  tags: []
"Rdz30,6":
  text: "I Rachela powiedziała: Bóg mnie osądził i usłyszał mój głos, i dał mi syna. Dlatego nadała mu imię Dan."
  tags: []
"Rdz30,7":
  text: "Potem Bilha, służąca Racheli, znowu poczęła i urodziła Jakubowi drugiego syna."
  tags: []
"Rdz30,8":
  text: "Wtedy Rachela powiedziała: Dzielnie walczyłam z moją siostrą i zwyciężyłam. I nadała mu imię Neftali."
  tags: []
"Rdz30,9":
  text: "A gdy Lea widziała, że przestała rodzić, wzięła swoją służącą Zilpę i dała ją Jakubowi za żonę."
  tags: []
"Rdz30,10":
  text: "I Zilpa, służąca Lei, urodziła Jakubowi syna."
  tags: []
"Rdz30,11":
  text: "Wtedy Lea powiedziała: Przyszedł oddział. I nadała mu imię Gad."
  tags: []
"Rdz30,12":
  text: "Potem Zilpa, służąca Lei, urodziła Jakubowi drugiego syna."
  tags: []
"Rdz30,13":
  text: "I Lea powiedziała: To na moje szczęście, bo kobiety będą mnie nazywać szczęśliwą. I nadała mu imię Aszer."
  tags: []
"Rdz30,14":
  text: "A w czasie żniwa pszenicznego Ruben wyszedł i znalazł na polu mandragory, i przyniósł je do swojej matki Lei. Wtedy Rachela powiedziała do Lei: Daj mi, proszę, z mandragor twego syna."
  tags: []
"Rdz30,15":
  text: "A ona jej odpowiedziała: Mało ci, że zabrałaś mi mojego męża, to teraz chcesz też zabrać mandragory mego syna? Wtedy Rachela powiedziała: Niech śpi z tobą tej nocy za mandragory twego syna."
  tags: []
"Rdz30,16":
  text: "A gdy Jakub wracał wieczorem z pola, Lea wyszła mu naprzeciw i powiedziała: Masz do mnie przyjść, bo nabyłam cię za mandragory mego syna. I spał z nią tej nocy."
  tags: []
"Rdz30,17":
  text: "A Bóg wysłuchał Leę i poczęła, i urodziła Jakubowi piątego syna."
  tags: []
"Rdz30,18":
  text: "I Lea powiedziała: Bóg mi oddał moją zapłatę za to, że dałam moją służącą swemu mężowi. I nadała mu imię Issachar."
  tags: []
"Rdz30,19":
  text: "Potem Lea znowu poczęła i urodziła Jakubowi szóstego syna."
  tags: []
"Rdz30,20":
  text: "I Lea mówiła: Bóg obdarzył mnie wspaniałym darem. Teraz mój mąż będzie ze mną mieszkał, bo urodziłam mu sześciu synów. I nadała mu imię Zebulon."
  tags: []
"Rdz30,21":
  text: "Potem urodziła córkę i nadała jej imię Dina."
  tags: []
"Rdz30,22":
  text: "Bóg wspomniał też na Rachelę i wysłuchał ją Bóg, i otworzył jej łono."
  tags: []
"Rdz30,23":
  text: "Poczęła więc i urodziła syna, i powiedziała: Bóg zabrał moją hańbę."
  tags: []
"Rdz30,24":
  text: "Nadała mu imię Józef i powiedziała: Niech PAN da mi drugiego syna."
  tags: []
"Rdz30,25":
  text: "Gdy Rachela urodziła Józefa, Jakub powiedział do Labana: Puść mnie, abym wrócił do mego miejsca i do mojej ziemi."
  tags: []
"Rdz30,26":
  text: "Daj mi moje żony i moje dzieci, za które ci służyłem, abym mógł iść. Wiesz przecież, jak ci służyłem."
  tags: []
"Rdz30,27":
  text: "I Laban powiedział do niego: Proszę, jeśli znalazłem łaskę w twoich oczach, zostań ze mną. Doznałem bowiem tego, że PAN mi błogosławił ze względu na ciebie."
  tags: []
"Rdz30,28":
  text: "Mówił dalej: Wyznacz swoją zapłatę, a dam ci ją."
  tags: []
"Rdz30,29":
  text: "Wtedy Jakub mu odpowiedział: Ty wiesz, jak ci służyłem i jaki stał się przy mnie twój dobytek."
  tags: []
"Rdz30,30":
  text: "Miałeś bowiem niewiele przed moim przyjściem, a bardzo się to pomnożyło i PAN błogosławił ci, odkąd tu jestem. Kiedy jednak mam się starać o swój dom?"
  tags: []
"Rdz30,31":
  text: "I Laban zapytał: Cóż mam ci dać? Jakub odpowiedział: Nic mi nie dasz. Ale jeśli zrobisz to, co ci powiem, wtedy wrócę i będę pasł twoje stado, i strzegł go."
  tags: []
"Rdz30,32":
  text: "Obejdę dziś wszystkie twoje stada i odłączę z nich każde bydło pstre i nakrapiane i każde bydło ciemne wśród owiec, a nakrapiane i pstre wśród kóz. To będzie moja zapłata."
  tags: []
"Rdz30,33":
  text: "Potem moja sprawiedliwość da świadectwo o mnie, gdy przyjdzie czas, abyś mi zapłacił. Wszystko, co nie będzie pstre i nakrapiane wśród kóz, a ciemne wśród owiec, niech będzie mi poczytane za kradzież."
  tags: []
"Rdz30,34":
  text: "Laban powiedział: Niech się stanie według twego słowa."
  tags: []
"Rdz30,35":
  text: "W tym dniu odłączył kozły prążkowane i nakrapiane i wszystkie kozy pstre i nakrapiane, i wszystkie, które miały jakąś białą plamkę, także i czarne wśród owiec, i oddał je w ręce swych synów."
  tags: []
"Rdz30,36":
  text: "I Laban odłączył się od Jakuba na odległość trzech dni drogi. A Jakub pasł resztę stada Labana."
  tags: []
"Rdz30,37":
  text: "Wtedy Jakub nabrał zielonych prętów topolowych, laskowych i kasztanowych i miejscami poobdzierał je z kory do białego, obnażając białość, która była na prętach."
  tags: []
"Rdz30,38":
  text: "Gdy stada przychodziły pić, przed stadami nakładł do rynien i koryt z wodą tych prętów, które poobdzierał z kory, aby parzyły się stada, przychodząc pić."
  tags: []
"Rdz30,39":
  text: "I stada parzyły się przy tych prętach i rodziły jagnięta prążkowane, pstre i nakrapiane."
  tags: []
"Rdz30,40":
  text: "I Jakub odłączył jagnięta, a owce stawiał przodem do jagniąt prążkowanych i do wszystkich ciemnych w stadzie Labana, a swoje stada stawiał osobno i nie łączył ich ze stadem Labana."
  tags: []
"Rdz30,41":
  text: "A gdy silniejsze zwierzęta się parzyły, Jakub kładł pręty w koryta, przed oczy zwierząt, aby parzyły się przed prętami."
  tags: []
"Rdz30,42":
  text: "Lecz gdy przychodziły słabsze zwierzęta, nie kładł ich. I słabsze były Labana, a silniejsze Jakuba."
  tags: []
"Rdz30,43":
  text: "I tak wzbogacił się bardzo ten człowiek, i miał wiele stad, a także służące i służących oraz wielbłądy i osły."
  tags: []
