"Rdz18,1": "Potem PAN ukazał mu się na równinie Mamre, a on siedział u wejścia do swego namiotu w najgorętszej porze dnia."
"Rdz18,2": "I podniósł swe oczy, i zobaczył, że naprzeciwko niego stanęli trzej mężczyźni. Gdy ich ujrzał, pobiegł od wejścia do namiotu na ich spotkanie i skłonił się do ziemi."
"Rdz18,3": "I powiedział: Mój Panie, jeśli znalazłem teraz łaskę w twoich oczach, nie omijaj, proszę, swego sługi."
"Rdz18,4": "Pozwól, by przyniesiono trochę wody, abyście mogli obmyć sobie nogi, potem odpoczniecie pod drzewem."
"Rdz18,5": "I przyniosę kęs chleba, abyście posilili swoje serca. Potem odejdziecie, po to bowiem przyszliście do mnie, swego sługi. A oni powiedzieli: Uczyń tak, jak powiedziałeś."
"Rdz18,6": "Abraham pospieszył do namiotu, do Sary, i powiedział: Przygotuj szybko trzy miarki najlepszej mąki i zrób podpłomyki."
"Rdz18,7": "Abraham zaś poszedł do stada, wziął młode i wyborne cielę i dał je słudze, który szybko je przyrządził."
"Rdz18,8": "Wziął też masło, mleko i cielę, które przyrządził, i postawił przed nimi. A gdy oni jedli, on stał przy nich pod drzewem."
"Rdz18,9": "I zapytali go: Gdzie jest twoja żona Sara? A on odpowiedział: Jest w namiocie."
"Rdz18,10": "Wtedy powiedział PAN: Na pewno wrócę do ciebie za rok o tej porze, a oto twoja żona Sara będzie miała syna. A Sara przysłuchiwała się u wejścia do namiotu, które było za nim."
"Rdz18,11": "Abraham i Sara byli starzy, w podeszłym wieku. I przestało już u Sary bywać według zwyczaju kobiet."
"Rdz18,12": "Sara roześmiała się więc w sobie, mówiąc: Teraz, gdy się zestarzałam i mój pan jest starcem, mam doznawać rozkoszy?"
"Rdz18,13": "Wtedy PAN powiedział do Abrahama: Dlaczego Sara roześmiała się, mówiąc: Czy naprawdę urodzę, gdy się zestarzałam?"
"Rdz18,14": "Czy jakakolwiek rzecz jest za trudna dla PANA? W przyszłym roku o tej porze wrócę do ciebie, a Sara będzie miała syna."
"Rdz18,15": "I Sara zaparła się, mówiąc: Nie śmiałam się – bo się bała. A on powiedział: Przeciwnie, śmiałaś się."
"Rdz18,16": "Potem ci mężczyźni wstali stamtąd i skierowali wzrok ku Sodomie. Abraham zaś szedł z nimi, aby ich odprowadzić."
"Rdz18,17": "Wtedy PAN powiedział: Czy mam zataić przed Abrahamem, co zamierzam uczynić?"
"Rdz18,18": "Przecież Abraham na pewno rozmnoży się w lud wielki i możny, a w nim będą błogosławione wszystkie narody ziemi."
"Rdz18,19": "Znam go bowiem i wiem, że będzie nakazywał swoim synom i swemu domowi po sobie, aby strzegli drogi PANA oraz czynili sprawiedliwość i sąd; aby PAN sprowadził na Abrahama to, co mu powiedział."
"Rdz18,20": "Potem PAN powiedział: Ponieważ okrzyk Sodomy i Gomory jest wielki i ich grzech jest bardzo ciężki;"
"Rdz18,21": "Zstąpię teraz i zobaczę, czy postępują według tego okrzyku, który doszedł do mnie. A jeśli nie, dowiem się."
"Rdz18,22": "Wtedy ci mężczyźni odwrócili wzrok i poszli stamtąd do Sodomy, ale Abraham jeszcze stał przed PANEM."
"Rdz18,23": "I Abraham zbliżył się, i powiedział: Czy wytracisz sprawiedliwego razem z niegodziwym?"
"Rdz18,24": "Jeśli będzie pięćdziesięciu sprawiedliwych w tym mieście, czy je wytracisz i nie oszczędzisz tego miejsca ze względu na pięćdziesięciu sprawiedliwych, którzy w nim są?"
"Rdz18,25": "Niech to będzie dalekie od ciebie, byś miał uczynić coś takiego i zabić sprawiedliwego z niegodziwym, żeby sprawiedliwy był jak niegodziwy. Niech to będzie dalekie od ciebie! Czy Sędzia całej ziemi nie postąpi sprawiedliwie?"
"Rdz18,26": "Wtedy PAN odpowiedział: Jeśli znajdę w Sodomie pięćdziesięciu sprawiedliwych w samym mieście, oszczędzę całe miejsce ze względu na nich."
"Rdz18,27": "A Abraham odpowiedział: Oto ośmielam się teraz mówić do mojego Pana, choć jestem prochem i popiołem."
"Rdz18,28": "Gdyby do tych pięćdziesięciu sprawiedliwych zabrakło pięciu, czy z powodu braku tych pięciu zniszczysz całe miasto? I odrzekł: Nie zniszczę, jeśli znajdę tam czterdziestu pięciu."
"Rdz18,29": "Odezwał się ponownie do niego i powiedział: A gdyby znalazło się tam czterdziestu? I odpowiedział: Nie uczynię tego ze względu na tych czterdziestu."
"Rdz18,30": "I Abraham powiedział: Niech się nie gniewa mój Pan, że zapytam: A gdyby znalazło się tam trzydziestu? Odpowiedział: Nie uczynię tego, jeśli znajdę tam trzydziestu."
"Rdz18,31": "Rzekł jeszcze: Oto ośmielam się teraz mówić do mego Pana: A gdyby znalazło się tam dwudziestu? Odpowiedział: Nie zniszczę go ze względu na tych dwudziestu."
"Rdz18,32": "Powiedział: Niech się nie gniewa mój Pan, że jeszcze tylko raz przemówię: A gdyby znalazło się tam dziesięciu? Odpowiedział: Nie zniszczę go ze względu na tych dziesięciu."
"Rdz18,33": "Gdy PAN skończył rozmowę z Abrahamem, odszedł. Abraham zaś wrócił do siebie."
