"Rdz6,1": "Gdy ludzie zaczęli się mnożyć na ziemi i rodziły im się córki;"
"Rdz6,2": "Synowie Boży, widząc, że córki ludzkie były piękne, brali sobie za żony wszystkie, które sobie upodobali."
"Rdz6,3": "I powiedział PAN: Mój duch nie będzie na zawsze się spierał z człowiekiem, bo jest on ciałem. Będzie więc jego dni sto dwadzieścia lat."
"Rdz6,4": "A w tych dniach byli na ziemi olbrzymi; nawet i potem, gdy synowie Boży zbliżali się do córek ludzkich, a one rodziły im synów. To są mocarze, którzy od dawna byli sławnymi mężczyznami."
"Rdz6,5": "A gdy PAN widział, że wielka jest niegodziwość ludzi na ziemi i wszystkie zamysły i myśli ich serca były tylko złe po wszystkie dni;"
"Rdz6,6": "Żałował PAN, że uczynił człowieka na ziemi, i ubolewał nad tym całym sercem."
"Rdz6,7": "I PAN powiedział: Zgładzę z powierzchni ziemi człowieka, którego stworzyłem, zarówno człowieka, jak i bydło, zwierzęta pełzające i ptactwo niebieskie, bo żałuję, że ich uczyniłem."
"Rdz6,8": "Ale Noe znalazł łaskę w oczach PANA."
"Rdz6,9": "To są dzieje rodu Noego: Noe był człowiekiem sprawiedliwym i doskonałym w swoich czasach. I Noe chodził z Bogiem."
"Rdz6,10": "A Noe spłodził trzech synów: Sema, Chama i Jafeta."
"Rdz6,11": "Ale ziemia zepsuła się w oczach Boga i napełniła się nieprawością."
"Rdz6,12": "Wtedy Bóg wejrzał na ziemię, a oto była zepsuta, bo wszelkie ciało wypaczyło swoją drogę na ziemi."
"Rdz6,13": "I Bóg powiedział do Noego: Nadszedł koniec wszelkiego ciała przed moim obliczem, bo ziemia przez nie jest pełna nieprawości; wytracę je więc wraz z ziemią."
"Rdz6,14": "Zbuduj sobie arkę z drewna gofer, zrobisz w arce przegrody i oblejesz ją wewnątrz i na zewnątrz smołą."
"Rdz6,15": "A zbudujesz ją w ten sposób: Długość arki będzie na trzysta łokci, pięćdziesiąt łokci – jej szerokość, a trzydzieści łokci – jej wysokość."
"Rdz6,16": "Zrobisz okno w arce, a zakończysz je na łokieć od góry. Drzwi umieścisz z boku arki, zrobisz w niej dolne, drugie i trzecie piętro."
"Rdz6,17": "A ja, oto ja sprowadzę potop wód na ziemię, aby wytracić wszelkie ciało, w którym jest tchnienie życia pod niebem. Wszystko, co jest na ziemi, zginie."
"Rdz6,18": "Ale z tobą zawrę moje przymierze; i wejdziesz do arki, ty i twoi synowie, i twoja żona, i żony twoich synów z tobą."
"Rdz6,19": "I ze wszystkich zwierząt wszelkiego ciała po jednej parze wprowadzisz do arki, aby uchowały się z tobą żywe, będą to samiec i samica."
"Rdz6,20": "Z ptactwa według jego rodzaju i z bydła według jego rodzaju, i z wszelkich ziemskich zwierząt pełzających według ich rodzaju, po parze z każdego rodzaju wejdą z tobą, aby żywe zostały."
"Rdz6,21": "A ty weźmiesz ze sobą wszelki pokarm, który się nadaje do jedzenia, i zabierzesz do siebie, i będzie tobie i im na pokarm."
"Rdz6,22": "I Noe tak uczynił. Zrobił wszystko tak, jak mu Bóg rozkazał."
