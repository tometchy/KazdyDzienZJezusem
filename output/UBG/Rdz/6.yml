"Rdz6,1":
  text: "Gdy ludzie zaczęli się mnożyć na ziemi i rodziły im się córki;"
  tags: []
"Rdz6,2":
  text: "Synowie Boży, widząc, że córki ludzkie były piękne, brali sobie za żony wszystkie, które sobie upodobali."
  tags: []
"Rdz6,3":
  text: "I powiedział PAN: Mój duch nie będzie na zawsze się spierał z człowiekiem, bo jest on ciałem. Będzie więc jego dni sto dwadzieścia lat."
  tags: []
"Rdz6,4":
  text: "A w tych dniach byli na ziemi olbrzymi; nawet i potem, gdy synowie Boży zbliżali się do córek ludzkich, a one rodziły im synów. To są mocarze, którzy od dawna byli sławnymi mężczyznami."
  tags: []
"Rdz6,5":
  text: "A gdy PAN widział, że wielka jest niegodziwość ludzi na ziemi i wszystkie zamysły i myśli ich serca były tylko złe po wszystkie dni;"
  tags: []
"Rdz6,6":
  text: "Żałował PAN, że uczynił człowieka na ziemi, i ubolewał nad tym całym sercem."
  tags: []
"Rdz6,7":
  text: "I PAN powiedział: Zgładzę z powierzchni ziemi człowieka, którego stworzyłem, zarówno człowieka, jak i bydło, zwierzęta pełzające i ptactwo niebieskie, bo żałuję, że ich uczyniłem."
  tags: []
"Rdz6,8":
  text: "Ale Noe znalazł łaskę w oczach PANA."
  tags: []
"Rdz6,9":
  text: "To są dzieje rodu Noego: Noe był człowiekiem sprawiedliwym i doskonałym w swoich czasach. I Noe chodził z Bogiem."
  tags: []
"Rdz6,10":
  text: "A Noe spłodził trzech synów: Sema, Chama i Jafeta."
  tags: []
"Rdz6,11":
  text: "Ale ziemia zepsuła się w oczach Boga i napełniła się nieprawością."
  tags: []
"Rdz6,12":
  text: "Wtedy Bóg wejrzał na ziemię, a oto była zepsuta, bo wszelkie ciało wypaczyło swoją drogę na ziemi."
  tags: []
"Rdz6,13":
  text: "I Bóg powiedział do Noego: Nadszedł koniec wszelkiego ciała przed moim obliczem, bo ziemia przez nie jest pełna nieprawości; wytracę je więc wraz z ziemią."
  tags: []
"Rdz6,14":
  text: "Zbuduj sobie arkę z drewna gofer, zrobisz w arce przegrody i oblejesz ją wewnątrz i na zewnątrz smołą."
  tags: []
"Rdz6,15":
  text: "A zbudujesz ją w ten sposób: Długość arki będzie na trzysta łokci, pięćdziesiąt łokci – jej szerokość, a trzydzieści łokci – jej wysokość."
  tags: []
"Rdz6,16":
  text: "Zrobisz okno w arce, a zakończysz je na łokieć od góry. Drzwi umieścisz z boku arki, zrobisz w niej dolne, drugie i trzecie piętro."
  tags: []
"Rdz6,17":
  text: "A ja, oto ja sprowadzę potop wód na ziemię, aby wytracić wszelkie ciało, w którym jest tchnienie życia pod niebem. Wszystko, co jest na ziemi, zginie."
  tags: []
"Rdz6,18":
  text: "Ale z tobą zawrę moje przymierze; i wejdziesz do arki, ty i twoi synowie, i twoja żona, i żony twoich synów z tobą."
  tags: []
"Rdz6,19":
  text: "I ze wszystkich zwierząt wszelkiego ciała po jednej parze wprowadzisz do arki, aby uchowały się z tobą żywe, będą to samiec i samica."
  tags: []
"Rdz6,20":
  text: "Z ptactwa według jego rodzaju i z bydła według jego rodzaju, i z wszelkich ziemskich zwierząt pełzających według ich rodzaju, po parze z każdego rodzaju wejdą z tobą, aby żywe zostały."
  tags: []
"Rdz6,21":
  text: "A ty weźmiesz ze sobą wszelki pokarm, który się nadaje do jedzenia, i zabierzesz do siebie, i będzie tobie i im na pokarm."
  tags: []
"Rdz6,22":
  text: "I Noe tak uczynił. Zrobił wszystko tak, jak mu Bóg rozkazał."
  tags: []
