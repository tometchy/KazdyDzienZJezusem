"Dz18,1": "Potem Paweł opuścił Ateny i przybył do Koryntu."
"Dz18,2": "Spotkał tam pewnego Żyda, imieniem Akwila, rodem z Pontu, który niedawno przybył z Italii razem ze swoją żoną Pryscyllą (ponieważ Klaudiusz zarządził, żeby wszyscy Żydzi opuścili Rzym), i poszedł do nich;"
"Dz18,3": "A ponieważ znał to samo rzemiosło, zamieszkał u nich i pracował. Zajmowali się bowiem wyrobem namiotów."
"Dz18,4": "W każdy szabat rozprawiał w synagodze i przekonywał i Żydów, i Greków."
"Dz18,5": "A gdy przyszli z Macedonii Sylas i Tymoteusz, Paweł był napierany w duchu i świadczył Żydom, że Jezus jest Chrystusem."
"Dz18,6": "Lecz gdy się sprzeciwiali i bluźnili, otrząsnął szaty i powiedział do nich: Krew wasza na waszą głowę, ja jestem czysty. Od tej chwili pójdę do pogan."
"Dz18,7": "Odszedł stamtąd i wszedł do domu pewnego człowieka, imieniem Justus, który czcił Boga, a którego dom przylegał do synagogi."
"Dz18,8": "A przełożony synagogi, Kryspus, uwierzył w Pana wraz z całym swoim domem. Także wielu Koryntian, którzy słuchali, uwierzyło i zostało ochrzczonych."
"Dz18,9": "Wtedy w nocy Pan powiedział do Pawła w widzeniu: Nie bój się, lecz mów i nie milcz;"
"Dz18,10": "Bo ja jestem z tobą i nikt się na ciebie nie targnie, aby cię skrzywdzić. Mam bowiem liczny lud w tym mieście."
"Dz18,11": "I mieszkał tam przez rok i sześć miesięcy, nauczając u nich słowa Bożego."
"Dz18,12": "A gdy Gallio był prokonsulem w Achai, Żydzi jednomyślnie powstali przeciw Pawłowi i przyprowadzili go przed sąd;"
"Dz18,13": "Mówiąc: On namawia ludzi, aby niezgodnie z prawem czcili Boga."
"Dz18,14": "Kiedy Paweł miał już otworzyć usta, Gallio powiedział do Żydów: O Żydzi, gdyby się działo bezprawie albo jakaś niegodziwość, znosiłbym was, jak należy;"
"Dz18,15": "Lecz jeśli spór dotyczy słów, imion i waszego prawa, sami to rozpatrzcie. Ja bowiem nie chcę być sędzią w tych sprawach."
"Dz18,16": "I wypędził ich z sądu."
"Dz18,17": "Wtedy wszyscy Grecy schwytali Sostenesa, przełożonego synagogi, i bili go przed sądem, lecz Gallio na to nie zważał."
"Dz18,18": "A Paweł mieszkał tam jeszcze przez wiele dni, potem pożegnał się z braćmi i popłynął do Syrii, a z nim Pryscylla i Akwila. W Kenchrach ostrzygł głowę, bo złożył ślub."
"Dz18,19": "Potem przybył do Efezu i tam ich zostawił. Sam zaś wszedł do synagogi i rozprawiał z Żydami."
"Dz18,20": "A gdy go prosili, żeby u nich pozostał dłużej, nie zgodził się;"
"Dz18,21": "Ale żegnając się z nimi, powiedział: Nadchodzące święto muszę koniecznie obchodzić w Jerozolimie, lecz jeśli taka będzie wola Boga, wrócę do was. I odpłynął z Efezu."
"Dz18,22": "Po przybyciu do Cezarei udał się do Jerozolimy, gdzie pozdrowił kościół, a potem odszedł do Antiochii."
"Dz18,23": "Mieszkał tam przez pewien czas i wyruszył, przemierzając krainę galacką i Frygię i umacniając wszystkich uczniów."
"Dz18,24": "A do Efezu przybył pewien Żyd, imieniem Apollos, rodem z Aleksandrii, człowiek wymowny i biegły w Piśmie."
"Dz18,25": "Był on obeznany z drogą Pana, a pałając duchem, mówił i nauczał starannie o Panu, wiedząc tylko o chrzcie Jana."
"Dz18,26": "Zaczął on odważnie mówić w synagodze. Gdy go usłyszeli Akwila i Pryscylla, przyjęli go do siebie i dokładniej wytłumaczyli drogę Boga."
"Dz18,27": "Kiedy chciał udać się do Achai, bracia go zachęcili i napisali do uczniów, aby go przyjęli. Gdy tam przybył, bardzo pomagał tym, którzy uwierzyli dzięki łasce Bożej."
"Dz18,28": "Dzielnie bowiem przekonywał Żydów, publicznie dowodząc z Pisma, że Jezus jest Chrystusem."
