"Dz18,1":
  text: "Potem Paweł opuścił Ateny i przybył do Koryntu."
  tags: []
"Dz18,2":
  text: "Spotkał tam pewnego Żyda, imieniem Akwila, rodem z Pontu, który niedawno przybył z Italii razem ze swoją żoną Pryscyllą (ponieważ Klaudiusz zarządził, żeby wszyscy Żydzi opuścili Rzym), i poszedł do nich;"
  tags: []
"Dz18,3":
  text: "A ponieważ znał to samo rzemiosło, zamieszkał u nich i pracował. Zajmowali się bowiem wyrobem namiotów."
  tags: []
"Dz18,4":
  text: "W każdy szabat rozprawiał w synagodze i przekonywał i Żydów, i Greków."
  tags: []
"Dz18,5":
  text: "A gdy przyszli z Macedonii Sylas i Tymoteusz, Paweł był napierany w duchu i świadczył Żydom, że Jezus jest Chrystusem."
  tags: []
"Dz18,6":
  text: "Lecz gdy się sprzeciwiali i bluźnili, otrząsnął szaty i powiedział do nich: Krew wasza na waszą głowę, ja jestem czysty. Od tej chwili pójdę do pogan."
  tags: []
"Dz18,7":
  text: "Odszedł stamtąd i wszedł do domu pewnego człowieka, imieniem Justus, który czcił Boga, a którego dom przylegał do synagogi."
  tags: []
"Dz18,8":
  text: "A przełożony synagogi, Kryspus, uwierzył w Pana wraz z całym swoim domem. Także wielu Koryntian, którzy słuchali, uwierzyło i zostało ochrzczonych."
  tags: []
"Dz18,9":
  text: "Wtedy w nocy Pan powiedział do Pawła w widzeniu: Nie bój się, lecz mów i nie milcz;"
  tags: []
"Dz18,10":
  text: "Bo ja jestem z tobą i nikt się na ciebie nie targnie, aby cię skrzywdzić. Mam bowiem liczny lud w tym mieście."
  tags: []
"Dz18,11":
  text: "I mieszkał tam przez rok i sześć miesięcy, nauczając u nich słowa Bożego."
  tags: []
"Dz18,12":
  text: "A gdy Gallio był prokonsulem w Achai, Żydzi jednomyślnie powstali przeciw Pawłowi i przyprowadzili go przed sąd;"
  tags: []
"Dz18,13":
  text: "Mówiąc: On namawia ludzi, aby niezgodnie z prawem czcili Boga."
  tags: []
"Dz18,14":
  text: "Kiedy Paweł miał już otworzyć usta, Gallio powiedział do Żydów: O Żydzi, gdyby się działo bezprawie albo jakaś niegodziwość, znosiłbym was, jak należy;"
  tags: []
"Dz18,15":
  text: "Lecz jeśli spór dotyczy słów, imion i waszego prawa, sami to rozpatrzcie. Ja bowiem nie chcę być sędzią w tych sprawach."
  tags: []
"Dz18,16":
  text: "I wypędził ich z sądu."
  tags: []
"Dz18,17":
  text: "Wtedy wszyscy Grecy schwytali Sostenesa, przełożonego synagogi, i bili go przed sądem, lecz Gallio na to nie zważał."
  tags: []
"Dz18,18":
  text: "A Paweł mieszkał tam jeszcze przez wiele dni, potem pożegnał się z braćmi i popłynął do Syrii, a z nim Pryscylla i Akwila. W Kenchrach ostrzygł głowę, bo złożył ślub."
  tags: []
"Dz18,19":
  text: "Potem przybył do Efezu i tam ich zostawił. Sam zaś wszedł do synagogi i rozprawiał z Żydami."
  tags: []
"Dz18,20":
  text: "A gdy go prosili, żeby u nich pozostał dłużej, nie zgodził się;"
  tags: []
"Dz18,21":
  text: "Ale żegnając się z nimi, powiedział: Nadchodzące święto muszę koniecznie obchodzić w Jerozolimie, lecz jeśli taka będzie wola Boga, wrócę do was. I odpłynął z Efezu."
  tags: []
"Dz18,22":
  text: "Po przybyciu do Cezarei udał się do Jerozolimy, gdzie pozdrowił kościół, a potem odszedł do Antiochii."
  tags: []
"Dz18,23":
  text: "Mieszkał tam przez pewien czas i wyruszył, przemierzając krainę galacką i Frygię i umacniając wszystkich uczniów."
  tags: []
"Dz18,24":
  text: "A do Efezu przybył pewien Żyd, imieniem Apollos, rodem z Aleksandrii, człowiek wymowny i biegły w Piśmie."
  tags: []
"Dz18,25":
  text: "Był on obeznany z drogą Pana, a pałając duchem, mówił i nauczał starannie o Panu, wiedząc tylko o chrzcie Jana."
  tags: []
"Dz18,26":
  text: "Zaczął on odważnie mówić w synagodze. Gdy go usłyszeli Akwila i Pryscylla, przyjęli go do siebie i dokładniej wytłumaczyli drogę Boga."
  tags: []
"Dz18,27":
  text: "Kiedy chciał udać się do Achai, bracia go zachęcili i napisali do uczniów, aby go przyjęli. Gdy tam przybył, bardzo pomagał tym, którzy uwierzyli dzięki łasce Bożej."
  tags: []
"Dz18,28":
  text: "Dzielnie bowiem przekonywał Żydów, publicznie dowodząc z Pisma, że Jezus jest Chrystusem."
  tags: []
