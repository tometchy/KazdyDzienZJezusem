"Dz23,1": "Paweł, patrząc uważnie na Radę, powiedział: Mężowie bracia, aż do dziś żyłem przed Bogiem z zupełnie czystym sumieniem."
"Dz23,2": "Lecz Ananiasz, najwyższy kapłan, rozkazał tym, którzy przy nim stali, uderzyć go w twarz."
"Dz23,3": "Wtedy Paweł powiedział do niego: Uderzy cię Bóg, ściano pobielana! Zasiadłeś, aby mnie sądzić według prawa, a każesz mnie bić wbrew prawu?"
"Dz23,4": "Ci zaś, którzy tam stali, powiedzieli: Złorzeczysz najwyższemu kapłanowi Boga?"
"Dz23,5": "Paweł odpowiedział: Nie wiedziałem, bracia, że to najwyższy kapłan. Jest bowiem napisane: Przełożonemu twego ludu nie będziesz złorzeczyć."
"Dz23,6": "A Paweł, poznawszy, że jedna część składa się z saduceuszy, a druga z faryzeuszy, zawołał do Rady: Mężowie bracia, jestem faryzeuszem, synem faryzeusza. Sądzą mnie dziś z powodu nadziei i zmartwychwstania umarłych."
"Dz23,7": "Gdy to powiedział, powstał spór między faryzeuszami a saduceuszami i doszło do rozdwojenia wśród gromady zebranych."
"Dz23,8": "Saduceusze bowiem mówią, że nie ma zmartwychwstania ani anioła, ani ducha, a faryzeusze wyznają jedno i drugie."
"Dz23,9": "I wszczął się wielki krzyk, a uczeni w Piśmie ze stronnictwa faryzeuszy zerwali się i zaczęli się spierać, mówiąc: Niczego złego nie znajdujemy w tym człowieku. Jeśli mu coś powiedział duch albo anioł, to nie walczmy z Bogiem."
"Dz23,10": "A gdy doszło do wielkiego wzburzenia, dowódca, obawiając się, aby Pawła nie rozszarpali, rozkazał żołnierzom zejść, wyrwać go spośród nich i zaprowadzić do twierdzy."
"Dz23,11": "A następnej nocy Pan stanął przy nim i powiedział: Bądź dobrej myśli, Pawle! Tak bowiem, jak świadczyłeś o mnie w Jerozolimie, musisz świadczyć również w Rzymie."
"Dz23,12": "Kiedy nastał dzień, niektórzy spośród Żydów zebrali się i zobowiązali się przysięgą, że nie będą jeść ani pić, dopóki nie zabiją Pawła."
"Dz23,13": "A tych, którzy przystąpili do tego sprzysiężenia, było ponad czterdziestu."
"Dz23,14": "Przyszli oni do naczelnych kapłanów i starszych i powiedzieli: Związaliśmy się przysięgą, że nie weźmiemy nic do ust, dopóki nie zabijemy Pawła."
"Dz23,15": "Dlatego teraz wy razem z Radą dajcie znać dowódcy, żeby go jutro do was przyprowadził pod pozorem dokładniejszego zbadania jego sprawy, a my jesteśmy gotowi go zabić, zanim dojdzie."
"Dz23,16": "A gdy siostrzeniec Pawła usłyszał o tej zasadzce, przybył, wszedł do twierdzy i powiadomił o tym Pawła."
"Dz23,17": "Wtedy Paweł przywołał jednego z setników i powiedział: Zaprowadź tego młodzieńca do dowódcy, bo ma mu coś do powiedzenia."
"Dz23,18": "Wziął go więc ze sobą, zaprowadził go do dowódcy i powiedział: Więzień Paweł przywołał mnie i poprosił, abym przyprowadził do ciebie tego młodzieńca, który ma ci coś do powiedzenia."
"Dz23,19": "Dowódca wziął go za rękę, odszedł z nim na bok i zapytał: O czym to masz mi powiedzieć?"
"Dz23,20": "A on odpowiedział: Żydzi postanowili cię prosić, żebyś jutro zaprowadził Pawła przed Radę pod pozorem dokładniejszego zbadania jego sprawy."
"Dz23,21": "Lecz nie ulegnij ich namowie, bo czyha na niego ponad czterdziestu mężczyzn, którzy związali się przysięgą, że nie będą jeść ani pić, dopóki go nie zabiją. Są już w pogotowiu, czekając na twoje pozwolenie."
"Dz23,22": "Wtedy dowódca odesłał młodzieńca, przykazując, aby nikomu nie mówił, że go o tym powiadomił."
"Dz23,23": "Przywoławszy dwóch setników, powiedział: Przygotujcie do wymarszu do Cezarei na godzinę trzecią w nocy dwustu żołnierzy, siedemdziesięciu jeźdźców i dwustu oszczepników."
"Dz23,24": "Kazał też przygotować zwierzęta juczne, aby wsadzić na nie Pawła i bezpiecznie doprowadzić go do namiestnika Feliksa."
"Dz23,25": "Napisał też list tej treści:"
"Dz23,26": "Klaudiusz Lizjasz najdostojniejszemu namiestnikowi Feliksowi przesyła pozdrowienia."
"Dz23,27": "Człowieka tego schwytali Żydzi, a gdy go mieli zabić, nadbiegłem z oddziałem i uratowałem go, dowiedziawszy się, że jest Rzymianinem."
"Dz23,28": "A chcąc wiedzieć, z jakiej przyczyny go oskarżają, zaprowadziłem go przed ich Radę;"
"Dz23,29": "I stwierdziłem, że oskarżają go o jakieś sporne kwestie dotyczące ich prawa i że nie ma żadnej winy, dla której zasługiwałby na śmierć lub więzienie."
"Dz23,30": "A gdy mi powiedziano o zasadzce, którą na niego przygotowali Żydzi, natychmiast wysłałem go do ciebie, a jego oskarżycielom nakazałem, żeby przed tobą stawiali zarzuty wobec niego. Bądź zdrów!"
"Dz23,31": "Żołnierze zabrali więc Pawła zgodnie z rozkazem i zaprowadzili go nocą do Antipatris."
"Dz23,32": "A nazajutrz zostawili jeźdźców, aby jechali z nim dalej, a sami wrócili do twierdzy."
"Dz23,33": "Tamci przyjechali do Cezarei, oddali list namiestnikowi i stawili przed nim Pawła."
"Dz23,34": "A namiestnik po przeczytaniu listu zapytał go, z jakiej prowincji pochodzi. Kiedy dowiedział się, że z Cylicji;"
"Dz23,35": "Powiedział: Przesłucham cię, gdy przybędą twoi oskarżyciele. I rozkazał strzec go w ratuszu Heroda."
