"Dz23,1":
  text: "Paweł, patrząc uważnie na Radę, powiedział: Mężowie bracia, aż do dziś żyłem przed Bogiem z zupełnie czystym sumieniem."
  tags: []
"Dz23,2":
  text: "Lecz Ananiasz, najwyższy kapłan, rozkazał tym, którzy przy nim stali, uderzyć go w twarz."
  tags: []
"Dz23,3":
  text: "Wtedy Paweł powiedział do niego: Uderzy cię Bóg, ściano pobielana! Zasiadłeś, aby mnie sądzić według prawa, a każesz mnie bić wbrew prawu?"
  tags: []
"Dz23,4":
  text: "Ci zaś, którzy tam stali, powiedzieli: Złorzeczysz najwyższemu kapłanowi Boga?"
  tags: []
"Dz23,5":
  text: "Paweł odpowiedział: Nie wiedziałem, bracia, że to najwyższy kapłan. Jest bowiem napisane: Przełożonemu twego ludu nie będziesz złorzeczyć."
  tags: []
"Dz23,6":
  text: "A Paweł, poznawszy, że jedna część składa się z saduceuszy, a druga z faryzeuszy, zawołał do Rady: Mężowie bracia, jestem faryzeuszem, synem faryzeusza. Sądzą mnie dziś z powodu nadziei i zmartwychwstania umarłych."
  tags: []
"Dz23,7":
  text: "Gdy to powiedział, powstał spór między faryzeuszami a saduceuszami i doszło do rozdwojenia wśród gromady zebranych."
  tags: []
"Dz23,8":
  text: "Saduceusze bowiem mówią, że nie ma zmartwychwstania ani anioła, ani ducha, a faryzeusze wyznają jedno i drugie."
  tags: []
"Dz23,9":
  text: "I wszczął się wielki krzyk, a uczeni w Piśmie ze stronnictwa faryzeuszy zerwali się i zaczęli się spierać, mówiąc: Niczego złego nie znajdujemy w tym człowieku. Jeśli mu coś powiedział duch albo anioł, to nie walczmy z Bogiem."
  tags: []
"Dz23,10":
  text: "A gdy doszło do wielkiego wzburzenia, dowódca, obawiając się, aby Pawła nie rozszarpali, rozkazał żołnierzom zejść, wyrwać go spośród nich i zaprowadzić do twierdzy."
  tags: []
"Dz23,11":
  text: "A następnej nocy Pan stanął przy nim i powiedział: Bądź dobrej myśli, Pawle! Tak bowiem, jak świadczyłeś o mnie w Jerozolimie, musisz świadczyć również w Rzymie."
  tags: []
"Dz23,12":
  text: "Kiedy nastał dzień, niektórzy spośród Żydów zebrali się i zobowiązali się przysięgą, że nie będą jeść ani pić, dopóki nie zabiją Pawła."
  tags: []
"Dz23,13":
  text: "A tych, którzy przystąpili do tego sprzysiężenia, było ponad czterdziestu."
  tags: []
"Dz23,14":
  text: "Przyszli oni do naczelnych kapłanów i starszych i powiedzieli: Związaliśmy się przysięgą, że nie weźmiemy nic do ust, dopóki nie zabijemy Pawła."
  tags: []
"Dz23,15":
  text: "Dlatego teraz wy razem z Radą dajcie znać dowódcy, żeby go jutro do was przyprowadził pod pozorem dokładniejszego zbadania jego sprawy, a my jesteśmy gotowi go zabić, zanim dojdzie."
  tags: []
"Dz23,16":
  text: "A gdy siostrzeniec Pawła usłyszał o tej zasadzce, przybył, wszedł do twierdzy i powiadomił o tym Pawła."
  tags: []
"Dz23,17":
  text: "Wtedy Paweł przywołał jednego z setników i powiedział: Zaprowadź tego młodzieńca do dowódcy, bo ma mu coś do powiedzenia."
  tags: []
"Dz23,18":
  text: "Wziął go więc ze sobą, zaprowadził go do dowódcy i powiedział: Więzień Paweł przywołał mnie i poprosił, abym przyprowadził do ciebie tego młodzieńca, który ma ci coś do powiedzenia."
  tags: []
"Dz23,19":
  text: "Dowódca wziął go za rękę, odszedł z nim na bok i zapytał: O czym to masz mi powiedzieć?"
  tags: []
"Dz23,20":
  text: "A on odpowiedział: Żydzi postanowili cię prosić, żebyś jutro zaprowadził Pawła przed Radę pod pozorem dokładniejszego zbadania jego sprawy."
  tags: []
"Dz23,21":
  text: "Lecz nie ulegnij ich namowie, bo czyha na niego ponad czterdziestu mężczyzn, którzy związali się przysięgą, że nie będą jeść ani pić, dopóki go nie zabiją. Są już w pogotowiu, czekając na twoje pozwolenie."
  tags: []
"Dz23,22":
  text: "Wtedy dowódca odesłał młodzieńca, przykazując, aby nikomu nie mówił, że go o tym powiadomił."
  tags: []
"Dz23,23":
  text: "Przywoławszy dwóch setników, powiedział: Przygotujcie do wymarszu do Cezarei na godzinę trzecią w nocy dwustu żołnierzy, siedemdziesięciu jeźdźców i dwustu oszczepników."
  tags: []
"Dz23,24":
  text: "Kazał też przygotować zwierzęta juczne, aby wsadzić na nie Pawła i bezpiecznie doprowadzić go do namiestnika Feliksa."
  tags: []
"Dz23,25":
  text: "Napisał też list tej treści:"
  tags: []
"Dz23,26":
  text: "Klaudiusz Lizjasz najdostojniejszemu namiestnikowi Feliksowi przesyła pozdrowienia."
  tags: []
"Dz23,27":
  text: "Człowieka tego schwytali Żydzi, a gdy go mieli zabić, nadbiegłem z oddziałem i uratowałem go, dowiedziawszy się, że jest Rzymianinem."
  tags: []
"Dz23,28":
  text: "A chcąc wiedzieć, z jakiej przyczyny go oskarżają, zaprowadziłem go przed ich Radę;"
  tags: []
"Dz23,29":
  text: "I stwierdziłem, że oskarżają go o jakieś sporne kwestie dotyczące ich prawa i że nie ma żadnej winy, dla której zasługiwałby na śmierć lub więzienie."
  tags: []
"Dz23,30":
  text: "A gdy mi powiedziano o zasadzce, którą na niego przygotowali Żydzi, natychmiast wysłałem go do ciebie, a jego oskarżycielom nakazałem, żeby przed tobą stawiali zarzuty wobec niego. Bądź zdrów!"
  tags: []
"Dz23,31":
  text: "Żołnierze zabrali więc Pawła zgodnie z rozkazem i zaprowadzili go nocą do Antipatris."
  tags: []
"Dz23,32":
  text: "A nazajutrz zostawili jeźdźców, aby jechali z nim dalej, a sami wrócili do twierdzy."
  tags: []
"Dz23,33":
  text: "Tamci przyjechali do Cezarei, oddali list namiestnikowi i stawili przed nim Pawła."
  tags: []
"Dz23,34":
  text: "A namiestnik po przeczytaniu listu zapytał go, z jakiej prowincji pochodzi. Kiedy dowiedział się, że z Cylicji;"
  tags: []
"Dz23,35":
  text: "Powiedział: Przesłucham cię, gdy przybędą twoi oskarżyciele. I rozkazał strzec go w ratuszu Heroda."
  tags: []
