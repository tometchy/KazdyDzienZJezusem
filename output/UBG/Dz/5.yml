"Dz5,1": "A pewien człowiek, imieniem Ananiasz, ze swoją żoną Safirą, sprzedał swą posiadłość;"
"Dz5,2": "I za wiedzą swojej żony odłożył sobie część pieniędzy, a pewną część przyniósł i złożył u stóp apostołów."
"Dz5,3": "Lecz Piotr powiedział: Ananiaszu, dlaczego szatan tak napełnił twoje serce, abyś okłamał Ducha Świętego i odłożył sobie część pieniędzy za ziemię?"
"Dz5,4": "Czy to, co miałeś, nie było twoje? A to, co otrzymałeś za sprzedaż, czy nie pozostawało w twojej mocy? Dlaczego dopuściłeś to do swego serca? Nie okłamałeś ludzi, lecz Boga."
"Dz5,5": "Ananiasz zaś, usłyszawszy te słowa, padł nieżywy. I wielki strach ogarnął wszystkich, którzy to słyszeli."
"Dz5,6": "Młodsi wstali, owinęli go, wynieśli i pogrzebali."
"Dz5,7": "A po około trzech godzinach weszła także jego żona, nie wiedząc, co się stało."
"Dz5,8": "I zapytał ją Piotr: Powiedz mi, czy za tyle sprzedaliście ziemię? A ona odpowiedziała: Tak, za tyle."
"Dz5,9": "Wtedy Piotr powiedział do niej: Dlaczego się ze sobą zmówiliście, aby wystawić na próbę Ducha Pańskiego? Oto są przed drzwiami ci, którzy pogrzebali twego męża, i ciebie wyniosą."
"Dz5,10": "I natychmiast padła nieżywa u jego stóp. A gdy młodzieńcy weszli, znaleźli ją martwą. Wynieśli ją więc i pogrzebali obok męża."
"Dz5,11": "I wielki strach ogarnął cały kościół i wszystkich, którzy to słyszeli."
"Dz5,12": "A przez ręce apostołów działo się wiele znaków i cudów wśród ludu. (I byli wszyscy jednomyślnie w przedsionku Salomona."
"Dz5,13": "I z pozostałych nikt nie śmiał się do nich przyłączyć, ale ludzie bardzo ich wychwalali."
"Dz5,14": "Przybywało też Panu mnóstwo wierzących, mężczyzn i kobiet)."
"Dz5,15": "Tak, że nawet na ulice wynoszono chorych i kładziono ich na noszach i posłaniach, aby przynajmniej cień przechodzącego Piotra padł na niektórych z nich."
"Dz5,16": "Schodziło się też z okolicznych miast do Jerozolimy mnóstwo ludzi, przynosząc chorych i dręczonych przez duchy nieczyste, a wszyscy zostali uzdrowieni."
"Dz5,17": "Wtedy najwyższy kapłan i wszyscy, którzy z nim byli, należący do stronnictwa saduceuszy, pełni zazdrości, powstali;"
"Dz5,18": "I schwytali apostołów, których wtrącili do publicznego więzienia."
"Dz5,19": "Lecz anioł Pana w nocy otworzył drzwi więzienia i wyprowadziwszy ich, powiedział:"
"Dz5,20": "Idźcie i wystąpiwszy, mówcie do ludzi w świątyni wszystkie słowa tego życia."
"Dz5,21": "Kiedy to usłyszeli, weszli o świcie do świątyni i nauczali. Tymczasem najwyższy kapłan i ci, którzy z nim byli, przyszli, zwołali Radę oraz wszystkich starszych spośród synów Izraela i posłali do więzienia, aby ich przyprowadzono."
"Dz5,22": "Lecz gdy słudzy przyszli i nie znaleźli ich w więzieniu, wrócili i oznajmili:"
"Dz5,23": "Wprawdzie zastaliśmy więzienie starannie zamknięte, a strażników stojących na zewnątrz, przed drzwiami, po otwarciu jednak nie znaleźliśmy w nim nikogo."
"Dz5,24": "A gdy najwyższy kapłan i dowódca straży świątynnej oraz naczelni kapłani usłyszeli te słowa, zastanawiali się, co z tego będzie."
"Dz5,25": "Wówczas nadszedł ktoś i oznajmił im: Ludzie, których wtrąciliście do więzienia, stoją w świątyni i nauczają lud."
"Dz5,26": "Wtedy dowódca straży poszedł ze sługami i przyprowadził ich bez użycia siły. Bali się bowiem ludu, żeby ich nie ukamienowali."
"Dz5,27": "Gdy ich przyprowadzili, postawili ich przed Radą. I zapytał ich najwyższy kapłan:"
"Dz5,28": "Czy nie zakazaliśmy wam surowo, żebyście w tym imieniu nie nauczali? A oto napełniliście Jerozolimę waszą nauką i chcecie na nas ściągnąć krew tego człowieka."
"Dz5,29": "Wtedy Piotr i apostołowie odpowiedzieli: Bardziej trzeba słuchać Boga niż ludzi."
"Dz5,30": "Bóg naszych ojców wskrzesił Jezusa, którego wy zabiliście, zawiesiwszy na drzewie."
"Dz5,31": "Tego Bóg wywyższył swoją prawicą, aby był władcą i zbawicielem, aby ludowi Izraela dać pokutę i przebaczenie grzechów."
"Dz5,32": "A my jesteśmy jego świadkami w tym, a także Duch Święty, którego Bóg dał tym, którzy są mu posłuszni."
"Dz5,33": "A oni, słysząc to, wpadli w gniew i naradzali się nad tym, jakby ich zabić."
"Dz5,34": "Wtedy pewien faryzeusz, imieniem Gamaliel, nauczyciel prawa, szanowany przez wszystkich ludzi, powstał na Radzie i nakazał, aby na chwilę wyprowadzono apostołów;"
"Dz5,35": "I powiedział do nich: Mężowie izraelscy, zastanówcie się dobrze, co zamierzacie zrobić z tymi ludźmi."
"Dz5,36": "Niedawno bowiem wystąpił Teudas, podając się za nie byle kogo, do którego przyłączyło się około czterystu ludzi. Zabito go, a wszyscy jego zwolennicy rozproszyli się i ślad po nich zaginął."
"Dz5,37": "Po nim w dniach spisu wystąpił Judasz Galilejczyk i pociągnął za sobą wielu ludzi. Lecz i on zginął, a wszyscy jego zwolennicy rozproszyli się."
"Dz5,38": "Dlatego teraz mówię wam: Odstąpcie od tych ludzi i zostawcie ich. Jeśli bowiem ten zamysł czy ta sprawa pochodzi od ludzi, obróci się wniwecz;"
"Dz5,39": "Ale jeśli pochodzi od Boga, nie będziecie mogli tego zniszczyć, aby się czasem nie okazało, że walczycie z Bogiem."
"Dz5,40": "I posłuchali go. A przywoławszy apostołów, ubiczowali ich i zabronili im mówić w imię Jezusa, a potem ich wypuścili."
"Dz5,41": "A oni odchodzili sprzed Rady, ciesząc się, że stali się godni znosić zniewagę dla imienia Jezusa."
"Dz5,42": "Nie przestawali też codziennie w świątyni i po domach nauczać i głosić Jezusa Chrystusa."
