"Dz5,1":
  text: "A pewien człowiek, imieniem Ananiasz, ze swoją żoną Safirą, sprzedał swą posiadłość;"
  tags: []
"Dz5,2":
  text: "I za wiedzą swojej żony odłożył sobie część pieniędzy, a pewną część przyniósł i złożył u stóp apostołów."
  tags: []
"Dz5,3":
  text: "Lecz Piotr powiedział: Ananiaszu, dlaczego szatan tak napełnił twoje serce, abyś okłamał Ducha Świętego i odłożył sobie część pieniędzy za ziemię?"
  tags: []
"Dz5,4":
  text: "Czy to, co miałeś, nie było twoje? A to, co otrzymałeś za sprzedaż, czy nie pozostawało w twojej mocy? Dlaczego dopuściłeś to do swego serca? Nie okłamałeś ludzi, lecz Boga."
  tags: []
"Dz5,5":
  text: "Ananiasz zaś, usłyszawszy te słowa, padł nieżywy. I wielki strach ogarnął wszystkich, którzy to słyszeli."
  tags: []
"Dz5,6":
  text: "Młodsi wstali, owinęli go, wynieśli i pogrzebali."
  tags: []
"Dz5,7":
  text: "A po około trzech godzinach weszła także jego żona, nie wiedząc, co się stało."
  tags: []
"Dz5,8":
  text: "I zapytał ją Piotr: Powiedz mi, czy za tyle sprzedaliście ziemię? A ona odpowiedziała: Tak, za tyle."
  tags: []
"Dz5,9":
  text: "Wtedy Piotr powiedział do niej: Dlaczego się ze sobą zmówiliście, aby wystawić na próbę Ducha Pańskiego? Oto są przed drzwiami ci, którzy pogrzebali twego męża, i ciebie wyniosą."
  tags: []
"Dz5,10":
  text: "I natychmiast padła nieżywa u jego stóp. A gdy młodzieńcy weszli, znaleźli ją martwą. Wynieśli ją więc i pogrzebali obok męża."
  tags: []
"Dz5,11":
  text: "I wielki strach ogarnął cały kościół i wszystkich, którzy to słyszeli."
  tags: []
"Dz5,12":
  text: "A przez ręce apostołów działo się wiele znaków i cudów wśród ludu. (I byli wszyscy jednomyślnie w przedsionku Salomona."
  tags: []
"Dz5,13":
  text: "I z pozostałych nikt nie śmiał się do nich przyłączyć, ale ludzie bardzo ich wychwalali."
  tags: []
"Dz5,14":
  text: "Przybywało też Panu mnóstwo wierzących, mężczyzn i kobiet)."
  tags: []
"Dz5,15":
  text: "Tak, że nawet na ulice wynoszono chorych i kładziono ich na noszach i posłaniach, aby przynajmniej cień przechodzącego Piotra padł na niektórych z nich."
  tags: []
"Dz5,16":
  text: "Schodziło się też z okolicznych miast do Jerozolimy mnóstwo ludzi, przynosząc chorych i dręczonych przez duchy nieczyste, a wszyscy zostali uzdrowieni."
  tags: []
"Dz5,17":
  text: "Wtedy najwyższy kapłan i wszyscy, którzy z nim byli, należący do stronnictwa saduceuszy, pełni zazdrości, powstali;"
  tags: []
"Dz5,18":
  text: "I schwytali apostołów, których wtrącili do publicznego więzienia."
  tags: []
"Dz5,19":
  text: "Lecz anioł Pana w nocy otworzył drzwi więzienia i wyprowadziwszy ich, powiedział:"
  tags: []
"Dz5,20":
  text: "Idźcie i wystąpiwszy, mówcie do ludzi w świątyni wszystkie słowa tego życia."
  tags: []
"Dz5,21":
  text: "Kiedy to usłyszeli, weszli o świcie do świątyni i nauczali. Tymczasem najwyższy kapłan i ci, którzy z nim byli, przyszli, zwołali Radę oraz wszystkich starszych spośród synów Izraela i posłali do więzienia, aby ich przyprowadzono."
  tags: []
"Dz5,22":
  text: "Lecz gdy słudzy przyszli i nie znaleźli ich w więzieniu, wrócili i oznajmili:"
  tags: []
"Dz5,23":
  text: "Wprawdzie zastaliśmy więzienie starannie zamknięte, a strażników stojących na zewnątrz, przed drzwiami, po otwarciu jednak nie znaleźliśmy w nim nikogo."
  tags: []
"Dz5,24":
  text: "A gdy najwyższy kapłan i dowódca straży świątynnej oraz naczelni kapłani usłyszeli te słowa, zastanawiali się, co z tego będzie."
  tags: []
"Dz5,25":
  text: "Wówczas nadszedł ktoś i oznajmił im: Ludzie, których wtrąciliście do więzienia, stoją w świątyni i nauczają lud."
  tags: []
"Dz5,26":
  text: "Wtedy dowódca straży poszedł ze sługami i przyprowadził ich bez użycia siły. Bali się bowiem ludu, żeby ich nie ukamienowali."
  tags: []
"Dz5,27":
  text: "Gdy ich przyprowadzili, postawili ich przed Radą. I zapytał ich najwyższy kapłan:"
  tags: []
"Dz5,28":
  text: "Czy nie zakazaliśmy wam surowo, żebyście w tym imieniu nie nauczali? A oto napełniliście Jerozolimę waszą nauką i chcecie na nas ściągnąć krew tego człowieka."
  tags: []
"Dz5,29":
  text: "Wtedy Piotr i apostołowie odpowiedzieli: Bardziej trzeba słuchać Boga niż ludzi."
  tags: []
"Dz5,30":
  text: "Bóg naszych ojców wskrzesił Jezusa, którego wy zabiliście, zawiesiwszy na drzewie."
  tags: []
"Dz5,31":
  text: "Tego Bóg wywyższył swoją prawicą, aby był władcą i zbawicielem, aby ludowi Izraela dać pokutę i przebaczenie grzechów."
  tags: []
"Dz5,32":
  text: "A my jesteśmy jego świadkami w tym, a także Duch Święty, którego Bóg dał tym, którzy są mu posłuszni."
  tags: []
"Dz5,33":
  text: "A oni, słysząc to, wpadli w gniew i naradzali się nad tym, jakby ich zabić."
  tags: []
"Dz5,34":
  text: "Wtedy pewien faryzeusz, imieniem Gamaliel, nauczyciel prawa, szanowany przez wszystkich ludzi, powstał na Radzie i nakazał, aby na chwilę wyprowadzono apostołów;"
  tags: []
"Dz5,35":
  text: "I powiedział do nich: Mężowie izraelscy, zastanówcie się dobrze, co zamierzacie zrobić z tymi ludźmi."
  tags: []
"Dz5,36":
  text: "Niedawno bowiem wystąpił Teudas, podając się za nie byle kogo, do którego przyłączyło się około czterystu ludzi. Zabito go, a wszyscy jego zwolennicy rozproszyli się i ślad po nich zaginął."
  tags: []
"Dz5,37":
  text: "Po nim w dniach spisu wystąpił Judasz Galilejczyk i pociągnął za sobą wielu ludzi. Lecz i on zginął, a wszyscy jego zwolennicy rozproszyli się."
  tags: []
"Dz5,38":
  text: "Dlatego teraz mówię wam: Odstąpcie od tych ludzi i zostawcie ich. Jeśli bowiem ten zamysł czy ta sprawa pochodzi od ludzi, obróci się wniwecz;"
  tags: []
"Dz5,39":
  text: "Ale jeśli pochodzi od Boga, nie będziecie mogli tego zniszczyć, aby się czasem nie okazało, że walczycie z Bogiem."
  tags: []
"Dz5,40":
  text: "I posłuchali go. A przywoławszy apostołów, ubiczowali ich i zabronili im mówić w imię Jezusa, a potem ich wypuścili."
  tags: []
"Dz5,41":
  text: "A oni odchodzili sprzed Rady, ciesząc się, że stali się godni znosić zniewagę dla imienia Jezusa."
  tags: []
"Dz5,42":
  text: "Nie przestawali też codziennie w świątyni i po domach nauczać i głosić Jezusa Chrystusa."
  tags: []
