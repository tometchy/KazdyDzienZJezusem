"Dz20,1":
  text: "A gdy ustały rozruchy, Paweł przywołał uczniów, pożegnał się z nimi i wyruszył do Macedonii."
  tags: []
"Dz20,2":
  text: "Przeszedł tamte okolice, udzielając wielu napomnień. Potem przybył do Grecji."
  tags: []
"Dz20,3":
  text: "Kiedy po trzymiesięcznym pobycie zamierzał odpłynąć do Syrii, Żydzi urządzili na niego zasadzkę, więc postanowił powrócić przez Macedonię."
  tags: []
"Dz20,4":
  text: "Razem z nim do Azji wyruszyli Sopater z Berei, z Tesaloniczan Arystarch i Sekundus, i Gajus z Derbe, i Tymoteusz, a z Azji Tychikus i Trofim."
  tags: []
"Dz20,5":
  text: "Ci poszli pierwsi i czekali na nas w Troadzie."
  tags: []
"Dz20,6":
  text: "My zaś po święcie Przaśników odpłynęliśmy z Filippi i po pięciu dniach przybyliśmy do nich do Troady, gdzie spędziliśmy siedem dni."
  tags: []
"Dz20,7":
  text: "A pierwszego dnia po szabacie, gdy uczniowie zebrali się na łamanie chleba, Paweł, który miał nazajutrz odjechać, przemawiał do nich i przeciągnął mowę aż do północy."
  tags: []
"Dz20,8":
  text: "A w sali na piętrze, w której byli zebrani, paliło się wiele lamp."
  tags: []
"Dz20,9":
  text: "Pewien młodzieniec, imieniem Eutych, siedział w oknie pogrążony w głębokim śnie. Kiedy Paweł długo przemawiał, zmorzony snem spadł z trzeciego piętra na dół. Gdy go podniesiono, był martwy."
  tags: []
"Dz20,10":
  text: "Paweł zszedł na dół, przypadł do niego, objął go i powiedział: Nie bójcie się, bo jest w nim życie."
  tags: []
"Dz20,11":
  text: "Wrócił na górę, łamał chleb i jadł, a głosił im długo, aż do świtu. Potem ruszył w drogę."
  tags: []
"Dz20,12":
  text: "I przyprowadzili młodzieńca żywego, i byli wielce pocieszeni."
  tags: []
"Dz20,13":
  text: "My zaś, wsiadłszy wcześniej na statek, popłynęliśmy do Assos, skąd mieliśmy zabrać Pawła. Tak bowiem postanowił, sam chcąc iść pieszo."
  tags: []
"Dz20,14":
  text: "Kiedy spotkał się z nami w Assos, zabraliśmy go i przybyliśmy do Mityleny."
  tags: []
"Dz20,15":
  text: "Odpłynąwszy stamtąd, nazajutrz znaleźliśmy się naprzeciw Chios, a następnego dnia przypłynęliśmy do Samos. Przenocowaliśmy w Trogillium, a dzień później dotarliśmy do Miletu;"
  tags: []
"Dz20,16":
  text: "Gdyż Paweł postanowił ominąć Efez, żeby nie spędzić czasu w Azji. Spieszył się bowiem, aby, jeśli to możliwe, być na dzień Pięćdziesiątnicy w Jerozolimie."
  tags: []
"Dz20,17":
  text: "Z Miletu posłał do Efezu, wzywając do siebie starszych kościoła."
  tags: []
"Dz20,18":
  text: "A gdy przybyli do niego, powiedział: Wy wiecie, jaki byłem przez cały czas wśród was od pierwszego dnia, kiedy przybyłem do Azji;"
  tags: []
"Dz20,19":
  text: "Jak służyłem Panu z całą pokorą wśród wielu łez i doświadczeń, które mnie spotykały z powodu zasadzek Żydów;"
  tags: []
"Dz20,20":
  text: "Jak nie uchylałem się od niczego, co pożyteczne, od przemawiania i nauczania was publicznie i po domach;"
  tags: []
"Dz20,21":
  text: "Oświadczając zarówno Żydom, jak i Grekom o pokucie wobec Boga i o wierze w naszego Pana Jezusa Chrystusa."
  tags: []
"Dz20,22":
  text: "A teraz, związany w duchu, idę do Jerozolimy, nie wiedząc, co mnie tam spotka."
  tags: []
"Dz20,23":
  text: "Wiem tylko, że Duch Święty poświadcza w każdym mieście, iż czekają mnie więzy i utrapienia."
  tags: []
"Dz20,24":
  text: "Lecz ja o to nie dbam, a moje życie nie jest mi tak drogie, bylebym tylko z radością dokończył mój bieg i posługę, którą otrzymałem od Pana Jezusa, by dać świadectwo o ewangelii łaski Bożej."
  tags: []
"Dz20,25":
  text: "A teraz wiem, że wy wszyscy, wśród których przebywałem, głosząc królestwo Boże, już więcej nie zobaczycie mojej twarzy."
  tags: []
"Dz20,26":
  text: "Dlatego oświadczam wam dzisiaj, że nie jestem winien niczyjej krwi."
  tags: []
"Dz20,27":
  text: "Nie uchylałem się bowiem od zwiastowania wam całej rady Bożej."
  tags: []
"Dz20,28":
  text: "Uważajcie na samych siebie i na całe stado, w którym was Duch Święty ustanowił biskupami, abyście paśli kościół Boga, który on nabył własną krwią."
  tags: []
"Dz20,29":
  text: "Gdyż wiem, że po moim odejściu wejdą między was wilki drapieżne, które nie będą oszczędzać stada."
  tags: []
"Dz20,30":
  text: "Także spośród was samych powstaną ludzie mówiący rzeczy przewrotne, aby pociągnąć za sobą uczniów."
  tags: []
"Dz20,31":
  text: "Dlatego czuwajcie, pamiętając, że przez trzy lata we dnie i w nocy nie przestawałem ze łzami napominać każdego z was."
  tags: []
"Dz20,32":
  text: "A teraz, bracia, polecam was Bogu i słowu jego łaski, które może zbudować was i dać wam dziedzictwo wśród wszystkich, którzy są uświęceni."
  tags: []
"Dz20,33":
  text: "Nie pożądałem srebra, złota ani szaty niczyjej."
  tags: []
"Dz20,34":
  text: "Przeciwnie, sami wiecie, że te ręce służyły zaspokajaniu potrzeb moich i tych, którzy są ze mną."
  tags: []
"Dz20,35":
  text: "We wszystkim wam pokazałem, że tak pracując, musimy wspierać słabych i pamiętać o słowach Pana Jezusa, który powiedział: Bardziej błogosławioną rzeczą jest dawać niż brać."
  tags: []
"Dz20,36":
  text: "Po tych słowach ukląkł i modlił się z nimi wszystkimi."
  tags: []
"Dz20,37":
  text: "Wtedy wszyscy wybuchnęli wielkim płaczem i rzucając się Pawłowi na szyję, całowali go;"
  tags: []
"Dz20,38":
  text: "Smucąc się najbardziej z powodu tych słów, które im powiedział, że już więcej nie zobaczą jego twarzy. I odprowadzili go na statek."
  tags: []
