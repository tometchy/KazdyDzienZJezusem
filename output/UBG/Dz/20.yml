"Dz20,1": "A gdy ustały rozruchy, Paweł przywołał uczniów, pożegnał się z nimi i wyruszył do Macedonii."
"Dz20,2": "Przeszedł tamte okolice, udzielając wielu napomnień. Potem przybył do Grecji."
"Dz20,3": "Kiedy po trzymiesięcznym pobycie zamierzał odpłynąć do Syrii, Żydzi urządzili na niego zasadzkę, więc postanowił powrócić przez Macedonię."
"Dz20,4": "Razem z nim do Azji wyruszyli Sopater z Berei, z Tesaloniczan Arystarch i Sekundus, i Gajus z Derbe, i Tymoteusz, a z Azji Tychikus i Trofim."
"Dz20,5": "Ci poszli pierwsi i czekali na nas w Troadzie."
"Dz20,6": "My zaś po święcie Przaśników odpłynęliśmy z Filippi i po pięciu dniach przybyliśmy do nich do Troady, gdzie spędziliśmy siedem dni."
"Dz20,7": "A pierwszego dnia po szabacie, gdy uczniowie zebrali się na łamanie chleba, Paweł, który miał nazajutrz odjechać, przemawiał do nich i przeciągnął mowę aż do północy."
"Dz20,8": "A w sali na piętrze, w której byli zebrani, paliło się wiele lamp."
"Dz20,9": "Pewien młodzieniec, imieniem Eutych, siedział w oknie pogrążony w głębokim śnie. Kiedy Paweł długo przemawiał, zmorzony snem spadł z trzeciego piętra na dół. Gdy go podniesiono, był martwy."
"Dz20,10": "Paweł zszedł na dół, przypadł do niego, objął go i powiedział: Nie bójcie się, bo jest w nim życie."
"Dz20,11": "Wrócił na górę, łamał chleb i jadł, a głosił im długo, aż do świtu. Potem ruszył w drogę."
"Dz20,12": "I przyprowadzili młodzieńca żywego, i byli wielce pocieszeni."
"Dz20,13": "My zaś, wsiadłszy wcześniej na statek, popłynęliśmy do Assos, skąd mieliśmy zabrać Pawła. Tak bowiem postanowił, sam chcąc iść pieszo."
"Dz20,14": "Kiedy spotkał się z nami w Assos, zabraliśmy go i przybyliśmy do Mityleny."
"Dz20,15": "Odpłynąwszy stamtąd, nazajutrz znaleźliśmy się naprzeciw Chios, a następnego dnia przypłynęliśmy do Samos. Przenocowaliśmy w Trogillium, a dzień później dotarliśmy do Miletu;"
"Dz20,16": "Gdyż Paweł postanowił ominąć Efez, żeby nie spędzić czasu w Azji. Spieszył się bowiem, aby, jeśli to możliwe, być na dzień Pięćdziesiątnicy w Jerozolimie."
"Dz20,17": "Z Miletu posłał do Efezu, wzywając do siebie starszych kościoła."
"Dz20,18": "A gdy przybyli do niego, powiedział: Wy wiecie, jaki byłem przez cały czas wśród was od pierwszego dnia, kiedy przybyłem do Azji;"
"Dz20,19": "Jak służyłem Panu z całą pokorą wśród wielu łez i doświadczeń, które mnie spotykały z powodu zasadzek Żydów;"
"Dz20,20": "Jak nie uchylałem się od niczego, co pożyteczne, od przemawiania i nauczania was publicznie i po domach;"
"Dz20,21": "Oświadczając zarówno Żydom, jak i Grekom o pokucie wobec Boga i o wierze w naszego Pana Jezusa Chrystusa."
"Dz20,22": "A teraz, związany w duchu, idę do Jerozolimy, nie wiedząc, co mnie tam spotka."
"Dz20,23": "Wiem tylko, że Duch Święty poświadcza w każdym mieście, iż czekają mnie więzy i utrapienia."
"Dz20,24": "Lecz ja o to nie dbam, a moje życie nie jest mi tak drogie, bylebym tylko z radością dokończył mój bieg i posługę, którą otrzymałem od Pana Jezusa, by dać świadectwo o ewangelii łaski Bożej."
"Dz20,25": "A teraz wiem, że wy wszyscy, wśród których przebywałem, głosząc królestwo Boże, już więcej nie zobaczycie mojej twarzy."
"Dz20,26": "Dlatego oświadczam wam dzisiaj, że nie jestem winien niczyjej krwi."
"Dz20,27": "Nie uchylałem się bowiem od zwiastowania wam całej rady Bożej."
"Dz20,28": "Uważajcie na samych siebie i na całe stado, w którym was Duch Święty ustanowił biskupami, abyście paśli kościół Boga, który on nabył własną krwią."
"Dz20,29": "Gdyż wiem, że po moim odejściu wejdą między was wilki drapieżne, które nie będą oszczędzać stada."
"Dz20,30": "Także spośród was samych powstaną ludzie mówiący rzeczy przewrotne, aby pociągnąć za sobą uczniów."
"Dz20,31": "Dlatego czuwajcie, pamiętając, że przez trzy lata we dnie i w nocy nie przestawałem ze łzami napominać każdego z was."
"Dz20,32": "A teraz, bracia, polecam was Bogu i słowu jego łaski, które może zbudować was i dać wam dziedzictwo wśród wszystkich, którzy są uświęceni."
"Dz20,33": "Nie pożądałem srebra, złota ani szaty niczyjej."
"Dz20,34": "Przeciwnie, sami wiecie, że te ręce służyły zaspokajaniu potrzeb moich i tych, którzy są ze mną."
"Dz20,35": "We wszystkim wam pokazałem, że tak pracując, musimy wspierać słabych i pamiętać o słowach Pana Jezusa, który powiedział: Bardziej błogosławioną rzeczą jest dawać niż brać."
"Dz20,36": "Po tych słowach ukląkł i modlił się z nimi wszystkimi."
"Dz20,37": "Wtedy wszyscy wybuchnęli wielkim płaczem i rzucając się Pawłowi na szyję, całowali go;"
"Dz20,38": "Smucąc się najbardziej z powodu tych słów, które im powiedział, że już więcej nie zobaczą jego twarzy. I odprowadzili go na statek."
