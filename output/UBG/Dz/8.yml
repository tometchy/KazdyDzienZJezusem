"Dz8,1": "A Saul zgodził się na zabicie go. W tym czasie zaczęło się wielkie prześladowanie kościoła w Jerozolimie i wszyscy oprócz apostołów rozproszyli się po okolicach Judei i Samarii."
"Dz8,2": "Szczepana zaś pogrzebali bogobojni ludzie i bardzo go opłakiwali."
"Dz8,3": "Tymczasem Saul niszczył kościół. Wchodził do domów, wywlekał mężczyzn i kobiety i wtrącał ich do więzienia."
"Dz8,4": "A ci, którzy się rozproszyli, szli wszędzie, głosząc słowo Boże."
"Dz8,5": "Filip przybył do miasta Samarii i głosił im Chrystusa."
"Dz8,6": "A lud jednomyślnie przyjmował to, co mówił Filip, gdy go słyszeli i widzieli cuda, które czynił."
"Dz8,7": "Duchy nieczyste bowiem wychodziły z donośnym krzykiem z wielu, którzy je mieli. Wielu też sparaliżowanych i ułomnych zostało uzdrowionych."
"Dz8,8": "I wielka radość zapanowała w tym mieście."
"Dz8,9": "A pewien człowiek o imieniu Szymon, który wcześniej w tym mieście zajmował się czarami, mamił lud Samarii, twierdząc, że jest kimś wielkim."
"Dz8,10": "Liczyli się z nim wszyscy od najmniejszego do największego, mówiąc: Ten człowiek jest tą wielką mocą Boga."
"Dz8,11": "A liczyli się z nim dlatego, że od dłuższego czasu mamił ich swoimi czarami."
"Dz8,12": "A gdy uwierzyli Filipowi, który głosił o królestwie Bożym i o imieniu Jezusa Chrystusa, chrzcili się zarówno mężczyźni, jak i kobiety."
"Dz8,13": "Uwierzył też sam Szymon, a gdy się ochrzcił, trzymał się Filipa i zdumiewał się, widząc cuda i wielkie znaki, jakie się działy."
"Dz8,14": "Kiedy apostołowie, którzy byli w Jerozolimie, usłyszeli, że Samaria przyjęła słowo Boże, wysłali do nich Piotra i Jana;"
"Dz8,15": "Którzy przyszli tam i modlili się za nich, aby otrzymali Ducha Świętego."
"Dz8,16": "Na żadnego z nich bowiem jeszcze nie zstąpił. Byli tylko ochrzczeni w imię Pana Jezusa."
"Dz8,17": "Wtedy kładli na nich ręce, a oni otrzymywali Ducha Świętego."
"Dz8,18": "A gdy Szymon zobaczył, że Duch Święty był udzielany przez nakładanie rąk apostołów, przyniósł im pieniądze;"
"Dz8,19": "Mówiąc: Dajcie i mnie tę moc, aby ten, na kogo nałożę ręce, otrzymał Ducha Świętego."
"Dz8,20": "I powiedział mu Piotr: Niech zginą z tobą twoje pieniądze, bo sądziłeś, że dar Boży można nabyć za pieniądze."
"Dz8,21": "Nie masz w tej sprawie części ani udziału, bo twoje serce nie jest prawe przed Bogiem."
"Dz8,22": "Dlatego pokutuj z tej twojej nieprawości i proś Boga, a może ci przebaczy zamysł twego serca."
"Dz8,23": "Widzę bowiem, że jesteś pogrążony w goryczy żółci i w więzach nieprawości."
"Dz8,24": "Wtedy Szymon odpowiedział: Módlcie się za mnie do Pana, aby nic z tego, co powiedzieliście, mnie nie spotkało."
"Dz8,25": "A gdy dali świadectwo i opowiedzieli słowo Pana, udali się w drogę powrotną do Jerozolimy i głosili ewangelię w wielu wioskach samarytańskich."
"Dz8,26": "Lecz anioł Pana powiedział do Filipa: Wstań i idź na południe, na drogę, która prowadzi z Jerozolimy do Gazy. Jest to droga pustynna."
"Dz8,27": "Wstał więc i poszedł. A oto przyjechał do Jerozolimy oddać cześć Bogu Etiopczyk, eunuch, dostojnik królowej etiopskiej Kandaki, który zarządzał jej wszystkimi skarbami;"
"Dz8,28": "I wracał, a siedząc na swoim wozie, czytał proroka Izajasza."
"Dz8,29": "A Duch powiedział do Filipa: Podejdź i przyłącz się do tego wozu."
"Dz8,30": "Kiedy Filip podbiegł, usłyszał, jak tamten czyta proroka Izajasza, i zapytał: Rozumiesz, co czytasz?"
"Dz8,31": "A on odpowiedział: Jak mogę rozumieć, jeśli mi nikt nie wyjaśni? I zaprosił Filipa, aby wszedł i przy nim usiadł."
"Dz8,32": "A czytał ten fragment Pisma: Jak owca na rzeź był prowadzony i jak baranek milczący wobec tego, który go strzyże, tak on nie otworzył swoich ust."
"Dz8,33": "W jego poniżeniu pozbawiono go sądu, a któż wypowie jego ród? Jego życie bowiem zostało zabrane z ziemi."
"Dz8,34": "I zapytał eunuch Filipa: Proszę cię, o kim to prorok mówi? Sam o sobie czy o kimś innym?"
"Dz8,35": "Wtedy Filip otworzył swe usta i zaczynając od tego fragmentu Pisma, głosił mu Jezusa."
"Dz8,36": "A gdy jechali drogą, przybyli nad jakąś wodę. Wówczas eunuch powiedział: Oto woda; co stoi na przeszkodzie, żebym mógł być ochrzczony?"
"Dz8,37": "I powiedział Filip: Jeśli wierzysz z całego serca, możesz. A on odpowiedział: Wierzę, że Jezus Chrystus jest Synem Bożym."
"Dz8,38": "Kazał więc zatrzymać wóz. Obaj, Filip i eunuch, zeszli do wody i ochrzcił go."
"Dz8,39": "A gdy wyszli z wody, Duch Pański porwał Filipa i eunuch go więcej nie widział, ale jechał swoją drogą, radując się."
"Dz8,40": "Filip zaś znalazł się w Azocie, a obchodząc wszystkie miasta, głosił ewangelię, aż dotarł do Cezarei."
