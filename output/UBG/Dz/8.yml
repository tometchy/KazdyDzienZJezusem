"Dz8,1":
  text: "A Saul zgodził się na zabicie go. W tym czasie zaczęło się wielkie prześladowanie kościoła w Jerozolimie i wszyscy oprócz apostołów rozproszyli się po okolicach Judei i Samarii."
  tags: []
"Dz8,2":
  text: "Szczepana zaś pogrzebali bogobojni ludzie i bardzo go opłakiwali."
  tags: []
"Dz8,3":
  text: "Tymczasem Saul niszczył kościół. Wchodził do domów, wywlekał mężczyzn i kobiety i wtrącał ich do więzienia."
  tags: []
"Dz8,4":
  text: "A ci, którzy się rozproszyli, szli wszędzie, głosząc słowo Boże."
  tags: []
"Dz8,5":
  text: "Filip przybył do miasta Samarii i głosił im Chrystusa."
  tags: []
"Dz8,6":
  text: "A lud jednomyślnie przyjmował to, co mówił Filip, gdy go słyszeli i widzieli cuda, które czynił."
  tags: []
"Dz8,7":
  text: "Duchy nieczyste bowiem wychodziły z donośnym krzykiem z wielu, którzy je mieli. Wielu też sparaliżowanych i ułomnych zostało uzdrowionych."
  tags: []
"Dz8,8":
  text: "I wielka radość zapanowała w tym mieście."
  tags: []
"Dz8,9":
  text: "A pewien człowiek o imieniu Szymon, który wcześniej w tym mieście zajmował się czarami, mamił lud Samarii, twierdząc, że jest kimś wielkim."
  tags: []
"Dz8,10":
  text: "Liczyli się z nim wszyscy od najmniejszego do największego, mówiąc: Ten człowiek jest tą wielką mocą Boga."
  tags: []
"Dz8,11":
  text: "A liczyli się z nim dlatego, że od dłuższego czasu mamił ich swoimi czarami."
  tags: []
"Dz8,12":
  text: "A gdy uwierzyli Filipowi, który głosił o królestwie Bożym i o imieniu Jezusa Chrystusa, chrzcili się zarówno mężczyźni, jak i kobiety."
  tags: []
"Dz8,13":
  text: "Uwierzył też sam Szymon, a gdy się ochrzcił, trzymał się Filipa i zdumiewał się, widząc cuda i wielkie znaki, jakie się działy."
  tags: []
"Dz8,14":
  text: "Kiedy apostołowie, którzy byli w Jerozolimie, usłyszeli, że Samaria przyjęła słowo Boże, wysłali do nich Piotra i Jana;"
  tags: []
"Dz8,15":
  text: "Którzy przyszli tam i modlili się za nich, aby otrzymali Ducha Świętego."
  tags: []
"Dz8,16":
  text: "Na żadnego z nich bowiem jeszcze nie zstąpił. Byli tylko ochrzczeni w imię Pana Jezusa."
  tags: []
"Dz8,17":
  text: "Wtedy kładli na nich ręce, a oni otrzymywali Ducha Świętego."
  tags: []
"Dz8,18":
  text: "A gdy Szymon zobaczył, że Duch Święty był udzielany przez nakładanie rąk apostołów, przyniósł im pieniądze;"
  tags: []
"Dz8,19":
  text: "Mówiąc: Dajcie i mnie tę moc, aby ten, na kogo nałożę ręce, otrzymał Ducha Świętego."
  tags: []
"Dz8,20":
  text: "I powiedział mu Piotr: Niech zginą z tobą twoje pieniądze, bo sądziłeś, że dar Boży można nabyć za pieniądze."
  tags: []
"Dz8,21":
  text: "Nie masz w tej sprawie części ani udziału, bo twoje serce nie jest prawe przed Bogiem."
  tags: []
"Dz8,22":
  text: "Dlatego pokutuj z tej twojej nieprawości i proś Boga, a może ci przebaczy zamysł twego serca."
  tags: []
"Dz8,23":
  text: "Widzę bowiem, że jesteś pogrążony w goryczy żółci i w więzach nieprawości."
  tags: []
"Dz8,24":
  text: "Wtedy Szymon odpowiedział: Módlcie się za mnie do Pana, aby nic z tego, co powiedzieliście, mnie nie spotkało."
  tags: []
"Dz8,25":
  text: "A gdy dali świadectwo i opowiedzieli słowo Pana, udali się w drogę powrotną do Jerozolimy i głosili ewangelię w wielu wioskach samarytańskich."
  tags: []
"Dz8,26":
  text: "Lecz anioł Pana powiedział do Filipa: Wstań i idź na południe, na drogę, która prowadzi z Jerozolimy do Gazy. Jest to droga pustynna."
  tags: []
"Dz8,27":
  text: "Wstał więc i poszedł. A oto przyjechał do Jerozolimy oddać cześć Bogu Etiopczyk, eunuch, dostojnik królowej etiopskiej Kandaki, który zarządzał jej wszystkimi skarbami;"
  tags: []
"Dz8,28":
  text: "I wracał, a siedząc na swoim wozie, czytał proroka Izajasza."
  tags: []
"Dz8,29":
  text: "A Duch powiedział do Filipa: Podejdź i przyłącz się do tego wozu."
  tags: []
"Dz8,30":
  text: "Kiedy Filip podbiegł, usłyszał, jak tamten czyta proroka Izajasza, i zapytał: Rozumiesz, co czytasz?"
  tags: []
"Dz8,31":
  text: "A on odpowiedział: Jak mogę rozumieć, jeśli mi nikt nie wyjaśni? I zaprosił Filipa, aby wszedł i przy nim usiadł."
  tags: []
"Dz8,32":
  text: "A czytał ten fragment Pisma: Jak owca na rzeź był prowadzony i jak baranek milczący wobec tego, który go strzyże, tak on nie otworzył swoich ust."
  tags: []
"Dz8,33":
  text: "W jego poniżeniu pozbawiono go sądu, a któż wypowie jego ród? Jego życie bowiem zostało zabrane z ziemi."
  tags: []
"Dz8,34":
  text: "I zapytał eunuch Filipa: Proszę cię, o kim to prorok mówi? Sam o sobie czy o kimś innym?"
  tags: []
"Dz8,35":
  text: "Wtedy Filip otworzył swe usta i zaczynając od tego fragmentu Pisma, głosił mu Jezusa."
  tags: []
"Dz8,36":
  text: "A gdy jechali drogą, przybyli nad jakąś wodę. Wówczas eunuch powiedział: Oto woda; co stoi na przeszkodzie, żebym mógł być ochrzczony?"
  tags: []
"Dz8,37":
  text: "I powiedział Filip: Jeśli wierzysz z całego serca, możesz. A on odpowiedział: Wierzę, że Jezus Chrystus jest Synem Bożym."
  tags: []
"Dz8,38":
  text: "Kazał więc zatrzymać wóz. Obaj, Filip i eunuch, zeszli do wody i ochrzcił go."
  tags: []
"Dz8,39":
  text: "A gdy wyszli z wody, Duch Pański porwał Filipa i eunuch go więcej nie widział, ale jechał swoją drogą, radując się."
  tags: []
"Dz8,40":
  text: "Filip zaś znalazł się w Azocie, a obchodząc wszystkie miasta, głosił ewangelię, aż dotarł do Cezarei."
  tags: []
