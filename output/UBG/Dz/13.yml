"Dz13,1":
  text: "A w kościele w Antiochii byli pewni prorocy i nauczyciele: Barnaba, Szymon, zwany Nigrem, Lucjusz Cyrenejczyk i Manaen, który wychowywał się z tetrarchą Herodem, i Saul."
  tags: []
"Dz13,2":
  text: "A gdy jawnie pełnili służbę Panu i pościli, powiedział im Duch Święty: Odłączcie mi Barnabę i Saula do dzieła, do którego ich powołałem."
  tags: []
"Dz13,3":
  text: "Wtedy po poście i modlitwie nałożyli na nich ręce i wyprawili ich."
  tags: []
"Dz13,4":
  text: "A oni, posłani przez Ducha Świętego, przybyli do Seleucji, a stamtąd odpłynęli na Cypr."
  tags: []
"Dz13,5":
  text: "Gdy dotarli do Salaminy, głosili słowo Boże w synagogach żydowskich. Mieli też ze sobą Jana do pomocy."
  tags: []
"Dz13,6":
  text: "A kiedy przeszli wyspę aż do Pafos, spotkali tam pewnego czarownika, fałszywego proroka, Żyda imieniem Bar-Jezus;"
  tags: []
"Dz13,7":
  text: "Który należał do otoczenia prokonsula Sergiusza Pawła, człowieka roztropnego. On to, wezwawszy Barnabę i Saula, pragnął słuchać słowa Bożego."
  tags: []
"Dz13,8":
  text: "Lecz sprzeciwił się im Elimas, czarownik – tak bowiem tłumaczy się jego imię – usiłując odwieść prokonsula od wiary."
  tags: []
"Dz13,9":
  text: "Wtedy Saul, zwany też Pawłem, napełniony Duchem Świętym, spojrzał na niego uważnie;"
  tags: []
"Dz13,10":
  text: "I powiedział: O, synu diabła, pełny wszelkiego podstępu i przewrotności, nieprzyjacielu wszelkiej sprawiedliwości! Czy nie przestaniesz wykrzywiać prostych dróg Pana?"
  tags: []
"Dz13,11":
  text: "Oto teraz ręka Pana na tobie: oślepniesz i nie będziesz widział słońca przez pewien czas. I natychmiast ogarnęły go mrok i ciemność, i chodząc wkoło, szukał kogoś, kto by go poprowadził za rękę."
  tags: []
"Dz13,12":
  text: "Wtedy prokonsul, widząc, co się stało, uwierzył, zdumiewając się nauką Pana."
  tags: []
"Dz13,13":
  text: "A Paweł i jego towarzysze opuścili Pafos i przybyli do Perge w Pamfilii. Jan zaś odłączył się od nich i wrócił do Jerozolimy."
  tags: []
"Dz13,14":
  text: "A oni opuścili Perge, dotarli do Antiochii Pizydyjskiej, a w dzień szabatu weszli do synagogi i usiedli."
  tags: []
"Dz13,15":
  text: "Po odczytaniu Prawa i Proroków przełożeni synagogi posłali do nich z prośbą: Mężowie bracia, jeśli macie jakieś słowo zachęty dla ludu, to mówcie."
  tags: []
"Dz13,16":
  text: "Wtedy Paweł wstał, dał im ręką znak i powiedział: Mężowie Izraelici i wy, którzy boicie się Boga, słuchajcie."
  tags: []
"Dz13,17":
  text: "Bóg tego ludu Izraela wybrał naszych ojców i wywyższył lud, gdy był na obczyźnie w ziemi Egiptu i wyprowadził go z niej wyciągniętym ramieniem."
  tags: []
"Dz13,18":
  text: "Przez około czterdzieści lat znosił ich obyczaje na pustyni."
  tags: []
"Dz13,19":
  text: "A gdy wytępił siedem narodów w ziemi Kanaan, rozdzielił przez losowanie między nich ich ziemię."
  tags: []
"Dz13,20":
  text: "A potem przez około czterysta pięćdziesiąt lat dawał im sędziów, aż do proroka Samuela."
  tags: []
"Dz13,21":
  text: "Później prosili o króla. I na czterdzieści lat dał im Bóg Saula, syna Kisza, męża z pokolenia Beniamina."
  tags: []
"Dz13,22":
  text: "A kiedy go odrzucił, wzbudził im na króla Dawida, o którym dał świadectwo w słowach: Znalazłem Dawida, syna Jessego, męża według mego serca, który wypełni całą moją wolę."
  tags: []
"Dz13,23":
  text: "Z jego potomstwa, zgodnie z obietnicą, Bóg wzbudził Izraelowi Zbawiciela, Jezusa."
  tags: []
"Dz13,24":
  text: "Przed jego przyjściem Jan głosił chrzest pokuty całemu ludowi Izraela."
  tags: []
"Dz13,25":
  text: "A gdy Jan dopełniał swego biegu, powiedział: Za kogo mnie uważacie? Nie jestem nim. Ale idzie za mną ten, któremu nie jestem godny rozwiązać obuwia na nogach."
  tags: []
"Dz13,26":
  text: "Mężowie bracia, synowie rodu Abrahama i ci z was, którzy boją się Boga, do was zostało posłane słowo o tym zbawieniu."
  tags: []
"Dz13,27":
  text: "Mieszkańcy Jerozolimy bowiem i ich przełożeni, nie znając tego Jezusa ani głosów proroków, które są czytane w każdy szabat, wypełnili je, osądzając go."
  tags: []
"Dz13,28":
  text: "Chociaż nie znaleźli w nim żadnego powodu, żeby skazać go na śmierć, prosili Piłata, aby go stracił."
  tags: []
"Dz13,29":
  text: "A gdy wykonali wszystko, co było o nim napisane, zdjęli go z drzewa i złożyli w grobie."
  tags: []
"Dz13,30":
  text: "Lecz Bóg wskrzesił go z martwych."
  tags: []
"Dz13,31":
  text: "A on przez wiele dni był widziany przez tych, którzy razem z nim przyszli z Galilei do Jerozolimy, a teraz są jego świadkami przed ludem."
  tags: []
"Dz13,32":
  text: "I my głosimy wam dobrą nowinę o obietnicy złożonej ojcom;"
  tags: []
"Dz13,33":
  text: "Że Bóg wypełnił ją wobec nas, ich dzieci, wskrzeszając Jezusa, jak też jest napisane w psalmie drugim: Ty jesteś moim Synem, ja ciebie dziś zrodziłem."
  tags: []
"Dz13,34":
  text: "A to, że go wskrzesił z martwych, aby już nigdy nie uległ zniszczeniu, tak wyraził: Dam wam pewne miłosierdzia Dawida."
  tags: []
"Dz13,35":
  text: "Dlatego w innym miejscu mówi: Nie dasz twemu Świętemu doznać zniszczenia."
  tags: []
"Dz13,36":
  text: "Dawid bowiem za swego pokolenia służył woli Boga, zasnął i został przyłączony do swoich ojców, i doznał zniszczenia."
  tags: []
"Dz13,37":
  text: "Lecz ten, którego Bóg wskrzesił, nie doznał zniszczenia."
  tags: []
"Dz13,38":
  text: "Niech więc będzie wam wiadomo, mężowie bracia, że przez niego zwiastuje się wam przebaczenie grzechów;"
  tags: []
"Dz13,39":
  text: "I przez niego każdy, kto uwierzy, jest usprawiedliwiony we wszystkim, w czym nie mogliście być usprawiedliwieni przez Prawo Mojżesza."
  tags: []
"Dz13,40":
  text: "Uważajcie więc, aby nie spotkało was to, co zostało powiedziane u Proroków:"
  tags: []
"Dz13,41":
  text: "Patrzcie, szydercy, dziwcie się i przepadnijcie, bo ja za waszych dni dokonuję dzieła, w które nie uwierzycie, choćby wam ktoś o nim opowiedział."
  tags: []
"Dz13,42":
  text: "A kiedy wychodzili z synagogi żydowskiej, poganie prosili ich, aby również w następny szabat głosili im te same słowa."
  tags: []
"Dz13,43":
  text: "Kiedy zgromadzenie się rozeszło, wielu Żydów i pobożnych prozelitów poszło za Pawłem i Barnabą, którzy w rozmowie radzili im, aby trwali w łasce Boga."
  tags: []
"Dz13,44":
  text: "A w następny szabat niemal całe miasto zebrało się, aby słuchać słowa Bożego."
  tags: []
"Dz13,45":
  text: "Kiedy Żydzi zobaczyli tłumy, pełni zawiści sprzeciwiali się słowom Pawła, występując przeciwko nim i bluźniąc."
  tags: []
"Dz13,46":
  text: "A Paweł i Barnaba powiedzieli odważnie: Wam najpierw miało być zwiastowane słowo Boże. Skoro jednak je odrzucacie i uważacie się za niegodnych życia wiecznego, zwracamy się do pogan."
  tags: []
"Dz13,47":
  text: "Tak bowiem nakazał nam Pan: Ustanowiłem cię światłością dla pogan, abyś był zbawieniem aż po krańce ziemi."
  tags: []
"Dz13,48":
  text: "Kiedy poganie to usłyszeli, radowali się i wielbili słowo Pańskie, a uwierzyli wszyscy, którzy byli przeznaczeni do życia wiecznego."
  tags: []
"Dz13,49":
  text: "I słowo Pańskie rozchodziło się po całej krainie."
  tags: []
"Dz13,50":
  text: "A Żydzi podburzali pobożne i poważane kobiety oraz znaczących obywateli miasta, wzniecili prześladowanie Pawła i Barnaby i wypędzili ich ze swoich granic."
  tags: []
"Dz13,51":
  text: "A oni, strząsnąwszy na nich pył ze swoich nóg, przyszli do Ikonium."
  tags: []
"Dz13,52":
  text: "Uczniowie zaś byli pełni radości i Ducha Świętego."
  tags: []
