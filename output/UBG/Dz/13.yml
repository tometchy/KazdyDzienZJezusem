"Dz13,1": "A w kościele w Antiochii byli pewni prorocy i nauczyciele: Barnaba, Szymon, zwany Nigrem, Lucjusz Cyrenejczyk i Manaen, który wychowywał się z tetrarchą Herodem, i Saul."
"Dz13,2": "A gdy jawnie pełnili służbę Panu i pościli, powiedział im Duch Święty: Odłączcie mi Barnabę i Saula do dzieła, do którego ich powołałem."
"Dz13,3": "Wtedy po poście i modlitwie nałożyli na nich ręce i wyprawili ich."
"Dz13,4": "A oni, posłani przez Ducha Świętego, przybyli do Seleucji, a stamtąd odpłynęli na Cypr."
"Dz13,5": "Gdy dotarli do Salaminy, głosili słowo Boże w synagogach żydowskich. Mieli też ze sobą Jana do pomocy."
"Dz13,6": "A kiedy przeszli wyspę aż do Pafos, spotkali tam pewnego czarownika, fałszywego proroka, Żyda imieniem Bar-Jezus;"
"Dz13,7": "Który należał do otoczenia prokonsula Sergiusza Pawła, człowieka roztropnego. On to, wezwawszy Barnabę i Saula, pragnął słuchać słowa Bożego."
"Dz13,8": "Lecz sprzeciwił się im Elimas, czarownik – tak bowiem tłumaczy się jego imię – usiłując odwieść prokonsula od wiary."
"Dz13,9": "Wtedy Saul, zwany też Pawłem, napełniony Duchem Świętym, spojrzał na niego uważnie;"
"Dz13,10": "I powiedział: O, synu diabła, pełny wszelkiego podstępu i przewrotności, nieprzyjacielu wszelkiej sprawiedliwości! Czy nie przestaniesz wykrzywiać prostych dróg Pana?"
"Dz13,11": "Oto teraz ręka Pana na tobie: oślepniesz i nie będziesz widział słońca przez pewien czas. I natychmiast ogarnęły go mrok i ciemność, i chodząc wkoło, szukał kogoś, kto by go poprowadził za rękę."
"Dz13,12": "Wtedy prokonsul, widząc, co się stało, uwierzył, zdumiewając się nauką Pana."
"Dz13,13": "A Paweł i jego towarzysze opuścili Pafos i przybyli do Perge w Pamfilii. Jan zaś odłączył się od nich i wrócił do Jerozolimy."
"Dz13,14": "A oni opuścili Perge, dotarli do Antiochii Pizydyjskiej, a w dzień szabatu weszli do synagogi i usiedli."
"Dz13,15": "Po odczytaniu Prawa i Proroków przełożeni synagogi posłali do nich z prośbą: Mężowie bracia, jeśli macie jakieś słowo zachęty dla ludu, to mówcie."
"Dz13,16": "Wtedy Paweł wstał, dał im ręką znak i powiedział: Mężowie Izraelici i wy, którzy boicie się Boga, słuchajcie."
"Dz13,17": "Bóg tego ludu Izraela wybrał naszych ojców i wywyższył lud, gdy był na obczyźnie w ziemi Egiptu i wyprowadził go z niej wyciągniętym ramieniem."
"Dz13,18": "Przez około czterdzieści lat znosił ich obyczaje na pustyni."
"Dz13,19": "A gdy wytępił siedem narodów w ziemi Kanaan, rozdzielił przez losowanie między nich ich ziemię."
"Dz13,20": "A potem przez około czterysta pięćdziesiąt lat dawał im sędziów, aż do proroka Samuela."
"Dz13,21": "Później prosili o króla. I na czterdzieści lat dał im Bóg Saula, syna Kisza, męża z pokolenia Beniamina."
"Dz13,22": "A kiedy go odrzucił, wzbudził im na króla Dawida, o którym dał świadectwo w słowach: Znalazłem Dawida, syna Jessego, męża według mego serca, który wypełni całą moją wolę."
"Dz13,23": "Z jego potomstwa, zgodnie z obietnicą, Bóg wzbudził Izraelowi Zbawiciela, Jezusa."
"Dz13,24": "Przed jego przyjściem Jan głosił chrzest pokuty całemu ludowi Izraela."
"Dz13,25": "A gdy Jan dopełniał swego biegu, powiedział: Za kogo mnie uważacie? Nie jestem nim. Ale idzie za mną ten, któremu nie jestem godny rozwiązać obuwia na nogach."
"Dz13,26": "Mężowie bracia, synowie rodu Abrahama i ci z was, którzy boją się Boga, do was zostało posłane słowo o tym zbawieniu."
"Dz13,27": "Mieszkańcy Jerozolimy bowiem i ich przełożeni, nie znając tego Jezusa ani głosów proroków, które są czytane w każdy szabat, wypełnili je, osądzając go."
"Dz13,28": "Chociaż nie znaleźli w nim żadnego powodu, żeby skazać go na śmierć, prosili Piłata, aby go stracił."
"Dz13,29": "A gdy wykonali wszystko, co było o nim napisane, zdjęli go z drzewa i złożyli w grobie."
"Dz13,30": "Lecz Bóg wskrzesił go z martwych."
"Dz13,31": "A on przez wiele dni był widziany przez tych, którzy razem z nim przyszli z Galilei do Jerozolimy, a teraz są jego świadkami przed ludem."
"Dz13,32": "I my głosimy wam dobrą nowinę o obietnicy złożonej ojcom;"
"Dz13,33": "Że Bóg wypełnił ją wobec nas, ich dzieci, wskrzeszając Jezusa, jak też jest napisane w psalmie drugim: Ty jesteś moim Synem, ja ciebie dziś zrodziłem."
"Dz13,34": "A to, że go wskrzesił z martwych, aby już nigdy nie uległ zniszczeniu, tak wyraził: Dam wam pewne miłosierdzia Dawida."
"Dz13,35": "Dlatego w innym miejscu mówi: Nie dasz twemu Świętemu doznać zniszczenia."
"Dz13,36": "Dawid bowiem za swego pokolenia służył woli Boga, zasnął i został przyłączony do swoich ojców, i doznał zniszczenia."
"Dz13,37": "Lecz ten, którego Bóg wskrzesił, nie doznał zniszczenia."
"Dz13,38": "Niech więc będzie wam wiadomo, mężowie bracia, że przez niego zwiastuje się wam przebaczenie grzechów;"
"Dz13,39": "I przez niego każdy, kto uwierzy, jest usprawiedliwiony we wszystkim, w czym nie mogliście być usprawiedliwieni przez Prawo Mojżesza."
"Dz13,40": "Uważajcie więc, aby nie spotkało was to, co zostało powiedziane u Proroków:"
"Dz13,41": "Patrzcie, szydercy, dziwcie się i przepadnijcie, bo ja za waszych dni dokonuję dzieła, w które nie uwierzycie, choćby wam ktoś o nim opowiedział."
"Dz13,42": "A kiedy wychodzili z synagogi żydowskiej, poganie prosili ich, aby również w następny szabat głosili im te same słowa."
"Dz13,43": "Kiedy zgromadzenie się rozeszło, wielu Żydów i pobożnych prozelitów poszło za Pawłem i Barnabą, którzy w rozmowie radzili im, aby trwali w łasce Boga."
"Dz13,44": "A w następny szabat niemal całe miasto zebrało się, aby słuchać słowa Bożego."
"Dz13,45": "Kiedy Żydzi zobaczyli tłumy, pełni zawiści sprzeciwiali się słowom Pawła, występując przeciwko nim i bluźniąc."
"Dz13,46": "A Paweł i Barnaba powiedzieli odważnie: Wam najpierw miało być zwiastowane słowo Boże. Skoro jednak je odrzucacie i uważacie się za niegodnych życia wiecznego, zwracamy się do pogan."
"Dz13,47": "Tak bowiem nakazał nam Pan: Ustanowiłem cię światłością dla pogan, abyś był zbawieniem aż po krańce ziemi."
"Dz13,48": "Kiedy poganie to usłyszeli, radowali się i wielbili słowo Pańskie, a uwierzyli wszyscy, którzy byli przeznaczeni do życia wiecznego."
"Dz13,49": "I słowo Pańskie rozchodziło się po całej krainie."
"Dz13,50": "A Żydzi podburzali pobożne i poważane kobiety oraz znaczących obywateli miasta, wzniecili prześladowanie Pawła i Barnaby i wypędzili ich ze swoich granic."
"Dz13,51": "A oni, strząsnąwszy na nich pył ze swoich nóg, przyszli do Ikonium."
"Dz13,52": "Uczniowie zaś byli pełni radości i Ducha Świętego."
