"Dz27,1": "A gdy postanowiono, że mamy płynąć do Italii, oddano Pawła i innych więźniów setnikowi, imieniem Juliusz, z oddziału Augusta."
"Dz27,2": "Wsiedliśmy na statek adramyteński, który miał płynąć wzdłuż wybrzeża Azji, i odbiliśmy od brzegu. Był też z nami Arystarch, Macedończyk z Tesaloniki."
"Dz27,3": "Następnego dnia przypłynęliśmy do Sydonu, gdzie Juliusz, który życzliwie odnosił się do Pawła, pozwolił mu iść do przyjaciół, aby doznał pokrzepienia."
"Dz27,4": "A wyruszywszy stamtąd, płynęliśmy pod osłoną Cypru, dlatego że wiatry były przeciwne."
"Dz27,5": "Przepłynęliśmy morze na wysokości Cylicji i Pamfilii i przybyliśmy do Miry w Licji."
"Dz27,6": "Tam setnik znalazł statek aleksandryjski płynący do Italii i umieścił nas na nim."
"Dz27,7": "A gdy przez wiele dni płynęliśmy wolno i dotarliśmy zaledwie na wysokość Knidos, ponieważ wiatr nam nie pozwalał, popłynęliśmy wzdłuż Krety obok Salmone."
"Dz27,8": "A płynąc z trudem wzdłuż jej brzegów, dotarliśmy do pewnego miejsca zwanego Piękne Porty, blisko którego było miasto Lasaia."
"Dz27,9": "Gdy upłynęło wiele czasu i żegluga stała się niebezpieczna, bo minął już post, Paweł ich przestrzegał:"
"Dz27,10": "Panowie, widzę, że żegluga będzie związana z krzywdą i wielką szkodą nie tylko ładunkowi i statkowi, ale i naszemu życiu."
"Dz27,11": "Setnik jednak bardziej ufał sternikowi i właścicielowi statku niż temu, co mówił Paweł."
"Dz27,12": "A ponieważ żaden port nie nadawał się do przezimowania, większość postanowiła stamtąd odpłynąć, dostać się jakoś na przezimowanie do portu Feniks na Krecie, otwartego na południowo-zachodnią i północno-zachodnią stronę."
"Dz27,13": "A gdy powiał wiatr z południa, sądzili, że zamiar doprowadzą do skutku, i odbili od brzegu, i popłynęli wzdłuż Krety."
"Dz27,14": "Lecz niedługo potem uderzył na nią gwałtowny wiatr, zwany Eurokludon."
"Dz27,15": "Kiedy statek został porwany i nie mógł stawić czoła wiatrowi, puściliśmy go z wiatrem i pozwoliliśmy się unosić."
"Dz27,16": "Gdy płynęliśmy wzdłuż pewnej wysepki, zwanej Klauda, z trudem zdołaliśmy uchwycić łódź ratunkową."
"Dz27,17": "Po wyciągnięciu jej przepasali statek, używając sprzętu pomocniczego. Z obawy, żeby nie wpaść na płyciznę, opuścili żagle i tak ich niosło."
"Dz27,18": "Ponieważ miotała nami gwałtowna burza, nazajutrz wyrzucili ładunek."
"Dz27,19": "A trzeciego dnia własnymi rękami wyrzuciliśmy osprzęt statku."
"Dz27,20": "Lecz kiedy przez wiele dni nie pokazało się ani słońce, ani gwiazdy, a niemała nawałnica napierała, znikła już wszelka nadzieja naszego ocalenia."
"Dz27,21": "Gdy ludzie już długo nic nie jedli, Paweł stanął pośród nich i powiedział: Panowie, trzeba było mnie posłuchać i nie odpływać od Krety, wtedy uniknęlibyście straty i szkody."
"Dz27,22": "Lecz teraz zachęcam was, abyście byli dobrej myśli, bo nikt z was nie zginie, tylko statek."
"Dz27,23": "Tej nocy bowiem stanął przy mnie anioł Boga, do którego należę i któremu służę;"
"Dz27,24": "I powiedział: Nie bój się, Pawle, musisz stanąć przed cesarzem, a oto Bóg darował ci wszystkich, którzy z tobą płyną."
"Dz27,25": "Dlatego bądźcie dobrej myśli, panowie, bo wierzę Bogu, że będzie tak, jak mi powiedziano."
"Dz27,26": "Musimy jednak być wyrzuceni na jakąś wyspę."
"Dz27,27": "A gdy nadeszła czternasta noc, a nas rzucało po Adriatyku, około północy zdawało się żeglarzom, że zbliżają się do jakiegoś lądu."
"Dz27,28": "Wtedy spuścili sondę i stwierdzili dwadzieścia sążni. Popłynąwszy nieco dalej, znowu spuścili sondę i stwierdzili piętnaście sążni."
"Dz27,29": "Bojąc się, abyśmy nie wpadli na skały, zrzucili z rufy cztery kotwice i z upragnieniem oczekiwali świtu."
"Dz27,30": "A gdy żeglarze postanowili uciec ze statku, spuścili łódź ratunkową pod pozorem zrzucenia kotwic z dziobu statku;"
"Dz27,31": "Paweł powiedział do setnika i żołnierzy: Jeśli ci nie zostaną na statku, nie będziecie mogli zostać ocaleni."
"Dz27,32": "Wtedy żołnierze odcięli liny od łodzi ratunkowej i pozwolili jej spaść."
"Dz27,33": "Kiedy zaczynało świtać, Paweł zachęcał wszystkich do posiłku: Dziś już czternasty dzień, jak trwacie w oczekiwaniu bez posiłku, nic nie jedząc."
"Dz27,34": "Dlatego proszę was, abyście się posilili, bo to przyczyni się do waszego ocalenia, gdyż żadnemu z was włos z głowy nie spadnie."
"Dz27,35": "A to powiedziawszy, wziął chleb i podziękował Bogu wobec wszystkich, a gdy złamał, zaczął jeść."
"Dz27,36": "Wtedy wszyscy nabrali otuchy i posilili się."
"Dz27,37": "A nas wszystkich na statku było dwieście siedemdziesiąt sześć dusz."
"Dz27,38": "Kiedy się najedli, odciążyli statek, wyrzucając zboże do morza."
"Dz27,39": "Gdy nastał dzień, nie rozpoznali lądu, jednak zobaczyli jakąś zatokę o płaskim wybrzeżu, do którego postanowili, jeśli będzie można, przybić statkiem."
"Dz27,40": "Wyciągnąwszy więc kotwice, puścili się na morze. Poluzowali wiązania sterowe, nastawili przedni żagiel pod wiatr i zmierzali do brzegu."
"Dz27,41": "Wpadli jednak na mieliznę utworzoną między dwoma prądami i osiedli ze statkiem. Dziób statku się zarył, ale rufa zaczęła się rozbijać pod naporem fal."
"Dz27,42": "Wtedy żołnierze postanowili, że zabiją więźniów, aby żaden z nich nie odpłynął i nie uciekł."
"Dz27,43": "Lecz setnik, chcąc ocalić Pawła, powstrzymał ich od tego zamiaru. Potem rozkazał, aby ci, którzy umieją pływać, skoczyli pierwsi do morza i wyszli na brzeg;"
"Dz27,44": "Pozostali zaś na deskach lub częściach statku. I w ten sposób wszyscy cało wyszli na ląd."
