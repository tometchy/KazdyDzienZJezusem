"Dz19,1": "I stało się, że gdy Apollos przebywał w Koryncie, Paweł obszedł okolice wyżej położone i dotarł do Efezu. I znalazłszy tam niektórych uczniów;"
"Dz19,2": "Zapytał ich: Czy otrzymaliście Ducha Świętego, kiedy uwierzyliście? A oni mu odpowiedzieli: Nawet nie słyszeliśmy, że jest Duch Święty."
"Dz19,3": "Wtedy zapytał ich: W czym więc byliście ochrzczeni? A oni odpowiedzieli: W chrzcie Jana."
"Dz19,4": "Paweł zaś powiedział: Jan chrzcił chrztem pokuty, mówiąc ludziom, aby uwierzyli w tego, który przyjdzie po nim, to znaczy w Jezusa Chrystusa."
"Dz19,5": "Gdy to usłyszeli, zostali ochrzczeni w imię Pana Jezusa."
"Dz19,6": "A kiedy Paweł położył na nich ręce, zstąpił na nich Duch Święty i mówili językami, i prorokowali."
"Dz19,7": "Wszystkich mężczyzn było około dwunastu."
"Dz19,8": "Potem przez trzy miesiące przychodził do synagogi i odważnie mówił, rozprawiając i przekonując o królestwie Bożym."
"Dz19,9": "Gdy jednak niektórzy się upierali i nie chcieli uwierzyć, i mówili źle o tej drodze wobec tłumów, odstąpił od nich, odłączył uczniów i codziennie rozprawiał w szkole niejakiego Tyrannosa."
"Dz19,10": "Działo się tak przez dwa lata, tak że wszyscy mieszkańcy Azji usłyszeli słowo Pana Jezusa, zarówno Żydzi, jak i Grecy."
"Dz19,11": "A Bóg dokonywał niezwykłych cudów przez ręce Pawła;"
"Dz19,12": "Tak że nawet chustki albo przepaski z jego ciała kładziono na chorych, a choroby ich opuszczały i wychodziły z nich złe duchy."
"Dz19,13": "A niektórzy wędrowni żydowscy egzorcyści ważyli się wzywać imienia Pana Jezusa nad opętanymi przez złe duchy, mówiąc: Zaklinamy was przez Jezusa, którego głosi Paweł."
"Dz19,14": "Robiło tak siedmiu synów pewnego Żyda, imieniem Skewas, który był naczelnikiem kapłanów."
"Dz19,15": "Zły duch im odpowiedział: Znam Jezusa i wiem, kim jest Paweł, ale wy coście za jedni?"
"Dz19,16": "I rzucił się na nich człowiek, w którym był zły duch, powalił i pokonał ich, tak że nadzy i zranieni wybiegli z tego domu."
"Dz19,17": "Dowiedzieli się o tym wszyscy, zarówno Żydzi, jak i Grecy, którzy mieszkali w Efezie. A na nich wszystkich padł strach i było uwielbione imię Pana Jezusa."
"Dz19,18": "Wielu też tych, którzy uwierzyli, przychodziło i wyznawało, i ujawniało swoje uczynki."
"Dz19,19": "I wielu z tych, którzy się zajmowali sztukami magicznymi, znosiło księgi i paliło je wobec wszystkich. Obliczono ich wartość i stwierdzono, że wynosi pięćdziesiąt tysięcy srebrników."
"Dz19,20": "Tak potężnie rosło i umacniało się słowo Pańskie."
"Dz19,21": "Po tych wydarzeniach Paweł postanowił w duchu, że po przejściu Macedonii i Achai pójdzie do Jerozolimy, mówiąc: Potem, gdy się tam dostanę, muszę zobaczyć także Rzym."
"Dz19,22": "Wysłał więc do Macedonii dwóch z tych, którzy mu służyli, Tymoteusza i Erasta, a sam pozostał jeszcze przez jakiś czas w Azji."
"Dz19,23": "W tym czasie doszło do niemałych rozruchów z powodu tej drogi."
"Dz19,24": "Bo pewien złotnik, imieniem Demetriusz, który wyrabiał ze srebra świątyńki Diany, zapewniał rzemieślnikom niemały zarobek."
"Dz19,25": "Zebrał ich i innych, zajmujących się podobnym rzemiosłem, i powiedział: Mężowie, wiecie, że nasz dobrobyt płynie z tego rzemiosła."
"Dz19,26": "Widzicie też i słyszycie, że ten Paweł nie tylko w Efezie, ale prawie w całej Azji przekonał i odwiódł wielu ludzi, mówiąc, że nie są bogami ci, którzy rękami ludzkimi są uczynieni."
"Dz19,27": "Należy więc obawiać się nie tylko tego, że nasze rzemiosło zostanie zlekceważone, ale też że świątynia wielkiej bogini Diany, czczonej w całej Azji i w całym świecie, zostanie poczytana za nic i zostanie zniszczony jej majestat."
"Dz19,28": "Gdy to usłyszeli, ogarnął ich gniew i zaczęli krzyczeć: Wielka jest Diana Efeska!"
"Dz19,29": "I całe miasto napełniło się wrzawą. Porwawszy Gajusa i Arystarcha, Macedończyków, towarzyszy podróży Pawła, jednomyślnie ruszyli do teatru."
"Dz19,30": "Gdy Paweł chciał wejść między lud, uczniowie mu nie pozwolili."
"Dz19,31": "Również niektórzy dostojnicy Azji, będący jego przyjaciółmi, posłali do niego z prośbą, aby nie wchodził do teatru."
"Dz19,32": "Tymczasem jedni krzyczeli tak, a drudzy inaczej. W zgromadzeniu bowiem zapanował zamęt, a większość z nich nie wiedziała, po co się zebrali."
"Dz19,33": "Z tłumu wyciągnięto Aleksandra, którego Żydzi wysunęli do przodu. Aleksander dał znak ręką, bo chciał zdać sprawę ludowi."
"Dz19,34": "Gdy jednak poznali, że jest Żydem, rozległ się jeden krzyk i wszyscy wołali przez około dwie godziny: Wielka jest Diana Efeska!"
"Dz19,35": "Wtedy sekretarz miejski uspokoił tłum i powiedział: Mężowie efescy, kto z ludzi nie wie, że miasto Efez jest opiekunem świątyni wielkiej bogini Diany i jej posągu, który spadł od Jowisza?"
"Dz19,36": "Skoro nikt temu nie może zaprzeczyć, powinniście się uspokoić i niczego nie czynić pochopnie."
"Dz19,37": "Przyprowadziliście bowiem tych ludzi, którzy nie są ani świętokradcami, ani też nie bluźnią waszej bogini."
"Dz19,38": "A jeśli Demetriusz i rzemieślnicy, którzy są z nim, mają coś przeciwko komuś, są przecież sądy, są też prokonsulowie, niech pozywają jedni drugich."
"Dz19,39": "Jeśli zaś chodzi o coś innego, zostanie to rozpatrzone na prawomocnym zebraniu."
"Dz19,40": "Grozi nam bowiem oskarżenie o dzisiejsze rozruchy, bo nie ma żadnego powodu, którym moglibyśmy wytłumaczyć to zbiegowisko."
"Dz19,41": "Po tych słowach rozwiązał zebranie."
