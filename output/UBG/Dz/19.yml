"Dz19,1":
  text: "I stało się, że gdy Apollos przebywał w Koryncie, Paweł obszedł okolice wyżej położone i dotarł do Efezu. I znalazłszy tam niektórych uczniów;"
  tags: []
"Dz19,2":
  text: "Zapytał ich: Czy otrzymaliście Ducha Świętego, kiedy uwierzyliście? A oni mu odpowiedzieli: Nawet nie słyszeliśmy, że jest Duch Święty."
  tags: []
"Dz19,3":
  text: "Wtedy zapytał ich: W czym więc byliście ochrzczeni? A oni odpowiedzieli: W chrzcie Jana."
  tags: []
"Dz19,4":
  text: "Paweł zaś powiedział: Jan chrzcił chrztem pokuty, mówiąc ludziom, aby uwierzyli w tego, który przyjdzie po nim, to znaczy w Jezusa Chrystusa."
  tags: []
"Dz19,5":
  text: "Gdy to usłyszeli, zostali ochrzczeni w imię Pana Jezusa."
  tags: []
"Dz19,6":
  text: "A kiedy Paweł położył na nich ręce, zstąpił na nich Duch Święty i mówili językami, i prorokowali."
  tags: []
"Dz19,7":
  text: "Wszystkich mężczyzn było około dwunastu."
  tags: []
"Dz19,8":
  text: "Potem przez trzy miesiące przychodził do synagogi i odważnie mówił, rozprawiając i przekonując o królestwie Bożym."
  tags: []
"Dz19,9":
  text: "Gdy jednak niektórzy się upierali i nie chcieli uwierzyć, i mówili źle o tej drodze wobec tłumów, odstąpił od nich, odłączył uczniów i codziennie rozprawiał w szkole niejakiego Tyrannosa."
  tags: []
"Dz19,10":
  text: "Działo się tak przez dwa lata, tak że wszyscy mieszkańcy Azji usłyszeli słowo Pana Jezusa, zarówno Żydzi, jak i Grecy."
  tags: []
"Dz19,11":
  text: "A Bóg dokonywał niezwykłych cudów przez ręce Pawła;"
  tags: []
"Dz19,12":
  text: "Tak że nawet chustki albo przepaski z jego ciała kładziono na chorych, a choroby ich opuszczały i wychodziły z nich złe duchy."
  tags: []
"Dz19,13":
  text: "A niektórzy wędrowni żydowscy egzorcyści ważyli się wzywać imienia Pana Jezusa nad opętanymi przez złe duchy, mówiąc: Zaklinamy was przez Jezusa, którego głosi Paweł."
  tags: []
"Dz19,14":
  text: "Robiło tak siedmiu synów pewnego Żyda, imieniem Skewas, który był naczelnikiem kapłanów."
  tags: []
"Dz19,15":
  text: "Zły duch im odpowiedział: Znam Jezusa i wiem, kim jest Paweł, ale wy coście za jedni?"
  tags: []
"Dz19,16":
  text: "I rzucił się na nich człowiek, w którym był zły duch, powalił i pokonał ich, tak że nadzy i zranieni wybiegli z tego domu."
  tags: []
"Dz19,17":
  text: "Dowiedzieli się o tym wszyscy, zarówno Żydzi, jak i Grecy, którzy mieszkali w Efezie. A na nich wszystkich padł strach i było uwielbione imię Pana Jezusa."
  tags: []
"Dz19,18":
  text: "Wielu też tych, którzy uwierzyli, przychodziło i wyznawało, i ujawniało swoje uczynki."
  tags: []
"Dz19,19":
  text: "I wielu z tych, którzy się zajmowali sztukami magicznymi, znosiło księgi i paliło je wobec wszystkich. Obliczono ich wartość i stwierdzono, że wynosi pięćdziesiąt tysięcy srebrników."
  tags: []
"Dz19,20":
  text: "Tak potężnie rosło i umacniało się słowo Pańskie."
  tags: []
"Dz19,21":
  text: "Po tych wydarzeniach Paweł postanowił w duchu, że po przejściu Macedonii i Achai pójdzie do Jerozolimy, mówiąc: Potem, gdy się tam dostanę, muszę zobaczyć także Rzym."
  tags: []
"Dz19,22":
  text: "Wysłał więc do Macedonii dwóch z tych, którzy mu służyli, Tymoteusza i Erasta, a sam pozostał jeszcze przez jakiś czas w Azji."
  tags: []
"Dz19,23":
  text: "W tym czasie doszło do niemałych rozruchów z powodu tej drogi."
  tags: []
"Dz19,24":
  text: "Bo pewien złotnik, imieniem Demetriusz, który wyrabiał ze srebra świątyńki Diany, zapewniał rzemieślnikom niemały zarobek."
  tags: []
"Dz19,25":
  text: "Zebrał ich i innych, zajmujących się podobnym rzemiosłem, i powiedział: Mężowie, wiecie, że nasz dobrobyt płynie z tego rzemiosła."
  tags: []
"Dz19,26":
  text: "Widzicie też i słyszycie, że ten Paweł nie tylko w Efezie, ale prawie w całej Azji przekonał i odwiódł wielu ludzi, mówiąc, że nie są bogami ci, którzy rękami ludzkimi są uczynieni."
  tags: []
"Dz19,27":
  text: "Należy więc obawiać się nie tylko tego, że nasze rzemiosło zostanie zlekceważone, ale też że świątynia wielkiej bogini Diany, czczonej w całej Azji i w całym świecie, zostanie poczytana za nic i zostanie zniszczony jej majestat."
  tags: []
"Dz19,28":
  text: "Gdy to usłyszeli, ogarnął ich gniew i zaczęli krzyczeć: Wielka jest Diana Efeska!"
  tags: []
"Dz19,29":
  text: "I całe miasto napełniło się wrzawą. Porwawszy Gajusa i Arystarcha, Macedończyków, towarzyszy podróży Pawła, jednomyślnie ruszyli do teatru."
  tags: []
"Dz19,30":
  text: "Gdy Paweł chciał wejść między lud, uczniowie mu nie pozwolili."
  tags: []
"Dz19,31":
  text: "Również niektórzy dostojnicy Azji, będący jego przyjaciółmi, posłali do niego z prośbą, aby nie wchodził do teatru."
  tags: []
"Dz19,32":
  text: "Tymczasem jedni krzyczeli tak, a drudzy inaczej. W zgromadzeniu bowiem zapanował zamęt, a większość z nich nie wiedziała, po co się zebrali."
  tags: []
"Dz19,33":
  text: "Z tłumu wyciągnięto Aleksandra, którego Żydzi wysunęli do przodu. Aleksander dał znak ręką, bo chciał zdać sprawę ludowi."
  tags: []
"Dz19,34":
  text: "Gdy jednak poznali, że jest Żydem, rozległ się jeden krzyk i wszyscy wołali przez około dwie godziny: Wielka jest Diana Efeska!"
  tags: []
"Dz19,35":
  text: "Wtedy sekretarz miejski uspokoił tłum i powiedział: Mężowie efescy, kto z ludzi nie wie, że miasto Efez jest opiekunem świątyni wielkiej bogini Diany i jej posągu, który spadł od Jowisza?"
  tags: []
"Dz19,36":
  text: "Skoro nikt temu nie może zaprzeczyć, powinniście się uspokoić i niczego nie czynić pochopnie."
  tags: []
"Dz19,37":
  text: "Przyprowadziliście bowiem tych ludzi, którzy nie są ani świętokradcami, ani też nie bluźnią waszej bogini."
  tags: []
"Dz19,38":
  text: "A jeśli Demetriusz i rzemieślnicy, którzy są z nim, mają coś przeciwko komuś, są przecież sądy, są też prokonsulowie, niech pozywają jedni drugich."
  tags: []
"Dz19,39":
  text: "Jeśli zaś chodzi o coś innego, zostanie to rozpatrzone na prawomocnym zebraniu."
  tags: []
"Dz19,40":
  text: "Grozi nam bowiem oskarżenie o dzisiejsze rozruchy, bo nie ma żadnego powodu, którym moglibyśmy wytłumaczyć to zbiegowisko."
  tags: []
"Dz19,41":
  text: "Po tych słowach rozwiązał zebranie."
  tags: []
