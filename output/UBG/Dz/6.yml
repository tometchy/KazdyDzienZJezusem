"Dz6,1": "A w tych dniach, gdy liczba uczniów wzrastała, helleniści zaczęli szemrać przeciwko Żydom, że zaniedbywano w codziennym posługiwaniu ich wdowy."
"Dz6,2": "Wtedy dwunastu, zwoławszy całe mnóstwo uczniów, powiedziało: Nie jest rzeczą słuszną, żebyśmy porzucili słowo Boże, a obsługiwali stoły."
"Dz6,3": "Upatrzcie więc, bracia, spośród siebie siedmiu mężczyzn, mających dobre świadectwo, pełnych Ducha Świętego i mądrości, którym zlecimy tę sprawę."
"Dz6,4": "My zaś oddamy się modlitwie i posłudze słowa."
"Dz6,5": "I spodobało się to całej gromadzie zebranych. Wybrali więc Szczepana, męża pełnego wiary i Ducha Świętego, Filipa, Prochora, Nikanora, Tymona, Parmenasa i Mikołaja, prozelitę z Antiochii."
"Dz6,6": "Przedstawili ich apostołom, którzy modląc się, położyli na nich ręce."
"Dz6,7": "I rozszerzało się słowo Boże, i liczba uczniów w Jerozolimie bardzo się pomnażała; także bardzo wielu kapłanów stawało się posłusznych wierze."
"Dz6,8": "A Szczepan, pełen wiary i mocy, czynił cuda i wielkie znaki wśród ludzi."
"Dz6,9": "Wtedy niektórzy z synagogi zwanej synagogą Libertynów i Cyrenejczyków, i Aleksandryjczyków oraz tych, którzy pochodzili z Cylicji i Azji, wystąpili do rozprawy ze Szczepanem."
"Dz6,10": "Lecz nie mogli sprostać mądrości i duchowi, z którym mówił."
"Dz6,11": "Podstawili więc ludzi, którzy zeznali: Słyszeliśmy, jak mówił bluźnierstwa przeciwko Mojżeszowi i przeciwko Bogu."
"Dz6,12": "I tak podburzyli lud, starszych i uczonych w Piśmie; a gdy przybiegli do niego, porwali go i przyprowadzili do Rady."
"Dz6,13": "I podstawili fałszywych świadków, którzy zeznali: Ten człowiek nie przestaje mówić bluźnierstw przeciwko temu świętemu miejscu i przeciwko prawu."
"Dz6,14": "Słyszeliśmy bowiem, jak mówił, że ten Jezus z Nazaretu zburzy to miejsce i zmieni zwyczaje, które nam przekazał Mojżesz."
"Dz6,15": "A wszyscy, którzy zasiadali w Radzie, przyglądali mu się uważnie i zobaczyli, że jego twarz jest jak oblicze anioła."
