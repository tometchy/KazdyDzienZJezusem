"Dz6,1":
  text: "A w tych dniach, gdy liczba uczniów wzrastała, helleniści zaczęli szemrać przeciwko Żydom, że zaniedbywano w codziennym posługiwaniu ich wdowy."
  tags: []
"Dz6,2":
  text: "Wtedy dwunastu, zwoławszy całe mnóstwo uczniów, powiedziało: Nie jest rzeczą słuszną, żebyśmy porzucili słowo Boże, a obsługiwali stoły."
  tags: []
"Dz6,3":
  text: "Upatrzcie więc, bracia, spośród siebie siedmiu mężczyzn, mających dobre świadectwo, pełnych Ducha Świętego i mądrości, którym zlecimy tę sprawę."
  tags: []
"Dz6,4":
  text: "My zaś oddamy się modlitwie i posłudze słowa."
  tags: []
"Dz6,5":
  text: "I spodobało się to całej gromadzie zebranych. Wybrali więc Szczepana, męża pełnego wiary i Ducha Świętego, Filipa, Prochora, Nikanora, Tymona, Parmenasa i Mikołaja, prozelitę z Antiochii."
  tags: []
"Dz6,6":
  text: "Przedstawili ich apostołom, którzy modląc się, położyli na nich ręce."
  tags: []
"Dz6,7":
  text: "I rozszerzało się słowo Boże, i liczba uczniów w Jerozolimie bardzo się pomnażała; także bardzo wielu kapłanów stawało się posłusznych wierze."
  tags: []
"Dz6,8":
  text: "A Szczepan, pełen wiary i mocy, czynił cuda i wielkie znaki wśród ludzi."
  tags: []
"Dz6,9":
  text: "Wtedy niektórzy z synagogi zwanej synagogą Libertynów i Cyrenejczyków, i Aleksandryjczyków oraz tych, którzy pochodzili z Cylicji i Azji, wystąpili do rozprawy ze Szczepanem."
  tags: []
"Dz6,10":
  text: "Lecz nie mogli sprostać mądrości i duchowi, z którym mówił."
  tags: []
"Dz6,11":
  text: "Podstawili więc ludzi, którzy zeznali: Słyszeliśmy, jak mówił bluźnierstwa przeciwko Mojżeszowi i przeciwko Bogu."
  tags: []
"Dz6,12":
  text: "I tak podburzyli lud, starszych i uczonych w Piśmie; a gdy przybiegli do niego, porwali go i przyprowadzili do Rady."
  tags: []
"Dz6,13":
  text: "I podstawili fałszywych świadków, którzy zeznali: Ten człowiek nie przestaje mówić bluźnierstw przeciwko temu świętemu miejscu i przeciwko prawu."
  tags: []
"Dz6,14":
  text: "Słyszeliśmy bowiem, jak mówił, że ten Jezus z Nazaretu zburzy to miejsce i zmieni zwyczaje, które nam przekazał Mojżesz."
  tags: []
"Dz6,15":
  text: "A wszyscy, którzy zasiadali w Radzie, przyglądali mu się uważnie i zobaczyli, że jego twarz jest jak oblicze anioła."
  tags: []
