"Dz7,1": "Wtedy najwyższy kapłan zapytał: Czy tak się sprawy mają?"
"Dz7,2": "A on odpowiedział: Mężowie bracia i ojcowie, słuchajcie! Bóg chwały ukazał się naszemu ojcu Abrahamowi, gdy był w Mezopotamii, zanim zamieszkał w Charanie."
"Dz7,3": "I powiedział do niego: Opuść swoją ziemię i swoją rodzinę i idź do ziemi, którą ci wskażę."
"Dz7,4": "Wtedy wyszedł z ziemi chaldejskiej i zamieszkał w Charanie. A stamtąd, gdy umarł jego ojciec, Bóg przeniósł go do tej ziemi, w której wy teraz mieszkacie."
"Dz7,5": "I nie dał mu w niej dziedzictwa nawet na stopę jego nogi. Obiecał tylko, że da ją w posiadanie jemu i jego potomstwu po nim, gdy jeszcze nie miał dziecka."
"Dz7,6": "I tak mu Bóg powiedział: Twoje potomstwo będzie przebywać w obcej ziemi, wezmą je w niewolę i będą je uciskać przez czterysta lat."
"Dz7,7": "Lecz ten naród, u którego będzie w niewoli, ja będę sądził – powiedział Bóg. A potem wyjdą i będą mi służyć na tym miejscu."
"Dz7,8": "I zawarł z nim przymierze obrzezania. Tak to Abraham spłodził Izaaka i obrzezał go ósmego dnia, a Izaak Jakuba, a Jakub dwunastu patriarchów."
"Dz7,9": "A patriarchowie z zawiści sprzedali Józefa do Egiptu. Lecz Bóg był z nim."
"Dz7,10": "I wyrwał go ze wszystkich jego utrapień, i dał mu łaskę i mądrość w oczach faraona, króla Egiptu, który ustanowił go przełożonym nad Egiptem i nad całym swoim domem."
"Dz7,11": "Potem nastał głód i wielka niedola w całej ziemi Egiptu i Kanaan, a nasi ojcowie nie znajdowali żywności."
"Dz7,12": "A gdy Jakub usłyszał, że w Egipcie jest zboże, wysłał naszych ojców pierwszy raz."
"Dz7,13": "A za drugim razem Józef dał się poznać swoim braciom i faraon dowiedział się o rodzie Józefa."
"Dz7,14": "Potem Józef posłał po swego ojca Jakuba i całą swoją rodzinę liczącą siedemdziesiąt pięć dusz."
"Dz7,15": "Jakub przybył do Egiptu i tam umarł on sam i nasi ojcowie."
"Dz7,16": "I zostali przeniesieni do Sychem i złożeni w grobie, który Abraham kupił za pieniądze u synów Chamora, ojca Sychema."
"Dz7,17": "A gdy zbliżył się czas obietnicy, którą Bóg złożył Abrahamowi, lud w Egipcie rozrodził się i rozmnożył;"
"Dz7,18": "Aż nastał inny król, który nie znał Józefa."
"Dz7,19": "Ten, działając podstępnie wobec naszego narodu, uciskał naszych ojców tak, że musieli porzucać swoje niemowlęta, żeby nie zostawały przy życiu."
"Dz7,20": "W tym czasie urodził się Mojżesz, a był miły Bogu i wychowywano go przez trzy miesiące w domu jego ojca."
"Dz7,21": "A gdy go porzucono, wzięła go córka faraona i wychowała go jak syna."
"Dz7,22": "I wyuczono Mojżesza całej mądrości egipskiej, i był potężny w słowach i czynach."
"Dz7,23": "A gdy miał czterdzieści lat, przyszło mu na myśl odwiedzić swych braci, synów Izraela."
"Dz7,24": "A kiedy zobaczył, że jednemu z nich wyrządzano krzywdę, ujął się za nim i pomścił skrzywdzonego, zabijając Egipcjanina."
"Dz7,25": "Sądził bowiem, że jego bracia zrozumieją, że Bóg przez jego ręce daje im wybawienie. Lecz oni nie zrozumieli."
"Dz7,26": "Następnego dnia zjawił się wśród nich, gdy się ze sobą bili, i próbował ich pogodzić, mówiąc: Ludzie, jesteście braćmi, dlaczego krzywdzicie jeden drugiego?"
"Dz7,27": "Lecz ten, który krzywdził bliźniego, odepchnął go, mówiąc: Kto cię ustanowił wodzem i sędzią nad nami?"
"Dz7,28": "Czy chcesz mnie zabić, tak jak wczoraj zabiłeś Egipcjanina?"
"Dz7,29": "Na te słowa Mojżesz uciekł i był cudzoziemcem w ziemi Madian, gdzie spłodził dwóch synów."
"Dz7,30": "Po czterdziestu latach ukazał mu się na pustyni góry Synaj anioł Pana w płomieniu ognia w krzaku."
"Dz7,31": "Kiedy Mojżesz to ujrzał, zdziwił się na ten widok. A gdy podszedł, aby się temu przyjrzeć, rozległ się głos Pana:"
"Dz7,32": "Ja jestem Bogiem twoich ojców, Bogiem Abrahama, Bogiem Izaaka i Bogiem Jakuba. A Mojżesz zadrżał i nie śmiał się przypatrywać."
"Dz7,33": "Wtedy Pan powiedział do niego: Zdejmij z nóg obuwie, bo miejsce, na którym stoisz, jest ziemią świętą."
"Dz7,34": "Patrząc, widziałem utrapienie mego ludu, który jest w Egipcie, i słyszałem jego wzdychanie, i zstąpiłem, żeby go wybawić. Dlatego teraz chodź, poślę cię do Egiptu."
"Dz7,35": "Tego Mojżesza, którego się wyparli, mówiąc: Któż cię ustanowił wodzem i sędzią? – tego Bóg posłał jako wodza i wybawiciela przez rękę anioła, który mu się ukazał w krzaku."
"Dz7,36": "On wyprowadził ich, czyniąc cuda i znaki w ziemi Egiptu, nad Morzem Czerwonym i na pustyni przez czterdzieści lat."
"Dz7,37": "To jest ten Mojżesz, który powiedział synom Izraela: Proroka jak ja wzbudzi wam Pan, wasz Bóg, spośród waszych braci. Jego będziecie słuchać."
"Dz7,38": "On to był w zgromadzeniu na pustyni z aniołem, który mówił do niego na górze Synaj i z naszymi ojcami. On przyjął żywe słowa, aby nam je przekazać."
"Dz7,39": "Lecz nasi ojcowie nie chcieli mu być posłuszni, ale odepchnęli go i zwrócili swoje serca ku Egiptowi."
"Dz7,40": "Powiedzieli do Aarona: Zrób nam bogów, którzy będą szli przed nami, bo nie wiemy, co się stało z tym Mojżeszem, który nas wyprowadził z ziemi Egiptu."
"Dz7,41": "I zrobili cielca w tych dniach, i złożyli ofiarę temu bożkowi, i cieszyli się dziełami swoich rąk."
"Dz7,42": "Wtedy Bóg odwrócił się od nich i oddał ich w służbę zastępom nieba, jak jest napisane w księdze proroków: Czy mi składaliście zabite zwierzęta i inne ofiary na pustyni przez czterdzieści lat, domu Izraela?"
"Dz7,43": "Raczej obnosiliście namiot Molocha i gwiazdę waszego boga Remfana, wizerunki, które sobie zrobiliście, żeby oddawać im cześć. Dlatego zaprowadzę was poza Babilon."
"Dz7,44": "Nasi ojcowie mieli na pustyni Namiot Świadectwa, jak zarządził ten, który powiedział Mojżeszowi, aby go uczynił według wzoru, który widział."
"Dz7,45": "Nasi ojcowie z Jozuem wzięli go i wnieśli do posiadłości pogan, których Bóg wypędził sprzed oblicza naszych ojców, aż do dni Dawida;"
"Dz7,46": "Który znalazł łaskę przed Bogiem i prosił, aby mógł znaleźć przybytek dla Boga Jakuba."
"Dz7,47": "Lecz Salomon zbudował mu dom."
"Dz7,48": "Najwyższy jednak nie mieszka w świątyniach uczynionych ręką, jak mówi prorok:"
"Dz7,49": "Niebo jest moim tronem, a ziemia podnóżkiem moich stóp. Jakiż dom mi zbudujecie, mówi Pan, albo gdzie jest miejsce mego odpoczynku?"
"Dz7,50": "Czy tego wszystkiego nie uczyniła moja ręka?"
"Dz7,51": "Ludzie twardego karku, nieobrzezanego serca i uszu! Wy zawsze sprzeciwiacie się Duchowi Świętemu. Jak wasi ojcowie, tak i wy!"
"Dz7,52": "Którego z proroków nie prześladowali wasi ojcowie? Pozabijali też tych, którzy przepowiadali przyjście Sprawiedliwego, którego wy staliście się teraz zdrajcami i mordercami."
"Dz7,53": "Wy, którzy otrzymaliście prawo przez rozporządzenie aniołów, lecz nie przestrzegaliście go."
"Dz7,54": "Gdy to usłyszeli, wpadli w gniew i zgrzytali na niego zębami."
"Dz7,55": "A on, pełen Ducha Świętego, patrzył uważnie w niebo i ujrzał chwałę Boga i Jezusa stojącego po prawicy Boga."
"Dz7,56": "I powiedział: Oto widzę niebiosa otwarte i Syna Człowieczego stojącego po prawicy Boga."
"Dz7,57": "A oni podnieśli wielki krzyk, zatkali sobie uszy i jednomyślnie się na niego rzucili."
"Dz7,58": "Wyrzucili go poza miasto i kamienowali, a świadkowie złożyli swoje szaty u stóp młodzieńca zwanego Saulem."
"Dz7,59": "Tak kamienowali Szczepana, modlącego się tymi słowy: Panie Jezu, przyjmij mojego ducha."
"Dz7,60": "A upadłszy na kolana, zawołał donośnym głosem: Panie, nie poczytaj im tego za grzech. A gdy to powiedział, zasnął."
