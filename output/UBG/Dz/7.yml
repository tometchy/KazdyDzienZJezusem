"Dz7,1":
  text: "Wtedy najwyższy kapłan zapytał: Czy tak się sprawy mają?"
  tags: []
"Dz7,2":
  text: "A on odpowiedział: Mężowie bracia i ojcowie, słuchajcie! Bóg chwały ukazał się naszemu ojcu Abrahamowi, gdy był w Mezopotamii, zanim zamieszkał w Charanie."
  tags: []
"Dz7,3":
  text: "I powiedział do niego: Opuść swoją ziemię i swoją rodzinę i idź do ziemi, którą ci wskażę."
  tags: []
"Dz7,4":
  text: "Wtedy wyszedł z ziemi chaldejskiej i zamieszkał w Charanie. A stamtąd, gdy umarł jego ojciec, Bóg przeniósł go do tej ziemi, w której wy teraz mieszkacie."
  tags: []
"Dz7,5":
  text: "I nie dał mu w niej dziedzictwa nawet na stopę jego nogi. Obiecał tylko, że da ją w posiadanie jemu i jego potomstwu po nim, gdy jeszcze nie miał dziecka."
  tags: []
"Dz7,6":
  text: "I tak mu Bóg powiedział: Twoje potomstwo będzie przebywać w obcej ziemi, wezmą je w niewolę i będą je uciskać przez czterysta lat."
  tags: []
"Dz7,7":
  text: "Lecz ten naród, u którego będzie w niewoli, ja będę sądził – powiedział Bóg. A potem wyjdą i będą mi służyć na tym miejscu."
  tags: []
"Dz7,8":
  text: "I zawarł z nim przymierze obrzezania. Tak to Abraham spłodził Izaaka i obrzezał go ósmego dnia, a Izaak Jakuba, a Jakub dwunastu patriarchów."
  tags: []
"Dz7,9":
  text: "A patriarchowie z zawiści sprzedali Józefa do Egiptu. Lecz Bóg był z nim."
  tags: []
"Dz7,10":
  text: "I wyrwał go ze wszystkich jego utrapień, i dał mu łaskę i mądrość w oczach faraona, króla Egiptu, który ustanowił go przełożonym nad Egiptem i nad całym swoim domem."
  tags: []
"Dz7,11":
  text: "Potem nastał głód i wielka niedola w całej ziemi Egiptu i Kanaan, a nasi ojcowie nie znajdowali żywności."
  tags: []
"Dz7,12":
  text: "A gdy Jakub usłyszał, że w Egipcie jest zboże, wysłał naszych ojców pierwszy raz."
  tags: []
"Dz7,13":
  text: "A za drugim razem Józef dał się poznać swoim braciom i faraon dowiedział się o rodzie Józefa."
  tags: []
"Dz7,14":
  text: "Potem Józef posłał po swego ojca Jakuba i całą swoją rodzinę liczącą siedemdziesiąt pięć dusz."
  tags: []
"Dz7,15":
  text: "Jakub przybył do Egiptu i tam umarł on sam i nasi ojcowie."
  tags: []
"Dz7,16":
  text: "I zostali przeniesieni do Sychem i złożeni w grobie, który Abraham kupił za pieniądze u synów Chamora, ojca Sychema."
  tags: []
"Dz7,17":
  text: "A gdy zbliżył się czas obietnicy, którą Bóg złożył Abrahamowi, lud w Egipcie rozrodził się i rozmnożył;"
  tags: []
"Dz7,18":
  text: "Aż nastał inny król, który nie znał Józefa."
  tags: []
"Dz7,19":
  text: "Ten, działając podstępnie wobec naszego narodu, uciskał naszych ojców tak, że musieli porzucać swoje niemowlęta, żeby nie zostawały przy życiu."
  tags: []
"Dz7,20":
  text: "W tym czasie urodził się Mojżesz, a był miły Bogu i wychowywano go przez trzy miesiące w domu jego ojca."
  tags: []
"Dz7,21":
  text: "A gdy go porzucono, wzięła go córka faraona i wychowała go jak syna."
  tags: []
"Dz7,22":
  text: "I wyuczono Mojżesza całej mądrości egipskiej, i był potężny w słowach i czynach."
  tags: []
"Dz7,23":
  text: "A gdy miał czterdzieści lat, przyszło mu na myśl odwiedzić swych braci, synów Izraela."
  tags: []
"Dz7,24":
  text: "A kiedy zobaczył, że jednemu z nich wyrządzano krzywdę, ujął się za nim i pomścił skrzywdzonego, zabijając Egipcjanina."
  tags: []
"Dz7,25":
  text: "Sądził bowiem, że jego bracia zrozumieją, że Bóg przez jego ręce daje im wybawienie. Lecz oni nie zrozumieli."
  tags: []
"Dz7,26":
  text: "Następnego dnia zjawił się wśród nich, gdy się ze sobą bili, i próbował ich pogodzić, mówiąc: Ludzie, jesteście braćmi, dlaczego krzywdzicie jeden drugiego?"
  tags: []
"Dz7,27":
  text: "Lecz ten, który krzywdził bliźniego, odepchnął go, mówiąc: Kto cię ustanowił wodzem i sędzią nad nami?"
  tags: []
"Dz7,28":
  text: "Czy chcesz mnie zabić, tak jak wczoraj zabiłeś Egipcjanina?"
  tags: []
"Dz7,29":
  text: "Na te słowa Mojżesz uciekł i był cudzoziemcem w ziemi Madian, gdzie spłodził dwóch synów."
  tags: []
"Dz7,30":
  text: "Po czterdziestu latach ukazał mu się na pustyni góry Synaj anioł Pana w płomieniu ognia w krzaku."
  tags: []
"Dz7,31":
  text: "Kiedy Mojżesz to ujrzał, zdziwił się na ten widok. A gdy podszedł, aby się temu przyjrzeć, rozległ się głos Pana:"
  tags: []
"Dz7,32":
  text: "Ja jestem Bogiem twoich ojców, Bogiem Abrahama, Bogiem Izaaka i Bogiem Jakuba. A Mojżesz zadrżał i nie śmiał się przypatrywać."
  tags: []
"Dz7,33":
  text: "Wtedy Pan powiedział do niego: Zdejmij z nóg obuwie, bo miejsce, na którym stoisz, jest ziemią świętą."
  tags: []
"Dz7,34":
  text: "Patrząc, widziałem utrapienie mego ludu, który jest w Egipcie, i słyszałem jego wzdychanie, i zstąpiłem, żeby go wybawić. Dlatego teraz chodź, poślę cię do Egiptu."
  tags: []
"Dz7,35":
  text: "Tego Mojżesza, którego się wyparli, mówiąc: Któż cię ustanowił wodzem i sędzią? – tego Bóg posłał jako wodza i wybawiciela przez rękę anioła, który mu się ukazał w krzaku."
  tags: []
"Dz7,36":
  text: "On wyprowadził ich, czyniąc cuda i znaki w ziemi Egiptu, nad Morzem Czerwonym i na pustyni przez czterdzieści lat."
  tags: []
"Dz7,37":
  text: "To jest ten Mojżesz, który powiedział synom Izraela: Proroka jak ja wzbudzi wam Pan, wasz Bóg, spośród waszych braci. Jego będziecie słuchać."
  tags: []
"Dz7,38":
  text: "On to był w zgromadzeniu na pustyni z aniołem, który mówił do niego na górze Synaj i z naszymi ojcami. On przyjął żywe słowa, aby nam je przekazać."
  tags: []
"Dz7,39":
  text: "Lecz nasi ojcowie nie chcieli mu być posłuszni, ale odepchnęli go i zwrócili swoje serca ku Egiptowi."
  tags: []
"Dz7,40":
  text: "Powiedzieli do Aarona: Zrób nam bogów, którzy będą szli przed nami, bo nie wiemy, co się stało z tym Mojżeszem, który nas wyprowadził z ziemi Egiptu."
  tags: []
"Dz7,41":
  text: "I zrobili cielca w tych dniach, i złożyli ofiarę temu bożkowi, i cieszyli się dziełami swoich rąk."
  tags: []
"Dz7,42":
  text: "Wtedy Bóg odwrócił się od nich i oddał ich w służbę zastępom nieba, jak jest napisane w księdze proroków: Czy mi składaliście zabite zwierzęta i inne ofiary na pustyni przez czterdzieści lat, domu Izraela?"
  tags: []
"Dz7,43":
  text: "Raczej obnosiliście namiot Molocha i gwiazdę waszego boga Remfana, wizerunki, które sobie zrobiliście, żeby oddawać im cześć. Dlatego zaprowadzę was poza Babilon."
  tags: []
"Dz7,44":
  text: "Nasi ojcowie mieli na pustyni Namiot Świadectwa, jak zarządził ten, który powiedział Mojżeszowi, aby go uczynił według wzoru, który widział."
  tags: []
"Dz7,45":
  text: "Nasi ojcowie z Jozuem wzięli go i wnieśli do posiadłości pogan, których Bóg wypędził sprzed oblicza naszych ojców, aż do dni Dawida;"
  tags: []
"Dz7,46":
  text: "Który znalazł łaskę przed Bogiem i prosił, aby mógł znaleźć przybytek dla Boga Jakuba."
  tags: []
"Dz7,47":
  text: "Lecz Salomon zbudował mu dom."
  tags: []
"Dz7,48":
  text: "Najwyższy jednak nie mieszka w świątyniach uczynionych ręką, jak mówi prorok:"
  tags: []
"Dz7,49":
  text: "Niebo jest moim tronem, a ziemia podnóżkiem moich stóp. Jakiż dom mi zbudujecie, mówi Pan, albo gdzie jest miejsce mego odpoczynku?"
  tags: []
"Dz7,50":
  text: "Czy tego wszystkiego nie uczyniła moja ręka?"
  tags: []
"Dz7,51":
  text: "Ludzie twardego karku, nieobrzezanego serca i uszu! Wy zawsze sprzeciwiacie się Duchowi Świętemu. Jak wasi ojcowie, tak i wy!"
  tags: []
"Dz7,52":
  text: "Którego z proroków nie prześladowali wasi ojcowie? Pozabijali też tych, którzy przepowiadali przyjście Sprawiedliwego, którego wy staliście się teraz zdrajcami i mordercami."
  tags: []
"Dz7,53":
  text: "Wy, którzy otrzymaliście prawo przez rozporządzenie aniołów, lecz nie przestrzegaliście go."
  tags: []
"Dz7,54":
  text: "Gdy to usłyszeli, wpadli w gniew i zgrzytali na niego zębami."
  tags: []
"Dz7,55":
  text: "A on, pełen Ducha Świętego, patrzył uważnie w niebo i ujrzał chwałę Boga i Jezusa stojącego po prawicy Boga."
  tags: []
"Dz7,56":
  text: "I powiedział: Oto widzę niebiosa otwarte i Syna Człowieczego stojącego po prawicy Boga."
  tags: []
"Dz7,57":
  text: "A oni podnieśli wielki krzyk, zatkali sobie uszy i jednomyślnie się na niego rzucili."
  tags: []
"Dz7,58":
  text: "Wyrzucili go poza miasto i kamienowali, a świadkowie złożyli swoje szaty u stóp młodzieńca zwanego Saulem."
  tags: []
"Dz7,59":
  text: "Tak kamienowali Szczepana, modlącego się tymi słowy: Panie Jezu, przyjmij mojego ducha."
  tags: []
"Dz7,60":
  text: "A upadłszy na kolana, zawołał donośnym głosem: Panie, nie poczytaj im tego za grzech. A gdy to powiedział, zasnął."
  tags: []
