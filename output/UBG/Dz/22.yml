"Dz22,1":
  text: "Mężowie bracia i ojcowie, słuchajcie mojej obrony, jaką teraz do was kieruję."
  tags: []
"Dz22,2":
  text: "Gdy usłyszeli, że mówił do nich po hebrajsku, jeszcze bardziej się uciszyli. A on powiedział:"
  tags: []
"Dz22,3":
  text: "Jestem Żydem, urodzonym w Tarsie w Cylicji, lecz wychowanym w tym mieście, u stóp Gamaliela, starannie wykształconym w prawie ojczystym i byłem gorliwym względem Boga jak i wy wszyscy dzisiaj."
  tags: []
"Dz22,4":
  text: "Prześladowałem tę drogę aż na śmierć, wiążąc i wtrącając do więzienia zarówno mężczyzn, jak i kobiety;"
  tags: []
"Dz22,5":
  text: "Czego mi świadkiem jest najwyższy kapłan oraz wszyscy starsi. Od nich też otrzymałem listy do braci i pojechałem do Damaszku, aby tych, którzy tam byli, przyprowadzić związanych do Jerozolimy, żeby zostali ukarani."
  tags: []
"Dz22,6":
  text: "A gdy byłem w drodze i zbliżałem się do Damaszku około południa, nagle ogarnęła mnie wielka światłość z nieba."
  tags: []
"Dz22,7":
  text: "I upadłem na ziemię, i usłyszałem głos, który mówił do mnie: Saulu, Saulu, dlaczego mnie prześladujesz?"
  tags: []
"Dz22,8":
  text: "A ja odpowiedziałem: Kim jesteś, Panie? I powiedział do mnie: Ja jestem Jezus z Nazaretu, którego ty prześladujesz."
  tags: []
"Dz22,9":
  text: "A ci, którzy byli ze mną, wprawdzie widzieli światłość i przestraszyli się, ale głosu tego, który do mnie mówił, nie słyszeli."
  tags: []
"Dz22,10":
  text: "Zapytałem: Co mam robić, Panie? A Pan powiedział do mnie: Wstań i idź do Damaszku, a tam ci powiedzą o wszystkim, co postanowiono, abyś uczynił."
  tags: []
"Dz22,11":
  text: "A ponieważ zaniewidziałem z powodu blasku tej światłości, przyszedłem do Damaszku prowadzony za rękę przez tych, którzy byli ze mną."
  tags: []
"Dz22,12":
  text: "Tam niejaki Ananiasz, człowiek pobożny według prawa, mający dobre świadectwo u wszystkich Żydów, którzy tam mieszkali;"
  tags: []
"Dz22,13":
  text: "Przyszedł, podszedł do mnie i powiedział: Bracie Saulu, przejrzyj! I w tej chwili spojrzałem na niego."
  tags: []
"Dz22,14":
  text: "A on powiedział: Bóg naszych ojców wybrał cię, żebyś poznał jego wolę, oglądał Sprawiedliwego i słuchał głosu z jego ust."
  tags: []
"Dz22,15":
  text: "Będziesz mu bowiem wobec wszystkich ludzi świadkiem tego, co widziałeś i słyszałeś."
  tags: []
"Dz22,16":
  text: "Dlaczego teraz zwlekasz? Wstań, ochrzcij się i obmyj swoje grzechy, wzywając imienia Pana."
  tags: []
"Dz22,17":
  text: "A gdy wróciłem do Jerozolimy i modliłem się w świątyni, wpadłem w zachwycenie."
  tags: []
"Dz22,18":
  text: "I widziałem go, jak mówił do mnie: Pospiesz się i wyjdź szybko z Jerozolimy, ponieważ nie przyjmą twego świadectwa o mnie."
  tags: []
"Dz22,19":
  text: "A ja odpowiedziałem: Panie, oni wiedzą, że wtrącałem do więzienia i biczowałem w synagogach tych, którzy w ciebie wierzyli."
  tags: []
"Dz22,20":
  text: "A kiedy przelewano krew Szczepana, twojego świadka, ja też byłem przy tym i zgodziłem się na jego zabicie, i pilnowałem szat tych, którzy go zabili."
  tags: []
"Dz22,21":
  text: "I powiedział mi: Idź, bo ja cię poślę daleko, do pogan."
  tags: []
"Dz22,22":
  text: "Słuchali go aż do tego słowa, potem podnieśli swój głos, mówiąc: Zgładź z ziemi takiego człowieka, bo nie godzi się, żeby żył!"
  tags: []
"Dz22,23":
  text: "A gdy oni krzyczeli, rozrzucali szaty i ciskali proch w powietrze;"
  tags: []
"Dz22,24":
  text: "Dowódca rozkazał go zaprowadzić do twierdzy i polecił przesłuchać go z zastosowaniem biczowania, żeby się dowiedzieć, dlaczego tak przeciwko niemu krzyczano."
  tags: []
"Dz22,25":
  text: "A gdy go związano, aby go ubiczować, Paweł powiedział do setnika, który stał obok: Czy wolno wam biczować Rzymianina i to bez sądu?"
  tags: []
"Dz22,26":
  text: "Kiedy setnik to usłyszał, podszedł do dowódcy i powiedział mu: Uważaj, co robisz, bo ten człowiek jest Rzymianinem."
  tags: []
"Dz22,27":
  text: "Dowódca podszedł i zapytał go: Powiedz mi, czy ty jesteś Rzymianinem? A on odpowiedział: Tak."
  tags: []
"Dz22,28":
  text: "I powiedział dowódca: Ja kupiłem to obywatelstwo za wielką sumę. Paweł zaś rzekł: A ja mam je od urodzenia."
  tags: []
"Dz22,29":
  text: "I natychmiast odstąpili od niego ci, którzy mieli go przesłuchać. Nawet i dowódca przestraszył się, kiedy się dowiedział, że jest Rzymianinem, a on kazał go związać."
  tags: []
"Dz22,30":
  text: "A nazajutrz, chcąc się dokładnie dowiedzieć, o co Żydzi go oskarżali, uwolnił go z więzów i rozkazał zebrać się naczelnym kapłanom i całej Radzie, przyprowadził Pawła i stawił go przed nimi."
  tags: []
