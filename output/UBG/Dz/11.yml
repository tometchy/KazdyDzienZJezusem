"Dz11,1":
  text: "Apostołowie i bracia, którzy byli w Judei, usłyszeli, że również poganie przyjęli słowo Boże."
  tags: []
"Dz11,2":
  text: "A gdy Piotr przybył do Jerozolimy, spierali się z nim ci, którzy pochodzili z obrzezania;"
  tags: []
"Dz11,3":
  text: "Mówiąc: Wszedłeś do ludzi nieobrzezanych i jadłeś z nimi."
  tags: []
"Dz11,4":
  text: "Wtedy Piotr zaczął po kolei im wyjaśniać:"
  tags: []
"Dz11,5":
  text: "Będąc w mieście Jafie, modliłem się i w zachwyceniu miałem widzenie – jakiś przedmiot zstępujący, jakby wielkie płótno, za cztery rogi uwiązane i spuszczone z nieba, i dotarło aż do mnie."
  tags: []
"Dz11,6":
  text: "Wpatrzywszy się w nie uważnie, przyjrzałem się i zobaczyłem czworonożne zwierzęta ziemskie, bestie, gady i ptaki nieba."
  tags: []
"Dz11,7":
  text: "I usłyszałem głos mówiący do mnie: Wstań, Piotrze, zabijaj i jedz."
  tags: []
"Dz11,8":
  text: "I odpowiedziałem: Żadną miarą, Panie, bo nigdy niczego pospolitego lub nieczystego nie wziąłem do ust."
  tags: []
"Dz11,9":
  text: "Wtedy głos z nieba odezwał się po raz drugi: Tego, co Bóg oczyścił, nie uważaj za nieczyste."
  tags: []
"Dz11,10":
  text: "A to się stało trzy razy, po czym to wszystko zostało wciągnięte z powrotem do nieba."
  tags: []
"Dz11,11":
  text: "I zaraz trzej mężczyźni posłani do mnie z Cezarei stanęli przed domem, w którym byłem."
  tags: []
"Dz11,12":
  text: "I powiedział mi Duch, abym z nimi poszedł bez wahania. Szło też ze mną tych sześciu braci i weszliśmy do domu tego człowieka."
  tags: []
"Dz11,13":
  text: "On nam opowiedział, jak ujrzał w swoim domu anioła, który stanął i powiedział do niego: Poślij ludzi do Jafy i przywołaj Szymona, zwanego Piotrem."
  tags: []
"Dz11,14":
  text: "On ci powie słowa, przez które będziesz zbawiony, ty i cały twój dom."
  tags: []
"Dz11,15":
  text: "A gdy zacząłem mówić, zstąpił na nich Duch Święty, tak jak na nas na początku."
  tags: []
"Dz11,16":
  text: "I przypomniałem słowo Pana, gdy powiedział: Jan chrzcił wodą, ale wy będziecie ochrzczeni Duchem Świętym."
  tags: []
"Dz11,17":
  text: "Jeśli więc Bóg dał im ten sam dar co nam, którzy uwierzyliśmy w Pana Jezusa Chrystusa, kim ja jestem, abym mógł zabronić Bogu?"
  tags: []
"Dz11,18":
  text: "A usłyszawszy to, uspokoili się i chwalili Boga, mówiąc: A więc i poganom dał Bóg pokutę ku życiu."
  tags: []
"Dz11,19":
  text: "Lecz ci, których rozproszyło prześladowanie, jakie wybuchło z powodu Szczepana, dotarli aż do Fenicji, na Cypr i do Antiochii, nie głosząc słowa Bożego nikomu, tylko Żydom."
  tags: []
"Dz11,20":
  text: "A niektórzy z nich, mężczyźni z Cypru i Cyreny, gdy przybyli do Antiochii, mówili do hellenistów, głosząc Pana Jezusa."
  tags: []
"Dz11,21":
  text: "I była z nimi ręka Pana, a wielka ich liczba uwierzyła i nawróciła się do Pana."
  tags: []
"Dz11,22":
  text: "I wieść o nich dotarła do uszu kościoła, który był w Jerozolimie. I posłano Barnabę aż do Antiochii."
  tags: []
"Dz11,23":
  text: "Gdy tam przybył i ujrzał łaskę Boga, uradował się i zachęcał wszystkich, aby zgodnie z postanowieniem serca trwali przy Panu."
  tags: []
"Dz11,24":
  text: "Był to bowiem mąż dobry, pełen Ducha Świętego i wiary. I przybyło Panu mnóstwo ludzi."
  tags: []
"Dz11,25":
  text: "Potem Barnaba udał się do Tarsu, aby szukać Saula."
  tags: []
"Dz11,26":
  text: "A gdy go znalazł, przyprowadził go do Antiochii. Przez cały rok zbierali się z tym kościołem i nauczali wielu ludzi. W Antiochii też po raz pierwszy uczniów nazwano chrześcijanami."
  tags: []
"Dz11,27":
  text: "A w tych dniach przybyli z Jerozolimy do Antiochii prorocy."
  tags: []
"Dz11,28":
  text: "I jeden z nich, imieniem Agabos, powstał i oznajmił przez Ducha, że w całej ziemi nastanie wielki głód. Nastał on za cesarza Klaudiusza."
  tags: []
"Dz11,29":
  text: "Wtedy uczniowie, każdy z nich według swoich możliwości, postanowili posłać pomoc do braci, którzy mieszkali w Judei."
  tags: []
"Dz11,30":
  text: "Tak też zrobili, posyłając ją starszym przez ręce Barnaby i Saula."
  tags: []
