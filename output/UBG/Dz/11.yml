"Dz11,1": "Apostołowie i bracia, którzy byli w Judei, usłyszeli, że również poganie przyjęli słowo Boże."
"Dz11,2": "A gdy Piotr przybył do Jerozolimy, spierali się z nim ci, którzy pochodzili z obrzezania;"
"Dz11,3": "Mówiąc: Wszedłeś do ludzi nieobrzezanych i jadłeś z nimi."
"Dz11,4": "Wtedy Piotr zaczął po kolei im wyjaśniać:"
"Dz11,5": "Będąc w mieście Jafie, modliłem się i w zachwyceniu miałem widzenie – jakiś przedmiot zstępujący, jakby wielkie płótno, za cztery rogi uwiązane i spuszczone z nieba, i dotarło aż do mnie."
"Dz11,6": "Wpatrzywszy się w nie uważnie, przyjrzałem się i zobaczyłem czworonożne zwierzęta ziemskie, bestie, gady i ptaki nieba."
"Dz11,7": "I usłyszałem głos mówiący do mnie: Wstań, Piotrze, zabijaj i jedz."
"Dz11,8": "I odpowiedziałem: Żadną miarą, Panie, bo nigdy niczego pospolitego lub nieczystego nie wziąłem do ust."
"Dz11,9": "Wtedy głos z nieba odezwał się po raz drugi: Tego, co Bóg oczyścił, nie uważaj za nieczyste."
"Dz11,10": "A to się stało trzy razy, po czym to wszystko zostało wciągnięte z powrotem do nieba."
"Dz11,11": "I zaraz trzej mężczyźni posłani do mnie z Cezarei stanęli przed domem, w którym byłem."
"Dz11,12": "I powiedział mi Duch, abym z nimi poszedł bez wahania. Szło też ze mną tych sześciu braci i weszliśmy do domu tego człowieka."
"Dz11,13": "On nam opowiedział, jak ujrzał w swoim domu anioła, który stanął i powiedział do niego: Poślij ludzi do Jafy i przywołaj Szymona, zwanego Piotrem."
"Dz11,14": "On ci powie słowa, przez które będziesz zbawiony, ty i cały twój dom."
"Dz11,15": "A gdy zacząłem mówić, zstąpił na nich Duch Święty, tak jak na nas na początku."
"Dz11,16": "I przypomniałem słowo Pana, gdy powiedział: Jan chrzcił wodą, ale wy będziecie ochrzczeni Duchem Świętym."
"Dz11,17": "Jeśli więc Bóg dał im ten sam dar co nam, którzy uwierzyliśmy w Pana Jezusa Chrystusa, kim ja jestem, abym mógł zabronić Bogu?"
"Dz11,18": "A usłyszawszy to, uspokoili się i chwalili Boga, mówiąc: A więc i poganom dał Bóg pokutę ku życiu."
"Dz11,19": "Lecz ci, których rozproszyło prześladowanie, jakie wybuchło z powodu Szczepana, dotarli aż do Fenicji, na Cypr i do Antiochii, nie głosząc słowa Bożego nikomu, tylko Żydom."
"Dz11,20": "A niektórzy z nich, mężczyźni z Cypru i Cyreny, gdy przybyli do Antiochii, mówili do hellenistów, głosząc Pana Jezusa."
"Dz11,21": "I była z nimi ręka Pana, a wielka ich liczba uwierzyła i nawróciła się do Pana."
"Dz11,22": "I wieść o nich dotarła do uszu kościoła, który był w Jerozolimie. I posłano Barnabę aż do Antiochii."
"Dz11,23": "Gdy tam przybył i ujrzał łaskę Boga, uradował się i zachęcał wszystkich, aby zgodnie z postanowieniem serca trwali przy Panu."
"Dz11,24": "Był to bowiem mąż dobry, pełen Ducha Świętego i wiary. I przybyło Panu mnóstwo ludzi."
"Dz11,25": "Potem Barnaba udał się do Tarsu, aby szukać Saula."
"Dz11,26": "A gdy go znalazł, przyprowadził go do Antiochii. Przez cały rok zbierali się z tym kościołem i nauczali wielu ludzi. W Antiochii też po raz pierwszy uczniów nazwano chrześcijanami."
"Dz11,27": "A w tych dniach przybyli z Jerozolimy do Antiochii prorocy."
"Dz11,28": "I jeden z nich, imieniem Agabos, powstał i oznajmił przez Ducha, że w całej ziemi nastanie wielki głód. Nastał on za cesarza Klaudiusza."
"Dz11,29": "Wtedy uczniowie, każdy z nich według swoich możliwości, postanowili posłać pomoc do braci, którzy mieszkali w Judei."
"Dz11,30": "Tak też zrobili, posyłając ją starszym przez ręce Barnaby i Saula."
