"Dz3,1":
  text: "Piotr i Jan weszli razem do świątyni w godzinie modlitwy, o dziewiątej."
  tags: []
"Dz3,2":
  text: "A wnoszono właśnie pewnego mężczyznę, chromego od urodzenia, którego każdego dnia sadzano u bramy świątyni, zwanej Piękną, żeby wchodzących do świątyni prosił o jałmużnę."
  tags: []
"Dz3,3":
  text: "Gdy zobaczył Piotra i Jana, jak mieli wejść do świątyni, prosił ich o jałmużnę."
  tags: []
"Dz3,4":
  text: "A Piotr, przypatrując mu się wraz z Janem, powiedział: Spójrz na nas."
  tags: []
"Dz3,5":
  text: "On więc spojrzał na nich uważnie, spodziewając się, że coś od nich otrzyma."
  tags: []
"Dz3,6":
  text: "Wtedy Piotr powiedział: Nie mam srebra ani złota, lecz co mam, to ci daję: W imieniu Jezusa Chrystusa z Nazaretu, wstań i chodź!"
  tags: []
"Dz3,7":
  text: "A ująwszy go za prawą rękę, podniósł go. I natychmiast wzmocniły się jego nogi i kostki."
  tags: []
"Dz3,8":
  text: "A on zerwał się, wstał i chodził. Wszedł z nimi do świątyni, chodząc, skacząc i chwaląc Boga."
  tags: []
"Dz3,9":
  text: "A wszyscy ludzie widzieli go chodzącego i chwalącego Boga."
  tags: []
"Dz3,10":
  text: "I rozpoznali w nim tego człowieka, który dla jałmużny siadał przy Pięknej Bramie świątyni, i ogarnęło ich zdumienie i zachwyt nad tym, co mu się przydarzyło."
  tags: []
"Dz3,11":
  text: "A gdy ten chromy, który został uzdrowiony, trzymał się Piotra i Jana, wszyscy ludzie zdumieni zbiegli się do nich w przedsionku, który zwano Salomonowym."
  tags: []
"Dz3,12":
  text: "Kiedy Piotr to zobaczył, przemówił do ludzi: Mężowie izraelscy, dlaczego się temu dziwicie i dlaczego się nam tak uważnie przypatrujecie, jakbyśmy własną mocą albo pobożnością sprawili, że on chodzi?"
  tags: []
"Dz3,13":
  text: "Bóg Abrahama, Izaaka i Jakuba, Bóg naszych ojców, uwielbił Jezusa, swego Syna, którego wy wydaliście i wyparliście się przed Piłatem, gdy postanowił go uwolnić."
  tags: []
"Dz3,14":
  text: "A wy wyparliście się Świętego i Sprawiedliwego i prosiliście o uwolnienie wam mordercy."
  tags: []
"Dz3,15":
  text: "I zabiliście Dawcę życia, którego Bóg wskrzesił z martwych, czego my jesteśmy świadkami."
  tags: []
"Dz3,16":
  text: "A przez wiarę w jego imię, temu, którego widzicie i znacie, imię to przywróciło siły. To wiara, która jest przez niego, dała mu pełne zdrowie na oczach was wszystkich."
  tags: []
"Dz3,17":
  text: "Ale teraz, bracia, wiem, że uczyniliście to z nieświadomości, tak jak wasi przełożeni."
  tags: []
"Dz3,18":
  text: "Lecz Bóg w ten sposób wypełnił to, co przepowiedział przez usta wszystkich swoich proroków, że jego Chrystus będzie cierpiał."
  tags: []
"Dz3,19":
  text: "Dlatego pokutujcie i nawróćcie się, aby wasze grzechy były zgładzone, gdy nadejdą sprzed oblicza Pana czasy ochłody;"
  tags: []
"Dz3,20":
  text: "I pośle tego, który był wam głoszony, Jezusa Chrystusa;"
  tags: []
"Dz3,21":
  text: "Którego niebo musi przyjąć aż do czasu odnowienia wszystkich rzeczy, jak Bóg od wieków przepowiadał przez usta wszystkich swoich świętych proroków."
  tags: []
"Dz3,22":
  text: "Mojżesz bowiem powiedział do ojców: Proroka jak ja wzbudzi wam Pan, wasz Bóg, spośród waszych braci. Jego będziecie słuchać we wszystkim, co wam powie."
  tags: []
"Dz3,23":
  text: "I stanie się, że każda dusza, która nie będzie słuchać tego proroka, będzie wytracona spośród ludu."
  tags: []
"Dz3,24":
  text: "Przepowiadali te dni także wszyscy prorocy, którzy przemawiali od czasów Samuela i inni po nim."
  tags: []
"Dz3,25":
  text: "Wy jesteście synami proroków i przymierza, które Bóg zawarł z naszymi ojcami, mówiąc do Abrahama: W twoim potomstwie będą błogosławione wszystkie narody ziemi."
  tags: []
"Dz3,26":
  text: "Wzbudziwszy swego Syna, Jezusa, Bóg najpierw posłał go do was, aby wam błogosławił w odwracaniu się każdego z was od swoich nieprawości."
  tags: []
