"Dz2,1":
  text: "A gdy nadszedł dzień Pięćdziesiątnicy, wszyscy byli jednomyślnie na tym samym miejscu."
  tags: []
"Dz2,2":
  text: "Nagle powstał odgłos z nieba, jakby uderzenie gwałtownego wiatru, i wypełnił cały dom, w którym siedzieli."
  tags: []
"Dz2,3":
  text: "Ukazały się im rozdzielone języki jakby z ognia, które spoczęły na każdym z nich."
  tags: []
"Dz2,4":
  text: "I wszyscy zostali napełnieni Duchem Świętym, i zaczęli mówić innymi językami, tak jak im Duch pozwalał mówić."
  tags: []
"Dz2,5":
  text: "A przebywali w Jerozolimie Żydzi, mężczyźni pobożni, ze wszystkich narodów pod niebem."
  tags: []
"Dz2,6":
  text: "A kiedy powstał ten szum, zeszło się mnóstwo ludzi i zdumieli się, bo każdy z nich słyszał ich mówiących w jego własnym języku."
  tags: []
"Dz2,7":
  text: "I pytali się nawzajem zdziwieni i pełni zdumienia: Czy ci wszyscy, którzy mówią, nie są Galilejczykami?"
  tags: []
"Dz2,8":
  text: "Jak to jest, że każdy z nas słyszy swój własny język ojczysty?"
  tags: []
"Dz2,9":
  text: "Partowie, Medowie, Elamici i ci, którzy mieszkają w Mezopotamii, Judei, Kapadocji, w Poncie i Azji;"
  tags: []
"Dz2,10":
  text: "We Frygii, w Pamfilii, Egipcie i w częściach Libii, które leżą obok Cyreny, a także przybysze z Rzymu, zarówno Żydzi, jak i prozelici;"
  tags: []
"Dz2,11":
  text: "Kreteńczycy i Arabowie – słyszymy ich głoszących w naszych językach wielkie dzieła Boże."
  tags: []
"Dz2,12":
  text: "I zdumiewali się wszyscy, i dziwili, mówiąc jeden do drugiego: Co to ma znaczyć?"
  tags: []
"Dz2,13":
  text: "Lecz inni naśmiewali się i mówili: Upili się młodym winem."
  tags: []
"Dz2,14":
  text: "Wtedy stanął Piotr z jedenastoma, podniósł swój głos i przemówił do nich: Mężowie z Judei i wszyscy, którzy mieszkacie w Jerozolimie, przyjmijcie do wiadomości i posłuchajcie uważnie moich słów."
  tags: []
"Dz2,15":
  text: "Oni bowiem nie są pijani, jak sądzicie, bo jest dopiero trzecia godzina dnia."
  tags: []
"Dz2,16":
  text: "Ale to jest to, co zostało przepowiedziane przez proroka Joela:"
  tags: []
"Dz2,17":
  text: "I stanie się w ostatecznych dniach – mówi Bóg – że wyleję z mego Ducha na wszelkie ciało i będą prorokować wasi synowie i córki, wasi młodzieńcy będą mieć widzenia, a starcy będą śnić sny."
  tags: []
"Dz2,18":
  text: "Nawet na moje sługi i służebnice wyleję w tych dniach z mego Ducha i będą prorokować."
  tags: []
"Dz2,19":
  text: "I ukażę cuda na niebie w górze i znaki na ziemi na dole, krew, ogień i kłęby dymu."
  tags: []
"Dz2,20":
  text: "Słońce zamieni się w ciemność, a księżyc w krew, zanim nadejdzie ten dzień Pański, wielki i okazały."
  tags: []
"Dz2,21":
  text: "I stanie się, że każdy, kto wezwie imienia Pana, będzie zbawiony."
  tags: []
"Dz2,22":
  text: "Mężowie izraelscy, słuchajcie tych słów: Jezusa z Nazaretu, męża potwierdzonego przez Boga wśród was mocami, cudami i znakami, których Bóg dokonał przez niego wśród was, o czym sami wiecie;"
  tags: []
"Dz2,23":
  text: "Wydanego zgodnie z powziętym postanowieniem Boga oraz tym, co przedtem wiedział, wzięliście i rękami bezbożników ukrzyżowaliście i zabiliście."
  tags: []
"Dz2,24":
  text: "Jego to Bóg wskrzesił, uwolniwszy od boleści śmierci, bo było niemożliwe, aby ta mogła go zatrzymać."
  tags: []
"Dz2,25":
  text: "Dawid bowiem mówi o nim: Patrzyłem na Pana zawsze przed moim obliczem, bo jest po mojej prawicy, żebym się nie zachwiał."
  tags: []
"Dz2,26":
  text: "Dlatego rozweseliło się moje serce i rozradował się mój język, a także moje ciało będzie spoczywać w nadziei."
  tags: []
"Dz2,27":
  text: "Nie zostawisz bowiem mojej duszy w piekle i nie dasz swojemu Świętemu doznać zniszczenia."
  tags: []
"Dz2,28":
  text: "Dałeś mi poznać drogi życia, a twoje oblicze napełni mnie radością."
  tags: []
"Dz2,29":
  text: "Mężowie bracia, mogę swobodnie mówić do was o patriarsze Dawidzie, że umarł i został pogrzebany, a jego grobowiec znajduje się u nas aż do dziś."
  tags: []
"Dz2,30":
  text: "Będąc więc prorokiem i wiedząc, że Bóg zaręczył mu przysięgą, iż z owocu jego bioder, według ciała, wzbudzi Chrystusa i posadzi na jego tronie;"
  tags: []
"Dz2,31":
  text: "Przepowiadał to i mówił o zmartwychwstaniu Chrystusa, że jego dusza nie pozostanie w piekle, a jego ciało nie dozna zniszczenia."
  tags: []
"Dz2,32":
  text: "Tego to Jezusa wskrzesił Bóg, czego my wszyscy jesteśmy świadkami."
  tags: []
"Dz2,33":
  text: "Będąc więc wywyższony prawicą Boga, otrzymał od Ojca obietnicę Ducha Świętego i wylał to, co wy teraz widzicie i słyszycie."
  tags: []
"Dz2,34":
  text: "Dawid bowiem nie wstąpił do nieba, a jednak sam mówi: Powiedział Pan memu Panu: Siądź po mojej prawicy;"
  tags: []
"Dz2,35":
  text: "Aż położę twoich nieprzyjaciół jako podnóżek pod twoje stopy."
  tags: []
"Dz2,36":
  text: "Niech więc cały dom Izraela wie z pewnością, że tego Jezusa, którego wy ukrzyżowaliście, Bóg uczynił i Panem, i Chrystusem."
  tags: []
"Dz2,37":
  text: "A słysząc to, przerazili się do głębi serca i zapytali Piotra i pozostałych apostołów: Co mamy robić, mężowie bracia?"
  tags: []
"Dz2,38":
  text: "Wtedy Piotr powiedział do nich: Pokutujcie i niech każdy z was ochrzci się w imię Jezusa Chrystusa na przebaczenie grzechów, a otrzymacie dar Ducha Świętego."
  tags: []
"Dz2,39":
  text: "Obietnica ta bowiem dotyczy was, waszych dzieci i wszystkich, którzy są daleko, każdego, kogo powoła Pan, nasz Bóg."
  tags: []
"Dz2,40":
  text: "W wielu też innych słowach dawał świadectwo i napominał ich: Ratujcie się od tego przewrotnego pokolenia."
  tags: []
"Dz2,41":
  text: "Ci więc, którzy chętnie przyjęli jego słowa, zostali ochrzczeni. I przyłączyło się tego dnia około trzech tysięcy dusz."
  tags: []
"Dz2,42":
  text: "Trwali oni w nauce apostołów, w społeczności, w łamaniu chleba i w modlitwach."
  tags: []
"Dz2,43":
  text: "I strach ogarnął każdą duszę, gdyż wiele znaków i cudów działo się przez apostołów."
  tags: []
"Dz2,44":
  text: "A wszyscy, którzy uwierzyli, byli razem i wszystko mieli wspólne."
  tags: []
"Dz2,45":
  text: "Sprzedawali posiadłości i dobra i rozdzielali je wszystkim według potrzeb."
  tags: []
"Dz2,46":
  text: "Każdego dnia trwali zgodnie w świątyni, a łamiąc chleb po domach, przyjmowali pokarm z radością i w prostocie serca;"
  tags: []
"Dz2,47":
  text: "Chwaląc Boga i ciesząc się przychylnością wszystkich ludzi. A Pan dodawał kościołowi każdego dnia tych, którzy mieli być zbawieni."
  tags: []
