"Dz2,1": "A gdy nadszedł dzień Pięćdziesiątnicy, wszyscy byli jednomyślnie na tym samym miejscu."
"Dz2,2": "Nagle powstał odgłos z nieba, jakby uderzenie gwałtownego wiatru, i wypełnił cały dom, w którym siedzieli."
"Dz2,3": "Ukazały się im rozdzielone języki jakby z ognia, które spoczęły na każdym z nich."
"Dz2,4": "I wszyscy zostali napełnieni Duchem Świętym, i zaczęli mówić innymi językami, tak jak im Duch pozwalał mówić."
"Dz2,5": "A przebywali w Jerozolimie Żydzi, mężczyźni pobożni, ze wszystkich narodów pod niebem."
"Dz2,6": "A kiedy powstał ten szum, zeszło się mnóstwo ludzi i zdumieli się, bo każdy z nich słyszał ich mówiących w jego własnym języku."
"Dz2,7": "I pytali się nawzajem zdziwieni i pełni zdumienia: Czy ci wszyscy, którzy mówią, nie są Galilejczykami?"
"Dz2,8": "Jak to jest, że każdy z nas słyszy swój własny język ojczysty?"
"Dz2,9": "Partowie, Medowie, Elamici i ci, którzy mieszkają w Mezopotamii, Judei, Kapadocji, w Poncie i Azji;"
"Dz2,10": "We Frygii, w Pamfilii, Egipcie i w częściach Libii, które leżą obok Cyreny, a także przybysze z Rzymu, zarówno Żydzi, jak i prozelici;"
"Dz2,11": "Kreteńczycy i Arabowie – słyszymy ich głoszących w naszych językach wielkie dzieła Boże."
"Dz2,12": "I zdumiewali się wszyscy, i dziwili, mówiąc jeden do drugiego: Co to ma znaczyć?"
"Dz2,13": "Lecz inni naśmiewali się i mówili: Upili się młodym winem."
"Dz2,14": "Wtedy stanął Piotr z jedenastoma, podniósł swój głos i przemówił do nich: Mężowie z Judei i wszyscy, którzy mieszkacie w Jerozolimie, przyjmijcie do wiadomości i posłuchajcie uważnie moich słów."
"Dz2,15": "Oni bowiem nie są pijani, jak sądzicie, bo jest dopiero trzecia godzina dnia."
"Dz2,16": "Ale to jest to, co zostało przepowiedziane przez proroka Joela:"
"Dz2,17": "I stanie się w ostatecznych dniach – mówi Bóg – że wyleję z mego Ducha na wszelkie ciało i będą prorokować wasi synowie i córki, wasi młodzieńcy będą mieć widzenia, a starcy będą śnić sny."
"Dz2,18": "Nawet na moje sługi i służebnice wyleję w tych dniach z mego Ducha i będą prorokować."
"Dz2,19": "I ukażę cuda na niebie w górze i znaki na ziemi na dole, krew, ogień i kłęby dymu."
"Dz2,20": "Słońce zamieni się w ciemność, a księżyc w krew, zanim nadejdzie ten dzień Pański, wielki i okazały."
"Dz2,21": "I stanie się, że każdy, kto wezwie imienia Pana, będzie zbawiony."
"Dz2,22": "Mężowie izraelscy, słuchajcie tych słów: Jezusa z Nazaretu, męża potwierdzonego przez Boga wśród was mocami, cudami i znakami, których Bóg dokonał przez niego wśród was, o czym sami wiecie;"
"Dz2,23": "Wydanego zgodnie z powziętym postanowieniem Boga oraz tym, co przedtem wiedział, wzięliście i rękami bezbożników ukrzyżowaliście i zabiliście."
"Dz2,24": "Jego to Bóg wskrzesił, uwolniwszy od boleści śmierci, bo było niemożliwe, aby ta mogła go zatrzymać."
"Dz2,25": "Dawid bowiem mówi o nim: Patrzyłem na Pana zawsze przed moim obliczem, bo jest po mojej prawicy, żebym się nie zachwiał."
"Dz2,26": "Dlatego rozweseliło się moje serce i rozradował się mój język, a także moje ciało będzie spoczywać w nadziei."
"Dz2,27": "Nie zostawisz bowiem mojej duszy w piekle i nie dasz swojemu Świętemu doznać zniszczenia."
"Dz2,28": "Dałeś mi poznać drogi życia, a twoje oblicze napełni mnie radością."
"Dz2,29": "Mężowie bracia, mogę swobodnie mówić do was o patriarsze Dawidzie, że umarł i został pogrzebany, a jego grobowiec znajduje się u nas aż do dziś."
"Dz2,30": "Będąc więc prorokiem i wiedząc, że Bóg zaręczył mu przysięgą, iż z owocu jego bioder, według ciała, wzbudzi Chrystusa i posadzi na jego tronie;"
"Dz2,31": "Przepowiadał to i mówił o zmartwychwstaniu Chrystusa, że jego dusza nie pozostanie w piekle, a jego ciało nie dozna zniszczenia."
"Dz2,32": "Tego to Jezusa wskrzesił Bóg, czego my wszyscy jesteśmy świadkami."
"Dz2,33": "Będąc więc wywyższony prawicą Boga, otrzymał od Ojca obietnicę Ducha Świętego i wylał to, co wy teraz widzicie i słyszycie."
"Dz2,34": "Dawid bowiem nie wstąpił do nieba, a jednak sam mówi: Powiedział Pan memu Panu: Siądź po mojej prawicy;"
"Dz2,35": "Aż położę twoich nieprzyjaciół jako podnóżek pod twoje stopy."
"Dz2,36": "Niech więc cały dom Izraela wie z pewnością, że tego Jezusa, którego wy ukrzyżowaliście, Bóg uczynił i Panem, i Chrystusem."
"Dz2,37": "A słysząc to, przerazili się do głębi serca i zapytali Piotra i pozostałych apostołów: Co mamy robić, mężowie bracia?"
"Dz2,38": "Wtedy Piotr powiedział do nich: Pokutujcie i niech każdy z was ochrzci się w imię Jezusa Chrystusa na przebaczenie grzechów, a otrzymacie dar Ducha Świętego."
"Dz2,39": "Obietnica ta bowiem dotyczy was, waszych dzieci i wszystkich, którzy są daleko, każdego, kogo powoła Pan, nasz Bóg."
"Dz2,40": "W wielu też innych słowach dawał świadectwo i napominał ich: Ratujcie się od tego przewrotnego pokolenia."
"Dz2,41": "Ci więc, którzy chętnie przyjęli jego słowa, zostali ochrzczeni. I przyłączyło się tego dnia około trzech tysięcy dusz."
"Dz2,42": "Trwali oni w nauce apostołów, w społeczności, w łamaniu chleba i w modlitwach."
"Dz2,43": "I strach ogarnął każdą duszę, gdyż wiele znaków i cudów działo się przez apostołów."
"Dz2,44": "A wszyscy, którzy uwierzyli, byli razem i wszystko mieli wspólne."
"Dz2,45": "Sprzedawali posiadłości i dobra i rozdzielali je wszystkim według potrzeb."
"Dz2,46": "Każdego dnia trwali zgodnie w świątyni, a łamiąc chleb po domach, przyjmowali pokarm z radością i w prostocie serca;"
"Dz2,47": "Chwaląc Boga i ciesząc się przychylnością wszystkich ludzi. A Pan dodawał kościołowi każdego dnia tych, którzy mieli być zbawieni."
