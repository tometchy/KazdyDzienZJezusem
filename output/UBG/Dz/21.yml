"Dz21,1": "Po rozstaniu z nimi odpłynęliśmy i prostym kursem przybyliśmy na Kos, a nazajutrz na Rodos, stamtąd zaś do Patary."
"Dz21,2": "Znalazłszy tam statek, który miał płynąć do Fenicji, wsiedliśmy na niego i odpłynęliśmy."
"Dz21,3": "A gdy zobaczyliśmy Cypr, zostawiliśmy go po lewej stronie, popłynęliśmy do Syrii i przybyliśmy do Tyru. Tam bowiem miano wyładować towary ze statku."
"Dz21,4": "Odszukawszy uczniów, pozostaliśmy tam siedem dni, a oni pod wpływem Ducha mówili Pawłowi, żeby nie szedł do Jerozolimy."
"Dz21,5": "Po upływie tych dni odeszliśmy i wyruszyliśmy w drogę, a wszyscy z żonami i dziećmi odprowadzili nas za miasto. A uklęknąwszy na wybrzeżu, modliliśmy się."
"Dz21,6": "A gdy pożegnaliśmy się ze sobą, weszliśmy na statek, a oni wrócili do domu."
"Dz21,7": "Pod koniec żeglugi z Tyru przypłynęliśmy do Ptolemaidy i powitawszy braci, spędziliśmy u nich jeden dzień."
"Dz21,8": "A wyszedłszy nazajutrz, Paweł i my, jego towarzysze, dotarliśmy do Cezarei. Weszliśmy do domu Filipa ewangelisty, który był jednym z siedmiu, i zatrzymaliśmy się u niego."
"Dz21,9": "A miał on cztery córki, dziewice, które prorokowały."
"Dz21,10": "Kiedy tam mieszkaliśmy przez wiele dni, przyszedł z Judei pewien prorok, imieniem Agabos."
"Dz21,11": "Przybył do nas, wziął pas Pawła, związał sobie ręce i nogi i powiedział: To mówi Duch Święty: Tak Żydzi zwiążą w Jerozolimie i wydadzą w ręce pogan człowieka, do którego należy ten pas."
"Dz21,12": "Gdy to usłyszeliśmy, prosiliśmy my i miejscowi bracia, aby nie szedł do Jerozolimy."
"Dz21,13": "Wtedy Paweł odpowiedział: Co czynicie, płacząc i rozdzierając mi serce? Ja bowiem dla imienia Pana Jezusa jestem gotowy nie tylko dać się związać, ale i umrzeć w Jerozolimie."
"Dz21,14": "A gdy nie dał się przekonać, ustąpiliśmy, mówiąc: Niech się stanie wola Pana."
"Dz21,15": "Po upływie tych dni wzięliśmy swoje rzeczy i ruszyliśmy do Jerozolimy."
"Dz21,16": "Szli z nami niektórzy uczniowie z Cezarei, prowadząc niejakiego Mnazona Cypryjczyka, starego ucznia, u którego mieliśmy się zatrzymać."
"Dz21,17": "A gdy przybyliśmy do Jerozolimy, bracia przyjęli nas z radością."
"Dz21,18": "Nazajutrz Paweł poszedł z nami do Jakuba, gdzie zebrali się wszyscy starsi."
"Dz21,19": "Powitawszy ich, opowiedział im szczegółowo, czego Bóg dokonał wśród pogan przez jego posługę."
"Dz21,20": "Gdy to usłyszeli, chwalili Pana i powiedzieli: Widzisz, bracie, ile tysięcy Żydów uwierzyło, a wszyscy gorliwie trzymają się prawa."
"Dz21,21": "Lecz o tobie słyszeli, że odwodzisz od Mojżesza wszystkich Żydów, którzy są wśród pogan, mówiąc, że nie mają obrzezywać dzieci ani żyć według swoich zwyczajów."
"Dz21,22": "Cóż więc czynić? Z pewnością zejdzie się lud, bo usłyszą, że przybyłeś."
"Dz21,23": "Zrób zatem to, co ci mówimy. Mamy tu czterech mężczyzn, którzy złożyli ślub."
"Dz21,24": "Weź ich ze sobą, poddaj się wraz z nimi oczyszczeniu i pokryj za nich koszty, aby mogli ostrzyc głowy. Wtedy wszyscy poznają, że w tym, co o tobie słyszeli, nie ma nic z prawdy, ale że i ty sam postępujesz porządnie, przestrzegając prawa."
"Dz21,25": "A co do pogan, którzy uwierzyli, napisaliśmy, postanawiając, aby niczego takiego nie zachowywali, tylko żeby się wystrzegali tego, co ofiarowane bożkom, i krwi, i tego, co uduszone, i nierządu."
"Dz21,26": "Wtedy Paweł wziął ze sobą tych mężczyzn, a następnego dnia poddał się razem z nimi oczyszczeniu i wszedł do świątyni, zgłaszając wypełnienie dni oczyszczenia, aż za każdego z nich złożona zostanie ofiara."
"Dz21,27": "Kiedy zaś te siedem dni dobiegało końca, zobaczyli go w świątyni Żydzi z Azji, podburzyli tłum i rzucili się na niego;"
"Dz21,28": "Wołając: Mężowie Izraelici, pomóżcie! To jest człowiek, który wszędzie wszystkich naucza przeciwko ludowi i prawu, i temu miejscu, a nadto jeszcze i Greków wprowadził do świątyni i splugawił to święte miejsce."
"Dz21,29": "Przedtem bowiem widzieli z nim w mieście Trofima z Efezu i sądzili, że Paweł wprowadził go do świątyni."
"Dz21,30": "I poruszyło się całe miasto, i zbiegł się lud. A schwytawszy Pawła, wyciągnęli go ze świątyni i natychmiast zamknięto drzwi."
"Dz21,31": "A gdy usiłowali go zabić, dano znać dowódcy oddziału, że cała Jerozolima jest wzburzona."
"Dz21,32": "Natychmiast wziął żołnierzy i setników i zbiegł do nich na dół. A kiedy zobaczyli dowódcę i żołnierzy, przestali bić Pawła."
"Dz21,33": "Wtedy dowódca zbliżył się, zatrzymał go, kazał związać dwoma łańcuchami i wypytywał, kim jest i co zrobił."
"Dz21,34": "I jedni z tłumu krzyczeli tak, a drudzy inaczej. A gdy z powodu zgiełku nie mógł dowiedzieć się niczego pewnego, rozkazał zaprowadzić go do twierdzy."
"Dz21,35": "Kiedy znalazł się na schodach, doszło do tego, że żołnierze musieli go nieść z powodu naporu tłumu."
"Dz21,36": "Wielki tłum bowiem szedł za nim, wołając: Zgładź go!"
"Dz21,37": "A gdy Paweł miał być wprowadzony do twierdzy, zapytał dowódcę: Czy wolno mi coś do ciebie powiedzieć? A on odpowiedział: Mówisz po grecku?"
"Dz21,38": "Czy nie jesteś tym Egipcjaninem, który przed tymi dniami wzniecił rozruchy i wyprowadził na pustynię cztery tysiące zabójców?"
"Dz21,39": "A Paweł powiedział: Jestem Żydem z Tarsu, obywatelem znacznego miasta w Cylicji. Dlatego proszę cię, pozwól mi przemówić do ludu."
"Dz21,40": "Gdy pozwolił, Paweł, stojąc na schodach, dał ręką znak ludowi, a gdy nastała wielka cisza, przemówił po hebrajsku:"
