"Dz12,1": "W tym czasie król Herod zaczął gnębić niektórych członków kościoła."
"Dz12,2": "I zabił mieczem Jakuba, brata Jana."
"Dz12,3": "Widząc, że to podobało się Żydom, postanowił schwytać także Piotra. A były to dni Przaśników."
"Dz12,4": "Kiedy go schwytał, wtrącił go do więzienia i oddał pod straż szesnastu żołnierzom, zamierzając po święcie Paschy wydać go ludowi."
"Dz12,5": "Strzeżono więc Piotra w więzieniu, a kościół nieustannie modlił się za niego do Boga."
"Dz12,6": "A tej nocy, kiedy Herod miał go wydać, Piotr spał między dwoma żołnierzami, związany dwoma łańcuchami, a przed drzwiami strażnicy strzegli więzienia."
"Dz12,7": "Wtedy zjawił się anioł Pana i w więzieniu zajaśniało światło. Trącił Piotra w bok i obudził go, mówiąc: Wstań szybko. I opadły łańcuchy z jego rąk."
"Dz12,8": "I powiedział do niego anioł: Przepasz się i włóż sandały. Tak też zrobił. I powiedział mu: Narzuć płaszcz i chodź za mną."
"Dz12,9": "Piotr więc wyszedł i udał się za nim, a nie wiedział, że to, co się działo za sprawą anioła, działo się naprawdę, lecz sądził, że to widzenie."
"Dz12,10": "A gdy minęli pierwszą i drugą straż, doszli do żelaznej bramy, która prowadzi do miasta, a ta sama się przed nimi otworzyła. Kiedy wyszli i przeszli jedną ulicę, natychmiast anioł odstąpił od niego."
"Dz12,11": "Kiedy Piotr doszedł do siebie, powiedział: Teraz wiem na pewno, że Pan posłał swego anioła i wyrwał mnie z ręki Heroda i z tego wszystkiego, czego oczekiwał lud żydowski."
"Dz12,12": "Gdy to sobie uświadomił, przyszedł do domu Marii, matki Jana, którego nazywano Markiem, gdzie wielu zebrało się na modlitwie."
"Dz12,13": "I zapukał Piotr do drzwi w bramie, i wyszła dziewczyna imieniem Rode, aby nasłuchiwać:"
"Dz12,14": "Gdy poznała głos Piotra, z radości nie otworzyła bramy, lecz pobiegła i oznajmiła, że Piotr stoi przed bramą."
"Dz12,15": "A oni powiedzieli do niej: Oszalałaś! Jednak ona twierdziła, że tak jest istotnie. Odpowiedzieli: To jego anioł."
"Dz12,16": "Piotr zaś nie przestał pukać. A gdy otworzyli, zobaczyli go i zdumieli się."
"Dz12,17": "A dawszy im ręką znak, aby zamilkli, opowiedział im, jak Pan wyprowadził go z więzienia, i powiedział: Powiadomcie o tym Jakuba i braci. Potem wyszedł i udał się w inne miejsce."
"Dz12,18": "A gdy nastał dzień, powstało niemałe poruszenie wśród żołnierzy z powodu tego, co się stało z Piotrem."
"Dz12,19": "Herod zaś poszukiwał go, a gdy go nie znalazł, przesłuchał strażników i kazał ich stracić. Potem wyjechał z Judei do Cezarei i tam mieszkał."
"Dz12,20": "A Herod był bardzo zagniewany na mieszkańców Tyru i Sydonu. Lecz oni jednomyślnie przyszli do niego, zjednali sobie Blasta, podkomorzego królewskiego, i prosili o pokój, ponieważ ich kraj zaopatrywał się w żywność z ziem królewskich."
"Dz12,21": "W wyznaczonym dniu Herod ubrany w szaty królewskie zasiadł na tronie i wygłosił do nich mowę."
"Dz12,22": "A lud wołał: Głos Boga, a nie człowieka!"
"Dz12,23": "W tej chwili uderzył go anioł Pana, dlatego że nie oddał chwały Bogu, i wyzionął ducha, stoczony przez robactwo."
"Dz12,24": "A słowo Pana rozrastało się i rozmnażało."
"Dz12,25": "Barnaba zaś i Saul po wykonaniu posługi wrócili z Jerozolimy, zabierając ze sobą Jana, którego nazywano Markiem."
