"Dz12,1":
  text: "W tym czasie król Herod zaczął gnębić niektórych członków kościoła."
  tags: []
"Dz12,2":
  text: "I zabił mieczem Jakuba, brata Jana."
  tags: []
"Dz12,3":
  text: "Widząc, że to podobało się Żydom, postanowił schwytać także Piotra. A były to dni Przaśników."
  tags: []
"Dz12,4":
  text: "Kiedy go schwytał, wtrącił go do więzienia i oddał pod straż szesnastu żołnierzom, zamierzając po święcie Paschy wydać go ludowi."
  tags: []
"Dz12,5":
  text: "Strzeżono więc Piotra w więzieniu, a kościół nieustannie modlił się za niego do Boga."
  tags: []
"Dz12,6":
  text: "A tej nocy, kiedy Herod miał go wydać, Piotr spał między dwoma żołnierzami, związany dwoma łańcuchami, a przed drzwiami strażnicy strzegli więzienia."
  tags: []
"Dz12,7":
  text: "Wtedy zjawił się anioł Pana i w więzieniu zajaśniało światło. Trącił Piotra w bok i obudził go, mówiąc: Wstań szybko. I opadły łańcuchy z jego rąk."
  tags: []
"Dz12,8":
  text: "I powiedział do niego anioł: Przepasz się i włóż sandały. Tak też zrobił. I powiedział mu: Narzuć płaszcz i chodź za mną."
  tags: []
"Dz12,9":
  text: "Piotr więc wyszedł i udał się za nim, a nie wiedział, że to, co się działo za sprawą anioła, działo się naprawdę, lecz sądził, że to widzenie."
  tags: []
"Dz12,10":
  text: "A gdy minęli pierwszą i drugą straż, doszli do żelaznej bramy, która prowadzi do miasta, a ta sama się przed nimi otworzyła. Kiedy wyszli i przeszli jedną ulicę, natychmiast anioł odstąpił od niego."
  tags: []
"Dz12,11":
  text: "Kiedy Piotr doszedł do siebie, powiedział: Teraz wiem na pewno, że Pan posłał swego anioła i wyrwał mnie z ręki Heroda i z tego wszystkiego, czego oczekiwał lud żydowski."
  tags: []
"Dz12,12":
  text: "Gdy to sobie uświadomił, przyszedł do domu Marii, matki Jana, którego nazywano Markiem, gdzie wielu zebrało się na modlitwie."
  tags: []
"Dz12,13":
  text: "I zapukał Piotr do drzwi w bramie, i wyszła dziewczyna imieniem Rode, aby nasłuchiwać:"
  tags: []
"Dz12,14":
  text: "Gdy poznała głos Piotra, z radości nie otworzyła bramy, lecz pobiegła i oznajmiła, że Piotr stoi przed bramą."
  tags: []
"Dz12,15":
  text: "A oni powiedzieli do niej: Oszalałaś! Jednak ona twierdziła, że tak jest istotnie. Odpowiedzieli: To jego anioł."
  tags: []
"Dz12,16":
  text: "Piotr zaś nie przestał pukać. A gdy otworzyli, zobaczyli go i zdumieli się."
  tags: []
"Dz12,17":
  text: "A dawszy im ręką znak, aby zamilkli, opowiedział im, jak Pan wyprowadził go z więzienia, i powiedział: Powiadomcie o tym Jakuba i braci. Potem wyszedł i udał się w inne miejsce."
  tags: []
"Dz12,18":
  text: "A gdy nastał dzień, powstało niemałe poruszenie wśród żołnierzy z powodu tego, co się stało z Piotrem."
  tags: []
"Dz12,19":
  text: "Herod zaś poszukiwał go, a gdy go nie znalazł, przesłuchał strażników i kazał ich stracić. Potem wyjechał z Judei do Cezarei i tam mieszkał."
  tags: []
"Dz12,20":
  text: "A Herod był bardzo zagniewany na mieszkańców Tyru i Sydonu. Lecz oni jednomyślnie przyszli do niego, zjednali sobie Blasta, podkomorzego królewskiego, i prosili o pokój, ponieważ ich kraj zaopatrywał się w żywność z ziem królewskich."
  tags: []
"Dz12,21":
  text: "W wyznaczonym dniu Herod ubrany w szaty królewskie zasiadł na tronie i wygłosił do nich mowę."
  tags: []
"Dz12,22":
  text: "A lud wołał: Głos Boga, a nie człowieka!"
  tags: []
"Dz12,23":
  text: "W tej chwili uderzył go anioł Pana, dlatego że nie oddał chwały Bogu, i wyzionął ducha, stoczony przez robactwo."
  tags: []
"Dz12,24":
  text: "A słowo Pana rozrastało się i rozmnażało."
  tags: []
"Dz12,25":
  text: "Barnaba zaś i Saul po wykonaniu posługi wrócili z Jerozolimy, zabierając ze sobą Jana, którego nazywano Markiem."
  tags: []
