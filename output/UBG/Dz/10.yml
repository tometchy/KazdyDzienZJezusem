"Dz10,1":
  text: "A w Cezarei był pewien człowiek imieniem Korneliusz, setnik z oddziału zwanego Italskim;"
  tags: []
"Dz10,2":
  text: "Pobożny i bojący się Boga wraz z całym swoim domem. Dawał on wielkie jałmużny ludowi i zawsze modlił się do Boga."
  tags: []
"Dz10,3":
  text: "Około dziewiątej godziny dnia ujrzał wyraźnie w widzeniu anioła Boga, który przyszedł do niego i powiedział: Korneliuszu!"
  tags: []
"Dz10,4":
  text: "A on uważnie patrzył na niego i będąc przestraszonym, zapytał: Co, Panie? I odpowiedział mu: Twoje modlitwy i jałmużny dotarły przed oblicze Boga jako przypomnienie."
  tags: []
"Dz10,5":
  text: "Dlatego teraz poślij mężczyzn do Jafy i sprowadź Szymona, zwanego Piotrem."
  tags: []
"Dz10,6":
  text: "Zatrzymał się on u pewnego Szymona, garbarza, który ma dom nad morzem. On ci powie, co masz robić."
  tags: []
"Dz10,7":
  text: "A gdy anioł, który mówił z Korneliuszem, odszedł, ten zawołał dwóch swoich sług i pobożnego żołnierza spośród tych, którzy stale mu posługiwali;"
  tags: []
"Dz10,8":
  text: "I opowiedziawszy im wszystko, posłał ich do Jafy."
  tags: []
"Dz10,9":
  text: "A nazajutrz, gdy byli w drodze i zbliżali się do miasta, około godziny szóstej Piotr wszedł na dach, aby się modlić."
  tags: []
"Dz10,10":
  text: "A będąc głodnym, chciał coś zjeść. Gdy zaś przygotowywano mu posiłek, wpadł w zachwycenie."
  tags: []
"Dz10,11":
  text: "Zobaczył otwarte niebo i zstępujący na niego jakiś przedmiot, podobny do wielkiego płótna, związany ze sobą czterema końcami i spuszczany ku ziemi."
  tags: []
"Dz10,12":
  text: "Były w nim wszelkie czworonożne zwierzęta ziemskie, bestie, gady i ptaki nieba."
  tags: []
"Dz10,13":
  text: "I odezwał się do niego głos: Wstań, Piotrze, zabijaj i jedz."
  tags: []
"Dz10,14":
  text: "A Piotr odpowiedział: Żadną miarą, Panie, bo nigdy nie jadłem niczego pospolitego lub nieczystego."
  tags: []
"Dz10,15":
  text: "Wtedy znowu, po raz drugi dobiegł go głos: Tego, co Bóg oczyścił, ty nie uważaj za nieczyste."
  tags: []
"Dz10,16":
  text: "I stało się tak trzy razy. Wówczas ten przedmiot został z powrotem wzięty do nieba."
  tags: []
"Dz10,17":
  text: "A gdy Piotr zastanawiał się, co ma oznaczać widzenie, które miał, oto mężczyźni wysłani przez Korneliusza, dopytawszy się o dom Szymona, stanęli przed bramą;"
  tags: []
"Dz10,18":
  text: "I zawołali, pytając, czy tam przebywa Szymon, zwany Piotrem."
  tags: []
"Dz10,19":
  text: "A gdy Piotr rozmyślał o tym widzeniu, powiedział do niego Duch: Szukają cię trzej mężczyźni."
  tags: []
"Dz10,20":
  text: "Dlatego wstań, zejdź i idź z nimi bez wahania, bo ja ich posłałem."
  tags: []
"Dz10,21":
  text: "Wtedy Piotr zszedł do mężczyzn, którzy zostali do niego posłani przez Korneliusza, i powiedział: Ja jestem tym, którego szukacie. Z jakiego powodu przyszliście?"
  tags: []
"Dz10,22":
  text: "A oni odpowiedzieli: Setnik Korneliusz, człowiek sprawiedliwy i bojący się Boga, mający dobre świadectwo od całego narodu żydowskiego, w widzeniu otrzymał przez świętego anioła polecenie, aby cię wezwał do swego domu i wysłuchał twoich słów."
  tags: []
"Dz10,23":
  text: "Wtedy zawołał ich do domu i udzielił gościny. A następnego dnia Piotr wyruszył z nimi i niektórzy bracia z Jafy towarzyszyli mu."
  tags: []
"Dz10,24":
  text: "A nazajutrz weszli do Cezarei. Korneliusz zaś czekał na nich, zwoławszy swoich krewnych i bliskich przyjaciół."
  tags: []
"Dz10,25":
  text: "A gdy Piotr wchodził, Korneliusz wyszedł mu naprzeciw, padł mu do nóg i oddał mu pokłon."
  tags: []
"Dz10,26":
  text: "Lecz Piotr podniósł go, mówiąc: Wstań, ja też jestem człowiekiem."
  tags: []
"Dz10,27":
  text: "A rozmawiając z nim, wszedł i zastał wielu zebranych."
  tags: []
"Dz10,28":
  text: "I powiedział do nich: Wiecie, że nie wolno Żydowi przestawać z cudzoziemcem albo przychodzić do niego. Lecz Bóg mi pokazał, żebym żadnego człowieka nie nazywał pospolitym lub nieczystym."
  tags: []
"Dz10,29":
  text: "Dlatego też, będąc wezwany, przyszedłem bez sprzeciwu. Pytam więc: Dlaczego mnie wezwaliście?"
  tags: []
"Dz10,30":
  text: "A Korneliusz odpowiedział: Cztery dni temu pościłem aż do tej godziny, a gdy o godzinie dziewiątej modliłem się w swoim domu, stanął przede mną pewien mąż w jasnej szacie;"
  tags: []
"Dz10,31":
  text: "I powiedział: Korneliuszu, twoja modlitwa została wysłuchana, a twoje jałmużny dotarły przed oblicze Boga jako przypomnienie."
  tags: []
"Dz10,32":
  text: "Dlatego poślij do Jafy i wezwij Szymona, zwanego Piotrem. Zatrzymał się on w domu Szymona, garbarza, nad morzem. Gdy przyjdzie, będzie z tobą mówić."
  tags: []
"Dz10,33":
  text: "Natychmiast więc posłałem po ciebie, a ty dobrze zrobiłeś, że przyszedłeś. A teraz jesteśmy tu wszyscy obecni przed Bogiem, aby słuchać wszystkiego, co ci Bóg nakazał."
  tags: []
"Dz10,34":
  text: "Wtedy Piotr otworzył usta i powiedział: Prawdziwie dostrzegam, że Bóg nie ma względu na osoby;"
  tags: []
"Dz10,35":
  text: "Ale w każdym narodzie miły jest mu ten, kto się go boi i czyni to, co sprawiedliwe."
  tags: []
"Dz10,36":
  text: "A jeśli chodzi o słowo, które posłał synom Izraela, zwiastując pokój przez Jezusa Chrystusa, który jest Panem wszystkich;"
  tags: []
"Dz10,37":
  text: "Wy wiecie, co się działo w całej Judei, począwszy od Galilei, po chrzcie, który głosił Jan;"
  tags: []
"Dz10,38":
  text: "Jak Bóg namaścił Duchem Świętym i mocą Jezusa z Nazaretu, który chodził, czyniąc dobrze i uzdrawiając wszystkich opanowanych przez diabła, bo Bóg był z nim."
  tags: []
"Dz10,39":
  text: "A my jesteśmy świadkami tego wszystkiego, co czynił w ziemi judzkiej i w Jerozolimie. Jego to zabili, zawiesiwszy na drzewie."
  tags: []
"Dz10,40":
  text: "Jego też wskrzesił Bóg trzeciego dnia i sprawił, żeby się objawił;"
  tags: []
"Dz10,41":
  text: "Nie całemu ludowi, ale świadkom przedtem wybranym przez Boga, nam, którzy z nim jedliśmy i piliśmy po jego zmartwychwstaniu."
  tags: []
"Dz10,42":
  text: "Nakazał nam też głosić ludowi i świadczyć, że on jest ustanowionym przez Boga sędzią żywych i umarłych."
  tags: []
"Dz10,43":
  text: "Temu wszyscy prorocy wydają świadectwo, że przez jego imię każdy, kto w niego wierzy, otrzyma przebaczenie grzechów."
  tags: []
"Dz10,44":
  text: "A gdy jeszcze Piotr mówił te słowa, Duch Święty zstąpił na wszystkich słuchających tej mowy."
  tags: []
"Dz10,45":
  text: "I zdziwili się ci wierzący pochodzący z obrzezania, którzy przyszli z Piotrem, że dar Ducha Świętego został wylany także na pogan."
  tags: []
"Dz10,46":
  text: "Słyszeli ich bowiem mówiących językami i wielbiących Boga. Wtedy Piotr się odezwał:"
  tags: []
"Dz10,47":
  text: "Czy ktoś może odmówić wody, żeby byli ochrzczeni ci, którzy otrzymali Ducha Świętego jak i my?"
  tags: []
"Dz10,48":
  text: "I nakazał ochrzcić ich w imię Pana. I prosili go, aby u nich został kilka dni."
  tags: []
