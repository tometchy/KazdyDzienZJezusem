"Dz14,1": "W Ikonium również weszli do synagogi żydowskiej i mówili tak, że uwierzyła wielka liczba Żydów i Greków."
"Dz14,2": "Lecz Żydzi, którzy nie uwierzyli, podburzyli i rozjątrzyli serca pogan przeciwko braciom."
"Dz14,3": "I byli tam przez długi czas, odważnie mówiąc w Panu, który dawał świadectwo słowu swojej łaski, sprawiając, że przez ich ręce dokonywały się znaki i cuda."
"Dz14,4": "I mieszkańcy miasta podzielili się: jedni byli z Żydami, a drudzy z apostołami."
"Dz14,5": "Kiedy jednak wszczął się rozruch zarówno wśród pogan, jak i Żydów wraz z przełożonymi, i chcieli ich znieważyć, i ukamienować;"
"Dz14,6": "Dowiedzieli się o tym i uciekli do miast Likaonii: do Listry i Derbe oraz w ich okolice;"
"Dz14,7": "I tam głosili ewangelię."
"Dz14,8": "A w Listrze był pewien człowiek o bezwładnych nogach, chromy już w łonie swojej matki i nigdy nie chodził."
"Dz14,9": "Słuchał on przemawiającego Pawła, który przyglądając mu się uważnie i widząc, że ma wiarę, aby zostać uzdrowionym;"
"Dz14,10": "Powiedział donośnym głosem: Stań prosto na nogach! A on zerwał się i zaczął chodzić."
"Dz14,11": "A ludzie, widząc, co uczynił Paweł, zaczęli wołać po likaońsku: Bogowie przybrali postać ludzi i zstąpili do nas!"
"Dz14,12": "I nazwali Barnabę Jowiszem, a Pawła Merkurym, ponieważ on był głównym mówcą."
"Dz14,13": "Wtedy kapłan ze świątyni Jowisza, która była przed miastem, przyprowadził do wrót woły i wieńce i razem z ludem chciał złożyć ofiarę."
"Dz14,14": "Gdy usłyszeli o tym apostołowie Barnaba i Paweł, rozdarli swoje szaty i wpadli między tłum, wołając;"
"Dz14,15": "Ludzie, co robicie? My też jesteśmy ludźmi, podlegamy tym samym doznaniom co wy. Głosimy wam, abyście się odwrócili od tych marności do Boga żywego, który stworzył niebo, ziemię, morze i wszystko, co się w nich znajduje."
"Dz14,16": "Za czasów minionych pozwalał on, aby wszystkie narody chodziły własnymi drogami."
"Dz14,17": "Nie przestawał jednak dawać o sobie świadectwa, czyniąc dobrze. Zsyłał nam z nieba deszcz i urodzajne lata, karmił nas i napełniał radością nasze serca."
"Dz14,18": "Tymi słowami ledwie powstrzymali lud od złożenia im ofiary."
"Dz14,19": "Tymczasem z Antiochii i Ikonium nadeszli Żydzi, którzy namówiwszy lud, ukamienowali Pawła i wywlekli go za miasto, myśląc, że umarł."
"Dz14,20": "Lecz gdy otoczyli go uczniowie, podniósł się i wrócił do miasta, a nazajutrz udał się z Barnabą do Derbe."
"Dz14,21": "Kiedy głosili ewangelię temu miastu i pozyskali wielu uczniów, wrócili do Listry, Ikonium i do Antiochii;"
"Dz14,22": "Umacniając dusze uczniów i zachęcając do trwania w wierze, mówili, że przez wiele utrapień musimy wejść do królestwa Bożego."
"Dz14,23": "A gdy w każdym kościele ustanowili starszych, modląc się i poszcząc, powierzyli ich Panu, w którego uwierzyli."
"Dz14,24": "Potem przeszli przez Pizydię i przybyli do Pamfilii."
"Dz14,25": "I opowiedziawszy słowo Boże w Perge, zeszli do Attalii."
"Dz14,26": "Stamtąd popłynęli do Antiochii, gdzie przedtem zostali poruczeni łasce Boga do dzieła, które wykonali."
"Dz14,27": "A gdy tam przyszli i zebrali kościół, opowiedzieli, co Bóg przez nich uczynił i jak otworzył poganom drzwi wiary."
"Dz14,28": "I mieszkali tam dość długo z uczniami."
