"Dz14,1":
  text: "W Ikonium również weszli do synagogi żydowskiej i mówili tak, że uwierzyła wielka liczba Żydów i Greków."
  tags: []
"Dz14,2":
  text: "Lecz Żydzi, którzy nie uwierzyli, podburzyli i rozjątrzyli serca pogan przeciwko braciom."
  tags: []
"Dz14,3":
  text: "I byli tam przez długi czas, odważnie mówiąc w Panu, który dawał świadectwo słowu swojej łaski, sprawiając, że przez ich ręce dokonywały się znaki i cuda."
  tags: []
"Dz14,4":
  text: "I mieszkańcy miasta podzielili się: jedni byli z Żydami, a drudzy z apostołami."
  tags: []
"Dz14,5":
  text: "Kiedy jednak wszczął się rozruch zarówno wśród pogan, jak i Żydów wraz z przełożonymi, i chcieli ich znieważyć, i ukamienować;"
  tags: []
"Dz14,6":
  text: "Dowiedzieli się o tym i uciekli do miast Likaonii: do Listry i Derbe oraz w ich okolice;"
  tags: []
"Dz14,7":
  text: "I tam głosili ewangelię."
  tags: []
"Dz14,8":
  text: "A w Listrze był pewien człowiek o bezwładnych nogach, chromy już w łonie swojej matki i nigdy nie chodził."
  tags: []
"Dz14,9":
  text: "Słuchał on przemawiającego Pawła, który przyglądając mu się uważnie i widząc, że ma wiarę, aby zostać uzdrowionym;"
  tags: []
"Dz14,10":
  text: "Powiedział donośnym głosem: Stań prosto na nogach! A on zerwał się i zaczął chodzić."
  tags: []
"Dz14,11":
  text: "A ludzie, widząc, co uczynił Paweł, zaczęli wołać po likaońsku: Bogowie przybrali postać ludzi i zstąpili do nas!"
  tags: []
"Dz14,12":
  text: "I nazwali Barnabę Jowiszem, a Pawła Merkurym, ponieważ on był głównym mówcą."
  tags: []
"Dz14,13":
  text: "Wtedy kapłan ze świątyni Jowisza, która była przed miastem, przyprowadził do wrót woły i wieńce i razem z ludem chciał złożyć ofiarę."
  tags: []
"Dz14,14":
  text: "Gdy usłyszeli o tym apostołowie Barnaba i Paweł, rozdarli swoje szaty i wpadli między tłum, wołając;"
  tags: []
"Dz14,15":
  text: "Ludzie, co robicie? My też jesteśmy ludźmi, podlegamy tym samym doznaniom co wy. Głosimy wam, abyście się odwrócili od tych marności do Boga żywego, który stworzył niebo, ziemię, morze i wszystko, co się w nich znajduje."
  tags: []
"Dz14,16":
  text: "Za czasów minionych pozwalał on, aby wszystkie narody chodziły własnymi drogami."
  tags: []
"Dz14,17":
  text: "Nie przestawał jednak dawać o sobie świadectwa, czyniąc dobrze. Zsyłał nam z nieba deszcz i urodzajne lata, karmił nas i napełniał radością nasze serca."
  tags: []
"Dz14,18":
  text: "Tymi słowami ledwie powstrzymali lud od złożenia im ofiary."
  tags: []
"Dz14,19":
  text: "Tymczasem z Antiochii i Ikonium nadeszli Żydzi, którzy namówiwszy lud, ukamienowali Pawła i wywlekli go za miasto, myśląc, że umarł."
  tags: []
"Dz14,20":
  text: "Lecz gdy otoczyli go uczniowie, podniósł się i wrócił do miasta, a nazajutrz udał się z Barnabą do Derbe."
  tags: []
"Dz14,21":
  text: "Kiedy głosili ewangelię temu miastu i pozyskali wielu uczniów, wrócili do Listry, Ikonium i do Antiochii;"
  tags: []
"Dz14,22":
  text: "Umacniając dusze uczniów i zachęcając do trwania w wierze, mówili, że przez wiele utrapień musimy wejść do królestwa Bożego."
  tags: []
"Dz14,23":
  text: "A gdy w każdym kościele ustanowili starszych, modląc się i poszcząc, powierzyli ich Panu, w którego uwierzyli."
  tags: []
"Dz14,24":
  text: "Potem przeszli przez Pizydię i przybyli do Pamfilii."
  tags: []
"Dz14,25":
  text: "I opowiedziawszy słowo Boże w Perge, zeszli do Attalii."
  tags: []
"Dz14,26":
  text: "Stamtąd popłynęli do Antiochii, gdzie przedtem zostali poruczeni łasce Boga do dzieła, które wykonali."
  tags: []
"Dz14,27":
  text: "A gdy tam przyszli i zebrali kościół, opowiedzieli, co Bóg przez nich uczynił i jak otworzył poganom drzwi wiary."
  tags: []
"Dz14,28":
  text: "I mieszkali tam dość długo z uczniami."
  tags: []
