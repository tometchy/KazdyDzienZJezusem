"Dz16,1": "Przybył do Derbe i Listry. A oto był tam pewien uczeń imieniem Tymoteusz, syn pewnej Żydówki, która uwierzyła, ojca natomiast Greka."
"Dz16,2": "Bracia z Listry i Ikonium dawali o nim dobre świadectwo."
"Dz16,3": "Paweł chciał go zabrać ze sobą, więc obrzezał go ze względu na Żydów, którzy mieszkali w tamtych stronach. Wszyscy bowiem wiedzieli, że jego ojciec był Grekiem."
"Dz16,4": "A gdy chodzili po miastach, przekazywali im nakazy ustanowione przez apostołów i starszych w Jerozolimie, których mieli przestrzegać."
"Dz16,5": "I tak kościoły utwierdzały się w wierze i każdego dnia wzrastały liczebnie."
"Dz16,6": "Gdy przeszli Frygię i krainę galacką, Duch Święty zabronił im głosić słowo Boże w Azji."
"Dz16,7": "Gdy przybyli do Myzji, próbowali pójść do Bitynii, ale im Duch nie pozwolił."
"Dz16,8": "Przeszli więc Myzję i zeszli do Troady."
"Dz16,9": "I w nocy Paweł miał widzenie: jakiś Macedończyk stał i prosił go: Przepraw się do Macedonii i pomóż nam!"
"Dz16,10": "Zaraz po tym widzeniu staraliśmy się wyruszyć do Macedonii, będąc tego pewni, że Pan nas powołał, abyśmy im głosili ewangelię."
"Dz16,11": "Odpłynąwszy więc z Troady, zdążaliśmy wprost do Samotraki, a nazajutrz do Neapolu;"
"Dz16,12": "Stamtąd zaś do Filippi, rzymskiej kolonii i głównego miasta tej części Macedonii, i zostaliśmy w tym mieście przez kilka dni."
"Dz16,13": "A w dzień szabatu wyszliśmy za miasto nad rzekę, gdzie zwykle odbywały się modlitwy. Usiedliśmy i rozmawialiśmy z kobietami, które się tam zeszły."
"Dz16,14": "Przysłuchiwała się temu też pewna bogobojna kobieta, imieniem Lidia, z miasta Tiatyry, sprzedająca purpurę, której to serce otworzył Pan, aby uważnie słuchała tego, co mówił Paweł."
"Dz16,15": "A gdy została ochrzczona razem ze swoim domem, poprosiła: Jeśli uznaliście mnie za wierną Panu, wejdźcie do mojego domu i zamieszkajcie w nim. I wymogła to na nas."
"Dz16,16": "I stało się, gdy szliśmy na modlitwę, że zabiegła nam drogę pewna dziewczyna, która miała ducha wieszczego i swoimi wróżbami przynosiła wielki dochód swoim panom."
"Dz16,17": "A chodząc za Pawłem i za nami, wołała: Ci ludzie są sługami Boga Najwyższego i zwiastują nam drogę zbawienia."
"Dz16,18": "A robiła to przez wiele dni. Lecz Paweł, bolejąc nad tym, odwrócił się i powiedział do ducha: Rozkazuję ci w imię Jezusa Chrystusa, abyś z niej wyszedł. I w tej chwili wyszedł."
"Dz16,19": "Gdy jej panowie zobaczyli, że przepadła nadzieja ich zysku, schwytali Pawła i Sylasa, zawlekli ich na rynek przed władzę;"
"Dz16,20": "Stawili ich przed pretorami i powiedzieli: Ci ludzie, którzy są Żydami, sieją zamęt w naszym mieście."
"Dz16,21": "I głoszą zwyczaje, których nam, jako Rzymianom, nie wolno przyjmować ani zachowywać."
"Dz16,22": "I wystąpił tłum przeciwko nim, a pretorzy zdarli z nich szaty i kazali wychłostać ich rózgami."
"Dz16,23": "Po wymierzeniu wielu razów wtrącili ich do więzienia, przykazując strażnikowi, żeby ich dobrze pilnował."
"Dz16,24": "Otrzymawszy taki rozkaz, wtrącił ich do wewnętrznego lochu, a ich nogi zakuł w dyby."
"Dz16,25": "O północy Paweł i Sylas modlili się i śpiewem chwalili Boga, a więźniowie słyszeli ich."
"Dz16,26": "Nagle powstało silne trzęsienie ziemi, tak że zachwiały się fundamenty więzienia. I natychmiast otworzyły się wszystkie drzwi i wszystkim rozwiązały się więzy."
"Dz16,27": "A gdy strażnik więzienia obudził się i zobaczył otwarte drzwi więzienia, dobył miecz i chciał się zabić, sądząc, że więźniowie pouciekali."
"Dz16,28": "Lecz Paweł zawołał donośnym głosem: Nie rób sobie nic złego, bo jesteśmy tu wszyscy."
"Dz16,29": "Wtedy zażądał światła i wskoczył do środka, a drżąc, padł do nóg Pawła i Sylasa."
"Dz16,30": "A wyprowadziwszy ich z więzienia, powiedział: Panowie, co mam czynić, abym był zbawiony?"
"Dz16,31": "A oni odpowiedzieli: Uwierz w Pana Jezusa Chrystusa, a będziesz zbawiony, ty i twój dom."
"Dz16,32": "I głosili słowo Pańskie jemu i wszystkim jego domownikom."
"Dz16,33": "Tej samej godziny w nocy wziął ich ze sobą, obmył ich rany i natychmiast się ochrzcił, on i wszyscy jego domownicy."
"Dz16,34": "Wprowadził ich do swego domu, zastawił przed nimi stół i weselił się, uwierzywszy Bogu z całym swoim domem."
"Dz16,35": "Kiedy nastał dzień, pretorzy posłali służbę miejską ze słowami: Zwolnij tych ludzi."
"Dz16,36": "I strażnik więzienia oznajmił Pawłowi: Pretorzy przysłali polecenie, żeby was wypuścić. Teraz więc wyjdźcie i idźcie w pokoju."
"Dz16,37": "Lecz Paweł powiedział do nich: Publicznie, bez sądu biczowali i wtrącili do więzienia nas, obywateli rzymskich, a teraz potajemnie nas wyrzucają? Nic z tego! Niech sami przyjdą i wyprowadzą nas."
"Dz16,38": "Słudzy miejscy przekazali te słowa pretorom. A gdy tamci usłyszeli, że są Rzymianami, przestraszyli się."
"Dz16,39": "Przyszli, przeprosili ich i wyprowadziwszy, prosili, aby opuścili miasto."
"Dz16,40": "Kiedy wyszli z więzienia, wstąpili do domu Lidii, a gdy zobaczyli się z braćmi, pocieszyli ich i odeszli."
