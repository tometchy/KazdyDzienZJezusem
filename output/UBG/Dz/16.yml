"Dz16,1":
  text: "Przybył do Derbe i Listry. A oto był tam pewien uczeń imieniem Tymoteusz, syn pewnej Żydówki, która uwierzyła, ojca natomiast Greka."
  tags: []
"Dz16,2":
  text: "Bracia z Listry i Ikonium dawali o nim dobre świadectwo."
  tags: []
"Dz16,3":
  text: "Paweł chciał go zabrać ze sobą, więc obrzezał go ze względu na Żydów, którzy mieszkali w tamtych stronach. Wszyscy bowiem wiedzieli, że jego ojciec był Grekiem."
  tags: []
"Dz16,4":
  text: "A gdy chodzili po miastach, przekazywali im nakazy ustanowione przez apostołów i starszych w Jerozolimie, których mieli przestrzegać."
  tags: []
"Dz16,5":
  text: "I tak kościoły utwierdzały się w wierze i każdego dnia wzrastały liczebnie."
  tags: []
"Dz16,6":
  text: "Gdy przeszli Frygię i krainę galacką, Duch Święty zabronił im głosić słowo Boże w Azji."
  tags: []
"Dz16,7":
  text: "Gdy przybyli do Myzji, próbowali pójść do Bitynii, ale im Duch nie pozwolił."
  tags: []
"Dz16,8":
  text: "Przeszli więc Myzję i zeszli do Troady."
  tags: []
"Dz16,9":
  text: "I w nocy Paweł miał widzenie: jakiś Macedończyk stał i prosił go: Przepraw się do Macedonii i pomóż nam!"
  tags: []
"Dz16,10":
  text: "Zaraz po tym widzeniu staraliśmy się wyruszyć do Macedonii, będąc tego pewni, że Pan nas powołał, abyśmy im głosili ewangelię."
  tags: []
"Dz16,11":
  text: "Odpłynąwszy więc z Troady, zdążaliśmy wprost do Samotraki, a nazajutrz do Neapolu;"
  tags: []
"Dz16,12":
  text: "Stamtąd zaś do Filippi, rzymskiej kolonii i głównego miasta tej części Macedonii, i zostaliśmy w tym mieście przez kilka dni."
  tags: []
"Dz16,13":
  text: "A w dzień szabatu wyszliśmy za miasto nad rzekę, gdzie zwykle odbywały się modlitwy. Usiedliśmy i rozmawialiśmy z kobietami, które się tam zeszły."
  tags: []
"Dz16,14":
  text: "Przysłuchiwała się temu też pewna bogobojna kobieta, imieniem Lidia, z miasta Tiatyry, sprzedająca purpurę, której to serce otworzył Pan, aby uważnie słuchała tego, co mówił Paweł."
  tags: []
"Dz16,15":
  text: "A gdy została ochrzczona razem ze swoim domem, poprosiła: Jeśli uznaliście mnie za wierną Panu, wejdźcie do mojego domu i zamieszkajcie w nim. I wymogła to na nas."
  tags: []
"Dz16,16":
  text: "I stało się, gdy szliśmy na modlitwę, że zabiegła nam drogę pewna dziewczyna, która miała ducha wieszczego i swoimi wróżbami przynosiła wielki dochód swoim panom."
  tags: []
"Dz16,17":
  text: "A chodząc za Pawłem i za nami, wołała: Ci ludzie są sługami Boga Najwyższego i zwiastują nam drogę zbawienia."
  tags: []
"Dz16,18":
  text: "A robiła to przez wiele dni. Lecz Paweł, bolejąc nad tym, odwrócił się i powiedział do ducha: Rozkazuję ci w imię Jezusa Chrystusa, abyś z niej wyszedł. I w tej chwili wyszedł."
  tags: []
"Dz16,19":
  text: "Gdy jej panowie zobaczyli, że przepadła nadzieja ich zysku, schwytali Pawła i Sylasa, zawlekli ich na rynek przed władzę;"
  tags: []
"Dz16,20":
  text: "Stawili ich przed pretorami i powiedzieli: Ci ludzie, którzy są Żydami, sieją zamęt w naszym mieście."
  tags: []
"Dz16,21":
  text: "I głoszą zwyczaje, których nam, jako Rzymianom, nie wolno przyjmować ani zachowywać."
  tags: []
"Dz16,22":
  text: "I wystąpił tłum przeciwko nim, a pretorzy zdarli z nich szaty i kazali wychłostać ich rózgami."
  tags: []
"Dz16,23":
  text: "Po wymierzeniu wielu razów wtrącili ich do więzienia, przykazując strażnikowi, żeby ich dobrze pilnował."
  tags: []
"Dz16,24":
  text: "Otrzymawszy taki rozkaz, wtrącił ich do wewnętrznego lochu, a ich nogi zakuł w dyby."
  tags: []
"Dz16,25":
  text: "O północy Paweł i Sylas modlili się i śpiewem chwalili Boga, a więźniowie słyszeli ich."
  tags: []
"Dz16,26":
  text: "Nagle powstało silne trzęsienie ziemi, tak że zachwiały się fundamenty więzienia. I natychmiast otworzyły się wszystkie drzwi i wszystkim rozwiązały się więzy."
  tags: []
"Dz16,27":
  text: "A gdy strażnik więzienia obudził się i zobaczył otwarte drzwi więzienia, dobył miecz i chciał się zabić, sądząc, że więźniowie pouciekali."
  tags: []
"Dz16,28":
  text: "Lecz Paweł zawołał donośnym głosem: Nie rób sobie nic złego, bo jesteśmy tu wszyscy."
  tags: []
"Dz16,29":
  text: "Wtedy zażądał światła i wskoczył do środka, a drżąc, padł do nóg Pawła i Sylasa."
  tags: []
"Dz16,30":
  text: "A wyprowadziwszy ich z więzienia, powiedział: Panowie, co mam czynić, abym był zbawiony?"
  tags: []
"Dz16,31":
  text: "A oni odpowiedzieli: Uwierz w Pana Jezusa Chrystusa, a będziesz zbawiony, ty i twój dom."
  tags: []
"Dz16,32":
  text: "I głosili słowo Pańskie jemu i wszystkim jego domownikom."
  tags: []
"Dz16,33":
  text: "Tej samej godziny w nocy wziął ich ze sobą, obmył ich rany i natychmiast się ochrzcił, on i wszyscy jego domownicy."
  tags: []
"Dz16,34":
  text: "Wprowadził ich do swego domu, zastawił przed nimi stół i weselił się, uwierzywszy Bogu z całym swoim domem."
  tags: []
"Dz16,35":
  text: "Kiedy nastał dzień, pretorzy posłali służbę miejską ze słowami: Zwolnij tych ludzi."
  tags: []
"Dz16,36":
  text: "I strażnik więzienia oznajmił Pawłowi: Pretorzy przysłali polecenie, żeby was wypuścić. Teraz więc wyjdźcie i idźcie w pokoju."
  tags: []
"Dz16,37":
  text: "Lecz Paweł powiedział do nich: Publicznie, bez sądu biczowali i wtrącili do więzienia nas, obywateli rzymskich, a teraz potajemnie nas wyrzucają? Nic z tego! Niech sami przyjdą i wyprowadzą nas."
  tags: []
"Dz16,38":
  text: "Słudzy miejscy przekazali te słowa pretorom. A gdy tamci usłyszeli, że są Rzymianami, przestraszyli się."
  tags: []
"Dz16,39":
  text: "Przyszli, przeprosili ich i wyprowadziwszy, prosili, aby opuścili miasto."
  tags: []
"Dz16,40":
  text: "Kiedy wyszli z więzienia, wstąpili do domu Lidii, a gdy zobaczyli się z braćmi, pocieszyli ich i odeszli."
  tags: []
