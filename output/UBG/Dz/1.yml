"Dz1,1":
  text: "Pierwszą księgę napisałem, Teofilu, o wszystkim, co Jezus zaczął czynić i czego nauczać;"
  tags: []
"Dz1,2":
  text: "Aż do dnia, w którym został wzięty w górę po tym, jak przez Ducha Świętego udzielił poleceń apostołom, których wybrał."
  tags: []
"Dz1,3":
  text: "Im też po swojej męce objawił się jako żywy w wielu niewątpliwych dowodach, przez czterdzieści dni ukazując się im i mówiąc o królestwie Bożym."
  tags: []
"Dz1,4":
  text: "A gdy byli zebrani razem, nakazał im: Nie odchodźcie z Jerozolimy, ale oczekujcie obietnicy Ojca, o której słyszeliście ode mnie."
  tags: []
"Dz1,5":
  text: "Jan bowiem chrzcił wodą, ale wy po niewielu dniach będziecie ochrzczeni Duchem Świętym."
  tags: []
"Dz1,6":
  text: "Tak więc zebrani pytali go: Panie, czy w tym czasie przywrócisz królestwo Izraelowi?"
  tags: []
"Dz1,7":
  text: "Lecz on im odpowiedział: Nie do was należy znać czasy i pory, które Ojciec ustanowił swoją władzą."
  tags: []
"Dz1,8":
  text: "Ale przyjmiecie moc Ducha Świętego, który zstąpi na was, i będziecie mi świadkami w Jerozolimie, w całej Judei, w Samarii i aż po krańce ziemi."
  tags: []
"Dz1,9":
  text: "Kiedy to powiedział, a oni patrzyli, został uniesiony w górę i obłok zabrał go sprzed ich oczu."
  tags: []
"Dz1,10":
  text: "A gdy się wpatrywali w niebo, jak wstępował, oto stanęli przy nich dwaj mężowie w białych szatach;"
  tags: []
"Dz1,11":
  text: "I powiedzieli: Mężowie z Galilei, dlaczego stoicie, wpatrując się w niebo? Ten Jezus, który został od was wzięty w górę do nieba, przyjdzie tak samo, jak go widzieliście wstępującego do nieba."
  tags: []
"Dz1,12":
  text: "Wtedy wrócili do Jerozolimy z góry zwanej Oliwną, która leży blisko Jerozolimy, w odległości drogi szabatowej."
  tags: []
"Dz1,13":
  text: "A gdy przyszli, weszli do sali na górze, gdzie przebywali Piotr i Jakub, Jan i Andrzej, Filip i Tomasz, Bartłomiej i Mateusz, Jakub, syn Alfeusza, i Szymon Zelota oraz Juda, brat Jakuba."
  tags: []
"Dz1,14":
  text: "Ci wszyscy trwali jednomyślnie w modlitwie i prośbach razem z kobietami, z Marią, matką Jezusa, i jego braćmi."
  tags: []
"Dz1,15":
  text: "W tych dniach Piotr stanął pośród uczniów (a było zgromadzonych około stu dwudziestu osób) i powiedział:"
  tags: []
"Dz1,16":
  text: "Mężowie bracia, musiało się wypełnić słowo Pisma, w którym Duch Święty zapowiedział przez usta Dawida o Judaszu, który był przewodnikiem tych, którzy schwytali Jezusa."
  tags: []
"Dz1,17":
  text: "Zaliczał się on bowiem do nas i miał udział w tym posługiwaniu."
  tags: []
"Dz1,18":
  text: "On nabył pole za zapłatę za nieprawość i spadłszy głową w dół, pękł na pół i wypłynęły wszystkie jego wnętrzności."
  tags: []
"Dz1,19":
  text: "Rozniosło się to wśród wszystkich mieszkańców Jerozolimy, tak że nazwano to pole w ich języku Hakeldamach, to znaczy: Pole Krwi."
  tags: []
"Dz1,20":
  text: "Jest bowiem napisane w Księdze Psalmów: Niech jego dom będzie pusty, niech nikt w nim nie mieszka; oraz: Jego biskupstwo niech przejmie inny."
  tags: []
"Dz1,21":
  text: "Trzeba więc, aby jeden z tych mężczyzn, którzy z nami byli przez cały czas, kiedy Pan Jezus przebywał wśród nas;"
  tags: []
"Dz1,22":
  text: "Począwszy od chrztu Jana aż do dnia, w którym został wzięty od nas w górę, stał się wraz z nami świadkiem jego zmartwychwstania."
  tags: []
"Dz1,23":
  text: "I wybrali dwóch: Józefa, zwanego Barsabą, z przydomkiem Justus, i Macieja."
  tags: []
"Dz1,24":
  text: "I tak się modlili: Ty, Panie, który znasz serca wszystkich, wskaż z tych dwóch jednego, którego wybrałeś;"
  tags: []
"Dz1,25":
  text: "Aby zajął miejsce w tym posługiwaniu i apostolstwie, któremu sprzeniewierzył się Judasz, aby odejść na swoje miejsce."
  tags: []
"Dz1,26":
  text: "I dali im losy, a los padł na Macieja. I został przyłączony do jedenastu apostołów."
  tags: []
