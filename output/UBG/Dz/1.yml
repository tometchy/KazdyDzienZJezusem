"Dz1,1": "Pierwszą księgę napisałem, Teofilu, o wszystkim, co Jezus zaczął czynić i czego nauczać;"
"Dz1,2": "Aż do dnia, w którym został wzięty w górę po tym, jak przez Ducha Świętego udzielił poleceń apostołom, których wybrał."
"Dz1,3": "Im też po swojej męce objawił się jako żywy w wielu niewątpliwych dowodach, przez czterdzieści dni ukazując się im i mówiąc o królestwie Bożym."
"Dz1,4": "A gdy byli zebrani razem, nakazał im: Nie odchodźcie z Jerozolimy, ale oczekujcie obietnicy Ojca, o której słyszeliście ode mnie."
"Dz1,5": "Jan bowiem chrzcił wodą, ale wy po niewielu dniach będziecie ochrzczeni Duchem Świętym."
"Dz1,6": "Tak więc zebrani pytali go: Panie, czy w tym czasie przywrócisz królestwo Izraelowi?"
"Dz1,7": "Lecz on im odpowiedział: Nie do was należy znać czasy i pory, które Ojciec ustanowił swoją władzą."
"Dz1,8": "Ale przyjmiecie moc Ducha Świętego, który zstąpi na was, i będziecie mi świadkami w Jerozolimie, w całej Judei, w Samarii i aż po krańce ziemi."
"Dz1,9": "Kiedy to powiedział, a oni patrzyli, został uniesiony w górę i obłok zabrał go sprzed ich oczu."
"Dz1,10": "A gdy się wpatrywali w niebo, jak wstępował, oto stanęli przy nich dwaj mężowie w białych szatach;"
"Dz1,11": "I powiedzieli: Mężowie z Galilei, dlaczego stoicie, wpatrując się w niebo? Ten Jezus, który został od was wzięty w górę do nieba, przyjdzie tak samo, jak go widzieliście wstępującego do nieba."
"Dz1,12": "Wtedy wrócili do Jerozolimy z góry zwanej Oliwną, która leży blisko Jerozolimy, w odległości drogi szabatowej."
"Dz1,13": "A gdy przyszli, weszli do sali na górze, gdzie przebywali Piotr i Jakub, Jan i Andrzej, Filip i Tomasz, Bartłomiej i Mateusz, Jakub, syn Alfeusza, i Szymon Zelota oraz Juda, brat Jakuba."
"Dz1,14": "Ci wszyscy trwali jednomyślnie w modlitwie i prośbach razem z kobietami, z Marią, matką Jezusa, i jego braćmi."
"Dz1,15": "W tych dniach Piotr stanął pośród uczniów (a było zgromadzonych około stu dwudziestu osób) i powiedział:"
"Dz1,16": "Mężowie bracia, musiało się wypełnić słowo Pisma, w którym Duch Święty zapowiedział przez usta Dawida o Judaszu, który był przewodnikiem tych, którzy schwytali Jezusa."
"Dz1,17": "Zaliczał się on bowiem do nas i miał udział w tym posługiwaniu."
"Dz1,18": "On nabył pole za zapłatę za nieprawość i spadłszy głową w dół, pękł na pół i wypłynęły wszystkie jego wnętrzności."
"Dz1,19": "Rozniosło się to wśród wszystkich mieszkańców Jerozolimy, tak że nazwano to pole w ich języku Hakeldamach, to znaczy: Pole Krwi."
"Dz1,20": "Jest bowiem napisane w Księdze Psalmów: Niech jego dom będzie pusty, niech nikt w nim nie mieszka; oraz: Jego biskupstwo niech przejmie inny."
"Dz1,21": "Trzeba więc, aby jeden z tych mężczyzn, którzy z nami byli przez cały czas, kiedy Pan Jezus przebywał wśród nas;"
"Dz1,22": "Począwszy od chrztu Jana aż do dnia, w którym został wzięty od nas w górę, stał się wraz z nami świadkiem jego zmartwychwstania."
"Dz1,23": "I wybrali dwóch: Józefa, zwanego Barsabą, z przydomkiem Justus, i Macieja."
"Dz1,24": "I tak się modlili: Ty, Panie, który znasz serca wszystkich, wskaż z tych dwóch jednego, którego wybrałeś;"
"Dz1,25": "Aby zajął miejsce w tym posługiwaniu i apostolstwie, któremu sprzeniewierzył się Judasz, aby odejść na swoje miejsce."
"Dz1,26": "I dali im losy, a los padł na Macieja. I został przyłączony do jedenastu apostołów."
