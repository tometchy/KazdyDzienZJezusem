"Dz4,1": "A gdy mówili to do ludzi, nadeszli kapłani, dowódca straży świątynnej i saduceusze;"
"Dz4,2": "Oburzeni, że nauczają ludzi i głoszą w Jezusie powstanie z martwych."
"Dz4,3": "Schwytali ich i wtrącili do więzienia aż do następnego dnia, bo był już wieczór."
"Dz4,4": "A wielu z tych, którzy słyszeli słowo, uwierzyło. A mężczyzn było w liczbie około pięciu tysięcy."
"Dz4,5": "Nazajutrz zebrali się w Jerozolimie ich przełożeni, starsi i uczeni w Piśmie;"
"Dz4,6": "I Annasz, najwyższy kapłan, i Kajfasz, Jan, Aleksander i ilu ich było z rodu najwyższych kapłanów."
"Dz4,7": "Postawili ich na środku i pytali: Jaką mocą albo w czyim imieniu to uczyniliście?"
"Dz4,8": "Wtedy Piotr, pełen Ducha Świętego, powiedział do nich: Przełożeni ludu i starsi Izraela;"
"Dz4,9": "Jeśli my dziś mamy być przesłuchiwani z powodu dobrodziejstwa wyświadczonego choremu człowiekowi, dzięki czemu został on uzdrowiony;"
"Dz4,10": "Niech wam wszystkim i całemu ludowi Izraela będzie wiadomo, że w imieniu Jezusa Chrystusa z Nazaretu, którego wy ukrzyżowaliście, a którego Bóg wskrzesił z martwych, przez niego on stoi przed wami zdrowy."
"Dz4,11": "On jest tym kamieniem odrzuconym przez was, budujących, który stał się kamieniem węgielnym."
"Dz4,12": "I nie ma w nikim innym zbawienia. Nie ma bowiem pod niebem żadnego innego imienia danego ludziom, przez które moglibyśmy być zbawieni."
"Dz4,13": "Gdy zobaczyli odwagę Piotra i Jana i zrozumieli, że są ludźmi nieuczonymi i prostymi, dziwili się. Rozpoznali również, że byli z Jezusem."
"Dz4,14": "Widząc też, że stoi z nimi uzdrowiony człowiek, nie mogli nic przeciwko temu powiedzieć."
"Dz4,15": "Rozkazali im więc opuścić Radę i naradzali się między sobą."
"Dz4,16": "Mówili: Co zrobimy z tymi ludźmi? Bo to, że dokonali oczywistego cudu, wiadomo wszystkim mieszkańcom Jerozolimy i nie możemy temu zaprzeczyć."
"Dz4,17": "Lecz żeby się to bardziej nie rozchodziło wśród ludzi, zabrońmy im pod groźbą mówić do kogokolwiek w to imię."
"Dz4,18": "A przywoławszy ich, nakazali, aby w ogóle nie mówili ani nie nauczali w imię Jezusa."
"Dz4,19": "Lecz Piotr i Jan odpowiedzieli im: Rozsądźcie, czy to sprawiedliwe w oczach Boga bardziej was słuchać niż Boga."
"Dz4,20": "My bowiem nie możemy nie mówić o tym, co widzieliśmy i słyszeliśmy."
"Dz4,21": "A oni zagrozili im, a nie znajdując żadnej podstawy do ich ukarania, wypuścili ich ze względu na ludzi, bo wszyscy chwalili Boga za to, co się stało."
"Dz4,22": "Człowiek bowiem, na którym dokonał się cud uzdrowienia, miał ponad czterdzieści lat."
"Dz4,23": "A gdy ich wypuszczono, przyszli do swoich i opowiedzieli im wszystko, co do nich mówili naczelni kapłani i starsi."
"Dz4,24": "A gdy oni to usłyszeli, jednomyślnie podnieśli swój głos do Boga i powiedzieli: Panie, ty jesteś Bogiem, który uczynił niebo, ziemię, morze i wszystko, co w nich jest;"
"Dz4,25": "Który przez usta swego sługi Dawida powiedziałeś: Dlaczego burzą się narody, a ludzie knują próżne rzeczy?"
"Dz4,26": "Królowie ziemi powstali i książęta zebrali się razem przeciw Panu i przeciw jego Chrystusowi."
"Dz4,27": "Rzeczywiście bowiem Herod i Poncjusz Piłat z poganami i ludem Izraela zebrali się przeciwko twemu świętemu Synowi, Jezusowi, którego namaściłeś;"
"Dz4,28": "Aby uczynić to, co twoja ręka i twój wyrok przedtem postanowiły, że ma się stać."
"Dz4,29": "A teraz, Panie, spójrz na ich groźby i daj twoim sługom z całą odwagą głosić twoje słowo;"
"Dz4,30": "Gdy ty wyciągniesz swoją rękę, aby uzdrawiać i dokonywać znaków i cudów przez imię twego świętego Syna, Jezusa."
"Dz4,31": "A gdy oni się modlili, zatrzęsło się miejsce, na którym byli zebrani, i wszyscy zostali napełnieni Duchem Świętym, i z odwagą głosili słowo Boże."
"Dz4,32": "A to mnóstwo wierzących miało jedno serce i jedną duszę. Nikt nie nazywał swoim tego, co posiadał, ale wszystko mieli wspólne."
"Dz4,33": "Apostołowie zaś z wielką mocą dawali świadectwo o zmartwychwstaniu Pana Jezusa i wielka łaska była nad nimi wszystkimi."
"Dz4,34": "Nie było też wśród nich nikogo, kto by cierpiał niedostatek, gdyż ci, którzy mieli pola albo domy, sprzedawali je i przynosili pieniądze za to, co posprzedawali;"
"Dz4,35": "I kładli u stóp apostołów. Rozdzielano to każdemu według potrzeb."
"Dz4,36": "Także Józef, nazwany przez apostołów Barnabą – co się tłumaczy: Syn Pocieszenia – lewita rodem z Cypru;"
"Dz4,37": "Sprzedał ziemię, którą posiadał, a pieniądze przyniósł i położył u stóp apostołów."
