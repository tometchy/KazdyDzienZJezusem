"Dz4,1":
  text: "A gdy mówili to do ludzi, nadeszli kapłani, dowódca straży świątynnej i saduceusze;"
  tags: []
"Dz4,2":
  text: "Oburzeni, że nauczają ludzi i głoszą w Jezusie powstanie z martwych."
  tags: []
"Dz4,3":
  text: "Schwytali ich i wtrącili do więzienia aż do następnego dnia, bo był już wieczór."
  tags: []
"Dz4,4":
  text: "A wielu z tych, którzy słyszeli słowo, uwierzyło. A mężczyzn było w liczbie około pięciu tysięcy."
  tags: []
"Dz4,5":
  text: "Nazajutrz zebrali się w Jerozolimie ich przełożeni, starsi i uczeni w Piśmie;"
  tags: []
"Dz4,6":
  text: "I Annasz, najwyższy kapłan, i Kajfasz, Jan, Aleksander i ilu ich było z rodu najwyższych kapłanów."
  tags: []
"Dz4,7":
  text: "Postawili ich na środku i pytali: Jaką mocą albo w czyim imieniu to uczyniliście?"
  tags: []
"Dz4,8":
  text: "Wtedy Piotr, pełen Ducha Świętego, powiedział do nich: Przełożeni ludu i starsi Izraela;"
  tags: []
"Dz4,9":
  text: "Jeśli my dziś mamy być przesłuchiwani z powodu dobrodziejstwa wyświadczonego choremu człowiekowi, dzięki czemu został on uzdrowiony;"
  tags: []
"Dz4,10":
  text: "Niech wam wszystkim i całemu ludowi Izraela będzie wiadomo, że w imieniu Jezusa Chrystusa z Nazaretu, którego wy ukrzyżowaliście, a którego Bóg wskrzesił z martwych, przez niego on stoi przed wami zdrowy."
  tags: []
"Dz4,11":
  text: "On jest tym kamieniem odrzuconym przez was, budujących, który stał się kamieniem węgielnym."
  tags: []
"Dz4,12":
  text: "I nie ma w nikim innym zbawienia. Nie ma bowiem pod niebem żadnego innego imienia danego ludziom, przez które moglibyśmy być zbawieni."
  tags: []
"Dz4,13":
  text: "Gdy zobaczyli odwagę Piotra i Jana i zrozumieli, że są ludźmi nieuczonymi i prostymi, dziwili się. Rozpoznali również, że byli z Jezusem."
  tags: []
"Dz4,14":
  text: "Widząc też, że stoi z nimi uzdrowiony człowiek, nie mogli nic przeciwko temu powiedzieć."
  tags: []
"Dz4,15":
  text: "Rozkazali im więc opuścić Radę i naradzali się między sobą."
  tags: []
"Dz4,16":
  text: "Mówili: Co zrobimy z tymi ludźmi? Bo to, że dokonali oczywistego cudu, wiadomo wszystkim mieszkańcom Jerozolimy i nie możemy temu zaprzeczyć."
  tags: []
"Dz4,17":
  text: "Lecz żeby się to bardziej nie rozchodziło wśród ludzi, zabrońmy im pod groźbą mówić do kogokolwiek w to imię."
  tags: []
"Dz4,18":
  text: "A przywoławszy ich, nakazali, aby w ogóle nie mówili ani nie nauczali w imię Jezusa."
  tags: []
"Dz4,19":
  text: "Lecz Piotr i Jan odpowiedzieli im: Rozsądźcie, czy to sprawiedliwe w oczach Boga bardziej was słuchać niż Boga."
  tags: []
"Dz4,20":
  text: "My bowiem nie możemy nie mówić o tym, co widzieliśmy i słyszeliśmy."
  tags: []
"Dz4,21":
  text: "A oni zagrozili im, a nie znajdując żadnej podstawy do ich ukarania, wypuścili ich ze względu na ludzi, bo wszyscy chwalili Boga za to, co się stało."
  tags: []
"Dz4,22":
  text: "Człowiek bowiem, na którym dokonał się cud uzdrowienia, miał ponad czterdzieści lat."
  tags: []
"Dz4,23":
  text: "A gdy ich wypuszczono, przyszli do swoich i opowiedzieli im wszystko, co do nich mówili naczelni kapłani i starsi."
  tags: []
"Dz4,24":
  text: "A gdy oni to usłyszeli, jednomyślnie podnieśli swój głos do Boga i powiedzieli: Panie, ty jesteś Bogiem, który uczynił niebo, ziemię, morze i wszystko, co w nich jest;"
  tags: []
"Dz4,25":
  text: "Który przez usta swego sługi Dawida powiedziałeś: Dlaczego burzą się narody, a ludzie knują próżne rzeczy?"
  tags: []
"Dz4,26":
  text: "Królowie ziemi powstali i książęta zebrali się razem przeciw Panu i przeciw jego Chrystusowi."
  tags: []
"Dz4,27":
  text: "Rzeczywiście bowiem Herod i Poncjusz Piłat z poganami i ludem Izraela zebrali się przeciwko twemu świętemu Synowi, Jezusowi, którego namaściłeś;"
  tags: []
"Dz4,28":
  text: "Aby uczynić to, co twoja ręka i twój wyrok przedtem postanowiły, że ma się stać."
  tags: []
"Dz4,29":
  text: "A teraz, Panie, spójrz na ich groźby i daj twoim sługom z całą odwagą głosić twoje słowo;"
  tags: []
"Dz4,30":
  text: "Gdy ty wyciągniesz swoją rękę, aby uzdrawiać i dokonywać znaków i cudów przez imię twego świętego Syna, Jezusa."
  tags: []
"Dz4,31":
  text: "A gdy oni się modlili, zatrzęsło się miejsce, na którym byli zebrani, i wszyscy zostali napełnieni Duchem Świętym, i z odwagą głosili słowo Boże."
  tags: []
"Dz4,32":
  text: "A to mnóstwo wierzących miało jedno serce i jedną duszę. Nikt nie nazywał swoim tego, co posiadał, ale wszystko mieli wspólne."
  tags: []
"Dz4,33":
  text: "Apostołowie zaś z wielką mocą dawali świadectwo o zmartwychwstaniu Pana Jezusa i wielka łaska była nad nimi wszystkimi."
  tags: []
"Dz4,34":
  text: "Nie było też wśród nich nikogo, kto by cierpiał niedostatek, gdyż ci, którzy mieli pola albo domy, sprzedawali je i przynosili pieniądze za to, co posprzedawali;"
  tags: []
"Dz4,35":
  text: "I kładli u stóp apostołów. Rozdzielano to każdemu według potrzeb."
  tags: []
"Dz4,36":
  text: "Także Józef, nazwany przez apostołów Barnabą – co się tłumaczy: Syn Pocieszenia – lewita rodem z Cypru;"
  tags: []
"Dz4,37":
  text: "Sprzedał ziemię, którą posiadał, a pieniądze przyniósł i położył u stóp apostołów."
  tags: []
