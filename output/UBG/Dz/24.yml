"Dz24,1":
  text: "Po pięciu dniach przybył najwyższy kapłan Ananiasz wraz ze starszymi i z retorem, niejakim Tertullosem. Wnieśli oni przed namiestnika oskarżenie przeciwko Pawłowi."
  tags: []
"Dz24,2":
  text: "A gdy go wezwano, Tertullos rozpoczął mowę oskarżycielską: Ponieważ dzięki tobie cieszymy się zupełnym pokojem i dzięki twojej przezorności nasz naród doświadcza wiele dobrego;"
  tags: []
"Dz24,3":
  text: "Przyznajemy to zawsze i wszędzie, dostojny Feliksie, z wielką wdzięcznością."
  tags: []
"Dz24,4":
  text: "Aby cię jednak dłużej nie zatrzymywać, proszę, abyś nas w swej łaskawości przez chwilę posłuchał."
  tags: []
"Dz24,5":
  text: "Stwierdziliśmy, że ten człowiek jest jak zaraza, wzbudza niepokoje wśród wszystkich Żydów na całym świecie i jest dowódcą sekty nazarejczyków."
  tags: []
"Dz24,6":
  text: "Usiłował on też zbezcześcić świątynię. Schwytaliśmy go więc i chcieliśmy osądzić według naszego prawa."
  tags: []
"Dz24,7":
  text: "Lecz dowódca Lizjasz przybył i wyrwał go przemocą z naszych rąk;"
  tags: []
"Dz24,8":
  text: "Nakazując jego oskarżycielom udać się do ciebie. Gdy go przesłuchasz, sam będziesz mógł dowiedzieć się od niego wszystkiego, o co go oskarżamy."
  tags: []
"Dz24,9":
  text: "Również Żydzi to potwierdzili, oświadczając, że tak się rzeczy mają."
  tags: []
"Dz24,10":
  text: "Kiedy namiestnik dał znak, aby mówił, Paweł powiedział: Wiedząc, że od wielu lat jesteś sędzią tego narodu, tym chętniej zdam sprawę z tego, co mnie dotyczy."
  tags: []
"Dz24,11":
  text: "Możesz sprawdzić, że nie upłynęło więcej niż dwanaście dni, odkąd przybyłem do Jerozolimy, aby wielbić Boga."
  tags: []
"Dz24,12":
  text: "I nie znaleźli mnie w świątyni rozprawiającego z kimkolwiek ani podburzającego lud czy to w synagogach, czy w mieście;"
  tags: []
"Dz24,13":
  text: "Ani też nie mogą dowieść tego, o co mnie oskarżają."
  tags: []
"Dz24,14":
  text: "Wyznaję jednak przed tobą, że według drogi, którą oni uważają za herezję, służę Bogu moich ojców, wierząc wszystkiemu, co jest napisane w Prawie i u Proroków;"
  tags: []
"Dz24,15":
  text: "Mając nadzieję w Bogu, że będzie zmartwychwstanie, którego i oni oczekują, zarówno sprawiedliwych, jak i niesprawiedliwych."
  tags: []
"Dz24,16":
  text: "I sam się usilnie staram, aby zawsze mieć sumienie bez skazy wobec Boga i ludzi."
  tags: []
"Dz24,17":
  text: "A po wielu latach przybyłem, aby złożyć jałmużny i ofiary memu narodowi."
  tags: []
"Dz24,18":
  text: "Wtedy pewni Żydzi z Azji spotkali mnie oczyszczonego w świątyni, bez tłumu i zgiełku."
  tags: []
"Dz24,19":
  text: "Oni powinni tu stanąć przed tobą i oskarżać, jeżeli mają coś przeciwko mnie."
  tags: []
"Dz24,20":
  text: "Albo niech ci tutaj sami powiedzą, czy znaleźli we mnie jakąś nieprawość, gdy stanąłem przed Radą;"
  tags: []
"Dz24,21":
  text: "Chyba jedynie to, że stojąc wśród nich, zawołałem: Sądzicie mnie dziś z powodu zmartwychwstania umarłych."
  tags: []
"Dz24,22":
  text: "Kiedy Feliks to usłyszał, znając dokładniej tę drogę, odroczył ich sprawę, mówiąc: Rozpatrzę waszą sprawę, kiedy tu przyjedzie dowódca Lizjasz."
  tags: []
"Dz24,23":
  text: "I rozkazał setnikowi pilnować Pawła, zastosować ulgi i nie zabraniać żadnemu z jego przyjaciół posługiwać mu czy go odwiedzać."
  tags: []
"Dz24,24":
  text: "A po kilku dniach przyjechał Feliks ze swoją żoną Druzyllą, która była Żydówką. Kazał zawołać Pawła i słuchał go, jak mówił o wierze w Chrystusa."
  tags: []
"Dz24,25":
  text: "A gdy on rozprawiał o sprawiedliwości, powściągliwości i przyszłym sądzie, Feliks przestraszył się i powiedział: Teraz już odejdź. Kiedy znajdę czas, każę cię zawołać."
  tags: []
"Dz24,26":
  text: "Spodziewał się przy tym, że dostanie od Pawła pieniądze za to, że go wypuści, dlatego też częściej wzywał go do siebie na rozmowę."
  tags: []
"Dz24,27":
  text: "A po dwóch latach następcą Feliksa został Porcjusz Festus. Feliks, chcąc sobie zjednać życzliwość Żydów, zostawił Pawła w więzieniu."
  tags: []
