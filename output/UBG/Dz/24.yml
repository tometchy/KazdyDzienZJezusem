"Dz24,1": "Po pięciu dniach przybył najwyższy kapłan Ananiasz wraz ze starszymi i z retorem, niejakim Tertullosem. Wnieśli oni przed namiestnika oskarżenie przeciwko Pawłowi."
"Dz24,2": "A gdy go wezwano, Tertullos rozpoczął mowę oskarżycielską: Ponieważ dzięki tobie cieszymy się zupełnym pokojem i dzięki twojej przezorności nasz naród doświadcza wiele dobrego;"
"Dz24,3": "Przyznajemy to zawsze i wszędzie, dostojny Feliksie, z wielką wdzięcznością."
"Dz24,4": "Aby cię jednak dłużej nie zatrzymywać, proszę, abyś nas w swej łaskawości przez chwilę posłuchał."
"Dz24,5": "Stwierdziliśmy, że ten człowiek jest jak zaraza, wzbudza niepokoje wśród wszystkich Żydów na całym świecie i jest dowódcą sekty nazarejczyków."
"Dz24,6": "Usiłował on też zbezcześcić świątynię. Schwytaliśmy go więc i chcieliśmy osądzić według naszego prawa."
"Dz24,7": "Lecz dowódca Lizjasz przybył i wyrwał go przemocą z naszych rąk;"
"Dz24,8": "Nakazując jego oskarżycielom udać się do ciebie. Gdy go przesłuchasz, sam będziesz mógł dowiedzieć się od niego wszystkiego, o co go oskarżamy."
"Dz24,9": "Również Żydzi to potwierdzili, oświadczając, że tak się rzeczy mają."
"Dz24,10": "Kiedy namiestnik dał znak, aby mówił, Paweł powiedział: Wiedząc, że od wielu lat jesteś sędzią tego narodu, tym chętniej zdam sprawę z tego, co mnie dotyczy."
"Dz24,11": "Możesz sprawdzić, że nie upłynęło więcej niż dwanaście dni, odkąd przybyłem do Jerozolimy, aby wielbić Boga."
"Dz24,12": "I nie znaleźli mnie w świątyni rozprawiającego z kimkolwiek ani podburzającego lud czy to w synagogach, czy w mieście;"
"Dz24,13": "Ani też nie mogą dowieść tego, o co mnie oskarżają."
"Dz24,14": "Wyznaję jednak przed tobą, że według drogi, którą oni uważają za herezję, służę Bogu moich ojców, wierząc wszystkiemu, co jest napisane w Prawie i u Proroków;"
"Dz24,15": "Mając nadzieję w Bogu, że będzie zmartwychwstanie, którego i oni oczekują, zarówno sprawiedliwych, jak i niesprawiedliwych."
"Dz24,16": "I sam się usilnie staram, aby zawsze mieć sumienie bez skazy wobec Boga i ludzi."
"Dz24,17": "A po wielu latach przybyłem, aby złożyć jałmużny i ofiary memu narodowi."
"Dz24,18": "Wtedy pewni Żydzi z Azji spotkali mnie oczyszczonego w świątyni, bez tłumu i zgiełku."
"Dz24,19": "Oni powinni tu stanąć przed tobą i oskarżać, jeżeli mają coś przeciwko mnie."
"Dz24,20": "Albo niech ci tutaj sami powiedzą, czy znaleźli we mnie jakąś nieprawość, gdy stanąłem przed Radą;"
"Dz24,21": "Chyba jedynie to, że stojąc wśród nich, zawołałem: Sądzicie mnie dziś z powodu zmartwychwstania umarłych."
"Dz24,22": "Kiedy Feliks to usłyszał, znając dokładniej tę drogę, odroczył ich sprawę, mówiąc: Rozpatrzę waszą sprawę, kiedy tu przyjedzie dowódca Lizjasz."
"Dz24,23": "I rozkazał setnikowi pilnować Pawła, zastosować ulgi i nie zabraniać żadnemu z jego przyjaciół posługiwać mu czy go odwiedzać."
"Dz24,24": "A po kilku dniach przyjechał Feliks ze swoją żoną Druzyllą, która była Żydówką. Kazał zawołać Pawła i słuchał go, jak mówił o wierze w Chrystusa."
"Dz24,25": "A gdy on rozprawiał o sprawiedliwości, powściągliwości i przyszłym sądzie, Feliks przestraszył się i powiedział: Teraz już odejdź. Kiedy znajdę czas, każę cię zawołać."
"Dz24,26": "Spodziewał się przy tym, że dostanie od Pawła pieniądze za to, że go wypuści, dlatego też częściej wzywał go do siebie na rozmowę."
"Dz24,27": "A po dwóch latach następcą Feliksa został Porcjusz Festus. Feliks, chcąc sobie zjednać życzliwość Żydów, zostawił Pawła w więzieniu."
