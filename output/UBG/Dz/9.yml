"Dz9,1": "A Saul, dysząc jeszcze groźbą i chęcią mordu wobec uczniów Pana, poszedł do najwyższego kapłana;"
"Dz9,2": "I prosił go o listy do synagog w Damaszku, aby mógł, jeśliby znalazł tam zwolenników tej drogi, zarówno mężczyzn, jak i kobiety, przyprowadzić ich związanych do Jerozolimy."
"Dz9,3": "A gdy jadąc, zbliżał się do Damaszku, nagle olśniła go światłość z nieba."
"Dz9,4": "Upadł na ziemię i usłyszał głos, który mówił do niego: Saulu, Saulu, dlaczego mnie prześladujesz?"
"Dz9,5": "Wtedy zapytał: Kim jesteś, Panie? A Pan odpowiedział: Ja jestem Jezus, którego ty prześladujesz. Trudno ci wierzgać przeciw ościeniowi."
"Dz9,6": "A Saul, drżąc i bojąc się, powiedział: Panie, co chcesz, abym zrobił? A Pan do niego: Wstań i idź do miasta, a tam ci powiedzą, co masz robić."
"Dz9,7": "A mężczyźni, którzy byli z nim w drodze, stanęli oniemiali. Słyszeli bowiem głos, lecz nikogo nie widzieli."
"Dz9,8": "I podniósł się Saul z ziemi, a gdy otworzył oczy, nikogo nie mógł widzieć. Wtedy wzięli go za rękę i zaprowadzili do Damaszku."
"Dz9,9": "Trzy dni nic nie widział i nie jadł ani nie pił."
"Dz9,10": "A w Damaszku był pewien uczeń, imieniem Ananiasz. I powiedział do niego Pan w widzeniu: Ananiaszu! A on odpowiedział: Oto ja, Panie."
"Dz9,11": "A Pan powiedział do niego: Wstań i idź na ulicę, którą nazywają Prostą, i zapytaj w domu Judy o Saula z Tarsu, oto bowiem się modli."
"Dz9,12": "I ujrzał w widzeniu człowieka imieniem Ananiasz, wchodzącego i kładącego na nim rękę, aby odzyskał wzrok."
"Dz9,13": "Ananiasz zaś odpowiedział: Panie, słyszałem od wielu, ile złego wyrządził ten człowiek twoim świętym w Jerozolimie."
"Dz9,14": "Tutaj także ma władzę od najwyższych kapłanów uwięzić wszystkich, którzy wzywają twego imienia."
"Dz9,15": "Lecz Pan powiedział do niego: Idź, bo on jest moim wybranym naczyniem, aby zanieść moje imię do pogan, królów i synów Izraela."
"Dz9,16": "Ja bowiem pokażę mu, jak wiele musi wycierpieć dla mego imienia."
"Dz9,17": "Wtedy Ananiasz poszedł, wszedł do domu, położył na nim ręce i powiedział: Saulu, bracie, Pan mnie posłał – Jezus, który ci się ukazał w drodze, którą jechałeś – żebyś odzyskał wzrok i został napełniony Duchem Świętym."
"Dz9,18": "I natychmiast spadły z jego oczu jakby łuski, i zaraz przejrzał, wstał i został ochrzczony."
"Dz9,19": "A gdy zjadł, odzyskał siły. I Saul przebywał przez kilka dni z uczniami, którzy byli w Damaszku."
"Dz9,20": "I zaraz w synagogach zaczął głosić Chrystusa, że on jest Synem Bożym."
"Dz9,21": "A wszyscy, którzy go słuchali, ze zdziwieniem pytali: Czy to nie jest ten, który w Jerozolimie tępił tych, którzy wzywali tego imienia, i przybył tu po to, aby ich związać i zaprowadzić do naczelnych kapłanów?"
"Dz9,22": "A Saul coraz bardziej się wzmacniał i wprawiał w zakłopotanie Żydów, którzy mieszkali w Damaszku, dowodząc, że ten jest Chrystusem."
"Dz9,23": "A po upływie wielu dni Żydzi postanowili go zabić."
"Dz9,24": "Saul jednak dowiedział się o ich zasadzce. A strzegli bram we dnie i w nocy, aby go zabić."
"Dz9,25": "Lecz uczniowie zabrali go w nocy i spuścili w koszu po sznurze przez mur."
"Dz9,26": "A gdy Saul przybył do Jerozolimy, usiłował przyłączyć się do uczniów, ale wszyscy się go bali, nie wierząc, że jest uczniem."
"Dz9,27": "Lecz Barnaba przyjął go, zaprowadził do apostołów i opowiedział im, jak on w drodze ujrzał Pana, który mówił do niego, i jak w Damaszku z odwagą głosił w imieniu Jezusa."
"Dz9,28": "I przebywał z nimi w Jerozolimie."
"Dz9,29": "Z odwagą też mówił w imieniu Pana Jezusa i rozprawiał z hellenistami, a oni usiłowali go zabić."
"Dz9,30": "Bracia jednak dowiedzieli się o tym, wyprawili go do Cezarei i odesłali do Tarsu."
"Dz9,31": "A tak kościoły w całej Judei, Galilei i Samarii cieszyły się pokojem, budując się i żyjąc w bojaźni Pańskiej, i rozrastały się przez pociechę Ducha Świętego."
"Dz9,32": "I stało się, gdy Piotr odwiedzał wszystkich, że przyszedł też do świętych, którzy mieszkali w Liddzie."
"Dz9,33": "Spotkał tam pewnego człowieka imieniem Eneasz, który był sparaliżowany i od ośmiu lat leżał w łóżku."
"Dz9,34": "I powiedział mu Piotr: Eneaszu, Jezus Chrystus cię uzdrawia. Wstań i zaściel swoje łóżko. I natychmiast wstał."
"Dz9,35": "A wszyscy mieszkańcy Liddy i Saronu widzieli go i nawrócili się do Pana."
"Dz9,36": "Mieszkała też w Jafie pewna uczennica o imieniu Tabita, co znaczy Dorkas. Jej życie wypełnione było dobrymi uczynkami i udzielaniem jałmużny."
"Dz9,37": "I stało się w tych dniach, że zachorowała i umarła. Obmyto ją i położono w sali na piętrze."
"Dz9,38": "A ponieważ Lidda leży blisko Jafy, gdy uczniowie usłyszeli, że jest tam Piotr, posłali do niego dwóch ludzi, prosząc, aby nie zwlekał z przyjściem do nich."
"Dz9,39": "Wtedy Piotr wstał i poszedł z nimi, a gdy przyszedł, wprowadzili go do sali na piętrze. Obstąpiły go wszystkie wdowy, płacząc i pokazując tuniki i płaszcze, które Dorkas im robiła, gdy była z nimi."
"Dz9,40": "A Piotr wygonił wszystkich, klęknął i modlił się. Potem zwrócił się do zmarłej i powiedział: Tabito, wstań! A ona otworzyła oczy i zobaczywszy Piotra, usiadła."
"Dz9,41": "On podał jej rękę i podniósł ją, a zawoławszy świętych i wdowy, pokazał ją żywą."
"Dz9,42": "I rozniosło się to po całej Jafie, i wielu uwierzyło w Pana."
"Dz9,43": "Piotr zaś został przez wiele dni w Jafie u niejakiego Szymona, garbarza."
