"Dz9,1":
  text: "A Saul, dysząc jeszcze groźbą i chęcią mordu wobec uczniów Pana, poszedł do najwyższego kapłana;"
  tags: []
"Dz9,2":
  text: "I prosił go o listy do synagog w Damaszku, aby mógł, jeśliby znalazł tam zwolenników tej drogi, zarówno mężczyzn, jak i kobiety, przyprowadzić ich związanych do Jerozolimy."
  tags: []
"Dz9,3":
  text: "A gdy jadąc, zbliżał się do Damaszku, nagle olśniła go światłość z nieba."
  tags: []
"Dz9,4":
  text: "Upadł na ziemię i usłyszał głos, który mówił do niego: Saulu, Saulu, dlaczego mnie prześladujesz?"
  tags: []
"Dz9,5":
  text: "Wtedy zapytał: Kim jesteś, Panie? A Pan odpowiedział: Ja jestem Jezus, którego ty prześladujesz. Trudno ci wierzgać przeciw ościeniowi."
  tags: []
"Dz9,6":
  text: "A Saul, drżąc i bojąc się, powiedział: Panie, co chcesz, abym zrobił? A Pan do niego: Wstań i idź do miasta, a tam ci powiedzą, co masz robić."
  tags: []
"Dz9,7":
  text: "A mężczyźni, którzy byli z nim w drodze, stanęli oniemiali. Słyszeli bowiem głos, lecz nikogo nie widzieli."
  tags: []
"Dz9,8":
  text: "I podniósł się Saul z ziemi, a gdy otworzył oczy, nikogo nie mógł widzieć. Wtedy wzięli go za rękę i zaprowadzili do Damaszku."
  tags: []
"Dz9,9":
  text: "Trzy dni nic nie widział i nie jadł ani nie pił."
  tags: []
"Dz9,10":
  text: "A w Damaszku był pewien uczeń, imieniem Ananiasz. I powiedział do niego Pan w widzeniu: Ananiaszu! A on odpowiedział: Oto ja, Panie."
  tags: []
"Dz9,11":
  text: "A Pan powiedział do niego: Wstań i idź na ulicę, którą nazywają Prostą, i zapytaj w domu Judy o Saula z Tarsu, oto bowiem się modli."
  tags: []
"Dz9,12":
  text: "I ujrzał w widzeniu człowieka imieniem Ananiasz, wchodzącego i kładącego na nim rękę, aby odzyskał wzrok."
  tags: []
"Dz9,13":
  text: "Ananiasz zaś odpowiedział: Panie, słyszałem od wielu, ile złego wyrządził ten człowiek twoim świętym w Jerozolimie."
  tags: []
"Dz9,14":
  text: "Tutaj także ma władzę od najwyższych kapłanów uwięzić wszystkich, którzy wzywają twego imienia."
  tags: []
"Dz9,15":
  text: "Lecz Pan powiedział do niego: Idź, bo on jest moim wybranym naczyniem, aby zanieść moje imię do pogan, królów i synów Izraela."
  tags: []
"Dz9,16":
  text: "Ja bowiem pokażę mu, jak wiele musi wycierpieć dla mego imienia."
  tags: []
"Dz9,17":
  text: "Wtedy Ananiasz poszedł, wszedł do domu, położył na nim ręce i powiedział: Saulu, bracie, Pan mnie posłał – Jezus, który ci się ukazał w drodze, którą jechałeś – żebyś odzyskał wzrok i został napełniony Duchem Świętym."
  tags: []
"Dz9,18":
  text: "I natychmiast spadły z jego oczu jakby łuski, i zaraz przejrzał, wstał i został ochrzczony."
  tags: []
"Dz9,19":
  text: "A gdy zjadł, odzyskał siły. I Saul przebywał przez kilka dni z uczniami, którzy byli w Damaszku."
  tags: []
"Dz9,20":
  text: "I zaraz w synagogach zaczął głosić Chrystusa, że on jest Synem Bożym."
  tags: []
"Dz9,21":
  text: "A wszyscy, którzy go słuchali, ze zdziwieniem pytali: Czy to nie jest ten, który w Jerozolimie tępił tych, którzy wzywali tego imienia, i przybył tu po to, aby ich związać i zaprowadzić do naczelnych kapłanów?"
  tags: []
"Dz9,22":
  text: "A Saul coraz bardziej się wzmacniał i wprawiał w zakłopotanie Żydów, którzy mieszkali w Damaszku, dowodząc, że ten jest Chrystusem."
  tags: []
"Dz9,23":
  text: "A po upływie wielu dni Żydzi postanowili go zabić."
  tags: []
"Dz9,24":
  text: "Saul jednak dowiedział się o ich zasadzce. A strzegli bram we dnie i w nocy, aby go zabić."
  tags: []
"Dz9,25":
  text: "Lecz uczniowie zabrali go w nocy i spuścili w koszu po sznurze przez mur."
  tags: []
"Dz9,26":
  text: "A gdy Saul przybył do Jerozolimy, usiłował przyłączyć się do uczniów, ale wszyscy się go bali, nie wierząc, że jest uczniem."
  tags: []
"Dz9,27":
  text: "Lecz Barnaba przyjął go, zaprowadził do apostołów i opowiedział im, jak on w drodze ujrzał Pana, który mówił do niego, i jak w Damaszku z odwagą głosił w imieniu Jezusa."
  tags: []
"Dz9,28":
  text: "I przebywał z nimi w Jerozolimie."
  tags: []
"Dz9,29":
  text: "Z odwagą też mówił w imieniu Pana Jezusa i rozprawiał z hellenistami, a oni usiłowali go zabić."
  tags: []
"Dz9,30":
  text: "Bracia jednak dowiedzieli się o tym, wyprawili go do Cezarei i odesłali do Tarsu."
  tags: []
"Dz9,31":
  text: "A tak kościoły w całej Judei, Galilei i Samarii cieszyły się pokojem, budując się i żyjąc w bojaźni Pańskiej, i rozrastały się przez pociechę Ducha Świętego."
  tags: []
"Dz9,32":
  text: "I stało się, gdy Piotr odwiedzał wszystkich, że przyszedł też do świętych, którzy mieszkali w Liddzie."
  tags: []
"Dz9,33":
  text: "Spotkał tam pewnego człowieka imieniem Eneasz, który był sparaliżowany i od ośmiu lat leżał w łóżku."
  tags: []
"Dz9,34":
  text: "I powiedział mu Piotr: Eneaszu, Jezus Chrystus cię uzdrawia. Wstań i zaściel swoje łóżko. I natychmiast wstał."
  tags: []
"Dz9,35":
  text: "A wszyscy mieszkańcy Liddy i Saronu widzieli go i nawrócili się do Pana."
  tags: []
"Dz9,36":
  text: "Mieszkała też w Jafie pewna uczennica o imieniu Tabita, co znaczy Dorkas. Jej życie wypełnione było dobrymi uczynkami i udzielaniem jałmużny."
  tags: []
"Dz9,37":
  text: "I stało się w tych dniach, że zachorowała i umarła. Obmyto ją i położono w sali na piętrze."
  tags: []
"Dz9,38":
  text: "A ponieważ Lidda leży blisko Jafy, gdy uczniowie usłyszeli, że jest tam Piotr, posłali do niego dwóch ludzi, prosząc, aby nie zwlekał z przyjściem do nich."
  tags: []
"Dz9,39":
  text: "Wtedy Piotr wstał i poszedł z nimi, a gdy przyszedł, wprowadzili go do sali na piętrze. Obstąpiły go wszystkie wdowy, płacząc i pokazując tuniki i płaszcze, które Dorkas im robiła, gdy była z nimi."
  tags: []
"Dz9,40":
  text: "A Piotr wygonił wszystkich, klęknął i modlił się. Potem zwrócił się do zmarłej i powiedział: Tabito, wstań! A ona otworzyła oczy i zobaczywszy Piotra, usiadła."
  tags: []
"Dz9,41":
  text: "On podał jej rękę i podniósł ją, a zawoławszy świętych i wdowy, pokazał ją żywą."
  tags: []
"Dz9,42":
  text: "I rozniosło się to po całej Jafie, i wielu uwierzyło w Pana."
  tags: []
"Dz9,43":
  text: "Piotr zaś został przez wiele dni w Jafie u niejakiego Szymona, garbarza."
  tags: []
