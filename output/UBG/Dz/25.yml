"Dz25,1":
  text: "Kiedy Festus przybył do prowincji, po trzech dniach udał się z Cezarei do Jerozolimy."
  tags: []
"Dz25,2":
  text: "Najwyższy kapłan i znamienici Żydzi wnieśli przed nim przeciwko Pawłowi skargę i prosili go;"
  tags: []
"Dz25,3":
  text: "Aby okazał im w jego sprawie przychylność i kazał przyprowadzić go do Jerozolimy. Przygotowali bowiem zasadzkę, aby go zabić w drodze."
  tags: []
"Dz25,4":
  text: "Lecz Festus odpowiedział, że Paweł znajduje się pod strażą w Cezarei i że on sam wkrótce tam pojedzie."
  tags: []
"Dz25,5":
  text: "I powiedział: Niech ci z was, którzy mogą, pojadą ze mną, a jeśli ten człowiek popełnił coś złego, niech go oskarżają."
  tags: []
"Dz25,6":
  text: "A gdy spędził u nich nie więcej niż dziesięć dni, udał się do Cezarei. Nazajutrz zasiadł na krześle sędziowskim i kazał przyprowadzić Pawła."
  tags: []
"Dz25,7":
  text: "Kiedy ten przyszedł, otoczyli go Żydzi, którzy przybyli z Jerozolimy, i wytoczyli przeciwko Pawłowi wiele ciężkich oskarżeń, których nie mogli udowodnić."
  tags: []
"Dz25,8":
  text: "On zaś bronił się: Nie zawiniłem w niczym ani przeciwko prawu żydowskiemu, ani przeciwko świątyni, ani przeciwko cesarzowi."
  tags: []
"Dz25,9":
  text: "Lecz Festus, chcąc sobie zjednać przychylność Żydów, odpowiedział Pawłowi: Czy chcesz pojechać do Jerozolimy i tam być przede mną sądzony w tej sprawie?"
  tags: []
"Dz25,10":
  text: "Wtedy Paweł powiedział: Stoję przed sądem cesarskim, gdzie należy mnie sądzić. Żydom nie wyrządziłem żadnej krzywdy, o czym ty sam dobrze wiesz."
  tags: []
"Dz25,11":
  text: "Bo jeśli w czymś zawiniłem i popełniłem coś, co zasługuje na śmierć, nie wzbraniam się umrzeć. Lecz jeśli nie ma nic w tym, o co mnie oskarżają, nikt nie może mnie im wydać. Odwołuję się do cesarza."
  tags: []
"Dz25,12":
  text: "Wtedy Festus porozumiał się z Radą i odpowiedział: Odwołałeś się do cesarza? Do cesarza pójdziesz."
  tags: []
"Dz25,13":
  text: "A po upływie kilku dni przyjechali do Cezarei król Agryppa i Berenike, aby powitać Festusa."
  tags: []
"Dz25,14":
  text: "A kiedy przebywali tam wiele dni, Festus przedstawił królowi sprawę Pawła, mówiąc: Feliks pozostawił w więzieniu pewnego człowieka;"
  tags: []
"Dz25,15":
  text: "Przeciwko któremu, gdy byłem w Jerozolimie, naczelni kapłani i starsi żydowscy wnieśli skargę, żądając dla niego wyroku skazującego."
  tags: []
"Dz25,16":
  text: "Odpowiedziałem im, że Rzymianie nie mają w zwyczaju wydawać człowieka na stracenie, zanim oskarżony nie stanie wobec oskarżycieli i nie będzie miał możliwości odpowiedzieć na zarzuty."
  tags: []
"Dz25,17":
  text: "Gdy się tu zebrali, nazajutrz, bez żadnej zwłoki zasiadłem na krześle sędziowskim i kazałem przyprowadzić tego człowieka."
  tags: []
"Dz25,18":
  text: "Stanęli przeciw niemu jego oskarżyciele, ale nie wnieśli żadnej skargi z tych, których się spodziewałem."
  tags: []
"Dz25,19":
  text: "Wiedli z nim tylko jakieś spory o ich zabobony i o jakiegoś zmarłego Jezusa, o którym Paweł twierdzi, że żyje."
  tags: []
"Dz25,20":
  text: "Będąc niepewnym co do tego sporu, zapytałem, czy chciałby udać się do Jerozolimy i tam być sądzony w tych sprawach."
  tags: []
"Dz25,21":
  text: "Lecz ponieważ Paweł odwołał się, by go zatrzymać do rozpatrzenia sprawy przez Augusta, rozkazałem go strzec, dopóki go nie odeślę do cesarza."
  tags: []
"Dz25,22":
  text: "Wtedy Agryppa powiedział do Festusa: Ja również chciałbym posłuchać tego człowieka. A on odpowiedział: Jutro go usłyszysz."
  tags: []
"Dz25,23":
  text: "Gdy nazajutrz Agryppa i Berenike przybyli z wielką okazałością i weszli do sali rozpraw z dowódcami i najznakomitszymi obywatelami miasta, na rozkaz Festusa wprowadzono Pawła."
  tags: []
"Dz25,24":
  text: "Po czym Festus przemówił: Królu Agryppo i wszyscy tu obecni mężowie! Widzicie tego, o którego mnie prosił cały lud żydowski zarówno w Jerozolimie, jak i tutaj, wołając, że nie powinien on dłużej żyć."
  tags: []
"Dz25,25":
  text: "Lecz ja stwierdziłem, że nie popełnił niczego, co zasługuje na śmierć. A ponieważ on sam odwołał się do Augusta, postanowiłem go odesłać."
  tags: []
"Dz25,26":
  text: "Nie mogę jednak o nim napisać memu panu nic pewnego. Dlatego kazałem go stawić przed wami, a zwłaszcza przed tobą, królu Agryppo, abym po przesłuchaniu miał co napisać."
  tags: []
"Dz25,27":
  text: "Bo wydaje mi się nierozsądne posyłać więźnia bez podania stawianych mu zarzutów."
  tags: []
