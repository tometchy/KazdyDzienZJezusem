"Dz15,1": "A niektórzy przybysze z Judei nauczali braci: Jeśli nie zostaniecie obrzezani według zwyczaju Mojżesza, nie możecie być zbawieni."
"Dz15,2": "Kiedy doszło do niemałych sporów i zatargów między nimi a Pawłem i Barnabą, postanowili, że Paweł i Barnaba oraz jeszcze kilku z nich pójdą w sprawie tego sporu do apostołów i starszych do Jerozolimy."
"Dz15,3": "Wyprawieni przez kościół, szli przez Fenicję i Samarię, opowiadając o nawróceniu pogan, czym sprawili wielką radość wszystkim braciom."
"Dz15,4": "A gdy przybyli do Jerozolimy, zostali przyjęci przez kościół, apostołów i starszych. I opowiedzieli o wszystkim, czego Bóg przez nich dokonał."
"Dz15,5": "Lecz niektórzy ze stronnictwa faryzeuszy, którzy uwierzyli, powstali i powiedzieli: Trzeba ich obrzezać i nakazać, żeby zachowywali Prawo Mojżesza."
"Dz15,6": "Apostołowie i starsi zebrali się więc, aby rozstrzygnąć tę sprawę."
"Dz15,7": "A gdy był wielki spór o to, Piotr powstał i powiedział do nich: Mężowie bracia, wiecie, że Bóg już dawno wybrał mnie spośród was, aby z moich ust poganie usłyszeli słowa ewangelii i uwierzyli."
"Dz15,8": "A Bóg, który zna serca, wydał im świadectwo, dając im Ducha Świętego, tak samo jak nam."
"Dz15,9": "I nie uczynił żadnej różnicy między nami a nimi, oczyszczając przez wiarę ich serca."
"Dz15,10": "Dlaczego więc teraz wystawiacie Boga na próbę, wkładając na kark uczniów jarzmo, którego ani nasi ojcowie, ani my nie mogliśmy udźwignąć?"
"Dz15,11": "Lecz wierzymy, że przez łaskę Pana Jezusa Chrystusa będziemy zbawieni, tak samo jak i oni."
"Dz15,12": "I całe zgromadzenie umilkło, a potem słuchali Barnaby i Pawła, którzy opowiadali, jak wielkie znaki i cuda Bóg uczynił przez nich wśród pogan."
"Dz15,13": "A gdy i oni umilkli, odezwał się Jakub: Mężowie bracia, posłuchajcie mnie."
"Dz15,14": "Szymon powiedział, jak najpierw Bóg wejrzał na pogan, aby z nich wybrać lud dla swego imienia."
"Dz15,15": "A z tym się zgadzają słowa proroków, jak jest napisane:"
"Dz15,16": "Potem powrócę i odbuduję upadły przybytek Dawida; odbuduję jego ruiny i wzniosę go;"
"Dz15,17": "Aby ludzie, którzy pozostali, szukali Pana, i wszystkie narody, nad którymi wzywane jest moje imię – mówi Pan, który to wszystko sprawia."
"Dz15,18": "Znane są Bogu od wieków wszystkie jego sprawy."
"Dz15,19": "Dlatego uważam, że nie należy czynić trudności tym spośród pogan, którzy się nawracają do Boga;"
"Dz15,20": "Ale napisać im, aby wstrzymywali się od splugawienia bożków, od nierządu, od tego, co uduszone, i od krwi."
"Dz15,21": "Mojżesz bowiem od dawien dawna ma w każdym mieście takich, którzy go głoszą, gdyż w synagogach co szabat czytają go."
"Dz15,22": "Wtedy apostołowie i starsi wraz z całym kościołem uznali za słuszne posłać do Antiochii z Pawłem i Barnabą wybranych spośród siebie ludzi: Judę, zwanego Barsabą, i Sylasa, przodujących wśród braci."
"Dz15,23": "Posłali przez nich takie pismo: Apostołowie, starsi i bracia przesyłają pozdrowienia braciom pochodzącym z pogan, którzy są w Antiochii, Syrii i Cylicji."
"Dz15,24": "Ponieważ słyszeliśmy, że pewni ludzie wyszli od nas i zaniepokoili was słowami, i wzburzyli wasze dusze, mówiąc, że musicie zostać obrzezani i zachowywać prawo, czego im nie przykazaliśmy;"
"Dz15,25": "Zgromadzeni jednomyślnie, postanowiliśmy posłać do was wybranych ludzi wraz z naszymi umiłowanymi Barnabą i Pawłem;"
"Dz15,26": "Ludźmi, którzy poświęcili swe życie dla imienia naszego Pana Jezusa Chrystusa."
"Dz15,27": "Dlatego posłaliśmy Judę i Sylasa, którzy powtórzą wam ustnie to samo."
"Dz15,28": "Uznał bowiem Duch Święty za słuszne, i my też, nie nakładać na was żadnego ciężaru oprócz tego, co konieczne."
"Dz15,29": "Wstrzymujcie się od ofiar składanych bożkom, od krwi, od tego, co uduszone, i od nierządu. Dobrze uczynicie, jeśli będziecie się tego wystrzegać. Bywajcie zdrowi."
"Dz15,30": "Tak więc oni, będąc odprawieni, przybyli do Antiochii, zwołali zgromadzenie i oddali list."
"Dz15,31": "Gdy go przeczytali, uradowali się z tego pocieszania."
"Dz15,32": "A Juda i Sylas, którzy również byli prorokami, w licznych mowach zachęcali i umacniali braci."
"Dz15,33": "A gdy przebywali tam jakiś czas, zostali odprawieni z życzeniem pokoju od braci do apostołów."
"Dz15,34": "Lecz upodobało się Sylasowi tam pozostać."
"Dz15,35": "Również Paweł i Barnaba przebywali w Antiochii, nauczając i głosząc z wieloma innymi słowo Pana."
"Dz15,36": "Po kilku dniach Paweł powiedział do Barnaby: Wróćmy i odwiedźmy naszych braci we wszystkich miastach, w których głosiliśmy słowo Pańskie, aby zobaczyć, jak się mają."
"Dz15,37": "Barnaba chciał również wziąć ze sobą Jana, zwanego Markiem."
"Dz15,38": "Ale Paweł nie chciał zabrać ze sobą tego, który odszedł od nich w Pamfilii i nie uczestniczył z nimi w tej pracy."
"Dz15,39": "I doszło między nimi do ostrej kłótni, tak że się rozdzielili: Barnaba wziął ze sobą Marka i popłynął na Cypr;"
"Dz15,40": "Paweł zaś wybrał sobie Sylasa i wyruszył, polecony przez braci łasce Boga."
"Dz15,41": "I przechodził Syrię i Cylicję, umacniając kościoły."
