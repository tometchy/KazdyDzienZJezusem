"Dz15,1":
  text: "A niektórzy przybysze z Judei nauczali braci: Jeśli nie zostaniecie obrzezani według zwyczaju Mojżesza, nie możecie być zbawieni."
  tags: []
"Dz15,2":
  text: "Kiedy doszło do niemałych sporów i zatargów między nimi a Pawłem i Barnabą, postanowili, że Paweł i Barnaba oraz jeszcze kilku z nich pójdą w sprawie tego sporu do apostołów i starszych do Jerozolimy."
  tags: []
"Dz15,3":
  text: "Wyprawieni przez kościół, szli przez Fenicję i Samarię, opowiadając o nawróceniu pogan, czym sprawili wielką radość wszystkim braciom."
  tags: []
"Dz15,4":
  text: "A gdy przybyli do Jerozolimy, zostali przyjęci przez kościół, apostołów i starszych. I opowiedzieli o wszystkim, czego Bóg przez nich dokonał."
  tags: []
"Dz15,5":
  text: "Lecz niektórzy ze stronnictwa faryzeuszy, którzy uwierzyli, powstali i powiedzieli: Trzeba ich obrzezać i nakazać, żeby zachowywali Prawo Mojżesza."
  tags: []
"Dz15,6":
  text: "Apostołowie i starsi zebrali się więc, aby rozstrzygnąć tę sprawę."
  tags: []
"Dz15,7":
  text: "A gdy był wielki spór o to, Piotr powstał i powiedział do nich: Mężowie bracia, wiecie, że Bóg już dawno wybrał mnie spośród was, aby z moich ust poganie usłyszeli słowa ewangelii i uwierzyli."
  tags: []
"Dz15,8":
  text: "A Bóg, który zna serca, wydał im świadectwo, dając im Ducha Świętego, tak samo jak nam."
  tags: []
"Dz15,9":
  text: "I nie uczynił żadnej różnicy między nami a nimi, oczyszczając przez wiarę ich serca."
  tags: []
"Dz15,10":
  text: "Dlaczego więc teraz wystawiacie Boga na próbę, wkładając na kark uczniów jarzmo, którego ani nasi ojcowie, ani my nie mogliśmy udźwignąć?"
  tags: []
"Dz15,11":
  text: "Lecz wierzymy, że przez łaskę Pana Jezusa Chrystusa będziemy zbawieni, tak samo jak i oni."
  tags: []
"Dz15,12":
  text: "I całe zgromadzenie umilkło, a potem słuchali Barnaby i Pawła, którzy opowiadali, jak wielkie znaki i cuda Bóg uczynił przez nich wśród pogan."
  tags: []
"Dz15,13":
  text: "A gdy i oni umilkli, odezwał się Jakub: Mężowie bracia, posłuchajcie mnie."
  tags: []
"Dz15,14":
  text: "Szymon powiedział, jak najpierw Bóg wejrzał na pogan, aby z nich wybrać lud dla swego imienia."
  tags: []
"Dz15,15":
  text: "A z tym się zgadzają słowa proroków, jak jest napisane:"
  tags: []
"Dz15,16":
  text: "Potem powrócę i odbuduję upadły przybytek Dawida; odbuduję jego ruiny i wzniosę go;"
  tags: []
"Dz15,17":
  text: "Aby ludzie, którzy pozostali, szukali Pana, i wszystkie narody, nad którymi wzywane jest moje imię – mówi Pan, który to wszystko sprawia."
  tags: []
"Dz15,18":
  text: "Znane są Bogu od wieków wszystkie jego sprawy."
  tags: []
"Dz15,19":
  text: "Dlatego uważam, że nie należy czynić trudności tym spośród pogan, którzy się nawracają do Boga;"
  tags: []
"Dz15,20":
  text: "Ale napisać im, aby wstrzymywali się od splugawienia bożków, od nierządu, od tego, co uduszone, i od krwi."
  tags: []
"Dz15,21":
  text: "Mojżesz bowiem od dawien dawna ma w każdym mieście takich, którzy go głoszą, gdyż w synagogach co szabat czytają go."
  tags: []
"Dz15,22":
  text: "Wtedy apostołowie i starsi wraz z całym kościołem uznali za słuszne posłać do Antiochii z Pawłem i Barnabą wybranych spośród siebie ludzi: Judę, zwanego Barsabą, i Sylasa, przodujących wśród braci."
  tags: []
"Dz15,23":
  text: "Posłali przez nich takie pismo: Apostołowie, starsi i bracia przesyłają pozdrowienia braciom pochodzącym z pogan, którzy są w Antiochii, Syrii i Cylicji."
  tags: []
"Dz15,24":
  text: "Ponieważ słyszeliśmy, że pewni ludzie wyszli od nas i zaniepokoili was słowami, i wzburzyli wasze dusze, mówiąc, że musicie zostać obrzezani i zachowywać prawo, czego im nie przykazaliśmy;"
  tags: []
"Dz15,25":
  text: "Zgromadzeni jednomyślnie, postanowiliśmy posłać do was wybranych ludzi wraz z naszymi umiłowanymi Barnabą i Pawłem;"
  tags: []
"Dz15,26":
  text: "Ludźmi, którzy poświęcili swe życie dla imienia naszego Pana Jezusa Chrystusa."
  tags: []
"Dz15,27":
  text: "Dlatego posłaliśmy Judę i Sylasa, którzy powtórzą wam ustnie to samo."
  tags: []
"Dz15,28":
  text: "Uznał bowiem Duch Święty za słuszne, i my też, nie nakładać na was żadnego ciężaru oprócz tego, co konieczne."
  tags: []
"Dz15,29":
  text: "Wstrzymujcie się od ofiar składanych bożkom, od krwi, od tego, co uduszone, i od nierządu. Dobrze uczynicie, jeśli będziecie się tego wystrzegać. Bywajcie zdrowi."
  tags: []
"Dz15,30":
  text: "Tak więc oni, będąc odprawieni, przybyli do Antiochii, zwołali zgromadzenie i oddali list."
  tags: []
"Dz15,31":
  text: "Gdy go przeczytali, uradowali się z tego pocieszania."
  tags: []
"Dz15,32":
  text: "A Juda i Sylas, którzy również byli prorokami, w licznych mowach zachęcali i umacniali braci."
  tags: []
"Dz15,33":
  text: "A gdy przebywali tam jakiś czas, zostali odprawieni z życzeniem pokoju od braci do apostołów."
  tags: []
"Dz15,34":
  text: "Lecz upodobało się Sylasowi tam pozostać."
  tags: []
"Dz15,35":
  text: "Również Paweł i Barnaba przebywali w Antiochii, nauczając i głosząc z wieloma innymi słowo Pana."
  tags: []
"Dz15,36":
  text: "Po kilku dniach Paweł powiedział do Barnaby: Wróćmy i odwiedźmy naszych braci we wszystkich miastach, w których głosiliśmy słowo Pańskie, aby zobaczyć, jak się mają."
  tags: []
"Dz15,37":
  text: "Barnaba chciał również wziąć ze sobą Jana, zwanego Markiem."
  tags: []
"Dz15,38":
  text: "Ale Paweł nie chciał zabrać ze sobą tego, który odszedł od nich w Pamfilii i nie uczestniczył z nimi w tej pracy."
  tags: []
"Dz15,39":
  text: "I doszło między nimi do ostrej kłótni, tak że się rozdzielili: Barnaba wziął ze sobą Marka i popłynął na Cypr;"
  tags: []
"Dz15,40":
  text: "Paweł zaś wybrał sobie Sylasa i wyruszył, polecony przez braci łasce Boga."
  tags: []
"Dz15,41":
  text: "I przechodził Syrię i Cylicję, umacniając kościoły."
  tags: []
