"Dz17,1": "A gdy przeszli Amfipolis i Apolonię, przybyli do Tesaloniki, gdzie była synagoga żydowska."
"Dz17,2": "Wtedy Paweł według swego zwyczaju wszedł do nich i przez trzy szabaty rozprawiał z nimi na podstawie Pisma;"
"Dz17,3": "Wyjaśniając i nauczając, że Chrystus musiał cierpieć i powstać z martwych oraz: Ten Jezus, którego wam głoszę, jest Chrystusem."
"Dz17,4": "I niektórzy z nich uwierzyli i przyłączyli się do Pawła i Sylasa, również mnóstwo pobożnych Greków i niemało znamienitych kobiet."
"Dz17,5": "Ale ci Żydzi, którzy nie uwierzyli, zdjęci zazdrością, dobrali sobie niektórych niegodziwych próżniaków, a kiedy zebrali dużą grupę, podburzyli miasto. Naszli dom Jazona i szukali ich, aby wyprowadzić ich przed lud."
"Dz17,6": "Gdy jednak ich nie znaleźli, zaciągnęli Jazona i niektórych braci przed przełożonych miasta, krzycząc: Oto ci, którzy cały świat wzburzyli, przyszli też tutaj;"
"Dz17,7": "A Jazon ich przyjął. Oni wszyscy postępują wbrew dekretom cesarza, mówiąc, że jest inny król, Jezus."
"Dz17,8": "W ten sposób zaniepokoili lud i przełożonych miasta, którzy to słyszeli."
"Dz17,9": "Ale po wzięciu poręczenia od Jazona i innych wypuścili ich."
"Dz17,10": "Zaraz w nocy bracia wysłali Pawła i Sylasa do Berei. Kiedy tam przybyli, weszli do synagogi żydowskiej."
"Dz17,11": "Ci byli szlachetniejsi od tych w Tesalonice, gdyż przyjęli słowo Boże z całą gotowością i codziennie badali Pisma, czy tak się sprawy mają."
"Dz17,12": "Wielu więc z nich uwierzyło, również niemało wpływowych greckich kobiet i mężczyzn."
"Dz17,13": "A gdy Żydzi z Tesaloniki dowiedzieli się, że i w Berei Paweł głosi słowo Boże, przyszli też tam i podburzali lud."
"Dz17,14": "Wtedy bracia natychmiast wysłali Pawła w drogę ku morzu, a Sylas i Tymoteusz tam zostali."
"Dz17,15": "Ci, którzy towarzyszyli Pawłowi, odprowadzili go aż do Aten i powrócili, otrzymawszy polecenie dla Sylasa i Tymoteusza, żeby jak najszybciej przyszli do niego."
"Dz17,16": "A gdy Paweł czekał na nich w Atenach, burzył się w duchu na widok miasta oddanego bałwochwalstwu."
"Dz17,17": "Rozprawiał więc w synagodze z Żydami i ludźmi pobożnymi oraz codziennie na rynku ze wszystkimi, których spotkał."
"Dz17,18": "Wtedy niektórzy z filozofów epikurejskich i stoickich spierali się z nim. Jedni mówili: Co chce powiedzieć ten nowinkarz? A inni: Zdaje się, że jest zwiastunem obcych bogów. Głosił im bowiem Jezusa i zmartwychwstanie."
"Dz17,19": "Zabrali go, zaprowadzili na Areopag i zapytali: Czy możemy się dowiedzieć, co to za nowa nauka, którą głosisz?"
"Dz17,20": "Bo przynosisz jakieś rzeczy obce naszym uszom. Chcemy więc wiedzieć, o co właściwie chodzi."
"Dz17,21": "(A wszyscy Ateńczycy i mieszkający tam cudzoziemcy nie poświęcali czasu na nic innego, tylko na opowiadanie lub słuchanie czegoś nowego)."
"Dz17,22": "Wtedy Paweł stanął pośrodku Areopagu i powiedział: Mężowie ateńscy, widzę, że pod każdym względem jesteście nadzwyczaj religijni."
"Dz17,23": "Przechadzając się bowiem i przypatrując waszym świętościom, znalazłem też ołtarz, na którym było napisane: Nieznanemu Bogu. Ja głoszę wam tego, którego nie znając, czcicie."
"Dz17,24": "Bóg, który stworzył świat i wszystko na nim, ten, który jest Panem nieba i ziemi, nie mieszka w świątyniach zbudowanych ręką."
"Dz17,25": "Ani nie jest czczony rękoma ludzkimi tak, jakby czegoś potrzebował, ponieważ sam daje wszystkim życie i oddech, i wszystko."
"Dz17,26": "I z jednej krwi uczynił wszystkie narody ludzkie, żeby mieszkały na całej powierzchni ziemi, określiwszy czasy wcześniej wyznaczone i zamierzone granice ich zamieszkania;"
"Dz17,27": "Żeby szukali Pana, czy go nie znajdą po omacku, chociaż nie jest daleko od nikogo z nas."
"Dz17,28": "Bo w nim żyjemy, poruszamy się i jesteśmy, jak też powiedzieli niektórzy z waszych poetów: I my bowiem jesteśmy z jego rodu."
"Dz17,29": "Będąc więc z rodu Boga, nie powinniśmy sądzić, że Bóstwo jest podobne do złota, srebra lub kamienia, misternie wyrzeźbionych według wyobrażenia ludzkiego."
"Dz17,30": "Bóg wprawdzie pomijał czasy tej nieświadomości, teraz jednak nakazuje wszędzie wszystkim ludziom pokutować;"
"Dz17,31": "Gdyż wyznaczył dzień, w którym będzie sprawiedliwie sądził cały świat przez człowieka, którego do tego przeznaczył, zapewniając o tym wszystkich przez wskrzeszenie go z martwych."
"Dz17,32": "Gdy usłyszeli o zmartwychwstaniu, jedni się naśmiewali, a inni mówili: Posłuchamy cię o tym ponownie."
"Dz17,33": "I tak Paweł wyszedł spośród nich."
"Dz17,34": "Lecz niektórzy ludzie przyłączyli się do niego i uwierzyli. Był też wśród nich Dionizy Areopagita i kobieta imieniem Damaris oraz inni z nimi."
