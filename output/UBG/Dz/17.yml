"Dz17,1":
  text: "A gdy przeszli Amfipolis i Apolonię, przybyli do Tesaloniki, gdzie była synagoga żydowska."
  tags: []
"Dz17,2":
  text: "Wtedy Paweł według swego zwyczaju wszedł do nich i przez trzy szabaty rozprawiał z nimi na podstawie Pisma;"
  tags: []
"Dz17,3":
  text: "Wyjaśniając i nauczając, że Chrystus musiał cierpieć i powstać z martwych oraz: Ten Jezus, którego wam głoszę, jest Chrystusem."
  tags: []
"Dz17,4":
  text: "I niektórzy z nich uwierzyli i przyłączyli się do Pawła i Sylasa, również mnóstwo pobożnych Greków i niemało znamienitych kobiet."
  tags: []
"Dz17,5":
  text: "Ale ci Żydzi, którzy nie uwierzyli, zdjęci zazdrością, dobrali sobie niektórych niegodziwych próżniaków, a kiedy zebrali dużą grupę, podburzyli miasto. Naszli dom Jazona i szukali ich, aby wyprowadzić ich przed lud."
  tags: []
"Dz17,6":
  text: "Gdy jednak ich nie znaleźli, zaciągnęli Jazona i niektórych braci przed przełożonych miasta, krzycząc: Oto ci, którzy cały świat wzburzyli, przyszli też tutaj;"
  tags: []
"Dz17,7":
  text: "A Jazon ich przyjął. Oni wszyscy postępują wbrew dekretom cesarza, mówiąc, że jest inny król, Jezus."
  tags: []
"Dz17,8":
  text: "W ten sposób zaniepokoili lud i przełożonych miasta, którzy to słyszeli."
  tags: []
"Dz17,9":
  text: "Ale po wzięciu poręczenia od Jazona i innych wypuścili ich."
  tags: []
"Dz17,10":
  text: "Zaraz w nocy bracia wysłali Pawła i Sylasa do Berei. Kiedy tam przybyli, weszli do synagogi żydowskiej."
  tags: []
"Dz17,11":
  text: "Ci byli szlachetniejsi od tych w Tesalonice, gdyż przyjęli słowo Boże z całą gotowością i codziennie badali Pisma, czy tak się sprawy mają."
  tags: []
"Dz17,12":
  text: "Wielu więc z nich uwierzyło, również niemało wpływowych greckich kobiet i mężczyzn."
  tags: []
"Dz17,13":
  text: "A gdy Żydzi z Tesaloniki dowiedzieli się, że i w Berei Paweł głosi słowo Boże, przyszli też tam i podburzali lud."
  tags: []
"Dz17,14":
  text: "Wtedy bracia natychmiast wysłali Pawła w drogę ku morzu, a Sylas i Tymoteusz tam zostali."
  tags: []
"Dz17,15":
  text: "Ci, którzy towarzyszyli Pawłowi, odprowadzili go aż do Aten i powrócili, otrzymawszy polecenie dla Sylasa i Tymoteusza, żeby jak najszybciej przyszli do niego."
  tags: []
"Dz17,16":
  text: "A gdy Paweł czekał na nich w Atenach, burzył się w duchu na widok miasta oddanego bałwochwalstwu."
  tags: []
"Dz17,17":
  text: "Rozprawiał więc w synagodze z Żydami i ludźmi pobożnymi oraz codziennie na rynku ze wszystkimi, których spotkał."
  tags: []
"Dz17,18":
  text: "Wtedy niektórzy z filozofów epikurejskich i stoickich spierali się z nim. Jedni mówili: Co chce powiedzieć ten nowinkarz? A inni: Zdaje się, że jest zwiastunem obcych bogów. Głosił im bowiem Jezusa i zmartwychwstanie."
  tags: []
"Dz17,19":
  text: "Zabrali go, zaprowadzili na Areopag i zapytali: Czy możemy się dowiedzieć, co to za nowa nauka, którą głosisz?"
  tags: []
"Dz17,20":
  text: "Bo przynosisz jakieś rzeczy obce naszym uszom. Chcemy więc wiedzieć, o co właściwie chodzi."
  tags: []
"Dz17,21":
  text: "(A wszyscy Ateńczycy i mieszkający tam cudzoziemcy nie poświęcali czasu na nic innego, tylko na opowiadanie lub słuchanie czegoś nowego)."
  tags: []
"Dz17,22":
  text: "Wtedy Paweł stanął pośrodku Areopagu i powiedział: Mężowie ateńscy, widzę, że pod każdym względem jesteście nadzwyczaj religijni."
  tags: []
"Dz17,23":
  text: "Przechadzając się bowiem i przypatrując waszym świętościom, znalazłem też ołtarz, na którym było napisane: Nieznanemu Bogu. Ja głoszę wam tego, którego nie znając, czcicie."
  tags: []
"Dz17,24":
  text: "Bóg, który stworzył świat i wszystko na nim, ten, który jest Panem nieba i ziemi, nie mieszka w świątyniach zbudowanych ręką."
  tags: []
"Dz17,25":
  text: "Ani nie jest czczony rękoma ludzkimi tak, jakby czegoś potrzebował, ponieważ sam daje wszystkim życie i oddech, i wszystko."
  tags: []
"Dz17,26":
  text: "I z jednej krwi uczynił wszystkie narody ludzkie, żeby mieszkały na całej powierzchni ziemi, określiwszy czasy wcześniej wyznaczone i zamierzone granice ich zamieszkania;"
  tags: []
"Dz17,27":
  text: "Żeby szukali Pana, czy go nie znajdą po omacku, chociaż nie jest daleko od nikogo z nas."
  tags: []
"Dz17,28":
  text: "Bo w nim żyjemy, poruszamy się i jesteśmy, jak też powiedzieli niektórzy z waszych poetów: I my bowiem jesteśmy z jego rodu."
  tags: []
"Dz17,29":
  text: "Będąc więc z rodu Boga, nie powinniśmy sądzić, że Bóstwo jest podobne do złota, srebra lub kamienia, misternie wyrzeźbionych według wyobrażenia ludzkiego."
  tags: []
"Dz17,30":
  text: "Bóg wprawdzie pomijał czasy tej nieświadomości, teraz jednak nakazuje wszędzie wszystkim ludziom pokutować;"
  tags: []
"Dz17,31":
  text: "Gdyż wyznaczył dzień, w którym będzie sprawiedliwie sądził cały świat przez człowieka, którego do tego przeznaczył, zapewniając o tym wszystkich przez wskrzeszenie go z martwych."
  tags: []
"Dz17,32":
  text: "Gdy usłyszeli o zmartwychwstaniu, jedni się naśmiewali, a inni mówili: Posłuchamy cię o tym ponownie."
  tags: []
"Dz17,33":
  text: "I tak Paweł wyszedł spośród nich."
  tags: []
"Dz17,34":
  text: "Lecz niektórzy ludzie przyłączyli się do niego i uwierzyli. Był też wśród nich Dionizy Areopagita i kobieta imieniem Damaris oraz inni z nimi."
  tags: []
