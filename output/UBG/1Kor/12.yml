"1Kor12,1": "A co do duchowych darów, bracia, nie chcę, żebyście byli w niewiedzy."
"1Kor12,2": "Wiecie, że gdy byliście poganami, do niemych bożków, jak was wiedziono, daliście się prowadzić."
"1Kor12,3": "Dlatego oznajmiam wam, że nikt, kto mówi przez Ducha Bożego, nie powie, że Jezus jest przeklęty. Nikt też nie może powiedzieć, że Jezus jest Panem, jak tylko przez Ducha Świętego."
"1Kor12,4": "A różne są dary, lecz ten sam Duch."
"1Kor12,5": "Różne też są posługi, lecz ten sam Pan."
"1Kor12,6": "I różne są działania, lecz ten sam Bóg, który sprawia wszystko we wszystkich."
"1Kor12,7": "A każdemu jest dany przejaw Ducha dla wspólnego pożytku."
"1Kor12,8": "Jednemu bowiem przez Ducha jest dana mowa mądrości, drugiemu mowa wiedzy przez tego samego Ducha;"
"1Kor12,9": "Innemu wiara w tym samym Duchu, innemu dar uzdrawiania w tym samym Duchu;"
"1Kor12,10": "Innemu dar czynienia cudów, innemu proroctwo, innemu rozróżnianie duchów, innemu różne rodzaje języków, a innemu tłumaczenie języków."
"1Kor12,11": "A to wszystko sprawia jeden i ten sam Duch, udzielając każdemu z osobna, jak chce."
"1Kor12,12": "Jak bowiem ciało jest jedno, a członków ma wiele i wszystkie członki jednego ciała, choć jest ich wiele, są jednym ciałem, tak i Chrystus."
"1Kor12,13": "Bo wszyscy przez jednego Ducha zostaliśmy ochrzczeni w jedno ciało, czy to Żydzi, czy Grecy, czy niewolnicy, czy wolni, i wszyscy zostaliśmy napojeni w jednego Ducha."
"1Kor12,14": "Ciało bowiem nie jest jednym członkiem, ale wieloma."
"1Kor12,15": "Gdyby noga powiedziała: Ponieważ nie jestem ręką, nie należę do ciała – czy dlatego nie należy do ciała?"
"1Kor12,16": "A gdyby ucho powiedziało: Ponieważ nie jestem okiem, nie należę do ciała – czy dlatego nie należy do ciała?"
"1Kor12,17": "Gdyby całe ciało było okiem, gdzież byłby słuch? A gdyby całe było słuchem, gdzież powonienie?"
"1Kor12,18": "Lecz Bóg umieścił członki w ciele, każdy z nich tak, jak chciał."
"1Kor12,19": "Gdyby wszystkie były jednym członkiem, gdzież byłoby ciało?"
"1Kor12,20": "Tymczasem wiele jest członków, lecz jedno ciało."
"1Kor12,21": "Nie może więc oko powiedzieć ręce: Nie potrzebuję ciebie, albo głowa nogom: Nie potrzebuję was."
"1Kor12,22": "Przeciwnie, o wiele bardziej potrzebne są te członki ciała, które wydają się najsłabsze."
"1Kor12,23": "A te, które uważamy za mało godne szacunku, tym większym otaczamy szacunkiem, a nasze wstydliwe członki otrzymują większe poszanowanie."
"1Kor12,24": "Natomiast nasze przyzwoite członki tego nie potrzebują. Lecz Bóg tak ukształtował ciało, że dał członkowi, któremu brakuje czci, więcej szacunku;"
"1Kor12,25": "Aby nie było podziału w ciele, ale żeby członki jednakowo troszczyły się o siebie nawzajem."
"1Kor12,26": "Tak więc, jeśli jeden członek cierpi, cierpią z nim wszystkie członki, a jeśli jeden członek doznaje czci, radują się z nim wszystkie członki."
"1Kor12,27": "Wy zaś jesteście ciałem Chrystusa, a z osobna członkami."
"1Kor12,28": "A Bóg ustanowił niektórych w kościele najpierw jako apostołów, potem proroków, po trzecie nauczycieli, potem cudotwórców, potem dary uzdrawiania, niesienia pomocy, rządzenia, różne języki."
"1Kor12,29": "Czy wszyscy są apostołami? Czy wszyscy prorokami? Czy wszyscy nauczycielami? Czy wszyscy cudotwórcami?"
"1Kor12,30": "Czy wszyscy mają dary uzdrawiania? Czy wszyscy mówią językami? Czy wszyscy tłumaczą?"
"1Kor12,31": "Starajcie się usilnie o lepsze dary; a ja wam wskażę drogę jeszcze doskonalszą."
