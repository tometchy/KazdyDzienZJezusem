"1Kor13,1": "Choćbym mówił językami ludzi i aniołów, a miłości bym nie miał, stałbym się jak miedź brzęcząca albo cymbał brzmiący."
"1Kor13,2": "I choćbym miał dar prorokowania, i znał wszystkie tajemnice, i posiadał wszelką wiedzę, i choćbym miał pełnię wiary, tak, żebym góry przenosił, a miłości bym nie miał, byłbym niczym."
"1Kor13,3": "I choćbym rozdał na żywność dla ubogich cały swój majątek, i choćbym wydał swoje ciało na spalenie, a miłości bym nie miał, nic nie zyskam."
"1Kor13,4": "Miłość jest cierpliwa, jest życzliwa. Miłość nie zazdrości, nie przechwala się, nie unosi się pychą;"
"1Kor13,5": "Nie postępuje nieprzyzwoicie, nie szuka swego, nie jest porywcza, nie myśli nic złego;"
"1Kor13,6": "Nie raduje się z niesprawiedliwości, ale raduje się z prawdy;"
"1Kor13,7": "Wszystko znosi, wszystkiemu wierzy, wszystkiego się spodziewa, wszystko przetrzyma."
"1Kor13,8": "Miłość nigdy nie ustaje. Bo choć są proroctwa, przeminą; choć języki, ustaną; choć wiedza, obróci się wniwecz."
"1Kor13,9": "Po części bowiem poznajemy i po części prorokujemy."
"1Kor13,10": "Ale gdy przyjdzie to, co doskonałe, wtedy przeminie to, co jest cząstkowe."
"1Kor13,11": "Dopóki byłem dzieckiem, mówiłem jak dziecko, rozumiałem jak dziecko, myślałem jak dziecko. Lecz gdy stałem się mężczyzną, zaniechałem tego, co dziecięce."
"1Kor13,12": "Teraz bowiem widzimy w zwierciadle, niewyraźnie, ale wówczas twarzą w twarz. Teraz poznaję cząstkowo, ale wtedy poznam tak, jak jestem poznany."
"1Kor13,13": "A teraz trwają wiara, nadzieja, miłość, te trzy. Z nich zaś największa jest miłość."
