"1Kor13,1":
  text: "Choćbym mówił językami ludzi i aniołów, a miłości bym nie miał, stałbym się jak miedź brzęcząca albo cymbał brzmiący."
  tags: []
"1Kor13,2":
  text: "I choćbym miał dar prorokowania, i znał wszystkie tajemnice, i posiadał wszelką wiedzę, i choćbym miał pełnię wiary, tak, żebym góry przenosił, a miłości bym nie miał, byłbym niczym."
  tags: []
"1Kor13,3":
  text: "I choćbym rozdał na żywność dla ubogich cały swój majątek, i choćbym wydał swoje ciało na spalenie, a miłości bym nie miał, nic nie zyskam."
  tags: []
"1Kor13,4":
  text: "Miłość jest cierpliwa, jest życzliwa. Miłość nie zazdrości, nie przechwala się, nie unosi się pychą;"
  tags: []
"1Kor13,5":
  text: "Nie postępuje nieprzyzwoicie, nie szuka swego, nie jest porywcza, nie myśli nic złego;"
  tags: []
"1Kor13,6":
  text: "Nie raduje się z niesprawiedliwości, ale raduje się z prawdy;"
  tags: []
"1Kor13,7":
  text: "Wszystko znosi, wszystkiemu wierzy, wszystkiego się spodziewa, wszystko przetrzyma."
  tags: []
"1Kor13,8":
  text: "Miłość nigdy nie ustaje. Bo choć są proroctwa, przeminą; choć języki, ustaną; choć wiedza, obróci się wniwecz."
  tags: []
"1Kor13,9":
  text: "Po części bowiem poznajemy i po części prorokujemy."
  tags: []
"1Kor13,10":
  text: "Ale gdy przyjdzie to, co doskonałe, wtedy przeminie to, co jest cząstkowe."
  tags: []
"1Kor13,11":
  text: "Dopóki byłem dzieckiem, mówiłem jak dziecko, rozumiałem jak dziecko, myślałem jak dziecko. Lecz gdy stałem się mężczyzną, zaniechałem tego, co dziecięce."
  tags: []
"1Kor13,12":
  text: "Teraz bowiem widzimy w zwierciadle, niewyraźnie, ale wówczas twarzą w twarz. Teraz poznaję cząstkowo, ale wtedy poznam tak, jak jestem poznany."
  tags: []
"1Kor13,13":
  text: "A teraz trwają wiara, nadzieja, miłość, te trzy. Z nich zaś największa jest miłość."
  tags: []
