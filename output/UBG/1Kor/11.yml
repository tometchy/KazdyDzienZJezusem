"1Kor11,1": "Bądźcie moimi naśladowcami, jak i ja jestem naśladowcą Chrystusa."
"1Kor11,2": "A chwalę was, bracia, za to, że we wszystkim o mnie pamiętacie i zachowujecie nauki tak, jak je wam przekazałem."
"1Kor11,3": "Lecz chcę, żebyście wiedzieli, że głową każdego mężczyzny jest Chrystus, a głową kobiety mężczyzna, a głową Chrystusa Bóg."
"1Kor11,4": "Każdy mężczyzna, gdy się modli albo prorokuje z nakrytą głową, hańbi swoją głowę."
"1Kor11,5": "I każda kobieta, gdy się modli albo prorokuje z nienakrytą głową, hańbi swoją głowę. Bo to jest jedno i to samo, jakby była ogolona."
"1Kor11,6": "Jeśli więc kobieta nie nakrywa głowy, niech się też strzyże. A jeśli hańbiące jest dla kobiety być ostrzyżoną lub ogoloną, niech nakrywa głowę."
"1Kor11,7": "Mężczyzna zaś nie powinien nakrywać głowy, gdyż jest obrazem i chwałą Boga. Kobieta zaś jest chwałą mężczyzny."
"1Kor11,8": "Bo mężczyzna nie jest z kobiety, lecz kobieta z mężczyzny."
"1Kor11,9": "Mężczyzna bowiem nie został stworzony dla kobiety, ale kobieta dla mężczyzny."
"1Kor11,10": "Dlatego kobieta powinna mieć na głowie znak władzy, ze względu na aniołów."
"1Kor11,11": "A jednak w Panu ani mężczyzna nie jest bez kobiety, ani kobieta nie jest bez mężczyzny."
"1Kor11,12": "Jak bowiem kobieta jest z mężczyzny, tak też mężczyzna przez kobietę, lecz wszystko jest z Boga."
"1Kor11,13": "Osądźcie sami: Czy wypada kobiecie modlić się do Boga bez nakrycia głowy?"
"1Kor11,14": "Czyż sama natura nie uczy was, że gdy mężczyzna nosi długie włosy, przynosi mu to wstyd?"
"1Kor11,15": "Ale jeśli kobieta nosi długie włosy, przynosi jej to chwałę, gdyż włosy zostały jej dane za okrycie."
"1Kor11,16": "A jeśli ktoś wydaje się być kłótliwy, my takiego zwyczaju nie mamy, ani kościoły Boże."
"1Kor11,17": "Mówiąc to, nie chwalę was, że się zbieracie nie ku lepszemu, ale ku gorszemu."
"1Kor11,18": "Najpierw bowiem słyszę, że gdy się zbieracie jako kościół, są wśród was podziały, i po części temu wierzę."
"1Kor11,19": "Bo muszą być między wami herezje, aby się okazało, którzy są wypróbowani wśród was."
"1Kor11,20": "Gdy więc się zbieracie, nie jest to spożywanie wieczerzy Pańskiej."
"1Kor11,21": "Każdy bowiem najpierw je własną wieczerzę i jeden jest głodny, a drugi pijany."
"1Kor11,22": "Czyż nie macie domów, aby jeść i pić? Albo czy gardzicie kościołem Bożym i zawstydzacie tych, którzy nic nie mają? Co mam wam powiedzieć? Czy mam was pochwalić? Za to was nie chwalę."
"1Kor11,23": "Ja bowiem otrzymałem od Pana to, co wam przekazałem, że Pan Jezus tej nocy, której został wydany, wziął chleb;"
"1Kor11,24": "A gdy złożył dziękczynienie, połamał i powiedział: Bierzcie i jedzcie, to jest moje ciało, które za was jest łamane. Czyńcie to na moją pamiątkę."
"1Kor11,25": "Podobnie po wieczerzy wziął też kielich, mówiąc: Ten kielich to nowy testament w mojej krwi. Czyńcie to, ilekroć będziecie pić, na moją pamiątkę."
"1Kor11,26": "Ilekroć bowiem będziecie jedli ten chleb i pili ten kielich, śmierć Pana zwiastujecie, aż przyjdzie."
"1Kor11,27": "Dlatego też kto je ten chleb albo pije ten kielich Pański niegodnie, będzie winny ciała i krwi Pana."
"1Kor11,28": "Niech więc człowiek bada samego siebie i tak niech je z tego chleba, i niech pije z tego kielicha."
"1Kor11,29": "Kto bowiem je i pije niegodnie, sąd własny je i pije, nie rozróżniając ciała Pańskiego."
"1Kor11,30": "Dlatego jest wśród was wielu słabych i chorych, a niemało też zasnęło."
"1Kor11,31": "Bo gdybyśmy sami siebie sądzili, nie bylibyśmy sądzeni."
"1Kor11,32": "Lecz gdy jesteśmy sądzeni, przez Pana jesteśmy karceni, abyśmy nie byli potępieni wraz ze światem."
"1Kor11,33": "Tak więc, moi bracia, gdy się zbieracie, aby jeść, czekajcie jedni na drugich."
"1Kor11,34": "A jeśli ktoś jest głodny, niech zje w domu, żebyście się nie zbierali ku sądowi. Co do pozostałych spraw, zarządzę, gdy przyjdę."
