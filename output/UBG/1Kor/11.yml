"1Kor11,1":
  text: "Bądźcie moimi naśladowcami, jak i ja jestem naśladowcą Chrystusa."
  tags: []
"1Kor11,2":
  text: "A chwalę was, bracia, za to, że we wszystkim o mnie pamiętacie i zachowujecie nauki tak, jak je wam przekazałem."
  tags: []
"1Kor11,3":
  text: "Lecz chcę, żebyście wiedzieli, że głową każdego mężczyzny jest Chrystus, a głową kobiety mężczyzna, a głową Chrystusa Bóg."
  tags: []
"1Kor11,4":
  text: "Każdy mężczyzna, gdy się modli albo prorokuje z nakrytą głową, hańbi swoją głowę."
  tags: []
"1Kor11,5":
  text: "I każda kobieta, gdy się modli albo prorokuje z nienakrytą głową, hańbi swoją głowę. Bo to jest jedno i to samo, jakby była ogolona."
  tags: []
"1Kor11,6":
  text: "Jeśli więc kobieta nie nakrywa głowy, niech się też strzyże. A jeśli hańbiące jest dla kobiety być ostrzyżoną lub ogoloną, niech nakrywa głowę."
  tags: []
"1Kor11,7":
  text: "Mężczyzna zaś nie powinien nakrywać głowy, gdyż jest obrazem i chwałą Boga. Kobieta zaś jest chwałą mężczyzny."
  tags: []
"1Kor11,8":
  text: "Bo mężczyzna nie jest z kobiety, lecz kobieta z mężczyzny."
  tags: []
"1Kor11,9":
  text: "Mężczyzna bowiem nie został stworzony dla kobiety, ale kobieta dla mężczyzny."
  tags: []
"1Kor11,10":
  text: "Dlatego kobieta powinna mieć na głowie znak władzy, ze względu na aniołów."
  tags: []
"1Kor11,11":
  text: "A jednak w Panu ani mężczyzna nie jest bez kobiety, ani kobieta nie jest bez mężczyzny."
  tags: []
"1Kor11,12":
  text: "Jak bowiem kobieta jest z mężczyzny, tak też mężczyzna przez kobietę, lecz wszystko jest z Boga."
  tags: []
"1Kor11,13":
  text: "Osądźcie sami: Czy wypada kobiecie modlić się do Boga bez nakrycia głowy?"
  tags: []
"1Kor11,14":
  text: "Czyż sama natura nie uczy was, że gdy mężczyzna nosi długie włosy, przynosi mu to wstyd?"
  tags: []
"1Kor11,15":
  text: "Ale jeśli kobieta nosi długie włosy, przynosi jej to chwałę, gdyż włosy zostały jej dane za okrycie."
  tags: []
"1Kor11,16":
  text: "A jeśli ktoś wydaje się być kłótliwy, my takiego zwyczaju nie mamy, ani kościoły Boże."
  tags: []
"1Kor11,17":
  text: "Mówiąc to, nie chwalę was, że się zbieracie nie ku lepszemu, ale ku gorszemu."
  tags: []
"1Kor11,18":
  text: "Najpierw bowiem słyszę, że gdy się zbieracie jako kościół, są wśród was podziały, i po części temu wierzę."
  tags: []
"1Kor11,19":
  text: "Bo muszą być między wami herezje, aby się okazało, którzy są wypróbowani wśród was."
  tags: []
"1Kor11,20":
  text: "Gdy więc się zbieracie, nie jest to spożywanie wieczerzy Pańskiej."
  tags: []
"1Kor11,21":
  text: "Każdy bowiem najpierw je własną wieczerzę i jeden jest głodny, a drugi pijany."
  tags: []
"1Kor11,22":
  text: "Czyż nie macie domów, aby jeść i pić? Albo czy gardzicie kościołem Bożym i zawstydzacie tych, którzy nic nie mają? Co mam wam powiedzieć? Czy mam was pochwalić? Za to was nie chwalę."
  tags: []
"1Kor11,23":
  text: "Ja bowiem otrzymałem od Pana to, co wam przekazałem, że Pan Jezus tej nocy, której został wydany, wziął chleb;"
  tags: []
"1Kor11,24":
  text: "A gdy złożył dziękczynienie, połamał i powiedział: Bierzcie i jedzcie, to jest moje ciało, które za was jest łamane. Czyńcie to na moją pamiątkę."
  tags: []
"1Kor11,25":
  text: "Podobnie po wieczerzy wziął też kielich, mówiąc: Ten kielich to nowy testament w mojej krwi. Czyńcie to, ilekroć będziecie pić, na moją pamiątkę."
  tags: []
"1Kor11,26":
  text: "Ilekroć bowiem będziecie jedli ten chleb i pili ten kielich, śmierć Pana zwiastujecie, aż przyjdzie."
  tags: []
"1Kor11,27":
  text: "Dlatego też kto je ten chleb albo pije ten kielich Pański niegodnie, będzie winny ciała i krwi Pana."
  tags: []
"1Kor11,28":
  text: "Niech więc człowiek bada samego siebie i tak niech je z tego chleba, i niech pije z tego kielicha."
  tags: []
"1Kor11,29":
  text: "Kto bowiem je i pije niegodnie, sąd własny je i pije, nie rozróżniając ciała Pańskiego."
  tags: []
"1Kor11,30":
  text: "Dlatego jest wśród was wielu słabych i chorych, a niemało też zasnęło."
  tags: []
"1Kor11,31":
  text: "Bo gdybyśmy sami siebie sądzili, nie bylibyśmy sądzeni."
  tags: []
"1Kor11,32":
  text: "Lecz gdy jesteśmy sądzeni, przez Pana jesteśmy karceni, abyśmy nie byli potępieni wraz ze światem."
  tags: []
"1Kor11,33":
  text: "Tak więc, moi bracia, gdy się zbieracie, aby jeść, czekajcie jedni na drugich."
  tags: []
"1Kor11,34":
  text: "A jeśli ktoś jest głodny, niech zje w domu, żebyście się nie zbierali ku sądowi. Co do pozostałych spraw, zarządzę, gdy przyjdę."
  tags: []
