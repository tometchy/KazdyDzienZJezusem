"1Kor15,1": "A oznajmiam wam, bracia, ewangelię, którą wam głosiłem, a którą przyjęliście i w której trwacie;"
"1Kor15,2": "Przez którą też dostępujecie zbawienia, jeśli pamiętacie to, co wam głosiłem, chyba że uwierzyliście na próżno."
"1Kor15,3": "Najpierw bowiem przekazałem wam to, co i ja otrzymałem, że Chrystus umarł za nasze grzechy, zgodnie z Pismem;"
"1Kor15,4": "Że został pogrzebany, że zmartwychwstał trzeciego dnia, zgodnie z Pismem;"
"1Kor15,5": "I że ukazał się Kefasowi, a potem tym dwunastu."
"1Kor15,6": "Potem ukazał się więcej niż pięciuset braciom naraz, z których większość żyje aż dotąd, a niektórzy zasnęli."
"1Kor15,7": "Potem ukazał się Jakubowi, potem wszystkim apostołom."
"1Kor15,8": "A ostatniemu ze wszystkich ukazał się i mnie, jak poronionemu płodowi."
"1Kor15,9": "Ja bowiem jestem najmniejszym z apostołów i nie jestem godny nazywać się apostołem, bo prześladowałem kościół Boży."
"1Kor15,10": "Lecz z łaski Boga jestem tym, czym jestem, a jego łaska względem mnie nie okazała się daremna, ale pracowałem więcej od nich wszystkich, jednak nie ja, lecz łaska Boga, która jest ze mną."
"1Kor15,11": "Czy więc ja, czy oni, tak głosimy i tak uwierzyliście."
"1Kor15,12": "A jeśli się o Chrystusie głosi, że został wskrzeszony z martwych, jak mogą niektórzy pośród was mówić, że nie ma zmartwychwstania?"
"1Kor15,13": "Jeśli bowiem nie ma zmartwychwstania, to i Chrystus nie został wskrzeszony."
"1Kor15,14": "A jeśli Chrystus nie został wskrzeszony, to daremne jest nasze głoszenie, daremna też wasza wiara."
"1Kor15,15": "I okazuje się, że jesteśmy fałszywymi świadkami Boga, bo świadczyliśmy o Bogu, że wskrzesił Chrystusa, którego nie wskrzesił, jeśli umarli nie są wskrzeszani."
"1Kor15,16": "Jeśli bowiem umarli nie są wskrzeszani, to i Chrystus nie został wskrzeszony."
"1Kor15,17": "A jeśli Chrystus nie został wskrzeszony, daremna jest wasza wiara i nadal jesteście w swoich grzechach."
"1Kor15,18": "Tak więc i ci, którzy zasnęli w Chrystusie, poginęli."
"1Kor15,19": "Jeśli tylko w tym życiu mamy nadzieję w Chrystusie, jesteśmy ze wszystkich ludzi najbardziej nieszczęśliwi."
"1Kor15,20": "Tymczasem jednak Chrystus został wskrzeszony z martwych i stał się pierwszym plonem tych, którzy zasnęli."
"1Kor15,21": "Skoro bowiem śmierć przyszła przez człowieka, przez człowieka przyszło też zmartwychwstanie umarłych."
"1Kor15,22": "Jak bowiem w Adamie wszyscy umierają, tak też w Chrystusie wszyscy zostaną ożywieni."
"1Kor15,23": "Ale każdy w swojej kolejności, Chrystus jako pierwszy plon, potem ci, którzy należą do Chrystusa, w czasie jego przyjścia."
"1Kor15,24": "A potem będzie koniec, gdy przekaże królestwo Bogu i Ojcu, gdy zniszczy wszelką zwierzchność oraz wszelką władzę i moc."
"1Kor15,25": "Bo on musi królować, aż położy wszystkich wrogów pod swoje stopy."
"1Kor15,26": "A ostatni wróg, który zostanie zniszczony, to śmierć."
"1Kor15,27": "Wszystko bowiem poddał pod jego stopy. A gdy mówi, że wszystko jest mu poddane, jest jasne, że oprócz tego, który mu wszystko poddał."
"1Kor15,28": "Gdy zaś wszystko zostanie mu poddane, wtedy i sam Syn będzie poddany temu, który mu poddał wszystko, aby Bóg był wszystkim we wszystkich."
"1Kor15,29": "Bo inaczej co zrobią ci, którzy przyjmują chrzest za zmarłych, jeśli umarli w ogóle nie są wskrzeszani? Po co przyjmują chrzest za zmarłych?"
"1Kor15,30": "Po co i my każdej godziny narażamy się na niebezpieczeństwo?"
"1Kor15,31": "Zapewniam was przez chlubę, którą mam z was w Jezusie Chrystusie, naszym Panu, że każdego dnia umieram."
"1Kor15,32": "Jeśli na sposób ludzki walczyłem z bestiami w Efezie, jaki z tego mam pożytek, jeśli umarli nie są wskrzeszani? Jedzmy i pijmy, bo jutro pomrzemy."
"1Kor15,33": "Nie łudźcie się. Złe rozmowy psują dobre obyczaje."
"1Kor15,34": "Ocknijcie się ku sprawiedliwości i nie grzeszcie; niektórzy bowiem nie mają poznania Boga. Mówię to ku waszemu zawstydzeniu."
"1Kor15,35": "Lecz powie ktoś: Jak umarli są wskrzeszani i w jakim ciele przychodzą?"
"1Kor15,36": "Głupcze! To, co siejesz, nie ożyje, jeśli nie obumrze."
"1Kor15,37": "I to, co siejesz, to nie ciało, które ma powstać, ale gołe ziarno, na przykład pszeniczne lub jakieś inne."
"1Kor15,38": "Bóg zaś daje mu ciało, jakie chce, a każdemu z ziaren właściwe jemu ciało."
"1Kor15,39": "Nie każde ciało jest jednakowe, ale inne jest ciało ludzi, a inne ciało zwierząt, inne ryb, a inne ptaków."
"1Kor15,40": "Są też ciała niebieskie i ciała ziemskie, lecz inna jest chwała ciał niebieskich, a inna ziemskich."
"1Kor15,41": "Inna chwała słońca, inna chwała księżyca, a inna chwała gwiazd. Gwiazda bowiem od gwiazdy różni się jasnością."
"1Kor15,42": "Tak też jest ze zmartwychwstaniem umarłych. Sieje się ciało w zniszczalności, a jest wskrzeszane w niezniszczalności;"
"1Kor15,43": "Sieje się w niesławie, a jest wskrzeszane w chwale, sieje się w słabości, a jest wskrzeszane w mocy;"
"1Kor15,44": "Sieje się ciało cielesne, a jest wskrzeszane ciało duchowe. Jest ciało cielesne, jest też ciało duchowe."
"1Kor15,45": "Tak też jest napisane: Stał się pierwszy człowiek, Adam, duszą żyjącą, a ostatni Adam duchem ożywiającym."
"1Kor15,46": "Jednak pierwsze nie jest to, co duchowe, ale to, co cielesne, potem duchowe."
"1Kor15,47": "Pierwszy człowiek z ziemi – ziemski, drugi człowiek – sam Pan z nieba."
"1Kor15,48": "Jaki jest ten ziemski, tacy i ziemscy; a jaki jest niebieski, tacy i niebiescy."
"1Kor15,49": "A jak nosiliśmy obraz ziemskiego, tak będziemy nosili obraz niebieskiego."
"1Kor15,50": "To zaś mówię, bracia, że ciało i krew nie mogą odziedziczyć królestwa Bożego ani to, co zniszczalne, nie odziedziczy tego, co niezniszczalne."
"1Kor15,51": "Oto oznajmiam wam tajemnicę: Nie wszyscy zaśniemy, ale wszyscy będziemy przemienieni;"
"1Kor15,52": "W jednej chwili, w mgnieniu oka, na ostatnią trąbę. Zabrzmi bowiem trąba, a umarli zostaną wskrzeszeni niezniszczalni, a my zostaniemy przemienieni."
"1Kor15,53": "To bowiem, co zniszczalne, musi przyodziać się w to, co niezniszczalne, a to, co śmiertelne, przyoblec się w nieśmiertelność."
"1Kor15,54": "A gdy to, co zniszczalne, przyoblecze się w niezniszczalność, a to, co śmiertelne, przyoblecze się w nieśmiertelność, wtedy wypełni się to słowo, które jest napisane: Połknięta jest śmierć w zwycięstwie."
"1Kor15,55": "Gdzież jest, o śmierci, twoje żądło? Gdzież jest, o piekło, twoje zwycięstwo?"
"1Kor15,56": "Żądłem zaś śmierci jest grzech, a siłą grzechu prawo."
"1Kor15,57": "Lecz dzięki niech będą Bogu, który nam dał zwycięstwo przez naszego Pana Jezusa Chrystusa."
"1Kor15,58": "A tak, moi mili bracia, bądźcie stali, niezachwiani, zawsze obfitujący w dziele Pana, wiedząc, że wasza praca nie jest daremna w Panu."
