"1Kor15,1":
  text: "A oznajmiam wam, bracia, ewangelię, którą wam głosiłem, a którą przyjęliście i w której trwacie;"
  tags: []
"1Kor15,2":
  text: "Przez którą też dostępujecie zbawienia, jeśli pamiętacie to, co wam głosiłem, chyba że uwierzyliście na próżno."
  tags: []
"1Kor15,3":
  text: "Najpierw bowiem przekazałem wam to, co i ja otrzymałem, że Chrystus umarł za nasze grzechy, zgodnie z Pismem;"
  tags: []
"1Kor15,4":
  text: "Że został pogrzebany, że zmartwychwstał trzeciego dnia, zgodnie z Pismem;"
  tags: []
"1Kor15,5":
  text: "I że ukazał się Kefasowi, a potem tym dwunastu."
  tags: []
"1Kor15,6":
  text: "Potem ukazał się więcej niż pięciuset braciom naraz, z których większość żyje aż dotąd, a niektórzy zasnęli."
  tags: []
"1Kor15,7":
  text: "Potem ukazał się Jakubowi, potem wszystkim apostołom."
  tags: []
"1Kor15,8":
  text: "A ostatniemu ze wszystkich ukazał się i mnie, jak poronionemu płodowi."
  tags: []
"1Kor15,9":
  text: "Ja bowiem jestem najmniejszym z apostołów i nie jestem godny nazywać się apostołem, bo prześladowałem kościół Boży."
  tags: []
"1Kor15,10":
  text: "Lecz z łaski Boga jestem tym, czym jestem, a jego łaska względem mnie nie okazała się daremna, ale pracowałem więcej od nich wszystkich, jednak nie ja, lecz łaska Boga, która jest ze mną."
  tags: []
"1Kor15,11":
  text: "Czy więc ja, czy oni, tak głosimy i tak uwierzyliście."
  tags: []
"1Kor15,12":
  text: "A jeśli się o Chrystusie głosi, że został wskrzeszony z martwych, jak mogą niektórzy pośród was mówić, że nie ma zmartwychwstania?"
  tags: []
"1Kor15,13":
  text: "Jeśli bowiem nie ma zmartwychwstania, to i Chrystus nie został wskrzeszony."
  tags: []
"1Kor15,14":
  text: "A jeśli Chrystus nie został wskrzeszony, to daremne jest nasze głoszenie, daremna też wasza wiara."
  tags: []
"1Kor15,15":
  text: "I okazuje się, że jesteśmy fałszywymi świadkami Boga, bo świadczyliśmy o Bogu, że wskrzesił Chrystusa, którego nie wskrzesił, jeśli umarli nie są wskrzeszani."
  tags: []
"1Kor15,16":
  text: "Jeśli bowiem umarli nie są wskrzeszani, to i Chrystus nie został wskrzeszony."
  tags: []
"1Kor15,17":
  text: "A jeśli Chrystus nie został wskrzeszony, daremna jest wasza wiara i nadal jesteście w swoich grzechach."
  tags: []
"1Kor15,18":
  text: "Tak więc i ci, którzy zasnęli w Chrystusie, poginęli."
  tags: []
"1Kor15,19":
  text: "Jeśli tylko w tym życiu mamy nadzieję w Chrystusie, jesteśmy ze wszystkich ludzi najbardziej nieszczęśliwi."
  tags: []
"1Kor15,20":
  text: "Tymczasem jednak Chrystus został wskrzeszony z martwych i stał się pierwszym plonem tych, którzy zasnęli."
  tags: []
"1Kor15,21":
  text: "Skoro bowiem śmierć przyszła przez człowieka, przez człowieka przyszło też zmartwychwstanie umarłych."
  tags: []
"1Kor15,22":
  text: "Jak bowiem w Adamie wszyscy umierają, tak też w Chrystusie wszyscy zostaną ożywieni."
  tags: []
"1Kor15,23":
  text: "Ale każdy w swojej kolejności, Chrystus jako pierwszy plon, potem ci, którzy należą do Chrystusa, w czasie jego przyjścia."
  tags: []
"1Kor15,24":
  text: "A potem będzie koniec, gdy przekaże królestwo Bogu i Ojcu, gdy zniszczy wszelką zwierzchność oraz wszelką władzę i moc."
  tags: []
"1Kor15,25":
  text: "Bo on musi królować, aż położy wszystkich wrogów pod swoje stopy."
  tags: []
"1Kor15,26":
  text: "A ostatni wróg, który zostanie zniszczony, to śmierć."
  tags: []
"1Kor15,27":
  text: "Wszystko bowiem poddał pod jego stopy. A gdy mówi, że wszystko jest mu poddane, jest jasne, że oprócz tego, który mu wszystko poddał."
  tags: []
"1Kor15,28":
  text: "Gdy zaś wszystko zostanie mu poddane, wtedy i sam Syn będzie poddany temu, który mu poddał wszystko, aby Bóg był wszystkim we wszystkich."
  tags: []
"1Kor15,29":
  text: "Bo inaczej co zrobią ci, którzy przyjmują chrzest za zmarłych, jeśli umarli w ogóle nie są wskrzeszani? Po co przyjmują chrzest za zmarłych?"
  tags: []
"1Kor15,30":
  text: "Po co i my każdej godziny narażamy się na niebezpieczeństwo?"
  tags: []
"1Kor15,31":
  text: "Zapewniam was przez chlubę, którą mam z was w Jezusie Chrystusie, naszym Panu, że każdego dnia umieram."
  tags: []
"1Kor15,32":
  text: "Jeśli na sposób ludzki walczyłem z bestiami w Efezie, jaki z tego mam pożytek, jeśli umarli nie są wskrzeszani? Jedzmy i pijmy, bo jutro pomrzemy."
  tags: []
"1Kor15,33":
  text: "Nie łudźcie się. Złe rozmowy psują dobre obyczaje."
  tags: []
"1Kor15,34":
  text: "Ocknijcie się ku sprawiedliwości i nie grzeszcie; niektórzy bowiem nie mają poznania Boga. Mówię to ku waszemu zawstydzeniu."
  tags: []
"1Kor15,35":
  text: "Lecz powie ktoś: Jak umarli są wskrzeszani i w jakim ciele przychodzą?"
  tags: []
"1Kor15,36":
  text: "Głupcze! To, co siejesz, nie ożyje, jeśli nie obumrze."
  tags: []
"1Kor15,37":
  text: "I to, co siejesz, to nie ciało, które ma powstać, ale gołe ziarno, na przykład pszeniczne lub jakieś inne."
  tags: []
"1Kor15,38":
  text: "Bóg zaś daje mu ciało, jakie chce, a każdemu z ziaren właściwe jemu ciało."
  tags: []
"1Kor15,39":
  text: "Nie każde ciało jest jednakowe, ale inne jest ciało ludzi, a inne ciało zwierząt, inne ryb, a inne ptaków."
  tags: []
"1Kor15,40":
  text: "Są też ciała niebieskie i ciała ziemskie, lecz inna jest chwała ciał niebieskich, a inna ziemskich."
  tags: []
"1Kor15,41":
  text: "Inna chwała słońca, inna chwała księżyca, a inna chwała gwiazd. Gwiazda bowiem od gwiazdy różni się jasnością."
  tags: []
"1Kor15,42":
  text: "Tak też jest ze zmartwychwstaniem umarłych. Sieje się ciało w zniszczalności, a jest wskrzeszane w niezniszczalności;"
  tags: []
"1Kor15,43":
  text: "Sieje się w niesławie, a jest wskrzeszane w chwale, sieje się w słabości, a jest wskrzeszane w mocy;"
  tags: []
"1Kor15,44":
  text: "Sieje się ciało cielesne, a jest wskrzeszane ciało duchowe. Jest ciało cielesne, jest też ciało duchowe."
  tags: []
"1Kor15,45":
  text: "Tak też jest napisane: Stał się pierwszy człowiek, Adam, duszą żyjącą, a ostatni Adam duchem ożywiającym."
  tags: []
"1Kor15,46":
  text: "Jednak pierwsze nie jest to, co duchowe, ale to, co cielesne, potem duchowe."
  tags: []
"1Kor15,47":
  text: "Pierwszy człowiek z ziemi – ziemski, drugi człowiek – sam Pan z nieba."
  tags: []
"1Kor15,48":
  text: "Jaki jest ten ziemski, tacy i ziemscy; a jaki jest niebieski, tacy i niebiescy."
  tags: []
"1Kor15,49":
  text: "A jak nosiliśmy obraz ziemskiego, tak będziemy nosili obraz niebieskiego."
  tags: []
"1Kor15,50":
  text: "To zaś mówię, bracia, że ciało i krew nie mogą odziedziczyć królestwa Bożego ani to, co zniszczalne, nie odziedziczy tego, co niezniszczalne."
  tags: []
"1Kor15,51":
  text: "Oto oznajmiam wam tajemnicę: Nie wszyscy zaśniemy, ale wszyscy będziemy przemienieni;"
  tags: []
"1Kor15,52":
  text: "W jednej chwili, w mgnieniu oka, na ostatnią trąbę. Zabrzmi bowiem trąba, a umarli zostaną wskrzeszeni niezniszczalni, a my zostaniemy przemienieni."
  tags: []
"1Kor15,53":
  text: "To bowiem, co zniszczalne, musi przyodziać się w to, co niezniszczalne, a to, co śmiertelne, przyoblec się w nieśmiertelność."
  tags: []
"1Kor15,54":
  text: "A gdy to, co zniszczalne, przyoblecze się w niezniszczalność, a to, co śmiertelne, przyoblecze się w nieśmiertelność, wtedy wypełni się to słowo, które jest napisane: Połknięta jest śmierć w zwycięstwie."
  tags: []
"1Kor15,55":
  text: "Gdzież jest, o śmierci, twoje żądło? Gdzież jest, o piekło, twoje zwycięstwo?"
  tags: []
"1Kor15,56":
  text: "Żądłem zaś śmierci jest grzech, a siłą grzechu prawo."
  tags: []
"1Kor15,57":
  text: "Lecz dzięki niech będą Bogu, który nam dał zwycięstwo przez naszego Pana Jezusa Chrystusa."
  tags: []
"1Kor15,58":
  text: "A tak, moi mili bracia, bądźcie stali, niezachwiani, zawsze obfitujący w dziele Pana, wiedząc, że wasza praca nie jest daremna w Panu."
  tags: []
