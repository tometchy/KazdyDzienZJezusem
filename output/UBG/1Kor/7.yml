"1Kor7,1": "Co do spraw, o których mi pisaliście: Dobrze jest mężczyźnie nie dotykać kobiety."
"1Kor7,2": "Jednak aby uniknąć nierządu, niech każdy ma swoją żonę i każda niech ma swojego męża."
"1Kor7,3": "Niech mąż oddaje powinność żonie, podobnie i żona mężowi."
"1Kor7,4": "Żona nie ma władzy nad własnym ciałem, lecz mąż. Podobnie i mąż nie ma władzy nad własnym ciałem, lecz żona."
"1Kor7,5": "Nie okradajcie się z tego, chyba że za obopólną zgodą, na pewien czas, aby oddać się postowi i modlitwie. Potem znów się zejdźcie, żeby was szatan nie kusił z powodu waszej niepowściągliwości."
"1Kor7,6": "Lecz to, co mówię, jest z pozwolenia, a nie z rozkazu."
"1Kor7,7": "Chciałbym bowiem, aby wszyscy ludzie byli tacy jak ja, ale każdy ma swój własny dar od Boga, jeden taki, a drugi inny."
"1Kor7,8": "A do nieżonatych i wdów mówię: Dobrze będzie dla nich, jeśli pozostaną jak ja."
"1Kor7,9": "Lecz jeśli nie mogą się wstrzymać, niech wstąpią w stan małżeński. Lepiej jest bowiem wstąpić w stan małżeński, niż płonąć."
"1Kor7,10": "Tym zaś, którzy trwają w związku małżeńskim, nakazuję nie ja, lecz Pan: Żona niech nie odchodzi od męża."
"1Kor7,11": "Lecz jeśli odeszłaby, niech pozostanie bez męża albo niech się z mężem pojedna. Mąż również niech nie oddala żony."
"1Kor7,12": "Pozostałym zaś mówię ja, a nie Pan: Jeśli któryś z braci ma żonę niewierzącą, a ta zgadza się z nim mieszkać, niech jej nie oddala."
"1Kor7,13": "A jeśli jakaś żona ma męża niewierzącego, a ten zgadza się z nią mieszkać, niech od niego nie odchodzi."
"1Kor7,14": "Mąż niewierzący bowiem jest uświęcony przez żonę, a żona niewierząca uświęcona jest przez męża. Inaczej wasze dzieci byłyby nieczyste, teraz zaś są święte."
"1Kor7,15": "Lecz jeśli niewierzący chce odejść, niech odejdzie. W takich przypadkach ani brat, ani siostra nie są w niewoli. Bóg zaś powołał nas do pokoju."
"1Kor7,16": "Co bowiem wiesz, żono, czy zbawisz męża? Albo co wiesz, mężu, czy zbawisz żonę?"
"1Kor7,17": "Jednak niech każdy postępuje tak, jak mu wyznaczył Bóg, zgodnie z tym, do czego go powołał Pan. Tak też zarządzam we wszystkich kościołach."
"1Kor7,18": "Został ktoś powołany jako obrzezany? Niech się nie staje nieobrzezanym. Został ktoś powołany jako nieobrzezany? Niech się nie obrzezuje."
"1Kor7,19": "Obrzezanie nic nie znaczy i nieobrzezanie nic nie znaczy, tylko zachowywanie przykazań Boga."
"1Kor7,20": "Niech każdy pozostanie w stanie, w jakim został powołany."
"1Kor7,21": "Zostałeś powołany jako niewolnik? Nie martw się tym. Lecz jeśli możesz stać się wolny, to raczej z tego skorzystaj."
"1Kor7,22": "Ten bowiem, kto został powołany w Panu jako niewolnik, jest wyzwoleńcem Pana. Podobnie ten, kto został powołany jako wolny, jest niewolnikiem Chrystusa."
"1Kor7,23": "Drogo zostaliście kupieni. Nie bądźcie niewolnikami ludzi."
"1Kor7,24": "Niech każdy, bracia, trwa przed Bogiem w takim stanie, w jakim został powołany."
"1Kor7,25": "A co do osób dziewiczych nie mam nakazu Pańskiego, ale daję moją radę jako ten, któremu Pan dał miłosierdzie, aby był wiernym."
"1Kor7,26": "Uważam więc, że to jest dobre z powodu obecnych utrapień, że dobrze jest człowiekowi tak pozostać."
"1Kor7,27": "Jesteś związany z żoną? Nie szukaj rozłączenia. Jesteś rozwiązany od żony? Nie szukaj żony."
"1Kor7,28": "Ale jeśli się ożenisz, nie grzeszysz, i jeśli dziewica wyjdzie za mąż, nie grzeszy. Tacy jednak będą mieć utrapienie w ciele, a ja chciałbym wam tego oszczędzić."
"1Kor7,29": "Mówię to, bracia, ponieważ czas jest krótki. Odtąd ci, którzy mają żony, niech żyją tak, jakby ich nie mieli;"
"1Kor7,30": "Ci, którzy płaczą, jakby nie płakali; ci, którzy się radują, jakby się nie radowali; ci, którzy kupują, jakby nie posiadali;"
"1Kor7,31": "A ci, którzy używają tego świata, żeby nie nadużywali. Przemija bowiem postać tego świata."
"1Kor7,32": "Chcę, żebyście nie mieli trosk. Nieżonaty troszczy się o sprawy Pana, o to, jak się przypodobać Panu."
"1Kor7,33": "Lecz żonaty troszczy się o sprawy tego świata, o to, jak się przypodobać żonie."
"1Kor7,34": "Jest różnica między mężatką a dziewicą. Niezamężna troszczy się o sprawy Pana, o to, by była święta i ciałem, i duchem. Mężatka zaś troszczy się o sprawy tego świata, o to, jak się przypodobać mężowi."
"1Kor7,35": "Mówię to dla waszego dobra, nie aby zarzucać na was sidła, ale żebyście godnie i przyzwoicie stali przy Panu, nie dając się rozproszyć."
"1Kor7,36": "Jeśli ktoś uważa, że zachowuje się niewłaściwie wobec swojej dziewicy, gdyby przeszły już jej lata i jest taka potrzeba, niech czyni, co chce, bo nie grzeszy. Niech wyjdzie za mąż."
"1Kor7,37": "Lecz jeśli ktoś mocno postanowił w swym sercu, nie mając takiej potrzeby, ale panując nad własną wolą, i osądził w swym sercu, że zachowa swoją dziewicę, dobrze czyni."
"1Kor7,38": "Tak więc ten, kto wydaje ją za mąż, dobrze czyni, ale ten, kto nie wydaje jej za mąż, lepiej czyni."
"1Kor7,39": "Żona jest związana prawem, dopóki żyje jej mąż. Jeśli mąż umrze, wolno jej wyjść za kogo chce, byle w Panu."
"1Kor7,40": "Szczęśliwsza jednak będzie, jeśli tak pozostanie, zgodnie z moją radą. A sądzę, że i ja mam Ducha Bożego."
