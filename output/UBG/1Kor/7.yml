"1Kor7,1":
  text: "Co do spraw, o których mi pisaliście: Dobrze jest mężczyźnie nie dotykać kobiety."
  tags: []
"1Kor7,2":
  text: "Jednak aby uniknąć nierządu, niech każdy ma swoją żonę i każda niech ma swojego męża."
  tags: []
"1Kor7,3":
  text: "Niech mąż oddaje powinność żonie, podobnie i żona mężowi."
  tags: []
"1Kor7,4":
  text: "Żona nie ma władzy nad własnym ciałem, lecz mąż. Podobnie i mąż nie ma władzy nad własnym ciałem, lecz żona."
  tags: []
"1Kor7,5":
  text: "Nie okradajcie się z tego, chyba że za obopólną zgodą, na pewien czas, aby oddać się postowi i modlitwie. Potem znów się zejdźcie, żeby was szatan nie kusił z powodu waszej niepowściągliwości."
  tags: []
"1Kor7,6":
  text: "Lecz to, co mówię, jest z pozwolenia, a nie z rozkazu."
  tags: []
"1Kor7,7":
  text: "Chciałbym bowiem, aby wszyscy ludzie byli tacy jak ja, ale każdy ma swój własny dar od Boga, jeden taki, a drugi inny."
  tags: []
"1Kor7,8":
  text: "A do nieżonatych i wdów mówię: Dobrze będzie dla nich, jeśli pozostaną jak ja."
  tags: []
"1Kor7,9":
  text: "Lecz jeśli nie mogą się wstrzymać, niech wstąpią w stan małżeński. Lepiej jest bowiem wstąpić w stan małżeński, niż płonąć."
  tags: []
"1Kor7,10":
  text: "Tym zaś, którzy trwają w związku małżeńskim, nakazuję nie ja, lecz Pan: Żona niech nie odchodzi od męża."
  tags: []
"1Kor7,11":
  text: "Lecz jeśli odeszłaby, niech pozostanie bez męża albo niech się z mężem pojedna. Mąż również niech nie oddala żony."
  tags: []
"1Kor7,12":
  text: "Pozostałym zaś mówię ja, a nie Pan: Jeśli któryś z braci ma żonę niewierzącą, a ta zgadza się z nim mieszkać, niech jej nie oddala."
  tags: []
"1Kor7,13":
  text: "A jeśli jakaś żona ma męża niewierzącego, a ten zgadza się z nią mieszkać, niech od niego nie odchodzi."
  tags: []
"1Kor7,14":
  text: "Mąż niewierzący bowiem jest uświęcony przez żonę, a żona niewierząca uświęcona jest przez męża. Inaczej wasze dzieci byłyby nieczyste, teraz zaś są święte."
  tags: []
"1Kor7,15":
  text: "Lecz jeśli niewierzący chce odejść, niech odejdzie. W takich przypadkach ani brat, ani siostra nie są w niewoli. Bóg zaś powołał nas do pokoju."
  tags: []
"1Kor7,16":
  text: "Co bowiem wiesz, żono, czy zbawisz męża? Albo co wiesz, mężu, czy zbawisz żonę?"
  tags: []
"1Kor7,17":
  text: "Jednak niech każdy postępuje tak, jak mu wyznaczył Bóg, zgodnie z tym, do czego go powołał Pan. Tak też zarządzam we wszystkich kościołach."
  tags: []
"1Kor7,18":
  text: "Został ktoś powołany jako obrzezany? Niech się nie staje nieobrzezanym. Został ktoś powołany jako nieobrzezany? Niech się nie obrzezuje."
  tags: []
"1Kor7,19":
  text: "Obrzezanie nic nie znaczy i nieobrzezanie nic nie znaczy, tylko zachowywanie przykazań Boga."
  tags: []
"1Kor7,20":
  text: "Niech każdy pozostanie w stanie, w jakim został powołany."
  tags: []
"1Kor7,21":
  text: "Zostałeś powołany jako niewolnik? Nie martw się tym. Lecz jeśli możesz stać się wolny, to raczej z tego skorzystaj."
  tags: []
"1Kor7,22":
  text: "Ten bowiem, kto został powołany w Panu jako niewolnik, jest wyzwoleńcem Pana. Podobnie ten, kto został powołany jako wolny, jest niewolnikiem Chrystusa."
  tags: []
"1Kor7,23":
  text: "Drogo zostaliście kupieni. Nie bądźcie niewolnikami ludzi."
  tags: []
"1Kor7,24":
  text: "Niech każdy, bracia, trwa przed Bogiem w takim stanie, w jakim został powołany."
  tags: []
"1Kor7,25":
  text: "A co do osób dziewiczych nie mam nakazu Pańskiego, ale daję moją radę jako ten, któremu Pan dał miłosierdzie, aby był wiernym."
  tags: []
"1Kor7,26":
  text: "Uważam więc, że to jest dobre z powodu obecnych utrapień, że dobrze jest człowiekowi tak pozostać."
  tags: []
"1Kor7,27":
  text: "Jesteś związany z żoną? Nie szukaj rozłączenia. Jesteś rozwiązany od żony? Nie szukaj żony."
  tags: []
"1Kor7,28":
  text: "Ale jeśli się ożenisz, nie grzeszysz, i jeśli dziewica wyjdzie za mąż, nie grzeszy. Tacy jednak będą mieć utrapienie w ciele, a ja chciałbym wam tego oszczędzić."
  tags: []
"1Kor7,29":
  text: "Mówię to, bracia, ponieważ czas jest krótki. Odtąd ci, którzy mają żony, niech żyją tak, jakby ich nie mieli;"
  tags: []
"1Kor7,30":
  text: "Ci, którzy płaczą, jakby nie płakali; ci, którzy się radują, jakby się nie radowali; ci, którzy kupują, jakby nie posiadali;"
  tags: []
"1Kor7,31":
  text: "A ci, którzy używają tego świata, żeby nie nadużywali. Przemija bowiem postać tego świata."
  tags: []
"1Kor7,32":
  text: "Chcę, żebyście nie mieli trosk. Nieżonaty troszczy się o sprawy Pana, o to, jak się przypodobać Panu."
  tags: []
"1Kor7,33":
  text: "Lecz żonaty troszczy się o sprawy tego świata, o to, jak się przypodobać żonie."
  tags: []
"1Kor7,34":
  text: "Jest różnica między mężatką a dziewicą. Niezamężna troszczy się o sprawy Pana, o to, by była święta i ciałem, i duchem. Mężatka zaś troszczy się o sprawy tego świata, o to, jak się przypodobać mężowi."
  tags: []
"1Kor7,35":
  text: "Mówię to dla waszego dobra, nie aby zarzucać na was sidła, ale żebyście godnie i przyzwoicie stali przy Panu, nie dając się rozproszyć."
  tags: []
"1Kor7,36":
  text: "Jeśli ktoś uważa, że zachowuje się niewłaściwie wobec swojej dziewicy, gdyby przeszły już jej lata i jest taka potrzeba, niech czyni, co chce, bo nie grzeszy. Niech wyjdzie za mąż."
  tags: []
"1Kor7,37":
  text: "Lecz jeśli ktoś mocno postanowił w swym sercu, nie mając takiej potrzeby, ale panując nad własną wolą, i osądził w swym sercu, że zachowa swoją dziewicę, dobrze czyni."
  tags: []
"1Kor7,38":
  text: "Tak więc ten, kto wydaje ją za mąż, dobrze czyni, ale ten, kto nie wydaje jej za mąż, lepiej czyni."
  tags: []
"1Kor7,39":
  text: "Żona jest związana prawem, dopóki żyje jej mąż. Jeśli mąż umrze, wolno jej wyjść za kogo chce, byle w Panu."
  tags: []
"1Kor7,40":
  text: "Szczęśliwsza jednak będzie, jeśli tak pozostanie, zgodnie z moją radą. A sądzę, że i ja mam Ducha Bożego."
  tags: []
