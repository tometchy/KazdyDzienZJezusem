"1Kor9,1":
  text: "Czy nie jestem apostołem? Czy nie jestem wolny? Czy nie widziałem Jezusa Chrystusa, naszego Pana? Czy wy nie jesteście moim dziełem w Panu?"
  tags: []
"1Kor9,2":
  text: "Jeśli dla innych nie jestem apostołem, to dla was na pewno nim jestem. Pieczęcią bowiem mego apostolstwa wy jesteście w Panu."
  tags: []
"1Kor9,3":
  text: "Taka jest moja obrona przeciwko tym, którzy mnie osądzają."
  tags: []
"1Kor9,4":
  text: "Czy nie mamy prawa jeść i pić?"
  tags: []
"1Kor9,5":
  text: "Czy nie mamy prawa zabierać ze sobą siostry – żony jak inni apostołowie, bracia Pana i Kefas?"
  tags: []
"1Kor9,6":
  text: "Czy tylko ja i Barnaba nie mamy prawa nie pracować?"
  tags: []
"1Kor9,7":
  text: "Czy ktoś kiedykolwiek pełni służbę żołnierską na własny koszt? Czy ktoś uprawia winnicę, a nie spożywa jej owocu? Albo czy ktoś pasie stado, a nie spożywa mleka stada?"
  tags: []
"1Kor9,8":
  text: "Czy mówię to tylko na sposób ludzki? Czy nie mówi o tym także prawo?"
  tags: []
"1Kor9,9":
  text: "Jest bowiem napisane w Prawie Mojżesza: Nie zawiążesz pyska młócącemu wołowi. Czy o woły Bóg się troszczy?"
  tags: []
"1Kor9,10":
  text: "Czy raczej ze względu na nas to mówi? Przecież dla nas jest napisane, że w nadziei ma orać ten, kto orze, a ten, kto młóci w nadziei, swojej nadziei ma być uczestnikiem."
  tags: []
"1Kor9,11":
  text: "Jeśli my zasialiśmy wam dobra duchowe, to cóż wielkiego, jeśli będziemy żąć wasze dobra cielesne?"
  tags: []
"1Kor9,12":
  text: "Jeśli inni korzystają z tego prawa w stosunku do was, czemu raczej nie my? My jednak nie korzystaliśmy z tego prawa, ale znosimy wszystko, aby nie stwarzać żadnej przeszkody ewangelii Chrystusa."
  tags: []
"1Kor9,13":
  text: "Czy nie wiecie, że ci, którzy służą w tym, co jest święte, żyją ze świątyni, a ci, którzy służą przy ołtarzu, mają w ofiarach wspólny udział z ołtarzem?"
  tags: []
"1Kor9,14":
  text: "Tak też Pan postanowił, aby ci, którzy ewangelię głoszą, z ewangelii żyli."
  tags: []
"1Kor9,15":
  text: "Ale ja nie korzystałem z żadnego z tych praw. I nie napisałem tego po to, żeby tak się ze mną stało. Lepiej byłoby mi umrzeć, niż żeby ktoś pozbawił mnie mojej chluby."
  tags: []
"1Kor9,16":
  text: "Jeśli bowiem głoszę ewangelię, nie mam się czym chlubić, bo nałożono na mnie ten obowiązek, a biada mi, gdybym ewangelii nie głosił."
  tags: []
"1Kor9,17":
  text: "Jeśli bowiem robię to dobrowolnie, mam nagrodę, jeśli zaś niedobrowolnie, to spełniam tylko powierzone mi obowiązki szafarza."
  tags: []
"1Kor9,18":
  text: "Jaką więc mam nagrodę? Taką, że głosząc ewangelię, głoszę ewangelię Chrystusa za darmo, abym nie nadużywał mojego prawa, jakie mam z ewangelii."
  tags: []
"1Kor9,19":
  text: "Będąc bowiem wolny wobec wszystkich, samego siebie uczyniłem niewolnikiem wszystkich, abym więcej ludzi pozyskał."
  tags: []
"1Kor9,20":
  text: "I stałem się dla Żydów jak Żyd, aby Żydów pozyskać, dla tych, którzy są pod prawem, jakbym był pod prawem, aby pozyskać tych, którzy są pod prawem;"
  tags: []
"1Kor9,21":
  text: "Dla tych, którzy są bez prawa, jakbym był bez prawa – nie będąc bez prawa Bogu, lecz będąc pod prawem Chrystusowi – aby pozyskać tych, którzy są bez prawa."
  tags: []
"1Kor9,22":
  text: "Dla słabych stałem się jak słaby, aby słabych pozyskać. Stałem się wszystkim dla wszystkich, aby wszelkim sposobem niektórych zbawić."
  tags: []
"1Kor9,23":
  text: "A robię to dla ewangelii, aby stać się jej uczestnikiem."
  tags: []
"1Kor9,24":
  text: "Czy nie wiecie, że ci, którzy biegną w wyścigu, wszyscy wprawdzie biegną, lecz tylko jeden zdobywa nagrodę? Tak biegnijcie, abyście ją otrzymali."
  tags: []
"1Kor9,25":
  text: "Każdy, kto staje do zapasów, powściąga się we wszystkim. Oni, aby zdobyć koronę zniszczalną, my zaś niezniszczalną."
  tags: []
"1Kor9,26":
  text: "Ja więc tak biegnę, nie jakby na oślep, tak walczę, nie jakbym uderzał w powietrze."
  tags: []
"1Kor9,27":
  text: "Lecz poskramiam swoje ciało i biorę w niewolę, abym przypadkiem, głosząc innym, sam nie został odrzucony."
  tags: []
