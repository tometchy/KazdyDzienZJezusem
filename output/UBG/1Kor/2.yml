"1Kor2,1": "I ja, bracia, gdy do was przyszedłem, nie przybyłem z wzniosłością mowy lub mądrości, głosząc wam świadectwo Boga."
"1Kor2,2": "Postanowiłem bowiem nie znać wśród was niczego innego, jak tylko Jezusa Chrystusa, i to ukrzyżowanego."
"1Kor2,3": "I byłem u was w słabości, w bojaźni i z wielkim drżeniem."
"1Kor2,4": "A moja mowa i moje głoszenie nie opierały się na powabnych słowach ludzkiej mądrości, ale na ukazywaniu Ducha i mocy;"
"1Kor2,5": "Aby wasza wiara nie opierała się na mądrości ludzkiej, ale na mocy Boga."
"1Kor2,6": "Głosimy jednak mądrość wśród doskonałych, ale nie mądrość tego świata ani władców tego świata, którzy przemijają;"
"1Kor2,7": "Lecz głosimy mądrość Boga w tajemnicy, zakrytą mądrość, którą przed wiekami Bóg przeznaczył ku naszej chwale;"
"1Kor2,8": "Której nie poznał żaden z władców tego świata. Gdyby ją bowiem poznali, nigdy nie ukrzyżowaliby Pana chwały;"
"1Kor2,9": "Ale głosimy, jak jest napisane: Czego oko nie widziało ani ucho nie słyszało, ani nie wstąpiło do serca człowieka, to przygotował Bóg tym, którzy go miłują."
"1Kor2,10": "Nam zaś Bóg objawił to przez swojego Ducha. Duch bowiem bada wszystko, nawet głębokości Boga."
"1Kor2,11": "Bo kto z ludzi wie, co jest w człowieku oprócz ducha ludzkiego, który w nim jest? Tak samo i tego, co jest w Bogu, nikt nie zna, oprócz Ducha Bożego."
"1Kor2,12": "My zaś nie przyjęliśmy ducha świata, lecz Ducha, który jest z Boga, żebyśmy wiedzieli, które rzeczy są nam od Boga darowane."
"1Kor2,13": "A o tym też mówimy nie słowami, których naucza ludzka mądrość, lecz których naucza Duch Święty, stosując do duchowych spraw to, co duchowe."
"1Kor2,14": "Lecz cielesny człowiek nie pojmuje tych rzeczy, które są Ducha Bożego. Są bowiem dla niego głupstwem i nie może ich poznać, ponieważ rozsądza się je duchowo."
"1Kor2,15": "Człowiek duchowy zaś rozsądza wszystko, lecz sam przez nikogo nie jest sądzony."
"1Kor2,16": "Kto bowiem poznał umysł Pana? Kto go będzie pouczał? Ale my mamy umysł Chrystusa."
