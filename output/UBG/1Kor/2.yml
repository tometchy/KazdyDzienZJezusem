"1Kor2,1":
  text: "I ja, bracia, gdy do was przyszedłem, nie przybyłem z wzniosłością mowy lub mądrości, głosząc wam świadectwo Boga."
  tags: []
"1Kor2,2":
  text: "Postanowiłem bowiem nie znać wśród was niczego innego, jak tylko Jezusa Chrystusa, i to ukrzyżowanego."
  tags: []
"1Kor2,3":
  text: "I byłem u was w słabości, w bojaźni i z wielkim drżeniem."
  tags: []
"1Kor2,4":
  text: "A moja mowa i moje głoszenie nie opierały się na powabnych słowach ludzkiej mądrości, ale na ukazywaniu Ducha i mocy;"
  tags: []
"1Kor2,5":
  text: "Aby wasza wiara nie opierała się na mądrości ludzkiej, ale na mocy Boga."
  tags: []
"1Kor2,6":
  text: "Głosimy jednak mądrość wśród doskonałych, ale nie mądrość tego świata ani władców tego świata, którzy przemijają;"
  tags: []
"1Kor2,7":
  text: "Lecz głosimy mądrość Boga w tajemnicy, zakrytą mądrość, którą przed wiekami Bóg przeznaczył ku naszej chwale;"
  tags: []
"1Kor2,8":
  text: "Której nie poznał żaden z władców tego świata. Gdyby ją bowiem poznali, nigdy nie ukrzyżowaliby Pana chwały;"
  tags: []
"1Kor2,9":
  text: "Ale głosimy, jak jest napisane: Czego oko nie widziało ani ucho nie słyszało, ani nie wstąpiło do serca człowieka, to przygotował Bóg tym, którzy go miłują."
  tags: []
"1Kor2,10":
  text: "Nam zaś Bóg objawił to przez swojego Ducha. Duch bowiem bada wszystko, nawet głębokości Boga."
  tags: []
"1Kor2,11":
  text: "Bo kto z ludzi wie, co jest w człowieku oprócz ducha ludzkiego, który w nim jest? Tak samo i tego, co jest w Bogu, nikt nie zna, oprócz Ducha Bożego."
  tags: []
"1Kor2,12":
  text: "My zaś nie przyjęliśmy ducha świata, lecz Ducha, który jest z Boga, żebyśmy wiedzieli, które rzeczy są nam od Boga darowane."
  tags: []
"1Kor2,13":
  text: "A o tym też mówimy nie słowami, których naucza ludzka mądrość, lecz których naucza Duch Święty, stosując do duchowych spraw to, co duchowe."
  tags: []
"1Kor2,14":
  text: "Lecz cielesny człowiek nie pojmuje tych rzeczy, które są Ducha Bożego. Są bowiem dla niego głupstwem i nie może ich poznać, ponieważ rozsądza się je duchowo."
  tags: []
"1Kor2,15":
  text: "Człowiek duchowy zaś rozsądza wszystko, lecz sam przez nikogo nie jest sądzony."
  tags: []
"1Kor2,16":
  text: "Kto bowiem poznał umysł Pana? Kto go będzie pouczał? Ale my mamy umysł Chrystusa."
  tags: []
