"1Kor14,1": "Dążcie do miłości, starajcie się usilnie o duchowe dary, a najbardziej o to, aby prorokować."
"1Kor14,2": "Ten bowiem, kto mówi obcym językiem, nie mówi ludziom, ale Bogu, bo nikt go nie rozumie. On zaś w duchu mówi tajemnice."
"1Kor14,3": "Ale ten, kto prorokuje, mówi do ludzi dla zbudowania, zachęcenia i pocieszenia."
"1Kor14,4": "Kto mówi obcym językiem, buduje samego siebie, ale kto prorokuje, buduje kościół."
"1Kor14,5": "A chciałbym, żebyście wszyscy mówili językami, bardziej jednak, abyście prorokowali. Większy bowiem jest ten, kto prorokuje, niż ten, kto mówi obcymi językami, chyba że tłumaczy, aby kościół był zbudowany."
"1Kor14,6": "Teraz więc, bracia, gdybym przyszedł do was, mówiąc obcymi językami, jaki pożytek mielibyście ze mnie, jeślibym nie mówił do was albo przez objawienie, albo przez wiedzę, albo przez proroctwo, albo przez naukę?"
"1Kor14,7": "Przecież nawet przedmioty martwe, które wydają dźwięki, jak flet albo cytra, gdyby nie wydawały różnych dźwięków, jak można byłoby rozpoznać, co się gra na flecie, a co na cytrze?"
"1Kor14,8": "A gdyby trąba wydawała niewyraźny głos, kto by się przygotowywał do bitwy?"
"1Kor14,9": "Tak i wy, jeśli nie wypowiecie językiem zrozumiałych słów, jakże ktoś zrozumie, co się mówi? Na wiatr bowiem będziecie mówić."
"1Kor14,10": "Na świecie jest zapewne mnóstwo różnych głosów i żaden z nich nie jest bez znaczenia."
"1Kor14,11": "Jeśli więc nie będę rozumiał znaczenia głosu, będę cudzoziemcem dla tego, kto mówi, a ten, kto mówi, będzie cudzoziemcem dla mnie."
"1Kor14,12": "Tak i wy, ponieważ usilnie zabiegacie o dary duchowe, starajcie się obfitować w to, co buduje kościół."
"1Kor14,13": "Dlatego ten, kto mówi obcym językiem, niech się modli, aby mógł tłumaczyć."
"1Kor14,14": "Jeśli bowiem modlę się obcym językiem, mój duch się modli, ale mój rozum nie odnosi korzyści."
"1Kor14,15": "Cóż więc? Będę się modlił duchem, będę się też modlił i rozumem. Będę śpiewał duchem, będę też śpiewał i rozumem."
"1Kor14,16": "Jeśli bowiem będziesz błogosławił duchem, jakże ktoś spośród nieuczonych na twoje dziękczynienie odpowie „Amen”, skoro nie rozumie, co mówisz?"
"1Kor14,17": "Ty wprawdzie dobrze dziękujesz, ale drugi się nie buduje."
"1Kor14,18": "Dziękuję mojemu Bogu, że mówię językami więcej niż wy wszyscy."
"1Kor14,19": "Lecz w kościele wolę powiedzieć pięć słów zrozumiałych, aby i innych nauczyć, niż dziesięć tysięcy słów obcym językiem."
"1Kor14,20": "Bracia, nie bądźcie dziećmi w rozumieniu, ale bądźcie dziećmi w złośliwości, a w rozumieniu bądźcie dojrzali."
"1Kor14,21": "W Prawie jest napisane: Przez ludzi obcych języków i przez usta obcych będę mówić do tego ludu, ale i tak mnie nie usłuchają, mówi Pan."
"1Kor14,22": "Dlatego języki są znakiem nie dla wierzących, lecz dla niewierzących, proroctwo zaś nie dla niewierzących, lecz dla wierzących."
"1Kor14,23": "Jeśli więc cały kościół zbiera się w jednym miejscu i wszyscy mówią obcymi językami, a wejdą tam nieuczeni albo niewierzący, czy nie powiedzą, że szalejecie?"
"1Kor14,24": "Ale jeśli wszyscy prorokują, a wejdzie jakiś niewierzący albo nieuczony, będzie przekonany i osądzony przez wszystkich;"
"1Kor14,25": "I tak zostaną objawione tajemnice jego serca, a on upadnie na twarz, odda pokłon Bogu i wyzna, że prawdziwie Bóg jest w was."
"1Kor14,26": "Cóż więc, bracia? Gdy się zbieracie, każdy z was ma psalm, ma naukę, ma język, ma objawienie, ma tłumaczenie. Niech to wszystko służy zbudowaniu."
"1Kor14,27": "Jeśli ktoś mówi językami, niech to czyni dwóch albo najwięcej trzech, i to po kolei, a jeden niech tłumaczy."
"1Kor14,28": "A jeśli nie ma tłumacza, niech milczy w kościele ten, kto mówi obcym językiem, a niech mówi samemu sobie i Bogu."
"1Kor14,29": "Prorocy zaś niech mówią po dwóch albo trzech, a inni niech rozsądzają."
"1Kor14,30": "A gdyby innemu z siedzących zostało coś objawione, pierwszy niech milczy."
"1Kor14,31": "Możecie bowiem wszyscy, jeden po drugim prorokować, aby się wszyscy uczyli i wszyscy zostali pocieszeni."
"1Kor14,32": "A duchy proroków są poddane prorokom."
"1Kor14,33": "Bóg bowiem nie jest Bogiem nieładu, lecz pokoju, jak we wszystkich kościołach świętych."
"1Kor14,34": "Niech wasze kobiety milczą w kościołach. Bo nie pozwala się im mówić, ale mają być poddane, jak też prawo mówi."
"1Kor14,35": "A jeśli chcą się czegoś nauczyć, niech w domu pytają swoich mężów. Hańbą bowiem jest dla kobiety mówić w kościele."
"1Kor14,36": "Czy od was wyszło słowo Boże? Czy tylko do was przyszło?"
"1Kor14,37": "Jeśli ktoś uważa się za proroka albo człowieka duchowego, niech uzna, że to, co wam piszę, jest nakazem Pana."
"1Kor14,38": "A jeśli ktoś jest w niewiedzy, niech pozostanie w niewiedzy."
"1Kor14,39": "Tak więc, bracia, starajcie się usilnie, abyście prorokowali, i nie zabraniajcie mówić obcymi językami."
"1Kor14,40": "Wszystko niech się odbywa godnie i w należytym porządku."
