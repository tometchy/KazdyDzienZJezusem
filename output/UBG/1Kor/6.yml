"1Kor6,1":
  text: "Czy ktoś z was, mając sprawę z drugim, śmie procesować się przed niesprawiedliwymi zamiast przed świętymi?"
  tags: []
"1Kor6,2":
  text: "Czy nie wiecie, że święci będą sądzić świat? A jeśli świat będzie sądzony przez was, to czy nie jesteście godni osądzać sprawy pomniejsze?"
  tags: []
"1Kor6,3":
  text: "Czy nie wiecie, że będziemy sądzić aniołów? A cóż dopiero sprawy doczesne?"
  tags: []
"1Kor6,4":
  text: "Jeśli więc macie do osądzenia sprawy doczesne, ustanawiajcie sędziami najmniej poważanych w kościele."
  tags: []
"1Kor6,5":
  text: "Mówię to ku waszemu zawstydzeniu. Czy nie ma wśród was ani jednego mądrego, który może rozsądzić między swoimi braćmi?"
  tags: []
"1Kor6,6":
  text: "A tymczasem brat z bratem się procesuje, i to przed niewierzącymi."
  tags: []
"1Kor6,7":
  text: "W ogóle już to przynosi wam ujmę, że się ze sobą procesujecie. Czemu raczej krzywdy nie cierpicie? Czemu raczej szkody nie ponosicie?"
  tags: []
"1Kor6,8":
  text: "Przeciwnie, wy krzywdzicie i wyrządzacie szkodę, i to braciom."
  tags: []
"1Kor6,9":
  text: "Czy nie wiecie, że niesprawiedliwi nie odziedziczą królestwa Bożego? Nie łudźcie się: ani rozpustnicy, ani bałwochwalcy, ani cudzołożnicy, ani zniewieściali, ani mężczyźni współżyjący ze sobą;"
  tags: []
"1Kor6,10":
  text: "Ani złodzieje, ani chciwi, ani pijacy, ani złorzeczący, ani zdziercy nie odziedziczą królestwa Bożego."
  tags: []
"1Kor6,11":
  text: "A takimi niektórzy z was byli. Lecz zostaliście obmyci, lecz zostaliście uświęceni, lecz zostaliście usprawiedliwieni w imię Pana Jezusa i przez Ducha naszego Boga."
  tags: []
"1Kor6,12":
  text: "Wszystko mi wolno, ale nie wszystko jest pożyteczne. Wszystko mi wolno, ale ja nie dam się niczemu zniewolić."
  tags: []
"1Kor6,13":
  text: "Pokarmy są dla brzucha, a brzuch dla pokarmów. Lecz Bóg zniszczy i jedno, i drugie. Ciało zaś nie jest dla nierządu, ale dla Pana, a Pan dla ciała."
  tags: []
"1Kor6,14":
  text: "A Bóg i Pana wskrzesił, i nas wskrzesi swoją mocą."
  tags: []
"1Kor6,15":
  text: "Czyż nie wiecie, że wasze ciała są członkami Chrystusa? Czy więc wezmę członki Chrystusa i uczynię je członkami nierządnicy? Nie daj Boże!"
  tags: []
"1Kor6,16":
  text: "Czyż nie wiecie, że ten, kto się łączy z nierządnicą, jest z nią jednym ciałem? Dwoje bowiem, mówi on, będą jednym ciałem."
  tags: []
"1Kor6,17":
  text: "Kto zaś się łączy z Panem, jest z nim jednym duchem."
  tags: []
"1Kor6,18":
  text: "Uciekajcie od nierządu. Wszelki grzech, który człowiek popełnia, jest poza ciałem. Lecz kto dopuszcza się nierządu, grzeszy przeciwko własnemu ciału."
  tags: []
"1Kor6,19":
  text: "Czyż nie wiecie, że wasze ciało jest świątynią Ducha Świętego, który jest w was, a którego macie od Boga, i nie należycie do samych siebie?"
  tags: []
"1Kor6,20":
  text: "Drogo bowiem zostaliście kupieni. Wysławiajcie więc Boga w waszym ciele i w waszym duchu, które należą do Boga."
  tags: []
