"1Kor6,1": "Czy ktoś z was, mając sprawę z drugim, śmie procesować się przed niesprawiedliwymi zamiast przed świętymi?"
"1Kor6,2": "Czy nie wiecie, że święci będą sądzić świat? A jeśli świat będzie sądzony przez was, to czy nie jesteście godni osądzać sprawy pomniejsze?"
"1Kor6,3": "Czy nie wiecie, że będziemy sądzić aniołów? A cóż dopiero sprawy doczesne?"
"1Kor6,4": "Jeśli więc macie do osądzenia sprawy doczesne, ustanawiajcie sędziami najmniej poważanych w kościele."
"1Kor6,5": "Mówię to ku waszemu zawstydzeniu. Czy nie ma wśród was ani jednego mądrego, który może rozsądzić między swoimi braćmi?"
"1Kor6,6": "A tymczasem brat z bratem się procesuje, i to przed niewierzącymi."
"1Kor6,7": "W ogóle już to przynosi wam ujmę, że się ze sobą procesujecie. Czemu raczej krzywdy nie cierpicie? Czemu raczej szkody nie ponosicie?"
"1Kor6,8": "Przeciwnie, wy krzywdzicie i wyrządzacie szkodę, i to braciom."
"1Kor6,9": "Czy nie wiecie, że niesprawiedliwi nie odziedziczą królestwa Bożego? Nie łudźcie się: ani rozpustnicy, ani bałwochwalcy, ani cudzołożnicy, ani zniewieściali, ani mężczyźni współżyjący ze sobą;"
"1Kor6,10": "Ani złodzieje, ani chciwi, ani pijacy, ani złorzeczący, ani zdziercy nie odziedziczą królestwa Bożego."
"1Kor6,11": "A takimi niektórzy z was byli. Lecz zostaliście obmyci, lecz zostaliście uświęceni, lecz zostaliście usprawiedliwieni w imię Pana Jezusa i przez Ducha naszego Boga."
"1Kor6,12": "Wszystko mi wolno, ale nie wszystko jest pożyteczne. Wszystko mi wolno, ale ja nie dam się niczemu zniewolić."
"1Kor6,13": "Pokarmy są dla brzucha, a brzuch dla pokarmów. Lecz Bóg zniszczy i jedno, i drugie. Ciało zaś nie jest dla nierządu, ale dla Pana, a Pan dla ciała."
"1Kor6,14": "A Bóg i Pana wskrzesił, i nas wskrzesi swoją mocą."
"1Kor6,15": "Czyż nie wiecie, że wasze ciała są członkami Chrystusa? Czy więc wezmę członki Chrystusa i uczynię je członkami nierządnicy? Nie daj Boże!"
"1Kor6,16": "Czyż nie wiecie, że ten, kto się łączy z nierządnicą, jest z nią jednym ciałem? Dwoje bowiem, mówi on, będą jednym ciałem."
"1Kor6,17": "Kto zaś się łączy z Panem, jest z nim jednym duchem."
"1Kor6,18": "Uciekajcie od nierządu. Wszelki grzech, który człowiek popełnia, jest poza ciałem. Lecz kto dopuszcza się nierządu, grzeszy przeciwko własnemu ciału."
"1Kor6,19": "Czyż nie wiecie, że wasze ciało jest świątynią Ducha Świętego, który jest w was, a którego macie od Boga, i nie należycie do samych siebie?"
"1Kor6,20": "Drogo bowiem zostaliście kupieni. Wysławiajcie więc Boga w waszym ciele i w waszym duchu, które należą do Boga."
