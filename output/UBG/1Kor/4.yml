"1Kor4,1": "Niech więc każdy uważa nas za sługi Chrystusa i szafarzy tajemnic Boga."
"1Kor4,2": "A od szafarzy wymaga się, aby każdy z nich okazał się wierny."
"1Kor4,3": "Mnie jednak najmniej zależy na tym, czy będę przez was sądzony, czy przez sąd ludzki. Nawet sam siebie nie sądzę."
"1Kor4,4": "Niczego bowiem w sobie nie dostrzegam, jednak nie jestem przez to usprawiedliwiony, lecz tym, który mnie sądzi, jest Pan."
"1Kor4,5": "Dlatego nie sądźcie przed czasem, dopóki nie przyjdzie Pan, który oświetli to, co ukryte w ciemności, i ujawni zamiary serc. Wtedy każdy otrzyma pochwałę od Boga."
"1Kor4,6": "To wszystko zaś, bracia, odniosłem do samego siebie i do Apollosa ze względu na was, abyście się nauczyli na naszym przykładzie nie wykraczać ponad to, co jest napisane, żeby jeden nie pysznił się drugim przeciw innemu."
"1Kor4,7": "Kto bowiem czyni cię różnym? Cóż masz, czego byś nie otrzymał? A jeśli otrzymałeś, to dlaczego się chlubisz, jakbyś nie otrzymał?"
"1Kor4,8": "Już jesteście nasyceni, już jesteście bogaci, bez nas królujecie. I obyście królowali, abyśmy i my z wami królowali."
"1Kor4,9": "Bo uważam, że Bóg nas, apostołów, wyznaczył jako ostatnich, jakby na śmierć skazanych. Staliśmy się bowiem widowiskiem dla świata, aniołów i ludzi."
"1Kor4,10": "My jesteśmy głupi dla Chrystusa, ale wy mądrzy w Chrystusie, my jesteśmy słabi, ale wy mocni, wy szanowani, a my wzgardzeni."
"1Kor4,11": "Aż do tej chwili cierpimy głód i pragnienie, jesteśmy nadzy, policzkowani i tułamy się;"
"1Kor4,12": "I trudzimy się, pracując własnymi rękami. Gdy nas znieważają – błogosławimy, gdy nas prześladują – znosimy;"
"1Kor4,13": "Gdy nam złorzeczą – modlimy się za nich. Staliśmy się jak śmiecie tego świata, jak odpadki u wszystkich, aż do tej chwili."
"1Kor4,14": "Nie piszę tego po to, aby was zawstydzić, ale napominam was jako moje umiłowane dzieci."
"1Kor4,15": "Choćbyście bowiem mieli dziesięć tysięcy wychowawców w Chrystusie, to jednak nie macie wielu ojców. Ja bowiem przez ewangelię zrodziłem was w Chrystusie Jezusie."
"1Kor4,16": "Proszę was więc, bądźcie moimi naśladowcami."
"1Kor4,17": "Dlatego to posłałem do was Tymoteusza, który jest moim umiłowanym synem i wiernym w Panu. On wam przypomni moje drogi w Chrystusie, jak nauczam wszędzie, w każdym kościele."
"1Kor4,18": "A niektórzy wbili się w pychę, jakbym nie miał przyjść do was."
"1Kor4,19": "Lecz przyjdę do was wkrótce, jeśli Pan zechce, i poznam nie słowa pysznych, ale ich moc."
"1Kor4,20": "Królestwo Boże bowiem przejawia się nie w słowie, ale w mocy."
"1Kor4,21": "Co chcecie? Czy mam przyjść do was z rózgą, czy z miłością i w duchu łagodności?"
