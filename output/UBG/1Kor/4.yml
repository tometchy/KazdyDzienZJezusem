"1Kor4,1":
  text: "Niech więc każdy uważa nas za sługi Chrystusa i szafarzy tajemnic Boga."
  tags: []
"1Kor4,2":
  text: "A od szafarzy wymaga się, aby każdy z nich okazał się wierny."
  tags: []
"1Kor4,3":
  text: "Mnie jednak najmniej zależy na tym, czy będę przez was sądzony, czy przez sąd ludzki. Nawet sam siebie nie sądzę."
  tags: []
"1Kor4,4":
  text: "Niczego bowiem w sobie nie dostrzegam, jednak nie jestem przez to usprawiedliwiony, lecz tym, który mnie sądzi, jest Pan."
  tags: []
"1Kor4,5":
  text: "Dlatego nie sądźcie przed czasem, dopóki nie przyjdzie Pan, który oświetli to, co ukryte w ciemności, i ujawni zamiary serc. Wtedy każdy otrzyma pochwałę od Boga."
  tags: []
"1Kor4,6":
  text: "To wszystko zaś, bracia, odniosłem do samego siebie i do Apollosa ze względu na was, abyście się nauczyli na naszym przykładzie nie wykraczać ponad to, co jest napisane, żeby jeden nie pysznił się drugim przeciw innemu."
  tags: []
"1Kor4,7":
  text: "Kto bowiem czyni cię różnym? Cóż masz, czego byś nie otrzymał? A jeśli otrzymałeś, to dlaczego się chlubisz, jakbyś nie otrzymał?"
  tags: []
"1Kor4,8":
  text: "Już jesteście nasyceni, już jesteście bogaci, bez nas królujecie. I obyście królowali, abyśmy i my z wami królowali."
  tags: []
"1Kor4,9":
  text: "Bo uważam, że Bóg nas, apostołów, wyznaczył jako ostatnich, jakby na śmierć skazanych. Staliśmy się bowiem widowiskiem dla świata, aniołów i ludzi."
  tags: []
"1Kor4,10":
  text: "My jesteśmy głupi dla Chrystusa, ale wy mądrzy w Chrystusie, my jesteśmy słabi, ale wy mocni, wy szanowani, a my wzgardzeni."
  tags: []
"1Kor4,11":
  text: "Aż do tej chwili cierpimy głód i pragnienie, jesteśmy nadzy, policzkowani i tułamy się;"
  tags: []
"1Kor4,12":
  text: "I trudzimy się, pracując własnymi rękami. Gdy nas znieważają – błogosławimy, gdy nas prześladują – znosimy;"
  tags: []
"1Kor4,13":
  text: "Gdy nam złorzeczą – modlimy się za nich. Staliśmy się jak śmiecie tego świata, jak odpadki u wszystkich, aż do tej chwili."
  tags: []
"1Kor4,14":
  text: "Nie piszę tego po to, aby was zawstydzić, ale napominam was jako moje umiłowane dzieci."
  tags: []
"1Kor4,15":
  text: "Choćbyście bowiem mieli dziesięć tysięcy wychowawców w Chrystusie, to jednak nie macie wielu ojców. Ja bowiem przez ewangelię zrodziłem was w Chrystusie Jezusie."
  tags: []
"1Kor4,16":
  text: "Proszę was więc, bądźcie moimi naśladowcami."
  tags: []
"1Kor4,17":
  text: "Dlatego to posłałem do was Tymoteusza, który jest moim umiłowanym synem i wiernym w Panu. On wam przypomni moje drogi w Chrystusie, jak nauczam wszędzie, w każdym kościele."
  tags: []
"1Kor4,18":
  text: "A niektórzy wbili się w pychę, jakbym nie miał przyjść do was."
  tags: []
"1Kor4,19":
  text: "Lecz przyjdę do was wkrótce, jeśli Pan zechce, i poznam nie słowa pysznych, ale ich moc."
  tags: []
"1Kor4,20":
  text: "Królestwo Boże bowiem przejawia się nie w słowie, ale w mocy."
  tags: []
"1Kor4,21":
  text: "Co chcecie? Czy mam przyjść do was z rózgą, czy z miłością i w duchu łagodności?"
  tags: []
