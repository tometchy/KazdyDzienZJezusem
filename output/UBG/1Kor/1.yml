"1Kor1,1":
  text: "Paweł, powołany apostoł Jezusa Chrystusa z woli Boga, i Sostenes, brat;"
  tags: []
"1Kor1,2":
  text: "Do kościoła Bożego w Koryncie, do uświęconych w Chrystusie Jezusie, powołanych świętych, ze wszystkimi, którzy w każdym miejscu wzywają imienia naszego Pana Jezusa Chrystusa, ich i naszego Pana."
  tags: []
"1Kor1,3":
  text: "Łaska wam i pokój od Boga, naszego Ojca, i Pana Jezusa Chrystusa."
  tags: []
"1Kor1,4":
  text: "Zawsze dziękuję mojemu Bogu za was, za łaskę Bożą, która została wam dana w Chrystusie Jezusie."
  tags: []
"1Kor1,5":
  text: "We wszystko bowiem jesteście wzbogaceni w nim, we wszelkie słowo i wszelkie poznanie;"
  tags: []
"1Kor1,6":
  text: "Gdyż świadectwo Chrystusa jest utwierdzone w was;"
  tags: []
"1Kor1,7":
  text: "Tak że żadnego daru nie brakuje wam, którzy oczekujecie objawienia naszego Pana Jezusa Chrystusa."
  tags: []
"1Kor1,8":
  text: "On też utwierdzi was aż do końca, abyście byli nienaganni w dniu naszego Pana Jezusa Chrystusa."
  tags: []
"1Kor1,9":
  text: "Wierny jest Bóg, przez którego zostaliście powołani do społeczności jego Syna, Jezusa Chrystusa, naszego Pana."
  tags: []
"1Kor1,10":
  text: "Proszę więc was, bracia, przez imię naszego Pana Jezusa Chrystusa, żebyście wszyscy to samo mówili i żeby nie było wśród was rozłamów, ale abyście byli zespoleni jednakowym umysłem i jednakowym zdaniem."
  tags: []
"1Kor1,11":
  text: "Doniesiono mi bowiem o was, moi bracia, przez domowników Chloe, że są wśród was spory."
  tags: []
"1Kor1,12":
  text: "Mówię to dlatego, że każdy z was twierdzi: Ja jestem Pawła, ja Apollosa, ja Kefasa, a ja Chrystusa."
  tags: []
"1Kor1,13":
  text: "Czy Chrystus jest podzielony? Czy Paweł został za was ukrzyżowany? Czy w imię Pawła zostaliście ochrzczeni?"
  tags: []
"1Kor1,14":
  text: "Dziękuję Bogu, że oprócz Kryspusa i Gajusa nikogo z was nie ochrzciłem;"
  tags: []
"1Kor1,15":
  text: "Aby nikt nie powiedział, że chrzciłem w swoje imię."
  tags: []
"1Kor1,16":
  text: "Ochrzciłem też dom Stefanasa. Poza tym nie wiem, czy ochrzciłem jeszcze kogoś."
  tags: []
"1Kor1,17":
  text: "Bo Chrystus nie posłał mnie, abym chrzcił, ale abym głosił ewangelię, i to nie w mądrości słowa, aby nie zniweczyć krzyża Chrystusa."
  tags: []
"1Kor1,18":
  text: "Mowa o krzyżu bowiem jest głupstwem dla tych, którzy giną, ale dla nas, którzy jesteśmy zbawieni, jest mocą Boga."
  tags: []
"1Kor1,19":
  text: "Bo jest napisane: Wytracę mądrość mądrych, a rozum rozumnych obrócę wniwecz."
  tags: []
"1Kor1,20":
  text: "Gdzie jest mądry? Gdzie uczony w Piśmie? Gdzie badacz tego świata? Czyż Bóg nie obrócił w głupstwo mądrości tego świata?"
  tags: []
"1Kor1,21":
  text: "Skoro bowiem w mądrości Bożej świat nie poznał Boga przez mądrość, upodobało się Bogu przez głupstwo głoszenia zbawić tych, którzy wierzą."
  tags: []
"1Kor1,22":
  text: "Gdyż Żydzi domagają się znaków, a Grecy szukają mądrości."
  tags: []
"1Kor1,23":
  text: "My zaś głosimy Chrystusa ukrzyżowanego, który dla Żydów wprawdzie jest zgorszeniem, a dla Greków głupstwem;"
  tags: []
"1Kor1,24":
  text: "Lecz dla tych, którzy są powołani, zarówno dla Żydów, jak i Greków, głosimy Chrystusa – moc Bożą i mądrość Bożą."
  tags: []
"1Kor1,25":
  text: "Głupstwo Boże bowiem jest mądrzejsze niż ludzie, a słabość Boża jest mocniejsza niż ludzie."
  tags: []
"1Kor1,26":
  text: "Przypatrzcie się bowiem, bracia, waszemu powołaniu, że niewielu jest mądrych według ciała, niewielu możnych, niewielu szlachetnie urodzonych."
  tags: []
"1Kor1,27":
  text: "Ale Bóg wybrał to, co głupie u świata, aby zawstydzić mądrych, wybrał to, co słabe u świata, aby zawstydzić mocnych."
  tags: []
"1Kor1,28":
  text: "I to, co nieszlachetne u świata i wzgardzone, wybrał Bóg, a nawet to, co nie jest, aby to, co jest, obrócić wniwecz;"
  tags: []
"1Kor1,29":
  text: "Aby nie chlubiło się przed nim żadne ciało."
  tags: []
"1Kor1,30":
  text: "Lecz wy z niego jesteście w Chrystusie Jezusie, który stał się dla nas mądrością od Boga i sprawiedliwością, i uświęceniem, i odkupieniem;"
  tags: []
"1Kor1,31":
  text: "Aby, jak to jest napisane: Ten, kto się chlubi, niech się chlubi w Panu."
  tags: []
