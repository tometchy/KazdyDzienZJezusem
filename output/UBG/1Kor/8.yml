"1Kor8,1":
  text: "Co do ofiar składanych bożkom, to oczywiście wszyscy posiadamy wiedzę. Wiedza wbija w pychę, lecz miłość buduje."
  tags: []
"1Kor8,2":
  text: "A jeśli ktoś uważa, że coś wie, to jeszcze nie wie tak, jak wiedzieć należy."
  tags: []
"1Kor8,3":
  text: "Lecz jeśli ktoś miłuje Boga, ten jest poznany przez niego."
  tags: []
"1Kor8,4":
  text: "A więc co do spożywania pokarmów ofiarowanych bożkom, wiemy, że bożek na świecie jest niczym i że nie ma żadnego innego Boga oprócz jednego."
  tags: []
"1Kor8,5":
  text: "Bo chociaż są tacy, którzy są nazywani bogami, czy to na niebie, czy na ziemi – bo wielu jest bogów i wielu panów;"
  tags: []
"1Kor8,6":
  text: "To dla nas jest jeden Bóg, Ojciec, z którego wszystko, a my w nim, i jeden Pan, Jezus Chrystus, przez którego wszystko, a my przez niego."
  tags: []
"1Kor8,7":
  text: "Lecz nie wszyscy mają tę wiedzę. Niektórzy bowiem aż do tej pory, mając sumienie co do bożka, spożywają pokarm jako ofiarowany bożkom, a ich sumienie, będąc słabe, kala się."
  tags: []
"1Kor8,8":
  text: "Pokarm zaś nie zbliża nas do Boga. Jeśli bowiem jemy, nic nie zyskujemy, a jeśli nie jemy, nic nie tracimy."
  tags: []
"1Kor8,9":
  text: "Jednak uważajcie, aby przypadkiem wasza wolność nie stała się dla słabych powodem do zgorszenia."
  tags: []
"1Kor8,10":
  text: "Gdyby bowiem ktoś zobaczył ciebie, który masz wiedzę, siedzącego za stołem w świątyni bożka, to czy sumienie tego, kto jest słaby, nie skłoni go do jedzenia pokarmów ofiarowanych bożkom?"
  tags: []
"1Kor8,11":
  text: "I w ten sposób twoja wiedza zgubi słabego brata, za którego umarł Chrystus."
  tags: []
"1Kor8,12":
  text: "Grzesząc tak przeciwko braciom i raniąc ich słabe sumienie, grzeszycie przeciwko Chrystusowi."
  tags: []
"1Kor8,13":
  text: "Dlatego, jeśli pokarm gorszy mego brata, przenigdy nie będę jadł mięsa, aby nie gorszyć mego brata."
  tags: []
