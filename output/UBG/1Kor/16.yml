"1Kor16,1":
  text: "A co do składki na świętych, to i wy zróbcie tak, jak zarządziłem w kościołach Galacji."
  tags: []
"1Kor16,2":
  text: "Każdego pierwszego dnia tygodnia niech każdy z was odkłada u siebie, stosownie do tego, jak mu się powodzi, aby nie urządzać składek dopiero wtedy, kiedy ja tam przybędę."
  tags: []
"1Kor16,3":
  text: "A gdy przyjdę, poślę tych, których w listach uznacie za godnych, aby zanieśli wasz hojny dar do Jerozolimy."
  tags: []
"1Kor16,4":
  text: "A jeśli będzie właściwe, abym i ja się udał, pójdą razem ze mną."
  tags: []
"1Kor16,5":
  text: "Przybędę zaś do was, kiedy przejdę Macedonię. Będę bowiem szedł przez Macedonię."
  tags: []
"1Kor16,6":
  text: "A być może zatrzymam się u was lub nawet przezimuję, żebyście mnie wyprawili, dokądkolwiek wyruszę."
  tags: []
"1Kor16,7":
  text: "Nie chcę bowiem was teraz widzieć przejazdem, ale mam nadzieję pozostać z wami przez jakiś czas, jeśli Pan pozwoli."
  tags: []
"1Kor16,8":
  text: "A w Efezie zostanę aż do Pięćdziesiątnicy."
  tags: []
"1Kor16,9":
  text: "Otworzyły się bowiem przede mną drzwi wielkie i owocne, a mam wielu przeciwników."
  tags: []
"1Kor16,10":
  text: "Jeśli zaś przybędzie Tymoteusz, uważajcie, aby przebywał wśród was bez bojaźni, bo wykonuje dzieło Pana, jak i ja."
  tags: []
"1Kor16,11":
  text: "Dlatego niech nikt go nie lekceważy. Lecz wyprawcie go w pokoju, aby dotarł do mnie, bo czekam na niego z braćmi."
  tags: []
"1Kor16,12":
  text: "A co do brata Apollosa, to bardzo go prosiłem, aby poszedł do was z braćmi. Lecz w ogóle nie chciał teraz iść. Pójdzie jednak w odpowiednim dla niego czasie."
  tags: []
"1Kor16,13":
  text: "Czuwajcie, trwajcie w wierze, bądźcie mężni, umacniajcie się."
  tags: []
"1Kor16,14":
  text: "Wszystko, co czynicie, niech się dzieje w miłości."
  tags: []
"1Kor16,15":
  text: "A proszę was, bracia (bo znacie dom Stefanasa, że jest pierwszym plonem Achai i że się poświęcili na służbę świętym);"
  tags: []
"1Kor16,16":
  text: "Żebyście byli takim poddani i każdemu, kto pomaga i pracuje z nami."
  tags: []
"1Kor16,17":
  text: "A cieszę się z przyjścia Stefanasa, Fortunata i Achaika, bo wypełnili wasz brak."
  tags: []
"1Kor16,18":
  text: "Pokrzepili bowiem mego i waszego ducha. Szanujcie więc takich."
  tags: []
"1Kor16,19":
  text: "Pozdrawiają was kościoły Azji. Pozdrawiają was serdecznie w Panu Akwila i Pryscylla wraz z kościołem, który jest w ich domu."
  tags: []
"1Kor16,20":
  text: "Pozdrawiają was wszyscy bracia. Pozdrówcie jedni drugich pocałunkiem świętym."
  tags: []
"1Kor16,21":
  text: "Pozdrowienie moją, Pawła, ręką."
  tags: []
"1Kor16,22":
  text: "Jeśli ktoś nie miłuje Pana Jezusa Chrystusa, niech będzie przeklęty. Maranatha."
  tags: []
"1Kor16,23":
  text: "Łaska Pana Jezusa Chrystusa niech będzie z wami."
  tags: []
"1Kor16,24":
  text: "Miłość moja niech będzie z wami wszystkimi w Chrystusie Jezusie. Amen."
  tags: []
