"1Kor16,1": "A co do składki na świętych, to i wy zróbcie tak, jak zarządziłem w kościołach Galacji."
"1Kor16,2": "Każdego pierwszego dnia tygodnia niech każdy z was odkłada u siebie, stosownie do tego, jak mu się powodzi, aby nie urządzać składek dopiero wtedy, kiedy ja tam przybędę."
"1Kor16,3": "A gdy przyjdę, poślę tych, których w listach uznacie za godnych, aby zanieśli wasz hojny dar do Jerozolimy."
"1Kor16,4": "A jeśli będzie właściwe, abym i ja się udał, pójdą razem ze mną."
"1Kor16,5": "Przybędę zaś do was, kiedy przejdę Macedonię. Będę bowiem szedł przez Macedonię."
"1Kor16,6": "A być może zatrzymam się u was lub nawet przezimuję, żebyście mnie wyprawili, dokądkolwiek wyruszę."
"1Kor16,7": "Nie chcę bowiem was teraz widzieć przejazdem, ale mam nadzieję pozostać z wami przez jakiś czas, jeśli Pan pozwoli."
"1Kor16,8": "A w Efezie zostanę aż do Pięćdziesiątnicy."
"1Kor16,9": "Otworzyły się bowiem przede mną drzwi wielkie i owocne, a mam wielu przeciwników."
"1Kor16,10": "Jeśli zaś przybędzie Tymoteusz, uważajcie, aby przebywał wśród was bez bojaźni, bo wykonuje dzieło Pana, jak i ja."
"1Kor16,11": "Dlatego niech nikt go nie lekceważy. Lecz wyprawcie go w pokoju, aby dotarł do mnie, bo czekam na niego z braćmi."
"1Kor16,12": "A co do brata Apollosa, to bardzo go prosiłem, aby poszedł do was z braćmi. Lecz w ogóle nie chciał teraz iść. Pójdzie jednak w odpowiednim dla niego czasie."
"1Kor16,13": "Czuwajcie, trwajcie w wierze, bądźcie mężni, umacniajcie się."
"1Kor16,14": "Wszystko, co czynicie, niech się dzieje w miłości."
"1Kor16,15": "A proszę was, bracia (bo znacie dom Stefanasa, że jest pierwszym plonem Achai i że się poświęcili na służbę świętym);"
"1Kor16,16": "Żebyście byli takim poddani i każdemu, kto pomaga i pracuje z nami."
"1Kor16,17": "A cieszę się z przyjścia Stefanasa, Fortunata i Achaika, bo wypełnili wasz brak."
"1Kor16,18": "Pokrzepili bowiem mego i waszego ducha. Szanujcie więc takich."
"1Kor16,19": "Pozdrawiają was kościoły Azji. Pozdrawiają was serdecznie w Panu Akwila i Pryscylla wraz z kościołem, który jest w ich domu."
"1Kor16,20": "Pozdrawiają was wszyscy bracia. Pozdrówcie jedni drugich pocałunkiem świętym."
"1Kor16,21": "Pozdrowienie moją, Pawła, ręką."
"1Kor16,22": "Jeśli ktoś nie miłuje Pana Jezusa Chrystusa, niech będzie przeklęty. Maranatha."
"1Kor16,23": "Łaska Pana Jezusa Chrystusa niech będzie z wami."
"1Kor16,24": "Miłość moja niech będzie z wami wszystkimi w Chrystusie Jezusie. Amen."
