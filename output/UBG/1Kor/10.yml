"1Kor10,1":
  text: "Nie chcę, bracia, żebyście nie wiedzieli, że wszyscy nasi ojcowie byli pod obłokiem i wszyscy przeszli przez morze;"
  tags: []
"1Kor10,2":
  text: "I wszyscy w Mojżesza zostali ochrzczeni w obłoku i w morzu;"
  tags: []
"1Kor10,3":
  text: "Wszyscy też jedli ten sam pokarm duchowy;"
  tags: []
"1Kor10,4":
  text: "I wszyscy pili ten sam duchowy napój. Pili bowiem ze skały duchowej, która szła za nimi. A tą skałą był Chrystus."
  tags: []
"1Kor10,5":
  text: "Lecz większości z nich nie upodobał sobie Bóg. Polegli bowiem na pustyni."
  tags: []
"1Kor10,6":
  text: "A to stało się dla nas przykładem, żebyśmy nie pożądali złych rzeczy, jak oni pożądali."
  tags: []
"1Kor10,7":
  text: "Nie bądźcie więc bałwochwalcami, jak niektórzy z nich, jak jest napisane: Usiadł lud, aby jeść i pić, i wstali, aby się bawić."
  tags: []
"1Kor10,8":
  text: "Nie dopuszczajmy się też nierządu, jak niektórzy z nich się dopuszczali i padło ich jednego dnia dwadzieścia trzy tysiące;"
  tags: []
"1Kor10,9":
  text: "I nie wystawiajmy na próbę Chrystusa, jak niektórzy z nich wystawiali i poginęli od wężów;"
  tags: []
"1Kor10,10":
  text: "Ani nie szemrajcie, jak niektórzy z nich szemrali i zostali wytraceni przez niszczyciela."
  tags: []
"1Kor10,11":
  text: "A to wszystko przydarzyło się im dla przykładu i zostało napisane dla napomnienia nas, których dosięgnął kres czasów."
  tags: []
"1Kor10,12":
  text: "Tak więc kto myśli, że stoi, niech uważa, aby nie upadł."
  tags: []
"1Kor10,13":
  text: "Nie nawiedziła was pokusa inna niż ludzka. Lecz Bóg jest wierny i nie pozwoli, żebyście byli kuszeni ponad wasze siły, ale wraz z pokusą da wyjście, żebyście mogli ją znieść."
  tags: []
"1Kor10,14":
  text: "Dlatego, moi najmilsi, uciekajcie od bałwochwalstwa."
  tags: []
"1Kor10,15":
  text: "Mówię jak do mądrych. Osądźcie sami to, co mówię."
  tags: []
"1Kor10,16":
  text: "Kielich błogosławieństwa, który błogosławimy, czy nie jest wspólnotą krwi Chrystusa? Chleb, który łamiemy, czy nie jest wspólnotą ciała Chrystusa?"
  tags: []
"1Kor10,17":
  text: "My bowiem, choć liczni, jesteśmy jednym chlebem i jednym ciałem, bo wszyscy jesteśmy uczestnikami jednego chleba."
  tags: []
"1Kor10,18":
  text: "Przypatrzcie się Izraelowi według ciała. Czyż ci, którzy jedzą ofiary, nie są uczestnikami ołtarza?"
  tags: []
"1Kor10,19":
  text: "Cóż więc chcę powiedzieć? Że bożek jest czymś albo ofiara składana bożkom czymś jest?"
  tags: []
"1Kor10,20":
  text: "Raczej chcę powiedzieć, że to, co poganie ofiarują, demonom ofiarują, a nie Bogu. A nie chciałbym, żebyście mieli społeczność z demonami."
  tags: []
"1Kor10,21":
  text: "Nie możecie pić kielicha Pana i kielicha demonów. Nie możecie być uczestnikami stołu Pana i stołu demonów."
  tags: []
"1Kor10,22":
  text: "Czy będziemy pobudzali Pana do zazdrości? Czy jesteśmy mocniejsi od niego?"
  tags: []
"1Kor10,23":
  text: "Wszystko mi wolno, ale nie wszystko jest pożyteczne. Wszystko mi wolno, ale nie wszystko buduje."
  tags: []
"1Kor10,24":
  text: "Niech nikt nie szuka własnego dobra, lecz dobra bliźniego."
  tags: []
"1Kor10,25":
  text: "Wszystko, co sprzedają w jatkach, jedzcie, o nic nie pytając ze względu na sumienie."
  tags: []
"1Kor10,26":
  text: "Pańska bowiem jest ziemia i wszystko, co ją napełnia."
  tags: []
"1Kor10,27":
  text: "Jeśli zaprosi was ktoś z niewierzących, a chcecie iść, jedzcie wszystko, co przed wami postawią, o nic nie pytając ze względu na sumienie."
  tags: []
"1Kor10,28":
  text: "Lecz jeśli ktoś wam powie: To jest ofiarowane bożkom, nie jedzcie ze względu na tego, który to powiedział, i ze względu na sumienie. Pańska bowiem jest ziemia i wszystko, co ją napełnia."
  tags: []
"1Kor10,29":
  text: "Ale sumienie, mówię, nie twoje, lecz tego drugiego. Dlaczego bowiem moja wolność ma być sądzona przez cudze sumienie?"
  tags: []
"1Kor10,30":
  text: "Bo jeśli ja z dziękczynieniem coś spożywam, to czemu mam być spotwarzany za to, za co dziękuję?"
  tags: []
"1Kor10,31":
  text: "Tak więc czy jecie, czy pijecie, czy cokolwiek innego robicie, wszystko róbcie ku chwale Boga."
  tags: []
"1Kor10,32":
  text: "Nie bądźcie zgorszeniem ani dla Żydów, ani dla Greków, ani dla kościoła Bożego;"
  tags: []
"1Kor10,33":
  text: "Tak jak i ja się wszystkim we wszystkim podobam, nie szukając w tym własnej korzyści, ale korzyści wielu, aby byli zbawieni."
  tags: []
