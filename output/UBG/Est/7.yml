"Est7,1":
  text: "Król i Haman przybyli więc na ucztę do królowej Estery."
  tags: []
"Est7,2":
  text: "I drugiego dnia, gdy się napił wina, król znowu zapytał Esterę: Jaka jest twoja prośba, królowo Estero, a będzie ci dane. Jakie jest twoje życzenie? Choćbyś prosiła nawet o połowę królestwa, tak się stanie."
  tags: []
"Est7,3":
  text: "Wtedy królowa Estera odpowiedziała: Jeśli znalazłam łaskę w twoich oczach, o królu, i jeśli królowi się spodoba, niech będzie mi darowane moje życie na moją prośbę i mój naród na moje życzenie."
  tags: []
"Est7,4":
  text: "Zostaliśmy bowiem sprzedani, ja i mój lud, aby nas zgładzić, wymordować i wytracić. Gdybyśmy zostali sprzedani jako niewolnicy i niewolnice, milczałabym, chociaż wróg nigdy by nie mógł wynagrodzić tej szkody wyrządzonej królowi."
  tags: []
"Est7,5":
  text: "Wtedy król Aswerus odpowiedział do królowej Estery: Któż to jest i gdzie jest ten, którego serce jest tak nadęte, aby ośmielił się tak uczynić?"
  tags: []
"Est7,6":
  text: "Estera odpowiedziała: Tym przeciwnikiem i wrogiem jest niegodziwy Haman. I Haman zatrwożył się przed królem i królową."
  tags: []
"Est7,7":
  text: "Wówczas król wstał w gniewie, opuścił ucztę i poszedł do ogrodu pałacowego. Haman zaś stał, aby błagać królową Esterę o życie, gdyż widział, że król postanowił jego zgubę."
  tags: []
"Est7,8":
  text: "Potem król wrócił z ogrodu pałacowego do domu, gdzie się odbywała uczta, a Haman upadł na łoże, na którym siedziała Estera. Wtedy król powiedział: Czy jeszcze chce gwałcić królową przy mnie w domu? A gdy te słowa wyszły z ust króla, natychmiast zakryto twarz Hamana."
  tags: []
"Est7,9":
  text: "I Charbona, jeden z eunuchów, powiedział do króla: Oto szubienica przygotowana przez Hamana dla Mardocheusza, który dbał o dobro króla, stoi przy domu Hamana, wysoka na pięćdziesiąt łokci. Król powiedział: Powieście go na niej."
  tags: []
"Est7,10":
  text: "I powieszono Hamana na tej szubienicy, którą przygotował dla Mardocheusza. I tak gniew króla się uspokoił."
  tags: []
