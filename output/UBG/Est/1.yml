"Est1,1":
  text: "I stało się za dni Aswerusa – tego Aswerusa, który królował od Indii aż do Etiopii nad stu dwudziestoma siedmioma prowincjami;"
  tags: []
"Est1,2":
  text: "Że w tych dniach, gdy król Aswerus zasiadał na tronie swego królestwa w pałacu Suza;"
  tags: []
"Est1,3":
  text: "W trzecim roku swego panowania wyprawił u siebie ucztę dla wszystkich swoich książąt i sług. Stawili się przed nim dowódcy Persów i Medów oraz dostojnicy i książęta prowincji."
  tags: []
"Est1,4":
  text: "I pokazywał bogactwa i chwałę swego królestwa oraz wspaniałość swego majestatu przez wiele dni, mianowicie przez sto osiemdziesiąt dni."
  tags: []
"Est1,5":
  text: "A po upływie tych dni król wyprawił ucztę dla wszystkich ludzi znajdujących się w pałacu Suza, od największego aż do najmniejszego, przez siedem dni na dziedzińcu, w ogrodzie pałacu króla."
  tags: []
"Est1,6":
  text: "Wisiały w nim białe, zielone i błękitne tkaniny przymocowane sznurami z bisioru i purpury do srebrnych pierścieni na słupach z marmuru. Złote i srebrne łoża stały na posadzce z kryształu i marmuru, z białego i czarnego marmuru."
  tags: []
"Est1,7":
  text: "A napój podawano w złotych naczyniach, każde z naczyń było zaś inne, a wina królewskiego było pod dostatkiem, jak przystało na króla."
  tags: []
"Est1,8":
  text: "Ale do picia, według polecenia, nikt nikogo nie przymuszał. Tak bowiem rozkazał król wszystkim zarządcom swego domu, aby czynili według woli każdego."
  tags: []
"Est1,9":
  text: "Królowa Waszti także wyprawiła ucztę dla kobiet w domu królewskim, który należał do króla Aswerusa."
  tags: []
"Est1,10":
  text: "A dnia siódmego, gdy serce króla rozweseliło się winem, rozkazał on Mechumanie, Bizzecie, Charbonie, Bigcie, Abagcie, Zetarowi i Karkasowi, siedmiu eunuchom, którzy służyli przy królu Aswerusie;"
  tags: []
"Est1,11":
  text: "Aby przyprowadzili przed oblicze króla królową Waszti w koronie królewskiej, chcąc pokazać ludowi i książętom jej piękność. Była bowiem bardzo piękna."
  tags: []
"Est1,12":
  text: "Ale królowa Waszti odmówiła przyjścia na rozkaz króla, przekazany przez eunuchów. Król więc bardzo się rozgniewał, a gniew w nim zapłonął."
  tags: []
"Est1,13":
  text: "Wtedy król zapytał mędrców obeznanych z czasami (gdyż taki był zwyczaj, aby sprawy królewskie przedkładać wszystkim znawcom prawa i sądu;"
  tags: []
"Est1,14":
  text: "A jego najbliższymi byli: Karszena, Szetar, Admata, Tarszisz, Meres, Marsena i Memukan, siedmiu książąt perskich i medyjskich, którzy oglądali oblicze króla i zajmowali pierwsze miejsce w królestwie);"
  tags: []
"Est1,15":
  text: "Co według prawa należy czynić z królową Waszti za to, że nie wykonała rozkazu króla Aswerusa przekazanego przez eunuchów?"
  tags: []
"Est1,16":
  text: "Wtedy Memukan odpowiedział przed królem i książętami: Królowa Waszti wystąpiła nie tylko przeciw samemu królowi, ale przeciw wszystkim książętom i wszystkim ludom, które żyją we wszystkich prowincjach króla Aswerusa."
  tags: []
"Est1,17":
  text: "Kiedy bowiem postępek królowej rozniesie się wśród wszystkich kobiet, wzgardzą one swoimi mężami w swoich oczach i powiedzą: Król Aswerus rozkazał przyprowadzić królową Waszti przed swoje oblicze, a ona nie przyszła."
  tags: []
"Est1,18":
  text: "Jeszcze dzisiaj księżniczki perskie i medyjskie, które słyszały o postępku królowej, będą mówiły to samo wszystkim książętom króla, a będzie wiele pogardy i gniewu."
  tags: []
"Est1,19":
  text: "Dlatego więc, jeśli król uzna to za słuszne, niech wyjdzie od króla wyrok i niech będzie wpisany do praw perskich i medyjskich, które są nieodwołalne: Że Waszti nie przyjdzie już przed oblicze króla Aswerusa, a jej godność królewską niech król da innej, lepszej od niej."
  tags: []
"Est1,20":
  text: "A gdy ten wyrok, wydany przez króla, będzie ogłoszony w całym jego królestwie – a jest ono wielkie – wtedy wszystkie żony okażą szacunek swoim mężom, od wielkiego aż do małego."
  tags: []
"Est1,21":
  text: "Ta rada podobała się królowi i książętom i król uczynił według rady Memukana."
  tags: []
"Est1,22":
  text: "I rozesłał listy do wszystkich prowincji królewskich, do każdej prowincji napisany jej własnym pismem, i do każdego ludu w jego języku, aby każdy mężczyzna był panem w swoim domu. A ogłoszono to w języku każdego narodu."
  tags: []
