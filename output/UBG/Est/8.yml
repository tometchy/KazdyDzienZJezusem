"Est8,1":
  text: "Tego dnia król Aswerus dał królowej Esterze dom Hamana, wroga Żydów, a Mardocheusz przyszedł przed króla, gdyż Estera powiedziała mu, kim on jest dla niej."
  tags: []
"Est8,2":
  text: "Wtedy król zdjął swój pierścień, który zabrał Hamanowi, i dał go Mardocheuszowi. Estera zaś ustanowiła Mardocheusza nad domem Hamana."
  tags: []
"Est8,3":
  text: "Potem Estera jeszcze mówiła do króla, upadła mu do nóg i z płaczem prosiła go, aby odwrócił złość Hamana, Agagity, i jego zamiar, który powziął przeciwko Żydom."
  tags: []
"Est8,4":
  text: "Wtedy król wyciągnął ku Esterze złote berło, a Estera wstała i stanęła przed królem."
  tags: []
"Est8,5":
  text: "I powiedziała: Jeśli królowi się podoba, jeśli znalazłam łaskę w jego oczach, jeśli król uzna to za słuszne i jeśli ja jestem miła w jego oczach, niech zostanie napisane, aby wycofano listy obmyślone przez Hamana, syna Hammedaty, Agagity, które napisał, aby wytracić Żydów, którzy są we wszystkich prowincjach królewskich."
  tags: []
"Est8,6":
  text: "Jakże bowiem mogłabym patrzeć na to nieszczęście, które spotka mój lud? Jak mogłabym patrzeć na zgubę mojej rodziny?"
  tags: []
"Est8,7":
  text: "Wtedy król Aswerus powiedział do królowej Estery i do Żyda Mardocheusza: Oto dałem Esterze dom Hamana, a jego powieszono na szubienicy, ponieważ podniósł rękę na Żydów."
  tags: []
"Est8,8":
  text: "Napiszcie więc do Żydów to, co uznacie za słuszne, w imieniu króla i zapieczętujcie pierścieniem królewskim. To bowiem, co zostało napisane w imieniu króla i zapieczętowane pierścieniem królewskim, nie może być odwołane."
  tags: []
"Est8,9":
  text: "Zwołano więc pisarzy króla w tym czasie, trzeciego miesiąca, to jest miesiąca Siwan, dwudziestego trzeciego dnia tego miesiąca, i napisano wszystko, tak jak nakazał Mardocheusz, do Żydów, do satrapów, do namiestników i do przełożonych prowincji, które rozciągają się od Indii aż do Etiopii, do stu dwudziestu siedmiu prowincji, do każdej prowincji jej pismem i do każdego ludu w jego języku, i do Żydów ich pismem i w ich języku."
  tags: []
"Est8,10":
  text: "A gdy napisał w imieniu króla Aswerusa i zapieczętował pierścieniem królewskim, rozesłał listy przez gońców jeżdżących na koniach szybkich i na mułach młodych;"
  tags: []
"Est8,11":
  text: "Że król dał wolność Żydom, którzy byli we wszystkich miastach, aby zgromadzili się i stanęli w obronie swego życia, aby też wytracili, zabili i wygubili wszystkich zbrojnych napadających na nich wśród ludu i prowincji, wraz z ich dziećmi i kobietami, a ich mienie zabrali jako łup;"
  tags: []
"Est8,12":
  text: "I to w jednym dniu we wszystkich prowincjach króla Aswerusa, mianowicie trzynastego dnia dwunastego miesiąca, to jest miesiąca Adar."
  tags: []
"Est8,13":
  text: "Odpis tego pisma, w którym wydano dekret dla każdej prowincji, ogłoszono wszystkim ludom, że Żydzi będą gotowi na ten dzień do pomsty nad swymi wrogami."
  tags: []
"Est8,14":
  text: "Wtedy wyruszyli gońcy, jeżdżący na szybkich koniach i na mułach, przynaglani rozkazem króla. Dekret ogłoszono także w pałacu Suza."
  tags: []
"Est8,15":
  text: "A Mardocheusz wyszedł od króla ubrany w niebieskie i białe szaty królewskie, z wielką koroną złotą i w płaszcz z bisioru i purpury. A miasto Suza weseliło i radowało się."
  tags: []
"Est8,16":
  text: "Dla Żydów nastały światło i wesele, radość i cześć."
  tags: []
"Est8,17":
  text: "A w każdej prowincji i w każdym mieście, dokądkolwiek rozkaz króla i jego dekret dotarły, Żydzi mieli wesele, radość, ucztę i doniosły dzień. Wielu zaś spośród ludu tych ziem zostało Żydami. Padł bowiem na nich strach przed Żydami."
  tags: []
