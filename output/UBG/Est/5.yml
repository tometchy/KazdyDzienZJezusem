"Est5,1":
  text: "Trzeciego dnia Estera ubrała się w szaty królowej, stanęła na wewnętrznym dziedzińcu domu króla, naprzeciw domu króla. A król siedział na swoim królewskim tronie w domu króla naprzeciw bramy domu."
  tags: []
"Est5,2":
  text: "A gdy król zobaczył królową Esterę, stojącą na dziedzińcu, znalazła ona łaskę w jego oczach i król wyciągnął do Estery złote berło, które trzymał w ręku. Estera więc zbliżyła się i dotknęła końca berła."
  tags: []
"Est5,3":
  text: "Król zapytał ją: Co ci jest, królowo Estero? Jaka jest twoja prośba? Choćbyś prosiła o połowę królestwa, będzie ci dane."
  tags: []
"Est5,4":
  text: "Estera odpowiedziała: Jeśli to się królowi podoba, to niech przyjdzie król i Haman dzisiaj na ucztę, którą dla niego przygotowałam."
  tags: []
"Est5,5":
  text: "Król powiedział: Zawołajcie szybko Hamana, aby spełnił prośbę Estery. Przyszedł więc król i Haman na ucztę, którą wyprawiła Estera."
  tags: []
"Est5,6":
  text: "Potem król zapytał Esterę, gdy się napił wina: Jaka jest twoja prośba, a będzie ci dane. Jakie jest twoje życzenie? Choćbyś prosiła o połowę królestwa, będzie ci dane."
  tags: []
"Est5,7":
  text: "Na to Estera odpowiedziała: Oto moje życzenie i moja prośba:"
  tags: []
"Est5,8":
  text: "Jeśli znalazłam łaskę w oczach króla i jeśli królowi się podoba, aby spełnić moją prośbę i wykonać moje życzenie, to niech przyjdzie król i Haman na ucztę, którą im przygotuję, a jutro uczynię według słowa króla."
  tags: []
"Est5,9":
  text: "I wyszedł Haman tego dnia wesoły i dobrej myśli. Ale gdy Haman zobaczył Mardocheusza w bramie królewskiej, że on ani nie powstał, ani się nie poruszył przed nim, napełnił się gniewem na Mardocheusza."
  tags: []
"Est5,10":
  text: "Opanował się jednak Haman, a gdy przyszedł do domu, posłał po swoich przyjaciół i Zeresz, swoją żonę."
  tags: []
"Est5,11":
  text: "I opowiadał im Haman o wspaniałości jego bogactwa, o mnóstwie swoich synów oraz o tym wszystkim, jak wielkim król go uczynił i jak go wywyższył ponad innych książąt i sługi króla."
  tags: []
"Est5,12":
  text: "Ponadto Haman powiedział: Nawet królowa Estera nikogo oprócz mnie nie zaprosiła na ucztę z królem, którą przygotowała, a jeszcze na jutro zostałem do niej zaproszony z królem."
  tags: []
"Est5,13":
  text: "Ale to wszystko jest dla mnie niczym, dopóki widzę Żyda Mardocheusza, siedzącego w bramie królewskiej."
  tags: []
"Est5,14":
  text: "Wtedy jego żona Zeresz oraz wszyscy jego przyjaciele powiedzieli mu: Niech postawią szubienicę wysoką na pięćdziesiąt łokci, a rano powiedz królowi, aby powieszono na niej Mardocheusza. Potem idź wesół z królem na ucztę. I spodobała się Hamanowi ta rada, i rozkazał postawić szubienicę."
  tags: []
