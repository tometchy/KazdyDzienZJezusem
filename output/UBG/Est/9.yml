"Est9,1": "A dwunastego miesiąca, czyli miesiąca Adar, trzynastego dnia tego miesiąca, gdy nadszedł czas wypełnienia rozkazu króla i jego dekretu, tego dnia, kiedy wrogowie Żydów spodziewali się, że będą panować nad nimi, stało się wprost przeciwnie, ponieważ Żydzi panowali nad tymi, którzy ich nienawidzili."
"Est9,2": "Żydzi bowiem zebrali się w swoich miastach we wszystkich prowincjach króla Aswerusa, aby podnieść rękę na tych, którzy pragnęli ich zguby. A nikt nie mógł im stawić oporu, gdyż strach przed nimi padł na wszystkie ludy."
"Est9,3": "I wszyscy przełożeni prowincji, satrapowie, namiestnicy i urzędnicy królewscy popierali Żydów, bo padł na nich strach przed Mardocheuszem."
"Est9,4": "Mardocheusz był bowiem wielki w domu króla, a jego sława rozchodziła się po wszystkich prowincjach, gdyż Mardocheusz stawał się coraz większy."
"Est9,5": "Tak to Żydzi zabili wszystkich swoich wrogów mieczem, mordując i niszcząc, a czynili z tymi, co ich nienawidzili, według swego upodobania."
"Est9,6": "Nawet i w pałacu Suza Żydzi zabili i wytracili pięciuset mężczyzn;"
"Est9,7": "I Parszandatę, Dalfona i Aspatę;"
"Est9,8": "I Poratę, Adalię i Arydata;"
"Est9,9": "I Parmasztę, Arisaja, Aridaja i Wajezatę;"
"Est9,10": "Tych dziesięciu synów Hamana, syna Hammedaty, wroga Żydów, zabili, ale po łupy nie wyciągnęli swej ręki."
"Est9,11": "Tego samego dnia dotarła do króla wiadomość o liczbie zabitych w pałacu Suza."
"Est9,12": "I król powiedział do królowej Estery: W pałacu Suza Żydzi zabili i wytracili pięciuset mężczyzn oraz dziesięciu synów Hamana. A w pozostałych prowincjach królewskich, cóż uczynili? Jaką masz jeszcze prośbę, a będzie spełniona. Czego jeszcze sobie życzysz, a stanie ci się."
"Est9,13": "Estera odpowiedziała: Jeśli się królowi spodoba, niech wolno będzie jutro Żydom, którzy są w Suzie, uczynić według dekretu dzisiejszego i niech powieszą dziesięciu synów Hamana na szubienicy."
"Est9,14": "I król rozkazał, aby tak uczyniono. Ogłoszono dekret w Suzie i powieszono dziesięciu synów Hamana."
"Est9,15": "A Żydzi, którzy byli w Suzie, zgromadzili się także dnia czternastego miesiąca Adar i zabili w Suzie trzystu mężczyzn, lecz po łupy nie wyciągnęli swojej ręki."
"Est9,16": "Pozostali zaś Żydzi, którzy byli w prowincjach królewskich, zebrali się w obronie swojego życia i mieli odpoczynek od swoich wrogów. Zabili siedemdziesiąt pięć tysięcy swoich wrogów, lecz po łupy nie wyciągnęli swojej ręki;"
"Est9,17": "W dniu trzynastym miesiąca Adar, a odpoczywali czternastego dnia tego miesiąca i obchodzili go jako dzień uczty i wesela."
"Est9,18": "Ale Żydzi, którzy byli w Suzie, zebrali się dnia trzynastego i czternastego tego miesiąca, a piętnastego dnia odpoczęli i obchodzili go jako dzień uczty i wesela."
"Est9,19": "Dlatego Żydzi mieszkający we wsiach i w miasteczkach nieobwarowanych obchodzą czternasty dzień miesiąca Adar jako dzień radości, uczty i jako doniosły dzień, w którym posyłają sobie dary żywnościowe."
"Est9,20": "A Mardocheusz spisał te wydarzenia i rozesłał listy do wszystkich Żydów, którzy byli we wszystkich prowincjach króla Aswerusa, bliskich i dalekich;"
"Est9,21": "Zobowiązując ich, aby obchodzili czternasty dzień miesiąca Adar i piętnasty dzień tego samego miesiąca, rokrocznie;"
"Est9,22": "Jako dni, w których Żydzi odpoczęli od swoich wrogów, i miesiąc, który obrócił się im ze smutku w radość, a z płaczu w dzień radości – aby obchodzili je jako dni uczty i wesela oraz posyłania sobie darów żywnościowych, a ubogim darów."
"Est9,23": "Wszyscy Żydzi przyjęli to, co sami zaczęli czynić, a co napisał im Mardocheusz;"
"Est9,24": "Haman bowiem, syn Hammedaty, Agagity, wróg wszystkich Żydów, wymyślił plan przeciw Żydom, aby ich wytracić, i rzucił Pur, czyli los, aby ich wytracić i zniszczyć;"
"Est9,25": "Ale gdy Estera przyszła przed króla, ten wydał dekret na piśmie, aby jego niegodziwy zamiar, który obmyślił przeciwko Żydom, obrócił się na głowę jego, i aby powiesić jego i jego synów na szubienicy."
"Est9,26": "Dlatego nazwali te dni Purim, od nazwy Pur. A z powodu wszystkich słów tego listu oraz na podstawie tego, co widzieli i co ich spotkało;"
"Est9,27": "Żydzi postanowili i wzięli na siebie, na swoje potomstwo i na wszystkich, którzy się do nich przyłączyli, nieustający obowiązek, aby obchodzono te dwa dni stosownie do pisma i zgodnie z ustalonym czasem każdego roku;"
"Est9,28": "I że te dni będą wspominane i obchodzone we wszystkich pokoleniach, w każdej rodzinie, w każdej prowincji i w każdym mieście; że te dni Purim nie zaginą wśród Żydów, a pamięć o nich nie ustanie u ich potomstwa."
"Est9,29": "Królowa Estera, córka Abichaila, i Żyd Mardocheusz napisali z całą powagą, aby potwierdzić ten drugi list dotyczący Purim."
"Est9,30": "Mardocheusz posłał ten list do wszystkich Żydów, do stu dwudziestu siedmiu prowincji królestwa Aswerusa, ze słowami pokoju i prawdy;"
"Est9,31": "Aby ustanowić te dni Purim w ustalonym czasie, jak to Żyd Mardocheusz i królowa Estera ustanowili je i jak zobowiązali samych siebie i swoje potomstwo, na pamiątkę postu i ich lamentacji."
"Est9,32": "Nakaz Estery potwierdził ustawę dotyczącą tych dni Purim i zostało to zapisane w księdze."
