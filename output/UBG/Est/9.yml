"Est9,1":
  text: "A dwunastego miesiąca, czyli miesiąca Adar, trzynastego dnia tego miesiąca, gdy nadszedł czas wypełnienia rozkazu króla i jego dekretu, tego dnia, kiedy wrogowie Żydów spodziewali się, że będą panować nad nimi, stało się wprost przeciwnie, ponieważ Żydzi panowali nad tymi, którzy ich nienawidzili."
  tags: []
"Est9,2":
  text: "Żydzi bowiem zebrali się w swoich miastach we wszystkich prowincjach króla Aswerusa, aby podnieść rękę na tych, którzy pragnęli ich zguby. A nikt nie mógł im stawić oporu, gdyż strach przed nimi padł na wszystkie ludy."
  tags: []
"Est9,3":
  text: "I wszyscy przełożeni prowincji, satrapowie, namiestnicy i urzędnicy królewscy popierali Żydów, bo padł na nich strach przed Mardocheuszem."
  tags: []
"Est9,4":
  text: "Mardocheusz był bowiem wielki w domu króla, a jego sława rozchodziła się po wszystkich prowincjach, gdyż Mardocheusz stawał się coraz większy."
  tags: []
"Est9,5":
  text: "Tak to Żydzi zabili wszystkich swoich wrogów mieczem, mordując i niszcząc, a czynili z tymi, co ich nienawidzili, według swego upodobania."
  tags: []
"Est9,6":
  text: "Nawet i w pałacu Suza Żydzi zabili i wytracili pięciuset mężczyzn;"
  tags: []
"Est9,7":
  text: "I Parszandatę, Dalfona i Aspatę;"
  tags: []
"Est9,8":
  text: "I Poratę, Adalię i Arydata;"
  tags: []
"Est9,9":
  text: "I Parmasztę, Arisaja, Aridaja i Wajezatę;"
  tags: []
"Est9,10":
  text: "Tych dziesięciu synów Hamana, syna Hammedaty, wroga Żydów, zabili, ale po łupy nie wyciągnęli swej ręki."
  tags: []
"Est9,11":
  text: "Tego samego dnia dotarła do króla wiadomość o liczbie zabitych w pałacu Suza."
  tags: []
"Est9,12":
  text: "I król powiedział do królowej Estery: W pałacu Suza Żydzi zabili i wytracili pięciuset mężczyzn oraz dziesięciu synów Hamana. A w pozostałych prowincjach królewskich, cóż uczynili? Jaką masz jeszcze prośbę, a będzie spełniona. Czego jeszcze sobie życzysz, a stanie ci się."
  tags: []
"Est9,13":
  text: "Estera odpowiedziała: Jeśli się królowi spodoba, niech wolno będzie jutro Żydom, którzy są w Suzie, uczynić według dekretu dzisiejszego i niech powieszą dziesięciu synów Hamana na szubienicy."
  tags: []
"Est9,14":
  text: "I król rozkazał, aby tak uczyniono. Ogłoszono dekret w Suzie i powieszono dziesięciu synów Hamana."
  tags: []
"Est9,15":
  text: "A Żydzi, którzy byli w Suzie, zgromadzili się także dnia czternastego miesiąca Adar i zabili w Suzie trzystu mężczyzn, lecz po łupy nie wyciągnęli swojej ręki."
  tags: []
"Est9,16":
  text: "Pozostali zaś Żydzi, którzy byli w prowincjach królewskich, zebrali się w obronie swojego życia i mieli odpoczynek od swoich wrogów. Zabili siedemdziesiąt pięć tysięcy swoich wrogów, lecz po łupy nie wyciągnęli swojej ręki;"
  tags: []
"Est9,17":
  text: "W dniu trzynastym miesiąca Adar, a odpoczywali czternastego dnia tego miesiąca i obchodzili go jako dzień uczty i wesela."
  tags: []
"Est9,18":
  text: "Ale Żydzi, którzy byli w Suzie, zebrali się dnia trzynastego i czternastego tego miesiąca, a piętnastego dnia odpoczęli i obchodzili go jako dzień uczty i wesela."
  tags: []
"Est9,19":
  text: "Dlatego Żydzi mieszkający we wsiach i w miasteczkach nieobwarowanych obchodzą czternasty dzień miesiąca Adar jako dzień radości, uczty i jako doniosły dzień, w którym posyłają sobie dary żywnościowe."
  tags: []
"Est9,20":
  text: "A Mardocheusz spisał te wydarzenia i rozesłał listy do wszystkich Żydów, którzy byli we wszystkich prowincjach króla Aswerusa, bliskich i dalekich;"
  tags: []
"Est9,21":
  text: "Zobowiązując ich, aby obchodzili czternasty dzień miesiąca Adar i piętnasty dzień tego samego miesiąca, rokrocznie;"
  tags: []
"Est9,22":
  text: "Jako dni, w których Żydzi odpoczęli od swoich wrogów, i miesiąc, który obrócił się im ze smutku w radość, a z płaczu w dzień radości – aby obchodzili je jako dni uczty i wesela oraz posyłania sobie darów żywnościowych, a ubogim darów."
  tags: []
"Est9,23":
  text: "Wszyscy Żydzi przyjęli to, co sami zaczęli czynić, a co napisał im Mardocheusz;"
  tags: []
"Est9,24":
  text: "Haman bowiem, syn Hammedaty, Agagity, wróg wszystkich Żydów, wymyślił plan przeciw Żydom, aby ich wytracić, i rzucił Pur, czyli los, aby ich wytracić i zniszczyć;"
  tags: []
"Est9,25":
  text: "Ale gdy Estera przyszła przed króla, ten wydał dekret na piśmie, aby jego niegodziwy zamiar, który obmyślił przeciwko Żydom, obrócił się na głowę jego, i aby powiesić jego i jego synów na szubienicy."
  tags: []
"Est9,26":
  text: "Dlatego nazwali te dni Purim, od nazwy Pur. A z powodu wszystkich słów tego listu oraz na podstawie tego, co widzieli i co ich spotkało;"
  tags: []
"Est9,27":
  text: "Żydzi postanowili i wzięli na siebie, na swoje potomstwo i na wszystkich, którzy się do nich przyłączyli, nieustający obowiązek, aby obchodzono te dwa dni stosownie do pisma i zgodnie z ustalonym czasem każdego roku;"
  tags: []
"Est9,28":
  text: "I że te dni będą wspominane i obchodzone we wszystkich pokoleniach, w każdej rodzinie, w każdej prowincji i w każdym mieście; że te dni Purim nie zaginą wśród Żydów, a pamięć o nich nie ustanie u ich potomstwa."
  tags: []
"Est9,29":
  text: "Królowa Estera, córka Abichaila, i Żyd Mardocheusz napisali z całą powagą, aby potwierdzić ten drugi list dotyczący Purim."
  tags: []
"Est9,30":
  text: "Mardocheusz posłał ten list do wszystkich Żydów, do stu dwudziestu siedmiu prowincji królestwa Aswerusa, ze słowami pokoju i prawdy;"
  tags: []
"Est9,31":
  text: "Aby ustanowić te dni Purim w ustalonym czasie, jak to Żyd Mardocheusz i królowa Estera ustanowili je i jak zobowiązali samych siebie i swoje potomstwo, na pamiątkę postu i ich lamentacji."
  tags: []
"Est9,32":
  text: "Nakaz Estery potwierdził ustawę dotyczącą tych dni Purim i zostało to zapisane w księdze."
  tags: []
