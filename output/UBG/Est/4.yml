"Est4,1":
  text: "Kiedy Mardocheusz dowiedział się o wszystkim, co się stało, rozdarł swoje szaty i przyodział się w wór, następnie posypał się popiołem, wyszedł na środek miasta i lamentował głośno i gorzko."
  tags: []
"Est4,2":
  text: "I doszedł aż do bramy królewskiej, gdyż nie wolno było wejść w bramę królewską przyodzianemu w wór."
  tags: []
"Est4,3":
  text: "W każdej prowincji, gdzie tylko dotarł rozkaz króla i jego dekret, nastała wielka żałoba wśród Żydów, nastał też post, płacz i lament, a wielu leżało w worze i w popiele."
  tags: []
"Est4,4":
  text: "Przyszły więc służące Estery i jej eunuchowie i opowiedzieli jej o tym. Wtedy królowa bardzo się zasmuciła i posłała szaty, aby ubrać Mardocheusza i zdjąć z niego wór. Ale on ich nie przyjął."
  tags: []
"Est4,5":
  text: "Wtedy Estera zawołała Hataka, jednego z eunuchów króla, którego on dał jej do posługi, i rozkazała mu pójść do Mardocheusza, aby się dowiedział, co to ma znaczyć i dlaczego tak się stało."
  tags: []
"Est4,6":
  text: "Wyszedł więc Hatak do Mardocheusza na plac miejski, który był przed bramą królewską;"
  tags: []
"Est4,7":
  text: "I Mardocheusz opowiedział mu wszystko, co mu się przydarzyło, także o sumie srebra, którą Haman obiecał odważyć do skarbca królewskiego za Żydów, aby zostali wytraceni."
  tags: []
"Est4,8":
  text: "Ponadto dał mu odpis dekretu o ich zagładzie, który ogłoszono w Suzie, aby pokazał go Esterze, powiadomił ją i rozkazał, aby poszła do króla, błagając go o swój lud i wstawiając się za nim."
  tags: []
"Est4,9":
  text: "Przyszedł więc Hatak i przekazał Esterze słowa Mardocheusza."
  tags: []
"Est4,10":
  text: "I Estera odpowiedziała Hatakowi i poleciła mu iść do Mardocheusza:"
  tags: []
"Est4,11":
  text: "Wszyscy słudzy króla oraz lud z prowincji królewskich wiedzą, że ktokolwiek – mężczyzna lub kobieta – wejdzie do króla na dziedziniec wewnętrzny, nie będąc wezwany, podlega tylko jednemu prawu – ma zostać zabity, z wyjątkiem tego, nad którym król wyciągnie złote berło, ten zostanie przy życiu. Ale mnie nie wezwano, aby wejść do króla, już od trzydziestu dni."
  tags: []
"Est4,12":
  text: "I powiedziano Mardocheuszowi słowa Estery."
  tags: []
"Est4,13":
  text: "Wtedy Mardocheusz polecił przekazać Esterze taką odpowiedź: Nie myśl sobie, że ty jedna spośród wszystkich Żydów ocalejesz w domu królewskim."
  tags: []
"Est4,14":
  text: "Jeśli bowiem ty całkowicie będziesz milczeć w tym czasie, uwolnienie i wybawienie dla Żydów przyjdzie z innego miejsca, ale ty i dom twego ojca zginiecie. A kto wie, czy nie na tę właśnie chwilę dostąpiłaś godności królestwa?"
  tags: []
"Est4,15":
  text: "Estera poleciła, by odpowiedziano Mardocheuszowi:"
  tags: []
"Est4,16":
  text: "Idź, zbierz wszystkich Żydów, którzy się znajdują w Suzie, i pośćcie za mnie, nie jedzcie ani nie pijcie przez trzy dni, nocą i dniem. Ja także i moje służące będziemy pościć, a potem wejdę do króla, choć to niezgodne z prawem. A jeśli zginę, to zginę."
  tags: []
"Est4,17":
  text: "Poszedł więc Mardocheusz i uczynił wszystko, co mu rozkazała Estera."
  tags: []
