"Est4,1": "Kiedy Mardocheusz dowiedział się o wszystkim, co się stało, rozdarł swoje szaty i przyodział się w wór, następnie posypał się popiołem, wyszedł na środek miasta i lamentował głośno i gorzko."
"Est4,2": "I doszedł aż do bramy królewskiej, gdyż nie wolno było wejść w bramę królewską przyodzianemu w wór."
"Est4,3": "W każdej prowincji, gdzie tylko dotarł rozkaz króla i jego dekret, nastała wielka żałoba wśród Żydów, nastał też post, płacz i lament, a wielu leżało w worze i w popiele."
"Est4,4": "Przyszły więc służące Estery i jej eunuchowie i opowiedzieli jej o tym. Wtedy królowa bardzo się zasmuciła i posłała szaty, aby ubrać Mardocheusza i zdjąć z niego wór. Ale on ich nie przyjął."
"Est4,5": "Wtedy Estera zawołała Hataka, jednego z eunuchów króla, którego on dał jej do posługi, i rozkazała mu pójść do Mardocheusza, aby się dowiedział, co to ma znaczyć i dlaczego tak się stało."
"Est4,6": "Wyszedł więc Hatak do Mardocheusza na plac miejski, który był przed bramą królewską;"
"Est4,7": "I Mardocheusz opowiedział mu wszystko, co mu się przydarzyło, także o sumie srebra, którą Haman obiecał odważyć do skarbca królewskiego za Żydów, aby zostali wytraceni."
"Est4,8": "Ponadto dał mu odpis dekretu o ich zagładzie, który ogłoszono w Suzie, aby pokazał go Esterze, powiadomił ją i rozkazał, aby poszła do króla, błagając go o swój lud i wstawiając się za nim."
"Est4,9": "Przyszedł więc Hatak i przekazał Esterze słowa Mardocheusza."
"Est4,10": "I Estera odpowiedziała Hatakowi i poleciła mu iść do Mardocheusza:"
"Est4,11": "Wszyscy słudzy króla oraz lud z prowincji królewskich wiedzą, że ktokolwiek – mężczyzna lub kobieta – wejdzie do króla na dziedziniec wewnętrzny, nie będąc wezwany, podlega tylko jednemu prawu – ma zostać zabity, z wyjątkiem tego, nad którym król wyciągnie złote berło, ten zostanie przy życiu. Ale mnie nie wezwano, aby wejść do króla, już od trzydziestu dni."
"Est4,12": "I powiedziano Mardocheuszowi słowa Estery."
"Est4,13": "Wtedy Mardocheusz polecił przekazać Esterze taką odpowiedź: Nie myśl sobie, że ty jedna spośród wszystkich Żydów ocalejesz w domu królewskim."
"Est4,14": "Jeśli bowiem ty całkowicie będziesz milczeć w tym czasie, uwolnienie i wybawienie dla Żydów przyjdzie z innego miejsca, ale ty i dom twego ojca zginiecie. A kto wie, czy nie na tę właśnie chwilę dostąpiłaś godności królestwa?"
"Est4,15": "Estera poleciła, by odpowiedziano Mardocheuszowi:"
"Est4,16": "Idź, zbierz wszystkich Żydów, którzy się znajdują w Suzie, i pośćcie za mnie, nie jedzcie ani nie pijcie przez trzy dni, nocą i dniem. Ja także i moje służące będziemy pościć, a potem wejdę do króla, choć to niezgodne z prawem. A jeśli zginę, to zginę."
"Est4,17": "Poszedł więc Mardocheusz i uczynił wszystko, co mu rozkazała Estera."
