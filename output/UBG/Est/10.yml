"Est10,1":
  text: "Potem król Aswerus nałożył podatek na swoją ziemię i na wyspy morskie."
  tags: []
"Est10,2":
  text: "A wszystkie dzieła jego potęgi i mocy oraz opis wielkości Mardocheusza, którą wyróżnił go król, czy nie są zapisane w księgach kronik królów Medii i Persji?"
  tags: []
"Est10,3":
  text: "Żyd Mardocheusz był bowiem drugi po królu Aswerusie, wielki w oczach Żydów i cieszący się uznaniem wśród wielu swoich braci, troszczył się o dobro swego ludu i głosił pokój całemu swemu ludowi."
  tags: []
