"Est10,1": "Potem król Aswerus nałożył podatek na swoją ziemię i na wyspy morskie."
"Est10,2": "A wszystkie dzieła jego potęgi i mocy oraz opis wielkości Mardocheusza, którą wyróżnił go król, czy nie są zapisane w księgach kronik królów Medii i Persji?"
"Est10,3": "Żyd Mardocheusz był bowiem drugi po królu Aswerusie, wielki w oczach Żydów i cieszący się uznaniem wśród wielu swoich braci, troszczył się o dobro swego ludu i głosił pokój całemu swemu ludowi."
