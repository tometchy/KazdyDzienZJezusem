"Jk4,1":
  text: "Skąd wojny i walki wśród was? Czy nie z waszych żądz, które toczą bój w waszych członkach?"
  tags: []
"Jk4,2":
  text: "Pożądacie, a nie macie, zabijacie i zazdrościcie, a nie możecie osiągnąć. Toczycie wojny i walki, a nie macie, bo nie prosicie."
  tags: []
"Jk4,3":
  text: "Prosicie, a nie otrzymujecie, dlatego że źle prosicie, chcąc tym zaspokoić wasze żądze."
  tags: []
"Jk4,4":
  text: "Cudzołożnicy i cudzołożnice, czy nie wiecie, że przyjaźń ze światem jest nieprzyjaźnią z Bogiem? Jeśli więc ktoś chce być przyjacielem świata, staje się nieprzyjacielem Boga."
  tags: []
"Jk4,5":
  text: "Czy sądzicie, że na próżno Pismo mówi: Duch, który w nas mieszka, zazdrośnie pożąda?"
  tags: []
"Jk4,6":
  text: "Większą zaś daje łaskę, bo mówi: Bóg sprzeciwia się pysznym, a pokornym daje łaskę."
  tags: []
"Jk4,7":
  text: "Poddajcie się więc Bogu, przeciwstawcie się diabłu, a ucieknie od was."
  tags: []
"Jk4,8":
  text: "Zbliżcie się do Boga, a on zbliży się do was. Obmyjcie ręce, grzesznicy, i oczyśćcie serca, ludzie umysłu dwoistego."
  tags: []
"Jk4,9":
  text: "Ubolewajcie, smućcie się i płaczcie. Wasz śmiech niech się obróci w smutek, a radość w przygnębienie."
  tags: []
"Jk4,10":
  text: "Uniżcie się przed Panem, a on was wywyższy."
  tags: []
"Jk4,11":
  text: "Nie obmawiajcie jedni drugich, bracia. Kto obmawia brata i osądza brata, obmawia prawo i osądza prawo. Jeśli zaś osądzasz prawo, nie jesteś wykonawcą prawa, lecz sędzią."
  tags: []
"Jk4,12":
  text: "Jeden jest prawodawca, który ma moc zbawić i zatracić. A ty kim jesteś, że osądzasz drugiego?"
  tags: []
"Jk4,13":
  text: "A teraz wy, którzy mówicie: Dziś albo jutro udamy się do tego miasta i zatrzymamy się tam przez rok, będziemy handlować i osiągniemy zyski;"
  tags: []
"Jk4,14":
  text: "Wy, którzy nie wiecie, co jutro będzie. Bo czymże jest wasze życie? Doprawdy jest parą, która pojawia się na krótko, a potem znika."
  tags: []
"Jk4,15":
  text: "Zamiast tego powinniście mówić: Jeżeli Pan zechce i będziemy żyli, zrobimy to lub owo."
  tags: []
"Jk4,16":
  text: "Teraz zaś przechwalacie się w waszej pysze. Wszelkie takie przechwalanie się jest złe."
  tags: []
"Jk4,17":
  text: "Kto więc umie dobrze czynić, a nie czyni, popełnia grzech."
  tags: []
