"Jk4,1": "Skąd wojny i walki wśród was? Czy nie z waszych żądz, które toczą bój w waszych członkach?"
"Jk4,2": "Pożądacie, a nie macie, zabijacie i zazdrościcie, a nie możecie osiągnąć. Toczycie wojny i walki, a nie macie, bo nie prosicie."
"Jk4,3": "Prosicie, a nie otrzymujecie, dlatego że źle prosicie, chcąc tym zaspokoić wasze żądze."
"Jk4,4": "Cudzołożnicy i cudzołożnice, czy nie wiecie, że przyjaźń ze światem jest nieprzyjaźnią z Bogiem? Jeśli więc ktoś chce być przyjacielem świata, staje się nieprzyjacielem Boga."
"Jk4,5": "Czy sądzicie, że na próżno Pismo mówi: Duch, który w nas mieszka, zazdrośnie pożąda?"
"Jk4,6": "Większą zaś daje łaskę, bo mówi: Bóg sprzeciwia się pysznym, a pokornym daje łaskę."
"Jk4,7": "Poddajcie się więc Bogu, przeciwstawcie się diabłu, a ucieknie od was."
"Jk4,8": "Zbliżcie się do Boga, a on zbliży się do was. Obmyjcie ręce, grzesznicy, i oczyśćcie serca, ludzie umysłu dwoistego."
"Jk4,9": "Ubolewajcie, smućcie się i płaczcie. Wasz śmiech niech się obróci w smutek, a radość w przygnębienie."
"Jk4,10": "Uniżcie się przed Panem, a on was wywyższy."
"Jk4,11": "Nie obmawiajcie jedni drugich, bracia. Kto obmawia brata i osądza brata, obmawia prawo i osądza prawo. Jeśli zaś osądzasz prawo, nie jesteś wykonawcą prawa, lecz sędzią."
"Jk4,12": "Jeden jest prawodawca, który ma moc zbawić i zatracić. A ty kim jesteś, że osądzasz drugiego?"
"Jk4,13": "A teraz wy, którzy mówicie: Dziś albo jutro udamy się do tego miasta i zatrzymamy się tam przez rok, będziemy handlować i osiągniemy zyski;"
"Jk4,14": "Wy, którzy nie wiecie, co jutro będzie. Bo czymże jest wasze życie? Doprawdy jest parą, która pojawia się na krótko, a potem znika."
"Jk4,15": "Zamiast tego powinniście mówić: Jeżeli Pan zechce i będziemy żyli, zrobimy to lub owo."
"Jk4,16": "Teraz zaś przechwalacie się w waszej pysze. Wszelkie takie przechwalanie się jest złe."
"Jk4,17": "Kto więc umie dobrze czynić, a nie czyni, popełnia grzech."
