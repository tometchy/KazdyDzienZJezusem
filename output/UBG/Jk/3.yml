"Jk3,1": "Niech niewielu z was zostaje nauczycielami, moi bracia, gdyż wiecie, że czeka nas surowszy sąd."
"Jk3,2": "Wszyscy bowiem w wielu sprawach upadamy. Jeśli ktoś nie upada w mowie, jest człowiekiem doskonałym, który też może utrzymać na wodzy całe ciało."
"Jk3,3": "Oto koniom wkładamy wędzidła do pysków, aby były nam posłuszne, i kierujemy całym ich ciałem."
"Jk3,4": "Podobnie i statki, choć są tak wielkie i pędzone gwałtownymi wichrami, jednak za pomocą niewielkiego steru są kierowane tam, dokąd chce sternik."
"Jk3,5": "Tak też język jest małym organem, lecz bardzo się przechwala. Jakże wielki las zapala mały ogień!"
"Jk3,6": "Język też jest ogniem i światem nieprawości. Język jest tak ułożony wśród naszych członków, że kala całe ciało i rozpala bieg życia, i jest zapalony przez ogień piekielny."
"Jk3,7": "Wszelki bowiem rodzaj dzikich zwierząt, ptaków, gadów i morskich stworzeń można ujarzmić i zostaje ujarzmiony przez człowieka."
"Jk3,8": "Natomiast nikt z ludzi nie może ujarzmić języka. Jest to nieokiełznane zło, pełne śmiercionośnego jadu."
"Jk3,9": "Nim błogosławimy Boga i Ojca i nim przeklinamy ludzi stworzonych na podobieństwo Boga."
"Jk3,10": "Z tych samych ust wychodzi błogosławieństwo i przekleństwo. Tak być nie powinno, moi bracia."
"Jk3,11": "Czy źródło z tej samej szczeliny tryska wodą słodką i gorzką?"
"Jk3,12": "Czy może, moi bracia, drzewo figowe rodzić oliwki albo winorośl figi? Tak też żadne źródło nie może wydać słonej i słodkiej wody."
"Jk3,13": "Kto wśród was jest mądry i rozumny? Niech pokaże dobrym postępowaniem swoje uczynki z łagodnością właściwą mądrości."
"Jk3,14": "Jeśli jednak macie w waszym sercu gorzką zazdrość i kłótliwość, to nie przechwalajcie się i nie kłamcie wbrew prawdzie."
"Jk3,15": "Nie jest to mądrość zstępująca z góry, lecz ziemska, zmysłowa, diabelska."
"Jk3,16": "Gdzie bowiem jest zazdrość i kłótliwość, tam też niepokój i wszelki zły czyn."
"Jk3,17": "Mądrość zaś, która jest z góry, jest przede wszystkim czysta, następnie pokojowo usposobiona, łagodna, ustępliwa, pełna miłosierdzia i dobrych owoców, bezstronna i nieobłudna."
"Jk3,18": "A owoc sprawiedliwości jest siany w pokoju przez tych, którzy czynią pokój."
