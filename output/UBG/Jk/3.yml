"Jk3,1":
  text: "Niech niewielu z was zostaje nauczycielami, moi bracia, gdyż wiecie, że czeka nas surowszy sąd."
  tags: []
"Jk3,2":
  text: "Wszyscy bowiem w wielu sprawach upadamy. Jeśli ktoś nie upada w mowie, jest człowiekiem doskonałym, który też może utrzymać na wodzy całe ciało."
  tags: []
"Jk3,3":
  text: "Oto koniom wkładamy wędzidła do pysków, aby były nam posłuszne, i kierujemy całym ich ciałem."
  tags: []
"Jk3,4":
  text: "Podobnie i statki, choć są tak wielkie i pędzone gwałtownymi wichrami, jednak za pomocą niewielkiego steru są kierowane tam, dokąd chce sternik."
  tags: []
"Jk3,5":
  text: "Tak też język jest małym organem, lecz bardzo się przechwala. Jakże wielki las zapala mały ogień!"
  tags: []
"Jk3,6":
  text: "Język też jest ogniem i światem nieprawości. Język jest tak ułożony wśród naszych członków, że kala całe ciało i rozpala bieg życia, i jest zapalony przez ogień piekielny."
  tags: []
"Jk3,7":
  text: "Wszelki bowiem rodzaj dzikich zwierząt, ptaków, gadów i morskich stworzeń można ujarzmić i zostaje ujarzmiony przez człowieka."
  tags: []
"Jk3,8":
  text: "Natomiast nikt z ludzi nie może ujarzmić języka. Jest to nieokiełznane zło, pełne śmiercionośnego jadu."
  tags: []
"Jk3,9":
  text: "Nim błogosławimy Boga i Ojca i nim przeklinamy ludzi stworzonych na podobieństwo Boga."
  tags: []
"Jk3,10":
  text: "Z tych samych ust wychodzi błogosławieństwo i przekleństwo. Tak być nie powinno, moi bracia."
  tags: []
"Jk3,11":
  text: "Czy źródło z tej samej szczeliny tryska wodą słodką i gorzką?"
  tags: []
"Jk3,12":
  text: "Czy może, moi bracia, drzewo figowe rodzić oliwki albo winorośl figi? Tak też żadne źródło nie może wydać słonej i słodkiej wody."
  tags: []
"Jk3,13":
  text: "Kto wśród was jest mądry i rozumny? Niech pokaże dobrym postępowaniem swoje uczynki z łagodnością właściwą mądrości."
  tags: []
"Jk3,14":
  text: "Jeśli jednak macie w waszym sercu gorzką zazdrość i kłótliwość, to nie przechwalajcie się i nie kłamcie wbrew prawdzie."
  tags: []
"Jk3,15":
  text: "Nie jest to mądrość zstępująca z góry, lecz ziemska, zmysłowa, diabelska."
  tags: []
"Jk3,16":
  text: "Gdzie bowiem jest zazdrość i kłótliwość, tam też niepokój i wszelki zły czyn."
  tags: []
"Jk3,17":
  text: "Mądrość zaś, która jest z góry, jest przede wszystkim czysta, następnie pokojowo usposobiona, łagodna, ustępliwa, pełna miłosierdzia i dobrych owoców, bezstronna i nieobłudna."
  tags: []
"Jk3,18":
  text: "A owoc sprawiedliwości jest siany w pokoju przez tych, którzy czynią pokój."
  tags: []
