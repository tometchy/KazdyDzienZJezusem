"3J1,1":
  text: "Starszy do umiłowanego Gajusa, którego miłuję w prawdzie."
  tags: []
"3J1,2":
  text: "Umiłowany, pragnę przede wszystkim, aby ci się dobrze powodziło i abyś był zdrowy, tak jak dobrze się powodzi twojej duszy."
  tags: []
"3J1,3":
  text: "Uradowałem się bowiem bardzo, gdy przyszli bracia i dali świadectwo o prawdzie w tobie, jak postępujesz w prawdzie."
  tags: []
"3J1,4":
  text: "Nie ma dla mnie większej radości od tej, gdy słyszę, że moje dzieci postępują w prawdzie."
  tags: []
"3J1,5":
  text: "Umiłowany, wiernie wykonujesz wszystko, co robisz dla braci oraz dla obcych."
  tags: []
"3J1,6":
  text: "Dali oni świadectwo przed kościołem o twojej miłości. Dobrze też zrobisz, jeśli ich wyprawisz, jak przystoi przed Bogiem."
  tags: []
"3J1,7":
  text: "Wyruszyli bowiem dla jego imienia, nie biorąc niczego od pogan."
  tags: []
"3J1,8":
  text: "Powinniśmy więc takich przyjmować, abyśmy się stali współpracownikami dla prawdy."
  tags: []
"3J1,9":
  text: "Napisałem do kościoła, lecz Diotrefes, który chce być pierwszym wśród nich, nie przyjmuje nas."
  tags: []
"3J1,10":
  text: "Dlatego, jeśli przybędę, przypomnę jego uczynki, których się dopuszcza, gdy nas obmawia złośliwymi słowami. A nie poprzestając na tym, sam braci nie przyjmuje, a nawet zabrania tym, którzy chcą ich przyjąć, i wyrzuca ich z kościoła."
  tags: []
"3J1,11":
  text: "Umiłowany, nie naśladuj tego, co złe, lecz to, co dobre. Kto czyni dobrze, jest z Boga, kto zaś czyni źle, nie widział Boga."
  tags: []
"3J1,12":
  text: "Demetriuszowi wystawili dobre świadectwo wszyscy, nawet sama prawda. My również dajemy o nim świadectwo, a wiecie, że nasze świadectwo jest prawdziwe."
  tags: []
"3J1,13":
  text: "Wiele miałem do napisania, ale nie chcę posługiwać się atramentem i piórem."
  tags: []
"3J1,14":
  text: "Mam bowiem nadzieję, że zobaczę cię wkrótce, a wtedy porozmawiamy osobiście. Pokój tobie. Pozdrawiają cię przyjaciele. Ty też pozdrów przyjaciół imiennie."
  tags: []
