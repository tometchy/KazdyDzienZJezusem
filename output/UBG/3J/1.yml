"3J1,1": "Starszy do umiłowanego Gajusa, którego miłuję w prawdzie."
"3J1,2": "Umiłowany, pragnę przede wszystkim, aby ci się dobrze powodziło i abyś był zdrowy, tak jak dobrze się powodzi twojej duszy."
"3J1,3": "Uradowałem się bowiem bardzo, gdy przyszli bracia i dali świadectwo o prawdzie w tobie, jak postępujesz w prawdzie."
"3J1,4": "Nie ma dla mnie większej radości od tej, gdy słyszę, że moje dzieci postępują w prawdzie."
"3J1,5": "Umiłowany, wiernie wykonujesz wszystko, co robisz dla braci oraz dla obcych."
"3J1,6": "Dali oni świadectwo przed kościołem o twojej miłości. Dobrze też zrobisz, jeśli ich wyprawisz, jak przystoi przed Bogiem."
"3J1,7": "Wyruszyli bowiem dla jego imienia, nie biorąc niczego od pogan."
"3J1,8": "Powinniśmy więc takich przyjmować, abyśmy się stali współpracownikami dla prawdy."
"3J1,9": "Napisałem do kościoła, lecz Diotrefes, który chce być pierwszym wśród nich, nie przyjmuje nas."
"3J1,10": "Dlatego, jeśli przybędę, przypomnę jego uczynki, których się dopuszcza, gdy nas obmawia złośliwymi słowami. A nie poprzestając na tym, sam braci nie przyjmuje, a nawet zabrania tym, którzy chcą ich przyjąć, i wyrzuca ich z kościoła."
"3J1,11": "Umiłowany, nie naśladuj tego, co złe, lecz to, co dobre. Kto czyni dobrze, jest z Boga, kto zaś czyni źle, nie widział Boga."
"3J1,12": "Demetriuszowi wystawili dobre świadectwo wszyscy, nawet sama prawda. My również dajemy o nim świadectwo, a wiecie, że nasze świadectwo jest prawdziwe."
"3J1,13": "Wiele miałem do napisania, ale nie chcę posługiwać się atramentem i piórem."
"3J1,14": "Mam bowiem nadzieję, że zobaczę cię wkrótce, a wtedy porozmawiamy osobiście. Pokój tobie. Pozdrawiają cię przyjaciele. Ty też pozdrów przyjaciół imiennie."
