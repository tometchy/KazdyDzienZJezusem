"Hi31,1":
  text: "Zawarłem przymierze ze swoimi oczami; jak mógłbym więc myśleć o pannie?"
  tags: []
"Hi31,2":
  text: "Jaki bowiem byłby dział od Boga z góry? I jakie byłoby dziedzictwo od Wszechmocnego z wysoka?"
  tags: []
"Hi31,3":
  text: "Czy zatracenie nie jest przygotowane dla niegodziwych i sroga pomsta dla czyniących nieprawość?"
  tags: []
"Hi31,4":
  text: "Czyż on nie widzi moich dróg i nie liczy wszystkich moich kroków?"
  tags: []
"Hi31,5":
  text: "Jeśli postępowałem kłamliwie, jeśli moja noga spieszyła się do oszustwa;"
  tags: []
"Hi31,6":
  text: "To niech zważy mnie na wadze sprawiedliwej i niech Bóg pozna moją prawość."
  tags: []
"Hi31,7":
  text: "Jeśli moja noga zboczyła z drogi i moje serce poszło za moimi oczami, i jeśli jakaś zmaza przylgnęła do moich rąk;"
  tags: []
"Hi31,8":
  text: "Wtedy niech ja sieję, a inny spożywa, niech moje latorośle będą wykorzenione."
  tags: []
"Hi31,9":
  text: "Jeśli moje serce uwiodła kobieta i jeśli czyhałem pod drzwiami swego bliźniego;"
  tags: []
"Hi31,10":
  text: "To niech moja żona mieli innemu i niech inni się nad nią schylają."
  tags: []
"Hi31,11":
  text: "Jest to bowiem haniebny czyn, karygodna nieprawość;"
  tags: []
"Hi31,12":
  text: "To jest ogień, który pożera aż do zatracenia i może wykorzenić cały mój dobytek."
  tags: []
"Hi31,13":
  text: "Jeśli zlekceważyłem sprawę swojego sługi albo swojej służącej, gdy wiedli spór ze mną;"
  tags: []
"Hi31,14":
  text: "Co zrobię, gdy Bóg powstanie? Gdy mnie nawiedzi, co mu odpowiem?"
  tags: []
"Hi31,15":
  text: "Czy ten, który mnie stworzył w łonie, nie stworzył też jego? Czy nie on jeden ukształtował nas w łonie?"
  tags: []
"Hi31,16":
  text: "Jeśli odmówiłem prośbie ubogich i jeśli zasmuciłem oczy wdowy;"
  tags: []
"Hi31,17":
  text: "Jeśli sam jadłem swoją kromkę i nie jadła z niej sierota;"
  tags: []
"Hi31,18":
  text: "(Od swojej młodości bowiem wychowywałem ją jak ojciec, a od łona swojej matki prowadziłem wdowę);"
  tags: []
"Hi31,19":
  text: "Jeśli widziałem ginącego z powodu braku ubrania albo biedaka bez okrycia;"
  tags: []
"Hi31,20":
  text: "Jeśli jego biodra nie błogosławiły mi dlatego, że się zagrzał wełną moich owiec;"
  tags: []
"Hi31,21":
  text: "Jeśli podniosłem rękę przeciwko sierocie, gdy widziałem w bramie swoją pomoc;"
  tags: []
"Hi31,22":
  text: "Wtedy niech odpadnie mój bark od karku, a niech moje ramię wyjdzie ze stawu."
  tags: []
"Hi31,23":
  text: "Bałem się bowiem klęski od Boga, a przed jego majestatem nie mógłbym się ostać."
  tags: []
"Hi31,24":
  text: "Jeśli pokładałem w złocie swoją nadzieję, a do czystego złota mówiłem: Ty jesteś moją ufnością;"
  tags: []
"Hi31,25":
  text: "Jeśli radowałem się ze swojego wielkiego bogactwa i tego, że moja ręka nabyła wiele;"
  tags: []
"Hi31,26":
  text: "Jeśli patrzyłem na słońce, gdy świeciło, i na księżyc, gdy sunął wspaniale;"
  tags: []
"Hi31,27":
  text: "A moje serce dało się uwieść potajemnie i moje usta całowały moją rękę;"
  tags: []
"Hi31,28":
  text: "I to byłaby nieprawość karygodna, bo zaparłbym się Boga z wysoka."
  tags: []
"Hi31,29":
  text: "Jeśli cieszyłem się z upadku tego, który mnie nienawidzi, jeśli wyniosłem się, gdy mu się źle wiodło;"
  tags: []
"Hi31,30":
  text: "(Nawet nie pozwoliłem zgrzeszyć swoim ustom, pragnąc przekleństwa na jego duszy);"
  tags: []
"Hi31,31":
  text: "Czy ludzie z mojego namiotu nie mówili: Obyśmy mieli z jego mięsa! Nie możemy się najeść."
  tags: []
"Hi31,32":
  text: "Obcy nie nocował na dworze, swoje drzwi otwierałem podróżnemu."
  tags: []
"Hi31,33":
  text: "Jeśli ukrywałem swoje przestępstwa jak Adam i chowałem w zanadrzu swoją nieprawość;"
  tags: []
"Hi31,34":
  text: "Czy strach przed wielką zgrają albo pogarda bliskich przeraziły mnie, abym milczał i nie wychodził za drzwi?"
  tags: []
"Hi31,35":
  text: "Obym miał kogoś, kto by mnie wysłuchał! Oto moja prośba, aby Wszechmogący odpowiedział mi i aby mój wróg napisał księgę."
  tags: []
"Hi31,36":
  text: "Czy nie nosiłbym jej na swoim ramieniu i nie przywiązałbym jej sobie jak koronę?"
  tags: []
"Hi31,37":
  text: "Oznajmiłbym mu liczbę swoich kroków; zbliżyłbym się do niego jak książę."
  tags: []
"Hi31,38":
  text: "Jeśli moja ziemia wołała przeciwko mnie, jeśli razem z nią płakały jej bruzdy;"
  tags: []
"Hi31,39":
  text: "Jeśli spożywałem z jej plonów bez zapłaty, jeśli jej właścicieli pozbawiłem życia;"
  tags: []
"Hi31,40":
  text: "Niech rosną ciernie zamiast pszenicy i sam kąkol zamiast jęczmienia. Skończyły się słowa Hioba."
  tags: []
