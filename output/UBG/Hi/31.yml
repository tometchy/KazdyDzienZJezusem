"Hi31,1": "Zawarłem przymierze ze swoimi oczami; jak mógłbym więc myśleć o pannie?"
"Hi31,2": "Jaki bowiem byłby dział od Boga z góry? I jakie byłoby dziedzictwo od Wszechmocnego z wysoka?"
"Hi31,3": "Czy zatracenie nie jest przygotowane dla niegodziwych i sroga pomsta dla czyniących nieprawość?"
"Hi31,4": "Czyż on nie widzi moich dróg i nie liczy wszystkich moich kroków?"
"Hi31,5": "Jeśli postępowałem kłamliwie, jeśli moja noga spieszyła się do oszustwa;"
"Hi31,6": "To niech zważy mnie na wadze sprawiedliwej i niech Bóg pozna moją prawość."
"Hi31,7": "Jeśli moja noga zboczyła z drogi i moje serce poszło za moimi oczami, i jeśli jakaś zmaza przylgnęła do moich rąk;"
"Hi31,8": "Wtedy niech ja sieję, a inny spożywa, niech moje latorośle będą wykorzenione."
"Hi31,9": "Jeśli moje serce uwiodła kobieta i jeśli czyhałem pod drzwiami swego bliźniego;"
"Hi31,10": "To niech moja żona mieli innemu i niech inni się nad nią schylają."
"Hi31,11": "Jest to bowiem haniebny czyn, karygodna nieprawość;"
"Hi31,12": "To jest ogień, który pożera aż do zatracenia i może wykorzenić cały mój dobytek."
"Hi31,13": "Jeśli zlekceważyłem sprawę swojego sługi albo swojej służącej, gdy wiedli spór ze mną;"
"Hi31,14": "Co zrobię, gdy Bóg powstanie? Gdy mnie nawiedzi, co mu odpowiem?"
"Hi31,15": "Czy ten, który mnie stworzył w łonie, nie stworzył też jego? Czy nie on jeden ukształtował nas w łonie?"
"Hi31,16": "Jeśli odmówiłem prośbie ubogich i jeśli zasmuciłem oczy wdowy;"
"Hi31,17": "Jeśli sam jadłem swoją kromkę i nie jadła z niej sierota;"
"Hi31,18": "(Od swojej młodości bowiem wychowywałem ją jak ojciec, a od łona swojej matki prowadziłem wdowę);"
"Hi31,19": "Jeśli widziałem ginącego z powodu braku ubrania albo biedaka bez okrycia;"
"Hi31,20": "Jeśli jego biodra nie błogosławiły mi dlatego, że się zagrzał wełną moich owiec;"
"Hi31,21": "Jeśli podniosłem rękę przeciwko sierocie, gdy widziałem w bramie swoją pomoc;"
"Hi31,22": "Wtedy niech odpadnie mój bark od karku, a niech moje ramię wyjdzie ze stawu."
"Hi31,23": "Bałem się bowiem klęski od Boga, a przed jego majestatem nie mógłbym się ostać."
"Hi31,24": "Jeśli pokładałem w złocie swoją nadzieję, a do czystego złota mówiłem: Ty jesteś moją ufnością;"
"Hi31,25": "Jeśli radowałem się ze swojego wielkiego bogactwa i tego, że moja ręka nabyła wiele;"
"Hi31,26": "Jeśli patrzyłem na słońce, gdy świeciło, i na księżyc, gdy sunął wspaniale;"
"Hi31,27": "A moje serce dało się uwieść potajemnie i moje usta całowały moją rękę;"
"Hi31,28": "I to byłaby nieprawość karygodna, bo zaparłbym się Boga z wysoka."
"Hi31,29": "Jeśli cieszyłem się z upadku tego, który mnie nienawidzi, jeśli wyniosłem się, gdy mu się źle wiodło;"
"Hi31,30": "(Nawet nie pozwoliłem zgrzeszyć swoim ustom, pragnąc przekleństwa na jego duszy);"
"Hi31,31": "Czy ludzie z mojego namiotu nie mówili: Obyśmy mieli z jego mięsa! Nie możemy się najeść."
"Hi31,32": "Obcy nie nocował na dworze, swoje drzwi otwierałem podróżnemu."
"Hi31,33": "Jeśli ukrywałem swoje przestępstwa jak Adam i chowałem w zanadrzu swoją nieprawość;"
"Hi31,34": "Czy strach przed wielką zgrają albo pogarda bliskich przeraziły mnie, abym milczał i nie wychodził za drzwi?"
"Hi31,35": "Obym miał kogoś, kto by mnie wysłuchał! Oto moja prośba, aby Wszechmogący odpowiedział mi i aby mój wróg napisał księgę."
"Hi31,36": "Czy nie nosiłbym jej na swoim ramieniu i nie przywiązałbym jej sobie jak koronę?"
"Hi31,37": "Oznajmiłbym mu liczbę swoich kroków; zbliżyłbym się do niego jak książę."
"Hi31,38": "Jeśli moja ziemia wołała przeciwko mnie, jeśli razem z nią płakały jej bruzdy;"
"Hi31,39": "Jeśli spożywałem z jej plonów bez zapłaty, jeśli jej właścicieli pozbawiłem życia;"
"Hi31,40": "Niech rosną ciernie zamiast pszenicy i sam kąkol zamiast jęczmienia. Skończyły się słowa Hioba."
