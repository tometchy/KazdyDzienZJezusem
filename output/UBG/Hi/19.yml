"Hi19,1": "Wtedy Hiob odpowiedział:"
"Hi19,2": "Jak długo będziecie dręczyć moją duszę i miażdżyć mnie słowami?"
"Hi19,3": "Już dziesięć razy znieważyliście mnie. Nie wstyd wam, że tak się znęcacie nade mną?"
"Hi19,4": "A niech tak będzie, że zbłądziłem, błąd zostaje po mojej stronie."
"Hi19,5": "A jeśli rzeczywiście chcecie się wynosić nade mną i dowodzić mi mojej hańby;"
"Hi19,6": "Wiedzcie, że to Bóg mnie powalił i swoją siecią mnie otoczył."
"Hi19,7": "Oto wołam o krzywdę, ale nikt nie słucha; krzyczę, ale nie ma sądu."
"Hi19,8": "Zagrodził mi drogę, abym nie mógł przejść, i na moich ścieżkach rozpostarł ciemność."
"Hi19,9": "Odarł mnie z mojej chwały i zdjął koronę z mojej głowy."
"Hi19,10": "Zniszczył mnie ze wszystkich stron i ginę; moją nadzieję wyrwał jak drzewo."
"Hi19,11": "Zapłonął przeciwko mnie swoim gniewem i uważa mnie za swego wroga."
"Hi19,12": "Przyszły razem jego oddziały, utorowały przeciw mnie swoją drogę i rozbiły obóz dokoła mojego namiotu."
"Hi19,13": "Moich braci oddalił ode mnie, a moi znajomi ode mnie stronią."
"Hi19,14": "Opuścili mnie moi bliscy, a moi przyjaciele o mnie zapomnieli."
"Hi19,15": "Przebywający w moim domu i moje służące uważają mnie za obcego. Stałem się cudzoziemcem w ich oczach."
"Hi19,16": "Wołałem na swego sługę, ale on się nie odzywa, chociaż go błagam swoimi ustami."
"Hi19,17": "Moim oddechem brzydzi się moja żona, choć błagam ze względu na synów z mojego ciała."
"Hi19,18": "Nawet małe dzieci mną gardzą; gdy powstaję, urągają mi."
"Hi19,19": "Brzydzą się mną wszyscy moi najbliżsi; ci, których kocham, stanęli przeciw mnie."
"Hi19,20": "Moje kości przylgnęły do mojej skóry i do mego ciała; pozostała tylko skóra wokół zębów."
"Hi19,21": "Zlitujcie się nade mną, zlitujcie się nade mną, moi przyjaciele, bo ręka Boża mnie dotknęła."
"Hi19,22": "Czemu mnie prześladujecie jak Bóg? Czy nie dość wam mojego ciała?"
"Hi19,23": "Oby teraz zostały zapisane moje słowa! Oby je w księdze utrwalono!"
"Hi19,24": "Oby rylcem z żelaza i ołowiem zostały na wieczną pamiątkę wyryte na skale!"
"Hi19,25": "Wiem bowiem, że mój Odkupiciel żyje i że w ostateczny dzień stanie na ziemi."
"Hi19,26": "A choć moja skóra się rozłoży, to w swoim ciele ujrzę Boga."
"Hi19,27": "Ujrzę go ja sam, ujrzą go moje oczy, a nie kto inny, choć moje nerki zniszczały w moim wnętrzu."
"Hi19,28": "Powinniście mówić: Czemu go prześladujemy? Gdyż we mnie znajduje się korzeń sprawy."
"Hi19,29": "Wy sami lękajcie się miecza, bo gniew za nieprawość sprowadza miecz, abyście wiedzieli, że jest sąd."
