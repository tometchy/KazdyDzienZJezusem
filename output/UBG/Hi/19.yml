"Hi19,1":
  text: "Wtedy Hiob odpowiedział:"
  tags: []
"Hi19,2":
  text: "Jak długo będziecie dręczyć moją duszę i miażdżyć mnie słowami?"
  tags: []
"Hi19,3":
  text: "Już dziesięć razy znieważyliście mnie. Nie wstyd wam, że tak się znęcacie nade mną?"
  tags: []
"Hi19,4":
  text: "A niech tak będzie, że zbłądziłem, błąd zostaje po mojej stronie."
  tags: []
"Hi19,5":
  text: "A jeśli rzeczywiście chcecie się wynosić nade mną i dowodzić mi mojej hańby;"
  tags: []
"Hi19,6":
  text: "Wiedzcie, że to Bóg mnie powalił i swoją siecią mnie otoczył."
  tags: []
"Hi19,7":
  text: "Oto wołam o krzywdę, ale nikt nie słucha; krzyczę, ale nie ma sądu."
  tags: []
"Hi19,8":
  text: "Zagrodził mi drogę, abym nie mógł przejść, i na moich ścieżkach rozpostarł ciemność."
  tags: []
"Hi19,9":
  text: "Odarł mnie z mojej chwały i zdjął koronę z mojej głowy."
  tags: []
"Hi19,10":
  text: "Zniszczył mnie ze wszystkich stron i ginę; moją nadzieję wyrwał jak drzewo."
  tags: []
"Hi19,11":
  text: "Zapłonął przeciwko mnie swoim gniewem i uważa mnie za swego wroga."
  tags: []
"Hi19,12":
  text: "Przyszły razem jego oddziały, utorowały przeciw mnie swoją drogę i rozbiły obóz dokoła mojego namiotu."
  tags: []
"Hi19,13":
  text: "Moich braci oddalił ode mnie, a moi znajomi ode mnie stronią."
  tags: []
"Hi19,14":
  text: "Opuścili mnie moi bliscy, a moi przyjaciele o mnie zapomnieli."
  tags: []
"Hi19,15":
  text: "Przebywający w moim domu i moje służące uważają mnie za obcego. Stałem się cudzoziemcem w ich oczach."
  tags: []
"Hi19,16":
  text: "Wołałem na swego sługę, ale on się nie odzywa, chociaż go błagam swoimi ustami."
  tags: []
"Hi19,17":
  text: "Moim oddechem brzydzi się moja żona, choć błagam ze względu na synów z mojego ciała."
  tags: []
"Hi19,18":
  text: "Nawet małe dzieci mną gardzą; gdy powstaję, urągają mi."
  tags: []
"Hi19,19":
  text: "Brzydzą się mną wszyscy moi najbliżsi; ci, których kocham, stanęli przeciw mnie."
  tags: []
"Hi19,20":
  text: "Moje kości przylgnęły do mojej skóry i do mego ciała; pozostała tylko skóra wokół zębów."
  tags: []
"Hi19,21":
  text: "Zlitujcie się nade mną, zlitujcie się nade mną, moi przyjaciele, bo ręka Boża mnie dotknęła."
  tags: []
"Hi19,22":
  text: "Czemu mnie prześladujecie jak Bóg? Czy nie dość wam mojego ciała?"
  tags: []
"Hi19,23":
  text: "Oby teraz zostały zapisane moje słowa! Oby je w księdze utrwalono!"
  tags: []
"Hi19,24":
  text: "Oby rylcem z żelaza i ołowiem zostały na wieczną pamiątkę wyryte na skale!"
  tags: []
"Hi19,25":
  text: "Wiem bowiem, że mój Odkupiciel żyje i że w ostateczny dzień stanie na ziemi."
  tags: []
"Hi19,26":
  text: "A choć moja skóra się rozłoży, to w swoim ciele ujrzę Boga."
  tags: []
"Hi19,27":
  text: "Ujrzę go ja sam, ujrzą go moje oczy, a nie kto inny, choć moje nerki zniszczały w moim wnętrzu."
  tags: []
"Hi19,28":
  text: "Powinniście mówić: Czemu go prześladujemy? Gdyż we mnie znajduje się korzeń sprawy."
  tags: []
"Hi19,29":
  text: "Wy sami lękajcie się miecza, bo gniew za nieprawość sprowadza miecz, abyście wiedzieli, że jest sąd."
  tags: []
