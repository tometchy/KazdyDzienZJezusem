"Hi40,1":
  text: "PAN mówił dalej do Hioba:"
  tags: []
"Hi40,2":
  text: "Czy ten, co wiedzie spór z Wszechmogącym, będzie go pouczał? Niech na to odpowie ten, który strofuje Boga."
  tags: []
"Hi40,3":
  text: "Wtedy Hiob odpowiedział PANU:"
  tags: []
"Hi40,4":
  text: "Oto jestem nędzny, cóż ci odpowiem? Przyłożę swoją rękę do ust."
  tags: []
"Hi40,5":
  text: "Raz mówiłem i drugi, ale więcej nie odpowiem, niczego więcej nie dodam."
  tags: []
"Hi40,6":
  text: "Nadto PAN odpowiedział Hiobowi spośród wichru:"
  tags: []
"Hi40,7":
  text: "Przepasz teraz swe biodra jak mężczyzna: będę cię pytał, a ty mnie pouczysz."
  tags: []
"Hi40,8":
  text: "Czy chcesz wniwecz obrócić mój sąd? Czy potępisz mnie, aby usprawiedliwić samego siebie?"
  tags: []
"Hi40,9":
  text: "Czy masz ramię jak Bóg? Czy zagrzmisz głosem jak on?"
  tags: []
"Hi40,10":
  text: "Ozdób się teraz w majestat i dostojeństwo, przyoblecz się w chwałę i piękno."
  tags: []
"Hi40,11":
  text: "Rozlej swój gwałtowny gniew, spójrz na każdego pysznego i poniż go."
  tags: []
"Hi40,12":
  text: "Spójrz na każdego pysznego i upokórz go, zdepcz niegodziwych na ich miejscu."
  tags: []
"Hi40,13":
  text: "Zakryj ich razem w prochu, zamknij w ukryciu ich oblicza."
  tags: []
"Hi40,14":
  text: "Wtedy i ja ci wyznam, że twoja prawica może cię wybawić."
  tags: []
"Hi40,15":
  text: "Oto behemot, którego stworzyłem wraz z tobą; je trawę jak wół."
  tags: []
"Hi40,16":
  text: "Oto jego siła jest w jego biodrach, a jego moc w pępku jego brzucha."
  tags: []
"Hi40,17":
  text: "Rusza swoim ogonem jak cedrem, ścięgna jego bioder są splecione."
  tags: []
"Hi40,18":
  text: "Jego kości jak rury spiżowe; jego kości jak drągi żelazne."
  tags: []
"Hi40,19":
  text: "On jest przednim dziełem Boga. Ten, który go uczynił, sam może na niego natrzeć swoim mieczem."
  tags: []
"Hi40,20":
  text: "Żywność dostarczają mu góry, gdzie wszystkie polne zwierzęta hasają."
  tags: []
"Hi40,21":
  text: "Leży pod cienistymi drzewami, w ukryciu trzcin i bagien."
  tags: []
"Hi40,22":
  text: "Drzewa cieniste osłaniają go cieniem, wierzby potoku otaczają go."
  tags: []
"Hi40,23":
  text: "Oto wypija rzekę i nie spieszy się, będąc pewny, że może wchłonąć Jordan do swojej paszczy."
  tags: []
"Hi40,24":
  text: "Czy można go złapać za oczy albo powrozy przeciągnąć mu przez nozdrza?"
  tags: []
