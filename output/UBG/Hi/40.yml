"Hi40,1": "PAN mówił dalej do Hioba:"
"Hi40,2": "Czy ten, co wiedzie spór z Wszechmogącym, będzie go pouczał? Niech na to odpowie ten, który strofuje Boga."
"Hi40,3": "Wtedy Hiob odpowiedział PANU:"
"Hi40,4": "Oto jestem nędzny, cóż ci odpowiem? Przyłożę swoją rękę do ust."
"Hi40,5": "Raz mówiłem i drugi, ale więcej nie odpowiem, niczego więcej nie dodam."
"Hi40,6": "Nadto PAN odpowiedział Hiobowi spośród wichru:"
"Hi40,7": "Przepasz teraz swe biodra jak mężczyzna: będę cię pytał, a ty mnie pouczysz."
"Hi40,8": "Czy chcesz wniwecz obrócić mój sąd? Czy potępisz mnie, aby usprawiedliwić samego siebie?"
"Hi40,9": "Czy masz ramię jak Bóg? Czy zagrzmisz głosem jak on?"
"Hi40,10": "Ozdób się teraz w majestat i dostojeństwo, przyoblecz się w chwałę i piękno."
"Hi40,11": "Rozlej swój gwałtowny gniew, spójrz na każdego pysznego i poniż go."
"Hi40,12": "Spójrz na każdego pysznego i upokórz go, zdepcz niegodziwych na ich miejscu."
"Hi40,13": "Zakryj ich razem w prochu, zamknij w ukryciu ich oblicza."
"Hi40,14": "Wtedy i ja ci wyznam, że twoja prawica może cię wybawić."
"Hi40,15": "Oto behemot, którego stworzyłem wraz z tobą; je trawę jak wół."
"Hi40,16": "Oto jego siła jest w jego biodrach, a jego moc w pępku jego brzucha."
"Hi40,17": "Rusza swoim ogonem jak cedrem, ścięgna jego bioder są splecione."
"Hi40,18": "Jego kości jak rury spiżowe; jego kości jak drągi żelazne."
"Hi40,19": "On jest przednim dziełem Boga. Ten, który go uczynił, sam może na niego natrzeć swoim mieczem."
"Hi40,20": "Żywność dostarczają mu góry, gdzie wszystkie polne zwierzęta hasają."
"Hi40,21": "Leży pod cienistymi drzewami, w ukryciu trzcin i bagien."
"Hi40,22": "Drzewa cieniste osłaniają go cieniem, wierzby potoku otaczają go."
"Hi40,23": "Oto wypija rzekę i nie spieszy się, będąc pewny, że może wchłonąć Jordan do swojej paszczy."
"Hi40,24": "Czy można go złapać za oczy albo powrozy przeciągnąć mu przez nozdrza?"
