"Hi6,1": "Hiob zaś odpowiedział tymi słowami:"
"Hi6,2": "O gdyby dokładnie zważono moją udrękę i włożono na szalę całe moje nieszczęście!"
"Hi6,3": "Byłoby to cięższe niż piasek morski. Dlatego moje słowa plączą się."
"Hi6,4": "Tkwią we mnie bowiem strzały Wszechmocnego, których jad osuszył mego ducha, a strachy Boże walczą przeciwko mnie."
"Hi6,5": "Czy dziki osioł ryczy, gdy ma trawę? Czy wół ryczy nad swoją paszą?"
"Hi6,6": "Czy można zjeść niesmaczną rzecz bez soli? Czy ma jakiś smak białko jajka?"
"Hi6,7": "Czego się przedtem moja dusza nie chciała dotknąć, jest to teraz moim bolesnym pokarmem."
"Hi6,8": "Oby się spełniła moja prośba i Bóg dał mi to, czego pragnę!"
"Hi6,9": "Oby się Bogu spodobało to, aby mnie zniszczyć, aby opuścić rękę i mnie odciąć!"
"Hi6,10": "Wtedy miałbym jeszcze pociechę – chociaż pałam boleścią, niech Bóg mi nie folguje – nie zataiłem bowiem słów Świętego."
"Hi6,11": "Jaka jest moja siła, abym miał wytrwać? Jaki jest mój koniec, abym przedłużał swoje życie?"
"Hi6,12": "Czy moja siła jest siłą kamieni? Czy moje ciało jest ze spiżu?"
"Hi6,13": "Czy moja obrona nie jest we mnie? Czy mój rozsądek odszedł ode mnie?"
"Hi6,14": "Strapionemu należy się litość od przyjaciela, ale on opuścił bojaźń Wszechmogącego."
"Hi6,15": "Moi bracia zawiedli jak potok, odpływają jak gwałtowne potoki;"
"Hi6,16": "Które są mętne od lodu, w których śnieg się ukrywa;"
"Hi6,17": "W czasie roztopów znikają; w czasie upałów nikną ze swego miejsca."
"Hi6,18": "Wiją się ścieżki ich dróg; rozpływają się w nicość i giną."
"Hi6,19": "Podróżni z Temy wypatrywali ich; wędrowcy z Seby pokładali w nich nadzieję."
"Hi6,20": "Ale zawiedli się w oczekiwaniu, przyszli tam i zawstydzili się."
"Hi6,21": "Staliście się niczym; widzicie moją niedolę i lękacie się."
"Hi6,22": "Czy powiedziałem: Przynieście mi coś? lub: Dajcie mi z waszego majątku?"
"Hi6,23": "Lub: Wybawcie mnie z rąk wroga? lub: Wykupcie mnie z rąk okrutników?"
"Hi6,24": "Pouczcie mnie, a zamilknę; pokażcie mi, w czym zbłądziłem."
"Hi6,25": "O jak mocne są słowa prawdziwe! Ale cóż sprawi wasze obwinianie?"
"Hi6,26": "Czy zamierzacie ganić moje słowa i mowę zrozpaczonego, jakby były wiatrem?"
"Hi6,27": "Nawet sierotę przytłaczacie i kopiecie doły pod swoim przyjacielem."
"Hi6,28": "Teraz więc zechciejcie spojrzeć na mnie, a zobaczycie, czy kłamię wam w oczy."
"Hi6,29": "Zawróćcie, proszę, a niech nie będzie w was nieprawości; zawróćcie, a poznacie moją sprawiedliwość w tym."
"Hi6,30": "Czy w moim języku jest nieprawość? Czy moje podniebienie nie rozeznaje przewrotności?"
