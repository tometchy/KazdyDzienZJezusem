"Hi27,1":
  text: "Hiob ciągnął dalej swoją odpowiedź:"
  tags: []
"Hi27,2":
  text: "Jak żyje Bóg, który odrzucił mój sąd, i Wszechmocny, który rozgoryczył moją duszę;"
  tags: []
"Hi27,3":
  text: "Dopóki jest we mnie tchnienie i duch Boży w moich nozdrzach;"
  tags: []
"Hi27,4":
  text: "Moje wargi nie będą mówiły niegodziwości, a mój język nie wypowie fałszu."
  tags: []
"Hi27,5":
  text: "Nie daj Boże, abym miał was usprawiedliwiać; do śmierci nie odstąpię od swej niewinności."
  tags: []
"Hi27,6":
  text: "Będę trzymał się swojej sprawiedliwości i nie puszczę jej; moje serce nie oskarży mnie, póki żyję."
  tags: []
"Hi27,7":
  text: "Niech mój wróg będzie jak niegodziwiec, a ten, który powstaje przeciwko mnie, jak niesprawiedliwy."
  tags: []
"Hi27,8":
  text: "Jaka bowiem jest nadzieja obłudnika, choćby zysk osiągnął, gdy Bóg zabiera mu duszę?"
  tags: []
"Hi27,9":
  text: "Czy Bóg usłyszy jego wołanie, gdy spadnie na niego nieszczęście?"
  tags: []
"Hi27,10":
  text: "Czy będzie się rozkoszować Wszechmocnym? Czy będzie wciąż wzywał Boga?"
  tags: []
"Hi27,11":
  text: "Pouczę was, będąc w ręce Boga, nie zataję niczego o Wszechmocnym."
  tags: []
"Hi27,12":
  text: "Oto wy wszyscy to widzicie; po co więc te próżne słowa?"
  tags: []
"Hi27,13":
  text: "Taki jest dział niegodziwca u Boga i takie dziedzictwo, które otrzymają od Wszechmocnego ciemięzcy."
  tags: []
"Hi27,14":
  text: "Jeśli rozmnożą się jego synowie, pójdą pod miecz; a jego potomstwo nie nasyci się chlebem."
  tags: []
"Hi27,15":
  text: "Ci, którzy po nim pozostaną, będą pogrzebani w śmierci, a jego wdowy nie będą go opłakiwały;"
  tags: []
"Hi27,16":
  text: "Choćby nagromadził srebra jak prochu i przygotował sobie szat jak gliny;"
  tags: []
"Hi27,17":
  text: "To choć je przygotuje, włoży je sprawiedliwy, a niewinny będzie dzielić srebro."
  tags: []
"Hi27,18":
  text: "Zbuduje swój dom jak mól, jak szałas, który stawia stróż."
  tags: []
"Hi27,19":
  text: "Bogaty zaśnie, a nie będzie pogrzebany; otworzy oczy, ale już go nie ma."
  tags: []
"Hi27,20":
  text: "Ogarnie go strach jak wody, w nocy porwie go wicher."
  tags: []
"Hi27,21":
  text: "Uniesie go wiatr wschodni, a odejdzie; bo wicher wyrwie go z jego miejsca."
  tags: []
"Hi27,22":
  text: "To bowiem Bóg rzuci na niego i nie oszczędzi go, choć bardzo chciał uciekać przed jego ręką."
  tags: []
"Hi27,23":
  text: "Będą klaskać nad nim w dłonie i wygwizdywać go z jego miejsca."
  tags: []
