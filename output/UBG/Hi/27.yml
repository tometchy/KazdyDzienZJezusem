"Hi27,1": "Hiob ciągnął dalej swoją odpowiedź:"
"Hi27,2": "Jak żyje Bóg, który odrzucił mój sąd, i Wszechmocny, który rozgoryczył moją duszę;"
"Hi27,3": "Dopóki jest we mnie tchnienie i duch Boży w moich nozdrzach;"
"Hi27,4": "Moje wargi nie będą mówiły niegodziwości, a mój język nie wypowie fałszu."
"Hi27,5": "Nie daj Boże, abym miał was usprawiedliwiać; do śmierci nie odstąpię od swej niewinności."
"Hi27,6": "Będę trzymał się swojej sprawiedliwości i nie puszczę jej; moje serce nie oskarży mnie, póki żyję."
"Hi27,7": "Niech mój wróg będzie jak niegodziwiec, a ten, który powstaje przeciwko mnie, jak niesprawiedliwy."
"Hi27,8": "Jaka bowiem jest nadzieja obłudnika, choćby zysk osiągnął, gdy Bóg zabiera mu duszę?"
"Hi27,9": "Czy Bóg usłyszy jego wołanie, gdy spadnie na niego nieszczęście?"
"Hi27,10": "Czy będzie się rozkoszować Wszechmocnym? Czy będzie wciąż wzywał Boga?"
"Hi27,11": "Pouczę was, będąc w ręce Boga, nie zataję niczego o Wszechmocnym."
"Hi27,12": "Oto wy wszyscy to widzicie; po co więc te próżne słowa?"
"Hi27,13": "Taki jest dział niegodziwca u Boga i takie dziedzictwo, które otrzymają od Wszechmocnego ciemięzcy."
"Hi27,14": "Jeśli rozmnożą się jego synowie, pójdą pod miecz; a jego potomstwo nie nasyci się chlebem."
"Hi27,15": "Ci, którzy po nim pozostaną, będą pogrzebani w śmierci, a jego wdowy nie będą go opłakiwały;"
"Hi27,16": "Choćby nagromadził srebra jak prochu i przygotował sobie szat jak gliny;"
"Hi27,17": "To choć je przygotuje, włoży je sprawiedliwy, a niewinny będzie dzielić srebro."
"Hi27,18": "Zbuduje swój dom jak mól, jak szałas, który stawia stróż."
"Hi27,19": "Bogaty zaśnie, a nie będzie pogrzebany; otworzy oczy, ale już go nie ma."
"Hi27,20": "Ogarnie go strach jak wody, w nocy porwie go wicher."
"Hi27,21": "Uniesie go wiatr wschodni, a odejdzie; bo wicher wyrwie go z jego miejsca."
"Hi27,22": "To bowiem Bóg rzuci na niego i nie oszczędzi go, choć bardzo chciał uciekać przed jego ręką."
"Hi27,23": "Będą klaskać nad nim w dłonie i wygwizdywać go z jego miejsca."
