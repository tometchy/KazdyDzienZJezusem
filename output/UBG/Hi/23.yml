"Hi23,1": "Wtedy Hiob odpowiedział:"
"Hi23,2": "Również dziś moja skarga jest gorzka, choć moje nieszczęście jest cięższe niż moje jęki."
"Hi23,3": "O gdybym wiedział, gdzie mógłbym go znaleźć, udałbym się aż do jego tronu."
"Hi23,4": "Przedstawiłbym mu swoją sprawę, a moje usta napełniłbym dowodami;"
"Hi23,5": "Poznałbym słowa jego odpowiedzi i zrozumiałbym, co chce mi powiedzieć."
"Hi23,6": "Czy w swojej wielkiej mocy będzie się spierał ze mną? Nie, raczej sam doda mi siły."
"Hi23,7": "Tam człowiek prawy rozprawiałby z nim, a ja na zawsze byłbym wolny od mojego sędziego."
"Hi23,8": "Ale oto idę prosto, a jego nie ma; cofam się, a nie dostrzegam go."
"Hi23,9": "Idę w lewo, gdzie on działa, a nie oglądam go; idę na prawo, a nie widzę go."
"Hi23,10": "Gdyż on zna drogę, którą kroczę; kiedy mnie doświadczy, wyjdę jak złoto."
"Hi23,11": "Moja noga trzymała się jego śladu, przestrzegałem jego drogi i nie zbaczałem z niej."
"Hi23,12": "Od przykazania jego ust nie odchodziłem; ceniłem słowa jego ust bardziej niż mój własny pokarm."
"Hi23,13": "Lecz on jest niezmienny, któż go odwróci? Czego bowiem jego dusza zapragnie, to uczyni;"
"Hi23,14": "Bo on wykona, co postanowił o mnie; u niego jest wiele takich przykładów."
"Hi23,15": "Dlatego drżę przed jego obliczem; gdy to rozważam, lękam się go."
"Hi23,16": "Bóg osłabił moje serce, Wszechmocny mnie zatrwożył."
"Hi23,17": "O mało bowiem nie zginąłem od ciemności, nie zakrył mroku przed moim obliczem."
