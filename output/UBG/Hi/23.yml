"Hi23,1":
  text: "Wtedy Hiob odpowiedział:"
  tags: []
"Hi23,2":
  text: "Również dziś moja skarga jest gorzka, choć moje nieszczęście jest cięższe niż moje jęki."
  tags: []
"Hi23,3":
  text: "O gdybym wiedział, gdzie mógłbym go znaleźć, udałbym się aż do jego tronu."
  tags: []
"Hi23,4":
  text: "Przedstawiłbym mu swoją sprawę, a moje usta napełniłbym dowodami;"
  tags: []
"Hi23,5":
  text: "Poznałbym słowa jego odpowiedzi i zrozumiałbym, co chce mi powiedzieć."
  tags: []
"Hi23,6":
  text: "Czy w swojej wielkiej mocy będzie się spierał ze mną? Nie, raczej sam doda mi siły."
  tags: []
"Hi23,7":
  text: "Tam człowiek prawy rozprawiałby z nim, a ja na zawsze byłbym wolny od mojego sędziego."
  tags: []
"Hi23,8":
  text: "Ale oto idę prosto, a jego nie ma; cofam się, a nie dostrzegam go."
  tags: []
"Hi23,9":
  text: "Idę w lewo, gdzie on działa, a nie oglądam go; idę na prawo, a nie widzę go."
  tags: []
"Hi23,10":
  text: "Gdyż on zna drogę, którą kroczę; kiedy mnie doświadczy, wyjdę jak złoto."
  tags: []
"Hi23,11":
  text: "Moja noga trzymała się jego śladu, przestrzegałem jego drogi i nie zbaczałem z niej."
  tags: []
"Hi23,12":
  text: "Od przykazania jego ust nie odchodziłem; ceniłem słowa jego ust bardziej niż mój własny pokarm."
  tags: []
"Hi23,13":
  text: "Lecz on jest niezmienny, któż go odwróci? Czego bowiem jego dusza zapragnie, to uczyni;"
  tags: []
"Hi23,14":
  text: "Bo on wykona, co postanowił o mnie; u niego jest wiele takich przykładów."
  tags: []
"Hi23,15":
  text: "Dlatego drżę przed jego obliczem; gdy to rozważam, lękam się go."
  tags: []
"Hi23,16":
  text: "Bóg osłabił moje serce, Wszechmocny mnie zatrwożył."
  tags: []
"Hi23,17":
  text: "O mało bowiem nie zginąłem od ciemności, nie zakrył mroku przed moim obliczem."
  tags: []
