"Hi26,1": "A Hiob tak odpowiedział:"
"Hi26,2": "Jakże uratowałeś tego, który nie ma mocy? Jakże wybawiłeś ramię, które nie ma siły?"
"Hi26,3": "Jakże doradziłeś temu, który nie ma mądrości? Jakże dokładnie nauczyłeś tej sprawy?"
"Hi26,4": "Komu powiedziałeś te słowa? Czyj to duch wyszedł od ciebie?"
"Hi26,5": "Rzeczy martwe rodzą się pod wodami oraz ich mieszkańcy."
"Hi26,6": "Piekło jest odkryte przed nim i zatracenie nie ma przykrycia."
"Hi26,7": "Rozciągnął północ nad pustym miejscem i ziemię zawiesił na niczym."
"Hi26,8": "Zawiązuje wody w swoich obłokach, a obłok nie pęka pod nimi."
"Hi26,9": "Zatrzymuje widok swego tronu, rozciąga nad nim swój obłok."
"Hi26,10": "Wodom nakreślił granice, aż nastąpi koniec światłości i ciemności."
"Hi26,11": "Filary niebios trzęsą się i zdumiewają się jego gromem."
"Hi26,12": "Swoją mocą dzieli morze, a swoją roztropnością uśmierza jego nawałnicę."
"Hi26,13": "Swoim duchem przyozdobił niebiosa, a jego ręka stworzyła pokrzywionego węża."
"Hi26,14": "Oto tylko cząstka jego dróg, ale jakże mało o nim słyszymy! A kto pojmie grzmot jego wielkiej potęgi?"
