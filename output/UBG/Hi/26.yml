"Hi26,1":
  text: "A Hiob tak odpowiedział:"
  tags: []
"Hi26,2":
  text: "Jakże uratowałeś tego, który nie ma mocy? Jakże wybawiłeś ramię, które nie ma siły?"
  tags: []
"Hi26,3":
  text: "Jakże doradziłeś temu, który nie ma mądrości? Jakże dokładnie nauczyłeś tej sprawy?"
  tags: []
"Hi26,4":
  text: "Komu powiedziałeś te słowa? Czyj to duch wyszedł od ciebie?"
  tags: []
"Hi26,5":
  text: "Rzeczy martwe rodzą się pod wodami oraz ich mieszkańcy."
  tags: []
"Hi26,6":
  text: "Piekło jest odkryte przed nim i zatracenie nie ma przykrycia."
  tags: []
"Hi26,7":
  text: "Rozciągnął północ nad pustym miejscem i ziemię zawiesił na niczym."
  tags: []
"Hi26,8":
  text: "Zawiązuje wody w swoich obłokach, a obłok nie pęka pod nimi."
  tags: []
"Hi26,9":
  text: "Zatrzymuje widok swego tronu, rozciąga nad nim swój obłok."
  tags: []
"Hi26,10":
  text: "Wodom nakreślił granice, aż nastąpi koniec światłości i ciemności."
  tags: []
"Hi26,11":
  text: "Filary niebios trzęsą się i zdumiewają się jego gromem."
  tags: []
"Hi26,12":
  text: "Swoją mocą dzieli morze, a swoją roztropnością uśmierza jego nawałnicę."
  tags: []
"Hi26,13":
  text: "Swoim duchem przyozdobił niebiosa, a jego ręka stworzyła pokrzywionego węża."
  tags: []
"Hi26,14":
  text: "Oto tylko cząstka jego dróg, ale jakże mało o nim słyszymy! A kto pojmie grzmot jego wielkiej potęgi?"
  tags: []
