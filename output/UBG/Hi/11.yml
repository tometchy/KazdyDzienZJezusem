"Hi11,1":
  text: "Wtedy Sofar z Naamy odpowiedział:"
  tags: []
"Hi11,2":
  text: "Czy nie należy odpowiedzieć na takie mnóstwo słów? Czy człowiek gadatliwy ma być usprawiedliwiony?"
  tags: []
"Hi11,3":
  text: "Czy ludzie mają milczeć na twoje kłamstwa? A gdy kpisz, nikt cię nie zawstydzi?"
  tags: []
"Hi11,4":
  text: "Powiedziałeś bowiem: Moja nauka jest czysta, jestem czysty w twoich oczach."
  tags: []
"Hi11,5":
  text: "O gdyby Bóg zechciał przemówić i otworzyć usta przeciwko tobie;"
  tags: []
"Hi11,6":
  text: "Gdyby objawił tajemnice mądrości – że zasługujesz na dwa razy większą karę. Poznaj więc, ile Bóg ci przebaczył za twoją nieprawość."
  tags: []
"Hi11,7":
  text: "Czy wybadasz tajemnice Boga? Czy zgłębisz doskonałość Wszechmocnego?"
  tags: []
"Hi11,8":
  text: "Są wyżej niż niebiosa, co możesz z tym uczynić? Głębsze niż piekło, czy możesz je poznać?"
  tags: []
"Hi11,9":
  text: "Ich miara jest dłuższa niż ziemia i szersza niż morze."
  tags: []
"Hi11,10":
  text: "Jeśli wycina, zamyka albo gromadzi, któż go powstrzyma?"
  tags: []
"Hi11,11":
  text: "On bowiem zna marność ludzi i widzi niegodziwość. Czy miałby na to nie zważać?"
  tags: []
"Hi11,12":
  text: "Człowiek nierozumny może nabyć rozumu, choć człowiek rodzi się jak źrebię dzikiego osła."
  tags: []
"Hi11,13":
  text: "Jeśli przygotujesz swoje serce i wyciągniesz do niego swoje ręce;"
  tags: []
"Hi11,14":
  text: "Jeśli w twoich rękach jest nieprawość, oddal ją i nie pozwól, aby niegodziwość mieszkała w twoich przybytkach."
  tags: []
"Hi11,15":
  text: "Wtedy podniesiesz swoje oblicze bez zmazy, będziesz stały i nie będziesz się bał."
  tags: []
"Hi11,16":
  text: "Zapomnisz bowiem o swojej udręce i wspomnisz ją tak jak wody, które przepłynęły."
  tags: []
"Hi11,17":
  text: "I twoje życie będzie jaśniejsze niż południe; twoja ciemność będzie jak poranek."
  tags: []
"Hi11,18":
  text: "Będziesz ufał, mając nadzieję; będziesz kopać dokoła i odpoczniesz bezpiecznie."
  tags: []
"Hi11,19":
  text: "Położysz się i nikt cię nie przestraszy; wielu uniży się przed twoim obliczem."
  tags: []
"Hi11,20":
  text: "Ale oczy niegodziwych przygasną i nie będzie dla nich ucieczki, a ich nadzieja będzie jak wyzionięcie ducha."
  tags: []
