"Hi11,1": "Wtedy Sofar z Naamy odpowiedział:"
"Hi11,2": "Czy nie należy odpowiedzieć na takie mnóstwo słów? Czy człowiek gadatliwy ma być usprawiedliwiony?"
"Hi11,3": "Czy ludzie mają milczeć na twoje kłamstwa? A gdy kpisz, nikt cię nie zawstydzi?"
"Hi11,4": "Powiedziałeś bowiem: Moja nauka jest czysta, jestem czysty w twoich oczach."
"Hi11,5": "O gdyby Bóg zechciał przemówić i otworzyć usta przeciwko tobie;"
"Hi11,6": "Gdyby objawił tajemnice mądrości – że zasługujesz na dwa razy większą karę. Poznaj więc, ile Bóg ci przebaczył za twoją nieprawość."
"Hi11,7": "Czy wybadasz tajemnice Boga? Czy zgłębisz doskonałość Wszechmocnego?"
"Hi11,8": "Są wyżej niż niebiosa, co możesz z tym uczynić? Głębsze niż piekło, czy możesz je poznać?"
"Hi11,9": "Ich miara jest dłuższa niż ziemia i szersza niż morze."
"Hi11,10": "Jeśli wycina, zamyka albo gromadzi, któż go powstrzyma?"
"Hi11,11": "On bowiem zna marność ludzi i widzi niegodziwość. Czy miałby na to nie zważać?"
"Hi11,12": "Człowiek nierozumny może nabyć rozumu, choć człowiek rodzi się jak źrebię dzikiego osła."
"Hi11,13": "Jeśli przygotujesz swoje serce i wyciągniesz do niego swoje ręce;"
"Hi11,14": "Jeśli w twoich rękach jest nieprawość, oddal ją i nie pozwól, aby niegodziwość mieszkała w twoich przybytkach."
"Hi11,15": "Wtedy podniesiesz swoje oblicze bez zmazy, będziesz stały i nie będziesz się bał."
"Hi11,16": "Zapomnisz bowiem o swojej udręce i wspomnisz ją tak jak wody, które przepłynęły."
"Hi11,17": "I twoje życie będzie jaśniejsze niż południe; twoja ciemność będzie jak poranek."
"Hi11,18": "Będziesz ufał, mając nadzieję; będziesz kopać dokoła i odpoczniesz bezpiecznie."
"Hi11,19": "Położysz się i nikt cię nie przestraszy; wielu uniży się przed twoim obliczem."
"Hi11,20": "Ale oczy niegodziwych przygasną i nie będzie dla nich ucieczki, a ich nadzieja będzie jak wyzionięcie ducha."
