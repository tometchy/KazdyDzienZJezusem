"Hi7,1": "Czy człowiekowi nie jest wyznaczony czas na ziemi? Czy jego dni nie są jak dni najemnika?"
"Hi7,2": "Jak sługa pragnie cienia, jak najemnik oczekuje zapłaty za swoją pracę;"
"Hi7,3": "Tak moim udziałem są miesiące próżne, a przeznaczono mi noce bolesne."
"Hi7,4": "Gdy się kładę, mówię: Kiedy minie noc, abym mógł wstać? I jestem pełny niepokoju aż do świtu."
"Hi7,5": "Moje ciało pokryte jest robactwem i strupami w prochu, moja skóra pęka i ropieje."
"Hi7,6": "Moje dni biegną szybciej niż czółenko tkackie i przemijają bez nadziei."
"Hi7,7": "Pamiętaj, że moje życie jest wiatrem, moje oko już nie zobaczy dobra."
"Hi7,8": "Oko, które mnie widziało, już mnie nie zobaczy. Twoje oczy są zwrócone na mnie, a mnie już nie ma."
"Hi7,9": "Jak obłok się rozchodzi i przemija, tak ten, kto zstępuje do grobu, nie wraca."
"Hi7,10": "Nie wróci już do swego domu ani nie pozna go już jego miejsce."
"Hi7,11": "Dlatego nie mogę powstrzymać swoich ust, będę mówił w utrapieniu swego ducha, będę narzekał w goryczy swojej duszy."
"Hi7,12": "Czy jestem morzem albo wielorybem, że postawiłeś przy mnie straż?"
"Hi7,13": "Gdy mówię: Pocieszy mnie moje łóżko i moje posłanie ulży mojemu narzekaniu;"
"Hi7,14": "Wtedy straszysz mnie snami i przerażasz mnie widzeniami;"
"Hi7,15": "Tak że moja dusza wybrałaby sobie uduszenie, raczej śmierć niż życie."
"Hi7,16": "Uprzykrzyło mi się życie, nie chcę żyć wiecznie. Zostaw mnie, bo moje dni są marnością."
"Hi7,17": "Czym jest człowiek, że go tak wywyższasz i że zwracasz ku niemu swoje serce?"
"Hi7,18": "Że nawiedzasz go każdego ranka i w każdej chwili doświadczasz?"
"Hi7,19": "Kiedy odwrócisz się ode mnie i zostawisz mnie, abym mógł przełknąć swoją ślinę?"
"Hi7,20": "Zgrzeszyłem, cóż mam czynić, stróżu człowieka? Czemu mnie wziąłeś za cel, abym był sam dla siebie ciężarem?"
"Hi7,21": "Czemu nie przebaczysz mojego przestępstwa i nie zmażesz mojej nieprawości? Teraz bowiem położę się w prochu i gdy rano będziesz mnie szukał, nie będzie mnie."
