"Hi7,1":
  text: "Czy człowiekowi nie jest wyznaczony czas na ziemi? Czy jego dni nie są jak dni najemnika?"
  tags: []
"Hi7,2":
  text: "Jak sługa pragnie cienia, jak najemnik oczekuje zapłaty za swoją pracę;"
  tags: []
"Hi7,3":
  text: "Tak moim udziałem są miesiące próżne, a przeznaczono mi noce bolesne."
  tags: []
"Hi7,4":
  text: "Gdy się kładę, mówię: Kiedy minie noc, abym mógł wstać? I jestem pełny niepokoju aż do świtu."
  tags: []
"Hi7,5":
  text: "Moje ciało pokryte jest robactwem i strupami w prochu, moja skóra pęka i ropieje."
  tags: []
"Hi7,6":
  text: "Moje dni biegną szybciej niż czółenko tkackie i przemijają bez nadziei."
  tags: []
"Hi7,7":
  text: "Pamiętaj, że moje życie jest wiatrem, moje oko już nie zobaczy dobra."
  tags: []
"Hi7,8":
  text: "Oko, które mnie widziało, już mnie nie zobaczy. Twoje oczy są zwrócone na mnie, a mnie już nie ma."
  tags: []
"Hi7,9":
  text: "Jak obłok się rozchodzi i przemija, tak ten, kto zstępuje do grobu, nie wraca."
  tags: []
"Hi7,10":
  text: "Nie wróci już do swego domu ani nie pozna go już jego miejsce."
  tags: []
"Hi7,11":
  text: "Dlatego nie mogę powstrzymać swoich ust, będę mówił w utrapieniu swego ducha, będę narzekał w goryczy swojej duszy."
  tags: []
"Hi7,12":
  text: "Czy jestem morzem albo wielorybem, że postawiłeś przy mnie straż?"
  tags: []
"Hi7,13":
  text: "Gdy mówię: Pocieszy mnie moje łóżko i moje posłanie ulży mojemu narzekaniu;"
  tags: []
"Hi7,14":
  text: "Wtedy straszysz mnie snami i przerażasz mnie widzeniami;"
  tags: []
"Hi7,15":
  text: "Tak że moja dusza wybrałaby sobie uduszenie, raczej śmierć niż życie."
  tags: []
"Hi7,16":
  text: "Uprzykrzyło mi się życie, nie chcę żyć wiecznie. Zostaw mnie, bo moje dni są marnością."
  tags: []
"Hi7,17":
  text: "Czym jest człowiek, że go tak wywyższasz i że zwracasz ku niemu swoje serce?"
  tags: []
"Hi7,18":
  text: "Że nawiedzasz go każdego ranka i w każdej chwili doświadczasz?"
  tags: []
"Hi7,19":
  text: "Kiedy odwrócisz się ode mnie i zostawisz mnie, abym mógł przełknąć swoją ślinę?"
  tags: []
"Hi7,20":
  text: "Zgrzeszyłem, cóż mam czynić, stróżu człowieka? Czemu mnie wziąłeś za cel, abym był sam dla siebie ciężarem?"
  tags: []
"Hi7,21":
  text: "Czemu nie przebaczysz mojego przestępstwa i nie zmażesz mojej nieprawości? Teraz bowiem położę się w prochu i gdy rano będziesz mnie szukał, nie będzie mnie."
  tags: []
