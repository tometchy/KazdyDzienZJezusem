"Hi1,1": "Był w ziemi Uz człowiek imieniem Hiob; ten człowiek był doskonały i prawy, i bojący się Boga, a stroniący od zła."
"Hi1,2": "I urodziło mu się siedmiu synów i trzy córki."
"Hi1,3": "A jego dobytek stanowiło siedem tysięcy owiec, trzy tysiące wielbłądów, pięćset jarzm wołów i pięćset oślic; miał też bardzo liczną służbę. Był on człowiekiem najmożniejszym wśród wszystkich ludzi Wschodu."
"Hi1,4": "Jego synowie schodzili się i urządzali ucztę, każdy w swoim domu w ustalonym dniu. Posyłali po swoje trzy siostry i zapraszali je, aby jadły i piły wraz z nimi."
"Hi1,5": "A gdy minęły dni uczty, Hiob posyłał i poświęcał ich. Potem wstawał wczesnym rankiem i składał całopalenia stosownie do ich liczby. Mówił bowiem Hiob: Może moi synowie zgrzeszyli i złorzeczyli Bogu w swoich sercach. Tak Hiob czynił zawsze."
"Hi1,6": "Zdarzyło się pewnego dnia, gdy synowie Boży przybyli, aby stanąć przed PANEM, że też szatan pojawił się wśród nich."
"Hi1,7": "Wtedy PAN zapytał szatana: Skąd przychodzisz? Szatan odpowiedział PANU: Krążyłem po ziemi i przechadzałem się po niej."
"Hi1,8": "PAN powiedział do szatana: Czy zwróciłeś uwagę na mojego sługę Hioba – że nie ma nikogo mu równego na ziemi? To człowiek doskonały i prawy, bojący się Boga i stroniący od zła."
"Hi1,9": "A szatan odpowiedział PANU: Czy Hiob za darmo boi się Boga?"
"Hi1,10": "Czy nie ogrodziłeś zewsząd jego samego, jego domu i wszystkiego, co ma? Błogosławiłeś dziełom jego rąk, a jego dobytek rozmnożył się na ziemi."
"Hi1,11": "Ale wyciągnij tylko swoją rękę i dotknij wszystkiego, co ma, a na pewno będzie ci w twarz złorzeczył."
"Hi1,12": "Wtedy PAN powiedział do szatana: Oto wszystko, co ma, jest w twojej mocy, tylko na niego nie wyciągaj ręki. I szatan odszedł sprzed oblicza PANA."
"Hi1,13": "Zdarzyło się któregoś dnia, gdy jego synowie i córki jedli i pili wino w domu najstarszego brata;"
"Hi1,14": "Że do Hioba przybył posłaniec i powiedział: Woły orały, a oślice pasły się obok nich;"
"Hi1,15": "I napadli Sabejczycy, i zabrali je, a sługi pozabijali ostrzem miecza. Uszedłem tylko ja sam, aby cię o tym powiadomić."
"Hi1,16": "A gdy ten jeszcze mówił, przyszedł inny i powiedział: Ogień Boży spadł z nieba, spalił owce i sługi i pochłonął ich. Uszedłem tylko ja sam, aby cię o tym powiadomić."
"Hi1,17": "A gdy ten jeszcze mówił, przyszedł inny i powiedział: Chaldejczycy podzieleni na trzy oddziały napadli na wielbłądy, zabrali je, a sługi pozabijali ostrzem miecza. Uszedłem tylko ja sam, aby cię o tym powiadomić."
"Hi1,18": "A gdy ten jeszcze mówił, przyszedł inny i powiedział: Twoi synowie i córki jedli i pili wino w domu najstarszego brata;"
"Hi1,19": "A oto gwałtowny wiatr powiał od pustyni i uderzył w cztery węgły domu, tak że zawalił się na dzieci i pomarły. Uszedłem tylko ja sam, aby cię o tym powiadomić."
"Hi1,20": "Wtedy Hiob wstał, rozdarł swój płaszcz, ogolił swoją głowę, potem upadł na ziemię i oddał pokłon;"
"Hi1,21": "I powiedział: Nagi wyszedłem z łona swojej matki i nagi tam powrócę. PAN dał, PAN też wziął, niech imię PANA będzie błogosławione."
"Hi1,22": "W tym wszystkim Hiob nie zgrzeszył ani nie oskarżał Boga o nic niewłaściwego."
