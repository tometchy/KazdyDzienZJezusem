"Hi1,1":
  text: "Był w ziemi Uz człowiek imieniem Hiob; ten człowiek był doskonały i prawy, i bojący się Boga, a stroniący od zła."
  tags: []
"Hi1,2":
  text: "I urodziło mu się siedmiu synów i trzy córki."
  tags: []
"Hi1,3":
  text: "A jego dobytek stanowiło siedem tysięcy owiec, trzy tysiące wielbłądów, pięćset jarzm wołów i pięćset oślic; miał też bardzo liczną służbę. Był on człowiekiem najmożniejszym wśród wszystkich ludzi Wschodu."
  tags: []
"Hi1,4":
  text: "Jego synowie schodzili się i urządzali ucztę, każdy w swoim domu w ustalonym dniu. Posyłali po swoje trzy siostry i zapraszali je, aby jadły i piły wraz z nimi."
  tags: []
"Hi1,5":
  text: "A gdy minęły dni uczty, Hiob posyłał i poświęcał ich. Potem wstawał wczesnym rankiem i składał całopalenia stosownie do ich liczby. Mówił bowiem Hiob: Może moi synowie zgrzeszyli i złorzeczyli Bogu w swoich sercach. Tak Hiob czynił zawsze."
  tags: []
"Hi1,6":
  text: "Zdarzyło się pewnego dnia, gdy synowie Boży przybyli, aby stanąć przed PANEM, że też szatan pojawił się wśród nich."
  tags: []
"Hi1,7":
  text: "Wtedy PAN zapytał szatana: Skąd przychodzisz? Szatan odpowiedział PANU: Krążyłem po ziemi i przechadzałem się po niej."
  tags: []
"Hi1,8":
  text: "PAN powiedział do szatana: Czy zwróciłeś uwagę na mojego sługę Hioba – że nie ma nikogo mu równego na ziemi? To człowiek doskonały i prawy, bojący się Boga i stroniący od zła."
  tags: []
"Hi1,9":
  text: "A szatan odpowiedział PANU: Czy Hiob za darmo boi się Boga?"
  tags: []
"Hi1,10":
  text: "Czy nie ogrodziłeś zewsząd jego samego, jego domu i wszystkiego, co ma? Błogosławiłeś dziełom jego rąk, a jego dobytek rozmnożył się na ziemi."
  tags: []
"Hi1,11":
  text: "Ale wyciągnij tylko swoją rękę i dotknij wszystkiego, co ma, a na pewno będzie ci w twarz złorzeczył."
  tags: []
"Hi1,12":
  text: "Wtedy PAN powiedział do szatana: Oto wszystko, co ma, jest w twojej mocy, tylko na niego nie wyciągaj ręki. I szatan odszedł sprzed oblicza PANA."
  tags: []
"Hi1,13":
  text: "Zdarzyło się któregoś dnia, gdy jego synowie i córki jedli i pili wino w domu najstarszego brata;"
  tags: []
"Hi1,14":
  text: "Że do Hioba przybył posłaniec i powiedział: Woły orały, a oślice pasły się obok nich;"
  tags: []
"Hi1,15":
  text: "I napadli Sabejczycy, i zabrali je, a sługi pozabijali ostrzem miecza. Uszedłem tylko ja sam, aby cię o tym powiadomić."
  tags: []
"Hi1,16":
  text: "A gdy ten jeszcze mówił, przyszedł inny i powiedział: Ogień Boży spadł z nieba, spalił owce i sługi i pochłonął ich. Uszedłem tylko ja sam, aby cię o tym powiadomić."
  tags: []
"Hi1,17":
  text: "A gdy ten jeszcze mówił, przyszedł inny i powiedział: Chaldejczycy podzieleni na trzy oddziały napadli na wielbłądy, zabrali je, a sługi pozabijali ostrzem miecza. Uszedłem tylko ja sam, aby cię o tym powiadomić."
  tags: []
"Hi1,18":
  text: "A gdy ten jeszcze mówił, przyszedł inny i powiedział: Twoi synowie i córki jedli i pili wino w domu najstarszego brata;"
  tags: []
"Hi1,19":
  text: "A oto gwałtowny wiatr powiał od pustyni i uderzył w cztery węgły domu, tak że zawalił się na dzieci i pomarły. Uszedłem tylko ja sam, aby cię o tym powiadomić."
  tags: []
"Hi1,20":
  text: "Wtedy Hiob wstał, rozdarł swój płaszcz, ogolił swoją głowę, potem upadł na ziemię i oddał pokłon;"
  tags: []
"Hi1,21":
  text: "I powiedział: Nagi wyszedłem z łona swojej matki i nagi tam powrócę. PAN dał, PAN też wziął, niech imię PANA będzie błogosławione."
  tags: []
"Hi1,22":
  text: "W tym wszystkim Hiob nie zgrzeszył ani nie oskarżał Boga o nic niewłaściwego."
  tags: []
