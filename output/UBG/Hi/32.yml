"Hi32,1": "A gdy ci trzej mężczyźni przestali odpowiadać Hiobowi, ponieważ był sprawiedliwy we własnych oczach;"
"Hi32,2": "Wtedy zapłonął gniewem Elihu, syn Barakeela, Buzyta, z rodu Ram; rozgniewał się na Hioba, gdyż usprawiedliwiał siebie bardziej niż Boga."
"Hi32,3": "Rozpalił się także jego gniew na jego trzech przyjaciół, bo nie znaleźli żadnej odpowiedzi, a jednak potępiali Hioba."
"Hi32,4": "Elihu czekał, aż Hiob skończy odpowiedź, gdyż oni byli od niego starsi."
"Hi32,5": "Gdy Elihu zauważył, że w ustach trzech mężczyzn nie ma żadnej odpowiedzi, zapłonął gniewem."
"Hi32,6": "I Elihu, syn Barakeela, Buzyta, odpowiedział: Ja jestem młody, a wy jesteście starzy, dlatego bałem się i nie śmiałem wyjawić wam swego zdania."
"Hi32,7": "Myślałem: Niech przemówią dni, a mnogość lat niech uczy mądrości."
"Hi32,8": "Ale to duch jest w człowieku i tchnienie Wszechmogącego daje rozum."
"Hi32,9": "Wielcy nie zawsze są mądrzy, a starcy nie zawsze rozumieją sąd."
"Hi32,10": "Dlatego mówię: Posłuchajcie mnie, ja też wypowiem swoje zdanie."
"Hi32,11": "Oto czekałem na wasze słowa, przysłuchiwałem się waszym dowodom, gdy przygotowywaliście mowę."
"Hi32,12": "I przypatrywałem się wam, a oto żaden z was nie przekonał Hioba i nikt nie odpowiedział na jego słowa;"
"Hi32,13": "I nie możecie powiedzieć: Znaleźliśmy mądrość. Sam Bóg go strąca, nie człowiek."
"Hi32,14": "Nie do mnie skierował swoje słowa, a ja nie odpowiem mu waszymi słowami."
"Hi32,15": "Zaniepokoili się i już nie odpowiadali; przestali mówić."
"Hi32,16": "Czekałem, lecz nie mówili, ale stanęli i już nic nie powiedzieli."
"Hi32,17": "Odpowiem ze swojej strony, wypowiem też swoje zdanie."
"Hi32,18": "Jestem bowiem pełny słów, mój duch przymusza mnie."
"Hi32,19": "Oto moje wnętrze jest jak wino, które nie ma ujścia; jak nowe bukłaki zagrożone pęknięciem."
"Hi32,20": "Będę więc mówić, aby ulżyć sobie; otworzę swoje wargi i odpowiem."
"Hi32,21": "Nie będę miał względu na nikogo i nikomu nie będę schlebiał."
"Hi32,22": "Nie umiem bowiem schlebiać, gdyż mój Stwórca wnet by mnie porwał."
