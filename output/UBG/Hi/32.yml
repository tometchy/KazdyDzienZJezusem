"Hi32,1":
  text: "A gdy ci trzej mężczyźni przestali odpowiadać Hiobowi, ponieważ był sprawiedliwy we własnych oczach;"
  tags: []
"Hi32,2":
  text: "Wtedy zapłonął gniewem Elihu, syn Barakeela, Buzyta, z rodu Ram; rozgniewał się na Hioba, gdyż usprawiedliwiał siebie bardziej niż Boga."
  tags: []
"Hi32,3":
  text: "Rozpalił się także jego gniew na jego trzech przyjaciół, bo nie znaleźli żadnej odpowiedzi, a jednak potępiali Hioba."
  tags: []
"Hi32,4":
  text: "Elihu czekał, aż Hiob skończy odpowiedź, gdyż oni byli od niego starsi."
  tags: []
"Hi32,5":
  text: "Gdy Elihu zauważył, że w ustach trzech mężczyzn nie ma żadnej odpowiedzi, zapłonął gniewem."
  tags: []
"Hi32,6":
  text: "I Elihu, syn Barakeela, Buzyta, odpowiedział: Ja jestem młody, a wy jesteście starzy, dlatego bałem się i nie śmiałem wyjawić wam swego zdania."
  tags: []
"Hi32,7":
  text: "Myślałem: Niech przemówią dni, a mnogość lat niech uczy mądrości."
  tags: []
"Hi32,8":
  text: "Ale to duch jest w człowieku i tchnienie Wszechmogącego daje rozum."
  tags: []
"Hi32,9":
  text: "Wielcy nie zawsze są mądrzy, a starcy nie zawsze rozumieją sąd."
  tags: []
"Hi32,10":
  text: "Dlatego mówię: Posłuchajcie mnie, ja też wypowiem swoje zdanie."
  tags: []
"Hi32,11":
  text: "Oto czekałem na wasze słowa, przysłuchiwałem się waszym dowodom, gdy przygotowywaliście mowę."
  tags: []
"Hi32,12":
  text: "I przypatrywałem się wam, a oto żaden z was nie przekonał Hioba i nikt nie odpowiedział na jego słowa;"
  tags: []
"Hi32,13":
  text: "I nie możecie powiedzieć: Znaleźliśmy mądrość. Sam Bóg go strąca, nie człowiek."
  tags: []
"Hi32,14":
  text: "Nie do mnie skierował swoje słowa, a ja nie odpowiem mu waszymi słowami."
  tags: []
"Hi32,15":
  text: "Zaniepokoili się i już nie odpowiadali; przestali mówić."
  tags: []
"Hi32,16":
  text: "Czekałem, lecz nie mówili, ale stanęli i już nic nie powiedzieli."
  tags: []
"Hi32,17":
  text: "Odpowiem ze swojej strony, wypowiem też swoje zdanie."
  tags: []
"Hi32,18":
  text: "Jestem bowiem pełny słów, mój duch przymusza mnie."
  tags: []
"Hi32,19":
  text: "Oto moje wnętrze jest jak wino, które nie ma ujścia; jak nowe bukłaki zagrożone pęknięciem."
  tags: []
"Hi32,20":
  text: "Będę więc mówić, aby ulżyć sobie; otworzę swoje wargi i odpowiem."
  tags: []
"Hi32,21":
  text: "Nie będę miał względu na nikogo i nikomu nie będę schlebiał."
  tags: []
"Hi32,22":
  text: "Nie umiem bowiem schlebiać, gdyż mój Stwórca wnet by mnie porwał."
  tags: []
