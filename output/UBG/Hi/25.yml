"Hi25,1":
  text: "Wtedy Bildad z Szuach odpowiedział:"
  tags: []
"Hi25,2":
  text: "Przy nim jest panowanie i strach, on czyni pokój na swoich wysokościach."
  tags: []
"Hi25,3":
  text: "Czy można zliczyć jego wojska? A nad kim nie wschodzi jego światło?"
  tags: []
"Hi25,4":
  text: "Jak więc może człowiek być usprawiedliwiony przed Bogiem? Albo jak może być czysty ten, kto się urodził z kobiety?"
  tags: []
"Hi25,5":
  text: "Oto nawet księżyc nie świeci i gwiazdy nie są czyste w jego oczach;"
  tags: []
"Hi25,6":
  text: "Tym bardziej człowiek, który jest robakiem, i syn człowieczy, który jest czerwiem."
  tags: []
