"Hi29,1":
  text: "Hiob ciągnął swoją przypowieść i mówił:"
  tags: []
"Hi29,2":
  text: "Obym był taki jak za dawnych miesięcy, za tych dni, w których Bóg mnie strzegł;"
  tags: []
"Hi29,3":
  text: "Gdy jego pochodnia świeciła nad moją głową, a przy jego świetle przechodziłem w ciemności;"
  tags: []
"Hi29,4":
  text: "Taki, jaki byłem za dni swojej młodości, gdy tajemnica Boga pozostawała nad moim namiotem;"
  tags: []
"Hi29,5":
  text: "Gdy Wszechmocny był jeszcze ze mną i otaczały mnie moje dzieci;"
  tags: []
"Hi29,6":
  text: "Gdy moje ścieżki opływały w masło, a opoka wylewała mi źródła oliwy;"
  tags: []
"Hi29,7":
  text: "Gdy wychodziłem do bramy przez miasto i na rynku przygotowałem sobie miejsce."
  tags: []
"Hi29,8":
  text: "Widząc mnie, młodzi ukrywali się, a starcy podnosili się i stali."
  tags: []
"Hi29,9":
  text: "Książęta przestawali mówić i kładli rękę na swoich ustach."
  tags: []
"Hi29,10":
  text: "Głos dostojników cichł, a ich język przylegał im do podniebienia."
  tags: []
"Hi29,11":
  text: "Ucho, które mnie słyszało, błogosławiło mnie, a oko, które mnie widziało, dawało o mnie świadectwo;"
  tags: []
"Hi29,12":
  text: "Bo wybawiałem ubogiego, gdy wołał, sierotę oraz tego, który nie miał pomocnika."
  tags: []
"Hi29,13":
  text: "Błogosławieństwo ginącego przychodziło do mnie, a serce wdowy radowałem."
  tags: []
"Hi29,14":
  text: "Przyoblekłem się w sprawiedliwość i ona mnie okryła. Mój sąd był jak płaszcz i korona."
  tags: []
"Hi29,15":
  text: "Byłem oczami dla ślepego, a nogami dla chromego."
  tags: []
"Hi29,16":
  text: "Byłem ojcem ubogich, a sprawę, której nie znałem, badałem."
  tags: []
"Hi29,17":
  text: "I kruszyłem szczękę niegodziwca, a z jego zębów wydzierałem łup."
  tags: []
"Hi29,18":
  text: "Dlatego powiedziałem: Umrę w swoim gnieździe, rozmnożę swoje dni jak piasek."
  tags: []
"Hi29,19":
  text: "Mój korzeń rozciągnął się przy wodach, a rosa trwała całą noc na moich gałązkach."
  tags: []
"Hi29,20":
  text: "Moja chwała odświeżała się we mnie, a mój łuk odnowił się w mojej ręce."
  tags: []
"Hi29,21":
  text: "Słuchali mnie i oczekiwali, przyjmowali moją radę w milczeniu."
  tags: []
"Hi29,22":
  text: "Po moich słowach już nie mówili, moja mowa kropiła na nich."
  tags: []
"Hi29,23":
  text: "Oczekiwali mnie jak deszczu, otwierali swe usta jak na późny deszcz."
  tags: []
"Hi29,24":
  text: "Jeśli się śmiałem do nich, nie wierzyli, a światła mojej twarzy nie odrzucali."
  tags: []
"Hi29,25":
  text: "Wytyczałem im drogę, siadałem na czele i przybywałem jak król wśród wojska, jak ten, który smutnych pociesza."
  tags: []
