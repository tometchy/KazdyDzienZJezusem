"Hi29,1": "Hiob ciągnął swoją przypowieść i mówił:"
"Hi29,2": "Obym był taki jak za dawnych miesięcy, za tych dni, w których Bóg mnie strzegł;"
"Hi29,3": "Gdy jego pochodnia świeciła nad moją głową, a przy jego świetle przechodziłem w ciemności;"
"Hi29,4": "Taki, jaki byłem za dni swojej młodości, gdy tajemnica Boga pozostawała nad moim namiotem;"
"Hi29,5": "Gdy Wszechmocny był jeszcze ze mną i otaczały mnie moje dzieci;"
"Hi29,6": "Gdy moje ścieżki opływały w masło, a opoka wylewała mi źródła oliwy;"
"Hi29,7": "Gdy wychodziłem do bramy przez miasto i na rynku przygotowałem sobie miejsce."
"Hi29,8": "Widząc mnie, młodzi ukrywali się, a starcy podnosili się i stali."
"Hi29,9": "Książęta przestawali mówić i kładli rękę na swoich ustach."
"Hi29,10": "Głos dostojników cichł, a ich język przylegał im do podniebienia."
"Hi29,11": "Ucho, które mnie słyszało, błogosławiło mnie, a oko, które mnie widziało, dawało o mnie świadectwo;"
"Hi29,12": "Bo wybawiałem ubogiego, gdy wołał, sierotę oraz tego, który nie miał pomocnika."
"Hi29,13": "Błogosławieństwo ginącego przychodziło do mnie, a serce wdowy radowałem."
"Hi29,14": "Przyoblekłem się w sprawiedliwość i ona mnie okryła. Mój sąd był jak płaszcz i korona."
"Hi29,15": "Byłem oczami dla ślepego, a nogami dla chromego."
"Hi29,16": "Byłem ojcem ubogich, a sprawę, której nie znałem, badałem."
"Hi29,17": "I kruszyłem szczękę niegodziwca, a z jego zębów wydzierałem łup."
"Hi29,18": "Dlatego powiedziałem: Umrę w swoim gnieździe, rozmnożę swoje dni jak piasek."
"Hi29,19": "Mój korzeń rozciągnął się przy wodach, a rosa trwała całą noc na moich gałązkach."
"Hi29,20": "Moja chwała odświeżała się we mnie, a mój łuk odnowił się w mojej ręce."
"Hi29,21": "Słuchali mnie i oczekiwali, przyjmowali moją radę w milczeniu."
"Hi29,22": "Po moich słowach już nie mówili, moja mowa kropiła na nich."
"Hi29,23": "Oczekiwali mnie jak deszczu, otwierali swe usta jak na późny deszcz."
"Hi29,24": "Jeśli się śmiałem do nich, nie wierzyli, a światła mojej twarzy nie odrzucali."
"Hi29,25": "Wytyczałem im drogę, siadałem na czele i przybywałem jak król wśród wojska, jak ten, który smutnych pociesza."
