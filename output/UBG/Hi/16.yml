"Hi16,1": "Wtedy Hiob odpowiedział:"
"Hi16,2": "Słyszałem wiele takich rzeczy; wy wszyscy jesteście przykrymi pocieszycielami."
"Hi16,3": "Kiedy będzie koniec tych próżnych słów? Albo co cię skłania do tego, że tak odpowiadasz?"
"Hi16,4": "Ja także mógłbym mówić jak wy; gdybyście byli w moim położeniu, mógłbym nagromadzić słów przeciwko wam i potrząsać głową nad wami."
"Hi16,5": "Ja jednak pokrzepiałbym was swoimi ustami i poruszanie moich warg ulżyłoby waszym cierpieniom."
"Hi16,6": "Ale jeśli będę mówił, mojemu bólowi to nie ulży, a jeśli przestanę, czyż opuści mnie?"
"Hi16,7": "A teraz zmęczył mnie. Spustoszyłeś całe moje zgromadzenie."
"Hi16,8": "Pomarszczyłeś mnie na świadectwo, a moje wychudzenie powstaje i świadczy przeciwko mnie w twarz."
"Hi16,9": "Jego gniew mnie porwał, nienawidzi mnie; zgrzyta na mnie zębami. Mój wróg przeszywa mnie wzrokiem."
"Hi16,10": "Otworzyli na mnie swe usta; znieważając, bili mnie po policzkach; zebrali się razem przeciwko mnie."
"Hi16,11": "Bóg wydał mnie przewrotnemu, oddał mnie w ręce niegodziwych."
"Hi16,12": "Żyłem w spokoju, ale on mnie pokruszył; chwycił mnie za kark, roztrzaskał i postawił sobie za cel."
"Hi16,13": "Otoczyli mnie jego strzelcy; przeszywa moje nerki, a nie oszczędził; wylał na ziemię moją żółć."
"Hi16,14": "Rozbija mnie, ranę za raną; naciera na mnie jak olbrzym."
"Hi16,15": "Uszyłem wór na swoją skórę i prochem zbezcześciłem swój róg."
"Hi16,16": "Moja twarz jest czerwona od płaczu i na moich powiekach jest cień śmierci."
"Hi16,17": "Chociaż nie ma żadnej krzywdy na moich rękach, a moja modlitwa jest czysta."
"Hi16,18": "Ziemio, nie zakrywaj mojej krwi i niech moje wołanie nie znajdzie miejsca!"
"Hi16,19": "Oto teraz mój świadek jest w niebie, mój obrońca na wysokości."
"Hi16,20": "Moi przyjaciele szydzą ze mnie, ale moje oko wylewa łzy ku Bogu."
"Hi16,21": "Oby ktoś spierał się z Bogiem o człowieka jak człowiek spiera się o swego bliźniego!"
"Hi16,22": "Upłynie bowiem niewiele lat, a pójdę ścieżką, skąd nie powrócę."
