"Hi14,1": "Człowiek, urodzony przez kobietę, ma dni niewiele i ma pełno kłopotów;"
"Hi14,2": "Wyrasta jak kwiat i zostaje podcięty, znika jak cień i się nie ostaje."
"Hi14,3": "A jednak na takiego otwierasz swoje oczy i wzywasz mnie przed siebie na sąd."
"Hi14,4": "Któż może wydobyć czystego z nieczystego? Ani jeden."
"Hi14,5": "Gdyż jego dni są ustalone, liczba jego miesięcy jest u ciebie; wyznaczyłeś mu kres, którego nie może przekroczyć."
"Hi14,6": "Odstąp od niego, aby odpoczął, aż zakończy swój dzień jak najemnik."
"Hi14,7": "Dla drzewa bowiem jest nadzieja, choć je wytną, że znowu odrośnie, że jego latorośl nie ustanie."
"Hi14,8": "Choć jego korzeń zestarzeje się w ziemi i jego pień umrze w prochu;"
"Hi14,9": "To jednak gdy poczuje wodę, odrasta i rozpuszcza gałęzie jak sadzonka."
"Hi14,10": "Ale człowiek umiera i marnieje; a gdy oddaje ducha, gdzie on jest?"
"Hi14,11": "Jak ubywa wód z morza i rzeka opada, i wysycha;"
"Hi14,12": "Tak jest z człowiekiem, gdy się położy i już nie wstanie; dopóki niebiosa będą trwać, nie ocknie się ani nie będzie obudzony ze swego snu."
"Hi14,13": "Obyś mnie w grobie ukrył i schował, aż twój gniew się uciszy, wyznaczył mi czas i wspomniał na mnie."
"Hi14,14": "Gdy człowiek umrze, czy znowu ożyje? Przez wszystkie dni wyznaczonego mi czasu będę czekał, aż nadejdzie moja zmiana."
"Hi14,15": "Zawołasz, a ja ci odpowiem; zatęsknisz za dziełem swoich rąk."
"Hi14,16": "Teraz jednak liczysz moje kroki. Czy nie zważasz na mój grzech?"
"Hi14,17": "Mój występek jest zapieczętowany w woreczku, gromadzisz moje nieprawości."
"Hi14,18": "Doprawdy, góra pada i rozsypuje się, i skała przesuwa się ze swego miejsca."
"Hi14,19": "Wody wydrążają kamienie, ulewa podrywa to, co wyrośnie z prochu ziemi, a ty nadzieję człowieka obracasz wniwecz."
"Hi14,20": "Stale pokonujesz go, a on odchodzi; zmieniasz jego oblicze i odprawiasz go."
"Hi14,21": "Jego synowie darzeni są szacunkiem, lecz on o tym nie wie; żyją w pogardzie, lecz na to nie zważa."
"Hi14,22": "Ale jego własne ciało odczuwa ból, a jego dusza w nim płacze."
