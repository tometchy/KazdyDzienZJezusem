"Hi36,1": "Elihu mówił jeszcze:"
"Hi36,2": "Poczekaj trochę, a pouczę cię, bo jeszcze przemówię za Boga."
"Hi36,3": "Z daleka przyniosę swą wiedzę i uznam sprawiedliwość mego Stwórcy."
"Hi36,4": "Bo naprawdę moje słowa nie są kłamstwem, a człowiek z doskonałą wiedzą stoi przed tobą."
"Hi36,5": "Oto Bóg jest potężny, a nie gardzi nikim. On jest potężny w sile serca."
"Hi36,6": "Nie pozostawia niegodziwych przy życiu, a ubogim przyznaje prawa."
"Hi36,7": "Nie odwraca swoich oczu od sprawiedliwego, ale sadza ich na wieki z królami na tronie – i są wywyższeni."
"Hi36,8": "A jeśli są związani okowami albo spętani powrozami utrapienia;"
"Hi36,9": "Wtedy oznajmia im ich czyny i przestępstwa – to, że się wzmogły."
"Hi36,10": "Otwiera im ucho, aby przyjęli karę, i każe im odwrócić się od nieprawości."
"Hi36,11": "Jeśli będą posłuszni i będą mu służyć, dopełnią swoich dni w dobrobycie, a swoich lat w rozkoszach."
"Hi36,12": "Ale jeśli nie usłuchają, zginą od miecza, umrą bez poznania."
"Hi36,13": "Lecz ludzie obłudnego serca gromadzą gniew, nie wołają, kiedy ich wiąże."
"Hi36,14": "Umierają w młodości, swoje życie spędzają wśród rozpustników."
"Hi36,15": "Wyrywa ubogiego z utrapienia i otwiera ich uszy w ucisku."
"Hi36,16": "Również ciebie wyrwałby z ciasnego miejsca na miejsce przestronne, gdzie nie ma ucisku, a zastawiłby twój stół pełnią tłuszczu."
"Hi36,17": "Ale ty zasłużyłeś na sąd niegodziwego, dlatego prawo i sąd będą cię trzymać."
"Hi36,18": "Gniew wisi, więc uważaj, by nie poraził cię karą, gdyż nie wybawił cię żaden okup."
"Hi36,19": "Czy będzie zważał na twoje bogactwa? Nie, ani na złoto, ani na jakiekolwiek siły lub potęgi."
"Hi36,20": "Nie tęsknij za nocą, kiedy ludzie są porwani ze swojego miejsca."
"Hi36,21": "Strzeż się, abyś nie zważał na nieprawość; gdyż wybrałeś to sobie zamiast utrapienia."
"Hi36,22": "Oto Bóg jest najwyższy w swojej potędze, któż może tak nauczyć jak on?"
"Hi36,23": "Kto mu wytyczył jego drogę? Albo kto mu powie: Popełniłeś nieprawość?"
"Hi36,24": "Pamiętaj, abyś wysławiał jego dzieło, któremu przypatrują się ludzie."
"Hi36,25": "Wszyscy ludzie je widzą, człowiek przypatruje się mu z daleka."
"Hi36,26": "Oto Bóg jest wielki, a poznać go nie możemy, a liczba jego lat jest niezbadana."
"Hi36,27": "On wyciąga bowiem krople wód, które padają z pary jako deszcz;"
"Hi36,28": "Który spuszczają chmury i który obficie spływa na ludzi."
"Hi36,29": "(A kto zrozumie rozmieszczenie chmur i grzmot jego namiotu?"
"Hi36,30": "Oto rozciąga nad nim swoją światłość i okrywa głębiny morskie."
"Hi36,31": "Przez te rzeczy bowiem sądzi narody i daje pokarm w obfitości."
"Hi36,32": "Chmurami okrywa światłość i rozkazuje jej ukrywać się za wyznaczoną chmurą)."
"Hi36,33": "Grzmot daje o nim znać, a także bydło – o parze unoszącej się w górę."
