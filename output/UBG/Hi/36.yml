"Hi36,1":
  text: "Elihu mówił jeszcze:"
  tags: []
"Hi36,2":
  text: "Poczekaj trochę, a pouczę cię, bo jeszcze przemówię za Boga."
  tags: []
"Hi36,3":
  text: "Z daleka przyniosę swą wiedzę i uznam sprawiedliwość mego Stwórcy."
  tags: []
"Hi36,4":
  text: "Bo naprawdę moje słowa nie są kłamstwem, a człowiek z doskonałą wiedzą stoi przed tobą."
  tags: []
"Hi36,5":
  text: "Oto Bóg jest potężny, a nie gardzi nikim. On jest potężny w sile serca."
  tags: []
"Hi36,6":
  text: "Nie pozostawia niegodziwych przy życiu, a ubogim przyznaje prawa."
  tags: []
"Hi36,7":
  text: "Nie odwraca swoich oczu od sprawiedliwego, ale sadza ich na wieki z królami na tronie – i są wywyższeni."
  tags: []
"Hi36,8":
  text: "A jeśli są związani okowami albo spętani powrozami utrapienia;"
  tags: []
"Hi36,9":
  text: "Wtedy oznajmia im ich czyny i przestępstwa – to, że się wzmogły."
  tags: []
"Hi36,10":
  text: "Otwiera im ucho, aby przyjęli karę, i każe im odwrócić się od nieprawości."
  tags: []
"Hi36,11":
  text: "Jeśli będą posłuszni i będą mu służyć, dopełnią swoich dni w dobrobycie, a swoich lat w rozkoszach."
  tags: []
"Hi36,12":
  text: "Ale jeśli nie usłuchają, zginą od miecza, umrą bez poznania."
  tags: []
"Hi36,13":
  text: "Lecz ludzie obłudnego serca gromadzą gniew, nie wołają, kiedy ich wiąże."
  tags: []
"Hi36,14":
  text: "Umierają w młodości, swoje życie spędzają wśród rozpustników."
  tags: []
"Hi36,15":
  text: "Wyrywa ubogiego z utrapienia i otwiera ich uszy w ucisku."
  tags: []
"Hi36,16":
  text: "Również ciebie wyrwałby z ciasnego miejsca na miejsce przestronne, gdzie nie ma ucisku, a zastawiłby twój stół pełnią tłuszczu."
  tags: []
"Hi36,17":
  text: "Ale ty zasłużyłeś na sąd niegodziwego, dlatego prawo i sąd będą cię trzymać."
  tags: []
"Hi36,18":
  text: "Gniew wisi, więc uważaj, by nie poraził cię karą, gdyż nie wybawił cię żaden okup."
  tags: []
"Hi36,19":
  text: "Czy będzie zważał na twoje bogactwa? Nie, ani na złoto, ani na jakiekolwiek siły lub potęgi."
  tags: []
"Hi36,20":
  text: "Nie tęsknij za nocą, kiedy ludzie są porwani ze swojego miejsca."
  tags: []
"Hi36,21":
  text: "Strzeż się, abyś nie zważał na nieprawość; gdyż wybrałeś to sobie zamiast utrapienia."
  tags: []
"Hi36,22":
  text: "Oto Bóg jest najwyższy w swojej potędze, któż może tak nauczyć jak on?"
  tags: []
"Hi36,23":
  text: "Kto mu wytyczył jego drogę? Albo kto mu powie: Popełniłeś nieprawość?"
  tags: []
"Hi36,24":
  text: "Pamiętaj, abyś wysławiał jego dzieło, któremu przypatrują się ludzie."
  tags: []
"Hi36,25":
  text: "Wszyscy ludzie je widzą, człowiek przypatruje się mu z daleka."
  tags: []
"Hi36,26":
  text: "Oto Bóg jest wielki, a poznać go nie możemy, a liczba jego lat jest niezbadana."
  tags: []
"Hi36,27":
  text: "On wyciąga bowiem krople wód, które padają z pary jako deszcz;"
  tags: []
"Hi36,28":
  text: "Który spuszczają chmury i który obficie spływa na ludzi."
  tags: []
"Hi36,29":
  text: "(A kto zrozumie rozmieszczenie chmur i grzmot jego namiotu?"
  tags: []
"Hi36,30":
  text: "Oto rozciąga nad nim swoją światłość i okrywa głębiny morskie."
  tags: []
"Hi36,31":
  text: "Przez te rzeczy bowiem sądzi narody i daje pokarm w obfitości."
  tags: []
"Hi36,32":
  text: "Chmurami okrywa światłość i rozkazuje jej ukrywać się za wyznaczoną chmurą)."
  tags: []
"Hi36,33":
  text: "Grzmot daje o nim znać, a także bydło – o parze unoszącej się w górę."
  tags: []
