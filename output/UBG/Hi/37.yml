"Hi37,1":
  text: "I drży z tego powodu moje serce, i wyrywa się ze swego miejsca."
  tags: []
"Hi37,2":
  text: "Słuchajcie uważnie grzmotu jego głosu i dźwięku, który wychodzi z jego ust."
  tags: []
"Hi37,3":
  text: "Pod całym niebem go wypuszcza, a jego błyskawicę – na krańce ziemi."
  tags: []
"Hi37,4":
  text: "Po niej huczy grzmot, grzmi głosem swojego majestatu, i nie powstrzymuje ich, gdy słychać jego głos."
  tags: []
"Hi37,5":
  text: "Bóg cudownie grzmi swoim głosem, czyni wielkie rzeczy, których nie możemy zrozumieć."
  tags: []
"Hi37,6":
  text: "Mówi bowiem do śniegu: Padaj na ziemię, a także do deszczu i do ulewy jego potęgi."
  tags: []
"Hi37,7":
  text: "Pieczętuje rękę każdego człowieka, aby wszyscy ludzie poznali jego dzieło."
  tags: []
"Hi37,8":
  text: "Wtedy zwierzęta wchodzą do jaskini i zostają w swoich jamach."
  tags: []
"Hi37,9":
  text: "Od południa przychodzi wicher, a zima od wiatrów północnych."
  tags: []
"Hi37,10":
  text: "Swoim tchnieniem Bóg czyni lód i ścinają się szerokie wody."
  tags: []
"Hi37,11":
  text: "Także wilgocią ziemi obciąża obłok, rozpędza chmurę swoim światłem."
  tags: []
"Hi37,12":
  text: "One krążą według jego rady, aby czyniły wszystko, co rozkazuje na powierzchni okręgu ziemi."
  tags: []
"Hi37,13":
  text: "A on sprawia, że się pojawiają – czy to dla karania, czy dla swojej ziemi, czy dla okazywania miłosierdzia."
  tags: []
"Hi37,14":
  text: "Słuchaj tego uważnie, Hiobie; zastanów się i rozważ cudowne dzieła Boga."
  tags: []
"Hi37,15":
  text: "Czy wiesz, kiedy i co postanawia Bóg o tych sprawach albo kiedy rozjaśnia światło swej chmury?"
  tags: []
"Hi37,16":
  text: "Czy wiesz, jak wiszą chmury – cuda tego, który jest doskonały we wszelkiej wiedzy?"
  tags: []
"Hi37,17":
  text: "Czy wiesz, jak twoje szaty się rozgrzewają, gdy on uspokaja ziemię wiatrem południowym?"
  tags: []
"Hi37,18":
  text: "Czy rozpościerałeś z nim niebiosa, które są trwałe i podobne do zwierciadła odlanego?"
  tags: []
"Hi37,19":
  text: "Poucz nas, co mamy mu powiedzieć, bo nie możemy ułożyć słów z powodu ciemności."
  tags: []
"Hi37,20":
  text: "Czy należy go powiadomić, że przemawiam? Przecież jeśli ktoś przemówi, zostanie na pewno pożarty."
  tags: []
"Hi37,21":
  text: "Teraz jednak ludzie nie mogą patrzyć na światło, gdy jaśnieje w chmurach, gdy wiatr przechodzi i rozprasza je."
  tags: []
"Hi37,22":
  text: "Od północy przychodzi jakby złoty blask, ale w Bogu jest straszliwy majestat."
  tags: []
"Hi37,23":
  text: "On jest Wszechmocny, nie możemy go doścignąć. On jest wielki w potędze i sądzie i bogaty w sprawiedliwość. Nie uciska nikogo."
  tags: []
"Hi37,24":
  text: "Dlatego boją się go ludzie. On nie ma względu na żadnego, który jest mądry w sercu."
  tags: []
