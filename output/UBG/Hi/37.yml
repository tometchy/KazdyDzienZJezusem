"Hi37,1": "I drży z tego powodu moje serce, i wyrywa się ze swego miejsca."
"Hi37,2": "Słuchajcie uważnie grzmotu jego głosu i dźwięku, który wychodzi z jego ust."
"Hi37,3": "Pod całym niebem go wypuszcza, a jego błyskawicę – na krańce ziemi."
"Hi37,4": "Po niej huczy grzmot, grzmi głosem swojego majestatu, i nie powstrzymuje ich, gdy słychać jego głos."
"Hi37,5": "Bóg cudownie grzmi swoim głosem, czyni wielkie rzeczy, których nie możemy zrozumieć."
"Hi37,6": "Mówi bowiem do śniegu: Padaj na ziemię, a także do deszczu i do ulewy jego potęgi."
"Hi37,7": "Pieczętuje rękę każdego człowieka, aby wszyscy ludzie poznali jego dzieło."
"Hi37,8": "Wtedy zwierzęta wchodzą do jaskini i zostają w swoich jamach."
"Hi37,9": "Od południa przychodzi wicher, a zima od wiatrów północnych."
"Hi37,10": "Swoim tchnieniem Bóg czyni lód i ścinają się szerokie wody."
"Hi37,11": "Także wilgocią ziemi obciąża obłok, rozpędza chmurę swoim światłem."
"Hi37,12": "One krążą według jego rady, aby czyniły wszystko, co rozkazuje na powierzchni okręgu ziemi."
"Hi37,13": "A on sprawia, że się pojawiają – czy to dla karania, czy dla swojej ziemi, czy dla okazywania miłosierdzia."
"Hi37,14": "Słuchaj tego uważnie, Hiobie; zastanów się i rozważ cudowne dzieła Boga."
"Hi37,15": "Czy wiesz, kiedy i co postanawia Bóg o tych sprawach albo kiedy rozjaśnia światło swej chmury?"
"Hi37,16": "Czy wiesz, jak wiszą chmury – cuda tego, który jest doskonały we wszelkiej wiedzy?"
"Hi37,17": "Czy wiesz, jak twoje szaty się rozgrzewają, gdy on uspokaja ziemię wiatrem południowym?"
"Hi37,18": "Czy rozpościerałeś z nim niebiosa, które są trwałe i podobne do zwierciadła odlanego?"
"Hi37,19": "Poucz nas, co mamy mu powiedzieć, bo nie możemy ułożyć słów z powodu ciemności."
"Hi37,20": "Czy należy go powiadomić, że przemawiam? Przecież jeśli ktoś przemówi, zostanie na pewno pożarty."
"Hi37,21": "Teraz jednak ludzie nie mogą patrzyć na światło, gdy jaśnieje w chmurach, gdy wiatr przechodzi i rozprasza je."
"Hi37,22": "Od północy przychodzi jakby złoty blask, ale w Bogu jest straszliwy majestat."
"Hi37,23": "On jest Wszechmocny, nie możemy go doścignąć. On jest wielki w potędze i sądzie i bogaty w sprawiedliwość. Nie uciska nikogo."
"Hi37,24": "Dlatego boją się go ludzie. On nie ma względu na żadnego, który jest mądry w sercu."
