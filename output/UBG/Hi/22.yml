"Hi22,1": "Wtedy Elifaz z Temanu odpowiedział:"
"Hi22,2": "Czy człowiek może być użyteczny dla Boga? Mądry jest raczej użyteczny dla samego siebie."
"Hi22,3": "Czy Wszechmocny ma upodobanie w tym, że jesteś sprawiedliwy? Czy ma zysk z tego, że doskonalisz swoje drogi?"
"Hi22,4": "Czy będzie cię karać z powodu strachu przed tobą? Czy stawia cię przed sądem?"
"Hi22,5": "Czy twoja niegodziwość nie jest wielka i twoje nieprawości nie mają końca?"
"Hi22,6": "Brałeś bowiem zastaw od swoich braci bez powodu i nagich z szat obdzierałeś."
"Hi22,7": "Nie podałeś wody zmęczonemu, a głodnemu odmówiłeś chleba."
"Hi22,8": "Ale możnemu dałeś ziemię, a poważany mieszkał w niej."
"Hi22,9": "Wdowy odprawiłeś z niczym, a sierotom połamałeś ramiona."
"Hi22,10": "Dlatego ogarnęły cię sidła, a trwoży cię nagły strach;"
"Hi22,11": "Lub ogarnęła cię ciemność, bo nie widzisz, a wezbrane wody okryły cię."
"Hi22,12": "Czy Bóg nie jest na wysokości niebios? Spójrz na najwyższe gwiazdy, jakże są wysoko!"
"Hi22,13": "A ty mówisz: Cóż Bóg wie? Czy przez chmury będzie sądził?"
"Hi22,14": "Obłoki są jego zasłoną, więc nie widzi, po okręgu niebios się przechadza."
"Hi22,15": "Czy zwróciłeś uwagę na stare ścieżki, którymi kroczyli niegodziwcy?"
"Hi22,16": "Oni zostali wykorzenieni przed czasem, powódź zalała ich fundamenty."
"Hi22,17": "Mówili Bogu: Odejdź od nas. Cóż może im uczynić Wszechmogący?"
"Hi22,18": "Przecież napełnił ich domy dobrem. Ale rada niegodziwych jest daleka ode mnie."
"Hi22,19": "Widzą to sprawiedliwi i cieszą się, a niewinny naśmiewa się z nich."
"Hi22,20": "Nasz dobytek bowiem nie zostaje zniszczony, lecz ich resztkę pochłonął ogień."
"Hi22,21": "Zapoznaj się z nim i zawrzyj z nim pokój, bo będzie ci się szczęściło."
"Hi22,22": "Przyjmij, proszę, prawo z jego ust i złóż jego słowa w swoim sercu."
"Hi22,23": "Jeśli się nawrócisz do Wszechmocnego, zostaniesz odbudowany i oddalisz nieprawość od swego namiotu."
"Hi22,24": "Wtedy zgromadzisz złota jak prochu, a złota z Ofiru jak kamienia z potoku."
"Hi22,25": "Wszechmocny będzie twoim złotem, srebrem i twoją siłą."
"Hi22,26": "Wtedy będziesz się rozkoszować we Wszechmocnym i podniesiesz do Boga swoje oblicze."
"Hi22,27": "Będziesz się modlił do niego, a on cię wysłucha, a ty wypełnisz swoje śluby."
"Hi22,28": "Cokolwiek postanowisz, to ci się spełni, a na twoich drogach rozbłyśnie światłość."
"Hi22,29": "Gdy inni będą upokorzeni, ty powiesz: Będzie wywyższenie, bo Bóg zbawia pokornego."
"Hi22,30": "Wybawi także tego, który nie jest bez winy, a zostanie wybawiony dzięki czystości twoich rąk."
