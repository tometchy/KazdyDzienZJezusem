"Hi22,1":
  text: "Wtedy Elifaz z Temanu odpowiedział:"
  tags: []
"Hi22,2":
  text: "Czy człowiek może być użyteczny dla Boga? Mądry jest raczej użyteczny dla samego siebie."
  tags: []
"Hi22,3":
  text: "Czy Wszechmocny ma upodobanie w tym, że jesteś sprawiedliwy? Czy ma zysk z tego, że doskonalisz swoje drogi?"
  tags: []
"Hi22,4":
  text: "Czy będzie cię karać z powodu strachu przed tobą? Czy stawia cię przed sądem?"
  tags: []
"Hi22,5":
  text: "Czy twoja niegodziwość nie jest wielka i twoje nieprawości nie mają końca?"
  tags: []
"Hi22,6":
  text: "Brałeś bowiem zastaw od swoich braci bez powodu i nagich z szat obdzierałeś."
  tags: []
"Hi22,7":
  text: "Nie podałeś wody zmęczonemu, a głodnemu odmówiłeś chleba."
  tags: []
"Hi22,8":
  text: "Ale możnemu dałeś ziemię, a poważany mieszkał w niej."
  tags: []
"Hi22,9":
  text: "Wdowy odprawiłeś z niczym, a sierotom połamałeś ramiona."
  tags: []
"Hi22,10":
  text: "Dlatego ogarnęły cię sidła, a trwoży cię nagły strach;"
  tags: []
"Hi22,11":
  text: "Lub ogarnęła cię ciemność, bo nie widzisz, a wezbrane wody okryły cię."
  tags: []
"Hi22,12":
  text: "Czy Bóg nie jest na wysokości niebios? Spójrz na najwyższe gwiazdy, jakże są wysoko!"
  tags: []
"Hi22,13":
  text: "A ty mówisz: Cóż Bóg wie? Czy przez chmury będzie sądził?"
  tags: []
"Hi22,14":
  text: "Obłoki są jego zasłoną, więc nie widzi, po okręgu niebios się przechadza."
  tags: []
"Hi22,15":
  text: "Czy zwróciłeś uwagę na stare ścieżki, którymi kroczyli niegodziwcy?"
  tags: []
"Hi22,16":
  text: "Oni zostali wykorzenieni przed czasem, powódź zalała ich fundamenty."
  tags: []
"Hi22,17":
  text: "Mówili Bogu: Odejdź od nas. Cóż może im uczynić Wszechmogący?"
  tags: []
"Hi22,18":
  text: "Przecież napełnił ich domy dobrem. Ale rada niegodziwych jest daleka ode mnie."
  tags: []
"Hi22,19":
  text: "Widzą to sprawiedliwi i cieszą się, a niewinny naśmiewa się z nich."
  tags: []
"Hi22,20":
  text: "Nasz dobytek bowiem nie zostaje zniszczony, lecz ich resztkę pochłonął ogień."
  tags: []
"Hi22,21":
  text: "Zapoznaj się z nim i zawrzyj z nim pokój, bo będzie ci się szczęściło."
  tags: []
"Hi22,22":
  text: "Przyjmij, proszę, prawo z jego ust i złóż jego słowa w swoim sercu."
  tags: []
"Hi22,23":
  text: "Jeśli się nawrócisz do Wszechmocnego, zostaniesz odbudowany i oddalisz nieprawość od swego namiotu."
  tags: []
"Hi22,24":
  text: "Wtedy zgromadzisz złota jak prochu, a złota z Ofiru jak kamienia z potoku."
  tags: []
"Hi22,25":
  text: "Wszechmocny będzie twoim złotem, srebrem i twoją siłą."
  tags: []
"Hi22,26":
  text: "Wtedy będziesz się rozkoszować we Wszechmocnym i podniesiesz do Boga swoje oblicze."
  tags: []
"Hi22,27":
  text: "Będziesz się modlił do niego, a on cię wysłucha, a ty wypełnisz swoje śluby."
  tags: []
"Hi22,28":
  text: "Cokolwiek postanowisz, to ci się spełni, a na twoich drogach rozbłyśnie światłość."
  tags: []
"Hi22,29":
  text: "Gdy inni będą upokorzeni, ty powiesz: Będzie wywyższenie, bo Bóg zbawia pokornego."
  tags: []
"Hi22,30":
  text: "Wybawi także tego, który nie jest bez winy, a zostanie wybawiony dzięki czystości twoich rąk."
  tags: []
