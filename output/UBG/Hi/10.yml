"Hi10,1": "Moja dusza zmęczona jest życiem; dam upust swemu narzekaniu, będę mówił w goryczy swej duszy."
"Hi10,2": "Powiem Bogu: Nie potępiaj mnie. Oznajmij mi, czemu wiedziesz ze mną spór?"
"Hi10,3": "Czy dobrze ci z tym, że mnie uciskasz, że odrzucasz dzieło swoich rąk i sprzyjasz radzie niegodziwych?"
"Hi10,4": "Czy masz oczy cielesne? Czy widzisz, jak człowiek widzi?"
"Hi10,5": "Czy twoje dni są jak dni człowieka, a twoje lata jak lata ludzkie;"
"Hi10,6": "Że się wywiadujesz o moją nieprawość i dochodzisz mojego grzechu?"
"Hi10,7": "Ty wiesz, że nie jestem niegodziwy i nikt nie wyrwie mnie z twoich rąk."
"Hi10,8": "Twoje ręce ukształtowały mnie i uczyniły mnie całego ze wszystkich stron, lecz mnie niszczysz."
"Hi10,9": "Pamiętaj, proszę, że ulepiłeś mnie jak glinę; czy obrócisz mnie w proch?"
"Hi10,10": "Czy nie wylałeś mnie jak mleko i nie sprawiłeś, że jak ser stężałem?"
"Hi10,11": "Przyoblekłeś mnie skórą i ciałem, a kośćmi i żyłami pospinałeś mnie."
"Hi10,12": "Obdarzyłeś mnie życiem i miłosierdziem, a twoja opatrzność strzegła mego ducha."
"Hi10,13": "I chociaż ukryłeś to wszystko w swoim sercu, wiem jednak, że to jest z twojej woli."
"Hi10,14": "Jeśli grzeszę, ty to spostrzegasz i nie uwolnisz mnie od mojej nieprawości."
"Hi10,15": "Jeśli jestem niegodziwy, biada mi, a choćbym też był sprawiedliwy, nie podniosę swojej głowy. Jestem syty hańby, zważ na moje utrapienie;"
"Hi10,16": "Gdyż go przybywa; gonisz mnie jak okrutny lew i zachowujesz się dziwnie wobec mnie."
"Hi10,17": "Stawiasz przeciwko mnie nowych świadków i pomnażasz nade mną swój gniew; wojsko za wojskiem naciera na mnie."
"Hi10,18": "Czemu wyprowadziłeś mnie z łona? Obym umarł i nie widziało mnie żadne oko!"
"Hi10,19": "Byłbym, jakby mnie nie było, od łona zanieśliby mnie do grobu!"
"Hi10,20": "Czy nie zostało mi niewiele dni? Przestań więc i odejdź ode mnie, abym nabrał trochę otuchy;"
"Hi10,21": "Zanim odejdę tam, skąd już nie powrócę, do ziemi ciemności i cienia śmierci;"
"Hi10,22": "Do ziemi ciemnej jak noc i do cienia śmierci i bezładu, gdzie świeci tylko ciemność."
