"Hi10,1":
  text: "Moja dusza zmęczona jest życiem; dam upust swemu narzekaniu, będę mówił w goryczy swej duszy."
  tags: []
"Hi10,2":
  text: "Powiem Bogu: Nie potępiaj mnie. Oznajmij mi, czemu wiedziesz ze mną spór?"
  tags: []
"Hi10,3":
  text: "Czy dobrze ci z tym, że mnie uciskasz, że odrzucasz dzieło swoich rąk i sprzyjasz radzie niegodziwych?"
  tags: []
"Hi10,4":
  text: "Czy masz oczy cielesne? Czy widzisz, jak człowiek widzi?"
  tags: []
"Hi10,5":
  text: "Czy twoje dni są jak dni człowieka, a twoje lata jak lata ludzkie;"
  tags: []
"Hi10,6":
  text: "Że się wywiadujesz o moją nieprawość i dochodzisz mojego grzechu?"
  tags: []
"Hi10,7":
  text: "Ty wiesz, że nie jestem niegodziwy i nikt nie wyrwie mnie z twoich rąk."
  tags: []
"Hi10,8":
  text: "Twoje ręce ukształtowały mnie i uczyniły mnie całego ze wszystkich stron, lecz mnie niszczysz."
  tags: []
"Hi10,9":
  text: "Pamiętaj, proszę, że ulepiłeś mnie jak glinę; czy obrócisz mnie w proch?"
  tags: []
"Hi10,10":
  text: "Czy nie wylałeś mnie jak mleko i nie sprawiłeś, że jak ser stężałem?"
  tags: []
"Hi10,11":
  text: "Przyoblekłeś mnie skórą i ciałem, a kośćmi i żyłami pospinałeś mnie."
  tags: []
"Hi10,12":
  text: "Obdarzyłeś mnie życiem i miłosierdziem, a twoja opatrzność strzegła mego ducha."
  tags: []
"Hi10,13":
  text: "I chociaż ukryłeś to wszystko w swoim sercu, wiem jednak, że to jest z twojej woli."
  tags: []
"Hi10,14":
  text: "Jeśli grzeszę, ty to spostrzegasz i nie uwolnisz mnie od mojej nieprawości."
  tags: []
"Hi10,15":
  text: "Jeśli jestem niegodziwy, biada mi, a choćbym też był sprawiedliwy, nie podniosę swojej głowy. Jestem syty hańby, zważ na moje utrapienie;"
  tags: []
"Hi10,16":
  text: "Gdyż go przybywa; gonisz mnie jak okrutny lew i zachowujesz się dziwnie wobec mnie."
  tags: []
"Hi10,17":
  text: "Stawiasz przeciwko mnie nowych świadków i pomnażasz nade mną swój gniew; wojsko za wojskiem naciera na mnie."
  tags: []
"Hi10,18":
  text: "Czemu wyprowadziłeś mnie z łona? Obym umarł i nie widziało mnie żadne oko!"
  tags: []
"Hi10,19":
  text: "Byłbym, jakby mnie nie było, od łona zanieśliby mnie do grobu!"
  tags: []
"Hi10,20":
  text: "Czy nie zostało mi niewiele dni? Przestań więc i odejdź ode mnie, abym nabrał trochę otuchy;"
  tags: []
"Hi10,21":
  text: "Zanim odejdę tam, skąd już nie powrócę, do ziemi ciemności i cienia śmierci;"
  tags: []
"Hi10,22":
  text: "Do ziemi ciemnej jak noc i do cienia śmierci i bezładu, gdzie świeci tylko ciemność."
  tags: []
