"Hi24,1":
  text: "Czemu, skoro od Wszechmocnego nie są zakryte czasy, ci, którzy go znają, nie widzą jego dni?"
  tags: []
"Hi24,2":
  text: "Niektórzy przesuwają granice, zabierają trzody i pasą je."
  tags: []
"Hi24,3":
  text: "Osła sierot pędzą i wołu wdowy biorą w zastaw."
  tags: []
"Hi24,4":
  text: "Spychają z drogi ubogich, biedni ziemi muszą się kryć razem."
  tags: []
"Hi24,5":
  text: "Oto jak dzikie osły na pustyni wychodzą oni do swojej pracy, wstając rano na łup. Pustynia wydaje chleb dla nich oraz ich dzieci."
  tags: []
"Hi24,6":
  text: "Na polu żną zboże i zbierają grona w winnicy niegodziwych."
  tags: []
"Hi24,7":
  text: "Nagich zmuszają do nocowania bez ubrania, tak że nie mają czym się nakryć w czasie chłodów;"
  tags: []
"Hi24,8":
  text: "Przemoczeni ulewą górską, bez schronienia przytulają się do skały."
  tags: []
"Hi24,9":
  text: "Odrywają od piersi sieroty, od ubogiego biorą zastaw."
  tags: []
"Hi24,10":
  text: "Nagiego zmuszają do chodzenia bez ubrania, a głodnym zabierają snopy."
  tags: []
"Hi24,11":
  text: "A ci, którzy pośród ich murów wyciskają oliwę i tłoczą w prasach, są spragnieni."
  tags: []
"Hi24,12":
  text: "Ludzie w mieście wzdychają, dusze śmiertelnie rannych wołają, a Bóg im w tym nie przeszkadza."
  tags: []
"Hi24,13":
  text: "To są ci, którzy się sprzeciwiają światłości, nie znają jej dróg ani nie trwają na jej ścieżkach."
  tags: []
"Hi24,14":
  text: "Morderca wstaje przed świtem i zabija ubogiego i potrzebującego, a w nocy jest jak złodziej."
  tags: []
"Hi24,15":
  text: "Oko cudzołożnika czeka na zmierzch, mówiąc: Nikt mnie nie zobaczy, i zakrywa on swoje oblicze."
  tags: []
"Hi24,16":
  text: "W ciemności podkopują domy, które sobie za dnia oznaczyli, nie znają światła."
  tags: []
"Hi24,17":
  text: "Dla nich bowiem poranek jest jak cień śmierci. Jeśli ktoś ich rozpozna, ogarnia ich strach cienia śmierci."
  tags: []
"Hi24,18":
  text: "Lekko unoszą się na wodach, przeklęty jest ich dział na ziemi, nie patrzą na drogę do winnic."
  tags: []
"Hi24,19":
  text: "Jak susza i upał trawią wody śniegu, tak grób trawi grzeszników."
  tags: []
"Hi24,20":
  text: "Zapomni o nim łono jego matki, a robak będzie się nim karmić jak słodyczą; nikt go więcej nie wspomni, a nieprawość zostanie połamana jak drzewo."
  tags: []
"Hi24,21":
  text: "Dręczy niepłodną, która nie rodziła, a wdowie nie czyni dobra."
  tags: []
"Hi24,22":
  text: "Pociąga też mocarzy swoją siłą; gdy powstaje, nikt nie jest pewien swego życia."
  tags: []
"Hi24,23":
  text: "Dano mu, że może oprzeć się bezpiecznie; jego oczy jednak patrzą na ich drogi."
  tags: []
"Hi24,24":
  text: "Na chwilę zostali wywyższeni, ale już ich nie ma; zostali poniżeni i ściśnieni jak wszyscy inni, a jak wierzch kłosa zostaną wycięci."
  tags: []
"Hi24,25":
  text: "A jeśli tak nie jest, kto mi udowodni kłamstwo i obróci wniwecz moje słowa?"
  tags: []
