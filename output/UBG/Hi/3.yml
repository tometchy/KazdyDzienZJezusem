"Hi3,1":
  text: "Potem Hiob otworzył swoje usta i przeklinał swój dzień."
  tags: []
"Hi3,2":
  text: "Hiob odezwał się i zawołał:"
  tags: []
"Hi3,3":
  text: "Niech zginie dzień, w którym się urodziłem, i noc, w którą powiedziano: Poczęty mężczyzna."
  tags: []
"Hi3,4":
  text: "Niech ten dzień stanie się ciemnością, niech o niego nie troszczy się Bóg z wysokości i nie oświetla go światłość."
  tags: []
"Hi3,5":
  text: "Niech go pokryje ciemność i cień śmierci, niech go ogarnie obłok i przerazi mrok dnia."
  tags: []
"Hi3,6":
  text: "Niech tą nocą zawładnie ciemność, niech nie będzie liczona wśród dni roku i nie wejdzie w liczbę miesięcy."
  tags: []
"Hi3,7":
  text: "Niech ta noc będzie samotna, niech nie będzie w niej radosnego śpiewu."
  tags: []
"Hi3,8":
  text: "Niech przeklną ją ci, którzy przeklinają dzień, którzy są gotowi podnieść swój lament."
  tags: []
"Hi3,9":
  text: "Niech gwiazdy zaćmią się o zmierzchu, niech nie doczeka się światła ani nie zobaczy zorzy porannej;"
  tags: []
"Hi3,10":
  text: "Bo nie zamknęła drzwi łona mej matki i nie ukryła smutku przed moimi oczami."
  tags: []
"Hi3,11":
  text: "Czemu nie umarłem w łonie? Czemu nie zginąłem, kiedy wyszedłem z łona?"
  tags: []
"Hi3,12":
  text: "Czemu przyjęły mnie kolana? Czemu przyjęły mnie piersi, abym mógł je ssać?"
  tags: []
"Hi3,13":
  text: "Teraz bowiem leżałbym i trwał w spokoju, spałbym i odpoczywał;"
  tags: []
"Hi3,14":
  text: "Z królami i z doradcami ziemi, którzy sobie budowali opustoszałe miejsca;"
  tags: []
"Hi3,15":
  text: "Albo z książętami, którzy mieli złoto i napełnili swe domy srebrem;"
  tags: []
"Hi3,16":
  text: "Albo czemu nie stałem się jak ukryty, martwy płód, jak niemowlęta, które nie widziały światła?"
  tags: []
"Hi3,17":
  text: "Tam bezbożni przestają straszyć, tam pozbawieni siły odpoczywają."
  tags: []
"Hi3,18":
  text: "Tam więźniowie razem wypoczywają i nie słyszą głosu ciemięzcy."
  tags: []
"Hi3,19":
  text: "Mały i wielki są tam sobie równi i niewolnik jest wolny od swego pana."
  tags: []
"Hi3,20":
  text: "Czemu nędznemu dane jest światło, a życie tym, którzy są rozgoryczeni na duszy;"
  tags: []
"Hi3,21":
  text: "Którzy z tęsknotą wypatrują śmierci, a ta nie przychodzi, choć jej szukają pilniej niż ukrytych skarbów;"
  tags: []
"Hi3,22":
  text: "Którzy wielce się radują i cieszą, kiedy grób znajdują?"
  tags: []
"Hi3,23":
  text: "Czemu dane jest światło człowiekowi, którego droga jest ukryta i którego Bóg osaczył?"
  tags: []
"Hi3,24":
  text: "Kiedy bowiem mam jeść, przychodzi moje wzdychanie, a moje jęki rozchodzą się jak woda;"
  tags: []
"Hi3,25":
  text: "Bo to, czego się bałem, spotkało mnie, a to, czego się obawiałem, spadło na mnie."
  tags: []
"Hi3,26":
  text: "Nie byłem bezpieczny, nie miałem spokoju ani odpoczynku, a jednak nadeszła trwoga."
  tags: []
