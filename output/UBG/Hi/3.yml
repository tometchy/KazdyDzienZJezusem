"Hi3,1": "Potem Hiob otworzył swoje usta i przeklinał swój dzień."
"Hi3,2": "Hiob odezwał się i zawołał:"
"Hi3,3": "Niech zginie dzień, w którym się urodziłem, i noc, w którą powiedziano: Poczęty mężczyzna."
"Hi3,4": "Niech ten dzień stanie się ciemnością, niech o niego nie troszczy się Bóg z wysokości i nie oświetla go światłość."
"Hi3,5": "Niech go pokryje ciemność i cień śmierci, niech go ogarnie obłok i przerazi mrok dnia."
"Hi3,6": "Niech tą nocą zawładnie ciemność, niech nie będzie liczona wśród dni roku i nie wejdzie w liczbę miesięcy."
"Hi3,7": "Niech ta noc będzie samotna, niech nie będzie w niej radosnego śpiewu."
"Hi3,8": "Niech przeklną ją ci, którzy przeklinają dzień, którzy są gotowi podnieść swój lament."
"Hi3,9": "Niech gwiazdy zaćmią się o zmierzchu, niech nie doczeka się światła ani nie zobaczy zorzy porannej;"
"Hi3,10": "Bo nie zamknęła drzwi łona mej matki i nie ukryła smutku przed moimi oczami."
"Hi3,11": "Czemu nie umarłem w łonie? Czemu nie zginąłem, kiedy wyszedłem z łona?"
"Hi3,12": "Czemu przyjęły mnie kolana? Czemu przyjęły mnie piersi, abym mógł je ssać?"
"Hi3,13": "Teraz bowiem leżałbym i trwał w spokoju, spałbym i odpoczywał;"
"Hi3,14": "Z królami i z doradcami ziemi, którzy sobie budowali opustoszałe miejsca;"
"Hi3,15": "Albo z książętami, którzy mieli złoto i napełnili swe domy srebrem;"
"Hi3,16": "Albo czemu nie stałem się jak ukryty, martwy płód, jak niemowlęta, które nie widziały światła?"
"Hi3,17": "Tam bezbożni przestają straszyć, tam pozbawieni siły odpoczywają."
"Hi3,18": "Tam więźniowie razem wypoczywają i nie słyszą głosu ciemięzcy."
"Hi3,19": "Mały i wielki są tam sobie równi i niewolnik jest wolny od swego pana."
"Hi3,20": "Czemu nędznemu dane jest światło, a życie tym, którzy są rozgoryczeni na duszy;"
"Hi3,21": "Którzy z tęsknotą wypatrują śmierci, a ta nie przychodzi, choć jej szukają pilniej niż ukrytych skarbów;"
"Hi3,22": "Którzy wielce się radują i cieszą, kiedy grób znajdują?"
"Hi3,23": "Czemu dane jest światło człowiekowi, którego droga jest ukryta i którego Bóg osaczył?"
"Hi3,24": "Kiedy bowiem mam jeść, przychodzi moje wzdychanie, a moje jęki rozchodzą się jak woda;"
"Hi3,25": "Bo to, czego się bałem, spotkało mnie, a to, czego się obawiałem, spadło na mnie."
"Hi3,26": "Nie byłem bezpieczny, nie miałem spokoju ani odpoczynku, a jednak nadeszła trwoga."
