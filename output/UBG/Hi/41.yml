"Hi41,1":
  text: "Czy lewiatana wyciągniesz wędką? Czy za jego język wyciągniesz go sznurem opuszczonym?"
  tags: []
"Hi41,2":
  text: "Czy przewleczesz hak przez jego nozdrza? Czy kolcem przebijesz mu szczęki?"
  tags: []
"Hi41,3":
  text: "Czy będzie cię błagać? Czy będzie z tobą rozmawiał łagodnie?"
  tags: []
"Hi41,4":
  text: "Czy zawrze z tobą przymierze? Czy przyjmiesz go za sługę na zawsze?"
  tags: []
"Hi41,5":
  text: "Czy będziesz z nim igrał jak z ptaszkiem? Czy uwiążesz go dla swoich córek?"
  tags: []
"Hi41,6":
  text: "Czy twoi towarzysze wyprawią sobie z niego ucztę? Czy podzielą go między siebie kupcy?"
  tags: []
"Hi41,7":
  text: "Czy poprzebijasz jego skórę grotami albo jego głowę harpunami?"
  tags: []
"Hi41,8":
  text: "Połóż tylko rękę na niego i wspomnij o walce, więcej tego nie zrobisz."
  tags: []
"Hi41,9":
  text: "Oto nadzieja pojmania go jest złudna. Czy na sam jego widok nie zostanie człowiek powalony?"
  tags: []
"Hi41,10":
  text: "Nikt nie odważy się go obudzić. Kto zdoła więc stanąć przede mną?"
  tags: []
"Hi41,11":
  text: "Kto mi coś dał, abym mu odpłacił? Cokolwiek znajduje się pod całym niebem należy do mnie."
  tags: []
"Hi41,12":
  text: "Nie będę milczał o jego członkach ani o jego potędze, ani o jego wspaniałej budowie."
  tags: []
"Hi41,13":
  text: "Kto odkryje wierzch jego szaty? Kto przystąpi do niego z podwójnym wędzidłem?"
  tags: []
"Hi41,14":
  text: "Kto otworzy wrota jego paszczy? Groza roztacza się wokół jego zębów."
  tags: []
"Hi41,15":
  text: "Jego łuski to jego pycha, ściśle spięte razem jakby pieczęcią."
  tags: []
"Hi41,16":
  text: "Jedna do drugiej tak przylega, że powietrze nie wejdzie między nie."
  tags: []
"Hi41,17":
  text: "Jedna z drugą jest spojona, są tak złączone, że nie można ich rozdzielić."
  tags: []
"Hi41,18":
  text: "Przez jego kichanie błyszczy światło, a jego oczy są jak powieki zorzy."
  tags: []
"Hi41,19":
  text: "Z jego paszczy wychodzą pochodnie, tryskają iskry ognia."
  tags: []
"Hi41,20":
  text: "Z jego nozdrzy wychodzi dym jak z wrzącego garnca lub kotła."
  tags: []
"Hi41,21":
  text: "Jego oddech rozpala węgle, z jego paszczy wychodzi płomień."
  tags: []
"Hi41,22":
  text: "W jego szyi spoczywa moc i przed nim ucieka smutek."
  tags: []
"Hi41,23":
  text: "Warstwy jego ciała są spojone, tak twarde, że się nie poruszają."
  tags: []
"Hi41,24":
  text: "Jego serce jest twarde jak kamień, tak twarde jak część dolnego kamienia młyńskiego."
  tags: []
"Hi41,25":
  text: "Gdy się podnosi, drżą mocarze, a od strachu oczyszczają się."
  tags: []
"Hi41,26":
  text: "Miecz, który go dosięga, nie ostaje się, podobnie drzewce, strzała i pancerz."
  tags: []
"Hi41,27":
  text: "Żelazo uważa za słomę, a miedź za zbutwiałe drewno."
  tags: []
"Hi41,28":
  text: "Strzała nie spłoszy go, a kamienie z procy są dla niego jak źdźbło."
  tags: []
"Hi41,29":
  text: "Oszczep uważa za słomę, a drwi sobie z szarpania włócznią."
  tags: []
"Hi41,30":
  text: "Pod nim są ostre skorupy; w błocie ścieli sobie wszelkimi ostrymi rzeczami."
  tags: []
"Hi41,31":
  text: "Sprawia, że głębiny wrą jak kocioł, a morze mąci jak w moździerzu."
  tags: []
"Hi41,32":
  text: "Zostawia za sobą błyszczącą ścieżkę, tak że się wydaje, że głębiny mają siwiznę."
  tags: []
"Hi41,33":
  text: "Nie ma na ziemi jemu podobnego, który został tak stworzony, że niczego się nie boi."
  tags: []
"Hi41,34":
  text: "Lekceważy wszelką wysoką rzecz. On jest królem nad wszystkimi synami pychy."
  tags: []
