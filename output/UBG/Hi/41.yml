"Hi41,1": "Czy lewiatana wyciągniesz wędką? Czy za jego język wyciągniesz go sznurem opuszczonym?"
"Hi41,2": "Czy przewleczesz hak przez jego nozdrza? Czy kolcem przebijesz mu szczęki?"
"Hi41,3": "Czy będzie cię błagać? Czy będzie z tobą rozmawiał łagodnie?"
"Hi41,4": "Czy zawrze z tobą przymierze? Czy przyjmiesz go za sługę na zawsze?"
"Hi41,5": "Czy będziesz z nim igrał jak z ptaszkiem? Czy uwiążesz go dla swoich córek?"
"Hi41,6": "Czy twoi towarzysze wyprawią sobie z niego ucztę? Czy podzielą go między siebie kupcy?"
"Hi41,7": "Czy poprzebijasz jego skórę grotami albo jego głowę harpunami?"
"Hi41,8": "Połóż tylko rękę na niego i wspomnij o walce, więcej tego nie zrobisz."
"Hi41,9": "Oto nadzieja pojmania go jest złudna. Czy na sam jego widok nie zostanie człowiek powalony?"
"Hi41,10": "Nikt nie odważy się go obudzić. Kto zdoła więc stanąć przede mną?"
"Hi41,11": "Kto mi coś dał, abym mu odpłacił? Cokolwiek znajduje się pod całym niebem należy do mnie."
"Hi41,12": "Nie będę milczał o jego członkach ani o jego potędze, ani o jego wspaniałej budowie."
"Hi41,13": "Kto odkryje wierzch jego szaty? Kto przystąpi do niego z podwójnym wędzidłem?"
"Hi41,14": "Kto otworzy wrota jego paszczy? Groza roztacza się wokół jego zębów."
"Hi41,15": "Jego łuski to jego pycha, ściśle spięte razem jakby pieczęcią."
"Hi41,16": "Jedna do drugiej tak przylega, że powietrze nie wejdzie między nie."
"Hi41,17": "Jedna z drugą jest spojona, są tak złączone, że nie można ich rozdzielić."
"Hi41,18": "Przez jego kichanie błyszczy światło, a jego oczy są jak powieki zorzy."
"Hi41,19": "Z jego paszczy wychodzą pochodnie, tryskają iskry ognia."
"Hi41,20": "Z jego nozdrzy wychodzi dym jak z wrzącego garnca lub kotła."
"Hi41,21": "Jego oddech rozpala węgle, z jego paszczy wychodzi płomień."
"Hi41,22": "W jego szyi spoczywa moc i przed nim ucieka smutek."
"Hi41,23": "Warstwy jego ciała są spojone, tak twarde, że się nie poruszają."
"Hi41,24": "Jego serce jest twarde jak kamień, tak twarde jak część dolnego kamienia młyńskiego."
"Hi41,25": "Gdy się podnosi, drżą mocarze, a od strachu oczyszczają się."
"Hi41,26": "Miecz, który go dosięga, nie ostaje się, podobnie drzewce, strzała i pancerz."
"Hi41,27": "Żelazo uważa za słomę, a miedź za zbutwiałe drewno."
"Hi41,28": "Strzała nie spłoszy go, a kamienie z procy są dla niego jak źdźbło."
"Hi41,29": "Oszczep uważa za słomę, a drwi sobie z szarpania włócznią."
"Hi41,30": "Pod nim są ostre skorupy; w błocie ścieli sobie wszelkimi ostrymi rzeczami."
"Hi41,31": "Sprawia, że głębiny wrą jak kocioł, a morze mąci jak w moździerzu."
"Hi41,32": "Zostawia za sobą błyszczącą ścieżkę, tak że się wydaje, że głębiny mają siwiznę."
"Hi41,33": "Nie ma na ziemi jemu podobnego, który został tak stworzony, że niczego się nie boi."
"Hi41,34": "Lekceważy wszelką wysoką rzecz. On jest królem nad wszystkimi synami pychy."
