"Hi18,1":
  text: "Wtedy Bildad z Szuach odpowiedział:"
  tags: []
"Hi18,2":
  text: "Kiedy wreszcie położycie kres tym słowom? Pomyślcie, potem będziemy mówić."
  tags: []
"Hi18,3":
  text: "Czemu uważacie nas za bydło? Czemu jesteśmy obrzydliwi w waszych oczach?"
  tags: []
"Hi18,4":
  text: "Ty, który szarpiesz gniewem swą duszę – czy z twojego powodu będzie opuszczona ziemia i skały będą przesunięte ze swego miejsca?"
  tags: []
"Hi18,5":
  text: "Tak, światło niegodziwych zgaśnie, a iskra jego ognia już nie zaświeci."
  tags: []
"Hi18,6":
  text: "Światło jego przybytku się zaćmi i jego pochodnia nad nim zagaśnie."
  tags: []
"Hi18,7":
  text: "Kroki jego siły będą skrępowane, jego własna rada powali go."
  tags: []
"Hi18,8":
  text: "Jego nogi bowiem zawiodą go w sieć, chodzi po sidłach."
  tags: []
"Hi18,9":
  text: "Sidło uchwyci go za piętę i przemoże go łupieżca."
  tags: []
"Hi18,10":
  text: "Sidło dla niego ukryte jest w ziemi, a pułapka na niego – na drodze."
  tags: []
"Hi18,11":
  text: "Zewsząd będą go przerażać strachy, ścigają go na każdym kroku."
  tags: []
"Hi18,12":
  text: "Głód osłabi jego siły i zniszczenie będzie czyhało u jego boku."
  tags: []
"Hi18,13":
  text: "Pożre żyły jego skóry, pierworodny śmierci pożre jego członki."
  tags: []
"Hi18,14":
  text: "Jego ufność będzie wykorzeniona z jego namiotu i zostanie on przyprowadzony do króla strachów."
  tags: []
"Hi18,15":
  text: "Strach będzie mieszkał w jego namiocie, bo ten nie należy do niego; jego mieszkanie będzie posypane siarką."
  tags: []
"Hi18,16":
  text: "Od spodu uschną jego korzenie, a z wierzchu będzie obcięta jego gałąź."
  tags: []
"Hi18,17":
  text: "Pamięć o nim zginie z ziemi, a jego imienia nie wspomną na ulicach."
  tags: []
"Hi18,18":
  text: "Wypędzą go ze światła do ciemności i wyrzucą go z okręgu świata."
  tags: []
"Hi18,19":
  text: "Nie będzie miał syna ani wnuka pośród swego ludu i nikt nie pozostanie w jego mieszkaniach."
  tags: []
"Hi18,20":
  text: "Ci, którzy przyjdą po nim, osłupieją na jego dzień, tak jak poprzednich ogarnął strach."
  tags: []
"Hi18,21":
  text: "Takie są mieszkania niegodziwych i takie jest miejsce tego, który nie zna Boga."
  tags: []
