"Hi18,1": "Wtedy Bildad z Szuach odpowiedział:"
"Hi18,2": "Kiedy wreszcie położycie kres tym słowom? Pomyślcie, potem będziemy mówić."
"Hi18,3": "Czemu uważacie nas za bydło? Czemu jesteśmy obrzydliwi w waszych oczach?"
"Hi18,4": "Ty, który szarpiesz gniewem swą duszę – czy z twojego powodu będzie opuszczona ziemia i skały będą przesunięte ze swego miejsca?"
"Hi18,5": "Tak, światło niegodziwych zgaśnie, a iskra jego ognia już nie zaświeci."
"Hi18,6": "Światło jego przybytku się zaćmi i jego pochodnia nad nim zagaśnie."
"Hi18,7": "Kroki jego siły będą skrępowane, jego własna rada powali go."
"Hi18,8": "Jego nogi bowiem zawiodą go w sieć, chodzi po sidłach."
"Hi18,9": "Sidło uchwyci go za piętę i przemoże go łupieżca."
"Hi18,10": "Sidło dla niego ukryte jest w ziemi, a pułapka na niego – na drodze."
"Hi18,11": "Zewsząd będą go przerażać strachy, ścigają go na każdym kroku."
"Hi18,12": "Głód osłabi jego siły i zniszczenie będzie czyhało u jego boku."
"Hi18,13": "Pożre żyły jego skóry, pierworodny śmierci pożre jego członki."
"Hi18,14": "Jego ufność będzie wykorzeniona z jego namiotu i zostanie on przyprowadzony do króla strachów."
"Hi18,15": "Strach będzie mieszkał w jego namiocie, bo ten nie należy do niego; jego mieszkanie będzie posypane siarką."
"Hi18,16": "Od spodu uschną jego korzenie, a z wierzchu będzie obcięta jego gałąź."
"Hi18,17": "Pamięć o nim zginie z ziemi, a jego imienia nie wspomną na ulicach."
"Hi18,18": "Wypędzą go ze światła do ciemności i wyrzucą go z okręgu świata."
"Hi18,19": "Nie będzie miał syna ani wnuka pośród swego ludu i nikt nie pozostanie w jego mieszkaniach."
"Hi18,20": "Ci, którzy przyjdą po nim, osłupieją na jego dzień, tak jak poprzednich ogarnął strach."
"Hi18,21": "Takie są mieszkania niegodziwych i takie jest miejsce tego, który nie zna Boga."
