"Hi15,1": "Wtedy Elifaz z Temanu odpowiedział:"
"Hi15,2": "Czy mądry człowiek ma odpowiadać próżną wiedzą i napełniać swoje wnętrze wiatrem wschodnim?"
"Hi15,3": "Czy ma się spierać słowami bezużytecznymi i mową, która nie przynosi pożytku?"
"Hi15,4": "Ty nawet odrzucasz bojaźń i powstrzymujesz modlitwę przed Bogiem."
"Hi15,5": "Twoje usta bowiem pokazują twą nieprawość, posługujesz się mową przebiegłych."
"Hi15,6": "Twoje usta cię potępiają, a nie ja; twoje wargi świadczą przeciwko tobie."
"Hi15,7": "Czy jesteś pierwszym człowiekiem, który się urodził? Czy zostałeś stworzony przed pagórkami?"
"Hi15,8": "Czy słuchałeś tajemnic Boga? Czy tylko w tobie jest mądrość?"
"Hi15,9": "Cóż ty wiesz, czego my nie wiemy? Cóż ty rozumiesz, czego my nie rozumiemy?"
"Hi15,10": "Wśród nas są i sędziwi, i starcy, starsi od twego ojca."
"Hi15,11": "Czy lekceważysz pociechę Boga? Czy masz w sobie coś tajemnego?"
"Hi15,12": "Czemu cię tak uniosło twoje serce? Czemu swoimi oczami tak mrugasz;"
"Hi15,13": "Że zwracasz przeciwko Bogu swego ducha i wypuszczasz ze swoich ust takie słowa?"
"Hi15,14": "Czym jest człowiek, aby miał być czysty, urodzony z kobiety, aby miał być sprawiedliwy?"
"Hi15,15": "Oto nawet swoim świętym on nie ufa i niebiosa nie są czyste w jego oczach."
"Hi15,16": "Tym bardziej obrzydły i nikczemny jest człowiek, który pije nieprawość jak wodę."
"Hi15,17": "Wykażę ci, tylko mnie posłuchaj; opowiem ci, co widziałem;"
"Hi15,18": "Co mądrzy powiedzieli, a nie zataili, co mieli od przodków swoich;"
"Hi15,19": "Im samym dana była ziemia i żaden obcy nie przeszedł wśród nich."
"Hi15,20": "Niegodziwy żyje w udręce przez wszystkie swoje dni i niewiele lat wyznaczono ciemięzcy."
"Hi15,21": "Głos przerażenia brzmi w jego uszach, że w czasie pokoju napadnie go niszczyciel."
"Hi15,22": "Nie wierzy, że miałby wrócić z ciemności, obawia się zewsząd miecza."
"Hi15,23": "Tuła się za chlebem, pytając, gdzie go znaleźć. Wie, że dzień ciemności został dla niego przygotowany."
"Hi15,24": "Przeraża go utrapienie i ucisk; wzmocnią się przeciwko niemu jak król gotowy do boju."
"Hi15,25": "Wyciągnął bowiem swą rękę przeciw Bogu, przeciwko Wszechmocnemu się umocnił."
"Hi15,26": "Naciera na niego, na jego szyję, która jest okryta pod gęstymi grzbietami jego tarcz."
"Hi15,27": "Swoją twarz kryje bowiem w tłuszczu, a jego tusza zaokrągliła się na lędźwiach."
"Hi15,28": "Mieszka w opustoszałych miastach i domach, w których nikt nie przebywa, które niebawem staną się ruiną."
"Hi15,29": "Nie wzbogaci się i nie przetrwa jego majątek ani jego doskonałość nie rozszerzy się na ziemi."
"Hi15,30": "Nie wyjdzie z ciemności, płomień ususzy jego latorośle, a zginie od tchnienia jego ust."
"Hi15,31": "Niech złudzony nie ufa marności, gdyż marność będzie jego zapłatą."
"Hi15,32": "Przed wypełnieniem jego dni nastąpi, a jego gałązka nie zakwitnie."
"Hi15,33": "Jak winna latorośl utraci swoje niedojrzałe grona, jak oliwka zrzuci swój kwiat."
"Hi15,34": "Zgromadzenie obłudników będzie bowiem spustoszone, a ogień strawi namioty przekupstwa."
"Hi15,35": "Poczęli krzywdę i urodzili nieprawość, a ich łono przygotowuje oszustwo."
