"Hi15,1":
  text: "Wtedy Elifaz z Temanu odpowiedział:"
  tags: []
"Hi15,2":
  text: "Czy mądry człowiek ma odpowiadać próżną wiedzą i napełniać swoje wnętrze wiatrem wschodnim?"
  tags: []
"Hi15,3":
  text: "Czy ma się spierać słowami bezużytecznymi i mową, która nie przynosi pożytku?"
  tags: []
"Hi15,4":
  text: "Ty nawet odrzucasz bojaźń i powstrzymujesz modlitwę przed Bogiem."
  tags: []
"Hi15,5":
  text: "Twoje usta bowiem pokazują twą nieprawość, posługujesz się mową przebiegłych."
  tags: []
"Hi15,6":
  text: "Twoje usta cię potępiają, a nie ja; twoje wargi świadczą przeciwko tobie."
  tags: []
"Hi15,7":
  text: "Czy jesteś pierwszym człowiekiem, który się urodził? Czy zostałeś stworzony przed pagórkami?"
  tags: []
"Hi15,8":
  text: "Czy słuchałeś tajemnic Boga? Czy tylko w tobie jest mądrość?"
  tags: []
"Hi15,9":
  text: "Cóż ty wiesz, czego my nie wiemy? Cóż ty rozumiesz, czego my nie rozumiemy?"
  tags: []
"Hi15,10":
  text: "Wśród nas są i sędziwi, i starcy, starsi od twego ojca."
  tags: []
"Hi15,11":
  text: "Czy lekceważysz pociechę Boga? Czy masz w sobie coś tajemnego?"
  tags: []
"Hi15,12":
  text: "Czemu cię tak uniosło twoje serce? Czemu swoimi oczami tak mrugasz;"
  tags: []
"Hi15,13":
  text: "Że zwracasz przeciwko Bogu swego ducha i wypuszczasz ze swoich ust takie słowa?"
  tags: []
"Hi15,14":
  text: "Czym jest człowiek, aby miał być czysty, urodzony z kobiety, aby miał być sprawiedliwy?"
  tags: []
"Hi15,15":
  text: "Oto nawet swoim świętym on nie ufa i niebiosa nie są czyste w jego oczach."
  tags: []
"Hi15,16":
  text: "Tym bardziej obrzydły i nikczemny jest człowiek, który pije nieprawość jak wodę."
  tags: []
"Hi15,17":
  text: "Wykażę ci, tylko mnie posłuchaj; opowiem ci, co widziałem;"
  tags: []
"Hi15,18":
  text: "Co mądrzy powiedzieli, a nie zataili, co mieli od przodków swoich;"
  tags: []
"Hi15,19":
  text: "Im samym dana była ziemia i żaden obcy nie przeszedł wśród nich."
  tags: []
"Hi15,20":
  text: "Niegodziwy żyje w udręce przez wszystkie swoje dni i niewiele lat wyznaczono ciemięzcy."
  tags: []
"Hi15,21":
  text: "Głos przerażenia brzmi w jego uszach, że w czasie pokoju napadnie go niszczyciel."
  tags: []
"Hi15,22":
  text: "Nie wierzy, że miałby wrócić z ciemności, obawia się zewsząd miecza."
  tags: []
"Hi15,23":
  text: "Tuła się za chlebem, pytając, gdzie go znaleźć. Wie, że dzień ciemności został dla niego przygotowany."
  tags: []
"Hi15,24":
  text: "Przeraża go utrapienie i ucisk; wzmocnią się przeciwko niemu jak król gotowy do boju."
  tags: []
"Hi15,25":
  text: "Wyciągnął bowiem swą rękę przeciw Bogu, przeciwko Wszechmocnemu się umocnił."
  tags: []
"Hi15,26":
  text: "Naciera na niego, na jego szyję, która jest okryta pod gęstymi grzbietami jego tarcz."
  tags: []
"Hi15,27":
  text: "Swoją twarz kryje bowiem w tłuszczu, a jego tusza zaokrągliła się na lędźwiach."
  tags: []
"Hi15,28":
  text: "Mieszka w opustoszałych miastach i domach, w których nikt nie przebywa, które niebawem staną się ruiną."
  tags: []
"Hi15,29":
  text: "Nie wzbogaci się i nie przetrwa jego majątek ani jego doskonałość nie rozszerzy się na ziemi."
  tags: []
"Hi15,30":
  text: "Nie wyjdzie z ciemności, płomień ususzy jego latorośle, a zginie od tchnienia jego ust."
  tags: []
"Hi15,31":
  text: "Niech złudzony nie ufa marności, gdyż marność będzie jego zapłatą."
  tags: []
"Hi15,32":
  text: "Przed wypełnieniem jego dni nastąpi, a jego gałązka nie zakwitnie."
  tags: []
"Hi15,33":
  text: "Jak winna latorośl utraci swoje niedojrzałe grona, jak oliwka zrzuci swój kwiat."
  tags: []
"Hi15,34":
  text: "Zgromadzenie obłudników będzie bowiem spustoszone, a ogień strawi namioty przekupstwa."
  tags: []
"Hi15,35":
  text: "Poczęli krzywdę i urodzili nieprawość, a ich łono przygotowuje oszustwo."
  tags: []
