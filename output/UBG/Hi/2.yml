"Hi2,1":
  text: "I znowu pewnego dnia, gdy synowie Boży przybyli, aby stanąć przed PANEM, wśród nich przyszedł też szatan, aby stanąć przed PANEM."
  tags: []
"Hi2,2":
  text: "Wtedy PAN powiedział do szatana: Skąd przychodzisz? Szatan odpowiedział PANU: Krążyłem po ziemi i przechadzałem się po niej."
  tags: []
"Hi2,3":
  text: "PAN zapytał szatana: Czy zauważyłeś mojego sługę Hioba – że nie ma nikogo mu równego na ziemi? To człowiek doskonały i prawy, bojący się Boga i stroniący od zła. On jeszcze trwa w swojej prawości, choć ty mnie pobudziłeś przeciw niemu, abym go niszczył bez powodu."
  tags: []
"Hi2,4":
  text: "Szatan odpowiedział PANU: Skórę za skórę; wszystko, co człowiek ma, odda za swoje życie;"
  tags: []
"Hi2,5":
  text: "Ale wyciągnij tylko swoją rękę i dotknij jego kości i ciała, a na pewno będzie ci w twarz złorzeczył."
  tags: []
"Hi2,6":
  text: "Wtedy PAN powiedział do szatana: Oto jest w twojej ręce, ale jego życie zachowaj."
  tags: []
"Hi2,7":
  text: "Wyszedł więc szatan sprzed oblicza PANA i dotknął Hioba bolesnymi wrzodami, od stóp aż po czubek głowy."
  tags: []
"Hi2,8":
  text: "A ten wziął skorupę, aby się nią skrobać, i siedział w popiele."
  tags: []
"Hi2,9":
  text: "Jego żona powiedziała mu: Jeszcze trwasz w swojej prawości? Złorzecz Bogu i umieraj."
  tags: []
"Hi2,10":
  text: "I odpowiedział jej: Mówisz, tak jak mówią głupie kobiety. Czy tylko dobro będziemy przyjmować od Boga, a zła przyjmować nie będziemy? W tym wszystkim Hiob nie zgrzeszył swymi ustami."
  tags: []
"Hi2,11":
  text: "A gdy trzej przyjaciele Hioba usłyszeli o całym nieszczęściu, które spadło na niego, przyszli, każdy ze swego miejsca: Elifaz z Temanu, Bildad z Szuach i Sofar z Naamy. Umówili się bowiem, aby przyjść i wraz z nim lamentować, i pocieszyć go."
  tags: []
"Hi2,12":
  text: "A gdy z daleka podnieśli swoje oczy, nie poznali go. Podnieśli swój głos i płakali, a potem każdy z nich rozdarł swój płaszcz i rzucał proch w górę na swoją głowę;"
  tags: []
"Hi2,13":
  text: "I siedzieli z nim na ziemi przez siedem dni i siedem nocy i żaden z nich nie przemówił do niego ani słowem. Widzieli bowiem ogrom jego bólu."
  tags: []
