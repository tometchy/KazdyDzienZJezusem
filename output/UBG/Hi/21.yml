"Hi21,1":
  text: "Wtedy Hiob odpowiedział:"
  tags: []
"Hi21,2":
  text: "Słuchajcie uważnie moich słów, a to będzie dla mnie wasza pociecha."
  tags: []
"Hi21,3":
  text: "Pozwólcie mi mówić, a potem, gdy powiem, naśmiewajcie się ze mnie."
  tags: []
"Hi21,4":
  text: "Czy swoją skargę kieruję do człowieka? A jeśli tak, to dlaczego mój duch nie miałby być wzburzony?"
  tags: []
"Hi21,5":
  text: "Spójrzcie na mnie, zdumiewajcie się i połóżcie rękę na swoje usta."
  tags: []
"Hi21,6":
  text: "Gdy tylko sobie przypomnę, jestem przerażony i strach ogarnia moje ciało."
  tags: []
"Hi21,7":
  text: "Czemu niegodziwi żyją, starzeją się, a nawet wzrastają w bogactwie?"
  tags: []
"Hi21,8":
  text: "Ich potomstwo utrwala się przed nimi, a ich rodzina wzrasta na ich oczach."
  tags: []
"Hi21,9":
  text: "Ich domy są bezpieczne, bez strachu i nie dotyka ich rózga Boga."
  tags: []
"Hi21,10":
  text: "Ich byk zapładnia i nie zawodzi, ich krowa cieli się i nie roni."
  tags: []
"Hi21,11":
  text: "Wypuszczają swe malutkie dzieci jak trzodę, a ich synowie podskakują."
  tags: []
"Hi21,12":
  text: "Chwytają za bęben i harfę i weselą się przy dźwięku fletu."
  tags: []
"Hi21,13":
  text: "Spędzają swoje dni w dobrobycie, a w mgnieniu oka zstępują do grobu."
  tags: []
"Hi21,14":
  text: "Dlatego mówią do Boga: Odejdź od nas, bo nie chcemy poznać twoich dróg."
  tags: []
"Hi21,15":
  text: "Kim jest Wszechmocny, abyśmy mieli mu służyć? Cóż nam pomoże to, że będziemy się modlić do niego?"
  tags: []
"Hi21,16":
  text: "Oto ich dobra nie są w ich rękach. Rada niegodziwych daleka jest ode mnie."
  tags: []
"Hi21,17":
  text: "Jak często gaśnie pochodnia niegodziwych? Jak często przychodzi na nich zguba? Bóg im wydziela cierpienie w swoim gniewie."
  tags: []
"Hi21,18":
  text: "Są jak słoma na wietrze i jak plewa, którą wicher porywa."
  tags: []
"Hi21,19":
  text: "Bóg zachowuje jego nieprawość dla jego synów; odpłaca mu, aby to poczuł."
  tags: []
"Hi21,20":
  text: "Jego oczy ujrzą jego nieszczęście i będzie pił z gniewu Wszechmocnego."
  tags: []
"Hi21,21":
  text: "Jaką bowiem ma on rozkosz w swoim domu, po swojej śmierci, gdy liczba jego miesięcy zostanie skrócona?"
  tags: []
"Hi21,22":
  text: "Czy ktoś może uczyć Boga wiedzy, wiedząc, że on sam sądzi najwyższych?"
  tags: []
"Hi21,23":
  text: "Jeden umiera w pełni swoich sił, bezpieczny ze wszystkich stron i spokojny;"
  tags: []
"Hi21,24":
  text: "Jego piersi są pełne mleka, a jego kości zwilża szpik."
  tags: []
"Hi21,25":
  text: "Drugi zaś umiera w goryczy ducha i nigdy nie jadał z uciechą."
  tags: []
"Hi21,26":
  text: "Razem będą leżeć w prochu i okryją ich robaki."
  tags: []
"Hi21,27":
  text: "Oto znam wasze myśli i zamiary, jakie przeciwko mnie złośliwie obmyślacie."
  tags: []
"Hi21,28":
  text: "Mówicie bowiem: Gdzie jest dom księcia? A gdzie mieszkanie niegodziwych?"
  tags: []
"Hi21,29":
  text: "Czy nie pytaliście podróżnych? Czy nie chcecie poznać ich znaków;"
  tags: []
"Hi21,30":
  text: "Że niegodziwy jest zachowany na dzień zatracenia? Zostanie przyprowadzony na dzień gniewu."
  tags: []
"Hi21,31":
  text: "Któż mu wypomni w oczy jego drogę? A kto mu odpłaci za to, co uczynił?"
  tags: []
"Hi21,32":
  text: "Zaprowadzą go do grobu i zostanie w grobowcu."
  tags: []
"Hi21,33":
  text: "Słodkie mu będą bryły ziemi z doliny i pociągnie za sobą wszystkich ludzi; a ci, którzy szli przed nim, są niezliczeni."
  tags: []
"Hi21,34":
  text: "Czemu więc daremnie mnie pocieszacie, skoro w waszych odpowiedziach pozostaje fałsz?"
  tags: []
