"Hi21,1": "Wtedy Hiob odpowiedział:"
"Hi21,2": "Słuchajcie uważnie moich słów, a to będzie dla mnie wasza pociecha."
"Hi21,3": "Pozwólcie mi mówić, a potem, gdy powiem, naśmiewajcie się ze mnie."
"Hi21,4": "Czy swoją skargę kieruję do człowieka? A jeśli tak, to dlaczego mój duch nie miałby być wzburzony?"
"Hi21,5": "Spójrzcie na mnie, zdumiewajcie się i połóżcie rękę na swoje usta."
"Hi21,6": "Gdy tylko sobie przypomnę, jestem przerażony i strach ogarnia moje ciało."
"Hi21,7": "Czemu niegodziwi żyją, starzeją się, a nawet wzrastają w bogactwie?"
"Hi21,8": "Ich potomstwo utrwala się przed nimi, a ich rodzina wzrasta na ich oczach."
"Hi21,9": "Ich domy są bezpieczne, bez strachu i nie dotyka ich rózga Boga."
"Hi21,10": "Ich byk zapładnia i nie zawodzi, ich krowa cieli się i nie roni."
"Hi21,11": "Wypuszczają swe malutkie dzieci jak trzodę, a ich synowie podskakują."
"Hi21,12": "Chwytają za bęben i harfę i weselą się przy dźwięku fletu."
"Hi21,13": "Spędzają swoje dni w dobrobycie, a w mgnieniu oka zstępują do grobu."
"Hi21,14": "Dlatego mówią do Boga: Odejdź od nas, bo nie chcemy poznać twoich dróg."
"Hi21,15": "Kim jest Wszechmocny, abyśmy mieli mu służyć? Cóż nam pomoże to, że będziemy się modlić do niego?"
"Hi21,16": "Oto ich dobra nie są w ich rękach. Rada niegodziwych daleka jest ode mnie."
"Hi21,17": "Jak często gaśnie pochodnia niegodziwych? Jak często przychodzi na nich zguba? Bóg im wydziela cierpienie w swoim gniewie."
"Hi21,18": "Są jak słoma na wietrze i jak plewa, którą wicher porywa."
"Hi21,19": "Bóg zachowuje jego nieprawość dla jego synów; odpłaca mu, aby to poczuł."
"Hi21,20": "Jego oczy ujrzą jego nieszczęście i będzie pił z gniewu Wszechmocnego."
"Hi21,21": "Jaką bowiem ma on rozkosz w swoim domu, po swojej śmierci, gdy liczba jego miesięcy zostanie skrócona?"
"Hi21,22": "Czy ktoś może uczyć Boga wiedzy, wiedząc, że on sam sądzi najwyższych?"
"Hi21,23": "Jeden umiera w pełni swoich sił, bezpieczny ze wszystkich stron i spokojny;"
"Hi21,24": "Jego piersi są pełne mleka, a jego kości zwilża szpik."
"Hi21,25": "Drugi zaś umiera w goryczy ducha i nigdy nie jadał z uciechą."
"Hi21,26": "Razem będą leżeć w prochu i okryją ich robaki."
"Hi21,27": "Oto znam wasze myśli i zamiary, jakie przeciwko mnie złośliwie obmyślacie."
"Hi21,28": "Mówicie bowiem: Gdzie jest dom księcia? A gdzie mieszkanie niegodziwych?"
"Hi21,29": "Czy nie pytaliście podróżnych? Czy nie chcecie poznać ich znaków;"
"Hi21,30": "Że niegodziwy jest zachowany na dzień zatracenia? Zostanie przyprowadzony na dzień gniewu."
"Hi21,31": "Któż mu wypomni w oczy jego drogę? A kto mu odpłaci za to, co uczynił?"
"Hi21,32": "Zaprowadzą go do grobu i zostanie w grobowcu."
"Hi21,33": "Słodkie mu będą bryły ziemi z doliny i pociągnie za sobą wszystkich ludzi; a ci, którzy szli przed nim, są niezliczeni."
"Hi21,34": "Czemu więc daremnie mnie pocieszacie, skoro w waszych odpowiedziach pozostaje fałsz?"
