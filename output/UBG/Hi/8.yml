"Hi8,1":
  text: "Wtedy Bildad z Szuach odpowiedział:"
  tags: []
"Hi8,2":
  text: "Jak długo będziesz mówił takie rzeczy? Jak długo słowa z twoich ust będą jak gwałtowny wiatr?"
  tags: []
"Hi8,3":
  text: "Czy Bóg wypacza sąd? Czy Wszechmocny wypacza sprawiedliwość?"
  tags: []
"Hi8,4":
  text: "Jeśli twoi synowie zgrzeszyli przeciwko niemu, a on ich odrzucił za ich nieprawość;"
  tags: []
"Hi8,5":
  text: "Jeśli zwrócisz się pilnie do Boga i będziesz błagać Wszechmocnego;"
  tags: []
"Hi8,6":
  text: "Jeśli jesteś czysty i prawy, wtedy na pewno obudzi się dla ciebie i poszczęści mieszkaniu twojej sprawiedliwości."
  tags: []
"Hi8,7":
  text: "A choćby twój początek był niewielki, jednak twój koniec bardzo się rozmnoży."
  tags: []
"Hi8,8":
  text: "Bo zapytaj, proszę, dawnych pokoleń i rozważ doświadczenie ich ojców;"
  tags: []
"Hi8,9":
  text: "(My bowiem jesteśmy wczorajsi i nic nie wiemy, ponieważ nasze dni na ziemi są jak cień)."
  tags: []
"Hi8,10":
  text: "Czy oni nie pouczą cię i nie powiedzą ci, i czy z ich serc nie wypłyną słowa?"
  tags: []
"Hi8,11":
  text: "Czy sitowie urośnie bez wilgoci? Czy trzcina urośnie bez wody?"
  tags: []
"Hi8,12":
  text: "Chociaż jeszcze jest świeża i nieskoszona, prędzej usycha niż inna trawa."
  tags: []
"Hi8,13":
  text: "Takie są drogi wszystkich, którzy zapominają Boga, i tak zginie nadzieja obłudnika."
  tags: []
"Hi8,14":
  text: "Jego nadzieja zostanie podcięta, a jego ufność będzie jak pajęczyna."
  tags: []
"Hi8,15":
  text: "Oprze się o swój dom, ale się nie ostoi; uchwyci się go, ale nie przetrwa."
  tags: []
"Hi8,16":
  text: "Zieleni się na słońcu i w ogrodzie jego świeża latorośl wyrasta."
  tags: []
"Hi8,17":
  text: "Jego korzenie są splątane wśród kamieni i wyrastają spośród nich."
  tags: []
"Hi8,18":
  text: "Ale gdy go wyrwą z jego miejsca, wtedy miejsce to wyprze się go, mówiąc: Nie widziałem cię."
  tags: []
"Hi8,19":
  text: "Takie oto jest szczęście jego drogi, a z ziemi wyrosną inni."
  tags: []
"Hi8,20":
  text: "Oto Bóg nie odrzuci człowieka prawego, ale złoczyńcom nie poda ręki;"
  tags: []
"Hi8,21":
  text: "Aż się napełnią twoje usta uśmiechem, a twoje wargi radością."
  tags: []
"Hi8,22":
  text: "Gdyż ci, którzy cię nienawidzą, okryją się hańbą, a namiotu niegodziwych już nie będzie."
  tags: []
