"Hi8,1": "Wtedy Bildad z Szuach odpowiedział:"
"Hi8,2": "Jak długo będziesz mówił takie rzeczy? Jak długo słowa z twoich ust będą jak gwałtowny wiatr?"
"Hi8,3": "Czy Bóg wypacza sąd? Czy Wszechmocny wypacza sprawiedliwość?"
"Hi8,4": "Jeśli twoi synowie zgrzeszyli przeciwko niemu, a on ich odrzucił za ich nieprawość;"
"Hi8,5": "Jeśli zwrócisz się pilnie do Boga i będziesz błagać Wszechmocnego;"
"Hi8,6": "Jeśli jesteś czysty i prawy, wtedy na pewno obudzi się dla ciebie i poszczęści mieszkaniu twojej sprawiedliwości."
"Hi8,7": "A choćby twój początek był niewielki, jednak twój koniec bardzo się rozmnoży."
"Hi8,8": "Bo zapytaj, proszę, dawnych pokoleń i rozważ doświadczenie ich ojców;"
"Hi8,9": "(My bowiem jesteśmy wczorajsi i nic nie wiemy, ponieważ nasze dni na ziemi są jak cień)."
"Hi8,10": "Czy oni nie pouczą cię i nie powiedzą ci, i czy z ich serc nie wypłyną słowa?"
"Hi8,11": "Czy sitowie urośnie bez wilgoci? Czy trzcina urośnie bez wody?"
"Hi8,12": "Chociaż jeszcze jest świeża i nieskoszona, prędzej usycha niż inna trawa."
"Hi8,13": "Takie są drogi wszystkich, którzy zapominają Boga, i tak zginie nadzieja obłudnika."
"Hi8,14": "Jego nadzieja zostanie podcięta, a jego ufność będzie jak pajęczyna."
"Hi8,15": "Oprze się o swój dom, ale się nie ostoi; uchwyci się go, ale nie przetrwa."
"Hi8,16": "Zieleni się na słońcu i w ogrodzie jego świeża latorośl wyrasta."
"Hi8,17": "Jego korzenie są splątane wśród kamieni i wyrastają spośród nich."
"Hi8,18": "Ale gdy go wyrwą z jego miejsca, wtedy miejsce to wyprze się go, mówiąc: Nie widziałem cię."
"Hi8,19": "Takie oto jest szczęście jego drogi, a z ziemi wyrosną inni."
"Hi8,20": "Oto Bóg nie odrzuci człowieka prawego, ale złoczyńcom nie poda ręki;"
"Hi8,21": "Aż się napełnią twoje usta uśmiechem, a twoje wargi radością."
"Hi8,22": "Gdyż ci, którzy cię nienawidzą, okryją się hańbą, a namiotu niegodziwych już nie będzie."
