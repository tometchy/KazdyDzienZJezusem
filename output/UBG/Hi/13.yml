"Hi13,1": "Oto moje oko widziało to wszystko, moje ucho słyszało i zrozumiało."
"Hi13,2": "Co wiecie wy, ja także wiem, nie jestem od was gorszy."
"Hi13,3": "Dlatego chciałbym mówić z Wszechmocnym i pragnę prawować się z Bogiem."
"Hi13,4": "Wy bowiem jesteście sprawcami kłamstwa, wszyscy jesteście marnymi lekarzami."
"Hi13,5": "Obyście raczej zamilkli, a uznano by wam to za mądrość."
"Hi13,6": "Słuchajcie teraz mojego rozumowania, zważajcie na obronę moich warg."
"Hi13,7": "Czy w obronie Boga będziecie mówić przewrotnie? Czy za niego będziecie mówić kłamliwie?"
"Hi13,8": "Czy macie wzgląd na jego osobę? Czy chcecie spierać się po stronie Boga?"
"Hi13,9": "Czy byłoby dobrze, gdyby was doświadczył? Czy chcecie go oszukać, jak się oszukuje człowieka?"
"Hi13,10": "Na pewno będzie was karać, jeśli w ukryciu będziecie stronniczy."
"Hi13,11": "Czy jego majestat was nie przeraża? Czy jego groza na was nie padnie?"
"Hi13,12": "Wasza pamięć jest jak popiół, a wasze ciała jak ciała z gliny."
"Hi13,13": "Milczcie, zostawcie mnie, abym przemówił, a niech przyjdzie na mnie, co chce."
"Hi13,14": "Czemu mam szarpać swoje ciało zębami i kłaść swoje życie w swoje ręce?"
"Hi13,15": "Oto choćby mnie zabił, jeszcze będę mu ufać. Moich dróg będę jednak przed nim bronić."
"Hi13,16": "On sam będzie moim zbawieniem, bo żaden obłudnik nie przyjdzie przed jego oblicze."
"Hi13,17": "Słuchajcie uważnie mojej mowy, niech wasze uszy przyjmą moją wypowiedź."
"Hi13,18": "Oto teraz jestem gotowy na sąd i wiem, że zostanę usprawiedliwiony."
"Hi13,19": "Któż będzie się spierał ze mną? Jeśli bowiem zamilknę, to umrę."
"Hi13,20": "Tylko dwóch rzeczy mi nie czyń, a nie będę się krył przed tobą."
"Hi13,21": "Oddal swoją rękę ode mnie i niech twoja groza mnie nie przeraża."
"Hi13,22": "Potem zawołaj mnie, a ja ci odpowiem, albo ja przemówię, a ty mi odpowiedz."
"Hi13,23": "Ile mam nieprawości i grzechów? Daj mi poznać moje przestępstwo i grzech."
"Hi13,24": "Czemu zakrywasz swoje oblicze i uważasz mnie za swego wroga?"
"Hi13,25": "Czy skruszysz liść miotany wiatrem? Czy będziesz gonić suche źdźbło?"
"Hi13,26": "Piszesz bowiem przeciwko mnie gorzkie rzeczy, każesz mi dziedziczyć nieprawości mojej młodości;"
"Hi13,27": "Zakułeś moje nogi w dyby, śledzisz wszystkie moje ścieżki i zaznaczasz ślady moich stóp."
"Hi13,28": "Niszczeję jak próchno, jak szata, którą zepsują mole."
