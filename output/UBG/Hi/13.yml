"Hi13,1":
  text: "Oto moje oko widziało to wszystko, moje ucho słyszało i zrozumiało."
  tags: []
"Hi13,2":
  text: "Co wiecie wy, ja także wiem, nie jestem od was gorszy."
  tags: []
"Hi13,3":
  text: "Dlatego chciałbym mówić z Wszechmocnym i pragnę prawować się z Bogiem."
  tags: []
"Hi13,4":
  text: "Wy bowiem jesteście sprawcami kłamstwa, wszyscy jesteście marnymi lekarzami."
  tags: []
"Hi13,5":
  text: "Obyście raczej zamilkli, a uznano by wam to za mądrość."
  tags: []
"Hi13,6":
  text: "Słuchajcie teraz mojego rozumowania, zważajcie na obronę moich warg."
  tags: []
"Hi13,7":
  text: "Czy w obronie Boga będziecie mówić przewrotnie? Czy za niego będziecie mówić kłamliwie?"
  tags: []
"Hi13,8":
  text: "Czy macie wzgląd na jego osobę? Czy chcecie spierać się po stronie Boga?"
  tags: []
"Hi13,9":
  text: "Czy byłoby dobrze, gdyby was doświadczył? Czy chcecie go oszukać, jak się oszukuje człowieka?"
  tags: []
"Hi13,10":
  text: "Na pewno będzie was karać, jeśli w ukryciu będziecie stronniczy."
  tags: []
"Hi13,11":
  text: "Czy jego majestat was nie przeraża? Czy jego groza na was nie padnie?"
  tags: []
"Hi13,12":
  text: "Wasza pamięć jest jak popiół, a wasze ciała jak ciała z gliny."
  tags: []
"Hi13,13":
  text: "Milczcie, zostawcie mnie, abym przemówił, a niech przyjdzie na mnie, co chce."
  tags: []
"Hi13,14":
  text: "Czemu mam szarpać swoje ciało zębami i kłaść swoje życie w swoje ręce?"
  tags: []
"Hi13,15":
  text: "Oto choćby mnie zabił, jeszcze będę mu ufać. Moich dróg będę jednak przed nim bronić."
  tags: []
"Hi13,16":
  text: "On sam będzie moim zbawieniem, bo żaden obłudnik nie przyjdzie przed jego oblicze."
  tags: []
"Hi13,17":
  text: "Słuchajcie uważnie mojej mowy, niech wasze uszy przyjmą moją wypowiedź."
  tags: []
"Hi13,18":
  text: "Oto teraz jestem gotowy na sąd i wiem, że zostanę usprawiedliwiony."
  tags: []
"Hi13,19":
  text: "Któż będzie się spierał ze mną? Jeśli bowiem zamilknę, to umrę."
  tags: []
"Hi13,20":
  text: "Tylko dwóch rzeczy mi nie czyń, a nie będę się krył przed tobą."
  tags: []
"Hi13,21":
  text: "Oddal swoją rękę ode mnie i niech twoja groza mnie nie przeraża."
  tags: []
"Hi13,22":
  text: "Potem zawołaj mnie, a ja ci odpowiem, albo ja przemówię, a ty mi odpowiedz."
  tags: []
"Hi13,23":
  text: "Ile mam nieprawości i grzechów? Daj mi poznać moje przestępstwo i grzech."
  tags: []
"Hi13,24":
  text: "Czemu zakrywasz swoje oblicze i uważasz mnie za swego wroga?"
  tags: []
"Hi13,25":
  text: "Czy skruszysz liść miotany wiatrem? Czy będziesz gonić suche źdźbło?"
  tags: []
"Hi13,26":
  text: "Piszesz bowiem przeciwko mnie gorzkie rzeczy, każesz mi dziedziczyć nieprawości mojej młodości;"
  tags: []
"Hi13,27":
  text: "Zakułeś moje nogi w dyby, śledzisz wszystkie moje ścieżki i zaznaczasz ślady moich stóp."
  tags: []
"Hi13,28":
  text: "Niszczeję jak próchno, jak szata, którą zepsują mole."
  tags: []
