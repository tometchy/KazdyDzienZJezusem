"Hi39,1": "Czy znasz porę, kiedy rodzą górskie kozice? Czy wiesz, kiedy rodzą łanie?"
"Hi39,2": "Czy możesz zliczyć miesiące, w których noszą młode? Czy znasz czas ich porodu?"
"Hi39,3": "Przykucają, rodzą swoje młode, pozbywają się ich z bólem;"
"Hi39,4": "Ich młode wzmacniają się, rosną wśród zboża, odchodzą i już do nich nie wracają."
"Hi39,5": "Kto wypuścił dzikiego osła na wolność i kto rozwiązał jego pęta?"
"Hi39,6": "Za dom dałem mu pustynię, a za jego mieszkanie słone miejsca."
"Hi39,7": "On naśmiewa się ze zgiełku miejskiego i nie słucha głosu poganiacza."
"Hi39,8": "Wypatruje w górach paszy i szuka wszelkiej zielonej trawy."
"Hi39,9": "Czy jednorożec zechce ci służyć albo nocować przy twoim żłobie?"
"Hi39,10": "Czy możesz powrozem zaprzęgać jednorożca do bruzdy? Czy będzie bronował doliny za tobą?"
"Hi39,11": "Czy zaufasz mu, ponieważ jego siła jest wielka? Czy powierzysz mu swoją pracę?"
"Hi39,12": "Czy zawierzysz mu, że zwiezie twoje ziarno i zgromadzi je w twoim spichlerzu?"
"Hi39,13": "Czy dałeś pawiowi piękne skrzydła, a skrzydła i pióra strusiowi?"
"Hi39,14": "Składa swoje jaja na ziemię i ogrzewa je w prochu;"
"Hi39,15": "I zapomina, że noga może je rozgnieść lub dzikie zwierzę może zdeptać."
"Hi39,16": "Jest twardy dla swoich młodych, jakby nie były jego. Nie boi się, że jego trud jest próżny;"
"Hi39,17": "Bo Bóg pozbawił go mądrości i nie udzielił mu rozumu."
"Hi39,18": "Kiedy jednak podnosi się wysoko, naśmiewa się z konia i z jego jeźdźca."
"Hi39,19": "Czy możesz dać koniowi moc? Czy rżeniem ozdobiłeś jego szyję?"
"Hi39,20": "Czy przestraszysz go jak szarańczę? Parskanie jego nozdrzy jest straszne."
"Hi39,21": "Grzebie kopytem w ziemi i cieszy się swą siłą, biegnie przeciwko uzbrojonym."
"Hi39,22": "Drwi sobie z lęku i nie boi się, i nie ustępuje przed ostrzem miecza."
"Hi39,23": "Kołczan na nim chrzęści, błyszczy oszczep i dzida."
"Hi39,24": "Z grzmotem i z gniewem pochłania ziemię i nie staje spokojnie na głos trąby."
"Hi39,25": "Na głos trąby mówi: Ha, ha; z daleka czuje bitwę, grom dowódców i okrzyk."
"Hi39,26": "Czy dzięki twojemu rozumowi lata jastrząb i rozciąga swe skrzydła ku południu?"
"Hi39,27": "Czy na twój rozkaz orzeł wzbija się i zakłada swoje gniazdo wysoko?"
"Hi39,28": "Mieszka na skale, przebywa na iglicach jak na zamku."
"Hi39,29": "Stamtąd wypatruje sobie pokarmu, jego oczy widzą daleko."
"Hi39,30": "Jego młode też piją krew, a gdzie są zabici, tam jest on."
