"Hi5,1":
  text: "Wołaj więc, jeśli jest ktoś, kto by ci odpowiedział; i do którego ze świętych się zwrócisz?"
  tags: []
"Hi5,2":
  text: "Gniew bowiem zabija głupiego, a prostaka uśmierca zawiść."
  tags: []
"Hi5,3":
  text: "Widziałem głupiego, jak zapuścił korzenie, lecz zaraz przekląłem jego mieszkanie."
  tags: []
"Hi5,4":
  text: "Jego synowie są daleko od ratunku, zostają zdeptani w bramie, a nie ma nikogo, kto by ich ocalił."
  tags: []
"Hi5,5":
  text: "Jego żniwo głodny pożera, wydobywa je spośród samych cierni, a chciwy pochłania ich bogactwa."
  tags: []
"Hi5,6":
  text: "Utrapienie bowiem nie powstaje z prochu ani z ziemi nie wyrasta niedola;"
  tags: []
"Hi5,7":
  text: "Lecz człowiek rodzi się na niedolę, jak iskry z węgla wzlatują w górę."
  tags: []
"Hi5,8":
  text: "Ja jednak szukałbym Boga i Bogu przedstawił swoją sprawę;"
  tags: []
"Hi5,9":
  text: "Który czyni rzeczy wielkie i niezbadane, cudowne i niezliczone;"
  tags: []
"Hi5,10":
  text: "Który zsyła deszcz na ziemię i spuszcza wody na pola;"
  tags: []
"Hi5,11":
  text: "Który pokornych stawia wysoko, a smutnych wywyższa ku zbawieniu;"
  tags: []
"Hi5,12":
  text: "Który wniwecz obraca zamysły przebiegłych, tak że ich ręce nie wykonują ich zamiaru;"
  tags: []
"Hi5,13":
  text: "Który chwyta mądrych w ich przebiegłości, tak że rada przewrotnych szybko upada."
  tags: []
"Hi5,14":
  text: "Za dnia napotykają ciemność, a w południe idą po omacku jak w nocy."
  tags: []
"Hi5,15":
  text: "On wybawia ubogiego od miecza, od ich ust, i z ręki mocarza."
  tags: []
"Hi5,16":
  text: "Tak to uciśniony ma nadzieję, a nieprawość zamyka swe usta."
  tags: []
"Hi5,17":
  text: "Oto błogosławiony człowiek, którego Bóg karze; nie gardź więc karceniem Wszechmocnego."
  tags: []
"Hi5,18":
  text: "On bowiem rani, ale i opatruje, uderza, a jego ręce uzdrawiają."
  tags: []
"Hi5,19":
  text: "Z sześciu nieszczęść cię wyrwie, a w siódmym nie dotknie cię zło."
  tags: []
"Hi5,20":
  text: "W głodzie wybawi cię od śmierci, a na wojnie od mocy miecza."
  tags: []
"Hi5,21":
  text: "Przed biczem języka będziesz zasłonięty i nie ulękniesz się spustoszenia, gdy nadejdzie."
  tags: []
"Hi5,22":
  text: "Będziesz się śmiał ze spustoszenia i głodu, nie będziesz się bał zwierząt ziemi."
  tags: []
"Hi5,23":
  text: "Zawrzesz bowiem przymierze z kamieniami na polu, a okrutny zwierz polny będzie żyć z tobą w pokoju."
  tags: []
"Hi5,24":
  text: "I poznasz, że twój przybytek jest spokojny; odwiedzisz swoje mieszkanie, a nie zgrzeszysz."
  tags: []
"Hi5,25":
  text: "Poznasz też, że twoje potomstwo się rozmnoży, a twoje dzieci będą jak trawa ziemi."
  tags: []
"Hi5,26":
  text: "W sędziwym wieku zejdziesz do grobu, jak snop zboża zbierany w swym czasie."
  tags: []
"Hi5,27":
  text: "Oto do tego doszliśmy i tak jest. Słuchaj tego i rozważ to sobie."
  tags: []
