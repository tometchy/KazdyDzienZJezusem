"Hi5,1": "Wołaj więc, jeśli jest ktoś, kto by ci odpowiedział; i do którego ze świętych się zwrócisz?"
"Hi5,2": "Gniew bowiem zabija głupiego, a prostaka uśmierca zawiść."
"Hi5,3": "Widziałem głupiego, jak zapuścił korzenie, lecz zaraz przekląłem jego mieszkanie."
"Hi5,4": "Jego synowie są daleko od ratunku, zostają zdeptani w bramie, a nie ma nikogo, kto by ich ocalił."
"Hi5,5": "Jego żniwo głodny pożera, wydobywa je spośród samych cierni, a chciwy pochłania ich bogactwa."
"Hi5,6": "Utrapienie bowiem nie powstaje z prochu ani z ziemi nie wyrasta niedola;"
"Hi5,7": "Lecz człowiek rodzi się na niedolę, jak iskry z węgla wzlatują w górę."
"Hi5,8": "Ja jednak szukałbym Boga i Bogu przedstawił swoją sprawę;"
"Hi5,9": "Który czyni rzeczy wielkie i niezbadane, cudowne i niezliczone;"
"Hi5,10": "Który zsyła deszcz na ziemię i spuszcza wody na pola;"
"Hi5,11": "Który pokornych stawia wysoko, a smutnych wywyższa ku zbawieniu;"
"Hi5,12": "Który wniwecz obraca zamysły przebiegłych, tak że ich ręce nie wykonują ich zamiaru;"
"Hi5,13": "Który chwyta mądrych w ich przebiegłości, tak że rada przewrotnych szybko upada."
"Hi5,14": "Za dnia napotykają ciemność, a w południe idą po omacku jak w nocy."
"Hi5,15": "On wybawia ubogiego od miecza, od ich ust, i z ręki mocarza."
"Hi5,16": "Tak to uciśniony ma nadzieję, a nieprawość zamyka swe usta."
"Hi5,17": "Oto błogosławiony człowiek, którego Bóg karze; nie gardź więc karceniem Wszechmocnego."
"Hi5,18": "On bowiem rani, ale i opatruje, uderza, a jego ręce uzdrawiają."
"Hi5,19": "Z sześciu nieszczęść cię wyrwie, a w siódmym nie dotknie cię zło."
"Hi5,20": "W głodzie wybawi cię od śmierci, a na wojnie od mocy miecza."
"Hi5,21": "Przed biczem języka będziesz zasłonięty i nie ulękniesz się spustoszenia, gdy nadejdzie."
"Hi5,22": "Będziesz się śmiał ze spustoszenia i głodu, nie będziesz się bał zwierząt ziemi."
"Hi5,23": "Zawrzesz bowiem przymierze z kamieniami na polu, a okrutny zwierz polny będzie żyć z tobą w pokoju."
"Hi5,24": "I poznasz, że twój przybytek jest spokojny; odwiedzisz swoje mieszkanie, a nie zgrzeszysz."
"Hi5,25": "Poznasz też, że twoje potomstwo się rozmnoży, a twoje dzieci będą jak trawa ziemi."
"Hi5,26": "W sędziwym wieku zejdziesz do grobu, jak snop zboża zbierany w swym czasie."
"Hi5,27": "Oto do tego doszliśmy i tak jest. Słuchaj tego i rozważ to sobie."
