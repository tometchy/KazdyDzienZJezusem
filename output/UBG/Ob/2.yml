"Ob2,1":
  text: "Do anioła kościoła w Efezie napisz: To mówi ten, który trzyma siedem gwiazd w swojej prawej ręce, który się przechadza wśród siedmiu złotych świeczników:"
  tags: []
"Ob2,2":
  text: "Znam twoje uczynki, twoją pracę i twoją cierpliwość i wiem, że nie możesz znieść złych i że poddałeś próbie tych, którzy nazywają się apostołami, a nimi nie są, i stwierdziłeś, że są kłamcami."
  tags: []
"Ob2,3":
  text: "Wytrwałeś też i masz cierpliwość, i pracowałeś dla mego imienia, a nie ustałeś."
  tags: []
"Ob2,4":
  text: "Ale mam nieco przeciw tobie – że porzuciłeś twoją pierwszą miłość."
  tags: []
"Ob2,5":
  text: "Pamiętaj więc, skąd spadłeś, i pokutuj, i spełniaj pierwsze uczynki. A jeśli nie, przyjdę do ciebie szybko i ruszę twój świecznik z jego miejsca, jeśli nie będziesz pokutował."
  tags: []
"Ob2,6":
  text: "Ale masz tę zaletę, że nienawidzisz uczynków nikolaitów, których i ja nienawidzę."
  tags: []
"Ob2,7":
  text: "Kto ma uszy, niech słucha, co Duch mówi do kościołów: Temu, kto zwycięży, dam jeść z drzewa życia, które jest pośrodku raju Boga."
  tags: []
"Ob2,8":
  text: "A do anioła kościoła w Smyrnie napisz: To mówi pierwszy i ostatni, który był umarły, a ożył:"
  tags: []
"Ob2,9":
  text: "Znam twoje uczynki, ucisk i ubóstwo – lecz jesteś bogaty – i bluźnierstwo tych, którzy mówią, że są Żydami, a nimi nie są, ale są synagogą szatana."
  tags: []
"Ob2,10":
  text: "Nic się nie bój tego, co masz cierpieć. Oto diabeł wtrąci niektórych z was do więzienia, abyście byli doświadczeni, i będziecie znosić ucisk przez dziesięć dni. Bądź wierny aż do śmierci, a dam ci koronę życia."
  tags: []
"Ob2,11":
  text: "Kto ma uszy, niech słucha, co Duch mówi do kościołów: Ten, kto zwycięży, nie dozna szkody od drugiej śmierci."
  tags: []
"Ob2,12":
  text: "A do anioła kościoła w Pergamonie napisz: To mówi ten, który ma ostry miecz obosieczny."
  tags: []
"Ob2,13":
  text: "Znam twoje uczynki i wiem, gdzie mieszkasz – tam, gdzie jest tron szatana – a trzymasz się mojego imienia i nie wyparłeś się mojej wiary nawet w dniach, gdy Antypas, mój wierny świadek, został zabity u was, tam, gdzie mieszka szatan."
  tags: []
"Ob2,14":
  text: "Ale mam nieco przeciwko tobie – że masz tam takich, którzy trzymają się nauki Balaama, który uczył Balaka, jak doprowadzić do upadku synów Izraela, żeby jedli ofiary składane bożkom i uprawiali nierząd."
  tags: []
"Ob2,15":
  text: "Podobnie masz i tych, którzy trzymają się nauki nikolaitów, czego nienawidzę."
  tags: []
"Ob2,16":
  text: "Pokutuj! A jeśli nie, przyjdę do ciebie szybko i będę walczył z nimi mieczem moich ust."
  tags: []
"Ob2,17":
  text: "Kto ma uszy, niech słucha, co Duch mówi do kościołów: Temu, kto zwycięży, dam jeść z manny ukrytej i dam mu kamyk biały, a na kamyku wypisane nowe imię, którego nikt nie zna oprócz tego, który je otrzymuje."
  tags: []
"Ob2,18":
  text: "A do anioła kościoła w Tiatyrze napisz: To mówi Syn Boży, który ma oczy jak płomień ognia, a jego stopy podobne są do mosiądzu:"
  tags: []
"Ob2,19":
  text: "Znam twoje uczynki i miłość, i służbę, i wiarę, i twoją cierpliwość, i twoje uczynki, i wiem, że ostatnich rzeczy jest więcej niż pierwszych."
  tags: []
"Ob2,20":
  text: "Ale mam nieco przeciwko tobie – że kobiecie Jezabel, która nazywa siebie prorokinią, pozwalasz nauczać i zwodzić moje sługi, żeby uprawiali nierząd i jedli ofiary składane bożkom."
  tags: []
"Ob2,21":
  text: "I dałem jej czas, aby pokutowała ze swego nierządu, ale nie pokutowała."
  tags: []
"Ob2,22":
  text: "Oto rzucę ją na łoże, a tych, którzy z nią cudzołożą, w ucisk wielki, jeśli nie będą pokutować ze swoich uczynków;"
  tags: []
"Ob2,23":
  text: "A jej dzieci porażę śmiercią. I poznają wszystkie kościoły, że ja jestem tym, który bada nerki i serca. I oddam każdemu z was według waszych uczynków."
  tags: []
"Ob2,24":
  text: "Wam zaś i pozostałym w Tiatyrze, którzy nie mają tej nauki i którzy nie poznali – jak mówią – głębin szatana, oświadczam: Nie nałożę na was innego brzemienia."
  tags: []
"Ob2,25":
  text: "Trzymajcie się jednak tego, co macie, aż przyjdę."
  tags: []
"Ob2,26":
  text: "Temu, kto zwycięży i zachowa aż do końca moje uczynki, dam władzę nad narodami."
  tags: []
"Ob2,27":
  text: "I będzie rządził nimi laską żelazną, jak naczynia gliniane będą skruszeni, jak i ja otrzymałem od mego Ojca."
  tags: []
"Ob2,28":
  text: "I dam mu gwiazdę poranną."
  tags: []
"Ob2,29":
  text: "Kto ma uszy, niech słucha, co Duch mówi do kościołów."
  tags: []
