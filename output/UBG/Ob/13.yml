"Ob13,1":
  text: "I stanąłem na piasku morza. I zobaczyłem bestię wychodzącą z morza, mającą siedem głów i dziesięć rogów, a na jej rogach było dziesięć koron, a na jej głowach imię bluźnierstwa."
  tags: []
"Ob13,2":
  text: "A bestia, którą widziałem, podobna była do pantery, a jej łapy jak u niedźwiedzia, a jej paszcza jak paszcza lwa. I dał jej smok swoją moc, swój tron i wielką władzę."
  tags: []
"Ob13,3":
  text: "I zobaczyłem jedną z jej głów jakby śmiertelnie zranioną, lecz jej śmiertelna rana została uleczona. I cała ziemia zdziwiła się, i poszła za bestią."
  tags: []
"Ob13,4":
  text: "I oddali pokłon smokowi, który dał władzę bestii. Oddali też pokłon bestii, mówiąc: Któż jest podobny do bestii? Któż z nią może walczyć?"
  tags: []
"Ob13,5":
  text: "I dano jej paszczę mówiącą rzeczy wielkie i bluźnierstwa. Dano jej też moc, aby działała przez czterdzieści dwa miesiące."
  tags: []
"Ob13,6":
  text: "I otworzyła swoją paszczę, by bluźnić przeciwko Bogu, by bluźnić jego imieniu, jego przybytkowi i tym, którzy mieszkają w niebie."
  tags: []
"Ob13,7":
  text: "Pozwolono jej też walczyć ze świętymi i zwyciężać ich. I dano jej władzę nad każdym plemieniem, językiem i narodem."
  tags: []
"Ob13,8":
  text: "Wszyscy mieszkańcy ziemi oddadzą jej pokłon, ci, których imiona nie są zapisane w księdze życia Baranka zabitego od założenia świata."
  tags: []
"Ob13,9":
  text: "Jeśli ktoś ma uszy, niech słucha!"
  tags: []
"Ob13,10":
  text: "Jeśli ktoś do niewoli bierze, do niewoli pójdzie, jeśli ktoś zabija mieczem, mieczem musi zostać zabity. Tu jest cierpliwość i wiara świętych."
  tags: []
"Ob13,11":
  text: "Potem zobaczyłem inną bestię wychodzącą z ziemi, a miała dwa rogi podobne do Baranka, ale mówiła jak smok."
  tags: []
"Ob13,12":
  text: "I całą władzę pierwszej bestii sprawuje na jej oczach, i sprawia, że ziemia i jej mieszkańcy oddają pokłon pierwszej bestii, której śmiertelna rana została wyleczona."
  tags: []
"Ob13,13":
  text: "I czyni wielkie cuda, sprawiając, że nawet ogień zstępuje z nieba na ziemię na oczach ludzi."
  tags: []
"Ob13,14":
  text: "I zwodzi mieszkańców ziemi przez cuda, które jej pozwolono czynić przed bestią, mówiąc mieszkańcom ziemi, aby sporządzili wizerunek bestii, która miała ranę od miecza, ale ożyła."
  tags: []
"Ob13,15":
  text: "I pozwolono jej tchnąć ducha w wizerunek bestii, tak żeby przemówił wizerunek bestii i sprawił, że ci, którzy nie oddali pokłonu wizerunkowi bestii, zostali zabici."
  tags: []
"Ob13,16":
  text: "I sprawia, aby wszyscy, mali i wielcy, bogaci i biedni, wolni i niewolnicy, przyjęli znamię na prawą rękę lub na czoło;"
  tags: []
"Ob13,17":
  text: "I aby nikt nie mógł kupić ani sprzedać, tylko ten, kto ma znamię, imię bestii lub liczbę jej imienia."
  tags: []
"Ob13,18":
  text: "Tu jest mądrość. Kto ma rozum, niech obliczy liczbę bestii, gdyż jest to liczba człowieka. A liczba jej: sześćset sześćdziesiąt sześć."
  tags: []
