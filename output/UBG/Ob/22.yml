"Ob22,1":
  text: "I pokazał mi czystą rzekę wody życia, przejrzystą jak kryształ, wypływającą z tronu Boga i Baranka."
  tags: []
"Ob22,2":
  text: "A pośrodku rynku miasta, po obu stronach rzeki, było drzewo życia przynoszące owoc dwunastu rodzajów, wydające swój owoc co miesiąc. A liście drzewa służą do uzdrawiania narodów."
  tags: []
"Ob22,3":
  text: "I nie będzie już żadnego przekleństwa. Lecz będzie w nim tron Boga i Baranka, a jego słudzy będą mu służyć."
  tags: []
"Ob22,4":
  text: "I będą oglądać jego oblicze, a jego imię będzie na ich czołach."
  tags: []
"Ob22,5":
  text: "I nocy tam nie będzie, i nie będzie im potrzeba lampy ani światła słońca, bo Pan Bóg będzie im świecił i będą królować na wieki wieków."
  tags: []
"Ob22,6":
  text: "I powiedział do mnie: Te słowa są wiarygodne i prawdziwe, a Pan, Bóg świętych proroków, posłał swego anioła, aby pokazać swym sługom, co ma się stać wkrótce."
  tags: []
"Ob22,7":
  text: "Oto przyjdę wkrótce: Błogosławiony, który zachowuje słowa proroctwa tej księgi."
  tags: []
"Ob22,8":
  text: "A ja, Jan, widziałem to wszystko i słyszałem. A gdy usłyszałem i zobaczyłem, upadłem do nóg anioła, który mi to pokazywał, aby oddać mu pokłon."
  tags: []
"Ob22,9":
  text: "Lecz powiedział do mnie: Nie rób tego, bo jestem sługą z tobą i twoimi braćmi prorokami, i z tymi, którzy zachowują słowa tej księgi. Bogu oddaj pokłon."
  tags: []
"Ob22,10":
  text: "Potem powiedział do mnie: Nie pieczętuj słów proroctwa tej księgi, bo czas jest bliski."
  tags: []
"Ob22,11":
  text: "Kto krzywdzi, niech nadal wyrządza krzywdę, kto plugawy, niech się nadal plugawi, kto sprawiedliwy, niech nadal będzie sprawiedliwy, a kto święty, niech się nadal uświęca."
  tags: []
"Ob22,12":
  text: "A oto przyjdę wkrótce, a moja zapłata jest ze mną, aby oddać każdemu według jego uczynków."
  tags: []
"Ob22,13":
  text: "Ja jestem Alfa i Omega, początek i koniec, pierwszy i ostatni."
  tags: []
"Ob22,14":
  text: "Błogosławieni, którzy wypełniają jego przykazania, aby mieli prawo do drzewa życia i aby weszli przez bramy do miasta."
  tags: []
"Ob22,15":
  text: "Na zewnątrz zaś są psy, czarownicy, rozpustnicy, mordercy, bałwochwalcy i każdy, kto miłuje i czyni kłamstwo."
  tags: []
"Ob22,16":
  text: "Ja, Jezus, posłałem mojego anioła, aby wam świadczył o tym w kościołach. Ja jestem korzeniem i potomkiem Dawida, jasną gwiazdą poranną."
  tags: []
"Ob22,17":
  text: "A Duch i oblubienica mówią: Przyjdź! A kto słyszy, niech powie: Przyjdź! A kto pragnie, niech przyjdzie, a kto chce, niech darmo weźmie wodę życia."
  tags: []
"Ob22,18":
  text: "Oświadczam zaś każdemu, kto słucha słów proroctwa tej księgi: Jeśli ktoś dołoży coś do tego, dołoży mu też Bóg plag opisanych w tej księdze;"
  tags: []
"Ob22,19":
  text: "A jeśli ktoś odejmie coś ze słów księgi tego proroctwa, odejmie też Bóg jego dział z księgi życia i ze świętego miasta, i z rzeczy, które są opisane w tej księdze."
  tags: []
"Ob22,20":
  text: "Tak mówi ten, który zaświadcza o tym: Zaprawdę, przyjdę wkrótce. Amen! O tak, przyjdź, Panie Jezu!"
  tags: []
"Ob22,21":
  text: "Łaska naszego Pana Jezusa Chrystusa niech będzie z wami wszystkimi. Amen."
  tags: []
