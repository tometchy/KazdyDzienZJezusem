"Ob22,1": "I pokazał mi czystą rzekę wody życia, przejrzystą jak kryształ, wypływającą z tronu Boga i Baranka."
"Ob22,2": "A pośrodku rynku miasta, po obu stronach rzeki, było drzewo życia przynoszące owoc dwunastu rodzajów, wydające swój owoc co miesiąc. A liście drzewa służą do uzdrawiania narodów."
"Ob22,3": "I nie będzie już żadnego przekleństwa. Lecz będzie w nim tron Boga i Baranka, a jego słudzy będą mu służyć."
"Ob22,4": "I będą oglądać jego oblicze, a jego imię będzie na ich czołach."
"Ob22,5": "I nocy tam nie będzie, i nie będzie im potrzeba lampy ani światła słońca, bo Pan Bóg będzie im świecił i będą królować na wieki wieków."
"Ob22,6": "I powiedział do mnie: Te słowa są wiarygodne i prawdziwe, a Pan, Bóg świętych proroków, posłał swego anioła, aby pokazać swym sługom, co ma się stać wkrótce."
"Ob22,7": "Oto przyjdę wkrótce: Błogosławiony, który zachowuje słowa proroctwa tej księgi."
"Ob22,8": "A ja, Jan, widziałem to wszystko i słyszałem. A gdy usłyszałem i zobaczyłem, upadłem do nóg anioła, który mi to pokazywał, aby oddać mu pokłon."
"Ob22,9": "Lecz powiedział do mnie: Nie rób tego, bo jestem sługą z tobą i twoimi braćmi prorokami, i z tymi, którzy zachowują słowa tej księgi. Bogu oddaj pokłon."
"Ob22,10": "Potem powiedział do mnie: Nie pieczętuj słów proroctwa tej księgi, bo czas jest bliski."
"Ob22,11": "Kto krzywdzi, niech nadal wyrządza krzywdę, kto plugawy, niech się nadal plugawi, kto sprawiedliwy, niech nadal będzie sprawiedliwy, a kto święty, niech się nadal uświęca."
"Ob22,12": "A oto przyjdę wkrótce, a moja zapłata jest ze mną, aby oddać każdemu według jego uczynków."
"Ob22,13": "Ja jestem Alfa i Omega, początek i koniec, pierwszy i ostatni."
"Ob22,14": "Błogosławieni, którzy wypełniają jego przykazania, aby mieli prawo do drzewa życia i aby weszli przez bramy do miasta."
"Ob22,15": "Na zewnątrz zaś są psy, czarownicy, rozpustnicy, mordercy, bałwochwalcy i każdy, kto miłuje i czyni kłamstwo."
"Ob22,16": "Ja, Jezus, posłałem mojego anioła, aby wam świadczył o tym w kościołach. Ja jestem korzeniem i potomkiem Dawida, jasną gwiazdą poranną."
"Ob22,17": "A Duch i oblubienica mówią: Przyjdź! A kto słyszy, niech powie: Przyjdź! A kto pragnie, niech przyjdzie, a kto chce, niech darmo weźmie wodę życia."
"Ob22,18": "Oświadczam zaś każdemu, kto słucha słów proroctwa tej księgi: Jeśli ktoś dołoży coś do tego, dołoży mu też Bóg plag opisanych w tej księdze;"
"Ob22,19": "A jeśli ktoś odejmie coś ze słów księgi tego proroctwa, odejmie też Bóg jego dział z księgi życia i ze świętego miasta, i z rzeczy, które są opisane w tej księdze."
"Ob22,20": "Tak mówi ten, który zaświadcza o tym: Zaprawdę, przyjdę wkrótce. Amen! O tak, przyjdź, Panie Jezu!"
"Ob22,21": "Łaska naszego Pana Jezusa Chrystusa niech będzie z wami wszystkimi. Amen."
