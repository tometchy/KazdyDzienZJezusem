"Ob16,1":
  text: "I usłyszałem donośny głos ze świątyni mówiący do siedmiu aniołów: Idźcie i wylejcie siedem czasz gniewu Boga na ziemię."
  tags: []
"Ob16,2":
  text: "I poszedł pierwszy, i wylał swoją czaszę na ziemię. I pojawiły się bolesne i złośliwe wrzody na ludziach, którzy mieli znamię bestii, i na tych, którzy oddali pokłon jej wizerunkowi."
  tags: []
"Ob16,3":
  text: "A drugi anioł wylał swoją czaszę na morze i stało się ono jak krew zmarłego. I każda dusza żywa umarła w morzu."
  tags: []
"Ob16,4":
  text: "A trzeci anioł wylał swoją czaszę na rzeki i źródła wód i przemieniły się w krew."
  tags: []
"Ob16,5":
  text: "I usłyszałem anioła wód mówiącego: Sprawiedliwy jesteś, Panie, który jesteś i który byłeś, i święty, że tak osądziłeś."
  tags: []
"Ob16,6":
  text: "Ponieważ wylali krew świętych i proroków, dałeś im również krew do picia, bo na to zasłużyli."
  tags: []
"Ob16,7":
  text: "I usłyszałem, jak inny mówił od ołtarza: Tak, Panie Boże Wszechmogący, prawdziwe i sprawiedliwe są twoje wyroki."
  tags: []
"Ob16,8":
  text: "A czwarty anioł wylał swoją czaszę na słońce i pozwolono mu przypalać ludzi ogniem."
  tags: []
"Ob16,9":
  text: "I ludzie zostali popaleni wielkim żarem, i bluźnili imieniu Boga, który ma władzę nad tymi plagami, a nie pokutowali, aby oddać mu chwałę."
  tags: []
"Ob16,10":
  text: "A piąty anioł wylał swoją czaszę na tron bestii i jej królestwo pogrążyło się w ciemności, a ludzie gryźli z bólu języki."
  tags: []
"Ob16,11":
  text: "I bluźnili Bogu nieba z powodu swoich bólów i wrzodów, lecz nie pokutowali ze swoich czynów."
  tags: []
"Ob16,12":
  text: "A szósty anioł wylał swoją czaszę na wielką rzekę Eufrat. I wyschła jej woda, aby została przygotowana droga dla królów ze Wschodu."
  tags: []
"Ob16,13":
  text: "I zobaczyłem trzy duchy nieczyste jakby żaby, które wychodziły z paszczy smoka i z paszczy bestii, i z ust fałszywego proroka."
  tags: []
"Ob16,14":
  text: "A są to duchy demonów, które czynią cuda i wychodzą do królów ziemi i na cały świat, aby ich zgromadzić na wojnę w wielki dzień Boga Wszechmogącego."
  tags: []
"Ob16,15":
  text: "Oto przychodzę jak złodziej. Błogosławiony, kto czuwa i strzeże swoich szat, aby nie chodził nago i aby nie widziano jego hańby."
  tags: []
"Ob16,16":
  text: "I zgromadził ich na miejsce zwane po hebrajsku Armageddon."
  tags: []
"Ob16,17":
  text: "A siódmy anioł wylał swoją czaszę w powietrze. I ze świątyni nieba, od tronu rozległ się donośny głos, który powiedział: Stało się!"
  tags: []
"Ob16,18":
  text: "I nastąpiły głosy i gromy, i błyskawice, i nastało wielkie trzęsienie ziemi, jakiego nie było, odkąd człowiek jest na ziemi, tak potężne było to trzęsienie ziemi."
  tags: []
"Ob16,19":
  text: "A wielkie miasto rozpadło się na trzy części i runęły miasta narodów. I został wspomniany przed Bogiem wielki Babilon, aby dać mu kielich wina zapalczywości swego gniewu."
  tags: []
"Ob16,20":
  text: "Pierzchły wszystkie wyspy i gór już nie znaleziono."
  tags: []
"Ob16,21":
  text: "I spadł z nieba na ludzi wielki grad o wadze około jednego talentu. A ludzie bluźnili Bogu z powodu plagi gradu, bo plaga ta była bardzo wielka."
  tags: []
