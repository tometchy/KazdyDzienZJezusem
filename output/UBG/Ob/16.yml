"Ob16,1": "I usłyszałem donośny głos ze świątyni mówiący do siedmiu aniołów: Idźcie i wylejcie siedem czasz gniewu Boga na ziemię."
"Ob16,2": "I poszedł pierwszy, i wylał swoją czaszę na ziemię. I pojawiły się bolesne i złośliwe wrzody na ludziach, którzy mieli znamię bestii, i na tych, którzy oddali pokłon jej wizerunkowi."
"Ob16,3": "A drugi anioł wylał swoją czaszę na morze i stało się ono jak krew zmarłego. I każda dusza żywa umarła w morzu."
"Ob16,4": "A trzeci anioł wylał swoją czaszę na rzeki i źródła wód i przemieniły się w krew."
"Ob16,5": "I usłyszałem anioła wód mówiącego: Sprawiedliwy jesteś, Panie, który jesteś i który byłeś, i święty, że tak osądziłeś."
"Ob16,6": "Ponieważ wylali krew świętych i proroków, dałeś im również krew do picia, bo na to zasłużyli."
"Ob16,7": "I usłyszałem, jak inny mówił od ołtarza: Tak, Panie Boże Wszechmogący, prawdziwe i sprawiedliwe są twoje wyroki."
"Ob16,8": "A czwarty anioł wylał swoją czaszę na słońce i pozwolono mu przypalać ludzi ogniem."
"Ob16,9": "I ludzie zostali popaleni wielkim żarem, i bluźnili imieniu Boga, który ma władzę nad tymi plagami, a nie pokutowali, aby oddać mu chwałę."
"Ob16,10": "A piąty anioł wylał swoją czaszę na tron bestii i jej królestwo pogrążyło się w ciemności, a ludzie gryźli z bólu języki."
"Ob16,11": "I bluźnili Bogu nieba z powodu swoich bólów i wrzodów, lecz nie pokutowali ze swoich czynów."
"Ob16,12": "A szósty anioł wylał swoją czaszę na wielką rzekę Eufrat. I wyschła jej woda, aby została przygotowana droga dla królów ze Wschodu."
"Ob16,13": "I zobaczyłem trzy duchy nieczyste jakby żaby, które wychodziły z paszczy smoka i z paszczy bestii, i z ust fałszywego proroka."
"Ob16,14": "A są to duchy demonów, które czynią cuda i wychodzą do królów ziemi i na cały świat, aby ich zgromadzić na wojnę w wielki dzień Boga Wszechmogącego."
"Ob16,15": "Oto przychodzę jak złodziej. Błogosławiony, kto czuwa i strzeże swoich szat, aby nie chodził nago i aby nie widziano jego hańby."
"Ob16,16": "I zgromadził ich na miejsce zwane po hebrajsku Armageddon."
"Ob16,17": "A siódmy anioł wylał swoją czaszę w powietrze. I ze świątyni nieba, od tronu rozległ się donośny głos, który powiedział: Stało się!"
"Ob16,18": "I nastąpiły głosy i gromy, i błyskawice, i nastało wielkie trzęsienie ziemi, jakiego nie było, odkąd człowiek jest na ziemi, tak potężne było to trzęsienie ziemi."
"Ob16,19": "A wielkie miasto rozpadło się na trzy części i runęły miasta narodów. I został wspomniany przed Bogiem wielki Babilon, aby dać mu kielich wina zapalczywości swego gniewu."
"Ob16,20": "Pierzchły wszystkie wyspy i gór już nie znaleziono."
"Ob16,21": "I spadł z nieba na ludzi wielki grad o wadze około jednego talentu. A ludzie bluźnili Bogu z powodu plagi gradu, bo plaga ta była bardzo wielka."
