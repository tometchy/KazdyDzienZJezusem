"Ob14,1": "I zobaczyłem, a oto Baranek stał na górze Syjon, a z nim sto czterdzieści cztery tysiące tych, którzy mieli imię jego Ojca wypisane na czołach."
"Ob14,2": "I usłyszałem z nieba głos jakby głos wielu wód i jakby głos wielkiego gromu. I słyszałem głos harfiarzy grających na swoich harfach."
"Ob14,3": "I śpiewali jakby nową pieśń przed tronem i przed czterema stworzeniami, i przed starszymi. A nikt się tej pieśni nie mógł nauczyć oprócz stu czterdziestu czterech tysięcy, którzy zostali wykupieni z ziemi."
"Ob14,4": "Są to ci, którzy nie skalali się z kobietami, są bowiem dziewiczy. To ci, którzy podążają za Barankiem, dokądkolwiek idzie. Oni zostali wykupieni spośród ludzi, aby byli pierwocinami dla Boga i dla Baranka;"
"Ob14,5": "A w ich ustach nie znaleziono podstępu. Są bowiem bez skazy przed tronem Boga."
"Ob14,6": "I zobaczyłem innego anioła lecącego środkiem nieba, który miał ewangelię wieczną, aby ją zwiastować mieszkańcom ziemi, wszystkim narodom, plemionom, językom i ludom;"
"Ob14,7": "Mówiącego donośnym głosem: Bójcie się Boga i oddajcie mu chwałę, bo przyszła godzina jego sądu. Oddajcie pokłon temu, który stworzył niebo i ziemię, morze i źródła wód."
"Ob14,8": "A za nim szedł inny anioł i mówił: Upadł, upadł Babilon, wielkie miasto, bo winem gniewu swego nierządu napoiło wszystkie narody."
"Ob14,9": "A po nich przyszedł trzeci anioł i donośnym głosem mówił: Jeśli ktoś odda pokłon bestii i jej wizerunkowi i przyjmie znamię na czoło lub na rękę;"
"Ob14,10": "Ten również będzie pił z wina zapalczywości Boga, nierozcieńczonego, nalanego do kielicha jego gniewu, i będzie męczony w ogniu i siarce przed świętymi aniołami i przed Barankiem."
"Ob14,11": "A dym ich męki wznosi się na wieki wieków i nie zaznają odpoczynku we dnie i w nocy ci, którzy oddają pokłon bestii i jej wizerunkowi, i ten, kto przyjmuje znamię jej imienia."
"Ob14,12": "Tu jest cierpliwość świętych, tu są ci, którzy zachowują przykazania Boga i wiarę Jezusa."
"Ob14,13": "I usłyszałem głos z nieba, który mówił do mnie: Napisz: Błogosławieni są umarli, którzy odtąd umierają w Panu, tak, mówi Duch, aby odpoczęli od swoich prac, a ich uczynki idą za nimi."
"Ob14,14": "I zobaczyłem, a oto biały obłok, a na obłoku siedział ktoś podobny do Syna Człowieczego, który miał na głowie złotą koronę, a w ręku ostry sierp."
"Ob14,15": "A inny anioł wyszedł ze świątyni, wołając donośnym głosem do tego, który siedział na obłoku: Zapuść swój sierp i żnij, gdyż nadeszła dla ciebie pora, abyś żął, bo dojrzało żniwo ziemi."
"Ob14,16": "Wtedy rzucił ten, który siedział na obłoku, swój sierp na ziemię i ziemia została zżęta."
"Ob14,17": "I inny anioł wyszedł ze świątyni, która jest w niebie, mając także ostry sierp."
"Ob14,18": "Potem od ołtarza wyszedł inny anioł, który miał władzę nad ogniem i zawołał donośnym głosem do tego, który miał ostry sierp: Zapuść swój ostry sierp i zbierz grona winorośli ziemi, bo dojrzały jej winne grona."
"Ob14,19": "I rzucił anioł swój ostry sierp na ziemię, i zebrał grona winorośli ziemi, i wrzucił je do wielkiej tłoczni gniewu Boga."
"Ob14,20": "I udeptano tłocznię poza miastem, a z tłoczni wypłynęła krew aż po wędzidła koni, na tysiąc sześćset stadiów."
