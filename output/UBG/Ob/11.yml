"Ob11,1":
  text: "I dano mi trzcinę podobną do pręta. I stanął anioł, mówiąc: Wstań i zmierz świątynię Boga i ołtarz oraz tych, którzy w niej oddają pokłon."
  tags: []
"Ob11,2":
  text: "Lecz dziedziniec zewnętrzny świątyni wyłącz i nie mierz go, gdyż został dany poganom. I będą deptać święte miasto przez czterdzieści dwa miesiące."
  tags: []
"Ob11,3":
  text: "I dam władzę dwóm moim świadkom, którzy będą prorokować przez tysiąc dwieście sześćdziesiąt dni ubrani w wory."
  tags: []
"Ob11,4":
  text: "Oni są dwoma drzewami oliwnymi i dwoma świecznikami, które stoją przed Bogiem ziemi."
  tags: []
"Ob11,5":
  text: "A gdy ktoś chce ich skrzywdzić, ogień wychodzi z ich ust i pożera ich wrogów. Jeśli więc ktoś chciałby ich skrzywdzić, w ten sposób musi być zabity."
  tags: []
"Ob11,6":
  text: "Oni mają władzę zamknąć niebo, aby nie padał deszcz za dni ich prorokowania, i mają władzę nad wodami, aby je zamieniać w krew i porazić ziemię wszelkimi plagami, ilekroć zechcą."
  tags: []
"Ob11,7":
  text: "A gdy dopełnią swojego świadectwa, bestia, która wychodzi z otchłani, stoczy z nimi walkę i zwycięży ich, i zabije ich."
  tags: []
"Ob11,8":
  text: "A ich zwłoki będą leżeć na ulicy wielkiego miasta, które duchowo nazywa się Sodomą i Egiptem, gdzie też nasz Pan został ukrzyżowany."
  tags: []
"Ob11,9":
  text: "I wielu spośród ludów, plemion, języków i narodów będzie patrzeć na ich zwłoki przez trzy i pół dnia i nie pozwolą złożyć ich zwłok do grobu."
  tags: []
"Ob11,10":
  text: "A mieszkańcy ziemi będą się cieszyć i radować z ich powodu. I będą sobie nawzajem posyłać podarunki, bo ci dwaj prorocy dręczyli mieszkańców ziemi."
  tags: []
"Ob11,11":
  text: "A po trzech i pół dnia duch życia od Boga wszedł w nich i stanęli na nogach, a wielki strach padł na tych, którzy na nich patrzyli."
  tags: []
"Ob11,12":
  text: "Potem usłyszeli donośny głos z nieba mówiący: Wstąp tutaj. I wstąpili do nieba w obłoku, a ich nieprzyjaciele patrzyli na nich."
  tags: []
"Ob11,13":
  text: "W tej godzinie nastąpiło wielkie trzęsienie ziemi i zawaliła się dziesiąta część miasta, i zginęło w trzęsieniu ziemi siedem tysięcy ludzi, a pozostali przerazili się i oddali chwałę Bogu nieba."
  tags: []
"Ob11,14":
  text: "Minęło drugie „biada”, a oto nadchodzi szybko trzecie „biada”."
  tags: []
"Ob11,15":
  text: "I zatrąbił siódmy anioł, i odezwały się donośne głosy w niebie mówiące: Królestwa świata stały się królestwami naszego Pana i jego Chrystusa i będzie królować na wieki wieków."
  tags: []
"Ob11,16":
  text: "A dwudziestu czterech starszych, którzy siedzą przed Bogiem na swoich tronach, upadło na twarze i oddało Bogu pokłon;"
  tags: []
"Ob11,17":
  text: "Mówiąc: Dziękujemy tobie, Panie Boże Wszechmogący, który jesteś i który byłeś, i który masz przyjść, że wziąłeś swą potężną moc i objąłeś królestwo."
  tags: []
"Ob11,18":
  text: "I rozgniewały się narody, i nadszedł twój gniew i czas osądzenia umarłych, i oddania zapłaty twoim sługom prorokom i świętym oraz tym, którzy się boją twego imienia, małym i wielkim, i zniszczenia tych, którzy niszczą ziemię."
  tags: []
"Ob11,19":
  text: "Potem otworzyła się świątynia Boga w niebie i arka jego przymierza ukazała się w jego świątyni, i nastąpiły błyskawice, głosy, grzmoty, trzęsienia ziemi i wielki grad."
  tags: []
