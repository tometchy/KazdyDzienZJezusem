"Ob11,1": "I dano mi trzcinę podobną do pręta. I stanął anioł, mówiąc: Wstań i zmierz świątynię Boga i ołtarz oraz tych, którzy w niej oddają pokłon."
"Ob11,2": "Lecz dziedziniec zewnętrzny świątyni wyłącz i nie mierz go, gdyż został dany poganom. I będą deptać święte miasto przez czterdzieści dwa miesiące."
"Ob11,3": "I dam władzę dwóm moim świadkom, którzy będą prorokować przez tysiąc dwieście sześćdziesiąt dni ubrani w wory."
"Ob11,4": "Oni są dwoma drzewami oliwnymi i dwoma świecznikami, które stoją przed Bogiem ziemi."
"Ob11,5": "A gdy ktoś chce ich skrzywdzić, ogień wychodzi z ich ust i pożera ich wrogów. Jeśli więc ktoś chciałby ich skrzywdzić, w ten sposób musi być zabity."
"Ob11,6": "Oni mają władzę zamknąć niebo, aby nie padał deszcz za dni ich prorokowania, i mają władzę nad wodami, aby je zamieniać w krew i porazić ziemię wszelkimi plagami, ilekroć zechcą."
"Ob11,7": "A gdy dopełnią swojego świadectwa, bestia, która wychodzi z otchłani, stoczy z nimi walkę i zwycięży ich, i zabije ich."
"Ob11,8": "A ich zwłoki będą leżeć na ulicy wielkiego miasta, które duchowo nazywa się Sodomą i Egiptem, gdzie też nasz Pan został ukrzyżowany."
"Ob11,9": "I wielu spośród ludów, plemion, języków i narodów będzie patrzeć na ich zwłoki przez trzy i pół dnia i nie pozwolą złożyć ich zwłok do grobu."
"Ob11,10": "A mieszkańcy ziemi będą się cieszyć i radować z ich powodu. I będą sobie nawzajem posyłać podarunki, bo ci dwaj prorocy dręczyli mieszkańców ziemi."
"Ob11,11": "A po trzech i pół dnia duch życia od Boga wszedł w nich i stanęli na nogach, a wielki strach padł na tych, którzy na nich patrzyli."
"Ob11,12": "Potem usłyszeli donośny głos z nieba mówiący: Wstąp tutaj. I wstąpili do nieba w obłoku, a ich nieprzyjaciele patrzyli na nich."
"Ob11,13": "W tej godzinie nastąpiło wielkie trzęsienie ziemi i zawaliła się dziesiąta część miasta, i zginęło w trzęsieniu ziemi siedem tysięcy ludzi, a pozostali przerazili się i oddali chwałę Bogu nieba."
"Ob11,14": "Minęło drugie „biada”, a oto nadchodzi szybko trzecie „biada”."
"Ob11,15": "I zatrąbił siódmy anioł, i odezwały się donośne głosy w niebie mówiące: Królestwa świata stały się królestwami naszego Pana i jego Chrystusa i będzie królować na wieki wieków."
"Ob11,16": "A dwudziestu czterech starszych, którzy siedzą przed Bogiem na swoich tronach, upadło na twarze i oddało Bogu pokłon;"
"Ob11,17": "Mówiąc: Dziękujemy tobie, Panie Boże Wszechmogący, który jesteś i który byłeś, i który masz przyjść, że wziąłeś swą potężną moc i objąłeś królestwo."
"Ob11,18": "I rozgniewały się narody, i nadszedł twój gniew i czas osądzenia umarłych, i oddania zapłaty twoim sługom prorokom i świętym oraz tym, którzy się boją twego imienia, małym i wielkim, i zniszczenia tych, którzy niszczą ziemię."
"Ob11,19": "Potem otworzyła się świątynia Boga w niebie i arka jego przymierza ukazała się w jego świątyni, i nastąpiły błyskawice, głosy, grzmoty, trzęsienia ziemi i wielki grad."
