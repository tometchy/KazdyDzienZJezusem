"Ob12,1":
  text: "I ukazał się wielki cud na niebie: Kobieta ubrana w słońce i księżyc pod jej nogami, a na jej głowie korona z dwunastu gwiazd."
  tags: []
"Ob12,2":
  text: "A była brzemienna i krzyczała w bólach porodowych i w mękach rodzenia."
  tags: []
"Ob12,3":
  text: "I ukazał się inny cud na niebie: Oto wielki rudy smok mający siedem głów i dziesięć rogów, a na jego głowach siedem koron."
  tags: []
"Ob12,4":
  text: "A jego ogon wlókł trzecią część gwiazd nieba i zrzucił je na ziemię. I stanął smok przed kobietą, która właśnie miała urodzić, aby gdy tylko urodzi, pożreć jej dziecko."
  tags: []
"Ob12,5":
  text: "I urodziła syna – mężczyznę, który będzie rządził wszystkimi narodami laską żelazną. I porwane zostało jej dziecko do Boga i do jego tronu;"
  tags: []
"Ob12,6":
  text: "A kobieta uciekła na pustynię, gdzie ma miejsce przygotowane przez Boga, aby ją tam żywiono przez tysiąc dwieście sześćdziesiąt dni."
  tags: []
"Ob12,7":
  text: "I nastąpiła walka w niebie. Michał i jego aniołowie walczyli ze smokiem. I walczył smok i jego aniołowie;"
  tags: []
"Ob12,8":
  text: "Ale nie zwyciężyli i nie było już dla nich miejsca w niebie."
  tags: []
"Ob12,9":
  text: "I zrzucony został wielki smok, wąż starodawny, zwany diabłem i szatanem, zwodzący cały świat. Został zrzucony na ziemię, z nim też zrzuceni zostali jego aniołowie."
  tags: []
"Ob12,10":
  text: "I usłyszałem donośny głos mówiący w niebie: Teraz nastało zbawienie, moc i królestwo naszego Boga, i władza jego Chrystusa, bo został zrzucony oskarżyciel naszych braci, który dniem i nocą oskarżał ich przed naszym Bogiem."
  tags: []
"Ob12,11":
  text: "Ale oni zwyciężyli go przez krew Baranka i przez słowo swego świadectwa i nie umiłowali swojego życia – aż do śmierci."
  tags: []
"Ob12,12":
  text: "Dlatego radujcie się niebiosa i wy, ich mieszkańcy. Biada mieszkańcom ziemi i morza, bo zszedł do was diabeł pałający wielkim gniewem, gdyż wie, że ma niewiele czasu."
  tags: []
"Ob12,13":
  text: "A gdy smok zobaczył, że został zrzucony na ziemię, zaczął prześladować kobietę, która urodziła mężczyznę."
  tags: []
"Ob12,14":
  text: "I dano kobiecie dwa skrzydła wielkiego orła, aby poleciała na pustynię, na swoje miejsce, gdzie jest żywiona przez czas i czasy, i połowę czasu, z dala od węża."
  tags: []
"Ob12,15":
  text: "I wyrzucił wąż ze swojej paszczy za kobietą wodę jak rzekę, aby ją rzeka porwała."
  tags: []
"Ob12,16":
  text: "Lecz ziemia przyszła kobiecie z pomocą i otworzyła ziemia swą gardziel, i pochłonęła rzekę, którą smok wyrzucił ze swojej paszczy."
  tags: []
"Ob12,17":
  text: "I rozgniewał się smok na kobietę, i odszedł, aby walczyć z resztą jej potomstwa, z tymi, którzy zachowują przykazania Boga i mają świadectwo Jezusa Chrystusa."
  tags: []
