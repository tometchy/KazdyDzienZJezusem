"Ob1,1":
  text: "Objawienie Jezusa Chrystusa, które dał mu Bóg, aby ukazać swoim sługom to, co ma się stać wkrótce, a on to ukazał i posłał przez swojego anioła swemu słudze Janowi;"
  tags: []
"Ob1,2":
  text: "Który poświadczył słowo Boże i świadectwo Jezusa Chrystusa, i wszystko, co widział."
  tags: []
"Ob1,3":
  text: "Błogosławiony ten, kto czyta, i ci, którzy słuchają słów tego proroctwa i zachowują to, co w nim jest napisane, bo czas jest bliski."
  tags: []
"Ob1,4":
  text: "Jan do siedmiu kościołów, które są w Azji. Łaska wam i pokój od tego, który jest i który był, i który ma przyjść, i od siedmiu Duchów, które są przed jego tronem;"
  tags: []
"Ob1,5":
  text: "I od Jezusa Chrystusa, który jest wiernym świadkiem i pierworodnym z umarłych, i władcą królów ziemi. Temu, który nas umiłował i obmył nas z naszych grzechów swoją krwią;"
  tags: []
"Ob1,6":
  text: "I uczynił nas królami i kapłanami dla Boga, swego Ojca, jemu chwała i moc na wieki wieków. Amen."
  tags: []
"Ob1,7":
  text: "Oto przychodzi z obłokami i ujrzy go wszelkie oko, także ci, którzy go przebili. I będą lamentować przed nim wszystkie plemiona ziemi. Tak, amen."
  tags: []
"Ob1,8":
  text: "Ja jestem Alfa i Omega, początek i koniec, mówi Pan, który jest i który był, i który ma przyjść, Wszechmogący."
  tags: []
"Ob1,9":
  text: "Ja, Jan, który też jestem waszym bratem i współuczestnikiem w ucisku i królestwie oraz w cierpliwości Jezusa Chrystusa, byłem na wyspie zwanej Patmos z powodu słowa Bożego i świadectwa Jezusa Chrystusa."
  tags: []
"Ob1,10":
  text: "Znalazłem się w zachwyceniu Ducha w dniu Pańskim i usłyszałem za sobą głos potężny jakby trąby;"
  tags: []
"Ob1,11":
  text: "Który mówił: Ja jestem Alfa i Omega, pierwszy i ostatni. Co widzisz, napisz w księdze i poślij do siedmiu kościołów, które są w Azji: do Efezu, Smyrny, Pergamonu, Tiatyry, Sardes, Filadelfii i Laodycei."
  tags: []
"Ob1,12":
  text: "I odwróciłem się, aby zobaczyć, co to za głos mówił do mnie. A gdy się odwróciłem, zobaczyłem siedem złotych świeczników;"
  tags: []
"Ob1,13":
  text: "A pośród tych siedmiu świeczników kogoś podobnego do Syna Człowieczego, ubranego w długą szatę i przepasanego na piersi złotym pasem."
  tags: []
"Ob1,14":
  text: "Jego głowa i włosy były białe jak biała wełna, jak śnieg, a jego oczy jak płomień ognia."
  tags: []
"Ob1,15":
  text: "Jego stopy podobne do mosiądzu, jakby w piecu rozżarzonego, a jego głos jak szum wielu wód."
  tags: []
"Ob1,16":
  text: "W swej prawej ręce miał siedem gwiazd, a z jego ust wychodził ostry miecz obosieczny. Jego oblicze było jak słońce, gdy świeci w pełni swej mocy."
  tags: []
"Ob1,17":
  text: "Gdy go zobaczyłem, padłem do jego stóp jak martwy i położył na mnie swą prawą rękę, mówiąc mi: Nie bój się! Ja jestem pierwszy i ostatni;"
  tags: []
"Ob1,18":
  text: "I żyjący, a byłem umarły. A oto żyję na wieki wieków i mam klucze piekła i śmierci."
  tags: []
"Ob1,19":
  text: "Napisz to, co widziałeś, i co jest, i co ma się stać potem."
  tags: []
"Ob1,20":
  text: "Tajemnica siedmiu gwiazd, które widziałeś w mojej prawej ręce i siedmiu złotych świeczników jest taka: siedem gwiazd to aniołowie siedmiu kościołów, a siedem świeczników, które widziałeś, to siedem kościołów."
  tags: []
