"Ob4,1":
  text: "Potem zobaczyłem, a oto drzwi były otwarte w niebie, a pierwszy głos, który słyszałem, jakby trąby mówiącej do mnie, powiedział: Wstąp tutaj, a pokażę ci, co się ma stać potem."
  tags: []
"Ob4,2":
  text: "I zaraz znalazłem się w zachwyceniu ducha. A oto w niebie stał tron, a na tronie ktoś siedział."
  tags: []
"Ob4,3":
  text: "A ten, który siedział, podobny był z wyglądu do kamienia jaspisowego i karneolowego, a dokoła tronu była tęcza podobna z wyglądu do szmaragdu."
  tags: []
"Ob4,4":
  text: "Wokoło tronu były dwadzieścia cztery trony. Na tronach widziałem siedzących dwudziestu czterech starszych, ubranych w białe szaty, a na ich głowach złote korony."
  tags: []
"Ob4,5":
  text: "Z tronu wychodziły błyskawice, gromy i głosy, a przed tronem paliło się siedem ognistych pochodni, które są siedmioma Duchami Boga."
  tags: []
"Ob4,6":
  text: "Przed tronem było też morze szklane podobne do kryształu. A pośrodku tronu i wokoło tronu były cztery stworzenia pełne oczu z przodu i z tyłu."
  tags: []
"Ob4,7":
  text: "Pierwsze stworzenie podobne było do lwa, drugie stworzenie podobne do cielca, trzecie stworzenie miało twarz jakby ludzką, a czwarte stworzenie podobne było do lecącego orła."
  tags: []
"Ob4,8":
  text: "Każde zaś z tych czterech stworzeń miało po sześć skrzydeł dokoła, a wewnątrz były pełne oczu. I bez odpoczynku, dniem i nocą mówią: Święty, święty, święty, Pan Bóg Wszechmogący, ten, który był i który jest, i który ma przyjść."
  tags: []
"Ob4,9":
  text: "A gdy stworzenia oddawały chwałę i cześć, i dziękczynienie zasiadającemu na tronie, żyjącemu na wieki wieków;"
  tags: []
"Ob4,10":
  text: "Upadło dwudziestu czterech starszych przed zasiadającym na tronie i oddało pokłon żyjącemu na wieki wieków, i rzucało swoje korony przed tronem, mówiąc:"
  tags: []
"Ob4,11":
  text: "Godzien jesteś, Panie, wziąć chwałę i cześć, i moc, ponieważ ty stworzyłeś wszystko i z twojej woli trwa i zostało stworzone."
  tags: []
