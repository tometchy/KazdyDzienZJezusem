"Ob20,1":
  text: "I zobaczyłem anioła zstępującego z nieba, mającego klucz do otchłani i wielki łańcuch w ręce."
  tags: []
"Ob20,2":
  text: "I chwycił smoka, węża starodawnego, którym jest diabeł i szatan, i związał go na tysiąc lat."
  tags: []
"Ob20,3":
  text: "I wrzucił go do otchłani, zamknął go i opieczętował, aby już nie zwodził narodów, aż się dopełni tysiąc lat. A potem musi być wypuszczony na krótki czas."
  tags: []
"Ob20,4":
  text: "Zobaczyłem też trony i zasiedli na nich, i dano im władzę sądzenia. I zobaczyłem oraz tych, którzy nie oddali pokłonu bestii ani jej wizerunkowi i nie przyjęli jej znamienia na czoło ani na rękę. I ożyli, i królowali z Chrystusem tysiąc lat."
  tags: []
"Ob20,5":
  text: "A inni z umarłych nie ożyli, aż się dopełniło tysiąc lat. To jest pierwsze zmartwychwstanie."
  tags: []
"Ob20,6":
  text: "Błogosławiony i święty ten, kto ma udział w pierwszym zmartwychwstaniu. Nad nimi druga śmierć nie ma władzy, lecz będą kapłanami Boga i Chrystusa i będą z nim królować tysiąc lat."
  tags: []
"Ob20,7":
  text: "A gdy się skończy tysiąc lat, szatan zostanie wypuszczony ze swego więzienia."
  tags: []
"Ob20,8":
  text: "I wyjdzie, aby zwieść narody z czterech krańców ziemi, Goga i Magoga, by zgromadzić je do bitwy. A ich liczba jest jak piasek morski."
  tags: []
"Ob20,9":
  text: "I wyszli na szerokość ziemi, otoczyli obóz świętych i miasto umiłowane. Zstąpił jednak ogień od Boga z nieba i pochłonął ich."
  tags: []
"Ob20,10":
  text: "A diabeł, który ich zwodził, został wrzucony do jeziora ognia i siarki, gdzie jest bestia i fałszywy prorok. I będą męczeni we dnie i w nocy na wieki wieków."
  tags: []
"Ob20,11":
  text: "I zobaczyłem wielki biały tron i zasiadającego na nim, sprzed którego oblicza uciekła ziemia i niebo, i nie znaleziono dla nich miejsca."
  tags: []
"Ob20,12":
  text: "I zobaczyłem umarłych, wielkich i małych, stojących przed Bogiem, i otwarto księgi. Otwarto też inną księgę, księgę życia. I osądzeni zostali umarli według tego, co było napisane w księgach, to znaczy według ich uczynków."
  tags: []
"Ob20,13":
  text: "I wydało morze umarłych, którzy w nim byli, również śmierć i piekło wydały umarłych, którzy w nich byli. I zostali osądzeni, każdy według swoich uczynków."
  tags: []
"Ob20,14":
  text: "A śmierć i piekło zostały wrzucone do jeziora ognia. To jest druga śmierć."
  tags: []
"Ob20,15":
  text: "I jeśli się ktoś nie znalazł zapisany w księdze życia, został wrzucony do jeziora ognia."
  tags: []
