"Ob9,1":
  text: "I zatrąbił piąty anioł, i zobaczyłem gwiazdę, która spadła z nieba na ziemię i dano jej klucz do studni otchłani."
  tags: []
"Ob9,2":
  text: "I otworzyła studnię otchłani, i wzbił się dym ze studni, jakby dym wielkiego pieca, a słońce i powietrze zaćmiły się od dymu studni."
  tags: []
"Ob9,3":
  text: "A z dymu wyszła szarańcza na ziemię i dano jej moc, jaką mają skorpiony ziemskie."
  tags: []
"Ob9,4":
  text: "I powiedziano jej, żeby nie wyrządzała szkody trawie na ziemi ani niczemu zielonemu, ani żadnemu drzewu, lecz tylko samym ludziom, którzy nie mają pieczęci Boga na czołach."
  tags: []
"Ob9,5":
  text: "I dano jej nakaz, aby ich nie zabijały, lecz dręczyły przez pięć miesięcy. A ich cierpienia były jak cierpienia zadane przez skorpiona, gdy ukąsi człowieka."
  tags: []
"Ob9,6":
  text: "I w owe dni ludzie będą szukać śmierci, lecz jej nie znajdą, i będą chcieli umrzeć, ale śmierć od nich ucieknie."
  tags: []
"Ob9,7":
  text: "A szarańcza z wyglądu była podobna do koni przygotowanych do boju, na ich głowach jakby korony podobne do złota, a ich twarze jakby twarze ludzkie."
  tags: []
"Ob9,8":
  text: "I miały włosy jakby włosy kobiece, a ich zęby były jak u lwów."
  tags: []
"Ob9,9":
  text: "Miały też pancerze jakby z żelaza, a szum ich skrzydeł jakby odgłos wielokonnych rydwanów pędzących do boju."
  tags: []
"Ob9,10":
  text: "I miały ogony podobne do skorpionów, a żądła były w ich ogonach. I dano im moc wyrządzania ludziom szkody przez pięć miesięcy."
  tags: []
"Ob9,11":
  text: "Mają nad sobą króla, anioła otchłani, którego imię po hebrajsku brzmi Abaddon, a po grecku Apollyon."
  tags: []
"Ob9,12":
  text: "Jedno „biada” minęło, a oto jeszcze dwa „biada” potem nadchodzą."
  tags: []
"Ob9,13":
  text: "I zatrąbił szósty anioł, i usłyszałem jeden głos od czterech rogów złotego ołtarza, który jest przed Bogiem;"
  tags: []
"Ob9,14":
  text: "Mówiący do szóstego anioła, który miał trąbę: Uwolnij czterech aniołów związanych nad wielką rzeką Eufrat."
  tags: []
"Ob9,15":
  text: "I zostali uwolnieni czterej aniołowie, przygotowani na godzinę, na dzień, na miesiąc i na rok, aby zabić trzecią część ludzi."
  tags: []
"Ob9,16":
  text: "A liczba wojsk konnych wynosiła dwieście milionów, bo usłyszałem ich liczbę."
  tags: []
"Ob9,17":
  text: "I tak zobaczyłem w widzeniu konie i tych, którzy na nich siedzieli, mających pancerze barwy ognia, hiacyntu i siarki. A głowy koni były jak głowy lwów, a z ich pysków wychodził ogień, dym i siarka."
  tags: []
"Ob9,18":
  text: "A od tych trzech plag została zabita trzecia część ludzi, od ognia, dymu i siarki, które wychodziły z ich pysków."
  tags: []
"Ob9,19":
  text: "Moc bowiem tych koni jest w ich pyskach i w ogonach, bo ich ogony są podobne do węży, które mają głowy i nimi wyrządzają szkody."
  tags: []
"Ob9,20":
  text: "A pozostali ludzie, którzy nie zostali zabici przez te plagi, nie pokutowali od uczynków swoich rąk, tak by nie oddawać pokłonu demonom i bożkom złotym, srebrnym, miedzianym, kamiennym i drewnianym, które nie mogą ani widzieć, ani słyszeć, ani chodzić."
  tags: []
"Ob9,21":
  text: "I nie pokutowali od swoich morderstw ani od swoich czarów, ani od swego nierządu, ani od swoich kradzieży."
  tags: []
