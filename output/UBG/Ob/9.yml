"Ob9,1": "I zatrąbił piąty anioł, i zobaczyłem gwiazdę, która spadła z nieba na ziemię i dano jej klucz do studni otchłani."
"Ob9,2": "I otworzyła studnię otchłani, i wzbił się dym ze studni, jakby dym wielkiego pieca, a słońce i powietrze zaćmiły się od dymu studni."
"Ob9,3": "A z dymu wyszła szarańcza na ziemię i dano jej moc, jaką mają skorpiony ziemskie."
"Ob9,4": "I powiedziano jej, żeby nie wyrządzała szkody trawie na ziemi ani niczemu zielonemu, ani żadnemu drzewu, lecz tylko samym ludziom, którzy nie mają pieczęci Boga na czołach."
"Ob9,5": "I dano jej nakaz, aby ich nie zabijały, lecz dręczyły przez pięć miesięcy. A ich cierpienia były jak cierpienia zadane przez skorpiona, gdy ukąsi człowieka."
"Ob9,6": "I w owe dni ludzie będą szukać śmierci, lecz jej nie znajdą, i będą chcieli umrzeć, ale śmierć od nich ucieknie."
"Ob9,7": "A szarańcza z wyglądu była podobna do koni przygotowanych do boju, na ich głowach jakby korony podobne do złota, a ich twarze jakby twarze ludzkie."
"Ob9,8": "I miały włosy jakby włosy kobiece, a ich zęby były jak u lwów."
"Ob9,9": "Miały też pancerze jakby z żelaza, a szum ich skrzydeł jakby odgłos wielokonnych rydwanów pędzących do boju."
"Ob9,10": "I miały ogony podobne do skorpionów, a żądła były w ich ogonach. I dano im moc wyrządzania ludziom szkody przez pięć miesięcy."
"Ob9,11": "Mają nad sobą króla, anioła otchłani, którego imię po hebrajsku brzmi Abaddon, a po grecku Apollyon."
"Ob9,12": "Jedno „biada” minęło, a oto jeszcze dwa „biada” potem nadchodzą."
"Ob9,13": "I zatrąbił szósty anioł, i usłyszałem jeden głos od czterech rogów złotego ołtarza, który jest przed Bogiem;"
"Ob9,14": "Mówiący do szóstego anioła, który miał trąbę: Uwolnij czterech aniołów związanych nad wielką rzeką Eufrat."
"Ob9,15": "I zostali uwolnieni czterej aniołowie, przygotowani na godzinę, na dzień, na miesiąc i na rok, aby zabić trzecią część ludzi."
"Ob9,16": "A liczba wojsk konnych wynosiła dwieście milionów, bo usłyszałem ich liczbę."
"Ob9,17": "I tak zobaczyłem w widzeniu konie i tych, którzy na nich siedzieli, mających pancerze barwy ognia, hiacyntu i siarki. A głowy koni były jak głowy lwów, a z ich pysków wychodził ogień, dym i siarka."
"Ob9,18": "A od tych trzech plag została zabita trzecia część ludzi, od ognia, dymu i siarki, które wychodziły z ich pysków."
"Ob9,19": "Moc bowiem tych koni jest w ich pyskach i w ogonach, bo ich ogony są podobne do węży, które mają głowy i nimi wyrządzają szkody."
"Ob9,20": "A pozostali ludzie, którzy nie zostali zabici przez te plagi, nie pokutowali od uczynków swoich rąk, tak by nie oddawać pokłonu demonom i bożkom złotym, srebrnym, miedzianym, kamiennym i drewnianym, które nie mogą ani widzieć, ani słyszeć, ani chodzić."
"Ob9,21": "I nie pokutowali od swoich morderstw ani od swoich czarów, ani od swego nierządu, ani od swoich kradzieży."
