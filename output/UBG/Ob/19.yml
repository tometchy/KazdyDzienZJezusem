"Ob19,1":
  text: "Potem usłyszałem donośny głos wielkiego tłumu ludzi w niebie, który mówił: Alleluja! Zbawienie i chwała, i cześć, i moc Panu, naszemu Bogu."
  tags: []
"Ob19,2":
  text: "Bo jego wyroki są prawdziwe i sprawiedliwe, gdyż osądził wielką nierządnicę, która skaziła ziemię swoim nierządem, i pomścił krew swoich sług z jej ręki."
  tags: []
"Ob19,3":
  text: "I powtórnie powiedzieli: Alleluja! A jej dym wznosi się na wieki wieków."
  tags: []
"Ob19,4":
  text: "I upadło dwudziestu czterech starszych i cztery stworzenia, i oddali pokłon Bogu zasiadającemu na tronie, mówiąc: Amen! Alleluja!"
  tags: []
"Ob19,5":
  text: "A od tronu rozległ się głos, który mówił: Chwalcie naszego Boga wszyscy jego słudzy i ci, którzy się go boicie, i mali, i wielcy."
  tags: []
"Ob19,6":
  text: "I usłyszałem jakby głos wielkiego tłumu i jakby głos wielu wód, i jakby głos potężnych gromów mówiących: Alleluja, bo objął królestwo Pan Bóg Wszechmogący."
  tags: []
"Ob19,7":
  text: "Cieszmy się i radujmy, i oddajmy mu chwałę, bo nadeszło wesele Baranka, a jego małżonka się przygotowała."
  tags: []
"Ob19,8":
  text: "I dano jej ubrać się w bisior czysty i lśniący, bo bisior to sprawiedliwość świętych."
  tags: []
"Ob19,9":
  text: "I powiedział mi: Napisz: Błogosławieni, którzy są wezwani na ucztę weselną Baranka. I powiedział mi: To są prawdziwe słowa Boga."
  tags: []
"Ob19,10":
  text: "I upadłem mu do nóg, aby oddać mu pokłon, lecz powiedział mi: Nie rób tego, bo jestem sługą razem z tobą i twoimi braćmi, którzy mają świadectwo Jezusa. Bogu oddaj pokłon, bowiem świadectwem Jezusa jest duch proroctwa."
  tags: []
"Ob19,11":
  text: "Potem zobaczyłem niebo otwarte, a oto koń biały, a ten, który na nim siedział, nazywa się Wiernym i Prawdziwym i w sprawiedliwości sądzi i walczy."
  tags: []
"Ob19,12":
  text: "Jego oczy były jak płomień ognia, a na jego głowie było wiele koron. I miał wypisane imię, którego nikt nie zna, tylko on sam."
  tags: []
"Ob19,13":
  text: "Ubrany był w szatę zmoczoną we krwi, a jego imię brzmi: Słowo Boże."
  tags: []
"Ob19,14":
  text: "A wojska w niebie podążały za nim na białych koniach, ubrane w bisior biały i czysty."
  tags: []
"Ob19,15":
  text: "A z jego ust wychodził ostry miecz, aby nim pobił narody. On bowiem będzie rządził nimi laską żelazną i on wyciska w tłoczni wino zapalczywości i gniewu Boga Wszechmogącego."
  tags: []
"Ob19,16":
  text: "A na szacie i na biodrze ma wypisane imię: Król królów i Pan panów."
  tags: []
"Ob19,17":
  text: "I zobaczyłem jednego anioła stojącego w słońcu. I zawołał donośnym głosem do wszystkich ptaków latających środkiem nieba: Chodźcie, zgromadźcie się na ucztę wielkiego Boga;"
  tags: []
"Ob19,18":
  text: "Aby jeść ciała królów, ciała wodzów i ciała mocarzy, ciała koni i ich jeźdźców, i ciała wszystkich: wolnych i niewolników, małych i wielkich."
  tags: []
"Ob19,19":
  text: "I zobaczyłem bestię i królów ziemi, i ich wojska zgromadzone, by stoczyć bitwę z tym, który siedzi na koniu, i z jego wojskiem."
  tags: []
"Ob19,20":
  text: "I schwytana została bestia, a z nią fałszywy prorok, który czynił przed nią cuda, jakimi zwiódł tych, którzy przyjęli znamię bestii i oddawali pokłon jej wizerunkowi. Oboje zostali żywcem wrzuceni do jeziora ognia, płonącego siarką."
  tags: []
"Ob19,21":
  text: "Pozostali zaś zostali zabici mieczem wychodzącym z ust tego, który siedział na koniu. I wszystkie ptaki najadły się ich ciałami."
  tags: []
