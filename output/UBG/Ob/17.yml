"Ob17,1": "I przyszedł jeden z siedmiu aniołów, którzy mieli siedem czasz, i odezwał się do mnie, mówiąc mi: Chodź, pokażę ci sąd nad wielką nierządnicą, która siedzi nad wieloma wodami;"
"Ob17,2": "Z którą nierząd uprawiali królowie ziemi, a mieszkańcy ziemi upili się winem jej nierządu."
"Ob17,3": "I zaniósł mnie w duchu na pustynię. I zobaczyłem kobietę siedzącą na szkarłatnej bestii pełnej imion bluźnierstwa, mającej siedem głów i dziesięć rogów."
"Ob17,4": "A kobieta była ubrana w purpurę i szkarłat i przyozdobiona złotem, drogimi kamieniami i perłami. Miała w swej ręce złoty kielich pełen obrzydliwości i nieczystości swego nierządu."
"Ob17,5": "A na jej czole wypisane było imię: Tajemnica, wielki Babilon, matka nierządnic i obrzydliwości ziemi."
"Ob17,6": "I zobaczyłem kobietę pijaną krwią świętych i krwią męczenników Jezusa. A gdy ją zobaczyłem, zdumiałem się bardzo."
"Ob17,7": "I powiedział do mnie anioł: Czemu się zdumiałeś? Ja ci wyjaśnię tajemnicę kobiety i bestii, która ją nosi, a która ma siedem głów i dziesięć rogów."
"Ob17,8": "Bestia, którą widziałeś, była, a nie ma jej i ma wyjść z otchłani, i iść na zatracenie. I zdziwią się mieszkańcy ziemi, których imiona nie są zapisane w księdze życia od założenia świata, widząc bestię, która była i nie ma jej, a jednak jest."
"Ob17,9": "Tu jest rozum, który ma mądrość. Siedem głów to siedem gór, na których siedzi kobieta."
"Ob17,10": "I królów jest siedmiu – pięciu upadło, jeden jest, inny jeszcze nie przyszedł, a gdy przyjdzie, ma pozostać na krótko."
"Ob17,11": "A bestia, która była, a nie ma jej, ona sama jest ósmym, a jest spośród siedmiu i idzie na zatracenie."
"Ob17,12": "A dziesięć rogów, które widziałeś, to dziesięciu królów, którzy jeszcze nie objęli królestwa, ale wezmą władzę jak królowie na jedną godzinę wraz z bestią."
"Ob17,13": "Mają oni jeden zamysł, a swoją moc i władzę oddadzą bestii."
"Ob17,14": "Oni będą walczyć z Barankiem, a Baranek ich zwycięży, bo jest Panem panów i Królem królów, a ci, którzy są z nim, są powołani, wybrani i wierni."
"Ob17,15": "I powiedział do mnie: Wody, które widziałeś, nad którymi siedzi nierządnica, to ludy, tłumy, narody i języki."
"Ob17,16": "A dziesięć rogów, które widziałeś na bestii – oni znienawidzą nierządnicę i sprawią, że będzie spustoszona i naga i będą jeść jej ciało, i spalą ją w ogniu."
"Ob17,17": "Bóg bowiem włożył im do serc, aby wykonali jego wolę, i to jednomyślnie, i oddali swoje królestwo bestii, aż wypełnią się słowa Boga."
"Ob17,18": "A kobieta, którą zobaczyłeś, to wielkie miasto, które króluje nad królami ziemi."
