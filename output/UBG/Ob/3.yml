"Ob3,1":
  text: "A do anioła kościoła w Sardes napisz: To mówi ten, który ma siedem Duchów Boga i siedem gwiazd: Znam twoje uczynki, że masz imię, które mówi, że żyjesz, ale jesteś martwy."
  tags: []
"Ob3,2":
  text: "Bądź czujny i utwierdź, co pozostało, a co bliskie jest śmierci. Nie uznałem bowiem twoich uczynków za doskonałe przed Bogiem."
  tags: []
"Ob3,3":
  text: "Pamiętaj zatem, jak otrzymałeś i usłyszałeś, i strzeż tego, i pokutuj. Jeśli więc czuwać nie będziesz, przyjdę do ciebie jak złodziej, a nie będziesz wiedział, o której godzinie przyjdę do ciebie."
  tags: []
"Ob3,4":
  text: "Lecz masz kilka osób w Sardes, które nie splamiły swoich szat. Będą chodzić ze mną w białych szatach, bo są godni."
  tags: []
"Ob3,5":
  text: "Kto zwycięży, będzie ubrany w białe szaty i nie wymażę jego imienia z księgi życia, lecz wyznam jego imię przed moim Ojcem i przed jego aniołami."
  tags: []
"Ob3,6":
  text: "Kto ma uszy, niech słucha, co Duch mówi do kościołów."
  tags: []
"Ob3,7":
  text: "A do anioła kościoła w Filadelfii napisz: To mówi Święty, Prawdziwy, ten, który ma klucz Dawida, ten, który otwiera i nikt nie zamknie, zamyka i nikt nie otworzy."
  tags: []
"Ob3,8":
  text: "Znam twoje uczynki. Oto postawiłem przed tobą otwarte drzwi, których nikt nie może zamknąć, bo choć masz niewielką moc, jednak zachowałeś moje słowo i nie wyparłeś się mego imienia."
  tags: []
"Ob3,9":
  text: "Oto dam ci ludzi z synagogi szatana, którzy mówią, że są Żydami, a nimi nie są, lecz kłamią. Oto sprawię, że przyjdą i pokłonią się przed twoimi nogami, i poznają, że ja ciebie umiłowałem."
  tags: []
"Ob3,10":
  text: "Ponieważ zachowałeś słowo mojej cierpliwości, ja też zachowam cię od godziny próby, która przyjdzie na cały świat, aby doświadczyć mieszkańców ziemi."
  tags: []
"Ob3,11":
  text: "Oto przyjdę wkrótce, trzymaj to, co masz, aby nikt nie wziął twojej korony."
  tags: []
"Ob3,12":
  text: "Tego, kto zwycięży, uczynię filarem w świątyni mojego Boga i już nie wyjdzie na zewnątrz. Napiszę też na nim imię mego Boga i nazwę miasta mego Boga, nowego Jeruzalem, które zstępuje z nieba od mego Boga, i moje nowe imię."
  tags: []
"Ob3,13":
  text: "Kto ma uszy, niech słucha, co Duch mówi do kościołów."
  tags: []
"Ob3,14":
  text: "A do anioła kościoła w Laodycei napisz: To mówi Amen, świadek wierny i prawdziwy, początek stworzenia Bożego:"
  tags: []
"Ob3,15":
  text: "Znam twoje uczynki: nie jesteś ani zimny, ani gorący. Obyś był zimny albo gorący."
  tags: []
"Ob3,16":
  text: "A tak, ponieważ jesteś letni i ani zimny, ani gorący, wypluję cię z moich ust."
  tags: []
"Ob3,17":
  text: "Mówisz bowiem: Jestem bogaty i wzbogaciłem się, i niczego nie potrzebuję, a nie wiesz, że jesteś nędzny i pożałowania godny, biedny, ślepy i nagi."
  tags: []
"Ob3,18":
  text: "Radzę ci kupić u mnie złota w ogniu wypróbowanego, abyś się wzbogacił, i białe szaty, abyś się ubrał i żeby nie ujawniła się hańba twojej nagości, a swoje oczy namaść maścią, abyś widział."
  tags: []
"Ob3,19":
  text: "Ja wszystkich, których miłuję, strofuję i karcę. Bądź więc gorliwy i pokutuj."
  tags: []
"Ob3,20":
  text: "Oto stoję u drzwi i pukam. Jeśli ktoś usłyszy mój głos i otworzy drzwi, wejdę do niego i spożyję z nim wieczerzę, a on ze mną."
  tags: []
"Ob3,21":
  text: "Temu, kto zwycięży, dam zasiąść ze mną na moim tronie, jak i ja zwyciężyłem i zasiadłem z moim Ojcem na jego tronie."
  tags: []
"Ob3,22":
  text: "Kto ma uszy, niech słucha, co Duch mówi do kościołów."
  tags: []
