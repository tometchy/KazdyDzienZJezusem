"Ob3,1": "A do anioła kościoła w Sardes napisz: To mówi ten, który ma siedem Duchów Boga i siedem gwiazd: Znam twoje uczynki, że masz imię, które mówi, że żyjesz, ale jesteś martwy."
"Ob3,2": "Bądź czujny i utwierdź, co pozostało, a co bliskie jest śmierci. Nie uznałem bowiem twoich uczynków za doskonałe przed Bogiem."
"Ob3,3": "Pamiętaj zatem, jak otrzymałeś i usłyszałeś, i strzeż tego, i pokutuj. Jeśli więc czuwać nie będziesz, przyjdę do ciebie jak złodziej, a nie będziesz wiedział, o której godzinie przyjdę do ciebie."
"Ob3,4": "Lecz masz kilka osób w Sardes, które nie splamiły swoich szat. Będą chodzić ze mną w białych szatach, bo są godni."
"Ob3,5": "Kto zwycięży, będzie ubrany w białe szaty i nie wymażę jego imienia z księgi życia, lecz wyznam jego imię przed moim Ojcem i przed jego aniołami."
"Ob3,6": "Kto ma uszy, niech słucha, co Duch mówi do kościołów."
"Ob3,7": "A do anioła kościoła w Filadelfii napisz: To mówi Święty, Prawdziwy, ten, który ma klucz Dawida, ten, który otwiera i nikt nie zamknie, zamyka i nikt nie otworzy."
"Ob3,8": "Znam twoje uczynki. Oto postawiłem przed tobą otwarte drzwi, których nikt nie może zamknąć, bo choć masz niewielką moc, jednak zachowałeś moje słowo i nie wyparłeś się mego imienia."
"Ob3,9": "Oto dam ci ludzi z synagogi szatana, którzy mówią, że są Żydami, a nimi nie są, lecz kłamią. Oto sprawię, że przyjdą i pokłonią się przed twoimi nogami, i poznają, że ja ciebie umiłowałem."
"Ob3,10": "Ponieważ zachowałeś słowo mojej cierpliwości, ja też zachowam cię od godziny próby, która przyjdzie na cały świat, aby doświadczyć mieszkańców ziemi."
"Ob3,11": "Oto przyjdę wkrótce, trzymaj to, co masz, aby nikt nie wziął twojej korony."
"Ob3,12": "Tego, kto zwycięży, uczynię filarem w świątyni mojego Boga i już nie wyjdzie na zewnątrz. Napiszę też na nim imię mego Boga i nazwę miasta mego Boga, nowego Jeruzalem, które zstępuje z nieba od mego Boga, i moje nowe imię."
"Ob3,13": "Kto ma uszy, niech słucha, co Duch mówi do kościołów."
"Ob3,14": "A do anioła kościoła w Laodycei napisz: To mówi Amen, świadek wierny i prawdziwy, początek stworzenia Bożego:"
"Ob3,15": "Znam twoje uczynki: nie jesteś ani zimny, ani gorący. Obyś był zimny albo gorący."
"Ob3,16": "A tak, ponieważ jesteś letni i ani zimny, ani gorący, wypluję cię z moich ust."
"Ob3,17": "Mówisz bowiem: Jestem bogaty i wzbogaciłem się, i niczego nie potrzebuję, a nie wiesz, że jesteś nędzny i pożałowania godny, biedny, ślepy i nagi."
"Ob3,18": "Radzę ci kupić u mnie złota w ogniu wypróbowanego, abyś się wzbogacił, i białe szaty, abyś się ubrał i żeby nie ujawniła się hańba twojej nagości, a swoje oczy namaść maścią, abyś widział."
"Ob3,19": "Ja wszystkich, których miłuję, strofuję i karcę. Bądź więc gorliwy i pokutuj."
"Ob3,20": "Oto stoję u drzwi i pukam. Jeśli ktoś usłyszy mój głos i otworzy drzwi, wejdę do niego i spożyję z nim wieczerzę, a on ze mną."
"Ob3,21": "Temu, kto zwycięży, dam zasiąść ze mną na moim tronie, jak i ja zwyciężyłem i zasiadłem z moim Ojcem na jego tronie."
"Ob3,22": "Kto ma uszy, niech słucha, co Duch mówi do kościołów."
