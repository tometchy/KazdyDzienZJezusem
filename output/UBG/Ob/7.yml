"Ob7,1": "Potem zobaczyłem czterech aniołów stojących na czterech krańcach ziemi, trzymających cztery wiatry ziemi, aby wiatr nie wiał na ziemię ani na morze, ani na żadne drzewo."
"Ob7,2": "I zobaczyłem innego anioła wstępującego od wschodu słońca, który miał pieczęć Boga żywego i zawołał donośnym głosem do czterech aniołów, którym pozwolono wyrządzać szkodę ziemi i morzu:"
"Ob7,3": "Nie wyrządzajcie szkody ziemi ani morzu, ani drzewom, dopóki nie opieczętujemy sług naszego Boga na ich czołach."
"Ob7,4": "I usłyszałem liczbę opieczętowanych: sto czterdzieści cztery tysiące opieczętowanych ze wszystkich pokoleń synów Izraela:"
"Ob7,5": "Z pokolenia Judy dwanaście tysięcy opieczętowanych, z pokolenia Rubena dwanaście tysięcy opieczętowanych, z pokolenia Gada dwanaście tysięcy opieczętowanych;"
"Ob7,6": "Z pokolenia Asera dwanaście tysięcy opieczętowanych, z pokolenia Neftalego dwanaście tysięcy opieczętowanych, z pokolenia Manassesa dwanaście tysięcy opieczętowanych;"
"Ob7,7": "Z pokolenia Symeona dwanaście tysięcy opieczętowanych, z pokolenia Lewiego dwanaście tysięcy opieczętowanych, z pokolenia Issachara dwanaście tysięcy opieczętowanych;"
"Ob7,8": "Z pokolenia Zabulona dwanaście tysięcy opieczętowanych, z pokolenia Józefa dwanaście tysięcy opieczętowanych, z pokolenia Beniamina dwanaście tysięcy opieczętowanych."
"Ob7,9": "Potem zobaczyłem, a oto wielki tłum, którego nikt nie mógł policzyć, z każdego narodu, plemienia, ludu i języka, który stał przed tronem i przed Barankiem ubrani w białe szaty, a palmy w ich rękach."
"Ob7,10": "I wołali donośnym głosem: Zbawienie należy do naszego Boga zasiadającego na tronie i do Baranka."
"Ob7,11": "A wszyscy aniołowie stali dokoła tronu i starszych, i czterech stworzeń, i upadli przed tronem na twarze, i oddali pokłon Bogu;"
"Ob7,12": "Mówiąc: Amen. Błogosławieństwo i chwała, i mądrość, i dziękczynienie, i cześć, i moc, i siła naszemu Bogu na wieki wieków. Amen."
"Ob7,13": "A jeden ze starszych odezwał się do mnie tymi słowy: Kim są ci, którzy są ubrani w białe szaty i skąd przybyli?"
"Ob7,14": "Odpowiedziałem mu: Panie, ty wiesz. I powiedział do mnie: To są ci, którzy przyszli z wielkiego ucisku i wyprali swoje szaty, i wybielili je we krwi Baranka."
"Ob7,15": "Dlatego są przed tronem Boga i służą mu we dnie i w nocy w jego świątyni, a zasiadający na tronie osłoni ich sobą jak namiotem."
"Ob7,16": "Nie zaznają już głodu ani pragnienia, nie porazi ich słońce ani żaden upał;"
"Ob7,17": "Ponieważ Baranek, który jest pośrodku tronu, będzie ich pasł i poprowadzi ich do żywych źródeł wód, i otrze Bóg wszelką łzę z ich oczu."
