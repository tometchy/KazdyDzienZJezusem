"Ob5,1": "I zobaczyłem w prawej ręce zasiadającego na tronie księgę zapisaną wewnątrz i na zewnątrz, opieczętowaną siedmioma pieczęciami."
"Ob5,2": "I zobaczyłem potężnego anioła wołającego donośnym głosem: Kto jest godny otworzyć księgę i złamać jej pieczęcie?"
"Ob5,3": "Ale nikt w niebie ani na ziemi, ani pod ziemią nie mógł otworzyć księgi ani do niej zajrzeć."
"Ob5,4": "I bardzo płakałem, że nie znalazł się nikt godny, aby otworzyć i czytać księgę, i do niej zajrzeć."
"Ob5,5": "Wtedy jeden ze starszych powiedział do mnie: Nie płacz! Oto zwyciężył lew z pokolenia Judy, korzeń Dawida, aby otworzyć księgę i złamać siedem jej pieczęci."
"Ob5,6": "I zobaczyłem, a oto między tronem i czterema stworzeniami, i między starszymi stał Baranek jakby zabity, który miał siedem rogów i siedmioro oczu, które są siedmioma Duchami Boga posłanymi na całą ziemię."
"Ob5,7": "Wtedy on podszedł i wziął księgę z prawej ręki zasiadającego na tronie."
"Ob5,8": "A gdy wziął księgę, cztery stworzenia i dwudziestu czterech starszych upadło przed Barankiem, a każdy z nich miał harfę i złote czasze pełne wonności, którymi są modlitwy świętych."
"Ob5,9": "I śpiewali nową pieśń: Godzien jesteś wziąć księgę i otworzyć jej pieczęcie, ponieważ zostałeś zabity i odkupiłeś nas dla Boga przez swoją krew z każdego plemienia, języka, ludu i narodu."
"Ob5,10": "I uczyniłeś nas dla naszego Boga królami i kapłanami, i będziemy królować na ziemi."
"Ob5,11": "Zobaczyłem też i usłyszałem głos wielu aniołów dokoła tronu i stworzeń, i starszych, a liczba ich wynosiła dziesięć tysięcy razy dziesięć tysięcy i tysiące tysięcy;"
"Ob5,12": "Mówiących donośnym głosem: Godzien jest Baranek zabity wziąć moc i bogactwo, i mądrość, i siłę, i cześć, i chwałę, i błogosławieństwo."
"Ob5,13": "A wszelkie stworzenie, które jest w niebie i na ziemi, i pod ziemią, i w morzu, i wszystko, co w nich jest, słyszałem, jak mówiło: Zasiadającemu na tronie i Barankowi błogosławieństwo i cześć, i chwała, i moc na wieki wieków."
"Ob5,14": "A cztery stworzenia mówiły: Amen. A dwudziestu czterech starszych upadło i oddało pokłon żyjącemu na wieki wieków."
