"Ob10,1": "I zobaczyłem innego potężnego anioła, zstępującego z nieba, ubranego w obłok, nad jego głową była tęcza, jego twarz jak słońce, a jego nogi jak słupy ognia."
"Ob10,2": "W swojej ręce miał otwartą książeczkę. I postawił prawą nogę na morzu, a lewą na ziemi."
"Ob10,3": "I zawołał donośnym głosem, tak jak ryczy lew. A gdy zawołał, siedem gromów odezwało się swoimi głosami."
"Ob10,4": "A gdy siedem gromów przemówiło swoimi głosami, zabrałem się do pisania, lecz usłyszałem głos z nieba, który mówił do mnie: Zapieczętuj to, co mówiło siedem gromów, i nie pisz tego."
"Ob10,5": "A anioł, którego widziałem stojącego na morzu i na ziemi, podniósł swoją rękę ku niebu;"
"Ob10,6": "I przysiągł na tego, który żyje na wieki wieków, który stworzył niebo i to, co w nim jest, i ziemię i to, co na niej, i morze, i to, co w nim, że czasu już nie będzie;"
"Ob10,7": "Lecz w dniach głosu siódmego anioła, gdy zacznie trąbić, dokona się tajemnica Boga, jak to oznajmił swoim sługom, prorokom."
"Ob10,8": "A głos, który usłyszałem z nieba, znowu przemówił do mnie: Idź, weź tę otwartą książeczkę, która jest w ręce anioła stojącego na morzu i na ziemi."
"Ob10,9": "Podszedłem więc do anioła i powiedziałem mu: Daj mi tę książeczkę. I powiedział do mnie: Weź ją i zjedz, a spowoduje gorycz w twoim brzuchu, lecz w twoich ustach będzie słodka jak miód."
"Ob10,10": "I wziąłem książeczkę z ręki anioła i zjadłem ją, a była w moich ustach słodka jak miód. Lecz gdy ją zjadłem, mój brzuch napełnił się goryczą."
"Ob10,11": "I powiedział do mnie: Musisz znowu prorokować przed wieloma ludami, narodami, językami i królami."
