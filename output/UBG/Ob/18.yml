"Ob18,1":
  text: "Potem zobaczyłem innego anioła zstępującego z nieba, mającego wielką władzę, i zajaśniała ziemia od jego chwały."
  tags: []
"Ob18,2":
  text: "I zawołał potężnie donośnym głosem: Upadł, upadł wielki Babilon, metropolia. Stała się mieszkaniem demonów, schronieniem wszelkiego ducha nieczystego i schronieniem wszelkiego ptactwa nieczystego i znienawidzonego."
  tags: []
"Ob18,3":
  text: "Gdyż wszystkie narody piły wino zapalczywości jej nierządu, a królowie ziemi uprawiali z nią nierząd i kupcy ziemi wzbogacili się na jej wielkim przepychu."
  tags: []
"Ob18,4":
  text: "I usłyszałem inny głos z nieba, który mówił: Wyjdźcie z niej, mój ludu, abyście nie byli uczestnikami jej grzechów i aby was nie dotknęły jej plagi."
  tags: []
"Ob18,5":
  text: "Jej grzechy bowiem dosięgły aż do nieba i wspomniał Bóg na jej nieprawości."
  tags: []
"Ob18,6":
  text: "Odpłaćcie jej, jak i ona odpłacała wam, i oddajcie jej w dwójnasób według jej uczynków. Do kielicha, w który wam nalewała, nalejcie jej w dwójnasób."
  tags: []
"Ob18,7":
  text: "Ile sama się rozsławiła i pławiła się w przepychu, tyle zadajcie jej udręki i smutku, bo mówi w swoim sercu: Zasiadam jak królowa, nie jestem wdową i nie zaznam smutku."
  tags: []
"Ob18,8":
  text: "Dlatego w jednym dniu przyjdą na nią jej plagi, śmierć, smutek i głód i zostanie spalona ogniem, bo mocny jest Pan Bóg, który ją osądzi."
  tags: []
"Ob18,9":
  text: "I będą płakać, i lamentować nad nią królowie ziemi, którzy uprawiali z nią nierząd i pławili się w przepychu, gdy zobaczą dym jej pożaru."
  tags: []
"Ob18,10":
  text: "Stojąc z daleka z powodu strachu przed jej męką, powiedzą: Biada, biada tobie, wielkie miasto, Babilonie, metropolio potężna, bo w jednej godzinie nadszedł twój sąd!"
  tags: []
"Ob18,11":
  text: "A kupcy ziemi będą płakać i lamentować nad nią, bo już nikt nie będzie kupował ich towaru;"
  tags: []
"Ob18,12":
  text: "Towaru złota, srebra, drogich kamieni, pereł, bisioru, purpury, jedwabiu, szkarłatu, wszelkiego drewna tujowego, wszelkich przedmiotów z kości słoniowej, wszelkich przedmiotów z najkosztowniejszego drewna, brązu, żelaza i marmuru;"
  tags: []
"Ob18,13":
  text: "Cynamonu i wonności, olejku i kadzidła, wina i oliwy, najczystszej mąki i pszenicy, bydła i owiec, koni i wozów, niewolników i dusz ludzkich."
  tags: []
"Ob18,14":
  text: "Owoce, których pożądała twoja dusza, opuściły ciebie i wszystko, co tłuste i świetne, opuściło ciebie i już nigdy tego nie znajdziesz."
  tags: []
"Ob18,15":
  text: "Ci, którzy tym handlowali i wzbogacili się na niej, będą stać z daleka z powodu strachu przed jej męką, płacząc i lamentując w słowach:"
  tags: []
"Ob18,16":
  text: "Biada, biada tobie, wielkie miasto, ubrane w bisior, purpurę i szkarłat, przyozdobione złotem, drogimi kamieniami i perłami;"
  tags: []
"Ob18,17":
  text: "Bo w jednej godzinie przepadło tak wielkie bogactwo; a każdy sternik i całe rzesze pływających na okrętach, i marynarze, i wszyscy, którzy pracują na morzu, stanęli z daleka;"
  tags: []
"Ob18,18":
  text: "I wołali, widząc dym jego pożaru: Które miasto jest podobne do tego wielkiego miasta?"
  tags: []
"Ob18,19":
  text: "I sypali proch na swoje głowy, i wołali, płacząc i lamentując: Biada, biada tobie, wielkie miasto, w którym, dzięki jego dostatkowi, wzbogacili się wszyscy, którzy mieli statki na morzu, bo w jednej godzinie zostało spustoszone."
  tags: []
"Ob18,20":
  text: "Raduj się nad nim niebo oraz święci apostołowie i prorocy, bo Bóg pomścił na nim waszą krzywdę."
  tags: []
"Ob18,21":
  text: "A jeden potężny anioł podniósł kamień, wielki jak kamień młyński, i wrzucił go do morza, mówiąc: Tak gwałtownie będzie zrzucony Babilon, wielkie miasto, i już go nie znajdą."
  tags: []
"Ob18,22":
  text: "I głosu harfiarzy, śpiewaków, flecistów i trębaczy nie będzie już słychać w tobie, i żaden rzemieślnik jakiegokolwiek rzemiosła już się nie znajdzie w tobie, i odgłosu kamienia młyńskiego już się w tobie nie usłyszy."
  tags: []
"Ob18,23":
  text: "I światło lampy nie zabłyśnie już w tobie, i głosu oblubieńca i oblubienicy nie będzie już słychać w tobie, bo twoi kupcy byli możnowładcami ziemi, bo twoimi czarami zostały zwiedzione wszystkie narody."
  tags: []
"Ob18,24":
  text: "W nim też znaleziono krew proroków i świętych, i wszystkich zabitych na ziemi."
  tags: []
