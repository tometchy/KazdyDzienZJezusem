"Ob21,1":
  text: "Potem zobaczyłem nowe niebo i nową ziemię. Pierwsze niebo bowiem i pierwsza ziemia przeminęły i nie było już morza."
  tags: []
"Ob21,2":
  text: "A ja, Jan, zobaczyłem święte miasto, nowe Jeruzalem, zstępujące z nieba od Boga, przygotowane jak oblubienica przyozdobiona dla swego męża."
  tags: []
"Ob21,3":
  text: "I usłyszałem donośny głos z nieba: Oto przybytek Boga jest z ludźmi i będzie mieszkał z nimi. Oni będą jego ludem, a sam Bóg będzie z nimi i będzie ich Bogiem."
  tags: []
"Ob21,4":
  text: "I otrze Bóg wszelką łzę z ich oczu, i śmierci już nie będzie ani smutku, ani krzyku, ani bólu nie będzie, bo pierwsze rzeczy przeminęły."
  tags: []
"Ob21,5":
  text: "A zasiadający na tronie powiedział: Oto wszystko czynię nowe. I powiedział do mnie: Napisz, bo te słowa są wiarygodne i prawdziwe."
  tags: []
"Ob21,6":
  text: "I powiedział do mnie: Stało się. Ja jestem Alfa i Omega, początek i koniec. Ja spragnionemu dam darmo ze źródła wody życia."
  tags: []
"Ob21,7":
  text: "Kto zwycięży, odziedziczy wszystko i będę dla niego Bogiem, a on będzie dla mnie synem."
  tags: []
"Ob21,8":
  text: "Ale bojaźliwi, niewierzący, obrzydliwi, mordercy, rozpustnicy, czarownicy, bałwochwalcy i wszyscy kłamcy będą mieli udział w jeziorze płonącym ogniem i siarką. To jest druga śmierć."
  tags: []
"Ob21,9":
  text: "I przyszedł do mnie jeden z siedmiu aniołów, którzy mieli siedem czasz napełnionych siedmioma ostatecznymi plagami, i odezwał się do mnie, mówiąc: Chodź tutaj, pokażę ci oblubienicę, małżonkę Baranka."
  tags: []
"Ob21,10":
  text: "I przeniósł mnie w duchu na górę wielką i wysoką, i pokazał mi wielkie miasto, święte Jeruzalem, zstępujące z nieba od Boga;"
  tags: []
"Ob21,11":
  text: "Mające chwałę Boga. Jego blask podobny był do drogocennego kamienia, jakby jaspisu, przezroczystego jak kryształ."
  tags: []
"Ob21,12":
  text: "Miało ono wielki i wysoki mur, miało dwanaście bram, a na bramach dwunastu aniołów i wypisane imiona, które są imionami dwunastu pokoleń synów Izraela."
  tags: []
"Ob21,13":
  text: "Od wschodu trzy bramy, od północy trzy bramy, od południa trzy bramy i od zachodu trzy bramy."
  tags: []
"Ob21,14":
  text: "A mur miasta miał dwanaście fundamentów, a na nich dwanaście imion dwunastu apostołów Baranka."
  tags: []
"Ob21,15":
  text: "A ten, który rozmawiał ze mną, miał złotą trzcinę, aby zmierzyć miasto, jego bramy i jego mur."
  tags: []
"Ob21,16":
  text: "Miasto ma kształt czworoboku, a jego długość jest taka sama jak i szerokość. I wymierzył miasto trzciną na dwanaście tysięcy stadiów. Jego długość, szerokość i wysokość są równe."
  tags: []
"Ob21,17":
  text: "I wymierzył jego mur na sto czterdzieści cztery łokcie według miary człowieka, która jest miarą anioła."
  tags: []
"Ob21,18":
  text: "Jego mur jest zbudowany z jaspisu, miasto zaś ze szczerego złota podobnego do czystego szkła."
  tags: []
"Ob21,19":
  text: "Fundamenty muru miasta ozdobione były wszelkimi drogimi kamieniami. Pierwszy fundament to jaspis, drugi – szafir, trzeci – chalcedon, czwarty – szmaragd;"
  tags: []
"Ob21,20":
  text: "Piąty – sardoniks, szósty – karneol, siódmy – chryzolit, ósmy – beryl, dziewiąty – topaz, dziesiąty – chryzopraz, jedenasty – hiacynt, dwunasty – ametyst."
  tags: []
"Ob21,21":
  text: "A dwanaście bram to dwanaście pereł. Każda brama była z jednej perły. A rynek miasta to szczere złoto, jak przezroczyste szkło."
  tags: []
"Ob21,22":
  text: "Lecz świątyni w nim nie widziałem, bo jego świątynią jest Pan Bóg Wszechmogący oraz Baranek."
  tags: []
"Ob21,23":
  text: "A miasto nie potrzebuje słońca ani księżyca, aby świeciły w nim, bo oświetla je chwała Boga, a jego lampą jest Baranek."
  tags: []
"Ob21,24":
  text: "Narody, które będą zbawione, będą chodziły w jego świetle, a królowie ziemi wniosą do niego swoją chwałę i cześć."
  tags: []
"Ob21,25":
  text: "W dzień jego bramy nie będą zamknięte, bo nocy tam nie będzie."
  tags: []
"Ob21,26":
  text: "I wniosą do niego chwałę i cześć narodów."
  tags: []
"Ob21,27":
  text: "I nie wejdzie do niego nic nieczystego ani ten, kto popełnia obrzydliwość i kłamstwo, tylko ci, którzy są zapisani w księdze życia Baranka."
  tags: []
