"Ob6,1":
  text: "I zobaczyłem, gdy Baranek otworzył pierwszą z pieczęci, i usłyszałem pierwsze z czterech stworzeń mówiące jakby głosem gromu: Chodź i zobacz."
  tags: []
"Ob6,2":
  text: "I zobaczyłem, a oto biały koń, ten zaś, który na nim siedział, miał łuk. I dano mu koronę, i wyruszył jako zwycięzca, żeby zwyciężać."
  tags: []
"Ob6,3":
  text: "A gdy otworzył drugą pieczęć, usłyszałem drugie stworzenie mówiące: Chodź i zobacz."
  tags: []
"Ob6,4":
  text: "I wyszedł inny koń, rudy, a temu, który na nim siedział, pozwolono odebrać ziemi pokój, aby ludzie zabijali się nawzajem. I dano mu wielki miecz."
  tags: []
"Ob6,5":
  text: "A gdy otworzył trzecią pieczęć, usłyszałem trzecie stworzenie mówiące: Chodź i zobacz. I zobaczyłem, a oto koń czarny, ten zaś, który na nim siedział, miał w swojej ręce wagę."
  tags: []
"Ob6,6":
  text: "I usłyszałem głos pośród czterech stworzeń mówiący: Miara pszenicy za grosz i trzy miary jęczmienia za grosz. A nie krzywdź oliwy i wina."
  tags: []
"Ob6,7":
  text: "A gdy otworzył czwartą pieczęć, usłyszałem głos czwartego stworzenia mówiący: Chodź i zobacz."
  tags: []
"Ob6,8":
  text: "I zobaczyłem, oto koń płowy, a temu, który na nim siedział, było na imię Śmierć, a Piekło szło za nim. I dano im władzę nad czwartą częścią ziemi, aby zabijali mieczem i głodem, i zarazą, i przez zwierzęta ziemi."
  tags: []
"Ob6,9":
  text: "A gdy otworzył piątą pieczęć, widziałem pod ołtarzem dusze zabitych z powodu słowa Bożego i świadectwa, które złożyli."
  tags: []
"Ob6,10":
  text: "I wołały donośnym głosem: Jak długo jeszcze, Panie święty i prawdziwy, nie będziesz sądził i nie pomścisz naszej krwi na mieszkańcach ziemi?"
  tags: []
"Ob6,11":
  text: "I dano każdemu z nich białą szatę, i powiedziano im, aby odpoczywali jeszcze przez krótki czas, aż dopełni się liczba ich współsług i braci, którzy mają zostać zabici jak i oni."
  tags: []
"Ob6,12":
  text: "I zobaczyłem, gdy otworzył szóstą pieczęć, a oto nastąpiło wielkie trzęsienie ziemi i słońce stało się czarne jak włosiany wór, a księżyc stał się jak krew."
  tags: []
"Ob6,13":
  text: "Gwiazdy niebieskie spadły na ziemię, podobnie jak drzewo figowe zrzuca niedojrzałe figi, gdy potrząśnie nim gwałtowny wiatr."
  tags: []
"Ob6,14":
  text: "I niebo ustąpiło jak zwój zrolowany, a każda góra i wyspa ruszyły się ze swoich miejsc."
  tags: []
"Ob6,15":
  text: "A królowie ziemscy i możnowładcy, i bogacze, i wodzowie, i mocarze, i każdy niewolnik, i każdy wolny ukryli się w jaskiniach i skałach górskich."
  tags: []
"Ob6,16":
  text: "I mówili do gór i skał: Padnijcie na nas i zakryjcie nas przed obliczem zasiadającego na tronie i przed gniewem Baranka;"
  tags: []
"Ob6,17":
  text: "Bo nadszedł wielki dzień jego gniewu. I któż może się ostać?"
  tags: []
