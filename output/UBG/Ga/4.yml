"Ga4,1":
  text: "Mówię więc: Dopóki dziedzic jest dzieckiem, niczym się nie różni od sługi, chociaż jest panem wszystkiego."
  tags: []
"Ga4,2":
  text: "Lecz jest poddany opiekunom i zarządcom aż do czasu wyznaczonego przez ojca."
  tags: []
"Ga4,3":
  text: "Podobnie i my, gdy byliśmy dziećmi, byliśmy w niewoli żywiołów tego świata."
  tags: []
"Ga4,4":
  text: "Lecz gdy nadeszła pełnia czasu, Bóg posłał swego Syna, zrodzonego z kobiety, zrodzonego pod prawem;"
  tags: []
"Ga4,5":
  text: "Aby wykupił tych, którzy byli pod prawem, abyśmy dostąpili usynowienia."
  tags: []
"Ga4,6":
  text: "A ponieważ jesteście synami, Bóg posłał do waszych serc Ducha swego Syna, wołającego: Abba, Ojcze!"
  tags: []
"Ga4,7":
  text: "Tak więc już nie jesteś sługą, ale synem, a jeśli synem, to i dziedzicem Bożym przez Chrystusa."
  tags: []
"Ga4,8":
  text: "Wprawdzie dawniej, gdy nie znaliście Boga, służyliście tym, którzy z natury nie są bogami."
  tags: []
"Ga4,9":
  text: "Ale teraz, gdy poznaliście Boga, a raczej gdy zostaliście przez Boga poznani, jakże możecie ponownie wracać do słabych i nędznych żywiołów, którym ponownie chcecie służyć?"
  tags: []
"Ga4,10":
  text: "Zachowujecie dni i miesiące, pory i lata."
  tags: []
"Ga4,11":
  text: "Boję się o was, czy przypadkiem na próżno nie trudziłem się nad wami."
  tags: []
"Ga4,12":
  text: "Bracia, proszę was, bądźcie tacy jak ja, gdyż i ja jestem taki jak wy. W niczym mnie nie skrzywdziliście."
  tags: []
"Ga4,13":
  text: "Wiecie przecież, że pierwszy raz głosiłem wam ewangelię w słabości ciała."
  tags: []
"Ga4,14":
  text: "A mojej cielesnej próby nie lekceważyliście sobie ani nie wzgardziliście, ale przyjęliście mnie jak anioła Boga, jak samego Chrystusa Jezusa."
  tags: []
"Ga4,15":
  text: "Gdzież więc się podziało to wasze błogosławieństwo? Daję wam bowiem świadectwo, że gdyby to było możliwe, wyłupilibyście sobie oczy i dali je mnie."
  tags: []
"Ga4,16":
  text: "Czy mówiąc wam prawdę, stałem się waszym nieprzyjacielem?"
  tags: []
"Ga4,17":
  text: "Gorliwie o was zabiegają niedobrze, lecz chcą was odłączyć, abyście o nich zabiegali."
  tags: []
"Ga4,18":
  text: "A zawsze jest dobrze zabiegać gorliwie o to, co dobre, a nie tylko wtedy, gdy jestem obecny wśród was."
  tags: []
"Ga4,19":
  text: "Moje dzieci, które znowu w bólach rodzę, aż Chrystus w was się ukształtuje;"
  tags: []
"Ga4,20":
  text: "Chciałbym teraz być wśród was i zmienić swój głos, ponieważ jestem zaniepokojony o was."
  tags: []
"Ga4,21":
  text: "Powiedzcie mi, wy, którzy chcecie być pod prawem, czy nie słuchacie, co mówi prawo?"
  tags: []
"Ga4,22":
  text: "Napisane jest bowiem, że Abraham miał dwóch synów, jednego z niewolnicy, a drugiego z wolnej."
  tags: []
"Ga4,23":
  text: "Lecz ten z niewolnicy urodził się według ciała, ten zaś z wolnej – według obietnicy."
  tags: []
"Ga4,24":
  text: "Ma to znaczenie alegoryczne: te kobiety oznaczają dwa przymierza: jedno z góry Synaj, które rodzi w niewolę – jest nim Hagar."
  tags: []
"Ga4,25":
  text: "Hagar bowiem to góra Synaj w Arabii, a odpowiada ona dzisiejszemu Jeruzalem, bo jest ono w niewoli wraz ze swoimi dziećmi."
  tags: []
"Ga4,26":
  text: "Natomiast Jeruzalem, które jest w górze, jest wolne i ono jest matką nas wszystkich."
  tags: []
"Ga4,27":
  text: "Napisane jest bowiem: Raduj się, niepłodna, która nie rodzisz, wykrzyknij i zawołaj, która nie znasz bólów porodowych, bo ta opuszczona ma więcej dzieci niż ta, która ma męża."
  tags: []
"Ga4,28":
  text: "My więc, bracia, jak Izaak jesteśmy dziećmi obietnicy."
  tags: []
"Ga4,29":
  text: "Lecz jak kiedyś ten, który urodził się według ciała, prześladował tego, który urodził się według Ducha, tak dzieje się i teraz."
  tags: []
"Ga4,30":
  text: "Co jednak mówi Pismo? Wypędź niewolnicę i jej syna. Nie będzie bowiem syn niewolnicy dziedziczył z synem wolnej."
  tags: []
"Ga4,31":
  text: "Tak więc, bracia, nie jesteśmy dziećmi niewolnicy, ale wolnej."
  tags: []
