"Ga4,1": "Mówię więc: Dopóki dziedzic jest dzieckiem, niczym się nie różni od sługi, chociaż jest panem wszystkiego."
"Ga4,2": "Lecz jest poddany opiekunom i zarządcom aż do czasu wyznaczonego przez ojca."
"Ga4,3": "Podobnie i my, gdy byliśmy dziećmi, byliśmy w niewoli żywiołów tego świata."
"Ga4,4": "Lecz gdy nadeszła pełnia czasu, Bóg posłał swego Syna, zrodzonego z kobiety, zrodzonego pod prawem;"
"Ga4,5": "Aby wykupił tych, którzy byli pod prawem, abyśmy dostąpili usynowienia."
"Ga4,6": "A ponieważ jesteście synami, Bóg posłał do waszych serc Ducha swego Syna, wołającego: Abba, Ojcze!"
"Ga4,7": "Tak więc już nie jesteś sługą, ale synem, a jeśli synem, to i dziedzicem Bożym przez Chrystusa."
"Ga4,8": "Wprawdzie dawniej, gdy nie znaliście Boga, służyliście tym, którzy z natury nie są bogami."
"Ga4,9": "Ale teraz, gdy poznaliście Boga, a raczej gdy zostaliście przez Boga poznani, jakże możecie ponownie wracać do słabych i nędznych żywiołów, którym ponownie chcecie służyć?"
"Ga4,10": "Zachowujecie dni i miesiące, pory i lata."
"Ga4,11": "Boję się o was, czy przypadkiem na próżno nie trudziłem się nad wami."
"Ga4,12": "Bracia, proszę was, bądźcie tacy jak ja, gdyż i ja jestem taki jak wy. W niczym mnie nie skrzywdziliście."
"Ga4,13": "Wiecie przecież, że pierwszy raz głosiłem wam ewangelię w słabości ciała."
"Ga4,14": "A mojej cielesnej próby nie lekceważyliście sobie ani nie wzgardziliście, ale przyjęliście mnie jak anioła Boga, jak samego Chrystusa Jezusa."
"Ga4,15": "Gdzież więc się podziało to wasze błogosławieństwo? Daję wam bowiem świadectwo, że gdyby to było możliwe, wyłupilibyście sobie oczy i dali je mnie."
"Ga4,16": "Czy mówiąc wam prawdę, stałem się waszym nieprzyjacielem?"
"Ga4,17": "Gorliwie o was zabiegają niedobrze, lecz chcą was odłączyć, abyście o nich zabiegali."
"Ga4,18": "A zawsze jest dobrze zabiegać gorliwie o to, co dobre, a nie tylko wtedy, gdy jestem obecny wśród was."
"Ga4,19": "Moje dzieci, które znowu w bólach rodzę, aż Chrystus w was się ukształtuje;"
"Ga4,20": "Chciałbym teraz być wśród was i zmienić swój głos, ponieważ jestem zaniepokojony o was."
"Ga4,21": "Powiedzcie mi, wy, którzy chcecie być pod prawem, czy nie słuchacie, co mówi prawo?"
"Ga4,22": "Napisane jest bowiem, że Abraham miał dwóch synów, jednego z niewolnicy, a drugiego z wolnej."
"Ga4,23": "Lecz ten z niewolnicy urodził się według ciała, ten zaś z wolnej – według obietnicy."
"Ga4,24": "Ma to znaczenie alegoryczne: te kobiety oznaczają dwa przymierza: jedno z góry Synaj, które rodzi w niewolę – jest nim Hagar."
"Ga4,25": "Hagar bowiem to góra Synaj w Arabii, a odpowiada ona dzisiejszemu Jeruzalem, bo jest ono w niewoli wraz ze swoimi dziećmi."
"Ga4,26": "Natomiast Jeruzalem, które jest w górze, jest wolne i ono jest matką nas wszystkich."
"Ga4,27": "Napisane jest bowiem: Raduj się, niepłodna, która nie rodzisz, wykrzyknij i zawołaj, która nie znasz bólów porodowych, bo ta opuszczona ma więcej dzieci niż ta, która ma męża."
"Ga4,28": "My więc, bracia, jak Izaak jesteśmy dziećmi obietnicy."
"Ga4,29": "Lecz jak kiedyś ten, który urodził się według ciała, prześladował tego, który urodził się według Ducha, tak dzieje się i teraz."
"Ga4,30": "Co jednak mówi Pismo? Wypędź niewolnicę i jej syna. Nie będzie bowiem syn niewolnicy dziedziczył z synem wolnej."
"Ga4,31": "Tak więc, bracia, nie jesteśmy dziećmi niewolnicy, ale wolnej."
