"Ga3,1":
  text: "O głupi Galaci! Któż was omamił, abyście nie byli posłuszni prawdzie, was, przed których oczami został wymalowany Jezus Chrystus i wśród których został ukrzyżowany?"
  tags: []
"Ga3,2":
  text: "Tego tylko chciałbym się od was dowiedzieć: Czy przez uczynki prawa otrzymaliście Ducha, czy przez słuchanie wiary?"
  tags: []
"Ga3,3":
  text: "Tak głupi jesteście? Rozpoczęliście duchem, a teraz kończycie ciałem?"
  tags: []
"Ga3,4":
  text: "Tak wiele cierpieliście na próżno, jeśli rzeczywiście na próżno?"
  tags: []
"Ga3,5":
  text: "Ten więc, który udziela wam Ducha i czyni cuda wśród was, czyni to przez uczynki prawa czy przez słuchanie wiary?"
  tags: []
"Ga3,6":
  text: "Tak jak Abraham uwierzył Bogu i zostało mu to poczytane za sprawiedliwość."
  tags: []
"Ga3,7":
  text: "Wiedzcie zatem, że ci, którzy są z wiary, ci są synami Abrahama."
  tags: []
"Ga3,8":
  text: "A Pismo, które przewidziało, że Bóg z wiary będzie usprawiedliwiał pogan, wcześniej ogłosiło ewangelię Abrahamowi: W tobie będą błogosławione wszystkie narody."
  tags: []
"Ga3,9":
  text: "Tak więc ci, którzy są z wiary, dostępują błogosławieństwa wraz z wierzącym Abrahamem."
  tags: []
"Ga3,10":
  text: "Na wszystkich bowiem, którzy są z uczynków prawa, ciąży przekleństwo, bo jest napisane: Przeklęty każdy, kto nie wytrwa w wypełnianiu wszystkiego, co jest napisane w księdze Prawa."
  tags: []
"Ga3,11":
  text: "A że przez prawo nikt nie jest usprawiedliwiony przed Bogiem, jest oczywiste, bo: Sprawiedliwy będzie żył z wiary."
  tags: []
"Ga3,12":
  text: "Prawo zaś nie jest z wiary, lecz: Człowiek, który je wypełnia, przez nie będzie żył."
  tags: []
"Ga3,13":
  text: "Chrystus odkupił nas z przekleństwa prawa, stając się za nas przekleństwem (bo jest napisane: Przeklęty każdy, kto wisi na drzewie);"
  tags: []
"Ga3,14":
  text: "Aby błogosławieństwo Abrahama w Chrystusie Jezusie przeszło na pogan i abyśmy przez wiarę otrzymali obietnicę Ducha."
  tags: []
"Ga3,15":
  text: "Bracia, mówię po ludzku: Przecież nawet zatwierdzonego testamentu człowieka nikt nie obala ani do niego nic nie dodaje."
  tags: []
"Ga3,16":
  text: "Otóż Abrahamowi i jego potomkowi zostały dane obietnice. Nie mówi: I jego potomkom, jak o wielu, ale jak o jednym: I twemu potomkowi, którym jest Chrystus."
  tags: []
"Ga3,17":
  text: "To zaś mówię: Przymierza zatwierdzonego przedtem przez Boga względem Chrystusa nie znosi prawo, które powstało czterysta trzydzieści lat później, tak aby unieważnić obietnicę."
  tags: []
"Ga3,18":
  text: "Jeśli bowiem dziedzictwo jest z prawa, to już nie z obietnicy. Lecz Bóg darował je Abrahamowi przez obietnicę."
  tags: []
"Ga3,19":
  text: "Po co więc prawo? Zostało dodane z powodu przestępstw, aż do przyjścia potomka, któremu złożono obietnicę, ustanowione przez aniołów ręką pośrednika."
  tags: []
"Ga3,20":
  text: "Lecz pośrednik nie jest dla jednego, ale Bóg jest jeden."
  tags: []
"Ga3,21":
  text: "Czy więc prawo jest przeciwko obietnicom Boga? Nie daj Boże! Gdyby bowiem zostało dane prawo, które mogłoby ożywiać, sprawiedliwość rzeczywiście byłaby z prawa."
  tags: []
"Ga3,22":
  text: "Lecz Pismo zamknęło wszystko pod grzech, aby obietnica z wiary Jezusa Chrystusa została dana wierzącym."
  tags: []
"Ga3,23":
  text: "Zanim zaś przyszła wiara, byliśmy poddani pod straż prawa i trzymani w zamknięciu aż do tej wiary, która potem miała być objawiona."
  tags: []
"Ga3,24":
  text: "Tak więc prawo było naszym pedagogiem do Chrystusa, abyśmy z wiary byli usprawiedliwieni."
  tags: []
"Ga3,25":
  text: "Lecz gdy przyszła wiara, już nie jesteśmy pod pedagogiem."
  tags: []
"Ga3,26":
  text: "Wszyscy bowiem jesteście synami Bożymi przez wiarę w Chrystusa Jezusa."
  tags: []
"Ga3,27":
  text: "Bo wszyscy, którzy zostaliście ochrzczeni w Chrystusie, przyodzialiście się w Chrystusa."
  tags: []
"Ga3,28":
  text: "Nie ma Żyda ani Greka, nie ma niewolnika ani wolnego, nie ma mężczyzny ani kobiety; wszyscy bowiem jedno jesteście w Chrystusie Jezusie."
  tags: []
"Ga3,29":
  text: "A jeśli należycie do Chrystusa, to jesteście potomstwem Abrahama, a zgodnie z obietnicą – dziedzicami."
  tags: []
