"Ga3,1": "O głupi Galaci! Któż was omamił, abyście nie byli posłuszni prawdzie, was, przed których oczami został wymalowany Jezus Chrystus i wśród których został ukrzyżowany?"
"Ga3,2": "Tego tylko chciałbym się od was dowiedzieć: Czy przez uczynki prawa otrzymaliście Ducha, czy przez słuchanie wiary?"
"Ga3,3": "Tak głupi jesteście? Rozpoczęliście duchem, a teraz kończycie ciałem?"
"Ga3,4": "Tak wiele cierpieliście na próżno, jeśli rzeczywiście na próżno?"
"Ga3,5": "Ten więc, który udziela wam Ducha i czyni cuda wśród was, czyni to przez uczynki prawa czy przez słuchanie wiary?"
"Ga3,6": "Tak jak Abraham uwierzył Bogu i zostało mu to poczytane za sprawiedliwość."
"Ga3,7": "Wiedzcie zatem, że ci, którzy są z wiary, ci są synami Abrahama."
"Ga3,8": "A Pismo, które przewidziało, że Bóg z wiary będzie usprawiedliwiał pogan, wcześniej ogłosiło ewangelię Abrahamowi: W tobie będą błogosławione wszystkie narody."
"Ga3,9": "Tak więc ci, którzy są z wiary, dostępują błogosławieństwa wraz z wierzącym Abrahamem."
"Ga3,10": "Na wszystkich bowiem, którzy są z uczynków prawa, ciąży przekleństwo, bo jest napisane: Przeklęty każdy, kto nie wytrwa w wypełnianiu wszystkiego, co jest napisane w księdze Prawa."
"Ga3,11": "A że przez prawo nikt nie jest usprawiedliwiony przed Bogiem, jest oczywiste, bo: Sprawiedliwy będzie żył z wiary."
"Ga3,12": "Prawo zaś nie jest z wiary, lecz: Człowiek, który je wypełnia, przez nie będzie żył."
"Ga3,13": "Chrystus odkupił nas z przekleństwa prawa, stając się za nas przekleństwem (bo jest napisane: Przeklęty każdy, kto wisi na drzewie);"
"Ga3,14": "Aby błogosławieństwo Abrahama w Chrystusie Jezusie przeszło na pogan i abyśmy przez wiarę otrzymali obietnicę Ducha."
"Ga3,15": "Bracia, mówię po ludzku: Przecież nawet zatwierdzonego testamentu człowieka nikt nie obala ani do niego nic nie dodaje."
"Ga3,16": "Otóż Abrahamowi i jego potomkowi zostały dane obietnice. Nie mówi: I jego potomkom, jak o wielu, ale jak o jednym: I twemu potomkowi, którym jest Chrystus."
"Ga3,17": "To zaś mówię: Przymierza zatwierdzonego przedtem przez Boga względem Chrystusa nie znosi prawo, które powstało czterysta trzydzieści lat później, tak aby unieważnić obietnicę."
"Ga3,18": "Jeśli bowiem dziedzictwo jest z prawa, to już nie z obietnicy. Lecz Bóg darował je Abrahamowi przez obietnicę."
"Ga3,19": "Po co więc prawo? Zostało dodane z powodu przestępstw, aż do przyjścia potomka, któremu złożono obietnicę, ustanowione przez aniołów ręką pośrednika."
"Ga3,20": "Lecz pośrednik nie jest dla jednego, ale Bóg jest jeden."
"Ga3,21": "Czy więc prawo jest przeciwko obietnicom Boga? Nie daj Boże! Gdyby bowiem zostało dane prawo, które mogłoby ożywiać, sprawiedliwość rzeczywiście byłaby z prawa."
"Ga3,22": "Lecz Pismo zamknęło wszystko pod grzech, aby obietnica z wiary Jezusa Chrystusa została dana wierzącym."
"Ga3,23": "Zanim zaś przyszła wiara, byliśmy poddani pod straż prawa i trzymani w zamknięciu aż do tej wiary, która potem miała być objawiona."
"Ga3,24": "Tak więc prawo było naszym pedagogiem do Chrystusa, abyśmy z wiary byli usprawiedliwieni."
"Ga3,25": "Lecz gdy przyszła wiara, już nie jesteśmy pod pedagogiem."
"Ga3,26": "Wszyscy bowiem jesteście synami Bożymi przez wiarę w Chrystusa Jezusa."
"Ga3,27": "Bo wszyscy, którzy zostaliście ochrzczeni w Chrystusie, przyodzialiście się w Chrystusa."
"Ga3,28": "Nie ma Żyda ani Greka, nie ma niewolnika ani wolnego, nie ma mężczyzny ani kobiety; wszyscy bowiem jedno jesteście w Chrystusie Jezusie."
"Ga3,29": "A jeśli należycie do Chrystusa, to jesteście potomstwem Abrahama, a zgodnie z obietnicą – dziedzicami."
