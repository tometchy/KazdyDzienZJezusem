"Ga6,1":
  text: "Bracia, jeśli przydarzy się komuś jakiś upadek, wy, którzy jesteście duchowi, poprawiajcie takiego w duchu łagodności, uważając każdy na samego siebie, abyś i ty nie był kuszony."
  tags: []
"Ga6,2":
  text: "Jedni drugich brzemiona noście, a tak wypełniajcie prawo Chrystusa."
  tags: []
"Ga6,3":
  text: "Jeśli bowiem ktoś uważa, że jest czymś, będąc niczym, ten zwodzi samego siebie."
  tags: []
"Ga6,4":
  text: "Każdy zaś niech bada swoje własne czyny, a wtedy będzie mieć powód do chluby w samym sobie, a nie w kimś innym."
  tags: []
"Ga6,5":
  text: "Każdy bowiem poniesie swoje własne brzemię."
  tags: []
"Ga6,6":
  text: "A ten, kto jest nauczany słowa, niech udziela ze wszystkich dóbr temu, który go naucza."
  tags: []
"Ga6,7":
  text: "Nie łudźcie się, Bóg nie da się z siebie naśmiewać. Co bowiem człowiek sieje, to też żąć będzie."
  tags: []
"Ga6,8":
  text: "Bo kto sieje dla swego ciała, z ciała żąć będzie zniszczenie. Kto zaś sieje dla Ducha, z Ducha żąć będzie życie wieczne."
  tags: []
"Ga6,9":
  text: "A w czynieniu dobra nie bądźmy znużeni, bo w swoim czasie żąć będziemy, jeśli nie ustaniemy."
  tags: []
"Ga6,10":
  text: "Dlatego więc, dopóki mamy czas, czyńmy dobrze wszystkim, a zwłaszcza domownikom wiary."
  tags: []
"Ga6,11":
  text: "Widzicie, jaki długi list napisałem do was własnoręcznie."
  tags: []
"Ga6,12":
  text: "Ci wszyscy, którzy chcą się podobać według ciała, przymuszają was do obrzezania, aby tylko nie cierpieć prześladowania z powodu krzyża Chrystusa."
  tags: []
"Ga6,13":
  text: "Ci bowiem, którzy są obrzezani, sami nie zachowują prawa, ale chcą, abyście wy dali się obrzezać, żeby się chlubić waszym ciałem."
  tags: []
"Ga6,14":
  text: "Co do mnie, nie daj Boże, abym się miał chlubić z czegoś innego, jak tylko z krzyża naszego Pana Jezusa Chrystusa, przez którego świat jest ukrzyżowany dla mnie, a ja dla świata."
  tags: []
"Ga6,15":
  text: "W Chrystusie Jezusie bowiem ani obrzezanie nic nie znaczy, ani nieobrzezanie, ale nowe stworzenie."
  tags: []
"Ga6,16":
  text: "A na tych wszystkich, którzy będą postępować według tej zasady, niech przyjdzie pokój i miłosierdzie, i na Izraela Bożego."
  tags: []
"Ga6,17":
  text: "Odtąd niech mi nikt nie sprawia przykrości. Ja bowiem na swoim ciele noszę piętna Pana Jezusa."
  tags: []
"Ga6,18":
  text: "Łaska naszego Pana Jezusa Chrystusa niech będzie z waszym duchem, bracia. Amen."
  tags: []
