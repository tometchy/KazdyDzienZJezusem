"Ga6,1": "Bracia, jeśli przydarzy się komuś jakiś upadek, wy, którzy jesteście duchowi, poprawiajcie takiego w duchu łagodności, uważając każdy na samego siebie, abyś i ty nie był kuszony."
"Ga6,2": "Jedni drugich brzemiona noście, a tak wypełniajcie prawo Chrystusa."
"Ga6,3": "Jeśli bowiem ktoś uważa, że jest czymś, będąc niczym, ten zwodzi samego siebie."
"Ga6,4": "Każdy zaś niech bada swoje własne czyny, a wtedy będzie mieć powód do chluby w samym sobie, a nie w kimś innym."
"Ga6,5": "Każdy bowiem poniesie swoje własne brzemię."
"Ga6,6": "A ten, kto jest nauczany słowa, niech udziela ze wszystkich dóbr temu, który go naucza."
"Ga6,7": "Nie łudźcie się, Bóg nie da się z siebie naśmiewać. Co bowiem człowiek sieje, to też żąć będzie."
"Ga6,8": "Bo kto sieje dla swego ciała, z ciała żąć będzie zniszczenie. Kto zaś sieje dla Ducha, z Ducha żąć będzie życie wieczne."
"Ga6,9": "A w czynieniu dobra nie bądźmy znużeni, bo w swoim czasie żąć będziemy, jeśli nie ustaniemy."
"Ga6,10": "Dlatego więc, dopóki mamy czas, czyńmy dobrze wszystkim, a zwłaszcza domownikom wiary."
"Ga6,11": "Widzicie, jaki długi list napisałem do was własnoręcznie."
"Ga6,12": "Ci wszyscy, którzy chcą się podobać według ciała, przymuszają was do obrzezania, aby tylko nie cierpieć prześladowania z powodu krzyża Chrystusa."
"Ga6,13": "Ci bowiem, którzy są obrzezani, sami nie zachowują prawa, ale chcą, abyście wy dali się obrzezać, żeby się chlubić waszym ciałem."
"Ga6,14": "Co do mnie, nie daj Boże, abym się miał chlubić z czegoś innego, jak tylko z krzyża naszego Pana Jezusa Chrystusa, przez którego świat jest ukrzyżowany dla mnie, a ja dla świata."
"Ga6,15": "W Chrystusie Jezusie bowiem ani obrzezanie nic nie znaczy, ani nieobrzezanie, ale nowe stworzenie."
"Ga6,16": "A na tych wszystkich, którzy będą postępować według tej zasady, niech przyjdzie pokój i miłosierdzie, i na Izraela Bożego."
"Ga6,17": "Odtąd niech mi nikt nie sprawia przykrości. Ja bowiem na swoim ciele noszę piętna Pana Jezusa."
"Ga6,18": "Łaska naszego Pana Jezusa Chrystusa niech będzie z waszym duchem, bracia. Amen."
