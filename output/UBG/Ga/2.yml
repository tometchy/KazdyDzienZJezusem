"Ga2,1": "Potem, po czternastu latach, udałem się ponownie do Jerozolimy wraz z Barnabą, wziąwszy ze sobą także Tytusa."
"Ga2,2": "A udałem się tam zgodnie z objawieniem i przedstawiłem im ewangelię, którą głoszę wśród pogan, osobno zaś tym, którzy cieszą się uznaniem, aby się czasem nie okazało, że biegnę albo biegłem na próżno."
"Ga2,3": "Lecz nawet Tytusa, który był ze mną, nie zmuszono do obrzezania, mimo że był Grekiem;"
"Ga2,4": "A to z powodu wprowadzonych fałszywych braci, którzy się wkradli, aby wyszpiegować naszą wolność, jaką mamy w Chrystusie Jezusie, aby nas zniewolić."
"Ga2,5": "Nie ustąpiliśmy im ani na chwilę i nie poddaliśmy się, aby pozostała wśród was prawda ewangelii."
"Ga2,6": "A co do cieszących się uznaniem – jakimi kiedyś byli, jest dla mnie bez znaczenia, Bóg bowiem nie ma względu na osobę – ci więc, którzy cieszą się uznaniem, nic mi nie narzucili."
"Ga2,7": "Wręcz przeciwnie, gdy widzieli, że została mi powierzona ewangelia wśród nieobrzezanych, jak Piotrowi wśród obrzezanych;"
"Ga2,8": "(Ten bowiem, który działał skutecznie przez Piotra w sprawowaniu apostolstwa wśród obrzezanych, skutecznie działał i we mnie wśród pogan);"
"Ga2,9": "I gdy poznali daną mi łaskę, Jakub, Kefas i Jan, którzy są uważani za filary, podali mnie i Barnabie prawicę na znak wspólnoty, abyśmy my poszli do pogan, a oni do obrzezanych."
"Ga2,10": "Bylebyśmy tylko pamiętali o ubogich, co też gorliwie starałem się czynić."
"Ga2,11": "A gdy Piotr przybył do Antiochii, sprzeciwiłem mu się w twarz, bo był godny nagany."
"Ga2,12": "Zanim bowiem przyszli niektórzy od Jakuba, jadał razem z poganami. Gdy zaś oni przyszli, odsunął się i odłączył, obawiając się tych, którzy byli z obrzezania."
"Ga2,13": "A razem z nim obłudnie postępowali i inni Żydzi, tak że i Barnaba dał się wciągnąć w tę ich obłudę."
"Ga2,14": "Lecz gdy zobaczyłem, że nie postępują zgodnie z prawdą ewangelii, powiedziałem Piotrowi wobec wszystkich: Jeśli ty, będąc Żydem, żyjesz po pogańsku, a nie po żydowsku, czemu przymuszasz pogan, aby żyli po żydowsku?"
"Ga2,15": "My, którzy jesteśmy Żydami z urodzenia, a nie grzesznikami z pogan;"
"Ga2,16": "Wiedząc, że człowiek nie jest usprawiedliwiony z uczynków prawa, ale przez wiarę w Jezusa Chrystusa, i my uwierzyliśmy w Jezusa Chrystusa, abyśmy byli usprawiedliwieni z wiary Chrystusa, a nie z uczynków prawa, dlatego że z uczynków prawa nie będzie usprawiedliwione żadne ciało."
"Ga2,17": "A jeśli my, szukając usprawiedliwienia w Chrystusie, sami okazaliśmy się grzesznikami, to czy Chrystus jest sługą grzechu? Nie daj Boże!"
"Ga2,18": "Jeśli bowiem na nowo buduję to, co zburzyłem, samego siebie czynię przestępcą."
"Ga2,19": "Bo ja przez prawo umarłem dla prawa, abym żył dla Boga."
"Ga2,20": "Z Chrystusem jestem ukrzyżowany: żyję, ale już nie ja, lecz żyje we mnie Chrystus. A to, że teraz żyję w ciele, żyję w wierze Syna Bożego, który mnie umiłował i wydał za mnie samego siebie."
"Ga2,21": "Nie odrzucam łaski Boga. Jeśli bowiem przez prawo jest sprawiedliwość, to Chrystus umarł na próżno."
