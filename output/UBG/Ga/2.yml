"Ga2,1":
  text: "Potem, po czternastu latach, udałem się ponownie do Jerozolimy wraz z Barnabą, wziąwszy ze sobą także Tytusa."
  tags: []
"Ga2,2":
  text: "A udałem się tam zgodnie z objawieniem i przedstawiłem im ewangelię, którą głoszę wśród pogan, osobno zaś tym, którzy cieszą się uznaniem, aby się czasem nie okazało, że biegnę albo biegłem na próżno."
  tags: []
"Ga2,3":
  text: "Lecz nawet Tytusa, który był ze mną, nie zmuszono do obrzezania, mimo że był Grekiem;"
  tags: []
"Ga2,4":
  text: "A to z powodu wprowadzonych fałszywych braci, którzy się wkradli, aby wyszpiegować naszą wolność, jaką mamy w Chrystusie Jezusie, aby nas zniewolić."
  tags: []
"Ga2,5":
  text: "Nie ustąpiliśmy im ani na chwilę i nie poddaliśmy się, aby pozostała wśród was prawda ewangelii."
  tags: []
"Ga2,6":
  text: "A co do cieszących się uznaniem – jakimi kiedyś byli, jest dla mnie bez znaczenia, Bóg bowiem nie ma względu na osobę – ci więc, którzy cieszą się uznaniem, nic mi nie narzucili."
  tags: []
"Ga2,7":
  text: "Wręcz przeciwnie, gdy widzieli, że została mi powierzona ewangelia wśród nieobrzezanych, jak Piotrowi wśród obrzezanych;"
  tags: []
"Ga2,8":
  text: "(Ten bowiem, który działał skutecznie przez Piotra w sprawowaniu apostolstwa wśród obrzezanych, skutecznie działał i we mnie wśród pogan);"
  tags: []
"Ga2,9":
  text: "I gdy poznali daną mi łaskę, Jakub, Kefas i Jan, którzy są uważani za filary, podali mnie i Barnabie prawicę na znak wspólnoty, abyśmy my poszli do pogan, a oni do obrzezanych."
  tags: []
"Ga2,10":
  text: "Bylebyśmy tylko pamiętali o ubogich, co też gorliwie starałem się czynić."
  tags: []
"Ga2,11":
  text: "A gdy Piotr przybył do Antiochii, sprzeciwiłem mu się w twarz, bo był godny nagany."
  tags: []
"Ga2,12":
  text: "Zanim bowiem przyszli niektórzy od Jakuba, jadał razem z poganami. Gdy zaś oni przyszli, odsunął się i odłączył, obawiając się tych, którzy byli z obrzezania."
  tags: []
"Ga2,13":
  text: "A razem z nim obłudnie postępowali i inni Żydzi, tak że i Barnaba dał się wciągnąć w tę ich obłudę."
  tags: []
"Ga2,14":
  text: "Lecz gdy zobaczyłem, że nie postępują zgodnie z prawdą ewangelii, powiedziałem Piotrowi wobec wszystkich: Jeśli ty, będąc Żydem, żyjesz po pogańsku, a nie po żydowsku, czemu przymuszasz pogan, aby żyli po żydowsku?"
  tags: []
"Ga2,15":
  text: "My, którzy jesteśmy Żydami z urodzenia, a nie grzesznikami z pogan;"
  tags: []
"Ga2,16":
  text: "Wiedząc, że człowiek nie jest usprawiedliwiony z uczynków prawa, ale przez wiarę w Jezusa Chrystusa, i my uwierzyliśmy w Jezusa Chrystusa, abyśmy byli usprawiedliwieni z wiary Chrystusa, a nie z uczynków prawa, dlatego że z uczynków prawa nie będzie usprawiedliwione żadne ciało."
  tags: []
"Ga2,17":
  text: "A jeśli my, szukając usprawiedliwienia w Chrystusie, sami okazaliśmy się grzesznikami, to czy Chrystus jest sługą grzechu? Nie daj Boże!"
  tags: []
"Ga2,18":
  text: "Jeśli bowiem na nowo buduję to, co zburzyłem, samego siebie czynię przestępcą."
  tags: []
"Ga2,19":
  text: "Bo ja przez prawo umarłem dla prawa, abym żył dla Boga."
  tags: []
"Ga2,20":
  text: "Z Chrystusem jestem ukrzyżowany: żyję, ale już nie ja, lecz żyje we mnie Chrystus. A to, że teraz żyję w ciele, żyję w wierze Syna Bożego, który mnie umiłował i wydał za mnie samego siebie."
  tags: []
"Ga2,21":
  text: "Nie odrzucam łaski Boga. Jeśli bowiem przez prawo jest sprawiedliwość, to Chrystus umarł na próżno."
  tags: []
