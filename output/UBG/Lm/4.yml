"Lm4,1":
  text: "O jakże zaśniedziało złoto! Jakże zmieniło się najczystsze złoto! Rozrzucono kamienie świątyni po rogach wszystkich ulic."
  tags: []
"Lm4,2":
  text: "Szlachetni synowie Syjonu, cenieni jak czyste złoto, jakże są poczytywani za gliniane naczynia, za dzieło rąk garncarza!"
  tags: []
"Lm4,3":
  text: "Nawet smoki dają pierś i karmią swoje młode, ale córka mojego ludu stała się okrutna jak strusie na pustyni."
  tags: []
"Lm4,4":
  text: "Język ssącego przylgnął do podniebienia z powodu pragnienia, dzieci prosiły o chleb, lecz nikt im go nie ułamał."
  tags: []
"Lm4,5":
  text: "Ci, którzy jadali wyborne potrawy, giną na ulicach. Ci, którzy byli wychowani w szkarłacie, przytulają się do gnoju."
  tags: []
"Lm4,6":
  text: "Większa jest nieprawość córki mojego ludu niż grzech Sodomy, co została zniszczona w okamgnieniu, a nie dotknęła jej żadna ręka."
  tags: []
"Lm4,7":
  text: "Jej nazirejczycy byli czystsi niż śnieg, bielsi niż mleko, ich ciała bardziej rumiane niż rubiny, byli wyciosani jak szafir."
  tags: []
"Lm4,8":
  text: "Ale teraz ich wygląd jest czarniejszy niż węgiel, nie poznaje się ich na ulicach. Ich skóra przyschła do kości, wyschła i stała się jak drewno."
  tags: []
"Lm4,9":
  text: "Lepiej jest tym, którzy zostali pobici od miecza, niż tym, co umierają z głodu, gdyż oni giną, będąc przebici brakiem plonów pola."
  tags: []
"Lm4,10":
  text: "Ręce czułych kobiet gotowały własne dzieci. Były ich pokarmem w czasie klęski córki mojego ludu."
  tags: []
"Lm4,11":
  text: "Dopełnił PAN swego wzburzenia, wylał swój zapalczywy gniew i rozpalił ogień na Syjonie, który strawił jego fundamenty."
  tags: []
"Lm4,12":
  text: "Nigdy nie uwierzyliby królowie ziemi i wszyscy mieszkańcy świata, że przeciwnik i wróg mógłby wejść w bramy Jerozolimy."
  tags: []
"Lm4,13":
  text: "Z powodu grzechów jej proroków i nieprawości jej kapłanów, którzy przelewali krew sprawiedliwych pośród niej;"
  tags: []
"Lm4,14":
  text: "Tułali się jak ślepi po ulicach, splugawili się krwią, tak że nie można było dotknąć ich szat."
  tags: []
"Lm4,15":
  text: "Dlatego wołano na nich: Odstąpcie, nieczyści! Odstąpcie, odstąpcie, nie dotykajcie! Gdy odeszli i tułali się, mówiono wśród pogan: Nie będą już mogli tam zamieszkać."
  tags: []
"Lm4,16":
  text: "Oblicze PANA rozproszyło ich, już więcej nie spojrzy na nich; nie ma szacunku dla kapłanów ani nie ma litości dla starców."
  tags: []
"Lm4,17":
  text: "Aż dotąd nasze oczy słabły z powodu naszej daremnej pomocy. Wypatrywaliśmy czujnie narodu, który nie mógł nas wybawić."
  tags: []
"Lm4,18":
  text: "Śledzą nasze kroki tak, że nie możemy chodzić po naszych ulicach. Zbliżył się nasz koniec, wypełniły się nasze dni, nadszedł nasz kres."
  tags: []
"Lm4,19":
  text: "Nasi prześladowcy są szybsi niż orły niebieskie; ścigają nas po górach i czyhają na nas na pustyni."
  tags: []
"Lm4,20":
  text: "Oddech naszych nozdrzy, pomazaniec PANA, został schwytany w ich doły; o nim mówiliśmy: W jego cieniu będziemy żyć wśród pogan."
  tags: []
"Lm4,21":
  text: "Raduj się i wesel, córko Edomu, która mieszkasz w ziemi Us; przejdzie też do ciebie kielich, upijesz się i obnażysz."
  tags: []
"Lm4,22":
  text: "Skończyła się twoja kara, o córko Syjonu; on nie będzie cię dłużej trzymał na wygnaniu. Nawiedzi twoją nieprawość, córko Edomu, i odkryje twoje grzechy."
  tags: []
