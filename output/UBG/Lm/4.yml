"Lm4,1": "O jakże zaśniedziało złoto! Jakże zmieniło się najczystsze złoto! Rozrzucono kamienie świątyni po rogach wszystkich ulic."
"Lm4,2": "Szlachetni synowie Syjonu, cenieni jak czyste złoto, jakże są poczytywani za gliniane naczynia, za dzieło rąk garncarza!"
"Lm4,3": "Nawet smoki dają pierś i karmią swoje młode, ale córka mojego ludu stała się okrutna jak strusie na pustyni."
"Lm4,4": "Język ssącego przylgnął do podniebienia z powodu pragnienia, dzieci prosiły o chleb, lecz nikt im go nie ułamał."
"Lm4,5": "Ci, którzy jadali wyborne potrawy, giną na ulicach. Ci, którzy byli wychowani w szkarłacie, przytulają się do gnoju."
"Lm4,6": "Większa jest nieprawość córki mojego ludu niż grzech Sodomy, co została zniszczona w okamgnieniu, a nie dotknęła jej żadna ręka."
"Lm4,7": "Jej nazirejczycy byli czystsi niż śnieg, bielsi niż mleko, ich ciała bardziej rumiane niż rubiny, byli wyciosani jak szafir."
"Lm4,8": "Ale teraz ich wygląd jest czarniejszy niż węgiel, nie poznaje się ich na ulicach. Ich skóra przyschła do kości, wyschła i stała się jak drewno."
"Lm4,9": "Lepiej jest tym, którzy zostali pobici od miecza, niż tym, co umierają z głodu, gdyż oni giną, będąc przebici brakiem plonów pola."
"Lm4,10": "Ręce czułych kobiet gotowały własne dzieci. Były ich pokarmem w czasie klęski córki mojego ludu."
"Lm4,11": "Dopełnił PAN swego wzburzenia, wylał swój zapalczywy gniew i rozpalił ogień na Syjonie, który strawił jego fundamenty."
"Lm4,12": "Nigdy nie uwierzyliby królowie ziemi i wszyscy mieszkańcy świata, że przeciwnik i wróg mógłby wejść w bramy Jerozolimy."
"Lm4,13": "Z powodu grzechów jej proroków i nieprawości jej kapłanów, którzy przelewali krew sprawiedliwych pośród niej;"
"Lm4,14": "Tułali się jak ślepi po ulicach, splugawili się krwią, tak że nie można było dotknąć ich szat."
"Lm4,15": "Dlatego wołano na nich: Odstąpcie, nieczyści! Odstąpcie, odstąpcie, nie dotykajcie! Gdy odeszli i tułali się, mówiono wśród pogan: Nie będą już mogli tam zamieszkać."
"Lm4,16": "Oblicze PANA rozproszyło ich, już więcej nie spojrzy na nich; nie ma szacunku dla kapłanów ani nie ma litości dla starców."
"Lm4,17": "Aż dotąd nasze oczy słabły z powodu naszej daremnej pomocy. Wypatrywaliśmy czujnie narodu, który nie mógł nas wybawić."
"Lm4,18": "Śledzą nasze kroki tak, że nie możemy chodzić po naszych ulicach. Zbliżył się nasz koniec, wypełniły się nasze dni, nadszedł nasz kres."
"Lm4,19": "Nasi prześladowcy są szybsi niż orły niebieskie; ścigają nas po górach i czyhają na nas na pustyni."
"Lm4,20": "Oddech naszych nozdrzy, pomazaniec PANA, został schwytany w ich doły; o nim mówiliśmy: W jego cieniu będziemy żyć wśród pogan."
"Lm4,21": "Raduj się i wesel, córko Edomu, która mieszkasz w ziemi Us; przejdzie też do ciebie kielich, upijesz się i obnażysz."
"Lm4,22": "Skończyła się twoja kara, o córko Syjonu; on nie będzie cię dłużej trzymał na wygnaniu. Nawiedzi twoją nieprawość, córko Edomu, i odkryje twoje grzechy."
