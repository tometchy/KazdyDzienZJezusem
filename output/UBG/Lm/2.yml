"Lm2,1":
  text: "Jakże zaciemnił Pan córkę Syjonu chmurą w swoim gniewie, zrzucił z nieba na ziemię chwałę Izraela, a nie wspomniał na podnóżek swoich nóg w dniu swej zapalczywości!"
  tags: []
"Lm2,2":
  text: "Pan pochłonął bez litości wszystkie domy Jakuba, zburzył w swej zapalczywości twierdze córki Judy, rzucił je o ziemię i zhańbił królestwo i jego książąt."
  tags: []
"Lm2,3":
  text: "Odciął w zapalczywości swego gniewu cały róg Izraela, cofnął swoją prawicę od wroga i zapłonął przeciwko Jakubowi jak ogień płonący, który pożera do szczętu wokoło."
  tags: []
"Lm2,4":
  text: "Naciągnął swój łuk jak wróg, postawił swoją prawicę jak przeciwnik i zabił wszystkich miłych dla oczu. W namiocie córki Syjonu wylał jak ogień swoją zapalczywość."
  tags: []
"Lm2,5":
  text: "Pan stał się jak wróg, pochłonął Izraela, pochłonął wszystkie jego pałace, zniszczył jego twierdze i pomnożył płacz i lament u córki Judy."
  tags: []
"Lm2,6":
  text: "Oderwał siłą swój namiot jak ogród, zniszczył swoje mieszkanie. PAN skazał na zapomnienie uroczyste święta i szabaty na Syjonie i w zapalczywości swego gniewu wzgardził królem i kapłanem."
  tags: []
"Lm2,7":
  text: "Pan odrzucił swój ołtarz, zbrzydła mu jego świątynia, wydał w ręce wroga mury jej pałacu. Podnieśli krzyk w domu PANA jak w dzień uroczystego święta."
  tags: []
"Lm2,8":
  text: "PAN postanowił zburzyć mur córki Syjonu, rozciągnął sznur mierniczy i nie cofnął swej ręki od zniszczenia. Pogrążył w żałobie baszty i mur, tak że razem omdlewają."
  tags: []
"Lm2,9":
  text: "Jej bramy zapadły się w ziemię, połamał i pokruszył jej rygle. Jej król i książęta są pośród pogan, nie ma już Prawa i jej prorocy nie mają widzenia od PANA."
  tags: []
"Lm2,10":
  text: "Starsi córki Syjonu usiedli na ziemi i zamilkli. Posypali prochem swe głowy i przepasali się worami. Dziewice Jerozolimy pochylają do ziemi swoje głowy."
  tags: []
"Lm2,11":
  text: "Moje oczy osłabły od łez, strwożyły się moje wnętrzności, moja wątroba wylała się na ziemię z powodu zniszczenia córki mojego ludu, gdy dzieci i niemowlęta omdlewają na ulicach miasta."
  tags: []
"Lm2,12":
  text: "Mówią swoim matkom: Gdzie jest zboże i wino? – gdy mdleją jak zranieni na ulicach miasta i oddają swoją duszę na łonie swoich matek."
  tags: []
"Lm2,13":
  text: "Kogo na świadka ustanowię? Do kogo cię przyrównam, o córko Jerozolimy? Do kogo cię porównam, abym cię pocieszył, dziewicza córko Syjonu? Twoja klęska bowiem jest wielka jak morze. Któż cię uleczy?"
  tags: []
"Lm2,14":
  text: "Twoi prorocy przepowiadali ci kłamstwo i marność, a nie odkrywali twojej nieprawości, aby zapobiec twojej niewoli, lecz przepowiadali kłamliwe brzemiona przyczyniające się do twojego wygnania."
  tags: []
"Lm2,15":
  text: "Klaskają nad tobą w dłonie wszyscy, którzy przechodzą drogą; świstają i kiwają głowami nad córką Jerozolimy, mówiąc: Czyż to jest miasto, które nazywano doskonałą pięknością i radością całej ziemi?"
  tags: []
"Lm2,16":
  text: "Otworzyli przeciw tobie swe usta wszyscy twoi wrogowie, świstają i zgrzytają zębami, mówiąc: Pochłonęliśmy je. Oto jest dzień, na który czekaliśmy; znaleźliśmy i zobaczyliśmy go."
  tags: []
"Lm2,17":
  text: "PAN uczynił, jak postanowił, wypełnił swoje słowo, które zapowiedział w dniach dawnych. Zburzył bez litości, pozwolił wrogowi radować się nad tobą, wywyższył róg twoich przeciwników."
  tags: []
"Lm2,18":
  text: "Ich serce wołało do Pana. Murze córki Syjonu, wylewaj łzy we dnie i w nocy jak strumień, nie dawaj sobie odpoczynku i niech nie uspokaja się źrenica twego oka."
  tags: []
"Lm2,19":
  text: "Wstań, wołaj w nocy na początku straży, wylewaj swe serce jak wodę przed obliczem Pana. Podnoś do niego swe ręce za duszę swych dzieci, które omdlewają z głodu na rogach wszystkich ulic."
  tags: []
"Lm2,20":
  text: "Spójrz, PANIE, i zobacz, komu tak uczyniłeś. Czy kobiety mają jeść swój płód, pieszczone niemowlęta? Czy kapłan i prorok mają być zabici w świątyni Pana?"
  tags: []
"Lm2,21":
  text: "Leżą na ziemi, na ulicach, dziecko i starzec. Moje dziewice i moi młodzieńcy polegli od miecza; pobiłeś ich w dzień swego gniewu, zabiłeś ich bez litości."
  tags: []
"Lm2,22":
  text: "Zwołałeś zewsząd, jak w dniu święta, moje trwogi, w dniu gniewu PANA nikt nie uszedł, nikt nie ocalał. Tych, których piastowałam i wychowałam, mój wróg wyniszczył."
  tags: []
