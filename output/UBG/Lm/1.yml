"Lm1,1":
  text: "Ach, jak samotnie siedzi miasto niegdyś tak pełne ludzi! Stało się jak wdowa! Niegdyś wielka wśród narodów i księżniczka wśród prowincji, teraz stała się podwładną."
  tags: []
"Lm1,2":
  text: "Nieustannie płacze w nocy, a na jej policzkach łzy. Nie ma nikogo, kto by ją pocieszył pośród wszystkich jej kochanków. Wszyscy jej przyjaciele zdradzili ją i stali się jej wrogami."
  tags: []
"Lm1,3":
  text: "Juda poszedł na wygnanie z powodu ucisku i wielkiej niewoli, mieszka między poganami i nie znajduje odpoczynku. Wszyscy jego prześladowcy dopadli go pośród ucisków."
  tags: []
"Lm1,4":
  text: "Drogi Syjonu płaczą, bo nikt nie przychodzi na uroczyste święta. Wszystkie jego bramy opustoszały, jego kapłani wzdychają, jego dziewice są smutne, a on sam jest pełny goryczy."
  tags: []
"Lm1,5":
  text: "Jego wrogowie są zwierzchnikami, jego przeciwnikom szczęśliwie się powodzi. PAN bowiem trapił go z powodu mnóstwa jego występków. Jego dzieci poszły do niewoli przed ciemięzcą."
  tags: []
"Lm1,6":
  text: "A tak odjęte zostało od córki Syjonu całe jej dostojeństwo. Jej książęta stali się jak jelenie, które nie znajdują pastwiska, i uchodzą bez siły przed tym, który je ściga."
  tags: []
"Lm1,7":
  text: "W dniach swego utrapienia i swej niedoli Jerozolima wspomina wszystkie swoje kosztowności, jakie miała za dawnych dni, gdy jej lud wpadł w ręce wroga, a nikt jej nie pomógł; nieprzyjaciele, widząc ją, naśmiewali się z jej szabatów."
  tags: []
"Lm1,8":
  text: "Jerozolima ciężko zgrzeszyła, dlatego została odłączona jako nieczysta. Wszyscy, którzy ją szanowali, gardzą nią, gdyż widzą jej nagość, a ona wzdycha i odwraca się plecami."
  tags: []
"Lm1,9":
  text: "Jej nieczystość jest na brzegach jej szat, nie pamięta swego końca; dlatego wielce ją poniżono i nikt jej nie pociesza. Spójrz, PANIE, na moje utrapienie, bo wróg się wywyższył."
  tags: []
"Lm1,10":
  text: "Wróg wyciągnął swoją rękę po wszystkie jej kosztowności. Patrzy, jak poganie, którym zakazałeś wchodzić do twego zgromadzenia, wchodzą do jej świątyni."
  tags: []
"Lm1,11":
  text: "Cały jej lud wzdycha i szuka chleba, daje swoje kosztowności za pokarm, aby posilić duszę. Spójrz, PANIE, i zobacz, że zostałam znieważona."
  tags: []
"Lm1,12":
  text: "Czy nic was to nie obchodzi, wszyscy, którzy przechodzicie obok? Spójrzcie i zobaczcie, czy jest boleść podobna do mojej boleści, jaką mi zadano, którą dotknął mnie PAN w dniu swojego zapalczywego gniewu."
  tags: []
"Lm1,13":
  text: "Z wysoka zesłał ogień na moje kości, który je pokonał. Rozciągnął sieć na moje nogi i zawrócił mnie, wydał mnie na spustoszenie i przez cały dzień omdlewam."
  tags: []
"Lm1,14":
  text: "Jarzmo moich nieprawości jest związane jego ręką, splotły się i weszły na moją szyję, a to poraziło moją siłę. Pan wydał mnie w ręce wrogów i nie mogę powstać."
  tags: []
"Lm1,15":
  text: "Pan podeptał wszystkich moich mocarzy, którzy są pośród mnie, zwołał przeciwko mnie gromadę, aby zmiażdżyć moich młodzieńców. Pan, jak w tłoczni, podeptał dziewicę, córkę Judy."
  tags: []
"Lm1,16":
  text: "Dlatego ja płaczę; z oczu, z moich oczu, ciekną wody, gdyż daleko jest ode mnie pocieszyciel, który by pokrzepił moją duszę; moi synowie są wytraceni, bo wróg zwyciężył."
  tags: []
"Lm1,17":
  text: "Syjon wyciąga swoje ręce, nie ma nikogo, kto by go pocieszył. PAN pobudził dokoła Jakuba jego wrogów; Jerozolima jest wśród nich jak kobieta oddalona z powodu jej nieczystości."
  tags: []
"Lm1,18":
  text: "PAN jest sprawiedliwy, bo zbuntowałam się przeciwko jego słowu. Słuchajcie, proszę, wszyscy ludzie, i zobaczcie moje boleści. Moje dziewice i moi młodzieńcy poszli do niewoli."
  tags: []
"Lm1,19":
  text: "Wołałam do moich kochanków, lecz oni mnie zdradzili. Moi kapłani i starcy zginęli w mieście, kiedy szukali pokarmu dla siebie, aby posilić swoją duszę."
  tags: []
"Lm1,20":
  text: "Spójrz, PANIE, bo jestem utrapiona, moje wnętrzności drżą, moje serce przewraca się we mnie, gdyż uparcie się buntowałam. Na dworze miecz osieroca, a w domu nie ma nic oprócz śmierci."
  tags: []
"Lm1,21":
  text: "Słyszą, że wzdycham, ale nie ma nikogo, kto by mnie pocieszył; wszyscy moi wrogowie słyszeli o moim nieszczęściu i cieszą się, że to uczyniłeś. Sprowadzasz dzień, który zapowiedziałeś, a staną się podobni do mnie."
  tags: []
"Lm1,22":
  text: "Niech cała ich niegodziwość przyjdzie przed ciebie; uczyń im tak, jak mnie uczyniłeś z powodu wszystkich moich przestępstw. Wiele bowiem jest moich westchnień, a moje serce omdlewa."
  tags: []
