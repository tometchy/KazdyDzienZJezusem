"Lm3,1": "Ja jestem tym człowiekiem, który widział utrapienie pod rózgą jego gniewu."
"Lm3,2": "Prowadził mnie i zawiódł do ciemności, a nie do światła."
"Lm3,3": "Oburzył się na mnie, zwraca swoją rękę przeciwko mnie przez cały dzień."
"Lm3,4": "Sprawił, że zestarzały się moje ciało i moja skóra, połamał moje kości."
"Lm3,5": "Obudował mnie i otoczył żółcią i trudem;"
"Lm3,6": "Posadził mnie w ciemnych miejscach jak dawno umarłych."
"Lm3,7": "Ogrodził mnie, abym nie mógł wyjść, obciążył moje kajdany."
"Lm3,8": "A choć wołam i krzyczę, zatyka uszy na moją modlitwę."
"Lm3,9": "Zagrodził moją drogę kamieniem ciosanym, poplątał moje ścieżki."
"Lm3,10": "Stał się dla mnie jak niedźwiedź czyhający na mnie, jak lew w ukryciu."
"Lm3,11": "Zmylił moje drogi, rozszarpał mnie i uczynił mnie spustoszonym."
"Lm3,12": "Napiął swój łuk i uczynił ze mnie cel dla swej strzały."
"Lm3,13": "Przebił moje nerki strzałami swego kołczana."
"Lm3,14": "Stałem się pośmiewiskiem dla całego mojego ludu, tematem jego pieśni przez cały dzień."
"Lm3,15": "Napełnił mnie goryczą, upoił mnie piołunem."
"Lm3,16": "Ponadto wykruszył żwirem moje zęby i pogrążył mnie w popiele."
"Lm3,17": "Oddaliłeś moją duszę od pokoju. Zapomniałem, co to pomyślność."
"Lm3,18": "I powiedziałem: Zginęła moja siła i moja nadzieja, jaką pokładałem w PANU."
"Lm3,19": "Wspominam swoje utrapienie i swój płacz, piołun i żółć."
"Lm3,20": "Moja dusza nieustannie to wspomina i uniża się we mnie."
"Lm3,21": "Biorę to sobie do serca, dlatego mam nadzieję."
"Lm3,22": "To wielkie miłosierdzie PANA, że nie zginęliśmy, gdyż nie ustaje jego litość."
"Lm3,23": "Każdego poranka się odnawia, wielka jest twoja wierność."
"Lm3,24": "PAN jest moim działem – mówi moja dusza – dlatego mam w nim nadzieję."
"Lm3,25": "Dobry jest PAN dla tych, którzy go oczekują, dla duszy, która go szuka."
"Lm3,26": "Dobrze jest cierpliwie oczekiwać na zbawienie PANA."
"Lm3,27": "Dobrze jest człowiekowi nosić jarzmo od swej młodości."
"Lm3,28": "Siedzi samotnie w milczeniu, gdyż na niego je włożono."
"Lm3,29": "Kładzie swe usta w prochu, może jest jeszcze nadzieja."
"Lm3,30": "Nadstawia bijącemu policzek, jest nasycony zniewagą."
"Lm3,31": "Pan bowiem nie odrzuca na wieki;"
"Lm3,32": "A jeśli zasmuca, znów się lituje według obfitości swego miłosierdzia;"
"Lm3,33": "Gdyż nie trapi chętnie ani nie zasmuca synów ludzkich."
"Lm3,34": "Miażdżenie pod nogami wszystkich więźniów ziemi;"
"Lm3,35": "Naginanie prawa człowieka przed obliczem Najwyższego;"
"Lm3,36": "Krzywdzenie człowieka w jego sprawie – Pan nie ma w tym upodobania."
"Lm3,37": "Któż może powiedzieć, że coś się stanie, gdy Pan tego nie rozkazał?"
"Lm3,38": "Czyż z ust Najwyższego nie pochodzi zło i dobro?"
"Lm3,39": "Czemu więc żali się człowiek żyjący, człowiek – z powodu kary za swoje grzechy?"
"Lm3,40": "Doświadczajmy i badajmy nasze drogi, nawróćmy się do PANA."
"Lm3,41": "Wznieśmy swoje serca i ręce do Boga w niebiosach."
"Lm3,42": "Zgrzeszyliśmy i zbuntowaliśmy się, a ty nie przebaczyłeś."
"Lm3,43": "Okryłeś się gniewem i prześladowałeś nas, zabiłeś bez litości."
"Lm3,44": "Okryłeś się obłokiem, aby nie dotarła do ciebie modlitwa."
"Lm3,45": "Uczyniłeś nas śmieciem i pogardą pośród tych narodów."
"Lm3,46": "Otworzyli na nas swoje usta wszyscy nasi wrogowie."
"Lm3,47": "Spadły na nas strach i pułapka, spustoszenie i zniszczenie."
"Lm3,48": "Strumienie wód płyną z moich oczu z powodu zniszczenia córki mojego ludu."
"Lm3,49": "Z moich oczu bez przerwy spływają łzy, bo nie ma żadnej ulgi;"
"Lm3,50": "Póki nie spojrzy i nie zobaczy PAN z nieba."
"Lm3,51": "Moje oczy trapią moją duszę z powodu wszystkich córek mojego miasta."
"Lm3,52": "Moi wrogowie polowali na mnie nieustannie jak na ptaka, bez powodu."
"Lm3,53": "Wyniszczyli moje życie w lochu i przywalili mnie kamieniem."
"Lm3,54": "Wezbrały wody nad moją głową i powiedziałem: Już po mnie!"
"Lm3,55": "Wzywałem twego imienia, PANIE, z głębokiego lochu."
"Lm3,56": "Usłyszałeś mój głos, nie zakrywaj swego ucha przed moim wzdychaniem i przed moim wołaniem."
"Lm3,57": "Zbliżyłeś się do mnie w dniu, kiedy cię wzywałem, i powiedziałeś: Nie bój się."
"Lm3,58": "Broniłeś, Panie, sprawy mojej duszy, wybawiłeś moje życie."
"Lm3,59": "PANIE, widzisz moją krzywdę, osądź moją sprawę."
"Lm3,60": "Widzisz całą ich zemstę i wszystkie ich zamysły przeciwko mnie."
"Lm3,61": "Słyszysz ich urąganie, PANIE, i wszystkie ich zamysły przeciwko mnie;"
"Lm3,62": "Słyszysz słowa z warg tych, którzy powstają przeciwko mnie, i ich zamiary, jakie obmyślają przeciwko mnie przez cały dzień."
"Lm3,63": "Zobacz – gdy siedzą i gdy wstają, jestem treścią ich pieśni."
"Lm3,64": "Oddaj im zapłatę, PANIE, według dzieła ich rąk."
"Lm3,65": "Daj im zatwardziałe serce i ześlij na nich twoje przekleństwo;"
"Lm3,66": "Ścigaj ich w gniewie i zgładź ich spod niebios, PANIE!"
