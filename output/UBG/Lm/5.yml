"Lm5,1":
  text: "Wspomnij, PANIE, na to, co nas spotkało. Spójrz i zobacz nasze pohańbienie."
  tags: []
"Lm5,2":
  text: "Nasze dziedzictwo przypadło obcym, a nasze domy – cudzoziemcom."
  tags: []
"Lm5,3":
  text: "Staliśmy się sierotami, bez ojca; nasze matki są jak wdowy."
  tags: []
"Lm5,4":
  text: "Własną wodę pijemy za pieniądze, nasze drwa za pieniądze kupujemy."
  tags: []
"Lm5,5":
  text: "Prześladowanie ciąży na naszym karku. Pracujemy, a nie dają nam odpocząć."
  tags: []
"Lm5,6":
  text: "Podawaliśmy rękę Egipcjanom i Asyryjczykom, aby nasycić się chlebem."
  tags: []
"Lm5,7":
  text: "Nasi ojcowie zgrzeszyli, nie ma ich, a my nosimy ich nieprawość."
  tags: []
"Lm5,8":
  text: "Niewolnicy panują nad nami, nie ma nikogo, kto by nas wybawił z ich ręki."
  tags: []
"Lm5,9":
  text: "Z narażeniem życia szukamy swego chleba z powodu miecza na pustyni."
  tags: []
"Lm5,10":
  text: "Nasza skóra jak piec zaciemniła się od strasznego głodu."
  tags: []
"Lm5,11":
  text: "Kobiety na Syjonie hańbiono, a panny – w miastach Judy."
  tags: []
"Lm5,12":
  text: "Książęta byli wieszani ich rękami, oblicza starszych nie uszanowano."
  tags: []
"Lm5,13":
  text: "Młodzieńców wzięli do młócenia, dzieci padały pod ciężarem drewna."
  tags: []
"Lm5,14":
  text: "Starcy w bramach już nie siadają, młodzieńcy przestali śpiewać swoje pieśni."
  tags: []
"Lm5,15":
  text: "Radość zniknęła z naszych serc, nasze pląsanie zamieniło się w żałobę."
  tags: []
"Lm5,16":
  text: "Spadła korona z naszej głowy. Biada nam, bo zgrzeszyliśmy!"
  tags: []
"Lm5,17":
  text: "Dlatego nasze serce omdlewa, dlatego nasze oczy są zaćmione."
  tags: []
"Lm5,18":
  text: "Z powodu spustoszonej góry Syjonu lisy chodzą po niej."
  tags: []
"Lm5,19":
  text: "Ty, PANIE, trwasz na wieki, twój tron z pokolenia na pokolenie."
  tags: []
"Lm5,20":
  text: "Czemu zapominasz o nas na wieki i opuszczasz nas na tak długi czas?"
  tags: []
"Lm5,21":
  text: "Nawróć nas do siebie, PANIE, a będziemy nawróceni; odnów nasze dni, jak dawniej."
  tags: []
"Lm5,22":
  text: "Czy odrzuciłeś nas całkowicie? Czy bardzo się na nas gniewałeś?"
  tags: []
