"Lm5,1": "Wspomnij, PANIE, na to, co nas spotkało. Spójrz i zobacz nasze pohańbienie."
"Lm5,2": "Nasze dziedzictwo przypadło obcym, a nasze domy – cudzoziemcom."
"Lm5,3": "Staliśmy się sierotami, bez ojca; nasze matki są jak wdowy."
"Lm5,4": "Własną wodę pijemy za pieniądze, nasze drwa za pieniądze kupujemy."
"Lm5,5": "Prześladowanie ciąży na naszym karku. Pracujemy, a nie dają nam odpocząć."
"Lm5,6": "Podawaliśmy rękę Egipcjanom i Asyryjczykom, aby nasycić się chlebem."
"Lm5,7": "Nasi ojcowie zgrzeszyli, nie ma ich, a my nosimy ich nieprawość."
"Lm5,8": "Niewolnicy panują nad nami, nie ma nikogo, kto by nas wybawił z ich ręki."
"Lm5,9": "Z narażeniem życia szukamy swego chleba z powodu miecza na pustyni."
"Lm5,10": "Nasza skóra jak piec zaciemniła się od strasznego głodu."
"Lm5,11": "Kobiety na Syjonie hańbiono, a panny – w miastach Judy."
"Lm5,12": "Książęta byli wieszani ich rękami, oblicza starszych nie uszanowano."
"Lm5,13": "Młodzieńców wzięli do młócenia, dzieci padały pod ciężarem drewna."
"Lm5,14": "Starcy w bramach już nie siadają, młodzieńcy przestali śpiewać swoje pieśni."
"Lm5,15": "Radość zniknęła z naszych serc, nasze pląsanie zamieniło się w żałobę."
"Lm5,16": "Spadła korona z naszej głowy. Biada nam, bo zgrzeszyliśmy!"
"Lm5,17": "Dlatego nasze serce omdlewa, dlatego nasze oczy są zaćmione."
"Lm5,18": "Z powodu spustoszonej góry Syjonu lisy chodzą po niej."
"Lm5,19": "Ty, PANIE, trwasz na wieki, twój tron z pokolenia na pokolenie."
"Lm5,20": "Czemu zapominasz o nas na wieki i opuszczasz nas na tak długi czas?"
"Lm5,21": "Nawróć nas do siebie, PANIE, a będziemy nawróceni; odnów nasze dni, jak dawniej."
"Lm5,22": "Czy odrzuciłeś nas całkowicie? Czy bardzo się na nas gniewałeś?"
