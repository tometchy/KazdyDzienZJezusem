"Ef4,1": "Proszę więc was ja, więzień w Panu, abyście postępowali w sposób godny powołania, do jakiego zostaliście wezwani;"
"Ef4,2": "Z całą pokorą, łagodnością i z cierpliwością, znosząc jedni drugich w miłości;"
"Ef4,3": "Starając się zachować jedność Ducha w więzi pokoju."
"Ef4,4": "Jedno jest ciało i jeden Duch, jak też zostaliście powołani w jednej nadziei waszego powołania."
"Ef4,5": "Jeden Pan, jedna wiara, jeden chrzest;"
"Ef4,6": "Jeden Bóg i Ojciec wszystkich, który jest ponad wszystkimi, przez wszystkich i w was wszystkich."
"Ef4,7": "A każdemu z nas została dana łaska według miary daru Chrystusa."
"Ef4,8": "Dlatego Pismo mówi: Wstąpiwszy na wysokość, poprowadził pojmanych jeńców i dał ludziom dary."
"Ef4,9": "Lecz to, że wstąpił, cóż oznacza, jeśli nie to, że najpierw zstąpił do niższych regionów ziemi?"
"Ef4,10": "Ten, który zstąpił, jest i tym, który wstąpił wysoko ponad wszystkie niebiosa, aby napełnić wszystko."
"Ef4,11": "I on ustanowił jednych apostołami, drugich prorokami, innych ewangelistami, a jeszcze innych pasterzami i nauczycielami;"
"Ef4,12": "Dla przysposobienia świętych, dla dzieła posługiwania, dla budowania ciała Chrystusa;"
"Ef4,13": "Aż dojdziemy wszyscy do jedności wiary i poznania Syna Bożego, do człowieka doskonałego, do miary dojrzałości pełni Chrystusa;"
"Ef4,14": "Abyśmy już nie byli dziećmi miotanymi i unoszonymi każdym powiewem nauki przez oszustwo ludzkie i przez podstęp prowadzący na manowce błędu."
"Ef4,15": "Lecz będąc szczerymi w miłości, wzrastajmy we wszystkim w tego, który jest głową – w Chrystusa."
"Ef4,16": "Z niego całe ciało harmonijnie złożone i zespolone we wszystkich stawach, dzięki działaniu każdego członka, stosownie do jego miary, przyczynia sobie wzrostu dla budowania samego siebie w miłości."
"Ef4,17": "To więc mówię i zaświadczam w Panu, abyście już więcej nie postępowali tak, jak postępują inni poganie w próżności ich umysłu;"
"Ef4,18": "Mając przyćmiony rozum, obcy dla życia Bożego z powodu niewiedzy, która w nich jest, z powodu zatwardziałości ich serca."
"Ef4,19": "Oni, stawszy się nieczuli, oddali się rozpuście, dopuszczając się wszelkiej nieczystości z zachłannością."
"Ef4,20": "Lecz wy nie tak nauczyliście się Chrystusa;"
"Ef4,21": "Jeśli tylko słyszeliście go i byliście pouczeni przez niego, zgodnie z prawdą, jaka jest w Jezusie;"
"Ef4,22": "Że – co się tyczy poprzedniego postępowania – powinniście zrzucić z siebie starego człowieka, który ulega zepsuciu przez zwodnicze żądze;"
"Ef4,23": "I odnowić się w duchu waszego umysłu;"
"Ef4,24": "I przyoblec się w nowego człowieka, który jest stworzony według Boga w sprawiedliwości i w prawdziwej świętości."
"Ef4,25": "Dlatego odrzuciwszy kłamstwo, niech każdy mówi prawdę swojemu bliźniemu, bo jesteśmy członkami jedni drugich."
"Ef4,26": "Gniewajcie się, lecz nie grzeszcie; niech nad waszym gniewem nie zachodzi słońce."
"Ef4,27": "Nie dawajcie miejsca diabłu."
"Ef4,28": "Kto kradł, niech więcej nie kradnie, ale raczej niech pracuje, czyniąc własnymi rękami to, co jest dobre, aby miał z czego udzielać potrzebującemu."
"Ef4,29": "Żadne plugawe słowo niech nie wychodzi z waszych ust, lecz tylko dobre, dla zbudowania, aby przynosiło łaskę słuchającym."
"Ef4,30": "I nie zasmucajcie Bożego Ducha Świętego, którym jesteście zapieczętowani na dzień odkupienia."
"Ef4,31": "Wszelka gorycz i zapalczywość, gniew, wrzask i złorzeczenie niech zostaną usunięte spośród was wraz ze wszelką złośliwością."
"Ef4,32": "Bądźcie dla siebie nawzajem życzliwi, miłosierni, przebaczając sobie, jak i wam Bóg przebaczył w Chrystusie."
