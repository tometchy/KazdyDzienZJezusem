"Ef4,1":
  text: "Proszę więc was ja, więzień w Panu, abyście postępowali w sposób godny powołania, do jakiego zostaliście wezwani;"
  tags: []
"Ef4,2":
  text: "Z całą pokorą, łagodnością i z cierpliwością, znosząc jedni drugich w miłości;"
  tags: []
"Ef4,3":
  text: "Starając się zachować jedność Ducha w więzi pokoju."
  tags: []
"Ef4,4":
  text: "Jedno jest ciało i jeden Duch, jak też zostaliście powołani w jednej nadziei waszego powołania."
  tags: []
"Ef4,5":
  text: "Jeden Pan, jedna wiara, jeden chrzest;"
  tags: []
"Ef4,6":
  text: "Jeden Bóg i Ojciec wszystkich, który jest ponad wszystkimi, przez wszystkich i w was wszystkich."
  tags: []
"Ef4,7":
  text: "A każdemu z nas została dana łaska według miary daru Chrystusa."
  tags: []
"Ef4,8":
  text: "Dlatego Pismo mówi: Wstąpiwszy na wysokość, poprowadził pojmanych jeńców i dał ludziom dary."
  tags: []
"Ef4,9":
  text: "Lecz to, że wstąpił, cóż oznacza, jeśli nie to, że najpierw zstąpił do niższych regionów ziemi?"
  tags: []
"Ef4,10":
  text: "Ten, który zstąpił, jest i tym, który wstąpił wysoko ponad wszystkie niebiosa, aby napełnić wszystko."
  tags: []
"Ef4,11":
  text: "I on ustanowił jednych apostołami, drugich prorokami, innych ewangelistami, a jeszcze innych pasterzami i nauczycielami;"
  tags: []
"Ef4,12":
  text: "Dla przysposobienia świętych, dla dzieła posługiwania, dla budowania ciała Chrystusa;"
  tags: []
"Ef4,13":
  text: "Aż dojdziemy wszyscy do jedności wiary i poznania Syna Bożego, do człowieka doskonałego, do miary dojrzałości pełni Chrystusa;"
  tags: []
"Ef4,14":
  text: "Abyśmy już nie byli dziećmi miotanymi i unoszonymi każdym powiewem nauki przez oszustwo ludzkie i przez podstęp prowadzący na manowce błędu."
  tags: []
"Ef4,15":
  text: "Lecz będąc szczerymi w miłości, wzrastajmy we wszystkim w tego, który jest głową – w Chrystusa."
  tags: []
"Ef4,16":
  text: "Z niego całe ciało harmonijnie złożone i zespolone we wszystkich stawach, dzięki działaniu każdego członka, stosownie do jego miary, przyczynia sobie wzrostu dla budowania samego siebie w miłości."
  tags: []
"Ef4,17":
  text: "To więc mówię i zaświadczam w Panu, abyście już więcej nie postępowali tak, jak postępują inni poganie w próżności ich umysłu;"
  tags: []
"Ef4,18":
  text: "Mając przyćmiony rozum, obcy dla życia Bożego z powodu niewiedzy, która w nich jest, z powodu zatwardziałości ich serca."
  tags: []
"Ef4,19":
  text: "Oni, stawszy się nieczuli, oddali się rozpuście, dopuszczając się wszelkiej nieczystości z zachłannością."
  tags: []
"Ef4,20":
  text: "Lecz wy nie tak nauczyliście się Chrystusa;"
  tags: []
"Ef4,21":
  text: "Jeśli tylko słyszeliście go i byliście pouczeni przez niego, zgodnie z prawdą, jaka jest w Jezusie;"
  tags: []
"Ef4,22":
  text: "Że – co się tyczy poprzedniego postępowania – powinniście zrzucić z siebie starego człowieka, który ulega zepsuciu przez zwodnicze żądze;"
  tags: []
"Ef4,23":
  text: "I odnowić się w duchu waszego umysłu;"
  tags: []
"Ef4,24":
  text: "I przyoblec się w nowego człowieka, który jest stworzony według Boga w sprawiedliwości i w prawdziwej świętości."
  tags: []
"Ef4,25":
  text: "Dlatego odrzuciwszy kłamstwo, niech każdy mówi prawdę swojemu bliźniemu, bo jesteśmy członkami jedni drugich."
  tags: []
"Ef4,26":
  text: "Gniewajcie się, lecz nie grzeszcie; niech nad waszym gniewem nie zachodzi słońce."
  tags: []
"Ef4,27":
  text: "Nie dawajcie miejsca diabłu."
  tags: []
"Ef4,28":
  text: "Kto kradł, niech więcej nie kradnie, ale raczej niech pracuje, czyniąc własnymi rękami to, co jest dobre, aby miał z czego udzielać potrzebującemu."
  tags: []
"Ef4,29":
  text: "Żadne plugawe słowo niech nie wychodzi z waszych ust, lecz tylko dobre, dla zbudowania, aby przynosiło łaskę słuchającym."
  tags: []
"Ef4,30":
  text: "I nie zasmucajcie Bożego Ducha Świętego, którym jesteście zapieczętowani na dzień odkupienia."
  tags: []
"Ef4,31":
  text: "Wszelka gorycz i zapalczywość, gniew, wrzask i złorzeczenie niech zostaną usunięte spośród was wraz ze wszelką złośliwością."
  tags: []
"Ef4,32":
  text: "Bądźcie dla siebie nawzajem życzliwi, miłosierni, przebaczając sobie, jak i wam Bóg przebaczył w Chrystusie."
  tags: []
