"Ef2,1":
  text: "I was ożywił, którzy byliście umarli w upadkach i w grzechach;"
  tags: []
"Ef2,2":
  text: "W których niegdyś postępowaliście według zwyczaju tego świata i według władcy, który rządzi w powietrzu, ducha, który teraz działa w synach nieposłuszeństwa."
  tags: []
"Ef2,3":
  text: "Wśród nich i my wszyscy żyliśmy niegdyś w pożądliwościach naszego ciała, czyniąc to, co się podobało ciału i myślom, i byliśmy z natury dziećmi gniewu, jak i inni."
  tags: []
"Ef2,4":
  text: "Lecz Bóg, który jest bogaty w miłosierdzie, z powodu swojej wielkiej miłości, którą nas umiłował;"
  tags: []
"Ef2,5":
  text: "I to wtedy, gdy byliśmy umarli w grzechach, ożywił nas razem z Chrystusem, gdyż łaską jesteście zbawieni;"
  tags: []
"Ef2,6":
  text: "I razem z nim wskrzesił, i razem z nim posadził w miejscach niebiańskich w Chrystusie Jezusie;"
  tags: []
"Ef2,7":
  text: "Aby okazać w przyszłych wiekach przemożne bogactwo swojej łaski przez swoją dobroć względem nas w Chrystusie Jezusie."
  tags: []
"Ef2,8":
  text: "Łaską bowiem jesteście zbawieni przez wiarę, i to nie jest z was, jest to dar Boga."
  tags: []
"Ef2,9":
  text: "Nie z uczynków, aby nikt się nie chlubił."
  tags: []
"Ef2,10":
  text: "Jesteśmy bowiem jego dziełem, stworzeni w Chrystusie Jezusie do dobrych uczynków, które Bóg wcześniej przygotował, abyśmy w nich postępowali."
  tags: []
"Ef2,11":
  text: "Dlatego pamiętajcie, że wy, niegdyś poganie w ciele, zwani nieobrzezaniem przez tych, których zwano obrzezaniem dokonanym ręką na ciele;"
  tags: []
"Ef2,12":
  text: "Byliście w tamtym czasie bez Chrystusa, obcy względem społeczności Izraela i obcy przymierzom obietnicy, niemający nadziei i bez Boga na świecie."
  tags: []
"Ef2,13":
  text: "Lecz teraz w Chrystusie Jezusie wy, którzy niegdyś byliście daleko, staliście się bliscy przez krew Chrystusa."
  tags: []
"Ef2,14":
  text: "On bowiem jest naszym pokojem, on, który z obydwu uczynił jedno i zburzył stojący pośrodku mur, który był przegrodą;"
  tags: []
"Ef2,15":
  text: "Znosząc przez swoje ciało nieprzyjaźń, prawo przykazań wyrażone w przepisach, aby z dwóch stworzyć w samym sobie jednego nowego człowieka, czyniąc pokój;"
  tags: []
"Ef2,16":
  text: "I aby pojednać z Bogiem obydwu w jednym ciele przez krzyż, zgładziwszy przez niego nieprzyjaźń."
  tags: []
"Ef2,17":
  text: "A gdy przyszedł, zwiastował pokój wam, którzy byliście daleko, i tym, którzy byli bliscy."
  tags: []
"Ef2,18":
  text: "Przez niego bowiem my, obie strony, mamy przystęp w jednym Duchu do Ojca."
  tags: []
"Ef2,19":
  text: "A więc nie jesteście już więcej obcymi i przybyszami, ale współobywatelami ze świętymi i domownikami Boga;"
  tags: []
"Ef2,20":
  text: "Zbudowani na fundamencie apostołów i proroków, gdzie kamieniem węgielnym jest sam Jezus Chrystus;"
  tags: []
"Ef2,21":
  text: "Na którym cała budowla razem zespolona rośnie w świętą świątynię w Panu;"
  tags: []
"Ef2,22":
  text: "Na którym i wy razem się budujecie, aby być mieszkaniem Boga przez Ducha."
  tags: []
