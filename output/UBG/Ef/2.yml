"Ef2,1": "I was ożywił, którzy byliście umarli w upadkach i w grzechach;"
"Ef2,2": "W których niegdyś postępowaliście według zwyczaju tego świata i według władcy, który rządzi w powietrzu, ducha, który teraz działa w synach nieposłuszeństwa."
"Ef2,3": "Wśród nich i my wszyscy żyliśmy niegdyś w pożądliwościach naszego ciała, czyniąc to, co się podobało ciału i myślom, i byliśmy z natury dziećmi gniewu, jak i inni."
"Ef2,4": "Lecz Bóg, który jest bogaty w miłosierdzie, z powodu swojej wielkiej miłości, którą nas umiłował;"
"Ef2,5": "I to wtedy, gdy byliśmy umarli w grzechach, ożywił nas razem z Chrystusem, gdyż łaską jesteście zbawieni;"
"Ef2,6": "I razem z nim wskrzesił, i razem z nim posadził w miejscach niebiańskich w Chrystusie Jezusie;"
"Ef2,7": "Aby okazać w przyszłych wiekach przemożne bogactwo swojej łaski przez swoją dobroć względem nas w Chrystusie Jezusie."
"Ef2,8": "Łaską bowiem jesteście zbawieni przez wiarę, i to nie jest z was, jest to dar Boga."
"Ef2,9": "Nie z uczynków, aby nikt się nie chlubił."
"Ef2,10": "Jesteśmy bowiem jego dziełem, stworzeni w Chrystusie Jezusie do dobrych uczynków, które Bóg wcześniej przygotował, abyśmy w nich postępowali."
"Ef2,11": "Dlatego pamiętajcie, że wy, niegdyś poganie w ciele, zwani nieobrzezaniem przez tych, których zwano obrzezaniem dokonanym ręką na ciele;"
"Ef2,12": "Byliście w tamtym czasie bez Chrystusa, obcy względem społeczności Izraela i obcy przymierzom obietnicy, niemający nadziei i bez Boga na świecie."
"Ef2,13": "Lecz teraz w Chrystusie Jezusie wy, którzy niegdyś byliście daleko, staliście się bliscy przez krew Chrystusa."
"Ef2,14": "On bowiem jest naszym pokojem, on, który z obydwu uczynił jedno i zburzył stojący pośrodku mur, który był przegrodą;"
"Ef2,15": "Znosząc przez swoje ciało nieprzyjaźń, prawo przykazań wyrażone w przepisach, aby z dwóch stworzyć w samym sobie jednego nowego człowieka, czyniąc pokój;"
"Ef2,16": "I aby pojednać z Bogiem obydwu w jednym ciele przez krzyż, zgładziwszy przez niego nieprzyjaźń."
"Ef2,17": "A gdy przyszedł, zwiastował pokój wam, którzy byliście daleko, i tym, którzy byli bliscy."
"Ef2,18": "Przez niego bowiem my, obie strony, mamy przystęp w jednym Duchu do Ojca."
"Ef2,19": "A więc nie jesteście już więcej obcymi i przybyszami, ale współobywatelami ze świętymi i domownikami Boga;"
"Ef2,20": "Zbudowani na fundamencie apostołów i proroków, gdzie kamieniem węgielnym jest sam Jezus Chrystus;"
"Ef2,21": "Na którym cała budowla razem zespolona rośnie w świętą świątynię w Panu;"
"Ef2,22": "Na którym i wy razem się budujecie, aby być mieszkaniem Boga przez Ducha."
