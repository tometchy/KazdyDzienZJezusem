"Ef6,1": "Dzieci, bądźcie posłuszne waszym rodzicom w Panu, bo jest to sprawiedliwe."
"Ef6,2": "Czcij swego ojca i matkę – jest to pierwsze przykazanie z obietnicą;"
"Ef6,3": "Aby ci się dobrze powodziło i abyś długo żył na ziemi."
"Ef6,4": "A wy, ojcowie, nie pobudzajcie do gniewu waszych dzieci, lecz wychowujcie je w karności i w napominaniu Pana."
"Ef6,5": "Słudzy, z bojaźnią i z drżeniem bądźcie posłuszni panom według ciała, w prostocie serca, jak Chrystusowi;"
"Ef6,6": "Nie służąc dla oka, jak ci, którzy chcą podobać się ludziom, lecz jak słudzy Chrystusa, czyniąc wolę Boga z serca;"
"Ef6,7": "Służąc z życzliwością, tak jak Panu, a nie ludziom;"
"Ef6,8": "Wiedząc, że każdy, kto uczyni coś dobrego, to też otrzyma od Pana, czy niewolnik, czy wolny."
"Ef6,9": "A wy, panowie, tak samo wobec nich postępujcie, porzucając groźby, wiedząc, że i wy sami macie Pana w niebie, a u niego nie ma względu na osoby."
"Ef6,10": "W końcu, moi bracia, umacniajcie się w Panu i w potędze jego mocy."
"Ef6,11": "Przywdziejcie pełną zbroję Bożą, abyście mogli się ostać wobec zasadzek diabła."
"Ef6,12": "Nie toczymy bowiem walki przeciw krwi i ciału, ale przeciw zwierzchnościom, przeciw władzom, przeciw rządcom ciemności tego świata, przeciw duchowemu złu na wyżynach niebieskich."
"Ef6,13": "Dlatego weźcie pełną zbroję Bożą, abyście mogli przeciwstawić się w dzień zły, a wykonawszy wszystko, ostać się."
"Ef6,14": "Stańcie więc, przepasawszy wasze biodra prawdą, przywdziawszy pancerz sprawiedliwości;"
"Ef6,15": "I obuwszy nogi w gotowość ewangelii pokoju."
"Ef6,16": "A przede wszystkim weźcie tarczę wiary, którą będziecie mogli zgasić wszystkie ogniste strzały złego."
"Ef6,17": "Weźcie też hełm zbawienia i miecz Ducha, którym jest słowo Boże;"
"Ef6,18": "We wszelkiej modlitwie i prośbie modląc się w każdym czasie w Duchu, czuwając nad tym z całą wytrwałością i z prośbą za wszystkich świętych;"
"Ef6,19": "I za mnie, aby była mi dana mowa, bym z odwagą otworzył moje usta do oznajmienia tajemnicy ewangelii;"
"Ef6,20": "Dla której sprawuję poselstwo w łańcuchach, abym o niej odważnie mówił, tak jak powinienem mówić."
"Ef6,21": "Żebyście zaś wiedzieli i wy, co się ze mną dzieje i co robię, wszystko oznajmi wam Tychik, miły brat i wierny sługa w Panu;"
"Ef6,22": "Którego posłałem do was właśnie po to, abyście poznali nasze sprawy i aby pocieszył wasze serca."
"Ef6,23": "Pokój braciom i miłość wraz z wiarą od Boga Ojca i Pana Jezusa Chrystusa."
"Ef6,24": "Łaska niech będzie ze wszystkimi, którzy miłują naszego Pana Jezusa Chrystusa w szczerości. Amen."
