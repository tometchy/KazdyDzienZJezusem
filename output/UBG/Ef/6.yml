"Ef6,1":
  text: "Dzieci, bądźcie posłuszne waszym rodzicom w Panu, bo jest to sprawiedliwe."
  tags: []
"Ef6,2":
  text: "Czcij swego ojca i matkę – jest to pierwsze przykazanie z obietnicą;"
  tags: []
"Ef6,3":
  text: "Aby ci się dobrze powodziło i abyś długo żył na ziemi."
  tags: []
"Ef6,4":
  text: "A wy, ojcowie, nie pobudzajcie do gniewu waszych dzieci, lecz wychowujcie je w karności i w napominaniu Pana."
  tags: []
"Ef6,5":
  text: "Słudzy, z bojaźnią i z drżeniem bądźcie posłuszni panom według ciała, w prostocie serca, jak Chrystusowi;"
  tags: []
"Ef6,6":
  text: "Nie służąc dla oka, jak ci, którzy chcą podobać się ludziom, lecz jak słudzy Chrystusa, czyniąc wolę Boga z serca;"
  tags: []
"Ef6,7":
  text: "Służąc z życzliwością, tak jak Panu, a nie ludziom;"
  tags: []
"Ef6,8":
  text: "Wiedząc, że każdy, kto uczyni coś dobrego, to też otrzyma od Pana, czy niewolnik, czy wolny."
  tags: []
"Ef6,9":
  text: "A wy, panowie, tak samo wobec nich postępujcie, porzucając groźby, wiedząc, że i wy sami macie Pana w niebie, a u niego nie ma względu na osoby."
  tags: []
"Ef6,10":
  text: "W końcu, moi bracia, umacniajcie się w Panu i w potędze jego mocy."
  tags: []
"Ef6,11":
  text: "Przywdziejcie pełną zbroję Bożą, abyście mogli się ostać wobec zasadzek diabła."
  tags: []
"Ef6,12":
  text: "Nie toczymy bowiem walki przeciw krwi i ciału, ale przeciw zwierzchnościom, przeciw władzom, przeciw rządcom ciemności tego świata, przeciw duchowemu złu na wyżynach niebieskich."
  tags: []
"Ef6,13":
  text: "Dlatego weźcie pełną zbroję Bożą, abyście mogli przeciwstawić się w dzień zły, a wykonawszy wszystko, ostać się."
  tags: []
"Ef6,14":
  text: "Stańcie więc, przepasawszy wasze biodra prawdą, przywdziawszy pancerz sprawiedliwości;"
  tags: []
"Ef6,15":
  text: "I obuwszy nogi w gotowość ewangelii pokoju."
  tags: []
"Ef6,16":
  text: "A przede wszystkim weźcie tarczę wiary, którą będziecie mogli zgasić wszystkie ogniste strzały złego."
  tags: []
"Ef6,17":
  text: "Weźcie też hełm zbawienia i miecz Ducha, którym jest słowo Boże;"
  tags: []
"Ef6,18":
  text: "We wszelkiej modlitwie i prośbie modląc się w każdym czasie w Duchu, czuwając nad tym z całą wytrwałością i z prośbą za wszystkich świętych;"
  tags: []
"Ef6,19":
  text: "I za mnie, aby była mi dana mowa, bym z odwagą otworzył moje usta do oznajmienia tajemnicy ewangelii;"
  tags: []
"Ef6,20":
  text: "Dla której sprawuję poselstwo w łańcuchach, abym o niej odważnie mówił, tak jak powinienem mówić."
  tags: []
"Ef6,21":
  text: "Żebyście zaś wiedzieli i wy, co się ze mną dzieje i co robię, wszystko oznajmi wam Tychik, miły brat i wierny sługa w Panu;"
  tags: []
"Ef6,22":
  text: "Którego posłałem do was właśnie po to, abyście poznali nasze sprawy i aby pocieszył wasze serca."
  tags: []
"Ef6,23":
  text: "Pokój braciom i miłość wraz z wiarą od Boga Ojca i Pana Jezusa Chrystusa."
  tags: []
"Ef6,24":
  text: "Łaska niech będzie ze wszystkimi, którzy miłują naszego Pana Jezusa Chrystusa w szczerości. Amen."
  tags: []
