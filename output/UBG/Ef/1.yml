"Ef1,1":
  text: "Paweł, apostoł Jezusa Chrystusa z woli Boga, do świętych, którzy są w Efezie, i wiernych w Chrystusie Jezusie."
  tags: []
"Ef1,2":
  text: "Łaska wam i pokój od Boga, naszego Ojca, i Pana Jezusa Chrystusa."
  tags: []
"Ef1,3":
  text: "Błogosławiony niech będzie Bóg i Ojciec naszego Pana Jezusa Chrystusa, który pobłogosławił nas wszelkim duchowym błogosławieństwem w miejscach niebiańskich w Chrystusie."
  tags: []
"Ef1,4":
  text: "Jak nas wybrał w nim przed założeniem świata, abyśmy byli święci i nienaganni przed jego obliczem w miłości."
  tags: []
"Ef1,5":
  text: "Przeznaczył nas dla siebie, ku usynowieniu przez Jezusa Chrystusa, według upodobania swojej woli;"
  tags: []
"Ef1,6":
  text: "Dla uwielbienia chwały swojej łaski, którą obdarzył nas w umiłowanym;"
  tags: []
"Ef1,7":
  text: "W którym mamy odkupienie przez jego krew, przebaczenie grzechów, według bogactwa jego łaski;"
  tags: []
"Ef1,8":
  text: "Którą nam hojnie okazał we wszelkiej mądrości i roztropności;"
  tags: []
"Ef1,9":
  text: "Oznajmiając nam tajemnicę swojej woli, według swego upodobania, które sam w sobie postanowił;"
  tags: []
"Ef1,10":
  text: "Aby w zarządzeniu pełni czasów wszystko zebrał w jedno w Chrystusie, i to, co w niebiosach, i to, co na ziemi."
  tags: []
"Ef1,11":
  text: "W nim, mówię, w którym też dostąpiliśmy udziału, przeznaczeni według postanowienia tego, który dokonuje wszystkiego według rady swojej woli;"
  tags: []
"Ef1,12":
  text: "Abyśmy istnieli dla uwielbienia jego chwały, my, którzy wcześniej położyliśmy nadzieję w Chrystusie."
  tags: []
"Ef1,13":
  text: "W nim i wy położyliście nadzieję, kiedy usłyszeliście słowo prawdy, ewangelię waszego zbawienia, w nim też, gdy uwierzyliście, zostaliście zapieczętowani obiecanym Duchem Świętym;"
  tags: []
"Ef1,14":
  text: "Który jest zadatkiem naszego dziedzictwa, aż nastąpi odkupienie nabytej własności, dla uwielbienia jego chwały."
  tags: []
"Ef1,15":
  text: "Dlatego i ja, gdy usłyszałem o waszej wierze w Pana Jezusa i o miłości względem wszystkich świętych;"
  tags: []
"Ef1,16":
  text: "Nie przestaję dziękować za was, czyniąc o was wzmiankę w moich modlitwach;"
  tags: []
"Ef1,17":
  text: "Prosząc, aby Bóg naszego Pana Jezusa Chrystusa, Ojciec chwały, dał wam Ducha mądrości i objawienia w poznaniu jego samego;"
  tags: []
"Ef1,18":
  text: "Ażeby oświecił oczy waszego umysłu, abyście wiedzieli, czym jest nadzieja jego powołania, czym jest bogactwo chwały jego dziedzictwa w świętych;"
  tags: []
"Ef1,19":
  text: "I czym jest przemożna wielkość jego mocy wobec nas, którzy wierzymy, według działania potęgi jego siły."
  tags: []
"Ef1,20":
  text: "Okazał ją w Chrystusie, gdy go wskrzesił z martwych i posadził po swojej prawicy w miejscach niebiańskich;"
  tags: []
"Ef1,21":
  text: "Wysoko ponad wszelką zwierzchnością i władzą, mocą, panowaniem i ponad wszelkim imieniem wypowiadanym nie tylko w tym świecie, ale i w przyszłym."
  tags: []
"Ef1,22":
  text: "I wszystko poddał pod jego stopy, a jego samego dał jako głowę ponad wszystkim kościołowi;"
  tags: []
"Ef1,23":
  text: "Który jest jego ciałem i pełnią tego, który wszystko we wszystkich napełnia."
  tags: []
