"Ef1,1": "Paweł, apostoł Jezusa Chrystusa z woli Boga, do świętych, którzy są w Efezie, i wiernych w Chrystusie Jezusie."
"Ef1,2": "Łaska wam i pokój od Boga, naszego Ojca, i Pana Jezusa Chrystusa."
"Ef1,3": "Błogosławiony niech będzie Bóg i Ojciec naszego Pana Jezusa Chrystusa, który pobłogosławił nas wszelkim duchowym błogosławieństwem w miejscach niebiańskich w Chrystusie."
"Ef1,4": "Jak nas wybrał w nim przed założeniem świata, abyśmy byli święci i nienaganni przed jego obliczem w miłości."
"Ef1,5": "Przeznaczył nas dla siebie, ku usynowieniu przez Jezusa Chrystusa, według upodobania swojej woli;"
"Ef1,6": "Dla uwielbienia chwały swojej łaski, którą obdarzył nas w umiłowanym;"
"Ef1,7": "W którym mamy odkupienie przez jego krew, przebaczenie grzechów, według bogactwa jego łaski;"
"Ef1,8": "Którą nam hojnie okazał we wszelkiej mądrości i roztropności;"
"Ef1,9": "Oznajmiając nam tajemnicę swojej woli, według swego upodobania, które sam w sobie postanowił;"
"Ef1,10": "Aby w zarządzeniu pełni czasów wszystko zebrał w jedno w Chrystusie, i to, co w niebiosach, i to, co na ziemi."
"Ef1,11": "W nim, mówię, w którym też dostąpiliśmy udziału, przeznaczeni według postanowienia tego, który dokonuje wszystkiego według rady swojej woli;"
"Ef1,12": "Abyśmy istnieli dla uwielbienia jego chwały, my, którzy wcześniej położyliśmy nadzieję w Chrystusie."
"Ef1,13": "W nim i wy położyliście nadzieję, kiedy usłyszeliście słowo prawdy, ewangelię waszego zbawienia, w nim też, gdy uwierzyliście, zostaliście zapieczętowani obiecanym Duchem Świętym;"
"Ef1,14": "Który jest zadatkiem naszego dziedzictwa, aż nastąpi odkupienie nabytej własności, dla uwielbienia jego chwały."
"Ef1,15": "Dlatego i ja, gdy usłyszałem o waszej wierze w Pana Jezusa i o miłości względem wszystkich świętych;"
"Ef1,16": "Nie przestaję dziękować za was, czyniąc o was wzmiankę w moich modlitwach;"
"Ef1,17": "Prosząc, aby Bóg naszego Pana Jezusa Chrystusa, Ojciec chwały, dał wam Ducha mądrości i objawienia w poznaniu jego samego;"
"Ef1,18": "Ażeby oświecił oczy waszego umysłu, abyście wiedzieli, czym jest nadzieja jego powołania, czym jest bogactwo chwały jego dziedzictwa w świętych;"
"Ef1,19": "I czym jest przemożna wielkość jego mocy wobec nas, którzy wierzymy, według działania potęgi jego siły."
"Ef1,20": "Okazał ją w Chrystusie, gdy go wskrzesił z martwych i posadził po swojej prawicy w miejscach niebiańskich;"
"Ef1,21": "Wysoko ponad wszelką zwierzchnością i władzą, mocą, panowaniem i ponad wszelkim imieniem wypowiadanym nie tylko w tym świecie, ale i w przyszłym."
"Ef1,22": "I wszystko poddał pod jego stopy, a jego samego dał jako głowę ponad wszystkim kościołowi;"
"Ef1,23": "Który jest jego ciałem i pełnią tego, który wszystko we wszystkich napełnia."
