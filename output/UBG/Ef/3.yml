"Ef3,1":
  text: "Dlatego ja, Paweł, więzień Chrystusa Jezusa dla was, pogan;"
  tags: []
"Ef3,2":
  text: "Jeśli tylko słyszeliście o udzieleniu łaski Boga, która jest mi dana dla was;"
  tags: []
"Ef3,3":
  text: "Że przez objawienie została mi oznajmiona tajemnica, jak to wam przedtem krótko napisałem."
  tags: []
"Ef3,4":
  text: "Dlatego czytając to, możecie zrozumieć moje poznanie tajemnicy Chrystusa;"
  tags: []
"Ef3,5":
  text: "Która w innych wiekach nie była znana synom ludzkim, jak teraz została objawiona jego świętym apostołom i prorokom przez Ducha;"
  tags: []
"Ef3,6":
  text: "Mianowicie, że poganie są współdziedzicami i członkami tego samego ciała, i współuczestnikami jego obietnicy w Chrystusie przez ewangelię."
  tags: []
"Ef3,7":
  text: "Stałem się jej sługą według daru łaski Boga danej mi przez działanie jego mocy."
  tags: []
"Ef3,8":
  text: "Mnie, najmniejszemu ze wszystkich świętych, została dana ta łaska, abym wśród pogan głosił te niezgłębione bogactwa Chrystusa;"
  tags: []
"Ef3,9":
  text: "I żebym ujawnił wszystkim, jaka jest wspólnota tej tajemnicy ukrytej od wieków w Bogu, który wszystko stworzył przez Jezusa Chrystusa;"
  tags: []
"Ef3,10":
  text: "Aby teraz wieloraka mądrość Boga poprzez kościół stała się jawna zwierzchnościom i władzom w miejscach niebiańskich;"
  tags: []
"Ef3,11":
  text: "Zgodnie z wiecznym postanowieniem, które powziął w Chrystusie Jezusie, naszym Panu."
  tags: []
"Ef3,12":
  text: "W nim mamy śmiałość i przystęp z ufnością przez wiarę jego."
  tags: []
"Ef3,13":
  text: "Proszę zatem, abyście nie zniechęcali się z powodu moich utrapień, jakie znoszę dla was, bo to one są waszą chwałą."
  tags: []
"Ef3,14":
  text: "Dlatego zginam swoje kolana przed Ojcem naszego Pana Jezusa Chrystusa;"
  tags: []
"Ef3,15":
  text: "Od którego cała rodzina na niebie i na ziemi bierze swoją nazwę;"
  tags: []
"Ef3,16":
  text: "Aby według bogactwa swej chwały sprawił, żeby wasz wewnętrzny człowiek był utwierdzony mocą przez jego Ducha;"
  tags: []
"Ef3,17":
  text: "Aby Chrystus przez wiarę mieszkał w waszych sercach, abyście zakorzenieni i ugruntowani w miłości;"
  tags: []
"Ef3,18":
  text: "Mogli pojąć wraz ze wszystkimi świętymi, jaka jest szerokość, długość, głębokość i wysokość;"
  tags: []
"Ef3,19":
  text: "I poznać miłość Chrystusa, która przewyższa wszelkie poznanie, abyście zostali napełnieni całą pełnią Boga."
  tags: []
"Ef3,20":
  text: "Temu zaś, który według mocy działającej w nas może uczynić o wiele obficiej ponad to wszystko, o co prosimy albo o czym myślimy;"
  tags: []
"Ef3,21":
  text: "Jemu niech będzie chwała w kościele przez Chrystusa Jezusa po wszystkie pokolenia na wieki wieków. Amen."
  tags: []
