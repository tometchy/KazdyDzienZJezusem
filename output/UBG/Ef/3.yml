"Ef3,1": "Dlatego ja, Paweł, więzień Chrystusa Jezusa dla was, pogan;"
"Ef3,2": "Jeśli tylko słyszeliście o udzieleniu łaski Boga, która jest mi dana dla was;"
"Ef3,3": "Że przez objawienie została mi oznajmiona tajemnica, jak to wam przedtem krótko napisałem."
"Ef3,4": "Dlatego czytając to, możecie zrozumieć moje poznanie tajemnicy Chrystusa;"
"Ef3,5": "Która w innych wiekach nie była znana synom ludzkim, jak teraz została objawiona jego świętym apostołom i prorokom przez Ducha;"
"Ef3,6": "Mianowicie, że poganie są współdziedzicami i członkami tego samego ciała, i współuczestnikami jego obietnicy w Chrystusie przez ewangelię."
"Ef3,7": "Stałem się jej sługą według daru łaski Boga danej mi przez działanie jego mocy."
"Ef3,8": "Mnie, najmniejszemu ze wszystkich świętych, została dana ta łaska, abym wśród pogan głosił te niezgłębione bogactwa Chrystusa;"
"Ef3,9": "I żebym ujawnił wszystkim, jaka jest wspólnota tej tajemnicy ukrytej od wieków w Bogu, który wszystko stworzył przez Jezusa Chrystusa;"
"Ef3,10": "Aby teraz wieloraka mądrość Boga poprzez kościół stała się jawna zwierzchnościom i władzom w miejscach niebiańskich;"
"Ef3,11": "Zgodnie z wiecznym postanowieniem, które powziął w Chrystusie Jezusie, naszym Panu."
"Ef3,12": "W nim mamy śmiałość i przystęp z ufnością przez wiarę jego."
"Ef3,13": "Proszę zatem, abyście nie zniechęcali się z powodu moich utrapień, jakie znoszę dla was, bo to one są waszą chwałą."
"Ef3,14": "Dlatego zginam swoje kolana przed Ojcem naszego Pana Jezusa Chrystusa;"
"Ef3,15": "Od którego cała rodzina na niebie i na ziemi bierze swoją nazwę;"
"Ef3,16": "Aby według bogactwa swej chwały sprawił, żeby wasz wewnętrzny człowiek był utwierdzony mocą przez jego Ducha;"
"Ef3,17": "Aby Chrystus przez wiarę mieszkał w waszych sercach, abyście zakorzenieni i ugruntowani w miłości;"
"Ef3,18": "Mogli pojąć wraz ze wszystkimi świętymi, jaka jest szerokość, długość, głębokość i wysokość;"
"Ef3,19": "I poznać miłość Chrystusa, która przewyższa wszelkie poznanie, abyście zostali napełnieni całą pełnią Boga."
"Ef3,20": "Temu zaś, który według mocy działającej w nas może uczynić o wiele obficiej ponad to wszystko, o co prosimy albo o czym myślimy;"
"Ef3,21": "Jemu niech będzie chwała w kościele przez Chrystusa Jezusa po wszystkie pokolenia na wieki wieków. Amen."
