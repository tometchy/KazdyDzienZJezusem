"2Kor11,1": "O, gdybyście mogli trochę znieść moje głupstwo! Doprawdy znoście mnie."
"2Kor11,2": "Jestem bowiem zazdrosny o was Bożą zazdrością; zaślubiłem was bowiem jednemu mężowi, aby przedstawić was Chrystusowi jako czystą dziewicę."
"2Kor11,3": "Lecz boję się, by czasem, tak jak wąż swoją przebiegłością oszukał Ewę, tak też wasze umysły nie zostały skażone i nie odstąpiły od prostoty, która jest w Chrystusie."
"2Kor11,4": "Gdyby bowiem przyszedł ktoś i głosił innego Jezusa, którego my nie głosiliśmy, albo gdybyście przyjęli innego ducha, którego nie otrzymaliście, albo inną ewangelię, której nie przyjęliście, znosilibyście go z łatwością."
"2Kor11,5": "A uważam, że w niczym nie ustępowałem tym wielkim apostołom."
"2Kor11,6": "Bo chociaż jestem prostakiem w mowie, to jednak nie w poznaniu; lecz staliśmy się jawni wobec was we wszystkim, pod każdym względem."
"2Kor11,7": "Czyż popełniłem grzech, uniżając samego siebie, abyście wy byli wywyższeni, że za darmo głosiłem wam ewangelię Bożą?"
"2Kor11,8": "Ograbiłem inne kościoły, biorąc od nich zapłatę, aby wam służyć."
"2Kor11,9": "A gdy byłem u was i znalazłem się w potrzebie, nikomu nie byłem ciężarem; mój niedostatek bowiem uzupełnili bracia, którzy przybyli z Macedonii. Pilnowałem się, aby w niczym nie być dla was ciężarem, i nadal będę się pilnował."
"2Kor11,10": "Jak prawda Chrystusa jest we mnie, tak tej chluby nikt mi nie odbierze w granicach Achai."
"2Kor11,11": "Dlaczego? Czy dlatego, że was nie miłuję? Bóg to wie."
"2Kor11,12": "Co zaś czynię, nadal będę czynił, aby pozbawić okazji tych, którzy jej szukają, aby w tym, z czego się chlubią, okazali się takimi jak my."
"2Kor11,13": "Tacy bowiem są fałszywymi apostołami, podstępnymi pracownikami, którzy przybierają postać apostołów Chrystusa."
"2Kor11,14": "I nic dziwnego, sam bowiem szatan przybiera postać anioła światłości."
"2Kor11,15": "Nic więc wielkiego, jeśli i jego słudzy przybierają postać sług sprawiedliwości. Koniec ich jednak będzie według ich uczynków."
"2Kor11,16": "Mówię znowu: Niech nikt nie uważa mnie za głupiego; a jeśli już tak, to przyjmijcie mnie jako głupiego, abym i ja mógł się trochę pochlubić."
"2Kor11,17": "Co mówię, nie mówię według Pana, ale jakby w głupocie, w tym śmiałym przechwalaniu się."
"2Kor11,18": "Skoro wielu chlubi się według ciała, i ja będę się chlubił."
"2Kor11,19": "Chętnie przecież znosicie głupich, sami będąc mądrymi."
"2Kor11,20": "Znosicie bowiem, gdy ktoś was bierze w niewolę, gdy ktoś was objada, gdy ktoś was wyzyskuje, gdy ktoś wynosi się ponad was, gdy was ktoś policzkuje."
"2Kor11,21": "Mówię o hańbie, jakbyśmy byli słabi; lecz w czym ktoś jest śmiały – mówię jak głupi – ja też jestem śmiały."
"2Kor11,22": "Są Hebrajczykami? Ja także. Są Izraelitami? Ja także. Są potomstwem Abrahama? Ja także."
"2Kor11,23": "Są sługami Chrystusa? Mówię jak głupi: Ja jeszcze bardziej; w pracach więcej, w chłostach nad miarę, w więzieniach częściej, w niebezpieczeństwie śmierci wielokroć."
"2Kor11,24": "Od Żydów pięciokrotnie otrzymałem czterdzieści razów bez jednego."
"2Kor11,25": "Trzy razy byłem bity rózgami, raz kamienowany, trzy razy rozbił się ze mną okręt, dzień i noc spędziłem w głębinie morskiej."
"2Kor11,26": "Często w podróżach, w niebezpieczeństwach na rzekach, w niebezpieczeństwach od bandytów, w niebezpieczeństwach od własnego narodu, w niebezpieczeństwach od pogan, w niebezpieczeństwach w mieście, w niebezpieczeństwach na pustyni, w niebezpieczeństwach na morzu, w niebezpieczeństwach wśród fałszywych braci;"
"2Kor11,27": "W trudzie i znoju, często w czuwaniu, w głodzie i pragnieniu, często w postach, w zimnie i nagości;"
"2Kor11,28": "A poza tymi sprawami zewnętrznymi, w tym, co mi codziennie ciąży, w trosce o wszystkie kościoły."
"2Kor11,29": "Któż jest słaby, żebym i ja nie był słaby? Któż się gorszy, żebym i ja nie płonął?"
"2Kor11,30": "Jeśli mam się chlubić, będę się chlubić z moich słabości."
"2Kor11,31": "Bóg i Ojciec naszego Pana Jezusa Chrystusa, który jest błogosławiony na wieki, wie, że nie kłamię."
"2Kor11,32": "W Damaszku namiestnik króla Aretasa otoczył strażą miasto Damasceńczyków, chcąc mnie schwytać;"
"2Kor11,33": "Ale przez okno spuszczono mnie w koszu przez mur i uszedłem jego rąk."
