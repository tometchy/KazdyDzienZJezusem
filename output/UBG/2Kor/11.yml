"2Kor11,1":
  text: "O, gdybyście mogli trochę znieść moje głupstwo! Doprawdy znoście mnie."
  tags: []
"2Kor11,2":
  text: "Jestem bowiem zazdrosny o was Bożą zazdrością; zaślubiłem was bowiem jednemu mężowi, aby przedstawić was Chrystusowi jako czystą dziewicę."
  tags: []
"2Kor11,3":
  text: "Lecz boję się, by czasem, tak jak wąż swoją przebiegłością oszukał Ewę, tak też wasze umysły nie zostały skażone i nie odstąpiły od prostoty, która jest w Chrystusie."
  tags: []
"2Kor11,4":
  text: "Gdyby bowiem przyszedł ktoś i głosił innego Jezusa, którego my nie głosiliśmy, albo gdybyście przyjęli innego ducha, którego nie otrzymaliście, albo inną ewangelię, której nie przyjęliście, znosilibyście go z łatwością."
  tags: []
"2Kor11,5":
  text: "A uważam, że w niczym nie ustępowałem tym wielkim apostołom."
  tags: []
"2Kor11,6":
  text: "Bo chociaż jestem prostakiem w mowie, to jednak nie w poznaniu; lecz staliśmy się jawni wobec was we wszystkim, pod każdym względem."
  tags: []
"2Kor11,7":
  text: "Czyż popełniłem grzech, uniżając samego siebie, abyście wy byli wywyższeni, że za darmo głosiłem wam ewangelię Bożą?"
  tags: []
"2Kor11,8":
  text: "Ograbiłem inne kościoły, biorąc od nich zapłatę, aby wam służyć."
  tags: []
"2Kor11,9":
  text: "A gdy byłem u was i znalazłem się w potrzebie, nikomu nie byłem ciężarem; mój niedostatek bowiem uzupełnili bracia, którzy przybyli z Macedonii. Pilnowałem się, aby w niczym nie być dla was ciężarem, i nadal będę się pilnował."
  tags: []
"2Kor11,10":
  text: "Jak prawda Chrystusa jest we mnie, tak tej chluby nikt mi nie odbierze w granicach Achai."
  tags: []
"2Kor11,11":
  text: "Dlaczego? Czy dlatego, że was nie miłuję? Bóg to wie."
  tags: []
"2Kor11,12":
  text: "Co zaś czynię, nadal będę czynił, aby pozbawić okazji tych, którzy jej szukają, aby w tym, z czego się chlubią, okazali się takimi jak my."
  tags: []
"2Kor11,13":
  text: "Tacy bowiem są fałszywymi apostołami, podstępnymi pracownikami, którzy przybierają postać apostołów Chrystusa."
  tags: []
"2Kor11,14":
  text: "I nic dziwnego, sam bowiem szatan przybiera postać anioła światłości."
  tags: []
"2Kor11,15":
  text: "Nic więc wielkiego, jeśli i jego słudzy przybierają postać sług sprawiedliwości. Koniec ich jednak będzie według ich uczynków."
  tags: []
"2Kor11,16":
  text: "Mówię znowu: Niech nikt nie uważa mnie za głupiego; a jeśli już tak, to przyjmijcie mnie jako głupiego, abym i ja mógł się trochę pochlubić."
  tags: []
"2Kor11,17":
  text: "Co mówię, nie mówię według Pana, ale jakby w głupocie, w tym śmiałym przechwalaniu się."
  tags: []
"2Kor11,18":
  text: "Skoro wielu chlubi się według ciała, i ja będę się chlubił."
  tags: []
"2Kor11,19":
  text: "Chętnie przecież znosicie głupich, sami będąc mądrymi."
  tags: []
"2Kor11,20":
  text: "Znosicie bowiem, gdy ktoś was bierze w niewolę, gdy ktoś was objada, gdy ktoś was wyzyskuje, gdy ktoś wynosi się ponad was, gdy was ktoś policzkuje."
  tags: []
"2Kor11,21":
  text: "Mówię o hańbie, jakbyśmy byli słabi; lecz w czym ktoś jest śmiały – mówię jak głupi – ja też jestem śmiały."
  tags: []
"2Kor11,22":
  text: "Są Hebrajczykami? Ja także. Są Izraelitami? Ja także. Są potomstwem Abrahama? Ja także."
  tags: []
"2Kor11,23":
  text: "Są sługami Chrystusa? Mówię jak głupi: Ja jeszcze bardziej; w pracach więcej, w chłostach nad miarę, w więzieniach częściej, w niebezpieczeństwie śmierci wielokroć."
  tags: []
"2Kor11,24":
  text: "Od Żydów pięciokrotnie otrzymałem czterdzieści razów bez jednego."
  tags: []
"2Kor11,25":
  text: "Trzy razy byłem bity rózgami, raz kamienowany, trzy razy rozbił się ze mną okręt, dzień i noc spędziłem w głębinie morskiej."
  tags: []
"2Kor11,26":
  text: "Często w podróżach, w niebezpieczeństwach na rzekach, w niebezpieczeństwach od bandytów, w niebezpieczeństwach od własnego narodu, w niebezpieczeństwach od pogan, w niebezpieczeństwach w mieście, w niebezpieczeństwach na pustyni, w niebezpieczeństwach na morzu, w niebezpieczeństwach wśród fałszywych braci;"
  tags: []
"2Kor11,27":
  text: "W trudzie i znoju, często w czuwaniu, w głodzie i pragnieniu, często w postach, w zimnie i nagości;"
  tags: []
"2Kor11,28":
  text: "A poza tymi sprawami zewnętrznymi, w tym, co mi codziennie ciąży, w trosce o wszystkie kościoły."
  tags: []
"2Kor11,29":
  text: "Któż jest słaby, żebym i ja nie był słaby? Któż się gorszy, żebym i ja nie płonął?"
  tags: []
"2Kor11,30":
  text: "Jeśli mam się chlubić, będę się chlubić z moich słabości."
  tags: []
"2Kor11,31":
  text: "Bóg i Ojciec naszego Pana Jezusa Chrystusa, który jest błogosławiony na wieki, wie, że nie kłamię."
  tags: []
"2Kor11,32":
  text: "W Damaszku namiestnik króla Aretasa otoczył strażą miasto Damasceńczyków, chcąc mnie schwytać;"
  tags: []
"2Kor11,33":
  text: "Ale przez okno spuszczono mnie w koszu przez mur i uszedłem jego rąk."
  tags: []
