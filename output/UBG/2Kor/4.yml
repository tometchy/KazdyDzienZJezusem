"2Kor4,1": "Dlatego mając to posługiwanie, tak jak otrzymaliśmy miłosierdzie, nie zniechęcamy się."
"2Kor4,2": "Lecz wyrzekliśmy się ukrytych haniebnych czynów, nie postępując podstępnie ani nie fałszując słowa Bożego, ale przez ujawnianie prawdy polecamy samych siebie sumieniu każdego człowieka w obliczu Boga."
"2Kor4,3": "A jeśli nasza ewangelia jest zakryta, to jest zakryta dla tych, którzy giną;"
"2Kor4,4": "W których bóg tego świata zaślepił umysły, w niewierzących, aby nie świeciła im światłość chwalebnej ewangelii Chrystusa, który jest obrazem Boga."
"2Kor4,5": "Nie głosimy bowiem samych siebie, lecz Chrystusa Jezusa, że jest Panem, a samych siebie, że jesteśmy waszymi sługami dla Jezusa."
"2Kor4,6": "Ponieważ Bóg, który rozkazał, aby z ciemności zabłysnęło światło, ten zabłysnął w naszych sercach, aby zajaśniało w nas poznanie chwały Bożej w obliczu Jezusa Chrystusa."
"2Kor4,7": "Mamy zaś ten skarb w naczyniach glinianych, aby wspaniałość tej mocy była z Boga, a nie z nas."
"2Kor4,8": "Zewsząd jesteśmy uciskani, lecz nie przygnębieni, bezradni, lecz nie zrozpaczeni;"
"2Kor4,9": "Prześladowani, lecz nie opuszczeni, powaleni, ale nie zgładzeni."
"2Kor4,10": "Nieustannie nosimy w ciele umieranie Pana Jezusa, aby i życie Jezusa objawiło się w naszym ciele."
"2Kor4,11": "Zawsze bowiem my, którzy żyjemy, jesteśmy wydawani na śmierć z powodu Jezusa, aby i życie Jezusa objawiło się w naszym śmiertelnym ciele."
"2Kor4,12": "Tak więc w nas działa śmierć, a w was życie."
"2Kor4,13": "Mając zaś tego samego ducha wiary, jak jest napisane: Uwierzyłem i dlatego przemówiłem; my również wierzymy i dlatego mówimy;"
"2Kor4,14": "Wiedząc, że ten, który wskrzesił Pana Jezusa, przez Jezusa wskrzesi także nas i postawi razem z wami."
"2Kor4,15": "Wszystko to bowiem dzieje się dla was, żeby obfitująca łaska, przez dziękczynienie wielu, rozmnożyła się ku chwale Bożej."
"2Kor4,16": "Dlatego nie zniechęcamy się, bo chociaż nasz zewnętrzny człowiek niszczeje, to jednak ten wewnętrzny odnawia się z dnia na dzień."
"2Kor4,17": "Ten bowiem nasz chwilowy i lekki ucisk przynosi nam przeogromną i wieczną wagę chwały;"
"2Kor4,18": "Gdy nie patrzymy na to, co widzialne, lecz na to, co niewidzialne. To bowiem, co widzialne, jest doczesne, to zaś, co niewidzialne, jest wieczne."
