"2Kor4,1":
  text: "Dlatego mając to posługiwanie, tak jak otrzymaliśmy miłosierdzie, nie zniechęcamy się."
  tags: []
"2Kor4,2":
  text: "Lecz wyrzekliśmy się ukrytych haniebnych czynów, nie postępując podstępnie ani nie fałszując słowa Bożego, ale przez ujawnianie prawdy polecamy samych siebie sumieniu każdego człowieka w obliczu Boga."
  tags: []
"2Kor4,3":
  text: "A jeśli nasza ewangelia jest zakryta, to jest zakryta dla tych, którzy giną;"
  tags: []
"2Kor4,4":
  text: "W których bóg tego świata zaślepił umysły, w niewierzących, aby nie świeciła im światłość chwalebnej ewangelii Chrystusa, który jest obrazem Boga."
  tags: []
"2Kor4,5":
  text: "Nie głosimy bowiem samych siebie, lecz Chrystusa Jezusa, że jest Panem, a samych siebie, że jesteśmy waszymi sługami dla Jezusa."
  tags: []
"2Kor4,6":
  text: "Ponieważ Bóg, który rozkazał, aby z ciemności zabłysnęło światło, ten zabłysnął w naszych sercach, aby zajaśniało w nas poznanie chwały Bożej w obliczu Jezusa Chrystusa."
  tags: []
"2Kor4,7":
  text: "Mamy zaś ten skarb w naczyniach glinianych, aby wspaniałość tej mocy była z Boga, a nie z nas."
  tags: []
"2Kor4,8":
  text: "Zewsząd jesteśmy uciskani, lecz nie przygnębieni, bezradni, lecz nie zrozpaczeni;"
  tags: []
"2Kor4,9":
  text: "Prześladowani, lecz nie opuszczeni, powaleni, ale nie zgładzeni."
  tags: []
"2Kor4,10":
  text: "Nieustannie nosimy w ciele umieranie Pana Jezusa, aby i życie Jezusa objawiło się w naszym ciele."
  tags: []
"2Kor4,11":
  text: "Zawsze bowiem my, którzy żyjemy, jesteśmy wydawani na śmierć z powodu Jezusa, aby i życie Jezusa objawiło się w naszym śmiertelnym ciele."
  tags: []
"2Kor4,12":
  text: "Tak więc w nas działa śmierć, a w was życie."
  tags: []
"2Kor4,13":
  text: "Mając zaś tego samego ducha wiary, jak jest napisane: Uwierzyłem i dlatego przemówiłem; my również wierzymy i dlatego mówimy;"
  tags: []
"2Kor4,14":
  text: "Wiedząc, że ten, który wskrzesił Pana Jezusa, przez Jezusa wskrzesi także nas i postawi razem z wami."
  tags: []
"2Kor4,15":
  text: "Wszystko to bowiem dzieje się dla was, żeby obfitująca łaska, przez dziękczynienie wielu, rozmnożyła się ku chwale Bożej."
  tags: []
"2Kor4,16":
  text: "Dlatego nie zniechęcamy się, bo chociaż nasz zewnętrzny człowiek niszczeje, to jednak ten wewnętrzny odnawia się z dnia na dzień."
  tags: []
"2Kor4,17":
  text: "Ten bowiem nasz chwilowy i lekki ucisk przynosi nam przeogromną i wieczną wagę chwały;"
  tags: []
"2Kor4,18":
  text: "Gdy nie patrzymy na to, co widzialne, lecz na to, co niewidzialne. To bowiem, co widzialne, jest doczesne, to zaś, co niewidzialne, jest wieczne."
  tags: []
