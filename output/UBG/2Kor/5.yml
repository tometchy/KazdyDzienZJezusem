"2Kor5,1": "Wiemy bowiem, że jeśli zostanie zniszczony ten namiot naszego ziemskiego mieszkania, to mamy budowlę od Boga, dom nie ręką uczyniony, wieczny w niebiosach."
"2Kor5,2": "Dlatego w tym wzdychamy, pragnąc przyodziać się w nasz dom z nieba;"
"2Kor5,3": "Jeśli tylko zostaniemy znalezieni odziani, a nie nadzy."
"2Kor5,4": "Bo my, którzy jesteśmy w tym namiocie, wzdychamy, obciążeni, ponieważ nie pragniemy być rozebrani, ale przyodziani, aby to, co śmiertelne, zostało wchłonięte przez życie."
"2Kor5,5": "A tym, który nas do tego właśnie przygotował, jest Bóg, który nam też dał Ducha jako zadatek."
"2Kor5,6": "Tak więc mamy zawsze ufność, wiedząc, że dopóki mieszkamy w tym ciele, tułamy się z dala od Pana."
"2Kor5,7": "(Przez wiarę bowiem kroczymy, a nie przez widzenie.)"
"2Kor5,8": "Mamy jednak ufność i wolelibyśmy raczej wyjść z ciała i zamieszkać u Pana."
"2Kor5,9": "Dlatego też zabiegamy o to, żeby się jemu podobać, czy mieszkamy w ciele, czy z niego wychodzimy."
"2Kor5,10": "Wszyscy bowiem musimy stanąć przed trybunałem Chrystusa, aby każdy otrzymał zapłatę za to, co czynił w ciele, według tego, co czynił, czy dobro, czy zło."
"2Kor5,11": "Wiedząc zatem o tym strachu Pańskim, przekonujemy ludzi; dla Boga zaś wszystko w nas jest jawne; mam też nadzieję, że i dla waszych sumień wszystko w nas jest jawne."
"2Kor5,12": "Bo nie polecamy wam ponownie samych siebie, ale dajemy wam sposobność do chlubienia się nami, żebyście mieli co odpowiedzieć tym, którzy się chlubią tym, co zewnętrzne, a nie sercem."
"2Kor5,13": "Jeśli zaś odchodzimy od zmysłów – dla Boga odchodzimy, jeżeli jesteśmy przy zdrowych zmysłach – dla was jesteśmy."
"2Kor5,14": "Miłość Chrystusa bowiem przymusza nas, jako tych, którzy uznaliśmy, że skoro jeden umarł za wszystkich, to wszyscy umarli."
"2Kor5,15": "A umarł za wszystkich, aby ci, którzy żyją, już więcej nie żyli dla siebie, lecz dla tego, który za nich umarł i został wskrzeszony."
"2Kor5,16": "Dlatego my odtąd nikogo nie znamy według ciała, a chociaż znaliśmy Chrystusa według ciała, to teraz już więcej go takim nie znamy."
"2Kor5,17": "Tak więc jeśli ktoś jest w Chrystusie, nowym jest stworzeniem; to, co stare, przeminęło, oto wszystko stało się nowe."
"2Kor5,18": "A wszystko to jest z Boga, który nas pojednał ze sobą przez Jezusa Chrystusa i dał nam służbę pojednania."
"2Kor5,19": "Bóg bowiem był w Chrystusie, jednając świat z samym sobą, nie poczytując ludziom ich grzechów, i nam powierzył to słowo pojednania."
"2Kor5,20": "Tak więc w miejsce Chrystusa sprawujemy poselstwo, tak jakby Bóg upominał was przez nas. W miejsce Chrystusa prosimy: Pojednajcie się z Bogiem."
"2Kor5,21": "On bowiem tego, który nie znał grzechu, za nas grzechem uczynił, abyśmy w nim stali się sprawiedliwością Bożą."
