"2Kor5,1":
  text: "Wiemy bowiem, że jeśli zostanie zniszczony ten namiot naszego ziemskiego mieszkania, to mamy budowlę od Boga, dom nie ręką uczyniony, wieczny w niebiosach."
  tags: []
"2Kor5,2":
  text: "Dlatego w tym wzdychamy, pragnąc przyodziać się w nasz dom z nieba;"
  tags: []
"2Kor5,3":
  text: "Jeśli tylko zostaniemy znalezieni odziani, a nie nadzy."
  tags: []
"2Kor5,4":
  text: "Bo my, którzy jesteśmy w tym namiocie, wzdychamy, obciążeni, ponieważ nie pragniemy być rozebrani, ale przyodziani, aby to, co śmiertelne, zostało wchłonięte przez życie."
  tags: []
"2Kor5,5":
  text: "A tym, który nas do tego właśnie przygotował, jest Bóg, który nam też dał Ducha jako zadatek."
  tags: []
"2Kor5,6":
  text: "Tak więc mamy zawsze ufność, wiedząc, że dopóki mieszkamy w tym ciele, tułamy się z dala od Pana."
  tags: []
"2Kor5,7":
  text: "(Przez wiarę bowiem kroczymy, a nie przez widzenie.)"
  tags: []
"2Kor5,8":
  text: "Mamy jednak ufność i wolelibyśmy raczej wyjść z ciała i zamieszkać u Pana."
  tags: []
"2Kor5,9":
  text: "Dlatego też zabiegamy o to, żeby się jemu podobać, czy mieszkamy w ciele, czy z niego wychodzimy."
  tags: []
"2Kor5,10":
  text: "Wszyscy bowiem musimy stanąć przed trybunałem Chrystusa, aby każdy otrzymał zapłatę za to, co czynił w ciele, według tego, co czynił, czy dobro, czy zło."
  tags: []
"2Kor5,11":
  text: "Wiedząc zatem o tym strachu Pańskim, przekonujemy ludzi; dla Boga zaś wszystko w nas jest jawne; mam też nadzieję, że i dla waszych sumień wszystko w nas jest jawne."
  tags: []
"2Kor5,12":
  text: "Bo nie polecamy wam ponownie samych siebie, ale dajemy wam sposobność do chlubienia się nami, żebyście mieli co odpowiedzieć tym, którzy się chlubią tym, co zewnętrzne, a nie sercem."
  tags: []
"2Kor5,13":
  text: "Jeśli zaś odchodzimy od zmysłów – dla Boga odchodzimy, jeżeli jesteśmy przy zdrowych zmysłach – dla was jesteśmy."
  tags: []
"2Kor5,14":
  text: "Miłość Chrystusa bowiem przymusza nas, jako tych, którzy uznaliśmy, że skoro jeden umarł za wszystkich, to wszyscy umarli."
  tags: []
"2Kor5,15":
  text: "A umarł za wszystkich, aby ci, którzy żyją, już więcej nie żyli dla siebie, lecz dla tego, który za nich umarł i został wskrzeszony."
  tags: []
"2Kor5,16":
  text: "Dlatego my odtąd nikogo nie znamy według ciała, a chociaż znaliśmy Chrystusa według ciała, to teraz już więcej go takim nie znamy."
  tags: []
"2Kor5,17":
  text: "Tak więc jeśli ktoś jest w Chrystusie, nowym jest stworzeniem; to, co stare, przeminęło, oto wszystko stało się nowe."
  tags: []
"2Kor5,18":
  text: "A wszystko to jest z Boga, który nas pojednał ze sobą przez Jezusa Chrystusa i dał nam służbę pojednania."
  tags: []
"2Kor5,19":
  text: "Bóg bowiem był w Chrystusie, jednając świat z samym sobą, nie poczytując ludziom ich grzechów, i nam powierzył to słowo pojednania."
  tags: []
"2Kor5,20":
  text: "Tak więc w miejsce Chrystusa sprawujemy poselstwo, tak jakby Bóg upominał was przez nas. W miejsce Chrystusa prosimy: Pojednajcie się z Bogiem."
  tags: []
"2Kor5,21":
  text: "On bowiem tego, który nie znał grzechu, za nas grzechem uczynił, abyśmy w nim stali się sprawiedliwością Bożą."
  tags: []
