"2Kor9,1":
  text: "Lecz o posłudze na rzecz świętych nie ma potrzeby, abym wam pisał."
  tags: []
"2Kor9,2":
  text: "Znam bowiem waszą gotowość, z powodu której wobec Macedończyków chlubię się wami, że Achaja jest gotowa od zeszłego roku, i wasza gorliwość pobudziła wielu."
  tags: []
"2Kor9,3":
  text: "Ale posłałem braci, żeby nasza chluba z was nie okazała się pod tym względem próżna, abyście, jak mówiłem, byli przygotowani;"
  tags: []
"2Kor9,4":
  text: "I abyśmy, jeśli przypadkiem przybyliby ze mną Macedończycy i zastali was nieprzygotowanymi, nie byli zawstydzeni my – żeby nie powiedzieć: wy – za tak śmiałe przechwalanie się."
  tags: []
"2Kor9,5":
  text: "Uważałem więc za konieczne zachęcić braci, aby wcześniej udali się do was i zawczasu przygotowali przedtem obiecany wasz hojny dar, aby był gotowy jako wyraz hojności, a nie skąpstwa."
  tags: []
"2Kor9,6":
  text: "Lecz mówię: Kto skąpo sieje, skąpo też żąć będzie, a kto sieje obficie, obficie też żąć będzie."
  tags: []
"2Kor9,7":
  text: "Każdy jak postanowił w swym sercu, tak niech zrobi, nie z żalem ani z przymusu, gdyż radosnego dawcę Bóg miłuje."
  tags: []
"2Kor9,8":
  text: "A Bóg ma moc udzielić wam obficie wszelkiej łaski, abyście, mając zawsze wszystkiego pod dostatkiem, obfitowali we wszelki dobry uczynek;"
  tags: []
"2Kor9,9":
  text: "Jak jest napisane: Rozrzucił, dał ubogim, jego sprawiedliwość trwa na wieki."
  tags: []
"2Kor9,10":
  text: "A ten, który daje ziarno siewcy, niech i wam da chleba do jedzenia, i wasze ziarno rozmnoży, i zwiększy plon waszej sprawiedliwości;"
  tags: []
"2Kor9,11":
  text: "Abyście byli wzbogaceni we wszystko ku wszelkiej hojności, która sprawia, że z naszego powodu składane jest dziękczynienie Bogu."
  tags: []
"2Kor9,12":
  text: "Posługiwanie bowiem w tej służbie nie tylko zaspokaja niedostatki świętych, ale też obfituje w liczne dziękczynienia składane Bogu."
  tags: []
"2Kor9,13":
  text: "Gdyż przez doświadczenie tej posługi chwalą Boga za to, że jesteście posłuszni wyznawanej przez siebie ewangelii Chrystusa i hojni w udzielaniu im i wszystkim innym;"
  tags: []
"2Kor9,14":
  text: "A modląc się za was, tęsknią za wami z powodu obfitującej w was łaski Bożej."
  tags: []
"2Kor9,15":
  text: "Bogu niech będą dzięki za jego niewypowiedziany dar."
  tags: []
