"2Kor9,1": "Lecz o posłudze na rzecz świętych nie ma potrzeby, abym wam pisał."
"2Kor9,2": "Znam bowiem waszą gotowość, z powodu której wobec Macedończyków chlubię się wami, że Achaja jest gotowa od zeszłego roku, i wasza gorliwość pobudziła wielu."
"2Kor9,3": "Ale posłałem braci, żeby nasza chluba z was nie okazała się pod tym względem próżna, abyście, jak mówiłem, byli przygotowani;"
"2Kor9,4": "I abyśmy, jeśli przypadkiem przybyliby ze mną Macedończycy i zastali was nieprzygotowanymi, nie byli zawstydzeni my – żeby nie powiedzieć: wy – za tak śmiałe przechwalanie się."
"2Kor9,5": "Uważałem więc za konieczne zachęcić braci, aby wcześniej udali się do was i zawczasu przygotowali przedtem obiecany wasz hojny dar, aby był gotowy jako wyraz hojności, a nie skąpstwa."
"2Kor9,6": "Lecz mówię: Kto skąpo sieje, skąpo też żąć będzie, a kto sieje obficie, obficie też żąć będzie."
"2Kor9,7": "Każdy jak postanowił w swym sercu, tak niech zrobi, nie z żalem ani z przymusu, gdyż radosnego dawcę Bóg miłuje."
"2Kor9,8": "A Bóg ma moc udzielić wam obficie wszelkiej łaski, abyście, mając zawsze wszystkiego pod dostatkiem, obfitowali we wszelki dobry uczynek;"
"2Kor9,9": "Jak jest napisane: Rozrzucił, dał ubogim, jego sprawiedliwość trwa na wieki."
"2Kor9,10": "A ten, który daje ziarno siewcy, niech i wam da chleba do jedzenia, i wasze ziarno rozmnoży, i zwiększy plon waszej sprawiedliwości;"
"2Kor9,11": "Abyście byli wzbogaceni we wszystko ku wszelkiej hojności, która sprawia, że z naszego powodu składane jest dziękczynienie Bogu."
"2Kor9,12": "Posługiwanie bowiem w tej służbie nie tylko zaspokaja niedostatki świętych, ale też obfituje w liczne dziękczynienia składane Bogu."
"2Kor9,13": "Gdyż przez doświadczenie tej posługi chwalą Boga za to, że jesteście posłuszni wyznawanej przez siebie ewangelii Chrystusa i hojni w udzielaniu im i wszystkim innym;"
"2Kor9,14": "A modląc się za was, tęsknią za wami z powodu obfitującej w was łaski Bożej."
"2Kor9,15": "Bogu niech będą dzięki za jego niewypowiedziany dar."
