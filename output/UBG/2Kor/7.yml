"2Kor7,1":
  text: "Mając więc te obietnice, najmilsi, oczyśćmy się z wszelkiego brudu ciała i ducha, dopełniając uświęcenia w bojaźni Bożej."
  tags: []
"2Kor7,2":
  text: "Przyjmijcie nas; nikogo nie skrzywdziliśmy, nikogo nie zepsuliśmy, nikogo nie wykorzystaliśmy."
  tags: []
"2Kor7,3":
  text: "Nie mówię tego, aby was potępiać; wcześniej bowiem powiedziałem, że jesteście w naszych sercach na wspólną śmierć i wspólne życie."
  tags: []
"2Kor7,4":
  text: "Mam wielką swobodę w mówieniu do was, bardzo się wami chlubię, jestem pełen pociechy, obfituję w radość w każdym naszym ucisku."
  tags: []
"2Kor7,5":
  text: "Kiedy bowiem przybyliśmy do Macedonii, nasze ciało nie zaznało żadnego odpoczynku, ale zewsząd byliśmy uciśnieni: na zewnątrz walki, a wewnątrz obawy."
  tags: []
"2Kor7,6":
  text: "Lecz Bóg, który pociesza uniżonych, pocieszył nas przez przybycie Tytusa."
  tags: []
"2Kor7,7":
  text: "A nie tylko przez jego przybycie, ale też przez pociechę, jakiej doznał wśród was, gdy opowiedział nam o waszej tęsknocie, o waszym płaczu, o waszej gorliwości względem mnie, tak że uradowałem się jeszcze bardziej."
  tags: []
"2Kor7,8":
  text: "Choć bowiem zasmuciłem was listem, nie żałuję tego, a mimo że żałowałem (bo widzę, że ten list zasmucił was, chociaż tylko na chwilę);"
  tags: []
"2Kor7,9":
  text: "To teraz się raduję, nie dlatego, że byliście zasmuceni, ale że byliście zasmuceni ku pokucie. Zostaliście bowiem zasmuceni według Boga, żebyście w niczym nie ponieśli szkody przez nas."
  tags: []
"2Kor7,10":
  text: "Bo smutek, który jest według Boga, przynosi pokutę ku zbawieniu, czego nikt nie żałuje; lecz smutek według świata przynosi śmierć."
  tags: []
"2Kor7,11":
  text: "To bowiem, że byliście zasmuceni według Boga, jakąż wielką wzbudziło w was pilność, jakie uniewinnianie się, jakie oburzenie, jaką bojaźń, jaką tęsknotę, jaką gorliwość, jakie wymierzenie kary! We wszystkim okazaliście się czyści w tej sprawie."
  tags: []
"2Kor7,12":
  text: "Dlatego chociaż pisałem do was, nie pisałem z powodu tego, który wyrządził krzywdę, ani z powodu tego, który krzywdy doznał, lecz aby okazać nasze zatroskanie o was przed Bogiem."
  tags: []
"2Kor7,13":
  text: "Tak więc zostaliśmy pocieszeni waszą pociechą. A jeszcze bardziej uradowaliśmy się radością Tytusa, bo jego duch został pokrzepiony przez was wszystkich."
  tags: []
"2Kor7,14":
  text: "Bo jeśli w czymś chlubiłem się wami przed nim, nie zostałem zawstydzony. Lecz tak, jak mówiliśmy wam wszystko zgodnie z prawdą, tak też nasza chluba przed Tytusem okazała się prawdziwa."
  tags: []
"2Kor7,15":
  text: "A jego serce jeszcze bardziej skłania się ku wam, gdy wspomina posłuszeństwo was wszystkich i to, jak przyjęliście go z bojaźnią i drżeniem."
  tags: []
"2Kor7,16":
  text: "Raduję się więc, że we wszystkim mogę wam ufać."
  tags: []
