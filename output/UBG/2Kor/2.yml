"2Kor2,1": "A postanowiłem to sobie, aby nie przychodzić do was znowu w smutku."
"2Kor2,2": "Jeśli bowiem ja was zasmucam, to któż może mnie rozweselić, jeśli nie ten, którego ja zasmucam?"
"2Kor2,3": "A to wam napisałem, abym, gdy przyjdę, nie doznał smutku od tych, od których powinienem doznawać radości, będąc pewien co do was wszystkich, że moja radość jest także waszą radością."
"2Kor2,4": "Gdyż w wielkim ucisku i utrapieniu serca, wśród wielu łez pisałem do was nie po to, abyście się smucili, ale żebyście poznali, jak wielka jest moja miłość do was."
"2Kor2,5": "Jeśli więc ktoś spowodował smutek, to nie mnie zasmucił, ale po części – by nie obciążyć – was wszystkich."
"2Kor2,6": "Takiemu wystarczy kara wymierzona przez wielu z was."
"2Kor2,7": "Tak więc przeciwnie, powinniście mu raczej przebaczyć i pocieszyć go, aby przypadkiem zbytni smutek go nie pochłonął."
"2Kor2,8": "Dlatego proszę was, abyście potwierdzili swą miłość do niego."
"2Kor2,9": "Po to też pisałem, aby was wypróbować i się przekonać, czy we wszystkim jesteście posłuszni."
"2Kor2,10": "A komu wy coś przebaczacie, temu i ja, gdyż i ja, jeśli coś przebaczyłem temu, któremu przebaczyłem, zrobiłem to ze względu na was wobec Chrystusa;"
"2Kor2,11": "Aby nas szatan nie podszedł; jego zamysły bowiem nie są nam nieznane."
"2Kor2,12": "Gdy zaś przybyłem do Troady, aby głosić ewangelię Chrystusa, a drzwi zostały mi otwarte w Panu;"
"2Kor2,13": "Nie zaznałem spokoju ducha, bo nie znalazłem Tytusa, mego brata. Rozstawszy się więc z nimi, wyruszyłem do Macedonii."
"2Kor2,14": "Lecz dzięki Bogu, który nam zawsze daje zwycięstwo w Chrystusie i roznosi przez nas woń swojego poznania w każdym miejscu."
"2Kor2,15": "Jesteśmy bowiem dla Boga przyjemną wonią Chrystusa wśród tych, którzy są zbawieni, i wśród tych, którzy giną."
"2Kor2,16": "Dla jednych wonią śmierci ku śmierci, a dla drugich wonią życia ku życiu. Lecz do tego któż jest zdatny?"
"2Kor2,17": "Nie jesteśmy bowiem jak wielu, którzy fałszują słowo Boże, lecz ze szczerości, jak od Boga mówimy w Chrystusie przed obliczem Boga."
