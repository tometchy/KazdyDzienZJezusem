"2Kor2,1":
  text: "A postanowiłem to sobie, aby nie przychodzić do was znowu w smutku."
  tags: []
"2Kor2,2":
  text: "Jeśli bowiem ja was zasmucam, to któż może mnie rozweselić, jeśli nie ten, którego ja zasmucam?"
  tags: []
"2Kor2,3":
  text: "A to wam napisałem, abym, gdy przyjdę, nie doznał smutku od tych, od których powinienem doznawać radości, będąc pewien co do was wszystkich, że moja radość jest także waszą radością."
  tags: []
"2Kor2,4":
  text: "Gdyż w wielkim ucisku i utrapieniu serca, wśród wielu łez pisałem do was nie po to, abyście się smucili, ale żebyście poznali, jak wielka jest moja miłość do was."
  tags: []
"2Kor2,5":
  text: "Jeśli więc ktoś spowodował smutek, to nie mnie zasmucił, ale po części – by nie obciążyć – was wszystkich."
  tags: []
"2Kor2,6":
  text: "Takiemu wystarczy kara wymierzona przez wielu z was."
  tags: []
"2Kor2,7":
  text: "Tak więc przeciwnie, powinniście mu raczej przebaczyć i pocieszyć go, aby przypadkiem zbytni smutek go nie pochłonął."
  tags: []
"2Kor2,8":
  text: "Dlatego proszę was, abyście potwierdzili swą miłość do niego."
  tags: []
"2Kor2,9":
  text: "Po to też pisałem, aby was wypróbować i się przekonać, czy we wszystkim jesteście posłuszni."
  tags: []
"2Kor2,10":
  text: "A komu wy coś przebaczacie, temu i ja, gdyż i ja, jeśli coś przebaczyłem temu, któremu przebaczyłem, zrobiłem to ze względu na was wobec Chrystusa;"
  tags: []
"2Kor2,11":
  text: "Aby nas szatan nie podszedł; jego zamysły bowiem nie są nam nieznane."
  tags: []
"2Kor2,12":
  text: "Gdy zaś przybyłem do Troady, aby głosić ewangelię Chrystusa, a drzwi zostały mi otwarte w Panu;"
  tags: []
"2Kor2,13":
  text: "Nie zaznałem spokoju ducha, bo nie znalazłem Tytusa, mego brata. Rozstawszy się więc z nimi, wyruszyłem do Macedonii."
  tags: []
"2Kor2,14":
  text: "Lecz dzięki Bogu, który nam zawsze daje zwycięstwo w Chrystusie i roznosi przez nas woń swojego poznania w każdym miejscu."
  tags: []
"2Kor2,15":
  text: "Jesteśmy bowiem dla Boga przyjemną wonią Chrystusa wśród tych, którzy są zbawieni, i wśród tych, którzy giną."
  tags: []
"2Kor2,16":
  text: "Dla jednych wonią śmierci ku śmierci, a dla drugich wonią życia ku życiu. Lecz do tego któż jest zdatny?"
  tags: []
"2Kor2,17":
  text: "Nie jesteśmy bowiem jak wielu, którzy fałszują słowo Boże, lecz ze szczerości, jak od Boga mówimy w Chrystusie przed obliczem Boga."
  tags: []
