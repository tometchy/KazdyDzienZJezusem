"2Kor13,1": "Oto teraz po raz trzeci idę do was. Na podstawie zeznania dwóch albo trzech świadków oparte będzie każde słowo."
"2Kor13,2": "Powiedziałem poprzednio i znowu mówię, jako obecny za drugim razem, a nieobecny teraz, piszę tym, którzy przedtem grzeszyli, i wszystkim innym, że jeśli znowu przybędę, nie oszczędzę nikogo;"
"2Kor13,3": "Skoro szukacie dowodu na to, że przeze mnie przemawia Chrystus, który nie jest słaby względem was, lecz jest mocny w was."
"2Kor13,4": "Chociaż bowiem został ukrzyżowany wskutek słabości, to jednak żyje z mocy Boga. I my także w nim jesteśmy słabi, ale będziemy żyć z nim z mocy Boga względem was."
"2Kor13,5": "Badajcie samych siebie, czy jesteście w wierze, samych siebie doświadczajcie. Czy nie wiecie o samych sobie, że Jezus Chrystus jest w was? Chyba że zostaliście odrzuceni."
"2Kor13,6": "Mam jednak nadzieję, że poznacie, iż my nie jesteśmy odrzuceni."
"2Kor13,7": "I modlę się do Boga, abyście nie czynili nic złego, nie po to, abyśmy my okazali się wypróbowani, ale abyście wy czynili to, co dobre, choćbyśmy byli jak odrzuceni."
"2Kor13,8": "Nie możemy bowiem nic uczynić przeciwko prawdzie, lecz dla prawdy."
"2Kor13,9": "Cieszymy się bowiem, gdy my jesteśmy słabi, a wy mocni; i tego też życzymy, abyście wy byli doskonali."
"2Kor13,10": "Dlatego piszę to, będąc nieobecny, abym będąc obecny, nie musiał postępować surowo według mocy, którą mi dał Pan ku zbudowaniu, a nie ku niszczeniu."
"2Kor13,11": "Na koniec, bracia, miejcie się dobrze; bądźcie doskonali, pokrzepiajcie się, bądźcie jednomyślni, żyjcie w pokoju, a Bóg miłości i pokoju będzie z wami."
"2Kor13,12": "Pozdrówcie się nawzajem świętym pocałunkiem."
"2Kor13,13": "Pozdrawiają was wszyscy święci."
"2Kor13,14": "Łaska Pana Jezusa Chrystusa, miłość Boga i wspólnota Ducha Świętego niech będzie z wami wszystkimi. Amen."
