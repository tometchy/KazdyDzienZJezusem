"2Kor10,1":
  text: "A ja sam, Paweł, proszę was przez łagodność i życzliwość Chrystusa, ja, który, gdy jestem obecny wśród was, jestem pokorny w waszych oczach, lecz gdy jestem nieobecny, jestem śmiały wobec was."
  tags: []
"2Kor10,2":
  text: "A proszę, żebym będąc obecny, nie musiał być śmiały tą pewnością siebie, którą zamierzam być śmiały wobec niektórych, którzy sądzą, że postępujemy według ciała."
  tags: []
"2Kor10,3":
  text: "Chociaż bowiem w ciele żyjemy, nie walczymy według ciała;"
  tags: []
"2Kor10,4":
  text: "(Gdyż oręż naszej walki nie jest cielesny, ale z Boga, i ma moc burzenia twierdz warownych);"
  tags: []
"2Kor10,5":
  text: "Obalamy rozumowania i wszelką wyniosłość, która powstaje przeciwko poznaniu Boga, i zniewalamy wszelką myśl do posłuszeństwa Chrystusowi;"
  tags: []
"2Kor10,6":
  text: "Gotowi do ukarania wszelkiego nieposłuszeństwa, kiedy wasze posłuszeństwo będzie całkowite."
  tags: []
"2Kor10,7":
  text: "Czy patrzycie tylko na to, co jest przed oczami? Jeśli ktoś jest przekonany, że należy do Chrystusa, to niech też weźmie pod uwagę, że jak on należy do Chrystusa, tak do Chrystusa należymy i my."
  tags: []
"2Kor10,8":
  text: "Choćbym się bowiem jeszcze bardziej chełpił z naszej władzy, którą dał nam Pan ku zbudowaniu, a nie ku waszej zgubie, nie będę zawstydzony;"
  tags: []
"2Kor10,9":
  text: "Aby się nie wydawało, że chcę was straszyć listami."
  tags: []
"2Kor10,10":
  text: "Mówią bowiem: Listy ważkie są i mocne, ale gdy się zjawia osobiście, jest słaby, a jego mowa godna pogardy."
  tags: []
"2Kor10,11":
  text: "Kto tak sądzi, niech wie, że jakimi jesteśmy w słowach listów, będąc nieobecni, takimi też będziemy w czynie, gdy będziemy obecni."
  tags: []
"2Kor10,12":
  text: "Nie śmiemy bowiem zaliczać siebie do niektórych ani porównywać się z niektórymi, którzy polecają sami siebie. Nie mają bowiem rozumu, gdyż mierzą się własną miarą i porównują się sami ze sobą."
  tags: []
"2Kor10,13":
  text: "Lecz my nie będziemy się chlubili ponad miarę, ale według miary zasad, które Bóg nam wymierzył, miary, która sięgnęła aż do was."
  tags: []
"2Kor10,14":
  text: "Nie przekraczamy bowiem ponad miarę samych siebie, jakbyśmy nie dotarli aż do was, bo przyszliśmy aż i do was z ewangelią Chrystusa."
  tags: []
"2Kor10,15":
  text: "I nie chlubimy się ponad miarę z pracy innych, ale mamy nadzieję, że gdy wzrośnie w was wasza wiara, i my wzrośniemy obficie wśród was zgodnie z naszymi zasadami;"
  tags: []
"2Kor10,16":
  text: "Żeby głosić ewangelię poza waszymi granicami, nie chlubiąc się na cudzym obszarze tym, czego już inni dokonali."
  tags: []
"2Kor10,17":
  text: "Kto więc się chlubi, w Panu niech się chlubi."
  tags: []
"2Kor10,18":
  text: "Nie ten bowiem, kto sam siebie poleca, jest wypróbowany, lecz ten, kogo poleca Pan."
  tags: []
