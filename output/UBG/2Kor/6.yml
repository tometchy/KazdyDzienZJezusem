"2Kor6,1":
  text: "Jako jego współpracownicy napominamy was, abyście nie przyjmowali łaski Bożej na próżno."
  tags: []
"2Kor6,2":
  text: "(Mówi bowiem Bóg: W czasie pomyślnym wysłuchałem cię, a w dniu zbawienia przyszedłem ci z pomocą. Oto teraz czas pomyślny, oto teraz dzień zbawienia.)"
  tags: []
"2Kor6,3":
  text: "Nie dając nikomu żadnego powodu do zgorszenia, aby nasza posługa nie była zhańbiona;"
  tags: []
"2Kor6,4":
  text: "Ale we wszystkim okazujemy się sługami Boga, w wielkiej cierpliwości, w uciskach, w niedostatkach, w utrapieniach;"
  tags: []
"2Kor6,5":
  text: "W chłostach, w więzieniach, podczas rozruchów, w trudach, w nocnych czuwaniach, w postach;"
  tags: []
"2Kor6,6":
  text: "Przez czystość i poznanie, przez wytrwałość i życzliwość, przez Ducha Świętego i nieobłudną miłość;"
  tags: []
"2Kor6,7":
  text: "Przez słowo prawdy i moc Boga, przez oręż sprawiedliwości na prawo i na lewo;"
  tags: []
"2Kor6,8":
  text: "Przez chwałę i pohańbienie, przez złą i dobrą sławę; jakby zwodziciele, a jednak prawdomówni;"
  tags: []
"2Kor6,9":
  text: "Jakby nieznani, jednak dobrze znani, jakby umierający, a oto żyjemy, jakby karani, ale nie zabici;"
  tags: []
"2Kor6,10":
  text: "Jakby smutni, jednak zawsze radośni, jakby ubodzy, jednak wielu ubogacający, jakby nic nie mający, jednak wszystko posiadający."
  tags: []
"2Kor6,11":
  text: "Nasze usta otworzyły się przed wami, Koryntianie, nasze serce się rozszerzyło."
  tags: []
"2Kor6,12":
  text: "Nie jest wam ciasno w nas, lecz w waszym wnętrzu jest ciasno;"
  tags: []
"2Kor6,13":
  text: "Odwzajemniając się więc nam – jak do moich dzieci mówię – rozszerzcie się i wy."
  tags: []
"2Kor6,14":
  text: "Nie wprzęgajcie się w nierówne jarzmo z niewierzącymi. Cóż bowiem wspólnego ma sprawiedliwość z niesprawiedliwością? Albo jaka jest wspólnota między światłem a ciemnością?"
  tags: []
"2Kor6,15":
  text: "Albo jaka zgoda Chrystusa z Belialem, albo co za dział wierzącego z niewierzącym?"
  tags: []
"2Kor6,16":
  text: "A co za porozumienie między świątynią Boga a bożkami? Wy bowiem jesteście świątynią Boga żywego, tak jak mówi Bóg: Będę w nich mieszkał i będę się przechadzał w nich, i będę ich Bogiem, a oni będą moim ludem."
  tags: []
"2Kor6,17":
  text: "Dlatego wyjdźcie spośród nich i odłączcie się, mówi Pan, i nieczystego nie dotykajcie, a ja was przyjmę."
  tags: []
"2Kor6,18":
  text: "I będę wam Ojcem, a wy będziecie mi synami i córkami – mówi Pan Wszechmogący."
  tags: []
