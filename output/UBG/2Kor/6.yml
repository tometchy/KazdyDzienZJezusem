"2Kor6,1": "Jako jego współpracownicy napominamy was, abyście nie przyjmowali łaski Bożej na próżno."
"2Kor6,2": "(Mówi bowiem Bóg: W czasie pomyślnym wysłuchałem cię, a w dniu zbawienia przyszedłem ci z pomocą. Oto teraz czas pomyślny, oto teraz dzień zbawienia.)"
"2Kor6,3": "Nie dając nikomu żadnego powodu do zgorszenia, aby nasza posługa nie była zhańbiona;"
"2Kor6,4": "Ale we wszystkim okazujemy się sługami Boga, w wielkiej cierpliwości, w uciskach, w niedostatkach, w utrapieniach;"
"2Kor6,5": "W chłostach, w więzieniach, podczas rozruchów, w trudach, w nocnych czuwaniach, w postach;"
"2Kor6,6": "Przez czystość i poznanie, przez wytrwałość i życzliwość, przez Ducha Świętego i nieobłudną miłość;"
"2Kor6,7": "Przez słowo prawdy i moc Boga, przez oręż sprawiedliwości na prawo i na lewo;"
"2Kor6,8": "Przez chwałę i pohańbienie, przez złą i dobrą sławę; jakby zwodziciele, a jednak prawdomówni;"
"2Kor6,9": "Jakby nieznani, jednak dobrze znani, jakby umierający, a oto żyjemy, jakby karani, ale nie zabici;"
"2Kor6,10": "Jakby smutni, jednak zawsze radośni, jakby ubodzy, jednak wielu ubogacający, jakby nic nie mający, jednak wszystko posiadający."
"2Kor6,11": "Nasze usta otworzyły się przed wami, Koryntianie, nasze serce się rozszerzyło."
"2Kor6,12": "Nie jest wam ciasno w nas, lecz w waszym wnętrzu jest ciasno;"
"2Kor6,13": "Odwzajemniając się więc nam – jak do moich dzieci mówię – rozszerzcie się i wy."
"2Kor6,14": "Nie wprzęgajcie się w nierówne jarzmo z niewierzącymi. Cóż bowiem wspólnego ma sprawiedliwość z niesprawiedliwością? Albo jaka jest wspólnota między światłem a ciemnością?"
"2Kor6,15": "Albo jaka zgoda Chrystusa z Belialem, albo co za dział wierzącego z niewierzącym?"
"2Kor6,16": "A co za porozumienie między świątynią Boga a bożkami? Wy bowiem jesteście świątynią Boga żywego, tak jak mówi Bóg: Będę w nich mieszkał i będę się przechadzał w nich, i będę ich Bogiem, a oni będą moim ludem."
"2Kor6,17": "Dlatego wyjdźcie spośród nich i odłączcie się, mówi Pan, i nieczystego nie dotykajcie, a ja was przyjmę."
"2Kor6,18": "I będę wam Ojcem, a wy będziecie mi synami i córkami – mówi Pan Wszechmogący."
