"2Kor3,1":
  text: "Czy znowu zaczynamy polecać samych siebie? Albo czy potrzebujemy, jak niektórzy, listów polecających do was albo od was?"
  tags: []
"2Kor3,2":
  text: "Naszym listem wy jesteście, napisanym w naszych sercach, znanym i czytanym przez wszystkich ludzi."
  tags: []
"2Kor3,3":
  text: "Gdyż wiadomo, że jesteście listem Chrystusowym sporządzonym przez nasze posługiwanie, napisanym nie atramentem, lecz Duchem Boga żywego, nie na tablicach kamiennych, lecz na żywych tablicach serc."
  tags: []
"2Kor3,4":
  text: "A taką ufność mamy przez Chrystusa ku Bogu."
  tags: []
"2Kor3,5":
  text: "Nie żebyśmy sami z siebie byli w stanie pomyśleć coś jakby z samych siebie, lecz nasza możność jest z Boga."
  tags: []
"2Kor3,6":
  text: "On też uczynił nas zdolnymi sługami nowego testamentu, nie litery, ale Ducha; litera bowiem zabija, Duch zaś ożywia."
  tags: []
"2Kor3,7":
  text: "Lecz jeśli posługiwanie śmierci, wyryte literami na kamieniach, było pełne chwały, tak że synowie Izraela nie mogli wpatrywać się w oblicze Mojżesza z powodu chwały jego oblicza, która miała przeminąć;"
  tags: []
"2Kor3,8":
  text: "To o ileż bardziej pełne chwały nie miałoby być posługiwanie Ducha?"
  tags: []
"2Kor3,9":
  text: "Jeśli bowiem posługiwanie potępienia było pełne chwały, o ileż bardziej obfituje w chwałę posługiwanie sprawiedliwości."
  tags: []
"2Kor3,10":
  text: "To bowiem, co miało chwałę, nie miało chwały w porównaniu z tą przewyższającą chwałą."
  tags: []
"2Kor3,11":
  text: "Jeśli zaś to, co przemija, było pełne chwały, tym bardziej pełne chwały jest to, co trwa."
  tags: []
"2Kor3,12":
  text: "Mając więc taką nadzieję, z całą otwartością mówimy;"
  tags: []
"2Kor3,13":
  text: "A nie jak Mojżesz, który kładł sobie na twarz zasłonę, aby synowie Izraela nie wpatrywali się w koniec tego, co miało przeminąć."
  tags: []
"2Kor3,14":
  text: "Lecz ich umysły zostały zaślepione; aż do dziś bowiem przy czytaniu Starego Testamentu ta sama zasłona pozostaje nieodsłonięta, gdyż jest usuwana w Chrystusie."
  tags: []
"2Kor3,15":
  text: "I aż do dziś, gdy Mojżesz jest czytany, zasłona leży na ich sercu."
  tags: []
"2Kor3,16":
  text: "Gdy jednak nawrócą się do Pana, zasłona zostanie zdjęta."
  tags: []
"2Kor3,17":
  text: "Pan zaś jest tym Duchem, a gdzie jest Duch Pana, tam i wolność."
  tags: []
"2Kor3,18":
  text: "Lecz my wszyscy, którzy z odsłoniętą twarzą patrzymy na chwałę Pana, jakby w zwierciadle, zostajemy przemienieni w ten sam obraz, z chwały w chwałę, za sprawą Ducha Pana."
  tags: []
