"2Kor12,1":
  text: "Wprawdzie nie jest dla mnie pożyteczne chlubić się, to jednak przejdę do widzeń i objawień Pańskich."
  tags: []
"2Kor12,2":
  text: "Znam człowieka w Chrystusie, który przed czternastu laty – czy w ciele, nie wiem, czy poza ciałem, nie wiem, Bóg wie – został porwany aż do trzeciego nieba."
  tags: []
"2Kor12,3":
  text: "I znam takiego człowieka – czy w ciele, czy poza ciałem, nie wiem, Bóg wie;"
  tags: []
"2Kor12,4":
  text: "Który został porwany do raju i słyszał niewypowiedziane słowa, których człowiekowi nie wolno mówić."
  tags: []
"2Kor12,5":
  text: "Z takiego człowieka będę się chlubić, a z samego siebie nie będę się chlubił, chyba że z moich słabości."
  tags: []
"2Kor12,6":
  text: "Gdybym bowiem chciał się chlubić, nie byłbym głupi, bo powiedziałbym prawdę. Powstrzymuję się jednak, aby ktoś nie myślał o mnie ponad to, jakim mnie widzi albo co ode mnie słyszy."
  tags: []
"2Kor12,7":
  text: "A żebym zbytnio nie wynosił się ogromem objawień, dany mi został cierń dla ciała, wysłannik szatana, aby mnie policzkował, żebym się ponad miarę nie wynosił."
  tags: []
"2Kor12,8":
  text: "Dlatego trzy razy prosiłem Pana, aby on odstąpił ode mnie."
  tags: []
"2Kor12,9":
  text: "Lecz powiedział mi: Wystarczy ci moja łaska. Moja moc bowiem doskonali się w słabości. Najchętniej więc będę się chlubił z moich słabości, aby zamieszkała we mnie moc Chrystusa."
  tags: []
"2Kor12,10":
  text: "Dlatego mam upodobanie w słabościach, w zniewagach, w niedostatkach, w prześladowaniach, w uciskach ze względu na Chrystusa; gdy bowiem jestem słaby, wtedy jestem mocny."
  tags: []
"2Kor12,11":
  text: "Stałem się głupi, chlubiąc się; wy mnie do tego zmusiliście. Ja bowiem przez was powinienem być polecany, ponieważ nie byłem mniejszy niż ci wielcy apostołowie, chociaż jestem niczym."
  tags: []
"2Kor12,12":
  text: "Jednak znaki apostoła okazały się wśród was we wszelkiej cierpliwości, w znakach, cudach i przejawach mocy."
  tags: []
"2Kor12,13":
  text: "W czym bowiem jesteście gorsi od innych kościołów, jeśli nie w tym tylko, że ja sam nie byłem dla was ciężarem? Wybaczcie mi tę krzywdę."
  tags: []
"2Kor12,14":
  text: "Oto po raz trzeci jestem gotów przybyć do was i nie będę dla was ciężarem. Nie szukam bowiem tego, co wasze, ale was samych, ponieważ nie dzieci rodzicom powinny gromadzić skarby, ale rodzice dzieciom."
  tags: []
"2Kor12,15":
  text: "Lecz ja bardzo chętnie poniosę wydatki i samego siebie wydam za wasze dusze, chociaż im bardziej was miłuję, tym mniej jestem przez was miłowany."
  tags: []
"2Kor12,16":
  text: "Ale niech i tak będzie; nie byłem dla was ciężarem, ale będąc przebiegły, zdobyłem was podstępem."
  tags: []
"2Kor12,17":
  text: "Czy wyzyskałem was przez kogoś z tych, których do was posłałem?"
  tags: []
"2Kor12,18":
  text: "Uprosiłem Tytusa i wysłałem z nim brata. Czy Tytus was wyzyskał? Czy nie postępowaliśmy w tym samym duchu? Czy nie kroczyliśmy tymi samymi śladami?"
  tags: []
"2Kor12,19":
  text: "Znowu sądzicie, że się przed wami usprawiedliwiamy? W obliczu Boga w Chrystusie mówimy, a to wszystko, najmilsi, dla waszego zbudowania."
  tags: []
"2Kor12,20":
  text: "Obawiam się bowiem, żebym przypadkiem, gdy przyjdę, nie zastał was takimi, jakimi nie chciałbym was zastać, i żebyście wy nie zastali mnie takim, jakim nie chcielibyście; żeby przypadkiem nie było wśród was sporów, zazdrości, gniewu, kłótni, obmów, szemrania, wynoszenia się i zamieszań;"
  tags: []
"2Kor12,21":
  text: "Żeby, gdy znowu przyjdę, mój Bóg nie poniżył mnie wobec was i musiałbym opłakiwać wielu tych, którzy przedtem grzeszyli i nie pokutowali z nieczystości, nierządu i rozpusty, których się dopuścili."
  tags: []
