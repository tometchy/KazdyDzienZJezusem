"2Kor12,1": "Wprawdzie nie jest dla mnie pożyteczne chlubić się, to jednak przejdę do widzeń i objawień Pańskich."
"2Kor12,2": "Znam człowieka w Chrystusie, który przed czternastu laty – czy w ciele, nie wiem, czy poza ciałem, nie wiem, Bóg wie – został porwany aż do trzeciego nieba."
"2Kor12,3": "I znam takiego człowieka – czy w ciele, czy poza ciałem, nie wiem, Bóg wie;"
"2Kor12,4": "Który został porwany do raju i słyszał niewypowiedziane słowa, których człowiekowi nie wolno mówić."
"2Kor12,5": "Z takiego człowieka będę się chlubić, a z samego siebie nie będę się chlubił, chyba że z moich słabości."
"2Kor12,6": "Gdybym bowiem chciał się chlubić, nie byłbym głupi, bo powiedziałbym prawdę. Powstrzymuję się jednak, aby ktoś nie myślał o mnie ponad to, jakim mnie widzi albo co ode mnie słyszy."
"2Kor12,7": "A żebym zbytnio nie wynosił się ogromem objawień, dany mi został cierń dla ciała, wysłannik szatana, aby mnie policzkował, żebym się ponad miarę nie wynosił."
"2Kor12,8": "Dlatego trzy razy prosiłem Pana, aby on odstąpił ode mnie."
"2Kor12,9": "Lecz powiedział mi: Wystarczy ci moja łaska. Moja moc bowiem doskonali się w słabości. Najchętniej więc będę się chlubił z moich słabości, aby zamieszkała we mnie moc Chrystusa."
"2Kor12,10": "Dlatego mam upodobanie w słabościach, w zniewagach, w niedostatkach, w prześladowaniach, w uciskach ze względu na Chrystusa; gdy bowiem jestem słaby, wtedy jestem mocny."
"2Kor12,11": "Stałem się głupi, chlubiąc się; wy mnie do tego zmusiliście. Ja bowiem przez was powinienem być polecany, ponieważ nie byłem mniejszy niż ci wielcy apostołowie, chociaż jestem niczym."
"2Kor12,12": "Jednak znaki apostoła okazały się wśród was we wszelkiej cierpliwości, w znakach, cudach i przejawach mocy."
"2Kor12,13": "W czym bowiem jesteście gorsi od innych kościołów, jeśli nie w tym tylko, że ja sam nie byłem dla was ciężarem? Wybaczcie mi tę krzywdę."
"2Kor12,14": "Oto po raz trzeci jestem gotów przybyć do was i nie będę dla was ciężarem. Nie szukam bowiem tego, co wasze, ale was samych, ponieważ nie dzieci rodzicom powinny gromadzić skarby, ale rodzice dzieciom."
"2Kor12,15": "Lecz ja bardzo chętnie poniosę wydatki i samego siebie wydam za wasze dusze, chociaż im bardziej was miłuję, tym mniej jestem przez was miłowany."
"2Kor12,16": "Ale niech i tak będzie; nie byłem dla was ciężarem, ale będąc przebiegły, zdobyłem was podstępem."
"2Kor12,17": "Czy wyzyskałem was przez kogoś z tych, których do was posłałem?"
"2Kor12,18": "Uprosiłem Tytusa i wysłałem z nim brata. Czy Tytus was wyzyskał? Czy nie postępowaliśmy w tym samym duchu? Czy nie kroczyliśmy tymi samymi śladami?"
"2Kor12,19": "Znowu sądzicie, że się przed wami usprawiedliwiamy? W obliczu Boga w Chrystusie mówimy, a to wszystko, najmilsi, dla waszego zbudowania."
"2Kor12,20": "Obawiam się bowiem, żebym przypadkiem, gdy przyjdę, nie zastał was takimi, jakimi nie chciałbym was zastać, i żebyście wy nie zastali mnie takim, jakim nie chcielibyście; żeby przypadkiem nie było wśród was sporów, zazdrości, gniewu, kłótni, obmów, szemrania, wynoszenia się i zamieszań;"
"2Kor12,21": "Żeby, gdy znowu przyjdę, mój Bóg nie poniżył mnie wobec was i musiałbym opłakiwać wielu tych, którzy przedtem grzeszyli i nie pokutowali z nieczystości, nierządu i rozpusty, których się dopuścili."
