"Za11,1":
  text: "Otwórz swe wrota, Libanie, niech ogień strawi twoje cedry."
  tags: []
"Za11,2":
  text: "Zawódź, jodło, bo upadł cedr, bo wielcy są spustoszeni. Zawódźcie, dęby Baszanu, bo niedostępny las został wycięty."
  tags: []
"Za11,3":
  text: "Słychać głos narzekania pasterzy, bo ich wspaniałość została zburzona; słychać głos ryku lwiąt, bo pycha Jordanu jest zburzona."
  tags: []
"Za11,4":
  text: "Tak mówi PAN, mój Bóg: Paś owce przeznaczone na rzeź;"
  tags: []
"Za11,5":
  text: "Które kupcy zabijają, a nie czują się winni, a sprzedający je mówią: Błogosławiony PAN, że się wzbogaciłem. A ich pasterze nie mają dla nich litości."
  tags: []
"Za11,6":
  text: "Dlatego już nie będę miał litości dla mieszkańców tej ziemi, mówi PAN. Oto wydam tych ludzi, każdego z nich, w ręce jego bliźniego i w ręce jego króla. I zniszczą ziemię, a nikogo nie wyrwę z ich rąk."
  tags: []
"Za11,7":
  text: "Będę więc pasł owce przeznaczone na rzeź, was, mówię, biedne owce! Wziąłem sobie dwie laski, jedną nazwałem Piękno, a drugą nazwałem Więzy, i pasłem te owce."
  tags: []
"Za11,8":
  text: "Zgładziłem trzech pasterzy w jednym miesiącu; i moja dusza czuła niechęć do nich, a ich dusza też brzydziła się mną."
  tags: []
"Za11,9":
  text: "Wtedy powiedziałem: Nie będę was pasł. Co umiera, niech umrze, a co ma być zgładzone, niech będzie zgładzone, a ci, co pozostaną, niech każdy pożera ciało drugiego."
  tags: []
"Za11,10":
  text: "Wziąłem więc swoją laskę, Piękno, i złamałem ją, aby zerwać swoje przymierze, które zawarłem z całym ludem."
  tags: []
"Za11,11":
  text: "I zostało zerwane w tym dniu, a biedni spośród trzody, którzy przyglądali się mnie, poznali, że to słowo PANA."
  tags: []
"Za11,12":
  text: "Potem powiedziałem do nich: Jeśli to jest dobre w waszych oczach, dajcie mi moją zapłatę, a jeśli nie, zaniechajcie jej. Odważyli więc moją zapłatę: trzydzieści srebrników."
  tags: []
"Za11,13":
  text: "Potem PAN powiedział do mnie: Rzuć je przed garncarza. Wspaniała to zapłata, na jaką mnie tak drogo oszacowali! Wziąłem więc trzydzieści srebrników i rzuciłem je przed garncarza w domu PANA."
  tags: []
"Za11,14":
  text: "Potem złamałem swoją drugą laskę, Więzy, aby zerwać braterstwo między Judą a Izraelem."
  tags: []
"Za11,15":
  text: "I PAN powiedział do mnie: Weź sobie jeszcze narzędzie głupiego pasterza."
  tags: []
"Za11,16":
  text: "Oto bowiem wzbudzę pasterza w tej ziemi, który nie będzie troszczył się o zaginione, nie będzie szukał jagniątek, nie będzie leczyć okaleczonych i tego, co stoi, nie będzie karmił. Ale będzie jeść mięso tucznych, a ich kopyta oberwie."
  tags: []
"Za11,17":
  text: "Biada pasterzowi nieużytecznemu, który opuszcza trzodę! Niech spadnie miecz na jego ramię i na jego prawe oko. Jego ramię całkiem uschnie, a jego prawe oko całkiem oślepnie."
  tags: []
