"Za2,1":
  text: "Potem znowu podniosłem swoje oczy i spojrzałem, a oto mężczyzna, w którego ręce był sznur mierniczy."
  tags: []
"Za2,2":
  text: "I zapytałem: Dokąd idziesz? Odpowiedział mi: Idę zmierzyć Jerozolimę, by zobaczyć, jaka jest jej szerokość i jaka jej długość."
  tags: []
"Za2,3":
  text: "A oto gdy Anioł, który rozmawiał ze mną, odchodził, inny anioł wyszedł mu naprzeciw."
  tags: []
"Za2,4":
  text: "I powiedział do niego: Biegnij i powiedz temu młodzieńcowi: Jerozolima będzie zamieszkana jak miasta bez murów ze względu na mnóstwo ludu i bydła w niej."
  tags: []
"Za2,5":
  text: "A ja, mówi PAN, będę dla niej murem ognistym dokoła i będę chwałą pośród niej."
  tags: []
"Za2,6":
  text: "Hej, hej! Uciekajcie z ziemi północnej, mówi PAN, ponieważ rozproszyłem was na cztery strony świata, mówi PAN."
  tags: []
"Za2,7":
  text: "Ratuj się, o Syjonie, który mieszkasz u córki Babilonu."
  tags: []
"Za2,8":
  text: "Tak bowiem mówi PAN zastępów – posłał mnie na chwałę do tych narodów, które was ograbiły, bo kto was dotyka, dotyka źrenicy jego oka;"
  tags: []
"Za2,9":
  text: "Oto podniosę swoją rękę przeciwko nim i staną się łupem dla swoich sług. I poznacie, że PAN zastępów mnie posłał."
  tags: []
"Za2,10":
  text: "Zaśpiewaj i raduj się, córko Syjonu, bo oto przyjdę i zamieszkam pośród ciebie, mówi PAN."
  tags: []
"Za2,11":
  text: "Wiele narodów przyłączy się w tym dniu do PANA i będą moim ludem, a ja zamieszkam pośród ciebie i poznasz, że PAN zastępów posłał mnie do ciebie."
  tags: []
"Za2,12":
  text: "Wtedy PAN weźmie Judę w posiadanie jako swój dział w ziemi świętej i znowu wybierze Jerozolimę."
  tags: []
"Za2,13":
  text: "Niech umilknie wszelkie ciało przed PANEM. On bowiem powstał ze swego świętego przybytku."
  tags: []
