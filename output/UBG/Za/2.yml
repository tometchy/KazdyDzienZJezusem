"Za2,1": "Potem znowu podniosłem swoje oczy i spojrzałem, a oto mężczyzna, w którego ręce był sznur mierniczy."
"Za2,2": "I zapytałem: Dokąd idziesz? Odpowiedział mi: Idę zmierzyć Jerozolimę, by zobaczyć, jaka jest jej szerokość i jaka jej długość."
"Za2,3": "A oto gdy Anioł, który rozmawiał ze mną, odchodził, inny anioł wyszedł mu naprzeciw."
"Za2,4": "I powiedział do niego: Biegnij i powiedz temu młodzieńcowi: Jerozolima będzie zamieszkana jak miasta bez murów ze względu na mnóstwo ludu i bydła w niej."
"Za2,5": "A ja, mówi PAN, będę dla niej murem ognistym dokoła i będę chwałą pośród niej."
"Za2,6": "Hej, hej! Uciekajcie z ziemi północnej, mówi PAN, ponieważ rozproszyłem was na cztery strony świata, mówi PAN."
"Za2,7": "Ratuj się, o Syjonie, który mieszkasz u córki Babilonu."
"Za2,8": "Tak bowiem mówi PAN zastępów – posłał mnie na chwałę do tych narodów, które was ograbiły, bo kto was dotyka, dotyka źrenicy jego oka;"
"Za2,9": "Oto podniosę swoją rękę przeciwko nim i staną się łupem dla swoich sług. I poznacie, że PAN zastępów mnie posłał."
"Za2,10": "Zaśpiewaj i raduj się, córko Syjonu, bo oto przyjdę i zamieszkam pośród ciebie, mówi PAN."
"Za2,11": "Wiele narodów przyłączy się w tym dniu do PANA i będą moim ludem, a ja zamieszkam pośród ciebie i poznasz, że PAN zastępów posłał mnie do ciebie."
"Za2,12": "Wtedy PAN weźmie Judę w posiadanie jako swój dział w ziemi świętej i znowu wybierze Jerozolimę."
"Za2,13": "Niech umilknie wszelkie ciało przed PANEM. On bowiem powstał ze swego świętego przybytku."
