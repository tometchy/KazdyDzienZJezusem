"Za12,1":
  text: "Brzemię słowa PANA nad Izraelem. Tak mówi PAN, który rozpostarł niebiosa, założył fundamenty ziemi i stwarza ducha człowieka w jego wnętrzu:"
  tags: []
"Za12,2":
  text: "Oto uczynię Jerozolimę kielichem odurzenia dla wszystkich okolicznych narodów, gdy nastanie oblężenie przeciwko Judzie i przeciwko Jerozolimie."
  tags: []
"Za12,3":
  text: "W tym dniu uczynię Jerozolimę ciężkim kamieniem dla wszystkich narodów. Wszyscy, którzy będą go dźwigać, bardzo się zranią, choćby się zgromadziły przeciwko niemu wszystkie narody ziemi."
  tags: []
"Za12,4":
  text: "Tego dnia, mówi PAN, każdego konia porażę trwogą i jego jeźdźca – szaleństwem; ale nad domem Judy otworzę swoje oczy, a każdego konia narodów porażę ślepotą."
  tags: []
"Za12,5":
  text: "I przywódcy Judy powiedzą w swoim sercu: Mieszkańcy Jerozolimy będą naszą siłą w PANU zastępów, swoim Bogu."
  tags: []
"Za12,6":
  text: "W tym dniu uczynię przywódców Judy jak węgle ogniste wśród drwa i jak płonącą pochodnię pośród snopów; i pożrą wszystkie okoliczne narody na prawo i na lewo. I Jerozolima pozostanie na swoim miejscu, w Jerozolimie."
  tags: []
"Za12,7":
  text: "I najpierw PAN wybawi namioty Judy, aby chwała domu Dawida i chwała mieszkańców Jerozolimy nie wywyższały się przeciwko Judzie."
  tags: []
"Za12,8":
  text: "W tym dniu PAN będzie bronił mieszkańców Jerozolimy, a najsłabszy pośród nich stanie się tego dnia podobny do Dawida, a dom Dawida podobny do Boga, podobny do Anioła PANA na ich czele."
  tags: []
"Za12,9":
  text: "I stanie się w tym dniu, że będę zmierzać do zniszczenia wszystkich narodów, które wyruszą przeciwko Jerozolimie."
  tags: []
"Za12,10":
  text: "I wyleję na dom Dawida i na mieszkańców Jerozolimy ducha łaski i modlitwy. Będą patrzyć na mnie, którego przebili, i będą go opłakiwać, jak się opłakuje jedynaka; będą gorzko płakać nad nim, jak się płacze gorzko nad pierworodnym."
  tags: []
"Za12,11":
  text: "W tym dniu będzie wielki lament w Jerozolimie, jak lament w Hadad-Rimmon na równinie Megiddo."
  tags: []
"Za12,12":
  text: "Ziemia będzie lamentować, każdy ród osobno: ród domu Dawida osobno i jego kobiety osobno; ród domu Natana osobno i jego kobiety osobno;"
  tags: []
"Za12,13":
  text: "Ród domu Lewiego osobno i jego kobiety osobno; ród Szimejego osobno i jego kobiety osobno;"
  tags: []
"Za12,14":
  text: "Wszystkie pozostałe rody, każdy ród osobno i ich kobiety osobno."
  tags: []
