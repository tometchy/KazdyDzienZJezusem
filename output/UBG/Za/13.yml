"Za13,1":
  text: "W tym dniu zostanie otwarte źródło dla domu Dawida i mieszkańców Jerozolimy dla obmycia grzechu i nieczystości."
  tags: []
"Za13,2":
  text: "I stanie się w tym dniu, mówi PAN zastępów, że wykorzenię imiona bożków z ziemi, tak że nie będą więcej wspominane. Usunę z ziemi także proroków i ducha nieczystego."
  tags: []
"Za13,3":
  text: "A gdyby ktoś jeszcze prorokował, jego ojciec i matka, którzy go zrodzili, powiedzą mu: Nie będziesz żył, gdyż mówiłeś kłamstwo w imię PANA. I jego ojciec, i matka, którzy go zrodzili, przebiją go za to, że prorokował."
  tags: []
"Za13,4":
  text: "I stanie się w tym dniu, że każdy z tych proroków zawstydzi się z powodu swojego widzenia, gdy prorokował, i nie oblecze się w kosmatą szatę, aby kłamać."
  tags: []
"Za13,5":
  text: "Ale każdy powie: Nie jestem prorokiem, ale rolnikiem, bo tego mnie uczono od dzieciństwa."
  tags: []
"Za13,6":
  text: "A jeśli ktoś go zapyta: Co to za rany na twoich rękach? Wtedy powie: Zostałem zraniony w domu moich przyjaciół."
  tags: []
"Za13,7":
  text: "Mieczu, ocknij się przeciwko mojemu pasterzowi i przeciwko mężczyźnie, który jest moim towarzyszem, mówi PAN zastępów. Uderz pasterza, a owce zostaną rozproszone. Ja zaś zwrócę swoją rękę ku malutkim."
  tags: []
"Za13,8":
  text: "I stanie się na całej ziemi, mówi PAN, że dwie części w niej zostaną wycięte i zginą, a trzecia część pozostanie w niej."
  tags: []
"Za13,9":
  text: "I przeprowadzę tę trzecią część przez ogień i oczyszczę ich jak się czyści srebro, wypróbuję ich, jak się próbuje złoto. Będą wzywali mego imienia, a ja ich wysłucham. Powiem: Ty jesteś moim ludem, a on powie: PAN jest moim Bogiem."
  tags: []
