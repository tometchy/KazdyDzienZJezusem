"Za14,1":
  text: "Oto przychodzi dzień PANA, a twój łup będzie rozdzielony pośród ciebie."
  tags: []
"Za14,2":
  text: "Zgromadzę bowiem do bitwy wszystkie narody przeciwko Jerozolimie, a miasto zostanie zdobyte, domy splądrowane i kobiety zgwałcone. Połowa miasta pójdzie do niewoli, a resztka ludu nie będzie wygnana z miasta."
  tags: []
"Za14,3":
  text: "Wtedy PAN wyruszy i będzie walczył przeciwko tym narodom, tak jak wtedy, gdy walczył w dniu bitwy."
  tags: []
"Za14,4":
  text: "I jego nogi staną w tym dniu na Górze Oliwnej, która leży naprzeciw Jerozolimy od strony wschodniej, a Góra Oliwna rozpadnie się na pół, na wschód i na zachód, tworząc wielką dolinę; i połowa tej góry cofnie się na północ, a połowa jej – na południe."
  tags: []
"Za14,5":
  text: "Wtedy będziecie uciekać do doliny tych gór, bo dolina tych gór będzie sięgać aż do Azal. Będziecie uciekać, jak uciekaliście przed trzęsieniem ziemi za dni Uzjasza, króla Judy. Potem przyjdzie PAN, mój Bóg, a z nim wszyscy święci."
  tags: []
"Za14,6":
  text: "A w tym dniu nie będzie wspaniałej światłości ani gęstej ciemności;"
  tags: []
"Za14,7":
  text: "Lecz będzie to jeden dzień, który jest znany tylko PANU, nie będzie to dzień ani noc. A o wieczornej porze nastanie światło."
  tags: []
"Za14,8":
  text: "W tym dniu wyjdą wody żywe z Jerozolimy; połowa ich do morza wschodniego, a połowa – do morza zachodniego. Będzie to w lecie i w zimie."
  tags: []
"Za14,9":
  text: "A PAN będzie królem nad całą ziemią. W tym dniu jeden będzie PAN i jedno jego imię."
  tags: []
"Za14,10":
  text: "Cała ziemia zamieni się w równinę od Geba aż do Rimmon, na południe od Jerozolimy. Będzie wywyższona i zamieszkana na swoim miejscu, od Bramy Beniamina aż do miejsca dawnej bramy i aż do Bramy Narożnej i od Wieży Chananeela aż do tłoczni królewskich."
  tags: []
"Za14,11":
  text: "I będą w niej mieszkać, a nie będzie już przekleństwem. Jerozolima będzie zamieszkiwać w pokoju."
  tags: []
"Za14,12":
  text: "A taka będzie plaga, którą PAN dotknie wszystkie narody, które walczyły przeciwko Jerozolimie: Ich ciała będą się rozkładać, gdy jeszcze będą stać na nogach, ich oczy będą gnić w oczodołach i ich język zgnije w ustach."
  tags: []
"Za14,13":
  text: "W tym dniu będzie wśród nich wielkie zamieszanie od PANA, tak że jeden uchwyci rękę drugiego, a jego ręka podniesie się na rękę swego bliźniego."
  tags: []
"Za14,14":
  text: "Juda także będzie walczyć w Jerozolimie, a bogactwa wszystkich narodów okolicznych będą zgromadzone: złoto, srebro i szaty w wielkiej ilości."
  tags: []
"Za14,15":
  text: "A taka sama plaga jak tamta dotknie konie, muły, wielbłądy, osły oraz wszystkie zwierzęta, które będą w tym obozie."
  tags: []
"Za14,16":
  text: "Wszyscy pozostali spośród wszystkich narodów, które wyruszyły przeciwko Jerozolimie, będą przychodzić od roku do roku, by oddawać pokłon Królowi, PANU zastępów, i obchodzić Święto Namiotów;"
  tags: []
"Za14,17":
  text: "A jeśli ktoś spośród rodów ziemi nie pójdzie do Jerozolimy, by oddawać pokłon Królowi, PANU zastępów, na tego nie będzie padać deszcz."
  tags: []
"Za14,18":
  text: "A jeśli ród Egiptu nie wyruszy i nie przyjdzie, choć na niego deszcz nie pada, spadnie jednak na niego ta plaga, którą PAN dotknie narody, które nie przyjdą, by obchodzić Święto Namiotów."
  tags: []
"Za14,19":
  text: "Taka będzie kara dla Egiptu i kara dla wszystkich narodów, które nie przychodzą na obchody Święta Namiotów."
  tags: []
"Za14,20":
  text: "W tym dniu na dzwoneczkach koni będzie taki napis: Świętość PANU; a kotłów w domu PANA będzie jak czasz przed ołtarzem."
  tags: []
"Za14,21":
  text: "Każdy kocioł w Jerozolimie i Judzie będzie poświęcony PANU zastępów. Wszyscy, którzy składają ofiary, przyjdą i będą je brali, i będą w nich gotowali. W tym dniu nie będzie już Kananejczyka w domu PANA zastępów."
  tags: []
