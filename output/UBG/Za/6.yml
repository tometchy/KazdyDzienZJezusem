"Za6,1":
  text: "Potem odwróciłem się, podniosłem swoje oczy i spojrzałem, a oto cztery rydwany wychodziły spomiędzy dwóch gór, a te góry były z miedzi."
  tags: []
"Za6,2":
  text: "Przy pierwszym rydwanie były konie rude, przy drugim rydwanie – konie kare;"
  tags: []
"Za6,3":
  text: "Przy trzecim rydwanie – konie białe, a przy czwartym rydwanie były konie pstrokate i gniade."
  tags: []
"Za6,4":
  text: "Wtedy zapytałem Anioła, który rozmawiał ze mną: Co to jest, mój Panie?"
  tags: []
"Za6,5":
  text: "I Anioł odpowiedział mi: To są cztery duchy nieba, wyruszają one z miejsca, gdzie stały przed Panem całej ziemi."
  tags: []
"Za6,6":
  text: "Zaprzężone konie kare wyruszają do ziemi północnej, białe wyruszają za nimi, pstrokate zaś wyruszają do ziemi południowej."
  tags: []
"Za6,7":
  text: "A te gniade konie wyruszyły, rwały się do biegu, aby obejść ziemię. Wtedy powiedział: Idźcie i obejdźcie ziemię! I obeszły ziemię."
  tags: []
"Za6,8":
  text: "Potem zawołał mnie i powiedział: Oto te, które wyruszyły do ziemi północnej, uspokoiły mojego ducha w ziemi północnej."
  tags: []
"Za6,9":
  text: "I doszło do mnie słowo PANA mówiące:"
  tags: []
"Za6,10":
  text: "Weź dary od tych, co byli w niewoli: od Cheldaja, od Tobiasza i od Jedajasza, którzy przybyli z Babilonu, i przyjdź w tym samym dniu, i wejdź do domu Jozjasza, syna Sofoniasza;"
  tags: []
"Za6,11":
  text: "Weź srebro i złoto, zrób korony i włóż je na głowę Jozuego, syna Josadaka, najwyższego kapłana."
  tags: []
"Za6,12":
  text: "I powiedz do niego: Tak mówi PAN zastępów: Oto mąż, którego imię brzmi Latorośl; on wyrośnie ze swego miejsca i zbuduje świątynię PANA."
  tags: []
"Za6,13":
  text: "On zbuduje świątynię PANA, będzie obdarzony chwałą, zasiądzie na swoim tronie i będzie panować na nim, i będzie on kapłanem na swoim tronie; i rada pokoju będzie między nimi oboma."
  tags: []
"Za6,14":
  text: "A te korony będą dla Chelema, Tobiasza, Jedajasza i Chena, syna Sofoniasza, jako pamiątka w świątyni PANA."
  tags: []
"Za6,15":
  text: "Przyjdą ludzie z dalekich stron i będą budować świątynię PANA, i poznacie, że PAN zastępów posłał mnie do was. A to się stanie, jeśli pilnie będziecie słuchać głosu PANA, swego Boga."
  tags: []
