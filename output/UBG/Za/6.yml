"Za6,1": "Potem odwróciłem się, podniosłem swoje oczy i spojrzałem, a oto cztery rydwany wychodziły spomiędzy dwóch gór, a te góry były z miedzi."
"Za6,2": "Przy pierwszym rydwanie były konie rude, przy drugim rydwanie – konie kare;"
"Za6,3": "Przy trzecim rydwanie – konie białe, a przy czwartym rydwanie były konie pstrokate i gniade."
"Za6,4": "Wtedy zapytałem Anioła, który rozmawiał ze mną: Co to jest, mój Panie?"
"Za6,5": "I Anioł odpowiedział mi: To są cztery duchy nieba, wyruszają one z miejsca, gdzie stały przed Panem całej ziemi."
"Za6,6": "Zaprzężone konie kare wyruszają do ziemi północnej, białe wyruszają za nimi, pstrokate zaś wyruszają do ziemi południowej."
"Za6,7": "A te gniade konie wyruszyły, rwały się do biegu, aby obejść ziemię. Wtedy powiedział: Idźcie i obejdźcie ziemię! I obeszły ziemię."
"Za6,8": "Potem zawołał mnie i powiedział: Oto te, które wyruszyły do ziemi północnej, uspokoiły mojego ducha w ziemi północnej."
"Za6,9": "I doszło do mnie słowo PANA mówiące:"
"Za6,10": "Weź dary od tych, co byli w niewoli: od Cheldaja, od Tobiasza i od Jedajasza, którzy przybyli z Babilonu, i przyjdź w tym samym dniu, i wejdź do domu Jozjasza, syna Sofoniasza;"
"Za6,11": "Weź srebro i złoto, zrób korony i włóż je na głowę Jozuego, syna Josadaka, najwyższego kapłana."
"Za6,12": "I powiedz do niego: Tak mówi PAN zastępów: Oto mąż, którego imię brzmi Latorośl; on wyrośnie ze swego miejsca i zbuduje świątynię PANA."
"Za6,13": "On zbuduje świątynię PANA, będzie obdarzony chwałą, zasiądzie na swoim tronie i będzie panować na nim, i będzie on kapłanem na swoim tronie; i rada pokoju będzie między nimi oboma."
"Za6,14": "A te korony będą dla Chelema, Tobiasza, Jedajasza i Chena, syna Sofoniasza, jako pamiątka w świątyni PANA."
"Za6,15": "Przyjdą ludzie z dalekich stron i będą budować świątynię PANA, i poznacie, że PAN zastępów posłał mnie do was. A to się stanie, jeśli pilnie będziecie słuchać głosu PANA, swego Boga."
