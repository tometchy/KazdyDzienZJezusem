"Za7,1": "W czwartym roku króla Dariusza słowo PANA doszło do Zachariasza, czwartego dnia dziewiątego miesiąca, to jest w miesiącu Kislew;"
"Za7,2": "Gdy lud posłał do domu Bożego Saresera i Regem-Meleka z ich ludźmi, aby się modlili przed PANEM;"
"Za7,3": "I aby zapytali kapłanów, którzy byli w domu PANA zastępów, a także proroków: Czy w piątym miesiącu mam jeszcze płakać, poświęcając się, jak to już czyniłem przez tyle lat?"
"Za7,4": "Doszło do mnie słowo PANA zastępów mówiące:"
"Za7,5": "Powiedz do całego ludu tej ziemi i do kapłanów: Gdy pościliście i płakaliście w piątym i siódmym miesiącu przez te siedemdziesiąt lat, czy pościliście dla mnie?"
"Za7,6": "A gdy jecie i pijecie, czy nie dla siebie jecie i nie dla siebie pijecie?"
"Za7,7": "Czy nie należało raczej czynić według słowa, które PAN głosił przez dawnych proroków, gdy Jerozolima była jeszcze zamieszkana i zażywała pokoju, a także jej okoliczne miasta, gdy południe i równina były zamieszkane?"
"Za7,8": "I słowo PANA doszło do Zachariasza mówiące:"
"Za7,9": "Tak mówi PAN zastępów: Sądźcie sprawiedliwie i okazujcie miłosierdzie i litość, każdy swojemu bratu."
"Za7,10": "Nie uciskajcie wdowy i sieroty, obcego i ubogiego i nie obmyślajcie zła w swoich sercach, jedni przeciwko drugim."
"Za7,11": "Ale oni nie chcieli słuchać i odwrócili się plecami, i zatkali swoje uszy, aby nie słyszeć."
"Za7,12": "Zatwardzili swoje serca jak diament, aby nie słuchać prawa i słów, które posyłał PAN zastępów przez swego Ducha za pośrednictwem dawnych proroków. Dlatego nadszedł wielki gniew od PANA zastępów."
"Za7,13": "I stało się tak, że podobnie jak gdy on wołał, a oni nie słuchali, tak też gdy oni wołali, ja ich nie wysłuchałem, mówi PAN zastępów."
"Za7,14": "I rozproszyłem ich wichrem pomiędzy wszystkimi narodami, których nie znali, a ta ziemia opustoszała po nich, tak że nikt nie przechodził ani nie wracał. Zamienili bowiem rozkoszną ziemię w spustoszenie."
