"Za3,1": "Potem ukazał mi Jozuego, najwyższego kapłana, który stał przed Aniołem PANA, i szatana stojącego po jego prawicy, aby mu się sprzeciwiać."
"Za3,2": "Ale PAN powiedział do szatana: Niech cię PAN zgromi, szatanie! Niech cię skarci PAN, który wybrał Jerozolimę. Czyż nie jest on jak głownia wyrwana z ognia?"
"Za3,3": "A Jozue był ubrany w brudne szaty i stał przed Aniołem."
"Za3,4": "Ten odezwał się do tych, którzy stali przed nim, i powiedział: Zdejmijcie z niego te brudne szaty. Do niego zaś powiedział: Oto zdjąłem z ciebie twoją nieprawość i oblekłem cię w inne szaty."
"Za3,5": "Powiedział jeszcze: Niech włożą mu na głowę piękną mitrę. Włożyli więc piękną mitrę na jego głowę i oblekli go w szaty, a Anioł PANA stał obok."
"Za3,6": "Potem Anioł PANA oświadczył Jozuemu:"
"Za3,7": "Tak mówi PAN zastępów: Jeśli będziesz chodził moimi drogami i jeśli będziesz przestrzegał moich ustaw, wtedy też będziesz sądził mój dom i będziesz strzegł moich dziedzińców, i pozwolę ci chodzić wśród tych, którzy tu stoją."
"Za3,8": "Słuchaj więc teraz, Jozue, najwyższy kapłanie, ty i twoi towarzysze, którzy siedzą przed tobą. Są oni bowiem jakby ludźmi niezwykłymi, gdyż oto przywiodę swojego sługę – Latorośl."
"Za3,9": "Oto bowiem ten kamień, który kładę przed Jozuem: na tym jednym kamieniu będzie siedmioro oczu. Oto wykonam na nim ryt, mówi PAN zastępów, i zgładzę nieprawość tej ziemi w jednym dniu."
"Za3,10": "W tym dniu, mówi PAN zastępów, każdy wezwie swego bliźniego pod winoroślą i pod drzewem figowym."
