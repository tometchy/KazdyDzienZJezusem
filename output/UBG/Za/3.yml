"Za3,1":
  text: "Potem ukazał mi Jozuego, najwyższego kapłana, który stał przed Aniołem PANA, i szatana stojącego po jego prawicy, aby mu się sprzeciwiać."
  tags: []
"Za3,2":
  text: "Ale PAN powiedział do szatana: Niech cię PAN zgromi, szatanie! Niech cię skarci PAN, który wybrał Jerozolimę. Czyż nie jest on jak głownia wyrwana z ognia?"
  tags: []
"Za3,3":
  text: "A Jozue był ubrany w brudne szaty i stał przed Aniołem."
  tags: []
"Za3,4":
  text: "Ten odezwał się do tych, którzy stali przed nim, i powiedział: Zdejmijcie z niego te brudne szaty. Do niego zaś powiedział: Oto zdjąłem z ciebie twoją nieprawość i oblekłem cię w inne szaty."
  tags: []
"Za3,5":
  text: "Powiedział jeszcze: Niech włożą mu na głowę piękną mitrę. Włożyli więc piękną mitrę na jego głowę i oblekli go w szaty, a Anioł PANA stał obok."
  tags: []
"Za3,6":
  text: "Potem Anioł PANA oświadczył Jozuemu:"
  tags: []
"Za3,7":
  text: "Tak mówi PAN zastępów: Jeśli będziesz chodził moimi drogami i jeśli będziesz przestrzegał moich ustaw, wtedy też będziesz sądził mój dom i będziesz strzegł moich dziedzińców, i pozwolę ci chodzić wśród tych, którzy tu stoją."
  tags: []
"Za3,8":
  text: "Słuchaj więc teraz, Jozue, najwyższy kapłanie, ty i twoi towarzysze, którzy siedzą przed tobą. Są oni bowiem jakby ludźmi niezwykłymi, gdyż oto przywiodę swojego sługę – Latorośl."
  tags: []
"Za3,9":
  text: "Oto bowiem ten kamień, który kładę przed Jozuem: na tym jednym kamieniu będzie siedmioro oczu. Oto wykonam na nim ryt, mówi PAN zastępów, i zgładzę nieprawość tej ziemi w jednym dniu."
  tags: []
"Za3,10":
  text: "W tym dniu, mówi PAN zastępów, każdy wezwie swego bliźniego pod winoroślą i pod drzewem figowym."
  tags: []
