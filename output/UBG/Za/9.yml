"Za9,1": "Brzemię słowa PANA w ziemi Chadraku, a Damaszek będzie jego odpoczynkiem, gdyż PANU przypatrzą się oczy ludzi i wszystkich pokoleń Izraela;"
"Za9,2": "Nawet Chamat będzie miał z nim granicę, a także Tyr i Sydon, choć są bardzo mądre."
"Za9,3": "Tyr bowiem zbudował sobie twierdzę i nagromadził srebra jak prochu, a złota jak błota na ulicach."
"Za9,4": "Oto PAN go wypędzi i wrzuci w morze jego siłę, on sam zostanie strawiony ogniem."
"Za9,5": "Ujrzy to Aszkelon i ulęknie się, podobnie Gaza – i pogrąży się w smutku; również Ekron, bo jego nadzieja zawiedzie. I zginie król z Gazy, a Aszkelon nie będzie zamieszkany."
"Za9,6": "I bękart będzie mieszkał w Aszdodzie, a tak zniszczę pychę Filistynów."
"Za9,7": "Usunę krew każdego z jego ust i obrzydliwości spomiędzy jego zębów. Kto pozostanie, będzie należał do naszego Boga, aby był jak książę w Judzie i Ekron, jak Jebusyta."
"Za9,8": "I rozłożę obóz dokoła swego domu z powodu wojska i z powodu tych, którzy przechodzą i wracają. I już nie przejdzie przez nich żaden ciemięzca. Teraz bowiem widziały to moje oczy."
"Za9,9": "Raduj się wielce, córko Syjonu! Wykrzykuj, córko Jerozolimy! Oto twój Król przychodzi do ciebie; sprawiedliwy i Zbawiciel, cichy i siedzący na ośle, na oślątku, źrebięciu oślicy."
"Za9,10": "Zniszczę bowiem rydwany z Efraima i konie z Jerozolimy, a łuki wojenne będą połamane. I ogłosi pokój narodom, a jego władza będzie sięgać od morza aż do morza i od rzeki aż po krańce ziemi."
"Za9,11": "A co do ciebie, ze względu na krew twego przymierza wypuściłem twoich więźniów z dołu, w którym nie ma wody."
"Za9,12": "Wróćcie do twierdzy, więźniowie, którzy macie nadzieję. Dziś bowiem ogłaszam, że wynagrodzę w dwójnasób;"
"Za9,13": "Gdy jak łuk naciągnę Judę, a na nim nałożę Efraima; wzbudzę twoich synów, Syjonie, przeciwko twoim synom, Jawanie, i zrobię z ciebie miecz mocarza."
"Za9,14": "PAN bowiem ukaże się nad nimi i jak błyskawica wyleci jego strzała. Pan BÓG zadmie w trąbę i wyruszy w wichrach południa."
"Za9,15": "PAN zastępów będzie ochraniać swój lud; pochłoną i przemogą kamienie z procy, będą pić i krzyczeć jak od wina; i napełnią się jak czasza i jak rogi ołtarza."
"Za9,16": "W tym dniu PAN, ich Bóg, wybawi ich jak trzodę swego ludu. Będą bowiem jak kamienie w koronie, wystawieni jak sztandar w jego ziemi."
"Za9,17": "Jak wielkie bowiem jest jego błogosławieństwo! Jak wspaniałe jego piękno! Zboże pocieszy młodzieńców, a moszcz – panny."
