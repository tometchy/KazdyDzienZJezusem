"Za9,1":
  text: "Brzemię słowa PANA w ziemi Chadraku, a Damaszek będzie jego odpoczynkiem, gdyż PANU przypatrzą się oczy ludzi i wszystkich pokoleń Izraela;"
  tags: []
"Za9,2":
  text: "Nawet Chamat będzie miał z nim granicę, a także Tyr i Sydon, choć są bardzo mądre."
  tags: []
"Za9,3":
  text: "Tyr bowiem zbudował sobie twierdzę i nagromadził srebra jak prochu, a złota jak błota na ulicach."
  tags: []
"Za9,4":
  text: "Oto PAN go wypędzi i wrzuci w morze jego siłę, on sam zostanie strawiony ogniem."
  tags: []
"Za9,5":
  text: "Ujrzy to Aszkelon i ulęknie się, podobnie Gaza – i pogrąży się w smutku; również Ekron, bo jego nadzieja zawiedzie. I zginie król z Gazy, a Aszkelon nie będzie zamieszkany."
  tags: []
"Za9,6":
  text: "I bękart będzie mieszkał w Aszdodzie, a tak zniszczę pychę Filistynów."
  tags: []
"Za9,7":
  text: "Usunę krew każdego z jego ust i obrzydliwości spomiędzy jego zębów. Kto pozostanie, będzie należał do naszego Boga, aby był jak książę w Judzie i Ekron, jak Jebusyta."
  tags: []
"Za9,8":
  text: "I rozłożę obóz dokoła swego domu z powodu wojska i z powodu tych, którzy przechodzą i wracają. I już nie przejdzie przez nich żaden ciemięzca. Teraz bowiem widziały to moje oczy."
  tags: []
"Za9,9":
  text: "Raduj się wielce, córko Syjonu! Wykrzykuj, córko Jerozolimy! Oto twój Król przychodzi do ciebie; sprawiedliwy i Zbawiciel, cichy i siedzący na ośle, na oślątku, źrebięciu oślicy."
  tags: []
"Za9,10":
  text: "Zniszczę bowiem rydwany z Efraima i konie z Jerozolimy, a łuki wojenne będą połamane. I ogłosi pokój narodom, a jego władza będzie sięgać od morza aż do morza i od rzeki aż po krańce ziemi."
  tags: []
"Za9,11":
  text: "A co do ciebie, ze względu na krew twego przymierza wypuściłem twoich więźniów z dołu, w którym nie ma wody."
  tags: []
"Za9,12":
  text: "Wróćcie do twierdzy, więźniowie, którzy macie nadzieję. Dziś bowiem ogłaszam, że wynagrodzę w dwójnasób;"
  tags: []
"Za9,13":
  text: "Gdy jak łuk naciągnę Judę, a na nim nałożę Efraima; wzbudzę twoich synów, Syjonie, przeciwko twoim synom, Jawanie, i zrobię z ciebie miecz mocarza."
  tags: []
"Za9,14":
  text: "PAN bowiem ukaże się nad nimi i jak błyskawica wyleci jego strzała. Pan BÓG zadmie w trąbę i wyruszy w wichrach południa."
  tags: []
"Za9,15":
  text: "PAN zastępów będzie ochraniać swój lud; pochłoną i przemogą kamienie z procy, będą pić i krzyczeć jak od wina; i napełnią się jak czasza i jak rogi ołtarza."
  tags: []
"Za9,16":
  text: "W tym dniu PAN, ich Bóg, wybawi ich jak trzodę swego ludu. Będą bowiem jak kamienie w koronie, wystawieni jak sztandar w jego ziemi."
  tags: []
"Za9,17":
  text: "Jak wielkie bowiem jest jego błogosławieństwo! Jak wspaniałe jego piękno! Zboże pocieszy młodzieńców, a moszcz – panny."
  tags: []
