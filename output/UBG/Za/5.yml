"Za5,1":
  text: "Potem odwróciłem się i gdy podniosłem swe oczy, spojrzałem, a oto latający zwój."
  tags: []
"Za5,2":
  text: "I zapytał mnie: Co widzisz? Odpowiedziałem: Widzę latający zwój, jego długość dwadzieścia łokci, a jego szerokość dziesięć łokci."
  tags: []
"Za5,3":
  text: "Wtedy powiedział do mnie: To jest przekleństwo, które wyjdzie na całą powierzchnię ziemi. Każdy złodziej bowiem zostanie wykorzeniony według przekleństwa z tej strony i każdy krzywoprzysięzca zostanie wykorzeniony według przekleństwa z drugiej strony."
  tags: []
"Za5,4":
  text: "Wyprowadzę je, mówi PAN zastępów, aby weszło do domu złodzieja i do domu tego, kto krzywo przysięga na moje imię. Pozostanie w jego domu i zniszczy go wraz z jego drewnem i kamieniem."
  tags: []
"Za5,5":
  text: "Wtedy wyszedł Anioł, który ze mną rozmawiał, i powiedział mi: Podnieś teraz swoje oczy i zobacz, co to jest, co wychodzi."
  tags: []
"Za5,6":
  text: "Zapytałem: Co to jest? On odpowiedział: To, co wychodzi, to efa. I dodał: Taki jest ich wygląd w całej ziemi."
  tags: []
"Za5,7":
  text: "A oto podniósł się talent ołowiu, a przy tym była kobieta, która siedziała wewnątrz efy."
  tags: []
"Za5,8":
  text: "Wtedy Anioł powiedział: To jest bezbożność. I wrzucił ją do wnętrza efy, wrzucił także do otworu efy ten talent ołowiu."
  tags: []
"Za5,9":
  text: "Potem podniosłem swoje oczy i spojrzałem, a oto wyszły dwie kobiety mające wiatr pod swoimi skrzydłami, a ich skrzydła przypominały skrzydła bocianie. I podniosły efę między ziemią i niebem."
  tags: []
"Za5,10":
  text: "Wtedy zapytałem tego Anioła, który rozmawiał ze mną: Dokąd niosą tę efę?"
  tags: []
"Za5,11":
  text: "Powiedział mi: By zbudować dla niej dom w ziemi Szinear, a gdy będzie założony, postawią ją na jej własnej podstawie."
  tags: []
