"Za4,1":
  text: "Potem Anioł, który rozmawiał ze mną, powrócił i obudził mnie, jak budzi się kogoś ze snu."
  tags: []
"Za4,2":
  text: "I zapytał mnie: Co widzisz? Odpowiedziałem: Spojrzałem, a oto świecznik cały ze złota, a na jego szczycie jest czasza, na nim siedem lamp, a także siedem rurek do tych siedmiu lamp, które są na jego szczycie;"
  tags: []
"Za4,3":
  text: "Dwa drzewa oliwne obok niego, jedno po prawej stronie czaszy, a drugie po jej lewej stronie."
  tags: []
"Za4,4":
  text: "Wtedy odezwałem się do Anioła, który rozmawiał ze mną, i zapytałem: Co to jest, mój Panie?"
  tags: []
"Za4,5":
  text: "Anioł, który rozmawiał ze mną, odpowiedział mi: Czy nie wiesz, co to jest? Odpowiedziałem: Nie wiem, mój Panie."
  tags: []
"Za4,6":
  text: "Wtedy odpowiedział mi: Oto słowo PANA do Zorobabela: Nie wojskiem ani siłą, ale moim Duchem, mówi PAN zastępów."
  tags: []
"Za4,7":
  text: "Czymże ty jesteś, góro wielka? Wobec Zorobabela staniesz się równiną. On bowiem wyniesie główny kamień z głośnym okrzykiem: Łaska, łaska nad nim."
  tags: []
"Za4,8":
  text: "I doszło słowo PANA do mnie mówiące:"
  tags: []
"Za4,9":
  text: "Ręce Zorobabela położyły fundamenty tego domu, jego ręce go dokończą; a poznasz, że PAN zastępów posłał mnie do was."
  tags: []
"Za4,10":
  text: "Któż bowiem wzgardził dniem małych początków? Oni bowiem będą się radować, patrząc na pion w ręku Zorobabela i na tych siedmioro oczu PANA, które przebiegają całą ziemię."
  tags: []
"Za4,11":
  text: "Wtedy odezwałem się i zapytałem go: Co oznaczają te dwa drzewa oliwne po prawej i lewej stronie tego świecznika?"
  tags: []
"Za4,12":
  text: "I ponownie odezwałem się, i zapytałem go: Co oznaczają te dwie gałęzie oliwne, które dwiema złotymi rurkami wypuszczają z siebie złocistą oliwę?"
  tags: []
"Za4,13":
  text: "On zapytał: Nie wiesz, co to jest? Odpowiedziałem: Nie wiem, mój Panie."
  tags: []
"Za4,14":
  text: "Wtedy powiedział: To są dwaj pomazańcy, którzy stoją przed Panem całej ziemi."
  tags: []
