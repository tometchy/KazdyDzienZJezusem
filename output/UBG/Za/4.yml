"Za4,1": "Potem Anioł, który rozmawiał ze mną, powrócił i obudził mnie, jak budzi się kogoś ze snu."
"Za4,2": "I zapytał mnie: Co widzisz? Odpowiedziałem: Spojrzałem, a oto świecznik cały ze złota, a na jego szczycie jest czasza, na nim siedem lamp, a także siedem rurek do tych siedmiu lamp, które są na jego szczycie;"
"Za4,3": "Dwa drzewa oliwne obok niego, jedno po prawej stronie czaszy, a drugie po jej lewej stronie."
"Za4,4": "Wtedy odezwałem się do Anioła, który rozmawiał ze mną, i zapytałem: Co to jest, mój Panie?"
"Za4,5": "Anioł, który rozmawiał ze mną, odpowiedział mi: Czy nie wiesz, co to jest? Odpowiedziałem: Nie wiem, mój Panie."
"Za4,6": "Wtedy odpowiedział mi: Oto słowo PANA do Zorobabela: Nie wojskiem ani siłą, ale moim Duchem, mówi PAN zastępów."
"Za4,7": "Czymże ty jesteś, góro wielka? Wobec Zorobabela staniesz się równiną. On bowiem wyniesie główny kamień z głośnym okrzykiem: Łaska, łaska nad nim."
"Za4,8": "I doszło słowo PANA do mnie mówiące:"
"Za4,9": "Ręce Zorobabela położyły fundamenty tego domu, jego ręce go dokończą; a poznasz, że PAN zastępów posłał mnie do was."
"Za4,10": "Któż bowiem wzgardził dniem małych początków? Oni bowiem będą się radować, patrząc na pion w ręku Zorobabela i na tych siedmioro oczu PANA, które przebiegają całą ziemię."
"Za4,11": "Wtedy odezwałem się i zapytałem go: Co oznaczają te dwa drzewa oliwne po prawej i lewej stronie tego świecznika?"
"Za4,12": "I ponownie odezwałem się, i zapytałem go: Co oznaczają te dwie gałęzie oliwne, które dwiema złotymi rurkami wypuszczają z siebie złocistą oliwę?"
"Za4,13": "On zapytał: Nie wiesz, co to jest? Odpowiedziałem: Nie wiem, mój Panie."
"Za4,14": "Wtedy powiedział: To są dwaj pomazańcy, którzy stoją przed Panem całej ziemi."
