"1Tes2,1":
  text: "Sami bowiem wiecie, bracia, że nasze przybycie do was nie było daremne;"
  tags: []
"1Tes2,2":
  text: "Lecz chociaż przedtem, jak wiecie, doznaliśmy cierpień i byliśmy znieważeni w Filippi, to jednak odważyliśmy się w naszym Bogu, by wśród wielu zmagań głosić wam ewangelię Boga."
  tags: []
"1Tes2,3":
  text: "Nasze pouczenie bowiem nie wzięło się z błędu ani z nieczystości, ani z podstępu;"
  tags: []
"1Tes2,4":
  text: "Lecz jak przez Boga zostaliśmy uznani za godnych powierzenia nam ewangelii, tak ją głosimy, nie aby podobać się ludziom, ale Bogu, który bada nasze serca."
  tags: []
"1Tes2,5":
  text: "Nigdy bowiem nie posługiwaliśmy się pochlebstwem w mowie, jak wiecie, ani nie kierowaliśmy się ukrytą chciwością, Bóg jest świadkiem;"
  tags: []
"1Tes2,6":
  text: "Ani nie szukaliśmy chwały u ludzi, ani u was, ani u innych, mogąc być dla was ciężarem jako apostołowie Chrystusa;"
  tags: []
"1Tes2,7":
  text: "Byliśmy jednak wśród was łagodni jak karmicielka troszcząca się o swoje dzieci."
  tags: []
"1Tes2,8":
  text: "Darzyliśmy was taką życzliwością, że gotowi byliśmy użyczyć wam nie tylko ewangelii Boga, ale i naszych dusz, bo staliście się nam drodzy."
  tags: []
"1Tes2,9":
  text: "Pamiętacie przecież, bracia, naszą pracę i trud. Pracując bowiem dniem i nocą, aby nie obciążyć nikogo z was, głosiliśmy wam ewangelię Boga."
  tags: []
"1Tes2,10":
  text: "Wy i Bóg jesteście świadkami, że zachowywaliśmy się w świętości, w sprawiedliwości i nienagannie pośród was, którzy wierzycie."
  tags: []
"1Tes2,11":
  text: "Wiecie bowiem, że każdego z was, jak ojciec swoje dzieci, zachęcaliśmy i pocieszaliśmy, i zaklinaliśmy;"
  tags: []
"1Tes2,12":
  text: "Abyście postępowali w sposób godny Boga, który was powołał do swego królestwa i chwały."
  tags: []
"1Tes2,13":
  text: "Dlatego też nieustannie dziękujemy Bogu, że gdy przyjęliście słowo Boże, które słyszeliście od nas, przyjęliście je nie jako słowo ludzkie, ale – jak jest naprawdę – jako słowo Boże, które też w was, którzy wierzycie, skutecznie działa."
  tags: []
"1Tes2,14":
  text: "Wy bowiem, bracia, staliście się naśladowcami kościołów Bożych, które są w Judei w Chrystusie Jezusie, bo wy to samo wycierpieliście od swoich rodaków, co i oni od Żydów;"
  tags: []
"1Tes2,15":
  text: "Którzy zabili i Pana Jezusa, i swoich własnych proroków, i nas prześladowali; a nie podobają się Bogu i sprzeciwiają się wszystkim ludziom."
  tags: []
"1Tes2,16":
  text: "Zabraniają nam zwiastować poganom, żeby ci nie byli zbawieni, aby zawsze dopełniali miary swoich grzechów; nadszedł bowiem na nich ostateczny gniew."
  tags: []
"1Tes2,17":
  text: "My zaś, bracia, rozłączeni z wami na krótko ciałem, ale nie sercem, z tym większym pragnieniem staraliśmy się was zobaczyć."
  tags: []
"1Tes2,18":
  text: "Dlatego chcieliśmy przybyć do was, zwłaszcza ja, Paweł, raz i drugi, ale przeszkodził nam szatan."
  tags: []
"1Tes2,19":
  text: "Co bowiem jest naszą nadzieją, radością albo koroną chluby? Czy nie wy nią jesteście przed naszym Panem Jezusem Chrystusem w czasie jego przyjścia?"
  tags: []
"1Tes2,20":
  text: "Wy bowiem jesteście naszą chwałą i radością."
  tags: []
