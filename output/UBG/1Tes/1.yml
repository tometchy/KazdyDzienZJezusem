"1Tes1,1":
  text: "Paweł, Sylwan i Tymoteusz do kościoła Tesaloniczan, który jest w Bogu Ojcu i Panu Jezusie Chrystusie. Łaska wam i pokój od Boga, naszego Ojca, i Pana Jezusa Chrystusa."
  tags: []
"1Tes1,2":
  text: "Zawsze dziękujemy Bogu za was wszystkich, czyniąc wzmiankę o was w naszych modlitwach;"
  tags: []
"1Tes1,3":
  text: "Nieustannie wspominając wasze dzieło wiary i trud miłości, i wytrwałość w nadziei w naszym Panu Jezusie Chrystusie, przed Bogiem i naszym Ojcem;"
  tags: []
"1Tes1,4":
  text: "Wiedząc, umiłowani bracia, że zostaliście wybrani przez Boga;"
  tags: []
"1Tes1,5":
  text: "Gdyż nasza ewangelia nie doszła was tylko w słowie, ale także w mocy i w Duchu Świętym, i w pełnym przekonaniu. Wiecie bowiem, jacy byliśmy dla was, przebywając wśród was."
  tags: []
"1Tes1,6":
  text: "A wy staliście się naśladowcami naszymi i Pana, przyjmując słowo pośród wielkiego ucisku, z radością Ducha Świętego;"
  tags: []
"1Tes1,7":
  text: "Tak że staliście się wzorem dla wszystkich wierzących w Macedonii i Achai."
  tags: []
"1Tes1,8":
  text: "Od was bowiem słowo Pańskie rozbrzmiewało nie tylko w Macedonii i Achai, ale też wasza wiara w Boga rozkrzewiła się w każdym miejscu, tak że nie trzeba nam mówić czegokolwiek;"
  tags: []
"1Tes1,9":
  text: "Ponieważ oni sami opowiadają o nas, jakie było nasze przybycie do was i jak nawróciliście się od bożków do Boga, aby służyć żywemu i prawdziwemu Bogu;"
  tags: []
"1Tes1,10":
  text: "I oczekiwać z niebios jego Syna, którego wskrzesił z martwych, Jezusa, który nas wyrwał od nadchodzącego gniewu."
  tags: []
