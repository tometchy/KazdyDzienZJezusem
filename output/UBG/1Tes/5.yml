"1Tes5,1":
  text: "A o czasach i porach, bracia, nie potrzebujecie, aby wam pisano."
  tags: []
"1Tes5,2":
  text: "Sami bowiem dokładnie wiecie, że dzień Pana przyjdzie jak złodziej w nocy."
  tags: []
"1Tes5,3":
  text: "Bo gdy będą mówić: Pokój i bezpieczeństwo – wtedy przyjdzie na nich nagła zguba, jak bóle na kobietę brzemienną, i nie ujdą."
  tags: []
"1Tes5,4":
  text: "Lecz wy, bracia, nie jesteście w ciemności, aby ten dzień zaskoczył was jak złodziej."
  tags: []
"1Tes5,5":
  text: "Wy wszyscy jesteście synami światłości i synami dnia. Nie jesteśmy synami nocy ani ciemności."
  tags: []
"1Tes5,6":
  text: "Nie śpijmy więc jak inni, ale czuwajmy i bądźmy trzeźwi."
  tags: []
"1Tes5,7":
  text: "Ci bowiem, którzy śpią, w nocy śpią, a ci, którzy się upijają, w nocy się upijają."
  tags: []
"1Tes5,8":
  text: "My zaś, którzy należymy do dnia, bądźmy trzeźwi, przywdziawszy pancerz wiary i miłości oraz hełm nadziei zbawienia."
  tags: []
"1Tes5,9":
  text: "Gdyż Bóg nie przeznaczył nas na gniew, lecz abyśmy otrzymali zbawienie przez naszego Pana Jezusa Chrystusa;"
  tags: []
"1Tes5,10":
  text: "Który umarł za nas, abyśmy, czy czuwamy, czy śpimy, razem z nim żyli."
  tags: []
"1Tes5,11":
  text: "Dlatego zachęcajcie jedni drugich i budujcie się wzajemnie, jak to zresztą czynicie."
  tags: []
"1Tes5,12":
  text: "I prosimy was, bracia, abyście darzyli uznaniem tych, którzy pracują wśród was, którzy są waszymi przełożonymi w Panu i was napominają;"
  tags: []
"1Tes5,13":
  text: "Ze względu na ich pracę darzcie ich jak najgorętszą miłością. Zachowujcie pokój między sobą."
  tags: []
"1Tes5,14":
  text: "Prosimy was też, bracia, napominajcie niekarnych, pocieszajcie bojaźliwych, podtrzymujcie słabych, bądźcie cierpliwi dla wszystkich."
  tags: []
"1Tes5,15":
  text: "Uważajcie, aby nikt nikomu nie odpłacał złem za zło, ale zawsze dążcie do tego, co dobre dla siebie nawzajem i dla wszystkich."
  tags: []
"1Tes5,16":
  text: "Zawsze się radujcie."
  tags: []
"1Tes5,17":
  text: "Nieustannie się módlcie."
  tags: []
"1Tes5,18":
  text: "Za wszystko dziękujcie. Taka jest bowiem wola Boga w Chrystusie Jezusie względem was."
  tags: []
"1Tes5,19":
  text: "Ducha nie gaście."
  tags: []
"1Tes5,20":
  text: "Proroctw nie lekceważcie."
  tags: []
"1Tes5,21":
  text: "Wszystko badajcie, a trzymajcie się tego, co dobre."
  tags: []
"1Tes5,22":
  text: "Od wszelkiego pozoru zła powstrzymujcie się."
  tags: []
"1Tes5,23":
  text: "A sam Bóg pokoju niech was w pełni uświęci, a cały wasz duch, dusza i ciało niech będą zachowane bez zarzutu na przyjście naszego Pana Jezusa Chrystusa."
  tags: []
"1Tes5,24":
  text: "Wierny jest ten, który was powołuje; on też tego dokona."
  tags: []
"1Tes5,25":
  text: "Bracia, módlcie się za nas."
  tags: []
"1Tes5,26":
  text: "Pozdrówcie wszystkich braci świętym pocałunkiem."
  tags: []
"1Tes5,27":
  text: "Zaklinam was na Pana, aby ten list został przeczytany wszystkim świętym braciom."
  tags: []
"1Tes5,28":
  text: "Łaska naszego Pana Jezusa Chrystusa niech będzie z wami. Amen."
  tags: []
