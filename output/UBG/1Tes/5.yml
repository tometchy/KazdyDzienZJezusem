"1Tes5,1": "A o czasach i porach, bracia, nie potrzebujecie, aby wam pisano."
"1Tes5,2": "Sami bowiem dokładnie wiecie, że dzień Pana przyjdzie jak złodziej w nocy."
"1Tes5,3": "Bo gdy będą mówić: Pokój i bezpieczeństwo – wtedy przyjdzie na nich nagła zguba, jak bóle na kobietę brzemienną, i nie ujdą."
"1Tes5,4": "Lecz wy, bracia, nie jesteście w ciemności, aby ten dzień zaskoczył was jak złodziej."
"1Tes5,5": "Wy wszyscy jesteście synami światłości i synami dnia. Nie jesteśmy synami nocy ani ciemności."
"1Tes5,6": "Nie śpijmy więc jak inni, ale czuwajmy i bądźmy trzeźwi."
"1Tes5,7": "Ci bowiem, którzy śpią, w nocy śpią, a ci, którzy się upijają, w nocy się upijają."
"1Tes5,8": "My zaś, którzy należymy do dnia, bądźmy trzeźwi, przywdziawszy pancerz wiary i miłości oraz hełm nadziei zbawienia."
"1Tes5,9": "Gdyż Bóg nie przeznaczył nas na gniew, lecz abyśmy otrzymali zbawienie przez naszego Pana Jezusa Chrystusa;"
"1Tes5,10": "Który umarł za nas, abyśmy, czy czuwamy, czy śpimy, razem z nim żyli."
"1Tes5,11": "Dlatego zachęcajcie jedni drugich i budujcie się wzajemnie, jak to zresztą czynicie."
"1Tes5,12": "I prosimy was, bracia, abyście darzyli uznaniem tych, którzy pracują wśród was, którzy są waszymi przełożonymi w Panu i was napominają;"
"1Tes5,13": "Ze względu na ich pracę darzcie ich jak najgorętszą miłością. Zachowujcie pokój między sobą."
"1Tes5,14": "Prosimy was też, bracia, napominajcie niekarnych, pocieszajcie bojaźliwych, podtrzymujcie słabych, bądźcie cierpliwi dla wszystkich."
"1Tes5,15": "Uważajcie, aby nikt nikomu nie odpłacał złem za zło, ale zawsze dążcie do tego, co dobre dla siebie nawzajem i dla wszystkich."
"1Tes5,16": "Zawsze się radujcie."
"1Tes5,17": "Nieustannie się módlcie."
"1Tes5,18": "Za wszystko dziękujcie. Taka jest bowiem wola Boga w Chrystusie Jezusie względem was."
"1Tes5,19": "Ducha nie gaście."
"1Tes5,20": "Proroctw nie lekceważcie."
"1Tes5,21": "Wszystko badajcie, a trzymajcie się tego, co dobre."
"1Tes5,22": "Od wszelkiego pozoru zła powstrzymujcie się."
"1Tes5,23": "A sam Bóg pokoju niech was w pełni uświęci, a cały wasz duch, dusza i ciało niech będą zachowane bez zarzutu na przyjście naszego Pana Jezusa Chrystusa."
"1Tes5,24": "Wierny jest ten, który was powołuje; on też tego dokona."
"1Tes5,25": "Bracia, módlcie się za nas."
"1Tes5,26": "Pozdrówcie wszystkich braci świętym pocałunkiem."
"1Tes5,27": "Zaklinam was na Pana, aby ten list został przeczytany wszystkim świętym braciom."
"1Tes5,28": "Łaska naszego Pana Jezusa Chrystusa niech będzie z wami. Amen."
