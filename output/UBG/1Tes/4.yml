"1Tes4,1": "Ponadto, bracia, prosimy was i zachęcamy przez Pana Jezusa, abyście – według otrzymanego od nas pouczenia o tym, jak należy postępować i podobać się Bogu – coraz bardziej w tym obfitowali."
"1Tes4,2": "Wiecie przecież, jakie nakazy daliśmy wam przez Pana Jezusa."
"1Tes4,3": "Taka jest bowiem wola Boga, wasze uświęcenie, żebyście powstrzymywali się od nierządu;"
"1Tes4,4": "Aby każdy z was umiał utrzymać swoje naczynie w świętości i poszanowaniu;"
"1Tes4,5": "Nie w namiętności żądzy jak poganie, którzy nie znają Boga;"
"1Tes4,6": "I aby nikt nie wykorzystywał i nie oszukiwał w żadnej sprawie swego brata, bo Pan jest mścicielem tego wszystkiego, jak wam to przedtem mówiliśmy i zaświadczaliśmy."
"1Tes4,7": "Bóg bowiem nie powołał nas do nieczystości, ale do świętości."
"1Tes4,8": "A więc kto to odrzuca, odrzuca nie człowieka, lecz Boga, który nam też dał swego Ducha Świętego."
"1Tes4,9": "A o miłości braterskiej nie ma potrzeby wam pisać, bo sami zostaliście pouczeni przez Boga, aby się wzajemnie miłować."
"1Tes4,10": "Czynicie to przecież względem wszystkich braci w całej Macedonii; ale zachęcamy was, bracia, żebyście coraz bardziej w nią obfitowali;"
"1Tes4,11": "I gorliwie starali się żyć spokojnie, dbać o swoje sprawy i pracować własnymi rękami, jak wam nakazaliśmy;"
"1Tes4,12": "Abyście uczciwie postępowali wobec tych, którzy są na zewnątrz, i w niczym nie mieli niedostatku."
"1Tes4,13": "A nie chcę, bracia, abyście byli w niewiedzy co do tych, którzy zasnęli, abyście się nie smucili jak inni, którzy nie mają nadziei."
"1Tes4,14": "Jeśli bowiem wierzymy, że Jezus umarł i zmartwychwstał, to też tych, którzy zasnęli w Jezusie, Bóg przyprowadzi wraz z nim."
"1Tes4,15": "Bo to wam mówimy przez słowo Pana, że my, którzy pozostaniemy żywi do przyjścia Pana, nie wyprzedzimy tych, którzy zasnęli."
"1Tes4,16": "Gdyż sam Pan z okrzykiem, z głosem archanioła i dźwiękiem trąby Bożej zstąpi z nieba, a zmarli w Chrystusie powstaną pierwsi."
"1Tes4,17": "Potem my, którzy pozostaniemy żywi, razem z nimi będziemy porwani w obłoki, w powietrze, na spotkanie Pana, i tak zawsze będziemy z Panem."
"1Tes4,18": "Dlatego pocieszajcie się wzajemnie tymi słowami."
