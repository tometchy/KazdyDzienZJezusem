"1Tes3,1":
  text: "Dlatego nie mogąc tego dłużej znosić, postanowiliśmy sami pozostać w Atenach;"
  tags: []
"1Tes3,2":
  text: "A Tymoteusza, naszego brata, sługę Boga i współpracownika w ewangelii Chrystusa posłaliśmy, aby was utwierdził i dodał wam otuchy w wierze;"
  tags: []
"1Tes3,3":
  text: "Aby nikt się nie zachwiał wśród tych utrapień. Sami przecież wiecie, że do tego zostaliśmy wyznaczeni."
  tags: []
"1Tes3,4":
  text: "Gdy bowiem byliśmy u was, zapowiadaliśmy wam, że będziemy cierpieć ucisk, co się też stało, jak wiecie."
  tags: []
"1Tes3,5":
  text: "Dlatego i ja, nie mogąc tego dłużej znosić, posłałem go, aby rozeznał się w waszej wierze, czy was kusiciel czasem nie kusił, a nasza praca nie okazała się daremna."
  tags: []
"1Tes3,6":
  text: "Teraz zaś Tymoteusz wrócił od was do nas i zwiastował nam radosną wieść o waszej wierze i miłości, i o tym, że nas zawsze dobrze wspominacie, pragnąc nas widzieć, podobnie jak my was."
  tags: []
"1Tes3,7":
  text: "Dlatego dzięki wam, bracia, zostaliśmy pocieszeni przez waszą wiarę we wszelkim naszym ucisku i potrzebie."
  tags: []
"1Tes3,8":
  text: "Teraz bowiem żyjemy, jeśli wy trwacie w Panu."
  tags: []
"1Tes3,9":
  text: "Jakie więc dziękczynienie możemy złożyć Bogu za was, za całą radość, jakiej z powodu was doznajemy przed naszym Bogiem;"
  tags: []
"1Tes3,10":
  text: "Gdy w nocy i we dnie bardzo gorliwie modlimy się, abyśmy mogli zobaczyć was osobiście i uzupełnić braki waszej wiary?"
  tags: []
"1Tes3,11":
  text: "A sam Bóg i nasz Ojciec i nasz Pan Jezus Chrystus niech utoruje naszą drogę do was."
  tags: []
"1Tes3,12":
  text: "Pan zaś niech sprawi, że będziecie wzrastać i obfitować w miłość do siebie nawzajem i do wszystkich, taką, jaką i my mamy do was;"
  tags: []
"1Tes3,13":
  text: "Aby wasze serca zostały utwierdzone jako nienaganne w świętości wobec naszego Boga i Ojca na przyjście naszego Pana Jezusa Chrystusa wraz ze wszystkimi jego świętymi."
  tags: []
