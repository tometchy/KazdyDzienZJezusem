"Joz20,1":
  text: "Potem PAN powiedział do Jozuego:"
  tags: []
"Joz20,2":
  text: "Powiedz synom Izraela: Wyznaczcie sobie miasta schronienia, o których mówiłem wam przez Mojżesza;"
  tags: []
"Joz20,3":
  text: "Aby tam uciekał zabójca, który by zabił człowieka niechcący i mimowolnie. Będą dla was schronieniem przed mścicielem krwi."
  tags: []
"Joz20,4":
  text: "Gdy ktoś ucieknie do jednego z tych miast i stanie przy wejściu do bramy miejskiej, opowie do uszu starszych tego miasta swoją sprawę, a oni przyjmą go do miasta do siebie i dadzą mu miejsce, i będzie z nimi mieszkał."
  tags: []
"Joz20,5":
  text: "A gdy będzie go ścigał mściciel krwi, to nie wydadzą zabójcy w jego ręce, gdyż nieumyślnie zabił swego bliźniego i nie czuł do niego przedtem nienawiści."
  tags: []
"Joz20,6":
  text: "I będzie mieszkał w tym mieście, dopóki nie stanie przed zgromadzeniem na sąd i aż do śmierci najwyższego kapłana, który będzie w tym czasie. Wtedy zabójca wróci i przyjdzie do swego miasta i do swego domu, do miasta, z którego uciekł."
  tags: []
"Joz20,7":
  text: "I wyznaczyli Kedesz w Galilei na górze Neftalego, Sychem na górze Efraim oraz Kiriat-Arba, czyli Hebron, na górze Judy."
  tags: []
"Joz20,8":
  text: "Z drugiej zaś strony Jordanu, na wschód od Jerycha, wyznaczyli Beser na pustyni, na równinie, z pokolenia Rubena, Ramot w Gileadzie z pokolenia Gada oraz Golan w Baszanie z pokolenia Manassesa."
  tags: []
"Joz20,9":
  text: "Oto miasta ucieczki dla wszystkich synów Izraela i cudzoziemców, którzy mieszkają pośród nich, aby mógł tam uciec każdy, kto zabił kogoś przez nieuwagę i nie poniósł śmierci z ręki mściciela krwi, zanim stanie przed zgromadzeniem."
  tags: []
