"Joz17,1":
  text: "Los przypadł też pokoleniu Manassesa, bo był on pierworodnym Józefa. Przypadł Makirowi, pierworodnemu Manassesa, ojcu Gileada, a ponieważ był wojownikiem, otrzymał Gilead i Baszan."
  tags: []
"Joz17,2":
  text: "Dział otrzymali też inni synowie Manassesa według ich rodzin: synowie Abiezera, synowie Cheleka, synowie Asriela, synowie Sychema, synowie Chefera i synowie Szemidy. Ci byli synami Manassesa, syna Józefa – mężczyźni według ich rodzin."
  tags: []
"Joz17,3":
  text: "Lecz Selofchad, syn Chefera, syna Gileada, syna Makira, syna Manassesa, nie miał synów, tylko córki. Oto imiona jego córek: Machla, Noa, Chogla, Milka i Tirsa."
  tags: []
"Joz17,4":
  text: "Przyszły one przed kapłana Eleazara, przed Jozuego, syna Nuna, oraz przed naczelników i powiedziały: PAN rozkazał Mojżeszowi, aby dał nam dziedzictwo pośród naszych braci; i Jozue dał im zgodnie z rozkazem PANA dziedzictwo pośród braci ich ojca."
  tags: []
"Joz17,5":
  text: "I przypadło Manassesowi dziesięć działów oprócz ziemi Gilead i Baszan, które były za Jordanem."
  tags: []
"Joz17,6":
  text: "Córki Manassesa otrzymały bowiem dziedzictwo pośród jego synów, a ziemia Gilead przypadła pozostałym synom Manassesa."
  tags: []
"Joz17,7":
  text: "I granica Manassesa ciągnęła się od Aszera do Michmetat, które leży naprzeciw Sychem, a dalej biegła na prawo do mieszkańców w En-Tappuach."
  tags: []
"Joz17,8":
  text: "Ziemia Tappuach należała do Manassesa, ale Tappuach na granicy Manassesa należało do synów Efraima."
  tags: []
"Joz17,9":
  text: "Granica ta biegła do potoku Kana, na południe od tego potoku. Te miasta Efraimitów leżą wśród miast Manassesa, ale granica Manassesa biegła od północy tego potoku, a kończyła się przy morzu."
  tags: []
"Joz17,10":
  text: "Na południu był dział Efraima, a na północy Manassesa, a jego granicą było morze. Z Aszerem graniczy na północy, a z Issacharem na wschodzie."
  tags: []
"Joz17,11":
  text: "I Manasses posiadał w działach Issachara i Aszera Bet-Szean i przyległe do niego miasteczka, Jibleam i przyległe do niego miasteczka, mieszkańców Dor i przyległe do niego miasteczka, mieszkańców Endor i przyległe do niego miasteczka, mieszkańców Tanaku i przyległe do niego miasteczka oraz mieszkańców Megiddo i przyległe do niego miasteczka – trzy okręgi."
  tags: []
"Joz17,12":
  text: "Lecz synowie Manassesa nie mogli wypędzić z tych miast ich mieszkańców, dlatego Kananejczycy dalej mieszkali w tej ziemi."
  tags: []
"Joz17,13":
  text: "A gdy synowie Izraela wzmocnili się, kazali Kananejczykom płacić daninę, ale nie wypędzili ich całkowicie."
  tags: []
"Joz17,14":
  text: "Wtedy synowie Józefa powiedzieli do Jozuego: Dlaczego dałeś nam w dziedzictwo jeden los i jeden dział? Jesteśmy przecież ludem wielkim i PAN dotychczas nam błogosławił."
  tags: []
"Joz17,15":
  text: "I Jozue odpowiedział im: Jeśli jesteście ludem wielkim, idźcie do lasu i wykarczujcie tam sobie miejsce w ziemi Peryzzytów i Refaitów, skoro za ciasno jest wam na górze Efraim."
  tags: []
"Joz17,16":
  text: "Synowie Józefa odpowiedzieli: Góra nam nie wystarczy, a wszyscy Kananejczycy, którzy mieszkają w dolinach, mają żelazne rydwany, zarówno ci, którzy mieszkają w Bet-Szean i w przyległych do niego miasteczkach, jak i ci, którzy mieszkają w dolinie Jizreel."
  tags: []
"Joz17,17":
  text: "Wtedy Jozue powiedział do domu Józefa, do Efraima i Manassesa: Jesteś ludem wielkim i twoja moc jest wielka, nie będziesz miał tylko jednego losu;"
  tags: []
"Joz17,18":
  text: "Lecz otrzymasz górę; a że tam jest las, to go wykarczujesz i będziesz miał jego granice. Wypędzisz bowiem Kananejczyków, choć mają żelazne rydwany i są potężni."
  tags: []
