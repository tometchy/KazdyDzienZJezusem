"Joz12,1": "A oto królowie ziemi, których pobili synowie Izraela i posiedli ich ziemię za Jordanem na wschodzie, od rzeki Arnon aż do góry Hermon, i całą równinę na wschodzie:"
"Joz12,2": "Sichon, król Amorytów, który mieszkał w Cheszbonie, a panował od Aroeru, leżącego nad brzegiem rzeki Arnon, i od połowy tej rzeki oraz połowy Gileadu aż do rzeki Jabbok, granicy synów Ammona;"
"Joz12,3": "A od równin aż do morza Kinneret na wschodzie, i aż do Morza Równiny, czyli Morza Słonego, na wschód, w kierunku Bet-Jeszimot, i od południa pod górę Pisga."
"Joz12,4": "I obszar Oga, króla Baszanu, który pozostał z Refaitów i mieszkał w Asztarot i w Edrei;"
"Joz12,5": "Panował on na górze Hermon, i w Salce oraz w całym Baszanie aż do granic Geszurytów i Maakatytów i nad połową Gileadu, granicą Sichona, króla Cheszbonu."
"Joz12,6": "Pobił ich Mojżesz, sługa PANA, wraz z synami Izraela. I Mojżesz, sługa PANA, dał tę ziemię w posiadanie Rubenitom i Gadytom, i połowie pokolenia Manassesa."
"Joz12,7": "A oto królowie ziemi, których pobili Jozue i synowie Izraela po zachodniej stronie Jordanu, od Baal-Gad w dolinie Libanu aż do góry Chalak, która wznosi się ku Seirowi, a których obszar Jozue dał pokoleniom Izraela w posiadanie według ich przydziałów;"
"Joz12,8": "Na górach, na równinach, na polach, na nizinach, na pustyni i na południowej ziemi; ziemie Chetytów, Amorytów, Kananejczyków, Peryzzytów, Chiwwitów i Jebusytów."
"Joz12,9": "Król Jerycha – jeden; król Aj, które jest obok Betel – jeden."
"Joz12,10": "Król Jerozolimy – jeden; król Hebronu – jeden."
"Joz12,11": "Król Jarmutu – jeden; król Lakisz – jeden."
"Joz12,12": "Król Eglonu – jeden; król Gezer – jeden."
"Joz12,13": "Król Debir – jeden; król Gederu – jeden."
"Joz12,14": "Król Chormy – jeden; król Aradu – jeden."
"Joz12,15": "Król Libny – jeden; król Adullam – jeden."
"Joz12,16": "Król Makkedy – jeden; król Betel – jeden."
"Joz12,17": "Król Tappuach – jeden; król Cheferu – jeden."
"Joz12,18": "Król Afek – jeden; król Laszaronu – jeden."
"Joz12,19": "Król Madonu – jeden; król Chasoru – jeden."
"Joz12,20": "Król Szimron-Meronu – jeden; król Achszafu – jeden."
"Joz12,21": "Król Tanaku – jeden; król Megiddo – jeden."
"Joz12,22": "Król Kedeszu – jeden; król Jokneamu z Karmelu – jeden."
"Joz12,23": "Król Doru z krainy Dor – jeden; król narodów z Gilgal – jeden."
"Joz12,24": "Król Tirsy – jeden. Wszystkich królów było trzydziestu jeden."
