"Joz5,1":
  text: "A gdy wszyscy królowie amoryccy, którzy mieszkali po zachodniej stronie Jordanu, i wszyscy królowie Kanaanu, którzy mieszkali nad morzem, usłyszeli, że PAN wysuszył wody Jordanu przed synami Izraela, aż się przeprawili, struchlało ich serce i stracili całą odwagę wobec synów Izraela."
  tags: []
"Joz5,2":
  text: "W tym czasie PAN powiedział do Jozuego: Zrób sobie ostre noże i ponownie obrzezaj synów Izraela."
  tags: []
"Joz5,3":
  text: "Jozue zrobił więc sobie ostre noże i obrzezał synów Izraela na pagórku napletków."
  tags: []
"Joz5,4":
  text: "A oto powód, dla którego Jozue ich obrzezał: Cały lud, który wyszedł z Egiptu, płci męskiej, wszyscy wojownicy, pomarli na pustyni, w drodze po wyjściu z Egiptu."
  tags: []
"Joz5,5":
  text: "Cały lud, który wyszedł, był obrzezany. Lecz cały lud, który urodził się na pustyni, w drodze po wyjściu z Egiptu, nie był obrzezany."
  tags: []
"Joz5,6":
  text: "Czterdzieści lat bowiem synowie Izraela chodzili po pustyni, aż wymarł cały naród wojowników, którzy wyszli z Egiptu, gdyż nie słuchali głosu PANA. Przysiągł im PAN, że nie pozwoli im zobaczyć ziemi, którą PAN pod przysięgą obiecał ich ojcom, że nam ją da, ziemię opływającą mlekiem i miodem."
  tags: []
"Joz5,7":
  text: "Ich synów, których wzbudził na ich miejsce, Jozue obrzezał. Byli bowiem nieobrzezani, gdyż ich nie obrzezano w drodze."
  tags: []
"Joz5,8":
  text: "A gdy już cały lud został obrzezany, pozostał on na swoim miejscu w obozie aż do wyzdrowienia."
  tags: []
"Joz5,9":
  text: "Potem PAN powiedział do Jozuego: Dzisiaj zdjąłem z was hańbę Egiptu. Dlatego to miejsce nazywa się Gilgal aż do dziś."
  tags: []
"Joz5,10":
  text: "Wtedy synowie Izraela rozbili obóz w Gilgal i obchodzili święto Paschy czternastego dnia tego miesiąca, wieczorem, na równinach Jerycha."
  tags: []
"Joz5,11":
  text: "Nazajutrz po święcie Paschy jedli z plonów tej ziemi, chleby przaśne i prażone ziarno, tego samego dnia."
  tags: []
"Joz5,12":
  text: "I następnego dnia po tym, jak zaczęli jeść zboża tej ziemi, ustała manna; i synowie Izraela już więcej manny nie mieli, ale jedli tegoroczne plony ziemi Kanaan."
  tags: []
"Joz5,13":
  text: "A gdy Jozue był w pobliżu Jerycha, podniósł oczy i spojrzał, a oto mąż stał naprzeciw niego z wydobytym mieczem w ręku. Jozue podszedł do niego i zapytał: Czy ty jesteś po naszej stronie, czy po stronie naszych wrogów?"
  tags: []
"Joz5,14":
  text: "A on odpowiedział: Nie, gdyż jako wódz wojska PANA teraz przyszedłem. Wtedy Jozue upadł twarzą do ziemi, oddał pokłon i zapytał: Co mój Pan rozkaże swemu słudze?"
  tags: []
"Joz5,15":
  text: "I wódz wojska PANA powiedział do Jozuego: Zdejmij obuwie ze swoich nóg, bo miejsce, na którym stoisz, jest święte. I Jozue tak uczynił."
  tags: []
