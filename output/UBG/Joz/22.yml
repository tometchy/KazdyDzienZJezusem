"Joz22,1":
  text: "Wtedy Jozue przywołał Rubenitów, Gadytów oraz połowę pokolenia Manassesa;"
  tags: []
"Joz22,2":
  text: "I powiedział do nich: Strzegliście wszystkiego, co wam nakazał Mojżesz, sługa PANA, i byliście posłuszni memu głosowi we wszystkim, co wam nakazałem."
  tags: []
"Joz22,3":
  text: "Nie opuściliście swoich braci przez ten długi czas aż do dziś, ale strzegliście pilnie rozkazu PANA, waszego Boga."
  tags: []
"Joz22,4":
  text: "A teraz PAN, wasz Bóg, dał odpoczynek waszym braciom, jak im obiecał. Zawróćcie więc teraz i idźcie do waszych namiotów i do ziemi waszej własności, którą dał wam Mojżesz, sługa PANA, po drugiej stronie Jordanu."
  tags: []
"Joz22,5":
  text: "Tylko uważajcie pilnie, by zachować przykazanie i prawo, które nakazał wam Mojżesz, sługa PANA – abyście miłowali PANA, swojego Boga, kroczyli wszystkimi jego drogami, zachowywali jego przykazania, lgnęli do niego i służyli mu z całego swego serca i z całej swej duszy."
  tags: []
"Joz22,6":
  text: "Potem Jozue błogosławił im i odesłał ich, a oni odeszli do swoich namiotów."
  tags: []
"Joz22,7":
  text: "Mojżesz bowiem dał jednej połowie pokolenia Manassesa posiadłość w Baszanie, ale drugiej jego połowie Jozue dał dział z ich braćmi po zachodniej stronie Jordanu. A gdy Jozue odesłał ich do ich namiotów, błogosławił im."
  tags: []
"Joz22,8":
  text: "I powiedział do nich: Wracajcie z wielkimi bogactwami do waszych namiotów, z bardzo licznymi stadami, ze srebrem, złotem, miedzią i żelazem oraz z wielką liczbą szat. Podzielcie się ze swymi braćmi łupem po waszych wrogach."
  tags: []
"Joz22,9":
  text: "Wtedy synowie Rubena i synowie Gada oraz połowa pokolenia Manassesa zawrócili i opuścili synów Izraela w Szilo, które leży w ziemi Kanaan, aby pójść do ziemi Gilead, do ziemi swojej własności, którą dziedzicznie otrzymali zgodnie ze słowem PANA za pośrednictwem Mojżesza."
  tags: []
"Joz22,10":
  text: "I gdy przybyli w okolice Jordanu położone w ziemi Kanaan synowie Rubena i synowie Gada oraz połowa pokolenia Manassesa, zbudowali tam ołtarz nad Jordanem, ołtarz wielki i okazały."
  tags: []
"Joz22,11":
  text: "I synowie Izraela usłyszeli, że mówiono: Oto synowie Rubena, synowie Gada i połowa pokolenia Manassesa zbudowali ołtarz naprzeciw ziemi Kanaan w okolicy Jordanu, gdzie przeszli synowie Izraela."
  tags: []
"Joz22,12":
  text: "Gdy więc synowie Izraela o tym usłyszeli, zebrało się całe zgromadzenie synów Izraela w Szilo, aby wyruszyć przeciw nim na wojnę."
  tags: []
"Joz22,13":
  text: "I synowie Izraela wysłali do synów Rubena, synów Gada i połowy pokolenia Manassesa, do ziemi Gilead, Pinchasa, syna kapłana Eleazara;"
  tags: []
"Joz22,14":
  text: "A z nim dziesięciu naczelników, po jednym z każdego rodu ze wszystkich pokoleń Izraela; każdy naczelnik był głową rodu swoich ojców wśród tysięcy Izraela."
  tags: []
"Joz22,15":
  text: "Ci przyszli do synów Rubena, synów Gada i połowy pokolenia Manassesa, do ziemi Gilead, i powiedzieli do nich:"
  tags: []
"Joz22,16":
  text: "Tak mówi całe zgromadzenie PANA: Cóż to za przestępstwo, którego się dopuściliście wobec Boga Izraela, że odwróciliście się dziś od PANA, budując sobie ołtarz, aby zbuntować się dziś przeciw PANU?"
  tags: []
"Joz22,17":
  text: "Czy mało nam nieprawości popełnionej w Peor, z której nie jesteśmy oczyszczeni po dziś dzień, a za którą na zgromadzenie PANA spadła plaga;"
  tags: []
"Joz22,18":
  text: "Że wy dziś odwróciliście się, żeby nie pójść za PANEM? A ponieważ buntujecie się dziś przeciw PANU, jutro on rozgniewa się na całe zgromadzenie Izraela."
  tags: []
"Joz22,19":
  text: "A jeśli ziemia waszej posiadłości jest nieczysta, przeprowadźcie się do ziemi dziedzictwa PANA, w której znajduje się przybytek PANA, i weźcie sobie posiadłości pośród nas; tylko nie buntujcie się przeciw PANU ani nie buntujcie się przeciwko nam, budując sobie ołtarz poza ołtarzem PANA, naszego Boga."
  tags: []
"Joz22,20":
  text: "Czy to nie Akan, syn Zeracha, dopuścił się przestępstwa przy rzeczach przeklętych i czy gniew nie spadł na całe zgromadzenie Izraela? I nie tylko on umarł za swoją nieprawość."
  tags: []
"Joz22,21":
  text: "Wtedy synowie Rubena, synowie Gada i połowa pokolenia Manassesa odpowiedzieli naczelnikom nad tysiącami Izraela:"
  tags: []
"Joz22,22":
  text: "PAN, Bóg bogów, PAN, Bóg bogów, on wie, i Izrael też się dowie: Jeśli stało się to przez bunt albo przestępstwo przeciw PANU – niech nas dziś nie oszczędzi;"
  tags: []
"Joz22,23":
  text: "Jeśli zbudowaliśmy sobie ołtarz, aby się odwrócić od PANA i aby składać na nim całopalenia i ofiary pokarmowe lub pojednawcze, to niech PAN to rozezna;"
  tags: []
"Joz22,24":
  text: "Czy nie zrobiliśmy tak raczej z obawy przed tym, że w przyszłości wasi synowie powiedzą naszym synom: Cóż wy macie wspólnego z PANEM, Bogiem Izraela?"
  tags: []
"Joz22,25":
  text: "Oto PAN ustanowił Jordan granicą między nami a wami, synowie Rubena i synowie Gada; nie macie działu w PANU. W ten sposób wasi synowie odwrócą naszych synów od bojaźni PANA."
  tags: []
"Joz22,26":
  text: "Dlatego powiedzieliśmy: Uczyńmy tak i zbudujmy sobie ołtarz, nie do całopaleń ani do innych ofiar;"
  tags: []
"Joz22,27":
  text: "Lecz aby był świadkiem między nami a wami i między naszymi pokoleniami po nas i abyśmy służyli PANU przed jego obliczem w naszych całopaleniach, ofiarach pokarmowych i ofiarach pojednawczych, aby w przyszłości wasi synowie nie powiedzieli naszym synom: Nie macie udziału w PANU."
  tags: []
"Joz22,28":
  text: "Powiedzieliśmy więc: Gdy w przyszłości tak powiedzą nam albo naszemu potomstwu, wtedy odpowiemy: Patrzcie na podobieństwo ołtarza PANA, który wznieśli nasi ojcowie, nie dla całopaleń ani dla innych ofiar, ale żeby był świadkiem między nami a wami."
  tags: []
"Joz22,29":
  text: "Nie daj Boże, żebyśmy mieli buntować się przeciw PANU i odwrócić się dziś od PANA, budując ołtarz do całopaleń, ofiar pokarmowych i innych ofiar poza ołtarzem PANA, naszego Boga, który znajduje się przed jego przybytkiem."
  tags: []
"Joz22,30":
  text: "A gdy kapłan Pinchas, naczelnicy zgromadzenia i przełożeni nad tysiącami Izraela, którzy z nim byli, usłyszeli słowa, które mówili synowie Rubena, synowie Gada i synowie Manassesa, uznali je za słuszne."
  tags: []
"Joz22,31":
  text: "I Pinchas, syn kapłana Eleazara, powiedział do synów Rubena, synów Gada i synów Manassesa: Dzisiaj przekonaliśmy się, że PAN jest pośród nas, bo nie dopuściliście się tego przestępstwa przeciw PANU i wyzwoliliście synów Izraela z ręki PANA."
  tags: []
"Joz22,32":
  text: "Wtedy Pinchas, syn kapłana Eleazara, oraz naczelnicy powrócili od synów Rubena i od synów Gada z ziemi Gilead do ziemi Kanaan, do synów Izraela, i zdali im sprawę."
  tags: []
"Joz22,33":
  text: "I spodobało się to synom Izraela; synowie Izraela błogosławili Boga i nie mówili więcej o wyruszeniu przeciw nim na wojnę, by zniszczyć ziemię, w której mieszkali synowie Rubena i synowie Gada."
  tags: []
"Joz22,34":
  text: "Synowie Rubena i Gada nazwali ten ołtarz Ed, mówiąc: Świadkiem będzie między nami, że PAN jest Bogiem."
  tags: []
