"Joz16,1":
  text: "A los synów Józefa przypadł od Jordanu przy Jerychu do wód Jerycha na wschodzie, do pustyni, która rozciąga się od Jerycha przez górę Betel;"
  tags: []
"Joz16,2":
  text: "Od Betel biegnie do Luz i dalej do granic Archy, do Atarot."
  tags: []
"Joz16,3":
  text: "Potem ciągnie się ku zachodowi do granicy Jaflety, aż do granicy dolnego Bet-Choron i aż do Gezer, i kończy się przy morzu."
  tags: []
"Joz16,4":
  text: "Tak więc synowie Józefa, Manasses i Efraim, wzięli dziedzictwo."
  tags: []
"Joz16,5":
  text: "A granica synów Efraima według ich rodzin – granica ich dziedzictwa na wschodzie – była od Atarot-Addar aż do górnego Bet-Choron."
  tags: []
"Joz16,6":
  text: "I ta granica biegła w kierunku morza do Mikmetat na północy, potem skręcała na wschód do Taanat-Szilo i przechodziła obok jej wschodniej strony aż do Janocha;"
  tags: []
"Joz16,7":
  text: "I ciągnęła się od Janocha do Atarot i Naarat, i dochodziła do Jerycha, a kończyła się przy Jordanie."
  tags: []
"Joz16,8":
  text: "Od Tappuach granica biegła na zachód do potoku Kana, a kończyła się przy morzu. Takie było dziedzictwo pokolenia synów Efraima według ich rodzin."
  tags: []
"Joz16,9":
  text: "Synowie Efraima mieli też wydzielone miasta pośrodku dziedzictwa synów Manassesa – wszystkie te miasta wraz z przyległymi do nich wioskami."
  tags: []
"Joz16,10":
  text: "I nie wygnali Kananejczyków, mieszkających w Gezer. I mieszkają Kananejczycy pośród Efraimitów aż do dziś, i stali się sługami składającymi daninę."
  tags: []
