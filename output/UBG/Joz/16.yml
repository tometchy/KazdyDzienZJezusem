"Joz16,1": "A los synów Józefa przypadł od Jordanu przy Jerychu do wód Jerycha na wschodzie, do pustyni, która rozciąga się od Jerycha przez górę Betel;"
"Joz16,2": "Od Betel biegnie do Luz i dalej do granic Archy, do Atarot."
"Joz16,3": "Potem ciągnie się ku zachodowi do granicy Jaflety, aż do granicy dolnego Bet-Choron i aż do Gezer, i kończy się przy morzu."
"Joz16,4": "Tak więc synowie Józefa, Manasses i Efraim, wzięli dziedzictwo."
"Joz16,5": "A granica synów Efraima według ich rodzin – granica ich dziedzictwa na wschodzie – była od Atarot-Addar aż do górnego Bet-Choron."
"Joz16,6": "I ta granica biegła w kierunku morza do Mikmetat na północy, potem skręcała na wschód do Taanat-Szilo i przechodziła obok jej wschodniej strony aż do Janocha;"
"Joz16,7": "I ciągnęła się od Janocha do Atarot i Naarat, i dochodziła do Jerycha, a kończyła się przy Jordanie."
"Joz16,8": "Od Tappuach granica biegła na zachód do potoku Kana, a kończyła się przy morzu. Takie było dziedzictwo pokolenia synów Efraima według ich rodzin."
"Joz16,9": "Synowie Efraima mieli też wydzielone miasta pośrodku dziedzictwa synów Manassesa – wszystkie te miasta wraz z przyległymi do nich wioskami."
"Joz16,10": "I nie wygnali Kananejczyków, mieszkających w Gezer. I mieszkają Kananejczycy pośród Efraimitów aż do dziś, i stali się sługami składającymi daninę."
