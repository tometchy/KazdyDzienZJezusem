"Joz11,1": "A gdy usłyszał o tym Jabin, król Chasoru, posłał wiadomość do Jobaba, króla Madonu, do króla Szimronu, do króla Akszafu;"
"Joz11,2": "I do królów, którzy byli na północy, w górach i na polach, na południe od Kinneret, na równinach i w krainach Dor na zachodzie;"
"Joz11,3": "Do Kananejczyków na wschodzie i na zachodzie, do Amorytów, Chetytów, Peryzzytów, Jebusytów w górach i Chiwwitów pod górą Hermon, w ziemi Mispa."
"Joz11,4": "I wyruszyli oni wraz z całym swym wojskiem, lud liczny jak piasek na brzegu morskim, mający bardzo wiele koni i rydwanów."
"Joz11,5": "A gdy wszyscy ci królowie zgromadzili się, przybyli i razem rozbili obóz nad wodami Meromu, aby walczyć przeciwko Izraelowi."
"Joz11,6": "I PAN powiedział do Jozuego: Nie bój się ich, bo jutro o tej porze wydam ich wszystkich pobitych Izraelowi. Ich koniom podetniesz ścięgna, a ich rydwany spalisz ogniem."
"Joz11,7": "Wtedy Jozue i cały waleczny lud z nim wyruszyli niespodziewanie przeciwko nim nad wody Meromu i napadli na nich."
"Joz11,8": "I PAN wydał ich w ręce Izraela, który pobił ich i ścigał aż do Sydonu Wielkiego i aż do Misreft-Maim, i aż do doliny Mispa na wschodzie. Pobili ich tak, że nikogo nie pozostawili przy życiu."
"Joz11,9": "I Jozue uczynił im tak, jak mu PAN rozkazał: ich koniom podciął ścięgna, a ich rydwany spalił ogniem."
"Joz11,10": "W tym czasie Jozue zawrócił i zdobył Chasor, a jego króla zabił mieczem. Chasor bowiem był przedtem głową wszystkich tych królestw."
"Joz11,11": "Każdą duszę, która w nim była, pobili ostrzem miecza, wytracając ją. Nikt nie pozostał przy życiu, a Chasor spalił ogniem."
"Joz11,12": "Jozue zdobył też wszystkie miasta tych królów i pojmał wszystkich królów, pobił ich ostrzem miecza i wytracił, tak jak nakazał Mojżesz, sługa PANA."
"Joz11,13": "Izrael nie spalił jednak żadnego z miast warownych, oprócz samego Chasoru, który spalił Jozue."
"Joz11,14": "Cały łup tych miast oraz bydło synowie Izraela zabrali dla siebie; tylko wszystkich ludzi pobili ostrzem miecza, aż ich zgładzili, nie zostawiając nikogo przy życiu."
"Joz11,15": "Jak PAN rozkazał Mojżeszowi, swemu słudze, tak Mojżesz nakazał Jozuemu i tak Jozue uczynił; nie zaniedbał niczego z tego wszystkiego, co PAN rozkazał Mojżeszowi."
"Joz11,16": "Tak Jozue zdobył całą ziemię: góry i całą ziemię na południu, całą ziemię Goszen, równiny, pola i górę Izrael z jej równiną;"
"Joz11,17": "Od góry Halak, która wznosi się ku Seirowi, aż do Baal-Gad w dolinie Libanu pod górą Hermon. A wszystkich królów pojmał, pobił i pozabijał."
"Joz11,18": "Przez długi czas Jozue prowadził wojnę z tymi wszystkimi królami."
"Joz11,19": "Nie było miasta, które by zawarło pokój z synami Izraela, oprócz Chiwwitów, którzy mieszkali w Gibeonie; wszystkie inne zdobyli podczas wojny."
"Joz11,20": "Od PANA bowiem wyszło, by zatwardzić ich serca, aby wyruszali na bitwę z Izraelem i żeby ich wyniszczył bez miłosierdzia, aż do wytracenia, jak PAN rozkazał Mojżeszowi."
"Joz11,21": "W tym czasie Jozue wyruszył i wytracił Anakitów z gór, z Hebronu, z Debiru, z Anabu, ze wszystkich gór Judy i ze wszystkich gór Izraela. Jozue zniszczył ich razem z ich miastami."
"Joz11,22": "Nikt z Anakitów nie został w ziemi synów Izraela; zostali tylko w Gazie, w Gat i w Azdodzie."
"Joz11,23": "Zdobył więc Jozue całą ziemię, tak jak PAN powiedział do Mojżesza, i oddał ją Jozue jako dziedzictwo Izraelowi zgodnie z ich przydziałami według pokoleń. I ziemia zaznała pokoju od wojny."
