"Joz18,1": "Wtedy całe zgromadzenie synów Izraela zebrało się w Szilo i wznieśli tam Namiot Zgromadzenia, gdyż ziemia została przez nich opanowana."
"Joz18,2": "A pozostało wśród synów Izraela siedem pokoleń, którym nie przydzielono ich dziedzictwa."
"Joz18,3": "Wtedy Jozue powiedział do synów Izraela: Jak długo będziecie zwlekać z tym, aby wejść i posiąść ziemię, którą dał wam PAN, Bóg waszych ojców?"
"Joz18,4": "Wybierzcie spośród siebie po trzech mężczyzn z każdego pokolenia, których poślę, aby obeszli ziemię i opisali ją według ich dziedzictwa, a potem powrócą do mnie."
"Joz18,5": "I podzielą ją na siedem części: Juda pozostanie w swych granicach na południu, a dom Józefa pozostanie w swych granicach na północy."
"Joz18,6": "Sporządźcie więc opis ziemi, dzieląc ją na siedem części, i przynieście go tu do mnie, a ja rzucę dla was losy tu przed PANEM, naszym Bogiem."
"Joz18,7": "Lewici bowiem nie mają działu pośród was, gdyż ich dziedzictwem jest kapłaństwo PANA; a Gad, Ruben i połowa pokolenia Manassesa otrzymali swe dziedzictwa po wschodniej stronie Jordanu, które dał im Mojżesz, sługa PANA."
"Joz18,8": "Wtedy ci mężczyźni wstali i poszli, a Jozue nakazał tym, którzy szli, aby opisali ziemię: Idźcie i obejdźcie ziemię, i opiszcie ją, a potem wróćcie do mnie, a ja rzucę dla was losy przed PANEM tu, w Szilo."
"Joz18,9": "Odeszli więc ci mężczyźni i obchodzili ziemię, i opisali ją w księdze według miast, dzieląc na siedem części; potem wrócili do Jozuego, do obozu w Szilo."
"Joz18,10": "I Jozue rzucił dla nich losy w Szilo przed PANEM, i tam podzielił Jozue ziemię synom Izraela według ich przydziałów."
"Joz18,11": "I padł los dla pokolenia synów Beniamina według ich rodzin, a granica ich losu wypadła między synami Judy a synami Józefa."
"Joz18,12": "Ich granica po stronie północnej zaczynała się od Jordanu, biegła na północne zbocze Jerycha, ciągnęła się przez góry na zachód i kończyła się przy pustyni Bet-Awen."
"Joz18,13": "A stamtąd granica biegła do Luz, od strony południowej Luz, czyli Betel, a schodziła do Atarot-Addar pod górę, która leży na południe od dolnego Bet-Choron."
"Joz18,14": "Potem granica skręcała obok morza na południe od góry położonej naprzeciw Bet-Choron na południu, i kończyła się w Kiriat-Baal, czyli Kiriat-Jearim, mieście synów Judy. To jest strona zachodnia."
"Joz18,15": "Strona zaś południowa zaczynała się od końca Kiriat-Jearim; następnie granica biegła na zachód i dochodziła do źródła wód Neftoach."
"Joz18,16": "I granica ta ciągnęła się do końca góry położonej naprzeciw doliny syna Hinnom, leżącej w dolinie Refaim na północy, i schodziła do doliny Hinnom po stronie Jebus na południe, i stamtąd biegła do źródła Rogiel."
"Joz18,17": "Potem skręcała na północ i dochodziła do En-Szemesz, i dalej do Gelilot, które jest naprzeciw wzniesienia Adummim, stamtąd schodziła do kamienia Bohana, syna Rubena."
"Joz18,18": "Następnie przebiegała ku zboczu, które było naprzeciw Araby na północ, i ciągnęła się do Araby."
"Joz18,19": "Stamtąd granica biegła do zbocza Bet-Chogla na północy, a kończyła się przy zatoce północnej Morza Słonego, na południu od ujścia Jordanu. To była granica południowa."
"Joz18,20": "Jordan zaś stanowi granicę od strony wschodniej. To było dziedzictwo synów Beniamina według otaczających jego granic, według ich rodzin."
"Joz18,21": "A miastami pokolenia synów Beniamina według ich rodzin były: Jerycho, Bet-Chogla i dolina Kesis;"
"Joz18,22": "Bet-Araba, Semaraim, Betel;"
"Joz18,23": "Awwim, Para, Ofra;"
"Joz18,24": "Kefar-Ammonaj, Ofni i Geba: dwanaście miast wraz z przyległymi do nich wioskami."
"Joz18,25": "Gibeon, Rama, Beerot;"
"Joz18,26": "Mispa, Kefira, Mosa;"
"Joz18,27": "Rekem, Jerpeel, Tarala;"
"Joz18,28": "Sela, Elef, Jebus, czyli Jerozolima, Gibeat i Kiriat: czternaście miast wraz z przyległymi do nich wioskami. To było dziedzictwo synów Beniamina według ich rodzin."
