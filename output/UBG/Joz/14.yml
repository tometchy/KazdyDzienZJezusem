"Joz14,1":
  text: "A oto co synowie Izraela odziedziczyli w ziemi Kanaan, co przydzielili im jako dziedzictwo kapłan Eleazar i Jozue, syn Nuna, oraz naczelnicy wśród ojców pokoleń synów Izraela."
  tags: []
"Joz14,2":
  text: "Ich dziedzictwa dokonano za pomocą losów, jak PAN rozkazał przez Mojżesza, dla dziewięciu i pół pokolenia."
  tags: []
"Joz14,3":
  text: "Gdyż Mojżesz dał dziedzictwo dwom pokoleniom i połowie pokolenia za Jordanem, ale Lewitom nie dał dziedzictwa wśród nich."
  tags: []
"Joz14,4":
  text: "Synowie Józefa stanowili bowiem dwa pokolenia: Manassesa i Efraima. Lewitom więc nie dano udziału w ziemi oprócz miast do zamieszkania z przyległymi do nich pastwiskami dla ich stad i dobytku."
  tags: []
"Joz14,5":
  text: "Jak PAN rozkazał Mojżeszowi, tak postąpili synowie Izraela i podzielili ziemię."
  tags: []
"Joz14,6":
  text: "Wtedy synowie Judy przyszli do Jozuego w Gilgal i powiedział do niego Kaleb, syn Jefunnego, Kenizzyta: Ty wiesz, co PAN powiedział Mojżeszowi, mężowi Boga, o mnie i o tobie w Kadesz-Barnea."
  tags: []
"Joz14,7":
  text: "Miałem czterdzieści lat, gdy Mojżesz, sługa PANA, posłał mnie z Kadesz-Barnea na wybadanie ziemi i przyniosłem mu wiadomość zgodnie z tym, co miałem w sercu."
  tags: []
"Joz14,8":
  text: "Lecz moi bracia, którzy chodzili ze mną, zatrwożyli serce ludu. Ja zaś poszedłem całkowicie za PANEM, swoim Bogiem."
  tags: []
"Joz14,9":
  text: "W tym dniu Mojżesz przysiągł: Zaprawdę, ziemia, którą deptała twoja noga, stanie się dziedzictwem twoim i twoich synów na wieki, ponieważ całkowicie poszedłeś za PANEM, moim Bogiem."
  tags: []
"Joz14,10":
  text: "A teraz oto PAN zachował mnie przy życiu, jak powiedział; już minęło czterdzieści pięć lat od tego czasu, kiedy PAN powiedział to do Mojżesza, gdy Izraelici wędrowali po pustyni. I oto mam dziś osiemdziesiąt pięć lat;"
  tags: []
"Joz14,11":
  text: "A jeszcze dziś jestem tak silny, jak byłem w tym dniu, gdy Mojżesz mnie wysłał. Jaka wtedy była moja siła, taka jest teraz moja siła do wojny, by wyruszać i wracać."
  tags: []
"Joz14,12":
  text: "Teraz więc daj mi tę górę, o której PAN powiedział w owym dniu. Sam bowiem słyszałeś tego dnia, że tam są Anakici, a miasta są wielkie i warowne. Jeśli PAN będzie ze mną, wypędzę ich, jak mi PAN obiecał."
  tags: []
"Joz14,13":
  text: "I Jozue błogosławił mu, i dał Kalebowi, synowi Jefunnego, Hebron w dziedzictwo."
  tags: []
"Joz14,14":
  text: "Dlatego Hebron stał się dziedzictwem Kaleba, syna Jefunnego Kenizzyty, aż do dziś, bo całkowicie poszedł za PANEM, Bogiem Izraela."
  tags: []
"Joz14,15":
  text: "A Hebron zwano wcześniej Kiriat-Arba. Arba był wielkim człowiekiem wśród Anakitów. A ziemia zaznała pokoju od wojny."
  tags: []
