"Joz24,1":
  text: "Potem Jozue zebrał wszystkie pokolenia Izraela w Sychem i zwołał starszych Izraela, jego naczelników, jego sędziów i jego przełożonych, a ci stawili się przed Bogiem."
  tags: []
"Joz24,2":
  text: "I Jozue powiedział do całego ludu: Tak mówi PAN, Bóg Izraela: Po drugiej stronie rzeki mieszkali od dawnych czasów wasi ojcowie, Terach, ojciec Abrahama i Nachora, i służyli obcym bogom."
  tags: []
"Joz24,3":
  text: "Wtedy zabrałem waszego ojca Abrahama z drugiej strony rzeki i prowadziłem go przez całą ziemię Kanaan, i rozmnożyłem jego potomstwo, dając mu Izaaka."
  tags: []
"Joz24,4":
  text: "Dałem też Izaakowi Jakuba i Ezawa, a Ezawowi dałem górę Seir, aby ją posiadł, ale Jakub i jego synowie zeszli do Egiptu."
  tags: []
"Joz24,5":
  text: "I posłałem Mojżesza i Aarona, i ukarałem Egipt plagami, które uczyniłem pośród niego. Potem wyprowadziłem was."
  tags: []
"Joz24,6":
  text: "I wyprowadziłem waszych ojców z Egiptu, i przybyliście nad morze, a Egipcjanie ścigali waszych ojców na rydwanach i koniach aż do Morza Czerwonego."
  tags: []
"Joz24,7":
  text: "Wtedy wołali do PANA, a on uczynił ciemność między wami a Egipcjanami i sprowadził na nich morze, które ich okryło. Wasze oczy widziały, co uczyniłem w Egipcie. I przebywaliście na pustyni przez długi czas."
  tags: []
"Joz24,8":
  text: "Potem przyprowadziłem was do ziemi Amorytów mieszkających za Jordanem, którzy walczyli przeciwko wam; ale oddałem ich w wasze ręce i posiedliście ich ziemię, a zgładziłem ich przed wami."
  tags: []
"Joz24,9":
  text: "Powstał też Balak, syn Sippora, król Moabu, aby walczyć przeciw Izraelowi. Posłał też i wezwał Balaama, syna Beora, aby was przeklinał."
  tags: []
"Joz24,10":
  text: "I nie chciałem słuchać Balaama; dlatego raczej błogosławił wam. I tak wybawiłem was z jego rąk."
  tags: []
"Joz24,11":
  text: "Przeprawiliście się potem przez Jordan i przyszliście do Jerycha. I walczyli przeciwko wam ludzie z Jerycha, a także Amoryci, Peryzzyci, Kananejczycy, Chetyci, Girgaszyci, Chiwwici i Jebusyci, ale oddałem ich w wasze ręce."
  tags: []
"Joz24,12":
  text: "I wysłałem przed wami szerszenie, które wypędziły przed wami dwóch królów amoryckich – nie twoim mieczem ani twoim łukiem."
  tags: []
"Joz24,13":
  text: "I dałem wam ziemię, na której nie trudziliście się, i miasta, których nie budowaliście, a w których mieszkacie; spożywacie z winnic i sadów oliwnych, których nie sadziliście."
  tags: []
"Joz24,14":
  text: "Teraz więc bójcie się PANA i służcie mu w szczerości i prawdzie. Usuńcie bogów, którym służyli wasi ojcowie za rzeką i w Egipcie, a służcie PANU."
  tags: []
"Joz24,15":
  text: "A jeśli wam się zdaje, że źle jest służyć PANU, wybierzcie sobie dziś, komu będziecie służyć: czy bogom, którym służyli wasi ojcowie po drugiej stronie rzeki, czy bogom Amorytów, w których ziemi mieszkacie. Lecz ja i mój dom będziemy służyli PANU."
  tags: []
"Joz24,16":
  text: "I lud odpowiedział: Nie daj Boże, byśmy mieli opuścić PANA, a służyć cudzym bogom."
  tags: []
"Joz24,17":
  text: "PAN bowiem, nasz Bóg, to on wyprowadził nas i naszych ojców z ziemi Egiptu, z domu niewoli, i uczynił na naszych oczach te wielkie znaki, i strzegł nas przez całą drogę, którą szliśmy, i wśród wszystkich ludów, między którymi przechodziliśmy;"
  tags: []
"Joz24,18":
  text: "I PAN wypędził przed nami wszystkie ludy i Amorytów mieszkających na tej ziemi. Tak więc będziemy służyli PANU, bo on jest naszym Bogiem."
  tags: []
"Joz24,19":
  text: "Wtedy Jozue powiedział do ludu: Nie możecie służyć PANU, gdyż on jest Bogiem świętym, Bogiem zazdrosnym, nie przebaczy waszych przestępstw ani waszych grzechów."
  tags: []
"Joz24,20":
  text: "Jeśli opuścicie PANA, a będziecie służyli cudzym bogom, odwróci się od was, ześle na was nieszczęście i zniszczy was, choć przedtem dobrze wam czynił."
  tags: []
"Joz24,21":
  text: "I lud odpowiedział Jozuemu: Nie tak, ale PANU będziemy służyć."
  tags: []
"Joz24,22":
  text: "Wtedy Jozue powiedział do ludu: Sami jesteście świadkami przeciwko sobie, że wybraliście sobie PANA, aby mu służyć. A oni powiedzieli: Jesteśmy świadkami."
  tags: []
"Joz24,23":
  text: "I powiedział: Teraz więc usuńcie cudzych bogów, którzy są pośród was, i zwróćcie wasze serca ku PANU, Bogu Izraela."
  tags: []
"Joz24,24":
  text: "I lud odpowiedział Jozuemu: PANU, naszemu Bogu, będziemy służyć i jego głosu będziemy słuchać."
  tags: []
"Joz24,25":
  text: "Tak zawarł Jozue w tym dniu przymierze z ludem i nadał mu w Sychem prawo i nakaz."
  tags: []
"Joz24,26":
  text: "I Jozue spisał te słowa w księdze Prawa Bożego, wziął też wielki kamień i postawił go pod dębem, który był przy świątyni PANA."
  tags: []
"Joz24,27":
  text: "Wtedy Jozue powiedział do całego ludu: Oto ten kamień będzie dla nas świadkiem, gdyż słyszał wszystkie słowa PANA, które powiedział do nas, i będzie świadkiem przeciwko wam, byście się nie wyparli swojego Boga."
  tags: []
"Joz24,28":
  text: "Potem Jozue odesłał lud, każdego do swego dziedzictwa."
  tags: []
"Joz24,29":
  text: "Po tych wydarzeniach umarł Jozue, syn Nuna, sługa PANA, mając sto dziesięć lat."
  tags: []
"Joz24,30":
  text: "I pogrzebali go na obszarze jego dziedzictwa w Timnat-Serach, które znajduje się na górze Efraim, na północ od góry Gaasz."
  tags: []
"Joz24,31":
  text: "Izrael służył PANU przez wszystkie dni Jozuego i przez wszystkie dni starszych, którzy przeżyli Jozuego, a którzy znali wszystkie dzieła PANA, jakie czynił dla Izraela."
  tags: []
"Joz24,32":
  text: "A kości Józefa, które synowie Izraela przenieśli z Egiptu, pogrzebali w Sychem, na części pola, które Jakub kupił od synów Chamora, ojca Sychema, za sto monet. I stało się ono dziedzictwem synów Józefa."
  tags: []
"Joz24,33":
  text: "Umarł również Eleazar, syn Aarona, i pogrzebali go na pagórku Pinchasa, jego syna, który został mu dany na górze Efraim."
  tags: []
