"Joz21,1":
  text: "Wtedy naczelnicy wśród ojców Lewitów przyszli do kapłana Eleazara, do Jozuego, syna Nuna, i do naczelników wśród ojców pokoleń synów Izraela."
  tags: []
"Joz21,2":
  text: "I powiedzieli do nich w Szilo, w ziemi Kanaan: PAN rozkazał przez Mojżesza, abyście nam dali miasta do mieszkania wraz z ich pastwiskami dla naszego bydła."
  tags: []
"Joz21,3":
  text: "Synowie Izraela dali więc Lewitom ze swego dziedzictwa zgodnie ze słowem PANA te miasta oraz ich pastwiska."
  tags: []
"Joz21,4":
  text: "Padł los dla rodzin Kehatytów: synowie kapłana Aarona spośród Lewitów otrzymali losem trzynaście miast od pokolenia Judy, od pokolenia Symeona i od pokolenia Beniamina."
  tags: []
"Joz21,5":
  text: "A pozostali synowie Kehata otrzymali losem dziesięć miast od rodzin pokolenia Efraima, od pokolenia Dana i od połowy pokolenia Manassesa."
  tags: []
"Joz21,6":
  text: "A synowie Gerszona otrzymali losem trzynaście miast od rodzin pokolenia Issachara, od pokolenia Aszera, od pokolenia Neftalego i od połowy pokolenia Manassesa w Baszanie."
  tags: []
"Joz21,7":
  text: "Także synowie Merariego według swoich rodzin otrzymali dwanaście miast od pokolenia Rubena, od pokolenia Gada i od pokolenia Zebulona."
  tags: []
"Joz21,8":
  text: "Synowie Izraela dali więc Lewitom przez losowanie te miasta i ich pastwiska, jak rozkazał PAN przez Mojżesza."
  tags: []
"Joz21,9":
  text: "Dali z pokolenia synów Judy i z pokolenia synów Symeona następujące miasta wymienione z nazwy."
  tags: []
"Joz21,10":
  text: "I otrzymali je synowie Aarona, z rodzin Kehatytów, spośród synów Lewiego, gdyż dla nich padł pierwszy los."
  tags: []
"Joz21,11":
  text: "I dano im miasto Arba, ojca Anaka, czyli Hebron, w górach Judy i leżące wokół niego pastwiska;"
  tags: []
"Joz21,12":
  text: "Ale pole tego miasta i przyległe do niego wioski dano w posiadanie Kalebowi, synowi Jefunnego."
  tags: []
"Joz21,13":
  text: "Synom kapłana Aarona dano miasto schronienia dla zabójcy: Hebron i jego pastwiska, a także Libnę i jej pastwiska;"
  tags: []
"Joz21,14":
  text: "Jattir i jego pastwiska, Esztemoa i jego pastwiska;"
  tags: []
"Joz21,15":
  text: "Cholon i jego pastwiska, Debir i jego pastwiska;"
  tags: []
"Joz21,16":
  text: "Ain i jego pastwiska, Juttę i jej pastwiska oraz Bet-Szemesz i jego pastwiska: dziewięć miast od tych dwóch pokoleń."
  tags: []
"Joz21,17":
  text: "A od pokolenia Beniamina: Gibeon i jego pastwiska, Gebę i jej pastwiska;"
  tags: []
"Joz21,18":
  text: "Anatot i jego pastwiska, Almon i jego pastwiska: cztery miasta."
  tags: []
"Joz21,19":
  text: "Wszystkich miast synów Aarona, kapłanów, było trzynaście wraz z ich pastwiskami."
  tags: []
"Joz21,20":
  text: "Ale rodzinom synów Kehata, Lewitom, którzy pozostali z synów Kehata, dano przez losowanie miasta od pokolenia Efraima."
  tags: []
"Joz21,21":
  text: "A dano im miasto schronienia dla zabójcy: Sychem i jego pastwiska na górze Efraim, a także Gezer i jego pastwiska;"
  tags: []
"Joz21,22":
  text: "Kibsaim i jego pastwiska oraz Bet-Choron i jego pastwiska: cztery miasta."
  tags: []
"Joz21,23":
  text: "Także od pokolenia Dana: Elteko i jego pastwiska, Gibbaton i jego pastwiska;"
  tags: []
"Joz21,24":
  text: "Ajjalon i jego pastwiska, Gat-Rimmon i jego pastwiska: cztery miasta."
  tags: []
"Joz21,25":
  text: "A od połowy pokolenia Manassesa: Tanak i jego pastwiska oraz Gat-Rimmon i jego pastwiska: dwa miasta."
  tags: []
"Joz21,26":
  text: "Wszystkich miast wraz z ich pastwiskami dla pozostałych rodzin synów Kehata było dziesięć."
  tags: []
"Joz21,27":
  text: "Synom Gerszona, z rodzin Lewiego, dano od połowy pokolenia Manassesa miasta schronienia dla zabójcy: Golan w Baszanie i jego pastwiska oraz Beeszterę i jej pastwiska: dwa miasta."
  tags: []
"Joz21,28":
  text: "Od pokolenia Issachara Kiszjon i jego pastwiska, Dobrat i jego pastwiska;"
  tags: []
"Joz21,29":
  text: "Jarmut i jego pastwiska oraz En-Gannim i jego pastwiska: cztery miasta."
  tags: []
"Joz21,30":
  text: "A od pokolenia Aszera Miszeal i jego pastwiska, Abdon i jego pastwiska;"
  tags: []
"Joz21,31":
  text: "Chelkat i jego pastwiska oraz Rechob i jego pastwiska: cztery miasta."
  tags: []
"Joz21,32":
  text: "A od pokolenia Neftalego dano miasto schronienia dla zabójcy: Kedesz w Galilei i jego pastwiska, Chammot-Dor i jego pastwiska oraz Kartan i jego pastwiska: trzy miasta."
  tags: []
"Joz21,33":
  text: "Wszystkich miast dla Gerszonitów według ich rodzin było trzynaście wraz z ich pastwiskami."
  tags: []
"Joz21,34":
  text: "Potem rodzinom synów Merariego, pozostałym Lewitom, dano od pokolenia Zebulona: Jokneam i jego pastwiska, Kartę i jej pastwiska;"
  tags: []
"Joz21,35":
  text: "Dimnę i jej pastwiska, Nahalal i jego pastwiska: cztery miasta."
  tags: []
"Joz21,36":
  text: "A od pokolenia Rubena Beser i jego pastwiska, Jahaza i jej pastwiska;"
  tags: []
"Joz21,37":
  text: "Kedemot i jego pastwiska, Mefaat i jego pastwiska: cztery miasta."
  tags: []
"Joz21,38":
  text: "Od pokolenia Gada dano miasta schronienia dla zabójcy: Ramot w Gileadzie i jego pastwiska, Machanaim i jego pastwiska;"
  tags: []
"Joz21,39":
  text: "Cheszbon i jego pastwiska, Jazer i jego pastwiska: razem cztery miasta."
  tags: []
"Joz21,40":
  text: "Wszystkich miast przydzielonych losem dla synów Merariego według ich rodzin, którzy jeszcze pozostali z rodzin Lewitów, było dwanaście."
  tags: []
"Joz21,41":
  text: "Wszystkich miast Lewitów pośród dziedzictwa synów Izraela było czterdzieści osiem wraz z ich pastwiskami."
  tags: []
"Joz21,42":
  text: "A każde z tych miast miało dokoła siebie pastwiska; tak było z każdym z tych miast."
  tags: []
"Joz21,43":
  text: "Dał więc PAN Izraelowi całą ziemię, którą przysiągł dać ich ojcom; i posiedli ją, i mieszkali w niej."
  tags: []
"Joz21,44":
  text: "Dał im PAN także odpoczynek ze wszystkich stron, tak jak przysiągł ich ojcom. Nie ostał się przed nimi nikt spośród wszystkich ich wrogów, wszystkich ich wrogów wydał PAN w ich ręce."
  tags: []
"Joz21,45":
  text: "Nie zawiodło żadne słowo ze wszystkich dobrych słów, które PAN obiecał domowi Izraela; wszystko się wypełniło."
  tags: []
