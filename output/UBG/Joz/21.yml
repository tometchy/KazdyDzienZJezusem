"Joz21,1": "Wtedy naczelnicy wśród ojców Lewitów przyszli do kapłana Eleazara, do Jozuego, syna Nuna, i do naczelników wśród ojców pokoleń synów Izraela."
"Joz21,2": "I powiedzieli do nich w Szilo, w ziemi Kanaan: PAN rozkazał przez Mojżesza, abyście nam dali miasta do mieszkania wraz z ich pastwiskami dla naszego bydła."
"Joz21,3": "Synowie Izraela dali więc Lewitom ze swego dziedzictwa zgodnie ze słowem PANA te miasta oraz ich pastwiska."
"Joz21,4": "Padł los dla rodzin Kehatytów: synowie kapłana Aarona spośród Lewitów otrzymali losem trzynaście miast od pokolenia Judy, od pokolenia Symeona i od pokolenia Beniamina."
"Joz21,5": "A pozostali synowie Kehata otrzymali losem dziesięć miast od rodzin pokolenia Efraima, od pokolenia Dana i od połowy pokolenia Manassesa."
"Joz21,6": "A synowie Gerszona otrzymali losem trzynaście miast od rodzin pokolenia Issachara, od pokolenia Aszera, od pokolenia Neftalego i od połowy pokolenia Manassesa w Baszanie."
"Joz21,7": "Także synowie Merariego według swoich rodzin otrzymali dwanaście miast od pokolenia Rubena, od pokolenia Gada i od pokolenia Zebulona."
"Joz21,8": "Synowie Izraela dali więc Lewitom przez losowanie te miasta i ich pastwiska, jak rozkazał PAN przez Mojżesza."
"Joz21,9": "Dali z pokolenia synów Judy i z pokolenia synów Symeona następujące miasta wymienione z nazwy."
"Joz21,10": "I otrzymali je synowie Aarona, z rodzin Kehatytów, spośród synów Lewiego, gdyż dla nich padł pierwszy los."
"Joz21,11": "I dano im miasto Arba, ojca Anaka, czyli Hebron, w górach Judy i leżące wokół niego pastwiska;"
"Joz21,12": "Ale pole tego miasta i przyległe do niego wioski dano w posiadanie Kalebowi, synowi Jefunnego."
"Joz21,13": "Synom kapłana Aarona dano miasto schronienia dla zabójcy: Hebron i jego pastwiska, a także Libnę i jej pastwiska;"
"Joz21,14": "Jattir i jego pastwiska, Esztemoa i jego pastwiska;"
"Joz21,15": "Cholon i jego pastwiska, Debir i jego pastwiska;"
"Joz21,16": "Ain i jego pastwiska, Juttę i jej pastwiska oraz Bet-Szemesz i jego pastwiska: dziewięć miast od tych dwóch pokoleń."
"Joz21,17": "A od pokolenia Beniamina: Gibeon i jego pastwiska, Gebę i jej pastwiska;"
"Joz21,18": "Anatot i jego pastwiska, Almon i jego pastwiska: cztery miasta."
"Joz21,19": "Wszystkich miast synów Aarona, kapłanów, było trzynaście wraz z ich pastwiskami."
"Joz21,20": "Ale rodzinom synów Kehata, Lewitom, którzy pozostali z synów Kehata, dano przez losowanie miasta od pokolenia Efraima."
"Joz21,21": "A dano im miasto schronienia dla zabójcy: Sychem i jego pastwiska na górze Efraim, a także Gezer i jego pastwiska;"
"Joz21,22": "Kibsaim i jego pastwiska oraz Bet-Choron i jego pastwiska: cztery miasta."
"Joz21,23": "Także od pokolenia Dana: Elteko i jego pastwiska, Gibbaton i jego pastwiska;"
"Joz21,24": "Ajjalon i jego pastwiska, Gat-Rimmon i jego pastwiska: cztery miasta."
"Joz21,25": "A od połowy pokolenia Manassesa: Tanak i jego pastwiska oraz Gat-Rimmon i jego pastwiska: dwa miasta."
"Joz21,26": "Wszystkich miast wraz z ich pastwiskami dla pozostałych rodzin synów Kehata było dziesięć."
"Joz21,27": "Synom Gerszona, z rodzin Lewiego, dano od połowy pokolenia Manassesa miasta schronienia dla zabójcy: Golan w Baszanie i jego pastwiska oraz Beeszterę i jej pastwiska: dwa miasta."
"Joz21,28": "Od pokolenia Issachara Kiszjon i jego pastwiska, Dobrat i jego pastwiska;"
"Joz21,29": "Jarmut i jego pastwiska oraz En-Gannim i jego pastwiska: cztery miasta."
"Joz21,30": "A od pokolenia Aszera Miszeal i jego pastwiska, Abdon i jego pastwiska;"
"Joz21,31": "Chelkat i jego pastwiska oraz Rechob i jego pastwiska: cztery miasta."
"Joz21,32": "A od pokolenia Neftalego dano miasto schronienia dla zabójcy: Kedesz w Galilei i jego pastwiska, Chammot-Dor i jego pastwiska oraz Kartan i jego pastwiska: trzy miasta."
"Joz21,33": "Wszystkich miast dla Gerszonitów według ich rodzin było trzynaście wraz z ich pastwiskami."
"Joz21,34": "Potem rodzinom synów Merariego, pozostałym Lewitom, dano od pokolenia Zebulona: Jokneam i jego pastwiska, Kartę i jej pastwiska;"
"Joz21,35": "Dimnę i jej pastwiska, Nahalal i jego pastwiska: cztery miasta."
"Joz21,36": "A od pokolenia Rubena Beser i jego pastwiska, Jahaza i jej pastwiska;"
"Joz21,37": "Kedemot i jego pastwiska, Mefaat i jego pastwiska: cztery miasta."
"Joz21,38": "Od pokolenia Gada dano miasta schronienia dla zabójcy: Ramot w Gileadzie i jego pastwiska, Machanaim i jego pastwiska;"
"Joz21,39": "Cheszbon i jego pastwiska, Jazer i jego pastwiska: razem cztery miasta."
"Joz21,40": "Wszystkich miast przydzielonych losem dla synów Merariego według ich rodzin, którzy jeszcze pozostali z rodzin Lewitów, było dwanaście."
"Joz21,41": "Wszystkich miast Lewitów pośród dziedzictwa synów Izraela było czterdzieści osiem wraz z ich pastwiskami."
"Joz21,42": "A każde z tych miast miało dokoła siebie pastwiska; tak było z każdym z tych miast."
"Joz21,43": "Dał więc PAN Izraelowi całą ziemię, którą przysiągł dać ich ojcom; i posiedli ją, i mieszkali w niej."
"Joz21,44": "Dał im PAN także odpoczynek ze wszystkich stron, tak jak przysiągł ich ojcom. Nie ostał się przed nimi nikt spośród wszystkich ich wrogów, wszystkich ich wrogów wydał PAN w ich ręce."
"Joz21,45": "Nie zawiodło żadne słowo ze wszystkich dobrych słów, które PAN obiecał domowi Izraela; wszystko się wypełniło."
