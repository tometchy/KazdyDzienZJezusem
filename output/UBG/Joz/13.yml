"Joz13,1": "I gdy Jozue zestarzał się i był w podeszłym wieku, PAN powiedział do niego: Zestarzałeś się i posunąłeś się w latach, a pozostało jeszcze dużo ziemi do zdobycia."
"Joz13,2": "Oto ziemia, która pozostała: wszystkie okręgi Filistynów i Geszurytów;"
"Joz13,3": "Od Szichoru, który jest naprzeciw Egiptu, aż do granicy Akaronu na północy – jest to ziemia przynależąca do Kananejczyków, pięciu książąt filistyńskich: z Gazy, Aszdodu, Aszkelonu, Gat i Ekronu, oraz Awwici;"
"Joz13,4": "Od południa: cała ziemia Kananejczyków oraz Meara, która należy do Sydończyków, aż do Afek i aż do granicy Amorytów;"
"Joz13,5": "I ziemia Gibilitów i cały Liban na wschodzie, od Baal-Gad pod górę Hermon, aż do wejścia do Chamat."
"Joz13,6": "Wszystkich mieszkańców gór od Libanu aż do Misrefot-Maim i wszystkich Sydończyków wypędzę przed synami Izraela. Tylko podziel ją losem między Izraelitów jako dziedzictwo, tak jak ci rozkazałem."
"Joz13,7": "Rozdziel więc teraz tę ziemię jako dziedzictwo dziewięciu pokoleniom i połowie pokolenia Manassesa;"
"Joz13,8": "Gdyż z drugą połową Rubenici i Gadyci otrzymali już swoje dziedzictwo, które dał im Mojżesz za Jordanem na wschodzie, jak przydzielał im Mojżesz, sługa PANA;"
"Joz13,9": "Od Aroeru, leżącego nad brzegiem rzeki Arnon, i od miasta, które jest w środku rzeki, wraz z całą równiną Medeby aż do Dibonu;"
"Joz13,10": "I wszystkie miasta Sichona, króla Amorytów, który królował w Cheszbonie, aż do granicy synów Ammona;"
"Joz13,11": "Także Gilead i obszar Geszurytów i Maakatytów, całą górę Hermon i cały Baszan aż do Salka;"
"Joz13,12": "Całe królestwo Oga w Baszanie, który królował w Asztarot i w Edrei; był on ostatnim z Refaitów, których Mojżesz pobił i wypędził."
"Joz13,13": "Lecz synowie Izraela nie wypędzili Geszurytów i Maakatytów, dlatego Geszuryci i Maakatyci mieszkają pośród Izraelitów do dziś."
"Joz13,14": "Tylko pokoleniu Lewiego nie dał dziedzictwa; ofiary spalane dla PANA, Boga Izraela, są jego dziedzictwem, jak mu Bóg powiedział."
"Joz13,15": "Mojżesz dał więc pokoleniu synów Rubena dziedzictwo według ich rodzin."
"Joz13,16": "Ich granica była od Aroeru, leżącego nad brzegiem rzeki Arnon, i od miasta, które jest w środku rzeki, wraz z całą równiną ku Medebie;"
"Joz13,17": "Cheszbon i wszystkie przyległe do niego miasta, które były na równinie: Dibon, Bamot-Baal i Bet-Baal-Meon;"
"Joz13,18": "Jahaza, Kedemot i Mefaat;"
"Joz13,19": "Kiriataim, Sibma i Seret-Haszszachar na górze w dolinie;"
"Joz13,20": "Bet-Peor, Aszdod-Pisga i Bet-Jeszimot."
"Joz13,21": "I wszystkie miasta na równinie oraz całe królestwo Sichona, króla Amorytów, który królował w Cheszbonie, a którego Mojżesz zabił tak jak książąt Midianu: Ewi, Rekem, Sur, Chur, Reba, książęta Sichona zamieszkali w tej ziemi."
"Joz13,22": "I wróżbitę Balaama, syna Beora, wraz z innymi zabitymi synowie Izraela zabili mieczem."
"Joz13,23": "Granicą synów Rubena był Jordan ze swymi granicami. Oto dziedzictwo synów Rubena według ich rodzin, miast i przyległych do nich wsi."
"Joz13,24": "Mojżesz dał też dziedzictwo pokoleniu Gada, synom Gada według ich rodzin."
"Joz13,25": "A ich granice obejmowały Jazer i wszystkie miasta Gileadu oraz połowę ziemi synów Ammona aż do Aroeru leżącego naprzeciw Rabby;"
"Joz13,26": "I od Cheszbonu aż do Ramat-Mispa i Betonim oraz od Machanaim aż do granicy Debiru."
"Joz13,27": "W dolinie zaś: Bet-Haram, Bet-Nimra, Sukkot i Safon, resztę królestwa Sichona, króla Cheszbonu, Jordan i jego pogranicze aż do końca morza Kinneret po wschodniej stronie Jordanu."
"Joz13,28": "Oto dziedzictwo synów Gada według ich rodzin, miast i przyległych do nich wsi."
"Joz13,29": "Mojżesz dał też posiadłość połowie pokolenia Manassesa; przypadła ona połowie pokolenia synów Manassesa według ich rodzin."
"Joz13,30": "Ich granica była od Machanaim, obejmowała cały Baszan i całe królestwo Oga, króla Baszanu oraz wszystkie wsie Jaira, które są w Baszanie, sześćdziesiąt miast."
"Joz13,31": "Połowę Gileadu, Asztarot i Erdei, miasta królestwa Oga w Baszanie, dał synom Makira, syna Manassesa, a ściśle – połowie synów Makira według ich rodzin."
"Joz13,32": "Oto posiadłości, które Mojżesz podzielił na polach Moabu za Jordanem, naprzeciw Jerycha na wschodzie."
"Joz13,33": "Lecz pokoleniu Lewiego Mojżesz nie dał dziedzictwa, gdyż PAN, Bóg Izraela, sam jest ich dziedzictwem, jak im to powiedział."
