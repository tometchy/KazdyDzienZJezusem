"Joz13,1":
  text: "I gdy Jozue zestarzał się i był w podeszłym wieku, PAN powiedział do niego: Zestarzałeś się i posunąłeś się w latach, a pozostało jeszcze dużo ziemi do zdobycia."
  tags: []
"Joz13,2":
  text: "Oto ziemia, która pozostała: wszystkie okręgi Filistynów i Geszurytów;"
  tags: []
"Joz13,3":
  text: "Od Szichoru, który jest naprzeciw Egiptu, aż do granicy Akaronu na północy – jest to ziemia przynależąca do Kananejczyków, pięciu książąt filistyńskich: z Gazy, Aszdodu, Aszkelonu, Gat i Ekronu, oraz Awwici;"
  tags: []
"Joz13,4":
  text: "Od południa: cała ziemia Kananejczyków oraz Meara, która należy do Sydończyków, aż do Afek i aż do granicy Amorytów;"
  tags: []
"Joz13,5":
  text: "I ziemia Gibilitów i cały Liban na wschodzie, od Baal-Gad pod górę Hermon, aż do wejścia do Chamat."
  tags: []
"Joz13,6":
  text: "Wszystkich mieszkańców gór od Libanu aż do Misrefot-Maim i wszystkich Sydończyków wypędzę przed synami Izraela. Tylko podziel ją losem między Izraelitów jako dziedzictwo, tak jak ci rozkazałem."
  tags: []
"Joz13,7":
  text: "Rozdziel więc teraz tę ziemię jako dziedzictwo dziewięciu pokoleniom i połowie pokolenia Manassesa;"
  tags: []
"Joz13,8":
  text: "Gdyż z drugą połową Rubenici i Gadyci otrzymali już swoje dziedzictwo, które dał im Mojżesz za Jordanem na wschodzie, jak przydzielał im Mojżesz, sługa PANA;"
  tags: []
"Joz13,9":
  text: "Od Aroeru, leżącego nad brzegiem rzeki Arnon, i od miasta, które jest w środku rzeki, wraz z całą równiną Medeby aż do Dibonu;"
  tags: []
"Joz13,10":
  text: "I wszystkie miasta Sichona, króla Amorytów, który królował w Cheszbonie, aż do granicy synów Ammona;"
  tags: []
"Joz13,11":
  text: "Także Gilead i obszar Geszurytów i Maakatytów, całą górę Hermon i cały Baszan aż do Salka;"
  tags: []
"Joz13,12":
  text: "Całe królestwo Oga w Baszanie, który królował w Asztarot i w Edrei; był on ostatnim z Refaitów, których Mojżesz pobił i wypędził."
  tags: []
"Joz13,13":
  text: "Lecz synowie Izraela nie wypędzili Geszurytów i Maakatytów, dlatego Geszuryci i Maakatyci mieszkają pośród Izraelitów do dziś."
  tags: []
"Joz13,14":
  text: "Tylko pokoleniu Lewiego nie dał dziedzictwa; ofiary spalane dla PANA, Boga Izraela, są jego dziedzictwem, jak mu Bóg powiedział."
  tags: []
"Joz13,15":
  text: "Mojżesz dał więc pokoleniu synów Rubena dziedzictwo według ich rodzin."
  tags: []
"Joz13,16":
  text: "Ich granica była od Aroeru, leżącego nad brzegiem rzeki Arnon, i od miasta, które jest w środku rzeki, wraz z całą równiną ku Medebie;"
  tags: []
"Joz13,17":
  text: "Cheszbon i wszystkie przyległe do niego miasta, które były na równinie: Dibon, Bamot-Baal i Bet-Baal-Meon;"
  tags: []
"Joz13,18":
  text: "Jahaza, Kedemot i Mefaat;"
  tags: []
"Joz13,19":
  text: "Kiriataim, Sibma i Seret-Haszszachar na górze w dolinie;"
  tags: []
"Joz13,20":
  text: "Bet-Peor, Aszdod-Pisga i Bet-Jeszimot."
  tags: []
"Joz13,21":
  text: "I wszystkie miasta na równinie oraz całe królestwo Sichona, króla Amorytów, który królował w Cheszbonie, a którego Mojżesz zabił tak jak książąt Midianu: Ewi, Rekem, Sur, Chur, Reba, książęta Sichona zamieszkali w tej ziemi."
  tags: []
"Joz13,22":
  text: "I wróżbitę Balaama, syna Beora, wraz z innymi zabitymi synowie Izraela zabili mieczem."
  tags: []
"Joz13,23":
  text: "Granicą synów Rubena był Jordan ze swymi granicami. Oto dziedzictwo synów Rubena według ich rodzin, miast i przyległych do nich wsi."
  tags: []
"Joz13,24":
  text: "Mojżesz dał też dziedzictwo pokoleniu Gada, synom Gada według ich rodzin."
  tags: []
"Joz13,25":
  text: "A ich granice obejmowały Jazer i wszystkie miasta Gileadu oraz połowę ziemi synów Ammona aż do Aroeru leżącego naprzeciw Rabby;"
  tags: []
"Joz13,26":
  text: "I od Cheszbonu aż do Ramat-Mispa i Betonim oraz od Machanaim aż do granicy Debiru."
  tags: []
"Joz13,27":
  text: "W dolinie zaś: Bet-Haram, Bet-Nimra, Sukkot i Safon, resztę królestwa Sichona, króla Cheszbonu, Jordan i jego pogranicze aż do końca morza Kinneret po wschodniej stronie Jordanu."
  tags: []
"Joz13,28":
  text: "Oto dziedzictwo synów Gada według ich rodzin, miast i przyległych do nich wsi."
  tags: []
"Joz13,29":
  text: "Mojżesz dał też posiadłość połowie pokolenia Manassesa; przypadła ona połowie pokolenia synów Manassesa według ich rodzin."
  tags: []
"Joz13,30":
  text: "Ich granica była od Machanaim, obejmowała cały Baszan i całe królestwo Oga, króla Baszanu oraz wszystkie wsie Jaira, które są w Baszanie, sześćdziesiąt miast."
  tags: []
"Joz13,31":
  text: "Połowę Gileadu, Asztarot i Erdei, miasta królestwa Oga w Baszanie, dał synom Makira, syna Manassesa, a ściśle – połowie synów Makira według ich rodzin."
  tags: []
"Joz13,32":
  text: "Oto posiadłości, które Mojżesz podzielił na polach Moabu za Jordanem, naprzeciw Jerycha na wschodzie."
  tags: []
"Joz13,33":
  text: "Lecz pokoleniu Lewiego Mojżesz nie dał dziedzictwa, gdyż PAN, Bóg Izraela, sam jest ich dziedzictwem, jak im to powiedział."
  tags: []
