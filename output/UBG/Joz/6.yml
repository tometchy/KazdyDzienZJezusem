"Joz6,1":
  text: "A Jerycho było szczelnie zamknięte z powodu synów Izraela. Nikt z niego nie wychodził i nikt do niego nie wchodził."
  tags: []
"Joz6,2":
  text: "Wtedy PAN powiedział do Jozuego: Oto dałem w twoje ręce Jerycho, jego króla i jego dzielnych wojowników."
  tags: []
"Joz6,3":
  text: "I wy, wszyscy wojownicy, będziecie obchodzić miasto, okrążając je raz. Uczynicie tak przez sześć dni."
  tags: []
"Joz6,4":
  text: "A siedmiu kapłanów będzie niosło przed arką siedem trąb z rogów baranich. Siódmego zaś dnia obejdziecie miasto siedem razy, a kapłani będą dąć w trąby."
  tags: []
"Joz6,5":
  text: "A gdy przeciągle będą trąbić w baranie rogi i usłyszycie głos trąby, cały lud wzniesie wielki okrzyk, a mury miasta runą i lud wejdzie do miasta, każdy wprost przed siebie."
  tags: []
"Joz6,6":
  text: "Wtedy Jozue, syn Nuna, wezwał kapłanów i powiedział im: Weźcie arkę przymierza i niech siedmiu kapłanów niesie siedem trąb z baranich rogów przed arką PANA."
  tags: []
"Joz6,7":
  text: "Potem powiedział do ludu: Idźcie i obejdźcie miasto, a uzbrojeni wojownicy niech idą przed arką PANA."
  tags: []
"Joz6,8":
  text: "A gdy Jozue powiedział to ludowi, siedmiu kapłanów niosących siedem trąb z baranich rogów wyruszyło przed arką PANA i dęli w trąby. A arka przymierza PANA szła za nimi."
  tags: []
"Joz6,9":
  text: "Uzbrojeni wojownicy zaś szli przed kapłanami, którzy dęli w trąby, a pozostałe oddziały szły za arką. Gdy szli, dęto w trąby."
  tags: []
"Joz6,10":
  text: "A Jozue nakazał ludowi: Nie krzyczcie, niech nie będzie słychać waszego głosu ani niech żadne słowo nie wyjdzie z waszych ust aż do dnia, w którym wam powiem: Wznieście okrzyk! Wtedy wydacie okrzyk."
  tags: []
"Joz6,11":
  text: "Tak więc arka PANA okrążyła miasto raz, po czym wrócili do obozu i przenocowali w nim."
  tags: []
"Joz6,12":
  text: "Jozue wstał wcześnie rano, a kapłani wzięli arkę PANA."
  tags: []
"Joz6,13":
  text: "A siedmiu kapłanów niosących siedem trąb z rogów baranich szło nieprzerwanie przed arką PANA, dmąc w trąby. Uzbrojeni wojownicy szli przed nimi, a pozostałe oddziały szły za arką PANA. Gdy szli, dęto w trąby."
  tags: []
"Joz6,14":
  text: "Na drugi dzień okrążyli miasto raz i wrócili do obozu. Tak czynili przez sześć dni."
  tags: []
"Joz6,15":
  text: "Lecz dnia siódmego wstali rano o świcie i okrążyli miasto w ten sam sposób siedem razy. Tylko tego dnia okrążyli miasto siedem razy."
  tags: []
"Joz6,16":
  text: "A za siódmym razem, gdy kapłani zadęli w trąby, Jozue powiedział do ludu: Wznieście teraz okrzyk, bo PAN wydaje wam miasto."
  tags: []
"Joz6,17":
  text: "I miasto będzie przeklęte dla PANA, ono samo i wszystko, co się w nim znajduje. Tylko nierządnica Rachab zostanie przy życiu, ona i wszyscy, którzy są z nią w domu, gdyż ukryła posłańców, których wysłaliśmy."
  tags: []
"Joz6,18":
  text: "Wy jednak strzeżcie się tego, co przeklęte, abyście sami nie stali się przekleństwem, gdy weźmiecie z obłożonego przekleństwem, i byście nie ściągnęli przekleństwa na obóz Izraela, i nie sprowadzili na niego nieszczęścia."
  tags: []
"Joz6,19":
  text: "Wszelkie srebro i złoto oraz przedmioty miedziane i żelazne będą poświęcone PANU. Zostaną złożone do skarbca PANA."
  tags: []
"Joz6,20":
  text: "Wtedy lud wydał okrzyk, gdy zadęto w trąby. A kiedy lud usłyszał dźwięk trąb i wydał potężny okrzyk, runęły mury, a lud wszedł do miasta, każdy prosto przed siebie, i zdobyli miasto;"
  tags: []
"Joz6,21":
  text: "I zniszczyli ostrzem miecza wszystko, co było w mieście: mężczyzn i kobiety, dzieci i starców, woły, owce i osły."
  tags: []
"Joz6,22":
  text: "Lecz dwóm mężczyznom, którzy wybadali tę ziemię, Jozue powiedział: Wejdźcie do domu nierządnicy i wyprowadźcie stamtąd tę kobietę oraz wszystko, co do niej należy, tak jak jej przysięgliście."
  tags: []
"Joz6,23":
  text: "Weszli więc młodzieńcy, zwiadowcy, i wyprowadzili Rachab, jej ojca, jej matkę i jej braci oraz wszystko, co do niej należało. Wyprowadzili całą jej rodzinę i zostawili ich poza obozem Izraela."
  tags: []
"Joz6,24":
  text: "A miasto i wszystko, co w nim było, spalili ogniem. Tylko srebro i złoto oraz przedmioty miedziane i żelazne złożyli do skarbca domu PANA."
  tags: []
"Joz6,25":
  text: "Jozue zostawił przy życiu nierządnicę Rachab, dom jej ojca i wszystko, co do niej należało; mieszka ona w Izraelu aż do dziś, ponieważ ukryła posłańców, których Jozue wysłał na wybadanie Jerycha."
  tags: []
"Joz6,26":
  text: "W tym czasie Jozue złożył przysięgę: Niech będzie przeklęty przed PANEM człowiek, który powstanie i odbuduje to miasto, Jerycho. Na swoim pierworodnym założy jego fundament, a na swoim najmłodszym postawi jego bramy."
  tags: []
"Joz6,27":
  text: "I PAN był z Jozuem, którego sława rozchodziła się po całej ziemi."
  tags: []
