"Joz1,1": "Po śmierci Mojżesza, sługi PANA, powiedział PAN do Jozuego, syna Nuna, sługi Mojżesza:"
"Joz1,2": "Mojżesz, mój sługa, umarł; teraz więc wstań, przepraw się przez ten Jordan, ty i cały ten lud, do ziemi, którą daję im, synom Izraela."
"Joz1,3": "Każde miejsce, po którym będzie stąpać wasza noga, dałem wam, jak obiecałem Mojżeszowi."
"Joz1,4": "Od pustyni i od Libanu aż do wielkiej rzeki, rzeki Eufrat, cała ziemia Chetytów, aż do Morza Wielkiego na zachodzie, będzie waszą granicą."
"Joz1,5": "Nikt nie ostoi się przed tobą po wszystkie dni twego życia; jak byłem z Mojżeszem, tak będę z tobą. Nie porzucę cię ani cię nie opuszczę."
"Joz1,6": "Wzmocnij się i bądź mężny. Ty bowiem dasz temu ludowi w dziedzictwo ziemię, którą przysiągłem dać ich ojcom."
"Joz1,7": "Tylko wzmocnij się i bądź bardzo mężny, abyś pilnował wypełniania wszystkiego według prawa, które nakazał ci Mojżesz, mój sługa. Nie odstępuj od niego ani na prawo, ani na lewo, aby ci się wiodło, dokądkolwiek pójdziesz."
"Joz1,8": "Niech ta księga Prawa nie oddala się od twoich ust, ale rozmyślaj o niej we dnie i w nocy, abyś pilnował wypełnienia wszystkiego, co w niej jest napisane. Wtedy bowiem poszczęści się twojej drodze i będzie ci się wiodło."
"Joz1,9": "Czyż ci nie nakazałem? Wzmocnij się i bądź mężny. Nie lękaj się i nie przerażaj, gdyż PAN, twój Bóg, jest z tobą, dokądkolwiek pójdziesz."
"Joz1,10": "Wtedy Jozue rozkazał przełożonym ludu:"
"Joz1,11": "Przejdźcie przez obóz i rozkażcie ludowi: Przygotujcie sobie żywność, bo za trzy dni przejdziecie przez ten Jordan, aby wejść i posiąść ziemię, którą PAN, wasz Bóg, daje wam w posiadanie."
"Joz1,12": "A do Rubenitów, Gadytów i połowy pokolenia Manassesa Jozue powiedział:"
"Joz1,13": "Przypomnijcie sobie słowo, które nakazał wam Mojżesz, sługa PANA: PAN, wasz Bóg, zapewnił wam odpoczynek i dał wam tę ziemię;"
"Joz1,14": "Niech wasze żony, dzieci i bydło zostaną w ziemi, którą Mojżesz dał wam po tej stronie Jordanu; wy zaś, wszyscy dzielni wojownicy, pójdziecie uzbrojeni przed waszymi braćmi i będziecie im pomagać;"
"Joz1,15": "Aż PAN da odpoczynek waszym braciom, jak i wam, i oni posiądą ziemię, którą daje im PAN, wasz Bóg. Potem wrócicie do ziemi swojej posiadłości, którą dał wam Mojżesz, sługa PANA, po tej stronie Jordanu na wschodzie, i posiądziecie ją."
"Joz1,16": "I odpowiedzieli Jozuemu: Wszystko, co nam nakazałeś, uczynimy i gdziekolwiek nas poślesz, pójdziemy."
"Joz1,17": "Jak byliśmy posłuszni Mojżeszowi we wszystkim, tak będziemy posłuszni i tobie. Niech tylko PAN, twój Bóg, będzie z tobą, jak był z Mojżeszem."
"Joz1,18": "Ktokolwiek sprzeciwi się twemu rozkazowi i nie będzie posłuszny twoim słowom we wszystkim, co mu rozkażesz, niech umrze. Tylko wzmocnij się i bądź mężny."
