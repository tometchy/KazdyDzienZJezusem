"Joz8,1": "Potem PAN powiedział do Jozuego: Nie bój się ani się nie lękaj. Weź ze sobą wszystkich wojowników, powstań i wyrusz do Aj. Patrz, daję w twoje ręce króla Aj, jego lud i jego ziemię."
"Joz8,2": "I postąpisz z Aj i jego królem tak, jak postąpiłeś z Jerychem i jego królem. Tym razem weźmiecie sobie jego łupy i bydło. Zastaw zasadzkę na miasto od jego tyłu."
"Joz8,3": "Powstali więc Jozue i wszyscy wojownicy, by wyruszyć przeciwko Aj. Jozue wybrał trzydzieści tysięcy bardzo dzielnych mężczyzn i wysłał ich nocą."
"Joz8,4": "I rozkazał im: Uważajcie, przygotujcie zasadzkę za miastem. Nie oddalajcie się od miasta zbyt daleko i bądźcie wszyscy w pogotowiu."
"Joz8,5": "Ja zaś i cały lud, który jest ze mną, podejdziemy pod miasto; a gdy oni wyjdą nam naprzeciw, jak za pierwszym razem, uciekniemy przed nimi."
"Joz8,6": "A oni pójdą za nami, aż ich odciągniemy od miasta, bo powiedzą: Uciekają przed nami, tak jak za pierwszym razem, gdyż będziemy uciekać przed nimi."
"Joz8,7": "Wtedy wyjdziecie z zasadzki i opanujecie miasto. PAN bowiem, wasz Bóg, odda je w wasze ręce."
"Joz8,8": "A gdy zdobędziecie miasto, podpalicie je. Postąpicie zgodnie ze słowem PANA. Patrzcie, ja to wam rozkazuję."
"Joz8,9": "Jozue więc ich wysłał, a oni poszli przygotować zasadzkę; i zostali między Betel a Aj, na zachód od Aj. Jozue zaś spędził tę noc wśród ludu."
"Joz8,10": "Następnego dnia Jozue wstał wcześnie rano, obliczył lud i poszedł przed nim wraz ze starszymi Izraela przeciwko Aj."
"Joz8,11": "Wszyscy wojownicy, którzy z nim byli, wyruszyli, przybyli pod miasto i rozbili obóz po północnej stronie Aj, tak że między nimi a Aj była dolina."
"Joz8,12": "Następnie wziął około pięciu tysięcy mężczyzn, których umieścił w zasadzce między Betel a Aj, po zachodniej stronie miasta."
"Joz8,13": "I ustawiono lud, całe wojsko po północnej stronie miasta, a tych, którzy przygotowali zasadzkę – po zachodniej stronie. Jozue zaś wyruszył tej nocy na środek doliny."
"Joz8,14": "Gdy spostrzegł to król Aj, ludzie z miasta pośpieszyli się, wstali wcześnie rano i wyruszyli do walki z Izraelem – on i cały jego lud – w wyznaczonym czasie przed równiną. Nie wiedział jednak, że za miastem została przygotowana na nich zasadzka."
"Joz8,15": "Wtedy Jozue i cały Izrael udawali pokonanych przez nich i uciekali drogą wiodącą ku pustyni."
"Joz8,16": "I zwołano cały lud, który był w mieście, aby ich ścigać. Ścigali więc Jozuego i zostali odciągnięci od miasta."
"Joz8,17": "W Aj i Betel nie pozostał nikt, kto by nie wyruszył za Izraelem; i pozostawili miasto otwarte, i ścigali Izraelitów."
"Joz8,18": "Wtedy PAN powiedział do Jozuego: Podnieś oszczep, który masz w ręce, w kierunku Aj, gdyż dam je w twoje ręce. I Jozue podniósł oszczep, który miał w ręce, w kierunku miasta."
"Joz8,19": "A gdy tylko podniósł rękę, ludzie, którzy byli w zasadzce, powstali szybko ze swego miejsca, pobiegli i weszli do miasta, zajęli je i szybko podpalili."
"Joz8,20": "A gdy ludzie z Aj obejrzeli się, zobaczyli, że dym wznosi się z miasta ku niebu, a nie mieli siły uciekać ani w jedną, ani w drugą stronę. Tymczasem lud, który uciekał na pustynię, zwrócił się przeciw ścigającym."
"Joz8,21": "Jozue bowiem i cały lud Izraela zobaczyli, że ludzie z zasadzki zajęli miasto i że z miasta unosi się dym, zawrócili więc i zaczęli zabijać ludzi z Aj."
"Joz8,22": "A drudzy wyszli im naprzeciw z miasta i zostali oni otoczeni przez Izraelitów, jedni z jednej, a drudzy z drugiej strony. I zabili ich tak, że nikt z nich nie pozostał przy życiu ani nie uciekł."
"Joz8,23": "Króla Aj jednak pojmali żywcem i przyprowadzili do Jozuego."
"Joz8,24": "Gdy więc Izraelici wybili wszystkich mieszkańców Aj na polu, na pustyni, gdzie ich ścigali, i gdy wszyscy oni polegli od miecza, aż zostali zgładzeni, wszyscy Izraelici zawrócili do Aj i pobili je ostrzem miecza."
"Joz8,25": "Wszystkich poległych tego dnia, mężczyzn i kobiet, było dwanaście tysięcy, byli to wszyscy mieszkańcy Aj."
"Joz8,26": "A Jozue nie opuścił ręki, którą wyciągnął z oszczepem, aż zgładził wszystkich mieszkańców Aj."
"Joz8,27": "Tylko bydło i łupy tego miasta Izraelici podzielili między siebie według słowa PANA, które przekazał on Jozuemu."
"Joz8,28": "Wtedy Jozue spalił Aj i uczynił je wieczną mogiłą i pustynią aż do dziś."
"Joz8,29": "A króla Aj powiesił na drzewie aż do wieczora. A gdy słońce zaszło, Jozue kazał zdjąć jego zwłoki z drzewa i porzucić je przy samej bramie miasta, i wznieść nad nim wielki stos kamieni, który trwa aż do dziś."
"Joz8,30": "Wtedy Jozue zbudował ołtarz dla PANA, Boga Izraela, na górze Ebal;"
"Joz8,31": "Jak nakazał synom Izraela Mojżesz, sługa PANA, i jak jest napisane w księdze Prawa Mojżesza: ołtarz z całych kamieni, których nie tknęło żadne żelazo. I na nim złożyli PANU całopalenia i ofiary pojednawcze."
"Joz8,32": "Tam też napisał na kamieniach odpis Prawa Mojżesza, który napisał w obecności synów Izraela."
"Joz8,33": "A cały Izrael oraz jego starsi, przełożeni i sędziowie stali po obu stronach arki przed kapłanami lewitami, którzy nosili arkę przymierza PANA, zarówno przybysz, jak i rodowity, połowa ich naprzeciw góry Gerizim, a połowa naprzeciw góry Ebal jak przedtem nakazał Mojżesz, sługa PANA, aby błogosławić lud Izraela."
"Joz8,34": "Potem czytał wszystkie słowa prawa, błogosławieństwa i przekleństwa według wszystkiego, co zostało napisane w księdze Prawa."
"Joz8,35": "Nie było ani jednego słowa ze wszystkiego, co Mojżesz nakazał, którego Jozue nie odczytał przed całym zgromadzeniem Izraela, przed kobietami, dziećmi i przybyszami, którzy mieszkali wśród nich."
