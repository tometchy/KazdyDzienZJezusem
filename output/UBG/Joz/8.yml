"Joz8,1":
  text: "Potem PAN powiedział do Jozuego: Nie bój się ani się nie lękaj. Weź ze sobą wszystkich wojowników, powstań i wyrusz do Aj. Patrz, daję w twoje ręce króla Aj, jego lud i jego ziemię."
  tags: []
"Joz8,2":
  text: "I postąpisz z Aj i jego królem tak, jak postąpiłeś z Jerychem i jego królem. Tym razem weźmiecie sobie jego łupy i bydło. Zastaw zasadzkę na miasto od jego tyłu."
  tags: []
"Joz8,3":
  text: "Powstali więc Jozue i wszyscy wojownicy, by wyruszyć przeciwko Aj. Jozue wybrał trzydzieści tysięcy bardzo dzielnych mężczyzn i wysłał ich nocą."
  tags: []
"Joz8,4":
  text: "I rozkazał im: Uważajcie, przygotujcie zasadzkę za miastem. Nie oddalajcie się od miasta zbyt daleko i bądźcie wszyscy w pogotowiu."
  tags: []
"Joz8,5":
  text: "Ja zaś i cały lud, który jest ze mną, podejdziemy pod miasto; a gdy oni wyjdą nam naprzeciw, jak za pierwszym razem, uciekniemy przed nimi."
  tags: []
"Joz8,6":
  text: "A oni pójdą za nami, aż ich odciągniemy od miasta, bo powiedzą: Uciekają przed nami, tak jak za pierwszym razem, gdyż będziemy uciekać przed nimi."
  tags: []
"Joz8,7":
  text: "Wtedy wyjdziecie z zasadzki i opanujecie miasto. PAN bowiem, wasz Bóg, odda je w wasze ręce."
  tags: []
"Joz8,8":
  text: "A gdy zdobędziecie miasto, podpalicie je. Postąpicie zgodnie ze słowem PANA. Patrzcie, ja to wam rozkazuję."
  tags: []
"Joz8,9":
  text: "Jozue więc ich wysłał, a oni poszli przygotować zasadzkę; i zostali między Betel a Aj, na zachód od Aj. Jozue zaś spędził tę noc wśród ludu."
  tags: []
"Joz8,10":
  text: "Następnego dnia Jozue wstał wcześnie rano, obliczył lud i poszedł przed nim wraz ze starszymi Izraela przeciwko Aj."
  tags: []
"Joz8,11":
  text: "Wszyscy wojownicy, którzy z nim byli, wyruszyli, przybyli pod miasto i rozbili obóz po północnej stronie Aj, tak że między nimi a Aj była dolina."
  tags: []
"Joz8,12":
  text: "Następnie wziął około pięciu tysięcy mężczyzn, których umieścił w zasadzce między Betel a Aj, po zachodniej stronie miasta."
  tags: []
"Joz8,13":
  text: "I ustawiono lud, całe wojsko po północnej stronie miasta, a tych, którzy przygotowali zasadzkę – po zachodniej stronie. Jozue zaś wyruszył tej nocy na środek doliny."
  tags: []
"Joz8,14":
  text: "Gdy spostrzegł to król Aj, ludzie z miasta pośpieszyli się, wstali wcześnie rano i wyruszyli do walki z Izraelem – on i cały jego lud – w wyznaczonym czasie przed równiną. Nie wiedział jednak, że za miastem została przygotowana na nich zasadzka."
  tags: []
"Joz8,15":
  text: "Wtedy Jozue i cały Izrael udawali pokonanych przez nich i uciekali drogą wiodącą ku pustyni."
  tags: []
"Joz8,16":
  text: "I zwołano cały lud, który był w mieście, aby ich ścigać. Ścigali więc Jozuego i zostali odciągnięci od miasta."
  tags: []
"Joz8,17":
  text: "W Aj i Betel nie pozostał nikt, kto by nie wyruszył za Izraelem; i pozostawili miasto otwarte, i ścigali Izraelitów."
  tags: []
"Joz8,18":
  text: "Wtedy PAN powiedział do Jozuego: Podnieś oszczep, który masz w ręce, w kierunku Aj, gdyż dam je w twoje ręce. I Jozue podniósł oszczep, który miał w ręce, w kierunku miasta."
  tags: []
"Joz8,19":
  text: "A gdy tylko podniósł rękę, ludzie, którzy byli w zasadzce, powstali szybko ze swego miejsca, pobiegli i weszli do miasta, zajęli je i szybko podpalili."
  tags: []
"Joz8,20":
  text: "A gdy ludzie z Aj obejrzeli się, zobaczyli, że dym wznosi się z miasta ku niebu, a nie mieli siły uciekać ani w jedną, ani w drugą stronę. Tymczasem lud, który uciekał na pustynię, zwrócił się przeciw ścigającym."
  tags: []
"Joz8,21":
  text: "Jozue bowiem i cały lud Izraela zobaczyli, że ludzie z zasadzki zajęli miasto i że z miasta unosi się dym, zawrócili więc i zaczęli zabijać ludzi z Aj."
  tags: []
"Joz8,22":
  text: "A drudzy wyszli im naprzeciw z miasta i zostali oni otoczeni przez Izraelitów, jedni z jednej, a drudzy z drugiej strony. I zabili ich tak, że nikt z nich nie pozostał przy życiu ani nie uciekł."
  tags: []
"Joz8,23":
  text: "Króla Aj jednak pojmali żywcem i przyprowadzili do Jozuego."
  tags: []
"Joz8,24":
  text: "Gdy więc Izraelici wybili wszystkich mieszkańców Aj na polu, na pustyni, gdzie ich ścigali, i gdy wszyscy oni polegli od miecza, aż zostali zgładzeni, wszyscy Izraelici zawrócili do Aj i pobili je ostrzem miecza."
  tags: []
"Joz8,25":
  text: "Wszystkich poległych tego dnia, mężczyzn i kobiet, było dwanaście tysięcy, byli to wszyscy mieszkańcy Aj."
  tags: []
"Joz8,26":
  text: "A Jozue nie opuścił ręki, którą wyciągnął z oszczepem, aż zgładził wszystkich mieszkańców Aj."
  tags: []
"Joz8,27":
  text: "Tylko bydło i łupy tego miasta Izraelici podzielili między siebie według słowa PANA, które przekazał on Jozuemu."
  tags: []
"Joz8,28":
  text: "Wtedy Jozue spalił Aj i uczynił je wieczną mogiłą i pustynią aż do dziś."
  tags: []
"Joz8,29":
  text: "A króla Aj powiesił na drzewie aż do wieczora. A gdy słońce zaszło, Jozue kazał zdjąć jego zwłoki z drzewa i porzucić je przy samej bramie miasta, i wznieść nad nim wielki stos kamieni, który trwa aż do dziś."
  tags: []
"Joz8,30":
  text: "Wtedy Jozue zbudował ołtarz dla PANA, Boga Izraela, na górze Ebal;"
  tags: []
"Joz8,31":
  text: "Jak nakazał synom Izraela Mojżesz, sługa PANA, i jak jest napisane w księdze Prawa Mojżesza: ołtarz z całych kamieni, których nie tknęło żadne żelazo. I na nim złożyli PANU całopalenia i ofiary pojednawcze."
  tags: []
"Joz8,32":
  text: "Tam też napisał na kamieniach odpis Prawa Mojżesza, który napisał w obecności synów Izraela."
  tags: []
"Joz8,33":
  text: "A cały Izrael oraz jego starsi, przełożeni i sędziowie stali po obu stronach arki przed kapłanami lewitami, którzy nosili arkę przymierza PANA, zarówno przybysz, jak i rodowity, połowa ich naprzeciw góry Gerizim, a połowa naprzeciw góry Ebal jak przedtem nakazał Mojżesz, sługa PANA, aby błogosławić lud Izraela."
  tags: []
"Joz8,34":
  text: "Potem czytał wszystkie słowa prawa, błogosławieństwa i przekleństwa według wszystkiego, co zostało napisane w księdze Prawa."
  tags: []
"Joz8,35":
  text: "Nie było ani jednego słowa ze wszystkiego, co Mojżesz nakazał, którego Jozue nie odczytał przed całym zgromadzeniem Izraela, przed kobietami, dziećmi i przybyszami, którzy mieszkali wśród nich."
  tags: []
