"Joz23,1":
  text: "A po długim czasie, gdy PAN dał Izraelowi odpoczynek od wszystkich ich okolicznych wrogów, a Jozue był już stary i w podeszłym wieku;"
  tags: []
"Joz23,2":
  text: "Jozue przywołał całego Izraela, jego starszych, jego naczelników, jego sędziów i jego przełożonych i powiedział do nich: Jestem już stary i w podeszłym wieku."
  tags: []
"Joz23,3":
  text: "A wy widzieliście wszystko, co PAN, wasz Bóg, uczynił wszystkim tym narodom ze względu na was, gdyż PAN, wasz Bóg, sam walczył za was."
  tags: []
"Joz23,4":
  text: "Spójrzcie, podzieliłem wam losem narody, które pozostały, jako dziedzictwo dla waszych pokoleń, i wszystkie narody, które wytraciłem, od Jordanu aż do Morza Wielkiego na zachodzie."
  tags: []
"Joz23,5":
  text: "A PAN, wasz Bóg, sam je wypędzi przed wami i wygna je sprzed waszych oczu, i posiądziecie dziedzicznie ich ziemię, jak wam to powiedział PAN, wasz Bóg."
  tags: []
"Joz23,6":
  text: "Umacniajcie się bardzo, by strzec i wypełniać wszystko, co jest napisane w księdze Prawa Mojżesza, nie odstępując od niego na prawo ani na lewo."
  tags: []
"Joz23,7":
  text: "Nie mieszajcie się z tymi narodami, które pozostały pośród was, ani nie wspominajcie imion ich bogów, ani na nich nie przysięgajcie, ani im nie służcie, ani nie oddawajcie im pokłonu;"
  tags: []
"Joz23,8":
  text: "Ale lgnijcie do PANA, swojego Boga, tak jak czyniliście aż do dziś."
  tags: []
"Joz23,9":
  text: "PAN bowiem wypędził przed wami narody wielkie i potężne i nikt nie mógł ostać się przed wami aż do dziś."
  tags: []
"Joz23,10":
  text: "Jeden z was będzie ścigał tysiąc, gdyż PAN, wasz Bóg, sam walczy za was, jak wam obiecał."
  tags: []
"Joz23,11":
  text: "Strzeżcie się więc pilnie, byście miłowali PANA, waszego Boga."
  tags: []
"Joz23,12":
  text: "Jeśli bowiem odwrócicie się i przylgniecie do pozostałych narodów, do tych, które pozostały pośród was, i spowinowacicie się z nimi, i pomieszacie się z nimi, a one z wami;"
  tags: []
"Joz23,13":
  text: "To wiedzcie na pewno, że PAN, wasz Bóg, nie będzie więcej wyganiał tych narodów przed wami, ale będą dla was sidłem i pułapką, biczem na wasze boki i cierniem dla waszych oczu, aż wyginiecie z tej przewybornej ziemi, którą dał wam PAN, wasz Bóg."
  tags: []
"Joz23,14":
  text: "A oto idę dziś drogą całej ziemi; poznajcie więc z całego swojego serca i całą swoją duszą, że nie zawiodło żadne słowo ze wszystkich dobrych słów, które mówił o was PAN, wasz Bóg; wszystkie wam się wypełniły, a nie zawiodło żadne słowo."
  tags: []
"Joz23,15":
  text: "Dlatego tak jak wam się wypełniło każde dobre słowo, które obiecał wam PAN, wasz Bóg, tak PAN sprowadzi na was każde złe słowo, aż was wytraci z tej przewybornej ziemi, którą wam dał PAN, wasz Bóg."
  tags: []
"Joz23,16":
  text: "Jeśli złamiecie przymierze PANA, swojego Boga, które wam przykazał, i pójdziecie służyć obcym bogom, i będziecie oddawać im pokłon, wtedy gniew PANA rozpali się przeciw wam i zginiecie prędko z tej przewybornej ziemi, którą wam dał."
  tags: []
