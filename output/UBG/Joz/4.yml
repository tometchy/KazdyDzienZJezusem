"Joz4,1":
  text: "A gdy cały lud zakończył przeprawę przez Jordan, PAN powiedział do Jozuego:"
  tags: []
"Joz4,2":
  text: "Wybierzcie sobie z ludu dwunastu mężczyzn, po jednym z każdego pokolenia."
  tags: []
"Joz4,3":
  text: "I rozkażcie im: Weźcie sobie stąd, ze środka Jordanu, z tego miejsca, gdzie nogi kapłanów stały pewnie, dwanaście kamieni, zabierzcie je ze sobą i połóżcie w miejscu, gdzie tej nocy będziecie nocować."
  tags: []
"Joz4,4":
  text: "Jozue wezwał więc dwunastu mężczyzn, których wybrał spośród synów Izraela, po jednym z każdego pokolenia."
  tags: []
"Joz4,5":
  text: "I Jozue powiedział do nich: Pójdźcie przed arką PANA, swojego Boga, na środek Jordanu i niech każdy weźmie po jednym kamieniu na swe ramię, według liczby pokoleń synów Izraela;"
  tags: []
"Joz4,6":
  text: "Aby to było znakiem wśród was, gdy potem wasi synowie zapytają: Co znaczą dla was te kamienie?"
  tags: []
"Joz4,7":
  text: "Wtedy powiecie im, że wody Jordanu rozdzieliły się przed arką przymierza PANA; gdy przechodziła przez Jordan, rozdzieliły się wody Jordanu; i te kamienie będą pamiątką dla synów Izraela na wieki."
  tags: []
"Joz4,8":
  text: "I synowie Izraela uczynili tak, jak rozkazał Jozue. Wzięli dwanaście kamieni ze środka Jordanu, jak powiedział PAN do Jozuego, według liczby pokoleń synów Izraela, zanieśli je ze sobą na miejsce noclegu i tam je złożyli."
  tags: []
"Joz4,9":
  text: "Jozue też postawił dwanaście kamieni na środku Jordanu, w miejscu, gdzie stały nogi kapłanów niosących arkę przymierza. Pozostają tam aż do dziś."
  tags: []
"Joz4,10":
  text: "Kapłani zaś niosący arkę stali na środku Jordanu, aż wypełniło się to wszystko, co PAN rozkazał Jozuemu powiedzieć ludowi zgodnie ze wszystkim, co Mojżesz nakazał Jozuemu. Lud natomiast spieszył się i przeszedł."
  tags: []
"Joz4,11":
  text: "Gdy cały lud przeszedł, przeszli też i arka PANA, i kapłani przed ludem."
  tags: []
"Joz4,12":
  text: "Synowie Rubena, synowie Gada i połowa pokolenia Manassesa również przeszli uzbrojeni przed synami Izraela, jak im Mojżesz nakazał."
  tags: []
"Joz4,13":
  text: "Około czterdziestu tysięcy uzbrojonych wojowników przeszło przed PANEM do walki na równinach Jerycha."
  tags: []
"Joz4,14":
  text: "W tym dniu PAN wywyższył Jozuego na oczach całego Izraela i bali się go, jak bali się Mojżesza przez wszystkie dni jego życia."
  tags: []
"Joz4,15":
  text: "Potem PAN powiedział do Jozuego:"
  tags: []
"Joz4,16":
  text: "Rozkaż kapłanom niosącym arkę świadectwa, aby wyszli z Jordanu."
  tags: []
"Joz4,17":
  text: "Rozkazał więc Jozue kapłanom: Wyjdźcie z Jordanu."
  tags: []
"Joz4,18":
  text: "A gdy kapłani niosący arkę przymierza PANA wyszli ze środka Jordanu i stopy ich stanęły na suchej ziemi, wody Jordanu wróciły na swoje miejsce i płynęły jak przedtem, wypełnione po brzegi."
  tags: []
"Joz4,19":
  text: "Lud wyszedł z Jordanu dziesiątego dnia pierwszego miesiąca i rozbił obóz w Gilgal, po wschodniej stronie Jerycha."
  tags: []
"Joz4,20":
  text: "A te dwanaście kamieni, które wyniesiono z Jordanu, Jozue ustawił w Gilgal."
  tags: []
"Joz4,21":
  text: "I powiedział do synów Izraela: Gdy w przyszłości wasi synowie zapytają swoich ojców: Co znaczą te kamienie?"
  tags: []
"Joz4,22":
  text: "Wtedy powiecie swoim synom: Izrael przeszedł przez Jordan po suchej ziemi;"
  tags: []
"Joz4,23":
  text: "PAN Bóg bowiem osuszył wody Jordanu przed wami, aż się przeprawiliście – tak jak PAN, wasz Bóg, uczynił z Morzem Czerwonym, które wysuszył przed nami, aż przeszliśmy;"
  tags: []
"Joz4,24":
  text: "Aby wszystkie narody ziemi poznały, że ręka PANA jest potężna, i żebyście bali się PANA, swojego Boga, po wszystkie dni."
  tags: []
