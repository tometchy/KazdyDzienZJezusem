"Joz4,1": "A gdy cały lud zakończył przeprawę przez Jordan, PAN powiedział do Jozuego:"
"Joz4,2": "Wybierzcie sobie z ludu dwunastu mężczyzn, po jednym z każdego pokolenia."
"Joz4,3": "I rozkażcie im: Weźcie sobie stąd, ze środka Jordanu, z tego miejsca, gdzie nogi kapłanów stały pewnie, dwanaście kamieni, zabierzcie je ze sobą i połóżcie w miejscu, gdzie tej nocy będziecie nocować."
"Joz4,4": "Jozue wezwał więc dwunastu mężczyzn, których wybrał spośród synów Izraela, po jednym z każdego pokolenia."
"Joz4,5": "I Jozue powiedział do nich: Pójdźcie przed arką PANA, swojego Boga, na środek Jordanu i niech każdy weźmie po jednym kamieniu na swe ramię, według liczby pokoleń synów Izraela;"
"Joz4,6": "Aby to było znakiem wśród was, gdy potem wasi synowie zapytają: Co znaczą dla was te kamienie?"
"Joz4,7": "Wtedy powiecie im, że wody Jordanu rozdzieliły się przed arką przymierza PANA; gdy przechodziła przez Jordan, rozdzieliły się wody Jordanu; i te kamienie będą pamiątką dla synów Izraela na wieki."
"Joz4,8": "I synowie Izraela uczynili tak, jak rozkazał Jozue. Wzięli dwanaście kamieni ze środka Jordanu, jak powiedział PAN do Jozuego, według liczby pokoleń synów Izraela, zanieśli je ze sobą na miejsce noclegu i tam je złożyli."
"Joz4,9": "Jozue też postawił dwanaście kamieni na środku Jordanu, w miejscu, gdzie stały nogi kapłanów niosących arkę przymierza. Pozostają tam aż do dziś."
"Joz4,10": "Kapłani zaś niosący arkę stali na środku Jordanu, aż wypełniło się to wszystko, co PAN rozkazał Jozuemu powiedzieć ludowi zgodnie ze wszystkim, co Mojżesz nakazał Jozuemu. Lud natomiast spieszył się i przeszedł."
"Joz4,11": "Gdy cały lud przeszedł, przeszli też i arka PANA, i kapłani przed ludem."
"Joz4,12": "Synowie Rubena, synowie Gada i połowa pokolenia Manassesa również przeszli uzbrojeni przed synami Izraela, jak im Mojżesz nakazał."
"Joz4,13": "Około czterdziestu tysięcy uzbrojonych wojowników przeszło przed PANEM do walki na równinach Jerycha."
"Joz4,14": "W tym dniu PAN wywyższył Jozuego na oczach całego Izraela i bali się go, jak bali się Mojżesza przez wszystkie dni jego życia."
"Joz4,15": "Potem PAN powiedział do Jozuego:"
"Joz4,16": "Rozkaż kapłanom niosącym arkę świadectwa, aby wyszli z Jordanu."
"Joz4,17": "Rozkazał więc Jozue kapłanom: Wyjdźcie z Jordanu."
"Joz4,18": "A gdy kapłani niosący arkę przymierza PANA wyszli ze środka Jordanu i stopy ich stanęły na suchej ziemi, wody Jordanu wróciły na swoje miejsce i płynęły jak przedtem, wypełnione po brzegi."
"Joz4,19": "Lud wyszedł z Jordanu dziesiątego dnia pierwszego miesiąca i rozbił obóz w Gilgal, po wschodniej stronie Jerycha."
"Joz4,20": "A te dwanaście kamieni, które wyniesiono z Jordanu, Jozue ustawił w Gilgal."
"Joz4,21": "I powiedział do synów Izraela: Gdy w przyszłości wasi synowie zapytają swoich ojców: Co znaczą te kamienie?"
"Joz4,22": "Wtedy powiecie swoim synom: Izrael przeszedł przez Jordan po suchej ziemi;"
"Joz4,23": "PAN Bóg bowiem osuszył wody Jordanu przed wami, aż się przeprawiliście – tak jak PAN, wasz Bóg, uczynił z Morzem Czerwonym, które wysuszył przed nami, aż przeszliśmy;"
"Joz4,24": "Aby wszystkie narody ziemi poznały, że ręka PANA jest potężna, i żebyście bali się PANA, swojego Boga, po wszystkie dni."
