"Joz19,1":
  text: "Potem padł drugi los dla Symeona, dla pokolenia synów Symeona według ich rodzin, a ich dziedzictwo znajdowało się pośród dziedzictwa synów Judy."
  tags: []
"Joz19,2":
  text: "A otrzymali oni w dziedzictwie: Beer-Szeba, Szeba, Molada;"
  tags: []
"Joz19,3":
  text: "Chasar-Szual, Bala, Esem;"
  tags: []
"Joz19,4":
  text: "Eltolad, Betul, Chorma;"
  tags: []
"Joz19,5":
  text: "Siklag, Bet-Markabot, Chasar-Susa;"
  tags: []
"Joz19,6":
  text: "Bet-Lebaot i Szaruchen: trzynaście miast wraz z przyległymi do nich wioskami."
  tags: []
"Joz19,7":
  text: "Ain, Rimmon, Eter, Aszan: cztery miasta wraz z przyległymi do nich wioskami."
  tags: []
"Joz19,8":
  text: "Oraz wszystkie wioski, które były dokoła tych miast, aż do Baalat-Beer, Ramat południowy. To było dziedzictwo pokolenia synów Symeona według ich rodzin."
  tags: []
"Joz19,9":
  text: "Dziedzictwo synów Symeona zostało wzięte z działu synów Judy, ponieważ dział synów Judy był dla nich zbyt wielki. Synowie Symeona otrzymali więc dziedzictwo pośród ich dziedzictwa."
  tags: []
"Joz19,10":
  text: "Potem padł trzeci los dla synów Zebulona według ich rodzin, a granica ich dziedzictwa sięgała aż do Sarid."
  tags: []
"Joz19,11":
  text: "A ich granica wznosiła się w kierunku morza do Marala, dochodziła do Dabbeszet i ciągnęła się aż do potoku, który jest naprzeciw Jokneam."
  tags: []
"Joz19,12":
  text: "I zwracała się od Sarid na wschód do granicy Kislot-Tabor, a stamtąd biegła do Daberat i wznosiła się do Jafia;"
  tags: []
"Joz19,13":
  text: "Stamtąd biegła na wschód do Gat-Chefer, do Et-Kasin, dochodziła do Rimmon i skręcała do Nea."
  tags: []
"Joz19,14":
  text: "Następnie granica otaczała od północy do Channaton i kończyła się w dolinie Jiftach-El."
  tags: []
"Joz19,15":
  text: "Obejmowała również Kattat, Nahalal, Szimron, Idala i Betlejem: dwanaście miast wraz z przyległymi do nich wioskami."
  tags: []
"Joz19,16":
  text: "Oto dziedzictwo synów Zebulona według ich rodzin, te miasta i przyległe do nich wioski."
  tags: []
"Joz19,17":
  text: "Czwarty los przypadł Issacharowi, czyli synom Issachara według ich rodzin."
  tags: []
"Joz19,18":
  text: "A ich granica obejmowała: Jizreel, Kesulot, Szunem;"
  tags: []
"Joz19,19":
  text: "Chafaraim, Szijon, Anacharat;"
  tags: []
"Joz19,20":
  text: "Rabbit, Kiszjon, Ebes;"
  tags: []
"Joz19,21":
  text: "Remet, En-Gannim, En-Chadda i Bet-Passes."
  tags: []
"Joz19,22":
  text: "A ich granica dochodziła do Taboru, Szachasima i Bet-Szemesz, a kończyła się przy Jordanie: szesnaście miast i przyległe do nich wioski."
  tags: []
"Joz19,23":
  text: "Oto dziedzictwo pokolenia synów Issachara według ich rodzin, te miasta oraz przyległe do nich wioski."
  tags: []
"Joz19,24":
  text: "Potem padł piąty los dla pokolenia synów Aszera według ich rodzin."
  tags: []
"Joz19,25":
  text: "I ich granica obejmowała: Chelkat, Chali, Beten, Akszaf;"
  tags: []
"Joz19,26":
  text: "Alammelek, Amad i Miszal, a dochodziła do Karmelu na zachodzie i do Szichor-Libnat."
  tags: []
"Joz19,27":
  text: "Stamtąd skręcała na wschód do Bet-Dagon i biegła aż do Zebulona i do doliny Jiftach-El na północ od Bet-Emek i Neiel i wychodziła do Kabulu po lewej stronie;"
  tags: []
"Joz19,28":
  text: "I do Ebronu, Rechobu, Chammonu i Kany aż do Wielkiego Sydonu."
  tags: []
"Joz19,29":
  text: "Potem granica skręcała do Rama aż do warownego miasta Tyr; stamtąd skręcała do Chosa i kończyła się przy morzu, od wybrzeża do Akzibu."
  tags: []
"Joz19,30":
  text: "Obejmowała również Umma, Afek i Rechob: dwadzieścia dwa miasta oraz przyległe do nich wioski."
  tags: []
"Joz19,31":
  text: "Oto dziedzictwo pokolenia synów Aszera według ich rodzin, te miasta i przyległe do nich wioski."
  tags: []
"Joz19,32":
  text: "Potem dla synów Neftalego padł szósty los, dla synów Neftalego według ich rodzin."
  tags: []
"Joz19,33":
  text: "Ich granica biegła od Chelef, od Helon do Saanannim, Adami, czyli Nekeb, oraz Jabneel aż do Lakum i kończyła się przy Jordanie."
  tags: []
"Joz19,34":
  text: "Następnie ta granica skręcała na zachód do Aznot-Tabor, a stamtąd biegła do Chukkok i ciągnęła się na południe do Zebulona, na zachodzie dochodziła do Aszera, a do Judy nad Jordanem na wschodzie."
  tags: []
"Joz19,35":
  text: "A miastami warownymi są: Siddim, Ser, Chammat, Rakkat, Kinneret;"
  tags: []
"Joz19,36":
  text: "Adama, Rama, Chasor;"
  tags: []
"Joz19,37":
  text: "Kedesz, Edrei, En-Chasor;"
  tags: []
"Joz19,38":
  text: "Jereon, Migdal-El, Chorem, Bet-Anat i Bet-Szemesz: dziewiętnaście miast oraz przyległe do nich wioski."
  tags: []
"Joz19,39":
  text: "Oto dziedzictwo pokolenia synów Neftalego według ich rodzin, te miasta oraz przyległe do nich wioski."
  tags: []
"Joz19,40":
  text: "Potem padł siódmy los dla pokolenia synów Dana według ich rodzin."
  tags: []
"Joz19,41":
  text: "A granica ich dziedzictwa obejmowała: Sorea, Esztaol, Ir-Szemesz;"
  tags: []
"Joz19,42":
  text: "Szaalabin, Ajjalon, Jitla;"
  tags: []
"Joz19,43":
  text: "Elon, Timna, Ekron;"
  tags: []
"Joz19,44":
  text: "Elteke, Gibbeton, Baalat;"
  tags: []
"Joz19,45":
  text: "Jehud, Bene-Berak, Gat-Rimmon;"
  tags: []
"Joz19,46":
  text: "Me-Jarkon i Rakkon z granicą naprzeciw Jafy."
  tags: []
"Joz19,47":
  text: "Lecz obszar synów Dana był zbyt mały. Synowie Dana wyruszyli więc do walki z Leszem, zdobyli je, pobili je ostrzem miecza, wzięli je w dziedzictwo i mieszkali w nim. I nazwali Leszem Dan, od imienia swego ojca."
  tags: []
"Joz19,48":
  text: "Oto dziedzictwo pokolenia synów Dana według ich rodzin, te miasta oraz przyległe do nich wioski."
  tags: []
"Joz19,49":
  text: "A gdy dokończyli dzielenie ziemi według jej granic, synowie Izraela dali spośród siebie dziedzictwo Jozuemu, synowi Nuna."
  tags: []
"Joz19,50":
  text: "Zgodnie z rozkazem PANA dali mu miasto, o które poprosił, Timnat-Serach na górze Efraim, gdzie zbudował miasto i mieszkał w nim."
  tags: []
"Joz19,51":
  text: "Oto dziedzictwa, które losem podzielili w posiadanie kapłan Eleazar, Jozue, syn Nuna, i naczelnicy ojców pokoleń synów Izraela w Szilo przed PANEM, u wejścia do Namiotu Zgromadzenia, i dokończyli podział ziemi."
  tags: []
