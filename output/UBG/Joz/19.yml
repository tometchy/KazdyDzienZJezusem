"Joz19,1": "Potem padł drugi los dla Symeona, dla pokolenia synów Symeona według ich rodzin, a ich dziedzictwo znajdowało się pośród dziedzictwa synów Judy."
"Joz19,2": "A otrzymali oni w dziedzictwie: Beer-Szeba, Szeba, Molada;"
"Joz19,3": "Chasar-Szual, Bala, Esem;"
"Joz19,4": "Eltolad, Betul, Chorma;"
"Joz19,5": "Siklag, Bet-Markabot, Chasar-Susa;"
"Joz19,6": "Bet-Lebaot i Szaruchen: trzynaście miast wraz z przyległymi do nich wioskami."
"Joz19,7": "Ain, Rimmon, Eter, Aszan: cztery miasta wraz z przyległymi do nich wioskami."
"Joz19,8": "Oraz wszystkie wioski, które były dokoła tych miast, aż do Baalat-Beer, Ramat południowy. To było dziedzictwo pokolenia synów Symeona według ich rodzin."
"Joz19,9": "Dziedzictwo synów Symeona zostało wzięte z działu synów Judy, ponieważ dział synów Judy był dla nich zbyt wielki. Synowie Symeona otrzymali więc dziedzictwo pośród ich dziedzictwa."
"Joz19,10": "Potem padł trzeci los dla synów Zebulona według ich rodzin, a granica ich dziedzictwa sięgała aż do Sarid."
"Joz19,11": "A ich granica wznosiła się w kierunku morza do Marala, dochodziła do Dabbeszet i ciągnęła się aż do potoku, który jest naprzeciw Jokneam."
"Joz19,12": "I zwracała się od Sarid na wschód do granicy Kislot-Tabor, a stamtąd biegła do Daberat i wznosiła się do Jafia;"
"Joz19,13": "Stamtąd biegła na wschód do Gat-Chefer, do Et-Kasin, dochodziła do Rimmon i skręcała do Nea."
"Joz19,14": "Następnie granica otaczała od północy do Channaton i kończyła się w dolinie Jiftach-El."
"Joz19,15": "Obejmowała również Kattat, Nahalal, Szimron, Idala i Betlejem: dwanaście miast wraz z przyległymi do nich wioskami."
"Joz19,16": "Oto dziedzictwo synów Zebulona według ich rodzin, te miasta i przyległe do nich wioski."
"Joz19,17": "Czwarty los przypadł Issacharowi, czyli synom Issachara według ich rodzin."
"Joz19,18": "A ich granica obejmowała: Jizreel, Kesulot, Szunem;"
"Joz19,19": "Chafaraim, Szijon, Anacharat;"
"Joz19,20": "Rabbit, Kiszjon, Ebes;"
"Joz19,21": "Remet, En-Gannim, En-Chadda i Bet-Passes."
"Joz19,22": "A ich granica dochodziła do Taboru, Szachasima i Bet-Szemesz, a kończyła się przy Jordanie: szesnaście miast i przyległe do nich wioski."
"Joz19,23": "Oto dziedzictwo pokolenia synów Issachara według ich rodzin, te miasta oraz przyległe do nich wioski."
"Joz19,24": "Potem padł piąty los dla pokolenia synów Aszera według ich rodzin."
"Joz19,25": "I ich granica obejmowała: Chelkat, Chali, Beten, Akszaf;"
"Joz19,26": "Alammelek, Amad i Miszal, a dochodziła do Karmelu na zachodzie i do Szichor-Libnat."
"Joz19,27": "Stamtąd skręcała na wschód do Bet-Dagon i biegła aż do Zebulona i do doliny Jiftach-El na północ od Bet-Emek i Neiel i wychodziła do Kabulu po lewej stronie;"
"Joz19,28": "I do Ebronu, Rechobu, Chammonu i Kany aż do Wielkiego Sydonu."
"Joz19,29": "Potem granica skręcała do Rama aż do warownego miasta Tyr; stamtąd skręcała do Chosa i kończyła się przy morzu, od wybrzeża do Akzibu."
"Joz19,30": "Obejmowała również Umma, Afek i Rechob: dwadzieścia dwa miasta oraz przyległe do nich wioski."
"Joz19,31": "Oto dziedzictwo pokolenia synów Aszera według ich rodzin, te miasta i przyległe do nich wioski."
"Joz19,32": "Potem dla synów Neftalego padł szósty los, dla synów Neftalego według ich rodzin."
"Joz19,33": "Ich granica biegła od Chelef, od Helon do Saanannim, Adami, czyli Nekeb, oraz Jabneel aż do Lakum i kończyła się przy Jordanie."
"Joz19,34": "Następnie ta granica skręcała na zachód do Aznot-Tabor, a stamtąd biegła do Chukkok i ciągnęła się na południe do Zebulona, na zachodzie dochodziła do Aszera, a do Judy nad Jordanem na wschodzie."
"Joz19,35": "A miastami warownymi są: Siddim, Ser, Chammat, Rakkat, Kinneret;"
"Joz19,36": "Adama, Rama, Chasor;"
"Joz19,37": "Kedesz, Edrei, En-Chasor;"
"Joz19,38": "Jereon, Migdal-El, Chorem, Bet-Anat i Bet-Szemesz: dziewiętnaście miast oraz przyległe do nich wioski."
"Joz19,39": "Oto dziedzictwo pokolenia synów Neftalego według ich rodzin, te miasta oraz przyległe do nich wioski."
"Joz19,40": "Potem padł siódmy los dla pokolenia synów Dana według ich rodzin."
"Joz19,41": "A granica ich dziedzictwa obejmowała: Sorea, Esztaol, Ir-Szemesz;"
"Joz19,42": "Szaalabin, Ajjalon, Jitla;"
"Joz19,43": "Elon, Timna, Ekron;"
"Joz19,44": "Elteke, Gibbeton, Baalat;"
"Joz19,45": "Jehud, Bene-Berak, Gat-Rimmon;"
"Joz19,46": "Me-Jarkon i Rakkon z granicą naprzeciw Jafy."
"Joz19,47": "Lecz obszar synów Dana był zbyt mały. Synowie Dana wyruszyli więc do walki z Leszem, zdobyli je, pobili je ostrzem miecza, wzięli je w dziedzictwo i mieszkali w nim. I nazwali Leszem Dan, od imienia swego ojca."
"Joz19,48": "Oto dziedzictwo pokolenia synów Dana według ich rodzin, te miasta oraz przyległe do nich wioski."
"Joz19,49": "A gdy dokończyli dzielenie ziemi według jej granic, synowie Izraela dali spośród siebie dziedzictwo Jozuemu, synowi Nuna."
"Joz19,50": "Zgodnie z rozkazem PANA dali mu miasto, o które poprosił, Timnat-Serach na górze Efraim, gdzie zbudował miasto i mieszkał w nim."
"Joz19,51": "Oto dziedzictwa, które losem podzielili w posiadanie kapłan Eleazar, Jozue, syn Nuna, i naczelnicy ojców pokoleń synów Izraela w Szilo przed PANEM, u wejścia do Namiotu Zgromadzenia, i dokończyli podział ziemi."
