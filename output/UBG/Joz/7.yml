"Joz7,1": "Lecz synowie Izraela dopuścili się przestępstwa na tym, co przeklęte. Akan bowiem, syn Karmiego, syna Zabdiego, syna Zeracha, z pokolenia Judy, wziął z tego, co przeklęte. I zapłonął gniew PANA przeciw synom Izraela."
"Joz7,2": "Tymczasem Jozue posłał kilku mężczyzn z Jerycha do Aj, które leży blisko Bet-Awen, na wschód od Betel, i powiedział do nich: Idźcie i zbadajcie tę ziemię. Mężczyźni poszli więc i zbadali Aj."
"Joz7,3": "Potem wrócili do Jozuego i powiedzieli mu: Niech nie wyrusza cały lud. Niech wyruszy około dwóch lub trzech tysięcy mężczyzn i niech zburzą Aj. Nie trudź całego ludu, bo tamtych jest niewielu."
"Joz7,4": "Wyruszyło więc z ludu około trzech tysięcy mężczyzn. Uciekli jednak przed ludźmi z Aj."
"Joz7,5": "Ludzie z Aj zabili około trzydziestu sześciu z nich. Ścigali ich bowiem od bramy aż do Szebarim i zabili ich, gdy ci schodzili z góry. Dlatego serce ludu omdlało i stało się jak woda."
"Joz7,6": "Wtedy Jozue rozdarł swoje szaty, upadł twarzą na ziemię przed arką PANA i leżał tak aż do wieczora, on i starsi Izraela, i sypali proch na swoje głowy."
"Joz7,7": "Potem Jozue powiedział: Ach, Panie BOŻE, czemu przeprowadziłeś ten lud za Jordan? Czy po to, aby nas wydać w ręce Amorytów na zniszczenie? Obyśmy raczej pozostali za Jordanem!"
"Joz7,8": "O Panie, cóż powiem, gdy Izrael uciekł przed swymi wrogami?"
"Joz7,9": "Usłyszą o tym bowiem Kananejczycy i wszyscy mieszkańcy tej ziemi i otoczą nas zewsząd, i wymażą nasze imię z ziemi. I cóż uczynisz dla swego wielkiego imienia?"
"Joz7,10": "Wtedy PAN powiedział do Jozuego: Wstań! Dlaczego tak leżysz na swej twarzy?"
"Joz7,11": "Izrael zgrzeszył, złamali także moje przymierze, które im nakazałem. Wzięli bowiem z tego, co przeklęte, ukradli, skłamali i schowali to wśród swoich rzeczy."
"Joz7,12": "Dlatego synowie Izraela nie mogli się ostać przed swymi wrogami, ale uciekli przed nimi, bo stali się przekleństwem. Nie będę więcej z wami, jeśli nie wytępicie spośród was tego, co przeklęte."
"Joz7,13": "Wstań, poświęć lud i powiedz: Poświęćcie się na jutro, bo tak mówi PAN, Bóg Izraela: Pośród ciebie, Izraelu, jest to, co przeklęte. Nie staniecie przed swymi wrogami, dopóki nie usuniecie spośród siebie tego, co obłożone jest przekleństwem."
"Joz7,14": "Wystąpicie więc jutro rano według waszych pokoleń. Wówczas pokolenie, które PAN wskaże, wystąpi według rodzin; a rodzina, którą PAN wskaże, wystąpi według domów; a z domu, który PAN wskaże, wystąpią poszczególni mężczyźni."
"Joz7,15": "A ten, u kogo zostanie znalezione to, co przeklęte, będzie spalony ogniem, on i wszystko, co do niego należy, bo złamał przymierze PANA i dopuścił się haniebnego czynu w Izraelu."
"Joz7,16": "Jozue wstał więc wcześnie rano i kazał wystąpić Izraelowi według ich pokoleń; i zostało wskazane pokolenie Judy."
"Joz7,17": "I kazał wystąpić rodzinom Judy, i została wskazana rodzina Zerachitów. Potem kazał wystąpić wszystkim osobom z rodziny Zerachitów i został wskazany dom Zabdiego."
"Joz7,18": "Następnie kazał wystąpić wszystkim osobom z jego domu i został wskazany Akan, syn Karmiego, syna Zabdiego, syna Zeracha, z pokolenia Judy."
"Joz7,19": "I Jozue powiedział do Akana: Synu mój, oddaj, proszę, chwałę PANU, Bogu Izraela, i złóż mu wyznanie. Powiedz mi, co uczyniłeś, a nie ukrywaj tego przede mną."
"Joz7,20": "Wtedy Akan odpowiedział Jozuemu: Rzeczywiście, to ja zgrzeszyłem przeciw PANU, Bogu Izraela. Oto co uczyniłem:"
"Joz7,21": "Gdy zobaczyłem wśród łupów piękny płaszcz babiloński, dwieście syklów srebra i pręt złota ważący pięćdziesiąt syklów, pożądałem ich i wziąłem je. Oto są one zakopane w ziemi, w środku mego namiotu, a srebro pod nimi."
"Joz7,22": "Jozue wysłał więc posłańców, którzy pobiegli do namiotu, a oto te rzeczy były ukryte w jego namiocie, a srebro pod nimi."
"Joz7,23": "I zabrali je z namiotu, przynieśli do Jozuego oraz do wszystkich synów Izraela i położyli je przed PANEM."
"Joz7,24": "Wtedy Jozue i cały Izrael z nim wzięli Akana, syna Zeracha, srebro, płaszcz i pręt złota, jego synów i córki, jego woły, osły, owce, namiot oraz wszystko, co miał, i zaprowadzili ich do doliny Akor."
"Joz7,25": "I Jozue powiedział: Dlaczego sprowadziłeś na nas nieszczęście? PAN dzisiaj sprowadzi nieszczęście na ciebie. I cały lud Izraela ukamienował go, a po ukamienowaniu ich spalili ogniem."
"Joz7,26": "Potem wznieśli nad nim wielki stos kamieni, który trwa aż do dziś. I PAN odwrócił się od zapalczywości swego gniewu. Dlatego to miejsce nazywa się doliną Akor aż do dziś."
