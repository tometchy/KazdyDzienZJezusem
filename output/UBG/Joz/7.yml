"Joz7,1":
  text: "Lecz synowie Izraela dopuścili się przestępstwa na tym, co przeklęte. Akan bowiem, syn Karmiego, syna Zabdiego, syna Zeracha, z pokolenia Judy, wziął z tego, co przeklęte. I zapłonął gniew PANA przeciw synom Izraela."
  tags: []
"Joz7,2":
  text: "Tymczasem Jozue posłał kilku mężczyzn z Jerycha do Aj, które leży blisko Bet-Awen, na wschód od Betel, i powiedział do nich: Idźcie i zbadajcie tę ziemię. Mężczyźni poszli więc i zbadali Aj."
  tags: []
"Joz7,3":
  text: "Potem wrócili do Jozuego i powiedzieli mu: Niech nie wyrusza cały lud. Niech wyruszy około dwóch lub trzech tysięcy mężczyzn i niech zburzą Aj. Nie trudź całego ludu, bo tamtych jest niewielu."
  tags: []
"Joz7,4":
  text: "Wyruszyło więc z ludu około trzech tysięcy mężczyzn. Uciekli jednak przed ludźmi z Aj."
  tags: []
"Joz7,5":
  text: "Ludzie z Aj zabili około trzydziestu sześciu z nich. Ścigali ich bowiem od bramy aż do Szebarim i zabili ich, gdy ci schodzili z góry. Dlatego serce ludu omdlało i stało się jak woda."
  tags: []
"Joz7,6":
  text: "Wtedy Jozue rozdarł swoje szaty, upadł twarzą na ziemię przed arką PANA i leżał tak aż do wieczora, on i starsi Izraela, i sypali proch na swoje głowy."
  tags: []
"Joz7,7":
  text: "Potem Jozue powiedział: Ach, Panie BOŻE, czemu przeprowadziłeś ten lud za Jordan? Czy po to, aby nas wydać w ręce Amorytów na zniszczenie? Obyśmy raczej pozostali za Jordanem!"
  tags: []
"Joz7,8":
  text: "O Panie, cóż powiem, gdy Izrael uciekł przed swymi wrogami?"
  tags: []
"Joz7,9":
  text: "Usłyszą o tym bowiem Kananejczycy i wszyscy mieszkańcy tej ziemi i otoczą nas zewsząd, i wymażą nasze imię z ziemi. I cóż uczynisz dla swego wielkiego imienia?"
  tags: []
"Joz7,10":
  text: "Wtedy PAN powiedział do Jozuego: Wstań! Dlaczego tak leżysz na swej twarzy?"
  tags: []
"Joz7,11":
  text: "Izrael zgrzeszył, złamali także moje przymierze, które im nakazałem. Wzięli bowiem z tego, co przeklęte, ukradli, skłamali i schowali to wśród swoich rzeczy."
  tags: []
"Joz7,12":
  text: "Dlatego synowie Izraela nie mogli się ostać przed swymi wrogami, ale uciekli przed nimi, bo stali się przekleństwem. Nie będę więcej z wami, jeśli nie wytępicie spośród was tego, co przeklęte."
  tags: []
"Joz7,13":
  text: "Wstań, poświęć lud i powiedz: Poświęćcie się na jutro, bo tak mówi PAN, Bóg Izraela: Pośród ciebie, Izraelu, jest to, co przeklęte. Nie staniecie przed swymi wrogami, dopóki nie usuniecie spośród siebie tego, co obłożone jest przekleństwem."
  tags: []
"Joz7,14":
  text: "Wystąpicie więc jutro rano według waszych pokoleń. Wówczas pokolenie, które PAN wskaże, wystąpi według rodzin; a rodzina, którą PAN wskaże, wystąpi według domów; a z domu, który PAN wskaże, wystąpią poszczególni mężczyźni."
  tags: []
"Joz7,15":
  text: "A ten, u kogo zostanie znalezione to, co przeklęte, będzie spalony ogniem, on i wszystko, co do niego należy, bo złamał przymierze PANA i dopuścił się haniebnego czynu w Izraelu."
  tags: []
"Joz7,16":
  text: "Jozue wstał więc wcześnie rano i kazał wystąpić Izraelowi według ich pokoleń; i zostało wskazane pokolenie Judy."
  tags: []
"Joz7,17":
  text: "I kazał wystąpić rodzinom Judy, i została wskazana rodzina Zerachitów. Potem kazał wystąpić wszystkim osobom z rodziny Zerachitów i został wskazany dom Zabdiego."
  tags: []
"Joz7,18":
  text: "Następnie kazał wystąpić wszystkim osobom z jego domu i został wskazany Akan, syn Karmiego, syna Zabdiego, syna Zeracha, z pokolenia Judy."
  tags: []
"Joz7,19":
  text: "I Jozue powiedział do Akana: Synu mój, oddaj, proszę, chwałę PANU, Bogu Izraela, i złóż mu wyznanie. Powiedz mi, co uczyniłeś, a nie ukrywaj tego przede mną."
  tags: []
"Joz7,20":
  text: "Wtedy Akan odpowiedział Jozuemu: Rzeczywiście, to ja zgrzeszyłem przeciw PANU, Bogu Izraela. Oto co uczyniłem:"
  tags: []
"Joz7,21":
  text: "Gdy zobaczyłem wśród łupów piękny płaszcz babiloński, dwieście syklów srebra i pręt złota ważący pięćdziesiąt syklów, pożądałem ich i wziąłem je. Oto są one zakopane w ziemi, w środku mego namiotu, a srebro pod nimi."
  tags: []
"Joz7,22":
  text: "Jozue wysłał więc posłańców, którzy pobiegli do namiotu, a oto te rzeczy były ukryte w jego namiocie, a srebro pod nimi."
  tags: []
"Joz7,23":
  text: "I zabrali je z namiotu, przynieśli do Jozuego oraz do wszystkich synów Izraela i położyli je przed PANEM."
  tags: []
"Joz7,24":
  text: "Wtedy Jozue i cały Izrael z nim wzięli Akana, syna Zeracha, srebro, płaszcz i pręt złota, jego synów i córki, jego woły, osły, owce, namiot oraz wszystko, co miał, i zaprowadzili ich do doliny Akor."
  tags: []
"Joz7,25":
  text: "I Jozue powiedział: Dlaczego sprowadziłeś na nas nieszczęście? PAN dzisiaj sprowadzi nieszczęście na ciebie. I cały lud Izraela ukamienował go, a po ukamienowaniu ich spalili ogniem."
  tags: []
"Joz7,26":
  text: "Potem wznieśli nad nim wielki stos kamieni, który trwa aż do dziś. I PAN odwrócił się od zapalczywości swego gniewu. Dlatego to miejsce nazywa się doliną Akor aż do dziś."
  tags: []
