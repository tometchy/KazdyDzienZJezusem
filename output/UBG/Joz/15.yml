"Joz15,1": "Taki był los pokolenia synów Judy według ich rodzin: aż do granic Edomu przy pustkowiu Cin na południu sięgał kraniec granicy południowej."
"Joz15,2": "A ich granica południowa biegła od krańca Morza Słonego, od zatoki zwróconej ku południowi."
"Joz15,3": "I biegła od południa, ku Maale-Akrabbim, i ciągnęła się aż do Cin; a wznosząc się na południu do Kadesz-Barnea, przebiegała do Chesronu, i wznosiła się do Addary, i skręcała do Karka."
"Joz15,4": "Stamtąd przechodziła do Asmon i dochodziła do rzeki Egiptu, a kończyła się przy morzu. Taka będzie wasza granica na południu."
"Joz15,5": "Granicą zaś od wschodu było Morze Słone aż do końca Jordanu, a granica północna była od zatoki morskiej przy ujściu Jordanu."
"Joz15,6": "Granica ciągnęła się do Bet-Chogla i biegła od północy aż do Bet-Araba; stamtąd granica wznosiła się do kamienia Bohana, syna Rubena."
"Joz15,7": "Następnie granica wznosiła się do Debiru od doliny Akor i zwracała się ku północy do Gilgal leżącego naprzeciw wzniesienia Adummim, położonego na południe od rzeki. Dalej granica ciągnęła się do wód En-Szemesz i kończyła się przy En-Rogiel."
"Joz15,8": "Dalej granica wznosiła się doliną syna Hinnom do stoku Jebusyty od południa, czyli do Jerozolimy. Stamtąd wznosiła się na szczyt góry położonej naprzeciw doliny Hinnom na zachodzie i na krańcu doliny Refaimitów na północy."
"Joz15,9": "Potem granica skręcała od szczytu góry aż do źródła wody Neftoach i biegła aż do miast góry Efron; dalej ciągnęła się do Baala, czyli Kiriat-Jearim."
"Joz15,10": "Następnie granica skręcała od Baala na zachodzie do góry Seir i przechodziła do zbocza góry Jearim od północy, czyli Kesalon, potem schodziła do Bet-Szemesz i przechodziła do Timny."
"Joz15,11": "Później granica wychodziła do zbocza Ekronu na północy i skręcała do Szikronu, i przebiegała przez górę Baala; stamtąd wychodziła do Jabneel i kończyła się przy morzu."
"Joz15,12": "A granicą zachodnią było Morze Wielkie i jego wybrzeże. Oto granica synów Judy dokoła według ich rodzin."
"Joz15,13": "Kalebowi zaś, synowi Jefunnego, dał Jozue dział pośród synów Judy, jak PAN nakazał Jozuemu, miasto Arba, ojca Anaka, czyli Hebron."
"Joz15,14": "I Kaleb wypędził stamtąd trzech synów Anaka: Szeszaja i Achimana, i Talmaja, potomków Anaka."
"Joz15,15": "Stamtąd wyruszył przeciwko mieszkańcom Debiru, które dawniej nazywało się Kiriat-Sefer."
"Joz15,16": "I Kaleb powiedział: Kto pobije Kiriat-Sefer i zdobędzie je, temu dam swoją córkę Aksę za żonę."
"Joz15,17": "I zdobył je Otniel, syn Kenaza, brata Kaleba; i dał mu swoją córkę Aksę za żonę."
"Joz15,18": "A gdy ona przyszła do niego, namawiała go, aby prosił jej ojca o pole. Kiedy zsiadła z osła, Kaleb zapytał ją: Czego sobie życzysz?"
"Joz15,19": "A ona odpowiedziała: Daj mi błogosławieństwo; skoro dałeś mi ziemię południową, daj mi też źródła wód. I dał jej źródła górne i źródła dolne."
"Joz15,20": "Oto dziedzictwo pokolenia synów Judy według ich rodzin."
"Joz15,21": "Miastami granicznymi pokolenia synów Judy w stronę granicy Edomu na południu były: Kabseel, Eder, Jagur;"
"Joz15,22": "Kina, Dimona, Adada;"
"Joz15,23": "Kedesz, Chasor, Jetnan;"
"Joz15,24": "Zif, Telam, Bealot;"
"Joz15,25": "Chasor-Chadatta i Keriot-Chesron, czyli Chasor;"
"Joz15,26": "Amam, Szema, Molada;"
"Joz15,27": "Hasar-Gadda, Cheszmon, Bet-Pelet;"
"Joz15,28": "Chasar-Szual, Beer-Szeba, Biziota;"
"Joz15,29": "Baala, Ijjim, Esem;"
"Joz15,30": "Eltolad, Kesil, Chorma;"
"Joz15,31": "Siklag, Madmana, Sansanna;"
"Joz15,32": "Lebaot, Szilchim, Ain i Rimmon. Wszystkich miast było dwadzieścia dziewięć z przyległymi do nich wioskami."
"Joz15,33": "Na nizinie: Esztaol, Sorea, Aszna;"
"Joz15,34": "Zanoach, En-Gannim, Tappuach, Enam;"
"Joz15,35": "Jarmut, Adullam, Soko, Azeka;"
"Joz15,36": "Szaaraim, Aditaim, Gedera i Gederotaim: czternaście miast wraz z przyległymi do nich wioskami."
"Joz15,37": "Senan, Chadasza, Migdal-Gad;"
"Joz15,38": "Dilan, Mispe, Jokteel;"
"Joz15,39": "Lakisz, Boskat, Eglon;"
"Joz15,40": "Kabon, Lachmas, Kitlisz;"
"Joz15,41": "Gederot, Bet-Dagon, Naama i Makkeda: szesnaście miast wraz z przyległymi do nich wioskami."
"Joz15,42": "Libna, Eter, Aszan;"
"Joz15,43": "Jeftach, Aszna, Nesib;"
"Joz15,44": "Keila, Akzib i Maresza: dziewięć miast wraz z przyległymi do nich wioskami."
"Joz15,45": "Ekron i przyległe do niego miasteczka i wioski;"
"Joz15,46": "Od Ekronu aż do morza wszystkie miasta, które leżą w pobliżu Aszdodu, i przyległe do nich wioski;"
"Joz15,47": "Aszdod i przyległe do niego miasteczka i wioski, Gaza i przyległe do niej miasteczka i wioski, aż do rzeki Egiptu i Morza Wielkiego, które jest granicą."
"Joz15,48": "A w górach: Szamir, Jattir, Soko;"
"Joz15,49": "Danna, Kiriat-Sanna, czyli Debir;"
"Joz15,50": "Anab, Esztemo, Anim;"
"Joz15,51": "Goszen, Cholon i Gilo: jedenaście miast wraz z przyległymi do nich wioskami."
"Joz15,52": "Arab, Duma, Eszan;"
"Joz15,53": "Janum, Bet-Tappuach, Afeka;"
"Joz15,54": "Chumta, Kiriat-Arba, czyli Hebron, Sijor: dziewięć miast wraz z przyległymi do nich wioskami."
"Joz15,55": "Maon, Karmel, Zif, Jutta;"
"Joz15,56": "Jizreel, Jokdeam, Zanoach;"
"Joz15,57": "Kain, Gibea i Timna: dziesięć miast wraz z przyległymi do nich wioskami."
"Joz15,58": "Chalchul, Bet-Sur, Gedor;"
"Joz15,59": "I Maarat, Bet-Anot i Eltekon: sześć miast wraz z przyległymi do nich wioskami."
"Joz15,60": "Kiriat-Baal, czyli Kiriat-Jearim i Rabba: dwa miasta wraz z przyległymi do nich wioskami."
"Joz15,61": "A na pustyni: Bet-Araba, Middin, Sekaka;"
"Joz15,62": "Nibszan, miasto Soli i En-Gedi: sześć miast wraz z przyległymi do nich wioskami."
"Joz15,63": "Lecz Jebusytów, mieszkańców Jerozolimy, synowie Judy nie mogli wypędzić; dlatego Jebusyci mieszkają z synami Judy w Jerozolimie aż do dziś."
