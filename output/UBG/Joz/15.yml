"Joz15,1":
  text: "Taki był los pokolenia synów Judy według ich rodzin: aż do granic Edomu przy pustkowiu Cin na południu sięgał kraniec granicy południowej."
  tags: []
"Joz15,2":
  text: "A ich granica południowa biegła od krańca Morza Słonego, od zatoki zwróconej ku południowi."
  tags: []
"Joz15,3":
  text: "I biegła od południa, ku Maale-Akrabbim, i ciągnęła się aż do Cin; a wznosząc się na południu do Kadesz-Barnea, przebiegała do Chesronu, i wznosiła się do Addary, i skręcała do Karka."
  tags: []
"Joz15,4":
  text: "Stamtąd przechodziła do Asmon i dochodziła do rzeki Egiptu, a kończyła się przy morzu. Taka będzie wasza granica na południu."
  tags: []
"Joz15,5":
  text: "Granicą zaś od wschodu było Morze Słone aż do końca Jordanu, a granica północna była od zatoki morskiej przy ujściu Jordanu."
  tags: []
"Joz15,6":
  text: "Granica ciągnęła się do Bet-Chogla i biegła od północy aż do Bet-Araba; stamtąd granica wznosiła się do kamienia Bohana, syna Rubena."
  tags: []
"Joz15,7":
  text: "Następnie granica wznosiła się do Debiru od doliny Akor i zwracała się ku północy do Gilgal leżącego naprzeciw wzniesienia Adummim, położonego na południe od rzeki. Dalej granica ciągnęła się do wód En-Szemesz i kończyła się przy En-Rogiel."
  tags: []
"Joz15,8":
  text: "Dalej granica wznosiła się doliną syna Hinnom do stoku Jebusyty od południa, czyli do Jerozolimy. Stamtąd wznosiła się na szczyt góry położonej naprzeciw doliny Hinnom na zachodzie i na krańcu doliny Refaimitów na północy."
  tags: []
"Joz15,9":
  text: "Potem granica skręcała od szczytu góry aż do źródła wody Neftoach i biegła aż do miast góry Efron; dalej ciągnęła się do Baala, czyli Kiriat-Jearim."
  tags: []
"Joz15,10":
  text: "Następnie granica skręcała od Baala na zachodzie do góry Seir i przechodziła do zbocza góry Jearim od północy, czyli Kesalon, potem schodziła do Bet-Szemesz i przechodziła do Timny."
  tags: []
"Joz15,11":
  text: "Później granica wychodziła do zbocza Ekronu na północy i skręcała do Szikronu, i przebiegała przez górę Baala; stamtąd wychodziła do Jabneel i kończyła się przy morzu."
  tags: []
"Joz15,12":
  text: "A granicą zachodnią było Morze Wielkie i jego wybrzeże. Oto granica synów Judy dokoła według ich rodzin."
  tags: []
"Joz15,13":
  text: "Kalebowi zaś, synowi Jefunnego, dał Jozue dział pośród synów Judy, jak PAN nakazał Jozuemu, miasto Arba, ojca Anaka, czyli Hebron."
  tags: []
"Joz15,14":
  text: "I Kaleb wypędził stamtąd trzech synów Anaka: Szeszaja i Achimana, i Talmaja, potomków Anaka."
  tags: []
"Joz15,15":
  text: "Stamtąd wyruszył przeciwko mieszkańcom Debiru, które dawniej nazywało się Kiriat-Sefer."
  tags: []
"Joz15,16":
  text: "I Kaleb powiedział: Kto pobije Kiriat-Sefer i zdobędzie je, temu dam swoją córkę Aksę za żonę."
  tags: []
"Joz15,17":
  text: "I zdobył je Otniel, syn Kenaza, brata Kaleba; i dał mu swoją córkę Aksę za żonę."
  tags: []
"Joz15,18":
  text: "A gdy ona przyszła do niego, namawiała go, aby prosił jej ojca o pole. Kiedy zsiadła z osła, Kaleb zapytał ją: Czego sobie życzysz?"
  tags: []
"Joz15,19":
  text: "A ona odpowiedziała: Daj mi błogosławieństwo; skoro dałeś mi ziemię południową, daj mi też źródła wód. I dał jej źródła górne i źródła dolne."
  tags: []
"Joz15,20":
  text: "Oto dziedzictwo pokolenia synów Judy według ich rodzin."
  tags: []
"Joz15,21":
  text: "Miastami granicznymi pokolenia synów Judy w stronę granicy Edomu na południu były: Kabseel, Eder, Jagur;"
  tags: []
"Joz15,22":
  text: "Kina, Dimona, Adada;"
  tags: []
"Joz15,23":
  text: "Kedesz, Chasor, Jetnan;"
  tags: []
"Joz15,24":
  text: "Zif, Telam, Bealot;"
  tags: []
"Joz15,25":
  text: "Chasor-Chadatta i Keriot-Chesron, czyli Chasor;"
  tags: []
"Joz15,26":
  text: "Amam, Szema, Molada;"
  tags: []
"Joz15,27":
  text: "Hasar-Gadda, Cheszmon, Bet-Pelet;"
  tags: []
"Joz15,28":
  text: "Chasar-Szual, Beer-Szeba, Biziota;"
  tags: []
"Joz15,29":
  text: "Baala, Ijjim, Esem;"
  tags: []
"Joz15,30":
  text: "Eltolad, Kesil, Chorma;"
  tags: []
"Joz15,31":
  text: "Siklag, Madmana, Sansanna;"
  tags: []
"Joz15,32":
  text: "Lebaot, Szilchim, Ain i Rimmon. Wszystkich miast było dwadzieścia dziewięć z przyległymi do nich wioskami."
  tags: []
"Joz15,33":
  text: "Na nizinie: Esztaol, Sorea, Aszna;"
  tags: []
"Joz15,34":
  text: "Zanoach, En-Gannim, Tappuach, Enam;"
  tags: []
"Joz15,35":
  text: "Jarmut, Adullam, Soko, Azeka;"
  tags: []
"Joz15,36":
  text: "Szaaraim, Aditaim, Gedera i Gederotaim: czternaście miast wraz z przyległymi do nich wioskami."
  tags: []
"Joz15,37":
  text: "Senan, Chadasza, Migdal-Gad;"
  tags: []
"Joz15,38":
  text: "Dilan, Mispe, Jokteel;"
  tags: []
"Joz15,39":
  text: "Lakisz, Boskat, Eglon;"
  tags: []
"Joz15,40":
  text: "Kabon, Lachmas, Kitlisz;"
  tags: []
"Joz15,41":
  text: "Gederot, Bet-Dagon, Naama i Makkeda: szesnaście miast wraz z przyległymi do nich wioskami."
  tags: []
"Joz15,42":
  text: "Libna, Eter, Aszan;"
  tags: []
"Joz15,43":
  text: "Jeftach, Aszna, Nesib;"
  tags: []
"Joz15,44":
  text: "Keila, Akzib i Maresza: dziewięć miast wraz z przyległymi do nich wioskami."
  tags: []
"Joz15,45":
  text: "Ekron i przyległe do niego miasteczka i wioski;"
  tags: []
"Joz15,46":
  text: "Od Ekronu aż do morza wszystkie miasta, które leżą w pobliżu Aszdodu, i przyległe do nich wioski;"
  tags: []
"Joz15,47":
  text: "Aszdod i przyległe do niego miasteczka i wioski, Gaza i przyległe do niej miasteczka i wioski, aż do rzeki Egiptu i Morza Wielkiego, które jest granicą."
  tags: []
"Joz15,48":
  text: "A w górach: Szamir, Jattir, Soko;"
  tags: []
"Joz15,49":
  text: "Danna, Kiriat-Sanna, czyli Debir;"
  tags: []
"Joz15,50":
  text: "Anab, Esztemo, Anim;"
  tags: []
"Joz15,51":
  text: "Goszen, Cholon i Gilo: jedenaście miast wraz z przyległymi do nich wioskami."
  tags: []
"Joz15,52":
  text: "Arab, Duma, Eszan;"
  tags: []
"Joz15,53":
  text: "Janum, Bet-Tappuach, Afeka;"
  tags: []
"Joz15,54":
  text: "Chumta, Kiriat-Arba, czyli Hebron, Sijor: dziewięć miast wraz z przyległymi do nich wioskami."
  tags: []
"Joz15,55":
  text: "Maon, Karmel, Zif, Jutta;"
  tags: []
"Joz15,56":
  text: "Jizreel, Jokdeam, Zanoach;"
  tags: []
"Joz15,57":
  text: "Kain, Gibea i Timna: dziesięć miast wraz z przyległymi do nich wioskami."
  tags: []
"Joz15,58":
  text: "Chalchul, Bet-Sur, Gedor;"
  tags: []
"Joz15,59":
  text: "I Maarat, Bet-Anot i Eltekon: sześć miast wraz z przyległymi do nich wioskami."
  tags: []
"Joz15,60":
  text: "Kiriat-Baal, czyli Kiriat-Jearim i Rabba: dwa miasta wraz z przyległymi do nich wioskami."
  tags: []
"Joz15,61":
  text: "A na pustyni: Bet-Araba, Middin, Sekaka;"
  tags: []
"Joz15,62":
  text: "Nibszan, miasto Soli i En-Gedi: sześć miast wraz z przyległymi do nich wioskami."
  tags: []
"Joz15,63":
  text: "Lecz Jebusytów, mieszkańców Jerozolimy, synowie Judy nie mogli wypędzić; dlatego Jebusyci mieszkają z synami Judy w Jerozolimie aż do dziś."
  tags: []
