"Sdz4,1": "A po śmierci Ehuda synowie Izraela znowu czynili to, co złe w oczach PANA."
"Sdz4,2": "I PAN wydał ich w ręce Jabina, króla Kanaanu, który królował w Chasor. Dowódcą jego wojska był Sisera, który mieszkał w pogańskim Charoszet."
"Sdz4,3": "I synowie Izraela wołali do PANA. Miał tamten bowiem dziewięćset żelaznych rydwanów i mocno uciskał synów Izraela przez dwadzieścia lat."
"Sdz4,4": "W tym czasie sądziła Izraela prorokini Debora, żona Lappidota."
"Sdz4,5": "I mieszkała pod palmą Debory, między Rama a Betel, na górze Efraim, a synowie Izraela przychodzili do niej na sąd."
"Sdz4,6": "Posłała ona i wezwała Baraka, syna Abinoama, z Kedesz-Neftali, i powiedziała do niego: Czy PAN, Bóg Izraela nie rozkazał: Idź, udaj się na górę Tabor i weź ze sobą dziesięć tysięcy mężczyzn z synów Neftalego i z synów Zebulona?"
"Sdz4,7": "I przyprowadzę do ciebie, do rzeki Kiszon, Siserę, dowódcę wojska Jabina, jego rydwany i jego liczne oddziały, i wydam go w twoje ręce."
"Sdz4,8": "Barak zaś powiedział do niej: Jeśli pójdziesz ze mną, pójdę, lecz jeśli nie pójdziesz ze mną, nie pójdę."
"Sdz4,9": "Ona odpowiedziała: Na pewno pójdę z tobą. Nie tobie jednak przypadnie chwała z tej wyprawy, na którą wyruszysz. PAN bowiem wyda Siserę w ręce kobiety. I Debora wstała, i udała się z Barakiem do Kedesz."
"Sdz4,10": "Wtedy Barak wezwał Zebulona i Neftalego do Kedesz i wyruszył, a za nim dziesięć tysięcy mężczyzn. Szła z nim także Debora."
"Sdz4,11": "A Cheber Kenita odłączył się od Kenitów, od synów Chobaba, teścia Mojżesza, i rozbił swój namiot aż do równin w Saananim, które jest przy Kedesz."
"Sdz4,12": "I doniesiono Siserze, że Barak, syn Abinoama, wyruszył na górę Tabor."
"Sdz4,13": "Sisera zebrał więc wszystkie swoje rydwany, to jest dziewięćset żelaznych rydwanów, oraz cały lud, który z nim był, od pogańskiego Charoszet aż do rzeki Kiszon."
"Sdz4,14": "Wtedy Debora powiedziała do Baraka: Wstań, bo to jest dzień, w którym PAN wyda Siserę w twoje ręce. Czyż PAN nie idzie przed tobą? Barak zszedł więc z góry Tabor, a dziesięć tysięcy mężczyzn zeszło za nim."
"Sdz4,15": "I PAN rozgromił Siserę, wszystkie wozy oraz całe jego wojsko ostrzem miecza przed Barakiem, tak że Sisera zeskoczył z rydwanu i uciekał pieszo."
"Sdz4,16": "Lecz Barak ścigał rydwany i wojsko aż do pogańskiego Charoszet. I poległo od ostrza miecza całe wojsko Sisery; nie pozostał ani jeden z jego wojowników."
"Sdz4,17": "A Sisera uciekł pieszo do namiotu Jael, żony Chebera Kenity, ponieważ panował pokój między Jabinem, królem Chasoru, a domem Chebera Kenity."
"Sdz4,18": "A Jael wyszła naprzeciw Siserze i powiedziała do niego: Wejdź, mój panie, wejdź do mnie, nie bój się. Wszedł więc do niej do namiotu, a ona przykryła go kocem."
"Sdz4,19": "Wtedy powiedział do niej: Daj mi, proszę, napić się trochę wody, bo jestem spragniony. A ona otworzyła bukłak z mlekiem, dała mu się napić i przykryła go."
"Sdz4,20": "I powiedział do niej: Stój przy wejściu do namiotu, a jeśli ktoś przyjdzie i zapyta cię: Czy jest tu ktoś? – odpowiesz: Nie ma."
"Sdz4,21": "Potem Jael, żona Chebera, wzięła kołek od namiotu, chwyciła do ręki młot, podeszła do niego po cichu i wbiła kołek w jego skroń, tak że ten utkwił w ziemi, bo on twardo spał, gdyż był zmęczony. I w ten sposób umarł."
"Sdz4,22": "Tymczasem Barak ścigał Siserę i Jael wyszła mu naprzeciw, i powiedziała do niego: Chodź, a pokażę ci człowieka, którego szukasz. I wstąpił do niej, a oto Sisera leżał martwy z kołkiem w skroni."
"Sdz4,23": "Tak Bóg tego dnia poniżył przed synami Izraela Jabina, króla Kanaanu."
"Sdz4,24": "I ręka synów Izraela coraz bardziej nacierała na Jabina, króla Kanaanu, i uciskała go, aż zgładzili Jabina, króla Kanaanu."
