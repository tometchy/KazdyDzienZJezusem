"Sdz4,1":
  text: "A po śmierci Ehuda synowie Izraela znowu czynili to, co złe w oczach PANA."
  tags: []
"Sdz4,2":
  text: "I PAN wydał ich w ręce Jabina, króla Kanaanu, który królował w Chasor. Dowódcą jego wojska był Sisera, który mieszkał w pogańskim Charoszet."
  tags: []
"Sdz4,3":
  text: "I synowie Izraela wołali do PANA. Miał tamten bowiem dziewięćset żelaznych rydwanów i mocno uciskał synów Izraela przez dwadzieścia lat."
  tags: []
"Sdz4,4":
  text: "W tym czasie sądziła Izraela prorokini Debora, żona Lappidota."
  tags: []
"Sdz4,5":
  text: "I mieszkała pod palmą Debory, między Rama a Betel, na górze Efraim, a synowie Izraela przychodzili do niej na sąd."
  tags: []
"Sdz4,6":
  text: "Posłała ona i wezwała Baraka, syna Abinoama, z Kedesz-Neftali, i powiedziała do niego: Czy PAN, Bóg Izraela nie rozkazał: Idź, udaj się na górę Tabor i weź ze sobą dziesięć tysięcy mężczyzn z synów Neftalego i z synów Zebulona?"
  tags: []
"Sdz4,7":
  text: "I przyprowadzę do ciebie, do rzeki Kiszon, Siserę, dowódcę wojska Jabina, jego rydwany i jego liczne oddziały, i wydam go w twoje ręce."
  tags: []
"Sdz4,8":
  text: "Barak zaś powiedział do niej: Jeśli pójdziesz ze mną, pójdę, lecz jeśli nie pójdziesz ze mną, nie pójdę."
  tags: []
"Sdz4,9":
  text: "Ona odpowiedziała: Na pewno pójdę z tobą. Nie tobie jednak przypadnie chwała z tej wyprawy, na którą wyruszysz. PAN bowiem wyda Siserę w ręce kobiety. I Debora wstała, i udała się z Barakiem do Kedesz."
  tags: []
"Sdz4,10":
  text: "Wtedy Barak wezwał Zebulona i Neftalego do Kedesz i wyruszył, a za nim dziesięć tysięcy mężczyzn. Szła z nim także Debora."
  tags: []
"Sdz4,11":
  text: "A Cheber Kenita odłączył się od Kenitów, od synów Chobaba, teścia Mojżesza, i rozbił swój namiot aż do równin w Saananim, które jest przy Kedesz."
  tags: []
"Sdz4,12":
  text: "I doniesiono Siserze, że Barak, syn Abinoama, wyruszył na górę Tabor."
  tags: []
"Sdz4,13":
  text: "Sisera zebrał więc wszystkie swoje rydwany, to jest dziewięćset żelaznych rydwanów, oraz cały lud, który z nim był, od pogańskiego Charoszet aż do rzeki Kiszon."
  tags: []
"Sdz4,14":
  text: "Wtedy Debora powiedziała do Baraka: Wstań, bo to jest dzień, w którym PAN wyda Siserę w twoje ręce. Czyż PAN nie idzie przed tobą? Barak zszedł więc z góry Tabor, a dziesięć tysięcy mężczyzn zeszło za nim."
  tags: []
"Sdz4,15":
  text: "I PAN rozgromił Siserę, wszystkie wozy oraz całe jego wojsko ostrzem miecza przed Barakiem, tak że Sisera zeskoczył z rydwanu i uciekał pieszo."
  tags: []
"Sdz4,16":
  text: "Lecz Barak ścigał rydwany i wojsko aż do pogańskiego Charoszet. I poległo od ostrza miecza całe wojsko Sisery; nie pozostał ani jeden z jego wojowników."
  tags: []
"Sdz4,17":
  text: "A Sisera uciekł pieszo do namiotu Jael, żony Chebera Kenity, ponieważ panował pokój między Jabinem, królem Chasoru, a domem Chebera Kenity."
  tags: []
"Sdz4,18":
  text: "A Jael wyszła naprzeciw Siserze i powiedziała do niego: Wejdź, mój panie, wejdź do mnie, nie bój się. Wszedł więc do niej do namiotu, a ona przykryła go kocem."
  tags: []
"Sdz4,19":
  text: "Wtedy powiedział do niej: Daj mi, proszę, napić się trochę wody, bo jestem spragniony. A ona otworzyła bukłak z mlekiem, dała mu się napić i przykryła go."
  tags: []
"Sdz4,20":
  text: "I powiedział do niej: Stój przy wejściu do namiotu, a jeśli ktoś przyjdzie i zapyta cię: Czy jest tu ktoś? – odpowiesz: Nie ma."
  tags: []
"Sdz4,21":
  text: "Potem Jael, żona Chebera, wzięła kołek od namiotu, chwyciła do ręki młot, podeszła do niego po cichu i wbiła kołek w jego skroń, tak że ten utkwił w ziemi, bo on twardo spał, gdyż był zmęczony. I w ten sposób umarł."
  tags: []
"Sdz4,22":
  text: "Tymczasem Barak ścigał Siserę i Jael wyszła mu naprzeciw, i powiedziała do niego: Chodź, a pokażę ci człowieka, którego szukasz. I wstąpił do niej, a oto Sisera leżał martwy z kołkiem w skroni."
  tags: []
"Sdz4,23":
  text: "Tak Bóg tego dnia poniżył przed synami Izraela Jabina, króla Kanaanu."
  tags: []
"Sdz4,24":
  text: "I ręka synów Izraela coraz bardziej nacierała na Jabina, króla Kanaanu, i uciskała go, aż zgładzili Jabina, króla Kanaanu."
  tags: []
