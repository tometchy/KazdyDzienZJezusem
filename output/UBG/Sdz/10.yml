"Sdz10,1": "Po Abimeleku powstał, aby bronić Izraela, Tola, syn Puy, syna Doda, mężczyzna z pokolenia Issachara. Mieszkał on w Szamir, na górze Efraim."
"Sdz10,2": "Sądził on Izraela przez dwadzieścia trzy lata, po czym umarł i został pogrzebany w Szamir."
"Sdz10,3": "A po nim powstał Jair Gileadczyk, który sądził Izraela przez dwadzieścia dwa lata."
"Sdz10,4": "Miał on trzydziestu synów, którzy jeździli na trzydziestu oślętach, a mieli trzydzieści miast zwanych do dziś Chawot-Jair, a są one w ziemi Gilead."
"Sdz10,5": "Umarł Jair i został pogrzebany w Kamon."
"Sdz10,6": "A synowie Izraela znowu czynili to, co złe w oczach PANA, służąc Baalom i Asztartom, bogom Syrii, bogom Sydonu, bogom Moabu, bogom synów Ammona i bogom filistyńskim, a opuścili PANA i nie służyli mu."
"Sdz10,7": "Dlatego gniew PANA zapłonął przeciw Izraelowi i wydał ich w ręce Filistynów oraz w ręce synów Ammona."
"Sdz10,8": "Oni trapili i uciskali synów Izraela od tego roku przez osiemnaście lat – wszystkich synów Izraela, którzy byli za Jordanem w ziemi Amorytów, która jest w Gileadzie."
"Sdz10,9": "Synowie Ammona przeprawili się też za Jordan, aby walczyć z Judą i Beniaminem, a także z domem Efraima, i Izrael był bardzo uciskany."
"Sdz10,10": "Wtedy synowie Izraela wołali do PANA: Zgrzeszyliśmy przeciw tobie, bo opuściliśmy naszego Boga, a służyliśmy Baalom."
"Sdz10,11": "I PAN powiedział do synów Izraela: Czy nie wybawiłem was od Egipcjan, od Amorytów, od synów Ammona i od Filistynów?"
"Sdz10,12": "I od Sydończyków, Amalekitów i Mahanitów, którzy was gnębili? Gdy wołaliście do mnie, czy nie wybawiłem was z ich rąk?"
"Sdz10,13": "Lecz wy mnie opuściliście i służyliście obcym bogom. Dlatego już was więcej nie wybawię."
"Sdz10,14": "Idźcie i wołajcie do bogów, których sobie wybraliście. Niech oni was wybawią w czasie waszego ucisku."
"Sdz10,15": "Synowie Izraela odpowiedzieli PANU: Zgrzeszyliśmy. Uczyń z nami, co wydaje się dobre w twoich oczach, tylko wybaw nas, prosimy, dzisiaj."
"Sdz10,16": "Wyrzucili więc obcych bogów spośród siebie i służyli PANU, a PAN wzruszył się niedolą Izraela."
"Sdz10,17": "Tymczasem synowie Ammona zebrali się i rozbili obóz w Gileadzie. Także synowie Izraela zebrali się i rozbili obóz w Mispie."
"Sdz10,18": "Wtedy lud i przełożeni Gileadu mówili między sobą: Kto pierwszy podejmie walkę z synami Ammona, ten stanie na czele wszystkich mieszkańców Gileadu."
