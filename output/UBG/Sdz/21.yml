"Sdz21,1":
  text: "Mężczyźni Izraela przysięgli też w Mispie: Żaden z nas nie da swojej córki Beniaminowi za żonę."
  tags: []
"Sdz21,2":
  text: "Udał się więc lud do domu Bożego, gdzie trwał aż do wieczora przed Bogiem, podnosząc lament i gorzko płacząc."
  tags: []
"Sdz21,3":
  text: "I powiedzieli: O PANIE, Boże Izraela, dlaczego to się stało w Izraelu, że ubyło dzisiaj z Izraela jedno pokolenie?"
  tags: []
"Sdz21,4":
  text: "A nazajutrz lud wstał wcześnie rano i zbudował tam ołtarz, i złożył całopalenia oraz ofiary pojednawcze."
  tags: []
"Sdz21,5":
  text: "Potem synowie Izraela powiedzieli: Kto spośród wszystkich pokoleń Izraela nie przyszedł do zgromadzenia do PANA? Złożyli bowiem uroczystą przysięgę przeciw temu, który by nie przyszedł do PANA do Mispy, mówiąc: Poniesie śmierć."
  tags: []
"Sdz21,6":
  text: "I synom Izraela było żal Beniamina, swego brata, i mówili: Dziś zostało odcięte jedno pokolenie od Izraela."
  tags: []
"Sdz21,7":
  text: "Co uczynimy dla tych, którzy pozostali, aby mieli żony, skoro przysięgliśmy na PANA, że im nie damy naszych córek za żony?"
  tags: []
"Sdz21,8":
  text: "Powiedzieli więc: Czy jest ktoś wśród pokoleń Izraela, kto nie przyszedł do Mispy do PANA? A oto nie przyszedł do obozu zgromadzenia nikt z Jabesz-Gilead."
  tags: []
"Sdz21,9":
  text: "Gdy bowiem przeliczono lud, nie było tam nikogo z mieszkańców Jabesz-Gilead."
  tags: []
"Sdz21,10":
  text: "Wtedy zgromadzenie wysłało tam dwanaście tysięcy walecznych mężczyzn, nakazując im: Idźcie i zabijcie mieszkańców Jabesz-Gilead ostrzem miecza wraz z kobietami i dziećmi."
  tags: []
"Sdz21,11":
  text: "A tak macie postąpić: Każdego mężczyznę i każdą kobietę, która obcowała z mężczyzną, zabijecie."
  tags: []
"Sdz21,12":
  text: "I znaleźli wśród mieszkańców Jabesz-Gilead czterysta młodych dziewic, które nie obcowały z mężczyzną, i przyprowadzili je do obozu w Szilo, które było w ziemi Kanaan."
  tags: []
"Sdz21,13":
  text: "Potem całe zgromadzenie posłało do synów Beniamina, którzy byli na skale Rimmon, aby oznajmiać im pokój."
  tags: []
"Sdz21,14":
  text: "Wrócił więc Beniamin w tym czasie i dano im żony, które zachowali przy życiu spośród kobiet z Jabesz-Gilead, lecz nie starczyło ich dla nich."
  tags: []
"Sdz21,15":
  text: "A ludowi było żal Beniamina, ponieważ PAN uczynił wyłom wśród pokoleń Izraela."
  tags: []
"Sdz21,16":
  text: "Wtedy starsi zgromadzenia powiedzieli: A co uczynimy dla pozostałych, aby mieli żony, skoro zostały zgładzone kobiety z Beniamina?"
  tags: []
"Sdz21,17":
  text: "Ponadto powiedzieli: Musi być dziedzictwo dla pozostałych z Beniamina, aby nie zaginęło pokolenie z Izraela."
  tags: []
"Sdz21,18":
  text: "My jednak nie możemy im dać żon z naszych córek, gdyż synowie Izraela przysięgli: Przeklęty ten, kto da żonę Beniaminowi."
  tags: []
"Sdz21,19":
  text: "Potem powiedzieli: Oto co roku odbywa się uroczyste święto PANA w Szilo, które leży na północ od Betel, na wschód od drogi wiodącej od Betel do Sychem, a na południe od Lebony."
  tags: []
"Sdz21,20":
  text: "Nakazali więc synom Beniamina: Idźcie i przygotujcie zasadzkę w winnicach;"
  tags: []
"Sdz21,21":
  text: "I wypatrujcie, gdy córki Szilo wyjdą gromadnie do tańca, wtedy wyjdźcie z winnic i niech każdy z was porwie sobie żonę spośród córek Szilo, a potem idźcie do ziemi Beniamina."
  tags: []
"Sdz21,22":
  text: "A gdy przyjdą ich ojcowie albo bracia, by skarżyć się przed nami, powiemy im: Zmiłujcie się nad nimi ze względu na nas, ponieważ nie wzięliśmy dla każdego z nich żony na wojnie, a wy też im ich nie daliście, gdyż bylibyście wtedy winni."
  tags: []
"Sdz21,23":
  text: "Wtedy synowie Beniamina uczynili tak i wzięli sobie żony spośród tańczących, które porwali, odpowiednio do swojej liczby. Potem odeszli i wrócili do swego dziedzictwa, odbudowali miasta i zamieszkali w nich."
  tags: []
"Sdz21,24":
  text: "W tym czasie synowie Izraela rozeszli się stamtąd, każdy do swego pokolenia i do swego domu, a każdy poszedł stamtąd do swego dziedzictwa."
  tags: []
"Sdz21,25":
  text: "W tych dniach nie było króla w Izraelu. Każdy czynił to, co było słuszne w jego oczach."
  tags: []
