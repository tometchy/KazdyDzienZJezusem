"Sdz21,1": "Mężczyźni Izraela przysięgli też w Mispie: Żaden z nas nie da swojej córki Beniaminowi za żonę."
"Sdz21,2": "Udał się więc lud do domu Bożego, gdzie trwał aż do wieczora przed Bogiem, podnosząc lament i gorzko płacząc."
"Sdz21,3": "I powiedzieli: O PANIE, Boże Izraela, dlaczego to się stało w Izraelu, że ubyło dzisiaj z Izraela jedno pokolenie?"
"Sdz21,4": "A nazajutrz lud wstał wcześnie rano i zbudował tam ołtarz, i złożył całopalenia oraz ofiary pojednawcze."
"Sdz21,5": "Potem synowie Izraela powiedzieli: Kto spośród wszystkich pokoleń Izraela nie przyszedł do zgromadzenia do PANA? Złożyli bowiem uroczystą przysięgę przeciw temu, który by nie przyszedł do PANA do Mispy, mówiąc: Poniesie śmierć."
"Sdz21,6": "I synom Izraela było żal Beniamina, swego brata, i mówili: Dziś zostało odcięte jedno pokolenie od Izraela."
"Sdz21,7": "Co uczynimy dla tych, którzy pozostali, aby mieli żony, skoro przysięgliśmy na PANA, że im nie damy naszych córek za żony?"
"Sdz21,8": "Powiedzieli więc: Czy jest ktoś wśród pokoleń Izraela, kto nie przyszedł do Mispy do PANA? A oto nie przyszedł do obozu zgromadzenia nikt z Jabesz-Gilead."
"Sdz21,9": "Gdy bowiem przeliczono lud, nie było tam nikogo z mieszkańców Jabesz-Gilead."
"Sdz21,10": "Wtedy zgromadzenie wysłało tam dwanaście tysięcy walecznych mężczyzn, nakazując im: Idźcie i zabijcie mieszkańców Jabesz-Gilead ostrzem miecza wraz z kobietami i dziećmi."
"Sdz21,11": "A tak macie postąpić: Każdego mężczyznę i każdą kobietę, która obcowała z mężczyzną, zabijecie."
"Sdz21,12": "I znaleźli wśród mieszkańców Jabesz-Gilead czterysta młodych dziewic, które nie obcowały z mężczyzną, i przyprowadzili je do obozu w Szilo, które było w ziemi Kanaan."
"Sdz21,13": "Potem całe zgromadzenie posłało do synów Beniamina, którzy byli na skale Rimmon, aby oznajmiać im pokój."
"Sdz21,14": "Wrócił więc Beniamin w tym czasie i dano im żony, które zachowali przy życiu spośród kobiet z Jabesz-Gilead, lecz nie starczyło ich dla nich."
"Sdz21,15": "A ludowi było żal Beniamina, ponieważ PAN uczynił wyłom wśród pokoleń Izraela."
"Sdz21,16": "Wtedy starsi zgromadzenia powiedzieli: A co uczynimy dla pozostałych, aby mieli żony, skoro zostały zgładzone kobiety z Beniamina?"
"Sdz21,17": "Ponadto powiedzieli: Musi być dziedzictwo dla pozostałych z Beniamina, aby nie zaginęło pokolenie z Izraela."
"Sdz21,18": "My jednak nie możemy im dać żon z naszych córek, gdyż synowie Izraela przysięgli: Przeklęty ten, kto da żonę Beniaminowi."
"Sdz21,19": "Potem powiedzieli: Oto co roku odbywa się uroczyste święto PANA w Szilo, które leży na północ od Betel, na wschód od drogi wiodącej od Betel do Sychem, a na południe od Lebony."
"Sdz21,20": "Nakazali więc synom Beniamina: Idźcie i przygotujcie zasadzkę w winnicach;"
"Sdz21,21": "I wypatrujcie, gdy córki Szilo wyjdą gromadnie do tańca, wtedy wyjdźcie z winnic i niech każdy z was porwie sobie żonę spośród córek Szilo, a potem idźcie do ziemi Beniamina."
"Sdz21,22": "A gdy przyjdą ich ojcowie albo bracia, by skarżyć się przed nami, powiemy im: Zmiłujcie się nad nimi ze względu na nas, ponieważ nie wzięliśmy dla każdego z nich żony na wojnie, a wy też im ich nie daliście, gdyż bylibyście wtedy winni."
"Sdz21,23": "Wtedy synowie Beniamina uczynili tak i wzięli sobie żony spośród tańczących, które porwali, odpowiednio do swojej liczby. Potem odeszli i wrócili do swego dziedzictwa, odbudowali miasta i zamieszkali w nich."
"Sdz21,24": "W tym czasie synowie Izraela rozeszli się stamtąd, każdy do swego pokolenia i do swego domu, a każdy poszedł stamtąd do swego dziedzictwa."
"Sdz21,25": "W tych dniach nie było króla w Izraelu. Każdy czynił to, co było słuszne w jego oczach."
