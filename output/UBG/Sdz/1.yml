"Sdz1,1": "Po śmierci Jozuego synowie Izraela pytali PANA: Któż z nas wyruszy pierwszy przeciwko Kananejczykom, aby walczyć z nimi?"
"Sdz1,2": "I PAN powiedział: Wyruszy Juda. Oto dałem ziemię w jego ręce."
"Sdz1,3": "Juda powiedział do swego brata Symeona: Chodź ze mną do mego losu, a będziemy walczyć z Kananejczykami. Potem ja pójdę z tobą do twego losu. I Symeon poszedł z nim."
"Sdz1,4": "Wyruszył więc Juda, a PAN wydał Kananejczyków i Peryzzytów w ich ręce i zabili w Bezek dziesięć tysięcy mężczyzn."
"Sdz1,5": "W Bezek znaleźli Adoni-Bezeka i walczyli z nim, i zabili Kananejczyków i Peryzzytów."
"Sdz1,6": "I Adoni-Bezek uciekł, oni zaś ścigali go; a gdy go pojmali, ucięli mu kciuki u rąk i paluchy u nóg."
"Sdz1,7": "Wtedy Adoni-Bezek powiedział: Siedemdziesięciu królów z obciętymi kciukami u rąk i paluchami u nóg zbierało okruchy pod moim stołem. Jak ja uczyniłem, tak mi Bóg odpłacił. I przyprowadzili go do Jerozolimy, i tam umarł."
"Sdz1,8": "Przedtem bowiem synowie Judy walczyli przeciwko Jerozolimie, zdobyli ją i pobili ostrzem miecza, a miasto spalili ogniem."
"Sdz1,9": "Potem synowie Judy wyruszyli, aby walczyć z Kananejczykami mieszkającymi w górach, na południu i na nizinie."
"Sdz1,10": "Następnie Juda wyruszył przeciwko Kananejczykom, którzy mieszkali w Hebronie (a Hebron przedtem nazywał się Kiriat-Arba), i pobił Szeszaja, Achimana i Talmaja."
"Sdz1,11": "Stamtąd wyruszył przeciwko mieszkańcom Debiru, a Debir przedtem nazywał się Kiriat-Sefer."
"Sdz1,12": "I Kaleb powiedział: Temu, kto pobije Kiriat-Sefer i zdobędzie je, dam swoją córkę Aksę za żonę."
"Sdz1,13": "Zdobył je Otniel, syn Kenaza, młodszego brata Kaleba. I dał mu swoją córkę Aksę za żonę."
"Sdz1,14": "A gdy ona przyszła do niego, namawiała go, aby prosił jej ojca o pole; i zsiadła z osła, a Kaleb zapytał ją: Czego sobie życzysz?"
"Sdz1,15": "A ona odpowiedziała: Daj mi błogosławieństwo. Skoro dałeś mi ziemię południową, daj mi też źródła wód. I Kaleb dał jej źródła górne i źródła dolne."
"Sdz1,16": "Synowie Kenity, teścia Mojżesza, wyruszyli z miasta palm razem z synami Judy na pustynię Judy leżącą na południu od Arad. Gdy tam przybyli, zamieszkali z ludem."
"Sdz1,17": "Potem Juda wyruszył ze swym bratem Symeonem i zabili Kananejczyków mieszkających w Sefat, i zburzyli je, i nazwali to miasto Chorma."
"Sdz1,18": "Juda zdobył też Gazę wraz z jej granicami, Aszkelon wraz z jego granicami i Ekron wraz z jego granicami."
"Sdz1,19": "I PAN był z Judą, który posiadł górę, lecz nie mógł wypędzić mieszkańców doliny, bo ci mieli żelazne rydwany."
"Sdz1,20": "Kalebowi zaś dano Hebron, jak powiedział Mojżesz. Stamtąd wygnał on trzech synów Anaka."
"Sdz1,21": "Ale synowie Beniamina nie wygnali Jebusytów mieszkających w Jerozolimie; dlatego Jebusyci mieszkają z synami Beniamina w Jerozolimie aż do dziś."
"Sdz1,22": "Wyruszył też dom Józefa przeciwko Betel, a PAN był z nim."
"Sdz1,23": "I dom Józefa wyszpiegował Betel – a miasto to przedtem nazywało się Luz."
"Sdz1,24": "A gdy szpiedzy zobaczyli człowieka wychodzącego z miasta, powiedzieli do niego: Prosimy, pokaż nam wejście do miasta, a okażemy ci miłosierdzie."
"Sdz1,25": "I pokazał im wejście do miasta, a oni pobili miasto ostrzem miecza, lecz tego człowieka wraz z całą jego rodziną puścili wolno."
"Sdz1,26": "I tak człowiek ten udał się do ziemi Chetytów, zbudował miasto i nadał mu nazwę Luz. To jest jego nazwa aż do dziś."
"Sdz1,27": "Manasses nie wypędził też mieszkańców Bet-Szean i jego miasteczek ani mieszkańców Tanaku i jego miasteczek, ani mieszkańców Dor i jego miasteczek, ani mieszkańców Jibleam i jego miasteczek, ani mieszkańców Megiddo i jego miasteczek. Kananejczycy nadal mieszkali więc w tej ziemi."
"Sdz1,28": "A gdy Izrael się wzmocnił, kazał Kananejczykom płacić daninę i nie wygnał ich."
"Sdz1,29": "Także i Efraim nie wypędził Kananejczyków mieszkających w Gezer, dlatego Kananejczycy mieszkali wśród nich w Gezer."
"Sdz1,30": "Zebulon również nie wypędził mieszkańców Kitron ani mieszkańców Nahalol, dlatego Kananejczycy mieszkali wśród nich i płacili im daninę."
"Sdz1,31": "Aszer także nie wypędził mieszkańców Akko ani mieszkańców Sydonu, Achlab, Akzibu, Chelba, Afik i Rechob."
"Sdz1,32": "I Aszer mieszkał pośród Kananejczyków mieszkających w tej ziemi, gdyż ich nie wypędził."
"Sdz1,33": "Neftali też nie wypędził mieszkańców Bet-Szemesz ani mieszkańców Bet-Anat i mieszkał wśród Kananejczyków mieszkających w tej ziemi. Jednakże mieszkańcy Bet-Szemesz i Bet-Anat płacili mu daninę."
"Sdz1,34": "Amoryci zaś wyparli synów Dana w góry, tak że nie pozwalali im schodzić do doliny."
"Sdz1,35": "Amoryci utrzymali się i mieszkali na górze Cheres, w Ajjalonie i w Szaalbin, lecz wzmocniła się ręka domu Józefa i zaczęli mu płacić daninę."
"Sdz1,36": "A granica Amorytów biegła od wzniesienia do Akrabbim, od skały i wyżej."
