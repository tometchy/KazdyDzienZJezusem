"Sdz1,1":
  text: "Po śmierci Jozuego synowie Izraela pytali PANA: Któż z nas wyruszy pierwszy przeciwko Kananejczykom, aby walczyć z nimi?"
  tags: []
"Sdz1,2":
  text: "I PAN powiedział: Wyruszy Juda. Oto dałem ziemię w jego ręce."
  tags: []
"Sdz1,3":
  text: "Juda powiedział do swego brata Symeona: Chodź ze mną do mego losu, a będziemy walczyć z Kananejczykami. Potem ja pójdę z tobą do twego losu. I Symeon poszedł z nim."
  tags: []
"Sdz1,4":
  text: "Wyruszył więc Juda, a PAN wydał Kananejczyków i Peryzzytów w ich ręce i zabili w Bezek dziesięć tysięcy mężczyzn."
  tags: []
"Sdz1,5":
  text: "W Bezek znaleźli Adoni-Bezeka i walczyli z nim, i zabili Kananejczyków i Peryzzytów."
  tags: []
"Sdz1,6":
  text: "I Adoni-Bezek uciekł, oni zaś ścigali go; a gdy go pojmali, ucięli mu kciuki u rąk i paluchy u nóg."
  tags: []
"Sdz1,7":
  text: "Wtedy Adoni-Bezek powiedział: Siedemdziesięciu królów z obciętymi kciukami u rąk i paluchami u nóg zbierało okruchy pod moim stołem. Jak ja uczyniłem, tak mi Bóg odpłacił. I przyprowadzili go do Jerozolimy, i tam umarł."
  tags: []
"Sdz1,8":
  text: "Przedtem bowiem synowie Judy walczyli przeciwko Jerozolimie, zdobyli ją i pobili ostrzem miecza, a miasto spalili ogniem."
  tags: []
"Sdz1,9":
  text: "Potem synowie Judy wyruszyli, aby walczyć z Kananejczykami mieszkającymi w górach, na południu i na nizinie."
  tags: []
"Sdz1,10":
  text: "Następnie Juda wyruszył przeciwko Kananejczykom, którzy mieszkali w Hebronie (a Hebron przedtem nazywał się Kiriat-Arba), i pobił Szeszaja, Achimana i Talmaja."
  tags: []
"Sdz1,11":
  text: "Stamtąd wyruszył przeciwko mieszkańcom Debiru, a Debir przedtem nazywał się Kiriat-Sefer."
  tags: []
"Sdz1,12":
  text: "I Kaleb powiedział: Temu, kto pobije Kiriat-Sefer i zdobędzie je, dam swoją córkę Aksę za żonę."
  tags: []
"Sdz1,13":
  text: "Zdobył je Otniel, syn Kenaza, młodszego brata Kaleba. I dał mu swoją córkę Aksę za żonę."
  tags: []
"Sdz1,14":
  text: "A gdy ona przyszła do niego, namawiała go, aby prosił jej ojca o pole; i zsiadła z osła, a Kaleb zapytał ją: Czego sobie życzysz?"
  tags: []
"Sdz1,15":
  text: "A ona odpowiedziała: Daj mi błogosławieństwo. Skoro dałeś mi ziemię południową, daj mi też źródła wód. I Kaleb dał jej źródła górne i źródła dolne."
  tags: []
"Sdz1,16":
  text: "Synowie Kenity, teścia Mojżesza, wyruszyli z miasta palm razem z synami Judy na pustynię Judy leżącą na południu od Arad. Gdy tam przybyli, zamieszkali z ludem."
  tags: []
"Sdz1,17":
  text: "Potem Juda wyruszył ze swym bratem Symeonem i zabili Kananejczyków mieszkających w Sefat, i zburzyli je, i nazwali to miasto Chorma."
  tags: []
"Sdz1,18":
  text: "Juda zdobył też Gazę wraz z jej granicami, Aszkelon wraz z jego granicami i Ekron wraz z jego granicami."
  tags: []
"Sdz1,19":
  text: "I PAN był z Judą, który posiadł górę, lecz nie mógł wypędzić mieszkańców doliny, bo ci mieli żelazne rydwany."
  tags: []
"Sdz1,20":
  text: "Kalebowi zaś dano Hebron, jak powiedział Mojżesz. Stamtąd wygnał on trzech synów Anaka."
  tags: []
"Sdz1,21":
  text: "Ale synowie Beniamina nie wygnali Jebusytów mieszkających w Jerozolimie; dlatego Jebusyci mieszkają z synami Beniamina w Jerozolimie aż do dziś."
  tags: []
"Sdz1,22":
  text: "Wyruszył też dom Józefa przeciwko Betel, a PAN był z nim."
  tags: []
"Sdz1,23":
  text: "I dom Józefa wyszpiegował Betel – a miasto to przedtem nazywało się Luz."
  tags: []
"Sdz1,24":
  text: "A gdy szpiedzy zobaczyli człowieka wychodzącego z miasta, powiedzieli do niego: Prosimy, pokaż nam wejście do miasta, a okażemy ci miłosierdzie."
  tags: []
"Sdz1,25":
  text: "I pokazał im wejście do miasta, a oni pobili miasto ostrzem miecza, lecz tego człowieka wraz z całą jego rodziną puścili wolno."
  tags: []
"Sdz1,26":
  text: "I tak człowiek ten udał się do ziemi Chetytów, zbudował miasto i nadał mu nazwę Luz. To jest jego nazwa aż do dziś."
  tags: []
"Sdz1,27":
  text: "Manasses nie wypędził też mieszkańców Bet-Szean i jego miasteczek ani mieszkańców Tanaku i jego miasteczek, ani mieszkańców Dor i jego miasteczek, ani mieszkańców Jibleam i jego miasteczek, ani mieszkańców Megiddo i jego miasteczek. Kananejczycy nadal mieszkali więc w tej ziemi."
  tags: []
"Sdz1,28":
  text: "A gdy Izrael się wzmocnił, kazał Kananejczykom płacić daninę i nie wygnał ich."
  tags: []
"Sdz1,29":
  text: "Także i Efraim nie wypędził Kananejczyków mieszkających w Gezer, dlatego Kananejczycy mieszkali wśród nich w Gezer."
  tags: []
"Sdz1,30":
  text: "Zebulon również nie wypędził mieszkańców Kitron ani mieszkańców Nahalol, dlatego Kananejczycy mieszkali wśród nich i płacili im daninę."
  tags: []
"Sdz1,31":
  text: "Aszer także nie wypędził mieszkańców Akko ani mieszkańców Sydonu, Achlab, Akzibu, Chelba, Afik i Rechob."
  tags: []
"Sdz1,32":
  text: "I Aszer mieszkał pośród Kananejczyków mieszkających w tej ziemi, gdyż ich nie wypędził."
  tags: []
"Sdz1,33":
  text: "Neftali też nie wypędził mieszkańców Bet-Szemesz ani mieszkańców Bet-Anat i mieszkał wśród Kananejczyków mieszkających w tej ziemi. Jednakże mieszkańcy Bet-Szemesz i Bet-Anat płacili mu daninę."
  tags: []
"Sdz1,34":
  text: "Amoryci zaś wyparli synów Dana w góry, tak że nie pozwalali im schodzić do doliny."
  tags: []
"Sdz1,35":
  text: "Amoryci utrzymali się i mieszkali na górze Cheres, w Ajjalonie i w Szaalbin, lecz wzmocniła się ręka domu Józefa i zaczęli mu płacić daninę."
  tags: []
"Sdz1,36":
  text: "A granica Amorytów biegła od wzniesienia do Akrabbim, od skały i wyżej."
  tags: []
