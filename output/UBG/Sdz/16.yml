"Sdz16,1":
  text: "Potem Samson poszedł do Gazy i gdy zobaczył tam nierządnicę, obcował z nią."
  tags: []
"Sdz16,2":
  text: "I powiadomiono mieszkańców Gazy: Przybył tu Samson. Otoczyli go więc i czyhali na niego przez całą noc w bramie miasta. Zachowywali się cicho przez całą noc, mówiąc: Gdy zacznie świtać, zabijemy go."
  tags: []
"Sdz16,3":
  text: "Ale Samson spał do północy, a o północy wstał, chwycił wrota bramy miejskiej z dwoma słupami i wyrwał je z zasuwą, potem włożył na swoje ramiona i zaniósł je na szczyt góry, która była naprzeciw Hebronu."
  tags: []
"Sdz16,4":
  text: "Potem w dolinie Sorek zakochał się w kobiecie, która miała na imię Dalila."
  tags: []
"Sdz16,5":
  text: "I przyszli do niej książęta Filistynów i powiedzieli jej: Oszukaj go i dowiedz się, w czym tkwi jego wielka siła i jak moglibyśmy go pokonać, by go związać i gnębić, a każdy z nas da ci tysiąc sto srebrników."
  tags: []
"Sdz16,6":
  text: "Powiedziała więc Dalila do Samsona: Powiedz mi, proszę, w czym tkwi twoja wielka siła i czym można by cię związać, by cię gnębić?"
  tags: []
"Sdz16,7":
  text: "Samson jej odpowiedział: Gdyby mnie związano siedmioma świeżymi witkami, które jeszcze nie wyschły, wtedy osłabnę i będę jak każdy inny człowiek."
  tags: []
"Sdz16,8":
  text: "I książęta Filistynów przynieśli jej siedem świeżych witek, które jeszcze nie wyschły, i związała go nimi."
  tags: []
"Sdz16,9":
  text: "Tymczasem czyhający na niego siedzieli u niej w komorze. Wtedy powiedziała mu: Filistyni nad tobą, Samsonie! Lecz on zerwał witki, jakby ktoś zerwał zgrzebną nić, gdy dotknie jej ogień. Nie poznano więc, w czym tkwiła jego siła."
  tags: []
"Sdz16,10":
  text: "Potem Dalila powiedziała do Samsona: Oszukałeś mnie i skłamałeś mi. Teraz powiedz mi, proszę, czym można by cię związać?"
  tags: []
"Sdz16,11":
  text: "A on jej odpowiedział: Gdyby mnie związano nowymi powrozami, których jeszcze nie używano, wtedy osłabnę i będę jak każdy inny człowiek."
  tags: []
"Sdz16,12":
  text: "Dalila wzięła więc nowe powrozy i związała go nimi, i powiedziała do niego: Filistyni nad tobą, Samsonie! A czyhający na niego siedzieli w komorze, lecz on porwał je ze swych ramion jak nici."
  tags: []
"Sdz16,13":
  text: "Wtedy Dalila powiedziała do Samsona: Aż dotąd szydziłeś ze mnie i okłamywałeś mnie. Powiedz mi, czym można by cię związać? I powiedział jej: Jeśli spleciesz siedem pasm z mojej głowy w osnowę przędzy."
  tags: []
"Sdz16,14":
  text: "Ona wtedy przybiła je kołkiem i powiedziała do niego: Filistyni nad tobą, Samsonie! Lecz on obudził się ze snu i wyrwał kołek z osnową i z wałkiem."
  tags: []
"Sdz16,15":
  text: "Znowu powiedziała do niego: Jak możesz mówić: Kocham cię, skoro twoje serce nie jest ze mną. Już trzykrotnie mnie oszukałeś i nie powiedziałeś mi, w czym tkwi twoja wielka siła."
  tags: []
"Sdz16,16":
  text: "A gdy mu się tak naprzykrzała słowami każdego dnia i naciskała na niego tak, że jego dusza zmęczyła się na śmierć;"
  tags: []
"Sdz16,17":
  text: "Wtedy otworzył przed nią całe swoje serce i powiedział jej: Brzytwa nigdy nie dotknęła mojej głowy, bo jestem nazirejczykiem dla Boga już z łona mojej matki. Jeśli zostanę ogolony, odejdzie ode mnie moja siła, osłabnę i będę jak każdy inny człowiek."
  tags: []
"Sdz16,18":
  text: "A gdy Dalila spostrzegła, że otworzył przed nią całe swoje serce, wezwała książąt Filistynów, mówiąc: Przyjdźcie raz jeszcze, gdyż otworzył przede mną całe swoje serce. Przyszli więc do niej książęta Filistynów, niosąc srebro w rękach."
  tags: []
"Sdz16,19":
  text: "Wtedy uśpiła go na swoich kolanach, przywołała pewnego człowieka i kazała zgolić siedem pasm jego głowy; potem zaczęła go gnębić, a jego siła odeszła od niego."
  tags: []
"Sdz16,20":
  text: "I powiedziała: Filistyni nad tobą, Samsonie! A gdy się obudził ze snu, powiedział: Wyjdę jak poprzednio i otrząsnę się. Lecz nie wiedział, że PAN odstąpił od niego."
  tags: []
"Sdz16,21":
  text: "Wtedy Filistyni pojmali go, wyłupili mu oczy i zaprowadzili do Gazy, a tam związali go dwoma spiżowymi łańcuchami i musiał mleć w domu więźniów."
  tags: []
"Sdz16,22":
  text: "Potem włosy na jego głowie zaczęły odrastać po ogoleniu."
  tags: []
"Sdz16,23":
  text: "A książęta Filistynów zebrali się, aby złożyć swemu bogu Dagonowi wielką ofiarę i radować się. Mówili bowiem: Nasz bóg wydał w nasze ręce Samsona, naszego wroga."
  tags: []
"Sdz16,24":
  text: "Kiedy ludzie widzieli go, chwalili swego boga, bo mówili: Nasz bóg wydał w nasze ręce naszego wroga, tego, który pustoszył naszą ziemię i który wielu z naszych pozabijał."
  tags: []
"Sdz16,25":
  text: "A gdy ich serca się rozweseliły, powiedzieli: Zawołajcie Samsona, aby nas zabawiał. Przywołano więc Samsona z domu więźniów, aby ich zabawiał. I postawili go między dwiema kolumnami."
  tags: []
"Sdz16,26":
  text: "Wtedy Samson powiedział do chłopca, który go trzymał za rękę: Poprowadź mnie, abym mógł dotknąć kolumn, na których stoi dom, abym się o nie oparł."
  tags: []
"Sdz16,27":
  text: "A dom był pełen mężczyzn i kobiet, byli tam wszyscy książęta Filistynów, na dachu zaś było około trzech tysięcy mężczyzn i kobiet, którzy się przyglądali, gdy Samson ich zabawiał."
  tags: []
"Sdz16,28":
  text: "Wówczas Samson wezwał PANA i powiedział: Panie BOŻE, wspomnij na mnie, proszę, i wzmocnij mnie tylko ten jeden raz, Boże, abym mógł się zemścić już na Filistynach za dwoje moich oczu."
  tags: []
"Sdz16,29":
  text: "Ujął więc Samson obie środkowe kolumny, na których stał dom i o które się wsparł, jedną swoją prawą ręką, a drugą swoją lewą ręką."
  tags: []
"Sdz16,30":
  text: "Potem Samson powiedział: Niech umrę z Filistynami. A gdy się o nie mocno oparł, dom upadł na książąt i na cały lud, który w nim był. A martwych, których zabił przy swojej śmierci, było więcej niż tych, których zabił za swego życia."
  tags: []
"Sdz16,31":
  text: "I przyszli jego bracia i cały dom jego ojca, wzięli go, wrócili i pogrzebali go między Sorea a Esztaol, w grobie Manoacha, jego ojca. A sądził on Izraela przez dwadzieścia lat."
  tags: []
