"Sdz20,1": "Wtedy wyszli wszyscy synowie Izraela i zebrało się całe zgromadzenie jednomyślnie od Dan aż do Beer-Szeby i do ziemi Gilead do PANA w Mispie."
"Sdz20,2": "I przywódcy całego ludu, wszystkich pokoleń Izraela, stanęli w zgromadzeniu ludu Bożego: czterysta tysięcy pieszych dobywających miecz."
"Sdz20,3": "I synowie Beniamina usłyszeli, że synowie Izraela zebrali się w Mispie. Wtedy synowie Izraela powiedzieli: Powiedzcie, jak doszło do tej niegodziwości?"
"Sdz20,4": "I ten Lewita, mąż zabitej kobiety, odpowiedział: Przybyłem wraz z moją nałożnicą do Gibea, która należy do Beniamina, aby tam przenocować."
"Sdz20,5": "I mężczyźni z Gibea powstali przeciwko mnie i w nocy otoczyli dom, zamierzając mnie zabić, a moją nałożnicę tak gwałcili, aż umarła."
"Sdz20,6": "Wziąłem więc swoją nałożnicę, rozciąłem ją na części i rozesłałem ją do wszystkich krain dziedzictwa Izraela. Dopuszczono się bowiem w Izraelu haniebnego i sprośnego czynu."
"Sdz20,7": "Oto wy wszyscy jesteście synami Izraela, rozważcie to między sobą i radźcie o tym."
"Sdz20,8": "I powstał cały lud jednomyślnie, mówiąc: Nikt z nas nie pójdzie do swego namiotu ani nie odejdzie do swego domu."
"Sdz20,9": "Ale teraz tak uczynimy miastu Gibea: Wyruszymy przeciwko niemu według losu."
"Sdz20,10": "Z każdego pokolenia Izraela weźmiemy po dziesięciu mężczyzn ze stu, stu z tysiąca i tysiąc z dziesięciu tysięcy, żeby dostarczali żywność dla ludu, który wyruszy do Gibea Beniamina, by pomścić wszelką sprośność, której się dopuszczono w Izraelu."
"Sdz20,11": "Zebrał się więc cały lud Izraela przeciwko miastu, zżyty ze sobą jak jeden mąż."
"Sdz20,12": "Potem pokolenia Izraela wysłały mężczyzn do wszystkich domów synów Beniamina, mówiąc: Co to za niegodziwość popełniono wśród was?"
"Sdz20,13": "Wydajcie więc teraz tych mężczyzn, synów Beliala, którzy są w Gibea, abyśmy ich pozabijali i usunęli zło z Izraela. Lecz synowie Beniamina nie chcieli słuchać głosu swoich braci, synów Izraela."
"Sdz20,14": "Co więcej, zebrali się synowie Beniamina z innych miast w Gibea, aby walczyć z synami Izraela."
"Sdz20,15": "I tego dnia naliczono synów Beniamina z ich miast dwadzieścia sześć tysięcy mężczyzn dobywających miecz, oprócz mieszkańców Gibea, których naliczono siedmiuset doborowych mężczyzn."
"Sdz20,16": "Wśród całego ludu było siedmiuset doborowych mężczyzn, leworęcznych, a każdy z nich potrafił ciskać z procy kamieniem do włosa i nie chybiał."
"Sdz20,17": "Izraelitów zaś naliczono, oprócz synów Beniamina, czterysta tysięcy mężczyzn dobywających miecz, wszyscy byli wojownikami."
"Sdz20,18": "Wtedy synowie Izraela powstali, poszli do domu Bożego i radzili się Boga, mówiąc: Któż z nas ma wyruszyć pierwszy do walki z synami Beniamina? I PAN odpowiedział: Juda wyruszy pierwszy."
"Sdz20,19": "Powstali więc synowie Izraela rano i rozbili obóz naprzeciw Gibea."
"Sdz20,20": "Potem synowie Izraela wyruszyli do walki z synami Beniamina i ustawili się w szyku bojowym do walki przeciw Gibea."
"Sdz20,21": "Lecz synowie Beniamina wyszli z Gibea i zabili tego dnia dwadzieścia dwa tysiące mężczyzn z Izraela."
"Sdz20,22": "Potem mężczyźni z ludu Izraela pokrzepili się i znowu ustawili się w szyku bojowym do walki na tym miejscu, gdzie ustawili się pierwszego dnia."
"Sdz20,23": "Najpierw jednak synowie Izraela poszli i płakali przed PANEM aż do wieczora, i pytali PANA: Czy mamy jeszcze iść i walczyć z synami Beniamina, naszego brata? I PAN odpowiedział: Idźcie przeciwko nim."
"Sdz20,24": "I wyruszyli synowie Izraela przeciwko synom Beniamina drugiego dnia."
"Sdz20,25": "Lecz synowie Beniamina wyszli przeciwko nim z Gibea drugiego dnia i znowu zabili osiemnaście tysięcy mężczyzn z synów Izraela, wszystkich mężczyzn dobywających miecz."
"Sdz20,26": "Wtedy wszyscy synowie Izraela i cały lud udali się i przyszli do domu Bożego, i płacząc, trwali tam przed PANEM i pościli w tym dniu aż do wieczora, i składali całopalenia i ofiary pojednawcze przed PANEM."
"Sdz20,27": "I synowie Izraela pytali PANA (tam bowiem w tych dniach była arka przymierza Boga;"
"Sdz20,28": "A Pinchas, syn Eleazara, syna Aarona, sprawował przy niej służbę w tych dniach): Czy mamy jeszcze wyruszać do walki z synami Beniamina, naszego brata, czy też tego zaniechać? I PAN odpowiedział: Wyruszcie, gdyż jutro wydam ich w wasze ręce."
"Sdz20,29": "Wtedy Izrael przygotował zasadzki zewsząd dokoła Gibea."
"Sdz20,30": "I trzeciego dnia synowie Izraela wyruszyli przeciwko synom Beniamina i ustawili się w szyku bojowym przeciwko Gibea jak za pierwszym i drugim razem."
"Sdz20,31": "Synowie Beniamina także wyszli przeciwko ludowi i zostali odciągnięci od miasta. Zaczęli bić lud i zabijać jak za pierwszym i drugim razem na drogach, z których jedna prowadziła do Betel, a druga do Gibea na polu, a zabili około trzydziestu mężczyzn z Izraela."
"Sdz20,32": "I synowie Beniamina powiedzieli: Są pobici przez nas jak i poprzednio. Lecz synowie Izraela mówili: Uciekajmy i odciągnijmy ich od miasta aż na drogi."
"Sdz20,33": "Powstali więc wszyscy mężczyźni Izraela ze swego miejsca i ustawili się w szyku bojowym w Baal-Tamar; tymczasem ci z Izraela, którzy przygotowali zasadzkę, wyszli ze swych miejsc, z łąk Gibea."
"Sdz20,34": "A tak wyszło naprzeciw Gibea dziesięć tysięcy doborowych mężczyzn z całego Izraela; była to bitwa zacięta, a tamci nie wiedzieli, że ma ich spotkać nieszczęście."
"Sdz20,35": "I PAN pobił Beniamina przed Izraelem i w tym dniu synowie Izraela zabili dwadzieścia pięć tysięcy stu mężczyzn z Beniamina, wszystkich dobywających miecz."
"Sdz20,36": "Wtedy synowie Beniamina widzieli, że są pobici; mężczyźni Izraela ustępowali bowiem miejsca przed Beniaminem, licząc na zasadzki, które przygotowali naprzeciw Gibea."
"Sdz20,37": "A ci, którzy uczestniczyli w zasadzce, pospieszyli się i uderzyli na Gibea, a następnie pobili ostrzem miecza wszystkich, którzy byli w mieście."
"Sdz20,38": "A mężczyźni Izraela mieli umówiony znak z tymi, którzy ukryli się w zasadzce, że ci wypuszczą z miasta wielki dym."
"Sdz20,39": "Gdy więc mężczyźni Izraela cofnęli się przed bitwą, synowie Beniamina zaczęli bić i zabili około trzydziestu mężczyzn z Izraela. Mówili bowiem: Na pewno są pobici przed nami, jak i w pierwszej bitwie."
"Sdz20,40": "Ale gdy płomień i dym jak słup zaczęły wznosić się z miasta, wtedy synowie Beniamina obejrzeli się, a oto ogień z miasta wznosił się aż ku niebu."
"Sdz20,41": "A kiedy mężczyźni Izraela zawrócili, mężowie Beniamina przerazili się, widząc, że spadło na nich nieszczęście."
"Sdz20,42": "I uciekali przed mężczyznami Izraela drogą na pustynię, a wojsko doganiało ich i ci, którzy wybiegli z miast, zabijali ich pośród siebie."
"Sdz20,43": "Otoczyli więc Beniamina i gonili ich bez przerwy, a pokonali ich naprzeciw Gibea na wschodzie."
"Sdz20,44": "Poległo wtedy z Beniamina osiemnaście tysięcy mężczyzn, wszyscy byli wojownikami."
"Sdz20,45": "Z tych zaś, którzy zawrócili i uciekali na pustynię, na skałę Rimmon, wyłapali po drogach i zabili pięć tysięcy mężczyzn. Gonili ich aż do Gidom, gdzie zabili dwa tysiące mężczyzn spośród nich."
"Sdz20,46": "A tak wszystkich poległych z Beniamina tego dnia było dwadzieścia pięć tysięcy mężczyzn dobywających miecz, wszyscy byli wojownikami."
"Sdz20,47": "Tylko sześciuset mężczyzn zawróciło i uciekło na pustynię, na skałę Rimmon, i zostali na skale Rimmon przez cztery miesiące."
"Sdz20,48": "Potem mężczyźni Izraela wrócili do synów Beniamina i wybili ich ostrzem miecza w mieście, zarówno ludzi, jak i bydło oraz wszystko, co znaleźli. Spalili ogniem także wszystkie miasta, które pozostały."
