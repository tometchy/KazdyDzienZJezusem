"Sdz9,1":
  text: "Wtedy Abimelek, syn Jerubbaala, poszedł do Sychem, do braci swej matki, i mówił do nich oraz do całej rodziny domu ojca swej matki:"
  tags: []
"Sdz9,2":
  text: "Powiedzcie do uszu wszystkich przełożonych Sychem: Co jest dla was lepsze: aby panowało nad wami siedemdziesięciu ludzi, wszyscy synowie Jerubbaala, czy żeby panował nad wami jeden człowiek? Pamiętajcie, że jestem z waszej kości i waszego ciała."
  tags: []
"Sdz9,3":
  text: "Wtedy bracia jego matki opowiadali o nim wszystkie te słowa do uszu wszystkich przełożonych Sychem, a ich serce skłoniło się ku Abimelekowi, bo powiedzieli: To jest nasz brat."
  tags: []
"Sdz9,4":
  text: "I dali mu siedemdziesiąt srebrników z domu Baal-Berita, a Abimelek najął za nie ludzi, lekkomyślnych próżniaków, którzy poszli za nim."
  tags: []
"Sdz9,5":
  text: "Potem przyszedł do domu swojego ojca w Ofra i na jednym kamieniu zabił swoich braci, synów Jerubbaala, siedemdziesięciu ludzi. Został tylko Jotam, najmłodszy syn Jerubbaala, ponieważ się ukrył."
  tags: []
"Sdz9,6":
  text: "Wtedy zebrali się wszyscy mężczyźni Sychem i cały dom Millo, poszli i obwołali Abimeleka królem na równinie, gdzie stał słup w Sychem."
  tags: []
"Sdz9,7":
  text: "Gdy doniesiono o tym Jotamowi, poszedł, stanął na szczycie góry Gerizim, podniósł głos i zawołał do nich: Posłuchajcie mnie, panowie Sychem, a was też Bóg usłyszy."
  tags: []
"Sdz9,8":
  text: "Zebrały się drzewa, aby namaścić nad sobą króla. I powiedziały do oliwki: Króluj nad nami."
  tags: []
"Sdz9,9":
  text: "Lecz oliwka odpowiedziała: Czy mam porzucić swój tłuszcz, przez który czci się Boga i ludzi, i pójść, aby być postawiona nad drzewami?"
  tags: []
"Sdz9,10":
  text: "Potem drzewa powiedziały do drzewa figowego: Chodź ty i króluj nad nami."
  tags: []
"Sdz9,11":
  text: "Lecz drzewo figowe odpowiedziało im: Czy mam porzucić swoją słodycz i wyborny owoc i pójść, aby być postawione nad drzewami?"
  tags: []
"Sdz9,12":
  text: "Następnie drzewa powiedziały do winorośli: Chodź ty i króluj nad nami."
  tags: []
"Sdz9,13":
  text: "Lecz winorośl odpowiedziała im: Czy mam porzucić swój moszcz, który cieszy Boga i ludzi, i pójść, aby być postawiona nad drzewami?"
  tags: []
"Sdz9,14":
  text: "I wszystkie drzewa powiedziały do ostu: Chodź ty i króluj nad nami."
  tags: []
"Sdz9,15":
  text: "A oset odpowiedział drzewom: Jeśli naprawdę chcecie namaścić mnie na króla nad sobą, chodźcie i chrońcie się w moim cieniu. A jeśli nie, niech ogień wyjdzie z ostu i spali cedry libańskie."
  tags: []
"Sdz9,16":
  text: "Teraz więc, jeśli postąpiliście uczciwie i szczerze, ustanawiając sobie Abimeleka królem, i jeśli dobrze obeszliście się z Jerubbaalem i jego domem i odpłaciliście mu za dobrodziejstwa jego ręki;"
  tags: []
"Sdz9,17":
  text: "Mój ojciec walczył bowiem za was i narażał swe życie na niebezpieczeństwo, aby was wyrwać z ręki Midianitów;"
  tags: []
"Sdz9,18":
  text: "Wy zaś powstaliście dziś przeciw domowi mego ojca i zabiliście na jednym kamieniu jego synów, siedemdziesięciu ludzi, a syna jego służącej, Abimeleka, ustanowiliście królem nad ludźmi Sychem, dlatego że jest waszym bratem."
  tags: []
"Sdz9,19":
  text: "Jeśli więc uczciwie i szczerze obeszliście się dziś z Jerubbaalem i z jego domem, cieszcie się z Abimeleka, a on niech się też cieszy z was."
  tags: []
"Sdz9,20":
  text: "Lecz jeśli nie, niech wyjdzie ogień z Abimeleka i pożre mężczyzn Sychem i dom Millo; niech też wyjdzie ogień od mężczyzn Sychem i z domu Millo i pożre Abimeleka."
  tags: []
"Sdz9,21":
  text: "Wtedy Jotam umknął, uciekł i przybył do Beer, gdzie mieszkał z obawy przed swym bratem Abimelekiem."
  tags: []
"Sdz9,22":
  text: "A gdy Abimelek panował nad Izraelem przez trzy lata;"
  tags: []
"Sdz9,23":
  text: "Bóg posłał złego ducha między Abimeleka a mężczyzn Sychem; i mężczyźni Sychem zbuntowali się przeciw Abimelekowi;"
  tags: []
"Sdz9,24":
  text: "Aby została pomszczona krzywda dokonana na siedemdziesięciu synach Jerubbaala, aby ich krew spadła na ich brata Abimeleka, który ich zabił, i na mężczyzn Sychem, którzy pomogli mu zabić swoich braci."
  tags: []
"Sdz9,25":
  text: "I mężczyźni Sychem zasadzili się na niego na szczycie gór i napadali na każdego, kto przechodził tamtą drogą. I doniesiono o tym Abimelekowi."
  tags: []
"Sdz9,26":
  text: "Przyszedł też Gaal, syn Obeda, wraz ze swoimi braćmi, i przybył do Sychem, a mężczyźni Sychem zaufali mu."
  tags: []
"Sdz9,27":
  text: "Potem wyszli na pola, zbierali plony swoich winnic, tłoczyli winogrona i urządzili zabawę. Następnie weszli do domu swoich bogów, jedli, pili i złorzeczyli Abimelekowi."
  tags: []
"Sdz9,28":
  text: "Wtedy Gaal, syn Obeda, powiedział: Kim jest Abimelek i czym jest Sychem, żebyśmy mu służyli? Czy to nie jest syn Jerubbaala, a Zebul nie jest jego urzędnikiem? Służcie raczej mężczyznom Chamora, ojca Sychema. Dlaczego mielibyśmy służyć jemu?"
  tags: []
"Sdz9,29":
  text: "Oby kto dał ten lud w moje ręce, abym usunął Abimeleka! I powiedział Abimelekowi: Zbierz sobie wojsko i wyjdź."
  tags: []
"Sdz9,30":
  text: "A gdy Zebul, przełożony tego miasta, usłyszał słowa Gaala, syna Obeda, zapłonął gniewem."
  tags: []
"Sdz9,31":
  text: "I potajemnie wyprawił posłańców do Abimeleka, mówiąc: Oto Gaal, syn Obeda, wraz ze swoimi braćmi przyszedł do Sychem i oto podburzają miasto przeciwko tobie."
  tags: []
"Sdz9,32":
  text: "Wstańcie więc nocą, ty i lud, który jest z tobą, i uczyńcie zasadzkę w polu."
  tags: []
"Sdz9,33":
  text: "A rano, gdy słońce wzejdzie, wstaniesz i uderzysz na miasto. A gdy on i lud, który jest z nim, wyjdą przeciwko tobie, uczynisz z nim według swego uznania."
  tags: []
"Sdz9,34":
  text: "Wstał więc w nocy Abimelek wraz z całym ludem, który z nim był, i zasadzili się na Sychem w czterech oddziałach."
  tags: []
"Sdz9,35":
  text: "A Gaal, syn Obeda, wyszedł i stanął w samej bramie miasta; wtedy Abimelek wraz z ludem, który z nim był, wyszedł z zasadzki."
  tags: []
"Sdz9,36":
  text: "A gdy Gaal zobaczył lud, powiedział do Zebula: Oto lud schodzi ze szczytu gór. Zebul odpowiedział mu: Widzisz cień gór i bierzesz go za ludzi."
  tags: []
"Sdz9,37":
  text: "I Gaal powiedział powtórnie: Oto lud schodzi z góry, a jeden oddział idzie drogą przez równinę Meonenim."
  tags: []
"Sdz9,38":
  text: "Wtedy Zebul powiedział do niego: Gdzież teraz są twoje usta, które mówiły: Kim jest Abimelek, abyśmy mu mieli służyć? Czyż to nie ten lud, którym wzgardziłeś? Wyjdź teraz i walcz z nim."
  tags: []
"Sdz9,39":
  text: "Wyszedł więc Gaal na czele mężczyzn Sychem i walczył z Abimelekiem."
  tags: []
"Sdz9,40":
  text: "I Abimelek ścigał go, gdy przed nim uciekał, a poległo wielu rannych aż do samej bramy."
  tags: []
"Sdz9,41":
  text: "Potem Abimelek został w Arum. A Zebul wygnał Gaala z jego braćmi tak, że nie mogli mieszkać w Sychem."
  tags: []
"Sdz9,42":
  text: "Nazajutrz lud wyszedł w pole i doniesiono o tym Abimelekowi."
  tags: []
"Sdz9,43":
  text: "Wziął więc lud, podzielił go na trzy oddziały i zasadził się w polu; a gdy zobaczył, że lud wychodzi z miasta, uderzył na niego i pobił go."
  tags: []
"Sdz9,44":
  text: "Abimelek i oddziały, które z nim były, wyruszyli i stanęli u samej bramy miasta, inne dwa oddziały zaś uderzyły na wszystkich, którzy byli na polu, i pobiły ich."
  tags: []
"Sdz9,45":
  text: "I Abimelek nacierał na miasto przez cały ten dzień, i zdobył je; a lud, który w nim był, zabił, miasto zaś zburzył i rozsiał na nim sól."
  tags: []
"Sdz9,46":
  text: "A kiedy usłyszeli o tym wszyscy mężczyźni, którzy byli w wieży Sychem, weszli do twierdzy domu boga Berit."
  tags: []
"Sdz9,47":
  text: "I doniesiono Abimelekowi, że zgromadzili się tam wszyscy mężczyźni z wieży Sychem."
  tags: []
"Sdz9,48":
  text: "Wtedy Abimelek wszedł na górę Salmon, on i cały lud, który z nim był; zabrał ze sobą siekierę, uciął gałąź z drzewa, wziął ją, włożył na swoje ramiona i powiedział do ludu, który z nim był: Co widzicie, że uczyniłem, szybko czyńcie to samo."
  tags: []
"Sdz9,49":
  text: "Każdy więc z całego ludu uciął swoją gałąź i poszedł za Abimelekiem; potem kładli je dokoła twierdzy i spalili nimi twierdzę ogniem. I zginęli tam wszyscy ludzie z wieży Sychem, około tysiąca mężczyzn i kobiet."
  tags: []
"Sdz9,50":
  text: "Potem Abimelek poszedł do Tebes, rozbił obóz naprzeciwko Tebes i zdobył je."
  tags: []
"Sdz9,51":
  text: "Lecz w środku miasta była potężna wieża, do której uciekli wszyscy mężczyźni, kobiety i wszyscy naczelnicy miasta. Zamknęli ją za sobą i weszli na dach wieży."
  tags: []
"Sdz9,52":
  text: "Wtedy Abimelek podszedł aż do samej wieży i nacierał na nią. Kiedy stanął u samych drzwi wieży, chciał ją spalić ogniem."
  tags: []
"Sdz9,53":
  text: "A pewna kobieta zrzuciła kawałek kamienia młyńskiego na głowę Abimeleka i rozbiła mu czaszkę."
  tags: []
"Sdz9,54":
  text: "On natychmiast zawołał młodzieńca, który nosił jego broń, i powiedział mu: Dobądź swój miecz i zabij mnie, by nie mówiono o mnie: Kobieta go zabiła. Przebił go więc jego giermek, tak że umarł."
  tags: []
"Sdz9,55":
  text: "A gdy mężczyźni Izraela zobaczyli, że Abimelek umarł, rozeszli się, każdy do swego miejsca."
  tags: []
"Sdz9,56":
  text: "Tak Bóg odpłacił Abimelekowi za zło, które wyrządził swemu ojcu, zabijając siedemdziesięciu swych braci."
  tags: []
"Sdz9,57":
  text: "I całe zło mężczyzn Sychem Bóg obrócił na ich głowy. Tak przyszło na nich przekleństwo Jotama, syna Jerubbaala."
  tags: []
