"Sdz9,1": "Wtedy Abimelek, syn Jerubbaala, poszedł do Sychem, do braci swej matki, i mówił do nich oraz do całej rodziny domu ojca swej matki:"
"Sdz9,2": "Powiedzcie do uszu wszystkich przełożonych Sychem: Co jest dla was lepsze: aby panowało nad wami siedemdziesięciu ludzi, wszyscy synowie Jerubbaala, czy żeby panował nad wami jeden człowiek? Pamiętajcie, że jestem z waszej kości i waszego ciała."
"Sdz9,3": "Wtedy bracia jego matki opowiadali o nim wszystkie te słowa do uszu wszystkich przełożonych Sychem, a ich serce skłoniło się ku Abimelekowi, bo powiedzieli: To jest nasz brat."
"Sdz9,4": "I dali mu siedemdziesiąt srebrników z domu Baal-Berita, a Abimelek najął za nie ludzi, lekkomyślnych próżniaków, którzy poszli za nim."
"Sdz9,5": "Potem przyszedł do domu swojego ojca w Ofra i na jednym kamieniu zabił swoich braci, synów Jerubbaala, siedemdziesięciu ludzi. Został tylko Jotam, najmłodszy syn Jerubbaala, ponieważ się ukrył."
"Sdz9,6": "Wtedy zebrali się wszyscy mężczyźni Sychem i cały dom Millo, poszli i obwołali Abimeleka królem na równinie, gdzie stał słup w Sychem."
"Sdz9,7": "Gdy doniesiono o tym Jotamowi, poszedł, stanął na szczycie góry Gerizim, podniósł głos i zawołał do nich: Posłuchajcie mnie, panowie Sychem, a was też Bóg usłyszy."
"Sdz9,8": "Zebrały się drzewa, aby namaścić nad sobą króla. I powiedziały do oliwki: Króluj nad nami."
"Sdz9,9": "Lecz oliwka odpowiedziała: Czy mam porzucić swój tłuszcz, przez który czci się Boga i ludzi, i pójść, aby być postawiona nad drzewami?"
"Sdz9,10": "Potem drzewa powiedziały do drzewa figowego: Chodź ty i króluj nad nami."
"Sdz9,11": "Lecz drzewo figowe odpowiedziało im: Czy mam porzucić swoją słodycz i wyborny owoc i pójść, aby być postawione nad drzewami?"
"Sdz9,12": "Następnie drzewa powiedziały do winorośli: Chodź ty i króluj nad nami."
"Sdz9,13": "Lecz winorośl odpowiedziała im: Czy mam porzucić swój moszcz, który cieszy Boga i ludzi, i pójść, aby być postawiona nad drzewami?"
"Sdz9,14": "I wszystkie drzewa powiedziały do ostu: Chodź ty i króluj nad nami."
"Sdz9,15": "A oset odpowiedział drzewom: Jeśli naprawdę chcecie namaścić mnie na króla nad sobą, chodźcie i chrońcie się w moim cieniu. A jeśli nie, niech ogień wyjdzie z ostu i spali cedry libańskie."
"Sdz9,16": "Teraz więc, jeśli postąpiliście uczciwie i szczerze, ustanawiając sobie Abimeleka królem, i jeśli dobrze obeszliście się z Jerubbaalem i jego domem i odpłaciliście mu za dobrodziejstwa jego ręki;"
"Sdz9,17": "Mój ojciec walczył bowiem za was i narażał swe życie na niebezpieczeństwo, aby was wyrwać z ręki Midianitów;"
"Sdz9,18": "Wy zaś powstaliście dziś przeciw domowi mego ojca i zabiliście na jednym kamieniu jego synów, siedemdziesięciu ludzi, a syna jego służącej, Abimeleka, ustanowiliście królem nad ludźmi Sychem, dlatego że jest waszym bratem."
"Sdz9,19": "Jeśli więc uczciwie i szczerze obeszliście się dziś z Jerubbaalem i z jego domem, cieszcie się z Abimeleka, a on niech się też cieszy z was."
"Sdz9,20": "Lecz jeśli nie, niech wyjdzie ogień z Abimeleka i pożre mężczyzn Sychem i dom Millo; niech też wyjdzie ogień od mężczyzn Sychem i z domu Millo i pożre Abimeleka."
"Sdz9,21": "Wtedy Jotam umknął, uciekł i przybył do Beer, gdzie mieszkał z obawy przed swym bratem Abimelekiem."
"Sdz9,22": "A gdy Abimelek panował nad Izraelem przez trzy lata;"
"Sdz9,23": "Bóg posłał złego ducha między Abimeleka a mężczyzn Sychem; i mężczyźni Sychem zbuntowali się przeciw Abimelekowi;"
"Sdz9,24": "Aby została pomszczona krzywda dokonana na siedemdziesięciu synach Jerubbaala, aby ich krew spadła na ich brata Abimeleka, który ich zabił, i na mężczyzn Sychem, którzy pomogli mu zabić swoich braci."
"Sdz9,25": "I mężczyźni Sychem zasadzili się na niego na szczycie gór i napadali na każdego, kto przechodził tamtą drogą. I doniesiono o tym Abimelekowi."
"Sdz9,26": "Przyszedł też Gaal, syn Obeda, wraz ze swoimi braćmi, i przybył do Sychem, a mężczyźni Sychem zaufali mu."
"Sdz9,27": "Potem wyszli na pola, zbierali plony swoich winnic, tłoczyli winogrona i urządzili zabawę. Następnie weszli do domu swoich bogów, jedli, pili i złorzeczyli Abimelekowi."
"Sdz9,28": "Wtedy Gaal, syn Obeda, powiedział: Kim jest Abimelek i czym jest Sychem, żebyśmy mu służyli? Czy to nie jest syn Jerubbaala, a Zebul nie jest jego urzędnikiem? Służcie raczej mężczyznom Chamora, ojca Sychema. Dlaczego mielibyśmy służyć jemu?"
"Sdz9,29": "Oby kto dał ten lud w moje ręce, abym usunął Abimeleka! I powiedział Abimelekowi: Zbierz sobie wojsko i wyjdź."
"Sdz9,30": "A gdy Zebul, przełożony tego miasta, usłyszał słowa Gaala, syna Obeda, zapłonął gniewem."
"Sdz9,31": "I potajemnie wyprawił posłańców do Abimeleka, mówiąc: Oto Gaal, syn Obeda, wraz ze swoimi braćmi przyszedł do Sychem i oto podburzają miasto przeciwko tobie."
"Sdz9,32": "Wstańcie więc nocą, ty i lud, który jest z tobą, i uczyńcie zasadzkę w polu."
"Sdz9,33": "A rano, gdy słońce wzejdzie, wstaniesz i uderzysz na miasto. A gdy on i lud, który jest z nim, wyjdą przeciwko tobie, uczynisz z nim według swego uznania."
"Sdz9,34": "Wstał więc w nocy Abimelek wraz z całym ludem, który z nim był, i zasadzili się na Sychem w czterech oddziałach."
"Sdz9,35": "A Gaal, syn Obeda, wyszedł i stanął w samej bramie miasta; wtedy Abimelek wraz z ludem, który z nim był, wyszedł z zasadzki."
"Sdz9,36": "A gdy Gaal zobaczył lud, powiedział do Zebula: Oto lud schodzi ze szczytu gór. Zebul odpowiedział mu: Widzisz cień gór i bierzesz go za ludzi."
"Sdz9,37": "I Gaal powiedział powtórnie: Oto lud schodzi z góry, a jeden oddział idzie drogą przez równinę Meonenim."
"Sdz9,38": "Wtedy Zebul powiedział do niego: Gdzież teraz są twoje usta, które mówiły: Kim jest Abimelek, abyśmy mu mieli służyć? Czyż to nie ten lud, którym wzgardziłeś? Wyjdź teraz i walcz z nim."
"Sdz9,39": "Wyszedł więc Gaal na czele mężczyzn Sychem i walczył z Abimelekiem."
"Sdz9,40": "I Abimelek ścigał go, gdy przed nim uciekał, a poległo wielu rannych aż do samej bramy."
"Sdz9,41": "Potem Abimelek został w Arum. A Zebul wygnał Gaala z jego braćmi tak, że nie mogli mieszkać w Sychem."
"Sdz9,42": "Nazajutrz lud wyszedł w pole i doniesiono o tym Abimelekowi."
"Sdz9,43": "Wziął więc lud, podzielił go na trzy oddziały i zasadził się w polu; a gdy zobaczył, że lud wychodzi z miasta, uderzył na niego i pobił go."
"Sdz9,44": "Abimelek i oddziały, które z nim były, wyruszyli i stanęli u samej bramy miasta, inne dwa oddziały zaś uderzyły na wszystkich, którzy byli na polu, i pobiły ich."
"Sdz9,45": "I Abimelek nacierał na miasto przez cały ten dzień, i zdobył je; a lud, który w nim był, zabił, miasto zaś zburzył i rozsiał na nim sól."
"Sdz9,46": "A kiedy usłyszeli o tym wszyscy mężczyźni, którzy byli w wieży Sychem, weszli do twierdzy domu boga Berit."
"Sdz9,47": "I doniesiono Abimelekowi, że zgromadzili się tam wszyscy mężczyźni z wieży Sychem."
"Sdz9,48": "Wtedy Abimelek wszedł na górę Salmon, on i cały lud, który z nim był; zabrał ze sobą siekierę, uciął gałąź z drzewa, wziął ją, włożył na swoje ramiona i powiedział do ludu, który z nim był: Co widzicie, że uczyniłem, szybko czyńcie to samo."
"Sdz9,49": "Każdy więc z całego ludu uciął swoją gałąź i poszedł za Abimelekiem; potem kładli je dokoła twierdzy i spalili nimi twierdzę ogniem. I zginęli tam wszyscy ludzie z wieży Sychem, około tysiąca mężczyzn i kobiet."
"Sdz9,50": "Potem Abimelek poszedł do Tebes, rozbił obóz naprzeciwko Tebes i zdobył je."
"Sdz9,51": "Lecz w środku miasta była potężna wieża, do której uciekli wszyscy mężczyźni, kobiety i wszyscy naczelnicy miasta. Zamknęli ją za sobą i weszli na dach wieży."
"Sdz9,52": "Wtedy Abimelek podszedł aż do samej wieży i nacierał na nią. Kiedy stanął u samych drzwi wieży, chciał ją spalić ogniem."
"Sdz9,53": "A pewna kobieta zrzuciła kawałek kamienia młyńskiego na głowę Abimeleka i rozbiła mu czaszkę."
"Sdz9,54": "On natychmiast zawołał młodzieńca, który nosił jego broń, i powiedział mu: Dobądź swój miecz i zabij mnie, by nie mówiono o mnie: Kobieta go zabiła. Przebił go więc jego giermek, tak że umarł."
"Sdz9,55": "A gdy mężczyźni Izraela zobaczyli, że Abimelek umarł, rozeszli się, każdy do swego miejsca."
"Sdz9,56": "Tak Bóg odpłacił Abimelekowi za zło, które wyrządził swemu ojcu, zabijając siedemdziesięciu swych braci."
"Sdz9,57": "I całe zło mężczyzn Sychem Bóg obrócił na ich głowy. Tak przyszło na nich przekleństwo Jotama, syna Jerubbaala."
