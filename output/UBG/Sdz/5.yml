"Sdz5,1":
  text: "Tego dnia Debora i Barak, syn Abinoama, śpiewali:"
  tags: []
"Sdz5,2":
  text: "Błogosławcie PANA za zemstę dokonaną w Izraelu, za to, że lud dobrowolnie się ofiarował."
  tags: []
"Sdz5,3":
  text: "Słuchajcie, królowie, nadstawcie uszu, książęta: Ja PANU, ja będę śpiewać, będę śpiewać PANU, Bogu Izraela."
  tags: []
"Sdz5,4":
  text: "PANIE, gdy wyszedłeś z Seiru, gdy przechodziłeś przez pole Edom, ziemia drżała, niebiosa kropiły, a obłoki kropiły wodą."
  tags: []
"Sdz5,5":
  text: "Góry topniały przed PANEM jak góra Synaj – przed PANEM, Bogiem Izraela."
  tags: []
"Sdz5,6":
  text: "Za dni Szamgara, syna Anata, za dni Jael wyludniły się drogi, a ci, którzy wyruszyli w drogę, chodzili krętymi ścieżkami."
  tags: []
"Sdz5,7":
  text: "Opustoszały wsie w Izraelu, opustoszały, aż powstałam ja, Debora, aż powstałam jako matka w Izraelu."
  tags: []
"Sdz5,8":
  text: "Gdy Izrael wybrał sobie nowych bogów, wtedy w bramach nastała wojna; tarczy jednak ani włóczni nie było widać wśród czterdziestu tysięcy w Izraelu."
  tags: []
"Sdz5,9":
  text: "Moje serce skłania się ku wodzom Izraela, tym, którzy dobrowolnie się ofiarowali. Błogosławcie PANA."
  tags: []
"Sdz5,10":
  text: "Wy, którzy jeździcie na białych oślicach i zasiadacie na sądach, i którzy chodzicie po drogach, opowiadajcie;"
  tags: []
"Sdz5,11":
  text: "Że ucichł trzask strzelców w miejscach, gdzie czerpie się wodę; tam niech opowiadają o sprawiedliwości PANA, sprawiedliwości w jego wsiach w Izraelu. Wtedy lud PANA zstąpi do bram."
  tags: []
"Sdz5,12":
  text: "Przebudź się, przebudź, Deboro; przebudź się, przebudź i zaśpiewaj pieśń! Powstań, Baraku, i prowadź do niewoli swych jeńców, synu Abinoama."
  tags: []
"Sdz5,13":
  text: "Wtedy ci, którzy pozostali, panowali nad możnymi z ludu. PAN dopomógł mi panować nad mocarzami."
  tags: []
"Sdz5,14":
  text: "Z Efraima wyszedł ich korzeń przeciw Amalekowi, za tobą Beniamin wśród twego ludu; z Makir wyszli przywódcy, a z Zebulona pisarze."
  tags: []
"Sdz5,15":
  text: "Także książęta Issachara byli z Deborą; Issachara też, jak i Baraka pieszo posłano do doliny. Lecz w oddziałach Rubena toczyły się wielkie rozważania serca."
  tags: []
"Sdz5,16":
  text: "Czemu siedziałeś między oborami, słuchając wrzasku stad? W oddziałach Rubena toczyły się wielkie rozważania serca."
  tags: []
"Sdz5,17":
  text: "Gilead mieszkał za Jordanem, a dlaczego Dan przebywał na okrętach? Aszer pozostał na brzegu morskim i mieszkał w swoich zatokach."
  tags: []
"Sdz5,18":
  text: "Zebulon to lud, który narażał swe życie, podobnie jak Neftali – na wzniesieniach pól."
  tags: []
"Sdz5,19":
  text: "Przybyli królowie i walczyli, walczyli wówczas królowie Kanaanu w Tanak, nad wodami Megiddo; nie odnieśli jednak korzyści w srebrze."
  tags: []
"Sdz5,20":
  text: "Z nieba walczyły; gwiazdy ze swoich miejsc walczyły z Siserą."
  tags: []
"Sdz5,21":
  text: "Rzeka Kiszon ich porwała, pradawna rzeka, rzeka Kiszon. Podeptałaś, o duszo moja, mocarzy."
  tags: []
"Sdz5,22":
  text: "Wtedy się roztrzaskały kopyta końskie od rozpędu mocarzy."
  tags: []
"Sdz5,23":
  text: "Przeklinajcie Meroz, powiedział Anioł PANA, przeklinajcie srodze jego obywateli, bo nie przyszli na pomoc PANU, na pomoc PANU przeciwko mocarzom."
  tags: []
"Sdz5,24":
  text: "Błogosławiona między kobietami Jael, żona Chebera Kenity; będzie błogosławiona nad kobietami mieszkającymi w namiocie."
  tags: []
"Sdz5,25":
  text: "Prosił o wodę, a ona dała mleka, a w okazałym naczyniu przyniosła masło."
  tags: []
"Sdz5,26":
  text: "Swą lewą ręką sięgnęła po kołek, a prawą – po młot kowalski; uderzyła Siserę, przebiła jego głowę, przeszyła i przekłuła jego skronie."
  tags: []
"Sdz5,27":
  text: "Zwinął się u jej nóg, padł, leżał; zwinął się u jej nóg, padł; gdzie się zwinął, tam padł zabity."
  tags: []
"Sdz5,28":
  text: "Matka Sisery wyglądała przez okno i wołała przez kratę: Dlaczego jego rydwan opóźnia się z przybyciem? Dlaczego zwlekają koła jego zaprzęgów?"
  tags: []
"Sdz5,29":
  text: "Najmądrzejsze z jej kobiet odpowiedziały, jak i ona sama sobie odpowiadała:"
  tags: []
"Sdz5,30":
  text: "Czyż nie trafili na łup i nie dzielą go? Każdy mężczyzna dostanie pannę albo dwie; różnobarwne łupy oddają Siserze, różnobarwne łupy haftowane, różnobarwne łupy haftowane z obu stron, na szyję biorących łupy."
  tags: []
"Sdz5,31":
  text: "Tak niech zginą wszyscy twoi wrogowie, PANIE. A ci, którzy ciebie miłują, niech będą jak słońce, gdy wschodzi w swojej mocy. I ziemia żyła w pokoju przez czterdzieści lat."
  tags: []
