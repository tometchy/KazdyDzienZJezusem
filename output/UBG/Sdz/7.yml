"Sdz7,1":
  text: "Wstał więc Jerubbaal, czyli Gedeon, wcześnie rano, wraz z całym ludem, który był z nim, i rozbili obóz przy źródle Charod. A obóz Midianitów był na północ od nich, u stóp wzgórza More, w dolinie."
  tags: []
"Sdz7,2":
  text: "I PAN powiedział do Gedeona: Lud, który przebywa z tobą, jest zbyt liczny, abym wydał Midianitów w jego ręce, gdyż Izrael mógłby się chełpić przede mną, mówiąc: Moja ręka mnie wybawiła."
  tags: []
"Sdz7,3":
  text: "Wołaj więc teraz do uszu ludu: Kto jest lękliwy i bojaźliwy, niech zawróci, a rano niech idzie precz ku górze Gilead. Wtedy z ludu zawróciły dwadzieścia dwa tysiące, a dziesięć tysięcy pozostało."
  tags: []
"Sdz7,4":
  text: "I PAN powiedział do Gedeona: Lud jest jeszcze zbyt liczny. Zaprowadź go do wody, a tam go doświadczę. Ten, o którym ci powiem: Ten pójdzie z tobą, on pójdzie z tobą, a ten, o którym ci powiem: Ten nie pójdzie z tobą, on nie pójdzie."
  tags: []
"Sdz7,5":
  text: "Zaprowadził więc lud nad wodę, a PAN powiedział do Gedeona: Każdego, kto będzie chłeptał wodę swym językiem, jak chłepce pies, postawisz osobno; także każdy, który uklęknie na kolana, aby pić, stanie osobno."
  tags: []
"Sdz7,6":
  text: "A liczba tych, którzy chłeptali wodę z ręki podnoszonej do ust, wynosiła trzystu mężczyzn; cała zaś reszta ludu klękała na kolana, aby pić wodę."
  tags: []
"Sdz7,7":
  text: "Wtedy PAN powiedział do Gedeona: Przez tych trzystu mężczyzn, którzy chłeptali wodę, wybawię was i wydam Midianitów w twoje ręce, a reszta ludu niech wraca – każdy do siebie."
  tags: []
"Sdz7,8":
  text: "Ten lud wziął więc ze sobą żywność oraz swe trąby. A pozostałych mężczyzn Izraela odesłał, każdego do swego namiotu, i zatrzymał tylko trzystu mężczyzn; a obóz Midianitów był poniżej, w dolinie."
  tags: []
"Sdz7,9":
  text: "Tej nocy PAN powiedział do niego: Wstań, zejdź do obozu, bo wydałem go w twoje ręce;"
  tags: []
"Sdz7,10":
  text: "A jeśli boisz się iść, zejdź do obozu z Purą, swoim sługą."
  tags: []
"Sdz7,11":
  text: "I usłyszysz, co będą mówić, a potem twoje ręce wzmocnią się, aby wyruszyć na obóz. Zeszli więc on i Pura, jego sługa, aż do krańca przedniej straży obozu."
  tags: []
"Sdz7,12":
  text: "A Midianici, Amalekici oraz cały lud ze wschodu leżeli w dolinie, liczni jak szarańcza, a ich wielbłądów było bez liku, jak niezliczony jest piasek na morskim brzegu."
  tags: []
"Sdz7,13":
  text: "Gdy Gedeon tam przyszedł, pewien człowiek opowiadał swemu towarzyszowi sen: Oto miałem sen. Bochen chleba jęczmiennego wtoczył się do obozu Midianitów, dotarł aż do namiotu i uderzył w niego, aż upadł, i wywrócił go dołem do góry, i zapadł się namiot."
  tags: []
"Sdz7,14":
  text: "Jego towarzysz odpowiedział: To nic innego jak tylko miecz Gedeona, syna Joasza, męża Izraela; Bóg wydał w jego ręce Midianitów i cały obóz."
  tags: []
"Sdz7,15":
  text: "Gdy Gedeon usłyszał opowiadanie o tym śnie i jego wytłumaczenie, podziękował Bogu, a gdy wrócił do obozu Izraela, powiedział: Wstańcie, gdyż PAN dał w wasze ręce obóz Midianitów."
  tags: []
"Sdz7,16":
  text: "Wtedy podzielił tych trzystu mężczyzn na trzy oddziały i dał w ręce każdemu z nich trąby oraz puste dzbany, a w dzbanach – pochodnie."
  tags: []
"Sdz7,17":
  text: "I powiedział do nich: Patrzcie na mnie i czyńcie to samo, co ja. Oto pójdę do krańca obozu, a co ja będę czynić, to i wy czyńcie."
  tags: []
"Sdz7,18":
  text: "Gdy zadmę w trąbę, ja i wszyscy, którzy są ze mną, wtedy wy też zadmiecie w trąby wokół całego obozu i będziecie mówili: Miecz PANA i Gedeona."
  tags: []
"Sdz7,19":
  text: "Przyszedł więc Gedeon wraz ze stu mężami, którzy z nim byli, do krańca obozu, właśnie wtedy, gdy zaczęła się środkowa straż. I zadęli w trąby, i potłukli dzbany, które mieli w rękach."
  tags: []
"Sdz7,20":
  text: "Zadęły w trąby więc te trzy oddziały i potłukły dzbany; trzymając w lewej ręce pochodnie, a w prawej ręce trąby, aby zadąć, wołały: Miecz PANA i Gedeona."
  tags: []
"Sdz7,21":
  text: "I stanęli, każdy na swoim miejscu, dokoła obozu, a wszyscy w obozie powstali, krzyczeli i uciekali."
  tags: []
"Sdz7,22":
  text: "Gdy więc tych trzystu mężczyzn zadęło w trąby, PAN obrócił miecz jednego przeciw drugiemu w całym obozie. I tak wojsko uciekło aż do Bet-Szitta w Serera, aż do granicy Abel-Mechola, w stronę Tabbat."
  tags: []
"Sdz7,23":
  text: "Wtedy zebrali się mężczyźni Izraela z Neftalego, z Aszera i całego pokolenia Manassesa i ścigali Midianitów."
  tags: []
"Sdz7,24":
  text: "Potem Gedeon rozesłał posłańców po całym pogórzu Efraim, mówiąc: Zejdźcie na spotkanie Midianitom, a zajmijcie przed nimi wody aż do Bet-Bara i Jordanu. Zebrali się więc wszyscy mężczyźni z Efraima i zajęli wody aż do Bet-Bara i Jordanu."
  tags: []
"Sdz7,25":
  text: "Pojmali przy tym dwóch książąt Midianu, Oreba i Zeeba; Oreba zabili na skale Oreba, a Zeeba zabili przy tłoczni Zeeba. Ścigali dalej Midianitów, a głowy Oreba i Zeeba przynieśli do Gedeona za Jordan."
  tags: []
