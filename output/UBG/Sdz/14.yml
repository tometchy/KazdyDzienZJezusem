"Sdz14,1":
  text: "Samson poszedł do Timny i zobaczył tam kobietę z córek Filistynów."
  tags: []
"Sdz14,2":
  text: "A gdy wrócił, oznajmił swemu ojcu i swej matce: Widziałem w Timnie kobietę z córek Filistynów. Weźcie mi ją więc za żonę."
  tags: []
"Sdz14,3":
  text: "Jego ojciec i matka powiedzieli mu: Czy nie ma kobiety wśród córek twych braci ani w całym moim ludzie, że chcesz iść i wziąć sobie żonę spośród nieobrzezanych Filistynów? Samson odpowiedział swemu ojcu: Weźcie mi tę, bo spodobała się moim oczom."
  tags: []
"Sdz14,4":
  text: "A jego ojciec i matka nie wiedzieli, że to wyszło od PANA, bo on szukał sposobności przeciwko Filistynom. W tym czasie bowiem Filistyni panowali nad Izraelem."
  tags: []
"Sdz14,5":
  text: "Samson poszedł więc ze swoim ojcem i swoją matką do Timny i przyszli do winnic Timny. A oto młody, ryczący lew wybiegł mu naprzeciw."
  tags: []
"Sdz14,6":
  text: "Wtedy Duch PANA zawładnął nim i rozdarł on lwa, jakby rozdarł koźlę, choć nie miał nic w ręku. Jednak swojemu ojcu i swojej matce nie powiedział o tym, co uczynił."
  tags: []
"Sdz14,7":
  text: "Potem przyszedł i rozmawiał z tą kobietą, a ona podobała się Samsonowi."
  tags: []
"Sdz14,8":
  text: "A kiedy po kilku dniach wrócił, aby ją pojąć za żonę, zboczył z drogi, aby obejrzeć padlinę lwa. A oto rój pszczół i miód były w padlinie lwa."
  tags: []
"Sdz14,9":
  text: "Wziął go do rąk, szedł drogą i jadł, a gdy przyszedł do swego ojca i swej matki, dał im i jedli. Nie powiedział im jednak, że miodu nabrał z padliny lwa."
  tags: []
"Sdz14,10":
  text: "Potem jego ojciec poszedł do tej kobiety i Samson wyprawił tam wesele. Tak bowiem zwykli czynić młodzieńcy."
  tags: []
"Sdz14,11":
  text: "A gdy Filistyni ujrzeli go, wzięli trzydziestu towarzyszy, aby przy nim byli."
  tags: []
"Sdz14,12":
  text: "I Samson powiedział do nich: Zadam wam zagadkę. Jeśli ją rozwiążecie w ciągu siedmiu dni wesela i wyjaśnicie mi ją, dam wam trzydzieści prześcieradeł i trzydzieści szat zamiennych."
  tags: []
"Sdz14,13":
  text: "A jeśli mi jej nie rozwiążecie, wtedy to wy dacie mi trzydzieści prześcieradeł i trzydzieści szat zamiennych. Odpowiedzieli mu: Zadaj swoją zagadkę, a my jej posłuchamy."
  tags: []
"Sdz14,14":
  text: "I powiedział do nich: Z pożerającego wyszedł pokarm, a z mocnego wyszła słodycz. I przez trzy dni nie mogli rozwiązać tej zagadki."
  tags: []
"Sdz14,15":
  text: "I powiedzieli siódmego dnia do żony Samsona: Namów swego męża, aby nam zdradził zagadkę, inaczej spalimy ogniem ciebie i dom twego ojca. Czy po to nas wezwaliście, aby nas ograbić? Czy nie po to?"
  tags: []
"Sdz14,16":
  text: "Płakała więc żona Samsona przed nim, mówiąc: Tak naprawdę nienawidzisz mnie i nie kochasz mnie. Zadałeś synom mego ludu zagadkę i nie chcesz mi jej wyjaśnić. I powiedział jej: Oto nie wyjaśniłem jej swojemu ojcu i swojej matce, a tobie miałbym ją wyjaśnić?"
  tags: []
"Sdz14,17":
  text: "I płakała przed nim przez siedem dni, póki trwało wesele. A siódmego dnia wyjaśnił jej, bo mu się naprzykrzała. A ona powiedziała zagadkę synom swego ludu."
  tags: []
"Sdz14,18":
  text: "A siódmego dnia przed zachodem słońca mężczyźni tego miasta powiedzieli do niego: Cóż słodszego nad miód, a co mocniejszego nad lwa? On im odpowiedział: Gdybyście nie orali moją jałowicą, nie odgadlibyście mojej zagadki."
  tags: []
"Sdz14,19":
  text: "Potem zstąpił na niego Duch PANA i poszedł do Aszkelonu, zabił trzydziestu mężczyzn spośród nich, zdjął z nich łupy i dał szaty zamienne tym, którzy rozwiązali zagadkę. I rozpalił się jego gniew, i poszedł do domu swojego ojca."
  tags: []
"Sdz14,20":
  text: "Żona Samsona zaś została oddana jego towarzyszowi, który był jego przyjacielem."
  tags: []
