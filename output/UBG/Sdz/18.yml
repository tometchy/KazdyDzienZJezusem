"Sdz18,1": "W tych dniach nie było króla w Izraelu, toteż w tych dniach pokolenie Dana szukało sobie dziedzictwa do zamieszkania. Aż do tego dnia bowiem nie przypadło im dziedzictwo pośród pokoleń Izraela."
"Sdz18,2": "Synowie Dana wyprawili więc ze swoich granic pięciu mężczyzn ze swego pokolenia, walecznych mężczyzn z Sorea i Esztaol, aby wyszpiegowali ziemię i zbadali ją. Powiedzieli do nich: Idźcie, zbadajcie ziemię. Ci przybyli na górę Efraim, aż do domu Micheasza, i tam przenocowali."
"Sdz18,3": "Gdy byli blisko domu Micheasza, poznali głos młodzieńca Lewity. Wstąpili więc tam i zapytali go: Kto cię tu przyprowadził? I co tu robisz? I jaką masz tu sprawę?"
"Sdz18,4": "A on im odpowiedział: Tak a tak postąpił ze mną Micheasz, najął mnie i jestem jego kapłanem."
"Sdz18,5": "I powiedzieli do niego: Prosimy, poradź się Boga, abyśmy się dowiedzieli, czy poszczęści się nam nasza droga, którą idziemy."
"Sdz18,6": "I kapłan im odpowiedział: Idźcie w pokoju. PAN bowiem czuwa nad waszą drogą, którą idziecie."
"Sdz18,7": "Poszło więc tych pięciu mężczyzn i przybyli do Lajisz. I zobaczyli, że lud, który w nim był, mieszkał beztrosko, według zwyczaju Sydończyków, spokojnie i bezpiecznie, i że nie było władcy, który by ich trapił w tej ziemi. Ponadto byli daleko od Sydończyków i nie mieli z nikim żadnych interesów."
"Sdz18,8": "Gdy więc wrócili do swych braci do Sorea i Esztaol, ich bracia zapytali ich: Co powiecie?"
"Sdz18,9": "Odpowiedzieli: Wstańcie i wyruszajmy przeciwko nim. Widzieliśmy bowiem ziemię, a jest ona bardzo dobra. A wy stoicie? Nie ociągajcie się z wyruszeniem i wejściem do tej ziemi, aby ją posiąść."
"Sdz18,10": "Gdy wejdziecie, przyjdziecie do ludu bezpiecznego, do ziemi przestronnej. Bóg bowiem dał ją w wasze ręce; to miejsce, gdzie nie brakuje niczego z tego wszystkiego, co jest na ziemi."
"Sdz18,11": "I wyruszyło stamtąd z pokolenia Dana, z Sorea i Esztaol, sześciuset mężczyzn uzbrojonych do walki."
"Sdz18,12": "Będąc w drodze, rozbili obóz przy Kiriat-Jearim w Judzie. Dlatego to miejsce nazywa się Machane-Dan aż do dziś. A znajduje się za Kiriat-Jearim."
"Sdz18,13": "A kiedy wyruszyli stamtąd na górę Efraim, przybyli aż do domu Micheasza;"
"Sdz18,14": "I odezwało się tych pięciu mężczyzn, którzy szli, aby wyszpiegować ziemię Lajisz, i powiedzieli do swych braci: Czy wiecie, że w tych domach znajduje się efod i terafim, a także posąg ryty oraz posąg odlany? Rozważcie więc teraz, co macie czynić."
"Sdz18,15": "Skierowali się więc tam i przyszli do domu młodzieńca Lewity, do domu Micheasza, i pozdrowili go."
"Sdz18,16": "Lecz sześciuset mężczyzn uzbrojonych do walki, którzy byli z synów Dana, stało u wejścia do bramy."
"Sdz18,17": "I tych pięciu mężczyzn, którzy poszli, aby wyszpiegować ziemię, zabrało ryty posąg, efod, terafim i odlany posąg. A kapłan stał u wejścia do bramy wraz z sześciuset mężczyznami uzbrojonymi do walki."
"Sdz18,18": "A gdy ci, którzy weszli do domu Micheasza, wzięli ryty posąg, efod, terafim i odlany posąg, kapłan powiedział do nich: Co robicie?"
"Sdz18,19": "Oni odpowiedzieli mu: Milcz! Połóż rękę na usta i chodź z nami, i bądź dla nas ojcem i kapłanem. Czyż lepiej ci być kapłanem w domu jednego człowieka, czy być kapłanem całego pokolenia i rodu w Izraelu?"
"Sdz18,20": "I uradowało się serce kapłana. Wziął więc efod, terafim i ryty posąg i przyłączył się do tego ludu."
"Sdz18,21": "A oni zawrócili i poszli, a przed sobą puścili dzieci i bydło oraz to, co kosztowniejsze."
"Sdz18,22": "A gdy byli już daleko od domu Micheasza, wtedy mężczyźni, którzy mieszkali w domach blisko domu Micheasza, zebrali się i zaczęli ścigać synów Dana."
"Sdz18,23": "I wołali za synami Dana. Ci zaś odwrócili się i powiedzieli do Micheasza: Co ci jest, że zebrałeś tych ludzi?"
"Sdz18,24": "I odpowiedział: Zabraliście moich bogów, które uczyniłem, oraz kapłana i poszliście sobie. Co mi więc pozostaje? Jak jeszcze możecie mówić: Co ci jest?"
"Sdz18,25": "Na to synowie Dana odpowiedzieli: Niech nie słyszymy za sobą twego głosu, by się nie rzucili na was rozgniewani ludzie, a straciłbyś swe życie i życie swego domu."
"Sdz18,26": "Poszli więc synowie Dana swoją drogą, a Micheasz, widząc, że byli silniejsi od niego, zawrócił i poszedł do swego domu."
"Sdz18,27": "Oni zaś zabrali to, co wykonał Micheasz, oraz kapłana, którego miał, i przybyli do Lajisz, do ludu spokojnego i bezpiecznego. I pobili go ostrzem miecza, a miasto spalili ogniem."
"Sdz18,28": "A nie było nikogo, kto by ich ratował, gdyż byli daleko od Sydonu i nie mieli z nikim żadnych interesów. A miasto to leżało w dolinie, która jest w Bet-Rechob. Oni odbudowali miasto i zamieszkali w nim."
"Sdz18,29": "I nazwali to miasto Dan od imienia swego ojca Dana, który urodził się Izraelowi. A przedtem miasto to nosiło nazwę Lajisz."
"Sdz18,30": "I synowie Dana ustawili sobie ryty posąg. A Jonatan, syn Gerszona, syna Manassesa, on i jego synowie byli kapłanami dla pokolenia Dana aż do czasu uprowadzenia do niewoli mieszkańców tej ziemi."
"Sdz18,31": "Postawili sobie ten ryty posąg, który uczynił Micheasz, po wszystkie dni, póki dom Boży był w Szilo."
