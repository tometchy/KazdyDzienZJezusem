"Sdz6,1":
  text: "Potem synowie Izraela czynili to, co złe w oczach PANA. Wydał ich więc PAN w ręce Midianitów na siedem lat."
  tags: []
"Sdz6,2":
  text: "A ręka Midianitów wzmocniła się nad Izraelem, tak że synowie Izraela kopali sobie przed Midianitami kryjówki w górach, jaskinie i warownie."
  tags: []
"Sdz6,3":
  text: "Bywało, że gdy Izrael coś zasiał, przychodzili Midianici, Amalekici i ludzie ze wschodu i najeżdżali go;"
  tags: []
"Sdz6,4":
  text: "I rozbijali obóz naprzeciwko niego, i niszczyli plony ziemi aż po granice Gazy. Nie pozostawiali nic na pożywienie Izraelitom – ani owiec, ani wołów, ani osłów."
  tags: []
"Sdz6,5":
  text: "Przybywali bowiem ze swymi stadami i namiotami, a przychodzili jak szarańcza tak licznie, że nie można było zliczyć ich ani ich wielbłądów. Tak wkraczali do ziemi, aby ją spustoszyć."
  tags: []
"Sdz6,6":
  text: "Dlatego Izrael bardzo zubożał z powodu Midianitów i synowie Izraela wołali do PANA."
  tags: []
"Sdz6,7":
  text: "A gdy synowie Izraela wołali do PANA z powodu Midianitów;"
  tags: []
"Sdz6,8":
  text: "PAN posłał do synów Izraela proroka, który powiedział do nich: Tak mówi PAN, Bóg Izraela: Ja wyprowadziłem was z ziemi Egiptu i wywiodłem was z domu niewoli."
  tags: []
"Sdz6,9":
  text: "I wyrwałem was z rąk Egipcjan oraz z rąk wszystkich, którzy was trapili. Wypędziłem ich przed wami i dałem wam ich ziemię;"
  tags: []
"Sdz6,10":
  text: "I powiedziałem wam: Ja jestem PAN, wasz Bóg, nie bójcie się bogów Amorytów, w których ziemi mieszkacie; lecz nie posłuchaliście mego głosu."
  tags: []
"Sdz6,11":
  text: "Wtedy przyszedł Anioł PANA i stanął pod dębem, który stał w Ofra, należącym do Joasza, Abiezerita. A jego syn Gedeon młócił zboże w tłoczni, aby je ukryć przed Midianitami."
  tags: []
"Sdz6,12":
  text: "Wówczas ukazał mu się Anioł PANA i powiedział do niego: PAN z tobą, dzielny wojowniku."
  tags: []
"Sdz6,13":
  text: "Gedeon mu odpowiedział: Mój Panie, proszę, jeśli PAN jest z nami, dlaczego przyszło na nas to wszystko? Gdzie są teraz wszystkie jego cuda, o których opowiadali nam nasi ojcowie, mówiąc: Czy PAN nie wyprowadził nas z Egiptu? A teraz PAN nas opuścił i wydał w ręce Midianitów."
  tags: []
"Sdz6,14":
  text: "Wtedy PAN spojrzał na niego i powiedział: Idź w tej swojej mocy, a wybawisz Izraela z rąk Midianitów. Czyż nie ja cię posłałem?"
  tags: []
"Sdz6,15":
  text: "On zaś powiedział do niego: Mój Panie, proszę, czym wybawię Izraela? Oto moja rodzina jest biedna w Manassesa, a ja jestem najmniejszy w domu swego ojca."
  tags: []
"Sdz6,16":
  text: "I PAN powiedział do niego: Ponieważ ja będę z tobą, pobijesz Midianitów jak jednego męża."
  tags: []
"Sdz6,17":
  text: "A on mu odpowiedział: Jeśli znalazłem łaskę w twoich oczach, daj mi znak, że to ty rozmawiasz ze mną."
  tags: []
"Sdz6,18":
  text: "Nie odchodź stąd, proszę, aż wrócę do ciebie i przyniosę ci swoją ofiarę i położę ją przed tobą. I odpowiedział: Poczekam, aż wrócisz."
  tags: []
"Sdz6,19":
  text: "Gedeon poszedł więc i przyrządził koźlę oraz przaśne chleby z jednej efy mąki. Mięso włożył do kosza, a polewkę mięsną wlał do garnka i przyniósł to do niego pod dąb, i ofiarował."
  tags: []
"Sdz6,20":
  text: "I Anioł Boga powiedział do niego: Weź mięso i przaśne chleby i połóż na tej skale, a polewkę wylej. I tak uczynił."
  tags: []
"Sdz6,21":
  text: "Wtedy Anioł PANA wyciągnął koniec laski, którą miał w ręce, i dotknął mięsa oraz przaśników; i wydobył się ogień ze skały i strawił mięso i przaśne chleby. Potem Anioł PANA zniknął sprzed jego oczu."
  tags: []
"Sdz6,22":
  text: "A gdy Gedeon zrozumiał, że to był Anioł PANA, powiedział: Ach, Panie BOŻE! Widziałem bowiem Anioła PANA twarzą w twarz."
  tags: []
"Sdz6,23":
  text: "I PAN mu powiedział: Pokój z tobą. Nie bój się, nie umrzesz."
  tags: []
"Sdz6,24":
  text: "Dlatego więc Gedeon zbudował tam ołtarz dla PANA i nazwał go: PAN jest pokojem. Do dziś znajduje się on w Ofra Abiezerytów."
  tags: []
"Sdz6,25":
  text: "Tej nocy PAN mu powiedział: Weź młodego cielca, który należy do twego ojca, oraz drugiego cielca siedmioletniego i zburz ołtarz Baala należący do twego ojca, i zetnij gaj, który jest przy nim;"
  tags: []
"Sdz6,26":
  text: "A zbuduj ołtarz dla PANA, swego Boga, na szczycie tej skały, na równym miejscu; weź tego drugiego cielca i złóż z niego całopalenie na drwach z gaju, który zetniesz."
  tags: []
"Sdz6,27":
  text: "Wziął więc Gedeon dziesięciu mężczyzn spośród swoich sług i uczynił tak, jak PAN mu rozkazał. A ponieważ bał się domu swego ojca i mieszkańców miasta, nie uczynił tego za dnia, lecz uczynił to w nocy."
  tags: []
"Sdz6,28":
  text: "A gdy mieszkańcy miasta wstali wczesnym rankiem, zobaczyli zburzony ołtarz Baala i ścięty gaj, który był obok niego, i tego drugiego cielca złożonego na całopalenie na zbudowanym ołtarzu."
  tags: []
"Sdz6,29":
  text: "I mówili jeden do drugiego: Któż to uczynił? A gdy się o to pytali i dowiadywali, powiedzieli: Uczynił to Gedeon, syn Joasza."
  tags: []
"Sdz6,30":
  text: "Wtedy mieszkańcy miasta powiedzieli do Joasza: Wyprowadź swego syna, niech umrze, gdyż zburzył ołtarz Baala i ściął gaj, który był przy nim."
  tags: []
"Sdz6,31":
  text: "A Joasz odpowiedział wszystkim, którzy stali dokoła niego: Czy chcecie stawać w obronie Baala? Czy chcecie go wybawić? Kto chciałby go bronić, niech umrze tego ranka. Jeśli jest bogiem, niech sam się spiera o to, że zburzono jego ołtarz."
  tags: []
"Sdz6,32":
  text: "I nazwano go tego dnia Jerubbaal, mówiąc: Niech Baal się spiera z nim, bo zburzył on jego ołtarz."
  tags: []
"Sdz6,33":
  text: "Wtedy wszyscy Midianici i Amalekici oraz ludzie ze wschodu zebrali się razem, przeprawili się przez Jordan i rozbili obóz w dolinie Jizreel."
  tags: []
"Sdz6,34":
  text: "Lecz Duch PANA ogarnął Gedeona, a on zadął w trąbę i zwołał do siebie dom Abiezera."
  tags: []
"Sdz6,35":
  text: "I wyprawił posłańców do całego pokolenia Manassesa, które zebrało się przy nim. Wysłał też posłańców do Aszera, do Zebulona i Neftalego; i wyruszyli im na spotkanie."
  tags: []
"Sdz6,36":
  text: "Wtedy Gedeon powiedział do Boga: Jeśli moją ręką wybawisz Izraela, jak powiedziałeś;"
  tags: []
"Sdz6,37":
  text: "To ja położę runo wełny na klepisku. Jeśli rosa spadnie tylko na runo, a cała ziemia będzie sucha, wtedy będę wiedział, że moją ręką wybawisz Izraela, jak powiedziałeś."
  tags: []
"Sdz6,38":
  text: "I tak się stało. Gdy wstał nazajutrz, ścisnął runo i wycisnął rosę z runa – pełną czaszę wody."
  tags: []
"Sdz6,39":
  text: "Gedeon powiedział jeszcze do Boga: Niech nie zapłonie twój gniew przeciwko mnie, że przemówię jeszcze raz. Pozwól, proszę, że powtórzę doświadczenie z runem: niech będzie suche tylko samo runo, a na całej ziemi niech będzie rosa."
  tags: []
"Sdz6,40":
  text: "I Bóg tak uczynił tej nocy: samo runo było suche, a na całej ziemi była rosa."
  tags: []
