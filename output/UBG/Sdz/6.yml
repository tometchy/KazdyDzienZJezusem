"Sdz6,1": "Potem synowie Izraela czynili to, co złe w oczach PANA. Wydał ich więc PAN w ręce Midianitów na siedem lat."
"Sdz6,2": "A ręka Midianitów wzmocniła się nad Izraelem, tak że synowie Izraela kopali sobie przed Midianitami kryjówki w górach, jaskinie i warownie."
"Sdz6,3": "Bywało, że gdy Izrael coś zasiał, przychodzili Midianici, Amalekici i ludzie ze wschodu i najeżdżali go;"
"Sdz6,4": "I rozbijali obóz naprzeciwko niego, i niszczyli plony ziemi aż po granice Gazy. Nie pozostawiali nic na pożywienie Izraelitom – ani owiec, ani wołów, ani osłów."
"Sdz6,5": "Przybywali bowiem ze swymi stadami i namiotami, a przychodzili jak szarańcza tak licznie, że nie można było zliczyć ich ani ich wielbłądów. Tak wkraczali do ziemi, aby ją spustoszyć."
"Sdz6,6": "Dlatego Izrael bardzo zubożał z powodu Midianitów i synowie Izraela wołali do PANA."
"Sdz6,7": "A gdy synowie Izraela wołali do PANA z powodu Midianitów;"
"Sdz6,8": "PAN posłał do synów Izraela proroka, który powiedział do nich: Tak mówi PAN, Bóg Izraela: Ja wyprowadziłem was z ziemi Egiptu i wywiodłem was z domu niewoli."
"Sdz6,9": "I wyrwałem was z rąk Egipcjan oraz z rąk wszystkich, którzy was trapili. Wypędziłem ich przed wami i dałem wam ich ziemię;"
"Sdz6,10": "I powiedziałem wam: Ja jestem PAN, wasz Bóg, nie bójcie się bogów Amorytów, w których ziemi mieszkacie; lecz nie posłuchaliście mego głosu."
"Sdz6,11": "Wtedy przyszedł Anioł PANA i stanął pod dębem, który stał w Ofra, należącym do Joasza, Abiezerita. A jego syn Gedeon młócił zboże w tłoczni, aby je ukryć przed Midianitami."
"Sdz6,12": "Wówczas ukazał mu się Anioł PANA i powiedział do niego: PAN z tobą, dzielny wojowniku."
"Sdz6,13": "Gedeon mu odpowiedział: Mój Panie, proszę, jeśli PAN jest z nami, dlaczego przyszło na nas to wszystko? Gdzie są teraz wszystkie jego cuda, o których opowiadali nam nasi ojcowie, mówiąc: Czy PAN nie wyprowadził nas z Egiptu? A teraz PAN nas opuścił i wydał w ręce Midianitów."
"Sdz6,14": "Wtedy PAN spojrzał na niego i powiedział: Idź w tej swojej mocy, a wybawisz Izraela z rąk Midianitów. Czyż nie ja cię posłałem?"
"Sdz6,15": "On zaś powiedział do niego: Mój Panie, proszę, czym wybawię Izraela? Oto moja rodzina jest biedna w Manassesa, a ja jestem najmniejszy w domu swego ojca."
"Sdz6,16": "I PAN powiedział do niego: Ponieważ ja będę z tobą, pobijesz Midianitów jak jednego męża."
"Sdz6,17": "A on mu odpowiedział: Jeśli znalazłem łaskę w twoich oczach, daj mi znak, że to ty rozmawiasz ze mną."
"Sdz6,18": "Nie odchodź stąd, proszę, aż wrócę do ciebie i przyniosę ci swoją ofiarę i położę ją przed tobą. I odpowiedział: Poczekam, aż wrócisz."
"Sdz6,19": "Gedeon poszedł więc i przyrządził koźlę oraz przaśne chleby z jednej efy mąki. Mięso włożył do kosza, a polewkę mięsną wlał do garnka i przyniósł to do niego pod dąb, i ofiarował."
"Sdz6,20": "I Anioł Boga powiedział do niego: Weź mięso i przaśne chleby i połóż na tej skale, a polewkę wylej. I tak uczynił."
"Sdz6,21": "Wtedy Anioł PANA wyciągnął koniec laski, którą miał w ręce, i dotknął mięsa oraz przaśników; i wydobył się ogień ze skały i strawił mięso i przaśne chleby. Potem Anioł PANA zniknął sprzed jego oczu."
"Sdz6,22": "A gdy Gedeon zrozumiał, że to był Anioł PANA, powiedział: Ach, Panie BOŻE! Widziałem bowiem Anioła PANA twarzą w twarz."
"Sdz6,23": "I PAN mu powiedział: Pokój z tobą. Nie bój się, nie umrzesz."
"Sdz6,24": "Dlatego więc Gedeon zbudował tam ołtarz dla PANA i nazwał go: PAN jest pokojem. Do dziś znajduje się on w Ofra Abiezerytów."
"Sdz6,25": "Tej nocy PAN mu powiedział: Weź młodego cielca, który należy do twego ojca, oraz drugiego cielca siedmioletniego i zburz ołtarz Baala należący do twego ojca, i zetnij gaj, który jest przy nim;"
"Sdz6,26": "A zbuduj ołtarz dla PANA, swego Boga, na szczycie tej skały, na równym miejscu; weź tego drugiego cielca i złóż z niego całopalenie na drwach z gaju, który zetniesz."
"Sdz6,27": "Wziął więc Gedeon dziesięciu mężczyzn spośród swoich sług i uczynił tak, jak PAN mu rozkazał. A ponieważ bał się domu swego ojca i mieszkańców miasta, nie uczynił tego za dnia, lecz uczynił to w nocy."
"Sdz6,28": "A gdy mieszkańcy miasta wstali wczesnym rankiem, zobaczyli zburzony ołtarz Baala i ścięty gaj, który był obok niego, i tego drugiego cielca złożonego na całopalenie na zbudowanym ołtarzu."
"Sdz6,29": "I mówili jeden do drugiego: Któż to uczynił? A gdy się o to pytali i dowiadywali, powiedzieli: Uczynił to Gedeon, syn Joasza."
"Sdz6,30": "Wtedy mieszkańcy miasta powiedzieli do Joasza: Wyprowadź swego syna, niech umrze, gdyż zburzył ołtarz Baala i ściął gaj, który był przy nim."
"Sdz6,31": "A Joasz odpowiedział wszystkim, którzy stali dokoła niego: Czy chcecie stawać w obronie Baala? Czy chcecie go wybawić? Kto chciałby go bronić, niech umrze tego ranka. Jeśli jest bogiem, niech sam się spiera o to, że zburzono jego ołtarz."
"Sdz6,32": "I nazwano go tego dnia Jerubbaal, mówiąc: Niech Baal się spiera z nim, bo zburzył on jego ołtarz."
"Sdz6,33": "Wtedy wszyscy Midianici i Amalekici oraz ludzie ze wschodu zebrali się razem, przeprawili się przez Jordan i rozbili obóz w dolinie Jizreel."
"Sdz6,34": "Lecz Duch PANA ogarnął Gedeona, a on zadął w trąbę i zwołał do siebie dom Abiezera."
"Sdz6,35": "I wyprawił posłańców do całego pokolenia Manassesa, które zebrało się przy nim. Wysłał też posłańców do Aszera, do Zebulona i Neftalego; i wyruszyli im na spotkanie."
"Sdz6,36": "Wtedy Gedeon powiedział do Boga: Jeśli moją ręką wybawisz Izraela, jak powiedziałeś;"
"Sdz6,37": "To ja położę runo wełny na klepisku. Jeśli rosa spadnie tylko na runo, a cała ziemia będzie sucha, wtedy będę wiedział, że moją ręką wybawisz Izraela, jak powiedziałeś."
"Sdz6,38": "I tak się stało. Gdy wstał nazajutrz, ścisnął runo i wycisnął rosę z runa – pełną czaszę wody."
"Sdz6,39": "Gedeon powiedział jeszcze do Boga: Niech nie zapłonie twój gniew przeciwko mnie, że przemówię jeszcze raz. Pozwól, proszę, że powtórzę doświadczenie z runem: niech będzie suche tylko samo runo, a na całej ziemi niech będzie rosa."
"Sdz6,40": "I Bóg tak uczynił tej nocy: samo runo było suche, a na całej ziemi była rosa."
