"Sdz8,1":
  text: "I mężczyźni z Efraima powiedzieli do niego: Dlaczego tak z nami postąpiłeś, że nie wezwałeś nas, gdy wyruszyłeś do walki z Midianitami? I mocno się z nim spierali."
  tags: []
"Sdz8,2":
  text: "A on powiedział: Cóż takiego uczyniłem w porównaniu z wami? Czyż nie lepszy jest ostatni zbiór winogron Efraima niż pierwszy zbiór Abiezera?"
  tags: []
"Sdz8,3":
  text: "Bóg wydał w wasze ręce książąt Midianu – Oreba i Zeeba. Cóż mogłem takiego uczynić w porównaniu z wami? Gdy to powiedział, ich duch uspokoił się wobec niego."
  tags: []
"Sdz8,4":
  text: "A gdy Gedeon przybył do Jordanu, przeprawił się przez niego wraz z trzystoma mężczyznami, którzy z nim byli, znużonymi i w pościgu."
  tags: []
"Sdz8,5":
  text: "I powiedział do mieszkańców Sukkot: Dajcie, proszę, po bochenku chleba ludowi, który idzie za mną, bo jest znużony, a ja ścigam Zebacha i Salmunnę, królów Midianu."
  tags: []
"Sdz8,6":
  text: "Lecz książęta Sukkot odpowiedzieli mu: Czy dłonie Zebacha i Salmunny są już w twoich rękach, żebyśmy mieli dać twemu wojsku chleba?"
  tags: []
"Sdz8,7":
  text: "Gedeon odpowiedział: Kiedy PAN wyda Zebacha i Salmunnę w moje ręce, wtedy wymłócę wasze ciała cierniem pustyni i ostami."
  tags: []
"Sdz8,8":
  text: "Potem wyruszył stamtąd do Penuel i mówił do nich podobnie, ale ludzie z Penuel odpowiedzieli mu tak samo jak odpowiedzieli mieszkańcy Sukkot."
  tags: []
"Sdz8,9":
  text: "Powiedział więc też mężczyznom z Penuel: Gdy wrócę w pokoju, zburzę tę wieżę."
  tags: []
"Sdz8,10":
  text: "A Zebach i Salmunna byli w Karkor, a z nimi ich wojsko w liczbie około piętnastu tysięcy, wszyscy, którzy pozostali z całego wojska ludzi ze wschodu; a poległo sto dwadzieścia tysięcy mężczyzn dobywających miecz."
  tags: []
"Sdz8,11":
  text: "Wtedy Gedeon ciągnął drogą tych, którzy mieszkali w namiotach, na wschód od Nobach i Jogbeha, i uderzył na obóz, który czuł się bezpieczny."
  tags: []
"Sdz8,12":
  text: "A gdy Zebach i Salmunna uciekli, ścigał ich i pojmał obu królów Midianu, Zebecha i Salmunnę, całe zaś wojsko rozgromił."
  tags: []
"Sdz8,13":
  text: "Potem Gedeon, syn Joasza, wrócił z bitwy, zanim wzeszło słońce;"
  tags: []
"Sdz8,14":
  text: "I schwytał młodzieńca spośród mieszkańców Sukkot, i wypytał go, a ten spisał mu książąt Sukkot i jego starszych, siedemdziesięciu siedmiu mężczyzn."
  tags: []
"Sdz8,15":
  text: "Wtedy przyszedł do mężczyzn Sukkot i powiedział: Oto Zebach i Salmunna, z powodu których mi urągaliście, mówiąc: Czy dłonie Zebacha i Salmunny są już w twoich rękach, abyśmy mieli dać chleba twoim znużonym mężczyznom?"
  tags: []
"Sdz8,16":
  text: "Wziął więc starszych tego miasta oraz ciernie z pustyni i osty i wysmagał nimi mężczyzn Sukkot."
  tags: []
"Sdz8,17":
  text: "Zburzył także wieżę Penuel i zabił mężczyzn tego miasta."
  tags: []
"Sdz8,18":
  text: "Potem powiedział do Zebacha i Salmunny: Co to byli za mężczyźni, których zabiliście w Tabor? A oni odpowiedzieli: Byli tacy jak ty; każdy z nich z wyglądu jak syn króla."
  tags: []
"Sdz8,19":
  text: "I powiedział: To byli moi bracia, synowie mojej matki. Jak żyje PAN, gdybyście zachowali ich przy życiu, nie zabiłbym was."
  tags: []
"Sdz8,20":
  text: "Potem powiedział do Jetera, swego pierworodnego: Wstań i zabij ich. Lecz młodzieniec nie dobył swego miecza, ponieważ bał się, gdyż był jeszcze chłopcem."
  tags: []
"Sdz8,21":
  text: "Wtedy Zebach i Salmunna powiedzieli: Ty wstań i rzuć się na nas, jaki bowiem mężczyzna, taka jego siła. Wstał więc Gedeon, zabił Zebacha i Salmunnę i zabrał klejnoty, które były na szyjach ich wielbłądów."
  tags: []
"Sdz8,22":
  text: "I powiedzieli Izraelici do Gedeona: Panuj nad nami, ty i twój syn, i syn twego syna. Wybawiłeś nas bowiem z rąk Midianitów."
  tags: []
"Sdz8,23":
  text: "Lecz Gedeon odpowiedział im: Nie ja będę panował nad wami ani nie mój syn będzie panował nad wami. PAN będzie panował nad wami."
  tags: []
"Sdz8,24":
  text: "Gedeon powiedział jeszcze do nich: Będę was prosił o jedną rzecz, aby każdy z was dał mi kolczyki ze swego łupu. Mieli bowiem złote kolczyki, bo byli Izmaelitami."
  tags: []
"Sdz8,25":
  text: "I powiedzieli: Chętnie damy. Rozpostarli szatę i każdy rzucał na nią kolczyki ze swoich łupów."
  tags: []
"Sdz8,26":
  text: "I waga tych złotych kolczyków, o które poprosił, wyniosła tysiąc siedemset syklów złota, nie licząc klejnotów i wisiorków, i szkarłatnych szat, które nosili królowie Midianu, i nie licząc łańcuchów, które były na szyjach ich wielbłądów."
  tags: []
"Sdz8,27":
  text: "A Gedeon zrobił z tego efod i umieścił go w swoim mieście, w Ofra. Tam cały Izrael, chodząc za nim, uprawiał nierząd, a stało się to sidłem dla Gedeona i jego domu."
  tags: []
"Sdz8,28":
  text: "Tak Midianici zostali poniżeni przed synami Izraela i nie podnieśli już swoich głów. A ziemia żyła w pokoju przez czterdzieści lat za dni Gedeona."
  tags: []
"Sdz8,29":
  text: "Wrócił więc Jerubbaal, syn Joasza, i mieszkał w swoim domu."
  tags: []
"Sdz8,30":
  text: "A Gedeon miał siedemdziesięciu synów, którzy wyszli z jego bioder. Miał bowiem wiele żon."
  tags: []
"Sdz8,31":
  text: "Również jego nałożnica, która była w Sychem, urodziła mu syna i nadała mu imię Abimelek."
  tags: []
"Sdz8,32":
  text: "Potem Gedeon, syn Joasza, umarł w szczęśliwej starości i został pogrzebany w grobie swego ojca Joasza, w Ofra Abiezerytów."
  tags: []
"Sdz8,33":
  text: "A gdy Gedeon umarł, synowie Izraela odwrócili się i uprawiali nierząd, idąc za Baalami, i ustanowili sobie Baal-Berita swoim bogiem."
  tags: []
"Sdz8,34":
  text: "I synowie Izraela nie pamiętali o PANU, swym Bogu, który ich wyrwał z rąk wszystkich okolicznych wrogów;"
  tags: []
"Sdz8,35":
  text: "I nie okazali miłosierdzia domowi Jerubbaala, Gedeona, za wszystkie dobrodziejstwa, jakie wyświadczył on Izraelowi."
  tags: []
