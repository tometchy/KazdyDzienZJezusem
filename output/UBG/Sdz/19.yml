"Sdz19,1":
  text: "W tych dniach, kiedy nie było króla w Izraelu, pewien Lewita, mieszkający przy zboczu góry Efraim, wziął sobie nałożnicę z Betlejem judzkiego."
  tags: []
"Sdz19,2":
  text: "A jego nałożnica dopuściła się nierządu przeciwko niemu, potem odeszła od niego do domu swego ojca, do Betlejem judzkiego; i była tam u niego przez cztery miesiące."
  tags: []
"Sdz19,3":
  text: "Wstał więc jej mąż i poszedł za nią, aby przebłagać ją i sprowadzić z powrotem. Miał ze sobą swego sługę i parę osłów. Wtedy ona wprowadziła go do domu swego ojca, a gdy ojciec tej dziewczyny zobaczył go, uradował się z jego przyjścia."
  tags: []
"Sdz19,4":
  text: "I zatrzymał go jego teść, ojciec tej dziewczyny, i zamieszkał u niego przez trzy dni. Jedli, pili i nocowali tam."
  tags: []
"Sdz19,5":
  text: "A czwartego dnia, gdy obudzili się wcześnie rano, wstał on, aby odejść. Ale ojciec tej dziewczyny powiedział do swego zięcia: Posil swoje serce odrobiną chleba, a potem pójdziecie."
  tags: []
"Sdz19,6":
  text: "Usiedli więc i jedli obaj razem, i napili się. Potem ojciec tej dziewczyny powiedział do jej męża: Zostań, proszę, i przenocuj tu, i niech twoje serce się raduje."
  tags: []
"Sdz19,7":
  text: "A gdy ten mężczyzna wstał, aby wyruszyć w drogę, jego teść nalegał na niego, znowu więc przenocował tam."
  tags: []
"Sdz19,8":
  text: "Piątego dnia wstał wcześnie rano, aby iść; lecz ojciec tej dziewczyny powiedział: Posil, proszę, swoje serce. I zwlekali aż do schyłku dnia, i jedli obaj razem."
  tags: []
"Sdz19,9":
  text: "Kiedy ten mężczyzna wstał, aby wyruszyć w drogę wraz ze swoją nałożnicą i swoim sługą, jego teść, ojciec tej dziewczyny, powiedział: Oto dzień już chyli się ku wieczorowi, przenocujcie tu, proszę. Oto dzień się kończy, przenocujcie tu i niech twoje serce się raduje. Jutro rano wyprawicie się w drogę i pójdziesz do swego domu."
  tags: []
"Sdz19,10":
  text: "Lecz mężczyzna ten nie chciał zostać na noc, ale wstał i odszedł, i przyszedł do miejsca naprzeciw Jebus, czyli do Jerozolimy. Miał ze sobą dwa juczne osły i swoją nałożnicę."
  tags: []
"Sdz19,11":
  text: "A gdy byli blisko Jebus, a dzień chylił się ku końcowi, wtedy sługa powiedział do swego pana: Chodź, proszę, wstąpmy do tego miasta Jebusytów i przenocujmy w nim."
  tags: []
"Sdz19,12":
  text: "Jego pan mu odpowiedział: Nie wstępujmy do miasta cudzoziemców, którzy nie należą do synów Izraela, ale idźmy aż do Gibea."
  tags: []
"Sdz19,13":
  text: "Powiedział jeszcze do swego sługi: Chodźmy i zbliżmy się do jednego z tych miejsc, aby przenocować w Gibea lub w Rama."
  tags: []
"Sdz19,14":
  text: "Przeszli więc i poszli dalej, a słońce zaszło im przy Gibea, które należy do pokolenia Beniamina."
  tags: []
"Sdz19,15":
  text: "I udali się tam, aby wejść i przenocować w Gibea. A gdy wszedł, usiadł na ulicy w mieście, gdyż nie było nikogo, kto by ich przyjął do domu i przenocował."
  tags: []
"Sdz19,16":
  text: "A oto pewien starzec szedł wieczorem ze swej pracy na polu; ten człowiek pochodził z góry Efraim i był przybyszem w Gibea. Ludzie zaś tego miejsca byli Beniaminitami."
  tags: []
"Sdz19,17":
  text: "Gdy podniósł swe oczy, zobaczył tego podróżnego na ulicy miasta. I zapytał go starzec: Dokąd idziesz i skąd przybyłeś?"
  tags: []
"Sdz19,18":
  text: "On odpowiedział mu: Idziemy z Betlejem judzkiego aż na zbocze góry Efraim, skąd pochodzę. Poszedłem do Betlejem judzkiego, a teraz idę do domu PANA, ale nie ma nikogo, kto by mnie przyjął do domu."
  tags: []
"Sdz19,19":
  text: "Mamy słomę i siano dla naszych osłów, także chleb i wino mam dla siebie i dla twojej służącej, i dla sługi, który jest z twoimi sługami. Nie brak nam niczego."
  tags: []
"Sdz19,20":
  text: "Wtedy starzec mu powiedział: Pokój z tobą. Każdy twój brak będzie moją sprawą; tylko nie nocuj na ulicy."
  tags: []
"Sdz19,21":
  text: "Wprowadził go więc do swego domu i dał osłom obrok; a gdy umyli swe nogi, jedli i pili."
  tags: []
"Sdz19,22":
  text: "A gdy rozweselili swoje serca, oto mężczyźni tego miasta, synowie Beliala, otoczyli dom i kołatali do drzwi, i mówili do gospodarza tego domu, do starca: Wyprowadź człowieka, który wszedł do twego domu, abyśmy z nim obcowali."
  tags: []
"Sdz19,23":
  text: "A ten człowiek, gospodarz domu, wyszedł do nich i powiedział im: Nie, moi bracia, nie czyńcie, proszę, tej niegodziwości, gdyż ten człowiek wszedł do mego domu, nie czyńcie tej sprośności."
  tags: []
"Sdz19,24":
  text: "Oto jest tu moja córka, dziewica, oraz jego nałożnica; wyprowadzę je zaraz, żebyście je znieważali i uczynili z nimi, co wydaje się wam słuszne. Tylko temu człowiekowi nie czyńcie tej niegodziwości."
  tags: []
"Sdz19,25":
  text: "Lecz ci mężczyźni nie chcieli słuchać jego głosu. Wziął więc ten człowiek swoją nałożnicę i wyprowadził ją do nich na dwór; obcowali z nią i gwałcili ją przez całą noc aż do rana. Potem ją puścili, gdy wschodziła zorza."
  tags: []
"Sdz19,26":
  text: "A o świcie ta kobieta przyszła i upadła przy drzwiach domu tego człowieka, gdzie przebywał jej pan; leżała tam, aż się rozwidniło."
  tags: []
"Sdz19,27":
  text: "Potem jej pan wstał rano, otworzył drzwi domu i wyszedł, aby wyruszać w drogę. A oto kobieta, jego nałożnica, leżała u drzwi domu z rękami na progu."
  tags: []
"Sdz19,28":
  text: "I powiedział do niej: Wstań, pójdźmy. Lecz ona nic nie odpowiedziała. Wziął ją więc ten człowiek na osła i poszedł do swego miejsca."
  tags: []
"Sdz19,29":
  text: "A gdy przyszedł do swego domu, wziął nóż, chwycił swoją nałożnicę, rozciął ją wraz z kośćmi na dwanaście części i rozesłał ją po wszystkich granicach Izraela."
  tags: []
"Sdz19,30":
  text: "A każdy, kto to widział, mówił: Nigdy nie wydarzyło się nic takiego ani nie widziano niczego takiego od dnia wyjścia synów Izraela z Egiptu aż do tego dnia. Zastanówcie się nad tym, naradźcie się i mówcie o tym."
  tags: []
