"Sdz13,1": "Potem synowie Izraela znowu czynili to, co złe w oczach PANA. I wydał ich PAN w ręce Filistynów na czterdzieści lat."
"Sdz13,2": "A był pewien mężczyzna z Sorea, z pokolenia Dana, imieniem Manoach, a jego żona była niepłodna i nie rodziła."
"Sdz13,3": "I Anioł PANA ukazał się tej kobiecie, i powiedział do niej: Oto jesteś niepłodna i nie rodziłaś, ale poczniesz i urodzisz syna."
"Sdz13,4": "Dlatego teraz strzeż się, nie pij wina ani mocnego napoju i nie jedz nic nieczystego;"
"Sdz13,5": "Bo oto poczniesz i urodzisz syna, a brzytwa nie dotknie jego głowy, bo to dziecko będzie nazirejczykiem dla Boga już od łona. I zacznie on wybawiać Izraela z rąk Filistynów."
"Sdz13,6": "Wtedy kobieta przyszła i powiedziała swemu mężowi: Przyszedł do mnie mąż Boży, którego oblicze było jak oblicze Anioła Boga, bardzo straszne. Nie pytałam go, skąd jest, nie oznajmił mi też swego imienia."
"Sdz13,7": "Powiedział mi tylko: Oto poczniesz i urodzisz syna. Teraz więc nie pij wina ani mocnego napoju i nie jedz niczego nieczystego, gdyż dziecko będzie nazirejczykiem dla Boga już od łona aż do dnia swojej śmierci."
"Sdz13,8": "Wtedy Manoach modlił się do PANA, mówiąc: Proszę, Panie mój, niech mąż Boży, którego posłałeś, przyjdzie znowu do nas i nauczy nas, co mamy czynić z dzieckiem, które się urodzi."
"Sdz13,9": "I Bóg wysłuchał głosu Manoacha. Przyszedł znowu Anioł Boga do tej kobiety, gdy siedziała na polu, lecz nie było przy niej jej męża Manoacha."
"Sdz13,10": "Kobieta pobiegła więc szybko i opowiedziała swemu mężowi: Oto ukazał mi się ten mąż, który przyszedł do mnie tamtego dnia."
"Sdz13,11": "A Manoach wstał i poszedł za swoją żoną. Gdy przyszedł do tego męża, powiedział mu: Czy jesteś tym mężem, który rozmawiał z moją żoną? A on odpowiedział: Jestem."
"Sdz13,12": "Manoach powiedział: Niech się teraz spełni twoje słowo. Lecz jak mamy postępować z dzieckiem i co mamy dla niego zrobić?"
"Sdz13,13": "I Anioł PANA odpowiedział Manoachowi: Niech twoja żona wystrzega się wszystkiego, co jej powiedziałem."
"Sdz13,14": "Niech nie je niczego, co pochodzi z winorośli; także niech nie pije wina ani mocnego napoju, ani niech nie je żadnej rzeczy nieczystej. Niech przestrzega wszystkiego, co jej przykazałem."
"Sdz13,15": "Wtedy Manoach powiedział do Anioła PANA: Pozwól, proszę, że cię zatrzymamy i przygotujemy dla ciebie koźlątko."
"Sdz13,16": "Lecz Anioł PANA odpowiedział Manoachowi: Choćbyś mnie zatrzymał, nie będę jadł twego chleba. Ale jeśli chcesz złożyć całopalenie, złóż je PANU. Manoach nie wiedział bowiem, że to był Anioł PANA."
"Sdz13,17": "I Manoach powiedział do Anioła PANA: Jakie jest twoje imię, abyśmy cię uczcili, gdy spełni się twoje słowo?"
"Sdz13,18": "Anioł PANA odpowiedział: Dlaczego pytasz o moje imię, które jest tajemnicze?"
"Sdz13,19": "Wziął więc Manoach koźlę oraz ofiarę pokarmową i złożył to na skale PANU. A uczynił on cud, a Manoach i jego żona patrzyli na to."
"Sdz13,20": "A gdy płomień wznosił się z ołtarza ku niebu, wtedy Anioł PANA wstąpił w płomień ołtarza, a Manoach i jego żona, widząc to, upadli na twarze na ziemię."
"Sdz13,21": "I Anioł PANA już więcej nie ukazał się Manoachowi ani jego żonie. Wtedy Manoach poznał, że to był Anioł PANA."
"Sdz13,22": "Potem Manoach powiedział do swojej żony: Na pewno umrzemy, bo widzieliśmy Boga."
"Sdz13,23": "Jego żona zaś odpowiedziała mu: Gdyby PAN chciał nas zabić, nie przyjąłby z naszych rąk całopalenia i ofiary pokarmowej ani nie ukazałby nam tego wszystkiego, ani nie objawiłby nam teraz takich rzeczy."
"Sdz13,24": "Kobieta urodziła więc syna i nadała mu imię Samson. I dziecko rosło, a PAN mu błogosławił."
"Sdz13,25": "I Duch PANA zaczął go pobudzać w obozie Dan, między Sorea a Esztaol."
