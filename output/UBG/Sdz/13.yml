"Sdz13,1":
  text: "Potem synowie Izraela znowu czynili to, co złe w oczach PANA. I wydał ich PAN w ręce Filistynów na czterdzieści lat."
  tags: []
"Sdz13,2":
  text: "A był pewien mężczyzna z Sorea, z pokolenia Dana, imieniem Manoach, a jego żona była niepłodna i nie rodziła."
  tags: []
"Sdz13,3":
  text: "I Anioł PANA ukazał się tej kobiecie, i powiedział do niej: Oto jesteś niepłodna i nie rodziłaś, ale poczniesz i urodzisz syna."
  tags: []
"Sdz13,4":
  text: "Dlatego teraz strzeż się, nie pij wina ani mocnego napoju i nie jedz nic nieczystego;"
  tags: []
"Sdz13,5":
  text: "Bo oto poczniesz i urodzisz syna, a brzytwa nie dotknie jego głowy, bo to dziecko będzie nazirejczykiem dla Boga już od łona. I zacznie on wybawiać Izraela z rąk Filistynów."
  tags: []
"Sdz13,6":
  text: "Wtedy kobieta przyszła i powiedziała swemu mężowi: Przyszedł do mnie mąż Boży, którego oblicze było jak oblicze Anioła Boga, bardzo straszne. Nie pytałam go, skąd jest, nie oznajmił mi też swego imienia."
  tags: []
"Sdz13,7":
  text: "Powiedział mi tylko: Oto poczniesz i urodzisz syna. Teraz więc nie pij wina ani mocnego napoju i nie jedz niczego nieczystego, gdyż dziecko będzie nazirejczykiem dla Boga już od łona aż do dnia swojej śmierci."
  tags: []
"Sdz13,8":
  text: "Wtedy Manoach modlił się do PANA, mówiąc: Proszę, Panie mój, niech mąż Boży, którego posłałeś, przyjdzie znowu do nas i nauczy nas, co mamy czynić z dzieckiem, które się urodzi."
  tags: []
"Sdz13,9":
  text: "I Bóg wysłuchał głosu Manoacha. Przyszedł znowu Anioł Boga do tej kobiety, gdy siedziała na polu, lecz nie było przy niej jej męża Manoacha."
  tags: []
"Sdz13,10":
  text: "Kobieta pobiegła więc szybko i opowiedziała swemu mężowi: Oto ukazał mi się ten mąż, który przyszedł do mnie tamtego dnia."
  tags: []
"Sdz13,11":
  text: "A Manoach wstał i poszedł za swoją żoną. Gdy przyszedł do tego męża, powiedział mu: Czy jesteś tym mężem, który rozmawiał z moją żoną? A on odpowiedział: Jestem."
  tags: []
"Sdz13,12":
  text: "Manoach powiedział: Niech się teraz spełni twoje słowo. Lecz jak mamy postępować z dzieckiem i co mamy dla niego zrobić?"
  tags: []
"Sdz13,13":
  text: "I Anioł PANA odpowiedział Manoachowi: Niech twoja żona wystrzega się wszystkiego, co jej powiedziałem."
  tags: []
"Sdz13,14":
  text: "Niech nie je niczego, co pochodzi z winorośli; także niech nie pije wina ani mocnego napoju, ani niech nie je żadnej rzeczy nieczystej. Niech przestrzega wszystkiego, co jej przykazałem."
  tags: []
"Sdz13,15":
  text: "Wtedy Manoach powiedział do Anioła PANA: Pozwól, proszę, że cię zatrzymamy i przygotujemy dla ciebie koźlątko."
  tags: []
"Sdz13,16":
  text: "Lecz Anioł PANA odpowiedział Manoachowi: Choćbyś mnie zatrzymał, nie będę jadł twego chleba. Ale jeśli chcesz złożyć całopalenie, złóż je PANU. Manoach nie wiedział bowiem, że to był Anioł PANA."
  tags: []
"Sdz13,17":
  text: "I Manoach powiedział do Anioła PANA: Jakie jest twoje imię, abyśmy cię uczcili, gdy spełni się twoje słowo?"
  tags: []
"Sdz13,18":
  text: "Anioł PANA odpowiedział: Dlaczego pytasz o moje imię, które jest tajemnicze?"
  tags: []
"Sdz13,19":
  text: "Wziął więc Manoach koźlę oraz ofiarę pokarmową i złożył to na skale PANU. A uczynił on cud, a Manoach i jego żona patrzyli na to."
  tags: []
"Sdz13,20":
  text: "A gdy płomień wznosił się z ołtarza ku niebu, wtedy Anioł PANA wstąpił w płomień ołtarza, a Manoach i jego żona, widząc to, upadli na twarze na ziemię."
  tags: []
"Sdz13,21":
  text: "I Anioł PANA już więcej nie ukazał się Manoachowi ani jego żonie. Wtedy Manoach poznał, że to był Anioł PANA."
  tags: []
"Sdz13,22":
  text: "Potem Manoach powiedział do swojej żony: Na pewno umrzemy, bo widzieliśmy Boga."
  tags: []
"Sdz13,23":
  text: "Jego żona zaś odpowiedziała mu: Gdyby PAN chciał nas zabić, nie przyjąłby z naszych rąk całopalenia i ofiary pokarmowej ani nie ukazałby nam tego wszystkiego, ani nie objawiłby nam teraz takich rzeczy."
  tags: []
"Sdz13,24":
  text: "Kobieta urodziła więc syna i nadała mu imię Samson. I dziecko rosło, a PAN mu błogosławił."
  tags: []
"Sdz13,25":
  text: "I Duch PANA zaczął go pobudzać w obozie Dan, między Sorea a Esztaol."
  tags: []
