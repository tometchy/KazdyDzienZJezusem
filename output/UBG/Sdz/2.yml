"Sdz2,1":
  text: "I wstąpił Anioł PANA z Gilgal do Bokim, i powiedział: Wyprowadziłem was z Egiptu i przyprowadziłem was do ziemi, którą przysiągłem waszym ojcom, i powiedziałem: Nigdy nie naruszę swego przymierza z wami;"
  tags: []
"Sdz2,2":
  text: "Wy jednak nie zawierajcie przymierza z mieszkańcami tej ziemi, a ich ołtarze zburzcie. Lecz nie słuchaliście mojego głosu. Dlaczego tak postąpiliście?"
  tags: []
"Sdz2,3":
  text: "Dlatego też powiedziałem: Nie wypędzę ich przed wami, lecz będą wam jak ciernie na boki, a ich bogowie będą dla was sidłem."
  tags: []
"Sdz2,4":
  text: "Gdy Anioł PANA wypowiedział te słowa do wszystkich synów Izraela, lud podniósł głos i zapłakał."
  tags: []
"Sdz2,5":
  text: "Nadali temu miejscu nazwę Bokim i tam złożyli PANU ofiarę."
  tags: []
"Sdz2,6":
  text: "Gdy Jozue rozesłał lud, synowie Izraela rozeszli się, każdy do swego dziedzictwa, aby posiąść ziemię."
  tags: []
"Sdz2,7":
  text: "Lud służył PANU przez wszystkie dni Jozuego i przez wszystkie dni starszych, którzy przeżyli Jozuego i widzieli wszystkie wielkie dzieła PANA, jakie uczynił dla Izraela."
  tags: []
"Sdz2,8":
  text: "A Jozue, syn Nuna, sługa PANA, umarł w wieku stu dziesięciu lat;"
  tags: []
"Sdz2,9":
  text: "I pogrzebali go na obszarze jego dziedzictwa w Timnat-Cheres, na górze Efraim, na północ od góry Gaasz."
  tags: []
"Sdz2,10":
  text: "Także całe to pokolenie zostało przyłączone do swoich ojców. I powstało po nim inne pokolenie, które nie znało PANA ani też dzieł, których dokonał dla Izraela;"
  tags: []
"Sdz2,11":
  text: "I synowie Izraela czynili to, co złe w oczach PANA, i służyli Baalom;"
  tags: []
"Sdz2,12":
  text: "I opuścili PANA, Boga swoich ojców, który wyprowadził ich z ziemi Egiptu, i poszli za cudzymi bogami, za bogami okolicznych narodów, i oddawali im pokłon, i tak pobudzili PANA do gniewu."
  tags: []
"Sdz2,13":
  text: "Opuścili PANA, a służyli Baalowi i Asztartom."
  tags: []
"Sdz2,14":
  text: "Wtedy zapłonął gniew PANA przeciw Izraelowi, wydał ich w ręce grabieżców, którzy ich grabili, i sprzedał ich w ręce ich okolicznych wrogów, tak że nie mogli się dalej ostać przed swymi wrogami."
  tags: []
"Sdz2,15":
  text: "A gdziekolwiek wyruszyli, ręka PANA była przeciwko nim ku nieszczęściu, jak PAN powiedział i jak PAN im przysiągł; i byli bardzo uciskani."
  tags: []
"Sdz2,16":
  text: "Potem PAN wzbudził sędziów, którzy ich wyzwalali z rąk grabieżców;"
  tags: []
"Sdz2,17":
  text: "Lecz także swoich sędziów nie słuchali, ale uprawiali nierząd z obcymi bogami i oddawali im pokłon. Szybko zboczyli z drogi, którą kroczyli ich ojcowie, słuchający przykazań PANA; ci tak nie postępowali."
  tags: []
"Sdz2,18":
  text: "A gdy PAN wzbudzał im sędziów, to PAN był z każdym sędzią i wybawiał ich z rąk ich wrogów przez wszystkie dni sędziego. PAN bowiem litował się nad ich jękiem z powodu tych, którzy ich uciskali i trapili."
  tags: []
"Sdz2,19":
  text: "Jednak po śmierci sędziego odwracali się i psuli się bardziej niż ich ojcowie, chodząc za cudzymi bogami i służąc im oraz oddając im pokłon; nie odstępowali od swoich czynów ani od swej upartej drogi."
  tags: []
"Sdz2,20":
  text: "Zapłonął więc gniew PANA przeciw Izraelowi i powiedział: Ponieważ ten naród złamał moje przymierze, które zawarłem z jego ojcami, i nie usłuchał mojego głosu;"
  tags: []
"Sdz2,21":
  text: "Ja też odtąd nie wypędzę przed nim żadnego z narodów, które pozostawił Jozue, kiedy umarł;"
  tags: []
"Sdz2,22":
  text: "Aby przez nie doświadczyć Izraela, czy będą strzec drogi PANA, aby po niej kroczyć, jak strzegli jej ich ojcowie, czy też nie."
  tags: []
"Sdz2,23":
  text: "PAN więc pozostawił te narody, nie wypędzając ich szybko, ani ich nie wydał w ręce Jozuego."
  tags: []
