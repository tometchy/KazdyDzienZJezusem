"Sdz2,1": "I wstąpił Anioł PANA z Gilgal do Bokim, i powiedział: Wyprowadziłem was z Egiptu i przyprowadziłem was do ziemi, którą przysiągłem waszym ojcom, i powiedziałem: Nigdy nie naruszę swego przymierza z wami;"
"Sdz2,2": "Wy jednak nie zawierajcie przymierza z mieszkańcami tej ziemi, a ich ołtarze zburzcie. Lecz nie słuchaliście mojego głosu. Dlaczego tak postąpiliście?"
"Sdz2,3": "Dlatego też powiedziałem: Nie wypędzę ich przed wami, lecz będą wam jak ciernie na boki, a ich bogowie będą dla was sidłem."
"Sdz2,4": "Gdy Anioł PANA wypowiedział te słowa do wszystkich synów Izraela, lud podniósł głos i zapłakał."
"Sdz2,5": "Nadali temu miejscu nazwę Bokim i tam złożyli PANU ofiarę."
"Sdz2,6": "Gdy Jozue rozesłał lud, synowie Izraela rozeszli się, każdy do swego dziedzictwa, aby posiąść ziemię."
"Sdz2,7": "Lud służył PANU przez wszystkie dni Jozuego i przez wszystkie dni starszych, którzy przeżyli Jozuego i widzieli wszystkie wielkie dzieła PANA, jakie uczynił dla Izraela."
"Sdz2,8": "A Jozue, syn Nuna, sługa PANA, umarł w wieku stu dziesięciu lat;"
"Sdz2,9": "I pogrzebali go na obszarze jego dziedzictwa w Timnat-Cheres, na górze Efraim, na północ od góry Gaasz."
"Sdz2,10": "Także całe to pokolenie zostało przyłączone do swoich ojców. I powstało po nim inne pokolenie, które nie znało PANA ani też dzieł, których dokonał dla Izraela;"
"Sdz2,11": "I synowie Izraela czynili to, co złe w oczach PANA, i służyli Baalom;"
"Sdz2,12": "I opuścili PANA, Boga swoich ojców, który wyprowadził ich z ziemi Egiptu, i poszli za cudzymi bogami, za bogami okolicznych narodów, i oddawali im pokłon, i tak pobudzili PANA do gniewu."
"Sdz2,13": "Opuścili PANA, a służyli Baalowi i Asztartom."
"Sdz2,14": "Wtedy zapłonął gniew PANA przeciw Izraelowi, wydał ich w ręce grabieżców, którzy ich grabili, i sprzedał ich w ręce ich okolicznych wrogów, tak że nie mogli się dalej ostać przed swymi wrogami."
"Sdz2,15": "A gdziekolwiek wyruszyli, ręka PANA była przeciwko nim ku nieszczęściu, jak PAN powiedział i jak PAN im przysiągł; i byli bardzo uciskani."
"Sdz2,16": "Potem PAN wzbudził sędziów, którzy ich wyzwalali z rąk grabieżców;"
"Sdz2,17": "Lecz także swoich sędziów nie słuchali, ale uprawiali nierząd z obcymi bogami i oddawali im pokłon. Szybko zboczyli z drogi, którą kroczyli ich ojcowie, słuchający przykazań PANA; ci tak nie postępowali."
"Sdz2,18": "A gdy PAN wzbudzał im sędziów, to PAN był z każdym sędzią i wybawiał ich z rąk ich wrogów przez wszystkie dni sędziego. PAN bowiem litował się nad ich jękiem z powodu tych, którzy ich uciskali i trapili."
"Sdz2,19": "Jednak po śmierci sędziego odwracali się i psuli się bardziej niż ich ojcowie, chodząc za cudzymi bogami i służąc im oraz oddając im pokłon; nie odstępowali od swoich czynów ani od swej upartej drogi."
"Sdz2,20": "Zapłonął więc gniew PANA przeciw Izraelowi i powiedział: Ponieważ ten naród złamał moje przymierze, które zawarłem z jego ojcami, i nie usłuchał mojego głosu;"
"Sdz2,21": "Ja też odtąd nie wypędzę przed nim żadnego z narodów, które pozostawił Jozue, kiedy umarł;"
"Sdz2,22": "Aby przez nie doświadczyć Izraela, czy będą strzec drogi PANA, aby po niej kroczyć, jak strzegli jej ich ojcowie, czy też nie."
"Sdz2,23": "PAN więc pozostawił te narody, nie wypędzając ich szybko, ani ich nie wydał w ręce Jozuego."
