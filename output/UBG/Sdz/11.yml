"Sdz11,1":
  text: "A Jefte Gileadczyk był dzielnym wojownikiem, a był synem nierządnicy. Jeftego spłodził Gilead."
  tags: []
"Sdz11,2":
  text: "Ale również żona Gileada urodziła mu synów; gdy więc synowie tej żony dorośli, wygnali Jeftego, mówiąc mu: Nie będziesz brał dziedzictwa w domu naszego ojca, gdyż jesteś synem obcej kobiety."
  tags: []
"Sdz11,3":
  text: "Jefte uciekł więc przed swoimi braćmi i zamieszkał w ziemi Tob. Przyłączyli się do niego ludzie próżni i wyruszali z nim."
  tags: []
"Sdz11,4":
  text: "Po pewnym czasie synowie Ammona walczyli z Izraelem."
  tags: []
"Sdz11,5":
  text: "A gdy Ammonici zaczęli walczyć z Izraelem, starsi z Gileadu poszli sprowadzić Jeftego z ziemi Tob."
  tags: []
"Sdz11,6":
  text: "I powiedzieli mu: Chodź i bądź naszym dowódcą, a będziemy walczyć przeciwko synom Ammona."
  tags: []
"Sdz11,7":
  text: "Lecz Jefte odpowiedział starszym Gileadu: Czy wy nie znienawidziliście mnie i nie wygnaliście mnie z domu mego ojca? Dlaczego przyszliście do mnie teraz, gdy znajdujecie się w ucisku?"
  tags: []
"Sdz11,8":
  text: "Wtedy starsi Gileadu powiedzieli do Jeftego: Dlatego teraz zwracamy się do ciebie, abyś poszedł z nami i walczył przeciwko synom Ammona, i był naszym wodzem nad wszystkimi mieszkańcami Gileadu."
  tags: []
"Sdz11,9":
  text: "I Jefte odpowiedział starszym z Gileadu: Jeśli sprowadzicie mnie, abym walczył przeciwko synom Ammona, a PAN mi ich wyda, czy będę waszym wodzem?"
  tags: []
"Sdz11,10":
  text: "I starsi Gileadu odpowiedzieli Jeftemu: PAN będzie świadkiem między nami, jeśli nie postąpimy według twego słowa."
  tags: []
"Sdz11,11":
  text: "Wtedy Jefte poszedł ze starszymi Gileadu i lud ustanowił go nad sobą dowódcą i wodzem. I Jefte powtórzył wszystkie te słowa przed PANEM w Mispie."
  tags: []
"Sdz11,12":
  text: "Potem Jefte wyprawił posłańców do króla synów Ammona, mówiąc: Co zaszło między mną a tobą, że wyruszyłeś przeciwko mnie, aby walczyć w mojej ziemi?"
  tags: []
"Sdz11,13":
  text: "Król synów Ammona odpowiedział posłańcom Jeftego: Ponieważ Izrael po wyjściu z Egiptu zajął moją ziemię od Arnonu aż do Jabbok i aż do Jordanu. Dlatego teraz zwróć mi ją pokojowo."
  tags: []
"Sdz11,14":
  text: "Jefte po raz drugi wyprawił posłańców do króla synów Ammona."
  tags: []
"Sdz11,15":
  text: "I powiedział mu: Tak mówi Jefte: Izrael nie zajął ziemi Moabu ani ziemi synów Ammona."
  tags: []
"Sdz11,16":
  text: "Lecz gdy Izrael wychodził z Egiptu przez pustynię aż do Morza Czerwonego i przyszedł do Kadesz;"
  tags: []
"Sdz11,17":
  text: "Wtedy Izrael wyprawił posłów do króla Edomu, mówiąc: Pozwól mi, proszę, przejść przez twoją ziemię. Lecz król Edomu nie pozwolił. Posłał także do króla Moabu, i on nie pozwolił. Izrael więc pozostał w Kadesz."
  tags: []
"Sdz11,18":
  text: "A gdy szedł przez pustynię, obszedł ziemię Edomu i ziemię Moabu i przyszedł od wschodniej strony ziemi Moabu, i rozbił obóz za Arnonem, lecz nie wszedł w granice Moabu, bo Arnon jest granicą Moabu."
  tags: []
"Sdz11,19":
  text: "Dlatego Izrael wyprawił posłańców do Sichona, króla Amorytów, króla w Cheszbonie, i Izrael powiedział mu: Pozwól nam, proszę, przejść przez twoją ziemię aż do mego miejsca."
  tags: []
"Sdz11,20":
  text: "Lecz Sichon nie dowierzał Izraelowi, że chce przejść przez jego granicę; przeciwnie, Sichon zebrał cały swój lud i rozbił obóz w Jahaza, i stoczył bitwę z Izraelem."
  tags: []
"Sdz11,21":
  text: "PAN, Bóg Izraela, wydał zaś Sichona i cały jego lud w ręce Izraela, który ich pobił. Izrael wziął więc w posiadanie całą ziemię Amorytów, którzy w niej mieszkali."
  tags: []
"Sdz11,22":
  text: "Tak wziął w posiadanie wszystkie granice Amorytów: od Arnon aż do Jabbok i od pustyni aż do Jordanu."
  tags: []
"Sdz11,23":
  text: "Teraz więc PAN, Bóg Izraela, wypędził Amorytów przed swym ludem Izraelem, a ty chcesz ją posiąść?"
  tags: []
"Sdz11,24":
  text: "Czyż nie weźmiesz w posiadanie tego, co daje ci posiąść Kemosz, twój bóg? Tak i my posiądziemy ziemię tego, kogo PAN, nasz Bóg, wygnał przed nami."
  tags: []
"Sdz11,25":
  text: "A teraz – czy jesteś lepszy od Balaka, syna Sippora, króla Moabu? Czy on się kiedyś spierał z Izraelem? Czy kiedyś z nim walczył?"
  tags: []
"Sdz11,26":
  text: "Oto przez trzysta lat Izrael mieszkał w Cheszbonie i w przyległych do niego wioskach, także w Aroerze i w przyległych do niego wioskach oraz we wszystkich miastach, które są przy granicy Arnonu. Dlaczego nie próbowaliście ich odzyskać przez ten czas?"
  tags: []
"Sdz11,27":
  text: "Nie ja zawiniłem tobie, ale ty wyrządzasz mi zło, że walczysz ze mną. Niech PAN, który jest Sędzią, rozsądzi dziś między synami Izraela a synami Ammona."
  tags: []
"Sdz11,28":
  text: "Lecz król synów Ammona nie posłuchał słów Jeftego, które mu przekazał."
  tags: []
"Sdz11,29":
  text: "Wtedy Duch PANA zstąpił na Jeftego, który przeszedł przez Gilead i Manassesa, przeszedł też przez Mispę w Gileadzie, a z Mispy w Gileadzie ciągnął przeciw synom Ammona."
  tags: []
"Sdz11,30":
  text: "Tam Jefte złożył PANU ślub, mówiąc: Jeśli naprawdę wydasz synów Ammona w moje ręce;"
  tags: []
"Sdz11,31":
  text: "Wtedy to, co wyjdzie z drzwi mego domu naprzeciw mnie, gdy wrócę w pokoju od synów Ammona, będzie należało do PANA albo ofiaruję to na całopalenie."
  tags: []
"Sdz11,32":
  text: "Wyruszył więc Jefte przeciwko synom Ammona, by walczyć z nimi, a PAN wydał ich w jego ręce."
  tags: []
"Sdz11,33":
  text: "I zadał im wielką klęskę od Aroeru aż do wejścia do Menit – w dwudziestu miastach – i aż do równiny winnic. Tak synowie Ammona zostali poniżeni przed synami Izraela."
  tags: []
"Sdz11,34":
  text: "A gdy Jefte wracał do Mispy, do swego domu, oto jego córka wyszła mu naprzeciw, z bębnami i muzyką. A była ona jedynaczką, bo nie miał żadnego syna ani innej córki."
  tags: []
"Sdz11,35":
  text: "I gdy ją zobaczył, rozdarł swoje szaty i powiedział: Ach, moja córko, bardzo mnie zasmuciłaś! I jesteś z tych, którzy mnie zasmucają, bo złożyłem ślub PANU i nie mogę tego cofnąć."
  tags: []
"Sdz11,36":
  text: "Ona mu odpowiedziała: Ojcze mój, jeśli złożyłeś ślub PANU, uczyń ze mną tak, jak wypowiedziały twoje usta; PAN bowiem dał ci pomstę na twoich wrogach, na synach Ammona."
  tags: []
"Sdz11,37":
  text: "Powiedziała też do swego ojca: Tylko uczyń dla mnie to jedno: wypuść mnie na dwa miesiące, bym mogła pójść i chodzić po górach, i opłakiwać moje dziewictwo, ja i moje towarzyszki."
  tags: []
"Sdz11,38":
  text: "A on powiedział: Idź. I wypuścił ją na dwa miesiące. Poszła więc wraz ze swoimi towarzyszkami i opłakiwała swoje dziewictwo w górach."
  tags: []
"Sdz11,39":
  text: "A gdy minęły dwa miesiące, wróciła do swego ojca i wypełnił on na niej swój ślub, który złożył, a ona nie obcowała z mężczyzną. I weszło to w zwyczaj w Izraelu;"
  tags: []
"Sdz11,40":
  text: "Że każdego roku schodziły się córki Izraela, aby przez cztery dni w roku rozmawiać z córką Jeftego Gileadczyka."
  tags: []
