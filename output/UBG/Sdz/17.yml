"Sdz17,1": "A był pewien człowiek z góry Efraim imieniem Micheasz."
"Sdz17,2": "Powiedział on do swojej matki: Te tysiąc sto srebrników, które ci ukradziono, z powodu których przeklinałaś i o których mówiłaś do moich uszu, otóż to srebro jest u mnie, ja je wziąłem. I jego matka powiedziała: Błogosławiony jesteś, mój synu, przez PANA."
"Sdz17,3": "I zwrócił swej matce owe tysiąc sto srebrników, po czym matka powiedziała: Poświęciłam to srebro PANU ze swojej ręki dla ciebie, mój synu, aby uczyniono z niego posąg ryty oraz posąg odlany, dlatego teraz oddaję ci je."
"Sdz17,4": "Lecz on zwrócił to srebro swojej matce. Wtedy jego matka wzięła dwieście srebrników, dała je złotnikowi, a on uczynił z nich posąg ryty oraz posąg odlany, które stały potem w domu Micheasza."
"Sdz17,5": "A Micheasz miał u siebie kaplicę bogów, sporządził też efod i terafim i poświęcił jednego ze swych synów, aby był jego kapłanem."
"Sdz17,6": "W tych dniach nie było króla w Izraelu, każdy czynił to, co było słuszne w jego oczach."
"Sdz17,7": "Był pewien młodzieniec z Betlejem judzkiego, z pokolenia Judy. Był on Lewitą i tam przebywał."
"Sdz17,8": "Ten człowiek wyruszył z miasta Betlejem judzkiego, aby zamieszkać, gdzie mu się trafi. Wędrując tak, przyszedł na górę Efraim aż do domu Micheasza."
"Sdz17,9": "Micheasz powiedział do niego: Skąd przychodzisz? I odpowiedział mu: Jestem Lewitą z Betlejem judzkiego, a idę, aby zamieszkać, gdzie mi się trafi."
"Sdz17,10": "I Micheasz powiedział mu: Zostań u mnie i bądź mi za ojca i za kapłana, a dam ci dziesięć srebrników rocznie, drugą szatę i wyżywienie. I Lewita poszedł za nim."
"Sdz17,11": "I spodobało się Lewicie mieszkać z tym człowiekiem; a ten młodzieniec stał się dla niego jakby jednym z jego synów."
"Sdz17,12": "Micheasz poświęcił Lewitę i młodzieniec ten został jego kapłanem, i mieszkał w domu Micheasza."
"Sdz17,13": "Wtedy Micheasz powiedział: Teraz wiem, że PAN będzie mnie błogosławił, gdyż mam Lewitę za kapłana."
