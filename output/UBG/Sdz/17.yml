"Sdz17,1":
  text: "A był pewien człowiek z góry Efraim imieniem Micheasz."
  tags: []
"Sdz17,2":
  text: "Powiedział on do swojej matki: Te tysiąc sto srebrników, które ci ukradziono, z powodu których przeklinałaś i o których mówiłaś do moich uszu, otóż to srebro jest u mnie, ja je wziąłem. I jego matka powiedziała: Błogosławiony jesteś, mój synu, przez PANA."
  tags: []
"Sdz17,3":
  text: "I zwrócił swej matce owe tysiąc sto srebrników, po czym matka powiedziała: Poświęciłam to srebro PANU ze swojej ręki dla ciebie, mój synu, aby uczyniono z niego posąg ryty oraz posąg odlany, dlatego teraz oddaję ci je."
  tags: []
"Sdz17,4":
  text: "Lecz on zwrócił to srebro swojej matce. Wtedy jego matka wzięła dwieście srebrników, dała je złotnikowi, a on uczynił z nich posąg ryty oraz posąg odlany, które stały potem w domu Micheasza."
  tags: []
"Sdz17,5":
  text: "A Micheasz miał u siebie kaplicę bogów, sporządził też efod i terafim i poświęcił jednego ze swych synów, aby był jego kapłanem."
  tags: []
"Sdz17,6":
  text: "W tych dniach nie było króla w Izraelu, każdy czynił to, co było słuszne w jego oczach."
  tags: []
"Sdz17,7":
  text: "Był pewien młodzieniec z Betlejem judzkiego, z pokolenia Judy. Był on Lewitą i tam przebywał."
  tags: []
"Sdz17,8":
  text: "Ten człowiek wyruszył z miasta Betlejem judzkiego, aby zamieszkać, gdzie mu się trafi. Wędrując tak, przyszedł na górę Efraim aż do domu Micheasza."
  tags: []
"Sdz17,9":
  text: "Micheasz powiedział do niego: Skąd przychodzisz? I odpowiedział mu: Jestem Lewitą z Betlejem judzkiego, a idę, aby zamieszkać, gdzie mi się trafi."
  tags: []
"Sdz17,10":
  text: "I Micheasz powiedział mu: Zostań u mnie i bądź mi za ojca i za kapłana, a dam ci dziesięć srebrników rocznie, drugą szatę i wyżywienie. I Lewita poszedł za nim."
  tags: []
"Sdz17,11":
  text: "I spodobało się Lewicie mieszkać z tym człowiekiem; a ten młodzieniec stał się dla niego jakby jednym z jego synów."
  tags: []
"Sdz17,12":
  text: "Micheasz poświęcił Lewitę i młodzieniec ten został jego kapłanem, i mieszkał w domu Micheasza."
  tags: []
"Sdz17,13":
  text: "Wtedy Micheasz powiedział: Teraz wiem, że PAN będzie mnie błogosławił, gdyż mam Lewitę za kapłana."
  tags: []
