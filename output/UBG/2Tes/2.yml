"2Tes2,1":
  text: "Prosimy was, bracia, przez wzgląd na przyjście naszego Pana Jezusa Chrystusa i nasze zgromadzenie się przy nim;"
  tags: []
"2Tes2,2":
  text: "Abyście nie tak łatwo dali się zachwiać w waszym umyśle i zatrwożyć się ani przez ducha, ani przez mowę, ani przez list rzekomo przez nas pisany, jakoby już nadchodził dzień Chrystusa."
  tags: []
"2Tes2,3":
  text: "Niech was nikt w żaden sposób nie zwodzi. Ten dzień bowiem nie nadejdzie, dopóki najpierw nie przyjdzie odstępstwo i nie objawi się człowiek grzechu, syn zatracenia;"
  tags: []
"2Tes2,4":
  text: "Który się sprzeciwia i wynosi ponad wszystko, co się nazywa Bogiem lub co jest przedmiotem czci, tak że zasiądzie w świątyni Boga jako Bóg, podając się za Boga."
  tags: []
"2Tes2,5":
  text: "Czy nie pamiętacie, że jeszcze będąc u was, mówiłem o tym?"
  tags: []
"2Tes2,6":
  text: "A teraz wiecie, co przeszkadza, tak że się objawi w swoim czasie."
  tags: []
"2Tes2,7":
  text: "Tajemnica nieprawości bowiem już działa. Tylko że ten, który teraz przeszkadza, będzie przeszkadzał, aż zostanie usunięty z drogi."
  tags: []
"2Tes2,8":
  text: "Wówczas pojawi się ów niegodziwiec, którego Pan zabije duchem swoich ust i zniszczy blaskiem swego przyjścia."
  tags: []
"2Tes2,9":
  text: "Niegodziwiec przyjdzie za sprawą szatana, z całą mocą, wśród znaków i fałszywych cudów;"
  tags: []
"2Tes2,10":
  text: "Wśród wszelkiego zwodzenia nieprawości wobec tych, którzy giną, ponieważ nie przyjęli miłości prawdy, by zostali zbawieni."
  tags: []
"2Tes2,11":
  text: "Dlatego Bóg zsyła im silne omamienie, tak że uwierzą kłamstwu;"
  tags: []
"2Tes2,12":
  text: "Aby zostali osądzeni wszyscy, którzy nie uwierzyli prawdzie, ale upodobali sobie niesprawiedliwość."
  tags: []
"2Tes2,13":
  text: "Lecz my nieustannie powinniśmy dziękować Bogu za was, bracia umiłowani przez Pana, że Bóg od początku wybrał was do zbawienia przez uświęcenie Ducha i wiarę w prawdę."
  tags: []
"2Tes2,14":
  text: "Do tego powołał was przez naszą ewangelię, abyście dostąpili chwały naszego Pana Jezusa Chrystusa."
  tags: []
"2Tes2,15":
  text: "Dlatego, bracia, stójcie niewzruszenie i trzymajcie się przekazanych nauk, o których zostaliście pouczeni czy to przez mowę, czy przez nasz list."
  tags: []
"2Tes2,16":
  text: "A sam nasz Pan Jezus Chrystus i Bóg, nasz Ojciec, który nas umiłował i dał wieczną pociechę i dobrą nadzieję przez łaskę;"
  tags: []
"2Tes2,17":
  text: "Niech pocieszy wasze serca i utwierdzi was w każdym dobrym słowie i uczynku."
  tags: []
