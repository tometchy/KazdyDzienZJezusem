"2Tes3,1": "Na koniec, bracia, módlcie się za nas, aby słowo Pana szerzyło się i rozsławiało jak i u was;"
"2Tes3,2": "I abyśmy byli wybawieni od przewrotnych i złych ludzi; nie wszyscy bowiem mają wiarę."
"2Tes3,3": "Lecz wierny jest Pan, który was utwierdzi i będzie strzec od złego."
"2Tes3,4": "Co do was, mamy ufność w Panu, że to, co nakazujemy, czynicie i będziecie czynić."
"2Tes3,5": "Pan zaś niech skieruje wasze serca ku miłości Bożej i ku cierpliwemu oczekiwaniu Chrystusa."
"2Tes3,6": "A nakazujemy wam, bracia, w imię naszego Pana Jezusa Chrystusa, abyście stronili od każdego brata, który postępuje nieporządnie, a nie według przekazanych nauk, które otrzymał od nas."
"2Tes3,7": "Sami bowiem wiecie, jak należy nas naśladować, ponieważ nie żyliśmy wśród was nieporządnie;"
"2Tes3,8": "Ani u nikogo nie jedliśmy chleba za darmo, ale pracowaliśmy w trudzie i zmęczeniu we dnie i w nocy, aby dla nikogo z was nie być ciężarem."
"2Tes3,9": "Nie jakobyśmy nie mieli do tego prawa, lecz żeby dać wam samych siebie za przykład do naśladowania."
"2Tes3,10": "Gdy bowiem byliśmy u was, to nakazaliśmy wam: Kto nie chce pracować, niech też nie je."
"2Tes3,11": "Bo słyszymy, że niektórzy wśród was postępują nieporządnie, wcale nie pracują, lecz zajmują się niepotrzebnymi rzeczami."
"2Tes3,12": "Dlatego nakazujemy im i napominamy przez naszego Pana Jezusa Chrystusa, aby spokojnie pracując, własny chleb jedli."
"2Tes3,13": "Wy zaś, bracia, nie bądźcie znużeni w czynieniu dobra."
"2Tes3,14": "Jeśli ktoś nie posłucha naszych słów zawartych w tym liście, to zwróćcie na niego uwagę i nie przestawajcie z nim, aby się zawstydził."
"2Tes3,15": "Nie uważajcie go jednak za nieprzyjaciela, lecz napominajcie jak brata."
"2Tes3,16": "A sam Pan pokoju niech was obdarza pokojem zawsze i na wszelki sposób. Pan niech będzie z wami wszystkimi."
"2Tes3,17": "Pozdrowienie moją, Pawła, ręką; jest ono znakiem w każdym liście; tak piszę."
"2Tes3,18": "Łaska naszego Pana Jezusa Chrystusa niech będzie z wami wszystkimi. Amen."
