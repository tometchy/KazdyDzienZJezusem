"2Tes3,1":
  text: "Na koniec, bracia, módlcie się za nas, aby słowo Pana szerzyło się i rozsławiało jak i u was;"
  tags: []
"2Tes3,2":
  text: "I abyśmy byli wybawieni od przewrotnych i złych ludzi; nie wszyscy bowiem mają wiarę."
  tags: []
"2Tes3,3":
  text: "Lecz wierny jest Pan, który was utwierdzi i będzie strzec od złego."
  tags: []
"2Tes3,4":
  text: "Co do was, mamy ufność w Panu, że to, co nakazujemy, czynicie i będziecie czynić."
  tags: []
"2Tes3,5":
  text: "Pan zaś niech skieruje wasze serca ku miłości Bożej i ku cierpliwemu oczekiwaniu Chrystusa."
  tags: []
"2Tes3,6":
  text: "A nakazujemy wam, bracia, w imię naszego Pana Jezusa Chrystusa, abyście stronili od każdego brata, który postępuje nieporządnie, a nie według przekazanych nauk, które otrzymał od nas."
  tags: []
"2Tes3,7":
  text: "Sami bowiem wiecie, jak należy nas naśladować, ponieważ nie żyliśmy wśród was nieporządnie;"
  tags: []
"2Tes3,8":
  text: "Ani u nikogo nie jedliśmy chleba za darmo, ale pracowaliśmy w trudzie i zmęczeniu we dnie i w nocy, aby dla nikogo z was nie być ciężarem."
  tags: []
"2Tes3,9":
  text: "Nie jakobyśmy nie mieli do tego prawa, lecz żeby dać wam samych siebie za przykład do naśladowania."
  tags: []
"2Tes3,10":
  text: "Gdy bowiem byliśmy u was, to nakazaliśmy wam: Kto nie chce pracować, niech też nie je."
  tags: []
"2Tes3,11":
  text: "Bo słyszymy, że niektórzy wśród was postępują nieporządnie, wcale nie pracują, lecz zajmują się niepotrzebnymi rzeczami."
  tags: []
"2Tes3,12":
  text: "Dlatego nakazujemy im i napominamy przez naszego Pana Jezusa Chrystusa, aby spokojnie pracując, własny chleb jedli."
  tags: []
"2Tes3,13":
  text: "Wy zaś, bracia, nie bądźcie znużeni w czynieniu dobra."
  tags: []
"2Tes3,14":
  text: "Jeśli ktoś nie posłucha naszych słów zawartych w tym liście, to zwróćcie na niego uwagę i nie przestawajcie z nim, aby się zawstydził."
  tags: []
"2Tes3,15":
  text: "Nie uważajcie go jednak za nieprzyjaciela, lecz napominajcie jak brata."
  tags: []
"2Tes3,16":
  text: "A sam Pan pokoju niech was obdarza pokojem zawsze i na wszelki sposób. Pan niech będzie z wami wszystkimi."
  tags: []
"2Tes3,17":
  text: "Pozdrowienie moją, Pawła, ręką; jest ono znakiem w każdym liście; tak piszę."
  tags: []
"2Tes3,18":
  text: "Łaska naszego Pana Jezusa Chrystusa niech będzie z wami wszystkimi. Amen."
  tags: []
