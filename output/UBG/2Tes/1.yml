"2Tes1,1":
  text: "Paweł, Sylwan i Tymoteusz do kościoła Tesaloniczan, który jest w Bogu, naszym Ojcu, i Panu Jezusie Chrystusie."
  tags: []
"2Tes1,2":
  text: "Łaska wam i pokój od Boga, naszego Ojca, i Pana Jezusa Chrystusa."
  tags: []
"2Tes1,3":
  text: "Bracia, powinniśmy zawsze dziękować Bogu za was, co jest rzeczą słuszną, bo bardzo wzrasta wasza wiara i u każdego z was pomnaża się wzajemna miłość;"
  tags: []
"2Tes1,4":
  text: "Tak że i my sami chlubimy się wami w kościołach Bożych z powodu waszej cierpliwości i wiary we wszystkich waszych prześladowaniach i uciskach, które znosicie."
  tags: []
"2Tes1,5":
  text: "Są one dowodem sprawiedliwego sądu Boga, abyście byli uznani za godnych królestwa Bożego, za które też cierpicie."
  tags: []
"2Tes1,6":
  text: "Ponieważ jest rzeczą sprawiedliwą u Boga, żeby odpłacić uciskiem tym, którzy was uciskają;"
  tags: []
"2Tes1,7":
  text: "A wam, uciśnionym, dać odpoczynek wraz z nami, gdy z nieba objawi się Pan Jezus z aniołami swojej mocy;"
  tags: []
"2Tes1,8":
  text: "W ogniu płomienistym wywierając zemstę na tych, którzy Boga nie znają i nie są posłuszni ewangelii naszego Pana Jezusa Chrystusa."
  tags: []
"2Tes1,9":
  text: "Poniosą oni karę, wieczne zatracenie od oblicza Pana i od chwały jego mocy;"
  tags: []
"2Tes1,10":
  text: "Gdy przyjdzie, aby był uwielbiony w swoich świętych i podziwiany w tym dniu przez wszystkich wierzących, ponieważ wśród was uwierzono naszemu świadectwu."
  tags: []
"2Tes1,11":
  text: "Dlatego też nieustannie modlimy się za was, aby nasz Bóg uznał was za godnych tego powołania i wypełnił wszelkie upodobanie swojej dobroci i dzieła wiary w mocy;"
  tags: []
"2Tes1,12":
  text: "Aby imię naszego Pana Jezusa Chrystusa zostało uwielbione w was, a wy w nim, według łaski naszego Boga i Pana Jezusa Chrystusa."
  tags: []
