"Dn12,1":
  text: "W tym czasie powstanie Michał, wielki książę, który wstawia się za synami twego ludu. Nastanie czas ucisku, jakiego nie było, odkąd narody zaczęły istnieć aż do tego czasu. W tym czasie twój lud zostanie wybawiony, każdy, kto znajdzie się zapisany w księdze."
  tags: []
"Dn12,2":
  text: "A wielu z tych, którzy śpią w prochu ziemi, obudzi się, jedni do życia wiecznego, a drudzy ku hańbie i wiecznej pogardzie."
  tags: []
"Dn12,3":
  text: "Ci, którzy są mądrzy, będą świecić jak blask firmamentu, a ci, którzy przyprowadzili wielu do sprawiedliwości – jak gwiazdy na wieki wieków."
  tags: []
"Dn12,4":
  text: "Ale ty Danielu zamknij te słowa i zapieczętuj tę księgę aż do czasu ostatecznego. Wielu będzie przebiegać, a pomnoży się wiedza."
  tags: []
"Dn12,5":
  text: "I ja, Daniel, spojrzałem, a oto stało dwóch innych, jeden na brzegu rzeki po tej stronie, a drugi na brzegu rzeki po tamtej stronie."
  tags: []
"Dn12,6":
  text: "Jeden powiedział do męża odzianego w lnianą szatę, który stał nad wodami rzeki: Kiedy będzie koniec tych dziwnych rzeczy?"
  tags: []
"Dn12,7":
  text: "I usłyszałem tego męża odzianego w lnianą szatę, który stał nad wodami rzeki. Podniósł swoją prawą i lewą rękę do nieba i przysiągł na Żyjącego na wieki, że będzie to na czas, czasy i połowę czasu. I gdy doszczętnie rozproszy siłę świętego ludu, wtedy to się wszystko wypełni."
  tags: []
"Dn12,8":
  text: "Ja to usłyszałem, ale nie zrozumiałem, więc zapytałem: Mój Panie, jaki będzie koniec tych rzeczy?"
  tags: []
"Dn12,9":
  text: "Wtedy odpowiedział: Idź, Danielu, bo te słowa są zamknięte i zapieczętowane aż do czasu ostatecznego."
  tags: []
"Dn12,10":
  text: "Wielu będzie oczyszczonych, wybielonych i doświadczonych, ale bezbożni będą postępować bezbożnie. Żaden bezbożny nie zrozumie, ale mądrzy zrozumieją."
  tags: []
"Dn12,11":
  text: "A od tego czasu, kiedy zostanie zniesiona ofiara codzienna i będzie postawiona obrzydliwość spustoszenia, upłynie tysiąc dwieście dziewięćdziesiąt dni."
  tags: []
"Dn12,12":
  text: "Błogosławiony, kto doczeka i dojdzie do tysiąca trzystu trzydziestu pięciu dni."
  tags: []
"Dn12,13":
  text: "Ale ty idź swoją drogą do końca. Odpoczniesz i pozostaniesz w swoim losie przy końcu dni."
  tags: []
