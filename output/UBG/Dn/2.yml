"Dn2,1":
  text: "W drugim roku panowania Nabuchodonozora miał Nabuchodonozor sen i strwożył się jego duch, i nie mógł spać."
  tags: []
"Dn2,2":
  text: "Wtedy król rozkazał zwołać magów, astrologów, czarowników i Chaldejczyków, aby opowiedzieli królowi jego sen. Przyszli więc i stanęli przed królem."
  tags: []
"Dn2,3":
  text: "Król powiedział do nich: Miałem sen i strwożył się mój duch, i chcę wiedzieć, co ten sen oznacza."
  tags: []
"Dn2,4":
  text: "Wtedy Chaldejczycy odpowiedzieli królowi po syryjsku: Królu, żyj na wieki! Opowiedz sen swoim sługom, a objaśnimy jego znaczenie."
  tags: []
"Dn2,5":
  text: "Król odpowiedział Chaldejczykom: Ta sprawa już uleciała mi z pamięci. Jeśli nie oznajmicie mi snu i jego znaczenia, będziecie rozsiekani na kawałki, a wasze domy będą zamienione w gnojowisko."
  tags: []
"Dn2,6":
  text: "Ale jeśli oznajmicie mi sen i jego znaczenie, otrzymacie ode mnie dary i nagrody oraz wielką cześć. Dlatego oznajmijcie mi sen i jego znaczenie."
  tags: []
"Dn2,7":
  text: "Odpowiedzieli powtórnie: Niech król opowie sen swoim sługom, a objaśnimy jego znaczenie."
  tags: []
"Dn2,8":
  text: "Król odpowiedział: Wiem na pewno, że celowo to odkładacie, gdyż wiecie, że ten sen uleciał mi z pamięci."
  tags: []
"Dn2,9":
  text: "Jeśli więc nie oznajmicie mi snu, jest dla was tylko jeden dekret. Postanowiliście bowiem mówić wobec mnie słowa kłamliwe i przewrotne, aż czas upłynie. Dlatego oznajmijcie mi sen, a przekonam się, że będziecie mogli objaśnić mi jego znaczenie."
  tags: []
"Dn2,10":
  text: "Chaldejczycy odpowiedzieli królowi: Nie ma człowieka na ziemi, który by mógł oznajmić tę rzecz królowi. Dlatego żaden król, książę albo władca nie wymaga takiej rzeczy od żadnego maga, astrologa lub Chaldejczyka."
  tags: []
"Dn2,11":
  text: "Rzecz, której król wymaga, jest trudna, a nie ma nikogo, kto by mógł ją oznajmić królowi, oprócz bogów, którzy nie mieszkają wśród ludzi."
  tags: []
"Dn2,12":
  text: "Z tej przyczyny król się rozzłościł i bardzo się rozgniewał, i rozkazał wytracić wszystkich mędrców Babilonu."
  tags: []
"Dn2,13":
  text: "A gdy wyszedł dekret, aby zgładzić mędrców, szukano także Daniela i jego towarzyszy, aby ich wymordować."
  tags: []
"Dn2,14":
  text: "Wtedy Daniel odpowiedział mądrze i roztropnie Ariochowi, dowódcy gwardii królewskiej, który wyszedł zabić mędrców Babilonu;"
  tags: []
"Dn2,15":
  text: "Powiedział do Ariocha, dowódcy króla: Czemu ten dekret tak szybko wyszedł od króla? Wtedy Arioch oznajmił Danielowi sprawę."
  tags: []
"Dn2,16":
  text: "Wszedł więc Daniel do króla i poprosił go, aby dał mu czas na oznajmienie królowi znaczenia snu."
  tags: []
"Dn2,17":
  text: "Potem Daniel poszedł do swego domu i opowiedział sprawę swoim towarzyszom: Chananiaszowi, Miszaelowi i Azariaszowi;"
  tags: []
"Dn2,18":
  text: "Aby prosili Boga nieba o miłosierdzie względem tej tajemnicy, żeby nie zginęli Daniel i jego towarzysze z resztą mędrców Babilonu."
  tags: []
"Dn2,19":
  text: "Wtedy Danielowi została objawiona ta tajemnica w nocnym widzeniu, za co Daniel błogosławił Bogu nieba."
  tags: []
"Dn2,20":
  text: "Daniel powiedział: Niech będzie błogosławione imię Boga na wieki wieków, bo mądrość i moc do niego należą;"
  tags: []
"Dn2,21":
  text: "On zmienia czasy i okresy, usuwa królów i ustanawia królów. Daje mądrość mądrym, a wiedzę rozumnym;"
  tags: []
"Dn2,22":
  text: "On objawia rzeczy głębokie i ukryte, wie, co jest w ciemności, a światłość z nim mieszka."
  tags: []
"Dn2,23":
  text: "Ciebie, Boże moich ojców, wysławiam i chwalę za to, że dałeś mi mądrość i moc, że oznajmiłeś mi teraz to, o co cię prosiliśmy. Oznajmiłeś nam bowiem sen króla."
  tags: []
"Dn2,24":
  text: "Dlatego Daniel wszedł do Ariocha, którego król ustanowił, aby wytracił mędrców Babilonu. Gdy przyszedł, tak powiedział do niego: Nie trać mędrców Babilonu. Wprowadź mnie do króla, a ja oznajmię królowi znaczenie snu."
  tags: []
"Dn2,25":
  text: "Wtedy Arioch z pośpiechem wprowadził Daniela do króla i tak mu powiedział: Znalazłem męża spośród uprowadzonych z Judy, który oznajmi królowi znaczenie snu."
  tags: []
"Dn2,26":
  text: "Król odpowiedział Danielowi, któremu na imię było Belteszassar: Czy potrafisz oznajmić mi sen, który miałem, oraz jego znaczenie?"
  tags: []
"Dn2,27":
  text: "Daniel odpowiedział królowi: Tajemnicy, o którą król pyta, nie mogą oznajmić królowi mędrcy, astrologowie, magowie i wróżbici;"
  tags: []
"Dn2,28":
  text: "Jest jednak Bóg w niebie, który objawia tajemnice, i on oznajmił królowi Nabuchodonozorowi, co nastąpi w ostatecznych dniach. Twój sen i widzenia w twojej głowie, które miałeś na swoim łożu, są takie;"
  tags: []
"Dn2,29":
  text: "Tobie, królu, przychodziły na twoim łożu myśli o tym, co ma nastąpić później. Ten zaś, który objawia tajemnice, oznajmił ci to, co nastąpi."
  tags: []
"Dn2,30":
  text: "I mnie została objawiona tajemnica, nie za jakąś mądrość, jakbym miał jej więcej niż wszyscy żyjący, ale przez modlitwę, aby znaczenie snu było oznajmione królowi i abyś poznał myśli swego serca."
  tags: []
"Dn2,31":
  text: "Ty, królu, miałeś takie widzenie: Oto posąg wielki; ten wielki posąg o nadzwyczajnym blasku stał przed tobą, a jego wygląd był straszny."
  tags: []
"Dn2,32":
  text: "Głowa tego posągu wykonana była z czystego złota, jego piersi i ramiona – ze srebra, jego brzuch i biodra – z brązu;"
  tags: []
"Dn2,33":
  text: "Jego golenie – z żelaza, jego stopy – częściowo z żelaza, częściowo z gliny."
  tags: []
"Dn2,34":
  text: "Patrzyłeś na to, aż został odcięty kamień bez pomocy rąk, i uderzył posąg w jego stopy z żelaza i gliny, i skruszył je."
  tags: []
"Dn2,35":
  text: "Wtedy zostały skruszone razem: żelazo, glina, brąz, srebro i złoto i stały się jak plewy na klepisku w lecie; i wiatr niósł je tak, że nie znaleziono ich w żadnym miejscu. Kamień zaś, który uderzył w posąg, stał się wielką górą i napełnił całą ziemię."
  tags: []
"Dn2,36":
  text: "Taki jest sen. Jego znaczenie też wypowiemy przed królem;"
  tags: []
"Dn2,37":
  text: "Ty, królu, jesteś królem królów, bo tobie Bóg nieba dał królestwo, moc, potęgę i sławę."
  tags: []
"Dn2,38":
  text: "I dał w twoją rękę wszystko to, gdzie mieszkają synowie ludzi, zwierzęta polne i ptactwo niebieskie, i ustanowił cię panem nad tym wszystkim. Ty jesteś tą głową ze złota."
  tags: []
"Dn2,39":
  text: "Ale po tobie powstanie inne królestwo, mniejsze od twojego, a potem trzecie królestwo z brązu, które będzie panować nad całą ziemią."
  tags: []
"Dn2,40":
  text: "Czwarte królestwo będzie mocne jak żelazo, bo jak żelazo kruszy i miażdży wszystko, jak żelazo łamie wszystko, tak i ono połamie i pokruszy wszystko."
  tags: []
"Dn2,41":
  text: "A że widziałeś stopy i palce częściowo z gliny garncarskiej, a częściowo z żelaza – oznacza to, że królestwo będzie podzielone. Będzie w nim nieco siły żelaza, tak jak widziałeś żelazo zmieszane z mulistą gliną;"
  tags: []
"Dn2,42":
  text: "A palce stóp częściowo z żelaza a częściowo z gliny znaczą, że królestwo będzie częściowo silne, a częściowo kruche."
  tags: []
"Dn2,43":
  text: "A że widziałeś żelazo zmieszane z mulistą gliną, oznacza to, że się zmieszają ze sobą ludzie, ale nie będzie się trzymał jeden drugiego, tak jak żelaza nie można zmieszać z gliną."
  tags: []
"Dn2,44":
  text: "Ale w dniach tych królów Bóg nieba wzbudzi królestwo, które nigdy nie będzie zniszczone. To królestwo nie przejdzie na inny lud, ale połamie i zniszczy wszystkie te królestwa, samo zaś będzie trwać na wieki."
  tags: []
"Dn2,45":
  text: "To, że widziałeś, jak kamień został odcięty z góry bez pomocy rąk i skruszył żelazo, brąz, glinę, srebro i złoto, oznacza, że wielki Bóg oznajmił królowi, co nastąpi potem. Sen jest prawdziwy i jego znaczenie pewne."
  tags: []
"Dn2,46":
  text: "Wtedy król Nabuchodonozor padł na twarz, oddał pokłon Danielowi i rozkazał, aby złożono mu ofiarę i kadzidło."
  tags: []
"Dn2,47":
  text: "Następnie król zwrócił się do Daniela i powiedział: Zaprawdę wasz Bóg jest Bogiem bogów i Panem królów, który objawia tajemnice, ponieważ zdołałeś objawić tę tajemnicę."
  tags: []
"Dn2,48":
  text: "Potem król wywyższył Daniela i dał mu wiele wielkich darów, i uczynił go panem nad całą prowincją Babilonu i głównym przełożonym nad wszystkimi mędrcami Babilonu."
  tags: []
"Dn2,49":
  text: "Ale Daniel wyprosił od króla, aby ustanowił nad sprawami prowincji Babilonu Szadraka, Meszaka i Abed-Nego; Daniel zaś pozostał w bramie króla."
  tags: []
