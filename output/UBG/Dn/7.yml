"Dn7,1":
  text: "W pierwszym roku Belszazara, króla Babilonu, Daniel miał sen i widzenia w swojej głowie na swoim łożu. Wtedy spisał ten sen i podał ogół rzeczy."
  tags: []
"Dn7,2":
  text: "Daniel powiedział: Oto co zobaczyłem w swoim widzeniu w nocy: Oto cztery wiatry niebieskie potykały się na wielkim morzu."
  tags: []
"Dn7,3":
  text: "A cztery wielkie bestie wyszły z morza, jedna różniła się od drugiej."
  tags: []
"Dn7,4":
  text: "Pierwsza była podobna do lwa i miała orle skrzydła. Przypatrywałem się jej, aż jej skrzydła zostały wyrwane i podniosła się z ziemi tak, że stanęła na nogach jak człowiek, a dano jej serce ludzkie."
  tags: []
"Dn7,5":
  text: "Potem oto druga bestia, podobna do niedźwiedzia. I stanęła na jednym boku, mając trzy żebra w paszczy między zębami. I tak mówiono do niej: Wstań, pożeraj dużo mięsa."
  tags: []
"Dn7,6":
  text: "Potem spojrzałem, a oto inna bestia, podobna do pantery, która miała cztery ptasie skrzydła na grzbiecie. Bestia miała także cztery głowy i dano jej władzę."
  tags: []
"Dn7,7":
  text: "Potem widziałem w nocnych widzeniach: Oto czwarta bestia, straszna, przerażająca i bardzo silna, mająca wielkie żelazne zęby. Pożerała i miażdżyła, a resztę deptała swoimi nogami. Różniła się od wszystkich bestii, które były przed nią, i miała dziesięć rogów."
  tags: []
"Dn7,8":
  text: "Uważnie przypatrywałem się rogom, a oto mały róg wyrósł między nimi i trzy spośród tych pierwszych rogów zostały wyrwane przed nim. A oto w tym rogu były oczy podobne do oczu ludzkich i usta mówiące wielkie rzeczy."
  tags: []
"Dn7,9":
  text: "I patrzyłem, aż trony zostały postawione, a Odwieczny zasiadł; jego szata była biała jak śnieg, a włosy jego głowy jak czysta wełna, jego tron jak ogniste płomienie, a jego koła jak płonący ogień."
  tags: []
"Dn7,10":
  text: "Strumień ognia wypływał i tryskał sprzed niego. Tysiąc tysięcy służyło mu, a dziesięć tysięcy po dziesięć tysięcy stało przed nim. Sąd zasiadł i otwarto księgi."
  tags: []
"Dn7,11":
  text: "Wtedy patrzyłem z powodu głosu wielkich słów, które wypowiedział róg. Przypatrywałem się, aż bestia została zabita, a jej ciało zniszczone i wydane na spalenie w ogniu."
  tags: []
"Dn7,12":
  text: "Także i pozostałym bestiom odebrano władzę i dano im przedłużenie życia aż do zamierzonego okresu i czasu."
  tags: []
"Dn7,13":
  text: "Widziałem też w nocnym widzeniu: Oto w obłokach nieba przybył ktoś podobny do Syna Człowieka, przyszedł aż do Odwiecznego i przyprowadzono go przed niego."
  tags: []
"Dn7,14":
  text: "I dano mu władzę, cześć i królestwo, aby wszyscy ludzie, wszystkie narody i języki służyli mu. Jego władza jest władzą wieczną, która nie przeminie, a jego królestwo nie będzie zniszczone."
  tags: []
"Dn7,15":
  text: "I ja, Daniel, zatrwożyłem się w duchu, w środku mego ciała, a widzenia w mojej głowie przestraszyły mnie."
  tags: []
"Dn7,16":
  text: "Wtedy zbliżyłem się do jednego z tych, którzy tam stali, i pytałem go o prawdziwość tego wszystkiego. I powiedział mi, i oznajmił mi znaczenie tych rzeczy."
  tags: []
"Dn7,17":
  text: "Te wielkie bestie, w liczbie czterech, to czterej królowie, którzy powstaną z ziemi."
  tags: []
"Dn7,18":
  text: "Ale święci Najwyższego wezmą królestwo i posiądą je na wieki, aż na wieki wieków."
  tags: []
"Dn7,19":
  text: "Wtedy pragnąłem poznać prawdę o czwartej bestii, która różniła się od wszystkich innych, straszna nad miarę, której zęby były żelazne, a pazury z brązu; która pożerała i miażdżyła, a resztę deptała swoimi nogami;"
  tags: []
"Dn7,20":
  text: "Także o tych dziesięciu rogach, które były na jej głowie, i o innym, który wyrósł, przed którym upadły trzy, o tym właśnie rogu, który miał oczy i usta mówiące wielkie rzeczy, a wyglądał na większy od innych rogów."
  tags: []
"Dn7,21":
  text: "I przypatrywałem się, a oto ten róg walczył ze świętymi i przemagał ich;"
  tags: []
"Dn7,22":
  text: "Aż przyszedł Odwieczny i oddano sąd świętym Najwyższego; i nadszedł czas, aby święci otrzymali królestwo."
  tags: []
"Dn7,23":
  text: "I powiedział tak: Czwarta bestia oznacza czwarte królestwo na ziemi, które będzie różniło się od wszystkich królestw, i pożre całą ziemię, podepcze i zmiażdży ją."
  tags: []
"Dn7,24":
  text: "A dziesięć rogów oznacza, że z tego królestwa powstanie dziesięciu królów, a po nich powstanie inny, który będzie różnił się od pierwszych i poniży trzech królów;"
  tags: []
"Dn7,25":
  text: "Będzie mówił słowa przeciw Najwyższemu i wytracał świętych Najwyższego; będzie zamierzał zmienić czasy i prawa, gdyż będą wydane w jego ręce aż do czasu, czasów i połowy czasu."
  tags: []
"Dn7,26":
  text: "Potem zasiądzie sąd i tam odbiorą mu władzę, aby została zniszczona i wytracona aż do końca."
  tags: []
"Dn7,27":
  text: "A królestwo, władza i wielkość królestwa pod całym niebem zostaną oddane ludowi świętych Najwyższego, którego królestwo będzie królestwem wiecznym, a wszystkie zwierzchności będą mu służyć i jego słuchać."
  tags: []
"Dn7,28":
  text: "Tutaj jest koniec tych słów. A mnie Daniela bardzo zatrwożyły moje myśli i moje oblicze zmieniło się. Zachowałem jednak tę sprawę w swoim sercu."
  tags: []
