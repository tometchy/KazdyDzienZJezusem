"Dn10,1":
  text: "W trzecim roku Cyrusa, króla Persji, zostało objawione słowo Danielowi, któremu nadano imię Belteszassar; to słowo było prawdziwe i zamierzony czas był długi. Zrozumiał to słowo, bo otrzymał zrozumienie w widzeniu."
  tags: []
"Dn10,2":
  text: "W tych dniach ja, Daniel, byłem smutny przez trzy tygodnie."
  tags: []
"Dn10,3":
  text: "Nie jadłem smacznego chleba, mięsa i wina nie brałem do ust, i nie namaszczałem się olejkiem, aż się wypełniły trzy tygodnie."
  tags: []
"Dn10,4":
  text: "A dwudziestego czwartego dnia pierwszego miesiąca byłem nad brzegiem wielkiej rzeki, to jest Chiddekel;"
  tags: []
"Dn10,5":
  text: "I podniosłem swoje oczy, i spojrzałem, a oto stał pewien mąż ubrany w lnianą szatę, a jego biodra były przepasane czystym złotem z Ufas;"
  tags: []
"Dn10,6":
  text: "Jego ciało było jak z berylu, jego oblicze z wyglądu jak błyskawica, jego oczy – jak pochodnie ogniste, jego ramiona i nogi – jak blask wypolerowanej miedzi, a dźwięk jego słów – jak głos tłumu."
  tags: []
"Dn10,7":
  text: "Tylko ja sam, Daniel, miałem to widzenie. Mężczyźni, którzy byli ze mną, nie mieli tego widzenia; ale wielki strach padł na nich i pouciekali, aby się ukryć."
  tags: []
"Dn10,8":
  text: "A ja sam zostałem i miałem to wielkie widzenie, ale nie pozostało we mnie siły. Moja uroda zmieniła się i zepsuła, i nie miałem żadnej siły."
  tags: []
"Dn10,9":
  text: "Wtedy usłyszałem dźwięk jego słów; a gdy usłyszałem dźwięk jego słów, upadłem na twarz w głęboki sen, twarzą ku ziemi."
  tags: []
"Dn10,10":
  text: "I oto dotknęła mnie ręka, i podniosła mnie na moje kolana i na dłonie moich rąk."
  tags: []
"Dn10,11":
  text: "I powiedział do mnie: Danielu, mężu bardzo umiłowany, uważaj na moje słowa, które mówię do ciebie, i stań na nogi, bo jestem teraz posłany do ciebie. A gdy przemówił do mnie to słowo, stanąłem drżąc."
  tags: []
"Dn10,12":
  text: "Wtedy powiedział do mnie: Nie bój się, Danielu, bo od pierwszego dnia, gdy wziąłeś sobie do serca to, aby zrozumieć i ukorzyć się przed swoim Bogiem, twoje słowa zostały wysłuchane, a ja przybyłem ze względu na twoje słowa."
  tags: []
"Dn10,13":
  text: "Lecz książę królestwa Persji sprzeciwiał mi się przez dwadzieścia jeden dni, ale oto Michał, jeden z przedniejszych książąt, przyszedł mi z pomocą; a ja zostałem tam przy królach Persji."
  tags: []
"Dn10,14":
  text: "Ale przybyłem, aby ci oznajmić, co spotka twój lud w dniach ostatecznych, bo to widzenie będzie jeszcze na te dni."
  tags: []
"Dn10,15":
  text: "A gdy mówił do mnie tymi słowy, opuściłem twarz ku ziemi i zamilkłem."
  tags: []
"Dn10,16":
  text: "A oto ktoś jakby podobny do synów ludzkich dotknął moich warg. Otworzyłem usta i mówiłem, powiedziałem do stojącego przede mną: Mój panie, z powodu tego widzenia dopadły mnie boleści i nie mam żadnej siły."
  tags: []
"Dn10,17":
  text: "A jakże będzie mógł taki sługa mego pana rozmawiać w ten sposób z moim panem? Gdyż od tego czasu nie została we mnie siła i nie ma we mnie tchu."
  tags: []
"Dn10,18":
  text: "Wtedy ponownie dotknął mnie ten, który był podobny do człowieka, i wzmocnił mnie;"
  tags: []
"Dn10,19":
  text: "I powiedział: Nie bój się, mężu bardzo umiłowany, pokój tobie! Wzmocnij się, mówię, wzmocnij się. A gdy mówił do mnie, nabrałem siły i powiedziałem: Niech mój pan mówi, bo mnie wzmocniłeś."
  tags: []
"Dn10,20":
  text: "Powiedział: Czy wiesz, dlaczego przybyłem do ciebie? Teraz wrócę, aby walczyć z księciem Persji. A gdy odejdę stamtąd, oto nadejdzie książę Grecji."
  tags: []
"Dn10,21":
  text: "Ale oznajmię ci to, co jest zapisane w piśmie prawdy. I nie ma nikogo, który by mężnie stał przy mnie w tych sprawach, oprócz Michała, waszego księcia."
  tags: []
