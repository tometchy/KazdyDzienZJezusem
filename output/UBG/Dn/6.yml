"Dn6,1":
  text: "Dariuszowi spodobało się ustanowić nad królestwem stu dwudziestu satrapów, którzy byliby po całym królestwie;"
  tags: []
"Dn6,2":
  text: "A nad nimi trzech zwierzchników, z których Daniel był pierwszym. Im zdawali sprawozdanie satrapowie, aby król nie doznał żadnej szkody."
  tags: []
"Dn6,3":
  text: "A sam Daniel przewyższał tych książąt i satrapów, ponieważ był w nim nadzwyczajny duch, i król zamierzał ustanowić go nad całym królestwem."
  tags: []
"Dn6,4":
  text: "Wtedy zwierzchnicy i satrapowie usiłowali znaleźć przeciwko Danielowi powód oskarżenia dotyczący królestwa; nie mogli jednak znaleźć żadnego pretekstu ani wady, ponieważ był on wierny i żadnej winy ani wady nie można było w nim znaleźć."
  tags: []
"Dn6,5":
  text: "Dlatego ci mężczyźni powiedzieli: Nie znajdziemy przeciwko temu Danielowi żadnego powodu do oskarżenia, chyba że znajdziemy coś przeciwko niemu w prawie jego Boga."
  tags: []
"Dn6,6":
  text: "Wtedy ci zwierzchnicy i satrapowie zgromadzili się przy królu i tak mu powiedzieli: Królu Dariuszu, żyj na wieki!"
  tags: []
"Dn6,7":
  text: "Wszyscy zwierzchnicy królestwa, przełożeni i satrapowie, urzędnicy i dowódcy uzgodnili, aby ustanowić dekret królewski i zatwierdzić prawo, że ktokolwiek w ciągu trzydziestu dni poprosi o cokolwiek któregokolwiek boga lub człowieka prócz ciebie, królu, zostanie wrzucony do lwiej jamy."
  tags: []
"Dn6,8":
  text: "I tak teraz, królu, zatwierdź to prawo i podaj je na piśmie, aby było nieodwołalne według prawa Medów i Persów, które nie może być cofnięte."
  tags: []
"Dn6,9":
  text: "Król Dariusz ogłosił więc na piśmie to prawo."
  tags: []
"Dn6,10":
  text: "A gdy Daniel dowiedział się, że zostało podane na piśmie, wszedł do swego domu; a otwierając okna w swoim pokoju w stronę Jerozolimy, trzy razy dziennie klękał na kolanach, modlił się i chwalił swego Boga, jak to czynił przedtem."
  tags: []
"Dn6,11":
  text: "Wtedy ci mężczyźni zgromadzili się i kiedy znaleźli Daniela modlącego się i błagającego swego Boga;"
  tags: []
"Dn6,12":
  text: "Przyszli i powiedzieli królowi o dekrecie królewskim: Czy nie wydałeś dekretu, że każdy człowiek, który w ciągu trzydziestu dni poprosi o cokolwiek któregokolwiek boga lub człowieka prócz ciebie, królu, zostanie wrzucony do lwiej jamy? Król odpowiedział: Prawdziwa to jest mowa, zgodnie z prawem Medów i Persów, które nie może być cofnięte."
  tags: []
"Dn6,13":
  text: "Wtedy odezwali się i powiedzieli do króla: Ten Daniel, który jest z uprowadzonych synów Judy, nie liczy się z tobą, królu, ani z twoim dekretem, który wydałeś, bo trzy razy dziennie odmawia swoją modlitwę."
  tags: []
"Dn6,14":
  text: "Gdy król usłyszał te słowa, bardzo się zasmucił z tego powodu i postanowił wybawić Daniela; aż do zachodu słońca usiłował go uratować."
  tags: []
"Dn6,15":
  text: "Ale ci mężczyźni zgromadzili się przy królu i powiedzieli do niego: Wiedz, królu, że prawo u Medów i Persów jest takie, że żadne prawo ani żaden dekret, który król ustanowił, nie może być zmieniony."
  tags: []
"Dn6,16":
  text: "Wtedy król rozkazał, aby przyprowadzono Daniela i wrzucono go do lwiej jamy. A król powiedział do Daniela: Twój Bóg, któremu nieustannie służysz, on wybawi cię."
  tags: []
"Dn6,17":
  text: "I przyniesiono kamień, i położono go na otworze jamy, a król opieczętował go swoim sygnetem i sygnetami swoich książąt, aby dekret wydany przeciwko Danielowi nie był zmieniony."
  tags: []
"Dn6,18":
  text: "Następnie król poszedł do swego pałacu i pościł przez całą noc. Nie dopuścił do siebie niczego, co mogłoby go weselić, i sen odszedł od niego."
  tags: []
"Dn6,19":
  text: "Potem król wstał bardzo wcześnie, o świcie, i spiesznie poszedł do lwiej jamy."
  tags: []
"Dn6,20":
  text: "A gdy się zbliżył do jamy, zawołał do Daniela żałosnym głosem. Król zapytał Daniela: Danielu, sługo Boga żywego, czy twój Bóg, któremu nieustannie służysz, mógł cię wybawić od lwów?"
  tags: []
"Dn6,21":
  text: "Wtedy Daniel odpowiedział królowi: Królu, żyj na wieki!"
  tags: []
"Dn6,22":
  text: "Mój Bóg posłał swego Anioła, który zamknął paszcze lwom, aby mi nie wyrządziły żadnej szkody, dlatego że przed nim znalazła się we mnie niewinność. Owszem, również przed tobą, królu, nic złego nie uczyniłem."
  tags: []
"Dn6,23":
  text: "Wtedy król bardzo się ucieszył z tego i rozkazał wyciągnąć Daniela z jamy. I wyciągnięto Daniela z jamy i nie znaleziono na nim żadnej rany, bo wierzył w swojego Boga."
  tags: []
"Dn6,24":
  text: "I król rozkazał przyprowadzić tych mężczyzn, którzy oskarżyli Daniela, i wrzucono ich do lwiej jamy, ich samych, ich synów i ich żony. A zanim wpadli na dno jamy, lwy ich pochwyciły i zmiażdżyły wszystkie ich kości."
  tags: []
"Dn6,25":
  text: "Wtedy król Dariusz napisał do wszystkich ludzi, narodów i języków, którzy mieszkali po całej ziemi: Niech pokój wam się rozmnoży!"
  tags: []
"Dn6,26":
  text: "Wydaję dekret, aby w całym państwie mego królestwa wszyscy drżeli i bali się Boga Daniela, bo on jest Bogiem żywym i trwa na wieki, a jego królestwo nie będzie zniszczone i jego władza będzie trwać do końca."
  tags: []
"Dn6,27":
  text: "On wyrywa i wybawia, czyni znaki i cuda na niebie i na ziemi; on wyrwał Daniela z mocy lwów."
  tags: []
"Dn6,28":
  text: "A Danielowi dobrze się powodziło w królestwie Dariusza i w królestwie Cyrusa Persa."
  tags: []
