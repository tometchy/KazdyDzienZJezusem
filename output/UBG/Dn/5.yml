"Dn5,1":
  text: "Król Belszazar urządził wielką ucztę dla tysiąca swoich książąt i przed tym tysiącem pił wino."
  tags: []
"Dn5,2":
  text: "A gdy Belszazar pił wino, rozkazał przynieść złote i srebrne naczynia, które jego ojciec, Nabuchodonozor, zabrał ze świątyni w Jerozolimie, aby pili z nich król, jego książęta, jego żony i jego nałożnice."
  tags: []
"Dn5,3":
  text: "Wtedy przyniesiono złote naczynia, które zabrano ze świątyni domu Bożego, który był w Jerozolimie, i pili z nich król, jego książęta, jego żony i jego nałożnice."
  tags: []
"Dn5,4":
  text: "Pili wino i chwalili bogów ze złota i srebra, z brązu i żelaza, z drewna i kamienia."
  tags: []
"Dn5,5":
  text: "W tej samej godzinie ukazały się palce ręki ludzkiej, które pisały naprzeciw świecznika na wapnie ściany pałacu króla, a król widział część ręki, która pisała."
  tags: []
"Dn5,6":
  text: "Wtedy oblicze króla zmieniło się, jego myśli zatrwożyły go, stawy jego bioder rozluźniły się i jego kolana uderzały jedno o drugie."
  tags: []
"Dn5,7":
  text: "I zawołał król ze wszystkich sił, aby przyprowadzono astrologów, Chaldejczyków i wróżbitów. Król powiedział do mędrców Babilonu: Ktokolwiek to pismo odczyta i oznajmi mi jego znaczenie, będzie odziany w purpurę, dadzą mu złoty łańcuch na szyję i będzie panował w królestwie jako trzeci."
  tags: []
"Dn5,8":
  text: "Weszli więc wszyscy mędrcy króla, ale nie mogli odczytać pisma ani oznajmić królowi jego znaczenia."
  tags: []
"Dn5,9":
  text: "Wtedy król Belszazar bardzo się zatrwożył i jego oblicze się zmieniło, a jego książęta struchleli."
  tags: []
"Dn5,10":
  text: "Wówczas królowa weszła do domu uczty z powodu słów króla i jego książąt. Odezwała się królowa i powiedziała: Królu, żyj na wieki! Niech cię nie trwożą twoje myśli i niech się nie zmienia twoje oblicze."
  tags: []
"Dn5,11":
  text: "Jest w twoim królestwie mężczyzna, w którym jest duch świętych bogów, w którym za dni twego ojca znalazły się światło, rozum i mądrość podobna do mądrości bogów i którego król Nabuchodonozor, twój ojciec, mówię ci, twój ojciec, król, ustanowił przełożonym magów, astrologów, Chaldejczyków i wróżbitów;"
  tags: []
"Dn5,12":
  text: "Dlatego że znalazły się w nim nadzwyczajny duch, wiedza, rozum, wykładanie snów, objawianie zagadek i rozwiązywanie rzeczy trudnych, w Danielu, któremu król nadał imię Belteszassar. Niech więc teraz wezwą Daniela, a on oznajmi znaczenie pisma."
  tags: []
"Dn5,13":
  text: "Wtedy Daniel został przyprowadzony do króla. A król zapytał Daniela: Czy ty jesteś tym Danielem z synów uprowadzonych z Judy, którego król, mój ojciec, sprowadził z ziemi Judy?"
  tags: []
"Dn5,14":
  text: "Słyszałem o tobie, że duch bogów jest w tobie, że światło, rozum i obfita mądrość znajdują się w tobie."
  tags: []
"Dn5,15":
  text: "Właśnie przyprowadzono przede mnie mędrców i astrologów, aby mi to pismo odczytali i oznajmili jego znaczenie. Oni jednak nie potrafili tego zrobić."
  tags: []
"Dn5,16":
  text: "A słyszałem o tobie, że możesz dawać wyjaśnienie i rozwiązywać trudności. Jeśli więc teraz możesz to pismo odczytać i oznajmić mi jego znaczenie, będziesz odziany w purpurę, będzie włożony złoty łańcuch na twoją szyję i będziesz panował w królestwie jako trzeci."
  tags: []
"Dn5,17":
  text: "Wtedy Daniel odpowiedział przed królem: Twoje upominki niech pozostaną przy tobie, a twoje dary daj innemu; pismo jednak odczytam królowi i oznajmię mu znaczenie."
  tags: []
"Dn5,18":
  text: "Ty, królu, posłuchaj. Bóg Najwyższy dał Nabuchodonozorowi, twemu ojcu, królestwo, majestat, sławę i cześć;"
  tags: []
"Dn5,19":
  text: "A z powodu wielkości, którą mu dał, wszyscy ludzie, narody i języki drżały przed nim i bały się go. Kogo chciał, zabijał, a kogo chciał, zostawiał przy życiu, kogo chciał, wywyższał, a kogo chciał, poniżał."
  tags: []
"Dn5,20":
  text: "Ale gdy jego serce stało się wyniosłe i jego duch utwierdził się w pysze, został strącony z tronu swego królestwa i odebrano mu sławę;"
  tags: []
"Dn5,21":
  text: "Został wypędzony spośród synów ludzkich, jego serce stało się podobne do serca zwierzęcia i mieszkał z dzikimi osłami. Żywili go trawą jak woły i jego ciało było skrapiane rosą z nieba, aż poznał, że Bóg Najwyższy ma władzę nad królestwem ludzkim i ustanawia nad nim, kogo chce."
  tags: []
"Dn5,22":
  text: "Ty, też, Belszazarze, jego synu, nie ukorzyłeś swego serca, chociaż o tym wszystkim wiedziałeś."
  tags: []
"Dn5,23":
  text: "Lecz uniosłeś się przeciwko Panu nieba i naczynia jego domu przyniesiono przed ciebie, a ty, twoi książęta, twoje żony i twoje nałożnice piliście wino z nich. Ponadto chwaliłeś bogów ze srebra, złota, brązu, żelaza, drewna i kamienia, które nie widzą ani nie słyszą i nic nie wiedzą. Bogu zaś, w którego ręku jest twoje tchnienie i u którego są wszystkie twoje drogi, nie oddałeś czci."
  tags: []
"Dn5,24":
  text: "Dlatego przez niego została posłana część ręki i pismo to zostało napisane."
  tags: []
"Dn5,25":
  text: "A to jest pismo, które zostało napisane: Mene, Mene, Tekel, Uparsin."
  tags: []
"Dn5,26":
  text: "Takie jest znaczenie tych słów: Mene: Bóg policzył twoje królestwo i doprowadził je do końca."
  tags: []
"Dn5,27":
  text: "Tekel: Zważono cię na wadze i okazałeś się lekki."
  tags: []
"Dn5,28":
  text: "Peres: Twoje królestwo zostało podzielone i oddane Medom i Persom."
  tags: []
"Dn5,29":
  text: "Wtedy Belszazar wydał rozkaz i odziano Daniela w purpurę, złoty łańcuch włożono mu na szyję i ogłoszono o nim, że będzie panował jako trzeci w królestwie."
  tags: []
"Dn5,30":
  text: "Tej samej nocy Belszazar, król Chaldejczyków, został zabity."
  tags: []
"Dn5,31":
  text: "A Dariusz, Med, przejął królestwo, mając około sześćdziesięciu dwóch lat."
  tags: []
