"Dn4,1":
  text: "Król Nabuchodonozor do wszystkich ludzi, narodów i języków, którzy mieszkają w całej ziemi: Niech pokój się wam rozmnoży!"
  tags: []
"Dn4,2":
  text: "Uważałem za stosowne opowiedzieć o znakach i cudach, które uczynił dla mnie Bóg Najwyższy."
  tags: []
"Dn4,3":
  text: "Jakże wielkie są jego znaki i jak potężne jego cuda! Jego królestwo jest królestwem wiecznym i jego władza trwa z pokolenia na pokolenie."
  tags: []
"Dn4,4":
  text: "Ja, Nabuchodonozor, żyłem spokojnie w swoim domu i rozkwitałem w swoim pałacu."
  tags: []
"Dn4,5":
  text: "Miałem sen, który mnie przestraszył, a myśli, które miałem na swoim łożu, oraz widzenia w mojej głowie zatrwożyły mnie."
  tags: []
"Dn4,6":
  text: "Wydałem więc dekret, aby przyprowadzano przede mnie wszystkich mędrców Babilonu, żeby oznajmili mi znaczenie tego snu."
  tags: []
"Dn4,7":
  text: "Wtedy przyszli magowie, astrologowie, Chaldejczycy i wróżbici; i opowiedziałem im sen, ale nie potrafili mi oznajmić jego znaczenia;"
  tags: []
"Dn4,8":
  text: "Aż w końcu przyszedł przede mnie Daniel, którego imię brzmi Belteszassar, zgodnie z imieniem mojego boga, a w którym jest duch świętych bogów, i przed nim opowiedziałem sen;"
  tags: []
"Dn4,9":
  text: "Belteszassarze, przełożony magów, wiem, że duch świętych bogów jest w tobie i że żadna tajemnica nie jest dla ciebie trudna. Posłuchaj widzenia z mojego snu, który miałem, i powiedz mi jego znaczenie."
  tags: []
"Dn4,10":
  text: "Takie są widzenia w mojej głowie, jakie miałem na swoim łożu: Patrzyłem, a oto drzewo pośrodku ziemi, a jego wysokość była ogromna."
  tags: []
"Dn4,11":
  text: "Drzewo rosło i było potężne, a jego wysokość dosięgła nieba i było widoczne aż po krańce całej ziemi."
  tags: []
"Dn4,12":
  text: "Jego liście były piękne, jego owoc obfity i na nim był pokarm dla wszystkich. Pod nim znajdowały cień zwierzęta polne, na jego gałęziach mieszkało ptactwo niebieskie i z niego miało pożywienie wszelkie ciało."
  tags: []
"Dn4,13":
  text: "Widziałem jeszcze w widzeniach w mojej głowie na swoim łożu: Oto stróż i święty zstąpił z nieba;"
  tags: []
"Dn4,14":
  text: "Zawołał ze wszystkich sił i tak powiedział: Wyrąbcie to drzewo i obetnijcie jego gałęzie, otrząśnijcie jego liście i rozrzućcie jego owoc. Niech zwierzę ucieknie spod niego i ptactwo z jego gałęzi."
  tags: []
"Dn4,15":
  text: "Lecz pień jego korzenia zostawcie w ziemi i to w okowach żelaza i brązu na polnej trawie, aby był skrapiany rosą z nieba, a trawę ziemi niech dzieli ze zwierzętami."
  tags: []
"Dn4,16":
  text: "Niech się odmieni jego ludzkie serce i niech będzie mu dane serce zwierzęce, a niech przejdzie nad nim siedem czasów."
  tags: []
"Dn4,17":
  text: "Ta sprawa jest według dekretu stróżów i to żądanie jest według słowa świętych po to, aby wszyscy żyjący poznali, że Najwyższy panuje nad królestwem ludzkim i daje je, komu chce, a najniższych z ludzi ustanawia nad nim."
  tags: []
"Dn4,18":
  text: "Taki sen miałem ja, król Nabuchodonozor. A ty, Belteszassarze, powiedz jego znaczenie, gdyż wszyscy mędrcy mojego królestwa nie mogli mi oznajmić jego znaczenia. Ale ty możesz, bo duch świętych bogów jest w tobie."
  tags: []
"Dn4,19":
  text: "Wtedy Daniel, który miał na imię Belteszassar, stał osłupiony przez jedną godzinę i jego myśli trwożyły go. Król odezwał się i powiedział: Belteszassarze, niech cię nie trwoży sen i jego znaczenie. Belteszassar odpowiedział: Mój panie, niech ten sen spadnie na tych, którzy cię nienawidzą, a jego znaczenie na twoich wrogów."
  tags: []
"Dn4,20":
  text: "Drzewo, które widziałeś, które rosło i było potężne, jego wysokość dosięgła nieba, a było widoczne na całej ziemi;"
  tags: []
"Dn4,21":
  text: "Którego liście były piękne, a owoc obfity, na którym był pokarm dla wszystkich, pod którym mieszkało zwierzę polne i na którego gałęziach przebywało ptactwo niebieskie;"
  tags: []
"Dn4,22":
  text: "To ty, królu, który rosłeś i stałeś się potężny, twoja wielkość urosła i dosięgła nieba, a twoja władza – aż po krańce ziemi."
  tags: []
"Dn4,23":
  text: "A to, że król widział stróża i świętego zstępującego z nieba i mówiącego: Wyrąbcie to drzewo i zniszczcie je, lecz pień jego korzeni zostawcie w ziemi i to w okowach żelaza i brązu na polnej trawie, aby był skrapiany rosą z nieba; a trawę polną niech dzieli ze zwierzętami polnymi, aż wypełni się siedem czasów nad nim;"
  tags: []
"Dn4,24":
  text: "Takie jest znaczenie, o królu, i dekret Najwyższego, który przyszedł na króla, mego pana;"
  tags: []
"Dn4,25":
  text: "Wypędzą cię spośród ludzi, będziesz mieszkał ze zwierzętami polnymi, będą cię żywić trawą jak woły, będziesz skrapiany rosą z nieba i wypełni się nad tobą siedem czasów, aż poznasz, że Najwyższy panuje nad królestwem ludzkim i daje je, komu chce."
  tags: []
"Dn4,26":
  text: "A to, że rozkazano zostawić pień korzeni tego drzewa, oznacza, że twoje królestwo zostanie przy tobie, gdy poznasz, że niebiosa sprawują władzę."
  tags: []
"Dn4,27":
  text: "Dlatego, królu, niech ci się spodoba moja rada i przerwij swoje grzechy sprawiedliwością, a swoje nieprawości miłosierdziem nad biednymi; może przedłuży się twój pokój."
  tags: []
"Dn4,28":
  text: "To wszystko przyszło na króla Nabuchodonozora."
  tags: []
"Dn4,29":
  text: "Po upływie dwunastu miesięcy, gdy przechadzał się w pałacu królewskim w Babilonie;"
  tags: []
"Dn4,30":
  text: "Król zaczął mówić: Czy to nie jest ten wielki Babilon, który ja, w sile swej potęgi, zbudowałem jako siedzibę królestwa i dla chwały swojego majestatu?"
  tags: []
"Dn4,31":
  text: "A gdy słowo to jeszcze było w ustach króla, oto spadł głos z nieba: Do ciebie się mówi, królu Nabuchodonozorze. Twoje królestwo odeszło od ciebie."
  tags: []
"Dn4,32":
  text: "Wypędzą cię spośród ludzi, będziesz mieszkał ze zwierzętami polnymi, będą cię żywić trawą jak woły i wypełni się nad tobą siedem czasów, aż poznasz, że Najwyższy panuje nad królestwem ludzkim i daje je, komu chce."
  tags: []
"Dn4,33":
  text: "Tej godziny wypełniło się to słowo nad Nabuchodonozorem: Wypędzono go spośród ludzi, jadł trawę jak woły i jego ciało było skrapiane rosą z nieba, aż jego włosy urosły jak pióra orłów, a jego paznokcie jak szpony ptaków."
  tags: []
"Dn4,34":
  text: "Pod koniec tych dni, ja, Nabuchodonozor, podniosłem swoje oczy do nieba i wrócił mi mój rozum. Wtedy błogosławiłem Najwyższego i chwaliłem go, i wysławiałem Żyjącego na wieki, bo jego władza to władza wieczna, a jego królestwo trwa z pokolenia na pokolenie."
  tags: []
"Dn4,35":
  text: "Wszyscy mieszkańcy ziemi są uważani za nic. Według swojej woli postępuje z wojskiem niebieskim i z mieszkańcami ziemi, a nie ma nikogo, kto by wstrzymał jego rękę lub powiedział mu: Co czynisz?"
  tags: []
"Dn4,36":
  text: "W tym czasie wrócił mi mój rozum i ku chwale mego królestwa wróciła do mnie moja dostojność i mój blask. Ponadto moi doradcy i książęta szukali mnie, zostałem umocniony w swoim królestwie i dano mi jeszcze większy majestat."
  tags: []
"Dn4,37":
  text: "A teraz ja, Nabuchodonozor, chwalę, wywyższam i wysławiam Króla niebios, którego wszystkie dzieła są prawdą, a jego ścieżki sprawiedliwością, a tych, którzy postępują w pysze, może on poniżyć."
  tags: []
