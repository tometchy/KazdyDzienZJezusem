"Dn1,1":
  text: "W trzecim roku panowania Joakima, króla Judy, do Jerozolimy nadciągnął Nabuchodonozor, król Babilonu, i obległ ją."
  tags: []
"Dn1,2":
  text: "I Pan wydał w jego rękę Joakima, króla Judy, oraz część naczyń domu Bożego, a on je zabrał do ziemi Szinear, do domu swego boga, i wniósł te naczynia do skarbca swego boga."
  tags: []
"Dn1,3":
  text: "I król rozkazał Aszpenazowi, przełożonemu swoich eunuchów, aby przyprowadził niektórych spośród synów Izraela, z potomstwa króla i z książąt;"
  tags: []
"Dn1,4":
  text: "Młodzieńców, w których by nie było żadnej skazy, o pięknym wyglądzie, biegłych we wszelkiej mądrości, posiadających wiedzę i pojętnych w nauce, którzy byliby zdatni stanąć w pałacu króla, i aby ich nauczać pisma i języka chaldejskiego."
  tags: []
"Dn1,5":
  text: "I król wyznaczył im codzienną porcję potraw królewskich i wina, które on sam pił. Mieli być tak wychowywani, by po upływie trzech lat mogli stanąć przed królem."
  tags: []
"Dn1,6":
  text: "Wśród nich, spośród synów Judy, byli: Daniel, Chananiasz, Miszael i Azariasz."
  tags: []
"Dn1,7":
  text: "I przełożony eunuchów nadał im imiona: Daniela nazwał Belteszassarem, Chananiasza – Szadrakiem, Miszaela – Meszakiem i Azariasza – Abed-Nego."
  tags: []
"Dn1,8":
  text: "Ale Daniel postanowił w swoim sercu, że nie splami się potrawami króla ani winem, które król pił. Poprosił więc przełożonego eunuchów, aby nie musiał się splamić."
  tags: []
"Dn1,9":
  text: "I Bóg zjednał Danielowi łaskę i miłość przełożonego eunuchów."
  tags: []
"Dn1,10":
  text: "Przełożony eunuchów powiedział do Daniela: Boję się króla, mojego pana, który wyznaczył wasz pokarm i wasz napój. Jeśli zobaczy, że wasze twarze są chudsze niż innych młodzieńców, którzy razem z wami mają być wychowani, wtedy narazicie u króla na niebezpieczeństwo moją głowę."
  tags: []
"Dn1,11":
  text: "Wtedy Daniel powiedział do sługi, którego przełożony eunuchów ustanowił nad Danielem, Chananiaszem, Miszaelem i Azariaszem;"
  tags: []
"Dn1,12":
  text: "Poddaj próbie, proszę, twoje sługi przez dziesięć dni. Niech nam dają jarzyny do jedzenia i wodę do picia."
  tags: []
"Dn1,13":
  text: "Potem przypatrzysz się naszym twarzom oraz twarzom młodzieńców, którzy jadają pokarm z potraw królewskich, i według tego, co zobaczysz, tak postąpisz ze swoimi sługami."
  tags: []
"Dn1,14":
  text: "I posłuchał ich w tej sprawie, i poddał ich próbie przez dziesięć dni."
  tags: []
"Dn1,15":
  text: "A po upływie dziesięciu dni okazało się, że ich twarze wyglądały lepiej i ich ciała były tęższe niż wszystkich młodzieńców, którzy jadali pokarm z potraw królewskich."
  tags: []
"Dn1,16":
  text: "Sługa zabrał więc ich potrawy oraz wino, które mieli pić, a dał im jarzyny."
  tags: []
"Dn1,17":
  text: "Tym czterem młodzieńcom dał Bóg wiedzę i zrozumienie we wszelkim piśmie oraz mądrość. Ponadto Danielowi dał zrozumienie wszelkich widzeń i snów."
  tags: []
"Dn1,18":
  text: "Gdy minęły dni wyznaczone przez króla, by ich przyprowadzić, przełożony dworzan wprowadził ich przed Nabuchodonozora."
  tags: []
"Dn1,19":
  text: "I król rozmawiał z nimi, ale nie znalazł się pośród nich wszystkich nikt taki, jak Daniel, Chananiasz, Miszael i Azariasz. I stanęli przed królem."
  tags: []
"Dn1,20":
  text: "We wszystkich sprawach mądrości i rozumu, o które pytał ich król, stwierdzał, że są dziesięciokrotnie bieglejsi od wszystkich magów i astrologów, którzy byli w całym jego królestwie."
  tags: []
"Dn1,21":
  text: "I Daniel był tam aż do pierwszego roku króla Cyrusa."
  tags: []
