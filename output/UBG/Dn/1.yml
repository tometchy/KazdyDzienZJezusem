"Dn1,1": "W trzecim roku panowania Joakima, króla Judy, do Jerozolimy nadciągnął Nabuchodonozor, król Babilonu, i obległ ją."
"Dn1,2": "I Pan wydał w jego rękę Joakima, króla Judy, oraz część naczyń domu Bożego, a on je zabrał do ziemi Szinear, do domu swego boga, i wniósł te naczynia do skarbca swego boga."
"Dn1,3": "I król rozkazał Aszpenazowi, przełożonemu swoich eunuchów, aby przyprowadził niektórych spośród synów Izraela, z potomstwa króla i z książąt;"
"Dn1,4": "Młodzieńców, w których by nie było żadnej skazy, o pięknym wyglądzie, biegłych we wszelkiej mądrości, posiadających wiedzę i pojętnych w nauce, którzy byliby zdatni stanąć w pałacu króla, i aby ich nauczać pisma i języka chaldejskiego."
"Dn1,5": "I król wyznaczył im codzienną porcję potraw królewskich i wina, które on sam pił. Mieli być tak wychowywani, by po upływie trzech lat mogli stanąć przed królem."
"Dn1,6": "Wśród nich, spośród synów Judy, byli: Daniel, Chananiasz, Miszael i Azariasz."
"Dn1,7": "I przełożony eunuchów nadał im imiona: Daniela nazwał Belteszassarem, Chananiasza – Szadrakiem, Miszaela – Meszakiem i Azariasza – Abed-Nego."
"Dn1,8": "Ale Daniel postanowił w swoim sercu, że nie splami się potrawami króla ani winem, które król pił. Poprosił więc przełożonego eunuchów, aby nie musiał się splamić."
"Dn1,9": "I Bóg zjednał Danielowi łaskę i miłość przełożonego eunuchów."
"Dn1,10": "Przełożony eunuchów powiedział do Daniela: Boję się króla, mojego pana, który wyznaczył wasz pokarm i wasz napój. Jeśli zobaczy, że wasze twarze są chudsze niż innych młodzieńców, którzy razem z wami mają być wychowani, wtedy narazicie u króla na niebezpieczeństwo moją głowę."
"Dn1,11": "Wtedy Daniel powiedział do sługi, którego przełożony eunuchów ustanowił nad Danielem, Chananiaszem, Miszaelem i Azariaszem;"
"Dn1,12": "Poddaj próbie, proszę, twoje sługi przez dziesięć dni. Niech nam dają jarzyny do jedzenia i wodę do picia."
"Dn1,13": "Potem przypatrzysz się naszym twarzom oraz twarzom młodzieńców, którzy jadają pokarm z potraw królewskich, i według tego, co zobaczysz, tak postąpisz ze swoimi sługami."
"Dn1,14": "I posłuchał ich w tej sprawie, i poddał ich próbie przez dziesięć dni."
"Dn1,15": "A po upływie dziesięciu dni okazało się, że ich twarze wyglądały lepiej i ich ciała były tęższe niż wszystkich młodzieńców, którzy jadali pokarm z potraw królewskich."
"Dn1,16": "Sługa zabrał więc ich potrawy oraz wino, które mieli pić, a dał im jarzyny."
"Dn1,17": "Tym czterem młodzieńcom dał Bóg wiedzę i zrozumienie we wszelkim piśmie oraz mądrość. Ponadto Danielowi dał zrozumienie wszelkich widzeń i snów."
"Dn1,18": "Gdy minęły dni wyznaczone przez króla, by ich przyprowadzić, przełożony dworzan wprowadził ich przed Nabuchodonozora."
"Dn1,19": "I król rozmawiał z nimi, ale nie znalazł się pośród nich wszystkich nikt taki, jak Daniel, Chananiasz, Miszael i Azariasz. I stanęli przed królem."
"Dn1,20": "We wszystkich sprawach mądrości i rozumu, o które pytał ich król, stwierdzał, że są dziesięciokrotnie bieglejsi od wszystkich magów i astrologów, którzy byli w całym jego królestwie."
"Dn1,21": "I Daniel był tam aż do pierwszego roku króla Cyrusa."
