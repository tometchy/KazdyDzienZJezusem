"Dn3,1":
  text: "Król Nabuchodonozor wykonał złoty posąg o wysokości sześćdziesięciu łokci i szerokości sześciu łokci i postawił go na równinie Dura w prowincji Babilonu."
  tags: []
"Dn3,2":
  text: "Wtedy król Nabuchodonozor rozesłał posłów, aby zebrali książąt, starostów, dowódców, sędziów, skarbników, prawników, urzędników i wszystkich przełożonych prowincji, by przyszli na poświęcenie posągu, który wystawił król Nabuchodonozor."
  tags: []
"Dn3,3":
  text: "Wtedy zgromadzili się książęta, starostowie, dowódcy, sędziowie, skarbnicy, prawnicy, urzędnicy i wszyscy przełożeni prowincji na poświęcenie posągu, który wzniósł król Nabuchodonozor; i stanęli przed posągiem, który wystawił Nabuchodonozor."
  tags: []
"Dn3,4":
  text: "A herold zawołał donośnym głosem: Rozkazuje się wam, ludy, narody i języki;"
  tags: []
"Dn3,5":
  text: "W chwili gdy usłyszycie dźwięk trąby, fletu, harfy, sambuki, psałterionu, cymbałów i wszelkiego instrumentu muzycznego, macie paść i oddać pokłon złotemu posągowi, który wystawił król Nabuchodonozor."
  tags: []
"Dn3,6":
  text: "A kto nie upadnie i nie odda pokłonu, zostanie w tej samej godzinie wrzucony do pieca rozpalonego ogniem."
  tags: []
"Dn3,7":
  text: "W chwili więc, gdy wszyscy ludzie usłyszeli dźwięk trąby, fletu, harfy, sambuki, psałterionu i wszelkich instrumentów muzycznych, upadli wszyscy ludzie, wszystkie narody i języki i oddali pokłon złotemu posągowi, który wystawił król Nabuchodonozor."
  tags: []
"Dn3,8":
  text: "Dlatego w tym czasie przyszli niektórzy Chaldejczycy i złożyli skargę przeciwko Żydom."
  tags: []
"Dn3,9":
  text: "Mówili do króla Nabuchodonozora: Królu, żyj na wieki!"
  tags: []
"Dn3,10":
  text: "Ty, królu, wydałeś dekret, aby każdy człowiek, który usłyszy dźwięk trąby, fletu, harfy, sambuki, psałterionu, cymbałów i wszelkich instrumentów muzycznych, upadł i oddał pokłon złotemu posągowi;"
  tags: []
"Dn3,11":
  text: "A kto by nie upadł i nie oddał pokłonu, aby został wrzucony do pieca rozpalonego ogniem."
  tags: []
"Dn3,12":
  text: "Znaleźli się jednak niektórzy Żydzi, których ustanowiłeś nad sprawami prowincji Babilonu: Szadrak, Meszak i Abed-Nego. Ci mężczyźni zlekceważyli twój dekret, królu. Nie chwalą twoich bogów i nie oddają pokłonu złotemu posągowi, który wystawiłeś."
  tags: []
"Dn3,13":
  text: "Wtedy Nabuchodonozor we wściekłości i gniewie rozkazał przyprowadzić Szadraka, Meszaka i Abed-Nego; przyprowadzono więc ich przed króla."
  tags: []
"Dn3,14":
  text: "I zwrócił się do nich Nabuchodonozor, i zapytał ich: Czy to prawda, Szadraku, Meszaku i Abed-Nego, że nie czcicie moich bogów i nie oddajecie pokłonu złotemu posągowi, który wystawiłem?"
  tags: []
"Dn3,15":
  text: "Teraz więc bądźcie gotowi, aby w chwili, gdy usłyszycie dźwięk trąby, fletu, harfy, sambuki, psałterionu, cymbałów i wszelkich instrumentów muzycznych, upaść i oddać pokłon posągowi, który wykonałem. Jeśli nie oddacie pokłonu, zostaniecie w tej samej godzinie wrzuceni do środka pieca rozpalonego ogniem, a kim jest ten Bóg, który by mógł was wyrwać z mojej ręki?"
  tags: []
"Dn3,16":
  text: "Szadrak, Meszak i Abed-Nego odpowiedzieli królowi: Nabuchodonozorze, my się nie martwimy tym, co odpowiedzieć."
  tags: []
"Dn3,17":
  text: "Nasz Bóg, którego chwalimy, może nas wyrwać z pieca rozpalonego ogniem i z twojej ręki. Czy wyrwie nas, królu;"
  tags: []
"Dn3,18":
  text: "Czy nie wyrwie, niech ci będzie wiadomo, królu, że nie będziemy chwalić twoich bogów ani nie oddamy pokłonu złotemu posągowi, który wystawiłeś."
  tags: []
"Dn3,19":
  text: "Wtedy Nabuchodonozor napełnił się wściekłością, tak że wyraz jego twarzy zmienił się wobec Szadraka, Meszaka i Abed-Nego. Wydał rozkaz, by rozpalono piec siedem razy mocniej, niż zwykle rozpalano."
  tags: []
"Dn3,20":
  text: "Najsilniejszym ludziom ze swego wojska rozkazał związać Szadraka, Meszaka i Abed-Nego i wrzucić do pieca rozpalonego ogniem."
  tags: []
"Dn3,21":
  text: "Wtedy związano tych mężczyzn w ich płaszczach i ubraniach, w ich czapkach i szatach i wrzucono ich do środka pieca rozpalonego ogniem."
  tags: []
"Dn3,22":
  text: "Ponieważ rozkaz króla przynaglał, a piec był bardzo rozpalony, płomień ognia zabił tych ludzi, którzy wrzucili Szadraka, Meszaka i Abed-Nego."
  tags: []
"Dn3,23":
  text: "A ci trzej mężowie, Szadrak, Meszak i Abed-Nego, wpadli związani do środka pieca rozpalonego ogniem."
  tags: []
"Dn3,24":
  text: "Wtedy król Nabuchodonozor zdumiał się, powstał spiesznie i zapytał swoich doradców: Czy nie wrzuciliśmy trzech związanych mężów do środka ognia? A oni odpowiedzieli królowi: Prawda, królu."
  tags: []
"Dn3,25":
  text: "A on odpowiedział: Oto widzę czterech mężów rozwiązanych, przechadzających się pośród ognia, i nie odnoszą żadnej szkody, a wygląd czwartej osoby jest podobny do Syna Bożego."
  tags: []
"Dn3,26":
  text: "Wtedy zbliżył się Nabuchodonozor do otworu pieca rozpalonego ogniem i powiedział: Szadraku, Meszaku i Abed-Nego, słudzy Najwyższego Boga, wyjdźcie i przyjdźcie tutaj. Wyszli więc Szadrak, Meszak i Abed-Nego ze środka ognia."
  tags: []
"Dn3,27":
  text: "A zgromadziwszy się, książęta, starostowie, urzędnicy i dowódcy króla widzieli tych mężczyzn, to, że ogień nie miał żadnej mocy nad ich ciałami, włosy z ich głowy nie spaliły się, ich płaszcze nie były zniszczone ani swąd ognia ich nie przeniknął."
  tags: []
"Dn3,28":
  text: "Wtedy Nabuchodonozor powiedział: Błogosławiony niech będzie Bóg Szadraka, Meszaka i Abed-Nego, który posłał swego Anioła i wyrwał swoje sługi, którzy mu ufali, którzy nie posłuchali słowa króla, ale oddali swe ciała, aby nie służyć ani oddawać pokłonu żadnemu bogu oprócz swego Boga."
  tags: []
"Dn3,29":
  text: "Dlatego wydaję taki dekret: Ktokolwiek ze wszelkiego ludu, narodu i języka wypowie bluźnierstwo przeciwko Bogu Szadraka, Meszaka i Abed-Nego, zostanie rozsiekany na kawałki, a jego dom zamieniony w gnojowisko, gdyż nie ma innego Boga, który mógłby wyrwać jak ten."
  tags: []
"Dn3,30":
  text: "Wtedy król wywyższył Szadraka, Meszaka i Abed-Nego w prowincji Babilonu."
  tags: []
