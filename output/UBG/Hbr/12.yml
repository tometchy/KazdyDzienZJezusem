"Hbr12,1":
  text: "Skoro i my mamy wokół siebie tak wielką chmurę świadków, zrzućmy z siebie wszelki ciężar i grzech, który nas tak łatwo osacza, w cierpliwości biegnijmy w wyznaczonym nam wyścigu;"
  tags: []
"Hbr12,2":
  text: "Patrząc na Jezusa, twórcę i dokończyciela wiary, który z powodu przygotowanej mu radości wycierpiał krzyż, nie zważając na hańbę, i zasiadł po prawicy tronu Boga."
  tags: []
"Hbr12,3":
  text: "Pomyślcie więc o tym, który zniósł tak wielki sprzeciw wobec siebie ze strony grzeszników, abyście nie zniechęcali się w waszych umysłach i nie ustawali."
  tags: []
"Hbr12,4":
  text: "Jeszcze nie stawialiście oporu aż do krwi, walcząc przeciwko grzechowi;"
  tags: []
"Hbr12,5":
  text: "I zapomnieliście o napomnieniu, które jest kierowane do was jako synów: Mój synu, nie lekceważ karania Pana i nie zniechęcaj się, gdy on cię napomina."
  tags: []
"Hbr12,6":
  text: "Kogo bowiem Pan miłuje, tego karze, a chłoszcze każdego, którego za syna przyjmuje."
  tags: []
"Hbr12,7":
  text: "Jeśli znosicie karanie, Bóg obchodzi się z wami jak z synami. Jaki to bowiem syn, którego ojciec nie karze?"
  tags: []
"Hbr12,8":
  text: "A jeśli jesteście bez karania, którego wszyscy są uczestnikami, wtedy jesteście bękartami, a nie synami."
  tags: []
"Hbr12,9":
  text: "Poza tym nasi cieleśni ojcowie nas karali, a szanowaliśmy ich. Czyż nie tym bardziej powinniśmy poddać się Ojcu duchów, abyśmy żyli?"
  tags: []
"Hbr12,10":
  text: "Tamci bowiem karali nas przez krótki czas według swego uznania. Ten zaś czyni to dla naszego dobra, abyśmy byli uczestnikami jego świętości."
  tags: []
"Hbr12,11":
  text: "A żadne karanie w danej chwili nie wydaje się radosne, ale smutne. Potem jednak przynosi błogi owoc sprawiedliwości tym, którzy przez nie byli ćwiczeni."
  tags: []
"Hbr12,12":
  text: "Dlatego wyprostujcie opadłe ręce i omdlałe kolana."
  tags: []
"Hbr12,13":
  text: "Prostujcie ścieżki dla waszych stóp, aby to, co chrome, nie zeszło z drogi, ale raczej zostało uzdrowione."
  tags: []
"Hbr12,14":
  text: "Dążcie do pokoju ze wszystkimi i do świętości, bez której nikt nie ujrzy Pana."
  tags: []
"Hbr12,15":
  text: "Uważajcie, żeby nikt nie pozbawił się łaski Boga, żeby jakiś korzeń goryczy, wyrastając, nie wyrządził szkody i aby przez niego nie skalało się wielu;"
  tags: []
"Hbr12,16":
  text: "Żeby nie było żadnego rozpustnika lub bezbożnika jak Ezaw, który za jedną potrawę sprzedał swoje pierworództwo."
  tags: []
"Hbr12,17":
  text: "Wiecie przecież, że potem, gdy chciał odziedziczyć błogosławieństwo, został odrzucony. Nie znalazł bowiem miejsca na pokutę, choć ze łzami jej szukał."
  tags: []
"Hbr12,18":
  text: "Bo nie podeszliście do góry, która da się dotknąć i płonącej ogniem, do mroku, ciemności i burzy;"
  tags: []
"Hbr12,19":
  text: "Ani do dźwięku trąby i takiego głosu słów, że ci, którzy go słyszeli, prosili, aby już do nich nie mówiono;"
  tags: []
"Hbr12,20":
  text: "(Nie mogli bowiem znieść tego rozkazu: Gdyby nawet zwierzę dotknęło góry, będzie ukamienowane lub przebite strzałą."
  tags: []
"Hbr12,21":
  text: "A tak straszne było to zjawisko, że Mojżesz powiedział: Jestem przerażony i drżę;)"
  tags: []
"Hbr12,22":
  text: "Lecz podeszliście do góry Syjon i do miasta Boga żywego, do niebiańskiego Jeruzalem i do niezliczonej rzeszy aniołów;"
  tags: []
"Hbr12,23":
  text: "Na powszechne zebranie, do zgromadzenia pierworodnych, którzy są zapisani w niebie, do Boga, sędziego wszystkich, do duchów sprawiedliwych uczynionych doskonałymi;"
  tags: []
"Hbr12,24":
  text: "I do pośrednika nowego przymierza, Jezusa, do krwi, którą się kropi, a która mówi lepsze rzeczy niż krew Abla."
  tags: []
"Hbr12,25":
  text: "Uważajcie, abyście nie odtrącili tego, który przemawia. Jeśli bowiem tamci nie uniknęli kary, odtrąciwszy tego, który na ziemi mówił, tym bardziej my, jeśli odwrócimy się od tego, który przemawia z nieba;"
  tags: []
"Hbr12,26":
  text: "Którego głos wstrząsnął wówczas ziemią, a teraz obiecuje, mówiąc: Jeszcze raz wstrząsnę nie tylko ziemią, ale i niebem."
  tags: []
"Hbr12,27":
  text: "A słowa „jeszcze raz” ukazują usunięcie tego, co się chwieje, jako tego, co stworzone, aby pozostało to, co się nie chwieje."
  tags: []
"Hbr12,28":
  text: "Dlatego otrzymując królestwo niezachwiane, miejmy łaskę, przez którą możemy służyć Bogu tak, jak mu się to podoba, z czcią i bojaźnią."
  tags: []
"Hbr12,29":
  text: "Nasz Bóg bowiem jest ogniem trawiącym."
  tags: []
