"Hbr12,1": "Skoro i my mamy wokół siebie tak wielką chmurę świadków, zrzućmy z siebie wszelki ciężar i grzech, który nas tak łatwo osacza, w cierpliwości biegnijmy w wyznaczonym nam wyścigu;"
"Hbr12,2": "Patrząc na Jezusa, twórcę i dokończyciela wiary, który z powodu przygotowanej mu radości wycierpiał krzyż, nie zważając na hańbę, i zasiadł po prawicy tronu Boga."
"Hbr12,3": "Pomyślcie więc o tym, który zniósł tak wielki sprzeciw wobec siebie ze strony grzeszników, abyście nie zniechęcali się w waszych umysłach i nie ustawali."
"Hbr12,4": "Jeszcze nie stawialiście oporu aż do krwi, walcząc przeciwko grzechowi;"
"Hbr12,5": "I zapomnieliście o napomnieniu, które jest kierowane do was jako synów: Mój synu, nie lekceważ karania Pana i nie zniechęcaj się, gdy on cię napomina."
"Hbr12,6": "Kogo bowiem Pan miłuje, tego karze, a chłoszcze każdego, którego za syna przyjmuje."
"Hbr12,7": "Jeśli znosicie karanie, Bóg obchodzi się z wami jak z synami. Jaki to bowiem syn, którego ojciec nie karze?"
"Hbr12,8": "A jeśli jesteście bez karania, którego wszyscy są uczestnikami, wtedy jesteście bękartami, a nie synami."
"Hbr12,9": "Poza tym nasi cieleśni ojcowie nas karali, a szanowaliśmy ich. Czyż nie tym bardziej powinniśmy poddać się Ojcu duchów, abyśmy żyli?"
"Hbr12,10": "Tamci bowiem karali nas przez krótki czas według swego uznania. Ten zaś czyni to dla naszego dobra, abyśmy byli uczestnikami jego świętości."
"Hbr12,11": "A żadne karanie w danej chwili nie wydaje się radosne, ale smutne. Potem jednak przynosi błogi owoc sprawiedliwości tym, którzy przez nie byli ćwiczeni."
"Hbr12,12": "Dlatego wyprostujcie opadłe ręce i omdlałe kolana."
"Hbr12,13": "Prostujcie ścieżki dla waszych stóp, aby to, co chrome, nie zeszło z drogi, ale raczej zostało uzdrowione."
"Hbr12,14": "Dążcie do pokoju ze wszystkimi i do świętości, bez której nikt nie ujrzy Pana."
"Hbr12,15": "Uważajcie, żeby nikt nie pozbawił się łaski Boga, żeby jakiś korzeń goryczy, wyrastając, nie wyrządził szkody i aby przez niego nie skalało się wielu;"
"Hbr12,16": "Żeby nie było żadnego rozpustnika lub bezbożnika jak Ezaw, który za jedną potrawę sprzedał swoje pierworództwo."
"Hbr12,17": "Wiecie przecież, że potem, gdy chciał odziedziczyć błogosławieństwo, został odrzucony. Nie znalazł bowiem miejsca na pokutę, choć ze łzami jej szukał."
"Hbr12,18": "Bo nie podeszliście do góry, która da się dotknąć i płonącej ogniem, do mroku, ciemności i burzy;"
"Hbr12,19": "Ani do dźwięku trąby i takiego głosu słów, że ci, którzy go słyszeli, prosili, aby już do nich nie mówiono;"
"Hbr12,20": "(Nie mogli bowiem znieść tego rozkazu: Gdyby nawet zwierzę dotknęło góry, będzie ukamienowane lub przebite strzałą."
"Hbr12,21": "A tak straszne było to zjawisko, że Mojżesz powiedział: Jestem przerażony i drżę;)"
"Hbr12,22": "Lecz podeszliście do góry Syjon i do miasta Boga żywego, do niebiańskiego Jeruzalem i do niezliczonej rzeszy aniołów;"
"Hbr12,23": "Na powszechne zebranie, do zgromadzenia pierworodnych, którzy są zapisani w niebie, do Boga, sędziego wszystkich, do duchów sprawiedliwych uczynionych doskonałymi;"
"Hbr12,24": "I do pośrednika nowego przymierza, Jezusa, do krwi, którą się kropi, a która mówi lepsze rzeczy niż krew Abla."
"Hbr12,25": "Uważajcie, abyście nie odtrącili tego, który przemawia. Jeśli bowiem tamci nie uniknęli kary, odtrąciwszy tego, który na ziemi mówił, tym bardziej my, jeśli odwrócimy się od tego, który przemawia z nieba;"
"Hbr12,26": "Którego głos wstrząsnął wówczas ziemią, a teraz obiecuje, mówiąc: Jeszcze raz wstrząsnę nie tylko ziemią, ale i niebem."
"Hbr12,27": "A słowa „jeszcze raz” ukazują usunięcie tego, co się chwieje, jako tego, co stworzone, aby pozostało to, co się nie chwieje."
"Hbr12,28": "Dlatego otrzymując królestwo niezachwiane, miejmy łaskę, przez którą możemy służyć Bogu tak, jak mu się to podoba, z czcią i bojaźnią."
"Hbr12,29": "Nasz Bóg bowiem jest ogniem trawiącym."
