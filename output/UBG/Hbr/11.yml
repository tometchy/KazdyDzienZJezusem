"Hbr11,1":
  text: "A wiara jest podstawą tego, czego się spodziewamy, i dowodem tego, czego nie widzimy."
  tags: []
"Hbr11,2":
  text: "Przez nią bowiem przodkowie otrzymali chlubne świadectwo."
  tags: []
"Hbr11,3":
  text: "Przez wiarę rozumiemy, że światy zostały ukształtowane słowem Boga, tak że to, co widzimy, nie powstało z tego, co widzialne."
  tags: []
"Hbr11,4":
  text: "Przez wiarę Abel złożył Bogu ofiarę lepszą niż Kain, dzięki czemu otrzymał świadectwo, że jest sprawiedliwy, bo Bóg zaświadczył o jego darach. Przez nią też, choć umarł, jeszcze mówi."
  tags: []
"Hbr11,5":
  text: "Przez wiarę Henoch został przeniesiony, aby nie oglądał śmierci, i nie znaleziono go, ponieważ Bóg go przeniósł. Zanim bowiem został przeniesiony, miał świadectwo, że podobał się Bogu."
  tags: []
"Hbr11,6":
  text: "Bez wiary zaś nie można podobać się Bogu, bo ten, kto przychodzi do Boga, musi wierzyć, że on jest i że nagradza tych, którzy go szukają."
  tags: []
"Hbr11,7":
  text: "Przez wiarę Noe, ostrzeżony przez Boga o tym, czego jeszcze nie widziano, kierowany bojaźnią zbudował arkę, aby ocalić swój dom. Przez nią też potępił świat i stał się dziedzicem sprawiedliwości, która jest z wiary."
  tags: []
"Hbr11,8":
  text: "Przez wiarę Abraham, gdy został wezwany, aby pójść na miejsce, które miał wziąć w dziedzictwo, usłuchał i wyszedł, nie wiedząc, dokąd idzie."
  tags: []
"Hbr11,9":
  text: "Przez wiarę przebywał w ziemi obiecanej jak w obcej, mieszkając w namiotach z Izaakiem i Jakubem, współdziedzicami tej samej obietnicy."
  tags: []
"Hbr11,10":
  text: "Oczekiwał bowiem miasta mającego fundamenty, którego budowniczym i twórcą jest Bóg."
  tags: []
"Hbr11,11":
  text: "Przez wiarę także sama Sara, mimo podeszłego wieku, otrzymała moc poczęcia potomstwa i urodziła, gdyż za wiernego uznała tego, który obiecał."
  tags: []
"Hbr11,12":
  text: "Dlatego z jednego człowieka, i to obumarłego, zrodziło się potomstwo tak liczne, jak gwiazdy niebieskie i jak niezliczony piasek na brzegu morza."
  tags: []
"Hbr11,13":
  text: "Wszyscy oni umarli w wierze, nie otrzymawszy spełnienia obietnic, ale z daleka je ujrzeli, cieszyli się nimi i witali je, i wyznawali, że są obcymi i pielgrzymami na ziemi."
  tags: []
"Hbr11,14":
  text: "Ci bowiem, którzy tak mówią, wyraźnie okazują, że szukają ojczyzny."
  tags: []
"Hbr11,15":
  text: "Gdyby przecież wspominali tę, z której wyszli, mieliby sposobność powrócić."
  tags: []
"Hbr11,16":
  text: "Teraz jednak pragną lepszej, to jest niebiańskiej. Dlatego Bóg nie wstydzi się być nazywany ich Bogiem, bo przygotował dla nich miasto."
  tags: []
"Hbr11,17":
  text: "Przez wiarę Abraham, wystawiony na próbę, ofiarował Izaaka. On, który otrzymał obietnicę, złożył w ofierze jednorodzonego syna;"
  tags: []
"Hbr11,18":
  text: "On, któremu powiedziano: W Izaaku będzie nazwane twoje potomstwo;"
  tags: []
"Hbr11,19":
  text: "Uważał, że Bóg może nawet wskrzesić z martwych, skąd go też otrzymał na podobieństwo zmartwychwstania."
  tags: []
"Hbr11,20":
  text: "Przez wiarę Izaak pobłogosławił Jakuba i Ezawa odnośnie tego, co miało nastąpić."
  tags: []
"Hbr11,21":
  text: "Przez wiarę Jakub, umierając, pobłogosławił każdego z synów Józefa i pokłonił się, wsparty o wierzchołek swojej laski."
  tags: []
"Hbr11,22":
  text: "Przez wiarę Józef, umierając, wspomniał o wyjściu synów Izraela i wydał polecenie co do swoich kości."
  tags: []
"Hbr11,23":
  text: "Przez wiarę Mojżesz po urodzeniu przez trzy miesiące był ukrywany przez swoich rodziców, ponieważ widzieli, że dziecko jest urodziwe, i nie ulękli się rozkazu króla."
  tags: []
"Hbr11,24":
  text: "Przez wiarę Mojżesz, gdy dorósł, odmówił nazywania się synem córki faraona;"
  tags: []
"Hbr11,25":
  text: "Wybierając raczej cierpieć uciski z ludem Bożym, niż mieć doczesną rozkosz z grzechu."
  tags: []
"Hbr11,26":
  text: "Uważał zniewagi znoszone dla Chrystusa za większe bogactwo niż skarby Egiptu, bo wypatrywał zapłaty."
  tags: []
"Hbr11,27":
  text: "Przez wiarę opuścił Egipt, nie lękając się gniewu króla, bo wytrwał, tak jakby widział Niewidzialnego."
  tags: []
"Hbr11,28":
  text: "Przez wiarę obchodził Paschę i pokropienie krwią, aby nie dotknął ich ten, który niszczył pierworodne."
  tags: []
"Hbr11,29":
  text: "Przez wiarę przeszli przez Morze Czerwone jak po suchej ziemi, a gdy Egipcjanie próbowali to uczynić, potonęli."
  tags: []
"Hbr11,30":
  text: "Przez wiarę upadły mury Jerycha, gdy je okrążano przez siedem dni."
  tags: []
"Hbr11,31":
  text: "Przez wiarę nierządnica Rachab nie zginęła razem z niewierzącymi, gdyż w pokoju przyjęła szpiegów."
  tags: []
"Hbr11,32":
  text: "I co jeszcze mam powiedzieć? Nie wystarczyłoby mi bowiem czasu, gdybym miał opowiadać o Gedeonie, Baraku, Samsonie, Jeftem, Dawidzie, Samuelu i o prorokach;"
  tags: []
"Hbr11,33":
  text: "Którzy przez wiarę pokonali królestwa, czynili sprawiedliwość, dostąpili spełnienia obietnic, zamknęli paszcze lwom;"
  tags: []
"Hbr11,34":
  text: "Zgasili moc ognia, uniknęli ostrza miecza, umocnieni powstawali z niemocy, stali się dzielni na wojnie, zmusili do ucieczki obce wojska."
  tags: []
"Hbr11,35":
  text: "Kobiety odzyskały swoich zmarłych przez wskrzeszenie. Inni zaś byli torturowani, nie przyjąwszy uwolnienia, aby dostąpić lepszego zmartwychwstania."
  tags: []
"Hbr11,36":
  text: "Jeszcze inni doświadczyli szyderstw i biczowania, ponadto kajdan i więzienia."
  tags: []
"Hbr11,37":
  text: "Byli kamienowani, przerzynani piłą, doświadczani, zabijani mieczem, tułali się w owczych i kozich skórach, cierpieli niedostatek, ucisk, utrapienie;"
  tags: []
"Hbr11,38":
  text: "(Których świat nie był godny). Błąkali się po pustyniach i górach, po jaskiniach i rozpadlinach ziemi."
  tags: []
"Hbr11,39":
  text: "A ci wszyscy, choć zyskali chlubne świadectwo dzięki wierze, nie dostąpili spełnienia obietnicy;"
  tags: []
"Hbr11,40":
  text: "Ponieważ Bóg przewidział dla nas coś lepszego, aby oni nie stali się doskonali bez nas."
  tags: []
