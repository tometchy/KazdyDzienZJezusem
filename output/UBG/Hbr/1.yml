"Hbr1,1":
  text: "Bóg, który wielokrotnie i na różne sposoby przemawiał niegdyś do ojców przez proroków;"
  tags: []
"Hbr1,2":
  text: "W tych ostatecznych dniach przemówił do nas przez swego Syna, którego ustanowił dziedzicem wszystkiego, przez którego też stworzył światy;"
  tags: []
"Hbr1,3":
  text: "Który, będąc blaskiem jego chwały i wyrazem jego istoty i podtrzymując wszystko słowem swojej mocy, dokonawszy oczyszczenia z naszych grzechów przez samego siebie, zasiadł po prawicy Majestatu na wysokościach;"
  tags: []
"Hbr1,4":
  text: "I stał się o tyle wyższy od aniołów, o ile znamienitsze od nich odziedziczył imię."
  tags: []
"Hbr1,5":
  text: "Do którego bowiem z aniołów powiedział kiedykolwiek: Ty jesteś moim Synem, ja ciebie dziś zrodziłem? I znowu: Ja będę mu Ojcem, a on będzie mi Synem?"
  tags: []
"Hbr1,6":
  text: "I znowu, gdy wprowadza pierworodnego na świat, mówi: Niech mu oddają pokłon wszyscy aniołowie Boga."
  tags: []
"Hbr1,7":
  text: "O aniołach zaś mówi: On czyni swoich aniołów duchami, a swoje sługi płomieniami ognia."
  tags: []
"Hbr1,8":
  text: "Lecz do Syna mówi: Twój tron, o Boże, na wieki wieków, berłem sprawiedliwości jest berło twego królestwa."
  tags: []
"Hbr1,9":
  text: "Umiłowałeś sprawiedliwość, a znienawidziłeś nieprawość, dlatego namaścił cię, o Boże, twój Bóg olejkiem radości bardziej niż twoich towarzyszy."
  tags: []
"Hbr1,10":
  text: "Oraz: Ty, Panie, na początku założyłeś fundamenty ziemi, a niebiosa są dziełem twoich rąk."
  tags: []
"Hbr1,11":
  text: "One przeminą, ale ty zostaniesz i wszystkie jak szata się zestarzeją;"
  tags: []
"Hbr1,12":
  text: "I jak płaszcz je zwiniesz, i zostaną odmienione. Ty zaś jesteś ten sam, a twoje lata się nie skończą."
  tags: []
"Hbr1,13":
  text: "Do którego też z aniołów kiedykolwiek powiedział: Siądź po mojej prawicy, aż położę twoich nieprzyjaciół jako podnóżek pod twoje stopy?"
  tags: []
"Hbr1,14":
  text: "Czy nie są oni wszyscy duchami służebnymi, posyłanymi, by służyć tym, którzy mają odziedziczyć zbawienie?"
  tags: []
