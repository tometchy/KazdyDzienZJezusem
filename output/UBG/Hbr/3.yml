"Hbr3,1":
  text: "Dlatego, bracia święci, uczestnicy niebieskiego powołania, zwróćcie uwagę na Apostoła i Najwyższego Kapłana naszego wyznania, Chrystusa Jezusa;"
  tags: []
"Hbr3,2":
  text: "Wiernego temu, który go ustanowił, podobnie jak Mojżesz był w całym jego domu."
  tags: []
"Hbr3,3":
  text: "Tym większej bowiem chwały jest on godzien od Mojżesza, im większą cześć od domu ma jego budowniczy."
  tags: []
"Hbr3,4":
  text: "Bo każdy dom jest przez kogoś zbudowany, lecz tym, który wszystko zbudował, jest Bóg."
  tags: []
"Hbr3,5":
  text: "I Mojżesz wprawdzie był wierny w całym jego domu jako sługa, na świadectwo tego, co potem miało być powiedziane;"
  tags: []
"Hbr3,6":
  text: "Lecz Chrystus jako syn panuje nad swoim domem. Jego domem my jesteśmy, jeśli tylko ufność i chwalebną nadzieję aż do końca niewzruszenie zachowamy."
  tags: []
"Hbr3,7":
  text: "Dlatego, jak mówi Duch Święty: Dzisiaj, jeśli usłyszycie jego głos;"
  tags: []
"Hbr3,8":
  text: "Nie zatwardzajcie waszych serc jak podczas rozdrażnienia, w dniu próby na pustyni;"
  tags: []
"Hbr3,9":
  text: "Gdzie mnie wystawiali na próbę wasi ojcowie i doświadczali, i oglądali moje dzieła przez czterdzieści lat."
  tags: []
"Hbr3,10":
  text: "Dlatego się rozgniewałem na to pokolenie i powiedziałem: Oni zawsze błądzą sercem i nie poznali moich dróg;"
  tags: []
"Hbr3,11":
  text: "Toteż przysiągłem w moim gniewie, że nie wejdą do mojego odpoczynku."
  tags: []
"Hbr3,12":
  text: "Uważajcie, bracia, żeby nie było czasem w kimś z was przewrotnego serca niewiary, które by odstępowało od Boga żywego;"
  tags: []
"Hbr3,13":
  text: "Lecz zachęcajcie się wzajemnie każdego dnia, dopóki nazywa się „Dzisiaj”, aby nikt z was nie popadł w zatwardziałość przez oszustwo grzechu."
  tags: []
"Hbr3,14":
  text: "Staliśmy się bowiem uczestnikami Chrystusa, jeśli tylko nasze pierwotne przeświadczenie aż do końca niewzruszenie zachowamy."
  tags: []
"Hbr3,15":
  text: "Dopóki jest powiedziane: Dzisiaj, jeśli usłyszycie jego głos, nie zatwardzajcie waszych serc jak w dniu rozdrażnienia."
  tags: []
"Hbr3,16":
  text: "Niektórzy bowiem, usłyszawszy, rozdrażnili Pana, ale nie wszyscy z tych, którzy wyszli z Egiptu pod wodzą Mojżesza."
  tags: []
"Hbr3,17":
  text: "A na kogo gniewał się przez czterdzieści lat? Czy nie na tych, którzy zgrzeszyli, a których ciała legły na pustyni?"
  tags: []
"Hbr3,18":
  text: "A którym przysiągł, że nie wejdą do jego odpoczynku, jeśli nie tym, którzy byli nieposłuszni?"
  tags: []
"Hbr3,19":
  text: "Widzimy więc, że nie mogli wejść z powodu niewiary."
  tags: []
