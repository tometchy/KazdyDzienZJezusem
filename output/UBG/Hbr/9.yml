"Hbr9,1":
  text: "Wprawdzie i pierwsze przymierze miało przepisy o służbie Bożej oraz ziemską świątynię."
  tags: []
"Hbr9,2":
  text: "Został bowiem zbudowany przybytek, w którego pierwszej części, zwanej Miejscem Świętym, znajdował się świecznik, stół i chleby pokładne."
  tags: []
"Hbr9,3":
  text: "Za drugą zaś zasłoną był przybytek, który zwano Miejscem Najświętszym."
  tags: []
"Hbr9,4":
  text: "Posiadało ono złotą kadzielnicę i arkę przymierza całą pokrytą złotem, w której było złote naczynie z manną, laska Aarona, która zakwitła, i tablice przymierza."
  tags: []
"Hbr9,5":
  text: "Nad arką były cherubiny chwały, które zacieniały przebłagalnię. Nie ma teraz potrzeby szczegółowo o tym wszystkim mówić."
  tags: []
"Hbr9,6":
  text: "A odkąd zostało to tak urządzone, do pierwszej części przybytku zawsze wchodzą kapłani pełniący służbę Bożą;"
  tags: []
"Hbr9,7":
  text: "Do drugiej zaś raz w roku tylko sam najwyższy kapłan, i to nie bez krwi, którą ofiaruje za siebie i za grzechy niewiedzy ludu."
  tags: []
"Hbr9,8":
  text: "W ten sposób Duch Święty pokazuje, że jeszcze nie została objawiona droga do Miejsca Najświętszego, dopóki jeszcze stał pierwszy przybytek."
  tags: []
"Hbr9,9":
  text: "Był on obrazem na tamten czas, a składano w nim dary i ofiary, które nie mogły uczynić doskonałym w sumieniu tego, który pełnił służbę Bożą;"
  tags: []
"Hbr9,10":
  text: "Która polegała tylko na pokarmach, napojach i różnych obmyciach, i przepisach cielesnych nałożonych aż do czasu naprawy."
  tags: []
"Hbr9,11":
  text: "Lecz Chrystus, gdy przyszedł jako najwyższy kapłan dóbr przyszłych, przez większy i doskonalszy przybytek, nieuczyniony ręką, to jest nienależący do tego budynku;"
  tags: []
"Hbr9,12":
  text: "Ani nie przez krew kozłów i cieląt, ale przez własną krew wszedł raz do Miejsca Najświętszego, zdobywszy wieczne odkupienie."
  tags: []
"Hbr9,13":
  text: "Jeśli bowiem krew wołów i kozłów oraz popiół z jałówki, którymi skrapia się nieczystych, uświęca aż do oczyszczenia ciała;"
  tags: []
"Hbr9,14":
  text: "To o ileż bardziej krew Chrystusa, który przez Ducha wiecznego ofiarował Bogu samego siebie bez skazy, oczyści wasze sumienie z martwych uczynków, by służyć Bogu żywemu?"
  tags: []
"Hbr9,15":
  text: "I dlatego jest pośrednikiem nowego testamentu, ażeby przez śmierć poniesioną dla odkupienia występków, popełnionych za pierwszego testamentu, ci, którzy zostali powołani, otrzymali obietnicę wiecznego dziedzictwa."
  tags: []
"Hbr9,16":
  text: "Gdzie bowiem jest testament, tam musi nastąpić śmierć tego, który go sporządził."
  tags: []
"Hbr9,17":
  text: "Testament przecież nabiera mocy po śmierci, gdyż nie jest ważny, dopóki żyje ten, kto sporządził testament."
  tags: []
"Hbr9,18":
  text: "Dlatego i pierwszy testament nie był zapoczątkowany bez krwi."
  tags: []
"Hbr9,19":
  text: "Gdy bowiem Mojżesz ogłosił całemu ludowi każde przykazanie zgodnie z prawem, wziął krew cieląt i kozłów z wodą, wełną szkarłatną i hizopem i pokropił zarówno samą księgę, jak i cały lud;"
  tags: []
"Hbr9,20":
  text: "Mówiąc: To jest krew przymierza, które Bóg dla was ustanowił."
  tags: []
"Hbr9,21":
  text: "Podobnie też pokropił krwią przybytek i wszystkie naczynia przeznaczone do służby Bożej."
  tags: []
"Hbr9,22":
  text: "I prawie wszystko jest oczyszczane krwią zgodnie z prawem, a bez przelania krwi nie ma przebaczenia grzechów."
  tags: []
"Hbr9,23":
  text: "Było więc konieczne, aby obrazy rzeczy, które są w niebie, były oczyszczone w ten sposób, same zaś rzeczy niebiańskie – lepszymi ofiarami od tamtych."
  tags: []
"Hbr9,24":
  text: "Chrystus bowiem wszedł nie do świątyni zbudowanej ręką, która była odbiciem prawdziwej, ale do samego nieba, aby teraz stawać dla nas przed obliczem Boga;"
  tags: []
"Hbr9,25":
  text: "I nie po to, żeby często ofiarować samego siebie jak najwyższy kapłan, który wchodzi co roku do Miejsca Najświętszego z cudzą krwią;"
  tags: []
"Hbr9,26":
  text: "Bo inaczej musiałby cierpieć wiele razy od początku świata. Lecz teraz na końcu wieków pojawił się raz dla zgładzenia grzechu przez ofiarowanie samego siebie."
  tags: []
"Hbr9,27":
  text: "A jak jest postanowione ludziom raz umrzeć, a potem sąd;"
  tags: []
"Hbr9,28":
  text: "Tak też Chrystus raz ofiarowany na zgładzenie grzechów wielu, drugi raz ukaże się bez grzechu tym, którzy go oczekują dla zbawienia."
  tags: []
