"Hbr9,1": "Wprawdzie i pierwsze przymierze miało przepisy o służbie Bożej oraz ziemską świątynię."
"Hbr9,2": "Został bowiem zbudowany przybytek, w którego pierwszej części, zwanej Miejscem Świętym, znajdował się świecznik, stół i chleby pokładne."
"Hbr9,3": "Za drugą zaś zasłoną był przybytek, który zwano Miejscem Najświętszym."
"Hbr9,4": "Posiadało ono złotą kadzielnicę i arkę przymierza całą pokrytą złotem, w której było złote naczynie z manną, laska Aarona, która zakwitła, i tablice przymierza."
"Hbr9,5": "Nad arką były cherubiny chwały, które zacieniały przebłagalnię. Nie ma teraz potrzeby szczegółowo o tym wszystkim mówić."
"Hbr9,6": "A odkąd zostało to tak urządzone, do pierwszej części przybytku zawsze wchodzą kapłani pełniący służbę Bożą;"
"Hbr9,7": "Do drugiej zaś raz w roku tylko sam najwyższy kapłan, i to nie bez krwi, którą ofiaruje za siebie i za grzechy niewiedzy ludu."
"Hbr9,8": "W ten sposób Duch Święty pokazuje, że jeszcze nie została objawiona droga do Miejsca Najświętszego, dopóki jeszcze stał pierwszy przybytek."
"Hbr9,9": "Był on obrazem na tamten czas, a składano w nim dary i ofiary, które nie mogły uczynić doskonałym w sumieniu tego, który pełnił służbę Bożą;"
"Hbr9,10": "Która polegała tylko na pokarmach, napojach i różnych obmyciach, i przepisach cielesnych nałożonych aż do czasu naprawy."
"Hbr9,11": "Lecz Chrystus, gdy przyszedł jako najwyższy kapłan dóbr przyszłych, przez większy i doskonalszy przybytek, nieuczyniony ręką, to jest nienależący do tego budynku;"
"Hbr9,12": "Ani nie przez krew kozłów i cieląt, ale przez własną krew wszedł raz do Miejsca Najświętszego, zdobywszy wieczne odkupienie."
"Hbr9,13": "Jeśli bowiem krew wołów i kozłów oraz popiół z jałówki, którymi skrapia się nieczystych, uświęca aż do oczyszczenia ciała;"
"Hbr9,14": "To o ileż bardziej krew Chrystusa, który przez Ducha wiecznego ofiarował Bogu samego siebie bez skazy, oczyści wasze sumienie z martwych uczynków, by służyć Bogu żywemu?"
"Hbr9,15": "I dlatego jest pośrednikiem nowego testamentu, ażeby przez śmierć poniesioną dla odkupienia występków, popełnionych za pierwszego testamentu, ci, którzy zostali powołani, otrzymali obietnicę wiecznego dziedzictwa."
"Hbr9,16": "Gdzie bowiem jest testament, tam musi nastąpić śmierć tego, który go sporządził."
"Hbr9,17": "Testament przecież nabiera mocy po śmierci, gdyż nie jest ważny, dopóki żyje ten, kto sporządził testament."
"Hbr9,18": "Dlatego i pierwszy testament nie był zapoczątkowany bez krwi."
"Hbr9,19": "Gdy bowiem Mojżesz ogłosił całemu ludowi każde przykazanie zgodnie z prawem, wziął krew cieląt i kozłów z wodą, wełną szkarłatną i hizopem i pokropił zarówno samą księgę, jak i cały lud;"
"Hbr9,20": "Mówiąc: To jest krew przymierza, które Bóg dla was ustanowił."
"Hbr9,21": "Podobnie też pokropił krwią przybytek i wszystkie naczynia przeznaczone do służby Bożej."
"Hbr9,22": "I prawie wszystko jest oczyszczane krwią zgodnie z prawem, a bez przelania krwi nie ma przebaczenia grzechów."
"Hbr9,23": "Było więc konieczne, aby obrazy rzeczy, które są w niebie, były oczyszczone w ten sposób, same zaś rzeczy niebiańskie – lepszymi ofiarami od tamtych."
"Hbr9,24": "Chrystus bowiem wszedł nie do świątyni zbudowanej ręką, która była odbiciem prawdziwej, ale do samego nieba, aby teraz stawać dla nas przed obliczem Boga;"
"Hbr9,25": "I nie po to, żeby często ofiarować samego siebie jak najwyższy kapłan, który wchodzi co roku do Miejsca Najświętszego z cudzą krwią;"
"Hbr9,26": "Bo inaczej musiałby cierpieć wiele razy od początku świata. Lecz teraz na końcu wieków pojawił się raz dla zgładzenia grzechu przez ofiarowanie samego siebie."
"Hbr9,27": "A jak jest postanowione ludziom raz umrzeć, a potem sąd;"
"Hbr9,28": "Tak też Chrystus raz ofiarowany na zgładzenie grzechów wielu, drugi raz ukaże się bez grzechu tym, którzy go oczekują dla zbawienia."
