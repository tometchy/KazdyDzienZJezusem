"Hbr6,1": "Dlatego zostawmy podstawowe nauki o Chrystusie i przejdźmy do tego, co doskonałe, nie zakładając ponownie fundamentu, którym jest pokuta od martwych uczynków i wiara w Boga;"
"Hbr6,2": "Nauka o chrztach i nakładaniu rąk, o zmartwychwstaniu umarłych i sądzie wiecznym."
"Hbr6,3": "I to uczynimy, jeśli Bóg pozwoli."
"Hbr6,4": "Niemożliwe jest bowiem, żeby tych, którzy raz zostali oświeceni i zakosztowali daru niebieskiego, i stali się uczestnikami Ducha Świętego;"
"Hbr6,5": "Zakosztowali też dobrego słowa Bożego i mocy przyszłego wieku;"
"Hbr6,6": "A odpadli – ponownie odnowić ku pokucie, gdyż sami sobie znowu krzyżują Syna Bożego i wystawiają go na hańbę."
"Hbr6,7": "Ziemia bowiem, która pije deszcz często na nią spadający i rodzi rośliny użyteczne dla tych, którzy ją uprawiają, otrzymuje błogosławieństwo od Boga."
"Hbr6,8": "Lecz ta, która wydaje ciernie i osty, jest odrzucona i bliska przekleństwa, a jej końcem jest spalenie."
"Hbr6,9": "Ale chociaż tak mówimy, umiłowani, jesteśmy co do was przekonani o czymś lepszym i towarzyszącym zbawieniu."
"Hbr6,10": "Bóg bowiem nie jest niesprawiedliwy, aby miał zapomnieć o waszym dziele i trudzie miłości, którą okazaliście dla jego imienia, gdy służyliście świętym i nadal służycie."
"Hbr6,11": "Pragniemy zaś, aby każdy z was okazywał tę samą gorliwość, żebyście mieli pełnię nadziei aż do końca;"
"Hbr6,12": "Abyście nie byli ociężali, ale naśladowali tych, którzy przez wiarę i cierpliwość dziedziczą obietnice."
"Hbr6,13": "Gdy bowiem Bóg dał obietnicę Abrahamowi, a nie miał nikogo większego, na kogo mógłby przysiąc, przysiągł na siebie samego;"
"Hbr6,14": "Mówiąc: Zaprawdę, błogosławiąc, błogosławić ci będę i rozmnażając, rozmnożę cię."
"Hbr6,15": "A ponieważ tak cierpliwie czekał, dostąpił spełnienia obietnicy."
"Hbr6,16": "Ludzie bowiem przysięgają na kogoś większego, a przysięga dla potwierdzenia jest zakończeniem wszystkich sporów między nimi."
"Hbr6,17": "Dlatego też Bóg, chcąc dobitniej okazać dziedzicom obietnicy niezmienność swojego postanowienia, poręczył ją przysięgą;"
"Hbr6,18": "Abyśmy przez dwie niezmienne rzeczy, w których jest niemożliwe, aby Bóg kłamał, mieli silną pociechę, my, którzy uciekliśmy, by pochwycić się zaoferowanej nam nadziei;"
"Hbr6,19": "Którą mamy jako kotwicę duszy, bezpieczną i niewzruszoną, sięgającą poza zasłonę;"
"Hbr6,20": "Gdzie jako poprzednik wszedł dla nas Jezus, stawszy się najwyższym kapłanem na wieki według porządku Melchizedeka."
