"Hbr6,1":
  text: "Dlatego zostawmy podstawowe nauki o Chrystusie i przejdźmy do tego, co doskonałe, nie zakładając ponownie fundamentu, którym jest pokuta od martwych uczynków i wiara w Boga;"
  tags: []
"Hbr6,2":
  text: "Nauka o chrztach i nakładaniu rąk, o zmartwychwstaniu umarłych i sądzie wiecznym."
  tags: []
"Hbr6,3":
  text: "I to uczynimy, jeśli Bóg pozwoli."
  tags: []
"Hbr6,4":
  text: "Niemożliwe jest bowiem, żeby tych, którzy raz zostali oświeceni i zakosztowali daru niebieskiego, i stali się uczestnikami Ducha Świętego;"
  tags: []
"Hbr6,5":
  text: "Zakosztowali też dobrego słowa Bożego i mocy przyszłego wieku;"
  tags: []
"Hbr6,6":
  text: "A odpadli – ponownie odnowić ku pokucie, gdyż sami sobie znowu krzyżują Syna Bożego i wystawiają go na hańbę."
  tags: []
"Hbr6,7":
  text: "Ziemia bowiem, która pije deszcz często na nią spadający i rodzi rośliny użyteczne dla tych, którzy ją uprawiają, otrzymuje błogosławieństwo od Boga."
  tags: []
"Hbr6,8":
  text: "Lecz ta, która wydaje ciernie i osty, jest odrzucona i bliska przekleństwa, a jej końcem jest spalenie."
  tags: []
"Hbr6,9":
  text: "Ale chociaż tak mówimy, umiłowani, jesteśmy co do was przekonani o czymś lepszym i towarzyszącym zbawieniu."
  tags: []
"Hbr6,10":
  text: "Bóg bowiem nie jest niesprawiedliwy, aby miał zapomnieć o waszym dziele i trudzie miłości, którą okazaliście dla jego imienia, gdy służyliście świętym i nadal służycie."
  tags: []
"Hbr6,11":
  text: "Pragniemy zaś, aby każdy z was okazywał tę samą gorliwość, żebyście mieli pełnię nadziei aż do końca;"
  tags: []
"Hbr6,12":
  text: "Abyście nie byli ociężali, ale naśladowali tych, którzy przez wiarę i cierpliwość dziedziczą obietnice."
  tags: []
"Hbr6,13":
  text: "Gdy bowiem Bóg dał obietnicę Abrahamowi, a nie miał nikogo większego, na kogo mógłby przysiąc, przysiągł na siebie samego;"
  tags: []
"Hbr6,14":
  text: "Mówiąc: Zaprawdę, błogosławiąc, błogosławić ci będę i rozmnażając, rozmnożę cię."
  tags: []
"Hbr6,15":
  text: "A ponieważ tak cierpliwie czekał, dostąpił spełnienia obietnicy."
  tags: []
"Hbr6,16":
  text: "Ludzie bowiem przysięgają na kogoś większego, a przysięga dla potwierdzenia jest zakończeniem wszystkich sporów między nimi."
  tags: []
"Hbr6,17":
  text: "Dlatego też Bóg, chcąc dobitniej okazać dziedzicom obietnicy niezmienność swojego postanowienia, poręczył ją przysięgą;"
  tags: []
"Hbr6,18":
  text: "Abyśmy przez dwie niezmienne rzeczy, w których jest niemożliwe, aby Bóg kłamał, mieli silną pociechę, my, którzy uciekliśmy, by pochwycić się zaoferowanej nam nadziei;"
  tags: []
"Hbr6,19":
  text: "Którą mamy jako kotwicę duszy, bezpieczną i niewzruszoną, sięgającą poza zasłonę;"
  tags: []
"Hbr6,20":
  text: "Gdzie jako poprzednik wszedł dla nas Jezus, stawszy się najwyższym kapłanem na wieki według porządku Melchizedeka."
  tags: []
