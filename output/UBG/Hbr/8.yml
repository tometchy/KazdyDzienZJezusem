"Hbr8,1":
  text: "A oto podsumowanie tego, co mówimy: mamy takiego najwyższego kapłana, który zasiadł po prawicy tronu Majestatu w niebiosach."
  tags: []
"Hbr8,2":
  text: "Jest on sługą świątyni i prawdziwego przybytku zbudowanego przez Pana, a nie człowieka."
  tags: []
"Hbr8,3":
  text: "Każdy bowiem najwyższy kapłan jest ustanawiany do składania darów i ofiar. Dlatego było konieczne, żeby i ten miał co ofiarować."
  tags: []
"Hbr8,4":
  text: "Gdyby zaś był na ziemi, nie byłby kapłanem, gdyż są tu inni kapłani, którzy ofiarują dary zgodnie z prawem."
  tags: []
"Hbr8,5":
  text: "Służą oni obrazowi i cieniowi tego, co niebiańskie, jak Bóg powiedział Mojżeszowi, gdy miał zbudować przybytek: Uważaj – powiedział – abyś uczynił wszystko według wzoru, który ci został ukazany na górze."
  tags: []
"Hbr8,6":
  text: "Teraz zaś nasz kapłan o tyle znakomitszą otrzymał służbę, o ile jest pośrednikiem lepszego przymierza, które zostało oparte na lepszych obietnicach."
  tags: []
"Hbr8,7":
  text: "Gdyby bowiem to pierwsze było nienaganne, to nie szukano by miejsca na drugie."
  tags: []
"Hbr8,8":
  text: "Tymczasem, ganiąc ich, mówi: Oto nadchodzą dni, mówi Pan, gdy zawrę z domem Izraela i z domem Judy nowe przymierze."
  tags: []
"Hbr8,9":
  text: "Nie takie przymierze, jakie zawarłem z ich ojcami w dniu, gdy ująłem ich za rękę, aby ich wyprowadzić z ziemi Egiptu. Ponieważ oni nie wytrwali w moim przymierzu, ja też przestałem o nich dbać, mówi Pan."
  tags: []
"Hbr8,10":
  text: "Takie zaś jest przymierze, które zawrę z domem Izraela po tych dniach, mówi Pan: Dam moje prawa w ich umysły i wypiszę je na ich sercach. I będę im Bogiem, a oni będą mi ludem."
  tags: []
"Hbr8,11":
  text: "I nikt nie będzie uczył swego bliźniego ani nikt swego brata, mówiąc: Poznaj Pana, bo wszyscy będą mnie znali, od najmniejszego aż do największego z nich."
  tags: []
"Hbr8,12":
  text: "Będę bowiem łaskawy dla ich występków, a ich grzechów i nieprawości więcej nie wspomnę."
  tags: []
"Hbr8,13":
  text: "A gdy mówi „nowe”, uznaje pierwsze za przedawnione; a to, co się przedawnia i starzeje, bliskie jest zaniku."
  tags: []
