"Hbr5,1":
  text: "Każdy bowiem najwyższy kapłan wzięty spośród ludzi, dla ludzi jest ustanowiony w sprawach odnoszących się do Boga, aby składał dary i ofiary za grzechy;"
  tags: []
"Hbr5,2":
  text: "Który może współczuć nieświadomym i błądzącym, gdyż sam podlega słabościom."
  tags: []
"Hbr5,3":
  text: "I z tego powodu powinien, jak za lud, tak i za samego siebie składać ofiary za grzechy."
  tags: []
"Hbr5,4":
  text: "A nikt sam sobie nie bierze tej godności, tylko ten, który zostaje powołany przez Boga, tak jak Aaron."
  tags: []
"Hbr5,5":
  text: "Podobnie i Chrystus nie sam siebie okrył chwałą, aby stać się najwyższym kapłanem, ale ten, który powiedział do niego: Ty jesteś moim Synem, ja ciebie dziś zrodziłem."
  tags: []
"Hbr5,6":
  text: "Tak jak i w innym miejscu mówi: Ty jesteś kapłanem na wieki według porządku Melchizedeka."
  tags: []
"Hbr5,7":
  text: "On za dni swego ciała zanosił z głośnym wołaniem i ze łzami modlitwy i usilne prośby do tego, który mógł go wybawić od śmierci, i został wysłuchany z powodu swojej bogobojności."
  tags: []
"Hbr5,8":
  text: "Chociaż był Synem, nauczył się posłuszeństwa przez to, co wycierpiał."
  tags: []
"Hbr5,9":
  text: "A uczyniony doskonałym, stał się sprawcą wiecznego zbawienia dla wszystkich, którzy są mu posłuszni;"
  tags: []
"Hbr5,10":
  text: "Nazwany przez Boga najwyższym kapłanem według porządku Melchizedeka."
  tags: []
"Hbr5,11":
  text: "Wiele mamy o nim do powiedzenia, a trudno wam to wyjaśnić, ponieważ staliście się ociężali w słuchaniu."
  tags: []
"Hbr5,12":
  text: "Chociaż bowiem ze względu na czas powinniście być nauczycielami, znowu potrzebujecie, żeby was ktoś uczył początkowych zasad słów Bożych, i staliście się ludźmi, którzy potrzebują mleka, a nie stałego pokarmu."
  tags: []
"Hbr5,13":
  text: "Każdy bowiem, kto żywi się tylko mlekiem, jest niewprawny w słowie sprawiedliwości, bo jest niemowlęciem."
  tags: []
"Hbr5,14":
  text: "Natomiast pokarm stały jest dla dorosłych, którzy przez praktykę mają zmysły wyćwiczone do rozróżniania dobra i zła."
  tags: []
