"Hbr13,1":
  text: "Niech trwa braterska miłość."
  tags: []
"Hbr13,2":
  text: "Nie zapominajcie o gościnności, gdyż przez nią niektórzy, nie wiedząc, aniołów gościli."
  tags: []
"Hbr13,3":
  text: "Pamiętajcie o więźniach, jakbyście byli razem z nimi więzieni, o uciskanych, jako ci, którzy też jesteście w ciele."
  tags: []
"Hbr13,4":
  text: "Małżeństwo jest godne czci u wszystkich i łoże nieskalane. Rozpustników zaś i cudzołożników osądzi Bóg."
  tags: []
"Hbr13,5":
  text: "Wasze postępowanie niech będzie wolne od chciwości, poprzestawajcie na tym, co macie. Sam bowiem powiedział: Nie porzucę cię ani nie opuszczę."
  tags: []
"Hbr13,6":
  text: "Śmiało więc możemy mówić: Pan jest moim pomocnikiem, nie będę się lękał tego, co może mi uczynić człowiek."
  tags: []
"Hbr13,7":
  text: "Pamiętajcie o swoich przywódcach, którzy głosili wam słowo Boże, i rozważając koniec ich życia, naśladujcie ich wiarę."
  tags: []
"Hbr13,8":
  text: "Jezus Chrystus wczoraj i dziś, ten sam i na wieki."
  tags: []
"Hbr13,9":
  text: "Nie dajcie się zwieść rozmaitym i obcym naukom. Dobrze jest bowiem umacniać serce łaską, a nie pokarmami, co nie przyniosły pożytku tym, którzy się nimi zajmowali."
  tags: []
"Hbr13,10":
  text: "Mamy ołtarz, z którego nie mają prawa spożywać ci, którzy służą przybytkowi."
  tags: []
"Hbr13,11":
  text: "Ciała bowiem tych zwierząt, których krew najwyższy kapłan wnosi do Najświętszego Miejsca za grzech, są spalane za obozem."
  tags: []
"Hbr13,12":
  text: "Dlatego i Jezus, aby uświęcić lud własną krwią, cierpiał poza bramą."
  tags: []
"Hbr13,13":
  text: "Wyjdźmy więc do niego poza obóz, biorąc na siebie jego pohańbienie."
  tags: []
"Hbr13,14":
  text: "Nie mamy tu bowiem miasta trwałego, lecz tego przyszłego szukamy."
  tags: []
"Hbr13,15":
  text: "Przez niego więc nieustannie składajmy Bogu ofiarę chwały, to jest owoc warg, które wyznają jego imię."
  tags: []
"Hbr13,16":
  text: "Nie zapominajcie też o dobroczynności i udzieleniu dóbr, takie bowiem ofiary podobają się Bogu."
  tags: []
"Hbr13,17":
  text: "Bądźcie posłuszni waszym przywódcom i bądźcie im ulegli, ponieważ oni czuwają nad waszymi duszami jako ci, którzy muszą zdać z tego sprawę. Niech to czynią z radością, a nie ze wzdychaniem, bo to nie byłoby dla was korzystne."
  tags: []
"Hbr13,18":
  text: "Módlcie się za nas. Ufamy bowiem, że mamy czyste sumienie, gdyż chcemy we wszystkim dobrze postępować."
  tags: []
"Hbr13,19":
  text: "A tym bardziej proszę was, abyście to czynili, abym jak najszybciej został wam przywrócony."
  tags: []
"Hbr13,20":
  text: "A Bóg pokoju, który przez krew wiecznego przymierza wyprowadził spośród umarłych wielkiego pasterza owiec, naszego Pana Jezusa;"
  tags: []
"Hbr13,21":
  text: "Niech was uczyni doskonałymi w każdym dobrym uczynku, abyście spełniali jego wolę, dokonując w was tego, co miłe w jego oczach, przez Jezusa Chrystusa, któremu chwała na wieki wieków. Amen."
  tags: []
"Hbr13,22":
  text: "A proszę was, bracia, przyjmijcie to słowo zachęty, bo krótki list do was napisałem."
  tags: []
"Hbr13,23":
  text: "Wiedzcie, że brat Tymoteusz został uwolniony. Jeśli niedługo przybędzie, wraz z nim was zobaczę."
  tags: []
"Hbr13,24":
  text: "Pozdrówcie wszystkich waszych przywódców i wszystkich świętych. Pozdrawiają was bracia, którzy są z Italii."
  tags: []
"Hbr13,25":
  text: "Łaska niech będzie z wami wszystkimi. Amen."
  tags: []
