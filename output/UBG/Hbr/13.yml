"Hbr13,1": "Niech trwa braterska miłość."
"Hbr13,2": "Nie zapominajcie o gościnności, gdyż przez nią niektórzy, nie wiedząc, aniołów gościli."
"Hbr13,3": "Pamiętajcie o więźniach, jakbyście byli razem z nimi więzieni, o uciskanych, jako ci, którzy też jesteście w ciele."
"Hbr13,4": "Małżeństwo jest godne czci u wszystkich i łoże nieskalane. Rozpustników zaś i cudzołożników osądzi Bóg."
"Hbr13,5": "Wasze postępowanie niech będzie wolne od chciwości, poprzestawajcie na tym, co macie. Sam bowiem powiedział: Nie porzucę cię ani nie opuszczę."
"Hbr13,6": "Śmiało więc możemy mówić: Pan jest moim pomocnikiem, nie będę się lękał tego, co może mi uczynić człowiek."
"Hbr13,7": "Pamiętajcie o swoich przywódcach, którzy głosili wam słowo Boże, i rozważając koniec ich życia, naśladujcie ich wiarę."
"Hbr13,8": "Jezus Chrystus wczoraj i dziś, ten sam i na wieki."
"Hbr13,9": "Nie dajcie się zwieść rozmaitym i obcym naukom. Dobrze jest bowiem umacniać serce łaską, a nie pokarmami, co nie przyniosły pożytku tym, którzy się nimi zajmowali."
"Hbr13,10": "Mamy ołtarz, z którego nie mają prawa spożywać ci, którzy służą przybytkowi."
"Hbr13,11": "Ciała bowiem tych zwierząt, których krew najwyższy kapłan wnosi do Najświętszego Miejsca za grzech, są spalane za obozem."
"Hbr13,12": "Dlatego i Jezus, aby uświęcić lud własną krwią, cierpiał poza bramą."
"Hbr13,13": "Wyjdźmy więc do niego poza obóz, biorąc na siebie jego pohańbienie."
"Hbr13,14": "Nie mamy tu bowiem miasta trwałego, lecz tego przyszłego szukamy."
"Hbr13,15": "Przez niego więc nieustannie składajmy Bogu ofiarę chwały, to jest owoc warg, które wyznają jego imię."
"Hbr13,16": "Nie zapominajcie też o dobroczynności i udzieleniu dóbr, takie bowiem ofiary podobają się Bogu."
"Hbr13,17": "Bądźcie posłuszni waszym przywódcom i bądźcie im ulegli, ponieważ oni czuwają nad waszymi duszami jako ci, którzy muszą zdać z tego sprawę. Niech to czynią z radością, a nie ze wzdychaniem, bo to nie byłoby dla was korzystne."
"Hbr13,18": "Módlcie się za nas. Ufamy bowiem, że mamy czyste sumienie, gdyż chcemy we wszystkim dobrze postępować."
"Hbr13,19": "A tym bardziej proszę was, abyście to czynili, abym jak najszybciej został wam przywrócony."
"Hbr13,20": "A Bóg pokoju, który przez krew wiecznego przymierza wyprowadził spośród umarłych wielkiego pasterza owiec, naszego Pana Jezusa;"
"Hbr13,21": "Niech was uczyni doskonałymi w każdym dobrym uczynku, abyście spełniali jego wolę, dokonując w was tego, co miłe w jego oczach, przez Jezusa Chrystusa, któremu chwała na wieki wieków. Amen."
"Hbr13,22": "A proszę was, bracia, przyjmijcie to słowo zachęty, bo krótki list do was napisałem."
"Hbr13,23": "Wiedzcie, że brat Tymoteusz został uwolniony. Jeśli niedługo przybędzie, wraz z nim was zobaczę."
"Hbr13,24": "Pozdrówcie wszystkich waszych przywódców i wszystkich świętych. Pozdrawiają was bracia, którzy są z Italii."
"Hbr13,25": "Łaska niech będzie z wami wszystkimi. Amen."
