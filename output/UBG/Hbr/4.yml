"Hbr4,1":
  text: "Bójmy się więc, gdy jeszcze trwa obietnica wejścia do jego odpoczynku, aby czasem się nie okazało, że ktoś z was jej nie osiągnął."
  tags: []
"Hbr4,2":
  text: "I nam bowiem głoszono ewangelię jak i tamtym. Lecz tamtym nie pomogło słowo, które słyszeli, gdyż nie było powiązane z wiarą tych, którzy je słyszeli."
  tags: []
"Hbr4,3":
  text: "Bo do odpoczynku wchodzimy my, którzy uwierzyliśmy, jak powiedział: Dlatego przysiągłem w moim gniewie, że nie wejdą do mojego odpoczynku, choć jego dzieła były dokonane od założenia świata."
  tags: []
"Hbr4,4":
  text: "Powiedział bowiem w pewnym miejscu o siódmym dniu tak: I odpoczął Bóg siódmego dnia od wszystkich swoich dzieł."
  tags: []
"Hbr4,5":
  text: "A tutaj znowu: Nie wejdą do mego odpoczynku."
  tags: []
"Hbr4,6":
  text: "Ponieważ więc jest tak, że niektórzy mają wejść do niego, a ci, którym najpierw głoszono, nie weszli z powodu niewiary;"
  tags: []
"Hbr4,7":
  text: "Znowu wyznacza pewien dzień, mówiąc przez Dawida po tak długim czasie „Dzisiaj”, jak to zostało powiedziane: Dzisiaj, jeśli usłyszycie jego głos, nie zatwardzajcie waszych serc."
  tags: []
"Hbr4,8":
  text: "Gdyby bowiem Jozue zapewnił im odpoczynek, Bóg nie mówiłby potem o innym dniu."
  tags: []
"Hbr4,9":
  text: "A tak zostaje jeszcze odpoczynek dla ludu Bożego."
  tags: []
"Hbr4,10":
  text: "Kto bowiem wszedł do jego odpoczynku, on także odpoczął od swoich czynów, tak jak Bóg od swoich."
  tags: []
"Hbr4,11":
  text: "Starajmy się więc wejść do owego odpoczynku, aby nikt nie wpadł w ten sam przykład niewiary."
  tags: []
"Hbr4,12":
  text: "Słowo Boże bowiem jest żywe i skuteczne, ostrzejsze niż wszelki miecz obosieczny, przenikające aż do rozdzielenia duszy i ducha, stawów i szpiku, zdolne rozsądzić myśli i zamiary serca."
  tags: []
"Hbr4,13":
  text: "Żadne stworzenie nie ukryje się przed nim, przeciwnie, wszystko jest obnażone i odkryte przed oczami tego, któremu musimy zdać sprawę."
  tags: []
"Hbr4,14":
  text: "Mając więc wielkiego najwyższego kapłana, który przeszedł przez niebiosa, Jezusa, Syna Bożego, trzymajmy się naszego wyznania."
  tags: []
"Hbr4,15":
  text: "Nie mamy bowiem najwyższego kapłana, który by nie mógł współczuć naszym słabościom, lecz kuszonego we wszystkim podobnie jak my, ale bez grzechu."
  tags: []
"Hbr4,16":
  text: "Przystąpmy więc z ufnością do tronu łaski, abyśmy dostąpili miłosierdzia i znaleźli łaskę ku pomocy w stosownej chwili."
  tags: []
