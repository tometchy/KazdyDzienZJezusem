"Hbr4,1": "Bójmy się więc, gdy jeszcze trwa obietnica wejścia do jego odpoczynku, aby czasem się nie okazało, że ktoś z was jej nie osiągnął."
"Hbr4,2": "I nam bowiem głoszono ewangelię jak i tamtym. Lecz tamtym nie pomogło słowo, które słyszeli, gdyż nie było powiązane z wiarą tych, którzy je słyszeli."
"Hbr4,3": "Bo do odpoczynku wchodzimy my, którzy uwierzyliśmy, jak powiedział: Dlatego przysiągłem w moim gniewie, że nie wejdą do mojego odpoczynku, choć jego dzieła były dokonane od założenia świata."
"Hbr4,4": "Powiedział bowiem w pewnym miejscu o siódmym dniu tak: I odpoczął Bóg siódmego dnia od wszystkich swoich dzieł."
"Hbr4,5": "A tutaj znowu: Nie wejdą do mego odpoczynku."
"Hbr4,6": "Ponieważ więc jest tak, że niektórzy mają wejść do niego, a ci, którym najpierw głoszono, nie weszli z powodu niewiary;"
"Hbr4,7": "Znowu wyznacza pewien dzień, mówiąc przez Dawida po tak długim czasie „Dzisiaj”, jak to zostało powiedziane: Dzisiaj, jeśli usłyszycie jego głos, nie zatwardzajcie waszych serc."
"Hbr4,8": "Gdyby bowiem Jozue zapewnił im odpoczynek, Bóg nie mówiłby potem o innym dniu."
"Hbr4,9": "A tak zostaje jeszcze odpoczynek dla ludu Bożego."
"Hbr4,10": "Kto bowiem wszedł do jego odpoczynku, on także odpoczął od swoich czynów, tak jak Bóg od swoich."
"Hbr4,11": "Starajmy się więc wejść do owego odpoczynku, aby nikt nie wpadł w ten sam przykład niewiary."
"Hbr4,12": "Słowo Boże bowiem jest żywe i skuteczne, ostrzejsze niż wszelki miecz obosieczny, przenikające aż do rozdzielenia duszy i ducha, stawów i szpiku, zdolne rozsądzić myśli i zamiary serca."
"Hbr4,13": "Żadne stworzenie nie ukryje się przed nim, przeciwnie, wszystko jest obnażone i odkryte przed oczami tego, któremu musimy zdać sprawę."
"Hbr4,14": "Mając więc wielkiego najwyższego kapłana, który przeszedł przez niebiosa, Jezusa, Syna Bożego, trzymajmy się naszego wyznania."
"Hbr4,15": "Nie mamy bowiem najwyższego kapłana, który by nie mógł współczuć naszym słabościom, lecz kuszonego we wszystkim podobnie jak my, ale bez grzechu."
"Hbr4,16": "Przystąpmy więc z ufnością do tronu łaski, abyśmy dostąpili miłosierdzia i znaleźli łaskę ku pomocy w stosownej chwili."
