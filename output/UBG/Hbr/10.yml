"Hbr10,1":
  text: "Prawo bowiem, zawierając cień przyszłych dóbr, a nie sam obraz rzeczy, nie może nigdy przez te same ofiary, które co roku są nieustannie składane, uczynić doskonałymi tych, którzy przychodzą."
  tags: []
"Hbr10,2":
  text: "W przeciwnym razie przestano by je składać, dlatego że składający je, raz oczyszczeni, nie mieliby już żadnych grzechów na sumieniu."
  tags: []
"Hbr10,3":
  text: "A jednak przez te ofiary każdego roku odbywa się przypominanie grzechów."
  tags: []
"Hbr10,4":
  text: "Niemożliwe jest bowiem, aby krew wołów i kozłów gładziła grzechy."
  tags: []
"Hbr10,5":
  text: "Dlatego przychodząc na świat, mówi: Ofiary ani daru nie chciałeś, ale przygotowałeś mi ciało."
  tags: []
"Hbr10,6":
  text: "Całopalenia i ofiary za grzech nie podobały się tobie."
  tags: []
"Hbr10,7":
  text: "Wtedy powiedziałem: Oto przychodzę – na początku księgi jest napisane o mnie – abym spełniał twoją wolę, o Boże."
  tags: []
"Hbr10,8":
  text: "Powiedziawszy wyżej: Ofiar, darów, całopaleń i ofiar za grzech nie chciałeś i nie podobały się tobie, choć składa się je zgodnie z prawem;"
  tags: []
"Hbr10,9":
  text: "Następnie powiedział: Oto przychodzę, abym spełniał twoją wolę, o Boże. Znosi pierwsze, aby ustanowić drugie."
  tags: []
"Hbr10,10":
  text: "Za sprawą tej woli jesteśmy uświęceni przez ofiarę ciała Jezusa Chrystusa raz na zawsze."
  tags: []
"Hbr10,11":
  text: "A każdy kapłan staje codziennie do wykonywania służby Bożej, wiele razy składając te same ofiary, które nigdy nie mogą zgładzić grzechów."
  tags: []
"Hbr10,12":
  text: "Lecz ten, gdy złożył jedną ofiarę za grzechy na zawsze, zasiadł po prawicy Boga;"
  tags: []
"Hbr10,13":
  text: "Oczekując odtąd, aż jego nieprzyjaciele będą położeni jako podnóżek pod jego stopy."
  tags: []
"Hbr10,14":
  text: "Jedną bowiem ofiarą uczynił doskonałymi na zawsze tych, którzy są uświęceni."
  tags: []
"Hbr10,15":
  text: "A poświadcza nam to także Duch Święty. Bo powiedziawszy najpierw:"
  tags: []
"Hbr10,16":
  text: "Takie jest przymierze, które zawrę z nimi po tych dniach, mówi Pan: Włożę moje prawa w ich serca i wypiszę je na ich umysłach;"
  tags: []
"Hbr10,17":
  text: "Potem dodaje: A ich grzechów i nieprawości więcej nie wspomnę."
  tags: []
"Hbr10,18":
  text: "Gdzie zaś jest ich odpuszczenie, tam nie potrzeba już ofiary za grzech."
  tags: []
"Hbr10,19":
  text: "Mając więc, bracia, śmiałość, aby przez krew Jezusa wejść do Najświętszego Miejsca;"
  tags: []
"Hbr10,20":
  text: "Drogą nową i żywą, którą zapoczątkował dla nas przez zasłonę, to jest przez swoje ciało;"
  tags: []
"Hbr10,21":
  text: "I mając wielkiego kapłana nad domem Bożym;"
  tags: []
"Hbr10,22":
  text: "Zbliżmy się ze szczerym sercem, w pełni wiary, mając serca oczyszczone od złego sumienia i ciało obmyte czystą wodą."
  tags: []
"Hbr10,23":
  text: "Trzymajmy wyznanie nadziei niechwiejące się, bo wierny jest ten, który obiecał."
  tags: []
"Hbr10,24":
  text: "I okazujmy staranie jedni o drugich, by pobudzać się do miłości i dobrych uczynków;"
  tags: []
"Hbr10,25":
  text: "Nie opuszczając naszego wspólnego zgromadzenia, jak to niektórzy mają w zwyczaju, ale zachęcając się nawzajem, i to tym bardziej, im bardziej widzicie, że zbliża się ten dzień."
  tags: []
"Hbr10,26":
  text: "Jeśli bowiem dobrowolnie grzeszymy po otrzymaniu poznania prawdy, to nie pozostaje już ofiara za grzechy;"
  tags: []
"Hbr10,27":
  text: "Lecz jakieś straszliwe oczekiwanie sądu i żar ognia, który strawić ma przeciwników."
  tags: []
"Hbr10,28":
  text: "Kto gardził Prawem Mojżesza, ponosił śmierć bez miłosierdzia na podstawie zeznania dwóch albo trzech świadków."
  tags: []
"Hbr10,29":
  text: "Jak wam się wydaje, na ileż surowszą karę zasługuje ten, kto by podeptał Syna Bożego i zbezcześcił krew przymierza, przez którą został uświęcony, i znieważył Ducha łaski?"
  tags: []
"Hbr10,30":
  text: "Znamy bowiem tego, który powiedział: Zemsta do mnie należy, ja odpłacę, mówi Pan. I znowu: Pan będzie sądzić swój lud."
  tags: []
"Hbr10,31":
  text: "Straszna to rzecz wpaść w ręce Boga żywego."
  tags: []
"Hbr10,32":
  text: "Przypomnijcie sobie dawne dni, kiedy to po oświeceniu znosiliście wielkie zmagania z cierpieniem;"
  tags: []
"Hbr10,33":
  text: "Czy to gdy byliście publicznie wystawieni na pośmiewisko i prześladowania, czy też gdy staliście się uczestnikami w cierpieniach tych, z którymi się tak obchodzono."
  tags: []
"Hbr10,34":
  text: "Cierpieliście bowiem ze mną w moich więzach i przyjęliście z radością grabież waszego mienia, wiedząc, że macie w sobie lepszą i trwałą majętność w niebie."
  tags: []
"Hbr10,35":
  text: "Nie odrzucajcie więc waszej ufności, która ma wielką zapłatę."
  tags: []
"Hbr10,36":
  text: "Potrzeba wam bowiem cierpliwości, abyście wypełniając wolę Boga, dostąpili spełnienia obietnicy."
  tags: []
"Hbr10,37":
  text: "Bo jeszcze tylko bardzo krótka chwila, a przyjdzie ten, który ma przyjść, i nie będzie zwlekał."
  tags: []
"Hbr10,38":
  text: "A sprawiedliwy będzie żył z wiary, lecz jeśli się ktoś cofnie, moja dusza nie będzie miała w nim upodobania."
  tags: []
"Hbr10,39":
  text: "My zaś nie jesteśmy z tych, którzy się wycofują ku zatraceniu, ale z tych, którzy wierzą ku zbawieniu duszy."
  tags: []
