"Hbr10,1": "Prawo bowiem, zawierając cień przyszłych dóbr, a nie sam obraz rzeczy, nie może nigdy przez te same ofiary, które co roku są nieustannie składane, uczynić doskonałymi tych, którzy przychodzą."
"Hbr10,2": "W przeciwnym razie przestano by je składać, dlatego że składający je, raz oczyszczeni, nie mieliby już żadnych grzechów na sumieniu."
"Hbr10,3": "A jednak przez te ofiary każdego roku odbywa się przypominanie grzechów."
"Hbr10,4": "Niemożliwe jest bowiem, aby krew wołów i kozłów gładziła grzechy."
"Hbr10,5": "Dlatego przychodząc na świat, mówi: Ofiary ani daru nie chciałeś, ale przygotowałeś mi ciało."
"Hbr10,6": "Całopalenia i ofiary za grzech nie podobały się tobie."
"Hbr10,7": "Wtedy powiedziałem: Oto przychodzę – na początku księgi jest napisane o mnie – abym spełniał twoją wolę, o Boże."
"Hbr10,8": "Powiedziawszy wyżej: Ofiar, darów, całopaleń i ofiar za grzech nie chciałeś i nie podobały się tobie, choć składa się je zgodnie z prawem;"
"Hbr10,9": "Następnie powiedział: Oto przychodzę, abym spełniał twoją wolę, o Boże. Znosi pierwsze, aby ustanowić drugie."
"Hbr10,10": "Za sprawą tej woli jesteśmy uświęceni przez ofiarę ciała Jezusa Chrystusa raz na zawsze."
"Hbr10,11": "A każdy kapłan staje codziennie do wykonywania służby Bożej, wiele razy składając te same ofiary, które nigdy nie mogą zgładzić grzechów."
"Hbr10,12": "Lecz ten, gdy złożył jedną ofiarę za grzechy na zawsze, zasiadł po prawicy Boga;"
"Hbr10,13": "Oczekując odtąd, aż jego nieprzyjaciele będą położeni jako podnóżek pod jego stopy."
"Hbr10,14": "Jedną bowiem ofiarą uczynił doskonałymi na zawsze tych, którzy są uświęceni."
"Hbr10,15": "A poświadcza nam to także Duch Święty. Bo powiedziawszy najpierw:"
"Hbr10,16": "Takie jest przymierze, które zawrę z nimi po tych dniach, mówi Pan: Włożę moje prawa w ich serca i wypiszę je na ich umysłach;"
"Hbr10,17": "Potem dodaje: A ich grzechów i nieprawości więcej nie wspomnę."
"Hbr10,18": "Gdzie zaś jest ich odpuszczenie, tam nie potrzeba już ofiary za grzech."
"Hbr10,19": "Mając więc, bracia, śmiałość, aby przez krew Jezusa wejść do Najświętszego Miejsca;"
"Hbr10,20": "Drogą nową i żywą, którą zapoczątkował dla nas przez zasłonę, to jest przez swoje ciało;"
"Hbr10,21": "I mając wielkiego kapłana nad domem Bożym;"
"Hbr10,22": "Zbliżmy się ze szczerym sercem, w pełni wiary, mając serca oczyszczone od złego sumienia i ciało obmyte czystą wodą."
"Hbr10,23": "Trzymajmy wyznanie nadziei niechwiejące się, bo wierny jest ten, który obiecał."
"Hbr10,24": "I okazujmy staranie jedni o drugich, by pobudzać się do miłości i dobrych uczynków;"
"Hbr10,25": "Nie opuszczając naszego wspólnego zgromadzenia, jak to niektórzy mają w zwyczaju, ale zachęcając się nawzajem, i to tym bardziej, im bardziej widzicie, że zbliża się ten dzień."
"Hbr10,26": "Jeśli bowiem dobrowolnie grzeszymy po otrzymaniu poznania prawdy, to nie pozostaje już ofiara za grzechy;"
"Hbr10,27": "Lecz jakieś straszliwe oczekiwanie sądu i żar ognia, który strawić ma przeciwników."
"Hbr10,28": "Kto gardził Prawem Mojżesza, ponosił śmierć bez miłosierdzia na podstawie zeznania dwóch albo trzech świadków."
"Hbr10,29": "Jak wam się wydaje, na ileż surowszą karę zasługuje ten, kto by podeptał Syna Bożego i zbezcześcił krew przymierza, przez którą został uświęcony, i znieważył Ducha łaski?"
"Hbr10,30": "Znamy bowiem tego, który powiedział: Zemsta do mnie należy, ja odpłacę, mówi Pan. I znowu: Pan będzie sądzić swój lud."
"Hbr10,31": "Straszna to rzecz wpaść w ręce Boga żywego."
"Hbr10,32": "Przypomnijcie sobie dawne dni, kiedy to po oświeceniu znosiliście wielkie zmagania z cierpieniem;"
"Hbr10,33": "Czy to gdy byliście publicznie wystawieni na pośmiewisko i prześladowania, czy też gdy staliście się uczestnikami w cierpieniach tych, z którymi się tak obchodzono."
"Hbr10,34": "Cierpieliście bowiem ze mną w moich więzach i przyjęliście z radością grabież waszego mienia, wiedząc, że macie w sobie lepszą i trwałą majętność w niebie."
"Hbr10,35": "Nie odrzucajcie więc waszej ufności, która ma wielką zapłatę."
"Hbr10,36": "Potrzeba wam bowiem cierpliwości, abyście wypełniając wolę Boga, dostąpili spełnienia obietnicy."
"Hbr10,37": "Bo jeszcze tylko bardzo krótka chwila, a przyjdzie ten, który ma przyjść, i nie będzie zwlekał."
"Hbr10,38": "A sprawiedliwy będzie żył z wiary, lecz jeśli się ktoś cofnie, moja dusza nie będzie miała w nim upodobania."
"Hbr10,39": "My zaś nie jesteśmy z tych, którzy się wycofują ku zatraceniu, ale z tych, którzy wierzą ku zbawieniu duszy."
