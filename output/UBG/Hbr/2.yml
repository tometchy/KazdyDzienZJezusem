"Hbr2,1": "Dlatego musimy tym bardziej trzymać się tego, co słyszeliśmy, aby nam to czasem nie uciekło."
"Hbr2,2": "Bo jeśli słowo wypowiedziane przez aniołów było niewzruszone, a wszelkie wykroczenie i nieposłuszeństwo otrzymało sprawiedliwą odpłatę;"
"Hbr2,3": "Jakże my ujdziemy, jeśli zaniedbamy tak wielkie zbawienie, które było głoszone na początku przez Pana, a potwierdzone nam przez tych, którzy go słyszeli?"
"Hbr2,4": "Którym i Bóg dał świadectwo przez znaki, cuda i różnorakie moce oraz przez udzielanie Ducha Świętego według swojej woli."
"Hbr2,5": "Nie aniołom bowiem poddał przyszły świat, o którym mówimy."
"Hbr2,6": "Ktoś to gdzieś stwierdził, gdy powiedział: Czym jest człowiek, że o nim pamiętasz, albo syn człowieczy, że troszczysz się o niego?"
"Hbr2,7": "Uczyniłeś go niewiele mniejszym od aniołów, chwałą i czcią ukoronowałeś go i ustanowiłeś go nad uczynkami twoich rąk."
"Hbr2,8": "Wszystko poddałeś pod jego stopy. A skoro poddał mu wszystko, nie pozostawił niczego, co nie byłoby mu poddane. Lecz teraz jeszcze nie widzimy, aby wszystko było mu poddane."
"Hbr2,9": "Ale widzimy Jezusa, który stał się niewiele mniejszy od aniołów, ukoronowanego chwałą i czcią za cierpienia śmierci, aby z łaski Boga zakosztował śmierci za wszystkich."
"Hbr2,10": "Wypadało bowiem temu, dla którego jest wszystko i przez którego jest wszystko, aby, doprowadzając wielu synów do chwały, wodza ich zbawienia uczynił doskonałym przez cierpienie."
"Hbr2,11": "Zarówno bowiem ten, który uświęca, jak i uświęceni, z jednego są wszyscy. Z tego powodu nie wstydzi się nazywać ich braćmi;"
"Hbr2,12": "Mówiąc: Oznajmię twoje imię moim braciom, pośród zgromadzenia będę ci śpiewał."
"Hbr2,13": "I znowu: Będę pokładał w nim ufność. I znowu: Oto ja i dzieci, które dał mi Bóg."
"Hbr2,14": "Ponieważ zaś dzieci są uczestnikami ciała i krwi, i on także stał się ich uczestnikiem, aby przez śmierć zniszczyć tego, który miał władzę nad śmiercią, to jest diabła;"
"Hbr2,15": "I aby wyzwolić tych, którzy z powodu lęku przed śmiercią przez całe życie podlegali niewoli."
"Hbr2,16": "Bo zaprawdę nie przyjął natury aniołów, ale potomstwo Abrahama."
"Hbr2,17": "Dlatego musiał we wszystkim upodobnić się do braci, aby stał się miłosiernym i wiernym najwyższym kapłanem wobec Boga dla przebłagania za grzechy ludu."
"Hbr2,18": "A że sam cierpiał, będąc kuszony, może dopomóc tym, którzy są w pokusach."
