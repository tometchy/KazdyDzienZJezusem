"Hbr2,1":
  text: "Dlatego musimy tym bardziej trzymać się tego, co słyszeliśmy, aby nam to czasem nie uciekło."
  tags: []
"Hbr2,2":
  text: "Bo jeśli słowo wypowiedziane przez aniołów było niewzruszone, a wszelkie wykroczenie i nieposłuszeństwo otrzymało sprawiedliwą odpłatę;"
  tags: []
"Hbr2,3":
  text: "Jakże my ujdziemy, jeśli zaniedbamy tak wielkie zbawienie, które było głoszone na początku przez Pana, a potwierdzone nam przez tych, którzy go słyszeli?"
  tags: []
"Hbr2,4":
  text: "Którym i Bóg dał świadectwo przez znaki, cuda i różnorakie moce oraz przez udzielanie Ducha Świętego według swojej woli."
  tags: []
"Hbr2,5":
  text: "Nie aniołom bowiem poddał przyszły świat, o którym mówimy."
  tags: []
"Hbr2,6":
  text: "Ktoś to gdzieś stwierdził, gdy powiedział: Czym jest człowiek, że o nim pamiętasz, albo syn człowieczy, że troszczysz się o niego?"
  tags: []
"Hbr2,7":
  text: "Uczyniłeś go niewiele mniejszym od aniołów, chwałą i czcią ukoronowałeś go i ustanowiłeś go nad uczynkami twoich rąk."
  tags: []
"Hbr2,8":
  text: "Wszystko poddałeś pod jego stopy. A skoro poddał mu wszystko, nie pozostawił niczego, co nie byłoby mu poddane. Lecz teraz jeszcze nie widzimy, aby wszystko było mu poddane."
  tags: []
"Hbr2,9":
  text: "Ale widzimy Jezusa, który stał się niewiele mniejszy od aniołów, ukoronowanego chwałą i czcią za cierpienia śmierci, aby z łaski Boga zakosztował śmierci za wszystkich."
  tags: []
"Hbr2,10":
  text: "Wypadało bowiem temu, dla którego jest wszystko i przez którego jest wszystko, aby, doprowadzając wielu synów do chwały, wodza ich zbawienia uczynił doskonałym przez cierpienie."
  tags: []
"Hbr2,11":
  text: "Zarówno bowiem ten, który uświęca, jak i uświęceni, z jednego są wszyscy. Z tego powodu nie wstydzi się nazywać ich braćmi;"
  tags: []
"Hbr2,12":
  text: "Mówiąc: Oznajmię twoje imię moim braciom, pośród zgromadzenia będę ci śpiewał."
  tags: []
"Hbr2,13":
  text: "I znowu: Będę pokładał w nim ufność. I znowu: Oto ja i dzieci, które dał mi Bóg."
  tags: []
"Hbr2,14":
  text: "Ponieważ zaś dzieci są uczestnikami ciała i krwi, i on także stał się ich uczestnikiem, aby przez śmierć zniszczyć tego, który miał władzę nad śmiercią, to jest diabła;"
  tags: []
"Hbr2,15":
  text: "I aby wyzwolić tych, którzy z powodu lęku przed śmiercią przez całe życie podlegali niewoli."
  tags: []
"Hbr2,16":
  text: "Bo zaprawdę nie przyjął natury aniołów, ale potomstwo Abrahama."
  tags: []
"Hbr2,17":
  text: "Dlatego musiał we wszystkim upodobnić się do braci, aby stał się miłosiernym i wiernym najwyższym kapłanem wobec Boga dla przebłagania za grzechy ludu."
  tags: []
"Hbr2,18":
  text: "A że sam cierpiał, będąc kuszony, może dopomóc tym, którzy są w pokusach."
  tags: []
