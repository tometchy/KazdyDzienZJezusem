"Ezd7,1":
  text: "Po tych wydarzeniach, za panowania Artakserksesa, króla Persji, Ezdrasz, syn Serajasza, syna Azariasza, syna Chilkiasza;"
  tags: []
"Ezd7,2":
  text: "Syna Szalluma, syna Sadoka, syna Achituba;"
  tags: []
"Ezd7,3":
  text: "Syna Amariasza, syna Azariasza, syna Merajota;"
  tags: []
"Ezd7,4":
  text: "Syna Zerachiasza, syna Uzziego, syna Bukkiego;"
  tags: []
"Ezd7,5":
  text: "Syna Abiszui, syna Pinchasa, syna Eleazara, syna Aarona, najwyższego kapłana;"
  tags: []
"Ezd7,6":
  text: "Tenże Ezdrasz wyruszył z Babilonu, a był człowiekiem uczonym w prawie Mojżesza, które dał PAN, Bóg Izraela. A król spełnił wszystkie jego prośby, gdyż ręka PANA, jego Boga, była nad nim."
  tags: []
"Ezd7,7":
  text: "Wyruszyli też niektórzy z synów Izraela oraz z kapłanów, Lewitów, śpiewaków, odźwiernych i z Netinitów do Jerozolimy w siódmym roku króla Artakserksesa."
  tags: []
"Ezd7,8":
  text: "Ezdrasz przybył do Jerozolimy w piątym miesiącu – było to w siódmym roku króla."
  tags: []
"Ezd7,9":
  text: "Wyruszył z Babilonu w pierwszym dniu pierwszego miesiąca, a do Jerozolimy przybył w pierwszym dniu piątego miesiąca, ponieważ była nad nim łaskawa ręka jego Boga."
  tags: []
"Ezd7,10":
  text: "Ezdrasz bowiem przygotował swoje serce, aby szukać prawa PANA i wykonywać je, a także by nauczać w Izraelu ustaw i sądów."
  tags: []
"Ezd7,11":
  text: "A oto odpis listu, który król Artakserkses dał Ezdraszowi, kapłanowi i uczonemu, biegłemu w słowach przykazań PANA i w jego ustawach w Izraelu:"
  tags: []
"Ezd7,12":
  text: "Artakserkses, król królów, Ezdraszowi, kapłanowi, uczonemu w prawie Boga niebios, mężowi doskonałemu, otóż;"
  tags: []
"Ezd7,13":
  text: "Wydaję dekret o tym, że każdy z ludu Izraela, spośród jego kapłanów i Lewitów w moim państwie, kto dobrowolnie pragnie udać się do Jerozolimy, może iść z tobą."
  tags: []
"Ezd7,14":
  text: "Ty bowiem zostałeś wysłany przez króla i jego siedmiu doradców, abyś według prawa swego Boga, które masz w swoim ręku, zbadał sprawy w Judei i Jerozolimie;"
  tags: []
"Ezd7,15":
  text: "I abyś zaniósł srebro i złoto, które król i jego doradcy dobrowolnie ofiarowali Bogu Izraela, którego przybytek jest w Jerozolimie;"
  tags: []
"Ezd7,16":
  text: "Oraz całe srebro i złoto, które otrzymasz w całej prowincji Babilonu wraz z dobrowolnymi darami od ludu i kapłanów, które dobrowolnie ofiarują na dom swego Boga w Jerozolimie;"
  tags: []
"Ezd7,17":
  text: "Abyś za te pieniądze bezzwłocznie kupił cielce, barany, jagnięta wraz z przynależnymi do nich ofiarami z pokarmów i płynów i złożył je na ołtarzu domu waszego Boga w Jerozolimie;"
  tags: []
"Ezd7,18":
  text: "Z pozostałym srebrem i złotem uczyńcie zaś to, co ty i twoi bracia uznacie za słuszne, tak czyńcie, według woli waszego Boga."
  tags: []
"Ezd7,19":
  text: "Naczynia też, które zostały ci dane do służby w domu twojego Boga, oddaj przed Bogiem w Jerozolimie;"
  tags: []
"Ezd7,20":
  text: "Także i inne potrzeby do domu twojego Boga, za które przyjdzie ci zapłacić, opłać ze skarbca królewskiego."
  tags: []
"Ezd7,21":
  text: "A ja, król Artakserkses, wydaję wszystkim podskarbim zarzecza rozkaz o tym, że wszystko, czegokolwiek zażąda od was kapłan Ezdrasz, uczony w prawie Boga niebios, ma być bezzwłocznie wykonane;"
  tags: []
"Ezd7,22":
  text: "Aż do stu talentów srebra, stu kor pszenicy, stu bat wina, stu bat oliwy, a soli bez ograniczenia."
  tags: []
"Ezd7,23":
  text: "Wszystko, co nakazuje Bóg niebios, ma być wykonane starannie dla domu Boga niebios, bo dlaczego ma być wzbudzony jego gniew przeciwko państwu króla i jego synów?"
  tags: []
"Ezd7,24":
  text: "Zawiadamiamy was również, że na żadnego z kapłanów, Lewitów, śpiewaków, odźwiernych, Netinitów oraz pozostałych sług tego domu Boga nie wolno nakładać podatku, danin ani cła."
  tags: []
"Ezd7,25":
  text: "A ty, Ezdraszu, według mądrości swego Boga, która jest w tobie, ustanów urzędników i sędziów, którzy będą sądzić cały lud zarzecza, wszystkich, którzy znają prawo twego Boga; a tych, którzy go nie znają, macie uczyć."
  tags: []
"Ezd7,26":
  text: "Na każdego, kto nie wykona prawa twego Boga i prawa króla, niech bezzwłocznie będzie wydany wyrok – albo śmierci, albo wygnania, albo przepadku mienia, albo więzienia."
  tags: []
"Ezd7,27":
  text: "Ezdrasz powiedział: Błogosławiony niech będzie PAN, Bóg naszych ojców, który włożył w serce króla pragnienie, aby ozdobić dom PANA, który jest w Jerozolimie;"
  tags: []
"Ezd7,28":
  text: "A mnie okazał łaskę wobec króla i jego doradców oraz wszystkich możnych dostojników króla. A ja, będąc wzmocniony ręką PANA, swego Boga, która była nade mną, zgromadziłem naczelników z Izraela, aby wyruszyli ze mną."
  tags: []
