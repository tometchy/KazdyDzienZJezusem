"Ezd1,1": "W pierwszym roku Cyrusa, króla Persji – aby wypełniło się słowo PANA z ust Jeremiasza – PAN wzbudził ducha Cyrusa, króla Persji, tak że ogłosił ustnie po całym swoim królestwie, a także na piśmie, co następuje:"
"Ezd1,2": "Tak mówi Cyrus, król Persji: PAN, Bóg niebios, dał mi wszystkie królestwa ziemi. On też rozkazał mi, abym zbudował dla niego dom w Jerozolimie, która jest w Judzie."
"Ezd1,3": "Kto więc spośród was należy do jego ludu, niech będzie z nim jego Bóg; ten niech uda się do Jerozolimy w Judzie i niech buduje dom PANA, Boga Izraela – on jest Bogiem – który jest w Jerozolimie."
"Ezd1,4": "A każdego, kto został w jakimkolwiek miejscu, gdzie teraz przebywa, niech ludzie tego miejsca wspomagają go srebrem, złotem, dobytkiem i bydłem, a także dobrowolnymi ofiarami dla domu Bożego, który jest w Jerozolimie."
"Ezd1,5": "Wtedy powstali przywódcy rodów Judy i Beniamina, kapłani i Lewici, wszyscy, których ducha Bóg pobudził, aby poszli budować dom PANA, będący w Jerozolimie."
"Ezd1,6": "Wszyscy, którzy mieszkali dokoła nich, wspomogli ich naczyniem srebrnym, złotem, dobytkiem, bydłem i kosztownościami, poza tym wszystkim, co dobrowolnie ofiarowano."
"Ezd1,7": "Również król Cyrus wyniósł naczynia domu PANA, które Nabuchodonozor zabrał z Jerozolimy, i złożył w domu swego boga."
"Ezd1,8": "Wyniósł je Cyrus, król Persji, przez ręce skarbnika Mitredata, który rozliczył się z nich z Szeszbassarem, księciem Judy."
"Ezd1,9": "A oto ich liczba: trzydzieści czasz złotych, tysiąc czasz srebrnych, dwadzieścia dziewięć noży;"
"Ezd1,10": "Trzydzieści złotych pucharów, czterysta dziesięć pucharów mniejszej wartości i tysiąc innych naczyń."
"Ezd1,11": "Wszystkich naczyń złotych i srebrnych – pięć tysięcy czterysta. Wszystko to zabrał Szeszbassar, gdy lud powrócił z niewoli, z Babilonu do Jerozolimy."
