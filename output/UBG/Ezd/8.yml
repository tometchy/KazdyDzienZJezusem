"Ezd8,1": "A oto naczelnicy rodów i rodowody tych, którzy wyruszyli ze mną z Babilonu za panowania króla Artakserksesa:"
"Ezd8,2": "Z synów Pinchasa – Gerszom; z synów Itamara – Daniel; z synów Dawida – Chattusz;"
"Ezd8,3": "Z synów Szekaniasza, z synów Parosza – Zachariasz, a z nim spisanych według rodowodów było stu pięćdziesięciu mężczyzn;"
"Ezd8,4": "Z synów Pachat-Moaba – Elioenaj, syn Zerachiasza, a z nim dwustu mężczyzn;"
"Ezd8,5": "Z synów Szekaniasza – syn Jahaziela, a z nim trzystu mężczyzn;"
"Ezd8,6": "Z synów Adina – Ebed, syn Jonatana, a z nim pięćdziesięciu mężczyzn;"
"Ezd8,7": "Z synów Elama – Jeszajasz, syn Ataliasza, a z nim siedemdziesięciu mężczyzn;"
"Ezd8,8": "Z synów Szefatiasza – Zebadiasz, syn Mikaela, a z nim osiemdziesięciu mężczyzn;"
"Ezd8,9": "Z synów Joaba – Obadiasz, syn Jechiela, a z nim dwustu osiemnastu mężczyzn;"
"Ezd8,10": "Z synów Szelomita – syn Josifiasza, a z nim stu sześćdziesięciu mężczyzn;"
"Ezd8,11": "Z synów Bebaja – Zachariasz, syn Bebaja, a z nim dwudziestu ośmiu mężczyzn;"
"Ezd8,12": "Z synów Azgada – Johanan, syn Hakkatana, a z nim stu dziesięciu mężczyzn;"
"Ezd8,13": "Z synów Adonikama wyruszyli ostatni, a oto ich imiona: Elifelet, Jejel i Szemajasz, a z nimi sześćdziesięciu mężczyzn;"
"Ezd8,14": "Z synów Bigwaja – Utaj i Zabbud, a z nimi siedemdziesięciu mężczyzn."
"Ezd8,15": "I zgromadziłem ich nad rzeką, która płynie do Achawy, i obozowaliśmy tam przez trzy dni. Potem dokonałem przeglądu ludu i kapłanów, a z synów Lewiego nie znalazłem tam żadnego."
"Ezd8,16": "Posłałem więc Eliezera, Ariela, Szemajasza, Elnatana, Jariba, Elnatana, Natana, Zachariasza i Meszullama, naczelników, a także Jojariba i Elnatana, ludzi rozumnych;"
"Ezd8,17": "I dałem przez nich polecenie Iddo, przełożonemu w miejscowości Kasifia, i przekazałem im słowa, które mieli powiedzieć do niego i jego braci Netinitów w miejscowości Kasifia; poleciłem, aby nam przyprowadzili sługi dla domu naszego Boga."
"Ezd8,18": "I ponieważ łaskawa ręka naszego Boga była nad nami, przyprowadzili do nas, człowieka rozumnego spośród synów Machliego, syna Lewiego, syna Izraela, oraz Szerebiasza wraz z jego synami i braćmi – razem osiemnaście osób;"
"Ezd8,19": "I Chaszabiasza, a z nim Jeszajasz spośród synów Merariego wraz z jego braćmi i ich synów – razem dwadzieścia osób;"
"Ezd8,20": "Ponadto spośród Netinitów, których Dawid i naczelnicy ustanowili do posługiwania Lewitom – dwieście dwadzieścia Netinitów. Ci wszyscy zostali imiennie wyznaczeni."
"Ezd8,21": "Wtedy tam, nad rzeką Achawa, ogłosiłem post, abyśmy ukorzyli się przed naszym Bogiem i abyśmy uprosili u niego szczęśliwą drogę dla nas, naszych dzieci i całego naszego dobytku."
"Ezd8,22": "Wstydziłem się bowiem prosić króla o żołnierzy i jeźdźców, aby nas w drodze ratowali przed wrogami, ponieważ powiedzieliśmy królowi: Ręka naszego Boga jest nad wszystkimi, którzy go szukają, dla ich dobra, ale jego moc i gniew przeciwko wszystkim, którzy go opuszczają."
"Ezd8,23": "Pościliśmy więc i prosiliśmy o to naszego Boga. A on nas wysłuchał."
"Ezd8,24": "Wtedy spośród przedniejszych kapłanów wydzieliłem dwunastu: Szerebiasza, Chaszabiasza, a z nimi dziesięciu ich braci;"
"Ezd8,25": "I odważyłem im srebro, złoto i naczynia, czyli ofiarę dla domu naszego Boga, którą złożyli: król, jego doradcy, jego dostojnicy oraz cały Izrael tam obecny."
"Ezd8,26": "Odważyłem im więc do rąk sześćset pięćdziesiąt talentów srebra, sto talentów naczyń srebrnych, sto talentów złota;"
"Ezd8,27": "Dwadzieścia złotych pucharów, ważących po tysiąc darejków, i dwa naczynia z wybornego mosiądzu, tak piękne jak złoto."
"Ezd8,28": "Potem powiedziałem do nich: Wy jesteście poświęceni PANU, naczynia także są poświęcone, a to srebro i złoto są dobrowolnym darem dla PANA, Boga waszych ojców."
"Ezd8,29": "Pilnujcie i strzeżcie ich, dopóki nie odważycie ich przed przedniejszymi kapłanami, Lewitami i naczelnikami rodów Izraela w Jerozolimie, w komnatach domu PANA."
"Ezd8,30": "Wzięli więc kapłani i Lewici odważone srebro, złoto i naczynia, aby je zanieść do Jerozolimy, do domu naszego Boga."
"Ezd8,31": "Potem wyruszyliśmy znad rzeki Achawa dwunastego dnia pierwszego miesiąca, aby udać się do Jerozolimy. A ręka naszego Boga była nad nami i wyrwała nas z ręki wrogów i czyhających na nas w drodze."
"Ezd8,32": "I przybyliśmy do Jerozolimy, i zamieszkaliśmy tam przez trzy dni."
"Ezd8,33": "A czwartego dnia odważono srebro, złoto i naczynia w domu naszego Boga – do ręki Meremota, syna kapłana Uriasza, z którym był Eleazar, syn Pinchasa; z nimi też byli Jozabad, syn Jeszuy, i Noadiasz, syn Binnuja, Lewici;"
"Ezd8,34": "Wszystko według liczby i wagi; i zapisano wagę tego wszystkiego w tym czasie."
"Ezd8,35": "Następnie ci, którzy zostali pojmani, a powrócili z niewoli, złożyli Bogu Izraela ofiarę całopalną: dwanaście cielców za całego Izraela, dziewięćdziesiąt sześć baranów, siedemdziesiąt siedem jagniąt i dwanaście kozłów na ofiarę za grzech, wszystko jako całopalenie PANU."
"Ezd8,36": "I przekazano rozporządzenie króla jego satrapom i namiestnikom zarzecza, a ci wspomagali lud i dom Boży."
