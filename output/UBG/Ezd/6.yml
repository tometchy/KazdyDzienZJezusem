"Ezd6,1": "Wtedy król Dariusz rozkazał, aby szukano w archiwum, gdzie przechowywano skarby w Babilonie."
"Ezd6,2": "I znaleziono w Achmecie, w pałacu w prowincji Medii, pewien zwój, w którym tak było napisane:"
"Ezd6,3": "W pierwszym roku króla Cyrusa, król Cyrus wydał dekret w sprawie domu Bożego w Jerozolimie: Dom ten ma być odbudowany, to miejsce, gdzie składano ofiary. Fundamenty mają być położone. Jego wysokość – sześćdziesiąt łokci i jego szerokość – sześćdziesiąt łokci."
"Ezd6,4": "Trzy rzędy z kamienia wielkiego i jeden rząd z nowego drewna. Koszty ma pokryć dom królewski."
"Ezd6,5": "Ponadto złote i srebrne naczynia z domu Bożego, które zabrał Nabuchodonozor ze świątyni w Jerozolimie i przeniósł do Babilonu, mają być zwrócone i przeniesione do świątyni w Jerozolimie na swoje miejsce, i złożone w domu Bożym."
"Ezd6,6": "Teraz więc ty, Tattenaju, namiestniku zarzecza, Szetarboznaju, i wy, Afarsachajczycy, ich towarzysze, którzy jesteście za rzeką, trzymajcie się z dala od tego miejsca."
"Ezd6,7": "Zostawcie w spokoju prace nad tym domem Bożym. Niech namiestnik Żydów i starsi żydowscy odbudują ten dom Boży na swoim miejscu."
"Ezd6,8": "Wydaję też dekret o tym, co macie uczynić dla starszych spośród Żydów na budowę tego domu Bożego, mianowicie: koszty mają być bezzwłocznie wypłacone tym ludziom z dochodów króla, z danin pobieranych za rzeką, aby nie przestawali budować."
"Ezd6,9": "Także i to, co będzie potrzebne do całopaleń dla Boga niebios: cielce, barany i jagnięta oraz pszenica, sól, wino i oliwa, według rozkazu kapłanów w Jerozolimie, niech im będzie dawane każdego dnia bez zaniedbania;"
"Ezd6,10": "Aby mogli składać wonne ofiary Bogu niebios i aby modlili się za życie króla i jego synów."
"Ezd6,11": "Ponadto wydaję taki dekret: Ktokolwiek zmieni ten rozkaz, to belka z jego domu ma być wyrwana i podniesiona, a on będzie na niej powieszony; jego dom zaś zostanie zamieniony w gnojowisko."
"Ezd6,12": "A Bóg, który uczynił tam mieszkanie dla swojego imienia, niech zniszczy każdego króla i każdy naród, który by się odważył zmienić ten rozkaz i zniszczyć ten dom Boży w Jerozolimie. Ja, Dariusz, wydałem ten dekret; niech będzie wykonany bezzwłocznie."
"Ezd6,13": "Wtedy Tattenaj, namiestnik zarzecza, Szetarboznaj i ich towarzysze niezwłocznie uczynili tak, jak król Dariusz rozkazał."
"Ezd6,14": "A starsi żydowscy budowali i szczęściło im się według proroctwa Aggeusza, proroka, i Zachariasza, syna Iddo. Budowali i dokończyli dom zgodnie z rozkazem Boga Izraela oraz z rozkazem Cyrusa, Dariusza oraz Artakserksesa, króla Persji."
"Ezd6,15": "I ten dom został zakończony w trzecim dniu miesiąca Adar, w szóstym roku panowania króla Dariusza."
"Ezd6,16": "Wówczas synowie Izraela, kapłani, Lewici oraz reszta ludu, który powrócił z niewoli, z radością obchodzili poświęcenie tego domu Bożego."
"Ezd6,17": "I złożyli ofiary przy poświęcaniu tego domu Bożego: sto cielców, dwieście baranów, czterysta jagniąt, a jako ofiarę za grzech za całego Izraela – dwanaście kozłów, według liczby pokoleń Izraela."
"Ezd6,18": "Do służby Bożej w Jerozolimie ustanowili kapłanów – według ich oddziałów, i Lewitów – według ich zmian, jak jest napisane w księdze Mojżesza."
"Ezd6,19": "Ci, którzy powrócili z niewoli, obchodzili też Paschę w czternastym dniu pierwszego miesiąca."
"Ezd6,20": "Kapłani bowiem i Lewici oczyścili się jak jeden mąż, wszyscy byli oczyszczeni. Zabili więc baranka paschalnego dla wszystkich, którzy przybyli z niewoli, dla swoich braci kapłanów i dla siebie samych."
"Ezd6,21": "I spożywali to synowie Izraela, którzy powrócili z niewoli, i każdy, kto odłączył się od nieczystości pogan tej ziemi i przyłączył się do nich, aby szukać PANA, Boga Izraela."
"Ezd6,22": "Przez siedem dni z radością obchodzili też Święto Przaśników, gdyż PAN napełnił ich radością i zwrócił ku nim serce króla Asyrii, aby wzmocnił ich ręce przy pracy wokół domu Bożego, Boga Izraela."
