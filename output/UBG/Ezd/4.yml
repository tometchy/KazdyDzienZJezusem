"Ezd4,1": "A gdy wrogowie Judy i Beniamina usłyszeli, że lud, który powrócił z niewoli, budował świątynię PANU, Bogu Izraela;"
"Ezd4,2": "Wówczas przybyli do Zorobabela i naczelników rodów i powiedzieli im: Będziemy budować z wami, gdyż szukamy waszego Boga tak jak wy i składamy mu ofiary od czasów Asarchaddona, króla Asyrii, który nas tu przyprowadził."
"Ezd4,3": "Ale Zorobabel, Jeszua i pozostali naczelnicy rodów z Izraela odpowiedzieli im: Nie wolno wam razem z nami budować domu naszemu Bogu, ale my sami będziemy budować PANU, Bogu Izraela, jak nam rozkazał Cyrus, król Persji."
"Ezd4,4": "Wtedy lud tej ziemi zaczął zniechęcać lud Judy i przeszkadzał im w budowie."
"Ezd4,5": "Ponadto przekupywał przeciwko nim radców, aby udaremnić ich zamiar po wszystkie dni Cyrusa, króla Persji, aż do panowania Dariusza, króla Persji."
"Ezd4,6": "Za panowania Aswerusa, na początku jego panowania, napisali skargę przeciwko obywatelom Judy i Jerozolimy;"
"Ezd4,7": "A za czasów Artakserksesa Biszlam, Mitredat, Tabeel wraz z pozostałymi towarzyszami napisali do Artakserksesa, króla Persji. List był sporządzony pismem syryjskim i przetłumaczony na język syryjski."
"Ezd4,8": "Kanclerz Rechum i pisarz Szimszaj napisali do króla Artakserksesa list przeciwko Jerozolimie następującej treści:"
"Ezd4,9": "Kanclerz Rechum, pisarz Szimszaj i pozostali ich towarzysze: Dynajczycy, Afarsadchajczycy, Tarpelajczycy, Afarsajczycy, Arkewijczycy, Babilończycy, Susanchici, Dehawici i Elamici;"
"Ezd4,10": "I reszta narodów, które wielki i sławny Asnappar przyprowadził i osiedlił w miastach Samarii, oraz pozostali, którzy są za rzeką – otóż;"
"Ezd4,11": "To jest odpis listu, który posłali do króla Artakserksesa – Twoi słudzy, ludzie mieszkający za rzeką – otóż:"
"Ezd4,12": "Niech królowi będzie wiadomo, że Żydzi, którzy wyszli od ciebie, przybyli do nas, do Jerozolimy, i odbudowują to buntownicze i niegodziwe miasto, już wznosili mury i położyli fundamenty."
"Ezd4,13": "Niech więc będzie królowi wiadomo, że jeśli to miasto zostanie odbudowane i jego mury będą wzniesione, wtedy podatku, danin ani cła oni nie będą płacić, a to przyniesie szkodę dochodom króla."
"Ezd4,14": "Teraz więc, ponieważ jesteśmy na utrzymaniu twego pałacu i nie przystoi nam patrzeć na zniewagę króla, posyłamy królowi tę wiadomość;"
"Ezd4,15": "Aby poszukano w księdze kronik twoich ojców, a znajdziesz w niej i dowiesz się, że to miasto jest miastem buntowniczym i przynosi szkodę królom i prowincjom i że od dawien dawna wzniecano w nim bunty. Z tego powodu to miasto zostało zburzone."
"Ezd4,16": "Zawiadamiamy króla, że jeśli to miasto zostanie odbudowane i jego mury będą wzniesione, wtedy już nie będziesz miał udziału za rzeką."
"Ezd4,17": "Wtedy król wysłał taką odpowiedź: Kanclerzowi Rechumowi, pisarzowi Szimszajowi i pozostałym ich towarzyszom, którzy mieszkają w Samarii, a także i pozostałym za rzeką: Pokój! Otóż:"
"Ezd4,18": "List, który do nas przysłaliście, został przede mną dokładnie odczytany."
"Ezd4,19": "Dlatego rozkazałem, aby poszukano. I znaleziono, że to miasto od dawna powstawało przeciwko królom, a bunt i rozruchy były w nim wzniecane;"
"Ezd4,20": "Ponadto potężni królowie panowali nad Jerozolimą i rządzili nad wszystkimi za rzeką, i płacono im podatek, daninę i cło."
"Ezd4,21": "Wydajcie więc wyrok, aby powstrzymać tych mężczyzn, żeby to miasto nie zostało odbudowane, dopóki inny rozkaz nie będzie przeze mnie wydany."
"Ezd4,22": "Pilnujcie, abyście nie zaniedbali tego. Dlaczego miałoby to wzrastać na szkodę królów?"
"Ezd4,23": "Gdy więc odpis listu króla Artakserksesa został odczytany przed Rechumem, pisarzem Szimszajem i ich towarzyszami, udali się spiesznie do Żydów w Jerozolimie i siłą i mocą wstrzymali budowę."
"Ezd4,24": "W ten sposób ustała praca przy domu Bożym, który był w Jerozolimie. I została wstrzymana aż do drugiego roku panowania Dariusza, króla Persji."
