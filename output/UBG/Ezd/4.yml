"Ezd4,1":
  text: "A gdy wrogowie Judy i Beniamina usłyszeli, że lud, który powrócił z niewoli, budował świątynię PANU, Bogu Izraela;"
  tags: []
"Ezd4,2":
  text: "Wówczas przybyli do Zorobabela i naczelników rodów i powiedzieli im: Będziemy budować z wami, gdyż szukamy waszego Boga tak jak wy i składamy mu ofiary od czasów Asarchaddona, króla Asyrii, który nas tu przyprowadził."
  tags: []
"Ezd4,3":
  text: "Ale Zorobabel, Jeszua i pozostali naczelnicy rodów z Izraela odpowiedzieli im: Nie wolno wam razem z nami budować domu naszemu Bogu, ale my sami będziemy budować PANU, Bogu Izraela, jak nam rozkazał Cyrus, król Persji."
  tags: []
"Ezd4,4":
  text: "Wtedy lud tej ziemi zaczął zniechęcać lud Judy i przeszkadzał im w budowie."
  tags: []
"Ezd4,5":
  text: "Ponadto przekupywał przeciwko nim radców, aby udaremnić ich zamiar po wszystkie dni Cyrusa, króla Persji, aż do panowania Dariusza, króla Persji."
  tags: []
"Ezd4,6":
  text: "Za panowania Aswerusa, na początku jego panowania, napisali skargę przeciwko obywatelom Judy i Jerozolimy;"
  tags: []
"Ezd4,7":
  text: "A za czasów Artakserksesa Biszlam, Mitredat, Tabeel wraz z pozostałymi towarzyszami napisali do Artakserksesa, króla Persji. List był sporządzony pismem syryjskim i przetłumaczony na język syryjski."
  tags: []
"Ezd4,8":
  text: "Kanclerz Rechum i pisarz Szimszaj napisali do króla Artakserksesa list przeciwko Jerozolimie następującej treści:"
  tags: []
"Ezd4,9":
  text: "Kanclerz Rechum, pisarz Szimszaj i pozostali ich towarzysze: Dynajczycy, Afarsadchajczycy, Tarpelajczycy, Afarsajczycy, Arkewijczycy, Babilończycy, Susanchici, Dehawici i Elamici;"
  tags: []
"Ezd4,10":
  text: "I reszta narodów, które wielki i sławny Asnappar przyprowadził i osiedlił w miastach Samarii, oraz pozostali, którzy są za rzeką – otóż;"
  tags: []
"Ezd4,11":
  text: "To jest odpis listu, który posłali do króla Artakserksesa – Twoi słudzy, ludzie mieszkający za rzeką – otóż:"
  tags: []
"Ezd4,12":
  text: "Niech królowi będzie wiadomo, że Żydzi, którzy wyszli od ciebie, przybyli do nas, do Jerozolimy, i odbudowują to buntownicze i niegodziwe miasto, już wznosili mury i położyli fundamenty."
  tags: []
"Ezd4,13":
  text: "Niech więc będzie królowi wiadomo, że jeśli to miasto zostanie odbudowane i jego mury będą wzniesione, wtedy podatku, danin ani cła oni nie będą płacić, a to przyniesie szkodę dochodom króla."
  tags: []
"Ezd4,14":
  text: "Teraz więc, ponieważ jesteśmy na utrzymaniu twego pałacu i nie przystoi nam patrzeć na zniewagę króla, posyłamy królowi tę wiadomość;"
  tags: []
"Ezd4,15":
  text: "Aby poszukano w księdze kronik twoich ojców, a znajdziesz w niej i dowiesz się, że to miasto jest miastem buntowniczym i przynosi szkodę królom i prowincjom i że od dawien dawna wzniecano w nim bunty. Z tego powodu to miasto zostało zburzone."
  tags: []
"Ezd4,16":
  text: "Zawiadamiamy króla, że jeśli to miasto zostanie odbudowane i jego mury będą wzniesione, wtedy już nie będziesz miał udziału za rzeką."
  tags: []
"Ezd4,17":
  text: "Wtedy król wysłał taką odpowiedź: Kanclerzowi Rechumowi, pisarzowi Szimszajowi i pozostałym ich towarzyszom, którzy mieszkają w Samarii, a także i pozostałym za rzeką: Pokój! Otóż:"
  tags: []
"Ezd4,18":
  text: "List, który do nas przysłaliście, został przede mną dokładnie odczytany."
  tags: []
"Ezd4,19":
  text: "Dlatego rozkazałem, aby poszukano. I znaleziono, że to miasto od dawna powstawało przeciwko królom, a bunt i rozruchy były w nim wzniecane;"
  tags: []
"Ezd4,20":
  text: "Ponadto potężni królowie panowali nad Jerozolimą i rządzili nad wszystkimi za rzeką, i płacono im podatek, daninę i cło."
  tags: []
"Ezd4,21":
  text: "Wydajcie więc wyrok, aby powstrzymać tych mężczyzn, żeby to miasto nie zostało odbudowane, dopóki inny rozkaz nie będzie przeze mnie wydany."
  tags: []
"Ezd4,22":
  text: "Pilnujcie, abyście nie zaniedbali tego. Dlaczego miałoby to wzrastać na szkodę królów?"
  tags: []
"Ezd4,23":
  text: "Gdy więc odpis listu króla Artakserksesa został odczytany przed Rechumem, pisarzem Szimszajem i ich towarzyszami, udali się spiesznie do Żydów w Jerozolimie i siłą i mocą wstrzymali budowę."
  tags: []
"Ezd4,24":
  text: "W ten sposób ustała praca przy domu Bożym, który był w Jerozolimie. I została wstrzymana aż do drugiego roku panowania Dariusza, króla Persji."
  tags: []
