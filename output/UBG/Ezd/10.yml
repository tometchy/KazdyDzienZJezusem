"Ezd10,1": "A gdy Ezdrasz modlił się i wyznawał grzechy z płaczem, klęcząc przed domem Bożym, zebrał się wokół niego bardzo wielki tłum mężczyzn, kobiet i dzieci z Izraela, a lud bardzo gorzko płakał."
"Ezd10,2": "Wtedy Szekaniasz, syn Jechiela z synów Elama, powiedział do Ezdrasza: My zgrzeszyliśmy przeciwko naszemu Bogu, bo pojęliśmy obce żony z ludu tej ziemi. Ale jest jeszcze nadzieja dla Izraela w tej sprawie."
"Ezd10,3": "Teraz więc zawrzyjmy przymierze z naszym Bogiem – odprawmy wszystkie żony i dzieci z nich urodzone, według rady PANA i tych, którzy drżą przed przykazaniem naszego Boga. Niech to się stanie według prawa."
"Ezd10,4": "Wstań, bo do ciebie należy ta sprawa, a my będziemy z tobą. Wzmocnij się i działaj."
"Ezd10,5": "Wtedy Ezdrasz wstał i zaprzysiągł przedniejszych kapłanów, Lewitów i całego Izraela, by postąpili według tego słowa. I przysięgli."
"Ezd10,6": "Potem Ezdrasz opuścił dom Boży i udał się do komnaty Jochanana, syna Eliasziba. Kiedy tam wszedł, nie jadł chleba ani nie pił wody, gdyż smucił się z powodu przestępstwa tych, którzy powrócili z niewoli."
"Ezd10,7": "Następnie ogłoszono w Judzie i Jerozolimie wszystkim, którzy powrócili z niewoli, że mają zgromadzić się w Jerozolimie."
"Ezd10,8": "A ktokolwiek nie przyjdzie w ciągu trzech dni, według postanowienia naczelników i starszych, ten zostanie pozbawiony całego mienia, a sam będzie wykluczony ze zgromadzenia tych, którzy powrócili z niewoli."
"Ezd10,9": "Zgromadzili się więc wszyscy mężczyźni z Judy i Beniamina w Jerozolimie w ciągu trzech dni. Było to w dwudziestym dniu dziewiątego miesiąca. A cały lud siedział na placu przed domem Bożym, drżąc z powodu tej sprawy i z powodu deszczu."
"Ezd10,10": "Wtedy Ezdrasz powstał i powiedział do nich: Wy zgrzeszyliście, bo pojęliście obce żony, a przez to pomnożyliście grzech Izraela."
"Ezd10,11": "Teraz więc wyznajcie grzech PANU, Bogu waszych ojców, i spełnijcie jego wolę. Odłączcie się od ludu tej ziemi i od obcych żon."
"Ezd10,12": "A całe zgromadzenie odpowiedziało donośnym głosem: Jak nam powiedziałeś, tak uczynimy."
"Ezd10,13": "Ale lud jest liczny i pora deszczowa i nie możemy stać na dworze. Ponadto ta sprawa nie jest na jeden dzień ani dwa, gdyż jest nas wielu, którzy dopuściliśmy się tego przestępstwa."
"Ezd10,14": "Prosimy więc, niech nasi przywódcy będą postawieni przed całym zgromadzeniem i wszyscy, którzy w naszych miastach pojęli obce żony, niech przyjdą o wyznaczonej porze – z nimi starsi z każdego miasta oraz ich sędziowie, abyśmy w ten sposób odwrócili od nas zapalczywość gniewu naszego Boga z powodu tej sprawy."
"Ezd10,15": "Tylko Jonatan, syn Asahela, i Jachzejasz, syn Tikwy, zajmowali się tym. I Meszullam i Szabbetaj, Lewici, pomagali im."
"Ezd10,16": "Tak więc postąpili ci, którzy powrócili z niewoli. I kapłan Ezdrasz wraz z naczelnikami poszczególnych rodów, wszyscy zostali odłączeni imiennie. I zasiedli w pierwszym dniu dziesiątego miesiąca, aby zbadać tę sprawę."
"Ezd10,17": "I do pierwszego dnia pierwszego miesiąca zakończyli sprawę ze wszystkimi mężczyznami, którzy pojęli obce żony."
"Ezd10,18": "Wśród synów kapłanów znaleźli się tacy, którzy pojęli obce żony: spośród synów Jeszuy, syna Jocadaka i jego braci: Maasejasz, Eliezer, Jarib i Gedaliasz."
"Ezd10,19": "Ci zaręczyli, że odprawią swoje żony, a jako że byli winni – każdy złoży barana ze stada za swój występek."
"Ezd10,20": "A z synów Immera: Chanani i Zebadiasz;"
"Ezd10,21": "A z synów Charima: Maasejasz, Eliasz, Szemajasz, Jechiel i Uzjasz;"
"Ezd10,22": "A z synów Paszchura: Elioenaj, Maasejasz, Izmael, Netaneel, Jozabad i Elasa;"
"Ezd10,23": "A z Lewitów: Jozabad, Szimei, Kelajasz, to jest Kelita, Petachiasz, Juda i Eliezer;"
"Ezd10,24": "A ze śpiewaków: Eliaszib; a z odźwiernych: Szallum, Telem i Uri;"
"Ezd10,25": "A z Izraela, z synów Parosza: Ramiasz, Jezjasz, Malkiasz, Miamin, Eleazar, Malkijasz i Benajasz;"
"Ezd10,26": "A z synów Elama: Mattaniasz, Zachariasz, Jechiel, Abdi, Jeremot i Eliasz;"
"Ezd10,27": "A z synów Zattua: Elioenaj, Eliaszib, Mattaniasz, Jeremot, Zabad i Aziza;"
"Ezd10,28": "A z synów Bebaja: Jehochanan, Chananiasz, Zabbaj i Atlaj;"
"Ezd10,29": "A z synów Baniego: Meszullam, Malluk, Adajasz, Jaszub, Szeal i Jeremot;"
"Ezd10,30": "A z synów Pachat-Moaba: Adna, Kelal, Benajasz, Maasejasz, Mattaniasz, Besaleel, Binnuj i Manasses;"
"Ezd10,31": "A z synów Charima: Eliezer, Jeszsziasz, Malkiasz, Szemajasz, Szymon;"
"Ezd10,32": "Beniamin, Maluk i Szemariasz;"
"Ezd10,33": "Z synów Chaszuma: Mattenaj, Mattatta, Zabad, Elifelet, Jeremaj, Manasses i Szimei;"
"Ezd10,34": "Z synów Baniego: Maadaj, Amram, Uel;"
"Ezd10,35": "Benajasz, Bedejasz, Cheluhu;"
"Ezd10,36": "Waniasz, Meremot, Eliaszib;"
"Ezd10,37": "Mattaniasz, Mattenaj, Jaasaj;"
"Ezd10,38": "I Bani, Binnuj, Szimei;"
"Ezd10,39": "I Szelemiasz, Natan, Adajasz;"
"Ezd10,40": "Machnadbaj, Szaszaj, Szaraj;"
"Ezd10,41": "Asarel, Szelemiasz, Szemariasz;"
"Ezd10,42": "Szallum, Amariasz i Józef;"
"Ezd10,43": "Z synów Nebo: Jejel, Mattitiasz, Zabad, Zebina, Jaddaj, Joel i Benajasz."
"Ezd10,44": "Ci wszyscy pojęli obce żony. A były wśród nich żony, które urodziły im dzieci."
