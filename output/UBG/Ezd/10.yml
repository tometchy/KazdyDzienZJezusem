"Ezd10,1":
  text: "A gdy Ezdrasz modlił się i wyznawał grzechy z płaczem, klęcząc przed domem Bożym, zebrał się wokół niego bardzo wielki tłum mężczyzn, kobiet i dzieci z Izraela, a lud bardzo gorzko płakał."
  tags: []
"Ezd10,2":
  text: "Wtedy Szekaniasz, syn Jechiela z synów Elama, powiedział do Ezdrasza: My zgrzeszyliśmy przeciwko naszemu Bogu, bo pojęliśmy obce żony z ludu tej ziemi. Ale jest jeszcze nadzieja dla Izraela w tej sprawie."
  tags: []
"Ezd10,3":
  text: "Teraz więc zawrzyjmy przymierze z naszym Bogiem – odprawmy wszystkie żony i dzieci z nich urodzone, według rady PANA i tych, którzy drżą przed przykazaniem naszego Boga. Niech to się stanie według prawa."
  tags: []
"Ezd10,4":
  text: "Wstań, bo do ciebie należy ta sprawa, a my będziemy z tobą. Wzmocnij się i działaj."
  tags: []
"Ezd10,5":
  text: "Wtedy Ezdrasz wstał i zaprzysiągł przedniejszych kapłanów, Lewitów i całego Izraela, by postąpili według tego słowa. I przysięgli."
  tags: []
"Ezd10,6":
  text: "Potem Ezdrasz opuścił dom Boży i udał się do komnaty Jochanana, syna Eliasziba. Kiedy tam wszedł, nie jadł chleba ani nie pił wody, gdyż smucił się z powodu przestępstwa tych, którzy powrócili z niewoli."
  tags: []
"Ezd10,7":
  text: "Następnie ogłoszono w Judzie i Jerozolimie wszystkim, którzy powrócili z niewoli, że mają zgromadzić się w Jerozolimie."
  tags: []
"Ezd10,8":
  text: "A ktokolwiek nie przyjdzie w ciągu trzech dni, według postanowienia naczelników i starszych, ten zostanie pozbawiony całego mienia, a sam będzie wykluczony ze zgromadzenia tych, którzy powrócili z niewoli."
  tags: []
"Ezd10,9":
  text: "Zgromadzili się więc wszyscy mężczyźni z Judy i Beniamina w Jerozolimie w ciągu trzech dni. Było to w dwudziestym dniu dziewiątego miesiąca. A cały lud siedział na placu przed domem Bożym, drżąc z powodu tej sprawy i z powodu deszczu."
  tags: []
"Ezd10,10":
  text: "Wtedy Ezdrasz powstał i powiedział do nich: Wy zgrzeszyliście, bo pojęliście obce żony, a przez to pomnożyliście grzech Izraela."
  tags: []
"Ezd10,11":
  text: "Teraz więc wyznajcie grzech PANU, Bogu waszych ojców, i spełnijcie jego wolę. Odłączcie się od ludu tej ziemi i od obcych żon."
  tags: []
"Ezd10,12":
  text: "A całe zgromadzenie odpowiedziało donośnym głosem: Jak nam powiedziałeś, tak uczynimy."
  tags: []
"Ezd10,13":
  text: "Ale lud jest liczny i pora deszczowa i nie możemy stać na dworze. Ponadto ta sprawa nie jest na jeden dzień ani dwa, gdyż jest nas wielu, którzy dopuściliśmy się tego przestępstwa."
  tags: []
"Ezd10,14":
  text: "Prosimy więc, niech nasi przywódcy będą postawieni przed całym zgromadzeniem i wszyscy, którzy w naszych miastach pojęli obce żony, niech przyjdą o wyznaczonej porze – z nimi starsi z każdego miasta oraz ich sędziowie, abyśmy w ten sposób odwrócili od nas zapalczywość gniewu naszego Boga z powodu tej sprawy."
  tags: []
"Ezd10,15":
  text: "Tylko Jonatan, syn Asahela, i Jachzejasz, syn Tikwy, zajmowali się tym. I Meszullam i Szabbetaj, Lewici, pomagali im."
  tags: []
"Ezd10,16":
  text: "Tak więc postąpili ci, którzy powrócili z niewoli. I kapłan Ezdrasz wraz z naczelnikami poszczególnych rodów, wszyscy zostali odłączeni imiennie. I zasiedli w pierwszym dniu dziesiątego miesiąca, aby zbadać tę sprawę."
  tags: []
"Ezd10,17":
  text: "I do pierwszego dnia pierwszego miesiąca zakończyli sprawę ze wszystkimi mężczyznami, którzy pojęli obce żony."
  tags: []
"Ezd10,18":
  text: "Wśród synów kapłanów znaleźli się tacy, którzy pojęli obce żony: spośród synów Jeszuy, syna Jocadaka i jego braci: Maasejasz, Eliezer, Jarib i Gedaliasz."
  tags: []
"Ezd10,19":
  text: "Ci zaręczyli, że odprawią swoje żony, a jako że byli winni – każdy złoży barana ze stada za swój występek."
  tags: []
"Ezd10,20":
  text: "A z synów Immera: Chanani i Zebadiasz;"
  tags: []
"Ezd10,21":
  text: "A z synów Charima: Maasejasz, Eliasz, Szemajasz, Jechiel i Uzjasz;"
  tags: []
"Ezd10,22":
  text: "A z synów Paszchura: Elioenaj, Maasejasz, Izmael, Netaneel, Jozabad i Elasa;"
  tags: []
"Ezd10,23":
  text: "A z Lewitów: Jozabad, Szimei, Kelajasz, to jest Kelita, Petachiasz, Juda i Eliezer;"
  tags: []
"Ezd10,24":
  text: "A ze śpiewaków: Eliaszib; a z odźwiernych: Szallum, Telem i Uri;"
  tags: []
"Ezd10,25":
  text: "A z Izraela, z synów Parosza: Ramiasz, Jezjasz, Malkiasz, Miamin, Eleazar, Malkijasz i Benajasz;"
  tags: []
"Ezd10,26":
  text: "A z synów Elama: Mattaniasz, Zachariasz, Jechiel, Abdi, Jeremot i Eliasz;"
  tags: []
"Ezd10,27":
  text: "A z synów Zattua: Elioenaj, Eliaszib, Mattaniasz, Jeremot, Zabad i Aziza;"
  tags: []
"Ezd10,28":
  text: "A z synów Bebaja: Jehochanan, Chananiasz, Zabbaj i Atlaj;"
  tags: []
"Ezd10,29":
  text: "A z synów Baniego: Meszullam, Malluk, Adajasz, Jaszub, Szeal i Jeremot;"
  tags: []
"Ezd10,30":
  text: "A z synów Pachat-Moaba: Adna, Kelal, Benajasz, Maasejasz, Mattaniasz, Besaleel, Binnuj i Manasses;"
  tags: []
"Ezd10,31":
  text: "A z synów Charima: Eliezer, Jeszsziasz, Malkiasz, Szemajasz, Szymon;"
  tags: []
"Ezd10,32":
  text: "Beniamin, Maluk i Szemariasz;"
  tags: []
"Ezd10,33":
  text: "Z synów Chaszuma: Mattenaj, Mattatta, Zabad, Elifelet, Jeremaj, Manasses i Szimei;"
  tags: []
"Ezd10,34":
  text: "Z synów Baniego: Maadaj, Amram, Uel;"
  tags: []
"Ezd10,35":
  text: "Benajasz, Bedejasz, Cheluhu;"
  tags: []
"Ezd10,36":
  text: "Waniasz, Meremot, Eliaszib;"
  tags: []
"Ezd10,37":
  text: "Mattaniasz, Mattenaj, Jaasaj;"
  tags: []
"Ezd10,38":
  text: "I Bani, Binnuj, Szimei;"
  tags: []
"Ezd10,39":
  text: "I Szelemiasz, Natan, Adajasz;"
  tags: []
"Ezd10,40":
  text: "Machnadbaj, Szaszaj, Szaraj;"
  tags: []
"Ezd10,41":
  text: "Asarel, Szelemiasz, Szemariasz;"
  tags: []
"Ezd10,42":
  text: "Szallum, Amariasz i Józef;"
  tags: []
"Ezd10,43":
  text: "Z synów Nebo: Jejel, Mattitiasz, Zabad, Zebina, Jaddaj, Joel i Benajasz."
  tags: []
"Ezd10,44":
  text: "Ci wszyscy pojęli obce żony. A były wśród nich żony, które urodziły im dzieci."
  tags: []
