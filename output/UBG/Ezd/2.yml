"Ezd2,1":
  text: "A oto są ludzie prowincji, którzy wyszli z niewoli i wygnania, uprowadzeni do Babilonu przez Nabuchodonozora, króla Babilonu, a powrócili oni do Jerozolimy i Judy – każdy do swojego miasta."
  tags: []
"Ezd2,2":
  text: "Przybyli razem z Zorobabelem, Jeszuą, Nehemiaszem, Serajaszem, Reelajaszem, Mardocheuszem, Bilszanem, Misparem, Bigwajem, Rechumem i Baaną. A oto liczba mężczyzn ludu Izraela:"
  tags: []
"Ezd2,3":
  text: "Synów Parosza – dwa tysiące stu siedemdziesięciu dwóch;"
  tags: []
"Ezd2,4":
  text: "Synów Szefatiasza – trzystu siedemdziesięciu dwóch;"
  tags: []
"Ezd2,5":
  text: "Synów Aracha – siedmiuset siedemdziesięciu pięciu;"
  tags: []
"Ezd2,6":
  text: "Synów Pachat-Moaba, synów Jeszuy i Joaba – dwa tysiące ośmiuset dwunastu;"
  tags: []
"Ezd2,7":
  text: "Synów Elama – tysiąc dwustu pięćdziesięciu czterech;"
  tags: []
"Ezd2,8":
  text: "Synów Zattua – dziewięciuset czterdziestu pięciu;"
  tags: []
"Ezd2,9":
  text: "Synów Zakkaja – siedmiuset sześćdziesięciu;"
  tags: []
"Ezd2,10":
  text: "Synów Baniego – sześciuset czterdziestu dwóch;"
  tags: []
"Ezd2,11":
  text: "Synów Bebaja – sześciuset dwudziestu trzech;"
  tags: []
"Ezd2,12":
  text: "Synów Azgada – tysiąc dwustu dwudziestu dwóch;"
  tags: []
"Ezd2,13":
  text: "Synów Adonikama – sześciuset sześćdziesięciu sześciu;"
  tags: []
"Ezd2,14":
  text: "Synów Bigwaja – dwa tysiące pięćdziesięciu sześciu;"
  tags: []
"Ezd2,15":
  text: "Synów Adina – czterystu pięćdziesięciu czterech;"
  tags: []
"Ezd2,16":
  text: "Synów Atera, z linii Ezechiasza – dziewięćdziesięciu ośmiu;"
  tags: []
"Ezd2,17":
  text: "Synów Besaja – trzystu dwudziestu trzech;"
  tags: []
"Ezd2,18":
  text: "Synów Jory – stu dwunastu;"
  tags: []
"Ezd2,19":
  text: "Synów Chaszuma – dwustu dwudziestu trzech;"
  tags: []
"Ezd2,20":
  text: "Synów Gibbara – dziewięćdziesięciu pięciu;"
  tags: []
"Ezd2,21":
  text: "Synów z Betlejem – stu dwudziestu trzech;"
  tags: []
"Ezd2,22":
  text: "Mężczyzn z Netofy – pięćdziesięciu sześciu;"
  tags: []
"Ezd2,23":
  text: "Mężczyzn z Anatot – stu dwudziestu ośmiu;"
  tags: []
"Ezd2,24":
  text: "Synów z Azmawet – czterdziestu dwóch;"
  tags: []
"Ezd2,25":
  text: "Synów z Kiriat-Jearim, Kefiry i Beerot – siedmiuset czterdziestu trzech;"
  tags: []
"Ezd2,26":
  text: "Synów z Rama i Geba – sześciuset dwudziestu jeden;"
  tags: []
"Ezd2,27":
  text: "Mężczyzn z Mikmas – stu dwudziestu dwóch;"
  tags: []
"Ezd2,28":
  text: "Mężczyzn z Betela i Aj – dwustu dwudziestu trzech;"
  tags: []
"Ezd2,29":
  text: "Synów Nebo – pięćdziesięciu dwóch;"
  tags: []
"Ezd2,30":
  text: "Synów Magbisza – stu pięćdziesięciu sześciu;"
  tags: []
"Ezd2,31":
  text: "Synów drugiego Elama – tysiąc dwustu pięćdziesięciu czterech;"
  tags: []
"Ezd2,32":
  text: "Synów Charima – trzystu dwudziestu;"
  tags: []
"Ezd2,33":
  text: "Synów z Loda, Chadida i Ono – siedmiuset dwudziestu pięciu;"
  tags: []
"Ezd2,34":
  text: "Synów z Jerycha – trzystu czterdziestu pięciu;"
  tags: []
"Ezd2,35":
  text: "Synów Senai – trzy tysiące sześciuset trzydziestu."
  tags: []
"Ezd2,36":
  text: "Kapłani: synów Jedajasza, z domu Jeszuy – dziewięciuset siedemdziesięciu trzech;"
  tags: []
"Ezd2,37":
  text: "Synów Immera – tysiąc pięćdziesięciu dwóch;"
  tags: []
"Ezd2,38":
  text: "Synów Paszchura – tysiąc dwustu czterdziestu siedmiu;"
  tags: []
"Ezd2,39":
  text: "Synów Charima – tysiąc siedemnastu."
  tags: []
"Ezd2,40":
  text: "Lewici: synów Jeszuy i Kadmiela, synów Hodawiasza – siedemdziesięciu czterech."
  tags: []
"Ezd2,41":
  text: "Śpiewacy: synów Asafa – stu dwudziestu ośmiu."
  tags: []
"Ezd2,42":
  text: "Synowie odźwiernych: synów Szalluma, synów Atera, synów Talmona, synów Akkuba, synów Chatity, synów Szobaja, wszystkich razem – stu trzydziestu dziewięciu."
  tags: []
"Ezd2,43":
  text: "Netinici: synów Sichy, synów Chasufy, synów Tabbaota;"
  tags: []
"Ezd2,44":
  text: "Synów Kerosa, synów Sijachy, synów Padona;"
  tags: []
"Ezd2,45":
  text: "Synów Lebany, synów Hagaby, synów Akkuba;"
  tags: []
"Ezd2,46":
  text: "Synów Chagaba, synów Szalmaja, synów Chanana;"
  tags: []
"Ezd2,47":
  text: "Synów Giddela, synów Gachara, synów Reajasza;"
  tags: []
"Ezd2,48":
  text: "Synów Resina, synów Nekody, synów Gazzama;"
  tags: []
"Ezd2,49":
  text: "Synów Uzzy, synów Paseacha, synów Besaja;"
  tags: []
"Ezd2,50":
  text: "Synów Asny, synów Mehunima, synów Nefusima;"
  tags: []
"Ezd2,51":
  text: "Synów Bakbuka, synów Chakufy, synów Charchura;"
  tags: []
"Ezd2,52":
  text: "Synów Basluta, synów Mechidy, synów Charszy;"
  tags: []
"Ezd2,53":
  text: "Synów Barkosa, synów Sisery, synów Tamacha;"
  tags: []
"Ezd2,54":
  text: "Synów Nesjacha, synów Chatify;"
  tags: []
"Ezd2,55":
  text: "Synów sług Salomona, synów Sotaja, synów Sofereta, synów Perudy;"
  tags: []
"Ezd2,56":
  text: "Synów Jaali, synów Darkona, synów Giddela;"
  tags: []
"Ezd2,57":
  text: "Synów Szefatiasza, synów Chattila, synów Pocheret-Hassebaima, synów Amiego;"
  tags: []
"Ezd2,58":
  text: "Wszystkich Netinitów oraz synów sług Salomona – trzystu dziewięćdziesięciu dwóch."
  tags: []
"Ezd2,59":
  text: "A oto ci, którzy wyruszyli z Tel-Melach, Telcharsa, Keruba, Addan i Immer, ale nie mogli wykazać pochodzenia domu swoich ojców ani swego potomstwa – czy są z Izraela."
  tags: []
"Ezd2,60":
  text: "Synów Delajasza, synów Tobiasza, synów Nekody – sześciuset pięćdziesięciu dwóch."
  tags: []
"Ezd2,61":
  text: "A synowie kapłanów: synowie Chobajasza, synowie Kosa, synowie Barzillaja, który pojął za żonę jedną z córek Barzillaja Gileadczyka i przybrał jego imię;"
  tags: []
"Ezd2,62":
  text: "Ci szukali swego opisu w rodowodach, ale go nie znaleźli. Zostali więc jako nieczyści wykluczeni z kapłaństwa."
  tags: []
"Ezd2,63":
  text: "I Tirszata zakazał im spożywać z rzeczy najświętszych, dopóki nie powstanie kapłan z Urim i z Tummim."
  tags: []
"Ezd2,64":
  text: "Całe to zgromadzenie liczyło czterdzieści dwa tysiące trzysta sześćdziesiąt osób;"
  tags: []
"Ezd2,65":
  text: "Nie licząc ich sług i służących, których było siedem tysięcy trzysta trzydzieści siedem, a między nimi znajdowało się dwieście śpiewaków i śpiewaczek."
  tags: []
"Ezd2,66":
  text: "Koni mieli siedemset trzydzieści sześć, mułów – dwieście czterdzieści pięć;"
  tags: []
"Ezd2,67":
  text: "Wielbłądów – czterysta trzydzieści pięć, osłów – sześć tysięcy siedemset dwadzieścia."
  tags: []
"Ezd2,68":
  text: "A niektórzy z naczelników rodów, gdy przyszli do domu PANA, który był w Jerozolimie, składali dobrowolne dary, aby odbudować dom Boży na jego miejscu."
  tags: []
"Ezd2,69":
  text: "Według swoich możliwości dali do skarbca na odbudowę sześćdziesiąt jeden tysięcy drachm złota, pięć tysięcy min srebra i sto szat kapłańskich."
  tags: []
"Ezd2,70":
  text: "A więc kapłani, Lewici i część ludu oraz śpiewacy, odźwierni i Netinici zamieszkali w swoich miastach, a cała reszta Izraela w swoich miastach."
  tags: []
