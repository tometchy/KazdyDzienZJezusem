"Ezd2,57": "Synów Szefatiasza, synów Chattila, synów Pocheret-Hassebaima, synów Amiego;"
"Ezd2,58": "Wszystkich Netinitów oraz synów sług Salomona – trzystu dziewięćdziesięciu dwóch."
"Ezd2,59": "A oto ci, którzy wyruszyli z Tel-Melach, Telcharsa, Keruba, Addan i Immer, ale nie mogli wykazać pochodzenia domu swoich ojców ani swego potomstwa – czy są z Izraela."
"Ezd2,60": "Synów Delajasza, synów Tobiasza, synów Nekody – sześciuset pięćdziesięciu dwóch."
"Ezd2,61": "A synowie kapłanów: synowie Chobajasza, synowie Kosa, synowie Barzillaja, który pojął za żonę jedną z córek Barzillaja Gileadczyka i przybrał jego imię;"
"Ezd2,62": "Ci szukali swego opisu w rodowodach, ale go nie znaleźli. Zostali więc jako nieczyści wykluczeni z kapłaństwa."
"Ezd2,63": "I Tirszata zakazał im spożywać z rzeczy najświętszych, dopóki nie powstanie kapłan z Urim i z Tummim."
"Ezd2,64": "Całe to zgromadzenie liczyło czterdzieści dwa tysiące trzysta sześćdziesiąt osób;"
"Ezd2,65": "Nie licząc ich sług i służących, których było siedem tysięcy trzysta trzydzieści siedem, a między nimi znajdowało się dwieście śpiewaków i śpiewaczek."
"Ezd2,66": "Koni mieli siedemset trzydzieści sześć, mułów – dwieście czterdzieści pięć;"
"Ezd2,67": "Wielbłądów – czterysta trzydzieści pięć, osłów – sześć tysięcy siedemset dwadzieścia."
"Ezd2,68": "A niektórzy z naczelników rodów, gdy przyszli do domu PANA, który był w Jerozolimie, składali dobrowolne dary, aby odbudować dom Boży na jego miejscu."
"Ezd2,69": "Według swoich możliwości dali do skarbca na odbudowę sześćdziesiąt jeden tysięcy drachm złota, pięć tysięcy min srebra i sto szat kapłańskich."
"Ezd2,70": "A więc kapłani, Lewici i część ludu oraz śpiewacy, odźwierni i Netinici zamieszkali w swoich miastach, a cała reszta Izraela w swoich miastach."
