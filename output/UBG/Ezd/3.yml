"Ezd3,1":
  text: "A gdy nadszedł siódmy miesiąc, a synowie Izraela znajdowali się w miastach, zgromadził się lud jak jeden mąż w Jerozolimie."
  tags: []
"Ezd3,2":
  text: "Wtedy powstał Jeszua, syn Jocadaka, ze swymi braćmi kapłanami, oraz Zorobabel, syn Szealtiela, wraz ze swymi braćmi, i zbudowali ołtarz Boga Izraela, aby na nim składać całopalenia, jak jest napisane w Prawie Mojżesza, męża Bożego."
  tags: []
"Ezd3,3":
  text: "Potem postawili ołtarz na swoich fundamentach i chociaż bali się sąsiednich narodów, składali na nim PANU całopalenia – rano i wieczorem."
  tags: []
"Ezd3,4":
  text: "Obchodzili też Święto Namiotów, jak jest napisane, i składali codzienne całopalenia w liczbie ustalonej według zwyczaju na każdy dzień;"
  tags: []
"Ezd3,5":
  text: "Potem składali całopalenie nieustanne – zarówno w dni nowiu, jak i każde święto poświęcone PANU – oraz dary od każdego, kto składał PANU dobrowolną ofiarę."
  tags: []
"Ezd3,6":
  text: "Od pierwszego dnia siódmego miesiąca zaczęli składać PANU całopalenia, chociaż fundamenty świątyni jeszcze nie zostały położone."
  tags: []
"Ezd3,7":
  text: "Dali też pieniądze kamieniarzom i cieślom oraz żywność, napój i oliwę Sydończykom i Tyryjczykom, aby przywozili drzewo cedrowe z Libanu morzem do Jafy, zgodnie z zezwoleniem Cyrusa, króla Persji."
  tags: []
"Ezd3,8":
  text: "A w drugim roku po ich przybyciu do domu Bożego w Jerozolimie, w drugim miesiącu, Zorobabel, syn Szealtiela, i Jeszua, syn Jocadaka, i pozostali ich bracia kapłani i Lewici oraz wszyscy, którzy powrócili z niewoli do Jerozolimy, zaczęli odbudowę, a ustanowili Lewitów od dwudziestu lat wzwyż, aby byli nadzorcami robót wokół domu PANA."
  tags: []
"Ezd3,9":
  text: "I Jeszua, jego synowie i bracia: Kadmiel i jego synowie, synowie Judy, stanęli jak jeden mąż, aby kierować tymi, którzy pracowali przy budowie domu Bożego: synami Chenadada, ich synami i ich braćmi, Lewitami."
  tags: []
"Ezd3,10":
  text: "A gdy budowniczowie położyli fundamenty świątyni PANA, postawili kapłanów, ubranych w szaty i z trąbami, oraz Lewitów, synów Asafa, z cymbałami, aby chwalić PANA zgodnie z postanowieniem Dawida, króla Izraela."
  tags: []
"Ezd3,11":
  text: "I śpiewali jedni po drugich, chwaląc PANA i dziękując mu za to, że jest dobry – że jego miłosierdzie nad Izraelem trwa na wieki. Cały lud wznosił głośny okrzyk, gdy chwalił PANA za to, że zostały położone fundamenty domu PANA."
  tags: []
"Ezd3,12":
  text: "Lecz wielu kapłanów, Lewitów i naczelników rodów, którzy byli starcami i widzieli tamten pierwszy dom, głośno płakało, gdy na ich oczach zakładano fundamenty tego domu, wielu natomiast innych głośno krzyczało z radości;"
  tags: []
"Ezd3,13":
  text: "Tak że lud nie mógł odróżnić głośnego krzyku radości od głośnego płaczu ludu. Lud bowiem wznosił tak wielki okrzyk, że było go słychać z daleka."
  tags: []
