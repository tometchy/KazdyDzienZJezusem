"Ezd5,1":
  text: "Potem prorocy Aggeusz i Zachariasz, syn Iddo, prorokowali Żydom w Judzie i w Jerozolimie w imię Boga Izraela, mówiąc do nich."
  tags: []
"Ezd5,2":
  text: "Wtedy powstali Zorobabel, syn Szealtiela, i Jeszua, syn Jocadaka, i zaczęli budować dom Boży w Jerozolimie; a z nimi prorocy Boga, którzy im pomagali."
  tags: []
"Ezd5,3":
  text: "W tym czasie przyszli do nich Tattenaj, namiestnik zarzecza, i Szetarboznaj oraz ich towarzysze i tak mówili do nich: Kto wam rozkazał budować ten dom i wznosić jego mury?"
  tags: []
"Ezd5,4":
  text: "Odpowiedzieliśmy im, jakie są imiona tych mężczyzn, którzy pracują przy tej budowli."
  tags: []
"Ezd5,5":
  text: "Lecz oko ich Boga czuwało nad starszymi z Żydów, tak że nie mogli im przeszkadzać, dopóki sprawa ta nie dotarła do Dariusza – o niej donosili mu przez list."
  tags: []
"Ezd5,6":
  text: "To jest odpis listu, który do króla Dariusza posłali Tattenaj, namiestnik zarzecza, Szetarboznaj i jego towarzysze Afarsachajczycy, którzy byli za rzeką."
  tags: []
"Ezd5,7":
  text: "Posłali mu list, w którym było napisane tak: Królowi Dariuszowi wszelkiej pomyślności!"
  tags: []
"Ezd5,8":
  text: "Niech będzie królowi wiadomo, że przybyliśmy do prowincji Judy, do domu wielkiego Boga, który jest odbudowywany z wielkich kamieni, a którego ściany są wykładane drewnem. Ta praca posuwa się szybko i szczęści się w ich rękach."
  tags: []
"Ezd5,9":
  text: "Pytaliśmy wtedy tych starszych, mówiąc do nich: Kto wam rozkazał budować ten dom i wznosić te mury?"
  tags: []
"Ezd5,10":
  text: "Pytaliśmy także o ich imiona, abyśmy mogli ci je oznajmić i zapisać imiona mężczyzn, którzy stoją na ich czele."
  tags: []
"Ezd5,11":
  text: "A tak nam odpowiedzieli: My jesteśmy sługami Boga nieba i ziemi i odbudowujemy dom, który został wzniesiony przed wieloma laty, a który zbudował i wystawił wielki król Izraela."
  tags: []
"Ezd5,12":
  text: "Lecz gdy nasi ojcowie pobudzili do gniewu Boga nieba, on wydał ich w ręce Nabuchodonozora, króla Babilonu, Chaldejczyka, który zburzył ten dom, a lud uprowadził do niewoli w Babilonie."
  tags: []
"Ezd5,13":
  text: "Jednak w pierwszym roku Cyrusa, króla Babilonu, sam król Cyrus wydał dekret, aby odbudować ten dom Boży."
  tags: []
"Ezd5,14":
  text: "Ponadto złote i srebrne naczynia domu Bożego, które Nabuchodonozor zabrał ze świątyni w Jerozolimie i umieścił w świątyni w Babilonie, król Cyrus wyniósł ze świątyni w Babilonie i zostały przekazane niejakiemu Szeszbassarowi, którego ustanowił namiestnikiem."
  tags: []
"Ezd5,15":
  text: "I powiedział mu: Weź te naczynia, idź i złóż je w świątyni, która jest w Jerozolimie, a niech dom Boży zostanie odbudowany na swoim miejscu."
  tags: []
"Ezd5,16":
  text: "Wtedy ten Szeszbassar przyszedł i położył fundamenty domu Bożego w Jerozolimie, i od tego czasu aż do dzisiaj buduje się go, ale nie jest ukończony."
  tags: []
"Ezd5,17":
  text: "Jeśli więc król uzna to za dobrą rzecz, niech poszukają w skarbcach królewskich w Babilonie, czy rzeczywiście tak jest, że król Cyrus rozkazał, aby odbudować ten dom Boży w Jerozolimie, i niech król powiadomi nas o swej woli w tej sprawie."
  tags: []
