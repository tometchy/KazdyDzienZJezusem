"Mi3,1":
  text: "I powiedziałem: Słuchajcie, naczelnicy Jakuba i wodzowie domu Izraela! Czy wy nie powinniście znać sądu?"
  tags: []
"Mi3,2":
  text: "Wy, którzy nienawidzicie dobra, a kochacie zło, którzy zdzieracie z ludu skórę i ciało z jego kości;"
  tags: []
"Mi3,3":
  text: "Którzy jecie ciało mojego ludu, skórę z niego zdzieracie, jego kości łamiecie i kroicie je na kawałki jak do garnca i jak mięso do kotła."
  tags: []
"Mi3,4":
  text: "Wtedy będą wołać do PANA, a nie wysłucha ich, lecz zakryje swoje oblicze przed nimi w tym czasie, gdyż oni popełniali złe czyny."
  tags: []
"Mi3,5":
  text: "Tak mówi PAN o tych prorokach, którzy w błąd wprowadzą mój lud, którzy gryzą swoimi zębami i głoszą pokój, a temu, który nic im nie włoży do ust, wypowiadają wojnę."
  tags: []
"Mi3,6":
  text: "Dlatego wasze widzenie zamienia się w noc, a wasza wróżba – w ciemność; słońce zajdzie nad prorokami i dzień się zaćmi nad nimi."
  tags: []
"Mi3,7":
  text: "Wtedy widzący będą się wstydzić i wróżbiarze się zarumienią. Oni wszyscy zakryją swoje wargi, bo nie będzie żadnej odpowiedzi od Boga."
  tags: []
"Mi3,8":
  text: "Ale ja jestem napełniony mocą Ducha PANA oraz sądu i siły, aby oznajmić Jakubowi jego występki i Izraelowi jego grzech."
  tags: []
"Mi3,9":
  text: "Słuchajcie tego, naczelnicy domu Jakuba i wodzowie domu Izraela, którzy brzydzicie się sądem i wypaczacie wszystko, co sprawiedliwe."
  tags: []
"Mi3,10":
  text: "Każdy buduje Syjon krwią, a Jerozolimę nieprawością."
  tags: []
"Mi3,11":
  text: "Jej naczelnicy sądzą za dary, jego kapłani uczą za zapłatę i jego prorocy prorokują za pieniądze. Polegają jednak na PANU, mówiąc: Czy PAN nie jest wśród nas? Nie spotka nas nic złego."
  tags: []
"Mi3,12":
  text: "Dlatego Syjon stanie się dla was jak zaorane pole, Jerozolima zamieni się w kupę gruzu, a góra domu – w zalesione wzgórze."
  tags: []
