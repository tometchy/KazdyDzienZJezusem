"Mi5,1":
  text: "Zbierz się teraz w oddziały, córko oddziałów! Obległ nas. Laską będą bić w policzek sędziego Izraela."
  tags: []
"Mi5,2":
  text: "Ale ty, Betlejem Efrata, choć jesteś najmniejsze wśród tysięcy w Judzie, z ciebie jednak wyjdzie mi ten, który będzie władcą w Izraelu, a jego wyjścia są od dawna, od dni wiecznych."
  tags: []
"Mi5,3":
  text: "Dlatego wyda ich aż do czasu, kiedy rodząca porodzi. Wtedy resztka jego braci wróci do synów Izraela."
  tags: []
"Mi5,4":
  text: "Powstanie i będzie paść w mocy PANA i w majestacie imienia PANA, swego Boga. I będą mieszkać spokojnie, bo już będzie on wielki aż po krańce ziemi."
  tags: []
"Mi5,5":
  text: "I będzie on pokojem, gdy Asyryjczyk wtargnie do naszej ziemi. I gdy podepcze nasze pałace, wtedy wystawimy przeciw niemu siedmiu pasterzy i ośmiu książąt z ludu."
  tags: []
"Mi5,6":
  text: "Ci ogołocą ziemię Asyrii mieczem i ziemię Nimroda na jej granicach. W ten sposób wybawi nas od Asyryjczyka, gdy nadciągnie do naszej ziemi i gdy będzie stąpał w naszych granicach."
  tags: []
"Mi5,7":
  text: "Dlatego resztka Jakuba będzie pośród wielu narodów jak rosa od PANA, jak deszcze skrapiające trawę, które nie czekają na człowieka ani nie polegają na synach ludzkich."
  tags: []
"Mi5,8":
  text: "Resztka Jakuba będzie też pośród pogan, wśród wielu narodów, jak lew między leśnymi zwierzętami i jak lwiątko między trzodami owiec, które – gdy przechodzi – depcze i szarpie, a nie ma nikogo, kto by je ocalił."
  tags: []
"Mi5,9":
  text: "Wywyższy się twoja ręka nad twoimi wrogami, a wszyscy twoi przeciwnicy będą wykorzenieni."
  tags: []
"Mi5,10":
  text: "I stanie się w tym dniu, mówi PAN, że wytracę twoje konie spośród ciebie i zniszczę twoje rydwany."
  tags: []
"Mi5,11":
  text: "Wygubię miasta twojej ziemi i zburzę wszystkie twoje twierdze."
  tags: []
"Mi5,12":
  text: "Wytracę czary z twojej ręki i nie będzie już u ciebie wróżbitów."
  tags: []
"Mi5,13":
  text: "Wyniszczę też twoje rzeźbione bożki i twoje obrazy spośród ciebie i nie będziesz już oddawać pokłonu dziełu swoich rąk."
  tags: []
"Mi5,14":
  text: "Wykorzenię twoje gaje spośród ciebie i zgładzę twoich wrogów."
  tags: []
"Mi5,15":
  text: "Tak w gniewie i zapalczywości dokonam zemsty nad narodami, które nie były posłuszne."
  tags: []
