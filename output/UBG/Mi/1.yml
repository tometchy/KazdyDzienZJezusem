"Mi1,1": "Słowo PANA, które doszło do Micheasza z Moreszet za dni Jotama, Achaza i Ezechiasza, królów Judy – to, co widział o Samarii i Jerozolimie."
"Mi1,2": "Słuchajcie, wszystkie narody; słuchaj, ziemio, i wszystko, co na niej jest. A niech Pan BÓG będzie świadkiem przeciwko wam, Pan ze swego świętego przybytku."
"Mi1,3": "Oto bowiem PAN wychodzi ze swojego miejsca, zstąpi i będzie deptać po wysokościach ziemi."
"Mi1,4": "I stopnieją pod nim góry, a doliny rozdzielą się tak, jak wosk przed ogniem i jak wody, które spływają po zboczu."
"Mi1,5": "To wszystko się stanie z powodu przestępstwa Jakuba i z powodu grzechów domu Izraela. Jakie jest przestępstwo Jakuba? Czy to nie Samaria? Co jest wyżyną Judy? Czy nie Jerozolima?"
"Mi1,6": "Dlatego zamienię Samarię w kupę gruzu na polu, w miejsce pod założenie winnicy. Powrzucam w dolinę jej kamienie i odkryję jej fundamenty."
"Mi1,7": "I wszystkie jej wyrzeźbione obrazy będą potłuczone, wszystkie jej dary spalone ogniem i wszystkie jej bożki zamienię w ruinę. To bowiem zgromadziła z zapłaty nierządnicy, to więc obróci się w zapłatę nierządnicy."
"Mi1,8": "Nad tym będę zawodzić i lamentować, chodząc nagi, bez ubrań. Podnoszę zawodzenie jak smoki i lament jak młode strusie;"
"Mi1,9": "Jej rana bowiem jest nieuleczalna, gdyż doszła aż do Judy, a dotarła do bramy mego ludu aż do Jerozolimy."
"Mi1,10": "Nie opowiadajcie tego w Gat ani nie płaczcie. Tarzajcie się w prochu, w domu Afra."
"Mi1,11": "Przejdź ty, która mieszkasz w Szafirze w haniebnej nagości. Ta, która mieszka w Saananie, nie wyszła na żałobę w Bet-Hezel; weźmie od was swoją żywność."
"Mi1,12": "Ta, która mieszka w Marot, oczekiwała dobra, ale zło zstąpiło od PANA aż do bramy Jerozolimy."
"Mi1,13": "Zaprzęgaj konie do rydwanu, mieszkanko Lakisz, która jesteś powodem grzechu córki Syjonu, gdyż w tobie znalezione są przestępstwa Izraela."
"Mi1,14": "Dlatego poślesz dary do Moreszet-Gat. Domy Akzibu będą ułudą dla królów Izraela."
"Mi1,15": "Jeszcze przyprowadzę ci dziedzica, mieszkanko Mareszy. Przyjdzie aż do Adullam, do chwały Izraela."
"Mi1,16": "Ogol się i ostrzyż z powodu swoich ukochanych synów; rozszerz swą łysinę jak orzeł, bo poszli od ciebie do niewoli."
