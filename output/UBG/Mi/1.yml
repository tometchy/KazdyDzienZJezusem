"Mi1,1":
  text: "Słowo PANA, które doszło do Micheasza z Moreszet za dni Jotama, Achaza i Ezechiasza, królów Judy – to, co widział o Samarii i Jerozolimie."
  tags: []
"Mi1,2":
  text: "Słuchajcie, wszystkie narody; słuchaj, ziemio, i wszystko, co na niej jest. A niech Pan BÓG będzie świadkiem przeciwko wam, Pan ze swego świętego przybytku."
  tags: []
"Mi1,3":
  text: "Oto bowiem PAN wychodzi ze swojego miejsca, zstąpi i będzie deptać po wysokościach ziemi."
  tags: []
"Mi1,4":
  text: "I stopnieją pod nim góry, a doliny rozdzielą się tak, jak wosk przed ogniem i jak wody, które spływają po zboczu."
  tags: []
"Mi1,5":
  text: "To wszystko się stanie z powodu przestępstwa Jakuba i z powodu grzechów domu Izraela. Jakie jest przestępstwo Jakuba? Czy to nie Samaria? Co jest wyżyną Judy? Czy nie Jerozolima?"
  tags: []
"Mi1,6":
  text: "Dlatego zamienię Samarię w kupę gruzu na polu, w miejsce pod założenie winnicy. Powrzucam w dolinę jej kamienie i odkryję jej fundamenty."
  tags: []
"Mi1,7":
  text: "I wszystkie jej wyrzeźbione obrazy będą potłuczone, wszystkie jej dary spalone ogniem i wszystkie jej bożki zamienię w ruinę. To bowiem zgromadziła z zapłaty nierządnicy, to więc obróci się w zapłatę nierządnicy."
  tags: []
"Mi1,8":
  text: "Nad tym będę zawodzić i lamentować, chodząc nagi, bez ubrań. Podnoszę zawodzenie jak smoki i lament jak młode strusie;"
  tags: []
"Mi1,9":
  text: "Jej rana bowiem jest nieuleczalna, gdyż doszła aż do Judy, a dotarła do bramy mego ludu aż do Jerozolimy."
  tags: []
"Mi1,10":
  text: "Nie opowiadajcie tego w Gat ani nie płaczcie. Tarzajcie się w prochu, w domu Afra."
  tags: []
"Mi1,11":
  text: "Przejdź ty, która mieszkasz w Szafirze w haniebnej nagości. Ta, która mieszka w Saananie, nie wyszła na żałobę w Bet-Hezel; weźmie od was swoją żywność."
  tags: []
"Mi1,12":
  text: "Ta, która mieszka w Marot, oczekiwała dobra, ale zło zstąpiło od PANA aż do bramy Jerozolimy."
  tags: []
"Mi1,13":
  text: "Zaprzęgaj konie do rydwanu, mieszkanko Lakisz, która jesteś powodem grzechu córki Syjonu, gdyż w tobie znalezione są przestępstwa Izraela."
  tags: []
"Mi1,14":
  text: "Dlatego poślesz dary do Moreszet-Gat. Domy Akzibu będą ułudą dla królów Izraela."
  tags: []
"Mi1,15":
  text: "Jeszcze przyprowadzę ci dziedzica, mieszkanko Mareszy. Przyjdzie aż do Adullam, do chwały Izraela."
  tags: []
"Mi1,16":
  text: "Ogol się i ostrzyż z powodu swoich ukochanych synów; rozszerz swą łysinę jak orzeł, bo poszli od ciebie do niewoli."
  tags: []
