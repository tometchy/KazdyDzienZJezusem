"Mi7,1": "Biada mi! Jestem bowiem jak ostatki po letnich zbiorach, jak pokłosie grona po winobraniu. Nie ma żadnego grona do zjedzenia, moja dusza pragnęła pierwocin z owocu."
"Mi7,2": "Pobożny zginął z ziemi, nie ma prawego wśród ludzi. Wszyscy czyhają na krew, każdy zastawia sieci dla swego brata."
"Mi7,3": "By chętnie czynić zło obiema rękami, książę i sędzia żądają datku; zamożny człowiek wypowiada swoją przewrotną żądzę. I razem wszystko splatają."
"Mi7,4": "Najlepszy z nich jest jak oset; najuczciwszy – jak płot ciernisty. Nadchodzi dzień twoich stróżów i twojego nawiedzenia; już nastanie ich zamieszanie."
"Mi7,5": "Nie wierzcie przyjacielowi, nie ufajcie wodzowi. Strzeż bramy swoich ust przed tą, która leży na twoim łonie."
"Mi7,6": "Syn bowiem lekceważy ojca, córka powstaje przeciwko swojej matce, synowa przeciwko swojej teściowej, a wrogami człowieka są jego domownicy."
"Mi7,7": "Dlatego będę wypatrywał PANA, będę oczekiwać Boga mego zbawienia. Mój Bóg mnie wysłucha."
"Mi7,8": "Nie ciesz się z mojego powodu, moja nieprzyjaciółko! Chociaż upadłem, powstanę; choć siedzę w ciemności, PAN jest moją światłością."
"Mi7,9": "Zniosę gniew PANA, bo zgrzeszyłem przeciwko niemu, aż będzie bronił mojej sprawy i wykona dla mnie sąd. Wyprowadzi mnie na światło i ujrzę jego sprawiedliwość."
"Mi7,10": "Ujrzy to moja nieprzyjaciółka i wstyd okryje tę, która do mnie mówi: Gdzie jest PAN, twój Bóg? Moje oczy będą patrzyć na nią, gdy będzie podeptana jak błoto na ulicach."
"Mi7,11": "W tym dniu, kiedy będą odbudowywać twoje mury, w tym dniu dekret rozejdzie się daleko."
"Mi7,12": "W tym dniu będą przychodzić do ciebie od Asyrii aż po miasta obronne, od miast obronnych aż po rzekę, od morza aż do morza i od góry aż do góry."
"Mi7,13": "Ta ziemia jednak będzie spustoszona z powodu swoich mieszkańców, z powodu owocu ich czynów."
"Mi7,14": "Paś swój lud laską swoją, trzodę swojego dziedzictwa, która mieszka samotnie w lesie i w środku Karmelu. Niech się pasą w Baszanie i Gileadzie jak za dawnych dni."
"Mi7,15": "Ukażę mu cudowne rzeczy jak za dni, gdy wyszedłeś z ziemi Egiptu."
"Mi7,16": "Ujrzą to narody i zawstydzą się całej swojej potęgi. Przyłożą rękę do ust, a ich uszy ogłuchną."
"Mi7,17": "Będą lizać proch jak wąż, wyjdą ze swoich nor jak zwierzęta pełzające do PANA, naszego Boga, ze strachem i będą się bać ciebie."
"Mi7,18": "Któż jest Bogiem jak ty, który przebacza nieprawość i daruje występek resztki swego dziedzictwa? Nie chowa swego gniewu na wieki, bo ma upodobanie w miłosierdziu."
"Mi7,19": "Odwróci się i zlituje się nad nami; pokona nasze nieprawości i wrzuci w głębiny morza wszystkie nasze grzechy."
"Mi7,20": "Pokażesz prawdę Jakubowi i okażesz miłosierdzie Abrahamowi, tak jak przysiągłeś naszym ojcom za dawnych dni."
