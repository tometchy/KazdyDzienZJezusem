"Mi2,1": "Biada tym, którzy wymyślają nieprawość i knują zło na swoich łożach, a o świcie wykonują je, bo jest to w ich mocy."
"Mi2,2": "Pożądają pól i wydzierają je; także domów i je zabierają. W ten sposób gnębią człowieka i jego dom, człowieka i jego dziedzictwo."
"Mi2,3": "Dlatego tak mówi PAN: Oto obmyślam dla tego rodu nieszczęście, z którego nie będziecie mogli wyciągnąć swoich szyj ani nie będziecie chodzić zuchwale. Będzie to bowiem czas nieszczęścia."
"Mi2,4": "W tym dniu powstanie o was przypowieść i podniosą nad wami żałosny lament, mówiąc: Jesteśmy doszczętnie spustoszeni. Odmienił dział mego ludu, jakże mi go odjął! Gdy wziął nasze pole, rozdzielił je."
"Mi2,5": "Dlatego nie będziesz miał nikogo, kto rzuciłby sznurem na los w zgromadzeniu PANA."
"Mi2,6": "Mówią: Nie prorokujcie, niech nam inni prorokują. Nie prorokują bowiem tak, jak ci. Żaden z nich nie przestaje mówić obraźliwie."
"Mi2,7": "O ty, ludu, który słyniesz domem Jakuba! Czy Duch PANA jest ograniczony? Czy takie są jego dzieła? Czy moje słowa nie są dobre dla tego, który postępuje w sposób prawy?"
"Mi2,8": "Wczoraj był moim ludem, a dziś jak wróg powstaje. Zdzieracie płaszcz wraz z szatą z tych, którzy przechodzą bezpiecznie, jakby wracali z wojny."
"Mi2,9": "Kobiety mego ludu wyganiacie z ich przytulnych domów; ich dzieciom odebraliście moją chwałę na zawsze."
"Mi2,10": "Wstańcie i odejdźcie, bo tu nie ma odpoczynku. Z powodu nieczystości zniszczy was, i to zniszczeniem srogim."
"Mi2,11": "Gdy ktoś podaje się za proroka i kłamie, mówiąc: Będę prorokował o winie i o mocnym napoju, to taki staje się prorokiem tego ludu."
"Mi2,12": "Na pewno zgromadzę ciebie całego, Jakubie, na pewno zgromadzę resztkę Izraela. Zbiorę ich razem jak owce Bozra, jak trzodę w środku owczarni, i będzie bardzo głośno z powodu mnóstwa ludzi."
"Mi2,13": "Zstąpi przed nimi ten, który będzie przełamywać. Przełamali się, przeszli przez bramę i wyszli przez nią. Ich król pójdzie przed nimi, a PAN na ich czele."
