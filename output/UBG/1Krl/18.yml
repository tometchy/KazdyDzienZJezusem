"1Krl18,1":
  text: "Po upływie wielu dni, w trzecim roku, doszło do Eliasza słowo PANA: Idź, pokaż się Achabowi, a ja ześlę deszcz na ziemię."
  tags: []
"1Krl18,2":
  text: "Eliasz poszedł więc, aby pokazać się Achabowi. A w Samarii panował wielki głód."
  tags: []
"1Krl18,3":
  text: "Achab zawołał wówczas Abdiasza, który był zarządcą jego domu. (A Abdiasz bardzo bał się PANA."
  tags: []
"1Krl18,4":
  text: "Gdy bowiem Jezabel mordowała proroków PANA, Abdiasz wziął stu proroków, ukrył ich po pięćdziesięciu w jaskiniach i żywił ich chlebem i wodą)."
  tags: []
"1Krl18,5":
  text: "I Achab powiedział do Abdiasza: Przejdź przez ziemię do wszystkich źródeł wód i do wszystkich potoków. Może znajdziemy trawę, abyśmy zachowali przy życiu konie i muły i nie utracili całego bydła."
  tags: []
"1Krl18,6":
  text: "I podzielili między siebie ziemię, którą mieli obejść. Achab poszedł jedną drogą, a Abdiasz poszedł drugą."
  tags: []
"1Krl18,7":
  text: "A gdy Abdiasz był w drodze, Eliasz wyszedł mu naprzeciw. A on go poznał, upadł na twarz i powiedział: Czy to ty, mój panie, Eliaszu?"
  tags: []
"1Krl18,8":
  text: "Odpowiedział mu: To ja jestem. Idź i powiedz swemu panu: Oto jest tu Eliasz."
  tags: []
"1Krl18,9":
  text: "On zaś powiedział: Czym zgrzeszyłem, że wydajesz swego sługę w ręce Achaba, aby mnie zabił?"
  tags: []
"1Krl18,10":
  text: "Jak żyje PAN, twój Bóg, nie ma narodu ani królestwa, gdzie mój pan nie posłał ludzi, aby cię szukać. A gdy powiedziano, że cię nie ma, wtedy kazał przysięgać królestwom i narodom, że cię nie znaleziono."
  tags: []
"1Krl18,11":
  text: "A ty teraz mówisz: Idź, powiedz swemu panu: Oto Eliasz."
  tags: []
"1Krl18,12":
  text: "I stanie się tak, że gdy odejdę od ciebie, Duch PANA zaniesie cię, nie wiem dokąd. Gdy przyjdę powiedzieć Achabowi, a on cię nie znajdzie, wtedy mnie zabije. A twój sługa boi się PANA od swej młodości."
  tags: []
"1Krl18,13":
  text: "Czyż nie powiedziano memu panu, co uczyniłem, gdy Jezabel mordowała proroków PANA – jak ukryłem stu mężczyzn spośród proroków PANA, po pięćdziesięciu mężczyzn w jaskiniach, i żywiłem ich chlebem i wodą?"
  tags: []
"1Krl18,14":
  text: "A teraz mówisz: Idź, powiedz swemu panu: Oto Eliasz. On mnie zabije."
  tags: []
"1Krl18,15":
  text: "Eliasz odpowiedział: Jak żyje PAN zastępów, przed którego obliczem stoję, dziś mu się pokażę."
  tags: []
"1Krl18,16":
  text: "Abdiasz poszedł więc, aby spotkać się z Achabem, i oznajmił mu to. I Achab wyruszył na spotkanie z Eliaszem."
  tags: []
"1Krl18,17":
  text: "Kiedy Achab zobaczył Eliasza, zapytał go: Czy ty jesteś tym, który dręczy Izrael?"
  tags: []
"1Krl18,18":
  text: "Odpowiedział: Nie ja dręczę Izrael, ale ty i dom twego ojca – gdyż porzuciliście przykazania PANA, a ty poszedłeś za Baalami."
  tags: []
"1Krl18,19":
  text: "Teraz więc poślij i zgromadź przy mnie cały Izrael na górze Karmel oraz czterystu pięćdziesięciu proroków Baala, a także czterystu proroków z gajów, którzy jadają u stołu Jezabel."
  tags: []
"1Krl18,20":
  text: "Achab posłał więc po wszystkich synów Izraela i zgromadził proroków na górze Karmel."
  tags: []
"1Krl18,21":
  text: "Wtedy Eliasz zbliżył się do całego ludu i powiedział: Jak długo będziecie się wahać między dwoma zdaniami? Jeśli PAN jest Bogiem, idźcie za nim, a jeśli Baal, idźcie za nim. A lud nie odpowiedział mu ani słowa."
  tags: []
"1Krl18,22":
  text: "Wtedy Eliasz powiedział do ludu: Tylko ja sam pozostałem jako prorok PANA; a proroków Baala jest czterystu pięćdziesięciu."
  tags: []
"1Krl18,23":
  text: "Niech nam dadzą dwa cielce. Niech wybiorą sobie jednego cielca, porąbią go na części i położą na drwach, ale ognia niech nie podkładają. Ja również przygotuję drugiego cielca i położę na drwach, ale ognia nie podłożę."
  tags: []
"1Krl18,24":
  text: "Potem wzywajcie imienia swoich bogów, a ja wezwę imienia PANA. A ten Bóg, który odpowie ogniem, niech będzie Bogiem. Cały lud odpowiedział: Dobre jest to, co powiedziałeś."
  tags: []
"1Krl18,25":
  text: "Eliasz powiedział więc do proroków Baala: Wybierzcie sobie jednego cielca i przygotujcie go pierwsi, bo was jest więcej. Wzywajcie imienia swoich bogów, ale ognia nie podkładajcie."
  tags: []
"1Krl18,26":
  text: "Wzięli więc cielca, którego im dał, a gdy go przygotowali, wzywali imienia Baala, od poranka aż do południa, mówiąc: O Baalu, wysłuchaj nas! Ale nie było głosu ani odpowiedzi. I podskakiwali wokół ołtarza, który zrobili."
  tags: []
"1Krl18,27":
  text: "A gdy nastało południe, Eliasz naśmiewał się z nich, mówiąc: Wołajcie głośniej, przecież to jest bóg, ale może tylko zamyślił się albo jest zajęty, albo też może jest w drodze, albo może śpi i musi się obudzić."
  tags: []
"1Krl18,28":
  text: "Wołali więc głośno i nacinali się według swego zwyczaju nożami i włóczniami, aż krew z nich tryskała."
  tags: []
"1Krl18,29":
  text: "I kiedy minęło południe, oni dalej prorokowali aż do czasu składania ofiary z pokarmów, ale nie było głosu ani odpowiedzi, ani znaku uwagi."
  tags: []
"1Krl18,30":
  text: "Wtedy Eliasz powiedział do całego ludu: Zbliżcie się do mnie. Cały lud zbliżył się więc do niego. On wtedy naprawił zburzony ołtarz PANA."
  tags: []
"1Krl18,31":
  text: "Potem Eliasz wziął dwanaście kamieni, według liczby pokoleń synów Jakuba, do którego doszło słowo PANA: Izrael będzie twoje imię."
  tags: []
"1Krl18,32":
  text: "I z tych kamieni zbudował ołtarz w imię PANA, i wykopał wokół ołtarza rów zdolny pomieścić dwie miary zboża."
  tags: []
"1Krl18,33":
  text: "Potem ułożył drwa, porąbał cielca na części i położył go na drwach. Następnie powiedział: Napełnijcie wodą cztery wiadra i wylejcie ją na ofiarę całopalną i na drwa."
  tags: []
"1Krl18,34":
  text: "I powiedział: Powtórzcie to. I powtórzyli. Potem powiedział: Zróbcie to trzeci raz. I zrobili to po raz trzeci."
  tags: []
"1Krl18,35":
  text: "I woda spłynęła dokoła ołtarza. I napełniono wodą także rów."
  tags: []
"1Krl18,36":
  text: "A gdy nadszedł czas składania ofiary z pokarmów, prorok Eliasz zbliżył się i powiedział: PANIE, Boże Abrahama, Izaaka i Izraela, niech dziś poznają, że ty jesteś Bogiem w Izraelu, a ja twoim sługą, i że na twoje słowo uczyniłem to wszystko."
  tags: []
"1Krl18,37":
  text: "Wysłuchaj mnie, PANIE, wysłuchaj mnie, aby ten lud poznał, że ty, PANIE, jesteś Bogiem i że ty z powrotem nawróciłeś jego serca."
  tags: []
"1Krl18,38":
  text: "Wtedy spadł ogień PANA i pochłonął ofiarę całopalną i drwa, i kamienie, i proch. A wodę, która była w rowie, wysuszył."
  tags: []
"1Krl18,39":
  text: "Kiedy cały lud to zobaczył, wszyscy upadli na twarz i mówili: PAN jest Bogiem! PAN jest Bogiem!"
  tags: []
"1Krl18,40":
  text: "Wtedy Eliasz powiedział do nich: Schwytajcie proroków Baala, niech żaden z nich nie ujdzie. I schwytano ich. A Eliasz sprowadził ich do potoku Kiszon i tam ich zabił."
  tags: []
"1Krl18,41":
  text: "Potem Eliasz powiedział do Achaba: Idź, jedz i pij. Słychać bowiem szum ulewnego deszczu."
  tags: []
"1Krl18,42":
  text: "Achab poszedł więc jeść i pić. A Eliasz wstąpił na szczyt Karmelu. Następnie padł na ziemię i włożył twarz między kolana;"
  tags: []
"1Krl18,43":
  text: "I powiedział do swego sługi: Idź teraz i popatrz w stronę morza. Ten poszedł, popatrzył i powiedział: Nie ma nic. Wtedy powiedział: Idź i wracaj siedem razy."
  tags: []
"1Krl18,44":
  text: "A za siódmym razem powiedział: Oto mała chmurka, jak dłoń człowieka, podnosi się z morza. Wtedy polecił mu: Idź, powiedz Achabowi: Zaprzęgaj rydwan i zjeżdżaj, aby cię deszcz nie zatrzymał."
  tags: []
"1Krl18,45":
  text: "Tymczasem niebo zaćmiło się od chmur i wiatru i spadł ulewny deszcz. Achab zaś wsiadł do rydwanu i pojechał do Jizreel."
  tags: []
"1Krl18,46":
  text: "A ręka PANA była nad Eliaszem. Przepasał swoje biodra i pobiegł przed Achabem, aż przybył do Jizreel."
  tags: []
