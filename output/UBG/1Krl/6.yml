"1Krl6,1": "W roku czterysta osiemdziesiątym po wyjściu synów Izraela z ziemi Egiptu, w czwartym roku panowania Salomona nad Izraelem, w miesiącu Ziw, to jest drugim miesiącu, Salomon rozpoczął budować dom PANA."
"1Krl6,2": "A ten dom, który król Salomon budował dla PANA, miał sześćdziesiąt łokci długości, dwadzieścia łokci szerokości i trzydzieści łokci wysokości."
"1Krl6,3": "Przedsionek domu przed świątynią miał dwadzieścia łokci długości, stosownie do szerokości domu, i dziesięć łokci szerokości przed domem."
"1Krl6,4": "I zrobił okna w domu, od wewnątrz przestronne, a od zewnątrz wąskie."
"1Krl6,5": "Przy murze domu zbudował skrzydła dokoła, przy murach domu dokoła świątyni i Miejsca Najświętszego. Porobił też dokoła pomieszczenia."
"1Krl6,6": "Dolna część skrzydła miała pięć łokci szerokości, środkowa – sześć łokci, a trzecia – siedem łokci. Uczynił bowiem uskoki dokoła domu na zewnątrz, aby belki nie wchodziły do murów domu."
"1Krl6,7": "Podczas prac nad domem budowano go z wyrobionego kamienia, który przywożono. W czasie budowy nie było więc słychać w domu ani młota, ani siekiery, ani żadnego innego narzędzia z żelaza."
"1Krl6,8": "Drzwi do średniej części były po prawej stronie domu; po krętych schodach wchodziło się do środkowej części, a ze środkowej – do trzeciej."
"1Krl6,9": "Tak więc zbudował dom i ukończył go, i pokrył sklepienie domu belkami i deskami cedrowymi."
"1Krl6,10": "Zbudował też przybudówkę przy całym domu wysoką na pięć łokci – była ona połączona z domem belkami cedrowymi."
"1Krl6,11": "Potem słowo PANA doszło do Salomona:"
"1Krl6,12": "Odnośnie do domu, który budujesz – jeśli będziesz postępował według moich ustaw i wykonywał moje sądy, i zachowywał wszystkie moje przykazania, postępując według nich, wtedy spełnię moje słowo wobec ciebie, które wypowiedziałem do Dawida, twego ojca."
"1Krl6,13": "I zamieszkam wśród synów Izraela, i nie opuszczę swego ludu Izraela."
"1Krl6,14": "Tak Salomon zbudował dom i wykończył go."
"1Krl6,15": "Mury domu obłożył wewnątrz deskami cedrowymi, od podłogi domu aż do sufitu. Wyłożył je drewnem wewnątrz, a podłogę domu pokrył deskami cyprysowymi."
"1Krl6,16": "Zbudował też przegrodę z desek cedrowych długą na dwadzieścia łokci, od jednej strony do drugiej strony domu, od podłogi aż do sufitu. W ten sposób zbudował wewnętrzny przybytek, aby był Miejscem Najświętszym."
"1Krl6,17": "Sam dom, czyli świątynia przed Miejscem Najświętszym, miał czterdzieści łokci długości."
"1Krl6,18": "A na deskach cedrowych wewnątrz domu wyrzeźbiono pąki i rozkwitłe kwiaty. Wszystko było z cedru, tak że kamienia nie było widać."
"1Krl6,19": "A Miejsce Najświętsze wewnątrz domu urządził tak, by tam umieścić arkę przymierza PANA."
"1Krl6,20": "To Miejsce Najświętsze, umieszczone w przedniej części domu, miało dwadzieścia łokci długości, dwadzieścia łokci szerokości i dwadzieścia łokci wysokości. I pokrył je szczerym złotem, ołtarz cedrowy także pokrył złotem."
"1Krl6,21": "I w ten sposób Salomon wyłożył wnętrze domu szczerym złotem, i przed przegrodą, którą również pokrył złotem, rozciągnął złote łańcuchy przed Miejscem Najświętszym."
"1Krl6,22": "Cały dom pokrył złotem; tak go wykończył. Cały ołtarz, który znajdował się przed Miejscem Najświętszym, także pokrył złotem."
"1Krl6,23": "W Miejscu Najświętszym uczynił też dwa cherubiny z drzewa oliwnego wysokie na dziesięć łokci."
"1Krl6,24": "Pięć łokci miało jedno skrzydło cherubina i pięć łokci miało drugie skrzydło cherubina: dziesięć łokci było od końca jednego skrzydła aż do końca drugiego skrzydła."
"1Krl6,25": "Dziesięć łokci miał też drugi cherubin: oba cherubiny miały ten sam rozmiar i kształt."
"1Krl6,26": "Wysokość jednego cherubina wynosiła dziesięć łokci, tak samo wysokość drugiego cherubina."
"1Krl6,27": "I postawił cherubiny w głębi wnętrza domu, i skrzydła cherubinów rozpościerały się tak, że skrzydło jednego dotykało jednej ściany, a skrzydło drugiego cherubina dotykało drugiej ściany; ich skrzydła dotykały się w środku domu."
"1Krl6,28": "I pokrył cherubiny złotem."
"1Krl6,29": "Nadto wszystkie ściany dokoła domu wewnątrz i na zewnątrz ozdobił wyrytymi cherubinami, palmami i rozkwitłymi kwiatami."
"1Krl6,30": "Podłogę domu wyłożył złotem wewnątrz i na zewnątrz."
"1Krl6,31": "U wejścia do Miejsca Najświętszego wykonał drzwi z drzewa oliwnego. Nadproża i węgary zajmowały piątą część muru."
"1Krl6,32": "Podwójne drzwi wykonane były z drzewa oliwnego; wyrzeźbił na nich cherubiny, palmy i rozkwitłe kwiaty i pokrył je złotem. Cherubiny i palmy też wyłożył złotem."
"1Krl6,33": "W ten sam sposób uczynił odrzwia z drzewa oliwnego u wejścia do świątyni – zajmowały one jedną czwartą część muru."
"1Krl6,34": "A podwójne drzwi wykonane były z drewna cyprysowego. Dwie obracające się deski tworzyły jedno skrzydło i dwie obracające się deski – drugie."
"1Krl6,35": "Na nich wyrył cherubiny, palmy i rozkwitłe kwiaty i pokrył złotem dokładnie nałożonym na rzeźby."
"1Krl6,36": "Obudował też dziedziniec trzema warstwami ociosanych kamieni i jedną warstwą belek cedrowych."
"1Krl6,37": "W czwartym roku, w miesiącu Ziw, położono fundamenty domu PANA;"
"1Krl6,38": "A w jedenastym roku, w miesiącu Bul, to jest ósmym miesiącu, dom został wykończony we wszystkich szczegółach i ze wszystkimi jego wymogami. A budował go przez siedem lat."
