"1Krl6,1":
  text: "W roku czterysta osiemdziesiątym po wyjściu synów Izraela z ziemi Egiptu, w czwartym roku panowania Salomona nad Izraelem, w miesiącu Ziw, to jest drugim miesiącu, Salomon rozpoczął budować dom PANA."
  tags: []
"1Krl6,2":
  text: "A ten dom, który król Salomon budował dla PANA, miał sześćdziesiąt łokci długości, dwadzieścia łokci szerokości i trzydzieści łokci wysokości."
  tags: []
"1Krl6,3":
  text: "Przedsionek domu przed świątynią miał dwadzieścia łokci długości, stosownie do szerokości domu, i dziesięć łokci szerokości przed domem."
  tags: []
"1Krl6,4":
  text: "I zrobił okna w domu, od wewnątrz przestronne, a od zewnątrz wąskie."
  tags: []
"1Krl6,5":
  text: "Przy murze domu zbudował skrzydła dokoła, przy murach domu dokoła świątyni i Miejsca Najświętszego. Porobił też dokoła pomieszczenia."
  tags: []
"1Krl6,6":
  text: "Dolna część skrzydła miała pięć łokci szerokości, środkowa – sześć łokci, a trzecia – siedem łokci. Uczynił bowiem uskoki dokoła domu na zewnątrz, aby belki nie wchodziły do murów domu."
  tags: []
"1Krl6,7":
  text: "Podczas prac nad domem budowano go z wyrobionego kamienia, który przywożono. W czasie budowy nie było więc słychać w domu ani młota, ani siekiery, ani żadnego innego narzędzia z żelaza."
  tags: []
"1Krl6,8":
  text: "Drzwi do średniej części były po prawej stronie domu; po krętych schodach wchodziło się do środkowej części, a ze środkowej – do trzeciej."
  tags: []
"1Krl6,9":
  text: "Tak więc zbudował dom i ukończył go, i pokrył sklepienie domu belkami i deskami cedrowymi."
  tags: []
"1Krl6,10":
  text: "Zbudował też przybudówkę przy całym domu wysoką na pięć łokci – była ona połączona z domem belkami cedrowymi."
  tags: []
"1Krl6,11":
  text: "Potem słowo PANA doszło do Salomona:"
  tags: []
"1Krl6,12":
  text: "Odnośnie do domu, który budujesz – jeśli będziesz postępował według moich ustaw i wykonywał moje sądy, i zachowywał wszystkie moje przykazania, postępując według nich, wtedy spełnię moje słowo wobec ciebie, które wypowiedziałem do Dawida, twego ojca."
  tags: []
"1Krl6,13":
  text: "I zamieszkam wśród synów Izraela, i nie opuszczę swego ludu Izraela."
  tags: []
"1Krl6,14":
  text: "Tak Salomon zbudował dom i wykończył go."
  tags: []
"1Krl6,15":
  text: "Mury domu obłożył wewnątrz deskami cedrowymi, od podłogi domu aż do sufitu. Wyłożył je drewnem wewnątrz, a podłogę domu pokrył deskami cyprysowymi."
  tags: []
"1Krl6,16":
  text: "Zbudował też przegrodę z desek cedrowych długą na dwadzieścia łokci, od jednej strony do drugiej strony domu, od podłogi aż do sufitu. W ten sposób zbudował wewnętrzny przybytek, aby był Miejscem Najświętszym."
  tags: []
"1Krl6,17":
  text: "Sam dom, czyli świątynia przed Miejscem Najświętszym, miał czterdzieści łokci długości."
  tags: []
"1Krl6,18":
  text: "A na deskach cedrowych wewnątrz domu wyrzeźbiono pąki i rozkwitłe kwiaty. Wszystko było z cedru, tak że kamienia nie było widać."
  tags: []
"1Krl6,19":
  text: "A Miejsce Najświętsze wewnątrz domu urządził tak, by tam umieścić arkę przymierza PANA."
  tags: []
"1Krl6,20":
  text: "To Miejsce Najświętsze, umieszczone w przedniej części domu, miało dwadzieścia łokci długości, dwadzieścia łokci szerokości i dwadzieścia łokci wysokości. I pokrył je szczerym złotem, ołtarz cedrowy także pokrył złotem."
  tags: []
"1Krl6,21":
  text: "I w ten sposób Salomon wyłożył wnętrze domu szczerym złotem, i przed przegrodą, którą również pokrył złotem, rozciągnął złote łańcuchy przed Miejscem Najświętszym."
  tags: []
"1Krl6,22":
  text: "Cały dom pokrył złotem; tak go wykończył. Cały ołtarz, który znajdował się przed Miejscem Najświętszym, także pokrył złotem."
  tags: []
"1Krl6,23":
  text: "W Miejscu Najświętszym uczynił też dwa cherubiny z drzewa oliwnego wysokie na dziesięć łokci."
  tags: []
"1Krl6,24":
  text: "Pięć łokci miało jedno skrzydło cherubina i pięć łokci miało drugie skrzydło cherubina: dziesięć łokci było od końca jednego skrzydła aż do końca drugiego skrzydła."
  tags: []
"1Krl6,25":
  text: "Dziesięć łokci miał też drugi cherubin: oba cherubiny miały ten sam rozmiar i kształt."
  tags: []
"1Krl6,26":
  text: "Wysokość jednego cherubina wynosiła dziesięć łokci, tak samo wysokość drugiego cherubina."
  tags: []
"1Krl6,27":
  text: "I postawił cherubiny w głębi wnętrza domu, i skrzydła cherubinów rozpościerały się tak, że skrzydło jednego dotykało jednej ściany, a skrzydło drugiego cherubina dotykało drugiej ściany; ich skrzydła dotykały się w środku domu."
  tags: []
"1Krl6,28":
  text: "I pokrył cherubiny złotem."
  tags: []
"1Krl6,29":
  text: "Nadto wszystkie ściany dokoła domu wewnątrz i na zewnątrz ozdobił wyrytymi cherubinami, palmami i rozkwitłymi kwiatami."
  tags: []
"1Krl6,30":
  text: "Podłogę domu wyłożył złotem wewnątrz i na zewnątrz."
  tags: []
"1Krl6,31":
  text: "U wejścia do Miejsca Najświętszego wykonał drzwi z drzewa oliwnego. Nadproża i węgary zajmowały piątą część muru."
  tags: []
"1Krl6,32":
  text: "Podwójne drzwi wykonane były z drzewa oliwnego; wyrzeźbił na nich cherubiny, palmy i rozkwitłe kwiaty i pokrył je złotem. Cherubiny i palmy też wyłożył złotem."
  tags: []
"1Krl6,33":
  text: "W ten sam sposób uczynił odrzwia z drzewa oliwnego u wejścia do świątyni – zajmowały one jedną czwartą część muru."
  tags: []
"1Krl6,34":
  text: "A podwójne drzwi wykonane były z drewna cyprysowego. Dwie obracające się deski tworzyły jedno skrzydło i dwie obracające się deski – drugie."
  tags: []
"1Krl6,35":
  text: "Na nich wyrył cherubiny, palmy i rozkwitłe kwiaty i pokrył złotem dokładnie nałożonym na rzeźby."
  tags: []
"1Krl6,36":
  text: "Obudował też dziedziniec trzema warstwami ociosanych kamieni i jedną warstwą belek cedrowych."
  tags: []
"1Krl6,37":
  text: "W czwartym roku, w miesiącu Ziw, położono fundamenty domu PANA;"
  tags: []
"1Krl6,38":
  text: "A w jedenastym roku, w miesiącu Bul, to jest ósmym miesiącu, dom został wykończony we wszystkich szczegółach i ze wszystkimi jego wymogami. A budował go przez siedem lat."
  tags: []
