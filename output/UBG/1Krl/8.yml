"1Krl8,1":
  text: "Potem Salomon zebrał starszych Izraela i wszystkich naczelników pokoleń, przywódców rodów synów Izraela, u siebie w Jerozolimie, aby przenieść arkę przymierza PANA z miasta Dawida, którym jest Syjon."
  tags: []
"1Krl8,2":
  text: "Zebrali się więc u króla Salomona wszyscy mężczyźni Izraela na święto w miesiącu Etanim, to jest w siódmym miesiącu."
  tags: []
"1Krl8,3":
  text: "A gdy przybyli wszyscy starsi Izraela, kapłani wzięli arkę."
  tags: []
"1Krl8,4":
  text: "I przenieśli arkę PANA, Namiot Zgromadzenia i wszystkie święte naczynia, które były w Namiocie. Przenieśli je kapłani i Lewici."
  tags: []
"1Krl8,5":
  text: "Król Salomon i całe zgromadzenie Izraela zebrane u niego przed arką złożyli wraz z nim w ofierze owce i woły, których nie można było zliczyć ani spisać z powodu wielkiej liczby."
  tags: []
"1Krl8,6":
  text: "Następnie kapłani wnieśli arkę przymierza PANA na jej miejsce do wnętrza domu, do Miejsca Najświętszego, pod skrzydła cherubinów."
  tags: []
"1Krl8,7":
  text: "Cherubiny bowiem miały rozpostarte skrzydła nad miejscem arki i okrywały od góry arkę i jej drążki."
  tags: []
"1Krl8,8":
  text: "I powyciągali drążki, tak że ich końce było widać z Miejsca Świętego przed Miejscem Najświętszym, ale nie były widoczne na zewnątrz. I są tam aż do dziś."
  tags: []
"1Krl8,9":
  text: "W arce nie było nic oprócz dwóch kamiennych tablic, które Mojżesz włożył do niej na Horebie, gdy PAN zawarł przymierze z synami Izraela po ich wyjściu z Egiptu."
  tags: []
"1Krl8,10":
  text: "A gdy kapłani wyszli z Miejsca Świętego, obłok napełnił dom PANA;"
  tags: []
"1Krl8,11":
  text: "Tak że kapłani nie mogli pozostać i pełnić służby z powodu tego obłoku, bo chwała PANA napełniła dom PANA."
  tags: []
"1Krl8,12":
  text: "Wtedy przemówił Salomon: PAN powiedział, że będzie mieszkać w mroku."
  tags: []
"1Krl8,13":
  text: "Już zbudowałem ci dom na mieszkanie – miejsce, w którym będziesz przebywać na wieki."
  tags: []
"1Krl8,14":
  text: "Potem król obrócił swą twarz i błogosławił całemu zgromadzeniu Izraela, a całe zgromadzenie Izraela stało."
  tags: []
"1Krl8,15":
  text: "I przemówił: Błogosławiony niech będzie PAN, Bóg Izraela, który swymi ustami mówił do mego ojca Dawida i swą ręką wypełnił to, co obiecał:"
  tags: []
"1Krl8,16":
  text: "Od dnia, w którym wyprowadziłem swój lud Izraela z Egiptu, nie wybrałem żadnego miasta spośród wszystkich pokoleń Izraela do zbudowania domu, by moje imię tam przebywało. Lecz wybrałem Dawida, aby był postawiony nad moim ludem Izraelem."
  tags: []
"1Krl8,17":
  text: "Dawid, mój ojciec, postanowił w swoim sercu, że zbuduje dom dla imienia PANA, Boga Izraela."
  tags: []
"1Krl8,18":
  text: "Lecz PAN powiedział do mego ojca Dawida: Ponieważ postanowiłeś w swoim sercu, by zbudować dom dla mojego imienia, dobrze uczyniłeś, że tak postanowiłeś w sercu."
  tags: []
"1Krl8,19":
  text: "Nie ty jednak będziesz budował ten dom, ale twój syn, który wyjdzie z twoich bioder, on zbuduje dom dla mego imienia."
  tags: []
"1Krl8,20":
  text: "PAN wypełnił swoje słowo, które powiedział. A ja powstałem w miejsce Dawida, swego ojca, i usiadłem na tronie Izraela, jak PAN zapowiedział, i zbudowałem dom dla imienia PANA, Boga Izraela."
  tags: []
"1Krl8,21":
  text: "I przeznaczyłem tam miejsce dla arki, w której znajduje się przymierze PANA, które zawarł z naszymi ojcami, gdy wyprowadził ich z ziemi Egiptu."
  tags: []
"1Krl8,22":
  text: "Następnie Salomon stanął przed ołtarzem PANA wobec całego zgromadzenia Izraela i wyciągnął swoje ręce ku niebu;"
  tags: []
"1Krl8,23":
  text: "I powiedział: PANIE, Boże Izraela, nie ma Boga w górze na niebie ani w dole na ziemi podobnego tobie, który przestrzegałby przymierza i miłosierdzia wobec swoich sług, którzy postępują przed tobą całym swoim sercem."
  tags: []
"1Krl8,24":
  text: "Dotrzymałeś swojemu słudze Dawidowi, memu ojcu, tego, co mu obiecałeś. Swoimi ustami to powiedziałeś i swoją ręką to wypełniłeś, jak to jest dziś."
  tags: []
"1Krl8,25":
  text: "Teraz więc, PANIE, Boże Izraela, dotrzymaj swemu słudze Dawidowi, memu ojcu, obietnicy, którą mu dałeś, kiedy mówiłeś: Nie zabraknie ci przede mną potomka, który zasiadałby na tronie Izraela, jeśli tylko twoi synowie będą strzec swej drogi, postępując przede mną tak, jak ty postępowałeś przede mną."
  tags: []
"1Krl8,26":
  text: "A teraz, Boże Izraela, proszę, niech będzie potwierdzone twoje słowo, które wypowiedziałeś do swego sługi Dawida, mego ojca."
  tags: []
"1Krl8,27":
  text: "Czyż naprawdę jednak Bóg zamieszka na ziemi? Oto niebiosa i niebiosa niebios nie mogą cię ogarnąć, a cóż dopiero ten dom, który zbudowałem?"
  tags: []
"1Krl8,28":
  text: "Zważ na modlitwę swego sługi i na jego prośbę, PANIE, mój Boże, wysłuchaj wołania i modlitwy, które twój sługa zanosi dziś do ciebie;"
  tags: []
"1Krl8,29":
  text: "Aby twoje oczy były otwarte nad tym domem w nocy i we dnie, nad tym miejscem, o którym powiedziałeś: Tam będzie moje imię; abyś wysłuchał modlitwy, którą w tym miejscu zanosi twój sługa."
  tags: []
"1Krl8,30":
  text: "Wysłuchaj prośby swego sługi i swego ludu Izraela, gdy będą się modlić w tym miejscu. Wysłuchaj z miejsca swojego zamieszkania – z nieba, a gdy wysłuchasz, przebacz."
  tags: []
"1Krl8,31":
  text: "Jeśli ktoś zgrzeszy przeciw swemu bliźniemu, a ten zobowiąże go do przysięgi, a ta przysięga przyjdzie przed twój ołtarz w tym domu;"
  tags: []
"1Krl8,32":
  text: "Ty wysłuchaj w niebie, racz działać i osądź swoje sługi, potępiaj niegodziwego, sprowadzając mu na głowę jego czyny, a usprawiedliwiaj sprawiedliwego, oddając mu według jego sprawiedliwości."
  tags: []
"1Krl8,33":
  text: "Gdy twój lud Izraela zostanie pobity przez wroga za to, że zgrzeszył przeciw tobie, a nawróci się do ciebie, wyzna twoje imię i będzie się modlić, i błagać cię w tym domu;"
  tags: []
"1Krl8,34":
  text: "Ty wysłuchaj w niebie i przebacz grzech swemu ludowi Izraela, i przyprowadź ich znów do ziemi, którą dałeś ich ojcom."
  tags: []
"1Krl8,35":
  text: "Kiedy niebo będzie zamknięte i nie będzie deszczu z powodu tego, że zgrzeszyli przeciwko tobie, ale będą się modlić w tym miejscu i wyznawać twoje imię, i odwrócą się od swoich grzechów, bo ich upokorzyłeś;"
  tags: []
"1Krl8,36":
  text: "Ty wysłuchaj z nieba i przebacz grzech swoich sług i swego ludu Izraela, naucz ich dobrej drogi, po której mają kroczyć, i spuść deszcz na swoją ziemię, którą dałeś swojemu ludowi w dziedzictwo."
  tags: []
"1Krl8,37":
  text: "Jeśli będzie w ziemi głód, jeśli będzie zaraza, susza, rdza, szarańcza lub robactwo, jeśli jego wróg będzie go uciskał w ziemi jego zamieszkania, jeśli będzie jakakolwiek plaga lub choroba;"
  tags: []
"1Krl8,38":
  text: "Wszelką modlitwę i wszelkie błaganie, jakie zaniesie jakikolwiek człowiek lub cały twój lud Izraela, kto tylko uzna plagę swego serca i wyciągnie swoje ręce ku temu domowi;"
  tags: []
"1Krl8,39":
  text: "Wtedy ty wysłuchaj w niebie, w miejscu swego zamieszkania, i przebacz, racz działać i oddaj każdemu według wszystkich jego dróg, bo ty znasz jego serce – gdyż jedynie ty znasz serca wszystkich synów ludzkich;"
  tags: []
"1Krl8,40":
  text: "Aby się ciebie bali po wszystkie dni, które będą żyć na ziemi, którą dałeś naszym ojcom."
  tags: []
"1Krl8,41":
  text: "Również i cudzoziemca, który nie jest z twego ludu Izraela, a jednak przybędzie z dalekiej ziemi przez wzgląd na twoje imię;"
  tags: []
"1Krl8,42":
  text: "(Usłyszą bowiem o twoim wielkim imieniu, twojej mocnej ręce i twoim wyciągniętym ramieniu), gdy przyjdzie i będzie się modlić ku temu domowi;"
  tags: []
"1Krl8,43":
  text: "Ty wysłuchaj w niebie, w miejscu swego zamieszkania, i uczyń wszystko, o co ten cudzoziemiec będzie do ciebie wołać, aby wszystkie narody ziemi poznały twoje imię i bały się ciebie tak, jak twój lud Izraela, i aby wiedziały, że twoje imię jest wzywane nad tym domem, który zbudowałem."
  tags: []
"1Krl8,44":
  text: "Jeśli twój lud wyruszy na wojnę przeciwko swemu wrogowi drogą, którą go poślesz, i będzie się modlić do PANA, zwracając się ku miastu, które wybrałeś, i ku domowi, który zbudowałem dla twego imienia;"
  tags: []
"1Krl8,45":
  text: "To wysłuchaj w niebie ich modlitwy i błagania i broń ich sprawy."
  tags: []
"1Krl8,46":
  text: "Jeśli zgrzeszą przeciw tobie – bo nie ma człowieka, który by nie zgrzeszył – i rozgniewasz się na nich, i podasz ich wrogowi, który uprowadzi ich w niewolę, do ziemi nieprzyjaciół, dalekiej czy bliskiej;"
  tags: []
"1Krl8,47":
  text: "Lecz jeśli wezmą to do serca w tej ziemi, do której zostali uprowadzeni w niewolę, i odwrócą się, i będą cię błagać w ziemi tych, którzy ich pojmali, mówiąc: Zgrzeszyliśmy i postąpiliśmy przewrotnie, popełniliśmy niegodziwość;"
  tags: []
"1Krl8,48":
  text: "I zawrócą do ciebie całym swym sercem i całą swą duszą, w ziemi swoich wrogów, którzy ich pojmali, i będą się modlić do ciebie zwróceni ku swojej ziemi, którą dałeś ich ojcom, ku miastu, które wybrałeś, i ku domowi, który zbudowałem dla twego imienia;"
  tags: []
"1Krl8,49":
  text: "Wtedy wysłuchaj w niebie, w miejscu swego zamieszkania, ich modlitwy i ich prośby i broń ich sprawy;"
  tags: []
"1Krl8,50":
  text: "Przebacz swemu ludowi, który zgrzeszył przeciw tobie, i wszystkie ich występki, które popełnili przeciw tobie, a skłoń do miłosierdzia tych, którzy ich pojmali, aby zmiłowali się nad nimi."
  tags: []
"1Krl8,51":
  text: "Są bowiem twoim ludem i twoim dziedzictwem, które wyprowadziłeś z Egiptu, z wnętrza pieca do wytopu żelaza."
  tags: []
"1Krl8,52":
  text: "Niech twoje oczy będą otwarte na prośbę twego sługi i na prośbę twego ludu Izraela, abyś ich wysłuchał we wszystkim, o co będą wołać do ciebie."
  tags: []
"1Krl8,53":
  text: "Ty bowiem oddzieliłeś ich sobie od wszystkich narodów ziemi na dziedzictwo, jak to powiedziałeś przez swego sługę Mojżesza, gdy wyprowadziłeś naszych ojców z Egiptu, o Panie BOŻE!"
  tags: []
"1Krl8,54":
  text: "Gdy Salomon skończył zanosić do PANA wszystkie te modlitwy i prośby, powstał sprzed ołtarza PANA, gdzie klęczał, i ręce wyciągał ku niebu;"
  tags: []
"1Krl8,55":
  text: "Stanął i błogosławił całe zgromadzenie Izraela, mówiąc donośnym głosem:"
  tags: []
"1Krl8,56":
  text: "Błogosławiony niech będzie PAN, który dał odpoczynek swemu ludowi Izraelowi, zgodnie z tym wszystkim, co powiedział. Nie uchybił jednemu słowu ze wszystkich swoich dobrych obietnic, które wypowiedział przez swego sługę Mojżesza."
  tags: []
"1Krl8,57":
  text: "Niech PAN, nasz Bóg, będzie z nami, jak był z naszymi ojcami. Niech nas nie opuści ani nas nie porzuci;"
  tags: []
"1Krl8,58":
  text: "Niech skłoni ku sobie nasze serca, abyśmy kroczyli wszystkimi jego drogami i strzegli jego przykazań, nakazów i praw, które rozkazał naszym ojcom."
  tags: []
"1Krl8,59":
  text: "A niech te moje słowa, którymi wyraziłem swoje błaganie przed PANEM, będą bliskie PANU, naszemu Bogu we dnie i w nocy, aby bronił sprawy swego sługi i sprawy swego ludu Izraela, według potrzeby każdego dnia;"
  tags: []
"1Krl8,60":
  text: "Żeby wszystkie narody ziemi poznały, że PAN jest Bogiem, a innego nie ma."
  tags: []
"1Krl8,61":
  text: "Niech więc wasze serce będzie doskonałe wobec PANA, naszego Boga, abyście postępowali według jego nakazów i przestrzegali jego przykazań tak jak dzisiaj."
  tags: []
"1Krl8,62":
  text: "Potem król, a z nim cały Izrael, złożyli ofiary przed PANEM."
  tags: []
"1Krl8,63":
  text: "Salomon złożył jako ofiarę pojednawczą, którą ofiarował PANU, dwadzieścia dwa tysiące wołów i sto dwadzieścia tysięcy owiec. Tak król i wszyscy synowie Izraela poświęcili dom PANU."
  tags: []
"1Krl8,64":
  text: "W tym samym dniu król poświęcił środkową część dziedzińca, która była przed domem PANA. Tam bowiem złożył całopalenia, ofiary z pokarmów i tłuszcz ofiar pojednawczych, ponieważ ołtarz z brązu, który znajdował się przed PANEM, był zbyt mały, aby pomieścić całopalenia, ofiary z pokarmów i tłuszcz ofiar pojednawczych."
  tags: []
"1Krl8,65":
  text: "W tym czasie Salomon, a wraz z nim cały Izrael, wielkie zgromadzenie od wejścia do Chamat aż do rzeki Egiptu, obchodzili święto przed PANEM, naszym Bogiem, przez siedem dni i przez siedem dni, razem czternaście dni."
  tags: []
"1Krl8,66":
  text: "A w ósmym dniu odprawił lud. Błogosławili króla i rozeszli się do swoich namiotów radośni i ciesząc się w swoich sercach z powodu całego dobra, które PAN wyświadczył Dawidowi, swemu słudze, oraz Izraelowi, swemu ludowi."
  tags: []
