"1Krl2,1": "A gdy zbliżał się czas śmierci Dawida, rozkazał Salomonowi, swemu synowi:"
"1Krl2,2": "Idę drogą całej ziemi. Ty umacniaj się i okaż się mężczyzną;"
"1Krl2,3": "Zachowuj nakaz PANA, swego Boga, abyś chodził jego drogami i przestrzegał jego ustaw, jego przykazań, jego praw i jego świadectw, jak jest napisane w Prawie Mojżesza, aby ci się wiodło we wszystkim, co będziesz czynił, i wszędzie, dokądkolwiek się zwrócisz;"
"1Krl2,4": "Aby PAN spełnił swoje słowo, które zapowiedział o mnie: Jeśli twoi synowie będą strzec swej drogi, postępując przede mną w prawdzie, z całego swego serca i z całej swej duszy, to wtedy nie zabraknie ci mężczyzny na tronie Izraela."
"1Krl2,5": "Ty wiesz także, co uczynił mi Joab, syn Serui, co uczynił dwom dowódcom wojska Izraela, Abnerowi, synowi Nera, i Amasie, synowi Jetery, których zabił i przelał krew w czasie pokoju jak na wojnie, i zbroczył tą krwią wojny swój pas na biodrach i swoje obuwie na nogach."
"1Krl2,6": "Uczynisz więc według swojej mądrości, jednak nie dopuść, aby w sędziwym wieku zstąpił w pokoju do grobu."
"1Krl2,7": "Lecz synom Barzillaja Gileadczyka okaż łaskę i niech należą do tych, którzy jadają przy twoim stole. Oni bowiem przyszli do mnie, kiedy uciekałem przed twoim bratem Absalomem."
"1Krl2,8": "Oto jest też u ciebie Szimei, syn Gery, Beniaminita z Bachurim, który złorzeczył mi ostro w tym dniu, kiedy szedłem do Machanaim. Lecz wyszedł mi na spotkanie nad Jordanem i przysiągłem mu na PANA: Nie zabiję cię mieczem."
"1Krl2,9": "Teraz jednak nie daruj mu tego. Jesteś bowiem człowiekiem mądrym i będziesz wiedział, co masz mu uczynić, by posłać go w sędziwym wieku zbroczonego krwią do grobu."
"1Krl2,10": "Potem Dawid zasnął ze swymi ojcami i został pogrzebany w mieście Dawida."
"1Krl2,11": "A czas panowania Dawida nad Izraelem wynosił czterdzieści lat. W Hebronie królował siedem lat, a w Jerozolimie królował trzydzieści trzy lata."
"1Krl2,12": "Zasiadł więc Salomon na tronie Dawida, swego ojca, i jego królestwo zostało mocno utwierdzone."
"1Krl2,13": "Potem przyszedł Adoniasz, syn Chaggity, do Batszeby, matki Salomona. Ta go zapytała: Czy twoje przyjście oznacza pokój? A on odpowiedział: Pokój."
"1Krl2,14": "Następnie dodał: Mam do ciebie sprawę. Odpowiedziała: Mów."
"1Krl2,15": "Wtedy powiedział: Ty wiesz, że do mnie należało królestwo i że cały Izrael patrzył na mnie i chciał, abym królował. Królestwo jednak uległo zmianie i dostało się memu bratu, bo przypadło mu ono od PANA."
"1Krl2,16": "Teraz mam więc do ciebie jedną prośbę, nie odmawiaj mi tego. Odpowiedziała: Mów."
"1Krl2,17": "Wtedy powiedział: Powiedz, proszę, do Salomona, króla – bo wiem, że tobie nie odmówi – aby dał mi Abiszag Szunamitkę za żonę."
"1Krl2,18": "Batszeba odpowiedziała: Dobrze, przemówię za tobą do króla."
"1Krl2,19": "Poszła więc Batszeba do króla Salomona, aby przemówić do niego za Adoniaszem. I król wstał na jej spotkanie, pokłonił się jej i usiadł na swym tronie. Kazał też postawić krzesło swojej matce, a ona usiadła po jego prawicy."
"1Krl2,20": "I powiedziała: Mam do ciebie jedną małą prośbę, nie odmawiaj mi. Król odpowiedział jej: Proś, moja matko, bo ci nie odmówię."
"1Krl2,21": "Wtedy powiedziała: Niech Abiszag Szunamitka będzie dana za żonę twemu bratu, Adoniaszowi."
"1Krl2,22": "Król Salomon odpowiedział swojej matce: A dlaczego prosisz o Abiszag Szunamitkę dla Adoniasza? Poproś także dla niego o królestwo. Jest bowiem moim starszym bratem i ma za sobą kapłana Abiatara i Joaba, syna Serui."
"1Krl2,23": "I król Salomon przysiągł na PANA: Niech Bóg mi to uczyni i tamto dorzuci, jeśli Adoniasz nie wypowiedział tych słów przeciwko własnemu życiu."
"1Krl2,24": "A teraz, jak żyje PAN, który mnie ustanowił i posadził na tronie Dawida, mego ojca, i który zbudował mi dom, jak obiecał, Adoniasz dziś zostanie zabity."
"1Krl2,25": "Wtedy król Salomon posłał Benajasza, syna Jehojady, i ten zadał mu cios, tak że umarł."
"1Krl2,26": "A do kapłana Abiatara król powiedział: Idź do Anatot, do swojej posiadłości, gdyż zasłużyłeś na śmierć. Dziś jednak nie zabiję cię, ponieważ nosiłeś arkę PANA przed Dawidem, moim ojcem, i ponieważ wycierpiałeś wszystko, co mój ojciec wycierpiał."
"1Krl2,27": "I Salomon usunął Abiatara, by nie był kapłanem PANA, aby spełniło się słowo PANA, które wypowiedział o domu Helego w Szilo."
"1Krl2,28": "Gdy wieść o tym doszła do Joaba – Joab bowiem dołączył do Adoniasza, chociaż do Absaloma nie dołączył – Joab uciekł do namiotu PANA i uchwycił się rogów ołtarza."
"1Krl2,29": "I doniesiono królowi Salomonowi o tym, że Joab uciekł do namiotu PANA i jest przy ołtarzu. Wtedy Salomon posłał Benajasza, syna Jehojady, mówiąc: Idź, zabij go."
"1Krl2,30": "Benajasz przyszedł więc do namiotu PANA i powiedział do niego: Tak mówi król: Wyjdź. Ten odpowiedział: Nie wyjdę, ale tu umrę. Benajasz przekazał odpowiedź królowi: Tak mówił Joab i tak mi odpowiedział."
"1Krl2,31": "I król mu polecił: Uczyń, jak powiedział. Zabij go i pogrzeb go, a oczyścisz mnie i dom mego ojca z niewinnej krwi, którą przelał Joab."
"1Krl2,32": "A PAN sprowadzi jego krew na jego własną głowę, ponieważ zadał cios dwom mężczyznom sprawiedliwszym i lepszym niż on sam i zabił ich mieczem bez wiedzy mego ojca Dawida – Abnera, syna Nera, dowódcę wojska Izraela, i Amasę, syna Jetery, dowódcę wojska Judy."
"1Krl2,33": "Ich krew spadnie na głowę Joaba i na głowę jego potomstwa na wieki. Dla Dawida zaś i jego potomstwa, jego domu i jego tronu niech będzie pokój od PANA na wieki."
"1Krl2,34": "Benajasz, syn Jehojady, poszedł więc, rzucił się na niego i zabił go. I został pogrzebany w swoim domu na pustyni."
"1Krl2,35": "Król na jego miejsce postawił na czele wojska Benajasza, syna Jehojady, a kapłana Sadoka król postawił na miejsce Abiatara."
"1Krl2,36": "Potem król posłał po Szimejego i przyzwał go, i powiedział mu: Zbuduj sobie dom w Jerozolimie i zamieszkaj tam, i nigdy stamtąd nie wychodź."
"1Krl2,37": "Tego dnia bowiem, w którym wyjdziesz i przekroczysz potok Cedron, wiedz dobrze, że na pewno umrzesz. Twoja krew spadnie na twoją głowę."
"1Krl2,38": "Wtedy Szimei powiedział do króla: Dobre jest to słowo. Jak mój pan, król, powiedział, tak twój sługa uczyni. I mieszkał Szimei w Jerozolimie przez wiele dni."
"1Krl2,39": "I zdarzyło się po trzech latach, że dwaj słudzy Szimejego uciekli do Akisza, syna Maaki, króla Gat. I dano znać Szimejemu: Oto twoi słudzy są w Gat."
"1Krl2,40": "Szimei wstał więc, osiodłał swego osła i wyruszył do Gat, do Akisza, aby szukać swoich sług. Potem Szimei wrócił i przyprowadził swe sługi z Gat."
"1Krl2,41": "I doniesiono Salomonowi, że Szimei poszedł z Jerozolimy do Gat i powrócił."
"1Krl2,42": "Wtedy król posłał po Szimejego i wezwał go, i powiedział mu: Czy nie przysiągłem na PANA i nie oświadczyłem ci, mówiąc: Tego dnia, w którym wyjdziesz, wiedz dobrze, że na pewno umrzesz? I odpowiedziałeś mi: Dobre to słowo, które słyszałem."
"1Krl2,43": "Dlaczego więc nie przestrzegałeś przysięgi PANA i nakazu, który ci dałem?"
"1Krl2,44": "Następnie król powiedział do Szimejego: Znasz całe zło, którego jest świadome twoje serce, a które wyrządziłeś memu ojcu Dawidowi. PAN sprowadzi więc twoje zło na twoją głowę."
"1Krl2,45": "A król Salomon będzie błogosławiony i tron Dawida zostanie utwierdzony przed PANEM na wieki."
"1Krl2,46": "Tak więc król wydał rozkaz Benajaszowi, synowi Jehojady; i ten wyszedł, zadał mu cios i zabił go. I tak królestwo zostało utwierdzone w ręce Salomona."
