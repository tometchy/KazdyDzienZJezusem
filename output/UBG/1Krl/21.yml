"1Krl21,1":
  text: "Po tych wydarzeniach miała miejsce taka sprawa: Nabot Jizreelita miał winnicę, która znajdowała się w Jizreel obok pałacu Achaba, króla Samarii."
  tags: []
"1Krl21,2":
  text: "I Achab powiedział do Nabota: Daj mi swoją winnicę, abym zrobił sobie z niej ogród warzywny, gdyż leży ona blisko mojego domu. Dam ci za nią lepszą winnicę albo – jeśli wolisz – dam ci pieniędze według wartości."
  tags: []
"1Krl21,3":
  text: "Nabot odpowiedział Achabowi: Nie daj, PANIE, abym ci dał dziedzictwo swoich ojców."
  tags: []
"1Krl21,4":
  text: "Achab przyszedł więc do swego domu smutny i zagniewany z powodu słów, które Nabot Jizreelita wypowiedział do niego: Nie dam ci dziedzictwa swoich ojców. I położył się na swoim łożu, odwrócił swoją twarz i nie jadł chleba."
  tags: []
"1Krl21,5":
  text: "Wtedy przyszła do niego Jezabel, jego żona, i zapytała go: Czemu twój duch jest tak smutny, że nie chcesz jeść chleba?"
  tags: []
"1Krl21,6":
  text: "Odpowiedział jej: Bo rozmawiałem z Nabotem Jizreelitą i powiedziałem mu: Daj mi swoją winnicę za pieniądze albo – jeśli chcesz – dam ci za nią inną winnicę. Lecz on odpowiedział: Nie dam ci swojej winnicy."
  tags: []
"1Krl21,7":
  text: "Jego żona Jezabel powiedziała do niego: Czyż nie ty teraz sprawujesz władzę nad królestwem Izraela? Wstań, jedz chleb i bądź dobrej myśli. Ja dam ci winnicę Nabota Jizreelity."
  tags: []
"1Krl21,8":
  text: "Napisała więc listy w imieniu Achaba, opieczętowała je jego pieczęcią i wysłała te listy do starszych i do dostojników, którzy byli w jego mieście i mieszkali z Nabotem."
  tags: []
"1Krl21,9":
  text: "W listach tak napisała: Ogłoście post i posadźcie Nabota przed ludem."
  tags: []
"1Krl21,10":
  text: "I postawcie przed nim dwóch synów Beliala, aby zaświadczyli przeciwko niemu, mówiąc: Złorzeczyłeś Bogu i królowi. Potem wyprowadźcie go i ukamienujcie, aby umarł."
  tags: []
"1Krl21,11":
  text: "I mężczyźni tego miasta, mianowicie starsi i dostojnicy mieszkający w jego mieście, uczynili tak, jak im poleciła Jezabel, zgodnie z tym, co było napisane w listach, które do nich wysłała."
  tags: []
"1Krl21,12":
  text: "Ogłosili post i posadzili Nabota przed ludem."
  tags: []
"1Krl21,13":
  text: "Potem przyszło dwóch synów Beliala i usiadło przed nim. Ci niegodziwi ludzie zaświadczyli przeciwko niemu, czyli przeciw Nabotowi, przed ludem, mówiąc: Nabot złorzeczył Bogu i królowi. I wyprowadzili go za miasto, i ukamienowali go, i umarł."
  tags: []
"1Krl21,14":
  text: "I posłali do Jezabel wiadomość: Nabot został ukamienowany i umarł."
  tags: []
"1Krl21,15":
  text: "A gdy Jezabel usłyszała, że Nabot został ukamienowany i umarł, powiedziała do Achaba: Wstań, weź w posiadanie winnicę Nabota Jizreelity, której nie chciał dać ci za pieniądze. Nabot bowiem nie żyje, ale umarł."
  tags: []
"1Krl21,16":
  text: "Kiedy Achab usłyszał, że Nabot umarł, wstał i poszedł do winnicy Nabota Jizreelity, aby ją wziąć w posiadanie."
  tags: []
"1Krl21,17":
  text: "Wtedy słowo PANA doszło do Eliasza Tiszbity:"
  tags: []
"1Krl21,18":
  text: "Wstań, zejdź naprzeciw Achaba, króla Izraela, który przebywa w Samarii. Oto jest w winnicy Nabota, do której zszedł, aby ją wziąć w posiadanie."
  tags: []
"1Krl21,19":
  text: "I powiesz takie słowa: Tak mówi PAN: Czy zabiłeś i wziąłeś w posiadanie? Powiesz mu jeszcze: Tak mówi PAN: Na miejscu, gdzie psy lizały krew Nabota, psy będą lizać twoją krew, właśnie twoją."
  tags: []
"1Krl21,20":
  text: "Achab powiedział do Eliasza: Już mnie znalazłeś, mój wrogu? Odpowiedział: Znalazłem, gdyż zaprzedałeś się, aby czynić zło na oczach PANA."
  tags: []
"1Krl21,21":
  text: "Oto sprowadzę na ciebie zło i usunę twoich potomków, i wytępię z domu Achaba każdego, aż do najmniejszego szczenięcia, każdego więźnia i opuszczonego w Izraelu."
  tags: []
"1Krl21,22":
  text: "I postąpię z twoim domem jak z domem Jeroboama, syna Nebata, i z domem Baszy, syna Achiasza, z powodu obrazy, którą pobudziłeś mnie do gniewu i przywiodłeś Izraela do grzechu."
  tags: []
"1Krl21,23":
  text: "Także o Jezabel PAN powiedział: Psy zjedzą Jezabel przy murze Jizreel."
  tags: []
"1Krl21,24":
  text: "Tego, kto z domu Achaba umrze w mieście, zjedzą psy, a tego, kto umrze na polu, zjedzą ptaki powietrzne."
  tags: []
"1Krl21,25":
  text: "Nie było bowiem nikogo takiego jak Achab, kto by się zaprzedał, aby czynić niegodziwość na oczach PANA, do czego skłoniła go Jezabel, jego żona."
  tags: []
"1Krl21,26":
  text: "Postępował bardzo obrzydliwie, chodząc za bożkami całkowicie tak samo, jak czynili Amoryci, których PAN wygnał przed synami Izraela."
  tags: []
"1Krl21,27":
  text: "Kiedy Achab usłyszał te słowa, rozdarł swoje szaty, włożył wór na swoje ciało, pościł, spał w worze i chodził pokornie."
  tags: []
"1Krl21,28":
  text: "Wtedy słowo PANA doszło do Eliasza Tiszbity:"
  tags: []
"1Krl21,29":
  text: "Czy widziałeś, jak Achab upokorzył się przede mną? Ponieważ upokorzył się przede mną, nie sprowadzę tego nieszczęścia za jego dni; ale sprowadzę nieszczęście na jego dom za dni jego syna."
  tags: []
