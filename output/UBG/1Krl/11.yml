"1Krl11,1":
  text: "Król Salomon jednak oprócz córki faraona kochał wiele obcych kobiet: Moabitki, Ammonitki, Edomitki, Sydonitki i Chetytki;"
  tags: []
"1Krl11,2":
  text: "Spośród tych narodów, o których PAN powiedział synom Izraela: Nie łączcie się z nimi i niech one nie łączą się z wami; z pewnością bowiem skłonią wasze serca ku swoim bogom. Salomon przylgnął do nich miłością."
  tags: []
"1Krl11,3":
  text: "Miał więc siedemset żon, księżniczek, i trzysta nałożnic. A jego żony odwiodły jego serce."
  tags: []
"1Krl11,4":
  text: "Gdy bowiem Salomon się zestarzał, jego żony skłoniły jego serce ku innym bogom. Jego serce nie było więc doskonałe wobec PANA, jego Boga, jak serce Dawida, jego ojca."
  tags: []
"1Krl11,5":
  text: "Salomon bowiem poszedł za Asztartą, boginią Sydończyków, i za Milkomem, obrzydliwością Ammonitów."
  tags: []
"1Krl11,6":
  text: "Salomon więc czynił to, co złe w oczach PANA, i nie chodził całkowicie za PANEM jak Dawid, jego ojciec."
  tags: []
"1Krl11,7":
  text: "Wówczas Salomon zbudował wyżynę dla Kemosza, obrzydliwości Moabu, na górze naprzeciwko Jerozolimy, oraz dla Molocha, obrzydliwości synów Ammona."
  tags: []
"1Krl11,8":
  text: "Podobnie uczynił dla wszystkich swoich żon obcej narodowości, które spalały kadzidła i składały ofiary swoim bogom."
  tags: []
"1Krl11,9":
  text: "PAN rozgniewał się więc na Salomona za to, że jego serce odwróciło się od PANA, Boga Izraela, który dwukrotnie mu się ukazał;"
  tags: []
"1Krl11,10":
  text: "I zakazał mu chodzić za innymi bogami. Lecz on nie przestrzegał tego, co PAN przykazał."
  tags: []
"1Krl11,11":
  text: "PAN powiedział więc do Salomona: Ponieważ dopuściłeś się tego i nie przestrzegałeś mojego przymierza ani moich nakazów, które ci przykazałem, na pewno wyrwę ci królestwo i dam je twemu słudze."
  tags: []
"1Krl11,12":
  text: "Lecz nie uczynię tego za twego życia ze względu na Dawida, twego ojca, ale wyrwę je z ręki twego syna."
  tags: []
"1Krl11,13":
  text: "Nie wyrwę jednak całego królestwa. Dam jedno pokolenie twemu synowi ze względu na Dawida, mego sługę, i ze względu na Jerozolimę, którą wybrałem."
  tags: []
"1Krl11,14":
  text: "PAN wzbudził więc Salomonowi przeciwnika, Hadada Edomitę, z rodu królewskiego w Edomie."
  tags: []
"1Krl11,15":
  text: "Stało się bowiem tak, że kiedy Dawid był w Edomie, a Joab, dowódca wojska, wyruszył, aby pogrzebać zabitych, gdyż zabił wszystkich mężczyzn w Edomie;"
  tags: []
"1Krl11,16":
  text: "(Bo Joab mieszkał tam przez sześć miesięcy wraz z całym Izraelem, aż wytracił wszystkich mężczyzn w Edomie)."
  tags: []
"1Krl11,17":
  text: "Hadad uciekł wraz z pewnymi Edomitami spośród sług swego ojca, aby dostać się do Egiptu; Hadad był wtedy małym chłopcem."
  tags: []
"1Krl11,18":
  text: "Wyruszyli więc z Midian i przybyli do Paran. Z Paran zabrali ze sobą mężczyzn i przybyli do Egiptu, do faraona, króla Egiptu. Ten dał mu dom, zapewnił mu żywność i dał mu ziemię."
  tags: []
"1Krl11,19":
  text: "Hadad znalazł wielką łaskę w oczach faraona, tak że ten dał mu za żonę siostrę swojej żony, siostrę królowej Tachpenes."
  tags: []
"1Krl11,20":
  text: "Siostra Tachpenes urodziła mu syna, Genubata, którego wychowała Tachpenes w domu faraona. Genubat przebywał więc w domu faraona wśród jego synów."
  tags: []
"1Krl11,21":
  text: "A gdy Hadad usłyszał w Egipcie, że Dawid zasnął ze swoimi ojcami i że umarł Joab, dowódca wojska, wtedy powiedział do faraona: Pozwól mi wrócić do swojej ziemi."
  tags: []
"1Krl11,22":
  text: "Faraon zapytał go: Czego ci u mnie brakuje, że chcesz wrócić do swojej ziemi? Odpowiedział: Niczego. Pozwól mi jednak wrócić."
  tags: []
"1Krl11,23":
  text: "Bóg wzbudził mu też przeciwnika w osobie Rezona, syna Eliady, który uciekł od swego pana Hadadezera, króla Soby."
  tags: []
"1Krl11,24":
  text: "Zebrał on wokół siebie ludzi i został przywódcą zgrai, gdy Dawid pobił mieszkańców z Soby. Potem udali się do Damaszku, gdzie mieszkali, a potem panowali nad Damaszkiem."
  tags: []
"1Krl11,25":
  text: "Był on przeciwnikiem Izraela przez wszystkie dni Salomona, oprócz tego zła, jakie wyrządził mu Hadad. Znienawidził Izraela, gdy został królem Syrii."
  tags: []
"1Krl11,26":
  text: "Jeroboam, syn Nebata Efratejczyka z Seredy i sługa Salomona, którego matka miała na imię Serua i była wdową, również podniósł rękę przeciw królowi."
  tags: []
"1Krl11,27":
  text: "A taka była przyczyna, dla której podniósł rękę przeciwko królowi: Salomon zbudował Millo i zamknął wyłomy w mieście Dawida, swego ojca."
  tags: []
"1Krl11,28":
  text: "A Jeroboam był dzielnym wojownikiem. Gdy Salomon zauważył, że młodzieniec dobrze wykonuje swoją pracę, ustanowił go przełożonym nad wszystkimi sprawami domu Józefa."
  tags: []
"1Krl11,29":
  text: "I zdarzyło się w tym czasie, gdy Jeroboam wyszedł z Jerozolimy, że spotkał go na drodze prorok Achiasz Szilonita, odziany w nowy płaszcz. I ci dwaj byli sami na polu."
  tags: []
"1Krl11,30":
  text: "Wtedy Achiasz chwycił nowy płaszcz, który miał na sobie, i rozdarł go na dwanaście części."
  tags: []
"1Krl11,31":
  text: "I powiedział do Jeroboama: Weź sobie dziesięć części. Tak bowiem mówi PAN, Bóg Izraela: Oto wyrwę królestwo z ręki Salomona, a tobie dam dziesięć pokoleń."
  tags: []
"1Krl11,32":
  text: "Jemu zaś pozostanie jedno pokolenie ze względu na mego sługę Dawida i ze względu na Jerozolimę, miasto, które wybrałem spośród wszystkich pokoleń Izraela;"
  tags: []
"1Krl11,33":
  text: "Dlatego że opuścili mnie i oddali pokłon Asztarcie, bogini Sydończyków, Kemoszowi, bogu Moabitów, i Milkomowi, bogu synów Ammona, a nie chodzili moimi drogami, aby czynić to, co prawe w moich oczach, i przestrzegać moich nakazów i praw, jak to czynił Dawid, jego ojciec."
  tags: []
"1Krl11,34":
  text: "Nie odbiorę całego królestwa z jego ręki, ale pozostawię go księciem po wszystkie dni jego życia ze względu na Dawida, swego sługę, którego wybrałem i który przestrzegał moich przykazań i nakazów."
  tags: []
"1Krl11,35":
  text: "Zabiorę natomiast królestwo z ręki jego syna i dam je tobie – dziesięć pokoleń."
  tags: []
"1Krl11,36":
  text: "A jego synowi dam jedno pokolenie, aby Dawid, mój sługa, miał po wszystkie dni pochodnię przede mną w Jerozolimie, w mieście, które sobie wybrałem, aby tam przebywało moje imię."
  tags: []
"1Krl11,37":
  text: "Ciebie zaś wezmę i będziesz panował nad wszystkim, czego zapragnie twoja dusza, i będziesz królem nad Izraelem."
  tags: []
"1Krl11,38":
  text: "Jeśli więc będziesz słuchał wszystkiego, co ci rozkażę, i będziesz kroczył moimi drogami, i czynił to, co prawe w moich oczach, i przestrzegał moich nakazów i przykazań, jak czynił mój sługa Dawid, wtedy będę z tobą, zbuduję ci dom trwały, jak zbudowałem Dawidowi, i powierzę ci Izraela."
  tags: []
"1Krl11,39":
  text: "Dlatego upokorzę potomstwo Dawida, jednak nie po wszystkie dni."
  tags: []
"1Krl11,40":
  text: "Salomon usiłował więc zabić Jeroboama, ale Jeroboam wstał i uciekł do Egiptu, do Sziszaka, króla Egiptu. I pozostał w Egipcie aż do śmierci Salomona."
  tags: []
"1Krl11,41":
  text: "A pozostałe dzieje Salomona oraz wszystko, co czynił, i jego mądrość, czy nie są zapisane w księdze dziejów Salomona?"
  tags: []
"1Krl11,42":
  text: "A czas, w którym Salomon panował w Jerozolimie nad całym Izraelem, obejmował czterdzieści lat."
  tags: []
"1Krl11,43":
  text: "I Salomon zasnął ze swymi ojcami i został pogrzebany w mieście Dawida, swego ojca. I jego syn Roboam królował w jego miejsce."
  tags: []
