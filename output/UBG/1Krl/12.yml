"1Krl12,1":
  text: "Roboam udał się do Sychem, gdyż do Sychem przybył cały Izrael, aby ustanowić go królem."
  tags: []
"1Krl12,2":
  text: "I gdy usłyszał o tym Jeroboam, syn Nebata, który był jeszcze w Egipcie (bo uciekł przed królem Salomonem i zamieszkał w Egipcie);"
  tags: []
"1Krl12,3":
  text: "Posłano po niego i wezwano go. Jeroboam oraz całe zgromadzenie Izraela przybyli więc i przemówili do Roboama:"
  tags: []
"1Krl12,4":
  text: "Twój ojciec włożył na nas ciężkie jarzmo. Teraz więc ty ulżyj nam w srogiej służbie swego ojca i w jego ciężkim jarzmie, które włożył na nas, a będziemy ci służyć."
  tags: []
"1Krl12,5":
  text: "Odpowiedział im: Odejdźcie i wróćcie do mnie po trzech dniach. I lud odszedł."
  tags: []
"1Krl12,6":
  text: "Wtedy król Roboam radził się starszych, którzy stawali przed Salomonem, jego ojcem, gdy jeszcze żył, i zapytał: Jak doradzacie odpowiedzieć temu ludowi?"
  tags: []
"1Krl12,7":
  text: "Odpowiedzieli mu: Jeśli dziś staniesz się sługą tego ludu i będziesz mu służył, a dając odpowiedź, będziesz mówił do nich łagodne słowa, to będą twoimi sługami przez wszystkie dni."
  tags: []
"1Krl12,8":
  text: "Ale on odrzucił radę starszych, którą mu dali, i radził się młodzieńców, którzy razem z nim wzrośli i którzy stawali przed nim;"
  tags: []
"1Krl12,9":
  text: "I zapytał ich: A co wy radzicie odpowiedzieć temu ludowi, który poprosił mnie: Ulżyj nam w jarzmie, które włożył na nas twój ojciec."
  tags: []
"1Krl12,10":
  text: "Wtedy młodzieńcy, którzy razem z nim wzrośli, odpowiedzieli mu: Tak odpowiesz temu ludowi, który mówił do ciebie: Twój ojciec włożył na nas ciężkie jarzmo, ale ty ulżyj nam; tak im powiesz: Mój mały palec jest grubszy niż biodra mojego ojca."
  tags: []
"1Krl12,11":
  text: "Teraz więc, chociaż mój ojciec nałożył na was ciężkie jarzmo, ja dołożę do waszego jarzma. Mój ojciec karcił was biczami, ale ja będę was karcił skorpionami."
  tags: []
"1Krl12,12":
  text: "Przyszedł więc Jeroboam i cały lud do Roboama trzeciego dnia, tak jak król nakazał, mówiąc: Wróćcie do mnie na trzeci dzień."
  tags: []
"1Krl12,13":
  text: "I król dał ludowi surową odpowiedź, gdyż odrzucił radę starszych, którą mu dali;"
  tags: []
"1Krl12,14":
  text: "I przemówił do niego według rady młodzieńców, mówiąc: Mój ojciec obciążył was ciężkim jarzmem, ale ja dołożę do waszego jarzma. Mój ojciec karcił was biczami, ale ja będę was karcił skorpionami."
  tags: []
"1Krl12,15":
  text: "Król nie usłuchał więc ludu. Sprawa bowiem wyszła od PANA, aby spełnił swoje słowo, które PAN wypowiedział przez Achiasza Szilonitę do Jeroboama, syna Nebata."
  tags: []
"1Krl12,16":
  text: "A gdy cały Izrael zobaczył, że król go nie usłuchał, lud odpowiedział królowi: Jakiż dział mamy w Dawidzie? Nie mamy dziedzictwa w synu Jessego. Do swoich namiotów, o Izraelu! A ty, Dawidzie, troszcz się teraz o swój dom. I rozszedł się Izrael do swoich namiotów."
  tags: []
"1Krl12,17":
  text: "Roboam zaś królował tylko nad synami Izraela, którzy mieszkali w miastach Judy."
  tags: []
"1Krl12,18":
  text: "Wtedy król Roboam posłał Adorama, który był poborcą, ale cały Izrael ukamienował go tak, że umarł. Król Roboam wsiadł więc w pośpiechu na rydwan i uciekł do Jerozolimy."
  tags: []
"1Krl12,19":
  text: "W ten sposób Izrael zbuntował się przeciwko domowi Dawida i trwa to aż do dziś."
  tags: []
"1Krl12,20":
  text: "Gdy cały Izrael usłyszał o tym, że Jeroboam wrócił, posłali po niego, wezwali go do zgromadzenia i ustanowili go królem nad całym Izraelem. Przy domu Dawida nie pozostał nikt oprócz pokolenia Judy."
  tags: []
"1Krl12,21":
  text: "A gdy Roboam przybył do Jerozolimy, zebrał cały dom Judy i pokolenie Beniamina, razem sto osiemdziesiąt tysięcy doborowych wojowników, aby walczyć z domem Izraela i przywrócić królestwo Roboamowi, synowi Salomona."
  tags: []
"1Krl12,22":
  text: "Lecz słowo Boże doszło do Szemajasza, męża Bożego:"
  tags: []
"1Krl12,23":
  text: "Powiedz Roboamowi, synowi Salomona, królowi Judy, całemu domowi Judy i Beniamina i reszcie ludu:"
  tags: []
"1Krl12,24":
  text: "Tak mówi PAN: Nie wyruszajcie ani nie walczcie ze swoimi braćmi, synami Izraela. Niech każdy wróci do swego domu, bo ta rzecz wyszła ode mnie. I posłuchali rozkazu PANA, i wrócili zgodnie ze słowem PANA."
  tags: []
"1Krl12,25":
  text: "Potem Jeroboam zbudował Sychem na górze Efraim i zamieszkał w nim. Następnie wyszedł stamtąd i zbudował Penuel."
  tags: []
"1Krl12,26":
  text: "Wtedy Jeroboam powiedział sobie w sercu: Wkrótce królestwo powróci do domu Dawida;"
  tags: []
"1Krl12,27":
  text: "Bo jeśli lud będzie chodził na składanie ofiary do domu PANA w Jerozolimie, to serce tego ludu zwróci się do swego pana, do Roboama, króla Judy. Zabiją mnie i powrócą do Roboama, króla Judy."
  tags: []
"1Krl12,28":
  text: "Król zasięgnął więc rady, po czym sporządził dwa złote cielce i powiedział ludowi: Dość już waszego chodzenia do Jerozolimy. Oto twoi bogowie, Izraelu, którzy cię wyprowadzili z ziemi Egiptu."
  tags: []
"1Krl12,29":
  text: "I postawił jednego w Betel, a drugiego umieścił w Dan."
  tags: []
"1Krl12,30":
  text: "I stało się to przyczyną grzechu, bo lud chodził do jednego z nich, aż do Dan."
  tags: []
"1Krl12,31":
  text: "Pobudował też dom na wyżynach i ustanowił kapłanów spośród pospólstwa, którzy nie pochodzili od synów Lewiego."
  tags: []
"1Krl12,32":
  text: "Następnie Jeroboam ustanowił święto w ósmym miesiącu, piętnastego dnia tego miesiąca, na wzór święta, które obchodzono w Judzie, i składał ofiary na ołtarzu. Tak uczynił w Betel, składając ofiary cielcom, które sporządził. Ustanowił też w Betel kapłanów wyżyn, które pobudował."
  tags: []
"1Krl12,33":
  text: "Tak więc składał ofiary na ołtarzu, który sporządził w Betel, piętnastego dnia ósmego miesiąca, w tym miesiącu, który sobie wymyślił, i ustanowił święto dla synów Izraela. I przystąpił do ołtarza, aby spalić kadzidło."
  tags: []
