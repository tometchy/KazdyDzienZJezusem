"1Krl5,1":
  text: "Hiram, król Tyru, wysłał swoje sługi do Salomona, bo usłyszał, że namaszczono go na króla w miejsce jego ojca. Hiram bowiem kochał Dawida przez wszystkie dni."
  tags: []
"1Krl5,2":
  text: "Salomon też posłał do Hirama taką wiadomość:"
  tags: []
"1Krl5,3":
  text: "Ty wiesz, że mój ojciec Dawid nie mógł budować domu dla imienia PANA, swego Boga, z powodu wojen, które go otaczały, dopóki PAN nie poddał jego wrogów pod stopy jego nóg."
  tags: []
"1Krl5,4":
  text: "Lecz teraz PAN, mój Bóg, dał mi zewsząd odpoczynek, nie ma żadnego przeciwnika ani złego wydarzenia."
  tags: []
"1Krl5,5":
  text: "Oto postanowiłem zbudować dom dla imienia PANA, swego Boga, zgodnie z tym, co PAN powiedział memu ojcu Dawidowi: Twój syn, którego posadzę po tobie na twoim tronie, on zbuduje dom dla mojego imienia."
  tags: []
"1Krl5,6":
  text: "Teraz więc rozkaż, aby ścięto dla mnie cedry z Libanu, a moi słudzy będą z twoimi sługami. Dam ci zapłatę dla twoich sług, jaką wyznaczysz. Ty wiesz bowiem, że wśród nas nie ma nikogo, kto by umiał rąbać drzewo tak jak Sydończycy."
  tags: []
"1Krl5,7":
  text: "Gdy Hiram usłyszał słowa Salomona, bardzo się ucieszył i powiedział: Błogosławiony niech będzie dzisiaj PAN, który dał Dawidowi mądrego syna, aby był nad tym wielkim ludem."
  tags: []
"1Krl5,8":
  text: "Wtedy Hiram posłał do Salomona wiadomość: Wysłuchałem tego, co mi przesłałeś. Uczynię wszystko zgodnie z twoim życzeniem co do drewna cedrowego i drewna cyprysowego."
  tags: []
"1Krl5,9":
  text: "Moi słudzy sprowadzą je z Libanu nad morze, a ja każę je złożyć na tratwy i przeprawić przez morze aż do miejsca, które mi wskażesz. Tam je rozładują, a ty je zabierzesz. Ty też spełnisz moje życzenie i dostarczysz żywność dla mojego dworu."
  tags: []
"1Krl5,10":
  text: "Hiram dostarczał więc Salomonowi drewno cedrowe i drewno cyprysowe, tyle ile Salomon chciał."
  tags: []
"1Krl5,11":
  text: "Salomon z kolei dostarczał Hiramowi dwadzieścia tysięcy kor pszenicy na żywność dla jego dworu i dwadzieścia kor czystej oliwy. Tyle Salomon dostarczał Hiramowi każdego roku."
  tags: []
"1Krl5,12":
  text: "A PAN dał Salomonowi mądrość, tak jak mu obiecał. I panował pokój między Hiramem a Salomonem, zawarli też ze sobą przymierze."
  tags: []
"1Krl5,13":
  text: "Potem król Salomon kazał wybrać robotników z całego Izraela, a było tych robotników trzydzieści tysięcy mężczyzn."
  tags: []
"1Krl5,14":
  text: "Co miesiąc wysyłał ich do Libanu po dziesięć tysięcy na zmianę: miesiąc przebywali w Libanie, a dwa miesiące w domu. Przełożonym tych robotników był Adoniram."
  tags: []
"1Krl5,15":
  text: "Salomon miał też siedemdziesiąt tysięcy ludzi do dźwigania ciężarów oraz osiemdziesiąt tysięcy robotników w kamieniołomach w górach;"
  tags: []
"1Krl5,16":
  text: "Oprócz naczelnych urzędników Salomona, którzy nadzorowali pracę, miał też trzy tysiące trzystu przełożonych nad ludźmi wykonującymi pracę."
  tags: []
"1Krl5,17":
  text: "Król rozkazał również, aby przywieziono kamienie wielkie, kamienie drogie i kamienie ciosane na założenie fundamentów domu."
  tags: []
"1Krl5,18":
  text: "Ciosali je więc budowniczowie Salomona i Hirama oraz Gibilici. I tak przygotowali drewno i kamienie na budowę domu."
  tags: []
