"1Krl5,1": "Hiram, król Tyru, wysłał swoje sługi do Salomona, bo usłyszał, że namaszczono go na króla w miejsce jego ojca. Hiram bowiem kochał Dawida przez wszystkie dni."
"1Krl5,2": "Salomon też posłał do Hirama taką wiadomość:"
"1Krl5,3": "Ty wiesz, że mój ojciec Dawid nie mógł budować domu dla imienia PANA, swego Boga, z powodu wojen, które go otaczały, dopóki PAN nie poddał jego wrogów pod stopy jego nóg."
"1Krl5,4": "Lecz teraz PAN, mój Bóg, dał mi zewsząd odpoczynek, nie ma żadnego przeciwnika ani złego wydarzenia."
"1Krl5,5": "Oto postanowiłem zbudować dom dla imienia PANA, swego Boga, zgodnie z tym, co PAN powiedział memu ojcu Dawidowi: Twój syn, którego posadzę po tobie na twoim tronie, on zbuduje dom dla mojego imienia."
"1Krl5,6": "Teraz więc rozkaż, aby ścięto dla mnie cedry z Libanu, a moi słudzy będą z twoimi sługami. Dam ci zapłatę dla twoich sług, jaką wyznaczysz. Ty wiesz bowiem, że wśród nas nie ma nikogo, kto by umiał rąbać drzewo tak jak Sydończycy."
"1Krl5,7": "Gdy Hiram usłyszał słowa Salomona, bardzo się ucieszył i powiedział: Błogosławiony niech będzie dzisiaj PAN, który dał Dawidowi mądrego syna, aby był nad tym wielkim ludem."
"1Krl5,8": "Wtedy Hiram posłał do Salomona wiadomość: Wysłuchałem tego, co mi przesłałeś. Uczynię wszystko zgodnie z twoim życzeniem co do drewna cedrowego i drewna cyprysowego."
"1Krl5,9": "Moi słudzy sprowadzą je z Libanu nad morze, a ja każę je złożyć na tratwy i przeprawić przez morze aż do miejsca, które mi wskażesz. Tam je rozładują, a ty je zabierzesz. Ty też spełnisz moje życzenie i dostarczysz żywność dla mojego dworu."
"1Krl5,10": "Hiram dostarczał więc Salomonowi drewno cedrowe i drewno cyprysowe, tyle ile Salomon chciał."
"1Krl5,11": "Salomon z kolei dostarczał Hiramowi dwadzieścia tysięcy kor pszenicy na żywność dla jego dworu i dwadzieścia kor czystej oliwy. Tyle Salomon dostarczał Hiramowi każdego roku."
"1Krl5,12": "A PAN dał Salomonowi mądrość, tak jak mu obiecał. I panował pokój między Hiramem a Salomonem, zawarli też ze sobą przymierze."
"1Krl5,13": "Potem król Salomon kazał wybrać robotników z całego Izraela, a było tych robotników trzydzieści tysięcy mężczyzn."
"1Krl5,14": "Co miesiąc wysyłał ich do Libanu po dziesięć tysięcy na zmianę: miesiąc przebywali w Libanie, a dwa miesiące w domu. Przełożonym tych robotników był Adoniram."
"1Krl5,15": "Salomon miał też siedemdziesiąt tysięcy ludzi do dźwigania ciężarów oraz osiemdziesiąt tysięcy robotników w kamieniołomach w górach;"
"1Krl5,16": "Oprócz naczelnych urzędników Salomona, którzy nadzorowali pracę, miał też trzy tysiące trzystu przełożonych nad ludźmi wykonującymi pracę."
"1Krl5,17": "Król rozkazał również, aby przywieziono kamienie wielkie, kamienie drogie i kamienie ciosane na założenie fundamentów domu."
"1Krl5,18": "Ciosali je więc budowniczowie Salomona i Hirama oraz Gibilici. I tak przygotowali drewno i kamienie na budowę domu."
