"1Krl15,1":
  text: "W osiemnastym roku króla Jeroboama, syna Nebata, Abijam zaczął królować nad Judą."
  tags: []
"1Krl15,2":
  text: "Trzy lata królował w Jerozolimie, a jego matka miała na imię Maaka i była córką Abiszaloma."
  tags: []
"1Krl15,3":
  text: "Szedł on śladem wszystkich grzechów swego ojca, które popełnił przed nim. Jego serce nie było doskonałe wobec PANA, swego Boga, jak serce Dawida, jego ojca."
  tags: []
"1Krl15,4":
  text: "Jednak ze względu na Dawida PAN, jego Bóg, dał mu pochodnię w Jerozolimie, wzbudzając po nim jego syna i umacniając Jerozolimę;"
  tags: []
"1Krl15,5":
  text: "Ponieważ Dawid czynił to, co było prawe w oczach PANA, i nie odstąpił od niczego, co mu rozkazał, przez wszystkie dni swego życia, z wyjątkiem sprawy Uriasza Chetyty."
  tags: []
"1Krl15,6":
  text: "I trwała wojna między Roboamem a Jeroboamem przez wszystkie dni jego życia."
  tags: []
"1Krl15,7":
  text: "A pozostałe dzieje Abijama i wszystko, co czynił, czyż nie są zapisane w kronikach o królach Judy. I trwała wojna między Abijamem a Jeroboamem."
  tags: []
"1Krl15,8":
  text: "Potem Abijam zasnął ze swoimi ojcami i pogrzebano go w mieście Dawida. I jego syn Asa królował w jego miejsce."
  tags: []
"1Krl15,9":
  text: "W dwudziestym roku Jeroboama, króla Izraela, Asa królował nad Judą."
  tags: []
"1Krl15,10":
  text: "I królował czterdzieści jeden lat w Jerozolimie. Jego matka miała na imię Maacha i była córką Abiszaloma."
  tags: []
"1Krl15,11":
  text: "Asa czynił to, co było prawe w oczach PANA, jak Dawid, jego ojciec."
  tags: []
"1Krl15,12":
  text: "Usunął z ziemi sodomitów i wszystkie bożki, które wykonali jego ojcowie."
  tags: []
"1Krl15,13":
  text: "Również Maachę, swoją matkę, odsunął od panowania za to, że sporządziła bożka w gaju. Asa zniszczył więc jej bożka i spalił go przy potoku Cedron."
  tags: []
"1Krl15,14":
  text: "I chociaż wyżyny nie zostały zniszczone, jednak serce Asy było doskonałe wobec PANA przez wszystkie jego dni."
  tags: []
"1Krl15,15":
  text: "I wniósł do domu PANA rzeczy poświęcone przez swego ojca i rzeczy, które sam poświęcił: srebro, złoto i naczynia."
  tags: []
"1Krl15,16":
  text: "I między Asą a Baszą, królem Izraela, trwała wojna przez wszystkie ich dni."
  tags: []
"1Krl15,17":
  text: "Basza, król Izraela, nadciągnął przeciwko Judzie i rozbudował Rama, aby nikomu nie pozwolić wychodzić od Asy, króla Judy, i przychodzić do niego."
  tags: []
"1Krl15,18":
  text: "Asa wziął więc całe srebro i złoto, które pozostało w skarbcach domu PANA i w skarbcach domu królewskiego, i dał je w ręce swoich sług. Następnie król Asa posłał ich do Ben-Hadada, syna Tabrimona, syna Chezjona, króla Syrii, który mieszkał w Damaszku, mówiąc:"
  tags: []
"1Krl15,19":
  text: "Jest przymierze między mną a tobą, między moim ojcem a twoim ojcem. Oto posyłam ci dar: srebro i złoto. Idź, zerwij swoje przymierze z Baszą, królem Izraela, aby odstąpił ode mnie."
  tags: []
"1Krl15,20":
  text: "I Ben-Hadad posłuchał króla Asy, i posłał dowódców swoich wojsk przeciwko miastom Izraela, napadł na Ijon, Dan i Abel-Bet-Maaka oraz całe Kinerot wraz z całą ziemią Neftalego."
  tags: []
"1Krl15,21":
  text: "Gdy Basza o tym usłyszał, przestał rozbudowywać Rama i mieszkał w Tirsie."
  tags: []
"1Krl15,22":
  text: "Wtedy król Asa zwołał cały lud Judy, bez wyjątku, a lud zabrał z Rama kamienie i drewno, z których Basza budował. I król Asa rozbudował nimi Gibea Beniamina oraz Mispę."
  tags: []
"1Krl15,23":
  text: "A pozostałe dzieje Asy, cała jego potęga i wszystko, co czynił, oraz miasta, które zbudował, czyż nie są zapisane w kronikach królów Judy? Jednak w okresie swojej starości zachorował na nogi."
  tags: []
"1Krl15,24":
  text: "I Asa zasnął ze swoimi ojcami, i został pogrzebany z nimi w mieście Dawida, swego ojca. A jego syn Jehoszafat królował w jego miejsce."
  tags: []
"1Krl15,25":
  text: "W drugim roku Asy, króla Judy, nad Izraelem zaczął królować Nadab, syn Jeroboama i królował nad Izraelem dwa lata."
  tags: []
"1Krl15,26":
  text: "I czynił to, co złe w oczach PANA, idąc drogami swego ojca i w jego grzechu, którym doprowadził Izraela do grzechu."
  tags: []
"1Krl15,27":
  text: "I Basza, syn Achiasza, z domu Issachara, uknuł spisek przeciw niemu. Basza zabił go w Gibbeton, który należał do Filistynów. Nadab bowiem i cały Izrael oblegali Gibbeton."
  tags: []
"1Krl15,28":
  text: "Basza zabił go w trzecim roku Asy, króla Judy, i sam królował w jego miejsce."
  tags: []
"1Krl15,29":
  text: "Kiedy zaczął królować, wymordował cały dom Jeroboama i nie pozostawił żywej duszy z rodu Jeroboama, dopóki nie wytracił go zgodnie ze słowem PANA, które wypowiedział przez swego sługę Achiasza Szilonitę;"
  tags: []
"1Krl15,30":
  text: "Z powodu grzechów Jeroboama, które popełnił i do których skłonił Izraela; z powodu rozdrażnienia, którym pobudził do gniewu PANA, Boga Izraela."
  tags: []
"1Krl15,31":
  text: "A pozostałe dzieje Nadaba i wszystko, co czynił, czyż nie są zapisane w kronikach królów Izraela?"
  tags: []
"1Krl15,32":
  text: "I między Asą a Baszą, królem Izraela, trwała wojna po wszystkie ich dni."
  tags: []
"1Krl15,33":
  text: "W trzecim roku Asy, króla Judy, nad całym Izraelem zaczął królować w Tirsie Basza, syn Achiasza. I królował przez dwadzieścia cztery lata."
  tags: []
"1Krl15,34":
  text: "I czynił to, co złe w oczach PANA, idąc drogami Jeroboama i w jego grzechu, do którego skłonił Izraela."
  tags: []
