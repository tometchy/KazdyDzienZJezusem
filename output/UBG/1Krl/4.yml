"1Krl4,1":
  text: "Tak więc król Salomon był królem nad całym Izraelem."
  tags: []
"1Krl4,2":
  text: "A oto jego dostojnicy: Azariasz, syn Sadoka, kapłan."
  tags: []
"1Krl4,3":
  text: "Elichoref i Achiasz, synowie Sziszy, pisarze; Jehoszafat, syn Achiluda, kronikarz."
  tags: []
"1Krl4,4":
  text: "Benajasz, syn Jehojady, dowódca wojska; Sadok i Abiatar, kapłani."
  tags: []
"1Krl4,5":
  text: "Azariasz, syn Natana, przełożony namiestników, Zabud, syn Natana, naczelny dostojnik, przyjaciel króla."
  tags: []
"1Krl4,6":
  text: "Achiszar, przełożony dworu, i Adoniram, syn Abdy, odpowiedzialny za daninę."
  tags: []
"1Krl4,7":
  text: "Salomon miał też dwunastu namiestników nad całym Izraelem, którzy zaopatrywali króla i cały jego dwór w żywność. Każdy z nich przez jeden miesiąc w roku miał dostarczać żywność."
  tags: []
"1Krl4,8":
  text: "A oto ich imiona: syn Chura – na górze Efraim;"
  tags: []
"1Krl4,9":
  text: "Syn Dekara – w Makas, Szaalbim – w Bet-Szemesz i Elon-Bet-Chanan;"
  tags: []
"1Krl4,10":
  text: "Syn Cheseda – w Arubot, do niego należało Soko i cała ziemia Chefer;"
  tags: []
"1Krl4,11":
  text: "Syn Abinadaba – nad całym obszarem Dor; jego żoną była Tafat, córka Salomona."
  tags: []
"1Krl4,12":
  text: "Baana, syn Achiluda, do którego należały Tanak i Megiddo oraz całe Bet-Szean, które leży przy Sartan pod Jizreelem, od Bet-Szean aż do Abel-Mechola, aż poza Jokmeam."
  tags: []
"1Krl4,13":
  text: "Syn Geber – w Ramot-Gilead, do niego należały wsie Jaira, syna Manassesa, które leżą w Gileadzie. Do niego też należała kraina Argob, która jest w Baszanie – sześćdziesiąt wielkich miast mających mury i brązowe rygle."
  tags: []
"1Krl4,14":
  text: "Achinadab, syn Iddo – w Machanaim."
  tags: []
"1Krl4,15":
  text: "Achimaas – w Neftalim; on też pojął za żonę Basemat, córkę Salomona."
  tags: []
"1Krl4,16":
  text: "Baana, syn Chuszaia – w Aszer i Alot."
  tags: []
"1Krl4,17":
  text: "Jehoszafat, syn Paruacha – w Issacharze."
  tags: []
"1Krl4,18":
  text: "Szimei, syn Eli – w Beniaminie."
  tags: []
"1Krl4,19":
  text: "Geber, syn Uriego – w ziemi Gilead, ziemi Sichona, króla Amorytów, i Oga, króla Baszanu. Był on jedynym namiestnikiem tej ziemi."
  tags: []
"1Krl4,20":
  text: "A Juda i Izrael byli tak liczni jak piasek nad morzem. Jedli, pili i radowali się."
  tags: []
"1Krl4,21":
  text: "A Salomon panował nad wszystkimi królestwami od rzeki aż do ziemi Filistynów, aż do granicy Egiptu. Płaciły one daninę i służyły Salomonowi po wszystkie dni jego życia."
  tags: []
"1Krl4,22":
  text: "Wyżywienie dla Salomona na jeden dzień wynosiło trzydzieści kor najlepszej mąki i sześćdziesiąt kor zwykłej mąki."
  tags: []
"1Krl4,23":
  text: "Dziesięć tucznych wołów, dwadzieścia wołów z pastwiska, sto owiec, nie licząc jeleni, saren, danieli i tucznego drobiu."
  tags: []
"1Krl4,24":
  text: "Panował bowiem nad całym obszarem z tej strony rzeki, od Tifsach aż do Gazy, nad wszystkimi królami z tej strony rzeki. I miał pokój ze wszystkich stron dokoła."
  tags: []
"1Krl4,25":
  text: "Juda i Izrael mieszkali bezpiecznie, każdy pod swoją winoroślą i pod swoim drzewem figowym, od Dan aż do Beer-Szeby, po wszystkie dni Salomona."
  tags: []
"1Krl4,26":
  text: "Salomon miał też czterdzieści tysięcy koni w stajniach do swoich rydwanów i dwanaście tysięcy jeźdźców."
  tags: []
"1Krl4,27":
  text: "Namiestnicy, każdy w swoim miesiącu, zaopatrywali w żywność króla Salomona i wszystkich, którzy przychodzili do stołu króla Salomona, tak że niczego nie brakowało."
  tags: []
"1Krl4,28":
  text: "Także jęczmień i słomę dla koni i mułów sprowadzali na to miejsce, gdzie one przebywały, każdy według swojego obowiązku."
  tags: []
"1Krl4,29":
  text: "A Bóg dał Salomonowi mądrość i bardzo wielkie zrozumienie oraz przestronność serca jak piasek, który jest na brzegu morskim."
  tags: []
"1Krl4,30":
  text: "I mądrość Salomona była większa od mądrości wszystkich narodów wschodnich i od wszelkiej mądrości Egiptu."
  tags: []
"1Krl4,31":
  text: "Był mądrzejszy niż wszyscy ludzie, niż Etan Ezrachita, Heman, Kalkol i Darda, synowie Machola. Był sławny wśród wszystkich okolicznych narodów."
  tags: []
"1Krl4,32":
  text: "Wypowiedział trzy tysiące przysłów, a jego pieśni było tysiąc pięć."
  tags: []
"1Krl4,33":
  text: "Wypowiadał się też o drzewach, poczynając od cedru na Libanie aż do hizopu, który wyrasta z muru. Mówił też o zwierzętach, ptakach, płazach i rybach."
  tags: []
"1Krl4,34":
  text: "Przychodzili więc ludzie ze wszystkich narodów, aby słuchać mądrości Salomona, od wszystkich królów ziemi, którzy słyszeli o jego mądrości."
  tags: []
