"1Krl4,1": "Tak więc król Salomon był królem nad całym Izraelem."
"1Krl4,2": "A oto jego dostojnicy: Azariasz, syn Sadoka, kapłan."
"1Krl4,3": "Elichoref i Achiasz, synowie Sziszy, pisarze; Jehoszafat, syn Achiluda, kronikarz."
"1Krl4,4": "Benajasz, syn Jehojady, dowódca wojska; Sadok i Abiatar, kapłani."
"1Krl4,5": "Azariasz, syn Natana, przełożony namiestników, Zabud, syn Natana, naczelny dostojnik, przyjaciel króla."
"1Krl4,6": "Achiszar, przełożony dworu, i Adoniram, syn Abdy, odpowiedzialny za daninę."
"1Krl4,7": "Salomon miał też dwunastu namiestników nad całym Izraelem, którzy zaopatrywali króla i cały jego dwór w żywność. Każdy z nich przez jeden miesiąc w roku miał dostarczać żywność."
"1Krl4,8": "A oto ich imiona: syn Chura – na górze Efraim;"
"1Krl4,9": "Syn Dekara – w Makas, Szaalbim – w Bet-Szemesz i Elon-Bet-Chanan;"
"1Krl4,10": "Syn Cheseda – w Arubot, do niego należało Soko i cała ziemia Chefer;"
"1Krl4,11": "Syn Abinadaba – nad całym obszarem Dor; jego żoną była Tafat, córka Salomona."
"1Krl4,12": "Baana, syn Achiluda, do którego należały Tanak i Megiddo oraz całe Bet-Szean, które leży przy Sartan pod Jizreelem, od Bet-Szean aż do Abel-Mechola, aż poza Jokmeam."
"1Krl4,13": "Syn Geber – w Ramot-Gilead, do niego należały wsie Jaira, syna Manassesa, które leżą w Gileadzie. Do niego też należała kraina Argob, która jest w Baszanie – sześćdziesiąt wielkich miast mających mury i brązowe rygle."
"1Krl4,14": "Achinadab, syn Iddo – w Machanaim."
"1Krl4,15": "Achimaas – w Neftalim; on też pojął za żonę Basemat, córkę Salomona."
"1Krl4,16": "Baana, syn Chuszaia – w Aszer i Alot."
"1Krl4,17": "Jehoszafat, syn Paruacha – w Issacharze."
"1Krl4,18": "Szimei, syn Eli – w Beniaminie."
"1Krl4,19": "Geber, syn Uriego – w ziemi Gilead, ziemi Sichona, króla Amorytów, i Oga, króla Baszanu. Był on jedynym namiestnikiem tej ziemi."
"1Krl4,20": "A Juda i Izrael byli tak liczni jak piasek nad morzem. Jedli, pili i radowali się."
"1Krl4,21": "A Salomon panował nad wszystkimi królestwami od rzeki aż do ziemi Filistynów, aż do granicy Egiptu. Płaciły one daninę i służyły Salomonowi po wszystkie dni jego życia."
"1Krl4,22": "Wyżywienie dla Salomona na jeden dzień wynosiło trzydzieści kor najlepszej mąki i sześćdziesiąt kor zwykłej mąki."
"1Krl4,23": "Dziesięć tucznych wołów, dwadzieścia wołów z pastwiska, sto owiec, nie licząc jeleni, saren, danieli i tucznego drobiu."
"1Krl4,24": "Panował bowiem nad całym obszarem z tej strony rzeki, od Tifsach aż do Gazy, nad wszystkimi królami z tej strony rzeki. I miał pokój ze wszystkich stron dokoła."
"1Krl4,25": "Juda i Izrael mieszkali bezpiecznie, każdy pod swoją winoroślą i pod swoim drzewem figowym, od Dan aż do Beer-Szeby, po wszystkie dni Salomona."
"1Krl4,26": "Salomon miał też czterdzieści tysięcy koni w stajniach do swoich rydwanów i dwanaście tysięcy jeźdźców."
"1Krl4,27": "Namiestnicy, każdy w swoim miesiącu, zaopatrywali w żywność króla Salomona i wszystkich, którzy przychodzili do stołu króla Salomona, tak że niczego nie brakowało."
"1Krl4,28": "Także jęczmień i słomę dla koni i mułów sprowadzali na to miejsce, gdzie one przebywały, każdy według swojego obowiązku."
"1Krl4,29": "A Bóg dał Salomonowi mądrość i bardzo wielkie zrozumienie oraz przestronność serca jak piasek, który jest na brzegu morskim."
"1Krl4,30": "I mądrość Salomona była większa od mądrości wszystkich narodów wschodnich i od wszelkiej mądrości Egiptu."
"1Krl4,31": "Był mądrzejszy niż wszyscy ludzie, niż Etan Ezrachita, Heman, Kalkol i Darda, synowie Machola. Był sławny wśród wszystkich okolicznych narodów."
"1Krl4,32": "Wypowiedział trzy tysiące przysłów, a jego pieśni było tysiąc pięć."
"1Krl4,33": "Wypowiadał się też o drzewach, poczynając od cedru na Libanie aż do hizopu, który wyrasta z muru. Mówił też o zwierzętach, ptakach, płazach i rybach."
"1Krl4,34": "Przychodzili więc ludzie ze wszystkich narodów, aby słuchać mądrości Salomona, od wszystkich królów ziemi, którzy słyszeli o jego mądrości."
