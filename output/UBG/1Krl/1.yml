"1Krl1,1": "Gdy król Dawid zestarzał się i posunął w latach, to choć okrywano go szatami, nie mógł się rozgrzać."
"1Krl1,2": "Jego słudzy powiedzieli mu więc: Niech poszukają dla naszego pana, króla, młodej dziewicy, która stawałaby przed królem i pielęgnowała go. Niech kładzie się na twoim łonie, żeby nasz pan, król, mógł się rozgrzać."
"1Krl1,3": "Szukali więc pięknej dziewczyny po wszystkich obszarach Izraela i znaleźli Abiszag Szunamitkę, i przyprowadzili ją do króla."
"1Krl1,4": "Dziewczyna ta była bardzo piękna; pielęgnowała króla i służyła mu, ale król z nią nie obcował."
"1Krl1,5": "Lecz Adoniasz, syn Chaggity, wywyższał się, mówiąc: Ja zostanę królem. Zaopatrzył się w rydwany i jeźdźców oraz pięćdziesięciu mężczyzn, którzy biegali przed nim."
"1Krl1,6": "Jego ojciec nigdy go nie upominał, mówiąc: Czemu to uczyniłeś? Był on też bardzo przystojny, jego matka urodziła go po Absalomie."
"1Krl1,7": "Porozumiał się z Joabem, synem Serui, i z kapłanem Abiatarem, a oni przystali z Adoniaszem i pomogli mu."
"1Krl1,8": "Lecz kapłan Sadok, Benajasz, syn Jehojady, prorok Natan, Szimei, Rei oraz dzielni wojownicy Dawida nie sprzyjali Adoniaszowi."
"1Krl1,9": "Potem Adoniasz zabił owce, woły i tuczne bydło przy kamieniu Zochelet, blisko źródła Rogel, i zaprosił wszystkich swych braci, synów króla, oraz wszystkich mężczyzn Judy, sługi króla."
"1Krl1,10": "Lecz nie zaprosił proroka Natana, Benajasza i dzielnych wojowników oraz swego brata Salomona."
"1Krl1,11": "Wtedy Natan zapytał Batszebę, matkę Salomona: Czy nie słyszałaś, że Adoniasz, syn Chaggity, króluje, a nasz pan, Dawid, o tym nie wie?"
"1Krl1,12": "Chodź więc teraz, proszę, dam ci radę, abyś ocaliła swoje życie i życie swego syna, Salomona."
"1Krl1,13": "Idź i wejdź do króla Dawida, i powiedz mu: Czyż ty, mój panie, królu, nie przysiągłeś swojej służącej: Twój syn Salomon będzie królował po mnie i on zasiądzie na moim tronie? Dlaczego więc króluje Adoniasz?"
"1Krl1,14": "A oto gdy ty będziesz tam jeszcze rozmawiała z królem, ja wejdę za tobą i potwierdzę twoje słowa."
"1Krl1,15": "Batszeba weszła więc do króla do komnaty. Król już się bardzo zestarzał, a Abiszag Szunamitka usługiwała królowi."
"1Krl1,16": "Wtedy Batszeba uklękła i oddała pokłon królowi, a król zapytał: Czego chcesz?"
"1Krl1,17": "A ona mu odpowiedziała: Mój panie, ty przysiągłeś swojej służącej na PANA, swego Boga: Twój syn, Salomon, będzie królował po mnie i on zasiądzie na moim tronie."
"1Krl1,18": "A oto teraz Adoniasz króluje, a ty, mój panie, królu, o tym nie wiesz."
"1Krl1,19": "Zabił bowiem woły, tuczne bydło i bardzo dużo owiec i zaprosił wszystkich synów króla, kapłana Abiatara oraz dowódcę wojska, Joaba, ale twego sługi Salomona nie zaprosił."
"1Krl1,20": "Lecz ty, mój panie, królu, wiesz, że oczy całego Izraela są zwrócone na ciebie, abyś im oznajmił, kto zasiądzie na tronie mego pana, króla, po nim."
"1Krl1,21": "W przeciwnym razie, gdy mój pan, król, zaśnie ze swymi ojcami, ja i mój syn Salomon będziemy uważani za przestępców."
"1Krl1,22": "A gdy jeszcze rozmawiała z królem, przyszedł prorok Natan."
"1Krl1,23": "I oznajmiono królowi: Oto prorok Natan. I gdy wszedł przed oblicze króla, pokłonił się królowi twarzą do ziemi."
"1Krl1,24": "Potem Natan powiedział: Mój panie, królu, czy ty powiedziałeś: Adoniasz będzie królował po mnie i on zasiądzie na moim tronie?"
"1Krl1,25": "Dziś bowiem zstąpił i zabił woły, tuczne bydło oraz bardzo dużo owiec, i zaprosił wszystkich synów króla, dowódców wojsk oraz kapłana Abiatara, a oto oni jedzą z nim i piją, i mówią: Niech żyje król Adoniasz!"
"1Krl1,26": "Lecz mnie, twego sługi, i kapłana Sadoka, i Benajasza, syna Jehojady, oraz twego sługi Salomona nie zaprosił."
"1Krl1,27": "Czy wyszło to od mego pana, króla, a nie oznajmiłeś swemu słudze, kto zasiądzie po nim na tronie mego pana, króla?"
"1Krl1,28": "Król Dawid odpowiedział: Zawołajcie mi Batszebę. Ta weszła przed oblicze króla i stanęła przed nim."
"1Krl1,29": "Wtedy król przysiągł: Jak żyje PAN, który wybawił moją duszę z wszelkiego ucisku;"
"1Krl1,30": "Jak przysiągłem ci na PANA, Boga Izraela: Twój syn Salomon będzie królować po mnie i on zasiądzie na moim tronie zamiast mnie, tak dziś uczynię."
"1Krl1,31": "Batszeba schyliła się twarzą ku ziemi i pokłoniła się królowi, i powiedziała: Niech żyje mój pan, król Dawid, na wieki!"
"1Krl1,32": "Potem król Dawid rozkazał: Zawołajcie mi kapłana Sadoka, proroka Natana i Benajasza, syna Jehojady. I tamci weszli przed oblicze króla."
"1Krl1,33": "A król powiedział im: Weźcie ze sobą sługi waszego pana, wsadźcie mego syna Salomona na moją mulicę i sprowadźcie go do Gichonu."
"1Krl1,34": "A tam niech kapłan Sadok i prorok Natan namaszczą go na króla nad Izraelem. Następnie zadmijcie w trąbę i powiedzcie: Niech żyje król Salomon!"
"1Krl1,35": "Potem pójdziecie za nim, a on przyjdzie i zasiądzie na moim tronie, i będzie królował na moje miejsce. Jego bowiem ustanowiłem wodzem nad Izraelem i nad Judą."
"1Krl1,36": "Benajasz, syn Jehojady, odpowiedział królowi: Amen. Niech to stwierdzi PAN, Bóg mego pana, króla."
"1Krl1,37": "Jak PAN był z moim panem, królem, tak niech będzie z Salomonem i niech wywyższy jego tron nad tron mego pana, króla Dawida."
"1Krl1,38": "Poszli więc kapłan Sadok, prorok Natan i Benajasz, syn Jehojady, oraz Keretyci i Peletyci i wsadzili Salomona na mulicę króla Dawida, i zaprowadzili go do Gichonu."
"1Krl1,39": "Wtedy kapłan Sadok wziął róg olejku z namiotu i namaścił Salomona. Potem zadęto w trąbę, a cały lud powiedział: Niech żyje król Salomon!"
"1Krl1,40": "I cały lud szedł za nim. Lud także grał na fletach i tak bardzo się radował, że ziemia drżała od jego głosu."
"1Krl1,41": "I usłyszeli to Adoniasz oraz wszyscy zaproszeni, którzy z nim byli, a właśnie skończyli ucztę. A gdy Joab usłyszał głos trąby, zapytał: Cóż to za krzyk poruszonego miasta?"
"1Krl1,42": "A gdy on jeszcze mówił, przyszedł Jonatan, syn kapłana Abiatara. Adoniasz powiedział mu: Wejdź, jesteś bowiem dzielnym człowiekiem i przynosisz dobrą nowinę."
"1Krl1,43": "Wtedy Jonatan odpowiedział Adoniaszowi: Nasz pan, król Dawid, ustanowił królem Salomona."
"1Krl1,44": "Król bowiem posłał z nim kapłana Sadoka i proroka Natana oraz Benajasza, syna Jehojady, do tego Keretytów i Peletytów, którzy wsadzili go na mulicę króla;"
"1Krl1,45": "Następnie kapłan Sadok i prorok Natan namaścili go na króla w Gichonie. I wyruszyli stamtąd, tak się radując, że miasto zadrżało. Stąd ten krzyk, który usłyszeliście."
"1Krl1,46": "A Salomon zasiadł już na tronie królestwa."
"1Krl1,47": "Ponadto przyszli słudzy króla, aby błogosławić naszemu panu, królowi Dawidowi, mówiąc: Niech Bóg sławniejszym uczyni imię Salomona niż twoje imię i niech wywyższy jego tron ponad twój tron. A król skłonił się na swym łożu."
"1Krl1,48": "Również sam król powiedział: Błogosławiony niech będzie PAN, Bóg Izraela, który dał dziś zasiadającego na moim tronie, a moje oczy to widzą."
"1Krl1,49": "Wtedy zlękli się wszyscy zaproszeni, którzy byli z Adoniaszem, i wstali, i poszli każdy swoją drogą."
"1Krl1,50": "Adoniasz także, bojąc się Salomona, wstał, poszedł i uchwycił się rogów ołtarza."
"1Krl1,51": "I doniesiono o tym Salomonowi: Oto Adoniasz boi się króla Salomona i uchwycił się rogów ołtarza, mówiąc: Niech mi dziś przysięgnie król Salomon, że nie zabije swego sługi mieczem."
"1Krl1,52": "Wtedy Salomon odpowiedział: Jeśli okaże się godziwym człowiekiem, nie spadnie mu nawet włos na ziemię, ale jeśli znajdzie się w nim zło, poniesie śmierć."
"1Krl1,53": "Król Salomon posłał więc, aby go sprowadzono od ołtarza. Kiedy przyszedł, pokłonił się królowi Salomonowi. A powiedział mu Salomon: Idź do swego domu."
