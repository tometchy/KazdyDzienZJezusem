"1Krl1,1":
  text: "Gdy król Dawid zestarzał się i posunął w latach, to choć okrywano go szatami, nie mógł się rozgrzać."
  tags: []
"1Krl1,2":
  text: "Jego słudzy powiedzieli mu więc: Niech poszukają dla naszego pana, króla, młodej dziewicy, która stawałaby przed królem i pielęgnowała go. Niech kładzie się na twoim łonie, żeby nasz pan, król, mógł się rozgrzać."
  tags: []
"1Krl1,3":
  text: "Szukali więc pięknej dziewczyny po wszystkich obszarach Izraela i znaleźli Abiszag Szunamitkę, i przyprowadzili ją do króla."
  tags: []
"1Krl1,4":
  text: "Dziewczyna ta była bardzo piękna; pielęgnowała króla i służyła mu, ale król z nią nie obcował."
  tags: []
"1Krl1,5":
  text: "Lecz Adoniasz, syn Chaggity, wywyższał się, mówiąc: Ja zostanę królem. Zaopatrzył się w rydwany i jeźdźców oraz pięćdziesięciu mężczyzn, którzy biegali przed nim."
  tags: []
"1Krl1,6":
  text: "Jego ojciec nigdy go nie upominał, mówiąc: Czemu to uczyniłeś? Był on też bardzo przystojny, jego matka urodziła go po Absalomie."
  tags: []
"1Krl1,7":
  text: "Porozumiał się z Joabem, synem Serui, i z kapłanem Abiatarem, a oni przystali z Adoniaszem i pomogli mu."
  tags: []
"1Krl1,8":
  text: "Lecz kapłan Sadok, Benajasz, syn Jehojady, prorok Natan, Szimei, Rei oraz dzielni wojownicy Dawida nie sprzyjali Adoniaszowi."
  tags: []
"1Krl1,9":
  text: "Potem Adoniasz zabił owce, woły i tuczne bydło przy kamieniu Zochelet, blisko źródła Rogel, i zaprosił wszystkich swych braci, synów króla, oraz wszystkich mężczyzn Judy, sługi króla."
  tags: []
"1Krl1,10":
  text: "Lecz nie zaprosił proroka Natana, Benajasza i dzielnych wojowników oraz swego brata Salomona."
  tags: []
"1Krl1,11":
  text: "Wtedy Natan zapytał Batszebę, matkę Salomona: Czy nie słyszałaś, że Adoniasz, syn Chaggity, króluje, a nasz pan, Dawid, o tym nie wie?"
  tags: []
"1Krl1,12":
  text: "Chodź więc teraz, proszę, dam ci radę, abyś ocaliła swoje życie i życie swego syna, Salomona."
  tags: []
"1Krl1,13":
  text: "Idź i wejdź do króla Dawida, i powiedz mu: Czyż ty, mój panie, królu, nie przysiągłeś swojej służącej: Twój syn Salomon będzie królował po mnie i on zasiądzie na moim tronie? Dlaczego więc króluje Adoniasz?"
  tags: []
"1Krl1,14":
  text: "A oto gdy ty będziesz tam jeszcze rozmawiała z królem, ja wejdę za tobą i potwierdzę twoje słowa."
  tags: []
"1Krl1,15":
  text: "Batszeba weszła więc do króla do komnaty. Król już się bardzo zestarzał, a Abiszag Szunamitka usługiwała królowi."
  tags: []
"1Krl1,16":
  text: "Wtedy Batszeba uklękła i oddała pokłon królowi, a król zapytał: Czego chcesz?"
  tags: []
"1Krl1,17":
  text: "A ona mu odpowiedziała: Mój panie, ty przysiągłeś swojej służącej na PANA, swego Boga: Twój syn, Salomon, będzie królował po mnie i on zasiądzie na moim tronie."
  tags: []
"1Krl1,18":
  text: "A oto teraz Adoniasz króluje, a ty, mój panie, królu, o tym nie wiesz."
  tags: []
"1Krl1,19":
  text: "Zabił bowiem woły, tuczne bydło i bardzo dużo owiec i zaprosił wszystkich synów króla, kapłana Abiatara oraz dowódcę wojska, Joaba, ale twego sługi Salomona nie zaprosił."
  tags: []
"1Krl1,20":
  text: "Lecz ty, mój panie, królu, wiesz, że oczy całego Izraela są zwrócone na ciebie, abyś im oznajmił, kto zasiądzie na tronie mego pana, króla, po nim."
  tags: []
"1Krl1,21":
  text: "W przeciwnym razie, gdy mój pan, król, zaśnie ze swymi ojcami, ja i mój syn Salomon będziemy uważani za przestępców."
  tags: []
"1Krl1,22":
  text: "A gdy jeszcze rozmawiała z królem, przyszedł prorok Natan."
  tags: []
"1Krl1,23":
  text: "I oznajmiono królowi: Oto prorok Natan. I gdy wszedł przed oblicze króla, pokłonił się królowi twarzą do ziemi."
  tags: []
"1Krl1,24":
  text: "Potem Natan powiedział: Mój panie, królu, czy ty powiedziałeś: Adoniasz będzie królował po mnie i on zasiądzie na moim tronie?"
  tags: []
"1Krl1,25":
  text: "Dziś bowiem zstąpił i zabił woły, tuczne bydło oraz bardzo dużo owiec, i zaprosił wszystkich synów króla, dowódców wojsk oraz kapłana Abiatara, a oto oni jedzą z nim i piją, i mówią: Niech żyje król Adoniasz!"
  tags: []
"1Krl1,26":
  text: "Lecz mnie, twego sługi, i kapłana Sadoka, i Benajasza, syna Jehojady, oraz twego sługi Salomona nie zaprosił."
  tags: []
"1Krl1,27":
  text: "Czy wyszło to od mego pana, króla, a nie oznajmiłeś swemu słudze, kto zasiądzie po nim na tronie mego pana, króla?"
  tags: []
"1Krl1,28":
  text: "Król Dawid odpowiedział: Zawołajcie mi Batszebę. Ta weszła przed oblicze króla i stanęła przed nim."
  tags: []
"1Krl1,29":
  text: "Wtedy król przysiągł: Jak żyje PAN, który wybawił moją duszę z wszelkiego ucisku;"
  tags: []
"1Krl1,30":
  text: "Jak przysiągłem ci na PANA, Boga Izraela: Twój syn Salomon będzie królować po mnie i on zasiądzie na moim tronie zamiast mnie, tak dziś uczynię."
  tags: []
"1Krl1,31":
  text: "Batszeba schyliła się twarzą ku ziemi i pokłoniła się królowi, i powiedziała: Niech żyje mój pan, król Dawid, na wieki!"
  tags: []
"1Krl1,32":
  text: "Potem król Dawid rozkazał: Zawołajcie mi kapłana Sadoka, proroka Natana i Benajasza, syna Jehojady. I tamci weszli przed oblicze króla."
  tags: []
"1Krl1,33":
  text: "A król powiedział im: Weźcie ze sobą sługi waszego pana, wsadźcie mego syna Salomona na moją mulicę i sprowadźcie go do Gichonu."
  tags: []
"1Krl1,34":
  text: "A tam niech kapłan Sadok i prorok Natan namaszczą go na króla nad Izraelem. Następnie zadmijcie w trąbę i powiedzcie: Niech żyje król Salomon!"
  tags: []
"1Krl1,35":
  text: "Potem pójdziecie za nim, a on przyjdzie i zasiądzie na moim tronie, i będzie królował na moje miejsce. Jego bowiem ustanowiłem wodzem nad Izraelem i nad Judą."
  tags: []
"1Krl1,36":
  text: "Benajasz, syn Jehojady, odpowiedział królowi: Amen. Niech to stwierdzi PAN, Bóg mego pana, króla."
  tags: []
"1Krl1,37":
  text: "Jak PAN był z moim panem, królem, tak niech będzie z Salomonem i niech wywyższy jego tron nad tron mego pana, króla Dawida."
  tags: []
"1Krl1,38":
  text: "Poszli więc kapłan Sadok, prorok Natan i Benajasz, syn Jehojady, oraz Keretyci i Peletyci i wsadzili Salomona na mulicę króla Dawida, i zaprowadzili go do Gichonu."
  tags: []
"1Krl1,39":
  text: "Wtedy kapłan Sadok wziął róg olejku z namiotu i namaścił Salomona. Potem zadęto w trąbę, a cały lud powiedział: Niech żyje król Salomon!"
  tags: []
"1Krl1,40":
  text: "I cały lud szedł za nim. Lud także grał na fletach i tak bardzo się radował, że ziemia drżała od jego głosu."
  tags: []
"1Krl1,41":
  text: "I usłyszeli to Adoniasz oraz wszyscy zaproszeni, którzy z nim byli, a właśnie skończyli ucztę. A gdy Joab usłyszał głos trąby, zapytał: Cóż to za krzyk poruszonego miasta?"
  tags: []
"1Krl1,42":
  text: "A gdy on jeszcze mówił, przyszedł Jonatan, syn kapłana Abiatara. Adoniasz powiedział mu: Wejdź, jesteś bowiem dzielnym człowiekiem i przynosisz dobrą nowinę."
  tags: []
"1Krl1,43":
  text: "Wtedy Jonatan odpowiedział Adoniaszowi: Nasz pan, król Dawid, ustanowił królem Salomona."
  tags: []
"1Krl1,44":
  text: "Król bowiem posłał z nim kapłana Sadoka i proroka Natana oraz Benajasza, syna Jehojady, do tego Keretytów i Peletytów, którzy wsadzili go na mulicę króla;"
  tags: []
"1Krl1,45":
  text: "Następnie kapłan Sadok i prorok Natan namaścili go na króla w Gichonie. I wyruszyli stamtąd, tak się radując, że miasto zadrżało. Stąd ten krzyk, który usłyszeliście."
  tags: []
"1Krl1,46":
  text: "A Salomon zasiadł już na tronie królestwa."
  tags: []
"1Krl1,47":
  text: "Ponadto przyszli słudzy króla, aby błogosławić naszemu panu, królowi Dawidowi, mówiąc: Niech Bóg sławniejszym uczyni imię Salomona niż twoje imię i niech wywyższy jego tron ponad twój tron. A król skłonił się na swym łożu."
  tags: []
"1Krl1,48":
  text: "Również sam król powiedział: Błogosławiony niech będzie PAN, Bóg Izraela, który dał dziś zasiadającego na moim tronie, a moje oczy to widzą."
  tags: []
"1Krl1,49":
  text: "Wtedy zlękli się wszyscy zaproszeni, którzy byli z Adoniaszem, i wstali, i poszli każdy swoją drogą."
  tags: []
"1Krl1,50":
  text: "Adoniasz także, bojąc się Salomona, wstał, poszedł i uchwycił się rogów ołtarza."
  tags: []
"1Krl1,51":
  text: "I doniesiono o tym Salomonowi: Oto Adoniasz boi się króla Salomona i uchwycił się rogów ołtarza, mówiąc: Niech mi dziś przysięgnie król Salomon, że nie zabije swego sługi mieczem."
  tags: []
"1Krl1,52":
  text: "Wtedy Salomon odpowiedział: Jeśli okaże się godziwym człowiekiem, nie spadnie mu nawet włos na ziemię, ale jeśli znajdzie się w nim zło, poniesie śmierć."
  tags: []
"1Krl1,53":
  text: "Król Salomon posłał więc, aby go sprowadzono od ołtarza. Kiedy przyszedł, pokłonił się królowi Salomonowi. A powiedział mu Salomon: Idź do swego domu."
  tags: []
