"1Krl10,1":
  text: "A gdy królowa Saby usłyszała o sławie Salomona i o imieniu PANA, przybyła, aby go przez zagadki poddać próbie."
  tags: []
"1Krl10,2":
  text: "Przybyła do Jerozolimy z bardzo wielkim orszakiem, z wielbłądami niosącymi wonności, bardzo dużo złota i drogocenne kamienie. Gdy przyszła do Salomona, rozmawiała z nim o wszystkim, co leżało jej na sercu."
  tags: []
"1Krl10,3":
  text: "Salomon zaś odpowiedział na wszystkie jej pytania. Nie było nic nieznanego królowi, na co nie mógłby jej odpowiedzieć."
  tags: []
"1Krl10,4":
  text: "Gdy więc królowa Saby ujrzała całą mądrość Salomona i dom, który zbudował;"
  tags: []
"1Krl10,5":
  text: "A także potrawy jego stołu, siadanie jego sług, stawanie jego służących, ich szaty, jego podczaszych oraz schody, po których wstępował do domu PANA, dech zamarł jej w piersi;"
  tags: []
"1Krl10,6":
  text: "Wtedy przemówiła do króla: Prawdziwa była ta wieść, którą słyszałam w swojej ziemi o twoich dziełach i twojej mądrości."
  tags: []
"1Krl10,7":
  text: "Jednak nie wierzyłam tym słowom, aż przybyłam i zobaczyłam to na własne oczy. I oto nie powiedziano mi nawet połowy. Twoja mądrość i twój dobrobyt są większe od sławy, o której słyszałam."
  tags: []
"1Krl10,8":
  text: "Błogosławieni twoi ludzie, błogosławieni twoi słudzy, którzy zawsze stoją przed tobą i słuchają twojej mądrości."
  tags: []
"1Krl10,9":
  text: "Niech będzie błogosławiony PAN, twój Bóg, który cię sobie upodobał, aby cię posadzić na tronie Izraela; a ponieważ PAN umiłował Izraela na wieki, ustanowił cię królem, abyś czynił sąd i sprawiedliwość."
  tags: []
"1Krl10,10":
  text: "Następnie dała królowi sto dwadzieścia talentów złota i bardzo wiele wonności oraz drogocennych kamieni. Nigdy więcej nie przyniesiono tyle wonności, ile królowi Salomonowi dała królowa Saby."
  tags: []
"1Krl10,11":
  text: "Ponadto okręty Hirama, które przywoziły złoto z Ofiru, przywiozły także z Ofiru wielką ilość drewna sandałowego i drogocennych kamieni."
  tags: []
"1Krl10,12":
  text: "Z tego drzewa sandałowego król wykonał schody do domu PANA i do domu królewskiego oraz harfy i cytry dla śpiewaków. Nigdy nie sprowadzono takiego drzewa sandałowego i nie widziano aż do dziś."
  tags: []
"1Krl10,13":
  text: "Król Salomon zaś dał królowej Saby wszystko, czego zapragnęła i o co poprosiła, nie licząc tego, co jej dał ze swojej królewskiej hojności. Potem odjechała i wróciła do swojej ziemi razem ze swoimi sługami."
  tags: []
"1Krl10,14":
  text: "A waga złota, które wpływało do Salomona w ciągu jednego roku, wynosiła sześćset sześćdziesiąt sześć talentów złota;"
  tags: []
"1Krl10,15":
  text: "Nie licząc tego, co dostawał od kupców i handlarzy wonności, i od wszystkich królów arabskich oraz namiestników ziemi."
  tags: []
"1Krl10,16":
  text: "Król Salomon wykonał więc dwieście tarcz z kutego złota. Na każdą tarczę wychodziło sześćset syklów złota."
  tags: []
"1Krl10,17":
  text: "Wykonał także trzysta puklerzy z kutego złota, używając po trzy miny złota na każdy puklerz. Król umieścił je w domu lasu Libanu."
  tags: []
"1Krl10,18":
  text: "Król również sporządził wielki tron z kości słoniowej i pokrył go czystym złotem."
  tags: []
"1Krl10,19":
  text: "Tron miał sześć stopni i okrągły szczyt z tyłu. Po obu stronach siedzenia były poręcze, a przy poręczach stały dwa lwy."
  tags: []
"1Krl10,20":
  text: "Dwanaście lwów stało na tych sześciu stopniach po obu stronach. Czegoś takiego nie uczyniono w żadnym innym królestwie."
  tags: []
"1Krl10,21":
  text: "Wszystkie naczynia, których król Salomon używał do picia, były ze złota, a także wszystkie naczynia domu lasu Libanu były ze szczerego złota. Nie było nic ze srebra, gdyż nie uważano go za cenne w czasach Salomona."
  tags: []
"1Krl10,22":
  text: "Królewska flota Tarszisz była bowiem na morzu wraz z flotą Hirama. Raz na trzy lata przypływała flota Tarszisz, przywożąc złoto, srebro, kość słoniową, małpy i pawie."
  tags: []
"1Krl10,23":
  text: "Tak więc król Salomon przewyższał wszystkich królów ziemi bogactwem i mądrością."
  tags: []
"1Krl10,24":
  text: "I cała ziemia pragnęła zobaczyć Salomona, aby słuchać jego mądrości, którą Bóg włożył w jego serce."
  tags: []
"1Krl10,25":
  text: "Każdy przynosił mu swoje dary: srebrne i złote naczynia, szaty, zbroje, wonności, konie i muły, rokrocznie."
  tags: []
"1Krl10,26":
  text: "Salomon nagromadził rydwanów i jeźdźców, tak że miał tysiąc czterysta rydwanów i dwanaście tysięcy jeźdźców, których rozmieścił po miastach rydwanów oraz przy sobie w Jerozolimie."
  tags: []
"1Krl10,27":
  text: "Król sprawił, że srebro w Jerozolimie było jak kamienie, a cedry tak liczne jak sykomory na nizinie."
  tags: []
"1Krl10,28":
  text: "Sprowadzono też dla Salomona konie z Egiptu i nić lnianą. A kupcy królewscy brali nić lnianą za ustaloną cenę."
  tags: []
"1Krl10,29":
  text: "Rydwan wywożono i sprowadzono z Egiptu za sześćset srebrników, a konia – za sto pięćdziesiąt. W ten sposób wszyscy królowie chetyccy i królowie Syrii dostawali je za ich pośrednictwem."
  tags: []
