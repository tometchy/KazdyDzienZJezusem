"1Krl19,1":
  text: "Wtedy Achab opowiedział Jezabel o wszystkim, co Eliasz uczynił, oraz o tym, jak zabił mieczem wszystkich proroków."
  tags: []
"1Krl19,2":
  text: "Jezabel wysłała więc posłańca do Eliasza ze słowami: Niech to mi uczynią bogowie i tamto dorzucą, jeśli jutro o tym czasie twojego życia nie uczynię takim jak życie jednego z nich."
  tags: []
"1Krl19,3":
  text: "Kiedy to zrozumiał, wstał i odszedł, aby ocalić swoje życie. Przybył do Beer-Szeby, która należy do Judy, i zostawił tam swego sługę."
  tags: []
"1Krl19,4":
  text: "A sam poszedł na pustynię na jeden dzień drogi, a gdy tam doszedł, usiadł pod jałowcem i życzył sobie śmierci, mówiąc: Dosyć już, PANIE. Zabierz moją duszę, bo nie jestem lepszy od swoich ojców."
  tags: []
"1Krl19,5":
  text: "Potem położył się i zasnął pod tym jałowcem. A wtedy Anioł dotknął go i powiedział mu: Wstań i jedz."
  tags: []
"1Krl19,6":
  text: "A gdy spojrzał, oto przy jego głowie leżał placek pieczony na węgielkach i dzban wody. Jadł więc i pił, i znowu się położył."
  tags: []
"1Krl19,7":
  text: "Anioł PANA wrócił ponownie, dotknął go i powiedział: Wstań i jedz, bo masz przed sobą daleką drogę."
  tags: []
"1Krl19,8":
  text: "Wstał więc i jadł, i pił, i szedł dzięki mocy tego pokarmu czterdzieści dni i czterdzieści nocy aż do Horebu, góry Boga."
  tags: []
"1Krl19,9":
  text: "Tam wszedł do jaskini, gdzie przenocował. A oto słowo PANA doszło do niego: Co tu robisz, Eliaszu?"
  tags: []
"1Krl19,10":
  text: "Odpowiedział: Byłem bardzo gorliwy względem PANA, Boga zastępów. Synowie Izraela bowiem porzucili twoje przymierze, zburzyli twoje ołtarze i pomordowali mieczem twoich proroków. Ja sam tylko pozostałem i szukają mojej duszy, aby mi ją odebrać."
  tags: []
"1Krl19,11":
  text: "Wtedy on powiedział: Wyjdź, stań na górze przed PANEM. A oto PAN przechodził, a potężny i gwałtowny wiatr rozrywał góry i kruszył skały przed PANEM, ale PAN nie był w tym wietrze. Po wietrze było trzęsienie ziemi, ale PAN nie był i w tym trzęsieniu ziemi."
  tags: []
"1Krl19,12":
  text: "Po trzęsieniu ziemi był ogień, ale PAN nie był w ogniu. A po tym ogniu był cichy i delikatny głos."
  tags: []
"1Krl19,13":
  text: "Gdy Eliasz go usłyszał, zasłonił płaszczem swoją twarz, wyszedł i stanął u wejścia do jaskini. A oto głos przemówił do niego: Co tu robisz, Eliaszu?"
  tags: []
"1Krl19,14":
  text: "A on odpowiedział: Byłem bardzo gorliwy względem PANA, Boga zastępów. Synowie Izraela bowiem porzucili twoje przymierze, zburzyli twoje ołtarze i pomordowali mieczem twoich proroków. Ja sam tylko pozostałem i szukają mojej duszy, aby mi ją odebrać."
  tags: []
"1Krl19,15":
  text: "Ale PAN powiedział do niego: Idź, wróć tą samą drogą na pustynię Damaszku. A kiedy tam przybędziesz, namaścisz Chazaela na króla nad Syrią."
  tags: []
"1Krl19,16":
  text: "A Jehu, syna Nimsziego, namaścisz na króla nad Izraelem. Elizeusza zaś, syna Szafata, z Abel-Mechola, namaścisz na proroka po tobie."
  tags: []
"1Krl19,17":
  text: "I stanie się tak, że ktokolwiek uniknie miecza Chazaela, tego zabije Jehu, a ktokolwiek uniknie miecza Jehu, tego zabije Elizeusz."
  tags: []
"1Krl19,18":
  text: "Jednak zachowałem sobie w Izraelu siedem tysięcy, których kolana nie zginały się przed Baalem i których usta nie całowały go."
  tags: []
"1Krl19,19":
  text: "Odszedł więc stamtąd i znalazł Elizeusza, syna Szafata, gdy orał. Dwanaście zaprzęgów wołów szło przed nim, a on był przy dwunastym. Eliasz przeszedł obok niego i wrzucił na niego swój płaszcz."
  tags: []
"1Krl19,20":
  text: "Wtedy opuścił woły, pobiegł za Eliaszem i powiedział: Pozwól mi ucałować swego ojca i swoją matkę, a pójdę za tobą. Odpowiedział: Idź, wróć. Cóż bowiem ci uczyniłem?"
  tags: []
"1Krl19,21":
  text: "Odszedł więc od niego, wziął zaprzęg wołów i zabił je. A na sprzęcie tych wołów ugotował ich mięso i dał ludowi, a oni jedli. Potem wstał i poszedł za Eliaszem, i służył mu."
  tags: []
