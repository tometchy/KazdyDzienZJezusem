"1Krl20,1":
  text: "Wtedy Ben-Hadad, król Syrii, zebrał całe swoje wojsko, a było z nim trzydziestu dwóch królów, konie i rydwany. Wyruszył, obległ Samarię i walczył przeciwko niej."
  tags: []
"1Krl20,2":
  text: "I wyprawił posłańców do Achaba, króla Izraela, do miasta, i powiedział mu: Tak mówi Ben-Hadad:"
  tags: []
"1Krl20,3":
  text: "Twoje srebro i złoto są moje; także twoje żony i twoi najpiękniejsi synowie są moi."
  tags: []
"1Krl20,4":
  text: "Król Izraela odpowiedział: Według twego słowa, królu, mój panie – twój jestem ja i wszystko, co mam."
  tags: []
"1Krl20,5":
  text: "Potem posłańcy wrócili do niego i powiedzieli: Tak powiedział Ben-Hadad: Wprawdzie posłałem do ciebie ludzi, aby ci powiedzieli: Oddasz swoje srebro i złoto, swoje żony i swoich synów oddasz mi."
  tags: []
"1Krl20,6":
  text: "Jednak jutro o tej porze poślę swoje sługi do ciebie. Oni przeszukają twój dom i domy twoich sług, a wszystko, co jest cenne w twoich oczach, wezmą w ręce i zabiorą."
  tags: []
"1Krl20,7":
  text: "Król Izraela zwołał więc wszystkich starszych ziemi i powiedział im: Rozważcie, proszę, i zobaczcie, że ten człowiek szuka nieszczęścia. Posłał bowiem do mnie po moje żony i moich synów, po moje srebro i złoto, a nie odmówiłem mu."
  tags: []
"1Krl20,8":
  text: "Wszyscy starsi i cały lud odpowiedzieli: Nie słuchaj go i nie gódź się."
  tags: []
"1Krl20,9":
  text: "Odpowiedział więc posłom Ben-Hadada: Powiedzcie królowi, memu panu: Wszystko, czego na początku żądałeś od swego sługi, uczynię. Lecz tej rzeczy nie mogę uczynić. Posłańcy odeszli i zanieśli mu odpowiedź."
  tags: []
"1Krl20,10":
  text: "Ben-Hadad znowu posłał do niego sługi i powiedział: Niech mi to uczynią bogowie i tamto dorzucą, jeśli starczy prochu Samarii po pełnej garści dla każdego spośród całego ludu, który idzie za mną."
  tags: []
"1Krl20,11":
  text: "Król Izraela odpowiedział: Powiedzcie mu: Niech się nie chlubi ten, kto zapina pas, jak ten, kto go odpina."
  tags: []
"1Krl20,12":
  text: "A gdy Ben-Hadad usłyszał to słowo – a właśnie pił z królami w namiotach – powiedział do swoich sług: Ruszajcie. I ruszyli na miasto."
  tags: []
"1Krl20,13":
  text: "A oto pewien prorok przyszedł do Achaba, króla Izraela, i powiedział: Tak mówi PAN: Czy widzisz cały ten wielki tłum? Oto wydam go dziś w twoje ręce, abyś wiedział, że ja jestem PANEM."
  tags: []
"1Krl20,14":
  text: "Wtedy Achab zapytał: Przez kogo? Odpowiedział: Tak mówi PAN: Przez sługi książąt prowincji. Zapytał dalej: Kto rozpocznie bitwę? Odpowiedział mu: Ty."
  tags: []
"1Krl20,15":
  text: "Dokonał więc przeglądu sług książąt prowincji i było ich dwustu trzydziestu dwóch. A po nich policzył cały lud, wszystkich synów Izraela, i było ich siedem tysięcy."
  tags: []
"1Krl20,16":
  text: "I wyruszyli w południe. A Ben-Hadad oddawał się pijaństwu w namiotach, a z nim trzydziestu dwóch królów, którzy go wspierali."
  tags: []
"1Krl20,17":
  text: "Wyszli więc jako pierwsi słudzy książąt prowincji. Gdy Ben-Hadad posłał sługę, powiedziano mu: Ludzie wyszli z Samarii."
  tags: []
"1Krl20,18":
  text: "Polecił: Jeśli wyszli prosić o pokój, pojmijcie ich żywych, również jeśli wyszli walczyć, pojmijcie ich żywych."
  tags: []
"1Krl20,19":
  text: "Wyszli więc z miasta słudzy książąt prowincji oraz wojsko razem z nimi."
  tags: []
"1Krl20,20":
  text: "A każdy pokonał swego przeciwnika, tak że Syryjczycy uciekli, a Izrael ich ścigał. Ben-Hadad, król Syrii, również uciekł na koniu i z jeźdźcami."
  tags: []
"1Krl20,21":
  text: "Potem król Izraela wyruszył i pobił konie i rydwany, a zadał Syryjczykom wielką klęskę."
  tags: []
"1Krl20,22":
  text: "Prorok znowu przyszedł do króla Izraela i powiedział mu: Idź, wzmocnij się, rozważ i zastanów się, co masz czynić. Po roku bowiem król Syrii nadciągnie przeciwko tobie."
  tags: []
"1Krl20,23":
  text: "Wtedy słudzy króla Syrii powiedzieli do niego: Ich bogowie są bogami gór, dlatego nas pokonali. Walczmy jednak z nimi na równinie i na pewno ich pokonamy."
  tags: []
"1Krl20,24":
  text: "Tak więc uczyń: Usuń każdego z królów z jego stanowiska, a na ich miejsce ustanów dowódców."
  tags: []
"1Krl20,25":
  text: "Następnie odlicz sobie wojska takiego jak to wojsko, które ci poległo, koni jak tamte konie i rydwanów jak tamte rydwany. Wtedy stoczymy z nimi bitwę na równinie i na pewno ich pokonamy. I posłuchał ich głosu, i tak uczynił."
  tags: []
"1Krl20,26":
  text: "A gdy upłynął rok, Ben-Hadad dokonał przeglądu Syryjczyków i nadciągnął do Afek, aby walczyć z Izraelem."
  tags: []
"1Krl20,27":
  text: "Również u synów Izraela dokonano przeglądu, a gdy się zebrali, wyruszyli przeciwko nim. I synowie Izraela rozbili obóz przed nimi jak dwa małe stadka kóz. Syryjczycy zaś napełnili ziemię."
  tags: []
"1Krl20,28":
  text: "Wtedy przyszedł mąż Boży i mówił do króla Izraela: Tak mówi PAN: Ponieważ Syryjczycy powiedzieli: PAN jest Bogiem gór, a nie jest Bogiem równin, wydam cały ten wielki tłum w twoje ręce, abyście wiedzieli, że ja jestem PANEM."
  tags: []
"1Krl20,29":
  text: "Obozowali jedni naprzeciw drugich przez siedem dni. A siódmego dnia stoczyli bitwę i synowie Izraela pobili w jednym dniu sto tysięcy pieszych spośród Syryjczyków."
  tags: []
"1Krl20,30":
  text: "Pozostali zaś uciekli do Afek, do miasta, i runął mur na dwadzieścia siedem tysięcy pozostałych mężczyzn. Ben-Hadad uciekł i wszedł do miasta, gdzie ukrył się w wewnętrznej komnacie."
  tags: []
"1Krl20,31":
  text: "Wtedy jego słudzy powiedzieli mu: Oto słyszeliśmy, że królowie domu Izraela są królami miłosiernymi. Pozwól, proszę, że włożymy wory na nasze biodra, powrozy na nasze głowy i wyjdziemy do króla Izraela, może zostawi nas przy życiu."
  tags: []
"1Krl20,32":
  text: "Opasali więc worami swoje biodra, włożyli powrozy na swoje głowy, przyszli do króla Izraela i powiedzieli: Ben-Hadad, twój sługa, mówi: Proszę, zachowaj moją duszę przy życiu. Zapytał: Czy jeszcze żyje? To jest mój brat."
  tags: []
"1Krl20,33":
  text: "Ci ludzie wzięli to za dobry znak i szybko podchwycili to słowo od niego, i powiedzieli: Twój brat Ben-Hadad. On zaś powiedział: Idźcie i przyprowadźcie go. Ben-Hadad wyszedł więc do niego i kazał mu wsiąść na rydwan."
  tags: []
"1Krl20,34":
  text: "Ben-Hadad powiedział do niego: Miasta, które mój ojciec zabrał twemu ojcu, zwrócę, a ty uczynisz sobie ulice w Damaszku, jak uczynił mój ojciec w Samarii. I odpowiedział: Puszczę cię wolno na podstawie tego przymierza. Tak więc zawarł z nim przymierze i puścił go wolno."
  tags: []
"1Krl20,35":
  text: "Wtedy pewien mąż spośród synów proroków powiedział do swego bliźniego na słowo PANA: Uderz mnie, proszę. Ale ten człowiek nie chciał go uderzyć."
  tags: []
"1Krl20,36":
  text: "I powiedział mu: Ponieważ nie posłuchałeś głosu PANA, oto gdy tylko odejdziesz ode mnie, zabije cię lew. A gdy odszedł od niego, spotkał go lew i zabił go."
  tags: []
"1Krl20,37":
  text: "Potem spotkał drugiego mężczyznę i powiedział mu: Uderz mnie, proszę. Człowiek ten tak go uderzył, że go zranił."
  tags: []
"1Krl20,38":
  text: "Prorok poszedł więc i czekał na króla na drodze, i zmienił swój wygląd dzięki zasłonie na twarzy."
  tags: []
"1Krl20,39":
  text: "A gdy król przejeżdżał, zawołał do króla: Twój sługa wszedł w sam środek bitwy, a oto podszedł pewien mężczyzna i przyprowadził do mnie człowieka, i powiedział: Pilnuj tego człowieka. Jeśli ci się wymknie, zapłacisz swoim życiem za jego życie albo zapłacisz talent srebra."
  tags: []
"1Krl20,40":
  text: "A gdy twój sługa zajął się tym i owym, on zniknął. Król Izraela powiedział do niego: Taki jest twój wyrok, ty sam rozstrzygnąłeś tę sprawę."
  tags: []
"1Krl20,41":
  text: "Wtedy on szybko zdjął zasłonę z twarzy i król Izraela rozpoznał, że jest on jednym z proroków."
  tags: []
"1Krl20,42":
  text: "I powiedział do niego: Tak mówi PAN: Ponieważ wypuściłeś ze swojej ręki człowieka przeznaczonego na śmierć, swoim życiem zapłacisz za jego życie i swoim ludem za jego lud."
  tags: []
"1Krl20,43":
  text: "Król Izraela odszedł więc do swego domu smutny i rozgniewany i przybył do Samarii."
  tags: []
