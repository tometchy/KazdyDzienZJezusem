"1Krl3,1": "I Salomon spowinowacił się z faraonem, królem Egiptu. Pojął bowiem za żonę córkę faraona i przyprowadził ją do miasta Dawida, zanim skończył budować swój dom i dom PANA oraz mur dokoła Jerozolimy."
"1Krl3,2": "Lud jednak składał ofiary na wyżynach, dlatego że do tego czasu nie został jeszcze zbudowany dom dla imienia PANA."
"1Krl3,3": "I Salomon miłował PANA, postępując zgodnie z przykazaniami Dawida, swego ojca, tylko że składał ofiary i spalał kadzidło na wyżynach."
"1Krl3,4": "Król udał się więc do Gibeonu, aby tam złożyć ofiary, bo tam była wielka wyżyna. Na tym ołtarzu Salomon złożył tysiąc ofiar całopalnych."
"1Krl3,5": "W Gibeonie PAN ukazał się Salomonowi w nocy we śnie. Bóg powiedział: Proś o to, co mam ci dać."
"1Krl3,6": "Salomon odpowiedział: Ty okazałeś swemu słudze Dawidowi, memu ojcu, wielkie miłosierdzie, gdyż postępował przed tobą w prawdzie, sprawiedliwości i prawości serca przy tobie. I zachowałeś dla niego tę wielką łaskę, że dałeś mu syna, który zasiadł na jego tronie, jak to się dzieje dziś."
"1Krl3,7": "Teraz więc, o PANIE, mój Boże, ty ustanowiłeś swego sługę królem w miejsce Dawida, mego ojca, a ja jestem małym dzieckiem i nie wiem, jak wyruszać ani jak wracać."
"1Krl3,8": "Twój sługa jest wśród twego ludu, który wybrałeś, ludu wielkiego, którego z powodu wielkiej liczby nie można zliczyć ani spisać."
"1Krl3,9": "Daj więc swemu słudze serce rozumne, aby mógł sądzić twój lud i rozróżniać między dobrem a złem. Któż bowiem może sądzić ten twój tak wielki lud?"
"1Krl3,10": "I spodobało się to PANU, że Salomon o to poprosił."
"1Krl3,11": "Wtedy Bóg powiedział do niego: Ponieważ poprosiłeś o to, a nie poprosiłeś dla siebie o długie życie ani nie poprosiłeś dla siebie o bogactwo, ani też nie poprosiłeś o wytracenie swoich wrogów, ale poprosiłeś dla siebie o rozum dla rozróżnienia w sprawach sądowych;"
"1Krl3,12": "Oto uczyniłem według twoich słów: Dałem ci serce mądre i rozumne, tak że podobnego tobie nie było przed tobą ani po tobie nie powstanie nikt jak ty."
"1Krl3,13": "Dam ci także to, o co nie prosiłeś, a więc bogactwo i sławę, tak że wśród królów nie będzie nikogo równego tobie po wszystkie twoje dni."
"1Krl3,14": "A jeśli będziesz chodził moimi drogami, przestrzegając moich ustaw i przykazań, jak postępował Dawid, twój ojciec, wtedy przedłużę twoje dni."
"1Krl3,15": "A gdy Salomon obudził się, zrozumiał, że to był sen. Wrócił więc do Jerozolimy, stanął przed arką przymierza PANA i złożył całopalenia i ofiary pojednawcze oraz wyprawił ucztę wszystkim swoim sługom."
"1Krl3,16": "Wtedy przyszły do króla dwie kobiety, nierządnice, i stanęły przed nim."
"1Krl3,17": "Jedna z kobiet powiedziała: Proszę cię, mój panie, ja i ta kobieta mieszkamy w jednym domu. Ja urodziłam przy niej w tym domu."
"1Krl3,18": "A trzeciego dnia po moim porodzie urodziła również ta kobieta. I byłyśmy razem, nie było z nami nikogo innego w domu; tylko my dwie byłyśmy w tym domu."
"1Krl3,19": "W nocy umarł syn tej kobiety, ponieważ przygniotła go."
"1Krl3,20": "Wstała więc o północy, wzięła mego syna od mego boku, gdy twoja służąca spała, i położyła go na swym łonie, a swego zmarłego syna położyła na moim łonie."
"1Krl3,21": "Kiedy wstałam rano, aby nakarmić swego syna piersią, oto był martwy. Lecz gdy przyjrzałam się rano, zobaczyłam, że to nie był mój syn, którego urodziłam."
"1Krl3,22": "Wtedy druga kobieta odezwała się: Nie! Moim synem jest ten żywy, a twoim synem jest ten umarły. Lecz tamta powiedziała: Nie! Twoim synem jest ten umarły, a moim synem jest ten żywy. I tak się spierały przed królem."
"1Krl3,23": "Wtedy król powiedział: Ta mówi: Ten żywy jest moim synem, a twoim synem ten umarły, a tamta mówi: Nie tak – twoim synem jest ten umarły, a moim synem jest ten żywy."
"1Krl3,24": "Król powiedział więc: Przynieście mi miecz. I przyniesiono miecz przed króla."
"1Krl3,25": "Wtedy król powiedział: Rozetnijcie żywe dziecko na dwoje i dajcie połowę jednej i połowę drugiej."
"1Krl3,26": "Lecz kobieta, do której należał żywy syn, zdjęta litością nad swoim synem, powiedziała do króla: Proszę, mój panie, dajcie jej to żywe dziecko, tylko nie zabijajcie go! Lecz druga powiedziała: Niech nie będzie ani moje, ani twoje, rozetnijcie je."
"1Krl3,27": "Wtedy król odpowiedział: Dajcie jej żywe dziecko, a nie zabijajcie go. Ona jest jego matką."
"1Krl3,28": "A kiedy cały lud Izraela usłyszał o tym wyroku, który wydał król, bał się króla. Widzieli bowiem, że jest w nim mądrość Boża do sprawowania sądu."
