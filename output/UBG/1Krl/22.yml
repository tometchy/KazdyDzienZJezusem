"1Krl22,1":
  text: "A przez trzy lata nie było wojny między Syrią a Izraelem."
  tags: []
"1Krl22,2":
  text: "I w trzecim roku Jehoszafat, król Judy, przyjechał do króla Izraela."
  tags: []
"1Krl22,3":
  text: "Wtedy król Izraela powiedział do swoich sług: Czy wiecie, że Ramot-Gilead należy do nas? A my zwlekamy z odebraniem go z ręki króla Syrii."
  tags: []
"1Krl22,4":
  text: "Zapytał więc Jehoszafata: Czy wyruszysz ze mną na wojnę do Ramot-Gilead? Jehoszafat odpowiedział królowi Izraela: Ja tak, jak i ty, mój lud tak, jak i twój lud, moje konie, jak i twoje konie."
  tags: []
"1Krl22,5":
  text: "Jehoszafat powiedział jeszcze królowi Izraela: Zapytaj dziś, proszę, o słowo PANA."
  tags: []
"1Krl22,6":
  text: "Król Izraela zebrał więc około czterystu proroków i zapytał ich: Czy mam wyruszyć na wojnę do Ramot-Gilead, czy mam tego zaniechać? Odpowiedzieli mu: Wyrusz, bo PAN wyda je w ręce króla."
  tags: []
"1Krl22,7":
  text: "Ale Jehoszafat zapytał: Czy nie ma tu jeszcze jakiegoś proroka PANA, abyśmy mogli go zapytać?"
  tags: []
"1Krl22,8":
  text: "Król Izraela odpowiedział Jehoszafatowi: Jest jeszcze jeden człowiek, przez którego moglibyśmy radzić się PANA, ale ja go nienawidzę, bo nie prorokuje mi nic dobrego, tylko to, co złe. Jest to Micheasz, syn Jimli. Jehoszafat powiedział: Niech król tak nie mówi."
  tags: []
"1Krl22,9":
  text: "Wtedy król Izraela zawołał pewnego dworzanina i polecił mu: Przyprowadź tu szybko Micheasza, syna Jimli."
  tags: []
"1Krl22,10":
  text: "Tymczasem król Izraela i Jehoszafat, król Judy, siedzieli na swoich tronach ubrani w królewskie szaty na placu przed wejściem do bramy Samarii, a przed nimi prorokowali wszyscy prorocy."
  tags: []
"1Krl22,11":
  text: "A Sedekiasz, syn Kenaany, sporządził sobie żelazne rogi i powiedział: Tak mówi PAN: Nimi będziesz bódł Syryjczyków, aż ich wytępisz."
  tags: []
"1Krl22,12":
  text: "Tak samo prorokowali wszyscy prorocy, mówiąc: Wyrusz do Ramot-Gilead, a poszczęści ci się. PAN bowiem wyda je w ręce króla."
  tags: []
"1Krl22,13":
  text: "Wtedy posłaniec, który poszedł, aby przywołać Micheasza, powiedział do niego: Oto teraz słowa proroków jednomyślnie przekazują królowi to, co dobre. Niech twoje słowo, proszę, będzie jak słowo jednego z nich i mów to, co dobre."
  tags: []
"1Krl22,14":
  text: "Micheasz odpowiedział: Jak żyje PAN, będę mówił to, co PAN mi powie."
  tags: []
"1Krl22,15":
  text: "A gdy przyszedł do króla, król powiedział do niego: Micheaszu, czy mamy wyruszyć na wojnę do Ramot-Gilead, czy mamy tego zaniechać? Odpowiedział: Wyrusz, a poszczęści ci się. PAN bowiem wyda je w ręce króla."
  tags: []
"1Krl22,16":
  text: "I król powiedział do niego: Ileż razy mam cię zaprzysięgać, abyś mi nie mówił nic innego jak tylko prawdę w imieniu PANA?"
  tags: []
"1Krl22,17":
  text: "Powiedział więc: Widziałem całego Izraela rozproszonego po górach jak owce niemające pasterza. A PAN powiedział: Oni nie mają pana. Niech każdy wraca do swego domu w pokoju."
  tags: []
"1Krl22,18":
  text: "Wtedy król Izraela powiedział do Jehoszafata: Czy nie mówiłem ci, że nie będzie mi prorokować nic dobrego, tylko to, co złe?"
  tags: []
"1Krl22,19":
  text: "Tamten powiedział: Słuchaj więc słowa PANA: Widziałem PANA siedzącego na swoim tronie, a wszystkie zastępy niebieskie stojące po jego prawicy i lewicy."
  tags: []
"1Krl22,20":
  text: "I PAN zapytał: Kto zwiedzie Achaba, aby wyruszył do Ramot-Gilead i poległ tam? I jeden mówił tak, a drugi inaczej."
  tags: []
"1Krl22,21":
  text: "Wtedy wystąpił duch i stanął przed PANEM, mówiąc: Ja go zwiodę. PAN go zapytał: Jak?"
  tags: []
"1Krl22,22":
  text: "Odpowiedział: Wyjdę i będę duchem kłamliwym w ustach wszystkich jego proroków. PAN mu powiedział: Zwiedziesz go, na pewno ci się uda. Idź i tak uczyń."
  tags: []
"1Krl22,23":
  text: "Teraz więc PAN włożył ducha kłamliwego w usta tych wszystkich twoich proroków, gdyż PAN zapowiedział ci nieszczęście."
  tags: []
"1Krl22,24":
  text: "Wtedy Sedekiasz, syn Kenaany, podszedł do Micheasza i uderzył go w policzek, mówiąc: Którędy odszedł ode mnie Duch PANA, aby mówić z tobą?"
  tags: []
"1Krl22,25":
  text: "Micheasz odpowiedział: Ty sam to zobaczysz tego dnia, kiedy wejdziesz do najskrytszej komnaty, aby się ukryć."
  tags: []
"1Krl22,26":
  text: "Król Izraela powiedział: Weź Micheasza i zaprowadź go do Amona, namiestnika miasta, i do Joasza, syna króla."
  tags: []
"1Krl22,27":
  text: "I powiesz: Tak mówi król: Wtrąćcie tego człowieka do więzienia i żywcie go chlebem utrapienia i wodą ucisku, aż wrócę w pokoju."
  tags: []
"1Krl22,28":
  text: "Ale Micheasz odpowiedział: Jeśli rzeczywiście wrócisz w pokoju, to PAN nie mówił przeze mnie. I dodał: Słuchajcie wszyscy ludzie."
  tags: []
"1Krl22,29":
  text: "Tak więc król Izraela i Jehoszafat, król Judy, wyruszyli do Ramot-Gilead."
  tags: []
"1Krl22,30":
  text: "I król Izraela powiedział do Jehoszafata: Przebiorę się i pójdę na bitwę, ty zaś ubierz się w swoje szaty. Następnie król Izraela przebrał się i poszedł na bitwę."
  tags: []
"1Krl22,31":
  text: "A król Syrii rozkazał swoim trzydziestu dwom dowódcom rydwanów: Nie walczcie ani z małym, ani z wielkim, tylko z samym królem Izraela."
  tags: []
"1Krl22,32":
  text: "A gdy dowódcy rydwanów zobaczyli Jehoszafata, powiedzieli: Na pewno on jest królem Izraela. I zwrócili się przeciwko niemu, aby z nim walczyć, ale Jehoszafat wydał okrzyk."
  tags: []
"1Krl22,33":
  text: "Kiedy dowódcy rydwanów zobaczyli, że on nie jest królem Izraela, odstąpili od niego."
  tags: []
"1Krl22,34":
  text: "A pewien mężczyzna na ślepo naciągnął łuk i ugodził króla Izraela między spojenia pancerza. A ten powiedział swojemu woźnicy: Zawróć i wywieź mnie z pola bitwy, bo jestem ranny."
  tags: []
"1Krl22,35":
  text: "I bitwa wzmogła się tego dnia. Król stał w rydwanie naprzeciw Syryjczyków i wieczorem umarł, a krew spływała z jego rany na dno rydwanu."
  tags: []
"1Krl22,36":
  text: "O zachodzie słońca w obozie wydano rozkaz: Każdy do swego miasta i każdy do swojej ziemi."
  tags: []
"1Krl22,37":
  text: "Tak więc król umarł i przywieziono go do Samarii, i pogrzebano go w Samarii."
  tags: []
"1Krl22,38":
  text: "A gdy myto rydwan w sadzawce Samarii, psy lizały jego krew, myto także jego zbroję, według słowa PANA, które zapowiedział."
  tags: []
"1Krl22,39":
  text: "A pozostałe sprawy Achaba i wszystko, co uczynił, oraz dom z kości słoniowej, który wzniósł, a także wszystkie miasta, które zbudował – czy nie są opisane w kronikach królów Izraela?"
  tags: []
"1Krl22,40":
  text: "I Achab zasnął ze swymi ojcami, a królował jego syn Achazjasz w jego miejsce."
  tags: []
"1Krl22,41":
  text: "A Jehoszafat, syn Asy, zaczął królować nad Judą w czwartym roku Achaba, króla Izraela."
  tags: []
"1Krl22,42":
  text: "Jehoszafat miał trzydzieści pięć lat, gdy zaczął królować, a dwadzieścia pięć lat królował w Jerozolimie. Jego matka miała na imię Azuba i była córką Szilchiego."
  tags: []
"1Krl22,43":
  text: "I szedł wszystkimi drogami Asy, swego ojca, i nie zboczył z nich, czyniąc to, co było dobre w oczach PANA. Jednak wyżyn nie usunięto. Lud bowiem jeszcze składał ofiary i palił kadzidło na wyżynach."
  tags: []
"1Krl22,44":
  text: "Jehoszafat także zawarł pokój z królem Izraela."
  tags: []
"1Krl22,45":
  text: "A pozostałe sprawy Jehoszafata i jego potęga, którą pokazywał, i to, jak walczył – czyż nie są zapisane w kronikach królów Judy?"
  tags: []
"1Krl22,46":
  text: "Usunął też z ziemi resztę sodomitów, którzy pozostali za dni Asy, jego ojca."
  tags: []
"1Krl22,47":
  text: "W tym czasie nie było króla w Edomie. Królem był namiestnik."
  tags: []
"1Krl22,48":
  text: "Jehoszafat zbudował okręty Tarszisz, aby płynęły do Ofiru po złoto. Lecz nie dopłynęły, bo okręty rozbiły się w Esjon-Geber."
  tags: []
"1Krl22,49":
  text: "Wtedy Achazjasz, syn Achaba, powiedział do Jehoszafata: Niech moi słudzy płyną na okrętach z twoimi sługami. Ale Jehoszafat nie chciał."
  tags: []
"1Krl22,50":
  text: "I Jehoszafat zasnął ze swymi ojcami, i został pogrzebany wraz z nimi w mieście Dawida, swego ojca. W jego miejsce królował jego syn Joram."
  tags: []
"1Krl22,51":
  text: "Achazjasz, syn Achaba, zaczął królować nad Izraelem w Samarii w siedemnastym roku Jehoszafata, króla Judy, i królował nad Izraelem dwa lata."
  tags: []
"1Krl22,52":
  text: "Czynił to, co złe w oczach PANA, idąc drogą swego ojca, drogą swej matki i drogą Jeroboama, syna Nebata, który przywiódł Izraela do grzechu."
  tags: []
"1Krl22,53":
  text: "Służył bowiem Baalowi, oddawał mu pokłon i pobudzał do gniewu PANA, Boga Izraela, według wszystkiego, co czynił jego ojciec."
  tags: []
