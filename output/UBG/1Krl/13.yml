"1Krl13,1":
  text: "A gdy Jeroboam stał przy ołtarzu, aby spalić kadzidło, oto mąż Boży przyszedł z Judy do Betel na słowo PANA."
  tags: []
"1Krl13,2":
  text: "I na słowo PANA zawołał przeciw ołtarzowi: Ołtarzu, ołtarzu, tak mówi PAN: Oto domowi Dawida urodzi się syn imieniem Jozjasz. Ten złoży na tobie kapłanów wyżyn spalających na tobie kadzidła i na tobie spalą kości ludzkie."
  tags: []
"1Krl13,3":
  text: "I dał znak tego samego dnia, mówiąc: Taki jest znak, że PAN to powiedział: Oto ołtarz rozpadnie się i rozsypie się popiół, który jest na nim."
  tags: []
"1Krl13,4":
  text: "A gdy król Jeroboam usłyszał słowo męża Bożego, który zawołał przeciw ołtarzowi w Betel, wyciągnął rękę znad ołtarza, mówiąc: Schwytajcie go. I uschła jego ręka, którą wyciągnął przeciw niemu, i nie mógł jej cofnąć ku sobie."
  tags: []
"1Krl13,5":
  text: "Ołtarz zaś rozpadł się, a popiół rozsypał się z ołtarza zgodnie ze znakiem, który dał mąż Boży na słowo PANA."
  tags: []
"1Krl13,6":
  text: "Wtedy król zwrócił się do męża Bożego: Przebłagaj oblicze PANA, swego Boga, i módl się za mnie, aby moja ręka wróciła do mnie. Mąż Boży przebłagał PANA i ręka króla wróciła do niego, i była jak poprzednio."
  tags: []
"1Krl13,7":
  text: "Następnie król poprosił męża Bożego: Chodź ze mną do domu i posil się, a złożę ci dar."
  tags: []
"1Krl13,8":
  text: "Lecz mąż Boży odpowiedział królowi: Choćbyś mi dał połowę swego domu, nie pójdę z tobą ani nie będę jadł chleba, ani pił wody w tym miejscu."
  tags: []
"1Krl13,9":
  text: "Tak bowiem mi rozkazano na słowo PANA: Nie będziesz jadł chleba ani nie będziesz pił wody, ani nie wrócisz tą drogą, którą przyszedłeś."
  tags: []
"1Krl13,10":
  text: "Poszedł więc inną drogą i nie wrócił tą drogą, którą przyszedł do Betel."
  tags: []
"1Krl13,11":
  text: "A mieszkał w Betel pewien stary prorok. Przyszli do niego jego synowie i opowiedzieli mu o wszystkich czynach, których w tym dniu dokonał mąż Boży w Betel. Powtórzyli też swojemu ojcu słowa, które wypowiedział do króla."
  tags: []
"1Krl13,12":
  text: "Ich ojciec zapytał ich: Którą drogą poszedł? Jego synowie bowiem widzieli, którą drogą poszedł mąż Boży, który przyszedł z Judy."
  tags: []
"1Krl13,13":
  text: "I powiedział swoim synom: Osiodłajcie mi osła. Osiodłali mu więc osła i wsiadł na niego;"
  tags: []
"1Krl13,14":
  text: "I podążył za mężem Bożym, a gdy znalazł go siedzącego pod dębem, zapytał go: Czy ty jesteś tym mężem Bożym, który przyszedł z Judy? Odpowiedział: Jestem."
  tags: []
"1Krl13,15":
  text: "Wtedy powiedział do niego: Chodź ze mną do domu, abyś się posilił chlebem."
  tags: []
"1Krl13,16":
  text: "Lecz odpowiedział mu: Nie mogę wrócić z tobą ani pójść z tobą. Nie będę jadł chleba ani pił wody z tobą w tym miejscu;"
  tags: []
"1Krl13,17":
  text: "Powiedziano bowiem do mnie na słowo PANA: Nie będziesz tam jadł chleba ani pił wody, ani nie pójdziesz z powrotem tą drogą, którą szedłeś."
  tags: []
"1Krl13,18":
  text: "I odpowiedział mu: Ja również jestem prorokiem jak ty. Anioł też powiedział do mnie na słowo PANA: Zaprowadź go ze sobą do swego domu, aby jadł chleb i pił wodę. Lecz okłamał go."
  tags: []
"1Krl13,19":
  text: "Zawrócił więc z nim i jadł chleb w jego domu oraz pił wodę."
  tags: []
"1Krl13,20":
  text: "A gdy siedzieli przy stole, doszło słowo PANA do proroka, który go zawrócił;"
  tags: []
"1Krl13,21":
  text: "I zawołał na męża Bożego, który przyszedł z Judy: Tak mówi PAN: Ponieważ byłeś nieposłuszny słowu PANA i nie przestrzegałeś rozkazu, który dał ci PAN, twój Bóg;"
  tags: []
"1Krl13,22":
  text: "Ale zawróciłeś i jadłeś chleb oraz piłeś wodę w miejscu, o którym PAN ci powiedział: Nie będziesz tam jadł chleba ani pił wody, twoje zwłoki nie będą pochowane w grobie twoich ojców."
  tags: []
"1Krl13,23":
  text: "A gdy najadł się chleba i napił, osiodłał osła dla proroka, którego zawrócił."
  tags: []
"1Krl13,24":
  text: "A gdy ten odjechał, spotkał go lew w drodze, który go zabił. A jego zwłoki leżały porzucone na drodze i osioł stał obok nich, lew także stał przy zwłokach."
  tags: []
"1Krl13,25":
  text: "A oto pewni ludzie przechodzili i zobaczyli porzucone zwłoki na drodze oraz lwa stojącego przy nich. Przyszli więc i opowiedzieli o tym w mieście, w którym mieszkał stary prorok."
  tags: []
"1Krl13,26":
  text: "Kiedy usłyszał o tym prorok, który go zawrócił z drogi, powiedział: To jest mąż Boży, który był nieposłuszny słowu PANA. Dlatego PAN wydał go lwu, który go rozszarpał i zabił, zgodnie ze słowem PANA, które wypowiedział do niego."
  tags: []
"1Krl13,27":
  text: "Następnie powiedział do swoich synów: Osiodłajcie mi osła. I osiodłali."
  tags: []
"1Krl13,28":
  text: "Wtedy pojechał i znalazł jego zwłoki porzucone na drodze oraz osła i lwa stojących przy zwłokach. Lecz lew nie pożarł zwłok ani nie rozszarpał osła."
  tags: []
"1Krl13,29":
  text: "Wtedy prorok podniósł zwłoki męża Bożego, włożył je na osła i zabrał z powrotem. I stary prorok przybył do swego miasta, aby go opłakiwać i pogrzebać."
  tags: []
"1Krl13,30":
  text: "Złożył więc jego zwłoki w swoim grobie. I opłakiwali go, mówiąc: Ach, mój bracie!"
  tags: []
"1Krl13,31":
  text: "A kiedy już go pogrzebali, powiedział do swoich synów: Gdy umrę, pogrzebcie mnie w tym grobie, w którym został pogrzebany mąż Boży. Złóżcie moje kości obok jego kości."
  tags: []
"1Krl13,32":
  text: "Spełni się bowiem to, co zawołał na słowo PANA przeciw ołtarzowi w Betel i przeciwko wszystkim domom wyżyn, które znajdują się w miastach Samarii."
  tags: []
"1Krl13,33":
  text: "Jednak po tych wydarzeniach Jeroboam nie odwrócił się od swojej złej drogi, ale znowu ustanawiał kapłanów wyżyn z pospólstwa. Kto tylko chciał, tego poświęcał i ten stawał się kapłanem wyżyn."
  tags: []
"1Krl13,34":
  text: "Sprawa ta stała się przyczyną grzechu dla domu Jeroboama, aby został wykorzeniony i zgładzony z powierzchni ziemi."
  tags: []
