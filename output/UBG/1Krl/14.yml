"1Krl14,1":
  text: "W tym czasie zachorował Abiasz, syn Jeroboama."
  tags: []
"1Krl14,2":
  text: "I Jeroboam powiedział do swojej żony: Wstań teraz, przebierz się, aby nie poznano, że jesteś żoną Jeroboama, i idź do Szilo. Jest tam prorok Achiasz, który mi powiedział, że będę królem nad tym ludem."
  tags: []
"1Krl14,3":
  text: "Weź ze sobą dziesięć chlebów, placki i dzban miodu i idź do niego. On ci oznajmi, co się stanie z dzieckiem."
  tags: []
"1Krl14,4":
  text: "Żona Jeroboama tak uczyniła. Wstała i poszła do Szilo, i przybyła do domu Achiasza. Lecz Achiasz już nie widział, gdyż jego oczy osłabły z powodu jego starości."
  tags: []
"1Krl14,5":
  text: "A PAN powiedział do Achiasza: Oto żona Jeroboama nadchodzi, aby dowiedzieć się czegoś od ciebie o swoim synu, gdyż jest chory. Powiesz jej tak i tak, bo gdy wejdzie, będzie udawała kogoś innego."
  tags: []
"1Krl14,6":
  text: "Gdy więc Achiasz usłyszał odgłos jej kroków, gdy wchodziła przez drzwi, powiedział: Wejdź, żono Jeroboama. Dlaczego udajesz kogoś innego? Zostałem posłany do ciebie z przykrą nowiną."
  tags: []
"1Krl14,7":
  text: "Idź, powiedz Jeroboamowi: Tak mówi PAN, Bóg Izraela: Mimo że wywyższyłem cię spośród ludu i ustanowiłem cię księciem nad moim ludem Izraelem;"
  tags: []
"1Krl14,8":
  text: "Wyrwałem domowi Dawida królestwo i dałem je tobie, ty jednak nie byłeś jak mój sługa Dawid, który przestrzegał moich przykazań i który chodził za mną całym swym sercem, czyniąc tylko to, co jest prawe w moich oczach;"
  tags: []
"1Krl14,9":
  text: "Lecz postępowałeś gorzej niż wszyscy, którzy byli przed tobą. Ty bowiem poszedłeś i uczyniłeś sobie obcych bogów i odlane posągi, aby mnie pobudzić do gniewu, mnie zaś rzuciłeś za plecy."
  tags: []
"1Krl14,10":
  text: "Dlatego sprowadzę nieszczęście na dom Jeroboama i wytępię z Jeroboama każdego, aż do najmniejszego szczenięcia, każdego więźnia i opuszczonego w Izraelu, i usunę ostatki domu Jeroboama, jak usuwa się gnój, aż do końca."
  tags: []
"1Krl14,11":
  text: "Tego, kto z domu Jeroboama umrze w mieście, zjedzą psy, a tego, kto umrze na polu, zjedzą powietrzne ptaki, ponieważ tak powiedział PAN."
  tags: []
"1Krl14,12":
  text: "Ty zaś wstań i idź do swego domu, a gdy wejdziesz do miasta, dziecko umrze."
  tags: []
"1Krl14,13":
  text: "I cały Izrael będzie je opłakiwał, i pogrzebie je, bo jedynie ono z domu Jeroboama zejdzie do grobu, gdyż w nim znalazło się coś dobrego względem PANA, Boga Izraela, w domu Jeroboama."
  tags: []
"1Krl14,14":
  text: "PAN zaś ustanowi sobie króla nad Izraelem, który wytępi dom Jeroboama w tym samym dniu. A co mówię, wzbudzi? I owszem, już wzbudził."
  tags: []
"1Krl14,15":
  text: "I PAN uderzy Izraela tak, że się zachwieje, jak się chwieje trzcina w wodzie, i wykorzeni Izraela z tej dobrej ziemi, którą dał ich ojcom, i rozproszy ich za rzeką za to, że uczynili sobie gaje, pobudzając PANA do gniewu."
  tags: []
"1Krl14,16":
  text: "I tak porzuci on Izraela z powodu grzechów Jeroboama, który grzeszył i skłonił Izraela do grzechu."
  tags: []
"1Krl14,17":
  text: "Wtedy żona Jeroboama wstała, wyruszyła i przybyła do Tirsy. Gdy przekroczyła próg domu, dziecko umarło."
  tags: []
"1Krl14,18":
  text: "I pogrzebali je, i cały Izrael je opłakiwał zgodnie ze słowem PANA, które zapowiedział przez swego sługę, proroka Achiasza."
  tags: []
"1Krl14,19":
  text: "Pozostałe zaś dzieje Jeroboama, jak walczył i jak królował, są zapisane w kronikach o królach Izraela."
  tags: []
"1Krl14,20":
  text: "A czas, który królował Jeroboam, wynosił dwadzieścia dwa lata. Potem zasnął ze swoimi ojcami, a jego syn Nadab królował w jego miejsce."
  tags: []
"1Krl14,21":
  text: "Roboam zaś, syn Salomona, królował w Judzie. Roboam miał czterdzieści jeden lat, gdy zaczął królować, a królował siedemnaście lat w Jerozolimie, w mieście, które PAN wybrał spośród wszystkich pokoleń Izraela, aby tam przebywało jego imię. Jego matka miała na imię Naama, była Ammonitką."
  tags: []
"1Krl14,22":
  text: "I Juda czynił to, co złe w oczach PANA, i swoimi grzechami, które popełniali, pobudzali go do zazdrości bardziej niż to wszystko, co czynili ich ojcowie."
  tags: []
"1Krl14,23":
  text: "Pobudowali sobie bowiem wyżyny, posągi i gaje na każdym wysokim wzgórzu i pod każdym zielonym drzewem."
  tags: []
"1Krl14,24":
  text: "Byli też w tej ziemi sodomici. Postępowali oni według wszystkich obrzydliwości pogan, których PAN wypędził sprzed synów Izraela."
  tags: []
"1Krl14,25":
  text: "A w piątym roku króla Roboama, przeciw Jerozolimie nadciągnął Sziszak, król Egiptu."
  tags: []
"1Krl14,26":
  text: "I zabrał skarby domu PANA oraz skarby domu królewskiego, zabrał wszystko. Zabrał też wszystkie złote tarcze, które wykonał Salomon."
  tags: []
"1Krl14,27":
  text: "Zamiast nich król Roboam wykonał spiżowe tarcze i powierzył je dowódcy straży przybocznej, która strzegła drzwi domu królewskiego."
  tags: []
"1Krl14,28":
  text: "Ilekroć król wchodził do domu PANA, straż je nosiła, a potem odnosiła do wartowni."
  tags: []
"1Krl14,29":
  text: "A pozostałe dzieje Roboama i wszystko, co czynił, czyż nie są zapisane w kronikach królów Judy?"
  tags: []
"1Krl14,30":
  text: "I trwała wojna między Roboamem a Jeroboamem po wszystkie dni."
  tags: []
"1Krl14,31":
  text: "Potem Roboam zasnął ze swoimi ojcami i został pogrzebany z nimi w mieście Dawida. A jego matka miała na imię Naama, była Ammonitką. I jego syn Abijam królował w jego miejsce."
  tags: []
