"Jl1,1": "Słowo PANA, które doszło do Joela, syna Petuela."
"Jl1,2": "Słuchajcie tego, starcy, nakłońcie ucha wszyscy mieszkańcy tej ziemi. Czy zdarzyło się coś podobnego za waszych dni albo za dni waszych ojców?"
"Jl1,3": "Opowiadajcie o tym swoim synom, a wasi synowie niech opowiedzą swoim synom, a ich synowie przyszłemu pokoleniu."
"Jl1,4": "Co zostało po gąsienicy, zjadła szarańcza, co zostało po szarańczy, zjadła larwa, a co zostało po larwie, zjadło robactwo."
"Jl1,5": "Ocknijcie się, pijani, i płaczcie; wszyscy, którzy pijecie wino, zawódźcie z powodu moszczu, bo został odjęty od waszych ust."
"Jl1,6": "Nadciągnął bowiem naród do mojej ziemi, mocny i niezliczony, jego zęby to zęby lwa, a zęby trzonowe ma jak srogi lew."
"Jl1,7": "Spustoszył moją winorośl i połupał moje drzewo figowe. Odarł je doszczętnie i porzucił tak, że zbielały jego gałęzie."
"Jl1,8": "Lamentuj jak dziewica przepasana worem nad mężem swojej młodości."
"Jl1,9": "Odjęto ofiarę z pokarmów i z płynów od domu PANA; płaczą kapłani, słudzy PANA."
"Jl1,10": "Pole zostało spustoszone i ziemia się smuci, ponieważ zniszczono zboże. Wysechł moszcz, zginęła oliwa."
"Jl1,11": "Zawstydźcie się, rolnicy; zawódźcie winogrodnicy z powodu pszenicy i jęczmienia, bo przepadło żniwo polne."
"Jl1,12": "Uschła winorośl i zwiędło drzewo figowe; drzewo granatowe, palma, jabłoń i wszystkie drzewa polne uschły, bo radość znikła spośród synów ludzkich."
"Jl1,13": "Przepaszcie się i płaczcie, kapłani. Zawódźcie, słudzy ołtarza. Przyjdźcie i nocujcie w worach, słudzy mojego Boga, bo zabrakło ofiar z pokarmów i płynów w domu waszego Boga."
"Jl1,14": "Ogłoście święty post, zwołajcie zgromadzenie, zbierzcie starców i wszystkich mieszkańców ziemi w domu PANA, waszego Boga, i wołajcie do PANA:"
"Jl1,15": "Ach, co to za dzień! Bliski bowiem jest dzień PANA i nadejdzie jak spustoszenie od Wszechmocnego."
"Jl1,16": "Czyż na naszych oczach nie zginęła żywność, a z domu naszego Boga – radość i wesele?"
"Jl1,17": "Zgniły ziarna pod swymi skibami, spustoszone są spichlerze, zburzone stodoły, bo uschło zboże."
"Jl1,18": "Jakże ryczy bydło? Błąkają się stada wołów, bo nie mają pastwisk, nawet i trzody owiec wyginęły."
"Jl1,19": "Do ciebie wołam, PANIE, bo ogień pożarł pastwiska na pustyni, a płomień spalił wszystkie drzewa polne;"
"Jl1,20": "Także i zwierzęta polne ryczą do ciebie, ponieważ wyschły strumienie wód, a ogień pożarł pastwiska na pustyni."
