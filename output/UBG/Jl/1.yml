"Jl1,1":
  text: "Słowo PANA, które doszło do Joela, syna Petuela."
  tags: []
"Jl1,2":
  text: "Słuchajcie tego, starcy, nakłońcie ucha wszyscy mieszkańcy tej ziemi. Czy zdarzyło się coś podobnego za waszych dni albo za dni waszych ojców?"
  tags: []
"Jl1,3":
  text: "Opowiadajcie o tym swoim synom, a wasi synowie niech opowiedzą swoim synom, a ich synowie przyszłemu pokoleniu."
  tags: []
"Jl1,4":
  text: "Co zostało po gąsienicy, zjadła szarańcza, co zostało po szarańczy, zjadła larwa, a co zostało po larwie, zjadło robactwo."
  tags: []
"Jl1,5":
  text: "Ocknijcie się, pijani, i płaczcie; wszyscy, którzy pijecie wino, zawódźcie z powodu moszczu, bo został odjęty od waszych ust."
  tags: []
"Jl1,6":
  text: "Nadciągnął bowiem naród do mojej ziemi, mocny i niezliczony, jego zęby to zęby lwa, a zęby trzonowe ma jak srogi lew."
  tags: []
"Jl1,7":
  text: "Spustoszył moją winorośl i połupał moje drzewo figowe. Odarł je doszczętnie i porzucił tak, że zbielały jego gałęzie."
  tags: []
"Jl1,8":
  text: "Lamentuj jak dziewica przepasana worem nad mężem swojej młodości."
  tags: []
"Jl1,9":
  text: "Odjęto ofiarę z pokarmów i z płynów od domu PANA; płaczą kapłani, słudzy PANA."
  tags: []
"Jl1,10":
  text: "Pole zostało spustoszone i ziemia się smuci, ponieważ zniszczono zboże. Wysechł moszcz, zginęła oliwa."
  tags: []
"Jl1,11":
  text: "Zawstydźcie się, rolnicy; zawódźcie winogrodnicy z powodu pszenicy i jęczmienia, bo przepadło żniwo polne."
  tags: []
"Jl1,12":
  text: "Uschła winorośl i zwiędło drzewo figowe; drzewo granatowe, palma, jabłoń i wszystkie drzewa polne uschły, bo radość znikła spośród synów ludzkich."
  tags: []
"Jl1,13":
  text: "Przepaszcie się i płaczcie, kapłani. Zawódźcie, słudzy ołtarza. Przyjdźcie i nocujcie w worach, słudzy mojego Boga, bo zabrakło ofiar z pokarmów i płynów w domu waszego Boga."
  tags: []
"Jl1,14":
  text: "Ogłoście święty post, zwołajcie zgromadzenie, zbierzcie starców i wszystkich mieszkańców ziemi w domu PANA, waszego Boga, i wołajcie do PANA:"
  tags: []
"Jl1,15":
  text: "Ach, co to za dzień! Bliski bowiem jest dzień PANA i nadejdzie jak spustoszenie od Wszechmocnego."
  tags: []
"Jl1,16":
  text: "Czyż na naszych oczach nie zginęła żywność, a z domu naszego Boga – radość i wesele?"
  tags: []
"Jl1,17":
  text: "Zgniły ziarna pod swymi skibami, spustoszone są spichlerze, zburzone stodoły, bo uschło zboże."
  tags: []
"Jl1,18":
  text: "Jakże ryczy bydło? Błąkają się stada wołów, bo nie mają pastwisk, nawet i trzody owiec wyginęły."
  tags: []
"Jl1,19":
  text: "Do ciebie wołam, PANIE, bo ogień pożarł pastwiska na pustyni, a płomień spalił wszystkie drzewa polne;"
  tags: []
"Jl1,20":
  text: "Także i zwierzęta polne ryczą do ciebie, ponieważ wyschły strumienie wód, a ogień pożarł pastwiska na pustyni."
  tags: []
