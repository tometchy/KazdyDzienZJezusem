"Jl3,1": "Oto bowiem w tych dniach i w tym czasie, gdy odwrócę niewolę ludu Judy i Jerozolimy;"
"Jl3,2": "Zgromadzę też wszystkie narody i sprowadzę je do Doliny Jehoszafata, i będę tam z nimi rozprawiał o swoim ludzie i o swoim dziedzictwie Izraela, które rozproszyły wśród narodów i podzieliły moją ziemię."
"Jl3,3": "O mój lud rzucały los, dawały chłopca za nierządnicę i dziewczynę sprzedawały za wino, aby piły."
"Jl3,4": "Ale wy cóż macie przeciwko mnie, Tyrze i Sydonie, oraz wszystkie granice filistyńskie? Czy chcecie dać mi odpłatę? Jeśli mi odpłacicie, to prędko i niezwłocznie i ja zwrócę waszą odpłatę na waszą głowę;"
"Jl3,5": "Gdyż zabraliście moje srebro i złoto, a moje wspaniałe klejnoty wnieśliście do swoich świątyń;"
"Jl3,6": "A synów Judy i synów Jerozolimy sprzedaliście Grekom, by ich oddalić od ich granic."
"Jl3,7": "Oto wzbudzę ich z tego miejsca, do którego ich sprzedaliście, i zwrócę waszą zapłatę na waszą głowę;"
"Jl3,8": "I sprzedam waszych synów i wasze córki w ręce synów Judy, a oni sprzedadzą ich Sabejczykom, narodowi dalekiemu. Tak bowiem PAN powiedział."
"Jl3,9": "Rozgłoście to wśród pogan, ogłoście wojnę, pobudźcie wojowników, niech przybędą i niech wyruszą wszyscy mężowie waleczni."
"Jl3,10": "Przekujcie wasze lemiesze na miecze, a wasze sierpy na oszczepy; kto słaby, niech powie: Jestem silny."
"Jl3,11": "Zgromadźcie się i przyjdźcie, wszystkie okoliczne narody – zbierzcie się. Sprowadź tam, PANIE, swoich wojowników."
"Jl3,12": "Niech poganie się ockną i nadciągną na Dolinę Jehoszafata. Tam bowiem zasiądę, aby sądzić wszystkie okoliczne narody."
"Jl3,13": "Zapuśćcie sierp, bo dojrzało żniwo. Pójdźcie i zstąpcie, bo tłocznia jest pełna, kadzie przelewają się, bo ich zło jest wielkie."
"Jl3,14": "Tłumy, tłumy w dolinie wyroku. Bliski bowiem jest dzień PANA w dolinie wyroku."
"Jl3,15": "Słońce i księżyc się zaćmią i gwiazdy stracą swój blask."
"Jl3,16": "I PAN zagrzmi z Syjonu, a z Jerozolimy wyda swój głos, tak że zadrżą niebiosa i ziemia. Ale PAN będzie ucieczką dla swego ludu i siłą synów Izraela."
"Jl3,17": "I poznacie, że ja jestem PANEM, waszym Bogiem, który mieszka na Syjonie, mojej świętej górze. I Jerozolima stanie się święta, a obcy już nie będą przez nią przechodzić."
"Jl3,18": "I stanie się w tym dniu, że góry będą kropić moszczem, pagórki opływać mlekiem i wszystkie strumienie Judy napełnią się wodą, a z domu PANA wyjdzie źródło, które nawodni dolinę Sittim."
"Jl3,19": "Egipt zostanie spustoszony, a ziemia Edom zamieni się w opustoszałe pustkowie z powodu przemocy wyrządzonej synom Judy, bo przelewali niewinną krew w ich ziemi."
"Jl3,20": "Ale Juda będzie trwać na wieki, a Jerozolima – z pokolenia na pokolenie."
"Jl3,21": "I oczyszczę tych, których krwi nie oczyściłem. PAN bowiem mieszka na Syjonie."
