"Jl3,1":
  text: "Oto bowiem w tych dniach i w tym czasie, gdy odwrócę niewolę ludu Judy i Jerozolimy;"
  tags: []
"Jl3,2":
  text: "Zgromadzę też wszystkie narody i sprowadzę je do Doliny Jehoszafata, i będę tam z nimi rozprawiał o swoim ludzie i o swoim dziedzictwie Izraela, które rozproszyły wśród narodów i podzieliły moją ziemię."
  tags: []
"Jl3,3":
  text: "O mój lud rzucały los, dawały chłopca za nierządnicę i dziewczynę sprzedawały za wino, aby piły."
  tags: []
"Jl3,4":
  text: "Ale wy cóż macie przeciwko mnie, Tyrze i Sydonie, oraz wszystkie granice filistyńskie? Czy chcecie dać mi odpłatę? Jeśli mi odpłacicie, to prędko i niezwłocznie i ja zwrócę waszą odpłatę na waszą głowę;"
  tags: []
"Jl3,5":
  text: "Gdyż zabraliście moje srebro i złoto, a moje wspaniałe klejnoty wnieśliście do swoich świątyń;"
  tags: []
"Jl3,6":
  text: "A synów Judy i synów Jerozolimy sprzedaliście Grekom, by ich oddalić od ich granic."
  tags: []
"Jl3,7":
  text: "Oto wzbudzę ich z tego miejsca, do którego ich sprzedaliście, i zwrócę waszą zapłatę na waszą głowę;"
  tags: []
"Jl3,8":
  text: "I sprzedam waszych synów i wasze córki w ręce synów Judy, a oni sprzedadzą ich Sabejczykom, narodowi dalekiemu. Tak bowiem PAN powiedział."
  tags: []
"Jl3,9":
  text: "Rozgłoście to wśród pogan, ogłoście wojnę, pobudźcie wojowników, niech przybędą i niech wyruszą wszyscy mężowie waleczni."
  tags: []
"Jl3,10":
  text: "Przekujcie wasze lemiesze na miecze, a wasze sierpy na oszczepy; kto słaby, niech powie: Jestem silny."
  tags: []
"Jl3,11":
  text: "Zgromadźcie się i przyjdźcie, wszystkie okoliczne narody – zbierzcie się. Sprowadź tam, PANIE, swoich wojowników."
  tags: []
"Jl3,12":
  text: "Niech poganie się ockną i nadciągną na Dolinę Jehoszafata. Tam bowiem zasiądę, aby sądzić wszystkie okoliczne narody."
  tags: []
"Jl3,13":
  text: "Zapuśćcie sierp, bo dojrzało żniwo. Pójdźcie i zstąpcie, bo tłocznia jest pełna, kadzie przelewają się, bo ich zło jest wielkie."
  tags: []
"Jl3,14":
  text: "Tłumy, tłumy w dolinie wyroku. Bliski bowiem jest dzień PANA w dolinie wyroku."
  tags: []
"Jl3,15":
  text: "Słońce i księżyc się zaćmią i gwiazdy stracą swój blask."
  tags: []
"Jl3,16":
  text: "I PAN zagrzmi z Syjonu, a z Jerozolimy wyda swój głos, tak że zadrżą niebiosa i ziemia. Ale PAN będzie ucieczką dla swego ludu i siłą synów Izraela."
  tags: []
"Jl3,17":
  text: "I poznacie, że ja jestem PANEM, waszym Bogiem, który mieszka na Syjonie, mojej świętej górze. I Jerozolima stanie się święta, a obcy już nie będą przez nią przechodzić."
  tags: []
"Jl3,18":
  text: "I stanie się w tym dniu, że góry będą kropić moszczem, pagórki opływać mlekiem i wszystkie strumienie Judy napełnią się wodą, a z domu PANA wyjdzie źródło, które nawodni dolinę Sittim."
  tags: []
"Jl3,19":
  text: "Egipt zostanie spustoszony, a ziemia Edom zamieni się w opustoszałe pustkowie z powodu przemocy wyrządzonej synom Judy, bo przelewali niewinną krew w ich ziemi."
  tags: []
"Jl3,20":
  text: "Ale Juda będzie trwać na wieki, a Jerozolima – z pokolenia na pokolenie."
  tags: []
"Jl3,21":
  text: "I oczyszczę tych, których krwi nie oczyściłem. PAN bowiem mieszka na Syjonie."
  tags: []
