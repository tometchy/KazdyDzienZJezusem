"Jl2,1": "Zadmijcie w trąbę na Syjonie, krzyczcie na mojej świętej górze! Niech zadrżą wszyscy mieszkańcy ziemi, bo nadchodzi dzień PANA, bo już jest bliski;"
"Jl2,2": "Dzień ciemności i mroku, dzień obłoku i chmury, jak zorza ranna rozciągnięta po górach. Lud wielki i potężny, któremu równego nie było od wieków i po nim nigdy nie będzie aż do lat najdalszych pokoleń."
"Jl2,3": "Przed jego obliczem ogień pożerający, a za nim płomień palący. Ta ziemia jest przed nim jak ogród Eden, ale po nim będzie opustoszałe pustkowie – przed nim nie ujdzie nikt."
"Jl2,4": "Ich wygląd jest podobny do wyglądu koni i pobiegną jak jeźdźcy."
"Jl2,5": "Po wierzchołkach gór będą skakać jak grzmot rydwanów, jak szum płomienia ognia, co pożera ściernisko, jak lud potężny uszykowany do bitwy."
"Jl2,6": "Na ich widok narody się zlękną, wszystkie ich twarze poczernieją jak garnek."
"Jl2,7": "Pobiegną jak wojownicy, wedrą się na mury jak waleczni wojownicy; każdy z nich pójdzie swoją drogą, a nie zboczą ze swoich ścieżek."
"Jl2,8": "Jeden drugiego nie ściśnie, każdy pójdzie swoją drogą. A choć i na miecz upadną, nie będą zranieni."
"Jl2,9": "Po mieście będą chodzić, po murze będą biegać, wdrapią się na domy i wejdą oknami jak złodziej."
"Jl2,10": "Przed nimi zadrży ziemia, niebiosa się poruszą, słońce i księżyc będą zaćmione, a gwiazdy stracą swój blask."
"Jl2,11": "A PAN wyda swój głos przed swoim wojskiem, gdyż jego obóz jest ogromny, gdyż mocny jest ten, który wykonuje jego słowo. Wielki jest bowiem dzień PANA i bardzo straszliwy! Któż go zniesie?"
"Jl2,12": "Dlatego jeszcze i teraz, mówi PAN, wróćcie do mnie całym swym sercem, w poście, płaczu i w lamencie."
"Jl2,13": "Rozdzierajcie swoje serca, a nie swoje szaty, i nawróćcie się do PANA, waszego Boga, bo on jest łaskawy i miłosierny, nieskory do gniewu i hojny w miłosierdzie i żałuje nieszczęścia."
"Jl2,14": "Któż wie, czy nie zawróci i nie będzie mu żal, i nie zostawi po sobie błogosławieństwa na ofiarę z pokarmów i z płynów dla PANA, waszego Boga?"
"Jl2,15": "Zadmijcie w trąbę na Syjonie, ogłoście święty post, zwołajcie zgromadzenie."
"Jl2,16": "Zgromadźcie lud, poświęćcie zgromadzenie, zbierzcie starców, zbierzcie dzieci i niemowlęta ssące piersi. Niech oblubieniec wyjdzie ze swojej izby, a oblubienica ze swojej komnaty."
"Jl2,17": "Niech kapłani, słudzy PANA, płaczą między przedsionkiem a ołtarzem i niech mówią: Przepuść, PANIE, swemu ludowi i nie wydawaj swego dziedzictwa na pohańbienie, aby poganie nad nimi nie panowali. Czemu mieliby mówić wśród narodów: Gdzie jest ich Bóg?"
"Jl2,18": "Wtedy PAN będzie zazdrosny o swoją ziemię i zlituje się nad swoim ludem."
"Jl2,19": "I PAN odezwie się, i powie do swego ludu: Oto ześlę wam zboże, moszcz i oliwę i nasycicie się nimi, a już nie wydam was na pohańbienie pośród pogan."
"Jl2,20": "Oddalę od was północne wojsko i zapędzę je do ziemi suchej i spustoszonej. Przednia jego straż obróci się ku morzu wschodniemu, a jego tylna straż – ku morzu zachodniemu; i rozejdzie się jego smród i zgnilizna, bo postępował wyniośle."
"Jl2,21": "Nie bój się, ziemio! Ciesz się i raduj, bo PAN uczyni wielkie rzeczy."
"Jl2,22": "Nie bójcie się, polne zwierzęta, bo zarosło pastwisko na pustyni, a drzewa wydają swoje owoce, drzewo figowe i winorośl wydają swoją moc."
"Jl2,23": "I wy, synowie Syjonu, cieszcie się i radujcie w PANU, waszym Bogu. Da wam bowiem deszcz wczesny i ześle wam deszcz jesienny i wiosenny, jak dawniej."
"Jl2,24": "I spichlerze będą napełnione zbożem, a tłocznie będą opływać moszczem i oliwą."
"Jl2,25": "W ten sposób wynagrodzę wam lata zjedzone przez szarańczę, larwę, robactwo i gąsienicę, moje wielkie wojsko, które wysyłałem na was."
"Jl2,26": "Wtedy będziecie jeść obficie i będziecie nasyceni; będziecie chwalić imię PANA, swego Boga, który uczynił wam cudowne rzeczy, a mój lud nigdy nie będzie pohańbiony."
"Jl2,27": "I dowiecie się, że ja jestem wśród Izraela, że ja jestem PAN, wasz Bóg, i że nie ma żadnego innego; a mój lud nigdy nie będzie pohańbiony."
"Jl2,28": "I stanie się potem, że wyleję swojego Ducha na wszelkie ciało, i będą prorokować wasi synowie i wasze córki, wasi starcy będą mieć sny, a wasi młodzieńcy – widzenia."
"Jl2,29": "Nawet na sługi i służebnice wyleję w tych dniach swojego Ducha."
"Jl2,30": "I ukażę cuda na niebie i na ziemi, krew, ogień i kłęby dymu."
"Jl2,31": "Słońce zamieni się w ciemność, a księżyc w krew, zanim nadejdzie dzień PANA, wielki i straszny."
"Jl2,32": "I stanie się, że każdy, kto wezwie imienia PANA, zostanie wybawiony, bo na górze Syjon i w Jerozolimie będzie wybawienie, jak powiedział PAN, to jest w resztkach, które PAN powoła."
