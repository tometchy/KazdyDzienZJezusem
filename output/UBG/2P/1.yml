"2P1,1":
  text: "Szymon Piotr, sługa i apostoł Jezusa Chrystusa, do tych, którzy otrzymali wiarę równie cenną jak nasza, dzięki sprawiedliwości naszego Boga i Zbawiciela, Jezusa Chrystusa."
  tags: []
"2P1,2":
  text: "Łaska i pokój niech się wam pomnożą przez poznanie Boga i Jezusa, naszego Pana;"
  tags: []
"2P1,3":
  text: "Jako że jego Boska moc obdarzyła nas wszystkim, co potrzebne do życia i pobożności, przez poznanie tego, który nas powołał do chwały i cnoty."
  tags: []
"2P1,4":
  text: "Przez to zostały nam dane bardzo wielkie i cenne obietnice, abyście przez nie stali się uczestnikami Boskiej natury, uniknąwszy zepsucia, które wskutek pożądliwości jest na świecie."
  tags: []
"2P1,5":
  text: "Dlatego też, dokładając wszelkich starań, dodajcie do waszej wiary cnotę, do cnoty poznanie;"
  tags: []
"2P1,6":
  text: "Do poznania powściągliwość, do powściągliwości cierpliwość, do cierpliwości pobożność;"
  tags: []
"2P1,7":
  text: "Do pobożności braterską życzliwość, a do życzliwości braterskiej miłość."
  tags: []
"2P1,8":
  text: "Gdy bowiem będą one w was, i to w obfitości, to nie uczynią was bezczynnymi ani bezowocnymi w poznawaniu naszego Pana Jezusa Chrystusa."
  tags: []
"2P1,9":
  text: "Kto zaś ich nie ma, jest ślepy, krótkowzroczny i zapomniał, że został oczyszczony ze swoich dawnych grzechów."
  tags: []
"2P1,10":
  text: "Dlatego, bracia, tym bardziej starajcie się umocnić wasze powołanie i wybranie. To bowiem czyniąc, nigdy się nie potkniecie."
  tags: []
"2P1,11":
  text: "W ten sposób hojnie będzie wam dane wejście do wiecznego królestwa naszego Pana i Zbawiciela, Jezusa Chrystusa."
  tags: []
"2P1,12":
  text: "Dlatego nie zaniedbam zawsze wam o tych sprawach przypominać, chociaż je znacie i utwierdzeni jesteście w obecnej prawdzie."
  tags: []
"2P1,13":
  text: "Uważam bowiem za słuszne, dopóki jestem w tym namiocie, pobudzać was przez przypominanie;"
  tags: []
"2P1,14":
  text: "Wiedząc, że bliskie jest zwinięcie mojego namiotu, jak mi to też objawił nasz Pan Jezus Chrystus."
  tags: []
"2P1,15":
  text: "Dołożę jednak starań, abyście po moim odejściu zawsze mieli to w pamięci."
  tags: []
"2P1,16":
  text: "Gdyż daliśmy wam poznać moc i przyjście naszego Pana Jezusa Chrystusa, nie podążając za zręcznie wymyślonymi baśniami, ale jako naoczni świadkowie jego wielkości."
  tags: []
"2P1,17":
  text: "Otrzymał on bowiem od Boga Ojca cześć i chwałę, gdy doszedł go taki głos od wspaniałej chwały: To jest mój umiłowany Syn, w którym mam upodobanie."
  tags: []
"2P1,18":
  text: "I słyszeliśmy ten głos dochodzący z nieba, gdy byliśmy z nim na świętej górze."
  tags: []
"2P1,19":
  text: "Mamy też mocniejsze słowo prorockie, a wy dobrze czynicie, trzymając się go jak lampy, która świeci w ciemnym miejscu, dopóki dzień nie zaświta i jutrzenka nie wzejdzie w waszych sercach;"
  tags: []
"2P1,20":
  text: "To przede wszystkim wiedząc, że żadne proroctwo Pisma nie podlega własnemu wykładowi."
  tags: []
"2P1,21":
  text: "Nie z ludzkiej bowiem woli przyniesione zostało kiedyś proroctwo, ale święci Boży ludzie przemawiali prowadzeni przez Ducha Świętego."
  tags: []
