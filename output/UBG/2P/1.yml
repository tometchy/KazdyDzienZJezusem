"2P1,1": "Szymon Piotr, sługa i apostoł Jezusa Chrystusa, do tych, którzy otrzymali wiarę równie cenną jak nasza, dzięki sprawiedliwości naszego Boga i Zbawiciela, Jezusa Chrystusa."
"2P1,2": "Łaska i pokój niech się wam pomnożą przez poznanie Boga i Jezusa, naszego Pana;"
"2P1,3": "Jako że jego Boska moc obdarzyła nas wszystkim, co potrzebne do życia i pobożności, przez poznanie tego, który nas powołał do chwały i cnoty."
"2P1,4": "Przez to zostały nam dane bardzo wielkie i cenne obietnice, abyście przez nie stali się uczestnikami Boskiej natury, uniknąwszy zepsucia, które wskutek pożądliwości jest na świecie."
"2P1,5": "Dlatego też, dokładając wszelkich starań, dodajcie do waszej wiary cnotę, do cnoty poznanie;"
"2P1,6": "Do poznania powściągliwość, do powściągliwości cierpliwość, do cierpliwości pobożność;"
"2P1,7": "Do pobożności braterską życzliwość, a do życzliwości braterskiej miłość."
"2P1,8": "Gdy bowiem będą one w was, i to w obfitości, to nie uczynią was bezczynnymi ani bezowocnymi w poznawaniu naszego Pana Jezusa Chrystusa."
"2P1,9": "Kto zaś ich nie ma, jest ślepy, krótkowzroczny i zapomniał, że został oczyszczony ze swoich dawnych grzechów."
"2P1,10": "Dlatego, bracia, tym bardziej starajcie się umocnić wasze powołanie i wybranie. To bowiem czyniąc, nigdy się nie potkniecie."
"2P1,11": "W ten sposób hojnie będzie wam dane wejście do wiecznego królestwa naszego Pana i Zbawiciela, Jezusa Chrystusa."
"2P1,12": "Dlatego nie zaniedbam zawsze wam o tych sprawach przypominać, chociaż je znacie i utwierdzeni jesteście w obecnej prawdzie."
"2P1,13": "Uważam bowiem za słuszne, dopóki jestem w tym namiocie, pobudzać was przez przypominanie;"
"2P1,14": "Wiedząc, że bliskie jest zwinięcie mojego namiotu, jak mi to też objawił nasz Pan Jezus Chrystus."
"2P1,15": "Dołożę jednak starań, abyście po moim odejściu zawsze mieli to w pamięci."
"2P1,16": "Gdyż daliśmy wam poznać moc i przyjście naszego Pana Jezusa Chrystusa, nie podążając za zręcznie wymyślonymi baśniami, ale jako naoczni świadkowie jego wielkości."
"2P1,17": "Otrzymał on bowiem od Boga Ojca cześć i chwałę, gdy doszedł go taki głos od wspaniałej chwały: To jest mój umiłowany Syn, w którym mam upodobanie."
"2P1,18": "I słyszeliśmy ten głos dochodzący z nieba, gdy byliśmy z nim na świętej górze."
"2P1,19": "Mamy też mocniejsze słowo prorockie, a wy dobrze czynicie, trzymając się go jak lampy, która świeci w ciemnym miejscu, dopóki dzień nie zaświta i jutrzenka nie wzejdzie w waszych sercach;"
"2P1,20": "To przede wszystkim wiedząc, że żadne proroctwo Pisma nie podlega własnemu wykładowi."
"2P1,21": "Nie z ludzkiej bowiem woli przyniesione zostało kiedyś proroctwo, ale święci Boży ludzie przemawiali prowadzeni przez Ducha Świętego."
