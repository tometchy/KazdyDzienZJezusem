"2P3,1":
  text: "Umiłowani, piszę do was już ten drugi list. W nich przez przypominanie pobudzam wasz czysty umysł;"
  tags: []
"2P3,2":
  text: "Abyście pamiętali słowa wcześniej wypowiedziane przez świętych proroków oraz przykazanie od nas, którzy jesteśmy apostołami Pana i Zbawiciela."
  tags: []
"2P3,3":
  text: "Przede wszystkim to wiedzcie, że w ostatecznych dniach przyjdą szydercy, którzy będą postępować według swoich własnych pożądliwości;"
  tags: []
"2P3,4":
  text: "I będą mówili: Co z obietnicą jego przyjścia? Bo odkąd zasnęli ojcowie, wszystko tak trwa, jak od początku stworzenia."
  tags: []
"2P3,5":
  text: "Tego bowiem umyślnie nie chcą wiedzieć, że niebiosa były od dawna i ziemia z wody, i w wodzie stanęła przez słowo Boże;"
  tags: []
"2P3,6":
  text: "Przez które ówczesny świat, zalany wodą, zginął."
  tags: []
"2P3,7":
  text: "A obecne niebiosa i ziemia przez to samo słowo są utrzymane i zachowane dla ognia na dzień sądu i zatracenia bezbożnych ludzi."
  tags: []
"2P3,8":
  text: "Ale niech to jedno, umiłowani, nie będzie przed wami zakryte, że jeden dzień u Pana jest jak tysiąc lat, a tysiąc lat jak jeden dzień."
  tags: []
"2P3,9":
  text: "Nie zwleka Pan ze spełnieniem obietnicy, jak niektórzy uważają, że zwleka, ale okazuje względem nas cierpliwość, nie chcąc, aby ktokolwiek zginął, lecz aby wszyscy doszli do pokuty."
  tags: []
"2P3,10":
  text: "A jak złodziej w nocy przyjdzie dzień Pana, w którym niebiosa z wielkim hukiem przeminą, żywioły rozpalone ogniem stopią się, a ziemia i dzieła, które są na niej, spłoną."
  tags: []
"2P3,11":
  text: "Skoro to wszystko ma się rozpłynąć, to jakimi wy powinniście być w świętym postępowaniu i pobożności;"
  tags: []
"2P3,12":
  text: "Oczekując i spiesząc się na przyjście dnia Boga, w którym płonące niebiosa rozpuszczą się, a rozpalone żywioły się roztopią."
  tags: []
"2P3,13":
  text: "Lecz my, zgodnie z jego obietnicą, oczekujemy nowych niebios i nowej ziemi, w których mieszka sprawiedliwość."
  tags: []
"2P3,14":
  text: "Dlatego, umiłowani, oczekując tego, starajcie się, abyście zostali przez niego znalezieni bez skazy i nienaganni, w pokoju;"
  tags: []
"2P3,15":
  text: "A cierpliwość naszego Pana uważajcie za zbawienie, jak i nasz umiłowany brat Paweł według danej mu mądrości pisał do was;"
  tags: []
"2P3,16":
  text: "Jak też mówi o tym we wszystkich listach. Są w nich pewne rzeczy trudne do zrozumienia, które, podobnie jak inne Pisma, ludzie niedouczeni i nieutwierdzeni przekręcają ku swemu własnemu zatraceniu."
  tags: []
"2P3,17":
  text: "Wy zatem, umiłowani, wiedząc o tym wcześniej, miejcie się na baczności, abyście nie byli zwiedzeni przez błąd bezbożników i nie wypadli z waszej stałości."
  tags: []
"2P3,18":
  text: "Wzrastajcie zaś w łasce i poznaniu naszego Pana i Zbawiciela, Jezusa Chrystusa. Jemu chwała i teraz, i na wieczne czasy. Amen."
  tags: []
