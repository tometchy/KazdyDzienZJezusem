"2P2,1": "Byli też fałszywi prorocy wśród ludu, jak i wśród was będą fałszywi nauczyciele, którzy potajemnie wprowadzą herezje zatracenia, wypierając się Pana, który ich odkupił, i sprowadzą na siebie rychłą zgubę."
"2P2,2": "Wielu zaś podąży za ich zgubną drogą, a droga prawdy z ich powodu będzie bluźniona."
"2P2,3": "I z chciwości będą wami kupczyć przez zmyślone opowieści. Ich sąd od dawna nie zwleka, a ich zatracenie nie śpi."
"2P2,4": "Jeśli bowiem Bóg nie oszczędził aniołów, którzy zgrzeszyli, ale strąciwszy ich do piekła, wydał więzom ciemności, aby byli zachowani na sąd;"
"2P2,5": "Także dawnego świata nie oszczędził, ale zbawił jako ósmego Noego, kaznodzieję sprawiedliwości, gdy zesłał potop na świat bezbożnych;"
"2P2,6": "I miasta Sodomę i Gomorę, obracając w popiół, skazał na potępienie, stawiając je jako przykład dla tych, którzy żyją bezbożnie;"
"2P2,7": "A sprawiedliwego Lota, udręczonego rozpustnym postępowaniem bezbożników, wyrwał;"
"2P2,8": "(Ten sprawiedliwy bowiem, mieszkając wśród nich, patrząc i słuchając, trapił dzień po dniu swą sprawiedliwą duszę ich bezbożnymi uczynkami);"
"2P2,9": "Umie Pan pobożnych wyrwać z pokusy, a niesprawiedliwych zachować na dzień sądu, aby byli ukarani;"
"2P2,10": "Przede wszystkim zaś tych, którzy podążają za ciałem w nieczystej żądzy i pogardzają władzą. Zuchwali i samowolni, nie boją się bluźnić przeciwko przełożonym."
"2P2,11": "Tymczasem aniołowie, więksi siłą i mocą, nie wnoszą przeciwko nim przed Pana bluźnierczego oskarżenia."
"2P2,12": "Ale ci, jak nierozumne zwierzęta, z natury przeznaczone na schwytanie i zagładę, bluźnią przeciwko temu, czego nie znają, toteż zginą w swoim zepsuciu;"
"2P2,13": "I otrzymają zapłatę za niesprawiedliwość, skoro uważają za przyjemność hulanie za dnia. Zakały i plugawcy, upajają się swymi oszustwami, gdy z wami ucztują."
"2P2,14": "Mając oczy pełne cudzołóstwa i nieprzestające grzeszyć, zwabiają dusze niestałe. Serce mają wyćwiczone w chciwości, synowie przekleństwa."
"2P2,15": "Opuścili oni prostą drogę i zbłądzili, podążając drogą Balaama, syna Bosora, który umiłował zapłatę za niesprawiedliwość;"
"2P2,16": "Został jednak skarcony za swoją nieprawość: niema juczna oślica, przemówiwszy ludzkim głosem, powstrzymała szaleństwo proroka."
"2P2,17": "Oni są źródłami bez wody, obłokami pędzonymi przez wicher, dla których mroki ciemności zachowane są na wieki."
"2P2,18": "Mówiąc bowiem słowa wyniosłe i puste, zwabiają żądzami ciała i rozpustą tych, którzy prawdziwie uciekli od żyjących w błędzie."
"2P2,19": "Wolność im obiecują, a sami są niewolnikami zepsucia. Przez co bowiem jest ktoś pokonany, przez to też jest zniewolony."
"2P2,20": "Bo jeśli uciekli oni od plugastw świata przez poznanie Pana i Zbawiciela Jezusa Chrystusa, a potem znowu się w nie wikłają i zostają pokonani, to ich ostateczny stan jest gorszy niż pierwszy."
"2P2,21": "Lepiej bowiem byłoby dla nich nie poznać drogi sprawiedliwości, aniżeli poznawszy ją, odwrócić się od przekazanego im świętego przykazania."
"2P2,22": "Ale przydarzyło się im zgodnie z prawdziwym przysłowiem: Pies wrócił do swoich wymiocin, a świnia umyta do tarzania się w błocie."
