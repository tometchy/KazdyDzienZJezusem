"2Sm18,1":
  text: "Wtedy Dawid policzył lud, który z nim był, i ustanowił nad nim dowódców nad tysiącami i dowódców nad setkami."
  tags: []
"2Sm18,2":
  text: "Potem Dawid posłał trzecią część ludu pod ręką Joaba, trzecią część pod ręką Abiszaja, syna Serui, brata Joaba, i trzecią część pod ręką Ittaja Gittyty. I król powiedział do ludu: Ja również wyruszę z wami."
  tags: []
"2Sm18,3":
  text: "Ale lud odpowiedział: Nie wyruszysz. Jeśli bowiem my uciekniemy, oni nie zwrócą na nas uwagi, i choćby połowa z nas poległa, też nie zwrócą na nas uwagi. Ty zaś jesteś dla nas jak dziesięć tysięcy. Teraz więc będzie lepiej, abyś mógł przyjść nam z pomocą z miasta."
  tags: []
"2Sm18,4":
  text: "Odpowiedział im król: Uczynię to, co wydaje się wam słuszne. Król stanął więc przy bramie, a cały lud wychodził setkami i tysiącami."
  tags: []
"2Sm18,5":
  text: "I król nakazał Joabowi, Abiszajowi i Ittajowi: Łagodnie traktujcie mi młodzieńca, Absaloma. A cały lud słyszał, jak król wydał wszystkim dowódcom rozkaz o Absalomie."
  tags: []
"2Sm18,6":
  text: "Lud wyruszył więc w pole przeciw Izraelowi i doszło do bitwy w lesie Efraima."
  tags: []
"2Sm18,7":
  text: "Lud Izraela został tam pobity przez sługi Dawida i stała się wielka klęska tego dnia: poległo dwadzieścia tysięcy osób."
  tags: []
"2Sm18,8":
  text: "Bitwa bowiem rozproszyła się na całą okolicę, a las pochłonął tego dnia więcej ludzi, niż pożarł miecz."
  tags: []
"2Sm18,9":
  text: "I Absalom natknął się na sługi Dawida. Absalom jechał na mule, a muł wbiegł pod gęste gałęzie wielkiego dębu. Wtedy jego głowa zaczepiła się o dąb i zawisł między niebem a ziemią. Lecz muł, który był pod nim, poszedł dalej."
  tags: []
"2Sm18,10":
  text: "Zobaczył to pewien człowiek i powiadomił Joaba: Oto widziałem Absaloma wiszącego na dębie."
  tags: []
"2Sm18,11":
  text: "Wtedy Joab powiedział do człowieka, który go o tym powiadomił: Jeśli widziałeś, to czemu go tam nie zabiłeś i nie zrzuciłeś na ziemię? Dałbym ci dziesięć srebrników i jeden pas."
  tags: []
"2Sm18,12":
  text: "Człowiek ten odpowiedział Joabowi: Choćbym otrzymał na ręce tysiąc srebrników, nie podniósłbym ręki na syna króla. Słyszeliśmy bowiem, jak król nakazał tobie, Abiszajowi i Ittajowi: Zachowajcie wszyscy młodzieńca, Absaloma."
  tags: []
"2Sm18,13":
  text: "Chyba że chciałbym postąpić zdradliwie przeciw własnej duszy, gdyż żadna sprawa nie jest tajona przed królem. Nawet ty sam byłbyś przeciwko mnie."
  tags: []
"2Sm18,14":
  text: "Wtedy Joab odpowiedział: Nie będę z tobą tracić czasu. Wziął więc do ręki trzy strzały i wbił je w serce Absaloma, gdy ten jeszcze wisiał żywy na dębie."
  tags: []
"2Sm18,15":
  text: "Potem dziesięciu młodzieńców, giermków Joaba, otoczyło Absaloma – bili go i zabili."
  tags: []
"2Sm18,16":
  text: "Wtedy Joab zadął w trąbę i lud wrócił z pogoni za Izraelem, bo Joab zatrzymał lud."
  tags: []
"2Sm18,17":
  text: "Wzięli zaś Absaloma, wrzucili go do głębokiego dołu w tym lesie i wznieśli nad nim wielki stos kamieni. I cały Izrael uciekł, każdy do swego namiotu."
  tags: []
"2Sm18,18":
  text: "A Absalom za swego życia postawił sobie pomnik w dolinie królewskiej, bo mówił: Nie mam syna, który by upamiętnił moje imię. Nazwał więc ten pomnik swoim imieniem i zwie się on Miejscem Absaloma aż do dziś."
  tags: []
"2Sm18,19":
  text: "Wtedy Achimaas, syn Sadoka, powiedział: Pozwól mi iść i zanieść królowi dobrą nowinę, że PAN wybawił go z ręki jego wrogów."
  tags: []
"2Sm18,20":
  text: "Lecz Joab mu odpowiedział: Nie byłbyś dziś zwiastunem dobrej nowiny, lecz zaniesiesz ją w innym dniu. Dziś natomiast nie zaniesiesz dobrej nowiny, gdyż zginął syn króla."
  tags: []
"2Sm18,21":
  text: "Potem Joab odezwał się do Kuszego: Idź i opowiedz królowi, co widziałeś. Kusz pokłonił się Joabowi i pobiegł."
  tags: []
"2Sm18,22":
  text: "Achimaas, syn Sadoka, ponownie powiedział do Joaba: Niech się dzieje, co chce, pozwól, proszę, bym pobiegł za Kuszem. Joab zapytał: Dlaczego miałbyś biec, mój synu, skoro nie masz żadnej dobrej wieści do zwiastowania?"
  tags: []
"2Sm18,23":
  text: "Odpowiedział: Niech się dzieje, co chce, pobiegnę. Joab mu powiedział: Biegnij. Achimaas pobiegł więc prostszą drogą i wyprzedził Kuszego."
  tags: []
"2Sm18,24":
  text: "A Dawid siedział między dwiema bramami. I strażnik wszedł na dach bramy przy murze, a gdy podniósł oczy, zobaczył, że jakiś mężczyzna biegnie samotnie."
  tags: []
"2Sm18,25":
  text: "Wtedy strażnik zawołał i powiadomił o tym króla. Król powiedział: Jeśli jest sam, to w jego ustach jest dobra nowina. A gdy ten szedł spiesznie i zbliżał się;"
  tags: []
"2Sm18,26":
  text: "Strażnik zobaczył drugiego biegnącego mężczyznę. I strażnik zawołał do odźwiernego: Oto biegnie samotnie drugi mężczyzna. Król powiedział: Ten również przynosi dobrą nowinę."
  tags: []
"2Sm18,27":
  text: "Wtedy strażnik powiedział: Wydaje mi się, że bieg pierwszego przypomina bieg Achimaasa, syna Sadoka. Król odpowiedział: To dobry człowiek, przychodzi z dobrą nowiną."
  tags: []
"2Sm18,28":
  text: "Achimaas zawołał do króla: Pokój! I pokłonił się królowi twarzą do ziemi, i powiedział: Niech będzie błogosławiony PAN, twój Bóg, który wydał tych ludzi, którzy podnieśli ręce przeciw memu panu, królowi."
  tags: []
"2Sm18,29":
  text: "Król zapytał: Czy dobrze się ma młodzieniec Absalom? Achimaas odpowiedział: Widziałem wielkie zamieszanie, gdy Joab wysyłał sługę króla i mnie, twego sługę, ale nie wiem, co to było."
  tags: []
"2Sm18,30":
  text: "Potem król powiedział: Odejdź na bok i stań tam. On więc odstąpił i stanął."
  tags: []
"2Sm18,31":
  text: "Wtedy przybył Kusz i powiedział: Mam dobrą nowinę, mój panie, królu! PAN cię wybawił dzisiaj z ręki wszystkich, którzy powstali przeciw tobie."
  tags: []
"2Sm18,32":
  text: "Król zapytał Kuszego: Czy dobrze się ma młodzieniec Absalom? Odpowiedział Kusz: Oby wrogowie mego pana, króla, i wszyscy, którzy powstają przeciw tobie na nieszczęście, byli jak ten młodzieniec!"
  tags: []
"2Sm18,33":
  text: "Wtedy król zasmucił się, wstąpił do komnaty nad bramą i zapłakał. A idąc, tak mówił: Mój synu, Absalomie! Mój synu, mój synu, Absalomie! Obym ja umarł zamiast ciebie! Absalomie, mój synu, mój synu!"
  tags: []
