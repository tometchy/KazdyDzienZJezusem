"2Sm11,1":
  text: "Na początku roku, w czasie, kiedy królowie zwykli wyjeżdżać na wojnę, Dawid wysłał Joaba wraz ze swoimi sługami oraz cały Izrael. Spustoszyli oni synów Ammona i oblegli Rabbę. Dawid zaś został w Jerozolimie."
  tags: []
"2Sm11,2":
  text: "Pewnego dnia pod wieczór Dawid wstał z łoża i przechadzał się po dachu domu królewskiego. I zobaczył z dachu kąpiącą się kobietę, a kobieta była bardzo piękna."
  tags: []
"2Sm11,3":
  text: "I Dawid posłał, i zapytał o tę kobietę. I powiedziano mu: Czy to nie Batszeba, córka Eliama, żona Uriasza Chetyty?"
  tags: []
"2Sm11,4":
  text: "Dawid wysłał więc po nią posłańców i wziął ją. A gdy przyszła do niego, położył się z nią, gdyż była oczyszczona od swojej nieczystości. Potem wróciła do swego domu."
  tags: []
"2Sm11,5":
  text: "Kobieta ta poczęła, więc posłała, by zawiadomić Dawida: Jestem brzemienna."
  tags: []
"2Sm11,6":
  text: "Wtedy Dawid posłał do Joaba rozkaz: Przyślij do mnie Uriasza Chetytę. Joab wysłał więc Uriasza do Dawida."
  tags: []
"2Sm11,7":
  text: "A gdy Uriasz przybył do niego, Dawid pytał go o to, jak się wiedzie Joabowi, jak się wiedzie ludowi i jak przebiega wojna."
  tags: []
"2Sm11,8":
  text: "Następnie Dawid powiedział do Uriasza: Idź do swego domu i umyj sobie nogi. I Uriasz wyszedł z domu króla, a za nim niesiono potrawy od króla."
  tags: []
"2Sm11,9":
  text: "Lecz Uriasz spał przy bramie domu króla razem ze wszystkimi sługami swego pana, a do swojego domu nie poszedł."
  tags: []
"2Sm11,10":
  text: "I doniesiono Dawidowi: Uriasz nie poszedł do swego domu. Dawid zapytał Uriasza: Czy nie przybyłeś z podróży? Czemu więc nie poszedłeś do swego domu?"
  tags: []
"2Sm11,11":
  text: "Uriasz odpowiedział Dawidowi: Arka, Izrael i Juda przebywają w namiotach, mój pan Joab i słudzy mojego pana obozują w otwartym polu, a ja miałbym wejść do swojego domu, aby jeść, pić i spać ze swoją żoną? Jak żyjesz i jak żyje twoja dusza, nie uczynię tego."
  tags: []
"2Sm11,12":
  text: "Wtedy Dawid powiedział do Uriasza: Zostań tu jeszcze dziś, a jutro cię odprawię. I Uriasz został w Jerozolimie przez ten i kolejny dzień."
  tags: []
"2Sm11,13":
  text: "Potem Dawid wezwał go, aby jadł i pił w jego obecności, i upoił go. Lecz wieczorem wyszedł i spał na swoim łożu ze sługami swego pana, a do swego domu nie poszedł."
  tags: []
"2Sm11,14":
  text: "Następnego ranka Dawid napisał więc list do Joaba i wysłał go przez rękę Uriasza."
  tags: []
"2Sm11,15":
  text: "A w liście napisał tak: Postawcie Uriasza na czele najbardziej zaciętej bitwy, a potem odstąpcie od niego, aby został trafiony i zginął."
  tags: []
"2Sm11,16":
  text: "I kiedy Joab obejrzał miasto, postawił Uriasza w miejscu, o którym wiedział, że byli tam dzielni ludzie."
  tags: []
"2Sm11,17":
  text: "A gdy ludzie z miasta wypadli, stoczyli bitwę z Joabem i padło z ludu kilka sług Dawida, poległ także Uriasz Chetyta."
  tags: []
"2Sm11,18":
  text: "Wtedy Joab wysłał posłańca i zawiadomił Dawida o wszystkim, co działo się podczas bitwy."
  tags: []
"2Sm11,19":
  text: "A posłańcowi rozkazał: Gdy skończysz opowiadać królowi o tym, co się wydarzyło na bitwie;"
  tags: []
"2Sm11,20":
  text: "I jeśli król się rozgniewa, i zapyta: Czemu podeszliście tak blisko do miasta, by walczyć? Czyż nie wiedzieliście, że strzelają z muru?"
  tags: []
"2Sm11,21":
  text: "Kto zabił Abimeleka, syna Jerubbeszeta? Czyż nie kobieta, która zrzuciła na niego z muru kawałek kamienia młyńskiego, tak że umarł w Tebes? Czemu podeszliście do muru? Wtedy powiesz: Zginął również twój sługa Uriasz Chetyta."
  tags: []
"2Sm11,22":
  text: "Poszedł więc posłaniec, a gdy przybył, opowiedział Dawidowi wszystko, z czym wysłał go Joab."
  tags: []
"2Sm11,23":
  text: "Posłaniec mówił do Dawida: Tamci ludzie nas przemogli i wyszli przeciw nam na pole, a my ścigaliśmy ich aż do samej bramy."
  tags: []
"2Sm11,24":
  text: "Wtedy łucznicy strzelali z muru do twoich sług i zginęło kilku ze sług króla. Zginął również twój sługa Uriasz Chetyta."
  tags: []
"2Sm11,25":
  text: "Wtedy Dawid powiedział do posłańca: Tak powiesz Joabowi: Nie zamartwiaj się tą sprawą, bo miecz pożera raz tego, raz innego. Wzmocnij natarcie na miasto i zburz je, ty sam dodawaj mu otuchy."
  tags: []
"2Sm11,26":
  text: "A gdy żona Uriasza usłyszała, że jej mąż Uriasz umarł, zaczęła opłakiwać swego męża."
  tags: []
"2Sm11,27":
  text: "Kiedy żałoba przeminęła, Dawid posłał po nią i sprowadził ją do swego domu. Została jego żoną i urodziła mu syna. Lecz to, co zrobił Dawid, nie podobało się PANU."
  tags: []
