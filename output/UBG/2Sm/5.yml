"2Sm5,1":
  text: "Wtedy wszystkie pokolenia Izraela zeszły się u Dawida w Hebronie i powiedziały: Oto jesteśmy twoją kością i twoim ciałem."
  tags: []
"2Sm5,2":
  text: "Już dawniej, gdy Saul był królem nad nami, ty wyprowadzałeś i przyprowadzałeś Izraela. I PAN powiedział do ciebie: Ty będziesz pasł mój lud Izraela i ty będziesz wodzem nad Izraelem."
  tags: []
"2Sm5,3":
  text: "Wszyscy starsi Izraela przyszli więc do króla do Hebronu i król Dawid zawarł z nimi przymierze w Hebronie przed PANEM, a oni namaścili Dawida na króla nad Izraelem."
  tags: []
"2Sm5,4":
  text: "Dawid miał trzydzieści lat, gdy zaczął królować, a królował czterdzieści lat."
  tags: []
"2Sm5,5":
  text: "W Hebronie królował nad Judą siedem lat i sześć miesięcy, w Jerozolimie zaś królował trzydzieści trzy lata nad całym Izraelem i Judą."
  tags: []
"2Sm5,6":
  text: "I król oraz jego ludzie poszli do Jerozolimy przeciw Jebusytom zamieszkującym w tej ziemi, a oni powiedzieli do Dawida: Nie wejdziesz tutaj, dopóki nie wyniesiesz ślepych i chromych. Myśleli bowiem: Dawid tu nie wejdzie."
  tags: []
"2Sm5,7":
  text: "Dawid jednak zdobył twierdzę Syjon, to jest miasto Dawida."
  tags: []
"2Sm5,8":
  text: "Dawid powiedział w tym dniu: Ktokolwiek pokona Jebusytów, wchodząc przez kanał, i zabije ślepych i chromych, których nienawidzi dusza Dawida, ustanowię go dowódcą. Dlatego mówiono: Ślepi i chromi nie wejdą do tego domu."
  tags: []
"2Sm5,9":
  text: "I tak zamieszkał Dawid w tej twierdzy, i nazwał ją miastem Dawida. Dawid obudował je też wokoło, od Millo i wnętrza."
  tags: []
"2Sm5,10":
  text: "I Dawid stale wzrastał w potędze, a PAN Bóg zastępów był z nim."
  tags: []
"2Sm5,11":
  text: "Wtedy Hiram, król Tyru, wysłał posłańców do Dawida z drzewem cedrowym, cieślami i murarzami i zbudowali dom dla Dawida."
  tags: []
"2Sm5,12":
  text: "I Dawid poznał, że PAN utwierdził go jako króla nad Izraelem i że wywyższył jego królestwo ze względu na swój lud Izraela."
  tags: []
"2Sm5,13":
  text: "A po przybyciu z Hebronu Dawid wziął sobie jeszcze więcej nałożnic i żon z Jerozolimy. I urodziło się Dawidowi więcej synów i córek."
  tags: []
"2Sm5,14":
  text: "Oto imiona tych, którzy mu się urodzili w Jerozolimie: Szammua, Szobab, Natan i Salomon;"
  tags: []
"2Sm5,15":
  text: "Jibchar, Eliszua, Nefeg i Jafia;"
  tags: []
"2Sm5,16":
  text: "Eliszama, Eliada i Elifelet."
  tags: []
"2Sm5,17":
  text: "A gdy Filistyni usłyszeli, że Dawid został namaszczony na króla nad Izraelem, wszyscy Filistyni wyruszyli, aby szukać Dawida. Kiedy Dawid o tym usłyszał, zstąpił do twierdzy."
  tags: []
"2Sm5,18":
  text: "Wtedy Filistyni przybyli i rozciągnęli się w dolinie Refaim."
  tags: []
"2Sm5,19":
  text: "I Dawid radził się PANA: Czy mam ruszyć na Filistynów? Czy wydasz ich w moje ręce? PAN odpowiedział Dawidowi: Idź, gdyż z całą pewnością wydam Filistynów w twoje ręce."
  tags: []
"2Sm5,20":
  text: "Dawid przybył więc do Baal-Perasim i tam ich pobił, i powiedział: PAN rozerwał moich wrogów przede mną jak rwąca woda. Dlatego nazwał to miejsce Baal-Perasim."
  tags: []
"2Sm5,21":
  text: "I porzucili tam swoje bożki, a Dawid i jego ludzie spalili je."
  tags: []
"2Sm5,22":
  text: "I Filistyni znowu nadciągnęli, i rozciągnęli się w dolinie Refaim."
  tags: []
"2Sm5,23":
  text: "Gdy Dawid radził się PANA, PAN odpowiedział: Nie ruszaj na nich, lecz obejdź ich z tyłu i uderz na nich od strony drzew morwowych."
  tags: []
"2Sm5,24":
  text: "A gdy usłyszysz odgłos kroków dochodzących od wierzchołków drzew morwowych, wtedy wyruszysz, gdyż wtedy PAN wyjdzie przed tobą, aby pokonać wojska Filistynów."
  tags: []
"2Sm5,25":
  text: "I Dawid uczynił tak, jak mu PAN rozkazał, i pobił Filistynów od Geba aż do wejścia do Gezer."
  tags: []
