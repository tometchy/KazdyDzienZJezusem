"2Sm9,1":
  text: "Wtedy Dawid zapytał: Czy pozostał jeszcze ktoś z domu Saula, abym mógł okazać mu miłosierdzie ze względu na Jonatana?"
  tags: []
"2Sm9,2":
  text: "A z domu Saula był sługa imieniem Siba. Został on wezwany do Dawida i król zapytał go: Czy ty jesteś Siba? Odpowiedział: To ja, twój sługa."
  tags: []
"2Sm9,3":
  text: "Król pytał dalej: Czy nie ma jeszcze kogoś z domu Saula, abym mógł okazać mu miłosierdzie Boże? Siba odpowiedział królowi: Jest jeszcze syn Jonatana, chromy na nogi."
  tags: []
"2Sm9,4":
  text: "Król zapytał go: Gdzie on jest? Siba odpowiedział królowi: Oto jest w domu Makira, syna Ammiela, w Lo-Debar."
  tags: []
"2Sm9,5":
  text: "Król Dawid posłał więc, by go sprowadzić z domu Makira, syna Ammiela, z Lo-Debar."
  tags: []
"2Sm9,6":
  text: "A gdy Mefiboszet, syn Jonatana, syna Saula, przybył do Dawida, upadł na twarz i pokłonił mu się. I Dawid powiedział: Mefiboszecie! Ten odpowiedział: Oto twój sługa."
  tags: []
"2Sm9,7":
  text: "Dawid powiedział do niego: Nie bój się, bo z całą pewnością okażę ci miłosierdzie ze względu na twego ojca Jonatana i przywrócę ci wszystkie ziemie twego ojca Saula, a ty zawsze będziesz jadał chleb przy moim stole."
  tags: []
"2Sm9,8":
  text: "Wtedy ukłonił się i powiedział: Czym jest twój sługa, że zwracasz się do zdechłego psa, jakim jestem?"
  tags: []
"2Sm9,9":
  text: "Następnie król wezwał Sibę, sługę Saula, i powiedział mu: Wszystko, co należało do Saula i do całego jego domu, dałem synowi twego pana."
  tags: []
"2Sm9,10":
  text: "Będziesz więc uprawiał jego ziemię, ty, twoi synowie i twoi słudzy. Będziesz zbierał plony, aby syn twego pana mógł jeść chleb. Mefiboszet natomiast, syn twego pana, będzie zawsze jadał chleb przy moim stole. A Siba miał piętnastu synów i dwudziestu sług."
  tags: []
"2Sm9,11":
  text: "Siba odpowiedział królowi: Wszystko, co mój pan, król, rozkazał swemu słudze, to twój sługa uczyni. A Mefiboszet – dodał król – będzie jadał przy moim stole jak jeden z synów króla."
  tags: []
"2Sm9,12":
  text: "Mefiboszet miał też małego syna imieniem Mika. A wszyscy, którzy mieszkali w domu Siby, byli sługami Mefiboszeta."
  tags: []
"2Sm9,13":
  text: "Tak Mefiboszet mieszkał w Jerozolimie, gdyż zawsze jadał przy stole króla. A był chromy na obie nogi."
  tags: []
