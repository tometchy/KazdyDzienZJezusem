"2Sm9,1": "Wtedy Dawid zapytał: Czy pozostał jeszcze ktoś z domu Saula, abym mógł okazać mu miłosierdzie ze względu na Jonatana?"
"2Sm9,2": "A z domu Saula był sługa imieniem Siba. Został on wezwany do Dawida i król zapytał go: Czy ty jesteś Siba? Odpowiedział: To ja, twój sługa."
"2Sm9,3": "Król pytał dalej: Czy nie ma jeszcze kogoś z domu Saula, abym mógł okazać mu miłosierdzie Boże? Siba odpowiedział królowi: Jest jeszcze syn Jonatana, chromy na nogi."
"2Sm9,4": "Król zapytał go: Gdzie on jest? Siba odpowiedział królowi: Oto jest w domu Makira, syna Ammiela, w Lo-Debar."
"2Sm9,5": "Król Dawid posłał więc, by go sprowadzić z domu Makira, syna Ammiela, z Lo-Debar."
"2Sm9,6": "A gdy Mefiboszet, syn Jonatana, syna Saula, przybył do Dawida, upadł na twarz i pokłonił mu się. I Dawid powiedział: Mefiboszecie! Ten odpowiedział: Oto twój sługa."
"2Sm9,7": "Dawid powiedział do niego: Nie bój się, bo z całą pewnością okażę ci miłosierdzie ze względu na twego ojca Jonatana i przywrócę ci wszystkie ziemie twego ojca Saula, a ty zawsze będziesz jadał chleb przy moim stole."
"2Sm9,8": "Wtedy ukłonił się i powiedział: Czym jest twój sługa, że zwracasz się do zdechłego psa, jakim jestem?"
"2Sm9,9": "Następnie król wezwał Sibę, sługę Saula, i powiedział mu: Wszystko, co należało do Saula i do całego jego domu, dałem synowi twego pana."
"2Sm9,10": "Będziesz więc uprawiał jego ziemię, ty, twoi synowie i twoi słudzy. Będziesz zbierał plony, aby syn twego pana mógł jeść chleb. Mefiboszet natomiast, syn twego pana, będzie zawsze jadał chleb przy moim stole. A Siba miał piętnastu synów i dwudziestu sług."
"2Sm9,11": "Siba odpowiedział królowi: Wszystko, co mój pan, król, rozkazał swemu słudze, to twój sługa uczyni. A Mefiboszet – dodał król – będzie jadał przy moim stole jak jeden z synów króla."
"2Sm9,12": "Mefiboszet miał też małego syna imieniem Mika. A wszyscy, którzy mieszkali w domu Siby, byli sługami Mefiboszeta."
"2Sm9,13": "Tak Mefiboszet mieszkał w Jerozolimie, gdyż zawsze jadał przy stole króla. A był chromy na obie nogi."
