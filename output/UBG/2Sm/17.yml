"2Sm17,1":
  text: "Potem Achitofel powiedział do Absaloma: Pozwól, że wybiorę dwanaście tysięcy mężczyzn i wyruszę tej nocy w pościg za Dawidem;"
  tags: []
"2Sm17,2":
  text: "I napadnę na niego, póki jest znużony i ręce ma słabe, i przerażę go. Ucieknie cały lud, który jest z nim, a ja zabiję samego króla."
  tags: []
"2Sm17,3":
  text: "I przyprowadzę cały lud do ciebie, gdyż życie człowieka, na które nastajesz, jest jakby powrócili wszyscy do ciebie. Wtedy cały lud będzie miał pokój."
  tags: []
"2Sm17,4":
  text: "Spodobało się to Absalomowi i wszystkim starszym Izraela."
  tags: []
"2Sm17,5":
  text: "Absalom powiedział jednak: Zawołajcie szybko również Chuszaja Arkitę i posłuchajmy także, co on powie."
  tags: []
"2Sm17,6":
  text: "A gdy Chuszaj przyszedł do Absaloma, Absalom powiedział do niego: Tak powiedział Achitofel – czy mamy postąpić według jego rady? Jeśli nie, powiedz."
  tags: []
"2Sm17,7":
  text: "Wtedy Chuszaj odpowiedział Absalomowi: Rada, którą tym razem dał Achitofel, nie jest dobra."
  tags: []
"2Sm17,8":
  text: "Chuszaj dodał: Znasz swego ojca i jego ludzi. Są dzielnymi wojownikami rozjuszonymi w sercu jak niedźwiedzica na polu, której zabrano młode. Ponadto twój ojciec jest wojownikiem i nie będzie nocował z ludem."
  tags: []
"2Sm17,9":
  text: "A teraz zapewne ukrywa się w jakiejś jaskini albo w jakimś innym miejscu. I jeśli ktoś z twoich padnie na początku, to wtedy każdy, kto o tym usłyszy, powie: Klęska spadła na lud, który szedł za Absalomem."
  tags: []
"2Sm17,10":
  text: "Wtedy nawet najdzielniejszy, którego serce jest jak serce lwa, struchleje. Cały Izrael bowiem wie, że twój ojciec jest dzielny, a wszyscy, którzy są z nim, są mężni."
  tags: []
"2Sm17,11":
  text: "Dlatego radzę, aby zgromadzić przy sobie cały Izrael, od Dan aż do Beer-Szeby, tak licznie, jak liczny jest piasek nad morzem, i abyś ty osobiście wyruszył na bitwę."
  tags: []
"2Sm17,12":
  text: "A tak napadniemy na niego w którymś miejscu, gdzie się znajduje, i spadniemy na niego, jak rosa spada na ziemię. I nie pozostanie ani on, ani żaden z tych wszystkich mężczyzn, którzy są z nim."
  tags: []
"2Sm17,13":
  text: "A jeśli schronił się w którymś mieście, wtedy cały Izrael przyniesie do tego miasta powrozy, a ściągniemy je aż do potoku, tak że nie zostanie tam ani jeden kamyk."
  tags: []
"2Sm17,14":
  text: "Wtedy Absalom i wszyscy mężczyźni Izraela powiedzieli: Lepsza jest rada Chuszaja Arkity niż rada Achitofela. PAN bowiem postanowił zniweczyć dobrą radę Achitofela, aby PAN sprowadził nieszczęście na Absaloma."
  tags: []
"2Sm17,15":
  text: "I Chuszaj opowiedział kapłanom Sadokowi i Abiatarowi: Tak a tak radził Achitofel Absalomowi i starszym Izraela, lecz ja tak a tak radziłem."
  tags: []
"2Sm17,16":
  text: "Teraz więc szybko poślijcie i donieście Dawidowi: Nie zatrzymuj się tej nocy w równinach pustyni, lecz bezzwłocznie przepraw się, aby król nie został pochłonięty wraz z całym ludem, który jest z nim."
  tags: []
"2Sm17,17":
  text: "A Jonatan i Achimaas stali przy Enrogel. I przyszła dziewczyna, i przekazała im wieści, a oni poszli i donieśli o tym królowi Dawidowi. Nie mogli się bowiem pokazywać, wchodząc do miasta."
  tags: []
"2Sm17,18":
  text: "Zobaczył ich jednak pewien chłopiec i doniósł Absalomowi. Lecz oni obaj szybko poszli i weszli do domu pewnego człowieka w Bachurim, który miał studnię na swoim podwórzu, i weszli do niej."
  tags: []
"2Sm17,19":
  text: "Potem kobieta wzięła płachtę, rozciągnęła ją z wierzchu na studni i rozsypała na niej ziarno. I niczego nie zauważono."
  tags: []
"2Sm17,20":
  text: "Kiedy przyszli słudzy Absaloma do domu tej kobiety, zapytali: Gdzie są Achimaas i Jonatan? Kobieta odpowiedziała im: Przeszli przez rzekę. A gdy szukali ich i nie znaleźli, powrócili do Jerozolimy."
  tags: []
"2Sm17,21":
  text: "Po ich odejściu tamci wyszli ze studni i poszli powiadomić króla Dawida. Powiedzieli do niego: Wstańcie i przeprawcie się szybko przez wodę. Achitofel bowiem tak a tak radził przeciwko wam."
  tags: []
"2Sm17,22":
  text: "Dawid wstał więc wraz z całym ludem, który z nim był, i przeprawili się przez Jordan. Do brzasku nie brakowało ani jednego człowieka, który by się nie przeprawił przez Jordan."
  tags: []
"2Sm17,23":
  text: "Kiedy Achitofel zobaczył, że nie postąpiono zgodnie z jego radą, osiodłał osła, wstał i wrócił do swego domu, do swego miasta. Potem wydał zarządzenia odnośnie do swego domu, powiesił się i umarł, a został pogrzebany w grobie swego ojca."
  tags: []
"2Sm17,24":
  text: "A Dawid już przybył do Machanaim, gdy Absalom przeprawił się przez Jordan, on i wszyscy mężczyźni Izraela z nim."
  tags: []
"2Sm17,25":
  text: "I Absalom ustanowił Amasę dowódcą wojska w miejsce Joaba. Amasa był synem mężczyzny imieniem Jitra, Izraelity, który obcował z Abigail, córką Nachasza, siostrą Serui, matki Joaba."
  tags: []
"2Sm17,26":
  text: "A Izrael i Absalom rozbili obóz w ziemi Gilead."
  tags: []
"2Sm17,27":
  text: "I kiedy Dawid przybył do Machanaim, Szobi, syn Nachasza z Rabby synów Ammona, i Makir, syn Ammiela z Lo-Debar, i Barzillaj, Gileadczyk z Rogelim;"
  tags: []
"2Sm17,28":
  text: "Przynieśli posłania, misy, naczynia gliniane, pszenicę, jęczmień, mąkę, ziarno prażone, bób, soczewicę, prażony groch;"
  tags: []
"2Sm17,29":
  text: "Miód, masło, owce i sery krowie. Przynieśli Dawidowi i ludowi, który był z nim, na pożywienie. Mówili bowiem: Lud jest głodny, znużony i spragniony na pustyni."
  tags: []
