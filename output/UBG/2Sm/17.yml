"2Sm17,1": "Potem Achitofel powiedział do Absaloma: Pozwól, że wybiorę dwanaście tysięcy mężczyzn i wyruszę tej nocy w pościg za Dawidem;"
"2Sm17,2": "I napadnę na niego, póki jest znużony i ręce ma słabe, i przerażę go. Ucieknie cały lud, który jest z nim, a ja zabiję samego króla."
"2Sm17,3": "I przyprowadzę cały lud do ciebie, gdyż życie człowieka, na które nastajesz, jest jakby powrócili wszyscy do ciebie. Wtedy cały lud będzie miał pokój."
"2Sm17,4": "Spodobało się to Absalomowi i wszystkim starszym Izraela."
"2Sm17,5": "Absalom powiedział jednak: Zawołajcie szybko również Chuszaja Arkitę i posłuchajmy także, co on powie."
"2Sm17,6": "A gdy Chuszaj przyszedł do Absaloma, Absalom powiedział do niego: Tak powiedział Achitofel – czy mamy postąpić według jego rady? Jeśli nie, powiedz."
"2Sm17,7": "Wtedy Chuszaj odpowiedział Absalomowi: Rada, którą tym razem dał Achitofel, nie jest dobra."
"2Sm17,8": "Chuszaj dodał: Znasz swego ojca i jego ludzi. Są dzielnymi wojownikami rozjuszonymi w sercu jak niedźwiedzica na polu, której zabrano młode. Ponadto twój ojciec jest wojownikiem i nie będzie nocował z ludem."
"2Sm17,9": "A teraz zapewne ukrywa się w jakiejś jaskini albo w jakimś innym miejscu. I jeśli ktoś z twoich padnie na początku, to wtedy każdy, kto o tym usłyszy, powie: Klęska spadła na lud, który szedł za Absalomem."
"2Sm17,10": "Wtedy nawet najdzielniejszy, którego serce jest jak serce lwa, struchleje. Cały Izrael bowiem wie, że twój ojciec jest dzielny, a wszyscy, którzy są z nim, są mężni."
"2Sm17,11": "Dlatego radzę, aby zgromadzić przy sobie cały Izrael, od Dan aż do Beer-Szeby, tak licznie, jak liczny jest piasek nad morzem, i abyś ty osobiście wyruszył na bitwę."
"2Sm17,12": "A tak napadniemy na niego w którymś miejscu, gdzie się znajduje, i spadniemy na niego, jak rosa spada na ziemię. I nie pozostanie ani on, ani żaden z tych wszystkich mężczyzn, którzy są z nim."
"2Sm17,13": "A jeśli schronił się w którymś mieście, wtedy cały Izrael przyniesie do tego miasta powrozy, a ściągniemy je aż do potoku, tak że nie zostanie tam ani jeden kamyk."
"2Sm17,14": "Wtedy Absalom i wszyscy mężczyźni Izraela powiedzieli: Lepsza jest rada Chuszaja Arkity niż rada Achitofela. PAN bowiem postanowił zniweczyć dobrą radę Achitofela, aby PAN sprowadził nieszczęście na Absaloma."
"2Sm17,15": "I Chuszaj opowiedział kapłanom Sadokowi i Abiatarowi: Tak a tak radził Achitofel Absalomowi i starszym Izraela, lecz ja tak a tak radziłem."
"2Sm17,16": "Teraz więc szybko poślijcie i donieście Dawidowi: Nie zatrzymuj się tej nocy w równinach pustyni, lecz bezzwłocznie przepraw się, aby król nie został pochłonięty wraz z całym ludem, który jest z nim."
"2Sm17,17": "A Jonatan i Achimaas stali przy Enrogel. I przyszła dziewczyna, i przekazała im wieści, a oni poszli i donieśli o tym królowi Dawidowi. Nie mogli się bowiem pokazywać, wchodząc do miasta."
"2Sm17,18": "Zobaczył ich jednak pewien chłopiec i doniósł Absalomowi. Lecz oni obaj szybko poszli i weszli do domu pewnego człowieka w Bachurim, który miał studnię na swoim podwórzu, i weszli do niej."
"2Sm17,19": "Potem kobieta wzięła płachtę, rozciągnęła ją z wierzchu na studni i rozsypała na niej ziarno. I niczego nie zauważono."
"2Sm17,20": "Kiedy przyszli słudzy Absaloma do domu tej kobiety, zapytali: Gdzie są Achimaas i Jonatan? Kobieta odpowiedziała im: Przeszli przez rzekę. A gdy szukali ich i nie znaleźli, powrócili do Jerozolimy."
"2Sm17,21": "Po ich odejściu tamci wyszli ze studni i poszli powiadomić króla Dawida. Powiedzieli do niego: Wstańcie i przeprawcie się szybko przez wodę. Achitofel bowiem tak a tak radził przeciwko wam."
"2Sm17,22": "Dawid wstał więc wraz z całym ludem, który z nim był, i przeprawili się przez Jordan. Do brzasku nie brakowało ani jednego człowieka, który by się nie przeprawił przez Jordan."
"2Sm17,23": "Kiedy Achitofel zobaczył, że nie postąpiono zgodnie z jego radą, osiodłał osła, wstał i wrócił do swego domu, do swego miasta. Potem wydał zarządzenia odnośnie do swego domu, powiesił się i umarł, a został pogrzebany w grobie swego ojca."
"2Sm17,24": "A Dawid już przybył do Machanaim, gdy Absalom przeprawił się przez Jordan, on i wszyscy mężczyźni Izraela z nim."
"2Sm17,25": "I Absalom ustanowił Amasę dowódcą wojska w miejsce Joaba. Amasa był synem mężczyzny imieniem Jitra, Izraelity, który obcował z Abigail, córką Nachasza, siostrą Serui, matki Joaba."
"2Sm17,26": "A Izrael i Absalom rozbili obóz w ziemi Gilead."
"2Sm17,27": "I kiedy Dawid przybył do Machanaim, Szobi, syn Nachasza z Rabby synów Ammona, i Makir, syn Ammiela z Lo-Debar, i Barzillaj, Gileadczyk z Rogelim;"
"2Sm17,28": "Przynieśli posłania, misy, naczynia gliniane, pszenicę, jęczmień, mąkę, ziarno prażone, bób, soczewicę, prażony groch;"
"2Sm17,29": "Miód, masło, owce i sery krowie. Przynieśli Dawidowi i ludowi, który był z nim, na pożywienie. Mówili bowiem: Lud jest głodny, znużony i spragniony na pustyni."
