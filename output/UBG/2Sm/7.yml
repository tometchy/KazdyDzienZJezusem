"2Sm7,1": "Gdy król zamieszkał w swoim domu, a PAN dał mu odpoczynek od wszystkich jego wrogów wokoło;"
"2Sm7,2": "Król powiedział do proroka Natana: Zobacz, proszę, ja mieszkam w domu cedrowym, a arka Boga mieszka za zasłoną."
"2Sm7,3": "Wtedy Natan odpowiedział królowi: Idź i uczyń wszystko, co jest w twoim sercu, gdyż PAN jest z tobą."
"2Sm7,4": "Lecz tej samej nocy doszło do Natana słowo PANA:"
"2Sm7,5": "Idź i powiedz mojemu słudze Dawidowi: Tak mówi PAN: Czy ty zbudujesz mi dom, abym w nim mieszkał?"
"2Sm7,6": "Nie mieszkałem bowiem w żadnym domu od dnia, w którym wyprowadziłem synów Izraela z Egiptu, aż do dziś, lecz wędrowałem w namiocie i w przybytku."
"2Sm7,7": "I wszędzie, gdzie wędrowałem ze wszystkimi synami Izraela, czy powiedziałem do któregoś z sędziów Izraela, którym nakazałem paść mój lud Izraela: Dlaczego nie budujecie mi domu cedrowego?"
"2Sm7,8": "Teraz więc tak powiesz mojemu słudze Dawidowi: Tak mówi PAN zastępów: Wziąłem ciebie z owczarni, gdzie chodziłeś za owcami, abyś był wodzem nad moim ludem, nad Izraelem."
"2Sm7,9": "I byłem z tobą wszędzie, dokądkolwiek chodziłeś, wytraciłem przed tobą wszystkich twoich wrogów i uczyniłem twoje imię wielkim jak imię wielkich ludzi, którzy są na ziemi."
"2Sm7,10": "Ustanowię miejsce dla mojego ludu Izraela i zasadzę go tam, by mógł mieszkać na swoim miejscu, i nie poruszy się więcej ani już nie będą go uciskać synowie nieprawości jak dawniej;"
"2Sm7,11": "Od czasu, kiedy ustanowiłem sędziów nad moim ludem Izraelem i dałem ci odpoczynek od wszystkich twoich wrogów. Tobie też PAN oznajmia, że zbuduje ci dom."
"2Sm7,12": "Gdy się dopełnią twoje dni i zaśniesz ze swoimi ojcami, wzbudzę po tobie twojego potomka, który wyjdzie z twego wnętrza, i umocnię jego królestwo."
"2Sm7,13": "On zbuduje dom dla mojego imienia, a ja utwierdzę tron jego królestwa na wieki."
"2Sm7,14": "Ja będę mu ojcem, a on będzie mi synem. Jeśli zgrzeszy, skarcę go rózgą ludzką i razami synów ludzkich."
"2Sm7,15": "Lecz moje miłosierdzie nie odstąpi od niego, tak jak je cofnąłem od Saula, którego odrzuciłem przed tobą."
"2Sm7,16": "I twój dom, i twoje królestwo będą utwierdzone na wieki przed tobą, a twój tron będzie trwał na wieki."
"2Sm7,17": "Zgodnie z tymi wszystkimi słowami i zgodnie z tym całym widzeniem mówił Natan do Dawida."
"2Sm7,18": "Wtedy wszedł król Dawid, usiadł przed PANEM i przemówił: Kimże ja jestem, Panie BOŻE, i czymże jest mój dom, że doprowadziłeś mnie aż dotąd?"
"2Sm7,19": "Lecz i to było jeszcze mało w twoich oczach, Panie BOŻE, gdyż złożyłeś również obietnicę o domu twojego sługi na daleką przyszłość. Czy taki jest zwyczaj u ludzi, Panie BOŻE?"
"2Sm7,20": "I cóż więcej może powiedzieć ci Dawid? Ty bowiem znasz swojego sługę, Panie BOŻE."
"2Sm7,21": "Ze względu na twoje słowo i zgodnie z twoim sercem uczyniłeś wszystkie te wielkie rzeczy, dając poznać je twemu słudze."
"2Sm7,22": "Dlatego jesteś wielki, PANIE Boże. Nie ma bowiem nikogo podobnego do ciebie i nie ma Boga oprócz ciebie, zgodnie z tym, co usłyszeliśmy na własne uszy."
"2Sm7,23": "I czyż jest taki naród na ziemi jak twój lud Izrael, dla którego Bóg wyruszył, aby wykupić go sobie jako lud, by uczynić wielkim swoje imię i dokonać dla nich wielkich i straszliwych rzeczy w twojej ziemi, przed twoim ludem, który wykupiłeś sobie z Egiptu, spośród narodów i ich bogów?"
"2Sm7,24": "Ustanowiłeś sobie bowiem swój lud, Izraela, aby był dla ciebie ludem na wieki. A ty, PANIE, stałeś się jego Bogiem."
"2Sm7,25": "Teraz więc, PANIE Boże, utwierdź na wieki słowo, które wypowiedziałeś o swoim słudze i o jego domu, i czyń, jak powiedziałeś;"
"2Sm7,26": "Aby twoje imię było wielbione na wieki, aby mówiono: PAN zastępów jest Bogiem nad Izraelem, a dom twego sługi Dawida będzie utwierdzony przed tobą."
"2Sm7,27": "Ty bowiem, PANIE zastępów, Boże Izraela, objawiłeś swemu słudze, mówiąc: Zbuduję ci dom. Dlatego twój sługa ośmielił się skierować do ciebie tę modlitwę."
"2Sm7,28": "A teraz, Panie BOŻE, ty jesteś tym Bogiem, a twoje słowa są prawdą, obiecałeś swemu słudze tę dobroć."
"2Sm7,29": "Teraz więc racz pobłogosławić dom swego sługi, aby przed tobą trwał na wieki. Ty bowiem, Panie BOŻE, to powiedziałeś i dzięki twojemu błogosławieństwu dom twego sługi będzie błogosławiony na wieki."
