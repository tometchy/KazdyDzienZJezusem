"2Sm23,1":
  text: "Oto ostatnie słowa Dawida. Dawid, syn Jessego, mężczyzna, który został wywyższony, pomazaniec Boga Jakuba i miły psalmista Izraela, powiedział:"
  tags: []
"2Sm23,2":
  text: "Duch PANA mówił przeze mnie, a jego słowo jest na moim języku."
  tags: []
"2Sm23,3":
  text: "Bóg Izraela przemówił, Skała Izraela mówiła do mnie: Ten, który panuje nad ludem, ma być sprawiedliwy, ma panować w bojaźni Bożej."
  tags: []
"2Sm23,4":
  text: "Będzie jak światło poranka, gdy słońce wschodzi, jak poranek bez chmur i jak od jego blasku po deszczu wyrasta ruń z ziemi."
  tags: []
"2Sm23,5":
  text: "I choć mój dom nie jest taki przed Bogiem, to jednak zawarł ze mną wieczne przymierze, utwierdzone we wszystkim i pewne. A to jest całe moje zbawienie i całe moje pragnienie, chociaż on jeszcze nie daje temu wzrostu."
  tags: []
"2Sm23,6":
  text: "Lecz wszyscy synowie Beliala będą jak ciernie wyrzucone, których się ręką nie bierze."
  tags: []
"2Sm23,7":
  text: "Ten zaś, kto chce ich dotknąć, musi uzbroić się w żelazo i drzewce włóczni. Zostaną doszczętnie spaleni ogniem na miejscu."
  tags: []
"2Sm23,8":
  text: "Oto są imiona dzielnych wojowników, których miał Dawid: Tachmonita, który zajął główne miejsce wśród trzech dowódców, to właśnie Adino Esnita. To on wywijał swoją włócznią przeciw ośmiuset i pokonał ich za jednym razem."
  tags: []
"2Sm23,9":
  text: "Po nim był Eleazar, syn Dody, Achochita, jeden z trzech dzielnych wojowników, którzy byli z Dawidem, kiedy urągali Filistynom, którzy zebrali się do bitwy, a Izraelici wycofali się;"
  tags: []
"2Sm23,10":
  text: "To on powstał i bił się z Filistynami, aż mu ręka omdlała i przywarła do miecza. Tego dnia PAN sprawił wielkie zwycięstwo. Lud zaś zawrócił tylko po to, żeby zabrać łupy."
  tags: []
"2Sm23,11":
  text: "A po nim był Szamma, syn Agego, Hararyta. Gdy bowiem Filistyni zebrali się w oddział, gdzie była działka pola pełnego soczewicy, a lud uciekł przed Filistynami;"
  tags: []
"2Sm23,12":
  text: "Wtedy on stanął w środku tej działki, obronił ją i pobił Filistynów. A PAN sprawił wielkie zwycięstwo."
  tags: []
"2Sm23,13":
  text: "Ci trzej spośród trzydziestu dowódców zeszli się i przyszli do Dawida w czasie żniw do jaskini Adullam, podczas gdy oddział Filistynów rozbił obóz w dolinie Refaim."
  tags: []
"2Sm23,14":
  text: "A Dawid w tym czasie przebywał w miejscu obronnym, a załoga filistyńska była wtedy w Betlejem."
  tags: []
"2Sm23,15":
  text: "Wówczas Dawid poczuł pragnienie i powiedział: Oby ktoś dał mi się napić wody ze studni betlejemskiej, która jest przy bramie!"
  tags: []
"2Sm23,16":
  text: "Wtedy ci trzej waleczni wojownicy przebili się przez obóz Filistynów i zaczerpnęli wody ze studni betlejemskiej, która była przy bramie. Zabrali ją i przynieśli do Dawida. On jednak nie chciał jej pić, lecz wylał ją dla PANA;"
  tags: []
"2Sm23,17":
  text: "I powiedział: Niech PAN mnie strzeże od tego, abym miał to uczynić. Czyż to nie krew mężczyzn, którzy poszli z narażeniem życia? I nie chciał jej pić. Tego dokonali ci trzej waleczni wojownicy."
  tags: []
"2Sm23,18":
  text: "Abiszaj, brat Joaba, syn Serui, był na czele trzech. On to podniósł swoją włócznię przeciw trzystu i pobił ich, i był sławny wśród tych trzech."
  tags: []
"2Sm23,19":
  text: "Z tych trzech był najsławniejszy i stał się ich dowódcą. Nie dorównał jednak tamtym trzem."
  tags: []
"2Sm23,20":
  text: "Benajasz, syn Jehojady, syn dzielnego męża z Kabseel, który dokonał wielu czynów, to on zabił dwóch wojowników z Moabu. On też w śnieżnym dniu zszedł do jamy i zabił lwa."
  tags: []
"2Sm23,21":
  text: "Zabił również Egipcjanina, człowieka godnego podziwu. Egipcjanin ten miał w ręku włócznię. On zaś poszedł do niego z kijem, wyrwał włócznię z ręki Egipcjanina i zabił go jego własną włócznią."
  tags: []
"2Sm23,22":
  text: "Tego dokonał Benajasz, syn Jehojady, był najsławniejszy wśród tych trzech dzielnych wojowników."
  tags: []
"2Sm23,23":
  text: "Był sławniejszy niż trzydziestu, nie dorównał jednak owym trzem. I Dawid postawił go nad swoją strażą przyboczną."
  tags: []
"2Sm23,24":
  text: "Asahel, brat Joaba, był wśród trzydziestu. A są nimi: Elchanan, syn Dodo z Betlejem;"
  tags: []
"2Sm23,25":
  text: "Szamma Charodczyk, Elika Charodczyk;"
  tags: []
"2Sm23,26":
  text: "Cheles Peletyta, Ira, syn Ikkesza, Tekoitczyk;"
  tags: []
"2Sm23,27":
  text: "Abiezer Anatotczyk, Mebunaj Chuszatyta;"
  tags: []
"2Sm23,28":
  text: "Salmon Achochita, Maharaj Netofatyta;"
  tags: []
"2Sm23,29":
  text: "Cheleb, syn Baany, Netofatyta, Itaj, syn Ribaja, z Gibea synów Beniamina;"
  tags: []
"2Sm23,30":
  text: "Benajasz Piratończyk, Hiddaj z potoków Gaasz;"
  tags: []
"2Sm23,31":
  text: "Abi-Albon Arbatczyk, Azmawet Barchumitczyk;"
  tags: []
"2Sm23,32":
  text: "Eliachba Szaalbończyk, Jonatan, z synów Jaszena;"
  tags: []
"2Sm23,33":
  text: "Szamma Hararyta, Achiam, syn Szarara, Hararyta;"
  tags: []
"2Sm23,34":
  text: "Elifelet, syn Achasbaja, syna Maachatyty, Eliam, syn Achitofela Gilonity;"
  tags: []
"2Sm23,35":
  text: "Chesraj Karmelita, Paaraj Arbitczyk;"
  tags: []
"2Sm23,36":
  text: "Jigal, syn Natana z Soby, Bani Gadytczyk;"
  tags: []
"2Sm23,37":
  text: "Selek Ammonita, Nacharaj Beerotczyk, giermek Joaba, syna Serui;"
  tags: []
"2Sm23,38":
  text: "Ira Jitryta, Gareb Jitryta;"
  tags: []
"2Sm23,39":
  text: "Uriasz Chetyta. Razem wszystkich trzydziestu siedmiu."
  tags: []
