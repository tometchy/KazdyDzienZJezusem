"2Sm23,1": "Oto ostatnie słowa Dawida. Dawid, syn Jessego, mężczyzna, który został wywyższony, pomazaniec Boga Jakuba i miły psalmista Izraela, powiedział:"
"2Sm23,2": "Duch PANA mówił przeze mnie, a jego słowo jest na moim języku."
"2Sm23,3": "Bóg Izraela przemówił, Skała Izraela mówiła do mnie: Ten, który panuje nad ludem, ma być sprawiedliwy, ma panować w bojaźni Bożej."
"2Sm23,4": "Będzie jak światło poranka, gdy słońce wschodzi, jak poranek bez chmur i jak od jego blasku po deszczu wyrasta ruń z ziemi."
"2Sm23,5": "I choć mój dom nie jest taki przed Bogiem, to jednak zawarł ze mną wieczne przymierze, utwierdzone we wszystkim i pewne. A to jest całe moje zbawienie i całe moje pragnienie, chociaż on jeszcze nie daje temu wzrostu."
"2Sm23,6": "Lecz wszyscy synowie Beliala będą jak ciernie wyrzucone, których się ręką nie bierze."
"2Sm23,7": "Ten zaś, kto chce ich dotknąć, musi uzbroić się w żelazo i drzewce włóczni. Zostaną doszczętnie spaleni ogniem na miejscu."
"2Sm23,8": "Oto są imiona dzielnych wojowników, których miał Dawid: Tachmonita, który zajął główne miejsce wśród trzech dowódców, to właśnie Adino Esnita. To on wywijał swoją włócznią przeciw ośmiuset i pokonał ich za jednym razem."
"2Sm23,9": "Po nim był Eleazar, syn Dody, Achochita, jeden z trzech dzielnych wojowników, którzy byli z Dawidem, kiedy urągali Filistynom, którzy zebrali się do bitwy, a Izraelici wycofali się;"
"2Sm23,10": "To on powstał i bił się z Filistynami, aż mu ręka omdlała i przywarła do miecza. Tego dnia PAN sprawił wielkie zwycięstwo. Lud zaś zawrócił tylko po to, żeby zabrać łupy."
"2Sm23,11": "A po nim był Szamma, syn Agego, Hararyta. Gdy bowiem Filistyni zebrali się w oddział, gdzie była działka pola pełnego soczewicy, a lud uciekł przed Filistynami;"
"2Sm23,12": "Wtedy on stanął w środku tej działki, obronił ją i pobił Filistynów. A PAN sprawił wielkie zwycięstwo."
"2Sm23,13": "Ci trzej spośród trzydziestu dowódców zeszli się i przyszli do Dawida w czasie żniw do jaskini Adullam, podczas gdy oddział Filistynów rozbił obóz w dolinie Refaim."
"2Sm23,14": "A Dawid w tym czasie przebywał w miejscu obronnym, a załoga filistyńska była wtedy w Betlejem."
"2Sm23,15": "Wówczas Dawid poczuł pragnienie i powiedział: Oby ktoś dał mi się napić wody ze studni betlejemskiej, która jest przy bramie!"
"2Sm23,16": "Wtedy ci trzej waleczni wojownicy przebili się przez obóz Filistynów i zaczerpnęli wody ze studni betlejemskiej, która była przy bramie. Zabrali ją i przynieśli do Dawida. On jednak nie chciał jej pić, lecz wylał ją dla PANA;"
"2Sm23,17": "I powiedział: Niech PAN mnie strzeże od tego, abym miał to uczynić. Czyż to nie krew mężczyzn, którzy poszli z narażeniem życia? I nie chciał jej pić. Tego dokonali ci trzej waleczni wojownicy."
"2Sm23,18": "Abiszaj, brat Joaba, syn Serui, był na czele trzech. On to podniósł swoją włócznię przeciw trzystu i pobił ich, i był sławny wśród tych trzech."
"2Sm23,19": "Z tych trzech był najsławniejszy i stał się ich dowódcą. Nie dorównał jednak tamtym trzem."
"2Sm23,20": "Benajasz, syn Jehojady, syn dzielnego męża z Kabseel, który dokonał wielu czynów, to on zabił dwóch wojowników z Moabu. On też w śnieżnym dniu zszedł do jamy i zabił lwa."
"2Sm23,21": "Zabił również Egipcjanina, człowieka godnego podziwu. Egipcjanin ten miał w ręku włócznię. On zaś poszedł do niego z kijem, wyrwał włócznię z ręki Egipcjanina i zabił go jego własną włócznią."
"2Sm23,22": "Tego dokonał Benajasz, syn Jehojady, był najsławniejszy wśród tych trzech dzielnych wojowników."
"2Sm23,23": "Był sławniejszy niż trzydziestu, nie dorównał jednak owym trzem. I Dawid postawił go nad swoją strażą przyboczną."
"2Sm23,24": "Asahel, brat Joaba, był wśród trzydziestu. A są nimi: Elchanan, syn Dodo z Betlejem;"
"2Sm23,25": "Szamma Charodczyk, Elika Charodczyk;"
"2Sm23,26": "Cheles Peletyta, Ira, syn Ikkesza, Tekoitczyk;"
"2Sm23,27": "Abiezer Anatotczyk, Mebunaj Chuszatyta;"
"2Sm23,28": "Salmon Achochita, Maharaj Netofatyta;"
"2Sm23,29": "Cheleb, syn Baany, Netofatyta, Itaj, syn Ribaja, z Gibea synów Beniamina;"
"2Sm23,30": "Benajasz Piratończyk, Hiddaj z potoków Gaasz;"
"2Sm23,31": "Abi-Albon Arbatczyk, Azmawet Barchumitczyk;"
"2Sm23,32": "Eliachba Szaalbończyk, Jonatan, z synów Jaszena;"
"2Sm23,33": "Szamma Hararyta, Achiam, syn Szarara, Hararyta;"
"2Sm23,34": "Elifelet, syn Achasbaja, syna Maachatyty, Eliam, syn Achitofela Gilonity;"
"2Sm23,35": "Chesraj Karmelita, Paaraj Arbitczyk;"
"2Sm23,36": "Jigal, syn Natana z Soby, Bani Gadytczyk;"
"2Sm23,37": "Selek Ammonita, Nacharaj Beerotczyk, giermek Joaba, syna Serui;"
"2Sm23,38": "Ira Jitryta, Gareb Jitryta;"
"2Sm23,39": "Uriasz Chetyta. Razem wszystkich trzydziestu siedmiu."
