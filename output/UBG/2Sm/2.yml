"2Sm2,1": "Po tym wydarzeniu Dawid zapytał PANA: Czy mam iść do któregoś z miast Judy? PAN mu odpowiedział: Idź. I Dawid zapytał: Dokąd mam pójść? Odpowiedział: Do Hebronu."
"2Sm2,2": "Dawid wyruszył więc tam razem ze swoimi dwiema żonami: Achinoam Jizreelitką i Abigail, dawną żoną Nabala z Karmelu."
"2Sm2,3": "Dawid zabrał także ludzi, którzy z nim byli, każdego z jego rodziną. I zamieszkali w miastach Hebronu."
"2Sm2,4": "Wtedy przyszli mężczyźni Judy i namaścili tam Dawida na króla nad domem Judy. Wówczas też doniesiono Dawidowi, że to mieszkańcy Jabesz-Gilead pogrzebali Saula."
"2Sm2,5": "Dawid wyprawił więc posłańców do mieszkańców Jabesz-Gilead z takim przesłaniem: Błogosławieni jesteście przez PANA, ponieważ okazaliście tę łaskę swemu panu Saulowi i pogrzebaliście go."
"2Sm2,6": "Niech teraz PAN okaże wam łaskę i prawdę, a ja też odwdzięczę się wam za to dzieło dobroci, którego dokonaliście."
"2Sm2,7": "Teraz więc niech wasze ręce się umocnią i bądźcie dzielni, bo choć umarł wasz pan Saul, to mnie dom Judy namaścił na króla nad sobą."
"2Sm2,8": "Lecz Abner, syn Nera, dowódca wojsk Saula, wziął Iszboszeta, syna Saula, i przyprowadził go do Machanaim;"
"2Sm2,9": "I ustanowił go królem nad Gileadem, Aszerem, Jizreelem, Efraimem, Beniaminem i całym Izraelem."
"2Sm2,10": "Iszboszet, syn Saula, miał czterdzieści lat, kiedy zaczął królować nad Izraelem, a panował dwa lata. Tylko dom Judy poszedł za Dawidem."
"2Sm2,11": "A okres, w którym Dawid był królem w Hebronie nad domem Judy, wynosił siedem lat i sześć miesięcy."
"2Sm2,12": "Potem Abner, syn Nera, i słudzy Iszboszeta, syna Saula, wyruszyli z Machanaim do Gibeonu."
"2Sm2,13": "Także Joab, syn Serui, wraz ze sługami Dawida wyruszyli i spotkali się przy stawie gibeońskim. Jedni zatrzymali się po jednej stronie stawu, a drudzy po drugiej stronie stawu."
"2Sm2,14": "Wtedy Abner zawołał do Joaba: Niech teraz wstaną młodzieńcy i niech się bawią przed nami. I Joab odpowiedział: Niech wstaną."
"2Sm2,15": "Wstali więc i wystąpiła liczba dwunastu Beniaminitów ze strony Iszboszeta, syna Saula, i dwunastu spośród sług Dawida."
"2Sm2,16": "Każdy pochwycił swego przeciwnika za głowę i utopił swój miecz w jego boku, tak że padli razem. Dlatego miejsce to nazwano Helkatassurym, leży ono w Gibeonie."
"2Sm2,17": "W tym dniu rozgorzała bardzo zacięta walka. Abner i wojownicy Izraela zostali pokonani przez sługi Dawida."
"2Sm2,18": "Byli tam również trzej synowie Serui: Joab, Abiszaj i Asahel. Asahel był szybkonogi jak dzika sarna."
"2Sm2,19": "I Asahel ruszył w pogoń za Abnerem, i nie zbaczał ani w prawo, ani w lewo w tym pościgu za Abnerem."
"2Sm2,20": "A kiedy Abner obejrzał się za siebie, zapytał: Czy to ty jesteś, Asahelu? A on mu odpowiedział: To ja."
"2Sm2,21": "Wtedy Abner powiedział mu: Skręć w prawo albo w lewo i schwytaj sobie jednego z młodzieńców, i zabierz sobie jego zbroję. Lecz Asahel nie chciał od niego odstąpić."
"2Sm2,22": "Abner ponownie więc powiedział do Asahela: Odstąp ode mnie. Czemu miałbym cię powalić na ziemię? Jakże mógłbym wtedy podnieść swoją twarz na Joaba, twego brata?"
"2Sm2,23": "Gdy jednak nie chciał odstąpić, Abner uderzył go końcem włóczni pod piąte żebro, tak że włócznia wyszła z drugiej strony. Padł tam i umarł na miejscu, a wszyscy, którzy przychodzili do tego miejsca, gdzie Asahel padł i umarł, przystawali."
"2Sm2,24": "Lecz Joab i Abiszaj rzucili się w pogoń za Abnerem. I gdy zachodziło słońce, dotarli do wzgórza Amma, które leży naprzeciw Giach, przy drodze na pustynię Gibeon."
"2Sm2,25": "Wtedy synowie Beniamina zebrali się wokół Abnera, utworzyli jeden oddział i stanęli na szczycie pewnego wzgórza."
"2Sm2,26": "I Abner zawołał do Joaba: Czy miecz będzie pożerał na zawsze? Czy nie wiesz, że koniec będzie gorzki? Kiedy wreszcie powiesz ludowi, aby zawrócił od ścigania swych braci?"
"2Sm2,27": "Joab odpowiedział: Jak żyje Bóg, gdybyś się nie odezwał, to dopiero rano lud odstąpiłby, każdy od ścigania swego brata."
"2Sm2,28": "Joab zadął więc w trąbę i cały lud zatrzymał się, i nie ścigał dalej Izraela ani nie wznowiono walki."
"2Sm2,29": "A Abner i jego ludzie szli całą noc przez step, przeprawili się przez Jordan i przeszli przez cały Bitron, aż dotarli do Machanaim."
"2Sm2,30": "Joab zaś, gdy zawrócił z pościgu za Abnerem, zebrał cały lud, a ze sług Dawida zabrakło dziewiętnastu mężczyzn oraz Asahela."
"2Sm2,31": "Słudzy Dawida natomiast tak pobili ludzi z Beniamina i spośród Abnera, że zmarło trzystu sześćdziesięciu mężczyzn."
"2Sm2,32": "Następnie zabrali Asahela i pogrzebali go w grobie jego ojca, w Betlejem. Potem Joab i jego ludzie szli całą noc i o świcie dotarli do Hebronu."
