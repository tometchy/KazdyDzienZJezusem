"2Sm12,1":
  text: "Wtedy PAN posłał Natana do Dawida. Ten przybył do niego i powiedział: W pewnym mieście było dwóch ludzi, jeden bogaty, a drugi ubogi."
  tags: []
"2Sm12,2":
  text: "Bogaty miał bardzo dużo owiec i wołów."
  tags: []
"2Sm12,3":
  text: "A ubogi nie miał nic oprócz jednej małej owieczki, którą kupił i żywił. Wyrosła przy nim wraz z jego dziećmi, jadła jego chleb i piła z jego kubka, spała na jego łonie i była mu jak córka."
  tags: []
"2Sm12,4":
  text: "I przyszedł gość do tego bogatego, a jemu było żal wziąć ze swoich owiec albo ze swoich wołów, aby przyrządzić ucztę dla gościa, który do niego przyszedł. Wziął więc owieczkę tego ubogiego i przyrządził ją dla człowieka, który do niego przyszedł."
  tags: []
"2Sm12,5":
  text: "Wtedy Dawid mocno zapłonął gniewem na tego człowieka i powiedział do Natana: Jak żyje PAN, człowiek, który to uczynił, zasługuje na śmierć;"
  tags: []
"2Sm12,6":
  text: "Za owcę wynagrodzi poczwórnie, dlatego że tak uczynił i nie miał litości."
  tags: []
"2Sm12,7":
  text: "Wtedy Natan powiedział do Dawida: Ty jesteś tym człowiekiem. Tak mówi PAN, Bóg Izraela: Ja cię namaściłem, abyś był królem nad Izraelem, i ja cię wybawiłem z rąk Saula;"
  tags: []
"2Sm12,8":
  text: "Dałem ci dom twego pana i żony twego pana na twe łono, dałem ci dom Izraela i Judy, a gdyby tego było za mało, dałbym ci jeszcze więcej."
  tags: []
"2Sm12,9":
  text: "Dlaczego wzgardziłeś słowem PANA, czyniąc to zło w jego oczach? Zabiłeś mieczem Uriasza Chetytę, a jego żonę wziąłeś sobie za żonę, jego zaś zabiłeś mieczem synów Ammona."
  tags: []
"2Sm12,10":
  text: "Teraz więc miecz nigdy nie odstąpi od twojego domu, ponieważ wzgardziłeś mną i wziąłeś żonę Uriasza Chetyty, by była twoją żoną."
  tags: []
"2Sm12,11":
  text: "Tak mówi PAN: Oto wzbudzę przeciwko tobie nieszczęście z twego własnego domu, wezmę twoje żony sprzed twoich oczu i dam je twemu bliźniemu, a on położy się z twoimi żonami wobec tego słońca."
  tags: []
"2Sm12,12":
  text: "I chociaż ty uczyniłeś to potajemnie, ja jednak uczynię to przed całym Izraelem i przed słońcem."
  tags: []
"2Sm12,13":
  text: "Wtedy Dawid powiedział do Natana: Zgrzeszyłem przeciw PANU. Natan zaś odpowiedział Dawidowi: PAN też przebaczył ci twój grzech, nie umrzesz."
  tags: []
"2Sm12,14":
  text: "Ponieważ jednak przez ten czyn dałeś wrogom PANA powód, by bluźnili, syn, który ci się urodził, na pewno umrze."
  tags: []
"2Sm12,15":
  text: "Potem Natan wrócił do swego domu. A PAN poraził dziecko, które żona Uriasza urodziła Dawidowi, i ciężko zachorowało."
  tags: []
"2Sm12,16":
  text: "Wtedy Dawid wstawił się u Boga za dzieckiem. I Dawid pościł, a gdy wrócił do siebie, leżał całą noc na ziemi."
  tags: []
"2Sm12,17":
  text: "I starsi jego domu przyszli do niego, aby go podnieść z ziemi. On jednak nie chciał i nie jadł z nimi chleba."
  tags: []
"2Sm12,18":
  text: "A siódmego dnia dziecko umarło. I słudzy Dawida bali się powiedzieć mu, że dziecko umarło. Mówili bowiem: Oto póki dziecko jeszcze żyło, mówiliśmy do niego, a on nie słuchał naszego głosu. Jak powiemy, że dziecko umarło, dopiero będzie się trapił."
  tags: []
"2Sm12,19":
  text: "Gdy jednak Dawid zobaczył, że jego słudzy szepcą między sobą, zrozumiał, że dziecko umarło. Dawid więc zapytał swoich sług: Czy dziecko umarło? Odpowiedzieli: Umarło."
  tags: []
"2Sm12,20":
  text: "Wtedy Dawid wstał z ziemi, umył się i namaścił, zmienił swoje szaty i wszedł do domu PANA, aby oddać mu pokłon. Potem wrócił do swego domu i kazał przynieść posiłek, i położyli przed nim chleb, i jadł."
  tags: []
"2Sm12,21":
  text: "Jego słudzy zapytali go: Co znaczy to, co uczyniłeś? Póki dziecko jeszcze żyło, pościłeś i płakałeś, a gdy dziecko umarło, wstałeś i jadłeś chleb."
  tags: []
"2Sm12,22":
  text: "Odpowiedział: Póki dziecko jeszcze żyło, pościłem i płakałem. Mówiłem bowiem: Któż wie, może PAN zmiłuje się nade mną i dziecko będzie żyło."
  tags: []
"2Sm12,23":
  text: "Lecz teraz, gdy już umarło, dlaczego miałbym pościć? Czy mogę je przywrócić do życia? Ja pójdę do niego, ale ono do mnie nie wróci."
  tags: []
"2Sm12,24":
  text: "I Dawid pocieszał swoją żonę Batszebę. Wszedł do niej i położył się z nią. Potem urodziła syna, a on nadał mu imię Salomon. A PAN go umiłował."
  tags: []
"2Sm12,25":
  text: "Posłał więc przez Natana proroka i nadał mu imię Jedidija ze względu na PANA."
  tags: []
"2Sm12,26":
  text: "Potem Joab walczył przeciw Rabbie synów Ammona i zdobył miasto królewskie."
  tags: []
"2Sm12,27":
  text: "I Joab wysłał posłańców do Dawida, i powiedział: Walczyłem przeciw Rabbie i zdobyłem miasto wód."
  tags: []
"2Sm12,28":
  text: "Teraz więc zbierz resztę ludu, oblegaj miasto i zdobądź je, abym to nie ja zdobył miasto i aby nie przypisano zwycięstwa memu imieniu."
  tags: []
"2Sm12,29":
  text: "Dawid zebrał więc cały lud, udał się do Rabby, walczył przeciwko niej i zdobył ją."
  tags: []
"2Sm12,30":
  text: "Zdjął też koronę z głowy jej króla, która ważyła talent złota i była ozdobiona drogocennymi kamieniami. I włożono ją na głowę Dawida. Wywiózł też z miasta bardzo wielki łup."
  tags: []
"2Sm12,31":
  text: "Wyprowadził mieszkańców miasta i podał ich pod piły, żelazne brony i żelazne siekiery i zmusił ich do przejścia przez piec do wypalania cegieł. Tak uczynił ze wszystkimi miastami synów Ammona. Potem Dawid wrócił wraz z całym ludem do Jerozolimy."
  tags: []
