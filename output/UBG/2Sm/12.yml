"2Sm12,1": "Wtedy PAN posłał Natana do Dawida. Ten przybył do niego i powiedział: W pewnym mieście było dwóch ludzi, jeden bogaty, a drugi ubogi."
"2Sm12,2": "Bogaty miał bardzo dużo owiec i wołów."
"2Sm12,3": "A ubogi nie miał nic oprócz jednej małej owieczki, którą kupił i żywił. Wyrosła przy nim wraz z jego dziećmi, jadła jego chleb i piła z jego kubka, spała na jego łonie i była mu jak córka."
"2Sm12,4": "I przyszedł gość do tego bogatego, a jemu było żal wziąć ze swoich owiec albo ze swoich wołów, aby przyrządzić ucztę dla gościa, który do niego przyszedł. Wziął więc owieczkę tego ubogiego i przyrządził ją dla człowieka, który do niego przyszedł."
"2Sm12,5": "Wtedy Dawid mocno zapłonął gniewem na tego człowieka i powiedział do Natana: Jak żyje PAN, człowiek, który to uczynił, zasługuje na śmierć;"
"2Sm12,6": "Za owcę wynagrodzi poczwórnie, dlatego że tak uczynił i nie miał litości."
"2Sm12,7": "Wtedy Natan powiedział do Dawida: Ty jesteś tym człowiekiem. Tak mówi PAN, Bóg Izraela: Ja cię namaściłem, abyś był królem nad Izraelem, i ja cię wybawiłem z rąk Saula;"
"2Sm12,8": "Dałem ci dom twego pana i żony twego pana na twe łono, dałem ci dom Izraela i Judy, a gdyby tego było za mało, dałbym ci jeszcze więcej."
"2Sm12,9": "Dlaczego wzgardziłeś słowem PANA, czyniąc to zło w jego oczach? Zabiłeś mieczem Uriasza Chetytę, a jego żonę wziąłeś sobie za żonę, jego zaś zabiłeś mieczem synów Ammona."
"2Sm12,10": "Teraz więc miecz nigdy nie odstąpi od twojego domu, ponieważ wzgardziłeś mną i wziąłeś żonę Uriasza Chetyty, by była twoją żoną."
"2Sm12,11": "Tak mówi PAN: Oto wzbudzę przeciwko tobie nieszczęście z twego własnego domu, wezmę twoje żony sprzed twoich oczu i dam je twemu bliźniemu, a on położy się z twoimi żonami wobec tego słońca."
"2Sm12,12": "I chociaż ty uczyniłeś to potajemnie, ja jednak uczynię to przed całym Izraelem i przed słońcem."
"2Sm12,13": "Wtedy Dawid powiedział do Natana: Zgrzeszyłem przeciw PANU. Natan zaś odpowiedział Dawidowi: PAN też przebaczył ci twój grzech, nie umrzesz."
"2Sm12,14": "Ponieważ jednak przez ten czyn dałeś wrogom PANA powód, by bluźnili, syn, który ci się urodził, na pewno umrze."
"2Sm12,15": "Potem Natan wrócił do swego domu. A PAN poraził dziecko, które żona Uriasza urodziła Dawidowi, i ciężko zachorowało."
"2Sm12,16": "Wtedy Dawid wstawił się u Boga za dzieckiem. I Dawid pościł, a gdy wrócił do siebie, leżał całą noc na ziemi."
"2Sm12,17": "I starsi jego domu przyszli do niego, aby go podnieść z ziemi. On jednak nie chciał i nie jadł z nimi chleba."
"2Sm12,18": "A siódmego dnia dziecko umarło. I słudzy Dawida bali się powiedzieć mu, że dziecko umarło. Mówili bowiem: Oto póki dziecko jeszcze żyło, mówiliśmy do niego, a on nie słuchał naszego głosu. Jak powiemy, że dziecko umarło, dopiero będzie się trapił."
"2Sm12,19": "Gdy jednak Dawid zobaczył, że jego słudzy szepcą między sobą, zrozumiał, że dziecko umarło. Dawid więc zapytał swoich sług: Czy dziecko umarło? Odpowiedzieli: Umarło."
"2Sm12,20": "Wtedy Dawid wstał z ziemi, umył się i namaścił, zmienił swoje szaty i wszedł do domu PANA, aby oddać mu pokłon. Potem wrócił do swego domu i kazał przynieść posiłek, i położyli przed nim chleb, i jadł."
"2Sm12,21": "Jego słudzy zapytali go: Co znaczy to, co uczyniłeś? Póki dziecko jeszcze żyło, pościłeś i płakałeś, a gdy dziecko umarło, wstałeś i jadłeś chleb."
"2Sm12,22": "Odpowiedział: Póki dziecko jeszcze żyło, pościłem i płakałem. Mówiłem bowiem: Któż wie, może PAN zmiłuje się nade mną i dziecko będzie żyło."
"2Sm12,23": "Lecz teraz, gdy już umarło, dlaczego miałbym pościć? Czy mogę je przywrócić do życia? Ja pójdę do niego, ale ono do mnie nie wróci."
"2Sm12,24": "I Dawid pocieszał swoją żonę Batszebę. Wszedł do niej i położył się z nią. Potem urodziła syna, a on nadał mu imię Salomon. A PAN go umiłował."
"2Sm12,25": "Posłał więc przez Natana proroka i nadał mu imię Jedidija ze względu na PANA."
"2Sm12,26": "Potem Joab walczył przeciw Rabbie synów Ammona i zdobył miasto królewskie."
"2Sm12,27": "I Joab wysłał posłańców do Dawida, i powiedział: Walczyłem przeciw Rabbie i zdobyłem miasto wód."
"2Sm12,28": "Teraz więc zbierz resztę ludu, oblegaj miasto i zdobądź je, abym to nie ja zdobył miasto i aby nie przypisano zwycięstwa memu imieniu."
"2Sm12,29": "Dawid zebrał więc cały lud, udał się do Rabby, walczył przeciwko niej i zdobył ją."
"2Sm12,30": "Zdjął też koronę z głowy jej króla, która ważyła talent złota i była ozdobiona drogocennymi kamieniami. I włożono ją na głowę Dawida. Wywiózł też z miasta bardzo wielki łup."
"2Sm12,31": "Wyprowadził mieszkańców miasta i podał ich pod piły, żelazne brony i żelazne siekiery i zmusił ich do przejścia przez piec do wypalania cegieł. Tak uczynił ze wszystkimi miastami synów Ammona. Potem Dawid wrócił wraz z całym ludem do Jerozolimy."
