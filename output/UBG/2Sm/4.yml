"2Sm4,1":
  text: "Gdy syn Saula Iszboszet usłyszał, że Abner poległ w Hebronie, opadły mu ręce i cały Izrael był przerażony."
  tags: []
"2Sm4,2":
  text: "Syn Saula miał też dwóch ludzi, dowódców oddziałów: jeden miał na imię Baana, a drugi – Rekab. Byli oni synami Rimmona Beerotczyka, z synów Beniamina. Beerot był bowiem także zaliczany do Beniamina;"
  tags: []
"2Sm4,3":
  text: "Bo Beerotczycy uciekli do Gittaim i byli tam przybyszami, i są nimi aż do dziś."
  tags: []
"2Sm4,4":
  text: "A Jonatan, syn Saula, miał jednego syna chromego na obie nogi. Gdy miał on bowiem pięć lat, a nadeszła wieść z Jizreel o śmierci Saula i Jonatana, jego piastunka pochwyciła go i uciekła. Ale w pośpiechu tej ucieczki upadł i został kaleką. Miał na imię Mefiboszet."
  tags: []
"2Sm4,5":
  text: "Synowie Rimmona Beerotczyka, Rekab i Baana, wyruszyli więc i przyszli do domu Iszboszeta w najgorętszej porze dnia, w południe, gdy spał on w łożu."
  tags: []
"2Sm4,6":
  text: "Weszli oni do jego domu pod pretekstem zakupu pszenicy i tam przebili go pod piątym żebrem. Potem Rekab i jego brat Baana uciekli."
  tags: []
"2Sm4,7":
  text: "Gdy bowiem weszli do domu, on spał na swoim łożu w sypialni. Wtedy przebili go, uśmiercili i ucięli mu głowę. Potem zabrali ją i szli drogą pustynną przez całą noc."
  tags: []
"2Sm4,8":
  text: "I przynieśli głowę Iszboszeta do Dawida do Hebronu, i powiedzieli do króla: Oto głowa Iszboszeta, syna Saula, twojego wroga, który czyhał na twoją duszę. PAN dzisiaj dokonał za mojego pana, króla, zemsty na Saulu i jego potomstwie."
  tags: []
"2Sm4,9":
  text: "Lecz Dawid odpowiedział Rekabowi i jego bratu Baanie, synom Rimmona Beerotczyka: Jak żyje PAN, który wybawił moją duszę z wszelkiego ucisku;"
  tags: []
"2Sm4,10":
  text: "Jeśli tego, który mi powiedział: Oto umarł Saul, sądząc, że przynosi dobrą nowinę, pojmałem i zabiłem w Siklag, chociaż myślał, że wynagrodzę go za jego wieści;"
  tags: []
"2Sm4,11":
  text: "Tym bardziej, gdy niegodziwi ludzie zabili sprawiedliwego człowieka w jego domu, na własnym łożu. Czy teraz nie powinienem zażądać jego krwi z waszych rąk i zgładzić was z ziemi?"
  tags: []
"2Sm4,12":
  text: "Dawid rozkazał więc sługom, a oni zabili ich, obcięli im ręce i nogi i powiesili ich nad stawem w Hebronie. Głowę zaś Iszboszeta wzięli i pochowali w grobie Abnera w Hebronie."
  tags: []
