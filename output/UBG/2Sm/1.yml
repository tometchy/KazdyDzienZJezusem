"2Sm1,1": "Po śmierci Saula, gdy Dawid po rozgromieniu Amalekitów wrócił i zatrzymał się w Siklag przez dwa dni;"
"2Sm1,2": "Trzeciego dnia pewien człowiek przybył z obozu Saula z podartymi szatami i z prochem na głowie. Gdy przyszedł do Dawida, padł na ziemię i pokłonił mu się."
"2Sm1,3": "Dawid zapytał go: Skąd przybywasz? Odpowiedział mu: Uciekłem z obozu Izraela."
"2Sm1,4": "Dawid znowu zapytał: Co się stało? Proszę, powiedz mi. Odpowiedział: Lud uciekł z pola bitwy, a wielu ludzi padło i poległo, także Saul i jego syn Jonatan polegli."
"2Sm1,5": "Wtedy Dawid zapytał młodzieńca, który mu to powiedział: Skąd wiesz, że Saul i jego syn Jonatan umarli?"
"2Sm1,6": "Młodzieniec, który mu to oznajmił, odpowiedział: Przypadkiem znalazłem się na górze Gilboa, a oto Saul opierał się na swojej włóczni, a rydwany i jeźdźcy doganiali go."
"2Sm1,7": "Kiedy obejrzał się i zobaczył mnie, zawołał na mnie. Odpowiedziałem: Oto jestem."
"2Sm1,8": "I zapytał mnie: Kim jesteś? Odpowiedziałem mu: Jestem Amalekitą."
"2Sm1,9": "Wtedy powiedział mi: Stań, proszę, nade mną i zabij mnie, bo ogarnęła mnie udręka, a moje życie jest jeszcze we mnie."
"2Sm1,10": "Stanąłem więc nad nim i zabiłem go, bo wiedziałem, że nie przeżyje po swoim upadku. Potem wziąłem koronę, która była na jego głowie, oraz naramiennik, który miał na ramieniu, i przyniosłem je tutaj do swojego pana."
"2Sm1,11": "Wtedy Dawid chwycił swoje szaty i rozdarł je, tak uczynili również wszyscy ludzie, którzy z nim byli."
"2Sm1,12": "Lamentowali i płakali, i pościli aż do wieczora po Saulu i jego synu Jonatanie, po ludzie PANA i po domu Izraela, że padli od miecza."
"2Sm1,13": "I Dawid zapytał młodzieńca, który mu to powiedział: Skąd jesteś? Odpowiedział: Jestem synem przybysza, Amalekity."
"2Sm1,14": "Dawid znowu zapytał go: Jakże nie bałeś się wyciągnąć swej ręki, aby zabić pomazańca PANA?"
"2Sm1,15": "Następnie Dawid zawołał jednego ze sług i rozkazał: Podejdź i zabij go. Ten uderzył go tak, że umarł."
"2Sm1,16": "Dawid powiedział do niego: Twoja krew na twoją głowę, bo twoje usta świadczyły przeciw tobie, gdy mówiły: Zabiłem pomazańca PANA."
"2Sm1,17": "Wtedy Dawid podniósł lament nad Saulem i jego synem Jonatanem;"
"2Sm1,18": "Polecił także, aby synów Judy uczono strzelać z łuku. Oto co napisane jest w księdze Jaszara:"
"2Sm1,19": "Piękno Izraela poległo na twoich wzgórzach. Jakże padli mocarze!"
"2Sm1,20": "Nie opowiadajcie o tym w Gat ani nie rozgłaszajcie tego po ulicach w Aszkelonie, aby się nie cieszyły córki Filistynów, by się nie radowały córki nieobrzezanych."
"2Sm1,21": "O góry Gilboa! Niech nie pada na was ani rosa, ani deszcz i niech tam nie będzie pól żyznych. Tam bowiem została skalana tarcza mocarzy, tarcza Saula, jakby nie była namaszczona oliwą."
"2Sm1,22": "Od krwi zabitych, od tłuszczu mocarzy nie cofał się łuk Jonatana, a miecz Saula nie wracał daremnie."
"2Sm1,23": "Saul i Jonatan, ukochani i mili za życia, a w śmierci nie byli rozdzieleni, szybsi od orłów, silniejsi od lwów."
"2Sm1,24": "Córki Izraela, płaczcie nad Saulem, który was przyodziewał w piękny szkarłat i który włożył złote klejnoty na wasze szaty."
"2Sm1,25": "Jakże padli mocarze pośród bitwy! Jonatanie, na twych wzgórzach zostałeś zabity."
"2Sm1,26": "Żal mi ciebie, mój bracie, Jonatanie. Byłeś mi bardzo miły. Twoja miłość była dla mnie cenniejsza niż miłość kobiety."
"2Sm1,27": "Jakże padli mocarze i przepadły narzędzia wojny!"
