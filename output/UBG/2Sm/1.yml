"2Sm1,1":
  text: "Po śmierci Saula, gdy Dawid po rozgromieniu Amalekitów wrócił i zatrzymał się w Siklag przez dwa dni;"
  tags: []
"2Sm1,2":
  text: "Trzeciego dnia pewien człowiek przybył z obozu Saula z podartymi szatami i z prochem na głowie. Gdy przyszedł do Dawida, padł na ziemię i pokłonił mu się."
  tags: []
"2Sm1,3":
  text: "Dawid zapytał go: Skąd przybywasz? Odpowiedział mu: Uciekłem z obozu Izraela."
  tags: []
"2Sm1,4":
  text: "Dawid znowu zapytał: Co się stało? Proszę, powiedz mi. Odpowiedział: Lud uciekł z pola bitwy, a wielu ludzi padło i poległo, także Saul i jego syn Jonatan polegli."
  tags: []
"2Sm1,5":
  text: "Wtedy Dawid zapytał młodzieńca, który mu to powiedział: Skąd wiesz, że Saul i jego syn Jonatan umarli?"
  tags: []
"2Sm1,6":
  text: "Młodzieniec, który mu to oznajmił, odpowiedział: Przypadkiem znalazłem się na górze Gilboa, a oto Saul opierał się na swojej włóczni, a rydwany i jeźdźcy doganiali go."
  tags: []
"2Sm1,7":
  text: "Kiedy obejrzał się i zobaczył mnie, zawołał na mnie. Odpowiedziałem: Oto jestem."
  tags: []
"2Sm1,8":
  text: "I zapytał mnie: Kim jesteś? Odpowiedziałem mu: Jestem Amalekitą."
  tags: []
"2Sm1,9":
  text: "Wtedy powiedział mi: Stań, proszę, nade mną i zabij mnie, bo ogarnęła mnie udręka, a moje życie jest jeszcze we mnie."
  tags: []
"2Sm1,10":
  text: "Stanąłem więc nad nim i zabiłem go, bo wiedziałem, że nie przeżyje po swoim upadku. Potem wziąłem koronę, która była na jego głowie, oraz naramiennik, który miał na ramieniu, i przyniosłem je tutaj do swojego pana."
  tags: []
"2Sm1,11":
  text: "Wtedy Dawid chwycił swoje szaty i rozdarł je, tak uczynili również wszyscy ludzie, którzy z nim byli."
  tags: []
"2Sm1,12":
  text: "Lamentowali i płakali, i pościli aż do wieczora po Saulu i jego synu Jonatanie, po ludzie PANA i po domu Izraela, że padli od miecza."
  tags: []
"2Sm1,13":
  text: "I Dawid zapytał młodzieńca, który mu to powiedział: Skąd jesteś? Odpowiedział: Jestem synem przybysza, Amalekity."
  tags: []
"2Sm1,14":
  text: "Dawid znowu zapytał go: Jakże nie bałeś się wyciągnąć swej ręki, aby zabić pomazańca PANA?"
  tags: []
"2Sm1,15":
  text: "Następnie Dawid zawołał jednego ze sług i rozkazał: Podejdź i zabij go. Ten uderzył go tak, że umarł."
  tags: []
"2Sm1,16":
  text: "Dawid powiedział do niego: Twoja krew na twoją głowę, bo twoje usta świadczyły przeciw tobie, gdy mówiły: Zabiłem pomazańca PANA."
  tags: []
"2Sm1,17":
  text: "Wtedy Dawid podniósł lament nad Saulem i jego synem Jonatanem;"
  tags: []
"2Sm1,18":
  text: "Polecił także, aby synów Judy uczono strzelać z łuku. Oto co napisane jest w księdze Jaszara:"
  tags: []
"2Sm1,19":
  text: "Piękno Izraela poległo na twoich wzgórzach. Jakże padli mocarze!"
  tags: []
"2Sm1,20":
  text: "Nie opowiadajcie o tym w Gat ani nie rozgłaszajcie tego po ulicach w Aszkelonie, aby się nie cieszyły córki Filistynów, by się nie radowały córki nieobrzezanych."
  tags: []
"2Sm1,21":
  text: "O góry Gilboa! Niech nie pada na was ani rosa, ani deszcz i niech tam nie będzie pól żyznych. Tam bowiem została skalana tarcza mocarzy, tarcza Saula, jakby nie była namaszczona oliwą."
  tags: []
"2Sm1,22":
  text: "Od krwi zabitych, od tłuszczu mocarzy nie cofał się łuk Jonatana, a miecz Saula nie wracał daremnie."
  tags: []
"2Sm1,23":
  text: "Saul i Jonatan, ukochani i mili za życia, a w śmierci nie byli rozdzieleni, szybsi od orłów, silniejsi od lwów."
  tags: []
"2Sm1,24":
  text: "Córki Izraela, płaczcie nad Saulem, który was przyodziewał w piękny szkarłat i który włożył złote klejnoty na wasze szaty."
  tags: []
"2Sm1,25":
  text: "Jakże padli mocarze pośród bitwy! Jonatanie, na twych wzgórzach zostałeś zabity."
  tags: []
"2Sm1,26":
  text: "Żal mi ciebie, mój bracie, Jonatanie. Byłeś mi bardzo miły. Twoja miłość była dla mnie cenniejsza niż miłość kobiety."
  tags: []
"2Sm1,27":
  text: "Jakże padli mocarze i przepadły narzędzia wojny!"
  tags: []
