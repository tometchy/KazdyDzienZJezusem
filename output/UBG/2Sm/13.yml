"2Sm13,1":
  text: "Później stało się tak: Absalom, syn Dawida, miał piękną siostrę imieniem Tamar. I zakochał się w niej Amnon, syn Dawida."
  tags: []
"2Sm13,2":
  text: "I dręczył się Amnon tak, że zachorował z powodu swojej siostry Tamar. Była bowiem dziewicą i Amnonowi zdawało się rzeczą trudną, aby uczynić jej cokolwiek."
  tags: []
"2Sm13,3":
  text: "Lecz Amnon miał przyjaciela imieniem Jonadab, syna Szimy, brata Dawida. A Jonadab był człowiekiem bardzo przebiegłym."
  tags: []
"2Sm13,4":
  text: "Ten go zapytał: Dlaczego ty, synu królewski, tak mizerniejesz z dnia na dzień? Dlaczego mi nic nie mówisz? Amnon odpowiedział: Zakochałem się w Tamar, siostrze mojego brata Absaloma."
  tags: []
"2Sm13,5":
  text: "Jonadab powiedział mu: Połóż się do łóżka i udawaj chorego. Gdy twój ojciec przyjdzie, aby cię odwiedzić, powiesz mu: Pozwól, proszę, aby przyszła moja siostra Tamar i dała mi jeść, aby przygotowała posiłek na moich oczach, bym to widział i jadł z jej ręki."
  tags: []
"2Sm13,6":
  text: "Amnon położył się więc i udawał chorego. A gdy król przyszedł go odwiedzić, Amnon powiedział do króla: Pozwól, proszę, aby moja siostra Tamar przyszła i przygotowała na moich oczach dwa placki, abym jadł z jej ręki."
  tags: []
"2Sm13,7":
  text: "Wtedy Dawid posłał Tamar do domu, mówiąc: Idź teraz do domu twego brata Amnona i przygotuj mu posiłek."
  tags: []
"2Sm13,8":
  text: "Tamar przyszła więc do domu swego brata Amnona, a on leżał. Wzięła mąkę i zagniotła ciasto, po czym uczyniła placki na jego oczach i upiekła je."
  tags: []
"2Sm13,9":
  text: "Potem wzięła patelnię i wyłożyła je przed nim, lecz nie chciał jeść. I Amnon rozkazał: Niech wszyscy wyjdą ode mnie. Wszyscy wyszli więc od niego."
  tags: []
"2Sm13,10":
  text: "Wtedy Amnon powiedział do Tamar: Przynieś jedzenie do sypialni, abym jadł z twojej ręki. Tamar wzięła więc placki, które przyrządziła, i przyniosła je swemu bratu Amnonowi do sypialni."
  tags: []
"2Sm13,11":
  text: "A gdy podawała mu je do jedzenia, pochwycił ją i powiedział do niej: Chodź, połóż się ze mną, moja siostro."
  tags: []
"2Sm13,12":
  text: "Ona mu odpowiedziała: Nie, mój bracie, nie hańb mnie, bo tak się nie postępuje w Izraelu. Nie popełniaj tego haniebnego czynu."
  tags: []
"2Sm13,13":
  text: "Dokąd bowiem się udam ze swoją hańbą? A ty staniesz się jak jeden z ludzi nikczemnych w Izraelu. Proszę, porozmawiaj raczej z królem, bo on ci mnie nie odmówi."
  tags: []
"2Sm13,14":
  text: "Lecz on nie chciał posłuchać jej głosu, ale przemógł ją i zhańbił, i położył się z nią."
  tags: []
"2Sm13,15":
  text: "Potem Amnon znienawidził ją tak bardzo, że nienawiść, którą ją znienawidził, była większa niż miłość, jaką ją miłował. I Amnon powiedział jej: Wstań, idź stąd!"
  tags: []
"2Sm13,16":
  text: "Odpowiedziała: Z jakiego powodu? Wyrzucając mnie, czynisz mi większą krzywdę niż ta, którą już wyrządziłeś. Ale nie chciał jej posłuchać."
  tags: []
"2Sm13,17":
  text: "Wtedy zawołał swego sługę, który mu usługiwał, i rozkazał: Wyprowadź tę kobietę ode mnie i zarygluj za nią drzwi."
  tags: []
"2Sm13,18":
  text: "A miała na sobie kolorową suknię, gdyż w takie szaty ubierały się córki króla, które były dziewicami. Wtedy jego sługa wyprowadził ją i zaryglował za nią drzwi."
  tags: []
"2Sm13,19":
  text: "I Tamar posypała swą głowę popiołem, rozdarła kolorową suknię, którą nosiła, położyła rękę na głowie i odeszła, głośno płacząc."
  tags: []
"2Sm13,20":
  text: "Wtedy jej brat Absalom zapytał ją: Czy twój brat Amnon był z tobą? Ale milcz, moja siostro. To twój brat. Nie bierz tego do serca. Tamar mieszkała więc w osamotnieniu w domu swego brata Absaloma."
  tags: []
"2Sm13,21":
  text: "Gdy król Dawid usłyszał o tym wszystkim, bardzo się rozgniewał."
  tags: []
"2Sm13,22":
  text: "Absalom zaś nie rozmawiał z Amnonem ani źle, ani dobrze. Absalom bowiem nienawidził Amnona za to, że zhańbił jego siostrę Tamar."
  tags: []
"2Sm13,23":
  text: "Po upływie dwóch lat, gdy strzyżono owce Absaloma w Baal-Chasor, które znajduje się w pobliżu Efraim, Absalom zaprosił wszystkich synów króla."
  tags: []
"2Sm13,24":
  text: "Absalom przyszedł do króla i powiedział: Oto teraz strzygą owce twemu słudze. Proszę, niech król i jego słudzy pójdą z twoim sługą."
  tags: []
"2Sm13,25":
  text: "Lecz król powiedział do Absaloma: Nie, mój synu. Teraz nie pójdziemy wszyscy, aby nie być dla ciebie ciężarem. A chociaż nalegał na niego, on nie chciał iść, ale go błogosławił."
  tags: []
"2Sm13,26":
  text: "Wtedy Absalom powiedział: Jeśli nie, proszę, niech pójdzie z nami mój brat Amnon. Król zapytał go: Po cóż miałby iść z tobą?"
  tags: []
"2Sm13,27":
  text: "A gdy Absalom nalegał na niego, posłał z nim Amnona i wszystkich synów króla."
  tags: []
"2Sm13,28":
  text: "Absalom zaś nakazał swoim sługom: Zauważcie, kiedy serce Amnona podochoci się winem, a gdy powiem wam: Zabijcie Amnona, zabijcie go, nie bójcie się. Ja bowiem nakazuję to wam. Bądźcie odważni i sprawcie się dzielnie."
  tags: []
"2Sm13,29":
  text: "I słudzy Absaloma uczynili z Amnonem tak, jak im nakazał Absalom. Wtedy wszyscy synowie króla wstali, każdy z nich dosiadł swego muła, i uciekli."
  tags: []
"2Sm13,30":
  text: "A gdy jeszcze byli w drodze, dotarła do Dawida wieść: Absalom pozabijał wszystkich synów króla i nie pozostał z nich ani jeden."
  tags: []
"2Sm13,31":
  text: "Wtedy król wstał i rozdarł swoje szaty, i położył się na ziemi. Wszyscy jego słudzy stali dokoła niego w rozdartych szatach."
  tags: []
"2Sm13,32":
  text: "Wtedy odezwał się Jonadab, syn Szimy, brata Dawida: Niech mój pan nie myśli, że zabito wszystkich młodzieńców, synów króla, bo tylko Amnon został zabity. Takie bowiem było postanowienie w umyśle Absaloma od tego dnia, w którym zhańbił jego siostrę Tamar."
  tags: []
"2Sm13,33":
  text: "Teraz więc niech mój pan, król, nie dopuszcza tego do serca, myśląc, że zginęli wszyscy synowie króla, gdyż tylko Amnon zginął."
  tags: []
"2Sm13,34":
  text: "Absalom zaś uciekł. A gdy młodzieniec pełniący straż podniósł oczy i spojrzał, oto za nim mnóstwo ludzi przychodziło drogą ze zbocza góry."
  tags: []
"2Sm13,35":
  text: "I Jonadab powiedział do króla: Oto synowie króla nadchodzą. Stało się tak, jak twój sługa powiedział."
  tags: []
"2Sm13,36":
  text: "A gdy przestał mówić, oto przybyli synowie króla, podnieśli głos i płakali. Król i wszyscy jego słudzy również gorzko płakali."
  tags: []
"2Sm13,37":
  text: "Absalom zaś uciekł i poszedł do Talmaja, syna Ammihuda, króla Geszur. A Dawid opłakiwał swego syna przez wszystkie te dni."
  tags: []
"2Sm13,38":
  text: "Absalom uciekł więc i przyszedł do Geszur, gdzie przebywał przez trzy lata."
  tags: []
"2Sm13,39":
  text: "Potem król Dawid zapragnął zobaczyć Absaloma. Był już bowiem pocieszony po śmierci Amnona."
  tags: []
