"2Sm15,1": "Potem Absalom sprawił sobie rydwany i konie, a także pięćdziesięciu mężczyzn, którzy przed nim biegali."
"2Sm15,2": "Absalom wstawał wcześnie rano i stawał przy drodze do bramy. A każdego, kto miał sprawę i udawał się do króla na sąd, Absalom przyzywał do siebie i pytał: Z jakiego miasta jesteś? Ten odpowiadał: Twój sługa jest z jednego z pokoleń Izraela."
"2Sm15,3": "Wtedy Absalom mówił mu: Patrz, twoja sprawa jest dobra i sprawiedliwa, ale u króla nie ma nikogo, kto by cię wysłuchał."
"2Sm15,4": "Potem Absalom mówił: O gdyby mnie ustanowiono sędzią w tej ziemi, aby mógł przychodzić do mnie każdy, kto ma sprawę lub spór, to wymierzałbym mu sprawiedliwość."
"2Sm15,5": "A gdy ktoś się zbliżał i pokłonił mu się, wyciągał rękę, obejmował go i całował."
"2Sm15,6": "Tak Absalom postępował z całym Izraelem, który przychodził do króla na sąd. I Absalom wykradał serca ludu Izraela."
"2Sm15,7": "Po upływie czterdziestu lat Absalom powiedział do króla: Proszę, pozwól mi iść i wypełnić w Hebronie ślub, który złożyłem PANU."
"2Sm15,8": "Twój sługa bowiem złożył ślub, kiedy przebywał w Geszur w Syrii, mówiąc: Jeśli PAN naprawdę przywróci mnie do Jerozolimy, wtedy będę służyć PANU."
"2Sm15,9": "I król odpowiedział mu: Idź w pokoju. Wstał więc i udał się do Hebronu."
"2Sm15,10": "Lecz Absalom rozesłał szpiegów do wszystkich pokoleń Izraela, aby mówili: Gdy tylko usłyszycie dźwięk trąby, powiedzcie: Absalom króluje w Hebronie."
"2Sm15,11": "Z Absalomem wyruszyło dwustu zaproszonych mężczyzn z Jerozolimy, którzy szli w swojej prostocie, nie wiedząc o niczym."
"2Sm15,12": "Gdy Absalom składał ofiary, wezwał on także Achitofela, Gilonitę, doradcę Dawida, z jego miasta Gilo. I spisek się wzmagał, bo coraz więcej ludzi przystawało do Absaloma."
"2Sm15,13": "Potem do Dawida przyszedł posłaniec, mówiąc: Serca ludzi Izraela zwróciły się do Absaloma."
"2Sm15,14": "Wtedy Dawid powiedział do wszystkich swoich sług, którzy byli z nim w Jerozolimie: Wstańcie i uciekajmy, bo inaczej nie ujdziemy przed Absalomem. Spieszcie się z wymarszem, żeby czasem nie dopadł nas znienacka, nie sprowadził na nas nieszczęścia i nie wytępił miasta ostrzem miecza."
"2Sm15,15": "Słudzy króla powiedzieli do niego: Wszystko, co postanowi nasz pan, król, oto twoi słudzy uczynią."
"2Sm15,16": "Król wyszedł więc pieszo, a z nim cały jego dom. Król zostawił jednak dziesięć kobiet, nałożnic, aby pilnowały domu."
"2Sm15,17": "A gdy król wyszedł pieszo wraz z całym ludem, zatrzymali się w pewnym odległym miejscu."
"2Sm15,18": "Wszyscy jego słudzy szli przy nim, a wszyscy Keretyci, wszyscy Peletyci, wszyscy Gittyci, w liczbie sześciuset mężczyzn, którzy przyszli za nim z Gat, przeszli przed królem."
"2Sm15,19": "Wtedy król zapytał Ittaja Gittytę: Czemu i ty idziesz z nami? Wróć do siebie i pozostań przy królu. Jesteś bowiem cudzoziemcem, a nawet wygnańcem."
"2Sm15,20": "Dopiero wczoraj przyszedłeś, a dziś miałbym cię zabrać, abyś się tułał z nami? Skoro sam nie wiem, dokąd idę, ty wróć i odprowadź swoich braci. Niech będą z tobą miłosierdzie i prawda."
"2Sm15,21": "Ale Ittaj odpowiedział królowi: Jak żyje PAN i jak żyje mój pan, król, gdziekolwiek będzie mój pan, król, czy to na śmierć, czy na życie, tam też będzie twój sługa."
"2Sm15,22": "I Dawid powiedział do Ittaja: Idź więc i przejdź. Przeszedł więc Ittaj Gittyta i wszyscy jego mężczyźni, i wszystkie dzieci, które z nim były."
"2Sm15,23": "I cała ziemia głośno płakała, cały lud zaś przeszedł. Potem sam król przeszedł przez potok Cedron i w ten sposób cały lud przeszedł, i skierował się na drogę ku pustyni."
"2Sm15,24": "A oto był z nim i Sadok, i wszyscy Lewici niosący arkę przymierza Boga. Postawili arkę Boga, a Abiatar wstąpił, aż cały lud wyszedł z miasta."
"2Sm15,25": "Potem król powiedział do Sadoka: Odnieś arkę Boga do miasta. Jeśli znajdę łaskę w oczach PANA, to przywróci mnie i pokaże mi ją oraz jej przybytek."
"2Sm15,26": "Ale jeśli powie: Nie mam w tobie upodobania – oto jestem, niech mi uczyni, co jest dobre w jego oczach."
"2Sm15,27": "Król powiedział jeszcze do kapłana Sadoka: Czy nie jesteś widzącym? Wróć do miasta w pokoju wraz ze swoimi dwoma synami – Achimaasem, twoim synem, i Jonatanem, synem Abiatara."
"2Sm15,28": "Oto będę czekał na równinach pustyni, dopóki nie nadejdzie od was słowo dające mi znać."
"2Sm15,29": "Sadok i Abiatar odnieśli więc arkę Boga do Jerozolimy i tam pozostali."
"2Sm15,30": "Dawid zaś wstępował na Górę Oliwną, wstępował i płakał, a głowę miał zakrytą i szedł boso. Cały lud, który był z nim, każdy z nakrytą głową, wstępował i płakał."
"2Sm15,31": "Wtedy doniesiono Dawidowi: Achitofel jest wśród spiskowców z Absalomem. Dawid powiedział: O PANIE, proszę, obróć w głupstwo radę Achitofela."
"2Sm15,32": "Kiedy Dawid dotarł na szczyt góry, gdzie oddał pokłon Bogu, oto wyszedł mu na spotkanie Chuszaj Arkita w rozdartej szacie i z prochem na głowie."
"2Sm15,33": "Dawid powiedział do niego: Jeśli pójdziesz ze mną, będziesz mi ciężarem;"
"2Sm15,34": "Lecz jeśli wrócisz do miasta i powiesz Absalomowi: Królu, będę twoim sługą. Jak byłem dotąd sługą twego ojca, tak teraz będę twoim sługą – wtedy na moją korzyść obrócisz wniwecz radę Achitofela."
"2Sm15,35": "Czyż nie ma tam z tobą kapłanów Sadoka i Abiatara? Cokolwiek więc usłyszysz z domu króla, doniesiesz o tym kapłanom Sadokowi i Abiatarowi."
"2Sm15,36": "Oto są tam też z nimi ich dwaj synowie, Achimaas, syn Sadoka, i Jonatan, syn Abiatara. Przez nich przyślecie do mnie każde słowo, które usłyszycie."
"2Sm15,37": "Przybył więc Chuszaj, przyjaciel Dawida, do miasta, a Absalom także wjechał do Jerozolimy."
