"2Sm15,1":
  text: "Potem Absalom sprawił sobie rydwany i konie, a także pięćdziesięciu mężczyzn, którzy przed nim biegali."
  tags: []
"2Sm15,2":
  text: "Absalom wstawał wcześnie rano i stawał przy drodze do bramy. A każdego, kto miał sprawę i udawał się do króla na sąd, Absalom przyzywał do siebie i pytał: Z jakiego miasta jesteś? Ten odpowiadał: Twój sługa jest z jednego z pokoleń Izraela."
  tags: []
"2Sm15,3":
  text: "Wtedy Absalom mówił mu: Patrz, twoja sprawa jest dobra i sprawiedliwa, ale u króla nie ma nikogo, kto by cię wysłuchał."
  tags: []
"2Sm15,4":
  text: "Potem Absalom mówił: O gdyby mnie ustanowiono sędzią w tej ziemi, aby mógł przychodzić do mnie każdy, kto ma sprawę lub spór, to wymierzałbym mu sprawiedliwość."
  tags: []
"2Sm15,5":
  text: "A gdy ktoś się zbliżał i pokłonił mu się, wyciągał rękę, obejmował go i całował."
  tags: []
"2Sm15,6":
  text: "Tak Absalom postępował z całym Izraelem, który przychodził do króla na sąd. I Absalom wykradał serca ludu Izraela."
  tags: []
"2Sm15,7":
  text: "Po upływie czterdziestu lat Absalom powiedział do króla: Proszę, pozwól mi iść i wypełnić w Hebronie ślub, który złożyłem PANU."
  tags: []
"2Sm15,8":
  text: "Twój sługa bowiem złożył ślub, kiedy przebywał w Geszur w Syrii, mówiąc: Jeśli PAN naprawdę przywróci mnie do Jerozolimy, wtedy będę służyć PANU."
  tags: []
"2Sm15,9":
  text: "I król odpowiedział mu: Idź w pokoju. Wstał więc i udał się do Hebronu."
  tags: []
"2Sm15,10":
  text: "Lecz Absalom rozesłał szpiegów do wszystkich pokoleń Izraela, aby mówili: Gdy tylko usłyszycie dźwięk trąby, powiedzcie: Absalom króluje w Hebronie."
  tags: []
"2Sm15,11":
  text: "Z Absalomem wyruszyło dwustu zaproszonych mężczyzn z Jerozolimy, którzy szli w swojej prostocie, nie wiedząc o niczym."
  tags: []
"2Sm15,12":
  text: "Gdy Absalom składał ofiary, wezwał on także Achitofela, Gilonitę, doradcę Dawida, z jego miasta Gilo. I spisek się wzmagał, bo coraz więcej ludzi przystawało do Absaloma."
  tags: []
"2Sm15,13":
  text: "Potem do Dawida przyszedł posłaniec, mówiąc: Serca ludzi Izraela zwróciły się do Absaloma."
  tags: []
"2Sm15,14":
  text: "Wtedy Dawid powiedział do wszystkich swoich sług, którzy byli z nim w Jerozolimie: Wstańcie i uciekajmy, bo inaczej nie ujdziemy przed Absalomem. Spieszcie się z wymarszem, żeby czasem nie dopadł nas znienacka, nie sprowadził na nas nieszczęścia i nie wytępił miasta ostrzem miecza."
  tags: []
"2Sm15,15":
  text: "Słudzy króla powiedzieli do niego: Wszystko, co postanowi nasz pan, król, oto twoi słudzy uczynią."
  tags: []
"2Sm15,16":
  text: "Król wyszedł więc pieszo, a z nim cały jego dom. Król zostawił jednak dziesięć kobiet, nałożnic, aby pilnowały domu."
  tags: []
"2Sm15,17":
  text: "A gdy król wyszedł pieszo wraz z całym ludem, zatrzymali się w pewnym odległym miejscu."
  tags: []
"2Sm15,18":
  text: "Wszyscy jego słudzy szli przy nim, a wszyscy Keretyci, wszyscy Peletyci, wszyscy Gittyci, w liczbie sześciuset mężczyzn, którzy przyszli za nim z Gat, przeszli przed królem."
  tags: []
"2Sm15,19":
  text: "Wtedy król zapytał Ittaja Gittytę: Czemu i ty idziesz z nami? Wróć do siebie i pozostań przy królu. Jesteś bowiem cudzoziemcem, a nawet wygnańcem."
  tags: []
"2Sm15,20":
  text: "Dopiero wczoraj przyszedłeś, a dziś miałbym cię zabrać, abyś się tułał z nami? Skoro sam nie wiem, dokąd idę, ty wróć i odprowadź swoich braci. Niech będą z tobą miłosierdzie i prawda."
  tags: []
"2Sm15,21":
  text: "Ale Ittaj odpowiedział królowi: Jak żyje PAN i jak żyje mój pan, król, gdziekolwiek będzie mój pan, król, czy to na śmierć, czy na życie, tam też będzie twój sługa."
  tags: []
"2Sm15,22":
  text: "I Dawid powiedział do Ittaja: Idź więc i przejdź. Przeszedł więc Ittaj Gittyta i wszyscy jego mężczyźni, i wszystkie dzieci, które z nim były."
  tags: []
"2Sm15,23":
  text: "I cała ziemia głośno płakała, cały lud zaś przeszedł. Potem sam król przeszedł przez potok Cedron i w ten sposób cały lud przeszedł, i skierował się na drogę ku pustyni."
  tags: []
"2Sm15,24":
  text: "A oto był z nim i Sadok, i wszyscy Lewici niosący arkę przymierza Boga. Postawili arkę Boga, a Abiatar wstąpił, aż cały lud wyszedł z miasta."
  tags: []
"2Sm15,25":
  text: "Potem król powiedział do Sadoka: Odnieś arkę Boga do miasta. Jeśli znajdę łaskę w oczach PANA, to przywróci mnie i pokaże mi ją oraz jej przybytek."
  tags: []
"2Sm15,26":
  text: "Ale jeśli powie: Nie mam w tobie upodobania – oto jestem, niech mi uczyni, co jest dobre w jego oczach."
  tags: []
"2Sm15,27":
  text: "Król powiedział jeszcze do kapłana Sadoka: Czy nie jesteś widzącym? Wróć do miasta w pokoju wraz ze swoimi dwoma synami – Achimaasem, twoim synem, i Jonatanem, synem Abiatara."
  tags: []
"2Sm15,28":
  text: "Oto będę czekał na równinach pustyni, dopóki nie nadejdzie od was słowo dające mi znać."
  tags: []
"2Sm15,29":
  text: "Sadok i Abiatar odnieśli więc arkę Boga do Jerozolimy i tam pozostali."
  tags: []
"2Sm15,30":
  text: "Dawid zaś wstępował na Górę Oliwną, wstępował i płakał, a głowę miał zakrytą i szedł boso. Cały lud, który był z nim, każdy z nakrytą głową, wstępował i płakał."
  tags: []
"2Sm15,31":
  text: "Wtedy doniesiono Dawidowi: Achitofel jest wśród spiskowców z Absalomem. Dawid powiedział: O PANIE, proszę, obróć w głupstwo radę Achitofela."
  tags: []
"2Sm15,32":
  text: "Kiedy Dawid dotarł na szczyt góry, gdzie oddał pokłon Bogu, oto wyszedł mu na spotkanie Chuszaj Arkita w rozdartej szacie i z prochem na głowie."
  tags: []
"2Sm15,33":
  text: "Dawid powiedział do niego: Jeśli pójdziesz ze mną, będziesz mi ciężarem;"
  tags: []
"2Sm15,34":
  text: "Lecz jeśli wrócisz do miasta i powiesz Absalomowi: Królu, będę twoim sługą. Jak byłem dotąd sługą twego ojca, tak teraz będę twoim sługą – wtedy na moją korzyść obrócisz wniwecz radę Achitofela."
  tags: []
"2Sm15,35":
  text: "Czyż nie ma tam z tobą kapłanów Sadoka i Abiatara? Cokolwiek więc usłyszysz z domu króla, doniesiesz o tym kapłanom Sadokowi i Abiatarowi."
  tags: []
"2Sm15,36":
  text: "Oto są tam też z nimi ich dwaj synowie, Achimaas, syn Sadoka, i Jonatan, syn Abiatara. Przez nich przyślecie do mnie każde słowo, które usłyszycie."
  tags: []
"2Sm15,37":
  text: "Przybył więc Chuszaj, przyjaciel Dawida, do miasta, a Absalom także wjechał do Jerozolimy."
  tags: []
