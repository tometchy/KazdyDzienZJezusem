"2Sm21,1": "I za czasów Dawida panował głód przez trzy lata, rok po roku. Dawid szukał więc oblicza PANA, a PAN odpowiedział: To z powodu Saula i jego krwawego domu, ponieważ wymordował Gibeonitów."
"2Sm21,2": "Wtedy król wezwał Gibeonitów i przemówił do nich. A Gibeonici nie wywodzili się z synów Izraela, ale z resztki Amorytów. I chociaż synowie Izraela przysięgli im, Saul jednak usiłował wytępić ich w swej gorliwości względem synów Izraela i Judy."
"2Sm21,3": "Dawid zapytał więc Gibeonitów: Cóż mam dla was uczynić? A czym was ułagodzić, abyście błogosławili dziedzictwo PANA?"
"2Sm21,4": "I odpowiedzieli mu Gibeonici: Nie chodzi nam o srebro ani o złoto od Saula i jego domu, ani o to, żeby zabito kogoś w Izraelu. A on odpowiedział: Cokolwiek powiecie, to dla was uczynię."
"2Sm21,5": "Oni powiedzieli do króla: Co do mężczyzny, który nas wygubił i zmierzał do tego, aby nas wytępić, żeby nikt z nas nie pozostał we wszystkich granicach Izraela;"
"2Sm21,6": "Wydajcie nam siedmiu z jego synów, a my powiesimy ich przed PANEM w Gibea Saula, który był wybrańcem PANA. Król odpowiedział: Wydam ich."
"2Sm21,7": "Lecz król oszczędził Mefiboszeta, syna Jonatana, syna Saula, z powodu przysięgi PANA, która była między nimi, między Dawidem a Jonatanem, synem Saula."
"2Sm21,8": "Ale król wziął dwóch synów Rispy, córki Aji, których urodziła Saulowi, Armoniego i Mefiboszeta, i pięciu synów siostry Mikal, córki Saula, których urodziła Adrielowi, synowi Barzillaja z Mecholi;"
"2Sm21,9": "I wydał ich w ręce Gibeonitów, a oni powiesili ich na górze przed PANEM. Razem umarło ich siedmiu, zostali zabici w pierwsze dni żniw, na początku żniw jęczmienia."
"2Sm21,10": "Wtedy Rispa, córka Aji, wzięła wór i rozciągnęła go na skale, na początku żniw, aż do czasu, gdy spadł na nich deszcz z nieba, i nie pozwalała, aby ptactwo powietrzne zbliżało się do nich za dnia, ani zwierzęta polne – nocą."
"2Sm21,11": "Potem doniesiono Dawidowi o tym, co uczyniła Rispa, córka Aji, nałożnica Saula."
"2Sm21,12": "Dawid poszedł więc i wziął kości Saula i kości Jonatana, jego syna, od starszych Jabesz-Gilead, którzy ukradli je z placu Bet-Szan, gdzie ich zawiesili Filistyni w dniu zabicia Saula przez Filistynów w Gilboa."
"2Sm21,13": "Wziął więc stamtąd kości Saula i kości Jonatana, jego syna; zebrano też kości powieszonych;"
"2Sm21,14": "I pogrzebali kości Saula i Jonatana, jego syna, w ziemi Beniamina w Sela, w grobie Kisza, jego ojca. Uczynili wszystko, co król nakazał. Potem Bóg dał się ubłagać co do ziemi."
"2Sm21,15": "Później znowu doszło do wojny między Filistynami a Izraelem. I Dawid wyruszył wraz ze swymi sługami i walczyli z Filistynami, a Dawid był znużony."
"2Sm21,16": "Wtedy Iszbibenob, który wywodził się z synów pewnego olbrzyma, a którego włócznia ważyła trzysta syklów brązu i który miał przepasany nowy miecz, postanowił, że zabije Dawida."
"2Sm21,17": "Lecz Abiszaj, syn Serui, przyszedł mu z pomocą, uderzył Filistyna i zabił go. Wtedy ludzie Dawida przysięgli mu: Nie będziesz już wyruszał z nami do bitwy, abyś nie zgasił pochodni Izraela."
"2Sm21,18": "Potem znowu była bitwa z Filistynami w Gob. Wtedy Sibbekaj Chuszatyta zabił Safa, który pochodził z synów tego olbrzyma."
"2Sm21,19": "Była też jeszcze inna wojna z Filistynami w Gob, podczas której Elchanan, syn Jaara Oregima z Betlejem, zabił brata Goliata Gittyty, którego drzewce włóczni były jak wał tkacki."
"2Sm21,20": "Ponadto toczyła się jeszcze wojna w Gat, gdzie był człowiek wysokiego wzrostu, mający po sześć palców u rąk i po sześć palców u nóg, razem dwadzieścia cztery. On także był synem tego olbrzyma."
"2Sm21,21": "Gdy urągał on Izraelowi, zabił go Jonatan, syn Szimei, brata Dawida."
"2Sm21,22": "Ci czterej byli synami tego olbrzyma z Gat, a polegli z ręki Dawida i z ręki jego sług."
