"2Sm8,1":
  text: "Po tych wydarzeniach Dawid pobił Filistynów i ujarzmił ich. Dawid zabrał też z rąk Filistynów Meteg-Amma."
  tags: []
"2Sm8,2":
  text: "Pobił także Moabitów, których zmierzył sznurem i ułożył na ziemi. Wymierzył ich dwa sznury do zabicia, a jeden cały sznur do zachowania przy życiu. I Moabici zostali sługami Dawida płacącymi daninę."
  tags: []
"2Sm8,3":
  text: "Dawid pobił również Hadadezera, syna Rechoba, króla Soby, kiedy ten wyruszał, aby przywrócić swoją granicę nad rzeką Eufrat."
  tags: []
"2Sm8,4":
  text: "I Dawid zabrał mu tysiąc rydwanów, siedmiuset jeźdźców i dwadzieścia tysięcy piechoty. I Dawid popodcinał ścięgna wszystkim koniom zaprzęgowym, zostawiając z nich tylko tyle, ile potrzeba do stu rydwanów."
  tags: []
"2Sm8,5":
  text: "Kiedy Syryjczycy z Damaszku przybyli na pomoc Hadadezerowi, królowi Soby, Dawid pobił spośród Syryjczyków dwadzieścia dwa tysiące ludzi."
  tags: []
"2Sm8,6":
  text: "Potem Dawid umieścił załogi w Syrii, w Damaszku, a Syryjczycy zostali sługami Dawida płacącymi daninę. I PAN bronił Dawida wszędzie, dokądkolwiek się udał."
  tags: []
"2Sm8,7":
  text: "Dawid zabrał też złote tarcze, które mieli słudzy Hadadezera, i przyniósł je do Jerozolimy."
  tags: []
"2Sm8,8":
  text: "I z Betachu i z Berotaj, miast Hadadezera, król Dawid zabrał bardzo dużo brązu."
  tags: []
"2Sm8,9":
  text: "Gdy Toi, król Chamat, usłyszał, że Dawid pokonał całe wojsko Hadadezera;"
  tags: []
"2Sm8,10":
  text: "Wysłał swego syna Jorama do króla Dawida, aby go pozdrowił w pokoju i aby powinszował mu tego, że walczył z Hadadezerem i pokonał go. Hadadezer bowiem prowadził wojnę z Toi. I Joram przyniósł ze sobą przedmioty ze srebra, ze złota i z brązu."
  tags: []
"2Sm8,11":
  text: "Również i te król Dawid poświęcił PANU wraz ze srebrem i złotem, które poświęcił, zabranym od wszystkich narodów, które podbił;"
  tags: []
"2Sm8,12":
  text: "Od Syrii, od Moabu, od synów Ammona, od Filistynów, od Amaleka i z łupów Hadadezera, syna Rechoba, króla Soby."
  tags: []
"2Sm8,13":
  text: "I tak Dawid uczynił sławnym swoje imię, gdy wrócił po pokonaniu Syryjczyków w Dolinie Soli w liczbie osiemnastu tysięcy mężczyzn."
  tags: []
"2Sm8,14":
  text: "Umieścił w Edomie załogi, na całej ziemi Edomu rozmieścił je. I wszyscy Edomczycy stali się sługami Dawida. I PAN bronił Dawida wszędzie, dokądkolwiek się udał."
  tags: []
"2Sm8,15":
  text: "I Dawid królował nad całym Izraelem, i sprawował sąd nad całym swym ludem, i wymierzał mu sprawiedliwość."
  tags: []
"2Sm8,16":
  text: "Joab, syn Serui, był postawiony nad wojskiem, a Jehoszafat, syn Achiluda, był kronikarzem."
  tags: []
"2Sm8,17":
  text: "Sadok, syn Achituba, i Achimelek, syn Abiatara, byli kapłanami, a Serajasz – pisarzem."
  tags: []
"2Sm8,18":
  text: "Benajasz, syn Jehojady, był postawiony nad Keretytami i Peletytami, a synowie Dawida byli książętami."
  tags: []
