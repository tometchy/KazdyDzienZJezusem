"2Sm8,1": "Po tych wydarzeniach Dawid pobił Filistynów i ujarzmił ich. Dawid zabrał też z rąk Filistynów Meteg-Amma."
"2Sm8,2": "Pobił także Moabitów, których zmierzył sznurem i ułożył na ziemi. Wymierzył ich dwa sznury do zabicia, a jeden cały sznur do zachowania przy życiu. I Moabici zostali sługami Dawida płacącymi daninę."
"2Sm8,3": "Dawid pobił również Hadadezera, syna Rechoba, króla Soby, kiedy ten wyruszał, aby przywrócić swoją granicę nad rzeką Eufrat."
"2Sm8,4": "I Dawid zabrał mu tysiąc rydwanów, siedmiuset jeźdźców i dwadzieścia tysięcy piechoty. I Dawid popodcinał ścięgna wszystkim koniom zaprzęgowym, zostawiając z nich tylko tyle, ile potrzeba do stu rydwanów."
"2Sm8,5": "Kiedy Syryjczycy z Damaszku przybyli na pomoc Hadadezerowi, królowi Soby, Dawid pobił spośród Syryjczyków dwadzieścia dwa tysiące ludzi."
"2Sm8,6": "Potem Dawid umieścił załogi w Syrii, w Damaszku, a Syryjczycy zostali sługami Dawida płacącymi daninę. I PAN bronił Dawida wszędzie, dokądkolwiek się udał."
"2Sm8,7": "Dawid zabrał też złote tarcze, które mieli słudzy Hadadezera, i przyniósł je do Jerozolimy."
"2Sm8,8": "I z Betachu i z Berotaj, miast Hadadezera, król Dawid zabrał bardzo dużo brązu."
"2Sm8,9": "Gdy Toi, król Chamat, usłyszał, że Dawid pokonał całe wojsko Hadadezera;"
"2Sm8,10": "Wysłał swego syna Jorama do króla Dawida, aby go pozdrowił w pokoju i aby powinszował mu tego, że walczył z Hadadezerem i pokonał go. Hadadezer bowiem prowadził wojnę z Toi. I Joram przyniósł ze sobą przedmioty ze srebra, ze złota i z brązu."
"2Sm8,11": "Również i te król Dawid poświęcił PANU wraz ze srebrem i złotem, które poświęcił, zabranym od wszystkich narodów, które podbił;"
"2Sm8,12": "Od Syrii, od Moabu, od synów Ammona, od Filistynów, od Amaleka i z łupów Hadadezera, syna Rechoba, króla Soby."
"2Sm8,13": "I tak Dawid uczynił sławnym swoje imię, gdy wrócił po pokonaniu Syryjczyków w Dolinie Soli w liczbie osiemnastu tysięcy mężczyzn."
"2Sm8,14": "Umieścił w Edomie załogi, na całej ziemi Edomu rozmieścił je. I wszyscy Edomczycy stali się sługami Dawida. I PAN bronił Dawida wszędzie, dokądkolwiek się udał."
"2Sm8,15": "I Dawid królował nad całym Izraelem, i sprawował sąd nad całym swym ludem, i wymierzał mu sprawiedliwość."
"2Sm8,16": "Joab, syn Serui, był postawiony nad wojskiem, a Jehoszafat, syn Achiluda, był kronikarzem."
"2Sm8,17": "Sadok, syn Achituba, i Achimelek, syn Abiatara, byli kapłanami, a Serajasz – pisarzem."
"2Sm8,18": "Benajasz, syn Jehojady, był postawiony nad Keretytami i Peletytami, a synowie Dawida byli książętami."
