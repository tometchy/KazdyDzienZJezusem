"2Sm22,1": "Dawid wypowiedział PANU słowa tej pieśni w dniu, gdy PAN go wybawił z rąk wszystkich jego wrogów i z ręki Saula;"
"2Sm22,2": "Powiedział: PAN jest moją skałą, moją twierdzą i moim wybawicielem."
"2Sm22,3": "Bóg moją opoką, której będę ufał, moją tarczą i rogiem mojego zbawienia, moją wieżą i moją ucieczką, moim zbawicielem; wybawiasz mnie od przemocy."
"2Sm22,4": "Wzywałem PANA, który jest godny chwały, i będę wybawiony od moich wrogów."
"2Sm22,5": "Ogarnęły mnie bowiem boleści śmierci i zatrwożyły mnie potoki bezbożnych."
"2Sm22,6": "Boleści piekła mnie oplotły, pochwyciły mnie sidła śmierci."
"2Sm22,7": "W moim utrapieniu wzywałem PANA i wołałem do mojego Boga. Ze swojej świątyni usłyszał mój głos, a moje wołanie dotarło do jego uszu."
"2Sm22,8": "Wtedy ziemia poruszyła się i zadrżała, a posady nieba zatrzęsły się i zachwiały od jego gniewu."
"2Sm22,9": "Z jego nozdrzy unosił się dym, z jego ust buchnął ogień trawiący, węgle zapaliły się od niego."
"2Sm22,10": "Nachylił niebiosa i zstąpił, a ciemność była pod jego stopami."
"2Sm22,11": "Dosiadł cherubina i latał, i ukazał się na skrzydłach wiatru."
"2Sm22,12": "Z ciemności uczynił wokół siebie namiot, z ciemnych wód i z gęstych obłoków nieba."
"2Sm22,13": "Od jego blasku rozpaliły się węgle ogniste."
"2Sm22,14": "Zagrzmiał PAN z nieba, Najwyższy wydał swój głos."
"2Sm22,15": "Wypuścił strzały i rozproszył ich; błyskawicę – i ich rozgromił."
"2Sm22,16": "I ukazały się głębiny morza, i odsłoniły się fundamenty świata od upomnienia PANA, od podmuchu tchnienia jego nozdrzy."
"2Sm22,17": "Posłał z wysoka, chwycił mnie, wyciągnął z wielkich wód."
"2Sm22,18": "Ocalił mnie od mojego potężnego wroga i od tych, którzy mnie nienawidzą, choć byli ode mnie mocniejsi."
"2Sm22,19": "Zaskoczyli mnie w dniu mego utrapienia, lecz PAN był moją podporą."
"2Sm22,20": "Wyprowadził mnie na miejsce przestronne, wybawił mnie, bo mnie sobie upodobał."
"2Sm22,21": "Nagrodził mnie PAN według mojej sprawiedliwości, oddał mi według czystości moich rąk."
"2Sm22,22": "Strzegłem bowiem dróg PANA i nie odstąpiłem niegodziwie od mojego Boga."
"2Sm22,23": "Bo miałem przed oczyma wszystkie jego nakazy i od jego praw się nie odwróciłem."
"2Sm22,24": "Byłem wobec niego nienaganny i wystrzegałem się swojej nieprawości."
"2Sm22,25": "Dlatego oddał mi PAN według mojej sprawiedliwości, według mojej czystości przed jego oczyma."
"2Sm22,26": "Ty z miłosiernym miłosiernie się obejdziesz, a z człowiekiem nienagannym postąpisz nienagannie."
"2Sm22,27": "Wobec czystego okażesz się czysty, a wobec przewrotnego postąpisz przewrotnie."
"2Sm22,28": "Lecz wybawiasz lud strapiony, a twoje oczy są na wyniosłych, by ich poniżać."
"2Sm22,29": "Ty bowiem jesteś moją pochodnią, o PANIE; PAN rozjaśni moje ciemności."
"2Sm22,30": "Bo z tobą przebiłem się przez wojsko, z moim Bogiem przeskoczyłem mur."
"2Sm22,31": "Droga Boga jest doskonała, słowo PANA w ogniu wypróbowane. Tarczą jest dla wszystkich, którzy mu ufają."
"2Sm22,32": "Bo któż jest Bogiem oprócz PANA? Któż skałą oprócz naszego Boga?"
"2Sm22,33": "Bóg jest moją siłą i mocą, on czyni doskonałą moją drogę."
"2Sm22,34": "Moje nogi czyni jak u łani i stawia mnie na wyżynach."
"2Sm22,35": "Ćwiczy moje ręce do walki, tak że mogę kruszyć spiżowy łuk swymi ramionami."
"2Sm22,36": "Dałeś mi też tarczę swego zbawienia, a twoja dobrotliwość uczyniła mnie wielkim."
"2Sm22,37": "Rozszerzyłeś ścieżkę dla mych kroków, tak że moje stopy się nie zachwiały."
"2Sm22,38": "Ścigałem moich wrogów i wytraciłem ich, nie zawróciłem, aż ich nie wyniszczyłem."
"2Sm22,39": "I wyniszczyłem ich, i powaliłem, tak że nie mogli powstać, upadli pod moje stopy."
"2Sm22,40": "Przepasałeś mnie mocą do walki, powaliłeś pod moje stopy moich przeciwników."
"2Sm22,41": "Zmuszałeś moich wrogów do ucieczki, abym wykorzenił tych, którzy mnie nienawidzą."
"2Sm22,42": "Patrzyli, lecz nie było nikogo, kto by ich wybawił; spoglądali na PANA, lecz ich nie wysłuchał."
"2Sm22,43": "Starłem ich jak proch ziemi, zdeptałem ich jak błoto na ulicach, rozrzuciłem ich."
"2Sm22,44": "Ty wyzwoliłeś mnie od kłótni ludzkich, zachowałeś mnie, abym był głową narodów. Będzie mi służył lud, którego nie znałem."
"2Sm22,45": "Cudzoziemcy będą udawać uległość. Jak tylko usłyszą, będą mi posłuszni."
"2Sm22,46": "Cudzoziemcy zmarnieją i będą drżeć w swoich warowniach."
"2Sm22,47": "PAN żyje, niech będzie błogosławiona moja skała, niech będzie wywyższony Bóg, skała mojego zbawienia."
"2Sm22,48": "Bóg dokonuje za mnie zemsty i poddaje mi narody;"
"2Sm22,49": "Wyprowadza mnie spośród moich wrogów. Ty wywyższyłeś mnie ponad moich przeciwników, ocaliłeś mnie od gwałtownika."
"2Sm22,50": "Dlatego będę cię, PANIE, sławił wśród narodów i będę śpiewał twojemu imieniu."
"2Sm22,51": "On jest wieżą zbawienia dla swego króla i na wieki okazuje miłosierdzie swemu pomazańcowi Dawidowi i jego potomstwu."
