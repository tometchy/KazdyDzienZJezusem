"2Sm22,1":
  text: "Dawid wypowiedział PANU słowa tej pieśni w dniu, gdy PAN go wybawił z rąk wszystkich jego wrogów i z ręki Saula;"
  tags: []
"2Sm22,2":
  text: "Powiedział: PAN jest moją skałą, moją twierdzą i moim wybawicielem."
  tags: []
"2Sm22,3":
  text: "Bóg moją opoką, której będę ufał, moją tarczą i rogiem mojego zbawienia, moją wieżą i moją ucieczką, moim zbawicielem; wybawiasz mnie od przemocy."
  tags: []
"2Sm22,4":
  text: "Wzywałem PANA, który jest godny chwały, i będę wybawiony od moich wrogów."
  tags: []
"2Sm22,5":
  text: "Ogarnęły mnie bowiem boleści śmierci i zatrwożyły mnie potoki bezbożnych."
  tags: []
"2Sm22,6":
  text: "Boleści piekła mnie oplotły, pochwyciły mnie sidła śmierci."
  tags: []
"2Sm22,7":
  text: "W moim utrapieniu wzywałem PANA i wołałem do mojego Boga. Ze swojej świątyni usłyszał mój głos, a moje wołanie dotarło do jego uszu."
  tags: []
"2Sm22,8":
  text: "Wtedy ziemia poruszyła się i zadrżała, a posady nieba zatrzęsły się i zachwiały od jego gniewu."
  tags: []
"2Sm22,9":
  text: "Z jego nozdrzy unosił się dym, z jego ust buchnął ogień trawiący, węgle zapaliły się od niego."
  tags: []
"2Sm22,10":
  text: "Nachylił niebiosa i zstąpił, a ciemność była pod jego stopami."
  tags: []
"2Sm22,11":
  text: "Dosiadł cherubina i latał, i ukazał się na skrzydłach wiatru."
  tags: []
"2Sm22,12":
  text: "Z ciemności uczynił wokół siebie namiot, z ciemnych wód i z gęstych obłoków nieba."
  tags: []
"2Sm22,13":
  text: "Od jego blasku rozpaliły się węgle ogniste."
  tags: []
"2Sm22,14":
  text: "Zagrzmiał PAN z nieba, Najwyższy wydał swój głos."
  tags: []
"2Sm22,15":
  text: "Wypuścił strzały i rozproszył ich; błyskawicę – i ich rozgromił."
  tags: []
"2Sm22,16":
  text: "I ukazały się głębiny morza, i odsłoniły się fundamenty świata od upomnienia PANA, od podmuchu tchnienia jego nozdrzy."
  tags: []
"2Sm22,17":
  text: "Posłał z wysoka, chwycił mnie, wyciągnął z wielkich wód."
  tags: []
"2Sm22,18":
  text: "Ocalił mnie od mojego potężnego wroga i od tych, którzy mnie nienawidzą, choć byli ode mnie mocniejsi."
  tags: []
"2Sm22,19":
  text: "Zaskoczyli mnie w dniu mego utrapienia, lecz PAN był moją podporą."
  tags: []
"2Sm22,20":
  text: "Wyprowadził mnie na miejsce przestronne, wybawił mnie, bo mnie sobie upodobał."
  tags: []
"2Sm22,21":
  text: "Nagrodził mnie PAN według mojej sprawiedliwości, oddał mi według czystości moich rąk."
  tags: []
"2Sm22,22":
  text: "Strzegłem bowiem dróg PANA i nie odstąpiłem niegodziwie od mojego Boga."
  tags: []
"2Sm22,23":
  text: "Bo miałem przed oczyma wszystkie jego nakazy i od jego praw się nie odwróciłem."
  tags: []
"2Sm22,24":
  text: "Byłem wobec niego nienaganny i wystrzegałem się swojej nieprawości."
  tags: []
"2Sm22,25":
  text: "Dlatego oddał mi PAN według mojej sprawiedliwości, według mojej czystości przed jego oczyma."
  tags: []
"2Sm22,26":
  text: "Ty z miłosiernym miłosiernie się obejdziesz, a z człowiekiem nienagannym postąpisz nienagannie."
  tags: []
"2Sm22,27":
  text: "Wobec czystego okażesz się czysty, a wobec przewrotnego postąpisz przewrotnie."
  tags: []
"2Sm22,28":
  text: "Lecz wybawiasz lud strapiony, a twoje oczy są na wyniosłych, by ich poniżać."
  tags: []
"2Sm22,29":
  text: "Ty bowiem jesteś moją pochodnią, o PANIE; PAN rozjaśni moje ciemności."
  tags: []
"2Sm22,30":
  text: "Bo z tobą przebiłem się przez wojsko, z moim Bogiem przeskoczyłem mur."
  tags: []
"2Sm22,31":
  text: "Droga Boga jest doskonała, słowo PANA w ogniu wypróbowane. Tarczą jest dla wszystkich, którzy mu ufają."
  tags: []
"2Sm22,32":
  text: "Bo któż jest Bogiem oprócz PANA? Któż skałą oprócz naszego Boga?"
  tags: []
"2Sm22,33":
  text: "Bóg jest moją siłą i mocą, on czyni doskonałą moją drogę."
  tags: []
"2Sm22,34":
  text: "Moje nogi czyni jak u łani i stawia mnie na wyżynach."
  tags: []
"2Sm22,35":
  text: "Ćwiczy moje ręce do walki, tak że mogę kruszyć spiżowy łuk swymi ramionami."
  tags: []
"2Sm22,36":
  text: "Dałeś mi też tarczę swego zbawienia, a twoja dobrotliwość uczyniła mnie wielkim."
  tags: []
"2Sm22,37":
  text: "Rozszerzyłeś ścieżkę dla mych kroków, tak że moje stopy się nie zachwiały."
  tags: []
"2Sm22,38":
  text: "Ścigałem moich wrogów i wytraciłem ich, nie zawróciłem, aż ich nie wyniszczyłem."
  tags: []
"2Sm22,39":
  text: "I wyniszczyłem ich, i powaliłem, tak że nie mogli powstać, upadli pod moje stopy."
  tags: []
"2Sm22,40":
  text: "Przepasałeś mnie mocą do walki, powaliłeś pod moje stopy moich przeciwników."
  tags: []
"2Sm22,41":
  text: "Zmuszałeś moich wrogów do ucieczki, abym wykorzenił tych, którzy mnie nienawidzą."
  tags: []
"2Sm22,42":
  text: "Patrzyli, lecz nie było nikogo, kto by ich wybawił; spoglądali na PANA, lecz ich nie wysłuchał."
  tags: []
"2Sm22,43":
  text: "Starłem ich jak proch ziemi, zdeptałem ich jak błoto na ulicach, rozrzuciłem ich."
  tags: []
"2Sm22,44":
  text: "Ty wyzwoliłeś mnie od kłótni ludzkich, zachowałeś mnie, abym był głową narodów. Będzie mi służył lud, którego nie znałem."
  tags: []
"2Sm22,45":
  text: "Cudzoziemcy będą udawać uległość. Jak tylko usłyszą, będą mi posłuszni."
  tags: []
"2Sm22,46":
  text: "Cudzoziemcy zmarnieją i będą drżeć w swoich warowniach."
  tags: []
"2Sm22,47":
  text: "PAN żyje, niech będzie błogosławiona moja skała, niech będzie wywyższony Bóg, skała mojego zbawienia."
  tags: []
"2Sm22,48":
  text: "Bóg dokonuje za mnie zemsty i poddaje mi narody;"
  tags: []
"2Sm22,49":
  text: "Wyprowadza mnie spośród moich wrogów. Ty wywyższyłeś mnie ponad moich przeciwników, ocaliłeś mnie od gwałtownika."
  tags: []
"2Sm22,50":
  text: "Dlatego będę cię, PANIE, sławił wśród narodów i będę śpiewał twojemu imieniu."
  tags: []
"2Sm22,51":
  text: "On jest wieżą zbawienia dla swego króla i na wieki okazuje miłosierdzie swemu pomazańcowi Dawidowi i jego potomstwu."
  tags: []
