"2Sm3,1":
  text: "A wojna między domem Saula a domem Dawida trwała długo. Dawid jednak stawał się mocniejszy, a dom Saula stawał się coraz słabszy."
  tags: []
"2Sm3,2":
  text: "I Dawidowi w Hebronie urodzili się synowie. Jego pierworodnym był Amnon z Achinoam Jizreelitki;"
  tags: []
"2Sm3,3":
  text: "Drugim był Kilab z Abigail, dawnej żony Nabala z Karmelu, trzecim – Absalom, syn Maaki, córki Talmaja, króla Geszur;"
  tags: []
"2Sm3,4":
  text: "Czwartym był Adoniasz, syn Chaggity, piątym – Szefatiasz, syn Abitali;"
  tags: []
"2Sm3,5":
  text: "I szóstym był Jitream z Egli, żony Dawida. Ci urodzili się Dawidowi w Hebronie."
  tags: []
"2Sm3,6":
  text: "I dopóki trwała wojna między domem Saula a domem Dawida, Abner wzmacniał się w domu Saula."
  tags: []
"2Sm3,7":
  text: "A Saul miał nałożnicę, której na imię było Rispa, córkę Aji. Iszboszet zapytał Abnera: Czemu wszedłeś do nałożnicy mego ojca?"
  tags: []
"2Sm3,8":
  text: "Wtedy Abner bardzo się rozgniewał z powodu słów Iszboszeta i powiedział: Czy jestem głową psa? Dziś okazałem przeciw Judzie miłosierdzie domowi Saula, twego ojca, jego braciom i przyjaciołom, i nie wydałem cię w ręce Dawida, a ty dziś obciążasz mnie winą z powodu tej kobiety."
  tags: []
"2Sm3,9":
  text: "Niech Bóg to uczyni Abnerowi i do tego dorzuci, jeśli nie dokonam tego, co PAN przysiągł Dawidowi;"
  tags: []
"2Sm3,10":
  text: "Aby przenieść królestwo z domu Saula i umocnić tron Dawida nad Izraelem i nad Judą, od Dan aż do Beer-Szeby."
  tags: []
"2Sm3,11":
  text: "I nie mógł odpowiedzieć Abnerowi ani słowa, bo się go bał."
  tags: []
"2Sm3,12":
  text: "Wtedy Abner wyprawił posłańców do Dawida, aby powiedzieli w jego imieniu: Czyja jest ziemia? I żeby mówili: Zawrzyj ze mną przymierze, a oto moja ręka będzie z tobą, by sprowadzić do ciebie cały Izrael."
  tags: []
"2Sm3,13":
  text: "Odpowiedział: Dobrze, zawrę z tobą przymierze. Ale żądam od ciebie jednej rzeczy: Nie zobaczysz mojej twarzy, dopóki nie przyprowadzisz do mnie Mikal, córki Saula, gdy przyjdziesz mnie zobaczyć."
  tags: []
"2Sm3,14":
  text: "I Dawid wyprawił posłańców do Iszboszeta, syna Saula, żądając: Oddaj mi moją żonę Mikal, którą poślubiłem sobie za sto napletków filistyńskich."
  tags: []
"2Sm3,15":
  text: "Iszboszet posłał więc po nią i zabrał ją od męża, Paltiela, syna Lajisza."
  tags: []
"2Sm3,16":
  text: "Jej mąż szedł z nią i płakał, idąc za nią aż do Bachurim. Wtedy Abner powiedział do niego: Idź, wracaj. I wrócił."
  tags: []
"2Sm3,17":
  text: "Potem Abner prowadził rozmowy ze starszymi Izraela: Już dawno chcieliście, aby Dawid był królem nad wami."
  tags: []
"2Sm3,18":
  text: "Teraz więc uczyńcie to. PAN bowiem powiedział o Dawidzie tak: Przez rękę swojego sługi Dawida wybawię swój lud Izraela z ręki Filistynów i z ręki wszystkich jego wrogów."
  tags: []
"2Sm3,19":
  text: "Abner powiedział to samo do uszu Beniaminitów. Potem Abner poszedł, aby zawiadomić Dawida w Hebronie o wszystkim, co wydało się słuszne Izraelowi i całemu domowi Beniamina."
  tags: []
"2Sm3,20":
  text: "A gdy Abner przybył wraz z dwudziestoma mężczyznami do Dawida do Hebronu, Dawid wyprawił ucztę dla Abnera i dla mężczyzn, którzy z nim byli."
  tags: []
"2Sm3,21":
  text: "Wtedy Abner powiedział do Dawida: Wstanę i pójdę, aby zgromadzić przy królu, moim panu, cały Izrael, żeby zawarli z tobą przymierze i żebyś królował nad wszystkim, czego pragnie twoja dusza. Potem Dawid odprawił Abnera, który poszedł w pokoju."
  tags: []
"2Sm3,22":
  text: "A oto słudzy Dawida wraz z Joabem wracali z wyprawy, przynosząc ze sobą obfity łup. Abnera zaś już nie było u Dawida w Hebronie, gdyż go odprawił, i tamten odszedł w pokoju."
  tags: []
"2Sm3,23":
  text: "Kiedy przybył Joab wraz z całym wojskiem, które z nim było, doniesiono Joabowi: Abner, syn Nera, przyszedł do króla, lecz on go odprawił, i tamten odszedł w pokoju."
  tags: []
"2Sm3,24":
  text: "Joab przyszedł więc do króla i zapytał: Cóż uczyniłeś? Oto przyszedł do ciebie Abner. Dlaczego go odprawiłeś, aby mógł odejść?"
  tags: []
"2Sm3,25":
  text: "Znasz Abnera, syna Nera, wiesz, że przyszedł cię zdradzić i poznać twoje wyjścia i wejścia, i dowiedzieć się o wszystkim, co czynisz."
  tags: []
"2Sm3,26":
  text: "Wtedy Joab wyszedł od Dawida i wyprawił posłańców za Abnerem, którzy zawrócili go od studni Sira. Dawid zaś o tym nie wiedział."
  tags: []
"2Sm3,27":
  text: "A gdy Abner wrócił do Hebronu, Joab odprowadził go na bok do bramy, aby z nim porozmawiać po cichu, i tam przebił go pod piątym żebrem, tak że umarł, za krew swego brata Asahela."
  tags: []
"2Sm3,28":
  text: "Kiedy Dawid usłyszał o tym później, powiedział: Ja i moje królestwo jesteśmy niewinni przed PANEM na wieki za krew Abnera, syna Nera."
  tags: []
"2Sm3,29":
  text: "Niech ona spadnie na głowę Joaba i na cały dom jego ojca i niech nie braknie w domu Joaba człowieka cierpiącego na wyciek ani trędowatego, ani chodzącego o lasce, ani upadającego od miecza, ani niemającego chleba."
  tags: []
"2Sm3,30":
  text: "Tak to Joab i jego brat Abiszaj zabili Abnera za to, że on zabił ich brata Asahela w bitwie pod Gibeonem."
  tags: []
"2Sm3,31":
  text: "Potem Dawid nakazał Joabowi i całemu ludowi, który z nim był: Porozdzierajcie wasze szaty, nałóżcie wory i opłakujcie Abnera. A król Dawid szedł za marami."
  tags: []
"2Sm3,32":
  text: "Gdy pogrzebali Abnera w Hebronie, król podniósł swój głos i zapłakał nad grobem Abnera, płakał też cały lud."
  tags: []
"2Sm3,33":
  text: "Król lamentował z powodu Abnera i powiedział: Czyż tak miał umrzeć Abner, jak umiera nikczemnik?"
  tags: []
"2Sm3,34":
  text: "Twoje ręce nie były związane, a twoje nogi nie były skute w kajdany. Padłeś jak ten, który pada przed bezbożnymi. Wtedy cały lud jeszcze mocniej płakał nad nim."
  tags: []
"2Sm3,35":
  text: "Gdy cały lud przyszedł, by skłonić Dawida do zjedzenia posiłku jeszcze za dnia, Dawid przysiągł: Niech mi Bóg to uczyni i do tego dorzuci, jeśli przed zachodem słońca skosztuję chleba lub czegoś innego."
  tags: []
"2Sm3,36":
  text: "Kiedy cały lud to zobaczył, uznał to za słuszne, podobnie jak wszystko, co czynił król."
  tags: []
"2Sm3,37":
  text: "Tego dnia cały lud przekonał się, że nie od króla wyszło, żeby zabić Abnera, syna Nera."
  tags: []
"2Sm3,38":
  text: "I król powiedział do swoich sług: Czyż nie wiecie, że dziś poległ w Izraelu wielki dowódca?"
  tags: []
"2Sm3,39":
  text: "A ja dziś jestem słaby, choć zostałem namaszczony na króla. Ci zaś ludzie, synowie Serui, są dla mnie zbyt uciążliwi. Niech PAN odpłaci czyniącemu zło według jego niegodziwości."
  tags: []
