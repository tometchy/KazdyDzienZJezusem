"2Sm14,1":
  text: "A Joab, syn Serui, spostrzegł, że serce króla skłaniało się ku Absalomowi."
  tags: []
"2Sm14,2":
  text: "Posłał więc Joab do Tekoa i sprowadził stamtąd pewną mądrą kobietę, do której powiedział: Proszę, udawaj, że jesteś w żałobie, ubieraj się w szaty żałobne i nie namaszczaj się olejkiem, ale bądź jak kobieta, która od dłuższego czasu opłakuje zmarłego."
  tags: []
"2Sm14,3":
  text: "Potem idź do króla i mów do niego w ten sposób. I Joab pouczył ją, co ma mówić."
  tags: []
"2Sm14,4":
  text: "A gdy kobieta z Tekoa mówiła do króla, upadła twarzą do ziemi i oddała mu pokłon. Powiedziała: Ratuj, królu!"
  tags: []
"2Sm14,5":
  text: "I król ją zapytał: Co ci jest? Ona zaś odpowiedziała: Jestem wdową, mój mąż umarł;"
  tags: []
"2Sm14,6":
  text: "Twoja służąca miała dwóch synów, którzy pokłócili się ze sobą na polu. A gdy nie było nikogo, kto by ich rozdzielił, jeden uderzył drugiego i zabił go."
  tags: []
"2Sm14,7":
  text: "A oto cała rodzina powstała przeciw twojej służącej i powiedziała: Wydaj tego, który zabił swego brata, byśmy mogli go zabić za życie jego brata, którego zamordował, a także zgładzimy dziedzica. W ten sposób zgaszą mój węgielek, który pozostał, aby nie zostawić po moim mężu ani imienia, ani potomka na ziemi."
  tags: []
"2Sm14,8":
  text: "Wtedy król powiedział do kobiety: Idź do swego domu, a ja wydam rozkaz w twojej sprawie."
  tags: []
"2Sm14,9":
  text: "I kobieta z Tekoa odpowiedziała królowi: Mój panie, królu, niech ta nieprawość spadnie na mnie i na dom mego ojca. A król i jego tron niech będzie bez winy."
  tags: []
"2Sm14,10":
  text: "Król powiedział: Jeśli ktoś będzie mówił przeciwko tobie, przyprowadź go do mnie, a już więcej cię nie dotknie."
  tags: []
"2Sm14,11":
  text: "Wtedy ona powiedziała: Wspomnij, proszę, królu, na PANA, swego Boga, i nie pozwól mścicielom krwi sprowadzić większej zguby, aby mój syn nie został zgładzony. I odpowiedział: Jak żyje PAN, nie spadnie nawet jeden włos twego syna na ziemię."
  tags: []
"2Sm14,12":
  text: "Kobieta powiedziała: Pozwól, proszę, że twoja służąca przemówi jeszcze jedno słowo do mego pana, króla. Odpowiedział: Mów."
  tags: []
"2Sm14,13":
  text: "Wtedy kobieta powiedziała: Czemu więc wymyśliłeś podobną rzecz przeciw ludowi Bożemu? Król bowiem mówi to słowo, sam będąc winny, ponieważ król nie sprowadza z powrotem swego wygnańca."
  tags: []
"2Sm14,14":
  text: "Wszyscy bowiem umieramy i jesteśmy jak woda rozlana na ziemi, której nie można zebrać. Bóg jednak nie odebrał mu życia, ale obmyśla sposób na to, by wygnaniec nie pozostawał na wygnaniu."
  tags: []
"2Sm14,15":
  text: "Przyszłam więc teraz, by mówić o tym mojemu panu, królowi, gdyż lud mnie przestraszył. Dlatego twoja służąca powiedziała: Przemówię teraz do króla, może król spełni prośbę swojej służącej."
  tags: []
"2Sm14,16":
  text: "Król bowiem wysłucha swojej służącej i wybawi ją z ręki człowieka, który chce zgładzić mnie i mojego syna z Bożego dziedzictwa."
  tags: []
"2Sm14,17":
  text: "Twoja służąca też powiedziała: Teraz słowo mojego pana, króla, będzie pocieszeniem. Gdyż mój pan, król, jest jak anioł Boga, rozsądzając między dobrem a złem. Niech PAN, twój Bóg, będzie z tobą."
  tags: []
"2Sm14,18":
  text: "Wtedy król odezwał się do kobiety: Proszę, nie ukrywaj przede mną tego, o co zapytam. Kobieta odpowiedziała: Niech mówi mój pan, król."
  tags: []
"2Sm14,19":
  text: "Król więc zapytał: Czy nie ma w tym wszystkim ręki Joaba? Kobieta odpowiedziała: Jak żyje twoja dusza, mój panie, królu, nic nie odbiega ani w prawo, ani w lewo od tego wszystkiego, co mówił mój pan, król. Istotnie twój sługa Joab mi to rozkazał i on to włożył w usta twojej służącej wszystkie te słowa."
  tags: []
"2Sm14,20":
  text: "Twój sługa Joab sprawił, że zmieniłam postać tych słów. Mój pan jednak jest mądry mądrością anioła Boga, tak że wie wszystko, co się dzieje na ziemi."
  tags: []
"2Sm14,21":
  text: "Król więc powiedział do Joaba: Oto teraz uczyń tę rzecz. Idź i sprowadź młodzieńca Absaloma."
  tags: []
"2Sm14,22":
  text: "I Joab upadł twarzą do ziemi, pokłonił się i błogosławił króla. Potem Joab powiedział: Dziś twój sługa poznał, że znalazłem łaskę w twoich oczach, mój panie, królu, ponieważ król spełnił prośbę swego sługi."
  tags: []
"2Sm14,23":
  text: "Wtedy Joab wstał i wyruszył do Geszur, i sprowadził Absaloma do Jerozolimy."
  tags: []
"2Sm14,24":
  text: "Król jednak powiedział: Niech wróci do swego domu, ale mojej twarzy nie zobaczy. Absalom wrócił więc do swego domu, ale twarzy króla nie zobaczył."
  tags: []
"2Sm14,25":
  text: "A w całym Izraelu nie było mężczyzny tak osławionego z powodu urody jak Absalom: od stóp jego nóg aż po czubek głowy nie było na nim skazy."
  tags: []
"2Sm14,26":
  text: "A gdy strzygł swoją głowę – a strzygł ją co roku, bo włosy mu ciążyły i dlatego ją strzygł – włosy jego głowy ważyły dwieście syklów według wagi królewskiej."
  tags: []
"2Sm14,27":
  text: "I Absalomowi urodzili się trzej synowie i jedna córka, która miała na imię Tamar. Była to kobieta o pięknym wyglądzie."
  tags: []
"2Sm14,28":
  text: "I Absalom mieszkał w Jerozolimie dwa lata, a twarzy króla nie zobaczył."
  tags: []
"2Sm14,29":
  text: "Absalom posłał więc po Joaba, aby ten go posłał do króla, lecz on nie chciał przyjść do niego. Potem posłał drugi raz, ale nie chciał przyjść."
  tags: []
"2Sm14,30":
  text: "Wtedy powiedział do swoich sług: Patrzcie, pole Joaba jest obok mojego i ma tam jęczmień. Idźcie i podpalcie je. I słudzy Absaloma podpalili to pole."
  tags: []
"2Sm14,31":
  text: "Potem Joab wstał, przyszedł do Absaloma do jego domu i zapytał go: Czemu twoi słudzy podpalili moje pole?"
  tags: []
"2Sm14,32":
  text: "Absalom odpowiedział Joabowi: Oto posłałem po ciebie, mówiąc: Przyjdź tutaj, a wyślę cię do króla, abyś zapytał: Po co przybyłem z Geszur? Lepiej mi było tam jeszcze zostać. Teraz pozwól mi więc zobaczyć twarz króla. A jeśli jest we mnie jakaś nieprawość, niech mnie zabije."
  tags: []
"2Sm14,33":
  text: "Wtedy Joab przybył do króla i oznajmił mu to. Gdy wezwał Absaloma, ten przyszedł do króla i pokłonił się twarzą do ziemi przed królem. A król ucałował Absaloma."
  tags: []
