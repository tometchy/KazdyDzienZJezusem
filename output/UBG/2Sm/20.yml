"2Sm20,1":
  text: "I znalazł się tam przypadkiem człowiek Beliala imieniem Szeba, syn Bikriego, Beniaminita. Ten zadął w trąbę i powiedział: Nie mamy działu w Dawidzie ani nie mamy dziedzictwa w synu Jessego. Każdy do swojego namiotu, o Izraelu!"
  tags: []
"2Sm20,2":
  text: "Odstąpili więc od Dawida wszyscy ludzie Izraela i poszli za Szebą, synem Bikriego. Ale ludzie Judy, od Jordanu aż do Jerozolimy, trzymali się swego króla."
  tags: []
"2Sm20,3":
  text: "I Dawid przyszedł do swego domu w Jerozolimie. Wtedy król wziął dziesięć kobiet, nałożnic, które pozostawił, aby strzegły domu, umieścił je w strzeżonym domu i utrzymywał, ale nie obcował z nimi. Pozostały one zamknięte aż do dnia swej śmierci, jakby we wdowieństwie."
  tags: []
"2Sm20,4":
  text: "Potem król powiedział do Amasy: Zbierz mi mężczyzn Judy w ciągu trzech dni, ty także się staw."
  tags: []
"2Sm20,5":
  text: "Poszedł więc Amasa, by zebrać lud Judy. Lecz przekroczył termin, który mu wyznaczył."
  tags: []
"2Sm20,6":
  text: "I Dawid powiedział do Abiszaja: Teraz Szeba, syn Bikriego, uczyni nam gorzej niż Absalom. Weź więc sługi twego pana i ścigaj go, by nie znalazł sobie obronnych miast i nie wymknął się nam."
  tags: []
"2Sm20,7":
  text: "Wtedy wyszli z nim ludzie Joaba oraz Keretyci, Peletyci i wszyscy dzielni wojownicy. Wyruszyli z Jerozolimy w pościg za Szebą, synem Bikriego."
  tags: []
"2Sm20,8":
  text: "A gdy byli przy wielkim kamieniu, który jest w Gibeonie, Amasa wyszedł im naprzeciw. A Joab miał na sobie przepasaną szatę, a na niej pas z mieczem w pochwie przypasany do bioder. Gdy on się zbliżał, miecz wypadł mu."
  tags: []
"2Sm20,9":
  text: "I Joab zapytał Amasę: Czy masz się dobrze, mój bracie? I Joab ujął Amasę prawą ręką za brodę, jakby miał go pocałować."
  tags: []
"2Sm20,10":
  text: "Lecz Amasa nie zwrócił uwagi na miecz, który był w ręce Joaba. Ten uderzył go nim pod piąte żebro i wylał jego wnętrzności na ziemię bez zadawania drugiego ciosu, i Amasa umarł. A Joab i jego brat Abiszaj puścili się w pogoń za Szebą, synem Bikriego."
  tags: []
"2Sm20,11":
  text: "Wtedy stanął przy nim jeden ze sług Joaba i powiedział: Ktokolwiek sprzyja Joabowi i ktokolwiek jest za Dawidem, niech idzie za Joabem."
  tags: []
"2Sm20,12":
  text: "Tymczasem Amasa tarzał się we krwi na środku drogi. A gdy ten człowiek zobaczył, że cały lud zatrzymuje się, usunął Amasę z drogi na pole i zarzucił na niego szatę. Zauważył bowiem, że każdy, kto obok niego przechodzi, zatrzymuje się."
  tags: []
"2Sm20,13":
  text: "A gdy usunięto go z drogi, wszyscy szli za Joabem, by ścigać Szebę, syna Bikriego."
  tags: []
"2Sm20,14":
  text: "Ten przeszedł przez wszystkie pokolenia Izraela aż do Abel i Bet-Maaka, a wszyscy Berici zebrali się i poszli za nim."
  tags: []
"2Sm20,15":
  text: "A kiedy tam nadciągnęli, oblegli go w Abel Bet-Maaka i usypali wał przeciw miastu, tak że stali przed murem, i cały lud, który był z Joabem, uderzał, by zburzyć mur."
  tags: []
"2Sm20,16":
  text: "Wtedy pewna mądra kobieta zawołała z miasta: Słuchajcie, słuchajcie! Powiedzcie, proszę, do Joaba: Zbliż się tutaj, a porozmawiam z tobą."
  tags: []
"2Sm20,17":
  text: "Gdy zbliżył się do niej, kobieta zapytała: Czy ty jesteś Joab? Odpowiedział: Jestem. Wtedy powiedziała: Słuchaj słów twojej służącej. Odpowiedział: Słucham."
  tags: []
"2Sm20,18":
  text: "Ona mówiła dalej: W dawnych czasach mówiono: Koniecznie należy radzić się w Abelu – i tak sprawa się zakończyła."
  tags: []
"2Sm20,19":
  text: "Ja jestem jednym ze spokojnych i wiernych w Izraelu, a ty chcesz zniszczyć miasto i matkę w Izraelu. Dlaczego chcesz zburzyć dziedzictwo PANA?"
  tags: []
"2Sm20,20":
  text: "Joab odpowiedział jej: Nie daj, nie daj Boże, abym miał zburzyć albo zniszczyć."
  tags: []
"2Sm20,21":
  text: "Nie tak ma się sprawa. Tylko pewien człowiek z góry Efraim imieniem Szeba, syn Bikriego, podniósł rękę przeciw królowi Dawidowi. Wydajcie jego samego, a odstąpię od miasta. Kobieta odpowiedziała Joabowi: Oto jego głowa zostanie ci rzucona przez mur."
  tags: []
"2Sm20,22":
  text: "Kobieta poszła więc do całego ludu w swojej mądrości. Ścięto głowę Szebie, synowi Bikriego, i rzucono ją do Joaba. Ten zaś zadął w trąbę i wszyscy rozeszli się spod miasta, każdy do swojego namiotu. A Joab wrócił do króla do Jerozolimy."
  tags: []
"2Sm20,23":
  text: "I Joab był dowódcą całego wojska Izraela. A Benajasz, syn Jehojady, dowódcą Keretytów i Peletytów."
  tags: []
"2Sm20,24":
  text: "Adoram był poborcą daniny, a Jehoszafat, syn Ahiluda, kronikarzem."
  tags: []
"2Sm20,25":
  text: "Szewa – pisarzem, a Sadok i Abiatar byli kapłanami."
  tags: []
"2Sm20,26":
  text: "Również Ira Jairyta był naczelnym dostojnikiem u Dawida."
  tags: []
