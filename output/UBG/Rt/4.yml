"Rt4,1":
  text: "Potem Boaz udał się do bramy i tam usiadł. A oto przechodził spokrewniony, o którym mówił Boaz. I powiedział do niego: Człowieku! Podejdź i usiądź tutaj. Tamten więc przyszedł i usiadł."
  tags: []
"Rt4,2":
  text: "Wtedy Boaz wziął dziesięciu starszych tego miasta i mówił do nich: Usiądźcie tutaj. I usiedli."
  tags: []
"Rt4,3":
  text: "I przemówił do tamtego spokrewnionego: Noemi, która wróciła z ziemi Moabu, sprzedaje kawałek ziemi, która należała do naszego brata Elimelecha."
  tags: []
"Rt4,4":
  text: "I pomyślałem sobie, że należy cię o tym powiadomić tymi słowy: Kup go w obecności siedzących tutaj i starszych mego ludu. Jeśli chcesz go wykupić, wykup. Lecz jeśli nie chcesz go wykupić, powiedz mi, abym wiedział. Nikt bowiem nie ma prawa wykupu przed tobą, ja zaś jestem po tobie. Wtedy on odpowiedział: Ja wykupię."
  tags: []
"Rt4,5":
  text: "Boaz jeszcze dodał: W dniu, kiedy wykupisz pole z rąk Noemi, kupisz je również od Rut Moabitki, żony zmarłego, aby wzbudzić imię zmarłego na jego dziedzictwie."
  tags: []
"Rt4,6":
  text: "Spokrewniony odpowiedział: Nie mogę go wykupić, żebym czasem nie poniósł szkody na własnym dziedzictwie. Ty wykup dla siebie moje prawo wykupu, gdyż ja nie mogę go wykupić."
  tags: []
"Rt4,7":
  text: "A taki był dawniej zwyczaj w Izraelu co do prawa wykupu i co do zamiany dla zatwierdzenia każdej sprawy: człowiek zdejmował swój but i dawał go swojemu bliźniemu. Było to poświadczeniem w Izraelu."
  tags: []
"Rt4,8":
  text: "Wtedy ów spokrewniony powiedział do Boaza: Wykup je sobie. I zdjął swój but."
  tags: []
"Rt4,9":
  text: "Potem Boaz przemówił do starszych i całego ludu: Dziś jesteście świadkami, że nabyłem z ręki Noemi wszystko, co należało do Elimelecha, oraz wszystko, co należało do Kiliona i Machlona."
  tags: []
"Rt4,10":
  text: "Także Rut Moabitkę, żonę Machlona, nabyłem sobie za żonę, aby wzbudzić imię zmarłego na jego dziedzictwie, aby nie zginęło imię zmarłego wśród jego braci ani z bramy jego miejsca. Wy jesteście dziś tego świadkami."
  tags: []
"Rt4,11":
  text: "I cały lud, który był w bramie miasta, oraz starsi powiedzieli: Jesteśmy świadkami. Niech PAN sprawi, aby kobieta, która wchodzi do twojego domu, była jak Rachel i jak Lea, które zbudowały dom Izraela. Postępuj godnie w Efrata i zdobądź sobie imię w Betlejem."
  tags: []
"Rt4,12":
  text: "Niech twój dom – przez potomstwo, które PAN da ci z tej młodej kobiety – będzie jak dom Peresa, którego Tamar urodziła Judzie."
  tags: []
"Rt4,13":
  text: "Boaz wziął więc sobie Rut i stała się jego żoną. A gdy z nią obcował, PAN sprawił, że poczęła i urodziła syna."
  tags: []
"Rt4,14":
  text: "Wtedy kobiety powiedziały do Noemi: Błogosławiony PAN, który nie zostawił cię dziś bez spokrewnionego, aby jego imię było znane w Izraelu."
  tags: []
"Rt4,15":
  text: "On będzie pociechą dla twojej duszy i żywicielem w twojej starości. Urodziła go bowiem twoja synowa, która cię miłuje i która jest dla ciebie lepsza niż siedmiu synów."
  tags: []
"Rt4,16":
  text: "Wzięła więc Noemi dziecko, położyła je na swym łonie i była dla niego piastunką."
  tags: []
"Rt4,17":
  text: "I sąsiadki nadały mu imię. Mówiły bowiem: Narodził się syn Noemi. I nadały mu imię Obed. On to jest ojcem Jessego, ojca Dawida."
  tags: []
"Rt4,18":
  text: "A oto potomkowie Peresa: Peres spłodził Chesrona;"
  tags: []
"Rt4,19":
  text: "A Chesron spłodził Rama, a Ram spłodził Amminadaba;"
  tags: []
"Rt4,20":
  text: "A Amminadab spłodził Nachszona, a Nachszon spłodził Salmona;"
  tags: []
"Rt4,21":
  text: "A Salmon spłodził Boaza, a Boaz spłodził Obeda;"
  tags: []
"Rt4,22":
  text: "A Obed spłodził Jessego, a Jesse spłodził Dawida."
  tags: []
