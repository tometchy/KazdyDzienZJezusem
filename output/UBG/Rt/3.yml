"Rt3,1": "Potem Noemi, jej teściowa, powiedziała do niej: Moja córko, czy nie powinnam ci szukać odpoczynku, abyś się dobrze miała?"
"Rt3,2": "I czyż Boaz nie jest naszym krewnym, z którego służącymi byłaś? Oto dziś w nocy będzie on przewiewał jęczmień na klepisku."
"Rt3,3": "Umyj się więc i namaść, nałóż na siebie swoje szaty i zejdź na klepisko, lecz nie daj się poznać temu człowiekowi, dopóki nie skończy jeść i pić."
"Rt3,4": "A gdy położy się spać, upatrz miejsce, na którym się położy, podejdź, odkryj jego nogi i połóż się, a on ci powie, co masz czynić."
"Rt3,5": "I Rut powiedziała do niej: Uczynię wszystko, co mi każesz."
"Rt3,6": "Zeszła więc na klepisko i uczyniła to, co jej nakazała teściowa."
"Rt3,7": "A gdy Boaz najadł się i napił, i jego serce się rozweseliło, poszedł położyć się przy stosie zboża. Wtedy ona przyszła po cichu, odkryła jego nogi i położyła się."
"Rt3,8": "O północy mężczyzna zląkł się, obrócił, a oto kobieta leżała u jego stóp."
"Rt3,9": "I powiedział: Kto ty jesteś? Odpowiedziała: Jestem Rut, twoja służąca. Rozciągnij swój płaszcz nad swoją służącą, bo jesteś ze mną blisko spokrewniony."
"Rt3,10": "A on odpowiedział: Błogosławiona jesteś przez PANA, moja córko. Większą miłość okazałaś teraz niż na początku, gdyż nie poszłaś za młodzieńcami, czy to ubogimi, czy bogatymi."
"Rt3,11": "Teraz więc, moja córko, nie bój się. Uczynię wszystko, co powiedziałaś, gdyż całe miasto mego ludu wie, że jesteś cnotliwą kobietą."
"Rt3,12": "A chociaż to prawda, że jestem z tobą blisko spokrewniony, to jednak bliżej jest z tobą spokrewniony inny ode mnie."
"Rt3,13": "Zostań tu przez noc, a rankiem, jeśli zechce cię on wykupić, dobrze, niech wykupi. Lecz jeśli nie zechce cię wykupić, ja cię wykupię, jak żyje PAN! Śpij tu aż do rana."
"Rt3,14": "Spała więc u jego stóp aż do rana. Wstała jednak w porze, gdy człowiek nie jest w stanie rozpoznać drugiego. Mówił bowiem Boaz: Niech nikt się nie dowie, że kobieta przyszła na klepisko."
"Rt3,15": "I dodał: Daj okrycie, które masz na sobie, i trzymaj je. A gdy trzymała je, odmierzył jej sześć miar jęczmienia i włożył to na nią. Potem poszła do miasta."
"Rt3,16": "A gdy przyszła do teściowej, ta zapytała ją: Kto ty jesteś, moja córko? I opowiedziała jej wszystko, co ten człowiek uczynił dla niej."
"Rt3,17": "I dodała: Oto dał mi sześć miar jęczmienia. Powiedział bowiem do mnie: Nie możesz wrócić z pustymi rękami do swojej teściowej."
"Rt3,18": "Wtedy Noemi powiedziała: Bądź spokojna, moja córko, aż się dowiesz, jak potoczą się rzeczy, gdyż ten człowiek nie spocznie, dopóki nie zakończy dzisiaj tej sprawy."
