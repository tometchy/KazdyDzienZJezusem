"1J4,1":
  text: "Umiłowani, nie wierzcie każdemu duchowi, ale badajcie duchy, czy są z Boga, gdyż wielu fałszywych proroków wyszło na świat."
  tags: []
"1J4,2":
  text: "Po tym poznacie Ducha Bożego: każdy duch, który wyznaje, że Jezus Chrystus przyszedł w ciele, jest z Boga."
  tags: []
"1J4,3":
  text: "Każdy zaś duch, który nie wyznaje, że Jezus Chrystus przyszedł w ciele, nie jest z Boga. Jest to duch antychrysta, o którym słyszeliście, że nadchodzi i już teraz jest na świecie."
  tags: []
"1J4,4":
  text: "Dzieci, wy jesteście z Boga i zwyciężyliście ich, ponieważ ten, który jest w was, jest większy niż ten, który jest na świecie."
  tags: []
"1J4,5":
  text: "Oni są ze świata, dlatego mówią o świecie, a świat ich słucha."
  tags: []
"1J4,6":
  text: "My jesteśmy z Boga. Kto zna Boga, słucha nas, kto nie jest z Boga, nie słucha nas. Po tym poznajemy ducha prawdy i ducha błędu."
  tags: []
"1J4,7":
  text: "Umiłowani, miłujmy się wzajemnie, gdyż miłość jest z Boga i każdy, kto miłuje, narodził się z Boga i zna Boga."
  tags: []
"1J4,8":
  text: "Kto nie miłuje, nie zna Boga, gdyż Bóg jest miłością."
  tags: []
"1J4,9":
  text: "Przez to objawiła się miłość Boga ku nam, że Bóg posłał na świat swego jednorodzonego Syna, abyśmy żyli przez niego."
  tags: []
"1J4,10":
  text: "Na tym polega miłość, że nie my umiłowaliśmy Boga, ale że on nas umiłował i posłał swego Syna, aby był przebłaganiem za nasze grzechy."
  tags: []
"1J4,11":
  text: "Umiłowani, jeśli Bóg tak nas umiłował, to i my powinniśmy się wzajemnie miłować."
  tags: []
"1J4,12":
  text: "Boga nikt nigdy nie widział, ale jeśli miłujemy się wzajemnie, Bóg w nas mieszka, a jego miłość jest w nas doskonała."
  tags: []
"1J4,13":
  text: "Po tym poznajemy, że w nim mieszkamy, a on w nas, że dał nam ze swego Ducha."
  tags: []
"1J4,14":
  text: "My zaś widzieliśmy i świadczymy, że Ojciec posłał Syna, aby był Zbawicielem świata."
  tags: []
"1J4,15":
  text: "Każdy, kto wyzna, że Jezus jest Synem Bożym, w tym mieszka Bóg, a on w Bogu."
  tags: []
"1J4,16":
  text: "My poznaliśmy i uwierzyliśmy w miłość, którą ma Bóg do nas. Bóg jest miłością, a kto trwa w miłości, mieszka w Bogu, a Bóg w nim."
  tags: []
"1J4,17":
  text: "W tym jest doskonała miłość w nas, abyśmy mieli ufność w dniu sądu, że jaki on jest, tacy i my jesteśmy na tym świecie."
  tags: []
"1J4,18":
  text: "W miłości nie ma lęku, ale doskonała miłość usuwa lęk, bo lęk przynosi udrękę, a kto się boi, nie jest doskonały w miłości."
  tags: []
"1J4,19":
  text: "My go miłujemy, ponieważ on pierwszy nas umiłował."
  tags: []
"1J4,20":
  text: "Jeśli ktoś mówi: Miłuję Boga, a nienawidzi swego brata, jest kłamcą. Kto bowiem nie miłuje swego brata, którego widzi, jak może miłować Boga, którego nie widzi?"
  tags: []
"1J4,21":
  text: "A takie przykazanie mamy od niego, aby ten, kto miłuje Boga, miłował też swego brata."
  tags: []
