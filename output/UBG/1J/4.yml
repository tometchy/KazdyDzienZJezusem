"1J4,1": "Umiłowani, nie wierzcie każdemu duchowi, ale badajcie duchy, czy są z Boga, gdyż wielu fałszywych proroków wyszło na świat."
"1J4,2": "Po tym poznacie Ducha Bożego: każdy duch, który wyznaje, że Jezus Chrystus przyszedł w ciele, jest z Boga."
"1J4,3": "Każdy zaś duch, który nie wyznaje, że Jezus Chrystus przyszedł w ciele, nie jest z Boga. Jest to duch antychrysta, o którym słyszeliście, że nadchodzi i już teraz jest na świecie."
"1J4,4": "Dzieci, wy jesteście z Boga i zwyciężyliście ich, ponieważ ten, który jest w was, jest większy niż ten, który jest na świecie."
"1J4,5": "Oni są ze świata, dlatego mówią o świecie, a świat ich słucha."
"1J4,6": "My jesteśmy z Boga. Kto zna Boga, słucha nas, kto nie jest z Boga, nie słucha nas. Po tym poznajemy ducha prawdy i ducha błędu."
"1J4,7": "Umiłowani, miłujmy się wzajemnie, gdyż miłość jest z Boga i każdy, kto miłuje, narodził się z Boga i zna Boga."
"1J4,8": "Kto nie miłuje, nie zna Boga, gdyż Bóg jest miłością."
"1J4,9": "Przez to objawiła się miłość Boga ku nam, że Bóg posłał na świat swego jednorodzonego Syna, abyśmy żyli przez niego."
"1J4,10": "Na tym polega miłość, że nie my umiłowaliśmy Boga, ale że on nas umiłował i posłał swego Syna, aby był przebłaganiem za nasze grzechy."
"1J4,11": "Umiłowani, jeśli Bóg tak nas umiłował, to i my powinniśmy się wzajemnie miłować."
"1J4,12": "Boga nikt nigdy nie widział, ale jeśli miłujemy się wzajemnie, Bóg w nas mieszka, a jego miłość jest w nas doskonała."
"1J4,13": "Po tym poznajemy, że w nim mieszkamy, a on w nas, że dał nam ze swego Ducha."
"1J4,14": "My zaś widzieliśmy i świadczymy, że Ojciec posłał Syna, aby był Zbawicielem świata."
"1J4,15": "Każdy, kto wyzna, że Jezus jest Synem Bożym, w tym mieszka Bóg, a on w Bogu."
"1J4,16": "My poznaliśmy i uwierzyliśmy w miłość, którą ma Bóg do nas. Bóg jest miłością, a kto trwa w miłości, mieszka w Bogu, a Bóg w nim."
"1J4,17": "W tym jest doskonała miłość w nas, abyśmy mieli ufność w dniu sądu, że jaki on jest, tacy i my jesteśmy na tym świecie."
"1J4,18": "W miłości nie ma lęku, ale doskonała miłość usuwa lęk, bo lęk przynosi udrękę, a kto się boi, nie jest doskonały w miłości."
"1J4,19": "My go miłujemy, ponieważ on pierwszy nas umiłował."
"1J4,20": "Jeśli ktoś mówi: Miłuję Boga, a nienawidzi swego brata, jest kłamcą. Kto bowiem nie miłuje swego brata, którego widzi, jak może miłować Boga, którego nie widzi?"
"1J4,21": "A takie przykazanie mamy od niego, aby ten, kto miłuje Boga, miłował też swego brata."
