"1J2,1":
  text: "Moje dzieci, piszę wam to, abyście nie grzeszyli. Jeśli jednak ktoś zgrzeszy, mamy orędownika u Ojca, Jezusa Chrystusa sprawiedliwego."
  tags: []
"1J2,2":
  text: "I on jest przebłaganiem za nasze grzechy, a nie tylko za nasze, lecz także za grzechy całego świata."
  tags: []
"1J2,3":
  text: "A po tym poznajemy, że go znamy, jeśli zachowujemy jego przykazania."
  tags: []
"1J2,4":
  text: "Kto mówi: Znam go, a nie zachowuje jego przykazań, jest kłamcą i nie ma w nim prawdy."
  tags: []
"1J2,5":
  text: "Lecz kto zachowuje jego słowo, w nim prawdziwie wypełniła się miłość Boga. Po tym poznajemy, że w nim jesteśmy."
  tags: []
"1J2,6":
  text: "Kto mówi, że w nim trwa, powinien sam postępować tak, jak on postępował."
  tags: []
"1J2,7":
  text: "Bracia, nie piszę wam nowego przykazania, ale przykazanie stare, które mieliście od początku. Tym starym przykazaniem jest słowo, które słyszeliście od początku."
  tags: []
"1J2,8":
  text: "Zarazem piszę wam nowe przykazanie, które jest prawdziwe w nim i w was, ponieważ ciemność przemija, a prawdziwa światłość już świeci."
  tags: []
"1J2,9":
  text: "Kto mówi, że jest w światłości, a nienawidzi swego brata, dotąd jeszcze jest w ciemności."
  tags: []
"1J2,10":
  text: "Kto miłuje swego brata, trwa w światłości i nie ma w nim powodu do upadku."
  tags: []
"1J2,11":
  text: "Lecz kto nienawidzi swego brata, jest w ciemności i chodzi w ciemności, i nie wie, dokąd idzie, bo ciemność zaślepiła jego oczy."
  tags: []
"1J2,12":
  text: "Piszę do was, dzieci, bo zostały wam przebaczone grzechy ze względu na jego imię."
  tags: []
"1J2,13":
  text: "Piszę do was, ojcowie, bo poznaliście tego, który jest od początku. Piszę do was, młodzieńcy, bo zwyciężyliście złego. Piszę do was, dzieci, bo poznałyście Ojca."
  tags: []
"1J2,14":
  text: "Napisałem do was, ojcowie, bo poznaliście tego, który jest od początku. Napisałem do was, młodzieńcy, bo jesteście mocni i słowo Boże w was mieszka, i zwyciężyliście złego."
  tags: []
"1J2,15":
  text: "Nie miłujcie świata ani tego, co jest na świecie. Jeśli ktoś miłuje świat, nie ma w nim miłości Ojca."
  tags: []
"1J2,16":
  text: "Wszystko bowiem, co jest na świecie – pożądliwość ciała, pożądliwość oczu i pycha życia – nie pochodzi od Ojca, ale od świata."
  tags: []
"1J2,17":
  text: "A świat przemija wraz ze swoją pożądliwością, ale kto wypełnia wolę Boga, trwa na wieki."
  tags: []
"1J2,18":
  text: "Dzieci, to już ostatnia godzina i jak słyszeliście, że antychryst ma przyjść, tak teraz pojawiło się wielu antychrystów. Stąd wiemy, że jest już ostatnia godzina."
  tags: []
"1J2,19":
  text: "Wyszli spośród nas, ale nie byli z nas. Gdyby bowiem byli z nas, zostaliby z nami. Lecz wyszli spośród nas, aby się okazało, że nie wszyscy są z nas."
  tags: []
"1J2,20":
  text: "Ale wy macie namaszczenie od Świętego i wiecie wszystko."
  tags: []
"1J2,21":
  text: "Napisałem do was nie dlatego, że nie znaliście prawdy, ale dlatego, że ją znacie i że żadne kłamstwo nie wywodzi się z prawdy."
  tags: []
"1J2,22":
  text: "Któż jest kłamcą? Czy nie ten, kto zaprzecza, że Jezus jest Chrystusem? Ten jest antychrystem, który wypiera się Ojca i Syna."
  tags: []
"1J2,23":
  text: "Każdy, kto wypiera się Syna, nie ma i Ojca. Kto zaś wyznaje Syna, ma i Ojca."
  tags: []
"1J2,24":
  text: "To więc, co słyszeliście od początku, niech w was pozostanie. Jeśli pozostanie w was to, co słyszeliście od początku, to i wy pozostaniecie w Synu i w Ojcu."
  tags: []
"1J2,25":
  text: "A to jest obietnica, którą on nam dał – życie wieczne."
  tags: []
"1J2,26":
  text: "To wszystko wam napisałem o tych, którzy was zwodzą."
  tags: []
"1J2,27":
  text: "Ale to namaszczenie, które otrzymaliście od niego, pozostaje w was i nie potrzebujecie, aby was ktoś uczył. Lecz jak to namaszczenie uczy was o wszystkim, a jest ono prawdziwe i nie jest kłamstwem i jak was nauczyło, tak w nim pozostaniecie."
  tags: []
"1J2,28":
  text: "A teraz, dzieci, pozostańcie w nim, abyśmy, gdy się ukaże, mieli ufność i nie zostali zawstydzeni przez niego w czasie jego przyjścia."
  tags: []
"1J2,29":
  text: "Jeżeli wiecie, że on jest sprawiedliwy, wiedzcie też, że każdy, kto czyni sprawiedliwość, z niego się narodził."
  tags: []
