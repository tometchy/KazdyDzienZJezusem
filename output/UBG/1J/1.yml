"1J1,1": "To, co było od początku, co słyszeliśmy, co widzieliśmy na własne oczy, na co patrzyliśmy i czego dotykały nasze ręce, o Słowie życia;"
"1J1,2": "(Bo życie zostało objawione, a my je widzieliśmy i świadczymy o nim, i zwiastujemy wam to życie wieczne, które było u Ojca, a nam zostało objawione)."
"1J1,3": "To, co widzieliśmy i słyszeliśmy, to wam zwiastujemy, abyście i wy mieli z nami społeczność, a nasza społeczność to społeczność z Ojcem i z jego Synem, Jezusem Chrystusem."
"1J1,4": "A piszemy to wam, aby wasza radość była pełna."
"1J1,5": "Przesłanie zaś, które słyszeliśmy od niego i wam zwiastujemy, jest takie: Bóg jest światłością i nie ma w nim żadnej ciemności."
"1J1,6": "Jeśli mówimy, że mamy z nim społeczność, a chodzimy w ciemności, kłamiemy i nie czynimy prawdy."
"1J1,7": "A jeśli chodzimy w światłości, tak jak on jest w światłości, mamy społeczność między sobą, a krew Jezusa Chrystusa, jego Syna, oczyszcza nas z wszelkiego grzechu."
"1J1,8": "Jeśli mówimy, że nie mamy grzechu, sami siebie zwodzimy i nie ma w nas prawdy."
"1J1,9": "Jeśli wyznajemy nasze grzechy, Bóg jest wierny i sprawiedliwy, aby nam przebaczyć grzechy i oczyścić nas z wszelkiej nieprawości."
"1J1,10": "Jeśli mówimy, że nie zgrzeszyliśmy, robimy z niego kłamcę i nie ma w nas jego słowa."
