"1J1,1":
  text: "To, co było od początku, co słyszeliśmy, co widzieliśmy na własne oczy, na co patrzyliśmy i czego dotykały nasze ręce, o Słowie życia;"
  tags: []
"1J1,2":
  text: "(Bo życie zostało objawione, a my je widzieliśmy i świadczymy o nim, i zwiastujemy wam to życie wieczne, które było u Ojca, a nam zostało objawione)."
  tags: []
"1J1,3":
  text: "To, co widzieliśmy i słyszeliśmy, to wam zwiastujemy, abyście i wy mieli z nami społeczność, a nasza społeczność to społeczność z Ojcem i z jego Synem, Jezusem Chrystusem."
  tags: []
"1J1,4":
  text: "A piszemy to wam, aby wasza radość była pełna."
  tags: []
"1J1,5":
  text: "Przesłanie zaś, które słyszeliśmy od niego i wam zwiastujemy, jest takie: Bóg jest światłością i nie ma w nim żadnej ciemności."
  tags: []
"1J1,6":
  text: "Jeśli mówimy, że mamy z nim społeczność, a chodzimy w ciemności, kłamiemy i nie czynimy prawdy."
  tags: []
"1J1,7":
  text: "A jeśli chodzimy w światłości, tak jak on jest w światłości, mamy społeczność między sobą, a krew Jezusa Chrystusa, jego Syna, oczyszcza nas z wszelkiego grzechu."
  tags: []
"1J1,8":
  text: "Jeśli mówimy, że nie mamy grzechu, sami siebie zwodzimy i nie ma w nas prawdy."
  tags: []
"1J1,9":
  text: "Jeśli wyznajemy nasze grzechy, Bóg jest wierny i sprawiedliwy, aby nam przebaczyć grzechy i oczyścić nas z wszelkiej nieprawości."
  tags: []
"1J1,10":
  text: "Jeśli mówimy, że nie zgrzeszyliśmy, robimy z niego kłamcę i nie ma w nas jego słowa."
  tags: []
