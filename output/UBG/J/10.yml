"J10,1": "Zaprawdę, zaprawdę powiadam wam: Kto nie wchodzi do owczarni drzwiami, ale wchodzi inną drogą, ten jest złodziejem i bandytą."
"J10,2": "Lecz kto wchodzi drzwiami, jest pasterzem owiec."
"J10,3": "Temu odźwierny otwiera i owce słuchają jego głosu, a on woła swoje własne owce po imieniu i wyprowadza je."
"J10,4": "A gdy wypuści swoje owce, idzie przed nimi, a owce idą za nim, bo znają jego głos."
"J10,5": "Ale za obcym nie idą, lecz uciekają od niego, bo nie znają głosu obcych."
"J10,6": "Tę przypowieść powiedział im Jezus, lecz oni nie zrozumieli tego, co im mówił."
"J10,7": "Wtedy Jezus znowu powiedział do nich: Zaprawdę, zaprawdę powiadam wam: Ja jestem drzwiami dla owiec."
"J10,8": "Wszyscy, ilu ich przede mną przyszło, są złodziejami i bandytami, ale owce ich nie słuchały."
"J10,9": "Ja jestem drzwiami. Jeśli ktoś wejdzie przeze mnie, będzie zbawiony; wejdzie i wyjdzie, i znajdzie pastwisko."
"J10,10": "Złodziej przychodzi tylko po to, żeby kraść, zabijać i niszczyć. Ja przyszedłem, aby miały życie i aby miały je w obfitości."
"J10,11": "Ja jestem dobrym pasterzem. Dobry pasterz oddaje swoje życie za owce."
"J10,12": "Lecz najemnik, który nie jest pasterzem, do którego owce nie należą, widząc nadchodzącego wilka, opuszcza owce i ucieka, a wilk porywa i rozprasza owce."
"J10,13": "Najemnik ucieka, bo jest najemnikiem i nie troszczy się o owce."
"J10,14": "Ja jestem dobrym pasterzem i znam moje owce, a moje mnie znają."
"J10,15": "Jak mnie zna Ojciec, i ja znam Ojca; i oddaję moje życie za owce."
"J10,16": "A mam także inne owce, które nie są z tej owczarni. Również te muszę przyprowadzić i będą słuchać mego głosu, i będzie jedna owczarnia i jeden pasterz."
"J10,17": "Dlatego Ojciec mnie miłuje, bo ja oddaję swoje życie, aby je znowu wziąć."
"J10,18": "Nikt mi go nie odbiera, ale ja oddaję je sam z siebie. Mam moc je oddać i mam moc znowu je wziąć. Ten nakaz otrzymałem od mego Ojca."
"J10,19": "Wtedy znowu nastąpił rozłam wśród Żydów z powodu tych słów."
"J10,20": "I wielu z nich mówiło: Ma demona i szaleje. Czemu go słuchacie?"
"J10,21": "Inni mówili: To nie są słowa człowieka mającego demona. Czy demon może otwierać oczy ślepych?"
"J10,22": "Była wtedy w Jerozolimie uroczystość poświęcenia świątyni. A była zima."
"J10,23": "I przechadzał się Jezus w świątyni, w przedsionku Salomona."
"J10,24": "Wtedy Żydzi obstąpili go i zapytali: Jak długo będziesz nas trzymał w niepewności? Jeśli ty jesteś Chrystusem, powiedz nam otwarcie."
"J10,25": "Jezus im odpowiedział: Powiedziałem wam, a nie wierzycie. Dzieła, które wykonuję w imieniu mego Ojca, one świadczą o mnie."
"J10,26": "Ale wy nie wierzycie, bo nie jesteście z moich owiec, jak wam powiedziałem."
"J10,27": "Moje owce słuchają mego głosu i ja je znam, a one idą za mną."
"J10,28": "A ja daję im życie wieczne i nigdy nie zginą ani nikt nie wydrze ich z mojej ręki."
"J10,29": "Mój Ojciec, który mi je dał, większy jest od wszystkich i nikt nie może wydrzeć ich z ręki mego Ojca."
"J10,30": "Ja i Ojciec jedno jesteśmy."
"J10,31": "Wtedy Żydzi znowu porwali kamienie, aby go ukamienować."
"J10,32": "Jezus powiedział do nich: Ukazałem wam wiele dobrych uczynków od mego Ojca. Za który z tych uczynków mnie kamienujecie?"
"J10,33": "Odpowiedzieli mu Żydzi: Nie kamienujemy cię za dobry uczynek, ale za bluźnierstwo, to znaczy, że ty, będąc człowiekiem, czynisz samego siebie Bogiem."
"J10,34": "Jezus im odpowiedział: Czy nie jest napisane w waszym Prawie: Ja powiedziałem: Jesteście bogami?"
"J10,35": "Jeśli nazwał bogami tych, do których doszło słowo Boże, a Pismo nie może być naruszone;"
"J10,36": "To jakże do mnie, którego Ojciec uświęcił i posłał na świat, mówicie: Bluźnisz, bo powiedziałem: Jestem Synem Bożym?"
"J10,37": "Jeśli nie wykonuję dzieł mego Ojca, nie wierzcie mi."
"J10,38": "A jeśli wykonuję, choćbyście mnie nie wierzyli, wierzcie uczynkom, abyście poznali i uwierzyli, że Ojciec jest we mnie, a ja w nim."
"J10,39": "Znowu więc usiłowali go schwytać, ale wymknął się im z rąk."
"J10,40": "I ponownie odszedł za Jordan, na miejsce, gdzie przedtem Jan chrzcił, i tam przebywał."
"J10,41": "A wielu przychodziło do niego i mówiło: Jan wprawdzie nie uczynił żadnego cudu, ale wszystko, co Jan o nim powiedział, było prawdziwe."
"J10,42": "I wielu tam uwierzyło w niego."
