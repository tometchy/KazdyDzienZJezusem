"J10,1":
  text: "Zaprawdę, zaprawdę powiadam wam: Kto nie wchodzi do owczarni drzwiami, ale wchodzi inną drogą, ten jest złodziejem i bandytą."
  tags: []
"J10,2":
  text: "Lecz kto wchodzi drzwiami, jest pasterzem owiec."
  tags: []
"J10,3":
  text: "Temu odźwierny otwiera i owce słuchają jego głosu, a on woła swoje własne owce po imieniu i wyprowadza je."
  tags: []
"J10,4":
  text: "A gdy wypuści swoje owce, idzie przed nimi, a owce idą za nim, bo znają jego głos."
  tags: []
"J10,5":
  text: "Ale za obcym nie idą, lecz uciekają od niego, bo nie znają głosu obcych."
  tags: []
"J10,6":
  text: "Tę przypowieść powiedział im Jezus, lecz oni nie zrozumieli tego, co im mówił."
  tags: []
"J10,7":
  text: "Wtedy Jezus znowu powiedział do nich: Zaprawdę, zaprawdę powiadam wam: Ja jestem drzwiami dla owiec."
  tags: []
"J10,8":
  text: "Wszyscy, ilu ich przede mną przyszło, są złodziejami i bandytami, ale owce ich nie słuchały."
  tags: []
"J10,9":
  text: "Ja jestem drzwiami. Jeśli ktoś wejdzie przeze mnie, będzie zbawiony; wejdzie i wyjdzie, i znajdzie pastwisko."
  tags: []
"J10,10":
  text: "Złodziej przychodzi tylko po to, żeby kraść, zabijać i niszczyć. Ja przyszedłem, aby miały życie i aby miały je w obfitości."
  tags: []
"J10,11":
  text: "Ja jestem dobrym pasterzem. Dobry pasterz oddaje swoje życie za owce."
  tags: []
"J10,12":
  text: "Lecz najemnik, który nie jest pasterzem, do którego owce nie należą, widząc nadchodzącego wilka, opuszcza owce i ucieka, a wilk porywa i rozprasza owce."
  tags: []
"J10,13":
  text: "Najemnik ucieka, bo jest najemnikiem i nie troszczy się o owce."
  tags: []
"J10,14":
  text: "Ja jestem dobrym pasterzem i znam moje owce, a moje mnie znają."
  tags: []
"J10,15":
  text: "Jak mnie zna Ojciec, i ja znam Ojca; i oddaję moje życie za owce."
  tags: []
"J10,16":
  text: "A mam także inne owce, które nie są z tej owczarni. Również te muszę przyprowadzić i będą słuchać mego głosu, i będzie jedna owczarnia i jeden pasterz."
  tags: []
"J10,17":
  text: "Dlatego Ojciec mnie miłuje, bo ja oddaję swoje życie, aby je znowu wziąć."
  tags: []
"J10,18":
  text: "Nikt mi go nie odbiera, ale ja oddaję je sam z siebie. Mam moc je oddać i mam moc znowu je wziąć. Ten nakaz otrzymałem od mego Ojca."
  tags: []
"J10,19":
  text: "Wtedy znowu nastąpił rozłam wśród Żydów z powodu tych słów."
  tags: []
"J10,20":
  text: "I wielu z nich mówiło: Ma demona i szaleje. Czemu go słuchacie?"
  tags: []
"J10,21":
  text: "Inni mówili: To nie są słowa człowieka mającego demona. Czy demon może otwierać oczy ślepych?"
  tags: []
"J10,22":
  text: "Była wtedy w Jerozolimie uroczystość poświęcenia świątyni. A była zima."
  tags: []
"J10,23":
  text: "I przechadzał się Jezus w świątyni, w przedsionku Salomona."
  tags: []
"J10,24":
  text: "Wtedy Żydzi obstąpili go i zapytali: Jak długo będziesz nas trzymał w niepewności? Jeśli ty jesteś Chrystusem, powiedz nam otwarcie."
  tags: []
"J10,25":
  text: "Jezus im odpowiedział: Powiedziałem wam, a nie wierzycie. Dzieła, które wykonuję w imieniu mego Ojca, one świadczą o mnie."
  tags: []
"J10,26":
  text: "Ale wy nie wierzycie, bo nie jesteście z moich owiec, jak wam powiedziałem."
  tags: []
"J10,27":
  text: "Moje owce słuchają mego głosu i ja je znam, a one idą za mną."
  tags: []
"J10,28":
  text: "A ja daję im życie wieczne i nigdy nie zginą ani nikt nie wydrze ich z mojej ręki."
  tags: []
"J10,29":
  text: "Mój Ojciec, który mi je dał, większy jest od wszystkich i nikt nie może wydrzeć ich z ręki mego Ojca."
  tags: []
"J10,30":
  text: "Ja i Ojciec jedno jesteśmy."
  tags: []
"J10,31":
  text: "Wtedy Żydzi znowu porwali kamienie, aby go ukamienować."
  tags: []
"J10,32":
  text: "Jezus powiedział do nich: Ukazałem wam wiele dobrych uczynków od mego Ojca. Za który z tych uczynków mnie kamienujecie?"
  tags: []
"J10,33":
  text: "Odpowiedzieli mu Żydzi: Nie kamienujemy cię za dobry uczynek, ale za bluźnierstwo, to znaczy, że ty, będąc człowiekiem, czynisz samego siebie Bogiem."
  tags: []
"J10,34":
  text: "Jezus im odpowiedział: Czy nie jest napisane w waszym Prawie: Ja powiedziałem: Jesteście bogami?"
  tags: []
"J10,35":
  text: "Jeśli nazwał bogami tych, do których doszło słowo Boże, a Pismo nie może być naruszone;"
  tags: []
"J10,36":
  text: "To jakże do mnie, którego Ojciec uświęcił i posłał na świat, mówicie: Bluźnisz, bo powiedziałem: Jestem Synem Bożym?"
  tags: []
"J10,37":
  text: "Jeśli nie wykonuję dzieł mego Ojca, nie wierzcie mi."
  tags: []
"J10,38":
  text: "A jeśli wykonuję, choćbyście mnie nie wierzyli, wierzcie uczynkom, abyście poznali i uwierzyli, że Ojciec jest we mnie, a ja w nim."
  tags: []
"J10,39":
  text: "Znowu więc usiłowali go schwytać, ale wymknął się im z rąk."
  tags: []
"J10,40":
  text: "I ponownie odszedł za Jordan, na miejsce, gdzie przedtem Jan chrzcił, i tam przebywał."
  tags: []
"J10,41":
  text: "A wielu przychodziło do niego i mówiło: Jan wprawdzie nie uczynił żadnego cudu, ale wszystko, co Jan o nim powiedział, było prawdziwe."
  tags: []
"J10,42":
  text: "I wielu tam uwierzyło w niego."
  tags: []
