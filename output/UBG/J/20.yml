"J20,1":
  text: "A pierwszego dnia po szabacie, rano, gdy jeszcze było ciemno, Maria Magdalena przyszła do grobu i zobaczyła kamień odwalony od grobowca."
  tags: []
"J20,2":
  text: "Wtedy pobiegła i przyszła do Szymona Piotra i do drugiego ucznia, którego Jezus miłował, i powiedziała do nich: Zabrali Pana z grobu i nie wiemy, gdzie go położyli."
  tags: []
"J20,3":
  text: "Wyszedł więc Piotr i ten drugi uczeń i poszli do grobu."
  tags: []
"J20,4":
  text: "I biegli obaj razem, ale ten drugi uczeń wyprzedził Piotra i pierwszy przybył do grobu."
  tags: []
"J20,5":
  text: "Kiedy się nachylił, zobaczył leżące płótna, jednak tam nie wszedł."
  tags: []
"J20,6":
  text: "Przyszedł też Szymon Piotr, idąc za nim. Wszedł do grobowca i zobaczył leżące płótna;"
  tags: []
"J20,7":
  text: "I chustę, która była na jego głowie, położoną nie z płótnami, ale zwiniętą osobno na jednym miejscu."
  tags: []
"J20,8":
  text: "Potem wszedł także ten drugi uczeń, który pierwszy przybył do grobu, zobaczył i uwierzył."
  tags: []
"J20,9":
  text: "Jeszcze bowiem nie rozumieli Pisma, że miał zmartwychwstać."
  tags: []
"J20,10":
  text: "Wtedy uczniowie powrócili do domu."
  tags: []
"J20,11":
  text: "Ale Maria stała na zewnątrz przed grobem, płacząc. A gdy płakała, nachyliła się do grobowca;"
  tags: []
"J20,12":
  text: "I ujrzała dwóch aniołów w bieli, którzy siedzieli tam, gdzie było złożone ciało Jezusa, jeden u głowy, a drugi u nóg."
  tags: []
"J20,13":
  text: "I zapytali ją: Kobieto, czemu płaczesz? Odpowiedziała im: Bo zabrali mego Pana i nie wiem, gdzie go położyli."
  tags: []
"J20,14":
  text: "A to powiedziawszy, odwróciła się i ujrzała stojącego Jezusa, lecz nie wiedziała, że to Jezus."
  tags: []
"J20,15":
  text: "Jezus ją zapytał: Kobieto, czemu płaczesz? Kogo szukasz? A ona, sądząc, że to ogrodnik, odpowiedziała mu: Panie, jeśli ty go wziąłeś, powiedz mi, gdzie go położyłeś, a ja go zabiorę."
  tags: []
"J20,16":
  text: "Jezus powiedział do niej: Mario! A ona, obróciwszy się, powiedziała do niego: Rabbuni! – co się tłumaczy: Nauczycielu."
  tags: []
"J20,17":
  text: "Jezus do niej powiedział: Nie dotykaj mnie, bo jeszcze nie wstąpiłem do mego Ojca. Ale idź do moich braci i powiedz im: Wstępuję do mego Ojca i waszego Ojca, i do mego Boga, i waszego Boga."
  tags: []
"J20,18":
  text: "Przyszła więc Maria Magdalena, oznajmiając uczniom, że widziała Pana i że jej to powiedział."
  tags: []
"J20,19":
  text: "A gdy był wieczór tego pierwszego dnia po szabacie, a drzwi były zamknięte tam, gdzie zgromadzili się uczniowie z obawy przed Żydami, przyszedł Jezus, stanął pośrodku i powiedział do nich: Pokój wam."
  tags: []
"J20,20":
  text: "A to powiedziawszy, pokazał im swoje ręce i bok. I uradowali się uczniowie, ujrzawszy Pana."
  tags: []
"J20,21":
  text: "Jezus znowu powiedział do nich: Pokój wam. Jak Ojciec mnie posłał, tak i ja was posyłam."
  tags: []
"J20,22":
  text: "A to powiedziawszy, tchnął na nich i powiedział: Weźcie Ducha Świętego."
  tags: []
"J20,23":
  text: "Komukolwiek przebaczycie grzechy, są im przebaczone, a komukolwiek zatrzymacie, są im zatrzymane."
  tags: []
"J20,24":
  text: "A Tomasz, jeden z dwunastu, zwany Didymos, nie był z nimi, gdy przyszedł Jezus."
  tags: []
"J20,25":
  text: "I powiedzieli mu inni uczniowie: Widzieliśmy Pana. Lecz on powiedział do nich: Jeśli nie zobaczę na jego rękach śladów gwoździ i nie włożę mego palca w ślady gwoździ, i nie włożę mojej ręki w jego bok, nie uwierzę."
  tags: []
"J20,26":
  text: "A po ośmiu dniach jego uczniowie znowu byli w domu, a Tomasz z nimi. I przyszedł Jezus, gdy drzwi były zamknięte, stanął pośrodku i powiedział: Pokój wam."
  tags: []
"J20,27":
  text: "Potem powiedział do Tomasza: Włóż tu swój palec i obejrzyj moje ręce, wyciągnij swoją rękę i włóż ją w mój bok, a nie bądź bez wiary, ale wierz."
  tags: []
"J20,28":
  text: "Wtedy Tomasz mu odpowiedział: Mój Pan i mój Bóg!"
  tags: []
"J20,29":
  text: "Jezus mu powiedział: Tomaszu, uwierzyłeś, ponieważ mnie ujrzałeś. Błogosławieni, którzy nie widzieli, a uwierzyli."
  tags: []
"J20,30":
  text: "I wiele innych cudów uczynił Jezus na oczach swoich uczniów, które nie są napisane w tej księdze."
  tags: []
"J20,31":
  text: "Lecz te są napisane, abyście wierzyli, że Jezus jest Chrystusem, Synem Bożym, i abyście wierząc, mieli życie w jego imieniu."
  tags: []
