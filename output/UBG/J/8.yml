"J8,1":
  text: "A Jezus poszedł na Górę Oliwną."
  tags: []
"J8,2":
  text: "Potem znowu wcześnie rano przyszedł do świątyni, a cały lud zszedł się do niego. I siadłszy, nauczał ich."
  tags: []
"J8,3":
  text: "I przyprowadzili do niego uczeni w Piśmie i faryzeusze kobietę przyłapaną na cudzołóstwie, a postawiwszy ją pośrodku;"
  tags: []
"J8,4":
  text: "Powiedzieli do niego: Nauczycielu, tę kobietę przyłapano na uczynku cudzołóstwa."
  tags: []
"J8,5":
  text: "W prawie Mojżesz nakazał nam takie kamienować. A ty co mówisz?"
  tags: []
"J8,6":
  text: "A mówili to, wystawiając go na próbę, aby mogli go oskarżyć. Jezus zaś, schyliwszy się, pisał palcem po ziemi."
  tags: []
"J8,7":
  text: "A gdy nie przestawali go pytać, podniósł się i powiedział do nich: Kto z was jest bez grzechu, niech pierwszy rzuci w nią kamieniem."
  tags: []
"J8,8":
  text: "I znowu schyliwszy się, pisał po ziemi."
  tags: []
"J8,9":
  text: "A gdy oni to usłyszeli, będąc przekonani przez sumienie, odchodzili jeden po drugim, począwszy od starszych aż do ostatnich. Pozostał tylko sam Jezus i ta kobieta stojąca pośrodku."
  tags: []
"J8,10":
  text: "A Jezus podniósł się i nie widząc nikogo oprócz tej kobiety, powiedział do niej: Kobieto, gdzież są ci, którzy cię oskarżali? Nikt cię nie potępił?"
  tags: []
"J8,11":
  text: "Ona odpowiedziała: Nikt, Panie. A Jezus powiedział do niej: I ja ciebie nie potępiam. Idź i już więcej nie grzesz."
  tags: []
"J8,12":
  text: "Jezus znowu powiedział do nich: Ja jestem światłością świata. Kto idzie za mną, nie będzie chodził w ciemności, ale będzie miał światłość życia."
  tags: []
"J8,13":
  text: "Powiedzieli więc do niego faryzeusze: Ty świadczysz sam o sobie, a twoje świadectwo nie jest prawdziwe."
  tags: []
"J8,14":
  text: "Odpowiedział im Jezus: Chociaż ja świadczę sam o sobie, jednak moje świadectwo jest prawdziwe, bo wiem, skąd przyszedłem i dokąd idę. Lecz wy nie wiecie, skąd przyszedłem i dokąd idę."
  tags: []
"J8,15":
  text: "Wy sądzicie według ciała, ale ja nie sądzę nikogo."
  tags: []
"J8,16":
  text: "A choćbym i sądził, mój sąd jest prawdziwy, bo nie jestem sam, ale jestem ja i Ojciec, który mnie posłał."
  tags: []
"J8,17":
  text: "A w waszym Prawie jest napisane, że świadectwo dwóch ludzi jest prawdziwe."
  tags: []
"J8,18":
  text: "Ja jestem tym, który świadczy sam o sobie i świadczy o mnie Ojciec, który mnie posłał."
  tags: []
"J8,19":
  text: "Wtedy zapytali go: Gdzie jest twój Ojciec? Jezus odpowiedział: Nie znacie ani mnie, ani mego Ojca. Gdybyście mnie znali, znalibyście i mego Ojca."
  tags: []
"J8,20":
  text: "Te słowa mówił Jezus w skarbcu, nauczając w świątyni, a nikt go nie schwytał, bo jeszcze nie nadeszła jego godzina."
  tags: []
"J8,21":
  text: "Wówczas Jezus znowu powiedział do nich: Ja odchodzę, a wy będziecie mnie szukać i umrzecie w swoim grzechu. Gdzie ja idę, wy przyjść nie możecie."
  tags: []
"J8,22":
  text: "Wtedy Żydzi mówili: Czyż sam się zabije, skoro mówi: Gdzie ja idę, wy przyjść nie możecie?"
  tags: []
"J8,23":
  text: "I powiedział do nich: Wy jesteście z niskości, a ja jestem z wysoka. Wy jesteście z tego świata, ja zaś nie jestem z tego świata."
  tags: []
"J8,24":
  text: "Dlatego wam powiedziałem, że umrzecie w swoich grzechach. Bo jeśli nie uwierzycie, że ja jestem, umrzecie w swoich grzechach."
  tags: []
"J8,25":
  text: "Wtedy zapytali go: Kim ty jesteś? I odpowiedział im Jezus: Tym, kim wam od początku mówię."
  tags: []
"J8,26":
  text: "Wiele mam o was do powiedzenia i do sądzenia. Ale ten, który mnie posłał, jest prawdziwy, a ja mówię na świecie to, co od niego słyszałem."
  tags: []
"J8,27":
  text: "Nie zrozumieli jednak, że mówił im o Ojcu."
  tags: []
"J8,28":
  text: "Dlatego Jezus powiedział do nich: Gdy wywyższycie Syna Człowieczego, wtedy poznacie, że ja jestem, a nie czynię nic sam od siebie, ale mówię to, czego mnie nauczył mój Ojciec."
  tags: []
"J8,29":
  text: "A ten, który mnie posłał, jest ze mną. Ojciec nie zostawił mnie samego, bo ja zawsze czynię to, co mu się podoba."
  tags: []
"J8,30":
  text: "Gdy to mówił, wielu uwierzyło w niego."
  tags: []
"J8,31":
  text: "Wtedy Jezus mówił do tych Żydów, którzy mu uwierzyli: Jeśli będziecie trwać w moim słowie, będziecie prawdziwie moimi uczniami."
  tags: []
"J8,32":
  text: "I poznacie prawdę, a prawda was wyzwoli."
  tags: []
"J8,33":
  text: "Odpowiedzieli mu: My jesteśmy potomstwem Abrahama i nigdy nie służyliśmy nikomu. Jakże możesz mówić: Będziecie wolni?"
  tags: []
"J8,34":
  text: "Jezus im odpowiedział: Zaprawdę, zaprawdę powiadam wam, że każdy, kto popełnia grzech, jest sługą grzechu."
  tags: []
"J8,35":
  text: "A sługa nie mieszka w domu na wieki, lecz Syn mieszka na wieki."
  tags: []
"J8,36":
  text: "Jeśli więc Syn was wyzwoli, będziecie prawdziwie wolni."
  tags: []
"J8,37":
  text: "Wiem, że jesteście potomstwem Abrahama, lecz usiłujecie mnie zabić, bo moje słowo nie znajduje w was miejsca."
  tags: []
"J8,38":
  text: "Ja mówię to, co widziałem u mego Ojca, a wy też robicie to, co widzieliście u waszego ojca."
  tags: []
"J8,39":
  text: "Odpowiedzieli mu: Naszym ojcem jest Abraham. Jezus im powiedział: Gdybyście byli synami Abrahama, spełnialibyście uczynki Abrahama."
  tags: []
"J8,40":
  text: "Lecz teraz usiłujecie mnie zabić, człowieka, który wam mówił prawdę, którą słyszał od Boga. Tego Abraham nie robił."
  tags: []
"J8,41":
  text: "Wy spełniacie uczynki waszego ojca. Wtedy powiedzieli mu: My nie jesteśmy spłodzeni z nierządu. Mamy jednego Ojca – Boga."
  tags: []
"J8,42":
  text: "Jezus im powiedział: Gdyby Bóg był waszym Ojcem, miłowalibyście mnie, gdyż ja od Boga wyszedłem i przyszedłem, a nie przyszedłem sam od siebie, ale on mnie posłał."
  tags: []
"J8,43":
  text: "Dlaczego nie pojmujecie tego, co mówię? Dlatego że nie możecie słuchać mojego słowa."
  tags: []
"J8,44":
  text: "Wy jesteście z waszego ojca – diabła i chcecie spełniać pożądliwości waszego ojca. On był mordercą od początku i nie został w prawdzie, bo nie ma w nim prawdy. Gdy mówi kłamstwo, mówi od siebie, bo jest kłamcą i ojcem kłamstwa."
  tags: []
"J8,45":
  text: "A ponieważ ja mówię prawdę, nie wierzycie mi."
  tags: []
"J8,46":
  text: "Któż z was obwini mnie o grzech? Jeśli mówię prawdę, dlaczego mi nie wierzycie?"
  tags: []
"J8,47":
  text: "Kto jest z Boga, słucha słów Bożych. Wy dlatego nie słuchacie, że nie jesteście z Boga."
  tags: []
"J8,48":
  text: "Wtedy Żydzi mu odpowiedzieli: Czy nie dobrze mówimy, że jesteś Samarytaninem i masz demona?"
  tags: []
"J8,49":
  text: "Jezus odpowiedział: Ja nie mam demona, ale czczę mego Ojca, a wy mnie znieważacie."
  tags: []
"J8,50":
  text: "Ja nie szukam swojej chwały. Jest ktoś, kto szuka i sądzi."
  tags: []
"J8,51":
  text: "Zaprawdę, zaprawdę powiadam wam: Jeśli ktoś będzie zachowywał moje słowa, nigdy nie ujrzy śmierci."
  tags: []
"J8,52":
  text: "Wtedy Żydzi powiedzieli do niego: Teraz wiemy, że masz demona. Abraham umarł i prorocy, a ty mówisz: Jeśli ktoś będzie zachowywał moje słowa, nigdy nie skosztuje śmierci."
  tags: []
"J8,53":
  text: "Czy ty jesteś większy od naszego ojca Abrahama, który umarł? I prorocy poumierali. Kim ty się czynisz?"
  tags: []
"J8,54":
  text: "Jezus odpowiedział: Jeśli ja sam siebie chwalę, moja chwała jest niczym. Mój Ojciec jest tym, który mnie chwali, o którym wy mówicie, że jest waszym Bogiem."
  tags: []
"J8,55":
  text: "Lecz nie znacie go, a ja go znam. I jeślibym powiedział, że go nie znam, byłbym podobnym do was kłamcą. Ale znam go i zachowuję jego słowa."
  tags: []
"J8,56":
  text: "Abraham, wasz ojciec, z radością pragnął ujrzeć mój dzień. I ujrzał, i radował się."
  tags: []
"J8,57":
  text: "Wówczas Żydzi powiedzieli do niego: Pięćdziesięciu lat jeszcze nie masz, a Abrahama widziałeś?"
  tags: []
"J8,58":
  text: "Jezus im odpowiedział: Zaprawdę, zaprawdę powiadam wam: Zanim Abraham był, ja jestem."
  tags: []
"J8,59":
  text: "Wtedy porwali kamienie, aby w niego rzucać. Jezus jednak ukrył się i wyszedł ze świątyni, przechodząc między nimi, i tak odszedł."
  tags: []
