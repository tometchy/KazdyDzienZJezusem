"J11,1":
  text: "A był chory pewien człowiek, Łazarz z Betanii, z miasteczka Marii i jej siostry Marty."
  tags: []
"J11,2":
  text: "A to była ta Maria, która namaściła Pana maścią i wycierała jego nogi swoimi włosami. Jej to brat, Łazarz, chorował."
  tags: []
"J11,3":
  text: "Siostry więc posłały do niego wiadomość: Panie, oto ten, którego miłujesz, choruje."
  tags: []
"J11,4":
  text: "A gdy Jezus to usłyszał, powiedział: Ta choroba nie jest na śmierć, ale na chwałę Bożą, aby przez nią był uwielbiony Syn Boży."
  tags: []
"J11,5":
  text: "Jezus zaś miłował Martę i jej siostrę, i Łazarza."
  tags: []
"J11,6":
  text: "A gdy usłyszał, że choruje, został jeszcze dwa dni w miejscu, w którym przebywał."
  tags: []
"J11,7":
  text: "Lecz potem powiedział do swoich uczniów: Chodźmy znowu do Judei."
  tags: []
"J11,8":
  text: "Uczniowie mu powiedzieli: Mistrzu, Żydzi dopiero co usiłowali cię ukamienować, a znowu tam idziesz?"
  tags: []
"J11,9":
  text: "Jezus odpowiedział: Czyż dzień nie ma dwunastu godzin? Jeśli ktoś chodzi we dnie, nie potknie się, bo widzi światłość tego świata."
  tags: []
"J11,10":
  text: "A jeśli ktoś chodzi w nocy, potknie się, bo nie ma w nim światłości."
  tags: []
"J11,11":
  text: "To powiedział, a potem dodał: Łazarz, nasz przyjaciel, śpi, ale idę, aby obudzić go ze snu."
  tags: []
"J11,12":
  text: "Wtedy jego uczniowie powiedzieli: Panie, jeśli śpi, będzie zdrowy."
  tags: []
"J11,13":
  text: "Ale Jezus mówił o jego śmierci, lecz oni myśleli, że mówił o zaśnięciu zwykłym snem."
  tags: []
"J11,14":
  text: "Wówczas Jezus powiedział im otwarcie: Łazarz umarł."
  tags: []
"J11,15":
  text: "I ze względu na was raduję się, że mnie tam nie było, abyście uwierzyli. Ale chodźmy do niego."
  tags: []
"J11,16":
  text: "Wtedy Tomasz, zwany Didymos, powiedział do współuczniów: Chodźmy i my, aby z nim umrzeć."
  tags: []
"J11,17":
  text: "Kiedy Jezus przyszedł, zastał go już cztery dni leżącego w grobie."
  tags: []
"J11,18":
  text: "A Betania była niedaleko Jerozolimy, w odległości około piętnastu stadiów."
  tags: []
"J11,19":
  text: "A wielu Żydów przyszło do Marty i Marii, aby je pocieszyć po stracie brata."
  tags: []
"J11,20":
  text: "Gdy Marta usłyszała, że Jezus nadchodzi, wybiegła mu naprzeciw. Ale Maria siedziała w domu."
  tags: []
"J11,21":
  text: "I powiedziała Marta do Jezusa: Panie, gdybyś tu był, mój brat by nie umarł."
  tags: []
"J11,22":
  text: "Ale i teraz wiem, że Bóg da tobie, o cokolwiek go poprosisz."
  tags: []
"J11,23":
  text: "Jezus jej odpowiedział: Twój brat zmartwychwstanie."
  tags: []
"J11,24":
  text: "Marta mu powiedziała: Wiem, że zmartwychwstanie przy zmartwychwstaniu w dniu ostatecznym."
  tags: []
"J11,25":
  text: "I powiedział do niej Jezus: Ja jestem zmartwychwstaniem i życiem. Kto we mnie wierzy, choćby i umarł, będzie żył."
  tags: []
"J11,26":
  text: "A każdy, kto żyje i wierzy we mnie, nigdy nie umrze. Czy wierzysz w to?"
  tags: []
"J11,27":
  text: "Odpowiedziała mu: Tak, Panie. Ja uwierzyłam, że ty jesteś Chrystusem, Synem Bożym, który miał przyjść na świat."
  tags: []
"J11,28":
  text: "A to powiedziawszy, poszła i potajemnie zawołała swoją siostrę Marię, i powiedziała: Jest tu Nauczyciel i woła cię."
  tags: []
"J11,29":
  text: "Gdy tylko ona to usłyszała, zaraz wstała i poszła do niego."
  tags: []
"J11,30":
  text: "A Jezus jeszcze nie wszedł do miasteczka, lecz był na tym miejscu, gdzie Marta wyszła mu naprzeciw."
  tags: []
"J11,31":
  text: "Wtedy Żydzi, którzy byli z nią w domu i pocieszali ją, widząc, że Maria szybko wstała i wyszła, poszli za nią, mówiąc: Idzie do grobu, aby tam płakać."
  tags: []
"J11,32":
  text: "A gdy Maria przyszła tam, gdzie był Jezus, ujrzała go, przypadła mu do nóg i powiedziała: Panie, gdybyś tu był, mój brat by nie umarł."
  tags: []
"J11,33":
  text: "Kiedy Jezus zobaczył ją płaczącą i płaczących Żydów, którzy z nią przyszli, rozrzewnił się w duchu i zasmucił się."
  tags: []
"J11,34":
  text: "I zapytał: Gdzie go położyliście? Odpowiedzieli mu: Panie, chodź i zobacz."
  tags: []
"J11,35":
  text: "I Jezus zapłakał."
  tags: []
"J11,36":
  text: "Wtedy Żydzi powiedzieli: Patrzcie, jak go miłował."
  tags: []
"J11,37":
  text: "A niektórzy z nich mówili: Czyż ten, który otworzył oczy ślepego, nie mógł sprawić, aby on nie umarł?"
  tags: []
"J11,38":
  text: "Jezus zaś ponownie się rozrzewnił i przyszedł do grobu. Była to jaskinia, a u jej wejścia był położony kamień."
  tags: []
"J11,39":
  text: "I powiedział Jezus: Usuńcie ten kamień. Powiedziała do niego Marta, siostra zmarłego: Panie, już cuchnie, bo od czterech dni leży w grobie."
  tags: []
"J11,40":
  text: "Jezus jej rzekł: Czyż nie powiedziałem ci, że jeśli uwierzysz, ujrzysz chwałę Bożą?"
  tags: []
"J11,41":
  text: "Wtedy usunęli kamień z miejsca, gdzie był położony zmarły. Jezus zaś podniósł oczy w górę i powiedział: Ojcze, dziękuję ci, że mnie wysłuchałeś."
  tags: []
"J11,42":
  text: "A ja wiedziałem, że mnie zawsze wysłuchujesz, ale powiedziałem to ze względu na stojących wokoło ludzi, aby uwierzyli, że ty mnie posłałeś."
  tags: []
"J11,43":
  text: "Gdy to powiedział, zawołał donośnym głosem: Łazarzu, wyjdź na zewnątrz!"
  tags: []
"J11,44":
  text: "I wyszedł ten, który umarł, mając ręce i nogi powiązane opaskami, a twarz obwiązaną chustką. Powiedział do nich Jezus: Rozwiążcie go i pozwólcie mu odejść."
  tags: []
"J11,45":
  text: "Wielu więc z Żydów, którzy przyszli do Marii i widzieli to, czego Jezus dokonał, uwierzyło w niego."
  tags: []
"J11,46":
  text: "Lecz niektórzy z nich odeszli do faryzeuszy i powiedzieli im, co Jezus uczynił."
  tags: []
"J11,47":
  text: "Wtedy naczelni kapłani i faryzeusze zebrali się na naradę i mówili: Co zrobimy? Bo ten człowiek czyni wiele cudów."
  tags: []
"J11,48":
  text: "Jeśli go tak zostawimy, wszyscy uwierzą w niego i przyjdą Rzymianie, i zabiorą nam to nasze miejsce i naród."
  tags: []
"J11,49":
  text: "A jeden z nich, Kajfasz, który był tego roku najwyższym kapłanem, powiedział do nich: Wy nic nie wiecie;"
  tags: []
"J11,50":
  text: "I nie bierzecie pod uwagę, że pożyteczniej jest dla nas, żeby jeden człowiek umarł za lud, a żeby cały ten naród nie zginął."
  tags: []
"J11,51":
  text: "A nie mówił tego sam od siebie, ale będąc tego roku najwyższym kapłanem, prorokował, że Jezus miał umrzeć za ten naród;"
  tags: []
"J11,52":
  text: "A nie tylko za ten naród, ale też po to, aby zgromadzić w jedno rozproszone dzieci Boże."
  tags: []
"J11,53":
  text: "Od tego więc dnia naradzali się wspólnie nad tym, aby go zabić."
  tags: []
"J11,54":
  text: "A Jezus już nie chodził jawnie wśród Żydów, ale odszedł stamtąd do krainy, która leży w pobliżu pustyni, do miasta zwanego Efraim, i tam mieszkał ze swoimi uczniami."
  tags: []
"J11,55":
  text: "A zbliżała się Pascha żydowska. I wielu z tej okolicy szło do Jerozolimy przed Paschą, aby się oczyścić."
  tags: []
"J11,56":
  text: "Szukali Jezusa i stojąc w świątyni, mówili jedni do drugich: Czy myślicie, że nie przyjdzie na święto?"
  tags: []
"J11,57":
  text: "A naczelni kapłani i faryzeusze wydali nakaz, aby, jeśli ktoś się dowie, gdzie jest, oznajmił to, żeby go mogli schwytać."
  tags: []
