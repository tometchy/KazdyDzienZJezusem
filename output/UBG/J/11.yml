"J11,1": "A był chory pewien człowiek, Łazarz z Betanii, z miasteczka Marii i jej siostry Marty."
"J11,2": "A to była ta Maria, która namaściła Pana maścią i wycierała jego nogi swoimi włosami. Jej to brat, Łazarz, chorował."
"J11,3": "Siostry więc posłały do niego wiadomość: Panie, oto ten, którego miłujesz, choruje."
"J11,4": "A gdy Jezus to usłyszał, powiedział: Ta choroba nie jest na śmierć, ale na chwałę Bożą, aby przez nią był uwielbiony Syn Boży."
"J11,5": "Jezus zaś miłował Martę i jej siostrę, i Łazarza."
"J11,6": "A gdy usłyszał, że choruje, został jeszcze dwa dni w miejscu, w którym przebywał."
"J11,7": "Lecz potem powiedział do swoich uczniów: Chodźmy znowu do Judei."
"J11,8": "Uczniowie mu powiedzieli: Mistrzu, Żydzi dopiero co usiłowali cię ukamienować, a znowu tam idziesz?"
"J11,9": "Jezus odpowiedział: Czyż dzień nie ma dwunastu godzin? Jeśli ktoś chodzi we dnie, nie potknie się, bo widzi światłość tego świata."
"J11,10": "A jeśli ktoś chodzi w nocy, potknie się, bo nie ma w nim światłości."
"J11,11": "To powiedział, a potem dodał: Łazarz, nasz przyjaciel, śpi, ale idę, aby obudzić go ze snu."
"J11,12": "Wtedy jego uczniowie powiedzieli: Panie, jeśli śpi, będzie zdrowy."
"J11,13": "Ale Jezus mówił o jego śmierci, lecz oni myśleli, że mówił o zaśnięciu zwykłym snem."
"J11,14": "Wówczas Jezus powiedział im otwarcie: Łazarz umarł."
"J11,15": "I ze względu na was raduję się, że mnie tam nie było, abyście uwierzyli. Ale chodźmy do niego."
"J11,16": "Wtedy Tomasz, zwany Didymos, powiedział do współuczniów: Chodźmy i my, aby z nim umrzeć."
"J11,17": "Kiedy Jezus przyszedł, zastał go już cztery dni leżącego w grobie."
"J11,18": "A Betania była niedaleko Jerozolimy, w odległości około piętnastu stadiów."
"J11,19": "A wielu Żydów przyszło do Marty i Marii, aby je pocieszyć po stracie brata."
"J11,20": "Gdy Marta usłyszała, że Jezus nadchodzi, wybiegła mu naprzeciw. Ale Maria siedziała w domu."
"J11,21": "I powiedziała Marta do Jezusa: Panie, gdybyś tu był, mój brat by nie umarł."
"J11,22": "Ale i teraz wiem, że Bóg da tobie, o cokolwiek go poprosisz."
"J11,23": "Jezus jej odpowiedział: Twój brat zmartwychwstanie."
"J11,24": "Marta mu powiedziała: Wiem, że zmartwychwstanie przy zmartwychwstaniu w dniu ostatecznym."
"J11,25": "I powiedział do niej Jezus: Ja jestem zmartwychwstaniem i życiem. Kto we mnie wierzy, choćby i umarł, będzie żył."
"J11,26": "A każdy, kto żyje i wierzy we mnie, nigdy nie umrze. Czy wierzysz w to?"
"J11,27": "Odpowiedziała mu: Tak, Panie. Ja uwierzyłam, że ty jesteś Chrystusem, Synem Bożym, który miał przyjść na świat."
"J11,28": "A to powiedziawszy, poszła i potajemnie zawołała swoją siostrę Marię, i powiedziała: Jest tu Nauczyciel i woła cię."
"J11,29": "Gdy tylko ona to usłyszała, zaraz wstała i poszła do niego."
"J11,30": "A Jezus jeszcze nie wszedł do miasteczka, lecz był na tym miejscu, gdzie Marta wyszła mu naprzeciw."
"J11,31": "Wtedy Żydzi, którzy byli z nią w domu i pocieszali ją, widząc, że Maria szybko wstała i wyszła, poszli za nią, mówiąc: Idzie do grobu, aby tam płakać."
"J11,32": "A gdy Maria przyszła tam, gdzie był Jezus, ujrzała go, przypadła mu do nóg i powiedziała: Panie, gdybyś tu był, mój brat by nie umarł."
"J11,33": "Kiedy Jezus zobaczył ją płaczącą i płaczących Żydów, którzy z nią przyszli, rozrzewnił się w duchu i zasmucił się."
"J11,34": "I zapytał: Gdzie go położyliście? Odpowiedzieli mu: Panie, chodź i zobacz."
"J11,35": "I Jezus zapłakał."
"J11,36": "Wtedy Żydzi powiedzieli: Patrzcie, jak go miłował."
"J11,37": "A niektórzy z nich mówili: Czyż ten, który otworzył oczy ślepego, nie mógł sprawić, aby on nie umarł?"
"J11,38": "Jezus zaś ponownie się rozrzewnił i przyszedł do grobu. Była to jaskinia, a u jej wejścia był położony kamień."
"J11,39": "I powiedział Jezus: Usuńcie ten kamień. Powiedziała do niego Marta, siostra zmarłego: Panie, już cuchnie, bo od czterech dni leży w grobie."
"J11,40": "Jezus jej rzekł: Czyż nie powiedziałem ci, że jeśli uwierzysz, ujrzysz chwałę Bożą?"
"J11,41": "Wtedy usunęli kamień z miejsca, gdzie był położony zmarły. Jezus zaś podniósł oczy w górę i powiedział: Ojcze, dziękuję ci, że mnie wysłuchałeś."
"J11,42": "A ja wiedziałem, że mnie zawsze wysłuchujesz, ale powiedziałem to ze względu na stojących wokoło ludzi, aby uwierzyli, że ty mnie posłałeś."
"J11,43": "Gdy to powiedział, zawołał donośnym głosem: Łazarzu, wyjdź na zewnątrz!"
"J11,44": "I wyszedł ten, który umarł, mając ręce i nogi powiązane opaskami, a twarz obwiązaną chustką. Powiedział do nich Jezus: Rozwiążcie go i pozwólcie mu odejść."
"J11,45": "Wielu więc z Żydów, którzy przyszli do Marii i widzieli to, czego Jezus dokonał, uwierzyło w niego."
"J11,46": "Lecz niektórzy z nich odeszli do faryzeuszy i powiedzieli im, co Jezus uczynił."
"J11,47": "Wtedy naczelni kapłani i faryzeusze zebrali się na naradę i mówili: Co zrobimy? Bo ten człowiek czyni wiele cudów."
"J11,48": "Jeśli go tak zostawimy, wszyscy uwierzą w niego i przyjdą Rzymianie, i zabiorą nam to nasze miejsce i naród."
"J11,49": "A jeden z nich, Kajfasz, który był tego roku najwyższym kapłanem, powiedział do nich: Wy nic nie wiecie;"
"J11,50": "I nie bierzecie pod uwagę, że pożyteczniej jest dla nas, żeby jeden człowiek umarł za lud, a żeby cały ten naród nie zginął."
"J11,51": "A nie mówił tego sam od siebie, ale będąc tego roku najwyższym kapłanem, prorokował, że Jezus miał umrzeć za ten naród;"
"J11,52": "A nie tylko za ten naród, ale też po to, aby zgromadzić w jedno rozproszone dzieci Boże."
"J11,53": "Od tego więc dnia naradzali się wspólnie nad tym, aby go zabić."
"J11,54": "A Jezus już nie chodził jawnie wśród Żydów, ale odszedł stamtąd do krainy, która leży w pobliżu pustyni, do miasta zwanego Efraim, i tam mieszkał ze swoimi uczniami."
"J11,55": "A zbliżała się Pascha żydowska. I wielu z tej okolicy szło do Jerozolimy przed Paschą, aby się oczyścić."
"J11,56": "Szukali Jezusa i stojąc w świątyni, mówili jedni do drugich: Czy myślicie, że nie przyjdzie na święto?"
"J11,57": "A naczelni kapłani i faryzeusze wydali nakaz, aby, jeśli ktoś się dowie, gdzie jest, oznajmił to, żeby go mogli schwytać."
