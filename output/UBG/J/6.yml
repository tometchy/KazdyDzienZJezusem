"J6,1":
  text: "Potem Jezus odszedł za Morze Galilejskie, czyli Tyberiadzkie."
  tags: []
"J6,2":
  text: "A szedł za nim wielki tłum, bo widzieli cuda, które czynił na chorych."
  tags: []
"J6,3":
  text: "I wszedł Jezus na górę, i usiadł tam ze swoimi uczniami."
  tags: []
"J6,4":
  text: "A zbliżała się Pascha, święto żydowskie."
  tags: []
"J6,5":
  text: "Wtedy Jezus, podniósłszy oczy i ujrzawszy, że mnóstwo ludzi idzie do niego, zapytał Filipa: Gdzie kupimy chleba, aby oni mogli jeść?"
  tags: []
"J6,6":
  text: "Ale mówił to, wystawiając go na próbę. Wiedział bowiem, co miał czynić."
  tags: []
"J6,7":
  text: "Filip mu odpowiedział: Za dwieście groszy nie wystarczy dla nich chleba, choćby każdy z nich wziął tylko trochę."
  tags: []
"J6,8":
  text: "Jeden z jego uczniów, Andrzej, brat Szymona Piotra, powiedział do niego:"
  tags: []
"J6,9":
  text: "Jest tu jeden chłopiec, który ma pięć chlebów jęczmiennych i dwie rybki. Ale cóż to jest na tak wielu?"
  tags: []
"J6,10":
  text: "Wtedy Jezus powiedział: Każcie ludziom usiąść. A było dużo trawy na tym miejscu. Usiedli więc mężczyźni w liczbie około pięciu tysięcy."
  tags: []
"J6,11":
  text: "Wówczas Jezus wziął te chleby i podziękowawszy, rozdał uczniom, a uczniowie siedzącym. Podobnie i z tych rybek, ile tylko chcieli."
  tags: []
"J6,12":
  text: "A gdy się nasycili, powiedział do swoich uczniów: Zbierzcie kawałki, które zostały, żeby nic nie przepadło."
  tags: []
"J6,13":
  text: "Zebrali więc i napełnili dwanaście koszy kawałkami, które zostały z tych pięciu chlebów jęczmiennych po tych, którzy jedli."
  tags: []
"J6,14":
  text: "A ci ludzie, ujrzawszy cud, który uczynił Jezus, mówili: To jest prawdziwie ten prorok, który miał przyjść na świat."
  tags: []
"J6,15":
  text: "Wtedy Jezus, poznawszy, że mieli przyjść i porwać go, aby go obwołać królem, odszedł znowu sam jeden na górę."
  tags: []
"J6,16":
  text: "A gdy był wieczór, jego uczniowie zeszli nad morze;"
  tags: []
"J6,17":
  text: "Wsiedli do łodzi i płynęli na drugi brzeg, do Kafarnaum. Było już ciemno, a Jezus jeszcze do nich nie przybył."
  tags: []
"J6,18":
  text: "A kiedy powstał wielki wiatr, morze zaczęło się burzyć."
  tags: []
"J6,19":
  text: "Gdy odpłynęli na około dwadzieścia pięć lub trzydzieści stadiów, ujrzeli Jezusa chodzącego po morzu i zbliżającego się do łodzi i zlękli się."
  tags: []
"J6,20":
  text: "A on powiedział do nich: To ja jestem, nie bójcie się."
  tags: []
"J6,21":
  text: "Wzięli go więc chętnie do łodzi i natychmiast łódź przypłynęła do ziemi, do której płynęli."
  tags: []
"J6,22":
  text: "Nazajutrz ludzie, którzy byli po drugiej stronie morza, zobaczyli, że tam nie było innej łodzi, tylko ta jedna, do której wsiedli jego uczniowie, i że Jezus nie wsiadł do łodzi ze swoimi uczniami, ale jego uczniowie odpłynęli sami."
  tags: []
"J6,23":
  text: "(Przypłynęły też inne łodzie z Tyberiady w pobliże tego miejsca, gdzie jedli chleb, gdy Pan złożył dziękczynienie.)"
  tags: []
"J6,24":
  text: "Gdy więc ludzie zobaczyli, że tam nie było Jezusa ani jego uczniów, wsiedli i oni do łodzi i przeprawili się do Kafarnaum, szukając Jezusa."
  tags: []
"J6,25":
  text: "Kiedy znaleźli go po drugiej stronie morza, zapytali: Mistrzu, kiedy tu przybyłeś?"
  tags: []
"J6,26":
  text: "Jezus im odpowiedział: Zaprawdę, zaprawdę powiadam wam: Szukacie mnie nie dlatego, że widzieliście cuda, ale dlatego, że jedliście chleb i nasyciliście się."
  tags: []
"J6,27":
  text: "Zabiegajcie nie o pokarm, który ginie, ale o pokarm, który trwa ku życiu wiecznemu, który wam da Syn Człowieczy. Jego bowiem zapieczętował Bóg Ojciec."
  tags: []
"J6,28":
  text: "Wtedy zapytali go: Cóż mamy robić, abyśmy wykonywali dzieła Boga?"
  tags: []
"J6,29":
  text: "Odpowiedział im Jezus: To jest dzieło Boga, abyście wierzyli w tego, którego on posłał."
  tags: []
"J6,30":
  text: "Powiedzieli mu więc: Jaki znak czynisz, abyśmy widzieli i wierzyli tobie? Cóż czynisz?"
  tags: []
"J6,31":
  text: "Nasi ojcowie jedli mannę na pustyni, jak jest napisane: Chleb z nieba dał im do jedzenia."
  tags: []
"J6,32":
  text: "Wtedy Jezus im odpowiedział: Zaprawdę, zaprawdę powiadam wam: Nie Mojżesz dał wam chleb z nieba, ale mój Ojciec daje wam prawdziwy chleb z nieba."
  tags: []
"J6,33":
  text: "Chlebem Boga bowiem jest ten, który zstępuje z nieba i daje światu życie."
  tags: []
"J6,34":
  text: "Wtedy powiedzieli do niego: Panie, dawaj nam zawsze tego chleba."
  tags: []
"J6,35":
  text: "I odpowiedział im Jezus: Ja jestem chlebem życia. Kto przychodzi do mnie, nie będzie głodny, a kto wierzy we mnie, nigdy nie będzie odczuwał pragnienia."
  tags: []
"J6,36":
  text: "Ale wam powiedziałem: Chociaż widzieliście mnie, nie wierzycie."
  tags: []
"J6,37":
  text: "Wszystko, co mi daje Ojciec, przyjdzie do mnie, a tego, który przyjdzie do mnie, nie wyrzucę precz."
  tags: []
"J6,38":
  text: "Zstąpiłem bowiem z nieba nie po to, żeby czynić swoją wolę, ale wolę tego, który mnie posłał."
  tags: []
"J6,39":
  text: "A to jest wola Ojca, który mnie posłał, abym nie stracił nic z tego wszystkiego, co mi dał, ale abym to wskrzesił w dniu ostatecznym."
  tags: []
"J6,40":
  text: "I to jest wola tego, który mnie posłał, aby każdy, kto widzi Syna i wierzy w niego, miał życie wieczne, a ja go wskrzeszę w dniu ostatecznym."
  tags: []
"J6,41":
  text: "Wtedy szemrali Żydzi o nim, bo powiedział: Ja jestem chlebem, który zstąpił z nieba."
  tags: []
"J6,42":
  text: "I mówili: Czyż to nie jest Jezus, syn Józefa, którego ojca i matkę znamy? Jakże więc on może mówić: Zstąpiłem z nieba?"
  tags: []
"J6,43":
  text: "Wtedy Jezus im odpowiedział: Nie szemrajcie między sobą."
  tags: []
"J6,44":
  text: "Nikt nie może przyjść do mnie, jeśli go nie pociągnie mój Ojciec, który mnie posłał. A ja go wskrzeszę w dniu ostatecznym."
  tags: []
"J6,45":
  text: "Napisane jest u Proroków: I wszyscy będą wyuczeni przez Boga. Każdy więc, kto słyszał od Ojca i nauczył się, przychodzi do mnie."
  tags: []
"J6,46":
  text: "Nie jakby ktoś widział Ojca, oprócz tego, który jest od Boga; ten widział Ojca."
  tags: []
"J6,47":
  text: "Zaprawdę, zaprawdę powiadam wam: Kto wierzy we mnie, ma życie wieczne."
  tags: []
"J6,48":
  text: "Ja jestem tym chlebem życia."
  tags: []
"J6,49":
  text: "Wasi ojcowie jedli mannę na pustyni, a poumierali."
  tags: []
"J6,50":
  text: "To jest ten chleb, który zstępuje z nieba, aby ten, kto go je, nie umarł."
  tags: []
"J6,51":
  text: "Ja jestem chlebem żywym, który zstąpił z nieba. Jeśli ktoś będzie jadł z tego chleba, będzie żył na wieki. A chleb, który ja dam, to moje ciało, które ja dam za życie świata."
  tags: []
"J6,52":
  text: "Żydzi więc sprzeczali się między sobą i mówili: Jakże on może dać nam swoje ciało do jedzenia?"
  tags: []
"J6,53":
  text: "I powiedział im Jezus: Zaprawdę, zaprawdę powiadam wam: Jeśli nie będziecie jeść ciała Syna Człowieczego i pić jego krwi, nie będziecie mieć życia w sobie."
  tags: []
"J6,54":
  text: "Kto je moje ciało i pije moją krew, ma życie wieczne, a ja go wskrzeszę w dniu ostatecznym."
  tags: []
"J6,55":
  text: "Moje ciało bowiem prawdziwie jest pokarmem, a moja krew prawdziwie jest napojem."
  tags: []
"J6,56":
  text: "Kto je moje ciało i pije moją krew, mieszka we mnie, a ja w nim."
  tags: []
"J6,57":
  text: "Jak mnie posłał żyjący Ojciec i ja żyję przez Ojca, tak kto mnie spożywa, będzie żył przeze mnie."
  tags: []
"J6,58":
  text: "To jest ten chleb, który zstąpił z nieba. Nie jak wasi ojcowie jedli mannę, a pomarli. Kto je ten chleb, będzie żył na wieki."
  tags: []
"J6,59":
  text: "To mówił w synagodze, nauczając w Kafarnaum."
  tags: []
"J6,60":
  text: "Wielu więc z jego uczniów, słysząc to, mówiło: Twarda to jest mowa, któż jej może słuchać?"
  tags: []
"J6,61":
  text: "Ale Jezus świadomy tego, że jego uczniowie o tym szemrali, powiedział do nich: To was obraża?"
  tags: []
"J6,62":
  text: "Cóż dopiero, gdybyście ujrzeli Syna Człowieczego wstępującego tam, gdzie był przedtem?"
  tags: []
"J6,63":
  text: "Duch jest tym, który ożywia, ciało nic nie pomaga. Słowa, które ja wam mówię, są duchem i są życiem."
  tags: []
"J6,64":
  text: "Lecz są wśród was tacy, którzy nie wierzą. Jezus wiedział bowiem od początku, którzy nie wierzyli i kto miał go zdradzić."
  tags: []
"J6,65":
  text: "I mówił: Dlatego wam powiedziałem, że nikt nie może przyjść do mnie, jeśli mu to nie jest dane od mojego Ojca."
  tags: []
"J6,66":
  text: "Od tego czasu wielu jego uczniów zawróciło i więcej z nim nie chodziło."
  tags: []
"J6,67":
  text: "Wtedy Jezus powiedział do dwunastu: Czy i wy chcecie odejść?"
  tags: []
"J6,68":
  text: "I odpowiedział mu Szymon Piotr: Panie, do kogo pójdziemy? Ty masz słowa życia wiecznego."
  tags: []
"J6,69":
  text: "A my uwierzyliśmy i poznaliśmy, że ty jesteś Chrystusem, Synem Boga żywego."
  tags: []
"J6,70":
  text: "Jezus im odpowiedział: Czy ja nie wybrałem was dwunastu? A jeden z was jest diabłem."
  tags: []
"J6,71":
  text: "A to mówił o Judaszu Iskariocie, synu Szymona, bo on miał go zdradzić, będąc jednym z dwunastu."
  tags: []
