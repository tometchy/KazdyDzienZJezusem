"J9,1":
  text: "A przechodząc, zobaczył człowieka ślepego od urodzenia."
  tags: []
"J9,2":
  text: "I pytali go jego uczniowie: Mistrzu, kto zgrzeszył, on czy jego rodzice, że się urodził ślepy?"
  tags: []
"J9,3":
  text: "Jezus odpowiedział: Ani on nie zgrzeszył, ani jego rodzice, ale stało się tak, żeby się na nim objawiły dzieła Boga."
  tags: []
"J9,4":
  text: "Ja muszę wykonywać dzieła tego, który mnie posłał, dopóki jest dzień. Nadchodzi noc, gdy nikt nie będzie mógł działać."
  tags: []
"J9,5":
  text: "Dopóki jestem na świecie, jestem światłością świata."
  tags: []
"J9,6":
  text: "To powiedziawszy, splunął na ziemię, zrobił błoto ze śliny i pomazał tym błotem oczy ślepego."
  tags: []
"J9,7":
  text: "I powiedział do niego: Idź, umyj się w sadzawce Siloam – co się tłumaczy: Posłany. Poszedł więc, umył się i wrócił, widząc."
  tags: []
"J9,8":
  text: "A sąsiedzi i ci, którzy go przedtem widywali ślepego, mówili: Czy to nie jest ten, który siadał i żebrał?"
  tags: []
"J9,9":
  text: "Jedni mówili: To on. A inni: Jest do niego podobny. Lecz on mówił: To ja jestem."
  tags: []
"J9,10":
  text: "Wtedy zapytali go: Jak zostały otworzone twoje oczy?"
  tags: []
"J9,11":
  text: "A on odpowiedział: Człowiek, którego nazywają Jezusem, zrobił błoto, pomazał moje oczy i powiedział do mnie: Idź do sadzawki Siloam i umyj się. Poszedłem więc, umyłem się i przejrzałem."
  tags: []
"J9,12":
  text: "Wtedy zapytali go: Gdzież on jest? Odpowiedział: Nie wiem."
  tags: []
"J9,13":
  text: "Przyprowadzili więc do faryzeuszy tego, który przedtem był ślepy."
  tags: []
"J9,14":
  text: "A tego dnia, gdy Jezus zrobił błoto i otworzył jego oczy, był szabat."
  tags: []
"J9,15":
  text: "Wówczas również faryzeusze pytali go, w jaki sposób przejrzał. A on im odpowiedział: Nałożył mi błoto na oczy, umyłem się i widzę."
  tags: []
"J9,16":
  text: "Wtedy niektórzy z faryzeuszy powiedzieli: Ten człowiek nie jest z Boga, bo nie przestrzega szabatu. Inni natomiast mówili: Jak może grzeszny człowiek czynić takie cuda? I nastąpił wśród nich rozłam."
  tags: []
"J9,17":
  text: "Zapytali więc znowu ślepego: Co mówisz o nim, skoro otworzył twoje oczy? A on odpowiedział: Jest prorokiem."
  tags: []
"J9,18":
  text: "A Żydzi nie wierzyli, że był ślepy i odzyskał wzrok, aż zawołali rodziców tego, który przejrzał."
  tags: []
"J9,19":
  text: "I pytali ich: Czy to jest wasz syn, o którym mówicie, że się urodził ślepy? Jakże więc teraz widzi?"
  tags: []
"J9,20":
  text: "Odpowiedzieli im jego rodzice: Wiemy, że to jest nasz syn i że się urodził ślepy."
  tags: []
"J9,21":
  text: "Lecz jakim sposobem teraz widzi, nie wiemy, ani kto otworzył jego oczy, nie wiemy. Ma swoje lata, pytajcie go, on sam o sobie powie."
  tags: []
"J9,22":
  text: "Tak mówili jego rodzice, bo bali się Żydów. Żydzi bowiem już postanowili, że każdy, kto wyzna, iż on jest Chrystusem, będzie wyłączony z synagogi."
  tags: []
"J9,23":
  text: "Dlatego jego rodzice powiedzieli: Ma swoje lata, jego pytajcie."
  tags: []
"J9,24":
  text: "Wtedy znowu zawołali tego człowieka, który był ślepy i powiedzieli do niego: Oddaj chwałę Bogu. My wiemy, że ten człowiek jest grzeszny."
  tags: []
"J9,25":
  text: "A on odpowiedział: Czy jest grzeszny, nie wiem. To tylko wiem, że byłem ślepy, a teraz widzę."
  tags: []
"J9,26":
  text: "I zapytali go znowu: Cóż ci uczynił? Jak otworzył twoje oczy?"
  tags: []
"J9,27":
  text: "Odpowiedział im: Już wam powiedziałem, a nie słuchaliście. Dlaczego jeszcze chcecie słuchać? Czy i wy chcecie być jego uczniami?"
  tags: []
"J9,28":
  text: "Wtedy złorzeczyli mu i powiedzieli: Ty bądź sobie jego uczniem, my zaś jesteśmy uczniami Mojżesza."
  tags: []
"J9,29":
  text: "My wiemy, że Bóg mówił do Mojżesza, lecz skąd on jest, nie wiemy."
  tags: []
"J9,30":
  text: "Odpowiedział im ten człowiek: To naprawdę rzecz dziwna, że wy nie wiecie, skąd jest, a otworzył moje oczy."
  tags: []
"J9,31":
  text: "A wiemy, że Bóg nie wysłuchuje grzeszników, ale jeśli ktoś jest czcicielem Boga i wypełnia jego wolę, tego wysłuchuje."
  tags: []
"J9,32":
  text: "Od wieków nie słyszano, aby ktoś otworzył oczy ślepego od urodzenia."
  tags: []
"J9,33":
  text: "Gdyby on nie był od Boga, nie mógłby nic uczynić."
  tags: []
"J9,34":
  text: "Odpowiedzieli mu: Urodziłeś się cały w grzechach i ty nas uczysz? I wypędzili go precz."
  tags: []
"J9,35":
  text: "A gdy Jezus usłyszał, że go wypędzili, znalazł go i zapytał: Czy wierzysz w Syna Bożego?"
  tags: []
"J9,36":
  text: "A on odpowiedział: A któż to jest, Panie, abym w niego wierzył?"
  tags: []
"J9,37":
  text: "I powiedział do niego Jezus: I widziałeś go, i ten, który mówi z tobą, jest nim."
  tags: []
"J9,38":
  text: "A on powiedział: Wierzę, Panie! I oddał mu pokłon."
  tags: []
"J9,39":
  text: "Jezus mu powiedział: Przyszedłem na ten świat na sąd, aby ci, którzy nie widzą, widzieli, a ci, którzy widzą, stali się ślepi."
  tags: []
"J9,40":
  text: "I usłyszeli to niektórzy z faryzeuszy, którzy z nim byli, i zapytali go: Czy i my jesteśmy ślepi?"
  tags: []
"J9,41":
  text: "Jezus im odpowiedział: Gdybyście byli ślepi, nie mielibyście grzechu, lecz teraz mówicie: Widzimy – dlatego wasz grzech pozostaje."
  tags: []
