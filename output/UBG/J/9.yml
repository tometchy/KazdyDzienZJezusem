"J9,1": "A przechodząc, zobaczył człowieka ślepego od urodzenia."
"J9,2": "I pytali go jego uczniowie: Mistrzu, kto zgrzeszył, on czy jego rodzice, że się urodził ślepy?"
"J9,3": "Jezus odpowiedział: Ani on nie zgrzeszył, ani jego rodzice, ale stało się tak, żeby się na nim objawiły dzieła Boga."
"J9,4": "Ja muszę wykonywać dzieła tego, który mnie posłał, dopóki jest dzień. Nadchodzi noc, gdy nikt nie będzie mógł działać."
"J9,5": "Dopóki jestem na świecie, jestem światłością świata."
"J9,6": "To powiedziawszy, splunął na ziemię, zrobił błoto ze śliny i pomazał tym błotem oczy ślepego."
"J9,7": "I powiedział do niego: Idź, umyj się w sadzawce Siloam – co się tłumaczy: Posłany. Poszedł więc, umył się i wrócił, widząc."
"J9,8": "A sąsiedzi i ci, którzy go przedtem widywali ślepego, mówili: Czy to nie jest ten, który siadał i żebrał?"
"J9,9": "Jedni mówili: To on. A inni: Jest do niego podobny. Lecz on mówił: To ja jestem."
"J9,10": "Wtedy zapytali go: Jak zostały otworzone twoje oczy?"
"J9,11": "A on odpowiedział: Człowiek, którego nazywają Jezusem, zrobił błoto, pomazał moje oczy i powiedział do mnie: Idź do sadzawki Siloam i umyj się. Poszedłem więc, umyłem się i przejrzałem."
"J9,12": "Wtedy zapytali go: Gdzież on jest? Odpowiedział: Nie wiem."
"J9,13": "Przyprowadzili więc do faryzeuszy tego, który przedtem był ślepy."
"J9,14": "A tego dnia, gdy Jezus zrobił błoto i otworzył jego oczy, był szabat."
"J9,15": "Wówczas również faryzeusze pytali go, w jaki sposób przejrzał. A on im odpowiedział: Nałożył mi błoto na oczy, umyłem się i widzę."
"J9,16": "Wtedy niektórzy z faryzeuszy powiedzieli: Ten człowiek nie jest z Boga, bo nie przestrzega szabatu. Inni natomiast mówili: Jak może grzeszny człowiek czynić takie cuda? I nastąpił wśród nich rozłam."
"J9,17": "Zapytali więc znowu ślepego: Co mówisz o nim, skoro otworzył twoje oczy? A on odpowiedział: Jest prorokiem."
"J9,18": "A Żydzi nie wierzyli, że był ślepy i odzyskał wzrok, aż zawołali rodziców tego, który przejrzał."
"J9,19": "I pytali ich: Czy to jest wasz syn, o którym mówicie, że się urodził ślepy? Jakże więc teraz widzi?"
"J9,20": "Odpowiedzieli im jego rodzice: Wiemy, że to jest nasz syn i że się urodził ślepy."
"J9,21": "Lecz jakim sposobem teraz widzi, nie wiemy, ani kto otworzył jego oczy, nie wiemy. Ma swoje lata, pytajcie go, on sam o sobie powie."
"J9,22": "Tak mówili jego rodzice, bo bali się Żydów. Żydzi bowiem już postanowili, że każdy, kto wyzna, iż on jest Chrystusem, będzie wyłączony z synagogi."
"J9,23": "Dlatego jego rodzice powiedzieli: Ma swoje lata, jego pytajcie."
"J9,24": "Wtedy znowu zawołali tego człowieka, który był ślepy i powiedzieli do niego: Oddaj chwałę Bogu. My wiemy, że ten człowiek jest grzeszny."
"J9,25": "A on odpowiedział: Czy jest grzeszny, nie wiem. To tylko wiem, że byłem ślepy, a teraz widzę."
"J9,26": "I zapytali go znowu: Cóż ci uczynił? Jak otworzył twoje oczy?"
"J9,27": "Odpowiedział im: Już wam powiedziałem, a nie słuchaliście. Dlaczego jeszcze chcecie słuchać? Czy i wy chcecie być jego uczniami?"
"J9,28": "Wtedy złorzeczyli mu i powiedzieli: Ty bądź sobie jego uczniem, my zaś jesteśmy uczniami Mojżesza."
"J9,29": "My wiemy, że Bóg mówił do Mojżesza, lecz skąd on jest, nie wiemy."
"J9,30": "Odpowiedział im ten człowiek: To naprawdę rzecz dziwna, że wy nie wiecie, skąd jest, a otworzył moje oczy."
"J9,31": "A wiemy, że Bóg nie wysłuchuje grzeszników, ale jeśli ktoś jest czcicielem Boga i wypełnia jego wolę, tego wysłuchuje."
"J9,32": "Od wieków nie słyszano, aby ktoś otworzył oczy ślepego od urodzenia."
"J9,33": "Gdyby on nie był od Boga, nie mógłby nic uczynić."
"J9,34": "Odpowiedzieli mu: Urodziłeś się cały w grzechach i ty nas uczysz? I wypędzili go precz."
"J9,35": "A gdy Jezus usłyszał, że go wypędzili, znalazł go i zapytał: Czy wierzysz w Syna Bożego?"
"J9,36": "A on odpowiedział: A któż to jest, Panie, abym w niego wierzył?"
"J9,37": "I powiedział do niego Jezus: I widziałeś go, i ten, który mówi z tobą, jest nim."
"J9,38": "A on powiedział: Wierzę, Panie! I oddał mu pokłon."
"J9,39": "Jezus mu powiedział: Przyszedłem na ten świat na sąd, aby ci, którzy nie widzą, widzieli, a ci, którzy widzą, stali się ślepi."
"J9,40": "I usłyszeli to niektórzy z faryzeuszy, którzy z nim byli, i zapytali go: Czy i my jesteśmy ślepi?"
"J9,41": "Jezus im odpowiedział: Gdybyście byli ślepi, nie mielibyście grzechu, lecz teraz mówicie: Widzimy – dlatego wasz grzech pozostaje."
