"J19,1":
  text: "Wtedy Piłat wziął Jezusa i ubiczował go."
  tags: []
"J19,2":
  text: "A żołnierze upletli koronę z cierni, włożyli mu ją na głowę i ubrali go w purpurowy płaszcz."
  tags: []
"J19,3":
  text: "I mówili: Witaj, królu Żydów! I policzkowali go."
  tags: []
"J19,4":
  text: "Piłat znowu wyszedł na zewnątrz i powiedział do nich: Oto wyprowadzam go do was na zewnątrz, abyście wiedzieli, że nie znajduję w nim żadnej winy."
  tags: []
"J19,5":
  text: "Wtedy Jezus wyszedł na zewnątrz w cierniowej koronie i w purpurowym płaszczu. I powiedział do nich Piłat: Oto człowiek!"
  tags: []
"J19,6":
  text: "A gdy naczelni kapłani i ich słudzy zobaczyli go, zawołali: Ukrzyżuj, ukrzyżuj go! Piłat powiedział do nich: Wy go weźcie i ukrzyżujcie, bo ja nie znajduję w nim żadnej winy."
  tags: []
"J19,7":
  text: "Żydzi mu odpowiedzieli: My mamy prawo i według naszego prawa powinien umrzeć, bo czynił siebie Synem Bożym."
  tags: []
"J19,8":
  text: "A gdy Piłat usłyszał te słowa, jeszcze bardziej się zląkł."
  tags: []
"J19,9":
  text: "I wszedł znowu do ratusza, i zapytał Jezusa: Skąd ty jesteś? Lecz Jezus nie dał mu odpowiedzi."
  tags: []
"J19,10":
  text: "Wtedy Piłat powiedział do niego: Nie chcesz ze mną rozmawiać? Nie wiesz, że mam władzę ukrzyżować cię i mam władzę cię wypuścić?"
  tags: []
"J19,11":
  text: "Jezus odpowiedział: Nie miałbyś żadnej władzy nade mną, gdyby ci jej nie dano z góry. Dlatego ten, który mnie tobie wydał, ma większy grzech."
  tags: []
"J19,12":
  text: "Odtąd Piłat starał się go wypuścić. Żydzi jednak wołali: Jeśli go wypuścisz, nie jesteś przyjacielem cesarza. Każdy, kto się czyni królem, sprzeciwia się cesarzowi."
  tags: []
"J19,13":
  text: "Gdy więc Piłat usłyszał te słowa, wyprowadził Jezusa na zewnątrz i usiadł na krześle sędziowskim, na miejscu zwanym Litostrotos, a po hebrajsku Gabbata."
  tags: []
"J19,14":
  text: "A był to dzień przygotowania Paschy, około godziny szóstej. I powiedział Piłat do Żydów: Oto wasz król!"
  tags: []
"J19,15":
  text: "Lecz oni zawołali: Strać, strać! Ukrzyżuj go! Piłat ich zapytał: Waszego króla mam ukrzyżować? Naczelni kapłani odpowiedzieli: Nie mamy króla poza cesarzem."
  tags: []
"J19,16":
  text: "Wtedy im go wydał, żeby go ukrzyżowano. Wzięli więc Jezusa i wyprowadzili go."
  tags: []
"J19,17":
  text: "A on, niosąc swój krzyż, wyszedł na miejsce zwane Miejscem Czaszki, a po hebrajsku Golgotą;"
  tags: []
"J19,18":
  text: "Gdzie go ukrzyżowali, a z nim dwóch innych z obu stron, pośrodku zaś Jezusa."
  tags: []
"J19,19":
  text: "Sporządził też Piłat napis i umieścił na krzyżu. A było napisane: Jezus z Nazaretu, król Żydów."
  tags: []
"J19,20":
  text: "Napis ten czytało wielu Żydów, bo miejsce, gdzie ukrzyżowano Jezusa, było blisko miasta. A było to napisane po hebrajsku, po grecku i po łacinie."
  tags: []
"J19,21":
  text: "Wtedy naczelni kapłani żydowscy powiedzieli do Piłata: Nie pisz: Król Żydów, ale że on mówił: Jestem królem Żydów."
  tags: []
"J19,22":
  text: "Piłat odpowiedział: Co napisałem, to napisałem."
  tags: []
"J19,23":
  text: "A gdy żołnierze ukrzyżowali Jezusa, wzięli jego szaty i podzielili na cztery części, każdemu żołnierzowi część. Wzięli też tunikę, a tunika ta nie była szyta, ale od góry cała tkana."
  tags: []
"J19,24":
  text: "Mówili więc między sobą: Nie rozcinajmy jej, ale rzućmy losy o to, do kogo ma należeć; aby się wypełniło Pismo, które mówi: Podzielili między siebie moje szaty, a o moje ubranie rzucali losy. To właśnie zrobili żołnierze."
  tags: []
"J19,25":
  text: "A przy krzyżu Jezusa stały jego matka i siostra jego matki, Maria, żona Kleofasa, i Maria Magdalena."
  tags: []
"J19,26":
  text: "Gdy więc Jezus zobaczył matkę i ucznia, którego miłował, stojącego obok, powiedział do swojej matki: Kobieto, oto twój syn."
  tags: []
"J19,27":
  text: "Potem powiedział do ucznia: Oto twoja matka. I od tej godziny uczeń ten wziął ją do siebie."
  tags: []
"J19,28":
  text: "Potem Jezus, widząc, że już wszystko się wykonało, aby się wypełniło Pismo, powiedział: Pragnę."
  tags: []
"J19,29":
  text: "A stało tam naczynie pełne octu. Nasączono więc gąbkę octem, nałożono ją na hizop i podano mu do ust."
  tags: []
"J19,30":
  text: "A gdy Jezus skosztował octu, powiedział: Wykonało się. I schyliwszy głowę, oddał ducha."
  tags: []
"J19,31":
  text: "Wtedy Żydzi, aby ciała nie zostały na krzyżu na szabat, ponieważ był dzień przygotowania (bo ten dzień szabatu był wielkim dniem), prosili Piłata, aby połamano im golenie i zdjęto ich."
  tags: []
"J19,32":
  text: "Przyszli więc żołnierze i połamali golenie pierwszemu i drugiemu, który z nim był ukrzyżowany."
  tags: []
"J19,33":
  text: "Ale gdy przyszli do Jezusa i zobaczyli, że już umarł, nie łamali mu goleni;"
  tags: []
"J19,34":
  text: "Lecz jeden z żołnierzy przebił włócznią jego bok i natychmiast wypłynęła krew i woda."
  tags: []
"J19,35":
  text: "A ten, który to widział, świadczył o tym, a jego świadectwo jest prawdziwe i on wie, że mówi prawdę, abyście wy wierzyli."
  tags: []
"J19,36":
  text: "Stało się to bowiem, aby się wypełniło Pismo: Żadna jego kość nie będzie złamana."
  tags: []
"J19,37":
  text: "I znowu w innym miejscu Pismo mówi: Ujrzą tego, którego przebili."
  tags: []
"J19,38":
  text: "A potem Józef z Arymatei, który z obawy przed Żydami był potajemnie uczniem Jezusa, prosił Piłata, aby mógł zdjąć ciało Jezusa. A Piłat zezwolił. Poszedł więc i zdjął ciało Jezusa."
  tags: []
"J19,39":
  text: "Przyszedł też Nikodem, który przedtem przyszedł w nocy do Jezusa, niosąc około stu funtów mieszaniny mirry i aloesu."
  tags: []
"J19,40":
  text: "Wzięli więc ciało Jezusa i owinęli je w płótna z tymi wonnościami, zgodnie z żydowskim zwyczajem grzebania zmarłych."
  tags: []
"J19,41":
  text: "A na miejscu, gdzie był ukrzyżowany, był ogród, a w ogrodzie nowy grobowiec, w którym jeszcze nikt nie był złożony."
  tags: []
"J19,42":
  text: "Tam więc położyli Jezusa z powodu żydowskiego dnia przygotowania, bo grób był blisko."
  tags: []
