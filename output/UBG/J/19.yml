"J19,1": "Wtedy Piłat wziął Jezusa i ubiczował go."
"J19,2": "A żołnierze upletli koronę z cierni, włożyli mu ją na głowę i ubrali go w purpurowy płaszcz."
"J19,3": "I mówili: Witaj, królu Żydów! I policzkowali go."
"J19,4": "Piłat znowu wyszedł na zewnątrz i powiedział do nich: Oto wyprowadzam go do was na zewnątrz, abyście wiedzieli, że nie znajduję w nim żadnej winy."
"J19,5": "Wtedy Jezus wyszedł na zewnątrz w cierniowej koronie i w purpurowym płaszczu. I powiedział do nich Piłat: Oto człowiek!"
"J19,6": "A gdy naczelni kapłani i ich słudzy zobaczyli go, zawołali: Ukrzyżuj, ukrzyżuj go! Piłat powiedział do nich: Wy go weźcie i ukrzyżujcie, bo ja nie znajduję w nim żadnej winy."
"J19,7": "Żydzi mu odpowiedzieli: My mamy prawo i według naszego prawa powinien umrzeć, bo czynił siebie Synem Bożym."
"J19,8": "A gdy Piłat usłyszał te słowa, jeszcze bardziej się zląkł."
"J19,9": "I wszedł znowu do ratusza, i zapytał Jezusa: Skąd ty jesteś? Lecz Jezus nie dał mu odpowiedzi."
"J19,10": "Wtedy Piłat powiedział do niego: Nie chcesz ze mną rozmawiać? Nie wiesz, że mam władzę ukrzyżować cię i mam władzę cię wypuścić?"
"J19,11": "Jezus odpowiedział: Nie miałbyś żadnej władzy nade mną, gdyby ci jej nie dano z góry. Dlatego ten, który mnie tobie wydał, ma większy grzech."
"J19,12": "Odtąd Piłat starał się go wypuścić. Żydzi jednak wołali: Jeśli go wypuścisz, nie jesteś przyjacielem cesarza. Każdy, kto się czyni królem, sprzeciwia się cesarzowi."
"J19,13": "Gdy więc Piłat usłyszał te słowa, wyprowadził Jezusa na zewnątrz i usiadł na krześle sędziowskim, na miejscu zwanym Litostrotos, a po hebrajsku Gabbata."
"J19,14": "A był to dzień przygotowania Paschy, około godziny szóstej. I powiedział Piłat do Żydów: Oto wasz król!"
"J19,15": "Lecz oni zawołali: Strać, strać! Ukrzyżuj go! Piłat ich zapytał: Waszego króla mam ukrzyżować? Naczelni kapłani odpowiedzieli: Nie mamy króla poza cesarzem."
"J19,16": "Wtedy im go wydał, żeby go ukrzyżowano. Wzięli więc Jezusa i wyprowadzili go."
"J19,17": "A on, niosąc swój krzyż, wyszedł na miejsce zwane Miejscem Czaszki, a po hebrajsku Golgotą;"
"J19,18": "Gdzie go ukrzyżowali, a z nim dwóch innych z obu stron, pośrodku zaś Jezusa."
"J19,19": "Sporządził też Piłat napis i umieścił na krzyżu. A było napisane: Jezus z Nazaretu, król Żydów."
"J19,20": "Napis ten czytało wielu Żydów, bo miejsce, gdzie ukrzyżowano Jezusa, było blisko miasta. A było to napisane po hebrajsku, po grecku i po łacinie."
"J19,21": "Wtedy naczelni kapłani żydowscy powiedzieli do Piłata: Nie pisz: Król Żydów, ale że on mówił: Jestem królem Żydów."
"J19,22": "Piłat odpowiedział: Co napisałem, to napisałem."
"J19,23": "A gdy żołnierze ukrzyżowali Jezusa, wzięli jego szaty i podzielili na cztery części, każdemu żołnierzowi część. Wzięli też tunikę, a tunika ta nie była szyta, ale od góry cała tkana."
"J19,24": "Mówili więc między sobą: Nie rozcinajmy jej, ale rzućmy losy o to, do kogo ma należeć; aby się wypełniło Pismo, które mówi: Podzielili między siebie moje szaty, a o moje ubranie rzucali losy. To właśnie zrobili żołnierze."
"J19,25": "A przy krzyżu Jezusa stały jego matka i siostra jego matki, Maria, żona Kleofasa, i Maria Magdalena."
"J19,26": "Gdy więc Jezus zobaczył matkę i ucznia, którego miłował, stojącego obok, powiedział do swojej matki: Kobieto, oto twój syn."
"J19,27": "Potem powiedział do ucznia: Oto twoja matka. I od tej godziny uczeń ten wziął ją do siebie."
"J19,28": "Potem Jezus, widząc, że już wszystko się wykonało, aby się wypełniło Pismo, powiedział: Pragnę."
"J19,29": "A stało tam naczynie pełne octu. Nasączono więc gąbkę octem, nałożono ją na hizop i podano mu do ust."
"J19,30": "A gdy Jezus skosztował octu, powiedział: Wykonało się. I schyliwszy głowę, oddał ducha."
"J19,31": "Wtedy Żydzi, aby ciała nie zostały na krzyżu na szabat, ponieważ był dzień przygotowania (bo ten dzień szabatu był wielkim dniem), prosili Piłata, aby połamano im golenie i zdjęto ich."
"J19,32": "Przyszli więc żołnierze i połamali golenie pierwszemu i drugiemu, który z nim był ukrzyżowany."
"J19,33": "Ale gdy przyszli do Jezusa i zobaczyli, że już umarł, nie łamali mu goleni;"
"J19,34": "Lecz jeden z żołnierzy przebił włócznią jego bok i natychmiast wypłynęła krew i woda."
"J19,35": "A ten, który to widział, świadczył o tym, a jego świadectwo jest prawdziwe i on wie, że mówi prawdę, abyście wy wierzyli."
"J19,36": "Stało się to bowiem, aby się wypełniło Pismo: Żadna jego kość nie będzie złamana."
"J19,37": "I znowu w innym miejscu Pismo mówi: Ujrzą tego, którego przebili."
"J19,38": "A potem Józef z Arymatei, który z obawy przed Żydami był potajemnie uczniem Jezusa, prosił Piłata, aby mógł zdjąć ciało Jezusa. A Piłat zezwolił. Poszedł więc i zdjął ciało Jezusa."
"J19,39": "Przyszedł też Nikodem, który przedtem przyszedł w nocy do Jezusa, niosąc około stu funtów mieszaniny mirry i aloesu."
"J19,40": "Wzięli więc ciało Jezusa i owinęli je w płótna z tymi wonnościami, zgodnie z żydowskim zwyczajem grzebania zmarłych."
"J19,41": "A na miejscu, gdzie był ukrzyżowany, był ogród, a w ogrodzie nowy grobowiec, w którym jeszcze nikt nie był złożony."
"J19,42": "Tam więc położyli Jezusa z powodu żydowskiego dnia przygotowania, bo grób był blisko."
