"J13,1":
  text: "A przed świętem Paschy Jezus, wiedząc, że nadeszła jego godzina, aby przeszedł z tego świata do Ojca, umiłowawszy swoich, którzy byli na świecie, umiłował ich aż do końca."
  tags: []
"J13,2":
  text: "A gdy była wieczerza i diabeł już włożył w serce Judasza, syna Szymona Iskarioty, zamysł, aby go wydać;"
  tags: []
"J13,3":
  text: "Jezus, wiedząc, że Ojciec dał wszystko w jego ręce i że od Boga wyszedł, i do Boga idzie;"
  tags: []
"J13,4":
  text: "Wstał od wieczerzy i złożył szaty, a wziąwszy płócienny ręcznik, przepasał się."
  tags: []
"J13,5":
  text: "Potem nalał wody do miednicy i zaczął myć nogi uczniom, i wycierać ręcznikiem, którym był przepasany."
  tags: []
"J13,6":
  text: "I podszedł do Szymona Piotra, a on powiedział do niego: Panie, ty chcesz mi umyć nogi?"
  tags: []
"J13,7":
  text: "Jezus mu odpowiedział: Tego, co ja czynię, ty teraz nie rozumiesz, ale potem zrozumiesz."
  tags: []
"J13,8":
  text: "Piotr mu powiedział: Nigdy nie będziesz mył moich nóg. Jezus mu odpowiedział: Jeśli cię nie umyję, nie będziesz miał działu ze mną."
  tags: []
"J13,9":
  text: "Wtedy Szymon Piotr powiedział do niego: Panie, nie tylko moje nogi, ale i ręce, i głowę."
  tags: []
"J13,10":
  text: "Jezus mu odpowiedział: Kto jest umyty, potrzebuje umyć tylko nogi, bo cały jest czysty. I wy jesteście czyści, lecz nie wszyscy."
  tags: []
"J13,11":
  text: "Wiedział bowiem, kto ma go wydać, dlatego powiedział: Nie wszyscy jesteście czyści."
  tags: []
"J13,12":
  text: "Gdy więc umył im nogi i wziął swoje szaty, usiadłszy znowu za stołem, powiedział do nich: Czy rozumiecie, co wam uczyniłem?"
  tags: []
"J13,13":
  text: "Wy nazywacie mnie Nauczycielem i Panem i dobrze mówicie, bo nim jestem."
  tags: []
"J13,14":
  text: "Jeśli więc ja, Pan i Nauczyciel, umyłem wam nogi i wy powinniście sobie nawzajem myć nogi."
  tags: []
"J13,15":
  text: "Dałem wam bowiem przykład, abyście i wy czynili tak, jak ja wam uczyniłem."
  tags: []
"J13,16":
  text: "Zaprawdę, zaprawdę powiadam wam: Sługa nie jest większy od swego pana ani posłaniec nie jest większy od tego, który go posłał."
  tags: []
"J13,17":
  text: "Jeśli to wiecie, będziecie błogosławieni, gdy tak uczynicie."
  tags: []
"J13,18":
  text: "Nie mówię o was wszystkich. Ja wiem, których wybrałem, ale żeby się wypełniło Pismo: Ten, który je ze mną chleb, podniósł przeciwko mnie swoją piętę."
  tags: []
"J13,19":
  text: "Teraz wam mówię, zanim to się stanie, abyście, gdy to się stanie, uwierzyli, że ja jestem."
  tags: []
"J13,20":
  text: "Zaprawdę, zaprawdę powiadam wam: Kto przyjmuje tego, którego ja poślę, mnie przyjmuje, a kto mnie przyjmuje, przyjmuje tego, który mnie posłał."
  tags: []
"J13,21":
  text: "To powiedziawszy, Jezus wzruszył się w duchu i oświadczył: Zaprawdę, zaprawdę powiadam wam, że jeden z was mnie wyda."
  tags: []
"J13,22":
  text: "Wtedy uczniowie spojrzeli po sobie, niepewni, o kim to mówił."
  tags: []
"J13,23":
  text: "A jeden z jego uczniów, ten, którego Jezus miłował, położył się na piersi Jezusa."
  tags: []
"J13,24":
  text: "Skinął więc na niego Szymon Piotr, aby się wypytał, kto jest tym, o którym mówił."
  tags: []
"J13,25":
  text: "A on, położywszy się na piersi Jezusa, zapytał go: Panie, kto to jest?"
  tags: []
"J13,26":
  text: "Jezus odpowiedział: To ten, któremu podam umoczony kawałek chleba. A umoczywszy kawałek chleba, dał Judaszowi Iskariocie, synowi Szymona."
  tags: []
"J13,27":
  text: "A zaraz po tym kawałku chleba wszedł w niego szatan. Wtedy Jezus powiedział do niego: Co masz robić, rób szybko."
  tags: []
"J13,28":
  text: "Żaden jednak z obecnych przy stole nie zrozumiał, dlaczego mu to powiedział."
  tags: []
"J13,29":
  text: "A ponieważ Judasz miał sakiewkę, niektórzy sądzili, że Jezus mu powiedział: Nakup, czego nam potrzeba na święto, albo żeby coś dał ubogim."
  tags: []
"J13,30":
  text: "Wtedy on wziął ten kawałek chleba i natychmiast wyszedł. A była noc."
  tags: []
"J13,31":
  text: "A gdy wyszedł, Jezus powiedział: Teraz jest uwielbiony Syn Człowieczy i Bóg jest w nim uwielbiony."
  tags: []
"J13,32":
  text: "A jeśli Bóg jest w nim uwielbiony, to go też Bóg uwielbi sam w sobie, i to wkrótce go uwielbi."
  tags: []
"J13,33":
  text: "Dzieci, jeszcze krótko jestem z wami. Będziecie mnie szukać, ale jak powiedziałem Żydom: Gdzie ja idę, wy przyjść nie możecie – tak i wam teraz mówię."
  tags: []
"J13,34":
  text: "Daję wam nowe przykazanie, abyście się wzajemnie miłowali; tak jak ja was umiłowałem, abyście i wy wzajemnie się miłowali."
  tags: []
"J13,35":
  text: "Po tym wszyscy poznają, że jesteście moimi uczniami, jeśli będziecie się wzajemnie miłować."
  tags: []
"J13,36":
  text: "Zapytał go Szymon Piotr: Panie, dokąd idziesz? Jezus mu odpowiedział: Dokąd ja idę, ty teraz za mną iść nie możesz, ale potem pójdziesz."
  tags: []
"J13,37":
  text: "Wtedy Piotr powiedział mu: Panie, czemu teraz nie mogę iść za tobą? Moje życie oddam za ciebie."
  tags: []
"J13,38":
  text: "Jezus mu odpowiedział: Swoje życie za mnie oddasz? Zaprawdę, zaprawdę powiadam ci: Zanim kogut zapieje, trzy razy się mnie wyprzesz."
  tags: []
