"J13,1": "A przed świętem Paschy Jezus, wiedząc, że nadeszła jego godzina, aby przeszedł z tego świata do Ojca, umiłowawszy swoich, którzy byli na świecie, umiłował ich aż do końca."
"J13,2": "A gdy była wieczerza i diabeł już włożył w serce Judasza, syna Szymona Iskarioty, zamysł, aby go wydać;"
"J13,3": "Jezus, wiedząc, że Ojciec dał wszystko w jego ręce i że od Boga wyszedł, i do Boga idzie;"
"J13,4": "Wstał od wieczerzy i złożył szaty, a wziąwszy płócienny ręcznik, przepasał się."
"J13,5": "Potem nalał wody do miednicy i zaczął myć nogi uczniom, i wycierać ręcznikiem, którym był przepasany."
"J13,6": "I podszedł do Szymona Piotra, a on powiedział do niego: Panie, ty chcesz mi umyć nogi?"
"J13,7": "Jezus mu odpowiedział: Tego, co ja czynię, ty teraz nie rozumiesz, ale potem zrozumiesz."
"J13,8": "Piotr mu powiedział: Nigdy nie będziesz mył moich nóg. Jezus mu odpowiedział: Jeśli cię nie umyję, nie będziesz miał działu ze mną."
"J13,9": "Wtedy Szymon Piotr powiedział do niego: Panie, nie tylko moje nogi, ale i ręce, i głowę."
"J13,10": "Jezus mu odpowiedział: Kto jest umyty, potrzebuje umyć tylko nogi, bo cały jest czysty. I wy jesteście czyści, lecz nie wszyscy."
"J13,11": "Wiedział bowiem, kto ma go wydać, dlatego powiedział: Nie wszyscy jesteście czyści."
"J13,12": "Gdy więc umył im nogi i wziął swoje szaty, usiadłszy znowu za stołem, powiedział do nich: Czy rozumiecie, co wam uczyniłem?"
"J13,13": "Wy nazywacie mnie Nauczycielem i Panem i dobrze mówicie, bo nim jestem."
"J13,14": "Jeśli więc ja, Pan i Nauczyciel, umyłem wam nogi i wy powinniście sobie nawzajem myć nogi."
"J13,15": "Dałem wam bowiem przykład, abyście i wy czynili tak, jak ja wam uczyniłem."
"J13,16": "Zaprawdę, zaprawdę powiadam wam: Sługa nie jest większy od swego pana ani posłaniec nie jest większy od tego, który go posłał."
"J13,17": "Jeśli to wiecie, będziecie błogosławieni, gdy tak uczynicie."
"J13,18": "Nie mówię o was wszystkich. Ja wiem, których wybrałem, ale żeby się wypełniło Pismo: Ten, który je ze mną chleb, podniósł przeciwko mnie swoją piętę."
"J13,19": "Teraz wam mówię, zanim to się stanie, abyście, gdy to się stanie, uwierzyli, że ja jestem."
"J13,20": "Zaprawdę, zaprawdę powiadam wam: Kto przyjmuje tego, którego ja poślę, mnie przyjmuje, a kto mnie przyjmuje, przyjmuje tego, który mnie posłał."
"J13,21": "To powiedziawszy, Jezus wzruszył się w duchu i oświadczył: Zaprawdę, zaprawdę powiadam wam, że jeden z was mnie wyda."
"J13,22": "Wtedy uczniowie spojrzeli po sobie, niepewni, o kim to mówił."
"J13,23": "A jeden z jego uczniów, ten, którego Jezus miłował, położył się na piersi Jezusa."
"J13,24": "Skinął więc na niego Szymon Piotr, aby się wypytał, kto jest tym, o którym mówił."
"J13,25": "A on, położywszy się na piersi Jezusa, zapytał go: Panie, kto to jest?"
"J13,26": "Jezus odpowiedział: To ten, któremu podam umoczony kawałek chleba. A umoczywszy kawałek chleba, dał Judaszowi Iskariocie, synowi Szymona."
"J13,27": "A zaraz po tym kawałku chleba wszedł w niego szatan. Wtedy Jezus powiedział do niego: Co masz robić, rób szybko."
"J13,28": "Żaden jednak z obecnych przy stole nie zrozumiał, dlaczego mu to powiedział."
"J13,29": "A ponieważ Judasz miał sakiewkę, niektórzy sądzili, że Jezus mu powiedział: Nakup, czego nam potrzeba na święto, albo żeby coś dał ubogim."
"J13,30": "Wtedy on wziął ten kawałek chleba i natychmiast wyszedł. A była noc."
"J13,31": "A gdy wyszedł, Jezus powiedział: Teraz jest uwielbiony Syn Człowieczy i Bóg jest w nim uwielbiony."
"J13,32": "A jeśli Bóg jest w nim uwielbiony, to go też Bóg uwielbi sam w sobie, i to wkrótce go uwielbi."
"J13,33": "Dzieci, jeszcze krótko jestem z wami. Będziecie mnie szukać, ale jak powiedziałem Żydom: Gdzie ja idę, wy przyjść nie możecie – tak i wam teraz mówię."
"J13,34": "Daję wam nowe przykazanie, abyście się wzajemnie miłowali; tak jak ja was umiłowałem, abyście i wy wzajemnie się miłowali."
"J13,35": "Po tym wszyscy poznają, że jesteście moimi uczniami, jeśli będziecie się wzajemnie miłować."
"J13,36": "Zapytał go Szymon Piotr: Panie, dokąd idziesz? Jezus mu odpowiedział: Dokąd ja idę, ty teraz za mną iść nie możesz, ale potem pójdziesz."
"J13,37": "Wtedy Piotr powiedział mu: Panie, czemu teraz nie mogę iść za tobą? Moje życie oddam za ciebie."
"J13,38": "Jezus mu odpowiedział: Swoje życie za mnie oddasz? Zaprawdę, zaprawdę powiadam ci: Zanim kogut zapieje, trzy razy się mnie wyprzesz."
