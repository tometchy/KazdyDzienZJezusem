"J18,1": "To powiedziawszy, Jezus wyszedł ze swoimi uczniami za potok Cedron, gdzie był ogród, do którego wszedł on i jego uczniowie."
"J18,2": "A Judasz, który go zdradził, znał to miejsce, bo Jezus często się tam zbierał ze swoimi uczniami."
"J18,3": "Judasz więc, wziąwszy oddział żołnierzy i strażników od naczelnych kapłanów i faryzeuszy, przyszedł tam z latarniami, pochodniami i bronią."
"J18,4": "Wtedy Jezus, wiedząc o wszystkim, co miało na niego przyjść, wyszedł im naprzeciw i zapytał: Kogo szukacie?"
"J18,5": "Odpowiedzieli mu: Jezusa z Nazaretu. Jezus powiedział do nich: Ja jestem. A stał z nimi i Judasz, który go zdradził."
"J18,6": "Gdy tylko im powiedział: Ja jestem, cofnęli się i padli na ziemię."
"J18,7": "Wtedy ich znowu spytał: Kogo szukacie? A oni odpowiedzieli: Jezusa z Nazaretu."
"J18,8": "Jezus odpowiedział: Powiedziałem wam, że ja jestem. Jeśli więc mnie szukacie, pozwólcie tym odejść."
"J18,9": "Stało się tak, aby się wypełniły słowa, które powiedział: Nie straciłem żadnego z tych, których mi dałeś."
"J18,10": "Wówczas Szymon Piotr, mając miecz, dobył go, uderzył sługę najwyższego kapłana i odciął mu prawe ucho. A temu słudze było na imię Malchos."
"J18,11": "I powiedział Jezus do Piotra: Włóż swój miecz do pochwy. Czy nie mam pić kielicha, który mi dał Ojciec?"
"J18,12": "Wtedy oddział żołnierzy i dowódca oraz strażnicy żydowscy schwytali Jezusa, związali go;"
"J18,13": "I zaprowadzili go najpierw do Annasza, bo był teściem Kajfasza, który tego roku był najwyższym kapłanem."
"J18,14": "To Kajfasz był tym, który doradził Żydom, że pożyteczniej jest, aby jeden człowiek umarł za lud."
"J18,15": "A szedł za Jezusem Szymon Piotr i inny uczeń. Ten uczeń zaś był znany najwyższemu kapłanowi i wszedł z Jezusem na dziedziniec najwyższego kapłana."
"J18,16": "Ale Piotr stał na zewnątrz u drzwi. Wtedy wyszedł ten drugi uczeń, który był znany najwyższemu kapłanowi, pomówił z odźwierną i wprowadził Piotra."
"J18,17": "Wówczas dziewczyna odźwierna zapytała Piotra: Czy i ty nie jesteś jednym z uczniów tego człowieka? On odpowiedział: Nie jestem."
"J18,18": "A ponieważ było zimno, strażnicy i słudzy, rozpaliwszy ogień, stali i grzali się. Stał też z nimi Piotr i grzał się."
"J18,19": "Tymczasem najwyższy kapłan pytał Jezusa o jego uczniów i o jego naukę."
"J18,20": "Jezus mu odpowiedział: Ja jawnie mówiłem światu. Zawsze nauczałem w synagodze i w świątyni, gdzie zewsząd schodzą się Żydzi, a potajemnie nic nie mówiłem."
"J18,21": "Dlaczego mnie pytasz? Zapytaj tych, którzy słyszeli to, co im mówiłem. Oto oni wiedzą, co mówiłem."
"J18,22": "A gdy on to powiedział, jeden ze sług, który tam stał, wymierzył policzek Jezusowi, mówiąc: Tak odpowiadasz najwyższemu kapłanowi?"
"J18,23": "Jezus mu odpowiedział: Jeśli źle powiedziałem, daj świadectwo o złu, a jeśli dobrze, dlaczego mnie bijesz?"
"J18,24": "Bo Annasz odesłał go związanego do Kajfasza, najwyższego kapłana."
"J18,25": "A Szymon Piotr stał i grzał się. I zapytali go: Czy i ty nie jesteś jednym z jego uczniów? A on się wyparł, mówiąc: Nie jestem."
"J18,26": "Zapytał go jeden ze sług najwyższego kapłana, krewny tego, któremu Piotr odciął ucho: Czyż nie ciebie widziałem z nim w ogrodzie?"
"J18,27": "Wtedy Piotr znowu się wyparł. I zaraz zapiał kogut."
"J18,28": "Od Kajfasza więc zaprowadzili Jezusa do ratusza; a było rano. Sami jednak nie weszli do ratusza, aby się nie skalać, lecz żeby mogli spożyć Paschę."
"J18,29": "Wówczas Piłat wyszedł do nich i zapytał: Jaką skargę wnosicie przeciwko temu człowiekowi?"
"J18,30": "Odpowiedzieli mu: Gdyby on nie był złoczyńcą, nie wydalibyśmy go tobie."
"J18,31": "I powiedział Piłat: Wy go weźcie i osądźcie według waszego prawa. Żydzi mu odpowiedzieli: Nam nie wolno nikogo zabijać."
"J18,32": "Stało się tak, aby się wypełniły słowa, które powiedział Jezus, dając znać, jaką śmiercią miał umrzeć."
"J18,33": "Wtedy Piłat znowu wszedł do ratusza, wezwał Jezusa i zapytał go: Czy ty jesteś królem Żydów?"
"J18,34": "Jezus mu odpowiedział: Czy mówisz to sam od siebie, czy inni powiedzieli ci o mnie?"
"J18,35": "Piłat odpowiedział: Czy ja jestem Żydem? Twój naród i naczelni kapłani wydali mi ciebie. Cóż więc uczyniłeś?"
"J18,36": "Jezus odpowiedział: Moje królestwo nie jest z tego świata. Gdyby moje królestwo było z tego świata, to moi słudzy walczyliby, abym nie został wydany Żydom. Teraz jednak moje królestwo nie jest stąd."
"J18,37": "Wtedy Piłat zapytał go: A więc jesteś królem? Jezus mu odpowiedział: Ty mówisz, że jestem królem. Ja po to się narodziłem i po to przyszedłem na świat, aby dać świadectwo prawdzie. Każdy, kto jest z prawdy, słucha mego głosu."
"J18,38": "Piłat powiedział do niego: Cóż to jest prawda? A to powiedziawszy, wyszedł znowu do Żydów i powiedział do nich: Ja nie znajduję w nim żadnej winy."
"J18,39": "A u was jest zwyczaj, że na Paschę wypuszczam wam jednego więźnia. Chcecie więc, abym wam wypuścił króla Żydów?"
"J18,40": "Wówczas wszyscy znowu zawołali: Nie tego, ale Barabasza! A Barabasz był bandytą."
