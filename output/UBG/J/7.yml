"J7,1": "A potem Jezus chodził po Galilei. Nie chciał bowiem przebywać w Judei, bo Żydzi szukali sposobności, aby go zabić."
"J7,2": "I zbliżało się żydowskie Święto Namiotów."
"J7,3": "Wtedy jego bracia powiedzieli do niego: Odejdź stąd i idź do Judei, żeby twoi uczniowie widzieli dzieła, których dokonujesz."
"J7,4": "Nikt bowiem nie czyni nic w ukryciu, jeśli chce być znany. Dlatego ty, jeśli takie rzeczy czynisz, objaw się światu."
"J7,5": "Bo nawet jego bracia nie wierzyli w niego."
"J7,6": "I powiedział do nich Jezus: Mój czas jeszcze nie nadszedł, ale wasz czas zawsze jest w pogotowiu."
"J7,7": "Świat nie może was nienawidzić, ale mnie nienawidzi, bo ja świadczę o nim, że jego uczynki są złe."
"J7,8": "Wy idźcie na święto, ja jeszcze nie pójdę na to święto, bo mój czas jeszcze się nie wypełnił."
"J7,9": "Powiedziawszy im to, pozostał w Galilei."
"J7,10": "A gdy jego bracia poszli, wtedy i on poszedł na święto, nie jawnie, ale jakby potajemnie."
"J7,11": "A Żydzi szukali go podczas święta i mówili: Gdzie on jest?"
"J7,12": "I wiele szemrało się o nim wśród ludzi, bo jedni mówili: Jest dobry. A inni mówili: Przeciwnie, zwodzi ludzi."
"J7,13": "Nikt jednak nie mówił o nim jawnie z obawy przed Żydami."
"J7,14": "A gdy już minęła połowa święta, Jezus wszedł do świątyni i nauczał."
"J7,15": "I dziwili się Żydzi, mówiąc: Skąd on zna Pismo, skoro się nie uczył?"
"J7,16": "Odpowiedział im Jezus: Moja nauka nie jest moją, ale tego, który mnie posłał."
"J7,17": "Jeśli ktoś chce wypełniać jego wolę, ten będzie umiał rozeznać, czy ta nauka jest od Boga, czy ja mówię sam od siebie."
"J7,18": "Kto mówi z samego siebie, szuka własnej chwały. Kto zaś szuka chwały tego, który go posłał, ten jest prawdziwy i nie ma w nim niesprawiedliwości."
"J7,19": "Czy Mojżesz nie dał wam prawa? A żaden z was nie przestrzega prawa. Dlaczego chcecie mnie zabić?"
"J7,20": "Odpowiedzieli ludzie: Masz demona. Kto chce cię zabić?"
"J7,21": "Jezus im odpowiedział: Jeden uczynek spełniłem, a wszyscy się temu dziwicie."
"J7,22": "Przecież Mojżesz dał wam obrzezanie (nie jakoby było od Mojżesza, ale od ojców), a w szabat obrzezujecie człowieka."
"J7,23": "Jeśli człowiek przyjmuje obrzezanie w szabat, aby nie było złamane Prawo Mojżesza, to dlaczego gniewacie się na mnie, że w szabat całkowicie uzdrowiłem człowieka?"
"J7,24": "Nie sądźcie po pozorach, ale sądźcie sprawiedliwym sądem."
"J7,25": "Wtedy niektórzy z mieszkańców Jerozolimy mówili: Czy to nie jest ten, którego chcą zabić?"
"J7,26": "A oto jawnie przemawia i nic mu nie mówią. Czy przełożeni rzeczywiście poznali, że to jest prawdziwie Chrystus?"
"J7,27": "Ale wiemy, skąd on pochodzi, lecz gdy Chrystus przyjdzie, nikt nie będzie wiedział, skąd jest."
"J7,28": "Wtedy Jezus, nauczając w świątyni, wołał: I znacie mnie, i wiecie, skąd jestem. A ja nie przyszedłem sam od siebie, ale prawdziwy jest ten, który mnie posłał, którego wy nie znacie."
"J7,29": "Lecz ja go znam, bo od niego jestem i on mnie posłał."
"J7,30": "I usiłowali go schwytać, ale nikt nie podniósł na niego ręki, bo jeszcze nie nadeszła jego godzina."
"J7,31": "A wielu z ludu uwierzyło w niego i mówiło: Gdy Chrystus przyjdzie, czyż uczyni więcej cudów, niż on uczynił?"
"J7,32": "Faryzeusze słyszeli, że tak ludzie o nim szemrali. I faryzeusze i naczelni kapłani posłali sługi, aby go schwytać."
"J7,33": "Wtedy Jezus powiedział im: Jeszcze krótki czas jestem z wami, potem odejdę do tego, który mnie posłał."
"J7,34": "Będziecie mnie szukać, ale nie znajdziecie, a gdzie ja będę, wy przyjść nie możecie."
"J7,35": "Wówczas Żydzi mówili między sobą: Dokąd on pójdzie, że go nie znajdziemy? Czy pójdzie do rozproszonych wśród pogan i będzie nauczał pogan?"
"J7,36": "Cóż to za słowo, które wypowiedział: Będziecie mnie szukać, ale nie znajdziecie, a gdzie ja będę, wy przyjść nie możecie?"
"J7,37": "A w ostatnim, wielkim dniu tego święta, Jezus stanął i wołał: Jeśli ktoś pragnie, niech przyjdzie do mnie i pije."
"J7,38": "Kto wierzy we mnie, jak mówi Pismo, rzeki wody żywej popłyną z jego wnętrza."
"J7,39": "A to mówił o Duchu, którego mieli otrzymać wierzący w niego. Duch Święty bowiem jeszcze nie był dany, ponieważ Jezus nie został jeszcze uwielbiony."
"J7,40": "Wielu więc z tych ludzi, słysząc te słowa, mówiło: To jest prawdziwie ten prorok."
"J7,41": "A inni mówili: To jest Chrystus. Lecz niektórzy mówili: Czyż Chrystus przyjdzie z Galilei?"
"J7,42": "Czyż Pismo nie mówi, że Chrystus przyjdzie z potomstwa Dawida i z miasteczka Betlejem, gdzie mieszkał Dawid?"
"J7,43": "I tak z jego powodu nastąpił rozłam wśród ludu."
"J7,44": "I niektórzy z nich chcieli go schwytać, ale nikt nie podniósł na niego ręki."
"J7,45": "Wtedy słudzy wrócili do naczelnych kapłanów i do faryzeuszy, którzy ich zapytali: Dlaczego go nie przyprowadziliście?"
"J7,46": "Słudzy odpowiedzieli: Nikt nigdy nie mówił tak, jak ten człowiek."
"J7,47": "I odpowiedzieli im faryzeusze: Czy i wy jesteście zwiedzeni?"
"J7,48": "Czy ktoś z przełożonych albo z faryzeuszy uwierzył w niego?"
"J7,49": "A to pospólstwo, które nie zna prawa, jest przeklęte."
"J7,50": "Jeden z nich, Nikodem, ten, który przyszedł w nocy do niego, powiedział im:"
"J7,51": "Czy nasze prawo potępia człowieka, zanim go najpierw nie wysłucha i nie zbada, co czyni?"
"J7,52": "A oni mu odpowiedzieli: Czy i ty jesteś Galilejczykiem? Zbadaj i zobacz, że żaden prorok nie powstał z Galilei."
"J7,53": "I poszedł każdy do swego domu."
