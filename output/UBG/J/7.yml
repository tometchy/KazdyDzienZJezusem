"J7,1":
  text: "A potem Jezus chodził po Galilei. Nie chciał bowiem przebywać w Judei, bo Żydzi szukali sposobności, aby go zabić."
  tags: []
"J7,2":
  text: "I zbliżało się żydowskie Święto Namiotów."
  tags: []
"J7,3":
  text: "Wtedy jego bracia powiedzieli do niego: Odejdź stąd i idź do Judei, żeby twoi uczniowie widzieli dzieła, których dokonujesz."
  tags: []
"J7,4":
  text: "Nikt bowiem nie czyni nic w ukryciu, jeśli chce być znany. Dlatego ty, jeśli takie rzeczy czynisz, objaw się światu."
  tags: []
"J7,5":
  text: "Bo nawet jego bracia nie wierzyli w niego."
  tags: []
"J7,6":
  text: "I powiedział do nich Jezus: Mój czas jeszcze nie nadszedł, ale wasz czas zawsze jest w pogotowiu."
  tags: []
"J7,7":
  text: "Świat nie może was nienawidzić, ale mnie nienawidzi, bo ja świadczę o nim, że jego uczynki są złe."
  tags: []
"J7,8":
  text: "Wy idźcie na święto, ja jeszcze nie pójdę na to święto, bo mój czas jeszcze się nie wypełnił."
  tags: []
"J7,9":
  text: "Powiedziawszy im to, pozostał w Galilei."
  tags: []
"J7,10":
  text: "A gdy jego bracia poszli, wtedy i on poszedł na święto, nie jawnie, ale jakby potajemnie."
  tags: []
"J7,11":
  text: "A Żydzi szukali go podczas święta i mówili: Gdzie on jest?"
  tags: []
"J7,12":
  text: "I wiele szemrało się o nim wśród ludzi, bo jedni mówili: Jest dobry. A inni mówili: Przeciwnie, zwodzi ludzi."
  tags: []
"J7,13":
  text: "Nikt jednak nie mówił o nim jawnie z obawy przed Żydami."
  tags: []
"J7,14":
  text: "A gdy już minęła połowa święta, Jezus wszedł do świątyni i nauczał."
  tags: []
"J7,15":
  text: "I dziwili się Żydzi, mówiąc: Skąd on zna Pismo, skoro się nie uczył?"
  tags: []
"J7,16":
  text: "Odpowiedział im Jezus: Moja nauka nie jest moją, ale tego, który mnie posłał."
  tags: []
"J7,17":
  text: "Jeśli ktoś chce wypełniać jego wolę, ten będzie umiał rozeznać, czy ta nauka jest od Boga, czy ja mówię sam od siebie."
  tags: []
"J7,18":
  text: "Kto mówi z samego siebie, szuka własnej chwały. Kto zaś szuka chwały tego, który go posłał, ten jest prawdziwy i nie ma w nim niesprawiedliwości."
  tags: []
"J7,19":
  text: "Czy Mojżesz nie dał wam prawa? A żaden z was nie przestrzega prawa. Dlaczego chcecie mnie zabić?"
  tags: []
"J7,20":
  text: "Odpowiedzieli ludzie: Masz demona. Kto chce cię zabić?"
  tags: []
"J7,21":
  text: "Jezus im odpowiedział: Jeden uczynek spełniłem, a wszyscy się temu dziwicie."
  tags: []
"J7,22":
  text: "Przecież Mojżesz dał wam obrzezanie (nie jakoby było od Mojżesza, ale od ojców), a w szabat obrzezujecie człowieka."
  tags: []
"J7,23":
  text: "Jeśli człowiek przyjmuje obrzezanie w szabat, aby nie było złamane Prawo Mojżesza, to dlaczego gniewacie się na mnie, że w szabat całkowicie uzdrowiłem człowieka?"
  tags: []
"J7,24":
  text: "Nie sądźcie po pozorach, ale sądźcie sprawiedliwym sądem."
  tags: []
"J7,25":
  text: "Wtedy niektórzy z mieszkańców Jerozolimy mówili: Czy to nie jest ten, którego chcą zabić?"
  tags: []
"J7,26":
  text: "A oto jawnie przemawia i nic mu nie mówią. Czy przełożeni rzeczywiście poznali, że to jest prawdziwie Chrystus?"
  tags: []
"J7,27":
  text: "Ale wiemy, skąd on pochodzi, lecz gdy Chrystus przyjdzie, nikt nie będzie wiedział, skąd jest."
  tags: []
"J7,28":
  text: "Wtedy Jezus, nauczając w świątyni, wołał: I znacie mnie, i wiecie, skąd jestem. A ja nie przyszedłem sam od siebie, ale prawdziwy jest ten, który mnie posłał, którego wy nie znacie."
  tags: []
"J7,29":
  text: "Lecz ja go znam, bo od niego jestem i on mnie posłał."
  tags: []
"J7,30":
  text: "I usiłowali go schwytać, ale nikt nie podniósł na niego ręki, bo jeszcze nie nadeszła jego godzina."
  tags: []
"J7,31":
  text: "A wielu z ludu uwierzyło w niego i mówiło: Gdy Chrystus przyjdzie, czyż uczyni więcej cudów, niż on uczynił?"
  tags: []
"J7,32":
  text: "Faryzeusze słyszeli, że tak ludzie o nim szemrali. I faryzeusze i naczelni kapłani posłali sługi, aby go schwytać."
  tags: []
"J7,33":
  text: "Wtedy Jezus powiedział im: Jeszcze krótki czas jestem z wami, potem odejdę do tego, który mnie posłał."
  tags: []
"J7,34":
  text: "Będziecie mnie szukać, ale nie znajdziecie, a gdzie ja będę, wy przyjść nie możecie."
  tags: []
"J7,35":
  text: "Wówczas Żydzi mówili między sobą: Dokąd on pójdzie, że go nie znajdziemy? Czy pójdzie do rozproszonych wśród pogan i będzie nauczał pogan?"
  tags: []
"J7,36":
  text: "Cóż to za słowo, które wypowiedział: Będziecie mnie szukać, ale nie znajdziecie, a gdzie ja będę, wy przyjść nie możecie?"
  tags: []
"J7,37":
  text: "A w ostatnim, wielkim dniu tego święta, Jezus stanął i wołał: Jeśli ktoś pragnie, niech przyjdzie do mnie i pije."
  tags: []
"J7,38":
  text: "Kto wierzy we mnie, jak mówi Pismo, rzeki wody żywej popłyną z jego wnętrza."
  tags: []
"J7,39":
  text: "A to mówił o Duchu, którego mieli otrzymać wierzący w niego. Duch Święty bowiem jeszcze nie był dany, ponieważ Jezus nie został jeszcze uwielbiony."
  tags: []
"J7,40":
  text: "Wielu więc z tych ludzi, słysząc te słowa, mówiło: To jest prawdziwie ten prorok."
  tags: []
"J7,41":
  text: "A inni mówili: To jest Chrystus. Lecz niektórzy mówili: Czyż Chrystus przyjdzie z Galilei?"
  tags: []
"J7,42":
  text: "Czyż Pismo nie mówi, że Chrystus przyjdzie z potomstwa Dawida i z miasteczka Betlejem, gdzie mieszkał Dawid?"
  tags: []
"J7,43":
  text: "I tak z jego powodu nastąpił rozłam wśród ludu."
  tags: []
"J7,44":
  text: "I niektórzy z nich chcieli go schwytać, ale nikt nie podniósł na niego ręki."
  tags: []
"J7,45":
  text: "Wtedy słudzy wrócili do naczelnych kapłanów i do faryzeuszy, którzy ich zapytali: Dlaczego go nie przyprowadziliście?"
  tags: []
"J7,46":
  text: "Słudzy odpowiedzieli: Nikt nigdy nie mówił tak, jak ten człowiek."
  tags: []
"J7,47":
  text: "I odpowiedzieli im faryzeusze: Czy i wy jesteście zwiedzeni?"
  tags: []
"J7,48":
  text: "Czy ktoś z przełożonych albo z faryzeuszy uwierzył w niego?"
  tags: []
"J7,49":
  text: "A to pospólstwo, które nie zna prawa, jest przeklęte."
  tags: []
"J7,50":
  text: "Jeden z nich, Nikodem, ten, który przyszedł w nocy do niego, powiedział im:"
  tags: []
"J7,51":
  text: "Czy nasze prawo potępia człowieka, zanim go najpierw nie wysłucha i nie zbada, co czyni?"
  tags: []
"J7,52":
  text: "A oni mu odpowiedzieli: Czy i ty jesteś Galilejczykiem? Zbadaj i zobacz, że żaden prorok nie powstał z Galilei."
  tags: []
"J7,53":
  text: "I poszedł każdy do swego domu."
  tags: []
