"J4,1":
  text: "A gdy Pan poznał, że faryzeusze usłyszeli, iż Jezus więcej ludzi czynił uczniami i chrzcił niż Jan;"
  tags: []
"J4,2":
  text: "(Chociaż sam Jezus nie chrzcił, lecz jego uczniowie);"
  tags: []
"J4,3":
  text: "Opuścił Judeę i odszedł znowu do Galilei."
  tags: []
"J4,4":
  text: "A musiał iść przez Samarię."
  tags: []
"J4,5":
  text: "I przyszedł do miasta w Samarii, zwanego Sychar, blisko pola, które Jakub dał swemu synowi Józefowi."
  tags: []
"J4,6":
  text: "A była tam studnia Jakuba. Jezus więc, zmęczony drogą, usiadł sobie na studni. A było około godziny szóstej."
  tags: []
"J4,7":
  text: "I przyszła kobieta z Samarii, aby zaczerpnąć wody. Jezus powiedział do niej: Daj mi pić."
  tags: []
"J4,8":
  text: "Jego uczniowie bowiem poszli do miasta, aby nakupić żywności."
  tags: []
"J4,9":
  text: "Wtedy Samarytanka powiedziała do niego: Jakże ty, będąc Żydem, prosisz mnie, Samarytankę, o coś do picia? Gdyż Żydzi nie obcują z Samarytanami."
  tags: []
"J4,10":
  text: "Jezus jej odpowiedział: Gdybyś znała ten dar Boży i wiedziała, kim jest ten, który ci mówi: Daj mi pić, ty prosiłabyś go, a dałby ci wody żywej."
  tags: []
"J4,11":
  text: "I powiedziała do niego kobieta: Panie, nie masz czym naczerpać, a studnia jest głęboka. Skąd więc masz tę wodę żywą?"
  tags: []
"J4,12":
  text: "Czy ty jesteś większy niż nasz ojciec Jakub, który nam dał tę studnię i sam z niej pił, a także jego synowie i jego dobytek?"
  tags: []
"J4,13":
  text: "Odpowiedział jej Jezus: Każdy, kto pije tę wodę, znowu będzie pragnął."
  tags: []
"J4,14":
  text: "Lecz kto by pił wodę, którą ja mu dam, nigdy nie będzie pragnął, ale woda, którą ja mu dam, stanie się w nim źródłem wody wytryskującej ku życiu wiecznemu."
  tags: []
"J4,15":
  text: "Kobieta powiedziała do niego: Panie, daj mi tej wody, abym nie pragnęła i nie przychodziła tu czerpać."
  tags: []
"J4,16":
  text: "Jezus jej powiedział: Idź, zawołaj swego męża i przyjdź tu."
  tags: []
"J4,17":
  text: "Odpowiedziała kobieta: Nie mam męża. Jezus jej powiedział: Dobrze powiedziałaś: Nie mam męża."
  tags: []
"J4,18":
  text: "Miałaś bowiem pięciu mężów, a ten, którego masz teraz, nie jest twoim mężem. Prawdę powiedziałaś."
  tags: []
"J4,19":
  text: "Kobieta mu powiedziała: Panie, widzę, że jesteś prorokiem."
  tags: []
"J4,20":
  text: "Nasi ojcowie na tej górze czcili Boga, a wy mówicie, że w Jerozolimie jest miejsce, gdzie należy go czcić."
  tags: []
"J4,21":
  text: "Jezus powiedział do niej: Kobieto, wierz mi, że nadchodzi godzina, gdy ani na tej górze, ani w Jerozolimie nie będziecie czcić Ojca."
  tags: []
"J4,22":
  text: "Wy czcicie to, czego nie znacie, a my czcimy to, co znamy, ponieważ zbawienie pochodzi od Żydów."
  tags: []
"J4,23":
  text: "Ale nadchodzi godzina, i teraz jest, gdy prawdziwi czciciele będą czcić Ojca w duchu i w prawdzie. Bo i Ojciec szuka takich, którzy będą go czcić."
  tags: []
"J4,24":
  text: "Bóg jest duchem, więc ci, którzy go czczą, powinni go czcić w duchu i w prawdzie."
  tags: []
"J4,25":
  text: "Kobieta mu powiedziała: Wiem, że przyjdzie Mesjasz, zwany Chrystusem. Gdy on przyjdzie, oznajmi nam wszystko."
  tags: []
"J4,26":
  text: "Jezus jej powiedział: Ja, który mówię z tobą, jestem nim."
  tags: []
"J4,27":
  text: "A wtem przyszli jego uczniowie i dziwili się, że rozmawia z kobietą. Nikt jednak nie powiedział: O co się pytasz? albo: Dlaczego z nią rozmawiasz?"
  tags: []
"J4,28":
  text: "I zostawiła kobieta swoje wiadro, poszła do miasta i powiedziała ludziom:"
  tags: []
"J4,29":
  text: "Chodźcie, zobaczcie człowieka, który mi powiedział wszystko, co zrobiłam. Czy to nie jest Chrystus?"
  tags: []
"J4,30":
  text: "Wyszli więc z miasta i przyszli do niego."
  tags: []
"J4,31":
  text: "A tymczasem uczniowie prosili go: Mistrzu, jedz."
  tags: []
"J4,32":
  text: "A on im powiedział: Ja mam pokarm do jedzenia, o którym wy nie wiecie."
  tags: []
"J4,33":
  text: "Uczniowie więc mówili między sobą: Czy ktoś przyniósł mu jedzenie?"
  tags: []
"J4,34":
  text: "Jezus im powiedział: Moim pokarmem jest wypełniać wolę tego, który mnie posłał, i dokonać jego dzieła."
  tags: []
"J4,35":
  text: "Czyż nie mówicie, że jeszcze cztery miesiące, a przyjdzie żniwo? Oto mówię wam: Podnieście wasze oczy i przypatrzcie się polom, że już są białe, gotowe do żniwa."
  tags: []
"J4,36":
  text: "A kto żnie, otrzymuje zapłatę i zbiera owoc na życie wieczne, aby i ten, kto sieje, i ten, kto żnie, razem się radowali."
  tags: []
"J4,37":
  text: "W tym właśnie prawdziwe jest przysłowie: Kto inny sieje, a kto inny żnie."
  tags: []
"J4,38":
  text: "Ja was posłałem żąć to, nad czym nie pracowaliście. Inni pracowali, a wy weszliście w ich pracę."
  tags: []
"J4,39":
  text: "Wtedy wielu Samarytan z tego miasta uwierzyło w niego z powodu opowiadania tej kobiety, która świadczyła: Powiedział mi wszystko, co zrobiłam."
  tags: []
"J4,40":
  text: "Gdy więc Samarytanie przyszli do niego, prosili go, aby u nich został. I został tam przez dwa dni."
  tags: []
"J4,41":
  text: "I o wiele więcej ich uwierzyło z powodu jego słowa."
  tags: []
"J4,42":
  text: "A tej kobiecie mówili: Wierzymy już nie z powodu twojego opowiadania. Sami bowiem słyszeliśmy i wiemy, że to jest prawdziwie Zbawiciel świata, Chrystus."
  tags: []
"J4,43":
  text: "A po dwóch dniach odszedł stamtąd i poszedł do Galilei."
  tags: []
"J4,44":
  text: "Sam Jezus bowiem dał świadectwo, że prorok nie doznaje czci w swojej ojczyźnie."
  tags: []
"J4,45":
  text: "A gdy przyszedł do Galilei, Galilejczycy przyjęli go, widząc wszystko, co uczynił w Jerozolimie w święto. Oni bowiem też przyszli na święto."
  tags: []
"J4,46":
  text: "Wtedy Jezus znowu przyszedł do Kany Galilejskiej, gdzie przemienił wodę w wino. A był w Kafarnaum pewien dworzanin królewski, którego syn chorował."
  tags: []
"J4,47":
  text: "Ten, usłyszawszy, że Jezus przyszedł z Judei do Galilei, udał się do niego i prosił go, aby przyszedł i uzdrowił jego syna, gdyż był umierający."
  tags: []
"J4,48":
  text: "I powiedział do niego Jezus: Jeśli nie ujrzycie znaków i cudów, nie uwierzycie."
  tags: []
"J4,49":
  text: "Dworzanin królewski powiedział do niego: Panie, przyjdź, zanim umrze moje dziecko."
  tags: []
"J4,50":
  text: "Jezus mu powiedział: Idź, twój syn żyje. I uwierzył ten człowiek słowu, które powiedział mu Jezus, i poszedł."
  tags: []
"J4,51":
  text: "A gdy już szedł, jego słudzy wyszli mu naprzeciw i oznajmili: Twoje dziecko żyje."
  tags: []
"J4,52":
  text: "Wtedy zapytał ich o godzinę, w której poczuło się lepiej. I odpowiedzieli mu: Wczoraj o godzinie siódmej opuściła go gorączka."
  tags: []
"J4,53":
  text: "Wówczas ojciec poznał, że to była ta godzina, w której Jezus powiedział do niego: Twój syn żyje. I uwierzył on sam i cały jego dom."
  tags: []
"J4,54":
  text: "To był drugi cud, który Jezus uczynił, przyszedłszy z Judei do Galilei."
  tags: []
