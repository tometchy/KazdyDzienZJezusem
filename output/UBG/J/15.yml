"J15,1": "Ja jestem prawdziwą winoroślą, a mój Ojciec jest winogrodnikiem."
"J15,2": "Każdą latorośl, która we mnie nie wydaje owocu, odcina, a każdą, która wydaje owoc, oczyszcza, aby wydawała obfitszy owoc."
"J15,3": "Wy już jesteście czyści z powodu słów, które do was mówiłem."
"J15,4": "Trwajcie we mnie, a ja w was. Jak latorośl nie może wydawać owocu sama z siebie, jeśli nie będzie trwała w winorośli, tak i wy, jeśli nie będziecie trwać we mnie."
"J15,5": "Ja jestem winoroślą, a wy jesteście latoroślami. Kto trwa we mnie, a ja w nim, ten wydaje obfity owoc, bo beze mnie nic nie możecie zrobić."
"J15,6": "Jeśli ktoś nie trwa we mnie, zostanie wyrzucony precz jak latorośl i uschnie. Takie się zbiera i wrzuca do ognia, i płoną."
"J15,7": "Jeśli będziecie trwać we mnie i moje słowa będą trwać w was, proście, o cokolwiek chcecie, a spełni się wam."
"J15,8": "W tym będzie uwielbiony mój Ojciec, że wydacie obfity owoc; i będziecie moimi uczniami."
"J15,9": "Jak mnie umiłował Ojciec, tak i ja was umiłowałem. Trwajcie w mojej miłości."
"J15,10": "Jeśli zachowacie moje przykazania, będziecie trwać w mojej miłości, jak i ja zachowałem przykazania mego Ojca i trwam w jego miłości."
"J15,11": "To wam powiedziałem, aby moja radość trwała w was i aby wasza radość była pełna."
"J15,12": "To jest moje przykazanie, abyście się wzajemnie miłowali, jak i ja was umiłowałem."
"J15,13": "Nikt nie ma większej miłości od tej, gdy ktoś oddaje swoje życie za swoich przyjaciół."
"J15,14": "Wy jesteście moimi przyjaciółmi, jeśli robicie to, co wam przykazuję."
"J15,15": "Już więcej nie będę nazywał was sługami, bo sługa nie wie, co robi jego pan. Lecz nazwałem was przyjaciółmi, bo oznajmiłem wam wszystko, co słyszałem od mego Ojca."
"J15,16": "Nie wy mnie wybraliście, ale ja was wybrałem i przeznaczyłem, abyście wyszli i wydali owoc, i aby wasz owoc trwał, i aby Ojciec dał wam to, o cokolwiek poprosicie go w moje imię."
"J15,17": "To wam przykazuję, abyście się wzajemnie miłowali."
"J15,18": "Jeśli świat was nienawidzi, wiedzcie, że znienawidził mnie wcześniej niż was."
"J15,19": "Gdybyście byli ze świata, świat miłowałby to, co jest jego. Ponieważ jednak nie jesteście ze świata, ale ja was wybrałem ze świata, dlatego świat was nienawidzi."
"J15,20": "Przypomnijcie sobie słowo, które wam powiedziałem: Sługa nie jest większy od swego pana. Jeśli mnie prześladowali, to i was będą prześladować. Jeśli moje słowa zachowywali, to i wasze będą zachowywać."
"J15,21": "Ale będą wam to wszystko czynić z powodu mego imienia, bo nie znają tego, który mnie posłał."
"J15,22": "Gdybym nie przyszedł i nie mówił im, nie mieliby grzechu. Teraz jednak nie mają wytłumaczenia dla swego grzechu."
"J15,23": "Kto mnie nienawidzi, nienawidzi też mego Ojca."
"J15,24": "Gdybym nie spełniał wśród nich tych uczynków, których nikt inny nie spełniał, nie mieliby grzechu. Teraz jednak widzieli i nienawidzili i mnie, i mego Ojca."
"J15,25": "Ale to się stało, żeby się wypełniło słowo, które jest napisane w ich Prawie: Nienawidzili mnie bez powodu."
"J15,26": "Gdy jednak przyjdzie Pocieszyciel, którego ja wam poślę od Ojca, Duch prawdy, który wychodzi od Ojca, on będzie świadczył o mnie."
"J15,27": "Ale i wy będziecie świadczyć, bo jesteście ze mną od początku."
