"J15,1":
  text: "Ja jestem prawdziwą winoroślą, a mój Ojciec jest winogrodnikiem."
  tags: []
"J15,2":
  text: "Każdą latorośl, która we mnie nie wydaje owocu, odcina, a każdą, która wydaje owoc, oczyszcza, aby wydawała obfitszy owoc."
  tags: []
"J15,3":
  text: "Wy już jesteście czyści z powodu słów, które do was mówiłem."
  tags: []
"J15,4":
  text: "Trwajcie we mnie, a ja w was. Jak latorośl nie może wydawać owocu sama z siebie, jeśli nie będzie trwała w winorośli, tak i wy, jeśli nie będziecie trwać we mnie."
  tags: []
"J15,5":
  text: "Ja jestem winoroślą, a wy jesteście latoroślami. Kto trwa we mnie, a ja w nim, ten wydaje obfity owoc, bo beze mnie nic nie możecie zrobić."
  tags: []
"J15,6":
  text: "Jeśli ktoś nie trwa we mnie, zostanie wyrzucony precz jak latorośl i uschnie. Takie się zbiera i wrzuca do ognia, i płoną."
  tags: []
"J15,7":
  text: "Jeśli będziecie trwać we mnie i moje słowa będą trwać w was, proście, o cokolwiek chcecie, a spełni się wam."
  tags: []
"J15,8":
  text: "W tym będzie uwielbiony mój Ojciec, że wydacie obfity owoc; i będziecie moimi uczniami."
  tags: []
"J15,9":
  text: "Jak mnie umiłował Ojciec, tak i ja was umiłowałem. Trwajcie w mojej miłości."
  tags: []
"J15,10":
  text: "Jeśli zachowacie moje przykazania, będziecie trwać w mojej miłości, jak i ja zachowałem przykazania mego Ojca i trwam w jego miłości."
  tags: []
"J15,11":
  text: "To wam powiedziałem, aby moja radość trwała w was i aby wasza radość była pełna."
  tags: []
"J15,12":
  text: "To jest moje przykazanie, abyście się wzajemnie miłowali, jak i ja was umiłowałem."
  tags: []
"J15,13":
  text: "Nikt nie ma większej miłości od tej, gdy ktoś oddaje swoje życie za swoich przyjaciół."
  tags: []
"J15,14":
  text: "Wy jesteście moimi przyjaciółmi, jeśli robicie to, co wam przykazuję."
  tags: []
"J15,15":
  text: "Już więcej nie będę nazywał was sługami, bo sługa nie wie, co robi jego pan. Lecz nazwałem was przyjaciółmi, bo oznajmiłem wam wszystko, co słyszałem od mego Ojca."
  tags: []
"J15,16":
  text: "Nie wy mnie wybraliście, ale ja was wybrałem i przeznaczyłem, abyście wyszli i wydali owoc, i aby wasz owoc trwał, i aby Ojciec dał wam to, o cokolwiek poprosicie go w moje imię."
  tags: []
"J15,17":
  text: "To wam przykazuję, abyście się wzajemnie miłowali."
  tags: []
"J15,18":
  text: "Jeśli świat was nienawidzi, wiedzcie, że znienawidził mnie wcześniej niż was."
  tags: []
"J15,19":
  text: "Gdybyście byli ze świata, świat miłowałby to, co jest jego. Ponieważ jednak nie jesteście ze świata, ale ja was wybrałem ze świata, dlatego świat was nienawidzi."
  tags: []
"J15,20":
  text: "Przypomnijcie sobie słowo, które wam powiedziałem: Sługa nie jest większy od swego pana. Jeśli mnie prześladowali, to i was będą prześladować. Jeśli moje słowa zachowywali, to i wasze będą zachowywać."
  tags: []
"J15,21":
  text: "Ale będą wam to wszystko czynić z powodu mego imienia, bo nie znają tego, który mnie posłał."
  tags: []
"J15,22":
  text: "Gdybym nie przyszedł i nie mówił im, nie mieliby grzechu. Teraz jednak nie mają wytłumaczenia dla swego grzechu."
  tags: []
"J15,23":
  text: "Kto mnie nienawidzi, nienawidzi też mego Ojca."
  tags: []
"J15,24":
  text: "Gdybym nie spełniał wśród nich tych uczynków, których nikt inny nie spełniał, nie mieliby grzechu. Teraz jednak widzieli i nienawidzili i mnie, i mego Ojca."
  tags: []
"J15,25":
  text: "Ale to się stało, żeby się wypełniło słowo, które jest napisane w ich Prawie: Nienawidzili mnie bez powodu."
  tags: []
"J15,26":
  text: "Gdy jednak przyjdzie Pocieszyciel, którego ja wam poślę od Ojca, Duch prawdy, który wychodzi od Ojca, on będzie świadczył o mnie."
  tags: []
"J15,27":
  text: "Ale i wy będziecie świadczyć, bo jesteście ze mną od początku."
  tags: []
