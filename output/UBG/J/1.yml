"J1,1": "Na początku było Słowo, a Słowo było u Boga i Bogiem było Słowo."
"J1,2": "Ono było na początku u Boga."
"J1,3": "Wszystko przez nie się stało, a bez niego nic się nie stało, co się stało."
"J1,4": "W nim było życie, a życie było światłością ludzi."
"J1,5": "A ta światłość świeci w ciemności, ale ciemność jej nie ogarnęła."
"J1,6": "Był człowiek posłany od Boga, któremu na imię było Jan."
"J1,7": "Przyszedł on na świadectwo, aby świadczyć o tej światłości, by wszyscy przez niego uwierzyli."
"J1,8": "Nie był on tą światłością, ale przyszedł, aby świadczyć o tej światłości."
"J1,9": "Ten był tą prawdziwą światłością, która oświeca każdego człowieka przychodzącego na świat."
"J1,10": "Był na świecie, a świat został przez niego stworzony, ale świat go nie poznał."
"J1,11": "Do swej własności przyszedł, ale swoi go nie przyjęli."
"J1,12": "Lecz wszystkim tym, którzy go przyjęli, dał moc, aby się stali synami Bożymi, to jest tym, którzy wierzą w jego imię;"
"J1,13": "Którzy są narodzeni nie z krwi ani z woli ciała, ani z woli mężczyzny, ale z Boga."
"J1,14": "A to Słowo stało się ciałem i mieszkało wśród nas (i widzieliśmy jego chwałę, chwałę jako jednorodzonego od Ojca), pełne łaski i prawdy."
"J1,15": "Jan świadczył o nim i wołał: To był ten, o którym mówiłem: Ten, który po mnie przychodzi, uprzedził mnie, bo wcześniej był niż ja."
"J1,16": "A z jego pełni my wszyscy otrzymaliśmy i łaskę za łaskę."
"J1,17": "Prawo bowiem zostało dane przez Mojżesza, a łaska i prawda przyszły przez Jezusa Chrystusa."
"J1,18": "Boga nikt nigdy nie widział. Jednorodzony Syn, który jest w łonie Ojca, on nam o nim opowiedział."
"J1,19": "A takie jest świadectwo Jana, gdy Żydzi posłali z Jerozolimy kapłanów i lewitów, aby go zapytali: Kim ty jesteś?"
"J1,20": "I wyznał, a nie zaprzeczył, ale wyznał: Ja nie jestem Chrystusem."
"J1,21": "I pytali go: Kim więc jesteś? Jesteś Eliaszem? A on powiedział: Nie jestem. A oni: Jesteś tym prorokiem? I odpowiedział: Nie jestem."
"J1,22": "Wtedy go zapytali: Kim jesteś, abyśmy mogli dać odpowiedź tym, którzy nas posłali? Co mówisz sam o sobie?"
"J1,23": "Odpowiedział: Ja jestem głosem wołającego na pustyni: Prostujcie drogę Pana, jak powiedział prorok Izajasz."
"J1,24": "A ci, którzy byli posłani, byli z faryzeuszy."
"J1,25": "I zapytali go: Czemu więc chrzcisz, jeśli nie jesteś Chrystusem ani Eliaszem, ani tym prorokiem?"
"J1,26": "Odpowiedział im Jan: Ja chrzczę wodą, ale pośród was stoi ten, którego wy nie znacie."
"J1,27": "To jest ten, który przyszedłszy po mnie, uprzedził mnie, któremu ja nie jestem godny rozwiązać rzemyka u jego obuwia."
"J1,28": "Działo się to w Betabarze za Jordanem, gdzie Jan chrzcił."
"J1,29": "A nazajutrz Jan zobaczył Jezusa przychodzącego do niego i powiedział: Oto Baranek Boży, który gładzi grzech świata."
"J1,30": "To jest ten, o którym mówiłem, że idzie za mną człowiek, który mnie uprzedził, bo wcześniej był niż ja."
"J1,31": "Ja go nie znałem, ale przyszedłem, chrzcząc wodą, po to, aby został objawiony Izraelowi."
"J1,32": "I świadczył Jan: Widziałem Ducha zstępującego jak gołębica z nieba i spoczął na nim."
"J1,33": "A ja go nie znałem, ale ten, który mnie posłał, abym chrzcił wodą, powiedział do mnie: Na kogo ujrzysz Ducha zstępującego i spoczywającego na nim, to jest ten, który chrzci Duchem Świętym."
"J1,34": "Ja to widziałem i świadczyłem, że on jest Synem Bożym."
"J1,35": "Nazajutrz znowu stał tam Jan i dwóch z jego uczniów."
"J1,36": "A gdy zobaczył Jezusa przechodzącego, powiedział: Oto Baranek Boży."
"J1,37": "I słyszeli ci dwaj uczniowie, jak mówił, i poszli za Jezusem."
"J1,38": "A Jezus, odwróciwszy się i ujrzawszy, że idą za nim, zapytał ich: Czego szukacie? A oni mu odpowiedzieli: Rabbi – co się tłumaczy: Mistrzu – gdzie mieszkasz?"
"J1,39": "Powiedział im: Chodźcie i zobaczcie. Poszli więc i zobaczyli, gdzie mieszka. I zostali z nim tego dnia, bo było około godziny dziesiątej."
"J1,40": "A Andrzej, brat Szymona Piotra, był jednym z tych dwóch, którzy to usłyszeli od Jana i poszli za nim."
"J1,41": "On najpierw znalazł Szymona, swego brata, i powiedział do niego: Znaleźliśmy Mesjasza – co się tłumaczy: Chrystusa."
"J1,42": "I przyprowadził go do Jezusa. A Jezus spojrzał na niego i powiedział: Ty jesteś Szymon, syn Jonasza. Ty będziesz nazwany Kefas – co się tłumaczy: Piotr."
"J1,43": "A nazajutrz Jezus chciał pójść do Galilei. Znalazł Filipa i powiedział do niego: Pójdź za mną."
"J1,44": "A Filip był z Betsaidy, z miasta Andrzeja i Piotra."
"J1,45": "Filip znalazł Natanaela i powiedział do niego: Znaleźliśmy tego, o którym pisał Mojżesz w Prawie, a także prorocy – Jezusa z Nazaretu, syna Józefa."
"J1,46": "I zapytał go Natanael: Czyż z Nazaretu może być coś dobrego? Filip mu odpowiedział: Chodź i zobacz!"
"J1,47": "Gdy więc Jezus zobaczył Natanaela zbliżającego się do niego, powiedział o nim: Oto prawdziwie Izraelita, w którym nie ma podstępu."
"J1,48": "Natanael go zapytał: Skąd mnie znasz? Odpowiedział mu Jezus: Zanim Filip cię zawołał, gdy byłeś pod drzewem figowym, widziałem cię."
"J1,49": "Odpowiedział mu Natanael: Mistrzu, ty jesteś Synem Bożym, ty jesteś królem Izraela."
"J1,50": "Jezus mu odpowiedział: Czy wierzysz dlatego, że ci powiedziałem: Widziałem cię pod drzewem figowym? Ujrzysz większe rzeczy niż te."
"J1,51": "I powiedział do niego: Zaprawdę, zaprawdę powiadam wam: Odtąd ujrzycie niebo otwarte i aniołów Boga wstępujących i zstępujących na Syna Człowieczego."
