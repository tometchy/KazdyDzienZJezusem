"J1,1":
  text: "Na początku było Słowo, a Słowo było u Boga i Bogiem było Słowo."
  tags: []
"J1,2":
  text: "Ono było na początku u Boga."
  tags: []
"J1,3":
  text: "Wszystko przez nie się stało, a bez niego nic się nie stało, co się stało."
  tags: []
"J1,4":
  text: "W nim było życie, a życie było światłością ludzi."
  tags: []
"J1,5":
  text: "A ta światłość świeci w ciemności, ale ciemność jej nie ogarnęła."
  tags: []
"J1,6":
  text: "Był człowiek posłany od Boga, któremu na imię było Jan."
  tags: []
"J1,7":
  text: "Przyszedł on na świadectwo, aby świadczyć o tej światłości, by wszyscy przez niego uwierzyli."
  tags: []
"J1,8":
  text: "Nie był on tą światłością, ale przyszedł, aby świadczyć o tej światłości."
  tags: []
"J1,9":
  text: "Ten był tą prawdziwą światłością, która oświeca każdego człowieka przychodzącego na świat."
  tags: []
"J1,10":
  text: "Był na świecie, a świat został przez niego stworzony, ale świat go nie poznał."
  tags: []
"J1,11":
  text: "Do swej własności przyszedł, ale swoi go nie przyjęli."
  tags: []
"J1,12":
  text: "Lecz wszystkim tym, którzy go przyjęli, dał moc, aby się stali synami Bożymi, to jest tym, którzy wierzą w jego imię;"
  tags: []
"J1,13":
  text: "Którzy są narodzeni nie z krwi ani z woli ciała, ani z woli mężczyzny, ale z Boga."
  tags: []
"J1,14":
  text: "A to Słowo stało się ciałem i mieszkało wśród nas (i widzieliśmy jego chwałę, chwałę jako jednorodzonego od Ojca), pełne łaski i prawdy."
  tags: []
"J1,15":
  text: "Jan świadczył o nim i wołał: To był ten, o którym mówiłem: Ten, który po mnie przychodzi, uprzedził mnie, bo wcześniej był niż ja."
  tags: []
"J1,16":
  text: "A z jego pełni my wszyscy otrzymaliśmy i łaskę za łaskę."
  tags: []
"J1,17":
  text: "Prawo bowiem zostało dane przez Mojżesza, a łaska i prawda przyszły przez Jezusa Chrystusa."
  tags: []
"J1,18":
  text: "Boga nikt nigdy nie widział. Jednorodzony Syn, który jest w łonie Ojca, on nam o nim opowiedział."
  tags: []
"J1,19":
  text: "A takie jest świadectwo Jana, gdy Żydzi posłali z Jerozolimy kapłanów i lewitów, aby go zapytali: Kim ty jesteś?"
  tags: []
"J1,20":
  text: "I wyznał, a nie zaprzeczył, ale wyznał: Ja nie jestem Chrystusem."
  tags: []
"J1,21":
  text: "I pytali go: Kim więc jesteś? Jesteś Eliaszem? A on powiedział: Nie jestem. A oni: Jesteś tym prorokiem? I odpowiedział: Nie jestem."
  tags: []
"J1,22":
  text: "Wtedy go zapytali: Kim jesteś, abyśmy mogli dać odpowiedź tym, którzy nas posłali? Co mówisz sam o sobie?"
  tags: []
"J1,23":
  text: "Odpowiedział: Ja jestem głosem wołającego na pustyni: Prostujcie drogę Pana, jak powiedział prorok Izajasz."
  tags: []
"J1,24":
  text: "A ci, którzy byli posłani, byli z faryzeuszy."
  tags: []
"J1,25":
  text: "I zapytali go: Czemu więc chrzcisz, jeśli nie jesteś Chrystusem ani Eliaszem, ani tym prorokiem?"
  tags: []
"J1,26":
  text: "Odpowiedział im Jan: Ja chrzczę wodą, ale pośród was stoi ten, którego wy nie znacie."
  tags: []
"J1,27":
  text: "To jest ten, który przyszedłszy po mnie, uprzedził mnie, któremu ja nie jestem godny rozwiązać rzemyka u jego obuwia."
  tags: []
"J1,28":
  text: "Działo się to w Betabarze za Jordanem, gdzie Jan chrzcił."
  tags: []
"J1,29":
  text: "A nazajutrz Jan zobaczył Jezusa przychodzącego do niego i powiedział: Oto Baranek Boży, który gładzi grzech świata."
  tags: []
"J1,30":
  text: "To jest ten, o którym mówiłem, że idzie za mną człowiek, który mnie uprzedził, bo wcześniej był niż ja."
  tags: []
"J1,31":
  text: "Ja go nie znałem, ale przyszedłem, chrzcząc wodą, po to, aby został objawiony Izraelowi."
  tags: []
"J1,32":
  text: "I świadczył Jan: Widziałem Ducha zstępującego jak gołębica z nieba i spoczął na nim."
  tags: []
"J1,33":
  text: "A ja go nie znałem, ale ten, który mnie posłał, abym chrzcił wodą, powiedział do mnie: Na kogo ujrzysz Ducha zstępującego i spoczywającego na nim, to jest ten, który chrzci Duchem Świętym."
  tags: []
"J1,34":
  text: "Ja to widziałem i świadczyłem, że on jest Synem Bożym."
  tags: []
"J1,35":
  text: "Nazajutrz znowu stał tam Jan i dwóch z jego uczniów."
  tags: []
"J1,36":
  text: "A gdy zobaczył Jezusa przechodzącego, powiedział: Oto Baranek Boży."
  tags: []
"J1,37":
  text: "I słyszeli ci dwaj uczniowie, jak mówił, i poszli za Jezusem."
  tags: []
"J1,38":
  text: "A Jezus, odwróciwszy się i ujrzawszy, że idą za nim, zapytał ich: Czego szukacie? A oni mu odpowiedzieli: Rabbi – co się tłumaczy: Mistrzu – gdzie mieszkasz?"
  tags: []
"J1,39":
  text: "Powiedział im: Chodźcie i zobaczcie. Poszli więc i zobaczyli, gdzie mieszka. I zostali z nim tego dnia, bo było około godziny dziesiątej."
  tags: []
"J1,40":
  text: "A Andrzej, brat Szymona Piotra, był jednym z tych dwóch, którzy to usłyszeli od Jana i poszli za nim."
  tags: []
"J1,41":
  text: "On najpierw znalazł Szymona, swego brata, i powiedział do niego: Znaleźliśmy Mesjasza – co się tłumaczy: Chrystusa."
  tags: []
"J1,42":
  text: "I przyprowadził go do Jezusa. A Jezus spojrzał na niego i powiedział: Ty jesteś Szymon, syn Jonasza. Ty będziesz nazwany Kefas – co się tłumaczy: Piotr."
  tags: []
"J1,43":
  text: "A nazajutrz Jezus chciał pójść do Galilei. Znalazł Filipa i powiedział do niego: Pójdź za mną."
  tags: []
"J1,44":
  text: "A Filip był z Betsaidy, z miasta Andrzeja i Piotra."
  tags: []
"J1,45":
  text: "Filip znalazł Natanaela i powiedział do niego: Znaleźliśmy tego, o którym pisał Mojżesz w Prawie, a także prorocy – Jezusa z Nazaretu, syna Józefa."
  tags: []
"J1,46":
  text: "I zapytał go Natanael: Czyż z Nazaretu może być coś dobrego? Filip mu odpowiedział: Chodź i zobacz!"
  tags: []
"J1,47":
  text: "Gdy więc Jezus zobaczył Natanaela zbliżającego się do niego, powiedział o nim: Oto prawdziwie Izraelita, w którym nie ma podstępu."
  tags: []
"J1,48":
  text: "Natanael go zapytał: Skąd mnie znasz? Odpowiedział mu Jezus: Zanim Filip cię zawołał, gdy byłeś pod drzewem figowym, widziałem cię."
  tags: []
"J1,49":
  text: "Odpowiedział mu Natanael: Mistrzu, ty jesteś Synem Bożym, ty jesteś królem Izraela."
  tags: []
"J1,50":
  text: "Jezus mu odpowiedział: Czy wierzysz dlatego, że ci powiedziałem: Widziałem cię pod drzewem figowym? Ujrzysz większe rzeczy niż te."
  tags: []
"J1,51":
  text: "I powiedział do niego: Zaprawdę, zaprawdę powiadam wam: Odtąd ujrzycie niebo otwarte i aniołów Boga wstępujących i zstępujących na Syna Człowieczego."
  tags: []
