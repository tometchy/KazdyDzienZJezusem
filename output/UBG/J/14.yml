"J14,1":
  text: "Niech się nie trwoży wasze serce. Wierzycie w Boga, wierzcie i we mnie."
  tags: []
"J14,2":
  text: "W domu mego Ojca jest wiele mieszkań. Gdyby tak nie było, powiedziałbym wam. Idę, aby wam przygotować miejsce."
  tags: []
"J14,3":
  text: "A gdy odejdę i przygotuję wam miejsce, przyjdę znowu i wezmę was do siebie, żebyście, gdzie ja jestem, i wy byli."
  tags: []
"J14,4":
  text: "A dokąd ja idę, wiecie i drogę znacie."
  tags: []
"J14,5":
  text: "Powiedział do niego Tomasz: Panie, nie wiemy, dokąd idziesz, jakże więc możemy znać drogę?"
  tags: []
"J14,6":
  text: "Jezus mu odpowiedział: Ja jestem drogą, prawdą i życiem. Nikt nie przychodzi do Ojca jak tylko przeze mnie."
  tags: []
"J14,7":
  text: "Gdybyście mnie znali, znalibyście też mego Ojca. I już teraz go znacie, i widzieliście go."
  tags: []
"J14,8":
  text: "Powiedział do niego Filip: Panie, pokaż nam Ojca, a to nam wystarczy."
  tags: []
"J14,9":
  text: "Jezus mu odpowiedział: Tak długo jestem z wami, a nie poznałeś mnie, Filipie? Kto mnie widzi, widzi i mego Ojca. Jak możesz mówić: Pokaż nam Ojca?"
  tags: []
"J14,10":
  text: "Nie wierzysz, że ja jestem w Ojcu, a Ojciec we mnie? Słów, które ja do was mówię, nie mówię od samego siebie, lecz Ojciec, który mieszka we mnie, on dokonuje dzieł."
  tags: []
"J14,11":
  text: "Wierzcie mi, że ja jestem w Ojcu, a Ojciec we mnie. Przynajmniej z powodu samych dzieł wierzcie mi."
  tags: []
"J14,12":
  text: "Zaprawdę, zaprawdę powiadam wam: Kto wierzy we mnie, dzieł, których ja dokonuję, i on będzie dokonywał, i większych od tych dokona, bo ja odchodzę do mego Ojca."
  tags: []
"J14,13":
  text: "A o cokolwiek będziecie prosić w moje imię, to uczynię, aby Ojciec był uwielbiony w Synu."
  tags: []
"J14,14":
  text: "Jeśli o coś będziecie prosić w moje imię, ja to uczynię."
  tags: []
"J14,15":
  text: "Jeśli mnie miłujecie, zachowujcie moje przykazania."
  tags: []
"J14,16":
  text: "A ja będę prosił Ojca i da wam innego Pocieszyciela, aby z wami był na wieki;"
  tags: []
"J14,17":
  text: "Ducha prawdy, którego świat nie może przyjąć, bo go nie widzi ani go nie zna. Wy jednak go znacie, gdyż z wami przebywa i w was będzie."
  tags: []
"J14,18":
  text: "Nie zostawię was sierotami, przyjdę do was."
  tags: []
"J14,19":
  text: "Jeszcze krótki czas, a świat nie będzie mnie już więcej oglądał, lecz wy będziecie mnie oglądać. Ponieważ ja żyję, wy też będziecie żyć."
  tags: []
"J14,20":
  text: "W tym dniu poznacie, że ja jestem w moim Ojcu, a wy we mnie i ja w was."
  tags: []
"J14,21":
  text: "Kto ma moje przykazania i zachowuje je, ten mnie miłuje. A kto mnie miłuje, będzie go też miłował mój Ojciec i ja go będę miłował, i objawię mu samego siebie."
  tags: []
"J14,22":
  text: "Powiedział mu Judasz, ale nie Iskariota: Panie, cóż to jest, że masz się objawić nam, a nie światu?"
  tags: []
"J14,23":
  text: "Jezus mu odpowiedział: Jeśli ktoś mnie miłuje, będzie zachowywał moje słowo. I mój Ojciec go umiłuje, i przyjdziemy do niego, i u niego zamieszkamy."
  tags: []
"J14,24":
  text: "Kto mnie nie miłuje, nie zachowuje moich słów. A słowo, które słyszycie, nie jest moje, ale tego, który mnie posłał, Ojca."
  tags: []
"J14,25":
  text: "To wam powiedziałem, przebywając z wami."
  tags: []
"J14,26":
  text: "Lecz Pocieszyciel, Duch Święty, którego Ojciec pośle w moim imieniu, on nauczy was wszystkiego i przypomni wam wszystko, co wam powiedziałem."
  tags: []
"J14,27":
  text: "Pokój zostawiam wam, mój pokój daję wam; daję wam nie tak, jak daje świat. Niech się nie trwoży wasze serce ani się nie lęka."
  tags: []
"J14,28":
  text: "Słyszeliście, że wam powiedziałem: Odchodzę i znowu przyjdę do was. Gdybyście mnie miłowali, radowalibyście się, ponieważ powiedziałem: Idę do Ojca. Mój Ojciec bowiem jest większy niż ja."
  tags: []
"J14,29":
  text: "I teraz wam powiedziałem, zanim to się stanie, żebyście uwierzyli, gdy to się stanie."
  tags: []
"J14,30":
  text: "Już nie będę z wami wiele mówił, nadchodzi bowiem władca tego świata, a on we mnie nic nie ma."
  tags: []
"J14,31":
  text: "Ale żeby świat poznał, że miłuję Ojca i jak Ojciec mi nakazał, tak czynię. Wstańcie, chodźmy stąd."
  tags: []
