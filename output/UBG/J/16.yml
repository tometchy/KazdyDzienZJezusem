"J16,1":
  text: "To wam powiedziałem, abyście się nie gorszyli."
  tags: []
"J16,2":
  text: "Będą was wyłączać z synagog; owszem, nadchodzi godzina, że każdy, kto was zabije, będzie sądził, że pełni służbę dla Boga."
  tags: []
"J16,3":
  text: "A uczynią wam tak, bo nie poznali Ojca ani mnie."
  tags: []
"J16,4":
  text: "Ale powiedziałem wam to, abyście, gdy nadejdzie ta godzina, przypomnieli sobie, że ja wam to powiedziałem. A nie mówiłem wam tego na początku, bo byłem z wami."
  tags: []
"J16,5":
  text: "Lecz teraz idę do tego, który mnie posłał, a żaden z was nie pyta mnie: Dokąd idziesz?"
  tags: []
"J16,6":
  text: "Ale ponieważ wam to powiedziałem, smutek napełnił wasze serce."
  tags: []
"J16,7":
  text: "Lecz ja mówię wam prawdę: Pożyteczniej jest dla was, abym odszedł. Jeśli bowiem nie odejdę, Pocieszyciel do was nie przyjdzie, a jeśli odejdę, poślę go do was."
  tags: []
"J16,8":
  text: "A gdy on przyjdzie, będzie przekonywał świat o grzechu, o sprawiedliwości i o sądzie."
  tags: []
"J16,9":
  text: "O grzechu, mówię, bo nie uwierzyli we mnie."
  tags: []
"J16,10":
  text: "O sprawiedliwości, bo idę do mego Ojca i już więcej mnie nie zobaczycie."
  tags: []
"J16,11":
  text: "A o sądzie, bo władca tego świata już jest osądzony."
  tags: []
"J16,12":
  text: "Mam wam jeszcze wiele do powiedzenia, ale teraz nie możecie tego znieść."
  tags: []
"J16,13":
  text: "Lecz gdy przyjdzie on, Duch prawdy, wprowadzi was we wszelką prawdę. Nie będzie bowiem mówił sam od siebie, ale będzie mówił to, co usłyszy, i oznajmi wam przyszłe rzeczy."
  tags: []
"J16,14":
  text: "On mnie uwielbi, bo weźmie z mojego i wam oznajmi."
  tags: []
"J16,15":
  text: "Wszystko, co ma Ojciec, jest moje. Dlatego powiedziałem, że weźmie z mojego i wam oznajmi."
  tags: []
"J16,16":
  text: "Jeszcze krótki czas, a nie zobaczycie mnie, i znowu krótki czas, a zobaczycie mnie, bo ja idę do Ojca."
  tags: []
"J16,17":
  text: "Wtedy niektórzy z jego uczniów mówili między sobą: Cóż znaczy to, co nam mówi: Jeszcze krótki czas, a nie zobaczycie mnie, i znowu krótki czas, a zobaczycie mnie? oraz: Ja idę do Ojca?"
  tags: []
"J16,18":
  text: "Dlatego mówili: Cóż znaczy to, co mówi: Krótki czas? Nie rozumiemy, co mówi."
  tags: []
"J16,19":
  text: "Wówczas Jezus poznał, że chcieli go pytać i powiedział do nich: Pytacie się między sobą o to, co powiedziałem: Jeszcze krótki czas, a nie zobaczycie mnie, i znowu krótki czas, a zobaczycie mnie?"
  tags: []
"J16,20":
  text: "Zaprawdę, zaprawdę powiadam wam: Wy będziecie płakać i zawodzić, a świat będzie się radował. Będziecie smutni, ale wasz smutek zamieni się w radość."
  tags: []
"J16,21":
  text: "Kobieta, gdy rodzi, smuci się, bo nadeszła jej godzina. Gdy jednak urodzi dziecko, już nie pamięta cierpienia z powodu radości, że człowiek przyszedł na świat."
  tags: []
"J16,22":
  text: "I wy teraz się smucicie, ale znowu was zobaczę i wasze serce będzie się radowało, a nikt nie odbierze wam waszej radości."
  tags: []
"J16,23":
  text: "A tego dnia nie będziecie mnie o nic pytać. Zaprawdę, zaprawdę powiadam wam: O cokolwiek poprosicie Ojca w moje imię, da wam."
  tags: []
"J16,24":
  text: "Dotąd o nic nie prosiliście w moje imię. Proście, a otrzymacie, aby wasza radość była pełna."
  tags: []
"J16,25":
  text: "Mówiłem wam o tym w przypowieściach. Ale nadchodzi godzina, gdy już więcej nie będę mówił wam w przypowieściach, ale otwarcie oznajmię wam o moim Ojcu."
  tags: []
"J16,26":
  text: "W tym dniu będziecie prosić w moje imię. Nie mówię wam, że ja będę prosił Ojca za wami."
  tags: []
"J16,27":
  text: "Sam bowiem Ojciec was miłuje, bo wy mnie umiłowaliście i uwierzyliście, że ja wyszedłem od Boga."
  tags: []
"J16,28":
  text: "Wyszedłem od Ojca i przyszedłem na świat. Znowu opuszczam świat i idę do Ojca."
  tags: []
"J16,29":
  text: "Jego uczniowie mu powiedzieli: Oto teraz mówisz otwarcie i nie opowiadasz żadnej przypowieści."
  tags: []
"J16,30":
  text: "Teraz wiemy, że wszystko wiesz i nie potrzebujesz, aby cię ktoś pytał. Dlatego wierzymy, że wyszedłeś od Boga."
  tags: []
"J16,31":
  text: "Jezus im odpowiedział: Teraz wierzycie?"
  tags: []
"J16,32":
  text: "Oto nadchodzi godzina, a nawet już nadeszła, że rozproszycie się każdy w swoją stronę, a mnie zostawicie samego. Ale nie jestem sam, bo Ojciec jest ze mną."
  tags: []
"J16,33":
  text: "To wam powiedziałem, abyście mieli pokój we mnie. Na świecie będziecie mieć ucisk, ale ufajcie, ja zwyciężyłem świat."
  tags: []
