"J21,1":
  text: "Potem Jezus znowu ukazał się uczniom nad Morzem Tyberiadzkim. A ukazał się tak:"
  tags: []
"J21,2":
  text: "Byli razem Szymon Piotr, Tomasz, zwany Didymos, Natanael, który był z Kany Galilejskiej, synowie Zebedeusza i dwaj inni z jego uczniów."
  tags: []
"J21,3":
  text: "Szymon Piotr powiedział do nich: Pójdę łowić ryby. Odpowiedzieli mu: Pójdziemy i my z tobą. Poszli więc i zaraz wsiedli do łodzi, ale tej nocy nic nie złowili."
  tags: []
"J21,4":
  text: "A gdy już nastał ranek, Jezus stanął na brzegu. Uczniowie jednak nie wiedzieli, że to Jezus."
  tags: []
"J21,5":
  text: "Wtedy Jezus zapytał ich: Dzieci, czy macie co jeść? Odpowiedzieli mu: Nie mamy."
  tags: []
"J21,6":
  text: "A on powiedział do nich: Zarzućcie sieć po prawej stronie łodzi, a znajdziecie. Zarzucili więc i nie mogli jej wyciągnąć z powodu mnóstwa ryb."
  tags: []
"J21,7":
  text: "Wówczas ten uczeń, którego Jezus miłował, powiedział do Piotra: To Pan. A Szymon Piotr, usłyszawszy, że to Pan, przepasał się koszulą (bo był nagi) i rzucił się w morze."
  tags: []
"J21,8":
  text: "Pozostali uczniowie przypłynęli łodzią (bo byli niedaleko od brzegu, około dwustu łokci), ciągnąc sieć z rybami."
  tags: []
"J21,9":
  text: "A gdy wyszli na brzeg, zobaczyli żarzące się węgle i leżącą na nich rybę oraz chleb."
  tags: []
"J21,10":
  text: "Jezus do nich powiedział: Przynieście z tych ryb, które teraz złowiliście."
  tags: []
"J21,11":
  text: "Poszedł więc Szymon Piotr i wyciągnął na ziemię sieć pełną wielkich ryb, których było sto pięćdziesiąt trzy, a choć było ich tak wiele, sieć się nie rozdarła."
  tags: []
"J21,12":
  text: "Jezus im powiedział: Chodźcie, jedzcie. I żaden z uczniów nie śmiał go pytać: Kim jesteś? Wiedzieli bowiem, że to Pan."
  tags: []
"J21,13":
  text: "Wtedy Jezus podszedł, wziął chleb i podał im, podobnie i rybę."
  tags: []
"J21,14":
  text: "To już trzeci raz, jak Jezus ukazał się swoim uczniom po zmartwychwstaniu."
  tags: []
"J21,15":
  text: "A gdy zjedli, Jezus zapytał Szymona Piotra: Szymonie, synu Jonasza, miłujesz mnie bardziej niż ci? Odpowiedział mu: Tak, Panie, ty wiesz, że cię miłuję. Powiedział do niego: Paś moje baranki."
  tags: []
"J21,16":
  text: "Zapytał go znowu, po raz drugi: Szymonie, synu Jonasza, miłujesz mnie? Odpowiedział mu: Tak, Panie, ty wiesz, że cię miłuję. Powiedział mu: Paś moje owce."
  tags: []
"J21,17":
  text: "Zapytał go po raz trzeci: Szymonie, synu Jonasza, miłujesz mnie? I zasmucił się Piotr, że go zapytał po raz trzeci: Miłujesz mnie? I odpowiedział mu: Panie, ty wszystko wiesz, ty wiesz, że cię miłuję. Jezus powiedział do niego: Paś moje owce."
  tags: []
"J21,18":
  text: "Zaprawdę, zaprawdę powiadam ci: Gdy byłeś młodszy, opasywałeś się i chodziłeś, gdzie chciałeś. Gdy jednak się zestarzejesz, wyciągniesz swoje ręce, a inny cię opasze i poprowadzi, dokąd nie chcesz."
  tags: []
"J21,19":
  text: "Powiedział to, dając znać, jaką śmiercią miał uwielbić Boga. A to powiedziawszy, rzekł mu: Pójdź za mną."
  tags: []
"J21,20":
  text: "A Piotr, odwróciwszy się, zobaczył ucznia, którego Jezus miłował, idącego za nim, który też przy wieczerzy położył się na jego piersi i zapytał: Panie, kto jest tym, który cię wyda?"
  tags: []
"J21,21":
  text: "Gdy więc Piotr go zobaczył, zapytał Jezusa: Panie, a co z nim?"
  tags: []
"J21,22":
  text: "Jezus mu odpowiedział: Jeśli chcę, żeby on został, aż przyjdę, co tobie do tego? Ty pójdź za mną."
  tags: []
"J21,23":
  text: "I rozeszła się wśród braci wieść, że ten uczeń nie umrze. Jezus jednak nie powiedział mu, że nie umrze, ale: Jeśli chcę, aby został, aż przyjdę, co tobie do tego?"
  tags: []
"J21,24":
  text: "To jest ten uczeń, który świadczy o tym i to napisał, a wiemy, że jego świadectwo jest prawdziwe."
  tags: []
"J21,25":
  text: "Jest też jeszcze wiele innych rzeczy, których dokonał Jezus, które gdyby miały być wszystkie z osobna spisane, sądzę, że i cały świat nie mógłby pomieścić ksiąg, które byłyby napisane. Amen."
  tags: []
