"J21,1": "Potem Jezus znowu ukazał się uczniom nad Morzem Tyberiadzkim. A ukazał się tak:"
"J21,2": "Byli razem Szymon Piotr, Tomasz, zwany Didymos, Natanael, który był z Kany Galilejskiej, synowie Zebedeusza i dwaj inni z jego uczniów."
"J21,3": "Szymon Piotr powiedział do nich: Pójdę łowić ryby. Odpowiedzieli mu: Pójdziemy i my z tobą. Poszli więc i zaraz wsiedli do łodzi, ale tej nocy nic nie złowili."
"J21,4": "A gdy już nastał ranek, Jezus stanął na brzegu. Uczniowie jednak nie wiedzieli, że to Jezus."
"J21,5": "Wtedy Jezus zapytał ich: Dzieci, czy macie co jeść? Odpowiedzieli mu: Nie mamy."
"J21,6": "A on powiedział do nich: Zarzućcie sieć po prawej stronie łodzi, a znajdziecie. Zarzucili więc i nie mogli jej wyciągnąć z powodu mnóstwa ryb."
"J21,7": "Wówczas ten uczeń, którego Jezus miłował, powiedział do Piotra: To Pan. A Szymon Piotr, usłyszawszy, że to Pan, przepasał się koszulą (bo był nagi) i rzucił się w morze."
"J21,8": "Pozostali uczniowie przypłynęli łodzią (bo byli niedaleko od brzegu, około dwustu łokci), ciągnąc sieć z rybami."
"J21,9": "A gdy wyszli na brzeg, zobaczyli żarzące się węgle i leżącą na nich rybę oraz chleb."
"J21,10": "Jezus do nich powiedział: Przynieście z tych ryb, które teraz złowiliście."
"J21,11": "Poszedł więc Szymon Piotr i wyciągnął na ziemię sieć pełną wielkich ryb, których było sto pięćdziesiąt trzy, a choć było ich tak wiele, sieć się nie rozdarła."
"J21,12": "Jezus im powiedział: Chodźcie, jedzcie. I żaden z uczniów nie śmiał go pytać: Kim jesteś? Wiedzieli bowiem, że to Pan."
"J21,13": "Wtedy Jezus podszedł, wziął chleb i podał im, podobnie i rybę."
"J21,14": "To już trzeci raz, jak Jezus ukazał się swoim uczniom po zmartwychwstaniu."
"J21,15": "A gdy zjedli, Jezus zapytał Szymona Piotra: Szymonie, synu Jonasza, miłujesz mnie bardziej niż ci? Odpowiedział mu: Tak, Panie, ty wiesz, że cię miłuję. Powiedział do niego: Paś moje baranki."
"J21,16": "Zapytał go znowu, po raz drugi: Szymonie, synu Jonasza, miłujesz mnie? Odpowiedział mu: Tak, Panie, ty wiesz, że cię miłuję. Powiedział mu: Paś moje owce."
"J21,17": "Zapytał go po raz trzeci: Szymonie, synu Jonasza, miłujesz mnie? I zasmucił się Piotr, że go zapytał po raz trzeci: Miłujesz mnie? I odpowiedział mu: Panie, ty wszystko wiesz, ty wiesz, że cię miłuję. Jezus powiedział do niego: Paś moje owce."
"J21,18": "Zaprawdę, zaprawdę powiadam ci: Gdy byłeś młodszy, opasywałeś się i chodziłeś, gdzie chciałeś. Gdy jednak się zestarzejesz, wyciągniesz swoje ręce, a inny cię opasze i poprowadzi, dokąd nie chcesz."
"J21,19": "Powiedział to, dając znać, jaką śmiercią miał uwielbić Boga. A to powiedziawszy, rzekł mu: Pójdź za mną."
"J21,20": "A Piotr, odwróciwszy się, zobaczył ucznia, którego Jezus miłował, idącego za nim, który też przy wieczerzy położył się na jego piersi i zapytał: Panie, kto jest tym, który cię wyda?"
"J21,21": "Gdy więc Piotr go zobaczył, zapytał Jezusa: Panie, a co z nim?"
"J21,22": "Jezus mu odpowiedział: Jeśli chcę, żeby on został, aż przyjdę, co tobie do tego? Ty pójdź za mną."
"J21,23": "I rozeszła się wśród braci wieść, że ten uczeń nie umrze. Jezus jednak nie powiedział mu, że nie umrze, ale: Jeśli chcę, aby został, aż przyjdę, co tobie do tego?"
"J21,24": "To jest ten uczeń, który świadczy o tym i to napisał, a wiemy, że jego świadectwo jest prawdziwe."
"J21,25": "Jest też jeszcze wiele innych rzeczy, których dokonał Jezus, które gdyby miały być wszystkie z osobna spisane, sądzę, że i cały świat nie mógłby pomieścić ksiąg, które byłyby napisane. Amen."
