"J5,1":
  text: "Potem było święto żydowskie i Jezus udał się do Jerozolimy."
  tags: []
"J5,2":
  text: "A jest w Jerozolimie przy Owczej Bramie sadzawka, zwana po hebrajsku Betesda, mająca pięć ganków."
  tags: []
"J5,3":
  text: "Leżało w nich mnóstwo niedołężnych, ślepych, chromych i wychudłych, którzy czekali na poruszenie wody."
  tags: []
"J5,4":
  text: "Anioł bowiem co pewien czas zstępował do sadzawki i poruszał wodę. A kto pierwszy wszedł po poruszeniu wody, stawał się zdrowym, jakąkolwiek chorobą był dotknięty."
  tags: []
"J5,5":
  text: "A był tam pewien człowiek, który przez trzydzieści osiem lat był złożony chorobą."
  tags: []
"J5,6":
  text: "Gdy Jezus zobaczył go leżącego i poznał, że już długi czas choruje, zapytał: Chcesz być zdrowy?"
  tags: []
"J5,7":
  text: "Chory mu odpowiedział: Panie, nie mam człowieka, który wniósłby mnie do sadzawki, gdy woda zostaje poruszona. Lecz gdy ja idę, inny wchodzi przede mną."
  tags: []
"J5,8":
  text: "Jezus mu powiedział: Wstań, weź swoje posłanie i chodź."
  tags: []
"J5,9":
  text: "I natychmiast człowiek ten odzyskał zdrowie, wziął swoje posłanie i chodził. A tego dnia był szabat."
  tags: []
"J5,10":
  text: "Wtedy Żydzi powiedzieli do uzdrowionego: Jest szabat, nie wolno ci nosić posłania."
  tags: []
"J5,11":
  text: "Odpowiedział im: Ten, który mnie uzdrowił, powiedział do mnie: Weź swoje posłanie i chodź."
  tags: []
"J5,12":
  text: "I pytali go: Który człowiek ci powiedział: Weź swoje posłanie i chodź?"
  tags: []
"J5,13":
  text: "A uzdrowiony nie wiedział, kto to był, bo Jezus odszedł, ponieważ mnóstwo ludzi było na tym miejscu."
  tags: []
"J5,14":
  text: "Potem Jezus znalazł go w świątyni i powiedział do niego: Oto wyzdrowiałeś. Nie grzesz więcej, aby nie przydarzyło ci się coś gorszego."
  tags: []
"J5,15":
  text: "Wtedy człowiek ten odszedł i powiedział Żydom, że to Jezus go uzdrowił."
  tags: []
"J5,16":
  text: "I dlatego Żydzi prześladowali Jezusa i szukali sposobności, aby go zabić, bo uczynił to w szabat."
  tags: []
"J5,17":
  text: "A Jezus im odpowiedział: Mój Ojciec działa aż dotąd i ja działam."
  tags: []
"J5,18":
  text: "Dlatego Żydzi tym bardziej usiłowali go zabić, bo nie tylko łamał szabat, ale mówił, że Bóg jest jego Ojcem, czyniąc się równym Bogu."
  tags: []
"J5,19":
  text: "Wtedy Jezus im odpowiedział: Zaprawdę, zaprawdę powiadam wam: Syn nie może nic czynić sam od siebie, tylko to, co widzi, że czyni Ojciec. Co bowiem on czyni, to i Syn czyni tak samo."
  tags: []
"J5,20":
  text: "Bo Ojciec miłuje Syna i ukazuje mu wszystko, co sam czyni. I pokaże mu większe dzieła niż te, abyście się dziwili."
  tags: []
"J5,21":
  text: "Jak bowiem Ojciec wskrzesza umarłych i ożywia, tak i Syn ożywia tych, których chce."
  tags: []
"J5,22":
  text: "Bo Ojciec nikogo nie sądzi, lecz cały sąd dał Synowi;"
  tags: []
"J5,23":
  text: "Aby wszyscy czcili Syna, jak czczą Ojca. Kto nie czci Syna, nie czci i Ojca, który go posłał."
  tags: []
"J5,24":
  text: "Zaprawdę, zaprawdę powiadam wam: Kto słucha mego słowa i wierzy temu, który mnie posłał, ma życie wieczne i nie będzie potępiony, ale przeszedł ze śmierci do życia."
  tags: []
"J5,25":
  text: "Zaprawdę, zaprawdę powiadam wam: Nadchodzi godzina, i teraz jest, gdy umarli usłyszą głos Syna Bożego, a ci, którzy usłyszą, będą żyć."
  tags: []
"J5,26":
  text: "Jak bowiem Ojciec ma życie sam w sobie, tak dał i Synowi, aby miał życie w samym sobie."
  tags: []
"J5,27":
  text: "I dał mu władzę wykonywania sądu, bo jest Synem Człowieczym."
  tags: []
"J5,28":
  text: "Nie dziwcie się temu, bo nadchodzi godzina, w której wszyscy, którzy są w grobach, usłyszą jego głos;"
  tags: []
"J5,29":
  text: "I ci, którzy dobrze czynili, wyjdą na zmartwychwstanie do życia, ale ci, którzy źle czynili, na zmartwychwstanie na potępienie."
  tags: []
"J5,30":
  text: "Ja sam od siebie nie mogę nic czynić. Jak słyszę, tak sądzę, a mój sąd jest sprawiedliwy, bo nie szukam swojej woli, ale woli tego, który mnie posłał, Ojca."
  tags: []
"J5,31":
  text: "Jeśli ja świadczę sam o sobie, moje świadectwo nie jest prawdziwe."
  tags: []
"J5,32":
  text: "Jest ktoś inny, kto świadczy o mnie, i wiem, że świadectwo, które daje o mnie, jest prawdziwe."
  tags: []
"J5,33":
  text: "Wy posłaliście do Jana, a on dał świadectwo prawdzie."
  tags: []
"J5,34":
  text: "Lecz ja nie przyjmuję świadectwa od człowieka, ale to mówię, abyście byli zbawieni."
  tags: []
"J5,35":
  text: "On był płonącą i świecącą lampą, a wy chcieliście do czasu radować się w jego światłości."
  tags: []
"J5,36":
  text: "Ale ja mam świadectwo większe niż Jana. Dzieła bowiem, które Ojciec dał mi do wykonania, te właśnie dzieła, które czynię, świadczą o mnie, że Ojciec mnie posłał."
  tags: []
"J5,37":
  text: "A Ojciec, który mnie posłał, on świadczył o mnie. Nigdy nie słyszeliście jego głosu ani nie widzieliście jego postaci."
  tags: []
"J5,38":
  text: "I nie macie jego słowa trwającego w was, bo temu, którego on posłał, nie wierzycie."
  tags: []
"J5,39":
  text: "Badajcie Pisma; sądzicie bowiem, że w nich macie życie wieczne, a one dają świadectwo o mnie."
  tags: []
"J5,40":
  text: "A jednak nie chcecie przyjść do mnie, aby mieć życie."
  tags: []
"J5,41":
  text: "Nie przyjmuję chwały od ludzi."
  tags: []
"J5,42":
  text: "Ale poznałem was, że nie macie w sobie miłości Boga."
  tags: []
"J5,43":
  text: "Przyszedłem w imieniu mego Ojca, a nie przyjmujecie mnie. Jeśli ktoś inny przyjdzie we własnym imieniu, tego przyjmiecie."
  tags: []
"J5,44":
  text: "Jakże możecie wierzyć, skoro przyjmujecie chwałę jedni od drugich, a nie szukacie chwały, która jest od samego Boga?"
  tags: []
"J5,45":
  text: "Nie sądźcie, że ja was będę oskarżał przed Ojcem. Jest ktoś, kto was oskarża, Mojżesz, w którym wy pokładacie nadzieję."
  tags: []
"J5,46":
  text: "Bo gdybyście wierzyli Mojżeszowi, wierzylibyście i mnie, gdyż on pisał o mnie."
  tags: []
"J5,47":
  text: "Jeśli jednak nie wierzycie jego pismom, jakże uwierzycie moim słowom?"
  tags: []
