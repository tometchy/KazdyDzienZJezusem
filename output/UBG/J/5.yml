"J5,1": "Potem było święto żydowskie i Jezus udał się do Jerozolimy."
"J5,2": "A jest w Jerozolimie przy Owczej Bramie sadzawka, zwana po hebrajsku Betesda, mająca pięć ganków."
"J5,3": "Leżało w nich mnóstwo niedołężnych, ślepych, chromych i wychudłych, którzy czekali na poruszenie wody."
"J5,4": "Anioł bowiem co pewien czas zstępował do sadzawki i poruszał wodę. A kto pierwszy wszedł po poruszeniu wody, stawał się zdrowym, jakąkolwiek chorobą był dotknięty."
"J5,5": "A był tam pewien człowiek, który przez trzydzieści osiem lat był złożony chorobą."
"J5,6": "Gdy Jezus zobaczył go leżącego i poznał, że już długi czas choruje, zapytał: Chcesz być zdrowy?"
"J5,7": "Chory mu odpowiedział: Panie, nie mam człowieka, który wniósłby mnie do sadzawki, gdy woda zostaje poruszona. Lecz gdy ja idę, inny wchodzi przede mną."
"J5,8": "Jezus mu powiedział: Wstań, weź swoje posłanie i chodź."
"J5,9": "I natychmiast człowiek ten odzyskał zdrowie, wziął swoje posłanie i chodził. A tego dnia był szabat."
"J5,10": "Wtedy Żydzi powiedzieli do uzdrowionego: Jest szabat, nie wolno ci nosić posłania."
"J5,11": "Odpowiedział im: Ten, który mnie uzdrowił, powiedział do mnie: Weź swoje posłanie i chodź."
"J5,12": "I pytali go: Który człowiek ci powiedział: Weź swoje posłanie i chodź?"
"J5,13": "A uzdrowiony nie wiedział, kto to był, bo Jezus odszedł, ponieważ mnóstwo ludzi było na tym miejscu."
"J5,14": "Potem Jezus znalazł go w świątyni i powiedział do niego: Oto wyzdrowiałeś. Nie grzesz więcej, aby nie przydarzyło ci się coś gorszego."
"J5,15": "Wtedy człowiek ten odszedł i powiedział Żydom, że to Jezus go uzdrowił."
"J5,16": "I dlatego Żydzi prześladowali Jezusa i szukali sposobności, aby go zabić, bo uczynił to w szabat."
"J5,17": "A Jezus im odpowiedział: Mój Ojciec działa aż dotąd i ja działam."
"J5,18": "Dlatego Żydzi tym bardziej usiłowali go zabić, bo nie tylko łamał szabat, ale mówił, że Bóg jest jego Ojcem, czyniąc się równym Bogu."
"J5,19": "Wtedy Jezus im odpowiedział: Zaprawdę, zaprawdę powiadam wam: Syn nie może nic czynić sam od siebie, tylko to, co widzi, że czyni Ojciec. Co bowiem on czyni, to i Syn czyni tak samo."
"J5,20": "Bo Ojciec miłuje Syna i ukazuje mu wszystko, co sam czyni. I pokaże mu większe dzieła niż te, abyście się dziwili."
"J5,21": "Jak bowiem Ojciec wskrzesza umarłych i ożywia, tak i Syn ożywia tych, których chce."
"J5,22": "Bo Ojciec nikogo nie sądzi, lecz cały sąd dał Synowi;"
"J5,23": "Aby wszyscy czcili Syna, jak czczą Ojca. Kto nie czci Syna, nie czci i Ojca, który go posłał."
"J5,24": "Zaprawdę, zaprawdę powiadam wam: Kto słucha mego słowa i wierzy temu, który mnie posłał, ma życie wieczne i nie będzie potępiony, ale przeszedł ze śmierci do życia."
"J5,25": "Zaprawdę, zaprawdę powiadam wam: Nadchodzi godzina, i teraz jest, gdy umarli usłyszą głos Syna Bożego, a ci, którzy usłyszą, będą żyć."
"J5,26": "Jak bowiem Ojciec ma życie sam w sobie, tak dał i Synowi, aby miał życie w samym sobie."
"J5,27": "I dał mu władzę wykonywania sądu, bo jest Synem Człowieczym."
"J5,28": "Nie dziwcie się temu, bo nadchodzi godzina, w której wszyscy, którzy są w grobach, usłyszą jego głos;"
"J5,29": "I ci, którzy dobrze czynili, wyjdą na zmartwychwstanie do życia, ale ci, którzy źle czynili, na zmartwychwstanie na potępienie."
"J5,30": "Ja sam od siebie nie mogę nic czynić. Jak słyszę, tak sądzę, a mój sąd jest sprawiedliwy, bo nie szukam swojej woli, ale woli tego, który mnie posłał, Ojca."
"J5,31": "Jeśli ja świadczę sam o sobie, moje świadectwo nie jest prawdziwe."
"J5,32": "Jest ktoś inny, kto świadczy o mnie, i wiem, że świadectwo, które daje o mnie, jest prawdziwe."
"J5,33": "Wy posłaliście do Jana, a on dał świadectwo prawdzie."
"J5,34": "Lecz ja nie przyjmuję świadectwa od człowieka, ale to mówię, abyście byli zbawieni."
"J5,35": "On był płonącą i świecącą lampą, a wy chcieliście do czasu radować się w jego światłości."
"J5,36": "Ale ja mam świadectwo większe niż Jana. Dzieła bowiem, które Ojciec dał mi do wykonania, te właśnie dzieła, które czynię, świadczą o mnie, że Ojciec mnie posłał."
"J5,37": "A Ojciec, który mnie posłał, on świadczył o mnie. Nigdy nie słyszeliście jego głosu ani nie widzieliście jego postaci."
"J5,38": "I nie macie jego słowa trwającego w was, bo temu, którego on posłał, nie wierzycie."
"J5,39": "Badajcie Pisma; sądzicie bowiem, że w nich macie życie wieczne, a one dają świadectwo o mnie."
"J5,40": "A jednak nie chcecie przyjść do mnie, aby mieć życie."
"J5,41": "Nie przyjmuję chwały od ludzi."
"J5,42": "Ale poznałem was, że nie macie w sobie miłości Boga."
"J5,43": "Przyszedłem w imieniu mego Ojca, a nie przyjmujecie mnie. Jeśli ktoś inny przyjdzie we własnym imieniu, tego przyjmiecie."
"J5,44": "Jakże możecie wierzyć, skoro przyjmujecie chwałę jedni od drugich, a nie szukacie chwały, która jest od samego Boga?"
"J5,45": "Nie sądźcie, że ja was będę oskarżał przed Ojcem. Jest ktoś, kto was oskarża, Mojżesz, w którym wy pokładacie nadzieję."
"J5,46": "Bo gdybyście wierzyli Mojżeszowi, wierzylibyście i mnie, gdyż on pisał o mnie."
"J5,47": "Jeśli jednak nie wierzycie jego pismom, jakże uwierzycie moim słowom?"
