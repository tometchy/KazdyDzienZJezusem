"J12,1": "Na sześć dni przed Paschą Jezus przyszedł do Betanii, gdzie był Łazarz, który umarł, a którego wskrzesił z martwych."
"J12,2": "Tam przygotowali mu wieczerzę, a Marta usługiwała. Łazarz zaś był jednym z tych, którzy razem z nim siedzieli przy stole."
"J12,3": "Wówczas Maria, wziąwszy funt bardzo drogiej maści nardowej, namaściła nogi Jezusa i wytarła je swoimi włosami, a dom napełnił się wonią tej maści."
"J12,4": "Wtedy jeden z jego uczniów, Judasz Iskariota, syn Szymona, ten, który miał go zdradzić, powiedział:"
"J12,5": "Dlaczego tej maści nie sprzedano za trzysta groszy i nie rozdano ich ubogim?"
"J12,6": "A to mówił nie dlatego, że troszczył się o ubogich, ale ponieważ był złodziejem i miał sakiewkę, a nosił to, co do niej włożono."
"J12,7": "Wtedy Jezus powiedział: Zostaw ją; zachowała to na dzień mego pogrzebu."
"J12,8": "Ubogich bowiem zawsze macie u siebie, ale mnie nie zawsze będziecie mieć."
"J12,9": "Wtedy wielu Żydów dowiedziało się, że tam jest; i przyszli nie tylko z powodu Jezusa, ale także, by zobaczyć Łazarza, którego wskrzesił z martwych."
"J12,10": "I naradzali się naczelni kapłani nad tym, żeby zabić również Łazarza;"
"J12,11": "Gdyż z jego powodu wielu spośród Żydów odstąpiło i uwierzyło w Jezusa."
"J12,12": "Nazajutrz mnóstwo ludzi, którzy przyszli na święto, usłyszawszy, że Jezus idzie do Jerozolimy;"
"J12,13": "Nabrało gałązek palmowych, wyszło mu naprzeciw i wołało: Hosanna! Błogosławiony, który przychodzi w imieniu Pana, król Izraela!"
"J12,14": "A Jezus, znalazłszy oślątko, wsiadł na nie, jak jest napisane:"
"J12,15": "Nie bój się, córko Syjonu. Oto twój król przychodzi, siedząc na oślątku."
"J12,16": "Z początku jego uczniowie tego nie zrozumieli, ale gdy Jezus został uwielbiony, wtedy przypomnieli sobie, że to było o nim napisane i że mu tak uczynili."
"J12,17": "Dawali więc świadectwo ludzie, którzy z nim byli, gdy Łazarza wywołał z grobowca i wskrzesił go z martwych."
"J12,18": "Dlatego też ludzie wyszli mu naprzeciw, bo usłyszeli, że on uczynił ten cud."
"J12,19": "Wtedy faryzeusze mówili między sobą: Widzicie, że nic nie zdziałacie. Oto świat poszedł za nim."
"J12,20": "A wśród tych, którzy przychodzili do Jerozolimy, żeby oddać cześć Bogu w święto, byli pewni Grecy."
"J12,21": "Oni to przyszli do Filipa, który był z Betsaidy w Galilei, i prosili go: Panie, chcemy zobaczyć Jezusa."
"J12,22": "Filip przyszedł i powiedział Andrzejowi, a z kolei Andrzej i Filip powiedzieli Jezusowi."
"J12,23": "A Jezus im odpowiedział: Nadeszła godzina, aby Syn Człowieczy został uwielbiony."
"J12,24": "Zaprawdę, zaprawdę powiadam wam: Jeśli ziarno pszenicy, wpadłszy w ziemię, nie obumrze, samo zostaje. Jeśli jednak obumrze, wydaje obfity plon."
"J12,25": "Kto miłuje swoje życie, utraci je, a kto nienawidzi swego życia na tym świecie, zachowa je na życie wieczne."
"J12,26": "Jeśli ktoś mi służy, niech idzie za mną, a gdzie ja jestem, tam będzie i mój sługa. A jeśli ktoś będzie mi służył, uczci go mój Ojciec."
"J12,27": "Teraz moja dusza jest zatrwożona. I cóż powiem? Ojcze, zachowaj mnie od tej godziny? Przecież dlatego przyszedłem na tę godzinę."
"J12,28": "Ojcze, uwielbij swoje imię. Wtedy rozległ się głos z nieba: Uwielbiłem i jeszcze uwielbię."
"J12,29": "A ludzie, którzy stali i słyszeli, mówili: Zagrzmiało. A inni mówili: Anioł do niego przemówił."
"J12,30": "Jezus odpowiedział: Ten głos rozległ się nie ze względu na mnie, ale ze względu na was."
"J12,31": "Teraz odbywa się sąd tego świata, teraz władca tego świata będzie wyrzucony precz."
"J12,32": "A ja, jeśli będę wywyższony nad ziemię, pociągnę wszystkich do siebie."
"J12,33": "A mówił to, dając znać, jaką śmiercią miał umrzeć."
"J12,34": "Ludzie mu odpowiedzieli: Dowiedzieliśmy się z prawa, że Chrystus trwa na wieki. Jakże więc ty możesz mówić, że Syn Człowieczy musi być wywyższony? Któż to jest Syn Człowieczy?"
"J12,35": "Wtedy Jezus powiedział im: Jeszcze przez krótki czas jest z wami światłość. Chodźcie więc, dopóki macie światłość, żeby was ciemność nie ogarnęła. Bo kto chodzi w ciemności, nie wie, dokąd idzie."
"J12,36": "Dopóki macie światłość, wierzcie w światłość, abyście byli synami światłości. Gdy Jezus to powiedział, odszedł i ukrył się przed nimi."
"J12,37": "A choć tak wiele cudów uczynił wobec nich, jednak nie uwierzyli w niego;"
"J12,38": "Aby się wypełniło słowo, które powiedział prorok Izajasz: Panie, któż uwierzył naszemu głoszeniu? I komu ramię Pańskie zostało objawione?"
"J12,39": "Dlatego nie mogli uwierzyć, bo jeszcze Izajasz powiedział:"
"J12,40": "Zaślepił ich oczy i zatwardził ich serce, aby oczami nie widzieli i sercem nie zrozumieli, aby się nie nawrócili, żebym ich nie uzdrowił."
"J12,41": "To powiedział Izajasz, gdy widział jego chwałę i mówił o nim."
"J12,42": "Jednak i z przełożonych wielu uwierzyło w niego, ale z powodu faryzeuszy nie wyznawali go, aby nie wyłączono ich z synagogi."
"J12,43": "Umiłowali bowiem chwałę ludzką bardziej niż chwałę Bożą."
"J12,44": "A Jezus wołał: Kto wierzy we mnie, nie we mnie wierzy, ale w tego, który mnie posłał."
"J12,45": "I kto mnie widzi, widzi tego, który mnie posłał."
"J12,46": "Ja, światłość, przyszedłem na świat, aby każdy, kto wierzy we mnie, nie pozostał w ciemności."
"J12,47": "A jeśli ktoś słucha moich słów, a nie uwierzy, ja go nie sądzę. Nie przyszedłem bowiem po to, żeby sądzić świat, ale żeby zbawić świat."
"J12,48": "Kto mną gardzi i nie przyjmuje moich słów, ma kogoś, kto go sądzi: słowo, które ja mówiłem, ono go osądzi w dniu ostatecznym."
"J12,49": "Bo ja nie mówiłem sam od siebie, ale ten, który mnie posłał, Ojciec, on mi dał nakaz, co mam powiedzieć i co mówić."
"J12,50": "I wiem, że jego nakaz jest życiem wiecznym. Dlatego to, co ja wam mówię, mówię tak, jak mi powiedział Ojciec."
