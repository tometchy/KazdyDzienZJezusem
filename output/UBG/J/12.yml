"J12,1":
  text: "Na sześć dni przed Paschą Jezus przyszedł do Betanii, gdzie był Łazarz, który umarł, a którego wskrzesił z martwych."
  tags: []
"J12,2":
  text: "Tam przygotowali mu wieczerzę, a Marta usługiwała. Łazarz zaś był jednym z tych, którzy razem z nim siedzieli przy stole."
  tags: []
"J12,3":
  text: "Wówczas Maria, wziąwszy funt bardzo drogiej maści nardowej, namaściła nogi Jezusa i wytarła je swoimi włosami, a dom napełnił się wonią tej maści."
  tags: []
"J12,4":
  text: "Wtedy jeden z jego uczniów, Judasz Iskariota, syn Szymona, ten, który miał go zdradzić, powiedział:"
  tags: []
"J12,5":
  text: "Dlaczego tej maści nie sprzedano za trzysta groszy i nie rozdano ich ubogim?"
  tags: []
"J12,6":
  text: "A to mówił nie dlatego, że troszczył się o ubogich, ale ponieważ był złodziejem i miał sakiewkę, a nosił to, co do niej włożono."
  tags: []
"J12,7":
  text: "Wtedy Jezus powiedział: Zostaw ją; zachowała to na dzień mego pogrzebu."
  tags: []
"J12,8":
  text: "Ubogich bowiem zawsze macie u siebie, ale mnie nie zawsze będziecie mieć."
  tags: []
"J12,9":
  text: "Wtedy wielu Żydów dowiedziało się, że tam jest; i przyszli nie tylko z powodu Jezusa, ale także, by zobaczyć Łazarza, którego wskrzesił z martwych."
  tags: []
"J12,10":
  text: "I naradzali się naczelni kapłani nad tym, żeby zabić również Łazarza;"
  tags: []
"J12,11":
  text: "Gdyż z jego powodu wielu spośród Żydów odstąpiło i uwierzyło w Jezusa."
  tags: []
"J12,12":
  text: "Nazajutrz mnóstwo ludzi, którzy przyszli na święto, usłyszawszy, że Jezus idzie do Jerozolimy;"
  tags: []
"J12,13":
  text: "Nabrało gałązek palmowych, wyszło mu naprzeciw i wołało: Hosanna! Błogosławiony, który przychodzi w imieniu Pana, król Izraela!"
  tags: []
"J12,14":
  text: "A Jezus, znalazłszy oślątko, wsiadł na nie, jak jest napisane:"
  tags: []
"J12,15":
  text: "Nie bój się, córko Syjonu. Oto twój król przychodzi, siedząc na oślątku."
  tags: []
"J12,16":
  text: "Z początku jego uczniowie tego nie zrozumieli, ale gdy Jezus został uwielbiony, wtedy przypomnieli sobie, że to było o nim napisane i że mu tak uczynili."
  tags: []
"J12,17":
  text: "Dawali więc świadectwo ludzie, którzy z nim byli, gdy Łazarza wywołał z grobowca i wskrzesił go z martwych."
  tags: []
"J12,18":
  text: "Dlatego też ludzie wyszli mu naprzeciw, bo usłyszeli, że on uczynił ten cud."
  tags: []
"J12,19":
  text: "Wtedy faryzeusze mówili między sobą: Widzicie, że nic nie zdziałacie. Oto świat poszedł za nim."
  tags: []
"J12,20":
  text: "A wśród tych, którzy przychodzili do Jerozolimy, żeby oddać cześć Bogu w święto, byli pewni Grecy."
  tags: []
"J12,21":
  text: "Oni to przyszli do Filipa, który był z Betsaidy w Galilei, i prosili go: Panie, chcemy zobaczyć Jezusa."
  tags: []
"J12,22":
  text: "Filip przyszedł i powiedział Andrzejowi, a z kolei Andrzej i Filip powiedzieli Jezusowi."
  tags: []
"J12,23":
  text: "A Jezus im odpowiedział: Nadeszła godzina, aby Syn Człowieczy został uwielbiony."
  tags: []
"J12,24":
  text: "Zaprawdę, zaprawdę powiadam wam: Jeśli ziarno pszenicy, wpadłszy w ziemię, nie obumrze, samo zostaje. Jeśli jednak obumrze, wydaje obfity plon."
  tags: []
"J12,25":
  text: "Kto miłuje swoje życie, utraci je, a kto nienawidzi swego życia na tym świecie, zachowa je na życie wieczne."
  tags: []
"J12,26":
  text: "Jeśli ktoś mi służy, niech idzie za mną, a gdzie ja jestem, tam będzie i mój sługa. A jeśli ktoś będzie mi służył, uczci go mój Ojciec."
  tags: []
"J12,27":
  text: "Teraz moja dusza jest zatrwożona. I cóż powiem? Ojcze, zachowaj mnie od tej godziny? Przecież dlatego przyszedłem na tę godzinę."
  tags: []
"J12,28":
  text: "Ojcze, uwielbij swoje imię. Wtedy rozległ się głos z nieba: Uwielbiłem i jeszcze uwielbię."
  tags: []
"J12,29":
  text: "A ludzie, którzy stali i słyszeli, mówili: Zagrzmiało. A inni mówili: Anioł do niego przemówił."
  tags: []
"J12,30":
  text: "Jezus odpowiedział: Ten głos rozległ się nie ze względu na mnie, ale ze względu na was."
  tags: []
"J12,31":
  text: "Teraz odbywa się sąd tego świata, teraz władca tego świata będzie wyrzucony precz."
  tags: []
"J12,32":
  text: "A ja, jeśli będę wywyższony nad ziemię, pociągnę wszystkich do siebie."
  tags: []
"J12,33":
  text: "A mówił to, dając znać, jaką śmiercią miał umrzeć."
  tags: []
"J12,34":
  text: "Ludzie mu odpowiedzieli: Dowiedzieliśmy się z prawa, że Chrystus trwa na wieki. Jakże więc ty możesz mówić, że Syn Człowieczy musi być wywyższony? Któż to jest Syn Człowieczy?"
  tags: []
"J12,35":
  text: "Wtedy Jezus powiedział im: Jeszcze przez krótki czas jest z wami światłość. Chodźcie więc, dopóki macie światłość, żeby was ciemność nie ogarnęła. Bo kto chodzi w ciemności, nie wie, dokąd idzie."
  tags: []
"J12,36":
  text: "Dopóki macie światłość, wierzcie w światłość, abyście byli synami światłości. Gdy Jezus to powiedział, odszedł i ukrył się przed nimi."
  tags: []
"J12,37":
  text: "A choć tak wiele cudów uczynił wobec nich, jednak nie uwierzyli w niego;"
  tags: []
"J12,38":
  text: "Aby się wypełniło słowo, które powiedział prorok Izajasz: Panie, któż uwierzył naszemu głoszeniu? I komu ramię Pańskie zostało objawione?"
  tags: []
"J12,39":
  text: "Dlatego nie mogli uwierzyć, bo jeszcze Izajasz powiedział:"
  tags: []
"J12,40":
  text: "Zaślepił ich oczy i zatwardził ich serce, aby oczami nie widzieli i sercem nie zrozumieli, aby się nie nawrócili, żebym ich nie uzdrowił."
  tags: []
"J12,41":
  text: "To powiedział Izajasz, gdy widział jego chwałę i mówił o nim."
  tags: []
"J12,42":
  text: "Jednak i z przełożonych wielu uwierzyło w niego, ale z powodu faryzeuszy nie wyznawali go, aby nie wyłączono ich z synagogi."
  tags: []
"J12,43":
  text: "Umiłowali bowiem chwałę ludzką bardziej niż chwałę Bożą."
  tags: []
"J12,44":
  text: "A Jezus wołał: Kto wierzy we mnie, nie we mnie wierzy, ale w tego, który mnie posłał."
  tags: []
"J12,45":
  text: "I kto mnie widzi, widzi tego, który mnie posłał."
  tags: []
"J12,46":
  text: "Ja, światłość, przyszedłem na świat, aby każdy, kto wierzy we mnie, nie pozostał w ciemności."
  tags: []
"J12,47":
  text: "A jeśli ktoś słucha moich słów, a nie uwierzy, ja go nie sądzę. Nie przyszedłem bowiem po to, żeby sądzić świat, ale żeby zbawić świat."
  tags: []
"J12,48":
  text: "Kto mną gardzi i nie przyjmuje moich słów, ma kogoś, kto go sądzi: słowo, które ja mówiłem, ono go osądzi w dniu ostatecznym."
  tags: []
"J12,49":
  text: "Bo ja nie mówiłem sam od siebie, ale ten, który mnie posłał, Ojciec, on mi dał nakaz, co mam powiedzieć i co mówić."
  tags: []
"J12,50":
  text: "I wiem, że jego nakaz jest życiem wiecznym. Dlatego to, co ja wam mówię, mówię tak, jak mi powiedział Ojciec."
  tags: []
