"Jud1,1":
  text: "Juda, sługa Jezusa Chrystusa, a brat Jakuba, do uświęconych przez Boga Ojca, zachowanych w Jezusie Chrystusie i powołanych:"
  tags: []
"Jud1,2":
  text: "Miłosierdzie, pokój i miłość niech się wam pomnożą."
  tags: []
"Jud1,3":
  text: "Umiłowani, podejmując usilne starania, aby pisać wam o wspólnym zbawieniu, uznałem za konieczne napisać do was i zachęcić do walki o wiarę raz przekazaną świętym."
  tags: []
"Jud1,4":
  text: "Wkradli się bowiem pewni ludzie, od dawna przeznaczeni na to potępienie, bezbożni, którzy łaskę naszego Boga zamieniają na rozpustę i wypierają się jedynego Pana Boga i naszego Pana Jezusa Chrystusa."
  tags: []
"Jud1,5":
  text: "Chcę więc wam przypomnieć, chociaż już kiedyś o tym wiedzieliście, że Pan, który wybawił lud z ziemi Egiptu, potem wytracił tych, którzy nie uwierzyli."
  tags: []
"Jud1,6":
  text: "Także aniołów, którzy nie zachowali swego pierwotnego stanu, lecz opuścili własne mieszkanie, zatrzymał w wiecznych pętach w ciemnościach na sąd wielkiego dnia."
  tags: []
"Jud1,7":
  text: "Tak samo Sodoma i Gomora oraz okoliczne miasta, które w podobny sposób jak i one oddały się nierządowi i podążały za cudzym ciałem, służą za przykład, ponosząc karę wiecznego ognia."
  tags: []
"Jud1,8":
  text: "Podobnie ci ludzie rojący sny plugawią ciało, gardzą panowaniem i bluźnią przełożonym."
  tags: []
"Jud1,9":
  text: "Lecz archanioł Michał, rozprawiając z diabłem, spierał się o ciało Mojżesza, nie ośmielił się wypowiedzieć przeciwko niemu bluźnierczego oskarżenia, ale powiedział: Niech cię Pan zgromi."
  tags: []
"Jud1,10":
  text: "Ci zaś bluźnią przeciwko temu, czego nie znają, a to, co znają w sposób naturalny, jak bezrozumne zwierzęta, w tym psują samych siebie."
  tags: []
"Jud1,11":
  text: "Biada im, bo poszli drogą Kaina, udali się za błędem Baalama dla zapłaty i zginęli w buncie Koracha."
  tags: []
"Jud1,12":
  text: "Oni są zakałami na waszych ucztach braterskich, którzy z wami bez bojaźni ucztują, pasąc samych siebie. Są to bezwodne chmury wiatrami unoszone; drzewa zwiędłe, bez owoców, dwukrotnie obumarłe i wykorzenione;"
  tags: []
"Jud1,13":
  text: "Rozhukane fale morskie wypluwające swoją hańbę; błąkające się gwiazdy, dla których mroki ciemności zachowane są na wieki."
  tags: []
"Jud1,14":
  text: "O nich też prorokował Henoch, siódmy po Adamie, mówiąc: Oto idzie Pan z tysiącami swoich świętych;"
  tags: []
"Jud1,15":
  text: "Aby dokonać sądu nad wszystkimi i ukarać wszystkich bezbożników spośród nich za wszystkie ich bezbożne czyny, których się bezbożnie dopuścili, i za wszystkie ostre słowa, które wypowiadali przeciwko niemu bezbożni grzesznicy."
  tags: []
"Jud1,16":
  text: "Oni to zawsze szemrają, narzekają, postępują według swoich pożądliwości. Ich usta wypowiadają zuchwałe słowa i schlebiają ludziom dla korzyści."
  tags: []
"Jud1,17":
  text: "Wy zaś, umiłowani, pamiętajcie słowa wcześniej wypowiedziane przez apostołów naszego Pana Jezusa Chrystusa;"
  tags: []
"Jud1,18":
  text: "Gdy mówili do was, że w czasach ostatecznych pojawią się szydercy, postępujący według własnych bezbożnych pożądliwości."
  tags: []
"Jud1,19":
  text: "Oni są tymi, którzy sami się odłączają, zmysłowi, niemający Ducha."
  tags: []
"Jud1,20":
  text: "Wy jednak, umiłowani, budując samych siebie na waszej najświętszej wierze, modląc się w Duchu Świętym;"
  tags: []
"Jud1,21":
  text: "Zachowajcie samych siebie w miłości Boga, oczekując miłosierdzia naszego Pana Jezusa Chrystusa ku życiu wiecznemu."
  tags: []
"Jud1,22":
  text: "I rozróżniając, nad jednymi zmiłujcie się;"
  tags: []
"Jud1,23":
  text: "Innych zaś ratujcie przez strach, wyrywając ich z ognia, mając w nienawiści nawet szatę, która została skalana przez ciało."
  tags: []
"Jud1,24":
  text: "A temu, który może was ustrzec od upadku i z radością przedstawić jako nienagannych przed obliczem swojej chwały;"
  tags: []
"Jud1,25":
  text: "Jedynemu mądremu Bogu, naszemu Zbawicielowi, niech będzie chwała i majestat, moc i władza, teraz i po wszystkie wieki. Amen."
  tags: []
