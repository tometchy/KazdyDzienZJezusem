"Flm1,1":
  text: "Paweł, więzień Chrystusa Jezusa, i Tymoteusz, brat, do umiłowanego Filemona, naszego współpracownika;"
  tags: []
"Flm1,2":
  text: "Do naszej umiłowanej Apfii, do Archipa, naszego współbojownika i do kościoła, który jest w twoim domu."
  tags: []
"Flm1,3":
  text: "Łaska wam i pokój od Boga, naszego Ojca, i Pana Jezusa Chrystusa."
  tags: []
"Flm1,4":
  text: "Dziękuję mojemu Bogu, zawsze wzmiankę czyniąc o tobie w moich modlitwach;"
  tags: []
"Flm1,5":
  text: "Słysząc o twojej miłości i wierze, którą masz względem Pana Jezusa i względem wszystkich świętych;"
  tags: []
"Flm1,6":
  text: "Modlę się, aby udzielenie twojej wiary doprowadziło do poznania wszelkiego dobra, które jest w was przez Chrystusa Jezusa."
  tags: []
"Flm1,7":
  text: "Mamy bowiem wielką radość i pociechę z powodu twojej miłości, bracie, gdyż przez ciebie serca świętych zostały pokrzepione."
  tags: []
"Flm1,8":
  text: "Dlatego, chociaż mogę śmiało w Chrystusie nakazać ci, co należy czynić;"
  tags: []
"Flm1,9":
  text: "To jednak ze względu na miłość raczej proszę, będąc tym, kim jestem – Pawłem, starcem, a teraz i więźniem Jezusa Chrystusa;"
  tags: []
"Flm1,10":
  text: "Proszę cię za moim synem, Onezymem, którego zrodziłem w moich więzach;"
  tags: []
"Flm1,11":
  text: "Który niegdyś był dla ciebie nieużyteczny, ale teraz dla ciebie i dla mnie jest bardzo użyteczny."
  tags: []
"Flm1,12":
  text: "Jego odsyłam, przyjmij go więc jak moje serce."
  tags: []
"Flm1,13":
  text: "Zamierzałem go przy sobie zatrzymać, aby zamiast ciebie posługiwał mi w więzach ewangelii."
  tags: []
"Flm1,14":
  text: "Lecz bez twojej zgody nie chciałem nic czynić, aby twój dobry uczynek nie był jakby z przymusu, ale z własnej woli."
  tags: []
"Flm1,15":
  text: "Może bowiem dlatego oddalił się na chwilę od ciebie, abyś go odzyskał na zawsze;"
  tags: []
"Flm1,16":
  text: "Już nie jako sługę, lecz więcej niż sługę, jako brata umiłowanego, zwłaszcza dla mnie, a tym bardziej dla ciebie, i w ciele, i w Panu."
  tags: []
"Flm1,17":
  text: "Jeżeli więc masz mnie za przyjaciela, przyjmij go jak mnie."
  tags: []
"Flm1,18":
  text: "A jeśli wyrządził ci jakąś szkodę albo jest ci coś winien, policz to na mój rachunek."
  tags: []
"Flm1,19":
  text: "Ja, Paweł, napisałem własnoręcznie, ja zapłacę, by nie mówić już o tym, że jesteś mi winien samego siebie."
  tags: []
"Flm1,20":
  text: "Tak, bracie, niech ja dzięki tobie doznam radości w Panu, pokrzep moje serce w Panu."
  tags: []
"Flm1,21":
  text: "Napisałem ci, będąc pewny twego posłuszeństwa, wiedząc, że uczynisz nawet więcej, niż mówię."
  tags: []
"Flm1,22":
  text: "A zarazem przygotuj mi też gościnę; mam bowiem ufność, że dzięki waszym modlitwom będę wam oddany."
  tags: []
"Flm1,23":
  text: "Pozdrawiają cię Epafras, mój współwięzień w Chrystusie Jezusie;"
  tags: []
"Flm1,24":
  text: "Marek, Arystarch, Demas, Łukasz – moi współpracownicy."
  tags: []
"Flm1,25":
  text: "Łaska naszego Pana Jezusa Chrystusa niech będzie z waszym duchem. Amen."
  tags: []
