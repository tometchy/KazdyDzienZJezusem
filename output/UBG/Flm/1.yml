"Flm1,1": "Paweł, więzień Chrystusa Jezusa, i Tymoteusz, brat, do umiłowanego Filemona, naszego współpracownika;"
"Flm1,2": "Do naszej umiłowanej Apfii, do Archipa, naszego współbojownika i do kościoła, który jest w twoim domu."
"Flm1,3": "Łaska wam i pokój od Boga, naszego Ojca, i Pana Jezusa Chrystusa."
"Flm1,4": "Dziękuję mojemu Bogu, zawsze wzmiankę czyniąc o tobie w moich modlitwach;"
"Flm1,5": "Słysząc o twojej miłości i wierze, którą masz względem Pana Jezusa i względem wszystkich świętych;"
"Flm1,6": "Modlę się, aby udzielenie twojej wiary doprowadziło do poznania wszelkiego dobra, które jest w was przez Chrystusa Jezusa."
"Flm1,7": "Mamy bowiem wielką radość i pociechę z powodu twojej miłości, bracie, gdyż przez ciebie serca świętych zostały pokrzepione."
"Flm1,8": "Dlatego, chociaż mogę śmiało w Chrystusie nakazać ci, co należy czynić;"
"Flm1,9": "To jednak ze względu na miłość raczej proszę, będąc tym, kim jestem – Pawłem, starcem, a teraz i więźniem Jezusa Chrystusa;"
"Flm1,10": "Proszę cię za moim synem, Onezymem, którego zrodziłem w moich więzach;"
"Flm1,11": "Który niegdyś był dla ciebie nieużyteczny, ale teraz dla ciebie i dla mnie jest bardzo użyteczny."
"Flm1,12": "Jego odsyłam, przyjmij go więc jak moje serce."
"Flm1,13": "Zamierzałem go przy sobie zatrzymać, aby zamiast ciebie posługiwał mi w więzach ewangelii."
"Flm1,14": "Lecz bez twojej zgody nie chciałem nic czynić, aby twój dobry uczynek nie był jakby z przymusu, ale z własnej woli."
"Flm1,15": "Może bowiem dlatego oddalił się na chwilę od ciebie, abyś go odzyskał na zawsze;"
"Flm1,16": "Już nie jako sługę, lecz więcej niż sługę, jako brata umiłowanego, zwłaszcza dla mnie, a tym bardziej dla ciebie, i w ciele, i w Panu."
"Flm1,17": "Jeżeli więc masz mnie za przyjaciela, przyjmij go jak mnie."
"Flm1,18": "A jeśli wyrządził ci jakąś szkodę albo jest ci coś winien, policz to na mój rachunek."
"Flm1,19": "Ja, Paweł, napisałem własnoręcznie, ja zapłacę, by nie mówić już o tym, że jesteś mi winien samego siebie."
"Flm1,20": "Tak, bracie, niech ja dzięki tobie doznam radości w Panu, pokrzep moje serce w Panu."
"Flm1,21": "Napisałem ci, będąc pewny twego posłuszeństwa, wiedząc, że uczynisz nawet więcej, niż mówię."
"Flm1,22": "A zarazem przygotuj mi też gościnę; mam bowiem ufność, że dzięki waszym modlitwom będę wam oddany."
"Flm1,23": "Pozdrawiają cię Epafras, mój współwięzień w Chrystusie Jezusie;"
"Flm1,24": "Marek, Arystarch, Demas, Łukasz – moi współpracownicy."
"Flm1,25": "Łaska naszego Pana Jezusa Chrystusa niech będzie z waszym duchem. Amen."
