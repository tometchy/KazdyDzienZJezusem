"Pnp3,1":
  text: "Na swoim łożu wśród nocy szukałam tego, którego miłuje moja dusza. Szukałam go, ale go nie znalazłam."
  tags: []
"Pnp3,2":
  text: "Wstanę więc już i obiegnę miasto, po ulicach i placach będę szukać tego, którego miłuje moja dusza. Szukałam go, ale nie znalazłam."
  tags: []
"Pnp3,3":
  text: "Znaleźli mnie strażnicy, którzy obchodzili miasto, i spytałam: Widzieliście tego, którego miłuje moja dusza?"
  tags: []
"Pnp3,4":
  text: "A gdy ledwie od nich odeszłam, zaraz znalazłam tego, którego miłuje moja dusza. Uchwyciłam go i nie puszczę, aż go wprowadzę do domu mojej matki, do pokoju mojej rodzicielki."
  tags: []
"Pnp3,5":
  text: "Zaklinam was, córki Jerozolimy, na sarny i łanie polne: Nie budźcie mego umiłowanego i nie przerywajcie jego snu, dopóki nie zechce."
  tags: []
"Pnp3,6":
  text: "Kim jest ta, która wyłania się z pustyni jak słupy dymu, owiana wonią mirry i kadzidła oraz wszelkim wonnym proszkiem od kupca?"
  tags: []
"Pnp3,7":
  text: "Oto łoże Salomona, dokoła którego stoi sześćdziesięciu dzielnych wojowników spośród dzielnych Izraela."
  tags: []
"Pnp3,8":
  text: "Wszyscy trzymają miecz, wyćwiczeni w boju. Każdy z nich ma swój miecz u boku przez wzgląd na strach nocny."
  tags: []
"Pnp3,9":
  text: "Król Salomon uczynił sobie lektykę z drzewa Libanu."
  tags: []
"Pnp3,10":
  text: "Jej słupki uczynił ze srebra, jej pokład ze złota, podniebienie z purpury, a wnętrze wyścielone miłością córek Jerozolimy."
  tags: []
"Pnp3,11":
  text: "Wyjdźcie, córki Syjonu, i popatrzcie na króla Salomona w koronie, którą ukoronowała go jego matka w dniu jego zaręczyn i w dniu radości jego serca."
  tags: []
