"Pnp3,1": "Na swoim łożu wśród nocy szukałam tego, którego miłuje moja dusza. Szukałam go, ale go nie znalazłam."
"Pnp3,2": "Wstanę więc już i obiegnę miasto, po ulicach i placach będę szukać tego, którego miłuje moja dusza. Szukałam go, ale nie znalazłam."
"Pnp3,3": "Znaleźli mnie strażnicy, którzy obchodzili miasto, i spytałam: Widzieliście tego, którego miłuje moja dusza?"
"Pnp3,4": "A gdy ledwie od nich odeszłam, zaraz znalazłam tego, którego miłuje moja dusza. Uchwyciłam go i nie puszczę, aż go wprowadzę do domu mojej matki, do pokoju mojej rodzicielki."
"Pnp3,5": "Zaklinam was, córki Jerozolimy, na sarny i łanie polne: Nie budźcie mego umiłowanego i nie przerywajcie jego snu, dopóki nie zechce."
"Pnp3,6": "Kim jest ta, która wyłania się z pustyni jak słupy dymu, owiana wonią mirry i kadzidła oraz wszelkim wonnym proszkiem od kupca?"
"Pnp3,7": "Oto łoże Salomona, dokoła którego stoi sześćdziesięciu dzielnych wojowników spośród dzielnych Izraela."
"Pnp3,8": "Wszyscy trzymają miecz, wyćwiczeni w boju. Każdy z nich ma swój miecz u boku przez wzgląd na strach nocny."
"Pnp3,9": "Król Salomon uczynił sobie lektykę z drzewa Libanu."
"Pnp3,10": "Jej słupki uczynił ze srebra, jej pokład ze złota, podniebienie z purpury, a wnętrze wyścielone miłością córek Jerozolimy."
"Pnp3,11": "Wyjdźcie, córki Syjonu, i popatrzcie na króla Salomona w koronie, którą ukoronowała go jego matka w dniu jego zaręczyn i w dniu radości jego serca."
