"Pnp2,1": "Jestem różą Saronu i lilią dolin."
"Pnp2,2": "Jak lilia między cierniami, tak moja umiłowana między pannami."
"Pnp2,3": "Jak jabłoń między leśnymi drzewami, tak mój miły między młodzieńcami. Z wielkim pragnieniem usiadłam w jego cieniu, a jego owoc jest słodki memu podniebieniu."
"Pnp2,4": "Wprowadził mnie do komnaty biesiadnej, a jego chorągwią nade mną jest miłość."
"Pnp2,5": "Pokrzepcie mnie bukłakami, posilcie mnie jabłkami, bo jestem chora z miłości."
"Pnp2,6": "Jego lewa ręka pod moją głową, a jego prawa ręka mnie obejmuje."
"Pnp2,7": "Zaklinam was, córki Jerozolimy, na sarny i łanie polne: Nie budźcie mego umiłowanego i nie przerywajcie jego snu, dopóki nie zechce."
"Pnp2,8": "Głos mego umiłowanego! Oto idzie, skacząc po górach, a podskakując po pagórkach."
"Pnp2,9": "Mój umiłowany podobny jest do sarny albo młodego jelenia. Oto stoi za naszym murem, zagląda przez okna, patrzy przez kraty."
"Pnp2,10": "Mój umiłowany odezwał się i powiedział mi: Wstań, moja umiłowana, moja piękna, i chodź!"
"Pnp2,11": "Oto bowiem minęła zima, deszcz ustał i przeszedł."
"Pnp2,12": "Kwiatki pokazały się na ziemi, nadszedł czas śpiewania i głos synogarlicy słychać w naszej ziemi."
"Pnp2,13": "Drzewo figowe już wypuściło swoje niedojrzałe figi, a kwitnąca winorośl wydaje swoją woń. Wstań, moja umiłowana, moja piękna, i chodź!"
"Pnp2,14": "Moja gołębico, mieszkająca w skalnych szczelinach, w stromych kryjówkach, ukaż mi swoją twarz, daj mi usłyszeć swój głos, gdyż twój głos jest słodki i twoja twarz piękna."
"Pnp2,15": "Schwytajcie nam lisy, małe lisy, które psują winnice, ponieważ nasze winnice kwitną."
"Pnp2,16": "Mój umiłowany jest mój, a ja jestem jego. Pasie on wśród lilii."
"Pnp2,17": "Nim zaświta dzień i znikną cienie, zawróć, mój umiłowany, bądź jak sarna albo młode jelenie na górach Beter."
