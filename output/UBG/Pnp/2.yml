"Pnp2,1":
  text: "Jestem różą Saronu i lilią dolin."
  tags: []
"Pnp2,2":
  text: "Jak lilia między cierniami, tak moja umiłowana między pannami."
  tags: []
"Pnp2,3":
  text: "Jak jabłoń między leśnymi drzewami, tak mój miły między młodzieńcami. Z wielkim pragnieniem usiadłam w jego cieniu, a jego owoc jest słodki memu podniebieniu."
  tags: []
"Pnp2,4":
  text: "Wprowadził mnie do komnaty biesiadnej, a jego chorągwią nade mną jest miłość."
  tags: []
"Pnp2,5":
  text: "Pokrzepcie mnie bukłakami, posilcie mnie jabłkami, bo jestem chora z miłości."
  tags: []
"Pnp2,6":
  text: "Jego lewa ręka pod moją głową, a jego prawa ręka mnie obejmuje."
  tags: []
"Pnp2,7":
  text: "Zaklinam was, córki Jerozolimy, na sarny i łanie polne: Nie budźcie mego umiłowanego i nie przerywajcie jego snu, dopóki nie zechce."
  tags: []
"Pnp2,8":
  text: "Głos mego umiłowanego! Oto idzie, skacząc po górach, a podskakując po pagórkach."
  tags: []
"Pnp2,9":
  text: "Mój umiłowany podobny jest do sarny albo młodego jelenia. Oto stoi za naszym murem, zagląda przez okna, patrzy przez kraty."
  tags: []
"Pnp2,10":
  text: "Mój umiłowany odezwał się i powiedział mi: Wstań, moja umiłowana, moja piękna, i chodź!"
  tags: []
"Pnp2,11":
  text: "Oto bowiem minęła zima, deszcz ustał i przeszedł."
  tags: []
"Pnp2,12":
  text: "Kwiatki pokazały się na ziemi, nadszedł czas śpiewania i głos synogarlicy słychać w naszej ziemi."
  tags: []
"Pnp2,13":
  text: "Drzewo figowe już wypuściło swoje niedojrzałe figi, a kwitnąca winorośl wydaje swoją woń. Wstań, moja umiłowana, moja piękna, i chodź!"
  tags: []
"Pnp2,14":
  text: "Moja gołębico, mieszkająca w skalnych szczelinach, w stromych kryjówkach, ukaż mi swoją twarz, daj mi usłyszeć swój głos, gdyż twój głos jest słodki i twoja twarz piękna."
  tags: []
"Pnp2,15":
  text: "Schwytajcie nam lisy, małe lisy, które psują winnice, ponieważ nasze winnice kwitną."
  tags: []
"Pnp2,16":
  text: "Mój umiłowany jest mój, a ja jestem jego. Pasie on wśród lilii."
  tags: []
"Pnp2,17":
  text: "Nim zaświta dzień i znikną cienie, zawróć, mój umiłowany, bądź jak sarna albo młode jelenie na górach Beter."
  tags: []
