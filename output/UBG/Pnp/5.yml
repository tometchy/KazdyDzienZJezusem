"Pnp5,1":
  text: "Wszedłem do mojego ogrodu, moja siostro, moja oblubienico. Zbierałem moją mirrę z moimi wonnościami; zjadłem mój plaster z moim miodem, piję moje wino z moim mlekiem. Jedzcie, przyjaciele, pijcie, a pijcie obficie, moi mili."
  tags: []
"Pnp5,2":
  text: "Ja śpię, ale moje serce czuwa. Oto głos mego umiłowanego, który puka i mówi: Otwórz mi, moja siostro, moja umiłowana, moja gołębico, moja nieskalana. Moja głowa bowiem jest pełna rosy, moje kędziory – kropli nocy."
  tags: []
"Pnp5,3":
  text: "Zdjęłam już swoją suknię, jakże mam ją wkładać? Umyłam swoje nogi, jakże mam je pobrudzić?"
  tags: []
"Pnp5,4":
  text: "Mój umiłowany wsunął swoją rękę przez otwór, a moje wnętrze poruszyło się we mnie."
  tags: []
"Pnp5,5":
  text: "Wstałam, aby otworzyć mojemu umiłowanemu, a oto z moich rąk kapała mirra, z moich palców mirra spływała na uchwyt zasuwy."
  tags: []
"Pnp5,6":
  text: "Otworzyłam mojemu umiłowanemu, lecz mój umiłowany już odszedł i zniknął. Moja dusza zasłabła na jego głos. Szukałam go, ale nie znalazłam, wołałam go, ale mi nie odpowiedział."
  tags: []
"Pnp5,7":
  text: "Znaleźli mnie strażnicy, którzy obchodzili miasto; pobili mnie i zranili, strażnicy murów zabrali mi zasłonę."
  tags: []
"Pnp5,8":
  text: "Zaklinam was, córki Jerozolimy: Jeśli znajdziecie mojego umiłowanego, to powiedzcie mu, że jestem chora z miłości."
  tags: []
"Pnp5,9":
  text: "Czym przewyższa twój umiłowany innych umiłowanych, o najpiękniejsza wśród kobiet? Czym przewyższa twój umiłowany innych umiłowanych, że tak nas zaklinasz?"
  tags: []
"Pnp5,10":
  text: "Mój umiłowany jest biały i rumiany, i najznakomitszy spośród dziesięciu tysięcy."
  tags: []
"Pnp5,11":
  text: "Jego głowa jest jak najczystsze złoto; jego kędziory faliste, czarne jak kruk."
  tags: []
"Pnp5,12":
  text: "Jego oczy są jak gołębice nad strumieniami wody, jakby umyte w mleku, osadzone w swej oprawie."
  tags: []
"Pnp5,13":
  text: "Jego policzki jak grządka wonności, jak pachnące kwiatki; jego wargi jak lilie ociekające wyborną mirrą."
  tags: []
"Pnp5,14":
  text: "Jego ręce jak złote pierścienie wysadzone berylem; jego tors jak jasna kość słoniowa pokryta szafirem."
  tags: []
"Pnp5,15":
  text: "Jego nogi jak słupy z marmuru, postawione na szczerozłotych podstawkach; jego oblicze jak Liban, wyborne jak cedry."
  tags: []
"Pnp5,16":
  text: "Jego usta przesłodkie i jest on cały przepiękny. Taki jest mój umiłowany i taki jest mój przyjaciel, córki Jerozolimy."
  tags: []
