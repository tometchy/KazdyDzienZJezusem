"Pnp1,1": "Pieśń nad pieśniami Salomona."
"Pnp1,2": "Niech mnie pocałuje pocałunkami swoich ust. Twoja miłość bowiem jest lepsza od wina."
"Pnp1,3": "Z powodu wonności twoich olejków twoje imię jest jak rozlany olejek; dlatego miłują cię dziewice."
"Pnp1,4": "Pociągnij mnie, a pobiegniemy za tobą. Król wprowadził mnie do swoich komnat. Będziemy się cieszyć i radować tobą, będziemy pamiętać o twojej miłości bardziej niż o winie. Miłują cię prawi."
"Pnp1,5": "Czarna jestem, ale piękna, o córki Jerozolimy, jak namioty Kedaru, jak zasłony Salomona."
"Pnp1,6": "Nie patrzcie na mnie, że jestem czarna, gdyż słońce mnie opaliło. Synowie mojej matki rozgniewali się na mnie, postawili mnie na straży winnic; a mojej własnej winnicy nie ustrzegłam."
"Pnp1,7": "Powiedz mi ty, którego miłuje moja dusza, gdzie wypasasz, gdzie dajesz swojej trzodzie odpocząć w południe. Czemu bowiem mam być jak błądząca przy trzodach twoich towarzyszy?"
"Pnp1,8": "Jeśli nie wiesz, najpiękniejsza wśród kobiet, to idź śladem trzody i paś swoje koźlątka przy szałasach pasterzy."
"Pnp1,9": "Przyrównam cię, moja umiłowana, do zaprzęgu rydwanów faraona."
"Pnp1,10": "Twoje lica są piękne, ozdobione klejnotami, a twoja szyja – łańcuchami."
"Pnp1,11": "Uczynimy ci złote klejnoty nakrapiane srebrem."
"Pnp1,12": "Dopóki król jest przy swoim stole, mój nard rozsiewa swoją woń."
"Pnp1,13": "Jak wiązka mirry jest dla mnie mój miły, spoczywa na moich piersiach."
"Pnp1,14": "Mój miły jest dla mnie jak grono cyprysu pośród winnic w En-Gedi."
"Pnp1,15": "O jaka ty jesteś piękna, moja umiłowana! O jaka ty jesteś piękna! Twoje oczy są jak oczy gołębicy."
"Pnp1,16": "O jaki ty jesteś piękny, mój umiłowany, i jak miły! Łoże nasze się zieleni."
"Pnp1,17": "Belki naszego domu są cedrowe, a nasze stropy – cyprysowe."
