"Pnp6,1": "Dokąd poszedł twój umiłowany, o najpiękniejsza wśród kobiet? Dokąd się zwrócił twój umiłowany, abyśmy szukali go wraz z tobą?"
"Pnp6,2": "Mój umiłowany zstąpił do swojego ogrodu między grządki wonności, aby paść w ogrodach i zbierać lilie."
"Pnp6,3": "Ja należę do mego umiłowanego, a mój umiłowany należy do mnie; pasie on wśród lilii."
"Pnp6,4": "Piękna jesteś, moja umiłowana, jak Tirsa; urodziwa jak Jerozolima; groźna jak wojsko z chorągwiami."
"Pnp6,5": "Odwróć ode mnie swoje oczy, gdyż one mnie urzekają. Twoje włosy są jak stado kóz, które schodzą z Gileadu."
"Pnp6,6": "Twoje zęby są jak stado owiec, które wychodzą z kąpieli, wszystkie mają bliźnięta, a nie ma żadnej niepłodnej wśród nich."
"Pnp6,7": "Twoje skronie między twoimi kędziorkami są jak połówki granatu."
"Pnp6,8": "Sześćdziesiąt jest królowych i osiemdziesiąt nałożnic, a dziewic bez liku."
"Pnp6,9": "Lecz moja gołębica, moja nieskalana, jest jedna; jedynaczka u swojej matki, bez skazy u swojej rodzicielki. Widziały ją córki i nazwały ją błogosławioną, także królowe i nałożnice, i chwaliły ją, mówiąc:"
"Pnp6,10": "Kim jest ta, która pokazuje się jak zorza poranna, piękna jak księżyc, czysta jak słońce, groźna jak uszykowane wojsko z chorągwiami?"
"Pnp6,11": "Zeszłam do ogrodu orzechów, aby patrzeć na owoce rosnące w dolinach, by zobaczyć, czy winorośl kwitnie i czy granaty wypuszczają pączki."
"Pnp6,12": "Nim się zorientowałam, moja dusza wsadziła mnie jakby w rydwany książąt mego ludu."
"Pnp6,13": "Zawróć, zawróć, Szulamitko; zawróć, zawróć, abyśmy mogli na ciebie patrzeć. Cóż widzicie w Szulamitce? Widzimy jakby oddziały wojenne."
