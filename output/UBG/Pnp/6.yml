"Pnp6,1":
  text: "Dokąd poszedł twój umiłowany, o najpiękniejsza wśród kobiet? Dokąd się zwrócił twój umiłowany, abyśmy szukali go wraz z tobą?"
  tags: []
"Pnp6,2":
  text: "Mój umiłowany zstąpił do swojego ogrodu między grządki wonności, aby paść w ogrodach i zbierać lilie."
  tags: []
"Pnp6,3":
  text: "Ja należę do mego umiłowanego, a mój umiłowany należy do mnie; pasie on wśród lilii."
  tags: []
"Pnp6,4":
  text: "Piękna jesteś, moja umiłowana, jak Tirsa; urodziwa jak Jerozolima; groźna jak wojsko z chorągwiami."
  tags: []
"Pnp6,5":
  text: "Odwróć ode mnie swoje oczy, gdyż one mnie urzekają. Twoje włosy są jak stado kóz, które schodzą z Gileadu."
  tags: []
"Pnp6,6":
  text: "Twoje zęby są jak stado owiec, które wychodzą z kąpieli, wszystkie mają bliźnięta, a nie ma żadnej niepłodnej wśród nich."
  tags: []
"Pnp6,7":
  text: "Twoje skronie między twoimi kędziorkami są jak połówki granatu."
  tags: []
"Pnp6,8":
  text: "Sześćdziesiąt jest królowych i osiemdziesiąt nałożnic, a dziewic bez liku."
  tags: []
"Pnp6,9":
  text: "Lecz moja gołębica, moja nieskalana, jest jedna; jedynaczka u swojej matki, bez skazy u swojej rodzicielki. Widziały ją córki i nazwały ją błogosławioną, także królowe i nałożnice, i chwaliły ją, mówiąc:"
  tags: []
"Pnp6,10":
  text: "Kim jest ta, która pokazuje się jak zorza poranna, piękna jak księżyc, czysta jak słońce, groźna jak uszykowane wojsko z chorągwiami?"
  tags: []
"Pnp6,11":
  text: "Zeszłam do ogrodu orzechów, aby patrzeć na owoce rosnące w dolinach, by zobaczyć, czy winorośl kwitnie i czy granaty wypuszczają pączki."
  tags: []
"Pnp6,12":
  text: "Nim się zorientowałam, moja dusza wsadziła mnie jakby w rydwany książąt mego ludu."
  tags: []
"Pnp6,13":
  text: "Zawróć, zawróć, Szulamitko; zawróć, zawróć, abyśmy mogli na ciebie patrzeć. Cóż widzicie w Szulamitce? Widzimy jakby oddziały wojenne."
  tags: []
