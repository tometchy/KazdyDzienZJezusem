"Pnp8,1": "O gdybyś był dla mnie jak brat, który ssał piersi mojej matki! Wtedy spotykałabym cię na dworze, całowałabym cię, a nie byłabym wzgardzona."
"Pnp8,2": "Powiodłabym cię i wprowadziła do domu swojej matki, gdzie byś mnie uczył. A ja dałabym ci do picia wino korzenne, moszcz ze swoich granatów."
"Pnp8,3": "Jego lewa ręka byłaby pod moją głową, a prawa ręka objęłaby mnie."
"Pnp8,4": "Zaklinam was, córki Jerozolimy: Nie budźcie mego umiłowanego ani nie przerywajcie jego snu, dopóki on nie zechce."
"Pnp8,5": "Kim jest ta, która wyłania się z pustyni, wsparta na swym umiłowanym? Pod jabłonią cię wzbudziłam. Tam cię urodziła twoja matka, tam cię urodziła twoja rodzicielka."
"Pnp8,6": "Przyłóż mnie do swego serca jak pieczęć, jak pieczęć na swoim ramieniu. Miłość bowiem jest silna jak śmierć, zawiść twarda jak grób. Jej żar jak żar ognia i jak żarliwy płomień."
"Pnp8,7": "Wielkie wody nie zdołają zagasić miłości ani rzeki jej zatopić. Choćby ktoś oddał cały majątek swego domu za taką miłość, byłby z pewnością wzgardzony."
"Pnp8,8": "Mamy małą siostrę, która jeszcze nie ma piersi. Cóż uczynimy z naszą siostrą w dniu, w którym będą o nią zabiegać?"
"Pnp8,9": "Jeśli jest murem, zbudujemy na niej srebrny pałac; a jeśli drzwiami, oprawimy ją deskami z cedru."
"Pnp8,10": "Ja jestem murem, a moje piersi jak wieże. Odtąd byłam w jego oczach jak ta, która znalazła pokój."
"Pnp8,11": "Salomon miał winnicę w Baal-Hamon, którą najął stróżom; każdy miał przynosić za jej owoc tysiąc srebrników."
"Pnp8,12": "Ale moja winnica, którą mam, jest przede mną. Miej ty sobie tysiąc srebrników, Salomonie, a dwieście niech wezmą ci, którzy strzegą jej owocu."
"Pnp8,13": "O ty, która mieszkasz w ogrodach, przyjaciele słuchają twego głosu; daj mi go usłyszeć."
"Pnp8,14": "Pospiesz się, mój umiłowany, i bądź podobny do sarny albo młodego jelenia na górach wonności."
