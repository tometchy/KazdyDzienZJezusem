"Pnp8,1":
  text: "O gdybyś był dla mnie jak brat, który ssał piersi mojej matki! Wtedy spotykałabym cię na dworze, całowałabym cię, a nie byłabym wzgardzona."
  tags: []
"Pnp8,2":
  text: "Powiodłabym cię i wprowadziła do domu swojej matki, gdzie byś mnie uczył. A ja dałabym ci do picia wino korzenne, moszcz ze swoich granatów."
  tags: []
"Pnp8,3":
  text: "Jego lewa ręka byłaby pod moją głową, a prawa ręka objęłaby mnie."
  tags: []
"Pnp8,4":
  text: "Zaklinam was, córki Jerozolimy: Nie budźcie mego umiłowanego ani nie przerywajcie jego snu, dopóki on nie zechce."
  tags: []
"Pnp8,5":
  text: "Kim jest ta, która wyłania się z pustyni, wsparta na swym umiłowanym? Pod jabłonią cię wzbudziłam. Tam cię urodziła twoja matka, tam cię urodziła twoja rodzicielka."
  tags: []
"Pnp8,6":
  text: "Przyłóż mnie do swego serca jak pieczęć, jak pieczęć na swoim ramieniu. Miłość bowiem jest silna jak śmierć, zawiść twarda jak grób. Jej żar jak żar ognia i jak żarliwy płomień."
  tags: []
"Pnp8,7":
  text: "Wielkie wody nie zdołają zagasić miłości ani rzeki jej zatopić. Choćby ktoś oddał cały majątek swego domu za taką miłość, byłby z pewnością wzgardzony."
  tags: []
"Pnp8,8":
  text: "Mamy małą siostrę, która jeszcze nie ma piersi. Cóż uczynimy z naszą siostrą w dniu, w którym będą o nią zabiegać?"
  tags: []
"Pnp8,9":
  text: "Jeśli jest murem, zbudujemy na niej srebrny pałac; a jeśli drzwiami, oprawimy ją deskami z cedru."
  tags: []
"Pnp8,10":
  text: "Ja jestem murem, a moje piersi jak wieże. Odtąd byłam w jego oczach jak ta, która znalazła pokój."
  tags: []
"Pnp8,11":
  text: "Salomon miał winnicę w Baal-Hamon, którą najął stróżom; każdy miał przynosić za jej owoc tysiąc srebrników."
  tags: []
"Pnp8,12":
  text: "Ale moja winnica, którą mam, jest przede mną. Miej ty sobie tysiąc srebrników, Salomonie, a dwieście niech wezmą ci, którzy strzegą jej owocu."
  tags: []
"Pnp8,13":
  text: "O ty, która mieszkasz w ogrodach, przyjaciele słuchają twego głosu; daj mi go usłyszeć."
  tags: []
"Pnp8,14":
  text: "Pospiesz się, mój umiłowany, i bądź podobny do sarny albo młodego jelenia na górach wonności."
  tags: []
