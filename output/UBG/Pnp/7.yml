"Pnp7,1":
  text: "Jak piękne są twoje nogi w sandałach, córko książęca! Linia twoich bioder jest jak klejnot, jak dzieło rąk rzemieślnika."
  tags: []
"Pnp7,2":
  text: "Twój pępek jest jak okrągła czasza, której nie brakuje napoju. Twój brzuch jest jak stóg pszenicy okolony liliami."
  tags: []
"Pnp7,3":
  text: "Twoje piersi są jak dwoje sarniąt, bliźniąt."
  tags: []
"Pnp7,4":
  text: "Twoja szyja jest jak wieża z kości słoniowej; twoje oczy jak sadzawki Cheszbonu przy bramie Bat-Rabbim; twój nos jak wieża Libanu zwrócona w stronę Damaszku."
  tags: []
"Pnp7,5":
  text: "Twoja głowa na tobie jak Karmel, a włosy twojej głowy jak purpura. Król na twój widok jest jakby przywiązany w swoich krużgankach."
  tags: []
"Pnp7,6":
  text: "Jakże piękna jesteś i jak miła, o miłości przerozkoszna!"
  tags: []
"Pnp7,7":
  text: "Twój wzrost jest podobny do palmy, a twoje piersi do kiści winogron."
  tags: []
"Pnp7,8":
  text: "Powiedziałem: Wejdę na palmę i uchwycę się jej gałęzi. Niech twoje piersi będą jak kiście winorośli, a woń twojego oddechu jak zapach jabłek;"
  tags: []
"Pnp7,9":
  text: "Twoje usta jak wyborne wino, które mile spływa po podniebieniu i sprawia, że wargi śpiących mówią."
  tags: []
"Pnp7,10":
  text: "Ja należę do mojego umiłowanego i do mnie zwraca się jego pożądanie."
  tags: []
"Pnp7,11":
  text: "Chodź, mój umiłowany, wyjdźmy w pole i przenocujemy we wsiach."
  tags: []
"Pnp7,12":
  text: "Rankiem wstaniemy i pójdziemy do winnic, zobaczymy, czy kwitnie winorośl, czy otworzyły się już pączki, czy już kwitną granaty. Tam cię obdarzę swoją miłością."
  tags: []
"Pnp7,13":
  text: "Mandragory wydają swoją woń, a przed naszymi drzwiami są wszelkie wyborne owoce, nowe i stare, które przechowałam dla ciebie, mój umiłowany."
  tags: []
