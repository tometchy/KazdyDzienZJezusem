"Pnp7,1": "Jak piękne są twoje nogi w sandałach, córko książęca! Linia twoich bioder jest jak klejnot, jak dzieło rąk rzemieślnika."
"Pnp7,2": "Twój pępek jest jak okrągła czasza, której nie brakuje napoju. Twój brzuch jest jak stóg pszenicy okolony liliami."
"Pnp7,3": "Twoje piersi są jak dwoje sarniąt, bliźniąt."
"Pnp7,4": "Twoja szyja jest jak wieża z kości słoniowej; twoje oczy jak sadzawki Cheszbonu przy bramie Bat-Rabbim; twój nos jak wieża Libanu zwrócona w stronę Damaszku."
"Pnp7,5": "Twoja głowa na tobie jak Karmel, a włosy twojej głowy jak purpura. Król na twój widok jest jakby przywiązany w swoich krużgankach."
"Pnp7,6": "Jakże piękna jesteś i jak miła, o miłości przerozkoszna!"
"Pnp7,7": "Twój wzrost jest podobny do palmy, a twoje piersi do kiści winogron."
"Pnp7,8": "Powiedziałem: Wejdę na palmę i uchwycę się jej gałęzi. Niech twoje piersi będą jak kiście winorośli, a woń twojego oddechu jak zapach jabłek;"
"Pnp7,9": "Twoje usta jak wyborne wino, które mile spływa po podniebieniu i sprawia, że wargi śpiących mówią."
"Pnp7,10": "Ja należę do mojego umiłowanego i do mnie zwraca się jego pożądanie."
"Pnp7,11": "Chodź, mój umiłowany, wyjdźmy w pole i przenocujemy we wsiach."
"Pnp7,12": "Rankiem wstaniemy i pójdziemy do winnic, zobaczymy, czy kwitnie winorośl, czy otworzyły się już pączki, czy już kwitną granaty. Tam cię obdarzę swoją miłością."
"Pnp7,13": "Mandragory wydają swoją woń, a przed naszymi drzwiami są wszelkie wyborne owoce, nowe i stare, które przechowałam dla ciebie, mój umiłowany."
