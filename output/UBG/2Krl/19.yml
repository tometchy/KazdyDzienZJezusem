"2Krl19,1": "A gdy król Ezechiasz to usłyszał, rozdarł swoje szaty, oblekł się w wór i wszedł do domu PANA."
"2Krl19,2": "I posłał Eliakima, przełożonego domu, pisarza Szebnę i starszych spośród kapłanów, obleczonych w wory, do proroka Izajasza, syna Amosa."
"2Krl19,3": "I powiedzieli mu: Tak mówi Ezechiasz: Ten dzień jest dniem utrapienia, upomnienia i bluźnierstwa. Nadszedł bowiem czas porodu dzieci, a nie ma siły, aby je urodzić."
"2Krl19,4": "Może PAN, twój Bóg, usłyszy wszystkie słowa Rabszaka, którego przysłał król Asyrii, jego pan, aby znieważać Boga żywego, i pomści słowa, które usłyszał PAN, twój Bóg. Zanieś więc modlitwę za resztkę, która pozostaje."
"2Krl19,5": "Tak to słudzy króla Ezechiasza przyszli do Izajasza."
"2Krl19,6": "A Izajasz im odpowiedział: Tak powiedzcie waszemu panu: Tak mówi PAN: Nie bój się tych słów, które słyszałeś, którymi mi bluźnili słudzy króla Asyrii."
"2Krl19,7": "Oto ześlę na niego ducha i usłyszy pewną wieść, wróci do swojej ziemi i sprawię, że padnie od miecza w swojej ziemi."
"2Krl19,8": "Wrócił więc Rabszak i zastał króla Asyrii walczącego przeciwko Libnie. Usłyszał bowiem, że odstąpił od Lakisz."
"2Krl19,9": "Gdy usłyszał, że mówiono o Tirhace, królu Etiopii: Oto wyruszył na wojnę przeciwko tobie, ponownie wysłał posłańców do Ezechiasza, mówiąc:"
"2Krl19,10": "Tak powiedzcie Ezechiaszowi, królowi Judy: Niech cię nie zwodzi twój Bóg, któremu ufasz, mówiąc: Jerozolima nie będzie wydana w ręce króla Asyrii."
"2Krl19,11": "Oto słyszałeś, co uczynili królowie Asyrii wszystkim ziemiom, niszcząc je. A ty miałbyś zostać wybawiony?"
"2Krl19,12": "Czy bogowie narodów wybawili tych, których wygubili moi ojcowie: Gozan, Charan, Resef, i synów Edenu, którzy byli w Telassar?"
"2Krl19,13": "Gdzie jest król Chamatu, król Arpadu i król miasta Sefarwaim, Heny i Iwwy?"
"2Krl19,14": "Gdy Ezechiasz wziął list z rąk posłów, przeczytał go, wszedł do domu PANA i rozwinął go przed PANEM."
"2Krl19,15": "I Ezechiasz modlił się przed PANEM, mówiąc: PANIE, Boże Izraela, który zasiadasz pomiędzy cherubinami, ty jedynie jesteś Bogiem wszystkich królestw ziemi. Ty stworzyłeś niebo i ziemię."
"2Krl19,16": "Nakłoń ucha, PANIE, i wysłuchaj. Otwórz swe oczy, PANIE, i spójrz. Słuchaj słów Sennacheryba, które przesłał, aby znieważać Boga żywego."
"2Krl19,17": "To prawda, PANIE, że królowie Asyrii spustoszyli narody i ich ziemie;"
"2Krl19,18": "I powrzucali ich bogów do ognia. Nie byli bowiem bogami, ale dziełem rąk ludzkich, drewnem i kamieniem; dlatego ich zniszczyli."
"2Krl19,19": "Teraz więc, PANIE, nasz Boże, wybaw nas, proszę, z jego ręki, aby wszystkie królestwa ziemi poznały, że jedynie ty, PANIE, jesteś Bogiem."
"2Krl19,20": "Wtedy Izajasz, syn Amosa, posłał do Ezechiasza, mówiąc: Tak mówi PAN, Bóg Izraela: Wysłuchałem tego, o co mnie prosiłeś w sprawie Sennacheryba, króla Asyrii."
"2Krl19,21": "Oto słowo, które PAN o nim mówił: Dziewica, córka Syjonu, wzgardziła tobą i śmiała się z ciebie. Córka Jerozolimy kiwała głową za tobą."
"2Krl19,22": "Kogo znieważyłeś i komu bluźniłeś? Przeciwko komu podniosłeś swój głos i wysoko podniosłeś swoje oczy? Przeciw Świętemu Izraela."
"2Krl19,23": "Przez swoich posłańców znieważyłeś Pana i powiedziałeś: Z mnóstwem moich rydwanów wyszedłem na wysokie góry i zbocza Libanu. Wytnę jego wysokie cedry i jego wyborne cyprysy i przyjdę aż do najdalszych jego przybytków, do jego lasu i urodzajnego pola."
"2Krl19,24": "Ja wykopałem studnię i piłem obce wody, stopami swoich nóg wysuszyłem wszystkie potoki oblężonych miejsc."
"2Krl19,25": "Czy nie słyszałeś, że ja dawno to uczyniłem i za dawnych dni to sprawiłem? A teraz wypełniam, gdy obracasz warowne miasta w stosy gruzów."
"2Krl19,26": "Ich mieszkańcy stali się słabi, przestraszyli się i zawstydzili. Byli jak trawa polna, jak świeża zieleń i trawa na dachach, jak zboże, które uschło, zanim dojrzało."
"2Krl19,27": "Znam twoje miejsce pobytu, twoje wyjście i twoje wejście, a także twoją wściekłość przeciwko mnie."
"2Krl19,28": "Ponieważ twoja wściekłość przeciwko mnie i twoje zamieszanie doszły do moich uszu, włożę swoje kółko w twoje nozdrza i swoje wędzidło na twoje wargi i zawrócę cię tą drogą, którą przyszedłeś."
"2Krl19,29": "A to będzie znakiem dla ciebie: Tego roku będziesz jadł zboże samorodne, w drugim roku także zboże samorodne, w trzecim roku zaś siejcie i zbierajcie żniwo, sadźcie winnice i jedzcie ich owoce."
"2Krl19,30": "Resztka ocalonych z domu Judy ponownie zapuści korzenie w głąb i wyda owoc w górze."
"2Krl19,31": "Z Jerozolimy bowiem wyjdzie resztka i ci, którzy ocaleli – z góry Syjon. Sprawi to gorliwość PANA zastępów."
"2Krl19,32": "Tak więc mówi PAN o królu Asyrii: Nie wejdzie do tego miasta ani nie wypuści tam strzały, nie wyruszy przeciw niemu z tarczą i nie usypie szańców przeciwko niemu."
"2Krl19,33": "Drogą, którą przyszedł, powróci, a do tego miasta nie wejdzie, mówi PAN."
"2Krl19,34": "Będę bowiem bronił tego miasta i ocalę je ze względu na siebie i ze względu na Dawida, swego sługę."
"2Krl19,35": "Tej samej nocy Anioł PANA wyszedł i zabił w obozie Asyryjczyków sto osiemdziesiąt pięć tysięcy ludzi. A gdy wstali wcześnie rano, oto wszędzie było pełno trupów."
"2Krl19,36": "Sennacheryb, król Asyrii, wycofał się więc i wyruszył. Wrócił i zamieszkał w Niniwie."
"2Krl19,37": "A gdy oddawał pokłon w domu swego boga Nisroka, jego synowie – Adramelek i Sareser – zabili go mieczem. Potem uciekli do ziemi Ararat. I Asarchaddon, jego syn, królował w jego miejsce."
