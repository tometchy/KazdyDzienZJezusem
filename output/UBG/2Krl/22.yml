"2Krl22,1":
  text: "Jozjasz miał osiem lat, kiedy zaczął królować, i królował trzydzieści jeden lat w Jerozolimie. Jego matka miała na imię Jedida i była córką Adajasza z Boskat."
  tags: []
"2Krl22,2":
  text: "Czynił on to, co było słuszne w oczach PANA, i szedł wszystkimi drogami Dawida, swego ojca, a nie zbaczał ani na prawo, ani na lewo."
  tags: []
"2Krl22,3":
  text: "A w osiemnastym roku króla Jozjasza król posłał pisarza, Szafana, syna Azaliasza, syna Meszullama, do domu PANA, mówiąc:"
  tags: []
"2Krl22,4":
  text: "Idź do najwyższego kapłana Chilkiasza. Niech zbiera pieniądze, które przyniesiono do domu PANA, a które stróże progu zebrali od ludu;"
  tags: []
"2Krl22,5":
  text: "I niech je dadzą do rąk kierownikom robót, przełożonym nad domem PANA. A ci niech przekażą je robotnikom pracującym w domu PANA, aby naprawiali szkody domu;"
  tags: []
"2Krl22,6":
  text: "To jest cieślom, budowniczym i murarzom, oraz na zakup drewna i ciosanego kamienia na naprawę domu."
  tags: []
"2Krl22,7":
  text: "Jednak nie trzeba było rozliczać się z nimi z pieniędzy, które dali im do rąk, bo oni postępowali uczciwie."
  tags: []
"2Krl22,8":
  text: "Wtedy najwyższy kapłan Chilkiasz powiedział do pisarza, Szafana: Znalazłem księgę Prawa w domu PANA. I Chilkiasz dał księgę Szafanowi, a ten ją czytał."
  tags: []
"2Krl22,9":
  text: "Następnie pisarz Szafan przyszedł do króla i zdał sprawę królowi, mówiąc: Twoi słudzy zebrali pieniądze, które znajdowały się w domu PANA, i dali je w ręce kierownikom robót, przełożonym nad domem PANA."
  tags: []
"2Krl22,10":
  text: "Pisarz Szafan oznajmił także królowi: Kapłan Chilkiasz dał mi księgę. I Szafan czytał ją wobec króla."
  tags: []
"2Krl22,11":
  text: "A gdy król usłyszał słowa księgi Prawa, rozdarł swoje szaty."
  tags: []
"2Krl22,12":
  text: "Potem król rozkazał kapłanowi Chilkiaszowi, Achikamowi, synowi Szafana, Akborowi, synowi Micheasza, pisarzowi Szafanowi i swojemu słudze Asajaszowi:"
  tags: []
"2Krl22,13":
  text: "Idźcie, radźcie się PANA co do mnie, co do ludu i co do całej Judy w związku ze słowami tej księgi, którą znaleziono. Wielki bowiem jest gniew PANA, którym zapłonął przeciwko nam, dlatego że nasi ojcowie nie posłuchali słów tej księgi, aby czynić zgodnie ze wszystkim, co jest dla nas napisane."
  tags: []
"2Krl22,14":
  text: "Tak więc kapłan Chilkiasz, Achikam, Akbor, Szafan i Asajasz poszli do prorokini Chuldy, żony Szalluma, syna Tikwy, syna Charchasza, strażnika szat – mieszkała ona w Jerozolimie, po drugiej stronie miasta – i opowiedzieli jej o tej sprawie."
  tags: []
"2Krl22,15":
  text: "Ona zaś powiedziała im: Tak mówi PAN, Bóg Izraela: Powiedzcie mężczyźnie, który was posłał do mnie;"
  tags: []
"2Krl22,16":
  text: "Tak mówi PAN: Oto sprowadzę nieszczęście na to miejsce i na jego mieszkańców, zgodnie ze wszystkimi słowami tej księgi, które czytał król Judy;"
  tags: []
"2Krl22,17":
  text: "Za to, że mnie opuścili i palili kadzidło innym bogom, aby pobudzić mnie do gniewu wszystkimi dziełami swoich rąk. Dlatego zapłonie mój gniew przeciwko temu miejscu i nie zagaśnie."
  tags: []
"2Krl22,18":
  text: "A królowi Judy, który posłał was, aby radzić się PANA, tak powiedzcie: Tak mówi PAN, Bóg Izraela, co do słów, które słyszałeś;"
  tags: []
"2Krl22,19":
  text: "Ponieważ twoje serce zmiękło i upokorzyłeś się przed PANEM, gdy usłyszałeś, co powiedziałem przeciw temu miejscu i przeciw jego mieszkańcom – że staną się spustoszeniem i klątwą – rozdarłeś swoje szaty i płakałeś przede mną, to i ja również ciebie wysłuchałem, mówi PAN."
  tags: []
"2Krl22,20":
  text: "Dlatego oto przyłączę cię do twoich ojców i będziesz złożony w swoim grobie w pokoju, aby twoje oczy nie oglądały całego nieszczęścia, które sprowadzę na to miejsce. A oni zanieśli tę odpowiedź królowi."
  tags: []
