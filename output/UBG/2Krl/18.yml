"2Krl18,1":
  text: "W trzecim roku Ozeasza, syna Eli, króla Izraela, Ezechiasz, syn Achaza, króla Judy, zaczął królować."
  tags: []
"2Krl18,2":
  text: "Miał on dwadzieścia pięć lat, kiedy zaczął królować, i królował dwadzieścia dziewięć lat w Jerozolimie. Jego matka miała na imię Abi i była córką Zachariasza."
  tags: []
"2Krl18,3":
  text: "Czynił on to, co było słuszne w oczach PANA, wszystko tak, jak czynił Dawid, jego ojciec."
  tags: []
"2Krl18,4":
  text: "Zniósł wyżyny, rozbił posągi, powycinał gaje i potłukł węża miedzianego, którego uczynił Mojżesz, bo aż do tego czasu synowie Izraela palili mu kadzidło, i nazwał go Nehustan."
  tags: []
"2Krl18,5":
  text: "Zaufał PANU, Bogu Izraela. I spośród wszystkich królów Judy nie było nikogo podobnego do niego ani z tych, którzy byli po nim, ani z tych, którzy byli przed nim."
  tags: []
"2Krl18,6":
  text: "Przylgnął bowiem do PANA i nie odstępował od niego, ale przestrzegał jego przykazań, które PAN nadał Mojżeszowi."
  tags: []
"2Krl18,7":
  text: "A PAN był z nim i powodziło mu się, gdziekolwiek wyruszał. Zbuntował się przeciw królowi Asyrii i nie służył mu."
  tags: []
"2Krl18,8":
  text: "To on pokonał Filistynów aż do Gazy i jej granic, od wieży strażników aż do miasta warownego."
  tags: []
"2Krl18,9":
  text: "W czwartym roku króla Ezechiasza – był to siódmy rok Ozeasza, syna Eli, króla Izraela – Salmanaser, król Asyrii, wyruszył przeciwko Samarii i obległ ją."
  tags: []
"2Krl18,10":
  text: "I zdobył ją pod koniec trzeciego roku. W szóstym roku Ezechiasza – był to dziewiąty rok Ozeasza, króla Izraela – Samaria została zdobyta."
  tags: []
"2Krl18,11":
  text: "Wtedy król Asyrii uprowadził Izraela do Asyrii i osiedlił ich w Chalach i Chaborze, przy rzece Gozanu, i w miastach Medów;"
  tags: []
"2Krl18,12":
  text: "Ponieważ nie posłuchali głosu PANA, swego Boga, ale przekroczyli jego przymierze oraz to wszystko, co nakazał Mojżesz, sługa PANA. Nie słuchali tego i nie wypełniali."
  tags: []
"2Krl18,13":
  text: "W czternastym roku króla Ezechiasza Sennacheryb, król Asyrii, wyruszył przeciw wszystkim warownym miastom Judy i zdobył je."
  tags: []
"2Krl18,14":
  text: "Wtedy Ezechiasz, król Judy, posłał do króla Asyrii do Lakisz, mówiąc: Postąpiłem źle, odstąp ode mnie. Cokolwiek na mnie nałożysz, poniosę. Król Asyrii nałożył więc na Ezechiasza, króla Judy, trzysta talentów srebra i trzydzieści talentów złota."
  tags: []
"2Krl18,15":
  text: "I Ezechiasz dał mu całe srebro, które się znalazło w domu PANA i w skarbcach domu królewskiego."
  tags: []
"2Krl18,16":
  text: "W tym samym czasie Ezechiasz zerwał złoto z drzwi domu PANA oraz ze słupów, które obił sam Ezechiasz, król Judy, i dał je królowi Asyrii."
  tags: []
"2Krl18,17":
  text: "Jednakże król Asyrii posłał z Lakisz Tartana, Rabsarisa i Rabszaka z wielkim wojskiem do Jerozolimy, do króla Ezechiasza. Wyruszyli i przybyli do Jerozolimy. Gdy przybyli, przyszli i zatrzymali się przy kanale górnej sadzawki, która jest przy drodze pola folusznika."
  tags: []
"2Krl18,18":
  text: "A gdy wołali do króla, wyszli do nich Eliakim, syn Chilkiasza, przełożony domu, Szebna, pisarz, oraz Joach, syn Asafa, kronikarz."
  tags: []
"2Krl18,19":
  text: "Wtedy Rabszak powiedział do nich: Powiedzcie Ezechiaszowi: Tak mówi wielki król, król Asyrii: Co to za ufność, na której polegasz?"
  tags: []
"2Krl18,20":
  text: "Mówisz – ale to słowa daremne – mam dość rady i siły do wojny. Teraz więc w kim pokładasz ufność, że zbuntowałeś się przeciwko mnie?"
  tags: []
"2Krl18,21":
  text: "Oto teraz opierasz się na tej nadłamanej lasce trzcinowej – na Egipcie – która gdy ktoś się oprze na niej, wbija mu się w dłoń i przebija ją. Taki jest faraon, król Egiptu, dla wszystkich, którzy mu ufają."
  tags: []
"2Krl18,22":
  text: "A jeśli mi powiecie: Ufamy PANU, naszemu Bogu – czy on nie jest tym, którego wyżyny i ołtarze zniósł Ezechiasz i nakazał Judzie i Jerozolimie: Przed tym ołtarzem w Jerozolimie będziecie oddawać pokłon?"
  tags: []
"2Krl18,23":
  text: "Dlatego teraz proszę, daj zastaw memu panu, królowi Asyrii, a dam ci dwa tysiące koni, jeśli zdołasz posadzić na nich jeźdźców."
  tags: []
"2Krl18,24":
  text: "Jakże więc stawisz opór jednemu dowódcy z najmniejszych sług mego pana, a pokładasz nadzieję w Egipcie, że otrzymasz rydwany i jeźdźców?"
  tags: []
"2Krl18,25":
  text: "Poza tym – czy bez woli PANA wyruszyłem przeciw temu miejscu, aby je zburzyć? PAN powiedział do mnie: Wyrusz przeciwko tej ziemi i spustosz ją."
  tags: []
"2Krl18,26":
  text: "Wtedy Eliakim, syn Chilkiasza, Szebna i Joach powiedzieli do Rabszaka: Proszę, mów do swoich sług po syryjsku, bo rozumiemy, a nie mów z nami po hebrajsku wobec ludu, który jest na murze."
  tags: []
"2Krl18,27":
  text: "Lecz Rabszak odpowiedział: Czy do twego pana i do ciebie posłał mnie mój pan, abym mówił te słowa? Czyż nie do tych mężczyzn siedzących na murze, aby jedli swój kał i pili swój mocz razem z wami?"
  tags: []
"2Krl18,28":
  text: "Wstał więc Rabszak i zawołał donośnym głosem po hebrajsku tymi słowami: Słuchajcie słów wielkiego króla, króla Asyrii."
  tags: []
"2Krl18,29":
  text: "Tak mówi król: Niech was nie zwodzi Ezechiasz, bo nie będzie mógł wyrwać was z mojej ręki."
  tags: []
"2Krl18,30":
  text: "I nie dajcie się przekonać Ezechiaszowi, by zaufać PANU, gdy mówi: Na pewno PAN nas wybawi i to miasto nie będzie wydane w ręce króla Asyrii."
  tags: []
"2Krl18,31":
  text: "Nie słuchajcie Ezechiasza. Tak bowiem mówi król Asyrii: Zawrzyjcie ze mną przymierze i wyjdźcie do mnie, a każdy będzie jeść ze swojej winorośli i ze swego drzewa figowego i każdy będzie pić wodę ze swojej studni;"
  tags: []
"2Krl18,32":
  text: "Aż przyjdę i zabiorę was do ziemi podobnej do waszej, do ziemi zboża i wina, do ziemi chleba i winnic, do ziemi drzew oliwnych, oliwy i miodu. Będziecie żyć, a nie umierać. Nie słuchajcie Ezechiasza, bo was zwodzi, mówiąc: PAN nas wybawi."
  tags: []
"2Krl18,33":
  text: "Czy bogowie innych narodów mogli wybawić swoją ziemię z ręki króla Asyrii?"
  tags: []
"2Krl18,34":
  text: "Gdzie są bogowie Chamatu i Arpadu? Gdzie są bogowie Sefarwaim, Heny i Iwwy? Czy wyrwali Samarię z moich rąk?"
  tags: []
"2Krl18,35":
  text: "Którzy spośród wszystkich bogów tych ziem wybawili swoją ziemię z mojej ręki, żeby PAN miał wybawić Jerozolimę z mojej ręki?"
  tags: []
"2Krl18,36":
  text: "Lecz lud milczał i nie odpowiedział mu ani słowa, bo taki był rozkaz króla: Nie odpowiadajcie mu."
  tags: []
"2Krl18,37":
  text: "Wtedy przyszli przełożony domu Eliakim, syn Chilkiasza, pisarz Szebna i kronikarz Joach, syn Asafa, do Ezechiasza, z rozdartymi szatami, i oznajmili mu słowa Rabszaka."
  tags: []
