"2Krl10,1":
  text: "Achab zaś miał siedemdziesięciu synów w Samarii. I Jehu napisał list, i wysłał go do Samarii do książąt Jizreel – do starszych i do tych, którzy wychowywali synów Achaba – ze słowami:"
  tags: []
"2Krl10,2":
  text: "Jak tylko dotrze do was ten list, a są przecież z wami synowie waszego pana, macie też rydwany, konie, miasto obronne i uzbrojenie;"
  tags: []
"2Krl10,3":
  text: "Upatrzcie sobie najlepszego i najodpowiedniejszego z synów waszego pana, posadźcie na tronie jego ojca i walczcie o dom waszego pana."
  tags: []
"2Krl10,4":
  text: "Lecz oni bardzo się przerazili i powiedzieli: Oto dwaj królowie nie ostali się przed nim, a jakże my się ostoimy?"
  tags: []
"2Krl10,5":
  text: "Wtedy ten, który był postawiony nad domem, i ten, który był nad miastem, starsi oraz wychowawcy synów króla wysłali do Jehu wiadomość: Jesteśmy twoimi sługami. Uczynimy wszystko, co nam rozkażesz. Nie ustanowimy żadnego króla. Czyń, co uznasz za dobre w swoich oczach."
  tags: []
"2Krl10,6":
  text: "I napisał do nich drugi list ze słowami: Jeśli jesteście moi i chcecie słuchać mego głosu, weźcie głowy synów waszego pana i przyjdźcie do mnie jutro o tym czasie do Jizreel. A synów królewskich było siedemdziesięciu mężczyzn, przebywających u znakomitych obywateli miasta, którzy ich wychowywali."
  tags: []
"2Krl10,7":
  text: "A gdy doszedł do nich list, wzięli synów królewskich, zabili wszystkich siedemdziesięciu, włożyli ich głowy do koszy i posłali je do niego do Jizreel."
  tags: []
"2Krl10,8":
  text: "Posłaniec przyszedł i oznajmił mu: Przyniesiono głowy synów królewskich. A on powiedział: Ułóżcie je w dwa stosy u wejścia bramy – aż do poranku."
  tags: []
"2Krl10,9":
  text: "Rano zaś wyszedł, stanął i przemówił do całego ludu: Jesteście sprawiedliwi. Oto uknułem spisek przeciw swemu panu i zabiłem go, ale kto zabił tych wszystkich?"
  tags: []
"2Krl10,10":
  text: "Wiedzcie teraz, że nie upadnie na ziemię nic ze słowa PANA, które PAN wypowiedział przeciwko domowi Achaba. PAN bowiem uczynił to, co wypowiedział przez swego sługę Eliasza."
  tags: []
"2Krl10,11":
  text: "Jehu więc zabił wszystkich, którzy pozostali z domu Achaba w Jizreel, wszystkich jego możnych, jego bliskich i jego kapłanów, tak że nie zostawił spośród nich żadnego przy życiu."
  tags: []
"2Krl10,12":
  text: "Potem wstał, odszedł i wyruszył do Samarii. Po drodze, gdy był w domu, gdzie pasterze strzygli owce;"
  tags: []
"2Krl10,13":
  text: "Jehu spotkał braci Achazjasza, króla Judy, i zapytał: Kim jesteście? Odpowiedzieli: Jesteśmy braćmi Achazjasza i idziemy pozdrowić synów króla i synów królowej."
  tags: []
"2Krl10,14":
  text: "Wtedy rozkazał: Pojmijcie ich żywcem. I pojmali ich żywcem, i zabili przy studni tego domu, gdzie strzyżono owce w liczbie czterdziestu dwóch mężczyzn. Nie oszczędził żadnego z nich."
  tags: []
"2Krl10,15":
  text: "Potem odjechał stamtąd i spotkał Jonadaba, syna Rechaba, idącego mu naprzeciw. Pozdrowił go i zapytał: Czy twoje serce jest tak szczere jak moje serce wobec twojego serca? Jonadab odpowiedział: Jest. A jeśli jest, to daj mi swoją rękę. Wtedy dał mu swą rękę i wziął go do siebie na rydwan."
  tags: []
"2Krl10,16":
  text: "Potem powiedział: Jedź ze mną i zobaczysz moją gorliwość dla PANA. I wiózł go na swoim rydwanie."
  tags: []
"2Krl10,17":
  text: "A gdy przyjechał do Samarii, zabił wszystkich, którzy pozostali z domu Achaba w Samarii, i wytracił ich według słowa PANA, które wypowiedział do Eliasza."
  tags: []
"2Krl10,18":
  text: "Potem Jehu zebrał cały lud i powiedział do niego: Achab mało służył Baalowi, Jehu będzie mu służył bardziej."
  tags: []
"2Krl10,19":
  text: "Teraz więc zwołajcie do mnie wszystkich proroków Baala, wszystkie jego sługi i wszystkich jego kapłanów, niech nikogo nie zabraknie. Złożę bowiem wielką ofiarę Baalowi. Ktokolwiek się nie stawi, nie pozostanie przy życiu. Lecz Jehu działał podstępnie, chcąc wytracić czcicieli Baala."
  tags: []
"2Krl10,20":
  text: "Jehu dalej rozkazał: Ogłoście święto dla Baala. I obwołano je."
  tags: []
"2Krl10,21":
  text: "Potem Jehu rozesłał posłańców po całym Izraelu. I zeszli się wszyscy czciciele Baala, tak że nie było spośród nich nikogo, kto by nie przyszedł. Weszli do domu Baala i wypełnił się dom Baala od krańca aż do krańca."
  tags: []
"2Krl10,22":
  text: "Następnie powiedział przełożonemu szatni: Wyłóż szaty dla wszystkich czcicieli Baala. I wyłożył dla nich szaty."
  tags: []
"2Krl10,23":
  text: "Wtedy Jehu wraz z Jonadabem, synem Rechaba, wszedł do domu Baala i powiedział czcicielom Baala: Zbadajcie i upewnijcie się, że nie ma z wami nikogo z czcicieli PANA, ale tylko czciciele Baala."
  tags: []
"2Krl10,24":
  text: "Weszli więc, aby złożyć ofiary i całopalenia. Lecz Jehu postawił sobie na zewnątrz osiemdziesięciu mężczyzn, którym powiedział: Jeśli ujdzie ktokolwiek z tego ludu, który wydaję w wasze ręce, to wasze życie będzie zapłatą za jego życie."
  tags: []
"2Krl10,25":
  text: "A gdy dokończono składanie całopalenia, Jehu powiedział żołnierzom i dowódcom: Wejdźcie i zabijajcie ich, aby nikt nie uszedł. Zabili więc ich ostrzem miecza i żołnierze i dowódcy powyrzucali ich. Potem poszli do miasta domu Baala."
  tags: []
"2Krl10,26":
  text: "Wyrzucili posągi z domu Baala i spalili je."
  tags: []
"2Krl10,27":
  text: "Rozbili też posąg Baala, zburzyli dom Baala i uczynili z niego wychodek, i jest tak aż do dziś."
  tags: []
"2Krl10,28":
  text: "W ten sposób Jehu wytępił Baala z Izraela."
  tags: []
"2Krl10,29":
  text: "Nie odstąpił jednak od grzechów Jeroboama, syna Nebata, który do grzechu przywiódł Izraela – od złotych cielców, które były w Betel i w Dan."
  tags: []
"2Krl10,30":
  text: "Wtedy PAN powiedział do Jehu: Ponieważ dobrze postąpiłeś, wykonując to, co słuszne w moich oczach, i uczyniłeś domowi Achaba według wszystkiego, co było w moim sercu, to twoi synowie aż do czwartego pokolenia będą zasiadać na tronie Izraela."
  tags: []
"2Krl10,31":
  text: "Lecz Jehu nie pilnował tego, aby postępować z całego swego serca według prawa PANA, Boga Izraela. Nie odstąpił od grzechów Jeroboama, który przywiódł Izraela do grzechu."
  tags: []
"2Krl10,32":
  text: "W tych dniach PAN zaczął umniejszać Izrael: Chazael pobił ich na całym obszarze Izraela;"
  tags: []
"2Krl10,33":
  text: "Od Jordanu ku wschodowi, całą ziemię Gileadu, Gadytów, Rubenitów i Manassytów, od Aroeru, który leży nad rzeką Arnon – Gilead i Baszan."
  tags: []
"2Krl10,34":
  text: "A pozostałe dzieje Jehu i wszystko, co czynił, cała jego potęga, czy nie są zapisane w kronikach królów Izraela?"
  tags: []
"2Krl10,35":
  text: "I Jehu zasnął ze swymi ojcami, i pogrzebano go w Samarii. A w jego miejsce królował jego syn Jehoachaz."
  tags: []
"2Krl10,36":
  text: "A czas, w którym Jehu królował nad Izraelem w Samarii, wynosił dwadzieścia osiem lat."
  tags: []
