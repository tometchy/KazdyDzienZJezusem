"2Krl17,1":
  text: "W dwunastym roku Achaza, króla Judy, Ozeasz, syn Eli, zaczął królować w Samarii nad Izraelem i królował dziewięć lat."
  tags: []
"2Krl17,2":
  text: "Czynił on to, co złe w oczach PANA, jednak nie tak jak królowie Izraela, którzy byli przed nim."
  tags: []
"2Krl17,3":
  text: "Przeciw niemu wyruszył Salmanaser, król Asyrii, a Ozeasz został jego sługą i płacił mu daninę."
  tags: []
"2Krl17,4":
  text: "I król Asyrii wykrył spisek Ozeasza. Ten bowiem wyprawił posłańców do So, króla Egiptu, i nie posłał corocznej daniny królowi Asyrii. Król Asyrii więc pojmał go i zamknął w więzieniu."
  tags: []
"2Krl17,5":
  text: "Król Asyrii najechał całą ziemię, przybył do Samarii i oblegał ją przez trzy lata."
  tags: []
"2Krl17,6":
  text: "A w dziewiątym roku Ozeasza król Asyrii zdobył Samarię, uprowadził Izraela do Asyrii i osiedlił ich w Chalach i Chaborze, nad rzeką Gozan, oraz w miastach Medów."
  tags: []
"2Krl17,7":
  text: "A stało się tak, dlatego że synowie Izraela zgrzeszyli przeciw PANU, swemu Bogu, który ich wyprowadził z ziemi Egiptu, spod ręki faraona, króla Egiptu, a bali się obcych bogów;"
  tags: []
"2Krl17,8":
  text: "Postępując według ustaw pogan, których PAN wypędził sprzed oblicza synów Izraela, oraz ustaw królów Izraela, które stwarzali."
  tags: []
"2Krl17,9":
  text: "Synowie Izraela robili potajemnie przeciwko PANU, swemu Bogu, to, co nie było słuszne, i pobudowali sobie wyżyny we wszystkich swoich miastach, od wieży strażników aż do miasta warownego."
  tags: []
"2Krl17,10":
  text: "Ustawiali sobie posągi i gaje na każdym wyniosłym pagórku i pod każdym zielonym drzewem;"
  tags: []
"2Krl17,11":
  text: "I palili tam kadzidła na wszystkich wyżynach, tak jak narody, które PAN wypędził przed nimi, i popełniali niegodziwe czyny, pobudzając PANA do gniewu;"
  tags: []
"2Krl17,12":
  text: "Służyli bożkom, o których PAN im powiedział: Nie czyńcie tego."
  tags: []
"2Krl17,13":
  text: "A PAN świadczył przeciw Izraelowi i przeciw Judzie przez wszystkich proroków i wszystkich widzących, mówiąc: Odwróćcie się od swoich złych dróg i przestrzegajcie moich przykazań i moich nakazów według całego prawa, które nadałem waszym ojcom, a które przekazałem wam przez moje sługi, proroków."
  tags: []
"2Krl17,14":
  text: "Lecz nie słuchali, ale uczynili twardym swój kark, jak kark ich ojców, którzy nie wierzyli w PANA, swego Boga."
  tags: []
"2Krl17,15":
  text: "I wzgardzili jego nakazami i przymierzem, które zawarł z ich ojcami, oraz jego świadectwami, którymi świadczył przeciwko nim, i chodzili za marnościami, stali się próżni i naśladowali pogan, którzy ich otaczali, co do których PAN im rozkazał, aby nie czynili tak jak oni."
  tags: []
"2Krl17,16":
  text: "I opuścili wszystkie przykazania PANA, swego Boga, i wykonali sobie lane posągi – dwa cielce. Zrobili sobie też gaje, oddawali pokłon wszystkim zastępom niebieskim i służyli Baalowi."
  tags: []
"2Krl17,17":
  text: "Przeprowadzali swoich synów i swoje córki przez ogień, uprawiali wróżbiarstwo i czarnoksięstwo i zaprzedali się, aby czynić to, co złe w oczach PANA, pobudzając go do gniewu."
  tags: []
"2Krl17,18":
  text: "Dlatego PAN bardzo się rozgniewał na Izraela i odrzucił go sprzed swego oblicza. Nic nie pozostało oprócz samego pokolenia Judy."
  tags: []
"2Krl17,19":
  text: "Ale również i Juda nie przestrzegał przykazań PANA, swego Boga, lecz postępował według nakazów, które Izrael stworzył."
  tags: []
"2Krl17,20":
  text: "PAN więc odrzucił całe potomstwo Izraela, trapił ich i wydał w ręce grabieżców, aż wreszcie odrzucił ich sprzed swego oblicza."
  tags: []
"2Krl17,21":
  text: "Oderwał bowiem Izraela od domu Dawida, a oni ustanowili królem Jeroboama, syna Nebata. Jeroboam zaś odwiódł Izraela od naśladowania PANA i przywiódł go do popełnienia wielkiego grzechu."
  tags: []
"2Krl17,22":
  text: "I synowie Izraela chodzili we wszystkich grzechach Jeroboama, które czynił, a nie odstąpili od nich;"
  tags: []
"2Krl17,23":
  text: "Aż PAN odrzucił Izraela sprzed swego oblicza, jak zapowiedział przez wszystkie swoje sługi, proroków. I tak Izrael został uprowadzony ze swojej ziemi do Asyrii, i tak jest aż do dziś."
  tags: []
"2Krl17,24":
  text: "Potem król Asyrii sprowadził ludzi z Babilonu, z Kuta, z Awwa i z Chamat, i z Sefarwaim i osiedlił ich w miastach Samarii zamiast synów Izraela. Oni zaś posiedli Samarię i mieszkali w jej miastach."
  tags: []
"2Krl17,25":
  text: "A gdy zaczęli tam mieszkać, nie bali się PANA. PAN więc zesłał na nich lwy, które ich zabijały."
  tags: []
"2Krl17,26":
  text: "I doniesiono o tym królowi Asyrii: Narody, które uprowadziłeś i osiedliłeś w miastach Samarii, nie znają zwyczajów Boga tej ziemi. Dlatego zesłał na nich lwy, a oto zabijają ich, ponieważ nie znają zwyczajów Boga tej ziemi."
  tags: []
"2Krl17,27":
  text: "Wtedy król Asyrii rozkazał: Zaprowadźcie tam jednego z kapłanów, których stamtąd uprowadziliście, aby poszedł i tam zamieszkał, i nauczał ich zwyczajów Boga tej ziemi."
  tags: []
"2Krl17,28":
  text: "Przybył więc jeden z kapłanów, których uprowadzono z Samarii, i zamieszkał w Betel, i nauczał ich, jak mają się bać PANA."
  tags: []
"2Krl17,29":
  text: "Jednakże każdy naród czynił sobie własnych bogów i stawiał ich w domach wyżyn, które Samarytanie pobudowali, każdy naród w swoich miastach, w których mieszkał."
  tags: []
"2Krl17,30":
  text: "Babilończycy zrobili Sukkot-Benota, a ludzie z Kuta zrobili Nergala, a ludzie z Chamat zrobili Aszimę."
  tags: []
"2Krl17,31":
  text: "Awwici zrobili Nibchaza i Tartaka, a Sefarwaici palili swoje dzieci w ogniu dla Adrameleka i Anameleka, bogów Sefarwaim."
  tags: []
"2Krl17,32":
  text: "Tak więc bali się PANA i ustanowili spośród siebie kapłanów wyżyn, którzy składali dla nich ofiary w domach wyżyn."
  tags: []
"2Krl17,33":
  text: "Bali się PANA i służyli swoim bogom według zwyczajów tych narodów, skąd zostali uprowadzeni."
  tags: []
"2Krl17,34":
  text: "Aż do tego dnia postępują według dawnych zwyczajów. Nie boją się PANA i nie czynią według jego ustaw, nakazów, prawa i przykazania, które PAN nakazał synom Jakuba, któremu nadał imię Izrael."
  tags: []
"2Krl17,35":
  text: "PAN zawarł też z nimi przymierze i rozkazał im: Nie bójcie się obcych bogów, nie kłaniajcie się im, nie służcie im ani nie składajcie im ofiar;"
  tags: []
"2Krl17,36":
  text: "Lecz PANA, który was wyprowadził z ziemi Egiptu wielką mocą i wyciągniętym ramieniem, jego się bójcie, jemu oddawajcie pokłon i jemu składajcie ofiary."
  tags: []
"2Krl17,37":
  text: "Przestrzegajcie także ustaw, nakazów, prawa i przykazań, które wam napisał, i wypełniajcie je po wszystkie dni, a nie bójcie się innych bogów."
  tags: []
"2Krl17,38":
  text: "Nie zapominajcie o przymierzu, które zawarłem z wami, i nie bójcie się innych bogów."
  tags: []
"2Krl17,39":
  text: "Ale PANA, waszego Boga, bójcie się, a on was wybawi z ręki wszystkich waszych wrogów."
  tags: []
"2Krl17,40":
  text: "Lecz oni nie usłuchali, ale postępowali według dawnych zwyczajów."
  tags: []
"2Krl17,41":
  text: "Te narody więc bały się PANA i służyły swoim rytym bożkom, zarówno ich dzieci, jak i dzieci ich dzieci. Jak czynili ich ojcowie, tak i oni czynią aż do dziś."
  tags: []
