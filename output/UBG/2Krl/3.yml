"2Krl3,1": "Joram, syn Achaba, zaczął królować nad Izraelem w Samarii w osiemnastym roku Jehoszafata, króla Judy, i królował dwanaście lat."
"2Krl3,2": "Czynił on to, co złe w oczach PANA, choć nie tak jak jego ojciec i matka. Usunął bowiem posąg Baala, który sporządził jego ojciec."
"2Krl3,3": "Trwał jednak w grzechach Jeroboama, syna Nebata, który przywiódł Izraela do grzechu, i nie odstąpił od nich."
"2Krl3,4": "Mesza, król Moabu, był hodowcą owiec i dawał królowi Izraela sto tysięcy jagniąt oraz sto tysięcy baranów wraz z wełną."
"2Krl3,5": "Lecz kiedy Achab umarł, król Moabu zbuntował się przeciw królowi Izraela."
"2Krl3,6": "W tym samym dniu król Joram wyszedł z Samarii i dokonał przeglądu całego Izraela."
"2Krl3,7": "A gdy szedł, posłał do Jehoszafata, króla Judy, taką wiadomość: Król Moabu zbuntował się przeciwko mnie. Czy wyruszysz ze mną na wojnę przeciw Moabowi? Odpowiedział: Wyruszę. Ja tak, jak i ty, mój lud tak, jak i twój lud, moje konie tak, jak i twoje konie."
"2Krl3,8": "I zapytał: Którą drogą pójdziemy? Odpowiedział: Drogą przez pustynię Edomu."
"2Krl3,9": "Wyruszyli więc król Izraela, król Judy i król Edomu. A gdy krążyli drogą przez siedem dni, zabrakło wody dla wojska i dla bydła, które szło za nimi."
"2Krl3,10": "Wtedy król Izraela powiedział: Ach! Oto PAN zwołał tych trzech królów, aby oddać ich w ręce Moabu."
"2Krl3,11": "Lecz Jehoszafat rzekł: Czy nie ma tu proroka PANA, abyśmy przez niego radzili się PANA? Jeden ze sług króla Izraela odpowiedział: Jest tu Elizeusz, syn Szafata, który polewał wodą ręce Eliasza."
"2Krl3,12": "Jehoszafat powiedział: U niego jest słowo PANA. Poszli więc do niego – król Izraela, Jehoszafat i król Edomu."
"2Krl3,13": "Wtedy Elizeusz powiedział do króla Izraela: Co ja mam z tobą? Idź do proroków swojego ojca i do proroków swojej matki. Król Izraela odpowiedział: Nie, bo PAN zwołał tych trzech królów, aby oddać ich w ręce Moabu."
"2Krl3,14": "Elizeusz odpowiedział: Jak żyje PAN zastępów, przed którego obliczem stoję, gdybym nie miał względu na Jehoszafata, króla Judy, nie zważałbym na ciebie ani bym na ciebie nie spojrzał."
"2Krl3,15": "Teraz jednak przyprowadźcie mi harfiarza. A gdy harfiarz grał, spoczęła na nim ręka PANA."
"2Krl3,16": "I powiedział: Tak mówi PAN: Wykopcie w tej dolinie dużo rowów."
"2Krl3,17": "Tak bowiem mówi PAN: Nie zobaczycie wiatru ani nie zobaczycie deszczu, a jednak ta dolina napełni się wodą tak, że będziecie pić wy, wasze trzody i wasze bydło."
"2Krl3,18": "Ale to jeszcze mało w oczach PANA. Wyda także Moabitów w wasze ręce."
"2Krl3,19": "Pobijecie wszystkie obwarowane miasta i wszystkie znaczne miasta, zetniecie wszystkie dobre drzewa, zasypiecie wszystkie źródła wód i spustoszycie każde dobre pole kamieniami."
"2Krl3,20": "Rankiem, w porze składania ofiary z pokarmów, oto przypłynęły wody od strony Edomu i ziemia napełniła się wodą."
"2Krl3,21": "Kiedy wszyscy Moabici usłyszeli, że królowie wyruszyli, aby walczyć z nimi, zwołali wszystkich zdolnych do noszenia zbroi, od najmłodszych do najstarszych, i stanęli na granicy."
"2Krl3,22": "Wstali rano, a gdy słońce wzeszło nad wodą, Moabici zobaczyli z naprzeciwka wodę czerwoną jak krew."
"2Krl3,23": "I powiedzieli: To krew! Z pewnością królowie pobili się i zabili jeden drugiego. Teraz więc po łupy, o Moabie!"
"2Krl3,24": "A gdy przyszli do obozu Izraela, Izraelici powstali i pobili Moabitów, tak że ci uciekali przed nimi. Oni zaś szli naprzód, bijąc Moabitów."
"2Krl3,25": "Zburzyli miasta, na wszystkie dobre pola każdy rzucił swój kamień, aż je pokryli, zasypali wszystkie źródła wód i pościnali wszystkie dobre drzewa. Pozostały tylko kamienne mury Kir-Chareszet, ale procarze otoczyli je i zdobyli."
"2Krl3,26": "Kiedy król Moabu zobaczył, że nie podoła walce, wziął ze sobą siedmiuset mężczyzn dobywających miecz, aby się przebić do króla Edomu, ale nie zdołał."
"2Krl3,27": "Wziął więc swego pierworodnego syna, który miał królować w jego miejsce, i złożył go jako całopalenie na murze. Wtedy powstało wielkie oburzenie przeciw Izraelowi. Oni więc odstąpili od niego i wrócili do swej ziemi."
