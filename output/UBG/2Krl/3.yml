"2Krl3,1":
  text: "Joram, syn Achaba, zaczął królować nad Izraelem w Samarii w osiemnastym roku Jehoszafata, króla Judy, i królował dwanaście lat."
  tags: []
"2Krl3,2":
  text: "Czynił on to, co złe w oczach PANA, choć nie tak jak jego ojciec i matka. Usunął bowiem posąg Baala, który sporządził jego ojciec."
  tags: []
"2Krl3,3":
  text: "Trwał jednak w grzechach Jeroboama, syna Nebata, który przywiódł Izraela do grzechu, i nie odstąpił od nich."
  tags: []
"2Krl3,4":
  text: "Mesza, król Moabu, był hodowcą owiec i dawał królowi Izraela sto tysięcy jagniąt oraz sto tysięcy baranów wraz z wełną."
  tags: []
"2Krl3,5":
  text: "Lecz kiedy Achab umarł, król Moabu zbuntował się przeciw królowi Izraela."
  tags: []
"2Krl3,6":
  text: "W tym samym dniu król Joram wyszedł z Samarii i dokonał przeglądu całego Izraela."
  tags: []
"2Krl3,7":
  text: "A gdy szedł, posłał do Jehoszafata, króla Judy, taką wiadomość: Król Moabu zbuntował się przeciwko mnie. Czy wyruszysz ze mną na wojnę przeciw Moabowi? Odpowiedział: Wyruszę. Ja tak, jak i ty, mój lud tak, jak i twój lud, moje konie tak, jak i twoje konie."
  tags: []
"2Krl3,8":
  text: "I zapytał: Którą drogą pójdziemy? Odpowiedział: Drogą przez pustynię Edomu."
  tags: []
"2Krl3,9":
  text: "Wyruszyli więc król Izraela, król Judy i król Edomu. A gdy krążyli drogą przez siedem dni, zabrakło wody dla wojska i dla bydła, które szło za nimi."
  tags: []
"2Krl3,10":
  text: "Wtedy król Izraela powiedział: Ach! Oto PAN zwołał tych trzech królów, aby oddać ich w ręce Moabu."
  tags: []
"2Krl3,11":
  text: "Lecz Jehoszafat rzekł: Czy nie ma tu proroka PANA, abyśmy przez niego radzili się PANA? Jeden ze sług króla Izraela odpowiedział: Jest tu Elizeusz, syn Szafata, który polewał wodą ręce Eliasza."
  tags: []
"2Krl3,12":
  text: "Jehoszafat powiedział: U niego jest słowo PANA. Poszli więc do niego – król Izraela, Jehoszafat i król Edomu."
  tags: []
"2Krl3,13":
  text: "Wtedy Elizeusz powiedział do króla Izraela: Co ja mam z tobą? Idź do proroków swojego ojca i do proroków swojej matki. Król Izraela odpowiedział: Nie, bo PAN zwołał tych trzech królów, aby oddać ich w ręce Moabu."
  tags: []
"2Krl3,14":
  text: "Elizeusz odpowiedział: Jak żyje PAN zastępów, przed którego obliczem stoję, gdybym nie miał względu na Jehoszafata, króla Judy, nie zważałbym na ciebie ani bym na ciebie nie spojrzał."
  tags: []
"2Krl3,15":
  text: "Teraz jednak przyprowadźcie mi harfiarza. A gdy harfiarz grał, spoczęła na nim ręka PANA."
  tags: []
"2Krl3,16":
  text: "I powiedział: Tak mówi PAN: Wykopcie w tej dolinie dużo rowów."
  tags: []
"2Krl3,17":
  text: "Tak bowiem mówi PAN: Nie zobaczycie wiatru ani nie zobaczycie deszczu, a jednak ta dolina napełni się wodą tak, że będziecie pić wy, wasze trzody i wasze bydło."
  tags: []
"2Krl3,18":
  text: "Ale to jeszcze mało w oczach PANA. Wyda także Moabitów w wasze ręce."
  tags: []
"2Krl3,19":
  text: "Pobijecie wszystkie obwarowane miasta i wszystkie znaczne miasta, zetniecie wszystkie dobre drzewa, zasypiecie wszystkie źródła wód i spustoszycie każde dobre pole kamieniami."
  tags: []
"2Krl3,20":
  text: "Rankiem, w porze składania ofiary z pokarmów, oto przypłynęły wody od strony Edomu i ziemia napełniła się wodą."
  tags: []
"2Krl3,21":
  text: "Kiedy wszyscy Moabici usłyszeli, że królowie wyruszyli, aby walczyć z nimi, zwołali wszystkich zdolnych do noszenia zbroi, od najmłodszych do najstarszych, i stanęli na granicy."
  tags: []
"2Krl3,22":
  text: "Wstali rano, a gdy słońce wzeszło nad wodą, Moabici zobaczyli z naprzeciwka wodę czerwoną jak krew."
  tags: []
"2Krl3,23":
  text: "I powiedzieli: To krew! Z pewnością królowie pobili się i zabili jeden drugiego. Teraz więc po łupy, o Moabie!"
  tags: []
"2Krl3,24":
  text: "A gdy przyszli do obozu Izraela, Izraelici powstali i pobili Moabitów, tak że ci uciekali przed nimi. Oni zaś szli naprzód, bijąc Moabitów."
  tags: []
"2Krl3,25":
  text: "Zburzyli miasta, na wszystkie dobre pola każdy rzucił swój kamień, aż je pokryli, zasypali wszystkie źródła wód i pościnali wszystkie dobre drzewa. Pozostały tylko kamienne mury Kir-Chareszet, ale procarze otoczyli je i zdobyli."
  tags: []
"2Krl3,26":
  text: "Kiedy król Moabu zobaczył, że nie podoła walce, wziął ze sobą siedmiuset mężczyzn dobywających miecz, aby się przebić do króla Edomu, ale nie zdołał."
  tags: []
"2Krl3,27":
  text: "Wziął więc swego pierworodnego syna, który miał królować w jego miejsce, i złożył go jako całopalenie na murze. Wtedy powstało wielkie oburzenie przeciw Izraelowi. Oni więc odstąpili od niego i wrócili do swej ziemi."
  tags: []
