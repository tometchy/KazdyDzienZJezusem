"2Krl20,1":
  text: "W tych dniach Ezechiasz śmiertelnie zachorował. Przyszedł do niego prorok Izajasz, syn Amosa, i powiedział mu: Tak mówi PAN: Rozporządź swym domem, bo umrzesz i nie będziesz żył."
  tags: []
"2Krl20,2":
  text: "Wtedy Ezechiasz odwrócił swoją twarz do ściany i modlił się do PANA:"
  tags: []
"2Krl20,3":
  text: "O PANIE, proszę cię, wspomnij teraz, że postępowałem wobec ciebie w prawdzie i z doskonałym sercem, czyniąc to, co dobre w twoich oczach. I płakał Ezechiasz rzewnie."
  tags: []
"2Krl20,4":
  text: "Ale zanim Izajasz wyszedł do środkowego dziedzińca, doszło do niego słowo PANA:"
  tags: []
"2Krl20,5":
  text: "Wróć i powiedz Ezechiaszowi, wodzowi mego ludu: Tak mówi PAN, Bóg Dawida, twego ojca: Wysłuchałem twojej modlitwy i widziałem twoje łzy. Oto uzdrawiam cię: trzeciego dnia wejdziesz do domu PANA."
  tags: []
"2Krl20,6":
  text: "Dodam też do twoich dni piętnaście lat i wybawię ciebie i to miasto z ręki króla Asyrii. I będę bronić tego miasta ze względu na siebie i ze względu na Dawida, swego sługę."
  tags: []
"2Krl20,7":
  text: "Następnie Izajasz powiedział: Przynieście garstkę suchych fig. Gdy wzięli je i położyli na wrzód, wyzdrowiał."
  tags: []
"2Krl20,8":
  text: "Ezechiasz zapytał Izajasza: Jaki będzie znak tego, że PAN mnie uzdrowi i że na trzeci dzień pójdę do domu PANA?"
  tags: []
"2Krl20,9":
  text: "Izajasz odpowiedział: To będzie znakiem od PANA, że uczyni PAN tę rzecz, którą obiecał: Czy cień ma się posunąć o dziesięć stopni, czy ma się cofnąć o dziesięć stopni?"
  tags: []
"2Krl20,10":
  text: "Ezechiasz odpowiedział: Łatwo cieniowi posunąć się o dziesięć stopni. Nie – niech cień cofnie się o dziesięć stopni."
  tags: []
"2Krl20,11":
  text: "Wtedy prorok Izajasz zawołał do PANA. I on cofnął cień o dziesięć stopni, po których przesunął się na zegarze słonecznym Achaza."
  tags: []
"2Krl20,12":
  text: "W tym czasie Berodach-Baladan, syn Baladana, król Babilonu, posłał listy i dar do Ezechiasza. Usłyszał bowiem, że Ezechiasz chorował."
  tags: []
"2Krl20,13":
  text: "I Ezechiasz wysłuchał posłańców, i pokazał im cały skarbiec swoich kosztowności, srebro, złoto, wonności, drogocenne olejki oraz swoją zbrojownię, a także wszystko, co się znajdowało w jego składach. Nie było nic, czego Ezechiasz by im nie pokazał w swoim domu i w całym swoim państwie."
  tags: []
"2Krl20,14":
  text: "Wtedy prorok Izajasz przyszedł do króla Ezechiasza i zapytał go: Co powiedzieli ci mężczyźni i skąd przybyli do ciebie? Ezechiasz odpowiedział: Przybyli z dalekiej ziemi, z Babilonu."
  tags: []
"2Krl20,15":
  text: "Znowu zapytał: Co widzieli w twoim domu? Ezechiasz odpowiedział: Widzieli wszystko, co jest w moim domu. Nie było nic, czego bym im nie pokazał w swoich skarbcach."
  tags: []
"2Krl20,16":
  text: "Wtedy Izajasz powiedział do Ezechiasza: Słuchaj słowa PANA."
  tags: []
"2Krl20,17":
  text: "Oto przyjdą dni, kiedy wszystko, co jest w twoim domu i co zgromadzili twoi ojcowie aż do tego dnia, zostanie zabrane do Babilonu. Nic nie pozostanie, mówi PAN."
  tags: []
"2Krl20,18":
  text: "Z twoich synów, którzy będą pochodzić od ciebie i których spłodzisz, zabiorą niektórych i będą eunuchami w pałacu króla Babilonu."
  tags: []
"2Krl20,19":
  text: "Wtedy Ezechiasz powiedział do Izajasza: Dobre jest słowo PANA, które wypowiedziałeś. I dodał: Czyż ono nie jest dobre, jeśli za moich dni będzie pokój i prawda?"
  tags: []
"2Krl20,20":
  text: "A pozostałe dzieje Ezechiasza, cała jego potęga i to, jak zbudował sadzawkę i kanał, którymi sprowadził wodę do miasta, czy nie są zapisane w księdze kronik królów Judy?"
  tags: []
"2Krl20,21":
  text: "I Ezechiasz zasnął ze swoimi ojcami, a jego syn Manasses królował w jego miejsce."
  tags: []
