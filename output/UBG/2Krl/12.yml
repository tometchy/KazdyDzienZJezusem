"2Krl12,1": "W siódmym roku Jehu zaczął królować Jehoasz i królował czterdzieści lat w Jerozolimie. Jego matka miała na imię Sibia, była z Beer-Szeby."
"2Krl12,2": "Jehoasz czynił to, co słuszne w oczach PANA, przez wszystkie swoje dni, w których uczył go kapłan Jehojada."
"2Krl12,3": "Wyżyn jednak nie zniesiono i lud jeszcze składał ofiary, i palił kadzidło na tych wyżynach."
"2Krl12,4": "I Jehoasz powiedział do kapłanów: Wszystkie pieniądze z ofiar poświęconych, które przynoszone są do domu PANA, pieniądze tych, którzy są spisani, pieniądze każdego według jego oszacowania i wszystkie pieniądze, które ktokolwiek dobrowolnie wnosi do domu PANA;"
"2Krl12,5": "Niech wezmą dla siebie kapłani, każdy od swego znajomego, i niech naprawią szkody domu PANA, gdziekolwiek taka szkoda się znajdzie."
"2Krl12,6": "Lecz jeszcze w dwudziestym trzecim roku króla Jehoasza kapłani nie naprawili szkód domu."
"2Krl12,7": "Wtedy król Jehoasz wezwał kapłana Jehojadę oraz pozostałych kapłanów i mówił do nich: Czemu nie naprawiacie szkód domu? Teraz więc nie bierzcie pieniędzy od swoich znajomych, ale oddajcie je na naprawę szkód domu."
"2Krl12,8": "I kapłani zgodzili się na to, aby nie brać pieniędzy od ludu, oraz na to, że nie będą naprawiali szkód domu."
"2Krl12,9": "Wtedy kapłan Jehojada wziął jedną skrzynię, zrobił otwór w jej wieku i postawił ją przy ołtarzu po prawej stronie, którędy wchodzono do domu PANA. Kapłani zaś, którzy strzegli progu, wrzucali tam wszystkie pieniądze, które wnoszono do domu PANA."
"2Krl12,10": "A gdy widzieli, że w skrzyni było dużo pieniędzy, przychodził pisarz króla i najwyższy kapłan, którzy liczyli i chowali pieniądze znajdujące się w domu PANA."
"2Krl12,11": "I odważone pieniądze dawali do rąk kierowników robót, przełożonych nad domem PANA. Ci zaś wydawali je na cieśli i budowniczych, którzy naprawiali dom PANA;"
"2Krl12,12": "Na murarzy, na kamieniarzy, na kupno drewna i ciosanych kamieni do naprawy szkód w domu PANA i na wszelkie inne wydatki związane z naprawą tego domu."
"2Krl12,13": "Jednakże z pieniędzy, które przynoszono do domu PANA, nie sporządzono dla domu PANA srebrnych mis, nożyc, czasz, trąb ani żadnych złotych i srebrnych naczyń;"
"2Krl12,14": "Lecz dawano je robotnikom, którzy naprawiali za nie dom PANA."
"2Krl12,15": "I nie rozliczano ludzi, którym dawano pieniądze do ręki na opłacenie robotników, ponieważ postępowali uczciwie."
"2Krl12,16": "Lecz pieniędzy z ofiar za występek i pieniędzy z ofiar za grzech nie wnoszono do domu PANA, lecz należały do kapłanów."
"2Krl12,17": "Wtedy Chazael, król Syrii, wyruszył, aby walczyć z Gat i zdobył je. Potem Chazael postanowił wyruszyć przeciw Jerozolimie."
"2Krl12,18": "Jehoasz, król Judy, wziął więc wszystkie rzeczy poświęcone, które poświęcili Jehoszafat, Joram i Achazjasz, jego ojcowie, królowie Judy, i to, co sam poświęcił, oraz całe złoto, które znalazło się w skarbcach domu PANA i domu króla, i posłał to do Chazaela, króla Syrii. I ten wycofał się z Jerozolimy."
"2Krl12,19": "A pozostałe dzieje Jehoasza i wszystko, co czynił, czy nie są zapisane w kronikach królów Judy?"
"2Krl12,20": "Potem jego słudzy powstali i uknuli spisek przeciwko niemu, i zabili Joasza w domu na Millo, na drodze schodzącej do Silla;"
"2Krl12,21": "Jozachar, syn Szimeat, i Jozabad, syn Szomer, byli właśnie tymi sługami, którzy zabili go. A pogrzebali go z jego ojcami w mieście Dawida, a jego syn Amazjasz królował w jego miejsce."
