"2Krl23,1":
  text: "Wtedy król posłał, aby zebrali się wokół niego wszyscy starsi Judy i Jerozolimy."
  tags: []
"2Krl23,2":
  text: "Następnie król udał się do domu PANA, a wraz z nim wszyscy mężczyźni Judy, wszyscy mieszkańcy Jerozolimy, kapłani, prorocy oraz cały lud – od najmniejszych do największych. I czytał do ich uszu wszystkie słowa księgi przymierza, którą znaleziono w domu PANA."
  tags: []
"2Krl23,3":
  text: "Potem król stanął przy kolumnie i zawarł przymierze przed PANEM, że będą szli za PANEM i będą przestrzegać jego przykazań, świadectw i nakazów z całego serca i całą duszą i wypełniać słowa przymierza, które zostały napisane w tej księdze. I cały lud przystąpił do przymierza."
  tags: []
"2Krl23,4":
  text: "Wtedy król nakazał najwyższemu kapłanowi Chilkiaszowi, kapłanom drugiego rzędu i stróżom progu wynieść ze świątyni PANA wszystkie przedmioty wykonane dla Baala, do gaju i dla całego zastępu niebieskiego. I spalił je poza Jerozolimą na polu Cedronu, i zaniósł ich popiół do Betel."
  tags: []
"2Krl23,5":
  text: "Zwolnił też z urzędu bałwochwalczych kapłanów, których ustanowili królowie Judy, aby palili kadzidło na wyżynach w miastach Judy i w okolicach Jerozolimy, oraz tych, którzy palili kadzidło Baalowi, słońcu, księżycowi, planetom i całemu zastępowi niebieskiemu."
  tags: []
"2Krl23,6":
  text: "Wyniósł gaj z domu PANA poza Jerozolimę, do potoku Cedron, i spalił go przy potoku Cedron, starł go na proch i rozrzucił na grobach synów ludu."
  tags: []
"2Krl23,7":
  text: "Zburzył też domy sodomitów, które znajdowały się przy domu PANA, gdzie kobiety tkały zasłony do gaju."
  tags: []
"2Krl23,8":
  text: "I zwołał wszystkich kapłanów z miast Judy, i splugawił wyżyny, na których kapłani palili kadzidło, od Geba aż do Beer-Szeby, i zburzył wyżyny przy bramach znajdujących się u wejścia bramy Jozuego, namiestnika miasta, po lewej stronie, gdy się wchodzi przez bramę miejską."
  tags: []
"2Krl23,9":
  text: "Jednakże kapłani wyżyn nie przystąpili do ołtarza PANA w Jerozolimie, ale mogli jeść przaśne chleby wśród swoich braci."
  tags: []
"2Krl23,10":
  text: "Splugawił również Tofet, które było w dolinie syna Hinnom, aby nikt więcej nie przeprowadził swego syna ani córki przez ogień ku czci Molocha."
  tags: []
"2Krl23,11":
  text: "Usunął też konie, które królowie Judy poświęcili słońcu u wejścia do domu PANA, obok komnaty dworzanina Natanmeleka, która była na przedmieściu, a rydwany słońca spalił ogniem."
  tags: []
"2Krl23,12":
  text: "Król zburzył także ołtarze, które znajdowały się na dachu górnej komnaty Achaza, zbudowane przez królów Judy, oraz ołtarze, które uczynił Manasses w obu dziedzińcach domu PANA. Usunął je stamtąd i wrzucił ich proch do potoku Cedron."
  tags: []
"2Krl23,13":
  text: "Król splugawił wyżyny, które stały przed Jerozolimą po prawej stronie Góry Zatracenia i które zbudował Salomon, król Izraela, dla Asztarty, obrzydliwości Sydończyków, dla Kemosza, obrzydliwości Moabitów, i dla Milkoma, obrzydliwości synów Ammona."
  tags: []
"2Krl23,14":
  text: "I pokruszył posągi, powycinał gaje, a ich miejsca napełnił kośćmi ludzkimi."
  tags: []
"2Krl23,15":
  text: "Ponadto ołtarz, który był w Betel, i wyżynę uczynioną przez Jeroboama, syna Nebata, który przywiódł Izraela do grzechu – także ten ołtarz i wyżynę zburzył. Spalił wyżynę, starł na proch i spalił gaj."
  tags: []
"2Krl23,16":
  text: "A gdy Jozjasz odwrócił się, zobaczył groby, które były tam na górze. Posłał i zabrał kości z tych grobów, i spalił je na ołtarzu, plugawiąc go zgodnie ze słowem PANA wygłoszonym przez męża Bożego, który wypowiedział te rzeczy."
  tags: []
"2Krl23,17":
  text: "I zapytał: Co to za napis, który widzę? Ludzie z tego miasta odpowiedzieli: To grób męża Bożego, który przyszedł z Judy i zapowiedział rzeczy, które wykonałeś nad ołtarzem w Betel."
  tags: []
"2Krl23,18":
  text: "Wtedy powiedział: Zostawcie go, niech nikt nie rusza jego kości. Pozostawiono więc jego kości wraz z kośćmi proroka, który przybył z Samarii."
  tags: []
"2Krl23,19":
  text: "Jozjasz usunął też wszystkie świątynie na wyżynach, które były w miastach Samarii zbudowanych przez królów Izraela, aby drażnić PANA. Postąpił z nimi tak samo, jak uczynił w Betel."
  tags: []
"2Krl23,20":
  text: "Pozabijał także wszystkich kapłanów wyżyn, którzy tam byli przy ołtarzach, i spalił na nich ludzkie kości. Potem wrócił do Jerozolimy."
  tags: []
"2Krl23,21":
  text: "I król nakazał całemu ludowi: Obchodźcie święto Paschy dla PANA, waszego Boga, tak jak jest napisane w księdze tego przymierza."
  tags: []
"2Krl23,22":
  text: "Takiej Paschy nie obchodzono od czasów sędziów, którzy sądzili Izraela, i przez wszystkie dni królów Izraela i królów Judy."
  tags: []
"2Krl23,23":
  text: "Dopiero w osiemnastym roku króla Jozjasza obchodzono taką Paschę dla PANA w Jerozolimie."
  tags: []
"2Krl23,24":
  text: "Jozjasz usunął również czarowników, wróżbiarzy, posągi, bożki i wszystkie obrzydliwości, które widziano w ziemi Judy i w Jerozolimie, aby wypełnić słowa prawa napisane w księdze, którą znalazł kapłan Chilkiasz w domu PANA."
  tags: []
"2Krl23,25":
  text: "I nie było przed nim króla podobnego do niego, który by wrócił do PANA z całego swego serca, całą swoją duszą i z całej swojej siły, według całego Prawa Mojżesza, i po nim nie powstał nikt jemu podobny."
  tags: []
"2Krl23,26":
  text: "PAN jednak nie odwrócił się od zapalczywości swego wielkiego gniewu, którym zapłonął przeciwko Judzie z powodu wszelkich zniewag, którymi rozdrażnił go Manasses."
  tags: []
"2Krl23,27":
  text: "PAN więc powiedział: Również Judę odrzucę sprzed swojego oblicza, jak odrzuciłem Izraela, i wzgardzę tym miastem, które wybrałem, Jerozolimą, i domem tym, o którym powiedziałem: Tam będzie moje imię."
  tags: []
"2Krl23,28":
  text: "A pozostałe dzieje Jozjasza i wszystko, co czynił, czy nie są zapisane w księdze kronik królów Judy?"
  tags: []
"2Krl23,29":
  text: "Za jego dni faraon Necho, król Egiptu, wyruszył przeciwko królowi Asyrii nad rzekę Eufrat. Król Jozjasz wyruszył przeciwko niemu, a gdy ten go zobaczył, zabił go w Megiddo."
  tags: []
"2Krl23,30":
  text: "I jego słudzy przewieźli go zmarłego z Megiddo, sprowadzili go do Jerozolimy i pogrzebali w jego grobie. Potem lud tej ziemi wziął Jehoachaza, syna Jozjasza, namaścił go i ustanowił go królem w miejsce jego ojca."
  tags: []
"2Krl23,31":
  text: "Jehoachaz miał dwadzieścia trzy lata, kiedy zaczął królować, i królował trzy miesiące w Jerozolimie. Jego matka miała na imię Chamutal i była córką Jeremiasza z Libny."
  tags: []
"2Krl23,32":
  text: "Czynił on to, co złe w oczach PANA, zupełnie tak, jak czynili jego ojcowie."
  tags: []
"2Krl23,33":
  text: "Faraon Necho uwięził go w Ribla w ziemi Chamat, aby nie królował w Jerozolimie, i nałożył na ziemię daninę w wysokości stu talentów srebra i jednego talentu złota."
  tags: []
"2Krl23,34":
  text: "Faraon Necho ustanowił królem Eliakima, syna Jozjasza, w miejsce jego ojca Jozjasza, i zmienił jego imię na Joakim, a Jehoachaza zabrał. Ten przyszedł do Egiptu i tam umarł."
  tags: []
"2Krl23,35":
  text: "A Joakim dał faraonowi srebro i złoto, ale opodatkował ziemię, aby mógł oddać pieniądze według rozkazu faraona. Pobierał srebro i złoto od ludu ziemi, od każdego według oszacowania, aby je oddać faraonowi Necho."
  tags: []
"2Krl23,36":
  text: "Joakim miał dwadzieścia pięć lat, kiedy zaczął królować, i królował jedenaście lat w Jerozolimie. Jego matka miała na imię Zebidda i była córką Pedajasza z Rumy."
  tags: []
"2Krl23,37":
  text: "Czynił on to, co złe w oczach PANA, zupełnie tak, jak czynili jego ojcowie."
  tags: []
