"2Krl25,1": "W dziewiątym roku jego panowania, dziesiątego miesiąca, dziesiątego dnia tego miesiąca, Nabuchodonozor, król Babilonu, wraz z całym swoim wojskiem wyruszył przeciw Jerozolimie, rozbił obóz pod nią i zbudował przeciwko niej szańce dokoła."
"2Krl25,2": "I miasto było oblężone aż do jedenastego roku króla Sedekiasza."
"2Krl25,3": "A w dziewiątym dniu czwartego miesiąca wzmógł się głód w mieście i nie było chleba dla ludu tej ziemi."
"2Krl25,4": "Kiedy zrobiono wyłom w murze miasta, wszyscy wojownicy uciekli w nocy przez bramę między dwoma murami obok królewskiego ogrodu. Chaldejczycy zaś znajdowali się dokoła miasta, a król uszedł w stronę pustyni."
"2Krl25,5": "I wojsko Chaldejczyków ścigało króla, i dogoniło go na równinach Jerycha, a całe jego wojsko rozpierzchło się od niego."
"2Krl25,6": "Pojmali więc króla i przyprowadzili go do króla Babilonu, do Ribla, gdzie ten wydał na niego wyrok."
"2Krl25,7": "I synów Sedekiasza zabili na jego oczach, a Sedekiaszowi wyłupili oczy, zakuli go spiżowymi łańcuchami i uprowadzili do Babilonu."
"2Krl25,8": "W piątym miesiącu, siódmego dnia tego miesiąca – był to dziewiętnasty rok Nabuchodonozora, króla Babilonu – do Jerozolimy przybył Nebuzaradan, dowódca gwardii, sługa króla Babilonu;"
"2Krl25,9": "I spalił dom PANA i dom króla; wszystkie domy Jerozolimy i wszystkie wielkie budowle spalił ogniem."
"2Krl25,10": "Całe wojsko Chaldejczyków, które było z dowódcą gwardii, zburzyło mury wokół Jerozolimy."
"2Krl25,11": "Resztę ludu, która pozostała w mieście, zbiegów, którzy przeszli do króla Babilonu, oraz resztę pospólstwa Nebuzaradan, dowódca gwardii, uprowadził do niewoli."
"2Krl25,12": "Lecz dowódca gwardii pozostawił niektórych spośród ubogich tej ziemi, aby byli winogrodnikami i rolnikami."
"2Krl25,13": "Chaldejczycy rozbili kolumny z brązu, które były w domu PANA, podstawy i morze z brązu, które było w domu PANA, a brąz z nich przenieśli do Babilonu."
"2Krl25,14": "Zabrali też kotły, szufle, nożyce, miski oraz wszystkie naczynia z brązu, których używano do służby."
"2Krl25,15": "Dowódca gwardii zabrał kadzielnice, miednice i to, co było ze złota, jako złoto, i to, co było ze srebra, jako srebro;"
"2Krl25,16": "Dwie kolumny, jedno morze, podstawy, które wykonał Salomon dla domu PANA, a nie było można zmierzyć wagi brązu tych wszystkich przedmiotów."
"2Krl25,17": "Osiemnaście łokci wysokości miała jedna kolumna, a głowica na niej była z brązu. Wysokość głowicy wynosiła trzy łokcie, a siatka i jabłka granatu naokoło głowicy – wszystko było z brązu. Tak samo było na siatce drugiej kolumny."
"2Krl25,18": "Dowódca gwardii zabrał też najwyższego kapłana Serajasza, drugiego kapłana Sofoniasza i trzech stróżów progu."
"2Krl25,19": "Z miasta zaś zabrał dworzanina, który był przełożonym nad wojownikami, pięciu spośród tych, którzy stawali przed królem, a znaleziono ich w mieście, naczelnego pisarza wojskowego dokonującego poboru ludu tej ziemi oraz sześćdziesięciu mężczyzn spośród ludu tej ziemi, których znaleziono w mieście."
"2Krl25,20": "Tych pojmał Nebuzaradan, dowódca gwardii, i zaprowadził do króla Babilonu do Ribla."
"2Krl25,21": "I król Babilonu pobił ich, i uśmiercił w Ribla, w ziemi Chamat. Tak został uprowadzony Juda ze swojej ziemi."
"2Krl25,22": "Nad ludem zaś, który jeszcze pozostał w ziemi Judy, a który Nabuchodonozor, król Babilonu, zostawił, ustanowił on Gedaliasza, syna Achikama, syna Szafana."
"2Krl25,23": "A gdy wszyscy dowódcy wojska usłyszeli, oni i ich ludzie, że król Babilonu ustanowił Gedaliasza namiestnikiem, przyszli do Gedaliasza do Mispy. Byli to: Izmael, syn Netaniasza, Jochanan, syn Kareacha, Serajasz, syn Tanchumeta Netofatyta, i Jaazaniasz, syn Maakatczyka, oni i ich ludzie."
"2Krl25,24": "Wtedy Gedaliasz przysiągł im i ich ludziom: Nie bójcie się służyć Chaldejczykom. Mieszkajcie w ziemi i służcie królowi Babilonu, a będzie wam dobrze."
"2Krl25,25": "Lecz w siódmym miesiącu przybył Izmael, syn Netaniasza, syna Eliszamy, z rodu królewskiego, a z nim dziesięciu ludzi, i pobili Gedaliasza, i umarł, a także Żydów i Chaldejczyków, którzy byli z nim w Mispie."
"2Krl25,26": "Wówczas cały lud, od najmniejszego do największego, oraz dowódcy wojsk powstali i poszli do Egiptu, bo się bali Chaldejczyków."
"2Krl25,27": "A w trzydziestym siódmym roku uprowadzenia Joachina, króla Judy, dwunastego miesiąca dwudziestego siódmego dnia tego miesiąca, Ewil-Merodak, król Babilonu, w pierwszym roku jego panowania, ułaskawił Joachina, króla Judy, i wypuścił go z więzienia."
"2Krl25,28": "Rozmawiał z nim łaskawie i wystawił jego tron ponad tron innych królów, którzy byli z nim w Babilonie."
"2Krl25,29": "Zdjął też jego szaty więzienne i jadł chleb zawsze w jego obecności przez wszystkie dni swego życia."
"2Krl25,30": "Codziennie otrzymywał od króla stałe utrzymanie, przez wszystkie dni swego życia."
