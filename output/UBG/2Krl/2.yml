"2Krl2,1":
  text: "I kiedy PAN miał unieść Eliasza wśród wichru do nieba, Eliasz wyruszył z Elizeuszem z Gilgal."
  tags: []
"2Krl2,2":
  text: "I Eliasz powiedział do Elizeusza: Proszę, zostań tu, bo PAN posyła mnie do Betel. Elizeusz odpowiedział: Jak żyje PAN i jak żyje twoja dusza, nie opuszczę cię. Przyszli więc do Betel."
  tags: []
"2Krl2,3":
  text: "Wtedy synowie proroków, którzy byli w Betel, wyszli do Elizeusza i zapytali go: Czy wiesz, że PAN dzisiaj zabierze twego pana znad twojej głowy? Odpowiedział: Wiem, lecz milczcie."
  tags: []
"2Krl2,4":
  text: "A Eliasz ponownie powiedział mu: Elizeuszu, proszę, zostań tu, bo PAN posyła mnie do Jerycha. Odpowiedział: Jak żyje PAN i jak żyje twoja dusza, nie opuszczę cię. Przyszli więc do Jerycha."
  tags: []
"2Krl2,5":
  text: "Wtedy synowie proroków, którzy byli w Jerychu, zapytali Elizeusza: Czy wiesz, że PAN dzisiaj zabierze twego pana znad twojej głowy? Odpowiedział: Tak, wiem, lecz milczcie."
  tags: []
"2Krl2,6":
  text: "Eliasz znowu powiedział mu: Proszę, zostań tu, bo PAN posyła mnie do Jordanu. Odpowiedział: Jak żyje PAN i jak żyje twoja dusza, nie opuszczę cię. Szli więc dalej obydwaj."
  tags: []
"2Krl2,7":
  text: "A pięćdziesięciu mężów spośród synów proroków poszło i stanęło naprzeciwko nich z daleka. Oni zaś obaj stanęli nad Jordanem."
  tags: []
"2Krl2,8":
  text: "Wtedy Eliasz wziął swój płaszcz, zwinął go i uderzył nim wody, a one rozdzieliły się w obydwie strony, tak że przeszli obaj po suchej ziemi."
  tags: []
"2Krl2,9":
  text: "A gdy przeszli, Eliasz powiedział do Elizeusza: Proś o to, co mam dla ciebie uczynić, zanim będę od ciebie zabrany. Elizeusz odpowiedział: Proszę, niech spocznie na mnie podwójna część twojego ducha;"
  tags: []
"2Krl2,10":
  text: "On zaś powiedział: Poprosiłeś o trudną rzecz. Jeśli mnie zobaczysz, gdy będę zabierany od ciebie, tak ci się stanie. Lecz jeśli nie, to się nie stanie."
  tags: []
"2Krl2,11":
  text: "Kiedy więc szli i rozmawiali, oto ognisty rydwan i ogniste konie oddzieliły ich obu. I Eliasz wstąpił wśród wichru do nieba."
  tags: []
"2Krl2,12":
  text: "Elizeusz zaś zobaczył to i zawołał: Mój ojcze, mój ojcze! Rydwanie Izraela i jego jeźdźcze. I nie zobaczył go już więcej. Chwycił swoje szaty i rozdarł je na dwie części."
  tags: []
"2Krl2,13":
  text: "Potem podniósł płaszcz Eliasza, który spadł z niego, zawrócił i stanął nad brzegiem Jordanu;"
  tags: []
"2Krl2,14":
  text: "I wziął płaszcz Eliasza, który spadł z niego, uderzył nim wody i powiedział: Gdzie jest PAN, Bóg Eliasza? Również gdy on uderzył nim wody, rozdzieliły się na dwie strony. I Elizeusz przeszedł."
  tags: []
"2Krl2,15":
  text: "A gdy synowie proroków, którzy byli w Jerychu, zobaczyli go z naprzeciwka, powiedzieli: Duch Eliasza spoczął na Elizeuszu. Wyruszyli mu więc naprzeciw i pokłonili mu się aż do ziemi."
  tags: []
"2Krl2,16":
  text: "I powiedzieli do niego: Oto teraz wśród twoich sług jest pięćdziesięciu dzielnych mężczyzn. Proszę, niech idą i niech szukają twego pana; może Duch PANA uniósł go i spuścił na jakąś górę albo w jakąś dolinę. Lecz on powiedział: Nie posyłajcie."
  tags: []
"2Krl2,17":
  text: "A gdy tak nalegali, aż do uprzykrzenia, powiedział: Poślijcie. Posłali więc tych pięćdziesięciu mężczyzn, którzy szukali przez trzy dni, lecz nie znaleźli go."
  tags: []
"2Krl2,18":
  text: "A gdy wrócili do niego – bo przebywał w Jerychu – powiedział do nich: Czyż nie mówiłem wam: Nie idźcie?"
  tags: []
"2Krl2,19":
  text: "Potem ludzie tego miasta powiedzieli do Elizeusza: Oto położenie tego miasta jest dobre – jak ty, mój panie, widzisz. Lecz woda jest niedobra i ziemia nieurodzajna."
  tags: []
"2Krl2,20":
  text: "Wtedy powiedział: Przynieście mi nowy dzbanek i włóżcie do niego soli. I przynieśli mu."
  tags: []
"2Krl2,21":
  text: "Wówczas poszedł do źródła wód, wrzucił do niego sól i powiedział: Tak mówi PAN: Uzdrowiłem te wody, już nie wyjdzie stąd ani śmierć, ani nieurodzaj."
  tags: []
"2Krl2,22":
  text: "Wody więc zostały uzdrowione i są takie aż do dziś, według słowa Elizeusza, które wypowiedział."
  tags: []
"2Krl2,23":
  text: "Potem wyruszył stamtąd do Betel. A gdy podążał drogą, małe dzieci wyszły z miasta i naśmiewały się z niego, mówiąc mu: Wstąp łysy, wstąp łysy!"
  tags: []
"2Krl2,24":
  text: "On zaś odwrócił się, spojrzał na nie i przeklął je w imieniu PANA. Wtedy dwie niedźwiedzice wyszły z lasu i rozszarpały czterdzieścioro dwoje dzieci spośród nich."
  tags: []
"2Krl2,25":
  text: "Stamtąd poszedł na górę Karmel, skąd wrócił do Samarii."
  tags: []
