"2Krl15,1":
  text: "W dwudziestym siódmym roku Jeroboama, króla Izraela, Azariasz, syn Amazjasza, króla Judy, zaczął królować."
  tags: []
"2Krl15,2":
  text: "Miał szesnaście lat, kiedy zaczął królować, i królował pięćdziesiąt dwa lata w Jerozolimie. Jego matka miała na imię Jekolia, była z Jerozolimy."
  tags: []
"2Krl15,3":
  text: "Czynił on to, co słuszne w oczach PANA, wszystko tak jak czynił Amazjasz, jego ojciec."
  tags: []
"2Krl15,4":
  text: "Wyżyn jednak nie zniesiono. Lud jeszcze składał ofiary i palił kadzidło na wyżynach."
  tags: []
"2Krl15,5":
  text: "I PAN dotknął króla – i był trędowaty aż do dnia swojej śmierci, i mieszkał w odosobnionym domu. Jotam więc, syn króla, zarządzał domem i sądził lud ziemi."
  tags: []
"2Krl15,6":
  text: "A pozostałe dzieje Azariasza i wszystko, co czynił, czy nie są zapisane w księdze kronik królów Judy?"
  tags: []
"2Krl15,7":
  text: "I Azariasz zasnął ze swymi ojcami, i pogrzebano go wraz z nimi w mieście Dawida, a Jotam, jego syn, królował w jego miejsce."
  tags: []
"2Krl15,8":
  text: "W trzydziestym ósmym roku Azariasza, króla Judy, Zachariasz, syn Jeroboama, zaczął królować nad Izraelem w Samarii i królował sześć miesięcy."
  tags: []
"2Krl15,9":
  text: "I czynił to, co złe w oczach PANA, jak czynili jego ojcowie. Nie odstąpił od grzechów Jeroboama, syna Nebata, który przywiódł Izraela do grzechu."
  tags: []
"2Krl15,10":
  text: "Szallum, syn Jabesza, uknuł przeciwko niemu spisek i zranił go przed ludem, zabił go i królował w jego miejsce."
  tags: []
"2Krl15,11":
  text: "A pozostałe dzieje Zachariasza oto są zapisane w księdze kronik królów Izraela."
  tags: []
"2Krl15,12":
  text: "Takie było słowo PANA, które wypowiedział do Jehu: Twoi synowie do czwartego pokolenia będą zasiadać na tronie Izraela. I tak się stało."
  tags: []
"2Krl15,13":
  text: "Szallum, syn Jabesza, zaczął królować w trzydziestym dziewiątym roku Uzjasza, króla Judy, i królował jeden miesiąc w Samarii."
  tags: []
"2Krl15,14":
  text: "Bo Menachem, syn Gadiego, przyszedł z Tirsy i wszedł do Samarii, i pobił Szalluma, syna Jabesza w Samarii, zabił go i królował w jego miejsce."
  tags: []
"2Krl15,15":
  text: "A pozostałe dzieje Szalluma i jego spisek, który uknuł, oto są zapisane w księdze kronik królów Izraela."
  tags: []
"2Krl15,16":
  text: "Wtedy Menachem pobił Tifsach i wszystkich, którzy w nim byli, oraz wszystkie jego okolice, począwszy od Tirsy, gdyż nie otworzyli mu bram – dlatego je pobił, a wszystkie brzemienne mieszkanki rozpruwał."
  tags: []
"2Krl15,17":
  text: "W trzydziestym dziewiątym roku Azariasza, króla Judy, Menachem, syn Gadiego, zaczął królować nad Izraelem i królował dziesięć lat w Samarii."
  tags: []
"2Krl15,18":
  text: "Czynił on to, co złe w oczach PANA. Przez wszystkie swoje dni nie odstąpił od grzechów Jeroboama, syna Nebata, który przywodził Izraela do grzechu."
  tags: []
"2Krl15,19":
  text: "A gdy Pul, król Asyrii, napadł na ziemię, Menachem dał Pulowi tysiąc talentów srebra, aby ten mu pomógł umocnić królestwo w swoim ręku."
  tags: []
"2Krl15,20":
  text: "I Menachem wymusił te pieniądze od Izraela, od wszystkich zamożnych – po pięćdziesiąt syklów srebra od każdego – aby je dać królowi Asyrii. Wycofał się więc król Asyrii i nie pozostał w tej ziemi."
  tags: []
"2Krl15,21":
  text: "A pozostałe dzieje Menachema i wszystko, co czynił, czy nie są zapisane w księdze kronik królów Izraela?"
  tags: []
"2Krl15,22":
  text: "I Menachem zasnął ze swymi ojcami, a Pekachiasz, jego syn, królował w jego miejsce."
  tags: []
"2Krl15,23":
  text: "W pięćdziesiątym roku Azariasza, króla Judy, Pekachiasz, syn Menachema, zaczął królować nad Izraelem w Samarii i królował dwa lata."
  tags: []
"2Krl15,24":
  text: "Czynił on to, co złe w oczach PANA. Nie odstąpił od grzechów Jeroboama, syna Nebata, który przywiódł Izraela do grzechu."
  tags: []
"2Krl15,25":
  text: "A Pekach, syn Remaliasza, jego dowódca, uknuł spisek przeciwko niemu i zabił go w Samarii, w pałacu domu królewskiego, a wraz z nim Argoba i Aria oraz pięćdziesięciu ludzi spośród Gileadczyków. Zabił go i królował po nim."
  tags: []
"2Krl15,26":
  text: "A pozostałe dzieje Pekachiasza i wszystko, co czynił, oto są zapisane w księdze kronik królów Izraela."
  tags: []
"2Krl15,27":
  text: "W pięćdziesiątym drugim roku Azariasza, króla Judy, Pekach, syn Remaliasza, zaczął królować nad Izraelem w Samarii i królował dwadzieścia lat."
  tags: []
"2Krl15,28":
  text: "Czynił on to, co złe w oczach PANA. Nie odstąpił od grzechów Jeroboama, syna Nebata, który przywiódł Izraela do grzechu."
  tags: []
"2Krl15,29":
  text: "Za dni Pekacha, króla Izraela, nadciągnął Tiglat-Pileser, król Asyrii, i zdobył Ijon, Abel-Bet-Maaka, Janoach, Kedesz, Chasor, Gilead i Galileę, i całą ziemię Neftalego, a pojmanych uprowadził do Asyrii."
  tags: []
"2Krl15,30":
  text: "Wtedy Ozeasz, syn Eli, uknuł spisek przeciwko Pekachowi, synowi Remaliasza. Pobił go i zabił, i zaczął królować w jego miejsce w dwudziestym roku Jotama, syna Uzjasza."
  tags: []
"2Krl15,31":
  text: "A pozostałe dzieje Pekacha i wszystko, co czynił, oto są zapisane w księdze kronik królów Izraela."
  tags: []
"2Krl15,32":
  text: "W drugim roku Pekacha, syna Remaliasza, króla Izraela, Jotam, syn Uzjasza, króla Judy, zaczął królować."
  tags: []
"2Krl15,33":
  text: "Miał dwadzieścia pięć lat, kiedy zaczął królować, i królował szesnaście lat w Jerozolimie. Jego matka miała na imię Jerusza i była córką Sadoka."
  tags: []
"2Krl15,34":
  text: "Czynił on to, co słuszne w oczach PANA. Czynił wszystko tak, jak czynił Uzjasz, jego ojciec."
  tags: []
"2Krl15,35":
  text: "Wyżyn jednak nie zniesiono. Lud jeszcze składał ofiary i palił kadzidło na wyżynach. On zbudował Górną Bramę domu PANA."
  tags: []
"2Krl15,36":
  text: "A pozostałe dzieje Jotama i wszystko, co czynił, są zapisane w księdze kronik królów Judy."
  tags: []
"2Krl15,37":
  text: "W tych dniach PAN zaczął posyłać przeciw Judzie Resina, króla Syrii, i Pekacha, syna Remaliasza."
  tags: []
"2Krl15,38":
  text: "I Jotam zasnął ze swymi ojcami, i został pogrzebany z nimi w mieście Dawida, swego ojca. I Achaz, jego syn, królował w jego miejsce."
  tags: []
