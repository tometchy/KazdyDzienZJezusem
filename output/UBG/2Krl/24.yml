"2Krl24,1":
  text: "Za jego dni wyruszył Nabuchodonozor, król Babilonu, i Joakim stał się jego sługą przez trzy lata. Potem zbuntował się przeciwko niemu."
  tags: []
"2Krl24,2":
  text: "A PAN posłał przeciwko niemu oddziały Chaldejczyków, oddziały Syryjczyków, oddziały Moabitów i oddziały synów Ammona. Posłał ich na Judę, aby go zniszczyć zgodnie ze słowem PANA, które wypowiedział przez swoje sługi, proroków."
  tags: []
"2Krl24,3":
  text: "Owszem, zgodnie z poleceniem PANA spotkało to Judę, aby odrzucić go sprzed jego oblicza za grzechy Manassesa, za to wszystko, co uczynił;"
  tags: []
"2Krl24,4":
  text: "A także za krew niewinną, którą przelał, bo napełnił Jerozolimę krwią niewinną, czego PAN nie chciał przebaczyć."
  tags: []
"2Krl24,5":
  text: "A pozostałe dzieje Joakima i wszystko, co czynił, czy nie są zapisane w księdze kronik królów Judy?"
  tags: []
"2Krl24,6":
  text: "I Joakim zasnął ze swymi ojcami, a jego syn Joachin królował w jego miejsce."
  tags: []
"2Krl24,7":
  text: "A król Egiptu już więcej nie wyruszał ze swojej ziemi, gdyż król Babilonu wziął wszystko, co należało do króla Egiptu, od rzeki Egiptu aż do rzeki Eufrat."
  tags: []
"2Krl24,8":
  text: "Joachin miał osiemnaście lat, kiedy zaczął królować, i królował trzy miesiące w Jerozolimie. Jego matka miała na imię Nechuszta i była córką Elnatana z Jerozolimy."
  tags: []
"2Krl24,9":
  text: "Czynił on to, co złe w oczach PANA, zupełnie tak, jak czynił jego ojciec."
  tags: []
"2Krl24,10":
  text: "W tym czasie słudzy Nabuchodonozora, króla Babilonu, wyruszyli przeciw Jerozolimie i przyszło do oblężenia miasta."
  tags: []
"2Krl24,11":
  text: "Potem sam Nabuchodonozor, król Babilonu, nadciągnął przeciw miastu, a jego słudzy je oblegali."
  tags: []
"2Krl24,12":
  text: "Wtedy Joachin, król Judy, wyszedł do króla Babilonu, on i jego matka, jego słudzy, jego książęta i jego dworzanie. I król Babilonu pojmał go w ósmym roku swego panowania."
  tags: []
"2Krl24,13":
  text: "I wyniósł stamtąd wszystkie skarby domu PANA i skarby domu królewskiego i pokruszył wszystkie przedmioty złote, które wykonał Salomon, król Izraela, dla świątyni PANA, tak jak zapowiedział PAN."
  tags: []
"2Krl24,14":
  text: "I przesiedlił całą Jerozolimę: wszystkich książąt, wszystkich dzielnych wojowników – dziesięć tysięcy jeńców, oraz wszystkich rzemieślników i kowali. Nie pozostał nikt oprócz ubogiego ludu tej ziemi."
  tags: []
"2Krl24,15":
  text: "Przeniósł też do Babilonu Joachina. A także matkę króla, żony króla, jego dworzan i dostojników tej ziemi zabrał do niewoli z Jerozolimy do Babilonu."
  tags: []
"2Krl24,16":
  text: "Także wszystkich dzielnych mężów w liczbie siedmiu tysięcy, tysiąc rzemieślników i kowali oraz wszystkich zdolnych do walki – tych zabrał król Babilonu do niewoli do Babilonu."
  tags: []
"2Krl24,17":
  text: "W jego miejsce król Babilonu ustanowił królem jego stryja Mattaniasza i zmienił mu imię na Sedekiasz."
  tags: []
"2Krl24,18":
  text: "Sedekiasz miał dwadzieścia jeden lat, kiedy zaczął królować, i królował jedenaście lat w Jerozolimie. Jego matka miała na imię Chamutal i była córką Jeremiasza z Libny."
  tags: []
"2Krl24,19":
  text: "Czynił on to, co złe w oczach PANA, zupełnie tak, jak czynił Joakim."
  tags: []
"2Krl24,20":
  text: "Z powodu gniewu PANA przyszło to na Jerozolimę i Judę, aż odrzucił ich sprzed swego oblicza. A Sedekiasz zbuntował się przeciw królowi Babilonu."
  tags: []
