"2Krl8,1":
  text: "Potem Elizeusz odezwał się do tej kobiety, której syna wskrzesił: Wstań i idź, ty i twój dom, zamieszkaj jako przybysz tam, gdziekolwiek będziesz mogła zamieszkać. PAN bowiem wezwał głód, który nawiedzi ziemię na siedem lat."
  tags: []
"2Krl8,2":
  text: "Wstała więc kobieta i uczyniła według słowa męża Bożego. Wyruszyła wraz ze swoim domem i przebywała w ziemi Filistynów przez siedem lat."
  tags: []
"2Krl8,3":
  text: "Po upływie siedmiu lat kobieta wróciła z ziemi Filistynów. I udała się do króla, aby wołać o swój dom i swoje pole."
  tags: []
"2Krl8,4":
  text: "A w tym czasie król rozmawiał z Gehazim, sługą męża Bożego: Opowiedz mi, proszę, o wszystkich wielkich dziełach, których dokonał Elizeusz."
  tags: []
"2Krl8,5":
  text: "A gdy on opowiadał królowi, jak wskrzesił umarłego, oto kobieta, której syna wskrzesił, zawołała na króla o swój dom i swoje pole. Gehazi powiedział: Mój panie, królu, to jest ta kobieta i to jej syn, którego wskrzesił Elizeusz."
  tags: []
"2Krl8,6":
  text: "Wtedy król wypytał kobietę, a ona mu odpowiedziała. I król przydzielił jej pewnego urzędnika, mówiąc: Przywróć jej wszystko, co do niej należało, oraz wszystkie dochody z pola od dnia, w którym opuściła ziemię, aż do teraz."
  tags: []
"2Krl8,7":
  text: "Potem Elizeusz przyszedł do Damaszku, a Ben-Hadad, król Syrii, chorował. I oznajmiono mu: Mąż Boży przyszedł tutaj."
  tags: []
"2Krl8,8":
  text: "Wtedy król powiedział do Chazaela: Weź w ręce dar, wyjdź naprzeciw męża Bożego i przez niego zapytaj PANA: Czy wyzdrowieję z tej choroby?"
  tags: []
"2Krl8,9":
  text: "Chazael wyszedł więc naprzeciw niego i wziął ze sobą dar ze wszystkich dóbr Damaszku, załadowany na czterdziestu wielbłądach. Przyszedł i stanął przed nim, i powiedział: Twój syn Ben-Hadad, król Syrii, posłał mnie do ciebie z pytaniem: Czy wyzdrowieję z tej choroby?"
  tags: []
"2Krl8,10":
  text: "Elizeusz odpowiedział mu: Idź i powiedz mu: Na pewno wyzdrowiejesz. Lecz PAN objawił mi, że na pewno umrze."
  tags: []
"2Krl8,11":
  text: "Wtedy z twarzą zastygłą patrzył na niego, aż tamten się zawstydził. I mąż Boży zapłakał."
  tags: []
"2Krl8,12":
  text: "Chazael zapytał go: Czemu mój pan płacze? Odpowiedział: Bo wiem, jakie zło wyrządzisz synom Izraela. Ich twierdze spalisz ogniem, ich młodzieńców pomordujesz mieczem, ich dzieci roztrzaskasz i ich brzemienne rozprujesz."
  tags: []
"2Krl8,13":
  text: "Wtedy Chazael powiedział: Co? Czy twój sługa jest psem, żeby miał czynić tak straszną rzecz? Elizeusz odpowiedział: PAN pokazał mi, że ty będziesz królem nad Syrią."
  tags: []
"2Krl8,14":
  text: "Potem odszedł od Elizeusza i przyszedł do swego pana, który zapytał go: Co ci powiedział Elizeusz? Odpowiedział: Powiedział mi, że na pewno wyzdrowiejesz."
  tags: []
"2Krl8,15":
  text: "A nazajutrz Chazael wziął kołdrę, zamoczył ją w wodzie i rozciągnął na jego twarzy, tak że umarł. Chazael zaś królował w jego miejsce."
  tags: []
"2Krl8,16":
  text: "W piątym roku Jorama, syna Achaba, króla Izraela, gdy Jehoszafat był jeszcze królem Judy, zaczął królować Jehoram, syn Jehoszafata, król Judy."
  tags: []
"2Krl8,17":
  text: "Miał trzydzieści dwa lata, kiedy zaczął królować, i królował osiem lat w Jerozolimie."
  tags: []
"2Krl8,18":
  text: "Lecz szedł drogami królów Izraela, tak jak to czynił dom Achaba, bo miał za żonę córkę Achaba i czynił to, co złe w oczach PANA."
  tags: []
"2Krl8,19":
  text: "PAN jednak nie chciał wytracić Judy ze względu na Dawida, swego sługę, tak jak mu obiecał, że da pochodnię jemu oraz jego synom po wszystkie dni."
  tags: []
"2Krl8,20":
  text: "Za jego dni Edom wyzwolił się spod ręki Judy i ustanowili nad sobą króla."
  tags: []
"2Krl8,21":
  text: "Wyruszył więc Joram do Seiru wraz ze wszystkimi rydwanami. Wstał on w nocy i pobił Edomitów, którzy go otoczyli, oraz dowódców rydwanów. Lud zaś uciekał do swoich namiotów."
  tags: []
"2Krl8,22":
  text: "Edom jednak wyzwolił się spod ręki Judy i jest tak aż do dziś. W tym czasie wyzwoliła się również Libna."
  tags: []
"2Krl8,23":
  text: "A pozostałe dzieje Jorama i wszystko, co czynił, czy nie są zapisane w kronikach królów Judy?"
  tags: []
"2Krl8,24":
  text: "I Joram zasnął ze swoimi ojcami, i został pogrzebany z nimi w mieście Dawida. W jego miejsce królował jego syn Achazjasz."
  tags: []
"2Krl8,25":
  text: "W dwunastym roku Jorama, syna Achaba, króla Izraela, zaczął królować Achazjasz, syn Jorama, króla Judy."
  tags: []
"2Krl8,26":
  text: "Achazjasz miał dwadzieścia dwa lata, kiedy zaczął królować, i królował jeden rok w Jerozolimie. Jego matka miała na imię Atalia i była córką Omriego, króla Izraela."
  tags: []
"2Krl8,27":
  text: "Szedł on drogą domu Achaba i czynił to, co złe w oczach PANA, jak dom Achaba. Był bowiem zięciem domu Achaba."
  tags: []
"2Krl8,28":
  text: "Wyruszył z Joramem, synem Achaba, na wojnę z Chazaelem, królem Syrii, do Ramot-Gilead, ale Syryjczycy zranili Jorama."
  tags: []
"2Krl8,29":
  text: "Król Joram wrócił więc, aby się leczyć w Jizreel z ran, które mu zadali Syryjczycy w Rama, gdy walczył z Chazaelem, królem Syrii. I Achazjasz, syn Jorama, króla Judy, przybył odwiedzić Jorama, syna Achaba, w Jizreel, ponieważ był chory."
  tags: []
