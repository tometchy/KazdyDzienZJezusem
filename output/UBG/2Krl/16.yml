"2Krl16,1":
  text: "W siedemnastym roku Pekacha, syna Remaliasza, Achaz, syn Jotama, króla Judy, zaczął królować."
  tags: []
"2Krl16,2":
  text: "Achaz miał dwadzieścia lat, kiedy zaczął królować, i królował szesnaście lat w Jerozolimie, ale nie czynił tego, co słuszne w oczach PANA, swego Boga, jak Dawid, jego ojciec;"
  tags: []
"2Krl16,3":
  text: "Lecz chodził drogami królów Izraela, a nawet swojego syna przeprowadził przez ogień według obrzydliwości pogan, których PAN wypędził sprzed oblicza synów Izraela."
  tags: []
"2Krl16,4":
  text: "Składał ofiary i palił kadzidło na wyżynach, na pagórkach i pod każdym zielonym drzewem."
  tags: []
"2Krl16,5":
  text: "Wtedy Resin, król Syrii, i Pekach, syn Remaliasza, król Izraela, wyruszyli na wojnę przeciw Jerozolimie i oblegli Achaza, ale nie mogli go pokonać."
  tags: []
"2Krl16,6":
  text: "W tym samym czasie Resin, król Syrii, przywrócił Syrii Elat i wypędził Żydów z Elat, a Syryjczycy przybyli do Elat i mieszkają tam aż do dziś."
  tags: []
"2Krl16,7":
  text: "Achaz więc wysłał posłańców do Tiglat-Pilesera, króla Asyrii, ze słowami: Jestem twoim sługą i twoim synem. Przyjdź i wybaw mnie z ręki króla Syrii i z ręki króla Izraela, którzy powstali przeciw mnie."
  tags: []
"2Krl16,8":
  text: "Wtedy Achaz wziął srebro i złoto, które znajdowały się w domu PANA i w skarbcach domu królewskiego, i posłał je jako dar królowi Asyrii."
  tags: []
"2Krl16,9":
  text: "I król Asyrii wysłuchał go. Wyruszył bowiem król Asyrii przeciw Damaszkowi, zdobył go i uprowadził jego mieszkańców do Kir, a Resina zabił."
  tags: []
"2Krl16,10":
  text: "Potem król Achaz udał się do Damaszku na spotkanie z Tiglat-Pilserem, królem Asyrii. Gdy zobaczył w Damaszku ołtarz, król Achaz posłał do kapłana Uriasza wzór tego ołtarza i cały plan jego budowy."
  tags: []
"2Krl16,11":
  text: "I kapłan Uriasz zbudował ołtarz dokładnie według tego, co król Achaz przesłał z Damaszku. Tak to uczynił kapłan Uriasz, zanim król Achaz wrócił z Damaszku."
  tags: []
"2Krl16,12":
  text: "A gdy król wrócił z Damaszku, zobaczył ołtarz, zbliżył się do niego i złożył na nim ofiary."
  tags: []
"2Krl16,13":
  text: "Spalił swoje całopalenie i ofiarę z pokarmów, wylał swoją ofiarę z płynów i pokropił ołtarz krwią swoich ofiar pojednawczych."
  tags: []
"2Krl16,14":
  text: "Ołtarz zaś z brązu, który był przed PANEM, przeniósł z przedniej części domu, gdzie znajdował się między ołtarzem a domem PANA, i postawił go po północnej stronie ołtarza."
  tags: []
"2Krl16,15":
  text: "Król Achaz rozkazał też kapłanowi Uriaszowi: Na wielkim ołtarzu będziesz palił poranną ofiarę całopalną i wieczorną ofiarę z pokarmów, a także całopalną ofiarę króla i jego ofiarę z pokarmów oraz całopalną ofiarę całego ludu ziemi, ich ofiarę z pokarmów i ich ofiary z płynów. Będziesz też kropił na nim wszelką krwią całopalenia i wszelką krwią z ofiar krwawych, ale ołtarz z brązu będzie dla mnie do szukania rady."
  tags: []
"2Krl16,16":
  text: "I kapłan Uriasz uczynił wszystko zgodnie z tym, jak rozkazał król Achaz."
  tags: []
"2Krl16,17":
  text: "Król Achaz odciął też listwy podstawek i wyjął z nich kadzie. Zdjął również morze sponad wołów z brązu, które pod nim były, a postawił je na posadzce kamiennej."
  tags: []
"2Krl16,18":
  text: "Zadaszenie na szabat, które zbudowano w domu, oraz zewnętrzne wejście królewskie usunął z domu PANA ze względu na króla Asyrii."
  tags: []
"2Krl16,19":
  text: "A pozostałe dzieje Achaza, które czynił, są zapisane w księdze kronik królów Judy."
  tags: []
"2Krl16,20":
  text: "I Achaz zasnął ze swymi ojcami, i został pogrzebany z nimi w mieście Dawida. A Ezechiasz, jego syn, królował w jego miejsce."
  tags: []
