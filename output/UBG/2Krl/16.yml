"2Krl16,1": "W siedemnastym roku Pekacha, syna Remaliasza, Achaz, syn Jotama, króla Judy, zaczął królować."
"2Krl16,2": "Achaz miał dwadzieścia lat, kiedy zaczął królować, i królował szesnaście lat w Jerozolimie, ale nie czynił tego, co słuszne w oczach PANA, swego Boga, jak Dawid, jego ojciec;"
"2Krl16,3": "Lecz chodził drogami królów Izraela, a nawet swojego syna przeprowadził przez ogień według obrzydliwości pogan, których PAN wypędził sprzed oblicza synów Izraela."
"2Krl16,4": "Składał ofiary i palił kadzidło na wyżynach, na pagórkach i pod każdym zielonym drzewem."
"2Krl16,5": "Wtedy Resin, król Syrii, i Pekach, syn Remaliasza, król Izraela, wyruszyli na wojnę przeciw Jerozolimie i oblegli Achaza, ale nie mogli go pokonać."
"2Krl16,6": "W tym samym czasie Resin, król Syrii, przywrócił Syrii Elat i wypędził Żydów z Elat, a Syryjczycy przybyli do Elat i mieszkają tam aż do dziś."
"2Krl16,7": "Achaz więc wysłał posłańców do Tiglat-Pilesera, króla Asyrii, ze słowami: Jestem twoim sługą i twoim synem. Przyjdź i wybaw mnie z ręki króla Syrii i z ręki króla Izraela, którzy powstali przeciw mnie."
"2Krl16,8": "Wtedy Achaz wziął srebro i złoto, które znajdowały się w domu PANA i w skarbcach domu królewskiego, i posłał je jako dar królowi Asyrii."
"2Krl16,9": "I król Asyrii wysłuchał go. Wyruszył bowiem król Asyrii przeciw Damaszkowi, zdobył go i uprowadził jego mieszkańców do Kir, a Resina zabił."
"2Krl16,10": "Potem król Achaz udał się do Damaszku na spotkanie z Tiglat-Pilserem, królem Asyrii. Gdy zobaczył w Damaszku ołtarz, król Achaz posłał do kapłana Uriasza wzór tego ołtarza i cały plan jego budowy."
"2Krl16,11": "I kapłan Uriasz zbudował ołtarz dokładnie według tego, co król Achaz przesłał z Damaszku. Tak to uczynił kapłan Uriasz, zanim król Achaz wrócił z Damaszku."
"2Krl16,12": "A gdy król wrócił z Damaszku, zobaczył ołtarz, zbliżył się do niego i złożył na nim ofiary."
"2Krl16,13": "Spalił swoje całopalenie i ofiarę z pokarmów, wylał swoją ofiarę z płynów i pokropił ołtarz krwią swoich ofiar pojednawczych."
"2Krl16,14": "Ołtarz zaś z brązu, który był przed PANEM, przeniósł z przedniej części domu, gdzie znajdował się między ołtarzem a domem PANA, i postawił go po północnej stronie ołtarza."
"2Krl16,15": "Król Achaz rozkazał też kapłanowi Uriaszowi: Na wielkim ołtarzu będziesz palił poranną ofiarę całopalną i wieczorną ofiarę z pokarmów, a także całopalną ofiarę króla i jego ofiarę z pokarmów oraz całopalną ofiarę całego ludu ziemi, ich ofiarę z pokarmów i ich ofiary z płynów. Będziesz też kropił na nim wszelką krwią całopalenia i wszelką krwią z ofiar krwawych, ale ołtarz z brązu będzie dla mnie do szukania rady."
"2Krl16,16": "I kapłan Uriasz uczynił wszystko zgodnie z tym, jak rozkazał król Achaz."
"2Krl16,17": "Król Achaz odciął też listwy podstawek i wyjął z nich kadzie. Zdjął również morze sponad wołów z brązu, które pod nim były, a postawił je na posadzce kamiennej."
"2Krl16,18": "Zadaszenie na szabat, które zbudowano w domu, oraz zewnętrzne wejście królewskie usunął z domu PANA ze względu na króla Asyrii."
"2Krl16,19": "A pozostałe dzieje Achaza, które czynił, są zapisane w księdze kronik królów Judy."
"2Krl16,20": "I Achaz zasnął ze swymi ojcami, i został pogrzebany z nimi w mieście Dawida. A Ezechiasz, jego syn, królował w jego miejsce."
