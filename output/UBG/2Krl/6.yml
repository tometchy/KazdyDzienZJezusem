"2Krl6,1":
  text: "I synowie proroków powiedzieli do Elizeusza: Oto miejsce, w którym mieszkamy wraz z tobą, jest zbyt ciasne dla nas."
  tags: []
"2Krl6,2":
  text: "Pozwól, że pójdziemy aż nad Jordan, weźmiemy stamtąd każdy po jednej belce i zbudujemy tam sobie miejsce na mieszkanie. Odpowiedział: Idźcie."
  tags: []
"2Krl6,3":
  text: "Jeden z nich powiedział: Racz, proszę, pójść ze swoimi sługami. Odpowiedział: Pójdę."
  tags: []
"2Krl6,4":
  text: "I poszedł z nimi. Kiedy przybyli nad Jordan, zaczęli ścinać drzewa."
  tags: []
"2Krl6,5":
  text: "I zdarzyło się, że jednemu z nich przy ścinaniu drzewa siekierą żelazo wpadło do wody. Zawołał wtedy: Ach, mój panie! Ta była pożyczona."
  tags: []
"2Krl6,6":
  text: "Mąż Boży zapytał: Gdzie wpadło? I wskazał mu miejsce. A on uciął drewno, wrzucił tam i żelazo wypłynęło."
  tags: []
"2Krl6,7":
  text: "I powiedział: Weź je sobie. Wyciągnął więc rękę i wziął je."
  tags: []
"2Krl6,8":
  text: "Potem, gdy król Syrii prowadził wojnę z Izraelem, naradzał się ze swoimi sługami, mówiąc: W tym a w tym miejscu będzie mój obóz."
  tags: []
"2Krl6,9":
  text: "Wtedy mąż Boży posłał do króla Izraela wiadomość: Strzeż się przechodzić przez to miejsce, bo tam Syryjczycy zrobili zasadzkę."
  tags: []
"2Krl6,10":
  text: "Posłał więc król Izraela na to miejsce, o którym mu powiedział mąż Boży, ostrzegając go, i król uratował się nie raz i nie dwa."
  tags: []
"2Krl6,11":
  text: "Serce króla Syrii zatrwożyło się z tego powodu. Zwołał więc swoje sługi i zapytał ich: Czemu mi nie powiecie, kto z nas donosi królowi Izraela?"
  tags: []
"2Krl6,12":
  text: "Jeden z jego sług odpowiedział: Nikt, mój panie, królu. To prorok Elizeusz, który jest w Izraelu, oznajmia królowi Izraela słowa, które wypowiadasz w swoim pokoju sypialnym."
  tags: []
"2Krl6,13":
  text: "On odpowiedział: Idźcie i dowiedzcie się, gdzie on jest, abym posłał po niego i pojmał go. I doniesiono mu: Oto jest w Dotan."
  tags: []
"2Krl6,14":
  text: "Posłał więc tam konie i rydwany, i znaczny oddział wojska. Wyruszyli w nocy i oblegli miasto."
  tags: []
"2Krl6,15":
  text: "Kiedy sługa męża Bożego wstał wcześnie rano i wyszedł, oto wojsko otoczyło miasto razem z końmi i rydwanami. Jego sługa powiedział do niego: Ach, mój panie! Cóż mamy czynić?"
  tags: []
"2Krl6,16":
  text: "Odpowiedział: Nie bój się, bo więcej jest tych, którzy są z nami, niż tych, którzy są z nimi."
  tags: []
"2Krl6,17":
  text: "Wtedy modlił się Elizeusz: PANIE, otwórz, proszę, jego oczy, aby widział. PAN otworzył oczy tego sługi i ten zobaczył: Oto góra była pełna koni i ognistych rydwanów wokół Elizeusza."
  tags: []
"2Krl6,18":
  text: "A gdy Syryjczycy zeszli do niego, Elizeusz modlił się do PANA i powiedział: Proszę, dotknij ten lud ślepotą. I PAN dotknął go ślepotą według słowa Elizeusza."
  tags: []
"2Krl6,19":
  text: "Wtedy Elizeusz powiedział do nich: To nie ta droga ani nie to miasto. Pójdźcie za mną, a zaprowadzę was do człowieka, którego szukacie. I zaprowadził ich do Samarii."
  tags: []
"2Krl6,20":
  text: "A gdy weszli do Samarii, Elizeusz powiedział: PANIE, otwórz im oczy, aby przejrzeli. PAN otworzył im oczy i zobaczyli, że są w środku Samarii."
  tags: []
"2Krl6,21":
  text: "Gdy król Izraela zobaczył ich, zapytał Elizeusza: Czy mam ich zabić, mój ojcze?"
  tags: []
"2Krl6,22":
  text: "Odpowiedział: Nie zabijaj. Czy zabijasz tych, których pojmałeś swoim mieczem i swoim łukiem? Połóż przed nimi chleb i wodę, aby jedli i pili, i wrócili do swego pana."
  tags: []
"2Krl6,23":
  text: "Przygotował więc dla nich wielką ucztę. A gdy jedli i pili, odprawił ich i poszli do swego pana. Odtąd bandy Syryjczyków już nie wpadały do ziemi Izraela."
  tags: []
"2Krl6,24":
  text: "Potem Ben-Hadad, król Syrii, zebrał całe swoje wojsko, wyruszył i obległ Samarię."
  tags: []
"2Krl6,25":
  text: "I nastał wielki głód w Samarii. Tak bowiem ją oblegali, że głowa osła kosztowała osiemdziesiąt srebrników, a ćwierć kaba gołębiego gnoju – pięć srebrników."
  tags: []
"2Krl6,26":
  text: "A gdy król Izraela przechodził po murze, pewna kobieta zawołała do niego: Ratuj mnie, mój panie, królu!"
  tags: []
"2Krl6,27":
  text: "Odpowiedział: Jeśli PAN cię nie uratuje, jakże ja ciebie uratuję? Czy z klepiska lub z tłoczni?"
  tags: []
"2Krl6,28":
  text: "Następnie król zapytał ją: Co ci jest? Odpowiedziała: Ta oto kobieta powiedziała mi: Daj swojego syna, abyśmy go zjadły dzisiaj, a jutro zjemy mojego syna."
  tags: []
"2Krl6,29":
  text: "Ugotowałyśmy więc mojego syna i zjadłyśmy go. Potem powiedziałam jej na drugi dzień: Daj swojego syna, abyśmy go zjadły. Lecz ona ukryła swojego syna."
  tags: []
"2Krl6,30":
  text: "A gdy król usłyszał słowa tej kobiety, rozdarł swoje szaty. I kiedy przechodził po murze, lud zobaczył, że pod spodem nosił wór na swoim ciele."
  tags: []
"2Krl6,31":
  text: "Wtedy król powiedział: Niech mi to uczyni Bóg i tamto dorzuci, jeśli głowa Elizeusza, syna Szafata, ostoi się na nim dzisiaj."
  tags: []
"2Krl6,32":
  text: "Elizeusz zaś siedział w swoim domu i starsi siedzieli razem z nim. I król wysłał przed sobą człowieka. Lecz zanim posłaniec przyszedł do niego, powiedział do starszych: Czy widzicie, że ten syn mordercy posłał, aby mi ucięto głowę? Uważajcie, gdy ten posłaniec przyjdzie, zamknijcie drzwi i zatrzymajcie go przed drzwiami. Czy za nim nie słychać kroków mego pana?"
  tags: []
"2Krl6,33":
  text: "A gdy jeszcze z nimi rozmawiał, oto posłaniec przybył do niego i powiedział: To nieszczęście jest od PANA. Czego mam jeszcze oczekiwać od PANA?"
  tags: []
