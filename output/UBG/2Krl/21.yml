"2Krl21,1":
  text: "Manasses miał dwanaście lat, kiedy zaczął królować, i królował pięćdziesiąt pięć lat w Jerozolimie. Jego matka miała na imię Chefsiba."
  tags: []
"2Krl21,2":
  text: "Czynił on to, co złe w oczach PANA, według obrzydliwości tych narodów, które PAN wypędził przed synami Izraela."
  tags: []
"2Krl21,3":
  text: "Odbudował bowiem wyżyny, które zburzył jego ojciec Ezechiasz, wznosił ołtarze dla Baala, posadził gaj, tak jak uczynił Achab, król Izraela, i oddawał pokłon całemu zastępowi nieba, i służył mu."
  tags: []
"2Krl21,4":
  text: "Zbudował też ołtarze w domu PANA, o którym PAN powiedział: W Jerozolimie umieszczę swoje imię."
  tags: []
"2Krl21,5":
  text: "Zbudował też ołtarze całemu zastępowi nieba w obydwu dziedzińcach domu PANA."
  tags: []
"2Krl21,6":
  text: "Przeprowadził swojego syna przez ogień, uprawiał wróżbiarstwo i czary, ustanowił czarowników i czarnoksiężników. Bardzo wiele złego czynił w oczach PANA, pobudzając go do gniewu."
  tags: []
"2Krl21,7":
  text: "Postawił też rzeźbę gaju, którą wykonał, w domu, o którym PAN powiedział do Dawida i do jego syna Salomona: W tym domu i w Jerozolimie, które wybrałem spośród wszystkich pokoleń Izraela, umieszczę swoje imię na wieki;"
  tags: []
"2Krl21,8":
  text: "A już więcej nie dopuszczę, by noga Izraela opuściła ziemię, którą dałem ich ojcom, oby tylko pilnie przestrzegali wszystkiego, co im nakazałem, i całego prawa, które im nadał mój sługa Mojżesz."
  tags: []
"2Krl21,9":
  text: "Lecz oni nie słuchali. A Manasses zwiódł ich, aby czynili gorzej niż narody, które PAN wytracił przed synami Izraela."
  tags: []
"2Krl21,10":
  text: "Wtedy PAN przemówił przez swoje sługi, proroków, mówiąc:"
  tags: []
"2Krl21,11":
  text: "Ponieważ Manasses, król Judy, dopuścił się tych obrzydliwości, czyniąc gorsze rzeczy niż wszystko, co czynili Amoryci, którzy byli przed nim, a przywiódł Judę do grzechu przez swoje bożki;"
  tags: []
"2Krl21,12":
  text: "Dlatego tak mówi PAN, Bóg Izraela: Oto sprowadzę nieszczęście na Jerozolimę i na Judę, tak że każdemu, kto o tym usłyszy, zadzwoni w obu uszach."
  tags: []
"2Krl21,13":
  text: "Rozciągnę bowiem nad Jerozolimą sznur Samarii i pion domu Achaba. I wytrę Jerozolimę, tak jak wyciera się miskę, a po wytarciu odwraca się dnem do góry."
  tags: []
"2Krl21,14":
  text: "I porzucę resztę swojego dziedzictwa, i wydam je w ręce jego wrogów; staną się łupem i pastwą wszystkich swoich wrogów."
  tags: []
"2Krl21,15":
  text: "Ponieważ dopuszczali się tego, co złe w moich oczach, i drażnili mnie od dnia, kiedy ich ojcowie wyszli z Egiptu, aż do dziś."
  tags: []
"2Krl21,16":
  text: "Ponadto nawet krwi niewinnej Manasses przelał bardzo dużo, tak że napełnił nią Jerozolimę od krańca do krańca, nie licząc swojego grzechu, przez który przywiódł do grzechu Judę, czyniąc to, co złe w oczach PANA."
  tags: []
"2Krl21,17":
  text: "A pozostałe dzieje Manassesa i wszystko, co czynił, i jego grzech, którego się dopuścił, czy nie są zapisane w księdze kronik królów Judy?"
  tags: []
"2Krl21,18":
  text: "I Manasses zasnął ze swymi ojcami, i został pogrzebany w ogrodzie swego domu, w ogrodzie Uzzy. I Amon, jego syn, królował w jego miejsce."
  tags: []
"2Krl21,19":
  text: "Amon miał dwadzieścia dwa lata, kiedy zaczął królować, i królował dwa lata w Jerozolimie. Jego matka miała na imię Meszullemet i była córką Charusa z Jotba."
  tags: []
"2Krl21,20":
  text: "Czynił on to, co złe w oczach PANA, tak jak czynił jego ojciec Manasses."
  tags: []
"2Krl21,21":
  text: "Szedł wszystkimi drogami, którymi szedł jego ojciec, i służył bożkom, którym służył jego ojciec, i oddawał im pokłon;"
  tags: []
"2Krl21,22":
  text: "Opuścił PANA, Boga swoich ojców, a nie szedł drogą PANA."
  tags: []
"2Krl21,23":
  text: "I słudzy Amona uknuli spisek przeciw niemu, i zabili króla w jego domu."
  tags: []
"2Krl21,24":
  text: "Wtedy lud tej ziemi zabił wszystkich, którzy uknuli spisek przeciw królowi Amonowi. I lud tej ziemi ustanowił w jego miejsce królem Jozjasza, jego syna."
  tags: []
"2Krl21,25":
  text: "A pozostałe dzieje Amona, które czynił, czy nie są zapisane w księdze kronik królów Judy?"
  tags: []
"2Krl21,26":
  text: "I pogrzebano go w jego grobie, w ogrodzie Uzzy. A jego syn Jozjasz królował w jego miejsce."
  tags: []
