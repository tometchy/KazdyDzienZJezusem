"2Krl9,1":
  text: "A prorok Elizeusz zawołał jednego z synów proroków i powiedział mu: Przepasz swoje biodra, weź do ręki ten dzban z oliwą i idź do Ramot-Gilead."
  tags: []
"2Krl9,2":
  text: "A gdy tam przybędziesz, zobaczysz tam Jehu, syna Jehoszafata, syna Nimsziego. Wejdź tam, spraw, by powstał spośród swych braci i wprowadź go do najskrytszej komnaty."
  tags: []
"2Krl9,3":
  text: "Następnie weź dzban oliwy, wylej na jego głowę i powiedz: Tak mówi PAN: Namaściłem cię na króla nad Izraelem. Potem otwórz drzwi i uciekaj, nie zwlekaj."
  tags: []
"2Krl9,4":
  text: "Poszedł więc ten młodzieniec – młody prorok – do Ramot-Gilead."
  tags: []
"2Krl9,5":
  text: "A gdy przybył, oto dowódcy wojska siedzieli. A on powiedział: Wodzu! Mam do ciebie słowo. Jehu zapytał: Do którego z nas wszystkich? I odpowiedział: Do ciebie, wodzu!"
  tags: []
"2Krl9,6":
  text: "Wtedy wstał i wszedł do domu, a tamten wylał oliwę na jego głowę i powiedział mu: Tak mówi PAN, Bóg Izraela: Namaściłem cię na króla nad ludem PANA, nad Izraelem."
  tags: []
"2Krl9,7":
  text: "Wytracisz dom Achaba, swego pana, ja bowiem pomszczę krew swoich sług, proroków i krew wszystkich sług PANA z ręki Jezabel."
  tags: []
"2Krl9,8":
  text: "I tak zginie cały dom Achaba. Wytępię z domu Achaba każdego, aż do najmniejszego szczenięcia, każdego więźnia i opuszczonego w Izraelu."
  tags: []
"2Krl9,9":
  text: "I uczynię z domem Achaba jak z domem Jeroboama, syna Nebata, i jak z domem Baszy, syna Achiasza."
  tags: []
"2Krl9,10":
  text: "Psy zjedzą Jezabel na polu Jizreel i nie będzie nikogo, kto ją pogrzebie. Potem otworzył drzwi i uciekł."
  tags: []
"2Krl9,11":
  text: "A gdy Jehu wyszedł do sług swego pana, jeden z nich zapytał go: Czy wszystko dobrze? Po co ten szaleniec przyszedł do ciebie? Odpowiedział im: Wy znacie tego człowieka i jego słowa."
  tags: []
"2Krl9,12":
  text: "Oni powiedzieli: To nieprawda. Powiedz, proszę. A on powiedział: Tak a tak przemówił do mnie: Tak mówi PAN: Namaściłem cię na króla nad Izraelem."
  tags: []
"2Krl9,13":
  text: "Wtedy wszyscy pospiesznie wzięli swoje szaty, podłożyli je pod niego na najwyższym stopniu, zadęli w trąbę i zawołali: Jehu jest królem!"
  tags: []
"2Krl9,14":
  text: "Wtedy Jehu, syn Jehoszafata, syna Nimsziego, uknuł spisek przeciw Joramowi. (A w tym czasie Joram wraz z całym Izraelem strzegł Ramot-Gilead przed Chazaelem, królem Syrii."
  tags: []
"2Krl9,15":
  text: "Lecz król Joram wrócił, by leczyć się w Jizreel z ran, które mu zadali Syryjczycy, gdy walczył z Chazaelem, królem Syrii). Jehu powiedział: Jeśli się na to zgadzacie, niech nikt nie wychodzi z miasta, aby pójść i oznajmić to w Jizreel."
  tags: []
"2Krl9,16":
  text: "Następnie Jehu wsiadł na rydwan i pojechał do Jizreel, bo tam leżał Joram. Także Achazjasz, król Judy, przyjechał, aby odwiedzić Jorama."
  tags: []
"2Krl9,17":
  text: "A gdy strażnik, który stał na wieży w Jizreel, zobaczył nadjeżdżający oddział Jehu, powiedział: Widzę oddział. Joram rzekł: Weź jeźdźca i wyślij go naprzeciw nich, niech zapyta: Czy jest pokój?"
  tags: []
"2Krl9,18":
  text: "Jeździec więc wyruszył mu naprzeciw i zapytał: Tak mówi król: Czy jest pokój? Jehu odpowiedział: Co tobie do pokoju? Zawróć i jedź za mną. Strażnik oznajmił: Posłaniec dotarł do nich, ale nie wraca."
  tags: []
"2Krl9,19":
  text: "Wysłał więc drugiego jeźdźca, który przybył do nich i powiedział: Tak mówi król: Czy jest pokój? Jehu odpowiedział: Co tobie do pokoju? Zawróć i jedź za mną."
  tags: []
"2Krl9,20":
  text: "Strażnik znowu oznajmił: Dotarł do nich, ale nie wraca. A jego jazda jest jak jazda Jehu, syna Nimsziego, bo jedzie jak szalony."
  tags: []
"2Krl9,21":
  text: "Wtedy Joram powiedział: Zaprzęgaj. Zaprzężono więc jego rydwan. I Joram, król Izraela, i Achazjasz, król Judy, wyjechali, każdy na swoim rydwanie. Wyjechali naprzeciw Jehu i spotkali go na polu Nabota Jizreelity."
  tags: []
"2Krl9,22":
  text: "A gdy Joram zobaczył Jehu, zapytał: Czy jest pokój, Jehu? Odpowiedział: Co to za pokój, dopóki trwają cudzołóstwa Jezabel, twojej matki, i jej liczne czary."
  tags: []
"2Krl9,23":
  text: "Wtedy Joram zawrócił i uciekł, mówiąc do Achazjasza: Zdrada, Achazjaszu!"
  tags: []
"2Krl9,24":
  text: "A Jehu wziął do rąk łuk i trafił Jorama między ramiona tak, że strzała przeszyła jego serce, a on padł na swój rydwan."
  tags: []
"2Krl9,25":
  text: "Potem Jehu odezwał się do Bidkara, swego dowódcy: Weź go i porzuć na polu Nabota Jizreelity. Pamiętasz bowiem: gdy ja i ty jechaliśmy razem za Achabem, jego ojcem, PAN wydał przeciwko niemu ten wyrok:"
  tags: []
"2Krl9,26":
  text: "Z pewnością widziałem wczoraj krew Nabota i krew jego synów – mówi PAN. I zemszczę się na tobie na tym polu – mówi PAN. Teraz więc weź go i porzuć na polu według słowa PANA."
  tags: []
"2Krl9,27":
  text: "Gdy zobaczył to Achazjasz, król Judy, zaczął uciekać drogą do domu ogrodowego. Lecz Jehu ścigał go i polecił: Tego także zabijcie na jego rydwanie. I zranili go na wzniesieniu Gur, które jest przy Jibleam. Uciekł do Megiddo i tam umarł."
  tags: []
"2Krl9,28":
  text: "Jego słudzy przewieźli go do Jerozolimy i pogrzebali w jego grobie z jego ojcami w mieście Dawida."
  tags: []
"2Krl9,29":
  text: "W jedenastym roku Jorama, syna Achaba, Achazjasz zaczął królować nad Judą."
  tags: []
"2Krl9,30":
  text: "Potem Jehu przybył do Jizreel. Gdy Jezabel usłyszała o tym, pomalowała swoją twarz, upiększyła włosy i wyglądała przez okno."
  tags: []
"2Krl9,31":
  text: "A gdy Jehu wjeżdżał przez bramę, zapytała: Czy miał pokój Zimri, który zabił swego pana?"
  tags: []
"2Krl9,32":
  text: "On zaś podniósł twarz ku oknu i zawołał: Kto jest ze mną? Kto? Wtedy wyjrzeli ku niemu dwaj albo trzej eunuchowie."
  tags: []
"2Krl9,33":
  text: "Powiedział im: Zrzućcie ją. Wtedy zrzucili ją. Jej krew obryzgała mur i konie, a on podeptał ją."
  tags: []
"2Krl9,34":
  text: "A gdy tam wszedł, najadł się i napił, potem powiedział: Zajmijcie się teraz tą przeklętą i pogrzebcie ją. Jest bowiem córką króla."
  tags: []
"2Krl9,35":
  text: "Poszli, aby ją pogrzebać, lecz nie znaleźli z niej nic poza czaszką, stopami i dłońmi."
  tags: []
"2Krl9,36":
  text: "Wrócili więc i oznajmili mu to. On zaś powiedział: Wypełniło się słowo PANA, które wypowiedział przez swego sługę Eliasza Tiszbitę: Na polu Jizreel psy zjedzą ciało Jezabel."
  tags: []
"2Krl9,37":
  text: "A trup Jezabel będzie jak gnój leżący na powierzchni roli, na polu Jizreel, tak że nikt nie powie: To jest Jezabel."
  tags: []
