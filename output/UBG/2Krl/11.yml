"2Krl11,1":
  text: "Kiedy Atalia, matka Achazjasza, zobaczyła, że jej syn umarł, powstała i zgładziła całe potomstwo królewskie."
  tags: []
"2Krl11,2":
  text: "Ale Jehoszeba, córka króla Jorama, siostra Achazjasza, wzięła Joasza, syna Achazjasza, i wykradła go spośród synów króla, których zabito; i ukryła go przed Atalią wraz z jego mamką w pokoju sypialnym, i nie został zabity."
  tags: []
"2Krl11,3":
  text: "I przebywał z nią sześć lat ukryty w domu PANA. Tymczasem Atalia królowała nad ziemią."
  tags: []
"2Krl11,4":
  text: "A w siódmym roku Jehojada posłał i wezwał setników, dowódców i gwardzistów, przyprowadził ich do siebie, do domu PANA, zawarł z nimi przymierze, kazał im złożyć przysięgę w domu PANA i pokazał im syna króla."
  tags: []
"2Krl11,5":
  text: "I rozkazał im: Oto co macie uczynić: trzecia część z was, którzy przychodzicie w szabat, niech pełni straż w domu królewskim;"
  tags: []
"2Krl11,6":
  text: "Trzecia część zostanie w bramie Sur i trzecia część będzie w bramie za gwardzistami. Będziecie trzymali straż nad domem w razie ataku."
  tags: []
"2Krl11,7":
  text: "A dwie części spośród was – wszyscy, którzy wychodzą w szabat, niech trzymają straż w domu PANA przy królu."
  tags: []
"2Krl11,8":
  text: "A tak otoczycie króla wokół, każdy z bronią w ręku. Ktokolwiek zbliży się do szeregów, niech będzie zabity. A wy bądźcie przy królu, gdy będzie wychodzić i wchodzić."
  tags: []
"2Krl11,9":
  text: "Setnicy uczynili wszystko tak, jak rozkazał kapłan Jehojada. Każdy wziął swoich ludzi, którzy przychodzili w szabat, i tych, którzy odchodzili w szabat, i przyszli do kapłana Jehojady."
  tags: []
"2Krl11,10":
  text: "Wtedy kapłan dał setnikom włócznie i tarcze króla Dawida, które były w domu PANA."
  tags: []
"2Krl11,11":
  text: "A gwardziści stali, każdy z bronią w ręku, dokoła króla, od prawej strony świątyni aż do lewej strony świątyni, przy ołtarzu i świątyni."
  tags: []
"2Krl11,12":
  text: "Wtedy wyprowadził syna króla, włożył na niego koronę i wręczył mu Świadectwo. I ustanowiono go królem, i namaszczono go, a klaskając w dłonie, wołano: Niech żyje król!"
  tags: []
"2Krl11,13":
  text: "Kiedy Atalia usłyszała okrzyk gwardzistów i ludu, przyszła do ludu, do świątyni PANA."
  tags: []
"2Krl11,14":
  text: "A gdy spojrzała, oto król stał przy kolumnie według zwyczaju, a wokół króla książęta i trębacze. Cały lud ziemi radował się i dął w trąby. Wtedy Atalia rozdarła swoje szaty i wołała: Zdrada! Zdrada!"
  tags: []
"2Krl11,15":
  text: "Lecz kapłan Jehojada wydał rozkaz setnikom i dowódcom wojska i powiedział do nich: Wyprowadźcie ją ze świątyni poza szeregi, a ktokolwiek pójdzie za nią, niech będzie zabity mieczem. Kapłan bowiem powiedział: Niech nie będzie zabita w domu PANA."
  tags: []
"2Krl11,16":
  text: "Pochwycili więc ją, a gdy weszła na drogę, którą wjeżdżają konie do domu królewskiego, została tam zabita."
  tags: []
"2Krl11,17":
  text: "Wtedy Jehojada zawarł przymierze między PANEM a królem i ludem, aby byli ludem PANA, oraz między królem a ludem."
  tags: []
"2Krl11,18":
  text: "I cały lud tej ziemi wszedł do domu Baala i zburzył go. Rozbili doszczętnie jego ołtarze i posągi, a Mattana, kapłana Baala, zabili przed ołtarzami. Następnie kapłan ustanowił straż nad domem PANA."
  tags: []
"2Krl11,19":
  text: "Potem wziął setników, dowódców i gwardzistów oraz cały lud tej ziemi. I sprowadzili króla z domu PANA, i przyszli przez bramę gwardii do domu królewskiego. I zasiadł na tronie królów."
  tags: []
"2Krl11,20":
  text: "I cały lud tej ziemi radował się, a miasto się uspokoiło. Atalię zabili mieczem przy domu królewskim."
  tags: []
"2Krl11,21":
  text: "Jehoasz miał siedem lat, gdy zaczął królować."
  tags: []
