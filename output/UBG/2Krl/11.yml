"2Krl11,1": "Kiedy Atalia, matka Achazjasza, zobaczyła, że jej syn umarł, powstała i zgładziła całe potomstwo królewskie."
"2Krl11,2": "Ale Jehoszeba, córka króla Jorama, siostra Achazjasza, wzięła Joasza, syna Achazjasza, i wykradła go spośród synów króla, których zabito; i ukryła go przed Atalią wraz z jego mamką w pokoju sypialnym, i nie został zabity."
"2Krl11,3": "I przebywał z nią sześć lat ukryty w domu PANA. Tymczasem Atalia królowała nad ziemią."
"2Krl11,4": "A w siódmym roku Jehojada posłał i wezwał setników, dowódców i gwardzistów, przyprowadził ich do siebie, do domu PANA, zawarł z nimi przymierze, kazał im złożyć przysięgę w domu PANA i pokazał im syna króla."
"2Krl11,5": "I rozkazał im: Oto co macie uczynić: trzecia część z was, którzy przychodzicie w szabat, niech pełni straż w domu królewskim;"
"2Krl11,6": "Trzecia część zostanie w bramie Sur i trzecia część będzie w bramie za gwardzistami. Będziecie trzymali straż nad domem w razie ataku."
"2Krl11,7": "A dwie części spośród was – wszyscy, którzy wychodzą w szabat, niech trzymają straż w domu PANA przy królu."
"2Krl11,8": "A tak otoczycie króla wokół, każdy z bronią w ręku. Ktokolwiek zbliży się do szeregów, niech będzie zabity. A wy bądźcie przy królu, gdy będzie wychodzić i wchodzić."
"2Krl11,9": "Setnicy uczynili wszystko tak, jak rozkazał kapłan Jehojada. Każdy wziął swoich ludzi, którzy przychodzili w szabat, i tych, którzy odchodzili w szabat, i przyszli do kapłana Jehojady."
"2Krl11,10": "Wtedy kapłan dał setnikom włócznie i tarcze króla Dawida, które były w domu PANA."
"2Krl11,11": "A gwardziści stali, każdy z bronią w ręku, dokoła króla, od prawej strony świątyni aż do lewej strony świątyni, przy ołtarzu i świątyni."
"2Krl11,12": "Wtedy wyprowadził syna króla, włożył na niego koronę i wręczył mu Świadectwo. I ustanowiono go królem, i namaszczono go, a klaskając w dłonie, wołano: Niech żyje król!"
"2Krl11,13": "Kiedy Atalia usłyszała okrzyk gwardzistów i ludu, przyszła do ludu, do świątyni PANA."
"2Krl11,14": "A gdy spojrzała, oto król stał przy kolumnie według zwyczaju, a wokół króla książęta i trębacze. Cały lud ziemi radował się i dął w trąby. Wtedy Atalia rozdarła swoje szaty i wołała: Zdrada! Zdrada!"
"2Krl11,15": "Lecz kapłan Jehojada wydał rozkaz setnikom i dowódcom wojska i powiedział do nich: Wyprowadźcie ją ze świątyni poza szeregi, a ktokolwiek pójdzie za nią, niech będzie zabity mieczem. Kapłan bowiem powiedział: Niech nie będzie zabita w domu PANA."
"2Krl11,16": "Pochwycili więc ją, a gdy weszła na drogę, którą wjeżdżają konie do domu królewskiego, została tam zabita."
"2Krl11,17": "Wtedy Jehojada zawarł przymierze między PANEM a królem i ludem, aby byli ludem PANA, oraz między królem a ludem."
"2Krl11,18": "I cały lud tej ziemi wszedł do domu Baala i zburzył go. Rozbili doszczętnie jego ołtarze i posągi, a Mattana, kapłana Baala, zabili przed ołtarzami. Następnie kapłan ustanowił straż nad domem PANA."
"2Krl11,19": "Potem wziął setników, dowódców i gwardzistów oraz cały lud tej ziemi. I sprowadzili króla z domu PANA, i przyszli przez bramę gwardii do domu królewskiego. I zasiadł na tronie królów."
"2Krl11,20": "I cały lud tej ziemi radował się, a miasto się uspokoiło. Atalię zabili mieczem przy domu królewskim."
"2Krl11,21": "Jehoasz miał siedem lat, gdy zaczął królować."
