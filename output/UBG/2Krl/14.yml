"2Krl14,1":
  text: "W drugim roku Joasza, syna Jehoachaza, króla Izraela, zaczął królować Amazjasz, syn Joasza, króla Judy."
  tags: []
"2Krl14,2":
  text: "Miał dwadzieścia pięć lat, kiedy zaczął królować, i królował dwadzieścia dziewięć lat w Jerozolimie. Jego matka miała na imię Jehoaddan, była z Jerozolimy."
  tags: []
"2Krl14,3":
  text: "Czynił on to, co słuszne w oczach PANA, ale nie tak jak Dawid, jego ojciec. Czynił wszystko tak, jak czynił Joasz, jego ojciec."
  tags: []
"2Krl14,4":
  text: "Wyżyn jednak nie zniesiono i lud jeszcze składał ofiary, i palił kadzidło na tych wyżynach."
  tags: []
"2Krl14,5":
  text: "A gdy królestwo umocniło się w jego ręku, zabił tych spośród swoich sług, którzy zabili króla, jego ojca."
  tags: []
"2Krl14,6":
  text: "Lecz synów morderców nie zabił zgodnie z tym, co jest napisane w księdze Prawa Mojżesza, gdzie PAN rozkazał: Ojcowie nie poniosą śmierci za synów ani synowie nie poniosą śmierci za ojców, ale każdy poniesie śmierć za swój grzech."
  tags: []
"2Krl14,7":
  text: "On też pobił dziesięć tysięcy Edomitów w Dolinie Soli i zdobył w walce Selę, i nadał jej nazwę Jokteel, i tak nazywa się aż do dziś."
  tags: []
"2Krl14,8":
  text: "Wtedy Amazjasz wysłał posłańców do Jehoasza, syna Jehoachaza, syna Jehu, króla Izraela, ze słowami: Chodź, spójrzmy sobie w twarze."
  tags: []
"2Krl14,9":
  text: "Jehoasz zaś, król Izraela, wysłał do Amazjasza, króla Judy, taką odpowiedź: Oset w Libanie posłał do cedru w Libanie prośbę: Daj swoją córkę mojemu synowi za żonę. Lecz dziki zwierz w Libanie przeszedł i podeptał oset."
  tags: []
"2Krl14,10":
  text: "Rzeczywiście, pobiłeś Edomitów i twoje serce uniosło się pychą. Chwal się tym i siedź w domu. Po co masz wdawać się w nieszczęście, abyś upadł ty i Juda z tobą?"
  tags: []
"2Krl14,11":
  text: "Lecz Amazjasz nie posłuchał. Wyruszył więc Jehoasz, król Izraela, i spojrzeli sobie w twarze, on i Amazjasz, król Judy, w Bet-Szemesz, które należy do Judy."
  tags: []
"2Krl14,12":
  text: "I Juda został pobity przez Izraela, i uciekł – każdy do swego namiotu."
  tags: []
"2Krl14,13":
  text: "A Jehoasz, król Izraela, pojmał Amazjasza, króla Judy, syna Jehoasza, syna Achazjasza, w Bet-Szemesz, przyszedł do Jerozolimy i zburzył mur Jerozolimy od Bramy Efraim aż do Bramy Narożnej, na czterysta łokci."
  tags: []
"2Krl14,14":
  text: "I zabrał całe złoto i srebro oraz wszystkie naczynia, które znajdowały się w domu PANA i w skarbcach domu królewskiego, a także zakładników, po czym wrócił do Samarii."
  tags: []
"2Krl14,15":
  text: "A pozostałe dzieje Jehoasza, które czynił, i jego potęga, i to, jak walczył z Amazjaszem, królem Judy, czy nie są zapisane w księdze kronik królów Izraela?"
  tags: []
"2Krl14,16":
  text: "I Jehoasz zasnął ze swymi ojcami, i został pogrzebany w Samarii wraz z królami Izraela, a jego syn Jeroboam królował w jego miejsce."
  tags: []
"2Krl14,17":
  text: "Amazjasz zaś, syn Joasza, król Judy, żył piętnaście lat po śmierci Jehoasza, syna Jehoachaza, króla Izraela."
  tags: []
"2Krl14,18":
  text: "A pozostałe dzieje Amazjasza – czy nie są zapisane w księdze kronik królów Judy?"
  tags: []
"2Krl14,19":
  text: "Potem uknuto przeciwko niemu spisek w Jerozolimie. Uciekł do Lakisz, lecz posłano za nim do Lakisz i tam go zabito."
  tags: []
"2Krl14,20":
  text: "Przywieziono go na koniach i został pogrzebany w Jerozolimie ze swymi ojcami, w mieście Dawida."
  tags: []
"2Krl14,21":
  text: "Cały lud Judy wziął Azariasza, który miał szesnaście lat, i ustanowili go królem po jego ojcu Amazjaszu."
  tags: []
"2Krl14,22":
  text: "On odbudował Elat i przywrócił je Judzie, po tym jak król zasnął ze swymi ojcami."
  tags: []
"2Krl14,23":
  text: "W piętnastym roku Amazjasza, syna Joasza, króla Judy, Jeroboam, syn Joasza, króla Izraela, zaczął królować w Samarii i królował czterdzieści jeden lat."
  tags: []
"2Krl14,24":
  text: "Czynił on to, co złe w oczach PANA. Nie odstąpił od żadnego z grzechów Jeroboama, syna Nebata, który przywiódł Izraela do grzechu."
  tags: []
"2Krl14,25":
  text: "On przywrócił granice Izraela od wejścia do Chamat aż do Morza Stepowego, według słowa PANA, Boga Izraela, które wypowiedział przez swego sługę Jonasza, syna Amittaja, proroka z Gat-ha-Chefer."
  tags: []
"2Krl14,26":
  text: "PAN bowiem widział gorzkie utrapienie Izraela. Nie było ani więźnia, ani opuszczonego, ani kogokolwiek, kto by pomógł Izraelowi."
  tags: []
"2Krl14,27":
  text: "A PAN nie powiedział, że miał wymazać imię Izraela spod niebios. Wybawił ich więc przez rękę Jeroboama, syna Joasza."
  tags: []
"2Krl14,28":
  text: "A pozostałe dzieje Jeroboama i wszystko, co czynił, oraz jego potęga, to, jak walczył i jak przywrócił Izraelowi Damaszek i Chamat judzkie – czy nie są zapisane w księdze kronik królów Izraela?"
  tags: []
"2Krl14,29":
  text: "I Jeroboam zasnął ze swymi ojcami, z królami Izraela, a Zachariasz, jego syn, królował w jego miejsce."
  tags: []
