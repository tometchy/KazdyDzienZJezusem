"2Krl4,1":
  text: "A pewna kobieta spośród żon synów proroków wołała do Elizeusza: Twój sługa, mój mąż, umarł. Ty wiesz, że twój sługa bał się PANA. Lecz teraz przyszedł wierzyciel, aby zabrać moich dwóch synów jako niewolników."
  tags: []
"2Krl4,2":
  text: "Elizeusz zapytał ją: Co mogę uczynić dla ciebie? Powiedz mi, co masz w domu? Odpowiedziała: Twoja służąca nie ma nic więcej w domu prócz dzbana oliwy."
  tags: []
"2Krl4,3":
  text: "Powiedział: Idź, pożycz sobie naczynia z zewnątrz od wszystkich swoich sąsiadów, naczynia puste – niemało."
  tags: []
"2Krl4,4":
  text: "Potem wejdź do domu, zamknij drzwi za sobą i za swymi synami i nalewaj do wszystkich tych naczyń, a napełnione odstaw."
  tags: []
"2Krl4,5":
  text: "Odeszła więc od niego, zamknęła drzwi za sobą i za swymi synami. Ci przynosili jej naczynia, a ona nalewała."
  tags: []
"2Krl4,6":
  text: "Kiedy naczynia były pełne, powiedziała do swego syna: Przynieś mi jeszcze naczynie. Odpowiedział jej: Nie ma już naczyń. I oliwa przestała płynąć."
  tags: []
"2Krl4,7":
  text: "Potem przyszła i opowiedziała o tym mężowi Bożemu. On powiedział jej: Idź, sprzedaj oliwę i spłać dług. Z reszty zaś utrzymuj siebie i swoich synów."
  tags: []
"2Krl4,8":
  text: "Zdarzyło się pewnego dnia, że Elizeusz przechodził przez Szunem, gdzie mieszkała zacna kobieta, która zatrzymała go, aby spożył posiłek. Ilekroć więc tamtędy przechodził, wstępował do niej, by spożyć posiłek."
  tags: []
"2Krl4,9":
  text: "Wtedy powiedziała do swego męża: Oto teraz wiem, że ten człowiek, który tędy ciągle przechodzi, jest świętym mężem Bożym."
  tags: []
"2Krl4,10":
  text: "Zróbmy mały górny pokój i wstawmy tam dla niego łóżko, stół, krzesło i świecznik. I kiedy przyjdzie do nas, uda się tam."
  tags: []
"2Krl4,11":
  text: "Pewnego dnia, gdy tam przybył, udał się do tego pokoju i tam się położył."
  tags: []
"2Krl4,12":
  text: "I powiedział do Gehaziego, swego sługi: Zawołaj tę Szunamitkę. Zawołał ją i stanęła przed nim."
  tags: []
"2Krl4,13":
  text: "Wtedy mu rzekł: Powiedz jej: Oto troszczysz się i starasz się o wszystkie nasze potrzeby. Co chcesz, abym dla ciebie uczynił? Czy można przemówić za tobą do króla lub dowódcy wojska? Odpowiedziała: Ja mieszkam pośród swojego ludu."
  tags: []
"2Krl4,14":
  text: "On zapytał: Co więc można dla niej uczynić? Gehazi odpowiedział: Oto nie ma syna, a jej mąż jest stary."
  tags: []
"2Krl4,15":
  text: "Polecił więc: Zawołaj ją. Zawołał ją i stanęła w drzwiach."
  tags: []
"2Krl4,16":
  text: "I powiedział: O tej porze za rok będziesz piastowała syna. Odpowiedziała: Nie, mój panie, mężu Boży, nie oszukuj swojej służącej."
  tags: []
"2Krl4,17":
  text: "Ale kobieta poczęła i urodziła syna po roku o tej porze, jak jej powiedział Elizeusz."
  tags: []
"2Krl4,18":
  text: "A gdy chłopiec podrósł, wyszedł pewnego dnia do swego ojca, do żniwiarzy."
  tags: []
"2Krl4,19":
  text: "I zawołał do swego ojca: Moja głowa! Moja głowa! On zaś powiedział słudze: Zanieś go do jego matki."
  tags: []
"2Krl4,20":
  text: "Wziął go więc i zaniósł do jego matki. I siedział na jej kolanach aż do południa, a potem umarł."
  tags: []
"2Krl4,21":
  text: "Wtedy ona poszła na górę i położyła go na łóżku męża Bożego, zamknęła drzwi i wyszła."
  tags: []
"2Krl4,22":
  text: "Potem zawołała swego męża i powiedziała: Proszę cię, przyślij mi jednego ze sług i jedną oślicę. Pobiegnę aż do męża Bożego i wrócę."
  tags: []
"2Krl4,23":
  text: "On zapytał: Po co chcesz jechać do niego? Nie ma dziś ani nowiu, ani szabatu. Ale ona rzekła: Będzie dobrze."
  tags: []
"2Krl4,24":
  text: "Osiodłała więc oślicę i powiedziała do swego sługi: Popędzaj ją i jedź! Nie wstrzymuj jazdy dla mnie, chyba że ci rozkażę."
  tags: []
"2Krl4,25":
  text: "Wyruszyła więc i przyjechała do męża Bożego na górę Karmel. A gdy mąż Boży zobaczył ją z daleka, powiedział do Gehaziego, swego sługi: Oto owa Szunamitka."
  tags: []
"2Krl4,26":
  text: "Wybiegnij, proszę, na jej spotkanie i zapytaj ją: Czy masz się dobrze? Czy dobrze się ma twój mąż? Czy dobrze się ma twój syn? Odpowiedziała: Dobrze."
  tags: []
"2Krl4,27":
  text: "A gdy przyszła do męża Bożego na górę, objęła go za nogi. A Gehazi zbliżył się, aby ją odepchnąć. Lecz mąż Boży powiedział: Zostaw ją, bo jej dusza jest pogrążona w smutku, a PAN zataił to przede mną i nie oznajmił mi tego."
  tags: []
"2Krl4,28":
  text: "Wtedy odezwała się: Czy prosiłam swego pana o syna? Czy nie powiedziałam: Nie oszukuj mnie?"
  tags: []
"2Krl4,29":
  text: "Wtedy on powiedział do Gehaziego: Przepasz swoje biodra, weź moją laskę do ręki i idź. Jeśli spotkasz kogoś, nie pozdrawiaj go, a jeśli ktoś ciebie pozdrowi, nie odpowiadaj mu. Połóż moją laskę na twarzy chłopca."
  tags: []
"2Krl4,30":
  text: "Lecz matka tego chłopca powiedziała: Jak żyje PAN i jak żyje twoja dusza, nie opuszczę cię. Wstał więc i poszedł za nią."
  tags: []
"2Krl4,31":
  text: "Gehazi zaś wyprzedził ich i położył laskę na twarzy chłopca, lecz nie było ani głosu, ani słuchu. Wrócił więc naprzeciw niego i oznajmił mu: Chłopiec się nie obudził."
  tags: []
"2Krl4,32":
  text: "Wtedy Elizeusz wszedł do domu, a oto zmarły chłopiec leżał na jego łóżku."
  tags: []
"2Krl4,33":
  text: "Wszedł więc, zamknął drzwi za nimi obydwoma i modlił się do PANA."
  tags: []
"2Krl4,34":
  text: "Następnie wszedł na łóżko, położył się na chłopcu, przyłożył swoje usta do jego ust, swoje oczy do jego oczu i swoje ręce do jego rąk. I rozciągnął się na nim, a ciało chłopca się rozgrzało."
  tags: []
"2Krl4,35":
  text: "Potem wyszedł od niego, przechadzał się po domu tam i z powrotem, po czym wstąpił do pokoju i położył się na nim. Wtedy chłopiec kichnął siedem razy i otworzył oczy."
  tags: []
"2Krl4,36":
  text: "Wówczas zawołał Gehaziego i powiedział: Zawołaj Szunamitkę. Zawołał ją, a gdy przyszła do niego, powiedział: Zabierz swego syna."
  tags: []
"2Krl4,37":
  text: "Ona więc weszła, upadła u jego nóg i ukłoniła się aż do ziemi, potem zabrała swego syna i wyszła."
  tags: []
"2Krl4,38":
  text: "Następnie Elizeusz wrócił do Gilgal, a w tej ziemi panował głód. Gdy synowie proroków siedzieli przed nim, powiedział do swego sługi: Wstaw wielki kocioł i ugotuj zupę dla synów proroków."
  tags: []
"2Krl4,39":
  text: "Jeden z nich więc wyszedł na pole, aby nazbierać ziół, znalazł dzikie pnącze i narwał z niego pełen płaszcz dzikich owoców. Potem przyszedł i wkroił je do kotła z zupą, bo ich nie znano."
  tags: []
"2Krl4,40":
  text: "Następnie nalano tym mężczyznom do jedzenia. A gdy jedli tę zupę, zawołali: Śmierć w kotle, mężu Boży! I nie mogli jeść."
  tags: []
"2Krl4,41":
  text: "On zaś powiedział: Przynieście więc mąki. Wrzucił ją do kotła i powiedział: Nalej ludowi, aby jadł. I nie było już nic szkodliwego w kotle."
  tags: []
"2Krl4,42":
  text: "Pewien człowiek przyszedł z Baal-Szalisza i przyniósł mężowi Bożemu chleb z pierwocin zbóż, dwadzieścia chlebów jęczmiennych i pełne kłosy świeżego zboża. On powiedział: Daj ludowi, aby jadł."
  tags: []
"2Krl4,43":
  text: "Ale jego sługa zapytał: Jak mam to położyć przed stu mężczyznami? Znowu powiedział: Daj ludowi, aby jadł. Tak bowiem mówi PAN: Będą jeść i jeszcze pozostanie."
  tags: []
"2Krl4,44":
  text: "Położył więc przed nimi, a ci jedli i jeszcze zostawili, według słowa PANA."
  tags: []
