"Rz1,1":
  text: "Paweł, sługa Jezusa Chrystusa, powołany apostoł, odłączony do głoszenia ewangelii Boga;"
  tags: []
"Rz1,2":
  text: "(Którą przedtem obiecał przez swoich proroków w Pismach świętych);"
  tags: []
"Rz1,3":
  text: "O jego Synu, Jezusie Chrystusie, naszym Panu, który według ciała pochodził z potomstwa Dawida;"
  tags: []
"Rz1,4":
  text: "A pokazał z mocą, że jest Synem Bożym, według Ducha świętości, przez zmartwychwstanie;"
  tags: []
"Rz1,5":
  text: "Przez którego otrzymaliśmy łaskę i apostolstwo, by przywieść do posłuszeństwa wierze wszystkie narody dla jego imienia;"
  tags: []
"Rz1,6":
  text: "Wśród których jesteście i wy, powołani przez Jezusa Chrystusa."
  tags: []
"Rz1,7":
  text: "Wszystkim, którzy jesteście w Rzymie, umiłowanym Boga, powołanym świętym: Łaska wam i pokój od Boga, naszego Ojca, i Pana Jezusa Chrystusa."
  tags: []
"Rz1,8":
  text: "Najpierw dziękuję mojemu Bogu przez Jezusa Chrystusa za was wszystkich, że wasza wiara słynie na cały świat."
  tags: []
"Rz1,9":
  text: "Bóg bowiem, któremu służę w moim duchu w ewangelii jego Syna, jest mi świadkiem, że nieustannie czynię wzmiankę o was w moich modlitwach;"
  tags: []
"Rz1,10":
  text: "Zawsze prosząc, żeby wreszcie kiedyś udało mi się za wolą Bożą odbyć podróż do was."
  tags: []
"Rz1,11":
  text: "Pragnę bowiem zobaczyć was, abym wam mógł udzielić jakiegoś daru duchowego dla waszego utwierdzenia;"
  tags: []
"Rz1,12":
  text: "To znaczy, abyśmy się wzajemnie pocieszyli obopólną wiarą, waszą i moją."
  tags: []
"Rz1,13":
  text: "A nie chcę, abyście i wy, bracia, nie wiedzieli, że często zamierzałem przybyć do was (ale byłem dotąd zatrzymywany), abym miał jakiś owoc zarówno wśród was, jak i wśród innych pogan."
  tags: []
"Rz1,14":
  text: "Jestem dłużnikiem zarówno Greków, jak i barbarzyńców, zarówno mądrych, jak i niemądrych;"
  tags: []
"Rz1,15":
  text: "Tak że na ile mogę, jestem gotowy i wam, którzy jesteście w Rzymie, głosić ewangelię."
  tags: []
"Rz1,16":
  text: "Nie wstydzę się bowiem ewangelii Chrystusa, ponieważ jest ona mocą Boga ku zbawieniu dla każdego, kto uwierzy, najpierw Żyda, potem i Greka."
  tags: []
"Rz1,17":
  text: "W niej bowiem objawia się sprawiedliwość Boga z wiary w wiarę, jak jest napisane: Sprawiedliwy będzie żył z wiary."
  tags: []
"Rz1,18":
  text: "Gniew Boży bowiem objawia się z nieba przeciwko wszelkiej bezbożności i niesprawiedliwości ludzi, którzy zatrzymują prawdę w niesprawiedliwości."
  tags: []
"Rz1,19":
  text: "Ponieważ to, co można wiedzieć o Bogu, jest dla nich jawne, gdyż Bóg im to objawił."
  tags: []
"Rz1,20":
  text: "To bowiem, co niewidzialne, to znaczy jego wieczna moc i bóstwo, są widzialne od stworzenia świata przez to, co stworzone, po to, aby oni byli bez wymówki."
  tags: []
"Rz1,21":
  text: "Dlatego że poznawszy Boga, nie chwalili go jako Boga ani mu nie dziękowali, lecz znikczemnieli w swoich myślach i zaćmiło się ich bezrozumne serce."
  tags: []
"Rz1,22":
  text: "Podając się za mądrych, zgłupieli;"
  tags: []
"Rz1,23":
  text: "I zamienili chwałę niezniszczalnego Boga na podobieństwo obrazu zniszczalnego człowieka, ptaków, czworonożnych zwierząt i gadów."
  tags: []
"Rz1,24":
  text: "Dlatego też Bóg wydał ich nieczystości przez pożądliwości ich serc, aby hańbili swoje ciała między sobą."
  tags: []
"Rz1,25":
  text: "Oni to zamienili prawdę Bożą w kłamstwo i czcili stworzenie, i służyli jemu raczej niż Stwórcy, który jest błogosławiony na wieki. Amen."
  tags: []
"Rz1,26":
  text: "Dlatego wydał ich Bóg haniebnym namiętnościom, gdyż nawet ich kobiety zamieniły naturalne współżycie na przeciwne naturze."
  tags: []
"Rz1,27":
  text: "Także mężczyźni, opuściwszy naturalne współżycie z kobietą, zapałali w swej pożądliwości jedni ku drugim, mężczyzna z mężczyzną, popełniając haniebne czyny i ponosząc na sobie samych należną za swój błąd zapłatę."
  tags: []
"Rz1,28":
  text: "A skoro im się nie spodobało zachowanie poznania Boga, wydał ich Bóg na pastwę wypaczonego umysłu, aby robili to, co nie wypada;"
  tags: []
"Rz1,29":
  text: "Będąc napełnieni wszelką nieprawością, nierządem, przewrotnością, chciwością, złośliwością; pełni zazdrości, morderstwa, sporu, podstępu, złych obyczajów;"
  tags: []
"Rz1,30":
  text: "Plotkarze, oszczercy, nienawidzący Boga, zuchwali, pyszni, chełpliwi, wynalazcy złych rzeczy, nieposłuszni rodzicom;"
  tags: []
"Rz1,31":
  text: "Bezrozumni, niedotrzymujący słowa, bez naturalnej miłości, nieprzejednani i bez miłosierdzia."
  tags: []
"Rz1,32":
  text: "Oni to, poznawszy wyrok Boga, że ci, którzy robią takie rzeczy, są godni śmierci, nie tylko sami je robią, ale też pochwalają tych, którzy tak postępują."
  tags: []
