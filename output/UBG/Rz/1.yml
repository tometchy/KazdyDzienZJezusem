"Rz1,1": "Paweł, sługa Jezusa Chrystusa, powołany apostoł, odłączony do głoszenia ewangelii Boga;"
"Rz1,2": "(Którą przedtem obiecał przez swoich proroków w Pismach świętych);"
"Rz1,3": "O jego Synu, Jezusie Chrystusie, naszym Panu, który według ciała pochodził z potomstwa Dawida;"
"Rz1,4": "A pokazał z mocą, że jest Synem Bożym, według Ducha świętości, przez zmartwychwstanie;"
"Rz1,5": "Przez którego otrzymaliśmy łaskę i apostolstwo, by przywieść do posłuszeństwa wierze wszystkie narody dla jego imienia;"
"Rz1,6": "Wśród których jesteście i wy, powołani przez Jezusa Chrystusa."
"Rz1,7": "Wszystkim, którzy jesteście w Rzymie, umiłowanym Boga, powołanym świętym: Łaska wam i pokój od Boga, naszego Ojca, i Pana Jezusa Chrystusa."
"Rz1,8": "Najpierw dziękuję mojemu Bogu przez Jezusa Chrystusa za was wszystkich, że wasza wiara słynie na cały świat."
"Rz1,9": "Bóg bowiem, któremu służę w moim duchu w ewangelii jego Syna, jest mi świadkiem, że nieustannie czynię wzmiankę o was w moich modlitwach;"
"Rz1,10": "Zawsze prosząc, żeby wreszcie kiedyś udało mi się za wolą Bożą odbyć podróż do was."
"Rz1,11": "Pragnę bowiem zobaczyć was, abym wam mógł udzielić jakiegoś daru duchowego dla waszego utwierdzenia;"
"Rz1,12": "To znaczy, abyśmy się wzajemnie pocieszyli obopólną wiarą, waszą i moją."
"Rz1,13": "A nie chcę, abyście i wy, bracia, nie wiedzieli, że często zamierzałem przybyć do was (ale byłem dotąd zatrzymywany), abym miał jakiś owoc zarówno wśród was, jak i wśród innych pogan."
"Rz1,14": "Jestem dłużnikiem zarówno Greków, jak i barbarzyńców, zarówno mądrych, jak i niemądrych;"
"Rz1,15": "Tak że na ile mogę, jestem gotowy i wam, którzy jesteście w Rzymie, głosić ewangelię."
"Rz1,16": "Nie wstydzę się bowiem ewangelii Chrystusa, ponieważ jest ona mocą Boga ku zbawieniu dla każdego, kto uwierzy, najpierw Żyda, potem i Greka."
"Rz1,17": "W niej bowiem objawia się sprawiedliwość Boga z wiary w wiarę, jak jest napisane: Sprawiedliwy będzie żył z wiary."
"Rz1,18": "Gniew Boży bowiem objawia się z nieba przeciwko wszelkiej bezbożności i niesprawiedliwości ludzi, którzy zatrzymują prawdę w niesprawiedliwości."
"Rz1,19": "Ponieważ to, co można wiedzieć o Bogu, jest dla nich jawne, gdyż Bóg im to objawił."
"Rz1,20": "To bowiem, co niewidzialne, to znaczy jego wieczna moc i bóstwo, są widzialne od stworzenia świata przez to, co stworzone, po to, aby oni byli bez wymówki."
"Rz1,21": "Dlatego że poznawszy Boga, nie chwalili go jako Boga ani mu nie dziękowali, lecz znikczemnieli w swoich myślach i zaćmiło się ich bezrozumne serce."
"Rz1,22": "Podając się za mądrych, zgłupieli;"
"Rz1,23": "I zamienili chwałę niezniszczalnego Boga na podobieństwo obrazu zniszczalnego człowieka, ptaków, czworonożnych zwierząt i gadów."
"Rz1,24": "Dlatego też Bóg wydał ich nieczystości przez pożądliwości ich serc, aby hańbili swoje ciała między sobą."
"Rz1,25": "Oni to zamienili prawdę Bożą w kłamstwo i czcili stworzenie, i służyli jemu raczej niż Stwórcy, który jest błogosławiony na wieki. Amen."
"Rz1,26": "Dlatego wydał ich Bóg haniebnym namiętnościom, gdyż nawet ich kobiety zamieniły naturalne współżycie na przeciwne naturze."
"Rz1,27": "Także mężczyźni, opuściwszy naturalne współżycie z kobietą, zapałali w swej pożądliwości jedni ku drugim, mężczyzna z mężczyzną, popełniając haniebne czyny i ponosząc na sobie samych należną za swój błąd zapłatę."
"Rz1,28": "A skoro im się nie spodobało zachowanie poznania Boga, wydał ich Bóg na pastwę wypaczonego umysłu, aby robili to, co nie wypada;"
"Rz1,29": "Będąc napełnieni wszelką nieprawością, nierządem, przewrotnością, chciwością, złośliwością; pełni zazdrości, morderstwa, sporu, podstępu, złych obyczajów;"
"Rz1,30": "Plotkarze, oszczercy, nienawidzący Boga, zuchwali, pyszni, chełpliwi, wynalazcy złych rzeczy, nieposłuszni rodzicom;"
"Rz1,31": "Bezrozumni, niedotrzymujący słowa, bez naturalnej miłości, nieprzejednani i bez miłosierdzia."
"Rz1,32": "Oni to, poznawszy wyrok Boga, że ci, którzy robią takie rzeczy, są godni śmierci, nie tylko sami je robią, ale też pochwalają tych, którzy tak postępują."
