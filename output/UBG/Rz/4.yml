"Rz4,1": "Cóż więc powiemy, co zyskał Abraham, nasz ojciec, według ciała?"
"Rz4,2": "Jeśli bowiem Abraham został usprawiedliwiony z uczynków, ma się czym chlubić, ale nie przed Bogiem."
"Rz4,3": "Cóż bowiem mówi Pismo? Abraham uwierzył Bogu i zostało mu to poczytane za sprawiedliwość."
"Rz4,4": "A temu, kto pracuje, zapłata nie jest uznana za łaskę, ale za należność."
"Rz4,5": "Temu zaś, kto nie pracuje, lecz wierzy w tego, który usprawiedliwia bezbożnego, jego wiara zostaje poczytana za sprawiedliwość."
"Rz4,6": "Jak i Dawid mówi, że błogosławiony jest człowiek, któremu Bóg przypisze sprawiedliwość bez uczynków, mówiąc:"
"Rz4,7": "Błogosławieni, których nieprawości są przebaczone i których grzechy są zakryte."
"Rz4,8": "Błogosławiony człowiek, któremu Pan nie poczyta grzechu."
"Rz4,9": "Czy więc to błogosławieństwo dotyczy tylko obrzezanych, czy też nieobrzezanych? Mówimy przecież, że wiara została Abrahamowi poczytana za sprawiedliwość."
"Rz4,10": "Jakże więc została mu poczytana? Gdy był obrzezany czy przed obrzezaniem? Nie po obrzezaniu, ale przed obrzezaniem."
"Rz4,11": "I przyjął znak obrzezania jako pieczęć sprawiedliwości wiary, którą miał przed obrzezaniem, po to, aby był ojcem wszystkich nieobrzezanych wierzących, aby im też poczytana była sprawiedliwość;"
"Rz4,12": "I aby był ojcem obrzezania, nie tylko tych, którzy są obrzezani, ale też tych, którzy chodzą śladami wiary naszego ojca Abrahama, którą miał przed obrzezaniem."
"Rz4,13": "Obietnica bowiem, że ma być dziedzicem świata, nie została dana Abrahamowi czy jego potomstwu przez prawo, ale przez sprawiedliwość wiary."
"Rz4,14": "Jeśli bowiem dziedzicami są ci, którzy są z prawa, to wiara stała się daremna i obietnica obróciła się wniwecz."
"Rz4,15": "Gdyż prawo sprowadza gniew, bo gdzie nie ma prawa, tam nie ma przestępstwa."
"Rz4,16": "Tak więc dziedzictwo jest z wiary, aby było z łaski i żeby obietnica była niewzruszona dla całego potomstwa, nie tylko dla tego, które opiera się na prawie, ale i dla tego, które jest z wiary Abrahama, który jest ojcem nas wszystkich;"
"Rz4,17": "(Jak jest napisane: Ustanowiłem cię ojcem wielu narodów) przed Bogiem, któremu uwierzył, który ożywia umarłych i przywołuje te rzeczy, których nie ma, tak jakby były."
"Rz4,18": "On to wbrew nadziei, mając nadzieję, uwierzył, że stanie się ojcem wielu narodów według tego, co mu powiedziano: Takie będzie twoje potomstwo."
"Rz4,19": "A nie będąc słabym w wierze, nie zważał na swoje już obumarłe ciało – bo miał około stu lat – ani na obumarłe łono Sary."
"Rz4,20": "I nie zachwiał się z powodu niewiary w obietnicę Boga, ale umocnił się wiarą i oddał chwałę Bogu;"
"Rz4,21": "Będąc też pewien tego, że to, co on obiecał, ma moc też uczynić."
"Rz4,22": "Dlatego zostało mu to poczytane za sprawiedliwość."
"Rz4,23": "A nie tylko ze względu na niego samego napisano, że zostało mu to poczytane;"
"Rz4,24": "Ale i ze względu na nas, którym ma być poczytane, którzy wierzymy w tego, który wskrzesił z martwych Jezusa, naszego Pana;"
"Rz4,25": "Który został wydany za nasze grzechy i wstał z martwych dla naszego usprawiedliwienia."
