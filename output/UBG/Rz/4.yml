"Rz4,1":
  text: "Cóż więc powiemy, co zyskał Abraham, nasz ojciec, według ciała?"
  tags: []
"Rz4,2":
  text: "Jeśli bowiem Abraham został usprawiedliwiony z uczynków, ma się czym chlubić, ale nie przed Bogiem."
  tags: []
"Rz4,3":
  text: "Cóż bowiem mówi Pismo? Abraham uwierzył Bogu i zostało mu to poczytane za sprawiedliwość."
  tags: []
"Rz4,4":
  text: "A temu, kto pracuje, zapłata nie jest uznana za łaskę, ale za należność."
  tags: []
"Rz4,5":
  text: "Temu zaś, kto nie pracuje, lecz wierzy w tego, który usprawiedliwia bezbożnego, jego wiara zostaje poczytana za sprawiedliwość."
  tags: []
"Rz4,6":
  text: "Jak i Dawid mówi, że błogosławiony jest człowiek, któremu Bóg przypisze sprawiedliwość bez uczynków, mówiąc:"
  tags: []
"Rz4,7":
  text: "Błogosławieni, których nieprawości są przebaczone i których grzechy są zakryte."
  tags: []
"Rz4,8":
  text: "Błogosławiony człowiek, któremu Pan nie poczyta grzechu."
  tags: []
"Rz4,9":
  text: "Czy więc to błogosławieństwo dotyczy tylko obrzezanych, czy też nieobrzezanych? Mówimy przecież, że wiara została Abrahamowi poczytana za sprawiedliwość."
  tags: []
"Rz4,10":
  text: "Jakże więc została mu poczytana? Gdy był obrzezany czy przed obrzezaniem? Nie po obrzezaniu, ale przed obrzezaniem."
  tags: []
"Rz4,11":
  text: "I przyjął znak obrzezania jako pieczęć sprawiedliwości wiary, którą miał przed obrzezaniem, po to, aby był ojcem wszystkich nieobrzezanych wierzących, aby im też poczytana była sprawiedliwość;"
  tags: []
"Rz4,12":
  text: "I aby był ojcem obrzezania, nie tylko tych, którzy są obrzezani, ale też tych, którzy chodzą śladami wiary naszego ojca Abrahama, którą miał przed obrzezaniem."
  tags: []
"Rz4,13":
  text: "Obietnica bowiem, że ma być dziedzicem świata, nie została dana Abrahamowi czy jego potomstwu przez prawo, ale przez sprawiedliwość wiary."
  tags: []
"Rz4,14":
  text: "Jeśli bowiem dziedzicami są ci, którzy są z prawa, to wiara stała się daremna i obietnica obróciła się wniwecz."
  tags: []
"Rz4,15":
  text: "Gdyż prawo sprowadza gniew, bo gdzie nie ma prawa, tam nie ma przestępstwa."
  tags: []
"Rz4,16":
  text: "Tak więc dziedzictwo jest z wiary, aby było z łaski i żeby obietnica była niewzruszona dla całego potomstwa, nie tylko dla tego, które opiera się na prawie, ale i dla tego, które jest z wiary Abrahama, który jest ojcem nas wszystkich;"
  tags: []
"Rz4,17":
  text: "(Jak jest napisane: Ustanowiłem cię ojcem wielu narodów) przed Bogiem, któremu uwierzył, który ożywia umarłych i przywołuje te rzeczy, których nie ma, tak jakby były."
  tags: []
"Rz4,18":
  text: "On to wbrew nadziei, mając nadzieję, uwierzył, że stanie się ojcem wielu narodów według tego, co mu powiedziano: Takie będzie twoje potomstwo."
  tags: []
"Rz4,19":
  text: "A nie będąc słabym w wierze, nie zważał na swoje już obumarłe ciało – bo miał około stu lat – ani na obumarłe łono Sary."
  tags: []
"Rz4,20":
  text: "I nie zachwiał się z powodu niewiary w obietnicę Boga, ale umocnił się wiarą i oddał chwałę Bogu;"
  tags: []
"Rz4,21":
  text: "Będąc też pewien tego, że to, co on obiecał, ma moc też uczynić."
  tags: []
"Rz4,22":
  text: "Dlatego zostało mu to poczytane za sprawiedliwość."
  tags: []
"Rz4,23":
  text: "A nie tylko ze względu na niego samego napisano, że zostało mu to poczytane;"
  tags: []
"Rz4,24":
  text: "Ale i ze względu na nas, którym ma być poczytane, którzy wierzymy w tego, który wskrzesił z martwych Jezusa, naszego Pana;"
  tags: []
"Rz4,25":
  text: "Który został wydany za nasze grzechy i wstał z martwych dla naszego usprawiedliwienia."
  tags: []
