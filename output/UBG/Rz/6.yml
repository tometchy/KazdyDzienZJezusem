"Rz6,1":
  text: "Cóż więc powiemy? Czy mamy trwać w grzechu, aby łaska obfitowała?"
  tags: []
"Rz6,2":
  text: "Nie daj Boże! My, którzy umarliśmy dla grzechu, jakże możemy jeszcze w nim żyć?"
  tags: []
"Rz6,3":
  text: "Czyż nie wiecie, że my wszyscy, którzy zostaliśmy ochrzczeni w Jezusie Chrystusie, w jego śmierci zostaliśmy ochrzczeni?"
  tags: []
"Rz6,4":
  text: "Zostaliśmy więc pogrzebani z nim przez chrzest w śmierci, aby jak Chrystus został wskrzeszony z martwych przez chwałę Ojca, tak żebyśmy i my postępowali w nowości życia."
  tags: []
"Rz6,5":
  text: "Jeśli bowiem zostaliśmy z nim wszczepieni w podobieństwo jego śmierci, to będziemy też z nim wszczepieni w podobieństwo zmartwychwstania;"
  tags: []
"Rz6,6":
  text: "Wiedząc o tym, że nasz stary człowiek został ukrzyżowany razem z nim, aby ciało grzechu zostało zniszczone, żebyśmy już więcej nie służyli grzechowi."
  tags: []
"Rz6,7":
  text: "Kto bowiem umarł, został uwolniony od grzechu."
  tags: []
"Rz6,8":
  text: "Jeśli więc umarliśmy z Chrystusem, wierzymy, że też z nim będziemy żyć;"
  tags: []
"Rz6,9":
  text: "Wiedząc, że Chrystus, powstawszy z martwych, więcej nie umiera i śmierć nad nim więcej nie panuje."
  tags: []
"Rz6,10":
  text: "To bowiem, że umarł, raz umarł dla grzechu, a że żyje, żyje dla Boga."
  tags: []
"Rz6,11":
  text: "Tak i wy uważajcie siebie za martwych dla grzechu, a żywych dla Boga w Jezusie Chrystusie, naszym Panu."
  tags: []
"Rz6,12":
  text: "Niechże więc grzech nie króluje w waszym śmiertelnym ciele, żebyście mieli mu być posłuszni w jego pożądliwościach."
  tags: []
"Rz6,13":
  text: "I nie oddawajcie waszych członków jako oręża niesprawiedliwości grzechowi, ale oddawajcie samych siebie Bogu jako ożywieni z martwych i wasze członki jako oręż sprawiedliwości Bogu."
  tags: []
"Rz6,14":
  text: "Grzech bowiem nie będzie nad wami panował, bo nie jesteście pod prawem, lecz pod łaską."
  tags: []
"Rz6,15":
  text: "Cóż więc? Będziemy grzeszyć, bo nie jesteśmy pod prawem, ale pod łaską? Nie daj Boże!"
  tags: []
"Rz6,16":
  text: "Czyż nie wiecie, że komu oddajecie siebie jako słudzy w posłuszeństwo, komu jesteście posłuszni, tego jesteście sługami: bądź grzechu ku śmierci, bądź posłuszeństwa ku sprawiedliwości?"
  tags: []
"Rz6,17":
  text: "Ale chwała Bogu, że gdy byliście sługami grzechu, usłuchaliście z serca wzoru tej nauki, której się poddaliście;"
  tags: []
"Rz6,18":
  text: "A będąc uwolnieni od grzechu, staliście się sługami sprawiedliwości."
  tags: []
"Rz6,19":
  text: "Po ludzku mówię, z powodu słabości waszego ciała. Jak bowiem oddawaliście wasze członki na służbę nieczystości i nieprawości, aby czynić nieprawość, tak teraz oddawajcie wasze członki na służbę sprawiedliwości, abyście byli uświęceni."
  tags: []
"Rz6,20":
  text: "Dopóki bowiem byliście sługami grzechu, byliście wolni od sprawiedliwości."
  tags: []
"Rz6,21":
  text: "Jakiż więc wówczas mieliście pożytek z tych rzeczy, których się teraz wstydzicie? Ich bowiem końcem jest śmierć."
  tags: []
"Rz6,22":
  text: "Lecz teraz, uwolnieni od grzechu, gdy staliście się sługami Boga, macie swój pożytek ku uświęceniu, a na końcu życie wieczne."
  tags: []
"Rz6,23":
  text: "Zapłatą bowiem za grzech jest śmierć, ale darem łaski Boga jest życie wieczne w Jezusie Chrystusie, naszym Panu."
  tags: []
