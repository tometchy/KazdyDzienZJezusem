"Rz13,1":
  text: "Każda dusza niech będzie poddana władzom zwierzchnim. Nie ma bowiem władzy innej, jak tylko od Boga, a te władze, które są, zostały ustanowione przez Boga."
  tags: []
"Rz13,2":
  text: "Tak więc kto się sprzeciwia władzy, sprzeciwia się postanowieniu Boga. Ci zaś, którzy się sprzeciwiają, sami na siebie ściągają potępienie."
  tags: []
"Rz13,3":
  text: "Przełożeni bowiem nie są postrachem dla uczynków dobrych, ale złych. A chcesz nie bać się władzy? Czyń dobrze, a będziesz miał od niej pochwałę."
  tags: []
"Rz13,4":
  text: "Jest bowiem sługą Boga dla twojego dobra. Ale jeśli czynisz zło, bój się, bo nie na próżno nosi miecz, gdyż jest sługą Boga, mszczącym się w gniewie nad tym, który czyni zło."
  tags: []
"Rz13,5":
  text: "Dlatego trzeba być poddanym nie tylko z powodu gniewu, ale i ze względu na sumienie."
  tags: []
"Rz13,6":
  text: "Z tego też powodu płacicie podatki. Ci bowiem, którzy tego właśnie ustawicznie pilnują, są sługami Boga."
  tags: []
"Rz13,7":
  text: "Oddawajcie więc każdemu to, co mu się należy: komu podatek, temu podatek, komu cło, temu cło, komu bojaźń, temu bojaźń, komu cześć, temu cześć."
  tags: []
"Rz13,8":
  text: "Nikomu nie bądźcie nic winni oprócz wzajemnej miłości. Kto bowiem miłuje bliźniego, wypełnił prawo."
  tags: []
"Rz13,9":
  text: "Gdyż to: Nie będziesz cudzołożył, nie będziesz zabijał, nie będziesz kradł, nie będziesz fałszywie świadczył, nie będziesz pożądał i jakiekolwiek inne przykazanie, w tych słowach się streszcza, mianowicie: Będziesz miłował swego bliźniego jak samego siebie."
  tags: []
"Rz13,10":
  text: "Miłość nie wyrządza zła bliźniemu. Tak więc wypełnieniem prawa jest miłość."
  tags: []
"Rz13,11":
  text: "A czyńcie to, znając czas, że już nadeszła pora, abyśmy się obudzili ze snu. Teraz bowiem bliżej nas jest zbawienie, niż kiedy uwierzyliśmy."
  tags: []
"Rz13,12":
  text: "Noc przeminęła, a dzień się przybliżył. Odrzućmy więc uczynki ciemności, a obleczmy się w zbroję światłości."
  tags: []
"Rz13,13":
  text: "Postępujmy uczciwie, jak za dnia, nie w hulankach i pijaństwach, nie w rozwiązłości i rozpustach, nie w sporach ani w zazdrości."
  tags: []
"Rz13,14":
  text: "Ale obleczcie się w Pana Jezusa Chrystusa, a nie troszczcie się o ciało, by zaspokajać pożądliwości."
  tags: []
