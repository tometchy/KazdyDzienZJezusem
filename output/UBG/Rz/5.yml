"Rz5,1":
  text: "Będąc więc usprawiedliwieni przez wiarę, mamy pokój z Bogiem przez naszego Pana Jezusa Chrystusa;"
  tags: []
"Rz5,2":
  text: "Dzięki któremu też otrzymaliśmy dostęp przez wiarę do tej łaski, w której trwamy i chlubimy się nadzieją chwały Boga."
  tags: []
"Rz5,3":
  text: "A nie tylko to, ale chlubimy się też uciskami, wiedząc, że ucisk wyrabia cierpliwość;"
  tags: []
"Rz5,4":
  text: "A cierpliwość – doświadczenie, doświadczenie zaś – nadzieję;"
  tags: []
"Rz5,5":
  text: "A nadzieja nie przynosi wstydu, ponieważ miłość Boga jest rozlana w naszych sercach przez Ducha Świętego, który został nam dany."
  tags: []
"Rz5,6":
  text: "Chrystus bowiem, gdy jeszcze byliśmy słabi, we właściwym czasie umarł za bezbożnych."
  tags: []
"Rz5,7":
  text: "Choć rzadko się zdarza, że ktoś umrze za sprawiedliwego, jednak za dobrego może ktoś odważyłby się umrzeć."
  tags: []
"Rz5,8":
  text: "Lecz Bóg okazuje nam swoją miłość przez to, że gdy jeszcze byliśmy grzesznikami, Chrystus za nas umarł."
  tags: []
"Rz5,9":
  text: "Tym bardziej więc teraz, będąc usprawiedliwieni jego krwią, będziemy przez niego ocaleni od gniewu."
  tags: []
"Rz5,10":
  text: "Jeśli bowiem, będąc nieprzyjaciółmi, zostaliśmy pojednani z Bogiem przez śmierć jego Syna, tym bardziej, będąc pojednani, będziemy ocaleni przez jego życie."
  tags: []
"Rz5,11":
  text: "A nie tylko to, ale też chlubimy się Bogiem przez naszego Pana Jezusa Chrystusa, przez którego teraz otrzymaliśmy pojednanie."
  tags: []
"Rz5,12":
  text: "Dlatego, tak jak przez jednego człowieka grzech wszedł na świat, a przez grzech – śmierć, tak też na wszystkich ludzi przeszła śmierć, ponieważ wszyscy zgrzeszyli."
  tags: []
"Rz5,13":
  text: "Grzech bowiem był na świecie aż do nadania prawa, ale grzechu się nie poczytuje, gdy nie ma prawa."
  tags: []
"Rz5,14":
  text: "Śmierć jednak królowała od Adama aż do Mojżesza nawet nad tymi, którzy nie popełnili grzechu podobnego do przestępstwa Adama, który jest obrazem tego, który miał przyjść."
  tags: []
"Rz5,15":
  text: "Lecz z przestępstwem nie jest tak, jak z darem łaski. Jeśli bowiem przez przestępstwo jednego wielu umarło, tym obficiej spłynęła na wielu łaska Boga i dar przez łaskę jednego człowieka, Jezusa Chrystusa."
  tags: []
"Rz5,16":
  text: "A z darem nie jest tak, jak z tym, co przyszło przez jednego, który zgrzeszył. Wyrok bowiem jest z powodu jednego przestępstwa ku potępieniu, ale dar łaski z powodu wielu przestępstw ku usprawiedliwieniu."
  tags: []
"Rz5,17":
  text: "Jeśli bowiem z powodu przestępstwa jednego śmierć zaczęła królować przez jednego, tym bardziej ci, którzy przyjmują obfitość tej łaski i dar sprawiedliwości, będą królować w życiu przez jednego, Jezusa Chrystusa."
  tags: []
"Rz5,18":
  text: "Tak więc, jak przez przestępstwo jednego na wszystkich ludzi spadł wyrok ku potępieniu, tak też przez sprawiedliwość jednego na wszystkich ludzi spłynął dar ku usprawiedliwieniu dającemu życie."
  tags: []
"Rz5,19":
  text: "Jak bowiem przez nieposłuszeństwo jednego człowieka wielu stało się grzesznikami, tak przez posłuszeństwo jednego wielu stało się sprawiedliwymi."
  tags: []
"Rz5,20":
  text: "A prawo wkroczyło po to, aby obfitował grzech. Lecz gdzie grzech się rozmnożył, tam łaska tym bardziej obfitowała;"
  tags: []
"Rz5,21":
  text: "Aby, jak grzech królował ku śmierci, tak też łaska królowała przez sprawiedliwość ku życiu wiecznemu przez Jezusa Chrystusa, naszego Pana."
  tags: []
