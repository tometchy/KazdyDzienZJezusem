"Rz12,1":
  text: "Proszę więc was, bracia, przez miłosierdzie Boże, abyście składali wasze ciała jako ofiarę żywą, świętą, przyjemną Bogu, to jest wasza rozumna służba."
  tags: []
"Rz12,2":
  text: "A nie dostosowujcie się do tego świata, ale przemieńcie się przez odnowienie waszego umysłu, abyście mogli rozeznać, co jest dobrą, przyjemną i doskonałą wolą Boga."
  tags: []
"Rz12,3":
  text: "Mówię bowiem przez łaskę, która mi jest dana, każdemu, kto jest wśród was, aby nie myślał o sobie więcej niż należy, ale żeby myślał o sobie skromnie, stosownie do miary wiary, jakiej Bóg każdemu udzielił."
  tags: []
"Rz12,4":
  text: "Jak bowiem w jednym ciele mamy wiele członków, ale nie wszystkie członki wykonują tę samą czynność;"
  tags: []
"Rz12,5":
  text: "Tak my, chociaż liczni, jesteśmy jednym ciałem w Chrystusie, ale z osobna jesteśmy członkami jedni drugich."
  tags: []
"Rz12,6":
  text: "Mamy więc różne dary według łaski, która nam jest dana: jeśli ktoś ma dar prorokowania, niech go używa stosownie do miary wiary;"
  tags: []
"Rz12,7":
  text: "Jeśli usługiwania, niech usługuje; jeśli ktoś naucza, niech trwa w nauczaniu;"
  tags: []
"Rz12,8":
  text: "Jeśli ktoś napomina, to w napominaniu; jeśli ktoś rozdaje, to w szczerości; jeśli ktoś jest przełożonym, niech nim będzie w pilności; jeśli ktoś okazuje miłosierdzie, niech to czyni ochoczo."
  tags: []
"Rz12,9":
  text: "Miłość niech będzie nieobłudna. Brzydźcie się złem, trzymając się tego, co dobre."
  tags: []
"Rz12,10":
  text: "Miłujcie się wzajemnie miłością braterską, wyprzedzając jedni drugich w okazywaniu szacunku."
  tags: []
"Rz12,11":
  text: "W pracy nieleniwi, pałający duchem, służący Panu;"
  tags: []
"Rz12,12":
  text: "Radujący się w nadziei, cierpliwi w ucisku, nieustający w modlitwie;"
  tags: []
"Rz12,13":
  text: "Wspomagający świętych w potrzebach, okazujący gościnność."
  tags: []
"Rz12,14":
  text: "Błogosławcie tych, którzy was prześladują, błogosławcie, a nie przeklinajcie."
  tags: []
"Rz12,15":
  text: "Radujcie się z tymi, którzy się radują, a płaczcie z tymi, którzy płaczą."
  tags: []
"Rz12,16":
  text: "Bądźcie między sobą jednomyślni. Nie miejcie o sobie wysokiego mniemania, ale się ku niskim skłaniajcie. Nie uważajcie samych siebie za mądrych."
  tags: []
"Rz12,17":
  text: "Nikomu złem za zło nie odpłacajcie; starajcie się o to, co uczciwe wobec wszystkich ludzi."
  tags: []
"Rz12,18":
  text: "Jeśli to możliwe, o ile to od was zależy, ze wszystkimi ludźmi żyjcie w pokoju."
  tags: []
"Rz12,19":
  text: "Najmilsi, nie mścijcie się sami, ale pozostawcie miejsce gniewowi. Jest bowiem napisane: Zemsta do mnie należy, ja odpłacę – mówi Pan."
  tags: []
"Rz12,20":
  text: "Jeśli więc twój nieprzyjaciel jest głodny, nakarm go, jeśli jest spragniony, napój go. Tak bowiem robiąc, rozżarzone węgle zgarniesz na jego głowę."
  tags: []
"Rz12,21":
  text: "Nie daj się zwyciężyć złu, ale zło dobrem zwyciężaj."
  tags: []
