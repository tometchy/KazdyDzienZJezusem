"Rz11,1":
  text: "Pytam więc: Czy Bóg odrzucił swój lud? Nie daj Boże! Ja bowiem też jestem Izraelitą, z potomstwa Abrahama, z pokolenia Beniamina."
  tags: []
"Rz11,2":
  text: "Bóg nie odrzucił swego ludu, który przedtem znał. Czyż nie wiecie, co Pismo mówi o Eliaszu? Jak się skarży przed Bogiem na Izraela:"
  tags: []
"Rz11,3":
  text: "Panie, pozabijali twoich proroków i zburzyli twoje ołtarze; tylko ja sam pozostałem i czyhają na moje życie."
  tags: []
"Rz11,4":
  text: "Ale cóż mu odpowiada Bóg? Zostawiłem sobie siedem tysięcy mężów, którzy nie zgięli kolan przed Baalem."
  tags: []
"Rz11,5":
  text: "Tak i w obecnym czasie pozostała resztka według wybrania przez łaskę."
  tags: []
"Rz11,6":
  text: "A jeśli przez łaskę, to już nie z uczynków, inaczej łaska już nie byłaby łaską. Jeśli zaś z uczynków, to już nie jest łaska, inaczej uczynek już nie byłby uczynkiem."
  tags: []
"Rz11,7":
  text: "Cóż więc? Czego Izrael szuka, tego nie osiągnął, ale wybrani osiągnęli, a inni zostali pogrążeni w zatwardziałości;"
  tags: []
"Rz11,8":
  text: "(Jak jest napisane: Bóg dał im ducha twardego snu, oczy, aby nie widzieli, i uszy, aby nie słyszeli) aż do dziś."
  tags: []
"Rz11,9":
  text: "A Dawid mówi: Niech ich stół stanie się sidłem i pułapką, zgorszeniem i odpłatą."
  tags: []
"Rz11,10":
  text: "Niech zaćmią się ich oczy, aby nie widzieli, a ich grzbiet zawsze pochylaj."
  tags: []
"Rz11,11":
  text: "Pytam więc: Czy się potknęli, aby upaść? Nie daj Boże! Ale raczej przez ich upadek zbawienie doszło do pogan, aby wzbudzić w nich zawiść."
  tags: []
"Rz11,12":
  text: "A jeśli ich upadek jest bogactwem świata, a ich pomniejszenie bogactwem pogan, o ileż bardziej ich pełnia?"
  tags: []
"Rz11,13":
  text: "Mówię bowiem do was, pogan. Na ile jestem apostołem pogan, chlubię się swoją służbą;"
  tags: []
"Rz11,14":
  text: "Może w ten sposób wzbudzę zawiść w tych, którzy są moim ciałem i zbawię niektórych z nich."
  tags: []
"Rz11,15":
  text: "Jeśli bowiem odrzucenie ich stało się pojednaniem dla świata, czym będzie przyjęcie ich, jeśli nie powstaniem z martwych do życia?"
  tags: []
"Rz11,16":
  text: "Ponieważ jeśli zaczyn jest święty, to i ciasto, a jeśli korzeń jest święty, to i gałęzie."
  tags: []
"Rz11,17":
  text: "Jeśli zaś niektóre z gałęzi zostały odłamane, a ty, który byłeś dzikim drzewem oliwnym, zostałeś wszczepiony zamiast nich i stałeś się uczestnikiem korzenia i tłustości drzewa oliwnego;"
  tags: []
"Rz11,18":
  text: "Nie wynoś się nad gałęzie. Jeśli jednak się wynosisz, wiedz, że nie ty podtrzymujesz korzeń, lecz korzeń ciebie."
  tags: []
"Rz11,19":
  text: "Ale powiesz: Odłamane zostały gałęzie, abym ja został wszczepiony."
  tags: []
"Rz11,20":
  text: "Słusznie, z powodu niewiary zostały odłamane, ty zaś trwasz przez wiarę. Nie pysznij się, ale się bój."
  tags: []
"Rz11,21":
  text: "Jeśli bowiem Bóg nie oszczędził naturalnych gałęzi, wiedz, że i ciebie nie oszczędzi."
  tags: []
"Rz11,22":
  text: "Spójrz więc na dobroć i srogość Boga: srogość dla tych, którzy upadli, a dla ciebie dobroć, jeśli będziesz trwał w tej dobroci. W przeciwnym razie ty też będziesz wycięty."
  tags: []
"Rz11,23":
  text: "Lecz i oni, jeśli nie będą trwali w niewierze, zostaną wszczepieni, gdyż Bóg ma moc ponownie ich wszczepić."
  tags: []
"Rz11,24":
  text: "Jeśli bowiem ty zostałeś wycięty z dzikiego z natury drzewa oliwnego, a wbrew naturze zostałeś wszczepiony w szlachetne drzewo oliwne, o ileż bardziej ci, którzy są gałęziami naturalnymi, wszczepieni zostaną w swoje własne drzewo oliwne!"
  tags: []
"Rz11,25":
  text: "Nie chcę bowiem, bracia, abyście nie znali tej tajemnicy – żebyście sami siebie nie uważali za mądrych – że zatwardziałość po części przyszła na Izrael, dopóki nie wejdzie pełnia pogan."
  tags: []
"Rz11,26":
  text: "I tak cały Izrael będzie zbawiony, jak jest napisane: Przyjdzie z Syjonu wybawiciel i odwróci bezbożność od Jakuba."
  tags: []
"Rz11,27":
  text: "A to będzie moje przymierze z nimi, gdy zgładzę ich grzechy."
  tags: []
"Rz11,28":
  text: "Tak więc co do ewangelii są nieprzyjaciółmi ze względu na was, lecz co do wybrania są umiłowani ze względu na ojców."
  tags: []
"Rz11,29":
  text: "Nieodwołalne są bowiem dary i powołanie Boże."
  tags: []
"Rz11,30":
  text: "Jak bowiem wy kiedyś nie wierzyliście Bogu, ale teraz dostąpiliście miłosierdzia z powodu ich niewiary;"
  tags: []
"Rz11,31":
  text: "Tak i oni teraz stali się nieposłuszni, aby z powodu miłosierdzia wam okazanego i oni miłosierdzia dostąpili."
  tags: []
"Rz11,32":
  text: "Bóg bowiem zamknął ich wszystkich w niewierze, aby się nad wszystkimi zmiłować."
  tags: []
"Rz11,33":
  text: "O głębokości bogactwa zarówno mądrości, jak i poznania Boga! Jak niezbadane są jego wyroki i niedocieczone jego drogi!"
  tags: []
"Rz11,34":
  text: "Któż bowiem poznał myśl Pana albo kto był jego doradcą?"
  tags: []
"Rz11,35":
  text: "Lub kto pierwszy mu coś dał, aby otrzymać odpłatę?"
  tags: []
"Rz11,36":
  text: "Z niego bowiem, przez niego i w nim jest wszystko. Jemu chwała na wieki. Amen."
  tags: []
