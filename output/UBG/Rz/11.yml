"Rz11,1": "Pytam więc: Czy Bóg odrzucił swój lud? Nie daj Boże! Ja bowiem też jestem Izraelitą, z potomstwa Abrahama, z pokolenia Beniamina."
"Rz11,2": "Bóg nie odrzucił swego ludu, który przedtem znał. Czyż nie wiecie, co Pismo mówi o Eliaszu? Jak się skarży przed Bogiem na Izraela:"
"Rz11,3": "Panie, pozabijali twoich proroków i zburzyli twoje ołtarze; tylko ja sam pozostałem i czyhają na moje życie."
"Rz11,4": "Ale cóż mu odpowiada Bóg? Zostawiłem sobie siedem tysięcy mężów, którzy nie zgięli kolan przed Baalem."
"Rz11,5": "Tak i w obecnym czasie pozostała resztka według wybrania przez łaskę."
"Rz11,6": "A jeśli przez łaskę, to już nie z uczynków, inaczej łaska już nie byłaby łaską. Jeśli zaś z uczynków, to już nie jest łaska, inaczej uczynek już nie byłby uczynkiem."
"Rz11,7": "Cóż więc? Czego Izrael szuka, tego nie osiągnął, ale wybrani osiągnęli, a inni zostali pogrążeni w zatwardziałości;"
"Rz11,8": "(Jak jest napisane: Bóg dał im ducha twardego snu, oczy, aby nie widzieli, i uszy, aby nie słyszeli) aż do dziś."
"Rz11,9": "A Dawid mówi: Niech ich stół stanie się sidłem i pułapką, zgorszeniem i odpłatą."
"Rz11,10": "Niech zaćmią się ich oczy, aby nie widzieli, a ich grzbiet zawsze pochylaj."
"Rz11,11": "Pytam więc: Czy się potknęli, aby upaść? Nie daj Boże! Ale raczej przez ich upadek zbawienie doszło do pogan, aby wzbudzić w nich zawiść."
"Rz11,12": "A jeśli ich upadek jest bogactwem świata, a ich pomniejszenie bogactwem pogan, o ileż bardziej ich pełnia?"
"Rz11,13": "Mówię bowiem do was, pogan. Na ile jestem apostołem pogan, chlubię się swoją służbą;"
"Rz11,14": "Może w ten sposób wzbudzę zawiść w tych, którzy są moim ciałem i zbawię niektórych z nich."
"Rz11,15": "Jeśli bowiem odrzucenie ich stało się pojednaniem dla świata, czym będzie przyjęcie ich, jeśli nie powstaniem z martwych do życia?"
"Rz11,16": "Ponieważ jeśli zaczyn jest święty, to i ciasto, a jeśli korzeń jest święty, to i gałęzie."
"Rz11,17": "Jeśli zaś niektóre z gałęzi zostały odłamane, a ty, który byłeś dzikim drzewem oliwnym, zostałeś wszczepiony zamiast nich i stałeś się uczestnikiem korzenia i tłustości drzewa oliwnego;"
"Rz11,18": "Nie wynoś się nad gałęzie. Jeśli jednak się wynosisz, wiedz, że nie ty podtrzymujesz korzeń, lecz korzeń ciebie."
"Rz11,19": "Ale powiesz: Odłamane zostały gałęzie, abym ja został wszczepiony."
"Rz11,20": "Słusznie, z powodu niewiary zostały odłamane, ty zaś trwasz przez wiarę. Nie pysznij się, ale się bój."
"Rz11,21": "Jeśli bowiem Bóg nie oszczędził naturalnych gałęzi, wiedz, że i ciebie nie oszczędzi."
"Rz11,22": "Spójrz więc na dobroć i srogość Boga: srogość dla tych, którzy upadli, a dla ciebie dobroć, jeśli będziesz trwał w tej dobroci. W przeciwnym razie ty też będziesz wycięty."
"Rz11,23": "Lecz i oni, jeśli nie będą trwali w niewierze, zostaną wszczepieni, gdyż Bóg ma moc ponownie ich wszczepić."
"Rz11,24": "Jeśli bowiem ty zostałeś wycięty z dzikiego z natury drzewa oliwnego, a wbrew naturze zostałeś wszczepiony w szlachetne drzewo oliwne, o ileż bardziej ci, którzy są gałęziami naturalnymi, wszczepieni zostaną w swoje własne drzewo oliwne!"
"Rz11,25": "Nie chcę bowiem, bracia, abyście nie znali tej tajemnicy – żebyście sami siebie nie uważali za mądrych – że zatwardziałość po części przyszła na Izrael, dopóki nie wejdzie pełnia pogan."
"Rz11,26": "I tak cały Izrael będzie zbawiony, jak jest napisane: Przyjdzie z Syjonu wybawiciel i odwróci bezbożność od Jakuba."
"Rz11,27": "A to będzie moje przymierze z nimi, gdy zgładzę ich grzechy."
"Rz11,28": "Tak więc co do ewangelii są nieprzyjaciółmi ze względu na was, lecz co do wybrania są umiłowani ze względu na ojców."
"Rz11,29": "Nieodwołalne są bowiem dary i powołanie Boże."
"Rz11,30": "Jak bowiem wy kiedyś nie wierzyliście Bogu, ale teraz dostąpiliście miłosierdzia z powodu ich niewiary;"
"Rz11,31": "Tak i oni teraz stali się nieposłuszni, aby z powodu miłosierdzia wam okazanego i oni miłosierdzia dostąpili."
"Rz11,32": "Bóg bowiem zamknął ich wszystkich w niewierze, aby się nad wszystkimi zmiłować."
"Rz11,33": "O głębokości bogactwa zarówno mądrości, jak i poznania Boga! Jak niezbadane są jego wyroki i niedocieczone jego drogi!"
"Rz11,34": "Któż bowiem poznał myśl Pana albo kto był jego doradcą?"
"Rz11,35": "Lub kto pierwszy mu coś dał, aby otrzymać odpłatę?"
"Rz11,36": "Z niego bowiem, przez niego i w nim jest wszystko. Jemu chwała na wieki. Amen."
