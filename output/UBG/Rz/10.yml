"Rz10,1":
  text: "Bracia, pragnieniem mego serca i modlitwą, którą zanoszę do Boga za Izrael, jest jego zbawienie."
  tags: []
"Rz10,2":
  text: "Daję im bowiem świadectwo, że mają gorliwość dla Boga, ale nie według poznania."
  tags: []
"Rz10,3":
  text: "Nie znając bowiem sprawiedliwości Boga, a chcąc ustanowić własną sprawiedliwość, nie poddali się sprawiedliwości Boga."
  tags: []
"Rz10,4":
  text: "Końcem bowiem prawa jest Chrystus ku sprawiedliwości każdego, kto wierzy."
  tags: []
"Rz10,5":
  text: "Gdyż Mojżesz pisze o sprawiedliwości, która jest z prawa: Kto te rzeczy wypełnia, przez nie będzie żył."
  tags: []
"Rz10,6":
  text: "Sprawiedliwość zaś, która jest z wiary, tak powiada: Nie mów w swym sercu: Kto wstąpi do nieba? – to znaczy, aby Chrystusa na dół sprowadzić;"
  tags: []
"Rz10,7":
  text: "Albo: Kto zstąpi do otchłani? – to znaczy, aby Chrystusa od umarłych wyprowadzić."
  tags: []
"Rz10,8":
  text: "Ale cóż mówi: Blisko ciebie jest słowo, na twoich ustach i w twoim sercu. To jest słowo wiary, które głosimy:"
  tags: []
"Rz10,9":
  text: "Jeśli ustami wyznasz Pana Jezusa i uwierzysz w swoim sercu, że Bóg wskrzesił go z martwych, będziesz zbawiony."
  tags: []
"Rz10,10":
  text: "Sercem bowiem wierzy się ku sprawiedliwości, a ustami wyznaje się ku zbawieniu."
  tags: []
"Rz10,11":
  text: "Mówi bowiem Pismo: Każdy, kto w niego wierzy, nie będzie zawstydzony."
  tags: []
"Rz10,12":
  text: "Gdyż nie ma różnicy między Żydem a Grekiem; bo ten sam Pan wszystkich jest bogaty względem wszystkich, którzy go wzywają."
  tags: []
"Rz10,13":
  text: "Każdy bowiem, kto wezwie imienia Pana, będzie zbawiony."
  tags: []
"Rz10,14":
  text: "Jakże więc będą wzywać tego, w którego nie uwierzyli? A jak uwierzą w tego, o którym nie słyszeli? A jak usłyszą bez kaznodziei?"
  tags: []
"Rz10,15":
  text: "Jakże też będą głosić, jeśli nie zostaną posłani? Jak jest napisane: O jak piękne są nogi tych, którzy zwiastują ewangelię pokoju, tych, którzy opowiadają dobre rzeczy!"
  tags: []
"Rz10,16":
  text: "Ale nie wszyscy byli posłuszni ewangelii. Izajasz bowiem mówi: Panie, któż uwierzył naszemu głoszeniu?"
  tags: []
"Rz10,17":
  text: "Wiara więc jest ze słuchania, a słuchanie – przez słowo Boże."
  tags: []
"Rz10,18":
  text: "Pytam jednak: Czy nie słyszeli? Ależ tak: Po całej ziemi rozszedł się ich głos i na krańce świata ich słowa."
  tags: []
"Rz10,19":
  text: "Pytam jednak: Czy Izrael tego nie poznał? Mojżesz pierwszy mówi: Ja pobudzę was do zawiści przez naród, który nie jest narodem, przez naród nierozumny wzbudzę w was gniew."
  tags: []
"Rz10,20":
  text: "A Izajasz śmiało mówi: Zostałem znaleziony przez tych, którzy mnie nie szukali, objawiłem się tym, którzy o mnie nie pytali."
  tags: []
"Rz10,21":
  text: "Lecz do Izraela mówi: Cały dzień wyciągałem moje ręce do ludu opornego i sprzeciwiającego się."
  tags: []
