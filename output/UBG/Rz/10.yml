"Rz10,1": "Bracia, pragnieniem mego serca i modlitwą, którą zanoszę do Boga za Izrael, jest jego zbawienie."
"Rz10,2": "Daję im bowiem świadectwo, że mają gorliwość dla Boga, ale nie według poznania."
"Rz10,3": "Nie znając bowiem sprawiedliwości Boga, a chcąc ustanowić własną sprawiedliwość, nie poddali się sprawiedliwości Boga."
"Rz10,4": "Końcem bowiem prawa jest Chrystus ku sprawiedliwości każdego, kto wierzy."
"Rz10,5": "Gdyż Mojżesz pisze o sprawiedliwości, która jest z prawa: Kto te rzeczy wypełnia, przez nie będzie żył."
"Rz10,6": "Sprawiedliwość zaś, która jest z wiary, tak powiada: Nie mów w swym sercu: Kto wstąpi do nieba? – to znaczy, aby Chrystusa na dół sprowadzić;"
"Rz10,7": "Albo: Kto zstąpi do otchłani? – to znaczy, aby Chrystusa od umarłych wyprowadzić."
"Rz10,8": "Ale cóż mówi: Blisko ciebie jest słowo, na twoich ustach i w twoim sercu. To jest słowo wiary, które głosimy:"
"Rz10,9": "Jeśli ustami wyznasz Pana Jezusa i uwierzysz w swoim sercu, że Bóg wskrzesił go z martwych, będziesz zbawiony."
"Rz10,10": "Sercem bowiem wierzy się ku sprawiedliwości, a ustami wyznaje się ku zbawieniu."
"Rz10,11": "Mówi bowiem Pismo: Każdy, kto w niego wierzy, nie będzie zawstydzony."
"Rz10,12": "Gdyż nie ma różnicy między Żydem a Grekiem; bo ten sam Pan wszystkich jest bogaty względem wszystkich, którzy go wzywają."
"Rz10,13": "Każdy bowiem, kto wezwie imienia Pana, będzie zbawiony."
"Rz10,14": "Jakże więc będą wzywać tego, w którego nie uwierzyli? A jak uwierzą w tego, o którym nie słyszeli? A jak usłyszą bez kaznodziei?"
"Rz10,15": "Jakże też będą głosić, jeśli nie zostaną posłani? Jak jest napisane: O jak piękne są nogi tych, którzy zwiastują ewangelię pokoju, tych, którzy opowiadają dobre rzeczy!"
"Rz10,16": "Ale nie wszyscy byli posłuszni ewangelii. Izajasz bowiem mówi: Panie, któż uwierzył naszemu głoszeniu?"
"Rz10,17": "Wiara więc jest ze słuchania, a słuchanie – przez słowo Boże."
"Rz10,18": "Pytam jednak: Czy nie słyszeli? Ależ tak: Po całej ziemi rozszedł się ich głos i na krańce świata ich słowa."
"Rz10,19": "Pytam jednak: Czy Izrael tego nie poznał? Mojżesz pierwszy mówi: Ja pobudzę was do zawiści przez naród, który nie jest narodem, przez naród nierozumny wzbudzę w was gniew."
"Rz10,20": "A Izajasz śmiało mówi: Zostałem znaleziony przez tych, którzy mnie nie szukali, objawiłem się tym, którzy o mnie nie pytali."
"Rz10,21": "Lecz do Izraela mówi: Cały dzień wyciągałem moje ręce do ludu opornego i sprzeciwiającego się."
