"Rz9,1":
  text: "Mówię prawdę w Chrystusie, nie kłamię, co mi poświadcza moje sumienie w Duchu Świętym;"
  tags: []
"Rz9,2":
  text: "Że odczuwam wielki smutek i nieustający ból w moim sercu."
  tags: []
"Rz9,3":
  text: "Pragnąłbym bowiem sam być odłączony od Chrystusa za moich braci, za moich krewnych według ciała."
  tags: []
"Rz9,4":
  text: "Są to Izraelici, do których należy usynowienie, chwała, przymierza, nadanie prawa, służba Boża i obietnice;"
  tags: []
"Rz9,5":
  text: "Do których należą ojcowie i z których według ciała pochodzi Chrystus, który jest nad wszystkimi, Bóg błogosławiony na wieki. Amen."
  tags: []
"Rz9,6":
  text: "Lecz nie jest możliwe, żeby miało zawieść słowo Boże. Nie wszyscy bowiem, którzy pochodzą od Izraela, są Izraelem."
  tags: []
"Rz9,7":
  text: "Nie wszyscy też przez to, że są potomstwem Abrahama, są dziećmi, ale jest powiedziane: W Izaaku będzie nazwane twoje potomstwo."
  tags: []
"Rz9,8":
  text: "To znaczy, że nie dzieci ciała są dziećmi Bożymi, lecz dzieci obietnicy są uznane za potomstwo."
  tags: []
"Rz9,9":
  text: "Takie bowiem jest słowo obietnicy: O tym właśnie czasie przyjdę, a Sara będzie miała syna."
  tags: []
"Rz9,10":
  text: "A nie tylko to, ale i Rebeka, gdy poczęła z jednego mężczyzny, naszego ojca Izaaka;"
  tags: []
"Rz9,11":
  text: "Gdy dzieci jeszcze się nie urodziły i nie zrobiły nic dobrego ani złego, aby zgodnie z wybraniem trwało postanowienie Boga, nie z uczynków, ale z tego, który powołuje;"
  tags: []
"Rz9,12":
  text: "Powiedziano jej, że starszy będzie służył młodszemu;"
  tags: []
"Rz9,13":
  text: "Jak jest napisane: Jakuba umiłowałem, ale Ezawa znienawidziłem."
  tags: []
"Rz9,14":
  text: "Cóż więc powiemy? Czy Bóg jest niesprawiedliwy? Nie daj Boże!"
  tags: []
"Rz9,15":
  text: "Mówi bowiem do Mojżesza: Zmiłuję się, nad kim się zmiłuję, a zlituję się, nad kim się zlituję."
  tags: []
"Rz9,16":
  text: "A więc nie zależy to od tego, który chce, ani od tego, który zabiega, ale od Boga, który okazuje miłosierdzie."
  tags: []
"Rz9,17":
  text: "Pismo bowiem mówi do faraona: Po to właśnie cię wzbudziłem, aby okazać na tobie swoją moc i żeby moje imię było głoszone po całej ziemi."
  tags: []
"Rz9,18":
  text: "A zatem komu chce, okazuje miłosierdzie, a kogo chce, czyni zatwardziałym."
  tags: []
"Rz9,19":
  text: "Ale mi powiesz: Dlaczego więc jeszcze oskarża? Któż bowiem sprzeciwił się jego woli?"
  tags: []
"Rz9,20":
  text: "Człowieku! Kimże ty jesteś, że prowadzisz spór z Bogiem? Czy naczynie gliniane może powiedzieć do tego, kto je ulepił: Dlaczego mnie takim uczyniłeś?"
  tags: []
"Rz9,21":
  text: "Czy garncarz nie ma władzy nad gliną, żeby z tej samej bryły zrobić jedno naczynie do użytku zaszczytnego, a drugie do niezaszczytnego?"
  tags: []
"Rz9,22":
  text: "A cóż, jeśli Bóg, chcąc okazać gniew i dać poznać swoją moc, znosił w wielkiej cierpliwości naczynia gniewu przygotowane na zniszczenie;"
  tags: []
"Rz9,23":
  text: "I żeby dać poznać bogactwo swojej chwały na naczyniach miłosierdzia, które wcześniej przygotował ku chwale;"
  tags: []
"Rz9,24":
  text: "To znaczy nas, których powołał, nie tylko z Żydów, ale i z pogan?"
  tags: []
"Rz9,25":
  text: "Jak też u Ozeasza mówi: Lud, który nie był mój, nazwę moim ludem, a tę, która nie była umiłowana, nazwę umiłowaną."
  tags: []
"Rz9,26":
  text: "I stanie się tak, że w miejscu, gdzie im mówiono: Wy nie jesteście moim ludem, tam będą nazwani synami Boga żywego."
  tags: []
"Rz9,27":
  text: "A Izajasz woła o Izraelu: Choćby liczba synów Izraela była jak piasek morski, resztka będzie ocalona."
  tags: []
"Rz9,28":
  text: "Zakończy bowiem dzieło i skróci je w sprawiedliwości. Istotnie, skróci Pan dzieło na ziemi."
  tags: []
"Rz9,29":
  text: "Jak i przedtem powiedział Izajasz: Gdyby Pan zastępów nie zostawił nam potomstwa, stalibyśmy się jak Sodoma i bylibyśmy podobni do Gomory."
  tags: []
"Rz9,30":
  text: "Cóż więc powiemy? To, że poganie, którzy nie szukali sprawiedliwości, dostąpili sprawiedliwości – sprawiedliwości, która jest z wiary."
  tags: []
"Rz9,31":
  text: "Izrael zaś, zabiegając o prawo sprawiedliwości, nie doszedł do prawa sprawiedliwości."
  tags: []
"Rz9,32":
  text: "Dlaczego? Ponieważ o nie zabiegali nie z wiary, ale jakby było z uczynków prawa. Potknęli się bowiem o kamień potknięcia;"
  tags: []
"Rz9,33":
  text: "Jak jest napisane: Oto kładę na Syjonie kamień potknięcia i skałę zgorszenia, a każdy, kto w niego wierzy, nie będzie zawstydzony."
  tags: []
