"Rz9,1": "Mówię prawdę w Chrystusie, nie kłamię, co mi poświadcza moje sumienie w Duchu Świętym;"
"Rz9,2": "Że odczuwam wielki smutek i nieustający ból w moim sercu."
"Rz9,3": "Pragnąłbym bowiem sam być odłączony od Chrystusa za moich braci, za moich krewnych według ciała."
"Rz9,4": "Są to Izraelici, do których należy usynowienie, chwała, przymierza, nadanie prawa, służba Boża i obietnice;"
"Rz9,5": "Do których należą ojcowie i z których według ciała pochodzi Chrystus, który jest nad wszystkimi, Bóg błogosławiony na wieki. Amen."
"Rz9,6": "Lecz nie jest możliwe, żeby miało zawieść słowo Boże. Nie wszyscy bowiem, którzy pochodzą od Izraela, są Izraelem."
"Rz9,7": "Nie wszyscy też przez to, że są potomstwem Abrahama, są dziećmi, ale jest powiedziane: W Izaaku będzie nazwane twoje potomstwo."
"Rz9,8": "To znaczy, że nie dzieci ciała są dziećmi Bożymi, lecz dzieci obietnicy są uznane za potomstwo."
"Rz9,9": "Takie bowiem jest słowo obietnicy: O tym właśnie czasie przyjdę, a Sara będzie miała syna."
"Rz9,10": "A nie tylko to, ale i Rebeka, gdy poczęła z jednego mężczyzny, naszego ojca Izaaka;"
"Rz9,11": "Gdy dzieci jeszcze się nie urodziły i nie zrobiły nic dobrego ani złego, aby zgodnie z wybraniem trwało postanowienie Boga, nie z uczynków, ale z tego, który powołuje;"
"Rz9,12": "Powiedziano jej, że starszy będzie służył młodszemu;"
"Rz9,13": "Jak jest napisane: Jakuba umiłowałem, ale Ezawa znienawidziłem."
"Rz9,14": "Cóż więc powiemy? Czy Bóg jest niesprawiedliwy? Nie daj Boże!"
"Rz9,15": "Mówi bowiem do Mojżesza: Zmiłuję się, nad kim się zmiłuję, a zlituję się, nad kim się zlituję."
"Rz9,16": "A więc nie zależy to od tego, który chce, ani od tego, który zabiega, ale od Boga, który okazuje miłosierdzie."
"Rz9,17": "Pismo bowiem mówi do faraona: Po to właśnie cię wzbudziłem, aby okazać na tobie swoją moc i żeby moje imię było głoszone po całej ziemi."
"Rz9,18": "A zatem komu chce, okazuje miłosierdzie, a kogo chce, czyni zatwardziałym."
"Rz9,19": "Ale mi powiesz: Dlaczego więc jeszcze oskarża? Któż bowiem sprzeciwił się jego woli?"
"Rz9,20": "Człowieku! Kimże ty jesteś, że prowadzisz spór z Bogiem? Czy naczynie gliniane może powiedzieć do tego, kto je ulepił: Dlaczego mnie takim uczyniłeś?"
"Rz9,21": "Czy garncarz nie ma władzy nad gliną, żeby z tej samej bryły zrobić jedno naczynie do użytku zaszczytnego, a drugie do niezaszczytnego?"
"Rz9,22": "A cóż, jeśli Bóg, chcąc okazać gniew i dać poznać swoją moc, znosił w wielkiej cierpliwości naczynia gniewu przygotowane na zniszczenie;"
"Rz9,23": "I żeby dać poznać bogactwo swojej chwały na naczyniach miłosierdzia, które wcześniej przygotował ku chwale;"
"Rz9,24": "To znaczy nas, których powołał, nie tylko z Żydów, ale i z pogan?"
"Rz9,25": "Jak też u Ozeasza mówi: Lud, który nie był mój, nazwę moim ludem, a tę, która nie była umiłowana, nazwę umiłowaną."
"Rz9,26": "I stanie się tak, że w miejscu, gdzie im mówiono: Wy nie jesteście moim ludem, tam będą nazwani synami Boga żywego."
"Rz9,27": "A Izajasz woła o Izraelu: Choćby liczba synów Izraela była jak piasek morski, resztka będzie ocalona."
"Rz9,28": "Zakończy bowiem dzieło i skróci je w sprawiedliwości. Istotnie, skróci Pan dzieło na ziemi."
"Rz9,29": "Jak i przedtem powiedział Izajasz: Gdyby Pan zastępów nie zostawił nam potomstwa, stalibyśmy się jak Sodoma i bylibyśmy podobni do Gomory."
"Rz9,30": "Cóż więc powiemy? To, że poganie, którzy nie szukali sprawiedliwości, dostąpili sprawiedliwości – sprawiedliwości, która jest z wiary."
"Rz9,31": "Izrael zaś, zabiegając o prawo sprawiedliwości, nie doszedł do prawa sprawiedliwości."
"Rz9,32": "Dlaczego? Ponieważ o nie zabiegali nie z wiary, ale jakby było z uczynków prawa. Potknęli się bowiem o kamień potknięcia;"
"Rz9,33": "Jak jest napisane: Oto kładę na Syjonie kamień potknięcia i skałę zgorszenia, a każdy, kto w niego wierzy, nie będzie zawstydzony."
