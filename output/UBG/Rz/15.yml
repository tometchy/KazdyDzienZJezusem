"Rz15,1":
  text: "A tak my, którzy jesteśmy mocni, powinniśmy znosić słabości słabych, a nie szukać tego, co nam się podoba."
  tags: []
"Rz15,2":
  text: "Dlatego każdy z nas niech szuka tego, co podoba się bliźniemu, dla dobra, ku zbudowaniu."
  tags: []
"Rz15,3":
  text: "Ponieważ i Chrystus nie szukał tego, co mu się podobało, ale jak jest napisane: Urągania urągających tobie spadły na mnie."
  tags: []
"Rz15,4":
  text: "Wszystko bowiem, co przedtem napisano, ku naszej nauce napisano, abyśmy przez cierpliwość i pociechę z Pism mieli nadzieję."
  tags: []
"Rz15,5":
  text: "A Bóg cierpliwości i pociechy niech sprawi, abyście byli jednomyślni między sobą na wzór Jezusa Chrystusa;"
  tags: []
"Rz15,6":
  text: "Abyście jednomyślnie, jednymi ustami wysławiali Boga, Ojca naszego Pana Jezusa Chrystusa."
  tags: []
"Rz15,7":
  text: "Dlatego przyjmujcie siebie nawzajem, jak i Chrystus przyjął nas do chwały Boga."
  tags: []
"Rz15,8":
  text: "Mówię bowiem, że Jezus Chrystus był sługą obrzezania ze względu na prawdę Bożą, aby potwierdzić obietnice dane ojcom;"
  tags: []
"Rz15,9":
  text: "I aby poganie chwalili Boga za miłosierdzie, jak jest napisane: Dlatego będę cię wysławiał między poganami i będę śpiewał twemu imieniu."
  tags: []
"Rz15,10":
  text: "I znowu mówi: Weselcie się, poganie, z jego ludem."
  tags: []
"Rz15,11":
  text: "I znowu: Chwalcie Pana, wszyscy poganie, i wysławiajcie go wszyscy ludzie."
  tags: []
"Rz15,12":
  text: "I znowu Izajasz mówi: Przyjdzie korzeń Jessego, ten, który powstanie, aby panować nad poganami. W nim poganie będą pokładać nadzieję."
  tags: []
"Rz15,13":
  text: "A Bóg nadziei niech was napełni wszelką radością i pokojem w wierze, abyście obfitowali w nadzieję przez moc Ducha Świętego."
  tags: []
"Rz15,14":
  text: "A też ja sam jestem pewien co do was, moi bracia, że i wy sami jesteście pełni dobroci, napełnieni wszelkim poznaniem i możecie jedni drugich napominać."
  tags: []
"Rz15,15":
  text: "A pisałem do was, bracia, nieco śmielej, jakby przypominając wam przez łaskę, która jest mi dana od Boga;"
  tags: []
"Rz15,16":
  text: "Po to, abym był sługą Jezusa Chrystusa dla pogan, sprawując święte usługiwanie ewangelią Boga, aby ofiara pogan stała się przyjemna, uświęcona przez Ducha Świętego."
  tags: []
"Rz15,17":
  text: "Mam się więc czym chlubić w Jezusie Chrystusie, w sprawach Bożych."
  tags: []
"Rz15,18":
  text: "Nie śmiałbym bowiem mówić tego, czego Chrystus nie uczyniłby przeze mnie w przywodzeniu pogan do posłuszeństwa przez słowo i uczynek;"
  tags: []
"Rz15,19":
  text: "Przez moc znaków i cudów, przez moc Ducha Bożego, tak że obszar od Jerozolimy i okolic aż do Ilirii napełniłem ewangelią Chrystusa."
  tags: []
"Rz15,20":
  text: "A usiłowałem głosić ewangelię tam, gdzie imię Chrystusa nie było znane, aby nie budować na cudzym fundamencie;"
  tags: []
"Rz15,21":
  text: "Ale jak jest napisane: Ci, którym o nim nie mówiono, zobaczą, a ci, którzy o nim nie słyszeli, zrozumieją."
  tags: []
"Rz15,22":
  text: "Dlatego też często napotykałem przeszkody, tak że nie mogłem przyjść do was."
  tags: []
"Rz15,23":
  text: "Lecz teraz nie mam już miejsca do pracy w tych stronach, a pragnąc od wielu lat przyjść do was;"
  tags: []
"Rz15,24":
  text: "Gdy udam się do Hiszpanii, przyjdę do was. Spodziewam się bowiem, że idąc tamtędy, zobaczę was i że wy mnie tam wyprawicie, gdy się już wami troszeczkę nacieszę."
  tags: []
"Rz15,25":
  text: "A teraz idę do Jerozolimy, aby usłużyć świętym."
  tags: []
"Rz15,26":
  text: "Spodobało się bowiem Macedonii i Achai wspólnie złożyć się na ubogich świętych, którzy są w Jerozolimie."
  tags: []
"Rz15,27":
  text: "Istotnie, spodobało się im, są też ich dłużnikami. Jeśli bowiem poganie stali się uczestnikami ich dóbr duchowych, powinni im też usługiwać cielesnymi."
  tags: []
"Rz15,28":
  text: "Dlatego, gdy to wykonam i oddam im ten zapieczętowany owoc, wstąpię do was, udając się do Hiszpanii."
  tags: []
"Rz15,29":
  text: "A wiem, że gdy przyjdę do was, przyjdę z pełnią błogosławieństwa ewangelii Chrystusa."
  tags: []
"Rz15,30":
  text: "A proszę was, bracia, przez naszego Pana Jezusa Chrystusa i przez miłość Ducha, abyście razem ze mną walczyli w modlitwach za mnie do Boga;"
  tags: []
"Rz15,31":
  text: "Abym został wybawiony od tych, którzy są niewierzący w Judei, i żeby moja posługa, którą wykonuję dla Jerozolimy, została dobrze przyjęta przez świętych;"
  tags: []
"Rz15,32":
  text: "Abym z radością przyszedł do was za wolą Boga i doznał pokrzepienia razem z wami."
  tags: []
"Rz15,33":
  text: "A Bóg pokoju niech będzie z wami wszystkimi. Amen."
  tags: []
