"Rz7,1": "Czyż nie wiecie, bracia (bo mówię do znających prawo), że prawo panuje nad człowiekiem, dopóki on żyje?"
"Rz7,2": "Zamężna kobieta bowiem, dopóki mąż żyje, jest z nim związana prawem, a jeśli mąż umrze, zostaje uwolniona od prawa męża."
"Rz7,3": "Tak więc, dopóki mąż żyje, będzie nazywana cudzołożnicą, jeśli zostanie żoną innego mężczyzny. Jeśli jednak jej mąż umrze, jest wolna od tego prawa, tak że nie będzie cudzołożnicą, choćby została żoną innego mężczyzny."
"Rz7,4": "Tak i wy, moi bracia, zostaliście uśmierceni dla prawa przez ciało Chrystusa, abyście należeli do innego, to znaczy tego, który został wskrzeszony z martwych, abyśmy przynosili Bogu owoc."
"Rz7,5": "Gdy bowiem byliśmy w ciele, namiętności grzechów, które się wzniecały przez prawo, okazywały swą moc w naszych członkach, aby przynosić śmierci owoc."
"Rz7,6": "Lecz teraz zostaliśmy uwolnieni od prawa, gdy umarliśmy dla tego, w czym byliśmy trzymani, abyśmy służyli Bogu w nowości ducha, a nie w starości litery."
"Rz7,7": "Cóż więc powiemy? Że prawo jest grzechem? Nie daj Boże! Przeciwnie, nie poznałem grzechu jak tylko przez prawo, bo i o pożądliwości nie wiedziałbym, gdyby prawo nie mówiło: Nie będziesz pożądał."
"Rz7,8": "Lecz grzech, gdy zyskał okazję przez przykazanie, wzbudził we mnie wszelką pożądliwość. Bez prawa bowiem grzech jest martwy."
"Rz7,9": "I ja żyłem kiedyś bez prawa, lecz gdy przyszło przykazanie, grzech ożył, a ja umarłem."
"Rz7,10": "I okazało się, że przykazanie, które miało być ku życiu, jest mi ku śmierci."
"Rz7,11": "Grzech bowiem, gdy zyskał okazję przez przykazanie, zwiódł mnie i przez nie mnie zabił."
"Rz7,12": "A tak prawo jest święte i przykazanie jest święte, sprawiedliwe i dobre."
"Rz7,13": "Czy więc to, co dobre, stało się dla mnie śmiercią? Nie daj Boże! Przeciwnie, grzech, aby okazał się grzechem, sprowadził na mnie śmierć przez to, co dobre, żeby grzech stał się niezmiernie grzesznym przez przykazanie."
"Rz7,14": "Gdyż wiemy, że prawo jest duchowe, ale ja jestem cielesny, zaprzedany grzechowi."
"Rz7,15": "Tego bowiem, co robię, nie pochwalam, bo nie robię tego, co chcę, ale czego nienawidzę, to robię."
"Rz7,16": "A jeśli robię to, czego nie chcę, zgadzam się z tym, że prawo jest dobre."
"Rz7,17": "Teraz więc już nie ja to robię, ale grzech, który we mnie mieszka."
"Rz7,18": "Gdyż wiem, że we mnie, to jest w moim ciele, nie mieszka dobro, bo chęć jest we mnie, ale wykonać tego, co jest dobre, nie potrafię."
"Rz7,19": "Nie czynię bowiem dobra, które chcę, ale zło, którego nie chcę, to czynię."
"Rz7,20": "A jeśli robię to, czego nie chcę, już nie ja to robię, ale grzech, który we mnie mieszka."
"Rz7,21": "Odkrywam więc w sobie to prawo, że gdy chcę czynić dobro, trzyma się mnie zło."
"Rz7,22": "Mam bowiem upodobanie w prawie Bożym według wewnętrznego człowieka."
"Rz7,23": "Lecz widzę inne prawo w moich członkach, walczące z prawem mego umysłu, które bierze mnie w niewolę prawa grzechu, które jest w moich członkach."
"Rz7,24": "Nędzny ja człowiek! Któż mnie wybawi z tego ciała śmierci?"
"Rz7,25": "Dziękuję Bogu przez Jezusa Chrystusa, naszego Pana. Tak więc ja sam umysłem służę prawu Bożemu, lecz ciałem prawu grzechu."
