"Rz8,1":
  text: "Dlatego teraz żadnego potępienia nie ma dla tych, którzy są w Jezusie Chrystusie, którzy nie postępują według ciała, ale według Ducha."
  tags: []
"Rz8,2":
  text: "Gdyż prawo Ducha życia, które jest w Jezusie Chrystusie, uwolniło mnie od prawa grzechu i śmierci."
  tags: []
"Rz8,3":
  text: "Co bowiem było niemożliwe dla prawa, w czym było ono słabe z powodu ciała, Bóg, posławszy swego Syna w podobieństwie grzesznego ciała i z powodu grzechu, potępił grzech w ciele;"
  tags: []
"Rz8,4":
  text: "Aby sprawiedliwość prawa wypełniła się w nas, którzy postępujemy nie według ciała, ale według Ducha."
  tags: []
"Rz8,5":
  text: "Ci bowiem, którzy żyją według ciała, myślą o tym, co cielesne, ale ci, którzy żyją według Ducha, myślą o tym, co duchowe."
  tags: []
"Rz8,6":
  text: "Gdyż zamysł ciała to śmierć, ale zamysł Ducha to życie i pokój;"
  tags: []
"Rz8,7":
  text: "Dlatego, że zamysł ciała jest nieprzyjacielem Boga, bo nie poddaje się prawu Bożemu, gdyż i nie może."
  tags: []
"Rz8,8":
  text: "Ci więc, którzy są w ciele, nie mogą podobać się Bogu."
  tags: []
"Rz8,9":
  text: "Lecz wy nie jesteście w ciele, ale w Duchu, gdyż Duch Boży mieszka w was. A jeśli ktoś nie ma Ducha Chrystusa, ten do niego nie należy."
  tags: []
"Rz8,10":
  text: "Ale jeśli Chrystus jest w was, to ciało jest martwe z powodu grzechu, a duch jest żywy z powodu sprawiedliwości."
  tags: []
"Rz8,11":
  text: "A jeśli Duch tego, który Jezusa wskrzesił z martwych, mieszka w was, ten, który wskrzesił Chrystusa z martwych, ożywi i wasze śmiertelne ciała przez swego Ducha, który w was mieszka."
  tags: []
"Rz8,12":
  text: "Tak więc, bracia, jesteśmy dłużnikami, ale nie ciała, abyśmy mieli żyć według ciała."
  tags: []
"Rz8,13":
  text: "Jeśli bowiem żyjecie według ciała, umrzecie, ale jeśli Duchem uśmiercacie uczynki ciała, będziecie żyć."
  tags: []
"Rz8,14":
  text: "Wszyscy bowiem ci, którzy są prowadzeni przez Ducha Bożego, są synami Bożymi."
  tags: []
"Rz8,15":
  text: "Gdyż nie otrzymaliście ducha niewoli, aby znowu się bać, ale otrzymaliście Ducha usynowienia, przez którego wołamy: Abba, Ojcze!"
  tags: []
"Rz8,16":
  text: "Ten to Duch poświadcza naszemu duchowi, że jesteśmy dziećmi Bożymi."
  tags: []
"Rz8,17":
  text: "A jeśli dziećmi, to i dziedzicami, dziedzicami Boga, a współdziedzicami Chrystusa, jeśli tylko z nim cierpimy, abyśmy też z nim byli uwielbieni."
  tags: []
"Rz8,18":
  text: "Uważam bowiem, że cierpienia teraźniejszego czasu nie są godne porównywania z tą przyszłą chwałą, która ma się w nas objawić."
  tags: []
"Rz8,19":
  text: "Stworzenie bowiem z gorliwym wypatrywaniem oczekuje objawienia synów Bożych."
  tags: []
"Rz8,20":
  text: "Gdyż stworzenie jest poddane marności, nie dobrowolnie, ale z powodu tego, który je poddał, w nadziei;"
  tags: []
"Rz8,21":
  text: "Że i samo stworzenie będzie uwolnione z niewoli zniszczenia do chwalebnej wolności dzieci Bożych."
  tags: []
"Rz8,22":
  text: "Wiemy bowiem, że całe stworzenie razem jęczy i razem cierpi w bólach rodzenia aż dotąd."
  tags: []
"Rz8,23":
  text: "A nie tylko ono, ale i my, którzy mamy pierwsze plony Ducha, i my sami w sobie wzdychamy, oczekując usynowienia, odkupienia naszego ciała."
  tags: []
"Rz8,24":
  text: "Nadzieją bowiem jesteśmy zbawieni. A nadzieja, którą się widzi, nie jest nadzieją, bo jakże ktoś może spodziewać się tego, co widzi?"
  tags: []
"Rz8,25":
  text: "Ale jeśli spodziewamy się tego, czego nie widzimy, to oczekujemy tego z cierpliwością."
  tags: []
"Rz8,26":
  text: "Podobnie i Duch dopomaga naszej słabości. Nie wiemy bowiem, o co powinniśmy się modlić, jak trzeba, ale sam Duch wstawia się za nami w niewysłowionych westchnieniach."
  tags: []
"Rz8,27":
  text: "A ten, który bada serca, wie, jaki jest zamysł Ducha, ponieważ według woli Boga wstawia się za świętymi."
  tags: []
"Rz8,28":
  text: "A wiemy, że wszystko współdziała dla dobra tych, którzy miłują Boga, to jest tych, którzy są powołani według postanowienia Boga."
  tags: []
"Rz8,29":
  text: "Tych bowiem, których on przedtem znał, tych też przeznaczył, aby stali się podobni do obrazu jego Syna, żeby on był pierworodny między wieloma braćmi."
  tags: []
"Rz8,30":
  text: "Tych zaś, których przeznaczył, tych też powołał, a których powołał, tych też usprawiedliwił, a których usprawiedliwił, tych też uwielbił."
  tags: []
"Rz8,31":
  text: "Cóż więc na to powiemy? Jeśli Bóg za nami, któż przeciwko nam?"
  tags: []
"Rz8,32":
  text: "On, który nawet własnego Syna nie oszczędził, ale wydał go za nas wszystkich, jakże nie miałby z nim darować nam wszystkiego?"
  tags: []
"Rz8,33":
  text: "Któż będzie oskarżał wybranych Bożych? Bóg jest tym, który usprawiedliwia."
  tags: []
"Rz8,34":
  text: "Któż potępi? Chrystus jest tym, który umarł, więcej, zmartwychwstał, który też jest po prawicy Boga i wstawia się za nami."
  tags: []
"Rz8,35":
  text: "Któż nas odłączy od miłości Chrystusa? Czy utrapienie, czy ucisk, czy prześladowanie, czy głód, czy nagość, czy niebezpieczeństwo, czy miecz?"
  tags: []
"Rz8,36":
  text: "Jak jest napisane: Z powodu ciebie przez cały dzień nas zabijają, uważają nas za owce przeznaczone na rzeź."
  tags: []
"Rz8,37":
  text: "Ale w tym wszystkim całkowicie zwyciężamy przez tego, który nas umiłował."
  tags: []
"Rz8,38":
  text: "Jestem bowiem pewien, że ani śmierć, ani życie, ani aniołowie, ani zwierzchności, ani moce, ani teraźniejsze, ani przyszłe rzeczy;"
  tags: []
"Rz8,39":
  text: "Ani wysokość, ani głębokość, ani żadne inne stworzenie nie będzie mogło nas odłączyć od miłości Boga, która jest w Jezusie Chrystusie, naszym Panu."
  tags: []
