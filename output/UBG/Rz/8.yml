"Rz8,1": "Dlatego teraz żadnego potępienia nie ma dla tych, którzy są w Jezusie Chrystusie, którzy nie postępują według ciała, ale według Ducha."
"Rz8,2": "Gdyż prawo Ducha życia, które jest w Jezusie Chrystusie, uwolniło mnie od prawa grzechu i śmierci."
"Rz8,3": "Co bowiem było niemożliwe dla prawa, w czym było ono słabe z powodu ciała, Bóg, posławszy swego Syna w podobieństwie grzesznego ciała i z powodu grzechu, potępił grzech w ciele;"
"Rz8,4": "Aby sprawiedliwość prawa wypełniła się w nas, którzy postępujemy nie według ciała, ale według Ducha."
"Rz8,5": "Ci bowiem, którzy żyją według ciała, myślą o tym, co cielesne, ale ci, którzy żyją według Ducha, myślą o tym, co duchowe."
"Rz8,6": "Gdyż zamysł ciała to śmierć, ale zamysł Ducha to życie i pokój;"
"Rz8,7": "Dlatego, że zamysł ciała jest nieprzyjacielem Boga, bo nie poddaje się prawu Bożemu, gdyż i nie może."
"Rz8,8": "Ci więc, którzy są w ciele, nie mogą podobać się Bogu."
"Rz8,9": "Lecz wy nie jesteście w ciele, ale w Duchu, gdyż Duch Boży mieszka w was. A jeśli ktoś nie ma Ducha Chrystusa, ten do niego nie należy."
"Rz8,10": "Ale jeśli Chrystus jest w was, to ciało jest martwe z powodu grzechu, a duch jest żywy z powodu sprawiedliwości."
"Rz8,11": "A jeśli Duch tego, który Jezusa wskrzesił z martwych, mieszka w was, ten, który wskrzesił Chrystusa z martwych, ożywi i wasze śmiertelne ciała przez swego Ducha, który w was mieszka."
"Rz8,12": "Tak więc, bracia, jesteśmy dłużnikami, ale nie ciała, abyśmy mieli żyć według ciała."
"Rz8,13": "Jeśli bowiem żyjecie według ciała, umrzecie, ale jeśli Duchem uśmiercacie uczynki ciała, będziecie żyć."
"Rz8,14": "Wszyscy bowiem ci, którzy są prowadzeni przez Ducha Bożego, są synami Bożymi."
"Rz8,15": "Gdyż nie otrzymaliście ducha niewoli, aby znowu się bać, ale otrzymaliście Ducha usynowienia, przez którego wołamy: Abba, Ojcze!"
"Rz8,16": "Ten to Duch poświadcza naszemu duchowi, że jesteśmy dziećmi Bożymi."
"Rz8,17": "A jeśli dziećmi, to i dziedzicami, dziedzicami Boga, a współdziedzicami Chrystusa, jeśli tylko z nim cierpimy, abyśmy też z nim byli uwielbieni."
"Rz8,18": "Uważam bowiem, że cierpienia teraźniejszego czasu nie są godne porównywania z tą przyszłą chwałą, która ma się w nas objawić."
"Rz8,19": "Stworzenie bowiem z gorliwym wypatrywaniem oczekuje objawienia synów Bożych."
"Rz8,20": "Gdyż stworzenie jest poddane marności, nie dobrowolnie, ale z powodu tego, który je poddał, w nadziei;"
"Rz8,21": "Że i samo stworzenie będzie uwolnione z niewoli zniszczenia do chwalebnej wolności dzieci Bożych."
"Rz8,22": "Wiemy bowiem, że całe stworzenie razem jęczy i razem cierpi w bólach rodzenia aż dotąd."
"Rz8,23": "A nie tylko ono, ale i my, którzy mamy pierwsze plony Ducha, i my sami w sobie wzdychamy, oczekując usynowienia, odkupienia naszego ciała."
"Rz8,24": "Nadzieją bowiem jesteśmy zbawieni. A nadzieja, którą się widzi, nie jest nadzieją, bo jakże ktoś może spodziewać się tego, co widzi?"
"Rz8,25": "Ale jeśli spodziewamy się tego, czego nie widzimy, to oczekujemy tego z cierpliwością."
"Rz8,26": "Podobnie i Duch dopomaga naszej słabości. Nie wiemy bowiem, o co powinniśmy się modlić, jak trzeba, ale sam Duch wstawia się za nami w niewysłowionych westchnieniach."
"Rz8,27": "A ten, który bada serca, wie, jaki jest zamysł Ducha, ponieważ według woli Boga wstawia się za świętymi."
"Rz8,28": "A wiemy, że wszystko współdziała dla dobra tych, którzy miłują Boga, to jest tych, którzy są powołani według postanowienia Boga."
"Rz8,29": "Tych bowiem, których on przedtem znał, tych też przeznaczył, aby stali się podobni do obrazu jego Syna, żeby on był pierworodny między wieloma braćmi."
"Rz8,30": "Tych zaś, których przeznaczył, tych też powołał, a których powołał, tych też usprawiedliwił, a których usprawiedliwił, tych też uwielbił."
"Rz8,31": "Cóż więc na to powiemy? Jeśli Bóg za nami, któż przeciwko nam?"
"Rz8,32": "On, który nawet własnego Syna nie oszczędził, ale wydał go za nas wszystkich, jakże nie miałby z nim darować nam wszystkiego?"
"Rz8,33": "Któż będzie oskarżał wybranych Bożych? Bóg jest tym, który usprawiedliwia."
"Rz8,34": "Któż potępi? Chrystus jest tym, który umarł, więcej, zmartwychwstał, który też jest po prawicy Boga i wstawia się za nami."
"Rz8,35": "Któż nas odłączy od miłości Chrystusa? Czy utrapienie, czy ucisk, czy prześladowanie, czy głód, czy nagość, czy niebezpieczeństwo, czy miecz?"
"Rz8,36": "Jak jest napisane: Z powodu ciebie przez cały dzień nas zabijają, uważają nas za owce przeznaczone na rzeź."
"Rz8,37": "Ale w tym wszystkim całkowicie zwyciężamy przez tego, który nas umiłował."
"Rz8,38": "Jestem bowiem pewien, że ani śmierć, ani życie, ani aniołowie, ani zwierzchności, ani moce, ani teraźniejsze, ani przyszłe rzeczy;"
"Rz8,39": "Ani wysokość, ani głębokość, ani żadne inne stworzenie nie będzie mogło nas odłączyć od miłości Boga, która jest w Jezusie Chrystusie, naszym Panu."
