"Rz16,1":
  text: "Polecam wam Febę, naszą siostrę, która jest służebnicą kościoła w Kenchrach;"
  tags: []
"Rz16,2":
  text: "Abyście ją przyjęli w Panu, jak przystoi świętym, i pomagali jej w każdej sprawie, w której by was potrzebowała. I ona bowiem wspomagała wielu, także i mnie samego."
  tags: []
"Rz16,3":
  text: "Pozdrówcie Pryscyllę i Akwilę, moich pomocników w Jezusie Chrystusie;"
  tags: []
"Rz16,4":
  text: "Którzy za moje życie nadstawiali swojego własnego karku, którym nie tylko ja sam dziękuję, ale i wszystkie kościoły pogan;"
  tags: []
"Rz16,5":
  text: "Pozdrówcie także kościół, który jest w ich domu. Pozdrówcie mojego miłego Epeneta, który jest pierwszym plonem Achai dla Chrystusa."
  tags: []
"Rz16,6":
  text: "Pozdrówcie Marię, która wiele pracowała dla nas."
  tags: []
"Rz16,7":
  text: "Pozdrówcie Andronika i Juniasa, moich krewnych i moich współwięźniów, którzy są poważani wśród apostołów, którzy też przede mną byli w Chrystusie."
  tags: []
"Rz16,8":
  text: "Pozdrówcie Ampliasa, mojego umiłowanego w Panu."
  tags: []
"Rz16,9":
  text: "Pozdrówcie Urbana, naszego pomocnika w Chrystusie, i mojego umiłowanego Stachyna."
  tags: []
"Rz16,10":
  text: "Pozdrówcie Apellesa, wypróbowanego w Chrystusie. Pozdrówcie tych, którzy są z domu Arystobula."
  tags: []
"Rz16,11":
  text: "Pozdrówcie Herodiona, mojego krewnego. Pozdrówcie tych, którzy są z domu Narcyza, tych, którzy są w Panu."
  tags: []
"Rz16,12":
  text: "Pozdrówcie Tryfenę i Tryfozę, które pracują w Panu. Pozdrówcie umiłowaną Persydę, która wiele pracowała w Panu."
  tags: []
"Rz16,13":
  text: "Pozdrówcie Rufusa, wybranego w Panu, oraz matkę jego i moją."
  tags: []
"Rz16,14":
  text: "Pozdrówcie Asynkryta, Flegonta, Hermasa, Patrobę, Hermesa i braci, którzy są z nimi."
  tags: []
"Rz16,15":
  text: "Pozdrówcie Filologa i Julię, Nereusza i jego siostrę, Olimpasa i wszystkich świętych, którzy są z nimi."
  tags: []
"Rz16,16":
  text: "Pozdrówcie jedni drugich pocałunkiem świętym. Pozdrawiają was kościoły Chrystusa."
  tags: []
"Rz16,17":
  text: "A proszę was, bracia, abyście wypatrywali tych, którzy powodują rozłamy i zgorszenia przeciwko tej nauce, którą przyjęliście; unikajcie ich."
  tags: []
"Rz16,18":
  text: "Gdyż tacy nie służą naszemu Panu Jezusowi Chrystusowi, ale własnemu brzuchowi, a przez gładkie słowa i pochlebstwo zwodzą serca prostych ludzi."
  tags: []
"Rz16,19":
  text: "Wasze posłuszeństwo bowiem stało się znane wszystkim. Dlatego też raduję się z waszego powodu, ale chcę, abyście byli mądrzy w tym, co dobre, a prości w tym, co złe."
  tags: []
"Rz16,20":
  text: "A Bóg pokoju wkrótce zetrze szatana pod waszymi stopami. Łaska naszego Pana Jezusa Chrystusa niech będzie z wami. Amen."
  tags: []
"Rz16,21":
  text: "Pozdrawia was mój współpracownik Tymoteusz oraz Lucjusz, Jazon i Sozypater, moi krewni."
  tags: []
"Rz16,22":
  text: "Pozdrawiam was w Panu ja, Tercjusz, który pisałem ten list."
  tags: []
"Rz16,23":
  text: "Pozdrawia was Gajus, gospodarz mój i całego kościoła. Pozdrawia was Erastus, szafarz miejski, i Kwartus, brat."
  tags: []
"Rz16,24":
  text: "Łaska naszego Pana Jezusa Chrystusa niech będzie z wami wszystkimi. Amen."
  tags: []
"Rz16,25":
  text: "A temu, który was może utwierdzić według mojej ewangelii i głoszenia Jezusa Chrystusa, według objawienia tajemnicy od wieków okrytej milczeniem;"
  tags: []
"Rz16,26":
  text: "Lecz teraz objawionej i przez Pisma proroków według postanowienia wiecznego Boga oznajmionej wszystkim narodom, by przywieść je do posłuszeństwa wierze;"
  tags: []
"Rz16,27":
  text: "Temu, jedynemu mądremu Bogu, niech będzie chwała przez Jezusa Chrystusa na wieki. Amen."
  tags: []
