"Oz10,1": "Izrael jest próżną winoroślą, sam sobie przynosi owoc. Im więcej miał owocu, tym więcej pobudował ołtarzy, a im obfitsza była jego ziemia, tym piękniejsze wystawiał posągi."
"Oz10,2": "Ich serce jest rozdzielone, teraz są winni. On pokruszy ich ołtarze i zniszczy ich posągi."
"Oz10,3": "Mówią bowiem: Nie mamy króla, bo nie baliśmy się PANA, a cóż może dla nas uczynić król?"
"Oz10,4": "Wypowiadają słowa, przysięgając kłamliwie, gdy zawierają przymierze. Sąd wzrośnie jak trujący chwast w bruzdach polnych."
"Oz10,5": "Mieszkańcy Samarii zatrwożą się z powodu cielców Bet-Awen. Będą go bowiem opłakiwać jego lud oraz jego kapłani, którzy się radowali z niego, gdyż jego chwała odeszła od niego."
"Oz10,6": "Nawet i on sam zostanie zaprowadzony do Asyrii jako dar dla króla Jareb. Efraim okryje się hańbą i Izrael zawstydzi się z powodu swojej rady."
"Oz10,7": "Król Samarii zostanie wycięty jak piana na powierzchni wody."
"Oz10,8": "Wyżyny Awen, grzech Izraela, zostaną zniszczone. Ciernie i oset wyrosną na ich ołtarzach, a powiedzą do gór: Przykryjcie nas; a do pagórków: Padnijcie na nas."
"Oz10,9": "Od dni Gibea grzeszysz, Izraelu. Tam się ostali. Nie pochwyciła ich w Gibea bitwa przeciwko synom nieprawości."
"Oz10,10": "Ukarzę ich według mego upodobania; narody zbiorą się przeciwko nim, aby zostali ukarani za swoje dwie nieprawości."
"Oz10,11": "Efraim jest jak wyćwiczona jałówka, która lubi młócić. Lecz ja nadepnąłem na jej cudny kark, aby użyć Efraima do jazdy; Juda będzie orać, a Jakub będzie bronować."
"Oz10,12": "Siejcie sobie w sprawiedliwości, żnijcie w miłosierdziu, orzcie swoje ugory. Czas bowiem szukać PANA, aż przyjdzie i spuści na was sprawiedliwość jak deszcz."
"Oz10,13": "Ale oraliście niegodziwość, zbieraliście nieprawość i jedliście owoc kłamstwa. Zaufałeś bowiem swej drodze i wielkiej liczbie swoich wojowników."
"Oz10,14": "Dlatego powstanie zgiełk pośród twego ludu i wszystkie twoje zamki zostaną zburzone, tak jak Szalman zburzył Bet-Arbel w dniu bitwy, gdy matki z synami zostały roztrzaskane."
"Oz10,15": "Oto tak wam uczyni Betel z powodu waszej wielkiej niegodziwości. Król Izraela o świcie zostanie doszczętnie zgładzony."
