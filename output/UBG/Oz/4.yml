"Oz4,1":
  text: "Słuchajcie słowa PANA, synowie Izraela, bo PAN wnosi skargę przeciwko mieszkańcom tej ziemi, gdyż nie ma prawdy ani żadnego miłosierdzia, ani poznania Boga w ziemi."
  tags: []
"Oz4,2":
  text: "Krzywoprzysięstwo, kłamstwo, zabójstwo, kradzież i cudzołóstwo mnożą się, a morderstwo goni morderstwo."
  tags: []
"Oz4,3":
  text: "Dlatego ziemia będzie lamentować i marnieje wszystko, co w niej mieszka, wraz z polnymi zwierzętami i ptactwem nieba, nawet ryby morskie wyginą."
  tags: []
"Oz4,4":
  text: "Ale niech nikt z nimi się nie spiera ani ich nie strofuje, bo twój lud jest jak ci, którzy spierają się z kapłanem."
  tags: []
"Oz4,5":
  text: "Dlatego upadniesz we dnie, upadnie też wraz z tobą prorok w nocy; wyniszczę twoją matkę."
  tags: []
"Oz4,6":
  text: "Mój lud ginie z braku poznania; a ponieważ ty odrzuciłeś poznanie, ja też ciebie odrzucę, abyś już nie był dla mnie kapłanem. Skoro zapomniałeś o prawie twego Boga, ja też zapomnę o twoich synach."
  tags: []
"Oz4,7":
  text: "Im bardziej się rozmnożyli, tym więcej grzeszyli przeciwko mnie. Dlatego ich chwałę zamienię w hańbę."
  tags: []
"Oz4,8":
  text: "Pożerają ofiary za grzech mego ludu i swoją duszą pragną jego nieprawości."
  tags: []
"Oz4,9":
  text: "I tak samo stanie się z ludem jak z kapłanem, bo ukarzę ich za ich drogi i oddam im za ich uczynki."
  tags: []
"Oz4,10":
  text: "Będą jeść, ale się nie nasycą, będą uprawiać nierząd, ale się nie pomnożą, bo nie chcą zważać na PANA."
  tags: []
"Oz4,11":
  text: "Nierząd, wino i moszcz odbierają serce."
  tags: []
"Oz4,12":
  text: "Mój lud radzi się u swego drewna, a jego kij mu odpowiada, bo duch nierządu wprowadza ich w błąd i uprawiali nierząd, odstępując od swego Boga."
  tags: []
"Oz4,13":
  text: "Na szczytach gór składają ofiary i na pagórkach palą kadzidło pod dębem, topolą i wiązem, bo ich cień jest dobry. Dlatego wasze córki uprawiają nierząd i wasze kobiety cudzołożą."
  tags: []
"Oz4,14":
  text: "Nie będę karał waszych córek, gdy uprawiają nierząd, ani waszych kobiet, gdy cudzołożą. Oni sami bowiem odłączają się z nierządnicami i składają ofiary wraz z nierządnicami. A lud, który tego nie rozumie, upadnie."
  tags: []
"Oz4,15":
  text: "Jeśli ty, Izraelu, uprawiasz nierząd, niech chociaż Juda nie obciąży się winą. Nie idźcie do Gilgal ani nie wstępujcie do Bet-Awen, ani nie przysięgajcie: Jak żyje PAN!"
  tags: []
"Oz4,16":
  text: "Izrael bowiem jest nieujarzmiony jak narowista jałówka. Zaprawdę, PAN będzie ich paść jak jagnię na rozległym miejscu."
  tags: []
"Oz4,17":
  text: "Efraim związał się z bożkami. Zostaw go."
  tags: []
"Oz4,18":
  text: "Ich napój czyni ich upartymi; nieustannie uprawiają nierząd; jego obrońcy wstydliwie kochają dary."
  tags: []
"Oz4,19":
  text: "Pochwyci ich wiatr swoimi skrzydłami i będą zawstydzeni z powodu swoich ofiar."
  tags: []
