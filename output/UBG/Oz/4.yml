"Oz4,1": "Słuchajcie słowa PANA, synowie Izraela, bo PAN wnosi skargę przeciwko mieszkańcom tej ziemi, gdyż nie ma prawdy ani żadnego miłosierdzia, ani poznania Boga w ziemi."
"Oz4,2": "Krzywoprzysięstwo, kłamstwo, zabójstwo, kradzież i cudzołóstwo mnożą się, a morderstwo goni morderstwo."
"Oz4,3": "Dlatego ziemia będzie lamentować i marnieje wszystko, co w niej mieszka, wraz z polnymi zwierzętami i ptactwem nieba, nawet ryby morskie wyginą."
"Oz4,4": "Ale niech nikt z nimi się nie spiera ani ich nie strofuje, bo twój lud jest jak ci, którzy spierają się z kapłanem."
"Oz4,5": "Dlatego upadniesz we dnie, upadnie też wraz z tobą prorok w nocy; wyniszczę twoją matkę."
"Oz4,6": "Mój lud ginie z braku poznania; a ponieważ ty odrzuciłeś poznanie, ja też ciebie odrzucę, abyś już nie był dla mnie kapłanem. Skoro zapomniałeś o prawie twego Boga, ja też zapomnę o twoich synach."
"Oz4,7": "Im bardziej się rozmnożyli, tym więcej grzeszyli przeciwko mnie. Dlatego ich chwałę zamienię w hańbę."
"Oz4,8": "Pożerają ofiary za grzech mego ludu i swoją duszą pragną jego nieprawości."
"Oz4,9": "I tak samo stanie się z ludem jak z kapłanem, bo ukarzę ich za ich drogi i oddam im za ich uczynki."
"Oz4,10": "Będą jeść, ale się nie nasycą, będą uprawiać nierząd, ale się nie pomnożą, bo nie chcą zważać na PANA."
"Oz4,11": "Nierząd, wino i moszcz odbierają serce."
"Oz4,12": "Mój lud radzi się u swego drewna, a jego kij mu odpowiada, bo duch nierządu wprowadza ich w błąd i uprawiali nierząd, odstępując od swego Boga."
"Oz4,13": "Na szczytach gór składają ofiary i na pagórkach palą kadzidło pod dębem, topolą i wiązem, bo ich cień jest dobry. Dlatego wasze córki uprawiają nierząd i wasze kobiety cudzołożą."
"Oz4,14": "Nie będę karał waszych córek, gdy uprawiają nierząd, ani waszych kobiet, gdy cudzołożą. Oni sami bowiem odłączają się z nierządnicami i składają ofiary wraz z nierządnicami. A lud, który tego nie rozumie, upadnie."
"Oz4,15": "Jeśli ty, Izraelu, uprawiasz nierząd, niech chociaż Juda nie obciąży się winą. Nie idźcie do Gilgal ani nie wstępujcie do Bet-Awen, ani nie przysięgajcie: Jak żyje PAN!"
"Oz4,16": "Izrael bowiem jest nieujarzmiony jak narowista jałówka. Zaprawdę, PAN będzie ich paść jak jagnię na rozległym miejscu."
"Oz4,17": "Efraim związał się z bożkami. Zostaw go."
"Oz4,18": "Ich napój czyni ich upartymi; nieustannie uprawiają nierząd; jego obrońcy wstydliwie kochają dary."
"Oz4,19": "Pochwyci ich wiatr swoimi skrzydłami i będą zawstydzeni z powodu swoich ofiar."
