"Oz11,1": "Gdy Izrael był dzieckiem, umiłowałem go, a z Egiptu wezwałem mego syna."
"Oz11,2": "Prorocy wzywali ich, ale oni tym bardziej odchodzili sprzed ich oblicza. Składali ofiary Baalom i palili kadzidło rzeźbionym bożkom."
"Oz11,3": "Postawiłem Efraima na nogi, biorąc ich na ramiona, ale nie chcieli poznać, że ja ich wyleczyłem."
"Oz11,4": "Ciągnąłem ich powrozami ludzkimi, więzami miłości, a byłem dla nich jak ci, którzy zdejmują jarzmo z ich szczęk, i podawałem im pokarm."
"Oz11,5": "Nie wróci on do ziemi Egiptu, ale Asyryjczyk będzie jego królem, gdyż nie chcieli się nawrócić."
"Oz11,6": "Ponadto miecz będzie trwać w jego miastach, zniszczy jego gałęzie i pożre je z powodu ich rad."
"Oz11,7": "Mój lud jest skłonny do odstępowania ode mnie, a chociaż wezwano go do Najwyższego, nikt go nie wywyższa."
"Oz11,8": "Jakże mógłbym cię porzucić, Efraimie? Jakże mógłbym cię wydać, Izraelu? Jakże mógłbym cię równać z Admą i postąpić z tobą jak z Seboim? Moje serce odmieniło się we mnie, moja litość poruszyła się."
"Oz11,9": "Nie wykonam zapalczywości swojego gniewu i nie zniszczę Efraima ponownie, bo jestem Bogiem, a nie człowiekiem; Święty pośród ciebie. I nie nadciągnę przeciwko miastu."
"Oz11,10": "Pójdą za PANEM, który jak lew będzie ryczał. Gdy zaryczy, synowie z drżeniem przybiegną z zachodu."
"Oz11,11": "Przybiegną z drżeniem jak ptaki z Egiptu i jak gołębica z ziemi Asyrii i posadzę ich w ich domach, mówi PAN."
"Oz11,12": "Efraim otoczył mnie kłamstwem, a dom Izraela – zdradą, gdy Juda jeszcze panuje z Bogiem i jest wierny ze świętymi."
