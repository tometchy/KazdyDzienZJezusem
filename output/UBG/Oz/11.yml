"Oz11,1":
  text: "Gdy Izrael był dzieckiem, umiłowałem go, a z Egiptu wezwałem mego syna."
  tags: []
"Oz11,2":
  text: "Prorocy wzywali ich, ale oni tym bardziej odchodzili sprzed ich oblicza. Składali ofiary Baalom i palili kadzidło rzeźbionym bożkom."
  tags: []
"Oz11,3":
  text: "Postawiłem Efraima na nogi, biorąc ich na ramiona, ale nie chcieli poznać, że ja ich wyleczyłem."
  tags: []
"Oz11,4":
  text: "Ciągnąłem ich powrozami ludzkimi, więzami miłości, a byłem dla nich jak ci, którzy zdejmują jarzmo z ich szczęk, i podawałem im pokarm."
  tags: []
"Oz11,5":
  text: "Nie wróci on do ziemi Egiptu, ale Asyryjczyk będzie jego królem, gdyż nie chcieli się nawrócić."
  tags: []
"Oz11,6":
  text: "Ponadto miecz będzie trwać w jego miastach, zniszczy jego gałęzie i pożre je z powodu ich rad."
  tags: []
"Oz11,7":
  text: "Mój lud jest skłonny do odstępowania ode mnie, a chociaż wezwano go do Najwyższego, nikt go nie wywyższa."
  tags: []
"Oz11,8":
  text: "Jakże mógłbym cię porzucić, Efraimie? Jakże mógłbym cię wydać, Izraelu? Jakże mógłbym cię równać z Admą i postąpić z tobą jak z Seboim? Moje serce odmieniło się we mnie, moja litość poruszyła się."
  tags: []
"Oz11,9":
  text: "Nie wykonam zapalczywości swojego gniewu i nie zniszczę Efraima ponownie, bo jestem Bogiem, a nie człowiekiem; Święty pośród ciebie. I nie nadciągnę przeciwko miastu."
  tags: []
"Oz11,10":
  text: "Pójdą za PANEM, który jak lew będzie ryczał. Gdy zaryczy, synowie z drżeniem przybiegną z zachodu."
  tags: []
"Oz11,11":
  text: "Przybiegną z drżeniem jak ptaki z Egiptu i jak gołębica z ziemi Asyrii i posadzę ich w ich domach, mówi PAN."
  tags: []
"Oz11,12":
  text: "Efraim otoczył mnie kłamstwem, a dom Izraela – zdradą, gdy Juda jeszcze panuje z Bogiem i jest wierny ze świętymi."
  tags: []
