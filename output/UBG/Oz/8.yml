"Oz8,1": "Przyłóż trąbę do ust i mów: Oto przyleci na dom PANA jak orzeł, gdyż złamali moje przymierze i przekroczyli moje Prawo."
"Oz8,2": "Izrael będzie wołać do mnie: Mój Boże, znamy cię."
"Oz8,3": "Ale Izrael odrzucił dobro. Wróg będzie go ścigać."
"Oz8,4": "Oni ustanawiają królów, ale beze mnie; wybierają książąt, lecz bez mojej wiedzy. Ze swego srebra i złota czynią sobie bożki na własną zgubę."
"Oz8,5": "Twój cielec cię odrzucił, Samario! Mój gniew zapłonął przeciwko nim. Jak długo jeszcze nie będą oczyszczeni?"
"Oz8,6": "On bowiem jest z Izraela, rzemieślnik go wykonał, nie jest więc Bogiem. Cielec Samarii obróci się w proch."
"Oz8,7": "Oni bowiem posiali wiatr, będą zbierać wicher. Nie ma żadnego źdźbła. Kłos nie wyda mąki, a choćby wydał, obcy ją zjedzą."
"Oz8,8": "Izrael będzie pożarty, wkrótce staną się wśród pogan jak naczynie, z którego nie ma żadnej pociechy."
"Oz8,9": "Uciekli bowiem do Asyrii jak dziki samotny osioł. Efraim najął sobie kochanków."
"Oz8,10": "A chociaż najęli spośród narodów, ja ich wkrótce zbiorę i ucierpią nieco z powodu brzemienia króla książąt."
"Oz8,11": "Ponieważ Efraim pomnożył ołtarze, by grzeszyć, te ołtarze staną się dla niego powodem grzechu."
"Oz8,12": "Wypisałem mu wielkie rzeczy z mojego Prawa, ale on je uważał za coś obcego."
"Oz8,13": "Z ofiar moich darów składają w ofierze mięso i jedzą je, ale PAN tego nie przyjmuje. Już wspomina ich nieprawość i ukarze ich za grzechy. Powrócą do Egiptu."
"Oz8,14": "Zapomniał Izrael o swoim Stwórcy i pobudował świątynie, a Juda rozmnożył miasta warowne. Ale ja poślę ogień na jego miasta, który pożre jego pałace."
