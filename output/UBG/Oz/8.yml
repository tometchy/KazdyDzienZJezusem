"Oz8,1":
  text: "Przyłóż trąbę do ust i mów: Oto przyleci na dom PANA jak orzeł, gdyż złamali moje przymierze i przekroczyli moje Prawo."
  tags: []
"Oz8,2":
  text: "Izrael będzie wołać do mnie: Mój Boże, znamy cię."
  tags: []
"Oz8,3":
  text: "Ale Izrael odrzucił dobro. Wróg będzie go ścigać."
  tags: []
"Oz8,4":
  text: "Oni ustanawiają królów, ale beze mnie; wybierają książąt, lecz bez mojej wiedzy. Ze swego srebra i złota czynią sobie bożki na własną zgubę."
  tags: []
"Oz8,5":
  text: "Twój cielec cię odrzucił, Samario! Mój gniew zapłonął przeciwko nim. Jak długo jeszcze nie będą oczyszczeni?"
  tags: []
"Oz8,6":
  text: "On bowiem jest z Izraela, rzemieślnik go wykonał, nie jest więc Bogiem. Cielec Samarii obróci się w proch."
  tags: []
"Oz8,7":
  text: "Oni bowiem posiali wiatr, będą zbierać wicher. Nie ma żadnego źdźbła. Kłos nie wyda mąki, a choćby wydał, obcy ją zjedzą."
  tags: []
"Oz8,8":
  text: "Izrael będzie pożarty, wkrótce staną się wśród pogan jak naczynie, z którego nie ma żadnej pociechy."
  tags: []
"Oz8,9":
  text: "Uciekli bowiem do Asyrii jak dziki samotny osioł. Efraim najął sobie kochanków."
  tags: []
"Oz8,10":
  text: "A chociaż najęli spośród narodów, ja ich wkrótce zbiorę i ucierpią nieco z powodu brzemienia króla książąt."
  tags: []
"Oz8,11":
  text: "Ponieważ Efraim pomnożył ołtarze, by grzeszyć, te ołtarze staną się dla niego powodem grzechu."
  tags: []
"Oz8,12":
  text: "Wypisałem mu wielkie rzeczy z mojego Prawa, ale on je uważał za coś obcego."
  tags: []
"Oz8,13":
  text: "Z ofiar moich darów składają w ofierze mięso i jedzą je, ale PAN tego nie przyjmuje. Już wspomina ich nieprawość i ukarze ich za grzechy. Powrócą do Egiptu."
  tags: []
"Oz8,14":
  text: "Zapomniał Izrael o swoim Stwórcy i pobudował świątynie, a Juda rozmnożył miasta warowne. Ale ja poślę ogień na jego miasta, który pożre jego pałace."
  tags: []
