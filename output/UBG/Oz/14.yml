"Oz14,1":
  text: "Izraelu, nawróć się całkowicie do PANA, swego Boga. Upadłeś bowiem z powodu swojej nieprawości."
  tags: []
"Oz14,2":
  text: "Weźcie ze sobą słowa i zawróćcie do PANA. Mówcie do niego: Przebacz całą naszą nieprawość i daj to, co dobre, wtedy oddamy ci cielce naszych warg."
  tags: []
"Oz14,3":
  text: "Asyria nas nie wybawi, nie będziemy jeździć na koniach i nie będziemy już mówili do dzieł naszych rąk: Wy jesteście naszymi bogami. W tobie bowiem sierota znajduje miłosierdzie."
  tags: []
"Oz14,4":
  text: "Uzdrowię ich odstępstwo i umiłuję ich dobrowolnie, bo mój gniew odwrócił się od nich."
  tags: []
"Oz14,5":
  text: "Będę dla Izraela jak rosa, tak że rozkwitnie jak lilia i zapuści korzenie jak Liban."
  tags: []
"Oz14,6":
  text: "Jego gałęzie rozrosną się i jego piękno będzie jak drzewo oliwne, a jego woń jak Liban."
  tags: []
"Oz14,7":
  text: "Wrócą, aby siedzieć pod jego cieniem, ożyją jak zboże i rozkwitną jak winorośl, ich sława będzie jak wino Libanu."
  tags: []
"Oz14,8":
  text: "Efraim powie: Cóż mi już do bożków? Ja cię wysłucham i wejrzę na ciebie. Ja jestem jak zielona jodła, ode mnie pochodzi twój owoc."
  tags: []
"Oz14,9":
  text: "Kto mądry, niech to zrozumie, a kto roztropny, niech to pozna. Drogi PANA bowiem są proste; sprawiedliwi po nich będą chodzić, ale przestępcy na nich upadną."
  tags: []
