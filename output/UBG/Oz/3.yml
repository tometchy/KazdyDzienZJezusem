"Oz3,1": "I powiedział do mnie PAN: Idź jeszcze, pokochaj kobietę kochaną przez innego – cudzołożnicę, tak jak PAN miłuje synów Izraela, choć oni oglądają się za innymi bogami i kochają bukłaki wina."
"Oz3,2": "Więc kupiłem ją sobie za piętnaście srebrników i za półtora chomera jęczmienia;"
"Oz3,3": "I powiedziałem do niej: Pozostaniesz u mnie przez wiele dni. Nie będziesz uprawiała nierządu ani nie będziesz należała do innego mężczyzny, a ja też będę dla ciebie."
"Oz3,4": "Przez wiele dni bowiem synowie Izraela będą bez króla, bez księcia, bez ofiary, bez posągu, bez efodu i bez terafim."
"Oz3,5": "Potem synowie Izraela nawrócą się i będą szukać PANA, swego Boga, i Dawida, swego króla; a w ostatecznych dniach będą się bać PANA i jego dobroci."
