"Oz3,1":
  text: "I powiedział do mnie PAN: Idź jeszcze, pokochaj kobietę kochaną przez innego – cudzołożnicę, tak jak PAN miłuje synów Izraela, choć oni oglądają się za innymi bogami i kochają bukłaki wina."
  tags: []
"Oz3,2":
  text: "Więc kupiłem ją sobie za piętnaście srebrników i za półtora chomera jęczmienia;"
  tags: []
"Oz3,3":
  text: "I powiedziałem do niej: Pozostaniesz u mnie przez wiele dni. Nie będziesz uprawiała nierządu ani nie będziesz należała do innego mężczyzny, a ja też będę dla ciebie."
  tags: []
"Oz3,4":
  text: "Przez wiele dni bowiem synowie Izraela będą bez króla, bez księcia, bez ofiary, bez posągu, bez efodu i bez terafim."
  tags: []
"Oz3,5":
  text: "Potem synowie Izraela nawrócą się i będą szukać PANA, swego Boga, i Dawida, swego króla; a w ostatecznych dniach będą się bać PANA i jego dobroci."
  tags: []
