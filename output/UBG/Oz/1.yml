"Oz1,1":
  text: "Słowo PANA, które doszło do Ozeasza, syna Beeriego, za dni Uzjasza, Jotama, Achaza, Ezechiasza, królów Judy, i za dni Jeroboama, syna Joasza, króla Izraela."
  tags: []
"Oz1,2":
  text: "Początek słowa PANA przez Ozeasza. PAN powiedział do Ozeasza: Idź, weź sobie nierządnicę za żonę i dzieci nierządu. Ziemia bowiem uprawiała wstydliwy nierząd, odwróciła się od PANA."
  tags: []
"Oz1,3":
  text: "Poszedł więc i wziął sobie za żonę Gomerę, córkę Diblaima, a ona poczęła i urodziła mu syna."
  tags: []
"Oz1,4":
  text: "PAN powiedział do niego: Nadaj mu imię Jizreel, bo już niedługo pomszczę na domu Jehu krew Jizreel i sprawię, że ustanie królestwo domu Izraela."
  tags: []
"Oz1,5":
  text: "W tym dniu złamię łuk Izraela w dolinie Jizreel."
  tags: []
"Oz1,6":
  text: "I poczęła znowu, i urodziła córkę. PAN powiedział do niego: Nadaj jej imię Lo-Ruchama, bo już nie zlituję się nad domem Izraela, lecz na pewno go wytępię."
  tags: []
"Oz1,7":
  text: "Ale zlituję się nad domem Judy i wybawię go przez PANA, jego Boga, lecz nie wybawię łukiem ani mieczem, ani wojną, ani końmi, ani jeźdźcami."
  tags: []
"Oz1,8":
  text: "Gdy odstawiła od piersi Lo-Ruchamę, znowu poczęła i urodziła syna."
  tags: []
"Oz1,9":
  text: "I PAN powiedział: Nadaj mu imię Lo-Ammi, bo wy nie jesteście moim ludem, ja też nie będę waszym Bogiem."
  tags: []
"Oz1,10":
  text: "Jednak liczba synów Izraela będzie jak piasek morski, którego nie można zmierzyć ani zliczyć. I stanie się, że w miejscu, gdzie im mówiono: Nie jesteście moim ludem, będzie się do nich mówić: Wy jesteście synami Boga żywego."
  tags: []
"Oz1,11":
  text: "I będą zgromadzeni razem synowie Judy i synowie Izraela, ustanowią sobie jedną głowę i wyjdą z tej ziemi. Wielki bowiem będzie dzień Jizreel."
  tags: []
