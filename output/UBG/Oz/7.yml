"Oz7,1":
  text: "Gdy leczyłem Izraela, wtedy odkryła się nieprawość Efraima i niegodziwość Samarii, bo postępują kłamliwie; złodziej włamuje się do środka, rozbójnicy rabują na zewnątrz."
  tags: []
"Oz7,2":
  text: "A nie myślą w swoim sercu, że pamiętam o całej ich niegodziwości; a teraz ich czyny osaczają ich i są przed moim obliczem."
  tags: []
"Oz7,3":
  text: "Króla rozweselają swoją niegodziwością, a książąt swymi kłamstwami."
  tags: []
"Oz7,4":
  text: "Wszyscy cudzołożą, są jak piec rozpalony od piekarza, który przestaje czuwać, gdy zaczynił ciasto, aż się zakwasi."
  tags: []
"Oz7,5":
  text: "W dniu naszego króla książęta wprawili go w chorobę bukłakami wina, tak że wyciągał swoją rękę wraz z szydercami."
  tags: []
"Oz7,6":
  text: "Bo przygotowali swe serce do zasadzek jak rozpalony piec. Ich piekarz śpi całą noc, a rano płonie jak płomień ognia."
  tags: []
"Oz7,7":
  text: "Wszyscy są rozpaleni jak piec i pożerają swoich sędziów; wszyscy ich królowie upadli. Nie ma wśród nich nikogo, kto by wołał do mnie."
  tags: []
"Oz7,8":
  text: "Efraim zmieszał się z narodami; Efraim jest jak podpłomyk nieodwrócony."
  tags: []
"Oz7,9":
  text: "Obcy pochłonęli jego siłę, a on o tym nie wie; siwizna przyprószyła mu włosy, ale on tego nie dostrzega."
  tags: []
"Oz7,10":
  text: "I choć pycha Izraela świadczy przeciwko niemu, to nie nawracają się do PANA, swego Boga, ani go w tym wszystkim nie szukają."
  tags: []
"Oz7,11":
  text: "Efraim stał się jak głupia gołębica bez serca. Przyzywają Egipt, uciekają do Asyrii."
  tags: []
"Oz7,12":
  text: "Gdy odejdą, rozciągnę na nich swoją sieć, ściągnę ich jak ptactwo niebieskie; ukarzę ich, jak im mówiono o tym w ich zgromadzeniu."
  tags: []
"Oz7,13":
  text: "Biada im, bo uciekli ode mnie! Niech spadnie na nich spustoszenie, gdyż wystąpili przeciwko mnie. Chociaż ich odkupiłem, oni mówili kłamstwa przeciwko mnie."
  tags: []
"Oz7,14":
  text: "I nie wołają do mnie ze swego serca, gdy wyją na swoich łożach. Wprawdzie dla zboża i moszczu gromadzą się, ale ode mnie odstępują."
  tags: []
"Oz7,15":
  text: "Choć opatrzyłem i wzmocniłem ich ramiona, oni obmyślają zło przeciwko mnie."
  tags: []
"Oz7,16":
  text: "Zawracają, ale nie do Najwyższego. Są jak łuk zawodny; ich książęta polegną od miecza z powodu zapalczywości swego języka. To wystawi ich na pośmiewisko w ziemi Egiptu."
  tags: []
