"Oz7,1": "Gdy leczyłem Izraela, wtedy odkryła się nieprawość Efraima i niegodziwość Samarii, bo postępują kłamliwie; złodziej włamuje się do środka, rozbójnicy rabują na zewnątrz."
"Oz7,2": "A nie myślą w swoim sercu, że pamiętam o całej ich niegodziwości; a teraz ich czyny osaczają ich i są przed moim obliczem."
"Oz7,3": "Króla rozweselają swoją niegodziwością, a książąt swymi kłamstwami."
"Oz7,4": "Wszyscy cudzołożą, są jak piec rozpalony od piekarza, który przestaje czuwać, gdy zaczynił ciasto, aż się zakwasi."
"Oz7,5": "W dniu naszego króla książęta wprawili go w chorobę bukłakami wina, tak że wyciągał swoją rękę wraz z szydercami."
"Oz7,6": "Bo przygotowali swe serce do zasadzek jak rozpalony piec. Ich piekarz śpi całą noc, a rano płonie jak płomień ognia."
"Oz7,7": "Wszyscy są rozpaleni jak piec i pożerają swoich sędziów; wszyscy ich królowie upadli. Nie ma wśród nich nikogo, kto by wołał do mnie."
"Oz7,8": "Efraim zmieszał się z narodami; Efraim jest jak podpłomyk nieodwrócony."
"Oz7,9": "Obcy pochłonęli jego siłę, a on o tym nie wie; siwizna przyprószyła mu włosy, ale on tego nie dostrzega."
"Oz7,10": "I choć pycha Izraela świadczy przeciwko niemu, to nie nawracają się do PANA, swego Boga, ani go w tym wszystkim nie szukają."
"Oz7,11": "Efraim stał się jak głupia gołębica bez serca. Przyzywają Egipt, uciekają do Asyrii."
"Oz7,12": "Gdy odejdą, rozciągnę na nich swoją sieć, ściągnę ich jak ptactwo niebieskie; ukarzę ich, jak im mówiono o tym w ich zgromadzeniu."
"Oz7,13": "Biada im, bo uciekli ode mnie! Niech spadnie na nich spustoszenie, gdyż wystąpili przeciwko mnie. Chociaż ich odkupiłem, oni mówili kłamstwa przeciwko mnie."
"Oz7,14": "I nie wołają do mnie ze swego serca, gdy wyją na swoich łożach. Wprawdzie dla zboża i moszczu gromadzą się, ale ode mnie odstępują."
"Oz7,15": "Choć opatrzyłem i wzmocniłem ich ramiona, oni obmyślają zło przeciwko mnie."
"Oz7,16": "Zawracają, ale nie do Najwyższego. Są jak łuk zawodny; ich książęta polegną od miecza z powodu zapalczywości swego języka. To wystawi ich na pośmiewisko w ziemi Egiptu."
