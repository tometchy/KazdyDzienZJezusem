"Oz12,1":
  text: "Efraim karmi się wiatrem, goni za wiatrem wschodnim. Przez cały dzień mnoży kłamstwo i spustoszenie, bo zawiera przymierze z Asyryjczykami i wynosi oliwę do Egiptu."
  tags: []
"Oz12,2":
  text: "PAN wiedzie też spór z Judą i ukarze Jakuba według jego dróg, odda mu według jego czynów."
  tags: []
"Oz12,3":
  text: "Jeszcze w łonie ujął on za piętę swego brata, a swoją siłą mężnie zmagał się z Bogiem."
  tags: []
"Oz12,4":
  text: "Mężnie zmagał się z Aniołem i go przemógł. Płakał i go prosił. Znalazł go w Betel i tam z nami rozmawiał;"
  tags: []
"Oz12,5":
  text: "To jest PAN, Bóg zastępów, PAN to jego pamiętne imię."
  tags: []
"Oz12,6":
  text: "Ty więc nawróć się do swego Boga, przestrzegaj miłosierdzia i sądu i oczekuj swego Boga nieustannie."
  tags: []
"Oz12,7":
  text: "Jest kupcem, w jego ręce jest fałszywa waga, lubi uciskać."
  tags: []
"Oz12,8":
  text: "I Efraim powiedział: Ale wzbogaciłem się, zdobyłem dla siebie bogactwo. We wszystkich moich trudach nie znajdą przy mnie nieprawości, co byłoby grzechem."
  tags: []
"Oz12,9":
  text: "Jednak ja jestem PAN, twój Bóg, od wyjścia z ziemi Egiptu. Jeszcze sprawię, że będziecie mieszkać w namiotach, jak za dni uroczystych świąt."
  tags: []
"Oz12,10":
  text: "Mówiłem przez proroków, mnożyłem widzenia i przez proroków podawałem przypowieści."
  tags: []
"Oz12,11":
  text: "Czy tylko w Gileadzie była nieprawość i marność? I w Gilgal składają ofiary z wołów, owszem, ich ołtarzów pełno jak stosów kamieni w bruzdach na polach."
  tags: []
"Oz12,12":
  text: "Tam uciekł Jakub do ziemi Syrii, gdzie Izrael służył za żonę i za żonę strzegł stada."
  tags: []
"Oz12,13":
  text: "Ale PAN przez proroka wyprowadził Izraela z Egiptu i przez proroka był strzeżony."
  tags: []
"Oz12,14":
  text: "Lecz Efraim pobudził PANA do gorzkiego gniewu. Dlatego na niego wyleje się jego krew i jego Pan odpłaci mu za jego zniewagę."
  tags: []
