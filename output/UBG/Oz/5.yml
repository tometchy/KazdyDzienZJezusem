"Oz5,1":
  text: "Słuchajcie tego, kapłani, zważ na to, domu Izraela, i nakłoń ucha, domu króla. Przeciwko wam bowiem jest sąd, ponieważ byliście sidłem dla Mispy i siecią rozciągniętą na Taborze."
  tags: []
"Oz5,2":
  text: "Owszem, udają się podstępnie na rzeź, ale ja ukarzę każdego z nich."
  tags: []
"Oz5,3":
  text: "Znam Efraima i Izrael nie jest ukryty przede mną, bo teraz, Efraimie, uprawiasz nierząd, a Izrael się splugawił."
  tags: []
"Oz5,4":
  text: "Nie chcą zmienić swoich czynów, aby się nawrócić do swego Boga, dlatego że duch nierządu jest wśród nich i nie poznali PANA."
  tags: []
"Oz5,5":
  text: "Pycha Izraela świadczy przeciwko niemu. Dlatego Izrael i Efraim upadną z powodu swojej nieprawości, upadnie wraz z nimi też Juda."
  tags: []
"Oz5,6":
  text: "Ze swoimi trzodami i swoim bydłem pójdą szukać PANA, ale go nie znajdą, bo odstąpił od nich."
  tags: []
"Oz5,7":
  text: "Sprzeniewierzyli się PANU, bo napłodzili obcych synów, a teraz miesiąc pożre ich wraz z ich dziedzictwami."
  tags: []
"Oz5,8":
  text: "Zadmijcie w trąbę w Gibea i w trąbę w Rama; krzyczcie w Bet-Awen: Wróg za tobą, Beniaminie!"
  tags: []
"Oz5,9":
  text: "Efraim będzie spustoszony w dniu kary. Oznajmiłem wśród pokoleń Izraela to, co pewne."
  tags: []
"Oz5,10":
  text: "Książęta Judy stali się jak ci, którzy przesuwają granice. Wyleję na nich swój gniew jak wodę."
  tags: []
"Oz5,11":
  text: "Efraim jest uciskany i pokruszony sądem, gdyż chętnie chodził za rozkazem ludzkim."
  tags: []
"Oz5,12":
  text: "Dlatego będę dla Efraima jak mól, a dla domu Judy jak próchnica."
  tags: []
"Oz5,13":
  text: "Gdy Efraim zauważył swoją chorobę, a Juda swoją ranę, uciekł Efraim do Asyryjczyka i posłał do króla Jareb. Ale on was nie będzie mógł uzdrowić ani uleczyć waszej rany."
  tags: []
"Oz5,14":
  text: "Będę bowiem dla Efraima jak srogi lew, a dla domu Judy jak młody lew. Ja, ja sam porwę i odejdę; wezmę, a nikt mi go nie wydrze."
  tags: []
"Oz5,15":
  text: "Pójdę i wrócę do swego miejsca, aż uznają swoją winę i zaczną szukać mojego oblicza. W swoim utrapieniu będą mnie pilnie szukać."
  tags: []
