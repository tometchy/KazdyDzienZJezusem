"Oz5,1": "Słuchajcie tego, kapłani, zważ na to, domu Izraela, i nakłoń ucha, domu króla. Przeciwko wam bowiem jest sąd, ponieważ byliście sidłem dla Mispy i siecią rozciągniętą na Taborze."
"Oz5,2": "Owszem, udają się podstępnie na rzeź, ale ja ukarzę każdego z nich."
"Oz5,3": "Znam Efraima i Izrael nie jest ukryty przede mną, bo teraz, Efraimie, uprawiasz nierząd, a Izrael się splugawił."
"Oz5,4": "Nie chcą zmienić swoich czynów, aby się nawrócić do swego Boga, dlatego że duch nierządu jest wśród nich i nie poznali PANA."
"Oz5,5": "Pycha Izraela świadczy przeciwko niemu. Dlatego Izrael i Efraim upadną z powodu swojej nieprawości, upadnie wraz z nimi też Juda."
"Oz5,6": "Ze swoimi trzodami i swoim bydłem pójdą szukać PANA, ale go nie znajdą, bo odstąpił od nich."
"Oz5,7": "Sprzeniewierzyli się PANU, bo napłodzili obcych synów, a teraz miesiąc pożre ich wraz z ich dziedzictwami."
"Oz5,8": "Zadmijcie w trąbę w Gibea i w trąbę w Rama; krzyczcie w Bet-Awen: Wróg za tobą, Beniaminie!"
"Oz5,9": "Efraim będzie spustoszony w dniu kary. Oznajmiłem wśród pokoleń Izraela to, co pewne."
"Oz5,10": "Książęta Judy stali się jak ci, którzy przesuwają granice. Wyleję na nich swój gniew jak wodę."
"Oz5,11": "Efraim jest uciskany i pokruszony sądem, gdyż chętnie chodził za rozkazem ludzkim."
"Oz5,12": "Dlatego będę dla Efraima jak mól, a dla domu Judy jak próchnica."
"Oz5,13": "Gdy Efraim zauważył swoją chorobę, a Juda swoją ranę, uciekł Efraim do Asyryjczyka i posłał do króla Jareb. Ale on was nie będzie mógł uzdrowić ani uleczyć waszej rany."
"Oz5,14": "Będę bowiem dla Efraima jak srogi lew, a dla domu Judy jak młody lew. Ja, ja sam porwę i odejdę; wezmę, a nikt mi go nie wydrze."
"Oz5,15": "Pójdę i wrócę do swego miejsca, aż uznają swoją winę i zaczną szukać mojego oblicza. W swoim utrapieniu będą mnie pilnie szukać."
