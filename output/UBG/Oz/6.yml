"Oz6,1":
  text: "Chodźcie i zawróćmy do PANA, bo on nas poszarpał i on nas uzdrowi; uderzył, a opatrzy nasze rany."
  tags: []
"Oz6,2":
  text: "Ożywi nas po dwóch dniach, a trzeciego dnia wzbudzi nas i będziemy żyć przed jego obliczem."
  tags: []
"Oz6,3":
  text: "Wtedy poznamy i będziemy się starać poznać PANA. Jego wyjście bowiem jest przygotowane jak zorza poranna, przyjdzie do nas jak deszcz wiosenny i jesienny, który nawadnia ziemię."
  tags: []
"Oz6,4":
  text: "Cóż mam ci uczynić, Efraimie? Cóż mam ci uczynić, Judo? Wasza dobroć bowiem jest jak obłok poranny, jak rosa, która rano znika."
  tags: []
"Oz6,5":
  text: "Dlatego ciosałem ich przez proroków, zabijałem ich słowami moich ust, aby wyszła światłość twoich sądów."
  tags: []
"Oz6,6":
  text: "Pragnę bowiem miłosierdzia, a nie ofiary, i poznania Boga bardziej niż całopalenia."
  tags: []
"Oz6,7":
  text: "Ale oni zerwali moje przymierze jako ludzkie, w tym mi się sprzeniewierzyli."
  tags: []
"Oz6,8":
  text: "Gilead jest miastem czyniących nieprawość, splamionym krwią."
  tags: []
"Oz6,9":
  text: "A jak zbójcy czyhają na człowieka, tak czyni zgraja kapłanów na drodze do Sychem, bo popełniają czyny wstydliwe."
  tags: []
"Oz6,10":
  text: "Widziałem w domu Izraela rzeczy okropne: tam jest nierząd Efraima, a Izrael się splugawił."
  tags: []
"Oz6,11":
  text: "I dla ciebie, Judo, wyznaczył żniwo, gdy odwróciłem niewolę mojego ludu."
  tags: []
