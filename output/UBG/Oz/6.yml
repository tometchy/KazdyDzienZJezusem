"Oz6,1": "Chodźcie i zawróćmy do PANA, bo on nas poszarpał i on nas uzdrowi; uderzył, a opatrzy nasze rany."
"Oz6,2": "Ożywi nas po dwóch dniach, a trzeciego dnia wzbudzi nas i będziemy żyć przed jego obliczem."
"Oz6,3": "Wtedy poznamy i będziemy się starać poznać PANA. Jego wyjście bowiem jest przygotowane jak zorza poranna, przyjdzie do nas jak deszcz wiosenny i jesienny, który nawadnia ziemię."
"Oz6,4": "Cóż mam ci uczynić, Efraimie? Cóż mam ci uczynić, Judo? Wasza dobroć bowiem jest jak obłok poranny, jak rosa, która rano znika."
"Oz6,5": "Dlatego ciosałem ich przez proroków, zabijałem ich słowami moich ust, aby wyszła światłość twoich sądów."
"Oz6,6": "Pragnę bowiem miłosierdzia, a nie ofiary, i poznania Boga bardziej niż całopalenia."
"Oz6,7": "Ale oni zerwali moje przymierze jako ludzkie, w tym mi się sprzeniewierzyli."
"Oz6,8": "Gilead jest miastem czyniących nieprawość, splamionym krwią."
"Oz6,9": "A jak zbójcy czyhają na człowieka, tak czyni zgraja kapłanów na drodze do Sychem, bo popełniają czyny wstydliwe."
"Oz6,10": "Widziałem w domu Izraela rzeczy okropne: tam jest nierząd Efraima, a Izrael się splugawił."
"Oz6,11": "I dla ciebie, Judo, wyznaczył żniwo, gdy odwróciłem niewolę mojego ludu."
