"Oz9,1": "Nie ciesz się, Izraelu, nie raduj się jak inne narody, bo uprawiałeś nierząd, odwracając się od swego Boga, i umiłowałeś zapłatę nierządnicy na wszystkich klepiskach zbożowych."
"Oz9,2": "Klepisko i prasa nie będą ich żywiły, a moszczu im zabraknie."
"Oz9,3": "Nie będą mieszkać w ziemi PANA, ale Efraim wróci do Egiptu i w Asyrii będą jedli nieczyste rzeczy."
"Oz9,4": "Nie będą wylewali PANU ofiar z wina, nie będą mu one przyjemne. Ich ofiary będą dla nich jak chleb żałoby; wszyscy, którzy będą z niego jedli, będą nieczyści. Ich chleb bowiem za ich dusze nie wejdzie do domu PANA."
"Oz9,5": "Cóż będziecie czynić w uroczysty dzień i w dzień święta PANA?"
"Oz9,6": "Oto bowiem poszli z powodu spustoszenia. Egipt ich zgromadzi, a Memfis ich pogrzebie. Przyjemne miejsca na ich srebro odziedziczy pokrzywa, a w ich namiotach wyrosną ciernie."
"Oz9,7": "Przyjdą dni nawiedzenia, przyjdą dni zapłaty. Izrael pozna, że prorok jest głupcem, a człowiek duchowy – szalony, z powodu twojej wielkiej nieprawości i wielkiej nienawiści."
"Oz9,8": "Prorok, który trzymał straż nad Efraimem razem z moim Bogiem, stał się sidłem ptasznika na wszystkich jego drogach; nienawiść jest w domu jego Boga."
"Oz9,9": "Zepsuli się do głębi, jak za dni Gibea. PAN będzie pamiętał o ich nieprawości i ukarze ich za grzechy."
"Oz9,10": "Znalazłem Izraela jak winne grona na pustyni, widziałem twoich ojców jak pierwszy owoc figowca na jego początku. Ale oni poszli do Baal-Peor i oddali się tej hańbie, i stali się obrzydliwi, tak jak się im upodobało."
"Oz9,11": "Jak ptak sława Efraima uleci zaraz od urodzenia, od łona i od poczęcia."
"Oz9,12": "A choćby odchowali swoich synów, osierocę ich, zanim osiągną wiek męski. Owszem, biada im, gdy ja od nich odstąpię!"
"Oz9,13": "Efraim, jak widzę, jest jak Tyr zasadzony na przyjemnym miejscu. Efraim jednak wyprowadzi swoich synów do mordercy."
"Oz9,14": "Daj im, PANIE! Cóż im dasz? Daj im łono bezpłodne i wyschnięte piersi."
"Oz9,15": "Cała ich niegodziwość jest w Gilgal, dlatego tam ich nienawidzę. Z powodu zła ich uczynków wyrzucę ich z mego domu, nie będę ich już miłował. Wszyscy ich książęta są buntownikami."
"Oz9,16": "Efraim jest powalony, ich korzeń wysechł, nie przynoszą owocu. A choćby też zrodzili, zabiję umiłowane dzieci ich łona."
"Oz9,17": "Mój Bóg ich odrzuci, bo nie chcieli go słuchać, a będą tułaczami wśród narodów."
