"Oz13,1":
  text: "Gdy Efraim przemawiał, panował strach, bo był wywyższony w Izraelu; ale gdy zgrzeszył przy Baalu, wtedy umarł."
  tags: []
"Oz13,2":
  text: "A teraz dodają do swego grzechu, bo czynią sobie odlane posągi ze swego srebra i straszne bożki według swego pomysłu, a to wszystko jest dziełem rzemieślnika; jednak sami o nich mówią: Ludzie, którzy składają ofiary, niech całują cielce."
  tags: []
"Oz13,3":
  text: "Dlatego staną się jak obłok poranny, jak przemijająca rosa poranna, jak plewy przez wicher porwane z klepiska i jak dym z komina."
  tags: []
"Oz13,4":
  text: "Ale ja jestem PAN, twój Bóg, od wyjścia z ziemi Egiptu, a nie będziesz znał innego Boga oprócz mnie. I nie ma innego zbawiciela oprócz mnie."
  tags: []
"Oz13,5":
  text: "Ja cię poznałem na pustyni, w ziemi bardzo suchej."
  tags: []
"Oz13,6":
  text: "Byli nasyceni dobrymi pastwiskami, ale gdy się nasycili, ich serce się wywyższyło; dlatego zapomnieli o mnie."
  tags: []
"Oz13,7":
  text: "Będę więc dla nich jak lew, jak lampart przy drodze będę czyhał."
  tags: []
"Oz13,8":
  text: "Napadnę na nich jak niedźwiedzica, której zabrano młode, rozerwę powłokę ich serca i pożrę ich tam jak lew, dziki zwierz ich rozszarpie."
  tags: []
"Oz13,9":
  text: "Zniszczyłeś się sam, Izraelu, ale we mnie jest twoja pomoc."
  tags: []
"Oz13,10":
  text: "Ja jestem twoim królem. Gdzież jest ten, który ma cię wybawić we wszystkich twoich miastach? I twoi sędziowie, o których mówiłeś: Daj mi króla i książąt."
  tags: []
"Oz13,11":
  text: "Dałem ci więc króla w swoim gniewie i odebrałem go w swojej zapalczywości."
  tags: []
"Oz13,12":
  text: "Nieprawość Efraima jest związana, jego grzech jest ukryty."
  tags: []
"Oz13,13":
  text: "Ogarną go bóle rodzącej. On jest niemądrym synem, bo inaczej nie zostałby tak długo w łonie matki."
  tags: []
"Oz13,14":
  text: "Wybawię ich z mocy grobu, wykupię ich od śmierci. O śmierci, będę twoją śmiercią! O grobie, będę twoim zniszczeniem! Żal się ukryje przed moimi oczami."
  tags: []
"Oz13,15":
  text: "Choćby on wśród braci przyniósł owoc, przyjdzie jednak wiatr ze wschodu, wiatr PANA wyruszy z pustyni i wysuszy jego źródło, i wysuszy jego zdrój. On zagarnie skarby wszelkich kosztownych naczyń."
  tags: []
"Oz13,16":
  text: "Samaria będzie spustoszona, ponieważ sprzeciwiła się swemu Bogu. Padną od miecza, jej niemowlęta będą roztrzaskane, a jej brzemienne będą rozprute."
  tags: []
