"Oz13,1": "Gdy Efraim przemawiał, panował strach, bo był wywyższony w Izraelu; ale gdy zgrzeszył przy Baalu, wtedy umarł."
"Oz13,2": "A teraz dodają do swego grzechu, bo czynią sobie odlane posągi ze swego srebra i straszne bożki według swego pomysłu, a to wszystko jest dziełem rzemieślnika; jednak sami o nich mówią: Ludzie, którzy składają ofiary, niech całują cielce."
"Oz13,3": "Dlatego staną się jak obłok poranny, jak przemijająca rosa poranna, jak plewy przez wicher porwane z klepiska i jak dym z komina."
"Oz13,4": "Ale ja jestem PAN, twój Bóg, od wyjścia z ziemi Egiptu, a nie będziesz znał innego Boga oprócz mnie. I nie ma innego zbawiciela oprócz mnie."
"Oz13,5": "Ja cię poznałem na pustyni, w ziemi bardzo suchej."
"Oz13,6": "Byli nasyceni dobrymi pastwiskami, ale gdy się nasycili, ich serce się wywyższyło; dlatego zapomnieli o mnie."
"Oz13,7": "Będę więc dla nich jak lew, jak lampart przy drodze będę czyhał."
"Oz13,8": "Napadnę na nich jak niedźwiedzica, której zabrano młode, rozerwę powłokę ich serca i pożrę ich tam jak lew, dziki zwierz ich rozszarpie."
"Oz13,9": "Zniszczyłeś się sam, Izraelu, ale we mnie jest twoja pomoc."
"Oz13,10": "Ja jestem twoim królem. Gdzież jest ten, który ma cię wybawić we wszystkich twoich miastach? I twoi sędziowie, o których mówiłeś: Daj mi króla i książąt."
"Oz13,11": "Dałem ci więc króla w swoim gniewie i odebrałem go w swojej zapalczywości."
"Oz13,12": "Nieprawość Efraima jest związana, jego grzech jest ukryty."
"Oz13,13": "Ogarną go bóle rodzącej. On jest niemądrym synem, bo inaczej nie zostałby tak długo w łonie matki."
"Oz13,14": "Wybawię ich z mocy grobu, wykupię ich od śmierci. O śmierci, będę twoją śmiercią! O grobie, będę twoim zniszczeniem! Żal się ukryje przed moimi oczami."
"Oz13,15": "Choćby on wśród braci przyniósł owoc, przyjdzie jednak wiatr ze wschodu, wiatr PANA wyruszy z pustyni i wysuszy jego źródło, i wysuszy jego zdrój. On zagarnie skarby wszelkich kosztownych naczyń."
"Oz13,16": "Samaria będzie spustoszona, ponieważ sprzeciwiła się swemu Bogu. Padną od miecza, jej niemowlęta będą roztrzaskane, a jej brzemienne będą rozprute."
