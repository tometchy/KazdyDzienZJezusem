"Jon2,1":
  text: "I modlił się Jonasz do PANA, swego Boga, we wnętrznościach tej ryby;"
  tags: []
"Jon2,2":
  text: "I powiedział: Wołałem do PANA w swoim ucisku i wysłuchał mnie; z głębi piekła wołałem i wysłuchałeś mego głosu."
  tags: []
"Jon2,3":
  text: "Rzuciłeś mnie bowiem w głębię, w sam środek morza, i ogarnęła mnie toń. Wszystkie twoje nawałnice i fale przewaliły się nade mną."
  tags: []
"Jon2,4":
  text: "Wtedy powiedziałem: Zostałem wygnany sprzed twoich oczu, ale będę jeszcze patrzył w stronę twej świętej świątyni."
  tags: []
"Jon2,5":
  text: "Wody ogarnęły mnie aż do duszy, przepaść mnie otoczyła, moją głowę owinęła trawa morska."
  tags: []
"Jon2,6":
  text: "Zstąpiłem aż do posad gór, swymi ryglami ziemia zamknęła się przede mną na wieki. Ty jednak wyprowadziłeś moje życie z dołu, PANIE, mój Boże!"
  tags: []
"Jon2,7":
  text: "Gdy moja dusza we mnie omdlewała, wspomniałem na PANA, a moja modlitwa przyszła do ciebie, do twej świętej świątyni."
  tags: []
"Jon2,8":
  text: "Ci, którzy trzymają się próżnych marności, pozbawiają się miłosierdzia;"
  tags: []
"Jon2,9":
  text: "Ale ja z głosem dziękczynienia będę ci składał ofiary, wypełnię to, co ślubowałem. Od PANA pochodzi wybawienie."
  tags: []
"Jon2,10":
  text: "Wtedy PAN rozkazał tej rybie, a ona wypluła Jonasza na brzeg."
  tags: []
