"Jon2,1": "I modlił się Jonasz do PANA, swego Boga, we wnętrznościach tej ryby;"
"Jon2,2": "I powiedział: Wołałem do PANA w swoim ucisku i wysłuchał mnie; z głębi piekła wołałem i wysłuchałeś mego głosu."
"Jon2,3": "Rzuciłeś mnie bowiem w głębię, w sam środek morza, i ogarnęła mnie toń. Wszystkie twoje nawałnice i fale przewaliły się nade mną."
"Jon2,4": "Wtedy powiedziałem: Zostałem wygnany sprzed twoich oczu, ale będę jeszcze patrzył w stronę twej świętej świątyni."
"Jon2,5": "Wody ogarnęły mnie aż do duszy, przepaść mnie otoczyła, moją głowę owinęła trawa morska."
"Jon2,6": "Zstąpiłem aż do posad gór, swymi ryglami ziemia zamknęła się przede mną na wieki. Ty jednak wyprowadziłeś moje życie z dołu, PANIE, mój Boże!"
"Jon2,7": "Gdy moja dusza we mnie omdlewała, wspomniałem na PANA, a moja modlitwa przyszła do ciebie, do twej świętej świątyni."
"Jon2,8": "Ci, którzy trzymają się próżnych marności, pozbawiają się miłosierdzia;"
"Jon2,9": "Ale ja z głosem dziękczynienia będę ci składał ofiary, wypełnię to, co ślubowałem. Od PANA pochodzi wybawienie."
"Jon2,10": "Wtedy PAN rozkazał tej rybie, a ona wypluła Jonasza na brzeg."
