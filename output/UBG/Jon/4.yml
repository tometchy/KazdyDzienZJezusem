"Jon4,1":
  text: "Ale Jonaszowi bardzo się to nie podobało i rozgniewał się."
  tags: []
"Jon4,2":
  text: "I modlił się do PANA, mówiąc: Proszę, PANIE, czy tego nie mówiłem, gdy jeszcze byłem w swojej ziemi? Dlatego zaraz uciekłem do Tarszisz, gdyż wiedziałem, że ty jesteś Bogiem łaskawym i litościwym, nieskorym do gniewu i pełnym wielkiego miłosierdzia, który żałuje nieszczęścia."
  tags: []
"Jon4,3":
  text: "A teraz, PANIE, proszę, zabierz ode mnie moje życie, bo lepiej mi umrzeć, niż żyć."
  tags: []
"Jon4,4":
  text: "PAN odpowiedział: Czy to dobrze, że tak się gniewasz?"
  tags: []
"Jon4,5":
  text: "Wyszedł więc Jonasz z miasta i usiadł po wschodniej stronie miasta. Tam zrobił sobie szałas i usiadł w jego cieniu, by zobaczyć, co się stanie z tym miastem."
  tags: []
"Jon4,6":
  text: "A PAN Bóg sprawił, że nad Jonaszem wyrosła tykwa, aby zasłaniała jego głowę i chroniła go przed upałem. I Jonasz bardzo się cieszył z tej tykwy."
  tags: []
"Jon4,7":
  text: "Ale nazajutrz o świcie Bóg sprawił, że robak podgryzł tę tykwę, tak że uschła."
  tags: []
"Jon4,8":
  text: "I gdy wzeszło słońce, Bóg wzbudził suchy wiatr wschodni; i słońce tak prażyło głowę Jonasza, że omdlewał i życzył sobie śmierci, mówiąc: Lepiej mi umrzeć, niż żyć."
  tags: []
"Jon4,9":
  text: "I Bóg powiedział do Jonasza: Czy to dobrze, że tak się gniewasz z powodu tej tykwy? I odpowiedział: To dobrze, że się gniewam, nawet aż na śmierć."
  tags: []
"Jon4,10":
  text: "Wtedy PAN mu powiedział: Żałujesz tej tykwy, przy której nie pracowałeś ani nie dałeś jej wzrostu; wyrosła w jedną noc i w jedną noc uschła;"
  tags: []
"Jon4,11":
  text: "A ja miałbym nie żałować Niniwy, tego wielkiego miasta, w którym jest więcej niż sto dwadzieścia tysięcy ludzi, którzy nie umieją rozróżnić swej prawej ręki od lewej, a także wiele bydła?"
  tags: []
