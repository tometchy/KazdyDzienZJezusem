"Jon3,1": "Wtedy słowo PANA doszło do Jonasza po raz drugi mówiące:"
"Jon3,2": "Wstań, idź do Niniwy, tego wielkiego miasta, i głoś przeciwko niej to, co ci rozkazuję."
"Jon3,3": "Wstał więc Jonasz i poszedł do Niniwy zgodnie ze słowem PANA. A Niniwa była bardzo wielkim miastem, na trzy dni drogi."
"Jon3,4": "Jonasz zaczął chodzić po mieście, ile mógł przejść w jeden dzień, i wołał: Po czterdziestu dniach Niniwa zostanie zburzona."
"Jon3,5": "I mieszkańcy Niniwy uwierzyli Bogu, ogłosili post i oblekli się w wory, od największego z nich aż do najmniejszego."
"Jon3,6": "Doszła bowiem ta sprawa do króla Niniwy i powstał z tronu, i zdjął z siebie płaszcz, po czym oblekł się w wór i siedział w popiele."
"Jon3,7": "Rozkazał ogłosić i opowiadać w Niniwie z dekretu króla i swoich książąt: Ludzie i zwierzęta, woły i owce niech nic nie jedzą, niech się nie pasą i wody nie piją;"
"Jon3,8": "Ale ludzie i zwierzęta niech się okryją worami i niech gorliwie wołają do Boga. Niech każdy się odwróci od swojej złej drogi i od grabieży popełnianej swoimi rękami."
"Jon3,9": "Kto wie, czy Bóg się nie odwróci i nie pożałuje, i nie odstąpi od zapalczywości swego gniewu, abyśmy nie zginęli."
"Jon3,10": "I Bóg widział ich czyny, że odwrócili się od swojej złej drogi, i Bóg pożałował tego nieszczęścia, które zapowiedział im czynić, a nie uczynił."
