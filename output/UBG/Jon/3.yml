"Jon3,1":
  text: "Wtedy słowo PANA doszło do Jonasza po raz drugi mówiące:"
  tags: []
"Jon3,2":
  text: "Wstań, idź do Niniwy, tego wielkiego miasta, i głoś przeciwko niej to, co ci rozkazuję."
  tags: []
"Jon3,3":
  text: "Wstał więc Jonasz i poszedł do Niniwy zgodnie ze słowem PANA. A Niniwa była bardzo wielkim miastem, na trzy dni drogi."
  tags: []
"Jon3,4":
  text: "Jonasz zaczął chodzić po mieście, ile mógł przejść w jeden dzień, i wołał: Po czterdziestu dniach Niniwa zostanie zburzona."
  tags: []
"Jon3,5":
  text: "I mieszkańcy Niniwy uwierzyli Bogu, ogłosili post i oblekli się w wory, od największego z nich aż do najmniejszego."
  tags: []
"Jon3,6":
  text: "Doszła bowiem ta sprawa do króla Niniwy i powstał z tronu, i zdjął z siebie płaszcz, po czym oblekł się w wór i siedział w popiele."
  tags: []
"Jon3,7":
  text: "Rozkazał ogłosić i opowiadać w Niniwie z dekretu króla i swoich książąt: Ludzie i zwierzęta, woły i owce niech nic nie jedzą, niech się nie pasą i wody nie piją;"
  tags: []
"Jon3,8":
  text: "Ale ludzie i zwierzęta niech się okryją worami i niech gorliwie wołają do Boga. Niech każdy się odwróci od swojej złej drogi i od grabieży popełnianej swoimi rękami."
  tags: []
"Jon3,9":
  text: "Kto wie, czy Bóg się nie odwróci i nie pożałuje, i nie odstąpi od zapalczywości swego gniewu, abyśmy nie zginęli."
  tags: []
"Jon3,10":
  text: "I Bóg widział ich czyny, że odwrócili się od swojej złej drogi, i Bóg pożałował tego nieszczęścia, które zapowiedział im czynić, a nie uczynił."
  tags: []
