"Flp3,1":
  text: "W końcu, moi bracia, radujcie się w Panu. Pisać do was o tym samym mnie nie męczy, a dla was jest bezpieczne."
  tags: []
"Flp3,2":
  text: "Strzeżcie się psów, strzeżcie się złych pracowników, strzeżcie się obrzezywaczy."
  tags: []
"Flp3,3":
  text: "My bowiem jesteśmy obrzezaniem, którzy w duchu służymy Bogu i chlubimy się w Chrystusie Jezusie, a nie pokładamy ufności w ciele."
  tags: []
"Flp3,4":
  text: "Chociaż i ja mógłbym pokładać ufność w ciele. Jeśli ktoś inny uważa, że może pokładać ufność w ciele, bardziej ja:"
  tags: []
"Flp3,5":
  text: "Obrzezany ósmego dnia, z rodu Izraela, z pokolenia Beniamina, Hebrajczyk z Hebrajczyków, co do prawa – faryzeusz;"
  tags: []
"Flp3,6":
  text: "Co do gorliwości – prześladowca kościoła, co do sprawiedliwości opartej na prawie – nienaganny."
  tags: []
"Flp3,7":
  text: "Lecz to, co było dla mnie zyskiem, ze względu na Chrystusa uznałem za stratę."
  tags: []
"Flp3,8":
  text: "Owszem, wszystko uznaję za stratę dla znakomitości poznania Chrystusa Jezusa, mojego Pana, dla którego wszystko utraciłem i uznaję to za gnój, aby zyskać Chrystusa;"
  tags: []
"Flp3,9":
  text: "I znaleźć się w nim, nie mając własnej sprawiedliwości, tej, która jest z prawa, ale tę, która jest przez wiarę Chrystusa, to jest sprawiedliwość z Boga przez wiarę;"
  tags: []
"Flp3,10":
  text: "Żeby poznać jego i moc jego zmartwychwstania oraz swój udział w jego cierpieniach, upodabniając się do jego śmierci;"
  tags: []
"Flp3,11":
  text: "Abym jakimkolwiek sposobem dostąpił powstania z martwych."
  tags: []
"Flp3,12":
  text: "Nie żebym to już osiągnął albo już był doskonały, ale dążę, aby pochwycić to, do czego też zostałem pochwycony przez Chrystusa Jezusa."
  tags: []
"Flp3,13":
  text: "Bracia, ja o sobie nie myślę, że już pochwyciłem. Lecz jedno czynię: zapominając o tym, co za mną, a zdążając do tego, co przede mną;"
  tags: []
"Flp3,14":
  text: "Biegnę do mety, do nagrody powołania Bożego, które jest z góry w Chrystusie Jezusie."
  tags: []
"Flp3,15":
  text: "Ilu więc nas jest doskonałych, tak myślmy. A jeśli o czymś inaczej myślicie, i to wam Bóg objawi."
  tags: []
"Flp3,16":
  text: "Jednak w tym, do czego doszliśmy, postępujmy według jednej miary i to samo myślmy."
  tags: []
"Flp3,17":
  text: "Bądźcie, bracia, wszyscy razem moimi naśladowcami i przypatrujcie się tym, którzy postępują według wzoru, jaki w nas macie."
  tags: []
"Flp3,18":
  text: "Wielu bowiem, o których wam często mówiłem, postępuje inaczej, a teraz nawet z płaczem mówię, że są wrogami krzyża Chrystusa."
  tags: []
"Flp3,19":
  text: "Ich końcem jest zatracenie, ich Bogiem jest brzuch, a ich chwała jest w hańbie; myślą oni o tym, co ziemskie."
  tags: []
"Flp3,20":
  text: "Nasza zaś ojczyzna jest w niebie, skąd też oczekujemy Zbawiciela, Pana Jezusa Chrystusa."
  tags: []
"Flp3,21":
  text: "On przemieni nasze podłe ciało, aby było podobne do jego chwalebnego ciała, zgodnie ze skuteczną mocą, którą też może poddać sobie wszystko."
  tags: []
