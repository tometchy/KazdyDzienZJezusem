"Flp3,1": "W końcu, moi bracia, radujcie się w Panu. Pisać do was o tym samym mnie nie męczy, a dla was jest bezpieczne."
"Flp3,2": "Strzeżcie się psów, strzeżcie się złych pracowników, strzeżcie się obrzezywaczy."
"Flp3,3": "My bowiem jesteśmy obrzezaniem, którzy w duchu służymy Bogu i chlubimy się w Chrystusie Jezusie, a nie pokładamy ufności w ciele."
"Flp3,4": "Chociaż i ja mógłbym pokładać ufność w ciele. Jeśli ktoś inny uważa, że może pokładać ufność w ciele, bardziej ja:"
"Flp3,5": "Obrzezany ósmego dnia, z rodu Izraela, z pokolenia Beniamina, Hebrajczyk z Hebrajczyków, co do prawa – faryzeusz;"
"Flp3,6": "Co do gorliwości – prześladowca kościoła, co do sprawiedliwości opartej na prawie – nienaganny."
"Flp3,7": "Lecz to, co było dla mnie zyskiem, ze względu na Chrystusa uznałem za stratę."
"Flp3,8": "Owszem, wszystko uznaję za stratę dla znakomitości poznania Chrystusa Jezusa, mojego Pana, dla którego wszystko utraciłem i uznaję to za gnój, aby zyskać Chrystusa;"
"Flp3,9": "I znaleźć się w nim, nie mając własnej sprawiedliwości, tej, która jest z prawa, ale tę, która jest przez wiarę Chrystusa, to jest sprawiedliwość z Boga przez wiarę;"
"Flp3,10": "Żeby poznać jego i moc jego zmartwychwstania oraz swój udział w jego cierpieniach, upodabniając się do jego śmierci;"
"Flp3,11": "Abym jakimkolwiek sposobem dostąpił powstania z martwych."
"Flp3,12": "Nie żebym to już osiągnął albo już był doskonały, ale dążę, aby pochwycić to, do czego też zostałem pochwycony przez Chrystusa Jezusa."
"Flp3,13": "Bracia, ja o sobie nie myślę, że już pochwyciłem. Lecz jedno czynię: zapominając o tym, co za mną, a zdążając do tego, co przede mną;"
"Flp3,14": "Biegnę do mety, do nagrody powołania Bożego, które jest z góry w Chrystusie Jezusie."
"Flp3,15": "Ilu więc nas jest doskonałych, tak myślmy. A jeśli o czymś inaczej myślicie, i to wam Bóg objawi."
"Flp3,16": "Jednak w tym, do czego doszliśmy, postępujmy według jednej miary i to samo myślmy."
"Flp3,17": "Bądźcie, bracia, wszyscy razem moimi naśladowcami i przypatrujcie się tym, którzy postępują według wzoru, jaki w nas macie."
"Flp3,18": "Wielu bowiem, o których wam często mówiłem, postępuje inaczej, a teraz nawet z płaczem mówię, że są wrogami krzyża Chrystusa."
"Flp3,19": "Ich końcem jest zatracenie, ich Bogiem jest brzuch, a ich chwała jest w hańbie; myślą oni o tym, co ziemskie."
"Flp3,20": "Nasza zaś ojczyzna jest w niebie, skąd też oczekujemy Zbawiciela, Pana Jezusa Chrystusa."
"Flp3,21": "On przemieni nasze podłe ciało, aby było podobne do jego chwalebnego ciała, zgodnie ze skuteczną mocą, którą też może poddać sobie wszystko."
