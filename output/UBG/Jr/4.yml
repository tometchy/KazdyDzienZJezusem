"Jr4,1": "Jeśli chcesz powrócić, Izraelu, mówi PAN, to wróć do mnie. A jeśli usuniesz swoje obrzydliwości sprzed mego oblicza, to już nie będziesz się tułał."
"Jr4,2": "I przysięgniesz: Jak żyje PAN w prawdzie, w sądzie i w sprawiedliwości. Wtedy narody będą sobie błogosławić w nim i w nim będą się chlubić."
"Jr4,3": "Tak bowiem mówi PAN do mężczyzn z Judy i Jerozolimy: Przeorzcie swoje ugory, a nie siejcie między ciernie;"
"Jr4,4": "Obrzeżcie się dla PANA i usuńcie napletki waszych serc, Judejczycy i mieszkańcy Jerozolimy, aby moja zapalczywość nie wybuchła jak ogień i nie paliła się tak, że nikt nie zdoła jej zgasić z powodu zła waszych uczynków."
"Jr4,5": "Opowiadajcie w Judzie, ogłaszajcie w Jerozolimie i mówcie: Dmijcie w trąbę w całej ziemi; wołajcie, zgromadźcie się i mówcie: Zbierzcie się i wejdźmy do miast warownych."
"Jr4,6": "Podnieście sztandar w kierunku Syjonu, uciekajcie, nie zastanawiajcie się. Sprowadzam bowiem nieszczęście od północy i wielkie zniszczenie."
"Jr4,7": "Lew wyszedł ze swojej jaskini, niszczyciel narodów wyruszył, wyszedł ze swego miejsca, aby zamienić twoją ziemię w pustkowie, a twoje miasta zostaną zburzone i pozbawione mieszkańców."
"Jr4,8": "Dlatego przepaszcie się worami, lamentujcie i zawódźcie, bo nie odwróciła się od nas zapalczywość gniewu PANA."
"Jr4,9": "I stanie się w owym dniu, mówi PAN, że zginie serce króla i serce książąt, a zdumieją się kapłani i prorocy dziwić się będą."
"Jr4,10": "I powiedziałem: Ach, Panie BOŻE! Naprawdę bardzo zawiodłeś ten lud i Jerozolimę, mówiąc: Będziecie mieć pokój! A tymczasem miecz przeniknął nas aż do duszy."
"Jr4,11": "W owym czasie będzie się mówić do tego ludu i do Jerozolimy: Gorący wiatr wyżynny z pustyni idzie prosto na mój lud, lecz nie po to, by go przewiać czy oczyścić."
"Jr4,12": "Wiatr silniejszy niż oni przyjdzie do mnie; teraz ja też wydam na nich wyrok."
"Jr4,13": "Oto nadciągnie jak obłoki, a jego rydwany jak wicher, jego konie są szybsze niż orły. Biada nam, bo jesteśmy spustoszeni."
"Jr4,14": "Obmyj z nieprawości swoje serce, Jerozolimo, abyś została wybawiona. Jak długo będą trwać w tobie twoje niegodziwe myśli?"
"Jr4,15": "Głos bowiem opowiada od strony Dan i z góry Efraim ogłasza klęskę."
"Jr4,16": "Przypominajcie narodom: Oto ogłaszajcie Jerozolimie, że stróże nadciągają z dalekiej ziemi i wznoszą swój głos przeciwko miastom Judy."
"Jr4,17": "Jak stróże pól otoczą ją dokoła, bo zbuntowała się przeciwko mnie, mówi PAN."
"Jr4,18": "Twoja droga i twoje uczynki sprowadziły to na ciebie; twoja niegodziwość sprawia, że jest to gorzkie i że przenika aż do twego serca."
"Jr4,19": "O moje wnętrze, moje wnętrze! Cierpię z boleści do samego serca! Trwoży się we mnie moje serce, nie mogę milczeć, bo usłyszałaś, moja duszo, głos trąby i okrzyk wojenny."
"Jr4,20": "Klęska za klęską ogłasza się, bo cała ziemia jest spustoszona. Nagle zniszczone zostały moje namioty, w okamgnieniu – moje zasłony."
"Jr4,21": "Jak długo mam patrzeć na sztandar i słyszeć dźwięk trąby?"
"Jr4,22": "Bo mój lud jest głupi, nie zna mnie; to są dzieci niemądre i nierozumne. Są mądre w czynieniu zła, lecz dobrze czynić nie umieją."
"Jr4,23": "Spojrzałem na ziemię, a oto bezkształtna i pusta; na niebo, a nie było na nim światła."
"Jr4,24": "Spojrzałem na góry, a oto się trzęsły i wszystkie pagórki się chwiały."
"Jr4,25": "Spojrzałem, a oto nie było człowieka i wszelkie ptactwo niebieskie odleciało."
"Jr4,26": "Spojrzałem, a oto pole urodzajne stało się pustynią, a wszystkie jego miasta zostały zburzone przed PANEM i przez zapalczywość jego gniewu."
"Jr4,27": "Bo tak mówi PAN: Cała ziemia zostanie spustoszona, lecz całkowicie jej nie zniszczę."
"Jr4,28": "Nad tym ziemia będzie lamentować, a niebiosa w górze zaćmią się, gdyż powiedziałem i postanowiłem, a nie będę żałował ani nie odwrócę się od tego."
"Jr4,29": "Przed wrzawą jeźdźców i łuczników ucieknie całe miasto; wejdą w gęstwiny i wstąpią na skały. Wszystkie miasta będą opuszczone i nie będzie w nich żadnego mieszkańca."
"Jr4,30": "A ty, spustoszona, cóż uczynisz? Choćbyś się ubrała w szkarłat, choćbyś się przystroiła w złote ozdoby, choćbyś też przyozdobiła swoją twarz kolorem, na próżno się stroisz; twoi kochankowie pogardzą tobą, będą czyhać na twoje życie."
"Jr4,31": "Słyszałem bowiem głos jakby rodzącej kobiety, udrękę jakby rodzącej po raz pierwszy, głos córki Syjonu, która lamentuje i wyciąga swe ręce, mówiąc: Biada mi teraz, bo moja dusza omdlewa z powodu morderców."
