"Jr40,1":
  text: "Słowo, które doszło od PANA do Jeremiasza, po uwolnieniu go z Rama przez Nebuzaradana, dowódcę gwardii, gdy go zabrał związanego łańcuchami spośród wszystkich więźniów Jerozolimy i Judy, których uprowadzono do Babilonu."
  tags: []
"Jr40,2":
  text: "Dowódca gwardii wziął Jeremiasza i powiedział do niego: PAN, twój Bóg, zapowiedział to nieszczęście przeciwko temu miejscu."
  tags: []
"Jr40,3":
  text: "PAN więc sprowadził je i spełnił, jak powiedział. Zgrzeszyliście bowiem przeciwko PANU i nie słuchaliście jego głosu, dlatego was to spotkało."
  tags: []
"Jr40,4":
  text: "Teraz oto uwalniam cię dziś z tych łańcuchów, które są na twoich rękach. Jeśli uważasz za słuszne pójść ze mną do Babilonu, chodź; ja zatroszczę się o ciebie. A jeśli uważasz za niesłuszne pójść ze mną do Babilonu, zaniechaj tego. Oto cała ziemia jest przed tobą. Gdzie uważasz, że dobrze i słusznie byłoby pójść, tam idź."
  tags: []
"Jr40,5":
  text: "A gdy on jeszcze nie odchodził, powiedział: Udaj się do Gedaliasza, syna Achikama, syna Szafana, którego król Babilonu ustanowił namiestnikiem nad miastami Judy, i zamieszkaj z nim pośród ludu albo idź, gdziekolwiek uważasz za słuszne. I dowódca gwardii dał mu żywność i podarunek i odprawił go."
  tags: []
"Jr40,6":
  text: "Wtedy Jeremiasz udał się do Gedaliasza, syna Achikama, do Mispy, i mieszkał z nim wśród ludu, który pozostał w ziemi."
  tags: []
"Jr40,7":
  text: "A gdy wszyscy dowódcy wojsk, którzy przebywali na polach, oni i ich ludzie, usłyszeli, że król Babilonu ustanowił Gedaliasza, syna Achikama, namiestnikiem w ziemi i że powierzył mu mężczyzn, kobiety, dzieci i ubogich tej ziemi, których nie uprowadzono do Babilonu;"
  tags: []
"Jr40,8":
  text: "Do Gedaliasza do Mispy przyszli: Izmael, syn Netaniasza, Jochanan i Jonatan, synowie Kareacha, Serajasz, syn Tanchumeta, synowie Efaja Netofatyty, oraz Jezaniasz, syn Maachatyty, oni i ich ludzie."
  tags: []
"Jr40,9":
  text: "Wtedy Gedaliasz, syn Achikama, syna Szafana, przysiągł im i ich ludziom: Nie bójcie się służyć Chaldejczykom. Pozostańcie w ziemi i służcie królowi Babilonu, a będzie wam dobrze."
  tags: []
"Jr40,10":
  text: "Oto bowiem mieszkam w Mispie, aby służyć Chaldejczykom, którzy przyjdą do nas; a wy zbierajcie wino, letnie owoce i oliwę, gromadźcie w swoich naczyniach i mieszkajcie w swoich miastach, które zajmujecie."
  tags: []
"Jr40,11":
  text: "Także i wszyscy Żydzi, którzy byli w Moabie, pośród synów Ammona, w Edomie i we wszystkich innych ziemiach, gdy usłyszeli, że król Babilonu pozostawił resztkę z Judy i że ustanowił nad nimi Gedaliasza, syna Achikama, syna Szafana;"
  tags: []
"Jr40,12":
  text: "Wrócili wszyscy ci Żydzi ze wszystkich miejsc, do których zostali wygnani, i przyszli do ziemi Judy, do Gedaliasza do Mispy, i nazbierali bardzo obficie wina i letnich owoców."
  tags: []
"Jr40,13":
  text: "Ale Jochanan, syn Kareacha, i wszyscy dowódcy wojsk, którzy przebywali na polach, przyszli do Gedaliasza do Mispy;"
  tags: []
"Jr40,14":
  text: "I powiedzieli do niego: Czy wiesz o tym, że Baalis, król synów Ammona, posłał Izmaela, syna Netaniasza, aby cię zabić? Ale Gedaliasz, syn Achikama, nie uwierzył im."
  tags: []
"Jr40,15":
  text: "Wtedy Jochanan, syn Kareacha, powiedział potajemnie do Gedaliasza w Mispie: Pozwól mi pójść, proszę, i zabiję Izmaela, syna Netaniasza, a nikt się o tym nie dowie. Dlaczego ma cię zabić, aby zostali rozproszeni wszyscy Żydzi, którzy się zebrali u ciebie, i aby zginęła resztka Judy?"
  tags: []
"Jr40,16":
  text: "Ale Gedaliasz, syn Achikama, odpowiedział Jochananowi, synowi Kareacha: Nie czyń tego, bo to, co mówisz o Izmaelu, jest nieprawdą."
  tags: []
