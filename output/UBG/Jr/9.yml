"Jr9,1":
  text: "Oby moja głowa była wodą, a moje oczy źródłem łez, abym dniem i nocą opłakiwał pomordowanych córki mego ludu!"
  tags: []
"Jr9,2":
  text: "Obym miał na pustyni schronisko dla podróżnych, abym mógł opuścić swój lud i oddalić się od nich! Wszyscy bowiem są cudzołożnikami, zgrają zdrajców;"
  tags: []
"Jr9,3":
  text: "I jak łuk napinają swój język do kłamstwa. Nie wzmocnili się prawdą na ziemi, bo od zła do zła przechodzą, a mnie nie znają, mówi PAN."
  tags: []
"Jr9,4":
  text: "Niech się każdy strzeże swego bliźniego, a bratu nie ufa, bo każdy brat oszukuje podstępnie i każdy bliźni postępuje jak oszczerca."
  tags: []
"Jr9,5":
  text: "Każdy też oszukuje swego bliźniego i nie mówi prawdy. Przyuczyli swój język do mówienia kłamstwa, męczą się, aby popełnić nieprawość."
  tags: []
"Jr9,6":
  text: "Twoje mieszkanie jest pośród ludu podstępnego; z powodu podstępu nie chcą mnie poznać, mówi PAN."
  tags: []
"Jr9,7":
  text: "Dlatego tak mówi PAN zastępów: Oto przetopię ich i wypróbuję; jak bowiem mam postąpić z córką mego ludu?"
  tags: []
"Jr9,8":
  text: "Ich język jest śmiercionośną strzałą, wypowiada oszustwa. Jeden mówi ustami o pokoju ze swym przyjacielem, ale w sercu zastawia na niego sidła."
  tags: []
"Jr9,9":
  text: "Czyż za to nie powinienem ich nawiedzić? – mówi PAN. Czyż nad takim narodem moja dusza nie powinna się zemścić?"
  tags: []
"Jr9,10":
  text: "Z powodu tych gór podniosę płacz i lament, z powodu pastwisk na pustkowiu – pieśń żałobną. Są bowiem spalone tak, że nikt tamtędy nie przechodzi ani odgłosu bydła nie słychać; ptactwo niebieskie i zwierzęta rozbiegły się i odeszły."
  tags: []
"Jr9,11":
  text: "I zamienię Jerozolimę w gruzy, w legowisko smoków, a miasta Judy – w pustkowie, zostaną bez mieszkańca."
  tags: []
"Jr9,12":
  text: "Któż jest tak mądry, aby mógł to zrozumieć? A do kogo mówiły usta PANA, aby mógł ogłosić, dlaczego ziemia ginie i jest spalona jak pustynia, tak że przez nią nikt nie przechodzi?"
  tags: []
"Jr9,13":
  text: "PAN bowiem mówi: Dlatego że porzucili moje prawo, które im przedłożyłem, a nie słuchali mojego głosu ani nie szli za nim;"
  tags: []
"Jr9,14":
  text: "Ale postępowali według uporu swego serca i szli za Baalami, jak ich nauczyli ich ojcowie;"
  tags: []
"Jr9,15":
  text: "Dlatego tak mówi PAN zastępów, Bóg Izraela: Oto nakarmię ich, ten lud, piołunem i napoję ich wodą żółci."
  tags: []
"Jr9,16":
  text: "Rozproszę ich między narodami, których nie znali oni ani ich ojcowie, i poślę za nimi miecz, aż ich doszczętnie wytracę."
  tags: []
"Jr9,17":
  text: "Tak mówi PAN zastępów: Zastanówcie się i wezwijcie płaczki, i niech przyjdą; poślijcie po te, które są wyćwiczone w tym, i niech przyjdą."
  tags: []
"Jr9,18":
  text: "Niech się pospieszą, niech podniosą nad nami lament, aby łzami spływały nam oczy i powieki ociekały wodą."
  tags: []
"Jr9,19":
  text: "Głos lamentu bowiem słychać z Syjonu: Jakże jesteśmy spustoszeni! Jesteśmy bardzo zawstydzeni, bo opuściliśmy ziemię, zburzono nasze mieszkania."
  tags: []
"Jr9,20":
  text: "Słuchajcie więc, kobiety, słowa PANA, niech wasze ucho przyjmie wyrok jego ust, abyście uczyły wasze córki lamentu, a jedna drugą – pieśni żałobnej."
  tags: []
"Jr9,21":
  text: "Śmierć bowiem wtargnęła przez nasze okna, weszła do naszych pałaców, aby wytracić dzieci na rynku i młodzieńców na ulicach."
  tags: []
"Jr9,22":
  text: "Mów: Tak mówi PAN: Nawet trupy ludzkie padną jak gnój na polu i jak snopy za żniwiarzem, a nikt ich nie zbierze."
  tags: []
"Jr9,23":
  text: "Tak mówi PAN: Niech się nie chlubi mądry swoją mądrością, niech się nie chlubi mocarz swoją siłą i niech się nie chlubi bogaty swoim bogactwem;"
  tags: []
"Jr9,24":
  text: "Ale kto chce się chlubić, niech się chlubi tym, że rozumie i zna mnie, wie, że ja jestem PAN, który okazuje miłosierdzie, sąd i sprawiedliwość na ziemi. To bowiem mi się podoba, mówi PAN."
  tags: []
"Jr9,25":
  text: "Oto nadchodzą dni, mówi PAN, w których nawiedzę każdego obrzezanego i nieobrzezanego;"
  tags: []
"Jr9,26":
  text: "Egipt, Judę, Edom, Ammonitów, Moabitów i wszystkich, którzy są w najdalszych zakątkach i mieszkają na pustyni. Wszystkie te narody bowiem są nieobrzezane, a cały dom Izraela ma nieobrzezane serce."
  tags: []
