"Jr15,1": "Wtedy PAN powiedział do mnie: Choćby Mojżesz i Samuel stanęli przede mną, nie miałbym serca do tego ludu. Wypędź ich sprzed mego oblicza i niech idą precz."
"Jr15,2": "A jeśli zapytają: Dokąd pójdziemy? Wtedy im powiesz: Tak mówi PAN: Kto przeznaczony na śmierć, pójdzie na śmierć; kto pod miecz – pod miecz, kto na głód – na głód, a kto na niewolę – w niewolę."
"Jr15,3": "I nawiedzę ich czterema rodzajami kar, mówi PAN: Mieczem, aby zabijał, psami, aby rozszarpywały, ptactwem nieba i zwierzętami ziemi, aby pożerały i niszczyły."
"Jr15,4": "I sprawię, że zostaną wysiedleni do wszystkich królestw ziemi z powodu Manassesa, syna Ezechiasza, króla Judy, za to, co uczynił w Jerozolimie."
"Jr15,5": "Któż bowiem zlituje się nad tobą, Jerozolimo? Któż się użali nad tobą? Któż zboczy z drogi, aby zapytać, jak ci się powodzi?"
"Jr15,6": "Ty mnie opuściłaś, mówi PAN, odwróciłaś się ode mnie. Dlatego wyciągnę na ciebie moją rękę, aby cię wytracić; zmęczyłem się żałowaniem."
"Jr15,7": "Rozwieję ich wiejadłem w bramach tej ziemi, osierocę i wygubię mój lud, bo nie zawrócili ze swoich dróg."
"Jr15,8": "Ich wdów więcej mi się namnożyło niż nadmorskich piasków. Sprowadziłem na nich, na matki młodzieńców, niszczyciela w południe. Sprawię, że nagle napadnie na to miasto, a jego mieszkańcy będą przestraszeni."
"Jr15,9": "Mdleje ta, która urodziła siedmioro, wyzionęła ducha; jeszcze za dnia zaszło jej słońce. Zapłonęła i zawstydziła się. A ich resztkę wydam na pastwę miecza przed ich wrogami, mówi PAN."
"Jr15,10": "Biada mi, moja matko, że urodziłaś mnie, mężczyznę kłótni i sporu na całej ziemi. Nie pożyczyłem im na lichwę ani oni na lichwę mnie nie pożyczali, a jednak każdy mi złorzeczy."
"Jr15,11": "I PAN powiedział: Zapewniam, że będzie dobrze tym, którzy pozostaną. Sprawię, że wróg zatroszczy się o ciebie w czasie utrapienia i ucisku."
"Jr15,12": "Czy zwykłe żelazo pokruszy żelazo z północy i stal?"
"Jr15,13": "Twoje bogactwo, Judo, i twoje skarby wydam na łup, bez opłaty, za wszystkie twoje grzechy we wszystkich twoich granicach."
"Jr15,14": "I sprawię, że pójdziesz ze swymi wrogami do ziemi, której nie znasz. Rozpalił się bowiem ogień mojego gniewu i będzie płonąć nad wami."
"Jr15,15": "Ty mnie znasz, PANIE, wspomnij i wejrzyj na mnie, a pomścij mnie wobec moich prześladowców. Nie porywaj mnie w swojej pobłażliwości wobec nich. Wiedz, że dla ciebie znoszę hańbę."
"Jr15,16": "Gdy się znalazły twoje słowa, zjadłem je, a twoje słowo było dla mnie weselem i radością mego serca. Nazywam się bowiem twoim imieniem, PANIE, Boże zastępów!"
"Jr15,17": "Nie zasiadałem w radzie naśmiewców ani się z nimi nie radowałem; ale zasiadałem samotnie z powodu twojej surowej ręki, bo napełniłeś mnie gniewem."
"Jr15,18": "Czemu mój ból ma trwać wiecznie i moja rana ma być nieuleczalna, i nie chce się goić? Czy masz być dla mnie jak kłamca, jak wody zawodne?"
"Jr15,19": "Dlatego tak mówi PAN: Jeśli zawrócisz, wtedy zawrócę cię, abyś stał przede mną. I jeśli odłączysz to, co cenne, od tego, co nikczemne, będziesz jakby moimi ustami. Niech oni zawrócą do ciebie, ale ty nie zawracaj do nich."
"Jr15,20": "A uczynię cię dla tego ludu warownym murem spiżowym. Będą walczyć przeciwko tobie, ale cię nie przemogą, bo ja jestem z tobą, aby cię wybawić i ocalić, mówi PAN."
"Jr15,21": "Wyrwę cię z rąk niegodziwców i odkupię cię z rąk okrutników."
