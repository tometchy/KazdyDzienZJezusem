"Jr15,1":
  text: "Wtedy PAN powiedział do mnie: Choćby Mojżesz i Samuel stanęli przede mną, nie miałbym serca do tego ludu. Wypędź ich sprzed mego oblicza i niech idą precz."
  tags: []
"Jr15,2":
  text: "A jeśli zapytają: Dokąd pójdziemy? Wtedy im powiesz: Tak mówi PAN: Kto przeznaczony na śmierć, pójdzie na śmierć; kto pod miecz – pod miecz, kto na głód – na głód, a kto na niewolę – w niewolę."
  tags: []
"Jr15,3":
  text: "I nawiedzę ich czterema rodzajami kar, mówi PAN: Mieczem, aby zabijał, psami, aby rozszarpywały, ptactwem nieba i zwierzętami ziemi, aby pożerały i niszczyły."
  tags: []
"Jr15,4":
  text: "I sprawię, że zostaną wysiedleni do wszystkich królestw ziemi z powodu Manassesa, syna Ezechiasza, króla Judy, za to, co uczynił w Jerozolimie."
  tags: []
"Jr15,5":
  text: "Któż bowiem zlituje się nad tobą, Jerozolimo? Któż się użali nad tobą? Któż zboczy z drogi, aby zapytać, jak ci się powodzi?"
  tags: []
"Jr15,6":
  text: "Ty mnie opuściłaś, mówi PAN, odwróciłaś się ode mnie. Dlatego wyciągnę na ciebie moją rękę, aby cię wytracić; zmęczyłem się żałowaniem."
  tags: []
"Jr15,7":
  text: "Rozwieję ich wiejadłem w bramach tej ziemi, osierocę i wygubię mój lud, bo nie zawrócili ze swoich dróg."
  tags: []
"Jr15,8":
  text: "Ich wdów więcej mi się namnożyło niż nadmorskich piasków. Sprowadziłem na nich, na matki młodzieńców, niszczyciela w południe. Sprawię, że nagle napadnie na to miasto, a jego mieszkańcy będą przestraszeni."
  tags: []
"Jr15,9":
  text: "Mdleje ta, która urodziła siedmioro, wyzionęła ducha; jeszcze za dnia zaszło jej słońce. Zapłonęła i zawstydziła się. A ich resztkę wydam na pastwę miecza przed ich wrogami, mówi PAN."
  tags: []
"Jr15,10":
  text: "Biada mi, moja matko, że urodziłaś mnie, mężczyznę kłótni i sporu na całej ziemi. Nie pożyczyłem im na lichwę ani oni na lichwę mnie nie pożyczali, a jednak każdy mi złorzeczy."
  tags: []
"Jr15,11":
  text: "I PAN powiedział: Zapewniam, że będzie dobrze tym, którzy pozostaną. Sprawię, że wróg zatroszczy się o ciebie w czasie utrapienia i ucisku."
  tags: []
"Jr15,12":
  text: "Czy zwykłe żelazo pokruszy żelazo z północy i stal?"
  tags: []
"Jr15,13":
  text: "Twoje bogactwo, Judo, i twoje skarby wydam na łup, bez opłaty, za wszystkie twoje grzechy we wszystkich twoich granicach."
  tags: []
"Jr15,14":
  text: "I sprawię, że pójdziesz ze swymi wrogami do ziemi, której nie znasz. Rozpalił się bowiem ogień mojego gniewu i będzie płonąć nad wami."
  tags: []
"Jr15,15":
  text: "Ty mnie znasz, PANIE, wspomnij i wejrzyj na mnie, a pomścij mnie wobec moich prześladowców. Nie porywaj mnie w swojej pobłażliwości wobec nich. Wiedz, że dla ciebie znoszę hańbę."
  tags: []
"Jr15,16":
  text: "Gdy się znalazły twoje słowa, zjadłem je, a twoje słowo było dla mnie weselem i radością mego serca. Nazywam się bowiem twoim imieniem, PANIE, Boże zastępów!"
  tags: []
"Jr15,17":
  text: "Nie zasiadałem w radzie naśmiewców ani się z nimi nie radowałem; ale zasiadałem samotnie z powodu twojej surowej ręki, bo napełniłeś mnie gniewem."
  tags: []
"Jr15,18":
  text: "Czemu mój ból ma trwać wiecznie i moja rana ma być nieuleczalna, i nie chce się goić? Czy masz być dla mnie jak kłamca, jak wody zawodne?"
  tags: []
"Jr15,19":
  text: "Dlatego tak mówi PAN: Jeśli zawrócisz, wtedy zawrócę cię, abyś stał przede mną. I jeśli odłączysz to, co cenne, od tego, co nikczemne, będziesz jakby moimi ustami. Niech oni zawrócą do ciebie, ale ty nie zawracaj do nich."
  tags: []
"Jr15,20":
  text: "A uczynię cię dla tego ludu warownym murem spiżowym. Będą walczyć przeciwko tobie, ale cię nie przemogą, bo ja jestem z tobą, aby cię wybawić i ocalić, mówi PAN."
  tags: []
"Jr15,21":
  text: "Wyrwę cię z rąk niegodziwców i odkupię cię z rąk okrutników."
  tags: []
