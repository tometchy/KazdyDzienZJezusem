"Jr39,1":
  text: "W dziewiątym roku Sedekiasza, króla Judy, dziesiątego miesiąca, nadciągnął Nabuchodonozor, król Babilonu, z całym swoim wojskiem do Jerozolimy i obległ ją."
  tags: []
"Jr39,2":
  text: "A w jedenastym roku Sedekiasza, czwartego miesiąca, dziewiątego dnia tego miesiąca, zrobiono wyłom w murach miasta."
  tags: []
"Jr39,3":
  text: "I weszli do niego wszyscy książęta króla Babilonu, i zasiedli w Bramie Środkowej: Nergalsarezer, Samgarnebo, Sarsechim, Rabsaris, Nergalsarezer, Rabmag i pozostali książęta króla Babilonu."
  tags: []
"Jr39,4":
  text: "Gdy zobaczył ich Sedekiasz, król Judy, i wszyscy wojownicy, uciekli, wychodząc nocą z miasta drogą ogrodu królewskiego, przez bramę między dwoma murami. I król szedł drogą w stronę równiny."
  tags: []
"Jr39,5":
  text: "Lecz wojsko Chaldejczyków ścigało ich i doścignęło Sedekiasza na równinach Jerycha; pojmali go i przyprowadzili do Nabuchodonozora, króla Babilonu, do Ribla, w ziemi Chamat, gdzie ten wydał na niego wyrok."
  tags: []
"Jr39,6":
  text: "Król Babilonu zabił synów Sedekiasza w Ribla na jego oczach. Król Babilonu zabił również wszystkich dostojników Judy."
  tags: []
"Jr39,7":
  text: "Ale Sedekiaszowi wyłupił oczy i zakuł go w łańcuchy, aby go uprowadzić do Babilonu."
  tags: []
"Jr39,8":
  text: "Chaldejczycy spalili ogniem dom króla i domy ludu, a mury Jerozolimy zburzyli."
  tags: []
"Jr39,9":
  text: "Ale resztę ludu, który pozostał w mieście, i zbiegów, którzy przeszli do niego, oraz pozostałych ludzi Nebuzaradan, dowódca gwardii, uprowadził do niewoli do Babilonu."
  tags: []
"Jr39,10":
  text: "Natomiast ubogich spośród ludu, którzy nic nie mieli, Nebuzaradan, dowódca gwardii, pozostawił w ziemi Judy i dał im równocześnie winnice i pola."
  tags: []
"Jr39,11":
  text: "A co do Jeremiasza Nabuchodonozor, król Babilonu, nakazał Nebuzaradanowi, dowódcy gwardii:"
  tags: []
"Jr39,12":
  text: "Weź go, zajmij się nim i nie czyń mu nic złego, lecz postąp z nim tak, jak on ci powie."
  tags: []
"Jr39,13":
  text: "Posłali więc Nebuzaradan, dowódca gwardii, oraz Nebuszasban, Rabsaris, Nergalsarezer, Rabmag i wszyscy dostojnicy króla Babilonu po niego;"
  tags: []
"Jr39,14":
  text: "Oni wszyscy posłali po Jeremiasza i zabrali go z dziedzińca więzienia, i przekazali Gedaliaszowi, synowi Achikama, syna Szafana, aby go zaprowadził do domu. Zamieszkał więc pośród ludu."
  tags: []
"Jr39,15":
  text: "I słowo PANA doszło do Jeremiasza, gdy ten jeszcze był zamknięty na dziedzińcu więzienia, mówiące:"
  tags: []
"Jr39,16":
  text: "Idź i powiedz Ebedmelekowi, Etiopczykowi: Tak mówi PAN zastępów, Bóg Izraela: Oto spełnię swoje słowa wypowiedziane nad tym miastem ku złemu, a nie ku dobremu, i wypełnią się w owym dniu na twoich oczach."
  tags: []
"Jr39,17":
  text: "Ale ciebie wybawię w tym dniu, mówi PAN, i nie będziesz wydany w ręce mężczyzn, których się boisz."
  tags: []
"Jr39,18":
  text: "Na pewno bowiem cię wybawię i nie padniesz od miecza, ale twoje życie będzie dla ciebie jak zdobycz, gdyż złożyłeś ufność we mnie, mówi PAN."
  tags: []
