"Jr31,1": "W tym czasie, mówi PAN, będę Bogiem wszystkich rodów Izraela, a one będą moim ludem."
"Jr31,2": "Tak mówi PAN: Lud, który ocalał od miecza, znalazł łaskę na pustyni, gdy kroczyłem przed nim, aby dać odpoczynek Izraelowi."
"Jr31,3": "Powiedz: Dawno PAN mi się ukazał, mówiąc: Owszem, umiłowałem cię wieczną miłością, dlatego przyciągam cię swoim miłosierdziem."
"Jr31,4": "Odbuduję cię znowu i będziesz odbudowana, dziewico Izraela! Znowu przyozdobisz się w swe bębenki i wystąpisz wśród tańców pełnych wesela."
"Jr31,5": "Znów będziesz sadziła winnice na górach Samarii; siewcy będą sadzić i spożywać z tego."
"Jr31,6": "Nastanie bowiem dzień, kiedy stróże będą wołać na górze Efraim: Wstańcie, wejdźmy na Syjon do PANA, swego Boga."
"Jr31,7": "Tak bowiem mówi PAN: Śpiewajcie radośnie dla Jakuba i wykrzykujcie przed przodującym wśród narodów. Głoście, wychwalajcie i mówcie: PANIE, wybaw resztkę twego ludu Izraela."
"Jr31,8": "Oto przyprowadzę ich z ziemi północnej i zgromadzę ich z krańców ziemi; wśród nich będą ślepi i chromi, brzemienne i rodzące. Powrócą tu wielką gromadą."
"Jr31,9": "Przyjdą z płaczem i przyprowadzę ich wśród modlitw, a poprowadzę ich nad strumienie wód prostą drogą, na której się nie potkną. Jestem bowiem ojcem dla Izraela, a Efraim jest moim pierworodnym."
"Jr31,10": "Słuchajcie słowa PANA, o narody, głoście je na dalekich wyspach i mówcie: Ten, który rozproszył Izraela, zgromadzi go i będzie go strzec jak pasterz swoich trzód."
"Jr31,11": "PAN bowiem wykupił Jakuba i wybawił go z ręki silniejszego od niego."
"Jr31,12": "Przyjdą więc i będą śpiewać na wyżynie Syjonu, i zbiegną się do dobroci PANA za zboże, za wino i za oliwę, za jagnięta i za cielęta, a ich dusza będzie jak nawodniony ogród i już nie będą się smucić."
"Jr31,13": "Wtedy dziewica będzie radować się wśród pląsów, także młodzieńcy i starcy razem. Zamienię bowiem ich żałobę w radość, pocieszę ich i rozraduję po ich smutku."
"Jr31,14": "I nasycę duszę ich kapłanów tłuszczem, a mój lud nasyci się moją dobrocią, mówi PAN."
"Jr31,15": "Tak mówi PAN: W Rama słychać głos, lament i gorzki płacz: Rachel opłakuje swoich synów, nie daje się pocieszyć po stracie swoich synów, bo ich już nie ma."
"Jr31,16": "Tak mówi PAN: Powstrzymaj swój głos od płaczu, a swe oczy od łez, bo otrzymasz zapłatę za swoją pracę, mówi PAN. Powrócą z ziemi wroga."
"Jr31,17": "Jest nadzieja na twój kres – mówi PAN – twoi synowie powrócą do swojej krainy."
"Jr31,18": "Zaprawdę, usłyszałem jak Efraim się użala: Karciłeś mnie i poniosłem karę jak nieokiełznane cielę. Nawróć mnie, a będę nawrócony, bo ty jesteś PANEM, moim Bogiem."
"Jr31,19": "Bo po moim nawróceniu pokutowałem; gdy poznałem samego siebie, uderzyłem się w biodro; wstydzę się i rumienię, gdyż noszę hańbę swej młodości."
"Jr31,20": "Czyż Efraim nie jest moim drogim synem? Czyż nie jest rozkoszny? Ilekroć bowiem mówię przeciwko niemu, nieustannie go wspominam. Dlatego wzrusza się moje wnętrze z jego powodu; na pewno zlituję się nad nim, mówi PAN."
"Jr31,21": "Postaw sobie drogowskazy, połóż sobie stosy kamieni. Zwróć swoje serce na gościniec, na drogę, którą chodziłaś. Powróć, dziewico Izraela! Powróć do tych swoich miast."
"Jr31,22": "Jak długo będziesz się błąkać, córko uparta? PAN bowiem stworzył nową rzecz na ziemi: kobieta ogarnie mężczyznę."
"Jr31,23": "Tak mówi PAN zastępów, Bóg Izraela: Jeszcze będą mówić to słowo w ziemi Judy i w jej miastach, gdy odwrócę ich niewolę: Niech PAN cię błogosławi, mieszkanie sprawiedliwości, góro świętości!"
"Jr31,24": "Zamieszkają bowiem w ziemi Judy i we wszystkich jego miastach razem rolnicy i ci, którzy chodzą za stadem."
"Jr31,25": "Napoiłem spragnioną duszę i nasyciłem wszelką smutną duszę."
"Jr31,26": "Wtedy się obudziłem i spojrzałem, a mój sen był dla mnie przyjemny."
"Jr31,27": "Oto nadchodzą dni, mówi PAN, w których zasieję dom Izraela i dom Judy nasieniem ludzi i nasieniem zwierząt."
"Jr31,28": "A jak się starałem ich wykorzeniać, burzyć, obalać, niszczyć i trapić, tak będę nad nimi czuwał, by ich budować i sadzić, mówi PAN."
"Jr31,29": "W tych dniach już nie będą mówić: Ojcowie jedli cierpkie winogrona, a synom ścierpły zęby;"
"Jr31,30": "Lecz każdy umrze za swoją nieprawość. Każdemu człowiekowi, który zje cierpkie winogrona, ścierpną zęby."
"Jr31,31": "Oto nadchodzą dni, mówi PAN, kiedy zawrę z domem Izraela i z domem Judy nowe przymierze;"
"Jr31,32": "Nie takie przymierze, jakie zawarłem z ich ojcami w dniu, kiedy ująłem ich za rękę, aby ich wyprowadzić z ziemi Egiptu. Oni bowiem złamali moje przymierze, chociaż ja byłem ich mężem, mówi PAN."
"Jr31,33": "Ale takie będzie przymierze, które zawrę z domem Izraela po tych dniach, mówi PAN: Włożę moje prawo w ich wnętrze i wypiszę je na ich sercach. I będę ich Bogiem, a oni będą moim ludem."
"Jr31,34": "I nikt nie będzie już uczył swego bliźniego ani nikt swego brata, mówiąc: Poznaj PANA, bo wszyscy będą mnie znali, od najmniejszego aż do największego z nich, mówi PAN. Przebaczę bowiem ich nieprawość, a ich grzechów nigdy więcej nie wspomnę."
"Jr31,35": "Tak mówi PAN, który daje słońce na światłość w dzień, prawa księżyca i gwiazd na światłość w nocy; który rozdziela morze tak, że huczą jego fale; PAN zastępów – to jego imię."
"Jr31,36": "Gdyby te prawa ustały przede mną, mówi PAN, wtedy i potomstwo Izraela przestanie być narodem przede mną na wieki."
"Jr31,37": "Tak mówi PAN: Jeśli można zmierzyć niebiosa w górze i zbadać fundamenty ziemi w dole, wtedy i ja odrzucę całe potomstwo Izraela za to wszystko, co uczynili, mówi PAN."
"Jr31,38": "Oto nadchodzą dni, mówi PAN, w których to miasto zostanie odbudowane PANU od Wieży Chananeela aż do Bramy Narożnej;"
"Jr31,39": "I będzie się ciągnął dalej sznur mierniczy na wprost ku wzgórzu Gareb, a potem zwróci się ku Goa."
"Jr31,40": "I cała dolina trupów i popiołu, wszystkie pola aż do potoku Cedron i narożnika Bramy Końskiej ku wschodowi będą poświęcone PANU. Nie zostaną już wykorzenione ani zburzone na wieki."
