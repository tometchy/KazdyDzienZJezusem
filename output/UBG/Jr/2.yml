"Jr2,1": "I doszło do mnie słowo PANA mówiące:"
"Jr2,2": "Idź i wołaj do uszu Jerozolimy tymi słowy: Tak mówi PAN: Wspominam cię, życzliwość twojej młodości i miłość twojego narzeczeństwa, gdy chodziłaś za mną na pustyni, w ziemi nieobsiewanej."
"Jr2,3": "Izrael był świętością dla PANA i pierwocinami jego plonu. Wszyscy, którzy go pożerali, ściągali na siebie winę, spadało na nich nieszczęście, mówi PAN."
"Jr2,4": "Słuchajcie słowa PANA, domu Jakuba, i wszystkie rody domu Izraela!"
"Jr2,5": "Tak mówi PAN: Jaką nieprawość znaleźli we mnie wasi ojcowie, że oddalili się ode mnie, poszli za marnością i stali się próżni?"
"Jr2,6": "I nie pytali: Gdzie jest PAN, który nas wyprowadził z ziemi Egiptu, który nas prowadził przez pustkowie, przez ziemię pustą i pełną rozpadlin, przez ziemię suszy i cienia śmierci, przez ziemię, po której nikt nie chodził i gdzie żaden człowiek nie mieszkał?"
"Jr2,7": "Ja was wprowadziłem do ziemi obfitej, abyście spożywali jej owoce i dobra, lecz gdy weszliście, splugawiliście moją ziemię i moje dziedzictwo uczyniliście obrzydliwością."
"Jr2,8": "Kapłani nie pytali: Gdzie jest PAN? Ci, którzy zajmowali się prawem, nie poznali mnie. Pasterze odstąpili ode mnie i prorocy prorokowali przez Baala, i chodzili za bezużytecznymi rzeczami."
"Jr2,9": "Dlatego będę wiódł spór z wami, mówi PAN, i z synami waszych synów będę się spierać."
"Jr2,10": "Przejdźcie bowiem na wyspy Kittim i zobaczcie; poślijcie do Kedaru i rozważcie dokładnie, przypatrzcie się, czy zdarzyło się coś podobnego:"
"Jr2,11": "Czy jakiś naród zmienił swoich bogów, choć ci nie są bogami? Ale mój lud zamienił swoją chwałę na to, co jest nieużyteczne."
"Jr2,12": "Zdumiejcie się nad tym, niebiosa, ulęknijcie i bardzo się zatrwóżcie, mówi PAN;"
"Jr2,13": "Bo mój lud popełnił podwójne zło: opuścił mnie, źródło żywych wód, i wykopał sobie cysterny, cysterny popękane, które nie mogą utrzymać wody."
"Jr2,14": "Czy Izrael jest sługą lub niewolnikiem z urodzenia? Czemu więc stał się łupem?"
"Jr2,15": "Lwięta ryczą na niego i wydają swój głos, i zamieniają jego ziemię w pustynię; jego miasta są spalone, pozbawione mieszkańców."
"Jr2,16": "Ponadto synowie Nof i Tachpanes starli czubek twojej głowy."
"Jr2,17": "Czy nie sprawiłeś tego sam sobie, opuszczając PANA, swego Boga, kiedy prowadził cię drogą?"
"Jr2,18": "A teraz, po co ci drogi Egiptu – by pić wodę z Nilu? Albo po co ci drogi Asyrii – by pić wodę z jej rzeki?"
"Jr2,19": "Twoja niegodziwość ukarze cię i twoje odstępstwo cię skarci. Dlatego poznaj i zobacz, że rzeczą złą i gorzką jest to, że opuściłeś PANA, swego Boga, i że nie ma w tobie mojej bojaźni, mówi Pan, BÓG zastępów."
"Jr2,20": "Dawno bowiem złamałem twoje jarzmo i rozerwałem twoje więzy, i mówiłaś: Nie będę służyła bożkom; a przecież tułałaś się na każdym wysokim pagórku i pod każdym zielonym drzewem jak nierządnica!"
"Jr2,21": "A ja cię zasadziłem jako wyborną winorośl, nasienie zupełnie prawdziwe. Jakże więc zmieniłaś mi się w zwyrodniałe pędy dzikiej winorośli?"
"Jr2,22": "Bo choćbyś mocno się obmyła, i saletrą, i mydłem, to jednak twoja nieprawość pozostanie widoczna przede mną, mówi Pan BÓG."
"Jr2,23": "Jak możesz mówić: Nie jestem splugawiona, za Baalami nie chodziłam? Spójrz na swą drogę w tej dolinie, zobacz, co uczyniłaś, chyża wielbłądzico wikłająca swoje drogi;"
"Jr2,24": "Dzika oślico, przywykła do pustyni, która łapczywie chwytasz powietrze w swej namiętności. Któż powstrzyma jej żądzę? Wszyscy, którzy jej szukają, nie będą się trudzić, znajdą ją w jej miesiącu."
"Jr2,25": "Uważaj na swoją nogę, aby nie była bosa, i swoje gardło – by nie pragnęło. Lecz ty mówisz: Na próżno; nie uczynię tego, bo rozkochałam się w obcych i pójdę za nimi."
"Jr2,26": "Jak złodziej wstydzi się, kiedy go schwytają, tak wstydzi się dom Izraela, jego królowie i książęta, jego kapłani i prorocy;"
"Jr2,27": "Którzy mówią do drewna: Ty jesteś moim ojcem, a do kamienia: Ty mnie zrodziłeś. Obrócili się bowiem do mnie plecami, a nie twarzą. Ale w czasie swojej niedoli powiedzą: Powstań i wybaw nas!"
"Jr2,28": "A gdzie są twoi bogowie, których sobie uczyniłaś? Niech powstaną, jeśli cię mogą wybawić w czasie twojej niedoli, bo ile twoich miast, tyle jest twoich bogów, Judo!"
"Jr2,29": "Czemu chcecie się ze mną spierać? Wy wszyscy odstąpiliście ode mnie, mówi PAN."
"Jr2,30": "Na próżno biłem waszych synów, nie przyjęli pouczenia. Wasz własny miecz pożarł waszych proroków, jak niszczący lew."
"Jr2,31": "Pokolenie, rozważaj słowa PANA. Czy byłem pustynią dla Izraela albo ziemią ciemności? Czemu mój lud mówi: My panujemy, już nie przyjdziemy do ciebie?"
"Jr2,32": "Czy panna zapomina o swoich ozdobach albo oblubienica o swoich klejnotach? Ale mój lud zapomniał o mnie od dni niezliczonych."
"Jr2,33": "Czemu przyozdabiasz swoją drogę w poszukiwaniu miłości? Przecież nauczyłaś inne nierządnice swoich złych dróg."
"Jr2,34": "Ponadto na brzegach twoich szat znajduje się krew dusz ubogich i niewinnych. Nie znalazłem tego z trudnością, lecz widać na wszystkich twoich brzegach."
"Jr2,35": "Lecz mówisz: Ponieważ jestem niewinna, na pewno jego gniew odwróci się ode mnie. Oto będę cię sądził za to, że mówisz: Nie zgrzeszyłam."
"Jr2,36": "Czemu tak ganiasz, zmieniając swoje drogi? Będziesz pohańbiona przez Egipt, jak byłaś pohańbiona przez Asyrię."
"Jr2,37": "I stamtąd wyjdziesz z rękami na głowie, bo PAN odrzucił tych, którym zaufałaś, a nie powiedzie ci się z nimi."
