"Jr11,1":
  text: "Słowo, które doszło do Jeremiasza od PANA, mówiące:"
  tags: []
"Jr11,2":
  text: "Słuchajcie słów tego przymierza i mówcie do mężczyzn Judy i do mieszkańców Jerozolimy;"
  tags: []
"Jr11,3":
  text: "Powiedz do nich: Tak mówi PAN, Bóg Izraela: Przeklęty ten człowiek, który nie posłucha słów tego przymierza;"
  tags: []
"Jr11,4":
  text: "Które nakazałem waszym ojcom w dniu, kiedy wyprowadziłem ich z ziemi Egiptu, z pieca do topienia żelaza, mówiąc: Słuchajcie mojego głosu i czyńcie to wszystko, co wam nakazuję; i będziecie moim ludem, a ja będę waszym Bogiem;"
  tags: []
"Jr11,5":
  text: "Abym mógł wypełnić przysięgę, którą złożyłem waszym ojcom, że dam im ziemię opływającą mlekiem i miodem, jak to jest dzisiaj. A ja odpowiedziałem: Amen, PANIE!"
  tags: []
"Jr11,6":
  text: "I PAN powiedział do mnie: Głoś wszystkie te słowa w miastach Judy i po ulicach Jerozolimy, mówiąc: Słuchajcie słów tego przymierza i wypełniajcie je."
  tags: []
"Jr11,7":
  text: "Usilnie bowiem ostrzegałem waszych ojców od dnia, kiedy wyprowadziłem ich z ziemi Egiptu, aż do dziś, z wczesnym wstawaniem i ostrzeganiem, mówiąc: Słuchajcie mego głosu."
  tags: []
"Jr11,8":
  text: "Oni jednak nie usłuchali ani nie nakłonili swego ucha, ale każdy postępował według uporu swego złego serca. Dlatego sprowadziłem na nich wszystkie słowa tego przymierza, które nakazałem im wypełniać, a nie wypełnili."
  tags: []
"Jr11,9":
  text: "I PAN powiedział do mnie: Znalazł się spisek wśród mężczyzn Judy i mieszkańców Jerozolimy."
  tags: []
"Jr11,10":
  text: "Wrócili do nieprawości swoich przodków, którzy nie chcieli słuchać moich słów; poszli i oni za innymi bogami, aby im służyć. Dom Izraela i dom Judy złamały moje przymierze, które zawarłem z ich ojcami."
  tags: []
"Jr11,11":
  text: "Dlatego tak mówi PAN: Oto sprowadzę na nich nieszczęście, z którego nie będą mogli się wydostać; a choćby wołali do mnie, nie wysłucham ich."
  tags: []
"Jr11,12":
  text: "I pójdą miasta Judy i mieszkańcy Jerozolimy i będą wołać do bogów, którym palą kadzidło, lecz oni wcale ich nie wybawią w czasie ich utrapienia."
  tags: []
"Jr11,13":
  text: "Ile bowiem jest twoich miast, tylu twoich bogów, Judo! Ile ulic w Jerozolimie, tyle wznieśliście ołtarzy obrzydliwości, ołtarzy do palenia kadzidła Baalowi."
  tags: []
"Jr11,14":
  text: "Dlatego ty się nie módl za ten lud i nie zanoś za niego wołania ani modlitwy, bo ja go nie wysłucham, gdy do mnie będzie wołać w czasie swego utrapienia."
  tags: []
"Jr11,15":
  text: "Cóż chce moja umiłowana w moim domu, skoro bez wstydu dopuściła się sprośności z wieloma, a ofiary święte odeszły od ciebie? Radujesz się, gdy czynisz zło."
  tags: []
"Jr11,16":
  text: "PAN nazwał cię zielonym drzewem oliwnym, pięknym, dającym piękny owoc, ale wśród huku wielkiej burzy rozpalił nad nim ogień, połamane są jego gałęzie."
  tags: []
"Jr11,17":
  text: "PAN zastępów bowiem, który cię zasadził, zapowiedział przeciwko tobie to nieszczęście z powodu niegodziwości domu Izraela i domu Judy, którą popełniły na własną szkodę, aby mnie pobudzać do gniewu, paląc kadzidło Baalowi."
  tags: []
"Jr11,18":
  text: "A PAN oznajmił mi to i zrozumiałem; wtedy ukazałeś mi ich uczynki."
  tags: []
"Jr11,19":
  text: "Ja zaś byłem jak baranek i wół prowadzony na rzeź, bo nie wiedziałem, że przeciwko mnie knuli zamysły, mówiąc: Zniszczmy drzewo wraz z jego owocem i wykorzeńmy go z ziemi żyjących, aby jego imię już nie było wspominane."
  tags: []
"Jr11,20":
  text: "Lecz, PANIE zastępów, który sądzisz sprawiedliwie i badasz nerki i serca, niech zobaczę twoją pomstę nad nimi. Wyjawiłem ci bowiem swoją sprawę."
  tags: []
"Jr11,21":
  text: "Dlatego tak mówi PAN o mężczyznach z Anatot, którzy nastają na twoje życie i mówią: Nie prorokuj w imię PANA, abyś nie zginął z naszej ręki."
  tags: []
"Jr11,22":
  text: "Dlatego tak mówi PAN zastępów: Oto nawiedzę ich; ich młodzieńcy zginą od miecza, ich synowie i córki umrą z głodu."
  tags: []
"Jr11,23":
  text: "I nikt z nich nie zostanie, bo sprowadzę nieszczęście na ludzi z Anatot w roku ich nawiedzenia."
  tags: []
