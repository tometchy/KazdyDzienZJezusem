"Jr49,1": "O Ammonitach tak mówi PAN: Czyż Izrael nie ma synów? Czyż nie ma żadnego dziedzica? Czemu ich król dziedzicznie opanował Gad, a jego lud mieszka w jego miastach?"
"Jr49,2": "Dlatego oto nadchodzą dni, mówi PAN, gdy sprawię, że usłyszą okrzyk wojenny w Rabbie synów Ammona i stanie się ona rumowiskiem, a inne jej miasta będą spalone ogniem. Wtedy Izrael posiądzie swoich dzierżawców, mówi PAN."
"Jr49,3": "Zawódź, Cheszbonie, bo Aj jest spustoszone. Krzyczcie, córki Rabby, przepaszcie się worami, lamentujcie i biegajcie wśród płotów, bo wasz król pójdzie do niewoli wraz ze swoimi kapłanami i książętami."
"Jr49,4": "Czemu się chlubisz dolinami? Twoja dolina spłynęła, córko buntownicza, która ufasz swym skarbom, mówiąc: Któż nadciągnie przeciwko mnie?"
"Jr49,5": "Oto sprowadzę na ciebie strach, mówi Pan BÓG zastępów, od wszystkich, którzy są dokoła ciebie; będziecie wygnani każdy osobno, a nikt nie pozbiera tułaczy."
"Jr49,6": "Potem jednak odwrócę niewolę synów Ammona, mówi PAN."
"Jr49,7": "O Edomie tak mówi PAN zastępów: Czyż nie ma już mądrości w Temanie? Czyż zginęła rada od roztropnych i obróciła się wniwecz ich mądrość?"
"Jr49,8": "Uciekajcie, zawracajcie, ukryjcie się w głębokich kryjówkach, mieszkańcy Dedanu, bo sprowadzę na niego klęskę Ezawa, w czasie gdy go nawiedzę."
"Jr49,9": "Gdyby zbieracze przyszli do ciebie, czy nie zostawiliby jakichś winogron? Gdyby się wkradli złodzieje w nocy, szkodziliby dotąd, aż mieliby dość."
"Jr49,10": "Lecz ja obnażę Ezawa, odkryję jego kryjówki, tak że nie będzie mógł się ukryć. Zniszczone jest jego potomstwo, jego bracia i jego sąsiedzi, i nie będzie go."
"Jr49,11": "Zostaw swoje sieroty, ja będę je żywić, a twoje wdowy niech mi zaufają."
"Jr49,12": "Tak bowiem mówi PAN: Oto ci, którzy nie byli skazani na picie z tego kielicha, musieli pić z niego, a ty miałbyś ujść z tego bezkarnie? Nie ujdziesz, ale na pewno będziesz pił."
"Jr49,13": "Przysięgam bowiem na siebie samego, mówi PAN, że Bosra stanie się spustoszeniem, hańbą, ruiną i przekleństwem, a wszystkie jej miasta będą ruiną na wieki."
"Jr49,14": "Usłyszałem wieść od PANA, że do narodów wysłany jest poseł mówiący: Zgromadźcie się, wyruszcie przeciw niej, powstańcie do bitwy."
"Jr49,15": "Oto bowiem sprawię, że będziesz mały wśród narodów i wzgardzony między ludźmi."
"Jr49,16": "Zdradziła cię twoja zuchwałość i pycha twego serca, ty, który mieszkasz w rozpadlinach skalnych, który trzymasz się wysokich pagórków. Choćbyś założył swoje gniazdo wysoko jak orzeł, nawet stamtąd cię strącę, mówi PAN."
"Jr49,17": "Edom będzie spustoszeniem, ktokolwiek będzie przechodził obok niego, zdumieje się i będzie świstać nad wszystkimi jego plagami."
"Jr49,18": "Jak po zniszczeniu Sodomy i Gomory oraz miast sąsiednich, mówi PAN, nikt tam nie zamieszka i żaden syn człowieka nie będzie w nim gościł."
"Jr49,19": "Oto jak lew wystąpi z wezbrania Jordanu przeciwko przybytkowi mocarza. Wypędzę go jednak nagle z tej ziemi, a ustanowię nad nią mojego wybrańca. Któż bowiem jest mi równy? Kto wyznaczy mi termin rozprawy? A kto jest tym pasterzem, który się ostoi przede mną?"
"Jr49,20": "Dlatego słuchajcie postanowienia PANA, które powziął przeciwko Edomowi, i jego zamysłów, które przygotował przeciwko mieszkańcom Temanu: Zaprawdę, wywloką ich najmniejsi z tej trzody, spustoszą ich i ich mieszkania."
"Jr49,21": "Od grzmotu ich upadku ziemia się porusza, głos ich krzyku słychać nad Morzem Czerwonym."
"Jr49,22": "Oto jak orzeł wzbije się i przyleci, i rozciągnie swoje skrzydła nad Bosrą. W tym dniu serce mocarzy Edomu stanie się jak serce rodzącej kobiety."
"Jr49,23": "O Damaszku. Wstydzą się Chamat i Arpad, bo usłyszały złą wieść. Zatrwożyły się tak, że nawet morze się wzruszy, a nie będzie mogło się uspokoić."
"Jr49,24": "Osłabł Damaszek i rzuca się do ucieczki, strach go ogarnął. Udręka i bóle ogarnęły go jak rodzącą kobietę."
"Jr49,25": "Ale powiedzą: Jakże się nie miało ostać miasto sławne, miasto mej radości?"
"Jr49,26": "Dlatego jego młodzieńcy upadną na jego ulicach, a wszyscy waleczni wojownicy w tym dniu zostaną wytraceni, mówi PAN zastępów."
"Jr49,27": "I wzniecę ogień w murze Damaszku, który strawi pałace Ben-Hadada."
"Jr49,28": "O Kedarze i królestwach Chasoru, które ma pobić Nabuchodonozor, król Babilonu, tak mówi PAN: Wstańcie, wyruszcie na Kedar i spustoszcie narody wschodnie."
"Jr49,29": "Zabiorą ich namioty i trzody, wezmą ze sobą ich zasłony, wszystkie ich sprzęty oraz ich wielbłądy. I zawołają na nich: Strach dokoła."
"Jr49,30": "Uciekajcie, rozbiegnijcie się prędko, ukryjcie się w głębokich kryjówkach, mieszkańcy Chasoru, mówi PAN. Radził się bowiem przeciwko wam Nabuchodonozor, król Babilonu, i obmyślił przeciwko wam zdradę."
"Jr49,31": "Wstańcie, ruszajcie na naród spokojny, mieszkający bezpiecznie, mówi PAN, nie ma ani wrót, ani rygli, mieszka samotnie."
"Jr49,32": "Ich wielbłądy będą łupem, a liczne ich stada – zdobyczą. Rozproszę na wszystkie wiatry tych, którzy mieszkają w najdalszych zakątkach, i sprowadzę na nich klęskę ze wszystkich stron, mówi PAN."
"Jr49,33": "Chasor stanie się siedliskiem smoków, pustkowiem na wieki. Nikt tam nie zamieszka i żaden syn człowieka nie będzie w nim gościł."
"Jr49,34": "Słowo PANA, które doszło do proroka Jeremiasza przeciwko Elamowi na początku królowania Sedekiasza, króla Judy, mówiące:"
"Jr49,35": "Tak mówi PAN zastępów: Oto złamię łuk Elamu, podstawę jego potęgi;"
"Jr49,36": "I sprowadzę na Elam cztery wiatry z czterech stron świata, i rozproszę go na wszystkie te wiatry tak, że nie będzie narodu, do którego by nie przyszli wygnańcy Elamu."
"Jr49,37": "I napełnię Elam trwogą przed jego wrogami i przed tymi, którzy czyhają na jego życie. Sprowadzę na nich nieszczęście, zapalczywość mego gniewu, mówi PAN, i poślę też za nimi miecz, aż ich wyniszczę."
"Jr49,38": "I ustawię swój tron w Elamie i stamtąd wytępię króla i książąt, mówi PAN."
"Jr49,39": "Stanie się jednak w ostatecznych dniach, że odwrócę niewolę Elamu, mówi PAN."
