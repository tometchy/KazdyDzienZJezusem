"Jr49,1":
  text: "O Ammonitach tak mówi PAN: Czyż Izrael nie ma synów? Czyż nie ma żadnego dziedzica? Czemu ich król dziedzicznie opanował Gad, a jego lud mieszka w jego miastach?"
  tags: []
"Jr49,2":
  text: "Dlatego oto nadchodzą dni, mówi PAN, gdy sprawię, że usłyszą okrzyk wojenny w Rabbie synów Ammona i stanie się ona rumowiskiem, a inne jej miasta będą spalone ogniem. Wtedy Izrael posiądzie swoich dzierżawców, mówi PAN."
  tags: []
"Jr49,3":
  text: "Zawódź, Cheszbonie, bo Aj jest spustoszone. Krzyczcie, córki Rabby, przepaszcie się worami, lamentujcie i biegajcie wśród płotów, bo wasz król pójdzie do niewoli wraz ze swoimi kapłanami i książętami."
  tags: []
"Jr49,4":
  text: "Czemu się chlubisz dolinami? Twoja dolina spłynęła, córko buntownicza, która ufasz swym skarbom, mówiąc: Któż nadciągnie przeciwko mnie?"
  tags: []
"Jr49,5":
  text: "Oto sprowadzę na ciebie strach, mówi Pan BÓG zastępów, od wszystkich, którzy są dokoła ciebie; będziecie wygnani każdy osobno, a nikt nie pozbiera tułaczy."
  tags: []
"Jr49,6":
  text: "Potem jednak odwrócę niewolę synów Ammona, mówi PAN."
  tags: []
"Jr49,7":
  text: "O Edomie tak mówi PAN zastępów: Czyż nie ma już mądrości w Temanie? Czyż zginęła rada od roztropnych i obróciła się wniwecz ich mądrość?"
  tags: []
"Jr49,8":
  text: "Uciekajcie, zawracajcie, ukryjcie się w głębokich kryjówkach, mieszkańcy Dedanu, bo sprowadzę na niego klęskę Ezawa, w czasie gdy go nawiedzę."
  tags: []
"Jr49,9":
  text: "Gdyby zbieracze przyszli do ciebie, czy nie zostawiliby jakichś winogron? Gdyby się wkradli złodzieje w nocy, szkodziliby dotąd, aż mieliby dość."
  tags: []
"Jr49,10":
  text: "Lecz ja obnażę Ezawa, odkryję jego kryjówki, tak że nie będzie mógł się ukryć. Zniszczone jest jego potomstwo, jego bracia i jego sąsiedzi, i nie będzie go."
  tags: []
"Jr49,11":
  text: "Zostaw swoje sieroty, ja będę je żywić, a twoje wdowy niech mi zaufają."
  tags: []
"Jr49,12":
  text: "Tak bowiem mówi PAN: Oto ci, którzy nie byli skazani na picie z tego kielicha, musieli pić z niego, a ty miałbyś ujść z tego bezkarnie? Nie ujdziesz, ale na pewno będziesz pił."
  tags: []
"Jr49,13":
  text: "Przysięgam bowiem na siebie samego, mówi PAN, że Bosra stanie się spustoszeniem, hańbą, ruiną i przekleństwem, a wszystkie jej miasta będą ruiną na wieki."
  tags: []
"Jr49,14":
  text: "Usłyszałem wieść od PANA, że do narodów wysłany jest poseł mówiący: Zgromadźcie się, wyruszcie przeciw niej, powstańcie do bitwy."
  tags: []
"Jr49,15":
  text: "Oto bowiem sprawię, że będziesz mały wśród narodów i wzgardzony między ludźmi."
  tags: []
"Jr49,16":
  text: "Zdradziła cię twoja zuchwałość i pycha twego serca, ty, który mieszkasz w rozpadlinach skalnych, który trzymasz się wysokich pagórków. Choćbyś założył swoje gniazdo wysoko jak orzeł, nawet stamtąd cię strącę, mówi PAN."
  tags: []
"Jr49,17":
  text: "Edom będzie spustoszeniem, ktokolwiek będzie przechodził obok niego, zdumieje się i będzie świstać nad wszystkimi jego plagami."
  tags: []
"Jr49,18":
  text: "Jak po zniszczeniu Sodomy i Gomory oraz miast sąsiednich, mówi PAN, nikt tam nie zamieszka i żaden syn człowieka nie będzie w nim gościł."
  tags: []
"Jr49,19":
  text: "Oto jak lew wystąpi z wezbrania Jordanu przeciwko przybytkowi mocarza. Wypędzę go jednak nagle z tej ziemi, a ustanowię nad nią mojego wybrańca. Któż bowiem jest mi równy? Kto wyznaczy mi termin rozprawy? A kto jest tym pasterzem, który się ostoi przede mną?"
  tags: []
"Jr49,20":
  text: "Dlatego słuchajcie postanowienia PANA, które powziął przeciwko Edomowi, i jego zamysłów, które przygotował przeciwko mieszkańcom Temanu: Zaprawdę, wywloką ich najmniejsi z tej trzody, spustoszą ich i ich mieszkania."
  tags: []
"Jr49,21":
  text: "Od grzmotu ich upadku ziemia się porusza, głos ich krzyku słychać nad Morzem Czerwonym."
  tags: []
"Jr49,22":
  text: "Oto jak orzeł wzbije się i przyleci, i rozciągnie swoje skrzydła nad Bosrą. W tym dniu serce mocarzy Edomu stanie się jak serce rodzącej kobiety."
  tags: []
"Jr49,23":
  text: "O Damaszku. Wstydzą się Chamat i Arpad, bo usłyszały złą wieść. Zatrwożyły się tak, że nawet morze się wzruszy, a nie będzie mogło się uspokoić."
  tags: []
"Jr49,24":
  text: "Osłabł Damaszek i rzuca się do ucieczki, strach go ogarnął. Udręka i bóle ogarnęły go jak rodzącą kobietę."
  tags: []
"Jr49,25":
  text: "Ale powiedzą: Jakże się nie miało ostać miasto sławne, miasto mej radości?"
  tags: []
"Jr49,26":
  text: "Dlatego jego młodzieńcy upadną na jego ulicach, a wszyscy waleczni wojownicy w tym dniu zostaną wytraceni, mówi PAN zastępów."
  tags: []
"Jr49,27":
  text: "I wzniecę ogień w murze Damaszku, który strawi pałace Ben-Hadada."
  tags: []
"Jr49,28":
  text: "O Kedarze i królestwach Chasoru, które ma pobić Nabuchodonozor, król Babilonu, tak mówi PAN: Wstańcie, wyruszcie na Kedar i spustoszcie narody wschodnie."
  tags: []
"Jr49,29":
  text: "Zabiorą ich namioty i trzody, wezmą ze sobą ich zasłony, wszystkie ich sprzęty oraz ich wielbłądy. I zawołają na nich: Strach dokoła."
  tags: []
"Jr49,30":
  text: "Uciekajcie, rozbiegnijcie się prędko, ukryjcie się w głębokich kryjówkach, mieszkańcy Chasoru, mówi PAN. Radził się bowiem przeciwko wam Nabuchodonozor, król Babilonu, i obmyślił przeciwko wam zdradę."
  tags: []
"Jr49,31":
  text: "Wstańcie, ruszajcie na naród spokojny, mieszkający bezpiecznie, mówi PAN, nie ma ani wrót, ani rygli, mieszka samotnie."
  tags: []
"Jr49,32":
  text: "Ich wielbłądy będą łupem, a liczne ich stada – zdobyczą. Rozproszę na wszystkie wiatry tych, którzy mieszkają w najdalszych zakątkach, i sprowadzę na nich klęskę ze wszystkich stron, mówi PAN."
  tags: []
"Jr49,33":
  text: "Chasor stanie się siedliskiem smoków, pustkowiem na wieki. Nikt tam nie zamieszka i żaden syn człowieka nie będzie w nim gościł."
  tags: []
"Jr49,34":
  text: "Słowo PANA, które doszło do proroka Jeremiasza przeciwko Elamowi na początku królowania Sedekiasza, króla Judy, mówiące:"
  tags: []
"Jr49,35":
  text: "Tak mówi PAN zastępów: Oto złamię łuk Elamu, podstawę jego potęgi;"
  tags: []
"Jr49,36":
  text: "I sprowadzę na Elam cztery wiatry z czterech stron świata, i rozproszę go na wszystkie te wiatry tak, że nie będzie narodu, do którego by nie przyszli wygnańcy Elamu."
  tags: []
"Jr49,37":
  text: "I napełnię Elam trwogą przed jego wrogami i przed tymi, którzy czyhają na jego życie. Sprowadzę na nich nieszczęście, zapalczywość mego gniewu, mówi PAN, i poślę też za nimi miecz, aż ich wyniszczę."
  tags: []
"Jr49,38":
  text: "I ustawię swój tron w Elamie i stamtąd wytępię króla i książąt, mówi PAN."
  tags: []
"Jr49,39":
  text: "Stanie się jednak w ostatecznych dniach, że odwrócę niewolę Elamu, mówi PAN."
  tags: []
