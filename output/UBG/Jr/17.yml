"Jr17,1": "Grzech Judy jest zapisany żelaznym rylcem, ostrzem diamentu jest wyryty na tablicy ich serca i na rogach waszych ołtarzy;"
"Jr17,2": "Gdy ich synowie wspominają ich ołtarze i gaje pod drzewami zielonymi, na wysokich pagórkach."
"Jr17,3": "Moja góro na polu! Twoje bogactwo i wszystkie twoje skarby wydam na łup z powodu grzechu twoich wyżyn we wszystkich twoich granicach."
"Jr17,4": "A ty opuścisz swoje dziedzictwo, które ci dałem. I sprawię, że będziesz służył swoim wrogom w ziemi, której nie znasz, bo rozpaliliście ogień mojej zapalczywości, który będzie płonąć na wieki."
"Jr17,5": "Tak mówi PAN: Przeklęty człowiek, który ufa człowiekowi i który czyni ciało swoim ramieniem, a od PANA odstępuje jego serce."
"Jr17,6": "Będzie bowiem jak wrzos na pustyni, który nie czuje, gdy przychodzi coś dobrego, ale wybiera suche miejsca na pustyni, w ziemi słonej i bezludnej."
"Jr17,7": "Błogosławiony człowiek, który ufa PANU, a którego nadzieją jest PAN."
"Jr17,8": "Będzie bowiem jak drzewo zasadzone nad wodami, które swoje korzenie zapuszcza nad strumieniem i nie zauważa, gdy upał przychodzi, ale jego liść pozostaje zielony. W roku suszy nie troszczy się i nie przestaje przynosić owocu."
"Jr17,9": "Najzdradliwsze ponad wszystko jest serce i najbardziej przewrotne. Któż zdoła je poznać?"
"Jr17,10": "Ja, PAN, badam serca i doświadczam nerki, aby oddać każdemu według jego dróg i według owocu jego uczynków."
"Jr17,11": "Jak kuropatwa gromadzi swoje jajka, ale ich nie wysiaduje, tak kto zbiera bogactwa niesprawiedliwie, zostawi je w połowie swoich dni, a u swego kresu okaże się głupcem;"
"Jr17,12": "Wzniosłym tronem chwały od początku jest miejsce naszej świątyni."
"Jr17,13": "PANIE, nadziejo Izraela! Wszyscy, którzy cię opuszczają, będą zawstydzeni; ci, którzy odstępują ode mnie, będą zapisani na ziemi, gdyż opuścili PANA, źródło żywych wód."
"Jr17,14": "Uzdrów mnie, PANIE, a będę uzdrowiony; zbaw mnie, a będę zbawiony. Ty bowiem jesteś moją chwałą."
"Jr17,15": "Oto oni mówią do mnie: Gdzie jest słowo PANA? Niech się już spełni!"
"Jr17,16": "Ale ja nie zabiegałem, aby być twoim pasterzem ani nie pragnąłem dnia boleści; ty wiesz: cokolwiek wyszło z moich ust, jest przed twoim obliczem."
"Jr17,17": "Nie bądź dla mnie postrachem. Ty jesteś moją nadzieją w dniu utrapienia."
"Jr17,18": "Niech będą zawstydzeni ci, którzy mnie prześladują, lecz niech ja nie będę zawstydzony. Niech się oni lękają, lecz niech ja się nie lękam. Sprowadź na nich dzień utrapienia i zniszcz ich podwójnym zniszczeniem."
"Jr17,19": "Tak PAN powiedział do mnie: Idź i stań w bramie synów tego ludu, którą wchodzą i wychodzą królowie Judy, oraz we wszystkich bramach Jerozolimy;"
"Jr17,20": "I powiedz im: Słuchajcie słowa PANA, królowie Judy, cała Judo i wszyscy mieszkańcy Jerozolimy, którzy wchodzicie przez te bramy!"
"Jr17,21": "Tak mówi PAN: Strzeżcie pilnie waszych dusz i nie noście żadnego ciężaru w dzień szabatu ani nie wnoście tego przez bramy Jerozolimy;"
"Jr17,22": "Nie wynoście ciężarów z waszych domów w dzień szabatu ani nie wykonujcie żadnej pracy, ale święćcie dzień szabatu, jak nakazałem waszym ojcom."
"Jr17,23": "Oni jednak nie usłuchali ani nie nakłonili swego ucha, lecz zatwardzili swój kark, aby nie słuchać i nie przyjąć pouczenia."
"Jr17,24": "A jeśli będziecie mnie pilnie słuchać, mówi PAN, i nie wnosić ciężarów przez bramy tego miasta w dzień szabatu, ale będziecie święcić dzień szabatu, nie wykonując w nim żadnej pracy;"
"Jr17,25": "Wtedy przez bramy tego miasta będą wchodzić królowie i książęta zasiadający na tronie Dawida, będą wjeżdżać na rydwanach i na koniach, oni, ich książęta, Judejczycy i mieszkańcy Jerozolimy, a to miasto będzie trwać na wieki."
"Jr17,26": "I zbiegną się z miast Judy, z okolic Jerozolimy i z ziemi Beniamina, z równin, z gór i z południa, przynosząc całopalenia, ofiary, dary i kadzidło i przynosząc także dziękczynienie do domu PANA."
"Jr17,27": "Ale jeśli mnie nie usłuchacie, aby święcić dzień szabatu i nie nosić ciężaru, gdy wchodzicie przez bramy Jerozolimy w dzień szabatu, wtedy rozniecę ogień w jej bramach, który pochłonie pałace Jerozolimy i nie będzie ugaszony."
