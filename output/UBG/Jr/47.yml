"Jr47,1": "Słowo PANA, które doszło do proroka Jeremiasza przeciw Filistynom, zanim faraon pobił Gazę."
"Jr47,2": "Tak mówi PAN: Oto wody wznoszą się od północy i będą jak gwałtowna powódź, zatopią ziemię i wszystko, co na niej jest, miasto i jego mieszkańców. Wtedy ludzie będą wołać, zawyją wszyscy mieszkańcy ziemi."
"Jr47,3": "Na odgłos tętentu kopyt jego silnych koni, z powodu turkotu jego rydwanów i trzasku jego kół ojcowie nie obejrzą się na synów, gdyż zasłabną im ręce;"
"Jr47,4": "Z powodu dnia, który nadchodzi, by zniszczyć wszystkich Filistynów i wytępić z Tyru i Sydonu każdą pozostałą pomoc. PAN bowiem zniszczy Filistynów, resztę z wyspy Kaftor."
"Jr47,5": "Przyszło na Gazę łysienie; wyniszczony został Aszkelon i resztki ich doliny. Jak długo będziesz czynić sobie nacięcia?"
"Jr47,6": "Mieczu PANA, jak długo jeszcze nie spoczniesz? Wróć do swojej pochwy, powstrzymaj się i uspokój."
"Jr47,7": "Ale jakże ma się uspokoić, skoro PAN wydał mu rozkaz przeciwko Aszkelonowi i przeciwko brzegowi morskiemu? Tam go skierował."
