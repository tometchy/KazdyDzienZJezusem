"Jr25,1":
  text: "Słowo, które doszło do Jeremiasza o całym ludzie Judy w czwartym roku Joakima, syna Jozjasza, króla Judy, a był to pierwszy rok Nabuchodonozora, króla Babilonu;"
  tags: []
"Jr25,2":
  text: "Które wypowiedział prorok Jeremiasz do całego ludu Judy i do wszystkich mieszkańców Jerozolimy, mówiąc:"
  tags: []
"Jr25,3":
  text: "Od trzynastego roku Jozjasza, syna Amona, króla Judy, aż do dziś, to znaczy już przez dwadzieścia trzy lata, dochodziło do mnie słowo PANA i przemawiałem do was z wczesnym wstawaniem i mówieniem, ale nie słuchaliście."
  tags: []
"Jr25,4":
  text: "PAN też posyłał do was wszystkie swoje sługi, proroków, z wczesnym wstawaniem i przesłaniem, ale nie usłuchaliście ani nie nakłoniliście swego ucha, aby usłyszeć."
  tags: []
"Jr25,5":
  text: "Oni mówili: Niech teraz każdy z was się odwróci od swojej złej drogi i od zła swoich uczynków, a będziecie mieszkać w tej ziemi, którą PAN dał wam i waszym ojcom na wieki wieków."
  tags: []
"Jr25,6":
  text: "Nie chodźcie za innymi bogami, aby im służyć i oddawać im pokłon, i nie pobudzajcie mnie do gniewu uczynkami waszych rąk, a ja nie uczynię wam nic złego."
  tags: []
"Jr25,7":
  text: "Ale nie usłuchaliście mnie, mówi PAN, pobudzając mnie do gniewu uczynkami swoich rąk na własne nieszczęście."
  tags: []
"Jr25,8":
  text: "Dlatego tak mówi PAN zastępów: Ponieważ nie usłuchaliście moich słów;"
  tags: []
"Jr25,9":
  text: "Oto poślę po wszystkie rody północne i zbiorę je, mówi PAN, i Nabuchodonozora, króla Babilonu, swego sługę, i sprowadzę ich na tę ziemię, na jej mieszkańców i na te wszystkie okoliczne narody, a doszczętnie zniszczę ich i uczynię ich przedmiotem zdumienia i świstania, i wiecznym spustoszeniem."
  tags: []
"Jr25,10":
  text: "I sprawię, że zaniknie głos wesela i głos radości, głos oblubieńca i głos oblubienicy, odgłos żaren i światło pochodni."
  tags: []
"Jr25,11":
  text: "I cała ta ziemia stanie się spustoszeniem i zdumieniem, a te narody będą służyć królowi Babilonu przez siedemdziesiąt lat."
  tags: []
"Jr25,12":
  text: "A gdy się dopełni siedemdziesiąt lat, ukarzę króla Babilonu i ten naród, mówi PAN, za ich nieprawość, oraz ziemię Chaldejczyków, i zamienię ją w wieczne spustoszenie."
  tags: []
"Jr25,13":
  text: "I sprowadzę na tę ziemię wszystkie moje słowa, które wypowiedziałem przeciw niej, mianowicie to wszystko, co jest napisane w tej księdze, co prorokował Jeremiasz przeciw wszystkim narodom."
  tags: []
"Jr25,14":
  text: "Gdyż i one będą podbite i wzięte do niewoli przez liczne narody i wielkich królów. Odpłacę im według ich czynów i według uczynków ich rąk."
  tags: []
"Jr25,15":
  text: "Tak bowiem powiedział do mnie PAN, Bóg Izraela: Weź z mojej ręki kubek wina tej zapalczywości i daj z niego pić wszystkim narodom, do których cię posyłam."
  tags: []
"Jr25,16":
  text: "Będą pić i zataczać się, a nawet szaleć przed ostrzem miecza, który posyłam między nie."
  tags: []
"Jr25,17":
  text: "Wziąłem więc kubek z ręki PANA i napoiłem wszystkie narody, do których PAN mnie posłał:"
  tags: []
"Jr25,18":
  text: "Jerozolimę i miasta ziemi Judy, jej królów i książąt, aby uczynić ich przedmiotem spustoszenia, zdumienia, świstania i przekleństwa, jak to jest dzisiaj;"
  tags: []
"Jr25,19":
  text: "Faraona, króla Egiptu, jego sługi i książąt, oraz cały jego lud;"
  tags: []
"Jr25,20":
  text: "Całą różnorodną ludność, wszystkich królów ziemi Uz, wszystkich królów ziemi Filistynów oraz Aszkelon, Gazę, Ekron i resztkę Aszdodu;"
  tags: []
"Jr25,21":
  text: "Edom, Moab i synów Ammona;"
  tags: []
"Jr25,22":
  text: "Wszystkich królów Tyru, wszystkich królów Sydonu oraz królów zamorskich wysp;"
  tags: []
"Jr25,23":
  text: "Dedan, Temę, Buzę i wszystkich mieszkańców w najdalszych zakątkach:"
  tags: []
"Jr25,24":
  text: "Wszystkich królów Arabii i wszystkich królów różnorodnej ludności mieszkającej na pustyni;"
  tags: []
"Jr25,25":
  text: "Wszystkich królów Zimri, wszystkich królów Elamu i wszystkich królów Medii;"
  tags: []
"Jr25,26":
  text: "I wszystkich królów Północy, bliskich i dalekich, jednego po drugim; wszystkie królestwa ziemi, jakie są na powierzchni ziemi. A król Szeszak będzie po nich pił."
  tags: []
"Jr25,27":
  text: "I powiesz im: Tak mówi PAN zastępów, Bóg Izraela: Pijcie i upijacie się, wymiotujcie i padajcie, aby już nie powstać z powodu miecza, który ja poślę między was."
  tags: []
"Jr25,28":
  text: "A jeśli nie zechcą wziąć kubka z twojej ręki, aby pić, wtedy im powiesz: Tak mówi PAN zastępów: Koniecznie będziecie pić."
  tags: []
"Jr25,29":
  text: "Oto bowiem na to miasto, nad którym jest wzywane moje imię, zaczynam sprowadzać nieszczęście, a wy mielibyście pozostać nieukarani? Nie ujdziecie karze, bo ja przyzywam miecz na wszystkich mieszkańców tej ziemi, mówi PAN zastępów."
  tags: []
"Jr25,30":
  text: "Dlatego ty prorokuj przeciwko nim wszystkie te słowa i powiedz im: PAN zagrzmi z wysoka i ze swego Świętego Przybytku wyda swój głos; zagrzmi nad swoim miejscem zamieszkania; wzniesie okrzyk jak tłoczący winogrona przeciwko wszystkim mieszkańcom tej ziemi."
  tags: []
"Jr25,31":
  text: "I dojdzie wrzawa aż do krańców ziemi, bo PAN prowadzi spór z tymi narodami, sprawuje sąd nad wszelkim ciałem, bezbożnych wyda pod miecz, mówi PAN."
  tags: []
"Jr25,32":
  text: "Tak mówi PAN zastępów: Oto nieszczęście przejdzie z narodu na naród, a wielki wicher zerwie się od krańców ziemi."
  tags: []
"Jr25,33":
  text: "I pobici przez PANA w tym dniu leżeć będą od krańca ziemi aż po kraniec ziemi; nie będą ich opłakiwać ani zbierać, ani grzebać, będą jak nawóz na polu."
  tags: []
"Jr25,34":
  text: "Zawódźcie, pasterze, i wołajcie, tarzajcie się w popiele, wy, przewodnicy tej trzody! Dopełniły się bowiem dni waszej rzezi i rozproszenia i padniecie jak drogie naczynie."
  tags: []
"Jr25,35":
  text: "Nie będzie ucieczki dla pasterzy ani ocalenia dla przewodników tej trzody."
  tags: []
"Jr25,36":
  text: "Będzie słychać głos wołania pasterzy i zawodzenie przewodników tej trzody, bo PAN spustoszy ich pastwiska."
  tags: []
"Jr25,37":
  text: "I będą zniszczone spokojne łąki z powodu zapalczywości gniewu PANA."
  tags: []
"Jr25,38":
  text: "Opuścił jak lew swoją jaskinię, bo ich ziemia jest spustoszona z powodu zapalczywości niszczyciela i zapalczywości jego gniewu."
  tags: []
