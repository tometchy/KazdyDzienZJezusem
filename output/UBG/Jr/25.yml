"Jr25,1": "Słowo, które doszło do Jeremiasza o całym ludzie Judy w czwartym roku Joakima, syna Jozjasza, króla Judy, a był to pierwszy rok Nabuchodonozora, króla Babilonu;"
"Jr25,2": "Które wypowiedział prorok Jeremiasz do całego ludu Judy i do wszystkich mieszkańców Jerozolimy, mówiąc:"
"Jr25,3": "Od trzynastego roku Jozjasza, syna Amona, króla Judy, aż do dziś, to znaczy już przez dwadzieścia trzy lata, dochodziło do mnie słowo PANA i przemawiałem do was z wczesnym wstawaniem i mówieniem, ale nie słuchaliście."
"Jr25,4": "PAN też posyłał do was wszystkie swoje sługi, proroków, z wczesnym wstawaniem i przesłaniem, ale nie usłuchaliście ani nie nakłoniliście swego ucha, aby usłyszeć."
"Jr25,5": "Oni mówili: Niech teraz każdy z was się odwróci od swojej złej drogi i od zła swoich uczynków, a będziecie mieszkać w tej ziemi, którą PAN dał wam i waszym ojcom na wieki wieków."
"Jr25,6": "Nie chodźcie za innymi bogami, aby im służyć i oddawać im pokłon, i nie pobudzajcie mnie do gniewu uczynkami waszych rąk, a ja nie uczynię wam nic złego."
"Jr25,7": "Ale nie usłuchaliście mnie, mówi PAN, pobudzając mnie do gniewu uczynkami swoich rąk na własne nieszczęście."
"Jr25,8": "Dlatego tak mówi PAN zastępów: Ponieważ nie usłuchaliście moich słów;"
"Jr25,9": "Oto poślę po wszystkie rody północne i zbiorę je, mówi PAN, i Nabuchodonozora, króla Babilonu, swego sługę, i sprowadzę ich na tę ziemię, na jej mieszkańców i na te wszystkie okoliczne narody, a doszczętnie zniszczę ich i uczynię ich przedmiotem zdumienia i świstania, i wiecznym spustoszeniem."
"Jr25,10": "I sprawię, że zaniknie głos wesela i głos radości, głos oblubieńca i głos oblubienicy, odgłos żaren i światło pochodni."
"Jr25,11": "I cała ta ziemia stanie się spustoszeniem i zdumieniem, a te narody będą służyć królowi Babilonu przez siedemdziesiąt lat."
"Jr25,12": "A gdy się dopełni siedemdziesiąt lat, ukarzę króla Babilonu i ten naród, mówi PAN, za ich nieprawość, oraz ziemię Chaldejczyków, i zamienię ją w wieczne spustoszenie."
"Jr25,13": "I sprowadzę na tę ziemię wszystkie moje słowa, które wypowiedziałem przeciw niej, mianowicie to wszystko, co jest napisane w tej księdze, co prorokował Jeremiasz przeciw wszystkim narodom."
"Jr25,14": "Gdyż i one będą podbite i wzięte do niewoli przez liczne narody i wielkich królów. Odpłacę im według ich czynów i według uczynków ich rąk."
"Jr25,15": "Tak bowiem powiedział do mnie PAN, Bóg Izraela: Weź z mojej ręki kubek wina tej zapalczywości i daj z niego pić wszystkim narodom, do których cię posyłam."
"Jr25,16": "Będą pić i zataczać się, a nawet szaleć przed ostrzem miecza, który posyłam między nie."
"Jr25,17": "Wziąłem więc kubek z ręki PANA i napoiłem wszystkie narody, do których PAN mnie posłał:"
"Jr25,18": "Jerozolimę i miasta ziemi Judy, jej królów i książąt, aby uczynić ich przedmiotem spustoszenia, zdumienia, świstania i przekleństwa, jak to jest dzisiaj;"
"Jr25,19": "Faraona, króla Egiptu, jego sługi i książąt, oraz cały jego lud;"
"Jr25,20": "Całą różnorodną ludność, wszystkich królów ziemi Uz, wszystkich królów ziemi Filistynów oraz Aszkelon, Gazę, Ekron i resztkę Aszdodu;"
"Jr25,21": "Edom, Moab i synów Ammona;"
"Jr25,22": "Wszystkich królów Tyru, wszystkich królów Sydonu oraz królów zamorskich wysp;"
"Jr25,23": "Dedan, Temę, Buzę i wszystkich mieszkańców w najdalszych zakątkach:"
"Jr25,24": "Wszystkich królów Arabii i wszystkich królów różnorodnej ludności mieszkającej na pustyni;"
"Jr25,25": "Wszystkich królów Zimri, wszystkich królów Elamu i wszystkich królów Medii;"
"Jr25,26": "I wszystkich królów Północy, bliskich i dalekich, jednego po drugim; wszystkie królestwa ziemi, jakie są na powierzchni ziemi. A król Szeszak będzie po nich pił."
"Jr25,27": "I powiesz im: Tak mówi PAN zastępów, Bóg Izraela: Pijcie i upijacie się, wymiotujcie i padajcie, aby już nie powstać z powodu miecza, który ja poślę między was."
"Jr25,28": "A jeśli nie zechcą wziąć kubka z twojej ręki, aby pić, wtedy im powiesz: Tak mówi PAN zastępów: Koniecznie będziecie pić."
"Jr25,29": "Oto bowiem na to miasto, nad którym jest wzywane moje imię, zaczynam sprowadzać nieszczęście, a wy mielibyście pozostać nieukarani? Nie ujdziecie karze, bo ja przyzywam miecz na wszystkich mieszkańców tej ziemi, mówi PAN zastępów."
"Jr25,30": "Dlatego ty prorokuj przeciwko nim wszystkie te słowa i powiedz im: PAN zagrzmi z wysoka i ze swego Świętego Przybytku wyda swój głos; zagrzmi nad swoim miejscem zamieszkania; wzniesie okrzyk jak tłoczący winogrona przeciwko wszystkim mieszkańcom tej ziemi."
"Jr25,31": "I dojdzie wrzawa aż do krańców ziemi, bo PAN prowadzi spór z tymi narodami, sprawuje sąd nad wszelkim ciałem, bezbożnych wyda pod miecz, mówi PAN."
"Jr25,32": "Tak mówi PAN zastępów: Oto nieszczęście przejdzie z narodu na naród, a wielki wicher zerwie się od krańców ziemi."
"Jr25,33": "I pobici przez PANA w tym dniu leżeć będą od krańca ziemi aż po kraniec ziemi; nie będą ich opłakiwać ani zbierać, ani grzebać, będą jak nawóz na polu."
"Jr25,34": "Zawódźcie, pasterze, i wołajcie, tarzajcie się w popiele, wy, przewodnicy tej trzody! Dopełniły się bowiem dni waszej rzezi i rozproszenia i padniecie jak drogie naczynie."
"Jr25,35": "Nie będzie ucieczki dla pasterzy ani ocalenia dla przewodników tej trzody."
"Jr25,36": "Będzie słychać głos wołania pasterzy i zawodzenie przewodników tej trzody, bo PAN spustoszy ich pastwiska."
"Jr25,37": "I będą zniszczone spokojne łąki z powodu zapalczywości gniewu PANA."
"Jr25,38": "Opuścił jak lew swoją jaskinię, bo ich ziemia jest spustoszona z powodu zapalczywości niszczyciela i zapalczywości jego gniewu."
