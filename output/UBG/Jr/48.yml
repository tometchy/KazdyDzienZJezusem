"Jr48,1": "Przeciw Moabowi tak mówi PAN zastępów, Bóg Izraela: Biada miastu Nebo, bo jest spustoszone. Kiriataim jest pohańbione i zdobyte. Misgab jest zawstydzone i przerażone."
"Jr48,2": "Nie będzie już chwały dla Moabu, w Cheszbonie obmyślono przeciwko niemu nieszczęście: Chodźcie, wytępmy go spośród narodów. I ty, Madmenie, zostaniesz wykorzeniony, miecz będzie cię ścigał."
"Jr48,3": "Głos krzyku z Choronaim, spustoszenie i wielkie zniszczenie."
"Jr48,4": "Moab jest zmiażdżony, usłyszy się krzyk jego małych."
"Jr48,5": "Będzie bowiem ciągły płacz przy wchodzeniu do Luchit, a przy schodzeniu do Choronaim wrogowie usłyszą krzyk nad zniszczeniem."
"Jr48,6": "Uciekajcie, ratujcie swoje życie i bądźcie jak wrzos na pustyni."
"Jr48,7": "Ponieważ pokładasz ufność w swoich dziełach i skarbach, ty też będziesz zdobyty. Kemosz pójdzie do niewoli wraz ze swoimi kapłanami i książętami."
"Jr48,8": "Niszczyciel przyjdzie do każdego miasta i żadne miasto nie ocaleje. Dolina też zginie i równina będzie spustoszona, jak mówi PAN."
"Jr48,9": "Dajcie skrzydła Moabowi, niech szybko uleci, bo jego miasta zostaną spustoszone, tak że nie będzie w nich mieszkańców."
"Jr48,10": "Przeklęty, kto wykonuje dzieło PANA podstępnie; przeklęty także, kto swój miecz powstrzymuje od krwi."
"Jr48,11": "Moab miał pokój od swojej młodości, spoczywał na swoich drożdżach i nie był przelewany z naczynia do naczynia, nie poszedł do niewoli. Dlatego zachował się w nim jego smak i jego zapach się nie zmienił."
"Jr48,12": "Dlatego oto nadchodzą dni, mówi PAN, że poślę na niego najeźdźców, którzy go uprowadzą, a opróżnią jego naczynia i potłuką jego dzbany."
"Jr48,13": "I Moab będzie się wstydzić Kemosza, jak dom Izraela wstydził się Betel, jego nadziei."
"Jr48,14": "Jakże możecie mówić: Jesteśmy mocnymi i dzielnymi wojownikami w walce?"
"Jr48,15": "Moab jest zburzony i wyszedł ze swoich miast, a wyborni jego młodzieńcy pójdą na rzeź, mówi Król, jego imię to PAN zastępów."
"Jr48,16": "Zbliża się klęska Moabu, jego nieszczęście nadchodzi spiesznie."
"Jr48,17": "Opłakujcie go, wszyscy, jego sąsiedzi; wszyscy, którzy znacie jego imię, mówcie: Jakże się złamała mocna laska i berło ozdobne!"
"Jr48,18": "Zejdź ze swej chwały i siądź w pragnieniu, córko, mieszkanko Dibonu! Bo niszczyciel Moabu nadciągnie przeciwko tobie, rozrzuci twoje twierdze."
"Jr48,19": "Stań na drodze i przypatrz się uważnie, mieszkanko Aroeru! Spytaj tego, który ucieka, i tej, która uchodzi: Co się dzieje?"
"Jr48,20": "Moab jest zawstydzony, bo jest rozgromiony; zawódźcie i krzyczcie, opowiadajcie w Arnon, że Moab jest spustoszony."
"Jr48,21": "Sąd nadszedł na ziemię tej równiny, na Cholon, na Jahazę i na Mefaat;"
"Jr48,22": "Na Dibon, na Nebo i na Bet-Dyblataim;"
"Jr48,23": "Na Kiriataim, na Betgamul i na Bet-Meon."
"Jr48,24": "Na Keriot, na Bosrę i na wszystkie miasta ziemi Moabu, dalekie i bliskie."
"Jr48,25": "Róg Moabu został odcięty i jego ramię złamane, mówi PAN."
"Jr48,26": "Upójcie go, ponieważ wynosił się przeciw PANU. Niech Moab tarza się w swoich wymiocinach i niech również stanie się pośmiewiskiem."
"Jr48,27": "Czy Izrael nie był dla ciebie pośmiewiskiem? Czy złapano go wśród złodziei? Ilekroć bowiem mówisz o nim, skaczesz z radości."
"Jr48,28": "Opuszczajcie miasta i zamieszkajcie na skale, mieszkańcy Moabu! Bądźcie jak gołębica, która się gnieździ na ścianach gardzieli urwiska."
"Jr48,29": "Słyszeliśmy o pysze Moabu, że jest niezmiernie pyszny, o jego zuchwałości, o jego zarozumiałości, o jego dumie i o wyniosłości jego serca."
"Jr48,30": "Znam jego gniew, mówi PAN, lecz mu się nie poszczęści; jego kłamstwa nie dojdą do skutku."
"Jr48,31": "Dlatego nad Moabem będę zawodził, nad całym Moabem będę wołał, i nad ludźmi z Kir-Cheres moje serce będzie wzdychało."
"Jr48,32": "Płaczę nad tobą, jak opłakiwano Jazer, winorośli Sibmy! Twoje latorośle sięgają aż za morze, dochodzą aż do morza Jazer. Na twoje letnie owoce i na twoje winobranie wpadł niszczyciel."
"Jr48,33": "I zniknęły wesele i radość z urodzajnych pól i z ziemi Moabu, i sprawiłem, że wino się skończyło z pras; nie będą go tłoczyć wśród okrzyków, a ich okrzyk nie będzie okrzykiem."
"Jr48,34": "Od krzyku Cheszbonu aż do Eleale i aż do Jahazy wydają swój głos, z Soaru aż do Choronaim, jak trzyletnia jałówka; bo wody Nimrim też staną się spustoszeniem."
"Jr48,35": "I sprawię, mówi PAN, że już nie będzie w Moabie nikogo, kto składa ofiarę na wyżynach lub pali kadzidło swoim bogom."
"Jr48,36": "Dlatego moje serce będzie jęczeć nad Moabem jak flet; nad ludźmi z Kir-Cheres moje serce zawodzi jak flet, gdyż ich zgromadzony dobytek wniwecz się obrócił."
"Jr48,37": "Na każdej bowiem głowie będzie łysina i każda broda zostanie ogolona. Na wszystkich rękach będą nacięcia i na biodrach wory."
"Jr48,38": "Na wszystkich dachach Moabu i na jego ulicach tylko powszechny lament, bo rozbiłem Moab jak naczynie nieużyteczne, mówi PAN."
"Jr48,39": "Będą zawodzić, mówiąc: Jakże jest rozbity! Jak haniebnie uciekł Moab! Moab będzie pośmiewiskiem i postrachem dla wszystkich, którzy są dokoła niego."
"Jr48,40": "Tak bowiem mówi PAN: Oto wróg jak orzeł przyleci i rozciągnie swe skrzydła nad Moabem."
"Jr48,41": "Keriot jest zdobyty i twierdze są wzięte, a serce mocarzy Moabu w tym dniu będzie jak serce rodzącej kobiety."
"Jr48,42": "Moab zostanie zniszczony, przestanie być ludem, bo wynosił się przeciwko PANU."
"Jr48,43": "Strach, dół i sidło nad tobą, który mieszkasz w Moabie, mówi PAN."
"Jr48,44": "Kto ucieknie przed strachem, wpadnie w dół, a kto wyjdzie z dołu, wpadnie w sidła. Sprowadzę bowiem na niego, na Moab, rok jego nawiedzenia, mówi PAN."
"Jr48,45": "W cieniu Cheszbonu zatrzymali się ci, którzy uciekali przed przemocą. Ale ogień wyjdzie z Cheszbonu i płomień ze środka Sichona i pożre krańce Moabu, i czaszkę tych, którzy czynią zgiełk."
"Jr48,46": "Biada tobie, Moabie! Ginie lud Kemosza, bo twoi synowie zostali zabrani do niewoli i twoje córki – na wygnanie."
"Jr48,47": "Odwrócę jednak niewolę Moabu w dniach ostatecznych, mówi PAN. Dotąd sąd nad Moabem."
