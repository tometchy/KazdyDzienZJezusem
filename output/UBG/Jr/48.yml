"Jr48,1":
  text: "Przeciw Moabowi tak mówi PAN zastępów, Bóg Izraela: Biada miastu Nebo, bo jest spustoszone. Kiriataim jest pohańbione i zdobyte. Misgab jest zawstydzone i przerażone."
  tags: []
"Jr48,2":
  text: "Nie będzie już chwały dla Moabu, w Cheszbonie obmyślono przeciwko niemu nieszczęście: Chodźcie, wytępmy go spośród narodów. I ty, Madmenie, zostaniesz wykorzeniony, miecz będzie cię ścigał."
  tags: []
"Jr48,3":
  text: "Głos krzyku z Choronaim, spustoszenie i wielkie zniszczenie."
  tags: []
"Jr48,4":
  text: "Moab jest zmiażdżony, usłyszy się krzyk jego małych."
  tags: []
"Jr48,5":
  text: "Będzie bowiem ciągły płacz przy wchodzeniu do Luchit, a przy schodzeniu do Choronaim wrogowie usłyszą krzyk nad zniszczeniem."
  tags: []
"Jr48,6":
  text: "Uciekajcie, ratujcie swoje życie i bądźcie jak wrzos na pustyni."
  tags: []
"Jr48,7":
  text: "Ponieważ pokładasz ufność w swoich dziełach i skarbach, ty też będziesz zdobyty. Kemosz pójdzie do niewoli wraz ze swoimi kapłanami i książętami."
  tags: []
"Jr48,8":
  text: "Niszczyciel przyjdzie do każdego miasta i żadne miasto nie ocaleje. Dolina też zginie i równina będzie spustoszona, jak mówi PAN."
  tags: []
"Jr48,9":
  text: "Dajcie skrzydła Moabowi, niech szybko uleci, bo jego miasta zostaną spustoszone, tak że nie będzie w nich mieszkańców."
  tags: []
"Jr48,10":
  text: "Przeklęty, kto wykonuje dzieło PANA podstępnie; przeklęty także, kto swój miecz powstrzymuje od krwi."
  tags: []
"Jr48,11":
  text: "Moab miał pokój od swojej młodości, spoczywał na swoich drożdżach i nie był przelewany z naczynia do naczynia, nie poszedł do niewoli. Dlatego zachował się w nim jego smak i jego zapach się nie zmienił."
  tags: []
"Jr48,12":
  text: "Dlatego oto nadchodzą dni, mówi PAN, że poślę na niego najeźdźców, którzy go uprowadzą, a opróżnią jego naczynia i potłuką jego dzbany."
  tags: []
"Jr48,13":
  text: "I Moab będzie się wstydzić Kemosza, jak dom Izraela wstydził się Betel, jego nadziei."
  tags: []
"Jr48,14":
  text: "Jakże możecie mówić: Jesteśmy mocnymi i dzielnymi wojownikami w walce?"
  tags: []
"Jr48,15":
  text: "Moab jest zburzony i wyszedł ze swoich miast, a wyborni jego młodzieńcy pójdą na rzeź, mówi Król, jego imię to PAN zastępów."
  tags: []
"Jr48,16":
  text: "Zbliża się klęska Moabu, jego nieszczęście nadchodzi spiesznie."
  tags: []
"Jr48,17":
  text: "Opłakujcie go, wszyscy, jego sąsiedzi; wszyscy, którzy znacie jego imię, mówcie: Jakże się złamała mocna laska i berło ozdobne!"
  tags: []
"Jr48,18":
  text: "Zejdź ze swej chwały i siądź w pragnieniu, córko, mieszkanko Dibonu! Bo niszczyciel Moabu nadciągnie przeciwko tobie, rozrzuci twoje twierdze."
  tags: []
"Jr48,19":
  text: "Stań na drodze i przypatrz się uważnie, mieszkanko Aroeru! Spytaj tego, który ucieka, i tej, która uchodzi: Co się dzieje?"
  tags: []
"Jr48,20":
  text: "Moab jest zawstydzony, bo jest rozgromiony; zawódźcie i krzyczcie, opowiadajcie w Arnon, że Moab jest spustoszony."
  tags: []
"Jr48,21":
  text: "Sąd nadszedł na ziemię tej równiny, na Cholon, na Jahazę i na Mefaat;"
  tags: []
"Jr48,22":
  text: "Na Dibon, na Nebo i na Bet-Dyblataim;"
  tags: []
"Jr48,23":
  text: "Na Kiriataim, na Betgamul i na Bet-Meon."
  tags: []
"Jr48,24":
  text: "Na Keriot, na Bosrę i na wszystkie miasta ziemi Moabu, dalekie i bliskie."
  tags: []
"Jr48,25":
  text: "Róg Moabu został odcięty i jego ramię złamane, mówi PAN."
  tags: []
"Jr48,26":
  text: "Upójcie go, ponieważ wynosił się przeciw PANU. Niech Moab tarza się w swoich wymiocinach i niech również stanie się pośmiewiskiem."
  tags: []
"Jr48,27":
  text: "Czy Izrael nie był dla ciebie pośmiewiskiem? Czy złapano go wśród złodziei? Ilekroć bowiem mówisz o nim, skaczesz z radości."
  tags: []
"Jr48,28":
  text: "Opuszczajcie miasta i zamieszkajcie na skale, mieszkańcy Moabu! Bądźcie jak gołębica, która się gnieździ na ścianach gardzieli urwiska."
  tags: []
"Jr48,29":
  text: "Słyszeliśmy o pysze Moabu, że jest niezmiernie pyszny, o jego zuchwałości, o jego zarozumiałości, o jego dumie i o wyniosłości jego serca."
  tags: []
"Jr48,30":
  text: "Znam jego gniew, mówi PAN, lecz mu się nie poszczęści; jego kłamstwa nie dojdą do skutku."
  tags: []
"Jr48,31":
  text: "Dlatego nad Moabem będę zawodził, nad całym Moabem będę wołał, i nad ludźmi z Kir-Cheres moje serce będzie wzdychało."
  tags: []
"Jr48,32":
  text: "Płaczę nad tobą, jak opłakiwano Jazer, winorośli Sibmy! Twoje latorośle sięgają aż za morze, dochodzą aż do morza Jazer. Na twoje letnie owoce i na twoje winobranie wpadł niszczyciel."
  tags: []
"Jr48,33":
  text: "I zniknęły wesele i radość z urodzajnych pól i z ziemi Moabu, i sprawiłem, że wino się skończyło z pras; nie będą go tłoczyć wśród okrzyków, a ich okrzyk nie będzie okrzykiem."
  tags: []
"Jr48,34":
  text: "Od krzyku Cheszbonu aż do Eleale i aż do Jahazy wydają swój głos, z Soaru aż do Choronaim, jak trzyletnia jałówka; bo wody Nimrim też staną się spustoszeniem."
  tags: []
"Jr48,35":
  text: "I sprawię, mówi PAN, że już nie będzie w Moabie nikogo, kto składa ofiarę na wyżynach lub pali kadzidło swoim bogom."
  tags: []
"Jr48,36":
  text: "Dlatego moje serce będzie jęczeć nad Moabem jak flet; nad ludźmi z Kir-Cheres moje serce zawodzi jak flet, gdyż ich zgromadzony dobytek wniwecz się obrócił."
  tags: []
"Jr48,37":
  text: "Na każdej bowiem głowie będzie łysina i każda broda zostanie ogolona. Na wszystkich rękach będą nacięcia i na biodrach wory."
  tags: []
"Jr48,38":
  text: "Na wszystkich dachach Moabu i na jego ulicach tylko powszechny lament, bo rozbiłem Moab jak naczynie nieużyteczne, mówi PAN."
  tags: []
"Jr48,39":
  text: "Będą zawodzić, mówiąc: Jakże jest rozbity! Jak haniebnie uciekł Moab! Moab będzie pośmiewiskiem i postrachem dla wszystkich, którzy są dokoła niego."
  tags: []
"Jr48,40":
  text: "Tak bowiem mówi PAN: Oto wróg jak orzeł przyleci i rozciągnie swe skrzydła nad Moabem."
  tags: []
"Jr48,41":
  text: "Keriot jest zdobyty i twierdze są wzięte, a serce mocarzy Moabu w tym dniu będzie jak serce rodzącej kobiety."
  tags: []
"Jr48,42":
  text: "Moab zostanie zniszczony, przestanie być ludem, bo wynosił się przeciwko PANU."
  tags: []
"Jr48,43":
  text: "Strach, dół i sidło nad tobą, który mieszkasz w Moabie, mówi PAN."
  tags: []
"Jr48,44":
  text: "Kto ucieknie przed strachem, wpadnie w dół, a kto wyjdzie z dołu, wpadnie w sidła. Sprowadzę bowiem na niego, na Moab, rok jego nawiedzenia, mówi PAN."
  tags: []
"Jr48,45":
  text: "W cieniu Cheszbonu zatrzymali się ci, którzy uciekali przed przemocą. Ale ogień wyjdzie z Cheszbonu i płomień ze środka Sichona i pożre krańce Moabu, i czaszkę tych, którzy czynią zgiełk."
  tags: []
"Jr48,46":
  text: "Biada tobie, Moabie! Ginie lud Kemosza, bo twoi synowie zostali zabrani do niewoli i twoje córki – na wygnanie."
  tags: []
"Jr48,47":
  text: "Odwrócę jednak niewolę Moabu w dniach ostatecznych, mówi PAN. Dotąd sąd nad Moabem."
  tags: []
