"Jr16,1":
  text: "I doszło do mnie słowo PANA mówiące:"
  tags: []
"Jr16,2":
  text: "Nie pojmiesz sobie żony ani nie będziesz miał synów i córek na tym miejscu."
  tags: []
"Jr16,3":
  text: "Tak bowiem mówi PAN o synach i córkach urodzonych na tym miejscu, o ich matkach, które ich urodzą, i o ich ojcach, którzy ich spłodzą w tej ziemi:"
  tags: []
"Jr16,4":
  text: "Pomrą od ciężkich śmiertelnych chorób; nie będą opłakiwani ani pogrzebani, lecz staną się nawozem na powierzchni ziemi. Wyginą od miecza i głodu, a ich trupy będą pokarmem dla ptactwa nieba i zwierząt ziemi."
  tags: []
"Jr16,5":
  text: "Tak bowiem mówi PAN: Nie wchodź do domu żałoby i nie chodź opłakiwać ani żałować ich, bo odjąłem mój pokój od tego ludu, miłosierdzie i litość, mówi PAN."
  tags: []
"Jr16,6":
  text: "Pomrą wielcy i mali w tej ziemi. Nie będą pogrzebani ani opłakiwani, nikt nie będzie dla nich się nacinał ani robił sobie łysiny;"
  tags: []
"Jr16,7":
  text: "Nikt nie będzie łamać chleba z tymi, którzy są w żałobie, aby ich pocieszyć po zmarłym, ani nie dadzą im pić z kubka pocieszenia za ich ojca lub matkę."
  tags: []
"Jr16,8":
  text: "Nie wchodź do domu uczty, by zasiąść z nimi do jedzenia i picia."
  tags: []
"Jr16,9":
  text: "Tak bowiem mówi PAN zastępów, Bóg Izraela: Oto sprawię, że na waszych oczach i za waszych dni ustanie na tym miejscu głos wesela i głos radości, głos oblubieńca i głos oblubienicy."
  tags: []
"Jr16,10":
  text: "A gdy ogłosisz temu ludowi wszystkie te słowa, a zapytają cię: Czemu PAN zapowiedział przeciwko nam całe to wielkie nieszczęście? I jaka jest nasza nieprawość, i jaki nasz grzech, który popełniliśmy przeciwko PANU, naszemu Bogu?"
  tags: []
"Jr16,11":
  text: "Wtedy powiesz im: Dlatego, że wasi ojcowie opuścili mnie, mówi PAN, i poszli za innymi bogami, służyli im i oddawali im pokłon, mnie zaś opuścili i nie przestrzegali mojego prawa."
  tags: []
"Jr16,12":
  text: "A wy czyniliście jeszcze gorzej niż wasi ojcowie, bo oto każdy z was postępuje według uporu swego złego serca, nie słuchając mnie;"
  tags: []
"Jr16,13":
  text: "Dlatego wyrzucę was z tej ziemi do ziemi, której nie znaliście, ani wy, ani wasi ojcowie, i tam będziecie służyć innym bogom dniem i nocą, gdzie nie okażę wam miłosierdzia."
  tags: []
"Jr16,14":
  text: "Dlatego oto nadchodzą dni, mówi PAN, że już nie będą mówić: Jak żyje PAN, który wyprowadził synów Izraela z ziemi Egiptu;"
  tags: []
"Jr16,15":
  text: "Ale: Jak żyje PAN, który wyprowadził synów Izraela z ziemi północnej i ze wszystkich ziem, do których ich wygnał. I sprowadzę ich znowu do ich ziemi, którą dałem ich ojcom."
  tags: []
"Jr16,16":
  text: "Oto poślę po wielu rybaków, mówi PAN, i ci ich wyłowią; potem poślę po wielu myśliwych, i ci ich upolują na każdej górze i na każdym pagórku, i w rozpadlinach skalnych."
  tags: []
"Jr16,17":
  text: "Moje oczy bowiem patrzą na wszystkie ich drogi. Nie są ukryte przed moim obliczem ani ich nieprawość nie jest zakryta przed moimi oczami."
  tags: []
"Jr16,18":
  text: "Najpierw odpłacę im podwójnie za ich nieprawości i za ich grzechy, za to, że zbezcześcili moją ziemię trupami swoich obrzydliwości i napełnili moje dziedzictwo swoimi ohydami."
  tags: []
"Jr16,19":
  text: "PANIE, moja mocy i siło, moja ucieczko w dniu utrapienia! Do ciebie przyjdą poganie od krańców ziemi i powiedzą: Zaprawdę, nasi ojcowie odziedziczyli kłamstwa i marności, w których nie było żadnego pożytku."
  tags: []
"Jr16,20":
  text: "Czy człowiek może uczynić sobie bogów? Przecież to nie są bogowie."
  tags: []
"Jr16,21":
  text: "Dlatego oto ja sprawię, że poznają tym razem; sprawię, że poznają moją rękę i moc, i dowiedzą się, że moje imię to PAN."
  tags: []
