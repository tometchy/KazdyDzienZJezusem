"Jr16,1": "I doszło do mnie słowo PANA mówiące:"
"Jr16,2": "Nie pojmiesz sobie żony ani nie będziesz miał synów i córek na tym miejscu."
"Jr16,3": "Tak bowiem mówi PAN o synach i córkach urodzonych na tym miejscu, o ich matkach, które ich urodzą, i o ich ojcach, którzy ich spłodzą w tej ziemi:"
"Jr16,4": "Pomrą od ciężkich śmiertelnych chorób; nie będą opłakiwani ani pogrzebani, lecz staną się nawozem na powierzchni ziemi. Wyginą od miecza i głodu, a ich trupy będą pokarmem dla ptactwa nieba i zwierząt ziemi."
"Jr16,5": "Tak bowiem mówi PAN: Nie wchodź do domu żałoby i nie chodź opłakiwać ani żałować ich, bo odjąłem mój pokój od tego ludu, miłosierdzie i litość, mówi PAN."
"Jr16,6": "Pomrą wielcy i mali w tej ziemi. Nie będą pogrzebani ani opłakiwani, nikt nie będzie dla nich się nacinał ani robił sobie łysiny;"
"Jr16,7": "Nikt nie będzie łamać chleba z tymi, którzy są w żałobie, aby ich pocieszyć po zmarłym, ani nie dadzą im pić z kubka pocieszenia za ich ojca lub matkę."
"Jr16,8": "Nie wchodź do domu uczty, by zasiąść z nimi do jedzenia i picia."
"Jr16,9": "Tak bowiem mówi PAN zastępów, Bóg Izraela: Oto sprawię, że na waszych oczach i za waszych dni ustanie na tym miejscu głos wesela i głos radości, głos oblubieńca i głos oblubienicy."
"Jr16,10": "A gdy ogłosisz temu ludowi wszystkie te słowa, a zapytają cię: Czemu PAN zapowiedział przeciwko nam całe to wielkie nieszczęście? I jaka jest nasza nieprawość, i jaki nasz grzech, który popełniliśmy przeciwko PANU, naszemu Bogu?"
"Jr16,11": "Wtedy powiesz im: Dlatego, że wasi ojcowie opuścili mnie, mówi PAN, i poszli za innymi bogami, służyli im i oddawali im pokłon, mnie zaś opuścili i nie przestrzegali mojego prawa."
"Jr16,12": "A wy czyniliście jeszcze gorzej niż wasi ojcowie, bo oto każdy z was postępuje według uporu swego złego serca, nie słuchając mnie;"
"Jr16,13": "Dlatego wyrzucę was z tej ziemi do ziemi, której nie znaliście, ani wy, ani wasi ojcowie, i tam będziecie służyć innym bogom dniem i nocą, gdzie nie okażę wam miłosierdzia."
"Jr16,14": "Dlatego oto nadchodzą dni, mówi PAN, że już nie będą mówić: Jak żyje PAN, który wyprowadził synów Izraela z ziemi Egiptu;"
"Jr16,15": "Ale: Jak żyje PAN, który wyprowadził synów Izraela z ziemi północnej i ze wszystkich ziem, do których ich wygnał. I sprowadzę ich znowu do ich ziemi, którą dałem ich ojcom."
"Jr16,16": "Oto poślę po wielu rybaków, mówi PAN, i ci ich wyłowią; potem poślę po wielu myśliwych, i ci ich upolują na każdej górze i na każdym pagórku, i w rozpadlinach skalnych."
"Jr16,17": "Moje oczy bowiem patrzą na wszystkie ich drogi. Nie są ukryte przed moim obliczem ani ich nieprawość nie jest zakryta przed moimi oczami."
"Jr16,18": "Najpierw odpłacę im podwójnie za ich nieprawości i za ich grzechy, za to, że zbezcześcili moją ziemię trupami swoich obrzydliwości i napełnili moje dziedzictwo swoimi ohydami."
"Jr16,19": "PANIE, moja mocy i siło, moja ucieczko w dniu utrapienia! Do ciebie przyjdą poganie od krańców ziemi i powiedzą: Zaprawdę, nasi ojcowie odziedziczyli kłamstwa i marności, w których nie było żadnego pożytku."
"Jr16,20": "Czy człowiek może uczynić sobie bogów? Przecież to nie są bogowie."
"Jr16,21": "Dlatego oto ja sprawię, że poznają tym razem; sprawię, że poznają moją rękę i moc, i dowiedzą się, że moje imię to PAN."
