"Jr19,1":
  text: "Tak mówi PAN: Idź i kup dzban gliniany od garncarza, weź ze sobą kilka osób spośród starszych ludu i starszych kapłanów;"
  tags: []
"Jr19,2":
  text: "Wyjdź do doliny syna Hinnom, która znajduje się przy wejściu do Bramy Wschodniej, i głoś tam słowa, które do ciebie będę mówić."
  tags: []
"Jr19,3":
  text: "Powiedz: Słuchajcie słowa PANA, królowie Judy i mieszkańcy Jerozolimy! Tak mówi PAN zastępów, Bóg Izraela: Oto sprowadzę nieszczęście na to miejsce, a każdemu, kto usłyszy, zaszumi w uszach."
  tags: []
"Jr19,4":
  text: "Ponieważ mnie opuścili i zbezcześcili to miejsce, paląc w nim kadzidło innym bogom, których nie znali oni ani ich ojcowie oraz królowie Judy, i napełnili to miejsce krwią niewinnych;"
  tags: []
"Jr19,5":
  text: "I pobudowali wyżyny Baalowi, aby spalić swoich synów w ogniu jako całopalenia dla Baala, czego im nie nakazałem ani nie mówiłem i co nie przyszło mi nawet na myśl."
  tags: []
"Jr19,6":
  text: "Dlatego oto nadchodzą dni, mówi PAN, w których to miejsce nie będzie już nazywane Tofet ani Doliną Syna Hinnom, ale Doliną Rzezi."
  tags: []
"Jr19,7":
  text: "I wniwecz obrócę radę Judy i Jerozolimy na tym miejscu i sprawię, że padną od miecza przed swoimi wrogami i od ręki tych, którzy czyhają na ich życie. I wydam ich trupy na pożarcie ptactwu nieba i zwierzętom ziemi."
  tags: []
"Jr19,8":
  text: "Wydam także to miasto na spustoszenie i na świstanie; każdy, kto będzie przechodził obok, zdumieje się i będzie świstać z powodu wszystkich jego plag."
  tags: []
"Jr19,9":
  text: "I sprawię, że będą jeść ciała swoich synów i ciała swoich córek, a każdy z nich będzie jeść ciało swego bliźniego podczas oblężenia i w ucisku, którymi ścisną ich wrogowie i ci, którzy czyhają na ich życie."
  tags: []
"Jr19,10":
  text: "Potem stłucz ten dzban na oczach tych mężczyzn, którzy pójdą z tobą;"
  tags: []
"Jr19,11":
  text: "I powiedz im: Tak mówi PAN zastępów: Tak samo rozbiję ten lud i to miasto, jak tłucze się naczynie garncarskie, którego nie można potem naprawić. I będą grzebać zmarłych w Tofet, bo nie będzie innego miejsca na grzebanie."
  tags: []
"Jr19,12":
  text: "Tak uczynię temu miejscu, mówi PAN, i jego mieszkańcom, i postąpię z tym miastem tak jak z Tofet."
  tags: []
"Jr19,13":
  text: "I domy Jerozolimy i domy królów Judy będą nieczyste jak to miejsce Tofet z powodu wszystkich domów, na których dachach palili kadzidło wszystkim zastępom nieba i wylewali ofiary z płynów innym bogom."
  tags: []
"Jr19,14":
  text: "Wtedy Jeremiasz wrócił z Tofet, dokąd wysłał go PAN, aby tam prorokował, stanął na dziedzińcu domu PANA i powiedział do całego ludu:"
  tags: []
"Jr19,15":
  text: "Tak mówi PAN zastępów, Bóg Izraela: Oto sprowadzę na to miasto i na wszystkie okoliczne miasta całe to nieszczęście, które zapowiedziałem przeciwko niemu, bo zatwardzili swój kark, aby nie słuchać moich słów."
  tags: []
