"Jr5,1": "Przebiegnijcie ulice Jerozolimy, wypatrujcie teraz i zobaczcie, szukajcie po jej ulicach, czy znajdziecie człowieka, kogoś, kto by wymierzał sprawiedliwy sąd i szukał prawdy, a przebaczę jej."
"Jr5,2": "Ale choć mówią: Jak żyje PAN, to przecież przysięgają fałszywie."
"Jr5,3": "PANIE, czy twoje oczy nie są zwrócone ku prawdzie? Biłeś ich, ale oni nie czują bólu; obróciłeś ich wniwecz, ale nie chcą przyjąć pouczenia. Uczynili swe twarze twardszymi od skały, nie chcą się nawrócić."
"Jr5,4": "Wtedy powiedziałem: Naprawdę oni są nędzni i głupio postępują. Nie znają bowiem drogi PANA ani sądu swego Boga."
"Jr5,5": "Pójdę do wielkich i będę mówił do nich, bo oni znają drogę PANA i sąd swego Boga. Lecz oni również złamali jarzmo, zerwali więzy."
"Jr5,6": "Dlatego zabije ich lew z lasu, wilk wieczorny wygubi ich, lampart będzie czyhać przy ich miastach. Ktokolwiek z nich wyjdzie, zostanie rozszarpany. Rozmnożyły się bowiem ich przestępstwa i wzmogły ich odstępstwa."
"Jr5,7": "Dlaczego miałbym ci to przebaczyć? Twoi synowie opuścili mnie i przysięgają na tych, którzy nie są bogami. Jak tylko ich nakarmiłem, zaraz cudzołożyli i tłumnie zbierali się w domu nierządnicy."
"Jr5,8": "Gdy wstają rano, są jak konie wypasione, każdy z nich rży do żony swego bliźniego."
"Jr5,9": "Czyż za to nie powinienem ich nawiedzić? – mówi PAN. Czy nad takim narodem moja dusza ma się nie zemścić?"
"Jr5,10": "Wstąpcie na jej mury i niszczcie, lecz nie niszczcie doszczętnie. Usuńcie filary jej murów, gdyż nie są od PANA."
"Jr5,11": "Bo dom Izraela i dom Judy zupełnie mi się sprzeniewierzyły, mówi PAN."
"Jr5,12": "Zaparły się PANA i powiedziały: Nie tak, nie spadnie na nas nic złego, nie doznamy miecza ani głodu."
"Jr5,13": "A prorocy przeminą z wiatrem, nie ma w nich żadnego słowa Bożego. Tak im się właśnie stanie."
"Jr5,14": "Dlatego tak mówi PAN, Bóg zastępów: Ponieważ tak mówiliście, oto uczynię moje słowa w twoich ustach ogniem, a ten lud drewnem i pożre ich."
"Jr5,15": "Oto sprowadzę na was, domu Izraela, naród z daleka, mówi PAN. Naród mocny, naród starożytny, naród, którego języka nie znasz ani nie rozumiesz, co mówi."
"Jr5,16": "Jego kołczan jest jak grób otwarty, wszyscy są wojownikami."
"Jr5,17": "Pochłoną twój plon i twój chleb, pochłoną twoich synów i twoje córki. Pochłoną twoje trzody i stada, pochłoną twoją winorośl i twoje drzewa figowe, a twoje miasta warowne, w których pokładasz ufność, zniszczą mieczem."
"Jr5,18": "Lecz w tych dniach, mówi PAN, nie zniszczę was doszczętnie."
"Jr5,19": "Gdy bowiem powiecie: Za co PAN, nasz Bóg, uczynił nam to wszystko? Wtedy im odpowiesz: Jak wy mnie opuściliście i służyliście obcym bogom w swojej ziemi, tak będziecie służyć cudzoziemcom w nie swojej ziemi."
"Jr5,20": "Głoście to w domu Jakuba, a rozgłaszajcie to w Judzie, mówiąc:"
"Jr5,21": "Słuchaj tego teraz, ludu głupi i bezrozumny, wy, którzy macie oczy, a nie widzicie, którzy macie uszy, a nie słyszycie."
"Jr5,22": "Czy mnie nie będziecie się bać? – mówi PAN. Czy nie będziecie się lękać mnie, który położyłem piasek jako granicę morza mocą wieczystej ustawy, a ono jej nie przekroczy. Choćby fale się burzyły, jednak nie przemogą; choćby huczały, jednak nie przeskoczą go."
"Jr5,23": "Ale ten lud ma serce krnąbrne i buntownicze; odstąpił ode mnie i odszedł."
"Jr5,24": "I nie powiedzieli w swoim sercu: Bójmy się PANA, naszego Boga, który daje deszcz jesienny i wiosenny w swoim czasie; który zapewnia nam ustalone tygodnie żniwa."
"Jr5,25": "Ale to wasze nieprawości to odwróciły, a wasze grzechy wstrzymały wam to dobro."
"Jr5,26": "Wśród mego ludu bowiem znajdują się niegodziwcy, którzy czyhają jak łowcy, rozciągają sieci, zastawiają sidła, łapią ludzi."
"Jr5,27": "Jak klatka pełna jest ptaków, tak ich domy pełne są zdrady. Dlatego stali się wielcy i bogaci."
"Jr5,28": "Otyli i rozjaśnili się, innych przewyższają swoją nieprawością. Nie sądzą sprawy, nawet sprawy sierot; jednak powodzi się im, chociaż nie bronią sprawy ubogiego."
"Jr5,29": "Czyż za to nie powinienem ich nawiedzić? – mówi PAN. Czy nad takim narodem moja dusza ma się nie mścić?"
"Jr5,30": "Rzecz przedziwna i straszna dzieje się w tej ziemi:"
"Jr5,31": "Prorocy kłamliwie prorokują i kapłani panują przez ich ręce, a mój lud to kocha. Cóż uczynicie, kiedy nadejdzie koniec?"
