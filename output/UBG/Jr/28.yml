"Jr28,1":
  text: "W tym samym roku, na początku królowania Sedekiasza, króla Judy, w piątym miesiącu czwartego roku, Chananiasz, syn Azzura, prorok, który był z Gibeonu, powiedział do mnie w domu PANA przed kapłanami i przed całym ludem:"
  tags: []
"Jr28,2":
  text: "Tak mówi PAN zastępów, Bóg Izraela: Złamałem jarzmo króla Babilonu."
  tags: []
"Jr28,3":
  text: "W ciągu dwóch lat sprowadzę z powrotem na to miejsce wszystkie naczynia domu PANA, które Nabuchodonozor, król Babilonu, zabrał z tego miejsca i zawiózł je do Babilonu."
  tags: []
"Jr28,4":
  text: "Także Jechoniasza, syna Joakima, króla Judy, i wszystkich uprowadzonych z Judy, którzy dostali się do Babilonu, ja sprowadzę z powrotem na to miejsce, mówi PAN. Skruszę bowiem jarzmo króla Babilonu."
  tags: []
"Jr28,5":
  text: "Wtedy prorok Jeremiasz powiedział do proroka Chananiasza wobec kapłanów i wobec całego ludu, który stał w domu PANA;"
  tags: []
"Jr28,6":
  text: "Prorok Jeremiasz powiedział: Amen, niech PAN tak uczyni! Niech PAN utwierdzi twoje słowa, które prorokowałeś, że sprowadzi z Babilonu na to miejsce naczynia domu PANA i wszystkich, którzy zostali uprowadzeni do niewoli."
  tags: []
"Jr28,7":
  text: "Posłuchaj jednak teraz tego słowa, które ja mówię do twoich uszu i do uszu całego tego ludu:"
  tags: []
"Jr28,8":
  text: "Prorocy, którzy byli przede mną i przed tobą od dawna, prorokowali przeciwko wielu ziemiom i przeciwko wielkim królestwom o wojnie, o nieszczęściu i o zarazie."
  tags: []
"Jr28,9":
  text: "Ten prorok, który prorokuje o pokoju, dopiero będzie uznany za proroka, którego PAN posłał, gdy spełni się jego słowo."
  tags: []
"Jr28,10":
  text: "Wtedy prorok Chananiasz zdjął jarzmo z szyi proroka Jeremiasza i złamał je."
  tags: []
"Jr28,11":
  text: "I Chananiasz powiedział wobec całego ludu: Tak mówi PAN: Tak złamię jarzmo Nabuchodonozora, króla Babilonu, znad szyi wszystkich narodów w ciągu dwóch lat. I prorok Jeremiasz poszedł swoją drogą."
  tags: []
"Jr28,12":
  text: "Po jakimś czasie od złamania jarzma na szyi proroka Jeremiasza przez proroka Chananiasza doszło do Jeremiasza słowo PANA mówiące:"
  tags: []
"Jr28,13":
  text: "Idź i powiedz Chananiaszowi: Tak mówi PAN: Złamałeś jarzma drewniane, ale sporządzisz zamiast nich jarzma żelazne."
  tags: []
"Jr28,14":
  text: "Tak bowiem mówi PAN zastępów, Bóg Izraela: Włożę jarzmo żelazne na szyję wszystkich tych narodów, aby służyły Nabuchodonozorowi, królowi Babilonu; i będą mu służyły. Poddałem mu nawet zwierzęta polne."
  tags: []
"Jr28,15":
  text: "Potem prorok Jeremiasz powiedział do proroka Chananiasza: Posłuchaj teraz, Chananiaszu! PAN cię nie posłał, a sprawiasz, że ludzie ufają kłamstwu."
  tags: []
"Jr28,16":
  text: "Dlatego tak mówi PAN: Oto usunę cię z powierzchni ziemi. Umrzesz w tym roku, bo głosiłeś bunt przeciwko PANU."
  tags: []
"Jr28,17":
  text: "I umarł prorok Chananiasz w tym roku, w miesiącu siódmym."
  tags: []
