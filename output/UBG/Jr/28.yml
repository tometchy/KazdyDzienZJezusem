"Jr28,1": "W tym samym roku, na początku królowania Sedekiasza, króla Judy, w piątym miesiącu czwartego roku, Chananiasz, syn Azzura, prorok, który był z Gibeonu, powiedział do mnie w domu PANA przed kapłanami i przed całym ludem:"
"Jr28,2": "Tak mówi PAN zastępów, Bóg Izraela: Złamałem jarzmo króla Babilonu."
"Jr28,3": "W ciągu dwóch lat sprowadzę z powrotem na to miejsce wszystkie naczynia domu PANA, które Nabuchodonozor, król Babilonu, zabrał z tego miejsca i zawiózł je do Babilonu."
"Jr28,4": "Także Jechoniasza, syna Joakima, króla Judy, i wszystkich uprowadzonych z Judy, którzy dostali się do Babilonu, ja sprowadzę z powrotem na to miejsce, mówi PAN. Skruszę bowiem jarzmo króla Babilonu."
"Jr28,5": "Wtedy prorok Jeremiasz powiedział do proroka Chananiasza wobec kapłanów i wobec całego ludu, który stał w domu PANA;"
"Jr28,6": "Prorok Jeremiasz powiedział: Amen, niech PAN tak uczyni! Niech PAN utwierdzi twoje słowa, które prorokowałeś, że sprowadzi z Babilonu na to miejsce naczynia domu PANA i wszystkich, którzy zostali uprowadzeni do niewoli."
"Jr28,7": "Posłuchaj jednak teraz tego słowa, które ja mówię do twoich uszu i do uszu całego tego ludu:"
"Jr28,8": "Prorocy, którzy byli przede mną i przed tobą od dawna, prorokowali przeciwko wielu ziemiom i przeciwko wielkim królestwom o wojnie, o nieszczęściu i o zarazie."
"Jr28,9": "Ten prorok, który prorokuje o pokoju, dopiero będzie uznany za proroka, którego PAN posłał, gdy spełni się jego słowo."
"Jr28,10": "Wtedy prorok Chananiasz zdjął jarzmo z szyi proroka Jeremiasza i złamał je."
"Jr28,11": "I Chananiasz powiedział wobec całego ludu: Tak mówi PAN: Tak złamię jarzmo Nabuchodonozora, króla Babilonu, znad szyi wszystkich narodów w ciągu dwóch lat. I prorok Jeremiasz poszedł swoją drogą."
"Jr28,12": "Po jakimś czasie od złamania jarzma na szyi proroka Jeremiasza przez proroka Chananiasza doszło do Jeremiasza słowo PANA mówiące:"
"Jr28,13": "Idź i powiedz Chananiaszowi: Tak mówi PAN: Złamałeś jarzma drewniane, ale sporządzisz zamiast nich jarzma żelazne."
"Jr28,14": "Tak bowiem mówi PAN zastępów, Bóg Izraela: Włożę jarzmo żelazne na szyję wszystkich tych narodów, aby służyły Nabuchodonozorowi, królowi Babilonu; i będą mu służyły. Poddałem mu nawet zwierzęta polne."
"Jr28,15": "Potem prorok Jeremiasz powiedział do proroka Chananiasza: Posłuchaj teraz, Chananiaszu! PAN cię nie posłał, a sprawiasz, że ludzie ufają kłamstwu."
"Jr28,16": "Dlatego tak mówi PAN: Oto usunę cię z powierzchni ziemi. Umrzesz w tym roku, bo głosiłeś bunt przeciwko PANU."
"Jr28,17": "I umarł prorok Chananiasz w tym roku, w miesiącu siódmym."
