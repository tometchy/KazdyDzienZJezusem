"Jr45,1": "Słowo, które prorok Jeremiasz wypowiedział do Barucha, syna Neriasza, gdy spisał te słowa w księdze z ust Jeremiasza w czwartym roku Joakima, syna Jozjasza, króla Judy:"
"Jr45,2": "Tak mówi PAN, Bóg Izraela, do ciebie, Baruchu:"
"Jr45,3": "Powiedziałeś: Biada mi teraz! Bo PAN przydaje smutku do mojego bólu; utrudziłem się swoim wzdychaniem i nie znajduję odpoczynku."
"Jr45,4": "Tak powiesz do niego: Tak mówi PAN: Oto co zbudowałem, zburzę, co zasadziłem, wyplenię, tę całą ziemię."
"Jr45,5": "A ty szukasz dla siebie wielkich rzeczy? Nie szukaj. Oto bowiem sprowadzę nieszczęście na wszelkie ciało, mówi PAN. Ale tobie dam twoje życie jako zdobycz we wszystkich miejscach, dokądkolwiek pójdziesz."
