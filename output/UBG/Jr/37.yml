"Jr37,1": "Potem królował król Sedekiasz, syn Jozjasza, w miejsce Choniasza, syna Joakima, którego Nabuchodonozor, król Babilonu, ustanowił królem w ziemi Judy."
"Jr37,2": "Lecz ani on, ani jego słudzy, ani lud tej ziemi nie słuchali słów PANA, które wypowiedział przez proroka Jeremiasza."
"Jr37,3": "Król Sedekiasz jednak posłał Jehuchala, syna Szelemiasza, i Sofoniasza, syna Maasejasza, kapłana, do proroka Jeremiasza, aby powiedzieli: Módl się za nas do PANA, naszego Boga."
"Jr37,4": "Jeremiasz zaś chodził swobodnie wśród ludu, gdyż jeszcze nie wtrącono go do więzienia."
"Jr37,5": "Tymczasem wojsko faraona wyruszyło z Egiptu. A gdy usłyszeli tę wieść Chaldejczycy oblegający Jerozolimę, odstąpili od Jerozolimy."
"Jr37,6": "I słowo PANA doszło do proroka Jeremiasza mówiące:"
"Jr37,7": "To mówi PAN, Bóg Izraela: Tak powiedzcie królowi Judy, który posłał was do mnie, abyście się mnie radzili: Oto wojsko faraona, które wyruszyło wam na pomoc, wróci do swojej ziemi, do Egiptu."
"Jr37,8": "I Chaldejczycy powrócą, i będą walczyli przeciwko temu miastu, zdobędą je i spalą ogniem."
"Jr37,9": "Tak mówi PAN: Nie zwódźcie samych siebie, mówiąc: Z pewnością Chaldejczycy odstąpią od nas. Bo nie odstąpią."
"Jr37,10": "Choćbyście nawet pobili całe wojsko Chaldejczyków, którzy walczą z wami, i zostaliby z nich tylko ranni, to ci powstaliby ze swoich namiotów i ogniem spaliliby to miasto."
"Jr37,11": "A gdy wojsko Chaldejczyków odstąpiło od Jerozolimy przed wojskiem faraona;"
"Jr37,12": "Jeremiasz wychodził z Jerozolimy, aby udać się do ziemi Beniamina, by tym sposobem ujść stamtąd pośród ludu."
"Jr37,13": "A gdy był już w Bramie Beniamina, znajdował się tam dowódca straży, imieniem Jirijasz, syn Szelemiasza, syna Chananiasza; ten pojmał proroka Jeremiasza, mówiąc: Przechodzisz do Chaldejczyków!"
"Jr37,14": "Jeremiasz odpowiedział: Nieprawda, nie przechodzę do Chaldejczyków. Ale tamten nie chciał go słuchać. Jirijasz pojmał Jeremiasza i przyprowadził go do książąt."
"Jr37,15": "Książęta rozgniewali się na Jeremiasza, bili go i wsadzili do więzienia w domu Jonatana, pisarza, bo ten zamieniono na więzienie."
"Jr37,16": "A gdy Jeremiasz wszedł do tego lochu i do celi, i siedział tam Jeremiasz przez wiele dni;"
"Jr37,17": "Wtedy król Sedekiasz posłał, aby go przyprowadzono. I król wypytywał go potajemnie w swoim domu: Czy jest jakieś słowo od PANA? Jeremiasz odpowiedział: Jest. I dodał: Będziesz wydany w ręce króla Babilonu."
"Jr37,18": "Nadto Jeremiasz powiedział do króla Sedekiasza: Czym zgrzeszyłem przeciwko tobie, twoim sługom lub twemu ludowi, że wsadziliście mnie do tego więzienia?"
"Jr37,19": "Gdzie są wasi prorocy, którzy wam prorokowali, mówiąc: Król Babilonu nie nadciągnie przeciwko wam ani przeciwko tej ziemi."
"Jr37,20": "Teraz więc słuchaj, proszę, królu, mój panie. Niech moja prośba dotrze do ciebie: Nie odsyłaj mnie do domu Jonatana, pisarza, abym tam nie umarł."
"Jr37,21": "Król Sedekiasz rozkazał więc oddać Jeremiasza pod straż na dziedzińcu więzienia i aby dawano mu bochenek chleba dziennie z ulicy Piekarzy, póki nie został wyczerpany cały chleb w mieście. A Jeremiasz pozostał na dziedzińcu więzienia."
