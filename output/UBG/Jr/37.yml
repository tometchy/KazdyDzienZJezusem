"Jr37,1":
  text: "Potem królował król Sedekiasz, syn Jozjasza, w miejsce Choniasza, syna Joakima, którego Nabuchodonozor, król Babilonu, ustanowił królem w ziemi Judy."
  tags: []
"Jr37,2":
  text: "Lecz ani on, ani jego słudzy, ani lud tej ziemi nie słuchali słów PANA, które wypowiedział przez proroka Jeremiasza."
  tags: []
"Jr37,3":
  text: "Król Sedekiasz jednak posłał Jehuchala, syna Szelemiasza, i Sofoniasza, syna Maasejasza, kapłana, do proroka Jeremiasza, aby powiedzieli: Módl się za nas do PANA, naszego Boga."
  tags: []
"Jr37,4":
  text: "Jeremiasz zaś chodził swobodnie wśród ludu, gdyż jeszcze nie wtrącono go do więzienia."
  tags: []
"Jr37,5":
  text: "Tymczasem wojsko faraona wyruszyło z Egiptu. A gdy usłyszeli tę wieść Chaldejczycy oblegający Jerozolimę, odstąpili od Jerozolimy."
  tags: []
"Jr37,6":
  text: "I słowo PANA doszło do proroka Jeremiasza mówiące:"
  tags: []
"Jr37,7":
  text: "To mówi PAN, Bóg Izraela: Tak powiedzcie królowi Judy, który posłał was do mnie, abyście się mnie radzili: Oto wojsko faraona, które wyruszyło wam na pomoc, wróci do swojej ziemi, do Egiptu."
  tags: []
"Jr37,8":
  text: "I Chaldejczycy powrócą, i będą walczyli przeciwko temu miastu, zdobędą je i spalą ogniem."
  tags: []
"Jr37,9":
  text: "Tak mówi PAN: Nie zwódźcie samych siebie, mówiąc: Z pewnością Chaldejczycy odstąpią od nas. Bo nie odstąpią."
  tags: []
"Jr37,10":
  text: "Choćbyście nawet pobili całe wojsko Chaldejczyków, którzy walczą z wami, i zostaliby z nich tylko ranni, to ci powstaliby ze swoich namiotów i ogniem spaliliby to miasto."
  tags: []
"Jr37,11":
  text: "A gdy wojsko Chaldejczyków odstąpiło od Jerozolimy przed wojskiem faraona;"
  tags: []
"Jr37,12":
  text: "Jeremiasz wychodził z Jerozolimy, aby udać się do ziemi Beniamina, by tym sposobem ujść stamtąd pośród ludu."
  tags: []
"Jr37,13":
  text: "A gdy był już w Bramie Beniamina, znajdował się tam dowódca straży, imieniem Jirijasz, syn Szelemiasza, syna Chananiasza; ten pojmał proroka Jeremiasza, mówiąc: Przechodzisz do Chaldejczyków!"
  tags: []
"Jr37,14":
  text: "Jeremiasz odpowiedział: Nieprawda, nie przechodzę do Chaldejczyków. Ale tamten nie chciał go słuchać. Jirijasz pojmał Jeremiasza i przyprowadził go do książąt."
  tags: []
"Jr37,15":
  text: "Książęta rozgniewali się na Jeremiasza, bili go i wsadzili do więzienia w domu Jonatana, pisarza, bo ten zamieniono na więzienie."
  tags: []
"Jr37,16":
  text: "A gdy Jeremiasz wszedł do tego lochu i do celi, i siedział tam Jeremiasz przez wiele dni;"
  tags: []
"Jr37,17":
  text: "Wtedy król Sedekiasz posłał, aby go przyprowadzono. I król wypytywał go potajemnie w swoim domu: Czy jest jakieś słowo od PANA? Jeremiasz odpowiedział: Jest. I dodał: Będziesz wydany w ręce króla Babilonu."
  tags: []
"Jr37,18":
  text: "Nadto Jeremiasz powiedział do króla Sedekiasza: Czym zgrzeszyłem przeciwko tobie, twoim sługom lub twemu ludowi, że wsadziliście mnie do tego więzienia?"
  tags: []
"Jr37,19":
  text: "Gdzie są wasi prorocy, którzy wam prorokowali, mówiąc: Król Babilonu nie nadciągnie przeciwko wam ani przeciwko tej ziemi."
  tags: []
"Jr37,20":
  text: "Teraz więc słuchaj, proszę, królu, mój panie. Niech moja prośba dotrze do ciebie: Nie odsyłaj mnie do domu Jonatana, pisarza, abym tam nie umarł."
  tags: []
"Jr37,21":
  text: "Król Sedekiasz rozkazał więc oddać Jeremiasza pod straż na dziedzińcu więzienia i aby dawano mu bochenek chleba dziennie z ulicy Piekarzy, póki nie został wyczerpany cały chleb w mieście. A Jeremiasz pozostał na dziedzińcu więzienia."
  tags: []
