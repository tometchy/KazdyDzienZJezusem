"Jr14,1":
  text: "Słowo PANA, które doszło do Jeremiasza w związku z suszą:"
  tags: []
"Jr14,2":
  text: "Ziemia Judy płacze, a jej bramy osłabły, w szacie żałobnej siedzą na ziemi, a krzyk Jerozolimy się podnosi."
  tags: []
"Jr14,3":
  text: "Ich szlachetni posyłają swoje sługi po wodę. A gdy przyszli do cystern, nie znaleźli wody i powrócili z pustymi naczyniami. Zapłonęli i zawstydzili się, i zakryli swoje głowy."
  tags: []
"Jr14,4":
  text: "Z powodu spękanej ziemi – bo nie było deszczu na ziemi – oracze ze wstydu zakryli swoje głowy."
  tags: []
"Jr14,5":
  text: "Nawet łania rodząca na polu porzuciła młode, bo nie było trawy."
  tags: []
"Jr14,6":
  text: "A dzikie osły, stojąc na wysokich miejscach, chwyciły wiatr jak smoki; ich oczy osłabły, bo nie było trawy."
  tags: []
"Jr14,7":
  text: "PANIE, chociaż nasze nieprawości świadczą przeciwko nam, działaj przez wzgląd na twoje imię. Liczne są bowiem nasze odstępstwa, zgrzeszyliśmy przeciwko tobie."
  tags: []
"Jr14,8":
  text: "Nadziejo Izraela, jego Zbawicielu w czasie utrapienia, czemu jesteś jak przybysz w tej ziemi, jak podróżny, który zatrzymuje się na nocleg?"
  tags: []
"Jr14,9":
  text: "Czemu jesteś jak człowiek osłupiały albo jak mocarz, który nie może wybawić? Ty jednak jesteś pośród nas, PANIE, i twoje imię jest wzywane nad nami. Nie opuszczaj nas."
  tags: []
"Jr14,10":
  text: "Tak mówi PAN o tym ludzie: Tak kochają błądzić, swoich nóg nie powstrzymają; dlatego PAN nie ma w nich upodobania, teraz wspomina ich nieprawość i nawiedza ich za ich grzechy."
  tags: []
"Jr14,11":
  text: "Potem PAN powiedział do mnie: Nie módl się o dobro tego ludu."
  tags: []
"Jr14,12":
  text: "Gdy będą pościć, nie wysłucham ich wołania, a gdy będą składać całopalenia i ofiarę z pokarmów, nie przyjmę tego, ale wytracę ich mieczem, głodem i zarazą."
  tags: []
"Jr14,13":
  text: "Wtedy powiedziałem: Ach, Panie BOŻE! Oto prorocy mówią im: Nie zobaczycie miecza ani nie dotknie was głód, ale dam wam trwały pokój na tym miejscu."
  tags: []
"Jr14,14":
  text: "I PAN powiedział do mnie: Ci prorocy fałszywie prorokują w moje imię. Nie posłałem ich ani im niczego nie nakazywałem, ani nie mówiłem do nich. Prorokują wam kłamliwe widzenie i wróżbę, marność i urojenie swego serca."
  tags: []
"Jr14,15":
  text: "Dlatego tak mówi PAN o prorokach, którzy prorokują w moje imię, chociaż ich nie posłałem, i którzy mówią: Miecza i głodu nie będzie w tej ziemi. Ci sami prorocy od miecza i głodu zginą."
  tags: []
"Jr14,16":
  text: "A ten lud, któremu oni prorokują, będzie wyrzucony na ulice Jerozolimy z powodu głodu i miecza i nie będzie nikogo, kto by pogrzebał ich samych ani ich żony, ani ich synów i córki. Tak wyleję na nich ich niegodziwość."
  tags: []
"Jr14,17":
  text: "Dlatego powiesz im to słowo: Moje oczy wylewają łzy w nocy i we dnie, bez przerwy, bo dziewicza córka mego ludu została dotknięta wielką klęską, ciosem bardzo bolesnym."
  tags: []
"Jr14,18":
  text: "Jeśli wychodzę na pole – oto pobici mieczem, jeśli wchodzę do miasta – oto ginący od głodu. Tak, zarówno prorok, jak i kapłan kupczą ziemią, a ludzie tego nie zauważają."
  tags: []
"Jr14,19":
  text: "Czy całkowicie odrzucasz Judę? Czy twoja dusza obrzydziła sobie Syjon? Czemu nas bijesz, tak że już nie ma dla nas uzdrowienia? Oczekiwaliśmy pokoju, ale nie ma nic dobrego; oczekiwaliśmy czasu uleczenia, a oto trwoga."
  tags: []
"Jr14,20":
  text: "Uznajemy, PANIE, swoją niegodziwość i nieprawość naszych ojców, bo zgrzeszyliśmy przeciw tobie."
  tags: []
"Jr14,21":
  text: "Nie odrzucaj nas przez wzgląd na twoje imię, nie dopuść do znieważenia tronu swojej chwały. Pamiętaj o swoim przymierzu i nie zrywaj go z nami."
  tags: []
"Jr14,22":
  text: "Czy wśród marności pogan są takie, co spuszczają deszcz? Czy niebiosa mogą same dawać deszcze? Czy to nie ty, PANIE, nasz Boże? Dlatego oczekujemy ciebie, bo ty czynisz to wszystko."
  tags: []
