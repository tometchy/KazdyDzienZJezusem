"Jr44,1":
  text: "Słowo, które doszło do Jeremiasza o wszystkich Żydach mieszkających w ziemi Egiptu, którzy mieszkali w Migdol, w Tachpanches, w Nof i w ziemi Patros, mówiące:"
  tags: []
"Jr44,2":
  text: "Tak mówi PAN zastępów, Bóg Izraela: Wy widzieliście wszystkie nieszczęścia, które sprowadziłem na Jerozolimę i na wszystkie miasta Judy, a oto są dzisiaj spustoszeniem, nie ma w nich mieszkańców."
  tags: []
"Jr44,3":
  text: "Z powodu ich niegodziwości, którą popełniali, aby pobudzać mnie do gniewu, gdy palili kadzidło i służyli innym bogom, których nie znali ani oni, ani wy, ani wasi ojcowie;"
  tags: []
"Jr44,4":
  text: "Chociaż posyłałem do was wszystkie moje sługi, proroków, z wczesnym wstawaniem i przesłaniem, mówiąc: Nie czyńcie, proszę, tej obrzydliwości, której nienawidzę."
  tags: []
"Jr44,5":
  text: "Ale oni nie usłuchali ani nie nakłonili swego ucha, aby odwrócić się od swojej niegodziwości i nie palić kadzidła innym bogom."
  tags: []
"Jr44,6":
  text: "Dlatego został wylany mój gniew i moja zapalczywość zapłonęła w miastach Judy i na ulicach Jerozolimy, tak że stały się pustkowiem i spustoszeniem, jak to jest dzisiaj."
  tags: []
"Jr44,7":
  text: "Dlatego teraz tak mówi PAN, Bóg zastępów, Bóg Izraela: Czemu wyrządzacie swoim duszom to wielkie zło, przyczyniając się do wyniszczenia mężczyzn, kobiet, dzieci i niemowląt spośród Judy, tak, aby nikt z was nie pozostał;"
  tags: []
"Jr44,8":
  text: "Gdyż pobudzacie mnie do gniewu uczynkami swoich rąk, paląc kadzidło innym bogom w ziemi Egiptu, do której weszliście, by tam mieszkać – i abyście byli wyniszczeni, i stali się przekleństwem i hańbą u wszystkich narodów na ziemi?"
  tags: []
"Jr44,9":
  text: "Czy zapomnieliście o niegodziwości waszych ojców, o niegodziwości królów Judy, o niegodziwości ich żon, o waszej niegodziwości i o niegodziwości waszych żon, której się dopuszczały w ziemi Judy i na ulicach Jerozolimy?"
  tags: []
"Jr44,10":
  text: "Po dziś dzień nie ukorzyli się ani się nie boją, ani nie postępują według mojego prawa i moich ustaw, które dałem wam i waszym ojcom."
  tags: []
"Jr44,11":
  text: "Dlatego tak mówi PAN zastępów, Bóg Izraela: Oto zwrócę swoje oblicze przeciwko wam na nieszczęście, aby wyniszczyć całą Judę."
  tags: []
"Jr44,12":
  text: "Wezmę resztę Judy, tych, którzy z uporem poszli do ziemi Egiptu, aby tam przebywać, i wyginą wszyscy w ziemi Egiptu; wyginą od miecza i od głodu, wyginą od najmniejszego do największego; pomrą od miecza i od głodu. I będą przedmiotem złorzeczenia, zdumienia, przekleństwa i hańby."
  tags: []
"Jr44,13":
  text: "Bo nawiedzę tych, którzy mieszkają w ziemi Egiptu, jak nawiedziłem Jerozolimę – mieczem, głodem i zarazą."
  tags: []
"Jr44,14":
  text: "I z reszty Judy, która przybyła do ziemi Egiptu, by tam przebywać, nikt nie ujdzie ani nie ocaleje, by powrócić do ziemi Judy, do której pragną wrócić, by tam zamieszkać. Nikt bowiem nie powróci oprócz tych, którzy ujdą."
  tags: []
"Jr44,15":
  text: "Wtedy wszyscy mężczyźni, którzy wiedzieli, że ich żony paliły kadzidło innym bogom, wszystkie kobiety stojące w wielkiej gromadzie i cały lud, który mieszkał w ziemi Egiptu, w Patros, odpowiedzieli Jeremiaszowi:"
  tags: []
"Jr44,16":
  text: "Co do słowa, które mówiłeś do nas w imię PANA, nie usłuchamy cię."
  tags: []
"Jr44,17":
  text: "Ale na pewno wypełnimy każde słowo, które wyjdzie z naszych ust: będziemy spalać kadzidło królowej niebios i wylewać dla niej ofiary z płynów, jak dotąd czyniliśmy, my i nasi ojcowie, nasi królowie i nasi książęta, w miastach Judy i na ulicach Jerozolimy. Wtedy bowiem najadaliśmy się chleba, było nam dobrze i nic złego nas nie spotkało."
  tags: []
"Jr44,18":
  text: "Lecz odkąd przestaliśmy palić kadzidło królowej niebios i składać jej ofiary z płynów, brakuje nam wszystkiego i giniemy od miecza i głodu."
  tags: []
"Jr44,19":
  text: "A gdy paliliśmy kadzidło królowej niebios i wylewaliśmy dla niej ofiary z płynów, czy bez zgody naszych mężów czyniliśmy placki ku jej czci i składaliśmy jej ofiary z płynów?"
  tags: []
"Jr44,20":
  text: "Wtedy Jeremiasz powiedział do całego ludu: do mężczyzn i kobiet oraz do wszystkich ludzi, którzy mu tak odpowiedzieli:"
  tags: []
"Jr44,21":
  text: "Czy PAN nie pamięta kadzidła, które paliliście w miastach Judy i na ulicach Jerozolimy, wy i wasi ojcowie, wasi królowie i wasi książęta oraz lud ziemi, i czy nie wziął sobie tego do serca?"
  tags: []
"Jr44,22":
  text: "Tak że PAN nie mógł już dłużej znosić zła waszych uczynków i obrzydliwości, które popełnialiście. Dlatego wasza ziemia stała się spustoszeniem i przedmiotem zdumienia i przekleństwa, bez mieszkańców, jak to jest dzisiaj."
  tags: []
"Jr44,23":
  text: "Ponieważ paliliście kadzidło i grzeszyliście przeciw PANU, a nie słuchaliście głosu PANA i nie postępowaliście według jego prawa, jego ustaw i jego świadectw, spotkało was to nieszczęście, jak to jest dzisiaj."
  tags: []
"Jr44,24":
  text: "Następnie Jeremiasz powiedział do całego ludu i do wszystkich kobiet: Słuchajcie słowa PANA, wszyscy z Judy, którzy jesteście w ziemi Egiptu."
  tags: []
"Jr44,25":
  text: "Tak mówi PAN zastępów, Bóg Izraela: Wy i wasze żony wypowiadaliście to własnymi ustami i spełnialiście to swoimi rękami, mówiąc: Na pewno wypełnimy swoje śluby, które złożyliśmy, aby palić kadzidło królowej niebios i składać jej ofiary z płynów. Tak, na pewno spełnicie swoje śluby i wykonacie swoje śluby."
  tags: []
"Jr44,26":
  text: "Dlatego słuchajcie słowa PANA, wszyscy ludzie Judy, którzy mieszkacie w ziemi Egiptu: Oto przysięgam na swoje wielkie imię, mówi PAN, że moje imię nie będzie już wzywane ustami żadnego człowieka z Judy w całej ziemi Egiptu, który by mówił: Jak żyje Pan BÓG!"
  tags: []
"Jr44,27":
  text: "Oto będę czuwał nad nimi ku złemu, a nie ku dobremu. I wszyscy ludzie z Judy, którzy są w ziemi Egiptu, zginą od miecza i głodu, doszczętnie wyginą."
  tags: []
"Jr44,28":
  text: "I tylko mała liczba ujdzie spod miecza, i powróci z ziemi Egiptu do ziemi Judy, a cała reszta Judy, która weszła do ziemi Egiptu, aby tam przebywać, pozna, czyje słowo się spełni: moje czy jej."
  tags: []
"Jr44,29":
  text: "A to będzie dla was znakiem, mówi PAN, że ja was ukarzę w tym miejscu, abyście wiedzieli, że moje słowa na pewno się spełnią ku waszemu nieszczęściu."
  tags: []
"Jr44,30":
  text: "Tak mówi PAN: Oto wydam faraona Chofrę, króla Egiptu, w ręce jego wrogów i w ręce tych, którzy czyhają na jego życie, tak jak wydałem Sedekiasza, króla Judy, w ręce Nabuchodonozora, króla Babilonu, jego wroga, który czyhał na jego życie."
  tags: []
