"Jr1,1":
  text: "Słowa Jeremiasza, syna Chilkiasza, z rodu kapłanów, którzy byli w Anatot, w ziemi Beniamina;"
  tags: []
"Jr1,2":
  text: "Do którego doszło słowo PANA za dni Jozjasza, syna Amona, króla Judy, w trzynastym roku jego panowania."
  tags: []
"Jr1,3":
  text: "Doszło także za dni Joakima, syna Jozjasza, króla Judy, aż do końca jedenastego roku Sedekiasza, syna Jozjasza, króla Judy, aż do uprowadzenia do niewoli mieszkańców Jerozolimy w piątym miesiącu;"
  tags: []
"Jr1,4":
  text: "Doszło do mnie słowo PANA mówiące:"
  tags: []
"Jr1,5":
  text: "Zanim ukształtowałem cię w łonie, znałem cię, zanim wyszedłeś z łona, uświęciłem cię i ustanowiłem prorokiem dla narodów."
  tags: []
"Jr1,6":
  text: "Wtedy powiedziałem: Ach, Panie BOŻE! Oto nie umiem mówić, bo jestem dzieckiem."
  tags: []
"Jr1,7":
  text: "Ale PAN powiedział do mnie: Nie mów: Jestem dzieckiem. Pójdziesz bowiem, do kogokolwiek cię poślę, i będziesz mówił, cokolwiek ci rozkażę."
  tags: []
"Jr1,8":
  text: "Nie bój się ich twarzy, bo ja jestem z tobą, aby cię wybawić, mówi PAN."
  tags: []
"Jr1,9":
  text: "Wtedy PAN wyciągnął swoją rękę i dotknął moich ust. I powiedział do mnie PAN: Oto wkładam moje słowa do twoich ust."
  tags: []
"Jr1,10":
  text: "Patrz, dziś ustanawiam cię nad narodami i królestwami, abyś wykorzeniał, burzył, wytracał i niszczył, byś budował i sadził."
  tags: []
"Jr1,11":
  text: "Potem doszło do mnie słowo PANA mówiące: Co widzisz, Jeremiaszu? I odpowiedziałem: Widzę gałązkę migdałowca."
  tags: []
"Jr1,12":
  text: "I PAN powiedział do mnie: Dobrze widzisz. Ja bowiem przyspieszam swoje słowo, aby je wykonać."
  tags: []
"Jr1,13":
  text: "Ponownie doszło do mnie słowo PANA mówiące: Co widzisz? Odpowiedziałem: Widzę wrzący kocioł, a jego przednia strona skierowana jest ku północy."
  tags: []
"Jr1,14":
  text: "I PAN powiedział do mnie: Od północy spadnie nieszczęście na wszystkich mieszkańców tej ziemi;"
  tags: []
"Jr1,15":
  text: "Bo oto zwołam wszystkie rody z królestw północnych, mówi PAN, i przyjdą, a każdy z nich ustawi swój tron u wejścia do bram Jerozolimy, przeciw wszystkim jej murom i przeciw miastom Judy."
  tags: []
"Jr1,16":
  text: "I ogłoszę przeciwko nim moje sądy za całą ich niegodziwość: przeciwko tym, którzy mnie opuścili, palili kadzidło innym bogom i oddali pokłon dziełom swoich rąk."
  tags: []
"Jr1,17":
  text: "Dlatego ty przepasz swoje biodra, wstań i mów do nich wszystko, co ci nakazuję. Nie bój się ich twarzy, bym cię nie napełnił lękiem przed nimi."
  tags: []
"Jr1,18":
  text: "Oto bowiem ustanawiam cię dziś miastem obronnym, żelazną kolumną i murem spiżowym przeciwko całej tej ziemi, przeciwko królom Judy, ich książętom, ich kapłanom i ludowi tej ziemi."
  tags: []
"Jr1,19":
  text: "I będą walczyć przeciwko tobie, ale cię nie przemogą, bo ja jestem z tobą, mówi PAN, aby cię wybawić."
  tags: []
