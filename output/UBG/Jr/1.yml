"Jr1,1": "Słowa Jeremiasza, syna Chilkiasza, z rodu kapłanów, którzy byli w Anatot, w ziemi Beniamina;"
"Jr1,2": "Do którego doszło słowo PANA za dni Jozjasza, syna Amona, króla Judy, w trzynastym roku jego panowania."
"Jr1,3": "Doszło także za dni Joakima, syna Jozjasza, króla Judy, aż do końca jedenastego roku Sedekiasza, syna Jozjasza, króla Judy, aż do uprowadzenia do niewoli mieszkańców Jerozolimy w piątym miesiącu;"
"Jr1,4": "Doszło do mnie słowo PANA mówiące:"
"Jr1,5": "Zanim ukształtowałem cię w łonie, znałem cię, zanim wyszedłeś z łona, uświęciłem cię i ustanowiłem prorokiem dla narodów."
"Jr1,6": "Wtedy powiedziałem: Ach, Panie BOŻE! Oto nie umiem mówić, bo jestem dzieckiem."
"Jr1,7": "Ale PAN powiedział do mnie: Nie mów: Jestem dzieckiem. Pójdziesz bowiem, do kogokolwiek cię poślę, i będziesz mówił, cokolwiek ci rozkażę."
"Jr1,8": "Nie bój się ich twarzy, bo ja jestem z tobą, aby cię wybawić, mówi PAN."
"Jr1,9": "Wtedy PAN wyciągnął swoją rękę i dotknął moich ust. I powiedział do mnie PAN: Oto wkładam moje słowa do twoich ust."
"Jr1,10": "Patrz, dziś ustanawiam cię nad narodami i królestwami, abyś wykorzeniał, burzył, wytracał i niszczył, byś budował i sadził."
"Jr1,11": "Potem doszło do mnie słowo PANA mówiące: Co widzisz, Jeremiaszu? I odpowiedziałem: Widzę gałązkę migdałowca."
"Jr1,12": "I PAN powiedział do mnie: Dobrze widzisz. Ja bowiem przyspieszam swoje słowo, aby je wykonać."
"Jr1,13": "Ponownie doszło do mnie słowo PANA mówiące: Co widzisz? Odpowiedziałem: Widzę wrzący kocioł, a jego przednia strona skierowana jest ku północy."
"Jr1,14": "I PAN powiedział do mnie: Od północy spadnie nieszczęście na wszystkich mieszkańców tej ziemi;"
"Jr1,15": "Bo oto zwołam wszystkie rody z królestw północnych, mówi PAN, i przyjdą, a każdy z nich ustawi swój tron u wejścia do bram Jerozolimy, przeciw wszystkim jej murom i przeciw miastom Judy."
"Jr1,16": "I ogłoszę przeciwko nim moje sądy za całą ich niegodziwość: przeciwko tym, którzy mnie opuścili, palili kadzidło innym bogom i oddali pokłon dziełom swoich rąk."
"Jr1,17": "Dlatego ty przepasz swoje biodra, wstań i mów do nich wszystko, co ci nakazuję. Nie bój się ich twarzy, bym cię nie napełnił lękiem przed nimi."
"Jr1,18": "Oto bowiem ustanawiam cię dziś miastem obronnym, żelazną kolumną i murem spiżowym przeciwko całej tej ziemi, przeciwko królom Judy, ich książętom, ich kapłanom i ludowi tej ziemi."
"Jr1,19": "I będą walczyć przeciwko tobie, ale cię nie przemogą, bo ja jestem z tobą, mówi PAN, aby cię wybawić."
