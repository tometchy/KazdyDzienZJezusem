"Jr41,1": "Zdarzyło się, że w siódmym miesiącu Izmael, syn Netaniasza, syna Eliszamy, z potomstwa króla, a wraz z nim dowódcy króla w liczbie dziesięciu mężczyzn przybyli do Gedaliasza, syna Achikama, do Mispy, i razem spożywali tam posiłek, w Mispie."
"Jr41,2": "Potem wstał Izmael, syn Netaniasza, oraz dziesięciu mężczyzn, którzy z nim byli, i zabili mieczem Gedaliasza, syna Achikama, syna Szafana; zabili tego, którego król Babilonu ustanowił namiestnikiem w ziemi."
"Jr41,3": "Izmael zabił też wszystkich Żydów, którzy byli z nim, z Gedaliaszem, w Mispie, oraz Chaldejczyków, którzy się tam znajdowali, a także wojowników."
"Jr41,4": "Na drugi dzień po zabójstwie Gedaliasza, gdy nikt o tym jeszcze nie wiedział;"
"Jr41,5": "Przyszli ludzie z Sychem, z Szilo i Samarii w liczbie osiemdziesięciu, z ogolonymi brodami, w rozdartych szatach i z nacięciami na ciele, mając w rękach ofiary i kadzidło, aby je złożyć w domu PANA."
"Jr41,6": "Wtedy Izmael, syn Netaniasza, wyszedł im naprzeciw z Mispy, a gdy szedł, płakał. Gdy ich spotkał, powiedział do nich: Chodźcie do Gedaliasza, syna Achikama."
"Jr41,7": "Ale gdy weszli do miasta, zabił ich Izmael, syn Netaniasza, i wrzucił do cysterny, on i mężczyźni, którzy z nim byli."
"Jr41,8": "Lecz pośród tamtych znalazło się dziesięciu, którzy powiedzieli do Izmaela: Nie zabijaj nas, bo mamy ukryte w polu skarby: pszenicę i jęczmień, oliwę i miód. Wstrzymał się więc i nie zabił ich razem z ich braćmi."
"Jr41,9": "A cysterna, do której Izmael wrzucił wszystkie zwłoki tych mężczyzn, których zabił z powodu Gedaliasza, była tą samą, którą wykonał król Asa z obawy przed Baszą, królem Izraela. Tę cysternę Izmael, syn Netaniasza, wypełnił zabitymi."
"Jr41,10": "Potem Izmael uprowadził do niewoli resztę ludu, który był w Mispie: córki króla i cały lud, który pozostał w Mispie, a których Nebuzaradan, dowódca gwardii, powierzył Gedaliaszowi, synowi Achikama. Izmael, syn Netaniasza, uprowadził ich i wyruszył, by przejść do synów Ammona."
"Jr41,11": "Gdy jednak Jochanan, syn Kareacha, i wszyscy dowódcy wojsk, którzy byli z nim, usłyszeli o całej tej niegodziwości, którą popełnił Izmael, syn Netaniasza;"
"Jr41,12": "Zebrali wszystkich mężczyzn i nadciągnęli, aby walczyć z Izmaelem, synem Netaniasza. I znaleźli go przy wielkich wodach, które są w Gibeonie."
"Jr41,13": "Gdy cały lud, który był z Izmaelem, zobaczył Jochanana, syna Kareacha, i wszystkich dowódców wojsk, którzy z nim byli, uradował się."
"Jr41,14": "Cały lud więc, który Izmael uprowadził do niewoli z Mispy, odwrócił się i ruszył z powrotem, i przyszedł do Jochanana, syna Kareacha."
"Jr41,15": "Izmael zaś, syn Netaniasza, uciekł z ośmioma mężczyznami przed Jochananem i przybył do synów Ammona."
"Jr41,16": "Wtedy Jochanan, syn Kareacha, wraz ze wszystkimi dowódcami wojsk, którzy z nim byli, zebrał całą resztę ludu, który odzyskał od Izmaela, syna Netaniasza, z Mispy, po zabójstwie Gedaliasza, syna Achikama, walecznych wojowników, kobiety, dzieci i eunuchów, których przywiódł z powrotem z Gibeonu;"
"Jr41,17": "Odeszli i zatrzymali się w gospodzie Kimhama, w pobliżu Betlejem, zamierzając udać się do Egiptu;"
"Jr41,18": "Z obawy przed Chaldejczykami. Bali się ich bowiem, ponieważ Izmael, syn Netaniasza, zabił Gedaliasza, syna Achikama, którego król Babilonu ustanowił namiestnikiem w ziemi."
