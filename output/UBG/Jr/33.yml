"Jr33,1":
  text: "I słowo PANA doszło do Jeremiasza po raz drugi, gdy ten był jeszcze zamknięty na dziedzińcu więzienia, mówiące:"
  tags: []
"Jr33,2":
  text: "Tak mówi PAN, Sprawca tego: PAN, który to ukształtował i utwierdził; PAN to jego imię."
  tags: []
"Jr33,3":
  text: "Wołaj do mnie, a odpowiem ci i oznajmię ci rzeczy wielkie i ukryte, których nie znasz."
  tags: []
"Jr33,4":
  text: "Tak bowiem mówi PAN, Bóg Izraela, o domach tego miasta i o domach królów Judy, które są zburzone dzięki taranom i mieczom:"
  tags: []
"Jr33,5":
  text: "Idą, aby walczyć z Chaldejczykami, ale napełnią te domy trupami ludzi, których pobiłem w swoim gniewie i w swojej zapalczywości i zakryłem swoje oblicze przed tym miastem z powodu całej ich niegodziwości."
  tags: []
"Jr33,6":
  text: "Oto dam mu zdrowie i uleczenie, i uzdrowię ich oraz objawię im obfitość pokoju i prawdy."
  tags: []
"Jr33,7":
  text: "Odwrócę bowiem niewolę Judy i niewolę Izraela i odbuduję ich jak przedtem."
  tags: []
"Jr33,8":
  text: "Oczyszczę ich z wszelkiej nieprawości, którą zgrzeszyli przeciwko mnie, i przebaczę im wszystkie winy, jakimi zgrzeszyli przeciwko mnie i jakimi wykroczyli przeciwko mnie."
  tags: []
"Jr33,9":
  text: "A będzie dla mnie przyczyną radości, chwałą i ozdobą wśród wszystkich narodów ziemi, które usłyszą o wszelkim dobru, jakie im wyświadczam. Zlękną się i zadrżą z powodu całej tej dobroci i pomyślności, które im przygotowuję."
  tags: []
"Jr33,10":
  text: "Tak mówi PAN: Na tym miejscu, o którym wy mówicie: Zostanie spustoszone, pozbawione człowieka i zwierzęcia, w miastach Judy i na ulicach Jerozolimy, spustoszonych, bezludnych i pozbawionych mieszkańców i zwierząt, znów będzie słychać;"
  tags: []
"Jr33,11":
  text: "Głos radości i głos wesela, głos oblubieńca i głos oblubienicy, głos tych, którzy mówią: Wysławiajcie PANA zastępów, bo PAN jest dobry, bo jego miłosierdzie trwa na wieki; to głos przynoszących ofiarę chwały do domu PANA. Odwrócę bowiem niewolę tej ziemi, jak na początku, mówi PAN."
  tags: []
"Jr33,12":
  text: "Tak mówi PAN zastępów: Znowu na tym spustoszonym miejscu bez ludzi i zwierząt i we wszystkich jego miastach będzie schronisko dla pasterzy, dających trzodom odpoczynek."
  tags: []
"Jr33,13":
  text: "W miastach górskich, w miastach na równinach i w miastach na południu, w ziemi Beniamina i w okolicach Jerozolimy oraz w miastach Judy znowu będą przechodzić trzody pod ręką tego, który je liczy, mówi PAN."
  tags: []
"Jr33,14":
  text: "Oto nadchodzą dni, mówi PAN, kiedy utwierdzę to dobre słowo, które zapowiedziałem domowi Izraela i domowi Judy."
  tags: []
"Jr33,15":
  text: "W tych dniach i w tym czasie sprawię, że wyrośnie Dawidowi Latorośl sprawiedliwa. Będzie on sprawował sąd i wymierzał sprawiedliwość na ziemi."
  tags: []
"Jr33,16":
  text: "W tych dniach Juda będzie zbawiona, a Jerozolima będzie mieszkać bezpiecznie. A takie jest imię, którym będą ją nazywać: PAN naszą sprawiedliwością."
  tags: []
"Jr33,17":
  text: "Tak bowiem mówi PAN: Nie zabraknie Dawidowi potomka zasiadającego na tronie domu Izraela."
  tags: []
"Jr33,18":
  text: "Kapłanom Lewitom też nie zabraknie przede mną człowieka, by składał całopalenia, spalał ofiary z pokarmów i składał ofiary przez wszystkie dni."
  tags: []
"Jr33,19":
  text: "Następnie do Jeremiasza doszło słowo PANA mówiące:"
  tags: []
"Jr33,20":
  text: "Tak mówi PAN: Jeśli będziecie mogli złamać moje przymierze z dniem i moje przymierze z nocą, aby nie było dnia ani nocy w swoim czasie;"
  tags: []
"Jr33,21":
  text: "Wtedy też będzie złamane moje przymierze z Dawidem, moim sługą, aby nie miał syna, który by królował na jego tronie, i z Lewitami kapłanami, moimi sługami."
  tags: []
"Jr33,22":
  text: "Jak niezliczone są zastępy niebios i niezmierzony piasek morski tak rozmnożę potomstwo Dawida, mojego sługi, i Lewitów, którzy mi służą."
  tags: []
"Jr33,23":
  text: "Ponownie do Jeremiasza doszło słowo PANA mówiące:"
  tags: []
"Jr33,24":
  text: "Czyż nie widzisz, co ten lud mówi: Dwa rody, które PAN wybrał, już odrzucił! Tak więc gardzą moim ludem, jakby już nie był narodem w ich oczach."
  tags: []
"Jr33,25":
  text: "Tak mówi PAN: Jeśli nie istnieje moje przymierze z dniem i nocą i jeśli nie ustaliłem praw dla niebios i ziemi;"
  tags: []
"Jr33,26":
  text: "Wtedy potomstwo Jakuba i Dawida, mego sługi, odrzucę, aby nie brać z jego rodu tych, którzy mieliby panować nad potomstwem Abrahama, Izaaka i Jakuba. Odwrócę bowiem ich niewolę i zlituję się nad nimi."
  tags: []
