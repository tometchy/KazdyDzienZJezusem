"Jr23,1": "Biada pasterzom, którzy gubią i rozpraszają trzodę mego pastwiska! – mówi PAN."
"Jr23,2": "Dlatego tak mówi PAN, Bóg Izraela, do pasterzy, którzy pasą mój lud: Wy rozpraszacie moje owce i rozganiacie je, a nie nawiedzaliście ich. Oto nawiedzę was za zło waszych uczynków, mówi PAN."
"Jr23,3": "I zgromadzę resztkę moich owiec ze wszystkich krajów, do których je rozpędziłem, i sprowadzę je do ich owczarni; będą płodne i rozmnożą się."
"Jr23,4": "Ustanowię nad nimi pasterzy, którzy będą je paść, aby już się nie lękały i nie trwożyły, i aby żadna z nich nie zginęła, mówi PAN."
"Jr23,5": "Oto nadchodzą dni, mówi PAN, w których wzbudzę Dawidowi sprawiedliwą Latorośl i będzie panować Król, i będzie mu się szczęściło; będzie wykonywał sąd i sprawiedliwość na ziemi."
"Jr23,6": "Za jego dni Juda będzie zbawiona, a Izrael będzie mieszkał bezpiecznie. A to jest jego imię, którym będą go nazywać: PAN NASZĄ SPRAWIEDLIWOŚCIĄ."
"Jr23,7": "Dlatego oto nadejdą dni, mówi PAN, że nie będą mówić już: Jak żyje PAN, który wyprowadził synów Izraela z ziemi Egiptu;"
"Jr23,8": "Ale: Jak żyje PAN, który wyprowadził i który sprowadził potomstwo domu Izraela z kraju północnego i ze wszystkich krajów, do których rozpędziłem ich, i będą mieszkać w swojej ziemi."
"Jr23,9": "Moje serce pęka we mnie z powodu proroków, wszystkie moje kości drżą; jestem jak człowiek pijany, jak człowiek, którego zmogło wino, z powodu PANA i z powodu słów jego świętości."
"Jr23,10": "Ziemia bowiem jest pełna cudzołożników i płacze z powodu przekleństwa; pastwiska na pustkowiu wyschły; ich dążenia są niegodziwe, a ich siła jest niewłaściwa."
"Jr23,11": "Bo zarówno prorok, jak i kapłan są obłudnikami, nawet w moim domu znajduje się ich niegodziwość, mówi PAN."
"Jr23,12": "Dlatego ich droga stanie się dla nich jak ślizgawica w ciemności, na którą będą popędzeni i upadną, gdy sprowadzę na nich nieszczęście w roku, kiedy ich nawiedzę, mówi PAN."
"Jr23,13": "Widziałem u proroków Samarii głupstwo: prorokowali w imię Baala i zwodzili mój lud Izraela."
"Jr23,14": "A u proroków Jerozolimy widziałem okropność: cudzołożą i postępują kłamliwie, utwierdzają też ręce złoczyńców, tak że żaden z nich nie odwraca się od swojej niegodziwości. Wszyscy stali się dla mnie jak Sodoma, a jego mieszkańcy jak Gomora."
"Jr23,15": "Dlatego tak mówi PAN zastępów o tych prorokach: Oto nakarmię ich piołunem i napoję ich wodą żółci, bo od proroków Jerozolimy rozeszła się niegodziwość na całą tę ziemię."
"Jr23,16": "Tak mówi PAN zastępów: Nie słuchajcie słów tych proroków, którzy wam prorokują. Oni was zwodzą, zwiastują wam widzenie własnego serca, a nie z ust PANA."
"Jr23,17": "Nieustannie mówią tym, którzy mną gardzą: PAN mówił: Będziecie mieć pokój. A każdemu, który postępuje według uporu swego serca, mówią: Nie spotka was nic złego."
"Jr23,18": "Któż bowiem stał w radzie PANA, widział i słyszał jego słowo? Kto rozważył jego słowa i usłyszał je?"
"Jr23,19": "Oto wicher PANA wyjdzie z zapalczywością, wicher ciężki spadnie na głowę bezbożnych;"
"Jr23,20": "Nie odwróci się gniew PANA, aż spełni i wykona on myśli swego serca. W ostatecznych czasach dokładnie to zrozumiecie."
"Jr23,21": "Nie posłałem tych proroków, a oni jednak pobiegli. Nie mówiłem do nich, oni jednak prorokowali."
"Jr23,22": "Lecz gdyby stali w mojej radzie i głosili mojemu ludowi moje słowa, odwróciliby go od jego złej drogi i od zła jego uczynków."
"Jr23,23": "Czy jestem tylko Bogiem z bliska? – mówi PAN, a nie Bogiem także z daleka?"
"Jr23,24": "Czy może się kto schować w ukryciu, abym go nie widział? – mówi PAN. Czy nie wypełniam nieba i ziemi? – mówi PAN."
"Jr23,25": "Słyszałem, co mówią prorocy, którzy prorokują kłamstwa w moje imię, mówiąc: Miałem sen, miałem sen."
"Jr23,26": "Jak długo to będzie w sercu tych proroków, którzy prorokują kłamstwa? Są przecież prorokami złudy własnego serca;"
"Jr23,27": "Którzy zamierzają sprawić, aby mój lud zapomniał moje imię przez swoje sny, które każdy opowiada swemu bliźniemu, jak ich ojcowie zapomnieli o moim imieniu dla Baala."
"Jr23,28": "Prorok, który ma sen, niech ten sen opowiada, ale ten, który ma moje słowo, niech wiernie mówi moje słowo. Cóż plewie do pszenicy? – mówi PAN."
"Jr23,29": "Czy moje słowo nie jest jak ogień? – mówi PAN – i jak młot, który kruszy skałę?"
"Jr23,30": "Dlatego oto powstaję przeciwko tym prorokom, mówi PAN, którzy kradną moje słowa, każdy kradnie je swojemu bliźniemu."
"Jr23,31": "Oto powstaję przeciwko tym prorokom, mówi PAN, którzy używają swego języka, aby mówić: PAN mówi."
"Jr23,32": "Oto powstaję, mówi PAN, przeciwko tym, którzy prorokują sny kłamliwe, opowiadają je i zwodzą mój lud swymi kłamstwami i plotkami, chociaż ja ich nie posłałem ani im niczego nie rozkazałem. Dlatego nic nie pomagają temu ludowi, mówi PAN."
"Jr23,33": "A gdy ten lud albo prorok lub kapłan zapytają cię: Jakie jest brzemię PANA? – wtedy odpowiesz: Jakie brzemię? – właśnie takie: Opuszczę was, mówi PAN."
"Jr23,34": "A proroka i kapłana oraz ten lud, którzy powiedzą: Brzemię PANA, naprawdę nawiedzę karą – ich i ich dom."
"Jr23,35": "Ale tak mówcie każdy do swego bliźniego i każdy do swego brata: Cóż odpowiedział PAN? albo: Cóż mówił PAN?"
"Jr23,36": "I nie wspomnicie już brzemienia PANA, bo brzemieniem stanie się dla każdego jego słowo, gdyż wy wypaczyliście słowa Boga żywego, PANA zastępów, naszego Boga."
"Jr23,37": "Tak więc powiesz do proroka: Cóż ci odpowiedział PAN? albo: Co mówił PAN?"
"Jr23,38": "Ale ponieważ mówicie: Brzemię PANA, to wtedy tak mówi PAN: Ponieważ mówicie to słowo: Brzemię PANA, chociaż nakazałem wam, mówiąc: Nie mówcie: Brzemię PANA;"
"Jr23,39": "Oto ja zapomnę o was całkowicie i odrzucę sprzed mego oblicza was i to miasto, które dałem wam i waszym ojcom."
"Jr23,40": "I okryję was wieczną wzgardą i wieczną hańbą, która nigdy nie pójdzie w zapomnienie."
