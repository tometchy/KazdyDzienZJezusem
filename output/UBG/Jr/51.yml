"Jr51,1": "Tak mówi PAN: Oto wzbudzę niszczący wiatr przeciwko Babilonowi i przeciwko tym, którzy mieszkają pośród powstających przeciwko mnie;"
"Jr51,2": "I poślę do Babilonu obcych, którzy będą go przewiewać, i opróżnią jego ziemię, gdyż zewsząd zwrócą się przeciwko niemu w dniu ucisku."
"Jr51,3": "Niech łucznik napina swój łuk przeciwko niemu i przeciwko stającym do walki w swoich pancerzach. Nie oszczędzajcie jego młodzieńców, zgładźcie całe jego wojsko."
"Jr51,4": "Tak padną zabici w ziemi Chaldejczyków i przebici na jego ulicach."
"Jr51,5": "Nie są bowiem opuszczone Izrael ani Juda przez swego Boga, PANA zastępów, choć ich ziemia była pełna grzechu przeciwko Świętemu Izraela."
"Jr51,6": "Uciekajcie ze środka Babilonu i niech każdy ratuje swoją duszę. Nie gińcie w jego nieprawości, bo jest to czas zemsty PANA, on oddaje mu zapłatę."
"Jr51,7": "Babilon był złotym kielichem w ręce PANA, upajającym całą ziemię. Z jego wina piły narody, dlatego narody szaleją."
"Jr51,8": "Nagle upadł Babilon i został rozbity. Zawódźcie nad nim, weźcie balsam na jego ból, może da się go wyleczyć."
"Jr51,9": "Leczyliśmy Babilon, ale nie został uleczony. Opuśćmy go i niech każdy pójdzie do swojej ziemi, bo jego sąd aż do nieba sięga i wznosi się aż po obłoki."
"Jr51,10": "PAN ujawnił naszą sprawiedliwość. Chodźcie, głośmy na Syjonie dzieło PANA, naszego Boga."
"Jr51,11": "Wyostrzcie strzały, przygotujcie tarcze. PAN wzbudził ducha królów Medii, bo jego zamiar jest przeciwko Babilonowi, aby go zniszczyć. Jest to bowiem pomsta PANA, pomsta za jego świątynię."
"Jr51,12": "Podnieście sztandar na murach Babilonu, wzmocnijcie straże, postawcie stróżów, przygotujcie zasadzki. PAN bowiem obmyślił i wykonał to, co wypowiedział przeciwko mieszkańcom Babilonu."
"Jr51,13": "Ty, który mieszkasz nad wieloma wodami, bogaty w skarby! Nadszedł twój koniec, kres twojej chciwości."
"Jr51,14": "PAN zastępów przysiągł na siebie samego: Zaprawdę, napełnię cię ludźmi jak szarańczą, wzniosą nad tobą okrzyk wojenny."
"Jr51,15": "On uczynił ziemię swoją mocą, utwierdził świat swoją mądrością i rozpostarł niebiosa swoją roztropnością."
"Jr51,16": "Gdy on wydaje głos, huczą wody w niebiosach, on sprawia, że chmury wznoszą się z krańców ziemi. I czyni błyskawice z deszczem, a wywodzi wiatr ze swoich skarbców."
"Jr51,17": "Głupi jest każdy człowiek, kto tego nie zna, każdy złotnik jest zawstydzony z powodu posągu, bo jego odlany posąg jest fałszem i nie ma w nich ducha."
"Jr51,18": "Są marnością i dziełem błędów; zginą w czasie swego nawiedzenia."
"Jr51,19": "Nie takim jak one jest dział Jakuba, bo on jest Stwórcą wszystkiego, a Izrael jest szczepem jego dziedzictwa. PAN zastępów – to jego imię."
"Jr51,20": "Jesteś moim młotem i orężem wojennym. Tobą zmiażdżę narody, tobą zniszczę królestwa;"
"Jr51,21": "Tobą zmiażdżę konia i jeźdźca, tobą zmiażdżę rydwan i jego woźnicę;"
"Jr51,22": "Tobą zmiażdżę mężczyznę i kobietę, tobą zmiażdżę starca i dziecko, tobą zmiażdżę młodzieńca i pannę;"
"Jr51,23": "Tobą zmiażdżę pasterza i jego trzodę, tobą zmiażdżę oracza i jego zaprzęg, tobą zmiażdżę dowódców i rządców."
"Jr51,24": "Ale odpłacę Babilonowi i wszystkim mieszkańcom Chaldei za całe ich zło, które czynili na Syjonie na waszych oczach, mówi PAN."
"Jr51,25": "Oto jestem przeciwko tobie, góro niszczycielska, mówi PAN, która niszczysz całą ziemię. Wyciągnę swoją rękę przeciwko tobie i strącę cię ze skał, i uczynię cię górą wypaloną."
"Jr51,26": "A nie wezmą z ciebie kamienia węgielnego ani kamienia na fundamenty, bo staniesz się wiecznym pustkowiem, mówi PAN."
"Jr51,27": "Podnieście sztandar w ziemi, zadmijcie w trąbę wśród narodów, przygotujcie przeciwko niemu narody, zwołajcie przeciwko niemu królestwa Ararat, Minni i Aszkenaz; ustanówcie przeciwko niemu dowódcę, sprowadźcie konie jak najeżone szarańcze."
"Jr51,28": "Przygotujcie przeciwko niemu narody, królów Medii, ich dowódców i wszystkich ich rządców, oraz całą ziemię pod ich władzą;"
"Jr51,29": "Wtedy ziemia zadrży i będzie w bólach, gdyż spełnią się przeciwko Babilonowi zamiary PANA, aby zamienić ziemię Babilonu w pustkowie, bez mieszkańców."
"Jr51,30": "Mocarze Babilonu przestali walczyć, siedzą w warowniach, osłabło ich męstwo, stali się jak kobiety. Spalono jego mieszkania, wyłamano jego rygle."
"Jr51,31": "Goniec wybiegnie na spotkanie gońca, posłaniec – na spotkanie posłańca, aby opowiedzieć królowi Babilonu, że wzięto jego miasto z jednej strony;"
"Jr51,32": "Że brody są zajęte, sitowia spalone ogniem, a wojownicy przerażeni."
"Jr51,33": "Tak bowiem mówi PAN zastępów, Bóg Izraela: Córka Babilonu jest jak klepisko, nadszedł czas, gdy się je udeptuje; jeszcze chwila, a przyjdzie czas jej żniwa."
"Jr51,34": "Pożarł mnie i zmiażdżył Nabuchodonozor, król Babilonu, uczynił mnie pustym naczyniem, połknął mnie jak smok, napełnił swój brzuch moimi rozkoszami i wypędził mnie."
"Jr51,35": "Krzywda zadana mi i memu ciału niech spadnie na Babilon, powie mieszkanka Syjonu, a moja krew – na mieszkańców Chaldei, powie Jerozolima."
"Jr51,36": "Dlatego tak mówi PAN: Oto będę bronił twojej sprawy i pomszczę cię; wysuszę jego morze i sprawię, że wyschną jego źródła."
"Jr51,37": "I Babilon stanie się rumowiskiem, legowiskiem smoków, zdumieniem i świstaniem, pozbawionym mieszkańców."
"Jr51,38": "Będą ryczeć razem jak lwy, warczeć jak lwie szczenięta."
"Jr51,39": "Gdy się rozpalą, uczynię im ucztę i upoję ich tak, aby weselili się i zasnęli wiecznym snem, by już się nie obudzili, mówi PAN."
"Jr51,40": "Sprowadzę ich jak baranki na rzeź, jak barany wraz z kozłami."
"Jr51,41": "Jakże został zdobyty Szeszak! Jakże została wzięta chwała całej ziemi! Jakże Babilon stał się spustoszeniem wśród narodów!"
"Jr51,42": "Wystąpiło morze przeciwko Babilonowi, został przykryty mnóstwem jego fal."
"Jr51,43": "Jego miasta stały się spustoszeniem, ziemią suchą i pustynną, ziemią, w której nikt nie mieszka, i przez którą nie przechodzi żaden syn człowieczy."
"Jr51,44": "Nawiedzę też Bela w Babilonie i wyrwę mu z paszczy to, co pochłonął. Narody już nie będą napływać do niego; upadnie też mur Babilonu."
"Jr51,45": "Wyjdźcie spośród niego, mój ludu, i niech każdy ratuje swoją duszę przed zapalczywością gniewu PANA."
"Jr51,46": "A niech wasze serce nie omdlewa ani się nie lękajcie wieści, którą będzie słychać w tej ziemi, gdy przyjdzie jednego roku wieść, potem drugiego roku wieść, ucisk w ziemi, władca przeciwko władcy."
"Jr51,47": "Dlatego oto nadchodzą dni, gdy nawiedzę rzeźbione obrazy Babilonu. Cała jego ziemia zostanie pohańbiona i wszyscy jego zabici padną pośród niego."
"Jr51,48": "Wtedy niebo, ziemia i wszystko, co w nich jest, będą śpiewać nad Babilonem. Z północy bowiem przyjdą na niego niszczyciele, mówi PAN."
"Jr51,49": "Jak przez Babilon padli zabici Izraela, tak w Babilonie padną zabici całej ziemi."
"Jr51,50": "Wy, którzy uszliście spod miecza, idźcie, nie zatrzymujcie się! Wspominajcie PANA z daleka i niech przyjdzie wam na myśl Jerozolima."
"Jr51,51": "Powiedzcie: Wstydzimy się, że słyszymy zniewagi, hańba okryła nasze twarze. Weszli bowiem cudzoziemcy do świętych miejsc domu PANA."
"Jr51,52": "Dlatego oto nadchodzą dni, mówi PAN, że nawiedzę jego rzeźbione obrazy, a po całej jego ziemi będą jęczeć jego zranieni."
"Jr51,53": "Choćby Babilon wstąpił do nieba i obwarował szczyty swojej potęgi, mimo to wyjdą ode mnie jego niszczyciele, mówi PAN."
"Jr51,54": "Słychać głos krzyku z Babilonu i wielkie zniszczenie z ziemi Chaldejczyków;"
"Jr51,55": "Bo PAN pustoszy Babilon i wytraci z niego wielki głos, choćby ich fale huczały jak wielkie wody i rozlegał się szum ich głosu."
"Jr51,56": "Niszczyciel bowiem nadciąga na niego, na Babilon, i jego mocarze zostaną pojmani, ich łuki będą połamane. PAN bowiem, Bóg odpłaty, odpłaci im niezawodnie;"
"Jr51,57": "Upiję jego książąt i mędrców, jego dowódców i rządców oraz jego mocarzy, aby zasnęli wiecznym snem i już się nie obudzili, mówi Król, PAN zastępów to jego imię."
"Jr51,58": "Tak mówi PAN zastępów: Szerokie mury Babilonu będą doszczętnie zniszczone i jego wysokie bramy zostaną spalone ogniem; ludzie będą trudzić się na darmo i narody – przy ogniu, a osłabną."
"Jr51,59": "Słowo, które prorok Jeremiasz polecił Serajaszowi, synowi Neriasza, syna Machsejasza, gdy ten udał się z Sedekiaszem, królem Judy, do Babilonu, w czwartym roku jego królowania. A Serajasz był spokojnym księciem."
"Jr51,60": "Jeremiasz więc spisał w jednej księdze całe nieszczęście, które miało spaść na Babilon, wszystkie słowa, które zostały napisane przeciwko Babilonowi."
"Jr51,61": "I Jeremiasz powiedział do Serajasza: Gdy przybędziesz do Babilonu i zobaczysz go, i przeczytasz wszystkie te słowa;"
"Jr51,62": "Powiesz: PANIE, ty mówiłeś przeciwko temu miejscu, że je wyniszczysz, aby nikt w nim nie mieszkał, ani człowiek, ani zwierzę, ale żeby było wiecznym pustkowiem."
"Jr51,63": "A gdy dokończysz czytanie tej księgi, przywiążesz do niej kamień i wrzucisz ją w środek Eufratu;"
"Jr51,64": "I powiesz: Tak utonie Babilon i już nie powstanie z tego nieszczęścia, które na niego sprowadzę, i osłabną. Dotąd słowa Jeremiasza."
