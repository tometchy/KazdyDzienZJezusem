"Jr51,1":
  text: "Tak mówi PAN: Oto wzbudzę niszczący wiatr przeciwko Babilonowi i przeciwko tym, którzy mieszkają pośród powstających przeciwko mnie;"
  tags: []
"Jr51,2":
  text: "I poślę do Babilonu obcych, którzy będą go przewiewać, i opróżnią jego ziemię, gdyż zewsząd zwrócą się przeciwko niemu w dniu ucisku."
  tags: []
"Jr51,3":
  text: "Niech łucznik napina swój łuk przeciwko niemu i przeciwko stającym do walki w swoich pancerzach. Nie oszczędzajcie jego młodzieńców, zgładźcie całe jego wojsko."
  tags: []
"Jr51,4":
  text: "Tak padną zabici w ziemi Chaldejczyków i przebici na jego ulicach."
  tags: []
"Jr51,5":
  text: "Nie są bowiem opuszczone Izrael ani Juda przez swego Boga, PANA zastępów, choć ich ziemia była pełna grzechu przeciwko Świętemu Izraela."
  tags: []
"Jr51,6":
  text: "Uciekajcie ze środka Babilonu i niech każdy ratuje swoją duszę. Nie gińcie w jego nieprawości, bo jest to czas zemsty PANA, on oddaje mu zapłatę."
  tags: []
"Jr51,7":
  text: "Babilon był złotym kielichem w ręce PANA, upajającym całą ziemię. Z jego wina piły narody, dlatego narody szaleją."
  tags: []
"Jr51,8":
  text: "Nagle upadł Babilon i został rozbity. Zawódźcie nad nim, weźcie balsam na jego ból, może da się go wyleczyć."
  tags: []
"Jr51,9":
  text: "Leczyliśmy Babilon, ale nie został uleczony. Opuśćmy go i niech każdy pójdzie do swojej ziemi, bo jego sąd aż do nieba sięga i wznosi się aż po obłoki."
  tags: []
"Jr51,10":
  text: "PAN ujawnił naszą sprawiedliwość. Chodźcie, głośmy na Syjonie dzieło PANA, naszego Boga."
  tags: []
"Jr51,11":
  text: "Wyostrzcie strzały, przygotujcie tarcze. PAN wzbudził ducha królów Medii, bo jego zamiar jest przeciwko Babilonowi, aby go zniszczyć. Jest to bowiem pomsta PANA, pomsta za jego świątynię."
  tags: []
"Jr51,12":
  text: "Podnieście sztandar na murach Babilonu, wzmocnijcie straże, postawcie stróżów, przygotujcie zasadzki. PAN bowiem obmyślił i wykonał to, co wypowiedział przeciwko mieszkańcom Babilonu."
  tags: []
"Jr51,13":
  text: "Ty, który mieszkasz nad wieloma wodami, bogaty w skarby! Nadszedł twój koniec, kres twojej chciwości."
  tags: []
"Jr51,14":
  text: "PAN zastępów przysiągł na siebie samego: Zaprawdę, napełnię cię ludźmi jak szarańczą, wzniosą nad tobą okrzyk wojenny."
  tags: []
"Jr51,15":
  text: "On uczynił ziemię swoją mocą, utwierdził świat swoją mądrością i rozpostarł niebiosa swoją roztropnością."
  tags: []
"Jr51,16":
  text: "Gdy on wydaje głos, huczą wody w niebiosach, on sprawia, że chmury wznoszą się z krańców ziemi. I czyni błyskawice z deszczem, a wywodzi wiatr ze swoich skarbców."
  tags: []
"Jr51,17":
  text: "Głupi jest każdy człowiek, kto tego nie zna, każdy złotnik jest zawstydzony z powodu posągu, bo jego odlany posąg jest fałszem i nie ma w nich ducha."
  tags: []
"Jr51,18":
  text: "Są marnością i dziełem błędów; zginą w czasie swego nawiedzenia."
  tags: []
"Jr51,19":
  text: "Nie takim jak one jest dział Jakuba, bo on jest Stwórcą wszystkiego, a Izrael jest szczepem jego dziedzictwa. PAN zastępów – to jego imię."
  tags: []
"Jr51,20":
  text: "Jesteś moim młotem i orężem wojennym. Tobą zmiażdżę narody, tobą zniszczę królestwa;"
  tags: []
"Jr51,21":
  text: "Tobą zmiażdżę konia i jeźdźca, tobą zmiażdżę rydwan i jego woźnicę;"
  tags: []
"Jr51,22":
  text: "Tobą zmiażdżę mężczyznę i kobietę, tobą zmiażdżę starca i dziecko, tobą zmiażdżę młodzieńca i pannę;"
  tags: []
"Jr51,23":
  text: "Tobą zmiażdżę pasterza i jego trzodę, tobą zmiażdżę oracza i jego zaprzęg, tobą zmiażdżę dowódców i rządców."
  tags: []
"Jr51,24":
  text: "Ale odpłacę Babilonowi i wszystkim mieszkańcom Chaldei za całe ich zło, które czynili na Syjonie na waszych oczach, mówi PAN."
  tags: []
"Jr51,25":
  text: "Oto jestem przeciwko tobie, góro niszczycielska, mówi PAN, która niszczysz całą ziemię. Wyciągnę swoją rękę przeciwko tobie i strącę cię ze skał, i uczynię cię górą wypaloną."
  tags: []
"Jr51,26":
  text: "A nie wezmą z ciebie kamienia węgielnego ani kamienia na fundamenty, bo staniesz się wiecznym pustkowiem, mówi PAN."
  tags: []
"Jr51,27":
  text: "Podnieście sztandar w ziemi, zadmijcie w trąbę wśród narodów, przygotujcie przeciwko niemu narody, zwołajcie przeciwko niemu królestwa Ararat, Minni i Aszkenaz; ustanówcie przeciwko niemu dowódcę, sprowadźcie konie jak najeżone szarańcze."
  tags: []
"Jr51,28":
  text: "Przygotujcie przeciwko niemu narody, królów Medii, ich dowódców i wszystkich ich rządców, oraz całą ziemię pod ich władzą;"
  tags: []
"Jr51,29":
  text: "Wtedy ziemia zadrży i będzie w bólach, gdyż spełnią się przeciwko Babilonowi zamiary PANA, aby zamienić ziemię Babilonu w pustkowie, bez mieszkańców."
  tags: []
"Jr51,30":
  text: "Mocarze Babilonu przestali walczyć, siedzą w warowniach, osłabło ich męstwo, stali się jak kobiety. Spalono jego mieszkania, wyłamano jego rygle."
  tags: []
"Jr51,31":
  text: "Goniec wybiegnie na spotkanie gońca, posłaniec – na spotkanie posłańca, aby opowiedzieć królowi Babilonu, że wzięto jego miasto z jednej strony;"
  tags: []
"Jr51,32":
  text: "Że brody są zajęte, sitowia spalone ogniem, a wojownicy przerażeni."
  tags: []
"Jr51,33":
  text: "Tak bowiem mówi PAN zastępów, Bóg Izraela: Córka Babilonu jest jak klepisko, nadszedł czas, gdy się je udeptuje; jeszcze chwila, a przyjdzie czas jej żniwa."
  tags: []
"Jr51,34":
  text: "Pożarł mnie i zmiażdżył Nabuchodonozor, król Babilonu, uczynił mnie pustym naczyniem, połknął mnie jak smok, napełnił swój brzuch moimi rozkoszami i wypędził mnie."
  tags: []
"Jr51,35":
  text: "Krzywda zadana mi i memu ciału niech spadnie na Babilon, powie mieszkanka Syjonu, a moja krew – na mieszkańców Chaldei, powie Jerozolima."
  tags: []
"Jr51,36":
  text: "Dlatego tak mówi PAN: Oto będę bronił twojej sprawy i pomszczę cię; wysuszę jego morze i sprawię, że wyschną jego źródła."
  tags: []
"Jr51,37":
  text: "I Babilon stanie się rumowiskiem, legowiskiem smoków, zdumieniem i świstaniem, pozbawionym mieszkańców."
  tags: []
"Jr51,38":
  text: "Będą ryczeć razem jak lwy, warczeć jak lwie szczenięta."
  tags: []
"Jr51,39":
  text: "Gdy się rozpalą, uczynię im ucztę i upoję ich tak, aby weselili się i zasnęli wiecznym snem, by już się nie obudzili, mówi PAN."
  tags: []
"Jr51,40":
  text: "Sprowadzę ich jak baranki na rzeź, jak barany wraz z kozłami."
  tags: []
"Jr51,41":
  text: "Jakże został zdobyty Szeszak! Jakże została wzięta chwała całej ziemi! Jakże Babilon stał się spustoszeniem wśród narodów!"
  tags: []
"Jr51,42":
  text: "Wystąpiło morze przeciwko Babilonowi, został przykryty mnóstwem jego fal."
  tags: []
"Jr51,43":
  text: "Jego miasta stały się spustoszeniem, ziemią suchą i pustynną, ziemią, w której nikt nie mieszka, i przez którą nie przechodzi żaden syn człowieczy."
  tags: []
"Jr51,44":
  text: "Nawiedzę też Bela w Babilonie i wyrwę mu z paszczy to, co pochłonął. Narody już nie będą napływać do niego; upadnie też mur Babilonu."
  tags: []
"Jr51,45":
  text: "Wyjdźcie spośród niego, mój ludu, i niech każdy ratuje swoją duszę przed zapalczywością gniewu PANA."
  tags: []
"Jr51,46":
  text: "A niech wasze serce nie omdlewa ani się nie lękajcie wieści, którą będzie słychać w tej ziemi, gdy przyjdzie jednego roku wieść, potem drugiego roku wieść, ucisk w ziemi, władca przeciwko władcy."
  tags: []
"Jr51,47":
  text: "Dlatego oto nadchodzą dni, gdy nawiedzę rzeźbione obrazy Babilonu. Cała jego ziemia zostanie pohańbiona i wszyscy jego zabici padną pośród niego."
  tags: []
"Jr51,48":
  text: "Wtedy niebo, ziemia i wszystko, co w nich jest, będą śpiewać nad Babilonem. Z północy bowiem przyjdą na niego niszczyciele, mówi PAN."
  tags: []
"Jr51,49":
  text: "Jak przez Babilon padli zabici Izraela, tak w Babilonie padną zabici całej ziemi."
  tags: []
"Jr51,50":
  text: "Wy, którzy uszliście spod miecza, idźcie, nie zatrzymujcie się! Wspominajcie PANA z daleka i niech przyjdzie wam na myśl Jerozolima."
  tags: []
"Jr51,51":
  text: "Powiedzcie: Wstydzimy się, że słyszymy zniewagi, hańba okryła nasze twarze. Weszli bowiem cudzoziemcy do świętych miejsc domu PANA."
  tags: []
"Jr51,52":
  text: "Dlatego oto nadchodzą dni, mówi PAN, że nawiedzę jego rzeźbione obrazy, a po całej jego ziemi będą jęczeć jego zranieni."
  tags: []
"Jr51,53":
  text: "Choćby Babilon wstąpił do nieba i obwarował szczyty swojej potęgi, mimo to wyjdą ode mnie jego niszczyciele, mówi PAN."
  tags: []
"Jr51,54":
  text: "Słychać głos krzyku z Babilonu i wielkie zniszczenie z ziemi Chaldejczyków;"
  tags: []
"Jr51,55":
  text: "Bo PAN pustoszy Babilon i wytraci z niego wielki głos, choćby ich fale huczały jak wielkie wody i rozlegał się szum ich głosu."
  tags: []
"Jr51,56":
  text: "Niszczyciel bowiem nadciąga na niego, na Babilon, i jego mocarze zostaną pojmani, ich łuki będą połamane. PAN bowiem, Bóg odpłaty, odpłaci im niezawodnie;"
  tags: []
"Jr51,57":
  text: "Upiję jego książąt i mędrców, jego dowódców i rządców oraz jego mocarzy, aby zasnęli wiecznym snem i już się nie obudzili, mówi Król, PAN zastępów to jego imię."
  tags: []
"Jr51,58":
  text: "Tak mówi PAN zastępów: Szerokie mury Babilonu będą doszczętnie zniszczone i jego wysokie bramy zostaną spalone ogniem; ludzie będą trudzić się na darmo i narody – przy ogniu, a osłabną."
  tags: []
"Jr51,59":
  text: "Słowo, które prorok Jeremiasz polecił Serajaszowi, synowi Neriasza, syna Machsejasza, gdy ten udał się z Sedekiaszem, królem Judy, do Babilonu, w czwartym roku jego królowania. A Serajasz był spokojnym księciem."
  tags: []
"Jr51,60":
  text: "Jeremiasz więc spisał w jednej księdze całe nieszczęście, które miało spaść na Babilon, wszystkie słowa, które zostały napisane przeciwko Babilonowi."
  tags: []
"Jr51,61":
  text: "I Jeremiasz powiedział do Serajasza: Gdy przybędziesz do Babilonu i zobaczysz go, i przeczytasz wszystkie te słowa;"
  tags: []
"Jr51,62":
  text: "Powiesz: PANIE, ty mówiłeś przeciwko temu miejscu, że je wyniszczysz, aby nikt w nim nie mieszkał, ani człowiek, ani zwierzę, ale żeby było wiecznym pustkowiem."
  tags: []
"Jr51,63":
  text: "A gdy dokończysz czytanie tej księgi, przywiążesz do niej kamień i wrzucisz ją w środek Eufratu;"
  tags: []
"Jr51,64":
  text: "I powiesz: Tak utonie Babilon i już nie powstanie z tego nieszczęścia, które na niego sprowadzę, i osłabną. Dotąd słowa Jeremiasza."
  tags: []
