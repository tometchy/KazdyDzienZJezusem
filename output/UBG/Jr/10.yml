"Jr10,1": "Słuchajcie słowa, które PAN mówi do was, domu Izraela!"
"Jr10,2": "Tak mówi PAN: Nie uczcie się drogi pogan i nie bójcie się znaków na niebie, bo to poganie ich się boją."
"Jr10,3": "Zwyczaje tych narodów są bowiem marnością, gdyż drzewo ścinają w lesie siekierą, dzieło rąk rzemieślnika;"
"Jr10,4": "Przyozdabiają je srebrem i złotem, przytwierdzają je gwoździami i młotkiem, aby się nie chwiało."
"Jr10,5": "Stoją prosto jak palma, ale nie mówią. Trzeba je nosić, bo nie mogą chodzić. Nie bójcie się ich, bo nie mogą czynić nic złego ani nic dobrego."
"Jr10,6": "Nie ma nikogo jak ty, PANIE! Ty jesteś wielki i wielkie jest w mocy twoje imię."
"Jr10,7": "Któż by się ciebie nie bał, Królu narodów? Tobie bowiem to się należy, ponieważ pośród wszystkich mędrców narodów i we wszystkich ich królestwach nie ma nikogo jak ty."
"Jr10,8": "Wszyscy razem są głupi i nierozumni; czerpanie nauki z drewna to całkowita marność."
"Jr10,9": "Srebro sklepane, przywiezione z Tarszisz, a złoto z Ufas – dzieło rzemieślnika i rąk złotnika. Ich szaty z błękitu i purpury, wszystko to jest dziełem uzdolnionych rzemieślników."
"Jr10,10": "Ale PAN jest prawdziwym Bogiem, jest Bogiem żywym i królem wiecznym. Od jego gniewu drży ziemia, a narody nie mogą znieść jego oburzenia."
"Jr10,11": "Tak więc im powiecie: Ci bogowie, którzy nie stworzyli nieba i ziemi, znikną z ziemi i spod nieba."
"Jr10,12": "On uczynił ziemię swoją mocą, utwierdził okrąg świata swoją mądrością i swoją roztropnością rozpostarł niebiosa."
"Jr10,13": "Gdy on wydaje głos, huczą wody w niebiosach, on sprawia, że chmury wznoszą się z krańców ziemi; czyni błyskawice z deszczem i wyprowadza wiatr ze swoich skarbców."
"Jr10,14": "Każdy człowiek jest głupcem i nie wie, że każdy złotnik jest okryty hańbą z powodu posągu, bo jego odlany posąg jest fałszem i nie ma w nich ducha."
"Jr10,15": "Są marnością i dziełem błędów; w czasie swego nawiedzenia zginą."
"Jr10,16": "Nie takim jak one jest dział Jakuba, bo on jest Stwórcą wszystkiego, a Izrael jest szczepem jego dziedzictwa. PAN zastępów – to jego imię."
"Jr10,17": "Pozbieraj z ziemi swoje towary, ty, która mieszkasz w miejscu warownym."
"Jr10,18": "Tak bowiem mówi PAN: Oto ja tym razem jak z procy cisnę w mieszkańców tej ziemi i udręczę ich, aby tego doznali."
"Jr10,19": "Biada mi z powodu mego zniszczenia, moja rana jest bolesna, ale mówiłem: Właśnie to jest moje cierpienie, muszę je znieść."
"Jr10,20": "Mój namiot został zburzony i wszystkie moje powrozy są zerwane. Moi synowie odeszli ode mnie i nie ma ich. Nie ma już nikogo, kto by rozbił mój namiot i rozciągnął moje zasłony."
"Jr10,21": "Pasterze bowiem stali się głupi i nie szukali PANA. Dlatego im się nie powiedzie, a cała ich trzoda zostanie rozproszona."
"Jr10,22": "Oto nadchodzi wieść i wielka wrzawa z ziemi północnej, aby miasta Judy zamienić w pustkowie i w siedlisko smoków."
"Jr10,23": "Wiem, PANIE, że droga człowieka nie zależy od niego ani nie leży w mocy człowieka kierować swoimi krokami, gdy chodzi."
"Jr10,24": "Karć mnie, PANIE, ale według słusznej miary, nie w swym gniewie, abyś mnie nie zniszczył."
"Jr10,25": "Wylej swoją zapalczywość na te narody, które cię nie znają, i na rody, które nie wzywają twego imienia. Pochłonęły bowiem Jakuba i pożarły go, strawiły go, a jego mieszkanie zamieniły w pustkowie."
