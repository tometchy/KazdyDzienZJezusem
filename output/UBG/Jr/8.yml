"Jr8,1":
  text: "W tym czasie, mówi PAN, wydobędą z ich grobów kości królów Judy, kości ich książąt, kości kapłanów, kości proroków i kości mieszkańców Jerozolimy;"
  tags: []
"Jr8,2":
  text: "I rozrzucą je przed słońcem, przed księżycem i przed całym zastępem nieba, które oni kochali, którym służyli, za którymi szli, których szukali i którym oddawali pokłon. Nie będą zebrane ani pogrzebane, lecz staną się nawozem na powierzchni ziemi."
  tags: []
"Jr8,3":
  text: "I cała reszta ocalałych z tego przewrotnego rodu będzie wybierać raczej śmierć niż życie we wszystkich miejscach, gdzie zostali, kiedy ich wygnałem, mówi PAN zastępów."
  tags: []
"Jr8,4":
  text: "Dlatego powiesz do nich: Tak mówi PAN: Czy nie powstaje ten, który upadł? Czy nie zawraca ten, który zbłądził?"
  tags: []
"Jr8,5":
  text: "Czemu więc odwrócił się ten lud Jerozolimy wiecznym odstępstwem? Trzymają się kłamstwa, nie chcą wrócić."
  tags: []
"Jr8,6":
  text: "Uważałem i słyszałem: nie mówią właściwie, nikt nie żałuje swej niegodziwości, mówiąc: Cóż uczyniłem? Każdy biegnie swoją drogą, jak koń pędzący do bitwy."
  tags: []
"Jr8,7":
  text: "Nawet bocian na niebiosach zna swoje ustalone pory; synogarlica, żuraw i jaskółka przestrzegają czasu swego przylotu. Lecz mój lud nie zna sądu PANA."
  tags: []
"Jr8,8":
  text: "Jakże możecie mówić: My jesteśmy mądrzy, a prawo PANA jest przy nas? Oto zaprawdę na próżno uczynił je; daremne jest pióro pisarzy."
  tags: []
"Jr8,9":
  text: "Mędrcy się zawstydzili. Są przestraszeni i pojmani. Oto odrzucają słowo PANA, jaką więc mają mądrość?"
  tags: []
"Jr8,10":
  text: "Dlatego ich żony dam innym, ich pola tym, którzy ich zdobędą, bo od najmniejszego aż do największego – wszyscy są oddani chciwości, od proroka aż do kapłana – wszyscy działają podstępnie."
  tags: []
"Jr8,11":
  text: "I leczą rany córki mego ludu tylko powierzchownie, mówiąc: Pokój, pokój! Ale nie ma pokoju."
  tags: []
"Jr8,12":
  text: "Czy zawstydzili się, że popełnili obrzydliwość? Bynajmniej, wcale się nie zawstydzili ani nie potrafili rumienić. Dlatego upadną wśród tych, co mają upaść. W czasie gdy ich nawiedzę, upadną, mówi PAN."
  tags: []
"Jr8,13":
  text: "Doszczętnie ich wykorzenię, mówi PAN. Nie będzie winogron na winorośli ani żadnych fig na drzewie figowym, nawet liść opadnie, a to, co im dałem, zostanie im zabrane."
  tags: []
"Jr8,14":
  text: "Czemu tu siedzimy? Zbierzcie się, wejdźmy do miast warownych i tam będziemy milczeć. PAN bowiem, nasz Bóg, każe nam milczeć i daje nam do picia wodę żółci, gdyż zgrzeszyliśmy przeciwko PANU."
  tags: []
"Jr8,15":
  text: "Oczekiwaliśmy pokoju, ale nic dobrego nie przyszło; czasu uzdrowienia – a oto strach."
  tags: []
"Jr8,16":
  text: "Od Dan słychać parskanie jego koni, na odgłos rżenia jego mocarzy zadrżała cała ziemia. Nadciągają, aby pożreć ziemię i wszystko, co jest na niej, miasto i jego mieszkańców."
  tags: []
"Jr8,17":
  text: "Oto bowiem poślę na was najbardziej jadowite węże, których nie można zaklinać, i będą was kąsać, mówi PAN."
  tags: []
"Jr8,18":
  text: "Moje serce, które miało mnie posilać w smutku, mdleje we mnie."
  tags: []
"Jr8,19":
  text: "Oto głos krzyku córki mego ludu z dalekiej ziemi: Czy nie ma PANA na Syjonie? Czy nie ma na nim jego króla? Czemu pobudzili mnie do gniewu swoimi bożkami i obcymi próżnościami? – odpowiada PAN."
  tags: []
"Jr8,20":
  text: "Przeminęło żniwo, skończyło się lato, a my nie jesteśmy wybawieni."
  tags: []
"Jr8,21":
  text: "Z powodu rany córki mojego ludu jestem ranny, pogrążony w żałobie, ogarnęło mnie przerażenie."
  tags: []
"Jr8,22":
  text: "Czy nie ma balsamu w Gileadzie? Czy nie ma tam lekarza? Czemu więc nie jest uleczona córka mojego ludu?"
  tags: []
