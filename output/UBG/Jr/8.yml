"Jr8,1": "W tym czasie, mówi PAN, wydobędą z ich grobów kości królów Judy, kości ich książąt, kości kapłanów, kości proroków i kości mieszkańców Jerozolimy;"
"Jr8,2": "I rozrzucą je przed słońcem, przed księżycem i przed całym zastępem nieba, które oni kochali, którym służyli, za którymi szli, których szukali i którym oddawali pokłon. Nie będą zebrane ani pogrzebane, lecz staną się nawozem na powierzchni ziemi."
"Jr8,3": "I cała reszta ocalałych z tego przewrotnego rodu będzie wybierać raczej śmierć niż życie we wszystkich miejscach, gdzie zostali, kiedy ich wygnałem, mówi PAN zastępów."
"Jr8,4": "Dlatego powiesz do nich: Tak mówi PAN: Czy nie powstaje ten, który upadł? Czy nie zawraca ten, który zbłądził?"
"Jr8,5": "Czemu więc odwrócił się ten lud Jerozolimy wiecznym odstępstwem? Trzymają się kłamstwa, nie chcą wrócić."
"Jr8,6": "Uważałem i słyszałem: nie mówią właściwie, nikt nie żałuje swej niegodziwości, mówiąc: Cóż uczyniłem? Każdy biegnie swoją drogą, jak koń pędzący do bitwy."
"Jr8,7": "Nawet bocian na niebiosach zna swoje ustalone pory; synogarlica, żuraw i jaskółka przestrzegają czasu swego przylotu. Lecz mój lud nie zna sądu PANA."
"Jr8,8": "Jakże możecie mówić: My jesteśmy mądrzy, a prawo PANA jest przy nas? Oto zaprawdę na próżno uczynił je; daremne jest pióro pisarzy."
"Jr8,9": "Mędrcy się zawstydzili. Są przestraszeni i pojmani. Oto odrzucają słowo PANA, jaką więc mają mądrość?"
"Jr8,10": "Dlatego ich żony dam innym, ich pola tym, którzy ich zdobędą, bo od najmniejszego aż do największego – wszyscy są oddani chciwości, od proroka aż do kapłana – wszyscy działają podstępnie."
"Jr8,11": "I leczą rany córki mego ludu tylko powierzchownie, mówiąc: Pokój, pokój! Ale nie ma pokoju."
"Jr8,12": "Czy zawstydzili się, że popełnili obrzydliwość? Bynajmniej, wcale się nie zawstydzili ani nie potrafili rumienić. Dlatego upadną wśród tych, co mają upaść. W czasie gdy ich nawiedzę, upadną, mówi PAN."
"Jr8,13": "Doszczętnie ich wykorzenię, mówi PAN. Nie będzie winogron na winorośli ani żadnych fig na drzewie figowym, nawet liść opadnie, a to, co im dałem, zostanie im zabrane."
"Jr8,14": "Czemu tu siedzimy? Zbierzcie się, wejdźmy do miast warownych i tam będziemy milczeć. PAN bowiem, nasz Bóg, każe nam milczeć i daje nam do picia wodę żółci, gdyż zgrzeszyliśmy przeciwko PANU."
"Jr8,15": "Oczekiwaliśmy pokoju, ale nic dobrego nie przyszło; czasu uzdrowienia – a oto strach."
"Jr8,16": "Od Dan słychać parskanie jego koni, na odgłos rżenia jego mocarzy zadrżała cała ziemia. Nadciągają, aby pożreć ziemię i wszystko, co jest na niej, miasto i jego mieszkańców."
"Jr8,17": "Oto bowiem poślę na was najbardziej jadowite węże, których nie można zaklinać, i będą was kąsać, mówi PAN."
"Jr8,18": "Moje serce, które miało mnie posilać w smutku, mdleje we mnie."
"Jr8,19": "Oto głos krzyku córki mego ludu z dalekiej ziemi: Czy nie ma PANA na Syjonie? Czy nie ma na nim jego króla? Czemu pobudzili mnie do gniewu swoimi bożkami i obcymi próżnościami? – odpowiada PAN."
"Jr8,20": "Przeminęło żniwo, skończyło się lato, a my nie jesteśmy wybawieni."
"Jr8,21": "Z powodu rany córki mojego ludu jestem ranny, pogrążony w żałobie, ogarnęło mnie przerażenie."
"Jr8,22": "Czy nie ma balsamu w Gileadzie? Czy nie ma tam lekarza? Czemu więc nie jest uleczona córka mojego ludu?"
