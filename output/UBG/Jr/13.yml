"Jr13,1": "Tak powiedział PAN do mnie: Idź i kup sobie lniany pas, przepasz nim swoje biodra, ale nie kładź go do wody."
"Jr13,2": "Kupiłem więc pas według rozkazu PANA i przepasałem nim swoje biodra."
"Jr13,3": "Potem ponownie doszło do mnie słowo PANA mówiące:"
"Jr13,4": "Weź ten pas, który kupiłeś i który jest na twoich biodrach, i wstań, idź nad Eufrat i ukryj go tam w szczelinie skalnej."
"Jr13,5": "Poszedłem więc i ukryłem go nad Eufratem, jak mi PAN rozkazał."
"Jr13,6": "A po upływie wielu dni PAN powiedział do mnie: Wstań, idź nad Eufrat i weź stamtąd pas, który ci rozkazałem tam ukryć."
"Jr13,7": "Poszedłem wtedy nad Eufrat, wykopałem i wziąłem pas z miejsca, gdzie go ukryłem, a oto pas był zbutwiały tak, że do niczego się nie nadawał."
"Jr13,8": "Potem doszło do mnie słowo PANA mówiące:"
"Jr13,9": "Tak mówi PAN: Tak zniszczę pychę Judy i wielką pychę Jerozolimy."
"Jr13,10": "Ten zły lud, który się wzbrania słuchać moich słów, który postępuje według uporu swego serca i idzie za innymi bogami, aby im służyć i dać im pokłon, stanie się jak ten pas, który się do niczego nie nadaje."
"Jr13,11": "Jak bowiem pas przylega do bioder mężczyzny, tak sprawiłem, że przylgnął do mnie cały dom Izraela i cały dom Judy, mówi PAN, aby był moim ludem, moją sławą, chwałą i ozdobą. Lecz nie posłuchali."
"Jr13,12": "Dlatego powiedz im to słowo: Tak mówi PAN, Bóg Izraela: Każdy dzban zostanie napełniony winem; a gdy powiedzą: Czyż nie wiemy, że wszelki dzban zostanie napełniony winem?"
"Jr13,13": "Wtedy im odpowiesz: Tak mówi PAN: Oto napełnię pijaństwem wszystkich mieszkańców tej ziemi i królów, którzy siedzą na tronie Dawida, i kapłanów oraz proroków, a także wszystkich mieszkańców Jerozolimy;"
"Jr13,14": "I roztrzaskam jednych o drugich, zarówno ojców, jak i synów, mówi PAN. Nie pożałuję i nie oszczędzę nikogo ani nie zlituję się, lecz zniszczę ich."
"Jr13,15": "Słuchajcie i nakłońcie ucha, nie wynoście się, bo PAN przemawia."
"Jr13,16": "Oddajcie chwałę PANU, swemu Bogu, zanim sprowadzi ciemność i zanim potkną się wasze nogi w mrocznych górach; gdy będziecie czekać na światłość, oto Bóg zamieni je w cień śmierci i przemieni w mrok."
"Jr13,17": "A jeśli tego nie usłuchacie, moja dusza będzie płakać w skrytości z powodu waszej pychy, a moje oko będzie nieustannie płakało i roniło łzy, bo trzoda PANA zostanie pojmana."
"Jr13,18": "Powiedz królowi i królowej: Ukorzcie się i usiądźcie na ziemi, bo spadła z waszej głowy korona waszej chwały."
"Jr13,19": "Miasta południa będą zamknięte i nikt ich nie otworzy. Cała Juda zostanie uprowadzona do niewoli, zostanie całkowicie uprowadzona."
"Jr13,20": "Podnieście swoje oczy i patrzcie na tych, którzy przybywają z północy. Gdzie jest ta trzoda, którą ci powierzono, twoja wspaniała trzoda?"
"Jr13,21": "Co powiesz, gdy on cię nawiedzi? Ty bowiem nauczyłaś ich, aby byli wodzami i zwierzchnikami nad tobą. Czy nie ogarną cię bóle jak rodzącą kobietę?"
"Jr13,22": "A jeśli powiesz w swoim sercu: Dlaczego to mnie spotkało? Z powodu ogromu twojej nieprawości poły twojej szaty zostały odkryte i twoje pięty będą gwałtownie obnażone."
"Jr13,23": "Czy Etiopczyk może zmienić swoją skórę albo lampart swoje cętki? Podobnie wy, czy możecie czynić dobrze, skoro przywykliście czynić źle?"
"Jr13,24": "Dlatego rozproszę ich jak plewy unoszone przez wiatr pustynny."
"Jr13,25": "Taki będzie twój los i dział wymierzony ci przeze mnie, mówi PAN, za to, że o mnie zapomniałaś i zaufałaś kłamstwu."
"Jr13,26": "Tak więc odkryję poły twojej szaty aż do twarzy, aby była widoczna twoja sromota."
"Jr13,27": "Widziałem twoje cudzołóstwa i twoje rżenie, hańbę twojego nierządu i twoje obrzydliwości na pagórkach i na polach. Biada tobie, Jerozolimo! Czy się nie oczyścisz? Jak długo jeszcze?"
