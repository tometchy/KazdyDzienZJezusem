"Jr13,1":
  text: "Tak powiedział PAN do mnie: Idź i kup sobie lniany pas, przepasz nim swoje biodra, ale nie kładź go do wody."
  tags: []
"Jr13,2":
  text: "Kupiłem więc pas według rozkazu PANA i przepasałem nim swoje biodra."
  tags: []
"Jr13,3":
  text: "Potem ponownie doszło do mnie słowo PANA mówiące:"
  tags: []
"Jr13,4":
  text: "Weź ten pas, który kupiłeś i który jest na twoich biodrach, i wstań, idź nad Eufrat i ukryj go tam w szczelinie skalnej."
  tags: []
"Jr13,5":
  text: "Poszedłem więc i ukryłem go nad Eufratem, jak mi PAN rozkazał."
  tags: []
"Jr13,6":
  text: "A po upływie wielu dni PAN powiedział do mnie: Wstań, idź nad Eufrat i weź stamtąd pas, który ci rozkazałem tam ukryć."
  tags: []
"Jr13,7":
  text: "Poszedłem wtedy nad Eufrat, wykopałem i wziąłem pas z miejsca, gdzie go ukryłem, a oto pas był zbutwiały tak, że do niczego się nie nadawał."
  tags: []
"Jr13,8":
  text: "Potem doszło do mnie słowo PANA mówiące:"
  tags: []
"Jr13,9":
  text: "Tak mówi PAN: Tak zniszczę pychę Judy i wielką pychę Jerozolimy."
  tags: []
"Jr13,10":
  text: "Ten zły lud, który się wzbrania słuchać moich słów, który postępuje według uporu swego serca i idzie za innymi bogami, aby im służyć i dać im pokłon, stanie się jak ten pas, który się do niczego nie nadaje."
  tags: []
"Jr13,11":
  text: "Jak bowiem pas przylega do bioder mężczyzny, tak sprawiłem, że przylgnął do mnie cały dom Izraela i cały dom Judy, mówi PAN, aby był moim ludem, moją sławą, chwałą i ozdobą. Lecz nie posłuchali."
  tags: []
"Jr13,12":
  text: "Dlatego powiedz im to słowo: Tak mówi PAN, Bóg Izraela: Każdy dzban zostanie napełniony winem; a gdy powiedzą: Czyż nie wiemy, że wszelki dzban zostanie napełniony winem?"
  tags: []
"Jr13,13":
  text: "Wtedy im odpowiesz: Tak mówi PAN: Oto napełnię pijaństwem wszystkich mieszkańców tej ziemi i królów, którzy siedzą na tronie Dawida, i kapłanów oraz proroków, a także wszystkich mieszkańców Jerozolimy;"
  tags: []
"Jr13,14":
  text: "I roztrzaskam jednych o drugich, zarówno ojców, jak i synów, mówi PAN. Nie pożałuję i nie oszczędzę nikogo ani nie zlituję się, lecz zniszczę ich."
  tags: []
"Jr13,15":
  text: "Słuchajcie i nakłońcie ucha, nie wynoście się, bo PAN przemawia."
  tags: []
"Jr13,16":
  text: "Oddajcie chwałę PANU, swemu Bogu, zanim sprowadzi ciemność i zanim potkną się wasze nogi w mrocznych górach; gdy będziecie czekać na światłość, oto Bóg zamieni je w cień śmierci i przemieni w mrok."
  tags: []
"Jr13,17":
  text: "A jeśli tego nie usłuchacie, moja dusza będzie płakać w skrytości z powodu waszej pychy, a moje oko będzie nieustannie płakało i roniło łzy, bo trzoda PANA zostanie pojmana."
  tags: []
"Jr13,18":
  text: "Powiedz królowi i królowej: Ukorzcie się i usiądźcie na ziemi, bo spadła z waszej głowy korona waszej chwały."
  tags: []
"Jr13,19":
  text: "Miasta południa będą zamknięte i nikt ich nie otworzy. Cała Juda zostanie uprowadzona do niewoli, zostanie całkowicie uprowadzona."
  tags: []
"Jr13,20":
  text: "Podnieście swoje oczy i patrzcie na tych, którzy przybywają z północy. Gdzie jest ta trzoda, którą ci powierzono, twoja wspaniała trzoda?"
  tags: []
"Jr13,21":
  text: "Co powiesz, gdy on cię nawiedzi? Ty bowiem nauczyłaś ich, aby byli wodzami i zwierzchnikami nad tobą. Czy nie ogarną cię bóle jak rodzącą kobietę?"
  tags: []
"Jr13,22":
  text: "A jeśli powiesz w swoim sercu: Dlaczego to mnie spotkało? Z powodu ogromu twojej nieprawości poły twojej szaty zostały odkryte i twoje pięty będą gwałtownie obnażone."
  tags: []
"Jr13,23":
  text: "Czy Etiopczyk może zmienić swoją skórę albo lampart swoje cętki? Podobnie wy, czy możecie czynić dobrze, skoro przywykliście czynić źle?"
  tags: []
"Jr13,24":
  text: "Dlatego rozproszę ich jak plewy unoszone przez wiatr pustynny."
  tags: []
"Jr13,25":
  text: "Taki będzie twój los i dział wymierzony ci przeze mnie, mówi PAN, za to, że o mnie zapomniałaś i zaufałaś kłamstwu."
  tags: []
"Jr13,26":
  text: "Tak więc odkryję poły twojej szaty aż do twarzy, aby była widoczna twoja sromota."
  tags: []
"Jr13,27":
  text: "Widziałem twoje cudzołóstwa i twoje rżenie, hańbę twojego nierządu i twoje obrzydliwości na pagórkach i na polach. Biada tobie, Jerozolimo! Czy się nie oczyścisz? Jak długo jeszcze?"
  tags: []
