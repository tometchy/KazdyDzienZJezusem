"Jr36,1":
  text: "W czwartym roku Joakima, syna Jozjasza, króla Judy, doszło do Jeremiasza słowo od PANA mówiące:"
  tags: []
"Jr36,2":
  text: "Weź sobie zwój księgi i napisz na nim wszystkie słowa, które wypowiadałem do ciebie przeciw Izraelowi, przeciw Judzie i przeciw wszystkim narodom od dnia, kiedy zacząłem mówić do ciebie, od dni Jozjasza aż do dziś."
  tags: []
"Jr36,3":
  text: "Może gdy dom Judy usłyszy o całym tym nieszczęściu, które zamierzam im uczynić, odwróci się każdy od swojej złej drogi, abym przebaczył ich nieprawość i grzech."
  tags: []
"Jr36,4":
  text: "Jeremiasz więc wezwał Barucha, syna Neriasza, a Baruch spisał z ust Jeremiasza na zwoju księgi wszystkie słowa PANA, które mówił do niego."
  tags: []
"Jr36,5":
  text: "Potem Jeremiasz nakazał Baruchowi: Jestem powstrzymany i nie mogę wejść do domu PANA;"
  tags: []
"Jr36,6":
  text: "Dlatego ty idź i odczytaj z tego zwoju, co napisałeś z moich ust – słowa PANA – do uszu ludu w domu PANA, w dzień postu. Odczytaj to także do uszu wszystkich z Judy, którzy przychodzą ze swoich miast."
  tags: []
"Jr36,7":
  text: "Może skierują swoje błaganie przed oblicze PANA i każdy odwróci się od swojej złej drogi. Wielkie są bowiem gniew i zapalczywość, które PAN wypowiedział przeciwko temu ludowi."
  tags: []
"Jr36,8":
  text: "I postąpił Baruch, syn Neriasza, zgodnie ze wszystkim, co prorok Jeremiasz mu nakazał, odczytując z księgi słowa PANA w domu PANA."
  tags: []
"Jr36,9":
  text: "W piątym roku Joakima, syna Jozjasza, króla Judy, w dziewiątym miesiącu, zapowiedziano post przed PANEM całemu ludowi w Jerozolimie i całemu ludowi, który przybył z miast Judy do Jerozolimy."
  tags: []
"Jr36,10":
  text: "I Baruch odczytał z księgi słowa Jeremiasza w domu PANA, w komnacie Gemariasza, syna Szafana, pisarza, na górnym dziedzińcu, u wejścia do Bramy Nowej domu PANA, do uszu całego ludu."
  tags: []
"Jr36,11":
  text: "A gdy Micheasz, syn Gemariasza, syna Szafana, usłyszał wszystkie słowa PANA z księgi;"
  tags: []
"Jr36,12":
  text: "Zszedł do domu króla, do komnaty pisarza, a oto siedzieli tam wszyscy książęta: Eliszama, pisarz, Delajasz, syn Szemajasza, Elnatan, syn Akbora, Gemariasz, syn Szafana, Sedekiasz, syn Chananiasza, i pozostali książęta."
  tags: []
"Jr36,13":
  text: "I Micheasz powiedział im wszystkie słowa, które usłyszał, gdy Baruch czytał z księgi do uszu ludu."
  tags: []
"Jr36,14":
  text: "Wtedy wszyscy książęta posłali do Barucha Jehudiego, syna Netaniasza, syna Szelemiasza, syna Kusziego, z poleceniem: Weź do ręki zwój, z którego czytałeś do uszu ludu, i przyjdź. Baruch więc, syn Neriasza, wziął zwój do ręki i przyszedł do nich."
  tags: []
"Jr36,15":
  text: "I powiedzieli do niego: Usiądź proszę i odczytaj to do naszych uszu. Czytał więc Baruch do ich uszu."
  tags: []
"Jr36,16":
  text: "A gdy usłyszeli wszystkie te słowa, spojrzeli przerażeni jeden na drugiego i powiedzieli do Barucha: Musimy powiadomić króla o tych wszystkich słowach."
  tags: []
"Jr36,17":
  text: "I zapytali Barucha: Powiedz nam teraz, jak spisywałeś wszystkie te słowa z jego ust?"
  tags: []
"Jr36,18":
  text: "Baruch odpowiedział: Ustnie podawał mi wszystkie te słowa, a ja spisałem je atramentem w księdze."
  tags: []
"Jr36,19":
  text: "Wtedy książęta powiedzieli do Barucha: Idź, ukryj się, ty i Jeremiasz, a niech nikt nie wie, gdzie jesteście."
  tags: []
"Jr36,20":
  text: "Potem weszli do króla na dziedziniec, ale księgę ukryli w komnacie Eliszamy, pisarza, i opowiedzieli do uszu króla wszystkie te słowa."
  tags: []
"Jr36,21":
  text: "Król więc posłał Jehudiego, aby wziął zwój, a ten zabrał go z komnaty Eliszamy, pisarza. I Jehudi odczytał go do uszu króla i wszystkich książąt, którzy stali przed królem."
  tags: []
"Jr36,22":
  text: "A król siedział w domu zimowym, w dziewiątym miesiącu, i ogień płonął na palenisku przed nim."
  tags: []
"Jr36,23":
  text: "Gdy Jehudi przeczytał trzy lub cztery karty, odcinał je nożem pisarskim i wrzucał do ognia, który rozpalony był na palenisku, aż cały zwój spłonął w ogniu na palenisku."
  tags: []
"Jr36,24":
  text: "Ale nie przerazili się i nie rozdarli swoich szat ani król, ani jego słudzy, którzy słyszeli wszystkie te słowa."
  tags: []
"Jr36,25":
  text: "Elnatan jednak, Delajasz i Gemariasz nalegali na króla, aby nie palił tego zwoju, ale ich nie usłuchał."
  tags: []
"Jr36,26":
  text: "I król rozkazał Jerachmeelowi, synowi Meleka, Serajaszowi, synowi Azriela, i Szelemiaszowi, synowi Abdeela, aby pojmali Barucha, pisarza, i proroka Jeremiasza. Ale PAN ich ukrył."
  tags: []
"Jr36,27":
  text: "I do Jeremiasza doszło słowo PANA po spaleniu przez króla zwoju i słowa, które Baruch spisał z ust Jeremiasza, mówiące:"
  tags: []
"Jr36,28":
  text: "Weź sobie jeszcze inny zwój i zapisz na nim wszystkie poprzednie słowa, które były na pierwszym zwoju, spalonym przez Joakima, króla Judy."
  tags: []
"Jr36,29":
  text: "A do Joakima, króla Judy, powiedz: Tak mówi PAN: Ty spaliłeś ten zwój, mówiąc: Czemu napisałeś na nim: Na pewno król Babilonu nadciągnie, zniszczy tę ziemię i wytępi w niej człowieka i zwierzęta."
  tags: []
"Jr36,30":
  text: "Dlatego tak mówi PAN o Joakimie, królu Judy: Nie będzie miał nikogo, kto zasiadłby na tronie Dawida, a jego zwłoki będą rzucone na upał we dnie i na mróz w nocy."
  tags: []
"Jr36,31":
  text: "Nawiedzę go bowiem, jego potomstwo i jego sługi za ich nieprawość i sprowadzę na nich, na mieszkańców Jerozolimy i na Judejczyków całe to nieszczęście, które im zapowiedziałem, ale nie słuchali."
  tags: []
"Jr36,32":
  text: "Wtedy Jeremiasz wziął inny zwój i dał go Baruchowi, synowi Neriasza, pisarzowi, a ten spisał na nim z ust Jeremiasza wszystkie słowa tamtego zwoju, który spalił w ogniu Joakim, król Judy. Nadto zostało dodane do nich wiele podobnych słów."
  tags: []
