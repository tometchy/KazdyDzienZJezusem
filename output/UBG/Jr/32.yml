"Jr32,1":
  text: "Słowo, które doszło do Jeremiasza od PANA w dziesiątym roku Sedekiasza, króla Judy, a był to osiemnasty rok Nabuchodonozora."
  tags: []
"Jr32,2":
  text: "W tym czasie wojsko króla Babilonu obległo Jerozolimę, a prorok Jeremiasz był zamknięty na dziedzińcu więzienia, które znajdowało się w domu króla Judy."
  tags: []
"Jr32,3":
  text: "Uwięził go bowiem Sedekiasz, król Judy, mówiąc: Czemu prorokujesz tymi słowami: Tak mówi PAN: Oto wydam to miasto w ręce króla Babilonu, a on je zdobędzie;"
  tags: []
"Jr32,4":
  text: "Sedekiasz zaś, król Judy, nie ujdzie z rąk Chaldejczyków, ale na pewno będzie wydany w ręce króla Babilonu i będzie z nim rozmawiał z ust do ust, i zobaczy go oko w oko;"
  tags: []
"Jr32,5":
  text: "I uprowadzi Sedekiasza do Babilonu, i będzie tam, aż go nawiedzę, mówi PAN. A jeśli będziecie walczyć z Chaldejczykami, nie poszczęści się wam."
  tags: []
"Jr32,6":
  text: "Wtedy Jeremiasz odpowiedział: Doszło do mnie słowo PANA mówiące:"
  tags: []
"Jr32,7":
  text: "Oto Chanameel, syn Szalluma, twego stryja, przyjdzie do ciebie i powie: Kup sobie moje pole, które jest w Anatot, bo do ciebie należy prawo wykupu, aby je nabyć."
  tags: []
"Jr32,8":
  text: "I Chanameel, syn mego stryja, przyszedł do mnie na dziedziniec więzienia zgodnie ze słowem PANA, i powiedział do mnie: Proszę, kup moje pole, które jest w Anatot, w ziemi Beniamina, bo do ciebie należy prawo dziedzictwa i wykupu; kup je sobie. Wtedy zrozumiałem, że było to słowo PANA."
  tags: []
"Jr32,9":
  text: "I kupiłem od Chanameela, syna mego stryja, pole, które było w Anatot, i odważyłem mu pieniądze – siedemnaście syklów srebra."
  tags: []
"Jr32,10":
  text: "Spisałem akt, zapieczętowałem go, ujawniłem wobec świadków i odważyłem pieniądze na wadze."
  tags: []
"Jr32,11":
  text: "Potem wziąłem akt kupna, zarówno ten zapieczętowany zgodnie z prawem i przepisami, jak i ten otwarty;"
  tags: []
"Jr32,12":
  text: "I oddałem ten akt kupna Baruchowi, synowi Neriasza, syna Machsejasza, na oczach Chanameela, syna mego stryja, i na oczach świadków, którzy podpisali ten akt kupna, i na oczach wszystkich Żydów, którzy siedzieli na dziedzińcu więzienia."
  tags: []
"Jr32,13":
  text: "I nakazałem Baruchowi w ich obecności, mówiąc:"
  tags: []
"Jr32,14":
  text: "Tak mówi PAN zastępów, Bóg Izraela: Weź te akty, zarówno zapieczętowany akt kupna, jak i ten otwarty, i włóż je do naczynia glinianego, aby przetrwały wiele lat."
  tags: []
"Jr32,15":
  text: "Tak bowiem mówi PAN zastępów, Bóg Izraela: Znowu będzie się kupowało domy, pola i winnice w tej ziemi."
  tags: []
"Jr32,16":
  text: "A po przekazaniu aktu kupna Baruchowi, synowi Neriasza, modliłem się do PANA tymi słowami:"
  tags: []
"Jr32,17":
  text: "Ach, Panie BOŻE! Oto uczyniłeś niebo i ziemię swoją wielką mocą i wyciągniętym ramieniem i nie ma dla ciebie rzeczy zbyt trudnej."
  tags: []
"Jr32,18":
  text: "Okazujesz miłosierdzie tysiącom i odpłacasz nieprawość ojców w zanadrze ich synów po nich. Bóg wielki i potężny, PAN zastępów – to twoje imię;"
  tags: []
"Jr32,19":
  text: "Wielki w radzie i potężny w dziele, ponieważ twoje oczy są otwarte na wszystkie drogi synów ludzkich, by oddać każdemu według jego dróg i według owoców jego uczynków."
  tags: []
"Jr32,20":
  text: "Czyniłeś znaki i cuda w ziemi Egiptu aż do dziś, zarówno w Izraelu, jak i wśród innych ludzi, i uczyniłeś sobie imię, jak to jest dzisiaj."
  tags: []
"Jr32,21":
  text: "Wyprowadziłeś swój lud Izraela z ziemi Egiptu wśród znaków i cudów potężną ręką i wyciągniętym ramieniem, i wśród wielkiego strachu;"
  tags: []
"Jr32,22":
  text: "I dałeś im tę ziemię, którą przysiągłeś dać ich ojcom, ziemię opływającą mlekiem i miodem."
  tags: []
"Jr32,23":
  text: "A gdy weszli i posiedli ją, nie usłuchali twojego głosu i nie postępowali według twojego prawa; nie wypełnili nic z tego wszystkiego, co im rozkazałeś wypełnić. Dlatego sprawiłeś, że spotkało ich to całe nieszczęście."
  tags: []
"Jr32,24":
  text: "Oto wały usypano przeciwko miastu, aby je zdobyć, miasto jest wydane w ręce Chaldejczyków, którzy walczą przeciw niemu, przez miecz, głód i zarazę. Stało się, jak powiedziałeś, sam to widzisz."
  tags: []
"Jr32,25":
  text: "Ty jednak, Panie BOŻE, powiedziałeś mi: Kup sobie to pole za pieniądze i ujawnij to wobec świadków, choć miasto jest już wydane w ręce Chaldejczyków."
  tags: []
"Jr32,26":
  text: "I doszło słowo PANA do Jeremiasza mówiące:"
  tags: []
"Jr32,27":
  text: "Oto jestem PANEM, Bogiem wszelkiego ciała. Czy jakakolwiek rzecz jest dla mnie zbyt trudna?"
  tags: []
"Jr32,28":
  text: "Dlatego tak mówi PAN: Oto wydaję to miasto w ręce Chaldejczyków i w ręce Nabuchodonozora, króla Babilonu, i on je zdobędzie."
  tags: []
"Jr32,29":
  text: "A Chaldejczycy, którzy walczą przeciwko temu miastu, wejdą i podłożą ogień pod to miasto, i spalą je wraz z domami, na których dachach palili kadzidło Baalowi i wylewali ofiary z płynów innym bogom, aby mnie pobudzić do gniewu."
  tags: []
"Jr32,30":
  text: "Synowie Izraela bowiem i synowie Judy od swojej młodości czynią tylko to, co jest złe w moich oczach. Tak, synowie Izraela tylko drażnili mnie dziełami swoich rąk, mówi PAN."
  tags: []
"Jr32,31":
  text: "To miasto bowiem jest powodem mojej zapalczywości i gniewu od dnia, kiedy je zbudowali, aż do dzisiaj, tak że usunę je sprzed mego oblicza;"
  tags: []
"Jr32,32":
  text: "Z powodu wszelkiego zła synów Izraela i synów Judy, które popełniali, by pobudzić mnie do gniewu, oni, ich królowie i książęta, ich kapłani i prorocy, Judejczycy i mieszkańcy Jerozolimy."
  tags: []
"Jr32,33":
  text: "Obrócili się do mnie tyłem, a nie twarzą, i chociaż ich nauczałem z wczesnym wstawaniem i nauczaniem, oni jednak nie słuchali, aby przyjąć pouczenie."
  tags: []
"Jr32,34":
  text: "Umieścili swoje obrzydliwości w domu, nad którym jest nazwane moje imię, by go zbezcześcić."
  tags: []
"Jr32,35":
  text: "Zbudowali wyżyny Baala w dolinie syna Hinnom, by przeprowadzić swoich synów i swoje córki przez ogień ku czci Molocha, czego im nie nakazałem, nie przyszło mi nawet na myśl, by czynić tę obrzydliwość i Judę przywodzić do grzechu."
  tags: []
"Jr32,36":
  text: "Dlatego teraz tak mówi PAN, Bóg Izraela, o tym mieście, o którym wy mówicie: Zostanie wydane w ręce króla Babilonu przez miecz, głód i zarazę:"
  tags: []
"Jr32,37":
  text: "Oto zgromadzę ich ze wszystkich ziem, do których ich wygnałem w swoim gniewie, w swoim oburzeniu i w wielkiej zapalczywości i przyprowadzę ich z powrotem na to miejsce, i sprawię, że będą mieszkać bezpiecznie."
  tags: []
"Jr32,38":
  text: "I będą moim ludem, a ja będę ich Bogiem."
  tags: []
"Jr32,39":
  text: "I dam im jedno serce i jedną drogę, aby bali się mnie przez wszystkie dni, dla dobra ich samych i ich dzieci po nich."
  tags: []
"Jr32,40":
  text: "I zawrę z nimi wieczne przymierze, że się od nich nie odwrócę i nie przestanę im dobrze czynić, lecz włożę w ich serca moją bojaźń, aby nie odstępowali ode mnie."
  tags: []
"Jr32,41":
  text: "I będę się radował z nich, aby wyświadczyć im dobro, i osadzę ich z pewnością w tej ziemi z całego swego serca i całą swoją duszą."
  tags: []
"Jr32,42":
  text: "Tak bowiem mówi PAN: Jak sprowadziłem na ten lud całe to nieszczęście, tak sprowadzę na niego całe dobro, które mu obiecałem."
  tags: []
"Jr32,43":
  text: "Wtedy będzie się kupować pola w tej ziemi, o której mówicie: Jest tak spustoszona, że nie ma w niej ani człowieka, ani zwierzęcia, jest wydana w ręce Chaldejczyków."
  tags: []
"Jr32,44":
  text: "Będą kupować pola za pieniądze i spisywać akty, zapieczętowywać je i ujawniać wobec świadków w ziemi Beniamina, w okolicach Jerozolimy, w miastach Judy, w miastach górskich, w miastach dolin i w miastach na południu. Odwrócę bowiem ich niewolę, mówi PAN."
  tags: []
