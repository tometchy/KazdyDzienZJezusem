"Jr26,1":
  text: "Na początku królowania Joakima, syna Jozjasza, króla Judy, doszło to słowo od PANA mówiące:"
  tags: []
"Jr26,2":
  text: "Tak mówi PAN: Stań na dziedzińcu domu PANA i mów do wszystkich miast Judy, do tych, którzy przychodzą oddać pokłon w domu PANA, wszystkie słowa, które nakazuję ci mówić do nich; nie ujmuj ani słowa."
  tags: []
"Jr26,3":
  text: "Może usłuchają i odwrócą się, każdy od swojej złej drogi, abym żałował nieszczęścia, które zamierzałem im uczynić z powodu zła ich uczynków."
  tags: []
"Jr26,4":
  text: "I powiesz im: Tak mówi PAN: Jeśli mnie nie usłuchacie, by postępować według mojego prawa, które wam przedłożyłem;"
  tags: []
"Jr26,5":
  text: "By słuchać słów moich sług, proroków, których posłałem do was, z wczesnym wstawaniem i przesłaniem, a przecież nie usłuchaliście;"
  tags: []
"Jr26,6":
  text: "Wtedy postąpię z tym domem tak jak z Szilo, a to miasto uczynię przekleństwem dla wszystkich narodów ziemi."
  tags: []
"Jr26,7":
  text: "A kapłani i prorocy oraz cały lud słyszeli Jeremiasza mówiącego te słowa w domu PANA."
  tags: []
"Jr26,8":
  text: "A gdy Jeremiasz skończył mówić wszystko, co PAN mu nakazał powiedzieć całemu ludowi, pojmali go ci kapłani i prorocy oraz cały lud, mówiąc: Musisz umrzeć."
  tags: []
"Jr26,9":
  text: "Czemu prorokowałeś w imię PANA, głosząc: Z tym domem stanie się jak z Szilo, a to miasto tak spustoszeje, że nie będzie w nim mieszkańca? I zgromadził się cały lud przeciwko Jeremiaszowi w domu PANA."
  tags: []
"Jr26,10":
  text: "Gdy książęta Judy usłyszeli te rzeczy, przyszli z domu królewskiego do domu PANA i zasiedli u wejścia nowej bramy PANA."
  tags: []
"Jr26,11":
  text: "Wtedy kapłani i prorocy powiedzieli do książąt i do całego ludu: Ten człowiek zasługuje na śmierć, bo prorokował przeciwko temu miastu, jak to słyszeliście na własne uszy."
  tags: []
"Jr26,12":
  text: "Jeremiasz zaś odezwał się do wszystkich książąt i do całego ludu, mówiąc: PAN mnie posłał, abym prorokował przeciw temu domowi i przeciw temu miastu to wszystko, co słyszeliście."
  tags: []
"Jr26,13":
  text: "Dlatego teraz poprawcie swoje drogi i swoje uczynki i usłuchajcie głosu PANA, swego Boga, a pożałuje PAN tego nieszczęścia, jakie zapowiedział przeciwko wam."
  tags: []
"Jr26,14":
  text: "Co do mnie, ja jestem w waszych rękach, czyńcie ze mną to, co dobre i sprawiedliwe w waszych oczach."
  tags: []
"Jr26,15":
  text: "Wiedzcie jednak na pewno – jeśli mnie zabijecie, ściągniecie krew niewinną na siebie, na to miasto i na jego mieszkańców. Naprawdę bowiem PAN posłał mnie do was, abym mówił te wszystkie słowa do waszych uszu."
  tags: []
"Jr26,16":
  text: "Wtedy książęta i cały lud powiedzieli do kapłanów i do proroków: Ten człowiek nie zasługuje na śmierć, ponieważ przemawiał do nas w imię PANA, naszego Boga."
  tags: []
"Jr26,17":
  text: "Powstali też niektórzy ze starszych tej ziemi i powiedzieli do całego zgromadzenia ludu:"
  tags: []
"Jr26,18":
  text: "Micheasz z Moreszet prorokował za dni Ezechiasza, króla Judy, i mówił do całego ludu Judy: Tak mówi PAN zastępów: Syjon będzie zaorany jak pole, Jerozolima stanie się rumowiskiem, a góra tego domu – jak zalesione wzgórze."
  tags: []
"Jr26,19":
  text: "Czy zabił go Ezechiasz, król Judy, i Juda? Czy nie ulękli się PANA i nie modlili się do PANA tak, że PAN żałował tego nieszczęścia, jakie zapowiedział przeciwko nim? Przecież ściągniemy na nasze dusze wielkie nieszczęście."
  tags: []
"Jr26,20":
  text: "Był także człowiek, który prorokował w imię PANA, Uriasz, syn Szemajasza, z Kiriat-Jearim. Prorokował on przeciwko temu miastu i przeciwko tej ziemi zgodnie ze wszystkimi słowami Jeremiasza."
  tags: []
"Jr26,21":
  text: "A gdy król Joakim, wszyscy jego wojownicy i wszyscy książęta usłyszeli jego słowa, król usiłował go zabić. Lecz gdy Uriasz o tym usłyszał, zląkł się, uciekł i przybył do Egiptu."
  tags: []
"Jr26,22":
  text: "Ale król Joakim posłał ludzi do Egiptu: Elnatana, syna Akbora, i innych razem z nim do Egiptu."
  tags: []
"Jr26,23":
  text: "Ci sprowadzili Uriasza z Egiptu i przyprowadzili go do króla Joakima, a ten zabił go mieczem i wrzucił jego zwłoki do grobów pospólstwa."
  tags: []
"Jr26,24":
  text: "Natomiast ręka Achikama, syna Szafana, była przy Jeremiaszu, aby nie został wydany w ręce ludu i nie został zabity."
  tags: []
