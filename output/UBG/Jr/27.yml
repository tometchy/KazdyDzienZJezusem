"Jr27,1":
  text: "Na początku królowania Joakima, syna Jozjasza, króla Judy, doszło to słowo do Jeremiasza od PANA mówiące:"
  tags: []
"Jr27,2":
  text: "Tak mówi do mnie PAN: Sporządź sobie więzy i jarzma i nałóż je na swoją szyję;"
  tags: []
"Jr27,3":
  text: "Potem poślij je do króla Edomu, do króla Moabu, do króla Ammonitów, do króla Tyru i do króla Sydonu przez posłańców, którzy przyjdą do Jerozolimy, do Sedekiasza, króla Judy;"
  tags: []
"Jr27,4":
  text: "I rozkaż im, aby swym panom powiedzieli: Tak mówi PAN zastępów, Bóg Izraela. Tak powiecie swym panom:"
  tags: []
"Jr27,5":
  text: "Ja uczyniłem ziemię, człowieka i zwierzęta, które są na powierzchni ziemi, swoją wielką mocą i wyciągniętym ramieniem, i daję temu, który w moich oczach ma upodobanie."
  tags: []
"Jr27,6":
  text: "A teraz dałem te wszystkie ziemie do rąk Nabuchodonozora, króla Babilonu, mego sługi; oddałem mu nawet zwierzęta polne, aby mu służyły."
  tags: []
"Jr27,7":
  text: "Dlatego będą mu służyły te wszystkie narody, jego synowi i synowi jego syna, aż nadejdzie czas na jego ziemię. Wtedy ujarzmią go liczne narody i wielcy królowie."
  tags: []
"Jr27,8":
  text: "A ten naród i to królestwo, które nie będzie służyło Nabuchodonozorowi, królowi Babilonu, i które nie podda swego karku pod jarzmo króla Babilonu, taki naród nawiedzę mieczem, głodem i zarazą, mówi PAN, aż wytracę je jego ręką."
  tags: []
"Jr27,9":
  text: "Dlatego nie słuchajcie swoich proroków, wróżbitów ani tych, co mają sny, ani swoich wróżbiarzy, ani swoich czarowników, którzy wam mówią: Nie będziecie służyć królowi Babilonu."
  tags: []
"Jr27,10":
  text: "Oni bowiem prorokują wam kłamstwo, aby was oddalić od waszej ziemi, abym was wygnał i abyście poginęli."
  tags: []
"Jr27,11":
  text: "A naród, który podda swój kark pod jarzmo króla Babilonu i będzie mu służył, ten pozostawię w jego ziemi, mówi PAN, aby ją uprawiał i mieszkał w niej."
  tags: []
"Jr27,12":
  text: "A do Sedekiasza, króla Judy, powiedziałem zgodnie ze wszystkimi tymi słowami: Poddajcie swoje karki pod jarzmo króla Babilonu i służcie mu i jego ludowi, a będziecie żyć."
  tags: []
"Jr27,13":
  text: "Czemu macie zginąć, ty i twój lud, od miecza, od głodu i od zarazy, jak mówił PAN o narodzie, który nie chce służyć królowi Babilonu?"
  tags: []
"Jr27,14":
  text: "Nie słuchajcie więc słów tych proroków, którzy mówią do was: Nie będziecie służyć królowi Babilonu. Oni bowiem prorokują wam kłamstwo."
  tags: []
"Jr27,15":
  text: "Nie posłałem ich, mówi PAN, a jednak oni prorokują kłamliwie w moje imię, abym was wypędził i abyście zginęli, wy i prorocy, którzy wam prorokują."
  tags: []
"Jr27,16":
  text: "Także do kapłanów i do całego ludu powiedziałem: Tak mówi PAN: Nie słuchajcie słów swoich proroków, którzy prorokują wam, mówiąc: Oto naczynia domu PANA zostaną już wkrótce przywrócone z Babilonu. Oni bowiem prorokują wam kłamstwo."
  tags: []
"Jr27,17":
  text: "Nie słuchajcie ich, służcie królowi Babilonu, a będziecie żyć. Czemu to miasto miałoby stać się ruiną?"
  tags: []
"Jr27,18":
  text: "A jeśli oni są prorokami i jeśli słowo PANA jest u nich, proszę, niech wstawią się u PANA zastępów, aby te naczynia, które pozostały w domu PANA, w domu króla Judy i w Jerozolimie, nie dostały się do Babilonu."
  tags: []
"Jr27,19":
  text: "Tak bowiem mówi PAN zastępów o tych kolumnach, o morzu, o podstawkach i reszcie naczyń, które pozostały w tym mieście;"
  tags: []
"Jr27,20":
  text: "Których nie zabrał Nabuchodonozor, król Babilonu, gdy uprowadził do niewoli Jechoniasza, syna Joakima, króla Judy, z Jerozolimy do Babilonu, oraz wszystkich dostojników z Judy i Jerozolimy."
  tags: []
"Jr27,21":
  text: "Tak mówi PAN zastępów, Bóg Izraela, o tych naczyniach, które pozostały w domu PANA, w domu króla Judy i w Jerozolimie:"
  tags: []
"Jr27,22":
  text: "Zostaną zawiezione do Babilonu i będą tam aż do dnia, w którym upomnę się o nie, mówi PAN. Wtedy sprowadzę je i przywrócę na to miejsce."
  tags: []
