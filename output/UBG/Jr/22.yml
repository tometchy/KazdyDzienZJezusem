"Jr22,1":
  text: "Tak mówi PAN: Zejdź do domu króla Judy i mów tam to słowo;"
  tags: []
"Jr22,2":
  text: "Powiedz: Słuchaj słowa PANA, królu Judy, który zasiadasz na tronie Dawida, ty i twoi słudzy oraz twój lud, którzy wchodzicie przez te bramy."
  tags: []
"Jr22,3":
  text: "Tak mówi PAN: Wykonajcie sąd i sprawiedliwość i wybawiajcie uciśnionego z ręki ciemięzcy. Nie krzywdźcie ani nie uciskajcie obcego, sieroty i wdowy i nie przelewajcie krwi niewinnej na tym miejscu."
  tags: []
"Jr22,4":
  text: "Jeśli bowiem rzeczywiście spełnicie to słowo, wtedy będą wchodzić przez bramy tego domu królowie zasiadający na tronie, jeżdżący na rydwanach i na koniach, sam król i jego słudzy, i jego lud."
  tags: []
"Jr22,5":
  text: "Lecz jeśli nie posłuchacie tych słów, sam na siebie przysięgam, mówi PAN, że ten dom stanie się pustkowiem."
  tags: []
"Jr22,6":
  text: "Tak bowiem mówi PAN o domu króla Judy: Ty jesteś mi Gileadem i szczytem Libanu, lecz naprawdę zamienię cię w pustynię i w miasta niezamieszkane."
  tags: []
"Jr22,7":
  text: "I przygotuję przeciwko tobie niszczycieli, każdego ze swoim sprzętem. Wytną twoje wyborne cedry i wrzucą je w ogień."
  tags: []
"Jr22,8":
  text: "I wiele narodów będzie przechodzić koło tego miasta, i powiedzą jeden do drugiego: Dlaczego PAN tak uczynił temu wielkiemu miastu?"
  tags: []
"Jr22,9":
  text: "Wtedy odpowiedzą: Dlatego że porzucili przymierze PANA, swego Boga, a oddawali pokłon innym bogom i służyli im."
  tags: []
"Jr22,10":
  text: "Nie opłakujcie zmarłego ani nie żałujcie go, lecz nieustannie płaczcie nad tym, który odchodzi, bo już nigdy nie wróci ani nie zobaczy swojej rodzinnej ziemi."
  tags: []
"Jr22,11":
  text: "Tak bowiem mówi PAN o Szallumie, synu Jozjasza, króla Judy, który królował w miejsce Jozjasza, swego ojca, który wyszedł z tego miejsca: Już nigdy nie wróci;"
  tags: []
"Jr22,12":
  text: "Ale umrze na tym miejscu, gdzie go przeniosą, i już nie zobaczy tej ziemi."
  tags: []
"Jr22,13":
  text: "Biada temu, kto buduje swój dom na niesprawiedliwości, a swoje komnaty na krzywdzie; kto swemu bliźniemu każe pracować za darmo i nie daje mu jego zapłaty;"
  tags: []
"Jr22,14":
  text: "Który mówi: Zbuduję sobie wielki dom i przestronne komnaty; wybija sobie okna, wykłada jego wnętrze drzewem cedrowym i maluje cynobrem."
  tags: []
"Jr22,15":
  text: "Czy będziesz królował dlatego, że otaczasz się cedrem? Czyż twój ojciec nie jadał i nie pijał? A kiedy wykonywał sąd i sprawiedliwość, wtedy było mu dobrze."
  tags: []
"Jr22,16":
  text: "Gdy sądził sprawę ubogiego i nędznego, wtedy było mu dobrze. Czy nie na tym polega poznanie mnie? – mówi PAN."
  tags: []
"Jr22,17":
  text: "Lecz twoje oczy i serce pragną jedynie własnej korzyści, przelania niewinnej krwi, wywierania ucisku oraz przemocy."
  tags: []
"Jr22,18":
  text: "Dlatego tak mówi PAN o Joakimie, synu Jozjasza, króla Judy: Nie będą go opłakiwać ani mówić: Ach, mój bracie! Albo: Ach, siostro! Nie będą go opłakiwać ani mówić: Ach, panie! Albo: Ach, jego majestat!"
  tags: []
"Jr22,19":
  text: "Będzie pogrzebany jak osioł, wywloką go i wyrzucą poza bramy Jerozolimy."
  tags: []
"Jr22,20":
  text: "Wejdź na Liban i wołaj, na Baszanie podnieś swój głos, wołaj też z przełęczy, gdyż wszyscy twoi kochankowie zostali zniszczeni."
  tags: []
"Jr22,21":
  text: "Przemówiłem do ciebie w czasie twojej pomyślności, ale powiedziałaś: Nie posłucham. Taka jest twoja droga od twej młodości, nie usłuchałaś mojego głosu."
  tags: []
"Jr22,22":
  text: "Wiatr rozproszy wszystkich twoich pasterzy i twoi kochankowie pójdą w niewolę. Wtedy będziesz się rumienić i wstydzić z powodu całej twojej niegodziwości."
  tags: []
"Jr22,23":
  text: "Ty, która mieszkasz na Libanie, która robisz sobie gniazdo wśród cedrów, jakże będziesz pełna wdzięku, gdy ogarną cię boleści jak bóle rodzącej!"
  tags: []
"Jr22,24":
  text: "Jak żyję ja, mówi PAN, choćby Choniasz, syn Joakima, króla Judy, był sygnetem na mojej prawej ręce, zerwałbym cię stamtąd;"
  tags: []
"Jr22,25":
  text: "I wydam cię w ręce tych, którzy czyhają na twoje życie, i w ręce tych, których twarzy ty się lękasz, to jest, w ręce Nabuchodonozora, króla Babilonu, i w ręce Chaldejczyków;"
  tags: []
"Jr22,26":
  text: "Wyrzucę ciebie i twoją matkę, która cię urodziła, do obcej ziemi, w której się nie urodziliście, i tam pomrzecie."
  tags: []
"Jr22,27":
  text: "Lecz do ziemi, za którą będą tęsknić, aby tam wrócić, nie wrócą."
  tags: []
"Jr22,28":
  text: "Czy ten człowiek, Choniasz, jest posągiem wzgardzonym i zdruzgotanym? Albo naczyniem, w którym nie ma żadnego piękna? Czemu zostali odrzuceni on i jego potomstwo i wyrzuceni do ziemi, której nie znają?"
  tags: []
"Jr22,29":
  text: "Ziemio, ziemio, ziemio! Słuchaj słowa PANA."
  tags: []
"Jr22,30":
  text: "Tak mówi PAN: Zapiszcie tego człowieka jako bezpotomnego i że mu się nie poszczęści za jego dni. Nie poszczęści się nikomu z jego potomstwa, by zasiąść na tronie Dawida i panować jeszcze w Judzie."
  tags: []
