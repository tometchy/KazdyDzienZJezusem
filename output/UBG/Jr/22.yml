"Jr22,1": "Tak mówi PAN: Zejdź do domu króla Judy i mów tam to słowo;"
"Jr22,2": "Powiedz: Słuchaj słowa PANA, królu Judy, który zasiadasz na tronie Dawida, ty i twoi słudzy oraz twój lud, którzy wchodzicie przez te bramy."
"Jr22,3": "Tak mówi PAN: Wykonajcie sąd i sprawiedliwość i wybawiajcie uciśnionego z ręki ciemięzcy. Nie krzywdźcie ani nie uciskajcie obcego, sieroty i wdowy i nie przelewajcie krwi niewinnej na tym miejscu."
"Jr22,4": "Jeśli bowiem rzeczywiście spełnicie to słowo, wtedy będą wchodzić przez bramy tego domu królowie zasiadający na tronie, jeżdżący na rydwanach i na koniach, sam król i jego słudzy, i jego lud."
"Jr22,5": "Lecz jeśli nie posłuchacie tych słów, sam na siebie przysięgam, mówi PAN, że ten dom stanie się pustkowiem."
"Jr22,6": "Tak bowiem mówi PAN o domu króla Judy: Ty jesteś mi Gileadem i szczytem Libanu, lecz naprawdę zamienię cię w pustynię i w miasta niezamieszkane."
"Jr22,7": "I przygotuję przeciwko tobie niszczycieli, każdego ze swoim sprzętem. Wytną twoje wyborne cedry i wrzucą je w ogień."
"Jr22,8": "I wiele narodów będzie przechodzić koło tego miasta, i powiedzą jeden do drugiego: Dlaczego PAN tak uczynił temu wielkiemu miastu?"
"Jr22,9": "Wtedy odpowiedzą: Dlatego że porzucili przymierze PANA, swego Boga, a oddawali pokłon innym bogom i służyli im."
"Jr22,10": "Nie opłakujcie zmarłego ani nie żałujcie go, lecz nieustannie płaczcie nad tym, który odchodzi, bo już nigdy nie wróci ani nie zobaczy swojej rodzinnej ziemi."
"Jr22,11": "Tak bowiem mówi PAN o Szallumie, synu Jozjasza, króla Judy, który królował w miejsce Jozjasza, swego ojca, który wyszedł z tego miejsca: Już nigdy nie wróci;"
"Jr22,12": "Ale umrze na tym miejscu, gdzie go przeniosą, i już nie zobaczy tej ziemi."
"Jr22,13": "Biada temu, kto buduje swój dom na niesprawiedliwości, a swoje komnaty na krzywdzie; kto swemu bliźniemu każe pracować za darmo i nie daje mu jego zapłaty;"
"Jr22,14": "Który mówi: Zbuduję sobie wielki dom i przestronne komnaty; wybija sobie okna, wykłada jego wnętrze drzewem cedrowym i maluje cynobrem."
"Jr22,15": "Czy będziesz królował dlatego, że otaczasz się cedrem? Czyż twój ojciec nie jadał i nie pijał? A kiedy wykonywał sąd i sprawiedliwość, wtedy było mu dobrze."
"Jr22,16": "Gdy sądził sprawę ubogiego i nędznego, wtedy było mu dobrze. Czy nie na tym polega poznanie mnie? – mówi PAN."
"Jr22,17": "Lecz twoje oczy i serce pragną jedynie własnej korzyści, przelania niewinnej krwi, wywierania ucisku oraz przemocy."
"Jr22,18": "Dlatego tak mówi PAN o Joakimie, synu Jozjasza, króla Judy: Nie będą go opłakiwać ani mówić: Ach, mój bracie! Albo: Ach, siostro! Nie będą go opłakiwać ani mówić: Ach, panie! Albo: Ach, jego majestat!"
"Jr22,19": "Będzie pogrzebany jak osioł, wywloką go i wyrzucą poza bramy Jerozolimy."
"Jr22,20": "Wejdź na Liban i wołaj, na Baszanie podnieś swój głos, wołaj też z przełęczy, gdyż wszyscy twoi kochankowie zostali zniszczeni."
"Jr22,21": "Przemówiłem do ciebie w czasie twojej pomyślności, ale powiedziałaś: Nie posłucham. Taka jest twoja droga od twej młodości, nie usłuchałaś mojego głosu."
"Jr22,22": "Wiatr rozproszy wszystkich twoich pasterzy i twoi kochankowie pójdą w niewolę. Wtedy będziesz się rumienić i wstydzić z powodu całej twojej niegodziwości."
"Jr22,23": "Ty, która mieszkasz na Libanie, która robisz sobie gniazdo wśród cedrów, jakże będziesz pełna wdzięku, gdy ogarną cię boleści jak bóle rodzącej!"
"Jr22,24": "Jak żyję ja, mówi PAN, choćby Choniasz, syn Joakima, króla Judy, był sygnetem na mojej prawej ręce, zerwałbym cię stamtąd;"
"Jr22,25": "I wydam cię w ręce tych, którzy czyhają na twoje życie, i w ręce tych, których twarzy ty się lękasz, to jest, w ręce Nabuchodonozora, króla Babilonu, i w ręce Chaldejczyków;"
"Jr22,26": "Wyrzucę ciebie i twoją matkę, która cię urodziła, do obcej ziemi, w której się nie urodziliście, i tam pomrzecie."
"Jr22,27": "Lecz do ziemi, za którą będą tęsknić, aby tam wrócić, nie wrócą."
"Jr22,28": "Czy ten człowiek, Choniasz, jest posągiem wzgardzonym i zdruzgotanym? Albo naczyniem, w którym nie ma żadnego piękna? Czemu zostali odrzuceni on i jego potomstwo i wyrzuceni do ziemi, której nie znają?"
"Jr22,29": "Ziemio, ziemio, ziemio! Słuchaj słowa PANA."
"Jr22,30": "Tak mówi PAN: Zapiszcie tego człowieka jako bezpotomnego i że mu się nie poszczęści za jego dni. Nie poszczęści się nikomu z jego potomstwa, by zasiąść na tronie Dawida i panować jeszcze w Judzie."
