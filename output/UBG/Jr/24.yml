"Jr24,1":
  text: "PAN ukazał mi widzenie, a oto dwa kosze fig były postawione przed świątynią PANA, gdy Nabuchodonozor, król Babilonu, uprowadził do niewoli Jechoniasza, syna Joakima, króla Judy, oraz książąt Judy, cieśli i kowali z Jerozolimy, i przyprowadził ich do Babilonu."
  tags: []
"Jr24,2":
  text: "Jeden kosz zawierał bardzo dobre figi, jakimi są figi dojrzałe, a drugi kosz zawierał bardzo złe figi, tak złe, że nie można było ich jeść."
  tags: []
"Jr24,3":
  text: "I PAN zapytał mnie: Co widzisz, Jeremiaszu? Odpowiedziałem: Figi. Dobre figi są bardzo dobre, a złe są bardzo złe, tak złe, że nie można było ich jeść."
  tags: []
"Jr24,4":
  text: "I doszło do mnie słowo PANA mówiące:"
  tags: []
"Jr24,5":
  text: "Tak mówi PAN, Bóg Izraela: Jak na te dobre figi, tak spojrzę łaskawie na tych z Judy, którzy zostali uprowadzeni do niewoli, których wysłałem z tego miejsca do ziemi Chaldejczyków, dla ich dobra."
  tags: []
"Jr24,6":
  text: "I zwrócę na nich swoje oko dla ich dobra i przyprowadzę ich do tej ziemi, gdzie ich odbuduję, a nie zburzę, i zasadzę, a nie wykorzenię."
  tags: []
"Jr24,7":
  text: "Dam im bowiem serce, aby mnie poznali, że ja jestem PAN. Oni będą moim ludem, a ja będę ich Bogiem, gdyż nawrócą się do mnie całym swoim sercem."
  tags: []
"Jr24,8":
  text: "A jak te złe figi, których nie można jeść, bo są tak złe, tak mówi PAN: Tak samo postąpię z Sedekiaszem, królem Judy, z jego książętami, z resztką Jerozolimy, która pozostała w tej ziemi, oraz z tymi, którzy mieszkają w ziemi Egiptu."
  tags: []
"Jr24,9":
  text: "Wydam ich na wysiedlenie i na ucisk we wszystkich królestwach ziemi, na pohańbienie i na przysłowie, na pośmiewisko i na przekleństwo we wszystkich miejscach, do których ich wypędzę."
  tags: []
"Jr24,10":
  text: "I będę posyłał na nich miecz, głód i zarazę, aż będą wytraceni z ziemi, którą dałem im oraz ich ojcom."
  tags: []
