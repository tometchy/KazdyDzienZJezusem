"Jr24,1": "PAN ukazał mi widzenie, a oto dwa kosze fig były postawione przed świątynią PANA, gdy Nabuchodonozor, król Babilonu, uprowadził do niewoli Jechoniasza, syna Joakima, króla Judy, oraz książąt Judy, cieśli i kowali z Jerozolimy, i przyprowadził ich do Babilonu."
"Jr24,2": "Jeden kosz zawierał bardzo dobre figi, jakimi są figi dojrzałe, a drugi kosz zawierał bardzo złe figi, tak złe, że nie można było ich jeść."
"Jr24,3": "I PAN zapytał mnie: Co widzisz, Jeremiaszu? Odpowiedziałem: Figi. Dobre figi są bardzo dobre, a złe są bardzo złe, tak złe, że nie można było ich jeść."
"Jr24,4": "I doszło do mnie słowo PANA mówiące:"
"Jr24,5": "Tak mówi PAN, Bóg Izraela: Jak na te dobre figi, tak spojrzę łaskawie na tych z Judy, którzy zostali uprowadzeni do niewoli, których wysłałem z tego miejsca do ziemi Chaldejczyków, dla ich dobra."
"Jr24,6": "I zwrócę na nich swoje oko dla ich dobra i przyprowadzę ich do tej ziemi, gdzie ich odbuduję, a nie zburzę, i zasadzę, a nie wykorzenię."
"Jr24,7": "Dam im bowiem serce, aby mnie poznali, że ja jestem PAN. Oni będą moim ludem, a ja będę ich Bogiem, gdyż nawrócą się do mnie całym swoim sercem."
"Jr24,8": "A jak te złe figi, których nie można jeść, bo są tak złe, tak mówi PAN: Tak samo postąpię z Sedekiaszem, królem Judy, z jego książętami, z resztką Jerozolimy, która pozostała w tej ziemi, oraz z tymi, którzy mieszkają w ziemi Egiptu."
"Jr24,9": "Wydam ich na wysiedlenie i na ucisk we wszystkich królestwach ziemi, na pohańbienie i na przysłowie, na pośmiewisko i na przekleństwo we wszystkich miejscach, do których ich wypędzę."
"Jr24,10": "I będę posyłał na nich miecz, głód i zarazę, aż będą wytraceni z ziemi, którą dałem im oraz ich ojcom."
