"Jr21,1": "Słowo, które doszło do Jeremiasza od PANA, gdy król Sedekiasz posłał do niego Paszchura, syna Malkiasza, i Sofoniasza, syna Maasejasza, kapłana, aby powiedzieli:"
"Jr21,2": "Poradź się, proszę, PANA w naszej sprawie, bo Nabuchodonozor, król Babilonu, walczy przeciwko nam. Może PAN postąpi z nami zgodnie ze wszystkimi swoimi cudownymi dziełami, aby ten odstąpił od nas."
"Jr21,3": "Jeremiasz odpowiedział im: Tak powiedzcie Sedekiaszowi:"
"Jr21,4": "Tak mówi PAN, Bóg Izraela: Oto odwrócę sprzęt wojenny, który jest w waszych rękach, i którym walczycie przeciw królowi Babilonu i przeciwko Chaldejczykom, którzy was oblegli dokoła muru, i zgromadzę ich w środku tego miasta."
"Jr21,5": "A ja sam będę walczył przeciwko wam wyciągniętą ręką i mocnym ramieniem, z gniewem, zawziętością i wielką zapalczywością."
"Jr21,6": "I pobiję mieszkańców tego miasta, zarówno ludzi, jak i zwierzęta. Umrą od wielkiej zarazy."
"Jr21,7": "A potem, mówi PAN, wydam Sedekiasza, króla Judy, jego sługi i lud oraz ocalałych w tym mieście od zarazy, od miecza i od głodu w ręce Nabuchodonozora, króla Babilonu, w ręce ich wrogów i w ręce czyhających na ich życie. A on pobije ich ostrzem miecza, nie pożałuje ich ani nie oszczędzi, ani się nie zlituje."
"Jr21,8": "A ludowi temu powiedz: Tak mówi PAN: Oto kładę przed wami drogę życia i drogę śmierci."
"Jr21,9": "Ktokolwiek zostanie w tym mieście, zginie od miecza, z głodu i od zarazy. Kto zaś wyjdzie i podda się Chaldejczykom, którzy was oblegli, pozostanie żywy i jego życie będzie dla niego jak zdobycz."
"Jr21,10": "Zwróciłem bowiem swoje oblicze przeciwko temu miastu na zło, a nie na dobro, mówi PAN. Będzie wydane w ręce króla Babilonu, a on spali je ogniem."
"Jr21,11": "Ale do domu króla Judy powiedz: Słuchajcie słowa PANA."
"Jr21,12": "Domu Dawida, tak mówi PAN: Sprawujcie sąd każdego poranka i wybawiajcie uciśnionego z ręki ciemięzcy, aby moja zapalczywość nie wybuchła jak ogień i nie płonął on tak, że nikt nie zdoła go zgasić z powodu zła waszych uczynków."
"Jr21,13": "Oto ja jestem przeciwko tobie, mieszkanko doliny, skało równiny, mówi PAN – przeciwko wam, którzy mówicie: Któż nadciągnie na nas? Któż wejdzie do naszych mieszkań?"
"Jr21,14": "Lecz ja was nawiedzę według owocu waszych uczynków, mówi PAN. Rozniecę ogień w jej lesie, który pochłonie wszystko dokoła niego."
