"Jr38,1":
  text: "Wtedy Szefatiasz, syn Matana, Gedaliasz, syn Paszchura, Jukal, syn Szelemiasza, i Paszchur, syn Malkiasza, usłyszeli słowa, które Jeremiasz wypowiadał do całego ludu:"
  tags: []
"Jr38,2":
  text: "Tak mówi PAN: Kto zostanie w tym mieście, zginie od miecza, od głodu i od zarazy. Ale kto przejdzie do Chaldejczyków, będzie żyć; jego życie będzie dla niego jak zdobycz i pozostanie żywy."
  tags: []
"Jr38,3":
  text: "Tak mówi PAN: To miasto na pewno będzie wydane w ręce wojska króla Babilonu i on je zdobędzie."
  tags: []
"Jr38,4":
  text: "Dlatego książęta powiedzieli do króla: Ten człowiek musi umrzeć, ponieważ osłabia on ręce wojowników, którzy pozostali w tym mieście, i ręce całego ludu, gdy mówi do nich takie słowa. Ten człowiek bowiem nie szuka pomyślności tego ludu, lecz jego nieszczęścia."
  tags: []
"Jr38,5":
  text: "Wtedy król Sedekiasz powiedział: Oto jest w waszych rękach, bo król nic nie może czynić przeciwko wam."
  tags: []
"Jr38,6":
  text: "Zabrali więc Jeremiasza i wrzucili go do lochu Malkiasza, syna Meleka, który zbudowany był na dziedzińcu więzienia; spuścili Jeremiasza na sznurach. A w tym lochu nie było żadnej wody, tylko samo błoto. I Jeremiasz ugrzązł w tym błocie."
  tags: []
"Jr38,7":
  text: "A gdy Ebedmelek, Etiopczyk, eunuch w domu króla, usłyszał, że Jeremiasza wrzucono do lochu – a król siedział w Bramie Beniamina;"
  tags: []
"Jr38,8":
  text: "Ebedmelek wyszedł z domu króla i powiedział do króla:"
  tags: []
"Jr38,9":
  text: "Królu, mój panie! Ci ludzie postąpili źle we wszystkim, co uczynili wobec proroka Jeremiasza, którego wrzucili do tego lochu; umrze z głodu w tym miejscu, ponieważ już nie ma chleba w mieście."
  tags: []
"Jr38,10":
  text: "Wtedy król rozkazał Ebedmelekowi, Etiopczykowi: Weź stąd ze sobą trzydziestu mężczyzn i wyciągnij proroka Jeremiasza z lochu, zanim umrze."
  tags: []
"Jr38,11":
  text: "Wziął więc Ebedmelek tych mężczyzn ze sobą, wszedł do domu króla pod skarbnicę i zabrał stamtąd stare, podarte łachmany i zbutwiałe szmaty, które spuścił na sznurach do Jeremiasza, do lochu."
  tags: []
"Jr38,12":
  text: "I Ebedmelek, Etiopczyk, powiedział do Jeremiasza: Podłóż te stare, podarte łachmany i zbutwiałe szmaty pod pachy swoich rąk, pod sznury. I Jeremiasz tak uczynił."
  tags: []
"Jr38,13":
  text: "Wyciągnęli więc Jeremiasza sznurami i wydobyli go z lochu. Potem Jeremiasz siedział na dziedzińcu więzienia."
  tags: []
"Jr38,14":
  text: "Następnie król Sedekiasz posłał i wziął proroka Jeremiasza do siebie, do trzeciego wejścia domu PANA. I król powiedział do Jeremiasza: Zapytam cię o jedną rzecz, nie taj niczego przede mną."
  tags: []
"Jr38,15":
  text: "Jeremiasz odpowiedział Sedekiaszowi: Jeśli ci powiem, czy na pewno nie zabijesz mnie? Jeśli ci coś poradzę, nie posłuchasz mnie."
  tags: []
"Jr38,16":
  text: "Wtedy król Sedekiasz przysiągł Jeremiaszowi potajemnie: Jak żyje PAN, który stworzył nam dusze, nie zabiję cię ani nie wydam cię w ręce tych mężczyzn, którzy czyhają na twoje życie."
  tags: []
"Jr38,17":
  text: "Jeremiasz powiedział do Sedekiasza: Tak mówi PAN, Bóg zastępów, Bóg Izraela: Jeśli dobrowolnie wyjdziesz do książąt króla Babilonu, wtedy twoja dusza będzie żyć, a to miasto nie zostanie spalone ogniem; pozostaniesz żywy ty i twój dom;"
  tags: []
"Jr38,18":
  text: "Ale jeśli nie wyjdziesz do książąt króla Babilonu, na pewno to miasto będzie wydane w ręce Chaldejczyków, którzy spalą je ogniem, a ty nie ujdziesz z ich rąk."
  tags: []
"Jr38,19":
  text: "Król Sedekiasz powiedział do Jeremiasza: Bardzo się boję Żydów, którzy przeszli do Chaldejczyków, by czasem nie wydali mnie w ich ręce i nie szydzili ze mnie."
  tags: []
"Jr38,20":
  text: "Jeremiasz odpowiedział: Nie wydadzą cię. Posłuchaj, proszę, głosu PANA, który ci przekazuję, a dobrze ci się powiedzie i twoja dusza będzie żyć."
  tags: []
"Jr38,21":
  text: "Jeśli zaś będziesz wzbraniał się wyjść, takie jest słowo, które PAN mi pokazał:"
  tags: []
"Jr38,22":
  text: "Oto wszystkie kobiety, które pozostały w domu króla Judy, będą wyprowadzone do książąt króla Babilonu i tak one powiedzą: Twoi przyjaciele oszukali cię i przemogli, twoje nogi ugrzęzły w błocie, a oni się wycofali."
  tags: []
"Jr38,23":
  text: "Wszystkie twoje żony i twoich synów wyprowadzą do Chaldejczyków, a i ty nie ujdziesz ich rękom, lecz będziesz pojmany ręką króla Babilonu, a to miasto spalą ogniem."
  tags: []
"Jr38,24":
  text: "Wtedy Sedekiasz powiedział do Jeremiasza: Niech nikt nie wie o tej rozmowie, a ty nie umrzesz;"
  tags: []
"Jr38,25":
  text: "A jeśli książęta usłyszą, że rozmawiałem z tobą, przyjdą do ciebie i powiedzą: Powiedz nam, proszę, co mówiłeś do króla; nie ukrywaj przed nami, a nie zabijemy cię; a co ci mówił król?"
  tags: []
"Jr38,26":
  text: "Wtedy im powiesz: Przedłożyłem królowi moją prośbę, aby mnie nie odsyłał do domu Jonatana, abym tam nie umarł."
  tags: []
"Jr38,27":
  text: "I wszyscy książęta przyszli do Jeremiasza, i pytali go, a on odpowiedział im zgodnie z tym wszystkim, co król mu rozkazał. I odstąpili w milczeniu od niego, gdyż sprawa nie wyszła na jaw."
  tags: []
"Jr38,28":
  text: "A Jeremiasz przebywał na dziedzińcu więzienia aż do tego dnia, kiedy zdobyto Jerozolimę. Był tam, gdy Jerozolima została zdobyta."
  tags: []
