"Jr38,1": "Wtedy Szefatiasz, syn Matana, Gedaliasz, syn Paszchura, Jukal, syn Szelemiasza, i Paszchur, syn Malkiasza, usłyszeli słowa, które Jeremiasz wypowiadał do całego ludu:"
"Jr38,2": "Tak mówi PAN: Kto zostanie w tym mieście, zginie od miecza, od głodu i od zarazy. Ale kto przejdzie do Chaldejczyków, będzie żyć; jego życie będzie dla niego jak zdobycz i pozostanie żywy."
"Jr38,3": "Tak mówi PAN: To miasto na pewno będzie wydane w ręce wojska króla Babilonu i on je zdobędzie."
"Jr38,4": "Dlatego książęta powiedzieli do króla: Ten człowiek musi umrzeć, ponieważ osłabia on ręce wojowników, którzy pozostali w tym mieście, i ręce całego ludu, gdy mówi do nich takie słowa. Ten człowiek bowiem nie szuka pomyślności tego ludu, lecz jego nieszczęścia."
"Jr38,5": "Wtedy król Sedekiasz powiedział: Oto jest w waszych rękach, bo król nic nie może czynić przeciwko wam."
"Jr38,6": "Zabrali więc Jeremiasza i wrzucili go do lochu Malkiasza, syna Meleka, który zbudowany był na dziedzińcu więzienia; spuścili Jeremiasza na sznurach. A w tym lochu nie było żadnej wody, tylko samo błoto. I Jeremiasz ugrzązł w tym błocie."
"Jr38,7": "A gdy Ebedmelek, Etiopczyk, eunuch w domu króla, usłyszał, że Jeremiasza wrzucono do lochu – a król siedział w Bramie Beniamina;"
"Jr38,8": "Ebedmelek wyszedł z domu króla i powiedział do króla:"
"Jr38,9": "Królu, mój panie! Ci ludzie postąpili źle we wszystkim, co uczynili wobec proroka Jeremiasza, którego wrzucili do tego lochu; umrze z głodu w tym miejscu, ponieważ już nie ma chleba w mieście."
"Jr38,10": "Wtedy król rozkazał Ebedmelekowi, Etiopczykowi: Weź stąd ze sobą trzydziestu mężczyzn i wyciągnij proroka Jeremiasza z lochu, zanim umrze."
"Jr38,11": "Wziął więc Ebedmelek tych mężczyzn ze sobą, wszedł do domu króla pod skarbnicę i zabrał stamtąd stare, podarte łachmany i zbutwiałe szmaty, które spuścił na sznurach do Jeremiasza, do lochu."
"Jr38,12": "I Ebedmelek, Etiopczyk, powiedział do Jeremiasza: Podłóż te stare, podarte łachmany i zbutwiałe szmaty pod pachy swoich rąk, pod sznury. I Jeremiasz tak uczynił."
"Jr38,13": "Wyciągnęli więc Jeremiasza sznurami i wydobyli go z lochu. Potem Jeremiasz siedział na dziedzińcu więzienia."
"Jr38,14": "Następnie król Sedekiasz posłał i wziął proroka Jeremiasza do siebie, do trzeciego wejścia domu PANA. I król powiedział do Jeremiasza: Zapytam cię o jedną rzecz, nie taj niczego przede mną."
"Jr38,15": "Jeremiasz odpowiedział Sedekiaszowi: Jeśli ci powiem, czy na pewno nie zabijesz mnie? Jeśli ci coś poradzę, nie posłuchasz mnie."
"Jr38,16": "Wtedy król Sedekiasz przysiągł Jeremiaszowi potajemnie: Jak żyje PAN, który stworzył nam dusze, nie zabiję cię ani nie wydam cię w ręce tych mężczyzn, którzy czyhają na twoje życie."
"Jr38,17": "Jeremiasz powiedział do Sedekiasza: Tak mówi PAN, Bóg zastępów, Bóg Izraela: Jeśli dobrowolnie wyjdziesz do książąt króla Babilonu, wtedy twoja dusza będzie żyć, a to miasto nie zostanie spalone ogniem; pozostaniesz żywy ty i twój dom;"
"Jr38,18": "Ale jeśli nie wyjdziesz do książąt króla Babilonu, na pewno to miasto będzie wydane w ręce Chaldejczyków, którzy spalą je ogniem, a ty nie ujdziesz z ich rąk."
"Jr38,19": "Król Sedekiasz powiedział do Jeremiasza: Bardzo się boję Żydów, którzy przeszli do Chaldejczyków, by czasem nie wydali mnie w ich ręce i nie szydzili ze mnie."
"Jr38,20": "Jeremiasz odpowiedział: Nie wydadzą cię. Posłuchaj, proszę, głosu PANA, który ci przekazuję, a dobrze ci się powiedzie i twoja dusza będzie żyć."
"Jr38,21": "Jeśli zaś będziesz wzbraniał się wyjść, takie jest słowo, które PAN mi pokazał:"
"Jr38,22": "Oto wszystkie kobiety, które pozostały w domu króla Judy, będą wyprowadzone do książąt króla Babilonu i tak one powiedzą: Twoi przyjaciele oszukali cię i przemogli, twoje nogi ugrzęzły w błocie, a oni się wycofali."
"Jr38,23": "Wszystkie twoje żony i twoich synów wyprowadzą do Chaldejczyków, a i ty nie ujdziesz ich rękom, lecz będziesz pojmany ręką króla Babilonu, a to miasto spalą ogniem."
"Jr38,24": "Wtedy Sedekiasz powiedział do Jeremiasza: Niech nikt nie wie o tej rozmowie, a ty nie umrzesz;"
"Jr38,25": "A jeśli książęta usłyszą, że rozmawiałem z tobą, przyjdą do ciebie i powiedzą: Powiedz nam, proszę, co mówiłeś do króla; nie ukrywaj przed nami, a nie zabijemy cię; a co ci mówił król?"
"Jr38,26": "Wtedy im powiesz: Przedłożyłem królowi moją prośbę, aby mnie nie odsyłał do domu Jonatana, abym tam nie umarł."
"Jr38,27": "I wszyscy książęta przyszli do Jeremiasza, i pytali go, a on odpowiedział im zgodnie z tym wszystkim, co król mu rozkazał. I odstąpili w milczeniu od niego, gdyż sprawa nie wyszła na jaw."
"Jr38,28": "A Jeremiasz przebywał na dziedzińcu więzienia aż do tego dnia, kiedy zdobyto Jerozolimę. Był tam, gdy Jerozolima została zdobyta."
