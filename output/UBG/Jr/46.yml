"Jr46,1":
  text: "Słowo PANA, które doszło do proroka Jeremiasza przeciw poganom;"
  tags: []
"Jr46,2":
  text: "Przeciw Egiptowi, przeciw wojsku faraona Neko, króla Egiptu, które znajdowało się nad rzeką Eufrat pod Karkemisz, a które pobił Nabuchodonozor, król Babilonu, w czwartym roku Joakima, syna Jozjasza, króla Judy:"
  tags: []
"Jr46,3":
  text: "Przygotujcie puklerz i tarczę i ruszajcie do walki."
  tags: []
"Jr46,4":
  text: "Zaprzęgajcie konie i wsiadajcie, jeźdźcy; stańcie w hełmach, ostrzcie włócznie, przywdziejcie pancerze."
  tags: []
"Jr46,5":
  text: "Czemu widzę ich zatrwożonych i cofających się? Ich mocarze są pobici i uciekają w popłochu, nie oglądając się. Strach jest wszędzie, mówi PAN."
  tags: []
"Jr46,6":
  text: "Prędki nie ucieknie i mocarz nie ujdzie; na północy, nad brzegiem rzeki Eufrat, potkną się i upadną."
  tags: []
"Jr46,7":
  text: "Kim jest ten, co się podnosi jak rzeka, a jego wody piętrzą się jak rzeki?"
  tags: []
"Jr46,8":
  text: "Egipt podnosi się jak rzeka, a jego wody piętrzą się jak w rzece i mówi: Podnoszę się, pokryję ziemię, zniszczę miasto i jego mieszkańców."
  tags: []
"Jr46,9":
  text: "Nacierajcie, konie, pędźcie, rydwany; niech się ruszą mocarze: Etiopczycy i Libańczycy noszący tarcze, Ludyjczycy, którzy noszą i napinają łuk."
  tags: []
"Jr46,10":
  text: "Ten dzień bowiem należy do Pana BOGA zastępów i jest dniem pomsty, aby się zemścił nad swoimi wrogami. Miecz będzie pożerał i nasyci się, i upije się ich krwią, gdyż Pan Bóg zastępów ma ofiarę w ziemi północnej, nad rzeką Eufrat."
  tags: []
"Jr46,11":
  text: "Wstąp do Gileadu i nabierz balsamu, dziewico, córko Egiptu. Ale daremnie używasz wielu lekarstw, bo nie będziesz uleczona."
  tags: []
"Jr46,12":
  text: "Narody słyszały o twojej hańbie i twój lament napełnił ziemię, gdyż mocarz potknął się o mocarza i obaj razem upadli."
  tags: []
"Jr46,13":
  text: "Słowo, które PAN wypowiedział do proroka Jeremiasza, o wyprawie Nabuchodonozora, króla Babilonu, aby uderzyć ziemię Egiptu:"
  tags: []
"Jr46,14":
  text: "Oznajmijcie w Egipcie i ogłoście w Migdol; opowiadajcie w Nof i w Tachpanches. Powiedzcie: Stań i przygotuj się, bo miecz pożre to, co jest dokoła ciebie."
  tags: []
"Jr46,15":
  text: "Czemu twoi mocarze zostali powaleni? Nie mogli się ostać, gdyż natarł na nich PAN."
  tags: []
"Jr46,16":
  text: "Wielu potknęło się, a padli jeden na drugiego. Mówili: Wstań, wróćmy do naszego ludu i do ziemi ojczystej przed ostrzem niszczycielskiego miecza."
  tags: []
"Jr46,17":
  text: "Tam zawołali: Faraon, król Egiptu, to tylko próżny trzask; jego ustalony czas już minął."
  tags: []
"Jr46,18":
  text: "Jak żyję ja – mówi Król, a jego imię PAN zastępów – jak Tabor wśród gór i jak Karmel nad morzem, tak on przyjdzie."
  tags: []
"Jr46,19":
  text: "Córko, która mieszkasz w Egipcie, przygotuj swoje rzeczy na niewolę, bo Nof będzie pustkowiem i spustoszeniem, bez mieszkańców."
  tags: []
"Jr46,20":
  text: "Egipt jest jak piękna jałówka, ale jej zniszczenie nadchodzi, idzie z północy."
  tags: []
"Jr46,21":
  text: "Najemnicy pośród niego są jak tuczone cielęta, bo oni także odwrócili się i uciekli razem. Nie ostali się, bo przyszedł na nich dzień ich porażki, czas ich nawiedzenia."
  tags: []
"Jr46,22":
  text: "Jego głos jak głos węża, bo nadciągną z wojskiem, z siekierami przyjdą przeciw niemu jak rąbiący drzewa."
  tags: []
"Jr46,23":
  text: "Wyrąbią jego las, mówi PAN, choć nie da się go policzyć. Są bowiem liczniejsi od szarańczy i niezliczeni."
  tags: []
"Jr46,24":
  text: "Zawstydzi się córka Egiptu, będzie wydana w ręce ludu z północy."
  tags: []
"Jr46,25":
  text: "PAN zastępów, Bóg Izraela, mówi: Oto ukarzę cały liczny lud miasta No, także faraona i Egipt, jego bogów i królów, faraona i tych, którzy pokładają w nim ufność."
  tags: []
"Jr46,26":
  text: "I wydam ich w ręce tych, którzy czyhają na ich życie, w ręce Nabuchodonozora, króla Babilonu, i w ręce jego sług. Lecz potem będzie zamieszkały jak za dawnych dni, mówi PAN."
  tags: []
"Jr46,27":
  text: "Ale ty się nie bój, mój sługo, Jakubie, i nie lękaj się, Izraelu. Oto bowiem wybawię cię z daleka i twoje potomstwo z ziemi jego niewoli. Jakub powróci i zazna odpoczynku i pokoju, a nikt go nie zatrwoży."
  tags: []
"Jr46,28":
  text: "Nie bój się, Jakubie, mój sługo, mówi PAN, bo ja jestem z tobą. Położę kres wszystkim narodom, do których cię wypędziłem. Tobie jednak nie położę kresu, ale będę cię karał sprawiedliwie; nie zostawię cię całkiem bez kary."
  tags: []
