"Jr43,1":
  text: "Gdy Jeremiasz przestał mówić do całego ludu te wszystkie słowa PANA, ich Boga, z którymi posłał go do nich PAN, ich Bóg, wszystkie te słowa;"
  tags: []
"Jr43,2":
  text: "Azariasz, syn Hoszajasza, i Jochanan, syn Kareacha, oraz wszyscy pyszni mężczyźni powiedzieli do Jeremiasza: Kłamstwo mówisz! Nie posłał cię PAN, nasz Bóg, byś mówił: Nie idźcie do Egiptu, aby tam przebywać;"
  tags: []
"Jr43,3":
  text: "Ale Baruch, syn Neriasza, podburza cię przeciwko nam, aby nas wydać w ręce Chaldejczyków, żeby nas pobili albo uprowadzili do niewoli do Babilonu."
  tags: []
"Jr43,4":
  text: "Dlatego Jochanan, syn Kareacha, oraz wszyscy dowódcy wojsk, a także cały lud nie słuchali głosu PANA, aby pozostać w ziemi Judy."
  tags: []
"Jr43,5":
  text: "Lecz Jochanan, syn Kareacha, i wszyscy dowódcy wojsk zabrali całą resztkę Judy, która powróciła ze wszystkich narodów, do których została wygnana, by zamieszkać w ziemi Judy:"
  tags: []
"Jr43,6":
  text: "Mężczyzn, kobiety, dzieci, córki króla oraz każdą duszę, którą pozostawił Nebuzaradan, dowódca gwardii, z Gedaliaszem, synem Achikama, syna Szafana, z prorokiem Jeremiaszem i z Baruchem, synem Neriasza;"
  tags: []
"Jr43,7":
  text: "I poszli do ziemi Egiptu, bo nie usłuchali głosu PANA. I przybyli do Tachpanches."
  tags: []
"Jr43,8":
  text: "I w Tachpanches doszło do Jeremiasza słowo PANA mówiące:"
  tags: []
"Jr43,9":
  text: "Weź do rąk wielkie kamienie i ukryj je w glinie w piecu do wypalania cegieł, który jest przy wejściu do domu faraona w Tachpanches, na oczach mężczyzn Judy;"
  tags: []
"Jr43,10":
  text: "I powiedz im: Tak mówi PAN zastępów, Bóg Izraela: Oto poślę po Nabuchodonozora, króla Babilonu, mego sługę, i sprowadzę go, i ustawię jego tron na tych kamieniach, które ukryłem; i rozciągnie swój baldachim na nich."
  tags: []
"Jr43,11":
  text: "Gdy przyjdzie, pobije ziemię Egiptu, a oddani na śmierć na śmierć pójdą, oddani do niewoli do niewoli pójdą, i oddani pod miecz pod miecz pójdą."
  tags: []
"Jr43,12":
  text: "Podłożę ogień w domach bogów Egiptu i on je spali, i uprowadzi. Przyozdobi się ziemią Egiptu, jak pasterz zakłada swoją szatę, i wyjdzie stamtąd w pokoju."
  tags: []
"Jr43,13":
  text: "Rozbije posągi w Betszemesz, które jest w ziemi Egiptu, oraz ogniem spali domy bogów egipskich."
  tags: []
