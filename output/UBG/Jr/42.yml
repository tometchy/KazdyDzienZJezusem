"Jr42,1":
  text: "Potem wszyscy dowódcy wojsk, Jochanan, syn Kareacha, Jezaniasz, syn Hoszajasza, oraz cały lud, od małego do wielkiego, przystąpili;"
  tags: []
"Jr42,2":
  text: "I powiedzieli do proroka Jeremiasza: Niech nasza prośba dotrze do ciebie i módl się za nami do PANA, twojego Boga, za całą tę resztkę, bo mało nas pozostało z wielkiej liczby, jak sam widzisz na własne oczy;"
  tags: []
"Jr42,3":
  text: "I niech PAN, twój Bóg, wskaże nam drogę, którą mamy iść, i to, co mamy czynić."
  tags: []
"Jr42,4":
  text: "Wtedy prorok Jeremiasz odpowiedział im: Słyszałem. Oto będę się modlić do PANA, waszego Boga, według waszych słów, a cokolwiek PAN wam odpowie, ja wam oznajmię, niczego przed wami nie zataję."
  tags: []
"Jr42,5":
  text: "Oni zaś powiedzieli do Jeremiasza: Niech PAN będzie między nami prawdziwym i wiernym świadkiem, jeśli nie postąpimy według każdego słowa, z którym PAN, twój Bóg, pośle cię do nas."
  tags: []
"Jr42,6":
  text: "Czy będzie dobre, czy złe – usłuchamy głosu PANA, naszego Boga, do którego cię posyłamy; aby nam się dobrze powodziło, gdy będziemy słuchać głosu PANA, naszego Boga."
  tags: []
"Jr42,7":
  text: "A po upływie dziesięciu dni doszło do Jeremiasza słowo PANA."
  tags: []
"Jr42,8":
  text: "Zawołał więc Jochanana, syna Kareacha, i wszystkich dowódców wojsk, którzy z nim byli, oraz cały lud, od małego do wielkiego;"
  tags: []
"Jr42,9":
  text: "I powiedział do nich: Tak mówi PAN, Bóg Izraela, do którego mnie posłaliście, abym przedłożył mu waszą prośbę;"
  tags: []
"Jr42,10":
  text: "Jeśli pozostaniecie na stałe w tej ziemi, odbuduję was i nie zburzę, zasadzę was i nie wykorzenię. Żal mi bowiem tego nieszczęścia, które wam uczyniłem."
  tags: []
"Jr42,11":
  text: "Nie bójcie się króla Babilonu, którego tak się boicie. Nie bójcie się go, mówi PAN, bo ja jestem z wami, aby was wybawić i wyrwać z jego ręki."
  tags: []
"Jr42,12":
  text: "Okażę wam łaskę, aby on się zlitował nad wami i dał wam wrócić do waszej ziemi."
  tags: []
"Jr42,13":
  text: "Ale jeśli powiecie: Nie zostaniemy w tej ziemi, nie usłuchamy głosu PANA, waszego Boga;"
  tags: []
"Jr42,14":
  text: "Mówiąc: Żadną miarą! Lecz pójdziemy do ziemi Egiptu, gdzie nie zobaczymy wojny ani nie usłyszymy dźwięku trąby, ani nie będziemy łaknąć chleba; tam będziemy mieszkać;"
  tags: []
"Jr42,15":
  text: "To posłuchajcie teraz słowa PANA, resztko Judy: Tak mówi PAN zastępów, Bóg Izraela: Jeśli w uporze przy tym zostaniecie, aby pójść do ziemi Egiptu, i pójdziecie, aby tam przebywać;"
  tags: []
"Jr42,16":
  text: "Wtedy miecz, którego się boicie, dosięgnie was tam w ziemi Egiptu, a głód, którego się obawiacie, będzie was ścigał tam w Egipcie, i tam pomrzecie."
  tags: []
"Jr42,17":
  text: "Tak się stanie wszystkim, którzy koniecznie chcą iść do Egiptu, aby tam przebywać: umrą od miecza, od głodu i od zarazy, żaden z nich nie pozostanie ani nie ujdzie przed tym nieszczęściem, jakie na nich sprowadzę."
  tags: []
"Jr42,18":
  text: "Tak bowiem mówi PAN zastępów, Bóg Izraela: Jak się wylały mój gniew i moja zapalczywość na mieszkańców Jerozolimy, tak się wyleje moja zapalczywość na was, gdy wejdziecie do Egiptu. I będziecie przedmiotem złorzeczenia, zdumienia, przekleństwa i hańby, a nie zobaczycie już tego miejsca."
  tags: []
"Jr42,19":
  text: "PAN do was mówi, resztko Judy: Nie idźcie do Egiptu. Wiedzcie na pewno, że dziś was ostrzegam."
  tags: []
"Jr42,20":
  text: "Zwiedliście bowiem swoje dusze, gdy posłaliście mnie do PANA, waszego Boga, mówiąc: Módl się za nami do PANA, naszego Boga, i oznajmij nam wszystko, co powie PAN, nasz Bóg, a my to wykonamy."
  tags: []
"Jr42,21":
  text: "Dzisiaj to wam oznajmiam, wy jednak nie słuchacie głosu PANA, waszego Boga, we wszystkim, z czym mnie do was posłał."
  tags: []
"Jr42,22":
  text: "Dlatego mówię: Wiedzcie na pewno, że umrzecie od miecza, od głodu i od zarazy w tym miejscu, do którego pragniecie iść, aby tam przebywać."
  tags: []
