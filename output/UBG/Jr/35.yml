"Jr35,1":
  text: "Słowo, które doszło do Jeremiasza od PANA za dni Joakima, syna Jozjasza, króla Judy, mówiące:"
  tags: []
"Jr35,2":
  text: "Idź do domu Rekabitów, porozmawiaj z nimi i wprowadź ich do domu PANA, do jednej z komnat, i daj im wino do picia."
  tags: []
"Jr35,3":
  text: "Zabrałem więc ze sobą Jaazaniasza, syna Jeremiasza, syna Chabasiniasza, jego braci, wszystkich jego synów i cały dom Rekabitów;"
  tags: []
"Jr35,4":
  text: "I wprowadziłem ich do domu PANA, do komnaty synów Chanana, syna Jigdaliasza, męża Bożego, która była obok komnaty książęcej nad komnatą Maasejasza, syna Szalluma, stróża progu."
  tags: []
"Jr35,5":
  text: "Potem postawiłem przed synami domu Rekabitów czasze pełne wina i kubki i powiedziałem do nich: Pijcie wino."
  tags: []
"Jr35,6":
  text: "Lecz oni odpowiedzieli: Nie pijemy wina, bo Jonadab, syn Rekaba, nasz ojciec, nakazał nam, mówiąc: Nie pijcie wina, ani wy, ani wasi synowie, aż na wieki."
  tags: []
"Jr35,7":
  text: "Nie budujcie też domów ani nie obsiewajcie nasieniem, nie sadźcie winnic ani nie posiadajcie żadnej, ale mieszkajcie w namiotach przez wszystkie wasze dni, abyście żyli przez wiele dni na powierzchni ziemi, w której jesteście przybyszami."
  tags: []
"Jr35,8":
  text: "Byliśmy więc posłuszni głosowi Jonadaba, syna Rekaba, naszego ojca, we wszystkim, co nam nakazał: nie piliśmy wina przez wszystkie nasze dni, my, nasze żony, nasi synowie i nasze córki;"
  tags: []
"Jr35,9":
  text: "I nie budowaliśmy sobie domów do zamieszkania ani nie mieliśmy winnicy ani pola, ani siewu."
  tags: []
"Jr35,10":
  text: "Ale mieszkamy w namiotach; byliśmy posłuszni i postępujemy zgodnie ze wszystkim, co nam nakazał Jonadab, nasz ojciec."
  tags: []
"Jr35,11":
  text: "A gdy Nabuchodonozor, król Babilonu, nadciągnął do naszej ziemi, powiedzieliśmy: Chodźcie, wejdźmy do Jerozolimy przed wojskiem Chaldejczyków i przed wojskiem Syryjczyków. Zostaliśmy więc w Jerozolimie."
  tags: []
"Jr35,12":
  text: "Wówczas doszło słowo PANA do Jeremiasza mówiące:"
  tags: []
"Jr35,13":
  text: "Tak mówi PAN zastępów, Bóg Izraela: Idź i powiedz Judejczykom i mieszkańcom Jerozolimy: Czy nie przyjmiecie pouczenia, by słuchać moich słów? – mówi PAN."
  tags: []
"Jr35,14":
  text: "Wypełniane są słowa Jonadaba, syna Rekaba, które przykazał swoim synom, aby nie pili wina. Nie piją go bowiem aż do dziś, bo są posłuszni przykazaniu swego ojca. Ja jednak mówiłem do was, z wczesnym wstawaniem i mówieniem, lecz nie słuchaliście mnie."
  tags: []
"Jr35,15":
  text: "Posłałem też do was wszystkie swe sługi, proroków, z wczesnym wstawaniem i przesłaniem, mówiąc: Niech każdy zawróci już ze swej złej drogi i poprawi swoje uczynki, nie chodźcie za innymi bogami ani im nie służcie, a będziecie mieszkać w tej ziemi, którą dałem wam i waszym ojcom. Ale nie nakłoniliście swego ucha ani mnie nie usłuchaliście."
  tags: []
"Jr35,16":
  text: "I chociaż synowie Jonadaba, syna Rekaba, wypełnili nakaz swego ojca, który im przekazał, to jednak ten lud nie był mi posłuszny."
  tags: []
"Jr35,17":
  text: "Dlatego tak mówi PAN, Bóg zastępów, Bóg Izraela: Oto sprowadzę na Judę i na wszystkich mieszkańców Jerozolimy całe nieszczęście, które wypowiedziałem przeciwko nim, gdyż mówiłem do nich, a nie słuchali, wołałem ich, a nie odpowiedzieli."
  tags: []
"Jr35,18":
  text: "Domowi Rekabitów Jeremiasz zaś powiedział: Tak mówi PAN zastępów, Bóg Izraela: Ponieważ byliście posłuszni nakazowi Jonadaba, waszego ojca, i przestrzegaliście wszystkich jego przykazań, i postępowaliście zgodnie ze wszystkim, co wam nakazał;"
  tags: []
"Jr35,19":
  text: "Dlatego tak mówi PAN zastępów, Bóg Izraela: Nie zabraknie Jonadabowi, synowi Rekaba, potomka, który by stał przede mną po wszystkie dni."
  tags: []
