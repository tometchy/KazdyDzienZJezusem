"Jr29,1":
  text: "A to są słowa listu, który prorok Jeremiasz posłał z Jerozolimy do pozostałych starszych, którzy byli na wygnaniu, i do kapłanów, do proroków i do całego ludu – których Nabuchodonozor uprowadził z Jerozolimy do Babilonu."
  tags: []
"Jr29,2":
  text: "Było to po wyjściu z Jerozolimy króla Jechoniasza, królowej, dworzan, książąt Judy i Jerozolimy oraz cieśli i kowali."
  tags: []
"Jr29,3":
  text: "List wysłał przez Elasę, syna Szafana, i Gemariasza, syna Chilkiasza, których Sedekiasz, król Judy, posłał do Babilonu do Nabuchodonozora, króla Babilonu; był on tej treści:"
  tags: []
"Jr29,4":
  text: "Tak mówi PAN zastępów, Bóg Izraela, do wszystkich wygnańców, których uprowadziłem z Jerozolimy do Babilonu:"
  tags: []
"Jr29,5":
  text: "Budujcie domy i mieszkajcie w nich; zakładajcie ogrody i spożywajcie ich owoce;"
  tags: []
"Jr29,6":
  text: "Pojmujcie żony i płodźcie synów i córki; wybierajcie żony dla waszych synów i wydawajcie swoje córki za mąż, aby rodziły synów i córki. Rozmnażajcie się tam i niech was nie ubywa."
  tags: []
"Jr29,7":
  text: "Zabiegajcie o pokój dla tego miasta, do którego was uprowadziłem, i módlcie się za nie do PANA, bo od jego pokoju zależy wasz pokój."
  tags: []
"Jr29,8":
  text: "Tak bowiem mówi PAN zastępów, Bóg Izraela: Niech was nie zwodzą wasi prorocy i wróżbici, którzy są wśród was, i nie zwracajcie uwagi na wasze sny, które się wam śnią."
  tags: []
"Jr29,9":
  text: "Bo oni prorokują wam kłamliwie w moje imię. Nie posłałem ich, mówi PAN."
  tags: []
"Jr29,10":
  text: "Tak bowiem mówi PAN: Gdy wypełni się dla Babilonu siedemdziesiąt lat, nawiedzę was i spełnię wobec was swoje dobre słowo, by was sprowadzić z powrotem na to miejsce."
  tags: []
"Jr29,11":
  text: "Gdyż ja znam myśli, które mam o was, mówi PAN: myśli o pokoju, a nie o utrapieniu, aby zapewnić wam koniec, jakiego oczekujecie."
  tags: []
"Jr29,12":
  text: "Wtedy będziecie mnie wzywać, pójdziecie i będziecie modlić się do mnie, a ja was wysłucham;"
  tags: []
"Jr29,13":
  text: "Będziecie mnie szukać i znajdziecie mnie, gdy będziecie szukać całym swym sercem."
  tags: []
"Jr29,14":
  text: "I dam wam się znaleźć, mówi PAN, i odwrócę waszą niewolę, i zgromadzę was ze wszystkich narodów i ze wszystkich miejsc, do których was wygnałem, mówi PAN. I przyprowadzę was na to miejsce, z którego was uprowadziłem."
  tags: []
"Jr29,15":
  text: "A ponieważ mówicie: PAN wzbudził nam proroków w Babilonie;"
  tags: []
"Jr29,16":
  text: "Tak mówi PAN o królu, który zasiada na tronie Dawida, i o całym ludzie, który mieszka w tym mieście, o waszych braciach, którzy nie poszli z wami do niewoli;"
  tags: []
"Jr29,17":
  text: "Tak mówi PAN zastępów: Oto poślę na nich miecz, głód i zarazę i uczynię z nimi jak ze złymi figami, których nie można jeść, bo są tak złe."
  tags: []
"Jr29,18":
  text: "Będę ich bowiem prześladować mieczem, głodem i zarazą i sprawię, że zostaną wysiedleni do wszystkich królestw ziemi, uczynię ich przedmiotem przekleństwa, zdumienia, poświstania i hańby wśród wszystkich narodów, do których ich wypędziłem;"
  tags: []
"Jr29,19":
  text: "Za to, że nie słuchali moich słów, mówi PAN, które posłałem do nich przez swoje sługi, proroków, z wczesnym wstawaniem i przesłaniem. Ale nie słuchaliście, mówi PAN."
  tags: []
"Jr29,20":
  text: "Dlatego słuchajcie słowa PANA, wy, wszyscy wygnańcy, których wysłałem z Jerozolimy do Babilonu."
  tags: []
"Jr29,21":
  text: "Tak mówi PAN zastępów, Bóg Izraela, o Achabie, synu Kolajasza, i o Sedekiaszu, synu Maasejasza, którzy prorokują wam kłamstwo w moje imię: Oto wydam ich w ręce Nabuchodonozora, króla Babilonu, a ten zabije ich na waszych oczach."
  tags: []
"Jr29,22":
  text: "Od nich będzie wzięte przekleństwo przez wszystkich wygnańców z Judy, którzy są w Babilonie, wyrażone w słowach: Niech PAN ci uczyni jak z Sedekiaszem i jak z Achabem, których król Babilonu usmażył w ogniu;"
  tags: []
"Jr29,23":
  text: "Za to, że popełniali nikczemność w Izraelu, cudzołożyli z żonami swoich bliźnich i mówili słowa kłamliwe w moje imię, czego im nie nakazałem. Ja o tym wiem i jestem tego świadkiem, mówi PAN."
  tags: []
"Jr29,24":
  text: "A do Szemajasza Nechalamity powiesz:"
  tags: []
"Jr29,25":
  text: "Tak mówi PAN zastępów, Bóg Izraela: Ponieważ we własnym imieniu posłałeś listy do całego ludu, który jest w Jerozolimie, i do Sofoniasza, syna Maasejasza, kapłana, i do wszystkich kapłanów, tej treści:"
  tags: []
"Jr29,26":
  text: "PAN ustanowił cię kapłanem w miejsce kapłana Jehojady i abyście mieli nadzór w domu PANA nad każdym szaleńcem udającym proroka, abyś osadzał takiego w więzieniu i zakuwał w dyby."
  tags: []
"Jr29,27":
  text: "Dlaczego więc nie skarciłeś Jeremiasza z Anatot, który wam prorokuje?"
  tags: []
"Jr29,28":
  text: "Posłał bowiem do nas do Babilonu słowo: Będzie to trwało długo. Budujcie domy i mieszkajcie w nich, zakładajcie ogrody i spożywajcie ich owoce."
  tags: []
"Jr29,29":
  text: "A kapłan Sofoniasz odczytał ten list do uszu proroka Jeremiasza."
  tags: []
"Jr29,30":
  text: "I doszło słowo PANA do Jeremiasza mówiące:"
  tags: []
"Jr29,31":
  text: "Poślij do wszystkich uprowadzonych do niewoli takie słowa: Tak mówi PAN o Szemajaszu Nechalamicie: Ponieważ Szemajasz prorokował wam, chociaż ja go nie posłałem, a wywołuje w was ufność w kłamstwo;"
  tags: []
"Jr29,32":
  text: "Dlatego tak mówi PAN: Oto nawiedzę Szemajasza Nechalamitę i jego potomstwo. Nie będzie miał nikogo, kto by mieszkał pośród tego ludu, ani nie ujrzy tego dobra, które uczynię swemu ludowi, mówi PAN, bo głosił bunt przeciwko PANU."
  tags: []
