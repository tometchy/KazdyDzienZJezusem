"Jr29,1": "A to są słowa listu, który prorok Jeremiasz posłał z Jerozolimy do pozostałych starszych, którzy byli na wygnaniu, i do kapłanów, do proroków i do całego ludu – których Nabuchodonozor uprowadził z Jerozolimy do Babilonu."
"Jr29,2": "Było to po wyjściu z Jerozolimy króla Jechoniasza, królowej, dworzan, książąt Judy i Jerozolimy oraz cieśli i kowali."
"Jr29,3": "List wysłał przez Elasę, syna Szafana, i Gemariasza, syna Chilkiasza, których Sedekiasz, król Judy, posłał do Babilonu do Nabuchodonozora, króla Babilonu; był on tej treści:"
"Jr29,4": "Tak mówi PAN zastępów, Bóg Izraela, do wszystkich wygnańców, których uprowadziłem z Jerozolimy do Babilonu:"
"Jr29,5": "Budujcie domy i mieszkajcie w nich; zakładajcie ogrody i spożywajcie ich owoce;"
"Jr29,6": "Pojmujcie żony i płodźcie synów i córki; wybierajcie żony dla waszych synów i wydawajcie swoje córki za mąż, aby rodziły synów i córki. Rozmnażajcie się tam i niech was nie ubywa."
"Jr29,7": "Zabiegajcie o pokój dla tego miasta, do którego was uprowadziłem, i módlcie się za nie do PANA, bo od jego pokoju zależy wasz pokój."
"Jr29,8": "Tak bowiem mówi PAN zastępów, Bóg Izraela: Niech was nie zwodzą wasi prorocy i wróżbici, którzy są wśród was, i nie zwracajcie uwagi na wasze sny, które się wam śnią."
"Jr29,9": "Bo oni prorokują wam kłamliwie w moje imię. Nie posłałem ich, mówi PAN."
"Jr29,10": "Tak bowiem mówi PAN: Gdy wypełni się dla Babilonu siedemdziesiąt lat, nawiedzę was i spełnię wobec was swoje dobre słowo, by was sprowadzić z powrotem na to miejsce."
"Jr29,11": "Gdyż ja znam myśli, które mam o was, mówi PAN: myśli o pokoju, a nie o utrapieniu, aby zapewnić wam koniec, jakiego oczekujecie."
"Jr29,12": "Wtedy będziecie mnie wzywać, pójdziecie i będziecie modlić się do mnie, a ja was wysłucham;"
"Jr29,13": "Będziecie mnie szukać i znajdziecie mnie, gdy będziecie szukać całym swym sercem."
"Jr29,14": "I dam wam się znaleźć, mówi PAN, i odwrócę waszą niewolę, i zgromadzę was ze wszystkich narodów i ze wszystkich miejsc, do których was wygnałem, mówi PAN. I przyprowadzę was na to miejsce, z którego was uprowadziłem."
"Jr29,15": "A ponieważ mówicie: PAN wzbudził nam proroków w Babilonie;"
"Jr29,16": "Tak mówi PAN o królu, który zasiada na tronie Dawida, i o całym ludzie, który mieszka w tym mieście, o waszych braciach, którzy nie poszli z wami do niewoli;"
"Jr29,17": "Tak mówi PAN zastępów: Oto poślę na nich miecz, głód i zarazę i uczynię z nimi jak ze złymi figami, których nie można jeść, bo są tak złe."
"Jr29,18": "Będę ich bowiem prześladować mieczem, głodem i zarazą i sprawię, że zostaną wysiedleni do wszystkich królestw ziemi, uczynię ich przedmiotem przekleństwa, zdumienia, poświstania i hańby wśród wszystkich narodów, do których ich wypędziłem;"
"Jr29,19": "Za to, że nie słuchali moich słów, mówi PAN, które posłałem do nich przez swoje sługi, proroków, z wczesnym wstawaniem i przesłaniem. Ale nie słuchaliście, mówi PAN."
"Jr29,20": "Dlatego słuchajcie słowa PANA, wy, wszyscy wygnańcy, których wysłałem z Jerozolimy do Babilonu."
"Jr29,21": "Tak mówi PAN zastępów, Bóg Izraela, o Achabie, synu Kolajasza, i o Sedekiaszu, synu Maasejasza, którzy prorokują wam kłamstwo w moje imię: Oto wydam ich w ręce Nabuchodonozora, króla Babilonu, a ten zabije ich na waszych oczach."
"Jr29,22": "Od nich będzie wzięte przekleństwo przez wszystkich wygnańców z Judy, którzy są w Babilonie, wyrażone w słowach: Niech PAN ci uczyni jak z Sedekiaszem i jak z Achabem, których król Babilonu usmażył w ogniu;"
"Jr29,23": "Za to, że popełniali nikczemność w Izraelu, cudzołożyli z żonami swoich bliźnich i mówili słowa kłamliwe w moje imię, czego im nie nakazałem. Ja o tym wiem i jestem tego świadkiem, mówi PAN."
"Jr29,24": "A do Szemajasza Nechalamity powiesz:"
"Jr29,25": "Tak mówi PAN zastępów, Bóg Izraela: Ponieważ we własnym imieniu posłałeś listy do całego ludu, który jest w Jerozolimie, i do Sofoniasza, syna Maasejasza, kapłana, i do wszystkich kapłanów, tej treści:"
"Jr29,26": "PAN ustanowił cię kapłanem w miejsce kapłana Jehojady i abyście mieli nadzór w domu PANA nad każdym szaleńcem udającym proroka, abyś osadzał takiego w więzieniu i zakuwał w dyby."
"Jr29,27": "Dlaczego więc nie skarciłeś Jeremiasza z Anatot, który wam prorokuje?"
"Jr29,28": "Posłał bowiem do nas do Babilonu słowo: Będzie to trwało długo. Budujcie domy i mieszkajcie w nich, zakładajcie ogrody i spożywajcie ich owoce."
"Jr29,29": "A kapłan Sofoniasz odczytał ten list do uszu proroka Jeremiasza."
"Jr29,30": "I doszło słowo PANA do Jeremiasza mówiące:"
"Jr29,31": "Poślij do wszystkich uprowadzonych do niewoli takie słowa: Tak mówi PAN o Szemajaszu Nechalamicie: Ponieważ Szemajasz prorokował wam, chociaż ja go nie posłałem, a wywołuje w was ufność w kłamstwo;"
"Jr29,32": "Dlatego tak mówi PAN: Oto nawiedzę Szemajasza Nechalamitę i jego potomstwo. Nie będzie miał nikogo, kto by mieszkał pośród tego ludu, ani nie ujrzy tego dobra, które uczynię swemu ludowi, mówi PAN, bo głosił bunt przeciwko PANU."
