"Jr7,1": "Słowo, które doszło od PANA do Jeremiasza, mówiące:"
"Jr7,2": "Stań w bramie domu PANA i głoś tam to słowo, i mów: Słuchajcie słowa PANA, wy wszyscy z Judy, którzy wchodzicie do tych bram, aby oddać PANU pokłon."
"Jr7,3": "Tak mówi PAN zastępów, Bóg Izraela: Poprawcie swoje drogi i czyny, a sprawię, że będziecie mieszkać w tym miejscu."
"Jr7,4": "Nie pokładajcie swojej nadziei w słowach kłamliwych, mówiąc: Świątynia PANA, Świątynia PANA, to jest Świątynia PANA!"
"Jr7,5": "Ale jeśli naprawdę poprawicie swoje drogi i czyny, jeśli będziecie sprawiedliwie sprawować sąd pomiędzy człowiekiem a jego bliźnim;"
"Jr7,6": "Jeśli nie będziecie uciskać przybysza, sieroty i wdowy, nie rozlejecie krwi niewinnej w tym miejscu i za innymi bogami nie pójdziecie na swoje nieszczęście;"
"Jr7,7": "Wtedy sprawię, że będziecie mieszkać w tym miejscu, w ziemi, którą dałem waszym ojcom na wieki wieków."
"Jr7,8": "Oto pokładacie swoją nadzieję w słowach kłamliwych, które nie pomogą."
"Jr7,9": "Czy będziecie kraść, zabijać, cudzołożyć, przysięgać fałszywie, palić kadzidło Baalowi, iść za innymi bogami, których nie znacie;"
"Jr7,10": "A potem – przychodzić i stawać przede mną w tym domu, który nazwany jest moim imieniem, i mówić: Zostaliśmy wybawieni, aby popełniać te wszystkie obrzydliwości?"
"Jr7,11": "Czy ten dom, który jest nazwany moim imieniem, jest w waszych oczach jaskinią zbójców? Oto ja to widzę, mówi PAN."
"Jr7,12": "Ale idźcie teraz do mojego miejsca, które było w Szilo, gdzie kiedyś ustanowiłem przybytek dla mego imienia, i zobaczcie, co z nim zrobiłem ze względu na niegodziwość mego ludu Izraela."
"Jr7,13": "A teraz, ponieważ popełniliście te wszystkie czyny, mówi PAN, a ja nieustannie mówiłem do was z wczesnym wstawaniem, a wy nie słuchaliście; wołałem do was, a nie odpowiadaliście;"
"Jr7,14": "Uczynię temu domowi, który jest nazwany moim imieniem, w którym wy pokładacie ufność, oraz temu miejscu, które dałem wam i waszym ojcom, jak uczyniłem Szilo."
"Jr7,15": "I odrzucę was sprzed swego oblicza, jak odrzuciłem waszych braci – całe potomstwo Efraima."
"Jr7,16": "Ty więc nie módl się o ten lud i nie zanoś za niego ani wołania, ani modlitwy i nie nalegaj na mnie, bo cię nie wysłucham."
"Jr7,17": "Czyż sam nie widzisz, co robią w miastach Judy i na ulicach Jerozolimy?"
"Jr7,18": "Synowie zbierają drwa, ojcowie rozniecają ogień, a ich żony ugniatają ciasto, aby robić placki dla królowej niebios i wylewać ofiary z płynów innym bogom, aby mnie do gniewu pobudzać."
"Jr7,19": "Czy to jest przeciwko mnie, że mnie do gniewu pobudzają? – mówi PAN. Czy nie raczej przeciwko nim, ku ich własnemu pohańbieniu?"
"Jr7,20": "Dlatego tak mówi Pan BÓG: Oto mój gniew i moja zapalczywość zostaną wylane na to miejsce, na ludzi i na zwierzęta, na drzewa polne i na owoce ziemi; rozpalą się i nie zgasną."
"Jr7,21": "Tak mówi PAN zastępów, Bóg Izraela: Dodajcie swoje całopalenia do swoich ofiar i jedzcie mięso."
"Jr7,22": "Bo nie mówiłem waszym ojcom ani niczego im nie nakazałem o całopaleniach i ofiarach w dniu, kiedy wyprowadziłem ich z ziemi Egiptu;"
"Jr7,23": "Ale to jedno im nakazałem, mówiąc: Słuchajcie mojego głosu i będę waszym Bogiem, a wy będziecie moim ludem; idźcie każdą drogą, którą wam nakazałem, aby się wam dobrze działo."
"Jr7,24": "Lecz oni nie posłuchali ani nie nakłonili swego ucha, ale szli za radą i według uporu swego złego serca. I odwrócili się plecami, a nie twarzą."
"Jr7,25": "Od dnia, kiedy wasi ojcowie wyszli z ziemi Egiptu, aż do dziś, posyłałem do was wszystkie moje sługi, proroków z wczesnym wstawaniem i przesłaniem."
"Jr7,26": "Oni jednak nie słuchali mnie i nie nakłonili swego ucha, ale zatwardzili swój kark i gorzej czynili niż ich ojcowie."
"Jr7,27": "Będziesz im mówił wszystkie te słowa, ale cię nie usłuchają; będziesz wołać do nich, ale nie odpowiedzą ci."
"Jr7,28": "Dlatego mów do nich: To jest naród, który nie słucha głosu PANA, swego Boga, ani nie przyjmuje pouczenia. Zginęła prawda, została starta z ich ust."
"Jr7,29": "Ostrzyż swoje włosy, Jerozolimo, i odrzuć je, podnieś lament na wyżynach, bo PAN odrzucił i opuścił to pokolenie, na które bardzo się gniewa."
"Jr7,30": "Synowie Judy bowiem czynili zło przed moimi oczami, mówi PAN; ustawili swoje obrzydliwości w tym domu, który jest nazwany moim imieniem, aby go zbezcześcić."
"Jr7,31": "Ponadto zbudowali wyżyny Tofet, która jest w dolinie syna Hinnom, aby palić swoich synów i swoje córki w ogniu, czego nie nakazałem i co nie przyszło mi nawet na myśl."
"Jr7,32": "Dlatego oto nadchodzą dni, mówi PAN, gdy to już nie będzie nazywać się Tofet ani Doliną Syna Hinnom, lecz Doliną Rzezi; i będą grzebać zmarłych w Tofet, bo nie będzie innego miejsca."
"Jr7,33": "I trupy tego ludu będą pokarmem dla ptactwa na niebie i zwierząt na ziemi, a nikt ich nie spłoszy."
"Jr7,34": "I sprawię, że w miastach Judy i na ulicach Jerozolimy ustanie głos radości, głos wesela, głos oblubieńca i głos oblubienicy, bo ziemia zostanie spustoszona."
