"Jr52,1": "Sedekiasz miał dwadzieścia jeden lat, kiedy zaczął królować, i królował jedenaście lat w Jerozolimie. Jego matka miała na imię Chamutal i była córką Jeremiasza z Libny."
"Jr52,2": "Czynił on to, co złe w oczach PANA, zupełnie tak, jak czynił Joakim."
"Jr52,3": "Z powodu gniewu PANA przyszło to na Jerozolimę i Judę, aż odrzucił ich sprzed swego oblicza. Sedekiasz bowiem zbuntował się przeciw królowi Babilonu."
"Jr52,4": "W dziewiątym roku jego panowania, dziesiątego miesiąca, dziesiątego dnia tego miesiąca Nabuchodonozor, król Babilonu, wraz z całym swym wojskiem wyruszył przeciw Jerozolimie, rozbił obóz pod nią i zbudował przeciwko niej szańce dokoła."
"Jr52,5": "Miasto więc było oblężone aż do jedenastego roku króla Sedekiasza."
"Jr52,6": "A w czwartym miesiącu, dziewiątego dnia tego miesiąca, wzmógł się głód w mieście i nie było chleba dla ludu tej ziemi."
"Jr52,7": "Kiedy zrobiono wyłom w murze miasta, wszyscy wojownicy uciekli i wyszli z miasta w nocy przez bramę między dwoma murami obok królewskiego ogrodu; Chaldejczycy zaś leżeli wokół miasta, a tamci poszli w stronę pustyni."
"Jr52,8": "Lecz wojsko Chaldejczyków ścigało króla i dogoniło Sedekiasza na równinach Jerycha, a całe jego wojsko rozpierzchło się od niego."
"Jr52,9": "Pojmali więc króla i przyprowadzili go do króla Babilonu, do Ribla w ziemi Chamat, gdzie ten wydał na niego wyrok."
"Jr52,10": "Król Babilonu zabił synów Sedekiasza na jego oczach, a także wszystkich książąt Judy pozabijał w Ribla."
"Jr52,11": "A Sedekiaszowi wyłupił oczy, potem król Babilonu zakuł go w łańcuchy, uprowadził go do Babilonu i wsadził do więzienia aż do jego śmierci."
"Jr52,12": "W piątym miesiącu, dziesiątego dnia tego miesiąca – był to dziewiętnasty rok Nabuchodonozora, króla Babilonu – do Jerozolimy przybył Nebuzaradan, dowódca gwardii, sługa króla Babilonu."
"Jr52,13": "I spalił dom PANA i dom króla; wszystkie domy Jerozolimy i wszystkie wielkie budowle spalił ogniem."
"Jr52,14": "Całe wojsko Chaldejczyków, które było z dowódcą gwardii, zburzyło wszystkie mury wokół Jerozolimy."
"Jr52,15": "A część ubogich z ludu i resztę ludu, która pozostała w mieście, zbiegów, którzy przeszli do króla Babilonu, oraz resztę pospólstwa Nebuzaradan, dowódca gwardii, uprowadził do niewoli;"
"Jr52,16": "Lecz pozostawił niektórych z ubogich tej ziemi, aby byli winogrodnikami i rolnikami."
"Jr52,17": "Chaldejczycy rozbili kolumny z brązu, które były w domu PANA, podstawy i morze z brązu, które było w domu PANA, a brąz z nich przenieśli do Babilonu."
"Jr52,18": "Zabrali też kotły, szufle, nożyce, miski, czasze oraz wszystkie naczynia z brązu, których używano do służby."
"Jr52,19": "Dowódca gwardii zabrał kropielnice, kadzielnice, misy, kotły, świeczniki, czasze i kubki; co było ze złota – jako złoto, co było ze srebra – jako srebro;"
"Jr52,20": "Dwie kolumny, jedno morze i dwanaście wołów z brązu, które były pod podstawami, a które wykonał król Salomon w domu PANA; a nie było można zmierzyć wagi brązu tych wszystkich przedmiotów."
"Jr52,21": "Co do kolumn, to każda miała osiemnaście łokci wysokości i dwanaście łokci obwodu, jej grubość wynosiła cztery palce, a w środku była pusta;"
"Jr52,22": "Głowica na niej była z brązu, wysokość jednej głowicy wynosiła pięć łokci, naokoło głowicy była siatka i jabłka granatowe, wszystko z brązu. Tak samo było z jabłkami granatu drugiej kolumny."
"Jr52,23": "A tych jabłek granatu było dziewięćdziesiąt sześć po każdej stronie; wszystkich jabłek granatu było po sto na siatce wokoło."
"Jr52,24": "Dowódca gwardii pojmał też najwyższego kapłana Serajasza, drugiego kapłana Sofoniasza i trzech stróżów progu."
"Jr52,25": "Z miasta zaś zabrał dworzanina, który był przełożonym nad wojownikami, siedmiu z tych, którzy stawali przed królem, a których znaleziono w mieście, naczelnego pisarza wojskowego, dokonującego spisu ludu tej ziemi, oraz sześćdziesięciu mężczyzn spośród ludu tej ziemi, których znaleziono w mieście."
"Jr52,26": "Tych więc zabrał Nebuzaradan, dowódca gwardii, i zaprowadził ich do króla Babilonu do Ribla."
"Jr52,27": "I król Babilonu pobił ich, i uśmiercił w Ribla, w ziemi Chamat. Tak został uprowadzony Juda ze swojej ziemi."
"Jr52,28": "Taka jest liczba ludu, który Nabuchodonozor uprowadził do niewoli: w siódmym roku trzy tysiące dwudziestu trzech Żydów."
"Jr52,29": "W osiemnastym roku Nabuchodonozora, uprowadził z Jerozolimy osiemset trzydzieści dwie osoby."
"Jr52,30": "W dwudziestym trzecim roku Nabuchodonozora dowódca gwardii Nebuzaradan uprowadził spośród Żydów siedemset czterdzieści pięć osób. Razem cztery tysiące sześćset osób."
"Jr52,31": "A w trzydziestym siódmym roku po uprowadzeniu do niewoli Joachina, króla Judy, w dwunastym miesiącu, dwudziestego piątego dnia tego miesiąca, Ewil-Merodak, król Babilonu, w roku objęcia królestwa, wywyższył głowę Joachina, króla Judy, i uwolnił go z więzienia;"
"Jr52,32": "Rozmawiał z nim łaskawie i ustawił jego tron wyżej niż tron królów, którzy byli z nim w Babilonie;"
"Jr52,33": "I zmienił jego szaty więzienne. I jadał on chleb zawsze przed nim po wszystkie dni swego życia."
"Jr52,34": "Na jego utrzymanie zapewniono mu dzienną porcję przez króla Babilonu aż do jego śmierci, po wszystkie dni jego życia."
