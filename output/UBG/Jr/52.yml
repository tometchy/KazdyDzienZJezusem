"Jr52,1":
  text: "Sedekiasz miał dwadzieścia jeden lat, kiedy zaczął królować, i królował jedenaście lat w Jerozolimie. Jego matka miała na imię Chamutal i była córką Jeremiasza z Libny."
  tags: []
"Jr52,2":
  text: "Czynił on to, co złe w oczach PANA, zupełnie tak, jak czynił Joakim."
  tags: []
"Jr52,3":
  text: "Z powodu gniewu PANA przyszło to na Jerozolimę i Judę, aż odrzucił ich sprzed swego oblicza. Sedekiasz bowiem zbuntował się przeciw królowi Babilonu."
  tags: []
"Jr52,4":
  text: "W dziewiątym roku jego panowania, dziesiątego miesiąca, dziesiątego dnia tego miesiąca Nabuchodonozor, król Babilonu, wraz z całym swym wojskiem wyruszył przeciw Jerozolimie, rozbił obóz pod nią i zbudował przeciwko niej szańce dokoła."
  tags: []
"Jr52,5":
  text: "Miasto więc było oblężone aż do jedenastego roku króla Sedekiasza."
  tags: []
"Jr52,6":
  text: "A w czwartym miesiącu, dziewiątego dnia tego miesiąca, wzmógł się głód w mieście i nie było chleba dla ludu tej ziemi."
  tags: []
"Jr52,7":
  text: "Kiedy zrobiono wyłom w murze miasta, wszyscy wojownicy uciekli i wyszli z miasta w nocy przez bramę między dwoma murami obok królewskiego ogrodu; Chaldejczycy zaś leżeli wokół miasta, a tamci poszli w stronę pustyni."
  tags: []
"Jr52,8":
  text: "Lecz wojsko Chaldejczyków ścigało króla i dogoniło Sedekiasza na równinach Jerycha, a całe jego wojsko rozpierzchło się od niego."
  tags: []
"Jr52,9":
  text: "Pojmali więc króla i przyprowadzili go do króla Babilonu, do Ribla w ziemi Chamat, gdzie ten wydał na niego wyrok."
  tags: []
"Jr52,10":
  text: "Król Babilonu zabił synów Sedekiasza na jego oczach, a także wszystkich książąt Judy pozabijał w Ribla."
  tags: []
"Jr52,11":
  text: "A Sedekiaszowi wyłupił oczy, potem król Babilonu zakuł go w łańcuchy, uprowadził go do Babilonu i wsadził do więzienia aż do jego śmierci."
  tags: []
"Jr52,12":
  text: "W piątym miesiącu, dziesiątego dnia tego miesiąca – był to dziewiętnasty rok Nabuchodonozora, króla Babilonu – do Jerozolimy przybył Nebuzaradan, dowódca gwardii, sługa króla Babilonu."
  tags: []
"Jr52,13":
  text: "I spalił dom PANA i dom króla; wszystkie domy Jerozolimy i wszystkie wielkie budowle spalił ogniem."
  tags: []
"Jr52,14":
  text: "Całe wojsko Chaldejczyków, które było z dowódcą gwardii, zburzyło wszystkie mury wokół Jerozolimy."
  tags: []
"Jr52,15":
  text: "A część ubogich z ludu i resztę ludu, która pozostała w mieście, zbiegów, którzy przeszli do króla Babilonu, oraz resztę pospólstwa Nebuzaradan, dowódca gwardii, uprowadził do niewoli;"
  tags: []
"Jr52,16":
  text: "Lecz pozostawił niektórych z ubogich tej ziemi, aby byli winogrodnikami i rolnikami."
  tags: []
"Jr52,17":
  text: "Chaldejczycy rozbili kolumny z brązu, które były w domu PANA, podstawy i morze z brązu, które było w domu PANA, a brąz z nich przenieśli do Babilonu."
  tags: []
"Jr52,18":
  text: "Zabrali też kotły, szufle, nożyce, miski, czasze oraz wszystkie naczynia z brązu, których używano do służby."
  tags: []
"Jr52,19":
  text: "Dowódca gwardii zabrał kropielnice, kadzielnice, misy, kotły, świeczniki, czasze i kubki; co było ze złota – jako złoto, co było ze srebra – jako srebro;"
  tags: []
"Jr52,20":
  text: "Dwie kolumny, jedno morze i dwanaście wołów z brązu, które były pod podstawami, a które wykonał król Salomon w domu PANA; a nie było można zmierzyć wagi brązu tych wszystkich przedmiotów."
  tags: []
"Jr52,21":
  text: "Co do kolumn, to każda miała osiemnaście łokci wysokości i dwanaście łokci obwodu, jej grubość wynosiła cztery palce, a w środku była pusta;"
  tags: []
"Jr52,22":
  text: "Głowica na niej była z brązu, wysokość jednej głowicy wynosiła pięć łokci, naokoło głowicy była siatka i jabłka granatowe, wszystko z brązu. Tak samo było z jabłkami granatu drugiej kolumny."
  tags: []
"Jr52,23":
  text: "A tych jabłek granatu było dziewięćdziesiąt sześć po każdej stronie; wszystkich jabłek granatu było po sto na siatce wokoło."
  tags: []
"Jr52,24":
  text: "Dowódca gwardii pojmał też najwyższego kapłana Serajasza, drugiego kapłana Sofoniasza i trzech stróżów progu."
  tags: []
"Jr52,25":
  text: "Z miasta zaś zabrał dworzanina, który był przełożonym nad wojownikami, siedmiu z tych, którzy stawali przed królem, a których znaleziono w mieście, naczelnego pisarza wojskowego, dokonującego spisu ludu tej ziemi, oraz sześćdziesięciu mężczyzn spośród ludu tej ziemi, których znaleziono w mieście."
  tags: []
"Jr52,26":
  text: "Tych więc zabrał Nebuzaradan, dowódca gwardii, i zaprowadził ich do króla Babilonu do Ribla."
  tags: []
"Jr52,27":
  text: "I król Babilonu pobił ich, i uśmiercił w Ribla, w ziemi Chamat. Tak został uprowadzony Juda ze swojej ziemi."
  tags: []
"Jr52,28":
  text: "Taka jest liczba ludu, który Nabuchodonozor uprowadził do niewoli: w siódmym roku trzy tysiące dwudziestu trzech Żydów."
  tags: []
"Jr52,29":
  text: "W osiemnastym roku Nabuchodonozora, uprowadził z Jerozolimy osiemset trzydzieści dwie osoby."
  tags: []
"Jr52,30":
  text: "W dwudziestym trzecim roku Nabuchodonozora dowódca gwardii Nebuzaradan uprowadził spośród Żydów siedemset czterdzieści pięć osób. Razem cztery tysiące sześćset osób."
  tags: []
"Jr52,31":
  text: "A w trzydziestym siódmym roku po uprowadzeniu do niewoli Joachina, króla Judy, w dwunastym miesiącu, dwudziestego piątego dnia tego miesiąca, Ewil-Merodak, król Babilonu, w roku objęcia królestwa, wywyższył głowę Joachina, króla Judy, i uwolnił go z więzienia;"
  tags: []
"Jr52,32":
  text: "Rozmawiał z nim łaskawie i ustawił jego tron wyżej niż tron królów, którzy byli z nim w Babilonie;"
  tags: []
"Jr52,33":
  text: "I zmienił jego szaty więzienne. I jadał on chleb zawsze przed nim po wszystkie dni swego życia."
  tags: []
"Jr52,34":
  text: "Na jego utrzymanie zapewniono mu dzienną porcję przez króla Babilonu aż do jego śmierci, po wszystkie dni jego życia."
  tags: []
