"Jr3,1":
  text: "Jest powiedziane: Jeśli mąż oddali swoją żonę, a ona odejdzie od niego i stanie się żoną innego – czy on jeszcze do niej wróci? Czy ta ziemia nie byłaby wielce splugawiona? Ale ty uprawiałaś nierząd z wieloma kochankami. Powróć jednak do mnie, mówi PAN."
  tags: []
"Jr3,2":
  text: "Podnieś swoje oczy na wyżyny i sprawdź, czy jest miejsce, gdzie nie uprawiałaś nierządu. Przy drogach siadałaś dla nich, jak Arab na pustyni, i splugawiłaś ziemię swoim nierządem i swą niegodziwością."
  tags: []
"Jr3,3":
  text: "I dlatego deszcze jesienne zostały wstrzymane, i nie było deszczu wiosennego, lecz nadal masz czoło nierządnicy i nie chcesz się wstydzić."
  tags: []
"Jr3,4":
  text: "Czy teraz nie będziesz wołać do mnie: Mój ojcze! Ty jesteś wodzem mojej młodości?"
  tags: []
"Jr3,5":
  text: "Czy Bóg będzie się gniewał na wieki? Czy zachowa gniew na zawsze? Tak oto mówiłaś i czyniłaś zło, ile tylko mogłaś."
  tags: []
"Jr3,6":
  text: "Wtedy PAN powiedział do mnie za dni króla Jozjasza: Czy widziałeś, co uczyniła odstępczyni Izrael? Chodziła na każdą wysoką górę i pod każde zielone drzewo i tam uprawiała nierząd."
  tags: []
"Jr3,7":
  text: "I powiedziałem po tym wszystkim, co uczyniła: Powróć do mnie. Lecz nie powróciła. A widziała to jej zdradliwa siostra Juda."
  tags: []
"Jr3,8":
  text: "I widziałem, gdy z powodu nierządu odstępczyni Izrael oddaliłem ją i dałem jej list rozwodowy, jednak jej zdradliwa siostra Juda nie ulękła się, lecz poszła i również uprawiała nierząd."
  tags: []
"Jr3,9":
  text: "I przez swój haniebny nierząd zbezcześciła ziemię, i cudzołożyła z kamieniem i drewnem."
  tags: []
"Jr3,10":
  text: "Mimo tego wszystkiego jej zdradliwa siostra Juda nie powróciła do mnie całym sercem, lecz pozornie, mówi PAN."
  tags: []
"Jr3,11":
  text: "Dlatego PAN powiedział do mnie: Odstępczyni Izrael okazała się sprawiedliwsza niż zdradliwa Juda."
  tags: []
"Jr3,12":
  text: "Idź i głoś te słowa ku północy, i mów: Wróć, odstępczyni Izrael, mówi PAN, a nie wybuchnie na was mój gniew. Ja bowiem jestem miłosierny, mówi PAN, i nie chowam gniewu na wieki."
  tags: []
"Jr3,13":
  text: "Tylko uznaj swoją nieprawość, że odstąpiłaś od PANA, swego Boga, i biegałaś swoimi drogami do obcych pod każde zielone drzewo, a mojego głosu nie słuchaliście, mówi PAN."
  tags: []
"Jr3,14":
  text: "Nawróćcie się, synowie odstępczy, mówi PAN, bo ja jestem waszym małżonkiem i przyjmę was po jednym z miasta i po dwóch z każdego rodu i zaprowadzę was do Syjonu;"
  tags: []
"Jr3,15":
  text: "I dam wam pasterzy według mego serca, i będą was paść umiejętnie i roztropnie."
  tags: []
"Jr3,16":
  text: "A gdy się rozmnożycie i rozplenicie w tej ziemi w tych dniach, mówi PAN, już nie będą mówić: Arka przymierza PANA. Nikomu nie przyjdzie to na myśl. Nie wspomną o niej ani nie odwiedzą jej, ani już nie uczynią jej nową."
  tags: []
"Jr3,17":
  text: "W tym czasie Jerozolima będzie nazwana tronem PANA, a wszystkie narody zgromadzą się u niej, u imienia PANA, w Jerozolimie, i już nie będą postępować według uporu swego złego serca."
  tags: []
"Jr3,18":
  text: "W te dni dom Judy będzie chodził z domem Izraela i przybędą razem z ziemi północnej do ziemi, którą dałem w dziedzictwo waszym ojcom."
  tags: []
"Jr3,19":
  text: "Ja zaś powiedziałem sobie: Jakże miałbym cię zaliczyć do synów i dać ci ziemię rozkoszną, piękne dziedzictwo zastępów narodów? Chyba że będziesz do mnie wołał: Mój ojcze! I nie odwrócisz się ode mnie."
  tags: []
"Jr3,20":
  text: "Ponieważ jak żona sprzeniewierza się swemu mężowi, tak mi się sprzeniewierzyłeś, domu Izraela, mówi PAN."
  tags: []
"Jr3,21":
  text: "Głos się rozlega na wyżynach, błagalny płacz synów Izraela, bo wypaczyli swe drogi i zapomnieli o PANU, swym Bogu."
  tags: []
"Jr3,22":
  text: "Nawróćcie się, odstępczy synowie, a uleczę wasze odstępstwa. Oto przychodzimy do ciebie, bo ty jesteś PANEM, naszym Bogiem."
  tags: []
"Jr3,23":
  text: "Zaprawdę złudna jest nadzieja w pagórkach i mnóstwie gór. Zaprawdę w PANU, naszym Bogu, jest zbawienie Izraela."
  tags: []
"Jr3,24":
  text: "Od naszej młodości bowiem ta hańba pożerała pracę naszych ojców, ich trzody i stada, ich synów i córki."
  tags: []
"Jr3,25":
  text: "Leżymy w swojej hańbie i nasz wstyd nas przykrywa, bo grzeszyliśmy przeciwko PANU, swemu Bogu, my i nasi ojcowie, od swojej młodości aż do dziś, i nie usłuchaliśmy głosu PANA, naszego Boga."
  tags: []
