"Jr20,1": "A kapłan Paszchur, syn Immera, który był naczelnym przywódcą w domu PANA, usłyszał Jeremiasza prorokującego o tym;"
"Jr20,2": "I Paszchur uderzył proroka Jeremiasza, i zakuł go w dyby, które były w Górnej Bramie Beniamina, przy domu PANA."
"Jr20,3": "A nazajutrz, gdy Paszchur uwolnił Jeremiasza z dybów, Jeremiasz powiedział do niego: PAN nie nazwał cię Paszchur, lecz Magormissabib."
"Jr20,4": "Tak bowiem mówi PAN: Oto uczynię z ciebie postrach dla ciebie samego i dla wszystkich twoich przyjaciół. Padną od miecza swoich wrogów, a twoje oczy będą na to patrzeć. Całą Judę wydam w ręce króla Babilonu, który ich uprowadzi do niewoli do Babilonu i pozabija mieczem."
"Jr20,5": "Wydam też wszystkie bogactwa tego miasta, cały jego dobytek, wszystkie jego kosztowności i wszystkie skarby królów Judy – wydam w ręce ich wrogów. Ci złupią je, zabiorą i wywiozą do Babilonu."
"Jr20,6": "Ale ty, Paszchurze, i wszyscy, którzy mieszkają w twym domu, pójdziecie do niewoli. Przyjdziesz do Babilonu i tam umrzesz, i tam zostaniesz pogrzebany, ty i wszyscy twoi przyjaciele, którym kłamliwie prorokowałeś."
"Jr20,7": "Namówiłeś mnie, PANIE, a dałem się namówić. Ty jesteś silniejszy ode mnie i mnie przemogłeś. Jestem wystawiony na pośmiewisko każdego dnia, każdy się ze mnie naśmiewa."
"Jr20,8": "Odkąd bowiem zacząłem mówić, wołam; krzyczę o przemocy i spustoszeniu, bo słowo PANA stało się dla mnie pohańbieniem i pośmiewiskiem każdego dnia."
"Jr20,9": "I powiedziałem: Nie będę go wspominał ani nie będę już mówił w jego imię. Ale słowo Boże jest w moim sercu jakby ogień płonący, zamknięty w moich kościach, i usiłowałem je wstrzymać, ale nie mogłem."
"Jr20,10": "Słyszę bowiem oszczerstwo wielu, strach dokoła. Mówią: Donoście, a my o tym doniesiemy. Wszyscy moi przyjaciele czyhają na mój upadek, mówiąc: Może da się zwabić, potem przemożemy go i zemścimy się na nim."
"Jr20,11": "Ale PAN jest ze mną jak straszliwy mocarz. Dlatego moi prześladowcy upadną i nie przemogą mnie. Będą bardzo zawstydzeni, że im się nie powiodło. Ich wieczna hańba nie będzie zapomniana."
"Jr20,12": "Dlatego, PANIE zastępów, który doświadczasz sprawiedliwego, który widzisz nerki i serce, niech zobaczę twoją pomstę nad nimi. Tobie bowiem powierzyłem swoją sprawę."
"Jr20,13": "Śpiewajcie PANU, chwalcie PANA, gdyż wybawił duszę ubogiego z ręki złoczyńców."
"Jr20,14": "Przeklęty dzień, w którym się urodziłem. Niech dzień, w którym urodziła mnie moja matka, nie będzie błogosławiony."
"Jr20,15": "Przeklęty człowiek, który oznajmił memu ojcu, mówiąc: Urodziło ci się dziecko, chłopiec, sprawiając mu wielką radość."
"Jr20,16": "Niech ten człowiek będzie jak miasta, które PAN zniszczył bez żalu. Niech słyszy krzyk o poranku i wołanie w południe;"
"Jr20,17": "Za to, że mnie nie zabił zaraz od łona, by moja matka była moim grobem, a jej łono – wiecznie brzemienne!"
"Jr20,18": "Po co wyszedłem z łona – aby doznawać trudu i smutku, aby moje dni były strawione wśród hańby?"
