"Jr50,1": "Słowo, które PAN wypowiedział przeciwko Babilonowi i przeciwko ziemi Chaldejczyków przez proroka Jeremiasza:"
"Jr50,2": "Opowiadajcie wśród narodów, rozgłaszajcie, podnieście sztandar, głoście i nie zatajajcie. Mówcie: Babilon wzięty, Bel pohańbiony, Merodach rozbity; jego posągi pohańbione, jego bożki pokruszone."
"Jr50,3": "Nadciągnie bowiem przeciwko niemu naród z północy, który zamieni jego ziemię w pustkowie, tak że nikt w niej nie zamieszka. Uciekną i odejdą zarówno ludzie, jak i zwierzęta."
"Jr50,4": "W tych dniach i w tym czasie, mówi PAN, przyjdą synowie Izraela, a wraz z nimi synowie Judy; będą szli w płaczu i będą szukać PANA, swego Boga."
"Jr50,5": "Będą pytać o drogę na Syjon i zwróciwszy tam swoje twarze, powiedzą: Chodźcie i przyłączmy się do PANA wiecznym przymierzem, które nie ulegnie zapomnieniu."
"Jr50,6": "Mój lud był trzodą owiec zbłąkanych, ich pasterze wiedli ich na manowce, po górach ich rozegnali. Schodził z góry na pagórek, zapomniał o swoim legowisku."
"Jr50,7": "Wszyscy, którzy ich spotykali, pożerali ich, a ich wrogowie mówią: Nie jesteśmy nic winni, bo to oni zgrzeszyli przeciwko PANU, przybytkowi sprawiedliwości, przeciwko PANU, nadziei ich ojców."
"Jr50,8": "Uchodźcie ze środka Babilonu, wychodźcie z ziemi Chaldejczyków i bądźcie jak kozły przed trzodą."
"Jr50,9": "Oto bowiem wzbudzę i sprowadzę na Babilon gromadę wielkich narodów z ziemi północnej. I uszykują się przeciwko niemu, i stamtąd będzie zdobyty. Ich strzały będą jak u wprawnego mocarza, żadna nie wróci bez skutku."
"Jr50,10": "Chaldea będzie łupem, a wszyscy, którzy ją złupią, zostaną nasyceni, mówi PAN."
"Jr50,11": "Ponieważ się cieszyliście, ponieważ się radowaliście, grabieżcy mego dziedzictwa; ponieważ utyliście jak jałówka na trawie i ryczycie jak wół;"
"Jr50,12": "Wasza matka będzie bardzo zawstydzona, spłonie ze wstydu wasza rodzicielka. Oto stanie się ostatnią z narodów, pustkowiem, ziemią suchą i pustynną."
"Jr50,13": "Z powodu gniewu PANA nie będzie zamieszkana, ale cała zostanie spustoszona. Ktokolwiek będzie przechodził obok Babilonu, zdumieje się i będzie świstał nad wszystkimi jego plagami."
"Jr50,14": "Ustawcie się przeciw Babilonowi w koło. Wszyscy, którzy napinacie łuk, strzelajcie do niego, nie żałujcie strzał, bo zgrzeszył przeciwko PANU."
"Jr50,15": "Wołajcie przeciwko niemu zewsząd. Poddał się, upadły jego fundamenty, jego mury są zburzone. Jest to bowiem zemsta PANA. Pomścijcie się nad nim; jak on czynił innym, tak jemu też uczyńcie."
"Jr50,16": "Wyniszczcie z Babilonu siewcę i tego, który chwyta sierp w czasie żniwa. Przed mieczem niszczycielskim każdy się zwróci do swego ludu i każdy ucieknie do swojej ziemi."
"Jr50,17": "Izrael jest owcą przegnaną, którą spłoszyły lwy. Najpierw król Asyrii pożarł go, a na koniec ten Nabuchodonozor, król Babilonu, pokruszył jego kości."
"Jr50,18": "Dlatego tak mówi PAN zastępów, Bóg Izraela: Oto ukarzę króla Babilonu i jego ziemię, jak ukarałem króla Asyrii."
"Jr50,19": "I znowu przyprowadzę Izraela do swego mieszkania, i będzie się paść na Karmelu i w Baszanie, i jego dusza nasyci się na górze Efraim i w Gileadzie."
"Jr50,20": "W tych dniach i w tym czasie, mówi PAN, będą szukać nieprawości Izraela, ale jej nie będzie, i grzechów Judy, ale nie będą znalezione. Przebaczę bowiem tym, których pozostawię."
"Jr50,21": "Wyrusz przeciwko ziemi Meratajim, przeciwko niej i mieszkańcom Pekod. Spustosz i zniszcz doszczętnie, goniąc ich, mówi PAN, i uczyń wszystko, jak ci rozkazałem."
"Jr50,22": "Wrzawa wojenna w tej ziemi i wielkie spustoszenie."
"Jr50,23": "Jakże jest rozbity i złamany młot całej ziemi? Jakże Babilon stał się spustoszeniem wśród narodów?"
"Jr50,24": "Zastawiłem na ciebie sidła i zostałeś schwytany, Babilonie, a nie zauważyłeś tego. Znaleziono cię i pochwycono, ponieważ spierałeś się z PANEM."
"Jr50,25": "PAN otworzył swoją zbrojownię i wyniósł oręż swego gniewu. To bowiem jest dzieło Pana BOGA zastępów w ziemi Chaldejczyków."
"Jr50,26": "Ruszajcie przeciwko niemu z krańców ziemi, otwórzcie jego spichlerze. Zbierzcie go w sterty i zniszczcie go doszczętnie, by nic z niego nie pozostało."
"Jr50,27": "Pozabijajcie wszystkie jego cielce, niech idą na rzeź. Biada im, bo nadszedł ich dzień, czas ich nawiedzenia."
"Jr50,28": "Słychać głos uciekających i tych, co uchodzą z ziemi Babilonu, aby ogłosić na Syjonie pomstę PANA, naszego Boga, pomstę za jego świątynię."
"Jr50,29": "Zgromadźcie przeciwko Babilonowi wszystkich strzelców, którzy napinają łuk; rozbijcie obóz przeciw niemu dokoła, aby nikt nie uszedł. Odpłaćcie mu według jego uczynków, według wszystkiego, co innym czynił, uczyńcie mu. Wynosił się bowiem przeciwko PANU, przeciwko Świętemu Izraela."
"Jr50,30": "Dlatego jego młodzieńcy polegną na ulicach i wszyscy jego wojownicy zostaną zgładzeni w tym dniu, mówi PAN."
"Jr50,31": "Oto jestem przeciwko tobie, zuchwalcze, mówi Pan, BÓG zastępów. Nadszedł bowiem twój dzień i czas, gdy cię nawiedzę."
"Jr50,32": "Potknie się zuchwalec i upadnie, i nikt go nie podniesie. Wzniecę ogień w jego miastach, który pochłonie wszystko wokół niego."
"Jr50,33": "Tak mówi PAN zastępów: Synowie Izraela i synowie Judy razem cierpią ucisk. Wszyscy, którzy ich pojmali, trzymają ich i nie chcą ich wypuścić."
"Jr50,34": "Ale ich Odkupiciel jest potężny, jego imię to PAN zastępów, skutecznie będzie bronił ich sprawy, aby zapewnić pokój tej ziemi i trwożyć mieszkańców Babilonu."
"Jr50,35": "Miecz spadnie na Chaldejczyków, mówi PAN, i na mieszkańców Babilonu, na jego książąt i mędrców;"
"Jr50,36": "Miecz na kłamców, aby zgłupieli, miecz na jego wojowników, aby byli przerażeni;"
"Jr50,37": "Miecz na jego konie i rydwany oraz na całą różnorodną ludność, która jest pośród niego, aby była jak kobiety; miecz na jego skarby, aby były zagrabione;"
"Jr50,38": "Susza na jego wody, aby wyschły. Ziemia bowiem jest pełna rzeźbionych obrazów, a szaleją przy swoich bożkach."
"Jr50,39": "Dlatego zamieszkają tam dzikie zwierzęta pustyni i straszne bestie wysp, zamieszkają w nim też młode sowy. Nie będzie już zaludniony na wieki i nie będą w nim mieszkać po wszystkie pokolenia."
"Jr50,40": "Jak Bóg zniszczył Sodomę i Gomorę oraz sąsiednie miasta, mówi PAN, tak też nikt tam nie zamieszka ani syn człowieczy nie będzie w nim gościł."
"Jr50,41": "Oto lud nadciągnie z północy, naród wielki, i liczni królowie zostaną wzbudzeni z krańców ziemi."
"Jr50,42": "Pochwycą łuk i włócznię, są okrutni i bezlitośni; ich głos huczy jak morze i jeżdżą na koniach, każdy uszykowany do walki przeciwko tobie, córko Babilonu!"
"Jr50,43": "Król Babilonu usłyszał o nich wieść i osłabły mu ręce. Ogarnęła go udręka i bóle jak rodzącą kobietę."
"Jr50,44": "Oto jak lew wystąpi z wezbrania Jordanu przeciwko przybytkowi mocarza. Wypędzę go jednak nagle z tej ziemi, a ustanowię nad nią mojego wybrańca. Któż bowiem jest mi równy? Kto wyznaczy mi termin rozprawy? A kto jest tym pasterzem, który się ostoi przede mną?"
"Jr50,45": "Dlatego słuchajcie postanowienia PANA, które powziął przeciwko Babilonowi i jego zamysłów, które przygotował przeciwko ziemi Chaldejczyków. Zaprawdę, wywloką ich najmniejsi z tej trzody, spustoszą ich i ich mieszkania."
"Jr50,46": "Od huku przy zdobyciu Babilonu ziemia się porusza, słychać krzyk wśród narodów."
