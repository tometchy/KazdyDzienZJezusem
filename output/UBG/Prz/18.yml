"Prz18,1": "Samolub szuka tego, co mu się podoba, i wtrąca się w każdą sprawę."
"Prz18,2": "Głupi nie ma upodobania w rozumie, lecz w tym, co serce mu objawia."
"Prz18,3": "Gdy przychodzi niegodziwy, przychodzi też pogarda, a z hańbą urąganie."
"Prz18,4": "Słowa ust człowieka są jak głębokie wody, a źródło mądrości jak płynący potok."
"Prz18,5": "Niedobrze przez wzgląd na osobę niegodziwą krzywdzić sprawiedliwego w sądzie."
"Prz18,6": "Wargi głupiego wchodzą w spór, a jego usta wołają o razy."
"Prz18,7": "Usta głupiego są jego zgubą, a jego wargi sidłem jego duszy."
"Prz18,8": "Słowa plotkarza są jak rany i przenikają do głębi wnętrzności."
"Prz18,9": "Kto jest niedbały w pracy, jest bratem marnotrawcy."
"Prz18,10": "Imię PANA jest potężną wieżą, sprawiedliwy ucieka do niej i jest bezpieczny."
"Prz18,11": "Zamożność bogacza jest jego warownym miastem i jak wysoki mur w jego wyobrażeniu."
"Prz18,12": "Przed upadkiem serce człowieka jest wyniosłe, a chwałę poprzedza pokora."
"Prz18,13": "Kto odpowiada, zanim wysłucha, ujawnia głupotę i ściąga na siebie hańbę."
"Prz18,14": "Duch człowieka zniesie jego chorobę, ale któż zniesie strapionego ducha?"
"Prz18,15": "Serce rozumnego zdobywa wiedzę, a ucho mądrych szuka wiedzy."
"Prz18,16": "Dar człowieka toruje mu drogę i prowadzi go przed wielkich."
"Prz18,17": "Ten, który jest pierwszy w swojej sprawie, zdaje się sprawiedliwy, ale przychodzi jego bliźni i sprawdza go."
"Prz18,18": "Los kładzie kres sporom i rozstrzyga między możnymi."
"Prz18,19": "Brat obrażony trudniejszy do zdobycia niż warowne miasto, a spory są jak rygle w zamku."
"Prz18,20": "Owocem swoich ust nasyci człowiek swoje wnętrze, nasyci się plonem swych warg."
"Prz18,21": "Śmierć i życie są w mocy języka, a kto go miłuje, spożyje jego owoc."
"Prz18,22": "Kto znalazł żonę, znalazł coś dobrego i dostąpił łaski od PANA."
"Prz18,23": "Ubogi prosi pokornie, ale bogaty odpowiada surowo."
"Prz18,24": "Człowiek, który ma przyjaciół, musi obchodzić się z nimi po przyjacielsku, a jest przyjaciel, który przylgnie bardziej niż brat."
