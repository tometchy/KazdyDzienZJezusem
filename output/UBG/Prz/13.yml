"Prz13,1": "Mądry syn przyjmuje pouczenie ojca, a szyderca nie słucha strofowania."
"Prz13,2": "Człowiek będzie spożywać dobro z owocu swoich ust, a dusza przewrotnych będzie spożywać przemoc."
"Prz13,3": "Kto strzeże swych ust, strzeże swojej duszy; kto szeroko otwiera swe wargi, będzie zniszczony."
"Prz13,4": "Dusza leniwego pragnie, a nic nie ma, a dusza pracowitych zostanie obficie nasycona."
"Prz13,5": "Sprawiedliwy nienawidzi kłamliwego słowa, a niegodziwy staje się obrzydliwy i zhańbiony."
"Prz13,6": "Sprawiedliwość strzeże tego, który postępuje uczciwie, a niegodziwość powala grzesznika."
"Prz13,7": "Znajduje się taki, który czyni siebie bogatym, a nie ma nic; inny czyni siebie ubogim, choć ma wiele bogactw."
"Prz13,8": "Okupem za życie człowieka jest jego bogactwo, a ubogi nie słucha strofowania."
"Prz13,9": "Radośnie błyszczy światło sprawiedliwych, a pochodnia niegodziwych zgaśnie."
"Prz13,10": "Spór powstaje tylko dzięki pysze, a mądrość jest przy tych, co przyjmują radę."
"Prz13,11": "Łatwo zdobyte bogactwo zmniejsza się, a kto je gromadzi swą ręką, pomnaża je."
"Prz13,12": "Przedłużająca się nadzieja sprawia ból sercu, a spełnione pragnienie jest drzewem życia."
"Prz13,13": "Kto gardzi słowem Bożym, ten zginie, a kto się boi przykazania, dostanie nagrodę."
"Prz13,14": "Prawo mądrego jest źródłem życia, by uniknąć sideł śmierci."
"Prz13,15": "Prawdziwy rozum daje łaskę, a droga przewrotnych jest ciężka."
"Prz13,16": "Każdy roztropny postępuje rozważnie, a głupi ujawnia głupotę."
"Prz13,17": "Niegodziwy posłaniec popada w zło, a wierny wysłannik jest lekarstwem."
"Prz13,18": "Ubóstwo i hańba spadną na tego, który odrzuca karność, a kto szanuje upomnienia, dozna czci."
"Prz13,19": "Spełnione pragnienie jest słodkie dla duszy, a odwrócenie się od zła budzi odrazę w głupcach."
"Prz13,20": "Kto przestaje z mądrymi, będzie mądry, a towarzysz głupców będzie zniszczony."
"Prz13,21": "Nieszczęście ściga grzeszników, a sprawiedliwych Bóg nagrodzi dobrem."
"Prz13,22": "Dobry człowiek zostawia dziedzictwo dzieciom swoich dzieci, a majątek grzesznika jest zachowany dla sprawiedliwego."
"Prz13,23": "Obfita żywność jest na roli ubogich, lecz i ta może niszczeć przez nieroztropność."
"Prz13,24": "Kto oszczędza swą rózgę, nienawidzi swego syna, a kto go kocha, karze w porę."
"Prz13,25": "Sprawiedliwy je i syci swoją duszę, a żołądek niegodziwych cierpi niedostatek."
