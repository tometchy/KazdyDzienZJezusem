"Prz13,1":
  text: "Mądry syn przyjmuje pouczenie ojca, a szyderca nie słucha strofowania."
  tags: []
"Prz13,2":
  text: "Człowiek będzie spożywać dobro z owocu swoich ust, a dusza przewrotnych będzie spożywać przemoc."
  tags: []
"Prz13,3":
  text: "Kto strzeże swych ust, strzeże swojej duszy; kto szeroko otwiera swe wargi, będzie zniszczony."
  tags: []
"Prz13,4":
  text: "Dusza leniwego pragnie, a nic nie ma, a dusza pracowitych zostanie obficie nasycona."
  tags: []
"Prz13,5":
  text: "Sprawiedliwy nienawidzi kłamliwego słowa, a niegodziwy staje się obrzydliwy i zhańbiony."
  tags: []
"Prz13,6":
  text: "Sprawiedliwość strzeże tego, który postępuje uczciwie, a niegodziwość powala grzesznika."
  tags: []
"Prz13,7":
  text: "Znajduje się taki, który czyni siebie bogatym, a nie ma nic; inny czyni siebie ubogim, choć ma wiele bogactw."
  tags: []
"Prz13,8":
  text: "Okupem za życie człowieka jest jego bogactwo, a ubogi nie słucha strofowania."
  tags: []
"Prz13,9":
  text: "Radośnie błyszczy światło sprawiedliwych, a pochodnia niegodziwych zgaśnie."
  tags: []
"Prz13,10":
  text: "Spór powstaje tylko dzięki pysze, a mądrość jest przy tych, co przyjmują radę."
  tags: []
"Prz13,11":
  text: "Łatwo zdobyte bogactwo zmniejsza się, a kto je gromadzi swą ręką, pomnaża je."
  tags: []
"Prz13,12":
  text: "Przedłużająca się nadzieja sprawia ból sercu, a spełnione pragnienie jest drzewem życia."
  tags: []
"Prz13,13":
  text: "Kto gardzi słowem Bożym, ten zginie, a kto się boi przykazania, dostanie nagrodę."
  tags: []
"Prz13,14":
  text: "Prawo mądrego jest źródłem życia, by uniknąć sideł śmierci."
  tags: []
"Prz13,15":
  text: "Prawdziwy rozum daje łaskę, a droga przewrotnych jest ciężka."
  tags: []
"Prz13,16":
  text: "Każdy roztropny postępuje rozważnie, a głupi ujawnia głupotę."
  tags: []
"Prz13,17":
  text: "Niegodziwy posłaniec popada w zło, a wierny wysłannik jest lekarstwem."
  tags: []
"Prz13,18":
  text: "Ubóstwo i hańba spadną na tego, który odrzuca karność, a kto szanuje upomnienia, dozna czci."
  tags: []
"Prz13,19":
  text: "Spełnione pragnienie jest słodkie dla duszy, a odwrócenie się od zła budzi odrazę w głupcach."
  tags: []
"Prz13,20":
  text: "Kto przestaje z mądrymi, będzie mądry, a towarzysz głupców będzie zniszczony."
  tags: []
"Prz13,21":
  text: "Nieszczęście ściga grzeszników, a sprawiedliwych Bóg nagrodzi dobrem."
  tags: []
"Prz13,22":
  text: "Dobry człowiek zostawia dziedzictwo dzieciom swoich dzieci, a majątek grzesznika jest zachowany dla sprawiedliwego."
  tags: []
"Prz13,23":
  text: "Obfita żywność jest na roli ubogich, lecz i ta może niszczeć przez nieroztropność."
  tags: []
"Prz13,24":
  text: "Kto oszczędza swą rózgę, nienawidzi swego syna, a kto go kocha, karze w porę."
  tags: []
"Prz13,25":
  text: "Sprawiedliwy je i syci swoją duszę, a żołądek niegodziwych cierpi niedostatek."
  tags: []
