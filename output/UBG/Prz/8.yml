"Prz8,1":
  text: "Czy mądrość nie woła i rozum nie wydaje swego głosu?"
  tags: []
"Prz8,2":
  text: "Stoi na szczycie wysokich miejsc, przy drodze, na rozstajach dróg."
  tags: []
"Prz8,3":
  text: "Przy bramach, przy wjeździe do miasta, przy wejściu, u drzwi woła:"
  tags: []
"Prz8,4":
  text: "Do was wołam, o mężowie, mój głos kieruję do synów ludzkich."
  tags: []
"Prz8,5":
  text: "Prości, uczcie się rozwagi, a wy, głupi, bądźcie rozumnego serca."
  tags: []
"Prz8,6":
  text: "Słuchajcie, bo będę mówił o rzeczach wzniosłych, a wargi moje otworzą się, aby głosić prawość."
  tags: []
"Prz8,7":
  text: "Moje usta bowiem mówią prawdę, a niegodziwością brzydzą się moje wargi."
  tags: []
"Prz8,8":
  text: "Sprawiedliwe są wszystkie słowa moich ust; nie ma w nich nic fałszywego ani przewrotnego."
  tags: []
"Prz8,9":
  text: "Wszystkie są jasne dla rozumnego i prawe dla tych, którzy znajdują wiedzę."
  tags: []
"Prz8,10":
  text: "Przyjmijcie moje pouczenie zamiast srebra i wiedzę raczej niż wyborne złoto."
  tags: []
"Prz8,11":
  text: "Lepsza bowiem jest mądrość niż perły i żadna rzecz, której pragniesz, nie dorówna jej."
  tags: []
"Prz8,12":
  text: "Ja, mądrość, mieszkam z rozwagą i odkrywam wiedzę roztropności."
  tags: []
"Prz8,13":
  text: "Bojaźń PANA to nienawidzić zła. Ja nienawidzę pychy, wyniosłości, złej drogi i ust przewrotnych."
  tags: []
"Prz8,14":
  text: "Moja jest rada i prawdziwa mądrość, ja jestem roztropnością i moja jest moc."
  tags: []
"Prz8,15":
  text: "Dzięki mnie królowie rządzą i władcy stanowią sprawiedliwość."
  tags: []
"Prz8,16":
  text: "Dzięki mnie panują władcy i dostojnicy, wszyscy sędziowie ziemi."
  tags: []
"Prz8,17":
  text: "Miłuję tych, którzy mnie miłują, a ci, którzy szukają mnie pilnie, znajdą mnie."
  tags: []
"Prz8,18":
  text: "Przy mnie jest bogactwo i chwała, trwałe bogactwo i sprawiedliwość."
  tags: []
"Prz8,19":
  text: "Mój owoc jest lepszy niż złoto, nawet najczystsze złoto, a moje plony lepsze niż wyborne srebro."
  tags: []
"Prz8,20":
  text: "Prowadzę ścieżką sprawiedliwości, pośród ścieżek sądu;"
  tags: []
"Prz8,21":
  text: "Aby tym, którzy mnie miłują, dać w dziedzictwo majątek wieczny i napełnić ich skarbce."
  tags: []
"Prz8,22":
  text: "PAN posiadł mnie na początku swej drogi, przed swymi dziełami, przed wszystkimi czasy."
  tags: []
"Prz8,23":
  text: "Przed wiekami zostałam ustanowiona, od początku; zanim powstała ziemia;"
  tags: []
"Prz8,24":
  text: "Gdy jeszcze nie było głębin, zostałam zrodzona, kiedy jeszcze nie było źródeł obfitujących w wody."
  tags: []
"Prz8,25":
  text: "Zanim góry zostały założone, nim były pagórki, zostałam zrodzona."
  tags: []
"Prz8,26":
  text: "Gdy jeszcze nie stworzył ziemi ani pól, ani początku prochu okręgu ziemskiego;"
  tags: []
"Prz8,27":
  text: "Kiedy przygotowywał niebiosa, byłam tam; gdy odmierzał okrąg nad powierzchnią głębi;"
  tags: []
"Prz8,28":
  text: "Gdy w górze utwierdzał obłoki i umacniał źródła głębin;"
  tags: []
"Prz8,29":
  text: "Gdy wyznaczał morzu jego granice, by wody nie przekraczały jego rozkazu, kiedy ustalał fundamenty ziemi;"
  tags: []
"Prz8,30":
  text: "Byłam wtedy przy nim jak wychowanka i byłam jego radością każdego dnia, ciesząc się zawsze przed nim;"
  tags: []
"Prz8,31":
  text: "Radując się na okręgu jego ziemi, rozkoszując się synami ludzkimi."
  tags: []
"Prz8,32":
  text: "Teraz więc, synowie, słuchajcie mnie, bo błogosławieni są ci, którzy strzegą moich dróg."
  tags: []
"Prz8,33":
  text: "Słuchajcie pouczeń, nabądźcie mądrości i nie odrzucajcie jej."
  tags: []
"Prz8,34":
  text: "Błogosławiony człowiek, który mnie słucha, czuwając u moich wrót każdego dnia i strzegąc odrzwi moich bram."
  tags: []
"Prz8,35":
  text: "Bo kto mnie znajduje, znajduje życie i otrzyma łaskę od PANA."
  tags: []
"Prz8,36":
  text: "Ale kto grzeszy przeciwko mnie, wyrządza krzywdę swojej duszy; wszyscy, którzy mnie nienawidzą, miłują śmierć."
  tags: []
