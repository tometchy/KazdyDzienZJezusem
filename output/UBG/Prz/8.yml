"Prz8,1": "Czy mądrość nie woła i rozum nie wydaje swego głosu?"
"Prz8,2": "Stoi na szczycie wysokich miejsc, przy drodze, na rozstajach dróg."
"Prz8,3": "Przy bramach, przy wjeździe do miasta, przy wejściu, u drzwi woła:"
"Prz8,4": "Do was wołam, o mężowie, mój głos kieruję do synów ludzkich."
"Prz8,5": "Prości, uczcie się rozwagi, a wy, głupi, bądźcie rozumnego serca."
"Prz8,6": "Słuchajcie, bo będę mówił o rzeczach wzniosłych, a wargi moje otworzą się, aby głosić prawość."
"Prz8,7": "Moje usta bowiem mówią prawdę, a niegodziwością brzydzą się moje wargi."
"Prz8,8": "Sprawiedliwe są wszystkie słowa moich ust; nie ma w nich nic fałszywego ani przewrotnego."
"Prz8,9": "Wszystkie są jasne dla rozumnego i prawe dla tych, którzy znajdują wiedzę."
"Prz8,10": "Przyjmijcie moje pouczenie zamiast srebra i wiedzę raczej niż wyborne złoto."
"Prz8,11": "Lepsza bowiem jest mądrość niż perły i żadna rzecz, której pragniesz, nie dorówna jej."
"Prz8,12": "Ja, mądrość, mieszkam z rozwagą i odkrywam wiedzę roztropności."
"Prz8,13": "Bojaźń PANA to nienawidzić zła. Ja nienawidzę pychy, wyniosłości, złej drogi i ust przewrotnych."
"Prz8,14": "Moja jest rada i prawdziwa mądrość, ja jestem roztropnością i moja jest moc."
"Prz8,15": "Dzięki mnie królowie rządzą i władcy stanowią sprawiedliwość."
"Prz8,16": "Dzięki mnie panują władcy i dostojnicy, wszyscy sędziowie ziemi."
"Prz8,17": "Miłuję tych, którzy mnie miłują, a ci, którzy szukają mnie pilnie, znajdą mnie."
"Prz8,18": "Przy mnie jest bogactwo i chwała, trwałe bogactwo i sprawiedliwość."
"Prz8,19": "Mój owoc jest lepszy niż złoto, nawet najczystsze złoto, a moje plony lepsze niż wyborne srebro."
"Prz8,20": "Prowadzę ścieżką sprawiedliwości, pośród ścieżek sądu;"
"Prz8,21": "Aby tym, którzy mnie miłują, dać w dziedzictwo majątek wieczny i napełnić ich skarbce."
"Prz8,22": "PAN posiadł mnie na początku swej drogi, przed swymi dziełami, przed wszystkimi czasy."
"Prz8,23": "Przed wiekami zostałam ustanowiona, od początku; zanim powstała ziemia;"
"Prz8,24": "Gdy jeszcze nie było głębin, zostałam zrodzona, kiedy jeszcze nie było źródeł obfitujących w wody."
"Prz8,25": "Zanim góry zostały założone, nim były pagórki, zostałam zrodzona."
"Prz8,26": "Gdy jeszcze nie stworzył ziemi ani pól, ani początku prochu okręgu ziemskiego;"
"Prz8,27": "Kiedy przygotowywał niebiosa, byłam tam; gdy odmierzał okrąg nad powierzchnią głębi;"
"Prz8,28": "Gdy w górze utwierdzał obłoki i umacniał źródła głębin;"
"Prz8,29": "Gdy wyznaczał morzu jego granice, by wody nie przekraczały jego rozkazu, kiedy ustalał fundamenty ziemi;"
"Prz8,30": "Byłam wtedy przy nim jak wychowanka i byłam jego radością każdego dnia, ciesząc się zawsze przed nim;"
"Prz8,31": "Radując się na okręgu jego ziemi, rozkoszując się synami ludzkimi."
"Prz8,32": "Teraz więc, synowie, słuchajcie mnie, bo błogosławieni są ci, którzy strzegą moich dróg."
"Prz8,33": "Słuchajcie pouczeń, nabądźcie mądrości i nie odrzucajcie jej."
"Prz8,34": "Błogosławiony człowiek, który mnie słucha, czuwając u moich wrót każdego dnia i strzegąc odrzwi moich bram."
"Prz8,35": "Bo kto mnie znajduje, znajduje życie i otrzyma łaskę od PANA."
"Prz8,36": "Ale kto grzeszy przeciwko mnie, wyrządza krzywdę swojej duszy; wszyscy, którzy mnie nienawidzą, miłują śmierć."
