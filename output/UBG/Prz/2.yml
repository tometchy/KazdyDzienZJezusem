"Prz2,1": "Synu mój, jeśli przyjmiesz moje słowa i zachowasz u siebie moje przykazania;"
"Prz2,2": "Nadstawiając swego ucha na mądrość i nakłaniając swe serce ku rozumowi;"
"Prz2,3": "Tak, jeśli przywołasz roztropność i swoim głosem wezwiesz rozum;"
"Prz2,4": "Jeśli będziesz jej szukać jak srebra i poszukiwać jej jak ukrytych skarbów;"
"Prz2,5": "Wtedy zrozumiesz bojaźń PANA i dojdziesz do poznania Boga."
"Prz2,6": "PAN bowiem daje mądrość, z jego ust pochodzi wiedza i rozum."
"Prz2,7": "On zachowuje prawdziwą mądrość dla prawych; on jest tarczą dla tych, którzy postępują uczciwie;"
"Prz2,8": "Strzeże ścieżek sądu i chroni drogę swoich świętych."
"Prz2,9": "Wtedy zrozumiesz sprawiedliwość, sąd, prawość i wszelką dobrą ścieżkę."
"Prz2,10": "Gdy mądrość wejdzie do twojego serca i wiedza będzie miła twojej duszy;"
"Prz2,11": "Wtedy rozwaga będzie cię strzegła i rozum cię zachowa."
"Prz2,12": "By uwolnić cię od złej drogi i od człowieka, który mówi przewrotnie;"
"Prz2,13": "Od tych, którzy opuszczają ścieżki prawości, żeby chodzić drogami ciemności;"
"Prz2,14": "Którzy się radują, gdy czynią zło, a cieszą się w złośliwej przewrotności;"
"Prz2,15": "Których ścieżki są kręte i sami są przewrotni na swoich drogach;"
"Prz2,16": "Aby cię uwolnić od cudzej kobiety, od obcej, która pochlebia łagodnymi słowami;"
"Prz2,17": "Która opuszcza przewodnika swojej młodości i zapomina o przymierzu swojego Boga;"
"Prz2,18": "Bo jej dom chyli się ku śmierci, a jej ścieżki ku umarłym;"
"Prz2,19": "Nikt z tych, którzy do niej wchodzą, nie wraca ani nie trafia na ścieżkę życia;"
"Prz2,20": "Abyś chodził drogą dobrych i przestrzegał ścieżek sprawiedliwych."
"Prz2,21": "Prawi bowiem będą mieszkali na ziemi i nienaganni na niej pozostaną;"
"Prz2,22": "Ale niegodziwi będą wykorzenieni z ziemi i przewrotni będą z niej wyrwani."
