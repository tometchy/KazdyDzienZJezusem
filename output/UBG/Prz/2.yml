"Prz2,1":
  text: "Synu mój, jeśli przyjmiesz moje słowa i zachowasz u siebie moje przykazania;"
  tags: []
"Prz2,2":
  text: "Nadstawiając swego ucha na mądrość i nakłaniając swe serce ku rozumowi;"
  tags: []
"Prz2,3":
  text: "Tak, jeśli przywołasz roztropność i swoim głosem wezwiesz rozum;"
  tags: []
"Prz2,4":
  text: "Jeśli będziesz jej szukać jak srebra i poszukiwać jej jak ukrytych skarbów;"
  tags: []
"Prz2,5":
  text: "Wtedy zrozumiesz bojaźń PANA i dojdziesz do poznania Boga."
  tags: []
"Prz2,6":
  text: "PAN bowiem daje mądrość, z jego ust pochodzi wiedza i rozum."
  tags: []
"Prz2,7":
  text: "On zachowuje prawdziwą mądrość dla prawych; on jest tarczą dla tych, którzy postępują uczciwie;"
  tags: []
"Prz2,8":
  text: "Strzeże ścieżek sądu i chroni drogę swoich świętych."
  tags: []
"Prz2,9":
  text: "Wtedy zrozumiesz sprawiedliwość, sąd, prawość i wszelką dobrą ścieżkę."
  tags: []
"Prz2,10":
  text: "Gdy mądrość wejdzie do twojego serca i wiedza będzie miła twojej duszy;"
  tags: []
"Prz2,11":
  text: "Wtedy rozwaga będzie cię strzegła i rozum cię zachowa."
  tags: []
"Prz2,12":
  text: "By uwolnić cię od złej drogi i od człowieka, który mówi przewrotnie;"
  tags: []
"Prz2,13":
  text: "Od tych, którzy opuszczają ścieżki prawości, żeby chodzić drogami ciemności;"
  tags: []
"Prz2,14":
  text: "Którzy się radują, gdy czynią zło, a cieszą się w złośliwej przewrotności;"
  tags: []
"Prz2,15":
  text: "Których ścieżki są kręte i sami są przewrotni na swoich drogach;"
  tags: []
"Prz2,16":
  text: "Aby cię uwolnić od cudzej kobiety, od obcej, która pochlebia łagodnymi słowami;"
  tags: []
"Prz2,17":
  text: "Która opuszcza przewodnika swojej młodości i zapomina o przymierzu swojego Boga;"
  tags: []
"Prz2,18":
  text: "Bo jej dom chyli się ku śmierci, a jej ścieżki ku umarłym;"
  tags: []
"Prz2,19":
  text: "Nikt z tych, którzy do niej wchodzą, nie wraca ani nie trafia na ścieżkę życia;"
  tags: []
"Prz2,20":
  text: "Abyś chodził drogą dobrych i przestrzegał ścieżek sprawiedliwych."
  tags: []
"Prz2,21":
  text: "Prawi bowiem będą mieszkali na ziemi i nienaganni na niej pozostaną;"
  tags: []
"Prz2,22":
  text: "Ale niegodziwi będą wykorzenieni z ziemi i przewrotni będą z niej wyrwani."
  tags: []
