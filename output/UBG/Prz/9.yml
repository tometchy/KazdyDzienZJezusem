"Prz9,1": "Mądrość zbudowała sobie dom i wyciosała siedem słupów;"
"Prz9,2": "Zabiła swoje bydło, zmieszała wino i zastawiła stół;"
"Prz9,3": "Rozesłała swoje służące, woła na szczytach najwyższych miejsc miasta:"
"Prz9,4": "Ktokolwiek jest prostym, niech wstąpi; a do nierozumnego mówi:"
"Prz9,5": "Chodźcie, jedzcie mój chleb i pijcie wino, które zmieszałam."
"Prz9,6": "Porzućcie głupotę, a będziecie żyli, i chodźcie drogą roztropności."
"Prz9,7": "Kto upomina szydercę, ściąga na siebie hańbę, a kto strofuje niegodziwego, ten się plami."
"Prz9,8": "Nie strofuj szydercy, aby cię nie znienawidził; strofuj mądrego, a będzie cię miłował."
"Prz9,9": "Upomnij mądrego, a będzie mądrzejszy; poucz sprawiedliwego, a pomnoży swą wiedzę."
"Prz9,10": "Początkiem mądrości jest bojaźń PANA, a wiedza o tym, co święte, to rozum."
"Prz9,11": "Bo dzięki mnie rozmnożą się twoje dni i przedłużą się lata twojego życia."
"Prz9,12": "Jeśli będziesz mądry, tobie samemu będzie służyła twoja mądrość; a jeśli szydercą, sam poniesiesz szkodę."
"Prz9,13": "Głupia kobieta jest wrzaskliwa, prosta i nic nie rozumie;"
"Prz9,14": "Siedzi u drzwi swego domu, na krześle, na wysokich miejscach w mieście;"
"Prz9,15": "Aby wołać na przechodzących, którzy idą prosto swoimi ścieżkami:"
"Prz9,16": "Ktokolwiek jest prosty, niech wstąpi; a do nierozumnego mówi:"
"Prz9,17": "Kradzione wody są słodkie, a chleb jedzony pokątnie smaczny."
"Prz9,18": "Ale on nie wie, że tam są umarli, że jej zaproszeni są w głębinach piekła."
