"Prz12,1":
  text: "Kto kocha karność, kocha wiedzę, a kto nienawidzi upomnienia, jest głupi."
  tags: []
"Prz12,2":
  text: "Dobry człowiek zdobędzie łaskę PANA, ale PAN potępi podstępnego."
  tags: []
"Prz12,3":
  text: "Człowiek nie umocni się niegodziwością, lecz korzeń sprawiedliwych nie będzie poruszony."
  tags: []
"Prz12,4":
  text: "Żona cnotliwa jest koroną swego męża, ale ta, która go hańbi, jest jak zgnilizna w jego kościach."
  tags: []
"Prz12,5":
  text: "Myśli sprawiedliwych są prawe, a rady niegodziwych zdradliwe."
  tags: []
"Prz12,6":
  text: "Słowa niegodziwych czyhają na krew, lecz usta prawych ocalą ich."
  tags: []
"Prz12,7":
  text: "Niegodziwi zostają powaleni i już ich nie ma, a dom sprawiedliwych się ostoi."
  tags: []
"Prz12,8":
  text: "Człowiek będzie chwalony za jego mądrość, a kto jest przewrotnego serca, zostanie wzgardzony."
  tags: []
"Prz12,9":
  text: "Lepszy jest człowiek wzgardzony, który ma sługę, niż ten, kto się chwali, a któremu brak chleba."
  tags: []
"Prz12,10":
  text: "Sprawiedliwy dba o życie swego bydła, a serce niegodziwych jest okrutne."
  tags: []
"Prz12,11":
  text: "Kto uprawia swoją ziemię, nasyci się chlebem, a kto naśladuje próżnujących, jest nierozumny."
  tags: []
"Prz12,12":
  text: "Niegodziwy pragnie sieci złych, a korzeń sprawiedliwych wydaje owoc."
  tags: []
"Prz12,13":
  text: "Zły zostaje usidlony przez grzech swoich warg, a sprawiedliwy wyjdzie z ucisku."
  tags: []
"Prz12,14":
  text: "Człowiek nasyci się dobrem z owocu swoich ust, a za dzieła swoich rąk otrzyma zapłatę."
  tags: []
"Prz12,15":
  text: "Droga głupiego wydaje się słuszna w jego oczach, ale kto słucha rady, jest mądry."
  tags: []
"Prz12,16":
  text: "Gniew głupiego objawia się od razu, a roztropny skrywa hańbę."
  tags: []
"Prz12,17":
  text: "Kto mówi prawdę, wyraża sprawiedliwość, ale fałszywy świadek – oszustwo."
  tags: []
"Prz12,18":
  text: "Znajdzie się taki, którego słowa są jak miecz przeszywający, lecz język mądrych jest lekarstwem."
  tags: []
"Prz12,19":
  text: "Prawdomówne wargi będą trwać na wieki, ale język kłamliwy trwa króciutko."
  tags: []
"Prz12,20":
  text: "Podstęp jest w sercu tych, którzy knują zło, lecz u doradzających pokój jest radość."
  tags: []
"Prz12,21":
  text: "Sprawiedliwego nie spotka żadne zło, ale niegodziwi będą pełni nieszczęścia."
  tags: []
"Prz12,22":
  text: "Wargi kłamliwe budzą odrazę w PANU, a ci, którzy postępują w prawdzie, podobają mu się."
  tags: []
"Prz12,23":
  text: "Człowiek roztropny ukrywa wiedzę, a serce głupich rozgłasza głupotę."
  tags: []
"Prz12,24":
  text: "Ręka pracowitych będzie panowała, a leniwa będzie płaciła daninę."
  tags: []
"Prz12,25":
  text: "Troska w sercu człowieka przygnębia je, a dobre słowo je rozwesela."
  tags: []
"Prz12,26":
  text: "Sprawiedliwy jest zacniejszy od swego bliźniego, a droga niegodziwych prowadzi ich na manowce."
  tags: []
"Prz12,27":
  text: "Leniwy nie upiecze tego, co upolował, ale mienie człowieka pracowitego jest cenne."
  tags: []
"Prz12,28":
  text: "Na ścieżce sprawiedliwości jest życie, na jej drodze nie ma śmierci."
  tags: []
