"Prz12,1": "Kto kocha karność, kocha wiedzę, a kto nienawidzi upomnienia, jest głupi."
"Prz12,2": "Dobry człowiek zdobędzie łaskę PANA, ale PAN potępi podstępnego."
"Prz12,3": "Człowiek nie umocni się niegodziwością, lecz korzeń sprawiedliwych nie będzie poruszony."
"Prz12,4": "Żona cnotliwa jest koroną swego męża, ale ta, która go hańbi, jest jak zgnilizna w jego kościach."
"Prz12,5": "Myśli sprawiedliwych są prawe, a rady niegodziwych zdradliwe."
"Prz12,6": "Słowa niegodziwych czyhają na krew, lecz usta prawych ocalą ich."
"Prz12,7": "Niegodziwi zostają powaleni i już ich nie ma, a dom sprawiedliwych się ostoi."
"Prz12,8": "Człowiek będzie chwalony za jego mądrość, a kto jest przewrotnego serca, zostanie wzgardzony."
"Prz12,9": "Lepszy jest człowiek wzgardzony, który ma sługę, niż ten, kto się chwali, a któremu brak chleba."
"Prz12,10": "Sprawiedliwy dba o życie swego bydła, a serce niegodziwych jest okrutne."
"Prz12,11": "Kto uprawia swoją ziemię, nasyci się chlebem, a kto naśladuje próżnujących, jest nierozumny."
"Prz12,12": "Niegodziwy pragnie sieci złych, a korzeń sprawiedliwych wydaje owoc."
"Prz12,13": "Zły zostaje usidlony przez grzech swoich warg, a sprawiedliwy wyjdzie z ucisku."
"Prz12,14": "Człowiek nasyci się dobrem z owocu swoich ust, a za dzieła swoich rąk otrzyma zapłatę."
"Prz12,15": "Droga głupiego wydaje się słuszna w jego oczach, ale kto słucha rady, jest mądry."
"Prz12,16": "Gniew głupiego objawia się od razu, a roztropny skrywa hańbę."
"Prz12,17": "Kto mówi prawdę, wyraża sprawiedliwość, ale fałszywy świadek – oszustwo."
"Prz12,18": "Znajdzie się taki, którego słowa są jak miecz przeszywający, lecz język mądrych jest lekarstwem."
"Prz12,19": "Prawdomówne wargi będą trwać na wieki, ale język kłamliwy trwa króciutko."
"Prz12,20": "Podstęp jest w sercu tych, którzy knują zło, lecz u doradzających pokój jest radość."
"Prz12,21": "Sprawiedliwego nie spotka żadne zło, ale niegodziwi będą pełni nieszczęścia."
"Prz12,22": "Wargi kłamliwe budzą odrazę w PANU, a ci, którzy postępują w prawdzie, podobają mu się."
"Prz12,23": "Człowiek roztropny ukrywa wiedzę, a serce głupich rozgłasza głupotę."
"Prz12,24": "Ręka pracowitych będzie panowała, a leniwa będzie płaciła daninę."
"Prz12,25": "Troska w sercu człowieka przygnębia je, a dobre słowo je rozwesela."
"Prz12,26": "Sprawiedliwy jest zacniejszy od swego bliźniego, a droga niegodziwych prowadzi ich na manowce."
"Prz12,27": "Leniwy nie upiecze tego, co upolował, ale mienie człowieka pracowitego jest cenne."
"Prz12,28": "Na ścieżce sprawiedliwości jest życie, na jej drodze nie ma śmierci."
