"Prz15,1": "Łagodna odpowiedź uśmierza zapalczywość, a przykre słowa wzniecają gniew."
"Prz15,2": "Język mądrych zdobi wiedzę, ale usta głupich tryskają głupotą."
"Prz15,3": "Oczy PANA są na każdym miejscu, upatrują złych i dobrych."
"Prz15,4": "Zdrowy język jest drzewem życia, a jego przewrotność jest zniszczeniem dla ducha."
"Prz15,5": "Głupi gardzi pouczeniem swego ojca, a kto przyjmuje upomnienia, jest roztropny."
"Prz15,6": "W domu sprawiedliwego jest wielki dostatek, a w dochodach niegodziwego jest zamieszanie."
"Prz15,7": "Wargi mądrych szerzą wiedzę, a serce głupich nie."
"Prz15,8": "Ofiara niegodziwych budzi odrazę w PANU, a modlitwa prawych mu się podoba."
"Prz15,9": "Droga niegodziwego wzbudza odrazę w PANU, a miłuje on tego, kto podąża za sprawiedliwością."
"Prz15,10": "Sroga kara należy się temu, kto zbacza z drogi, a kto nienawidzi upomnień, umrze."
"Prz15,11": "Piekło i zatracenie są przed PANEM; o ileż bardziej serca synów ludzkich."
"Prz15,12": "Szyderca nie miłuje tego, który go strofuje, ani nie pójdzie do mądrych."
"Prz15,13": "Radosne serce rozwesela twarz, ale gdy smutek w sercu, duch jest przygnębiony."
"Prz15,14": "Serce rozumne szuka wiedzy, a usta głupich karmią się głupotą."
"Prz15,15": "Wszystkie dni strapionego są złe, ale kto jest wesołego serca, ma nieustanną ucztę."
"Prz15,16": "Lepiej mieć mało z bojaźnią PANA niż wielki skarb z kłopotem."
"Prz15,17": "Lepsza jest potrawa z jarzyn, gdzie miłość, niż tuczny wół, gdzie panuje nienawiść."
"Prz15,18": "Człowiek gniewny wszczyna kłótnie, a nieskory do gniewu łagodzi spory."
"Prz15,19": "Droga leniwego jest jak płot cierniowy, a ścieżka prawych jest wyrównana."
"Prz15,20": "Mądry syn jest radością ojca, a człowiek głupi gardzi własną matką."
"Prz15,21": "Głupota jest radością dla nierozumnego, a człowiek roztropny postępuje uczciwie."
"Prz15,22": "Gdzie nie ma rady, nie udają się zamysły; powiodą się zaś przy mnóstwie doradców."
"Prz15,23": "Człowiek cieszy się z odpowiedzi swoich ust, a słowo powiedziane we właściwym czasie jakże jest dobre!"
"Prz15,24": "Droga życia dla mądrego jest w górze, aby uniknął głębokiego piekła."
"Prz15,25": "PAN zniszczy dom pysznych, a utwierdzi granicę wdowy."
"Prz15,26": "Myśli złego budzą odrazę w PANU, a słowa czystych są przyjemne."
"Prz15,27": "Kto jest chciwy zysku, ściąga kłopoty na własny dom, a kto nienawidzi darów, będzie żył."
"Prz15,28": "Serce sprawiedliwego rozmyśla nad odpowiedzią, a usta niegodziwych tryskają złymi rzeczami."
"Prz15,29": "PAN jest daleko od niegodziwych, ale wysłuchuje modlitwy sprawiedliwych."
"Prz15,30": "Światło oczu rozwesela serce, a dobra wieść tuczy kości."
"Prz15,31": "Ucho, które słucha upomnienia życia, będzie mieszkać pośród mądrych."
"Prz15,32": "Kto odrzuca karność, gardzi własną duszą, a kto przyjmuje upomnienie, nabiera rozumu."
"Prz15,33": "Bojaźń PANA jest pouczeniem w mądrości, a pokora poprzedza chwałę."
