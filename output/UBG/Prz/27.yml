"Prz27,1":
  text: "Nie chlub się dniem jutrzejszym, bo nie wiesz, co dzień przyniesie."
  tags: []
"Prz27,2":
  text: "Niech inny cię chwali, a nie twoje usta; ktoś obcy, a nie twoje wargi."
  tags: []
"Prz27,3":
  text: "Ciężki jest kamień i piasek waży, ale gniew głupca cięższy od obu."
  tags: []
"Prz27,4":
  text: "Okrutny jest gniew i straszliwa zapalczywość, lecz któż się ostoi przed zazdrością?"
  tags: []
"Prz27,5":
  text: "Lepsza jest jawna nagana niż skryta miłość."
  tags: []
"Prz27,6":
  text: "Rany przyjaciela są wierne, ale pocałunki wroga są zwodnicze."
  tags: []
"Prz27,7":
  text: "Dusza nasycona podepcze plaster miodu, a dla głodnej duszy wszystko, co gorzkie, jest słodkie."
  tags: []
"Prz27,8":
  text: "Jak ptak odlatuje od swego gniazda, tak człowiek odchodzi od swego miejsca."
  tags: []
"Prz27,9":
  text: "Maść i kadzidło radują serce, tak słodycz przyjaciela dzięki radzie od serca."
  tags: []
"Prz27,10":
  text: "Nie opuszczaj swego przyjaciela ani przyjaciela twego ojca, a w dniu twego nieszczęścia nie wchodź do domu twego brata, bo lepszy jest sąsiad bliski niż brat daleki."
  tags: []
"Prz27,11":
  text: "Bądź mądrym, synu mój, rozwesel moje serce, abym mógł odpowiedzieć temu, który mi urąga."
  tags: []
"Prz27,12":
  text: "Roztropny dostrzega zło i ukrywa się, a prości idą dalej i ponoszą karę."
  tags: []
"Prz27,13":
  text: "Zabierz szatę temu, kto ręczył za obcego, i od tego, który ręczył za cudzą kobietę, weź zastaw."
  tags: []
"Prz27,14":
  text: "Kto wczesnym rankiem błogosławi swemu przyjacielowi donośnym głosem, temu będzie to poczytane za przekleństwo."
  tags: []
"Prz27,15":
  text: "Nieustające kapanie w dniu rzęsistego deszczu i kłótliwa żona są sobie podobne;"
  tags: []
"Prz27,16":
  text: "Kto ją ukrywa, ukrywa wiatr i w prawej ręce wonny olejek, który sam siebie wydaje."
  tags: []
"Prz27,17":
  text: "Żelazo ostrzy się żelazem, tak człowiek zaostrza oblicze swego przyjaciela."
  tags: []
"Prz27,18":
  text: "Kto strzeże drzewa figowego, spożyje jego owoc; tak kto posługuje swemu panu, dozna czci."
  tags: []
"Prz27,19":
  text: "Jak w wodzie odbija się twarz, tak w sercu człowieka – człowiek."
  tags: []
"Prz27,20":
  text: "Piekło i zatracenie są nienasycone, tak oczy człowieka są niesyte."
  tags: []
"Prz27,21":
  text: "Czym dla srebra jest tygiel, a dla złota piec, tym dla człowieka pochwała."
  tags: []
"Prz27,22":
  text: "Choćbyś zmiażdżył głupca w moździerzu tłuczkiem razem z ziarnami, nie opuści go głupota."
  tags: []
"Prz27,23":
  text: "Doglądaj pilnie swego dobytku i troszcz się o swe stada."
  tags: []
"Prz27,24":
  text: "Bo bogactwo nie trwa na wieki ani korona przez wszystkie pokolenia."
  tags: []
"Prz27,25":
  text: "Trawa wyrasta, pojawia się zieleń, z gór zioła zbierają."
  tags: []
"Prz27,26":
  text: "Owce są na twoje szaty, a kozły są zapłatą za pole."
  tags: []
"Prz27,27":
  text: "I dosyć mleka koziego na pokarm dla ciebie, na wyżywienie twego domu i na utrzymanie twoich służebnic."
  tags: []
