"Prz27,1": "Nie chlub się dniem jutrzejszym, bo nie wiesz, co dzień przyniesie."
"Prz27,2": "Niech inny cię chwali, a nie twoje usta; ktoś obcy, a nie twoje wargi."
"Prz27,3": "Ciężki jest kamień i piasek waży, ale gniew głupca cięższy od obu."
"Prz27,4": "Okrutny jest gniew i straszliwa zapalczywość, lecz któż się ostoi przed zazdrością?"
"Prz27,5": "Lepsza jest jawna nagana niż skryta miłość."
"Prz27,6": "Rany przyjaciela są wierne, ale pocałunki wroga są zwodnicze."
"Prz27,7": "Dusza nasycona podepcze plaster miodu, a dla głodnej duszy wszystko, co gorzkie, jest słodkie."
"Prz27,8": "Jak ptak odlatuje od swego gniazda, tak człowiek odchodzi od swego miejsca."
"Prz27,9": "Maść i kadzidło radują serce, tak słodycz przyjaciela dzięki radzie od serca."
"Prz27,10": "Nie opuszczaj swego przyjaciela ani przyjaciela twego ojca, a w dniu twego nieszczęścia nie wchodź do domu twego brata, bo lepszy jest sąsiad bliski niż brat daleki."
"Prz27,11": "Bądź mądrym, synu mój, rozwesel moje serce, abym mógł odpowiedzieć temu, który mi urąga."
"Prz27,12": "Roztropny dostrzega zło i ukrywa się, a prości idą dalej i ponoszą karę."
"Prz27,13": "Zabierz szatę temu, kto ręczył za obcego, i od tego, który ręczył za cudzą kobietę, weź zastaw."
"Prz27,14": "Kto wczesnym rankiem błogosławi swemu przyjacielowi donośnym głosem, temu będzie to poczytane za przekleństwo."
"Prz27,15": "Nieustające kapanie w dniu rzęsistego deszczu i kłótliwa żona są sobie podobne;"
"Prz27,16": "Kto ją ukrywa, ukrywa wiatr i w prawej ręce wonny olejek, który sam siebie wydaje."
"Prz27,17": "Żelazo ostrzy się żelazem, tak człowiek zaostrza oblicze swego przyjaciela."
"Prz27,18": "Kto strzeże drzewa figowego, spożyje jego owoc; tak kto posługuje swemu panu, dozna czci."
"Prz27,19": "Jak w wodzie odbija się twarz, tak w sercu człowieka – człowiek."
"Prz27,20": "Piekło i zatracenie są nienasycone, tak oczy człowieka są niesyte."
"Prz27,21": "Czym dla srebra jest tygiel, a dla złota piec, tym dla człowieka pochwała."
"Prz27,22": "Choćbyś zmiażdżył głupca w moździerzu tłuczkiem razem z ziarnami, nie opuści go głupota."
"Prz27,23": "Doglądaj pilnie swego dobytku i troszcz się o swe stada."
"Prz27,24": "Bo bogactwo nie trwa na wieki ani korona przez wszystkie pokolenia."
"Prz27,25": "Trawa wyrasta, pojawia się zieleń, z gór zioła zbierają."
"Prz27,26": "Owce są na twoje szaty, a kozły są zapłatą za pole."
"Prz27,27": "I dosyć mleka koziego na pokarm dla ciebie, na wyżywienie twego domu i na utrzymanie twoich służebnic."
