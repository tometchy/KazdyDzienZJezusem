"Prz3,1": "Synu mój, nie zapominaj mego prawa, a niech twoje serce strzeże moich przykazań;"
"Prz3,2": "Bo przyniosą ci długie dni i lata życia oraz pokoju."
"Prz3,3": "Niech cię nie opuszczają miłosierdzie i prawda, przywiąż je do swojej szyi, wypisz je na tablicy swojego serca."
"Prz3,4": "Wtedy znajdziesz łaskę i uznanie w oczach Boga i ludzi."
"Prz3,5": "Ufaj PANU z całego swego serca i nie polegaj na swoim rozumie."
"Prz3,6": "Zważaj na niego we wszystkich swoich drogach, a on będzie prostować twoje ścieżki."
"Prz3,7": "Nie bądź mądrym we własnych oczach, ale bój się PANA i odstąp od zła."
"Prz3,8": "To da twemu ciału zdrowie i pokrzepienie twoim kościom."
"Prz3,9": "Czcij PANA swoim majątkiem i pierwocinami wszystkich twoich dochodów."
"Prz3,10": "A twoje spichrze będą napełnione dostatkiem i twoje prasy będą przelewać się od nowego wina."
"Prz3,11": "Synu mój, nie gardź karceniem PANA i nie zniechęcaj się jego upomnieniem."
"Prz3,12": "Bo kogo PAN miłuje, tego karze, jak ojciec syna, którego kocha."
"Prz3,13": "Błogosławiony człowiek, który znajduje mądrość, i człowiek, który nabiera rozumu;"
"Prz3,14": "Gdyż jego nabycie jest lepsze niż nabycie srebra, jego zdobycie bardziej pożyteczne niż złoto."
"Prz3,15": "Jest droższa nad perły i żadna rzecz, której pragniesz, nie dorówna jej."
"Prz3,16": "Długie dni są w jej prawej ręce, a w lewej bogactwa i chwała."
"Prz3,17": "Jej drogi są drogami rozkoszy i wszystkie jej ścieżki spokojne."
"Prz3,18": "Jest drzewem życia dla tych, którzy się jej chwycą; a ci, którzy się jej trzymają, są błogosławieni."
"Prz3,19": "PAN ugruntował ziemię mądrością, a niebiosa umocnił rozumem."
"Prz3,20": "Dzięki jego wiedzy rozstąpiły się głębiny, a obłoki spuszczają rosę."
"Prz3,21": "Synu mój, niech one ci z oczu nie schodzą; strzeż prawdziwej mądrości i roztropności;"
"Prz3,22": "A będą życiem twojej duszy i ozdobą twojej szyi."
"Prz3,23": "Wtedy będziesz bezpiecznie chodził swoją drogą, a noga twoja się nie potknie."
"Prz3,24": "Gdy się położysz, nie będziesz się lękał; a gdy zaśniesz, twój sen będzie przyjemny."
"Prz3,25": "Nie lękaj się nagłego strachu ani spustoszenia niegodziwych, gdy przyjdzie."
"Prz3,26": "PAN bowiem będzie twoją ufnością i twojej nogi będzie strzegł od sideł."
"Prz3,27": "Nie wzbraniaj się dobrze czynić potrzebującemu, gdy stać cię na to, aby dobrze czynić."
"Prz3,28": "Nie mów bliźniemu: Idź i przyjdź znowu, dam ci jutro, gdy masz to u siebie."
"Prz3,29": "Nie knuj zła przeciwko swemu bliźniemu, gdy spokojnie mieszka obok ciebie."
"Prz3,30": "Nie spieraj się z człowiekiem bez przyczyny, jeśli ci nic złego nie wyrządził."
"Prz3,31": "Nie zazdrość ciemięzcy i nie wybieraj żadnej z jego dróg."
"Prz3,32": "Przewrotny bowiem budzi w PANU odrazę, ale jego tajemnica jest z prawymi."
"Prz3,33": "Przekleństwo PANA jest w domu niegodziwego, lecz PAN błogosławi mieszkanie sprawiedliwych."
"Prz3,34": "On szydzi z szyderców, ale daje łaskę pokornym."
"Prz3,35": "Mądrzy odziedziczą chwałę, a głupi poniosą hańbę."
