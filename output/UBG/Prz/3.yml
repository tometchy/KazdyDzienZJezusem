"Prz3,1":
  text: "Synu mój, nie zapominaj mego prawa, a niech twoje serce strzeże moich przykazań;"
  tags: []
"Prz3,2":
  text: "Bo przyniosą ci długie dni i lata życia oraz pokoju."
  tags: []
"Prz3,3":
  text: "Niech cię nie opuszczają miłosierdzie i prawda, przywiąż je do swojej szyi, wypisz je na tablicy swojego serca."
  tags: []
"Prz3,4":
  text: "Wtedy znajdziesz łaskę i uznanie w oczach Boga i ludzi."
  tags: []
"Prz3,5":
  text: "Ufaj PANU z całego swego serca i nie polegaj na swoim rozumie."
  tags: []
"Prz3,6":
  text: "Zważaj na niego we wszystkich swoich drogach, a on będzie prostować twoje ścieżki."
  tags: []
"Prz3,7":
  text: "Nie bądź mądrym we własnych oczach, ale bój się PANA i odstąp od zła."
  tags: []
"Prz3,8":
  text: "To da twemu ciału zdrowie i pokrzepienie twoim kościom."
  tags: []
"Prz3,9":
  text: "Czcij PANA swoim majątkiem i pierwocinami wszystkich twoich dochodów."
  tags: []
"Prz3,10":
  text: "A twoje spichrze będą napełnione dostatkiem i twoje prasy będą przelewać się od nowego wina."
  tags: []
"Prz3,11":
  text: "Synu mój, nie gardź karceniem PANA i nie zniechęcaj się jego upomnieniem."
  tags: []
"Prz3,12":
  text: "Bo kogo PAN miłuje, tego karze, jak ojciec syna, którego kocha."
  tags: []
"Prz3,13":
  text: "Błogosławiony człowiek, który znajduje mądrość, i człowiek, który nabiera rozumu;"
  tags: []
"Prz3,14":
  text: "Gdyż jego nabycie jest lepsze niż nabycie srebra, jego zdobycie bardziej pożyteczne niż złoto."
  tags: []
"Prz3,15":
  text: "Jest droższa nad perły i żadna rzecz, której pragniesz, nie dorówna jej."
  tags: []
"Prz3,16":
  text: "Długie dni są w jej prawej ręce, a w lewej bogactwa i chwała."
  tags: []
"Prz3,17":
  text: "Jej drogi są drogami rozkoszy i wszystkie jej ścieżki spokojne."
  tags: []
"Prz3,18":
  text: "Jest drzewem życia dla tych, którzy się jej chwycą; a ci, którzy się jej trzymają, są błogosławieni."
  tags: []
"Prz3,19":
  text: "PAN ugruntował ziemię mądrością, a niebiosa umocnił rozumem."
  tags: []
"Prz3,20":
  text: "Dzięki jego wiedzy rozstąpiły się głębiny, a obłoki spuszczają rosę."
  tags: []
"Prz3,21":
  text: "Synu mój, niech one ci z oczu nie schodzą; strzeż prawdziwej mądrości i roztropności;"
  tags: []
"Prz3,22":
  text: "A będą życiem twojej duszy i ozdobą twojej szyi."
  tags: []
"Prz3,23":
  text: "Wtedy będziesz bezpiecznie chodził swoją drogą, a noga twoja się nie potknie."
  tags: []
"Prz3,24":
  text: "Gdy się położysz, nie będziesz się lękał; a gdy zaśniesz, twój sen będzie przyjemny."
  tags: []
"Prz3,25":
  text: "Nie lękaj się nagłego strachu ani spustoszenia niegodziwych, gdy przyjdzie."
  tags: []
"Prz3,26":
  text: "PAN bowiem będzie twoją ufnością i twojej nogi będzie strzegł od sideł."
  tags: []
"Prz3,27":
  text: "Nie wzbraniaj się dobrze czynić potrzebującemu, gdy stać cię na to, aby dobrze czynić."
  tags: []
"Prz3,28":
  text: "Nie mów bliźniemu: Idź i przyjdź znowu, dam ci jutro, gdy masz to u siebie."
  tags: []
"Prz3,29":
  text: "Nie knuj zła przeciwko swemu bliźniemu, gdy spokojnie mieszka obok ciebie."
  tags: []
"Prz3,30":
  text: "Nie spieraj się z człowiekiem bez przyczyny, jeśli ci nic złego nie wyrządził."
  tags: []
"Prz3,31":
  text: "Nie zazdrość ciemięzcy i nie wybieraj żadnej z jego dróg."
  tags: []
"Prz3,32":
  text: "Przewrotny bowiem budzi w PANU odrazę, ale jego tajemnica jest z prawymi."
  tags: []
"Prz3,33":
  text: "Przekleństwo PANA jest w domu niegodziwego, lecz PAN błogosławi mieszkanie sprawiedliwych."
  tags: []
"Prz3,34":
  text: "On szydzi z szyderców, ale daje łaskę pokornym."
  tags: []
"Prz3,35":
  text: "Mądrzy odziedziczą chwałę, a głupi poniosą hańbę."
  tags: []
