"Prz28,1": "Niegodziwi uciekają, choć nikt ich nie goni, ale sprawiedliwi są dzielni jak lew."
"Prz28,2": "Z powodu grzechu ziemi wielu jest jej władców, ale dzięki człowiekowi roztropnemu i rozumnemu będzie trwała."
"Prz28,3": "Ubogi człowiek, który gnębi biednych, jest jak gwałtowny deszcz, po którym nie ma chleba."
"Prz28,4": "Ci, którzy odstępują od prawa, chwalą niegodziwych, lecz ci, którzy przestrzegają prawa, zwalczają ich."
"Prz28,5": "Źli ludzie nie rozumieją sądu, ale ci, którzy szukają PANA, rozumieją wszystko."
"Prz28,6": "Lepszy jest ubogi, który postępuje uczciwie, niż człowiek przewrotny w swych drogach, chociaż jest bogaty."
"Prz28,7": "Kto przestrzega prawa, jest rozumnym synem, a towarzysz rozwiązłych hańbi swego ojca."
"Prz28,8": "Kto pomnaża swój majątek lichwą i odsetkami, zbiera go dla tego, kto zlituje się nad ubogimi."
"Prz28,9": "Kto odwraca swe ucho, aby nie słyszeć prawa, nawet jego modlitwa budzi odrazę."
"Prz28,10": "Kto sprowadza prawych na złą drogę, sam wpadnie we własny dół, ale nienaganni odziedziczą dobro."
"Prz28,11": "Bogacz jest mądry w swoich oczach, ale rozumny biedak go bada."
"Prz28,12": "Gdy sprawiedliwi się radują, jest wielka chwała, a gdy niegodziwi powstają, człowiek się kryje."
"Prz28,13": "Kto ukrywa swe grzechy, nie będzie miał szczęścia, ale kto je wyznaje i porzuca, dostąpi miłosierdzia."
"Prz28,14": "Błogosławiony człowiek, który się zawsze boi, ale kto zatwardza swoje serce, wpada w nieszczęście."
"Prz28,15": "Jak lew ryczący i zgłodniały niedźwiedź, tak niegodziwy władca panujący nad ubogim ludem."
"Prz28,16": "Władca bezrozumny jest wielkim ciemięzcą, a kto nienawidzi chciwości, przedłuży swoje dni."
"Prz28,17": "Człowiek, który przeleje krew ludzką, ucieknie aż do dołu; niech nikt go nie zatrzymuje."
"Prz28,18": "Kto postępuje uczciwie, będzie wybawiony, a przewrotny na swoich drogach nagle upadnie."
"Prz28,19": "Kto uprawia swoją ziemię, nasyci się chlebem, a kto naśladuje próżniaków, nasyci się nędzą."
"Prz28,20": "Wierny człowiek będzie opływał w błogosławieństwa, a kto chce się szybko wzbogacić, nie będzie bez winy."
"Prz28,21": "Niedobrze jest mieć wzgląd na osobę, bo dla kęsa chleba niejeden popełni przestępstwo."
"Prz28,22": "Kto chce szybko się wzbogacić, ma złe oko, a nie wie, że przyjdzie na niego bieda."
"Prz28,23": "Kto strofuje człowieka, znajdzie potem więcej przychylności niż ten, który pochlebia językiem."
"Prz28,24": "Kto kradnie ojcu lub matce i mówi: To nie grzech, jest towarzyszem zbójcy."
"Prz28,25": "Człowiek wyniosły wszczyna spór, ale kto pokłada ufność w PANU, będzie nasycony."
"Prz28,26": "Kto ufa własnemu sercu, jest głupi, a kto mądrze postępuje, będzie ocalony."
"Prz28,27": "Kto daje ubogiemu, nie zazna braku, a na tego, kto odwraca swe oczy od niego, spadnie wiele przekleństw."
"Prz28,28": "Gdy niegodziwi powstają, ludzie się kryją, ale gdy giną, sprawiedliwi się mnożą."
