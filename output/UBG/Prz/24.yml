"Prz24,1":
  text: "Nie zazdrość złym ludziom ani nie pragnij z nimi przebywać;"
  tags: []
"Prz24,2":
  text: "Ich serce bowiem obmyśla przemoc, a ich wargi mówią o krzywdzie."
  tags: []
"Prz24,3":
  text: "Dom buduje się mądrością, a umacnia się rozumem."
  tags: []
"Prz24,4":
  text: "Dzięki wiedzy komory będą napełnione wszelkimi kosztownymi i przyjemnymi bogactwami."
  tags: []
"Prz24,5":
  text: "Mądry człowiek jest silny, a mąż, który ma wiedzę, dodaje siły."
  tags: []
"Prz24,6":
  text: "Bo dzięki mądrej radzie poprowadzisz wojnę, a mnóstwo doradców da ci wybawienie."
  tags: []
"Prz24,7":
  text: "Mądrość jest dla głupca zbyt wzniosła; nie otwiera ust swoich w bramie."
  tags: []
"Prz24,8":
  text: "Kto knuje zło, będzie zwany złośliwym."
  tags: []
"Prz24,9":
  text: "Obmyślanie głupoty jest grzechem, a szyderca budzi odrazę w ludziach."
  tags: []
"Prz24,10":
  text: "Jeśli w dniu ucisku ustaniesz, twoja siła jest słaba."
  tags: []
"Prz24,11":
  text: "Jeśli odmówisz ratunku prowadzonym na śmierć i tym, którzy idą na stracenie;"
  tags: []
"Prz24,12":
  text: "Jeśli powiesz: Nie wiedzieliśmy o tym; czy ten, który waży serca, nie rozumie? A ten, który strzeże twojej duszy, nie pozna? I czy nie odda człowiekowi według jego uczynków?"
  tags: []
"Prz24,13":
  text: "Synu mój, jedz miód, bo jest dobry, i plaster miodu słodki dla twojego podniebienia."
  tags: []
"Prz24,14":
  text: "Tak będzie poznanie mądrości dla twojej duszy; jeśli ją znajdziesz, będzie nagroda, a twoja nadzieja nie będzie zawiedziona."
  tags: []
"Prz24,15":
  text: "Nie czyhaj, niegodziwcze, przed mieszkaniem sprawiedliwego, nie burz miejsca jego odpoczynku;"
  tags: []
"Prz24,16":
  text: "Bo sprawiedliwy upada siedem razy, jednak znowu powstaje; a niegodziwi popadną w nieszczęście."
  tags: []
"Prz24,17":
  text: "Nie ciesz się, gdy twój nieprzyjaciel upadnie, i niech twoje serce się nie raduje, gdy się potknie;"
  tags: []
"Prz24,18":
  text: "Aby PAN tego nie widział i nie uznał za zło, i nie odwrócił od niego swojego gniewu."
  tags: []
"Prz24,19":
  text: "Nie gniewaj się z powodu złoczyńców ani nie zazdrość niegodziwym;"
  tags: []
"Prz24,20":
  text: "Bo zły nie otrzyma nagrody, pochodnia niegodziwych zostanie zgaszona."
  tags: []
"Prz24,21":
  text: "Synu mój, bój się PANA i króla, a nie przestawaj z chwiejnymi;"
  tags: []
"Prz24,22":
  text: "Bo ich nieszczęście nastąpi nagle, a któż zna upadek obydwóch?"
  tags: []
"Prz24,23":
  text: "I to też należy do mądrych. Niedobrze jest mieć wzgląd na osobę w sądzie."
  tags: []
"Prz24,24":
  text: "Kto mówi niegodziwemu: Jesteś sprawiedliwy, tego będą ludzie przeklinać, a narody będą się nim brzydzić."
  tags: []
"Prz24,25":
  text: "A ci, którzy go strofują, będą szczęśliwi i przyjdzie na nich obfite błogosławieństwo."
  tags: []
"Prz24,26":
  text: "Pocałują wargi tego, który daje słuszną odpowiedź."
  tags: []
"Prz24,27":
  text: "Przygotuj swoją pracę na zewnątrz, a wykonuj ją na swoim polu, a potem buduj swój dom."
  tags: []
"Prz24,28":
  text: "Nie bądź bez powodu świadkiem przeciw swemu bliźniemu ani nie oszukuj swymi wargami."
  tags: []
"Prz24,29":
  text: "Nie mów: Zrobię mu, jak on mi zrobił, oddam temu człowiekowi według jego uczynku."
  tags: []
"Prz24,30":
  text: "Szedłem koło pola leniwego i koło winnicy nierozumnego;"
  tags: []
"Prz24,31":
  text: "A oto wszystko zarosło cierniem, pokrzywy pokryły wszystko, a kamienny mur był zburzony."
  tags: []
"Prz24,32":
  text: "Spojrzałem i rozważałem w sercu; obejrzałem i wyciągnąłem naukę."
  tags: []
"Prz24,33":
  text: "Trochę snu, trochę drzemania, trochę założenia rąk, by odpocząć;"
  tags: []
"Prz24,34":
  text: "A twoje ubóstwo przyjdzie jak podróżny, a niedostatek – jak mąż uzbrojony."
  tags: []
