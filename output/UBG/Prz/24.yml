"Prz24,1": "Nie zazdrość złym ludziom ani nie pragnij z nimi przebywać;"
"Prz24,2": "Ich serce bowiem obmyśla przemoc, a ich wargi mówią o krzywdzie."
"Prz24,3": "Dom buduje się mądrością, a umacnia się rozumem."
"Prz24,4": "Dzięki wiedzy komory będą napełnione wszelkimi kosztownymi i przyjemnymi bogactwami."
"Prz24,5": "Mądry człowiek jest silny, a mąż, który ma wiedzę, dodaje siły."
"Prz24,6": "Bo dzięki mądrej radzie poprowadzisz wojnę, a mnóstwo doradców da ci wybawienie."
"Prz24,7": "Mądrość jest dla głupca zbyt wzniosła; nie otwiera ust swoich w bramie."
"Prz24,8": "Kto knuje zło, będzie zwany złośliwym."
"Prz24,9": "Obmyślanie głupoty jest grzechem, a szyderca budzi odrazę w ludziach."
"Prz24,10": "Jeśli w dniu ucisku ustaniesz, twoja siła jest słaba."
"Prz24,11": "Jeśli odmówisz ratunku prowadzonym na śmierć i tym, którzy idą na stracenie;"
"Prz24,12": "Jeśli powiesz: Nie wiedzieliśmy o tym; czy ten, który waży serca, nie rozumie? A ten, który strzeże twojej duszy, nie pozna? I czy nie odda człowiekowi według jego uczynków?"
"Prz24,13": "Synu mój, jedz miód, bo jest dobry, i plaster miodu słodki dla twojego podniebienia."
"Prz24,14": "Tak będzie poznanie mądrości dla twojej duszy; jeśli ją znajdziesz, będzie nagroda, a twoja nadzieja nie będzie zawiedziona."
"Prz24,15": "Nie czyhaj, niegodziwcze, przed mieszkaniem sprawiedliwego, nie burz miejsca jego odpoczynku;"
"Prz24,16": "Bo sprawiedliwy upada siedem razy, jednak znowu powstaje; a niegodziwi popadną w nieszczęście."
"Prz24,17": "Nie ciesz się, gdy twój nieprzyjaciel upadnie, i niech twoje serce się nie raduje, gdy się potknie;"
"Prz24,18": "Aby PAN tego nie widział i nie uznał za zło, i nie odwrócił od niego swojego gniewu."
"Prz24,19": "Nie gniewaj się z powodu złoczyńców ani nie zazdrość niegodziwym;"
"Prz24,20": "Bo zły nie otrzyma nagrody, pochodnia niegodziwych zostanie zgaszona."
"Prz24,21": "Synu mój, bój się PANA i króla, a nie przestawaj z chwiejnymi;"
"Prz24,22": "Bo ich nieszczęście nastąpi nagle, a któż zna upadek obydwóch?"
"Prz24,23": "I to też należy do mądrych. Niedobrze jest mieć wzgląd na osobę w sądzie."
"Prz24,24": "Kto mówi niegodziwemu: Jesteś sprawiedliwy, tego będą ludzie przeklinać, a narody będą się nim brzydzić."
"Prz24,25": "A ci, którzy go strofują, będą szczęśliwi i przyjdzie na nich obfite błogosławieństwo."
"Prz24,26": "Pocałują wargi tego, który daje słuszną odpowiedź."
"Prz24,27": "Przygotuj swoją pracę na zewnątrz, a wykonuj ją na swoim polu, a potem buduj swój dom."
"Prz24,28": "Nie bądź bez powodu świadkiem przeciw swemu bliźniemu ani nie oszukuj swymi wargami."
"Prz24,29": "Nie mów: Zrobię mu, jak on mi zrobił, oddam temu człowiekowi według jego uczynku."
"Prz24,30": "Szedłem koło pola leniwego i koło winnicy nierozumnego;"
"Prz24,31": "A oto wszystko zarosło cierniem, pokrzywy pokryły wszystko, a kamienny mur był zburzony."
"Prz24,32": "Spojrzałem i rozważałem w sercu; obejrzałem i wyciągnąłem naukę."
"Prz24,33": "Trochę snu, trochę drzemania, trochę założenia rąk, by odpocząć;"
"Prz24,34": "A twoje ubóstwo przyjdzie jak podróżny, a niedostatek – jak mąż uzbrojony."
