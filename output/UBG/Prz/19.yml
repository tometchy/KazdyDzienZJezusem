"Prz19,1": "Lepszy jest ubogi, który postępuje uczciwie, niż człowiek o przewrotnych wargach, który jest głupcem."
"Prz19,2": "Nie jest też dobrze, by dusza nie miała wiedzy, a kto jest prędkich nóg, grzeszy."
"Prz19,3": "Głupota człowieka wypacza jego drogę, a jego serce zapala się gniewem przeciwko PANU."
"Prz19,4": "Bogactwo przyciąga wielu przyjaciół, ale ubogi zostaje odłączony od przyjaciela."
"Prz19,5": "Fałszywy świadek nie uniknie kary, a kto mówi kłamstwa, nie ujdzie."
"Prz19,6": "Wielu uprasza o przychylność dostojnika i każdy jest przyjacielem człowieka hojnego."
"Prz19,7": "Wszyscy bracia ubogiego nienawidzą go, tym bardziej oddalają się od niego jego przyjaciele; ściga ich słowami, ale ich nie ma."
"Prz19,8": "Kto zdobywa rozum, miłuje swoją duszę, a kto strzeże roztropności, znajdzie dobro."
"Prz19,9": "Fałszywy świadek nie uniknie kary, a kto mówi kłamstwa, zginie."
"Prz19,10": "Głupiemu nie przystoi życie w rozkoszach, tym mniej słudze panować nad książętami."
"Prz19,11": "Roztropność człowieka powściąga jego gniew, a jego chwałą jest darować wykroczenie."
"Prz19,12": "Gniew króla jest jak ryk lwa, a jego przychylność jak rosa na trawie."
"Prz19,13": "Głupi syn jest utrapieniem dla swego ojca, a kłótliwa żona jest jak nieustanne kapanie z dachu."
"Prz19,14": "Dom i bogactwo są dziedzictwem po ojcach, ale roztropna żona jest od PANA."
"Prz19,15": "Lenistwo pogrąża w twardym śnie, a leniwa dusza będzie cierpieć głód."
"Prz19,16": "Kto przestrzega przykazania, zachowuje swoją duszę, ale kto gardzi swymi drogami, zginie."
"Prz19,17": "Kto lituje się nad ubogim, pożycza PANU, a on mu odpłaci za jego dobrodziejstwo."
"Prz19,18": "Karz swego syna, dopóki jest nadzieja, i niech twoja dusza mu nie pobłaża z powodu jego płaczu."
"Prz19,19": "Człowiek wielkiego gniewu poniesie karę, a jeśli go uwolnisz, znowu będziesz musiał to zrobić."
"Prz19,20": "Posłuchaj rady i przyjmij pouczenie, abyś był mądry u kresu swych dni."
"Prz19,21": "Wiele jest zamysłów w sercu człowieka, ale rada PANA się ostoi."
"Prz19,22": "Pragnienie człowieka to jego dobroczynność i lepszy jest ubogi niż kłamca."
"Prz19,23": "Bojaźń PANA prowadzi do życia, a kto ją ma, spocznie syty i nie nawiedzi go zło."
"Prz19,24": "Leniwy kryje swą rękę pod pachę i do ust jej nie podnosi."
"Prz19,25": "Uderz szydercę, a prosty będzie roztropniejszy; strofuj rozumnego, a pojmie wiedzę."
"Prz19,26": "Kto trwoni dobra ojca i wypędza matkę, ten jest synem, który przynosi wstyd i hańbę."
"Prz19,27": "Synu mój, przestań słuchać pouczeń, które cię odwodzą od słów rozumnych."
"Prz19,28": "Nikczemny świadek naśmiewa się z sądu, a usta niegodziwych pożerają nieprawość."
"Prz19,29": "Sądy są przygotowane dla szyderców, a razy na grzbiet głupców."
