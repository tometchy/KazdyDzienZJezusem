"Prz19,1":
  text: "Lepszy jest ubogi, który postępuje uczciwie, niż człowiek o przewrotnych wargach, który jest głupcem."
  tags: []
"Prz19,2":
  text: "Nie jest też dobrze, by dusza nie miała wiedzy, a kto jest prędkich nóg, grzeszy."
  tags: []
"Prz19,3":
  text: "Głupota człowieka wypacza jego drogę, a jego serce zapala się gniewem przeciwko PANU."
  tags: []
"Prz19,4":
  text: "Bogactwo przyciąga wielu przyjaciół, ale ubogi zostaje odłączony od przyjaciela."
  tags: []
"Prz19,5":
  text: "Fałszywy świadek nie uniknie kary, a kto mówi kłamstwa, nie ujdzie."
  tags: []
"Prz19,6":
  text: "Wielu uprasza o przychylność dostojnika i każdy jest przyjacielem człowieka hojnego."
  tags: []
"Prz19,7":
  text: "Wszyscy bracia ubogiego nienawidzą go, tym bardziej oddalają się od niego jego przyjaciele; ściga ich słowami, ale ich nie ma."
  tags: []
"Prz19,8":
  text: "Kto zdobywa rozum, miłuje swoją duszę, a kto strzeże roztropności, znajdzie dobro."
  tags: []
"Prz19,9":
  text: "Fałszywy świadek nie uniknie kary, a kto mówi kłamstwa, zginie."
  tags: []
"Prz19,10":
  text: "Głupiemu nie przystoi życie w rozkoszach, tym mniej słudze panować nad książętami."
  tags: []
"Prz19,11":
  text: "Roztropność człowieka powściąga jego gniew, a jego chwałą jest darować wykroczenie."
  tags: []
"Prz19,12":
  text: "Gniew króla jest jak ryk lwa, a jego przychylność jak rosa na trawie."
  tags: []
"Prz19,13":
  text: "Głupi syn jest utrapieniem dla swego ojca, a kłótliwa żona jest jak nieustanne kapanie z dachu."
  tags: []
"Prz19,14":
  text: "Dom i bogactwo są dziedzictwem po ojcach, ale roztropna żona jest od PANA."
  tags: []
"Prz19,15":
  text: "Lenistwo pogrąża w twardym śnie, a leniwa dusza będzie cierpieć głód."
  tags: []
"Prz19,16":
  text: "Kto przestrzega przykazania, zachowuje swoją duszę, ale kto gardzi swymi drogami, zginie."
  tags: []
"Prz19,17":
  text: "Kto lituje się nad ubogim, pożycza PANU, a on mu odpłaci za jego dobrodziejstwo."
  tags: []
"Prz19,18":
  text: "Karz swego syna, dopóki jest nadzieja, i niech twoja dusza mu nie pobłaża z powodu jego płaczu."
  tags: []
"Prz19,19":
  text: "Człowiek wielkiego gniewu poniesie karę, a jeśli go uwolnisz, znowu będziesz musiał to zrobić."
  tags: []
"Prz19,20":
  text: "Posłuchaj rady i przyjmij pouczenie, abyś był mądry u kresu swych dni."
  tags: []
"Prz19,21":
  text: "Wiele jest zamysłów w sercu człowieka, ale rada PANA się ostoi."
  tags: []
"Prz19,22":
  text: "Pragnienie człowieka to jego dobroczynność i lepszy jest ubogi niż kłamca."
  tags: []
"Prz19,23":
  text: "Bojaźń PANA prowadzi do życia, a kto ją ma, spocznie syty i nie nawiedzi go zło."
  tags: []
"Prz19,24":
  text: "Leniwy kryje swą rękę pod pachę i do ust jej nie podnosi."
  tags: []
"Prz19,25":
  text: "Uderz szydercę, a prosty będzie roztropniejszy; strofuj rozumnego, a pojmie wiedzę."
  tags: []
"Prz19,26":
  text: "Kto trwoni dobra ojca i wypędza matkę, ten jest synem, który przynosi wstyd i hańbę."
  tags: []
"Prz19,27":
  text: "Synu mój, przestań słuchać pouczeń, które cię odwodzą od słów rozumnych."
  tags: []
"Prz19,28":
  text: "Nikczemny świadek naśmiewa się z sądu, a usta niegodziwych pożerają nieprawość."
  tags: []
"Prz19,29":
  text: "Sądy są przygotowane dla szyderców, a razy na grzbiet głupców."
  tags: []
