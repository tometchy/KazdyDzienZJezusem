"Prz5,1":
  text: "Synu mój, zważaj na moją mądrość i nakłoń twego ucha ku mojemu rozumowi;"
  tags: []
"Prz5,2":
  text: "Abyś zachował rozwagę i aby twoje wargi strzegły wiedzy."
  tags: []
"Prz5,3":
  text: "Bo wargi obcej kobiety ociekają miodem, a jej usta gładsze są niż oliwa;"
  tags: []
"Prz5,4":
  text: "Lecz jej koniec jest gorzki jak piołun, ostry jak miecz obosieczny."
  tags: []
"Prz5,5":
  text: "Jej nogi zstępują do śmierci, jej kroki prowadzą do piekła."
  tags: []
"Prz5,6":
  text: "Abyś nie rozważał ścieżki życia, jej drogi są tak niestałe, że nie poznasz ich."
  tags: []
"Prz5,7":
  text: "Teraz więc, synowie, słuchajcie mnie i nie odstępujcie od słów moich ust."
  tags: []
"Prz5,8":
  text: "Oddal od niej swą drogę i nie zbliżaj się do drzwi jej domu;"
  tags: []
"Prz5,9":
  text: "Abyś nie oddał obcym twojej sławy, a twoich lat okrutnikowi;"
  tags: []
"Prz5,10":
  text: "Aby obcy nie nasycili się twoim dobytkiem, a twój dorobek nie został w cudzym domu;"
  tags: []
"Prz5,11":
  text: "I abyś nie jęczał u kresu swych dni, gdy twoja skóra i ciało będą zniszczone;"
  tags: []
"Prz5,12":
  text: "I nie musiał powiedzieć: O, jakże nienawidziłem karności i moje serce gardziło upomnieniem!"
  tags: []
"Prz5,13":
  text: "Nie słuchałem głosu moich wychowawców i nie nakłaniałem ucha ku tym, którzy mnie nauczali!"
  tags: []
"Prz5,14":
  text: "O mało co nie wpadłem we wszelkie nieszczęście wśród zebrania i zgromadzenia."
  tags: []
"Prz5,15":
  text: "Pij wodę z własnego zdroju i wody płynące z twojego źródła!"
  tags: []
"Prz5,16":
  text: "Niech rozproszą się twoje źródła, a po ulicach strumienie wód."
  tags: []
"Prz5,17":
  text: "Niech należą tylko do ciebie, a nie do obcych wraz z tobą."
  tags: []
"Prz5,18":
  text: "Niech twój zdrój będzie błogosławiony i ciesz się żoną twojej młodości."
  tags: []
"Prz5,19":
  text: "Niech będzie jak wdzięczna łania i rozkoszna sarna; niech jej piersi zawsze cię nasycają, nieustannie zachwycaj się jej miłością."
  tags: []
"Prz5,20":
  text: "Dlaczego, synu mój, masz zachwycać się obcą kobietą i obejmować piersi cudzej?"
  tags: []
"Prz5,21":
  text: "Gdyż drogi człowieka są przed oczami PANA i waży on wszystkie jego ścieżki."
  tags: []
"Prz5,22":
  text: "Niegodziwego schwytają jego własne nieprawości i uwikła się w powrozy swego grzechu."
  tags: []
"Prz5,23":
  text: "Umrze z braku karności i będzie błądził z powodu swojej wielkiej głupoty."
  tags: []
