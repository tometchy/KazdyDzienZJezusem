"Prz21,1": "Serce króla jest w ręku PANA jak potoki wód; kieruje je, dokąd chce."
"Prz21,2": "Wszelka droga człowieka jest słuszna w jego oczach, ale PAN waży serca."
"Prz21,3": "Czynienie sprawiedliwości i sądu bardziej się podobają PANU niż ofiara."
"Prz21,4": "Wyniosłe oczy, pyszne serce i praca niegodziwych są grzechem."
"Prz21,5": "Myśli pracowitego przynoszą pewny dostatek, a myśli każdego spieszącego się – niedostatek."
"Prz21,6": "Gromadzenie skarbów kłamliwym językiem jest przemijającą marnością tych, którzy szukają śmierci."
"Prz21,7": "Grabież niegodziwych zniszczy ich, bo nie chcą czynić tego, co sprawiedliwe."
"Prz21,8": "Droga człowieka jest przewrotna i obca, ale dzieło czystego jest prawe."
"Prz21,9": "Lepiej mieszkać w kącie dachu niż z kłótliwą żoną w przestronnym domu."
"Prz21,10": "Dusza niegodziwego pragnie zła, a jego bliźni nie znajduje łaski w jego oczach."
"Prz21,11": "Gdy się karze szydercę, prosty mądrzeje, a gdy uczą mądrego, przyjmuje wiedzę."
"Prz21,12": "Sprawiedliwy zważa na dom niegodziwego, ale Bóg powala niegodziwych za ich nieprawość."
"Prz21,13": "Kto zatyka swe ucho na wołanie ubogiego, ten sam będzie wołał, a nie zostanie wysłuchany."
"Prz21,14": "Potajemny dar łagodzi zapalczywość i upominek w zanadrzu uspokaja wielki gniew."
"Prz21,15": "Radością jest dla sprawiedliwego czynić sąd, a na czyniących nieprawość przyjdzie zniszczenie."
"Prz21,16": "Człowiek, który zbacza z drogi mądrości, odpocznie w zgromadzeniu umarłych."
"Prz21,17": "Kto kocha zabawę, zubożeje, a kto kocha wino i olejek, nie wzbogaci się."
"Prz21,18": "Niegodziwy będzie okupem za sprawiedliwego, a przewrotny – za prawych."
"Prz21,19": "Lepiej mieszkać na pustyni niż z kłótliwą i gniewliwą żoną."
"Prz21,20": "Pożądany skarb i olej są w mieszkaniu mądrego, ale głupiec je trwoni."
"Prz21,21": "Kto podąża za sprawiedliwością i miłosierdziem, znajduje życie, sprawiedliwość i chwałę."
"Prz21,22": "Mądry wdziera się do miasta mocarzy i burzy potęgę ich ufności."
"Prz21,23": "Kto strzeże swoich ust i języka, strzeże swojej duszy przed utrapieniem."
"Prz21,24": "Hardy i pyszny szyderca – oto imię tego, kto działa w pysznym gniewie."
"Prz21,25": "Pragnienie leniwego zabija go, bo jego ręce nie chcą pracować."
"Prz21,26": "Przez cały dzień pożąda on zachłannie, a sprawiedliwy daje i nie szczędzi."
"Prz21,27": "Ofiara niegodziwych budzi odrazę, a cóż dopiero, gdy ją w niegodziwości ofiarują."
"Prz21,28": "Fałszywy świadek zginie, lecz kto słucha, będzie mówił nieustannie."
"Prz21,29": "Niegodziwy ma upór na twarzy, ale prawy wytycza swoją drogę."
"Prz21,30": "Nie ma mądrości ani rozumu, ani rady przeciwko PANU."
"Prz21,31": "Konia przygotowują na dzień bitwy, ale wybawienie zależy od PANA."
