"Prz21,1":
  text: "Serce króla jest w ręku PANA jak potoki wód; kieruje je, dokąd chce."
  tags: []
"Prz21,2":
  text: "Wszelka droga człowieka jest słuszna w jego oczach, ale PAN waży serca."
  tags: []
"Prz21,3":
  text: "Czynienie sprawiedliwości i sądu bardziej się podobają PANU niż ofiara."
  tags: []
"Prz21,4":
  text: "Wyniosłe oczy, pyszne serce i praca niegodziwych są grzechem."
  tags: []
"Prz21,5":
  text: "Myśli pracowitego przynoszą pewny dostatek, a myśli każdego spieszącego się – niedostatek."
  tags: []
"Prz21,6":
  text: "Gromadzenie skarbów kłamliwym językiem jest przemijającą marnością tych, którzy szukają śmierci."
  tags: []
"Prz21,7":
  text: "Grabież niegodziwych zniszczy ich, bo nie chcą czynić tego, co sprawiedliwe."
  tags: []
"Prz21,8":
  text: "Droga człowieka jest przewrotna i obca, ale dzieło czystego jest prawe."
  tags: []
"Prz21,9":
  text: "Lepiej mieszkać w kącie dachu niż z kłótliwą żoną w przestronnym domu."
  tags: []
"Prz21,10":
  text: "Dusza niegodziwego pragnie zła, a jego bliźni nie znajduje łaski w jego oczach."
  tags: []
"Prz21,11":
  text: "Gdy się karze szydercę, prosty mądrzeje, a gdy uczą mądrego, przyjmuje wiedzę."
  tags: []
"Prz21,12":
  text: "Sprawiedliwy zważa na dom niegodziwego, ale Bóg powala niegodziwych za ich nieprawość."
  tags: []
"Prz21,13":
  text: "Kto zatyka swe ucho na wołanie ubogiego, ten sam będzie wołał, a nie zostanie wysłuchany."
  tags: []
"Prz21,14":
  text: "Potajemny dar łagodzi zapalczywość i upominek w zanadrzu uspokaja wielki gniew."
  tags: []
"Prz21,15":
  text: "Radością jest dla sprawiedliwego czynić sąd, a na czyniących nieprawość przyjdzie zniszczenie."
  tags: []
"Prz21,16":
  text: "Człowiek, który zbacza z drogi mądrości, odpocznie w zgromadzeniu umarłych."
  tags: []
"Prz21,17":
  text: "Kto kocha zabawę, zubożeje, a kto kocha wino i olejek, nie wzbogaci się."
  tags: []
"Prz21,18":
  text: "Niegodziwy będzie okupem za sprawiedliwego, a przewrotny – za prawych."
  tags: []
"Prz21,19":
  text: "Lepiej mieszkać na pustyni niż z kłótliwą i gniewliwą żoną."
  tags: []
"Prz21,20":
  text: "Pożądany skarb i olej są w mieszkaniu mądrego, ale głupiec je trwoni."
  tags: []
"Prz21,21":
  text: "Kto podąża za sprawiedliwością i miłosierdziem, znajduje życie, sprawiedliwość i chwałę."
  tags: []
"Prz21,22":
  text: "Mądry wdziera się do miasta mocarzy i burzy potęgę ich ufności."
  tags: []
"Prz21,23":
  text: "Kto strzeże swoich ust i języka, strzeże swojej duszy przed utrapieniem."
  tags: []
"Prz21,24":
  text: "Hardy i pyszny szyderca – oto imię tego, kto działa w pysznym gniewie."
  tags: []
"Prz21,25":
  text: "Pragnienie leniwego zabija go, bo jego ręce nie chcą pracować."
  tags: []
"Prz21,26":
  text: "Przez cały dzień pożąda on zachłannie, a sprawiedliwy daje i nie szczędzi."
  tags: []
"Prz21,27":
  text: "Ofiara niegodziwych budzi odrazę, a cóż dopiero, gdy ją w niegodziwości ofiarują."
  tags: []
"Prz21,28":
  text: "Fałszywy świadek zginie, lecz kto słucha, będzie mówił nieustannie."
  tags: []
"Prz21,29":
  text: "Niegodziwy ma upór na twarzy, ale prawy wytycza swoją drogę."
  tags: []
"Prz21,30":
  text: "Nie ma mądrości ani rozumu, ani rady przeciwko PANU."
  tags: []
"Prz21,31":
  text: "Konia przygotowują na dzień bitwy, ale wybawienie zależy od PANA."
  tags: []
