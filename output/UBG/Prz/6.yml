"Prz6,1": "Synu mój, jeśli poręczyłeś za swego bliźniego i dałeś porękę za obcego;"
"Prz6,2": "Związałeś się słowami ust twoich, schwytany jesteś mową twoich ust."
"Prz6,3": "Uczyń więc tak, synu mój, uwolnij się, gdy wpadłeś w ręce swego bliźniego; idź, upokórz się i nalegaj na twego bliźniego."
"Prz6,4": "Nie daj snu swoim oczom i nie pozwól powiekom drzemać."
"Prz6,5": "Uwolnij się jak sarna z rąk myśliwego i jak ptak z ręki ptasznika."
"Prz6,6": "Idź do mrówki, leniwcze, przypatrz się jej drogom i bądź mądry;"
"Prz6,7": "Chociaż nie ma ona wodza ani przełożonego, ani pana;"
"Prz6,8": "To w lecie przygotowuje swój pokarm i gromadzi w żniwa swą żywność."
"Prz6,9": "Jak długo będziesz leżał, leniwcze? Kiedy wstaniesz ze swego snu?"
"Prz6,10": "Jeszcze trochę snu, trochę drzemania, trochę założenia rąk, aby zasnąć;"
"Prz6,11": "A twoje ubóstwo przyjdzie jak podróżny i twój niedostatek jak mąż uzbrojony."
"Prz6,12": "Człowiek nikczemny i niegodziwy chodzi z przewrotnością na ustach;"
"Prz6,13": "Mruga swymi oczyma, mówi swymi nogami, wskazuje swymi palcami;"
"Prz6,14": "Przewrotność jest w jego sercu, stale knuje zło i sieje niezgodę."
"Prz6,15": "Dlatego nagle spadnie na niego nieszczęście; nagle zostanie złamany i pozbawiony ratunku."
"Prz6,16": "Jest sześć rzeczy, których nienawidzi PAN, siedem budzi w nim odrazę:"
"Prz6,17": "Wyniosłe oczy, kłamliwy język i ręce, które przelewają krew niewinną;"
"Prz6,18": "Serce, które knuje złe myśli; nogi, które spiesznie biegną do zła;"
"Prz6,19": "Fałszywy świadek, który mówi kłamstwa, i ten, który sieje niezgodę między braćmi."
"Prz6,20": "Synu mój, strzeż przykazania twego ojca i nie odrzucaj prawa twojej matki."
"Prz6,21": "Przywiąż je na zawsze do serca twego i zawieś je sobie na szyi."
"Prz6,22": "Gdy będziesz chodził, poprowadzi cię; gdy zaśniesz, strzec cię będzie, a gdy się obudzisz, będzie mówić do ciebie;"
"Prz6,23": "Bo przykazanie jest pochodnią, prawo światłością, a upomnienia do karności są drogą życia;"
"Prz6,24": "Aby cię strzegły przed złą kobietą i przed gładkim językiem obcej kobiety."
"Prz6,25": "Nie pożądaj w twoim sercu jej piękności i niech cię nie łowi swymi powiekami."
"Prz6,26": "Bo dla kobiety nierządnej zubożeje człowiek o kawałek chleba, a żona cudzołożna czyha na cenne życie."
"Prz6,27": "Czy może ktoś wziąć ogień w zanadrze, a jego szaty się nie spalą?"
"Prz6,28": "Czy może ktoś chodzić po rozżarzonych węglach, a jego nogi się nie poparzą?"
"Prz6,29": "Tak ten, kto wchodzi do żony swego bliźniego; ktokolwiek ją dotknie, nie będzie bez winy."
"Prz6,30": "Nie pogardza się złodziejem, jeśli kradnie, by nasycić swoją duszę, będąc głodnym;"
"Prz6,31": "Ale jeśli go złapią, zwróci siedmiokrotnie albo odda cały dobytek swego domu."
"Prz6,32": "Lecz kto cudzołoży z kobietą, jest pozbawiony rozsądku; kto tak robi, gubi swoją duszę."
"Prz6,33": "Znajdzie chłostę i wstyd, a jego hańba nie będzie zmazana."
"Prz6,34": "Bo zazdrość rozpala gniew mężczyzny i nie będzie pobłażał w dniu zemsty."
"Prz6,35": "Nie będzie miał względu na żaden okup i nie przyjmie darów, choćbyś najwięcej mu dawał."
