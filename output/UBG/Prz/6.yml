"Prz6,1":
  text: "Synu mój, jeśli poręczyłeś za swego bliźniego i dałeś porękę za obcego;"
  tags: []
"Prz6,2":
  text: "Związałeś się słowami ust twoich, schwytany jesteś mową twoich ust."
  tags: []
"Prz6,3":
  text: "Uczyń więc tak, synu mój, uwolnij się, gdy wpadłeś w ręce swego bliźniego; idź, upokórz się i nalegaj na twego bliźniego."
  tags: []
"Prz6,4":
  text: "Nie daj snu swoim oczom i nie pozwól powiekom drzemać."
  tags: []
"Prz6,5":
  text: "Uwolnij się jak sarna z rąk myśliwego i jak ptak z ręki ptasznika."
  tags: []
"Prz6,6":
  text: "Idź do mrówki, leniwcze, przypatrz się jej drogom i bądź mądry;"
  tags: []
"Prz6,7":
  text: "Chociaż nie ma ona wodza ani przełożonego, ani pana;"
  tags: []
"Prz6,8":
  text: "To w lecie przygotowuje swój pokarm i gromadzi w żniwa swą żywność."
  tags: []
"Prz6,9":
  text: "Jak długo będziesz leżał, leniwcze? Kiedy wstaniesz ze swego snu?"
  tags: []
"Prz6,10":
  text: "Jeszcze trochę snu, trochę drzemania, trochę założenia rąk, aby zasnąć;"
  tags: []
"Prz6,11":
  text: "A twoje ubóstwo przyjdzie jak podróżny i twój niedostatek jak mąż uzbrojony."
  tags: []
"Prz6,12":
  text: "Człowiek nikczemny i niegodziwy chodzi z przewrotnością na ustach;"
  tags: []
"Prz6,13":
  text: "Mruga swymi oczyma, mówi swymi nogami, wskazuje swymi palcami;"
  tags: []
"Prz6,14":
  text: "Przewrotność jest w jego sercu, stale knuje zło i sieje niezgodę."
  tags: []
"Prz6,15":
  text: "Dlatego nagle spadnie na niego nieszczęście; nagle zostanie złamany i pozbawiony ratunku."
  tags: []
"Prz6,16":
  text: "Jest sześć rzeczy, których nienawidzi PAN, siedem budzi w nim odrazę:"
  tags: []
"Prz6,17":
  text: "Wyniosłe oczy, kłamliwy język i ręce, które przelewają krew niewinną;"
  tags: []
"Prz6,18":
  text: "Serce, które knuje złe myśli; nogi, które spiesznie biegną do zła;"
  tags: []
"Prz6,19":
  text: "Fałszywy świadek, który mówi kłamstwa, i ten, który sieje niezgodę między braćmi."
  tags: []
"Prz6,20":
  text: "Synu mój, strzeż przykazania twego ojca i nie odrzucaj prawa twojej matki."
  tags: []
"Prz6,21":
  text: "Przywiąż je na zawsze do serca twego i zawieś je sobie na szyi."
  tags: []
"Prz6,22":
  text: "Gdy będziesz chodził, poprowadzi cię; gdy zaśniesz, strzec cię będzie, a gdy się obudzisz, będzie mówić do ciebie;"
  tags: []
"Prz6,23":
  text: "Bo przykazanie jest pochodnią, prawo światłością, a upomnienia do karności są drogą życia;"
  tags: []
"Prz6,24":
  text: "Aby cię strzegły przed złą kobietą i przed gładkim językiem obcej kobiety."
  tags: []
"Prz6,25":
  text: "Nie pożądaj w twoim sercu jej piękności i niech cię nie łowi swymi powiekami."
  tags: []
"Prz6,26":
  text: "Bo dla kobiety nierządnej zubożeje człowiek o kawałek chleba, a żona cudzołożna czyha na cenne życie."
  tags: []
"Prz6,27":
  text: "Czy może ktoś wziąć ogień w zanadrze, a jego szaty się nie spalą?"
  tags: []
"Prz6,28":
  text: "Czy może ktoś chodzić po rozżarzonych węglach, a jego nogi się nie poparzą?"
  tags: []
"Prz6,29":
  text: "Tak ten, kto wchodzi do żony swego bliźniego; ktokolwiek ją dotknie, nie będzie bez winy."
  tags: []
"Prz6,30":
  text: "Nie pogardza się złodziejem, jeśli kradnie, by nasycić swoją duszę, będąc głodnym;"
  tags: []
"Prz6,31":
  text: "Ale jeśli go złapią, zwróci siedmiokrotnie albo odda cały dobytek swego domu."
  tags: []
"Prz6,32":
  text: "Lecz kto cudzołoży z kobietą, jest pozbawiony rozsądku; kto tak robi, gubi swoją duszę."
  tags: []
"Prz6,33":
  text: "Znajdzie chłostę i wstyd, a jego hańba nie będzie zmazana."
  tags: []
"Prz6,34":
  text: "Bo zazdrość rozpala gniew mężczyzny i nie będzie pobłażał w dniu zemsty."
  tags: []
"Prz6,35":
  text: "Nie będzie miał względu na żaden okup i nie przyjmie darów, choćbyś najwięcej mu dawał."
  tags: []
