"Prz16,1": "W człowieku są zamysły serca, ale odpowiedź języka jest od PANA."
"Prz16,2": "Wszystkie drogi człowieka są czyste w jego oczach, ale PAN waży duchy."
"Prz16,3": "Powierz PANU swe dzieła, a twoje zamysły będą utwierdzone."
"Prz16,4": "PAN uczynił wszystko dla samego siebie, nawet niegodziwego na dzień zła."
"Prz16,5": "Każdy, który jest wyniosłego serca, budzi odrazę w PANU; choć weźmie innych do pomocy, nie uniknie kary."
"Prz16,6": "Dzięki miłosierdziu i prawdzie oczyszcza się nieprawość, a w bojaźni PANA oddalamy się od zła."
"Prz16,7": "Gdy drogi człowieka podobają się PANU, to godzi z nim nawet jego nieprzyjaciół."
"Prz16,8": "Lepiej mieć mało ze sprawiedliwością niż wiele dochodów nieprawnych."
"Prz16,9": "Serce człowieka obmyśla swe drogi, ale PAN kieruje jego krokami."
"Prz16,10": "Wyrok Boży jest na wargach króla; jego usta nie błądzą w sądzie."
"Prz16,11": "Sprawiedliwa waga i szale należą do PANA i wszystkie odważniki w worku są jego dziełem."
"Prz16,12": "Popełnienie niegodziwości budzi odrazę w królach, bo sprawiedliwością tron jest umocniony."
"Prz16,13": "Wargi sprawiedliwe są rozkoszą królów, kochają oni tego, który mówi to, co słuszne."
"Prz16,14": "Gniew króla jest posłańcem śmierci, ale mądry człowiek przebłaga go."
"Prz16,15": "W jasności twarzy króla jest życie, a jego przychylność jest jak obłok z późnym deszczem."
"Prz16,16": "O wiele lepiej jest nabyć mądrość niż złoto; a nabyć rozum lepiej niż srebro."
"Prz16,17": "Droga prawych to odstąpić od zła; kto strzeże swojej drogi, strzeże swej duszy."
"Prz16,18": "Pycha poprzedza zgubę, a wyniosły duch – upadek."
"Prz16,19": "Lepiej być uniżonego ducha z pokornymi, niż dzielić łup z pysznymi."
"Prz16,20": "Kto zważa na słowo, znajdzie dobro, a kto ufa PANU, jest błogosławiony."
"Prz16,21": "Kto jest mądrego serca, zwie się rozumnym, a słodycz warg pomnaża wiedzę."
"Prz16,22": "Rozum jest zdrojem życia dla tych, którzy go mają, a pouczenie głupich jest głupotą."
"Prz16,23": "Serce mądrego czyni jego usta roztropnymi i dodaje nauki jego wargom."
"Prz16,24": "Miłe słowa są jak plaster miodu, słodycz dla duszy i lekarstwo dla kości."
"Prz16,25": "Jest droga, która wydaje się człowiekowi słuszna, ale jej końcem jest droga do śmierci."
"Prz16,26": "Robotnik pracuje dla siebie, bo usta pobudzają go do tego."
"Prz16,27": "Człowiek nikczemny wykopuje zło, a na jego wargach jakby ogień płonący."
"Prz16,28": "Człowiek przewrotny rozsiewa spory, a plotkarz rozdziela przyjaciół."
"Prz16,29": "Człowiek gwałtowny zwabia swego bliźniego i wprowadza go na drogę niedobrą."
"Prz16,30": "Mruga swymi oczami, by knuć podstępy; rusza wargami i popełnia zło."
"Prz16,31": "Siwa głowa jest koroną chwały, zdobywa się ją na drodze sprawiedliwości."
"Prz16,32": "Lepszy jest nieskory do gniewu niż mocarz, a kto panuje nad swym duchem, jest lepszy niż ten, kto zdobywa miasto."
"Prz16,33": "Losy wrzuca się w zanadrze, ale całe rozstrzygnięcie ich zależy od PANA."
