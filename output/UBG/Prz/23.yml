"Prz23,1":
  text: "Gdy usiądziesz do posiłku z władcą, zważaj pilnie, co jest przed tobą;"
  tags: []
"Prz23,2":
  text: "I przyłóż nóż do gardła, jeśli jesteś łakomy."
  tags: []
"Prz23,3":
  text: "Nie pragnij jego przysmaków, bo to pokarm zwodniczy."
  tags: []
"Prz23,4":
  text: "Nie zabiegaj o bogactwo, porzuć swoją mądrość."
  tags: []
"Prz23,5":
  text: "Czy obrócisz swoje oczy na to, co jest niczym? Bo bogactwa robią sobie skrzydła i ulatują do nieba jak orzeł."
  tags: []
"Prz23,6":
  text: "Nie jedz chleba człowieka, który ma złe oko, ani nie pożądaj jego przysmaków."
  tags: []
"Prz23,7":
  text: "Bo jak myśli w swym sercu, taki on jest. Jedz i pij – mówi do ciebie, ale jego serce nie jest z tobą."
  tags: []
"Prz23,8":
  text: "Kęs, który zjadłeś, zwrócisz i utracisz swoje wdzięczne słowa."
  tags: []
"Prz23,9":
  text: "Nie mów do uszu głupca, bo wzgardzi mądrością twoich słów."
  tags: []
"Prz23,10":
  text: "Nie przesuwaj dawnej granicy i nie wchodź na pole sierot."
  tags: []
"Prz23,11":
  text: "Bo ich obrońca jest mocny, przeprowadzi ich sprawę przeciwko tobie."
  tags: []
"Prz23,12":
  text: "Nakłoń swoje serce na pouczenie, a swe uszy na słowa rozumne."
  tags: []
"Prz23,13":
  text: "Nie szczędź dziecku karcenia, bo jeśli je bijesz rózgą, nie umrze."
  tags: []
"Prz23,14":
  text: "Będziesz je bił rózgą, a jego duszę ocalisz od piekła."
  tags: []
"Prz23,15":
  text: "Synu mój, jeśli twoje serce będzie mądre, moje serce będzie się radowało, właśnie moje;"
  tags: []
"Prz23,16":
  text: "I moje nerki będą się weselić, gdy twoje usta będą mówiły to, co jest prawe."
  tags: []
"Prz23,17":
  text: "Niech twoje serce nie zazdrości grzesznikom, lecz każdego dnia postępuj w bojaźni PANA;"
  tags: []
"Prz23,18":
  text: "Bo koniec jest pewny i twoja nadzieja nie będzie zawiedziona."
  tags: []
"Prz23,19":
  text: "Słuchaj, synu mój, i bądź mądry, i skieruj swoje serce na drogę."
  tags: []
"Prz23,20":
  text: "Nie bywaj wśród pijaków ani wśród obżerających się mięsem;"
  tags: []
"Prz23,21":
  text: "Bo pijak i żarłok zubożeją, a ospały będzie chodził w łachmanach."
  tags: []
"Prz23,22":
  text: "Słuchaj ojca, który cię spłodził, a nie gardź matką, gdy się zestarzeje."
  tags: []
"Prz23,23":
  text: "Kupuj prawdę i nie sprzedawaj jej; kupuj mądrość, karność i rozum."
  tags: []
"Prz23,24":
  text: "Ojciec sprawiedliwego będzie się wielce radował, a kto spłodzi mądrego, będzie się z niego cieszył."
  tags: []
"Prz23,25":
  text: "Niech się weseli twój ojciec i matka i niech się raduje ta, która cię rodziła."
  tags: []
"Prz23,26":
  text: "Synu mój, daj mi swoje serce, a niech twoje oczy strzegą moich dróg."
  tags: []
"Prz23,27":
  text: "Bo nierządnica jest głębokim dołem, a cudza kobieta jest ciasną studnią."
  tags: []
"Prz23,28":
  text: "Ona też czyha jak zbój i pomnaża przewrotnych wśród ludzi."
  tags: []
"Prz23,29":
  text: "U kogo biada? U kogo żal? U kogo kłótnie? U kogo szemranie? Kto ma rany bez powodu? Kto ma zaczerwienione oczy?"
  tags: []
"Prz23,30":
  text: "Ci, którzy przesiadują przy winie; ci, którzy idą szukać zmieszanego wina."
  tags: []
"Prz23,31":
  text: "Nie patrz na wino, gdy się czerwieni; gdy wydaje łunę swą w kielichu, a samo się przesuwa."
  tags: []
"Prz23,32":
  text: "Na koniec ugryzie jak wąż i ukąsi jak żmija;"
  tags: []
"Prz23,33":
  text: "Twoje oczy będą patrzeć na cudze kobiety, a twoje serce będzie mówiło rzeczy przewrotne;"
  tags: []
"Prz23,34":
  text: "I będziesz jak ten, który leży na środku morza, i jak ten, który śpi na szczycie masztu;"
  tags: []
"Prz23,35":
  text: "Powiesz: Bili mnie, a nie bolało, uderzyli mnie, a nic nie czułem. Gdy się obudzę, znów go poszukam."
  tags: []
