"Prz23,1": "Gdy usiądziesz do posiłku z władcą, zważaj pilnie, co jest przed tobą;"
"Prz23,2": "I przyłóż nóż do gardła, jeśli jesteś łakomy."
"Prz23,3": "Nie pragnij jego przysmaków, bo to pokarm zwodniczy."
"Prz23,4": "Nie zabiegaj o bogactwo, porzuć swoją mądrość."
"Prz23,5": "Czy obrócisz swoje oczy na to, co jest niczym? Bo bogactwa robią sobie skrzydła i ulatują do nieba jak orzeł."
"Prz23,6": "Nie jedz chleba człowieka, który ma złe oko, ani nie pożądaj jego przysmaków."
"Prz23,7": "Bo jak myśli w swym sercu, taki on jest. Jedz i pij – mówi do ciebie, ale jego serce nie jest z tobą."
"Prz23,8": "Kęs, który zjadłeś, zwrócisz i utracisz swoje wdzięczne słowa."
"Prz23,9": "Nie mów do uszu głupca, bo wzgardzi mądrością twoich słów."
"Prz23,10": "Nie przesuwaj dawnej granicy i nie wchodź na pole sierot."
"Prz23,11": "Bo ich obrońca jest mocny, przeprowadzi ich sprawę przeciwko tobie."
"Prz23,12": "Nakłoń swoje serce na pouczenie, a swe uszy na słowa rozumne."
"Prz23,13": "Nie szczędź dziecku karcenia, bo jeśli je bijesz rózgą, nie umrze."
"Prz23,14": "Będziesz je bił rózgą, a jego duszę ocalisz od piekła."
"Prz23,15": "Synu mój, jeśli twoje serce będzie mądre, moje serce będzie się radowało, właśnie moje;"
"Prz23,16": "I moje nerki będą się weselić, gdy twoje usta będą mówiły to, co jest prawe."
"Prz23,17": "Niech twoje serce nie zazdrości grzesznikom, lecz każdego dnia postępuj w bojaźni PANA;"
"Prz23,18": "Bo koniec jest pewny i twoja nadzieja nie będzie zawiedziona."
"Prz23,19": "Słuchaj, synu mój, i bądź mądry, i skieruj swoje serce na drogę."
"Prz23,20": "Nie bywaj wśród pijaków ani wśród obżerających się mięsem;"
"Prz23,21": "Bo pijak i żarłok zubożeją, a ospały będzie chodził w łachmanach."
"Prz23,22": "Słuchaj ojca, który cię spłodził, a nie gardź matką, gdy się zestarzeje."
"Prz23,23": "Kupuj prawdę i nie sprzedawaj jej; kupuj mądrość, karność i rozum."
"Prz23,24": "Ojciec sprawiedliwego będzie się wielce radował, a kto spłodzi mądrego, będzie się z niego cieszył."
"Prz23,25": "Niech się weseli twój ojciec i matka i niech się raduje ta, która cię rodziła."
"Prz23,26": "Synu mój, daj mi swoje serce, a niech twoje oczy strzegą moich dróg."
"Prz23,27": "Bo nierządnica jest głębokim dołem, a cudza kobieta jest ciasną studnią."
"Prz23,28": "Ona też czyha jak zbój i pomnaża przewrotnych wśród ludzi."
"Prz23,29": "U kogo biada? U kogo żal? U kogo kłótnie? U kogo szemranie? Kto ma rany bez powodu? Kto ma zaczerwienione oczy?"
"Prz23,30": "Ci, którzy przesiadują przy winie; ci, którzy idą szukać zmieszanego wina."
"Prz23,31": "Nie patrz na wino, gdy się czerwieni; gdy wydaje łunę swą w kielichu, a samo się przesuwa."
"Prz23,32": "Na koniec ugryzie jak wąż i ukąsi jak żmija;"
"Prz23,33": "Twoje oczy będą patrzeć na cudze kobiety, a twoje serce będzie mówiło rzeczy przewrotne;"
"Prz23,34": "I będziesz jak ten, który leży na środku morza, i jak ten, który śpi na szczycie masztu;"
"Prz23,35": "Powiesz: Bili mnie, a nie bolało, uderzyli mnie, a nic nie czułem. Gdy się obudzę, znów go poszukam."
