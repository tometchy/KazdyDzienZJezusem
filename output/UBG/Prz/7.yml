"Prz7,1":
  text: "Synu mój, strzeż moich słów i przechowuj u siebie moje przykazania."
  tags: []
"Prz7,2":
  text: "Strzeż moich przykazań, a będziesz żył; strzeż mojego prawa jak źrenicy swych oczu."
  tags: []
"Prz7,3":
  text: "Przywiąż je do swoich palców, wypisz je na tablicy twego serca."
  tags: []
"Prz7,4":
  text: "Mów do mądrości: Jesteś moją siostrą, a roztropność nazywaj przyjaciółką;"
  tags: []
"Prz7,5":
  text: "Aby cię strzegły przed cudzą żoną i przed obcą, która mówi gładkie słowa."
  tags: []
"Prz7,6":
  text: "Bo z okna swego domu wyglądałem przez kratę;"
  tags: []
"Prz7,7":
  text: "I zobaczyłem wśród prostych, zauważyłem wśród chłopców nierozumnego młodzieńca;"
  tags: []
"Prz7,8":
  text: "Który przechodził ulicą blisko jej narożnika, idąc drogą do jej domu."
  tags: []
"Prz7,9":
  text: "O zmierzchu, pod wieczór, w ciemności nocnej i w mroku."
  tags: []
"Prz7,10":
  text: "A oto spotkała go kobieta w stroju nierządnicy, chytrego serca;"
  tags: []
"Prz7,11":
  text: "Wrzaskliwa i nieopanowana, której nogi nie mogą pozostać w domu:"
  tags: []
"Prz7,12":
  text: "Raz na dworze, raz na ulicach i czyha na każdym rogu."
  tags: []
"Prz7,13":
  text: "Chwyciła go i pocałowała, z bezczelną miną powiedziała do niego:"
  tags: []
"Prz7,14":
  text: "U mnie są ofiary pojednawcze; spełniłam dzisiaj swoje śluby."
  tags: []
"Prz7,15":
  text: "Dlatego wyszłam ci naprzeciw, szukałam pilnie twojej twarzy i znalazłam cię."
  tags: []
"Prz7,16":
  text: "Obiłam kobiercami swoje łoże, przystrojone rzeźbieniem i prześcieradłami z Egiptu."
  tags: []
"Prz7,17":
  text: "Skropiłam swoje posłanie mirrą, aloesem i cynamonem."
  tags: []
"Prz7,18":
  text: "Chodź, upójmy się miłością aż do rana, nacieszmy się miłością."
  tags: []
"Prz7,19":
  text: "Bo mojego męża nie ma w domu; pojechał w daleką drogę."
  tags: []
"Prz7,20":
  text: "Wziął ze sobą worek pieniędzy; umówionego dnia wróci do domu."
  tags: []
"Prz7,21":
  text: "Nakłoniła go mnóstwem swoich słów i zniewoliła go pochlebstwem swoich warg."
  tags: []
"Prz7,22":
  text: "Wnet poszedł za nią jak wół prowadzony na rzeź i jak głupi na karę pęt."
  tags: []
"Prz7,23":
  text: "Aż strzała przebije mu wątrobę; spieszy jak ptak w sidła, nie wiedząc, że chodzi o jego życie."
  tags: []
"Prz7,24":
  text: "Więc teraz słuchajcie mnie, synowie, i zważajcie na słowa moich ust."
  tags: []
"Prz7,25":
  text: "Niech twoje serce nie zbacza na jej drogi i nie tułaj się po jej ścieżkach."
  tags: []
"Prz7,26":
  text: "Bo wielu zranionych strąciła i wielu mocarzy pozabijała."
  tags: []
"Prz7,27":
  text: "Jej dom jest drogą do piekła, która wiedzie do komnat śmierci."
  tags: []
