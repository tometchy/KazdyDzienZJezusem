"Prz7,1": "Synu mój, strzeż moich słów i przechowuj u siebie moje przykazania."
"Prz7,2": "Strzeż moich przykazań, a będziesz żył; strzeż mojego prawa jak źrenicy swych oczu."
"Prz7,3": "Przywiąż je do swoich palców, wypisz je na tablicy twego serca."
"Prz7,4": "Mów do mądrości: Jesteś moją siostrą, a roztropność nazywaj przyjaciółką;"
"Prz7,5": "Aby cię strzegły przed cudzą żoną i przed obcą, która mówi gładkie słowa."
"Prz7,6": "Bo z okna swego domu wyglądałem przez kratę;"
"Prz7,7": "I zobaczyłem wśród prostych, zauważyłem wśród chłopców nierozumnego młodzieńca;"
"Prz7,8": "Który przechodził ulicą blisko jej narożnika, idąc drogą do jej domu."
"Prz7,9": "O zmierzchu, pod wieczór, w ciemności nocnej i w mroku."
"Prz7,10": "A oto spotkała go kobieta w stroju nierządnicy, chytrego serca;"
"Prz7,11": "Wrzaskliwa i nieopanowana, której nogi nie mogą pozostać w domu:"
"Prz7,12": "Raz na dworze, raz na ulicach i czyha na każdym rogu."
"Prz7,13": "Chwyciła go i pocałowała, z bezczelną miną powiedziała do niego:"
"Prz7,14": "U mnie są ofiary pojednawcze; spełniłam dzisiaj swoje śluby."
"Prz7,15": "Dlatego wyszłam ci naprzeciw, szukałam pilnie twojej twarzy i znalazłam cię."
"Prz7,16": "Obiłam kobiercami swoje łoże, przystrojone rzeźbieniem i prześcieradłami z Egiptu."
"Prz7,17": "Skropiłam swoje posłanie mirrą, aloesem i cynamonem."
"Prz7,18": "Chodź, upójmy się miłością aż do rana, nacieszmy się miłością."
"Prz7,19": "Bo mojego męża nie ma w domu; pojechał w daleką drogę."
"Prz7,20": "Wziął ze sobą worek pieniędzy; umówionego dnia wróci do domu."
"Prz7,21": "Nakłoniła go mnóstwem swoich słów i zniewoliła go pochlebstwem swoich warg."
"Prz7,22": "Wnet poszedł za nią jak wół prowadzony na rzeź i jak głupi na karę pęt."
"Prz7,23": "Aż strzała przebije mu wątrobę; spieszy jak ptak w sidła, nie wiedząc, że chodzi o jego życie."
"Prz7,24": "Więc teraz słuchajcie mnie, synowie, i zważajcie na słowa moich ust."
"Prz7,25": "Niech twoje serce nie zbacza na jej drogi i nie tułaj się po jej ścieżkach."
"Prz7,26": "Bo wielu zranionych strąciła i wielu mocarzy pozabijała."
"Prz7,27": "Jej dom jest drogą do piekła, która wiedzie do komnat śmierci."
