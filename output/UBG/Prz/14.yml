"Prz14,1":
  text: "Mądra kobieta buduje swój dom, a głupia burzy go własnymi rękami."
  tags: []
"Prz14,2":
  text: "Kto postępuje w sposób prawy, boi się PANA, a przewrotny na swoich drogach gardzi nim."
  tags: []
"Prz14,3":
  text: "W ustach głupiego jest rózga pychy, a mądrych strzegą ich wargi."
  tags: []
"Prz14,4":
  text: "Gdzie nie ma wołów, żłób jest pusty, lecz dzięki sile wołów mnoży się obfitość zboża."
  tags: []
"Prz14,5":
  text: "Wierny świadek nie kłamie, a fałszywy świadek mówi kłamstwa."
  tags: []
"Prz14,6":
  text: "Szyderca szuka mądrości, a nie znajduje, lecz rozumnemu wiedza przychodzi łatwo."
  tags: []
"Prz14,7":
  text: "Odsuń się od głupiego, gdyż nie znajdziesz u niego warg rozumnych."
  tags: []
"Prz14,8":
  text: "Mądrość roztropnego to poznanie swojej drogi, a głupotą głupich jest oszustwo."
  tags: []
"Prz14,9":
  text: "Głupcy szydzą z grzechu, a u prawych jest przychylność."
  tags: []
"Prz14,10":
  text: "Serce zna własną gorycz, a obcy nie wtrąca się w jego radość."
  tags: []
"Prz14,11":
  text: "Dom niegodziwych będzie zgładzony, a mieszkanie prawych zakwitnie."
  tags: []
"Prz14,12":
  text: "Jest droga, która człowiekowi wydaje się słuszna, lecz końcem jej jest droga do śmierci."
  tags: []
"Prz14,13":
  text: "Nawet w śmiechu serce boleje, a końcem takiej wesołości jest smutek."
  tags: []
"Prz14,14":
  text: "Serce odstępcy nasyci się jego drogami, a dobry człowiek – swoimi."
  tags: []
"Prz14,15":
  text: "Prosty wierzy każdemu słowu, a roztropny zważa na swoje kroki."
  tags: []
"Prz14,16":
  text: "Mądry boi się i odwraca się od zła, ale głupi w swym szaleństwie jest pewny siebie."
  tags: []
"Prz14,17":
  text: "Człowiek porywczy popełnia głupstwa, a podstępny jest znienawidzony."
  tags: []
"Prz14,18":
  text: "Prości ludzie dziedziczą głupotę, a roztropni są koronowani wiedzą."
  tags: []
"Prz14,19":
  text: "Źli kłaniają się przed dobrymi, a niegodziwi u bram sprawiedliwego."
  tags: []
"Prz14,20":
  text: "Ubogi jest znienawidzony nawet przez swego bliźniego, a bogaty ma wielu przyjaciół."
  tags: []
"Prz14,21":
  text: "Kto gardzi swym bliźnim, ten grzeszy, a kto lituje się nad ubogimi, jest błogosławiony."
  tags: []
"Prz14,22":
  text: "Czyż nie błądzą ci, którzy obmyślają zło? Ale miłosierdzie i prawda są z tymi, którzy obmyślają dobro."
  tags: []
"Prz14,23":
  text: "Każda praca przynosi pożytek, a puste słowa prowadzą do nędzy."
  tags: []
"Prz14,24":
  text: "Koroną mądrych jest ich bogactwo, ale głupota głupich pozostaje głupotą."
  tags: []
"Prz14,25":
  text: "Prawdomówny świadek ocala dusze, a fałszywy mówi kłamstwa."
  tags: []
"Prz14,26":
  text: "W bojaźni PANA jest mocne zaufanie, a jego synowie będą mieć ucieczkę."
  tags: []
"Prz14,27":
  text: "Bojaźń PANA jest źródłem życia, by uniknąć sideł śmierci."
  tags: []
"Prz14,28":
  text: "Liczny lud to chwała króla, a brak ludu to zguba władcy."
  tags: []
"Prz14,29":
  text: "Nieskory do gniewu jest bardzo roztropny, lecz porywczy wywyższa głupotę."
  tags: []
"Prz14,30":
  text: "Zdrowe serce jest życiem ciała, a zazdrość jest zgnilizną kości."
  tags: []
"Prz14,31":
  text: "Kto gnębi ubogiego, uwłacza jego Stwórcy, a czci go ten, kto lituje się nad ubogim."
  tags: []
"Prz14,32":
  text: "Niegodziwy zostaje wygnany z powodu swojego zła, a sprawiedliwy ma nadzieję nawet w czasie swojej śmierci."
  tags: []
"Prz14,33":
  text: "Mądrość spoczywa w sercu rozumnego, a co jest w sercu głupich, wychodzi na jaw."
  tags: []
"Prz14,34":
  text: "Sprawiedliwość wywyższa naród, a grzech jest hańbą narodów."
  tags: []
"Prz14,35":
  text: "Król jest przychylny dla roztropnego sługi, lecz gniewa się na tego, który przynosi hańbę."
  tags: []
