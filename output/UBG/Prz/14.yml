"Prz14,1": "Mądra kobieta buduje swój dom, a głupia burzy go własnymi rękami."
"Prz14,2": "Kto postępuje w sposób prawy, boi się PANA, a przewrotny na swoich drogach gardzi nim."
"Prz14,3": "W ustach głupiego jest rózga pychy, a mądrych strzegą ich wargi."
"Prz14,4": "Gdzie nie ma wołów, żłób jest pusty, lecz dzięki sile wołów mnoży się obfitość zboża."
"Prz14,5": "Wierny świadek nie kłamie, a fałszywy świadek mówi kłamstwa."
"Prz14,6": "Szyderca szuka mądrości, a nie znajduje, lecz rozumnemu wiedza przychodzi łatwo."
"Prz14,7": "Odsuń się od głupiego, gdyż nie znajdziesz u niego warg rozumnych."
"Prz14,8": "Mądrość roztropnego to poznanie swojej drogi, a głupotą głupich jest oszustwo."
"Prz14,9": "Głupcy szydzą z grzechu, a u prawych jest przychylność."
"Prz14,10": "Serce zna własną gorycz, a obcy nie wtrąca się w jego radość."
"Prz14,11": "Dom niegodziwych będzie zgładzony, a mieszkanie prawych zakwitnie."
"Prz14,12": "Jest droga, która człowiekowi wydaje się słuszna, lecz końcem jej jest droga do śmierci."
"Prz14,13": "Nawet w śmiechu serce boleje, a końcem takiej wesołości jest smutek."
"Prz14,14": "Serce odstępcy nasyci się jego drogami, a dobry człowiek – swoimi."
"Prz14,15": "Prosty wierzy każdemu słowu, a roztropny zważa na swoje kroki."
"Prz14,16": "Mądry boi się i odwraca się od zła, ale głupi w swym szaleństwie jest pewny siebie."
"Prz14,17": "Człowiek porywczy popełnia głupstwa, a podstępny jest znienawidzony."
"Prz14,18": "Prości ludzie dziedziczą głupotę, a roztropni są koronowani wiedzą."
"Prz14,19": "Źli kłaniają się przed dobrymi, a niegodziwi u bram sprawiedliwego."
"Prz14,20": "Ubogi jest znienawidzony nawet przez swego bliźniego, a bogaty ma wielu przyjaciół."
"Prz14,21": "Kto gardzi swym bliźnim, ten grzeszy, a kto lituje się nad ubogimi, jest błogosławiony."
"Prz14,22": "Czyż nie błądzą ci, którzy obmyślają zło? Ale miłosierdzie i prawda są z tymi, którzy obmyślają dobro."
"Prz14,23": "Każda praca przynosi pożytek, a puste słowa prowadzą do nędzy."
"Prz14,24": "Koroną mądrych jest ich bogactwo, ale głupota głupich pozostaje głupotą."
"Prz14,25": "Prawdomówny świadek ocala dusze, a fałszywy mówi kłamstwa."
"Prz14,26": "W bojaźni PANA jest mocne zaufanie, a jego synowie będą mieć ucieczkę."
"Prz14,27": "Bojaźń PANA jest źródłem życia, by uniknąć sideł śmierci."
"Prz14,28": "Liczny lud to chwała króla, a brak ludu to zguba władcy."
"Prz14,29": "Nieskory do gniewu jest bardzo roztropny, lecz porywczy wywyższa głupotę."
"Prz14,30": "Zdrowe serce jest życiem ciała, a zazdrość jest zgnilizną kości."
"Prz14,31": "Kto gnębi ubogiego, uwłacza jego Stwórcy, a czci go ten, kto lituje się nad ubogim."
"Prz14,32": "Niegodziwy zostaje wygnany z powodu swojego zła, a sprawiedliwy ma nadzieję nawet w czasie swojej śmierci."
"Prz14,33": "Mądrość spoczywa w sercu rozumnego, a co jest w sercu głupich, wychodzi na jaw."
"Prz14,34": "Sprawiedliwość wywyższa naród, a grzech jest hańbą narodów."
"Prz14,35": "Król jest przychylny dla roztropnego sługi, lecz gniewa się na tego, który przynosi hańbę."
