"Prz4,1": "Słuchajcie, synowie, pouczenia ojca i zważajcie na to, abyście poznali roztropność;"
"Prz4,2": "Bo daję wam dobrą naukę, nie porzucajcie mego prawa."
"Prz4,3": "Byłem bowiem synem mego ojca i miłym jedynakiem w oczach mojej matki."
"Prz4,4": "On mnie uczył, mówiąc mi: Niech twoje serce zachowa moje słowa; strzeż moich przykazań, a będziesz żył."
"Prz4,5": "Zdobywaj mądrość, zdobywaj roztropność; nie zapominaj i nie odstępuj od słów moich ust."
"Prz4,6": "Nie opuszczaj jej, a będzie cię strzegła; ukochaj ją, a zachowa cię."
"Prz4,7": "Podstawą wszystkiego jest mądrość; zdobywaj mądrość i za cały swój majątek zdobywaj roztropność."
"Prz4,8": "Wywyższaj ją, a ona wywyższy ciebie, rozsławi cię, gdy ją przyjmiesz."
"Prz4,9": "Wdzięczną ozdobę włoży ci na głowę, obdarzy cię koroną chwały."
"Prz4,10": "Słuchaj, synu mój, i przyjmij moje słowa, a pomnożą się lata twojego życia."
"Prz4,11": "Nauczyłem cię drogi mądrości, po ścieżkach prawości cię wiodłem;"
"Prz4,12": "Gdy nimi pójdziesz, twoje kroki nie będą skrępowane; a jeśli pobiegniesz, nie potkniesz się."
"Prz4,13": "Trzymaj się karności, nie opuszczaj jej, strzeż jej, bo ona jest twoim życiem."
"Prz4,14": "Nie chodź ścieżką niegodziwych i nie wchodź na drogę złych ludzi."
"Prz4,15": "Unikaj jej, nie chodź po niej; odwróć się od niej i omiń ją;"
"Prz4,16": "Bo oni nie zasną, dopóki nie zrobią czegoś złego; sen ich odleci, aż przywiodą kogoś do upadku;"
"Prz4,17": "Jedzą bowiem chleb nieprawości i piją wino przemocy."
"Prz4,18": "Ale ścieżka sprawiedliwych jest jak jasne światło, które świeci coraz jaśniej aż do dnia doskonałego."
"Prz4,19": "Droga niegodziwych jest jak ciemność; nie wiedzą, o co mogą się potknąć."
"Prz4,20": "Synu mój, zważaj na moje słowa; ku moim naukom nakłoń swe ucho."
"Prz4,21": "Niech nie schodzą ci z oczu, zachowaj je w głębi twego serca."
"Prz4,22": "Są bowiem życiem dla tych, którzy je znajdują, i lekarstwem dla całego ich ciała."
"Prz4,23": "Strzeż twego serca z całą pilnością, bo z niego tryska życie."
"Prz4,24": "Odsuń od siebie przewrotność ust, oddal od siebie złośliwe wargi."
"Prz4,25": "Niech twoje oczy patrzą na wprost, a twoje powieki niech będą zwrócone przed siebie."
"Prz4,26": "Uważaj na ścieżkę twoich nóg, aby wszystkie twoje drogi były pewne."
"Prz4,27": "Nie zbaczaj ani na prawo, ani na lewo; odwróć twoją nogę od zła."
