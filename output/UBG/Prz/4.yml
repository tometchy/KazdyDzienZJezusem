"Prz4,1":
  text: "Słuchajcie, synowie, pouczenia ojca i zważajcie na to, abyście poznali roztropność;"
  tags: []
"Prz4,2":
  text: "Bo daję wam dobrą naukę, nie porzucajcie mego prawa."
  tags: []
"Prz4,3":
  text: "Byłem bowiem synem mego ojca i miłym jedynakiem w oczach mojej matki."
  tags: []
"Prz4,4":
  text: "On mnie uczył, mówiąc mi: Niech twoje serce zachowa moje słowa; strzeż moich przykazań, a będziesz żył."
  tags: []
"Prz4,5":
  text: "Zdobywaj mądrość, zdobywaj roztropność; nie zapominaj i nie odstępuj od słów moich ust."
  tags: []
"Prz4,6":
  text: "Nie opuszczaj jej, a będzie cię strzegła; ukochaj ją, a zachowa cię."
  tags: []
"Prz4,7":
  text: "Podstawą wszystkiego jest mądrość; zdobywaj mądrość i za cały swój majątek zdobywaj roztropność."
  tags: []
"Prz4,8":
  text: "Wywyższaj ją, a ona wywyższy ciebie, rozsławi cię, gdy ją przyjmiesz."
  tags: []
"Prz4,9":
  text: "Wdzięczną ozdobę włoży ci na głowę, obdarzy cię koroną chwały."
  tags: []
"Prz4,10":
  text: "Słuchaj, synu mój, i przyjmij moje słowa, a pomnożą się lata twojego życia."
  tags: []
"Prz4,11":
  text: "Nauczyłem cię drogi mądrości, po ścieżkach prawości cię wiodłem;"
  tags: []
"Prz4,12":
  text: "Gdy nimi pójdziesz, twoje kroki nie będą skrępowane; a jeśli pobiegniesz, nie potkniesz się."
  tags: []
"Prz4,13":
  text: "Trzymaj się karności, nie opuszczaj jej, strzeż jej, bo ona jest twoim życiem."
  tags: []
"Prz4,14":
  text: "Nie chodź ścieżką niegodziwych i nie wchodź na drogę złych ludzi."
  tags: []
"Prz4,15":
  text: "Unikaj jej, nie chodź po niej; odwróć się od niej i omiń ją;"
  tags: []
"Prz4,16":
  text: "Bo oni nie zasną, dopóki nie zrobią czegoś złego; sen ich odleci, aż przywiodą kogoś do upadku;"
  tags: []
"Prz4,17":
  text: "Jedzą bowiem chleb nieprawości i piją wino przemocy."
  tags: []
"Prz4,18":
  text: "Ale ścieżka sprawiedliwych jest jak jasne światło, które świeci coraz jaśniej aż do dnia doskonałego."
  tags: []
"Prz4,19":
  text: "Droga niegodziwych jest jak ciemność; nie wiedzą, o co mogą się potknąć."
  tags: []
"Prz4,20":
  text: "Synu mój, zważaj na moje słowa; ku moim naukom nakłoń swe ucho."
  tags: []
"Prz4,21":
  text: "Niech nie schodzą ci z oczu, zachowaj je w głębi twego serca."
  tags: []
"Prz4,22":
  text: "Są bowiem życiem dla tych, którzy je znajdują, i lekarstwem dla całego ich ciała."
  tags: []
"Prz4,23":
  text: "Strzeż twego serca z całą pilnością, bo z niego tryska życie."
  tags: []
"Prz4,24":
  text: "Odsuń od siebie przewrotność ust, oddal od siebie złośliwe wargi."
  tags: []
"Prz4,25":
  text: "Niech twoje oczy patrzą na wprost, a twoje powieki niech będą zwrócone przed siebie."
  tags: []
"Prz4,26":
  text: "Uważaj na ścieżkę twoich nóg, aby wszystkie twoje drogi były pewne."
  tags: []
"Prz4,27":
  text: "Nie zbaczaj ani na prawo, ani na lewo; odwróć twoją nogę od zła."
  tags: []
