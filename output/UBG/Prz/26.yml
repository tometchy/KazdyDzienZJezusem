"Prz26,1": "Jak śnieg w lecie i jak deszcz we żniwa, tak głupiemu nie przystoi chwała."
"Prz26,2": "Jak ptak się tuła i jak jaskółka lata, tak nie przyjdzie niezasłużone przekleństwo."
"Prz26,3": "Bicz na konia, wędzidło na osła, a kij na grzbiet głupiego."
"Prz26,4": "Nie odpowiadaj głupiemu według jego głupoty, abyś i ty nie był do niego podobny."
"Prz26,5": "Odpowiedz głupiemu według jego głupoty, aby nie był mądry we własnych oczach."
"Prz26,6": "Kto powierza głupiemu posłannictwo, odcina sobie nogi i pije na własną szkodę."
"Prz26,7": "Jak nierówne są nogi chromego, tak przysłowie w ustach głupich."
"Prz26,8": "Jaki jest ten, kto przywiązuje kamień do procy, taki ten, kto oddaje cześć głupiemu."
"Prz26,9": "Jak cierń wbija się w rękę pijaka, tak przysłowie w ustach głupców."
"Prz26,10": "Wielki Bóg stworzył wszystko i odpłaca głupiemu, odpłaca również przestępcom."
"Prz26,11": "Jak pies powraca do swoich wymiocin, tak głupi powtarza swoją głupotę."
"Prz26,12": "Widzisz człowieka, co mądry w swoich oczach? Więcej nadziei dla głupca niż dla niego."
"Prz26,13": "Leniwy mówi: Lew na drodze, lew na ulicach."
"Prz26,14": "Jak drzwi się obracają na swoich zawiasach, tak leniwy na swoim łóżku."
"Prz26,15": "Leniwy kryje rękę pod pachę, a ciężko mu ją podnosić do ust."
"Prz26,16": "Leniwy uważa się za mądrzejszego niż siedmiu odpowiadających rozsądnie."
"Prz26,17": "Kto przechodzi i wtrąca się w cudzy spór, jest jak ten, który łapie psa za uszy."
"Prz26,18": "Jak szalony wypuszcza iskry, strzały i śmierć;"
"Prz26,19": "Taki jest każdy, kto zwodzi swego bliźniego i mówi: Czy nie żartowałem?"
"Prz26,20": "Gdy nie ma drew, ogień gaśnie; tak gdy nie ma plotkarza, ustaje spór."
"Prz26,21": "Jak węgiel dla żaru i drwa do ognia, tak kłótliwy człowiek do wzniecenia sporu."
"Prz26,22": "Słowa plotkarzy są jak rany; przenikają do głębi wnętrzności."
"Prz26,23": "Palące wargi i złe serce są jak gliniana skorupa pokryta żużlem srebrnym."
"Prz26,24": "Ten, kto nienawidzi, udaje wargami, lecz w sercu knuje podstęp."
"Prz26,25": "Gdy mówi miłym głosem, nie wierz mu, bo siedem obrzydliwości ma w swoim sercu."
"Prz26,26": "Nienawiść człowieka bywa pokryta podstępem, ale jego niegodziwość będzie odkryta na zgromadzeniu."
"Prz26,27": "Kto kopie dół, wpadnie w niego; kto kamień toczy, na niego się on obróci."
"Prz26,28": "Kłamliwy język nienawidzi tych, których uciska, a usta pochlebcze prowadzą do zguby."
