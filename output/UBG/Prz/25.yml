"Prz25,1": "To również są przysłowia Salomona, które przepisali mężowie Ezechiasza, króla Judy."
"Prz25,2": "Chwałą Boga jest sprawę taić, ale chwałą królów – dociekać sprawy."
"Prz25,3": "Wysokość niebios i głębia ziemi, i serca królów są niezbadane."
"Prz25,4": "Usuń żużel ze srebra, a wyjdzie naczynie dla złotnika."
"Prz25,5": "Usuń niegodziwego sprzed króla, a jego tron umocni się w sprawiedliwości."
"Prz25,6": "Nie wywyższaj się przed królem i nie stawaj na miejscu wielkich;"
"Prz25,7": "Bo lepiej, żeby ci powiedziano: Podejdź tu, niż żeby cię poniżono przed księciem, którego twoje oczy widziały."
"Prz25,8": "Nie spiesz się do kłótni, bo na końcu nie będziesz wiedział, co zrobić, gdy cię zawstydzi twój bliźni."
"Prz25,9": "Załatw sprawę ze swoim bliźnim i nie zdradzaj tajemnicy drugiemu;"
"Prz25,10": "By ten, który słucha, nie zawstydził cię, a twoja niesława nie przylgnęła do ciebie."
"Prz25,11": "Odpowiednio wypowiedziane słowo jest jak złote jabłko w srebrnych rzeźbach."
"Prz25,12": "Jak złoty kolczyk i klejnot ze szczerego złota tak jest dla uszu posłusznego ten, który mądrze strofuje."
"Prz25,13": "Czym chłód śniegu w czasie żniwa, tym wierny posłaniec dla tych, którzy go posyłają, bo pokrzepia dusze swych panów."
"Prz25,14": "Człowiek, który się chlubi zmyślonym darem, jest jak chmury i wiatr bez deszczu."
"Prz25,15": "Cierpliwością można przekonać władcę, a łagodny język łamie kości."
"Prz25,16": "Czy znalazłeś miód? Zjedz tyle, ile trzeba, byś objadłszy się, nie zwrócił go."
"Prz25,17": "Oddal nogę od domu bliźniego, by nie miał cię dość i cię nie znienawidził."
"Prz25,18": "Kto mówi fałszywe świadectwo przeciw swemu bliźniemu, jest młotem i mieczem, i ostrą strzałą."
"Prz25,19": "Ufność w człowieka niewiernego w dniu ucisku jest jak złamany ząb i zwichnięta noga."
"Prz25,20": "Jak ten, kto zabiera odzienie w czasie zimy i jak ocet na saletrze taki jest ten, kto śpiewa pieśni smutnemu sercu."
"Prz25,21": "Jeśli twój nieprzyjaciel jest głodny, nakarm go chlebem, a jeśli jest spragniony, napój go wodą;"
"Prz25,22": "Bo zgarniesz rozżarzone węgle na jego głowę, a PAN cię nagrodzi."
"Prz25,23": "Jak północny wiatr przepędza deszcz, tak gniewna twarz przepędza plotkarski język."
"Prz25,24": "Lepiej mieszkać w kącie pod dachem niż z kłótliwą żoną w przestronnym domu."
"Prz25,25": "Jak zimna woda dla pragnącej duszy, tak dobra wieść z dalekiej ziemi."
"Prz25,26": "Jak zmącone źródło i zepsuty zdrój, tak sprawiedliwy, który upada przed niegodziwym."
"Prz25,27": "Niedobrze jest jeść za dużo miodu, a szukanie własnej chwały nie jest chwałą."
"Prz25,28": "Człowiek, który nie panuje nad swoim duchem, jest jak miasto zburzone i bez muru."
