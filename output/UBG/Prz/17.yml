"Prz17,1":
  text: "Lepszy jest kęs suchego chleba, a przy tym spokój, niż dom pełen bydła ofiarnego z kłótnią."
  tags: []
"Prz17,2":
  text: "Sługa roztropny będzie panował nad synem, który przynosi hańbę, i wraz z jego braćmi będzie miał udział w dziedzictwie."
  tags: []
"Prz17,3":
  text: "Tygiel dla srebra, piec dla złota, ale serca bada PAN."
  tags: []
"Prz17,4":
  text: "Zły zważa na wargi fałszywe, a kłamca słucha przewrotnego języka."
  tags: []
"Prz17,5":
  text: "Kto naśmiewa się z ubogiego, uwłacza jego Stwórcy, a kto się cieszy z nieszczęścia, nie uniknie kary."
  tags: []
"Prz17,6":
  text: "Koroną starców są synowie synów, a chlubą synów są ich ojcowie."
  tags: []
"Prz17,7":
  text: "Poważna mowa nie przystoi głupiemu, tym mniej kłamliwe usta dostojnikowi."
  tags: []
"Prz17,8":
  text: "Dar jest jak drogocenny kamień w oczach tego, kto go posiada; gdziekolwiek z nim zmierza, ma powodzenie."
  tags: []
"Prz17,9":
  text: "Kto kryje grzech, szuka miłości, a kto wyjawia sprawę, rozdziela przyjaciół."
  tags: []
"Prz17,10":
  text: "Nagana lepiej działa na rozumnego niż sto razów na głupiego."
  tags: []
"Prz17,11":
  text: "Zły szuka jedynie buntu; dlatego zostanie wysłany przeciw niemu okrutny posłaniec."
  tags: []
"Prz17,12":
  text: "Lepiej człowiekowi spotkać się z niedźwiedzicą, której zabrano młode, niż z głupim w jego głupocie."
  tags: []
"Prz17,13":
  text: "Kto odpłaca złem za dobro, temu zło z domu nie ustąpi."
  tags: []
"Prz17,14":
  text: "Kto zaczyna kłótnię, jest jak ten, co puszcza wodę; dlatego zaniechaj sporu, zanim wybuchnie."
  tags: []
"Prz17,15":
  text: "Kto usprawiedliwia niegodziwego i kto potępia sprawiedliwego, obaj budzą odrazę w PANU."
  tags: []
"Prz17,16":
  text: "Na cóż w ręku głupiego pieniądze, by zdobyć mądrość, skoro nie ma rozumu?"
  tags: []
"Prz17,17":
  text: "Przyjaciel kocha w każdym czasie, a brat rodzi się w nieszczęściu."
  tags: []
"Prz17,18":
  text: "Nierozumny człowiek daje porękę i ręczy na oczach przyjaciela."
  tags: []
"Prz17,19":
  text: "Kto kocha grzech, kocha spór, a kto podwyższa swoją bramę, szuka zagłady."
  tags: []
"Prz17,20":
  text: "Przewrotny w sercu nie znajduje dobra, a kto ma przewrotny język, wpadnie w zło."
  tags: []
"Prz17,21":
  text: "Kto spłodzi głupca, zrobi to na swój smutek, a ojciec głupiego nie doznaje radości."
  tags: []
"Prz17,22":
  text: "Wesołe serce działa dobrze jak lekarstwo, a przygnębiony duch wysusza kości."
  tags: []
"Prz17,23":
  text: "Niegodziwy bierze dar z zanadrza, aby wypaczać ścieżki sądu."
  tags: []
"Prz17,24":
  text: "Mądrość jest przed obliczem rozumnego, a oczy głupca są aż na krańcu ziemi."
  tags: []
"Prz17,25":
  text: "Głupi syn jest zmartwieniem dla ojca i goryczą dla rodzicielki."
  tags: []
"Prz17,26":
  text: "Zaprawdę to niedobrze wymierzyć karę sprawiedliwemu ani bić władców za prawość."
  tags: []
"Prz17,27":
  text: "Kto ma wiedzę, powściąga swoje słowa, człowiek roztropny jest zacnego ducha."
  tags: []
"Prz17,28":
  text: "Nawet głupi, gdy milczy, uchodzi za mądrego, a kto zamyka swoje wargi – za rozumnego."
  tags: []
