"Ha2,1":
  text: "Na swej warcie będę stać, stanę na baszcie i będę się wpatrywać, aby zobaczyć, co Bóg będzie mówił i co mam odpowiedzieć, gdy zostanę upomniany."
  tags: []
"Ha2,2":
  text: "Wtedy PAN mi odpowiedział: Zapisz to widzenie, zapisz je wyraźnie na tablicach, aby czytający mógł je szybko przeczytać."
  tags: []
"Ha2,3":
  text: "To widzenie bowiem dotyczy oznaczonego czasu, a na końcu oznajmi, a nie skłamie; a choćby się odwlekało, oczekuj go, bo z pewnością przyjdzie, nie spóźni się."
  tags: []
"Ha2,4":
  text: "Oto dusza tego, który się wywyższa, nie jest w nim prawa. Ale sprawiedliwy będzie żył ze swojej wiary."
  tags: []
"Ha2,5":
  text: "Owszem, ponieważ upija się, jest on hardym człowiekiem i nie pozostaje w swoim domu; pomnaża swoją żądzę jak piekło i jak śmierć nie może się nasycić, choć zgromadził u siebie wszystkie narody i zebrał u siebie wszystkich ludzi."
  tags: []
"Ha2,6":
  text: "Czy ci wszyscy nie ułożą o nim przypowieści i szyderczego przysłowia, mówiąc: Biada temu, który gromadzi nie swoje rzeczy (jak długo?) i obciąża się gęstym błotem!"
  tags: []
"Ha2,7":
  text: "Czy nie powstaną nagle ci, którzy będą cię kąsać, i nie obudzą się ci, którzy będą cię szarpać? A staniesz się dla nich łupem."
  tags: []
"Ha2,8":
  text: "Ponieważ złupiłeś wiele narodów, złupią cię też wszystkie pozostałe narody z powodu krwi ludzkiej i przemocy dokonanej w ziemi, miastu i wszystkim jego mieszkańcom."
  tags: []
"Ha2,9":
  text: "Biada temu, który chciwie pragnie niegodziwego zysku dla swego domu, aby wystawił wysoko swoje gniazdo i tak uszedł mocy zła!"
  tags: []
"Ha2,10":
  text: "Postanowiłeś wytracić wiele narodów na hańbę swemu domowi, a grzeszyłeś przeciwko własnej duszy."
  tags: []
"Ha2,11":
  text: "Kamień bowiem będzie wołać z muru i sęk z drewna da o tym świadectwo."
  tags: []
"Ha2,12":
  text: "Biada temu, który krwią buduje miasto i utwierdza miasto nieprawością!"
  tags: []
"Ha2,13":
  text: "Czyż to nie pochodzi od PANA zastępów, że ludy będą się trudzić przy ogniu, a narody będą się męczyć daremnie?"
  tags: []
"Ha2,14":
  text: "Ziemia bowiem będzie napełniona poznaniem chwały PANA, jak wody napełniają morze."
  tags: []
"Ha2,15":
  text: "Biada temu, który poi swego bliźniego, przystawiając mu swe naczynie, aż go upoi, by patrzeć na jego nagość!"
  tags: []
"Ha2,16":
  text: "Nasyciłeś się hańbą zamiast sławą; upij się sam i będziesz obnażony. Kielich prawicy PANA zwróci się przeciw tobie i sromotne wymioty pokryją twoją sławę."
  tags: []
"Ha2,17":
  text: "Okryje cię bowiem bezprawie Libanu i spustoszenie bestii, które ich straszyły, z powodu krwi ludzkiej i przemocy dokonanej w ziemi miastu i wszystkim jego mieszkańcom."
  tags: []
"Ha2,18":
  text: "Cóż pomoże rzeźbiony posąg, który wykonał jego rzemieślnik, albo odlany obraz i nauczyciel kłamstwa, aby rzemieślnik pokładał w nim ufność, czyniąc nieme bożki?"
  tags: []
"Ha2,19":
  text: "Biada temu, który mówi do drewna: Przebudź się, a do niemego kamienia: Obudź się! Czyż on może nauczać? Spójrz na niego, jest powleczony złotem i srebrem, ale nie ma w nim żadnego ducha."
  tags: []
"Ha2,20":
  text: "PAN jest w swoim świętym przybytku. Niech cała ziemia zamilknie przed nim."
  tags: []
