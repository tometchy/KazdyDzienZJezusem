"Ha2,1": "Na swej warcie będę stać, stanę na baszcie i będę się wpatrywać, aby zobaczyć, co Bóg będzie mówił i co mam odpowiedzieć, gdy zostanę upomniany."
"Ha2,2": "Wtedy PAN mi odpowiedział: Zapisz to widzenie, zapisz je wyraźnie na tablicach, aby czytający mógł je szybko przeczytać."
"Ha2,3": "To widzenie bowiem dotyczy oznaczonego czasu, a na końcu oznajmi, a nie skłamie; a choćby się odwlekało, oczekuj go, bo z pewnością przyjdzie, nie spóźni się."
"Ha2,4": "Oto dusza tego, który się wywyższa, nie jest w nim prawa. Ale sprawiedliwy będzie żył ze swojej wiary."
"Ha2,5": "Owszem, ponieważ upija się, jest on hardym człowiekiem i nie pozostaje w swoim domu; pomnaża swoją żądzę jak piekło i jak śmierć nie może się nasycić, choć zgromadził u siebie wszystkie narody i zebrał u siebie wszystkich ludzi."
"Ha2,6": "Czy ci wszyscy nie ułożą o nim przypowieści i szyderczego przysłowia, mówiąc: Biada temu, który gromadzi nie swoje rzeczy (jak długo?) i obciąża się gęstym błotem!"
"Ha2,7": "Czy nie powstaną nagle ci, którzy będą cię kąsać, i nie obudzą się ci, którzy będą cię szarpać? A staniesz się dla nich łupem."
"Ha2,8": "Ponieważ złupiłeś wiele narodów, złupią cię też wszystkie pozostałe narody z powodu krwi ludzkiej i przemocy dokonanej w ziemi, miastu i wszystkim jego mieszkańcom."
"Ha2,9": "Biada temu, który chciwie pragnie niegodziwego zysku dla swego domu, aby wystawił wysoko swoje gniazdo i tak uszedł mocy zła!"
"Ha2,10": "Postanowiłeś wytracić wiele narodów na hańbę swemu domowi, a grzeszyłeś przeciwko własnej duszy."
"Ha2,11": "Kamień bowiem będzie wołać z muru i sęk z drewna da o tym świadectwo."
"Ha2,12": "Biada temu, który krwią buduje miasto i utwierdza miasto nieprawością!"
"Ha2,13": "Czyż to nie pochodzi od PANA zastępów, że ludy będą się trudzić przy ogniu, a narody będą się męczyć daremnie?"
"Ha2,14": "Ziemia bowiem będzie napełniona poznaniem chwały PANA, jak wody napełniają morze."
"Ha2,15": "Biada temu, który poi swego bliźniego, przystawiając mu swe naczynie, aż go upoi, by patrzeć na jego nagość!"
"Ha2,16": "Nasyciłeś się hańbą zamiast sławą; upij się sam i będziesz obnażony. Kielich prawicy PANA zwróci się przeciw tobie i sromotne wymioty pokryją twoją sławę."
"Ha2,17": "Okryje cię bowiem bezprawie Libanu i spustoszenie bestii, które ich straszyły, z powodu krwi ludzkiej i przemocy dokonanej w ziemi miastu i wszystkim jego mieszkańcom."
"Ha2,18": "Cóż pomoże rzeźbiony posąg, który wykonał jego rzemieślnik, albo odlany obraz i nauczyciel kłamstwa, aby rzemieślnik pokładał w nim ufność, czyniąc nieme bożki?"
"Ha2,19": "Biada temu, który mówi do drewna: Przebudź się, a do niemego kamienia: Obudź się! Czyż on może nauczać? Spójrz na niego, jest powleczony złotem i srebrem, ale nie ma w nim żadnego ducha."
"Ha2,20": "PAN jest w swoim świętym przybytku. Niech cała ziemia zamilknie przed nim."
