"Ha1,1": "Brzemię, które widział prorok Habakuk."
"Ha1,2": "PANIE, jak długo będę wołać, a nie będziesz wysłuchiwał? Jak długo będę krzyczeć do ciebie o krzywdzie, a nie będziesz wybawiał?"
"Ha1,3": "Czemu dopuszczasz, abym patrzył na nieprawość i widział bezprawie? Zguba i przemoc są przede mną i znajduje się ten, który roznieca spory i niezgodę."
"Ha1,4": "Dlatego prawo jest naruszone, a nie ma już sprawiedliwości. Niegodziwy bowiem osacza sprawiedliwego, dlatego wydawane są błędne wyroki."
"Ha1,5": "Spójrzcie na narody, zobaczcie i zdumiejcie się bardzo, gdyż dokonuję dzieła za waszych dni, w które nie uwierzycie, gdy wam o nim opowiedzą."
"Ha1,6": "Oto bowiem wzbudzę Chaldejczyków, naród srogi i gwałtowny; przejdą przez szerokość ziemi, aby posiąść cudze miejsca zamieszkania."
"Ha1,7": "Straszni są i groźni. Sami ustalają swój sąd i swoją wielkość."
"Ha1,8": "Ich konie są szybsze niż lamparty, dziksze niż wilki o zmierzchu. Ich jeźdźcy rozciągną się szeroko, ich jeźdźcy przybędą z daleka, przylecą jak orzeł spieszący się na żer."
"Ha1,9": "Każdy z nich przybędzie dla łupu. Ich twarze będą zwrócone na wschód i zgromadzą jeńców jak piasek."
"Ha1,10": "Będą szydzić z królów, a książęta będą u nich przedmiotem pogardy. Z każdej twierdzy będą się naśmiewać, usypią wały i zdobędą ją."
"Ha1,11": "Wtedy jego duch się odmieni, a wystąpi i zawini, myśląc, że jego moc pochodzi od jego boga."
"Ha1,12": "Czy ty nie jesteś od wieków, PANIE, mój Boże, mój Święty? My nie umrzemy. PANIE, postawiłeś ich na sąd. Ty, nasza Skało, przeznaczyłeś ich na karanie."
"Ha1,13": "Twoje oczy są tak czyste, że nie możesz patrzeć na zło ani widzieć bezprawia. Czemu patrzysz na czyniących przewrotność? Czemu milczysz, gdy niegodziwy pożera sprawiedliwszego niż on sam?"
"Ha1,14": "Czemu czynisz ludzi jak ryby morskie, jak zwierzęta pełzające, które nie mają pana?"
"Ha1,15": "Wyciąga wszystkie wędką, zagarnia je swoim niewodem i gromadzi je w swojej sieci. Dlatego cieszy się i raduje."
"Ha1,16": "Dlatego składa ofiarę swemu niewodowi i pali kadzidło swojej sieci. Przez nie bowiem jego dział jest obfity i jego pożywienie bogatsze."
"Ha1,17": "Czy dlatego będzie zarzucać swoją sieć, by nieustannie zabijać narody bez litości?"
