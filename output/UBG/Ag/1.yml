"Ag1,1": "W drugim roku króla Dariusza, w szóstym miesiącu, pierwszego dnia tego miesiąca, słowo PANA doszło przez proroka Aggeusza do Zorobabela, syna Szealtiela, namiestnika Judy, i do Jozuego, syna Josadaka, najwyższego kapłana, mówiące:"
"Ag1,2": "Tak mówi PAN zastępów: Ten lud powiada: Jeszcze nie nadszedł czas, czas budowania domu PANA."
"Ag1,3": "Wówczas słowo PANA doszło przez proroka Aggeusza mówiące:"
"Ag1,4": "A czy dla was jest to czas, abyście mieszkali w swoich domach wyłożonych deskami, podczas gdy ten dom leży opustoszały?"
"Ag1,5": "Teraz więc tak mówi PAN zastępów: Zastanówcie się nad swoimi drogami."
"Ag1,6": "Siejecie wiele, a mało zbieracie; jecie, ale się nie nasycacie; pijecie, ale nie gasicie pragnienia; ubieracie się, lecz nikt nie może się ogrzać, a ten, kto gromadzi zarobek, gromadzi go w dziurawym worku."
"Ag1,7": "Tak mówi PAN zastępów: Zastanówcie się nad swoimi drogami."
"Ag1,8": "Wstąpcie na tę górę i sprowadźcie drewno; zbudujcie ten dom, a upodobam go sobie i będę uwielbiony, mówi PAN."
"Ag1,9": "Liczyliście na wiele, a oto było tego mało, a to, co przynieśliście do domu, ja rozdmuchałem. Dlaczego? – mówi PAN zastępów. Dlatego że mój dom jest pusty, podczas gdy każdy z was troszczy się o swój dom."
"Ag1,10": "Dlatego niebo wstrzymało nad wami rosę, a ziemia wstrzymała wydawanie swego plonu."
"Ag1,11": "Sprowadziłem suszę na tę ziemię, na te góry, na pszenicę, na moszcz i na oliwę, na to, co ziemia wydaje, na ludzi i na bydło, i na wszelką pracę rąk."
"Ag1,12": "Wtedy Zorobabel, syn Szealtiela, i najwyższy kapłan Jozue, syn Josadaka, oraz cała resztka ludu wysłuchali głosu PANA, swego Boga, i słów proroka Aggeusza, ponieważ posłał go PAN, ich Bóg, a lud bał się PANA."
"Ag1,13": "Wtedy Aggeusz, posłaniec PANA, przemówił do ludu, głosząc przesłanie PANA: Ja jestem z wami, mówi PAN."
"Ag1,14": "I PAN wzbudził ducha Zorobabela, syna Szealtiela, namiestnika Judy, i ducha Jozuego, syna Josadaka, najwyższego kapłana, oraz ducha całej reszty ludu, tak że przyszli i podjęli pracę przy domu PANA zastępów, swego Boga;"
"Ag1,15": "Dnia dwudziestego czwartego, szóstego miesiąca, w drugim roku króla Dariusza."
