"Ag1,1":
  text: "W drugim roku króla Dariusza, w szóstym miesiącu, pierwszego dnia tego miesiąca, słowo PANA doszło przez proroka Aggeusza do Zorobabela, syna Szealtiela, namiestnika Judy, i do Jozuego, syna Josadaka, najwyższego kapłana, mówiące:"
  tags: []
"Ag1,2":
  text: "Tak mówi PAN zastępów: Ten lud powiada: Jeszcze nie nadszedł czas, czas budowania domu PANA."
  tags: []
"Ag1,3":
  text: "Wówczas słowo PANA doszło przez proroka Aggeusza mówiące:"
  tags: []
"Ag1,4":
  text: "A czy dla was jest to czas, abyście mieszkali w swoich domach wyłożonych deskami, podczas gdy ten dom leży opustoszały?"
  tags: []
"Ag1,5":
  text: "Teraz więc tak mówi PAN zastępów: Zastanówcie się nad swoimi drogami."
  tags: []
"Ag1,6":
  text: "Siejecie wiele, a mało zbieracie; jecie, ale się nie nasycacie; pijecie, ale nie gasicie pragnienia; ubieracie się, lecz nikt nie może się ogrzać, a ten, kto gromadzi zarobek, gromadzi go w dziurawym worku."
  tags: []
"Ag1,7":
  text: "Tak mówi PAN zastępów: Zastanówcie się nad swoimi drogami."
  tags: []
"Ag1,8":
  text: "Wstąpcie na tę górę i sprowadźcie drewno; zbudujcie ten dom, a upodobam go sobie i będę uwielbiony, mówi PAN."
  tags: []
"Ag1,9":
  text: "Liczyliście na wiele, a oto było tego mało, a to, co przynieśliście do domu, ja rozdmuchałem. Dlaczego? – mówi PAN zastępów. Dlatego że mój dom jest pusty, podczas gdy każdy z was troszczy się o swój dom."
  tags: []
"Ag1,10":
  text: "Dlatego niebo wstrzymało nad wami rosę, a ziemia wstrzymała wydawanie swego plonu."
  tags: []
"Ag1,11":
  text: "Sprowadziłem suszę na tę ziemię, na te góry, na pszenicę, na moszcz i na oliwę, na to, co ziemia wydaje, na ludzi i na bydło, i na wszelką pracę rąk."
  tags: []
"Ag1,12":
  text: "Wtedy Zorobabel, syn Szealtiela, i najwyższy kapłan Jozue, syn Josadaka, oraz cała resztka ludu wysłuchali głosu PANA, swego Boga, i słów proroka Aggeusza, ponieważ posłał go PAN, ich Bóg, a lud bał się PANA."
  tags: []
"Ag1,13":
  text: "Wtedy Aggeusz, posłaniec PANA, przemówił do ludu, głosząc przesłanie PANA: Ja jestem z wami, mówi PAN."
  tags: []
"Ag1,14":
  text: "I PAN wzbudził ducha Zorobabela, syna Szealtiela, namiestnika Judy, i ducha Jozuego, syna Josadaka, najwyższego kapłana, oraz ducha całej reszty ludu, tak że przyszli i podjęli pracę przy domu PANA zastępów, swego Boga;"
  tags: []
"Ag1,15":
  text: "Dnia dwudziestego czwartego, szóstego miesiąca, w drugim roku króla Dariusza."
  tags: []
