"Ag2,1": "W siódmym miesiącu, dwudziestego pierwszego dnia tego miesiąca, słowo PANA doszło przez proroka Aggeusza mówiące:"
"Ag2,2": "Mów teraz do Zorobabela, syna Szealtiela, namiestnika Judy, i do Jozuego, syna Josadaka, najwyższego kapłana, oraz do reszty ludu:"
"Ag2,3": "Któż pozostał pośród was, który widział ten dom w jego dawnej chwale? A jakim go teraz widzicie? Czy nie wydaje się wam, że jest niczym w porównaniu z tamtym?"
"Ag2,4": "Teraz jednak umocnij się, Zorobabelu, mówi PAN; umocnij się, Jozue, synu Josadaka, najwyższy kapłanie; umocnij się też, cały ludu tej ziemi, mówi PAN, i pracujcie. Ja bowiem jestem z wami, mówi PAN zastępów."
"Ag2,5": "Zgodnie ze słowem, przez które zawarłem z wami przymierze, gdy wyszliście z Egiptu, mój Duch jest stale wśród was, nie bójcie się."
"Ag2,6": "Tak bowiem mówi PAN zastępów: Jeszcze raz, po krótkim czasie, wstrząsnę niebem i ziemią, morzem i lądem;"
"Ag2,7": "Wstrząsnę wszystkimi narodami i przyjdzie Pożądany przez wszystkie narody. I napełnię ten dom chwałą, mówi PAN zastępów."
"Ag2,8": "Moje jest srebro i moje jest złoto, mówi PAN zastępów."
"Ag2,9": "Chwała tego domu będzie większa od tej, jaką miał tamten dawny, mówi PAN zastępów; bo to miejsce obdarzę pokojem, mówi PAN."
"Ag2,10": "Dnia dwudziestego czwartego, dziewiątego miesiąca, w drugim roku Dariusza, słowo PANA doszło przez proroka Aggeusza mówiące:"
"Ag2,11": "Tak mówi PAN zastępów: Zapytaj teraz kapłanów o prawo:"
"Ag2,12": "Gdyby ktoś niósł poświęcone mięso włożone za połę swojej szaty, a połą dotknął chleba, potrawy, wina, oliwy lub jakiegokolwiek pokarmu, czy to stałoby się poświęcone? Odpowiedzieli kapłani: Nie."
"Ag2,13": "Wtedy Aggeusz zapytał: Jeśli ktoś, będąc nieczysty od zwłok, dotknie którejś z tych rzeczy, czy staje się ona nieczysta? Odpowiedzieli kapłani: Stanie się nieczysta."
"Ag2,14": "Wtedy Aggeusz odezwał się i powiedział: Taki jest ten lud, taki jest ten naród przede mną, mówi PAN; takie jest każde dzieło ich rąk; i wszystko, co tam składają w ofierze, jest nieczyste."
"Ag2,15": "Teraz więc, proszę, zastanówcie się, jak się wam powodziło od dzisiejszego dnia do minionych dni, zanim ułożono kamień na kamieniu w świątyni PANA."
"Ag2,16": "Dawniej, gdy ktoś przyszedł do stosu zboża z dwudziestu miar, było ich tylko dziesięć; gdy przyszedł do prasy, aby naczerpać pięćdziesiąt wiader wina, było ich tylko dwadzieścia."
"Ag2,17": "Karałem was suszą, pleśnią i gradem we wszystkich dziełach waszych rąk; lecz żaden z was nie wrócił do mnie, mówi PAN."
"Ag2,18": "Zastanówcie się teraz nad okresem od dzisiejszego dnia po dni minione, od dnia dwudziestego czwartego, dziewiątego miesiąca, to znaczy od dnia, w którym położono fundament świątyni PANA; zastanówcie się."
"Ag2,19": "Czy ziarno jeszcze jest w spichlerzu? I owszem ani winorośl, ani drzewo figowe, granatowe i oliwne nie wydały jeszcze owocu. Od tego dnia będę wam błogosławił."
"Ag2,20": "Potem słowo PANA doszło po raz drugi do Aggeusza dnia dwudziestego czwartego tego miesiąca mówiące:"
"Ag2,21": "Mów do Zorobabela, namiestnika Judy: Ja wstrząsnę niebiosami i ziemią;"
"Ag2,22": "I przewrócę tron królestw, i zniszczę moc królestw pogan; przewrócę także rydwany i tych, którzy na nich jeżdżą; i upadną konie i ich jeźdźcy, każdy od miecza swego brata."
"Ag2,23": "W tym dniu, mówi PAN zastępów, wezmę cię, Zorobabelu, mój sługo, synu Szealtiela, mówi PAN, i uczynię cię niczym sygnet. Ja bowiem wybrałem ciebie, mówi PAN zastępów."
