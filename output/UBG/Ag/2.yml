"Ag2,1":
  text: "W siódmym miesiącu, dwudziestego pierwszego dnia tego miesiąca, słowo PANA doszło przez proroka Aggeusza mówiące:"
  tags: []
"Ag2,2":
  text: "Mów teraz do Zorobabela, syna Szealtiela, namiestnika Judy, i do Jozuego, syna Josadaka, najwyższego kapłana, oraz do reszty ludu:"
  tags: []
"Ag2,3":
  text: "Któż pozostał pośród was, który widział ten dom w jego dawnej chwale? A jakim go teraz widzicie? Czy nie wydaje się wam, że jest niczym w porównaniu z tamtym?"
  tags: []
"Ag2,4":
  text: "Teraz jednak umocnij się, Zorobabelu, mówi PAN; umocnij się, Jozue, synu Josadaka, najwyższy kapłanie; umocnij się też, cały ludu tej ziemi, mówi PAN, i pracujcie. Ja bowiem jestem z wami, mówi PAN zastępów."
  tags: []
"Ag2,5":
  text: "Zgodnie ze słowem, przez które zawarłem z wami przymierze, gdy wyszliście z Egiptu, mój Duch jest stale wśród was, nie bójcie się."
  tags: []
"Ag2,6":
  text: "Tak bowiem mówi PAN zastępów: Jeszcze raz, po krótkim czasie, wstrząsnę niebem i ziemią, morzem i lądem;"
  tags: []
"Ag2,7":
  text: "Wstrząsnę wszystkimi narodami i przyjdzie Pożądany przez wszystkie narody. I napełnię ten dom chwałą, mówi PAN zastępów."
  tags: []
"Ag2,8":
  text: "Moje jest srebro i moje jest złoto, mówi PAN zastępów."
  tags: []
"Ag2,9":
  text: "Chwała tego domu będzie większa od tej, jaką miał tamten dawny, mówi PAN zastępów; bo to miejsce obdarzę pokojem, mówi PAN."
  tags: []
"Ag2,10":
  text: "Dnia dwudziestego czwartego, dziewiątego miesiąca, w drugim roku Dariusza, słowo PANA doszło przez proroka Aggeusza mówiące:"
  tags: []
"Ag2,11":
  text: "Tak mówi PAN zastępów: Zapytaj teraz kapłanów o prawo:"
  tags: []
"Ag2,12":
  text: "Gdyby ktoś niósł poświęcone mięso włożone za połę swojej szaty, a połą dotknął chleba, potrawy, wina, oliwy lub jakiegokolwiek pokarmu, czy to stałoby się poświęcone? Odpowiedzieli kapłani: Nie."
  tags: []
"Ag2,13":
  text: "Wtedy Aggeusz zapytał: Jeśli ktoś, będąc nieczysty od zwłok, dotknie którejś z tych rzeczy, czy staje się ona nieczysta? Odpowiedzieli kapłani: Stanie się nieczysta."
  tags: []
"Ag2,14":
  text: "Wtedy Aggeusz odezwał się i powiedział: Taki jest ten lud, taki jest ten naród przede mną, mówi PAN; takie jest każde dzieło ich rąk; i wszystko, co tam składają w ofierze, jest nieczyste."
  tags: []
"Ag2,15":
  text: "Teraz więc, proszę, zastanówcie się, jak się wam powodziło od dzisiejszego dnia do minionych dni, zanim ułożono kamień na kamieniu w świątyni PANA."
  tags: []
"Ag2,16":
  text: "Dawniej, gdy ktoś przyszedł do stosu zboża z dwudziestu miar, było ich tylko dziesięć; gdy przyszedł do prasy, aby naczerpać pięćdziesiąt wiader wina, było ich tylko dwadzieścia."
  tags: []
"Ag2,17":
  text: "Karałem was suszą, pleśnią i gradem we wszystkich dziełach waszych rąk; lecz żaden z was nie wrócił do mnie, mówi PAN."
  tags: []
"Ag2,18":
  text: "Zastanówcie się teraz nad okresem od dzisiejszego dnia po dni minione, od dnia dwudziestego czwartego, dziewiątego miesiąca, to znaczy od dnia, w którym położono fundament świątyni PANA; zastanówcie się."
  tags: []
"Ag2,19":
  text: "Czy ziarno jeszcze jest w spichlerzu? I owszem ani winorośl, ani drzewo figowe, granatowe i oliwne nie wydały jeszcze owocu. Od tego dnia będę wam błogosławił."
  tags: []
"Ag2,20":
  text: "Potem słowo PANA doszło po raz drugi do Aggeusza dnia dwudziestego czwartego tego miesiąca mówiące:"
  tags: []
"Ag2,21":
  text: "Mów do Zorobabela, namiestnika Judy: Ja wstrząsnę niebiosami i ziemią;"
  tags: []
"Ag2,22":
  text: "I przewrócę tron królestw, i zniszczę moc królestw pogan; przewrócę także rydwany i tych, którzy na nich jeżdżą; i upadną konie i ich jeźdźcy, każdy od miecza swego brata."
  tags: []
"Ag2,23":
  text: "W tym dniu, mówi PAN zastępów, wezmę cię, Zorobabelu, mój sługo, synu Szealtiela, mówi PAN, i uczynię cię niczym sygnet. Ja bowiem wybrałem ciebie, mówi PAN zastępów."
  tags: []
