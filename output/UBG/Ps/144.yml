"Ps144,1":
  text: "Błogosławiony PAN, moja skała, który zaprawia moje ręce do walki, a moje palce do wojny."
  tags: []
"Ps144,2":
  text: "Moje miłosierdzie i moja twierdza, moja warownia, mój wybawiciel i moja tarcza; ten, któremu ufam, on mi poddaje mój lud."
  tags: []
"Ps144,3":
  text: "PANIE, czym jest człowiek, że zwracasz na niego uwagę? Albo syn człowieczy, że go poważasz?"
  tags: []
"Ps144,4":
  text: "Człowiek jest podobny do marności; jego dni jak cień, który przemija."
  tags: []
"Ps144,5":
  text: "PANIE, nachyl twoich niebios i zstąp; dotknij gór, a będą dymić."
  tags: []
"Ps144,6":
  text: "Zabłyśnij błyskawicą i rozprosz ich; wypuść swoje strzały i poraź ich."
  tags: []
"Ps144,7":
  text: "Wyciągnij swą rękę z wysokości; wybaw mnie i ocal z wielkich wód, z rąk cudzoziemców;"
  tags: []
"Ps144,8":
  text: "Których usta mówią kłamstwo, a ich prawica jest prawicą fałszywą."
  tags: []
"Ps144,9":
  text: "Boże, zaśpiewam tobie nową pieśń; będę ci śpiewał przy dźwiękach lutni i harfy o dziesięciu strunach."
  tags: []
"Ps144,10":
  text: "Ty dajesz królom zwycięstwo, a Dawida, swego sługę, wybawiasz od srogiego miecza."
  tags: []
"Ps144,11":
  text: "Wybaw mnie i ocal z rąk cudzoziemców, których usta mówią kłamstwo, a ich prawica jest prawicą fałszywą;"
  tags: []
"Ps144,12":
  text: "Aby nasi synowie byli jak szczepy wyrosłe w swojej młodości, a nasze córki jak kamienie węgielne, wyrzeźbione na wzór pałacu;"
  tags: []
"Ps144,13":
  text: "Aby nasze spichlerze były pełne, obficie zaopatrzone we wszystko, nasze stada rodziły tysiące i dziesięć tysięcy w naszych zagrodach;"
  tags: []
"Ps144,14":
  text: "Aby nasze woły były tłuste, żeby nie było włamań ani ucieczek, ani narzekania na naszych ulicach."
  tags: []
"Ps144,15":
  text: "Błogosławiony lud, któremu się tak dzieje. Błogosławiony lud, którego Bogiem jest PAN."
  tags: []
