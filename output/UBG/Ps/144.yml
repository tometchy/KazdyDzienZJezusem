"Ps144,1": "Błogosławiony PAN, moja skała, który zaprawia moje ręce do walki, a moje palce do wojny."
"Ps144,2": "Moje miłosierdzie i moja twierdza, moja warownia, mój wybawiciel i moja tarcza; ten, któremu ufam, on mi poddaje mój lud."
"Ps144,3": "PANIE, czym jest człowiek, że zwracasz na niego uwagę? Albo syn człowieczy, że go poważasz?"
"Ps144,4": "Człowiek jest podobny do marności; jego dni jak cień, który przemija."
"Ps144,5": "PANIE, nachyl twoich niebios i zstąp; dotknij gór, a będą dymić."
"Ps144,6": "Zabłyśnij błyskawicą i rozprosz ich; wypuść swoje strzały i poraź ich."
"Ps144,7": "Wyciągnij swą rękę z wysokości; wybaw mnie i ocal z wielkich wód, z rąk cudzoziemców;"
"Ps144,8": "Których usta mówią kłamstwo, a ich prawica jest prawicą fałszywą."
"Ps144,9": "Boże, zaśpiewam tobie nową pieśń; będę ci śpiewał przy dźwiękach lutni i harfy o dziesięciu strunach."
"Ps144,10": "Ty dajesz królom zwycięstwo, a Dawida, swego sługę, wybawiasz od srogiego miecza."
"Ps144,11": "Wybaw mnie i ocal z rąk cudzoziemców, których usta mówią kłamstwo, a ich prawica jest prawicą fałszywą;"
"Ps144,12": "Aby nasi synowie byli jak szczepy wyrosłe w swojej młodości, a nasze córki jak kamienie węgielne, wyrzeźbione na wzór pałacu;"
"Ps144,13": "Aby nasze spichlerze były pełne, obficie zaopatrzone we wszystko, nasze stada rodziły tysiące i dziesięć tysięcy w naszych zagrodach;"
"Ps144,14": "Aby nasze woły były tłuste, żeby nie było włamań ani ucieczek, ani narzekania na naszych ulicach."
"Ps144,15": "Błogosławiony lud, któremu się tak dzieje. Błogosławiony lud, którego Bogiem jest PAN."
