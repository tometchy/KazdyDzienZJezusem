"Ps132,1": "Pamiętaj, PANIE, Dawida i wszystkie jego utrapienia;"
"Ps132,2": "Jak przysiągł PANU i ślubował potężnemu Bogu Jakuba, mówiąc:"
"Ps132,3": "Zaprawdę, nie wejdę do przybytku, do mego domu, i nie wstąpię na posłanie mego łoża;"
"Ps132,4": "I nie dam zasnąć swoim oczom ani drzemać swoim powiekom;"
"Ps132,5": "Póki nie znajdę miejsca dla PANA, mieszkania dla potężnego Boga Jakuba."
"Ps132,6": "Oto usłyszeliśmy o niej w Efrata, znaleźliśmy ją na polach leśnych."
"Ps132,7": "Wejdźmy do jego przybytków, oddajmy pokłon u podnóżka jego stóp."
"Ps132,8": "Powstań, PANIE, i wejdź do miejsca twego odpoczynku, ty i arka twojej mocy."
"Ps132,9": "Niech twoi kapłani ubiorą się w sprawiedliwość, a twoi święci niech się radują."
"Ps132,10": "Ze względu na Dawida, twego sługę, nie odtrącaj oblicza twego pomazańca."
"Ps132,11": "Przysiągł PAN Dawidowi prawdę i nie wycofa się z tego: Z owocu twoich bioder posadzę na twoim tronie."
"Ps132,12": "Jeśli twoi synowie będą strzegli mojego przymierza i moich świadectw, których ich nauczę, to wtedy i ich synowie aż na wieki będą siedzieli na twoim tronie."
"Ps132,13": "PAN bowiem wybrał Syjon i upodobał go sobie na mieszkanie:"
"Ps132,14": "To będzie mój odpoczynek aż na wieki; tu będę mieszkał, bo go sobie upodobałem."
"Ps132,15": "Będę obficie błogosławił jego żywność, a jego ubogich nasycę chlebem."
"Ps132,16": "Jego kapłanów przyodzieję zbawieniem, a jego święci będą wołać radośnie."
"Ps132,17": "Tam sprawię, że zakwitnie róg Dawida; tam zgotuję pochodnię memu pomazańcowi."
"Ps132,18": "Okryję jego nieprzyjaciół wstydem, ale nad nim rozkwitnie jego korona."
