"Ps132,1":
  text: "Pamiętaj, PANIE, Dawida i wszystkie jego utrapienia;"
  tags: []
"Ps132,2":
  text: "Jak przysiągł PANU i ślubował potężnemu Bogu Jakuba, mówiąc:"
  tags: []
"Ps132,3":
  text: "Zaprawdę, nie wejdę do przybytku, do mego domu, i nie wstąpię na posłanie mego łoża;"
  tags: []
"Ps132,4":
  text: "I nie dam zasnąć swoim oczom ani drzemać swoim powiekom;"
  tags: []
"Ps132,5":
  text: "Póki nie znajdę miejsca dla PANA, mieszkania dla potężnego Boga Jakuba."
  tags: []
"Ps132,6":
  text: "Oto usłyszeliśmy o niej w Efrata, znaleźliśmy ją na polach leśnych."
  tags: []
"Ps132,7":
  text: "Wejdźmy do jego przybytków, oddajmy pokłon u podnóżka jego stóp."
  tags: []
"Ps132,8":
  text: "Powstań, PANIE, i wejdź do miejsca twego odpoczynku, ty i arka twojej mocy."
  tags: []
"Ps132,9":
  text: "Niech twoi kapłani ubiorą się w sprawiedliwość, a twoi święci niech się radują."
  tags: []
"Ps132,10":
  text: "Ze względu na Dawida, twego sługę, nie odtrącaj oblicza twego pomazańca."
  tags: []
"Ps132,11":
  text: "Przysiągł PAN Dawidowi prawdę i nie wycofa się z tego: Z owocu twoich bioder posadzę na twoim tronie."
  tags: []
"Ps132,12":
  text: "Jeśli twoi synowie będą strzegli mojego przymierza i moich świadectw, których ich nauczę, to wtedy i ich synowie aż na wieki będą siedzieli na twoim tronie."
  tags: []
"Ps132,13":
  text: "PAN bowiem wybrał Syjon i upodobał go sobie na mieszkanie:"
  tags: []
"Ps132,14":
  text: "To będzie mój odpoczynek aż na wieki; tu będę mieszkał, bo go sobie upodobałem."
  tags: []
"Ps132,15":
  text: "Będę obficie błogosławił jego żywność, a jego ubogich nasycę chlebem."
  tags: []
"Ps132,16":
  text: "Jego kapłanów przyodzieję zbawieniem, a jego święci będą wołać radośnie."
  tags: []
"Ps132,17":
  text: "Tam sprawię, że zakwitnie róg Dawida; tam zgotuję pochodnię memu pomazańcowi."
  tags: []
"Ps132,18":
  text: "Okryję jego nieprzyjaciół wstydem, ale nad nim rozkwitnie jego korona."
  tags: []
