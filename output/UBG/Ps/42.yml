"Ps42,1":
  text: "Jak jeleń pragnie wód strumieni, tak moja dusza pragnie ciebie, Boże."
  tags: []
"Ps42,2":
  text: "Moja dusza jest spragniona Boga, Boga żywego. Kiedy przyjdę i ukażę się przed obliczem Boga?"
  tags: []
"Ps42,3":
  text: "Łzy stały się dla mnie chlebem we dnie i w nocy, gdy mówią do mnie co dzień: Gdzie jest twój Bóg?"
  tags: []
"Ps42,4":
  text: "Wylewam swą duszę, gdy wspominam, jak krocząc w tłumie, szedłem z nimi do domu Bożego wśród głosów radości i chwały, pośród świętującego tłumu."
  tags: []
"Ps42,5":
  text: "Dlaczego się smucisz, moja duszo, i czemu się we mnie trwożysz? Zaufaj Bogu, bo jeszcze będę go wysławiał za jego zbawcze oblicze."
  tags: []
"Ps42,6":
  text: "Mój Boże, smuci się we mnie moja dusza, dlatego wspominam cię z ziemi Jordanu i Hermonu, z góry Misar."
  tags: []
"Ps42,7":
  text: "Przepaść przyzywa przepaść szumem twoich upustów; wszystkie twoje fale i nawałnice przewalają się nade mną."
  tags: []
"Ps42,8":
  text: "Lecz we dnie PAN udzieli mi swego miłosierdzia, a w nocy będzie we mnie jego pieśń i moja modlitwa do Boga mego życia."
  tags: []
"Ps42,9":
  text: "Powiem Bogu, mojej skale: Czemu o mnie zapomniałeś? Czemu chodzę smutny z powodu ucisku wroga?"
  tags: []
"Ps42,10":
  text: "Jak rana w moich kościach, tak mnie urągają moi wrogowie, gdy mówią do mnie każdego dnia: Gdzie jest twój Bóg?"
  tags: []
"Ps42,11":
  text: "Czemu się smucisz, moja duszo, i czemu się we mnie trwożysz? Zaufaj Bogu, bo jeszcze będę go wysławiał, gdyż on jest zbawieniem mego oblicza i moim Bogiem."
  tags: []
