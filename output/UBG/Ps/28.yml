"Ps28,1":
  text: "Do ciebie wołam, PANIE, Skało moja; nie bądź głuchy na moje wołanie, abym jeśli się nie odezwiesz, nie stał się podobny do zstępujących do dołu."
  tags: []
"Ps28,2":
  text: "Usłysz głos mego błagania, gdy wołam do ciebie, gdy podnoszę ręce ku twojemu miejscu najświętszemu."
  tags: []
"Ps28,3":
  text: "Nie zabieraj mnie z niegodziwymi i z czyniącymi nieprawość, którzy mówią o pokoju z bliźnimi, a zło jest w ich sercach."
  tags: []
"Ps28,4":
  text: "Oddaj im według ich uczynków i według zła ich postępków; według czynów ich rąk odpłać im, oddaj im, co im się należy."
  tags: []
"Ps28,5":
  text: "Skoro nie zważają na czyny PANA ani na dzieła jego rąk, on zniszczy ich i nie odbuduje."
  tags: []
"Ps28,6":
  text: "Błogosławiony niech będzie PAN, bo wysłuchał głosu mego błagania."
  tags: []
"Ps28,7":
  text: "PAN jest moją siłą i tarczą, moje serce jemu zaufało i doznałem pomocy; dlatego moje serce się rozweseliło i moją pieśnią będę go chwalić."
  tags: []
"Ps28,8":
  text: "PAN jest siłą dla swoich i twierdzą zbawienia swego pomazańca."
  tags: []
"Ps28,9":
  text: "Wybaw twój lud, PANIE, błogosław twemu dziedzictwu, paś ich i nieś na wieki."
  tags: []
