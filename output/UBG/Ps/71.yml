"Ps71,1": "W tobie, PANIE, pokładam ufność, niech nigdy nie będę zawstydzony."
"Ps71,2": "Według swej sprawiedliwości ocal mnie i wyzwól; nakłoń ku mnie ucha i wybaw mnie."
"Ps71,3": "Bądź mi skałą schronienia, gdzie zawsze mogę uciec; przykazałeś, aby mnie wybawiono, bo ty jesteś moją skałą i twierdzą."
"Ps71,4": "Mój Boże, wyzwól mnie z ręki niegodziwego, z ręki przewrotnego i ciemiężyciela."
"Ps71,5": "Ty bowiem jesteś moją nadzieją, Panie BOŻE, moją ufnością od młodości."
"Ps71,6": "Ty byłeś moją podporą od narodzin, ty mnie wyprowadziłeś z łona mojej matki; w tobie zawsze będzie moja chwała."
"Ps71,7": "Dla wielu jestem jakby cudem, lecz ty jesteś moim potężnym schronieniem."
"Ps71,8": "Niech moje usta będą pełne twojej chwały, twojej sławy przez cały dzień."
"Ps71,9": "Nie odrzucaj mnie w czasie starości; gdy ustanie moja siła, nie opuszczaj mnie."
"Ps71,10": "Moi wrogowie bowiem mówili przeciwko mnie, a ci, którzy czyhają na moją duszę, wspólnie się naradzają;"
"Ps71,11": "Mówiąc: Bóg go opuścił, gońcie go i schwytajcie, bo nie ma nikogo, kto by go ocalił."
"Ps71,12": "Boże, nie oddalaj się ode mnie; mój Boże, pospiesz mi na pomoc."
"Ps71,13": "Niech się zawstydzą i zginą przeciwnicy mojej duszy, niech się okryją hańbą i wstydem ci, którzy szukają mego nieszczęścia."
"Ps71,14": "Ja zaś zawsze będę ufał i jeszcze bardziej pomnożę twoją chwałę."
"Ps71,15": "Moje usta głosić będą twoją sprawiedliwość i twoje zbawienie przez cały dzień, choć nie znam ich miary."
"Ps71,16": "Pójdę w wielkiej mocy Pana BOGA, będę wspominał tylko twoją sprawiedliwość."
"Ps71,17": "Boże, uczyłeś mnie od mojej młodości i dotąd głoszę twoje cudowne dzieła."
"Ps71,18": "Dlatego i w starości, gdy będę już siwy, nie opuszczaj mnie, Boże, aż opowiem o twojej mocy temu pokoleniu i wszystkim potomkom o twojej potędze."
"Ps71,19": "Twoja sprawiedliwość, Boże, jest wywyższona, czynisz wielkie rzeczy; Boże, któż jest podobny do ciebie?"
"Ps71,20": "Zesłałeś na mnie wielkie i ciężkie utrapienia, lecz znowu przywrócisz mi życie i z głębi ziemi znów mnie wydobędziesz."
"Ps71,21": "Pomnożysz moje dostojeństwo i znowu mnie pocieszysz."
"Ps71,22": "A ja na instrumentach muzycznych będę wysławiać ciebie i twoją prawdę, mój Boże; będę ci śpiewał z harfą, Święty Izraela!"
"Ps71,23": "Rozradują się moje wargi, gdy będę ci śpiewał, i moja dusza, którą odkupiłeś."
"Ps71,24": "Również mój język będzie głosił przez cały dzień twoją sprawiedliwość, bo okryli się wstydem i hańbą ci, którzy szukali mego nieszczęścia."
