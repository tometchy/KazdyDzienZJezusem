"Ps82,1": "Bóg stoi w zgromadzeniu Bożym, pośród bogów sprawuje sąd:"
"Ps82,2": "Jak długo będziecie sądzić niesprawiedliwie i trzymać stronę niegodziwych? Sela."
"Ps82,3": "Bierzcie w obronę ubogiego i sierotę, oddajcie sprawiedliwość strapionemu i potrzebującemu."
"Ps82,4": "Wyzwólcie biedaka i nędzarza, ocalcie go z ręki niegodziwych."
"Ps82,5": "Lecz oni nic nie wiedzą i nie rozumieją, ciągle chodzą w ciemności; zachwiały się wszystkie fundamenty ziemi."
"Ps82,6": "Powiedziałem: Jesteście bogami i wszyscy wy jesteście synami Najwyższego."
"Ps82,7": "Lecz pomrzecie jak inni ludzie i upadniecie jak jeden z książąt."
"Ps82,8": "Powstań, Boże, osądź ziemię, bo ty otrzymasz w dziedzictwo wszystkie narody."
