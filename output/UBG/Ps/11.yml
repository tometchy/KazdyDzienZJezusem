"Ps11,1": "W PANU pokładam ufność. Jakże więc możecie mówić mojej duszy: Odleć jak ptak na twoją górę?"
"Ps11,2": "Bo oto niegodziwi napinają łuk, kładą strzałę na cięciwę, aby w ciemności strzelać do tych, którzy są prawego serca."
"Ps11,3": "Gdy zostaną zburzone fundamenty, cóż może zrobić sprawiedliwy?"
"Ps11,4": "PAN jest w swym świętym przybytku, tron PANA jest w niebie, jego oczy patrzą, jego powieki badają synów ludzkich."
"Ps11,5": "PAN doświadcza sprawiedliwego, ale jego dusza nienawidzi niegodziwego i tego, kto kocha bezprawie."
"Ps11,6": "Spuści na niegodziwych deszcz sideł, ognia i siarki, a palący wicher będzie udziałem ich kielicha."
"Ps11,7": "Bo sprawiedliwy PAN kocha sprawiedliwość, jego oczy patrzą na prawego."
