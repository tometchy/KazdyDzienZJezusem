"Ps11,1":
  text: "W PANU pokładam ufność. Jakże więc możecie mówić mojej duszy: Odleć jak ptak na twoją górę?"
  tags: []
"Ps11,2":
  text: "Bo oto niegodziwi napinają łuk, kładą strzałę na cięciwę, aby w ciemności strzelać do tych, którzy są prawego serca."
  tags: []
"Ps11,3":
  text: "Gdy zostaną zburzone fundamenty, cóż może zrobić sprawiedliwy?"
  tags: []
"Ps11,4":
  text: "PAN jest w swym świętym przybytku, tron PANA jest w niebie, jego oczy patrzą, jego powieki badają synów ludzkich."
  tags: []
"Ps11,5":
  text: "PAN doświadcza sprawiedliwego, ale jego dusza nienawidzi niegodziwego i tego, kto kocha bezprawie."
  tags: []
"Ps11,6":
  text: "Spuści na niegodziwych deszcz sideł, ognia i siarki, a palący wicher będzie udziałem ich kielicha."
  tags: []
"Ps11,7":
  text: "Bo sprawiedliwy PAN kocha sprawiedliwość, jego oczy patrzą na prawego."
  tags: []
