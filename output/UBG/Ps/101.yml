"Ps101,1":
  text: "Będę śpiewał o miłosierdziu i sądzie; tobie, PANIE, będę śpiewać."
  tags: []
"Ps101,2":
  text: "Kroczyć będę mądrze drogą prawą. Kiedy przyjdziesz do mnie? Będę postępował w swoim domu w prawości serca."
  tags: []
"Ps101,3":
  text: "Nie będę stawiał przed oczami niegodziwej rzeczy; nienawidzę czynów ludzi występnych, nie przylgną one do mnie."
  tags: []
"Ps101,4":
  text: "Serce przewrotne odstąpi ode mnie, nie chcę znać złego."
  tags: []
"Ps101,5":
  text: "Zgładzę tego, który potajemnie oczernia swego bliźniego, nie zniosę wyniosłych oczu i nadętego serca."
  tags: []
"Ps101,6":
  text: "Moje oczy zwrócone będą na wiernych tej ziemi, aby mieszkali ze mną; kto chodzi drogą prawą, ten będzie mi służyć."
  tags: []
"Ps101,7":
  text: "Nie zamieszka w moim domu oszust, kłamca nie ostoi się przed mymi oczyma."
  tags: []
"Ps101,8":
  text: "Każdego ranka będę tępić wszystkich niegodziwych na ziemi, aby tak wykorzenić z miasta PANA wszystkich złoczyńców."
  tags: []
