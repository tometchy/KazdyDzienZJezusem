"Ps101,1": "Będę śpiewał o miłosierdziu i sądzie; tobie, PANIE, będę śpiewać."
"Ps101,2": "Kroczyć będę mądrze drogą prawą. Kiedy przyjdziesz do mnie? Będę postępował w swoim domu w prawości serca."
"Ps101,3": "Nie będę stawiał przed oczami niegodziwej rzeczy; nienawidzę czynów ludzi występnych, nie przylgną one do mnie."
"Ps101,4": "Serce przewrotne odstąpi ode mnie, nie chcę znać złego."
"Ps101,5": "Zgładzę tego, który potajemnie oczernia swego bliźniego, nie zniosę wyniosłych oczu i nadętego serca."
"Ps101,6": "Moje oczy zwrócone będą na wiernych tej ziemi, aby mieszkali ze mną; kto chodzi drogą prawą, ten będzie mi służyć."
"Ps101,7": "Nie zamieszka w moim domu oszust, kłamca nie ostoi się przed mymi oczyma."
"Ps101,8": "Każdego ranka będę tępić wszystkich niegodziwych na ziemi, aby tak wykorzenić z miasta PANA wszystkich złoczyńców."
