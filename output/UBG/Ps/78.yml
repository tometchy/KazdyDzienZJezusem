"Ps78,1":
  text: "Słuchaj, mój ludu, mego prawa, nakłońcie uszu ku słowom moich ust."
  tags: []
"Ps78,2":
  text: "Otworzę moje usta do przypowieści, opowiem starodawne tajemnice;"
  tags: []
"Ps78,3":
  text: "Cośmy słyszeli i poznali i co nam opowiadali nasi ojcowie."
  tags: []
"Ps78,4":
  text: "Nie zataimy tego przed ich synami, opowiemy przyszłemu pokoleniu o chwale PANA, o jego mocy i cudach, które czynił."
  tags: []
"Ps78,5":
  text: "Ustanowił bowiem świadectwo w Jakubie, nadał prawo w Izraelu i nakazał naszym ojcom, aby je oznajmiali swoim synom;"
  tags: []
"Ps78,6":
  text: "Aby poznało przyszłe pokolenie, synowie, którzy się urodzą; aby powstawszy, przekazywali je swoim synom;"
  tags: []
"Ps78,7":
  text: "Żeby pokładali w Bogu nadzieję i nie zapominali o dziełach Boga, lecz strzegli jego przykazań;"
  tags: []
"Ps78,8":
  text: "Żeby nie byli, jak ich ojcowie, pokoleniem opornym i nieposłusznym; pokoleniem, które nie przygotowało swego serca i którego duch nie był wierny Bogu."
  tags: []
"Ps78,9":
  text: "Synowie Efraima, uzbrojeni i wyposażeni w łuki, w dniu bitwy wycofali się."
  tags: []
"Ps78,10":
  text: "Bo nie strzegli przymierza Boga i nie chcieli postępować według jego prawa."
  tags: []
"Ps78,11":
  text: "Zapomnieli o jego dziełach i cudach, które im ukazał."
  tags: []
"Ps78,12":
  text: "Przed ich ojcami czynił cuda w ziemi Egiptu, na polu Soanu."
  tags: []
"Ps78,13":
  text: "Rozdzielił morze i przeprowadził ich, i sprawił, że wody stanęły jak wał."
  tags: []
"Ps78,14":
  text: "Prowadził ich w obłoku za dnia, a całą noc w blasku ognia."
  tags: []
"Ps78,15":
  text: "Rozszczepił skały na pustyni i napoił ich jakby z wielkich głębin."
  tags: []
"Ps78,16":
  text: "Wydobył strumienie ze skały i sprawił, że wody płynęły jak rzeki."
  tags: []
"Ps78,17":
  text: "Lecz oni jeszcze więcej grzeszyli przeciwko niemu i pobudzili do gniewu Najwyższego na pustyni;"
  tags: []
"Ps78,18":
  text: "I wystawiali Boga na próbę w swych sercach, żądając pokarmu według swego pragnienia."
  tags: []
"Ps78,19":
  text: "I mówili przeciwko Bogu tymi słowy: Czy Bóg może zastawić stół na tej pustyni?"
  tags: []
"Ps78,20":
  text: "Oto uderzył w skałę i wypłynęły wody, i wezbrały strumienie; czy będzie mógł też dać chleb? Czy przygotuje mięso swemu ludowi?"
  tags: []
"Ps78,21":
  text: "Gdy PAN to usłyszał, rozgniewał się i ogień zapłonął przeciw Jakubowi, i gniew wybuchnął przeciw Izraelowi;"
  tags: []
"Ps78,22":
  text: "Bo nie uwierzyli Bogu i nie zaufali jego zbawieniu;"
  tags: []
"Ps78,23":
  text: "Choć rozkazał chmurom w górze i bramy nieba otworzył."
  tags: []
"Ps78,24":
  text: "I zesłał im jak deszcz mannę do jedzenia, i zboże z nieba im dał."
  tags: []
"Ps78,25":
  text: "Człowiek jadł chleb anielski; zesłał im pokarm do syta."
  tags: []
"Ps78,26":
  text: "Wzbudził na niebie wiatr ze wschodu i sprowadził swą mocą wiatr południowy."
  tags: []
"Ps78,27":
  text: "Zesłał im mięso jak pył i ptactwo skrzydlate jak piasek morski."
  tags: []
"Ps78,28":
  text: "Spadło ono pośrodku ich obozu, wokół ich namiotów."
  tags: []
"Ps78,29":
  text: "Jedli i w pełni się nasycili; dał im, czego pragnęli."
  tags: []
"Ps78,30":
  text: "A gdy jeszcze nie zaspokoili swego pragnienia, gdy jeszcze pokarm był w ich ustach;"
  tags: []
"Ps78,31":
  text: "Spadł na nich gniew Boży i zabił ich tłustych, a znakomitszych z Izraela powalił."
  tags: []
"Ps78,32":
  text: "Mimo to nadal grzeszyli i nie wierzyli jego cudom;"
  tags: []
"Ps78,33":
  text: "Dlatego sprawił, że ich dni przemijały w marności, a ich lata – w trwodze."
  tags: []
"Ps78,34":
  text: "Gdy ich zabijał, szukali go; nawracali się i o świcie szukali Boga;"
  tags: []
"Ps78,35":
  text: "Przypominali sobie, że Bóg jest ich skałą, że Bóg Najwyższy – ich Odkupicielem;"
  tags: []
"Ps78,36":
  text: "Pochlebiali mu jednak swoimi ustami i okłamywali go swym językiem;"
  tags: []
"Ps78,37":
  text: "A ich serce nie było przed nim szczere i nie byli wierni jego przymierzu."
  tags: []
"Ps78,38":
  text: "On jednak, będąc miłosiernym, przebaczał ich nieprawości i nie wytracał ich; często odwracał swój gniew i nie pobudzał całej swej zapalczywości;"
  tags: []
"Ps78,39":
  text: "Bo pamiętał, że są ciałem; wiatrem, który ulatuje i nie wraca."
  tags: []
"Ps78,40":
  text: "Jak często pobudzali go do gniewu na pustyni i zasmucali go na pustkowiu!"
  tags: []
"Ps78,41":
  text: "Odwracali się i wystawiali Boga na próbę, i stawiali granice Świętemu Izraela."
  tags: []
"Ps78,42":
  text: "Nie pamiętali jego ręki ani dnia, w którym ich wybawił z utrapienia;"
  tags: []
"Ps78,43":
  text: "Gdy czynił swe znaki w Egipcie i swe cuda na polu Soanu;"
  tags: []
"Ps78,44":
  text: "Gdy zamienił w krew ich rzeki i ich strumienie, tak że nie mogli z nich pić."
  tags: []
"Ps78,45":
  text: "Zesłał na nich rozmaite muchy, aby ich kąsały, i żaby, aby ich niszczyły;"
  tags: []
"Ps78,46":
  text: "I dał robactwu ich plony, a ich pracę szarańczy."
  tags: []
"Ps78,47":
  text: "Zniszczył gradem ich winorośle, a sykomory szronem."
  tags: []
"Ps78,48":
  text: "Ich bydło wydał na pastwę gradu, a ich stada na pastwę błyskawic."
  tags: []
"Ps78,49":
  text: "Wylał na nich żar swojego gniewu, zapalczywość, oburzenie i udrękę, zesławszy na nich złych aniołów."
  tags: []
"Ps78,50":
  text: "Otworzył drogę dla swego gniewu, nie zachował ich duszy od śmierci, a ich życie wydał zarazie;"
  tags: []
"Ps78,51":
  text: "Wytracił wszystko pierworodne w Egipcie, pierwociny ich mocy w namiotach Chama;"
  tags: []
"Ps78,52":
  text: "Ale swój lud wyprowadził jak owce i wiódł ich po pustyni jak stado."
  tags: []
"Ps78,53":
  text: "Prowadził ich bezpiecznie, tak że się nie lękali, a ich wrogów przykryło morze;"
  tags: []
"Ps78,54":
  text: "I przyprowadził ich do swej świętej granicy; do góry, którą nabyła jego prawica."
  tags: []
"Ps78,55":
  text: "Wypędził przed nimi narody, sznurem wyznaczył im dziedzictwo, żeby pokolenia Izraela mieszkały w swoich namiotach."
  tags: []
"Ps78,56":
  text: "Oni jednak wystawiali na próbę i pobudzali do gniewu Boga Najwyższego, i nie strzegli jego świadectw."
  tags: []
"Ps78,57":
  text: "Lecz odwrócili się i postępowali przewrotnie jak ich ojcowie, schodzili z drogi jak łuk zawodny."
  tags: []
"Ps78,58":
  text: "Pobudzali go bowiem do gniewu przez swe wyżyny i rzeźbionymi posągami wzbudzali jego zazdrość."
  tags: []
"Ps78,59":
  text: "Gdy Bóg to usłyszał, rozgniewał się i wielce wzgardził Izraelem."
  tags: []
"Ps78,60":
  text: "I opuścił przybytek w Szilo; namiot, który rozbił wśród ludzi;"
  tags: []
"Ps78,61":
  text: "I oddał w niewolę swoją moc i swoją chwałę w ręce wroga."
  tags: []
"Ps78,62":
  text: "Wydał swój lud pod miecz i rozgniewał się na swoje dziedzictwo."
  tags: []
"Ps78,63":
  text: "Ich młodzieńców pochłonął ogień, a ich dziewic nie wydano za mąż."
  tags: []
"Ps78,64":
  text: "Ich kapłani padli od miecza, a ich wdowy nie lamentowały."
  tags: []
"Ps78,65":
  text: "Lecz potem Pan ocknął się jak ze snu, jak mocarz wykrzykujący od wina."
  tags: []
"Ps78,66":
  text: "I uderzył na tyły swoich wrogów, okrył ich wieczną hańbą."
  tags: []
"Ps78,67":
  text: "Ale choć wzgardził namiotem Józefa i pokolenia Efraima nie wybrał;"
  tags: []
"Ps78,68":
  text: "Jednak wybrał pokolenie Judy, górę Syjon, którą umiłował."
  tags: []
"Ps78,69":
  text: "I zbudował swoją świątynię jak wysoki pałac; jak ziemię, którą ugruntował na wieki."
  tags: []
"Ps78,70":
  text: "Wybrał też Dawida, swego sługę; wziął go z owczych zagród;"
  tags: []
"Ps78,71":
  text: "Przywołał go, gdy chodził za karmiącymi owcami, aby pasł Jakuba, jego lud, i Izraela, jego dziedzictwo."
  tags: []
"Ps78,72":
  text: "A on ich pasł w prawości swego serca i prowadził ich roztropną ręką."
  tags: []
