"Ps78,1": "Słuchaj, mój ludu, mego prawa, nakłońcie uszu ku słowom moich ust."
"Ps78,2": "Otworzę moje usta do przypowieści, opowiem starodawne tajemnice;"
"Ps78,3": "Cośmy słyszeli i poznali i co nam opowiadali nasi ojcowie."
"Ps78,4": "Nie zataimy tego przed ich synami, opowiemy przyszłemu pokoleniu o chwale PANA, o jego mocy i cudach, które czynił."
"Ps78,5": "Ustanowił bowiem świadectwo w Jakubie, nadał prawo w Izraelu i nakazał naszym ojcom, aby je oznajmiali swoim synom;"
"Ps78,6": "Aby poznało przyszłe pokolenie, synowie, którzy się urodzą; aby powstawszy, przekazywali je swoim synom;"
"Ps78,7": "Żeby pokładali w Bogu nadzieję i nie zapominali o dziełach Boga, lecz strzegli jego przykazań;"
"Ps78,8": "Żeby nie byli, jak ich ojcowie, pokoleniem opornym i nieposłusznym; pokoleniem, które nie przygotowało swego serca i którego duch nie był wierny Bogu."
"Ps78,9": "Synowie Efraima, uzbrojeni i wyposażeni w łuki, w dniu bitwy wycofali się."
"Ps78,10": "Bo nie strzegli przymierza Boga i nie chcieli postępować według jego prawa."
"Ps78,11": "Zapomnieli o jego dziełach i cudach, które im ukazał."
"Ps78,12": "Przed ich ojcami czynił cuda w ziemi Egiptu, na polu Soanu."
"Ps78,13": "Rozdzielił morze i przeprowadził ich, i sprawił, że wody stanęły jak wał."
"Ps78,14": "Prowadził ich w obłoku za dnia, a całą noc w blasku ognia."
"Ps78,15": "Rozszczepił skały na pustyni i napoił ich jakby z wielkich głębin."
"Ps78,16": "Wydobył strumienie ze skały i sprawił, że wody płynęły jak rzeki."
"Ps78,17": "Lecz oni jeszcze więcej grzeszyli przeciwko niemu i pobudzili do gniewu Najwyższego na pustyni;"
"Ps78,18": "I wystawiali Boga na próbę w swych sercach, żądając pokarmu według swego pragnienia."
"Ps78,19": "I mówili przeciwko Bogu tymi słowy: Czy Bóg może zastawić stół na tej pustyni?"
"Ps78,20": "Oto uderzył w skałę i wypłynęły wody, i wezbrały strumienie; czy będzie mógł też dać chleb? Czy przygotuje mięso swemu ludowi?"
"Ps78,21": "Gdy PAN to usłyszał, rozgniewał się i ogień zapłonął przeciw Jakubowi, i gniew wybuchnął przeciw Izraelowi;"
"Ps78,22": "Bo nie uwierzyli Bogu i nie zaufali jego zbawieniu;"
"Ps78,23": "Choć rozkazał chmurom w górze i bramy nieba otworzył."
"Ps78,24": "I zesłał im jak deszcz mannę do jedzenia, i zboże z nieba im dał."
"Ps78,25": "Człowiek jadł chleb anielski; zesłał im pokarm do syta."
"Ps78,26": "Wzbudził na niebie wiatr ze wschodu i sprowadził swą mocą wiatr południowy."
"Ps78,27": "Zesłał im mięso jak pył i ptactwo skrzydlate jak piasek morski."
"Ps78,28": "Spadło ono pośrodku ich obozu, wokół ich namiotów."
"Ps78,29": "Jedli i w pełni się nasycili; dał im, czego pragnęli."
"Ps78,30": "A gdy jeszcze nie zaspokoili swego pragnienia, gdy jeszcze pokarm był w ich ustach;"
"Ps78,31": "Spadł na nich gniew Boży i zabił ich tłustych, a znakomitszych z Izraela powalił."
"Ps78,32": "Mimo to nadal grzeszyli i nie wierzyli jego cudom;"
"Ps78,33": "Dlatego sprawił, że ich dni przemijały w marności, a ich lata – w trwodze."
"Ps78,34": "Gdy ich zabijał, szukali go; nawracali się i o świcie szukali Boga;"
"Ps78,35": "Przypominali sobie, że Bóg jest ich skałą, że Bóg Najwyższy – ich Odkupicielem;"
"Ps78,36": "Pochlebiali mu jednak swoimi ustami i okłamywali go swym językiem;"
"Ps78,37": "A ich serce nie było przed nim szczere i nie byli wierni jego przymierzu."
"Ps78,38": "On jednak, będąc miłosiernym, przebaczał ich nieprawości i nie wytracał ich; często odwracał swój gniew i nie pobudzał całej swej zapalczywości;"
"Ps78,39": "Bo pamiętał, że są ciałem; wiatrem, który ulatuje i nie wraca."
"Ps78,40": "Jak często pobudzali go do gniewu na pustyni i zasmucali go na pustkowiu!"
"Ps78,41": "Odwracali się i wystawiali Boga na próbę, i stawiali granice Świętemu Izraela."
"Ps78,42": "Nie pamiętali jego ręki ani dnia, w którym ich wybawił z utrapienia;"
"Ps78,43": "Gdy czynił swe znaki w Egipcie i swe cuda na polu Soanu;"
"Ps78,44": "Gdy zamienił w krew ich rzeki i ich strumienie, tak że nie mogli z nich pić."
"Ps78,45": "Zesłał na nich rozmaite muchy, aby ich kąsały, i żaby, aby ich niszczyły;"
"Ps78,46": "I dał robactwu ich plony, a ich pracę szarańczy."
"Ps78,47": "Zniszczył gradem ich winorośle, a sykomory szronem."
"Ps78,48": "Ich bydło wydał na pastwę gradu, a ich stada na pastwę błyskawic."
"Ps78,49": "Wylał na nich żar swojego gniewu, zapalczywość, oburzenie i udrękę, zesławszy na nich złych aniołów."
"Ps78,50": "Otworzył drogę dla swego gniewu, nie zachował ich duszy od śmierci, a ich życie wydał zarazie;"
"Ps78,51": "Wytracił wszystko pierworodne w Egipcie, pierwociny ich mocy w namiotach Chama;"
"Ps78,52": "Ale swój lud wyprowadził jak owce i wiódł ich po pustyni jak stado."
"Ps78,53": "Prowadził ich bezpiecznie, tak że się nie lękali, a ich wrogów przykryło morze;"
"Ps78,54": "I przyprowadził ich do swej świętej granicy; do góry, którą nabyła jego prawica."
"Ps78,55": "Wypędził przed nimi narody, sznurem wyznaczył im dziedzictwo, żeby pokolenia Izraela mieszkały w swoich namiotach."
"Ps78,56": "Oni jednak wystawiali na próbę i pobudzali do gniewu Boga Najwyższego, i nie strzegli jego świadectw."
"Ps78,57": "Lecz odwrócili się i postępowali przewrotnie jak ich ojcowie, schodzili z drogi jak łuk zawodny."
"Ps78,58": "Pobudzali go bowiem do gniewu przez swe wyżyny i rzeźbionymi posągami wzbudzali jego zazdrość."
"Ps78,59": "Gdy Bóg to usłyszał, rozgniewał się i wielce wzgardził Izraelem."
"Ps78,60": "I opuścił przybytek w Szilo; namiot, który rozbił wśród ludzi;"
"Ps78,61": "I oddał w niewolę swoją moc i swoją chwałę w ręce wroga."
"Ps78,62": "Wydał swój lud pod miecz i rozgniewał się na swoje dziedzictwo."
"Ps78,63": "Ich młodzieńców pochłonął ogień, a ich dziewic nie wydano za mąż."
"Ps78,64": "Ich kapłani padli od miecza, a ich wdowy nie lamentowały."
"Ps78,65": "Lecz potem Pan ocknął się jak ze snu, jak mocarz wykrzykujący od wina."
"Ps78,66": "I uderzył na tyły swoich wrogów, okrył ich wieczną hańbą."
"Ps78,67": "Ale choć wzgardził namiotem Józefa i pokolenia Efraima nie wybrał;"
"Ps78,68": "Jednak wybrał pokolenie Judy, górę Syjon, którą umiłował."
"Ps78,69": "I zbudował swoją świątynię jak wysoki pałac; jak ziemię, którą ugruntował na wieki."
"Ps78,70": "Wybrał też Dawida, swego sługę; wziął go z owczych zagród;"
"Ps78,71": "Przywołał go, gdy chodził za karmiącymi owcami, aby pasł Jakuba, jego lud, i Izraela, jego dziedzictwo."
"Ps78,72": "A on ich pasł w prawości swego serca i prowadził ich roztropną ręką."
