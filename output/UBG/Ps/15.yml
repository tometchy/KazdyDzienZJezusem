"Ps15,1": "PANIE, kto będzie przebywał w twoim przybytku? Kto zamieszka na twojej świętej górze?"
"Ps15,2": "Ten, kto postępuje nienagannie i czyni sprawiedliwość, a w swoim sercu mówi prawdę;"
"Ps15,3": "Kto nie obmawia swym językiem, nie wyrządza bliźniemu nic złego, nie znieważa bliźniego;"
"Ps15,4": "Ten, przed którego oczami bezbożny jest wzgardzony, a który szanuje tych, co się boją PANA; kto, choć przysięga na własną niekorzyść, nie wycofuje się;"
"Ps15,5": "Kto swych pieniędzy nie pożycza na lichwę i nie daje się przekupić przeciwko niewinnemu. Kto tak postępuje, nigdy się nie zachwieje."
