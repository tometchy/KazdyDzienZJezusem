"Ps15,1":
  text: "PANIE, kto będzie przebywał w twoim przybytku? Kto zamieszka na twojej świętej górze?"
  tags: []
"Ps15,2":
  text: "Ten, kto postępuje nienagannie i czyni sprawiedliwość, a w swoim sercu mówi prawdę;"
  tags: []
"Ps15,3":
  text: "Kto nie obmawia swym językiem, nie wyrządza bliźniemu nic złego, nie znieważa bliźniego;"
  tags: []
"Ps15,4":
  text: "Ten, przed którego oczami bezbożny jest wzgardzony, a który szanuje tych, co się boją PANA; kto, choć przysięga na własną niekorzyść, nie wycofuje się;"
  tags: []
"Ps15,5":
  text: "Kto swych pieniędzy nie pożycza na lichwę i nie daje się przekupić przeciwko niewinnemu. Kto tak postępuje, nigdy się nie zachwieje."
  tags: []
