"Ps94,1": "Boże zemsty, PANIE Boże zemsty, objaw się!"
"Ps94,2": "Powstań, Sędzio całej ziemi, odpłać pysznym."
"Ps94,3": "Jak długo niegodziwi, PANIE, jak długo niegodziwi będą się radować?"
"Ps94,4": "Jak długo będą pleść, mówić zuchwale i chełpić się wszyscy czyniący nieprawość?"
"Ps94,5": "Depczą twój lud, PANIE, i gnębią twoje dziedzictwo."
"Ps94,6": "Mordują wdowy i przybysza, zabijają sieroty."
"Ps94,7": "I mówią: PAN tego nie widzi, nie dostrzega tego Bóg Jakuba."
"Ps94,8": "Zrozumcie, nierozumni wśród ludu! A wy, głupcy, kiedy zmądrzejecie?"
"Ps94,9": "Czy ten, który wszczepił ucho, nie słyszy? Czy ten, który ukształtował oko, nie widzi?"
"Ps94,10": "Czy ten, który chłoszcze narody, nie będzie karał? Ten, który uczy człowieka wiedzy, czy nie wie?"
"Ps94,11": "PAN zna myśli ludzkie; wie, że są marnością."
"Ps94,12": "Błogosławiony mąż, którego ty chłoszczesz, PANIE, i uczysz go twym prawem;"
"Ps94,13": "Aby dać mu odpocząć od złych dni, aż będzie wykopany dół dla niegodziwego."
"Ps94,14": "PAN bowiem nie odrzuci swego ludu i nie opuści swego dziedzictwa."
"Ps94,15": "Ale sąd powróci do sprawiedliwości, a wszyscy serca prawego pójdą za nim."
"Ps94,16": "Któż stanie przy mnie przeciwko złoczyńcom? Kto ujmie się za mną przeciwko czyniącym nieprawość?"
"Ps94,17": "Gdyby PAN nie przyszedł mi z pomocą, moja dusza przebywałaby w milczeniu."
"Ps94,18": "Gdy powiedziałem: Moja noga się chwieje, twoje miłosierdzie, PANIE, mnie wsparło."
"Ps94,19": "W niezliczonych myślach mego serca twoje pociechy rozweselają moją duszę."
"Ps94,20": "Czy sprzymierzy się z tobą tron nieprawości, który wyrządza krzywdę pod pozorem prawa?"
"Ps94,21": "Zbierają się przeciw duszy sprawiedliwego i krew niewinną potępiają."
"Ps94,22": "Lecz PAN jest moją twierdzą, mój Bóg – skałą mojej ucieczki."
"Ps94,23": "On obróci przeciwko nim ich nieprawość i za ich zło ich wytraci; wytraci ich PAN, nasz Bóg."
