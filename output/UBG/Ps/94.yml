"Ps94,1":
  text: "Boże zemsty, PANIE Boże zemsty, objaw się!"
  tags: []
"Ps94,2":
  text: "Powstań, Sędzio całej ziemi, odpłać pysznym."
  tags: []
"Ps94,3":
  text: "Jak długo niegodziwi, PANIE, jak długo niegodziwi będą się radować?"
  tags: []
"Ps94,4":
  text: "Jak długo będą pleść, mówić zuchwale i chełpić się wszyscy czyniący nieprawość?"
  tags: []
"Ps94,5":
  text: "Depczą twój lud, PANIE, i gnębią twoje dziedzictwo."
  tags: []
"Ps94,6":
  text: "Mordują wdowy i przybysza, zabijają sieroty."
  tags: []
"Ps94,7":
  text: "I mówią: PAN tego nie widzi, nie dostrzega tego Bóg Jakuba."
  tags: []
"Ps94,8":
  text: "Zrozumcie, nierozumni wśród ludu! A wy, głupcy, kiedy zmądrzejecie?"
  tags: []
"Ps94,9":
  text: "Czy ten, który wszczepił ucho, nie słyszy? Czy ten, który ukształtował oko, nie widzi?"
  tags: []
"Ps94,10":
  text: "Czy ten, który chłoszcze narody, nie będzie karał? Ten, który uczy człowieka wiedzy, czy nie wie?"
  tags: []
"Ps94,11":
  text: "PAN zna myśli ludzkie; wie, że są marnością."
  tags: []
"Ps94,12":
  text: "Błogosławiony mąż, którego ty chłoszczesz, PANIE, i uczysz go twym prawem;"
  tags: []
"Ps94,13":
  text: "Aby dać mu odpocząć od złych dni, aż będzie wykopany dół dla niegodziwego."
  tags: []
"Ps94,14":
  text: "PAN bowiem nie odrzuci swego ludu i nie opuści swego dziedzictwa."
  tags: []
"Ps94,15":
  text: "Ale sąd powróci do sprawiedliwości, a wszyscy serca prawego pójdą za nim."
  tags: []
"Ps94,16":
  text: "Któż stanie przy mnie przeciwko złoczyńcom? Kto ujmie się za mną przeciwko czyniącym nieprawość?"
  tags: []
"Ps94,17":
  text: "Gdyby PAN nie przyszedł mi z pomocą, moja dusza przebywałaby w milczeniu."
  tags: []
"Ps94,18":
  text: "Gdy powiedziałem: Moja noga się chwieje, twoje miłosierdzie, PANIE, mnie wsparło."
  tags: []
"Ps94,19":
  text: "W niezliczonych myślach mego serca twoje pociechy rozweselają moją duszę."
  tags: []
"Ps94,20":
  text: "Czy sprzymierzy się z tobą tron nieprawości, który wyrządza krzywdę pod pozorem prawa?"
  tags: []
"Ps94,21":
  text: "Zbierają się przeciw duszy sprawiedliwego i krew niewinną potępiają."
  tags: []
"Ps94,22":
  text: "Lecz PAN jest moją twierdzą, mój Bóg – skałą mojej ucieczki."
  tags: []
"Ps94,23":
  text: "On obróci przeciwko nim ich nieprawość i za ich zło ich wytraci; wytraci ich PAN, nasz Bóg."
  tags: []
