"Ps129,1":
  text: "Bardzo mnie uciskali od mojej młodości, niech powie teraz Izrael;"
  tags: []
"Ps129,2":
  text: "Bardzo mnie uciskali od mojej młodości, lecz mnie nie przemogli."
  tags: []
"Ps129,3":
  text: "Zorali mój grzbiet oracze i długie bruzdy porobili."
  tags: []
"Ps129,4":
  text: "Ale PAN jest sprawiedliwy; poprzecinał powrozy niegodziwych."
  tags: []
"Ps129,5":
  text: "Niech się zawstydzą i cofną wszyscy, którzy nienawidzą Syjonu."
  tags: []
"Ps129,6":
  text: "Będą jak trawa na dachu, która usycha, zanim zakwitnie;"
  tags: []
"Ps129,7":
  text: "Którą żniwiarz nie napełni swej garści ani swego naręcza ten, który wiąże snopy."
  tags: []
"Ps129,8":
  text: "I nie powiedzą przechodnie: Niech będzie z wami błogosławieństwo PANA albo: Błogosławimy wam w imię PANA."
  tags: []
