"Ps129,1": "Bardzo mnie uciskali od mojej młodości, niech powie teraz Izrael;"
"Ps129,2": "Bardzo mnie uciskali od mojej młodości, lecz mnie nie przemogli."
"Ps129,3": "Zorali mój grzbiet oracze i długie bruzdy porobili."
"Ps129,4": "Ale PAN jest sprawiedliwy; poprzecinał powrozy niegodziwych."
"Ps129,5": "Niech się zawstydzą i cofną wszyscy, którzy nienawidzą Syjonu."
"Ps129,6": "Będą jak trawa na dachu, która usycha, zanim zakwitnie;"
"Ps129,7": "Którą żniwiarz nie napełni swej garści ani swego naręcza ten, który wiąże snopy."
"Ps129,8": "I nie powiedzą przechodnie: Niech będzie z wami błogosławieństwo PANA albo: Błogosławimy wam w imię PANA."
