"Ps57,1":
  text: "Zmiłuj się nade mną, Boże, zmiłuj się nade mną, bo moja dusza ufa tobie; w cieniu twoich skrzydeł będę się chronił, aż przeminie nieszczęście."
  tags: []
"Ps57,2":
  text: "Będę wołał do Boga Najwyższego, do Boga, który doprowadzi moją sprawę do końca."
  tags: []
"Ps57,3":
  text: "On ześle pomoc z nieba i wybawi mnie od urągania tego, który chce mnie pochłonąć. Sela. Ześle mi Bóg swoje miłosierdzie i prawdę."
  tags: []
"Ps57,4":
  text: "Moja dusza przebywa wśród lwów; leżę wśród płonących, wśród synów ludzkich, których zęby są jak włócznie i strzały, a język jak miecz ostry."
  tags: []
"Ps57,5":
  text: "Bądź wywyższony, Boże, ponad niebiosa, a twoja chwała ponad całą ziemię."
  tags: []
"Ps57,6":
  text: "Zastawili sidła na moje kroki, zgnębili moją duszę, wykopali przede mną dół, ale sami do niego wpadli. Sela."
  tags: []
"Ps57,7":
  text: "Gotowe jest moje serce, Boże, gotowe jest moje serce; będę śpiewał i oddawał chwałę."
  tags: []
"Ps57,8":
  text: "Obudź się, moja chwało, obudź się, cytro i harfo; ja się zbudzę o świcie."
  tags: []
"Ps57,9":
  text: "Będę cię wysławiał wśród ludu, Panie, będę ci śpiewał wśród narodów."
  tags: []
"Ps57,10":
  text: "Bo wielkie jest twoje miłosierdzie, aż do niebios, i aż pod obłoki twoja prawda."
  tags: []
"Ps57,11":
  text: "Bądź wywyższony ponad niebiosa, Boże, a ponad całą ziemię twoja chwała."
  tags: []
