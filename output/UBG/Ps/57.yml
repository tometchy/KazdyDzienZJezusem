"Ps57,1": "Zmiłuj się nade mną, Boże, zmiłuj się nade mną, bo moja dusza ufa tobie; w cieniu twoich skrzydeł będę się chronił, aż przeminie nieszczęście."
"Ps57,2": "Będę wołał do Boga Najwyższego, do Boga, który doprowadzi moją sprawę do końca."
"Ps57,3": "On ześle pomoc z nieba i wybawi mnie od urągania tego, który chce mnie pochłonąć. Sela. Ześle mi Bóg swoje miłosierdzie i prawdę."
"Ps57,4": "Moja dusza przebywa wśród lwów; leżę wśród płonących, wśród synów ludzkich, których zęby są jak włócznie i strzały, a język jak miecz ostry."
"Ps57,5": "Bądź wywyższony, Boże, ponad niebiosa, a twoja chwała ponad całą ziemię."
"Ps57,6": "Zastawili sidła na moje kroki, zgnębili moją duszę, wykopali przede mną dół, ale sami do niego wpadli. Sela."
"Ps57,7": "Gotowe jest moje serce, Boże, gotowe jest moje serce; będę śpiewał i oddawał chwałę."
"Ps57,8": "Obudź się, moja chwało, obudź się, cytro i harfo; ja się zbudzę o świcie."
"Ps57,9": "Będę cię wysławiał wśród ludu, Panie, będę ci śpiewał wśród narodów."
"Ps57,10": "Bo wielkie jest twoje miłosierdzie, aż do niebios, i aż pod obłoki twoja prawda."
"Ps57,11": "Bądź wywyższony ponad niebiosa, Boże, a ponad całą ziemię twoja chwała."
