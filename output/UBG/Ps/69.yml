"Ps69,1":
  text: "Wybaw mnie, Boże, bo wody sięgają aż do mojej duszy."
  tags: []
"Ps69,2":
  text: "Grzęznę w głębokim błocie, gdzie nie ma dna; dostałem się w głębokie wody i nurt mnie porywa."
  tags: []
"Ps69,3":
  text: "Zmęczyłem się wołaniem, wyschło mi gardło; słabną moje oczy, gdy czekam na mojego Boga."
  tags: []
"Ps69,4":
  text: "Więcej niż włosów na mojej głowie jest tych, którzy mnie nienawidzą bez powodu; ci, którzy niesłusznie są moimi wrogami i chcą mnie zniszczyć, wzmocnili się; musiałem zapłacić za to, czego nie zabrałem."
  tags: []
"Ps69,5":
  text: "Boże, ty znasz moją głupotę, a moje grzechy nie są ukryte przed tobą."
  tags: []
"Ps69,6":
  text: "Niech nie zaznają wstydu z mego powodu ci, którzy ciebie oczekują, Panie BOŻE zastępów, niech nie rumienią się z mego powodu ci, którzy ciebie szukają, Boże Izraela."
  tags: []
"Ps69,7":
  text: "Bo dla ciebie znoszę urąganie, hańba okrywa moją twarz."
  tags: []
"Ps69,8":
  text: "Stałem się obcy dla moich braci i cudzoziemcem dla synów mojej matki;"
  tags: []
"Ps69,9":
  text: "Bo gorliwość o twój dom zżarła mnie i spadły na mnie urągania urągających tobie."
  tags: []
"Ps69,10":
  text: "Płakałem i umartwiałem postem swą duszę, a stało się to moją hańbą."
  tags: []
"Ps69,11":
  text: "Założyłem wór pokutny jako szatę i stałem się dla nich pośmiewiskiem."
  tags: []
"Ps69,12":
  text: "Mówili o mnie ci, którzy siedzą w bramie, i byłem tematem pieśni pijaków."
  tags: []
"Ps69,13":
  text: "Ale ja kieruję swoją modlitwę do ciebie, PANIE, w czasie pomyślnym; Boże, wysłuchaj mnie według twego wielkiego miłosierdzia, dla prawdy twego zbawienia."
  tags: []
"Ps69,14":
  text: "Uwolnij mnie z błota, abym nie ugrzązł; ocal mnie od tych, którzy mnie nienawidzą, i z głębokich wód."
  tags: []
"Ps69,15":
  text: "Niech nie zaleją mnie wezbrane wody ani nie pożre głębia i niech otchłań nie zamknie nade mną swej paszczy."
  tags: []
"Ps69,16":
  text: "Wysłuchaj mnie, PANIE, bo dobre jest twoje miłosierdzie, według twojej wielkiej litości spójrz na mnie."
  tags: []
"Ps69,17":
  text: "Nie zakrywaj twego oblicza przed swoim sługą, bo jestem w utrapieniu; wysłuchaj mnie czym prędzej."
  tags: []
"Ps69,18":
  text: "Zbliż się do mojej duszy i wybaw ją, odkup mnie ze względu na mych wrogów."
  tags: []
"Ps69,19":
  text: "Ty znasz moją hańbę, mój wstyd i niesławę, przed tobą są wszyscy moi wrogowie."
  tags: []
"Ps69,20":
  text: "Hańba złamała moje serce, ogarnęło mnie przygnębienie; oczekiwałem współczującego, ale go nie było; szukałem pocieszającego, ale nie znalazłem."
  tags: []
"Ps69,21":
  text: "Zamiast pokarmu podali mi żółć, a gdy pragnąłem, napoili mnie octem."
  tags: []
"Ps69,22":
  text: "Niech ich stół stanie się dla nich sidłem, a ich pomyślność – pułapką."
  tags: []
"Ps69,23":
  text: "Niech zaćmią się ich oczy, aby nie widzieli, a ich biodra niech się zawsze chwieją."
  tags: []
"Ps69,24":
  text: "Wylej na nich swoje oburzenie, a żar twego gniewu niech ich dosięgnie."
  tags: []
"Ps69,25":
  text: "Niech ich dom opustoszeje, w ich namiotach niech nikt nie mieszka."
  tags: []
"Ps69,26":
  text: "Bo prześladują tego, którego ty uderzyłeś, i rozpowiadają o boleściach tych, których zraniłeś."
  tags: []
"Ps69,27":
  text: "Dodaj nieprawość do ich nieprawości i niech nie dostąpią twojej sprawiedliwości."
  tags: []
"Ps69,28":
  text: "Niech będą wymazani z księgi żyjących i niech nie będą zapisani ze sprawiedliwymi."
  tags: []
"Ps69,29":
  text: "Ja zaś jestem strapiony i zbolały; niech twoje zbawienie, Boże, podniesie mnie."
  tags: []
"Ps69,30":
  text: "Będę chwalił imię Boga pieśnią, będę go wywyższał dziękczynieniem."
  tags: []
"Ps69,31":
  text: "I będzie to milsze PANU niż wół albo cielec rogaty z kopytami."
  tags: []
"Ps69,32":
  text: "Pokorni to ujrzą i rozradują się, ożyje serce szukających Boga."
  tags: []
"Ps69,33":
  text: "PAN bowiem wysłuchuje ubogich i swymi więźniami nie gardzi."
  tags: []
"Ps69,34":
  text: "Niech go chwalą niebiosa i ziemia, morze i wszystko, co się w nich porusza."
  tags: []
"Ps69,35":
  text: "Bóg bowiem wybawi Syjon i odbuduje miasta Judy; będą tam mieszkać i posiądą tę ziemię."
  tags: []
"Ps69,36":
  text: "Także i potomstwo jego sług ją odziedziczy i zamieszkają w niej ci, którzy miłują jego imię."
  tags: []
