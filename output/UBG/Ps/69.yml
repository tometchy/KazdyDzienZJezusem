"Ps69,1": "Wybaw mnie, Boże, bo wody sięgają aż do mojej duszy."
"Ps69,2": "Grzęznę w głębokim błocie, gdzie nie ma dna; dostałem się w głębokie wody i nurt mnie porywa."
"Ps69,3": "Zmęczyłem się wołaniem, wyschło mi gardło; słabną moje oczy, gdy czekam na mojego Boga."
"Ps69,4": "Więcej niż włosów na mojej głowie jest tych, którzy mnie nienawidzą bez powodu; ci, którzy niesłusznie są moimi wrogami i chcą mnie zniszczyć, wzmocnili się; musiałem zapłacić za to, czego nie zabrałem."
"Ps69,5": "Boże, ty znasz moją głupotę, a moje grzechy nie są ukryte przed tobą."
"Ps69,6": "Niech nie zaznają wstydu z mego powodu ci, którzy ciebie oczekują, Panie BOŻE zastępów, niech nie rumienią się z mego powodu ci, którzy ciebie szukają, Boże Izraela."
"Ps69,7": "Bo dla ciebie znoszę urąganie, hańba okrywa moją twarz."
"Ps69,8": "Stałem się obcy dla moich braci i cudzoziemcem dla synów mojej matki;"
"Ps69,9": "Bo gorliwość o twój dom zżarła mnie i spadły na mnie urągania urągających tobie."
"Ps69,10": "Płakałem i umartwiałem postem swą duszę, a stało się to moją hańbą."
"Ps69,11": "Założyłem wór pokutny jako szatę i stałem się dla nich pośmiewiskiem."
"Ps69,12": "Mówili o mnie ci, którzy siedzą w bramie, i byłem tematem pieśni pijaków."
"Ps69,13": "Ale ja kieruję swoją modlitwę do ciebie, PANIE, w czasie pomyślnym; Boże, wysłuchaj mnie według twego wielkiego miłosierdzia, dla prawdy twego zbawienia."
"Ps69,14": "Uwolnij mnie z błota, abym nie ugrzązł; ocal mnie od tych, którzy mnie nienawidzą, i z głębokich wód."
"Ps69,15": "Niech nie zaleją mnie wezbrane wody ani nie pożre głębia i niech otchłań nie zamknie nade mną swej paszczy."
"Ps69,16": "Wysłuchaj mnie, PANIE, bo dobre jest twoje miłosierdzie, według twojej wielkiej litości spójrz na mnie."
"Ps69,17": "Nie zakrywaj twego oblicza przed swoim sługą, bo jestem w utrapieniu; wysłuchaj mnie czym prędzej."
"Ps69,18": "Zbliż się do mojej duszy i wybaw ją, odkup mnie ze względu na mych wrogów."
"Ps69,19": "Ty znasz moją hańbę, mój wstyd i niesławę, przed tobą są wszyscy moi wrogowie."
"Ps69,20": "Hańba złamała moje serce, ogarnęło mnie przygnębienie; oczekiwałem współczującego, ale go nie było; szukałem pocieszającego, ale nie znalazłem."
"Ps69,21": "Zamiast pokarmu podali mi żółć, a gdy pragnąłem, napoili mnie octem."
"Ps69,22": "Niech ich stół stanie się dla nich sidłem, a ich pomyślność – pułapką."
"Ps69,23": "Niech zaćmią się ich oczy, aby nie widzieli, a ich biodra niech się zawsze chwieją."
"Ps69,24": "Wylej na nich swoje oburzenie, a żar twego gniewu niech ich dosięgnie."
"Ps69,25": "Niech ich dom opustoszeje, w ich namiotach niech nikt nie mieszka."
"Ps69,26": "Bo prześladują tego, którego ty uderzyłeś, i rozpowiadają o boleściach tych, których zraniłeś."
"Ps69,27": "Dodaj nieprawość do ich nieprawości i niech nie dostąpią twojej sprawiedliwości."
"Ps69,28": "Niech będą wymazani z księgi żyjących i niech nie będą zapisani ze sprawiedliwymi."
"Ps69,29": "Ja zaś jestem strapiony i zbolały; niech twoje zbawienie, Boże, podniesie mnie."
"Ps69,30": "Będę chwalił imię Boga pieśnią, będę go wywyższał dziękczynieniem."
"Ps69,31": "I będzie to milsze PANU niż wół albo cielec rogaty z kopytami."
"Ps69,32": "Pokorni to ujrzą i rozradują się, ożyje serce szukających Boga."
"Ps69,33": "PAN bowiem wysłuchuje ubogich i swymi więźniami nie gardzi."
"Ps69,34": "Niech go chwalą niebiosa i ziemia, morze i wszystko, co się w nich porusza."
"Ps69,35": "Bóg bowiem wybawi Syjon i odbuduje miasta Judy; będą tam mieszkać i posiądą tę ziemię."
"Ps69,36": "Także i potomstwo jego sług ją odziedziczy i zamieszkają w niej ci, którzy miłują jego imię."
