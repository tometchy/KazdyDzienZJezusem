"Ps73,1": "Doprawdy Bóg jest dobry dla Izraela; dla tych, którzy są czystego serca."
"Ps73,2": "Ale moje nogi niemal się potknęły, moje kroki omal się nie zachwiały;"
"Ps73,3": "Bo zazdrościłem głupcom, widząc pomyślność niegodziwych."
"Ps73,4": "Nie mają bowiem więzów aż do śmierci, ale w całości zostaje ich siła."
"Ps73,5": "Nie doznają trudu ludzkiego ani cierpień jak inni ludzie."
"Ps73,6": "Dlatego są opasani pychą jak złotym łańcuchem i odziani w okrucieństwo jak w szatę ozdobną."
"Ps73,7": "Ich oczy wystają od tłuszczu; mają więcej niż serce mogłoby sobie życzyć."
"Ps73,8": "Oddali się rozpuście i mówią przewrotnie o ucisku, mówią wyniośle."
"Ps73,9": "Zwracają swe usta przeciwko niebu, a ich język krąży po ziemi."
"Ps73,10": "Dlatego jego lud wraca dotąd i obficie leją się na nich wody;"
"Ps73,11": "Bo mówią: Jakże Bóg może o tym wiedzieć? Czy Najwyższy ma wiedzę?"
"Ps73,12": "Oto ci są niegodziwi, a powodzi im się na świecie i pomnażają bogactwa."
"Ps73,13": "A więc na próżno oczyściłem swoje serce i w niewinności obmywałem ręce."
"Ps73,14": "Cały dzień bowiem znoszę cierpienia i co rano jestem chłostany."
"Ps73,15": "Gdybym powiedział: Będę mówił tak samo, skrzywdziłbym ród twoich synów."
"Ps73,16": "Starałem się to rozumieć, ale było dla mnie zbyt trudne;"
"Ps73,17": "Aż wszedłem do świątyni Bożej i tu zrozumiałem, jaki jest ich koniec."
"Ps73,18": "Doprawdy na śliskich miejscach ich postawiłeś i strącasz ich na zatracenie."
"Ps73,19": "Oto jak doznali zguby! Nagle niszczeją, strawieni przerażeniem."
"Ps73,20": "Jak sen po przebudzeniu, Panie, gdy się ockniesz, wzgardzisz ich obrazem."
"Ps73,21": "Gdy gorycz miałem w sercu, a w nerkach czułem kłucie;"
"Ps73,22": "Byłem głupi i nic nie rozumiałem, byłem przed tobą jak zwierzę."
"Ps73,23": "A jednak zawsze jestem z tobą, bo mnie trzymałeś za prawą rękę."
"Ps73,24": "Poprowadzisz mnie według swej rady, a potem przyjmiesz mnie do chwały."
"Ps73,25": "Kogo innego mam w niebie? I na ziemi oprócz ciebie w nikim innym nie mam upodobania."
"Ps73,26": "Choć moje ciało i serce ustanie, Bóg jest skałą mego serca i moim dziedzictwem na wieki."
"Ps73,27": "Oto bowiem ci, którzy się oddalają od ciebie, zginą; wytracasz tych, którzy cudzołożą, odstępując od ciebie."
"Ps73,28": "Mnie zaś dobrze jest zbliżyć się do Boga; pokładam w Panu BOGU moją ufność, aby opowiadać wszystkie jego dzieła."
