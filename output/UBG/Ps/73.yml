"Ps73,1":
  text: "Doprawdy Bóg jest dobry dla Izraela; dla tych, którzy są czystego serca."
  tags: []
"Ps73,2":
  text: "Ale moje nogi niemal się potknęły, moje kroki omal się nie zachwiały;"
  tags: []
"Ps73,3":
  text: "Bo zazdrościłem głupcom, widząc pomyślność niegodziwych."
  tags: []
"Ps73,4":
  text: "Nie mają bowiem więzów aż do śmierci, ale w całości zostaje ich siła."
  tags: []
"Ps73,5":
  text: "Nie doznają trudu ludzkiego ani cierpień jak inni ludzie."
  tags: []
"Ps73,6":
  text: "Dlatego są opasani pychą jak złotym łańcuchem i odziani w okrucieństwo jak w szatę ozdobną."
  tags: []
"Ps73,7":
  text: "Ich oczy wystają od tłuszczu; mają więcej niż serce mogłoby sobie życzyć."
  tags: []
"Ps73,8":
  text: "Oddali się rozpuście i mówią przewrotnie o ucisku, mówią wyniośle."
  tags: []
"Ps73,9":
  text: "Zwracają swe usta przeciwko niebu, a ich język krąży po ziemi."
  tags: []
"Ps73,10":
  text: "Dlatego jego lud wraca dotąd i obficie leją się na nich wody;"
  tags: []
"Ps73,11":
  text: "Bo mówią: Jakże Bóg może o tym wiedzieć? Czy Najwyższy ma wiedzę?"
  tags: []
"Ps73,12":
  text: "Oto ci są niegodziwi, a powodzi im się na świecie i pomnażają bogactwa."
  tags: []
"Ps73,13":
  text: "A więc na próżno oczyściłem swoje serce i w niewinności obmywałem ręce."
  tags: []
"Ps73,14":
  text: "Cały dzień bowiem znoszę cierpienia i co rano jestem chłostany."
  tags: []
"Ps73,15":
  text: "Gdybym powiedział: Będę mówił tak samo, skrzywdziłbym ród twoich synów."
  tags: []
"Ps73,16":
  text: "Starałem się to rozumieć, ale było dla mnie zbyt trudne;"
  tags: []
"Ps73,17":
  text: "Aż wszedłem do świątyni Bożej i tu zrozumiałem, jaki jest ich koniec."
  tags: []
"Ps73,18":
  text: "Doprawdy na śliskich miejscach ich postawiłeś i strącasz ich na zatracenie."
  tags: []
"Ps73,19":
  text: "Oto jak doznali zguby! Nagle niszczeją, strawieni przerażeniem."
  tags: []
"Ps73,20":
  text: "Jak sen po przebudzeniu, Panie, gdy się ockniesz, wzgardzisz ich obrazem."
  tags: []
"Ps73,21":
  text: "Gdy gorycz miałem w sercu, a w nerkach czułem kłucie;"
  tags: []
"Ps73,22":
  text: "Byłem głupi i nic nie rozumiałem, byłem przed tobą jak zwierzę."
  tags: []
"Ps73,23":
  text: "A jednak zawsze jestem z tobą, bo mnie trzymałeś za prawą rękę."
  tags: []
"Ps73,24":
  text: "Poprowadzisz mnie według swej rady, a potem przyjmiesz mnie do chwały."
  tags: []
"Ps73,25":
  text: "Kogo innego mam w niebie? I na ziemi oprócz ciebie w nikim innym nie mam upodobania."
  tags: []
"Ps73,26":
  text: "Choć moje ciało i serce ustanie, Bóg jest skałą mego serca i moim dziedzictwem na wieki."
  tags: []
"Ps73,27":
  text: "Oto bowiem ci, którzy się oddalają od ciebie, zginą; wytracasz tych, którzy cudzołożą, odstępując od ciebie."
  tags: []
"Ps73,28":
  text: "Mnie zaś dobrze jest zbliżyć się do Boga; pokładam w Panu BOGU moją ufność, aby opowiadać wszystkie jego dzieła."
  tags: []
