"Ps6,1":
  text: "PANIE, nie karć mnie w swoim gniewie i nie karz mnie w swojej zapalczywości."
  tags: []
"Ps6,2":
  text: "Zmiłuj się nade mną, PANIE, bo jestem słaby; uzdrów mnie, PANIE, bo moje kości drżą;"
  tags: []
"Ps6,3":
  text: "I moja dusza bardzo się zatrwożyła; lecz ty, PANIE, jak długo jeszcze?"
  tags: []
"Ps6,4":
  text: "Zawróć, PANIE, ocal moją duszę; wybaw mnie ze względu na twe miłosierdzie."
  tags: []
"Ps6,5":
  text: "W śmierci bowiem nie ma pamięci o tobie, a w grobie któż cię będzie wysławiać?"
  tags: []
"Ps6,6":
  text: "Zmęczyłem się moim wzdychaniem, co noc zalewam łzami moje posłanie, moje łoże jest mokre od płaczu."
  tags: []
"Ps6,7":
  text: "Moje oko zaćmiło się od smutku, zestarzało się z powodu wszystkich moich wrogów."
  tags: []
"Ps6,8":
  text: "Odstąpcie ode mnie, wszyscy czyniący nieprawość, bo PAN usłyszał głos mego płaczu."
  tags: []
"Ps6,9":
  text: "Usłyszał PAN moją prośbę, PAN przyjął moją modlitwę."
  tags: []
"Ps6,10":
  text: "Niech się zawstydzą i bardzo zatrwożą wszyscy moi wrogowie, niech uciekną i będą pohańbieni w jednej chwili."
  tags: []
