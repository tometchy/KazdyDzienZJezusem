"Ps6,1": "PANIE, nie karć mnie w swoim gniewie i nie karz mnie w swojej zapalczywości."
"Ps6,2": "Zmiłuj się nade mną, PANIE, bo jestem słaby; uzdrów mnie, PANIE, bo moje kości drżą;"
"Ps6,3": "I moja dusza bardzo się zatrwożyła; lecz ty, PANIE, jak długo jeszcze?"
"Ps6,4": "Zawróć, PANIE, ocal moją duszę; wybaw mnie ze względu na twe miłosierdzie."
"Ps6,5": "W śmierci bowiem nie ma pamięci o tobie, a w grobie któż cię będzie wysławiać?"
"Ps6,6": "Zmęczyłem się moim wzdychaniem, co noc zalewam łzami moje posłanie, moje łoże jest mokre od płaczu."
"Ps6,7": "Moje oko zaćmiło się od smutku, zestarzało się z powodu wszystkich moich wrogów."
"Ps6,8": "Odstąpcie ode mnie, wszyscy czyniący nieprawość, bo PAN usłyszał głos mego płaczu."
"Ps6,9": "Usłyszał PAN moją prośbę, PAN przyjął moją modlitwę."
"Ps6,10": "Niech się zawstydzą i bardzo zatrwożą wszyscy moi wrogowie, niech uciekną i będą pohańbieni w jednej chwili."
