"Ps90,1": "Panie, ty byłeś naszą ucieczką z pokolenia na pokolenie."
"Ps90,2": "Zanim zrodziły się góry, zanim ukształtowałeś ziemię i świat, od wieków na wieki ty jesteś Bogiem."
"Ps90,3": "Obracasz człowieka w proch i mówisz: Wracajcie, synowie ludzcy."
"Ps90,4": "Tysiąc lat bowiem w twoich oczach jest jak dzień wczorajszy, który minął, i jak straż nocna."
"Ps90,5": "Porywasz ich jakby powodzią, są jak sen i jak trawa, która rośnie o poranku."
"Ps90,6": "Rano kwitnie i rośnie, a wieczorem zostaje skoszona i usycha."
"Ps90,7": "Giniemy bowiem od twego gniewu i jesteśmy przerażeni twoją zapalczywością."
"Ps90,8": "Położyłeś przed sobą nasze nieprawości, nasze skryte grzechy w świetle twego oblicza."
"Ps90,9": "Wszystkie nasze dni przemijają z powodu twego gniewu, nasze lata nikną jak westchnienie."
"Ps90,10": "Liczbą naszych dni jest lat siedemdziesiąt, a jeśli sił starczy, lat osiemdziesiąt, a to, co w nich najlepsze, to tylko kłopot i cierpienie, bo szybko mijają, a my odlatujemy."
"Ps90,11": "Któż zna srogość twego gniewu? Albo kto, bojąc się ciebie, zna twoją zapalczywość?"
"Ps90,12": "Naucz nas liczyć nasze dni, abyśmy przywiedli serce do mądrości."
"Ps90,13": "Powróć, PANIE. Jak długo jeszcze? Zlituj się nad swymi sługami."
"Ps90,14": "Nasyć nas z rana twoim miłosierdziem, abyśmy mogli się cieszyć i radować przez wszystkie nasze dni."
"Ps90,15": "Spraw nam radość według dni, w których nas trapiłeś; według lat, w których zaznaliśmy zła."
"Ps90,16": "Niech się ukaże twoim sługom twoje dzieło, a twoja chwała ich synom."
"Ps90,17": "Niech dobroć PANA, naszego Boga, będzie z nami; i utwierdź wśród nas dzieło naszych rąk; utwierdź dzieło naszych rąk!"
