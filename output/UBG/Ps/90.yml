"Ps90,1":
  text: "Panie, ty byłeś naszą ucieczką z pokolenia na pokolenie."
  tags: []
"Ps90,2":
  text: "Zanim zrodziły się góry, zanim ukształtowałeś ziemię i świat, od wieków na wieki ty jesteś Bogiem."
  tags: []
"Ps90,3":
  text: "Obracasz człowieka w proch i mówisz: Wracajcie, synowie ludzcy."
  tags: []
"Ps90,4":
  text: "Tysiąc lat bowiem w twoich oczach jest jak dzień wczorajszy, który minął, i jak straż nocna."
  tags: []
"Ps90,5":
  text: "Porywasz ich jakby powodzią, są jak sen i jak trawa, która rośnie o poranku."
  tags: []
"Ps90,6":
  text: "Rano kwitnie i rośnie, a wieczorem zostaje skoszona i usycha."
  tags: []
"Ps90,7":
  text: "Giniemy bowiem od twego gniewu i jesteśmy przerażeni twoją zapalczywością."
  tags: []
"Ps90,8":
  text: "Położyłeś przed sobą nasze nieprawości, nasze skryte grzechy w świetle twego oblicza."
  tags: []
"Ps90,9":
  text: "Wszystkie nasze dni przemijają z powodu twego gniewu, nasze lata nikną jak westchnienie."
  tags: []
"Ps90,10":
  text: "Liczbą naszych dni jest lat siedemdziesiąt, a jeśli sił starczy, lat osiemdziesiąt, a to, co w nich najlepsze, to tylko kłopot i cierpienie, bo szybko mijają, a my odlatujemy."
  tags: []
"Ps90,11":
  text: "Któż zna srogość twego gniewu? Albo kto, bojąc się ciebie, zna twoją zapalczywość?"
  tags: []
"Ps90,12":
  text: "Naucz nas liczyć nasze dni, abyśmy przywiedli serce do mądrości."
  tags: []
"Ps90,13":
  text: "Powróć, PANIE. Jak długo jeszcze? Zlituj się nad swymi sługami."
  tags: []
"Ps90,14":
  text: "Nasyć nas z rana twoim miłosierdziem, abyśmy mogli się cieszyć i radować przez wszystkie nasze dni."
  tags: []
"Ps90,15":
  text: "Spraw nam radość według dni, w których nas trapiłeś; według lat, w których zaznaliśmy zła."
  tags: []
"Ps90,16":
  text: "Niech się ukaże twoim sługom twoje dzieło, a twoja chwała ich synom."
  tags: []
"Ps90,17":
  text: "Niech dobroć PANA, naszego Boga, będzie z nami; i utwierdź wśród nas dzieło naszych rąk; utwierdź dzieło naszych rąk!"
  tags: []
