"Ps100,1": "Radośnie wykrzykujcie PANU, wszystkie ziemie!"
"Ps100,2": "Służcie PANU z weselem, przychodźcie z radością przed jego oblicze."
"Ps100,3": "Wiedzcie, że PAN jest Bogiem, to on nas uczynił, a nie my sami siebie; jesteśmy jego ludem i owcami jego pastwiska."
"Ps100,4": "Wejdźcie w jego bramy z dziękczynieniem i do jego przedsionków z wychwalaniem; wysławiajcie go, błogosławcie jego imię;"
"Ps100,5": "PAN bowiem jest dobry, jego miłosierdzie trwa na wieki, a jego prawda z pokolenia na pokolenie."
