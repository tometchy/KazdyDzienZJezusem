"Ps100,1":
  text: "Radośnie wykrzykujcie PANU, wszystkie ziemie!"
  tags: []
"Ps100,2":
  text: "Służcie PANU z weselem, przychodźcie z radością przed jego oblicze."
  tags: []
"Ps100,3":
  text: "Wiedzcie, że PAN jest Bogiem, to on nas uczynił, a nie my sami siebie; jesteśmy jego ludem i owcami jego pastwiska."
  tags: []
"Ps100,4":
  text: "Wejdźcie w jego bramy z dziękczynieniem i do jego przedsionków z wychwalaniem; wysławiajcie go, błogosławcie jego imię;"
  tags: []
"Ps100,5":
  text: "PAN bowiem jest dobry, jego miłosierdzie trwa na wieki, a jego prawda z pokolenia na pokolenie."
  tags: []
