"Ps124,1": "Gdyby PAN nie był z nami, niech powie teraz Izrael;"
"Ps124,2": "Gdyby PAN nie był z nami, gdy ludzie powstawali przeciwko nam;"
"Ps124,3": "Wtedy połknęliby nas żywcem, gdy płonęli gniewem przeciwko nam;"
"Ps124,4": "Wtedy wody zalałyby nas, a potok porwałby nasze dusze;"
"Ps124,5": "Wtedy gwałtowne wody porwałyby nasze dusze."
"Ps124,6": "Błogosławiony PAN, który nas nie wydał na pastwę ich zębom."
"Ps124,7": "Nasza dusza umknęła jak ptak z sideł ptaszników; sidła się podarły, a my uciekliśmy."
"Ps124,8": "Nasza pomoc jest w imieniu PANA, który stworzył niebo i ziemię."
