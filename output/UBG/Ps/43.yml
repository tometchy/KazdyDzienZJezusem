"Ps43,1":
  text: "Osądź mnie, Boże, broń mojej sprawy przeciwko narodowi bezbożnemu; wybaw mnie od człowieka podstępnego i bezbożnego;"
  tags: []
"Ps43,2":
  text: "Bo ty jesteś Bogiem mojej siły. Czemu mnie odrzuciłeś? Czemu chodzę smutny z powodu ucisku wroga?"
  tags: []
"Ps43,3":
  text: "Ześlij twoje światło i prawdę, niech mnie wiodą i wprowadzą na twoją świętą górę i do twoich przybytków."
  tags: []
"Ps43,4":
  text: "Wtedy przystąpię do ołtarza Bożego, do Boga, mojego wesela i radości; będę cię wysławiał na harfie, Boże, mój Boże."
  tags: []
"Ps43,5":
  text: "Czemu się smucisz, moja duszo, i czemu się we mnie trwożysz? Zaufaj Bogu, bo jeszcze będę go wysławiał, gdyż on jest zbawieniem mego oblicza i moim Bogiem."
  tags: []
