"Ps148,1":
  text: "Alleluja. Chwalcie PANA z niebios, chwalcie go na wysokościach."
  tags: []
"Ps148,2":
  text: "Chwalcie go, wszyscy jego aniołowie; chwalcie go, wszystkie jego zastępy."
  tags: []
"Ps148,3":
  text: "Chwalcie go, słońce i księżycu; chwalcie go, wszystkie gwiazdy świecące."
  tags: []
"Ps148,4":
  text: "Chwalcie go, niebiosa nad niebiosami i wody, które są nad niebiosami."
  tags: []
"Ps148,5":
  text: "Niech chwalą imię PANA, on bowiem rozkazał i zostały stworzone."
  tags: []
"Ps148,6":
  text: "I ustanowił je na wieki wieków; dał prawo, które nie przeminie."
  tags: []
"Ps148,7":
  text: "Chwalcie PANA z ziemi, smoki i wszystkie głębiny."
  tags: []
"Ps148,8":
  text: "Ogniu i gradzie, śniegu i paro, wietrze gwałtowny, wykonujący jego rozkaz;"
  tags: []
"Ps148,9":
  text: "Góry i wszystkie pagórki, drzewa owocowe i wszystkie cedry;"
  tags: []
"Ps148,10":
  text: "Zwierzęta i wszelkie bydło, istoty pełzające i ptactwo skrzydlate."
  tags: []
"Ps148,11":
  text: "Królowie ziemscy i wszystkie narody; władcy i wszyscy sędziowie ziemi;"
  tags: []
"Ps148,12":
  text: "Młodzieńcy, a także dziewice, starzy i dzieci;"
  tags: []
"Ps148,13":
  text: "Niech chwalą imię PANA, bo tylko jego imię jest wzniosłe, a jego chwała nad ziemią i niebem."
  tags: []
"Ps148,14":
  text: "I wywyższył róg swego ludu, chwałę wszystkich jego świętych, zwłaszcza synów Izraela, ludu mu bliskiego. Alleluja."
  tags: []
