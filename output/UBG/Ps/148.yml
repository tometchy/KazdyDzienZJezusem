"Ps148,1": "Alleluja. Chwalcie PANA z niebios, chwalcie go na wysokościach."
"Ps148,2": "Chwalcie go, wszyscy jego aniołowie; chwalcie go, wszystkie jego zastępy."
"Ps148,3": "Chwalcie go, słońce i księżycu; chwalcie go, wszystkie gwiazdy świecące."
"Ps148,4": "Chwalcie go, niebiosa nad niebiosami i wody, które są nad niebiosami."
"Ps148,5": "Niech chwalą imię PANA, on bowiem rozkazał i zostały stworzone."
"Ps148,6": "I ustanowił je na wieki wieków; dał prawo, które nie przeminie."
"Ps148,7": "Chwalcie PANA z ziemi, smoki i wszystkie głębiny."
"Ps148,8": "Ogniu i gradzie, śniegu i paro, wietrze gwałtowny, wykonujący jego rozkaz;"
"Ps148,9": "Góry i wszystkie pagórki, drzewa owocowe i wszystkie cedry;"
"Ps148,10": "Zwierzęta i wszelkie bydło, istoty pełzające i ptactwo skrzydlate."
"Ps148,11": "Królowie ziemscy i wszystkie narody; władcy i wszyscy sędziowie ziemi;"
"Ps148,12": "Młodzieńcy, a także dziewice, starzy i dzieci;"
"Ps148,13": "Niech chwalą imię PANA, bo tylko jego imię jest wzniosłe, a jego chwała nad ziemią i niebem."
"Ps148,14": "I wywyższył róg swego ludu, chwałę wszystkich jego świętych, zwłaszcza synów Izraela, ludu mu bliskiego. Alleluja."
