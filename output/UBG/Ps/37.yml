"Ps37,1": "Nie oburzaj się z powodu złoczyńców ani nie zazdrość czyniącym nieprawość."
"Ps37,2": "Jak trawa bowiem prędko zostaną podcięci i zwiędną jak świeża zieleń."
"Ps37,3": "Ufaj PANU i czyń dobrze; będziesz mieszkał na ziemi i na pewno będziesz nakarmiony."
"Ps37,4": "Rozkoszuj się PANEM, a on spełni pragnienia twego serca."
"Ps37,5": "Powierz PANU swoją drogę i zaufaj mu, a on wszystko wykona;"
"Ps37,6": "I wyniesie twoją sprawiedliwość jak światłość, a twoją prawość jak południe."
"Ps37,7": "Poddaj się PANU i oczekuj go; nie oburzaj się na tego, komu powodzi się w drodze, na człowieka, który spełnia swe złe zamiary."
"Ps37,8": "Zaprzestań gniewu i zaniechaj zapalczywości; nie zapalaj się gniewem do czynienia zła."
"Ps37,9": "Złoczyńcy bowiem będą wytępieni, a ci, którzy oczekują PANA, odziedziczą ziemię."
"Ps37,10": "Jeszcze chwila, a nie będzie niegodziwego; spojrzysz na jego miejsce, a już go nie będzie."
"Ps37,11": "Lecz pokorni odziedziczą ziemię i będą się rozkoszować obfitością pokoju."
"Ps37,12": "Niegodziwy knuje przeciwko sprawiedliwemu i zgrzyta na niego zębami."
"Ps37,13": "Lecz Pan śmieje się z niego, bo widzi, że nadchodzi jego dzień."
"Ps37,14": "Niegodziwi dobyli miecz i napinają swój łuk, aby powalić ubogiego i potrzebującego, aby zgładzić tych, którzy idą prawą drogą;"
"Ps37,15": "Lecz ich miecz przeszyje ich własne serca, a ich łuki będą złamane."
"Ps37,16": "Lepsza jest odrobina, którą ma sprawiedliwy, niż wielkie bogactwa wielu niegodziwych;"
"Ps37,17": "Ramiona bowiem niegodziwych będą połamane, ale sprawiedliwych PAN podtrzymuje."
"Ps37,18": "PAN zna dni nienagannych, ich dziedzictwo będzie trwać na wieki."
"Ps37,19": "W czasie nieszczęścia nie doznają wstydu, a w dniach głodu będą nasyceni."
"Ps37,20": "Niegodziwi zaś wyginą, a wrogowie PANA znikną jak tłuszcz barani, jak dym się rozwieją."
"Ps37,21": "Niegodziwy pożycza i nie zwraca, a sprawiedliwy lituje się i rozdaje."
"Ps37,22": "Błogosławieni przez PANA odziedziczą ziemię, a przeklęci przez niego zostaną wytępieni."
"Ps37,23": "PAN kieruje krokami dobrego człowieka i jego droga mu się podoba."
"Ps37,24": "Choćby upadł, nie zostanie całkowicie powalony, bo PAN podtrzymuje go swą ręką."
"Ps37,25": "Byłem młody i jestem już stary, lecz nie widziałem sprawiedliwego, który by był opuszczony, ani żeby jego potomstwo żebrało o chleb."
"Ps37,26": "Każdego dnia lituje się i pożycza, a jego potomstwo jest błogosławione."
"Ps37,27": "Odstąp od złego i czyń dobrze, a będziesz trwał na wieki."
"Ps37,28": "PAN bowiem miłuje prawość i nie opuszcza swoich świętych, strzeże ich na wieki; a potomstwo niegodziwych będzie wytępione."
"Ps37,29": "Sprawiedliwi odziedziczą ziemię i będą na niej mieszkać na wieki."
"Ps37,30": "Usta sprawiedliwego wypowiadają mądrość, a jego język mówi o sądzie."
"Ps37,31": "Prawo jego Boga jest w jego sercu, jego kroki się nie zachwieją."
"Ps37,32": "Niegodziwy czyha na sprawiedliwego i szuka sposobności, aby go zabić."
"Ps37,33": "Lecz PAN nie zostawi go w jego ręku i nie potępi, gdy będzie sądzony."
"Ps37,34": "Oczekuj PANA i strzeż jego drogi, a on cię wywyższy, abyś odziedziczył ziemię; zobaczysz zatracenie niegodziwych."
"Ps37,35": "Widziałem niegodziwego bardzo wyniosłego i rozpierającego się jak zielone drzewo laurowe;"
"Ps37,36": "Lecz przeminął i oto już go nie było; szukałem go, ale nie mogłem go znaleźć."
"Ps37,37": "Spójrz na nienagannego i przypatruj się prawemu, bo ten na końcu osiągnie pokój."
"Ps37,38": "Lecz przestępcy razem zginą, niegodziwi na końcu zostaną wytępieni."
"Ps37,39": "Zbawienie zaś sprawiedliwych pochodzi od PANA; on jest ich siłą w czasie utrapienia."
"Ps37,40": "PAN ich wspomoże i wyzwoli; wyzwoli ich od niegodziwych i wybawi, bo w nim pokładają nadzieję."
