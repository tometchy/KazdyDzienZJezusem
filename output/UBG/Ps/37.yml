"Ps37,1":
  text: "Nie oburzaj się z powodu złoczyńców ani nie zazdrość czyniącym nieprawość."
  tags: []
"Ps37,2":
  text: "Jak trawa bowiem prędko zostaną podcięci i zwiędną jak świeża zieleń."
  tags: []
"Ps37,3":
  text: "Ufaj PANU i czyń dobrze; będziesz mieszkał na ziemi i na pewno będziesz nakarmiony."
  tags: []
"Ps37,4":
  text: "Rozkoszuj się PANEM, a on spełni pragnienia twego serca."
  tags: []
"Ps37,5":
  text: "Powierz PANU swoją drogę i zaufaj mu, a on wszystko wykona;"
  tags: []
"Ps37,6":
  text: "I wyniesie twoją sprawiedliwość jak światłość, a twoją prawość jak południe."
  tags: []
"Ps37,7":
  text: "Poddaj się PANU i oczekuj go; nie oburzaj się na tego, komu powodzi się w drodze, na człowieka, który spełnia swe złe zamiary."
  tags: []
"Ps37,8":
  text: "Zaprzestań gniewu i zaniechaj zapalczywości; nie zapalaj się gniewem do czynienia zła."
  tags: []
"Ps37,9":
  text: "Złoczyńcy bowiem będą wytępieni, a ci, którzy oczekują PANA, odziedziczą ziemię."
  tags: []
"Ps37,10":
  text: "Jeszcze chwila, a nie będzie niegodziwego; spojrzysz na jego miejsce, a już go nie będzie."
  tags: []
"Ps37,11":
  text: "Lecz pokorni odziedziczą ziemię i będą się rozkoszować obfitością pokoju."
  tags: []
"Ps37,12":
  text: "Niegodziwy knuje przeciwko sprawiedliwemu i zgrzyta na niego zębami."
  tags: []
"Ps37,13":
  text: "Lecz Pan śmieje się z niego, bo widzi, że nadchodzi jego dzień."
  tags: []
"Ps37,14":
  text: "Niegodziwi dobyli miecz i napinają swój łuk, aby powalić ubogiego i potrzebującego, aby zgładzić tych, którzy idą prawą drogą;"
  tags: []
"Ps37,15":
  text: "Lecz ich miecz przeszyje ich własne serca, a ich łuki będą złamane."
  tags: []
"Ps37,16":
  text: "Lepsza jest odrobina, którą ma sprawiedliwy, niż wielkie bogactwa wielu niegodziwych;"
  tags: []
"Ps37,17":
  text: "Ramiona bowiem niegodziwych będą połamane, ale sprawiedliwych PAN podtrzymuje."
  tags: []
"Ps37,18":
  text: "PAN zna dni nienagannych, ich dziedzictwo będzie trwać na wieki."
  tags: []
"Ps37,19":
  text: "W czasie nieszczęścia nie doznają wstydu, a w dniach głodu będą nasyceni."
  tags: []
"Ps37,20":
  text: "Niegodziwi zaś wyginą, a wrogowie PANA znikną jak tłuszcz barani, jak dym się rozwieją."
  tags: []
"Ps37,21":
  text: "Niegodziwy pożycza i nie zwraca, a sprawiedliwy lituje się i rozdaje."
  tags: []
"Ps37,22":
  text: "Błogosławieni przez PANA odziedziczą ziemię, a przeklęci przez niego zostaną wytępieni."
  tags: []
"Ps37,23":
  text: "PAN kieruje krokami dobrego człowieka i jego droga mu się podoba."
  tags: []
"Ps37,24":
  text: "Choćby upadł, nie zostanie całkowicie powalony, bo PAN podtrzymuje go swą ręką."
  tags: []
"Ps37,25":
  text: "Byłem młody i jestem już stary, lecz nie widziałem sprawiedliwego, który by był opuszczony, ani żeby jego potomstwo żebrało o chleb."
  tags: []
"Ps37,26":
  text: "Każdego dnia lituje się i pożycza, a jego potomstwo jest błogosławione."
  tags: []
"Ps37,27":
  text: "Odstąp od złego i czyń dobrze, a będziesz trwał na wieki."
  tags: []
"Ps37,28":
  text: "PAN bowiem miłuje prawość i nie opuszcza swoich świętych, strzeże ich na wieki; a potomstwo niegodziwych będzie wytępione."
  tags: []
"Ps37,29":
  text: "Sprawiedliwi odziedziczą ziemię i będą na niej mieszkać na wieki."
  tags: []
"Ps37,30":
  text: "Usta sprawiedliwego wypowiadają mądrość, a jego język mówi o sądzie."
  tags: []
"Ps37,31":
  text: "Prawo jego Boga jest w jego sercu, jego kroki się nie zachwieją."
  tags: []
"Ps37,32":
  text: "Niegodziwy czyha na sprawiedliwego i szuka sposobności, aby go zabić."
  tags: []
"Ps37,33":
  text: "Lecz PAN nie zostawi go w jego ręku i nie potępi, gdy będzie sądzony."
  tags: []
"Ps37,34":
  text: "Oczekuj PANA i strzeż jego drogi, a on cię wywyższy, abyś odziedziczył ziemię; zobaczysz zatracenie niegodziwych."
  tags: []
"Ps37,35":
  text: "Widziałem niegodziwego bardzo wyniosłego i rozpierającego się jak zielone drzewo laurowe;"
  tags: []
"Ps37,36":
  text: "Lecz przeminął i oto już go nie było; szukałem go, ale nie mogłem go znaleźć."
  tags: []
"Ps37,37":
  text: "Spójrz na nienagannego i przypatruj się prawemu, bo ten na końcu osiągnie pokój."
  tags: []
"Ps37,38":
  text: "Lecz przestępcy razem zginą, niegodziwi na końcu zostaną wytępieni."
  tags: []
"Ps37,39":
  text: "Zbawienie zaś sprawiedliwych pochodzi od PANA; on jest ich siłą w czasie utrapienia."
  tags: []
"Ps37,40":
  text: "PAN ich wspomoże i wyzwoli; wyzwoli ich od niegodziwych i wybawi, bo w nim pokładają nadzieję."
  tags: []
