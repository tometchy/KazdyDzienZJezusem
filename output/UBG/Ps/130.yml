"Ps130,1": "Z głębokości wołam do ciebie, PANIE."
"Ps130,2": "Panie, wysłuchaj mego głosu. Nakłoń swych uszu na głos mojego błagania."
"Ps130,3": "PANIE, jeśli będziesz zważał na nieprawości, o Panie, któż się ostoi?"
"Ps130,4": "Ale u ciebie jest przebaczenie, aby się ciebie bano."
"Ps130,5": "Oczekuję PANA, moja dusza oczekuje; i w jego słowie pokładam nadzieję."
"Ps130,6": "Moja dusza oczekuje Pana bardziej niż strażnicy świtu, bardziej niż ci, którzy strzegą do poranka."
"Ps130,7": "Niech Izrael oczekuje PANA; u PANA bowiem jest miłosierdzie i u niego obfite odkupienie."
"Ps130,8": "On sam odkupi Izraela ze wszystkich jego nieprawości."
