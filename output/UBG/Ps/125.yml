"Ps125,1":
  text: "Ci, którzy ufają PANU, są jak góra Syjon, która się nie porusza, ale trwa na wieki."
  tags: []
"Ps125,2":
  text: "Jak góry otaczają Jeruzalem, tak PAN otacza swój lud, teraz i na wieki."
  tags: []
"Ps125,3":
  text: "Nie zaciąży bowiem berło niegodziwych nad losem sprawiedliwych, by sprawiedliwi nie wyciągali swych rąk ku nieprawości."
  tags: []
"Ps125,4":
  text: "Czyń dobrze, PANIE, dobrym i tym, którzy są prawego serca."
  tags: []
"Ps125,5":
  text: "A tych, którzy zbaczają na kręte swe drogi, niech PAN odprawi wraz z czyniącymi nieprawość. Niech będzie pokój nad Izraelem."
  tags: []
