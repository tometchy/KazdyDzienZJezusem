"Ps80,1":
  text: "Posłuchaj, Pasterzu Izraela, ty, który prowadzisz Józefa jak stado owiec, ty, który zasiadasz między cherubinami, zabłyśnij."
  tags: []
"Ps80,2":
  text: "Przed Efraimem, Beniaminem i Manassesem wzbudź swoją moc i przyjdź nas zbawić."
  tags: []
"Ps80,3":
  text: "Boże, odnów nas, rozjaśnij nad nami swoje oblicze, a będziemy wybawieni."
  tags: []
"Ps80,4":
  text: "PANIE, Boże zastępów, jak długo będziesz się gniewał na modlitwę swego ludu?"
  tags: []
"Ps80,5":
  text: "Nakarmiłeś ich chlebem płaczu i napoiłeś ich łzami nad miarę."
  tags: []
"Ps80,6":
  text: "Zrobiłeś z nas przedmiot sporu dla naszych sąsiadów, a nasi wrogowie śmieją się z nas."
  tags: []
"Ps80,7":
  text: "Boże zastępów, odnów nas, rozjaśnij nad nami swoje oblicze, a będziemy wybawieni."
  tags: []
"Ps80,8":
  text: "Ty przeniosłeś winorośl z Egiptu; wygnałeś pogan, a ją zasadziłeś."
  tags: []
"Ps80,9":
  text: "Przygotowałeś jej miejsce i sprawiłeś, że zapuściła korzenie i napełniła ziemię."
  tags: []
"Ps80,10":
  text: "Góry okryły się jej cieniem, a jej gałęzie były jak najwyższe cedry."
  tags: []
"Ps80,11":
  text: "Wypuściła swe latorośle aż do morza i swoje pędy aż do rzeki."
  tags: []
"Ps80,12":
  text: "Dlaczego więc zburzyłeś jej ogrodzenie, tak że obrywają ją wszyscy, którzy przechodzą drogą?"
  tags: []
"Ps80,13":
  text: "Niszczy ją dzik leśny, a zwierzę polne pożera ją."
  tags: []
"Ps80,14":
  text: "O Boże zastępów, proszę, powróć, spójrz z nieba i zobacz, nawiedź tę winorośl;"
  tags: []
"Ps80,15":
  text: "Tę winnicę, którą zasadziła twoja prawica, i latorośl, którą umocniłeś dla siebie."
  tags: []
"Ps80,16":
  text: "Spalona jest ogniem i wycięta; giną od zgromienia twojego oblicza."
  tags: []
"Ps80,17":
  text: "Niech twoja ręka będzie nad mężem twojej prawicy, nad synem człowieczym, którego umocniłeś dla siebie."
  tags: []
"Ps80,18":
  text: "A my nie odstąpimy od ciebie; zachowaj nas przy życiu, a będziemy wzywać twego imienia."
  tags: []
"Ps80,19":
  text: "PANIE, Boże zastępów, odnów nas, rozjaśnij nad nami swoje oblicze, a będziemy wybawieni."
  tags: []
