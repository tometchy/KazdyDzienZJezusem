"Ps80,1": "Posłuchaj, Pasterzu Izraela, ty, który prowadzisz Józefa jak stado owiec, ty, który zasiadasz między cherubinami, zabłyśnij."
"Ps80,2": "Przed Efraimem, Beniaminem i Manassesem wzbudź swoją moc i przyjdź nas zbawić."
"Ps80,3": "Boże, odnów nas, rozjaśnij nad nami swoje oblicze, a będziemy wybawieni."
"Ps80,4": "PANIE, Boże zastępów, jak długo będziesz się gniewał na modlitwę swego ludu?"
"Ps80,5": "Nakarmiłeś ich chlebem płaczu i napoiłeś ich łzami nad miarę."
"Ps80,6": "Zrobiłeś z nas przedmiot sporu dla naszych sąsiadów, a nasi wrogowie śmieją się z nas."
"Ps80,7": "Boże zastępów, odnów nas, rozjaśnij nad nami swoje oblicze, a będziemy wybawieni."
"Ps80,8": "Ty przeniosłeś winorośl z Egiptu; wygnałeś pogan, a ją zasadziłeś."
"Ps80,9": "Przygotowałeś jej miejsce i sprawiłeś, że zapuściła korzenie i napełniła ziemię."
"Ps80,10": "Góry okryły się jej cieniem, a jej gałęzie były jak najwyższe cedry."
"Ps80,11": "Wypuściła swe latorośle aż do morza i swoje pędy aż do rzeki."
"Ps80,12": "Dlaczego więc zburzyłeś jej ogrodzenie, tak że obrywają ją wszyscy, którzy przechodzą drogą?"
"Ps80,13": "Niszczy ją dzik leśny, a zwierzę polne pożera ją."
"Ps80,14": "O Boże zastępów, proszę, powróć, spójrz z nieba i zobacz, nawiedź tę winorośl;"
"Ps80,15": "Tę winnicę, którą zasadziła twoja prawica, i latorośl, którą umocniłeś dla siebie."
"Ps80,16": "Spalona jest ogniem i wycięta; giną od zgromienia twojego oblicza."
"Ps80,17": "Niech twoja ręka będzie nad mężem twojej prawicy, nad synem człowieczym, którego umocniłeś dla siebie."
"Ps80,18": "A my nie odstąpimy od ciebie; zachowaj nas przy życiu, a będziemy wzywać twego imienia."
"Ps80,19": "PANIE, Boże zastępów, odnów nas, rozjaśnij nad nami swoje oblicze, a będziemy wybawieni."
