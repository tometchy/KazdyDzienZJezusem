"Ps32,1":
  text: "Błogosławiony ten, komu przebaczono występek, komu grzech zakryto."
  tags: []
"Ps32,2":
  text: "Błogosławiony człowiek, któremu PAN nie poczytuje nieprawości i w którego duchu nie ma podstępu."
  tags: []
"Ps32,3":
  text: "Gdy milczałem, moje kości schły od moich całodziennych narzekań."
  tags: []
"Ps32,4":
  text: "We dnie i w nocy bowiem ciążyła na mnie twoja ręka, usychałem jak podczas letniej suszy. Sela."
  tags: []
"Ps32,5":
  text: "Wyznałem ci swój grzech i nie kryłem mojej nieprawości. Powiedziałem: Wyznam moje występki PANU, a ty przebaczyłeś nieprawość mego grzechu. Sela."
  tags: []
"Ps32,6":
  text: "Dlatego do ciebie będzie się modlił każdy pobożny w czasie, gdy można cię znaleźć; nawet w czasie powodzi wielkich wód, one go nie dosięgną."
  tags: []
"Ps32,7":
  text: "Ty jesteś moim schronieniem, zachowasz mnie od ucisku; otaczasz mnie pieśniami wybawienia. Sela."
  tags: []
"Ps32,8":
  text: "Pouczę cię i nauczę cię drogi, którą masz kroczyć, poprowadzę cię swoim okiem."
  tags: []
"Ps32,9":
  text: "Nie bądźcie bezrozumni jak koń czy jak muł, których pyski trzeba okiełznać uzdą i wędzidłem, aby się na ciebie nie porywały."
  tags: []
"Ps32,10":
  text: "Wiele cierpień spada na niegodziwego, lecz ufającego PANU otoczy miłosierdzie."
  tags: []
"Ps32,11":
  text: "Weselcie się w PANU i radujcie się sprawiedliwi, wykrzykujcie radośnie, wszyscy prawego serca."
  tags: []
