"Ps32,1": "Błogosławiony ten, komu przebaczono występek, komu grzech zakryto."
"Ps32,2": "Błogosławiony człowiek, któremu PAN nie poczytuje nieprawości i w którego duchu nie ma podstępu."
"Ps32,3": "Gdy milczałem, moje kości schły od moich całodziennych narzekań."
"Ps32,4": "We dnie i w nocy bowiem ciążyła na mnie twoja ręka, usychałem jak podczas letniej suszy. Sela."
"Ps32,5": "Wyznałem ci swój grzech i nie kryłem mojej nieprawości. Powiedziałem: Wyznam moje występki PANU, a ty przebaczyłeś nieprawość mego grzechu. Sela."
"Ps32,6": "Dlatego do ciebie będzie się modlił każdy pobożny w czasie, gdy można cię znaleźć; nawet w czasie powodzi wielkich wód, one go nie dosięgną."
"Ps32,7": "Ty jesteś moim schronieniem, zachowasz mnie od ucisku; otaczasz mnie pieśniami wybawienia. Sela."
"Ps32,8": "Pouczę cię i nauczę cię drogi, którą masz kroczyć, poprowadzę cię swoim okiem."
"Ps32,9": "Nie bądźcie bezrozumni jak koń czy jak muł, których pyski trzeba okiełznać uzdą i wędzidłem, aby się na ciebie nie porywały."
"Ps32,10": "Wiele cierpień spada na niegodziwego, lecz ufającego PANU otoczy miłosierdzie."
"Ps32,11": "Weselcie się w PANU i radujcie się sprawiedliwi, wykrzykujcie radośnie, wszyscy prawego serca."
