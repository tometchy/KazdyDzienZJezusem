"Ps21,1": "PANIE, król cieszy się z twojej mocy i bardzo się raduje twoim zbawieniem."
"Ps21,2": "Spełniłeś pragnienie jego serca i prośbie jego ust nie odmówiłeś. Sela."
"Ps21,3": "Wyszedłeś mu bowiem naprzeciw z hojnymi błogosławieństwami, koronę szczerozłotą włożyłeś mu na głowę."
"Ps21,4": "Prosił cię o życie i dałeś mu je, długie dni na wieki wieków."
"Ps21,5": "Wielka jest jego chwała dzięki twemu zbawieniu, okryłeś go sławą i dostojeństwem;"
"Ps21,6": "Bo uczyniłeś go błogosławieństwem na wieki, rozradowałeś go swoim obliczem."
"Ps21,7": "Król bowiem w PANU pokłada nadzieję i nie zachwieje się dzięki miłosierdziu Najwyższego."
"Ps21,8": "Twoja ręka znajdzie wszystkich twoich wrogów; twoja prawica dosięgnie wszystkich, którzy cię nienawidzą."
"Ps21,9": "Uczynisz ich jakby piecem ognistym w czasie twego gniewu; PAN w swojej zapalczywości pochłonie ich, a ogień ich strawi."
"Ps21,10": "Wytracisz z ziemi ich ród, a ich potomstwo spośród synów ludzkich."
"Ps21,11": "Bo zamierzali zło przeciwko tobie, uknuli spisek, którego nie mogli wykonać."
"Ps21,12": "Dlatego ich zmusisz do ucieczki, strzały na twej cięciwie wymierzysz w ich twarze."
"Ps21,13": "Powstań, PANIE, w swojej mocy; będziemy śpiewać i wysławiać twą potęgę."
