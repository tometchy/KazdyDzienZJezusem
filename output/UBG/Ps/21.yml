"Ps21,1":
  text: "PANIE, król cieszy się z twojej mocy i bardzo się raduje twoim zbawieniem."
  tags: []
"Ps21,2":
  text: "Spełniłeś pragnienie jego serca i prośbie jego ust nie odmówiłeś. Sela."
  tags: []
"Ps21,3":
  text: "Wyszedłeś mu bowiem naprzeciw z hojnymi błogosławieństwami, koronę szczerozłotą włożyłeś mu na głowę."
  tags: []
"Ps21,4":
  text: "Prosił cię o życie i dałeś mu je, długie dni na wieki wieków."
  tags: []
"Ps21,5":
  text: "Wielka jest jego chwała dzięki twemu zbawieniu, okryłeś go sławą i dostojeństwem;"
  tags: []
"Ps21,6":
  text: "Bo uczyniłeś go błogosławieństwem na wieki, rozradowałeś go swoim obliczem."
  tags: []
"Ps21,7":
  text: "Król bowiem w PANU pokłada nadzieję i nie zachwieje się dzięki miłosierdziu Najwyższego."
  tags: []
"Ps21,8":
  text: "Twoja ręka znajdzie wszystkich twoich wrogów; twoja prawica dosięgnie wszystkich, którzy cię nienawidzą."
  tags: []
"Ps21,9":
  text: "Uczynisz ich jakby piecem ognistym w czasie twego gniewu; PAN w swojej zapalczywości pochłonie ich, a ogień ich strawi."
  tags: []
"Ps21,10":
  text: "Wytracisz z ziemi ich ród, a ich potomstwo spośród synów ludzkich."
  tags: []
"Ps21,11":
  text: "Bo zamierzali zło przeciwko tobie, uknuli spisek, którego nie mogli wykonać."
  tags: []
"Ps21,12":
  text: "Dlatego ich zmusisz do ucieczki, strzały na twej cięciwie wymierzysz w ich twarze."
  tags: []
"Ps21,13":
  text: "Powstań, PANIE, w swojej mocy; będziemy śpiewać i wysławiać twą potęgę."
  tags: []
