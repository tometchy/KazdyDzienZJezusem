"Ps61,1":
  text: "Wysłuchaj, Boże, mojego wołania, miej wzgląd na moją modlitwę."
  tags: []
"Ps61,2":
  text: "Z krańców ziemi wołam do ciebie, gdy moje serce jest zatrwożone; wprowadź mnie na skałę, która jest wyższa ode mnie."
  tags: []
"Ps61,3":
  text: "Ty bowiem jesteś moją ucieczką i wieżą warowną przed wrogiem."
  tags: []
"Ps61,4":
  text: "Będę mieszkał w twoim przybytku na wieki, chroniąc się pod osłoną twych skrzydeł. Sela."
  tags: []
"Ps61,5":
  text: "Bo ty, Boże, wysłuchałeś moich ślubów; dałeś dziedzictwo tym, którzy się boją twego imienia."
  tags: []
"Ps61,6":
  text: "Przedłużysz dni króla, jego lata – z pokolenia na pokolenie."
  tags: []
"Ps61,7":
  text: "Będzie trwał na wieki przed Bogiem; przygotuj miłosierdzie i prawdę, niech go strzegą."
  tags: []
"Ps61,8":
  text: "Tak będę śpiewał twemu imieniu na wieki i będę spełniał moje śluby każdego dnia."
  tags: []
