"Ps61,1": "Wysłuchaj, Boże, mojego wołania, miej wzgląd na moją modlitwę."
"Ps61,2": "Z krańców ziemi wołam do ciebie, gdy moje serce jest zatrwożone; wprowadź mnie na skałę, która jest wyższa ode mnie."
"Ps61,3": "Ty bowiem jesteś moją ucieczką i wieżą warowną przed wrogiem."
"Ps61,4": "Będę mieszkał w twoim przybytku na wieki, chroniąc się pod osłoną twych skrzydeł. Sela."
"Ps61,5": "Bo ty, Boże, wysłuchałeś moich ślubów; dałeś dziedzictwo tym, którzy się boją twego imienia."
"Ps61,6": "Przedłużysz dni króla, jego lata – z pokolenia na pokolenie."
"Ps61,7": "Będzie trwał na wieki przed Bogiem; przygotuj miłosierdzie i prawdę, niech go strzegą."
"Ps61,8": "Tak będę śpiewał twemu imieniu na wieki i będę spełniał moje śluby każdego dnia."
