"Ps54,1":
  text: "Boże, wybaw mnie twoim imieniem i twoją mocą broń mojej sprawy."
  tags: []
"Ps54,2":
  text: "Boże, wysłuchaj mojej modlitwy, nakłoń ucha ku słowom moich ust."
  tags: []
"Ps54,3":
  text: "Gdyż obcy powstali przeciwko mnie, a okrutnicy czyhają na moją duszę; nie mają Boga przed oczami. Sela."
  tags: []
"Ps54,4":
  text: "Oto Bóg jest moim pomocnikiem; Pan jest z tymi, którzy podtrzymują moje życie."
  tags: []
"Ps54,5":
  text: "Odpłaci złem moim wrogom; w twojej prawdzie wytrać ich."
  tags: []
"Ps54,6":
  text: "Będę ci dobrowolnie składał ofiary, będę wysławiał twoje imię, PANIE, bo jest dobre."
  tags: []
"Ps54,7":
  text: "Uwolniłeś mnie bowiem z każdego utrapienia, a moje oko widziało zemstę nad moimi wrogami."
  tags: []
