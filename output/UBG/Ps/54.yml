"Ps54,1": "Boże, wybaw mnie twoim imieniem i twoją mocą broń mojej sprawy."
"Ps54,2": "Boże, wysłuchaj mojej modlitwy, nakłoń ucha ku słowom moich ust."
"Ps54,3": "Gdyż obcy powstali przeciwko mnie, a okrutnicy czyhają na moją duszę; nie mają Boga przed oczami. Sela."
"Ps54,4": "Oto Bóg jest moim pomocnikiem; Pan jest z tymi, którzy podtrzymują moje życie."
"Ps54,5": "Odpłaci złem moim wrogom; w twojej prawdzie wytrać ich."
"Ps54,6": "Będę ci dobrowolnie składał ofiary, będę wysławiał twoje imię, PANIE, bo jest dobre."
"Ps54,7": "Uwolniłeś mnie bowiem z każdego utrapienia, a moje oko widziało zemstę nad moimi wrogami."
