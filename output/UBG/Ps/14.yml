"Ps14,1":
  text: "Głupi powiedział w swoim sercu: Nie ma Boga. Są zepsuci, popełniają obrzydliwe czyny. Nie ma nikogo, kto by czynił dobro."
  tags: []
"Ps14,2":
  text: "PAN spojrzał z niebios na synów ludzkich, aby zobaczyć, czy jest ktoś rozumny i szukający Boga."
  tags: []
"Ps14,3":
  text: "Wszyscy zboczyli z drogi, wszyscy jednakowo znikczemnieli. Nie ma nikogo, kto by czynił dobro, nie ma ani jednego."
  tags: []
"Ps14,4":
  text: "Czyż są nierozumni wszyscy czyniący nieprawość, którzy pożerają mój lud, jakby chleb jedli, a PANA nie wzywają?"
  tags: []
"Ps14,5":
  text: "Tam ogarnie ich strach, gdyż Bóg jest pośród pokolenia sprawiedliwych."
  tags: []
"Ps14,6":
  text: "Szydzicie z rady ubogiego, ale PAN jest jego ucieczką."
  tags: []
"Ps14,7":
  text: "Oby przyszło z Syjonu zbawienie Izraela! Gdy PAN odwróci niewolę swego ludu, Jakub się rozraduje i Izrael się rozweseli."
  tags: []
