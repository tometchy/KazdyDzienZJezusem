"Ps14,1": "Głupi powiedział w swoim sercu: Nie ma Boga. Są zepsuci, popełniają obrzydliwe czyny. Nie ma nikogo, kto by czynił dobro."
"Ps14,2": "PAN spojrzał z niebios na synów ludzkich, aby zobaczyć, czy jest ktoś rozumny i szukający Boga."
"Ps14,3": "Wszyscy zboczyli z drogi, wszyscy jednakowo znikczemnieli. Nie ma nikogo, kto by czynił dobro, nie ma ani jednego."
"Ps14,4": "Czyż są nierozumni wszyscy czyniący nieprawość, którzy pożerają mój lud, jakby chleb jedli, a PANA nie wzywają?"
"Ps14,5": "Tam ogarnie ich strach, gdyż Bóg jest pośród pokolenia sprawiedliwych."
"Ps14,6": "Szydzicie z rady ubogiego, ale PAN jest jego ucieczką."
"Ps14,7": "Oby przyszło z Syjonu zbawienie Izraela! Gdy PAN odwróci niewolę swego ludu, Jakub się rozraduje i Izrael się rozweseli."
