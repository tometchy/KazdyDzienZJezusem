"Ps49,1":
  text: "Słuchajcie tego wszystkie narody, nadstawcie ucha wszyscy mieszkańcy świata."
  tags: []
"Ps49,2":
  text: "Zarówno wy, prości, jak i wy, możni; zarówno bogaty, jak i ubogi."
  tags: []
"Ps49,3":
  text: "Moje usta wypowiedzą mądrość, a rozmyślaniem mego serca będzie roztropność."
  tags: []
"Ps49,4":
  text: "Nakłonię ucha ku przypowieści, przy harfie rozwiążę moją zagadkę."
  tags: []
"Ps49,5":
  text: "Dlaczego mam się bać w dniach niedoli, gdy otacza mnie nieprawość tych, którzy mnie depczą?"
  tags: []
"Ps49,6":
  text: "Ci, którzy ufają swym bogactwom i chlubią się swym wielkim dostatkiem;"
  tags: []
"Ps49,7":
  text: "Nikt z nich w żaden sposób nie odkupi swego brata ani nie może dać Bogu za niego okupu;"
  tags: []
"Ps49,8":
  text: "(Kosztowny bowiem jest okup za ich dusze i nigdy się nie zdarzy);"
  tags: []
"Ps49,9":
  text: "Aby żył na wieki i nie doznał zniszczenia."
  tags: []
"Ps49,10":
  text: "Każdy bowiem widzi, że mądrzy umierają, tak samo jak ginie głupiec i prostak, i zostawiają obcym swoje bogactwa."
  tags: []
"Ps49,11":
  text: "Myślą, że ich domy są wieczne, a ich mieszkania będą trwać z pokolenia na pokolenie; nazywają ziemie swymi imionami."
  tags: []
"Ps49,12":
  text: "Lecz człowiek, choć otoczony czcią, nie przetrwa; podobny jest do bydląt, które giną."
  tags: []
"Ps49,13":
  text: "Ich droga jest ich głupstwem, mimo to ich potomkowie pochwalają ich mowę. Sela."
  tags: []
"Ps49,14":
  text: "Jak owce będą złożeni w grobie, śmierć ich pożre; prawi będą nad nimi panować o poranku, ich postać zostanie zniszczona w grobie, gdy opuszczą swoje mieszkanie."
  tags: []
"Ps49,15":
  text: "Ale Bóg wykupi moją duszę z mocy grobu, bo mnie przyjmie. Sela."
  tags: []
"Ps49,16":
  text: "Nie bój się, gdy się ktoś wzbogaci, gdy się rozmnoży sława jego domu;"
  tags: []
"Ps49,17":
  text: "Bo gdy umrze, niczego ze sobą nie weźmie i nie pójdzie za nim jego sława."
  tags: []
"Ps49,18":
  text: "Chociaż za życia swej duszy pochlebiał i chwalono go, gdy dobrze się urządził;"
  tags: []
"Ps49,19":
  text: "Pójdzie jednak do grona swych ojców; nigdy nie ujrzą światła."
  tags: []
"Ps49,20":
  text: "Człowiek, który jest otoczony czcią, a nie rozumie tego, podobny jest do bydląt, które giną."
  tags: []
