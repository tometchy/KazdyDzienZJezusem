"Ps49,1": "Słuchajcie tego wszystkie narody, nadstawcie ucha wszyscy mieszkańcy świata."
"Ps49,2": "Zarówno wy, prości, jak i wy, możni; zarówno bogaty, jak i ubogi."
"Ps49,3": "Moje usta wypowiedzą mądrość, a rozmyślaniem mego serca będzie roztropność."
"Ps49,4": "Nakłonię ucha ku przypowieści, przy harfie rozwiążę moją zagadkę."
"Ps49,5": "Dlaczego mam się bać w dniach niedoli, gdy otacza mnie nieprawość tych, którzy mnie depczą?"
"Ps49,6": "Ci, którzy ufają swym bogactwom i chlubią się swym wielkim dostatkiem;"
"Ps49,7": "Nikt z nich w żaden sposób nie odkupi swego brata ani nie może dać Bogu za niego okupu;"
"Ps49,8": "(Kosztowny bowiem jest okup za ich dusze i nigdy się nie zdarzy);"
"Ps49,9": "Aby żył na wieki i nie doznał zniszczenia."
"Ps49,10": "Każdy bowiem widzi, że mądrzy umierają, tak samo jak ginie głupiec i prostak, i zostawiają obcym swoje bogactwa."
"Ps49,11": "Myślą, że ich domy są wieczne, a ich mieszkania będą trwać z pokolenia na pokolenie; nazywają ziemie swymi imionami."
"Ps49,12": "Lecz człowiek, choć otoczony czcią, nie przetrwa; podobny jest do bydląt, które giną."
"Ps49,13": "Ich droga jest ich głupstwem, mimo to ich potomkowie pochwalają ich mowę. Sela."
"Ps49,14": "Jak owce będą złożeni w grobie, śmierć ich pożre; prawi będą nad nimi panować o poranku, ich postać zostanie zniszczona w grobie, gdy opuszczą swoje mieszkanie."
"Ps49,15": "Ale Bóg wykupi moją duszę z mocy grobu, bo mnie przyjmie. Sela."
"Ps49,16": "Nie bój się, gdy się ktoś wzbogaci, gdy się rozmnoży sława jego domu;"
"Ps49,17": "Bo gdy umrze, niczego ze sobą nie weźmie i nie pójdzie za nim jego sława."
"Ps49,18": "Chociaż za życia swej duszy pochlebiał i chwalono go, gdy dobrze się urządził;"
"Ps49,19": "Pójdzie jednak do grona swych ojców; nigdy nie ujrzą światła."
"Ps49,20": "Człowiek, który jest otoczony czcią, a nie rozumie tego, podobny jest do bydląt, które giną."
