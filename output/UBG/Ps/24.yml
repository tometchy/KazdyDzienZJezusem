"Ps24,1":
  text: "Do PANA należy ziemia i wszystko, co ją napełnia, świat i jego mieszkańcy."
  tags: []
"Ps24,2":
  text: "Na morzach bowiem ugruntował go i utwierdził na rzekach."
  tags: []
"Ps24,3":
  text: "Któż wstąpi na górę PANA? Kto stanie w jego świętym miejscu?"
  tags: []
"Ps24,4":
  text: "Człowiek rąk nieskalanych i czystego serca, który nie skłania swej duszy ku marności i nie przysięga podstępnie."
  tags: []
"Ps24,5":
  text: "On otrzyma błogosławieństwo od PANA i sprawiedliwość od Boga, swego Zbawiciela."
  tags: []
"Ps24,6":
  text: "To jest pokolenie tych, którzy go szukają, którzy szukają twego oblicza, Boże Jakuba. Sela."
  tags: []
"Ps24,7":
  text: "Podnieście, o bramy, wasze głowy; podnieście się, wrota odwieczne, aby wszedł Król chwały."
  tags: []
"Ps24,8":
  text: "Któż jest tym Królem chwały? PAN mocny i potężny, PAN potężny w boju."
  tags: []
"Ps24,9":
  text: "Podnieście, o bramy, wasze głowy; podnieście się, wrota odwieczne, aby wszedł Król chwały."
  tags: []
"Ps24,10":
  text: "Któż jest tym Królem chwały? PAN zastępów, on jest Królem chwały. Sela."
  tags: []
