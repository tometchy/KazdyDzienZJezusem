"Ps24,1": "Do PANA należy ziemia i wszystko, co ją napełnia, świat i jego mieszkańcy."
"Ps24,2": "Na morzach bowiem ugruntował go i utwierdził na rzekach."
"Ps24,3": "Któż wstąpi na górę PANA? Kto stanie w jego świętym miejscu?"
"Ps24,4": "Człowiek rąk nieskalanych i czystego serca, który nie skłania swej duszy ku marności i nie przysięga podstępnie."
"Ps24,5": "On otrzyma błogosławieństwo od PANA i sprawiedliwość od Boga, swego Zbawiciela."
"Ps24,6": "To jest pokolenie tych, którzy go szukają, którzy szukają twego oblicza, Boże Jakuba. Sela."
"Ps24,7": "Podnieście, o bramy, wasze głowy; podnieście się, wrota odwieczne, aby wszedł Król chwały."
"Ps24,8": "Któż jest tym Królem chwały? PAN mocny i potężny, PAN potężny w boju."
"Ps24,9": "Podnieście, o bramy, wasze głowy; podnieście się, wrota odwieczne, aby wszedł Król chwały."
"Ps24,10": "Któż jest tym Królem chwały? PAN zastępów, on jest Królem chwały. Sela."
