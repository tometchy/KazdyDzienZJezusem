"Ps22,1":
  text: "Boże mój, Boże mój, czemu mnie opuściłeś? Czemu jesteś tak daleki od wybawienia mnie, od słów mego jęku?"
  tags: []
"Ps22,2":
  text: "Boże mój, wołam we dnie, a nie odzywasz się do mnie; w nocy, a nie mogę się uspokoić."
  tags: []
"Ps22,3":
  text: "Ale ty jesteś Święty, mieszkający wśród chwały Izraela."
  tags: []
"Ps22,4":
  text: "Tobie ufali nasi ojcowie, ufali i wyzwoliłeś ich."
  tags: []
"Ps22,5":
  text: "Do ciebie wołali i zostali wybawieni, tobie ufali i się nie zawiedli."
  tags: []
"Ps22,6":
  text: "Ja zaś jestem robakiem, a nie człowiekiem, pośmiewiskiem ludzi i wzgardą ludu."
  tags: []
"Ps22,7":
  text: "Wszyscy, którzy mnie widzą, szydzą ze mnie, wykrzywiają usta, potrząsają głową, mówiąc:"
  tags: []
"Ps22,8":
  text: "Zaufał PANU, niech go wyzwoli; niech go ocali, skoro go kocha."
  tags: []
"Ps22,9":
  text: "Ale to ty mnie wydobyłeś z łona, napełniłeś mnie ufnością jeszcze u piersi mojej matki."
  tags: []
"Ps22,10":
  text: "Na ciebie byłem zdany od narodzenia, od łona matki ty jesteś moim Bogiem."
  tags: []
"Ps22,11":
  text: "Nie oddalaj się ode mnie, bo utrapienie bliskie, a nie ma nikogo, kto by mnie wspomógł."
  tags: []
"Ps22,12":
  text: "Otoczyło mnie mnóstwo cielców, osaczyły mnie byki Baszanu."
  tags: []
"Ps22,13":
  text: "Rozwarły na mnie swe paszcze jak lew drapieżny i ryczący."
  tags: []
"Ps22,14":
  text: "Rozpłynąłem się jak woda i rozłączyły się wszystkie moje kości; moje serce stało się jak wosk, roztopiło się w moim wnętrzu."
  tags: []
"Ps22,15":
  text: "Moja siła wyschła jak skorupa, a mój język przylgnął do podniebienia; położyłeś mnie w prochu śmierci."
  tags: []
"Ps22,16":
  text: "Psy bowiem mnie osaczyły, obległa mnie zgraja złoczyńców; przebili moje ręce i nogi."
  tags: []
"Ps22,17":
  text: "Mogę policzyć wszystkie moje kości; a oni patrzą na mnie, przypatrują się."
  tags: []
"Ps22,18":
  text: "Dzielą między siebie moje szaty i o moją tunikę rzucają losy."
  tags: []
"Ps22,19":
  text: "Ale ty, PANIE, nie oddalaj się; mocy moja, spiesz mi na ratunek."
  tags: []
"Ps22,20":
  text: "Ocal od miecza moją duszę, od mocy psów cenną duszę moją."
  tags: []
"Ps22,21":
  text: "Wybaw mnie z lwiej paszczy, bo i od rogów jednorożców mnie ocaliłeś."
  tags: []
"Ps22,22":
  text: "Będę głosił twoje imię moim braciom, będę cię chwalił pośród zgromadzenia."
  tags: []
"Ps22,23":
  text: "Chwalcie PANA, wy, którzy się go boicie; wysławiajcie go, całe potomstwo Jakuba; bójcie się go, wszyscy potomkowie Izraela."
  tags: []
"Ps22,24":
  text: "Bo nie wzgardził ani się nie brzydził utrapieniem ubogiego, ani nie ukrył przed nim swego oblicza, lecz gdy ten do niego wołał, wysłuchał go."
  tags: []
"Ps22,25":
  text: "Od ciebie pochodzi moja chwała w wielkim zgromadzeniu; wypełnię swoje śluby wobec tych, którzy się ciebie boją."
  tags: []
"Ps22,26":
  text: "Ubodzy będą jeść i nasycą się, chwalić PANA będą ci, którzy go szukają; wasze serce będzie żyć na wieki."
  tags: []
"Ps22,27":
  text: "Przypomną sobie i nawrócą się do PANA wszystkie krańce ziemi i oddadzą pokłon przed twoim obliczem wszystkie rodziny narodów."
  tags: []
"Ps22,28":
  text: "Do PANA bowiem należy królestwo i on panuje nad narodami."
  tags: []
"Ps22,29":
  text: "Wszyscy bogaci ziemi będą jeść i oddawać mu pokłon, upadną przed jego obliczem wszyscy, którzy zstępują w proch, którzy nie mogą swej duszy zachować przy życiu."
  tags: []
"Ps22,30":
  text: "Potomstwo będzie mu służyć i będzie poczytane Panu za pokolenie."
  tags: []
"Ps22,31":
  text: "Przyjdą i ludowi, który się narodzi, opowiedzą jego sprawiedliwość – że on tak uczynił."
  tags: []
