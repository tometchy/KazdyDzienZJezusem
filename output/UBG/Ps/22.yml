"Ps22,1": "Boże mój, Boże mój, czemu mnie opuściłeś? Czemu jesteś tak daleki od wybawienia mnie, od słów mego jęku?"
"Ps22,2": "Boże mój, wołam we dnie, a nie odzywasz się do mnie; w nocy, a nie mogę się uspokoić."
"Ps22,3": "Ale ty jesteś Święty, mieszkający wśród chwały Izraela."
"Ps22,4": "Tobie ufali nasi ojcowie, ufali i wyzwoliłeś ich."
"Ps22,5": "Do ciebie wołali i zostali wybawieni, tobie ufali i się nie zawiedli."
"Ps22,6": "Ja zaś jestem robakiem, a nie człowiekiem, pośmiewiskiem ludzi i wzgardą ludu."
"Ps22,7": "Wszyscy, którzy mnie widzą, szydzą ze mnie, wykrzywiają usta, potrząsają głową, mówiąc:"
"Ps22,8": "Zaufał PANU, niech go wyzwoli; niech go ocali, skoro go kocha."
"Ps22,9": "Ale to ty mnie wydobyłeś z łona, napełniłeś mnie ufnością jeszcze u piersi mojej matki."
"Ps22,10": "Na ciebie byłem zdany od narodzenia, od łona matki ty jesteś moim Bogiem."
"Ps22,11": "Nie oddalaj się ode mnie, bo utrapienie bliskie, a nie ma nikogo, kto by mnie wspomógł."
"Ps22,12": "Otoczyło mnie mnóstwo cielców, osaczyły mnie byki Baszanu."
"Ps22,13": "Rozwarły na mnie swe paszcze jak lew drapieżny i ryczący."
"Ps22,14": "Rozpłynąłem się jak woda i rozłączyły się wszystkie moje kości; moje serce stało się jak wosk, roztopiło się w moim wnętrzu."
"Ps22,15": "Moja siła wyschła jak skorupa, a mój język przylgnął do podniebienia; położyłeś mnie w prochu śmierci."
"Ps22,16": "Psy bowiem mnie osaczyły, obległa mnie zgraja złoczyńców; przebili moje ręce i nogi."
"Ps22,17": "Mogę policzyć wszystkie moje kości; a oni patrzą na mnie, przypatrują się."
"Ps22,18": "Dzielą między siebie moje szaty i o moją tunikę rzucają losy."
"Ps22,19": "Ale ty, PANIE, nie oddalaj się; mocy moja, spiesz mi na ratunek."
"Ps22,20": "Ocal od miecza moją duszę, od mocy psów cenną duszę moją."
"Ps22,21": "Wybaw mnie z lwiej paszczy, bo i od rogów jednorożców mnie ocaliłeś."
"Ps22,22": "Będę głosił twoje imię moim braciom, będę cię chwalił pośród zgromadzenia."
"Ps22,23": "Chwalcie PANA, wy, którzy się go boicie; wysławiajcie go, całe potomstwo Jakuba; bójcie się go, wszyscy potomkowie Izraela."
"Ps22,24": "Bo nie wzgardził ani się nie brzydził utrapieniem ubogiego, ani nie ukrył przed nim swego oblicza, lecz gdy ten do niego wołał, wysłuchał go."
"Ps22,25": "Od ciebie pochodzi moja chwała w wielkim zgromadzeniu; wypełnię swoje śluby wobec tych, którzy się ciebie boją."
"Ps22,26": "Ubodzy będą jeść i nasycą się, chwalić PANA będą ci, którzy go szukają; wasze serce będzie żyć na wieki."
"Ps22,27": "Przypomną sobie i nawrócą się do PANA wszystkie krańce ziemi i oddadzą pokłon przed twoim obliczem wszystkie rodziny narodów."
"Ps22,28": "Do PANA bowiem należy królestwo i on panuje nad narodami."
"Ps22,29": "Wszyscy bogaci ziemi będą jeść i oddawać mu pokłon, upadną przed jego obliczem wszyscy, którzy zstępują w proch, którzy nie mogą swej duszy zachować przy życiu."
"Ps22,30": "Potomstwo będzie mu służyć i będzie poczytane Panu za pokolenie."
"Ps22,31": "Przyjdą i ludowi, który się narodzi, opowiedzą jego sprawiedliwość – że on tak uczynił."
