"Ps63,1": "Boże, ty jesteś moim Bogiem, od rana cię szukam; pragnie ciebie moja dusza, tęskni do ciebie moje ciało w ziemi suchej i spragnionej, w której nie ma wody;"
"Ps63,2": "Abym widział twoją moc i chwałę tak, jak cię ujrzałem w twojej świątyni;"
"Ps63,3": "Skoro lepsze jest twoje miłosierdzie niż życie, moje wargi będą cię chwaliły;"
"Ps63,4": "Tak błogosławić cię będę póki żyję, wzniosę swe ręce w imię twoje."
"Ps63,5": "Jak tłuszczem i sadłem będzie nasycona moja dusza, moje usta będą cię wielbić radosnymi wargami;"
"Ps63,6": "Gdy cię wspominam na moim posłaniu i rozmyślam o tobie podczas nocnych straży."
"Ps63,7": "Ponieważ byłeś mi pomocą, w cieniu twoich skrzydeł będę się weselił."
"Ps63,8": "Moja dusza przylgnęła do ciebie, twoja prawica mnie podtrzymuje."
"Ps63,9": "Ale ci, którzy dążą do zguby mojej duszy, sami zejdą do głębi ziemi."
"Ps63,10": "Będą wydani pod ostrze miecza, staną się łupem lisów."
"Ps63,11": "Lecz król będzie się weselił w Bogu, będzie się chlubił każdy, kto na niego przysięga, a usta kłamców zostaną zamknięte."
