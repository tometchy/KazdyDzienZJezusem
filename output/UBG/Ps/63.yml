"Ps63,1":
  text: "Boże, ty jesteś moim Bogiem, od rana cię szukam; pragnie ciebie moja dusza, tęskni do ciebie moje ciało w ziemi suchej i spragnionej, w której nie ma wody;"
  tags: []
"Ps63,2":
  text: "Abym widział twoją moc i chwałę tak, jak cię ujrzałem w twojej świątyni;"
  tags: []
"Ps63,3":
  text: "Skoro lepsze jest twoje miłosierdzie niż życie, moje wargi będą cię chwaliły;"
  tags: []
"Ps63,4":
  text: "Tak błogosławić cię będę póki żyję, wzniosę swe ręce w imię twoje."
  tags: []
"Ps63,5":
  text: "Jak tłuszczem i sadłem będzie nasycona moja dusza, moje usta będą cię wielbić radosnymi wargami;"
  tags: []
"Ps63,6":
  text: "Gdy cię wspominam na moim posłaniu i rozmyślam o tobie podczas nocnych straży."
  tags: []
"Ps63,7":
  text: "Ponieważ byłeś mi pomocą, w cieniu twoich skrzydeł będę się weselił."
  tags: []
"Ps63,8":
  text: "Moja dusza przylgnęła do ciebie, twoja prawica mnie podtrzymuje."
  tags: []
"Ps63,9":
  text: "Ale ci, którzy dążą do zguby mojej duszy, sami zejdą do głębi ziemi."
  tags: []
"Ps63,10":
  text: "Będą wydani pod ostrze miecza, staną się łupem lisów."
  tags: []
"Ps63,11":
  text: "Lecz król będzie się weselił w Bogu, będzie się chlubił każdy, kto na niego przysięga, a usta kłamców zostaną zamknięte."
  tags: []
