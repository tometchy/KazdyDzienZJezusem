"Ps120,1": "Wołałem do PANA w swoim utrapieniu i wysłuchał mnie."
"Ps120,2": "Ocal, PANIE, moją duszę od warg kłamliwych i od zdradliwego języka."
"Ps120,3": "Cóż będzie ci dane albo co się stanie z tobą, zdradliwy języku?"
"Ps120,4": "Ostre strzały mocarza i węgle z jałowca."
"Ps120,5": "Biada mi, że przebywam w Meszek i mieszkam w namiotach Kedaru."
"Ps120,6": "Moja dusza długo mieszka z tymi, którzy nienawidzą pokoju."
"Ps120,7": "Ja jestem za pokojem, ale gdy o tym mówię, oni są za wojną."
