"Ps98,1": "Śpiewajcie PANU nową pieśń, bo cudownych rzeczy dokonał, jego prawica i święte ramię przyniosły mu zwycięstwo."
"Ps98,2": "PAN objawił swoje zbawienie, okazał swoją sprawiedliwość na oczach pogan."
"Ps98,3": "Pamiętał o swoim miłosierdziu i swojej prawdzie wobec domu Izraela; wszystkie krańce ziemi ujrzały zbawienie naszego Boga."
"Ps98,4": "Radośnie wykrzykuj PANU, cała ziemio; wykrzykujcie, weselcie się i śpiewajcie."
"Ps98,5": "Grajcie PANU na harfie, na harfie, przy słowach pieśni."
"Ps98,6": "Przy trąbach i dźwięku kornetów wykrzykujcie radośnie przed PANEM, Królem."
"Ps98,7": "Niech zaszumi morze i to, co w nim jest, świat i jego mieszkańcy."
"Ps98,8": "Niech rzeki klaszczą w dłonie, niech góry radują się wspólnie;"
"Ps98,9": "Przed PANEM, bo przychodzi, by sądzić ziemię. Będzie sądził świat sprawiedliwie i narody według słuszności."
