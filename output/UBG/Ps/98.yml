"Ps98,1":
  text: "Śpiewajcie PANU nową pieśń, bo cudownych rzeczy dokonał, jego prawica i święte ramię przyniosły mu zwycięstwo."
  tags: []
"Ps98,2":
  text: "PAN objawił swoje zbawienie, okazał swoją sprawiedliwość na oczach pogan."
  tags: []
"Ps98,3":
  text: "Pamiętał o swoim miłosierdziu i swojej prawdzie wobec domu Izraela; wszystkie krańce ziemi ujrzały zbawienie naszego Boga."
  tags: []
"Ps98,4":
  text: "Radośnie wykrzykuj PANU, cała ziemio; wykrzykujcie, weselcie się i śpiewajcie."
  tags: []
"Ps98,5":
  text: "Grajcie PANU na harfie, na harfie, przy słowach pieśni."
  tags: []
"Ps98,6":
  text: "Przy trąbach i dźwięku kornetów wykrzykujcie radośnie przed PANEM, Królem."
  tags: []
"Ps98,7":
  text: "Niech zaszumi morze i to, co w nim jest, świat i jego mieszkańcy."
  tags: []
"Ps98,8":
  text: "Niech rzeki klaszczą w dłonie, niech góry radują się wspólnie;"
  tags: []
"Ps98,9":
  text: "Przed PANEM, bo przychodzi, by sądzić ziemię. Będzie sądził świat sprawiedliwie i narody według słuszności."
  tags: []
