"Ps149,1":
  text: "Alleluja. Śpiewajcie PANU nową pieśń; niech jego chwała zabrzmi w zgromadzeniu świętych."
  tags: []
"Ps149,2":
  text: "Niech Izrael cieszy się swoim Stwórcą; niech synowie Syjonu radują się swoim Królem."
  tags: []
"Ps149,3":
  text: "Niech chwalą jego imię tańcem; niech grają mu na bębnie i na harfie."
  tags: []
"Ps149,4":
  text: "PAN bowiem swój lud upodobał sobie; zdobi pokornych zbawieniem."
  tags: []
"Ps149,5":
  text: "Niech święci się radują w chwale Bożej, niech śpiewają na swych posłaniach."
  tags: []
"Ps149,6":
  text: "Niech chwała Boża będzie na ich ustach, a miecz obosieczny w ich rękach;"
  tags: []
"Ps149,7":
  text: "Aby dokonali zemsty na poganach i ukarali narody;"
  tags: []
"Ps149,8":
  text: "Aby zakuli ich królów w kajdany, a ich dostojników w żelazne okowy;"
  tags: []
"Ps149,9":
  text: "Aby wykonali na nich zapisany wyrok. Taka jest chwała wszystkich jego świętych. Alleluja."
  tags: []
