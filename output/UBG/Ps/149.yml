"Ps149,1": "Alleluja. Śpiewajcie PANU nową pieśń; niech jego chwała zabrzmi w zgromadzeniu świętych."
"Ps149,2": "Niech Izrael cieszy się swoim Stwórcą; niech synowie Syjonu radują się swoim Królem."
"Ps149,3": "Niech chwalą jego imię tańcem; niech grają mu na bębnie i na harfie."
"Ps149,4": "PAN bowiem swój lud upodobał sobie; zdobi pokornych zbawieniem."
"Ps149,5": "Niech święci się radują w chwale Bożej, niech śpiewają na swych posłaniach."
"Ps149,6": "Niech chwała Boża będzie na ich ustach, a miecz obosieczny w ich rękach;"
"Ps149,7": "Aby dokonali zemsty na poganach i ukarali narody;"
"Ps149,8": "Aby zakuli ich królów w kajdany, a ich dostojników w żelazne okowy;"
"Ps149,9": "Aby wykonali na nich zapisany wyrok. Taka jest chwała wszystkich jego świętych. Alleluja."
