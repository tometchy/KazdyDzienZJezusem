"Ps121,1": "Oczy moje podnoszę ku górom, skąd przyjdzie mi pomoc."
"Ps121,2": "Moja pomoc jest od PANA, który stworzył niebo i ziemię."
"Ps121,3": "Nie pozwoli zachwiać się twojej nodze; twój stróż nie drzemie."
"Ps121,4": "Oto ten, który strzeże Izraela, nie zdrzemnie się ani nie zaśnie."
"Ps121,5": "PAN jest twoim stróżem, PAN jest cieniem twoim po twojej prawicy."
"Ps121,6": "Słońce nie porazi cię za dnia ani księżyc w nocy."
"Ps121,7": "PAN będzie cię strzegł od wszelkiego zła; on będzie strzegł twojej duszy."
"Ps121,8": "PAN będzie strzegł twego wyjścia i przyjścia, odtąd aż na wieki."
