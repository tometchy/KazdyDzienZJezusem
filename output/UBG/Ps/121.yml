"Ps121,1":
  text: "Oczy moje podnoszę ku górom, skąd przyjdzie mi pomoc."
  tags: []
"Ps121,2":
  text: "Moja pomoc jest od PANA, który stworzył niebo i ziemię."
  tags: []
"Ps121,3":
  text: "Nie pozwoli zachwiać się twojej nodze; twój stróż nie drzemie."
  tags: []
"Ps121,4":
  text: "Oto ten, który strzeże Izraela, nie zdrzemnie się ani nie zaśnie."
  tags: []
"Ps121,5":
  text: "PAN jest twoim stróżem, PAN jest cieniem twoim po twojej prawicy."
  tags: []
"Ps121,6":
  text: "Słońce nie porazi cię za dnia ani księżyc w nocy."
  tags: []
"Ps121,7":
  text: "PAN będzie cię strzegł od wszelkiego zła; on będzie strzegł twojej duszy."
  tags: []
"Ps121,8":
  text: "PAN będzie strzegł twego wyjścia i przyjścia, odtąd aż na wieki."
  tags: []
