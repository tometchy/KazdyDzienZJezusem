"Ps88,1":
  text: "PANIE, Boże mego zbawienia, we dnie i w nocy wołam do ciebie."
  tags: []
"Ps88,2":
  text: "Niech dojdzie do ciebie moja modlitwa, nakłoń swego ucha na moje wołanie."
  tags: []
"Ps88,3":
  text: "Moja dusza bowiem jest nasycona utrapieniem, a moje życie zbliża się do grobu."
  tags: []
"Ps88,4":
  text: "Zaliczono mnie do tych, którzy zstępują do dołu; stałem się jak człowiek bez siły."
  tags: []
"Ps88,5":
  text: "Zaliczono mnie do umarłych; jestem jak zabici, którzy leżą w grobie, o których już nie pamiętasz i którzy są odłączeni od twojej ręki."
  tags: []
"Ps88,6":
  text: "Strąciłeś mnie w najgłębszy dół, w ciemności, w głębie."
  tags: []
"Ps88,7":
  text: "Twój gniew ciąży na mnie i przytłoczyłeś mnie wszystkimi twymi falami. Sela."
  tags: []
"Ps88,8":
  text: "Oddaliłeś ode mnie moich znajomych, uczyniłeś mnie dla nich ohydą; jestem uwięziony i nie mam wyjścia."
  tags: []
"Ps88,9":
  text: "Moje oko płacze nad moim utrapieniem; wzywam cię, PANIE, codziennie, wyciągam do ciebie swe ręce."
  tags: []
"Ps88,10":
  text: "Czy dla umarłych będziesz czynił cuda? Czy umarli powstaną, aby cię wysławiać? Sela."
  tags: []
"Ps88,11":
  text: "Czy w grobie będzie się opowiadać o twoim miłosierdziu, a o twojej wierności – w zniszczeniu?"
  tags: []
"Ps88,12":
  text: "Czy twoje cuda pozna się w ciemnościach, a twoją sprawiedliwość w ziemi zapomnienia?"
  tags: []
"Ps88,13":
  text: "Lecz ja, PANIE, do ciebie wołam; rankiem wita cię moja modlitwa."
  tags: []
"Ps88,14":
  text: "Dlaczego, PANIE, odrzucasz moją duszę i ukrywasz przede mną swoje oblicze?"
  tags: []
"Ps88,15":
  text: "Jestem strapiony i od młodości bliski śmierci; znoszę twoją grozę i trwożę się."
  tags: []
"Ps88,16":
  text: "Twój srogi gniew spadł na mnie i wyniszczyła mnie twoja groza."
  tags: []
"Ps88,17":
  text: "Ogarniają mnie co dzień jak woda, wszystkie mnie otaczają."
  tags: []
"Ps88,18":
  text: "Oddaliłeś ode mnie przyjaciela i towarzysza, a moich znajomych – w ciemności."
  tags: []
