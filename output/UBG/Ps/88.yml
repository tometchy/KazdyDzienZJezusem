"Ps88,1": "PANIE, Boże mego zbawienia, we dnie i w nocy wołam do ciebie."
"Ps88,2": "Niech dojdzie do ciebie moja modlitwa, nakłoń swego ucha na moje wołanie."
"Ps88,3": "Moja dusza bowiem jest nasycona utrapieniem, a moje życie zbliża się do grobu."
"Ps88,4": "Zaliczono mnie do tych, którzy zstępują do dołu; stałem się jak człowiek bez siły."
"Ps88,5": "Zaliczono mnie do umarłych; jestem jak zabici, którzy leżą w grobie, o których już nie pamiętasz i którzy są odłączeni od twojej ręki."
"Ps88,6": "Strąciłeś mnie w najgłębszy dół, w ciemności, w głębie."
"Ps88,7": "Twój gniew ciąży na mnie i przytłoczyłeś mnie wszystkimi twymi falami. Sela."
"Ps88,8": "Oddaliłeś ode mnie moich znajomych, uczyniłeś mnie dla nich ohydą; jestem uwięziony i nie mam wyjścia."
"Ps88,9": "Moje oko płacze nad moim utrapieniem; wzywam cię, PANIE, codziennie, wyciągam do ciebie swe ręce."
"Ps88,10": "Czy dla umarłych będziesz czynił cuda? Czy umarli powstaną, aby cię wysławiać? Sela."
"Ps88,11": "Czy w grobie będzie się opowiadać o twoim miłosierdziu, a o twojej wierności – w zniszczeniu?"
"Ps88,12": "Czy twoje cuda pozna się w ciemnościach, a twoją sprawiedliwość w ziemi zapomnienia?"
"Ps88,13": "Lecz ja, PANIE, do ciebie wołam; rankiem wita cię moja modlitwa."
"Ps88,14": "Dlaczego, PANIE, odrzucasz moją duszę i ukrywasz przede mną swoje oblicze?"
"Ps88,15": "Jestem strapiony i od młodości bliski śmierci; znoszę twoją grozę i trwożę się."
"Ps88,16": "Twój srogi gniew spadł na mnie i wyniszczyła mnie twoja groza."
"Ps88,17": "Ogarniają mnie co dzień jak woda, wszystkie mnie otaczają."
"Ps88,18": "Oddaliłeś ode mnie przyjaciela i towarzysza, a moich znajomych – w ciemności."
