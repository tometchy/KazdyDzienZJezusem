"Ps142,1":
  text: "Swoim głosem wołam do PANA; swoim głosem modlę się do PANA."
  tags: []
"Ps142,2":
  text: "Wylewam przed nim swoją troskę i opowiadam mu swoje utrapienie."
  tags: []
"Ps142,3":
  text: "Gdy mój duch jest we mnie zdruzgotany, ty znasz moją ścieżkę; na drodze, którą chodziłem, zastawili na mnie sidło."
  tags: []
"Ps142,4":
  text: "Oglądałem się na prawo i spojrzałem, ale nie było nikogo, kto mnie znał; nie było dla mnie ucieczki, nikt się nie troszczył o moją duszę."
  tags: []
"Ps142,5":
  text: "PANIE, wołam do ciebie, mówiąc: Ty jesteś moją nadzieją, ty jesteś moim udziałem w ziemi żyjących."
  tags: []
"Ps142,6":
  text: "Wysłuchaj mego wołania, bo jestem bardzo udręczony; ocal mnie od moich prześladowców, bo są mocniejsi ode mnie."
  tags: []
"Ps142,7":
  text: "Wyprowadź moją duszę z więzienia, abym chwalił twoje imię; sprawiedliwi otoczą mnie, gdy okażesz mi dobroć."
  tags: []
