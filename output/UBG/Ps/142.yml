"Ps142,1": "Swoim głosem wołam do PANA; swoim głosem modlę się do PANA."
"Ps142,2": "Wylewam przed nim swoją troskę i opowiadam mu swoje utrapienie."
"Ps142,3": "Gdy mój duch jest we mnie zdruzgotany, ty znasz moją ścieżkę; na drodze, którą chodziłem, zastawili na mnie sidło."
"Ps142,4": "Oglądałem się na prawo i spojrzałem, ale nie było nikogo, kto mnie znał; nie było dla mnie ucieczki, nikt się nie troszczył o moją duszę."
"Ps142,5": "PANIE, wołam do ciebie, mówiąc: Ty jesteś moją nadzieją, ty jesteś moim udziałem w ziemi żyjących."
"Ps142,6": "Wysłuchaj mego wołania, bo jestem bardzo udręczony; ocal mnie od moich prześladowców, bo są mocniejsi ode mnie."
"Ps142,7": "Wyprowadź moją duszę z więzienia, abym chwalił twoje imię; sprawiedliwi otoczą mnie, gdy okażesz mi dobroć."
