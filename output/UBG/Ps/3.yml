"Ps3,1":
  text: "PANIE, jakże się namnożyło moich nieprzyjaciół, jak wielu powstaje przeciwko mnie!"
  tags: []
"Ps3,2":
  text: "Wielu mówi o mojej duszy: Nie ma dla niego ratunku u Boga. Sela."
  tags: []
"Ps3,3":
  text: "Ale ty, PANIE, jesteś moją tarczą, moją chwałą, tym, który podnosi moją głowę."
  tags: []
"Ps3,4":
  text: "Swym głosem wołałem do PANA i wysłuchał mnie ze swojej świętej góry. Sela."
  tags: []
"Ps3,5":
  text: "Położyłem się i zasnąłem, i obudziłem się, bo PAN mnie podtrzymał."
  tags: []
"Ps3,6":
  text: "Nie przestraszę się dziesiątków tysięcy ludzi, którzy zewsząd na mnie nastają."
  tags: []
"Ps3,7":
  text: "Powstań, PANIE! Wybaw mnie, mój Boże! Uderzyłeś bowiem w szczękę wszystkich moich wrogów i połamałeś zęby niegodziwych."
  tags: []
"Ps3,8":
  text: "Od PANA jest zbawienie. Twoje błogosławieństwo jest nad twoim ludem. Sela."
  tags: []
