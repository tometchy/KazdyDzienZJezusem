"Ps3,1": "PANIE, jakże się namnożyło moich nieprzyjaciół, jak wielu powstaje przeciwko mnie!"
"Ps3,2": "Wielu mówi o mojej duszy: Nie ma dla niego ratunku u Boga. Sela."
"Ps3,3": "Ale ty, PANIE, jesteś moją tarczą, moją chwałą, tym, który podnosi moją głowę."
"Ps3,4": "Swym głosem wołałem do PANA i wysłuchał mnie ze swojej świętej góry. Sela."
"Ps3,5": "Położyłem się i zasnąłem, i obudziłem się, bo PAN mnie podtrzymał."
"Ps3,6": "Nie przestraszę się dziesiątków tysięcy ludzi, którzy zewsząd na mnie nastają."
"Ps3,7": "Powstań, PANIE! Wybaw mnie, mój Boże! Uderzyłeś bowiem w szczękę wszystkich moich wrogów i połamałeś zęby niegodziwych."
"Ps3,8": "Od PANA jest zbawienie. Twoje błogosławieństwo jest nad twoim ludem. Sela."
