"Ps135,1": "Alleluja. Chwalcie imię PANA; chwalcie, słudzy PANA;"
"Ps135,2": "Którzy stoicie w domu PANA, w przedsionkach domu naszego Boga."
"Ps135,3": "Chwalcie PANA, bo PAN jest dobry; śpiewajcie jego imieniu, bo jest wdzięczne."
"Ps135,4": "PAN bowiem wybrał sobie Jakuba i Izraela na swoją szczególną własność."
"Ps135,5": "Wiem, że wielki jest PAN, a nasz Pan jest ponad wszystkimi bogami."
"Ps135,6": "Wszystko, co PAN chce, to czyni na niebie i na ziemi, w morzu i we wszystkich głębinach."
"Ps135,7": "On sprawia, że mgły wznoszą się z krańców ziemi; wywołuje błyskawice i deszcz, wydobywa wiatr ze swoich skarbców;"
"Ps135,8": "Poraził pierworodnych w Egipcie, od człowieka aż do zwierzęcia."
"Ps135,9": "Zesłał znaki i cuda pośród ciebie, Egipcie; na faraona i na wszystkie jego sługi."
"Ps135,10": "Pobił wiele narodów i zgładził potężnych królów;"
"Ps135,11": "Sychona, króla Amorytów, i Oga, króla Baszanu, i wszystkie królestwa Kanaanu;"
"Ps135,12": "I dał ich ziemię w dziedzictwo, w dziedzictwo Izraelowi, swemu ludowi."
"Ps135,13": "Twoje imię, PANIE, trwa na wieki; twoja pamięć, PANIE, z pokolenia na pokolenie."
"Ps135,14": "Bo PAN będzie sądzić swój lud i zmiłuje się nad swymi sługami."
"Ps135,15": "Bożki pogan to srebro i złoto, dzieło ludzkich rąk."
"Ps135,16": "Mają usta, ale nie mówią; mają oczy, ale nie widzą;"
"Ps135,17": "Mają uszy, ale nie słyszą, i nie ma oddechu w ich ustach."
"Ps135,18": "Podobni są do nich ci, którzy je robią, i wszyscy, którzy w nich pokładają ufność."
"Ps135,19": "Domu Izraela, błogosławcie PANA; domu Aarona, błogosławcie PANA."
"Ps135,20": "Domu Lewiego, błogosławcie PANA; wy, którzy się boicie PANA, błogosławcie PANA."
"Ps135,21": "Niech będzie błogosławiony z Syjonu PAN, który mieszka w Jeruzalem. Alleluja."
