"Ps135,1":
  text: "Alleluja. Chwalcie imię PANA; chwalcie, słudzy PANA;"
  tags: []
"Ps135,2":
  text: "Którzy stoicie w domu PANA, w przedsionkach domu naszego Boga."
  tags: []
"Ps135,3":
  text: "Chwalcie PANA, bo PAN jest dobry; śpiewajcie jego imieniu, bo jest wdzięczne."
  tags: []
"Ps135,4":
  text: "PAN bowiem wybrał sobie Jakuba i Izraela na swoją szczególną własność."
  tags: []
"Ps135,5":
  text: "Wiem, że wielki jest PAN, a nasz Pan jest ponad wszystkimi bogami."
  tags: []
"Ps135,6":
  text: "Wszystko, co PAN chce, to czyni na niebie i na ziemi, w morzu i we wszystkich głębinach."
  tags: []
"Ps135,7":
  text: "On sprawia, że mgły wznoszą się z krańców ziemi; wywołuje błyskawice i deszcz, wydobywa wiatr ze swoich skarbców;"
  tags: []
"Ps135,8":
  text: "Poraził pierworodnych w Egipcie, od człowieka aż do zwierzęcia."
  tags: []
"Ps135,9":
  text: "Zesłał znaki i cuda pośród ciebie, Egipcie; na faraona i na wszystkie jego sługi."
  tags: []
"Ps135,10":
  text: "Pobił wiele narodów i zgładził potężnych królów;"
  tags: []
"Ps135,11":
  text: "Sychona, króla Amorytów, i Oga, króla Baszanu, i wszystkie królestwa Kanaanu;"
  tags: []
"Ps135,12":
  text: "I dał ich ziemię w dziedzictwo, w dziedzictwo Izraelowi, swemu ludowi."
  tags: []
"Ps135,13":
  text: "Twoje imię, PANIE, trwa na wieki; twoja pamięć, PANIE, z pokolenia na pokolenie."
  tags: []
"Ps135,14":
  text: "Bo PAN będzie sądzić swój lud i zmiłuje się nad swymi sługami."
  tags: []
"Ps135,15":
  text: "Bożki pogan to srebro i złoto, dzieło ludzkich rąk."
  tags: []
"Ps135,16":
  text: "Mają usta, ale nie mówią; mają oczy, ale nie widzą;"
  tags: []
"Ps135,17":
  text: "Mają uszy, ale nie słyszą, i nie ma oddechu w ich ustach."
  tags: []
"Ps135,18":
  text: "Podobni są do nich ci, którzy je robią, i wszyscy, którzy w nich pokładają ufność."
  tags: []
"Ps135,19":
  text: "Domu Izraela, błogosławcie PANA; domu Aarona, błogosławcie PANA."
  tags: []
"Ps135,20":
  text: "Domu Lewiego, błogosławcie PANA; wy, którzy się boicie PANA, błogosławcie PANA."
  tags: []
"Ps135,21":
  text: "Niech będzie błogosławiony z Syjonu PAN, który mieszka w Jeruzalem. Alleluja."
  tags: []
