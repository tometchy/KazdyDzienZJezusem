"Ps99,1":
  text: "PAN króluje, niech drżą narody; siedzi między cherubinami, niech zachwieje się ziemia."
  tags: []
"Ps99,2":
  text: "Wielki jest PAN na Syjonie i wywyższony nad wszystkie narody."
  tags: []
"Ps99,3":
  text: "Niech wysławiają twoje wielkie i straszne imię, bo jest święte."
  tags: []
"Ps99,4":
  text: "Moc króla miłuje sąd, ty ustanowiłeś słuszność, ty wykonujesz sąd i sprawiedliwość w Jakubie."
  tags: []
"Ps99,5":
  text: "Wywyższajcie PANA, naszego Boga, i oddajcie pokłon u podnóżka jego stóp, bo on jest święty."
  tags: []
"Ps99,6":
  text: "Mojżesz i Aaron wśród jego kapłanów, a Samuel wśród tych, którzy wzywają jego imienia; wołali do PANA, a on ich wysłuchał."
  tags: []
"Ps99,7":
  text: "W słupie obłoku mówił do nich, a oni strzegli jego świadectw i praw, które im dał."
  tags: []
"Ps99,8":
  text: "PANIE, nasz Boże, ty ich wysłuchiwałeś, byłeś dla nich Bogiem, który przebacza, choć karałeś ich za ich występki."
  tags: []
"Ps99,9":
  text: "Wywyższajcie PANA, naszego Boga, i oddajcie pokłon na jego świętej górze, bo PAN, nasz Bóg, jest święty."
  tags: []
