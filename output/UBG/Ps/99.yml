"Ps99,1": "PAN króluje, niech drżą narody; siedzi między cherubinami, niech zachwieje się ziemia."
"Ps99,2": "Wielki jest PAN na Syjonie i wywyższony nad wszystkie narody."
"Ps99,3": "Niech wysławiają twoje wielkie i straszne imię, bo jest święte."
"Ps99,4": "Moc króla miłuje sąd, ty ustanowiłeś słuszność, ty wykonujesz sąd i sprawiedliwość w Jakubie."
"Ps99,5": "Wywyższajcie PANA, naszego Boga, i oddajcie pokłon u podnóżka jego stóp, bo on jest święty."
"Ps99,6": "Mojżesz i Aaron wśród jego kapłanów, a Samuel wśród tych, którzy wzywają jego imienia; wołali do PANA, a on ich wysłuchał."
"Ps99,7": "W słupie obłoku mówił do nich, a oni strzegli jego świadectw i praw, które im dał."
"Ps99,8": "PANIE, nasz Boże, ty ich wysłuchiwałeś, byłeś dla nich Bogiem, który przebacza, choć karałeś ich za ich występki."
"Ps99,9": "Wywyższajcie PANA, naszego Boga, i oddajcie pokłon na jego świętej górze, bo PAN, nasz Bóg, jest święty."
