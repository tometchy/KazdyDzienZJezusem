"Ps53,1":
  text: "Głupi mówi w swoim sercu: Nie ma Boga. Są zepsuci i czynią obrzydliwą nieprawość; nie ma nikogo, kto by czynił dobro."
  tags: []
"Ps53,2":
  text: "Bóg spojrzał z niebios na synów ludzkich, aby zobaczyć, czy jest ktoś rozumny i szukający Boga."
  tags: []
"Ps53,3":
  text: "Wszyscy zboczyli z drogi, wszyscy jednakowo znikczemnieli; nie ma nikogo, kto by czynił dobro, nie ma ani jednego."
  tags: []
"Ps53,4":
  text: "Czyż są nierozumni czyniący nieprawość, którzy pożerają mój lud, jakby chleb jedli, a Boga nie wzywają?"
  tags: []
"Ps53,5":
  text: "Tam ogarnął ich strach, gdzie nie było powodu do strachu, Bóg bowiem rozproszył kości tych, którzy cię oblegali; ty okryjesz ich hańbą, bo Bóg nimi wzgardził."
  tags: []
"Ps53,6":
  text: "Któż ześle z Syjonu zbawienie Izraelowi? Gdy Bóg odwróci niewolę swego ludu, Jakub się rozraduje i rozweseli się Izrael."
  tags: []
