"Ps53,1": "Głupi mówi w swoim sercu: Nie ma Boga. Są zepsuci i czynią obrzydliwą nieprawość; nie ma nikogo, kto by czynił dobro."
"Ps53,2": "Bóg spojrzał z niebios na synów ludzkich, aby zobaczyć, czy jest ktoś rozumny i szukający Boga."
"Ps53,3": "Wszyscy zboczyli z drogi, wszyscy jednakowo znikczemnieli; nie ma nikogo, kto by czynił dobro, nie ma ani jednego."
"Ps53,4": "Czyż są nierozumni czyniący nieprawość, którzy pożerają mój lud, jakby chleb jedli, a Boga nie wzywają?"
"Ps53,5": "Tam ogarnął ich strach, gdzie nie było powodu do strachu, Bóg bowiem rozproszył kości tych, którzy cię oblegali; ty okryjesz ich hańbą, bo Bóg nimi wzgardził."
"Ps53,6": "Któż ześle z Syjonu zbawienie Izraelowi? Gdy Bóg odwróci niewolę swego ludu, Jakub się rozraduje i rozweseli się Izrael."
