"Ps105,1": "Wysławiajcie PANA, wzywajcie jego imienia, opowiadajcie jego dzieła wśród narodów."
"Ps105,2": "Śpiewajcie mu, śpiewajcie mu psalmy, rozmawiajcie o wszystkich jego cudach."
"Ps105,3": "Chlubcie się jego świętym imieniem, niech się weseli serce szukających PANA."
"Ps105,4": "Szukajcie PANA i jego mocy, szukajcie zawsze jego oblicza."
"Ps105,5": "Przypominajcie sobie dzieła, które czynił; jego cuda i wyroki jego ust."
"Ps105,6": "Wy, potomkowie Abrahama, jego słudzy; wy, synowie Jakuba, jego wybrańcy!"
"Ps105,7": "On jest PANEM, naszym Bogiem, jego sądy po całej ziemi."
"Ps105,8": "Pamięta wiecznie o swoim przymierzu; o słowie, które nakazał po tysiąc pokoleń;"
"Ps105,9": "O przymierzu, które zawarł z Abrahamem, i o przysiędze złożonej Izaakowi."
"Ps105,10": "Ustanowił je jako prawo dla Jakuba, dla Izraela jako wieczne przymierze;"
"Ps105,11": "Mówiąc: Tobie dam ziemię Kanaan jako dział waszego dziedzictwa;"
"Ps105,12": "Kiedy ich było niewielu, nieliczni i obcy w niej."
"Ps105,13": "I wędrowali od narodu do narodu, z jednego królestwa do innego ludu;"
"Ps105,14": "Nikomu nie pozwolił ich krzywdzić, nawet karcił królów z ich powodu, mówiąc:"
"Ps105,15": "Nie dotykajcie moich pomazańców, a moim prorokom nie czyńcie nic złego."
"Ps105,16": "Potem przywołał głód na ziemię i zniszczył cały zapas chleba."
"Ps105,17": "Posłał przed nimi męża, Józefa, który został sprzedany jako niewolnik;"
"Ps105,18": "Którego nogi ranili pętami, a w żelazo zakuto jego ciało;"
"Ps105,19": "Aż do tego czasu, gdy jego słowo się spełniło, słowo PANA doświadczało go."
"Ps105,20": "Posłał król i kazał go uwolnić, władca narodu wypuścił go na wolność."
"Ps105,21": "Ustanowił go panem swego domu i władcą wszystkich swoich posiadłości;"
"Ps105,22": "Aby rządził jego dostojnikami według swego uznania i jego starszych nauczał mądrości."
"Ps105,23": "Potem Izrael wszedł do Egiptu, a Jakub był gościem w ziemi Chama;"
"Ps105,24": "Gdzie Bóg bardzo rozmnożył swój lud i uczynił go potężniejszym od jego wrogów."
"Ps105,25": "Odmienił ich serca, żeby znienawidzili jego lud i postępowali przebiegle wobec jego sług."
"Ps105,26": "Posłał Mojżesza, swego sługę, i Aarona, którego wybrał;"
"Ps105,27": "Pokazali im jego znaki i cuda w ziemi Chama."
"Ps105,28": "Zesłał ciemności i nastał mrok, i nie buntowali się przeciw jego słowu."
"Ps105,29": "Zamienił ich wody w krew i pozabijał ich ryby."
"Ps105,30": "Ich ziemia wydała mnóstwo żab, były nawet w komnatach królewskich."
"Ps105,31": "Rozkazał i zjawiły się rozmaite muchy i wszy w całym ich kraju."
"Ps105,32": "Zesłał grad zamiast deszczu, ogień płonący na ich ziemię."
"Ps105,33": "Zniszczył ich winnice i figowce i połamał drzewa w ich kraju."
"Ps105,34": "Rozkazał i zjawiła się szarańcza, niezliczone mnóstwo larw;"
"Ps105,35": "I pożarły całą zieleń w ich kraju, i zjadły płody ich ziemi."
"Ps105,36": "Zabił też wszystko, co pierworodne w ich ziemi, pierwociny wszelkiej ich siły."
"Ps105,37": "Wyprowadził ich ze srebrem i złotem i nie było słabego wśród ich plemion."
"Ps105,38": "Egipt się radował, gdy wychodzili, bo ogarnął go strach przed nimi."
"Ps105,39": "Rozpostarł obłok jak osłonę, a ogień, by świecił w nocy."
"Ps105,40": "Na ich żądanie zesłał przepiórki i nasycił ich chlebem z nieba."
"Ps105,41": "Otworzył skałę i trysnęły wody, popłynęły po suchych miejscach jak rzeka;"
"Ps105,42": "Pamiętał bowiem o swoim świętym słowie i o Abrahamie, swym słudze."
"Ps105,43": "Wyprowadził swój lud wśród wesela, swoich wybranych wśród radości."
"Ps105,44": "I dał im ziemię pogan, i zawładnęli dorobkiem narodów;"
"Ps105,45": "Aby zachowywali jego nakazy i przestrzegali jego praw. Alleluja."
