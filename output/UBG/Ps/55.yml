"Ps55,1": "Boże, nakłoń ucha ku mojej modlitwie i nie ukrywaj się przed moją prośbą."
"Ps55,2": "Posłuchaj uważnie i wysłuchaj mnie; uskarżam się w swej modlitwie i jęczę;"
"Ps55,3": "Z powodu głosu wroga, z powodu ucisku niegodziwego; zwalają na mnie nieprawość i w gniewie sprzeciwiają mi się."
"Ps55,4": "Moje serce boleje we mnie i dopadł mnie strach przed śmiercią."
"Ps55,5": "Przyszły na mnie bojaźń i drżenie i przejęła mnie trwoga."
"Ps55,6": "I powiedziałem: O, gdybym miał skrzydła jak gołębica, uleciałbym i odpoczął."
"Ps55,7": "Oto bym uleciał daleko i zamieszkał na pustyni. Sela."
"Ps55,8": "Pospieszyłbym, aby ujść przed wichrem i nawałnicą."
"Ps55,9": "Zniszcz, Panie, rozdziel ich język, bo widzę przemoc i niezgodę w mieście."
"Ps55,10": "Dniem i nocą krążą wokoło po jego murach, a wewnątrz niego zło i ucisk."
"Ps55,11": "Wewnątrz niego jest niegodziwość, a z jego ulic nie znika oszustwo i podstęp."
"Ps55,12": "Bo to nie wróg mnie lżył, co mógłbym znieść; nie powstał przeciwko mnie ten, który mnie nienawidził – wtedy ukryłbym się przed nim;"
"Ps55,13": "Ale ty, człowiek równy mi, mój wódz i przyjaciel."
"Ps55,14": "Mile naradzaliśmy się ze sobą i razem chodziliśmy do domu Bożego."
"Ps55,15": "Niech śmierć ich zaskoczy, niech żywcem zstąpią do piekła, bo w ich domach i wśród nich mieszka zło."
"Ps55,16": "Ja zaś do Boga zawołam i PAN mnie wybawi."
"Ps55,17": "Wieczorem, rano i w południe będę się modlić i głośno wołać, a on wysłucha mego głosu."
"Ps55,18": "Odkupił moją duszę, abym miał spokój od walki, jaką ze mną toczyli, bo wielu ich było przy mnie."
"Ps55,19": "Bóg wysłucha i będzie ich trapić ten, który trwa od wieków. Sela. Bo nie poprawiają się i nie boją się Boga."
"Ps55,20": "Podniósł rękę na tych, którzy utrzymywali z nim pokój; złamał swoje przymierze."
"Ps55,21": "Gładsze niż masło były słowa jego ust, lecz wrogość miał w sercu; miększe niż oliwa jego słowa, ale były jak obnażone miecze."
"Ps55,22": "Przerzuć swój ciężar na PANA, a on cię podtrzyma; nie dopuści nigdy, by miał się zachwiać sprawiedliwy."
"Ps55,23": "Ale ty, Boże, wtrącisz ich w dół zatracenia; ludzie krwawi i podstępni nie dożyją połowy swoich dni; ja zaś zaufam tobie."
