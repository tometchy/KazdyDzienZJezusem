"Ps55,1":
  text: "Boże, nakłoń ucha ku mojej modlitwie i nie ukrywaj się przed moją prośbą."
  tags: []
"Ps55,2":
  text: "Posłuchaj uważnie i wysłuchaj mnie; uskarżam się w swej modlitwie i jęczę;"
  tags: []
"Ps55,3":
  text: "Z powodu głosu wroga, z powodu ucisku niegodziwego; zwalają na mnie nieprawość i w gniewie sprzeciwiają mi się."
  tags: []
"Ps55,4":
  text: "Moje serce boleje we mnie i dopadł mnie strach przed śmiercią."
  tags: []
"Ps55,5":
  text: "Przyszły na mnie bojaźń i drżenie i przejęła mnie trwoga."
  tags: []
"Ps55,6":
  text: "I powiedziałem: O, gdybym miał skrzydła jak gołębica, uleciałbym i odpoczął."
  tags: []
"Ps55,7":
  text: "Oto bym uleciał daleko i zamieszkał na pustyni. Sela."
  tags: []
"Ps55,8":
  text: "Pospieszyłbym, aby ujść przed wichrem i nawałnicą."
  tags: []
"Ps55,9":
  text: "Zniszcz, Panie, rozdziel ich język, bo widzę przemoc i niezgodę w mieście."
  tags: []
"Ps55,10":
  text: "Dniem i nocą krążą wokoło po jego murach, a wewnątrz niego zło i ucisk."
  tags: []
"Ps55,11":
  text: "Wewnątrz niego jest niegodziwość, a z jego ulic nie znika oszustwo i podstęp."
  tags: []
"Ps55,12":
  text: "Bo to nie wróg mnie lżył, co mógłbym znieść; nie powstał przeciwko mnie ten, który mnie nienawidził – wtedy ukryłbym się przed nim;"
  tags: []
"Ps55,13":
  text: "Ale ty, człowiek równy mi, mój wódz i przyjaciel."
  tags: []
"Ps55,14":
  text: "Mile naradzaliśmy się ze sobą i razem chodziliśmy do domu Bożego."
  tags: []
"Ps55,15":
  text: "Niech śmierć ich zaskoczy, niech żywcem zstąpią do piekła, bo w ich domach i wśród nich mieszka zło."
  tags: []
"Ps55,16":
  text: "Ja zaś do Boga zawołam i PAN mnie wybawi."
  tags: []
"Ps55,17":
  text: "Wieczorem, rano i w południe będę się modlić i głośno wołać, a on wysłucha mego głosu."
  tags: []
"Ps55,18":
  text: "Odkupił moją duszę, abym miał spokój od walki, jaką ze mną toczyli, bo wielu ich było przy mnie."
  tags: []
"Ps55,19":
  text: "Bóg wysłucha i będzie ich trapić ten, który trwa od wieków. Sela. Bo nie poprawiają się i nie boją się Boga."
  tags: []
"Ps55,20":
  text: "Podniósł rękę na tych, którzy utrzymywali z nim pokój; złamał swoje przymierze."
  tags: []
"Ps55,21":
  text: "Gładsze niż masło były słowa jego ust, lecz wrogość miał w sercu; miększe niż oliwa jego słowa, ale były jak obnażone miecze."
  tags: []
"Ps55,22":
  text: "Przerzuć swój ciężar na PANA, a on cię podtrzyma; nie dopuści nigdy, by miał się zachwiać sprawiedliwy."
  tags: []
"Ps55,23":
  text: "Ale ty, Boże, wtrącisz ich w dół zatracenia; ludzie krwawi i podstępni nie dożyją połowy swoich dni; ja zaś zaufam tobie."
  tags: []
