"Ps150,1":
  text: "Alleluja. Chwalcie Boga w jego świątyni; chwalcie go na firmamencie jego mocy."
  tags: []
"Ps150,2":
  text: "Chwalcie go za jego potężne dzieła; chwalcie go za jego wielką dostojność."
  tags: []
"Ps150,3":
  text: "Chwalcie go na głośnych trąbach; chwalcie go na cytrze i na harfie."
  tags: []
"Ps150,4":
  text: "Chwalcie go bębnem i tańcem; chwalcie go na strunach i na fletach."
  tags: []
"Ps150,5":
  text: "Chwalcie go na głośnych cymbałach; chwalcie go na cymbałach brzęczących."
  tags: []
"Ps150,6":
  text: "Niech wszystko, co oddycha, chwali PANA. Alleluja."
  tags: []
