"Ps150,1": "Alleluja. Chwalcie Boga w jego świątyni; chwalcie go na firmamencie jego mocy."
"Ps150,2": "Chwalcie go za jego potężne dzieła; chwalcie go za jego wielką dostojność."
"Ps150,3": "Chwalcie go na głośnych trąbach; chwalcie go na cytrze i na harfie."
"Ps150,4": "Chwalcie go bębnem i tańcem; chwalcie go na strunach i na fletach."
"Ps150,5": "Chwalcie go na głośnych cymbałach; chwalcie go na cymbałach brzęczących."
"Ps150,6": "Niech wszystko, co oddycha, chwali PANA. Alleluja."
