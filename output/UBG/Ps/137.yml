"Ps137,1": "Nad rzekami Babilonu, tam siedzieliśmy i płakaliśmy, wspominając Syjon."
"Ps137,2": "Na wierzbach tamtej krainy zawiesiliśmy nasze harfy;"
"Ps137,3": "Bo tam ci, którzy nas wzięli w niewolę, żądali od nas pieśni, a nasi ciemięzcy – radości, mówiąc: Śpiewajcie nam którąś z pieśni Syjonu."
"Ps137,4": "Jakże możemy śpiewać pieśń PANA na obcej ziemi?"
"Ps137,5": "Jeśli zapomnę o tobie, Jeruzalem, niech sama o sobie zapomni moja prawica."
"Ps137,6": "Niech mi język przylgnie do podniebienia, jeśli nie będę pamiętał o tobie, jeśli nie postawię Jeruzalem ponad największą moją radość."
"Ps137,7": "Pamiętaj, PANIE, synów Edomu i dzień Jeruzalem, gdy mówili: Zburzcie, zburzcie je aż do jego fundamentu."
"Ps137,8": "O córko Babilonu, i ty będziesz spustoszona. Błogosławiony, kto ci odpłaci za zło, jakie nam uczyniłaś."
"Ps137,9": "Błogosławiony, kto schwyci i roztrzaska twe dzieci o skałę."
