"Ps137,1":
  text: "Nad rzekami Babilonu, tam siedzieliśmy i płakaliśmy, wspominając Syjon."
  tags: []
"Ps137,2":
  text: "Na wierzbach tamtej krainy zawiesiliśmy nasze harfy;"
  tags: []
"Ps137,3":
  text: "Bo tam ci, którzy nas wzięli w niewolę, żądali od nas pieśni, a nasi ciemięzcy – radości, mówiąc: Śpiewajcie nam którąś z pieśni Syjonu."
  tags: []
"Ps137,4":
  text: "Jakże możemy śpiewać pieśń PANA na obcej ziemi?"
  tags: []
"Ps137,5":
  text: "Jeśli zapomnę o tobie, Jeruzalem, niech sama o sobie zapomni moja prawica."
  tags: []
"Ps137,6":
  text: "Niech mi język przylgnie do podniebienia, jeśli nie będę pamiętał o tobie, jeśli nie postawię Jeruzalem ponad największą moją radość."
  tags: []
"Ps137,7":
  text: "Pamiętaj, PANIE, synów Edomu i dzień Jeruzalem, gdy mówili: Zburzcie, zburzcie je aż do jego fundamentu."
  tags: []
"Ps137,8":
  text: "O córko Babilonu, i ty będziesz spustoszona. Błogosławiony, kto ci odpłaci za zło, jakie nam uczyniłaś."
  tags: []
"Ps137,9":
  text: "Błogosławiony, kto schwyci i roztrzaska twe dzieci o skałę."
  tags: []
