"Ps112,1": "Alleluja. Błogosławiony człowiek, który boi się PANA i ma upodobanie w jego przykazaniach."
"Ps112,2": "Jego potomstwo będzie potężne na ziemi, pokolenie prawych będzie błogosławione."
"Ps112,3": "Dobrobyt i bogactwo są w jego domu, a jego sprawiedliwość trwa na wieki."
"Ps112,4": "Dla prawych wschodzi światłość w ciemności; on jest łaskawy, miłosierny i sprawiedliwy."
"Ps112,5": "Dobry człowiek lituje się i pożycza, i prowadzi swoje sprawy rozważnie."
"Ps112,6": "Na pewno nigdy się nie zachwieje, sprawiedliwy na wieki pozostanie w pamięci."
"Ps112,7": "Nie będzie się bał złej nowiny, jego serce jest stateczne, ufa PANU."
"Ps112,8": "Jego serce jest umocnione, nie będzie się bał, aż zobaczy pomstę nad swymi wrogami."
"Ps112,9": "Rozrzucił i dał ubogim, jego sprawiedliwość trwa na wieki, jego róg będzie wywyższony w chwale."
"Ps112,10": "Niegodziwy zobaczy to i rozgniewa się, zgrzytnie zębami i uschnie, pragnienie niegodziwych zginie."
