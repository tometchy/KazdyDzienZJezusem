"Ps112,1":
  text: "Alleluja. Błogosławiony człowiek, który boi się PANA i ma upodobanie w jego przykazaniach."
  tags: []
"Ps112,2":
  text: "Jego potomstwo będzie potężne na ziemi, pokolenie prawych będzie błogosławione."
  tags: []
"Ps112,3":
  text: "Dobrobyt i bogactwo są w jego domu, a jego sprawiedliwość trwa na wieki."
  tags: []
"Ps112,4":
  text: "Dla prawych wschodzi światłość w ciemności; on jest łaskawy, miłosierny i sprawiedliwy."
  tags: []
"Ps112,5":
  text: "Dobry człowiek lituje się i pożycza, i prowadzi swoje sprawy rozważnie."
  tags: []
"Ps112,6":
  text: "Na pewno nigdy się nie zachwieje, sprawiedliwy na wieki pozostanie w pamięci."
  tags: []
"Ps112,7":
  text: "Nie będzie się bał złej nowiny, jego serce jest stateczne, ufa PANU."
  tags: []
"Ps112,8":
  text: "Jego serce jest umocnione, nie będzie się bał, aż zobaczy pomstę nad swymi wrogami."
  tags: []
"Ps112,9":
  text: "Rozrzucił i dał ubogim, jego sprawiedliwość trwa na wieki, jego róg będzie wywyższony w chwale."
  tags: []
"Ps112,10":
  text: "Niegodziwy zobaczy to i rozgniewa się, zgrzytnie zębami i uschnie, pragnienie niegodziwych zginie."
  tags: []
