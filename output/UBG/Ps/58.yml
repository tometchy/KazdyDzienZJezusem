"Ps58,1":
  text: "O zgromadzenie, czy rzeczywiście mówicie to, co sprawiedliwe? Czy słusznie sądzicie, synowie ludzcy?"
  tags: []
"Ps58,2":
  text: "Przeciwnie, w sercu knujecie nieprawości, wymierzacie przemoc waszych rąk na ziemi."
  tags: []
"Ps58,3":
  text: "Niegodziwi zeszli na bezdroża już od łona matki, od urodzenia błądzą, mówiąc kłamstwo."
  tags: []
"Ps58,4":
  text: "Ich jad podobny do jadu węża, są jak głucha żmija, która zatyka uszy;"
  tags: []
"Ps58,5":
  text: "Aby nie słyszeć głosu zaklinaczy ani czarownika, co biegle zaklina."
  tags: []
"Ps58,6":
  text: "Boże, skrusz zęby w ich ustach; PANIE, połam zęby trzonowe lwiąt."
  tags: []
"Ps58,7":
  text: "Niech znikną jak spływająca woda, niech będą jak ten, który naciąga łuk, lecz jego strzały się łamią."
  tags: []
"Ps58,8":
  text: "Niech przeminą jak ślimak, który się rozpływa; jak poroniony płód kobiety niech nie zobaczą słońca."
  tags: []
"Ps58,9":
  text: "Zanim wasze ciernie wypuszczą kolce, gdy jeszcze są zielone, porwie je wicher gniewu Boga."
  tags: []
"Ps58,10":
  text: "Będzie się weselił sprawiedliwy, gdy ujrzy pomstę; swoje stopy umyje we krwi niegodziwego."
  tags: []
"Ps58,11":
  text: "A ludzie powiedzą: Jest, doprawdy, nagroda dla sprawiedliwego; doprawdy jest Bóg, który sądzi na ziemi."
  tags: []
