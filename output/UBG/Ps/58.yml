"Ps58,1": "O zgromadzenie, czy rzeczywiście mówicie to, co sprawiedliwe? Czy słusznie sądzicie, synowie ludzcy?"
"Ps58,2": "Przeciwnie, w sercu knujecie nieprawości, wymierzacie przemoc waszych rąk na ziemi."
"Ps58,3": "Niegodziwi zeszli na bezdroża już od łona matki, od urodzenia błądzą, mówiąc kłamstwo."
"Ps58,4": "Ich jad podobny do jadu węża, są jak głucha żmija, która zatyka uszy;"
"Ps58,5": "Aby nie słyszeć głosu zaklinaczy ani czarownika, co biegle zaklina."
"Ps58,6": "Boże, skrusz zęby w ich ustach; PANIE, połam zęby trzonowe lwiąt."
"Ps58,7": "Niech znikną jak spływająca woda, niech będą jak ten, który naciąga łuk, lecz jego strzały się łamią."
"Ps58,8": "Niech przeminą jak ślimak, który się rozpływa; jak poroniony płód kobiety niech nie zobaczą słońca."
"Ps58,9": "Zanim wasze ciernie wypuszczą kolce, gdy jeszcze są zielone, porwie je wicher gniewu Boga."
"Ps58,10": "Będzie się weselił sprawiedliwy, gdy ujrzy pomstę; swoje stopy umyje we krwi niegodziwego."
"Ps58,11": "A ludzie powiedzą: Jest, doprawdy, nagroda dla sprawiedliwego; doprawdy jest Bóg, który sądzi na ziemi."
