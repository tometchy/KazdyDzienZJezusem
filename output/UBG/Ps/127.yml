"Ps127,1": "Jeśli PAN nie zbuduje domu, na próżno trudzą się ci, którzy go wznoszą; jeśli PAN nie będzie strzegł miasta, na próżno czuwa strażnik."
"Ps127,2": "Daremne jest dla was wstawać rano, wysiadywać do późna i jeść chleb boleści, bo to on daje sen swemu umiłowanemu."
"Ps127,3": "Oto dzieci są dziedzictwem od PANA, a owoc łona nagrodą."
"Ps127,4": "Jak strzały w ręku mocarza, tak są dzieci zrodzone za młodu."
"Ps127,5": "Błogosławiony mąż, który napełnił nimi swój kołczan; nie doznają wstydu, gdy się w bramie będą rozprawiać z nieprzyjaciółmi."
