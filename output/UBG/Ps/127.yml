"Ps127,1":
  text: "Jeśli PAN nie zbuduje domu, na próżno trudzą się ci, którzy go wznoszą; jeśli PAN nie będzie strzegł miasta, na próżno czuwa strażnik."
  tags: []
"Ps127,2":
  text: "Daremne jest dla was wstawać rano, wysiadywać do późna i jeść chleb boleści, bo to on daje sen swemu umiłowanemu."
  tags: []
"Ps127,3":
  text: "Oto dzieci są dziedzictwem od PANA, a owoc łona nagrodą."
  tags: []
"Ps127,4":
  text: "Jak strzały w ręku mocarza, tak są dzieci zrodzone za młodu."
  tags: []
"Ps127,5":
  text: "Błogosławiony mąż, który napełnił nimi swój kołczan; nie doznają wstydu, gdy się w bramie będą rozprawiać z nieprzyjaciółmi."
  tags: []
