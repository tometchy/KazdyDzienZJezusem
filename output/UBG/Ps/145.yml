"Ps145,1": "Będę cię wywyższać, Boże mój, królu mój, i będę błogosławić twe imię na wieki wieków."
"Ps145,2": "Każdego dnia będę cię błogosławić i chwalić twoje imię na wieki wieków."
"Ps145,3": "Wielki jest PAN i godzien wielkiej chwały, a jego wielkość jest niezbadana."
"Ps145,4": "Pokolenie pokoleniu będzie wychwalać twoje dzieła i opowiadać o twoich potężnych czynach."
"Ps145,5": "Będę wysławiać wspaniałość chwały twojego majestatu i twoje cudowne dzieła."
"Ps145,6": "I będą mówić o mocy twoich straszliwych czynów, a ja będę opowiadać twoją wielkość."
"Ps145,7": "Będą wysławiać pamięć twojej wielkiej dobroci i śpiewać o twojej sprawiedliwości."
"Ps145,8": "Łaskawy jest PAN i litościwy, nieskory do gniewu i bardzo miłosierny."
"Ps145,9": "Dobry jest PAN dla wszystkich, a jego miłosierdzie nad wszystkimi jego dziełami."
"Ps145,10": "Twoje dzieła będą cię wysławiać, PANIE, a twoi święci będą ci błogosławić."
"Ps145,11": "Będą opowiadać o chwale twego królestwa i mówić o twojej potędze;"
"Ps145,12": "Aby oznajmić synom ludzkim jego potężne czyny i wspaniałą chwałę jego królestwa."
"Ps145,13": "Twoje królestwo jest królestwem wiecznym, a twoje panowanie trwa przez wszystkie pokolenia."
"Ps145,14": "PAN podtrzymuje wszystkich, którzy upadają, i podnosi wszystkich przygnębionych."
"Ps145,15": "Oczy wszystkich oczekują ciebie, a ty im dajesz pokarm we właściwym czasie."
"Ps145,16": "Otwierasz swoją rękę i nasycasz do woli wszystko, co żyje."
"Ps145,17": "Sprawiedliwy jest PAN we wszystkich swoich drogach i miłosierny we wszystkich swoich dziełach."
"Ps145,18": "Bliski jest PAN wszystkim, którzy go wzywają; wszystkim, którzy go wzywają w prawdzie."
"Ps145,19": "Spełni pragnienia tych, którzy się go boją; usłyszy ich wołanie i wybawi ich."
"Ps145,20": "PAN strzeże wszystkich, którzy go miłują; a wytraci wszystkich niegodziwych."
"Ps145,21": "Moje usta będą głosić chwałę PANA i niech wszelkie ciało błogosławi jego święte imię na wieki wieków."
