"Ps145,1":
  text: "Będę cię wywyższać, Boże mój, królu mój, i będę błogosławić twe imię na wieki wieków."
  tags: []
"Ps145,2":
  text: "Każdego dnia będę cię błogosławić i chwalić twoje imię na wieki wieków."
  tags: []
"Ps145,3":
  text: "Wielki jest PAN i godzien wielkiej chwały, a jego wielkość jest niezbadana."
  tags: []
"Ps145,4":
  text: "Pokolenie pokoleniu będzie wychwalać twoje dzieła i opowiadać o twoich potężnych czynach."
  tags: []
"Ps145,5":
  text: "Będę wysławiać wspaniałość chwały twojego majestatu i twoje cudowne dzieła."
  tags: []
"Ps145,6":
  text: "I będą mówić o mocy twoich straszliwych czynów, a ja będę opowiadać twoją wielkość."
  tags: []
"Ps145,7":
  text: "Będą wysławiać pamięć twojej wielkiej dobroci i śpiewać o twojej sprawiedliwości."
  tags: []
"Ps145,8":
  text: "Łaskawy jest PAN i litościwy, nieskory do gniewu i bardzo miłosierny."
  tags: []
"Ps145,9":
  text: "Dobry jest PAN dla wszystkich, a jego miłosierdzie nad wszystkimi jego dziełami."
  tags: []
"Ps145,10":
  text: "Twoje dzieła będą cię wysławiać, PANIE, a twoi święci będą ci błogosławić."
  tags: []
"Ps145,11":
  text: "Będą opowiadać o chwale twego królestwa i mówić o twojej potędze;"
  tags: []
"Ps145,12":
  text: "Aby oznajmić synom ludzkim jego potężne czyny i wspaniałą chwałę jego królestwa."
  tags: []
"Ps145,13":
  text: "Twoje królestwo jest królestwem wiecznym, a twoje panowanie trwa przez wszystkie pokolenia."
  tags: []
"Ps145,14":
  text: "PAN podtrzymuje wszystkich, którzy upadają, i podnosi wszystkich przygnębionych."
  tags: []
"Ps145,15":
  text: "Oczy wszystkich oczekują ciebie, a ty im dajesz pokarm we właściwym czasie."
  tags: []
"Ps145,16":
  text: "Otwierasz swoją rękę i nasycasz do woli wszystko, co żyje."
  tags: []
"Ps145,17":
  text: "Sprawiedliwy jest PAN we wszystkich swoich drogach i miłosierny we wszystkich swoich dziełach."
  tags: []
"Ps145,18":
  text: "Bliski jest PAN wszystkim, którzy go wzywają; wszystkim, którzy go wzywają w prawdzie."
  tags: []
"Ps145,19":
  text: "Spełni pragnienia tych, którzy się go boją; usłyszy ich wołanie i wybawi ich."
  tags: []
"Ps145,20":
  text: "PAN strzeże wszystkich, którzy go miłują; a wytraci wszystkich niegodziwych."
  tags: []
"Ps145,21":
  text: "Moje usta będą głosić chwałę PANA i niech wszelkie ciało błogosławi jego święte imię na wieki wieków."
  tags: []
