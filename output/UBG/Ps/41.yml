"Ps41,1": "Błogosławiony, kto zważa na ubogiego, PAN go wybawi w dniu niedoli."
"Ps41,2": "PAN będzie go strzegł, zachowa przy życiu, będzie mu błogosławił na ziemi i nie wyda go na pastwę jego wrogów."
"Ps41,3": "PAN pokrzepi go na łożu boleści, w czasie choroby poprawi całe jego posłanie."
"Ps41,4": "Powiedziałem: PANIE, zmiłuj się nade mną, uzdrów moją duszę, bo zgrzeszyłem przeciwko tobie."
"Ps41,5": "Moi wrogowie źle o mnie mówią: Kiedy on umrze i zginie jego imię?"
"Ps41,6": "Jeśli któryś przychodzi mnie odwiedzić, mówi obłudnie; w swoim sercu gromadzi nieprawość, a gdy wychodzi, rozpowiada."
"Ps41,7": "Wszyscy, którzy mnie nienawidzą, szepczą wspólnie przeciwko mnie, przeciwko mnie obmyślają zło;"
"Ps41,8": "Mówiąc: Spadła na niego złośliwa zaraza, położył się i już nie wstanie."
"Ps41,9": "Nawet mój przyjaciel, któremu ufałem, który jadł mój chleb, podniósł przeciwko mnie piętę."
"Ps41,10": "Ale ty, PANIE, zmiłuj się nade mną i podnieś mnie, abym im odpłacił."
"Ps41,11": "Po tym poznam, że mnie sobie upodobałeś, że mój wróg nie będzie triumfował nade mną."
"Ps41,12": "Ty zaś wesprzesz mnie ze względu na moją uczciwość i na wieki postawisz mnie przed swoim obliczem."
"Ps41,13": "Błogosławiony PAN, Bóg Izraela, od wieków aż na wieki. Amen, amen."
