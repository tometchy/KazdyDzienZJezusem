"Ps41,1":
  text: "Błogosławiony, kto zważa na ubogiego, PAN go wybawi w dniu niedoli."
  tags: []
"Ps41,2":
  text: "PAN będzie go strzegł, zachowa przy życiu, będzie mu błogosławił na ziemi i nie wyda go na pastwę jego wrogów."
  tags: []
"Ps41,3":
  text: "PAN pokrzepi go na łożu boleści, w czasie choroby poprawi całe jego posłanie."
  tags: []
"Ps41,4":
  text: "Powiedziałem: PANIE, zmiłuj się nade mną, uzdrów moją duszę, bo zgrzeszyłem przeciwko tobie."
  tags: []
"Ps41,5":
  text: "Moi wrogowie źle o mnie mówią: Kiedy on umrze i zginie jego imię?"
  tags: []
"Ps41,6":
  text: "Jeśli któryś przychodzi mnie odwiedzić, mówi obłudnie; w swoim sercu gromadzi nieprawość, a gdy wychodzi, rozpowiada."
  tags: []
"Ps41,7":
  text: "Wszyscy, którzy mnie nienawidzą, szepczą wspólnie przeciwko mnie, przeciwko mnie obmyślają zło;"
  tags: []
"Ps41,8":
  text: "Mówiąc: Spadła na niego złośliwa zaraza, położył się i już nie wstanie."
  tags: []
"Ps41,9":
  text: "Nawet mój przyjaciel, któremu ufałem, który jadł mój chleb, podniósł przeciwko mnie piętę."
  tags: []
"Ps41,10":
  text: "Ale ty, PANIE, zmiłuj się nade mną i podnieś mnie, abym im odpłacił."
  tags: []
"Ps41,11":
  text: "Po tym poznam, że mnie sobie upodobałeś, że mój wróg nie będzie triumfował nade mną."
  tags: []
"Ps41,12":
  text: "Ty zaś wesprzesz mnie ze względu na moją uczciwość i na wieki postawisz mnie przed swoim obliczem."
  tags: []
"Ps41,13":
  text: "Błogosławiony PAN, Bóg Izraela, od wieków aż na wieki. Amen, amen."
  tags: []
