"Ps113,1": "Alleluja. Chwalcie, słudzy PANA, chwalcie imię PANA."
"Ps113,2": "Niech imię PANA będzie błogosławione, odtąd aż na wieki."
"Ps113,3": "Od wschodu słońca aż do jego zachodu, niech imię PANA będzie pochwalone."
"Ps113,4": "PAN jest wywyższony ponad wszystkie narody, jego chwała ponad niebiosa."
"Ps113,5": "Któż jak PAN, nasz Bóg, który mieszka na wysokości;"
"Ps113,6": "Który zniża się, aby patrzeć na to, co jest na niebie i na ziemi?"
"Ps113,7": "Podnosi nędznego z prochu, a z gnoju podnosi ubogiego;"
"Ps113,8": "Aby go posadzić z książętami, z książętami swego ludu;"
"Ps113,9": "On sprawia, że niepłodna staje się matką domu, cieszącą się dziećmi. Alleluja."
