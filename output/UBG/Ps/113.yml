"Ps113,1":
  text: "Alleluja. Chwalcie, słudzy PANA, chwalcie imię PANA."
  tags: []
"Ps113,2":
  text: "Niech imię PANA będzie błogosławione, odtąd aż na wieki."
  tags: []
"Ps113,3":
  text: "Od wschodu słońca aż do jego zachodu, niech imię PANA będzie pochwalone."
  tags: []
"Ps113,4":
  text: "PAN jest wywyższony ponad wszystkie narody, jego chwała ponad niebiosa."
  tags: []
"Ps113,5":
  text: "Któż jak PAN, nasz Bóg, który mieszka na wysokości;"
  tags: []
"Ps113,6":
  text: "Który zniża się, aby patrzeć na to, co jest na niebie i na ziemi?"
  tags: []
"Ps113,7":
  text: "Podnosi nędznego z prochu, a z gnoju podnosi ubogiego;"
  tags: []
"Ps113,8":
  text: "Aby go posadzić z książętami, z książętami swego ludu;"
  tags: []
"Ps113,9":
  text: "On sprawia, że niepłodna staje się matką domu, cieszącą się dziećmi. Alleluja."
  tags: []
