"Ps56,1": "Zmiłuj się nade mną, Boże, bo chce mnie pochłonąć człowiek; każdego dnia uciska mnie walką."
"Ps56,2": "Moi wrogowie każdego dnia chcą mnie połknąć; wielu bowiem walczy przeciwko mnie, o Najwyższy."
"Ps56,3": "Ilekroć strach mnie ogarnia, ufam tobie."
"Ps56,4": "W Bogu będę wysławiać jego słowo; Bogu ufam i nie będę się bał tego, co człowiek może mi uczynić."
"Ps56,5": "Przez cały dzień przekręcają moje słowa, przeciwko mnie kierują wszystkie swe zamysły, ku memu nieszczęściu."
"Ps56,6": "Zbierają się, ukrywają i śledzą moje kroki, czyhając na moją duszę."
"Ps56,7": "Czy unikną zemsty za nieprawość? Boże, powal te narody w swoim gniewie."
"Ps56,8": "Ty policzyłeś dni mojej tułaczki, zbierz też moje łzy do swego bukłaka; czyż nie są spisane w twojej księdze?"
"Ps56,9": "Gdy zawołam, cofną się moi wrogowie; to wiem, bo Bóg jest ze mną."
"Ps56,10": "W Bogu będę wysławiać jego słowa, w PANU będę chwalić jego słowo."
"Ps56,11": "Bogu ufam, nie będę się bał tego, co mi może uczynić człowiek."
"Ps56,12": "Tobie, Boże, śluby złożyłem, dlatego też tobie oddam chwałę."
"Ps56,13": "Ocaliłeś bowiem moją duszę od śmierci, a moje nogi od upadku, abym chodził przed Bogiem w światłości żyjących."
