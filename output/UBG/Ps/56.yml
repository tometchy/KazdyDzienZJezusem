"Ps56,1":
  text: "Zmiłuj się nade mną, Boże, bo chce mnie pochłonąć człowiek; każdego dnia uciska mnie walką."
  tags: []
"Ps56,2":
  text: "Moi wrogowie każdego dnia chcą mnie połknąć; wielu bowiem walczy przeciwko mnie, o Najwyższy."
  tags: []
"Ps56,3":
  text: "Ilekroć strach mnie ogarnia, ufam tobie."
  tags: []
"Ps56,4":
  text: "W Bogu będę wysławiać jego słowo; Bogu ufam i nie będę się bał tego, co człowiek może mi uczynić."
  tags: []
"Ps56,5":
  text: "Przez cały dzień przekręcają moje słowa, przeciwko mnie kierują wszystkie swe zamysły, ku memu nieszczęściu."
  tags: []
"Ps56,6":
  text: "Zbierają się, ukrywają i śledzą moje kroki, czyhając na moją duszę."
  tags: []
"Ps56,7":
  text: "Czy unikną zemsty za nieprawość? Boże, powal te narody w swoim gniewie."
  tags: []
"Ps56,8":
  text: "Ty policzyłeś dni mojej tułaczki, zbierz też moje łzy do swego bukłaka; czyż nie są spisane w twojej księdze?"
  tags: []
"Ps56,9":
  text: "Gdy zawołam, cofną się moi wrogowie; to wiem, bo Bóg jest ze mną."
  tags: []
"Ps56,10":
  text: "W Bogu będę wysławiać jego słowa, w PANU będę chwalić jego słowo."
  tags: []
"Ps56,11":
  text: "Bogu ufam, nie będę się bał tego, co mi może uczynić człowiek."
  tags: []
"Ps56,12":
  text: "Tobie, Boże, śluby złożyłem, dlatego też tobie oddam chwałę."
  tags: []
"Ps56,13":
  text: "Ocaliłeś bowiem moją duszę od śmierci, a moje nogi od upadku, abym chodził przed Bogiem w światłości żyjących."
  tags: []
