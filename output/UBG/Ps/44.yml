"Ps44,1": "Boże, słyszeliśmy na własne uszy, nasi ojcowie opowiadali nam o tym, czego dokonałeś za ich dni, w czasach dawnych."
"Ps44,2": "Ty własną ręką wypędziłeś pogan, a ich osadziłeś; wyniszczyłeś narody, a ich rozprzestrzeniłeś."
"Ps44,3": "Nie zdobyli bowiem ziemi swym mieczem ani ich nie wybawiło własne ramię, lecz twoja prawica i twoje ramię, i światło twego oblicza, bo upodobałeś ich sobie."
"Ps44,4": "Ty jesteś moim Królem, o Boże; daj wybawienie Jakubowi."
"Ps44,5": "Dzięki tobie pokonamy naszych wrogów, w twoje imię zdepczemy naszych przeciwników."
"Ps44,6": "Nie zaufam bowiem mojemu łukowi i nie wybawi mnie mój miecz;"
"Ps44,7": "Lecz ty nas wybawiłeś od naszych wrogów i zawstydziłeś tych, którzy nas nienawidzą."
"Ps44,8": "Każdego dnia chlubimy się Bogiem, a twoje imię będziemy sławić na wieki. Sela."
"Ps44,9": "Teraz jednak odrzuciłeś nas i zawstydziłeś, i nie wyruszasz z naszymi wojskami."
"Ps44,10": "Sprawiłeś, że cofnęliśmy się przed wrogiem, a ci, którzy nas nienawidzą, złupili nas."
"Ps44,11": "Wydałeś nas na rzeź jak owce i rozproszyłeś nas wśród pogan."
"Ps44,12": "Sprzedałeś swój lud za bezcen i nie zyskałeś na jego sprzedaży."
"Ps44,13": "Wystawiłeś nas na wzgardę naszym sąsiadom, na szyderstwo i pośmiewisko tym, którzy nas otaczają."
"Ps44,14": "Uczyniłeś nas tematem przysłowia wśród pogan, tak że narody kiwają głowami nad nami."
"Ps44,15": "Mój wstyd wciąż jest przede mną, a hańba mi twarz okrywa;"
"Ps44,16": "Na głos tego, który gardzi i bluźni, z powodu wroga i mściciela."
"Ps44,17": "To wszystko nas spotkało, a jednak nie zapomnieliśmy o tobie ani nie naruszyliśmy twojego przymierza."
"Ps44,18": "Nasze serce się nie odwróciło ani nasze kroki nie zboczyły z twej ścieżki;"
"Ps44,19": "Chociaż powaliłeś nas w miejscu smoków i okryłeś nas cieniem śmierci."
"Ps44,20": "Gdybyśmy zapomnieli imienia naszego Boga i wyciągnęli ręce do obcego boga;"
"Ps44,21": "Czyż Bóg by się o tym nie dowiedział? Przecież on zna tajniki serca."
"Ps44,22": "Lecz z powodu ciebie przez cały dzień nas zabijają, uważają nas za owce przeznaczone na rzeź."
"Ps44,23": "Ocknij się; czemu śpisz, Panie? Obudź się, nie odrzucaj nas na wieki."
"Ps44,24": "Czemu ukrywasz swoje oblicze i zapominasz o naszym utrapieniu i ucisku?"
"Ps44,25": "Nasza dusza bowiem pogrążyła się w prochu, nasz brzuch przylgnął do ziemi."
"Ps44,26": "Powstań nam na pomoc, odkup nas ze względu na twoje miłosierdzie."
