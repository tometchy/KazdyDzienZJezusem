"Ps44,1":
  text: "Boże, słyszeliśmy na własne uszy, nasi ojcowie opowiadali nam o tym, czego dokonałeś za ich dni, w czasach dawnych."
  tags: []
"Ps44,2":
  text: "Ty własną ręką wypędziłeś pogan, a ich osadziłeś; wyniszczyłeś narody, a ich rozprzestrzeniłeś."
  tags: []
"Ps44,3":
  text: "Nie zdobyli bowiem ziemi swym mieczem ani ich nie wybawiło własne ramię, lecz twoja prawica i twoje ramię, i światło twego oblicza, bo upodobałeś ich sobie."
  tags: []
"Ps44,4":
  text: "Ty jesteś moim Królem, o Boże; daj wybawienie Jakubowi."
  tags: []
"Ps44,5":
  text: "Dzięki tobie pokonamy naszych wrogów, w twoje imię zdepczemy naszych przeciwników."
  tags: []
"Ps44,6":
  text: "Nie zaufam bowiem mojemu łukowi i nie wybawi mnie mój miecz;"
  tags: []
"Ps44,7":
  text: "Lecz ty nas wybawiłeś od naszych wrogów i zawstydziłeś tych, którzy nas nienawidzą."
  tags: []
"Ps44,8":
  text: "Każdego dnia chlubimy się Bogiem, a twoje imię będziemy sławić na wieki. Sela."
  tags: []
"Ps44,9":
  text: "Teraz jednak odrzuciłeś nas i zawstydziłeś, i nie wyruszasz z naszymi wojskami."
  tags: []
"Ps44,10":
  text: "Sprawiłeś, że cofnęliśmy się przed wrogiem, a ci, którzy nas nienawidzą, złupili nas."
  tags: []
"Ps44,11":
  text: "Wydałeś nas na rzeź jak owce i rozproszyłeś nas wśród pogan."
  tags: []
"Ps44,12":
  text: "Sprzedałeś swój lud za bezcen i nie zyskałeś na jego sprzedaży."
  tags: []
"Ps44,13":
  text: "Wystawiłeś nas na wzgardę naszym sąsiadom, na szyderstwo i pośmiewisko tym, którzy nas otaczają."
  tags: []
"Ps44,14":
  text: "Uczyniłeś nas tematem przysłowia wśród pogan, tak że narody kiwają głowami nad nami."
  tags: []
"Ps44,15":
  text: "Mój wstyd wciąż jest przede mną, a hańba mi twarz okrywa;"
  tags: []
"Ps44,16":
  text: "Na głos tego, który gardzi i bluźni, z powodu wroga i mściciela."
  tags: []
"Ps44,17":
  text: "To wszystko nas spotkało, a jednak nie zapomnieliśmy o tobie ani nie naruszyliśmy twojego przymierza."
  tags: []
"Ps44,18":
  text: "Nasze serce się nie odwróciło ani nasze kroki nie zboczyły z twej ścieżki;"
  tags: []
"Ps44,19":
  text: "Chociaż powaliłeś nas w miejscu smoków i okryłeś nas cieniem śmierci."
  tags: []
"Ps44,20":
  text: "Gdybyśmy zapomnieli imienia naszego Boga i wyciągnęli ręce do obcego boga;"
  tags: []
"Ps44,21":
  text: "Czyż Bóg by się o tym nie dowiedział? Przecież on zna tajniki serca."
  tags: []
"Ps44,22":
  text: "Lecz z powodu ciebie przez cały dzień nas zabijają, uważają nas za owce przeznaczone na rzeź."
  tags: []
"Ps44,23":
  text: "Ocknij się; czemu śpisz, Panie? Obudź się, nie odrzucaj nas na wieki."
  tags: []
"Ps44,24":
  text: "Czemu ukrywasz swoje oblicze i zapominasz o naszym utrapieniu i ucisku?"
  tags: []
"Ps44,25":
  text: "Nasza dusza bowiem pogrążyła się w prochu, nasz brzuch przylgnął do ziemi."
  tags: []
"Ps44,26":
  text: "Powstań nam na pomoc, odkup nas ze względu na twoje miłosierdzie."
  tags: []
