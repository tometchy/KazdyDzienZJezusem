"Ps18,1": "Będę cię miłował, PANIE, mocy moja."
"Ps18,2": "PAN moją skałą, moją twierdzą i wybawicielem. Mój Bóg moją opoką, której będę ufał, moją tarczą i rogiem mego zbawienia, moją warownią."
"Ps18,3": "Wezwę PANA, który jest godny chwały, a będę wybawiony od moich wrogów."
"Ps18,4": "Ogarnęły mnie boleści śmierci i zatrwożyły mnie potoki bezbożnych."
"Ps18,5": "Boleści piekła mnie oplotły, pochwyciły mnie sidła śmierci."
"Ps18,6": "W moim utrapieniu wzywałem PANA i wołałem do mego Boga. Ze swojej świątyni usłyszał mój głos, a moje wołanie dotarło przed jego oblicze, do jego uszu."
"Ps18,7": "Wtedy ziemia poruszyła się i zadrżała, a posady gór zatrzęsły się i zachwiały od jego gniewu."
"Ps18,8": "Z jego nozdrzy unosił się dym, z jego ust buchnął ogień trawiący, węgle zapaliły się od niego."
"Ps18,9": "Nachylił niebiosa i zstąpił, a ciemność była pod jego stopami."
"Ps18,10": "Dosiadł cherubina i latał; latał na skrzydłach wiatru."
"Ps18,11": "Z ciemności zrobił sobie ukrycie, namiotem wokół niego były ciemne wody i gęste obłoki nieba."
"Ps18,12": "Przed jego blaskiem rozeszły się jego obłoki, grad i węgle ogniste."
"Ps18,13": "I zagrzmiał PAN na niebiosach, Najwyższy wydał swój głos, grad i węgle ogniste."
"Ps18,14": "Wypuścił swe strzały i rozproszył ich, cisnął błyskawicami i ich rozgromił."
"Ps18,15": "I ukazały się głębiny wód, i odsłoniły się fundamenty świata od twojego upomnienia, PANIE, i od podmuchu tchnienia twoich nozdrzy."
"Ps18,16": "Posłał z wysoka, chwycił mnie, wyciągnął mnie z wielkich wód."
"Ps18,17": "Ocalił mnie od potężnego wroga mego i od tych, którzy mnie nienawidzą, choć byli ode mnie mocniejsi."
"Ps18,18": "Zaskoczyli mnie w dniu mego utrapienia, lecz PAN był moją podporą."
"Ps18,19": "Wyprowadził mnie na miejsce przestronne, wybawił mnie, bo mnie sobie upodobał."
"Ps18,20": "Nagrodził mnie PAN według mojej sprawiedliwości, oddał mi według czystości moich rąk."
"Ps18,21": "Strzegłem bowiem dróg PANA i nie odstąpiłem niegodziwie od mego Boga."
"Ps18,22": "Bo miałem przed oczyma wszystkie jego nakazy i nie odrzucałem od siebie jego praw."
"Ps18,23": "Byłem wobec niego nienaganny i wystrzegałem się swojej nieprawości."
"Ps18,24": "Dlatego oddał mi PAN według mojej sprawiedliwości, według czystości moich rąk przed jego oczyma."
"Ps18,25": "Ty z miłosiernym miłosiernie się obejdziesz, a z człowiekiem nienagannym postąpisz nienagannie."
"Ps18,26": "Wobec czystego okażesz się czysty, a wobec przewrotnego postąpisz przewrotnie;"
"Ps18,27": "Ty bowiem lud strapiony wybawisz, a oczy wyniosłe poniżysz."
"Ps18,28": "Bo ty zapalisz moją pochodnię; PAN, Bóg mój, rozjaśni moje ciemności."
"Ps18,29": "Bo z tobą przebiłem się przez wojsko, z moim Bogiem przeskoczyłem mur."
"Ps18,30": "Droga Boga jest doskonała, słowo PANA w ogniu wypróbowane. Tarczą jest dla wszystkich, którzy mu ufają."
"Ps18,31": "Bo któż jest Bogiem oprócz PANA? Któż skałą oprócz naszego Boga?"
"Ps18,32": "To Bóg, który przepasuje mnie mocą i doskonałą czyni moją drogę."
"Ps18,33": "Moje nogi czyni jak u łani i stawia mnie na wyżynach."
"Ps18,34": "Ćwiczy moje ręce do walki, tak że mogę kruszyć spiżowy łuk swymi ramionami."
"Ps18,35": "Dałeś mi też tarczę swego zbawienia i wspierała mnie twoja prawica, a twoja dobrotliwość uczyniła mnie wielkim."
"Ps18,36": "Rozszerzyłeś ścieżkę dla mych kroków, tak że moje stopy się nie zachwiały."
"Ps18,37": "Ścigałem moich wrogów i dopadłem ich, nie zawróciłem, aż ich nie wytraciłem."
"Ps18,38": "Powaliłem ich tak, że nie mogli powstać, upadli pod moje stopy."
"Ps18,39": "Przepasałeś mnie mocą do walki, powaliłeś pod moje stopy moich przeciwników."
"Ps18,40": "Zmuszałeś moich wrogów do ucieczki, abym wykorzenił tych, którzy mnie nienawidzą."
"Ps18,41": "Wołali, lecz nie było nikogo, kto by ich wybawił; wołali do PANA, lecz ich nie wysłuchał."
"Ps18,42": "Starłem ich jak proch na wietrze, wyrzuciłem jak błoto uliczne."
"Ps18,43": "Wyzwoliłeś mnie od kłótni ludzkich, ustanowiłeś mnie głową narodów. Będzie mi służył lud, którego nie znałem."
"Ps18,44": "Jak tylko usłyszą o mnie, będą mi posłuszni, cudzoziemcy będą udawać uległość."
"Ps18,45": "Cudzoziemcy zmarnieją i będą drżeć w swoich warowniach."
"Ps18,46": "PAN żyje, niech będzie błogosławiona moja skała, niech będzie wywyższony Bóg mego zbawienia."
"Ps18,47": "Bóg dokonuje za mnie zemsty i poddaje mi narody."
"Ps18,48": "Ty wyzwalasz mnie od moich wrogów; ty wywyższyłeś mnie ponad moich przeciwników, ocaliłeś mnie od gwałtownika."
"Ps18,49": "Dlatego będę cię, PANIE, sławił wśród narodów i będę śpiewał twemu imieniu."
"Ps18,50": "Bo dajesz wielkie wybawienie swemu królowi i na wieki okazujesz miłosierdzie swemu pomazańcowi Dawidowi i jego potomstwu."
