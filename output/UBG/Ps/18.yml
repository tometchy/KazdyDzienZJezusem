"Ps18,1":
  text: "Będę cię miłował, PANIE, mocy moja."
  tags: []
"Ps18,2":
  text: "PAN moją skałą, moją twierdzą i wybawicielem. Mój Bóg moją opoką, której będę ufał, moją tarczą i rogiem mego zbawienia, moją warownią."
  tags: []
"Ps18,3":
  text: "Wezwę PANA, który jest godny chwały, a będę wybawiony od moich wrogów."
  tags: []
"Ps18,4":
  text: "Ogarnęły mnie boleści śmierci i zatrwożyły mnie potoki bezbożnych."
  tags: []
"Ps18,5":
  text: "Boleści piekła mnie oplotły, pochwyciły mnie sidła śmierci."
  tags: []
"Ps18,6":
  text: "W moim utrapieniu wzywałem PANA i wołałem do mego Boga. Ze swojej świątyni usłyszał mój głos, a moje wołanie dotarło przed jego oblicze, do jego uszu."
  tags: []
"Ps18,7":
  text: "Wtedy ziemia poruszyła się i zadrżała, a posady gór zatrzęsły się i zachwiały od jego gniewu."
  tags: []
"Ps18,8":
  text: "Z jego nozdrzy unosił się dym, z jego ust buchnął ogień trawiący, węgle zapaliły się od niego."
  tags: []
"Ps18,9":
  text: "Nachylił niebiosa i zstąpił, a ciemność była pod jego stopami."
  tags: []
"Ps18,10":
  text: "Dosiadł cherubina i latał; latał na skrzydłach wiatru."
  tags: []
"Ps18,11":
  text: "Z ciemności zrobił sobie ukrycie, namiotem wokół niego były ciemne wody i gęste obłoki nieba."
  tags: []
"Ps18,12":
  text: "Przed jego blaskiem rozeszły się jego obłoki, grad i węgle ogniste."
  tags: []
"Ps18,13":
  text: "I zagrzmiał PAN na niebiosach, Najwyższy wydał swój głos, grad i węgle ogniste."
  tags: []
"Ps18,14":
  text: "Wypuścił swe strzały i rozproszył ich, cisnął błyskawicami i ich rozgromił."
  tags: []
"Ps18,15":
  text: "I ukazały się głębiny wód, i odsłoniły się fundamenty świata od twojego upomnienia, PANIE, i od podmuchu tchnienia twoich nozdrzy."
  tags: []
"Ps18,16":
  text: "Posłał z wysoka, chwycił mnie, wyciągnął mnie z wielkich wód."
  tags: []
"Ps18,17":
  text: "Ocalił mnie od potężnego wroga mego i od tych, którzy mnie nienawidzą, choć byli ode mnie mocniejsi."
  tags: []
"Ps18,18":
  text: "Zaskoczyli mnie w dniu mego utrapienia, lecz PAN był moją podporą."
  tags: []
"Ps18,19":
  text: "Wyprowadził mnie na miejsce przestronne, wybawił mnie, bo mnie sobie upodobał."
  tags: []
"Ps18,20":
  text: "Nagrodził mnie PAN według mojej sprawiedliwości, oddał mi według czystości moich rąk."
  tags: []
"Ps18,21":
  text: "Strzegłem bowiem dróg PANA i nie odstąpiłem niegodziwie od mego Boga."
  tags: []
"Ps18,22":
  text: "Bo miałem przed oczyma wszystkie jego nakazy i nie odrzucałem od siebie jego praw."
  tags: []
"Ps18,23":
  text: "Byłem wobec niego nienaganny i wystrzegałem się swojej nieprawości."
  tags: []
"Ps18,24":
  text: "Dlatego oddał mi PAN według mojej sprawiedliwości, według czystości moich rąk przed jego oczyma."
  tags: []
"Ps18,25":
  text: "Ty z miłosiernym miłosiernie się obejdziesz, a z człowiekiem nienagannym postąpisz nienagannie."
  tags: []
"Ps18,26":
  text: "Wobec czystego okażesz się czysty, a wobec przewrotnego postąpisz przewrotnie;"
  tags: []
"Ps18,27":
  text: "Ty bowiem lud strapiony wybawisz, a oczy wyniosłe poniżysz."
  tags: []
"Ps18,28":
  text: "Bo ty zapalisz moją pochodnię; PAN, Bóg mój, rozjaśni moje ciemności."
  tags: []
"Ps18,29":
  text: "Bo z tobą przebiłem się przez wojsko, z moim Bogiem przeskoczyłem mur."
  tags: []
"Ps18,30":
  text: "Droga Boga jest doskonała, słowo PANA w ogniu wypróbowane. Tarczą jest dla wszystkich, którzy mu ufają."
  tags: []
"Ps18,31":
  text: "Bo któż jest Bogiem oprócz PANA? Któż skałą oprócz naszego Boga?"
  tags: []
"Ps18,32":
  text: "To Bóg, który przepasuje mnie mocą i doskonałą czyni moją drogę."
  tags: []
"Ps18,33":
  text: "Moje nogi czyni jak u łani i stawia mnie na wyżynach."
  tags: []
"Ps18,34":
  text: "Ćwiczy moje ręce do walki, tak że mogę kruszyć spiżowy łuk swymi ramionami."
  tags: []
"Ps18,35":
  text: "Dałeś mi też tarczę swego zbawienia i wspierała mnie twoja prawica, a twoja dobrotliwość uczyniła mnie wielkim."
  tags: []
"Ps18,36":
  text: "Rozszerzyłeś ścieżkę dla mych kroków, tak że moje stopy się nie zachwiały."
  tags: []
"Ps18,37":
  text: "Ścigałem moich wrogów i dopadłem ich, nie zawróciłem, aż ich nie wytraciłem."
  tags: []
"Ps18,38":
  text: "Powaliłem ich tak, że nie mogli powstać, upadli pod moje stopy."
  tags: []
"Ps18,39":
  text: "Przepasałeś mnie mocą do walki, powaliłeś pod moje stopy moich przeciwników."
  tags: []
"Ps18,40":
  text: "Zmuszałeś moich wrogów do ucieczki, abym wykorzenił tych, którzy mnie nienawidzą."
  tags: []
"Ps18,41":
  text: "Wołali, lecz nie było nikogo, kto by ich wybawił; wołali do PANA, lecz ich nie wysłuchał."
  tags: []
"Ps18,42":
  text: "Starłem ich jak proch na wietrze, wyrzuciłem jak błoto uliczne."
  tags: []
"Ps18,43":
  text: "Wyzwoliłeś mnie od kłótni ludzkich, ustanowiłeś mnie głową narodów. Będzie mi służył lud, którego nie znałem."
  tags: []
"Ps18,44":
  text: "Jak tylko usłyszą o mnie, będą mi posłuszni, cudzoziemcy będą udawać uległość."
  tags: []
"Ps18,45":
  text: "Cudzoziemcy zmarnieją i będą drżeć w swoich warowniach."
  tags: []
"Ps18,46":
  text: "PAN żyje, niech będzie błogosławiona moja skała, niech będzie wywyższony Bóg mego zbawienia."
  tags: []
"Ps18,47":
  text: "Bóg dokonuje za mnie zemsty i poddaje mi narody."
  tags: []
"Ps18,48":
  text: "Ty wyzwalasz mnie od moich wrogów; ty wywyższyłeś mnie ponad moich przeciwników, ocaliłeś mnie od gwałtownika."
  tags: []
"Ps18,49":
  text: "Dlatego będę cię, PANIE, sławił wśród narodów i będę śpiewał twemu imieniu."
  tags: []
"Ps18,50":
  text: "Bo dajesz wielkie wybawienie swemu królowi i na wieki okazujesz miłosierdzie swemu pomazańcowi Dawidowi i jego potomstwu."
  tags: []
