"Ps126,1": "Gdy PAN odwrócił niewolę Syjonu, byliśmy jak we śnie."
"Ps126,2": "Wtedy usta nasze napełniły się śmiechem, a nasz język radością; wtedy mówiono między narodami: PAN uczynił wielkie rzeczy dla nich."
"Ps126,3": "PAN uczynił dla nas wielkie rzeczy i z tego się radujemy."
"Ps126,4": "Odwróć, PANIE, naszą niewolę jak strumienie na południu."
"Ps126,5": "Ci, którzy sieją we łzach, będą żąć z radością."
"Ps126,6": "Kto wychodzi z płaczem, niosąc drogie ziarno, powróci z radością, przynosząc swoje snopy."
