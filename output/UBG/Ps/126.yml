"Ps126,1":
  text: "Gdy PAN odwrócił niewolę Syjonu, byliśmy jak we śnie."
  tags: []
"Ps126,2":
  text: "Wtedy usta nasze napełniły się śmiechem, a nasz język radością; wtedy mówiono między narodami: PAN uczynił wielkie rzeczy dla nich."
  tags: []
"Ps126,3":
  text: "PAN uczynił dla nas wielkie rzeczy i z tego się radujemy."
  tags: []
"Ps126,4":
  text: "Odwróć, PANIE, naszą niewolę jak strumienie na południu."
  tags: []
"Ps126,5":
  text: "Ci, którzy sieją we łzach, będą żąć z radością."
  tags: []
"Ps126,6":
  text: "Kto wychodzi z płaczem, niosąc drogie ziarno, powróci z radością, przynosząc swoje snopy."
  tags: []
