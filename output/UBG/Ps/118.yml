"Ps118,1": "Wysławiajcie PANA, bo jest dobry, bo jego miłosierdzie trwa na wieki."
"Ps118,2": "Niech powie teraz Izrael, że jego miłosierdzie trwa na wieki."
"Ps118,3": "Niech powie teraz dom Aarona, że jego miłosierdzie trwa na wieki."
"Ps118,4": "Niech powiedzą teraz ci, którzy się boją PANA, że jego miłosierdzie trwa na wieki."
"Ps118,5": "Wzywałem PANA w ucisku; PAN mnie wysłuchał i postawił mnie na miejscu przestronnym."
"Ps118,6": "PAN jest ze mną, nie będę się bał; cóż może mi uczynić człowiek?"
"Ps118,7": "PAN jest ze mną wśród tych, którzy mi pomagają, więc zobaczę pomstę nad tymi, którzy mnie nienawidzą."
"Ps118,8": "Lepiej ufać PANU, niż polegać na człowieku."
"Ps118,9": "Lepiej ufać PANU, niż polegać na władcach."
"Ps118,10": "Wszystkie narody mnie otoczyły, ale w imię PANA wytępiłem je."
"Ps118,11": "Otoczyły mnie, tak, otoczyły mnie, ale w imię PANA wytępiłem je."
"Ps118,12": "Otoczyły mnie jak pszczoły, ale zgasły jak ogień z cierni, bo w imię PANA wytępiłem je."
"Ps118,13": "Pchnąłeś mnie silnie, abym upadł, ale PAN mi pomógł."
"Ps118,14": "PAN jest moją siłą i pieśnią, on stał się moim zbawieniem."
"Ps118,15": "Głos radości i zbawienia w namiotach sprawiedliwych: Prawica PANA działa potężnie;"
"Ps118,16": "Prawica PANA jest wywyższona, prawica PANA działa potężnie."
"Ps118,17": "Nie umrę, lecz będę żył i opowiadał dzieła PANA."
"Ps118,18": "PAN ukarał mnie surowo, ale nie wydał mnie na śmierć."
"Ps118,19": "Otwórzcie mi bramy sprawiedliwości, a wejdę w nie i będę wysławiał PANA."
"Ps118,20": "To jest brama PANA, którą wchodzą sprawiedliwi."
"Ps118,21": "Będę cię wysławiać, bo mnie wysłuchałeś i stałeś się moim zbawieniem."
"Ps118,22": "Kamień, który odrzucili budujący, stał się kamieniem węgielnym."
"Ps118,23": "PAN to sprawił i jest to cudowne w naszych oczach."
"Ps118,24": "Oto dzień, który PAN uczynił, weselmy się i radujmy się w nim."
"Ps118,25": "Proszę, PANIE, wybaw teraz; proszę, PANIE, daj pomyślność."
"Ps118,26": "Błogosławiony, który przychodzi w imię PANA; błogosławimy wam z domu PANA."
"Ps118,27": "Bóg jest PANEM, on nas oświecił; przywiążcie baranki powrozami aż do rogów ołtarza."
"Ps118,28": "Ty jesteś moim Bogiem, będę cię wysławiać; mój Boże, będę cię wywyższać."
"Ps118,29": "Wysławiajcie PANA, bo jest dobry, bo jego miłosierdzie trwa na wieki."
