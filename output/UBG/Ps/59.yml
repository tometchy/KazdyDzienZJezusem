"Ps59,1":
  text: "Ocal mnie od moich wrogów, mój Boże; obroń mnie przed tymi, którzy powstają przeciwko mnie."
  tags: []
"Ps59,2":
  text: "Ocal mnie od czyniących nieprawość i wybaw mnie przed krwawymi ludźmi."
  tags: []
"Ps59,3":
  text: "Oto bowiem czyhają na moją duszę; zbierają się przeciwko mnie mocarze, chociaż nie zawiniłem ani nie zgrzeszyłem, PANIE."
  tags: []
"Ps59,4":
  text: "Chociaż nie popełniłem nieprawości, biegną i szykują się; powstań, wyjdź mi na spotkanie i zobacz."
  tags: []
"Ps59,5":
  text: "Ty, PANIE, Boże zastępów, Boże Izraela, obudź się, aby nawiedzić wszystkie narody; nie lituj się nad żadnym z tych nikczemnych przestępców. Sela."
  tags: []
"Ps59,6":
  text: "Wracają wieczorem, ujadają jak psy i krążą po mieście."
  tags: []
"Ps59,7":
  text: "Oto bluzgają swymi ustami, miecze na ich wargach. Mówią bowiem: Któż słyszy?"
  tags: []
"Ps59,8":
  text: "Lecz ty, PANIE, będziesz się śmiał z nich, szydzić będziesz ze wszystkich narodów."
  tags: []
"Ps59,9":
  text: "Z powodu jego mocy będę się trzymać ciebie, bo ty, Boże, jesteś moją twierdzą."
  tags: []
"Ps59,10":
  text: "Mój miłosierny Bóg wyjdzie mi naprzeciw, Bóg pozwoli mi oglądać zemstę nad moimi wrogami."
  tags: []
"Ps59,11":
  text: "Nie zabijaj ich, aby mój lud nie zapomniał, lecz rozprosz ich swoją mocą i powal, o Panie, nasza tarczo."
  tags: []
"Ps59,12":
  text: "Za grzech ich ust i słowa ich warg niech schwytani będą w swej pysze; za złorzeczenia i kłamstwa, które mówią."
  tags: []
"Ps59,13":
  text: "Wytrać ich w gniewie, wytrać, by już ich nie było. Niech poznają, że Bóg panuje w Jakubie i po krańce ziemi. Sela."
  tags: []
"Ps59,14":
  text: "I niech wracają wieczorem, niech ujadają jak psy i krążą po mieście."
  tags: []
"Ps59,15":
  text: "Niech się włóczą, szukając pokarmu; niech warczą, gdy się nie nasycą."
  tags: []
"Ps59,16":
  text: "Ale ja będę śpiewał o twojej mocy, rankiem będę wysławiać twoje miłosierdzie, bo ty stałeś się dla mnie twierdzą i ucieczką w dniu mego ucisku."
  tags: []
"Ps59,17":
  text: "Moja mocy, tobie będę śpiewał; bo ty, Boże, jesteś moją twierdzą, Boże mój miłosierny."
  tags: []
