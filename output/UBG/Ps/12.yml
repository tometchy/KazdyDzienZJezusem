"Ps12,1": "Ratuj, PANIE, bo już nie ma pobożnego, zniknęli wierni spośród synów ludzkich."
"Ps12,2": "Wszyscy mówią kłamliwie do bliźniego, mówią schlebiającymi wargami i z obłudnym sercem."
"Ps12,3": "Niech PAN wytępi wszystkie wargi schlebiające i język mówiący przechwałki."
"Ps12,4": "Oni mówią: Swoim językiem zwyciężymy, nasze wargi należą do nas, któż jest naszym panem?"
"Ps12,5": "Ze względu na ucisk ubogich i jęk nędzarzy teraz powstanę – mówi PAN – zapewnię bezpieczeństwo temu, na kogo zastawiają sidła."
"Ps12,6": "Słowa PANA to słowa czyste jak srebro wypróbowane w ziemnym tyglu, siedmiokrotnie oczyszczone."
"Ps12,7": "Ty, PANIE, zachowasz ich, będziesz ich strzegł od tego pokolenia aż na wieki."
"Ps12,8": "Niegodziwi krążą wokoło, gdy najpodlejsi z ludzi zostają wywyższeni."
