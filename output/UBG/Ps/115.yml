"Ps115,1": "Nie nam, PANIE, nie nam, ale twemu imieniu daj chwałę za twoje miłosierdzie i prawdę."
"Ps115,2": "Czemu mają mówić poganie: Gdzież teraz jest ich Bóg?"
"Ps115,3": "A nasz Bóg jest w niebie, czyni wszystko, co zechce."
"Ps115,4": "Ich bożki to srebro i złoto, dzieło rąk ludzkich."
"Ps115,5": "Usta mają, ale nie mówią; mają oczy, ale nie widzą."
"Ps115,6": "Uszy mają, ale nie słyszą; mają nozdrza, ale nie czują."
"Ps115,7": "Ręce mają, ale nie dotykają; mają nogi, ale nie chodzą; ani gardłem swoim nie wydają głosu."
"Ps115,8": "Niech będą do nich podobni ci, którzy je robią, i wszyscy, którzy im ufają."
"Ps115,9": "Izraelu, ufaj PANU; on jest ich pomocą i tarczą."
"Ps115,10": "Domu Aarona, ufaj PANU; on jest ich pomocą i tarczą."
"Ps115,11": "Wy, którzy się boicie PANA, ufajcie PANU; on jest ich pomocą i tarczą."
"Ps115,12": "PAN pamięta o nas, będzie błogosławił; będzie błogosławił domowi Izraela, będzie błogosławił domowi Aarona."
"Ps115,13": "Będzie błogosławił tym, którzy boją się PANA, i małym, i wielkim."
"Ps115,14": "Rozmnoży was PAN, was i waszych synów."
"Ps115,15": "Błogosławieni jesteście przez PANA, który stworzył niebo i ziemię."
"Ps115,16": "Niebiosa są niebiosami PANA, ale ziemię dał synom ludzkim."
"Ps115,17": "Umarli nie będą chwalili PANA ani nikt z tych, którzy zstępują do miejsca milczenia."
"Ps115,18": "Ale my będziemy błogosławili PANA, odtąd aż na wieki. Alleluja."
