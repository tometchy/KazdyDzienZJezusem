"Ps141,1":
  text: "PANIE, wołam do ciebie, pospiesz ku mnie; wysłuchaj mego głosu, gdy wołam do ciebie."
  tags: []
"Ps141,2":
  text: "Niech moja modlitwa będzie przed tobą jak kadzidło, a podniesienie moich rąk jak wieczorna ofiara."
  tags: []
"Ps141,3":
  text: "PANIE, postaw straż przy moich ustach; strzeż drzwi moich warg."
  tags: []
"Ps141,4":
  text: "Nie skłaniaj mego serca ku złemu, abym nie popełniał czynów niegodziwych z ludźmi, którzy czynią nieprawość, i żebym się nie karmił ich rozkoszami."
  tags: []
"Ps141,5":
  text: "Niech mnie bije sprawiedliwy, a przyjmę to za miłosierdzie; i niech mnie strofuje, a będzie mi to jak wyborny olejek, który nie zaszkodzi mojej głowie; bo jeszcze będę się modlił w czasie ich nieszczęścia."
  tags: []
"Ps141,6":
  text: "Gdy ich sędziowie będą zrzuceni do miejsc skalistych, usłyszą moje słowa, bo są wdzięczne."
  tags: []
"Ps141,7":
  text: "Jak gdyby kto rąbał i łupał drwa na ziemi, tak nasze kości są rozrzucone przy wejściu do grobu."
  tags: []
"Ps141,8":
  text: "Ale podnoszę swoje oczy do ciebie, BOŻE, Panie; tobie ufam, nie porzucaj mojej duszy."
  tags: []
"Ps141,9":
  text: "Strzeż mnie od sidła, które zastawili na mnie, i od pułapek czyniących nieprawość."
  tags: []
"Ps141,10":
  text: "Niech niegodziwi wpadną w swoje sieci, podczas gdy ja ujdę cało."
  tags: []
