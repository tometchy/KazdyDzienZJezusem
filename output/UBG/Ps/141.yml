"Ps141,1": "PANIE, wołam do ciebie, pospiesz ku mnie; wysłuchaj mego głosu, gdy wołam do ciebie."
"Ps141,2": "Niech moja modlitwa będzie przed tobą jak kadzidło, a podniesienie moich rąk jak wieczorna ofiara."
"Ps141,3": "PANIE, postaw straż przy moich ustach; strzeż drzwi moich warg."
"Ps141,4": "Nie skłaniaj mego serca ku złemu, abym nie popełniał czynów niegodziwych z ludźmi, którzy czynią nieprawość, i żebym się nie karmił ich rozkoszami."
"Ps141,5": "Niech mnie bije sprawiedliwy, a przyjmę to za miłosierdzie; i niech mnie strofuje, a będzie mi to jak wyborny olejek, który nie zaszkodzi mojej głowie; bo jeszcze będę się modlił w czasie ich nieszczęścia."
"Ps141,6": "Gdy ich sędziowie będą zrzuceni do miejsc skalistych, usłyszą moje słowa, bo są wdzięczne."
"Ps141,7": "Jak gdyby kto rąbał i łupał drwa na ziemi, tak nasze kości są rozrzucone przy wejściu do grobu."
"Ps141,8": "Ale podnoszę swoje oczy do ciebie, BOŻE, Panie; tobie ufam, nie porzucaj mojej duszy."
"Ps141,9": "Strzeż mnie od sidła, które zastawili na mnie, i od pułapek czyniących nieprawość."
"Ps141,10": "Niech niegodziwi wpadną w swoje sieci, podczas gdy ja ujdę cało."
