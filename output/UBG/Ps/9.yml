"Ps9,1":
  text: "Będę cię wysławiał, PANIE, całym mym sercem; będę opowiadał o wszystkich twoich cudach."
  tags: []
"Ps9,2":
  text: "Będę się cieszył i radował tobą, będę śpiewał twemu imieniu, o Najwyższy!"
  tags: []
"Ps9,3":
  text: "Gdy cofną się moi nieprzyjaciele, upadną i znikną sprzed twego oblicza."
  tags: []
"Ps9,4":
  text: "Ty bowiem przeprowadziłeś mój sąd i moją sprawę, zasiadłeś na tronie jako sędzia sprawiedliwy."
  tags: []
"Ps9,5":
  text: "Skarciłeś pogan, wytraciłeś niegodziwych, wymazałeś ich imię na wieki wieków."
  tags: []
"Ps9,6":
  text: "O nieprzyjacielu, twoje spustoszenia skończyły się na zawsze, zburzyłeś miasta, ich pamięć przepadła razem z nimi."
  tags: []
"Ps9,7":
  text: "Ale PAN trwa na wieki, ustawił swój tron, by sądzić."
  tags: []
"Ps9,8":
  text: "On będzie sądził świat sprawiedliwie, osądzi narody według słuszności."
  tags: []
"Ps9,9":
  text: "I będzie PAN ucieczką dla uciśnionego, schronieniem w czasie niedoli."
  tags: []
"Ps9,10":
  text: "I będą ufać tobie ci, którzy znają twoje imię, bo nie opuszczasz, PANIE, tych, którzy cię szukają."
  tags: []
"Ps9,11":
  text: "Śpiewajcie PANU, który mieszka na Syjonie, opowiadajcie wśród narodów o jego dziełach."
  tags: []
"Ps9,12":
  text: "Bo on dopomina się krwi i pamięta o nich, a nie zapomina wołania strapionych."
  tags: []
"Ps9,13":
  text: "Zmiłuj się nade mną, PANIE, spójrz, jak mnie uciskają ci, którzy mnie nienawidzą, ty, który podnosisz mnie z bram śmierci;"
  tags: []
"Ps9,14":
  text: "Abym głosił wszelką twą chwałę w bramach córki Syjonu; będę się radował twoim zbawieniem."
  tags: []
"Ps9,15":
  text: "Poganie wpadli w dół, który wykopali; w sidłach, które zastawili, uwięzła ich noga."
  tags: []
"Ps9,16":
  text: "PAN dał się poznać, gdy odbył sąd, w dzieła swoich rąk uwikłał się niegodziwy. Higgajon. Sela."
  tags: []
"Ps9,17":
  text: "Niegodziwi zstąpią do piekła, wszystkie narody, które zapominają Boga."
  tags: []
"Ps9,18":
  text: "Bo biedak nie będzie zapomniany na zawsze, nadzieja ubogich nie zginie na wieki."
  tags: []
"Ps9,19":
  text: "Powstań, PANIE, niech nie triumfuje człowiek, niech narody zostaną osądzone przed twoim obliczem."
  tags: []
"Ps9,20":
  text: "PANIE, ześlij na nie strach, aby narody poznały, że są tylko ludźmi. Sela."
  tags: []
