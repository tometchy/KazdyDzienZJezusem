"Ps9,1": "Będę cię wysławiał, PANIE, całym mym sercem; będę opowiadał o wszystkich twoich cudach."
"Ps9,2": "Będę się cieszył i radował tobą, będę śpiewał twemu imieniu, o Najwyższy!"
"Ps9,3": "Gdy cofną się moi nieprzyjaciele, upadną i znikną sprzed twego oblicza."
"Ps9,4": "Ty bowiem przeprowadziłeś mój sąd i moją sprawę, zasiadłeś na tronie jako sędzia sprawiedliwy."
"Ps9,5": "Skarciłeś pogan, wytraciłeś niegodziwych, wymazałeś ich imię na wieki wieków."
"Ps9,6": "O nieprzyjacielu, twoje spustoszenia skończyły się na zawsze, zburzyłeś miasta, ich pamięć przepadła razem z nimi."
"Ps9,7": "Ale PAN trwa na wieki, ustawił swój tron, by sądzić."
"Ps9,8": "On będzie sądził świat sprawiedliwie, osądzi narody według słuszności."
"Ps9,9": "I będzie PAN ucieczką dla uciśnionego, schronieniem w czasie niedoli."
"Ps9,10": "I będą ufać tobie ci, którzy znają twoje imię, bo nie opuszczasz, PANIE, tych, którzy cię szukają."
"Ps9,11": "Śpiewajcie PANU, który mieszka na Syjonie, opowiadajcie wśród narodów o jego dziełach."
"Ps9,12": "Bo on dopomina się krwi i pamięta o nich, a nie zapomina wołania strapionych."
"Ps9,13": "Zmiłuj się nade mną, PANIE, spójrz, jak mnie uciskają ci, którzy mnie nienawidzą, ty, który podnosisz mnie z bram śmierci;"
"Ps9,14": "Abym głosił wszelką twą chwałę w bramach córki Syjonu; będę się radował twoim zbawieniem."
"Ps9,15": "Poganie wpadli w dół, który wykopali; w sidłach, które zastawili, uwięzła ich noga."
"Ps9,16": "PAN dał się poznać, gdy odbył sąd, w dzieła swoich rąk uwikłał się niegodziwy. Higgajon. Sela."
"Ps9,17": "Niegodziwi zstąpią do piekła, wszystkie narody, które zapominają Boga."
"Ps9,18": "Bo biedak nie będzie zapomniany na zawsze, nadzieja ubogich nie zginie na wieki."
"Ps9,19": "Powstań, PANIE, niech nie triumfuje człowiek, niech narody zostaną osądzone przed twoim obliczem."
"Ps9,20": "PANIE, ześlij na nie strach, aby narody poznały, że są tylko ludźmi. Sela."
