"Ps75,1": "Wysławiamy cię, Boże, wysławiamy, bo bliskie twoje imię; opowiadają to twoje cudowne dzieła."
"Ps75,2": "Gdy wyznaczę czas, będę sądzić sprawiedliwie."
"Ps75,3": "Roztopiła się ziemia i wszyscy jej mieszkańcy, ale ja umacniam jej filary. Sela."
"Ps75,4": "Powiedziałem głupcom: Nie szalejcie, a niegodziwym: Nie podnoście rogu."
"Ps75,5": "Nie podnoście wysoko swego rogu i nie mówcie wyniośle;"
"Ps75,6": "Bo nie ze wschodu ani z zachodu, ani z południa przychodzi wywyższenie."
"Ps75,7": "Lecz Bóg jest sędzią; tego poniża, a tamtego wywyższa."
"Ps75,8": "W ręku PANA bowiem jest kielich mętnego wina, pełnego przypraw; z niego nalewa tak, że wszyscy niegodziwi ziemi wycisną nawet męty i wypiją je."
"Ps75,9": "Ja zaś będę zawsze opowiadał, będę śpiewał Bogu Jakuba."
"Ps75,10": "I połamię wszystkie rogi niegodziwych, a rogi sprawiedliwego będą wzniesione."
