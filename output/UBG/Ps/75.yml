"Ps75,1":
  text: "Wysławiamy cię, Boże, wysławiamy, bo bliskie twoje imię; opowiadają to twoje cudowne dzieła."
  tags: []
"Ps75,2":
  text: "Gdy wyznaczę czas, będę sądzić sprawiedliwie."
  tags: []
"Ps75,3":
  text: "Roztopiła się ziemia i wszyscy jej mieszkańcy, ale ja umacniam jej filary. Sela."
  tags: []
"Ps75,4":
  text: "Powiedziałem głupcom: Nie szalejcie, a niegodziwym: Nie podnoście rogu."
  tags: []
"Ps75,5":
  text: "Nie podnoście wysoko swego rogu i nie mówcie wyniośle;"
  tags: []
"Ps75,6":
  text: "Bo nie ze wschodu ani z zachodu, ani z południa przychodzi wywyższenie."
  tags: []
"Ps75,7":
  text: "Lecz Bóg jest sędzią; tego poniża, a tamtego wywyższa."
  tags: []
"Ps75,8":
  text: "W ręku PANA bowiem jest kielich mętnego wina, pełnego przypraw; z niego nalewa tak, że wszyscy niegodziwi ziemi wycisną nawet męty i wypiją je."
  tags: []
"Ps75,9":
  text: "Ja zaś będę zawsze opowiadał, będę śpiewał Bogu Jakuba."
  tags: []
"Ps75,10":
  text: "I połamię wszystkie rogi niegodziwych, a rogi sprawiedliwego będą wzniesione."
  tags: []
