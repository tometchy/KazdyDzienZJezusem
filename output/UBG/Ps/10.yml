"Ps10,1":
  text: "Dlaczego, PANIE, stoisz z daleka? Dlaczego ukrywasz się w czasie niedoli?"
  tags: []
"Ps10,2":
  text: "Niegodziwy w swej pysze prześladuje ubogiego, niech niegodziwi uwikłają się w zamysły, które uknuli."
  tags: []
"Ps10,3":
  text: "Bo niegodziwy chełpi się pragnieniem swej duszy, a chciwiec błogosławi sobie i znieważa PANA."
  tags: []
"Ps10,4":
  text: "Niegodziwy przez pychę, którą po sobie pokazuje, nie szuka Boga; całe jego myślenie to że nie ma Boga."
  tags: []
"Ps10,5":
  text: "Jego drogi zawsze są ciężkie, twoje sądy są zbyt daleko od niego, parska na wszystkich swoich wrogów."
  tags: []
"Ps10,6":
  text: "Mówi w swoim sercu: Nie zachwieję się, nie zaznam zła po wszystkie pokolenia."
  tags: []
"Ps10,7":
  text: "Jego usta pełne są przekleństw, zdrady i podstępu, pod jego językiem krzywda i nieprawość."
  tags: []
"Ps10,8":
  text: "Siedzi w zasadzkach wsi, w ukryciach zabija niewinnego, jego oczy wypatrują ubogiego."
  tags: []
"Ps10,9":
  text: "Czyha w kryjówce jak lew w swej jaskini; czatuje, by schwytać ubogiego, porywa go i wciąga w swe sieci."
  tags: []
"Ps10,10":
  text: "Schyla się, zniża się, od jego mocy padają ubodzy."
  tags: []
"Ps10,11":
  text: "Mówi w swym sercu: Bóg zapomniał, zakrył swoje oblicze, nigdy nie zobaczy."
  tags: []
"Ps10,12":
  text: "Powstań, PANIE Boże, podnieś swą rękę; nie zapominaj o ubogich."
  tags: []
"Ps10,13":
  text: "Dlaczego niegodziwy znieważa Boga? Mówi w swym sercu: Nie będziesz się upominał."
  tags: []
"Ps10,14":
  text: "Lecz ty widzisz utrapienie i patrzysz na krzywdę, aby za nie odpłacić twą ręką. Na ciebie się zdaje ubogi, ty jesteś pomocnikiem sieroty."
  tags: []
"Ps10,15":
  text: "Złam ramię niegodziwego i złego, dochodź jego nieprawości, aż jej już nie będzie."
  tags: []
"Ps10,16":
  text: "PAN jest Królem na wieki wieków, z jego ziemi zniknęły narody."
  tags: []
"Ps10,17":
  text: "Usłyszałeś pragnienia pokornych, PANIE, utwierdzisz ich serca, nakłonisz swego ucha;"
  tags: []
"Ps10,18":
  text: "Aby bronić sieroty i udręczonego, aby śmiertelny człowiek nie gnębił już na ziemi."
  tags: []
