"Ps10,1": "Dlaczego, PANIE, stoisz z daleka? Dlaczego ukrywasz się w czasie niedoli?"
"Ps10,2": "Niegodziwy w swej pysze prześladuje ubogiego, niech niegodziwi uwikłają się w zamysły, które uknuli."
"Ps10,3": "Bo niegodziwy chełpi się pragnieniem swej duszy, a chciwiec błogosławi sobie i znieważa PANA."
"Ps10,4": "Niegodziwy przez pychę, którą po sobie pokazuje, nie szuka Boga; całe jego myślenie to że nie ma Boga."
"Ps10,5": "Jego drogi zawsze są ciężkie, twoje sądy są zbyt daleko od niego, parska na wszystkich swoich wrogów."
"Ps10,6": "Mówi w swoim sercu: Nie zachwieję się, nie zaznam zła po wszystkie pokolenia."
"Ps10,7": "Jego usta pełne są przekleństw, zdrady i podstępu, pod jego językiem krzywda i nieprawość."
"Ps10,8": "Siedzi w zasadzkach wsi, w ukryciach zabija niewinnego, jego oczy wypatrują ubogiego."
"Ps10,9": "Czyha w kryjówce jak lew w swej jaskini; czatuje, by schwytać ubogiego, porywa go i wciąga w swe sieci."
"Ps10,10": "Schyla się, zniża się, od jego mocy padają ubodzy."
"Ps10,11": "Mówi w swym sercu: Bóg zapomniał, zakrył swoje oblicze, nigdy nie zobaczy."
"Ps10,12": "Powstań, PANIE Boże, podnieś swą rękę; nie zapominaj o ubogich."
"Ps10,13": "Dlaczego niegodziwy znieważa Boga? Mówi w swym sercu: Nie będziesz się upominał."
"Ps10,14": "Lecz ty widzisz utrapienie i patrzysz na krzywdę, aby za nie odpłacić twą ręką. Na ciebie się zdaje ubogi, ty jesteś pomocnikiem sieroty."
"Ps10,15": "Złam ramię niegodziwego i złego, dochodź jego nieprawości, aż jej już nie będzie."
"Ps10,16": "PAN jest Królem na wieki wieków, z jego ziemi zniknęły narody."
"Ps10,17": "Usłyszałeś pragnienia pokornych, PANIE, utwierdzisz ich serca, nakłonisz swego ucha;"
"Ps10,18": "Aby bronić sieroty i udręczonego, aby śmiertelny człowiek nie gnębił już na ziemi."
