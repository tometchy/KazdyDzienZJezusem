"Ps60,1": "Boże, odrzuciłeś nas, rozproszyłeś nas i rozgniewałeś się; powróć znowu do nas."
"Ps60,2": "Wstrząsnąłeś ziemią i rozdarłeś ją; ulecz jej rozpadliny, bo się chwieje."
"Ps60,3": "Okazywałeś twemu ludowi ciężkie rzeczy, napoiłeś nas winem odurzającym."
"Ps60,4": "Dałeś chorągiew tym, którzy się ciebie boją, aby wynieśli ją z powodu twej prawdy. Sela."
"Ps60,5": "Aby byli ocaleni twoi umiłowani, wybaw ich swoją prawicą i wysłuchaj mnie."
"Ps60,6": "Bóg przemówił w swojej świętości; będę się radował, rozdzielę Sychem i wymierzę dolinę Sukkot."
"Ps60,7": "Mój jest Gilead, mój i Manasses, Efraim mocą mojej głowy, Juda moim prawodawcą."
"Ps60,8": "Moab moją misą do mycia, na Edom wrzucę mój but; Filisteo, wykrzykuj z mojego powodu."
"Ps60,9": "Kto mnie wprowadzi do miasta warownego? Kto mnie doprowadzi aż do Edomu?"
"Ps60,10": "Czy nie ty, o Boże, który nas odrzuciłeś i nie wychodziłeś, Boże, z naszymi wojskami?"
"Ps60,11": "Udziel nam pomocy w utrapieniu, bo próżna jest pomoc ludzka."
"Ps60,12": "W Bogu będziemy mężni, bo on podepcze naszych nieprzyjaciół."
