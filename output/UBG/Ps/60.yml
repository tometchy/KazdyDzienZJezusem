"Ps60,1":
  text: "Boże, odrzuciłeś nas, rozproszyłeś nas i rozgniewałeś się; powróć znowu do nas."
  tags: []
"Ps60,2":
  text: "Wstrząsnąłeś ziemią i rozdarłeś ją; ulecz jej rozpadliny, bo się chwieje."
  tags: []
"Ps60,3":
  text: "Okazywałeś twemu ludowi ciężkie rzeczy, napoiłeś nas winem odurzającym."
  tags: []
"Ps60,4":
  text: "Dałeś chorągiew tym, którzy się ciebie boją, aby wynieśli ją z powodu twej prawdy. Sela."
  tags: []
"Ps60,5":
  text: "Aby byli ocaleni twoi umiłowani, wybaw ich swoją prawicą i wysłuchaj mnie."
  tags: []
"Ps60,6":
  text: "Bóg przemówił w swojej świętości; będę się radował, rozdzielę Sychem i wymierzę dolinę Sukkot."
  tags: []
"Ps60,7":
  text: "Mój jest Gilead, mój i Manasses, Efraim mocą mojej głowy, Juda moim prawodawcą."
  tags: []
"Ps60,8":
  text: "Moab moją misą do mycia, na Edom wrzucę mój but; Filisteo, wykrzykuj z mojego powodu."
  tags: []
"Ps60,9":
  text: "Kto mnie wprowadzi do miasta warownego? Kto mnie doprowadzi aż do Edomu?"
  tags: []
"Ps60,10":
  text: "Czy nie ty, o Boże, który nas odrzuciłeś i nie wychodziłeś, Boże, z naszymi wojskami?"
  tags: []
"Ps60,11":
  text: "Udziel nam pomocy w utrapieniu, bo próżna jest pomoc ludzka."
  tags: []
"Ps60,12":
  text: "W Bogu będziemy mężni, bo on podepcze naszych nieprzyjaciół."
  tags: []
