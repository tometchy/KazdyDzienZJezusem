"Ps36,1":
  text: "Nieprawość niegodziwego świadczy w mym sercu, że nie ma bojaźni Bożej przed jego oczyma."
  tags: []
"Ps36,2":
  text: "Schlebia sobie bowiem w swoich oczach, aż jego nieprawość okaże się obrzydliwa."
  tags: []
"Ps36,3":
  text: "Słowa jego ust to niegodziwość i fałsz, porzucił mądrość i czynienie dobra."
  tags: []
"Ps36,4":
  text: "Na swoim łożu obmyśla nieprawość, stoi na drodze niedobrej i nie brzydzi się złem."
  tags: []
"Ps36,5":
  text: "PANIE, twoje miłosierdzie sięga niebios, twoja wierność aż do obłoków."
  tags: []
"Ps36,6":
  text: "Twoja sprawiedliwość jak najwyższe góry, twoje sądy jak wielka przepaść; ty, PANIE, zachowujesz ludzi i zwierzęta!"
  tags: []
"Ps36,7":
  text: "Jak cenne jest twoje miłosierdzie, Boże! Dlatego synowie ludzcy chronią się w cieniu twoich skrzydeł."
  tags: []
"Ps36,8":
  text: "Nasycą się obfitością twego domu, napoisz ich strumieniem twoich rozkoszy."
  tags: []
"Ps36,9":
  text: "U ciebie bowiem jest źródło życia, w twojej światłości ujrzymy światłość."
  tags: []
"Ps36,10":
  text: "Roztocz twe miłosierdzie nad tymi, którzy cię znają, a twoją sprawiedliwość nad ludźmi prawego serca."
  tags: []
"Ps36,11":
  text: "Niech nie następuje na mnie noga pyszałka, niech nie wygania mnie ręka niegodziwego."
  tags: []
"Ps36,12":
  text: "Oto tam upadli czyniący nieprawość, zostali powaleni i nie będą mogli powstać."
  tags: []
