"Ps36,1": "Nieprawość niegodziwego świadczy w mym sercu, że nie ma bojaźni Bożej przed jego oczyma."
"Ps36,2": "Schlebia sobie bowiem w swoich oczach, aż jego nieprawość okaże się obrzydliwa."
"Ps36,3": "Słowa jego ust to niegodziwość i fałsz, porzucił mądrość i czynienie dobra."
"Ps36,4": "Na swoim łożu obmyśla nieprawość, stoi na drodze niedobrej i nie brzydzi się złem."
"Ps36,5": "PANIE, twoje miłosierdzie sięga niebios, twoja wierność aż do obłoków."
"Ps36,6": "Twoja sprawiedliwość jak najwyższe góry, twoje sądy jak wielka przepaść; ty, PANIE, zachowujesz ludzi i zwierzęta!"
"Ps36,7": "Jak cenne jest twoje miłosierdzie, Boże! Dlatego synowie ludzcy chronią się w cieniu twoich skrzydeł."
"Ps36,8": "Nasycą się obfitością twego domu, napoisz ich strumieniem twoich rozkoszy."
"Ps36,9": "U ciebie bowiem jest źródło życia, w twojej światłości ujrzymy światłość."
"Ps36,10": "Roztocz twe miłosierdzie nad tymi, którzy cię znają, a twoją sprawiedliwość nad ludźmi prawego serca."
"Ps36,11": "Niech nie następuje na mnie noga pyszałka, niech nie wygania mnie ręka niegodziwego."
"Ps36,12": "Oto tam upadli czyniący nieprawość, zostali powaleni i nie będą mogli powstać."
