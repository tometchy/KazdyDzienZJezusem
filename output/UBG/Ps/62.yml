"Ps62,1":
  text: "Tylko w Bogu spoczywa moja dusza, od niego pochodzi moje zbawienie."
  tags: []
"Ps62,2":
  text: "Tylko on jest moją skałą i zbawieniem, moją twierdzą; nie zachwieję się za bardzo."
  tags: []
"Ps62,3":
  text: "Jak długo będziecie knuć zło przeciwko człowiekowi? Wy wszyscy będziecie zabici, będziecie jak pochylona ściana i jak walący się mur."
  tags: []
"Ps62,4":
  text: "Oni tylko naradzają się, jak go strącić z dostojeństwa; mają upodobanie w kłamstwie, ustami swymi błogosławią, ale w sercu złorzeczą. Sela."
  tags: []
"Ps62,5":
  text: "Tylko w Bogu spocznij, moja duszo, bo od niego pochodzi moja nadzieja."
  tags: []
"Ps62,6":
  text: "On jedynie jest moją skałą i zbawieniem, moją twierdzą; nie zachwieję się."
  tags: []
"Ps62,7":
  text: "W Bogu moje wybawienie i moja chwała; skała mojej mocy, moja ucieczka jest w Bogu."
  tags: []
"Ps62,8":
  text: "Ufajcie mu w każdym czasie, o narody, wylewajcie przed nim wasze serca; Bóg jest naszą ucieczką. Sela."
  tags: []
"Ps62,9":
  text: "Doprawdy synowie ludzcy są marnością, synowie mocarzy – zawodni; położeni na wagę, wszyscy razem są lżejsi niż marność."
  tags: []
"Ps62,10":
  text: "Nie pokładajcie ufności w ucisku ani nie łudźcie się grabieżą; jeśli przybędzie wam bogactw, nie przywiązujcie do nich serca."
  tags: []
"Ps62,11":
  text: "Bóg raz przemówił, dwa razy to słyszałem, że moc należy do Boga;"
  tags: []
"Ps62,12":
  text: "I do ciebie, Panie, należy miłosierdzie, bo ty oddajesz każdemu według jego uczynków."
  tags: []
