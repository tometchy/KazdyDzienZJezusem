"Ps62,1": "Tylko w Bogu spoczywa moja dusza, od niego pochodzi moje zbawienie."
"Ps62,2": "Tylko on jest moją skałą i zbawieniem, moją twierdzą; nie zachwieję się za bardzo."
"Ps62,3": "Jak długo będziecie knuć zło przeciwko człowiekowi? Wy wszyscy będziecie zabici, będziecie jak pochylona ściana i jak walący się mur."
"Ps62,4": "Oni tylko naradzają się, jak go strącić z dostojeństwa; mają upodobanie w kłamstwie, ustami swymi błogosławią, ale w sercu złorzeczą. Sela."
"Ps62,5": "Tylko w Bogu spocznij, moja duszo, bo od niego pochodzi moja nadzieja."
"Ps62,6": "On jedynie jest moją skałą i zbawieniem, moją twierdzą; nie zachwieję się."
"Ps62,7": "W Bogu moje wybawienie i moja chwała; skała mojej mocy, moja ucieczka jest w Bogu."
"Ps62,8": "Ufajcie mu w każdym czasie, o narody, wylewajcie przed nim wasze serca; Bóg jest naszą ucieczką. Sela."
"Ps62,9": "Doprawdy synowie ludzcy są marnością, synowie mocarzy – zawodni; położeni na wagę, wszyscy razem są lżejsi niż marność."
"Ps62,10": "Nie pokładajcie ufności w ucisku ani nie łudźcie się grabieżą; jeśli przybędzie wam bogactw, nie przywiązujcie do nich serca."
"Ps62,11": "Bóg raz przemówił, dwa razy to słyszałem, że moc należy do Boga;"
"Ps62,12": "I do ciebie, Panie, należy miłosierdzie, bo ty oddajesz każdemu według jego uczynków."
