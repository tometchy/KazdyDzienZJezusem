"Ps147,1": "Chwalcie PANA, bo dobrze jest śpiewać naszemu Bogu; jest to bowiem miłe i piękna jest chwała."
"Ps147,2": "PAN buduje Jeruzalem i gromadzi rozproszonych Izraela."
"Ps147,3": "On uzdrawia skruszonych w sercu i opatruje ich rany."
"Ps147,4": "On liczy gwiazdy, nazywa każdą z nich po imieniu."
"Ps147,5": "Wielki jest nasz Pan i zasobny w moc; jego mądrość jest niezmierzona."
"Ps147,6": "PAN podnosi pokornych, a niegodziwych poniża aż do ziemi."
"Ps147,7": "Śpiewajcie PANU z dziękczynieniem; śpiewajcie naszemu Bogu przy dźwiękach harfy;"
"Ps147,8": "Który okrywa niebiosa obłokami i przygotowuje deszcz dla ziemi; który sprawia, że trawa rośnie na górach;"
"Ps147,9": "Który daje pokarm bydłu i młodym krukom wołającym do niego."
"Ps147,10": "Nie lubuje się w mocy konia ani nie ma upodobania w goleniach mężczyzny."
"Ps147,11": "PAN ma upodobanie w tych, którzy się go boją, którzy ufają jego miłosierdziu."
"Ps147,12": "Chwal PANA, Jeruzalem; chwal swego Boga, Syjonie."
"Ps147,13": "On bowiem umacnia zasuwy twoich bram i błogosławi synów twoich pośród ciebie."
"Ps147,14": "Zapewnia pokój w twoich granicach i syci cię najwyborniejszą pszenicą."
"Ps147,15": "On wysyła swój rozkaz na ziemię; szybko biegnie jego słowo."
"Ps147,16": "On daje śnieg jak wełnę, rozsypuje szron jak popiół."
"Ps147,17": "Rzuca swój lód jak okruchy; któż ostoi się przed jego zimnem?"
"Ps147,18": "Posyła swoje słowo i lody topnieją; wionie swym wiatrem i wody spływają."
"Ps147,19": "Oznajmia swe słowo Jakubowi, swe prawa i sądy Izraelowi."
"Ps147,20": "Nie uczynił tak żadnemu narodowi, nie poznali jego sądów. Alleluja."
