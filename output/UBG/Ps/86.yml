"Ps86,1":
  text: "Nakłoń swego ucha, PANIE, wysłuchaj mnie, bo jestem nędzny i ubogi."
  tags: []
"Ps86,2":
  text: "Strzeż mojej duszy, bo jestem pobożny; mój Boże, wybaw twego sługę, który ufa tobie."
  tags: []
"Ps86,3":
  text: "Zmiłuj się nade mną, Panie, bo do ciebie codziennie wołam."
  tags: []
"Ps86,4":
  text: "Rozraduj duszę twego sługi, bo do ciebie, Panie, wznoszę swą duszę."
  tags: []
"Ps86,5":
  text: "Bo ty, Panie, jesteś dobry i przebaczający, i pełen miłosierdzia dla wszystkich, którzy cię wzywają."
  tags: []
"Ps86,6":
  text: "Wysłuchaj, PANIE, mojej modlitwy i zważ na głos mojego błagania."
  tags: []
"Ps86,7":
  text: "Wzywam cię w dniu mego ucisku, bo ty mnie wysłuchasz."
  tags: []
"Ps86,8":
  text: "Nie ma wśród bogów podobnego tobie, Panie, i nie ma dzieł takich jak twoje."
  tags: []
"Ps86,9":
  text: "Wszystkie narody, które stworzyłeś, przyjdą i oddadzą ci pokłon, Panie, i będą wielbić twoje imię;"
  tags: []
"Ps86,10":
  text: "Bo ty jesteś wielki i czynisz cuda; tylko ty jesteś Bogiem."
  tags: []
"Ps86,11":
  text: "Naucz mnie, PANIE, twojej drogi, abym chodził w twojej prawdzie; nakłoń moje serce ku bojaźni twego imienia."
  tags: []
"Ps86,12":
  text: "Będę cię chwalił, Panie, mój Boże, z całego serca i będę wielbił twoje imię na wieki;"
  tags: []
"Ps86,13":
  text: "Bo wielkie jest twoje miłosierdzie dla mnie; ty ocaliłeś moją duszę z najgłębszego piekła."
  tags: []
"Ps86,14":
  text: "Boże, pyszni powstali przeciwko mnie i zgraja gwałtowników czyhała na moją duszę, a nie mają ciebie przed oczyma."
  tags: []
"Ps86,15":
  text: "Ale ty, Panie, jesteś Bogiem łaskawym i litościwym, nieskorym do gniewu, pełnym miłosierdzia i prawdy."
  tags: []
"Ps86,16":
  text: "Spójrz na mnie i zmiłuj się nade mną, udziel swojej mocy twemu słudze i wybaw syna twojej służącej."
  tags: []
"Ps86,17":
  text: "Daj mi znak twojej dobroci, aby ci, którzy mnie nienawidzą, zobaczyli i zawstydzili się, że ty, PANIE, wspomogłeś mnie i pocieszyłeś."
  tags: []
