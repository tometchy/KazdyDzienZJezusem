"Ps86,1": "Nakłoń swego ucha, PANIE, wysłuchaj mnie, bo jestem nędzny i ubogi."
"Ps86,2": "Strzeż mojej duszy, bo jestem pobożny; mój Boże, wybaw twego sługę, który ufa tobie."
"Ps86,3": "Zmiłuj się nade mną, Panie, bo do ciebie codziennie wołam."
"Ps86,4": "Rozraduj duszę twego sługi, bo do ciebie, Panie, wznoszę swą duszę."
"Ps86,5": "Bo ty, Panie, jesteś dobry i przebaczający, i pełen miłosierdzia dla wszystkich, którzy cię wzywają."
"Ps86,6": "Wysłuchaj, PANIE, mojej modlitwy i zważ na głos mojego błagania."
"Ps86,7": "Wzywam cię w dniu mego ucisku, bo ty mnie wysłuchasz."
"Ps86,8": "Nie ma wśród bogów podobnego tobie, Panie, i nie ma dzieł takich jak twoje."
"Ps86,9": "Wszystkie narody, które stworzyłeś, przyjdą i oddadzą ci pokłon, Panie, i będą wielbić twoje imię;"
"Ps86,10": "Bo ty jesteś wielki i czynisz cuda; tylko ty jesteś Bogiem."
"Ps86,11": "Naucz mnie, PANIE, twojej drogi, abym chodził w twojej prawdzie; nakłoń moje serce ku bojaźni twego imienia."
"Ps86,12": "Będę cię chwalił, Panie, mój Boże, z całego serca i będę wielbił twoje imię na wieki;"
"Ps86,13": "Bo wielkie jest twoje miłosierdzie dla mnie; ty ocaliłeś moją duszę z najgłębszego piekła."
"Ps86,14": "Boże, pyszni powstali przeciwko mnie i zgraja gwałtowników czyhała na moją duszę, a nie mają ciebie przed oczyma."
"Ps86,15": "Ale ty, Panie, jesteś Bogiem łaskawym i litościwym, nieskorym do gniewu, pełnym miłosierdzia i prawdy."
"Ps86,16": "Spójrz na mnie i zmiłuj się nade mną, udziel swojej mocy twemu słudze i wybaw syna twojej służącej."
"Ps86,17": "Daj mi znak twojej dobroci, aby ci, którzy mnie nienawidzą, zobaczyli i zawstydzili się, że ty, PANIE, wspomogłeś mnie i pocieszyłeś."
