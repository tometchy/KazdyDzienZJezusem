"Ps72,1":
  text: "Boże, daj królowi swoje sądy i swoją sprawiedliwość synowi króla;"
  tags: []
"Ps72,2":
  text: "Będzie sądził twój lud w sprawiedliwości, a twoich ubogich w prawości."
  tags: []
"Ps72,3":
  text: "Góry przyniosą ludowi pokój, a pagórki sprawiedliwość."
  tags: []
"Ps72,4":
  text: "Będzie sądził ubogich z ludu, wybawi synów potrzebującego, a zgniecie ciemiężyciela."
  tags: []
"Ps72,5":
  text: "Będą się bać ciebie, póki trwać będzie słońce i księżyc, z pokolenia na pokolenie."
  tags: []
"Ps72,6":
  text: "Zstąpi jak deszcz na skoszoną trawę, jak krople deszczu nawadniające ziemię."
  tags: []
"Ps72,7":
  text: "Za jego dni zakwitnie sprawiedliwy i będzie obfitość pokoju, dopóki księżyc trwa."
  tags: []
"Ps72,8":
  text: "Będzie panował od morza do morza, od rzeki aż po krańce ziemi."
  tags: []
"Ps72,9":
  text: "Przed nim upadną mieszkańcy pustyni, a jego wrogowie będą proch lizać."
  tags: []
"Ps72,10":
  text: "Królowie Tarszisz i wysp przyniosą dary, królowie Szeby i Saby złożą daninę."
  tags: []
"Ps72,11":
  text: "I oddadzą mu pokłon wszyscy królowie; wszystkie narody będą mu służyć."
  tags: []
"Ps72,12":
  text: "Ocali bowiem ubogiego, gdy zawoła, i nędznego, który nie ma pomocnika."
  tags: []
"Ps72,13":
  text: "Zmiłuje się nad ubogim i potrzebującym i wybawi dusze nędzarzy."
  tags: []
"Ps72,14":
  text: "Wybawi ich dusze od podstępu i przemocy, bo ich krew jest cenna w jego oczach."
  tags: []
"Ps72,15":
  text: "I będzie żył, i dadzą mu złoto z Szeby; nieustannie będą się za niego modlić i codziennie mu błogosławić."
  tags: []
"Ps72,16":
  text: "Gdy się zasieje garść zboża w ziemi na szczytach gór, jego plon zaszumi jak Liban, a mieszkańcy miast zakwitną jak polna trawa."
  tags: []
"Ps72,17":
  text: "Jego imię trwać będzie na wieki; póki słońce trwa, trwać będzie jego imię; ludzie będą błogosławieni w nim, a wszystkie narody nazwą go błogosławionym."
  tags: []
"Ps72,18":
  text: "Błogosławiony niech będzie PAN Bóg, Bóg Izraela, który sam jeden czyni cuda."
  tags: []
"Ps72,19":
  text: "I błogosławione na wieki jego chwalebne imię; niech cała ziemia będzie napełniona jego chwałą. Amen, amen."
  tags: []
"Ps72,20":
  text: "I tu się kończą modlitwy Dawida, syna Jessego."
  tags: []
