"Ps72,1": "Boże, daj królowi swoje sądy i swoją sprawiedliwość synowi króla;"
"Ps72,2": "Będzie sądził twój lud w sprawiedliwości, a twoich ubogich w prawości."
"Ps72,3": "Góry przyniosą ludowi pokój, a pagórki sprawiedliwość."
"Ps72,4": "Będzie sądził ubogich z ludu, wybawi synów potrzebującego, a zgniecie ciemiężyciela."
"Ps72,5": "Będą się bać ciebie, póki trwać będzie słońce i księżyc, z pokolenia na pokolenie."
"Ps72,6": "Zstąpi jak deszcz na skoszoną trawę, jak krople deszczu nawadniające ziemię."
"Ps72,7": "Za jego dni zakwitnie sprawiedliwy i będzie obfitość pokoju, dopóki księżyc trwa."
"Ps72,8": "Będzie panował od morza do morza, od rzeki aż po krańce ziemi."
"Ps72,9": "Przed nim upadną mieszkańcy pustyni, a jego wrogowie będą proch lizać."
"Ps72,10": "Królowie Tarszisz i wysp przyniosą dary, królowie Szeby i Saby złożą daninę."
"Ps72,11": "I oddadzą mu pokłon wszyscy królowie; wszystkie narody będą mu służyć."
"Ps72,12": "Ocali bowiem ubogiego, gdy zawoła, i nędznego, który nie ma pomocnika."
"Ps72,13": "Zmiłuje się nad ubogim i potrzebującym i wybawi dusze nędzarzy."
"Ps72,14": "Wybawi ich dusze od podstępu i przemocy, bo ich krew jest cenna w jego oczach."
"Ps72,15": "I będzie żył, i dadzą mu złoto z Szeby; nieustannie będą się za niego modlić i codziennie mu błogosławić."
"Ps72,16": "Gdy się zasieje garść zboża w ziemi na szczytach gór, jego plon zaszumi jak Liban, a mieszkańcy miast zakwitną jak polna trawa."
"Ps72,17": "Jego imię trwać będzie na wieki; póki słońce trwa, trwać będzie jego imię; ludzie będą błogosławieni w nim, a wszystkie narody nazwą go błogosławionym."
"Ps72,18": "Błogosławiony niech będzie PAN Bóg, Bóg Izraela, który sam jeden czyni cuda."
"Ps72,19": "I błogosławione na wieki jego chwalebne imię; niech cała ziemia będzie napełniona jego chwałą. Amen, amen."
"Ps72,20": "I tu się kończą modlitwy Dawida, syna Jessego."
