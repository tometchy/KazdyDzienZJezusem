"Ps7,1":
  text: "PANIE, mój Boże, tobie ufam, wybaw mnie od wszystkich moich prześladowców i ocal mnie;"
  tags: []
"Ps7,2":
  text: "By ktoś jak lew nie porwał mojej duszy i nie rozszarpał, gdy nie będzie nikogo, kto by ją ocalił."
  tags: []
"Ps7,3":
  text: "PANIE, mój Boże, jeśli to zrobiłem, jeśli nieprawość jest na moich rękach;"
  tags: []
"Ps7,4":
  text: "Jeśli złem odpłaciłem temu, kto żył ze mną w pokoju, jeśli nie wyratowałem tego, który mnie dręczył bez przyczyny;"
  tags: []
"Ps7,5":
  text: "To niech wróg prześladuje moją duszę i niech pochwyci i wdepcze w ziemię moje życie, niech moją godność w proch obróci. Sela."
  tags: []
"Ps7,6":
  text: "Powstań, PANIE, w swoim gniewie; podnieś się przeciwko wściekłości moich wrogów. Przebudź się w mojej obronie, bo ustanowiłeś sąd."
  tags: []
"Ps7,7":
  text: "Wtedy otoczy cię zgromadzenie narodów, a ty zasiądź na wysokości ze względu na nich."
  tags: []
"Ps7,8":
  text: "PAN będzie sądził narody. Osądź mnie, PANIE, według mojej sprawiedliwości i według mojej uczciwości, która jest we mnie."
  tags: []
"Ps7,9":
  text: "Niech skończy się zło niegodziwych, a umocnij sprawiedliwego, Boże sprawiedliwy, ty, który badasz serca i nerki."
  tags: []
"Ps7,10":
  text: "Moją tarczą jest Bóg, który wybawia ludzi prawego serca."
  tags: []
"Ps7,11":
  text: "Bóg jest sędzią sprawiedliwym, Bóg codziennie gniewa się na bezbożnego."
  tags: []
"Ps7,12":
  text: "Jeśli się nie nawróci, on swój miecz naostrzy; swój łuk napiął i przygotował go."
  tags: []
"Ps7,13":
  text: "Przygotował na niego broń śmiertelną, a swoje strzały sporządził na prześladowców."
  tags: []
"Ps7,14":
  text: "Oto bezbożny rodzi nieprawość, jest brzemienny krzywdą i zrodził kłamstwo."
  tags: []
"Ps7,15":
  text: "Wykopał dół i pogłębił go, lecz sam wpadnie do jamy, którą przygotował."
  tags: []
"Ps7,16":
  text: "Krzywda, którą wyrządzał, obróci się przeciwko niemu, a jego nieprawość spadnie mu na głowę."
  tags: []
"Ps7,17":
  text: "Będę wysławiał PANA według jego sprawiedliwości, będę śpiewał imieniu PANA Najwyższego."
  tags: []
