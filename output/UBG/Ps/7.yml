"Ps7,1": "PANIE, mój Boże, tobie ufam, wybaw mnie od wszystkich moich prześladowców i ocal mnie;"
"Ps7,2": "By ktoś jak lew nie porwał mojej duszy i nie rozszarpał, gdy nie będzie nikogo, kto by ją ocalił."
"Ps7,3": "PANIE, mój Boże, jeśli to zrobiłem, jeśli nieprawość jest na moich rękach;"
"Ps7,4": "Jeśli złem odpłaciłem temu, kto żył ze mną w pokoju, jeśli nie wyratowałem tego, który mnie dręczył bez przyczyny;"
"Ps7,5": "To niech wróg prześladuje moją duszę i niech pochwyci i wdepcze w ziemię moje życie, niech moją godność w proch obróci. Sela."
"Ps7,6": "Powstań, PANIE, w swoim gniewie; podnieś się przeciwko wściekłości moich wrogów. Przebudź się w mojej obronie, bo ustanowiłeś sąd."
"Ps7,7": "Wtedy otoczy cię zgromadzenie narodów, a ty zasiądź na wysokości ze względu na nich."
"Ps7,8": "PAN będzie sądził narody. Osądź mnie, PANIE, według mojej sprawiedliwości i według mojej uczciwości, która jest we mnie."
"Ps7,9": "Niech skończy się zło niegodziwych, a umocnij sprawiedliwego, Boże sprawiedliwy, ty, który badasz serca i nerki."
"Ps7,10": "Moją tarczą jest Bóg, który wybawia ludzi prawego serca."
"Ps7,11": "Bóg jest sędzią sprawiedliwym, Bóg codziennie gniewa się na bezbożnego."
"Ps7,12": "Jeśli się nie nawróci, on swój miecz naostrzy; swój łuk napiął i przygotował go."
"Ps7,13": "Przygotował na niego broń śmiertelną, a swoje strzały sporządził na prześladowców."
"Ps7,14": "Oto bezbożny rodzi nieprawość, jest brzemienny krzywdą i zrodził kłamstwo."
"Ps7,15": "Wykopał dół i pogłębił go, lecz sam wpadnie do jamy, którą przygotował."
"Ps7,16": "Krzywda, którą wyrządzał, obróci się przeciwko niemu, a jego nieprawość spadnie mu na głowę."
"Ps7,17": "Będę wysławiał PANA według jego sprawiedliwości, będę śpiewał imieniu PANA Najwyższego."
