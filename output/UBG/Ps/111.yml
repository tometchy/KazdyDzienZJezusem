"Ps111,1": "Alleluja. Będę wysławiał PANA całym sercem w radzie prawych i w zgromadzeniu."
"Ps111,2": "Wielkie są dzieła PANA, rozważane przez wszystkich, którzy je miłują."
"Ps111,3": "Jego dzieło jest chwalebne i wspaniałe, a jego sprawiedliwość trwa na wieki."
"Ps111,4": "Pamiętnymi uczynił swe cuda; miłosierny i litościwy jest PAN."
"Ps111,5": "Dał pokarm tym, którzy się go boją, pamięta wiecznie o swoim przymierzu."
"Ps111,6": "Okazał swemu ludowi potęgę swoich dzieł, dając mu dziedzictwo pogan."
"Ps111,7": "Dzieła rąk jego to prawda i sąd, niezmienne są wszystkie jego przykazania;"
"Ps111,8": "Ustalone na wieki wieków, ustanowione w prawdzie i prawości."
"Ps111,9": "Zesłał swemu ludowi odkupienie, ustanowił na wieki swoje przymierze; jego imię jest święte i straszne."
"Ps111,10": "Bojaźń PANA jest początkiem mądrości; prawdziwego rozumu nabywają wszyscy, którzy wypełniają jego przykazania; jego chwała trwa na wieki."
