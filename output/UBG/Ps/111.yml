"Ps111,1":
  text: "Alleluja. Będę wysławiał PANA całym sercem w radzie prawych i w zgromadzeniu."
  tags: []
"Ps111,2":
  text: "Wielkie są dzieła PANA, rozważane przez wszystkich, którzy je miłują."
  tags: []
"Ps111,3":
  text: "Jego dzieło jest chwalebne i wspaniałe, a jego sprawiedliwość trwa na wieki."
  tags: []
"Ps111,4":
  text: "Pamiętnymi uczynił swe cuda; miłosierny i litościwy jest PAN."
  tags: []
"Ps111,5":
  text: "Dał pokarm tym, którzy się go boją, pamięta wiecznie o swoim przymierzu."
  tags: []
"Ps111,6":
  text: "Okazał swemu ludowi potęgę swoich dzieł, dając mu dziedzictwo pogan."
  tags: []
"Ps111,7":
  text: "Dzieła rąk jego to prawda i sąd, niezmienne są wszystkie jego przykazania;"
  tags: []
"Ps111,8":
  text: "Ustalone na wieki wieków, ustanowione w prawdzie i prawości."
  tags: []
"Ps111,9":
  text: "Zesłał swemu ludowi odkupienie, ustanowił na wieki swoje przymierze; jego imię jest święte i straszne."
  tags: []
"Ps111,10":
  text: "Bojaźń PANA jest początkiem mądrości; prawdziwego rozumu nabywają wszyscy, którzy wypełniają jego przykazania; jego chwała trwa na wieki."
  tags: []
