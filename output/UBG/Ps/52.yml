"Ps52,1":
  text: "Czemu chlubisz się złem, mocarzu? Miłosierdzie Boże trwa nieustannie."
  tags: []
"Ps52,2":
  text: "Twój język knuje przewrotność, ostry jak brzytwa, działający podstępnie."
  tags: []
"Ps52,3":
  text: "Miłujesz zło bardziej niż dobro i kłamstwo bardziej niż mowę sprawiedliwą. Sela."
  tags: []
"Ps52,4":
  text: "Miłujesz wszelkie słowa szkodliwe, podstępny języku."
  tags: []
"Ps52,5":
  text: "Dlatego Bóg zniszczy cię na wieki, pochwyci cię i wyrwie z namiotu, i wykorzeni cię z ziemi żyjących. Sela."
  tags: []
"Ps52,6":
  text: "Zobaczą to sprawiedliwi i zlękną się, i będą się z niego śmiać:"
  tags: []
"Ps52,7":
  text: "Oto człowiek, który nie uczynił Boga swoją siłą, ale ufał swym wielkim bogactwom i umacniał się w swojej nieprawości."
  tags: []
"Ps52,8":
  text: "Ja zaś jestem jak zielone drzewo oliwne w domu Bożym, zaufałem miłosierdziu Boga na wieki wieków."
  tags: []
"Ps52,9":
  text: "Będę cię wysławiał na wieki, że to uczyniłeś, i będę oczekiwał twego imienia, gdyż jest dobre w oczach twoich świętych."
  tags: []
