"Ps52,1": "Czemu chlubisz się złem, mocarzu? Miłosierdzie Boże trwa nieustannie."
"Ps52,2": "Twój język knuje przewrotność, ostry jak brzytwa, działający podstępnie."
"Ps52,3": "Miłujesz zło bardziej niż dobro i kłamstwo bardziej niż mowę sprawiedliwą. Sela."
"Ps52,4": "Miłujesz wszelkie słowa szkodliwe, podstępny języku."
"Ps52,5": "Dlatego Bóg zniszczy cię na wieki, pochwyci cię i wyrwie z namiotu, i wykorzeni cię z ziemi żyjących. Sela."
"Ps52,6": "Zobaczą to sprawiedliwi i zlękną się, i będą się z niego śmiać:"
"Ps52,7": "Oto człowiek, który nie uczynił Boga swoją siłą, ale ufał swym wielkim bogactwom i umacniał się w swojej nieprawości."
"Ps52,8": "Ja zaś jestem jak zielone drzewo oliwne w domu Bożym, zaufałem miłosierdziu Boga na wieki wieków."
"Ps52,9": "Będę cię wysławiał na wieki, że to uczyniłeś, i będę oczekiwał twego imienia, gdyż jest dobre w oczach twoich świętych."
