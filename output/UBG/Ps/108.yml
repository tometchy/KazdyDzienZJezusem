"Ps108,1": "Boże, moje serce jest gotowe; będę ci śpiewać i wysławiać cię, także i moja chwała."
"Ps108,2": "Obudź się, cytro i harfo, gdy o świcie powstanę."
"Ps108,3": "Będę cię wysławiać wśród ludu, PANIE, będę ci śpiewał wśród narodów."
"Ps108,4": "Twoje miłosierdzie bowiem jest wielkie, sięga ponad niebiosa, a twoja prawda aż pod obłoki."
"Ps108,5": "Bądź wywyższony ponad niebiosa, Boże, a twoja chwała ponad całą ziemię;"
"Ps108,6": "Aby twoi umiłowani byli ocaleni, wybaw ich swoją prawicą i wysłuchaj mnie."
"Ps108,7": "Bóg przemówił w swej świętości: Będę się weselić, rozdzielę Sychem, a dolinę Sukkot wymierzę."
"Ps108,8": "Mój jest Gilead, mój i Manasses, Efraim mocą mojej głowy, Juda moim prawodawcą."
"Ps108,9": "Moab jest moją miednicą do mycia, na Edom rzucę moje obuwie, nad Filisteą zatriumfuję."
"Ps108,10": "Kto mnie wprowadzi do miasta warownego? Kto mnie doprowadzi aż do Edomu?"
"Ps108,11": "Czy nie ty, Boże, który nas odrzuciłeś? Czy nie wyruszysz, Boże, z naszymi wojskami?"
"Ps108,12": "Udziel nam pomocy w ucisku, bo próżna jest pomoc ludzka."
"Ps108,13": "W Bogu będziemy mężni, on podepcze naszych wrogów."
