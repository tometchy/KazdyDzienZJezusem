"Ps48,1": "Wielki jest PAN i godzien wielkiej chwały w mieście naszego Boga, na swej świętej górze."
"Ps48,2": "Pięknie wzniesiona, radością całej ziemi jest góra Syjon na krańcach północy, miasto wielkiego Króla."
"Ps48,3": "Bóg w pałacach jego jest uznany za twierdzę."
"Ps48,4": "Bo oto zgromadzili się królowie i razem ruszyli."
"Ps48,5": "Gdy zobaczyli, zdumieli się, przerazili się i uciekli."
"Ps48,6": "Strach ich tam ogarnął i ból, jak rodzącą kobietę."
"Ps48,7": "Wiatrem wschodnim rozbijasz okręty Tarszisz."
"Ps48,8": "To, co słyszeliśmy, to zobaczyliśmy w mieście PANA zastępów, w mieście naszego Boga; Bóg je ugruntuje na wieki. Sela."
"Ps48,9": "Rozważamy, o Boże, twoje miłosierdzie we wnętrzu twej świątyni."
"Ps48,10": "Jak twoje imię, Boże, tak i chwała twoja sięga aż po krańce ziemi; twoja prawica pełna jest sprawiedliwości."
"Ps48,11": "Niech się weseli góra Syjon, niech się radują córki Judy z powodu twoich sądów."
"Ps48,12": "Okrążcie Syjon i obejdźcie go, policzcie jego wieże."
"Ps48,13": "Przyjrzyjcie się jego wałom obronnym, oglądajcie jego pałace, abyście mogli opowiadać przyszłemu pokoleniu."
"Ps48,14": "Bo ten Bóg jest naszym Bogiem na wieki wieków, on będzie nas prowadził aż do śmierci."
