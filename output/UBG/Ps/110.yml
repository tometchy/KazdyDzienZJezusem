"Ps110,1":
  text: "Powiedział PAN do mego Pana: Usiądź po mojej prawicy, aż położę twoich wrogów jako podnóżek pod twoje stopy."
  tags: []
"Ps110,2":
  text: "Laskę twojej mocy pośle PAN z Syjonu, mówiąc: Panuj pośród twoich wrogów."
  tags: []
"Ps110,3":
  text: "Twój lud będzie ochoczy w dniu twej potęgi, w ozdobie świętości i z łona jutrzenki; twoja jest rosa młodości."
  tags: []
"Ps110,4":
  text: "PAN przysiągł i nie będzie żałował: Ty jesteś kapłanem na wieki według porządku Melchizedeka."
  tags: []
"Ps110,5":
  text: "Pan po twojej prawicy zetrze królów w dniu swego gniewu."
  tags: []
"Ps110,6":
  text: "Będzie sądził narody i trupami napełni wszystko; roztrzaska głowy panujące nad wieloma ziemiami."
  tags: []
"Ps110,7":
  text: "Ze strumienia będzie pił po drodze, dlatego podniesie głowę."
  tags: []
