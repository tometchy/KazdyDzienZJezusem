"Ps110,1": "Powiedział PAN do mego Pana: Usiądź po mojej prawicy, aż położę twoich wrogów jako podnóżek pod twoje stopy."
"Ps110,2": "Laskę twojej mocy pośle PAN z Syjonu, mówiąc: Panuj pośród twoich wrogów."
"Ps110,3": "Twój lud będzie ochoczy w dniu twej potęgi, w ozdobie świętości i z łona jutrzenki; twoja jest rosa młodości."
"Ps110,4": "PAN przysiągł i nie będzie żałował: Ty jesteś kapłanem na wieki według porządku Melchizedeka."
"Ps110,5": "Pan po twojej prawicy zetrze królów w dniu swego gniewu."
"Ps110,6": "Będzie sądził narody i trupami napełni wszystko; roztrzaska głowy panujące nad wieloma ziemiami."
"Ps110,7": "Ze strumienia będzie pił po drodze, dlatego podniesie głowę."
