"Ps39,1": "Powiedziałem: Będę strzegł moich dróg, abym nie zgrzeszył językiem; nałożę na usta wędzidło, dopóki niegodziwy będzie przede mną."
"Ps39,2": "Zaniemówiłem oniemiały, zamilkłem nawet w dobrej sprawie, lecz moja boleść się wzmagała."
"Ps39,3": "Rozgorzało we mnie serce; gdy rozmyślałem, zapłonął ogień, a wtedy mój język tak przemówił:"
"Ps39,4": "PANIE, daj mi poznać mój kres i miarę moich dni, abym wiedział, jak jestem słaby."
"Ps39,5": "Oto wymierzyłeś moje dni na szerokość dłoni, a mój wiek jest niczym przed tobą; zaprawdę każdy człowiek, nawet najlepszy, jest całkowitą marnością. Sela."
"Ps39,6": "Doprawdy człowiek przemija jak cień; doprawdy na próżno się kłopocze; gromadzi, a nie wie, kto to zabierze."
"Ps39,7": "A teraz czego mam oczekiwać, Panie? W tobie jest moja nadzieja."
"Ps39,8": "Uwolnij mnie od wszystkich moich występków, nie wystawiaj mnie na pośmiewisko głupca."
"Ps39,9": "Zamilkłem i nie otworzyłem moich ust, bo ty to sprawiłeś."
"Ps39,10": "Oddal ode mnie twoje karanie, bo ginę od uderzeń twojej ręki."
"Ps39,11": "Gdy karą chłoszczesz człowieka za nieprawość, to jak mól niszczysz jego piękno; doprawdy marnością jest każdy człowiek. Sela."
"Ps39,12": "Wysłuchaj mojej modlitwy, PANIE, i nakłoń ucha na moje wołanie; nie bądź głuchy na moje łzy, bo jestem gościem u ciebie i przychodniem, jak wszyscy moi ojcowie."
"Ps39,13": "Oszczędzaj mnie, abym się wzmacniał, zanim odejdę i już mnie nie będzie."
