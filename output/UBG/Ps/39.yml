"Ps39,1":
  text: "Powiedziałem: Będę strzegł moich dróg, abym nie zgrzeszył językiem; nałożę na usta wędzidło, dopóki niegodziwy będzie przede mną."
  tags: []
"Ps39,2":
  text: "Zaniemówiłem oniemiały, zamilkłem nawet w dobrej sprawie, lecz moja boleść się wzmagała."
  tags: []
"Ps39,3":
  text: "Rozgorzało we mnie serce; gdy rozmyślałem, zapłonął ogień, a wtedy mój język tak przemówił:"
  tags: []
"Ps39,4":
  text: "PANIE, daj mi poznać mój kres i miarę moich dni, abym wiedział, jak jestem słaby."
  tags: []
"Ps39,5":
  text: "Oto wymierzyłeś moje dni na szerokość dłoni, a mój wiek jest niczym przed tobą; zaprawdę każdy człowiek, nawet najlepszy, jest całkowitą marnością. Sela."
  tags: []
"Ps39,6":
  text: "Doprawdy człowiek przemija jak cień; doprawdy na próżno się kłopocze; gromadzi, a nie wie, kto to zabierze."
  tags: []
"Ps39,7":
  text: "A teraz czego mam oczekiwać, Panie? W tobie jest moja nadzieja."
  tags: []
"Ps39,8":
  text: "Uwolnij mnie od wszystkich moich występków, nie wystawiaj mnie na pośmiewisko głupca."
  tags: []
"Ps39,9":
  text: "Zamilkłem i nie otworzyłem moich ust, bo ty to sprawiłeś."
  tags: []
"Ps39,10":
  text: "Oddal ode mnie twoje karanie, bo ginę od uderzeń twojej ręki."
  tags: []
"Ps39,11":
  text: "Gdy karą chłoszczesz człowieka za nieprawość, to jak mól niszczysz jego piękno; doprawdy marnością jest każdy człowiek. Sela."
  tags: []
"Ps39,12":
  text: "Wysłuchaj mojej modlitwy, PANIE, i nakłoń ucha na moje wołanie; nie bądź głuchy na moje łzy, bo jestem gościem u ciebie i przychodniem, jak wszyscy moi ojcowie."
  tags: []
"Ps39,13":
  text: "Oszczędzaj mnie, abym się wzmacniał, zanim odejdę i już mnie nie będzie."
  tags: []
