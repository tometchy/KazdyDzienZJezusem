"Ps33,1": "Weselcie się w PANU, sprawiedliwi, bo prawym przystoi chwała."
"Ps33,2": "Wysławiajcie PANA na harfie, śpiewajcie mu przy cytrze i z instrumentem o dziesięciu strunach."
"Ps33,3": "Śpiewajcie mu nową pieśń, pięknie i głośno mu grajcie."
"Ps33,4": "Słowo PANA bowiem jest prawe i wszystkie jego dzieła są dokonane w wierności."
"Ps33,5": "On miłuje sprawiedliwość i sąd, pełna jest ziemia miłosierdzia PANA."
"Ps33,6": "Słowem PANA zostały uczynione niebiosa i tchnieniem jego ust wszystkie ich zastępy."
"Ps33,7": "On gromadzi wody morskie jak na stos i w skarbcach zbiera głębiny."
"Ps33,8": "Niech cała ziemia boi się PANA, niech się go lękają wszyscy mieszkańcy świata."
"Ps33,9": "On bowiem przemówił i stało się; on rozkazał i powstało."
"Ps33,10": "PAN udaremnia zamiary narodów, niweczy zamysły ludów."
"Ps33,11": "Zamiar PANA trwa na wieki, myśli jego serca z pokolenia na pokolenie."
"Ps33,12": "Błogosławiony naród, którego Bogiem jest PAN; lud, który on wybrał sobie na dziedzictwo."
"Ps33,13": "PAN patrzy z nieba, widzi wszystkich synów ludzkich."
"Ps33,14": "Z miejsca, w którym przebywa, spogląda na wszystkich mieszkańców ziemi."
"Ps33,15": "Ukształtował serce każdego z nich, przygląda się wszystkim ich czynom."
"Ps33,16": "Nie wybawi króla liczne wojsko ani nie ocali wojownika wielka siła."
"Ps33,17": "Koń jest zwodniczy w wybawieniu, nie ocali swą wielką siłą."
"Ps33,18": "Oto oko PANA nad tymi, którzy się go boją, nad tymi, którzy ufają jego miłosierdziu;"
"Ps33,19": "Aby ocalić od śmierci ich duszę i żywić ich w czasie głodu."
"Ps33,20": "Nasza dusza oczekuje PANA, on jest naszą pomocą i tarczą."
"Ps33,21": "W nim bowiem rozraduje się nasze serce, bo ufamy jego świętemu imieniu."
"Ps33,22": "Niech będzie nad nami twoje miłosierdzie, PANIE, według pokładanej w tobie nadziei."
