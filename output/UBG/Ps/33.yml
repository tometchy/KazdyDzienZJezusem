"Ps33,1":
  text: "Weselcie się w PANU, sprawiedliwi, bo prawym przystoi chwała."
  tags: []
"Ps33,2":
  text: "Wysławiajcie PANA na harfie, śpiewajcie mu przy cytrze i z instrumentem o dziesięciu strunach."
  tags: []
"Ps33,3":
  text: "Śpiewajcie mu nową pieśń, pięknie i głośno mu grajcie."
  tags: []
"Ps33,4":
  text: "Słowo PANA bowiem jest prawe i wszystkie jego dzieła są dokonane w wierności."
  tags: []
"Ps33,5":
  text: "On miłuje sprawiedliwość i sąd, pełna jest ziemia miłosierdzia PANA."
  tags: []
"Ps33,6":
  text: "Słowem PANA zostały uczynione niebiosa i tchnieniem jego ust wszystkie ich zastępy."
  tags: []
"Ps33,7":
  text: "On gromadzi wody morskie jak na stos i w skarbcach zbiera głębiny."
  tags: []
"Ps33,8":
  text: "Niech cała ziemia boi się PANA, niech się go lękają wszyscy mieszkańcy świata."
  tags: []
"Ps33,9":
  text: "On bowiem przemówił i stało się; on rozkazał i powstało."
  tags: []
"Ps33,10":
  text: "PAN udaremnia zamiary narodów, niweczy zamysły ludów."
  tags: []
"Ps33,11":
  text: "Zamiar PANA trwa na wieki, myśli jego serca z pokolenia na pokolenie."
  tags: []
"Ps33,12":
  text: "Błogosławiony naród, którego Bogiem jest PAN; lud, który on wybrał sobie na dziedzictwo."
  tags: []
"Ps33,13":
  text: "PAN patrzy z nieba, widzi wszystkich synów ludzkich."
  tags: []
"Ps33,14":
  text: "Z miejsca, w którym przebywa, spogląda na wszystkich mieszkańców ziemi."
  tags: []
"Ps33,15":
  text: "Ukształtował serce każdego z nich, przygląda się wszystkim ich czynom."
  tags: []
"Ps33,16":
  text: "Nie wybawi króla liczne wojsko ani nie ocali wojownika wielka siła."
  tags: []
"Ps33,17":
  text: "Koń jest zwodniczy w wybawieniu, nie ocali swą wielką siłą."
  tags: []
"Ps33,18":
  text: "Oto oko PANA nad tymi, którzy się go boją, nad tymi, którzy ufają jego miłosierdziu;"
  tags: []
"Ps33,19":
  text: "Aby ocalić od śmierci ich duszę i żywić ich w czasie głodu."
  tags: []
"Ps33,20":
  text: "Nasza dusza oczekuje PANA, on jest naszą pomocą i tarczą."
  tags: []
"Ps33,21":
  text: "W nim bowiem rozraduje się nasze serce, bo ufamy jego świętemu imieniu."
  tags: []
"Ps33,22":
  text: "Niech będzie nad nami twoje miłosierdzie, PANIE, według pokładanej w tobie nadziei."
  tags: []
