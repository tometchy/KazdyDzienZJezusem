"Ps103,1":
  text: "Błogosław, moja duszo, PANA, i całe moje wnętrze – jego święte imię."
  tags: []
"Ps103,2":
  text: "Błogosław, moja duszo, PANA, i nie zapominaj o wszystkich jego dobrodziejstwach."
  tags: []
"Ps103,3":
  text: "On przebacza wszystkie twoje nieprawości, on uzdrawia wszystkie twoje choroby;"
  tags: []
"Ps103,4":
  text: "On wybawia twoje życie od zguby, on cię koronuje miłosierdziem i wielką litością."
  tags: []
"Ps103,5":
  text: "On nasyca dobrem twoje usta i odnawia twoją młodość jak u orła."
  tags: []
"Ps103,6":
  text: "PAN wymierza sprawiedliwość i sąd wszystkim uciśnionym."
  tags: []
"Ps103,7":
  text: "Dał poznać swe drogi Mojżeszowi, a synom Izraela swoje dzieła."
  tags: []
"Ps103,8":
  text: "Łaskawy i litościwy jest PAN, nieskory do gniewu i pełen wielkiego miłosierdzia."
  tags: []
"Ps103,9":
  text: "Nie będzie się spierał bez końca ani wiecznie gniewu chował."
  tags: []
"Ps103,10":
  text: "Nie postępuje z nami według naszych grzechów ani nie odpłaca nam według naszych nieprawości."
  tags: []
"Ps103,11":
  text: "Jak wysoko bowiem są niebiosa nad ziemią, tak wielkie jest jego miłosierdzie nad tymi, którzy się go boją."
  tags: []
"Ps103,12":
  text: "Jak daleko jest wschód od zachodu, tak daleko oddalił od nas nasze występki."
  tags: []
"Ps103,13":
  text: "Jak ojciec ma litość nad dziećmi, tak PAN ma litość nad tymi, którzy się go boją."
  tags: []
"Ps103,14":
  text: "On bowiem wie, z czego jesteśmy ulepieni; pamięta, że jesteśmy prochem."
  tags: []
"Ps103,15":
  text: "Dni człowieka są jak trawa, kwitnie jak kwiat polny."
  tags: []
"Ps103,16":
  text: "Wiatr na niego powieje, a już go nie ma i nie pozna go już jego miejsce."
  tags: []
"Ps103,17":
  text: "Ale miłosierdzie PANA od wieków na wieki nad tymi, którzy się go boją, a jego sprawiedliwość nad synami synów;"
  tags: []
"Ps103,18":
  text: "Nad tymi, którzy strzegą jego przymierza i pamiętają, aby wypełnić jego przykazania."
  tags: []
"Ps103,19":
  text: "PAN na niebiosach ustanowił swój tron, a jego królestwo panuje nad wszystkimi."
  tags: []
"Ps103,20":
  text: "Błogosławcie PANA, jego aniołowie, potężni siłą, którzy wypełniacie jego rozkazy, będąc posłuszni głosowi jego słowa."
  tags: []
"Ps103,21":
  text: "Błogosławcie PANA, wszystkie jego zastępy, jego słudzy, którzy spełniacie jego wolę."
  tags: []
"Ps103,22":
  text: "Błogosławcie PANA, wszystkie jego dzieła, we wszystkich miejscach jego panowania. Błogosław, moja duszo, PANA."
  tags: []
