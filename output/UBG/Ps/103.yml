"Ps103,1": "Błogosław, moja duszo, PANA, i całe moje wnętrze – jego święte imię."
"Ps103,2": "Błogosław, moja duszo, PANA, i nie zapominaj o wszystkich jego dobrodziejstwach."
"Ps103,3": "On przebacza wszystkie twoje nieprawości, on uzdrawia wszystkie twoje choroby;"
"Ps103,4": "On wybawia twoje życie od zguby, on cię koronuje miłosierdziem i wielką litością."
"Ps103,5": "On nasyca dobrem twoje usta i odnawia twoją młodość jak u orła."
"Ps103,6": "PAN wymierza sprawiedliwość i sąd wszystkim uciśnionym."
"Ps103,7": "Dał poznać swe drogi Mojżeszowi, a synom Izraela swoje dzieła."
"Ps103,8": "Łaskawy i litościwy jest PAN, nieskory do gniewu i pełen wielkiego miłosierdzia."
"Ps103,9": "Nie będzie się spierał bez końca ani wiecznie gniewu chował."
"Ps103,10": "Nie postępuje z nami według naszych grzechów ani nie odpłaca nam według naszych nieprawości."
"Ps103,11": "Jak wysoko bowiem są niebiosa nad ziemią, tak wielkie jest jego miłosierdzie nad tymi, którzy się go boją."
"Ps103,12": "Jak daleko jest wschód od zachodu, tak daleko oddalił od nas nasze występki."
"Ps103,13": "Jak ojciec ma litość nad dziećmi, tak PAN ma litość nad tymi, którzy się go boją."
"Ps103,14": "On bowiem wie, z czego jesteśmy ulepieni; pamięta, że jesteśmy prochem."
"Ps103,15": "Dni człowieka są jak trawa, kwitnie jak kwiat polny."
"Ps103,16": "Wiatr na niego powieje, a już go nie ma i nie pozna go już jego miejsce."
"Ps103,17": "Ale miłosierdzie PANA od wieków na wieki nad tymi, którzy się go boją, a jego sprawiedliwość nad synami synów;"
"Ps103,18": "Nad tymi, którzy strzegą jego przymierza i pamiętają, aby wypełnić jego przykazania."
"Ps103,19": "PAN na niebiosach ustanowił swój tron, a jego królestwo panuje nad wszystkimi."
"Ps103,20": "Błogosławcie PANA, jego aniołowie, potężni siłą, którzy wypełniacie jego rozkazy, będąc posłuszni głosowi jego słowa."
"Ps103,21": "Błogosławcie PANA, wszystkie jego zastępy, jego słudzy, którzy spełniacie jego wolę."
"Ps103,22": "Błogosławcie PANA, wszystkie jego dzieła, we wszystkich miejscach jego panowania. Błogosław, moja duszo, PANA."
