"Ps84,1": "O, jak miłe są twoje przybytki, PANIE zastępów!"
"Ps84,2": "Moja dusza wzdycha i omdlewa z tęsknoty do przedsionków PANA; moje serce i ciało wołają radośnie do Boga żywego."
"Ps84,3": "Oto nawet wróbel znalazł sobie dom i jaskółka gniazdo, gdzie składa swe pisklęta, u twoich ołtarzy, PANIE zastępów, mój Królu i mój Boże!"
"Ps84,4": "Błogosławieni ci, którzy mieszkają w twoim domu, nieustannie będą cię chwalić. Sela."
"Ps84,5": "Błogosławiony człowiek, którego siła jest w tobie, w którego sercu są twoje drogi;"
"Ps84,6": "Ci, którzy przechodząc przez dolinę Baka, zmieniają ją w źródło, a deszcz okrywa ją błogosławieństwem."
"Ps84,7": "I idą z mocy w moc, i ukażą się przed Bogiem na Syjonie."
"Ps84,8": "O PANIE, Boże zastępów, wysłuchaj mojej modlitwy, nakłoń ucha, Boże Jakuba. Sela."
"Ps84,9": "Spójrz, Boże, nasza tarczo, i wejrzyj na oblicze twego pomazańca."
"Ps84,10": "Lepszy bowiem jest jeden dzień w twoich przedsionkach niż tysiąc gdzie indziej; wolę raczej stać w progu domu mego Boga, niż mieszkać w namiotach niegodziwców."
"Ps84,11": "PAN Bóg bowiem jest słońcem i tarczą, PAN obdarza łaską i chwałą, nie odmawia dobra tym, którzy postępują nienagannie."
"Ps84,12": "PANIE zastępów, błogosławiony człowiek, który ufa tobie."
