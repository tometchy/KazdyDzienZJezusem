"Ps84,1":
  text: "O, jak miłe są twoje przybytki, PANIE zastępów!"
  tags: []
"Ps84,2":
  text: "Moja dusza wzdycha i omdlewa z tęsknoty do przedsionków PANA; moje serce i ciało wołają radośnie do Boga żywego."
  tags: []
"Ps84,3":
  text: "Oto nawet wróbel znalazł sobie dom i jaskółka gniazdo, gdzie składa swe pisklęta, u twoich ołtarzy, PANIE zastępów, mój Królu i mój Boże!"
  tags: []
"Ps84,4":
  text: "Błogosławieni ci, którzy mieszkają w twoim domu, nieustannie będą cię chwalić. Sela."
  tags: []
"Ps84,5":
  text: "Błogosławiony człowiek, którego siła jest w tobie, w którego sercu są twoje drogi;"
  tags: []
"Ps84,6":
  text: "Ci, którzy przechodząc przez dolinę Baka, zmieniają ją w źródło, a deszcz okrywa ją błogosławieństwem."
  tags: []
"Ps84,7":
  text: "I idą z mocy w moc, i ukażą się przed Bogiem na Syjonie."
  tags: []
"Ps84,8":
  text: "O PANIE, Boże zastępów, wysłuchaj mojej modlitwy, nakłoń ucha, Boże Jakuba. Sela."
  tags: []
"Ps84,9":
  text: "Spójrz, Boże, nasza tarczo, i wejrzyj na oblicze twego pomazańca."
  tags: []
"Ps84,10":
  text: "Lepszy bowiem jest jeden dzień w twoich przedsionkach niż tysiąc gdzie indziej; wolę raczej stać w progu domu mego Boga, niż mieszkać w namiotach niegodziwców."
  tags: []
"Ps84,11":
  text: "PAN Bóg bowiem jest słońcem i tarczą, PAN obdarza łaską i chwałą, nie odmawia dobra tym, którzy postępują nienagannie."
  tags: []
"Ps84,12":
  text: "PANIE zastępów, błogosławiony człowiek, który ufa tobie."
  tags: []
