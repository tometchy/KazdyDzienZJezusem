"Ps76,1": "Bóg znany jest w Judzie, jego imię jest wielkie w Izraelu."
"Ps76,2": "W Salem jest jego przybytek, a jego mieszkanie na Syjonie."
"Ps76,3": "Tam połamał ogniste strzały łuku, tarczę i miecz i położył kres bitwie. Sela."
"Ps76,4": "Wspanialszy jesteś i dostojniejszy niż góry zdobyczy."
"Ps76,5": "Odważni stali się łupem, pogrążyli się we śnie, mężni nie znaleźli siły w swych rękach."
"Ps76,6": "Od twego gromienia, Boże Jakuba, mocno zasnęły wozy i konie."
"Ps76,7": "Ty, ty sam, jesteś straszliwy; i któż się ostoi przed twoim obliczem, gdy się rozgniewasz?"
"Ps76,8": "Z nieba dajesz słyszeć swój wyrok, ziemia się zlękła i zamilkła;"
"Ps76,9": "Gdy Bóg powstał na sąd, aby wybawić wszystkich pokornych na ziemi. Sela."
"Ps76,10": "Doprawdy nawet gniew człowieka będzie cię chwalić, a ty resztkę tego gniewu powstrzymasz."
"Ps76,11": "Składajcie śluby i wypełniajcie je wobec PANA, waszego Boga; wszyscy otaczający go, przynoście dary temu, który napawa strachem."
"Ps76,12": "On zabierze ducha książąt, on wzbudza strach u królów ziemi."
