"Ps76,1":
  text: "Bóg znany jest w Judzie, jego imię jest wielkie w Izraelu."
  tags: []
"Ps76,2":
  text: "W Salem jest jego przybytek, a jego mieszkanie na Syjonie."
  tags: []
"Ps76,3":
  text: "Tam połamał ogniste strzały łuku, tarczę i miecz i położył kres bitwie. Sela."
  tags: []
"Ps76,4":
  text: "Wspanialszy jesteś i dostojniejszy niż góry zdobyczy."
  tags: []
"Ps76,5":
  text: "Odważni stali się łupem, pogrążyli się we śnie, mężni nie znaleźli siły w swych rękach."
  tags: []
"Ps76,6":
  text: "Od twego gromienia, Boże Jakuba, mocno zasnęły wozy i konie."
  tags: []
"Ps76,7":
  text: "Ty, ty sam, jesteś straszliwy; i któż się ostoi przed twoim obliczem, gdy się rozgniewasz?"
  tags: []
"Ps76,8":
  text: "Z nieba dajesz słyszeć swój wyrok, ziemia się zlękła i zamilkła;"
  tags: []
"Ps76,9":
  text: "Gdy Bóg powstał na sąd, aby wybawić wszystkich pokornych na ziemi. Sela."
  tags: []
"Ps76,10":
  text: "Doprawdy nawet gniew człowieka będzie cię chwalić, a ty resztkę tego gniewu powstrzymasz."
  tags: []
"Ps76,11":
  text: "Składajcie śluby i wypełniajcie je wobec PANA, waszego Boga; wszyscy otaczający go, przynoście dary temu, który napawa strachem."
  tags: []
"Ps76,12":
  text: "On zabierze ducha książąt, on wzbudza strach u królów ziemi."
  tags: []
