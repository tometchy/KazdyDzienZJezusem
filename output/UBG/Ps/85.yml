"Ps85,1":
  text: "PANIE, okazałeś łaskę swej ziemi, przyprowadziłeś z niewoli Jakuba."
  tags: []
"Ps85,2":
  text: "Przebaczyłeś nieprawość twego ludu, zakryłeś wszystkie ich grzechy. Sela."
  tags: []
"Ps85,3":
  text: "Uśmierzyłeś całe swoje zagniewanie, odwróciłeś się od zapalczywości twojego gniewu."
  tags: []
"Ps85,4":
  text: "Odnów nas, Boże naszego zbawienia, i odwróć od nas swój gniew."
  tags: []
"Ps85,5":
  text: "Czy wiecznie będziesz się na nas gniewać? Czy rozciągniesz swój gniew na wszystkie pokolenia?"
  tags: []
"Ps85,6":
  text: "Czy nie ożywisz nas na nowo, aby twój lud rozradował się w tobie?"
  tags: []
"Ps85,7":
  text: "PANIE, okaż nam twoje miłosierdzie i daj nam swoje zbawienie."
  tags: []
"Ps85,8":
  text: "Posłucham, co będzie mówił Bóg, PAN; zaprawdę, ogłosi pokój swojemu ludowi i swoim świętym, aby tylko nie wracali do swojej głupoty."
  tags: []
"Ps85,9":
  text: "Doprawdy jego zbawienie jest blisko tych, którzy się go boją, aby jego chwała zamieszkała w naszej ziemi."
  tags: []
"Ps85,10":
  text: "Miłosierdzie i prawda spotkają się ze sobą, sprawiedliwość i pokój ucałują się."
  tags: []
"Ps85,11":
  text: "Prawda wyrośnie z ziemi, a sprawiedliwość wyjrzy z nieba."
  tags: []
"Ps85,12":
  text: "PAN też obdarzy tym, co dobre, a nasza ziemia wyda swój plon."
  tags: []
"Ps85,13":
  text: "Sprawiedliwość przed nim pójdzie i będzie wytyczać drogę jego krokom."
  tags: []
