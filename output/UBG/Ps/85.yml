"Ps85,1": "PANIE, okazałeś łaskę swej ziemi, przyprowadziłeś z niewoli Jakuba."
"Ps85,2": "Przebaczyłeś nieprawość twego ludu, zakryłeś wszystkie ich grzechy. Sela."
"Ps85,3": "Uśmierzyłeś całe swoje zagniewanie, odwróciłeś się od zapalczywości twojego gniewu."
"Ps85,4": "Odnów nas, Boże naszego zbawienia, i odwróć od nas swój gniew."
"Ps85,5": "Czy wiecznie będziesz się na nas gniewać? Czy rozciągniesz swój gniew na wszystkie pokolenia?"
"Ps85,6": "Czy nie ożywisz nas na nowo, aby twój lud rozradował się w tobie?"
"Ps85,7": "PANIE, okaż nam twoje miłosierdzie i daj nam swoje zbawienie."
"Ps85,8": "Posłucham, co będzie mówił Bóg, PAN; zaprawdę, ogłosi pokój swojemu ludowi i swoim świętym, aby tylko nie wracali do swojej głupoty."
"Ps85,9": "Doprawdy jego zbawienie jest blisko tych, którzy się go boją, aby jego chwała zamieszkała w naszej ziemi."
"Ps85,10": "Miłosierdzie i prawda spotkają się ze sobą, sprawiedliwość i pokój ucałują się."
"Ps85,11": "Prawda wyrośnie z ziemi, a sprawiedliwość wyjrzy z nieba."
"Ps85,12": "PAN też obdarzy tym, co dobre, a nasza ziemia wyda swój plon."
"Ps85,13": "Sprawiedliwość przed nim pójdzie i będzie wytyczać drogę jego krokom."
