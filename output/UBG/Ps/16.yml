"Ps16,1": "Strzeż mnie, o Boże, bo tobie ufam."
"Ps16,2": "Moja dusza mówi do PANA: Ty jesteś moim Panem, a moja dobroć nie przynosi ci żadnej korzyści;"
"Ps16,3": "Lecz świętym, którzy są na ziemi, i szlachetnym, w których całe moje upodobanie."
"Ps16,4": "Rozmnożą się boleści tych, którzy chodzą za obcymi bogami. Nie złożę im ofiar z krwi i nie wymówię ich imion swoimi ustami."
"Ps16,5": "PAN jest udziałem mego dziedzictwa i kielicha; ty strzeżesz mojego losu."
"Ps16,6": "Sznury miernicze wyznaczyły mi przyjemne miejsca i miłe jest moje dziedzictwo."
"Ps16,7": "Będę błogosławił PANA, który udzielił mi rady, bo nawet w nocy pouczają mnie moje nerki."
"Ps16,8": "Stawiam PANA zawsze przed oczami; skoro on jest po mojej prawicy, nie zachwieję się."
"Ps16,9": "Dlatego cieszy się moje serce i raduje się moja chwała, a moje ciało będzie spoczywać bezpiecznie."
"Ps16,10": "Nie zostawisz bowiem mojej duszy w piekle ani nie dopuścisz swemu Świętemu doznać zniszczenia."
"Ps16,11": "Dasz mi poznać drogę życia, pełnię radości przed twoim obliczem, rozkosze po twojej prawicy na wieki."
