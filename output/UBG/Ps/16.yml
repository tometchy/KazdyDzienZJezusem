"Ps16,1":
  text: "Strzeż mnie, o Boże, bo tobie ufam."
  tags: []
"Ps16,2":
  text: "Moja dusza mówi do PANA: Ty jesteś moim Panem, a moja dobroć nie przynosi ci żadnej korzyści;"
  tags: []
"Ps16,3":
  text: "Lecz świętym, którzy są na ziemi, i szlachetnym, w których całe moje upodobanie."
  tags: []
"Ps16,4":
  text: "Rozmnożą się boleści tych, którzy chodzą za obcymi bogami. Nie złożę im ofiar z krwi i nie wymówię ich imion swoimi ustami."
  tags: []
"Ps16,5":
  text: "PAN jest udziałem mego dziedzictwa i kielicha; ty strzeżesz mojego losu."
  tags: []
"Ps16,6":
  text: "Sznury miernicze wyznaczyły mi przyjemne miejsca i miłe jest moje dziedzictwo."
  tags: []
"Ps16,7":
  text: "Będę błogosławił PANA, który udzielił mi rady, bo nawet w nocy pouczają mnie moje nerki."
  tags: []
"Ps16,8":
  text: "Stawiam PANA zawsze przed oczami; skoro on jest po mojej prawicy, nie zachwieję się."
  tags: []
"Ps16,9":
  text: "Dlatego cieszy się moje serce i raduje się moja chwała, a moje ciało będzie spoczywać bezpiecznie."
  tags: []
"Ps16,10":
  text: "Nie zostawisz bowiem mojej duszy w piekle ani nie dopuścisz swemu Świętemu doznać zniszczenia."
  tags: []
"Ps16,11":
  text: "Dasz mi poznać drogę życia, pełnię radości przed twoim obliczem, rozkosze po twojej prawicy na wieki."
  tags: []
