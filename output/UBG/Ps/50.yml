"Ps50,1": "Bóg nad bogami, PAN, przemówił i wezwał ziemię od wschodu słońca aż do jego zachodu."
"Ps50,2": "Z Syjonu, doskonałego piękna, zajaśniał Bóg."
"Ps50,3": "Nasz Bóg przyjdzie i nie będzie milczał; ogień będzie trawił przed nim, a wokół niego powstanie potężna burza."
"Ps50,4": "Wezwie z góry niebiosa i ziemię, aby sądzić swój lud:"
"Ps50,5": "Zgromadźcie mi moich świętych, którzy zawarli ze mną przymierze przez ofiarę."
"Ps50,6": "Wtedy niebiosa ogłoszą jego sprawiedliwość, bo sam Bóg jest sędzią. Sela."
"Ps50,7": "Słuchaj, mój ludu, a będę mówił; słuchaj, Izraelu, a będę świadczył przeciw tobie: Ja jestem Bogiem, twoim Bogiem."
"Ps50,8": "Nie będę cię ganił za twoje ofiary ani za twoje całopalenia, które są zawsze przede mną."
"Ps50,9": "Nie przyjmę cielca z twojego domu ani kozłów z twoich zagród."
"Ps50,10": "Do mnie bowiem należy wszelkie zwierzę leśne i tysiące bydła na górach."
"Ps50,11": "Znam wszelkie ptactwo górskie i moje są zwierzęta polne."
"Ps50,12": "Gdybym był głodny, nie mówiłbym ci o tym, bo mój jest świat i wszystko, co go napełnia."
"Ps50,13": "Czyż będę jadł mięso wołów albo pił krew kozłów?"
"Ps50,14": "Ofiaruj Bogu dziękczynienie i spełnij swoje śluby wobec Najwyższego;"
"Ps50,15": "I wzywaj mnie w dniu utrapienia; wtedy cię wybawię, a ty mnie uwielbisz."
"Ps50,16": "Lecz do niegodziwego Bóg mówi: Po co ogłaszasz moje prawa i masz na ustach moje przymierze;"
"Ps50,17": "Skoro nienawidzisz karności i rzucasz za siebie moje słowa?"
"Ps50,18": "Gdy widzisz złodzieja, pochwalasz go, i zadajesz się z cudzołożnikami."
"Ps50,19": "Pozwalasz swym ustom źle mówić, a twój język knuje podstępy."
"Ps50,20": "Siedzisz i mówisz przeciwko twemu bratu, obmawiasz syna swej matki."
"Ps50,21": "To czyniłeś, a ja milczałem; sądziłeś, że jestem do ciebie podobny, ale będę cię napominał i postawię ci to przed oczy."
"Ps50,22": "Zrozumcie to teraz wy, którzy zapominacie o Bogu, bym was nie rozszarpał, a nie byłoby nikogo, kto by was ocalił."
"Ps50,23": "Kto mi ofiaruje chwałę, ten oddaje mi cześć; a temu, kto chodzi prostą drogą, ukażę Boże zbawienie."
