"Ps50,1":
  text: "Bóg nad bogami, PAN, przemówił i wezwał ziemię od wschodu słońca aż do jego zachodu."
  tags: []
"Ps50,2":
  text: "Z Syjonu, doskonałego piękna, zajaśniał Bóg."
  tags: []
"Ps50,3":
  text: "Nasz Bóg przyjdzie i nie będzie milczał; ogień będzie trawił przed nim, a wokół niego powstanie potężna burza."
  tags: []
"Ps50,4":
  text: "Wezwie z góry niebiosa i ziemię, aby sądzić swój lud:"
  tags: []
"Ps50,5":
  text: "Zgromadźcie mi moich świętych, którzy zawarli ze mną przymierze przez ofiarę."
  tags: []
"Ps50,6":
  text: "Wtedy niebiosa ogłoszą jego sprawiedliwość, bo sam Bóg jest sędzią. Sela."
  tags: []
"Ps50,7":
  text: "Słuchaj, mój ludu, a będę mówił; słuchaj, Izraelu, a będę świadczył przeciw tobie: Ja jestem Bogiem, twoim Bogiem."
  tags: []
"Ps50,8":
  text: "Nie będę cię ganił za twoje ofiary ani za twoje całopalenia, które są zawsze przede mną."
  tags: []
"Ps50,9":
  text: "Nie przyjmę cielca z twojego domu ani kozłów z twoich zagród."
  tags: []
"Ps50,10":
  text: "Do mnie bowiem należy wszelkie zwierzę leśne i tysiące bydła na górach."
  tags: []
"Ps50,11":
  text: "Znam wszelkie ptactwo górskie i moje są zwierzęta polne."
  tags: []
"Ps50,12":
  text: "Gdybym był głodny, nie mówiłbym ci o tym, bo mój jest świat i wszystko, co go napełnia."
  tags: []
"Ps50,13":
  text: "Czyż będę jadł mięso wołów albo pił krew kozłów?"
  tags: []
"Ps50,14":
  text: "Ofiaruj Bogu dziękczynienie i spełnij swoje śluby wobec Najwyższego;"
  tags: []
"Ps50,15":
  text: "I wzywaj mnie w dniu utrapienia; wtedy cię wybawię, a ty mnie uwielbisz."
  tags: []
"Ps50,16":
  text: "Lecz do niegodziwego Bóg mówi: Po co ogłaszasz moje prawa i masz na ustach moje przymierze;"
  tags: []
"Ps50,17":
  text: "Skoro nienawidzisz karności i rzucasz za siebie moje słowa?"
  tags: []
"Ps50,18":
  text: "Gdy widzisz złodzieja, pochwalasz go, i zadajesz się z cudzołożnikami."
  tags: []
"Ps50,19":
  text: "Pozwalasz swym ustom źle mówić, a twój język knuje podstępy."
  tags: []
"Ps50,20":
  text: "Siedzisz i mówisz przeciwko twemu bratu, obmawiasz syna swej matki."
  tags: []
"Ps50,21":
  text: "To czyniłeś, a ja milczałem; sądziłeś, że jestem do ciebie podobny, ale będę cię napominał i postawię ci to przed oczy."
  tags: []
"Ps50,22":
  text: "Zrozumcie to teraz wy, którzy zapominacie o Bogu, bym was nie rozszarpał, a nie byłoby nikogo, kto by was ocalił."
  tags: []
"Ps50,23":
  text: "Kto mi ofiaruje chwałę, ten oddaje mi cześć; a temu, kto chodzi prostą drogą, ukażę Boże zbawienie."
  tags: []
