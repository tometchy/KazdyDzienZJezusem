"Ps91,1": "Kto mieszka pod osłoną Najwyższego, w cieniu Wszechmocnego przebywać będzie."
"Ps91,2": "Będę mówił o PANU: Moja ucieczka i twierdza, mój Bóg, jemu będę ufał."
"Ps91,3": "Zaprawdę, on wybawi cię z sideł łowcy i od zgubnej zarazy."
"Ps91,4": "Okryje cię swymi piórami i pod jego skrzydłami będziesz bezpieczny; jego prawda będzie ci tarczą i puklerzem."
"Ps91,5": "Nie ulękniesz się strachu nocnego ani strzały lecącej za dnia;"
"Ps91,6": "Ani zarazy, która przychodzi w ciemności, ani dżumy, która pustoszy w południe."
"Ps91,7": "Tysiąc padnie u twego boku, a dziesięć tysięcy po twojej prawicy, lecz ciebie to nie dosięgnie."
"Ps91,8": "Tylko zobaczysz na własne oczy i ujrzysz zapłatę daną niegodziwym."
"Ps91,9": "Ponieważ PANA, moją ucieczkę i Najwyższego, uczyniłeś swoim mieszkaniem;"
"Ps91,10": "Nie spotka cię nic złego ani żadna plaga nie zbliży się do twego namiotu."
"Ps91,11": "Rozkaże bowiem o tobie swoim aniołom, aby cię strzegli na wszystkich twoich drogach."
"Ps91,12": "Na rękach będą cię nosić, byś przypadkiem nie uderzył swojej nogi o kamień."
"Ps91,13": "Będziesz stąpał po lwie i po żmii, lwiątko i smoka podepczesz."
"Ps91,14": "Wybawię go, bo mnie umiłował; wywyższę go, bo poznał moje imię."
"Ps91,15": "Będzie mnie wzywał, a ja go wysłucham; będę z nim w utrapieniu, wyrwę go i otoczę chwałą."
"Ps91,16": "Długimi dniami go nasycę i ukażę mu moje zbawienie."
