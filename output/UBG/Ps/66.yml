"Ps66,1":
  text: "Radośnie wykrzykujcie Bogu, wszystkie ziemie;"
  tags: []
"Ps66,2":
  text: "Wyśpiewujcie chwałę jego imienia, oddawajcie mu chwalebną cześć."
  tags: []
"Ps66,3":
  text: "Powiedzcie Bogu: Jak straszliwe są twe dzieła! Z powodu twojej wielkiej mocy poddadzą się twoi wrogowie."
  tags: []
"Ps66,4":
  text: "Cała ziemia odda ci pokłon i śpiewać ci będzie; śpiewać będzie twemu imieniu. Sela."
  tags: []
"Ps66,5":
  text: "Chodźcie, zobaczcie dzieła Boże, straszliwe są jego dzieła pośród synów ludzkich."
  tags: []
"Ps66,6":
  text: "Zamienił morze w suchą ziemię, pieszo przeszli przez rzekę; tam się nim weseliliśmy."
  tags: []
"Ps66,7":
  text: "Panuje w swej mocy na wieki, jego oczy patrzą na narody, buntownicy nie wywyższą się. Sela."
  tags: []
"Ps66,8":
  text: "Błogosławcie, narody, naszego Boga i rozgłaszajcie jego chwałę."
  tags: []
"Ps66,9":
  text: "Zachował przy życiu naszą duszę i nie dał się zachwiać naszej nodze."
  tags: []
"Ps66,10":
  text: "Doświadczyłeś nas bowiem, Boże, wypróbowałeś nas ogniem, jak srebro jest oczyszczone."
  tags: []
"Ps66,11":
  text: "Zaprowadziłeś nas w sidła, włożyłeś ucisk na nasze biodra."
  tags: []
"Ps66,12":
  text: "Pozwoliłeś ludziom deptać nam po głowach, przeszliśmy przez ogień i wodę, ale nas wyprowadziłeś na miejsce obfitości."
  tags: []
"Ps66,13":
  text: "Dlatego wejdę do twego domu z całopaleniem i wypełnię śluby;"
  tags: []
"Ps66,14":
  text: "Które wyraziły moje wargi i wypowiedziały moje usta w utrapieniu."
  tags: []
"Ps66,15":
  text: "Będę ci składał w ofierze całopalenia z tłustych zwierząt wraz z wonnością baranów, ofiaruję ci woły i kozły. Sela."
  tags: []
"Ps66,16":
  text: "Chodźcie, słuchajcie, wszyscy, którzy się boicie Boga, a opowiem, co uczynił dla mojej duszy."
  tags: []
"Ps66,17":
  text: "Do niego wołałem moimi ustami i wychwalałem go moim językiem."
  tags: []
"Ps66,18":
  text: "Gdybym zważał na nieprawość w swoim sercu, Pan by mnie nie wysłuchał."
  tags: []
"Ps66,19":
  text: "A jednak Bóg wysłuchał, przychylił się do głosu mojej modlitwy."
  tags: []
"Ps66,20":
  text: "Błogosławiony Bóg, który nie odrzucił mojej modlitwy i nie odebrał mi swego miłosierdzia."
  tags: []
