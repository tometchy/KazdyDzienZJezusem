"Ps66,1": "Radośnie wykrzykujcie Bogu, wszystkie ziemie;"
"Ps66,2": "Wyśpiewujcie chwałę jego imienia, oddawajcie mu chwalebną cześć."
"Ps66,3": "Powiedzcie Bogu: Jak straszliwe są twe dzieła! Z powodu twojej wielkiej mocy poddadzą się twoi wrogowie."
"Ps66,4": "Cała ziemia odda ci pokłon i śpiewać ci będzie; śpiewać będzie twemu imieniu. Sela."
"Ps66,5": "Chodźcie, zobaczcie dzieła Boże, straszliwe są jego dzieła pośród synów ludzkich."
"Ps66,6": "Zamienił morze w suchą ziemię, pieszo przeszli przez rzekę; tam się nim weseliliśmy."
"Ps66,7": "Panuje w swej mocy na wieki, jego oczy patrzą na narody, buntownicy nie wywyższą się. Sela."
"Ps66,8": "Błogosławcie, narody, naszego Boga i rozgłaszajcie jego chwałę."
"Ps66,9": "Zachował przy życiu naszą duszę i nie dał się zachwiać naszej nodze."
"Ps66,10": "Doświadczyłeś nas bowiem, Boże, wypróbowałeś nas ogniem, jak srebro jest oczyszczone."
"Ps66,11": "Zaprowadziłeś nas w sidła, włożyłeś ucisk na nasze biodra."
"Ps66,12": "Pozwoliłeś ludziom deptać nam po głowach, przeszliśmy przez ogień i wodę, ale nas wyprowadziłeś na miejsce obfitości."
"Ps66,13": "Dlatego wejdę do twego domu z całopaleniem i wypełnię śluby;"
"Ps66,14": "Które wyraziły moje wargi i wypowiedziały moje usta w utrapieniu."
"Ps66,15": "Będę ci składał w ofierze całopalenia z tłustych zwierząt wraz z wonnością baranów, ofiaruję ci woły i kozły. Sela."
"Ps66,16": "Chodźcie, słuchajcie, wszyscy, którzy się boicie Boga, a opowiem, co uczynił dla mojej duszy."
"Ps66,17": "Do niego wołałem moimi ustami i wychwalałem go moim językiem."
"Ps66,18": "Gdybym zważał na nieprawość w swoim sercu, Pan by mnie nie wysłuchał."
"Ps66,19": "A jednak Bóg wysłuchał, przychylił się do głosu mojej modlitwy."
"Ps66,20": "Błogosławiony Bóg, który nie odrzucił mojej modlitwy i nie odebrał mi swego miłosierdzia."
