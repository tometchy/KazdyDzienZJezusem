"Ps45,1":
  text: "Wezbrało moje serce dobrym słowem; dzieła, które wypowiadam, dotyczą króla; mój język będzie jak pióro biegłego pisarza."
  tags: []
"Ps45,2":
  text: "Ty jesteś najpiękniejszym z synów ludzkich; wdzięk rozlał się na twoich wargach, dlatego Bóg pobłogosławił cię na wieki."
  tags: []
"Ps45,3":
  text: "Przypasz do biodra swój miecz, mocarzu, w swej chwale i majestacie."
  tags: []
"Ps45,4":
  text: "A w swym dostojeństwie wyrusz szczęśliwie ze słowem prawdy, łagodności i sprawiedliwości, a twoja prawica dokona strasznych rzeczy."
  tags: []
"Ps45,5":
  text: "Twoje ostre strzały, od których upadają narody pod twoje stopy, przenikają serce wrogów króla."
  tags: []
"Ps45,6":
  text: "Twój tron, o Boże, na wieki wieków, berłem sprawiedliwości jest berło twego królestwa."
  tags: []
"Ps45,7":
  text: "Miłujesz sprawiedliwość, a nienawidzisz nieprawości, dlatego namaścił cię, o Boże, twój Bóg olejkiem radości bardziej niż twoich towarzyszy."
  tags: []
"Ps45,8":
  text: "Wszystkie twoje szaty pachną mirrą, aloesem i kasją, gdy wychodzisz z pałaców z kości słoniowej, z których cię rozweselają."
  tags: []
"Ps45,9":
  text: "Córki królewskie są wśród twoich czcigodnych kobiet, królowa w złocie z Ofiru stoi po twojej prawicy."
  tags: []
"Ps45,10":
  text: "Posłuchaj, córko, spójrz i nakłoń ucha, zapomnij o swoim narodzie i o domu swojego ojca;"
  tags: []
"Ps45,11":
  text: "A król zapragnie twojego piękna, bo on jest twoim Panem; oddaj mu pokłon."
  tags: []
"Ps45,12":
  text: "Także córka Tyru przyjdzie z darami, najbogatsi z narodów będą zabiegać o twą przychylność."
  tags: []
"Ps45,13":
  text: "Córka królewska jest pełna chwały w swej komnacie, a jej szaty złotem tkane."
  tags: []
"Ps45,14":
  text: "W szacie haftowanej będą ją wieść do króla, za nią dziewice, jej towarzyszki, przyprowadzą do ciebie."
  tags: []
"Ps45,15":
  text: "Wiodą je z weselem i z radością i wejdą do królewskiego pałacu."
  tags: []
"Ps45,16":
  text: "Miejsce twoich ojców zajmą twoi synowie, których ustanowisz książętami po całej ziemi."
  tags: []
"Ps45,17":
  text: "Upamiętnię twoje imię po wszystkie pokolenia; dlatego narody będą cię wysławiać na wieki wieków."
  tags: []
