"Ps45,1": "Wezbrało moje serce dobrym słowem; dzieła, które wypowiadam, dotyczą króla; mój język będzie jak pióro biegłego pisarza."
"Ps45,2": "Ty jesteś najpiękniejszym z synów ludzkich; wdzięk rozlał się na twoich wargach, dlatego Bóg pobłogosławił cię na wieki."
"Ps45,3": "Przypasz do biodra swój miecz, mocarzu, w swej chwale i majestacie."
"Ps45,4": "A w swym dostojeństwie wyrusz szczęśliwie ze słowem prawdy, łagodności i sprawiedliwości, a twoja prawica dokona strasznych rzeczy."
"Ps45,5": "Twoje ostre strzały, od których upadają narody pod twoje stopy, przenikają serce wrogów króla."
"Ps45,6": "Twój tron, o Boże, na wieki wieków, berłem sprawiedliwości jest berło twego królestwa."
"Ps45,7": "Miłujesz sprawiedliwość, a nienawidzisz nieprawości, dlatego namaścił cię, o Boże, twój Bóg olejkiem radości bardziej niż twoich towarzyszy."
"Ps45,8": "Wszystkie twoje szaty pachną mirrą, aloesem i kasją, gdy wychodzisz z pałaców z kości słoniowej, z których cię rozweselają."
"Ps45,9": "Córki królewskie są wśród twoich czcigodnych kobiet, królowa w złocie z Ofiru stoi po twojej prawicy."
"Ps45,10": "Posłuchaj, córko, spójrz i nakłoń ucha, zapomnij o swoim narodzie i o domu swojego ojca;"
"Ps45,11": "A król zapragnie twojego piękna, bo on jest twoim Panem; oddaj mu pokłon."
"Ps45,12": "Także córka Tyru przyjdzie z darami, najbogatsi z narodów będą zabiegać o twą przychylność."
"Ps45,13": "Córka królewska jest pełna chwały w swej komnacie, a jej szaty złotem tkane."
"Ps45,14": "W szacie haftowanej będą ją wieść do króla, za nią dziewice, jej towarzyszki, przyprowadzą do ciebie."
"Ps45,15": "Wiodą je z weselem i z radością i wejdą do królewskiego pałacu."
"Ps45,16": "Miejsce twoich ojców zajmą twoi synowie, których ustanowisz książętami po całej ziemi."
"Ps45,17": "Upamiętnię twoje imię po wszystkie pokolenia; dlatego narody będą cię wysławiać na wieki wieków."
