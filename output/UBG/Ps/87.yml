"Ps87,1":
  text: "Jego fundament jest na świętych górach."
  tags: []
"Ps87,2":
  text: "PAN miłuje bramy Syjonu bardziej niż wszystkie przybytki Jakuba."
  tags: []
"Ps87,3":
  text: "Chwalebne rzeczy mówi się o tobie, o miasto Boże. Sela."
  tags: []
"Ps87,4":
  text: "Wspomnę Rahab i Babilon wśród tych, którzy mnie znają; oto Filistea i Tyr, i Etiopia: Ten się tam urodził."
  tags: []
"Ps87,5":
  text: "O Syjonie też będą mówić: Ten i tamten urodził się w nim; a sam Najwyższy go utwierdzi."
  tags: []
"Ps87,6":
  text: "PAN wyliczy, spisując narody: Ten się tam urodził. Sela."
  tags: []
"Ps87,7":
  text: "I pląsając, będą śpiewać: W tobie są wszystkie me źródła."
  tags: []
