"Ps87,1": "Jego fundament jest na świętych górach."
"Ps87,2": "PAN miłuje bramy Syjonu bardziej niż wszystkie przybytki Jakuba."
"Ps87,3": "Chwalebne rzeczy mówi się o tobie, o miasto Boże. Sela."
"Ps87,4": "Wspomnę Rahab i Babilon wśród tych, którzy mnie znają; oto Filistea i Tyr, i Etiopia: Ten się tam urodził."
"Ps87,5": "O Syjonie też będą mówić: Ten i tamten urodził się w nim; a sam Najwyższy go utwierdzi."
"Ps87,6": "PAN wyliczy, spisując narody: Ten się tam urodził. Sela."
"Ps87,7": "I pląsając, będą śpiewać: W tobie są wszystkie me źródła."
