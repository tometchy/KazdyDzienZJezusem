"Ps77,1":
  text: "Wzniosłem swój głos do Boga i zawołałem; wzniosłem swój głos do Boga i mnie wysłuchał."
  tags: []
"Ps77,2":
  text: "W dniu mego utrapienia szukałem Pana, moje ręce wyciągałem w nocy nieustannie, moja dusza nie dała się pocieszyć."
  tags: []
"Ps77,3":
  text: "Gdy wspominałem Boga, byłem strwożony; rozmyślałem, a mój duch był ogarnięty utrapieniem. Sela."
  tags: []
"Ps77,4":
  text: "Ty zatrzymujesz otwarte powieki mych oczu, jestem tak zaniepokojony, że nie potrafię mówić."
  tags: []
"Ps77,5":
  text: "Rozpamiętuję dni przeszłe i dawne lata."
  tags: []
"Ps77,6":
  text: "Przypominam sobie mój śpiew; nocą rozmyślam w sercu i mój duch docieka:"
  tags: []
"Ps77,7":
  text: "Czy Pan odrzuci na wieki i już więcej nie okaże łaski?"
  tags: []
"Ps77,8":
  text: "Czy jego miłosierdzie ustało na zawsze i jego obietnica nigdy się nie spełni?"
  tags: []
"Ps77,9":
  text: "Czy Bóg zapomniał o litości? Czy w gniewie stłumił swoją łaskawość? Sela."
  tags: []
"Ps77,10":
  text: "I powiedziałem: To jest moja niemoc; jednak będę wspominał lata prawicy Najwyższego."
  tags: []
"Ps77,11":
  text: "Będę wspominał dzieła PANA, będę wspominał twoje dawne cuda."
  tags: []
"Ps77,12":
  text: "Będę rozmyślał o wszystkich twoich dziełach i o twoich czynach będę mówił."
  tags: []
"Ps77,13":
  text: "Boże, święta jest twoja droga; który bóg jest tak wielki, jak nasz Bóg?"
  tags: []
"Ps77,14":
  text: "Ty jesteś Bogiem, który czyni cuda; dałeś poznać narodom swoją moc."
  tags: []
"Ps77,15":
  text: "Odkupiłeś swoim ramieniem twój lud, synów Jakuba i Józefa. Sela."
  tags: []
"Ps77,16":
  text: "Widziały cię wody, o Boże, widziały cię wody i ulękły się, poruszyły się głębiny."
  tags: []
"Ps77,17":
  text: "Chmury spłynęły wodą, niebiosa wydały gromy i poleciały twoje strzały."
  tags: []
"Ps77,18":
  text: "Huk twego grzmotu wśród obłoków, błyskawice oświetliły świat, ziemia poruszyła się i zatrzęsła."
  tags: []
"Ps77,19":
  text: "Twoja droga wiodła przez morze, twoje ścieżki przez wielkie wody i nie było znać twoich śladów."
  tags: []
"Ps77,20":
  text: "Prowadziłeś swój lud jak stado owiec ręką Mojżesza i Aarona."
  tags: []
