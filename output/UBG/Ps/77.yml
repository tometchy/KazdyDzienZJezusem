"Ps77,1": "Wzniosłem swój głos do Boga i zawołałem; wzniosłem swój głos do Boga i mnie wysłuchał."
"Ps77,2": "W dniu mego utrapienia szukałem Pana, moje ręce wyciągałem w nocy nieustannie, moja dusza nie dała się pocieszyć."
"Ps77,3": "Gdy wspominałem Boga, byłem strwożony; rozmyślałem, a mój duch był ogarnięty utrapieniem. Sela."
"Ps77,4": "Ty zatrzymujesz otwarte powieki mych oczu, jestem tak zaniepokojony, że nie potrafię mówić."
"Ps77,5": "Rozpamiętuję dni przeszłe i dawne lata."
"Ps77,6": "Przypominam sobie mój śpiew; nocą rozmyślam w sercu i mój duch docieka:"
"Ps77,7": "Czy Pan odrzuci na wieki i już więcej nie okaże łaski?"
"Ps77,8": "Czy jego miłosierdzie ustało na zawsze i jego obietnica nigdy się nie spełni?"
"Ps77,9": "Czy Bóg zapomniał o litości? Czy w gniewie stłumił swoją łaskawość? Sela."
"Ps77,10": "I powiedziałem: To jest moja niemoc; jednak będę wspominał lata prawicy Najwyższego."
"Ps77,11": "Będę wspominał dzieła PANA, będę wspominał twoje dawne cuda."
"Ps77,12": "Będę rozmyślał o wszystkich twoich dziełach i o twoich czynach będę mówił."
"Ps77,13": "Boże, święta jest twoja droga; który bóg jest tak wielki, jak nasz Bóg?"
"Ps77,14": "Ty jesteś Bogiem, który czyni cuda; dałeś poznać narodom swoją moc."
"Ps77,15": "Odkupiłeś swoim ramieniem twój lud, synów Jakuba i Józefa. Sela."
"Ps77,16": "Widziały cię wody, o Boże, widziały cię wody i ulękły się, poruszyły się głębiny."
"Ps77,17": "Chmury spłynęły wodą, niebiosa wydały gromy i poleciały twoje strzały."
"Ps77,18": "Huk twego grzmotu wśród obłoków, błyskawice oświetliły świat, ziemia poruszyła się i zatrzęsła."
"Ps77,19": "Twoja droga wiodła przez morze, twoje ścieżki przez wielkie wody i nie było znać twoich śladów."
"Ps77,20": "Prowadziłeś swój lud jak stado owiec ręką Mojżesza i Aarona."
