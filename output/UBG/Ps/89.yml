"Ps89,1":
  text: "Będę śpiewać o miłosierdziu PANA na wieki, swymi ustami będę głosił twoją wierność przez wszystkie pokolenia."
  tags: []
"Ps89,2":
  text: "Powiedziałem bowiem: Miłosierdzie będzie budowane na wieki, na niebiosach utwierdziłeś swoją wierność."
  tags: []
"Ps89,3":
  text: "Zawarłem przymierze z moim wybrańcem; przysiągłem Dawidowi, swemu słudze;"
  tags: []
"Ps89,4":
  text: "Na wieki utwierdzę twoje potomstwo i zbuduję twój tron na wszystkie pokolenia. Sela."
  tags: []
"Ps89,5":
  text: "PANIE, niebiosa wysławiają twoje cuda i twoją wierność w zgromadzeniu świętych."
  tags: []
"Ps89,6":
  text: "Któż bowiem na niebie może się równać z PANEM? Kto pośród synów mocarzy jest podobny do PANA?"
  tags: []
"Ps89,7":
  text: "Bóg jest straszliwy w zgromadzeniu świętych i budzi grozę wśród wszystkich, którzy są wokół niego."
  tags: []
"Ps89,8":
  text: "PANIE, Boże zastępów, któż jest jak ty, PAN mocny? Twoja wierność bowiem cię otacza."
  tags: []
"Ps89,9":
  text: "Ty panujesz nad wzburzonym morzem; gdy się podnoszą jego fale, ty je poskramiasz."
  tags: []
"Ps89,10":
  text: "Ty zmiażdżyłeś Rahaba jak rannego, mocą twego ramienia rozproszyłeś swoich wrogów."
  tags: []
"Ps89,11":
  text: "Twoje są niebiosa, twoja też ziemia; ty ugruntowałeś świat i wszystko, co go napełnia."
  tags: []
"Ps89,12":
  text: "Ty stworzyłeś północ i południe; Tabor i Hermon śpiewają o twoim imieniu."
  tags: []
"Ps89,13":
  text: "Twoje ramię jest mocne, twoja ręka potężna, a twoja prawica wzniesiona."
  tags: []
"Ps89,14":
  text: "Sprawiedliwość i sąd są podstawą twego tronu, miłosierdzie i prawda idą przed twoim obliczem."
  tags: []
"Ps89,15":
  text: "Błogosławiony lud, który zna okrzyk radości; będzie chodzić w świetle twego oblicza, PANIE."
  tags: []
"Ps89,16":
  text: "W twoim imieniu będą się weselić każdego dnia, a w twojej sprawiedliwości będą wywyższeni."
  tags: []
"Ps89,17":
  text: "Ty bowiem jesteś chwałą ich mocy i z twojej woli nasz róg będzie wzniesiony."
  tags: []
"Ps89,18":
  text: "Bo PAN jest naszą tarczą, a Święty Izraela naszym królem."
  tags: []
"Ps89,19":
  text: "Powiedziałeś wtedy w widzeniu do twego świętego: Udzieliłem pomocy mocarzowi, wywyższyłem wybranego z ludu."
  tags: []
"Ps89,20":
  text: "Znalazłem Dawida, mego sługę, namaściłem go swoim świętym olejem."
  tags: []
"Ps89,21":
  text: "Moja ręka będzie przy nim i wzmocni go moje ramię."
  tags: []
"Ps89,22":
  text: "Nie będzie uciskany przez wroga, a syn nieprawości go nie pognębi."
  tags: []
"Ps89,23":
  text: "Zetrę na jego oczach jego przeciwników, a tych, którzy go nienawidzą, powalę."
  tags: []
"Ps89,24":
  text: "Ponadto moja prawda i miłosierdzie będą z nim, a w moim imieniu jego róg będzie wzniesiony."
  tags: []
"Ps89,25":
  text: "I położę na morzu jego rękę i na rzekach jego prawicę."
  tags: []
"Ps89,26":
  text: "On zawoła: Ty jesteś moim ojcem, moim Bogiem i skałą mego zbawienia."
  tags: []
"Ps89,27":
  text: "Ja też uczynię go pierworodnym i najwyższym wśród królów ziemi."
  tags: []
"Ps89,28":
  text: "Na wieki zachowam dla niego swoje miłosierdzie, a moje przymierze z nim będzie trwałe."
  tags: []
"Ps89,29":
  text: "Jego potomstwo utrwalę na wieki, a jego tron – jak dni niebios."
  tags: []
"Ps89,30":
  text: "Ale jeśli jego synowie porzucą moje prawo i nie będą postępowali według moich nakazów;"
  tags: []
"Ps89,31":
  text: "Jeśli moje ustawy znieważą, a moich przykazań nie będą przestrzegać;"
  tags: []
"Ps89,32":
  text: "Wtedy ukarzę rózgą ich przestępstwo, a ich nieprawość biczami."
  tags: []
"Ps89,33":
  text: "Ale nie odbiorę mu mojego miłosierdzia ani nie zawiodę w mojej wierności."
  tags: []
"Ps89,34":
  text: "Nie złamię mego przymierza ani nie zmienię tego, co wyszło z moich ust."
  tags: []
"Ps89,35":
  text: "Raz przysiągłem na moją świętość, że nie skłamię Dawidowi."
  tags: []
"Ps89,36":
  text: "Jego potomstwo będzie trwać na wieki, a jego tron jak słońce przede mną;"
  tags: []
"Ps89,37":
  text: "Jak księżyc będzie utwierdzone na wieki i jak wierny świadek na niebie. Sela."
  tags: []
"Ps89,38":
  text: "A jednak odrzuciłeś go i wzgardziłeś nim, rozgniewałeś się na twego pomazańca."
  tags: []
"Ps89,39":
  text: "Zerwałeś przymierze z twoim sługą, strąciłeś na ziemię jego koronę."
  tags: []
"Ps89,40":
  text: "Zburzyłeś wszystkie jego płoty i rozwaliłeś jego baszty."
  tags: []
"Ps89,41":
  text: "Grabią go wszyscy, którzy przechodzą drogą; stał się pośmiewiskiem dla swoich sąsiadów."
  tags: []
"Ps89,42":
  text: "Podniosłeś prawicę jego przeciwników, sprawiłeś radość wszystkim jego wrogom."
  tags: []
"Ps89,43":
  text: "Stępiłeś też ostrze jego miecza i nie wsparłeś go w walce."
  tags: []
"Ps89,44":
  text: "Położyłeś koniec jego chwale, a jego tron obaliłeś na ziemię."
  tags: []
"Ps89,45":
  text: "Skróciłeś dni jego młodości, okryłeś go hańbą. Sela."
  tags: []
"Ps89,46":
  text: "Jak długo, PANIE? Czy wiecznie będziesz się ukrywał? Czy twoja zapalczywość będzie płonąć jak ogień?"
  tags: []
"Ps89,47":
  text: "Pamiętaj, jak krótkie jest moje życie; czy na próżno stworzyłeś wszystkich synów ludzkich?"
  tags: []
"Ps89,48":
  text: "Któż z ludzi może żyć i nie ujrzeć śmierci? Któż wyrwie swą duszę z mocy grobu? Sela."
  tags: []
"Ps89,49":
  text: "Gdzie są, o Panie, twoje dawne łaski, które przysiągłeś Dawidowi w swej prawdzie?"
  tags: []
"Ps89,50":
  text: "Pamiętaj, Panie, o zniewadze twoich sług; o tym, że noszę w swym zanadrzu wzgardę wszystkich możnych narodów;"
  tags: []
"Ps89,51":
  text: "Którą twoi wrogowie znieważają, PANIE, którą znieważają ścieżki twego pomazańca."
  tags: []
"Ps89,52":
  text: "Błogosławiony niech będzie PAN na wieki. Amen, amen."
  tags: []
