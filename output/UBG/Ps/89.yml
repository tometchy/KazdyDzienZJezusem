"Ps89,1": "Będę śpiewać o miłosierdziu PANA na wieki, swymi ustami będę głosił twoją wierność przez wszystkie pokolenia."
"Ps89,2": "Powiedziałem bowiem: Miłosierdzie będzie budowane na wieki, na niebiosach utwierdziłeś swoją wierność."
"Ps89,3": "Zawarłem przymierze z moim wybrańcem; przysiągłem Dawidowi, swemu słudze;"
"Ps89,4": "Na wieki utwierdzę twoje potomstwo i zbuduję twój tron na wszystkie pokolenia. Sela."
"Ps89,5": "PANIE, niebiosa wysławiają twoje cuda i twoją wierność w zgromadzeniu świętych."
"Ps89,6": "Któż bowiem na niebie może się równać z PANEM? Kto pośród synów mocarzy jest podobny do PANA?"
"Ps89,7": "Bóg jest straszliwy w zgromadzeniu świętych i budzi grozę wśród wszystkich, którzy są wokół niego."
"Ps89,8": "PANIE, Boże zastępów, któż jest jak ty, PAN mocny? Twoja wierność bowiem cię otacza."
"Ps89,9": "Ty panujesz nad wzburzonym morzem; gdy się podnoszą jego fale, ty je poskramiasz."
"Ps89,10": "Ty zmiażdżyłeś Rahaba jak rannego, mocą twego ramienia rozproszyłeś swoich wrogów."
"Ps89,11": "Twoje są niebiosa, twoja też ziemia; ty ugruntowałeś świat i wszystko, co go napełnia."
"Ps89,12": "Ty stworzyłeś północ i południe; Tabor i Hermon śpiewają o twoim imieniu."
"Ps89,13": "Twoje ramię jest mocne, twoja ręka potężna, a twoja prawica wzniesiona."
"Ps89,14": "Sprawiedliwość i sąd są podstawą twego tronu, miłosierdzie i prawda idą przed twoim obliczem."
"Ps89,15": "Błogosławiony lud, który zna okrzyk radości; będzie chodzić w świetle twego oblicza, PANIE."
"Ps89,16": "W twoim imieniu będą się weselić każdego dnia, a w twojej sprawiedliwości będą wywyższeni."
"Ps89,17": "Ty bowiem jesteś chwałą ich mocy i z twojej woli nasz róg będzie wzniesiony."
"Ps89,18": "Bo PAN jest naszą tarczą, a Święty Izraela naszym królem."
"Ps89,19": "Powiedziałeś wtedy w widzeniu do twego świętego: Udzieliłem pomocy mocarzowi, wywyższyłem wybranego z ludu."
"Ps89,20": "Znalazłem Dawida, mego sługę, namaściłem go swoim świętym olejem."
"Ps89,21": "Moja ręka będzie przy nim i wzmocni go moje ramię."
"Ps89,22": "Nie będzie uciskany przez wroga, a syn nieprawości go nie pognębi."
"Ps89,23": "Zetrę na jego oczach jego przeciwników, a tych, którzy go nienawidzą, powalę."
"Ps89,24": "Ponadto moja prawda i miłosierdzie będą z nim, a w moim imieniu jego róg będzie wzniesiony."
"Ps89,25": "I położę na morzu jego rękę i na rzekach jego prawicę."
"Ps89,26": "On zawoła: Ty jesteś moim ojcem, moim Bogiem i skałą mego zbawienia."
"Ps89,27": "Ja też uczynię go pierworodnym i najwyższym wśród królów ziemi."
"Ps89,28": "Na wieki zachowam dla niego swoje miłosierdzie, a moje przymierze z nim będzie trwałe."
"Ps89,29": "Jego potomstwo utrwalę na wieki, a jego tron – jak dni niebios."
"Ps89,30": "Ale jeśli jego synowie porzucą moje prawo i nie będą postępowali według moich nakazów;"
"Ps89,31": "Jeśli moje ustawy znieważą, a moich przykazań nie będą przestrzegać;"
"Ps89,32": "Wtedy ukarzę rózgą ich przestępstwo, a ich nieprawość biczami."
"Ps89,33": "Ale nie odbiorę mu mojego miłosierdzia ani nie zawiodę w mojej wierności."
"Ps89,34": "Nie złamię mego przymierza ani nie zmienię tego, co wyszło z moich ust."
"Ps89,35": "Raz przysiągłem na moją świętość, że nie skłamię Dawidowi."
"Ps89,36": "Jego potomstwo będzie trwać na wieki, a jego tron jak słońce przede mną;"
"Ps89,37": "Jak księżyc będzie utwierdzone na wieki i jak wierny świadek na niebie. Sela."
"Ps89,38": "A jednak odrzuciłeś go i wzgardziłeś nim, rozgniewałeś się na twego pomazańca."
"Ps89,39": "Zerwałeś przymierze z twoim sługą, strąciłeś na ziemię jego koronę."
"Ps89,40": "Zburzyłeś wszystkie jego płoty i rozwaliłeś jego baszty."
"Ps89,41": "Grabią go wszyscy, którzy przechodzą drogą; stał się pośmiewiskiem dla swoich sąsiadów."
"Ps89,42": "Podniosłeś prawicę jego przeciwników, sprawiłeś radość wszystkim jego wrogom."
"Ps89,43": "Stępiłeś też ostrze jego miecza i nie wsparłeś go w walce."
"Ps89,44": "Położyłeś koniec jego chwale, a jego tron obaliłeś na ziemię."
"Ps89,45": "Skróciłeś dni jego młodości, okryłeś go hańbą. Sela."
"Ps89,46": "Jak długo, PANIE? Czy wiecznie będziesz się ukrywał? Czy twoja zapalczywość będzie płonąć jak ogień?"
"Ps89,47": "Pamiętaj, jak krótkie jest moje życie; czy na próżno stworzyłeś wszystkich synów ludzkich?"
"Ps89,48": "Któż z ludzi może żyć i nie ujrzeć śmierci? Któż wyrwie swą duszę z mocy grobu? Sela."
"Ps89,49": "Gdzie są, o Panie, twoje dawne łaski, które przysiągłeś Dawidowi w swej prawdzie?"
"Ps89,50": "Pamiętaj, Panie, o zniewadze twoich sług; o tym, że noszę w swym zanadrzu wzgardę wszystkich możnych narodów;"
"Ps89,51": "Którą twoi wrogowie znieważają, PANIE, którą znieważają ścieżki twego pomazańca."
"Ps89,52": "Błogosławiony niech będzie PAN na wieki. Amen, amen."
