"Ps13,1":
  text: "Jak długo, PANIE? Zapomnisz o mnie na wieki? Jak długo będziesz ukrywał przede mną swoje oblicze?"
  tags: []
"Ps13,2":
  text: "Jak długo będę szukał rady w swojej duszy i codziennie trapił się w sercu? Jak długo mój wróg będzie się nade mnie wynosił?"
  tags: []
"Ps13,3":
  text: "Spójrz i wysłuchaj mnie, PANIE, mój Boże! Oświeć moje oczy, bym nie zasnął w śmierci;"
  tags: []
"Ps13,4":
  text: "By nie powiedział mój wróg: Pokonałem go! Niech się nie cieszą moi nieprzyjaciele, gdy się zachwieję."
  tags: []
"Ps13,5":
  text: "Lecz ja zaufałem twemu miłosierdziu; moje serce rozraduje się twoim zbawieniem."
  tags: []
"Ps13,6":
  text: "Będę śpiewał PANU, bo obdarzył mnie dobrem."
  tags: []
