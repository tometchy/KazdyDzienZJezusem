"Ps13,1": "Jak długo, PANIE? Zapomnisz o mnie na wieki? Jak długo będziesz ukrywał przede mną swoje oblicze?"
"Ps13,2": "Jak długo będę szukał rady w swojej duszy i codziennie trapił się w sercu? Jak długo mój wróg będzie się nade mnie wynosił?"
"Ps13,3": "Spójrz i wysłuchaj mnie, PANIE, mój Boże! Oświeć moje oczy, bym nie zasnął w śmierci;"
"Ps13,4": "By nie powiedział mój wróg: Pokonałem go! Niech się nie cieszą moi nieprzyjaciele, gdy się zachwieję."
"Ps13,5": "Lecz ja zaufałem twemu miłosierdziu; moje serce rozraduje się twoim zbawieniem."
"Ps13,6": "Będę śpiewał PANU, bo obdarzył mnie dobrem."
