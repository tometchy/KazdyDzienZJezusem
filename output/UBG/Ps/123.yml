"Ps123,1":
  text: "Do ciebie podnoszę moje oczy, który mieszkasz w niebie."
  tags: []
"Ps123,2":
  text: "Oto jak oczy sług są zwrócone na ręce ich panów i jak oczy służącej na ręce jej pani, tak nasze oczy na PANA, Boga naszego, aż się zmiłuje nad nami."
  tags: []
"Ps123,3":
  text: "Zmiłuj się nad nami, PANIE; zmiłuj się nad nami, bo jesteśmy nad miarę nasyceni wzgardą."
  tags: []
"Ps123,4":
  text: "Nasza dusza jest nad miarę nasycona szyderstwem bezbożnych i wzgardą pysznych."
  tags: []
