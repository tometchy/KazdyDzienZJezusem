"Ps123,1": "Do ciebie podnoszę moje oczy, który mieszkasz w niebie."
"Ps123,2": "Oto jak oczy sług są zwrócone na ręce ich panów i jak oczy służącej na ręce jej pani, tak nasze oczy na PANA, Boga naszego, aż się zmiłuje nad nami."
"Ps123,3": "Zmiłuj się nad nami, PANIE; zmiłuj się nad nami, bo jesteśmy nad miarę nasyceni wzgardą."
"Ps123,4": "Nasza dusza jest nad miarę nasycona szyderstwem bezbożnych i wzgardą pysznych."
