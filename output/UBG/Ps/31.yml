"Ps31,1":
  text: "W tobie, PANIE, pokładam nadzieję, niech nigdy nie doznam wstydu, wyzwól mnie w swojej sprawiedliwości."
  tags: []
"Ps31,2":
  text: "Nakłoń ku mnie swego ucha, czym prędzej mnie ocal; bądź mi mocną skałą, domem obronnym, abyś mnie wybawił."
  tags: []
"Ps31,3":
  text: "Ty bowiem jesteś moją skałą i twierdzą; dlatego przez wzgląd na twoje imię kieruj mnie i prowadź."
  tags: []
"Ps31,4":
  text: "Wyciągnij mnie z sieci, którą zastawili na mnie, bo ty jesteś moją siłą."
  tags: []
"Ps31,5":
  text: "W twoje ręce powierzam mego ducha; odkupiłeś mnie, PANIE, Boże wierny."
  tags: []
"Ps31,6":
  text: "Nienawidzę tych, którzy zważają na próżne marności, bo ja w PANU pokładam nadzieję."
  tags: []
"Ps31,7":
  text: "Będę się radował i weselił w twoim miłosierdziu, bo wejrzałeś na moje utrapienie i poznałeś udręki mojej duszy;"
  tags: []
"Ps31,8":
  text: "I nie wydałeś mnie w ręce wroga, postawiłeś moje nogi na miejscu przestronnym."
  tags: []
"Ps31,9":
  text: "Zmiłuj się nade mną, PANIE, bo jestem uciśniony, od żałości osłabły moje oczy, a także moja dusza i moje wnętrzności."
  tags: []
"Ps31,10":
  text: "W bólu bowiem upływa moje życie, a moje lata na wzdychaniu; moja siła osłabła z powodu mej nieprawości, a moje kości wyschły."
  tags: []
"Ps31,11":
  text: "Stałem się pośmiewiskiem dla wszystkich moich wrogów, zwłaszcza dla moich sąsiadów, i postrachem dla znajomych; ci, którzy mnie widzą na dworze, uciekają przede mną."
  tags: []
"Ps31,12":
  text: "Zapomniano o mnie jak o umarłym, stałem się jak rozbite naczynie."
  tags: []
"Ps31,13":
  text: "Słyszę bowiem oszczerstwa wielu; strach czai się zewsząd; gdy wspólnie naradzają się przeciwko mnie, spiskują, jak odebrać mi życie."
  tags: []
"Ps31,14":
  text: "Ale ja zaufałem tobie, PANIE; powiedziałem: Ty jesteś moim Bogiem."
  tags: []
"Ps31,15":
  text: "Mój czas jest w twoich rękach, ocal mnie z ręki moich nieprzyjaciół i od tych, którzy mnie prześladują."
  tags: []
"Ps31,16":
  text: "Rozjaśnij swe oblicze nad twoim sługą, wybaw mnie w twoim miłosierdziu."
  tags: []
"Ps31,17":
  text: "PANIE, niech nie doznam wstydu, skoro cię wzywam; niech niegodziwi się wstydzą i zamilkną w grobie."
  tags: []
"Ps31,18":
  text: "Niech zaniemówią wargi kłamliwe, które w pysze i pogardzie mówią krzywdzące słowa przeciwko sprawiedliwemu."
  tags: []
"Ps31,19":
  text: "Jakże wielka jest twoja dobroć, którą zachowujesz dla bojących się ciebie i okazujesz tym, co ufają tobie wobec synów ludzkich!"
  tags: []
"Ps31,20":
  text: "Ukryjesz ich pod osłoną twojej obecności przed pychą człowieka, ochronisz ich w namiocie przed kłótliwymi językami."
  tags: []
"Ps31,21":
  text: "Błogosławiony niech będzie PAN, bo okazał mi swą cudowną łaskę w mieście warownym."
  tags: []
"Ps31,22":
  text: "Powiedziałem w pośpiechu: Odrzuciłeś mnie sprzed twych oczu; lecz ty wysłuchałeś głosu mego błagania, gdy wołałem do ciebie."
  tags: []
"Ps31,23":
  text: "Miłujcie PANA, wszyscy jego święci, bo PAN strzeże wiernych, a postępującym wyniośle odpłaca z nawiązką."
  tags: []
"Ps31,24":
  text: "Bądźcie dzielni, wszyscy, którzy pokładacie nadzieję w PANU, a on umocni wasze serca."
  tags: []
