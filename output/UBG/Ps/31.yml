"Ps31,1": "W tobie, PANIE, pokładam nadzieję, niech nigdy nie doznam wstydu, wyzwól mnie w swojej sprawiedliwości."
"Ps31,2": "Nakłoń ku mnie swego ucha, czym prędzej mnie ocal; bądź mi mocną skałą, domem obronnym, abyś mnie wybawił."
"Ps31,3": "Ty bowiem jesteś moją skałą i twierdzą; dlatego przez wzgląd na twoje imię kieruj mnie i prowadź."
"Ps31,4": "Wyciągnij mnie z sieci, którą zastawili na mnie, bo ty jesteś moją siłą."
"Ps31,5": "W twoje ręce powierzam mego ducha; odkupiłeś mnie, PANIE, Boże wierny."
"Ps31,6": "Nienawidzę tych, którzy zważają na próżne marności, bo ja w PANU pokładam nadzieję."
"Ps31,7": "Będę się radował i weselił w twoim miłosierdziu, bo wejrzałeś na moje utrapienie i poznałeś udręki mojej duszy;"
"Ps31,8": "I nie wydałeś mnie w ręce wroga, postawiłeś moje nogi na miejscu przestronnym."
"Ps31,9": "Zmiłuj się nade mną, PANIE, bo jestem uciśniony, od żałości osłabły moje oczy, a także moja dusza i moje wnętrzności."
"Ps31,10": "W bólu bowiem upływa moje życie, a moje lata na wzdychaniu; moja siła osłabła z powodu mej nieprawości, a moje kości wyschły."
"Ps31,11": "Stałem się pośmiewiskiem dla wszystkich moich wrogów, zwłaszcza dla moich sąsiadów, i postrachem dla znajomych; ci, którzy mnie widzą na dworze, uciekają przede mną."
"Ps31,12": "Zapomniano o mnie jak o umarłym, stałem się jak rozbite naczynie."
"Ps31,13": "Słyszę bowiem oszczerstwa wielu; strach czai się zewsząd; gdy wspólnie naradzają się przeciwko mnie, spiskują, jak odebrać mi życie."
"Ps31,14": "Ale ja zaufałem tobie, PANIE; powiedziałem: Ty jesteś moim Bogiem."
"Ps31,15": "Mój czas jest w twoich rękach, ocal mnie z ręki moich nieprzyjaciół i od tych, którzy mnie prześladują."
"Ps31,16": "Rozjaśnij swe oblicze nad twoim sługą, wybaw mnie w twoim miłosierdziu."
"Ps31,17": "PANIE, niech nie doznam wstydu, skoro cię wzywam; niech niegodziwi się wstydzą i zamilkną w grobie."
"Ps31,18": "Niech zaniemówią wargi kłamliwe, które w pysze i pogardzie mówią krzywdzące słowa przeciwko sprawiedliwemu."
"Ps31,19": "Jakże wielka jest twoja dobroć, którą zachowujesz dla bojących się ciebie i okazujesz tym, co ufają tobie wobec synów ludzkich!"
"Ps31,20": "Ukryjesz ich pod osłoną twojej obecności przed pychą człowieka, ochronisz ich w namiocie przed kłótliwymi językami."
"Ps31,21": "Błogosławiony niech będzie PAN, bo okazał mi swą cudowną łaskę w mieście warownym."
"Ps31,22": "Powiedziałem w pośpiechu: Odrzuciłeś mnie sprzed twych oczu; lecz ty wysłuchałeś głosu mego błagania, gdy wołałem do ciebie."
"Ps31,23": "Miłujcie PANA, wszyscy jego święci, bo PAN strzeże wiernych, a postępującym wyniośle odpłaca z nawiązką."
"Ps31,24": "Bądźcie dzielni, wszyscy, którzy pokładacie nadzieję w PANU, a on umocni wasze serca."
