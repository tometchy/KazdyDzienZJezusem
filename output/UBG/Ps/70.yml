"Ps70,1":
  text: "Boże, racz mnie ocalić; PANIE, pospiesz mi na pomoc."
  tags: []
"Ps70,2":
  text: "Niech się zawstydzą i okryją hańbą ci, którzy czyhają na moją duszę; niech się cofną ze wstydem ci, którzy mi źle życzą."
  tags: []
"Ps70,3":
  text: "Niech się cofną wskutek swej hańby ci, którzy mi mówią: Ha, ha!"
  tags: []
"Ps70,4":
  text: "Niech się weselą i radują w tobie wszyscy, którzy cię szukają; niech ci, którzy miłują twoje zbawienie, mówią zawsze: Niech Bóg będzie wywyższony!"
  tags: []
"Ps70,5":
  text: "Ja zaś jestem nędzny i ubogi, Boże, pospiesz ku mnie, ty jesteś moją pomocą i wybawicielem; PANIE, nie zwlekaj."
  tags: []
