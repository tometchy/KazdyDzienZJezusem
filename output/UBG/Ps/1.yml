"Ps1,1":
  text: "Błogosławiony człowiek, który nie idzie za radą niegodziwych, nie stoi na drodze grzeszników i nie zasiada w gronie szyderców;"
  tags: []
"Ps1,2":
  text: "Lecz ma upodobanie w prawie PANA i nad jego prawem rozmyśla we dnie i w nocy."
  tags: []
"Ps1,3":
  text: "Będzie on bowiem jak drzewo zasadzone nad strumieniami wód, które wydaje swój owoc w swoim czasie; jego liść nie zwiędnie i wszystko, co robi, powiedzie się."
  tags: []
"Ps1,4":
  text: "Nie tak niegodziwi; oni są jak plewa, którą wiatr rozmiata."
  tags: []
"Ps1,5":
  text: "Dlatego niegodziwi nie ostoją się na sądzie ani grzesznicy w zgromadzeniu sprawiedliwych."
  tags: []
"Ps1,6":
  text: "PAN bowiem zna drogę sprawiedliwych, ale droga niegodziwych zaginie."
  tags: []
