"Ps114,1":
  text: "Gdy Izrael wychodził z Egiptu, dom Jakuba spośród ludu obcego języka;"
  tags: []
"Ps114,2":
  text: "Juda stał się jego świątynią, Izrael jego panowaniem."
  tags: []
"Ps114,3":
  text: "Morze to ujrzało i uciekło, Jordan wstecz się odwrócił."
  tags: []
"Ps114,4":
  text: "Góry skakały jak barany, pagórki jak jagnięta."
  tags: []
"Ps114,5":
  text: "Morze, cóż ci się stało, żeś uciekło, a tobie, Jordanie, że wstecz się odwróciłeś?"
  tags: []
"Ps114,6":
  text: "Góry, że skakałyście jak barany, a wy, pagórki, jak jagnięta?"
  tags: []
"Ps114,7":
  text: "Zadrżyj, ziemio, przed obliczem Pana, przed obliczem Boga Jakuba;"
  tags: []
"Ps114,8":
  text: "Który zamienia skałę w jezioro, a krzemień w źródło wód."
  tags: []
