"Ps114,1": "Gdy Izrael wychodził z Egiptu, dom Jakuba spośród ludu obcego języka;"
"Ps114,2": "Juda stał się jego świątynią, Izrael jego panowaniem."
"Ps114,3": "Morze to ujrzało i uciekło, Jordan wstecz się odwrócił."
"Ps114,4": "Góry skakały jak barany, pagórki jak jagnięta."
"Ps114,5": "Morze, cóż ci się stało, żeś uciekło, a tobie, Jordanie, że wstecz się odwróciłeś?"
"Ps114,6": "Góry, że skakałyście jak barany, a wy, pagórki, jak jagnięta?"
"Ps114,7": "Zadrżyj, ziemio, przed obliczem Pana, przed obliczem Boga Jakuba;"
"Ps114,8": "Który zamienia skałę w jezioro, a krzemień w źródło wód."
