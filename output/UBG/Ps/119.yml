"Ps119,1": "Błogosławieni ci, których droga jest nieskalana, którzy zgodnie z prawem PANA postępują."
"Ps119,2": "Błogosławieni ci, którzy strzegą jego świadectw i szukają go całym sercem;"
"Ps119,3": "Którzy nie czynią nieprawości, ale chodzą jego drogami."
"Ps119,4": "Ty rozkazałeś pilnie przestrzegać twoich nakazów."
"Ps119,5": "Oby moje drogi były skierowane na przestrzeganie twoich praw!"
"Ps119,6": "Wtedy nie doznam wstydu, gdy będę zważał na wszystkie twoje przykazania."
"Ps119,7": "Będę cię wysławiał w szczerości serca, gdy nauczę się twoich sprawiedliwych praw."
"Ps119,8": "Będę przestrzegał twoich praw, nigdy mnie nie opuszczaj."
"Ps119,9": "W jaki sposób oczyści młodzieniec swoją ścieżkę? Gdy zachowuje się według twego słowa."
"Ps119,10": "Z całego serca cię szukam, nie pozwól mi zboczyć od twoich przykazań."
"Ps119,11": "W swoim sercu zachowuję twoje słowa, aby nie zgrzeszyć przeciwko tobie."
"Ps119,12": "Błogosławiony jesteś, PANIE; naucz mnie twoich praw."
"Ps119,13": "Swoimi wargami opowiadam wszystkie nakazy twoich ust."
"Ps119,14": "Cieszę się drogą twoich świadectw bardziej niż z wszelkiego bogactwa."
"Ps119,15": "Rozmyślam o twoich przykazaniach i przypatruję się twoim drogom."
"Ps119,16": "Rozkoszuję się twoimi prawami i nie zapominam twoich słów."
"Ps119,17": "Okaż dobroć swemu słudze, abym żył i przestrzegał twoich słów."
"Ps119,18": "Otwórz moje oczy, abym ujrzał cuda twego prawa."
"Ps119,19": "Jestem obcym na ziemi, nie ukrywaj przede mną twoich przykazań."
"Ps119,20": "Moja dusza omdlewa, tęskniąc cały czas za twoimi sądami."
"Ps119,21": "Zgromiłeś pysznych, przeklęci są ci, którzy odstępują od twoich przykazań."
"Ps119,22": "Oddal ode mnie hańbę i wzgardę, gdyż przestrzegam twoich świadectw."
"Ps119,23": "Władcy też zasiadają i mówią przeciwko mnie, lecz twój sługa rozmyśla o twoich prawach."
"Ps119,24": "Twoje świadectwa też są moją rozkoszą i moimi doradcami."
"Ps119,25": "Moja dusza przylgnęła do prochu, ożyw mnie według twego słowa."
"Ps119,26": "Opowiedziałem ci moje drogi i wysłuchałeś mnie; naucz mnie twoich praw."
"Ps119,27": "Spraw, bym zrozumiał drogę twoich nakazów, a będę rozmyślał o twoich cudownych dziełach."
"Ps119,28": "Dusza moja rozpływa się we łzach ze smutku, umocnij mnie według twego słowa."
"Ps119,29": "Oddal ode mnie drogę kłamstwa, a obdarz mnie swoim prawem."
"Ps119,30": "Wybrałem drogę prawdy, a twoje nakazy stawiam przed sobą."
"Ps119,31": "Przylgnąłem do twoich świadectw; PANIE, nie pozwól mi zaznać wstydu."
"Ps119,32": "Pobiegnę drogą twoich przykazań, gdy rozszerzysz moje serce."
"Ps119,33": "Naucz mnie, PANIE, drogi twoich praw, a będę jej strzegł aż do końca."
"Ps119,34": "Daj mi rozum, abym zachował twoje prawo; żebym go przestrzegał z całego serca."
"Ps119,35": "Spraw, bym chodził ścieżką twoich przykazań, gdyż w nich mam upodobanie."
"Ps119,36": "Nakłoń moje serce do twoich świadectw, a nie do chciwości."
"Ps119,37": "Odwróć moje oczy, aby nie patrzyły na marność, ożyw mnie na twojej drodze."
"Ps119,38": "Utwierdź swoje słowo względem twego sługi, który się oddał twojej bojaźni."
"Ps119,39": "Oddal ode mnie mą hańbę, której się boję, bo twoje sądy są dobre."
"Ps119,40": "Oto pragnę twoich nakazów; ożyw mnie w swej sprawiedliwości."
"Ps119,41": "Niech zstąpi na mnie twoja łaskawość, PANIE, twoje zbawienie według twego słowa;"
"Ps119,42": "Abym mógł dać odpowiedź temu, który mi urąga, bo ufam twojemu słowu."
"Ps119,43": "I nie wyjmuj z moich ust słowa prawdy, bo twoich sądów oczekuję."
"Ps119,44": "I będę zawsze strzegł twego prawa, na wieki wieków."
"Ps119,45": "A będę chodził drogą przestronną, bo szukam twoich nakazów."
"Ps119,46": "Owszem, będę mówił o twoich świadectwach przed królami i nie doznam wstydu."
"Ps119,47": "Będę się rozkoszował twoimi przykazaniami, które umiłowałem."
"Ps119,48": "Wznoszę też swoje ręce ku twoim przykazaniom, które miłuję, i będę rozmyślał o twoich prawach."
"Ps119,49": "Pamiętaj o słowie danym twemu słudze, na którym to słowie kazałeś mi polegać."
"Ps119,50": "To jest moja pociecha w utrapieniu, bo twoje słowo mnie ożywia."
"Ps119,51": "Pyszni bardzo się ze mnie naśmiewają, lecz nie odstępuję od twego prawa."
"Ps119,52": "Pamiętam o twoich wiecznych sądach, PANIE, i pocieszam się nimi."
"Ps119,53": "Strach mnie ogarnął z powodu niegodziwych, którzy porzucają twoje prawo."
"Ps119,54": "Twoje prawa są dla mnie pieśniami w domu mego pielgrzymowania."
"Ps119,55": "Nocą wspominam twoje imię, PANIE, i strzegę twego prawa."
"Ps119,56": "To mam, bo przestrzegam twoich przykazań."
"Ps119,57": "PANIE, ty jesteś moim udziałem, przyrzekłem przestrzegać twoich słów."
"Ps119,58": "Modliłem się przed twoim obliczem z całego serca, zlituj się nade mną według twego słowa."
"Ps119,59": "Rozmyślałem nad moimi drogami i zwracałem kroki ku twoim świadectwom."
"Ps119,60": "Spieszyłem się i nie zwlekałem z przestrzeganiem twoich przykazań."
"Ps119,61": "Hufce niegodziwych złupiły mnie, ale nie zapominam twojego prawa."
"Ps119,62": "O północy wstaję, aby wysławiać cię za twoje sprawiedliwe sądy."
"Ps119,63": "Jestem przyjacielem wszystkich, którzy boją się ciebie, i tych, którzy przestrzegają twoich przykazań."
"Ps119,64": "PANIE, ziemia jest pełna twego miłosierdzia; naucz mnie twoich praw."
"Ps119,65": "Wyświadczyłeś dobro twemu słudze, PANIE, według twego słowa."
"Ps119,66": "Naucz mnie trafnego sądu i wiedzy, bo uwierzyłem twoim przykazaniom."
"Ps119,67": "Zanim doznałem utrapienia, błądziłem; lecz teraz przestrzegam twego słowa."
"Ps119,68": "Jesteś dobry i czynisz dobro; naucz mnie twoich praw."
"Ps119,69": "Zuchwali zmyślili przeciwko mnie kłamstwo, ale ja całym sercem strzegę twoich przykazań."
"Ps119,70": "Serce ich utyło jak sadło, ale ja rozkoszuję się twoim prawem."
"Ps119,71": "Dobrze to dla mnie, że zostałem uciśniony, abym się nauczył twoich praw."
"Ps119,72": "Prawo twoich ust jest lepsze dla mnie niż tysiące sztuk złota i srebra."
"Ps119,73": "Twoje ręce mnie uczyniły i ukształtowały; daj mi rozum, abym się nauczył twoich przykazań;"
"Ps119,74": "Bojący się ciebie, widząc mnie, będą się radować, że pokładam nadzieję w twoim słowie."
"Ps119,75": "Wiem, PANIE, że twoje sądy są sprawiedliwe i że słusznie mnie trapiłeś."
"Ps119,76": "Proszę cię, niech mnie ucieszy twoje miłosierdzie według twego słowa do twego sługi."
"Ps119,77": "Niech przyjdzie na mnie twoje miłosierdzie, abym żył; bo twoje prawo jest moją rozkoszą."
"Ps119,78": "Niech się zawstydzą zuchwali, bo niesłusznie znieważali mnie, ale ja będę rozmyślać o twoich przykazaniach."
"Ps119,79": "Niech się zwrócą do mnie ci, którzy się boją ciebie, i ci, którzy znają twoje świadectwa."
"Ps119,80": "Niech moje serce będzie nienaganne w twoich prawach, abym nie doznał wstydu."
"Ps119,81": "Moja dusza tęskni do twego zbawienia, pokładam nadzieję w twoim słowie."
"Ps119,82": "Moje oczy słabną, czekając na twoje słowo, gdy mówię: Kiedy mnie pocieszysz?"
"Ps119,83": "Chociaż jestem jak bukłak w dymie, jednak nie zapomniałem twoich praw."
"Ps119,84": "Ile będzie dni twego sługi? Kiedy wykonasz wyrok na tych, którzy mnie prześladują?"
"Ps119,85": "Doły wykopali dla mnie zuchwali, którzy nie postępują według twego prawa."
"Ps119,86": "Wszystkie twoje przykazania są prawdą; bez powodu mnie prześladują; pomóż mi."
"Ps119,87": "Omal nie zgładzili mnie na ziemi; ja zaś nie porzuciłem twoich przykazań."
"Ps119,88": "Według twego miłosierdzia ożyw mnie, abym strzegł świadectwa twoich ust."
"Ps119,89": "Na wieki, o PANIE, twoje słowo trwa w niebie."
"Ps119,90": "Z pokolenia na pokolenie twoja prawda; ugruntowałeś ziemię i trwa."
"Ps119,91": "Wszystko trwa do dziś według twego rozporządzenia; to wszystko służy tobie."
"Ps119,92": "Gdyby twoje prawo nie było moją rozkoszą, dawno zginąłbym w moim utrapieniu."
"Ps119,93": "Nigdy nie zapomnę twoich przykazań, bo nimi mnie ożywiłeś."
"Ps119,94": "Twoim jestem, wybaw mnie, bo szukam twoich przykazań."
"Ps119,95": "Czyhają na mnie niegodziwi, aby mnie stracić, ale ja rozważam twoje świadectwa."
"Ps119,96": "Widziałem koniec wszelkiej doskonałości, ale twoje przykazanie jest bezkresne."
"Ps119,97": "O, jakże miłuję twoje prawo! Przez cały dzień o nim rozmyślam."
"Ps119,98": "Czynisz mnie mądrzejszym od moich nieprzyjaciół dzięki twoim przykazaniom, bo mam je zawsze przed sobą."
"Ps119,99": "Stałem się rozumniejszy od wszystkich moich nauczycieli, bo rozmyślam o twoich świadectwach."
"Ps119,100": "Jestem roztropniejszy od starszych, bo przestrzegam twoich przykazań."
"Ps119,101": "Powstrzymuję swoje nogi od wszelkiej drogi złej, abym strzegł twego słowa."
"Ps119,102": "Nie odstępuję od twoich nakazów, bo ty mnie uczysz."
"Ps119,103": "O, jakże słodkie są twoje słowa dla mego podniebienia! Są słodsze niż miód dla moich ust."
"Ps119,104": "Dzięki twoim przykazaniom nabywam rozumu; dlatego nienawidzę wszelkiej ścieżki fałszywej."
"Ps119,105": "Twoje słowo jest pochodnią dla moich nóg i światłością na mojej ścieżce."
"Ps119,106": "Złożyłem przysięgę i wypełnię ją, będę przestrzegał twoich sprawiedliwych nakazów."
"Ps119,107": "Jestem bardzo strapiony; PANIE, ożyw mnie według słowa twego."
"Ps119,108": "PANIE, przyjmij dobrowolne ofiary moich ust i naucz mnie twoich nakazów."
"Ps119,109": "Moja dusza jest stale w niebezpieczeństwie, ale nie zapominam twojego prawa."
"Ps119,110": "Niegodziwi zastawili na mnie sidła, lecz ja nie odstępuję od twoich przykazań."
"Ps119,111": "Wziąłem twoje świadectwa jako wieczne dziedzictwo, bo są radością mego serca."
"Ps119,112": "Nakłoniłem moje serce, by zawsze wykonywać twoje prawa, aż do końca."
"Ps119,113": "Nienawidzę chwiejnych myśli, ale miłuję twoje prawo."
"Ps119,114": "Ty jesteś moją ucieczką i tarczą, pokładam nadzieję w twoim słowie."
"Ps119,115": "Odstąpcie ode mnie, złoczyńcy, będę strzegł przykazania mojego Boga."
"Ps119,116": "Wesprzyj mnie według słowa twego, abym żył, i niech nie doznam wstydu ze względu na moją nadzieję."
"Ps119,117": "Podtrzymaj mnie, a będę wybawiony i będę rozmyślał zawsze o twoich prawach."
"Ps119,118": "Podeptałeś wszystkich, którzy odstępują od twoich praw, bo ich zdrada to fałsz."
"Ps119,119": "Odrzucasz jak żużel wszystkich niegodziwych ziemi; dlatego miłuję twoje świadectwa."
"Ps119,120": "Moje ciało drży ze strachu przed tobą, bo lękam się twoich sądów."
"Ps119,121": "Sprawowałem sąd i sprawiedliwość; nie wydawaj mnie moim ciemięzcom."
"Ps119,122": "Bądź poręczycielem dla twego sługi ku dobremu, aby nie uciskali mnie zuchwalcy."
"Ps119,123": "Moje oczy słabną, czekając na twoje zbawienie i na słowo twojej sprawiedliwości."
"Ps119,124": "Postąp ze swoim sługą według twego miłosierdzia i naucz mnie twoich praw."
"Ps119,125": "Jestem twoim sługą, daj mi rozum, abym poznał twoje świadectwa."
"Ps119,126": "Już czas, PANIE, abyś działał, bo naruszono twoje prawo."
"Ps119,127": "Dlatego umiłowałem twoje przykazania nad złoto, nad szczere złoto."
"Ps119,128": "Bo wszystkie twoje przykazania uznaję za prawdziwe, a nienawidzę wszelkiej fałszywej drogi."
"Ps119,129": "Twoje świadectwa są przedziwne, dlatego moja dusza ich strzeże."
"Ps119,130": "Początek twoich słów oświeca i daje rozum prostym."
"Ps119,131": "Otwieram usta i wzdycham, bo pragnąłem twoich przykazań."
"Ps119,132": "Spójrz na mnie i zmiłuj się nade mną, jak postępujesz z tymi, którzy miłują twoje imię."
"Ps119,133": "Utwierdź moje kroki w twoim słowie, niech nie panuje nade mną żadna nieprawość."
"Ps119,134": "Wybaw mnie z ludzkiego ucisku, abym strzegł twoich nakazów."
"Ps119,135": "Rozjaśnij swe oblicze nad twoim sługą i naucz mnie twoich praw."
"Ps119,136": "Strumienie wód płyną z mych oczu, bo nie strzegą twego prawa."
"Ps119,137": "Sprawiedliwy jesteś, PANIE, i słuszne są twoje sądy."
"Ps119,138": "Twoje świadectwa, które nadałeś, są sprawiedliwe i bardzo wierne."
"Ps119,139": "Gorliwość pożarła mnie, bo moi nieprzyjaciele zapominają twoje słowa."
"Ps119,140": "Twoje słowo jest w pełni wypróbowane, dlatego twój sługa je kocha."
"Ps119,141": "Ja jestem mały i wzgardzony, lecz nie zapominam twoich przykazań."
"Ps119,142": "Twoja sprawiedliwość jest sprawiedliwością wieczną, a twoje prawo jest prawdą."
"Ps119,143": "Ucisk i utrapienie spadły na mnie, lecz twoje przykazania są moją rozkoszą."
"Ps119,144": "Sprawiedliwość twoich świadectw trwa na wieki; daj mi rozum, a będę żył."
"Ps119,145": "Wołam z całego serca, wysłuchaj mnie, o PANIE, a będę strzegł twoich praw."
"Ps119,146": "Wołam do ciebie, wybaw mnie, a będę strzegł twoich świadectw."
"Ps119,147": "Wstaję przed świtem i wołam, oczekuję na twoje słowo."
"Ps119,148": "Moje oczy wyprzedzają straże nocne, abym mógł rozmyślać o twoim słowie."
"Ps119,149": "PANIE, usłysz mój głos według twego miłosierdzia; ożyw mnie według twego wyroku."
"Ps119,150": "Zbliżają się niegodziwi prześladowcy, są daleko od twego prawa."
"Ps119,151": "Blisko jesteś, PANIE, i wszystkie twoje przykazania są prawdą."
"Ps119,152": "Od dawna wiem o twoich świadectwach, że ugruntowałeś je na wieki."
"Ps119,153": "Wejrzyj na moje utrapienie i wyzwól mnie, bo nie zapomniałem twojego prawa."
"Ps119,154": "Broń mojej sprawy i wybaw mnie; ożyw mnie według twego słowa."
"Ps119,155": "Zbawienie jest daleko od niegodziwych, bo nie szukają twoich praw."
"Ps119,156": "Wielka jest twoja litość, PANIE; ożyw mnie według twoich wyroków."
"Ps119,157": "Liczni są moi prześladowcy i nieprzyjaciele; lecz nie uchylam się od twoich świadectw."
"Ps119,158": "Widziałem przestępców i czułem odrazę, że nie przestrzegali twego słowa."
"Ps119,159": "Patrz, jak miłuję twoje nakazy, PANIE; ożyw mnie według twego miłosierdzia."
"Ps119,160": "Podstawą twego słowa jest prawda, a wszelki wyrok twojej sprawiedliwości trwa na wieki."
"Ps119,161": "Władcy prześladują mnie bez przyczyny; moje serce zaś boi się twoich słów."
"Ps119,162": "Raduję się z twego słowa jak ten, który znajduje wielki łup."
"Ps119,163": "Nienawidzę kłamstwa i brzydzę się nim, ale miłuję twoje prawo."
"Ps119,164": "Chwalę cię siedem razy dziennie za twoje sprawiedliwe sądy."
"Ps119,165": "Wielki pokój dla tych, którzy miłują twoje prawo, a nie doznają żadnego zgorszenia."
"Ps119,166": "PANIE, oczekuję na twoje zbawienie i zachowuję twoje przykazania."
"Ps119,167": "Moja dusza przestrzega twoich świadectw, bo bardzo je miłuję."
"Ps119,168": "Przestrzegam twoich przykazań i świadectw, bo wszystkie moje drogi są przed tobą."
"Ps119,169": "PANIE, niech dotrze moje wołanie przed twoje oblicze, daj mi zrozumienie według słowa twego."
"Ps119,170": "Niech dojdzie moja prośba przed twoje oblicze, ocal mnie według twojej obietnicy."
"Ps119,171": "Moje wargi wygłoszą chwałę, gdy nauczysz mnie twoich praw."
"Ps119,172": "Mój język będzie głosił twoje słowo, bo wszystkie twoje przykazania są sprawiedliwością."
"Ps119,173": "Niech twoja ręka będzie mi pomocą, bo wybrałem twoje przykazania."
"Ps119,174": "PANIE, pragnę twego zbawienia, a twoje prawo jest moją rozkoszą."
"Ps119,175": "Pozwól mojej duszy żyć, a będzie cię chwalić; niech twoje nakazy będą dla mnie pomocą."
"Ps119,176": "Błądzę jak zgubiona owca; szukaj twego sługi, bo nie zapominam twoich przykazań."
