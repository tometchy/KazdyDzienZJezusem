"Ps119,1":
  text: "Błogosławieni ci, których droga jest nieskalana, którzy zgodnie z prawem PANA postępują."
  tags: []
"Ps119,2":
  text: "Błogosławieni ci, którzy strzegą jego świadectw i szukają go całym sercem;"
  tags: []
"Ps119,3":
  text: "Którzy nie czynią nieprawości, ale chodzą jego drogami."
  tags: []
"Ps119,4":
  text: "Ty rozkazałeś pilnie przestrzegać twoich nakazów."
  tags: []
"Ps119,5":
  text: "Oby moje drogi były skierowane na przestrzeganie twoich praw!"
  tags: []
"Ps119,6":
  text: "Wtedy nie doznam wstydu, gdy będę zważał na wszystkie twoje przykazania."
  tags: []
"Ps119,7":
  text: "Będę cię wysławiał w szczerości serca, gdy nauczę się twoich sprawiedliwych praw."
  tags: []
"Ps119,8":
  text: "Będę przestrzegał twoich praw, nigdy mnie nie opuszczaj."
  tags: []
"Ps119,9":
  text: "W jaki sposób oczyści młodzieniec swoją ścieżkę? Gdy zachowuje się według twego słowa."
  tags: []
"Ps119,10":
  text: "Z całego serca cię szukam, nie pozwól mi zboczyć od twoich przykazań."
  tags: []
"Ps119,11":
  text: "W swoim sercu zachowuję twoje słowa, aby nie zgrzeszyć przeciwko tobie."
  tags: []
"Ps119,12":
  text: "Błogosławiony jesteś, PANIE; naucz mnie twoich praw."
  tags: []
"Ps119,13":
  text: "Swoimi wargami opowiadam wszystkie nakazy twoich ust."
  tags: []
"Ps119,14":
  text: "Cieszę się drogą twoich świadectw bardziej niż z wszelkiego bogactwa."
  tags: []
"Ps119,15":
  text: "Rozmyślam o twoich przykazaniach i przypatruję się twoim drogom."
  tags: []
"Ps119,16":
  text: "Rozkoszuję się twoimi prawami i nie zapominam twoich słów."
  tags: []
"Ps119,17":
  text: "Okaż dobroć swemu słudze, abym żył i przestrzegał twoich słów."
  tags: []
"Ps119,18":
  text: "Otwórz moje oczy, abym ujrzał cuda twego prawa."
  tags: []
"Ps119,19":
  text: "Jestem obcym na ziemi, nie ukrywaj przede mną twoich przykazań."
  tags: []
"Ps119,20":
  text: "Moja dusza omdlewa, tęskniąc cały czas za twoimi sądami."
  tags: []
"Ps119,21":
  text: "Zgromiłeś pysznych, przeklęci są ci, którzy odstępują od twoich przykazań."
  tags: []
"Ps119,22":
  text: "Oddal ode mnie hańbę i wzgardę, gdyż przestrzegam twoich świadectw."
  tags: []
"Ps119,23":
  text: "Władcy też zasiadają i mówią przeciwko mnie, lecz twój sługa rozmyśla o twoich prawach."
  tags: []
"Ps119,24":
  text: "Twoje świadectwa też są moją rozkoszą i moimi doradcami."
  tags: []
"Ps119,25":
  text: "Moja dusza przylgnęła do prochu, ożyw mnie według twego słowa."
  tags: []
"Ps119,26":
  text: "Opowiedziałem ci moje drogi i wysłuchałeś mnie; naucz mnie twoich praw."
  tags: []
"Ps119,27":
  text: "Spraw, bym zrozumiał drogę twoich nakazów, a będę rozmyślał o twoich cudownych dziełach."
  tags: []
"Ps119,28":
  text: "Dusza moja rozpływa się we łzach ze smutku, umocnij mnie według twego słowa."
  tags: []
"Ps119,29":
  text: "Oddal ode mnie drogę kłamstwa, a obdarz mnie swoim prawem."
  tags: []
"Ps119,30":
  text: "Wybrałem drogę prawdy, a twoje nakazy stawiam przed sobą."
  tags: []
"Ps119,31":
  text: "Przylgnąłem do twoich świadectw; PANIE, nie pozwól mi zaznać wstydu."
  tags: []
"Ps119,32":
  text: "Pobiegnę drogą twoich przykazań, gdy rozszerzysz moje serce."
  tags: []
"Ps119,33":
  text: "Naucz mnie, PANIE, drogi twoich praw, a będę jej strzegł aż do końca."
  tags: []
"Ps119,34":
  text: "Daj mi rozum, abym zachował twoje prawo; żebym go przestrzegał z całego serca."
  tags: []
"Ps119,35":
  text: "Spraw, bym chodził ścieżką twoich przykazań, gdyż w nich mam upodobanie."
  tags: []
"Ps119,36":
  text: "Nakłoń moje serce do twoich świadectw, a nie do chciwości."
  tags: []
"Ps119,37":
  text: "Odwróć moje oczy, aby nie patrzyły na marność, ożyw mnie na twojej drodze."
  tags: []
"Ps119,38":
  text: "Utwierdź swoje słowo względem twego sługi, który się oddał twojej bojaźni."
  tags: []
"Ps119,39":
  text: "Oddal ode mnie mą hańbę, której się boję, bo twoje sądy są dobre."
  tags: []
"Ps119,40":
  text: "Oto pragnę twoich nakazów; ożyw mnie w swej sprawiedliwości."
  tags: []
"Ps119,41":
  text: "Niech zstąpi na mnie twoja łaskawość, PANIE, twoje zbawienie według twego słowa;"
  tags: []
"Ps119,42":
  text: "Abym mógł dać odpowiedź temu, który mi urąga, bo ufam twojemu słowu."
  tags: []
"Ps119,43":
  text: "I nie wyjmuj z moich ust słowa prawdy, bo twoich sądów oczekuję."
  tags: []
"Ps119,44":
  text: "I będę zawsze strzegł twego prawa, na wieki wieków."
  tags: []
"Ps119,45":
  text: "A będę chodził drogą przestronną, bo szukam twoich nakazów."
  tags: []
"Ps119,46":
  text: "Owszem, będę mówił o twoich świadectwach przed królami i nie doznam wstydu."
  tags: []
"Ps119,47":
  text: "Będę się rozkoszował twoimi przykazaniami, które umiłowałem."
  tags: []
"Ps119,48":
  text: "Wznoszę też swoje ręce ku twoim przykazaniom, które miłuję, i będę rozmyślał o twoich prawach."
  tags: []
"Ps119,49":
  text: "Pamiętaj o słowie danym twemu słudze, na którym to słowie kazałeś mi polegać."
  tags: []
"Ps119,50":
  text: "To jest moja pociecha w utrapieniu, bo twoje słowo mnie ożywia."
  tags: []
"Ps119,51":
  text: "Pyszni bardzo się ze mnie naśmiewają, lecz nie odstępuję od twego prawa."
  tags: []
"Ps119,52":
  text: "Pamiętam o twoich wiecznych sądach, PANIE, i pocieszam się nimi."
  tags: []
"Ps119,53":
  text: "Strach mnie ogarnął z powodu niegodziwych, którzy porzucają twoje prawo."
  tags: []
"Ps119,54":
  text: "Twoje prawa są dla mnie pieśniami w domu mego pielgrzymowania."
  tags: []
"Ps119,55":
  text: "Nocą wspominam twoje imię, PANIE, i strzegę twego prawa."
  tags: []
"Ps119,56":
  text: "To mam, bo przestrzegam twoich przykazań."
  tags: []
"Ps119,57":
  text: "PANIE, ty jesteś moim udziałem, przyrzekłem przestrzegać twoich słów."
  tags: []
"Ps119,58":
  text: "Modliłem się przed twoim obliczem z całego serca, zlituj się nade mną według twego słowa."
  tags: []
"Ps119,59":
  text: "Rozmyślałem nad moimi drogami i zwracałem kroki ku twoim świadectwom."
  tags: []
"Ps119,60":
  text: "Spieszyłem się i nie zwlekałem z przestrzeganiem twoich przykazań."
  tags: []
"Ps119,61":
  text: "Hufce niegodziwych złupiły mnie, ale nie zapominam twojego prawa."
  tags: []
"Ps119,62":
  text: "O północy wstaję, aby wysławiać cię za twoje sprawiedliwe sądy."
  tags: []
"Ps119,63":
  text: "Jestem przyjacielem wszystkich, którzy boją się ciebie, i tych, którzy przestrzegają twoich przykazań."
  tags: []
"Ps119,64":
  text: "PANIE, ziemia jest pełna twego miłosierdzia; naucz mnie twoich praw."
  tags: []
"Ps119,65":
  text: "Wyświadczyłeś dobro twemu słudze, PANIE, według twego słowa."
  tags: []
"Ps119,66":
  text: "Naucz mnie trafnego sądu i wiedzy, bo uwierzyłem twoim przykazaniom."
  tags: []
"Ps119,67":
  text: "Zanim doznałem utrapienia, błądziłem; lecz teraz przestrzegam twego słowa."
  tags: []
"Ps119,68":
  text: "Jesteś dobry i czynisz dobro; naucz mnie twoich praw."
  tags: []
"Ps119,69":
  text: "Zuchwali zmyślili przeciwko mnie kłamstwo, ale ja całym sercem strzegę twoich przykazań."
  tags: []
"Ps119,70":
  text: "Serce ich utyło jak sadło, ale ja rozkoszuję się twoim prawem."
  tags: []
"Ps119,71":
  text: "Dobrze to dla mnie, że zostałem uciśniony, abym się nauczył twoich praw."
  tags: []
"Ps119,72":
  text: "Prawo twoich ust jest lepsze dla mnie niż tysiące sztuk złota i srebra."
  tags: []
"Ps119,73":
  text: "Twoje ręce mnie uczyniły i ukształtowały; daj mi rozum, abym się nauczył twoich przykazań;"
  tags: []
"Ps119,74":
  text: "Bojący się ciebie, widząc mnie, będą się radować, że pokładam nadzieję w twoim słowie."
  tags: []
"Ps119,75":
  text: "Wiem, PANIE, że twoje sądy są sprawiedliwe i że słusznie mnie trapiłeś."
  tags: []
"Ps119,76":
  text: "Proszę cię, niech mnie ucieszy twoje miłosierdzie według twego słowa do twego sługi."
  tags: []
"Ps119,77":
  text: "Niech przyjdzie na mnie twoje miłosierdzie, abym żył; bo twoje prawo jest moją rozkoszą."
  tags: []
"Ps119,78":
  text: "Niech się zawstydzą zuchwali, bo niesłusznie znieważali mnie, ale ja będę rozmyślać o twoich przykazaniach."
  tags: []
"Ps119,79":
  text: "Niech się zwrócą do mnie ci, którzy się boją ciebie, i ci, którzy znają twoje świadectwa."
  tags: []
"Ps119,80":
  text: "Niech moje serce będzie nienaganne w twoich prawach, abym nie doznał wstydu."
  tags: []
"Ps119,81":
  text: "Moja dusza tęskni do twego zbawienia, pokładam nadzieję w twoim słowie."
  tags: []
"Ps119,82":
  text: "Moje oczy słabną, czekając na twoje słowo, gdy mówię: Kiedy mnie pocieszysz?"
  tags: []
"Ps119,83":
  text: "Chociaż jestem jak bukłak w dymie, jednak nie zapomniałem twoich praw."
  tags: []
"Ps119,84":
  text: "Ile będzie dni twego sługi? Kiedy wykonasz wyrok na tych, którzy mnie prześladują?"
  tags: []
"Ps119,85":
  text: "Doły wykopali dla mnie zuchwali, którzy nie postępują według twego prawa."
  tags: []
"Ps119,86":
  text: "Wszystkie twoje przykazania są prawdą; bez powodu mnie prześladują; pomóż mi."
  tags: []
"Ps119,87":
  text: "Omal nie zgładzili mnie na ziemi; ja zaś nie porzuciłem twoich przykazań."
  tags: []
"Ps119,88":
  text: "Według twego miłosierdzia ożyw mnie, abym strzegł świadectwa twoich ust."
  tags: []
"Ps119,89":
  text: "Na wieki, o PANIE, twoje słowo trwa w niebie."
  tags: []
"Ps119,90":
  text: "Z pokolenia na pokolenie twoja prawda; ugruntowałeś ziemię i trwa."
  tags: []
"Ps119,91":
  text: "Wszystko trwa do dziś według twego rozporządzenia; to wszystko służy tobie."
  tags: []
"Ps119,92":
  text: "Gdyby twoje prawo nie było moją rozkoszą, dawno zginąłbym w moim utrapieniu."
  tags: []
"Ps119,93":
  text: "Nigdy nie zapomnę twoich przykazań, bo nimi mnie ożywiłeś."
  tags: []
"Ps119,94":
  text: "Twoim jestem, wybaw mnie, bo szukam twoich przykazań."
  tags: []
"Ps119,95":
  text: "Czyhają na mnie niegodziwi, aby mnie stracić, ale ja rozważam twoje świadectwa."
  tags: []
"Ps119,96":
  text: "Widziałem koniec wszelkiej doskonałości, ale twoje przykazanie jest bezkresne."
  tags: []
"Ps119,97":
  text: "O, jakże miłuję twoje prawo! Przez cały dzień o nim rozmyślam."
  tags: []
"Ps119,98":
  text: "Czynisz mnie mądrzejszym od moich nieprzyjaciół dzięki twoim przykazaniom, bo mam je zawsze przed sobą."
  tags: []
"Ps119,99":
  text: "Stałem się rozumniejszy od wszystkich moich nauczycieli, bo rozmyślam o twoich świadectwach."
  tags: []
"Ps119,100":
  text: "Jestem roztropniejszy od starszych, bo przestrzegam twoich przykazań."
  tags: []
"Ps119,101":
  text: "Powstrzymuję swoje nogi od wszelkiej drogi złej, abym strzegł twego słowa."
  tags: []
"Ps119,102":
  text: "Nie odstępuję od twoich nakazów, bo ty mnie uczysz."
  tags: []
"Ps119,103":
  text: "O, jakże słodkie są twoje słowa dla mego podniebienia! Są słodsze niż miód dla moich ust."
  tags: []
"Ps119,104":
  text: "Dzięki twoim przykazaniom nabywam rozumu; dlatego nienawidzę wszelkiej ścieżki fałszywej."
  tags: []
"Ps119,105":
  text: "Twoje słowo jest pochodnią dla moich nóg i światłością na mojej ścieżce."
  tags: []
"Ps119,106":
  text: "Złożyłem przysięgę i wypełnię ją, będę przestrzegał twoich sprawiedliwych nakazów."
  tags: []
"Ps119,107":
  text: "Jestem bardzo strapiony; PANIE, ożyw mnie według słowa twego."
  tags: []
"Ps119,108":
  text: "PANIE, przyjmij dobrowolne ofiary moich ust i naucz mnie twoich nakazów."
  tags: []
"Ps119,109":
  text: "Moja dusza jest stale w niebezpieczeństwie, ale nie zapominam twojego prawa."
  tags: []
"Ps119,110":
  text: "Niegodziwi zastawili na mnie sidła, lecz ja nie odstępuję od twoich przykazań."
  tags: []
"Ps119,111":
  text: "Wziąłem twoje świadectwa jako wieczne dziedzictwo, bo są radością mego serca."
  tags: []
"Ps119,112":
  text: "Nakłoniłem moje serce, by zawsze wykonywać twoje prawa, aż do końca."
  tags: []
"Ps119,113":
  text: "Nienawidzę chwiejnych myśli, ale miłuję twoje prawo."
  tags: []
"Ps119,114":
  text: "Ty jesteś moją ucieczką i tarczą, pokładam nadzieję w twoim słowie."
  tags: []
"Ps119,115":
  text: "Odstąpcie ode mnie, złoczyńcy, będę strzegł przykazania mojego Boga."
  tags: []
"Ps119,116":
  text: "Wesprzyj mnie według słowa twego, abym żył, i niech nie doznam wstydu ze względu na moją nadzieję."
  tags: []
"Ps119,117":
  text: "Podtrzymaj mnie, a będę wybawiony i będę rozmyślał zawsze o twoich prawach."
  tags: []
"Ps119,118":
  text: "Podeptałeś wszystkich, którzy odstępują od twoich praw, bo ich zdrada to fałsz."
  tags: []
"Ps119,119":
  text: "Odrzucasz jak żużel wszystkich niegodziwych ziemi; dlatego miłuję twoje świadectwa."
  tags: []
"Ps119,120":
  text: "Moje ciało drży ze strachu przed tobą, bo lękam się twoich sądów."
  tags: []
"Ps119,121":
  text: "Sprawowałem sąd i sprawiedliwość; nie wydawaj mnie moim ciemięzcom."
  tags: []
"Ps119,122":
  text: "Bądź poręczycielem dla twego sługi ku dobremu, aby nie uciskali mnie zuchwalcy."
  tags: []
"Ps119,123":
  text: "Moje oczy słabną, czekając na twoje zbawienie i na słowo twojej sprawiedliwości."
  tags: []
"Ps119,124":
  text: "Postąp ze swoim sługą według twego miłosierdzia i naucz mnie twoich praw."
  tags: []
"Ps119,125":
  text: "Jestem twoim sługą, daj mi rozum, abym poznał twoje świadectwa."
  tags: []
"Ps119,126":
  text: "Już czas, PANIE, abyś działał, bo naruszono twoje prawo."
  tags: []
"Ps119,127":
  text: "Dlatego umiłowałem twoje przykazania nad złoto, nad szczere złoto."
  tags: []
"Ps119,128":
  text: "Bo wszystkie twoje przykazania uznaję za prawdziwe, a nienawidzę wszelkiej fałszywej drogi."
  tags: []
"Ps119,129":
  text: "Twoje świadectwa są przedziwne, dlatego moja dusza ich strzeże."
  tags: []
"Ps119,130":
  text: "Początek twoich słów oświeca i daje rozum prostym."
  tags: []
"Ps119,131":
  text: "Otwieram usta i wzdycham, bo pragnąłem twoich przykazań."
  tags: []
"Ps119,132":
  text: "Spójrz na mnie i zmiłuj się nade mną, jak postępujesz z tymi, którzy miłują twoje imię."
  tags: []
"Ps119,133":
  text: "Utwierdź moje kroki w twoim słowie, niech nie panuje nade mną żadna nieprawość."
  tags: []
"Ps119,134":
  text: "Wybaw mnie z ludzkiego ucisku, abym strzegł twoich nakazów."
  tags: []
"Ps119,135":
  text: "Rozjaśnij swe oblicze nad twoim sługą i naucz mnie twoich praw."
  tags: []
"Ps119,136":
  text: "Strumienie wód płyną z mych oczu, bo nie strzegą twego prawa."
  tags: []
"Ps119,137":
  text: "Sprawiedliwy jesteś, PANIE, i słuszne są twoje sądy."
  tags: []
"Ps119,138":
  text: "Twoje świadectwa, które nadałeś, są sprawiedliwe i bardzo wierne."
  tags: []
"Ps119,139":
  text: "Gorliwość pożarła mnie, bo moi nieprzyjaciele zapominają twoje słowa."
  tags: []
"Ps119,140":
  text: "Twoje słowo jest w pełni wypróbowane, dlatego twój sługa je kocha."
  tags: []
"Ps119,141":
  text: "Ja jestem mały i wzgardzony, lecz nie zapominam twoich przykazań."
  tags: []
"Ps119,142":
  text: "Twoja sprawiedliwość jest sprawiedliwością wieczną, a twoje prawo jest prawdą."
  tags: []
"Ps119,143":
  text: "Ucisk i utrapienie spadły na mnie, lecz twoje przykazania są moją rozkoszą."
  tags: []
"Ps119,144":
  text: "Sprawiedliwość twoich świadectw trwa na wieki; daj mi rozum, a będę żył."
  tags: []
"Ps119,145":
  text: "Wołam z całego serca, wysłuchaj mnie, o PANIE, a będę strzegł twoich praw."
  tags: []
"Ps119,146":
  text: "Wołam do ciebie, wybaw mnie, a będę strzegł twoich świadectw."
  tags: []
"Ps119,147":
  text: "Wstaję przed świtem i wołam, oczekuję na twoje słowo."
  tags: []
"Ps119,148":
  text: "Moje oczy wyprzedzają straże nocne, abym mógł rozmyślać o twoim słowie."
  tags: []
"Ps119,149":
  text: "PANIE, usłysz mój głos według twego miłosierdzia; ożyw mnie według twego wyroku."
  tags: []
"Ps119,150":
  text: "Zbliżają się niegodziwi prześladowcy, są daleko od twego prawa."
  tags: []
"Ps119,151":
  text: "Blisko jesteś, PANIE, i wszystkie twoje przykazania są prawdą."
  tags: []
"Ps119,152":
  text: "Od dawna wiem o twoich świadectwach, że ugruntowałeś je na wieki."
  tags: []
"Ps119,153":
  text: "Wejrzyj na moje utrapienie i wyzwól mnie, bo nie zapomniałem twojego prawa."
  tags: []
"Ps119,154":
  text: "Broń mojej sprawy i wybaw mnie; ożyw mnie według twego słowa."
  tags: []
"Ps119,155":
  text: "Zbawienie jest daleko od niegodziwych, bo nie szukają twoich praw."
  tags: []
"Ps119,156":
  text: "Wielka jest twoja litość, PANIE; ożyw mnie według twoich wyroków."
  tags: []
"Ps119,157":
  text: "Liczni są moi prześladowcy i nieprzyjaciele; lecz nie uchylam się od twoich świadectw."
  tags: []
"Ps119,158":
  text: "Widziałem przestępców i czułem odrazę, że nie przestrzegali twego słowa."
  tags: []
"Ps119,159":
  text: "Patrz, jak miłuję twoje nakazy, PANIE; ożyw mnie według twego miłosierdzia."
  tags: []
"Ps119,160":
  text: "Podstawą twego słowa jest prawda, a wszelki wyrok twojej sprawiedliwości trwa na wieki."
  tags: []
"Ps119,161":
  text: "Władcy prześladują mnie bez przyczyny; moje serce zaś boi się twoich słów."
  tags: []
"Ps119,162":
  text: "Raduję się z twego słowa jak ten, który znajduje wielki łup."
  tags: []
"Ps119,163":
  text: "Nienawidzę kłamstwa i brzydzę się nim, ale miłuję twoje prawo."
  tags: []
"Ps119,164":
  text: "Chwalę cię siedem razy dziennie za twoje sprawiedliwe sądy."
  tags: []
"Ps119,165":
  text: "Wielki pokój dla tych, którzy miłują twoje prawo, a nie doznają żadnego zgorszenia."
  tags: []
"Ps119,166":
  text: "PANIE, oczekuję na twoje zbawienie i zachowuję twoje przykazania."
  tags: []
"Ps119,167":
  text: "Moja dusza przestrzega twoich świadectw, bo bardzo je miłuję."
  tags: []
"Ps119,168":
  text: "Przestrzegam twoich przykazań i świadectw, bo wszystkie moje drogi są przed tobą."
  tags: []
"Ps119,169":
  text: "PANIE, niech dotrze moje wołanie przed twoje oblicze, daj mi zrozumienie według słowa twego."
  tags: []
"Ps119,170":
  text: "Niech dojdzie moja prośba przed twoje oblicze, ocal mnie według twojej obietnicy."
  tags: []
"Ps119,171":
  text: "Moje wargi wygłoszą chwałę, gdy nauczysz mnie twoich praw."
  tags: []
"Ps119,172":
  text: "Mój język będzie głosił twoje słowo, bo wszystkie twoje przykazania są sprawiedliwością."
  tags: []
"Ps119,173":
  text: "Niech twoja ręka będzie mi pomocą, bo wybrałem twoje przykazania."
  tags: []
"Ps119,174":
  text: "PANIE, pragnę twego zbawienia, a twoje prawo jest moją rozkoszą."
  tags: []
"Ps119,175":
  text: "Pozwól mojej duszy żyć, a będzie cię chwalić; niech twoje nakazy będą dla mnie pomocą."
  tags: []
"Ps119,176":
  text: "Błądzę jak zgubiona owca; szukaj twego sługi, bo nie zapominam twoich przykazań."
  tags: []
