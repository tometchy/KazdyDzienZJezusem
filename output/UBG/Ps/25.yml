"Ps25,1":
  text: "Do ciebie, PANIE, wznoszę moją duszę."
  tags: []
"Ps25,2":
  text: "Mój Boże, tobie ufam, niech nie doznam wstydu; niech moi wrogowie nie tryumfują nade mną."
  tags: []
"Ps25,3":
  text: "Zaprawdę nikt, kto ciebie oczekuje, nie dozna wstydu; zawstydzą się ci, którzy bez powodu popełniają nieprawość."
  tags: []
"Ps25,4":
  text: "PANIE, daj mi poznać twe drogi, naucz mnie twoich ścieżek."
  tags: []
"Ps25,5":
  text: "Prowadź mnie w twojej prawdzie i pouczaj mnie, bo ty jesteś Bogiem mego zbawienia; ciebie co dzień oczekuję."
  tags: []
"Ps25,6":
  text: "Pamiętaj o swoim miłosierdziu, PANIE, i o twoich łaskach, które trwają od wieków."
  tags: []
"Ps25,7":
  text: "I nie wspominaj grzechów mojej młodości i moich występków; pamiętaj o mnie według twego miłosierdzia, ze względu na twą dobroć, PANIE."
  tags: []
"Ps25,8":
  text: "PAN jest dobry i prawy, dlatego grzeszników naucza drogi."
  tags: []
"Ps25,9":
  text: "Poprowadzi pokornych w sprawiedliwości, pokornych nauczy swojej drogi."
  tags: []
"Ps25,10":
  text: "Wszystkie ścieżki PANA to miłosierdzie i prawda dla tych, którzy strzegą jego przymierza i świadectwa."
  tags: []
"Ps25,11":
  text: "PANIE, przez wzgląd na twoje imię przebacz moją nieprawość, bo jest wielka."
  tags: []
"Ps25,12":
  text: "Który to człowiek, co się boi PANA? Nauczy go drogi, którą ma wybrać."
  tags: []
"Ps25,13":
  text: "Jego dusza będzie trwać w szczęściu i jego potomstwo odziedziczy ziemię."
  tags: []
"Ps25,14":
  text: "Tajemnica PANA jest objawiona tym, którzy się go boją, oznajmi im swoje przymierze."
  tags: []
"Ps25,15":
  text: "Moje oczy nieustannie patrzą na PANA, bo on wyrwie z sidła moje nogi."
  tags: []
"Ps25,16":
  text: "Zwróć się ku mnie i zmiłuj się nade mną, bo jestem nędzny i opuszczony."
  tags: []
"Ps25,17":
  text: "Utrapienia mego serca rozmnożyły się, wyzwól mnie z moich udręczeń."
  tags: []
"Ps25,18":
  text: "Spójrz na moje utrapienie i trud i przebacz wszystkie moje grzechy."
  tags: []
"Ps25,19":
  text: "Popatrz, jak wielu jest moich wrogów i jak strasznie mnie nienawidzą."
  tags: []
"Ps25,20":
  text: "Strzeż mojej duszy i ocal mnie, abym nie doznał wstydu; w tobie bowiem pokładam nadzieję."
  tags: []
"Ps25,21":
  text: "Niech mnie strzegą uczciwość i prawość, bo ciebie oczekuję."
  tags: []
"Ps25,22":
  text: "Boże, wybaw Izraela ze wszystkich jego udręczeń."
  tags: []
