"Ps25,1": "Do ciebie, PANIE, wznoszę moją duszę."
"Ps25,2": "Mój Boże, tobie ufam, niech nie doznam wstydu; niech moi wrogowie nie tryumfują nade mną."
"Ps25,3": "Zaprawdę nikt, kto ciebie oczekuje, nie dozna wstydu; zawstydzą się ci, którzy bez powodu popełniają nieprawość."
"Ps25,4": "PANIE, daj mi poznać twe drogi, naucz mnie twoich ścieżek."
"Ps25,5": "Prowadź mnie w twojej prawdzie i pouczaj mnie, bo ty jesteś Bogiem mego zbawienia; ciebie co dzień oczekuję."
"Ps25,6": "Pamiętaj o swoim miłosierdziu, PANIE, i o twoich łaskach, które trwają od wieków."
"Ps25,7": "I nie wspominaj grzechów mojej młodości i moich występków; pamiętaj o mnie według twego miłosierdzia, ze względu na twą dobroć, PANIE."
"Ps25,8": "PAN jest dobry i prawy, dlatego grzeszników naucza drogi."
"Ps25,9": "Poprowadzi pokornych w sprawiedliwości, pokornych nauczy swojej drogi."
"Ps25,10": "Wszystkie ścieżki PANA to miłosierdzie i prawda dla tych, którzy strzegą jego przymierza i świadectwa."
"Ps25,11": "PANIE, przez wzgląd na twoje imię przebacz moją nieprawość, bo jest wielka."
"Ps25,12": "Który to człowiek, co się boi PANA? Nauczy go drogi, którą ma wybrać."
"Ps25,13": "Jego dusza będzie trwać w szczęściu i jego potomstwo odziedziczy ziemię."
"Ps25,14": "Tajemnica PANA jest objawiona tym, którzy się go boją, oznajmi im swoje przymierze."
"Ps25,15": "Moje oczy nieustannie patrzą na PANA, bo on wyrwie z sidła moje nogi."
"Ps25,16": "Zwróć się ku mnie i zmiłuj się nade mną, bo jestem nędzny i opuszczony."
"Ps25,17": "Utrapienia mego serca rozmnożyły się, wyzwól mnie z moich udręczeń."
"Ps25,18": "Spójrz na moje utrapienie i trud i przebacz wszystkie moje grzechy."
"Ps25,19": "Popatrz, jak wielu jest moich wrogów i jak strasznie mnie nienawidzą."
"Ps25,20": "Strzeż mojej duszy i ocal mnie, abym nie doznał wstydu; w tobie bowiem pokładam nadzieję."
"Ps25,21": "Niech mnie strzegą uczciwość i prawość, bo ciebie oczekuję."
"Ps25,22": "Boże, wybaw Izraela ze wszystkich jego udręczeń."
