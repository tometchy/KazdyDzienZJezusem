"Ps138,1": "Będę cię wysławiał, PANIE, z całego mego serca; będę ci śpiewał wobec bogów."
"Ps138,2": "Oddam ci pokłon ku twej świętej świątyni i będę wysławiał twoje imię za miłosierdzie twoje i prawdę; bo wywyższyłeś twoje imię i słowo ponad wszystko."
"Ps138,3": "W dniu, gdy cię wzywałem, wysłuchałeś mnie i mocą posiliłeś moją duszę."
"Ps138,4": "Wszyscy królowie będą cię wysławiali, PANIE, gdy usłyszą słowa twoich ust."
"Ps138,5": "I będą śpiewali o drogach PANA, że wielka jest chwała PANA."
"Ps138,6": "A choć wywyższony jest PAN, jednak ma wzgląd na pokornego, a wyniosłego poznaje z daleka."
"Ps138,7": "Choćbym chodził pośród utrapienia, ożywisz mnie; wyciągniesz swoją rękę przeciw gniewowi moich nieprzyjaciół, a twoja prawica mnie wybawi."
"Ps138,8": "PAN dokona wszystkiego za mnie. PANIE, twoje miłosierdzie trwa na wieki; nie opuszczaj dzieł twoich rąk."
