"Ps138,1":
  text: "Będę cię wysławiał, PANIE, z całego mego serca; będę ci śpiewał wobec bogów."
  tags: []
"Ps138,2":
  text: "Oddam ci pokłon ku twej świętej świątyni i będę wysławiał twoje imię za miłosierdzie twoje i prawdę; bo wywyższyłeś twoje imię i słowo ponad wszystko."
  tags: []
"Ps138,3":
  text: "W dniu, gdy cię wzywałem, wysłuchałeś mnie i mocą posiliłeś moją duszę."
  tags: []
"Ps138,4":
  text: "Wszyscy królowie będą cię wysławiali, PANIE, gdy usłyszą słowa twoich ust."
  tags: []
"Ps138,5":
  text: "I będą śpiewali o drogach PANA, że wielka jest chwała PANA."
  tags: []
"Ps138,6":
  text: "A choć wywyższony jest PAN, jednak ma wzgląd na pokornego, a wyniosłego poznaje z daleka."
  tags: []
"Ps138,7":
  text: "Choćbym chodził pośród utrapienia, ożywisz mnie; wyciągniesz swoją rękę przeciw gniewowi moich nieprzyjaciół, a twoja prawica mnie wybawi."
  tags: []
"Ps138,8":
  text: "PAN dokona wszystkiego za mnie. PANIE, twoje miłosierdzie trwa na wieki; nie opuszczaj dzieł twoich rąk."
  tags: []
