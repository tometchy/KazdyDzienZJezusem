"Ps40,1":
  text: "Z tęsknotą czekałem na PANA, a skłonił się ku mnie i wysłuchał mojego wołania."
  tags: []
"Ps40,2":
  text: "Wyciągnął mnie ze strasznego dołu i z błota grząskiego i postawił moje stopy na skale, i umocnił moje kroki."
  tags: []
"Ps40,3":
  text: "I włożył w moje usta nową pieśń, chwałę dla naszego Boga. Wielu to zobaczy i ulęknie się, i zaufa PANU."
  tags: []
"Ps40,4":
  text: "Błogosławiony człowiek, który pokłada w PANU swoją nadzieję, a nie ma względu na pysznych ani na tych, którzy podążają za kłamstwem."
  tags: []
"Ps40,5":
  text: "Wiele uczyniłeś cudów, PANIE, mój Boże, a twoich zamysłów wobec nas nikt nie potrafi wyliczyć przed tobą; gdybym chciał je opowiedzieć i ogłosić, jest ich więcej, niż zdołałbym wypowiedzieć."
  tags: []
"Ps40,6":
  text: "Ofiary i daru nie chciałeś, lecz otworzyłeś mi uszy; nie żądałeś całopalenia i ofiary za grzech."
  tags: []
"Ps40,7":
  text: "Wtedy powiedziałem: Oto przychodzę, na początku księgi jest napisane o mnie;"
  tags: []
"Ps40,8":
  text: "Pragnę czynić twoją wolę, mój Boże, a twoje prawo jest w moim wnętrzu."
  tags: []
"Ps40,9":
  text: "Głosiłem twoją sprawiedliwość w wielkim zgromadzeniu; oto nie powściągałem moich ust; ty wiesz o tym, PANIE."
  tags: []
"Ps40,10":
  text: "Twojej sprawiedliwości nie kryłem w głębi serca, opowiadałem twoją wierność i zbawienie; nie taiłem twego miłosierdzia i prawdy w wielkim zgromadzeniu."
  tags: []
"Ps40,11":
  text: "Dlatego ty, PANIE, nie odmawiaj mi twej litości; twoje miłosierdzie i prawda niech mnie zawsze strzegą."
  tags: []
"Ps40,12":
  text: "Otoczyły mnie bowiem nieszczęścia, których nie sposób zliczyć; dosięgły mnie moje nieprawości, tak że nie mogę ich przejrzeć; więcej ich niż włosów na mej głowie, więc serce we mnie ustaje."
  tags: []
"Ps40,13":
  text: "PANIE, racz mnie ocalić; PANIE, pospiesz mi na pomoc."
  tags: []
"Ps40,14":
  text: "Niech się zawiodą i zawstydzą wszyscy, którzy czyhają, by zatracić moją duszę; niech się cofną i zawstydzą ci, którzy mi źle życzą."
  tags: []
"Ps40,15":
  text: "Niech będą spustoszeni wskutek swej hańby ci, którzy mi mówią: Ha, ha!"
  tags: []
"Ps40,16":
  text: "Niech się radują i weselą w tobie wszyscy, którzy cię szukają; niech ci, którzy miłują twoje zbawienie, mówią zawsze: Niech PAN będzie wywyższony."
  tags: []
"Ps40,17":
  text: "Ja wprawdzie jestem ubogi i nędzny, lecz Pan myśli o mnie. Ty jesteś moją pomocą i wybawicielem, mój Boże, nie zwlekaj."
  tags: []
