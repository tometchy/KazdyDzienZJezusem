"Ps40,1": "Z tęsknotą czekałem na PANA, a skłonił się ku mnie i wysłuchał mojego wołania."
"Ps40,2": "Wyciągnął mnie ze strasznego dołu i z błota grząskiego i postawił moje stopy na skale, i umocnił moje kroki."
"Ps40,3": "I włożył w moje usta nową pieśń, chwałę dla naszego Boga. Wielu to zobaczy i ulęknie się, i zaufa PANU."
"Ps40,4": "Błogosławiony człowiek, który pokłada w PANU swoją nadzieję, a nie ma względu na pysznych ani na tych, którzy podążają za kłamstwem."
"Ps40,5": "Wiele uczyniłeś cudów, PANIE, mój Boże, a twoich zamysłów wobec nas nikt nie potrafi wyliczyć przed tobą; gdybym chciał je opowiedzieć i ogłosić, jest ich więcej, niż zdołałbym wypowiedzieć."
"Ps40,6": "Ofiary i daru nie chciałeś, lecz otworzyłeś mi uszy; nie żądałeś całopalenia i ofiary za grzech."
"Ps40,7": "Wtedy powiedziałem: Oto przychodzę, na początku księgi jest napisane o mnie;"
"Ps40,8": "Pragnę czynić twoją wolę, mój Boże, a twoje prawo jest w moim wnętrzu."
"Ps40,9": "Głosiłem twoją sprawiedliwość w wielkim zgromadzeniu; oto nie powściągałem moich ust; ty wiesz o tym, PANIE."
"Ps40,10": "Twojej sprawiedliwości nie kryłem w głębi serca, opowiadałem twoją wierność i zbawienie; nie taiłem twego miłosierdzia i prawdy w wielkim zgromadzeniu."
"Ps40,11": "Dlatego ty, PANIE, nie odmawiaj mi twej litości; twoje miłosierdzie i prawda niech mnie zawsze strzegą."
"Ps40,12": "Otoczyły mnie bowiem nieszczęścia, których nie sposób zliczyć; dosięgły mnie moje nieprawości, tak że nie mogę ich przejrzeć; więcej ich niż włosów na mej głowie, więc serce we mnie ustaje."
"Ps40,13": "PANIE, racz mnie ocalić; PANIE, pospiesz mi na pomoc."
"Ps40,14": "Niech się zawiodą i zawstydzą wszyscy, którzy czyhają, by zatracić moją duszę; niech się cofną i zawstydzą ci, którzy mi źle życzą."
"Ps40,15": "Niech będą spustoszeni wskutek swej hańby ci, którzy mi mówią: Ha, ha!"
"Ps40,16": "Niech się radują i weselą w tobie wszyscy, którzy cię szukają; niech ci, którzy miłują twoje zbawienie, mówią zawsze: Niech PAN będzie wywyższony."
"Ps40,17": "Ja wprawdzie jestem ubogi i nędzny, lecz Pan myśli o mnie. Ty jesteś moją pomocą i wybawicielem, mój Boże, nie zwlekaj."
