"Ps79,1":
  text: "Boże, poganie wtargnęli do twego dziedzictwa, splugawili twoją świętą świątynię, Jeruzalem zamienili w ruiny."
  tags: []
"Ps79,2":
  text: "Zwłoki twoich sług dali na żer ptactwu niebieskiemu, ciała twoich świętych bestiom ziemskim."
  tags: []
"Ps79,3":
  text: "Rozlali ich krew jak wodę wokół Jeruzalem i nie było nikogo, kto by ich pogrzebał."
  tags: []
"Ps79,4":
  text: "Staliśmy się hańbą dla naszych sąsiadów, pośmiewiskiem i drwiną dla tych, którzy są wokoło nas."
  tags: []
"Ps79,5":
  text: "Jak długo, PANIE? Czy wiecznie będziesz się gniewać? Czy twoja zapalczywość będzie płonąć jak ogień?"
  tags: []
"Ps79,6":
  text: "Wylej twój gniew na pogan, którzy cię nie znają, i na królestwa, które nie wzywają twego imienia."
  tags: []
"Ps79,7":
  text: "Pożarli bowiem Jakuba i spustoszyli jego mieszkanie."
  tags: []
"Ps79,8":
  text: "Nie pamiętaj nam dawnych nieprawości naszych, niech nas prędko spotka twoje miłosierdzie, bo jesteśmy bardzo wynędzniali."
  tags: []
"Ps79,9":
  text: "Wspomóż nas, Boże naszego zbawienia, dla chwały imienia twego; ocal nas i przebacz nam grzechy ze względu na twoje imię."
  tags: []
"Ps79,10":
  text: "Dlaczego poganie mają mówić: Gdzież jest ich Bóg? Niech będzie znany wśród pogan na naszych oczach przez dokonanie zemsty za przelaną krew twoich sług."
  tags: []
"Ps79,11":
  text: "Niech dotrze do ciebie jęk więźniów, według potęgi twego ramienia zachowaj skazanych na śmierć."
  tags: []
"Ps79,12":
  text: "I odpłać naszym sąsiadom siedmiokrotnie w ich zanadrze za zniewagę, którą ci wyrządzili, Panie!"
  tags: []
"Ps79,13":
  text: "My zaś, twój lud i owce twego pastwiska, będziemy cię wielbić na wieki, będziemy głosić twoją chwałę z pokolenia na pokolenie."
  tags: []
