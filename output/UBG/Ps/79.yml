"Ps79,1": "Boże, poganie wtargnęli do twego dziedzictwa, splugawili twoją świętą świątynię, Jeruzalem zamienili w ruiny."
"Ps79,2": "Zwłoki twoich sług dali na żer ptactwu niebieskiemu, ciała twoich świętych bestiom ziemskim."
"Ps79,3": "Rozlali ich krew jak wodę wokół Jeruzalem i nie było nikogo, kto by ich pogrzebał."
"Ps79,4": "Staliśmy się hańbą dla naszych sąsiadów, pośmiewiskiem i drwiną dla tych, którzy są wokoło nas."
"Ps79,5": "Jak długo, PANIE? Czy wiecznie będziesz się gniewać? Czy twoja zapalczywość będzie płonąć jak ogień?"
"Ps79,6": "Wylej twój gniew na pogan, którzy cię nie znają, i na królestwa, które nie wzywają twego imienia."
"Ps79,7": "Pożarli bowiem Jakuba i spustoszyli jego mieszkanie."
"Ps79,8": "Nie pamiętaj nam dawnych nieprawości naszych, niech nas prędko spotka twoje miłosierdzie, bo jesteśmy bardzo wynędzniali."
"Ps79,9": "Wspomóż nas, Boże naszego zbawienia, dla chwały imienia twego; ocal nas i przebacz nam grzechy ze względu na twoje imię."
"Ps79,10": "Dlaczego poganie mają mówić: Gdzież jest ich Bóg? Niech będzie znany wśród pogan na naszych oczach przez dokonanie zemsty za przelaną krew twoich sług."
"Ps79,11": "Niech dotrze do ciebie jęk więźniów, według potęgi twego ramienia zachowaj skazanych na śmierć."
"Ps79,12": "I odpłać naszym sąsiadom siedmiokrotnie w ich zanadrze za zniewagę, którą ci wyrządzili, Panie!"
"Ps79,13": "My zaś, twój lud i owce twego pastwiska, będziemy cię wielbić na wieki, będziemy głosić twoją chwałę z pokolenia na pokolenie."
