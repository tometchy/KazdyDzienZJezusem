"Ps23,1":
  text: "PAN jest moim pasterzem, niczego mi nie zabraknie."
  tags: []
"Ps23,2":
  text: "Sprawia, że kładę się na zielonych pastwiskach, prowadzi mnie nad spokojne wody."
  tags: []
"Ps23,3":
  text: "Posila moją duszę, prowadzi mnie ścieżkami sprawiedliwości ze względu na swoje imię."
  tags: []
"Ps23,4":
  text: "Choćbym nawet chodził doliną cienia śmierci, zła się nie ulęknę, bo ty jesteś ze mną; twoja laska i kij pocieszają mnie."
  tags: []
"Ps23,5":
  text: "Zastawiasz przede mną stół wobec moich wrogów, namaszczasz mi głowę olejkiem, mój kielich przelewa się."
  tags: []
"Ps23,6":
  text: "Zaprawdę dobroć i miłosierdzie pójdą w ślad za mną po wszystkie dni mego życia i będę mieszkał w domu PANA przez długie czasy."
  tags: []
