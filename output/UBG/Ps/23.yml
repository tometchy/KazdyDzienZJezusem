"Ps23,1": "PAN jest moim pasterzem, niczego mi nie zabraknie."
"Ps23,2": "Sprawia, że kładę się na zielonych pastwiskach, prowadzi mnie nad spokojne wody."
"Ps23,3": "Posila moją duszę, prowadzi mnie ścieżkami sprawiedliwości ze względu na swoje imię."
"Ps23,4": "Choćbym nawet chodził doliną cienia śmierci, zła się nie ulęknę, bo ty jesteś ze mną; twoja laska i kij pocieszają mnie."
"Ps23,5": "Zastawiasz przede mną stół wobec moich wrogów, namaszczasz mi głowę olejkiem, mój kielich przelewa się."
"Ps23,6": "Zaprawdę dobroć i miłosierdzie pójdą w ślad za mną po wszystkie dni mego życia i będę mieszkał w domu PANA przez długie czasy."
