"Ps143,1":
  text: "PANIE, wysłuchaj mojej modlitwy i nadstaw ucha na moje prośby; wysłuchaj mnie w swojej wierności i sprawiedliwości."
  tags: []
"Ps143,2":
  text: "A nie stawiaj przed sądem swojego sługi, bo nikt z żyjących nie będzie usprawiedliwiony przed tobą."
  tags: []
"Ps143,3":
  text: "Nieprzyjaciel bowiem prześladuje moją duszę, powalił na ziemię moje życie; sprawił, że muszę mieszkać w ciemności jak dawno umarły."
  tags: []
"Ps143,4":
  text: "I mój duch jest zdruzgotany we mnie, serce we mnie niszczeje."
  tags: []
"Ps143,5":
  text: "Wspominam dawne dni, rozmyślam o wszystkich twoich dziełach i rozważam czyny twoich rąk."
  tags: []
"Ps143,6":
  text: "Wyciągam ku tobie swoje ręce; moja dusza pragnie ciebie jak sucha ziemia. Sela."
  tags: []
"Ps143,7":
  text: "Wysłuchaj mnie prędko, PANIE; mój duch omdlewa; nie ukrywaj przede mną swego oblicza, bym się nie stał jak ci, którzy schodzą do dołu."
  tags: []
"Ps143,8":
  text: "Spraw, abym rano słyszał o twoim miłosierdziu, bo tobie ufam; oznajmij mi drogę, którą mam chodzić, bo do ciebie wznoszę moją duszę."
  tags: []
"Ps143,9":
  text: "Ocal mnie od moich wrogów, PANIE; do ciebie się uciekam."
  tags: []
"Ps143,10":
  text: "Naucz mnie czynić twoją wolę, bo ty jesteś moim Bogiem; twój duch jest dobry; prowadź mnie do ziemi prawości."
  tags: []
"Ps143,11":
  text: "Ożyw mnie, PANIE, dla twojego imienia; ze względu na twoją sprawiedliwość wyprowadź moją duszę z utrapienia."
  tags: []
"Ps143,12":
  text: "W swoim miłosierdziu wytrać moich wrogów i zgładź wszystkich przeciwników mojej duszy, bo jestem twoim sługą."
  tags: []
