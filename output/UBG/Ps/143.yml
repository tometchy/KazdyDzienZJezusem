"Ps143,1": "PANIE, wysłuchaj mojej modlitwy i nadstaw ucha na moje prośby; wysłuchaj mnie w swojej wierności i sprawiedliwości."
"Ps143,2": "A nie stawiaj przed sądem swojego sługi, bo nikt z żyjących nie będzie usprawiedliwiony przed tobą."
"Ps143,3": "Nieprzyjaciel bowiem prześladuje moją duszę, powalił na ziemię moje życie; sprawił, że muszę mieszkać w ciemności jak dawno umarły."
"Ps143,4": "I mój duch jest zdruzgotany we mnie, serce we mnie niszczeje."
"Ps143,5": "Wspominam dawne dni, rozmyślam o wszystkich twoich dziełach i rozważam czyny twoich rąk."
"Ps143,6": "Wyciągam ku tobie swoje ręce; moja dusza pragnie ciebie jak sucha ziemia. Sela."
"Ps143,7": "Wysłuchaj mnie prędko, PANIE; mój duch omdlewa; nie ukrywaj przede mną swego oblicza, bym się nie stał jak ci, którzy schodzą do dołu."
"Ps143,8": "Spraw, abym rano słyszał o twoim miłosierdziu, bo tobie ufam; oznajmij mi drogę, którą mam chodzić, bo do ciebie wznoszę moją duszę."
"Ps143,9": "Ocal mnie od moich wrogów, PANIE; do ciebie się uciekam."
"Ps143,10": "Naucz mnie czynić twoją wolę, bo ty jesteś moim Bogiem; twój duch jest dobry; prowadź mnie do ziemi prawości."
"Ps143,11": "Ożyw mnie, PANIE, dla twojego imienia; ze względu na twoją sprawiedliwość wyprowadź moją duszę z utrapienia."
"Ps143,12": "W swoim miłosierdziu wytrać moich wrogów i zgładź wszystkich przeciwników mojej duszy, bo jestem twoim sługą."
