"Ps133,1":
  text: "Oto jak dobrze i jak miło, gdy bracia zgodnie mieszkają."
  tags: []
"Ps133,2":
  text: "Jest to jak wyborny olejek na głowę, który spływa na brodę, na brodę Aarona; który spływa na brzeg jego szat;"
  tags: []
"Ps133,3":
  text: "Jak rosa Hermonu, która opada na góry Syjon; tam bowiem PAN daje błogosławieństwo i życie na wieki."
  tags: []
