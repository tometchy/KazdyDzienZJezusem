"Ps97,1":
  text: "PAN króluje, raduj się, ziemio, i weselcie się, niezliczone wyspy!"
  tags: []
"Ps97,2":
  text: "Chmury i ciemność wokół niego, sprawiedliwość i sąd podstawą jego tronu."
  tags: []
"Ps97,3":
  text: "Ogień idzie przed nim i pożera jego wrogów wokoło."
  tags: []
"Ps97,4":
  text: "Jego błyskawice oświetlają świat, widzi to ziemia i drży."
  tags: []
"Ps97,5":
  text: "Góry topią się jak wosk przed obliczem PANA, przed obliczem Pana całej ziemi."
  tags: []
"Ps97,6":
  text: "Niebiosa opowiadają jego sprawiedliwość, a wszystkie narody widzą jego chwałę."
  tags: []
"Ps97,7":
  text: "Niech będą zawstydzeni wszyscy, którzy służą posągom, którzy chlubią się bożkami; oddajcie mu pokłon, wszyscy bogowie."
  tags: []
"Ps97,8":
  text: "Syjon to usłyszał i weseli się, a córki Judy będą się radować z powodu twoich sądów, PANIE!"
  tags: []
"Ps97,9":
  text: "Ty bowiem, PANIE, jesteś Najwyższy na całej ziemi, wywyższony ponad wszystkich bogów."
  tags: []
"Ps97,10":
  text: "Wy, którzy miłujecie PANA, miejcie w nienawiści zło; on strzeże dusz swoich świętych, ocala ich z ręki niegodziwych."
  tags: []
"Ps97,11":
  text: "Światło jest zasiane dla sprawiedliwego i radość dla tych, którzy są prawego serca."
  tags: []
"Ps97,12":
  text: "Weselcie się w PANU, sprawiedliwi, i wysławiajcie go, pamiętając o jego świętości."
  tags: []
