"Ps97,1": "PAN króluje, raduj się, ziemio, i weselcie się, niezliczone wyspy!"
"Ps97,2": "Chmury i ciemność wokół niego, sprawiedliwość i sąd podstawą jego tronu."
"Ps97,3": "Ogień idzie przed nim i pożera jego wrogów wokoło."
"Ps97,4": "Jego błyskawice oświetlają świat, widzi to ziemia i drży."
"Ps97,5": "Góry topią się jak wosk przed obliczem PANA, przed obliczem Pana całej ziemi."
"Ps97,6": "Niebiosa opowiadają jego sprawiedliwość, a wszystkie narody widzą jego chwałę."
"Ps97,7": "Niech będą zawstydzeni wszyscy, którzy służą posągom, którzy chlubią się bożkami; oddajcie mu pokłon, wszyscy bogowie."
"Ps97,8": "Syjon to usłyszał i weseli się, a córki Judy będą się radować z powodu twoich sądów, PANIE!"
"Ps97,9": "Ty bowiem, PANIE, jesteś Najwyższy na całej ziemi, wywyższony ponad wszystkich bogów."
"Ps97,10": "Wy, którzy miłujecie PANA, miejcie w nienawiści zło; on strzeże dusz swoich świętych, ocala ich z ręki niegodziwych."
"Ps97,11": "Światło jest zasiane dla sprawiedliwego i radość dla tych, którzy są prawego serca."
"Ps97,12": "Weselcie się w PANU, sprawiedliwi, i wysławiajcie go, pamiętając o jego świętości."
