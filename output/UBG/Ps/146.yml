"Ps146,1": "Alleluja. Chwal, duszo moja, PANA."
"Ps146,2": "Będę chwalić PANA, póki żyję; będę śpiewał memu Bogu, póki będę istniał."
"Ps146,3": "Nie pokładajcie ufności we władcach ani w żadnym synu ludzkim, u którego nie ma wybawienia."
"Ps146,4": "Opuszcza go duch i wraca do swojej ziemi; w tymże dniu zginą wszystkie jego myśli."
"Ps146,5": "Błogosławiony ten, kogo pomocą jest Bóg Jakuba, kto nadzieję pokłada w PANU, jego Bogu;"
"Ps146,6": "Który uczynił niebo i ziemię, morze i wszystko, co w nich jest; który dochowuje prawdy na wieki;"
"Ps146,7": "Który oddaje sprawiedliwość pokrzywdzonym i daje chleb głodnym; PAN uwalnia więźniów."
"Ps146,8": "PAN otwiera oczy ślepych; PAN podnosi przygnębionych; PAN miłuje sprawiedliwych."
"Ps146,9": "PAN strzeże przychodniów, wspomaga sierotę i wdowę, ale krzyżuje drogę niegodziwych."
"Ps146,10": "PAN będzie królował na wieki, twój Bóg, o Syjonie, z pokolenia na pokolenie. Alleluja."
