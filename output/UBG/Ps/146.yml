"Ps146,1":
  text: "Alleluja. Chwal, duszo moja, PANA."
  tags: []
"Ps146,2":
  text: "Będę chwalić PANA, póki żyję; będę śpiewał memu Bogu, póki będę istniał."
  tags: []
"Ps146,3":
  text: "Nie pokładajcie ufności we władcach ani w żadnym synu ludzkim, u którego nie ma wybawienia."
  tags: []
"Ps146,4":
  text: "Opuszcza go duch i wraca do swojej ziemi; w tymże dniu zginą wszystkie jego myśli."
  tags: []
"Ps146,5":
  text: "Błogosławiony ten, kogo pomocą jest Bóg Jakuba, kto nadzieję pokłada w PANU, jego Bogu;"
  tags: []
"Ps146,6":
  text: "Który uczynił niebo i ziemię, morze i wszystko, co w nich jest; który dochowuje prawdy na wieki;"
  tags: []
"Ps146,7":
  text: "Który oddaje sprawiedliwość pokrzywdzonym i daje chleb głodnym; PAN uwalnia więźniów."
  tags: []
"Ps146,8":
  text: "PAN otwiera oczy ślepych; PAN podnosi przygnębionych; PAN miłuje sprawiedliwych."
  tags: []
"Ps146,9":
  text: "PAN strzeże przychodniów, wspomaga sierotę i wdowę, ale krzyżuje drogę niegodziwych."
  tags: []
"Ps146,10":
  text: "PAN będzie królował na wieki, twój Bóg, o Syjonie, z pokolenia na pokolenie. Alleluja."
  tags: []
