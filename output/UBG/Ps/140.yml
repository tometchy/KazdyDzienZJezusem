"Ps140,1":
  text: "Wybaw mnie, PANIE, od złego człowieka; strzeż mnie od okrutnika;"
  tags: []
"Ps140,2":
  text: "Od tych, którzy knują w sercu złe rzeczy, każdego dnia zbierają się na wojnę."
  tags: []
"Ps140,3":
  text: "Wyostrzają swe języki jak węże, jad żmii pod ich wargami. Sela."
  tags: []
"Ps140,4":
  text: "Zachowaj mnie, PANIE, od rąk niegodziwego, strzeż mnie od okrutnika; od tych, którzy postanowili zwalić mnie z nóg."
  tags: []
"Ps140,5":
  text: "Pyszni zastawili na mnie sidła i przygotowali powrozy; rozciągnęli sieci przy ścieżce; zastawili na mnie pułapkę. Sela."
  tags: []
"Ps140,6":
  text: "Powiedziałem PANU: Ty jesteś moim Bogiem; wysłuchaj, PANIE, głosu moich błagań."
  tags: []
"Ps140,7":
  text: "Panie BOŻE, mocy mego zbawienia, który osłaniasz moją głowę w dniu bitwy;"
  tags: []
"Ps140,8":
  text: "Nie spełniaj, PANIE, pragnień niegodziwego; nie wspomagaj jego złych zamysłów, aby się nie podniósł. Sela."
  tags: []
"Ps140,9":
  text: "Niech nieprawość ich własnych warg okryje wodza tych, którzy mnie otoczyli."
  tags: []
"Ps140,10":
  text: "Niech na nich spadną rozżarzone węgle; niech będą wrzuceni do ognia i do głębokich dołów, by już nie powstali."
  tags: []
"Ps140,11":
  text: "Niech oszczerca nie będzie utwierdzony na ziemi, a człowiek okrutny upadnie przygnieciony złem."
  tags: []
"Ps140,12":
  text: "Wiem, że PAN ujmie się za strapionym i pomści krzywdę nędzarzy."
  tags: []
"Ps140,13":
  text: "Zaprawdę sprawiedliwi będą wysławiać twoje imię, a prawi będą mieszkać przed twoim obliczem."
  tags: []
