"Ps140,1": "Wybaw mnie, PANIE, od złego człowieka; strzeż mnie od okrutnika;"
"Ps140,2": "Od tych, którzy knują w sercu złe rzeczy, każdego dnia zbierają się na wojnę."
"Ps140,3": "Wyostrzają swe języki jak węże, jad żmii pod ich wargami. Sela."
"Ps140,4": "Zachowaj mnie, PANIE, od rąk niegodziwego, strzeż mnie od okrutnika; od tych, którzy postanowili zwalić mnie z nóg."
"Ps140,5": "Pyszni zastawili na mnie sidła i przygotowali powrozy; rozciągnęli sieci przy ścieżce; zastawili na mnie pułapkę. Sela."
"Ps140,6": "Powiedziałem PANU: Ty jesteś moim Bogiem; wysłuchaj, PANIE, głosu moich błagań."
"Ps140,7": "Panie BOŻE, mocy mego zbawienia, który osłaniasz moją głowę w dniu bitwy;"
"Ps140,8": "Nie spełniaj, PANIE, pragnień niegodziwego; nie wspomagaj jego złych zamysłów, aby się nie podniósł. Sela."
"Ps140,9": "Niech nieprawość ich własnych warg okryje wodza tych, którzy mnie otoczyli."
"Ps140,10": "Niech na nich spadną rozżarzone węgle; niech będą wrzuceni do ognia i do głębokich dołów, by już nie powstali."
"Ps140,11": "Niech oszczerca nie będzie utwierdzony na ziemi, a człowiek okrutny upadnie przygnieciony złem."
"Ps140,12": "Wiem, że PAN ujmie się za strapionym i pomści krzywdę nędzarzy."
"Ps140,13": "Zaprawdę sprawiedliwi będą wysławiać twoje imię, a prawi będą mieszkać przed twoim obliczem."
