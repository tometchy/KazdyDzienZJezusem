"Ps19,1":
  text: "Niebiosa głoszą chwałę Boga, a firmament obwieszcza dzieło jego rąk."
  tags: []
"Ps19,2":
  text: "Dzień dniowi opowiada słowo, a noc nocy oznajmia wiedzę."
  tags: []
"Ps19,3":
  text: "Nie ma języka ani mowy, w których nie słychać ich głosu."
  tags: []
"Ps19,4":
  text: "Ich zasięg rozchodzi się po całej ziemi i na krańce świata ich słowa. Na nich wystawił namiot słońcu."
  tags: []
"Ps19,5":
  text: "A ono wychodzi jak oblubieniec ze swojej komnaty, cieszy się jak mocarz, który rozpoczyna bieg."
  tags: []
"Ps19,6":
  text: "Wyrusza z jednego krańca nieba i obchodzi je aż na drugi kraniec, a nic nie ukryje się przed jego żarem."
  tags: []
"Ps19,7":
  text: "Prawo PANA jest doskonałe, nawracające duszę; świadectwo PANA pewne, dające mądrość prostemu."
  tags: []
"Ps19,8":
  text: "Nakazy PANA są prawe, radujące serce; przykazanie PANA czyste, oświecające oczy."
  tags: []
"Ps19,9":
  text: "Bojaźń PANA jest czysta, trwająca na wieki; sądy PANA prawdziwe, wszystkie są słuszne."
  tags: []
"Ps19,10":
  text: "Bardziej pożądane niż złoto, niż mnóstwo szczerego złota, i słodsze niż miód, nawet niż plaster miodu."
  tags: []
"Ps19,11":
  text: "Także twój sługa jest przez nie pouczony, a kto ich przestrzega, otrzymuje wielką nagrodę."
  tags: []
"Ps19,12":
  text: "Lecz kto dostrzeże własne błędy? Oczyść mnie z tych, które są ukryte przede mną."
  tags: []
"Ps19,13":
  text: "Chroń też swego sługę od zuchwałych grzechów, aby nie panowały nade mną. Wtedy będę nienaganny i wolny od wielkiego przestępstwa."
  tags: []
"Ps19,14":
  text: "Niech będą ci miłe słowa moich ust i rozmyślanie mego serca, PANIE, moja Skało i mój Odkupicielu!"
  tags: []
