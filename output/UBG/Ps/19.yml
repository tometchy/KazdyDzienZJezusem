"Ps19,1": "Niebiosa głoszą chwałę Boga, a firmament obwieszcza dzieło jego rąk."
"Ps19,2": "Dzień dniowi opowiada słowo, a noc nocy oznajmia wiedzę."
"Ps19,3": "Nie ma języka ani mowy, w których nie słychać ich głosu."
"Ps19,4": "Ich zasięg rozchodzi się po całej ziemi i na krańce świata ich słowa. Na nich wystawił namiot słońcu."
"Ps19,5": "A ono wychodzi jak oblubieniec ze swojej komnaty, cieszy się jak mocarz, który rozpoczyna bieg."
"Ps19,6": "Wyrusza z jednego krańca nieba i obchodzi je aż na drugi kraniec, a nic nie ukryje się przed jego żarem."
"Ps19,7": "Prawo PANA jest doskonałe, nawracające duszę; świadectwo PANA pewne, dające mądrość prostemu."
"Ps19,8": "Nakazy PANA są prawe, radujące serce; przykazanie PANA czyste, oświecające oczy."
"Ps19,9": "Bojaźń PANA jest czysta, trwająca na wieki; sądy PANA prawdziwe, wszystkie są słuszne."
"Ps19,10": "Bardziej pożądane niż złoto, niż mnóstwo szczerego złota, i słodsze niż miód, nawet niż plaster miodu."
"Ps19,11": "Także twój sługa jest przez nie pouczony, a kto ich przestrzega, otrzymuje wielką nagrodę."
"Ps19,12": "Lecz kto dostrzeże własne błędy? Oczyść mnie z tych, które są ukryte przede mną."
"Ps19,13": "Chroń też swego sługę od zuchwałych grzechów, aby nie panowały nade mną. Wtedy będę nienaganny i wolny od wielkiego przestępstwa."
"Ps19,14": "Niech będą ci miłe słowa moich ust i rozmyślanie mego serca, PANIE, moja Skało i mój Odkupicielu!"
