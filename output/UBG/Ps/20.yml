"Ps20,1": "Niech cię wysłucha PAN w dniu utrapienia, niech cię chroni imię Boga Jakuba."
"Ps20,2": "Niech ci ześle pomoc ze świątyni i niech cię wesprze z Syjonu."
"Ps20,3": "Niech pamięta wszystkie twoje ofiary i niech przyjmie twoje całopalenia. Sela."
"Ps20,4": "Niech da ci wszystko, czego pragnie twoje serce, i każdy twój zamysł niech wypełni."
"Ps20,5": "Będziemy się radować z twojego zbawienia i w imię naszego Boga sztandary podniesiemy. Niech PAN spełni wszystkie twoje prośby."
"Ps20,6": "Teraz wiem, że PAN wybawia swego pomazańca, wysłucha go ze swego świętego nieba zbawczą mocą swojej prawicy."
"Ps20,7": "Jedni pokładają ufność w rydwanach, inni w koniach, lecz my będziemy wspominać imię PANA, naszego Boga."
"Ps20,8": "Tamci zachwiali się i upadli, a my powstaliśmy i ostoimy się."
"Ps20,9": "PANIE, wybaw nas, a król niech nas wysłucha w dniu naszego wołania."
