"Ps131,1":
  text: "PANIE, moje serce nie wywyższa się i moje oczy nie są wyniosłe ani nie ubiegam się o wielkie rzeczy albo zbyt cudowne dla mnie."
  tags: []
"Ps131,2":
  text: "Doprawdy uciszyłem i uspokoiłem swoją duszę jak dziecko odstawione od piersi swej matki; moja dusza jest jak dziecko odstawione."
  tags: []
"Ps131,3":
  text: "Niech Izrael pokłada nadzieję w PANU odtąd na wieki."
  tags: []
