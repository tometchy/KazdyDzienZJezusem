"Ps27,1": "PAN jest moją światłością i moim zbawieniem, kogóż będę się bać? PAN jest mocą mego życia, kogóż mam się lękać?"
"Ps27,2": "Gdy złoczyńcy, moi przeciwnicy i wrogowie, wystąpili przeciwko mnie, aby pożreć moje ciało, potknęli się i upadli."
"Ps27,3": "Choćby wojsko rozbiło naprzeciw mnie obóz, moje serce się nie ulęknie; choćby wojna wybuchła przeciw mnie, nawet wtedy będę ufał."
"Ps27,4": "O jedno proszę PANA i o to będę zabiegał: abym mieszkał w domu PANA po wszystkie dni mego życia, abym oglądał piękno PANA i dowiadywał się w jego świątyni."
"Ps27,5": "Skryje mnie bowiem w dniu niedoli w swoim przybytku, schowa mnie w ukryciu swego namiotu i wyniesie mnie na skałę."
"Ps27,6": "A teraz moja głowa będzie wzniesiona nad moimi nieprzyjaciółmi, którzy mnie otaczają; będę składał w jego przybytku ofiary radości, będę śpiewał i oddawał PANU chwałę."
"Ps27,7": "Usłysz, PANIE, mój głos, gdy wołam; zmiłuj się nade mną i wysłuchaj mnie."
"Ps27,8": "Gdy mówiłeś: Szukajcie mojego oblicza, moje serce mówiło do ciebie: Twojego oblicza, PANIE, będę szukać."
"Ps27,9": "Nie ukrywaj przede mną twojego oblicza ani nie odtrącaj w gniewie swego sługi; ty jesteś moją pomocą, nie opuszczaj mnie i nie odchodź, Boże mego zbawienia."
"Ps27,10": "Choćby ojciec i matka opuścili mnie, to PAN mnie przygarnie."
"Ps27,11": "Naucz mnie, PANIE, twojej drogi i prowadź mnie ścieżką prostą ze względu na moich wrogów."
"Ps27,12": "Nie wydawaj mnie na pastwę moich nieprzyjaciół, bo powstali przeciwko mnie fałszywi świadkowie i ci, którzy dyszą okrucieństwem."
"Ps27,13": "Zniechęciłbym się, gdybym nie wierzył, że będę oglądał dobroć PANA w ziemi żyjących."
"Ps27,14": "Oczekuj PANA, bądź dzielny, a on umocni twoje serce; oczekuj więc PANA."
