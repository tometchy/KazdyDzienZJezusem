"Ps27,1":
  text: "PAN jest moją światłością i moim zbawieniem, kogóż będę się bać? PAN jest mocą mego życia, kogóż mam się lękać?"
  tags: []
"Ps27,2":
  text: "Gdy złoczyńcy, moi przeciwnicy i wrogowie, wystąpili przeciwko mnie, aby pożreć moje ciało, potknęli się i upadli."
  tags: []
"Ps27,3":
  text: "Choćby wojsko rozbiło naprzeciw mnie obóz, moje serce się nie ulęknie; choćby wojna wybuchła przeciw mnie, nawet wtedy będę ufał."
  tags: []
"Ps27,4":
  text: "O jedno proszę PANA i o to będę zabiegał: abym mieszkał w domu PANA po wszystkie dni mego życia, abym oglądał piękno PANA i dowiadywał się w jego świątyni."
  tags: []
"Ps27,5":
  text: "Skryje mnie bowiem w dniu niedoli w swoim przybytku, schowa mnie w ukryciu swego namiotu i wyniesie mnie na skałę."
  tags: []
"Ps27,6":
  text: "A teraz moja głowa będzie wzniesiona nad moimi nieprzyjaciółmi, którzy mnie otaczają; będę składał w jego przybytku ofiary radości, będę śpiewał i oddawał PANU chwałę."
  tags: []
"Ps27,7":
  text: "Usłysz, PANIE, mój głos, gdy wołam; zmiłuj się nade mną i wysłuchaj mnie."
  tags: []
"Ps27,8":
  text: "Gdy mówiłeś: Szukajcie mojego oblicza, moje serce mówiło do ciebie: Twojego oblicza, PANIE, będę szukać."
  tags: []
"Ps27,9":
  text: "Nie ukrywaj przede mną twojego oblicza ani nie odtrącaj w gniewie swego sługi; ty jesteś moją pomocą, nie opuszczaj mnie i nie odchodź, Boże mego zbawienia."
  tags: []
"Ps27,10":
  text: "Choćby ojciec i matka opuścili mnie, to PAN mnie przygarnie."
  tags: []
"Ps27,11":
  text: "Naucz mnie, PANIE, twojej drogi i prowadź mnie ścieżką prostą ze względu na moich wrogów."
  tags: []
"Ps27,12":
  text: "Nie wydawaj mnie na pastwę moich nieprzyjaciół, bo powstali przeciwko mnie fałszywi świadkowie i ci, którzy dyszą okrucieństwem."
  tags: []
"Ps27,13":
  text: "Zniechęciłbym się, gdybym nie wierzył, że będę oglądał dobroć PANA w ziemi żyjących."
  tags: []
"Ps27,14":
  text: "Oczekuj PANA, bądź dzielny, a on umocni twoje serce; oczekuj więc PANA."
  tags: []
