"Ps46,1": "Bóg jest naszą ucieczką i siłą, najpewniejszą pomocą w utrapieniu."
"Ps46,2": "Dlatego nie będziemy się bać, choćby się poruszyła ziemia, choćby się przeniosły góry w sam środek morza;"
"Ps46,3": "Choćby huczały i burzyły się jego wody i zatrzęsły się góry od jego nawałnicy. Sela."
"Ps46,4": "Jest rzeka, której strumienie rozweselają miasto Boże, miejsce święte przybytków Najwyższego."
"Ps46,5": "Bóg jest pośrodku niego, nie będzie zachwiane; Bóg je wspomoże zaraz o świcie."
"Ps46,6": "Wzburzyły się narody, zachwiały się królestwa, on wydał swój głos i rozpłynęła się ziemia."
"Ps46,7": "PAN zastępów jest z nami; Bóg Jakuba jest naszą twierdzą. Sela."
"Ps46,8": "Chodźcie, zobaczcie dzieła PANA, jakie spustoszenia uczynił na ziemi."
"Ps46,9": "On kładzie kres wojnom aż po krańce ziemi, kruszy łuki i łamie włócznie, a rydwany pali ogniem."
"Ps46,10": "Uspokójcie się i uznajcie, że ja jestem Bogiem; będę wywyższony wśród narodów, będę wywyższony na ziemi."
"Ps46,11": "PAN zastępów jest z nami, Bóg Jakuba jest naszą twierdzą. Sela."
