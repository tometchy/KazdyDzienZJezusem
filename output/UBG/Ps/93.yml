"Ps93,1":
  text: "PAN króluje, przyoblekł się w majestat, odział się PAN i przepasał potęgą; utwierdził też świat, że się nie zachwieje."
  tags: []
"Ps93,2":
  text: "Twój tron jest utwierdzony od wieków, ty jesteś od wieczności."
  tags: []
"Ps93,3":
  text: "Podniosły rzeki, PANIE, podniosły rzeki swój szum, podniosły rzeki swoje fale."
  tags: []
"Ps93,4":
  text: "Nad szum wielkich wód, nad potężne fale morskie mocniejszy jest PAN na wysokości."
  tags: []
"Ps93,5":
  text: "Twoje świadectwa są bardzo pewne; twemu domowi, PANIE, przystoi świętość na wieczne czasy."
  tags: []
