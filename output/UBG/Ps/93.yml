"Ps93,1": "PAN króluje, przyoblekł się w majestat, odział się PAN i przepasał potęgą; utwierdził też świat, że się nie zachwieje."
"Ps93,2": "Twój tron jest utwierdzony od wieków, ty jesteś od wieczności."
"Ps93,3": "Podniosły rzeki, PANIE, podniosły rzeki swój szum, podniosły rzeki swoje fale."
"Ps93,4": "Nad szum wielkich wód, nad potężne fale morskie mocniejszy jest PAN na wysokości."
"Ps93,5": "Twoje świadectwa są bardzo pewne; twemu domowi, PANIE, przystoi świętość na wieczne czasy."
