"Ps2,1":
  text: "Dlaczego poganie się buntują, a narody knują próżne zamysły?"
  tags: []
"Ps2,2":
  text: "Królowie ziemscy powstają, a władcy naradzają się wspólnie przeciwko PANU i jego pomazańcowi, mówiąc:"
  tags: []
"Ps2,3":
  text: "Zerwijmy ich więzy i zrzućmy z siebie ich pęta."
  tags: []
"Ps2,4":
  text: "Lecz ten, który mieszka w niebie, będzie się śmiał, Pan będzie z nich szydził."
  tags: []
"Ps2,5":
  text: "Wtedy przemówi do nich w swoim gniewie i swą zapalczywością ich zatrwoży:"
  tags: []
"Ps2,6":
  text: "Ja ustanowiłem mojego króla na Syjonie, mojej świętej górze."
  tags: []
"Ps2,7":
  text: "Ogłoszę dekret: PAN powiedział do mnie: Ty jesteś moim Synem, ja ciebie dziś zrodziłem."
  tags: []
"Ps2,8":
  text: "Poproś mnie, a dam ci narody w dziedzictwo i krańce ziemi na własność."
  tags: []
"Ps2,9":
  text: "Potłuczesz je laską żelazną, jak naczynie gliniane je pokruszysz."
  tags: []
"Ps2,10":
  text: "Teraz więc, królowie, zrozumcie, przyjmijcie pouczenie, sędziowie ziemi!"
  tags: []
"Ps2,11":
  text: "Służcie PANU z bojaźnią i radujcie się z drżeniem."
  tags: []
"Ps2,12":
  text: "Pocałujcie Syna, by się nie rozgniewał i abyście nie zginęli w drodze, gdyby jego gniew choć trochę się zapalił. Błogosławieni wszyscy, którzy mu ufają."
  tags: []
