"Ps2,1": "Dlaczego poganie się buntują, a narody knują próżne zamysły?"
"Ps2,2": "Królowie ziemscy powstają, a władcy naradzają się wspólnie przeciwko PANU i jego pomazańcowi, mówiąc:"
"Ps2,3": "Zerwijmy ich więzy i zrzućmy z siebie ich pęta."
"Ps2,4": "Lecz ten, który mieszka w niebie, będzie się śmiał, Pan będzie z nich szydził."
"Ps2,5": "Wtedy przemówi do nich w swoim gniewie i swą zapalczywością ich zatrwoży:"
"Ps2,6": "Ja ustanowiłem mojego króla na Syjonie, mojej świętej górze."
"Ps2,7": "Ogłoszę dekret: PAN powiedział do mnie: Ty jesteś moim Synem, ja ciebie dziś zrodziłem."
"Ps2,8": "Poproś mnie, a dam ci narody w dziedzictwo i krańce ziemi na własność."
"Ps2,9": "Potłuczesz je laską żelazną, jak naczynie gliniane je pokruszysz."
"Ps2,10": "Teraz więc, królowie, zrozumcie, przyjmijcie pouczenie, sędziowie ziemi!"
"Ps2,11": "Służcie PANU z bojaźnią i radujcie się z drżeniem."
"Ps2,12": "Pocałujcie Syna, by się nie rozgniewał i abyście nie zginęli w drodze, gdyby jego gniew choć trochę się zapalił. Błogosławieni wszyscy, którzy mu ufają."
