"Ps92,1":
  text: "Dobrą rzeczą jest wysławiać PANA i śpiewać twemu imieniu, o Najwyższy."
  tags: []
"Ps92,2":
  text: "Głosić rankiem twoje miłosierdzie, a nocami twoją wierność;"
  tags: []
"Ps92,3":
  text: "Na instrumencie o dziesięciu strunach, na cytrze i na harfie ze śpiewaniem."
  tags: []
"Ps92,4":
  text: "Ty bowiem rozradowałeś mnie, PANIE, twymi czynami; będę śpiewać o dziełach twoich rąk."
  tags: []
"Ps92,5":
  text: "Jakże wielkie są twoje dzieła, PANIE; bardzo głębokie są twoje myśli."
  tags: []
"Ps92,6":
  text: "Prostak nie zna, a głupi tego nie rozumie:"
  tags: []
"Ps92,7":
  text: "Gdy niegodziwi wyrastają jak ziele i kwitną wszyscy czyniący nieprawość, to tylko po to, aby byli wykorzenieni aż na wieki;"
  tags: []
"Ps92,8":
  text: "Ty zaś, PANIE, jesteś Najwyższy na wieki."
  tags: []
"Ps92,9":
  text: "Oto bowiem twoi wrogowie, PANIE, oto bowiem twoi wrogowie zginą, rozproszą się wszyscy czyniący nieprawość."
  tags: []
"Ps92,10":
  text: "Ale mój róg wzniesiesz jak u jednorożca, będę namaszczony świeżym olejem."
  tags: []
"Ps92,11":
  text: "I moje oko zobaczy nieszczęście tych, którzy na mnie czyhają; moje uszy usłyszą o klęsce złoczyńców, którzy powstają przeciwko mnie."
  tags: []
"Ps92,12":
  text: "Sprawiedliwy zakwitnie jak palma, rozrośnie się jak cedr na Libanie."
  tags: []
"Ps92,13":
  text: "Zasadzeni w domu PANA rozkwitną na dziedzińcach naszego Boga."
  tags: []
"Ps92,14":
  text: "Nawet w starości wydadzą owoc, pełni sił i kwitnący;"
  tags: []
"Ps92,15":
  text: "Aby opowiadać, że PAN jest prawy; on jest moją skałą i nie ma w nim żadnej nieprawości."
  tags: []
