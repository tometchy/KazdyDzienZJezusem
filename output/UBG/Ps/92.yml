"Ps92,1": "Dobrą rzeczą jest wysławiać PANA i śpiewać twemu imieniu, o Najwyższy."
"Ps92,2": "Głosić rankiem twoje miłosierdzie, a nocami twoją wierność;"
"Ps92,3": "Na instrumencie o dziesięciu strunach, na cytrze i na harfie ze śpiewaniem."
"Ps92,4": "Ty bowiem rozradowałeś mnie, PANIE, twymi czynami; będę śpiewać o dziełach twoich rąk."
"Ps92,5": "Jakże wielkie są twoje dzieła, PANIE; bardzo głębokie są twoje myśli."
"Ps92,6": "Prostak nie zna, a głupi tego nie rozumie:"
"Ps92,7": "Gdy niegodziwi wyrastają jak ziele i kwitną wszyscy czyniący nieprawość, to tylko po to, aby byli wykorzenieni aż na wieki;"
"Ps92,8": "Ty zaś, PANIE, jesteś Najwyższy na wieki."
"Ps92,9": "Oto bowiem twoi wrogowie, PANIE, oto bowiem twoi wrogowie zginą, rozproszą się wszyscy czyniący nieprawość."
"Ps92,10": "Ale mój róg wzniesiesz jak u jednorożca, będę namaszczony świeżym olejem."
"Ps92,11": "I moje oko zobaczy nieszczęście tych, którzy na mnie czyhają; moje uszy usłyszą o klęsce złoczyńców, którzy powstają przeciwko mnie."
"Ps92,12": "Sprawiedliwy zakwitnie jak palma, rozrośnie się jak cedr na Libanie."
"Ps92,13": "Zasadzeni w domu PANA rozkwitną na dziedzińcach naszego Boga."
"Ps92,14": "Nawet w starości wydadzą owoc, pełni sił i kwitnący;"
"Ps92,15": "Aby opowiadać, że PAN jest prawy; on jest moją skałą i nie ma w nim żadnej nieprawości."
