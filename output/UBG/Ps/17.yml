"Ps17,1":
  text: "Wysłuchaj, PANIE, mojej słusznej sprawy, zważ na moje wołanie, nakłoń ucha na modlitwę moich nieobłudnych ust."
  tags: []
"Ps17,2":
  text: "Niech wyrok o mnie wyjdzie sprzed twego oblicza, niech twoje oczy widzą to, co słuszne."
  tags: []
"Ps17,3":
  text: "Doświadczyłeś moje serce, nawiedziłeś mnie nocą, wypróbowałeś mnie ogniem, ale nic nie znalazłeś. Postanowiłem, że moje usta nie zgrzeszą."
  tags: []
"Ps17,4":
  text: "Co się tyczy spraw ludzkich, dzięki słowom twoich ust wystrzegałem się dróg okrutnika."
  tags: []
"Ps17,5":
  text: "Zatrzymaj moje kroki na twoich drogach, aby nie zachwiały się moje nogi."
  tags: []
"Ps17,6":
  text: "Wzywam cię, Boże, bo mnie wysłuchasz. Nakłoń ku mnie swego ucha, wysłuchaj moich słów."
  tags: []
"Ps17,7":
  text: "Okaż swoje miłosierdzie, ty, który wybawiasz ufających tobie od tych, którzy powstają przeciwko twojej prawicy."
  tags: []
"Ps17,8":
  text: "Strzeż mnie jak źrenicy oka, ukryj mnie w cieniu swych skrzydeł;"
  tags: []
"Ps17,9":
  text: "Przed niegodziwymi, którzy mnie gnębią, przed wrogami mojej duszy, którzy mnie osaczyli."
  tags: []
"Ps17,10":
  text: "Okryli się swoim tłuszczem, zuchwale mówią swymi ustami."
  tags: []
"Ps17,11":
  text: "Gdziekolwiek idziemy, otaczają nas, wytężają swój wzrok, aby nas powalić na ziemię."
  tags: []
"Ps17,12":
  text: "Podobni są do lwa żądnego łupu, do lwiątka siedzącego w ukryciu."
  tags: []
"Ps17,13":
  text: "Powstań, PANIE, wystąp przeciwko niemu i powal go, swoim mieczem ocal moją duszę od niegodziwego;"
  tags: []
"Ps17,14":
  text: "A swoją ręką, PANIE, od ludzi, od ludzi tego świata, których udziałem jest to życie, a których brzuchy napełniasz swymi skarbami, tak że nasyceni są nawet ich synowie, a resztę zostawiają ich dzieciom."
  tags: []
"Ps17,15":
  text: "Ja zaś w sprawiedliwości ujrzę twe oblicze, a gdy się obudzę, nasycę się twoim podobieństwem."
  tags: []
