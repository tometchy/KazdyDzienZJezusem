"Ps17,1": "Wysłuchaj, PANIE, mojej słusznej sprawy, zważ na moje wołanie, nakłoń ucha na modlitwę moich nieobłudnych ust."
"Ps17,2": "Niech wyrok o mnie wyjdzie sprzed twego oblicza, niech twoje oczy widzą to, co słuszne."
"Ps17,3": "Doświadczyłeś moje serce, nawiedziłeś mnie nocą, wypróbowałeś mnie ogniem, ale nic nie znalazłeś. Postanowiłem, że moje usta nie zgrzeszą."
"Ps17,4": "Co się tyczy spraw ludzkich, dzięki słowom twoich ust wystrzegałem się dróg okrutnika."
"Ps17,5": "Zatrzymaj moje kroki na twoich drogach, aby nie zachwiały się moje nogi."
"Ps17,6": "Wzywam cię, Boże, bo mnie wysłuchasz. Nakłoń ku mnie swego ucha, wysłuchaj moich słów."
"Ps17,7": "Okaż swoje miłosierdzie, ty, który wybawiasz ufających tobie od tych, którzy powstają przeciwko twojej prawicy."
"Ps17,8": "Strzeż mnie jak źrenicy oka, ukryj mnie w cieniu swych skrzydeł;"
"Ps17,9": "Przed niegodziwymi, którzy mnie gnębią, przed wrogami mojej duszy, którzy mnie osaczyli."
"Ps17,10": "Okryli się swoim tłuszczem, zuchwale mówią swymi ustami."
"Ps17,11": "Gdziekolwiek idziemy, otaczają nas, wytężają swój wzrok, aby nas powalić na ziemię."
"Ps17,12": "Podobni są do lwa żądnego łupu, do lwiątka siedzącego w ukryciu."
"Ps17,13": "Powstań, PANIE, wystąp przeciwko niemu i powal go, swoim mieczem ocal moją duszę od niegodziwego;"
"Ps17,14": "A swoją ręką, PANIE, od ludzi, od ludzi tego świata, których udziałem jest to życie, a których brzuchy napełniasz swymi skarbami, tak że nasyceni są nawet ich synowie, a resztę zostawiają ich dzieciom."
"Ps17,15": "Ja zaś w sprawiedliwości ujrzę twe oblicze, a gdy się obudzę, nasycę się twoim podobieństwem."
