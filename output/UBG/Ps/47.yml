"Ps47,1": "Klaszczcie w dłonie, wszystkie narody, wykrzykujcie Bogu radosnym głosem."
"Ps47,2": "Gdyż PAN Najwyższy budzi grozę, jest wielkim Królem nad całą ziemią."
"Ps47,3": "Podda nam ludzi i narody pod nasze stopy."
"Ps47,4": "Wybrał nam nasze dziedzictwo, chlubę Jakuba, którego umiłował. Sela."
"Ps47,5": "Wstąpił Bóg wśród okrzyków, PAN przy dźwięku trąby."
"Ps47,6": "Śpiewajcie Bogu, śpiewajcie; śpiewajcie naszemu Królowi, śpiewajcie."
"Ps47,7": "Bóg bowiem jest Królem całej ziemi, śpiewajcie pieśni pouczające."
"Ps47,8": "Bóg króluje nad narodami, Bóg zasiada na swym świętym tronie."
"Ps47,9": "Władcy narodów zebrali się z ludem Boga Abrahama, bo do Boga należą tarcze ziemi; on jest wielce wywyższony."
