"Ps47,1":
  text: "Klaszczcie w dłonie, wszystkie narody, wykrzykujcie Bogu radosnym głosem."
  tags: []
"Ps47,2":
  text: "Gdyż PAN Najwyższy budzi grozę, jest wielkim Królem nad całą ziemią."
  tags: []
"Ps47,3":
  text: "Podda nam ludzi i narody pod nasze stopy."
  tags: []
"Ps47,4":
  text: "Wybrał nam nasze dziedzictwo, chlubę Jakuba, którego umiłował. Sela."
  tags: []
"Ps47,5":
  text: "Wstąpił Bóg wśród okrzyków, PAN przy dźwięku trąby."
  tags: []
"Ps47,6":
  text: "Śpiewajcie Bogu, śpiewajcie; śpiewajcie naszemu Królowi, śpiewajcie."
  tags: []
"Ps47,7":
  text: "Bóg bowiem jest Królem całej ziemi, śpiewajcie pieśni pouczające."
  tags: []
"Ps47,8":
  text: "Bóg króluje nad narodami, Bóg zasiada na swym świętym tronie."
  tags: []
"Ps47,9":
  text: "Władcy narodów zebrali się z ludem Boga Abrahama, bo do Boga należą tarcze ziemi; on jest wielce wywyższony."
  tags: []
