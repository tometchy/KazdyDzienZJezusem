"Ps26,1": "Osądź mnie, PANIE, bo postępuję uczciwie, zaufałem PANU i nie zachwieję się."
"Ps26,2": "Zbadaj mnie, PANIE, i doświadcz mnie; poddaj próbie moje nerki i serce."
"Ps26,3": "Mam bowiem twoje miłosierdzie przed oczyma i postępuję w twojej prawdzie."
"Ps26,4": "Nie zasiadałem z ludźmi próżnymi i nie zadaję się z obłudnikami."
"Ps26,5": "Nienawidzę zgromadzenia złoczyńców i z niegodziwymi nie usiądę."
"Ps26,6": "Umyję w niewinności swoje ręce i obejdę twój ołtarz, PANIE;"
"Ps26,7": "Aby wznosić głos dziękczynienia i opowiadać o wszystkich twoich cudach."
"Ps26,8": "PANIE, miłuję dom, w którym mieszkasz, i miejsce, gdzie przebywa twoja chwała."
"Ps26,9": "Nie zabieraj mojej duszy z grzesznikami ani mojego życia z krwawymi ludźmi;"
"Ps26,10": "W ich rękach jest przewrotność, a ich prawica pełna jest przekupstwa."
"Ps26,11": "Lecz ja będę postępować uczciwie, odkup mnie i zmiłuj się nade mną."
"Ps26,12": "Moja noga stoi na równej drodze, będę błogosławił PANA w zgromadzeniach."
