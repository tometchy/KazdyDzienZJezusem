"Ps26,1":
  text: "Osądź mnie, PANIE, bo postępuję uczciwie, zaufałem PANU i nie zachwieję się."
  tags: []
"Ps26,2":
  text: "Zbadaj mnie, PANIE, i doświadcz mnie; poddaj próbie moje nerki i serce."
  tags: []
"Ps26,3":
  text: "Mam bowiem twoje miłosierdzie przed oczyma i postępuję w twojej prawdzie."
  tags: []
"Ps26,4":
  text: "Nie zasiadałem z ludźmi próżnymi i nie zadaję się z obłudnikami."
  tags: []
"Ps26,5":
  text: "Nienawidzę zgromadzenia złoczyńców i z niegodziwymi nie usiądę."
  tags: []
"Ps26,6":
  text: "Umyję w niewinności swoje ręce i obejdę twój ołtarz, PANIE;"
  tags: []
"Ps26,7":
  text: "Aby wznosić głos dziękczynienia i opowiadać o wszystkich twoich cudach."
  tags: []
"Ps26,8":
  text: "PANIE, miłuję dom, w którym mieszkasz, i miejsce, gdzie przebywa twoja chwała."
  tags: []
"Ps26,9":
  text: "Nie zabieraj mojej duszy z grzesznikami ani mojego życia z krwawymi ludźmi;"
  tags: []
"Ps26,10":
  text: "W ich rękach jest przewrotność, a ich prawica pełna jest przekupstwa."
  tags: []
"Ps26,11":
  text: "Lecz ja będę postępować uczciwie, odkup mnie i zmiłuj się nade mną."
  tags: []
"Ps26,12":
  text: "Moja noga stoi na równej drodze, będę błogosławił PANA w zgromadzeniach."
  tags: []
