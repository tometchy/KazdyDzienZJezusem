"Ps95,1": "Chodźcie, śpiewajmy PANU, wykrzykujmy radośnie skale naszego zbawienia."
"Ps95,2": "Przyjdźmy przed jego oblicze z chwałą, radośnie śpiewajmy mu psalmy."
"Ps95,3": "PAN bowiem jest wielkim Bogiem i wielkim Królem nad wszystkimi bogami."
"Ps95,4": "W jego rękach są głębiny ziemi i jego są szczyty gór."
"Ps95,5": "Jego jest morze, bo on je uczynił, i jego ręce ukształtowały suchy ląd."
"Ps95,6": "Chodźcie, oddajmy pokłon i padajmy przed nim; klęknijmy przed PANEM, naszym Stwórcą."
"Ps95,7": "On bowiem jest naszym Bogiem, a my ludem jego pastwiska i owcami jego rąk. Dzisiaj, jeśli jego głos usłyszycie;"
"Ps95,8": "Nie zatwardzajcie waszych serc jak w Meriba, jak w czasie kuszenia na pustyni;"
"Ps95,9": "Kiedy mnie wystawiali na próbę wasi ojcowie, doświadczali mnie i widzieli moje dzieła."
"Ps95,10": "Przez czterdzieści lat czułem odrazę do tego pokolenia i powiedziałem: Ten lud błądzi sercem i nie poznał moich dróg;"
"Ps95,11": "Przysiągłem im w gniewie, że nie wejdą do mego odpoczynku."
