"Ps95,1":
  text: "Chodźcie, śpiewajmy PANU, wykrzykujmy radośnie skale naszego zbawienia."
  tags: []
"Ps95,2":
  text: "Przyjdźmy przed jego oblicze z chwałą, radośnie śpiewajmy mu psalmy."
  tags: []
"Ps95,3":
  text: "PAN bowiem jest wielkim Bogiem i wielkim Królem nad wszystkimi bogami."
  tags: []
"Ps95,4":
  text: "W jego rękach są głębiny ziemi i jego są szczyty gór."
  tags: []
"Ps95,5":
  text: "Jego jest morze, bo on je uczynił, i jego ręce ukształtowały suchy ląd."
  tags: []
"Ps95,6":
  text: "Chodźcie, oddajmy pokłon i padajmy przed nim; klęknijmy przed PANEM, naszym Stwórcą."
  tags: []
"Ps95,7":
  text: "On bowiem jest naszym Bogiem, a my ludem jego pastwiska i owcami jego rąk. Dzisiaj, jeśli jego głos usłyszycie;"
  tags: []
"Ps95,8":
  text: "Nie zatwardzajcie waszych serc jak w Meriba, jak w czasie kuszenia na pustyni;"
  tags: []
"Ps95,9":
  text: "Kiedy mnie wystawiali na próbę wasi ojcowie, doświadczali mnie i widzieli moje dzieła."
  tags: []
"Ps95,10":
  text: "Przez czterdzieści lat czułem odrazę do tego pokolenia i powiedziałem: Ten lud błądzi sercem i nie poznał moich dróg;"
  tags: []
"Ps95,11":
  text: "Przysiągłem im w gniewie, że nie wejdą do mego odpoczynku."
  tags: []
