"Ps83,1": "Boże, nie milcz; nie bądź głuchy i bezczynny, Boże!"
"Ps83,2": "Bo oto burzą się twoi wrogowie, a ci, którzy cię nienawidzą, podnoszą głowę."
"Ps83,3": "Przeciwko twemu ludowi knują spisek i naradzali się przeciw tym, których ochraniasz;"
"Ps83,4": "Mówiąc: Chodźcie, wytępmy ich, niech nie będą narodem, żeby więcej nie wspominano imienia Izraela."
"Ps83,5": "Zmówili się bowiem jednomyślnie, przeciwko tobie zawarli przymierze:"
"Ps83,6": "Namioty Edomitów i Izmaelitów, Moab i Hagaryci;"
"Ps83,7": "Gebal, Ammon i Amalek; Filistyni z mieszkańcami Tyru."
"Ps83,8": "Także Assur przyłączył się do nich, wsparł swym ramieniem synów Lota. Sela."
"Ps83,9": "Uczyń im tak, jak Midianitom, jak Syserze, jak Jabinowi nad potokiem Kiszon;"
"Ps83,10": "Którzy zostali wytępieni w Endor, stali się jak gnój dla ziemi."
"Ps83,11": "Z ich dostojnikami postąp jak z Orebem i Zeebem, jak z Zebachem i Salmunną, ze wszystkimi ich książętami;"
"Ps83,12": "Którzy mówili: Weźmy w posiadanie przybytki Boże."
"Ps83,13": "Mój Boże, uczyń ich jak koło i jak źdźbło na wietrze."
"Ps83,14": "Jak ogień, który pali las, i jak płomień, który wypala góry;"
"Ps83,15": "Tak ty ich ścigaj swoją nawałnicą i swoją burzą zatrwóż ich."
"Ps83,16": "Okryj ich twarze hańbą, aby szukali twego imienia, PANIE!"
"Ps83,17": "Niech się zawstydzą i zatrwożą na wieki, niech się okryją hańbą i zginą."
"Ps83,18": "Niech poznają, że jedynie ty, którego imię jest PAN, ty jesteś Najwyższy ponad całą ziemią."
