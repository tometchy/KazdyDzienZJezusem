"Ps83,1":
  text: "Boże, nie milcz; nie bądź głuchy i bezczynny, Boże!"
  tags: []
"Ps83,2":
  text: "Bo oto burzą się twoi wrogowie, a ci, którzy cię nienawidzą, podnoszą głowę."
  tags: []
"Ps83,3":
  text: "Przeciwko twemu ludowi knują spisek i naradzali się przeciw tym, których ochraniasz;"
  tags: []
"Ps83,4":
  text: "Mówiąc: Chodźcie, wytępmy ich, niech nie będą narodem, żeby więcej nie wspominano imienia Izraela."
  tags: []
"Ps83,5":
  text: "Zmówili się bowiem jednomyślnie, przeciwko tobie zawarli przymierze:"
  tags: []
"Ps83,6":
  text: "Namioty Edomitów i Izmaelitów, Moab i Hagaryci;"
  tags: []
"Ps83,7":
  text: "Gebal, Ammon i Amalek; Filistyni z mieszkańcami Tyru."
  tags: []
"Ps83,8":
  text: "Także Assur przyłączył się do nich, wsparł swym ramieniem synów Lota. Sela."
  tags: []
"Ps83,9":
  text: "Uczyń im tak, jak Midianitom, jak Syserze, jak Jabinowi nad potokiem Kiszon;"
  tags: []
"Ps83,10":
  text: "Którzy zostali wytępieni w Endor, stali się jak gnój dla ziemi."
  tags: []
"Ps83,11":
  text: "Z ich dostojnikami postąp jak z Orebem i Zeebem, jak z Zebachem i Salmunną, ze wszystkimi ich książętami;"
  tags: []
"Ps83,12":
  text: "Którzy mówili: Weźmy w posiadanie przybytki Boże."
  tags: []
"Ps83,13":
  text: "Mój Boże, uczyń ich jak koło i jak źdźbło na wietrze."
  tags: []
"Ps83,14":
  text: "Jak ogień, który pali las, i jak płomień, który wypala góry;"
  tags: []
"Ps83,15":
  text: "Tak ty ich ścigaj swoją nawałnicą i swoją burzą zatrwóż ich."
  tags: []
"Ps83,16":
  text: "Okryj ich twarze hańbą, aby szukali twego imienia, PANIE!"
  tags: []
"Ps83,17":
  text: "Niech się zawstydzą i zatrwożą na wieki, niech się okryją hańbą i zginą."
  tags: []
"Ps83,18":
  text: "Niech poznają, że jedynie ty, którego imię jest PAN, ty jesteś Najwyższy ponad całą ziemią."
  tags: []
