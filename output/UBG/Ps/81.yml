"Ps81,1":
  text: "Radośnie śpiewajcie Bogu, naszej mocy; radośnie wykrzykujcie Bogu Jakuba."
  tags: []
"Ps81,2":
  text: "Weźcie psalm, przynieście bęben, wdzięczną harfę i cytrę."
  tags: []
"Ps81,3":
  text: "Zadmijcie w trąbę w czas nowiu, w czasie wyznaczonym, w dniu naszego uroczystego święta."
  tags: []
"Ps81,4":
  text: "Jest bowiem taki nakaz w Izraelu, prawo Boga Jakuba."
  tags: []
"Ps81,5":
  text: "Ustanowił to świadectwem dla Józefa, kiedy wyszedł przeciw ziemi Egiptu, gdzie słyszałem język, którego nie zrozumiałem."
  tags: []
"Ps81,6":
  text: "Uwolniłem od brzemienia jego barki, a jego ręce od dźwigania kotłów."
  tags: []
"Ps81,7":
  text: "Wzywałeś mnie w ucisku i wybawiłem cię; odpowiedziałem ci w skrytości gromu, doświadczyłem cię u wód Meriba. Sela."
  tags: []
"Ps81,8":
  text: "Słuchaj, mój ludu, a oświadczę ci; Izraelu, jeśli będziesz mnie słuchał;"
  tags: []
"Ps81,9":
  text: "Nie będziesz miał cudzego boga ani nie oddasz pokłonu obcemu bogu;"
  tags: []
"Ps81,10":
  text: "Ja, PAN, jestem twoim Bogiem, który cię wyprowadził z ziemi Egiptu; otwórz usta, a ja je napełnię."
  tags: []
"Ps81,11":
  text: "Lecz mój lud nie usłuchał mego głosu, a Izrael nie chciał mnie."
  tags: []
"Ps81,12":
  text: "Zostawiłem ich więc żądzom ich serca i postępowali według swoich zamysłów."
  tags: []
"Ps81,13":
  text: "O, gdyby mój lud mnie posłuchał, a Izrael chodził moimi drogami!"
  tags: []
"Ps81,14":
  text: "W krótkim czasie poniżyłbym ich nieprzyjaciół i zwróciłbym rękę przeciw ich wrogom."
  tags: []
"Ps81,15":
  text: "Nienawidzący PANA, choć obłudnie, musieliby mu się poddać, a ich czas trwałby wiecznie."
  tags: []
"Ps81,16":
  text: "I karmiłbym ich wyborną pszenicą, a nasyciłbym cię miodem ze skały."
  tags: []
