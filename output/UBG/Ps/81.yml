"Ps81,1": "Radośnie śpiewajcie Bogu, naszej mocy; radośnie wykrzykujcie Bogu Jakuba."
"Ps81,2": "Weźcie psalm, przynieście bęben, wdzięczną harfę i cytrę."
"Ps81,3": "Zadmijcie w trąbę w czas nowiu, w czasie wyznaczonym, w dniu naszego uroczystego święta."
"Ps81,4": "Jest bowiem taki nakaz w Izraelu, prawo Boga Jakuba."
"Ps81,5": "Ustanowił to świadectwem dla Józefa, kiedy wyszedł przeciw ziemi Egiptu, gdzie słyszałem język, którego nie zrozumiałem."
"Ps81,6": "Uwolniłem od brzemienia jego barki, a jego ręce od dźwigania kotłów."
"Ps81,7": "Wzywałeś mnie w ucisku i wybawiłem cię; odpowiedziałem ci w skrytości gromu, doświadczyłem cię u wód Meriba. Sela."
"Ps81,8": "Słuchaj, mój ludu, a oświadczę ci; Izraelu, jeśli będziesz mnie słuchał;"
"Ps81,9": "Nie będziesz miał cudzego boga ani nie oddasz pokłonu obcemu bogu;"
"Ps81,10": "Ja, PAN, jestem twoim Bogiem, który cię wyprowadził z ziemi Egiptu; otwórz usta, a ja je napełnię."
"Ps81,11": "Lecz mój lud nie usłuchał mego głosu, a Izrael nie chciał mnie."
"Ps81,12": "Zostawiłem ich więc żądzom ich serca i postępowali według swoich zamysłów."
"Ps81,13": "O, gdyby mój lud mnie posłuchał, a Izrael chodził moimi drogami!"
"Ps81,14": "W krótkim czasie poniżyłbym ich nieprzyjaciół i zwróciłbym rękę przeciw ich wrogom."
"Ps81,15": "Nienawidzący PANA, choć obłudnie, musieliby mu się poddać, a ich czas trwałby wiecznie."
"Ps81,16": "I karmiłbym ich wyborną pszenicą, a nasyciłbym cię miodem ze skały."
