"Ps68,1": "Niech Bóg powstanie, a rozproszeni będą jego wrogowie; niech pouciekają przed jego obliczem ci, którzy go nienawidzą."
"Ps68,2": "Jak dym jest rozwiany, tak ich rozpędzisz; jak wosk się rozpływa od ognia, tak niegodziwi poginą przed obliczem Boga."
"Ps68,3": "A sprawiedliwi będą się weselić i cieszyć przed obliczem Boga, i będą się radować niezmiernie."
"Ps68,4": "Śpiewajcie Bogu, śpiewajcie psalmy jego imieniu, wywyższajcie tego, który przemierza niebiosa; PAN to jego imię, radujcie się przed jego obliczem."
"Ps68,5": "Ojcem dla sierot i sędzią dla wdów jest Bóg w swym świętym przybytku."
"Ps68,6": "Bóg samotnym daje dom, więźniów uwalnia z okowów, ale oporni mieszkają w suchej ziemi."
"Ps68,7": "Boże, gdy wyruszałeś przed swoim ludem, gdy kroczyłeś przez pustynię. Sela;"
"Ps68,8": "Ziemia się trzęsła, a niebiosa rozpływały się przed obliczem Boga i sama góra Synaj zadrżała przed obliczem Boga, Boga Izraela."
"Ps68,9": "Zesłałeś obfity deszcz, Boże, otrzeźwiłeś swoje dziedzictwo, gdy omdlewało."
"Ps68,10": "Twoje zastępy mieszkają w nim; ty, Boże, w swojej dobroci przygotowałeś je dla ubogiego."
"Ps68,11": "Pan dał swoje słowo, wielki był zastęp zwiastujących dobre wieści."
"Ps68,12": "Królowie wojsk uciekali, uciekali; a ta, która doglądała domu, dzieliła łupy."
"Ps68,13": "Chociaż musieliście leżeć wśród kotłów, będziecie jak skrzydła gołębicy pokryte srebrem, a jej pióra żółtym złotem."
"Ps68,14": "Gdy Wszechmogący rozproszył królów w ziemi, była biała jak śnieg na górze Salmon."
"Ps68,15": "Góra Boża jest jak góra Baszanu, wzgórze wysokie, jak góra Baszanu."
"Ps68,16": "Dlaczego wyskakujecie, wzgórza wysokie? Na tej górze spodobało się Bogu mieszkać, tam PAN będzie mieszkał na wieki."
"Ps68,17": "Rydwanów Bożych jest dwadzieścia tysięcy, wiele tysięcy aniołów; Pan przebywa wśród nich w świątyni, jak na Synaju."
"Ps68,18": "Wstąpiłeś na wysokość, poprowadziłeś pojmanych jeńców, przyjąłeś dary dla ludzi, nawet dla buntowników, aby PAN Bóg mógł z nimi zamieszkać."
"Ps68,19": "Błogosławiony Pan; codziennie obsypuje nas swymi dobrami Bóg naszego zbawienia. Sela."
"Ps68,20": "Nasz Bóg jest Bogiem zbawienia, Pan BÓG wybawia od śmierci."
"Ps68,21": "Bóg zrani głowę swoich wrogów i owłosioną czaszkę tego, który trwa w swoich grzechach."
"Ps68,22": "Pan powiedział: Wyprowadzę znów swoich z Baszanu, wyprowadzę ich znowu z głębin morskich;"
"Ps68,23": "Aby twoja stopa była skąpana we krwi, a język twoich psów we krwi wrogów."
"Ps68,24": "Widzieli twoje pochody, Boże; pochody mego Boga, mego Króla w świątyni."
"Ps68,25": "Przodem szli śpiewacy, za nimi grający na instrumentach, wśród nich dziewczęta uderzające w bębenki."
"Ps68,26": "W zgromadzeniach błogosławcie Boga, Pana, wy, którzy pochodzicie ze źródła Izraela."
"Ps68,27": "Tam jest mały Beniamin, który im przewodzi, władcy Judy i ich hufce, władcy Zebulona i władcy Neftalego."
"Ps68,28": "Twój Bóg obdarzył cię siłą; umocnij, Boże, to, co dla nas uczyniłeś."
"Ps68,29": "Ze względu na twoją świątynię w Jeruzalem królowie będą przynosić ci dary."
"Ps68,30": "Zgrom rzeszę kopijników, stado byków z cielcami ludu, chlubiących się kawałkiem srebra; rozprosz narody pragnące wojny."
"Ps68,31": "Przyjdą dostojnicy z Egiptu; Etiopia szybko wyciągnie swe ręce do Boga."
"Ps68,32": "Śpiewajcie Bogu, królestwa ziemi, wysławiajcie Pana. Sela."
"Ps68,33": "Temu, który przemierza najwyższe niebiosa odwieczne; oto wydaje swój głos, głos potężny."
"Ps68,34": "Uznajcie moc Boga, jego majestat jest nad Izraelem i jego moc w obłokach."
"Ps68,35": "Groźny jesteś, Boże, ze swych świętych przybytków; Bóg Izraela sam daje moc i siłę swemu ludowi. Niech będzie Bóg błogosławiony."
