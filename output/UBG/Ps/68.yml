"Ps68,1":
  text: "Niech Bóg powstanie, a rozproszeni będą jego wrogowie; niech pouciekają przed jego obliczem ci, którzy go nienawidzą."
  tags: []
"Ps68,2":
  text: "Jak dym jest rozwiany, tak ich rozpędzisz; jak wosk się rozpływa od ognia, tak niegodziwi poginą przed obliczem Boga."
  tags: []
"Ps68,3":
  text: "A sprawiedliwi będą się weselić i cieszyć przed obliczem Boga, i będą się radować niezmiernie."
  tags: []
"Ps68,4":
  text: "Śpiewajcie Bogu, śpiewajcie psalmy jego imieniu, wywyższajcie tego, który przemierza niebiosa; PAN to jego imię, radujcie się przed jego obliczem."
  tags: []
"Ps68,5":
  text: "Ojcem dla sierot i sędzią dla wdów jest Bóg w swym świętym przybytku."
  tags: []
"Ps68,6":
  text: "Bóg samotnym daje dom, więźniów uwalnia z okowów, ale oporni mieszkają w suchej ziemi."
  tags: []
"Ps68,7":
  text: "Boże, gdy wyruszałeś przed swoim ludem, gdy kroczyłeś przez pustynię. Sela;"
  tags: []
"Ps68,8":
  text: "Ziemia się trzęsła, a niebiosa rozpływały się przed obliczem Boga i sama góra Synaj zadrżała przed obliczem Boga, Boga Izraela."
  tags: []
"Ps68,9":
  text: "Zesłałeś obfity deszcz, Boże, otrzeźwiłeś swoje dziedzictwo, gdy omdlewało."
  tags: []
"Ps68,10":
  text: "Twoje zastępy mieszkają w nim; ty, Boże, w swojej dobroci przygotowałeś je dla ubogiego."
  tags: []
"Ps68,11":
  text: "Pan dał swoje słowo, wielki był zastęp zwiastujących dobre wieści."
  tags: []
"Ps68,12":
  text: "Królowie wojsk uciekali, uciekali; a ta, która doglądała domu, dzieliła łupy."
  tags: []
"Ps68,13":
  text: "Chociaż musieliście leżeć wśród kotłów, będziecie jak skrzydła gołębicy pokryte srebrem, a jej pióra żółtym złotem."
  tags: []
"Ps68,14":
  text: "Gdy Wszechmogący rozproszył królów w ziemi, była biała jak śnieg na górze Salmon."
  tags: []
"Ps68,15":
  text: "Góra Boża jest jak góra Baszanu, wzgórze wysokie, jak góra Baszanu."
  tags: []
"Ps68,16":
  text: "Dlaczego wyskakujecie, wzgórza wysokie? Na tej górze spodobało się Bogu mieszkać, tam PAN będzie mieszkał na wieki."
  tags: []
"Ps68,17":
  text: "Rydwanów Bożych jest dwadzieścia tysięcy, wiele tysięcy aniołów; Pan przebywa wśród nich w świątyni, jak na Synaju."
  tags: []
"Ps68,18":
  text: "Wstąpiłeś na wysokość, poprowadziłeś pojmanych jeńców, przyjąłeś dary dla ludzi, nawet dla buntowników, aby PAN Bóg mógł z nimi zamieszkać."
  tags: []
"Ps68,19":
  text: "Błogosławiony Pan; codziennie obsypuje nas swymi dobrami Bóg naszego zbawienia. Sela."
  tags: []
"Ps68,20":
  text: "Nasz Bóg jest Bogiem zbawienia, Pan BÓG wybawia od śmierci."
  tags: []
"Ps68,21":
  text: "Bóg zrani głowę swoich wrogów i owłosioną czaszkę tego, który trwa w swoich grzechach."
  tags: []
"Ps68,22":
  text: "Pan powiedział: Wyprowadzę znów swoich z Baszanu, wyprowadzę ich znowu z głębin morskich;"
  tags: []
"Ps68,23":
  text: "Aby twoja stopa była skąpana we krwi, a język twoich psów we krwi wrogów."
  tags: []
"Ps68,24":
  text: "Widzieli twoje pochody, Boże; pochody mego Boga, mego Króla w świątyni."
  tags: []
"Ps68,25":
  text: "Przodem szli śpiewacy, za nimi grający na instrumentach, wśród nich dziewczęta uderzające w bębenki."
  tags: []
"Ps68,26":
  text: "W zgromadzeniach błogosławcie Boga, Pana, wy, którzy pochodzicie ze źródła Izraela."
  tags: []
"Ps68,27":
  text: "Tam jest mały Beniamin, który im przewodzi, władcy Judy i ich hufce, władcy Zebulona i władcy Neftalego."
  tags: []
"Ps68,28":
  text: "Twój Bóg obdarzył cię siłą; umocnij, Boże, to, co dla nas uczyniłeś."
  tags: []
"Ps68,29":
  text: "Ze względu na twoją świątynię w Jeruzalem królowie będą przynosić ci dary."
  tags: []
"Ps68,30":
  text: "Zgrom rzeszę kopijników, stado byków z cielcami ludu, chlubiących się kawałkiem srebra; rozprosz narody pragnące wojny."
  tags: []
"Ps68,31":
  text: "Przyjdą dostojnicy z Egiptu; Etiopia szybko wyciągnie swe ręce do Boga."
  tags: []
"Ps68,32":
  text: "Śpiewajcie Bogu, królestwa ziemi, wysławiajcie Pana. Sela."
  tags: []
"Ps68,33":
  text: "Temu, który przemierza najwyższe niebiosa odwieczne; oto wydaje swój głos, głos potężny."
  tags: []
"Ps68,34":
  text: "Uznajcie moc Boga, jego majestat jest nad Izraelem i jego moc w obłokach."
  tags: []
"Ps68,35":
  text: "Groźny jesteś, Boże, ze swych świętych przybytków; Bóg Izraela sam daje moc i siłę swemu ludowi. Niech będzie Bóg błogosławiony."
  tags: []
