"Ps30,1": "PANIE, będę cię wywyższać, bo podniosłeś mnie i nie pozwoliłeś mym wrogom cieszyć się z mojego powodu."
"Ps30,2": "PANIE, Boże mój, wołałem do ciebie i uzdrowiłeś mnie."
"Ps30,3": "PANIE, wyprowadziłeś moją duszę z piekła, zachowałeś mnie przy życiu, abym nie zstąpił do dołu."
"Ps30,4": "Śpiewajcie PANU, święci jego, i wysławiajcie go, wspominając jego świętość."
"Ps30,5": "Jego gniew bowiem trwa tylko chwilę, a jego łaskawość przez całe życie; choćby płacz trwał przez noc, rankiem nastanie radość."
"Ps30,6": "Powiedziałem w czasie mej pomyślności: Nigdy się nie zachwieję."
"Ps30,7": "PANIE, w swojej łaskawości umocniłeś moją górę; ale gdy ukryłeś swoje oblicze, strwożyłem się."
"Ps30,8": "Wołałem do ciebie, PANIE, modliłem się do PANA:"
"Ps30,9": "Jaki pożytek z mojej krwi, gdybym zstąpił do dołu? Czy proch będzie cię chwalić? Czy będzie głosić twoją prawdę?"
"Ps30,10": "Usłysz, PANIE, i zmiłuj się nade mną; PANIE, bądź moim pomocnikiem."
"Ps30,11": "Mój płacz zmieniłeś w taniec, zdjąłeś ze mnie wór pokutny, a przepasałeś mnie radością;"
"Ps30,12": "Aby moja chwała śpiewała ci i nie milkła; PANIE, mój Boże, będę cię wysławiać na wieki."
