"Ps30,1":
  text: "PANIE, będę cię wywyższać, bo podniosłeś mnie i nie pozwoliłeś mym wrogom cieszyć się z mojego powodu."
  tags: []
"Ps30,2":
  text: "PANIE, Boże mój, wołałem do ciebie i uzdrowiłeś mnie."
  tags: []
"Ps30,3":
  text: "PANIE, wyprowadziłeś moją duszę z piekła, zachowałeś mnie przy życiu, abym nie zstąpił do dołu."
  tags: []
"Ps30,4":
  text: "Śpiewajcie PANU, święci jego, i wysławiajcie go, wspominając jego świętość."
  tags: []
"Ps30,5":
  text: "Jego gniew bowiem trwa tylko chwilę, a jego łaskawość przez całe życie; choćby płacz trwał przez noc, rankiem nastanie radość."
  tags: []
"Ps30,6":
  text: "Powiedziałem w czasie mej pomyślności: Nigdy się nie zachwieję."
  tags: []
"Ps30,7":
  text: "PANIE, w swojej łaskawości umocniłeś moją górę; ale gdy ukryłeś swoje oblicze, strwożyłem się."
  tags: []
"Ps30,8":
  text: "Wołałem do ciebie, PANIE, modliłem się do PANA:"
  tags: []
"Ps30,9":
  text: "Jaki pożytek z mojej krwi, gdybym zstąpił do dołu? Czy proch będzie cię chwalić? Czy będzie głosić twoją prawdę?"
  tags: []
"Ps30,10":
  text: "Usłysz, PANIE, i zmiłuj się nade mną; PANIE, bądź moim pomocnikiem."
  tags: []
"Ps30,11":
  text: "Mój płacz zmieniłeś w taniec, zdjąłeś ze mnie wór pokutny, a przepasałeś mnie radością;"
  tags: []
"Ps30,12":
  text: "Aby moja chwała śpiewała ci i nie milkła; PANIE, mój Boże, będę cię wysławiać na wieki."
  tags: []
