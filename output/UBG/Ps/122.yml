"Ps122,1":
  text: "Uradowałem się, gdy mi powiedziano: Pójdziemy do domu PANA."
  tags: []
"Ps122,2":
  text: "Nasze nogi stanęły w twoich bramach, o Jeruzalem!"
  tags: []
"Ps122,3":
  text: "Jeruzalem, pięknie budowane jak miasto, w jedną całość zespolone;"
  tags: []
"Ps122,4":
  text: "Bo tam wstępują pokolenia, pokolenia PANA, do świadectwa Izraela, aby wysławiać imię PANA."
  tags: []
"Ps122,5":
  text: "Tam bowiem są postawione trony sądu, trony domu Dawida."
  tags: []
"Ps122,6":
  text: "Proście o pokój dla Jeruzalem: Niech się szczęści tym, którzy cię miłują."
  tags: []
"Ps122,7":
  text: "Niech będzie pokój w twoich murach i spokój w twoich pałacach."
  tags: []
"Ps122,8":
  text: "Ze względu na moich braci i dla moich przyjaciół będę teraz ci życzył pokoju."
  tags: []
"Ps122,9":
  text: "Ze względu na dom PANA, naszego Boga, będę zabiegał o twoje dobro."
  tags: []
