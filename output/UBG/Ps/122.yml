"Ps122,1": "Uradowałem się, gdy mi powiedziano: Pójdziemy do domu PANA."
"Ps122,2": "Nasze nogi stanęły w twoich bramach, o Jeruzalem!"
"Ps122,3": "Jeruzalem, pięknie budowane jak miasto, w jedną całość zespolone;"
"Ps122,4": "Bo tam wstępują pokolenia, pokolenia PANA, do świadectwa Izraela, aby wysławiać imię PANA."
"Ps122,5": "Tam bowiem są postawione trony sądu, trony domu Dawida."
"Ps122,6": "Proście o pokój dla Jeruzalem: Niech się szczęści tym, którzy cię miłują."
"Ps122,7": "Niech będzie pokój w twoich murach i spokój w twoich pałacach."
"Ps122,8": "Ze względu na moich braci i dla moich przyjaciół będę teraz ci życzył pokoju."
"Ps122,9": "Ze względu na dom PANA, naszego Boga, będę zabiegał o twoje dobro."
