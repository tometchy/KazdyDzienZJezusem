"Ps128,1": "Błogosławiony każdy, kto się boi PANA; kto kroczy jego drogami."
"Ps128,2": "Bo będziesz spożywać z pracy twoich rąk; będziesz błogosławionym i będzie ci się dobrze wiodło."
"Ps128,3": "Twoja żona będzie jak płodna winorośl obok twego domu; twoje dzieci jak sadzonki oliwne dokoła twego stołu."
"Ps128,4": "Oto tak będzie błogosławiony mąż, który się boi PANA."
"Ps128,5": "Niech ci PAN błogosławi z Syjonu, abyś oglądał dobro Jeruzalem po wszystkie dni twego życia;"
"Ps128,6": "I abyś oglądał dzieci twoich synów i pokój nad Izraelem."
