"Ps128,1":
  text: "Błogosławiony każdy, kto się boi PANA; kto kroczy jego drogami."
  tags: []
"Ps128,2":
  text: "Bo będziesz spożywać z pracy twoich rąk; będziesz błogosławionym i będzie ci się dobrze wiodło."
  tags: []
"Ps128,3":
  text: "Twoja żona będzie jak płodna winorośl obok twego domu; twoje dzieci jak sadzonki oliwne dokoła twego stołu."
  tags: []
"Ps128,4":
  text: "Oto tak będzie błogosławiony mąż, który się boi PANA."
  tags: []
"Ps128,5":
  text: "Niech ci PAN błogosławi z Syjonu, abyś oglądał dobro Jeruzalem po wszystkie dni twego życia;"
  tags: []
"Ps128,6":
  text: "I abyś oglądał dzieci twoich synów i pokój nad Izraelem."
  tags: []
