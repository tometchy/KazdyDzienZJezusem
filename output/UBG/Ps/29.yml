"Ps29,1": "Oddajcie PANU, synowie mocarzy, oddajcie PANU chwałę i moc."
"Ps29,2": "Oddajcie PANU chwałę należną jego imieniu, oddajcie PANU pokłon w ozdobie świętości."
"Ps29,3": "Głos PANA nad wodami; zagrzmiał Bóg chwały, PAN nad wielkimi wodami."
"Ps29,4": "Głos PANA potężny, głos PANA pełen majestatu."
"Ps29,5": "Głos PANA łamie cedry, PAN łamie cedry Libanu;"
"Ps29,6": "I sprawia, że skaczą jak cielę, Liban i Sirion jak młody jednorożec."
"Ps29,7": "Głos PANA krzesze płomienie ognia."
"Ps29,8": "Głos PANA wstrząsa pustynią, PAN wstrząsa pustynią Kadesz."
"Ps29,9": "Głos PANA sprawia, że z bólem rodzą łanie i ogołacają się lasy, a w jego świątyni każdy opowiada o jego chwale."
"Ps29,10": "PAN zasiada nad potopem, PAN zasiada jako Król na wieki."
"Ps29,11": "PAN doda mocy swojemu ludowi, PAN pobłogosławi swój lud pokojem."
