"Ps67,1": "Niech Bóg się zmiłuje nad nami i błogosławi nam, niech rozjaśni nad nami swoje oblicze. Sela."
"Ps67,2": "Aby poznano na ziemi twoją drogę, wśród wszystkich narodów twoje zbawienie."
"Ps67,3": "Niech cię wysławiają ludy, o Boże, niech cię wysławiają wszystkie ludy."
"Ps67,4": "Niech narody się radują i wykrzykują, bo ty będziesz sądził ludy sprawiedliwie i rządzić będziesz narodami na ziemi. Sela."
"Ps67,5": "Niech cię wysławiają ludy, o Boże, niech cię wysławiają wszystkie ludy."
"Ps67,6": "Wtedy ziemia wyda swój plon i Bóg, nasz Bóg, będzie nam błogosławić."
"Ps67,7": "Niech nam Bóg błogosławi i niech się go boją wszystkie krańce ziemi."
