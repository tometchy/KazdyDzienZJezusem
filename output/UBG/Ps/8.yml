"Ps8,1":
  text: "O PANIE, nasz Panie, jak sławne jest twoje imię na całej ziemi! Ty, który swoją chwałę wyniosłeś nad niebiosa."
  tags: []
"Ps8,2":
  text: "Przez usta niemowląt i ssących ugruntowałeś swą potęgę z powodu twoich wrogów, aby poskromić nieprzyjaciela i mściciela."
  tags: []
"Ps8,3":
  text: "Gdy przypatruję się twoim niebiosom, dziełu twoich palców, księżycowi i gwiazdom, które utwierdziłeś;"
  tags: []
"Ps8,4":
  text: "Wtedy mówię: Czymże jest człowiek, że o nim pamiętasz, albo syn człowieczy, że troszczysz się o niego?"
  tags: []
"Ps8,5":
  text: "Uczyniłeś go bowiem niewiele mniejszym od aniołów, chwałą i czcią go ukoronowałeś."
  tags: []
"Ps8,6":
  text: "Dałeś mu panowanie nad dziełami twoich rąk, wszystko poddałeś pod jego stopy:"
  tags: []
"Ps8,7":
  text: "Owce i wszelkie bydło, a także zwierzęta polne;"
  tags: []
"Ps8,8":
  text: "Ptactwo niebieskie i ryby morskie, i wszystko, co przemierza szlaki mórz."
  tags: []
"Ps8,9":
  text: "O PANIE, nasz Panie, jak sławne jest twoje imię na całej ziemi!"
  tags: []
