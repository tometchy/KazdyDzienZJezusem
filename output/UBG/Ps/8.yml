"Ps8,1": "O PANIE, nasz Panie, jak sławne jest twoje imię na całej ziemi! Ty, który swoją chwałę wyniosłeś nad niebiosa."
"Ps8,2": "Przez usta niemowląt i ssących ugruntowałeś swą potęgę z powodu twoich wrogów, aby poskromić nieprzyjaciela i mściciela."
"Ps8,3": "Gdy przypatruję się twoim niebiosom, dziełu twoich palców, księżycowi i gwiazdom, które utwierdziłeś;"
"Ps8,4": "Wtedy mówię: Czymże jest człowiek, że o nim pamiętasz, albo syn człowieczy, że troszczysz się o niego?"
"Ps8,5": "Uczyniłeś go bowiem niewiele mniejszym od aniołów, chwałą i czcią go ukoronowałeś."
"Ps8,6": "Dałeś mu panowanie nad dziełami twoich rąk, wszystko poddałeś pod jego stopy:"
"Ps8,7": "Owce i wszelkie bydło, a także zwierzęta polne;"
"Ps8,8": "Ptactwo niebieskie i ryby morskie, i wszystko, co przemierza szlaki mórz."
"Ps8,9": "O PANIE, nasz Panie, jak sławne jest twoje imię na całej ziemi!"
