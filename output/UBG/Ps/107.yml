"Ps107,1": "Wysławiajcie PANA, bo jest dobry, bo jego miłosierdzie trwa na wieki."
"Ps107,2": "Niech to mówią odkupieni przez PANA, ci, których odkupił z ręki wroga;"
"Ps107,3": "I zgromadził z ziem, ze wschodu i zachodu, z północy i południa."
"Ps107,4": "Błądzili po pustyni, po bezdrożnym pustkowiu, nie znajdując miasta, gdzie mogliby zamieszkać."
"Ps107,5": "Byli głodni i spragnieni, aż omdlewała w nich dusza."
"Ps107,6": "A gdy zawołali do PANA w swoim utrapieniu, uwolnił ich z ucisku;"
"Ps107,7": "I prowadził ich prostą drogą, aby doszli do miasta, w którym mogliby zamieszkać."
"Ps107,8": "Niech wysławiają PANA za jego miłosierdzie i cudowne dzieła wobec synów ludzkich;"
"Ps107,9": "Bo napoił spragnioną duszę, a głodną duszę napełnił dobrami."
"Ps107,10": "Siedzieli w ciemności i w cieniu śmierci, spętani nędzą i żelazem;"
"Ps107,11": "Bo buntowali się przeciw słowom Boga i pogardzili radą Najwyższego."
"Ps107,12": "Dlatego upokorzył ich serce trudem, upadli, a nie było nikogo, kto by im pomógł."
"Ps107,13": "A gdy wołali do PANA w swoim utrapieniu, wybawił ich z ucisku;"
"Ps107,14": "Wyprowadził ich z ciemności i z cienia śmierci, a ich pęta rozerwał."
"Ps107,15": "Niech wysławiają PANA za jego miłosierdzie i za cudowne dzieła wobec synów ludzkich."
"Ps107,16": "Bo skruszył bramy spiżowe i połamał żelazne rygle."
"Ps107,17": "Głupcy z powodu swej występnej drogi i nieprawości doznają utrapień."
"Ps107,18": "Ich dusza brzydzi się wszelkim pokarmem i zbliżają się do bram śmierci."
"Ps107,19": "A gdy wołają do PANA w swoim utrapieniu, wybawia ich z udręczeń."
"Ps107,20": "Posłał swoje słowo i uzdrowił ich, i wybawił ich z grobu."
"Ps107,21": "Niech wysławiają PANA za jego miłosierdzie i cudowne dzieła wobec synów ludzkich;"
"Ps107,22": "I niech składają ofiary dziękczynienia, i głoszą z radością jego dzieła."
"Ps107,23": "Ci, którzy na statkach wyruszają w morze, handlujący na wielkich wodach;"
"Ps107,24": "Widzą dzieła PANA i jego cuda w głębinach."
"Ps107,25": "Gdy daje rozkaz, powstaje wicher i podnoszą się fale morskie."
"Ps107,26": "Oni wstępują aż do nieba i zstępują w głębiny, tak że ich dusza mdleje w niebezpieczeństwie."
"Ps107,27": "Chwieją się i zataczają jak pijany, a cała ich mądrość zanika."
"Ps107,28": "Gdy wołają do PANA w swoim utrapieniu, wybawia ich z udręczeń."
"Ps107,29": "Zamienia burzę w ciszę, tak że uspokajają się jej fale."
"Ps107,30": "Wtedy oni weselą się, że ucichły; i tak przyprowadza ich do upragnionego portu."
"Ps107,31": "Niech wysławiają PANA za jego miłosierdzie i cudowne dzieła wobec synów ludzkich."
"Ps107,32": "Niech go wywyższają w zgromadzeniu ludu i w radzie starszych niech go chwalą."
"Ps107,33": "Zamienia rzeki w pustynię, a źródła wód w suchą ziemię;"
"Ps107,34": "Ziemię urodzajną zamienia w jałową z powodu niegodziwości tych, którzy w niej mieszkają."
"Ps107,35": "Pustynię zamienia w jezioro, a suchą ziemię w źródła wód."
"Ps107,36": "I osadza tam głodnych, aby zakładali miasta do zamieszkania;"
"Ps107,37": "I obsiewali pole, sadzili winnice i zbierali obfity plon."
"Ps107,38": "Błogosławi im tak, że bardzo się rozmnażają, i nie zmniejsza liczebności ich bydła."
"Ps107,39": "Ale potem maleje ich liczba i upokorzeni są uciskiem, nędzą i utrapieniem;"
"Ps107,40": "On wylewa wzgardę na władców i sprawia, że błądzą po bezdrożach pustkowia."
"Ps107,41": "Lecz podnosi nędznego z utrapienia i rozmnaża jego rodzinę jak stado."
"Ps107,42": "Widząc to, prawi rozweselą się, a wszelka nieprawość zamknie swe usta."
"Ps107,43": "Kto jest tak mądry, aby tego upatrywał i rozumiał litość PANA?"
