"Ps65,1": "Tobie, Boże, należy się chwała na Syjonie i tobie złożone śluby należy wypełnić."
"Ps65,2": "Ty wysłuchujesz modlitwy, dlatego do ciebie przyjdzie wszelkie ciało."
"Ps65,3": "Wielkie nieprawości wzięły górę nad nami; ty oczyszczasz nasze występki."
"Ps65,4": "Błogosławiony, kogo ty wybierasz i przyjmujesz, aby mieszkał w twoich przedsionkach; będziemy nasyceni dobrami twego domu, twej świętej świątyni."
"Ps65,5": "Straszliwymi rzeczami odpowiesz nam według sprawiedliwości, Boże naszego zbawienia, nadziejo wszystkich krańców ziemi i mórz dalekich."
"Ps65,6": "Ty, który utwierdzasz góry swoją mocą, przepasany potęgą;"
"Ps65,7": "Ty, który uciszasz szum morza, szum jego fal, i wrzawę narodów;"
"Ps65,8": "Mieszkańcy krańców ziemi boją się twoich znaków; ty radujesz ich nastawaniem poranka i wieczora."
"Ps65,9": "Nawiedzasz ziemię i zraszasz ją, wzbogacasz ją obficie strumieniem Bożym pełnym wody. Przygotowujesz im zboże, gdy tak przysposabiasz ziemię."
"Ps65,10": "Nawadniasz jej zagony, wyrównujesz jej bruzdy, zmiękczasz ją deszczami i błogosławisz jej urodzaje."
"Ps65,11": "Wieńczysz rok swoją dobrocią, a twoje ścieżki ociekają tłuszczem."
"Ps65,12": "Skrapiasz pustynne pastwiska, a pagórki przepasują się radością."
"Ps65,13": "Łąki przyodziewają się stadami, a doliny okrywają się zbożem; wykrzykują radośnie i śpiewają."
