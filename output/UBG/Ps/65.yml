"Ps65,1":
  text: "Tobie, Boże, należy się chwała na Syjonie i tobie złożone śluby należy wypełnić."
  tags: []
"Ps65,2":
  text: "Ty wysłuchujesz modlitwy, dlatego do ciebie przyjdzie wszelkie ciało."
  tags: []
"Ps65,3":
  text: "Wielkie nieprawości wzięły górę nad nami; ty oczyszczasz nasze występki."
  tags: []
"Ps65,4":
  text: "Błogosławiony, kogo ty wybierasz i przyjmujesz, aby mieszkał w twoich przedsionkach; będziemy nasyceni dobrami twego domu, twej świętej świątyni."
  tags: []
"Ps65,5":
  text: "Straszliwymi rzeczami odpowiesz nam według sprawiedliwości, Boże naszego zbawienia, nadziejo wszystkich krańców ziemi i mórz dalekich."
  tags: []
"Ps65,6":
  text: "Ty, który utwierdzasz góry swoją mocą, przepasany potęgą;"
  tags: []
"Ps65,7":
  text: "Ty, który uciszasz szum morza, szum jego fal, i wrzawę narodów;"
  tags: []
"Ps65,8":
  text: "Mieszkańcy krańców ziemi boją się twoich znaków; ty radujesz ich nastawaniem poranka i wieczora."
  tags: []
"Ps65,9":
  text: "Nawiedzasz ziemię i zraszasz ją, wzbogacasz ją obficie strumieniem Bożym pełnym wody. Przygotowujesz im zboże, gdy tak przysposabiasz ziemię."
  tags: []
"Ps65,10":
  text: "Nawadniasz jej zagony, wyrównujesz jej bruzdy, zmiękczasz ją deszczami i błogosławisz jej urodzaje."
  tags: []
"Ps65,11":
  text: "Wieńczysz rok swoją dobrocią, a twoje ścieżki ociekają tłuszczem."
  tags: []
"Ps65,12":
  text: "Skrapiasz pustynne pastwiska, a pagórki przepasują się radością."
  tags: []
"Ps65,13":
  text: "Łąki przyodziewają się stadami, a doliny okrywają się zbożem; wykrzykują radośnie i śpiewają."
  tags: []
