"Am1,1":
  text: "Słowa Amosa, który był jednym spośród pasterzy z Tekoa, które widział o Izraelu za dni Uzjasza, króla Judy, i za dni Jeroboama, syna Joasza, króla Izraela, dwa lata przed trzęsieniem ziemi."
  tags: []
"Am1,2":
  text: "I powiedział: PAN zagrzmi z Syjonu, z Jerozolimy wyda swój głos; mieszkania pasterzy będą lamentować, a wyschnie szczyt Karmelu."
  tags: []
"Am1,3":
  text: "Tak mówi PAN: Z powodu trzech występków Damaszku i z powodu czterech nie przepuszczę mu, ponieważ młócili Gilead narzędziami z żelaza."
  tags: []
"Am1,4":
  text: "Ale ześlę ogień na dom Chazaela, który strawi pałace Ben-Hadada."
  tags: []
"Am1,5":
  text: "Połamię też rygiel Damaszku i wykorzenię mieszkańca z doliny Awen i tego, który trzyma berło z domu Eden. I lud Syrii pójdzie do niewoli do Kir, mówi PAN."
  tags: []
"Am1,6":
  text: "Tak mówi PAN: Z powodu trzech występków Gazy i z powodu czterech nie przepuszczę im, ponieważ uprowadzili wszystkich jeńców, aby ich wydać Edomowi."
  tags: []
"Am1,7":
  text: "Ale ześlę ogień na mur Gazy, który strawi jej pałace."
  tags: []
"Am1,8":
  text: "Wykorzenię też mieszkańca z Aszdodu i tego, który trzyma berło z Aszkelonu, i zwrócę swoją rękę przeciwko Ekronowi, i zginie resztka Filistynów, mówi Pan BÓG."
  tags: []
"Am1,9":
  text: "Tak mówi PAN: Z powodu trzech występków Tyru i z powodu czterech nie przepuszczę mu, ponieważ wydali wszystkich jeńców Edomowi, a nie pamiętali o braterskim przymierzu;"
  tags: []
"Am1,10":
  text: "Ale ześlę ogień na mur Tyru, który strawi jego pałace."
  tags: []
"Am1,11":
  text: "Tak mówi PAN: Z powodu trzech występków Edomu i z powodu czterech nie przepuszczę mu, ponieważ prześladował mieczem swego brata, tłumiąc w sobie wszelaką litość, a nieustannie pałał gniewem, swoją zapalczywość chował na zawsze."
  tags: []
"Am1,12":
  text: "Ale ześlę ogień na Teman i strawi pałace Bosry."
  tags: []
"Am1,13":
  text: "Tak mówi PAN: Z powodu trzech występków synów Ammona i z powodu czterech nie przepuszczę im, ponieważ rozcinali brzemienne w Gileadzie tylko po to, by rozszerzyć swoje granice."
  tags: []
"Am1,14":
  text: "Ale rozniecę ogień na murze Rabby, który strawi jego pałace wśród krzyku w dzień bitwy, podczas wichru w dzień burzy."
  tags: []
"Am1,15":
  text: "I pójdzie ich król do niewoli, on i jego książęta razem z nim, mówi PAN."
  tags: []
