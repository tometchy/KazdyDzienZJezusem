"Am1,1": "Słowa Amosa, który był jednym spośród pasterzy z Tekoa, które widział o Izraelu za dni Uzjasza, króla Judy, i za dni Jeroboama, syna Joasza, króla Izraela, dwa lata przed trzęsieniem ziemi."
"Am1,2": "I powiedział: PAN zagrzmi z Syjonu, z Jerozolimy wyda swój głos; mieszkania pasterzy będą lamentować, a wyschnie szczyt Karmelu."
"Am1,3": "Tak mówi PAN: Z powodu trzech występków Damaszku i z powodu czterech nie przepuszczę mu, ponieważ młócili Gilead narzędziami z żelaza."
"Am1,4": "Ale ześlę ogień na dom Chazaela, który strawi pałace Ben-Hadada."
"Am1,5": "Połamię też rygiel Damaszku i wykorzenię mieszkańca z doliny Awen i tego, który trzyma berło z domu Eden. I lud Syrii pójdzie do niewoli do Kir, mówi PAN."
"Am1,6": "Tak mówi PAN: Z powodu trzech występków Gazy i z powodu czterech nie przepuszczę im, ponieważ uprowadzili wszystkich jeńców, aby ich wydać Edomowi."
"Am1,7": "Ale ześlę ogień na mur Gazy, który strawi jej pałace."
"Am1,8": "Wykorzenię też mieszkańca z Aszdodu i tego, który trzyma berło z Aszkelonu, i zwrócę swoją rękę przeciwko Ekronowi, i zginie resztka Filistynów, mówi Pan BÓG."
"Am1,9": "Tak mówi PAN: Z powodu trzech występków Tyru i z powodu czterech nie przepuszczę mu, ponieważ wydali wszystkich jeńców Edomowi, a nie pamiętali o braterskim przymierzu;"
"Am1,10": "Ale ześlę ogień na mur Tyru, który strawi jego pałace."
"Am1,11": "Tak mówi PAN: Z powodu trzech występków Edomu i z powodu czterech nie przepuszczę mu, ponieważ prześladował mieczem swego brata, tłumiąc w sobie wszelaką litość, a nieustannie pałał gniewem, swoją zapalczywość chował na zawsze."
"Am1,12": "Ale ześlę ogień na Teman i strawi pałace Bosry."
"Am1,13": "Tak mówi PAN: Z powodu trzech występków synów Ammona i z powodu czterech nie przepuszczę im, ponieważ rozcinali brzemienne w Gileadzie tylko po to, by rozszerzyć swoje granice."
"Am1,14": "Ale rozniecę ogień na murze Rabby, który strawi jego pałace wśród krzyku w dzień bitwy, podczas wichru w dzień burzy."
"Am1,15": "I pójdzie ich król do niewoli, on i jego książęta razem z nim, mówi PAN."
