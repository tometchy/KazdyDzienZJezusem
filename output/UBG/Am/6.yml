"Am6,1":
  text: "Biada beztroskim na Syjonie i pokładającym ufność w górze Samarii; tym, którzy są przywódcami wśród tych narodów, do których schodzi się dom Izraela."
  tags: []
"Am6,2":
  text: "Idźcie do Kalne i rozejrzyjcie się, a stamtąd idźcie do Chamat wielkiego. Potem zstąpcie do Gat filistyńskiego. Czy są to lepsze królestwa niż te? Czy ich obszar jest większy niż wasz obszar?"
  tags: []
"Am6,3":
  text: "Biada wam, którzy sądzicie, że dzień zły jest daleko i przybliżacie panowanie przemocy;"
  tags: []
"Am6,4":
  text: "Którzy sypiacie na łożach z kości słoniowej, a rozciągacie się na swoich posłaniach; którzy jadacie jagnięta z trzody, a cielce tuczone z zagrody;"
  tags: []
"Am6,5":
  text: "Którzy śpiewacie przy lutni i wymyślacie sobie instrumenty muzyczne jak Dawid;"
  tags: []
"Am6,6":
  text: "Którzy pijecie wino z czasz i namaszczacie się drogimi maściami, a nie bolejecie nad utrapieniem Józefa."
  tags: []
"Am6,7":
  text: "Dlatego teraz pójdą do niewoli na czele pojmanych i skończy się biesiada hulaków."
  tags: []
"Am6,8":
  text: "Pan BÓG przysiągł na siebie samego, mówi PAN, Bóg zastępów: Obrzydła mi pycha Jakuba i nienawidzę jego pałaców. Dlatego wydam miasto i wszystko, co w nim jest."
  tags: []
"Am6,9":
  text: "A stanie się tak: Jeśli pozostanie dziesięć osób w jednym domu, i one pomrą."
  tags: []
"Am6,10":
  text: "I każdego z nich weźmie jego stryj, i spali go, aby wynieść kości z domu, i zapyta tego, który jest w zakątkach domu: Czy jest jeszcze ktoś z tobą? A ten odpowie: Nie ma. Wtedy powie: Milcz, bo nie wolno wspominać imienia PANA."
  tags: []
"Am6,11":
  text: "Oto bowiem PAN rozkaże i uderzy w wielki dom rozpadlinami, a w mały dom – pęknięciem."
  tags: []
"Am6,12":
  text: "Czy konie mogą biegać po skale? Czy można tam orać wołami? Sąd bowiem zamieniliście w truciznę, a owoc sprawiedliwości w piołun."
  tags: []
"Am6,13":
  text: "Biada wam, którzy się cieszycie, a to z niczego, mówiąc: Czy nie wzięliśmy sobie rogów własną siłą?"
  tags: []
"Am6,14":
  text: "Ale oto ja wzbudzę naród przeciwko wam, domu Izraela, mówi PAN, Bóg zastępów, który was będzie uciskał od wejścia do Chamat aż do strumienia pustyni."
  tags: []
