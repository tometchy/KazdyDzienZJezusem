"Am5,1":
  text: "Słuchajcie tego słowa, które jako lament podnoszę przeciwko wam, domu Izraela!"
  tags: []
"Am5,2":
  text: "Upadła i już nie powstanie dziewica Izraela. Leży opuszczona w swej ziemi i nie ma nikogo, kto by ją podniósł."
  tags: []
"Am5,3":
  text: "Tak bowiem mówi Pan BÓG: W mieście, z którego wychodziło tysiąc, pozostanie sto, a w tym, z którego wychodziło sto, pozostanie domowi Izraela dziesięciu."
  tags: []
"Am5,4":
  text: "Tak bowiem mówi PAN do domu Izraela: Szukajcie mnie, a będziecie żyć;"
  tags: []
"Am5,5":
  text: "A nie szukajcie Betel, nie chodźcie do Gilgal i do Beer-Szeby nie udawajcie się, gdyż Gilgal zostanie uprowadzony do niewoli, a Betel wniwecz się obróci."
  tags: []
"Am5,6":
  text: "Szukajcie PANA, a będziecie żyć, aby nie wybuchł jak ogień w domu Józefa i nie pochłonął go, a nie będzie nikogo w Betel, kto by go ugasił;"
  tags: []
"Am5,7":
  text: "Wy, którzy zamieniacie sąd w piołun, a sprawiedliwość porzucacie na ziemi;"
  tags: []
"Am5,8":
  text: "Szukajcie tego, który uczynił Plejady i Oriona, który przemienia cień śmierci w poranek i dzień w ciemności nocne; który przyzywa wody morskie i wylewa je na powierzchni ziemi, PAN jest jego imię;"
  tags: []
"Am5,9":
  text: "Który wzmacnia słabego przeciwko mocnemu, tak że ten osłabiony naciera na twierdzę."
  tags: []
"Am5,10":
  text: "Nienawidzą tego, który upomina ich w bramie, i brzydzą się tym, który mówi prawdę."
  tags: []
"Am5,11":
  text: "Ponieważ uciskacie ubogiego i zabieracie mu ciężar zboża, to chociaż pobudowaliście domy z kamienia ciosanego, nie będziecie w nich mieszkać; zasadzaliście rozkoszne winnice, ale nie będziecie pić z nich wina."
  tags: []
"Am5,12":
  text: "Znam bowiem wasze wielkie przestępstwa i ogromne grzechy: uciskacie sprawiedliwego, bierzecie łapówkę i wypaczacie sprawy ubogich w bramie."
  tags: []
"Am5,13":
  text: "Dlatego roztropny milczy w tym czasie, bo jest to czas zły."
  tags: []
"Am5,14":
  text: "Szukajcie dobra, a nie zła, abyście żyli. A PAN, Bóg zastępów, będzie z wami, tak jak mówicie."
  tags: []
"Am5,15":
  text: "Nienawidźcie zła, a miłujcie dobro i ustanówcie sąd w bramie. Może wtedy PAN, Bóg zastępów, zlituje się nad resztką Józefa."
  tags: []
"Am5,16":
  text: "Dlatego tak mówi PAN, Bóg zastępów, Pan: Na wszystkich ulicach będzie zawodzenie, a na wszystkich drogach będą krzyczeć: Biada, biada! I zawołają oracza do płaczu, a tych, którzy umieją lamentować, do zawodzenia."
  tags: []
"Am5,17":
  text: "I we wszystkich winnicach będzie zawodzenie, gdy przejdę pośród ciebie, mówi PAN."
  tags: []
"Am5,18":
  text: "Biada tym, którzy pragną dnia PANA! Cóż wam po tym dniu PANA? Jest on ciemnością, a nie światłością."
  tags: []
"Am5,19":
  text: "Jak gdyby ktoś uciekał przed lwem, a spotkał go niedźwiedź; albo jak gdyby wszedł do domu i oparł się ręką o ścianę, a ukąsiłby go wąż."
  tags: []
"Am5,20":
  text: "Czy dzień PANA nie jest ciemnością, a nie światłością? Mrokiem bez żadnej jasności?"
  tags: []
"Am5,21":
  text: "Nienawidzę waszych uroczystych świąt i gardzę nimi, i woń na waszych zgromadzeniach nie jest mi miła."
  tags: []
"Am5,22":
  text: "Jeśli bowiem będziecie mi składać całopalenia i swoje ofiary pokarmowe, nie przyjmę ich ani nie wejrzę na ofiary pojednawcze z waszego tuczonego bydła."
  tags: []
"Am5,23":
  text: "Oddal ode mnie wrzask waszych pieśni, bo nie chcę słuchać dźwięku waszych cytr."
  tags: []
"Am5,24":
  text: "Niech raczej sąd tryska jak woda, a sprawiedliwość jak gwałtowny strumień."
  tags: []
"Am5,25":
  text: "Czy składaliście mi ofiary i dary na pustyni przez czterdzieści lat, domu Izraela?"
  tags: []
"Am5,26":
  text: "Przecież nosiliście przybytek waszego Molocha i Kijuna, wasze bożki, gwiazdę waszych bogów, których sobie uczyniliście."
  tags: []
"Am5,27":
  text: "Dlatego uprowadzę was do niewoli poza Damaszek, mówi PAN, Bóg zastępów, to jego imię."
  tags: []
