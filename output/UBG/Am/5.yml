"Am5,1": "Słuchajcie tego słowa, które jako lament podnoszę przeciwko wam, domu Izraela!"
"Am5,2": "Upadła i już nie powstanie dziewica Izraela. Leży opuszczona w swej ziemi i nie ma nikogo, kto by ją podniósł."
"Am5,3": "Tak bowiem mówi Pan BÓG: W mieście, z którego wychodziło tysiąc, pozostanie sto, a w tym, z którego wychodziło sto, pozostanie domowi Izraela dziesięciu."
"Am5,4": "Tak bowiem mówi PAN do domu Izraela: Szukajcie mnie, a będziecie żyć;"
"Am5,5": "A nie szukajcie Betel, nie chodźcie do Gilgal i do Beer-Szeby nie udawajcie się, gdyż Gilgal zostanie uprowadzony do niewoli, a Betel wniwecz się obróci."
"Am5,6": "Szukajcie PANA, a będziecie żyć, aby nie wybuchł jak ogień w domu Józefa i nie pochłonął go, a nie będzie nikogo w Betel, kto by go ugasił;"
"Am5,7": "Wy, którzy zamieniacie sąd w piołun, a sprawiedliwość porzucacie na ziemi;"
"Am5,8": "Szukajcie tego, który uczynił Plejady i Oriona, który przemienia cień śmierci w poranek i dzień w ciemności nocne; który przyzywa wody morskie i wylewa je na powierzchni ziemi, PAN jest jego imię;"
"Am5,9": "Który wzmacnia słabego przeciwko mocnemu, tak że ten osłabiony naciera na twierdzę."
"Am5,10": "Nienawidzą tego, który upomina ich w bramie, i brzydzą się tym, który mówi prawdę."
"Am5,11": "Ponieważ uciskacie ubogiego i zabieracie mu ciężar zboża, to chociaż pobudowaliście domy z kamienia ciosanego, nie będziecie w nich mieszkać; zasadzaliście rozkoszne winnice, ale nie będziecie pić z nich wina."
"Am5,12": "Znam bowiem wasze wielkie przestępstwa i ogromne grzechy: uciskacie sprawiedliwego, bierzecie łapówkę i wypaczacie sprawy ubogich w bramie."
"Am5,13": "Dlatego roztropny milczy w tym czasie, bo jest to czas zły."
"Am5,14": "Szukajcie dobra, a nie zła, abyście żyli. A PAN, Bóg zastępów, będzie z wami, tak jak mówicie."
"Am5,15": "Nienawidźcie zła, a miłujcie dobro i ustanówcie sąd w bramie. Może wtedy PAN, Bóg zastępów, zlituje się nad resztką Józefa."
"Am5,16": "Dlatego tak mówi PAN, Bóg zastępów, Pan: Na wszystkich ulicach będzie zawodzenie, a na wszystkich drogach będą krzyczeć: Biada, biada! I zawołają oracza do płaczu, a tych, którzy umieją lamentować, do zawodzenia."
"Am5,17": "I we wszystkich winnicach będzie zawodzenie, gdy przejdę pośród ciebie, mówi PAN."
"Am5,18": "Biada tym, którzy pragną dnia PANA! Cóż wam po tym dniu PANA? Jest on ciemnością, a nie światłością."
"Am5,19": "Jak gdyby ktoś uciekał przed lwem, a spotkał go niedźwiedź; albo jak gdyby wszedł do domu i oparł się ręką o ścianę, a ukąsiłby go wąż."
"Am5,20": "Czy dzień PANA nie jest ciemnością, a nie światłością? Mrokiem bez żadnej jasności?"
"Am5,21": "Nienawidzę waszych uroczystych świąt i gardzę nimi, i woń na waszych zgromadzeniach nie jest mi miła."
"Am5,22": "Jeśli bowiem będziecie mi składać całopalenia i swoje ofiary pokarmowe, nie przyjmę ich ani nie wejrzę na ofiary pojednawcze z waszego tuczonego bydła."
"Am5,23": "Oddal ode mnie wrzask waszych pieśni, bo nie chcę słuchać dźwięku waszych cytr."
"Am5,24": "Niech raczej sąd tryska jak woda, a sprawiedliwość jak gwałtowny strumień."
"Am5,25": "Czy składaliście mi ofiary i dary na pustyni przez czterdzieści lat, domu Izraela?"
"Am5,26": "Przecież nosiliście przybytek waszego Molocha i Kijuna, wasze bożki, gwiazdę waszych bogów, których sobie uczyniliście."
"Am5,27": "Dlatego uprowadzę was do niewoli poza Damaszek, mówi PAN, Bóg zastępów, to jego imię."
