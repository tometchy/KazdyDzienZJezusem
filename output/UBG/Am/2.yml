"Am2,1":
  text: "Tak mówi PAN: Z powodu trzech występków Moabu i z powodu czterech nie przepuszczę mu, ponieważ spalił kości króla Edomu na wapno."
  tags: []
"Am2,2":
  text: "Ale ześlę ogień na Moab, który strawi pałace Keriotu. I umrze Moab wśród wrzawy, wśród krzyku i przy dźwięku trąby."
  tags: []
"Am2,3":
  text: "I wytracę sędziów spośród niego, i zabiję wraz z nim wszystkich jego książąt, mówi PAN."
  tags: []
"Am2,4":
  text: "Tak mówi PAN: Z powodu trzech występków Judy i z powodu czterech nie przepuszczę mu, ponieważ odrzucili prawo PANA i nie przestrzegali jego przykazań, a dali się zwieść swoim kłamstwom, za którymi chodzili ich ojcowie."
  tags: []
"Am2,5":
  text: "Ale ześlę ogień na Judę, który strawi pałace Jerozolimy."
  tags: []
"Am2,6":
  text: "Tak mówi PAN: Z powodu trzech występków Izraela i z powodu czterech nie przepuszczę mu, ponieważ sprzedali sprawiedliwego za srebro, a ubogiego za parę sandałów;"
  tags: []
"Am2,7":
  text: "Którzy dążą do tego, aby w prochu deptać głowy ubogich i drogę pokornych wypaczają. Ponadto syn i jego ojciec obcują z tą samą dziewczyną, aby splamić moje święte imię."
  tags: []
"Am2,8":
  text: "I na szatach danych im w zastaw kładą się przy każdym ołtarzu, a wino ukaranych piją w domu swoich bogów."
  tags: []
"Am2,9":
  text: "A przecież wytraciłem przed nimi Amorytę, który był wysoki jak cedry, a mocny jak dęby. Zniszczyłem jednak jego owoc od góry, a z dołu jego korzenie."
  tags: []
"Am2,10":
  text: "A was wyprowadziłem z ziemi Egiptu i prowadziłem przez pustynię czterdzieści lat, abyście posiedli ziemię Amoryty."
  tags: []
"Am2,11":
  text: "I wzbudzałem spośród waszych synów proroków i spośród waszych młodzieńców nazirejczyków. Czy nie jest tak, synowie Izraela? – mówi PAN."
  tags: []
"Am2,12":
  text: "Ale wy poiliście nazirejczyków winem, a prorokom rozkazywaliście, mówiąc: Nie prorokujcie."
  tags: []
"Am2,13":
  text: "Oto ścisnę waszą ziemię, tak jak ciśnie wóz pełen snopów."
  tags: []
"Am2,14":
  text: "Szybkiemu nie uda się ucieczka, mocny nie doda sobie sił i mocarz nie wybawi swojej duszy."
  tags: []
"Am2,15":
  text: "A ten, który trzyma łuk, nie ostoi się, i szybki na nogach nie ucieknie, a jeździec na koniu nie zachowa swojej duszy."
  tags: []
"Am2,16":
  text: "A najodważniejszy spośród mocarzy ucieknie w tym dniu nagi, mówi PAN."
  tags: []
