"Am4,1": "Słuchajcie tego słowa, krowy Baszanu, które jesteście na górach Samarii, które uciskacie biednych i niszczycie ubogich, które mówicie ich panom: Przynieście, abyśmy mogli pić."
"Am4,2": "Przysiągł Pan BÓG na swoją świętość, że oto nadejdą na was dni, kiedy pochwyci was hakami, a wasze potomstwo wędkami rybackimi."
"Am4,3": "I wyjdziecie wyłomami, jedna za drugą, i będziecie rozrzucać wszystko, co jest w waszych pałacach, mówi PAN."
"Am4,4": "Przychodźcie do Betel i grzeszcie, w Gilgal rozmnóżcie przestępstwo; przynoście każdego ranka swoje ofiary, a trzeciego roku – swoje dziesięciny;"
"Am4,5": "I spalajcie kwaszoną ofiarę dziękczynną, ogłaszajcie i rozgłoście dobrowolne ofiary, ponieważ tak wam się podoba, synowie Izraela, mówi Pan BÓG."
"Am4,6": "A chociaż dałem wam czystość zębów we wszystkich waszych miastach i niedostatek chleba po wszystkich waszych miejscach, wy jednak nie nawróciliście się do mnie, mówi PAN."
"Am4,7": "Ja też wstrzymałem wam deszcz, gdy jeszcze brakowało trzech miesięcy do żniwa. Spuszczałem deszcz na jedno miasto, a na drugie miasto nie spuszczałem. Jedną część pola zraszał deszcz, a druga część, na którą deszcz nie padał, uschła."
"Am4,8": "I chodzili z dwóch, trzech miast do jednego miasta, aby się napić, ale nie mogli zaspokoić swego pragnienia. A jednak nie nawróciliście się do mnie, mówi PAN."
"Am4,9": "Dotknąłem was suszą i pleśnią. Gdy obfitowały wasze ogrody, winnice, sady figowe i drzewa oliwne przynosiły owoc, gąsienice to pożarły, a jednak nie nawróciliście się do mnie, mówi PAN."
"Am4,10": "Zesłałem na was zarazę, tak jak na Egipt, wybiłem mieczem waszych młodzieńców, pozwoliłem uprowadzić wasze konie i sprawiłem, że smród waszych wojsk dotarł do waszych nozdrzy, a jednak nie nawróciliście się do mnie, mówi PAN."
"Am4,11": "Spustoszyłem was, jak Bóg spustoszył Sodomę i Gomorę, i staliście się jak głownia wyrwana z ognia, a jednak nie nawróciliście się do mnie, mówi PAN."
"Am4,12": "Dlatego tak ci uczynię, Izraelu, a ponieważ zamierzam ci tak uczynić, przygotuj się na spotkanie ze swym Bogiem, Izraelu!"
"Am4,13": "Oto bowiem on jest tym, który kształtuje góry, tworzy wiatr, oznajmia człowiekowi, jaka jest jego myśl; on z rannej zorzy czyni ciemność i stąpa po wyżynach ziemi. PAN, Bóg zastępów, to jego imię."
