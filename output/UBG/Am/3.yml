"Am3,1": "Słuchajcie tego słowa, które PAN mówi przeciwko wam, synowie Izraela, przeciwko całemu pokoleniu, które wyprowadziłem z ziemi Egiptu:"
"Am3,2": "Tylko was uznałem spośród wszystkich rodów ziemi, dlatego was ukarzę za wszystkie wasze nieprawości."
"Am3,3": "Czy dwóch może chodzić razem, jeśli się nie zgadzają?"
"Am3,4": "Czy lew zaryczy w lesie, gdy nie ma łupu? Czy młody lew wyda swój głos ze swojego legowiska, jeśli nic nie złowił?"
"Am3,5": "Czy ptak wpadnie w sidła na ziemi, jeśli nie ma pułapki? Czy podniesie się sidła z ziemi, jeśli nic nie schwytały?"
"Am3,6": "Czy trąba zadmie w mieście, a lud się nie ulęknie? Czy w mieście zdarzy się nieszczęście, którego PAN by nie uczynił?"
"Am3,7": "Doprawdy, Pan BÓG nic nie czyni, jeśli nie objawi swojej tajemnicy swym sługom, prorokom."
"Am3,8": "Lew ryknął, któż się nie ulęknie? Pan BÓG przemówił, któż nie będzie prorokował?"
"Am3,9": "Głoście w pałacach w Aszdodzie i w pałacach ziemi Egiptu i mówcie: Zbierzcie się na górach Samarii i zobaczcie w niej wielkie zamieszanie oraz cierpiących w niej ucisk;"
"Am3,10": "Nie umieją bowiem czynić tego, co jest prawe, mówi PAN. Zbierają w swoich pałacach skarby ze zdzierstwa i z grabieży."
"Am3,11": "Dlatego tak mówi Pan BÓG: Wróg otoczy tę ziemię i pozbawi cię twojej siły, i twoje pałace zostaną ograbione."
"Am3,12": "Tak mówi PAN: Jak pasterz wyrywa z lwiej paszczy dwie nogi lub kawałek ucha, tak zostaną wyrwani synowie Izraela, którzy mieszkają w Samarii na rogu łoża i w Damaszku na posłaniach."
"Am3,13": "Słuchajcie i oświadczcie w domu Jakuba, mówi Pan BÓG, Bóg zastępów;"
"Am3,14": "Bo w tym dniu, w którym ukarzę Izraela za jego przestępstwa, ukarzę też ołtarze w Betel. I rogi ołtarza zostaną odcięte i upadną na ziemię."
"Am3,15": "I zburzę dom zimowy i dom letni, zginą domy z kości słoniowej i dla wielkich domów nastanie koniec, mówi PAN."
