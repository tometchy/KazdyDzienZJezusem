"Am3,1":
  text: "Słuchajcie tego słowa, które PAN mówi przeciwko wam, synowie Izraela, przeciwko całemu pokoleniu, które wyprowadziłem z ziemi Egiptu:"
  tags: []
"Am3,2":
  text: "Tylko was uznałem spośród wszystkich rodów ziemi, dlatego was ukarzę za wszystkie wasze nieprawości."
  tags: []
"Am3,3":
  text: "Czy dwóch może chodzić razem, jeśli się nie zgadzają?"
  tags: []
"Am3,4":
  text: "Czy lew zaryczy w lesie, gdy nie ma łupu? Czy młody lew wyda swój głos ze swojego legowiska, jeśli nic nie złowił?"
  tags: []
"Am3,5":
  text: "Czy ptak wpadnie w sidła na ziemi, jeśli nie ma pułapki? Czy podniesie się sidła z ziemi, jeśli nic nie schwytały?"
  tags: []
"Am3,6":
  text: "Czy trąba zadmie w mieście, a lud się nie ulęknie? Czy w mieście zdarzy się nieszczęście, którego PAN by nie uczynił?"
  tags: []
"Am3,7":
  text: "Doprawdy, Pan BÓG nic nie czyni, jeśli nie objawi swojej tajemnicy swym sługom, prorokom."
  tags: []
"Am3,8":
  text: "Lew ryknął, któż się nie ulęknie? Pan BÓG przemówił, któż nie będzie prorokował?"
  tags: []
"Am3,9":
  text: "Głoście w pałacach w Aszdodzie i w pałacach ziemi Egiptu i mówcie: Zbierzcie się na górach Samarii i zobaczcie w niej wielkie zamieszanie oraz cierpiących w niej ucisk;"
  tags: []
"Am3,10":
  text: "Nie umieją bowiem czynić tego, co jest prawe, mówi PAN. Zbierają w swoich pałacach skarby ze zdzierstwa i z grabieży."
  tags: []
"Am3,11":
  text: "Dlatego tak mówi Pan BÓG: Wróg otoczy tę ziemię i pozbawi cię twojej siły, i twoje pałace zostaną ograbione."
  tags: []
"Am3,12":
  text: "Tak mówi PAN: Jak pasterz wyrywa z lwiej paszczy dwie nogi lub kawałek ucha, tak zostaną wyrwani synowie Izraela, którzy mieszkają w Samarii na rogu łoża i w Damaszku na posłaniach."
  tags: []
"Am3,13":
  text: "Słuchajcie i oświadczcie w domu Jakuba, mówi Pan BÓG, Bóg zastępów;"
  tags: []
"Am3,14":
  text: "Bo w tym dniu, w którym ukarzę Izraela za jego przestępstwa, ukarzę też ołtarze w Betel. I rogi ołtarza zostaną odcięte i upadną na ziemię."
  tags: []
"Am3,15":
  text: "I zburzę dom zimowy i dom letni, zginą domy z kości słoniowej i dla wielkich domów nastanie koniec, mówi PAN."
  tags: []
