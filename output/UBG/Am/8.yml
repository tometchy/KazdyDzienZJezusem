"Am8,1": "To mi ukazał Pan BÓG: Oto stał kosz letnich owoców."
"Am8,2": "Wtedy zapytał: Co widzisz, Amosie? Odpowiedziałem: Kosz letnich owoców. PAN znowu powiedział do mnie: Nadszedł koniec mojego ludu, Izraela, nie będę mu już więcej odpuszczał."
"Am8,3": "W tym dniu pieśni świątyni zamienią się w zawodzenie, mówi Pan BÓG. Będzie mnóstwo trupów na każdym miejscu, w ciszy będą wyrzucone."
"Am8,4": "Słuchajcie tego, wy, którzy pożeracie ubogiego, abyście wykorzenili biednych z ziemi;"
"Am8,5": "Mówiąc: Kiedy przeminie nów księżyca, abyśmy mogli sprzedać zboże? Kiedy minie szabat, abyśmy mogli otworzyć spichlerze, abyśmy mogli umniejszać efę, podwyższać sykl i wagi podstępnie fałszować;"
"Am8,6": "Abyśmy mogli kupować ubogich za srebro, a nędzarza za parę sandałów; i abyśmy mogli plewy zboża sprzedawać?"
"Am8,7": "PAN przysiągł na chwałę Jakuba: Nigdy nie zapomnę wszystkich ich uczynków."
"Am8,8": "Czyż z tego powodu nie zadrży ziemia i nie będzie lamentować każdy, kto w niej mieszka? Wzbierze się cała jak rzeka i zostanie porwana i zatopiona jakby przez rzekę Egiptu."
"Am8,9": "W tym dniu, mówi Pan BÓG, sprawię, że słońce zajdzie o południu, i przyprowadzę na ziemię ciemność w jasny dzień;"
"Am8,10": "I zamienię wasze święta w żałobę, a wszystkie wasze pieśni w lament. Sprawię, że na wszystkich biodrach będzie wór i na każdej głowie łysina. I będzie w tej ziemi żałoba jak po jedynaku, jej koniec jak dzień goryczy."
"Am8,11": "Oto nadchodzą dni, mówi Pan BÓG, gdy ześlę głód na ziemię, nie głód chleba ani pragnienie wody, ale słuchania słów PANA."
"Am8,12": "I będą się błąkać od morza do morza, i od północy aż na wschód będą biegać, szukając słowa PANA, ale go nie znajdą."
"Am8,13": "W tym dniu piękne dziewice i nawet młodzieńcy zemdleją z pragnienia."
"Am8,14": "Ci, którzy przysięgają na grzech Samarii, i mówią: Jak żyje twój Bóg, Danie, i jak żyje droga Beer-Szeby, oni upadną i już nigdy nie powstaną."
