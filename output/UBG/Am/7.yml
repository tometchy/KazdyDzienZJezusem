"Am7,1":
  text: "To mi ukazał Pan BÓG. Oto tworzył koniki polne na początku odrastania potrawu, a oto był to potraw po sianokosach królewskich."
  tags: []
"Am7,2":
  text: "A gdy zjadły trawę ziemi, powiedziałem: Panie BOŻE! Przebacz, proszę. Któż zostanie Jakubowi? Jest bowiem malutki."
  tags: []
"Am7,3":
  text: "I żałował tego PAN. PAN powiedział: To się nie stanie."
  tags: []
"Am7,4":
  text: "To mi ukazał Pan BÓG: Oto Pan BÓG wezwał ogień w celu sądu, a wchłonął wielką głębię i strawił dział."
  tags: []
"Am7,5":
  text: "Wtedy powiedziałem: Panie BOŻE! Zaniechaj tego, proszę. Któż zostanie Jakubowi? Jest bowiem malutki."
  tags: []
"Am7,6":
  text: "I żałował tego PAN. Pan BÓG powiedział: I to się nie stanie."
  tags: []
"Am7,7":
  text: "Potem to mi ukazał: oto Pan stał na murze wybudowanym za pomocą pionu, z pionem w ręku."
  tags: []
"Am7,8":
  text: "I PAN powiedział do mnie: Co widzisz, Amosie? Odpowiedziałem: Pion. Wtedy Pan powiedział: Oto przyłożę pion pośród mojego ludu, Izraela. Już mu więcej nie odpuszczę."
  tags: []
"Am7,9":
  text: "Wyżyny Izaaka będą spustoszone i świątynie Izraela zostaną zburzone, i powstanę z mieczem przeciwko domowi Jeroboama."
  tags: []
"Am7,10":
  text: "Wtedy Amazjasz, kapłan Betel, posłał do Jeroboama, króla Izraela, taką wiadomość: Amos spiskuje przeciwko tobie pośród domu Izraela, tak że ziemia nie może znieść wszystkich jego słów."
  tags: []
"Am7,11":
  text: "Tak bowiem mówi Amos: Jeroboam umrze od miecza, a Izrael na pewno zostanie uprowadzony ze swojej ziemi do niewoli."
  tags: []
"Am7,12":
  text: "Potem Amazjasz powiedział do Amosa: Widzący, idź, uciekaj do ziemi Judy i tam jedz chleb, i tam prorokuj."
  tags: []
"Am7,13":
  text: "A w Betel już więcej nie prorokuj, bo to jest świątynia króla i dom królewski."
  tags: []
"Am7,14":
  text: "Wtedy Amos odpowiedział Amazjaszowi: Nie byłem prorokiem ani nawet synem proroka, lecz byłem pasterzem bydła i tym, który zbiera figi sykomory."
  tags: []
"Am7,15":
  text: "Ale PAN mnie wziął, gdy chodziłem za bydłem, i powiedział do mnie PAN: Idź, prorokuj memu ludowi Izraelowi."
  tags: []
"Am7,16":
  text: "Teraz więc słuchaj słowa PANA. Ty mówisz: Nie prorokuj w Izraelu i nie głoś przeciwko domowi Izaaka."
  tags: []
"Am7,17":
  text: "Dlatego tak mówi PAN: Twoja żona będzie nierządnicą w mieście, twoi synowie i twoje córki padną od miecza, twoja ziemia będzie podzielona sznurem, a ty umrzesz w ziemi nieczystej; Izrael zaś na pewno zostanie uprowadzony do niewoli ze swojej ziemi."
  tags: []
