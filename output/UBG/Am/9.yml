"Am9,1":
  text: "Widziałem Pana stojącego na ołtarzu i powiedział: Uderz w nadproże, aż zadrżą węgary. Rozetnij głowy ich wszystkich, a pozostałych zabiję mieczem. Żaden z nich nie ucieknie i żaden z nich nie ocaleje."
  tags: []
"Am9,2":
  text: "Choćby się zakopali aż do piekła, moja ręka wyciągnie ich stamtąd; choćby wstąpili aż do nieba i stamtąd ich ściągnę."
  tags: []
"Am9,3":
  text: "Choćby się ukryli na szczycie Karmelu, odnajdę i wezmę ich stamtąd; a choćby się ukryli przed moimi oczami na dnie morza, rozkażę wężowi, aby ich tam ukąsił;"
  tags: []
"Am9,4":
  text: "Choćby poszli do niewoli przed swymi wrogami, nawet tam rozkażę mieczowi, aby ich zabijał. Zwrócę na nich swoje oczy dla zła, a nie dla dobra."
  tags: []
"Am9,5":
  text: "Pan BÓG zastępów dotyka ziemi, a ta rozpływa się i płaczą wszyscy jej mieszkańcy. Wzbierze cała jak rzeka i zostanie zatopiona jakby przez rzekę Egiptu."
  tags: []
"Am9,6":
  text: "On zbudował w niebie swoje stopnie i ustanowił na ziemi swój zastęp; on przywołuje wody morskie i rozlewa je po powierzchni ziemi. PAN to jego imię."
  tags: []
"Am9,7":
  text: "Synowie Izraela, czy nie jesteście dla mnie jak synowie Etiopii? – mówi PAN. Czy nie wyprowadziłem Izraela z ziemi Egiptu, Filistynów z Kaftor i Syryjczyków z Kir?"
  tags: []
"Am9,8":
  text: "Oto oczy Pana BOGA zwrócone są na to grzeszne królestwo i zgładzę je z powierzchni ziemi. Jednak nie zgładzę doszczętnie domu Jakuba, mówi PAN."
  tags: []
"Am9,9":
  text: "Oto bowiem wydam rozkaz i przesieję dom Izraela wśród wszystkich narodów, jak pszenicę przesiewa się przetakiem, tak że żadne ziarenko nie spadnie na ziemię."
  tags: []
"Am9,10":
  text: "Wszyscy grzesznicy spośród mojego ludu od miecza umrą, ci, którzy mówią: Nie dosięgnie nas ani nie zaskoczy nas to zło."
  tags: []
"Am9,11":
  text: "W tym dniu podniosę upadły przybytek Dawida i zamuruję jego wyłomy; wzniosę jego ruiny i odbuduję go, jak za dawnych dni;"
  tags: []
"Am9,12":
  text: "Aby posiedli resztki Edomu i wszystkie narody, nad którymi wzywano mojego imienia, mówi PAN, który to czyni."
  tags: []
"Am9,13":
  text: "Oto nadchodzą dni, mówi PAN, że oracz będzie za żniwiarzem, a depczący winogrona za siejącym ziarno; góry będą ociekać moszczem, a wszystkie pagórki się rozpłyną."
  tags: []
"Am9,14":
  text: "Odwrócę niewolę mojego ludu, Izraela; odbudują miasta spustoszone i zamieszkają w nich; zasadzą też winnice i będą pić z nich wino; założą też sady i będą jedli ich owoce."
  tags: []
"Am9,15":
  text: "Zasadzę ich w ich ziemi; i nigdy nie zostaną wykorzenieni ze swojej ziemi, którą im dałem, mówi PAN, twój Bóg."
  tags: []
