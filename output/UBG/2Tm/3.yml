"2Tm3,1":
  text: "A to wiedz, że w ostatecznych dniach nastaną trudne czasy."
  tags: []
"2Tm3,2":
  text: "Ludzie bowiem będą samolubni, chciwi, chełpliwi, pyszni, bluźniący, nieposłuszni rodzicom, niewdzięczni, bezbożni;"
  tags: []
"2Tm3,3":
  text: "Bez naturalnej miłości, niedotrzymujący słowa, oszczercy, niepowściągliwi, okrutni, niemiłujący dobrych;"
  tags: []
"2Tm3,4":
  text: "Zdrajcy, porywczy, nadęci, miłujący bardziej rozkosze niż Boga;"
  tags: []
"2Tm3,5":
  text: "Przybierający pozór pobożności, ale wyrzekający się jej mocy. Takich ludzi unikaj."
  tags: []
"2Tm3,6":
  text: "Z takich bowiem są ci, którzy wkradają się do domów i usidlają naiwne kobietki obciążone grzechami, wiedzione przez rozmaite pożądliwości;"
  tags: []
"2Tm3,7":
  text: "Które zawsze się uczą, a nigdy nie mogą dojść do poznania prawdy."
  tags: []
"2Tm3,8":
  text: "Jak Jannes i Jambres sprzeciwiali się Mojżeszowi, tak też oni sprzeciwiają się prawdzie, ludzie o wypaczonym umyśle, odrzuceni jeśli chodzi o wiarę."
  tags: []
"2Tm3,9":
  text: "Lecz daleko nie zajdą, bo ich głupota będzie jawna dla wszystkich, jak to się stało i z tamtymi."
  tags: []
"2Tm3,10":
  text: "Ale ty pojąłeś moją naukę, sposób życia, dążenia, wiarę, wytrwałość, miłość i cierpliwość;"
  tags: []
"2Tm3,11":
  text: "Prześladowania, cierpienia, które mnie spotkały w Antiochii, w Ikonium i Listrze – prześladowania, które zniosłem, a ze wszystkich wyrwał mnie Pan."
  tags: []
"2Tm3,12":
  text: "Tak i wszyscy, którzy chcą żyć pobożnie w Chrystusie Jezusie, będą prześladowani."
  tags: []
"2Tm3,13":
  text: "Lecz ludzie źli i zwodziciele coraz bardziej będą brnąć w zło, błądząc i innych wprowadzając w błąd."
  tags: []
"2Tm3,14":
  text: "Ty zaś trwaj w tym, czego się nauczyłeś i co ci powierzono, wiedząc, od kogo się tego nauczyłeś;"
  tags: []
"2Tm3,15":
  text: "I ponieważ od dziecka znasz Pisma święte, które cię mogą uczynić mądrym ku zbawieniu przez wiarę, która jest w Chrystusie Jezusie."
  tags: []
"2Tm3,16":
  text: "Całe Pismo jest natchnione przez Boga i pożyteczne do nauki, do strofowania, do poprawiania, do wychowywania w sprawiedliwości;"
  tags: []
"2Tm3,17":
  text: "Aby człowiek Boży był doskonały, do wszelkiego dobrego dzieła w pełni przygotowany."
  tags: []
