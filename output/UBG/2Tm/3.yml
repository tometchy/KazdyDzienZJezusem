"2Tm3,1": "A to wiedz, że w ostatecznych dniach nastaną trudne czasy."
"2Tm3,2": "Ludzie bowiem będą samolubni, chciwi, chełpliwi, pyszni, bluźniący, nieposłuszni rodzicom, niewdzięczni, bezbożni;"
"2Tm3,3": "Bez naturalnej miłości, niedotrzymujący słowa, oszczercy, niepowściągliwi, okrutni, niemiłujący dobrych;"
"2Tm3,4": "Zdrajcy, porywczy, nadęci, miłujący bardziej rozkosze niż Boga;"
"2Tm3,5": "Przybierający pozór pobożności, ale wyrzekający się jej mocy. Takich ludzi unikaj."
"2Tm3,6": "Z takich bowiem są ci, którzy wkradają się do domów i usidlają naiwne kobietki obciążone grzechami, wiedzione przez rozmaite pożądliwości;"
"2Tm3,7": "Które zawsze się uczą, a nigdy nie mogą dojść do poznania prawdy."
"2Tm3,8": "Jak Jannes i Jambres sprzeciwiali się Mojżeszowi, tak też oni sprzeciwiają się prawdzie, ludzie o wypaczonym umyśle, odrzuceni jeśli chodzi o wiarę."
"2Tm3,9": "Lecz daleko nie zajdą, bo ich głupota będzie jawna dla wszystkich, jak to się stało i z tamtymi."
"2Tm3,10": "Ale ty pojąłeś moją naukę, sposób życia, dążenia, wiarę, wytrwałość, miłość i cierpliwość;"
"2Tm3,11": "Prześladowania, cierpienia, które mnie spotkały w Antiochii, w Ikonium i Listrze – prześladowania, które zniosłem, a ze wszystkich wyrwał mnie Pan."
"2Tm3,12": "Tak i wszyscy, którzy chcą żyć pobożnie w Chrystusie Jezusie, będą prześladowani."
"2Tm3,13": "Lecz ludzie źli i zwodziciele coraz bardziej będą brnąć w zło, błądząc i innych wprowadzając w błąd."
"2Tm3,14": "Ty zaś trwaj w tym, czego się nauczyłeś i co ci powierzono, wiedząc, od kogo się tego nauczyłeś;"
"2Tm3,15": "I ponieważ od dziecka znasz Pisma święte, które cię mogą uczynić mądrym ku zbawieniu przez wiarę, która jest w Chrystusie Jezusie."
"2Tm3,16": "Całe Pismo jest natchnione przez Boga i pożyteczne do nauki, do strofowania, do poprawiania, do wychowywania w sprawiedliwości;"
"2Tm3,17": "Aby człowiek Boży był doskonały, do wszelkiego dobrego dzieła w pełni przygotowany."
