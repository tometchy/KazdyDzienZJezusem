"2Tm1,1":
  text: "Paweł, apostoł Jezusa Chrystusa z woli Boga, zgodnie z obietnicą życia, które jest w Chrystusie Jezusie;"
  tags: []
"2Tm1,2":
  text: "Do Tymoteusza, umiłowanego syna. Łaska, miłosierdzie i pokój od Boga Ojca i Chrystusa Jezusa, naszego Pana."
  tags: []
"2Tm1,3":
  text: "Dziękuję Bogu, któremu jak moi przodkowie służę z czystym sumieniem, że nieustannie ciebie wspominam w swoich modlitwach, w nocy i we dnie;"
  tags: []
"2Tm1,4":
  text: "Wspominając twoje łzy, pragnę cię zobaczyć, aby napełnić się radością;"
  tags: []
"2Tm1,5":
  text: "Pamiętając nieobłudną wiarę, która jest w tobie, a która najpierw mieszkała w twojej babce Lois i w twojej matce Eunice, jestem też pewien, że i w tobie mieszka."
  tags: []
"2Tm1,6":
  text: "Z tego powodu przypominam ci, abyś rozniecił dar Boży, który jest w tobie przez nałożenie moich rąk."
  tags: []
"2Tm1,7":
  text: "Nie dał nam bowiem Bóg ducha bojaźni, lecz mocy i miłości, i zdrowego umysłu."
  tags: []
"2Tm1,8":
  text: "Nie wstydź się więc świadectwa naszego Pana ani mnie, jego więźnia, lecz weź udział w cierpieniach dla ewangelii według mocy Boga;"
  tags: []
"2Tm1,9":
  text: "Który nas zbawił i powołał świętym powołaniem nie na podstawie naszych uczynków, ale na podstawie swojego postanowienia i łaski, która została nam dana w Chrystusie Jezusie przed wiecznymi czasy."
  tags: []
"2Tm1,10":
  text: "A obecnie została objawiona przez pojawienie się naszego Zbawiciela, Jezusa Chrystusa, który zniszczył śmierć, a życie i nieśmiertelność wydobył na jaw przez ewangelię;"
  tags: []
"2Tm1,11":
  text: "Dla której zostałem ustanowiony kaznodzieją, apostołem i nauczycielem pogan."
  tags: []
"2Tm1,12":
  text: "Z tego też powodu znoszę te cierpienia, ale się nie wstydzę, gdyż wiem, komu uwierzyłem, i jestem pewien, że on ma moc zachować to, co jemu powierzyłem, aż do owego dnia."
  tags: []
"2Tm1,13":
  text: "Trzymaj się wzoru zdrowych słów, które ode mnie usłyszałeś, w wierze i miłości, która jest w Chrystusie Jezusie."
  tags: []
"2Tm1,14":
  text: "Strzeż tego dobrego, które powierzył ci Duch Święty, który w nas mieszka."
  tags: []
"2Tm1,15":
  text: "Wiesz o tym, że odwrócili się ode mnie wszyscy, którzy są w Azji, do których należą Figelos i Hermogenes."
  tags: []
"2Tm1,16":
  text: "Niech Pan okaże swoje miłosierdzie domowi Onezyfora, bo mnie często pokrzepiał i mojego łańcucha się nie wstydził;"
  tags: []
"2Tm1,17":
  text: "Lecz gdy był w Rzymie, usilnie mnie szukał i odnalazł."
  tags: []
"2Tm1,18":
  text: "Niech mu Pan da, aby w owym dniu znalazł miłosierdzie u Pana. A jak wiele usług oddał mi w Efezie, ty sam dobrze wiesz."
  tags: []
