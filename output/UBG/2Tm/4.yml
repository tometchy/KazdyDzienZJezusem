"2Tm4,1":
  text: "Zaklinam cię więc przed Bogiem i Panem Jezusem Chrystusem, który będzie sądził żywych i umarłych w czasie swego przyjścia i swego królestwa;"
  tags: []
"2Tm4,2":
  text: "Głoś słowo Boże, nalegaj w porę i nie w porę, upominaj, strofuj i zachęcaj ze wszelką cierpliwością i nauką."
  tags: []
"2Tm4,3":
  text: "Przyjdzie bowiem czas, gdy zdrowej nauki nie zniosą, ale zgromadzą sobie nauczycieli według swoich pożądliwości, ponieważ ich uszy świerzbią."
  tags: []
"2Tm4,4":
  text: "I odwrócą uszy od prawdy, a zwrócą się ku baśniom."
  tags: []
"2Tm4,5":
  text: "Lecz ty bądź czujny we wszystkim, znoś cierpienia, wykonuj dzieło ewangelisty, w pełni dowódź swojej służby."
  tags: []
"2Tm4,6":
  text: "Ja bowiem już mam być złożony w ofierze, a czas mojego odejścia nadchodzi."
  tags: []
"2Tm4,7":
  text: "Dobrą walkę stoczyłem, bieg ukończyłem, wiarę zachowałem."
  tags: []
"2Tm4,8":
  text: "Odtąd odłożona jest dla mnie korona sprawiedliwości, którą mi w owym dniu da Pan, sędzia sprawiedliwy, a nie tylko mnie, ale i wszystkim, którzy umiłowali jego przyjście."
  tags: []
"2Tm4,9":
  text: "Postaraj się przybyć do mnie szybko."
  tags: []
"2Tm4,10":
  text: "Demas bowiem mnie opuścił, umiłowawszy ten świat, i udał się do Tesaloniki, Krescens do Galacji, Tytus do Dalmacji;"
  tags: []
"2Tm4,11":
  text: "Tylko Łukasz jest ze mną. Weź Marka i przyprowadź ze sobą, bo jest mi bardzo przydatny do służby."
  tags: []
"2Tm4,12":
  text: "Tychika zaś posłałem do Efezu."
  tags: []
"2Tm4,13":
  text: "Płaszcz, który zostawiłem w Troadzie u Karposa, przynieś ze sobą, gdy przyjdziesz, a także księgi, zwłaszcza pergaminy."
  tags: []
"2Tm4,14":
  text: "Aleksander, ludwisarz, wyrządził mi wiele zła; niech mu Pan odda według jego uczynków."
  tags: []
"2Tm4,15":
  text: "I ty się go strzeż, bo bardzo sprzeciwiał się naszym słowom."
  tags: []
"2Tm4,16":
  text: "Podczas pierwszej mojej obrony nikt przy mnie nie stanął, lecz wszyscy mnie opuścili. Niech im to nie będzie policzone."
  tags: []
"2Tm4,17":
  text: "Lecz Pan stanął przy mnie i umocnił mnie, aby głoszenie było przeze mnie całkowicie utwierdzone, aby usłyszeli je wszyscy poganie; i zostałem wyrwany z paszczy lwa."
  tags: []
"2Tm4,18":
  text: "Wyrwie mnie też Pan ze wszelkiego złego uczynku i zachowa dla swojego królestwa niebieskiego. Jemu chwała na wieki wieków. Amen."
  tags: []
"2Tm4,19":
  text: "Pozdrów Pryskę i Akwilę oraz dom Onezyfora."
  tags: []
"2Tm4,20":
  text: "Erast pozostał w Koryncie, a Trofima zostawiłem chorego w Milecie."
  tags: []
"2Tm4,21":
  text: "Postaraj się przybyć przed zimą. Pozdrawia cię Eubulos, Pudens, Linus, Klaudia i wszyscy bracia."
  tags: []
"2Tm4,22":
  text: "Pan Jezus Chrystus niech będzie z twoim duchem. Łaska niech będzie z wami. Amen."
  tags: []
