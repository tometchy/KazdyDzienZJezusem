"2Tm4,1": "Zaklinam cię więc przed Bogiem i Panem Jezusem Chrystusem, który będzie sądził żywych i umarłych w czasie swego przyjścia i swego królestwa;"
"2Tm4,2": "Głoś słowo Boże, nalegaj w porę i nie w porę, upominaj, strofuj i zachęcaj ze wszelką cierpliwością i nauką."
"2Tm4,3": "Przyjdzie bowiem czas, gdy zdrowej nauki nie zniosą, ale zgromadzą sobie nauczycieli według swoich pożądliwości, ponieważ ich uszy świerzbią."
"2Tm4,4": "I odwrócą uszy od prawdy, a zwrócą się ku baśniom."
"2Tm4,5": "Lecz ty bądź czujny we wszystkim, znoś cierpienia, wykonuj dzieło ewangelisty, w pełni dowódź swojej służby."
"2Tm4,6": "Ja bowiem już mam być złożony w ofierze, a czas mojego odejścia nadchodzi."
"2Tm4,7": "Dobrą walkę stoczyłem, bieg ukończyłem, wiarę zachowałem."
"2Tm4,8": "Odtąd odłożona jest dla mnie korona sprawiedliwości, którą mi w owym dniu da Pan, sędzia sprawiedliwy, a nie tylko mnie, ale i wszystkim, którzy umiłowali jego przyjście."
"2Tm4,9": "Postaraj się przybyć do mnie szybko."
"2Tm4,10": "Demas bowiem mnie opuścił, umiłowawszy ten świat, i udał się do Tesaloniki, Krescens do Galacji, Tytus do Dalmacji;"
"2Tm4,11": "Tylko Łukasz jest ze mną. Weź Marka i przyprowadź ze sobą, bo jest mi bardzo przydatny do służby."
"2Tm4,12": "Tychika zaś posłałem do Efezu."
"2Tm4,13": "Płaszcz, który zostawiłem w Troadzie u Karposa, przynieś ze sobą, gdy przyjdziesz, a także księgi, zwłaszcza pergaminy."
"2Tm4,14": "Aleksander, ludwisarz, wyrządził mi wiele zła; niech mu Pan odda według jego uczynków."
"2Tm4,15": "I ty się go strzeż, bo bardzo sprzeciwiał się naszym słowom."
"2Tm4,16": "Podczas pierwszej mojej obrony nikt przy mnie nie stanął, lecz wszyscy mnie opuścili. Niech im to nie będzie policzone."
"2Tm4,17": "Lecz Pan stanął przy mnie i umocnił mnie, aby głoszenie było przeze mnie całkowicie utwierdzone, aby usłyszeli je wszyscy poganie; i zostałem wyrwany z paszczy lwa."
"2Tm4,18": "Wyrwie mnie też Pan ze wszelkiego złego uczynku i zachowa dla swojego królestwa niebieskiego. Jemu chwała na wieki wieków. Amen."
"2Tm4,19": "Pozdrów Pryskę i Akwilę oraz dom Onezyfora."
"2Tm4,20": "Erast pozostał w Koryncie, a Trofima zostawiłem chorego w Milecie."
"2Tm4,21": "Postaraj się przybyć przed zimą. Pozdrawia cię Eubulos, Pudens, Linus, Klaudia i wszyscy bracia."
"2Tm4,22": "Pan Jezus Chrystus niech będzie z twoim duchem. Łaska niech będzie z wami. Amen."
