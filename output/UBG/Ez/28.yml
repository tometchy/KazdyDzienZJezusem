"Ez28,1": "I doszło do mnie słowo PANA mówiące:"
"Ez28,2": "Synu człowieczy, powiedz księciu Tyru: Tak mówi Pan BÓG: Ponieważ uniosło się twoje serce i powiedziałeś: Ja jestem Bogiem, zasiadam na Bożym tronie w sercu mórz – ale ty jesteś człowiekiem, a nie Bogiem, choć twoje serce stawiasz na równi z sercem Boga;"
"Ez28,3": "Oto jesteś mądrzejszy od Daniela, żadna tajemnica nie jest zakryta przed tobą;"
"Ez28,4": "Swoją mądrością i roztropnością zdobyłeś sobie bogactwo i nagromadziłeś złota i srebra w swoich skarbcach;"
"Ez28,5": "Dzięki wielkości twojej mądrości i twojemu kupiectwu rozmnożyłeś swoje bogactwa; a tak uniosło się twoje serce z powodu twoich bogactw;"
"Ez28,6": "Dlatego tak mówi Pan BÓG: Ponieważ postawiłeś swoje serce jak serce Boga;"
"Ez28,7": "Oto sprowadzę na ciebie cudzoziemców, najsroższe z narodów. Dobędą swoje miecze przeciwko piękności twej mądrości i splugawią twój blask."
"Ez28,8": "Strącą cię do dołu i umrzesz srogą śmiercią w sercu mórz."
"Ez28,9": "Czy powiesz przed tym, który cię zabije: Jestem Bogiem? Przecież jesteś człowiekiem, a nie Bogiem w ręku tego, który cię zabije."
"Ez28,10": "Umrzesz śmiercią nieobrzezanych, z ręki cudzoziemców. Ja bowiem to powiedziałem, mówi Pan BÓG."
"Ez28,11": "I doszło do mnie słowo PANA mówiące:"
"Ez28,12": "Synu człowieczy, podnieś lament nad królem Tyru i mów do niego: Tak mówi Pan BÓG: Ty pieczętujesz sumę, pełen mądrości i doskonały w swej piękności;"
"Ez28,13": "Byłeś w Edenie, ogrodzie Bożym; twoim nakryciem był wszelki drogi kamień: karneol, topaz i jaspis, chryzolit, onyks i beryl, szafir, karbunkuł i szmaragd oraz złoto. Wykonanie twoich bębenków i fletów zostało przygotowane w dniu, kiedy zostałeś stworzony."
"Ez28,14": "Ty jesteś namaszczonym cherubinem nakrywającym; ja cię ustanowiłem. Byłeś na świętej górze Boga, przechadzałeś się wśród kamieni ognistych."
"Ez28,15": "Byłeś doskonały w swoich drogach od dnia, kiedy zostałeś stworzony, aż znalazła się w tobie nieprawość."
"Ez28,16": "Przez twój ogromny handel pełno pośród ciebie bezprawia, i zgrzeszyłeś. Dlatego zrzucę cię z góry Boga, cherubinie nakrywający, wyniszczę cię spośród kamieni ognistych."
"Ez28,17": "Uniosło się twoje serce z powodu twojej piękności, znieważyłeś swoją mądrość z powodu twojego blasku. Rzucę cię na ziemię i postawię cię przed królami, aby się tobie przypatrzyli."
"Ez28,18": "Mnóstwem twoich nieprawości i nieprawością twego handlu splugawiłeś swoją świątynię. Dlatego wywiodę ogień z twego wnętrza, który cię pożre, i zamienię cię w popiół na ziemi na oczach wszystkich, którzy na ciebie patrzą."
"Ez28,19": "Wszyscy, którzy cię znają wśród narodów, zdumieją się nad tobą. Staniesz się postrachem i nie będzie ciebie już na wieki."
"Ez28,20": "I doszło do mnie słowo PANA mówiące:"
"Ez28,21": "Synu człowieczy, zwróć swoją twarz przeciw Sydonowi i prorokuj przeciw niemu;"
"Ez28,22": "Mów: Tak mówi Pan BÓG: Oto jestem przeciwko tobie, Sydonie, będę uwielbiony pośród ciebie. I poznają, że ja jestem PANEM, gdy wykonam na nim sądy i będę w nim uświęcony."
"Ez28,23": "I ześlę na niego zarazę i krew na jego ulice; zranieni upadną pośród niego od miecza, który spadnie na nich ze wszystkich stron. I poznają, że ja jestem PANEM."
"Ez28,24": "I tak dla domu Izraela nie będzie już kłującego ciernia ani bolesnego kolca spośród wszystkich okolicznych mieszkańców, którzy nim wzgardzili. I poznają, że ja jestem Panem BOGIEM."
"Ez28,25": "Tak mówi Pan BÓG: Gdy zgromadzę dom Izraela spośród narodów, wśród których został rozproszony, i będę w nich uświęcony na oczach pogan, wtedy będą mieszkać w swojej ziemi, którą dałem swemu słudze Jakubowi."
"Ez28,26": "I będą w niej mieszkać bezpiecznie, pobudują domy i zasadzą winnice. Będą mieszkać bezpiecznie, gdy wykonam sądy na wszystkich dokoła nich, którzy nimi wzgardzili. I poznają, że ja jestem PANEM, ich Bogiem."
