"Ez10,1":
  text: "Potem spojrzałem, a oto na firmamencie, który był nad głową cherubinów, ukazało się nad nimi coś jakby kamień szafiru, z wyglądu podobne do tronu."
  tags: []
"Ez10,2":
  text: "Wtedy powiedział do tego męża ubranego w lnianą szatę: Wejdź między koła pod cherubinami, napełnij swe ręce rozżarzonymi węglami spomiędzy cherubinów i rozrzuć po mieście. I wszedł tam na moich oczach."
  tags: []
"Ez10,3":
  text: "A cherubiny stały po prawej stronie domu, gdy wchodził ten mąż, a obłok napełnił dziedziniec wewnętrzny."
  tags: []
"Ez10,4":
  text: "Następnie chwała PANA uniosła się znad cherubinów i sięgnęła do progu domu, a dom napełnił się obłokiem i dziedziniec napełnił się chwałą PANA."
  tags: []
"Ez10,5":
  text: "I szum skrzydeł cherubinów było słychać aż na dziedzińcu zewnętrznym, jak głos Boga Wszechmocnego, gdy mówi."
  tags: []
"Ez10,6":
  text: "Gdy rozkazał więc temu mężowi ubranemu w lnianą szatę, mówiąc: Weź ognia spomiędzy kół, spomiędzy cherubinów; to ten wszedł i stanął obok kół."
  tags: []
"Ez10,7":
  text: "Wtedy jeden cherubin wyciągnął rękę spomiędzy cherubinów do ognia, który był pomiędzy cherubinami, wziął i podał go do rąk męża ubranego w lnianą szatę. Ten go wziął i wyszedł."
  tags: []
"Ez10,8":
  text: "A przy cherubinach, pod ich skrzydłami, ukazał się kształt ręki ludzkiej."
  tags: []
"Ez10,9":
  text: "Potem spojrzałem, a oto cztery koła przy cherubinach, jedno koło obok jednego cherubina, każde koło obok każdego cherubina, a koła z wyglądu miały barwę kamienia berylu."
  tags: []
"Ez10,10":
  text: "Co do wyglądu, wszystkie cztery miały jednakowy kształt, jakby koło znajdowało się w środku koła."
  tags: []
"Ez10,11":
  text: "Gdy się poruszały, szły w czterech swoich kierunkach. A idąc, nie odwracały się, ale podążały w tym kierunku, w którym zwracała się głowa, i nie odwracały się, gdy szły."
  tags: []
"Ez10,12":
  text: "A całe ich ciało, ich plecy, ich ręce i ich skrzydła, a także koła były pełne oczu dokoła, one cztery i ich koła."
  tags: []
"Ez10,13":
  text: "A słyszałem, że te koła nazwał kręgiem."
  tags: []
"Ez10,14":
  text: "A każda istota miała cztery twarze: pierwsza to twarz cherubina, druga to twarz człowieka, trzecia to twarz lwa, a czwarta to twarz orła."
  tags: []
"Ez10,15":
  text: "I cherubiny się podniosły. Była to ta sama istota, którą widziałem nad rzeką Kebar."
  tags: []
"Ez10,16":
  text: "A gdy się poruszały cherubiny, poruszały się także koła obok nich. A gdy cherubiny podnosiły swoje skrzydła, aby się unieść ponad ziemię, koła nie odwracały się od nich."
  tags: []
"Ez10,17":
  text: "Gdy tamci stawali, one stały, a gdy tamci się podnosili, one też się podnosiły wraz z nimi, bo był w nich duch istoty żywej."
  tags: []
"Ez10,18":
  text: "Potem chwała PANA odeszła od progu domu i stanęła nad cherubinami."
  tags: []
"Ez10,19":
  text: "A cherubiny podniosły swoje skrzydła i uniosły się z ziemi na moich oczach. Gdy odchodziły, koła były przy ich boku. Stanęły u wejścia do wschodniej bramy domu PANA, a chwała Boga Izraela była nad nimi u góry."
  tags: []
"Ez10,20":
  text: "To jest ta istota, którą widziałem pod Bogiem Izraela nad rzeką Kebar; i poznałem, że były to cherubiny."
  tags: []
"Ez10,21":
  text: "Każdy z nich miał po cztery twarze i każdy miał po cztery skrzydła, a pod skrzydłami było coś w kształcie rąk ludzkich."
  tags: []
"Ez10,22":
  text: "A wygląd ich twarzy był taki sam jak twarze, które widziałem nad rzeką Kebar. Tak właśnie wyglądały ich twarze i oni sami. Każdy z nich poruszał się prosto przed siebie."
  tags: []
