"Ez19,1":
  text: "A ty podnieś lament nad książętami Izraela;"
  tags: []
"Ez19,2":
  text: "I mów: Czym była twoja matka? Lwicą leżącą między lwami, która karmiła swoje szczenięta wśród lwiąt."
  tags: []
"Ez19,3":
  text: "A gdy odchowała jedno ze swoich szczeniąt, stało się młodym lwem, który się nauczył chwytać łup; pożerał też ludzi."
  tags: []
"Ez19,4":
  text: "Narody o nim usłyszały, został schwytany w ich dół i zaprowadzony w łańcuchach do ziemi Egiptu."
  tags: []
"Ez19,5":
  text: "Gdy lwica zobaczyła, że daremnie czeka i że jej nadzieja przepadła, wzięła inne ze swoich szczeniąt i uczyniła je młodym lwem;"
  tags: []
"Ez19,6":
  text: "Chodziło w środku lwów i stało się młodym lwem, który nauczył się chwytać łup; pożerał też ludzi."
  tags: []
"Ez19,7":
  text: "Burzył ich pałace i pustoszył ich miasta tak, że ziemia i to, co ją napełnia, stały się spustoszone od jego głośnego ryku."
  tags: []
"Ez19,8":
  text: "Wtedy zebrały się przeciwko niemu narody z okolicznych krain i zarzuciły na niego swoją sieć. Został schwytany w ich dół."
  tags: []
"Ez19,9":
  text: "I wsadziły go do klatki w łańcuchach, i przyprowadziły do króla Babilonu. Wprowadziły go do ciężkiego więzienia, aby jego głos nie był więcej słyszany na górach Izraela."
  tags: []
"Ez19,10":
  text: "Twoja matka była jak winorośl w twojej krwi, zasadzona przy wodach. Była płodna i gałęzista dzięki obfitości wód."
  tags: []
"Ez19,11":
  text: "I miała potężne rózgi na berła dla panujących, a jej wzrost górował nad gęstymi gałęziami tak, że była widoczna z powodu swej wysokości dzięki mnóstwu swoich gałęzi."
  tags: []
"Ez19,12":
  text: "Ale w gniewie została wyrwana i rzucona na ziemię, a wschodni wiatr wysuszył jej owoc. Jej potężne rózgi zostały złamane i uschły, ogień je strawił."
  tags: []
"Ez19,13":
  text: "A teraz została zasadzona na pustyni, na ziemi suchej i spragnionej."
  tags: []
"Ez19,14":
  text: "Nadto ogień wyszedł z rózgi jej gałęzi i pochłonął jej owoc tak, że nie ma na niej potężnej rózgi na berło dla panującego. Jest to lament i będzie to lamentem."
  tags: []
