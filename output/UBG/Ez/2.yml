"Ez2,1":
  text: "I powiedział do mnie: Synu człowieczy, stań na nogi, a będę do ciebie mówił."
  tags: []
"Ez2,2":
  text: "I wstąpił we mnie duch, gdy przemówił do mnie, i postawił mnie na nogi; potem słyszałem tego, który mówił do mnie."
  tags: []
"Ez2,3":
  text: "Powiedział mi: Synu człowieczy, ja cię posyłam do synów Izraela, do narodu buntowniczego, który mi się sprzeciwił. Oni i ich ojcowie występowali przeciwko mnie aż do dziś."
  tags: []
"Ez2,4":
  text: "Są to synowie o bezczelnych twarzach i zatwardziałym sercu. Do nich cię posyłam. Powiesz im: Tak mówi Pan BÓG."
  tags: []
"Ez2,5":
  text: "A oni, czy posłuchają, czy nie – gdyż są domem buntowniczym – przecież będą wiedzieć, że był wśród nich prorok."
  tags: []
"Ez2,6":
  text: "Ale ty, synu człowieczy, nie bój się ich ani nie lękaj się ich słów, chociaż otaczają cię osty i ciernie i mieszkasz wśród skorpionów. Nie bój się ich słów ani nie lękaj się ich twarzy, gdyż są domem buntowniczym."
  tags: []
"Ez2,7":
  text: "Powiedz im moje słowa, czy usłuchają, czy nie, gdyż są zbuntowani."
  tags: []
"Ez2,8":
  text: "Lecz ty, synu człowieczy, słuchaj, co mówię do ciebie: Nie bądź zbuntowany jak ten dom buntowniczy. Otwórz swe usta i zjedz, co ci daję."
  tags: []
"Ez2,9":
  text: "I spojrzałem, a oto ręka była wyciągnięta do mnie, a w niej zwój księgi;"
  tags: []
"Ez2,10":
  text: "A on rozwinął go przede mną. Był zapisany z jednej i z drugiej strony, a spisane były w nim lamenty, żal i biadania."
  tags: []
