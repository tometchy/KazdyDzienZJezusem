"Ez7,1": "Potem doszło do mnie słowo PANA mówiące:"
"Ez7,2": "Synu człowieczy, tak mówi Pan BÓG do ziemi Izraela: Koniec, koniec nadszedł dla wszystkich czterech stron ziemi."
"Ez7,3": "Teraz nadejdzie koniec dla ciebie. Ześlę na ciebie swój gniew, będę cię sądził według twoich dróg i oddam ci według wszystkich twoich obrzydliwości."
"Ez7,4": "Moje oko nie oszczędzi cię i nie zlituję się nad tobą, ale oddam ci za twoje drogi, a twoje obrzydliwości zostaną pośród ciebie, i poznacie, że ja jestem PANEM."
"Ez7,5": "Tak mówi Pan BÓG: Utrapienie, oto nadchodzi jedno utrapienie."
"Ez7,6": "Nadszedł koniec, przyszedł koniec, ocknął się przeciwko tobie, oto nadszedł."
"Ez7,7": "Nadszedł poranek dla ciebie, obywatelu ziemi. Nadszedł czas, zbliża się dzień grzmotu, a nie głosu rozlegającego się po górach."
"Ez7,8": "Już wkrótce wyleję swój gniew na ciebie i dopełnię na tobie swojej zapalczywości. Osądzę cię według twoich dróg i oddam ci za wszystkie twoje obrzydliwości."
"Ez7,9": "Moje oko nie oszczędzi cię i nie zlituję się nad tobą, ale oddam ci według twoich dróg i twoich obrzydliwości, które znajdują się pośród ciebie. I tak poznacie, że ja jestem PANEM, który uderza."
"Ez7,10": "Oto ten dzień, oto nadszedł; nastał poranek, zakwitła rózga, wyrosła pycha."
"Ez7,11": "Przemoc wyrosła w rózgę niegodziwości. Nie pozostanie z nich nic – ani z ich mnóstwa, ani z ich bogactwa i nie będzie żadnego zawodzenia nad nimi."
"Ez7,12": "Nadszedł czas, zbliża się dzień. Kto kupuje, niech się nie cieszy, a kto sprzedaje, niech się nie smuci, bo przyjdzie gniew na całe ich mnóstwo."
"Ez7,13": "Bo ten, kto sprzedał, nie wróci do rzeczy sprzedanej, choćby jeszcze żył. Widzenie bowiem dotyczące całego ich mnóstwa nie będzie cofnięte i nikt nie wzmocni się w nieprawości swego życia."
"Ez7,14": "Zadęli w trąbę i wszystko przygotowali, lecz nikt nie ruszy do walki. Mój gniew bowiem jest skierowany na całe ich mnóstwo."
"Ez7,15": "Miecz na zewnątrz, a zaraza i głód wewnątrz. Kto będzie na polu, umrze od miecza, a kto w mieście, tego pochłoną głód i zaraza."
"Ez7,16": "Lecz ci, którzy z nich uciekną, będą w górach jak gołębice z dolin. Wszyscy będą lamentować, każdy nad swoją nieprawością."
"Ez7,17": "Wszystkie ręce opadną i wszystkie kolana osłabną jak woda."
"Ez7,18": "Obleką się w wory, okryje ich strach, na wszelkiej twarzy będzie wstyd i na wszystkich ich głowach łysina."
"Ez7,19": "Swoje srebro porzucą na ulice, a ich złoto będzie jak nieczystość. Ich srebro i złoto nie będzie ich mogło wybawić w dzień gniewu PANA. Nie nasycą nimi swojej duszy ani nie napełnią swych wnętrzności, bo były dla nich kamieniem potknięcia do nieprawości;"
"Ez7,20": "W sławie swojej ozdoby, którą Bóg wystawił na swoją chwałę, uczynili posągi swoich obrzydliwości i plugastw. Dlatego zamienię im ją w nieczystość."
"Ez7,21": "Wydam ją w ręce cudzoziemców na grabież i bezbożnych ziemi na łup, a oni ją splugawią."
"Ez7,22": "Odwrócę też od nich swą twarz, a zbezczeszczą moją świątynię. Wejdą bowiem do niej zbójcy i splugawią ją."
"Ez7,23": "Uczyń łańcuch, bo ziemia jest pełna krwawych wyroków, a miasto pełne przemocy."
"Ez7,24": "Dlatego sprowadzę najgorszych z pogan, aby posiedli ich domy. Położę kres pysze mocarzy, a ich miejsca święte będą splugawione."
"Ez7,25": "Nadchodzi zniszczenie, dlatego będą szukać pokoju, ale go nie będzie."
"Ez7,26": "Przyjdzie klęska za klęską, wieść za wieścią nadejdzie; będą szukać widzenia od proroka, ale prawo przepadnie kapłanowi, a rada starcom."
"Ez7,27": "Król będzie w żałobie, książę okryje się smutkiem i ręce ludu ziemi będą strwożone. Uczynię im według ich drogi i według ich sądów osądzę ich. I poznają, że ja jestem PANEM."
