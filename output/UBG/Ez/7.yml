"Ez7,1":
  text: "Potem doszło do mnie słowo PANA mówiące:"
  tags: []
"Ez7,2":
  text: "Synu człowieczy, tak mówi Pan BÓG do ziemi Izraela: Koniec, koniec nadszedł dla wszystkich czterech stron ziemi."
  tags: []
"Ez7,3":
  text: "Teraz nadejdzie koniec dla ciebie. Ześlę na ciebie swój gniew, będę cię sądził według twoich dróg i oddam ci według wszystkich twoich obrzydliwości."
  tags: []
"Ez7,4":
  text: "Moje oko nie oszczędzi cię i nie zlituję się nad tobą, ale oddam ci za twoje drogi, a twoje obrzydliwości zostaną pośród ciebie, i poznacie, że ja jestem PANEM."
  tags: []
"Ez7,5":
  text: "Tak mówi Pan BÓG: Utrapienie, oto nadchodzi jedno utrapienie."
  tags: []
"Ez7,6":
  text: "Nadszedł koniec, przyszedł koniec, ocknął się przeciwko tobie, oto nadszedł."
  tags: []
"Ez7,7":
  text: "Nadszedł poranek dla ciebie, obywatelu ziemi. Nadszedł czas, zbliża się dzień grzmotu, a nie głosu rozlegającego się po górach."
  tags: []
"Ez7,8":
  text: "Już wkrótce wyleję swój gniew na ciebie i dopełnię na tobie swojej zapalczywości. Osądzę cię według twoich dróg i oddam ci za wszystkie twoje obrzydliwości."
  tags: []
"Ez7,9":
  text: "Moje oko nie oszczędzi cię i nie zlituję się nad tobą, ale oddam ci według twoich dróg i twoich obrzydliwości, które znajdują się pośród ciebie. I tak poznacie, że ja jestem PANEM, który uderza."
  tags: []
"Ez7,10":
  text: "Oto ten dzień, oto nadszedł; nastał poranek, zakwitła rózga, wyrosła pycha."
  tags: []
"Ez7,11":
  text: "Przemoc wyrosła w rózgę niegodziwości. Nie pozostanie z nich nic – ani z ich mnóstwa, ani z ich bogactwa i nie będzie żadnego zawodzenia nad nimi."
  tags: []
"Ez7,12":
  text: "Nadszedł czas, zbliża się dzień. Kto kupuje, niech się nie cieszy, a kto sprzedaje, niech się nie smuci, bo przyjdzie gniew na całe ich mnóstwo."
  tags: []
"Ez7,13":
  text: "Bo ten, kto sprzedał, nie wróci do rzeczy sprzedanej, choćby jeszcze żył. Widzenie bowiem dotyczące całego ich mnóstwa nie będzie cofnięte i nikt nie wzmocni się w nieprawości swego życia."
  tags: []
"Ez7,14":
  text: "Zadęli w trąbę i wszystko przygotowali, lecz nikt nie ruszy do walki. Mój gniew bowiem jest skierowany na całe ich mnóstwo."
  tags: []
"Ez7,15":
  text: "Miecz na zewnątrz, a zaraza i głód wewnątrz. Kto będzie na polu, umrze od miecza, a kto w mieście, tego pochłoną głód i zaraza."
  tags: []
"Ez7,16":
  text: "Lecz ci, którzy z nich uciekną, będą w górach jak gołębice z dolin. Wszyscy będą lamentować, każdy nad swoją nieprawością."
  tags: []
"Ez7,17":
  text: "Wszystkie ręce opadną i wszystkie kolana osłabną jak woda."
  tags: []
"Ez7,18":
  text: "Obleką się w wory, okryje ich strach, na wszelkiej twarzy będzie wstyd i na wszystkich ich głowach łysina."
  tags: []
"Ez7,19":
  text: "Swoje srebro porzucą na ulice, a ich złoto będzie jak nieczystość. Ich srebro i złoto nie będzie ich mogło wybawić w dzień gniewu PANA. Nie nasycą nimi swojej duszy ani nie napełnią swych wnętrzności, bo były dla nich kamieniem potknięcia do nieprawości;"
  tags: []
"Ez7,20":
  text: "W sławie swojej ozdoby, którą Bóg wystawił na swoją chwałę, uczynili posągi swoich obrzydliwości i plugastw. Dlatego zamienię im ją w nieczystość."
  tags: []
"Ez7,21":
  text: "Wydam ją w ręce cudzoziemców na grabież i bezbożnych ziemi na łup, a oni ją splugawią."
  tags: []
"Ez7,22":
  text: "Odwrócę też od nich swą twarz, a zbezczeszczą moją świątynię. Wejdą bowiem do niej zbójcy i splugawią ją."
  tags: []
"Ez7,23":
  text: "Uczyń łańcuch, bo ziemia jest pełna krwawych wyroków, a miasto pełne przemocy."
  tags: []
"Ez7,24":
  text: "Dlatego sprowadzę najgorszych z pogan, aby posiedli ich domy. Położę kres pysze mocarzy, a ich miejsca święte będą splugawione."
  tags: []
"Ez7,25":
  text: "Nadchodzi zniszczenie, dlatego będą szukać pokoju, ale go nie będzie."
  tags: []
"Ez7,26":
  text: "Przyjdzie klęska za klęską, wieść za wieścią nadejdzie; będą szukać widzenia od proroka, ale prawo przepadnie kapłanowi, a rada starcom."
  tags: []
"Ez7,27":
  text: "Król będzie w żałobie, książę okryje się smutkiem i ręce ludu ziemi będą strwożone. Uczynię im według ich drogi i według ich sądów osądzę ich. I poznają, że ja jestem PANEM."
  tags: []
