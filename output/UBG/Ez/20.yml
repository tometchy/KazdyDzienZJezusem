"Ez20,1":
  text: "W siódmym roku, w piątym miesiącu, dziesiątego dnia tego miesiąca, przyszli niektórzy spośród starszych Izraela, aby radzić się PANA, i usiedli przede mną."
  tags: []
"Ez20,2":
  text: "Wtedy doszło do mnie słowo PANA mówiące:"
  tags: []
"Ez20,3":
  text: "Synu człowieczy, przemów do starszych Izraela i powiedz im: Tak mówi Pan BÓG: Czy przychodzicie, aby się mnie radzić? Jak żyję, nie pozwolę wam radzić się mnie, mówi Pan BÓG;"
  tags: []
"Ez20,4":
  text: "Czy będziesz ich sądził, synu człowieczy, czy będziesz ich sądził? Uświadom im obrzydliwości ich ojców."
  tags: []
"Ez20,5":
  text: "Powiedz im: Tak mówi Pan BÓG: W dniu, kiedy wybrałem Izraela i podniosłem rękę ku potomstwu domu Jakuba, i dałem się im poznać w ziemi Egiptu, kiedy podniosłem rękę ku nim, mówiąc: ja jestem PANEM, waszym Bogiem;"
  tags: []
"Ez20,6":
  text: "Tego dnia podniosłem ku nim swoją rękę, że wyprowadzę ich z ziemi Egiptu do ziemi, którą im wyszukałem, opływającej mlekiem i miodem, która jest ozdobą wszystkich ziem."
  tags: []
"Ez20,7":
  text: "I powiedziałem im: Niech każdy z was porzuci obrzydliwości sprzed swych oczu, a nie kalajcie się bożkami Egiptu. Ja jestem PANEM, waszym Bogiem."
  tags: []
"Ez20,8":
  text: "Ale buntowali się i nie chcieli mnie słuchać: żaden z nich nie odrzucił obrzydliwości sprzed swych oczu ani nie opuścił bożków Egiptu. Wtedy powiedziałem: Wyleję na nich swój gniew, aby dopełnić na nich mojej zapalczywości w środku ziemi Egiptu."
  tags: []
"Ez20,9":
  text: "Działałem ze względu na moje imię, aby nie było zbezczeszczone na oczach tych narodów, wśród których byli i przed których oczami dałem się im poznać, wyprowadzając ich z ziemi Egiptu."
  tags: []
"Ez20,10":
  text: "A tak wyprowadziłem ich z ziemi Egiptu i przyprowadziłem na pustynię."
  tags: []
"Ez20,11":
  text: "Dałem im moje ustawy i objawiłem im moje prawa, które jeśli człowiek wypełnia, będzie przez nie żył."
  tags: []
"Ez20,12":
  text: "Ponadto dałem im moje szabaty, aby były znakiem między mną a nimi, aby wiedzieli, że ja jestem PANEM, który ich uświęca."
  tags: []
"Ez20,13":
  text: "Ale dom Izraela zbuntował się przeciwko mnie na pustyni: nie postępowali według moich ustaw i wzgardzili moimi prawami, które jeśli człowiek wypełnia, będzie przez nie żył. Również moje szabaty bezcześcili. Dlatego powiedziałem, że wyleję na nich moją zapalczywość na pustyni, aby ich wytracić."
  tags: []
"Ez20,14":
  text: "Lecz działałem ze względu na moje imię, aby nie było zbezczeszczone na oczach tych narodów, przed których oczami ich wyprowadziłem."
  tags: []
"Ez20,15":
  text: "Ponadto podniosłem ku nim swą rękę na tej pustyni, że nie wprowadzę ich do ziemi, którą im dałem, opływającej mlekiem i miodem, która jest ozdobą wszystkich ziem;"
  tags: []
"Ez20,16":
  text: "Ponieważ wzgardzili moimi prawami, nie postępowali według moich ustaw i bezcześcili moje szabaty, gdyż ich serce poszło za ich bożkami."
  tags: []
"Ez20,17":
  text: "Ale moje oko zlitowało się nad nimi tak, że ich nie wytraciłem i nie wyniszczyłem na pustyni."
  tags: []
"Ez20,18":
  text: "Powiedziałem do ich synów na tej pustyni: Nie postępujcie według ustaw waszych ojców i nie przestrzegajcie ich praw ani nie kalajcie się ich bożkami."
  tags: []
"Ez20,19":
  text: "Ja jestem PANEM, waszym Bogiem; postępujcie według moich ustaw, a strzeżcie moich praw i wypełniajcie je;"
  tags: []
"Ez20,20":
  text: "Święćcie też moje szabaty, będą one znakiem między mną a wami, abyście wiedzieli, że ja jestem PANEM, waszym Bogiem."
  tags: []
"Ez20,21":
  text: "Lecz ci synowie zbuntowali się przeciwko mnie: nie postępowali według moich ustaw, nie przestrzegali moich praw, aby je wypełnić; praw, które jeśli człowiek wypełnia, będzie przez nie żył, i zbezcześcili moje szabaty. Wtedy powiedziałem: Wyleję na nich swój gniew, aby dopełnić na nich mojej zapalczywości na tej pustyni."
  tags: []
"Ez20,22":
  text: "Lecz cofnąłem moją rękę i działałem ze względu na moje imię, aby nie było zbezczeszczone na oczach tych narodów, przed których oczami ich wyprowadziłem."
  tags: []
"Ez20,23":
  text: "Podniosłem ku nim moją rękę na pustyni, że ich rozproszę pomiędzy poganami i rozrzucę po ziemiach;"
  tags: []
"Ez20,24":
  text: "Ponieważ nie wykonywali moich sądów, wzgardzili moimi ustawami, zbezcześcili moje szabaty, a ich oczy zwracały się ku bożkom ich ojców."
  tags: []
"Ez20,25":
  text: "Dlatego dałem im też ustawy, które nie były dobre, i sądy, według których nie mogli żyć;"
  tags: []
"Ez20,26":
  text: "I splugawiłem ich własnymi ich darami, gdy przeprowadzili przez ogień wszystko, co pierworodne, aby ich spustoszyć, i aby poznali, że ja jestem PANEM."
  tags: []
"Ez20,27":
  text: "Dlatego, synu człowieczy, przemów do domu Izraela i powiedz mu: Tak mówi Pan BÓG: Jeszcze i w tym lżyli mnie wasi ojcowie, dopuszczając się przeciwko mnie przestępstwa."
  tags: []
"Ez20,28":
  text: "Gdy bowiem wprowadziłem ich do ziemi, którą przysiągłem im dać, to gdy zobaczyli jakikolwiek wysoki pagórek i jakiekolwiek drzewa gałęziste, zaraz tam składali swoje ofiary i tam oddawali swoje drażniące dary, tam też składali swoją miłą woń i wylewali swoje ofiary z płynów."
  tags: []
"Ez20,29":
  text: "I zapytałem ich: Cóż to za wyżyna, do której wy chodzicie? A nazywa się ją Bamah aż do dziś."
  tags: []
"Ez20,30":
  text: "Dlatego powiedz domowi Izraela: Tak mówi Pan BÓG: Czy kalacie się drogami swoich ojców i uprawiacie nierząd z ich obrzydliwościami?"
  tags: []
"Ez20,31":
  text: "Gdy składacie swoje ofiary i przeprowadzacie swoich synów przez ogień, to kalacie się wszystkimi waszymi bożkami aż do dziś. Czy mam pozwolić wam radzić się u mnie, domu Izraela? Jak żyję, mówi Pan BÓG, nie pozwolę wam się radzić u mnie."
  tags: []
"Ez20,32":
  text: "A to, co wam na myśl przychodzi, nigdy się nie stanie. Mówicie bowiem: Będziemy jak inne narody, jak plemiona innych ziem, będziemy służyć drewnu i kamieniowi;"
  tags: []
"Ez20,33":
  text: "Jak żyję, mówi Pan BÓG, potężną ręką, wyciągniętym ramieniem i w wylanej zapalczywości będę królował nad wami."
  tags: []
"Ez20,34":
  text: "I wyprowadzę was spośród narodów i zgromadzę was z ziem, do których zostaliście rozproszeni, potężną ręką, wyciągniętym ramieniem i w wylanej zapalczywości;"
  tags: []
"Ez20,35":
  text: "Zaprowadzę was na pustynię tych narodów i tam będę was sądzić twarzą w twarz."
  tags: []
"Ez20,36":
  text: "Jak sądziłem waszych ojców na pustyni ziemi Egiptu, tak was będę sądzić, mówi Pan BÓG;"
  tags: []
"Ez20,37":
  text: "I przeprowadzę was pod rózgą, i wprowadzę was w związek przymierza."
  tags: []
"Ez20,38":
  text: "I oddzielę od was buntowników i tych, którzy grzeszą przeciwko mnie. Wyprowadzę ich z ziemi, gdzie przebywają, lecz do ziemi Izraela nie wejdą. I poznacie, że ja jestem PANEM."
  tags: []
"Ez20,39":
  text: "Wy więc, domu Izraela, tak mówi Pan BÓG: Idźcie i służcie, każdy swoim bożkom, nawet i w przyszłości, ponieważ mnie nie słuchacie; ale już więcej nie kalajcie mego świętego imienia waszymi darami i waszymi bożkami."
  tags: []
"Ez20,40":
  text: "Na mojej świętej górze bowiem, na wysokiej górze Izraela, mówi Pan BÓG, tam cały dom Izraela będzie mi służyć, wszyscy, którzy będą w tej ziemi. Tam ich przyjmę i tam będę żądał waszych ofiar, waszych ofiar z pierwocin wraz ze wszystkimi waszymi świętymi rzeczami."
  tags: []
"Ez20,41":
  text: "Z waszą miłą wonią przyjmę was łaskawie, gdy was wyprowadzę spośród narodów i zgromadzę was z tych ziem, do których zostaliście rozproszeni; i będę uświęcony w was na oczach tych narodów."
  tags: []
"Ez20,42":
  text: "I poznacie, że ja jestem PANEM, gdy was wprowadzę do ziemi Izraela, do tej ziemi, co do której podniosłem swoją rękę, że dam ją waszym ojcom."
  tags: []
"Ez20,43":
  text: "Tam wspomnicie o waszych drogach i o wszystkich waszych czynach, którymi się splugawiliście; i obrzydzicie sobie siebie samych za wszystkie wasze złe czyny, które popełniliście."
  tags: []
"Ez20,44":
  text: "Tam poznacie, że ja jestem PANEM, gdy postąpię z wami przez wzgląd na swoje imię, a nie według waszych złych dróg ani według waszych zepsutych czynów, domu Izraela, mówi Pan BÓG."
  tags: []
"Ez20,45":
  text: "I doszło do mnie słowo PANA mówiące:"
  tags: []
"Ez20,46":
  text: "Synu człowieczy, odwróć swoją twarz w stronę południa i krop swoją mowę ku południu, i prorokuj przeciwko lasowi południowego pola;"
  tags: []
"Ez20,47":
  text: "Powiedz do południowego lasu: Słuchaj słowa PANA: Tak mówi Pan BÓG: Oto rozniecę w tobie ogień, który strawi w tobie wszelkie drzewo zielone i wszelkie drzewo suche. Nie zostanie ugaszony płomień pałający i spłoną w nim wszystkie twarze od południa aż do północy."
  tags: []
"Ez20,48":
  text: "I wszelkie ciało ujrzy, że ja, PAN, go rozpaliłem; nie będzie ugaszony."
  tags: []
"Ez20,49":
  text: "I powiedziałem: Ach, Panie BOŻE! Oni mówią o mnie: On tylko mówi w przypowieściach."
  tags: []
