"Ez29,1": "W dziesiątym roku, dziesiątego miesiąca, dwunastego dnia tego miesiąca doszło do mnie słowo PANA mówiące:"
"Ez29,2": "Synu człowieczy, zwróć swoją twarz przeciwko faraonowi, królowi Egiptu, i prorokuj przeciw niemu i całemu Egiptowi."
"Ez29,3": "Przemów i powiedz: Tak mówi Pan BÓG: Oto jestem przeciwko tobie, faraonie, królu Egiptu, wielki smoku leżący wśród swoich rzek, który mówisz: Moja jest rzeka, ja ją sobie uczyniłem."
"Ez29,4": "Dlatego włożę haki w twoje szczęki i sprawię, że ryby twoich rzek przylgną do twoich łusek. Wyciągnę cię spośród twoich rzek i wszystkie ryby twoich rzek przylgną do twoich łusek."
"Ez29,5": "I zostawię cię na pustyni, ciebie i wszystkie ryby twoich rzek. Upadniesz na otwartym polu i nie będziesz zebrany ani zgromadzony. Dam cię na pożarcie zwierzętom ziemi i ptactwu nieba."
"Ez29,6": "I poznają wszyscy mieszkańcy Egiptu, że ja jestem PANEM, ponieważ byłeś laską z trzciny dla domu Izraela."
"Ez29,7": "Gdy chwytali się ciebie ręką, łamałeś się i rozcinałeś im całe ramię. Gdy się opierali na tobie, kruszyłeś się i unieruchamiałeś im wszystkie biodra."
"Ez29,8": "Dlatego tak mówi Pan BÓG: Oto sprowadzę na ciebie miecz i wytracę z ciebie człowieka i zwierzę."
"Ez29,9": "A ziemia Egiptu będzie spustoszeniem i pustkowiem; i poznają, że ja jestem PANEM, ponieważ mówiłeś: Moja jest rzeka, ja ją sobie uczyniłem."
"Ez29,10": "Dlatego oto ja będę przeciwko tobie i przeciwko twojej rzece i zamienię ziemię Egiptu w straszną ruinę i spustoszenie, od wieży Sewene aż do granic Etiopii."
"Ez29,11": "Nie przejdzie przez nią noga człowieka ani też nie przejdzie przez nią noga zwierzęcia, i nie będzie zamieszkana przez czterdzieści lat."
"Ez29,12": "I uczynię z ziemi Egiptu pustkowie pośród spustoszonych ziem, a jej miasta wśród zrujnowanych miast będą spustoszone przez czterdzieści lat. I rozproszę Egipcjan między narodami, i rozrzucę ich po ziemiach."
"Ez29,13": "Jednak tak mówi Pan BÓG: Po upływie czterdziestu lat zgromadzę Egipcjan z narodów, wśród których zostali rozproszeni."
"Ez29,14": "I odwrócę niewolę Egiptu, i przyprowadzę ich do ziemi Patros, do ziemi ich zamieszkania, i będą tam nieznacznym królestwem."
"Ez29,15": "Będzie ono najmniej znaczące spośród królestw i nie wyniesie się więcej nad inne narody. Umniejszę ich, aby nie panowali nad narodami."
"Ez29,16": "I nie będzie już ufnością domu Izraela, co przypominałoby o jego nieprawości, gdy zwracał się do niego. I poznają, że ja jestem Panem BOGIEM."
"Ez29,17": "Potem, w roku dwudziestym siódmym, w pierwszym miesiącu, pierwszego dnia tego miesiąca, doszło do mnie słowo PANA:"
"Ez29,18": "Synu człowieczy, Nabuchodonozor, król Babilonu, zmusił swoje wojsko do ciężkiej służby przeciwko Tyrowi: każda głowa wyłysiała i każde ramię się obnażyło, lecz ani on, ani jego wojsko nie otrzymali zapłaty z Tyru za tę służbę, którą podejmował, walcząc przeciwko niemu."
"Ez29,19": "Dlatego tak mówi Pan BÓG: Oto daję Nabuchodonozorowi, królowi Babilonu, ziemię Egiptu, i zabierze jej dostatek, weźmie jej łup, i pochwyci jej zdobycze, aby to było zapłatą dla jego wojska."
"Ez29,20": "Daję im ziemię Egiptu za ich pracę, którą dla mnie podjęli, gdyż dla mnie pracowali, mówi Pan BÓG."
"Ez29,21": "W tym dniu sprawię, że wyrośnie róg domu Izraela, tobie też pozwolę otworzyć usta pośród nich. I poznają, że ja jestem PANEM."
