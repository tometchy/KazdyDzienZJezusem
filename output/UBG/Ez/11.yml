"Ez11,1":
  text: "Potem duch uniósł mnie i zaprowadził do wschodniej bramy domu PANA, która jest zwrócona na wschód. A oto u wejścia tej bramy było dwudziestu pięciu mężczyzn, wśród których zobaczyłem Jaazaniasza, syna Azzura, i Pelatiasza, syna Benajasza, książąt ludu."
  tags: []
"Ez11,2":
  text: "Wtedy powiedział mi: Synu człowieczy, to są mężczyźni, którzy obmyślają nieprawość i dają złe rady w tym mieście;"
  tags: []
"Ez11,3":
  text: "Mówią: To nie tak blisko, budujmy domy. Oto miasto jest kotłem, a my – mięsem."
  tags: []
"Ez11,4":
  text: "Dlatego prorokuj przeciwko nim, prorokuj, synu człowieczy!"
  tags: []
"Ez11,5":
  text: "Wtedy zstąpił na mnie Duch PANA i powiedział do mnie: Mów: Tak mówi PAN: Tak mówiliście, domu Izraela. Znam bowiem wszystko, co wam przychodzi na myśl."
  tags: []
"Ez11,6":
  text: "Zabiliście wielkie mnóstwo ludzi w tym mieście i napełniliście ulice zabitymi."
  tags: []
"Ez11,7":
  text: "Dlatego tak mówi Pan BÓG: Wasi zabici, których położyliście w środku miasta, są mięsem, a miasto – kotłem. Lecz wyprowadzę was z niego."
  tags: []
"Ez11,8":
  text: "Baliście się miecza, a ja sprowadzę na was miecz, mówi Pan BÓG."
  tags: []
"Ez11,9":
  text: "A wyprowadzę was z niego, wydam was w ręce obcych i wykonam nad wami sądy."
  tags: []
"Ez11,10":
  text: "Padniecie od miecza, osądzę was na granicy Izraela i dowiecie się, że ja jestem PANEM."
  tags: []
"Ez11,11":
  text: "Miasto nie będzie dla was kotłem ani wy nie będziecie w nim mięsem; na granicy Izraela osądzę was."
  tags: []
"Ez11,12":
  text: "I dowiecie się, że ja jestem PANEM, ponieważ nie postępowaliście według moich ustaw, nie wykonaliście moich sądów, ale czyniliście według sądów tych pogan, którzy są dokoła was."
  tags: []
"Ez11,13":
  text: "A gdy prorokowałem, umarł Pelatiasz, syn Benajasza. Wtedy upadłem na twarz i zawołałem donośnym głosem: Ach, Panie BOŻE! Czy doszczętnie wyniszczysz resztkę Izraela?"
  tags: []
"Ez11,14":
  text: "I doszło do mnie słowo PANA mówiące:"
  tags: []
"Ez11,15":
  text: "Synu człowieczy, twoi bracia, właśnie twoi bracia, twoi krewni i cały dom Izraela są tymi, do których mówili mieszkańcy Jerozolimy: Oddalcie się od PANA. Nam została dana ta ziemia w posiadanie."
  tags: []
"Ez11,16":
  text: "Dlatego mów: Tak mówi Pan BÓG: Chociaż wygnałem ich daleko pomiędzy pogan i chociaż rozproszyłem ich po krajach, jednak przez krótki czas będę dla nich świątynią w krajach, do których przybędą."
  tags: []
"Ez11,17":
  text: "Dlatego mów: Tak mówi Pan BÓG: Zgromadzę was z pogan i zbiorę was z krajów, do których zostaliście rozproszeni, i dam wam ziemię Izraela."
  tags: []
"Ez11,18":
  text: "Wejdą tam i usuną z niej wszystkie jej plugastwa i wszystkie jej obrzydliwości."
  tags: []
"Ez11,19":
  text: "I dam im jedno serce, i włożę nowego ducha w wasze wnętrze; usunę z ich ciała serce kamienne, a dam im serce mięsiste;"
  tags: []
"Ez11,20":
  text: "Aby postępowali według moich ustaw i strzegli moich sądów oraz czynili je. I będą moim ludem, a ja będę ich Bogiem."
  tags: []
"Ez11,21":
  text: "Ale co do tych, których serce chodzi za żądzami ich plugastw i obrzydliwości, złożę im na głowę ich własną drogę, mówi Pan BÓG."
  tags: []
"Ez11,22":
  text: "Wtedy cherubiny podniosły swoje skrzydła i wraz z nimi koła, a chwała Boga Izraela była nad nimi u góry."
  tags: []
"Ez11,23":
  text: "I odeszła chwała PANA z pośrodku miasta, i stanęła na górze, która jest na wschód od miasta."
  tags: []
"Ez11,24":
  text: "A duch uniósł mnie i przyprowadził w widzeniu przez Ducha Bożego do ziemi Chaldei, do pojmanych. I odeszło ode mnie widzenie, które miałem."
  tags: []
"Ez11,25":
  text: "Następnie opowiedziałem pojmanym te wszystkie rzeczy, które PAN mi ukazał."
  tags: []
