"Ez11,1": "Potem duch uniósł mnie i zaprowadził do wschodniej bramy domu PANA, która jest zwrócona na wschód. A oto u wejścia tej bramy było dwudziestu pięciu mężczyzn, wśród których zobaczyłem Jaazaniasza, syna Azzura, i Pelatiasza, syna Benajasza, książąt ludu."
"Ez11,2": "Wtedy powiedział mi: Synu człowieczy, to są mężczyźni, którzy obmyślają nieprawość i dają złe rady w tym mieście;"
"Ez11,3": "Mówią: To nie tak blisko, budujmy domy. Oto miasto jest kotłem, a my – mięsem."
"Ez11,4": "Dlatego prorokuj przeciwko nim, prorokuj, synu człowieczy!"
"Ez11,5": "Wtedy zstąpił na mnie Duch PANA i powiedział do mnie: Mów: Tak mówi PAN: Tak mówiliście, domu Izraela. Znam bowiem wszystko, co wam przychodzi na myśl."
"Ez11,6": "Zabiliście wielkie mnóstwo ludzi w tym mieście i napełniliście ulice zabitymi."
"Ez11,7": "Dlatego tak mówi Pan BÓG: Wasi zabici, których położyliście w środku miasta, są mięsem, a miasto – kotłem. Lecz wyprowadzę was z niego."
"Ez11,8": "Baliście się miecza, a ja sprowadzę na was miecz, mówi Pan BÓG."
"Ez11,9": "A wyprowadzę was z niego, wydam was w ręce obcych i wykonam nad wami sądy."
"Ez11,10": "Padniecie od miecza, osądzę was na granicy Izraela i dowiecie się, że ja jestem PANEM."
"Ez11,11": "Miasto nie będzie dla was kotłem ani wy nie będziecie w nim mięsem; na granicy Izraela osądzę was."
"Ez11,12": "I dowiecie się, że ja jestem PANEM, ponieważ nie postępowaliście według moich ustaw, nie wykonaliście moich sądów, ale czyniliście według sądów tych pogan, którzy są dokoła was."
"Ez11,13": "A gdy prorokowałem, umarł Pelatiasz, syn Benajasza. Wtedy upadłem na twarz i zawołałem donośnym głosem: Ach, Panie BOŻE! Czy doszczętnie wyniszczysz resztkę Izraela?"
"Ez11,14": "I doszło do mnie słowo PANA mówiące:"
"Ez11,15": "Synu człowieczy, twoi bracia, właśnie twoi bracia, twoi krewni i cały dom Izraela są tymi, do których mówili mieszkańcy Jerozolimy: Oddalcie się od PANA. Nam została dana ta ziemia w posiadanie."
"Ez11,16": "Dlatego mów: Tak mówi Pan BÓG: Chociaż wygnałem ich daleko pomiędzy pogan i chociaż rozproszyłem ich po krajach, jednak przez krótki czas będę dla nich świątynią w krajach, do których przybędą."
"Ez11,17": "Dlatego mów: Tak mówi Pan BÓG: Zgromadzę was z pogan i zbiorę was z krajów, do których zostaliście rozproszeni, i dam wam ziemię Izraela."
"Ez11,18": "Wejdą tam i usuną z niej wszystkie jej plugastwa i wszystkie jej obrzydliwości."
"Ez11,19": "I dam im jedno serce, i włożę nowego ducha w wasze wnętrze; usunę z ich ciała serce kamienne, a dam im serce mięsiste;"
"Ez11,20": "Aby postępowali według moich ustaw i strzegli moich sądów oraz czynili je. I będą moim ludem, a ja będę ich Bogiem."
"Ez11,21": "Ale co do tych, których serce chodzi za żądzami ich plugastw i obrzydliwości, złożę im na głowę ich własną drogę, mówi Pan BÓG."
"Ez11,22": "Wtedy cherubiny podniosły swoje skrzydła i wraz z nimi koła, a chwała Boga Izraela była nad nimi u góry."
"Ez11,23": "I odeszła chwała PANA z pośrodku miasta, i stanęła na górze, która jest na wschód od miasta."
"Ez11,24": "A duch uniósł mnie i przyprowadził w widzeniu przez Ducha Bożego do ziemi Chaldei, do pojmanych. I odeszło ode mnie widzenie, które miałem."
"Ez11,25": "Następnie opowiedziałem pojmanym te wszystkie rzeczy, które PAN mi ukazał."
