"Ez1,1": "I stało się w trzydziestym roku, w czwartym miesiącu, piątego dnia tego miesiąca, gdy byłem wśród uprowadzonych nad rzeką Kebar, że otworzyły się niebiosa i miałem widzenie Boże."
"Ez1,2": "Piątego dnia tego miesiąca – był to piąty rok od uprowadzenia do niewoli króla Jojakina;"
"Ez1,3": "Słowo PANA doszło wyraźnie do kapłana Ezechiela, syna Buziego, w ziemi Chaldejczyków nad rzeką Kebar, a była nad nim ręka PANA."
"Ez1,4": "I spojrzałem, a oto gwałtowny wiatr nadszedł od północy, a z nim wielka chmura, ogień pałający oraz blask dokoła niego, a z jego środka widoczne było coś jakby blask bursztynu – ze środka ognia."
"Ez1,5": "Także ze środka ukazało się coś na kształt czterech istot żywych. A wyglądały tak: miały one postać człowieka."
"Ez1,6": "Każda z nich miała po cztery twarze i każda po cztery skrzydła."
"Ez1,7": "Ich nogi były proste, a ich stopy jak stopy u cielca; lśniły jak polerowany brąz."
"Ez1,8": "Pod skrzydłami, po czterech bokach, miały ręce ludzkie; a one cztery miały twarze i skrzydła."
"Ez1,9": "Ich skrzydła były złączone jedno z drugim; gdy szły, nie odwracały się, ale każda istota szła prosto przed siebie."
"Ez1,10": "A ich twarze miały taki wygląd: wszystkie cztery miały z przodu twarz ludzką, z prawej strony – twarz lwa, z lewej strony wszystkie cztery miały twarze wołu, a także z tyłu miały wszystkie twarz orła."
"Ez1,11": "A ich twarze i skrzydła były rozwinięte ku górze; dwa skrzydła każdej istoty łączyły się ze sobą, a dwa okrywały ich ciało;"
"Ez1,12": "A każda z istot szła prosto przed siebie. Dokądkolwiek duch zmierzał, tam szły, a gdy szły, nie odwracały się."
"Ez1,13": "A wygląd tych istot był taki: wyglądały jak węgle rozżarzone w ogniu, jak palące się pochodnie. Ten ogień krążył między istotami, jaśniał blaskiem, a z niego wychodziła błyskawica."
"Ez1,14": "Te istoty biegały tam i z powrotem jak błysk pioruna."
"Ez1,15": "A gdy się przypatrywałem tym istotom żywym, oto znajdowało się jedno koło na ziemi przy tych czterech istotach mających cztery twarze;"
"Ez1,16": "Wygląd tych kół i ich wykonanie były jak blask berylu i wszystkie cztery koła miały jednakowy kształt, a tak wyglądały i tak były wykonane, jakby jedno koło było w środku drugiego koła;"
"Ez1,17": "Gdy się poruszały, szły w czterech kierunkach, a idąc, nie odwracały się."
"Ez1,18": "Obręcze były tak wysokie, że wzbudzały strach, a te cztery obręcze miały pełno oczu wokoło."
"Ez1,19": "A gdy istoty żywe szły, koła szły obok nich; gdy istoty żywe podnosiły się ponad ziemię, podnosiły się także koła."
"Ez1,20": "Dokądkolwiek zmierzał duch, tam szły – właśnie tam, gdzie zmierzał duch; a koła podnosiły się przed nimi, bo duch istot żywych był w kołach."
"Ez1,21": "Gdy one szły, poruszyły się i koła; gdy one stawały, zatrzymywały się i koła; a gdy podnosiły się ponad ziemię, wraz z nimi podnosiły się też koła, bo duch istot żywych był w kołach."
"Ez1,22": "Nad głowami istot żywych było coś na kształt sklepienia jak blask straszliwego kryształu, rozpostartego w górze nad ich głowami."
"Ez1,23": "A pod sklepieniem skrzydła ich były podniesione, jedno z drugim złączone; każda istota miała po dwa, którymi okrywała jedną stronę, i każda miała po dwa, którymi okrywała drugą stronę swego ciała."
"Ez1,24": "I gdy szły, słyszałem szum ich skrzydeł jak szum wielkich wód, jak głos Wszechmocnego i głos huku, jak zgiełk wojska. A gdy stały, opuszczały swoje skrzydła."
"Ez1,25": "Gdy stały i opuszczały swoje skrzydła, rozległ się głos znad sklepienia, które było nad ich głową."
"Ez1,26": "A ponad sklepieniem, które było nad ich głową, było coś podobnego do tronu, z wyglądu jak kamień szafiru. I u góry, na tym, co było podobne do tronu, znajdowało się coś z wyglądu przypominające człowieka."
"Ez1,27": "I widziałem jakby kolor bursztynu niczym ogień wewnątrz niego wokoło; od jego bioder wzwyż i od jego bioder w dół widziałem coś, co wyglądało jak ogień, a wokół niego blask."
"Ez1,28": "Jak widok tęczy, która pojawia się w chmurze w dzień deszczowy, tak wyglądał blask wokoło. To było widzenie podobieństwa chwały PANA. A gdy ją zobaczyłem, upadłem na twarz i usłyszałem głos mówiącego."
