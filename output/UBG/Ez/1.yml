"Ez1,1":
  text: "I stało się w trzydziestym roku, w czwartym miesiącu, piątego dnia tego miesiąca, gdy byłem wśród uprowadzonych nad rzeką Kebar, że otworzyły się niebiosa i miałem widzenie Boże."
  tags: []
"Ez1,2":
  text: "Piątego dnia tego miesiąca – był to piąty rok od uprowadzenia do niewoli króla Jojakina;"
  tags: []
"Ez1,3":
  text: "Słowo PANA doszło wyraźnie do kapłana Ezechiela, syna Buziego, w ziemi Chaldejczyków nad rzeką Kebar, a była nad nim ręka PANA."
  tags: []
"Ez1,4":
  text: "I spojrzałem, a oto gwałtowny wiatr nadszedł od północy, a z nim wielka chmura, ogień pałający oraz blask dokoła niego, a z jego środka widoczne było coś jakby blask bursztynu – ze środka ognia."
  tags: []
"Ez1,5":
  text: "Także ze środka ukazało się coś na kształt czterech istot żywych. A wyglądały tak: miały one postać człowieka."
  tags: []
"Ez1,6":
  text: "Każda z nich miała po cztery twarze i każda po cztery skrzydła."
  tags: []
"Ez1,7":
  text: "Ich nogi były proste, a ich stopy jak stopy u cielca; lśniły jak polerowany brąz."
  tags: []
"Ez1,8":
  text: "Pod skrzydłami, po czterech bokach, miały ręce ludzkie; a one cztery miały twarze i skrzydła."
  tags: []
"Ez1,9":
  text: "Ich skrzydła były złączone jedno z drugim; gdy szły, nie odwracały się, ale każda istota szła prosto przed siebie."
  tags: []
"Ez1,10":
  text: "A ich twarze miały taki wygląd: wszystkie cztery miały z przodu twarz ludzką, z prawej strony – twarz lwa, z lewej strony wszystkie cztery miały twarze wołu, a także z tyłu miały wszystkie twarz orła."
  tags: []
"Ez1,11":
  text: "A ich twarze i skrzydła były rozwinięte ku górze; dwa skrzydła każdej istoty łączyły się ze sobą, a dwa okrywały ich ciało;"
  tags: []
"Ez1,12":
  text: "A każda z istot szła prosto przed siebie. Dokądkolwiek duch zmierzał, tam szły, a gdy szły, nie odwracały się."
  tags: []
"Ez1,13":
  text: "A wygląd tych istot był taki: wyglądały jak węgle rozżarzone w ogniu, jak palące się pochodnie. Ten ogień krążył między istotami, jaśniał blaskiem, a z niego wychodziła błyskawica."
  tags: []
"Ez1,14":
  text: "Te istoty biegały tam i z powrotem jak błysk pioruna."
  tags: []
"Ez1,15":
  text: "A gdy się przypatrywałem tym istotom żywym, oto znajdowało się jedno koło na ziemi przy tych czterech istotach mających cztery twarze;"
  tags: []
"Ez1,16":
  text: "Wygląd tych kół i ich wykonanie były jak blask berylu i wszystkie cztery koła miały jednakowy kształt, a tak wyglądały i tak były wykonane, jakby jedno koło było w środku drugiego koła;"
  tags: []
"Ez1,17":
  text: "Gdy się poruszały, szły w czterech kierunkach, a idąc, nie odwracały się."
  tags: []
"Ez1,18":
  text: "Obręcze były tak wysokie, że wzbudzały strach, a te cztery obręcze miały pełno oczu wokoło."
  tags: []
"Ez1,19":
  text: "A gdy istoty żywe szły, koła szły obok nich; gdy istoty żywe podnosiły się ponad ziemię, podnosiły się także koła."
  tags: []
"Ez1,20":
  text: "Dokądkolwiek zmierzał duch, tam szły – właśnie tam, gdzie zmierzał duch; a koła podnosiły się przed nimi, bo duch istot żywych był w kołach."
  tags: []
"Ez1,21":
  text: "Gdy one szły, poruszyły się i koła; gdy one stawały, zatrzymywały się i koła; a gdy podnosiły się ponad ziemię, wraz z nimi podnosiły się też koła, bo duch istot żywych był w kołach."
  tags: []
"Ez1,22":
  text: "Nad głowami istot żywych było coś na kształt sklepienia jak blask straszliwego kryształu, rozpostartego w górze nad ich głowami."
  tags: []
"Ez1,23":
  text: "A pod sklepieniem skrzydła ich były podniesione, jedno z drugim złączone; każda istota miała po dwa, którymi okrywała jedną stronę, i każda miała po dwa, którymi okrywała drugą stronę swego ciała."
  tags: []
"Ez1,24":
  text: "I gdy szły, słyszałem szum ich skrzydeł jak szum wielkich wód, jak głos Wszechmocnego i głos huku, jak zgiełk wojska. A gdy stały, opuszczały swoje skrzydła."
  tags: []
"Ez1,25":
  text: "Gdy stały i opuszczały swoje skrzydła, rozległ się głos znad sklepienia, które było nad ich głową."
  tags: []
"Ez1,26":
  text: "A ponad sklepieniem, które było nad ich głową, było coś podobnego do tronu, z wyglądu jak kamień szafiru. I u góry, na tym, co było podobne do tronu, znajdowało się coś z wyglądu przypominające człowieka."
  tags: []
"Ez1,27":
  text: "I widziałem jakby kolor bursztynu niczym ogień wewnątrz niego wokoło; od jego bioder wzwyż i od jego bioder w dół widziałem coś, co wyglądało jak ogień, a wokół niego blask."
  tags: []
"Ez1,28":
  text: "Jak widok tęczy, która pojawia się w chmurze w dzień deszczowy, tak wyglądał blask wokoło. To było widzenie podobieństwa chwały PANA. A gdy ją zobaczyłem, upadłem na twarz i usłyszałem głos mówiącego."
  tags: []
