"Ez35,1": "I doszło do mnie słowo PANA mówiące:"
"Ez35,2": "Synu człowieczy, zwróć swoją twarz przeciwko górze Seir i prorokuj przeciwko niej."
"Ez35,3": "Mów do niej: Tak mówi Pan BÓG: Oto jestem przeciwko tobie, góro Seir, wyciągnę moją rękę przeciwko tobie i wydam cię na wielkie spustoszenie."
"Ez35,4": "Twoje miasta zamienię w ruiny i będziesz spustoszona. I poznasz, że ja jestem PANEM."
"Ez35,5": "Ponieważ żywiłaś wieczną nienawiść i wydałaś synów Izraela pod ostrze miecza w czasie ich utrapienia, w czasie wykonywania ich kary;"
"Ez35,6": "Dlatego, jak żyję, mówi Pan BÓG, wydam cię na zabicie i krew będzie cię ścigać. Ponieważ nie znienawidziłaś krwi, krew będzie cię ścigać."
"Ez35,7": "I zamienię górę Seir w wielkie spustoszenie, wygubię z niej każdego, który przechodzi i który wraca."
"Ez35,8": "Jej góry napełnię jej zabitymi. Na twoich pagórkach, na twoich dolinach i we wszystkich twoich strumieniach padną pobici mieczem."
"Ez35,9": "Zamienię cię w wieczne spustoszenie i twoje miasta nie będą zamieszkałe. I poznacie, że ja jestem PANEM."
"Ez35,10": "Ponieważ powiedziałaś: Te dwa narody i te dwa kraje będą moje, weźmiemy je w posiadanie, chociaż PAN tam przebywał;"
"Ez35,11": "Jak żyję, mówi Pan BÓG, uczynię według twego gniewu i według twojej zawiści, z jaką postąpiłaś w swej nienawiści względem nich, i dam się poznać wśród nich, gdy cię osądzę."
"Ez35,12": "I poznasz, że ja jestem PANEM i słyszałem wszystkie twoje obelgi, które wypowiedziałaś przeciw górom Izraela, mówiąc: Są spustoszone, zostały nam dane na pożarcie."
"Ez35,13": "Tak się wynosiliście swoimi ustami przeciwko mnie i mnożyliście swoje słowa przeciwko mnie. Ja to słyszałem."
"Ez35,14": "Tak mówi Pan BÓG: Kiedy cała ziemia będzie się radować, wtedy zamienię cię w pustkowie."
"Ez35,15": "Jak ty się radowałaś nad dziedzictwem domu Izraela, że zostało spustoszone, tak uczynię i tobie: będziesz spustoszona, góro Seir i cały Edomie. I poznają, że ja jestem PANEM."
