"Ez23,1":
  text: "I doszło do mnie słowo PANA mówiące:"
  tags: []
"Ez23,2":
  text: "Synu człowieczy, były dwie kobiety, córki jednej matki;"
  tags: []
"Ez23,3":
  text: "One uprawiały nierząd w Egipcie, w swojej młodości uprawiały nierząd; tam ściskano ich piersi i tam przygniatano piersi ich dziewictwa."
  tags: []
"Ez23,4":
  text: "A ich imiona: starsza Ohola, a jej siostra – Oholiba. One były moje i urodziły synów i córki. Ich imiona: Samaria to Ohola, a Jerozolima to Oholiba."
  tags: []
"Ez23,5":
  text: "Ohola uprawiała nierząd, będąc moją, zapałała namiętnością do swoich kochanków, do Asyryjczyków, sąsiadów;"
  tags: []
"Ez23,6":
  text: "Którzy byli odziani w błękit, dowódcy i rządcy, wszyscy oni to powabni młodzieńcy, jeźdźcy dosiadający koni;"
  tags: []
"Ez23,7":
  text: "Popełniała z nimi nierząd, ze wszystkimi najlepszymi synami Asyrii i ze wszystkimi, do których pałała namiętnością; plamiła się wszystkimi ich bożkami."
  tags: []
"Ez23,8":
  text: "Nie porzuciła też swego nierządu z Egiptu, bo spali z nią w jej młodości, przygniatali piersi jej dziewictwa i wylali na nią swój nierząd."
  tags: []
"Ez23,9":
  text: "Dlatego wydałem ją w ręce jej kochanków, w ręce Asyryjczyków, do których pałała namiętnością."
  tags: []
"Ez23,10":
  text: "Oni odsłonili jej nagość, zabrali jej synów i córki, a ją samą zabili mieczem. I stała się osławiona wśród kobiet, gdy wykonano na niej sąd."
  tags: []
"Ez23,11":
  text: "A choć widziała to jej siostra Oholiba, bardziej niż ona zapałała rozwiązłą miłością, a jej nierząd był jeszcze większy niż nierząd jej siostry."
  tags: []
"Ez23,12":
  text: "Do swych sąsiadów Asyryjczyków pałała namiętnością, do dowódców i rządców, i władców, ubranych w kosztowne szaty, do jeźdźców dosiadających konie, wszyscy oni to powabni młodzieńcy."
  tags: []
"Ez23,13":
  text: "I widziałem, że się hańbiła i że obydwie kroczyły tą samą drogą."
  tags: []
"Ez23,14":
  text: "Ale ta posunęła się jeszcze dalej w swoich nierządnych czynach, bo widząc mężczyzn wymalowanych na ścianie, obrazy Chaldejczyków malowane farbami;"
  tags: []
"Ez23,15":
  text: "Opasanych wokół bioder pasami, z zawojami ufarbowanymi na głowach – a wszyscy oni z wyglądu jak bohaterowie, podobni do Babilończyków pochodzących z ziemi Chaldei;"
  tags: []
"Ez23,16":
  text: "Pałała do nich namiętnością, jak tylko spojrzała na nich swymi oczami, i wyprawiła do nich posłańców, do Chaldei."
  tags: []
"Ez23,17":
  text: "Wtedy Babilończycy weszli do niej, na łoże miłości, i plamili ją swoim nierządem; a gdy się skalała z nimi, jej dusza odwróciła się od nich."
  tags: []
"Ez23,18":
  text: "I gdy ujawniła swoje czyny nierządne i odsłoniła swoją nagość, moja dusza odwróciła się od niej, tak jak odwróciła się moja dusza od jej siostry."
  tags: []
"Ez23,19":
  text: "Lecz ona mnożyła swoje czyny nierządne, przypominając sobie dni swojej młodości, kiedy uprawiała nierząd w ziemi Egiptu."
  tags: []
"Ez23,20":
  text: "I pałała namiętnością do ich kochanków, których ciała są jak ciała osłów, a ich wytrysk jak wytrysk koni."
  tags: []
"Ez23,21":
  text: "Tak powróciłaś do rozwiązłości swojej młodości, gdy Egipcjanie przygniatali twoje piersi dla piersi twojej młodości."
  tags: []
"Ez23,22":
  text: "Dlatego, Oholibo, tak mówi Pan BÓG: Oto pobudzę przeciwko tobie twoich kochanków, tych, od których odwróciła się twoja dusza, i sprowadzę ich zewsząd przeciwko tobie;"
  tags: []
"Ez23,23":
  text: "Babilończyków, wszystkich Chaldejczyków, Pekod, Szoa, Koa, a z nimi wszystkich Asyryjczyków. Oni wszyscy to powabni młodzieńcy, dowódcy i rządcy, dostojnicy i zacni ludzie, wszyscy jeżdżący na koniach."
  tags: []
"Ez23,24":
  text: "I wyruszą przeciwko tobie na rydwanach, na wozach żelaznych, na furmankach i z gromadą narodów. Zewsząd rozłożą się przeciwko tobie z puklerzami, tarczami i hełmami. I dam im prawo, aby cię sądzili według swoich praw."
  tags: []
"Ez23,25":
  text: "I wyleję na ciebie swoją zazdrość, i obejdą się z tobą z gniewem. Odetną ci nos i uszy, a twoja resztka polegnie od miecza. Wezmą twoich synów i twoje córki, a to, co z ciebie zostanie, strawi ogień."
  tags: []
"Ez23,26":
  text: "I zdejmą z ciebie twoje szaty, i zabiorą ci twoje piękne klejnoty."
  tags: []
"Ez23,27":
  text: "Tak położę kres twojej rozwiązłości i twojemu nierządowi, które przyniosłaś z ziemi Egiptu. Nie podniesiesz już ku nim swych oczu ani nie będziesz więcej wspominać Egiptu."
  tags: []
"Ez23,28":
  text: "Tak bowiem mówi Pan BÓG: Oto wydam cię w ręce tych, których nienawidzisz, w ręce tych, od których odwróciła się twoja dusza."
  tags: []
"Ez23,29":
  text: "I postąpią z tobą z nienawiścią, zabiorą ci cały twój dorobek, zostawią cię nagą i obnażoną i zostaną odkryte nagość twego nierządu, twoja rozwiązłość i twoje czyny nierządne."
  tags: []
"Ez23,30":
  text: "To ci się przydarzy, dlatego że uprawiałaś nierząd, naśladując pogan; dlatego że skalałaś się ich bożkami."
  tags: []
"Ez23,31":
  text: "Chodziłaś drogą swojej siostry, dlatego dam jej kielich do twojej ręki."
  tags: []
"Ez23,32":
  text: "Tak mówi Pan BÓG: Będziesz pić z kielicha swojej siostry, głębokiego i szerokiego, będziesz pośmiewiskiem i szyderstwem, bo on wiele zmieści."
  tags: []
"Ez23,33":
  text: "Będziesz napełniona pijaństwem i bólem, kielichem spustoszenia i smutku, kielichem twojej siostry Samarii."
  tags: []
"Ez23,34":
  text: "Wypijesz go i wychylisz do dna, potem go rozbijesz na kawałki, a swoje piersi poobrywasz. Ja bowiem to powiedziałem, mówi Pan BÓG."
  tags: []
"Ez23,35":
  text: "Dlatego tak mówi Pan BÓG: Ponieważ zapomniałaś o mnie i rzuciłaś mnie za swoje plecy, ty także znoś swoją rozwiązłość i swój nierząd."
  tags: []
"Ez23,36":
  text: "I PAN powiedział do mnie: Synu człowieczy, czy będziesz sądził Oholę i Oholibę? Uświadom im ich obrzydliwości;"
  tags: []
"Ez23,37":
  text: "Że cudzołożyły i krew jest na ich rękach; z bożkami cudzołożyły, także swych synów, których mi urodziły, przeprowadziły przez ogień, by byli strawieni."
  tags: []
"Ez23,38":
  text: "I jeszcze to mi uczyniły, że moją świątynię splugawiły w tym samym dniu i zbezcześciły moje szabaty."
  tags: []
"Ez23,39":
  text: "Gdy bowiem zabiły swoje dzieci dla swoich bożków, wchodziły do mojej świątyni w tym samym dniu, aby ją zbezcześcić; oto tak czyniły wewnątrz mego domu."
  tags: []
"Ez23,40":
  text: "Ponadto posyłały po mężczyzn, aby przyszli z daleka; wysłano więc posłańca, a oni przyszli. Dla nich się myłaś, barwiłaś swoje oczy i stroiłaś się w ozdoby;"
  tags: []
"Ez23,41":
  text: "Siadałaś na wspaniałym łożu, przed którym był przygotowany stół i na którym kładłaś moje kadzidło i mój olejek."
  tags: []
"Ez23,42":
  text: "I rozległ się u niej głos beztroskiego tłumu, a wraz z ludem pospolitym przyprowadzono z pustyni Sabejczyków, którzy wkładali bransolety na ich ręce i ozdobne korony na ich głowy."
  tags: []
"Ez23,43":
  text: "I powiedziałem do tej cudzołożnicy zestarzałej: Czy oni będą uprawiać nierząd z nią, a ona z nimi?"
  tags: []
"Ez23,44":
  text: "I obcowali z nią, jak się obcuje z nierządnicą. Tak właśnie obcowali z Oholą i Oholibą, kobietami rozwiązłymi."
  tags: []
"Ez23,45":
  text: "Dlatego mężowie sprawiedliwi będą je sądzić, jak się sądzi cudzołożnice i jak się sądzi przelewających krew, gdyż one są cudzołożnicami, a krew jest na ich rękach."
  tags: []
"Ez23,46":
  text: "Tak bowiem mówi Pan BÓG: Sprowadzę na nie wojsko i wydam je na wysiedlenie i na łup."
  tags: []
"Ez23,47":
  text: "I ta gromada ukamienuje je, i rozsiecze swymi mieczami, zabije ich synów i córki, a ich domy spali ogniem."
  tags: []
"Ez23,48":
  text: "Tak usunę rozwiązłość z tej ziemi, aby wszystkie kobiety otrzymały ostrzeżenie i nie czyniły według waszej rozwiązłości."
  tags: []
"Ez23,49":
  text: "I będzie nałożona na was wasza rozwiązłość, i poniesiecie grzechy waszych bożków. I poznacie, że ja jestem Panem BOGIEM."
  tags: []
