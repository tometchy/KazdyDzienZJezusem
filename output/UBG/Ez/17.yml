"Ez17,1":
  text: "I doszło do mnie słowo PANA mówiące:"
  tags: []
"Ez17,2":
  text: "Synu człowieczy, zadaj zagadkę i opowiedz domowi Izraela przypowieść;"
  tags: []
"Ez17,3":
  text: "I powiedz: Tak mówi Pan BÓG: Wielki orzeł o wielkich i długich skrzydłach, pełen pstrego pierza, przyleciał nad Liban i wziął wierzchołek cedru."
  tags: []
"Ez17,4":
  text: "Ułamał koniec jego pędów, zaniósł go do ziemi kupieckiej i złożył go w mieście kupieckim."
  tags: []
"Ez17,5":
  text: "Wziął też nasienie tej ziemi i zasadził na urodzajnym polu; umieścił je nad wielkimi wodami jak wierzbę."
  tags: []
"Ez17,6":
  text: "I urosło, i stało się bujną winoroślą, choć niskiego wzrostu; jej latorośle zwracały się ku niemu, a korzenie były mu poddane. I stało się winoroślą, która wydała latorośle i wypuściła pędy."
  tags: []
"Ez17,7":
  text: "Ale był inny wielki orzeł o wielkich skrzydłach i gęstym pierzu, a oto ta winorośl zwróciła swoje korzenie ku niemu i rozciągnęła swe latorośle do niego, aby on ją nawadniał z bruzd swego sadu."
  tags: []
"Ez17,8":
  text: "A była przecież zasadzona na dobrym polu, nad wielkimi wodami, aby wypuściła latorośle, wydała owoc i stała się wspaniałą winoroślą."
  tags: []
"Ez17,9":
  text: "Wtedy powiedz: Tak mówi Pan BÓG: Czy się jej poszczęści? Czy orzeł nie wyrwie jej korzeni i nie oberwie jej owocu tak, by uschła? Uschną wszystkie listki, które wypuści, i nie będzie trzeba wielkiej mocy ani licznego ludu, aby ją wyrwać z korzeniami."
  tags: []
"Ez17,10":
  text: "Oto jakkolwiek będzie zasadzona, czy się jej poszczęści? Czy doszczętnie nie uschnie, gdy dotknie ją wiatr wschodni? Uschnie w bruzdach, w których wyrosła."
  tags: []
"Ez17,11":
  text: "Potem doszło do mnie słowo PANA:"
  tags: []
"Ez17,12":
  text: "Mów teraz do domu buntowniczego: Czyż nie wiecie, co znaczą te rzeczy? Powiedz: Oto król Babilonu przybył do Jerozolimy, zabrał jej króla i książąt i uprowadził ich ze sobą do Babilonu."
  tags: []
"Ez17,13":
  text: "Wziął też jednego z potomków króla, zawarł z nim przymierze i związał go przysięgą. Zabrał też możnych tej ziemi;"
  tags: []
"Ez17,14":
  text: "Aby królestwo było poniżone, tak by się nie podnosiło, ale by tak trwało, zachowując jego przymierze."
  tags: []
"Ez17,15":
  text: "Lecz on zbuntował się przeciwko niemu, wysyłając swych posłów do Egiptu, aby dano mu koni i liczny lud. Czy mu się poszczęści? Czy ujdzie zemsty ten, który tak czynił? Czy ocali się ten, który złamał przymierze?"
  tags: []
"Ez17,16":
  text: "Jak żyję, mówi Pan BÓG, w miejscu tego króla, który go uczynił królem, a którego przysięgą wzgardził i którego przymierze złamał, u niego w Babilonie umrze."
  tags: []
"Ez17,17":
  text: "I ani faraon z wielkim wojskiem i z licznym zastępem nie pomoże mu na wojnie, gdy usypie wały i pobuduje wieże, aby zniszczyć mnóstwo ludzi;"
  tags: []
"Ez17,18":
  text: "Ponieważ wzgardził przysięgą, łamiąc przymierze. Oto bowiem dał na to swą rękę, a to wszystko uczynił. Nie ujdzie zemsty."
  tags: []
"Ez17,19":
  text: "Dlatego tak mówi Pan BÓG: Jak żyję, moją przysięgę, którą wzgardził, i moje przymierze, które złamał, złożę mu na głowę."
  tags: []
"Ez17,20":
  text: "Rozciągnę na nim swoją sieć i zostanie schwytany w moje sidła, i zaprowadzę go do Babilonu, a tam się z nim rozprawię za jego występek, którym zgrzeszył przeciwko mnie."
  tags: []
"Ez17,21":
  text: "A wszyscy, którzy uciekli od niego wraz ze wszystkimi jego hufcami, od miecza polegną, a pozostali zostaną rozproszeni na wszystkie wiatry. I poznacie, że ja, PAN, to powiedziałem."
  tags: []
"Ez17,22":
  text: "Tak mówi Pan BÓG: Wezmę wierzchołek tego wysokiego cedru i zasadzę; z najwyższych jego gałązek odłamię młodą gałązkę i zasadzę ją na wysokiej i wyniosłej górze;"
  tags: []
"Ez17,23":
  text: "Na wysokiej górze Izraela ją zasadzę. Wypuści gałązki, wyda owoc i stanie się cedrem wspaniałym. I będzie mieszkać pod nim wszelkie ptactwo skrzydlate; pod cieniem jego gałęzi będą mieszkać."
  tags: []
"Ez17,24":
  text: "A tak wszystkie drzewa polne poznają, że ja, PAN, poniżyłem drzewo wysokie, a wywyższyłem drzewo niskie, ususzyłem drzewo zielone, a sprawiłem, że zakwitło drzewo suche. Ja, PAN, to powiedziałem i uczynię."
  tags: []
