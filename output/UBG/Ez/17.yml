"Ez17,1": "I doszło do mnie słowo PANA mówiące:"
"Ez17,2": "Synu człowieczy, zadaj zagadkę i opowiedz domowi Izraela przypowieść;"
"Ez17,3": "I powiedz: Tak mówi Pan BÓG: Wielki orzeł o wielkich i długich skrzydłach, pełen pstrego pierza, przyleciał nad Liban i wziął wierzchołek cedru."
"Ez17,4": "Ułamał koniec jego pędów, zaniósł go do ziemi kupieckiej i złożył go w mieście kupieckim."
"Ez17,5": "Wziął też nasienie tej ziemi i zasadził na urodzajnym polu; umieścił je nad wielkimi wodami jak wierzbę."
"Ez17,6": "I urosło, i stało się bujną winoroślą, choć niskiego wzrostu; jej latorośle zwracały się ku niemu, a korzenie były mu poddane. I stało się winoroślą, która wydała latorośle i wypuściła pędy."
"Ez17,7": "Ale był inny wielki orzeł o wielkich skrzydłach i gęstym pierzu, a oto ta winorośl zwróciła swoje korzenie ku niemu i rozciągnęła swe latorośle do niego, aby on ją nawadniał z bruzd swego sadu."
"Ez17,8": "A była przecież zasadzona na dobrym polu, nad wielkimi wodami, aby wypuściła latorośle, wydała owoc i stała się wspaniałą winoroślą."
"Ez17,9": "Wtedy powiedz: Tak mówi Pan BÓG: Czy się jej poszczęści? Czy orzeł nie wyrwie jej korzeni i nie oberwie jej owocu tak, by uschła? Uschną wszystkie listki, które wypuści, i nie będzie trzeba wielkiej mocy ani licznego ludu, aby ją wyrwać z korzeniami."
"Ez17,10": "Oto jakkolwiek będzie zasadzona, czy się jej poszczęści? Czy doszczętnie nie uschnie, gdy dotknie ją wiatr wschodni? Uschnie w bruzdach, w których wyrosła."
"Ez17,11": "Potem doszło do mnie słowo PANA:"
"Ez17,12": "Mów teraz do domu buntowniczego: Czyż nie wiecie, co znaczą te rzeczy? Powiedz: Oto król Babilonu przybył do Jerozolimy, zabrał jej króla i książąt i uprowadził ich ze sobą do Babilonu."
"Ez17,13": "Wziął też jednego z potomków króla, zawarł z nim przymierze i związał go przysięgą. Zabrał też możnych tej ziemi;"
"Ez17,14": "Aby królestwo było poniżone, tak by się nie podnosiło, ale by tak trwało, zachowując jego przymierze."
"Ez17,15": "Lecz on zbuntował się przeciwko niemu, wysyłając swych posłów do Egiptu, aby dano mu koni i liczny lud. Czy mu się poszczęści? Czy ujdzie zemsty ten, który tak czynił? Czy ocali się ten, który złamał przymierze?"
"Ez17,16": "Jak żyję, mówi Pan BÓG, w miejscu tego króla, który go uczynił królem, a którego przysięgą wzgardził i którego przymierze złamał, u niego w Babilonie umrze."
"Ez17,17": "I ani faraon z wielkim wojskiem i z licznym zastępem nie pomoże mu na wojnie, gdy usypie wały i pobuduje wieże, aby zniszczyć mnóstwo ludzi;"
"Ez17,18": "Ponieważ wzgardził przysięgą, łamiąc przymierze. Oto bowiem dał na to swą rękę, a to wszystko uczynił. Nie ujdzie zemsty."
"Ez17,19": "Dlatego tak mówi Pan BÓG: Jak żyję, moją przysięgę, którą wzgardził, i moje przymierze, które złamał, złożę mu na głowę."
"Ez17,20": "Rozciągnę na nim swoją sieć i zostanie schwytany w moje sidła, i zaprowadzę go do Babilonu, a tam się z nim rozprawię za jego występek, którym zgrzeszył przeciwko mnie."
"Ez17,21": "A wszyscy, którzy uciekli od niego wraz ze wszystkimi jego hufcami, od miecza polegną, a pozostali zostaną rozproszeni na wszystkie wiatry. I poznacie, że ja, PAN, to powiedziałem."
"Ez17,22": "Tak mówi Pan BÓG: Wezmę wierzchołek tego wysokiego cedru i zasadzę; z najwyższych jego gałązek odłamię młodą gałązkę i zasadzę ją na wysokiej i wyniosłej górze;"
"Ez17,23": "Na wysokiej górze Izraela ją zasadzę. Wypuści gałązki, wyda owoc i stanie się cedrem wspaniałym. I będzie mieszkać pod nim wszelkie ptactwo skrzydlate; pod cieniem jego gałęzi będą mieszkać."
"Ez17,24": "A tak wszystkie drzewa polne poznają, że ja, PAN, poniżyłem drzewo wysokie, a wywyższyłem drzewo niskie, ususzyłem drzewo zielone, a sprawiłem, że zakwitło drzewo suche. Ja, PAN, to powiedziałem i uczynię."
