"Ez5,1":
  text: "Ty zaś, synu człowieczy, weź sobie ostry nóż, weź sobie brzytwę fryzjerską i ogól nią sobie głowę oraz brodę. Potem weź sobie wagę i rozdziel włosy."
  tags: []
"Ez5,2":
  text: "Jedną trzecią spal w ogniu w środku miasta, gdy wypełnią się dni oblężenia. Potem weź trzecią część i posiekaj mieczem dokoła, a trzecią część rozrzuć na wiatr, bo ja dobędę miecz na nich."
  tags: []
"Ez5,3":
  text: "Ale weź z nich małą ilość i zawiń w poły swojej szaty."
  tags: []
"Ez5,4":
  text: "Z tych weź jeszcze trochę, wrzuć je w środek ognia i spal je w ogniu; stamtąd wyjdzie ogień na cały dom Izraela."
  tags: []
"Ez5,5":
  text: "Tak mówi Pan BÓG: To jest Jerozolima, którą umieściłem pośród pogan, otoczona zewsząd krajami."
  tags: []
"Ez5,6":
  text: "Ale zamieniła moje sądy w niegodziwość, bardziej niż poganie, a moje ustawy – bardziej niż kraje, które ją otaczają. Wzgardzili bowiem moimi sądami i nie postępowali według moich ustaw."
  tags: []
"Ez5,7":
  text: "Dlatego tak mówi Pan BÓG: Ponieważ przewyższyliście swoimi grzechami pogan, którzy was otaczają, a nie postępowaliście według moich ustaw i nie przestrzegaliście moich sądów, nawet nie czyniliście według sądów pogan, którzy są dokoła was;"
  tags: []
"Ez5,8":
  text: "Dlatego tak mówi Pan BÓG: Oto występuję przeciwko tobie i wykonam sądy pośrodku ciebie, na oczach pogan."
  tags: []
"Ez5,9":
  text: "I z powodu wszystkich twoich obrzydliwości uczynię ci to, czego wcześniej nie uczyniłem, i czego już więcej nie uczynię."
  tags: []
"Ez5,10":
  text: "Dlatego ojcowie będą jeść synów pośród ciebie, a synowie będą jeść swoich ojców. Wykonam sądy nad tobą i rozproszę całą twoją resztkę na wszystkie wiatry."
  tags: []
"Ez5,11":
  text: "Dlatego jak żyję, mówi Pan BÓG: Ponieważ zbezcześciłeś moją świątynię wszelkimi twymi nieczystościami i wszelkimi twymi obrzydliwościami, ja także poniżę ciebie, moje oko nie oszczędzi cię i nie zlituję się nad tobą."
  tags: []
"Ez5,12":
  text: "Trzecia część twoich ludzi umrze od zarazy i wyginie z głodu pośród ciebie, trzecia część padnie od miecza wokół ciebie, a trzecią część rozproszę na wszystkie wiatry i miecz na nich dobędę."
  tags: []
"Ez5,13":
  text: "Tak dopełni się mój gniew i natrę na nich swoją zapalczywością, i ucieszę się. I poznają, że ja, PAN, powiedziałem to w swojej zapalczywości, gdy wykonam na nich swój gniew."
  tags: []
"Ez5,14":
  text: "I zamienię cię w spustoszenie i w hańbę narodów, które są wokoło ciebie, na oczach każdego przechodnia."
  tags: []
"Ez5,15":
  text: "A tak staniesz się hańbą, pośmiewiskiem, przykładem i przerażeniem dla narodów, które cię otaczają, gdy wykonam na tobie sądy w zapalczywości i gniewie, i w srogich upomnieniach. Ja, PAN, to powiedziałem."
  tags: []
"Ez5,16":
  text: "Gdy wypuszczę przeciw wam srogie strzały głodu, które będą leciały ku zniszczeniu, a które wypuszczę, aby was wyniszczyć, wzmogę głód przeciwko wam i zniszczę wasz zapas chleba."
  tags: []
"Ez5,17":
  text: "Ześlę więc na was głód i okrutne zwierzęta, które cię osierocą. Przejdą przez ciebie zaraza i krew i sprowadzę na ciebie miecz. Ja, PAN, to powiedziałem."
  tags: []
