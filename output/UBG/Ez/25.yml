"Ez25,1":
  text: "I doszło do mnie słowo PANA mówiące:"
  tags: []
"Ez25,2":
  text: "Synu człowieczy, zwróć swoją twarz przeciwko Ammonitom i prorokuj przeciwko nim."
  tags: []
"Ez25,3":
  text: "Powiedz Ammonitom: Słuchajcie słowa Pana BOGA. Tak mówi Pan BÓG: Ponieważ mówiłeś: Ha! na moją świątynię, gdy została zbezczeszczona, i na ziemię Izraela, gdy była spustoszona, i na dom Judy, gdy poszedł w niewolę;"
  tags: []
"Ez25,4":
  text: "Oto wydam cię w posiadanie narodom Wschodu. Pobudują swoje pałace u ciebie i urządzą u ciebie swoje mieszkania. Będą jeść twoje plony i będą pić twoje mleko."
  tags: []
"Ez25,5":
  text: "I uczynię z Rabby legowisko dla wielbłądów, a z miast Ammonitów – legowisko dla trzód. I poznacie, że ja jestem PANEM."
  tags: []
"Ez25,6":
  text: "Tak bowiem mówi Pan BÓG: Ponieważ klaskałeś rękami, tupałeś nogami i cieszyłeś się w sercu z całą pogardą wobec ziemi Izraela;"
  tags: []
"Ez25,7":
  text: "Oto wyciągnę swą rękę przeciwko tobie i wydam cię na łup poganom; wytnę cię spośród narodów, wytracę cię z ziem i wyniszczę cię. I poznasz, że ja jestem PANEM."
  tags: []
"Ez25,8":
  text: "Tak mówi Pan BÓG: Ponieważ Moab i Seir mówią: Oto dom Judy jest jak wszystkie inne narody;"
  tags: []
"Ez25,9":
  text: "Dlatego odsłonię zbocze Moabu od miast, od jego granicznych miast, które są ozdobą ziemi: Bet-Jeszimot, Baal-Meon i Kiriataim;"
  tags: []
"Ez25,10":
  text: "Przed narodami Wschodu wraz z Ammonitami; dam je w posiadanie, aby nie wspominano Ammonitów między narodami."
  tags: []
"Ez25,11":
  text: "I dokonam sądów nad Moabem, i poznają, że ja jestem PANEM."
  tags: []
"Ez25,12":
  text: "Tak mówi Pan BÓG: Ponieważ Edom srodze się mścił nad domem Judy i ciężko zawinił, mszcząc się nad nim;"
  tags: []
"Ez25,13":
  text: "Tak mówi Pan BÓG: Wyciągnę też swoją rękę na ziemię Edomu i wytracę z niej ludzi i zwierzęta, i zamienię ją w pustynię; od Temanu aż do Dedanu polegną od miecza."
  tags: []
"Ez25,14":
  text: "I dokonam swojej zemsty na Edomie przez ręce mego ludu Izraela, a postąpią z Edomem według mojej zapalczywości i według mojego gniewu. I poznają moją pomstę, mówi Pan BÓG."
  tags: []
"Ez25,15":
  text: "Tak mówi Pan BÓG: Ponieważ Filistyni się mścili i dokonali zemsty złośliwym sercem, aby prowadzić do zguby z powodu odwiecznej nieprzyjaźni;"
  tags: []
"Ez25,16":
  text: "Dlatego tak mówi Pan BÓG: Oto wyciągnę swoją rękę na Filistynów, wykorzenię Keretytów i wytracę resztkę wybrzeża morskiego."
  tags: []
"Ez25,17":
  text: "I dokonam na nich wielkiej pomsty, karząc ich w zapalczywości; i poznają, że ja jestem PANEM, gdy wywrę na nich swoją pomstę."
  tags: []
