"Ez16,1": "I doszło do mnie słowo PANA mówiące:"
"Ez16,2": "Synu człowieczy, uświadom Jerozolimie jej obrzydliwości;"
"Ez16,3": "I powiedz: Tak mówi Pan BÓG do Jerozolimy: Twoje pochodzenie i twój ród wywodzą się z ziemi Kanaan; twój ojciec był Amorytą, a twoja matka – Chetytką."
"Ez16,4": "A takie były twoje narodziny: W dniu, kiedy się urodziłaś, nie odcięto ci pępowiny ani nie obmyto cię wodą, aby cię oczyścić; nie natarto cię solą ani w pieluszki nie owinięto."
"Ez16,5": "Żadne oko nie zlitowało się nad tobą, aby uczynić wobec ciebie jedną z tych rzeczy i okazać ci współczucie. Ale porzucono cię na otwartym polu, brzydząc się tobą w dniu, kiedy się urodziłaś."
"Ez16,6": "A gdy przechodziłem obok ciebie i widziałem cię podaną na podeptanie w twojej krwi, powiedziałem ci leżącej w swojej krwi: Żyj! Tak, powiedziałem do ciebie, leżącej w swojej krwi: Żyj!"
"Ez16,7": "Rozmnożyłem cię jak kwiat polny, a rozmnożyłaś się i stałaś się wielka, i doszłaś do pełnej urody. Twoje piersi nabrały kształtów, a twoje włosy urosły, chociaż byłaś naga i odkryta."
"Ez16,8": "A gdy przechodziłem obok ciebie i spojrzałem na ciebie, oto był to twój czas, czas miłości, rozciągnąłem połę swojej szaty na ciebie i zakryłem twoją nagość, związałem się z tobą przysięgą i zawarłem z tobą przymierze, mówi Pan BÓG. I stałaś się moja."
"Ez16,9": "Potem obmyłem cię wodą, zmyłem z ciebie twoją krew i namaściłem cię olejkiem."
"Ez16,10": "Następnie przyodziałem cię szatą haftowaną, włożyłem ci buty z kosztownej skóry, opasałem bisiorem i okryłem cię jedwabiem."
"Ez16,11": "Przystroiłem cię klejnotami, włożyłem bransolety na twoje ręce i złoty łańcuch na szyję."
"Ez16,12": "Włożyłem wisiorek na twoje czoło, kolczyki w twoje uszy i ozdobną koronę na twoją głowę."
"Ez16,13": "Tak zostałaś przystrojona złotem i srebrem, a twoje szaty były z bisioru, jedwabiu i z tkaniny haftowanej; jadałaś najlepszą mąkę, miód i oliwę. Byłaś bardzo piękna i tak ci się powodziło, że stałaś się królestwem."
"Ez16,14": "Twoja sława rozeszła się wśród narodów z powodu twojej piękności. Była bowiem doskonała dzięki mojej ozdobie, którą włożyłem na ciebie, mówi Pan BÓG."
"Ez16,15": "Ale zaufałaś swojej piękności i uprawiałaś nierząd, będąc tak sławna; uprawiałaś nierząd z każdym, kto przechodził. Jemu się oddawałaś."
"Ez16,16": "Nabrałaś swoich szat i uczyniłaś sobie wyżyny o rozmaitych barwach, i na nich uprawiałaś nierząd, co nigdy więcej nie przyjdzie ani czego nigdy więcej nie będzie."
"Ez16,17": "Ponadto nabrałaś swoich pięknych klejnotów z mojego złota i srebra, które ci dałem, uczyniłaś sobie posągi mężczyzn i uprawiałaś z nimi nierząd."
"Ez16,18": "Wzięłaś też swe haftowane szaty i odziałaś je, kładłaś przed nimi moją oliwę i moje kadzidło;"
"Ez16,19": "Nawet mój chleb, który ci dałem, najlepszą mąkę, oliwę i miód, którymi cię karmiłem, kładłaś przed nimi jako miłą woń. Tak było, mówi Pan BÓG."
"Ez16,20": "Brałaś też swoich synów i swoje córki, które mi urodziłaś, i składałaś je im w ofierze na pożarcie. Czy za mało było twojego nierządu?"
"Ez16,21": "Zabijałaś przecież moje dzieci i oddawałaś je, aby przenoszono je przez ogień dla bożków."
"Ez16,22": "We wszystkich swoich obrzydliwościach i nierządach nie pamiętałaś o dniach twojej młodości, gdy byłaś naga, odkryta i oddana na podeptanie w swojej krwi."
"Ez16,23": "A po całej twojej niegodziwości (biada, biada tobie! – mówi Pan BÓG);"
"Ez16,24": "Zbudowałaś sobie wzniosłe miejsce i zrobiłaś sobie wyżyny na każdej ulicy."
"Ez16,25": "Na każdym rozstaju dróg budowałaś swoje wyżyny i swoją piękność uczyniłaś wstrętną; rozkładałaś swoje nogi przed każdym, kto przechodził, i rozmnożyłaś swoje nierządne czyny."
"Ez16,26": "Uprawiałaś nierząd z Egipcjanami, z twoimi sąsiadami o potężnych ciałach, i rozmnożyłaś swoje nierządy, aby pobudzić mnie do gniewu."
"Ez16,27": "Dlatego oto ja wyciągnąłem przeciw tobie swoją rękę i zmniejszyłem twoją porcję, i wydałem cię żądzy nienawidzących cię córek Filistynów, które się wstydzą twojej rozwiązłej drogi."
"Ez16,28": "Uprawiałaś też nierząd z Asyryjczykami, bo byłaś nienasycona; cudzołożyłaś z nimi, a i tak się nie nasyciłaś."
"Ez16,29": "Rozmnożyłaś też swoje nierządy w ziemi Kanaan i Chaldei, a i tak się nie nasyciłaś."
"Ez16,30": "O jak słabe jest twoje serce – mówi Pan BÓG – że się dopuszczasz tych rzeczy, postępków bezwstydnej nierządnicy;"
"Ez16,31": "Budując sobie wzniosłe miejsca na każdym rozstaju dróg i stawiając sobie wyżynę na każdej ulicy; gardząc jednak zapłatą, nie byłaś podobna do nierządnicy;"
"Ez16,32": "Lecz do żony cudzołożnej, która zamiast swego męża dopuszcza obcych."
"Ez16,33": "Wszystkim nierządnicom daje się zapłatę, lecz ty dajesz swe dary wszystkim swoim kochankom i wynagradzasz im, aby przychodzili do ciebie zewsząd i uprawiali z tobą nierząd."
"Ez16,34": "U ciebie, w twoim nierządzie, dzieje się odwrotnie niż u innych kobiet. Nikt nie goni za tobą, by uprawiać nierząd. To ty dajesz zapłatę, a tobie nie dają zapłaty. U ciebie jest na odwrót."
"Ez16,35": "Dlatego, nierządnico, słuchaj słowa PANA."
"Ez16,36": "Tak mówi Pan BÓG: Ponieważ wylała się twoja nieczystość i odkryła się twoja nagość przez twój nierząd z twoimi kochankami i ze wszystkimi twymi obrzydłymi bożkami i przez rozlanie krwi twoich dzieci, które im dałaś;"
"Ez16,37": "Oto zgromadzę wszystkich kochanków, z którymi obcowałaś, i wszystkich, których kochałaś, wraz ze wszystkimi, których nienawidziłaś; zgromadzę ich zewsząd przeciwko tobie i odkryję twoją nagość przed nimi, aby widzieli całą twoją nagość."
"Ez16,38": "I osądzę cię tak, jak sądzi się cudzołożnice i przelewających krew; i oddam ci w zamian krew w gniewie i zazdrości."
"Ez16,39": "Wydam cię w ich ręce, a oni zburzą twoje wzniosłe miejsca, zniszczą twoje wyżyny, rozbiorą cię z twoich szat, zabiorą ci twoje piękne klejnoty i zostawią cię nagą i odkrytą."
"Ez16,40": "Zwołają przeciw tobie zgromadzenie i ukamienują cię, i przebiją cię swoimi mieczami."
"Ez16,41": "I spalą twoje domy w ogniu, i wykonają na tobie sąd na oczach wielu kobiet. I sprawię, że przestaniesz być nierządnicą, i więcej nie będziesz dawała zapłaty."
"Ez16,42": "Tak uśmierzę swój gniew na tobie i odstąpi od ciebie moja zazdrość; uspokoję się i już nie będę się gniewał."
"Ez16,43": "Ponieważ nie pamiętałaś o dniach swojej młodości, ale tym wszystkim mnie drażniłaś, oto i ja złożę ci na głowę twoją własną drogę, mówi Pan BÓG. Nie popełnisz już tej rozwiązłości ponad wszystkie twoje obrzydliwości."
"Ez16,44": "Oto każdy, kto mówi przysłowia, wypowie o tobie takie przysłowie: Jaka matka, taka jej córka."
"Ez16,45": "Ty jesteś córką swojej matki, która obrzydziła sobie swego męża i swoje dzieci; jesteś siostrą obu swoich sióstr, które obrzydziły sobie swoich mężów i swoje dzieci. Wasza matka była Chetytką, a wasz ojciec – Amorytą."
"Ez16,46": "Twoją starszą siostrą jest Samaria, która wraz z córkami mieszka po twojej lewicy; a twoją młodszą siostrą jest Sodoma, która mieszka wraz z jej córkami po twojej prawicy."
"Ez16,47": "Ty jednak nie kroczyłaś ich drogami ani nie popełniłaś takich obrzydliwości jak one. Ale uważając to za małą rzecz, zepsułaś się bardziej niż one na wszystkich swoich drogach."
"Ez16,48": "Jak żyję, mówi Pan BÓG, twoja siostra Sodoma i jej córki nie czyniły tak, jak ty czyniłaś wraz ze swoimi córkami."
"Ez16,49": "Oto taka była nieprawość Sodomy, twojej siostry: pycha, dostatek chleba i wielkie próżniactwo były w niej i jej córkach, nie wzmacniała też ręki ubogiego i nędznego."
"Ez16,50": "Były wyniosłe i popełniały obrzydliwość przede mną. Dlatego usunąłem je, jak uważałem za słuszne."
"Ez16,51": "A Samaria nie popełniła nawet połowy twoich grzechów, bo rozmnożyłaś swoje obrzydliwości bardziej niż ona i usprawiedliwiłaś swoje siostry wszystkimi twymi obrzydliwościami, które popełniłaś."
"Ez16,52": "Ty więc, która sądziłaś swoje siostry, znoś swoją hańbę z powodu twoich grzechów, bo obrzydliwsze od nich popełniłaś. One są sprawiedliwsze od ciebie. Wstydź się więc i znoś swoją hańbę, gdyż usprawiedliwiłaś swoje siostry."
"Ez16,53": "Kiedy odwrócę ich niewolę, to jest niewolę Sodomy i jej córek i niewolę Samarii i jej córek, to wtedy też odwrócę niewolę twoich pojmanych pośród nich;"
"Ez16,54": "Abyś znosiła swoją hańbę i wstydziła się z powodu wszystkiego, co uczyniłaś, sprawiając im pociechę."
"Ez16,55": "Jeśli twoje siostry, Sodoma i jej córki, wrócą do swego pierwotnego stanu, a także Samaria i jej córki wrócą do swego pierwotnego stanu, wtedy również i ty ze swoimi córkami wrócisz do swego pierwotnego stanu."
"Ez16,56": "W dniu twojej pychy bowiem nie było mowy w twoich ustach o twojej siostrze Sodomie;"
"Ez16,57": "Dopóki nie została odkryta twoja niegodziwość; jak za czasu twojego pohańbienia doznanego od córek Syrii i wszystkich, którzy są dokoła nich, od córek Filistynów, które tobą gardzą ze wszystkich stron."
"Ez16,58": "Ponosisz karę za swoją rozwiązłość i obrzydliwość, mówi PAN."
"Ez16,59": "Tak bowiem mówi Pan BÓG: Uczynię ci tak, jak ty uczyniłaś, gdy wzgardziłaś przysięgą i złamałaś przymierze."
"Ez16,60": "Ja jednak wspomnę na swoje przymierze z tobą zawarte za dni twojej młodości i ustanowię z tobą wieczne przymierze."
"Ez16,61": "Wtedy wspomnisz swoje drogi i zawstydzisz się, gdy przyjmiesz swoje siostry, starsze i młodsze od ciebie, i dam ci je za córki, ale nie według twego przymierza."
"Ez16,62": "Tak ustanowię swoje przymierze z tobą. I poznasz, że ja jestem PANEM;"
"Ez16,63": "Abyś pamiętała i wstydziła się, i nigdy więcej nie otworzyła ust ze wstydu, gdy cię oczyszczę ze wszystkiego, co uczyniłaś, mówi Pan BÓG."
