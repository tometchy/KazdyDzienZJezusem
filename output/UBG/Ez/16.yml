"Ez16,1":
  text: "I doszło do mnie słowo PANA mówiące:"
  tags: []
"Ez16,2":
  text: "Synu człowieczy, uświadom Jerozolimie jej obrzydliwości;"
  tags: []
"Ez16,3":
  text: "I powiedz: Tak mówi Pan BÓG do Jerozolimy: Twoje pochodzenie i twój ród wywodzą się z ziemi Kanaan; twój ojciec był Amorytą, a twoja matka – Chetytką."
  tags: []
"Ez16,4":
  text: "A takie były twoje narodziny: W dniu, kiedy się urodziłaś, nie odcięto ci pępowiny ani nie obmyto cię wodą, aby cię oczyścić; nie natarto cię solą ani w pieluszki nie owinięto."
  tags: []
"Ez16,5":
  text: "Żadne oko nie zlitowało się nad tobą, aby uczynić wobec ciebie jedną z tych rzeczy i okazać ci współczucie. Ale porzucono cię na otwartym polu, brzydząc się tobą w dniu, kiedy się urodziłaś."
  tags: []
"Ez16,6":
  text: "A gdy przechodziłem obok ciebie i widziałem cię podaną na podeptanie w twojej krwi, powiedziałem ci leżącej w swojej krwi: Żyj! Tak, powiedziałem do ciebie, leżącej w swojej krwi: Żyj!"
  tags: []
"Ez16,7":
  text: "Rozmnożyłem cię jak kwiat polny, a rozmnożyłaś się i stałaś się wielka, i doszłaś do pełnej urody. Twoje piersi nabrały kształtów, a twoje włosy urosły, chociaż byłaś naga i odkryta."
  tags: []
"Ez16,8":
  text: "A gdy przechodziłem obok ciebie i spojrzałem na ciebie, oto był to twój czas, czas miłości, rozciągnąłem połę swojej szaty na ciebie i zakryłem twoją nagość, związałem się z tobą przysięgą i zawarłem z tobą przymierze, mówi Pan BÓG. I stałaś się moja."
  tags: []
"Ez16,9":
  text: "Potem obmyłem cię wodą, zmyłem z ciebie twoją krew i namaściłem cię olejkiem."
  tags: []
"Ez16,10":
  text: "Następnie przyodziałem cię szatą haftowaną, włożyłem ci buty z kosztownej skóry, opasałem bisiorem i okryłem cię jedwabiem."
  tags: []
"Ez16,11":
  text: "Przystroiłem cię klejnotami, włożyłem bransolety na twoje ręce i złoty łańcuch na szyję."
  tags: []
"Ez16,12":
  text: "Włożyłem wisiorek na twoje czoło, kolczyki w twoje uszy i ozdobną koronę na twoją głowę."
  tags: []
"Ez16,13":
  text: "Tak zostałaś przystrojona złotem i srebrem, a twoje szaty były z bisioru, jedwabiu i z tkaniny haftowanej; jadałaś najlepszą mąkę, miód i oliwę. Byłaś bardzo piękna i tak ci się powodziło, że stałaś się królestwem."
  tags: []
"Ez16,14":
  text: "Twoja sława rozeszła się wśród narodów z powodu twojej piękności. Była bowiem doskonała dzięki mojej ozdobie, którą włożyłem na ciebie, mówi Pan BÓG."
  tags: []
"Ez16,15":
  text: "Ale zaufałaś swojej piękności i uprawiałaś nierząd, będąc tak sławna; uprawiałaś nierząd z każdym, kto przechodził. Jemu się oddawałaś."
  tags: []
"Ez16,16":
  text: "Nabrałaś swoich szat i uczyniłaś sobie wyżyny o rozmaitych barwach, i na nich uprawiałaś nierząd, co nigdy więcej nie przyjdzie ani czego nigdy więcej nie będzie."
  tags: []
"Ez16,17":
  text: "Ponadto nabrałaś swoich pięknych klejnotów z mojego złota i srebra, które ci dałem, uczyniłaś sobie posągi mężczyzn i uprawiałaś z nimi nierząd."
  tags: []
"Ez16,18":
  text: "Wzięłaś też swe haftowane szaty i odziałaś je, kładłaś przed nimi moją oliwę i moje kadzidło;"
  tags: []
"Ez16,19":
  text: "Nawet mój chleb, który ci dałem, najlepszą mąkę, oliwę i miód, którymi cię karmiłem, kładłaś przed nimi jako miłą woń. Tak było, mówi Pan BÓG."
  tags: []
"Ez16,20":
  text: "Brałaś też swoich synów i swoje córki, które mi urodziłaś, i składałaś je im w ofierze na pożarcie. Czy za mało było twojego nierządu?"
  tags: []
"Ez16,21":
  text: "Zabijałaś przecież moje dzieci i oddawałaś je, aby przenoszono je przez ogień dla bożków."
  tags: []
"Ez16,22":
  text: "We wszystkich swoich obrzydliwościach i nierządach nie pamiętałaś o dniach twojej młodości, gdy byłaś naga, odkryta i oddana na podeptanie w swojej krwi."
  tags: []
"Ez16,23":
  text: "A po całej twojej niegodziwości (biada, biada tobie! – mówi Pan BÓG);"
  tags: []
"Ez16,24":
  text: "Zbudowałaś sobie wzniosłe miejsce i zrobiłaś sobie wyżyny na każdej ulicy."
  tags: []
"Ez16,25":
  text: "Na każdym rozstaju dróg budowałaś swoje wyżyny i swoją piękność uczyniłaś wstrętną; rozkładałaś swoje nogi przed każdym, kto przechodził, i rozmnożyłaś swoje nierządne czyny."
  tags: []
"Ez16,26":
  text: "Uprawiałaś nierząd z Egipcjanami, z twoimi sąsiadami o potężnych ciałach, i rozmnożyłaś swoje nierządy, aby pobudzić mnie do gniewu."
  tags: []
"Ez16,27":
  text: "Dlatego oto ja wyciągnąłem przeciw tobie swoją rękę i zmniejszyłem twoją porcję, i wydałem cię żądzy nienawidzących cię córek Filistynów, które się wstydzą twojej rozwiązłej drogi."
  tags: []
"Ez16,28":
  text: "Uprawiałaś też nierząd z Asyryjczykami, bo byłaś nienasycona; cudzołożyłaś z nimi, a i tak się nie nasyciłaś."
  tags: []
"Ez16,29":
  text: "Rozmnożyłaś też swoje nierządy w ziemi Kanaan i Chaldei, a i tak się nie nasyciłaś."
  tags: []
"Ez16,30":
  text: "O jak słabe jest twoje serce – mówi Pan BÓG – że się dopuszczasz tych rzeczy, postępków bezwstydnej nierządnicy;"
  tags: []
"Ez16,31":
  text: "Budując sobie wzniosłe miejsca na każdym rozstaju dróg i stawiając sobie wyżynę na każdej ulicy; gardząc jednak zapłatą, nie byłaś podobna do nierządnicy;"
  tags: []
"Ez16,32":
  text: "Lecz do żony cudzołożnej, która zamiast swego męża dopuszcza obcych."
  tags: []
"Ez16,33":
  text: "Wszystkim nierządnicom daje się zapłatę, lecz ty dajesz swe dary wszystkim swoim kochankom i wynagradzasz im, aby przychodzili do ciebie zewsząd i uprawiali z tobą nierząd."
  tags: []
"Ez16,34":
  text: "U ciebie, w twoim nierządzie, dzieje się odwrotnie niż u innych kobiet. Nikt nie goni za tobą, by uprawiać nierząd. To ty dajesz zapłatę, a tobie nie dają zapłaty. U ciebie jest na odwrót."
  tags: []
"Ez16,35":
  text: "Dlatego, nierządnico, słuchaj słowa PANA."
  tags: []
"Ez16,36":
  text: "Tak mówi Pan BÓG: Ponieważ wylała się twoja nieczystość i odkryła się twoja nagość przez twój nierząd z twoimi kochankami i ze wszystkimi twymi obrzydłymi bożkami i przez rozlanie krwi twoich dzieci, które im dałaś;"
  tags: []
"Ez16,37":
  text: "Oto zgromadzę wszystkich kochanków, z którymi obcowałaś, i wszystkich, których kochałaś, wraz ze wszystkimi, których nienawidziłaś; zgromadzę ich zewsząd przeciwko tobie i odkryję twoją nagość przed nimi, aby widzieli całą twoją nagość."
  tags: []
"Ez16,38":
  text: "I osądzę cię tak, jak sądzi się cudzołożnice i przelewających krew; i oddam ci w zamian krew w gniewie i zazdrości."
  tags: []
"Ez16,39":
  text: "Wydam cię w ich ręce, a oni zburzą twoje wzniosłe miejsca, zniszczą twoje wyżyny, rozbiorą cię z twoich szat, zabiorą ci twoje piękne klejnoty i zostawią cię nagą i odkrytą."
  tags: []
"Ez16,40":
  text: "Zwołają przeciw tobie zgromadzenie i ukamienują cię, i przebiją cię swoimi mieczami."
  tags: []
"Ez16,41":
  text: "I spalą twoje domy w ogniu, i wykonają na tobie sąd na oczach wielu kobiet. I sprawię, że przestaniesz być nierządnicą, i więcej nie będziesz dawała zapłaty."
  tags: []
"Ez16,42":
  text: "Tak uśmierzę swój gniew na tobie i odstąpi od ciebie moja zazdrość; uspokoję się i już nie będę się gniewał."
  tags: []
"Ez16,43":
  text: "Ponieważ nie pamiętałaś o dniach swojej młodości, ale tym wszystkim mnie drażniłaś, oto i ja złożę ci na głowę twoją własną drogę, mówi Pan BÓG. Nie popełnisz już tej rozwiązłości ponad wszystkie twoje obrzydliwości."
  tags: []
"Ez16,44":
  text: "Oto każdy, kto mówi przysłowia, wypowie o tobie takie przysłowie: Jaka matka, taka jej córka."
  tags: []
"Ez16,45":
  text: "Ty jesteś córką swojej matki, która obrzydziła sobie swego męża i swoje dzieci; jesteś siostrą obu swoich sióstr, które obrzydziły sobie swoich mężów i swoje dzieci. Wasza matka była Chetytką, a wasz ojciec – Amorytą."
  tags: []
"Ez16,46":
  text: "Twoją starszą siostrą jest Samaria, która wraz z córkami mieszka po twojej lewicy; a twoją młodszą siostrą jest Sodoma, która mieszka wraz z jej córkami po twojej prawicy."
  tags: []
"Ez16,47":
  text: "Ty jednak nie kroczyłaś ich drogami ani nie popełniłaś takich obrzydliwości jak one. Ale uważając to za małą rzecz, zepsułaś się bardziej niż one na wszystkich swoich drogach."
  tags: []
"Ez16,48":
  text: "Jak żyję, mówi Pan BÓG, twoja siostra Sodoma i jej córki nie czyniły tak, jak ty czyniłaś wraz ze swoimi córkami."
  tags: []
"Ez16,49":
  text: "Oto taka była nieprawość Sodomy, twojej siostry: pycha, dostatek chleba i wielkie próżniactwo były w niej i jej córkach, nie wzmacniała też ręki ubogiego i nędznego."
  tags: []
"Ez16,50":
  text: "Były wyniosłe i popełniały obrzydliwość przede mną. Dlatego usunąłem je, jak uważałem za słuszne."
  tags: []
"Ez16,51":
  text: "A Samaria nie popełniła nawet połowy twoich grzechów, bo rozmnożyłaś swoje obrzydliwości bardziej niż ona i usprawiedliwiłaś swoje siostry wszystkimi twymi obrzydliwościami, które popełniłaś."
  tags: []
"Ez16,52":
  text: "Ty więc, która sądziłaś swoje siostry, znoś swoją hańbę z powodu twoich grzechów, bo obrzydliwsze od nich popełniłaś. One są sprawiedliwsze od ciebie. Wstydź się więc i znoś swoją hańbę, gdyż usprawiedliwiłaś swoje siostry."
  tags: []
"Ez16,53":
  text: "Kiedy odwrócę ich niewolę, to jest niewolę Sodomy i jej córek i niewolę Samarii i jej córek, to wtedy też odwrócę niewolę twoich pojmanych pośród nich;"
  tags: []
"Ez16,54":
  text: "Abyś znosiła swoją hańbę i wstydziła się z powodu wszystkiego, co uczyniłaś, sprawiając im pociechę."
  tags: []
"Ez16,55":
  text: "Jeśli twoje siostry, Sodoma i jej córki, wrócą do swego pierwotnego stanu, a także Samaria i jej córki wrócą do swego pierwotnego stanu, wtedy również i ty ze swoimi córkami wrócisz do swego pierwotnego stanu."
  tags: []
"Ez16,56":
  text: "W dniu twojej pychy bowiem nie było mowy w twoich ustach o twojej siostrze Sodomie;"
  tags: []
"Ez16,57":
  text: "Dopóki nie została odkryta twoja niegodziwość; jak za czasu twojego pohańbienia doznanego od córek Syrii i wszystkich, którzy są dokoła nich, od córek Filistynów, które tobą gardzą ze wszystkich stron."
  tags: []
"Ez16,58":
  text: "Ponosisz karę za swoją rozwiązłość i obrzydliwość, mówi PAN."
  tags: []
"Ez16,59":
  text: "Tak bowiem mówi Pan BÓG: Uczynię ci tak, jak ty uczyniłaś, gdy wzgardziłaś przysięgą i złamałaś przymierze."
  tags: []
"Ez16,60":
  text: "Ja jednak wspomnę na swoje przymierze z tobą zawarte za dni twojej młodości i ustanowię z tobą wieczne przymierze."
  tags: []
"Ez16,61":
  text: "Wtedy wspomnisz swoje drogi i zawstydzisz się, gdy przyjmiesz swoje siostry, starsze i młodsze od ciebie, i dam ci je za córki, ale nie według twego przymierza."
  tags: []
"Ez16,62":
  text: "Tak ustanowię swoje przymierze z tobą. I poznasz, że ja jestem PANEM;"
  tags: []
"Ez16,63":
  text: "Abyś pamiętała i wstydziła się, i nigdy więcej nie otworzyła ust ze wstydu, gdy cię oczyszczę ze wszystkiego, co uczyniłaś, mówi Pan BÓG."
  tags: []
