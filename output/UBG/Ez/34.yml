"Ez34,1":
  text: "I doszło do mnie słowo PANA mówiące:"
  tags: []
"Ez34,2":
  text: "Synu człowieczy, prorokuj przeciwko pasterzom Izraela, prorokuj i powiedz im: Tak mówi Pan BÓG do tych pasterzy: Biada pasterzom Izraela, którzy sami siebie pasą! Czy pasterze nie powinni paść trzody?"
  tags: []
"Ez34,3":
  text: "Jadacie tłuszcz, okrywacie się wełną i zabijacie tuczne zwierzęta, lecz trzody nie pasiecie."
  tags: []
"Ez34,4":
  text: "Słabych nie posilacie, chorego nie leczycie, złamanego nie obwiązujecie, spłoszonego nie przyprowadzacie ani zgubionego nie szukacie, ale siłą i okrucieństwem panujecie nad nimi."
  tags: []
"Ez34,5":
  text: "Tak że rozproszyły się, bo nie było pasterza, i stały się żerem dla wszelkiego zwierzęcia polnego, ponieważ się rozpierzchnęły."
  tags: []
"Ez34,6":
  text: "Moje owce błąkają się po wszystkich górach i po każdym wysokim pagórku. Moja trzoda rozproszyła się po całej ziemi, a nikt ich nie szukał i nikt o nie nie pytał."
  tags: []
"Ez34,7":
  text: "Dlatego wy, pasterze, słuchajcie słowa PANA:"
  tags: []
"Ez34,8":
  text: "Jak żyję, mówi Pan BÓG: Ponieważ moja trzoda stała się łupem i moje owce stały się żerem wszelkiego zwierzęcia polnego, bo nie ma pasterza, a moi pasterze nie szukali moich owiec, ale pasterze paśli tylko samych siebie, a moich owiec nie paśli;"
  tags: []
"Ez34,9":
  text: "Dlatego, pasterze, słuchajcie słowa PANA."
  tags: []
"Ez34,10":
  text: "Tak mówi Pan BÓG: Oto jestem przeciwko pasterzom. Zażądam moich owiec z ich ręki i sprawię, że przestaną paść moje owce i pasterze nie będą już paśli samych siebie. Wyrwę moje owce z ich paszczy i nie będą już dla nich pokarmem."
  tags: []
"Ez34,11":
  text: "Tak bowiem mówi Pan BÓG: Oto ja sam będę szukać moich owiec i o nie pytać."
  tags: []
"Ez34,12":
  text: "Jak pasterz troszczy się o swoją trzodę, kiedy znajduje się wśród swoich rozproszonych owiec, tak ja będę troszczył się o moje owce i wyrwę je ze wszystkich miejsc, dokąd zostały rozproszone w dzień pochmurny i mroczny."
  tags: []
"Ez34,13":
  text: "Wyprowadzę je z narodów, zgromadzę je z ziem i przyprowadzę je do ich ziemi, i będę je pasł na górach Izraela nad strumieniami i po wszystkich zamieszkałych miejscach tej ziemi."
  tags: []
"Ez34,14":
  text: "Będę je pasł na dobrym pastwisku, a ich pastwisko będzie na wysokich górach Izraela. Tam będą odpoczywać na bujnych błoniach i na tłustych pastwiskach będą się pasły na górach Izraela."
  tags: []
"Ez34,15":
  text: "Ja sam będę pasł moje owce i sprawię, że położą się, mówi Pan BÓG."
  tags: []
"Ez34,16":
  text: "Będę szukał zagubionej i przyprowadzę spłoszoną, obwiążę to, co złamane, i posilę słabą. Ale wytracę tłustą i mocną, bo będę je pasł w prawości."
  tags: []
"Ez34,17":
  text: "A do was, moja trzodo, tak mówi Pan BÓG: Oto będę rozsądzał między owcą a owcą, między baranami a kozłami."
  tags: []
"Ez34,18":
  text: "Czy mało wam, że się pasiecie na dobrym pastwisku, a resztę waszych pastwisk depczecie swoimi nogami; że pijecie czystą wodę, a resztę mącicie swoimi nogami?"
  tags: []
"Ez34,19":
  text: "A moje owce muszą się paść na tym, co zdeptaliście swoimi nogami, i pić to, co zmąciliście swoimi nogami."
  tags: []
"Ez34,20":
  text: "Dlatego tak mówi do nich Pan BÓG: Oto sam rozsądzę między owcą tłustą i owcą chudą."
  tags: []
"Ez34,21":
  text: "Ponieważ bokiem i ramieniem odpychaliście i swoimi rogami bodliście wszystkie słabe, tak że je rozpędziliście;"
  tags: []
"Ez34,22":
  text: "Ocalę moje owce i nie będą już łupem. Rozsądzę między owcą a owcą."
  tags: []
"Ez34,23":
  text: "I ustanowię nad nimi jednego pasterza, który będzie je pasł, mego sługę Dawida. On będzie je pasł i on będzie ich pasterzem."
  tags: []
"Ez34,24":
  text: "A ja, PAN, będę ich Bogiem, a mój sługa Dawid będzie księciem pośród nich. Ja, PAN, to powiedziałem."
  tags: []
"Ez34,25":
  text: "Zawrę z nimi przymierze pokoju i wytępię dzikie zwierzęta z ziemi. I będą bezpiecznie mieszkały na pustyni, i spały w lasach."
  tags: []
"Ez34,26":
  text: "Ponadto dam błogosławieństwo im oraz okolicy mojego pagórka. Będę zsyłał deszcz w swoim czasie, będą to deszcze błogosławieństwa."
  tags: []
"Ez34,27":
  text: "Drzewo polne wyda swój owoc i ziemia wyda swój plon. Będą oni bezpieczni na swojej ziemi i poznają, że ja jestem PANEM, gdy połamię drążki ich jarzma i wyrwę ich z ręki tych, którzy ich zniewolili."
  tags: []
"Ez34,28":
  text: "I już nie będą łupem narodów ani zwierzęta ziemi nie będą ich pożerały, ale będą bezpiecznie mieszkali i nikt ich nie będzie straszył."
  tags: []
"Ez34,29":
  text: "Wzbudzę im sławną latorośl i już nie będą niszczeni głodem w ziemi, ani nie będą znosili zniewag pogan."
  tags: []
"Ez34,30":
  text: "I poznają, że ja, PAN, ich Bóg, jestem z nimi, a oni, dom Izraela, są moim ludem, mówi Pan BÓG."
  tags: []
"Ez34,31":
  text: "A wy, moje owce, owce mego pastwiska, jesteście ludźmi, a ja jestem waszym Bogiem, mówi Pan BÓG."
  tags: []
