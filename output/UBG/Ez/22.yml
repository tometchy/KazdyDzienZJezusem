"Ez22,1": "I doszło do mnie słowo PANA mówiące:"
"Ez22,2": "A ty, synu człowieczy, czy zechcesz sądzić, czy zechcesz sądzić to krwawe miasto? Uświadom mu więc wszystkie jego obrzydliwości."
"Ez22,3": "Powiedz: Tak mówi Pan BÓG: O miasto, które rozlewasz krew u siebie, aby przyszedł twój czas, i czynisz sobie bożki przeciwko sobie, aby się nimi plugawić."
"Ez22,4": "Przez krew, którąś przelało, jesteś winne, i przez swoje bożki, któreś robiło, jesteś skalane, i tyś sprawiło, że przybliżyły się twoje dni, tyś doszło do swoich lat. Dlatego wydam cię na pohańbienie narodom i na pośmiewisko wszystkim ziemiom."
"Ez22,5": "Ci, którzy są blisko, i ci, którzy są daleko od ciebie, będą się z ciebie naśmiewać, o miasto złej sławy i pełne zgiełku."
"Ez22,6": "Oto książęta Izraela, każdy był w tobie, po to, aby całą siłą krew rozlewać."
"Ez22,7": "W tobie ojca i matkę znieważają, u ciebie czynią krzywdę przybyszowi, w tobie uciskają sierotę i wdowę."
"Ez22,8": "Wzgardzasz moimi świętymi rzeczami i zbezczeszczasz moje szabaty."
"Ez22,9": "W tobie są oszczercy w celu rozlania krwi, w tobie jadają na górach, u ciebie popełniają czyny haniebne."
"Ez22,10": "W tobie odkrywa się nagość ojca, w tobie hańbią oddaloną z powodu jej nieczystości."
"Ez22,11": "Jeden popełnia obrzydliwość z żoną swego bliźniego, drugi sprośnie plami swoją synową, inny zaś u ciebie hańbi swoją siostrę, córkę swego ojca."
"Ez22,12": "W tobie biorą dary za rozlanie krwi, pobierasz lichwę i odsetki, wyzyskujesz swego bliźniego przez ucisk i zapominasz o mnie, mówi Pan BÓG."
"Ez22,13": "Dlatego oto ja klasnąłem w swą dłoń z powodu twego nieuczciwego zysku, któreś zdobyło, i z powodu krwi, którą u ciebie rozlano."
"Ez22,14": "Czy twoje serce wytrzyma? Czy twoje ręce będą na tyle mocne w dniach, kiedy ja będę miał z tobą sprawę? Ja, PAN, to powiedziałem i uczynię."
"Ez22,15": "Rozproszę cię między poganami i rozrzucę cię po ziemiach, i usunę z ciebie twoją nieczystość."
"Ez22,16": "I będziesz splugawione na oczach pogan, i poznasz, że ja jestem PANEM."
"Ez22,17": "Potem doszło do mnie słowo PANA mówiące:"
"Ez22,18": "Synu człowieczy, dom Izraela zamienił mi się w żużel; wszyscy są miedzią, cyną, żelazem i ołowiem w środku pieca; stali się żużlem srebra."
"Ez22,19": "Dlatego tak mówi Pan BÓG: Ponieważ wy wszyscy staliście się żużlem, oto zgromadzę was w środku Jerozolimy."
"Ez22,20": "Jak gromadzi się srebro, miedź, żelazo, ołów i cynę wewnątrz pieca, aby rozdmuchano na nie ogień, by je roztopić, tak was zgromadzę w swojej zapalczywości i w swoim gniewie, złożę was i roztopię."
"Ez22,21": "Tak, zgromadzę was i rozdmucham na was ogień swojej zapalczywości i zostaniecie roztopieni w jej środku."
"Ez22,22": "Jak topi się srebro w środku pieca, tak i wy zostaniecie roztopieni w jej środku; i poznacie, że ja, PAN, wylałem na was swoją zapalczywość."
"Ez22,23": "Ponadto doszło do mnie słowo PANA:"
"Ez22,24": "Synu człowieczy, mów do niej: Ty jesteś ziemią nieoczyszczoną i nieobmytą deszczem w dniu mojej zapalczywości."
"Ez22,25": "W środku tej ziemi znajduje się spisek jej proroków, podobni są oni do ryczącego lwa, co rozdziera zdobycz. Pożerają dusze, zabierają bogactwa i kosztowności i mnożą wdowy pośród niej."
"Ez22,26": "Jej kapłani złamali moje prawo i plugawią moje święte rzeczy. Nie czynią różnicy między tym, co święte, a tym, co pospolite, nie rozsądzają między nieczystym a czystym. Ponadto zakrywają sobie oczy przed moimi szabatami, tak że doznaję zniewagi pośród nich."
"Ez22,27": "Jej książęta pośród niej są jak wilki rozdzierające zdobycz, rozlewające krew i tracące dusze, aby zdobyć nieuczciwy zysk."
"Ez22,28": "A jej prorocy tynkują słabym tynkiem, głosząc złudne widzenia i wróżąc im kłamstwo, mówiąc: Tak mówi Pan BÓG, choć PAN nie mówił."
"Ez22,29": "Lud tej ziemi dopuszcza się ucisku i dokonuje grabieży; krzywdzi ubogiego i nędznego i bezprawnie uciska cudzoziemca."
"Ez22,30": "I szukałem wśród nich męża, który by naprawił mur i stanął w wyłomie przede mną w obronie ziemi, abym jej nie zniszczył. Ale nie znalazłem żadnego."
"Ez22,31": "Wylałem więc na nich swój gniew, wyniszczyłem ich ogniem swojej zapalczywości. Złożyłem im na głowę ich własną drogę, mówi Pan BÓG."
