"Ez22,1":
  text: "I doszło do mnie słowo PANA mówiące:"
  tags: []
"Ez22,2":
  text: "A ty, synu człowieczy, czy zechcesz sądzić, czy zechcesz sądzić to krwawe miasto? Uświadom mu więc wszystkie jego obrzydliwości."
  tags: []
"Ez22,3":
  text: "Powiedz: Tak mówi Pan BÓG: O miasto, które rozlewasz krew u siebie, aby przyszedł twój czas, i czynisz sobie bożki przeciwko sobie, aby się nimi plugawić."
  tags: []
"Ez22,4":
  text: "Przez krew, którąś przelało, jesteś winne, i przez swoje bożki, któreś robiło, jesteś skalane, i tyś sprawiło, że przybliżyły się twoje dni, tyś doszło do swoich lat. Dlatego wydam cię na pohańbienie narodom i na pośmiewisko wszystkim ziemiom."
  tags: []
"Ez22,5":
  text: "Ci, którzy są blisko, i ci, którzy są daleko od ciebie, będą się z ciebie naśmiewać, o miasto złej sławy i pełne zgiełku."
  tags: []
"Ez22,6":
  text: "Oto książęta Izraela, każdy był w tobie, po to, aby całą siłą krew rozlewać."
  tags: []
"Ez22,7":
  text: "W tobie ojca i matkę znieważają, u ciebie czynią krzywdę przybyszowi, w tobie uciskają sierotę i wdowę."
  tags: []
"Ez22,8":
  text: "Wzgardzasz moimi świętymi rzeczami i zbezczeszczasz moje szabaty."
  tags: []
"Ez22,9":
  text: "W tobie są oszczercy w celu rozlania krwi, w tobie jadają na górach, u ciebie popełniają czyny haniebne."
  tags: []
"Ez22,10":
  text: "W tobie odkrywa się nagość ojca, w tobie hańbią oddaloną z powodu jej nieczystości."
  tags: []
"Ez22,11":
  text: "Jeden popełnia obrzydliwość z żoną swego bliźniego, drugi sprośnie plami swoją synową, inny zaś u ciebie hańbi swoją siostrę, córkę swego ojca."
  tags: []
"Ez22,12":
  text: "W tobie biorą dary za rozlanie krwi, pobierasz lichwę i odsetki, wyzyskujesz swego bliźniego przez ucisk i zapominasz o mnie, mówi Pan BÓG."
  tags: []
"Ez22,13":
  text: "Dlatego oto ja klasnąłem w swą dłoń z powodu twego nieuczciwego zysku, któreś zdobyło, i z powodu krwi, którą u ciebie rozlano."
  tags: []
"Ez22,14":
  text: "Czy twoje serce wytrzyma? Czy twoje ręce będą na tyle mocne w dniach, kiedy ja będę miał z tobą sprawę? Ja, PAN, to powiedziałem i uczynię."
  tags: []
"Ez22,15":
  text: "Rozproszę cię między poganami i rozrzucę cię po ziemiach, i usunę z ciebie twoją nieczystość."
  tags: []
"Ez22,16":
  text: "I będziesz splugawione na oczach pogan, i poznasz, że ja jestem PANEM."
  tags: []
"Ez22,17":
  text: "Potem doszło do mnie słowo PANA mówiące:"
  tags: []
"Ez22,18":
  text: "Synu człowieczy, dom Izraela zamienił mi się w żużel; wszyscy są miedzią, cyną, żelazem i ołowiem w środku pieca; stali się żużlem srebra."
  tags: []
"Ez22,19":
  text: "Dlatego tak mówi Pan BÓG: Ponieważ wy wszyscy staliście się żużlem, oto zgromadzę was w środku Jerozolimy."
  tags: []
"Ez22,20":
  text: "Jak gromadzi się srebro, miedź, żelazo, ołów i cynę wewnątrz pieca, aby rozdmuchano na nie ogień, by je roztopić, tak was zgromadzę w swojej zapalczywości i w swoim gniewie, złożę was i roztopię."
  tags: []
"Ez22,21":
  text: "Tak, zgromadzę was i rozdmucham na was ogień swojej zapalczywości i zostaniecie roztopieni w jej środku."
  tags: []
"Ez22,22":
  text: "Jak topi się srebro w środku pieca, tak i wy zostaniecie roztopieni w jej środku; i poznacie, że ja, PAN, wylałem na was swoją zapalczywość."
  tags: []
"Ez22,23":
  text: "Ponadto doszło do mnie słowo PANA:"
  tags: []
"Ez22,24":
  text: "Synu człowieczy, mów do niej: Ty jesteś ziemią nieoczyszczoną i nieobmytą deszczem w dniu mojej zapalczywości."
  tags: []
"Ez22,25":
  text: "W środku tej ziemi znajduje się spisek jej proroków, podobni są oni do ryczącego lwa, co rozdziera zdobycz. Pożerają dusze, zabierają bogactwa i kosztowności i mnożą wdowy pośród niej."
  tags: []
"Ez22,26":
  text: "Jej kapłani złamali moje prawo i plugawią moje święte rzeczy. Nie czynią różnicy między tym, co święte, a tym, co pospolite, nie rozsądzają między nieczystym a czystym. Ponadto zakrywają sobie oczy przed moimi szabatami, tak że doznaję zniewagi pośród nich."
  tags: []
"Ez22,27":
  text: "Jej książęta pośród niej są jak wilki rozdzierające zdobycz, rozlewające krew i tracące dusze, aby zdobyć nieuczciwy zysk."
  tags: []
"Ez22,28":
  text: "A jej prorocy tynkują słabym tynkiem, głosząc złudne widzenia i wróżąc im kłamstwo, mówiąc: Tak mówi Pan BÓG, choć PAN nie mówił."
  tags: []
"Ez22,29":
  text: "Lud tej ziemi dopuszcza się ucisku i dokonuje grabieży; krzywdzi ubogiego i nędznego i bezprawnie uciska cudzoziemca."
  tags: []
"Ez22,30":
  text: "I szukałem wśród nich męża, który by naprawił mur i stanął w wyłomie przede mną w obronie ziemi, abym jej nie zniszczył. Ale nie znalazłem żadnego."
  tags: []
"Ez22,31":
  text: "Wylałem więc na nich swój gniew, wyniszczyłem ich ogniem swojej zapalczywości. Złożyłem im na głowę ich własną drogę, mówi Pan BÓG."
  tags: []
