"Ez27,1":
  text: "I doszło do mnie słowo PANA mówiące:"
  tags: []
"Ez27,2":
  text: "A ty, synu człowieczy, podnieś lament nad Tyrem;"
  tags: []
"Ez27,3":
  text: "I powiedz Tyrowi, który leży u wejścia do morza i prowadzi handel z narodami na wielu wyspach: Tak mówi Pan BÓG: Tyrze, ty powiedziałeś: Ja jestem doskonały w swojej piękności."
  tags: []
"Ez27,4":
  text: "Twoje granice są w środku morza, twoi budowniczowie uczynili doskonałą twoją piękność."
  tags: []
"Ez27,5":
  text: "Z cyprysów Seniru pobudowali wszystkie twoje deski pokładowe, brali cedry z Libanu, aby zrobić maszty dla ciebie."
  tags: []
"Ez27,6":
  text: "Z dębów Baszanu wykonywali twoje wiosła, urobili twoje ławy z kości słoniowych i bukszpanu z wysp Kittim."
  tags: []
"Ez27,7":
  text: "Bisior haftowany z Egiptu był twoim płótnem, z którego zrobiłeś swoje żagle; błękit i purpura z wysp Eliszy były twoim nakryciem."
  tags: []
"Ez27,8":
  text: "Mieszkańcy Sydonu i Arwadu byli twoimi żeglarzami. Twoi mędrcy, Tyrze, którzy pochodzili z ciebie, byli twoimi sternikami."
  tags: []
"Ez27,9":
  text: "Starcy z Gebalu i jego mędrcy naprawiali u ciebie twoje pęknięcia; wszystkie okręty morskie i ich żeglarze przebywali u ciebie, aby prowadzić z tobą handel."
  tags: []
"Ez27,10":
  text: "Mieszkańcy Persji, Lud i Put służyli w twoim wojsku jako twoi wojownicy. Wieszali u ciebie tarczę i hełm i dodawali ci piękna."
  tags: []
"Ez27,11":
  text: "Synowie Arwadu wraz z twoim wojskiem stali na twoich murach dokoła, także Gammadejczycy czuwali na twoich wieżach, wieszali swoje tarcze na twoich murach dokoła. Oni uczynili doskonałą twoją piękność."
  tags: []
"Ez27,12":
  text: "Tarszisz prowadził z tobą handel ze względu na obfitość wszelkiego bogactwa. Na twoich jarmarkach handlowali srebrem, żelazem, cyną i ołowiem."
  tags: []
"Ez27,13":
  text: "Jawan, Tubal i Meszek prowadzili z tobą handel. Za twoje towary dawali ludzi i naczynia z brązu."
  tags: []
"Ez27,14":
  text: "Dom Togarmy handlował końmi, jeźdźcami i mułami na twoich jarmarkach."
  tags: []
"Ez27,15":
  text: "Synowie Dedanu prowadzili z tobą handel i wiele wysp kupowało towary twojej ręki. Dawali ci w zamian rogi, kość słoniową i drewno hebanu."
  tags: []
"Ez27,16":
  text: "Syryjczycy prowadzili z tobą handel ze względu na mnóstwo twoich wyrobów. Handlowali karbunkułami, purpurą, haftowaną tkaniną, bisiorem, koralami i kryształami na twoich jarmarkach."
  tags: []
"Ez27,17":
  text: "Juda i ziemia Izraela prowadziły z tobą handel; dawali ci w zamian pszenicę z Minnit i Pannag, miód, oliwę i balsam."
  tags: []
"Ez27,18":
  text: "Damaszek prowadził z tobą handel ze względu na mnóstwo twoich wyrobów i ze względu na obfitość wszelkiego bogactwa; handlował winem z Chelbonu i białą wełną."
  tags: []
"Ez27,19":
  text: "Także Dan i Jawan, wędrowni handlarze na twoich jarmarkach, dawali ci w zamian żelazo polerowane, kasję i ziela tataraku."
  tags: []
"Ez27,20":
  text: "Dedan prowadził handel u ciebie kosztowną tkaniną na rydwany."
  tags: []
"Ez27,21":
  text: "Arabia i wszyscy książęta Kedaru prowadzili z tobą handel jagniętami, baranami i kozłami; tym handlowali u ciebie."
  tags: []
"Ez27,22":
  text: "Kupcy z Szeby i Rama prowadzili z tobą handel. Handlowali w twoich jarmarkach najlepszymi ze wszystkich woni oraz wszelkim drogim kamieniem i złotem."
  tags: []
"Ez27,23":
  text: "Charan, Kanne i Eden, kupcy z Szeby, Assur i Kilmad prowadzili z tobą handel."
  tags: []
"Ez27,24":
  text: "Handlowali z tobą szatami z błękitu, haftowaną tkaniną i skrzyniami z cedru dla kosztownych szat, które zawiązywano sznurami; tym handlowali u ciebie."
  tags: []
"Ez27,25":
  text: "Okręty morskie przypłynęły po twoje towary wymienne. Napełniłeś się i byłeś wielce uwielbiony w sercu mórz."
  tags: []
"Ez27,26":
  text: "Twoi wioślarze wyprowadzili cię na wielkie wody. Wschodni wiatr rozbił cię w sercu mórz."
  tags: []
"Ez27,27":
  text: "Twoje bogactwa, twoje jarmarki, twoje towary, twoi żeglarze i sternicy oraz ci, którzy naprawiali twoje pęknięcia, twoi nabywcy, kupcy twoich towarów, wszyscy twoi wojownicy, którzy są u ciebie, i cały twój tłum, który znajduje się u ciebie, wpadną do środka morza w dniu twego upadku."
  tags: []
"Ez27,28":
  text: "Na głos krzyku twoich sterników zadrżą wybrzeża."
  tags: []
"Ez27,29":
  text: "I zejdą ze swoich okrętów wszyscy wioślarze, żeglarze i wszyscy sternicy morscy, i staną na lądzie."
  tags: []
"Ez27,30":
  text: "Będą lamentować nad tobą donośnym głosem i gorzko będą zawodzić; posypią prochem swoje głowy i w popiele będą się tarzać."
  tags: []
"Ez27,31":
  text: "Z powodu ciebie ogolą sobie głowy, przepaszą się worami i będą płakać nad tobą w goryczy swej duszy i gorzkim zawodzeniu."
  tags: []
"Ez27,32":
  text: "Uczynią nad tobą lament żałosny i będą nad tobą zawodzić, mówiąc: Które miasto jest podobne do Tyru, który zniszczono pośrodku morza?"
  tags: []
"Ez27,33":
  text: "Gdy twoje towary szły z morza, syciłeś wiele narodów; mnóstwem twoich bogactw i wyrobów wzbogaciłeś królów ziemi."
  tags: []
"Ez27,34":
  text: "Ale gdy będziesz zdruzgotany przez morza w głębinach wód, twoje towary i cały twój tłum pośród ciebie upadnie."
  tags: []
"Ez27,35":
  text: "Wszyscy mieszkańcy wysp będą zdumiewać się nad tobą, a ich królowie będą zdjęci strachem, z zatrwożoną twarzą."
  tags: []
"Ez27,36":
  text: "Kupcy spośród narodów świsną nad tobą; będziesz dla nich postrachem i przestaniesz istnieć na wieki."
  tags: []
