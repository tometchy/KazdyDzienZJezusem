"Ez27,1": "I doszło do mnie słowo PANA mówiące:"
"Ez27,2": "A ty, synu człowieczy, podnieś lament nad Tyrem;"
"Ez27,3": "I powiedz Tyrowi, który leży u wejścia do morza i prowadzi handel z narodami na wielu wyspach: Tak mówi Pan BÓG: Tyrze, ty powiedziałeś: Ja jestem doskonały w swojej piękności."
"Ez27,4": "Twoje granice są w środku morza, twoi budowniczowie uczynili doskonałą twoją piękność."
"Ez27,5": "Z cyprysów Seniru pobudowali wszystkie twoje deski pokładowe, brali cedry z Libanu, aby zrobić maszty dla ciebie."
"Ez27,6": "Z dębów Baszanu wykonywali twoje wiosła, urobili twoje ławy z kości słoniowych i bukszpanu z wysp Kittim."
"Ez27,7": "Bisior haftowany z Egiptu był twoim płótnem, z którego zrobiłeś swoje żagle; błękit i purpura z wysp Eliszy były twoim nakryciem."
"Ez27,8": "Mieszkańcy Sydonu i Arwadu byli twoimi żeglarzami. Twoi mędrcy, Tyrze, którzy pochodzili z ciebie, byli twoimi sternikami."
"Ez27,9": "Starcy z Gebalu i jego mędrcy naprawiali u ciebie twoje pęknięcia; wszystkie okręty morskie i ich żeglarze przebywali u ciebie, aby prowadzić z tobą handel."
"Ez27,10": "Mieszkańcy Persji, Lud i Put służyli w twoim wojsku jako twoi wojownicy. Wieszali u ciebie tarczę i hełm i dodawali ci piękna."
"Ez27,11": "Synowie Arwadu wraz z twoim wojskiem stali na twoich murach dokoła, także Gammadejczycy czuwali na twoich wieżach, wieszali swoje tarcze na twoich murach dokoła. Oni uczynili doskonałą twoją piękność."
"Ez27,12": "Tarszisz prowadził z tobą handel ze względu na obfitość wszelkiego bogactwa. Na twoich jarmarkach handlowali srebrem, żelazem, cyną i ołowiem."
"Ez27,13": "Jawan, Tubal i Meszek prowadzili z tobą handel. Za twoje towary dawali ludzi i naczynia z brązu."
"Ez27,14": "Dom Togarmy handlował końmi, jeźdźcami i mułami na twoich jarmarkach."
"Ez27,15": "Synowie Dedanu prowadzili z tobą handel i wiele wysp kupowało towary twojej ręki. Dawali ci w zamian rogi, kość słoniową i drewno hebanu."
"Ez27,16": "Syryjczycy prowadzili z tobą handel ze względu na mnóstwo twoich wyrobów. Handlowali karbunkułami, purpurą, haftowaną tkaniną, bisiorem, koralami i kryształami na twoich jarmarkach."
"Ez27,17": "Juda i ziemia Izraela prowadziły z tobą handel; dawali ci w zamian pszenicę z Minnit i Pannag, miód, oliwę i balsam."
"Ez27,18": "Damaszek prowadził z tobą handel ze względu na mnóstwo twoich wyrobów i ze względu na obfitość wszelkiego bogactwa; handlował winem z Chelbonu i białą wełną."
"Ez27,19": "Także Dan i Jawan, wędrowni handlarze na twoich jarmarkach, dawali ci w zamian żelazo polerowane, kasję i ziela tataraku."
"Ez27,20": "Dedan prowadził handel u ciebie kosztowną tkaniną na rydwany."
"Ez27,21": "Arabia i wszyscy książęta Kedaru prowadzili z tobą handel jagniętami, baranami i kozłami; tym handlowali u ciebie."
"Ez27,22": "Kupcy z Szeby i Rama prowadzili z tobą handel. Handlowali w twoich jarmarkach najlepszymi ze wszystkich woni oraz wszelkim drogim kamieniem i złotem."
"Ez27,23": "Charan, Kanne i Eden, kupcy z Szeby, Assur i Kilmad prowadzili z tobą handel."
"Ez27,24": "Handlowali z tobą szatami z błękitu, haftowaną tkaniną i skrzyniami z cedru dla kosztownych szat, które zawiązywano sznurami; tym handlowali u ciebie."
"Ez27,25": "Okręty morskie przypłynęły po twoje towary wymienne. Napełniłeś się i byłeś wielce uwielbiony w sercu mórz."
"Ez27,26": "Twoi wioślarze wyprowadzili cię na wielkie wody. Wschodni wiatr rozbił cię w sercu mórz."
"Ez27,27": "Twoje bogactwa, twoje jarmarki, twoje towary, twoi żeglarze i sternicy oraz ci, którzy naprawiali twoje pęknięcia, twoi nabywcy, kupcy twoich towarów, wszyscy twoi wojownicy, którzy są u ciebie, i cały twój tłum, który znajduje się u ciebie, wpadną do środka morza w dniu twego upadku."
"Ez27,28": "Na głos krzyku twoich sterników zadrżą wybrzeża."
"Ez27,29": "I zejdą ze swoich okrętów wszyscy wioślarze, żeglarze i wszyscy sternicy morscy, i staną na lądzie."
"Ez27,30": "Będą lamentować nad tobą donośnym głosem i gorzko będą zawodzić; posypią prochem swoje głowy i w popiele będą się tarzać."
"Ez27,31": "Z powodu ciebie ogolą sobie głowy, przepaszą się worami i będą płakać nad tobą w goryczy swej duszy i gorzkim zawodzeniu."
"Ez27,32": "Uczynią nad tobą lament żałosny i będą nad tobą zawodzić, mówiąc: Które miasto jest podobne do Tyru, który zniszczono pośrodku morza?"
"Ez27,33": "Gdy twoje towary szły z morza, syciłeś wiele narodów; mnóstwem twoich bogactw i wyrobów wzbogaciłeś królów ziemi."
"Ez27,34": "Ale gdy będziesz zdruzgotany przez morza w głębinach wód, twoje towary i cały twój tłum pośród ciebie upadnie."
"Ez27,35": "Wszyscy mieszkańcy wysp będą zdumiewać się nad tobą, a ich królowie będą zdjęci strachem, z zatrwożoną twarzą."
"Ez27,36": "Kupcy spośród narodów świsną nad tobą; będziesz dla nich postrachem i przestaniesz istnieć na wieki."
