"Ez24,1": "W dziewiątym roku, w dziesiątym miesiącu, dziesiątego dnia tego miesiąca, znowu doszło do mnie słowo PANA mówiące:"
"Ez24,2": "Synu człowieczy, napisz sobie datę tego dnia, tego właśnie dnia. W tym dniu bowiem król Babilonu obległ Jerozolimę."
"Ez24,3": "I opowiedz przypowieść temu domowi buntowniczemu. Powiedz do niego: Tak mówi Pan BÓG: Postaw kocioł, postaw i nalej do niego wody."
"Ez24,4": "Włóż do niego kawałki mięsa, każdy dobry kawałek, udziec i łopatkę, napełnij go najlepszymi kośćmi."
"Ez24,5": "Weź to, co najlepsze ze stada, rozpal pod nim ogień z kości, aby wrzało i kipiało, i niech się ugotują w nim kości."
"Ez24,6": "Dlatego tak mówi Pan BÓG: Biada miastu krwawemu, kotłowi, w którym jest jego szumowina i z którego szumowina nie wychodzi. Wyciągaj z niego kawałek po kawałku, niech nie padnie na niego los."
"Ez24,7": "W nim bowiem jest krew przelana przez niego; wystawiono ją na wierzchu skały, nie wylano jej na ziemię, aby była przykryta prochem;"
"Ez24,8": "Aby rozniecić zapalczywość dla dokonania zemsty. Wystawiłem więc jego krew na wierzchu skały, aby nie była przykryta."
"Ez24,9": "Dlatego tak mówi Pan BÓG: Biada miastu krwawemu! Ja ułożę wielki stos drew."
"Ez24,10": "Nakładaj drwa, rozniecaj ogień, ugotuj mięso i przypraw korzeniem, niech kości się spalą."
"Ez24,11": "Potem postaw pusty kocioł na węglach, aby się rozgrzał i rozpaliła jego miedź, by się roztopiła w nim jego nieczystość i jego szumowina była zniszczona."
"Ez24,12": "Zmęczyła się swymi kłamstwami, a ogrom jej szumowiny nie wychodzi z niej, jej szumowina będzie strawiona w ogniu."
"Ez24,13": "W twojej nieczystości jest rozwiązłość. Ponieważ chciałem cię oczyścić, a nie dałaś się oczyścić, to już nie będziesz oczyszczona ze swojej nieczystości, aż uśmierzę na tobie swoją zapalczywość."
"Ez24,14": "Ja, PAN, powiedziałem. Przyjdzie to i dokonam tego, nie cofnę się i nie zlituję się ani nie będę żałował; według twoich dróg i według twoich czynów będę cię sądzić, mówi Pan BÓG."
"Ez24,15": "I doszło do mnie słowo PANA mówiące:"
"Ez24,16": "Synu człowieczy, oto zabiorę ci nagle rozkosz twoich oczu, ale ty nie lamentuj ani nie płacz, niech twoje łzy się nie wylewają."
"Ez24,17": "Zaniechaj zawodzenia, nie urządzaj żałoby po zmarłej; zawiąż sobie zawój, nałóż obuwie na nogi, nie zasłaniaj warg i nie jedz niczyjego chleba."
"Ez24,18": "Rano przemówiłem więc do ludu, a wieczorem umarła moja żona; i uczyniłem rano, jak mi rozkazano."
"Ez24,19": "I lud zapytał mnie: Czy nie powiesz nam, co znaczą dla nas te rzeczy, które czynisz?"
"Ez24,20": "Wtedy odpowiedziałem im: Słowo PANA doszło do mnie mówiące:"
"Ez24,21": "Powiedz domowi Izraela: Tak mówi Pan BÓG: Oto zbezczeszczę swoją świątynię, chlubę waszej potęgi, rozkosz waszych oczu i miłość waszej duszy, a wasi synowie i wasze córki, które pozostawiliście, polegną od miecza."
"Ez24,22": "I uczynicie tak, jak ja uczyniłem: nie zasłonicie warg i nie będziecie jeść niczyjego chleba;"
"Ez24,23": "Wasze zawoje będą na waszych głowach i wasze obuwie na nogach; nie będziecie zawodzić ani płakać, lecz będziecie schnąć z powodu waszych nieprawości i będziecie wzdychać jeden do drugiego."
"Ez24,24": "I Ezechiel będzie dla was znakiem: wszystko, co on uczynił, wy będziecie czynić. A gdy to nastąpi, poznacie, że ja jestem Panem BOGIEM."
"Ez24,25": "A ty, synu człowieczy, czy w tym dniu, w którym zabiorę im ich moc, radość ich chluby, rozkosz ich oczu i tęsknotę duszy, ich synów i córki;"
"Ez24,26": "Czy w tym dniu nie przyjdzie do ciebie ten, co ucieknie, aby przynieść wieść dla twoich uszu?"
"Ez24,27": "W tym dniu otworzą się twoje usta przed tym, który uszedł, i będziesz mówił, a nie będziesz już niemy. Będziesz dla nich znakiem i poznają, że ja jestem PANEM."
