"Ez24,1":
  text: "W dziewiątym roku, w dziesiątym miesiącu, dziesiątego dnia tego miesiąca, znowu doszło do mnie słowo PANA mówiące:"
  tags: []
"Ez24,2":
  text: "Synu człowieczy, napisz sobie datę tego dnia, tego właśnie dnia. W tym dniu bowiem król Babilonu obległ Jerozolimę."
  tags: []
"Ez24,3":
  text: "I opowiedz przypowieść temu domowi buntowniczemu. Powiedz do niego: Tak mówi Pan BÓG: Postaw kocioł, postaw i nalej do niego wody."
  tags: []
"Ez24,4":
  text: "Włóż do niego kawałki mięsa, każdy dobry kawałek, udziec i łopatkę, napełnij go najlepszymi kośćmi."
  tags: []
"Ez24,5":
  text: "Weź to, co najlepsze ze stada, rozpal pod nim ogień z kości, aby wrzało i kipiało, i niech się ugotują w nim kości."
  tags: []
"Ez24,6":
  text: "Dlatego tak mówi Pan BÓG: Biada miastu krwawemu, kotłowi, w którym jest jego szumowina i z którego szumowina nie wychodzi. Wyciągaj z niego kawałek po kawałku, niech nie padnie na niego los."
  tags: []
"Ez24,7":
  text: "W nim bowiem jest krew przelana przez niego; wystawiono ją na wierzchu skały, nie wylano jej na ziemię, aby była przykryta prochem;"
  tags: []
"Ez24,8":
  text: "Aby rozniecić zapalczywość dla dokonania zemsty. Wystawiłem więc jego krew na wierzchu skały, aby nie była przykryta."
  tags: []
"Ez24,9":
  text: "Dlatego tak mówi Pan BÓG: Biada miastu krwawemu! Ja ułożę wielki stos drew."
  tags: []
"Ez24,10":
  text: "Nakładaj drwa, rozniecaj ogień, ugotuj mięso i przypraw korzeniem, niech kości się spalą."
  tags: []
"Ez24,11":
  text: "Potem postaw pusty kocioł na węglach, aby się rozgrzał i rozpaliła jego miedź, by się roztopiła w nim jego nieczystość i jego szumowina była zniszczona."
  tags: []
"Ez24,12":
  text: "Zmęczyła się swymi kłamstwami, a ogrom jej szumowiny nie wychodzi z niej, jej szumowina będzie strawiona w ogniu."
  tags: []
"Ez24,13":
  text: "W twojej nieczystości jest rozwiązłość. Ponieważ chciałem cię oczyścić, a nie dałaś się oczyścić, to już nie będziesz oczyszczona ze swojej nieczystości, aż uśmierzę na tobie swoją zapalczywość."
  tags: []
"Ez24,14":
  text: "Ja, PAN, powiedziałem. Przyjdzie to i dokonam tego, nie cofnę się i nie zlituję się ani nie będę żałował; według twoich dróg i według twoich czynów będę cię sądzić, mówi Pan BÓG."
  tags: []
"Ez24,15":
  text: "I doszło do mnie słowo PANA mówiące:"
  tags: []
"Ez24,16":
  text: "Synu człowieczy, oto zabiorę ci nagle rozkosz twoich oczu, ale ty nie lamentuj ani nie płacz, niech twoje łzy się nie wylewają."
  tags: []
"Ez24,17":
  text: "Zaniechaj zawodzenia, nie urządzaj żałoby po zmarłej; zawiąż sobie zawój, nałóż obuwie na nogi, nie zasłaniaj warg i nie jedz niczyjego chleba."
  tags: []
"Ez24,18":
  text: "Rano przemówiłem więc do ludu, a wieczorem umarła moja żona; i uczyniłem rano, jak mi rozkazano."
  tags: []
"Ez24,19":
  text: "I lud zapytał mnie: Czy nie powiesz nam, co znaczą dla nas te rzeczy, które czynisz?"
  tags: []
"Ez24,20":
  text: "Wtedy odpowiedziałem im: Słowo PANA doszło do mnie mówiące:"
  tags: []
"Ez24,21":
  text: "Powiedz domowi Izraela: Tak mówi Pan BÓG: Oto zbezczeszczę swoją świątynię, chlubę waszej potęgi, rozkosz waszych oczu i miłość waszej duszy, a wasi synowie i wasze córki, które pozostawiliście, polegną od miecza."
  tags: []
"Ez24,22":
  text: "I uczynicie tak, jak ja uczyniłem: nie zasłonicie warg i nie będziecie jeść niczyjego chleba;"
  tags: []
"Ez24,23":
  text: "Wasze zawoje będą na waszych głowach i wasze obuwie na nogach; nie będziecie zawodzić ani płakać, lecz będziecie schnąć z powodu waszych nieprawości i będziecie wzdychać jeden do drugiego."
  tags: []
"Ez24,24":
  text: "I Ezechiel będzie dla was znakiem: wszystko, co on uczynił, wy będziecie czynić. A gdy to nastąpi, poznacie, że ja jestem Panem BOGIEM."
  tags: []
"Ez24,25":
  text: "A ty, synu człowieczy, czy w tym dniu, w którym zabiorę im ich moc, radość ich chluby, rozkosz ich oczu i tęsknotę duszy, ich synów i córki;"
  tags: []
"Ez24,26":
  text: "Czy w tym dniu nie przyjdzie do ciebie ten, co ucieknie, aby przynieść wieść dla twoich uszu?"
  tags: []
"Ez24,27":
  text: "W tym dniu otworzą się twoje usta przed tym, który uszedł, i będziesz mówił, a nie będziesz już niemy. Będziesz dla nich znakiem i poznają, że ja jestem PANEM."
  tags: []
