"Ez4,1":
  text: "A ty, synu człowieczy, weź sobie glinianą tabliczkę, połóż ją przed sobą i wyryj na niej miasto Jerozolimę;"
  tags: []
"Ez4,2":
  text: "Sporządź jego oblężenie, zbuduj przeciwko niemu szańce, usyp przeciwko niemu wał, uszykuj przeciwko niemu wojska i ustaw przeciwko niemu tarany dokoła."
  tags: []
"Ez4,3":
  text: "Następnie weź sobie patelnię żelazną, postaw ją jakby mur żelazny pomiędzy sobą a miastem i odwróć swą twarz przeciwko niemu. Ono będzie oblężone, a ty będziesz je oblegał. To będzie znak dla domu Izraela."
  tags: []
"Ez4,4":
  text: "Potem połóż się na lewym boku i złóż na nim nieprawość domu Izraela. Ile dni będziesz na nim leżał, tak długo będziesz znosił ich nieprawość."
  tags: []
"Ez4,5":
  text: "A ja wyznaczam ci lata ich nieprawości według liczby dni: trzysta dziewięćdziesiąt dni. Tak długo będziesz znosił nieprawość domu Izraela."
  tags: []
"Ez4,6":
  text: "A gdy je wypełnisz, położysz się na prawym boku i będziesz znosił nieprawość domu Judy przez czterdzieści dni. Wyznaczam ci jeden dzień za każdy rok."
  tags: []
"Ez4,7":
  text: "Tak więc obróć swoją twarz na oblężenie Jerozolimy, obnaż swoje ramię i prorokuj przeciwko niej."
  tags: []
"Ez4,8":
  text: "A oto kładę na ciebie pęta, abyś nie mógł się obrócić z jednego boku na drugi, aż wypełnisz dni swego oblężenia."
  tags: []
"Ez4,9":
  text: "Weź sobie też pszenicę, jęczmień, bób, soczewicę, proso i orkisz, włóż to do jednego naczynia i przygotuj sobie z tego chleb, a będziesz go jadł przez tyle dni, ile będziesz leżeć na swym boku – przez trzysta dziewięćdziesiąt dni."
  tags: []
"Ez4,10":
  text: "A waga twego pokarmu, który będziesz jadł, wyniesie dwadzieścia syklów na dzień. Będziesz go jadł w ustalonym czasie."
  tags: []
"Ez4,11":
  text: "Także wodę będziesz pił w określonej ilości; szóstą część hinu będziesz pił w ustalonym czasie."
  tags: []
"Ez4,12":
  text: "Chleb będziesz jadł jak podpłomyki jęczmienne, upieczesz go na ich oczach na ludzkich odchodach."
  tags: []
"Ez4,13":
  text: "I PAN powiedział: Tak synowie Izraela będą jeść swój nieczysty chleb wśród pogan, do których ich wypędzę."
  tags: []
"Ez4,14":
  text: "I powiedziałem: Ach, Panie BOŻE! Oto moja dusza nigdy się nie splamiła: od mojego dzieciństwa aż do tej pory nie jadłem padliny ani tego, co zwierzę rozszarpało; żadne mięso obrzydłe nie weszło do moich ust."
  tags: []
"Ez4,15":
  text: "Ale on powiedział do mnie: Oto daję ci odchody wołowe zamiast odchodów ludzkich, abyś sobie na nich upiekł chleb."
  tags: []
"Ez4,16":
  text: "Potem powiedział do mnie: Synu człowieczy, oto ja zniszczę zapas chleba w Jerozolimie, tak że będą jedli chleb w odważonej ilości i w zmartwieniu i będą pić wodę w odmierzonej ilości i z przerażeniem;"
  tags: []
"Ez4,17":
  text: "Aby im brakowało chleba i wody, aby każdy z nich był przerażony i niszczał w swoich nieprawościach."
  tags: []
