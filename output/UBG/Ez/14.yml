"Ez14,1":
  text: "Potem przyszli do mnie niektórzy spośród starszych Izraela i usiedli przede mną."
  tags: []
"Ez14,2":
  text: "I doszło do mnie słowo PANA mówiące:"
  tags: []
"Ez14,3":
  text: "Synu człowieczy, ci ludzie postawili swoje bożki w swym sercu, a kamień potknięcia do nieprawości położyli przed twarzą. Czy uważasz, że szczerze pytają mnie o radę?"
  tags: []
"Ez14,4":
  text: "Dlatego przemów do nich i powiedz im: Tak mówi Pan BÓG: Każdemu z domu Izraela, który stawia swoje bożki w swym sercu i położy przed twarzą kamień potknięcia do nieprawości, a przyjdzie do proroka, ja, PAN, odpowiem według liczby jego bożków;"
  tags: []
"Ez14,5":
  text: "Aby uchwycić dom Izraela za serce, gdyż oni wszyscy odeszli ode mnie z powodu swoich bożków."
  tags: []
"Ez14,6":
  text: "Dlatego powiedz do domu Izraela: Tak mówi Pan BÓG: Nawróćcie się i odwróćcie się od swoich bożków, i odwróćcie swoje twarze od wszystkich waszych obrzydliwości."
  tags: []
"Ez14,7":
  text: "Każdemu bowiem z domu Izraela i z obcych przebywających w Izraelu, który odwróci się od naśladowania mnie, a postawi swoje bożki w swym sercu, położy przed twarzą kamień potknięcia do nieprawości i przyjdzie do proroka, aby radzić się mnie przez niego, ja, PAN, sam mu odpowiem."
  tags: []
"Ez14,8":
  text: "I zwrócę swoją twarz przeciw temu człowiekowi, i uczynię z niego znak i przysłowie, i wytracę go spośród mego ludu. I poznacie, że ja jestem PANEM."
  tags: []
"Ez14,9":
  text: "A jeśli prorok dał się zwieść i mówił słowo, ja, PAN, zwiodłem tego proroka. Wyciągnę na niego swoją rękę i zgładzę go spośród mego ludu Izraela."
  tags: []
"Ez14,10":
  text: "I poniosą karę za swoją nieprawość: kara proroka będzie taka sama jak kara tego, który u niego się radził;"
  tags: []
"Ez14,11":
  text: "Aby dom Izraela już więcej nie oddalał się ode mnie ani nie plamił się więcej swymi przestępstwami; aby był moim ludem, a ja – ich Bogiem, mówi Pan BÓG."
  tags: []
"Ez14,12":
  text: "Słowo PANA ponownie doszło do mnie mówiące:"
  tags: []
"Ez14,13":
  text: "Synu człowieczy, jeśli ziemia zgrzeszy przeciwko mnie, niezmiernie dopuszczając się przestępstwa, wtedy wyciągnę na nią swą rękę, zniszczę jej zapas chleba, ześlę na nią głód i wytracę z niej ludzi i zwierzęta."
  tags: []
"Ez14,14":
  text: "Choćby byli pośród niej ci trzej mężowie: Noe, Daniel i Hiob, to oni przez swoją sprawiedliwość wybawiliby tylko własne dusze, mówi Pan BÓG."
  tags: []
"Ez14,15":
  text: "A jeśli ześlę na ziemię dzikie zwierzęta, a one ją wyludnią i będzie spustoszona tak, że nikt nie będzie mógł przechodzić z powodu zwierząt;"
  tags: []
"Ez14,16":
  text: "Jak żyję, mówi Pan BÓG, że choćby ci trzej mężowie byli pośród niej, żadną miarą nie wybawiliby ani synów, ani córek. Tylko oni sami byliby wybawieni, lecz ziemia byłaby spustoszona."
  tags: []
"Ez14,17":
  text: "Albo jeśli sprowadzę miecz na tę ziemię i powiem do miecza: Przejdź przez tę ziemię; i wytracę z niej ludzi i zwierzęta;"
  tags: []
"Ez14,18":
  text: "Jak żyję, mówi Pan BÓG – choćby ci trzej mężowie byli pośrodku niej, żadną miarą nie wybawiliby ani synów, ani córek, ale tylko oni sami byliby wybawieni."
  tags: []
"Ez14,19":
  text: "Albo jeśli ześlę zarazę na tę ziemię i wyleję na nią swoją zapalczywość w sposób krwawy, aby wyniszczyć z niej ludzi i zwierzęta;"
  tags: []
"Ez14,20":
  text: "Choćby Noe, Daniel i Hiob byli pośród niej, jak żyję, mówi Pan BÓG, żadną miarą nie wybawiliby ani syna, ani córki; oni przez swoją sprawiedliwość wybawiliby tylko swoje dusze."
  tags: []
"Ez14,21":
  text: "Tak bowiem mówi Pan BÓG: Tym bardziej, gdy ześlę na Jerozolimę moje cztery ciężkie kary: miecz, głód, dzikie zwierzęta i zarazę, aby wytraciły z niej ludzi i zwierzęta."
  tags: []
"Ez14,22":
  text: "Oto jednak zostanie w niej resztka, która zostanie wyprowadzona – synowie i córki. Oto oni wyjdą do was i zobaczycie ich drogę i czyny, a wy będziecie pocieszeni z powodu tego nieszczęścia, które sprowadziłem na Jerozolimę – wszystkiego, co sprowadziłem na nią."
  tags: []
"Ez14,23":
  text: "I oni będą was pocieszać, gdy zobaczycie ich drogę i czyny. I zrozumiecie, że tego wszystkiego, co w niej uczyniłem, nie uczyniłem bez przyczyny, mówi Pan BÓG."
  tags: []
