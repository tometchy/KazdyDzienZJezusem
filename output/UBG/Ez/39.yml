"Ez39,1": "Ty więc, synu człowieczy, prorokuj przeciwko Gogowi i mów: Tak mówi Pan BÓG: Oto jestem przeciwko tobie, Gogu, naczelny księciu w Meszek i Tubal."
"Ez39,2": "Zawrócę cię i zostawię z ciebie tylko szóstą część, wyprowadzę cię z północnych stron i wprowadzę cię na góry Izraela."
"Ez39,3": "Wytrącę twój łuk z twej lewej ręki i wybiję twoje strzały z twej prawej ręki."
"Ez39,4": "Na górach Izraela padniesz ty i wszystkie twoje zastępy oraz ludy, które będą z tobą. Wydam cię na pożarcie ptactwu, wszelkim istotom skrzydlatym i zwierzętom polnym."
"Ez39,5": "Padniesz na otwartym polu, bo ja to wypowiedziałem, mówi Pan BÓG."
"Ez39,6": "I ześlę ogień na Magoga i na tych, którzy bezpiecznie mieszkają na wyspach. I poznają, że ja jestem PANEM."
"Ez39,7": "A dam poznać moje święte imię pośród mojego ludu Izraela i nie pozwolę już zbezcześcić mojego świętego imienia. I poznają narody, że ja jestem PANEM, Święty w Izraelu."
"Ez39,8": "Oto nadchodzi to i spełni się, mówi Pan BÓG. To jest dzień, o którym mówiłem."
"Ez39,9": "Wtedy mieszkańcy miast Izraela wyjdą, rozniecą ogień i spalą oręże: tarcze i puklerze, łuki i strzały, oszczepy i włócznie. I będą tym palić ogień przez siedem lat."
"Ez39,10": "Nie będą znosić drwa z pola ani rąbać go w lasach, ale orężem będzie się palić. A złupią tych, którzy ich łupili, i będą plądrować tych, którzy ich plądrowali, mówi Pan BÓG."
"Ez39,11": "I stanie się w tym dniu, że dam Gogowi miejsce na grób, tam w Izraelu, dolinę przechodzących na wschód od morza, która zatka usta przechodniów. Pogrzebią tam Goga i całą jego rzeszę i nazwą ją Doliną Hamon-Gog."
"Ez39,12": "Dom Izraela będzie ich grzebać przez siedem miesięcy, aby oczyścić ziemię."
"Ez39,13": "A tak będzie ich grzebał cały lud tej ziemi i wyjdzie mu to na chwałę w dniu, w którym będę uwielbiony, mówi Pan BÓG."
"Ez39,14": "I wyznaczą mężczyzn, którzy będą stale przechodzić po tej ziemi, aby wraz z przechodniami grzebać tych, którzy pozostali na ziemi, by ją oczyścić. Po upływie siedmiu miesięcy zaczną przeszukiwanie."
"Ez39,15": "A gdy przybysze będą przechodzić przez ziemię, a któryś z nich zobaczy kość ludzką, postawią przy niej znak, aż grabarze ją pogrzebią w Dolinie Hamon-Gog."
"Ez39,16": "A nazwa tego miasta będzie Hamona. I tak oczyszczą ziemię."
"Ez39,17": "A ty, synu człowieczy, tak mówi Pan BÓG: Powiedz ptactwu, wszelkim istotom skrzydlatym i zwierzętom polnym: Zbierzcie się i przyjdźcie, zgromadźcie się zewsząd na moją ofiarę, którą wam przygotowałem, wielką ofiarę na górach Izraela, abyście jedli mięso i pili krew."
"Ez39,18": "Będziecie jeść mięso mocarzy i pić krew książąt ziemi, baranów, jagniąt, kozłów i cielców, wszystkie tuczniki z Baszanu."
"Ez39,19": "Najecie się tłuszczu do syta i upoicie się krwią z mojej ofiary, którą wam przygotowałem."
"Ez39,20": "I nasycicie się przy moim stole końmi, jeźdźcami, mocarzami i wszystkimi wojownikami, mówi Pan BÓG."
"Ez39,21": "Tak objawię moją chwałę wśród narodów. Wszystkie narody zobaczą mój sąd, który wykonałem, i moją rękę, którą na nie wyciągnąłem."
"Ez39,22": "I pozna dom Izraela, że ja jestem PANEM, ich Bogiem, od tego dnia i na zawsze."
"Ez39,23": "Poznają też narody, że dom Izraela z powodu swojej nieprawości został uprowadzony do niewoli, ponieważ wystąpił przeciwko mnie. Dlatego też zakryłem przed nim swoje oblicze i wydałem go w ręce jego wrogów, i polegli wszyscy od miecza."
"Ez39,24": "Według ich nieczystości i według ich występków postąpiłem z nimi i zakryłem przed nimi swoje oblicze."
"Ez39,25": "Dlatego tak mówi Pan BÓG: Teraz odwrócę niewolę Jakuba i zmiłuję się nad całym domem Izraela, i będę zazdrosny o moje święte imię;"
"Ez39,26": "Gdy już zniosą swoją hańbę i wszystkie swoje przestępstwa, którymi wystąpili przeciwko mnie, wtedy gdy bezpiecznie mieszkali w swojej ziemi, a nikt ich nie trwożył."
"Ez39,27": "A gdy sprowadzę ich z narodów i zgromadzę z ziem ich wrogów, i będę w nich uświęcony na oczach wielu narodów;"
"Ez39,28": "Wtedy poznają, że ja jestem PANEM, ich Bogiem, który uprowadził ich do niewoli wśród narodów, ale teraz zgromadzę ich znowu w ich ziemi, a nie pozostawię tam żadnego z nich."
"Ez39,29": "I nie zakryję już przed nimi mojego oblicza, gdyż wyleję mojego ducha na dom Izraela, mówi Pan BÓG."
