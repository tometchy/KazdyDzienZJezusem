"Ez39,1":
  text: "Ty więc, synu człowieczy, prorokuj przeciwko Gogowi i mów: Tak mówi Pan BÓG: Oto jestem przeciwko tobie, Gogu, naczelny księciu w Meszek i Tubal."
  tags: []
"Ez39,2":
  text: "Zawrócę cię i zostawię z ciebie tylko szóstą część, wyprowadzę cię z północnych stron i wprowadzę cię na góry Izraela."
  tags: []
"Ez39,3":
  text: "Wytrącę twój łuk z twej lewej ręki i wybiję twoje strzały z twej prawej ręki."
  tags: []
"Ez39,4":
  text: "Na górach Izraela padniesz ty i wszystkie twoje zastępy oraz ludy, które będą z tobą. Wydam cię na pożarcie ptactwu, wszelkim istotom skrzydlatym i zwierzętom polnym."
  tags: []
"Ez39,5":
  text: "Padniesz na otwartym polu, bo ja to wypowiedziałem, mówi Pan BÓG."
  tags: []
"Ez39,6":
  text: "I ześlę ogień na Magoga i na tych, którzy bezpiecznie mieszkają na wyspach. I poznają, że ja jestem PANEM."
  tags: []
"Ez39,7":
  text: "A dam poznać moje święte imię pośród mojego ludu Izraela i nie pozwolę już zbezcześcić mojego świętego imienia. I poznają narody, że ja jestem PANEM, Święty w Izraelu."
  tags: []
"Ez39,8":
  text: "Oto nadchodzi to i spełni się, mówi Pan BÓG. To jest dzień, o którym mówiłem."
  tags: []
"Ez39,9":
  text: "Wtedy mieszkańcy miast Izraela wyjdą, rozniecą ogień i spalą oręże: tarcze i puklerze, łuki i strzały, oszczepy i włócznie. I będą tym palić ogień przez siedem lat."
  tags: []
"Ez39,10":
  text: "Nie będą znosić drwa z pola ani rąbać go w lasach, ale orężem będzie się palić. A złupią tych, którzy ich łupili, i będą plądrować tych, którzy ich plądrowali, mówi Pan BÓG."
  tags: []
"Ez39,11":
  text: "I stanie się w tym dniu, że dam Gogowi miejsce na grób, tam w Izraelu, dolinę przechodzących na wschód od morza, która zatka usta przechodniów. Pogrzebią tam Goga i całą jego rzeszę i nazwą ją Doliną Hamon-Gog."
  tags: []
"Ez39,12":
  text: "Dom Izraela będzie ich grzebać przez siedem miesięcy, aby oczyścić ziemię."
  tags: []
"Ez39,13":
  text: "A tak będzie ich grzebał cały lud tej ziemi i wyjdzie mu to na chwałę w dniu, w którym będę uwielbiony, mówi Pan BÓG."
  tags: []
"Ez39,14":
  text: "I wyznaczą mężczyzn, którzy będą stale przechodzić po tej ziemi, aby wraz z przechodniami grzebać tych, którzy pozostali na ziemi, by ją oczyścić. Po upływie siedmiu miesięcy zaczną przeszukiwanie."
  tags: []
"Ez39,15":
  text: "A gdy przybysze będą przechodzić przez ziemię, a któryś z nich zobaczy kość ludzką, postawią przy niej znak, aż grabarze ją pogrzebią w Dolinie Hamon-Gog."
  tags: []
"Ez39,16":
  text: "A nazwa tego miasta będzie Hamona. I tak oczyszczą ziemię."
  tags: []
"Ez39,17":
  text: "A ty, synu człowieczy, tak mówi Pan BÓG: Powiedz ptactwu, wszelkim istotom skrzydlatym i zwierzętom polnym: Zbierzcie się i przyjdźcie, zgromadźcie się zewsząd na moją ofiarę, którą wam przygotowałem, wielką ofiarę na górach Izraela, abyście jedli mięso i pili krew."
  tags: []
"Ez39,18":
  text: "Będziecie jeść mięso mocarzy i pić krew książąt ziemi, baranów, jagniąt, kozłów i cielców, wszystkie tuczniki z Baszanu."
  tags: []
"Ez39,19":
  text: "Najecie się tłuszczu do syta i upoicie się krwią z mojej ofiary, którą wam przygotowałem."
  tags: []
"Ez39,20":
  text: "I nasycicie się przy moim stole końmi, jeźdźcami, mocarzami i wszystkimi wojownikami, mówi Pan BÓG."
  tags: []
"Ez39,21":
  text: "Tak objawię moją chwałę wśród narodów. Wszystkie narody zobaczą mój sąd, który wykonałem, i moją rękę, którą na nie wyciągnąłem."
  tags: []
"Ez39,22":
  text: "I pozna dom Izraela, że ja jestem PANEM, ich Bogiem, od tego dnia i na zawsze."
  tags: []
"Ez39,23":
  text: "Poznają też narody, że dom Izraela z powodu swojej nieprawości został uprowadzony do niewoli, ponieważ wystąpił przeciwko mnie. Dlatego też zakryłem przed nim swoje oblicze i wydałem go w ręce jego wrogów, i polegli wszyscy od miecza."
  tags: []
"Ez39,24":
  text: "Według ich nieczystości i według ich występków postąpiłem z nimi i zakryłem przed nimi swoje oblicze."
  tags: []
"Ez39,25":
  text: "Dlatego tak mówi Pan BÓG: Teraz odwrócę niewolę Jakuba i zmiłuję się nad całym domem Izraela, i będę zazdrosny o moje święte imię;"
  tags: []
"Ez39,26":
  text: "Gdy już zniosą swoją hańbę i wszystkie swoje przestępstwa, którymi wystąpili przeciwko mnie, wtedy gdy bezpiecznie mieszkali w swojej ziemi, a nikt ich nie trwożył."
  tags: []
"Ez39,27":
  text: "A gdy sprowadzę ich z narodów i zgromadzę z ziem ich wrogów, i będę w nich uświęcony na oczach wielu narodów;"
  tags: []
"Ez39,28":
  text: "Wtedy poznają, że ja jestem PANEM, ich Bogiem, który uprowadził ich do niewoli wśród narodów, ale teraz zgromadzę ich znowu w ich ziemi, a nie pozostawię tam żadnego z nich."
  tags: []
"Ez39,29":
  text: "I nie zakryję już przed nimi mojego oblicza, gdyż wyleję mojego ducha na dom Izraela, mówi Pan BÓG."
  tags: []
