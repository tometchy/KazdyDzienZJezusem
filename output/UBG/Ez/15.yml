"Ez15,1":
  text: "Wtedy doszło do mnie słowo PANA mówiące:"
  tags: []
"Ez15,2":
  text: "Synu człowieczy, w czym jest lepsze drzewo winogronowe od wszelkiego innego drzewa albo od latorośli, która jest wśród drzew leśnych?"
  tags: []
"Ez15,3":
  text: "Czy weźmie się z niego drewno do zrobienia czegoś? Czy zrobią z niego kołek do zawieszania na nim jakiegoś naczynia?"
  tags: []
"Ez15,4":
  text: "Oto w ogień rzuca się je na spalenie; ogień strawi oba jego końce, a środek jego jest zwęglony. Na co się jeszcze przyda?"
  tags: []
"Ez15,5":
  text: "Oto póki było całe, nic nie można było z niego zrobić. Tym bardziej gdy strawił je ogień i spaliło się, na nic się więcej nie przyda."
  tags: []
"Ez15,6":
  text: "Dlatego tak mówi Pan BÓG: Jak wśród drzew leśnych jest drzewo winogronowe, które wydałem ogniowi na spalenie, tak też wydam mieszkańców Jerozolimy."
  tags: []
"Ez15,7":
  text: "Zwrócę bowiem swoją twarz przeciwko nim; z jednego ognia wyjdą, a drugi ogień ich strawi. I poznacie, że ja jestem PANEM, gdy zwrócę swoją twarz przeciwko nim."
  tags: []
"Ez15,8":
  text: "I zamienię ich ziemię w spustoszenie, bo dopuścili się przestępstwa, mówi Pan BÓG."
  tags: []
