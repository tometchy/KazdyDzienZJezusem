"Ez15,1": "Wtedy doszło do mnie słowo PANA mówiące:"
"Ez15,2": "Synu człowieczy, w czym jest lepsze drzewo winogronowe od wszelkiego innego drzewa albo od latorośli, która jest wśród drzew leśnych?"
"Ez15,3": "Czy weźmie się z niego drewno do zrobienia czegoś? Czy zrobią z niego kołek do zawieszania na nim jakiegoś naczynia?"
"Ez15,4": "Oto w ogień rzuca się je na spalenie; ogień strawi oba jego końce, a środek jego jest zwęglony. Na co się jeszcze przyda?"
"Ez15,5": "Oto póki było całe, nic nie można było z niego zrobić. Tym bardziej gdy strawił je ogień i spaliło się, na nic się więcej nie przyda."
"Ez15,6": "Dlatego tak mówi Pan BÓG: Jak wśród drzew leśnych jest drzewo winogronowe, które wydałem ogniowi na spalenie, tak też wydam mieszkańców Jerozolimy."
"Ez15,7": "Zwrócę bowiem swoją twarz przeciwko nim; z jednego ognia wyjdą, a drugi ogień ich strawi. I poznacie, że ja jestem PANEM, gdy zwrócę swoją twarz przeciwko nim."
"Ez15,8": "I zamienię ich ziemię w spustoszenie, bo dopuścili się przestępstwa, mówi Pan BÓG."
