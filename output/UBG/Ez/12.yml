"Ez12,1":
  text: "I doszło do mnie słowo PANA mówiące:"
  tags: []
"Ez12,2":
  text: "Synu człowieczy, mieszkasz pośród domu buntowniczego, który ma oczy, aby widzieć, a nie widzi, ma uszy, aby słyszeć, a nie słyszy. Jest bowiem domem buntowniczym."
  tags: []
"Ez12,3":
  text: "Ty więc, synu człowieczy, przygotuj sobie toboły wygnańca i wyprowadź się za dnia na ich oczach; przenieś się na ich oczach ze swego miejsca na inne. Może zrozumieją, chociaż są domem buntowniczym."
  tags: []
"Ez12,4":
  text: "Wyniesiesz swoje rzeczy za dnia na ich oczach, jak toboły wygnańca; wyjdź wieczorem na ich oczach, jak wychodzą wygnańcy."
  tags: []
"Ez12,5":
  text: "Na ich oczach przebij sobie mur i wynieś przez niego swoje rzeczy."
  tags: []
"Ez12,6":
  text: "Na ich oczach podnieś je na ramiona i wynieś o zmierzchu, zakryj sobie twarz i nie patrz na ziemię. Dałem cię bowiem jako znak domowi Izraela."
  tags: []
"Ez12,7":
  text: "I uczyniłem tak, jak mi rozkazano: wyniosłem swoje rzeczy za dnia, jak toboły wygnańca, a wieczorem przebiłem ręką mur; o zmierzchu wyniosłem je, na ramionach niosąc je na ich oczach."
  tags: []
"Ez12,8":
  text: "A rano doszło do mnie słowo PANA mówiące:"
  tags: []
"Ez12,9":
  text: "Synu człowieczy, czy dom Izraela, ten dom buntowniczy, nie zapytał cię: Cóż ty czynisz?"
  tags: []
"Ez12,10":
  text: "Powiedz im: Tak mówi Pan BÓG: To brzemię odnosi się do księcia, który jest w Jerozolimie, i do całego domu Izraela, który tam się znajduje."
  tags: []
"Ez12,11":
  text: "Powiedz im: Ja jestem waszym znakiem. Jak uczyniłem, tak się im stanie: Pójdą na wygnanie, w niewolę."
  tags: []
"Ez12,12":
  text: "A książę, który jest pośród nich, weźmie toboły na ramię o zmierzchu i wyjdzie. Przebiją mur, aby go przez niego przeprowadzić. Zakryje sobie twarz, aby swymi oczami nie widział ziemi."
  tags: []
"Ez12,13":
  text: "Rozciągnę bowiem nad nim swoją sieć i zostanie schwytany w moje sidła. Zaprowadzę go do Babilonu, do ziemi Chaldejczyków, lecz jej nie zobaczy, a tam umrze."
  tags: []
"Ez12,14":
  text: "A wszystkich, którzy go otaczają, by mu pomóc, i wszystkie jego oddziały rozproszę na wszystkie wiatry i miecz na nich dobędę."
  tags: []
"Ez12,15":
  text: "I poznają, że ja jestem PANEM, gdy ich rozproszę między narody i rozrzucę po krajach."
  tags: []
"Ez12,16":
  text: "Zachowam jednak niewielu z nich od miecza, głodu i zarazy, aby opowiadali o wszystkich swoich obrzydliwościach pomiędzy narodami, do których przybędą; i poznają, że ja jestem PANEM."
  tags: []
"Ez12,17":
  text: "I znowu doszło do mnie słowo PANA mówiące:"
  tags: []
"Ez12,18":
  text: "Synu człowieczy, jedz swój chleb w strachu i pij swoją wodę z drżeniem i smutkiem;"
  tags: []
"Ez12,19":
  text: "I powiedz do ludu tej ziemi: Tak mówi Pan BÓG o mieszkańcach Jerozolimy, o ziemi Izraela: Będą jeść swój chleb w smutku i będą pić swą wodę w trwodze, aby ich ziemia była ograbiona ze swoich dostatków z powodu bezprawia wszystkich jej mieszkańców;"
  tags: []
"Ez12,20":
  text: "Także miasta, w których mieszkają, będą spustoszone, a ziemia opustoszeje: I poznacie, że ja jestem PANEM."
  tags: []
"Ez12,21":
  text: "I doszło do mnie słowo PANA mówiące:"
  tags: []
"Ez12,22":
  text: "Synu człowieczy, cóż to jest za przysłowie u was o ziemi Izraela, które brzmi: Dłużą się dni, a każde widzenie zawodzi?"
  tags: []
"Ez12,23":
  text: "Dlatego mów do nich: Tak mówi Pan BÓG: Sprawię, że to przysłowie ustanie i nie będą go więcej powtarzać w Izraelu. Powiedz im: Zbliżają się te dni i spełnienie wszelkiego widzenia."
  tags: []
"Ez12,24":
  text: "Nie będzie już bowiem żadnego marnego widzenia ani pochlebnej wróżby pośród domu Izraela;"
  tags: []
"Ez12,25":
  text: "Gdyż ja, PAN, będę mówić, a słowo, które wypowiem, spełni się i nie ulegnie więcej opóźnieniu. Za waszych dni, domu buntowniczy, wypowiem słowo i wypełnię je, mówi Pan BÓG."
  tags: []
"Ez12,26":
  text: "I doszło do mnie słowo PANA mówiące:"
  tags: []
"Ez12,27":
  text: "Synu człowieczy, oto dom Izraela mówi: To widzenie, które on ma, odnosi się do dni odległych, on prorokuje o czasach dalekich."
  tags: []
"Ez12,28":
  text: "Dlatego powiedz im: Tak mówi Pan BÓG: Żadne z moich słów już się nie opóźni, ale słowo, które wypowiem, spełni się, mówi Pan BÓG."
  tags: []
