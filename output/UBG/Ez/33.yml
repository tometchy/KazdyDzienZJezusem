"Ez33,1":
  text: "I doszło do mnie słowo PANA mówiące:"
  tags: []
"Ez33,2":
  text: "Synu człowieczy, przemów do synów twego ludu i powiedz im: Gdy sprowadzam miecz na jakąś ziemię, a lud tej ziemi weźmie jakiegoś mężczyznę spośród siebie i ustanowi go sobie stróżem;"
  tags: []
"Ez33,3":
  text: "A on, gdy zobaczy nadciągający miecz na tę ziemię, zadmie w trąbę i ostrzeże lud;"
  tags: []
"Ez33,4":
  text: "A ktoś usłyszy dźwięk trąby i nie przyjmie przestrogi, a miecz przyjdzie i zabierze go, to jego krew spadnie na jego własną głowę."
  tags: []
"Ez33,5":
  text: "Dźwięk trąby usłyszał, ale nie przyjął przestrogi, jego krew spadnie na niego. Ten jednak, który przyjmie przestrogę, ocali swoją duszę."
  tags: []
"Ez33,6":
  text: "Ale jeśli stróż zobaczy nadciągający miecz, a nie zadmie w trąbę i ludu nie ostrzeże, a przyjdzie miecz i zabierze kogoś z nich, to ten jest porwany w swojej nieprawości, ale jego krwi zażądam z ręki tego stróża."
  tags: []
"Ez33,7":
  text: "Ciebie, synu człowieczy, ciebie ustanowiłem stróżem dla domu Izraela. Gdy usłyszysz słowo z moich ust, ostrzeżesz go ode mnie."
  tags: []
"Ez33,8":
  text: "Gdy mówię do bezbożnego: Bezbożniku, na pewno umrzesz – a ty mu tego nie powiesz, aby przestrzec bezbożnika przed jego drogą, to ten bezbożnik umrze z powodu swojej nieprawości; ale jego krwi zażądam z twojej ręki."
  tags: []
"Ez33,9":
  text: "Jeśli jednak ostrzeżesz bezbożnego przed jego drogą, aby odwrócił się od niej, a on się nie odwróci od swojej drogi, to umrze on z powodu swojej nieprawości; ale ty ocalisz swoją duszę."
  tags: []
"Ez33,10":
  text: "Ty więc, synu człowieczy, mów do domu Izraela: Tak mówicie: Skoro ciążą na nas nasze występki i nasze grzechy, tak że w nich marniejemy, to jakże możemy żyć?"
  tags: []
"Ez33,11":
  text: "Powiedz im: Jak żyję, mówi Pan BÓG: Nie pragnę śmierci bezbożnego, ale aby bezbożny odwrócił się od swojej drogi i żył. Odwróćcie się, odwróćcie się od swoich złych dróg. Dlaczego macie umrzeć, domu Izraela?"
  tags: []
"Ez33,12":
  text: "Ty więc, synu człowieczy, mów do synów swego ludu: Sprawiedliwość sprawiedliwego nie wybawi go w dniu jego przestępstwa, a bezbożność bezbożnego nie zgubi go w dniu, kiedy się odwróci od swojej bezbożności. Sprawiedliwy nie będzie mógł żyć dzięki swojej sprawiedliwości w dniu, kiedy zgrzeszy."
  tags: []
"Ez33,13":
  text: "Jeśli powiem sprawiedliwemu: Na pewno będziesz żyć, a on, polegając na swojej sprawiedliwości, uczyni nieprawość, to żadna jego sprawiedliwość nie będzie wspomniana, ale umrze z powodu swojej nieprawości, którą uczynił."
  tags: []
"Ez33,14":
  text: "A jeśli powiem bezbożnemu: Na pewno umrzesz, a on odwróci się od swego grzechu i uczyni to, co prawe i sprawiedliwe;"
  tags: []
"Ez33,15":
  text: "Jeśli bezbożny zwróci zastaw, odda to, co wydarł, i będzie chodził według praw życia, nie czyniąc nieprawości, na pewno będzie żył i nie umrze."
  tags: []
"Ez33,16":
  text: "Żadne jego grzechy, które popełnił, nie będą mu wspominane. Czynił to, co prawe i sprawiedliwe; na pewno będzie żył."
  tags: []
"Ez33,17":
  text: "Lecz synowie twego ludu mówią: Droga Pana nie jest słuszna, choć to ich droga nie jest słuszna."
  tags: []
"Ez33,18":
  text: "Jeśli sprawiedliwy odwróci się od swojej sprawiedliwości i będzie czynił nieprawość, to umrze z jej powodu."
  tags: []
"Ez33,19":
  text: "Ale jeśli bezbożny odwróci się od swojej bezbożności i będzie czynił to, co prawe i sprawiedliwe, to dzięki temu będzie żył."
  tags: []
"Ez33,20":
  text: "Wy jednak mówicie: Droga Pana nie jest słuszna. Domu Izraela, będę sądził każdego z was według jego drogi."
  tags: []
"Ez33,21":
  text: "I stało się w dwunastym roku naszego uprowadzenia, w dziesiątym miesiącu, piątego dnia tego miesiąca, że przyszedł do mnie jeden zbieg z Jerozolimy, mówiąc: Zdobyto miasto."
  tags: []
"Ez33,22":
  text: "A ręka PANA była nade mną wieczorem, zanim przyszedł ten zbieg, i otworzyła moje usta, aż ten przyszedł do mnie rano. Otworzyła moje usta i nie byłem już niemy."
  tags: []
"Ez33,23":
  text: "I doszło do mnie słowo PANA mówiące:"
  tags: []
"Ez33,24":
  text: "Synu człowieczy, mieszkańcy tych spustoszonych miejsc w ziemi Izraela mówią: Abraham był jeden i wziął ziemię w posiadanie. Ale nas jest wielu, nam więc dana jest ta ziemia w posiadanie."
  tags: []
"Ez33,25":
  text: "Dlatego mów do nich: Tak mówi Pan BÓG: Jadacie z krwią, podnosicie swe oczy ku swoim bożkom i przelewacie krew, a ziemię chcielibyście wziąć w posiadanie?"
  tags: []
"Ez33,26":
  text: "Opieracie się na swoim mieczu, popełniacie obrzydliwość i każdy plugawi żonę swego bliźniego, a ziemię chcielibyście wziąć w posiadanie?"
  tags: []
"Ez33,27":
  text: "Tak im powiedz: Tak mówi Pan BÓG: Jak żyję, ci, którzy są w spustoszonych miejscach, polegną od miecza, a kto jest na otwartym polu, tego wydam zwierzętom na pożarcie, a ci, którzy są w warowniach lub w jaskiniach, umrą od zarazy."
  tags: []
"Ez33,28":
  text: "I wydam ziemię na wielkie spustoszenie, i ustanie pycha jej mocy; spustoszeją góry Izraela i nikt przez nie nie będzie przechodził."
  tags: []
"Ez33,29":
  text: "I poznają, że ja jestem PANEM, gdy wydam ich ziemię na wielkie spustoszenie z powodu wszystkich ich obrzydliwości, które czynili."
  tags: []
"Ez33,30":
  text: "Ale co do ciebie, synu człowieczy, synowie twego ludu często rozmawiają o tobie przy murach i w drzwiach domów, i mówi jeden do drugiego, każdy do swego bliźniego: Chodźcie i posłuchajcie, co za słowo wyszło od PANA."
  tags: []
"Ez33,31":
  text: "I przychodzą do ciebie, jak zwykł przychodzić lud, zasiadają przed tobą jak mój lud i słuchają twoich słów, ale ich nie wypełniają. Mają bowiem miłość na ustach, lecz ich serce podąża za niegodziwym zyskiem."
  tags: []
"Ez33,32":
  text: "A oto jesteś dla nich jak urokliwa pieśń tego, który ma piękny głos i cudownie gra. Słuchają bowiem twoich słów, ale ich nie wykonują."
  tags: []
"Ez33,33":
  text: "Lecz gdy to nadejdzie – oto nadejdzie – wtedy poznają, że prorok był pośród nich."
  tags: []
