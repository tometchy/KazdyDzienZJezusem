"Ez38,1":
  text: "I doszło do mnie słowo PANA mówiące:"
  tags: []
"Ez38,2":
  text: "Synu człowieczy, zwróć swoją twarz przeciwko Gogowi w ziemi Magog, naczelnemu księciu w Meszek i Tubal, i prorokuj przeciw niemu."
  tags: []
"Ez38,3":
  text: "I mów: Tak mówi Pan BÓG: Oto jestem przeciw tobie, Gogu, naczelny księciu w Meszek i Tubal."
  tags: []
"Ez38,4":
  text: "Zawrócę cię i włożę haki w twoje szczęki, i wyprowadzę ciebie i całe twoje wojsko, konie i jeźdźców, wszystkich w pełnym uzbrojeniu, wielki zastęp z tarczami i puklerzami, wszystkich władających mieczem;"
  tags: []
"Ez38,5":
  text: "A z nimi Persów, Etiopczyków i Putejczyków, wszystkich uzbrojonych w tarczę i hełm;"
  tags: []
"Ez38,6":
  text: "Gomer i wszystkie jego oddziały, dom Togarmy z północnych stron i wszystkie jego oddziały, liczne narody z tobą."
  tags: []
"Ez38,7":
  text: "Przygotuj się i bądź gotowy, ty i twoje wszystkie zastępy, które się zebrały u ciebie, i bądź ich stróżem."
  tags: []
"Ez38,8":
  text: "Po wielu dniach zostaniesz nawiedzony, przy końcu lat przybędziesz do ziemi uwolnionej od miecza, której lud został zebrany spośród wielu narodów, na góry Izraela, które były długo spustoszeniem, a będąc wyprowadzeni spośród narodów, oni wszyscy zamieszkają bezpiecznie."
  tags: []
"Ez38,9":
  text: "Wyruszysz i nadciągniesz jak burza, będziesz jak chmura okrywająca ziemię, ty i wszystkie twoje zastępy oraz liczne ludy z tobą."
  tags: []
"Ez38,10":
  text: "Tak mówi Pan BÓG: W tym dniu zrodzą się myśli w twoim sercu i będziesz miał złe zamiary;"
  tags: []
"Ez38,11":
  text: "I powiesz: Wyruszę do ziemi o nieobwarowanych wsiach; napadnę na ludzi spokojnych, którzy mieszkają bezpiecznie, na wszystkich, którzy mieszkają bez murów i nie mają ani rygli, ani bram;"
  tags: []
"Ez38,12":
  text: "Aby zabrać łupy i zagarnąć zdobycze, aby swą rękę położyć na spustoszone miejsca, które znowu zostały zamieszkane, i na lud zgromadzony spośród narodów, który zdobył bydło i dobra, a mieszka w środku ziemi."
  tags: []
"Ez38,13":
  text: "Szeba, Dedan i kupcy Tarszisz oraz wszystkie jego lwięta zapytają cię: Czy przybyłeś, aby zabrać łupy? Czy na zagarnięcie zdobyczy zgromadziłeś swoje zastępy, aby zabrać srebro i złoto, zabierać bydło i dobra, aby zgarnąć wielki łup?"
  tags: []
"Ez38,14":
  text: "Dlatego prorokuj, synu człowieczy, i mów do Goga: Tak mówi Pan BÓG: Czy w dniu, gdy mój lud Izrael będzie mieszkał bezpiecznie, nie będziesz o tym wiedział?"
  tags: []
"Ez38,15":
  text: "I przyjdziesz ze swego miejsca z północnych stron, ty i liczne ludy z tobą, wszyscy jadący na koniach, wielki zastęp i liczne wojsko;"
  tags: []
"Ez38,16":
  text: "I nadciągniesz przeciwko mojemu ludowi Izraelowi jak chmura, by okryć tę ziemię. W dniach ostatecznych przyprowadzę cię do swojej ziemi, aby poznały mnie narody, gdy będę uświęcony w tobie, Gogu, na ich oczach."
  tags: []
"Ez38,17":
  text: "Tak mówi Pan BÓG: Czyż ty nie jesteś tym, o którym mówiłem w dawnych dniach przez moje sługi, proroków Izraela, którzy prorokowali za dni tamtych lat, że ja sprowadzę cię na nich?"
  tags: []
"Ez38,18":
  text: "Ale w dniu, w którym Gog nadciągnie przeciwko ziemi Izraela, mówi Pan BÓG, wzmoże się zapalczywość mego gniewu;"
  tags: []
"Ez38,19":
  text: "Powiedziałem bowiem w swojej gorliwości i w ogniu swojego gniewu: Zaprawdę, w tym dniu będzie wielkie trzęsienie w ziemi Izraela;"
  tags: []
"Ez38,20":
  text: "I zadrżą przede mną ryby morskie i ptactwo niebieskie, zwierzęta polne i wszelkie zwierzęta pełzające po ziemi, a także wszyscy ludzie, którzy są na powierzchni ziemi; rozpadną się góry, upadną wysokie wieże i każdy mur runie na ziemię."
  tags: []
"Ez38,21":
  text: "Przywołam miecz przeciwko niemu po wszystkich moich górach, mówi Pan BÓG. Miecz każdego zwróci się przeciwko swemu bratu."
  tags: []
"Ez38,22":
  text: "I osądzę go zarazą i krwią, ześlę ulewny deszcz i kamienie gradu, ogień i siarkę – na niego, na jego wojska i na liczne ludy, które z nim będą."
  tags: []
"Ez38,23":
  text: "Okażę się wielki i święty i dam się poznać na oczach wielu narodów, i poznają, że ja jestem PANEM."
  tags: []
