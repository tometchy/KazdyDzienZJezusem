"Ez9,1":
  text: "Potem zawołał donośnym głosem do moich uszu, mówiąc: Zbliżcie się straże miasta, każda z niszczycielską bronią w ręku."
  tags: []
"Ez9,2":
  text: "A oto sześciu mężów przyszło drogą od górnej bramy, która jest zwrócona ku północy, i każdy z nich miał w ręku niszczycielską broń. Jeden mąż wśród nich był ubrany w lnianą szatę, z kałamarzem pisarskim u boku. Weszli i stanęli obok ołtarza z brązu."
  tags: []
"Ez9,3":
  text: "A chwała Boga Izraela uniosła się znad cherubina, na którym spoczywała, i sięgnęła do progu świątyni. Potem zawołał na tego męża ubranego w lnianą szatę, który miał kałamarz pisarski u boku;"
  tags: []
"Ez9,4":
  text: "PAN powiedział do niego: Przejdź przez środek miasta, przez środek Jerozolimy, i uczyń znak na czołach mężczyzn, którzy wzdychają i lamentują nad wszystkimi obrzydliwościami, jakie popełnia się pośród niej."
  tags: []
"Ez9,5":
  text: "A słyszałem, że tamtym powiedział tak: Idźcie za nim przez miasto i zabijajcie. Niech wasze oko nie oszczędzi nikogo i nie zlituje się nad nikim."
  tags: []
"Ez9,6":
  text: "Wybijcie do szczętu starców i młodzieńców, panny, dzieci i kobiety, ale nie przystępujcie do nikogo, na którym będzie ten znak. Rozpocznijcie od mojej świątyni. Zaczęli więc od starszych, którzy byli przed domem."
  tags: []
"Ez9,7":
  text: "Powiedział im: Splugawcie ten dom i napełnijcie dziedziniec zabitymi. Idźcie. Wyszli więc i zabijali w mieście."
  tags: []
"Ez9,8":
  text: "A gdy ich zabijali, a ja pozostałem, wtedy padłem na twarz i zawołałem: Ach, Panie BOŻE! Czy wytracisz całą resztkę Izraela, wylewając swoją zapalczywość na Jerozolimę?"
  tags: []
"Ez9,9":
  text: "Odpowiedział mi: Nieprawość domu Izraela i Judy jest niezmiernie wielka, ziemia jest pełna krwi i miasto pełne przewrotności. Mówią bowiem: PAN opuścił tę ziemię, PAN nas nie widzi."
  tags: []
"Ez9,10":
  text: "A więc ja to uczynię, moje oko nie oszczędzi nikogo i nie zlituję się nad nikim, złożę im na głowę ich własne postępowanie."
  tags: []
"Ez9,11":
  text: "A oto ten mąż odziany w lnianą szatę, który miał kałamarz u boku, oznajmił: Uczyniłem tak, jak mi rozkazałeś."
  tags: []
