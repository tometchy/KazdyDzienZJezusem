"Ez9,1": "Potem zawołał donośnym głosem do moich uszu, mówiąc: Zbliżcie się straże miasta, każda z niszczycielską bronią w ręku."
"Ez9,2": "A oto sześciu mężów przyszło drogą od górnej bramy, która jest zwrócona ku północy, i każdy z nich miał w ręku niszczycielską broń. Jeden mąż wśród nich był ubrany w lnianą szatę, z kałamarzem pisarskim u boku. Weszli i stanęli obok ołtarza z brązu."
"Ez9,3": "A chwała Boga Izraela uniosła się znad cherubina, na którym spoczywała, i sięgnęła do progu świątyni. Potem zawołał na tego męża ubranego w lnianą szatę, który miał kałamarz pisarski u boku;"
"Ez9,4": "PAN powiedział do niego: Przejdź przez środek miasta, przez środek Jerozolimy, i uczyń znak na czołach mężczyzn, którzy wzdychają i lamentują nad wszystkimi obrzydliwościami, jakie popełnia się pośród niej."
"Ez9,5": "A słyszałem, że tamtym powiedział tak: Idźcie za nim przez miasto i zabijajcie. Niech wasze oko nie oszczędzi nikogo i nie zlituje się nad nikim."
"Ez9,6": "Wybijcie do szczętu starców i młodzieńców, panny, dzieci i kobiety, ale nie przystępujcie do nikogo, na którym będzie ten znak. Rozpocznijcie od mojej świątyni. Zaczęli więc od starszych, którzy byli przed domem."
"Ez9,7": "Powiedział im: Splugawcie ten dom i napełnijcie dziedziniec zabitymi. Idźcie. Wyszli więc i zabijali w mieście."
"Ez9,8": "A gdy ich zabijali, a ja pozostałem, wtedy padłem na twarz i zawołałem: Ach, Panie BOŻE! Czy wytracisz całą resztkę Izraela, wylewając swoją zapalczywość na Jerozolimę?"
"Ez9,9": "Odpowiedział mi: Nieprawość domu Izraela i Judy jest niezmiernie wielka, ziemia jest pełna krwi i miasto pełne przewrotności. Mówią bowiem: PAN opuścił tę ziemię, PAN nas nie widzi."
"Ez9,10": "A więc ja to uczynię, moje oko nie oszczędzi nikogo i nie zlituję się nad nikim, złożę im na głowę ich własne postępowanie."
"Ez9,11": "A oto ten mąż odziany w lnianą szatę, który miał kałamarz u boku, oznajmił: Uczyniłem tak, jak mi rozkazałeś."
