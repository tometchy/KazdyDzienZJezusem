"Ez47,1":
  text: "Potem zaprowadził mnie do wejścia domu, a oto wody wypływały spod progu domu w kierunku wschodnim, gdyż przednia strona domu była zwrócona ku wschodowi, a wody spływały spod prawej strony domu ku południowej stronie od ołtarza."
  tags: []
"Ez47,2":
  text: "Stamtąd wyprowadził mnie przez bramę północną i poprowadził mnie drogą zewnętrzną do bramy zewnętrznej, drogą wschodnią; a oto wody wypływały z prawej strony."
  tags: []
"Ez47,3":
  text: "A gdy ten mąż ze sznurem w ręku wyszedł w kierunku wschodnim, odmierzył tysiąc łokci i przeprowadził mnie przez wodę, a woda sięgała aż do kostek."
  tags: []
"Ez47,4":
  text: "Potem odmierzył drugi tysiąc i przeprowadził mnie przez wodę, a woda sięgała aż do kolan; i znów odmierzył tysiąc i przeprowadził mnie przez wodę, a ta sięgała aż do bioder."
  tags: []
"Ez47,5":
  text: "A gdy znowu odmierzył tysiąc, była rzeka, której nie mogłem przebrnąć, gdyż woda wezbrała. Była to woda, którą trzeba było przepłynąć, i rzeka, której nie mogłem przejść."
  tags: []
"Ez47,6":
  text: "Wtedy powiedział do mnie: Czy widziałeś to, synu człowieczy? Potem poprowadził mnie i zaprowadził na brzeg tej rzeki."
  tags: []
"Ez47,7":
  text: "A gdy się odwróciłem, oto na brzegu tej rzeki było bardzo wiele drzew po obu stronach;"
  tags: []
"Ez47,8":
  text: "I powiedział do mnie: Te wody wypływają ku krainie wschodniej, schodzą do równin i wpadają do morza. A gdy wpadają do morza, wody zostają uzdrowione."
  tags: []
"Ez47,9":
  text: "I stanie się, że każda istota żyjąca, która się porusza, gdziekolwiek popłyną potoki, będzie żyć. I będzie bardzo dużo ryb, bo dotrą tam wody i zostaną uzdrowione. Wszystko będzie żyć, dokądkolwiek dotrze potok."
  tags: []
"Ez47,10":
  text: "Stanie się i to, że rybacy staną nad nim od En-Gedi aż do zdroju Eglaim; tam będą rozciągać sieci; będzie bardzo dużo ryb rozmaitego rodzaju, będą jak ryby wielkiego morza."
  tags: []
"Ez47,11":
  text: "Lecz jego błota i bajora nie będą uzdrowione, ale będą przeznaczone na sól."
  tags: []
"Ez47,12":
  text: "A nad rzeką wyrosną na jego brzegu po obu stronach wszelkie drzewa wydające owoce, drzewa, których liść nie więdnie ani owoc nie ustaje. W swoich miesiącach wydadzą pierwociny, bo wody dla nich wypływają ze świątyni. Dlatego ich owoc będzie na pokarm, a ich liście na lekarstwo."
  tags: []
"Ez47,13":
  text: "Tak mówi Pan BÓG: To jest granica, według której podzielicie ziemię w dziedzictwo według dwunastu pokoleń Izraela: Józef będzie miał dwie części."
  tags: []
"Ez47,14":
  text: "Posiądziecie ją dziedzicznie, po równo jedno pokolenie, jak i drugie – ziemię, którą przysiągłem dać waszym ojcom. I ta ziemia przypadnie wam w dziedzictwo."
  tags: []
"Ez47,15":
  text: "To jest więc granica tej ziemi od strony północnej: od Wielkiego Morza, w kierunku Chetlon, idąc do Sedada."
  tags: []
"Ez47,16":
  text: "Chamat, Berota, Sibraim, które są pomiędzy granicą Damaszku a granicą Chamat, Chasar-Hattikon, które jest przy granicy Chauranu."
  tags: []
"Ez47,17":
  text: "Granicą od morza będzie Chasar-Enan, granica Damaszku i północna strona na północy, i granica Chamat. To jest strona północna."
  tags: []
"Ez47,18":
  text: "A strona wschodnia: między Chauran i między Damaszkiem, między Gileadem i między ziemią Izraela przy Jordanie. Będziecie mierzyć od tej granicy przy Morzu Wschodnim. To jest strona wschodnia."
  tags: []
"Ez47,19":
  text: "A strona południowa na południu: od Tamar aż do wód sporu w Kadesz, od rzeki aż do Wielkiego Morza. To jest strona południowa na południu."
  tags: []
"Ez47,20":
  text: "Strona zaś zachodnia: Wielkie Morze od granicy aż do miejsca, skąd idzie się do Chamat. To jest strona zachodnia."
  tags: []
"Ez47,21":
  text: "A tak podzielicie sobie tę ziemię według pokoleń Izraela."
  tags: []
"Ez47,22":
  text: "A gdy ją podzielicie, przypadnie ona w dziedzictwo wam i cudzoziemcom, którzy przebywają wśród was, którzy zrodzą synów wśród was. Będą dla was jak zrodzeni w ziemi pośród synów Izraela. Z wami będą mieli dziedzictwo pośród pokoleń Izraela."
  tags: []
"Ez47,23":
  text: "A w którymkolwiek pokoleniu cudzoziemiec będzie przebywał, tam mu dacie jego dziedzictwo – mówi Pan BÓG."
  tags: []
