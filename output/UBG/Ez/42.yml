"Ez42,1":
  text: "I wyprowadził mnie na dziedziniec zewnętrzny w kierunku północy, i wprowadził mnie do tych komórek, które stały naprzeciwko obszaru wyznaczonego i naprzeciwko budowli, od strony północy."
  tags: []
"Ez42,2":
  text: "Ich długość od strony północnych drzwi wynosiła sto łokci, a ich szerokość pięćdziesiąt łokci."
  tags: []
"Ez42,3":
  text: "Naprzeciw dziedzińca wewnętrznego, który miał dwadzieścia łokci, i naprzeciw posadzki dziedzińca zewnętrznego, były krużganki naprzeciw krużganków na trzech poziomach."
  tags: []
"Ez42,4":
  text: "A przed komórkami było przejście szerokie na dziesięć łokci wewnątrz i ścieżka do nich na jeden łokieć, a ich drzwi były od północy."
  tags: []
"Ez42,5":
  text: "A górne komórki były węższe, ponieważ ich krużganki były szersze od tych w dolnej i środkowej części budowli."
  tags: []
"Ez42,6":
  text: "Były bowiem trzypiętrowe, ale nie miały słupów jak słupy dziedzińców. Dlatego były węższe niż dolne i środkowe, począwszy od ziemi."
  tags: []
"Ez42,7":
  text: "A mur, który był na zewnątrz naprzeciw tych komórek w kierunku dziedzińca zewnętrznego przed komórkami, miał pięćdziesiąt łokci długości."
  tags: []
"Ez42,8":
  text: "Długość bowiem komórek, które były na dziedzińcu zewnętrznym, wynosiła pięćdziesiąt łokci, a tych przed świątynią – sto łokci."
  tags: []
"Ez42,9":
  text: "A poniżej tych komórek było wejście od wschodu, przez które wchodzi się do nich z dziedzińca zewnętrznego."
  tags: []
"Ez42,10":
  text: "Na szerokości muru dziedzińca od strony wschodniej naprzeciw obszaru wyznaczonego i naprzeciw budowli były także komórki."
  tags: []
"Ez42,11":
  text: "A ścieżka przed nimi była taka sama jak ścieżka tamtych komórek, które znajdowały się po stronie północnej: miały taką samą długość i taką samą szerokość. Takie same były ich wyjścia, ich drzwi oraz ich układ."
  tags: []
"Ez42,12":
  text: "A drzwi do tych komórek, które były po stronie południowej, były podobne do drzwi na początku przejścia, właśnie tego przejścia przed murem w stronę wschodu, którędy się do nich wchodzi."
  tags: []
"Ez42,13":
  text: "Wtedy powiedział do mnie: Komórki północne i komórki południowe, które są przed obszarem wyznaczonym, to komórki święte, gdzie kapłani, którzy zbliżają się do PANA, będą jadali najświętsze rzeczy. Tam będą kłaść rzeczy najświętsze, ofiary z pokarmów, ofiary za grzech i ofiary za przewinienie. Jest to bowiem miejsce święte."
  tags: []
"Ez42,14":
  text: "Gdy kapłani wejdą tam, nie wyjdą ze świątyni na dziedziniec zewnętrzny, ale tam złożą swoje szaty, w których służyli, bo są święte. I założą inne szaty, i wtedy będą mogli zbliżyć się do tego, co należy do ludu."
  tags: []
"Ez42,15":
  text: "A gdy ukończył mierzenie domu wewnętrznego, wyprowadził mnie w stronę bramy, która była zwrócona na wschód, i zmierzył zewsząd dokoła."
  tags: []
"Ez42,16":
  text: "Prętem mierniczym zmierzył stronę wschodnią – pięćset prętów wokoło według pręta mierniczego."
  tags: []
"Ez42,17":
  text: "Zmierzył także stronę północną – pięćset prętów wokoło według pręta mierniczego."
  tags: []
"Ez42,18":
  text: "I zmierzył stronę południową – pięćset prętów mierniczych."
  tags: []
"Ez42,19":
  text: "Potem obrócił się na stronę zachodnią i zmierzył – pięćset prętów według pręta mierniczego."
  tags: []
"Ez42,20":
  text: "Zmierzył po czterech stronach mur zewsząd dokoła: długi na pięćset prętów i szeroki na pięćset prętów, aby oddzielić miejsce święte od pospolitego."
  tags: []
