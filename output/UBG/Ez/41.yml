"Ez41,1":
  text: "Potem wprowadził mnie do świątyni i zmierzył filary: sześć łokci wynosiła szerokość z jednej strony i sześć łokci szerokość z drugiej strony, według szerokości przybytku."
  tags: []
"Ez41,2":
  text: "A szerokość drzwi wynosiła dziesięć łokci, a boczne ściany wejścia miały pięć łokci z jednej i pięć łokci z drugiej strony. I zmierzył jej długość: czterdzieści łokci, a jej szerokość: dwadzieścia łokci."
  tags: []
"Ez41,3":
  text: "Następnie wszedł do wnętrza i zmierzył filary przy wejściu – dwa łokcie, drzwi – sześć łokci, a szerokość drzwi – siedem łokci."
  tags: []
"Ez41,4":
  text: "Zmierzył też długość – dwadzieścia łokci, jego szerokość – dwadzieścia łokci, odpowiednio do świątyni. I powiedział do mnie: To jest Miejsce Najświętsze."
  tags: []
"Ez41,5":
  text: "Potem zmierzył mur domu – sześć łokci, a szerokość każdej bocznej komory – cztery łokcie wokół całego domu."
  tags: []
"Ez41,6":
  text: "Boczne komory znajdowały się na trzech poziomach, jedna nad drugą, w liczbie trzydziestu. Wchodziły one w mur otaczający dom, aby komory na nim się opierały, ale nie opierały się na murze domu."
  tags: []
"Ez41,7":
  text: "I rozszerzały się boczne komory dokoła domu, odpowiednio do wzrastającej wysokości, gdyż mur dokoła domu tracił na grubości. Dlatego szerokość domu wzrastała od najniższych komór do najwyższych, do których się wchodziło schodami poprzez te środkowe."
  tags: []
"Ez41,8":
  text: "Widziałem też wysokość domu dokoła i fundament tych komór, a miał pełny pręt – sześć łokci."
  tags: []
"Ez41,9":
  text: "Grubość zewnętrznego muru bocznych komór wynosiła pięć łokci, a przed komorami, które były przy domu, pozostała wolna przestrzeń."
  tags: []
"Ez41,10":
  text: "A między komorami i komórkami odległość wynosiła dwadzieścia łokci wszędzie wokół domu."
  tags: []
"Ez41,11":
  text: "A drzwi bocznych komór wychodziły na wolną przestrzeń, jedne drzwi na północ, a drugie na południe. Szerokość tej wolnej przestrzeni wynosiła pięć łokci wszędzie dokoła."
  tags: []
"Ez41,12":
  text: "A budowla, która była poza obszarem wyznaczonym na stronie zachodniej, miała szerokość siedemdziesięciu łokci, mur tej budowli miał grubość pięciu łokci wszędzie wokoło i jej długość wynosiła dziewięćdziesiąt łokci."
  tags: []
"Ez41,13":
  text: "Potem zmierzył dom – miał długość stu łokci; a obszar wyznaczony, budowla i jej mury miały długość stu łokci;"
  tags: []
"Ez41,14":
  text: "Także szerokość fasady domu oraz obszaru wyznaczonego od strony wschodniej wynosiła sto łokci."
  tags: []
"Ez41,15":
  text: "Zmierzył też długość budowli przed obszarem wyznaczonym, która była za nim, także i jej krużganki z jednej i z drugiej strony, i wynosiła sto łokci, a tak samo było z wewnętrzną świątynią wraz z przedsionkami dziedzińca."
  tags: []
"Ez41,16":
  text: "Progi, wąskie okna, krużganki wokoło trzech stron naprzeciwko progu pokryte były deskami dokoła, od ziemi aż do okien, a okna były pokryte deskami;"
  tags: []
"Ez41,17":
  text: "Od wierzchu drzwi aż do wewnętrznej i zewnętrznej strony domu, i cały mur wszędzie dokoła, wewnątrz i zewnątrz, dobrze wymierzony."
  tags: []
"Ez41,18":
  text: "Tak oto były wykonane cherubiny i palmy: każda palma była między dwoma cherubinami, a każdy cherubin miał dwie twarze;"
  tags: []
"Ez41,19":
  text: "Twarz ludzka była zwrócona w stronę palmy z jednej strony, a twarz młodego lwa zwrócona w stronę palmy z drugiej strony. Tak wykonano to w całym domu wszędzie wokoło."
  tags: []
"Ez41,20":
  text: "Od ziemi aż ponad wejście były wyrzeźbione cherubiny i palmy, także na ścianie świątyni."
  tags: []
"Ez41,21":
  text: "Filary świątyni były czworokątne, a wygląd Miejsca Najświętszego był jak wygląd świątyni."
  tags: []
"Ez41,22":
  text: "Ołtarz drewniany był wysoki na trzy łokcie i szeroki na dwa łokcie; jego rogi, jego podstawa i jego ściany były z drewna. Wtedy powiedział do mnie: To jest stół, który stoi przed PANEM."
  tags: []
"Ez41,23":
  text: "A świątynia i Miejsce Najświętsze miały podwójne drzwi."
  tags: []
"Ez41,24":
  text: "A drzwi były dwuskrzydłowe, miały dwa skrzydła obrotowe; dwa skrzydła miały jedne drzwi i dwa miały drugie."
  tags: []
"Ez41,25":
  text: "A wykonano na nich, na tych drzwiach świątyni, cherubiny i palmy, tak jak wykonano je na ścianach; były także drewniane belki nad przedsionkiem na zewnątrz."
  tags: []
"Ez41,26":
  text: "Na wąskich oknach były palmy po obu stronach, na bokach przedsionka, także na bocznych komorach domu i na belkach."
  tags: []
