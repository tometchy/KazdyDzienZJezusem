"Ez48,1": "A oto imiona pokoleń: Na północnym krańcu wzdłuż drogi Chetlon, w kierunku Chamat, Chasar-Enan, do granicy Damaszku na północy i aż do Chamat, od strony wschodniej aż na zachód, jeden dział dla Dana."
"Ez48,2": "A obok granicy Dana, od strony wschodniej aż do strony zachodniej, jeden dział dla Aszera."
"Ez48,3": "A obok granicy Aszera, od strony wschodniej aż do strony zachodniej, jeden dział dla Neftalego."
"Ez48,4": "A obok granicy Neftalego, od strony wschodniej aż do strony zachodniej, jeden dział dla Manassesa."
"Ez48,5": "A obok granicy Manassesa, od strony wschodniej aż do strony zachodniej, jeden dział dla Efraima."
"Ez48,6": "A obok granicy Efraima, od strony wschodniej aż do strony zachodniej, jeden dział dla Rubena."
"Ez48,7": "A obok granicy Rubena, od strony wschodniej aż do strony zachodniej, jeden dział dla Judy."
"Ez48,8": "A obok granicy Judy, od strony wschodniej aż do strony zachodniej, będzie święty dział, szeroki na dwadzieścia pięć tysięcy prętów i długi jak każdy z pozostałych działów od strony wschodniej do strony zachodniej, a w jego środku będzie świątynia."
"Ez48,9": "Ten dział, który macie ofiarować PANU, będzie długi na dwadzieścia pięć tysięcy prętów i szeroki na dziesięć tysięcy."
"Ez48,10": "Do nich, to jest kapłanów, będzie należał ten święty dział: na północy dwadzieścia pięć tysięcy prętów, na zachodzie dziesięć tysięcy szerokości, na wschodzie dziesięć tysięcy szerokości i na południe dwadzieścia pięć tysięcy długości. W jego środku będzie świątynia PANA."
"Ez48,11": "To ma być dla uświęconych kapłanów spośród synów Sadoka, którzy pełnili moją służbę i nie błądzili, gdy błądzili synowie Izraela, jak błądzili inni Lewici."
"Ez48,12": "I ten święty dział z ofiar tej ziemi będzie rzeczą najświętszą obok granicy Lewitów."
"Ez48,13": "Obok granicy kapłanów będzie dział Lewitów o długości dwudziestu pięciu tysięcy prętów i o szerokości dziesięciu tysięcy. Cała długość będzie wynosiła dwadzieścia pięć tysięcy, a szerokość dziesięć tysięcy."
"Ez48,14": "I nie będą mogli go sprzedać ani zamienić, ani pierwocin ziemi przekazać innym, gdyż jest poświęcony PANU."
"Ez48,15": "A pięć tysięcy prętów, które pozostaną z szerokości wzdłuż dwudziestu pięciu tysięcy, stanowi miejsce pospolite na miasto, na zamieszkanie i na pastwiska. A miasto będzie w jego środku."
"Ez48,16": "Oto jego wymiary: strona północna – cztery tysiące pięćset prętów, strona południowa – cztery tysiące pięćset, strona wschodnia – cztery tysiące pięćset i strona zachodnia – cztery tysiące pięćset."
"Ez48,17": "Pastwiska miasta na północ – dwieście pięćdziesiąt prętów, na południe – dwieście pięćdziesiąt, na wschód – dwieście pięćdziesiąt i na zachód – dwieście pięćdziesiąt."
"Ez48,18": "To, co pozostanie wzdłuż świętego działu, będzie mieć dziesięć tysięcy prętów na wschód i dziesięć tysięcy na zachód. Będzie to wzdłuż świętego działu, a plony tego miejsca będą na utrzymanie sług miasta."
"Ez48,19": "A ci, co służą miastu, będą sługami spośród wszystkich pokoleń Izraela."
"Ez48,20": "Cały ten święty dział będzie wynosił dwadzieścia pięć tysięcy prętów na dwadzieścia pięć tysięcy. Ofiarujecie kwadrat świętego działu wraz z posiadłością miasta."
"Ez48,21": "To, co pozostanie, będzie dla księcia z obu stron świętego działu i posiadłości miasta, wzdłuż dwudziestu pięciu tysięcy prętów ofiary aż do granicy wschodniej i na zachód wzdłuż dwudziestu pięciu tysięcy prętów do granicy zachodniej, wzdłuż innych działów, będzie to dla księcia. A będzie to święty dział, a świątynia domu będzie w jego środku."
"Ez48,22": "A od posiadłości Lewitów i od posiadłości miasta, które będą w środku tego, co należy do księcia, pomiędzy granicą Judy i granicą Beniamina, będzie to należało do księcia."
"Ez48,23": "Pozostałe pokolenia, od strony wschodniej aż do strony zachodniej: jeden dział dla Beniamina."
"Ez48,24": "Obok granicy Beniamina, od strony wschodniej aż do strony zachodniej, jeden dział dla Symeona."
"Ez48,25": "Obok granicy Symeona, od strony wschodniej aż do strony zachodniej, jeden dział dla Issachara."
"Ez48,26": "Obok granicy Issachara, od strony wschodniej aż do strony zachodniej, jeden dział dla Zebulona."
"Ez48,27": "Obok granicy Zebulona, od strony wschodniej aż do strony zachodniej, jeden dział dla Gada."
"Ez48,28": "Obok granicy Gada, po stronie południowej na południe, granica będzie od Tamar aż do wód sporu w Kadesz, w stronę rzeki do Wielkiego Morza."
"Ez48,29": "To jest ziemia, którą podzielicie przez losowanie między pokolenia Izraela, i to są działy, mówi Pan BÓG."
"Ez48,30": "To też są wyjścia z miasta: od strony północnej – cztery tysiące pięćset prętów."
"Ez48,31": "A bramy miasta będą nazwane według imion pokoleń Izraela. Trzy bramy na północy: brama Rubena jedna, brama Judy jedna i brama Lewiego jedna."
"Ez48,32": "Od strony wschodniej – cztery tysiące pięćset, a bramy trzy: brama Józefa jedna, brama Beniamina jedna i brama Dana jedna."
"Ez48,33": "Od strony południowej – cztery tysiące pięćset prętów, a bramy trzy: brama Symeona jedna, brama Issachara jedna i brama Zebulona jedna."
"Ez48,34": "Od strony zachodniej – cztery tysiące pięćset, a bramy trzy: Brama Gada jedna, brama Aszera jedna i brama Neftalego jedna."
"Ez48,35": "Wokoło osiemnaście tysięcy prętów. A imię miasta od tego dnia będzie: PAN tam mieszka."
