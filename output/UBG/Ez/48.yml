"Ez48,1":
  text: "A oto imiona pokoleń: Na północnym krańcu wzdłuż drogi Chetlon, w kierunku Chamat, Chasar-Enan, do granicy Damaszku na północy i aż do Chamat, od strony wschodniej aż na zachód, jeden dział dla Dana."
  tags: []
"Ez48,2":
  text: "A obok granicy Dana, od strony wschodniej aż do strony zachodniej, jeden dział dla Aszera."
  tags: []
"Ez48,3":
  text: "A obok granicy Aszera, od strony wschodniej aż do strony zachodniej, jeden dział dla Neftalego."
  tags: []
"Ez48,4":
  text: "A obok granicy Neftalego, od strony wschodniej aż do strony zachodniej, jeden dział dla Manassesa."
  tags: []
"Ez48,5":
  text: "A obok granicy Manassesa, od strony wschodniej aż do strony zachodniej, jeden dział dla Efraima."
  tags: []
"Ez48,6":
  text: "A obok granicy Efraima, od strony wschodniej aż do strony zachodniej, jeden dział dla Rubena."
  tags: []
"Ez48,7":
  text: "A obok granicy Rubena, od strony wschodniej aż do strony zachodniej, jeden dział dla Judy."
  tags: []
"Ez48,8":
  text: "A obok granicy Judy, od strony wschodniej aż do strony zachodniej, będzie święty dział, szeroki na dwadzieścia pięć tysięcy prętów i długi jak każdy z pozostałych działów od strony wschodniej do strony zachodniej, a w jego środku będzie świątynia."
  tags: []
"Ez48,9":
  text: "Ten dział, który macie ofiarować PANU, będzie długi na dwadzieścia pięć tysięcy prętów i szeroki na dziesięć tysięcy."
  tags: []
"Ez48,10":
  text: "Do nich, to jest kapłanów, będzie należał ten święty dział: na północy dwadzieścia pięć tysięcy prętów, na zachodzie dziesięć tysięcy szerokości, na wschodzie dziesięć tysięcy szerokości i na południe dwadzieścia pięć tysięcy długości. W jego środku będzie świątynia PANA."
  tags: []
"Ez48,11":
  text: "To ma być dla uświęconych kapłanów spośród synów Sadoka, którzy pełnili moją służbę i nie błądzili, gdy błądzili synowie Izraela, jak błądzili inni Lewici."
  tags: []
"Ez48,12":
  text: "I ten święty dział z ofiar tej ziemi będzie rzeczą najświętszą obok granicy Lewitów."
  tags: []
"Ez48,13":
  text: "Obok granicy kapłanów będzie dział Lewitów o długości dwudziestu pięciu tysięcy prętów i o szerokości dziesięciu tysięcy. Cała długość będzie wynosiła dwadzieścia pięć tysięcy, a szerokość dziesięć tysięcy."
  tags: []
"Ez48,14":
  text: "I nie będą mogli go sprzedać ani zamienić, ani pierwocin ziemi przekazać innym, gdyż jest poświęcony PANU."
  tags: []
"Ez48,15":
  text: "A pięć tysięcy prętów, które pozostaną z szerokości wzdłuż dwudziestu pięciu tysięcy, stanowi miejsce pospolite na miasto, na zamieszkanie i na pastwiska. A miasto będzie w jego środku."
  tags: []
"Ez48,16":
  text: "Oto jego wymiary: strona północna – cztery tysiące pięćset prętów, strona południowa – cztery tysiące pięćset, strona wschodnia – cztery tysiące pięćset i strona zachodnia – cztery tysiące pięćset."
  tags: []
"Ez48,17":
  text: "Pastwiska miasta na północ – dwieście pięćdziesiąt prętów, na południe – dwieście pięćdziesiąt, na wschód – dwieście pięćdziesiąt i na zachód – dwieście pięćdziesiąt."
  tags: []
"Ez48,18":
  text: "To, co pozostanie wzdłuż świętego działu, będzie mieć dziesięć tysięcy prętów na wschód i dziesięć tysięcy na zachód. Będzie to wzdłuż świętego działu, a plony tego miejsca będą na utrzymanie sług miasta."
  tags: []
"Ez48,19":
  text: "A ci, co służą miastu, będą sługami spośród wszystkich pokoleń Izraela."
  tags: []
"Ez48,20":
  text: "Cały ten święty dział będzie wynosił dwadzieścia pięć tysięcy prętów na dwadzieścia pięć tysięcy. Ofiarujecie kwadrat świętego działu wraz z posiadłością miasta."
  tags: []
"Ez48,21":
  text: "To, co pozostanie, będzie dla księcia z obu stron świętego działu i posiadłości miasta, wzdłuż dwudziestu pięciu tysięcy prętów ofiary aż do granicy wschodniej i na zachód wzdłuż dwudziestu pięciu tysięcy prętów do granicy zachodniej, wzdłuż innych działów, będzie to dla księcia. A będzie to święty dział, a świątynia domu będzie w jego środku."
  tags: []
"Ez48,22":
  text: "A od posiadłości Lewitów i od posiadłości miasta, które będą w środku tego, co należy do księcia, pomiędzy granicą Judy i granicą Beniamina, będzie to należało do księcia."
  tags: []
"Ez48,23":
  text: "Pozostałe pokolenia, od strony wschodniej aż do strony zachodniej: jeden dział dla Beniamina."
  tags: []
"Ez48,24":
  text: "Obok granicy Beniamina, od strony wschodniej aż do strony zachodniej, jeden dział dla Symeona."
  tags: []
"Ez48,25":
  text: "Obok granicy Symeona, od strony wschodniej aż do strony zachodniej, jeden dział dla Issachara."
  tags: []
"Ez48,26":
  text: "Obok granicy Issachara, od strony wschodniej aż do strony zachodniej, jeden dział dla Zebulona."
  tags: []
"Ez48,27":
  text: "Obok granicy Zebulona, od strony wschodniej aż do strony zachodniej, jeden dział dla Gada."
  tags: []
"Ez48,28":
  text: "Obok granicy Gada, po stronie południowej na południe, granica będzie od Tamar aż do wód sporu w Kadesz, w stronę rzeki do Wielkiego Morza."
  tags: []
"Ez48,29":
  text: "To jest ziemia, którą podzielicie przez losowanie między pokolenia Izraela, i to są działy, mówi Pan BÓG."
  tags: []
"Ez48,30":
  text: "To też są wyjścia z miasta: od strony północnej – cztery tysiące pięćset prętów."
  tags: []
"Ez48,31":
  text: "A bramy miasta będą nazwane według imion pokoleń Izraela. Trzy bramy na północy: brama Rubena jedna, brama Judy jedna i brama Lewiego jedna."
  tags: []
"Ez48,32":
  text: "Od strony wschodniej – cztery tysiące pięćset, a bramy trzy: brama Józefa jedna, brama Beniamina jedna i brama Dana jedna."
  tags: []
"Ez48,33":
  text: "Od strony południowej – cztery tysiące pięćset prętów, a bramy trzy: brama Symeona jedna, brama Issachara jedna i brama Zebulona jedna."
  tags: []
"Ez48,34":
  text: "Od strony zachodniej – cztery tysiące pięćset, a bramy trzy: Brama Gada jedna, brama Aszera jedna i brama Neftalego jedna."
  tags: []
"Ez48,35":
  text: "Wokoło osiemnaście tysięcy prętów. A imię miasta od tego dnia będzie: PAN tam mieszka."
  tags: []
