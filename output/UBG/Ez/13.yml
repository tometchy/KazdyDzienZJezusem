"Ez13,1":
  text: "I doszło do mnie słowo PANA mówiące:"
  tags: []
"Ez13,2":
  text: "Synu człowieczy, prorokuj przeciw prorokom Izraela, którzy prorokują, i mów do tych, którzy prorokują z własnego serca: Słuchajcie słowa PANA."
  tags: []
"Ez13,3":
  text: "Tak mówi Pan BÓG: Biada głupim prorokom, którzy idą za swoim duchem, choć nic nie widzieli!"
  tags: []
"Ez13,4":
  text: "Izraelu, twoi prorocy są jak lisy na pustyniach."
  tags: []
"Ez13,5":
  text: "Nie wstąpiliście na wyłomy ani nie uzupełniliście muru wokół domu Izraela, aby mógł ostać się w bitwie w dzień PANA."
  tags: []
"Ez13,6":
  text: "Widzą ułudę i kłamliwe wróżby i mówią: PAN mówi, choć PAN ich nie posłał. I dają nadzieję ludowi, że ich słowo się spełni."
  tags: []
"Ez13,7":
  text: "Czy nie mieliście złudnego widzenia i nie głosiliście kłamliwej wróżby? Mówicie bowiem: PAN mówi, chociaż ja nie mówiłem."
  tags: []
"Ez13,8":
  text: "Dlatego tak mówi Pan BÓG: Ponieważ mówicie rzeczy złudne i widzicie kłamstwo, oto ja jestem przeciwko wam, mówi Pan BÓG."
  tags: []
"Ez13,9":
  text: "I moja ręka będzie przeciwko prorokom, którzy widzą rzeczy złudne i wróżą kłamstwo. Nie będą w zgromadzeniu mego ludu i w poczet domu Izraela nie będą wpisani, i do ziemi Izraela nie wejdą. A poznacie, że ja jestem Pan BÓG."
  tags: []
"Ez13,10":
  text: "Dlatego, właśnie dlatego, że zwodzili mój lud, mówiąc: Pokój, choć nie było pokoju; jeden zbudował glinianą ścianę, a inni tynkowali ją słabym tynkiem."
  tags: []
"Ez13,11":
  text: "Mów do tych, którzy ją tynkują słabym tynkiem: Zawali się. Przyjdzie ulewny deszcz, a wy, wielkie kule gradu, spadniecie, i gwałtowny wiatr ją zburzy."
  tags: []
"Ez13,12":
  text: "A oto gdy ściana runie, czy nie powiedzą wam: Gdzie jest tynk, którym tynkowaliście?"
  tags: []
"Ez13,13":
  text: "Dlatego tak mówi Pan BÓG: W mojej zapalczywości zburzę ją gwałtownym wiatrem; na skutek mojego gniewu przyjdzie ulewny deszcz i na skutek mojego oburzenia przyjdzie wielki grad, by ją zniszczyć."
  tags: []
"Ez13,14":
  text: "I zburzę tę ścianę, którą tynkowaliście słabym tynkiem, zrównam ją z ziemią tak, że jej fundamenty zostaną odsłonięte, i runie, a wy zginiecie pośród niej. I poznacie, że ja jestem PANEM."
  tags: []
"Ez13,15":
  text: "A gdy dopełnię mojego gniewu nad tą ścianą i nad tymi, którzy ją tynkowali słabym tynkiem, powiem do was: Nie ma już tej ściany, nie ma tych, którzy ją tynkowali;"
  tags: []
"Ez13,16":
  text: "To jest proroków Izraela, którzy prorokują o Jerozolimie i mają o niej widzenia pokoju, choć nie ma pokoju, mówi Pan BÓG."
  tags: []
"Ez13,17":
  text: "Ale ty, synu człowieczy, zwróć swą twarz przeciwko córkom swego ludu, które prorokują z własnego serca, i prorokuj przeciwko nim;"
  tags: []
"Ez13,18":
  text: "I mów: Tak mówi Pan BÓG: Biada tym kobietom, które szyją poduszki pod wszystkie łokcie rąk mego ludu i robią nakrycia głowy dla ludzi każdego wzrostu, aby łowić dusze! Czy będziecie łowić dusze mego ludu, aby zachować dusze, które przybędą do was?"
  tags: []
"Ez13,19":
  text: "Bo bezcześcicie mnie wobec mego ludu dla garści jęczmienia i dla kęsa chleba, zabijając dusze, które nie powinny umrzeć, a oszczędzając dusze, które nie powinny żyć – gdy okłamujecie mój lud, który słucha kłamstwa."
  tags: []
"Ez13,20":
  text: "Dlatego tak mówi Pan BÓG: Oto wystąpię przeciwko waszym poduszkom, którymi łowicie dusze, aby je zwieść. Zerwę je z waszych ramion i wypuszczę dusze, które łowicie, aby je zwieść."
  tags: []
"Ez13,21":
  text: "I rozerwę wasze nakrycia, i wybawię swój lud z waszej ręki, aby już nie był łupem w waszym ręku. I poznacie, że ja jestem PANEM."
  tags: []
"Ez13,22":
  text: "Ponieważ zasmucacie kłamstwem serce sprawiedliwego, chociaż ja go nie zasmuciłem, i wzmacniacie ręce bezbożnego, aby się nie odwrócił od swojej złej drogi, ożywiając go;"
  tags: []
"Ez13,23":
  text: "Dlatego nie będziecie już mieć widzeń złudnych i nie będziecie prorokować żadnej wróżby. Wyrwę bowiem swój lud z waszej ręki i poznacie, że ja jestem PANEM."
  tags: []
