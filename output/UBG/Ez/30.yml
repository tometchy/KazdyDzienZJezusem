"Ez30,1": "I doszło do mnie słowo PANA mówiące:"
"Ez30,2": "Synu człowieczy, prorokuj i mów: Tak mówi Pan BÓG: Zawódźcie, mówiąc: Ach, jakiż to dzień!"
"Ez30,3": "Bliski bowiem jest dzień, bliski jest dzień PANA; będzie to dzień pochmurny i czas pogan."
"Ez30,4": "I spadnie miecz na Egipt, i będzie wielka trwoga w Etiopii, gdy polegną zabici w Egipcie, gdy zabiorą jego dostatek i jego fundamenty będą zburzone."
"Ez30,5": "Etiopia, Put i Lud, cała różnorodna ludność, Kub i mieszkańcy sprzymierzonej ziemi padną razem z nimi od miecza."
"Ez30,6": "Tak mówi PAN: Upadną ci, którzy wspierają Egipt, i runie pycha jego mocy. Od wieży Sewene padną w niej od miecza, mówi Pan BÓG."
"Ez30,7": "I będą spustoszeni wśród spustoszonych ziem, a ich miasta znajdą się wśród zburzonych miast."
"Ez30,8": "I poznają, że ja jestem PANEM, gdy rozpalę ogień w Egipcie, i wszyscy jego pomocnicy zostaną skruszeni."
"Ez30,9": "W tym dniu posłańcy wyruszą ode mnie w okrętach na postrach spokojnej ziemi Etiopii; i ogarnie ich wielka trwoga, jaka była w dniu porażki Egiptu. Oto bowiem nadchodzi."
"Ez30,10": "Tak mówi Pan BÓG: Położę kres mnóstwu Egiptu przez rękę Nabuchodonozora, króla Babilonu."
"Ez30,11": "On i z nim jego lud, najsrożsi z narodów, będą sprowadzeni, aby zniszczyć tę ziemię. Dobędą swe miecze przeciw Egiptowi i napełnią ziemię pobitymi."
"Ez30,12": "Wysuszę rzeki i sprzedam ziemię w ręce niegodziwych. Ręką cudzoziemców spustoszę ziemię wraz ze wszystkim, co ją napełnia. Ja, PAN, to powiedziałem."
"Ez30,13": "Tak mówi Pan BÓG: Zniszczę bożki i usunę posągi z Nof, i nie będzie już księcia w ziemi Egiptu. Ześlę strach na ziemię Egiptu."
"Ez30,14": "Spustoszę Patros, rozniecę ogień w Soan i wykonam sąd w No."
"Ez30,15": "Wyleję swoją zapalczywość na Sin, twierdzę Egiptu, i wytracę tłumy z No."
"Ez30,16": "Rozniecę ogień w Egipcie, Sin będzie cierpieć z bólu, No zostanie zniszczone i Nof będzie codziennie dręczone."
"Ez30,17": "Młodzieńcy z Awen i Pibeset polegną od miecza, te miasta pójdą do niewoli."
"Ez30,18": "W Tachpanches dzień ogarną ciemności, gdy złamię tam jarzma Egiptu, i ustanie w nim pycha jego mocy. Okryje go chmura i jego córki pójdą do niewoli."
"Ez30,19": "Tak wykonam sądy nad Egiptem. I poznają, że ja jestem PANEM."
"Ez30,20": "W roku jedenastym, w pierwszym miesiącu, siódmego dnia miesiąca, doszło do mnie słowo PANA mówiące:"
"Ez30,21": "Synu człowieczy, złamałem ramię faraona, króla Egiptu, i oto nie będzie ono obwiązane w celu uleczenia ani nie zostanie owinięte bandażami, ani nie będzie związane, by je wzmocnić, aby mogło trzymać miecz."
"Ez30,22": "Dlatego tak mówi Pan BÓG: Oto jestem przeciwko faraonowi, królowi Egiptu, skruszę mu ramiona, zarówno to mocne, jak i to złamane, i wytrącę miecz z jego ręki."
"Ez30,23": "I rozproszę Egipcjan między narodami, i rozrzucę ich po ziemiach."
"Ez30,24": "Wzmocnię ramiona króla Babilonu i włożę swój miecz w jego ręce, a ramiona faraona złamię i będzie przed nim stękał, jak stęka śmiertelnie zraniony."
"Ez30,25": "Wzmocnię – mówię – ramiona króla Babilonu, a ramiona faraona upadną; i poznają, że ja jestem PANEM, gdy włożę swój miecz w ręce króla Babilonu, aby go wyciągnął na ziemię Egiptu."
"Ez30,26": "I rozproszę Egipcjan między narodami, i rozrzucę ich po ziemiach. I poznają, że jestem PANEM."
