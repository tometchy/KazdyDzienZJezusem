"Ez30,1":
  text: "I doszło do mnie słowo PANA mówiące:"
  tags: []
"Ez30,2":
  text: "Synu człowieczy, prorokuj i mów: Tak mówi Pan BÓG: Zawódźcie, mówiąc: Ach, jakiż to dzień!"
  tags: []
"Ez30,3":
  text: "Bliski bowiem jest dzień, bliski jest dzień PANA; będzie to dzień pochmurny i czas pogan."
  tags: []
"Ez30,4":
  text: "I spadnie miecz na Egipt, i będzie wielka trwoga w Etiopii, gdy polegną zabici w Egipcie, gdy zabiorą jego dostatek i jego fundamenty będą zburzone."
  tags: []
"Ez30,5":
  text: "Etiopia, Put i Lud, cała różnorodna ludność, Kub i mieszkańcy sprzymierzonej ziemi padną razem z nimi od miecza."
  tags: []
"Ez30,6":
  text: "Tak mówi PAN: Upadną ci, którzy wspierają Egipt, i runie pycha jego mocy. Od wieży Sewene padną w niej od miecza, mówi Pan BÓG."
  tags: []
"Ez30,7":
  text: "I będą spustoszeni wśród spustoszonych ziem, a ich miasta znajdą się wśród zburzonych miast."
  tags: []
"Ez30,8":
  text: "I poznają, że ja jestem PANEM, gdy rozpalę ogień w Egipcie, i wszyscy jego pomocnicy zostaną skruszeni."
  tags: []
"Ez30,9":
  text: "W tym dniu posłańcy wyruszą ode mnie w okrętach na postrach spokojnej ziemi Etiopii; i ogarnie ich wielka trwoga, jaka była w dniu porażki Egiptu. Oto bowiem nadchodzi."
  tags: []
"Ez30,10":
  text: "Tak mówi Pan BÓG: Położę kres mnóstwu Egiptu przez rękę Nabuchodonozora, króla Babilonu."
  tags: []
"Ez30,11":
  text: "On i z nim jego lud, najsrożsi z narodów, będą sprowadzeni, aby zniszczyć tę ziemię. Dobędą swe miecze przeciw Egiptowi i napełnią ziemię pobitymi."
  tags: []
"Ez30,12":
  text: "Wysuszę rzeki i sprzedam ziemię w ręce niegodziwych. Ręką cudzoziemców spustoszę ziemię wraz ze wszystkim, co ją napełnia. Ja, PAN, to powiedziałem."
  tags: []
"Ez30,13":
  text: "Tak mówi Pan BÓG: Zniszczę bożki i usunę posągi z Nof, i nie będzie już księcia w ziemi Egiptu. Ześlę strach na ziemię Egiptu."
  tags: []
"Ez30,14":
  text: "Spustoszę Patros, rozniecę ogień w Soan i wykonam sąd w No."
  tags: []
"Ez30,15":
  text: "Wyleję swoją zapalczywość na Sin, twierdzę Egiptu, i wytracę tłumy z No."
  tags: []
"Ez30,16":
  text: "Rozniecę ogień w Egipcie, Sin będzie cierpieć z bólu, No zostanie zniszczone i Nof będzie codziennie dręczone."
  tags: []
"Ez30,17":
  text: "Młodzieńcy z Awen i Pibeset polegną od miecza, te miasta pójdą do niewoli."
  tags: []
"Ez30,18":
  text: "W Tachpanches dzień ogarną ciemności, gdy złamię tam jarzma Egiptu, i ustanie w nim pycha jego mocy. Okryje go chmura i jego córki pójdą do niewoli."
  tags: []
"Ez30,19":
  text: "Tak wykonam sądy nad Egiptem. I poznają, że ja jestem PANEM."
  tags: []
"Ez30,20":
  text: "W roku jedenastym, w pierwszym miesiącu, siódmego dnia miesiąca, doszło do mnie słowo PANA mówiące:"
  tags: []
"Ez30,21":
  text: "Synu człowieczy, złamałem ramię faraona, króla Egiptu, i oto nie będzie ono obwiązane w celu uleczenia ani nie zostanie owinięte bandażami, ani nie będzie związane, by je wzmocnić, aby mogło trzymać miecz."
  tags: []
"Ez30,22":
  text: "Dlatego tak mówi Pan BÓG: Oto jestem przeciwko faraonowi, królowi Egiptu, skruszę mu ramiona, zarówno to mocne, jak i to złamane, i wytrącę miecz z jego ręki."
  tags: []
"Ez30,23":
  text: "I rozproszę Egipcjan między narodami, i rozrzucę ich po ziemiach."
  tags: []
"Ez30,24":
  text: "Wzmocnię ramiona króla Babilonu i włożę swój miecz w jego ręce, a ramiona faraona złamię i będzie przed nim stękał, jak stęka śmiertelnie zraniony."
  tags: []
"Ez30,25":
  text: "Wzmocnię – mówię – ramiona króla Babilonu, a ramiona faraona upadną; i poznają, że ja jestem PANEM, gdy włożę swój miecz w ręce króla Babilonu, aby go wyciągnął na ziemię Egiptu."
  tags: []
"Ez30,26":
  text: "I rozproszę Egipcjan między narodami, i rozrzucę ich po ziemiach. I poznają, że jestem PANEM."
  tags: []
