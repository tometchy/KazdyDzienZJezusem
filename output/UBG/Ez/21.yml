"Ez21,1":
  text: "I doszło do mnie słowo PANA mówiące:"
  tags: []
"Ez21,2":
  text: "Synu człowieczy, odwróć swoją twarz w stronę Jerozolimy i krop swoją mowę ku świętym miejscom, i prorokuj przeciwko ziemi Izraela;"
  tags: []
"Ez21,3":
  text: "Powiedz ziemi Izraela: Tak mówi Pan BÓG: Oto ja jestem przeciwko tobie i dobędę swój miecz z pochwy, i wytnę spośród ciebie sprawiedliwego i bezbożnego."
  tags: []
"Ez21,4":
  text: "Ponieważ wytnę spośród ciebie sprawiedliwego i bezbożnego, mój miecz wyjdzie ze swej pochwy przeciwko wszelkiemu ciału od południa aż do północy."
  tags: []
"Ez21,5":
  text: "I pozna wszelkie ciało, że ja, PAN, dobyłem swój miecz z pochwy i już do niej nie wróci."
  tags: []
"Ez21,6":
  text: "A ty, synu człowieczy, wzdychaj, jakbyś miał złamane biodro, w goryczy wzdychaj na ich oczach."
  tags: []
"Ez21,7":
  text: "A gdy zapytają: Dlaczego wzdychasz? – to odpowiesz: Z powodu wieści, która nadchodzi, bo każde serce się rozpłynie, wszystkie ręce osłabną, wszelki duch omdleje i wszystkie kolana rozpłyną się jak woda. Oto nadchodzi to i stanie się, mówi Pan BÓG."
  tags: []
"Ez21,8":
  text: "I doszło do mnie słowo PANA:"
  tags: []
"Ez21,9":
  text: "Synu człowieczy, prorokuj i mów: Tak mówi PAN. Mów: Miecz, miecz jest wyostrzony i wypolerowany."
  tags: []
"Ez21,10":
  text: "Wyostrzony, aby dokonać rzezi, wypolerowany, aby lśnił. Czy mamy się cieszyć? Gdyż gardzi rózgą mego syna jak każdym drzewem."
  tags: []
"Ez21,11":
  text: "Dał go na wypolerowanie, aby mógł być ujęty w dłoń, ten miecz jest wyostrzony, jest też wypolerowany, aby dać go w ręce zabójcy."
  tags: []
"Ez21,12":
  text: "Wołaj i zawódź, synu człowieczy, gdyż ten miecz będzie przeciwko memu ludowi, przeciwko wszystkim książętom Izraela. Strach miecza przyjdzie na mój lud, dlatego uderz się w biodro."
  tags: []
"Ez21,13":
  text: "Jest to bowiem próba, a cóż jeśli miecz będzie gardzić rózgą? Już jej nie będzie, mówi Pan BÓG."
  tags: []
"Ez21,14":
  text: "Ty więc, synu człowieczy, prorokuj i bij dłonią o dłoń. Niech przyjdzie miecz drugi i trzeci raz, miecz zabitych, ten wielki miecz zabitych, przenikający aż do ich komnat."
  tags: []
"Ez21,15":
  text: "Postawiłem strach miecza we wszystkich ich bramach, aby ich serce się rozpłynęło i pomnożyły się ich upadki. Ach! Jest wypolerowany, aby błyszczeć, wyostrzony, aby zabić."
  tags: []
"Ez21,16":
  text: "Zbierz się, mieczu, udaj się w prawo i w lewo, dokądkolwiek twoja twarz jest zwrócona."
  tags: []
"Ez21,17":
  text: "Ja również uderzę dłonią o dłoń i uspokoję swoją zapalczywość. Ja, PAN, to powiedziałem."
  tags: []
"Ez21,18":
  text: "Potem znowu doszło do mnie słowo PANA mówiące:"
  tags: []
"Ez21,19":
  text: "A ty, synu człowieczy, wyznacz sobie dwie drogi, którymi ma przyjść miecz króla Babilonu. Obie niech wychodzą z jednej ziemi, wybierz miejsce na rozstaju dróg wiodących do miasta, wybierz je."
  tags: []
"Ez21,20":
  text: "Wyznacz drogę, którą ma przyjść miecz: do Rabby synów Ammona i do Judy w obwarowanej Jerozolimie."
  tags: []
"Ez21,21":
  text: "Król Babilonu bowiem stanął na rozdrożu, na początku dwóch dróg, aby zasięgnąć wróżby: polerował strzały, radził się bożków, patrzył na wątrobę."
  tags: []
"Ez21,22":
  text: "Wyrocznia wskazała na jego prawą rękę, na Jerozolimę, aby szykował dowódców, którzy mieli wydać rozkaz rzezi i podnieść okrzyk bojowy, aby ustawić tarany pod bramami, aby usypać wał i budować szańce."
  tags: []
"Ez21,23":
  text: "I w ich oczach będzie to fałszywa wróżba, gdyż zobowiązali się przysięgami, lecz on im przypomni ich nieprawość, aby zostali pojmani."
  tags: []
"Ez21,24":
  text: "Dlatego tak mówi Pan BÓG: Ponieważ przypominacie mi swoją nieprawość, odsłaniając wasze przestępstwo tak, że wasze grzechy są jawne we wszystkich waszych czynach – ponieważ przypominacie mi o tym, zostaniecie pojmani tą ręką."
  tags: []
"Ez21,25":
  text: "A ty, nieczysty bezbożniku, księciu Izraela, którego dzień nadejdzie, gdy nastanie koniec ich nieprawości;"
  tags: []
"Ez21,26":
  text: "Tak mówi Pan BÓG: Zdejmij diadem, zrzuć koronę. Ta już nigdy taka nie będzie. To, co niskie, będzie wywyższone, a to, co wysokie, będzie poniżone."
  tags: []
"Ez21,27":
  text: "Wniwecz, wniwecz, wniwecz ją obrócę. I już jej nie będzie, aż przyjdzie ten, który do niej ma prawo, i jemu ją oddam."
  tags: []
"Ez21,28":
  text: "Ale ty, synu człowieczy, prorokuj i mów: Tak mówi Pan BÓG o synach Ammona i o ich hańbie. Powiedz: Miecz, miecz jest dobyty, jest wypolerowany na rzeź, błyszczy, aby wytracić wszystko;"
  tags: []
"Ez21,29":
  text: "Chociaż opowiadają ci złudne widzenia i wróżą kłamstwo, aby cię przyłożyć do szyi bezbożnych pobitych, których dzień nadejdzie, gdy nastanie koniec ich nieprawości."
  tags: []
"Ez21,30":
  text: "Schowaj jednak miecz do pochwy. Będę cię sądził w miejscu, gdzie zostałeś stworzony, w ziemi twego pochodzenia."
  tags: []
"Ez21,31":
  text: "I wyleję na ciebie swoją zapalczywość, tchnę przeciwko tobie ogniem swojego gniewu i wydam cię w ręce okrutnych ludzi i wprawnych w wytraceniu."
  tags: []
"Ez21,32":
  text: "Staniesz się strawą dla ognia, twoja krew będzie rozlana po całej ziemi, nie będziesz już wspominany, bo ja, PAN, to powiedziałem."
  tags: []
