"Ez40,1":
  text: "W dwudziestym piątym roku naszego wygnania, na początku roku, dziesiątego dnia miesiąca, czternaście lat po zburzeniu miasta, w tym właśnie dniu spoczęła na mnie ręka PANA i zaprowadził mnie tam."
  tags: []
"Ez40,2":
  text: "W widzeniach Bożych przywiódł mnie do ziemi Izraela i postawił na bardzo wysokiej górze, na której było coś jakby budowa miasta, na południu."
  tags: []
"Ez40,3":
  text: "I zaprowadził mnie tam, a oto mąż, który z wyglądu był jakby ze spiżu, miał lniany sznur w ręku i pręt mierniczy, a stał w bramie."
  tags: []
"Ez40,4":
  text: "I przemówił do mnie ten mąż: Synu człowieczy, popatrz swymi oczami, słuchaj swymi uszami i weź sobie do serca wszystko, co ci pokażę. Po to bowiem zostałeś tu przyprowadzony, aby ci to pokazać. Oznajmij wszystko, co widzisz, domowi Izraela."
  tags: []
"Ez40,5":
  text: "I oto mur otaczał dom ze wszystkich stron dokoła, a w ręku tego męża był pręt mierniczy na sześć łokci – liczonych jako łokieć i szerokość dłoni – i wymierzył grubość budowli – jeden pręt, i wysokość – jeden pręt."
  tags: []
"Ez40,6":
  text: "Potem wszedł do bramy, która była zwrócona ku wschodowi, wszedł po schodach i zmierzył próg bramy: jeden pręt szerokości, a drugi próg miał jeden pręt szerokości."
  tags: []
"Ez40,7":
  text: "Każda wnęka miała jeden pręt długości i jeden pręt szerokości, a między wnękami był odstęp na pięć łokci; próg bramy obok przedsionka bramy od wewnątrz wynosił jeden pręt."
  tags: []
"Ez40,8":
  text: "I zmierzył przedsionek bramy od wewnątrz – jeden pręt."
  tags: []
"Ez40,9":
  text: "Zmierzył też przedsionek bramy – osiem łokci, a jej filary – dwa łokcie. Przedsionek bramy był wewnątrz."
  tags: []
"Ez40,10":
  text: "Wnęki bramy wschodniej były trzy z jednej i trzy z drugiej strony; wszystkie trzy miały ten sam wymiar. Jeden wymiar miały też filary po obu stronach."
  tags: []
"Ez40,11":
  text: "Zmierzył też szerokość wejścia bramy – dziesięć łokci, a długość bramy – trzynaście łokci."
  tags: []
"Ez40,12":
  text: "Przed wnękami była także przegroda na jeden łokieć, jeden łokieć miała też przegroda po drugiej stronie. Każda wnęka miała po sześć łokci z jednej i sześć łokci z drugiej strony."
  tags: []
"Ez40,13":
  text: "Potem zmierzył bramę od dachu jednej wnęki aż do dachu drugiej, szerokość była na dwadzieścia pięć łokci, a drzwi były naprzeciwko siebie."
  tags: []
"Ez40,14":
  text: "I uczynił filary na sześćdziesiąt łokci, a każdy filar na dziedzińcu u bramy wokoło miał jedną miarę."
  tags: []
"Ez40,15":
  text: "A od fasady bramy wejściowej do fasady przedsionka wewnątrz bramy było pięćdziesiąt łokci."
  tags: []
"Ez40,16":
  text: "Były też wąskie okna we wnękach, przy filarach wewnątrz bramy dokoła, a także przy przedsionkach. Dokoła od wewnątrz były okna, a na filarach były palmy."
  tags: []
"Ez40,17":
  text: "Potem przyprowadził mnie na dziedziniec zewnętrzny, a oto znajdowały się tam komory i posadzka uczyniona na dziedzińcu zewsząd dokoła: trzydzieści komór było na tej posadzce."
  tags: []
"Ez40,18":
  text: "A posadzka była wzdłuż bram, odpowiednio do długości bram. Była to posadzka dolna."
  tags: []
"Ez40,19":
  text: "Potem zmierzył odległość od fasady bramy dolnej do fasady bramy dziedzińca wewnętrznego z zewnątrz: sto łokci w kierunku wschodnim i północnym."
  tags: []
"Ez40,20":
  text: "Zmierzył też długość i szerokość bramy północnej na dziedzińcu zewnętrznym."
  tags: []
"Ez40,21":
  text: "Miała trzy wnęki z jednej i trzy z drugiej strony; jej filary i przedsionki miały taki sam wymiar jak pierwsza brama: pięćdziesiąt łokci długości i dwadzieścia pięć łokci szerokości."
  tags: []
"Ez40,22":
  text: "Jej okna, przedsionek i palmy miały taki sam wymiar jak brama wschodnia. Po siedmiu stopniach wchodziło się do niej, a jej przedsionek był tuż przed schodami."
  tags: []
"Ez40,23":
  text: "Brama dziedzińca wewnętrznego była naprzeciwko bramy północnej, jak brama wschodnia; i zmierzył od bramy do bramy – sto łokci."
  tags: []
"Ez40,24":
  text: "Potem zaprowadził mnie w stronę południa, a oto była brama południowa; i zmierzył jej filary i przedsionek – miały te same wymiary."
  tags: []
"Ez40,25":
  text: "Miała ona, podobnie jak jej przedsionek, okna wokoło, tak jak tamte okna. Miała pięćdziesiąt łokci długości i dwadzieścia pięć łokci szerokości."
  tags: []
"Ez40,26":
  text: "Prowadziło do niej siedem stopni, a jej przedsionek był przed nimi. Miała ona palmy na filarach z jednej i z drugiej strony."
  tags: []
"Ez40,27":
  text: "Była też brama południowa na dziedzińcu wewnętrznym; i zmierzył od bramy do bramy w stronę południa – sto łokci."
  tags: []
"Ez40,28":
  text: "Potem zaprowadził mnie na dziedziniec wewnętrzny przez bramę południową i zmierzył bramę południową: miała te same wymiary."
  tags: []
"Ez40,29":
  text: "A jej wnęki, jej filary i jej przedsionek miały te same wymiary. Miała ona również, jak i jej przedsionek, okna wokoło. Miała pięćdziesiąt łokci długości i dwadzieścia pięć łokci szerokości."
  tags: []
"Ez40,30":
  text: "Dokoła był przedsionek na dwadzieścia pięć łokci długości i pięć łokci szerokości."
  tags: []
"Ez40,31":
  text: "A jej przedsionek był na dziedzińcu zewnętrznym, a na jej filarach były palmy. Prowadziło do niej osiem stopni."
  tags: []
"Ez40,32":
  text: "Zaprowadził mnie też na dziedziniec wewnętrzny w stronę wschodu i zmierzył bramę: miała te same wymiary."
  tags: []
"Ez40,33":
  text: "Jej wnęki, jej filary i jej przedsionek miały te same wymiary. Miała ona również, tak jak jej przedsionek, okna wokoło. Miała pięćdziesiąt łokci długości, dwadzieścia pięć łokci szerokości."
  tags: []
"Ez40,34":
  text: "A jej przedsionek był na dziedzińcu zewnętrznym, a na jej filarach były palmy po obu stronach. Prowadziło do niej osiem stopni."
  tags: []
"Ez40,35":
  text: "Potem zaprowadził mnie do bramy północnej i zmierzył ją: miała te same wymiary;"
  tags: []
"Ez40,36":
  text: "Jej wnęki, jej filary i jej przedsionek, a także jej okna wokoło. Jej długość wynosiła pięćdziesiąt łokci, a jej szerokość – dwadzieścia pięć łokci."
  tags: []
"Ez40,37":
  text: "Jej filary były na dziedzińcu zewnętrznym, a na jej filarach były palmy po obu stronach. Prowadziło do niej osiem stopni."
  tags: []
"Ez40,38":
  text: "Były też komory i wejście do nich przy filarach bram, tam obmywano ofiarę całopalną."
  tags: []
"Ez40,39":
  text: "W przedsionku bramy były dwa stoły po jednej stronie i dwa stoły po drugiej stronie, na których zabijano ofiarę całopalną, ofiarę za grzech i ofiarę za przewinienie."
  tags: []
"Ez40,40":
  text: "Na stronie zewnętrznej, przy wejściu bramy północnej, były dwa stoły, także i po drugiej stronie, która jest przy przedsionku bramy, były dwa stoły."
  tags: []
"Ez40,41":
  text: "Cztery stoły z jednej i cztery stoły z drugiej strony, z boku bramy; wszystkich stołów, na których zabijano ofiary, było osiem."
  tags: []
"Ez40,42":
  text: "Te cztery stoły do całopalenia były z kamienia ciosanego, długie na półtora łokcia, szerokie na półtora łokcia i wysokie na jeden łokieć. Na nich kładziono sprzęt do zabijania ofiary całopalnej i innych ofiar."
  tags: []
"Ez40,43":
  text: "Wokoło były też przymocowane haki o grubości jednej dłoni, a mięso leżało na stołach dla ofiar."
  tags: []
"Ez40,44":
  text: "Na zewnątrz bramy wewnętrznej, na dziedzińcu wewnętrznym, były komory dla śpiewaków. Jeden rząd był z boku bramy północnej, zwrócony w kierunku południa, drugi rząd był z boku bramy wschodniej, zwrócony w kierunku północy."
  tags: []
"Ez40,45":
  text: "I powiedział do mnie: Te komory, które są zwrócone w kierunku południa, są dla kapłanów, którzy pełnią straż w domu."
  tags: []
"Ez40,46":
  text: "Te zaś komory, które są zwrócone w kierunku północy, są dla kapłanów, którzy pełnią straż przy ołtarzu. Są to synowie Sadoka, którzy spośród synów Lewiego zbliżają się do PANA, aby mu służyć."
  tags: []
"Ez40,47":
  text: "I zmierzył dziedziniec: długość wynosiła sto łokci, szerokość – sto łokci, był to kwadrat; a ołtarz był przed domem."
  tags: []
"Ez40,48":
  text: "Potem wprowadził mnie do przedsionka domu i zmierzył filary przedsionka: pięć łokci z jednej i pięć łokci z drugiej strony. Szerokość bramy wynosiła trzy łokcie z jednej i trzy łokcie z drugiej strony."
  tags: []
"Ez40,49":
  text: "Długość przedsionka wynosiła dwadzieścia łokci, a szerokość – jedenaście łokci. Wstępowało się do niego po stopniach; były też kolumny przy filarach, jedna z jednej, druga z drugiej strony."
  tags: []
