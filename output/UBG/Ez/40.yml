"Ez40,1": "W dwudziestym piątym roku naszego wygnania, na początku roku, dziesiątego dnia miesiąca, czternaście lat po zburzeniu miasta, w tym właśnie dniu spoczęła na mnie ręka PANA i zaprowadził mnie tam."
"Ez40,2": "W widzeniach Bożych przywiódł mnie do ziemi Izraela i postawił na bardzo wysokiej górze, na której było coś jakby budowa miasta, na południu."
"Ez40,3": "I zaprowadził mnie tam, a oto mąż, który z wyglądu był jakby ze spiżu, miał lniany sznur w ręku i pręt mierniczy, a stał w bramie."
"Ez40,4": "I przemówił do mnie ten mąż: Synu człowieczy, popatrz swymi oczami, słuchaj swymi uszami i weź sobie do serca wszystko, co ci pokażę. Po to bowiem zostałeś tu przyprowadzony, aby ci to pokazać. Oznajmij wszystko, co widzisz, domowi Izraela."
"Ez40,5": "I oto mur otaczał dom ze wszystkich stron dokoła, a w ręku tego męża był pręt mierniczy na sześć łokci – liczonych jako łokieć i szerokość dłoni – i wymierzył grubość budowli – jeden pręt, i wysokość – jeden pręt."
"Ez40,6": "Potem wszedł do bramy, która była zwrócona ku wschodowi, wszedł po schodach i zmierzył próg bramy: jeden pręt szerokości, a drugi próg miał jeden pręt szerokości."
"Ez40,7": "Każda wnęka miała jeden pręt długości i jeden pręt szerokości, a między wnękami był odstęp na pięć łokci; próg bramy obok przedsionka bramy od wewnątrz wynosił jeden pręt."
"Ez40,8": "I zmierzył przedsionek bramy od wewnątrz – jeden pręt."
"Ez40,9": "Zmierzył też przedsionek bramy – osiem łokci, a jej filary – dwa łokcie. Przedsionek bramy był wewnątrz."
"Ez40,10": "Wnęki bramy wschodniej były trzy z jednej i trzy z drugiej strony; wszystkie trzy miały ten sam wymiar. Jeden wymiar miały też filary po obu stronach."
"Ez40,11": "Zmierzył też szerokość wejścia bramy – dziesięć łokci, a długość bramy – trzynaście łokci."
"Ez40,12": "Przed wnękami była także przegroda na jeden łokieć, jeden łokieć miała też przegroda po drugiej stronie. Każda wnęka miała po sześć łokci z jednej i sześć łokci z drugiej strony."
"Ez40,13": "Potem zmierzył bramę od dachu jednej wnęki aż do dachu drugiej, szerokość była na dwadzieścia pięć łokci, a drzwi były naprzeciwko siebie."
"Ez40,14": "I uczynił filary na sześćdziesiąt łokci, a każdy filar na dziedzińcu u bramy wokoło miał jedną miarę."
"Ez40,15": "A od fasady bramy wejściowej do fasady przedsionka wewnątrz bramy było pięćdziesiąt łokci."
"Ez40,16": "Były też wąskie okna we wnękach, przy filarach wewnątrz bramy dokoła, a także przy przedsionkach. Dokoła od wewnątrz były okna, a na filarach były palmy."
"Ez40,17": "Potem przyprowadził mnie na dziedziniec zewnętrzny, a oto znajdowały się tam komory i posadzka uczyniona na dziedzińcu zewsząd dokoła: trzydzieści komór było na tej posadzce."
"Ez40,18": "A posadzka była wzdłuż bram, odpowiednio do długości bram. Była to posadzka dolna."
"Ez40,19": "Potem zmierzył odległość od fasady bramy dolnej do fasady bramy dziedzińca wewnętrznego z zewnątrz: sto łokci w kierunku wschodnim i północnym."
"Ez40,20": "Zmierzył też długość i szerokość bramy północnej na dziedzińcu zewnętrznym."
"Ez40,21": "Miała trzy wnęki z jednej i trzy z drugiej strony; jej filary i przedsionki miały taki sam wymiar jak pierwsza brama: pięćdziesiąt łokci długości i dwadzieścia pięć łokci szerokości."
"Ez40,22": "Jej okna, przedsionek i palmy miały taki sam wymiar jak brama wschodnia. Po siedmiu stopniach wchodziło się do niej, a jej przedsionek był tuż przed schodami."
"Ez40,23": "Brama dziedzińca wewnętrznego była naprzeciwko bramy północnej, jak brama wschodnia; i zmierzył od bramy do bramy – sto łokci."
"Ez40,24": "Potem zaprowadził mnie w stronę południa, a oto była brama południowa; i zmierzył jej filary i przedsionek – miały te same wymiary."
"Ez40,25": "Miała ona, podobnie jak jej przedsionek, okna wokoło, tak jak tamte okna. Miała pięćdziesiąt łokci długości i dwadzieścia pięć łokci szerokości."
"Ez40,26": "Prowadziło do niej siedem stopni, a jej przedsionek był przed nimi. Miała ona palmy na filarach z jednej i z drugiej strony."
"Ez40,27": "Była też brama południowa na dziedzińcu wewnętrznym; i zmierzył od bramy do bramy w stronę południa – sto łokci."
"Ez40,28": "Potem zaprowadził mnie na dziedziniec wewnętrzny przez bramę południową i zmierzył bramę południową: miała te same wymiary."
"Ez40,29": "A jej wnęki, jej filary i jej przedsionek miały te same wymiary. Miała ona również, jak i jej przedsionek, okna wokoło. Miała pięćdziesiąt łokci długości i dwadzieścia pięć łokci szerokości."
"Ez40,30": "Dokoła był przedsionek na dwadzieścia pięć łokci długości i pięć łokci szerokości."
"Ez40,31": "A jej przedsionek był na dziedzińcu zewnętrznym, a na jej filarach były palmy. Prowadziło do niej osiem stopni."
"Ez40,32": "Zaprowadził mnie też na dziedziniec wewnętrzny w stronę wschodu i zmierzył bramę: miała te same wymiary."
"Ez40,33": "Jej wnęki, jej filary i jej przedsionek miały te same wymiary. Miała ona również, tak jak jej przedsionek, okna wokoło. Miała pięćdziesiąt łokci długości, dwadzieścia pięć łokci szerokości."
"Ez40,34": "A jej przedsionek był na dziedzińcu zewnętrznym, a na jej filarach były palmy po obu stronach. Prowadziło do niej osiem stopni."
"Ez40,35": "Potem zaprowadził mnie do bramy północnej i zmierzył ją: miała te same wymiary;"
"Ez40,36": "Jej wnęki, jej filary i jej przedsionek, a także jej okna wokoło. Jej długość wynosiła pięćdziesiąt łokci, a jej szerokość – dwadzieścia pięć łokci."
"Ez40,37": "Jej filary były na dziedzińcu zewnętrznym, a na jej filarach były palmy po obu stronach. Prowadziło do niej osiem stopni."
"Ez40,38": "Były też komory i wejście do nich przy filarach bram, tam obmywano ofiarę całopalną."
"Ez40,39": "W przedsionku bramy były dwa stoły po jednej stronie i dwa stoły po drugiej stronie, na których zabijano ofiarę całopalną, ofiarę za grzech i ofiarę za przewinienie."
"Ez40,40": "Na stronie zewnętrznej, przy wejściu bramy północnej, były dwa stoły, także i po drugiej stronie, która jest przy przedsionku bramy, były dwa stoły."
"Ez40,41": "Cztery stoły z jednej i cztery stoły z drugiej strony, z boku bramy; wszystkich stołów, na których zabijano ofiary, było osiem."
"Ez40,42": "Te cztery stoły do całopalenia były z kamienia ciosanego, długie na półtora łokcia, szerokie na półtora łokcia i wysokie na jeden łokieć. Na nich kładziono sprzęt do zabijania ofiary całopalnej i innych ofiar."
"Ez40,43": "Wokoło były też przymocowane haki o grubości jednej dłoni, a mięso leżało na stołach dla ofiar."
"Ez40,44": "Na zewnątrz bramy wewnętrznej, na dziedzińcu wewnętrznym, były komory dla śpiewaków. Jeden rząd był z boku bramy północnej, zwrócony w kierunku południa, drugi rząd był z boku bramy wschodniej, zwrócony w kierunku północy."
"Ez40,45": "I powiedział do mnie: Te komory, które są zwrócone w kierunku południa, są dla kapłanów, którzy pełnią straż w domu."
"Ez40,46": "Te zaś komory, które są zwrócone w kierunku północy, są dla kapłanów, którzy pełnią straż przy ołtarzu. Są to synowie Sadoka, którzy spośród synów Lewiego zbliżają się do PANA, aby mu służyć."
"Ez40,47": "I zmierzył dziedziniec: długość wynosiła sto łokci, szerokość – sto łokci, był to kwadrat; a ołtarz był przed domem."
"Ez40,48": "Potem wprowadził mnie do przedsionka domu i zmierzył filary przedsionka: pięć łokci z jednej i pięć łokci z drugiej strony. Szerokość bramy wynosiła trzy łokcie z jednej i trzy łokcie z drugiej strony."
"Ez40,49": "Długość przedsionka wynosiła dwadzieścia łokci, a szerokość – jedenaście łokci. Wstępowało się do niego po stopniach; były też kolumny przy filarach, jedna z jednej, druga z drugiej strony."
