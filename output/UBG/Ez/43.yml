"Ez43,1": "Potem zaprowadził mnie do bramy, do bramy, która była zwrócona w kierunku wschodnim."
"Ez43,2": "A oto chwała Boga Izraela przybyła od wschodu i jego głos był jak szum wielkich wód, a ziemia jaśniała od jego chwały."
"Ez43,3": "A to widzenie, które miałem, było podobne do tego widzenia, które miałem, gdy przybyłem, aby zniszczyć miasto; widzenie, podobne do tego widzenia, które miałem nad rzeką Kebar. I upadłem na twarz."
"Ez43,4": "Gdy chwała PANA weszła do domu przez bramę wschodnią;"
"Ez43,5": "Wtedy uniósł mnie duch i wprowadził na dziedziniec wewnętrzny, a oto dom był pełen chwały PANA."
"Ez43,6": "I usłyszałem, jak ktoś mówił do mnie z domu, a jakiś mąż stał obok mnie."
"Ez43,7": "I powiedział do mnie: Synu człowieczy, oto miejsce mojego tronu i miejsce dla moich stóp, gdzie będę mieszkać pośród synów Izraela na wieki. Dom Izraela już nie zbezcześci mojego świętego imienia, ani on, ani jego królowie, przez swój nierząd i przez zwłoki swych królów na wyżynach."
"Ez43,8": "Gdy kładli swój próg obok mojego progu, swoje odrzwia obok moich odrzwi i ścianę między mną a sobą, zbezcześcili bardzo moje święte imię przez swoje obrzydliwości, które popełniali. Dlatego zniszczyłem ich w swoim gniewie."
"Ez43,9": "Ale teraz niech oddalą ode mnie swój nierząd i zwłoki swoich królów, a zamieszkam wśród nich na wieki."
"Ez43,10": "Ty, synu człowieczy, powiedz domowi Izraela o tym domu, aby się wstydzili swoich nieprawości. Niech sobie wymierzą jego plan."
"Ez43,11": "A jeśli się zawstydzą wszystkiego, co uczynili, wtedy opisz im wygląd tego domu, jego układ, jego wyjście i wejścia, cały jego kształt i wszystkie jego ustawy, cały kształt i wszystkie jego prawa. Zapisz to przed ich oczami, aby przestrzegali całego jego kształtu i wszystkich jego ustaw i czynili je."
"Ez43,12": "A takie jest prawo tego domu: Na szczycie góry cały jego obszar wszędzie dokoła ma być bardzo święty. Oto takie jest prawo tego domu."
"Ez43,13": "I takie są wymiary ołtarza w łokciach liczonych na łokieć i cztery palce: jego podstawa wysoka na łokieć i szeroka na łokieć, a obramowanie na jego brzegu wokoło ma wynosić jedną piędź. Taka będzie górna część ołtarza:"
"Ez43,14": "Od podstawy na ziemi aż do dolnego odstępu dwa łokcie, a jeden łokieć szerokości; od mniejszego odstępu do większego odstępu cztery łokcie, a jeden łokieć szerokości."
"Ez43,15": "Ale sam ołtarz ma mieć cztery łokcie wysokości, a z ołtarza w górę – cztery rogi."
"Ez43,16": "A ołtarz ma mieć dwanaście łokci długości i dwanaście szerokości, ma być czworokątny po czterech swoich bokach."
"Ez43,17": "Górny odstęp ma mieć czternaście łokci długości i czternaście szerokości, po czterech bokach, a obramowanie wokół niego ma być na pół łokcia, jego podstawa – na łokieć wokoło i jego stopnie skierowane ku wschodowi."
"Ez43,18": "I powiedział do mnie: Synu człowieczy, tak mówi Pan BÓG: To są ustawy ołtarza na dzień, w którym zostanie zbudowany, aby na nim składać całopalenia i skrapiać go krwią."
"Ez43,19": "A kapłanom, Lewitom, którzy są z potomstwa Sadoka i zbliżają się do mnie, aby mi służyć, mówi Pan BÓG, dasz młodego cielca na ofiarę za grzech."
"Ez43,20": "Wtedy weźmiesz z jego krwi i nałożysz na cztery rogi, na cztery narożniki odstępu i na obramowanie wokoło. W ten sposób oczyścisz go i poświęcisz."
"Ez43,21": "Potem weźmiesz tego cielca za grzech i spalisz go w oznaczonym miejscu domu poza świątynią."
"Ez43,22": "A drugiego dnia złożysz kozła bez skazy na ofiarę za grzech i oczyszczą ołtarz, tak jak oczyścili go cielcem."
"Ez43,23": "A gdy dokonasz oczyszczenia, będziesz ofiarowywać młodego cielca bez skazy i barana z trzody bez skazy."
"Ez43,24": "Gdy je ofiarujesz przed PANEM, kapłani rzucą na nie sól i złożą je na całopalenie dla PANA."
"Ez43,25": "Przez siedem dni codziennie będziesz składał kozła na ofiarę za grzech. Ma być przygotowany także młody cielec i baran z trzody bez skazy."
"Ez43,26": "Przez siedem dni będą oczyszczać ołtarz i poświęcać go. I poświęcą się."
"Ez43,27": "A po upływie tych dni, dnia ósmego i w następne kapłani będą składali na ołtarzu wasze całopalenia i ofiary pojednawcze i przyjmę was łaskawie, mówi Pan BÓG."
