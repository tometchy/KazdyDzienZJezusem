"Ez6,1": "I doszło do mnie słowo PANA mówiące:"
"Ez6,2": "Synu człowieczy, zwróć swoją twarz ku górom Izraela i prorokuj przeciwko nim;"
"Ez6,3": "I mów: Góry Izraela, słuchajcie słowa Pana BOGA. Tak mówi Pan BÓG do gór i pagórków, do strumieni i dolin: Oto ja, właśnie ja sprowadzę na was miecz i zniszczę wasze wyżyny."
"Ez6,4": "Wasze ołtarze będą spustoszone i wasze posągi będą połamane, a porozrzucam waszych pobitych przed waszymi bożkami."
"Ez6,5": "Trupy synów Izraela położę przed ich bożkami i rozrzucę wasze kości wokół waszych ołtarzy."
"Ez6,6": "Wszędzie, gdzie mieszkacie, miasta zostaną spustoszone i wyżyny spustoszeją, tak że wasze ołtarze będą zburzone i zniszczone, wasze bożki będą rozbite i przestaną istnieć, wasze posągi będą wycięte, a wasze dzieła wyniszczone."
"Ez6,7": "I pobici padną pośród was, a poznacie, że ja jestem PANEM."
"Ez6,8": "Lecz pozostawię niektórych spośród was, którzy ujdą spod miecza pogan, gdy będziecie rozproszeni po krajach."
"Ez6,9": "Ci z was, którzy ocaleją, będą o mnie pamiętać pośród narodów, do których zostaną uprowadzeni, bo ubolewam nad ich cudzołożnym sercem, które odstąpiło ode mnie, i nad ich oczami, które uprawiały nierząd, idąc za swymi bożkami. I poczują wstręt do samych siebie z powodu zła, które popełnili we wszystkich swoich obrzydliwościach."
"Ez6,10": "I poznają, że ja jestem PANEM i że nie na próżno mówiłem, że sprowadzę na nich to nieszczęście."
"Ez6,11": "Tak mówi Pan BÓG: Klaśnij swą dłonią, tupnij swą nogą i mów: Biada z powodu wszystkich złych obrzydliwości domu Izraela! Padną bowiem od miecza, od głodu i od zarazy."
"Ez6,12": "Ten, co będzie daleko, umrze od zarazy, ten, co blisko, polegnie od miecza, a ten, co pozostanie i będzie oblężony, umrze od głodu. Tak dopełnię na nich swej zapalczywości."
"Ez6,13": "Wtedy poznacie, że ja jestem PANEM, gdy ich pobici będą leżeli wśród ich bożków i dokoła ich ołtarzy, na każdym wysokim pagórku, po wszystkich szczytach górskich, pod każdym drzewem zielonym i pod każdym rozłożystym dębem, gdzie składali miłą woń wszystkim swoim bożkom."
"Ez6,14": "Wyciągnę swoją rękę przeciwko nim i uczynię tę ziemię spustoszoną, bardziej spustoszoną od pustyni Diblat, wszędzie, gdzie mieszkają. I tak poznają, że ja jestem PANEM."
