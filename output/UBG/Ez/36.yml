"Ez36,1":
  text: "A ty, synu człowieczy, prorokuj o górach Izraela i mów: Góry Izraela, słuchajcie słowa PANA."
  tags: []
"Ez36,2":
  text: "Tak mówi Pan BÓG: Ponieważ wróg powiedział o was: Ha! Prastare wysokości stały się naszą posiadłością;"
  tags: []
"Ez36,3":
  text: "Prorokuj i mów: Tak mówi Pan BÓG: Ponieważ zburzono was i pochłonięto zewsząd, abyście się stały dziedzictwem reszty narodów i wzięto was na język oraz na obmowę ludzi;"
  tags: []
"Ez36,4":
  text: "Dlatego, góry Izraela, słuchajcie słowa Pana BOGA. Tak mówi Pan BÓG do gór i pagórków, do strumieni i dolin, do spustoszonych ruin i opuszczonych miast, które stały się łupem i pośmiewiskiem dla reszty okolicznych narodów."
  tags: []
"Ez36,5":
  text: "Dlatego tak mówi Pan BÓG: Zaprawdę, w ogniu swojej zapalczywości będę mówił przeciw reszcie tych narodów i przeciwko całemu Edomowi, którzy wzięli sobie moją ziemię w posiadanie z radością całego serca i z pogardą duszy, aby siedlisko jej wygnańców stało się łupem."
  tags: []
"Ez36,6":
  text: "Dlatego prorokuj o ziemi Izraela i mów do gór i pagórków, do strumieni i dolin: Tak mówi Pan BÓG: Oto przemówiłem w swojej zazdrości i w swojej zapalczywości, ponieważ znosiliście zniewagi narodów."
  tags: []
"Ez36,7":
  text: "Dlatego tak mówi Pan BÓG: Ja podniosłem swoją rękę: Zaprawdę, te narody, które są wokół was, same będą znosić swoją hańbę."
  tags: []
"Ez36,8":
  text: "A wy, góry Izraela, wypuścicie swe gałązki i wydacie swój owoc memu ludowi Izraelowi, bo zbliża się jego przyjście."
  tags: []
"Ez36,9":
  text: "Oto bowiem idę do was i powrócę do was, będziecie uprawiane i obsiane."
  tags: []
"Ez36,10":
  text: "I rozmnożę na was ludzi, cały dom Izraela, miasta będą zamieszkane i miejsca zburzone zostaną odbudowane."
  tags: []
"Ez36,11":
  text: "Rozmnożę na was ludzi i bydło, będą liczni i płodni. I sprawię, że będziecie mieszkać jak za waszych dawnych czasów i będę wam czynić lepiej niż na początku. I poznacie, że ja jestem PANEM."
  tags: []
"Ez36,12":
  text: "Bo przyprowadzę na was ludzi, swój lud Izraela. Posiądą cię i będziesz dla nich dziedzictwem, i nigdy więcej nie pozbawisz ich potomstwa."
  tags: []
"Ez36,13":
  text: "Tak mówi Pan BÓG: Ponieważ mówią do was: Ty jesteś tą ziemią, która pożera ludzi i pozbawia narody potomstwa;"
  tags: []
"Ez36,14":
  text: "Już nie będziesz pożerać ludzi ani pozbawiać potomstwa swoje narody, mówi Pan BÓG."
  tags: []
"Ez36,15":
  text: "I już nie dopuszczę, aby w tobie były słyszane obelgi narodów, nie będziesz już znosić zniewag ludzi i nie będziesz już doprowadzać swoich narodów do upadku, mówi Pan BÓG."
  tags: []
"Ez36,16":
  text: "I doszło do mnie słowo PANA mówiące:"
  tags: []
"Ez36,17":
  text: "Synu człowieczy, gdy dom Izraela mieszkał w swej ziemi, plugawił ją swymi drogami i czynami. Jego droga wobec mnie była jak nieczystość odłączonej kobiety."
  tags: []
"Ez36,18":
  text: "Dlatego wylałem na nich swój gniew z powodu krwi, którą wylali na ziemię, i z powodu ich bożków, którymi ją splugawili."
  tags: []
"Ez36,19":
  text: "I rozproszyłem ich między narodami, i zostali rozrzuceni po ziemiach. Osądziłem ich według ich dróg i według ich czynów."
  tags: []
"Ez36,20":
  text: "A gdy weszli do narodów, do których przybyli, zbezcześcili tam moje święte imię, gdy o nich mówiono: To jest lud PANA, a z jego ziemi wyszli."
  tags: []
"Ez36,21":
  text: "Ale żal mi się zrobiło mojego świętego imienia, które zbezcześcił dom Izraela wśród narodów, do których przybył."
  tags: []
"Ez36,22":
  text: "Dlatego mów do domu Izraela: Tak mówi Pan BÓG: Nie dla was ja to czynię, domu Izraela, ale przez wzgląd na moje święte imię, które zbezcześciliście wśród narodów, do których przybyliście."
  tags: []
"Ez36,23":
  text: "I uświęcę moje wielkie imię, które było zbezczeszczone wśród narodów, które wy zbezcześciliście pośród nich. I poznają narody, że ja jestem PANEM, mówi Pan BÓG, gdy będę uświęcony w was na ich oczach."
  tags: []
"Ez36,24":
  text: "Zabiorę was bowiem spośród narodów, zgromadzę was ze wszystkich ziem i przyprowadzę was do waszej ziemi."
  tags: []
"Ez36,25":
  text: "I pokropię was czystą wodą, i będziecie czyści. Oczyszczę was ze wszystkich waszych nieczystości i ze wszystkich waszych bożków."
  tags: []
"Ez36,26":
  text: "I dam wam nowe serce, i włożę nowego ducha do waszego wnętrza. Wyjmę serce kamienne z waszego ciała, a dam wam serce mięsiste."
  tags: []
"Ez36,27":
  text: "Włożę mego Ducha do waszego wnętrza i sprawię, że będziecie chodzić według moich ustaw i będziecie przestrzegać moich sądów, i wykonywać je."
  tags: []
"Ez36,28":
  text: "Zamieszkacie w ziemi, którą dałem waszym ojcom, będziecie moim ludem, a ja będę waszym Bogiem."
  tags: []
"Ez36,29":
  text: "I wyzwolę was od wszystkich waszych nieczystości. Przywołam zboża i rozmnożę je, a nie dopuszczę do was głodu."
  tags: []
"Ez36,30":
  text: "Rozmnożę też owoc drzew i plony pól, abyście już nie znosili hańby głodu wśród narodów."
  tags: []
"Ez36,31":
  text: "Wtedy przypomnicie sobie wasze złe drogi i wasze czyny, które nie były dobre, i samych siebie będziecie się brzydzić z powodu waszych nieprawości i obrzydliwości."
  tags: []
"Ez36,32":
  text: "Nie ze względu na was to czynię, mówi Pan BÓG, niech wam to będzie wiadome. Wstydźcie się i rumieńcie się z powodu waszych dróg, domu Izraela."
  tags: []
"Ez36,33":
  text: "Tak mówi Pan BÓG: W dniu, w którym was oczyszczę ze wszystkich waszych nieprawości, zaludnię miasta i miejsca zburzone zostaną odbudowane."
  tags: []
"Ez36,34":
  text: "A spustoszała ziemia będzie uprawiana, zamiast być spustoszeniem na oczach wszystkich przechodniów."
  tags: []
"Ez36,35":
  text: "I powiedzą: Ta spustoszona ziemia stała się jak ogród Eden; miasta puste, opuszczone i zniszczone, są teraz obwarowane i zamieszkałe."
  tags: []
"Ez36,36":
  text: "I narody, które wokół was pozostaną, poznają, że ja, PAN, odbudowałem to, co zburzone, i zasadziłem to, co spustoszone. Ja, PAN, to powiedziałem i uczynię."
  tags: []
"Ez36,37":
  text: "Tak mówi Pan BÓG: Jeszcze w tym jednym dam się uprosić domowi Izraela, aby im to uczynić: Pomnożę liczbę ich ludzi jak trzodę."
  tags: []
"Ez36,38":
  text: "Jak trzodę na ofiary, jak trzodę Jerozolimy w czasie jej uroczystych świąt, tak spustoszone miasta będą wypełnione trzodami ludzi. I poznają, że ja jestem PANEM."
  tags: []
