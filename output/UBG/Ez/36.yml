"Ez36,1": "A ty, synu człowieczy, prorokuj o górach Izraela i mów: Góry Izraela, słuchajcie słowa PANA."
"Ez36,2": "Tak mówi Pan BÓG: Ponieważ wróg powiedział o was: Ha! Prastare wysokości stały się naszą posiadłością;"
"Ez36,3": "Prorokuj i mów: Tak mówi Pan BÓG: Ponieważ zburzono was i pochłonięto zewsząd, abyście się stały dziedzictwem reszty narodów i wzięto was na język oraz na obmowę ludzi;"
"Ez36,4": "Dlatego, góry Izraela, słuchajcie słowa Pana BOGA. Tak mówi Pan BÓG do gór i pagórków, do strumieni i dolin, do spustoszonych ruin i opuszczonych miast, które stały się łupem i pośmiewiskiem dla reszty okolicznych narodów."
"Ez36,5": "Dlatego tak mówi Pan BÓG: Zaprawdę, w ogniu swojej zapalczywości będę mówił przeciw reszcie tych narodów i przeciwko całemu Edomowi, którzy wzięli sobie moją ziemię w posiadanie z radością całego serca i z pogardą duszy, aby siedlisko jej wygnańców stało się łupem."
"Ez36,6": "Dlatego prorokuj o ziemi Izraela i mów do gór i pagórków, do strumieni i dolin: Tak mówi Pan BÓG: Oto przemówiłem w swojej zazdrości i w swojej zapalczywości, ponieważ znosiliście zniewagi narodów."
"Ez36,7": "Dlatego tak mówi Pan BÓG: Ja podniosłem swoją rękę: Zaprawdę, te narody, które są wokół was, same będą znosić swoją hańbę."
"Ez36,8": "A wy, góry Izraela, wypuścicie swe gałązki i wydacie swój owoc memu ludowi Izraelowi, bo zbliża się jego przyjście."
"Ez36,9": "Oto bowiem idę do was i powrócę do was, będziecie uprawiane i obsiane."
"Ez36,10": "I rozmnożę na was ludzi, cały dom Izraela, miasta będą zamieszkane i miejsca zburzone zostaną odbudowane."
"Ez36,11": "Rozmnożę na was ludzi i bydło, będą liczni i płodni. I sprawię, że będziecie mieszkać jak za waszych dawnych czasów i będę wam czynić lepiej niż na początku. I poznacie, że ja jestem PANEM."
"Ez36,12": "Bo przyprowadzę na was ludzi, swój lud Izraela. Posiądą cię i będziesz dla nich dziedzictwem, i nigdy więcej nie pozbawisz ich potomstwa."
"Ez36,13": "Tak mówi Pan BÓG: Ponieważ mówią do was: Ty jesteś tą ziemią, która pożera ludzi i pozbawia narody potomstwa;"
"Ez36,14": "Już nie będziesz pożerać ludzi ani pozbawiać potomstwa swoje narody, mówi Pan BÓG."
"Ez36,15": "I już nie dopuszczę, aby w tobie były słyszane obelgi narodów, nie będziesz już znosić zniewag ludzi i nie będziesz już doprowadzać swoich narodów do upadku, mówi Pan BÓG."
"Ez36,16": "I doszło do mnie słowo PANA mówiące:"
"Ez36,17": "Synu człowieczy, gdy dom Izraela mieszkał w swej ziemi, plugawił ją swymi drogami i czynami. Jego droga wobec mnie była jak nieczystość odłączonej kobiety."
"Ez36,18": "Dlatego wylałem na nich swój gniew z powodu krwi, którą wylali na ziemię, i z powodu ich bożków, którymi ją splugawili."
"Ez36,19": "I rozproszyłem ich między narodami, i zostali rozrzuceni po ziemiach. Osądziłem ich według ich dróg i według ich czynów."
"Ez36,20": "A gdy weszli do narodów, do których przybyli, zbezcześcili tam moje święte imię, gdy o nich mówiono: To jest lud PANA, a z jego ziemi wyszli."
"Ez36,21": "Ale żal mi się zrobiło mojego świętego imienia, które zbezcześcił dom Izraela wśród narodów, do których przybył."
"Ez36,22": "Dlatego mów do domu Izraela: Tak mówi Pan BÓG: Nie dla was ja to czynię, domu Izraela, ale przez wzgląd na moje święte imię, które zbezcześciliście wśród narodów, do których przybyliście."
"Ez36,23": "I uświęcę moje wielkie imię, które było zbezczeszczone wśród narodów, które wy zbezcześciliście pośród nich. I poznają narody, że ja jestem PANEM, mówi Pan BÓG, gdy będę uświęcony w was na ich oczach."
"Ez36,24": "Zabiorę was bowiem spośród narodów, zgromadzę was ze wszystkich ziem i przyprowadzę was do waszej ziemi."
"Ez36,25": "I pokropię was czystą wodą, i będziecie czyści. Oczyszczę was ze wszystkich waszych nieczystości i ze wszystkich waszych bożków."
"Ez36,26": "I dam wam nowe serce, i włożę nowego ducha do waszego wnętrza. Wyjmę serce kamienne z waszego ciała, a dam wam serce mięsiste."
"Ez36,27": "Włożę mego Ducha do waszego wnętrza i sprawię, że będziecie chodzić według moich ustaw i będziecie przestrzegać moich sądów, i wykonywać je."
"Ez36,28": "Zamieszkacie w ziemi, którą dałem waszym ojcom, będziecie moim ludem, a ja będę waszym Bogiem."
"Ez36,29": "I wyzwolę was od wszystkich waszych nieczystości. Przywołam zboża i rozmnożę je, a nie dopuszczę do was głodu."
"Ez36,30": "Rozmnożę też owoc drzew i plony pól, abyście już nie znosili hańby głodu wśród narodów."
"Ez36,31": "Wtedy przypomnicie sobie wasze złe drogi i wasze czyny, które nie były dobre, i samych siebie będziecie się brzydzić z powodu waszych nieprawości i obrzydliwości."
"Ez36,32": "Nie ze względu na was to czynię, mówi Pan BÓG, niech wam to będzie wiadome. Wstydźcie się i rumieńcie się z powodu waszych dróg, domu Izraela."
"Ez36,33": "Tak mówi Pan BÓG: W dniu, w którym was oczyszczę ze wszystkich waszych nieprawości, zaludnię miasta i miejsca zburzone zostaną odbudowane."
"Ez36,34": "A spustoszała ziemia będzie uprawiana, zamiast być spustoszeniem na oczach wszystkich przechodniów."
"Ez36,35": "I powiedzą: Ta spustoszona ziemia stała się jak ogród Eden; miasta puste, opuszczone i zniszczone, są teraz obwarowane i zamieszkałe."
"Ez36,36": "I narody, które wokół was pozostaną, poznają, że ja, PAN, odbudowałem to, co zburzone, i zasadziłem to, co spustoszone. Ja, PAN, to powiedziałem i uczynię."
"Ez36,37": "Tak mówi Pan BÓG: Jeszcze w tym jednym dam się uprosić domowi Izraela, aby im to uczynić: Pomnożę liczbę ich ludzi jak trzodę."
"Ez36,38": "Jak trzodę na ofiary, jak trzodę Jerozolimy w czasie jej uroczystych świąt, tak spustoszone miasta będą wypełnione trzodami ludzi. I poznają, że ja jestem PANEM."
