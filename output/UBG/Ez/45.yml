"Ez45,1":
  text: "Gdy będziecie dzielić tę ziemię w dziedzictwo przez losowanie, oddacie na ofiarę PANU dział święty z tej ziemi, długi na dwadzieścia pięć tysięcy prętów i szeroki na dziesięć tysięcy. Będzie to święty dział we wszystkich waszych granicach dokoła."
  tags: []
"Ez45,2":
  text: "Z tego będzie kwadrat na świątynię pięćset prętów długości na pięćset szerokości dokoła; a wokół niego będzie wolna przestrzeń na pięćdziesiąt łokci."
  tags: []
"Ez45,3":
  text: "Z tej pierwszej miary odmierzysz dwadzieścia pięć tysięcy długości i dziesięć tysięcy szerokości, a na tym będzie świątynia i Miejsce Najświętsze."
  tags: []
"Ez45,4":
  text: "Ten święty dział ziemi będzie należeć do kapłanów pełniących służbę w świątyni, którzy przystępują, aby służyć PANU. Będzie to miejsce na ich domy i miejsce święte na świątynię."
  tags: []
"Ez45,5":
  text: "A obszar długi na dwadzieścia pięć tysięcy i szeroki na dziesięć tysięcy też będzie dla Lewitów, którzy służą w domu, na posiadłość liczącą dwadzieścia komórek."
  tags: []
"Ez45,6":
  text: "A na własność dacie miastu obszar szeroki na pięć tysięcy i długi na dwadzieścia pięć tysięcy wzdłuż działu świętej ofiary. Będzie to dla całego domu Izraela."
  tags: []
"Ez45,7":
  text: "Dla księcia będzie obszar z obu stron działu świętej ofiary i własności miasta, przed działem świętej ofiary i przed własnością miasta, od strony zachodniej ku zachodowi i od strony wschodniej ku wschodowi, a długość będzie naprzeciwko każdego z tych działów od granicy zachodniej aż do granicy wschodniej."
  tags: []
"Ez45,8":
  text: "Ten dział ziemi będzie jego posiadłością w Izraelu, a moi książęta nie będą już uciskać mojego ludu; ale wydzielą ziemię domowi Izraela według jego pokoleń."
  tags: []
"Ez45,9":
  text: "Tak mówi Pan BÓG: Dosyć tego, książęta Izraela! Zaniechajcie przemocy i grabieży, wykonujcie sąd i sprawiedliwość i wycofajcie wasze obciążenia od mego ludu, mówi Pan BÓG;"
  tags: []
"Ez45,10":
  text: "Będziecie mieli sprawiedliwe wagi, sprawiedliwą efę i sprawiedliwy bat."
  tags: []
"Ez45,11":
  text: "Efa i bat będą miały jednakową miarę, tak by bat zawierał dziesiątą część chomera, a także efa dziesiątą część chomera. Chomer będzie podstawą miary."
  tags: []
"Ez45,12":
  text: "Sykl będzie miał dwadzieścia ger. Dwadzieścia syklów, dwadzieścia pięć syklów i piętnaście syklów stanowi dla was minę."
  tags: []
"Ez45,13":
  text: "A taka będzie ofiara wzniesienia, którą będziecie ofiarowywać: szóstą część efy z chomera pszenicy; dacie również szóstą część efy z chomera jęczmienia."
  tags: []
"Ez45,14":
  text: "Ustawa dotycząca oliwy jest taka: bat jest miarą oliwy. Będziecie dawać dziesiątą część bat z kor, czyli chomer z dziesięciu bat, bo dziesięć bat stanowi chomer."
  tags: []
"Ez45,15":
  text: "Także jedną owcę z trzody liczącej dwieście owiec z bujnych pastwisk Izraela na ofiarę z pokarmów, na całopalenie i na ofiary pojednawcze, aby dokonać przebłagania za nich, mówi Pan BÓG."
  tags: []
"Ez45,16":
  text: "Cały lud tej ziemi ma składać te ofiary wzniesienia księciu w Izraelu."
  tags: []
"Ez45,17":
  text: "Na księciu będzie ciążył obowiązek całopaleń i ofiar z pokarmów i z płynów na święta, na dni nowiu, na szabaty i na wszystkie uroczyste święta domu Izraela. On będzie sprawować ofiarę za grzech, ofiarę z pokarmów i całopalną oraz ofiary pojednawcze, aby dokonać przebłagania za dom Izraela."
  tags: []
"Ez45,18":
  text: "Tak mówi Pan BÓG: Pierwszego dnia pierwszego miesiąca weźmiesz młodego cielca bez skazy i oczyścisz świątynię."
  tags: []
"Ez45,19":
  text: "Kapłan weźmie nieco krwi z ofiary za grzech i pomaże odrzwia domu, cztery narożniki podstawy tego ołtarza i odrzwia bramy dziedzińca wewnętrznego."
  tags: []
"Ez45,20":
  text: "Tak samo uczynisz siódmego dnia tego miesiąca za każdego, który zgrzeszył nieświadomie, i za prostego. Tak oczyścicie dom."
  tags: []
"Ez45,21":
  text: "W pierwszym miesiącu, czternastego dnia tego miesiąca, będziecie mieli święto Paschy, święto siedmiu dni, w których będą spożywane chleby przaśne."
  tags: []
"Ez45,22":
  text: "I w tym dniu książę złoży cielca na ofiarę za grzech za siebie i za cały lud tej ziemi."
  tags: []
"Ez45,23":
  text: "Przez siedem dni tego święta będzie ofiarowywać PANU na całopalenie siedem cielców i siedem baranów bez skazy, codziennie, przez siedem dni, a na ofiarę za grzech codziennie jednego kozła."
  tags: []
"Ez45,24":
  text: "A na ofiarę z pokarmów złoży efę na cielca, efę na barana i hin oliwy na efę."
  tags: []
"Ez45,25":
  text: "W siódmym miesiącu, piętnastego dnia tego miesiąca, w święto, będzie ofiarowywać właśnie to samo przez siedem dni, jak również ofiarę za grzech, całopalenie, ofiarę z pokarmów i oliwę."
  tags: []
