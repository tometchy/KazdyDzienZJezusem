"Ez32,1": "W dwunastym roku, w dwunastym miesiącu, pierwszego dnia tego miesiąca, doszło do mnie słowo PANA mówiące:"
"Ez32,2": "Synu człowieczy, podnieś lament nad faraonem, królem Egiptu, i powiedz mu: Jesteś podobny do młodego lwa pośród narodów, jesteś jak wieloryb w morzu, gdyż bujając po swoich rzekach, mącisz wody swoimi nogami i mieszasz jego rzeki."
"Ez32,3": "Tak mówi Pan BÓG: Rozciągnę nad tobą swoją sieć w zgromadzeniu wielu narodów, a wyciągną cię w swoim niewodzie."
"Ez32,4": "I zostawię cię na ziemi, porzucę cię na otwartym polu i sprawię, że obsiądzie cię wszelkie ptactwo niebieskie, i nasycę tobą zwierzęta całej ziemi."
"Ez32,5": "Rozrzucę twoje ciało po górach i napełnię doliny twoją wysokością."
"Ez32,6": "Twoją ziemię, w której pływasz, napoję twoją krwią aż do gór, i rzeki będą napełnione tobą."
"Ez32,7": "A gdy cię zgaszę, zakryję niebo i zaciemnię jego gwiazdy, słońce zakryję chmurą, a księżyc nie da swego światła."
"Ez32,8": "Wszystkie świecące światła na niebie zaciemnię z twojego powodu i sprowadzę ciemność na twoją ziemię, mówi Pan BÓG."
"Ez32,9": "Nadto zasmucę serce wielu narodów, gdy za moją sprawą nadejdzie wieść o twoim zniszczeniu do narodów, do ziem, których nie znałeś."
"Ez32,10": "Tak, sprawię, że zdumieje się nad tobą wiele narodów, a ich królowie bardzo się zatrwożą z twojego powodu, gdy zacznę wywijać swoim mieczem przed nimi; i będą drżeć nieustannie – każdy o swoją duszę – w dniu twego upadku."
"Ez32,11": "Tak bowiem mówi Pan BÓG: Miecz króla Babilonu spadnie na ciebie."
"Ez32,12": "Mieczami mocarzy powalę twoją rzeszę. Najokrutniejsi ze wszystkich narodów zniszczą pychę Egiptu i będzie zgładzone całe jego mnóstwo."
"Ez32,13": "Wytępię całe jego bydło znad wielkich wód, tak że nie zamąci ich stopa ludzka ani nie zamąci ich kopyto bydlęcia."
"Ez32,14": "Wtedy sprawię, że ich wody uspokoją się, a ich rzeki popłyną jak oliwa – mówi Pan BÓG."
"Ez32,15": "Gdy zamienię ziemię Egiptu w spustoszenie, a ziemia zostanie pozbawiona tego, co ją napełnia, gdy pobiję wszystkich jej mieszkańców, wtedy poznają, że ja jestem PANEM."
"Ez32,16": "To jest lament, który podniosą nad nią. Córki narodów będą ją opłakiwać. Nad Egiptem i nad całą jego rzeszą będą lamentować, mówi Pan BÓG."
"Ez32,17": "Potem, w dwunastym roku, piętnastego dnia miesiąca, doszło do mnie słowo PANA mówiące;"
"Ez32,18": "Synu człowieczy, zawódź nad rzeszą Egiptu, zepchnij ją i córki tych sławnych narodów aż do najniższych stron ziemi, do tych, którzy zstępują do dołu."
"Ez32,19": "I mów: Kogo przewyższasz pięknem? Zstąp i połóż się z nieobrzezanymi."
"Ez32,20": "Padną pośród pobitych mieczem; został wydany pod miecz, wywleczcie go z całą jego rzeszą."
"Ez32,21": "Najmocniejsi z mocarzy będą do niego mówić spośród piekła wraz z jego pomocnikami. Zstąpili tam, leżą z nieobrzezanymi pobitymi mieczem."
"Ez32,22": "Tam jest Assur i cała jego rzesza, wokół niego są jego groby; wszyscy ci pobici upadli od miecza."
"Ez32,23": "Ich groby są położone po stronach dołu, jego rzesza jest dokoła jego grobu. Ci wszyscy pobici polegli od miecza, ci, którzy szerzyli postrach w ziemi żyjących."
"Ez32,24": "Tam jest Elam i cała jego rzesza dokoła jego grobu, ci wszyscy pobici upadli od miecza i zstąpili nieobrzezani do najgłębszych stron ziemi; szerzyli swój postrach w ziemi żyjących. Już znoszą swoją hańbę z tymi, którzy zstępują do dołu."
"Ez32,25": "Postawili mu łoże pośród pobitych z całą jego rzeszą, wokół niego są jego groby. Wszyscy ci nieobrzezani są pobici mieczem. Ich postrach szerzył się w ziemi żyjących, ale już ponoszą swoją hańbę z tymi, którzy zstąpili do dołu, a wśród pobitych zostali położeni."
"Ez32,26": "Tam jest Meszek, Tubal i cała jego rzesza, i wokoło niego jego groby. Ci wszyscy nieobrzezani zostali pobici mieczem, choć szerzyli swój postrach w ziemi żyjących."
"Ez32,27": "Oni jednak nie będą leżeć z mocarzami, którzy spośród nieobrzezanych upadli i zstąpili do grobu ze swym orężem wojennym i położono im miecze pod głowy. Ich nieprawości zaś zostaną na ich kościach, chociaż byli postrachem dla mocarzy w ziemi żyjących."
"Ez32,28": "I ty będziesz skruszony wśród nieobrzezanych, i będziesz leżał pośród pobitych mieczem."
"Ez32,29": "Tam jest Edom, jego królowie i wszyscy jego książęta, którzy zostali położeni ze swoją mocą i wraz z pobitymi mieczem. Ci będą leżeć z nieobrzezanymi i z tymi, którzy zstępują do dołu."
"Ez32,30": "Tam są wszyscy książęta północy i wszyscy Sydończycy, którzy zstępują do pobitych; wstydzą się swego postrachu, jaki szerzyli swoją mocą, i leżą nieobrzezani z pobitymi mieczem. Znoszą swoją hańbę z tymi, którzy zstępują do dołu."
"Ez32,31": "Zobaczy ich faraon i ucieszy się z całej swojej rzeszy, którą pobito mieczem, faraon i całe jego wojsko – mówi Pan BÓG."
"Ez32,32": "Szerzyłem bowiem swój postrach w ziemi żyjących i zostanie położony wśród nieobrzezanych z pobitymi mieczem – faraon i cała jego rzesza – mówi Pan BÓG."
