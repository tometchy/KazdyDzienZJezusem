"Łk18,1":
  text: "Opowiedział im też przypowieść o tym, że zawsze należy się modlić i nie ustawać;"
  tags: []
"Łk18,2":
  text: "Mówiąc: W pewnym mieście był sędzia, który Boga się nie bał i z człowiekiem się nie liczył."
  tags: []
"Łk18,3":
  text: "Była też w tym mieście wdowa, która przychodziła do niego i mówiła: Pomścij moją krzywdę na moim przeciwniku."
  tags: []
"Łk18,4":
  text: "On przez długi czas nie chciał, lecz potem powiedział sobie: Chociaż Boga się nie boję i z człowiekiem się nie liczę;"
  tags: []
"Łk18,5":
  text: "To jednak, ponieważ naprzykrza mi się ta wdowa, pomszczę jej krzywdę, aby już nie przychodziła i nie zadręczała mnie."
  tags: []
"Łk18,6":
  text: "I powiedział Pan: Słuchajcie, co mówi niesprawiedliwy sędzia."
  tags: []
"Łk18,7":
  text: "A Bóg, czy nie pomści krzywdy swoich wybranych, którzy wołają do niego we dnie i w nocy, chociaż długo zwleka w ich sprawie?"
  tags: []
"Łk18,8":
  text: "Mówię wam, że szybko pomści ich krzywdę. Lecz czy Syn Człowieczy znajdzie wiarę na ziemi, gdy przyjdzie?"
  tags: []
"Łk18,9":
  text: "Powiedział też do tych, którzy ufali sobie, że są sprawiedliwi, a innych mieli za nic, taką przypowieść:"
  tags: []
"Łk18,10":
  text: "Dwóch ludzi weszło do świątyni, żeby się modlić, jeden faryzeusz, a drugi celnik."
  tags: []
"Łk18,11":
  text: "Faryzeusz stanął i tak się w sobie modlił: Dziękuję ci, Boże, że nie jestem jak inni ludzie, zdziercy, niesprawiedliwi, cudzołożnicy albo jak i ten celnik."
  tags: []
"Łk18,12":
  text: "Poszczę dwa razy w tygodniu, daję dziesięcinę ze wszystkiego, co mam."
  tags: []
"Łk18,13":
  text: "A celnik, stojąc z daleka, nie chciał nawet oczu podnieść ku niebu, ale bił się w piersi, mówiąc: Boże, bądź miłosierny mnie grzesznemu."
  tags: []
"Łk18,14":
  text: "Mówię wam, że raczej ten odszedł do swego domu usprawiedliwiony, a nie tamten. Każdy bowiem, kto się wywyższa, będzie poniżony, a kto się poniża, będzie wywyższony."
  tags: []
"Łk18,15":
  text: "Przynoszono też do niego niemowlęta, aby je dotknął. Lecz uczniowie, widząc to, gromili ich."
  tags: []
"Łk18,16":
  text: "Ale Jezus przywołał ich i powiedział: Pozwólcie dzieciom przychodzić do mnie i nie zabraniajcie im. Do takich bowiem należy królestwo Boże."
  tags: []
"Łk18,17":
  text: "Zaprawdę powiadam wam: Kto nie przyjmie królestwa Bożego jak dziecko, nie wejdzie do niego."
  tags: []
"Łk18,18":
  text: "I zapytał go pewien dostojnik: Nauczycielu dobry, co mam czynić, aby odziedziczyć życie wieczne?"
  tags: []
"Łk18,19":
  text: "A Jezus mu odpowiedział: Dlaczego nazywasz mnie dobrym? Nikt nie jest dobry, tylko jeden – Bóg."
  tags: []
"Łk18,20":
  text: "Znasz przykazania: Nie cudzołóż, nie zabijaj, nie kradnij, nie dawaj fałszywego świadectwa, czcij swego ojca i swoją matkę."
  tags: []
"Łk18,21":
  text: "A on odpowiedział: Tego wszystkiego przestrzegałem od młodości."
  tags: []
"Łk18,22":
  text: "Gdy Jezus to usłyszał, powiedział do niego: Jednego ci jeszcze brakuje. Sprzedaj wszystko, co masz, i rozdaj ubogim, a będziesz miał skarb w niebie. Potem przyjdź i chodź za mną."
  tags: []
"Łk18,23":
  text: "A on, usłyszawszy to, ogromnie się zasmucił, bo był bardzo bogaty."
  tags: []
"Łk18,24":
  text: "Kiedy Jezus zobaczył go bardzo zasmuconego, powiedział: Jakże trudno tym, którzy mają pieniądze, wejść do królestwa Bożego!"
  tags: []
"Łk18,25":
  text: "Łatwiej bowiem jest wielbłądowi przejść przez ucho igielne, niż bogatemu wejść do królestwa Bożego."
  tags: []
"Łk18,26":
  text: "Wtedy ci, którzy to słyszeli, mówili: Któż więc może być zbawiony?"
  tags: []
"Łk18,27":
  text: "A on odpowiedział: Co niemożliwe jest u ludzi, możliwe jest u Boga."
  tags: []
"Łk18,28":
  text: "Wówczas Piotr powiedział: Oto my opuściliśmy wszystko i poszliśmy za tobą."
  tags: []
"Łk18,29":
  text: "On zaś im odpowiedział: Zaprawdę powiadam wam, że nie ma nikogo, kto by opuścił dom, rodziców lub braci, żonę lub dzieci dla królestwa Bożego;"
  tags: []
"Łk18,30":
  text: "I nie otrzymał o wiele więcej w tym czasie, a w przyszłym świecie życia wiecznego."
  tags: []
"Łk18,31":
  text: "Potem wziął ze sobą dwunastu i powiedział do nich: Oto idziemy do Jerozolimy i wypełni się wszystko, co zostało napisane przez proroków o Synu Człowieczym."
  tags: []
"Łk18,32":
  text: "Będzie bowiem wydany poganom, wyśmiany, zelżony i opluty;"
  tags: []
"Łk18,33":
  text: "Ubiczują go i zabiją, ale trzeciego dnia zmartwychwstanie."
  tags: []
"Łk18,34":
  text: "Lecz oni nic z tego nie zrozumieli. Te słowa były przed nimi zakryte i nie wiedzieli, o czym była mowa."
  tags: []
"Łk18,35":
  text: "A gdy zbliżał się do Jerycha, pewien ślepiec siedział przy drodze i żebrał."
  tags: []
"Łk18,36":
  text: "A usłyszawszy przechodzący tłum, pytał, co się dzieje."
  tags: []
"Łk18,37":
  text: "I powiedziano mu, że przechodzi Jezus z Nazaretu."
  tags: []
"Łk18,38":
  text: "Wtedy zawołał: Jezusie, Synu Dawida, zmiłuj się nade mną!"
  tags: []
"Łk18,39":
  text: "Lecz ci, którzy szli z przodu, gromili go, aby milczał. On jednak jeszcze głośniej wołał: Synu Dawida, zmiłuj się nade mną!"
  tags: []
"Łk18,40":
  text: "Wtedy Jezus zatrzymał się i kazał go przyprowadzić do siebie. A gdy się zbliżył, zapytał go:"
  tags: []
"Łk18,41":
  text: "Co chcesz, abym ci uczynił? A on odpowiedział: Panie, żebym przejrzał."
  tags: []
"Łk18,42":
  text: "Jezus mu powiedział: Przejrzyj, twoja wiara cię uzdrowiła."
  tags: []
"Łk18,43":
  text: "Zaraz też odzyskał wzrok i szedł za nim, wielbiąc Boga. A wszyscy ludzie, widząc to, oddawali chwałę Bogu."
  tags: []
