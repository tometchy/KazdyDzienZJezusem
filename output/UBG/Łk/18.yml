"Łk18,1": "Opowiedział im też przypowieść o tym, że zawsze należy się modlić i nie ustawać;"
"Łk18,2": "Mówiąc: W pewnym mieście był sędzia, który Boga się nie bał i z człowiekiem się nie liczył."
"Łk18,3": "Była też w tym mieście wdowa, która przychodziła do niego i mówiła: Pomścij moją krzywdę na moim przeciwniku."
"Łk18,4": "On przez długi czas nie chciał, lecz potem powiedział sobie: Chociaż Boga się nie boję i z człowiekiem się nie liczę;"
"Łk18,5": "To jednak, ponieważ naprzykrza mi się ta wdowa, pomszczę jej krzywdę, aby już nie przychodziła i nie zadręczała mnie."
"Łk18,6": "I powiedział Pan: Słuchajcie, co mówi niesprawiedliwy sędzia."
"Łk18,7": "A Bóg, czy nie pomści krzywdy swoich wybranych, którzy wołają do niego we dnie i w nocy, chociaż długo zwleka w ich sprawie?"
"Łk18,8": "Mówię wam, że szybko pomści ich krzywdę. Lecz czy Syn Człowieczy znajdzie wiarę na ziemi, gdy przyjdzie?"
"Łk18,9": "Powiedział też do tych, którzy ufali sobie, że są sprawiedliwi, a innych mieli za nic, taką przypowieść:"
"Łk18,10": "Dwóch ludzi weszło do świątyni, żeby się modlić, jeden faryzeusz, a drugi celnik."
"Łk18,11": "Faryzeusz stanął i tak się w sobie modlił: Dziękuję ci, Boże, że nie jestem jak inni ludzie, zdziercy, niesprawiedliwi, cudzołożnicy albo jak i ten celnik."
"Łk18,12": "Poszczę dwa razy w tygodniu, daję dziesięcinę ze wszystkiego, co mam."
"Łk18,13": "A celnik, stojąc z daleka, nie chciał nawet oczu podnieść ku niebu, ale bił się w piersi, mówiąc: Boże, bądź miłosierny mnie grzesznemu."
"Łk18,14": "Mówię wam, że raczej ten odszedł do swego domu usprawiedliwiony, a nie tamten. Każdy bowiem, kto się wywyższa, będzie poniżony, a kto się poniża, będzie wywyższony."
"Łk18,15": "Przynoszono też do niego niemowlęta, aby je dotknął. Lecz uczniowie, widząc to, gromili ich."
"Łk18,16": "Ale Jezus przywołał ich i powiedział: Pozwólcie dzieciom przychodzić do mnie i nie zabraniajcie im. Do takich bowiem należy królestwo Boże."
"Łk18,17": "Zaprawdę powiadam wam: Kto nie przyjmie królestwa Bożego jak dziecko, nie wejdzie do niego."
"Łk18,18": "I zapytał go pewien dostojnik: Nauczycielu dobry, co mam czynić, aby odziedziczyć życie wieczne?"
"Łk18,19": "A Jezus mu odpowiedział: Dlaczego nazywasz mnie dobrym? Nikt nie jest dobry, tylko jeden – Bóg."
"Łk18,20": "Znasz przykazania: Nie cudzołóż, nie zabijaj, nie kradnij, nie dawaj fałszywego świadectwa, czcij swego ojca i swoją matkę."
"Łk18,21": "A on odpowiedział: Tego wszystkiego przestrzegałem od młodości."
"Łk18,22": "Gdy Jezus to usłyszał, powiedział do niego: Jednego ci jeszcze brakuje. Sprzedaj wszystko, co masz, i rozdaj ubogim, a będziesz miał skarb w niebie. Potem przyjdź i chodź za mną."
"Łk18,23": "A on, usłyszawszy to, ogromnie się zasmucił, bo był bardzo bogaty."
"Łk18,24": "Kiedy Jezus zobaczył go bardzo zasmuconego, powiedział: Jakże trudno tym, którzy mają pieniądze, wejść do królestwa Bożego!"
"Łk18,25": "Łatwiej bowiem jest wielbłądowi przejść przez ucho igielne, niż bogatemu wejść do królestwa Bożego."
"Łk18,26": "Wtedy ci, którzy to słyszeli, mówili: Któż więc może być zbawiony?"
"Łk18,27": "A on odpowiedział: Co niemożliwe jest u ludzi, możliwe jest u Boga."
"Łk18,28": "Wówczas Piotr powiedział: Oto my opuściliśmy wszystko i poszliśmy za tobą."
"Łk18,29": "On zaś im odpowiedział: Zaprawdę powiadam wam, że nie ma nikogo, kto by opuścił dom, rodziców lub braci, żonę lub dzieci dla królestwa Bożego;"
"Łk18,30": "I nie otrzymał o wiele więcej w tym czasie, a w przyszłym świecie życia wiecznego."
"Łk18,31": "Potem wziął ze sobą dwunastu i powiedział do nich: Oto idziemy do Jerozolimy i wypełni się wszystko, co zostało napisane przez proroków o Synu Człowieczym."
"Łk18,32": "Będzie bowiem wydany poganom, wyśmiany, zelżony i opluty;"
"Łk18,33": "Ubiczują go i zabiją, ale trzeciego dnia zmartwychwstanie."
"Łk18,34": "Lecz oni nic z tego nie zrozumieli. Te słowa były przed nimi zakryte i nie wiedzieli, o czym była mowa."
"Łk18,35": "A gdy zbliżał się do Jerycha, pewien ślepiec siedział przy drodze i żebrał."
"Łk18,36": "A usłyszawszy przechodzący tłum, pytał, co się dzieje."
"Łk18,37": "I powiedziano mu, że przechodzi Jezus z Nazaretu."
"Łk18,38": "Wtedy zawołał: Jezusie, Synu Dawida, zmiłuj się nade mną!"
"Łk18,39": "Lecz ci, którzy szli z przodu, gromili go, aby milczał. On jednak jeszcze głośniej wołał: Synu Dawida, zmiłuj się nade mną!"
"Łk18,40": "Wtedy Jezus zatrzymał się i kazał go przyprowadzić do siebie. A gdy się zbliżył, zapytał go:"
"Łk18,41": "Co chcesz, abym ci uczynił? A on odpowiedział: Panie, żebym przejrzał."
"Łk18,42": "Jezus mu powiedział: Przejrzyj, twoja wiara cię uzdrowiła."
"Łk18,43": "Zaraz też odzyskał wzrok i szedł za nim, wielbiąc Boga. A wszyscy ludzie, widząc to, oddawali chwałę Bogu."
