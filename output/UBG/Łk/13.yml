"Łk13,1": "W tym samym czasie niektórzy z tam obecnych oznajmili mu o Galilejczykach, których krew Piłat zmieszał z ich ofiarami."
"Łk13,2": "A Jezus im odpowiedział: Czy myślicie, że ci Galilejczycy byli większymi grzesznikami niż wszyscy inni Galilejczycy, że to ucierpieli?"
"Łk13,3": "Bynajmniej, mówię wam, lecz jeśli nie będziecie pokutować, wszyscy tak samo zginiecie."
"Łk13,4": "Albo czy myślicie, że tych osiemnastu, na których runęła wieża w Siloam i zabiła ich, było większymi winowajcami niż wszyscy ludzie mieszkający w Jerozolimie?"
"Łk13,5": "Bynajmniej, mówię wam, lecz jeśli nie będziecie pokutować, wszyscy tak samo zginiecie."
"Łk13,6": "I opowiedział im taką przypowieść: Pewien człowiek miał drzewo figowe zasadzone w swojej winnicy. Przyszedł i szukał na nim owocu, lecz nie znalazł."
"Łk13,7": "Wtedy powiedział do rolnika: Oto od trzech lat przychodzę, szukając owocu na tym drzewie figowym, lecz nie znajduję. Zetnij je, bo po co ziemię na darmo zajmuje?"
"Łk13,8": "Lecz on mu odpowiedział: Panie, zostaw je jeszcze na ten rok, aż je okopię i obłożę nawozem."
"Łk13,9": "Może wyda owoc, a jeśli nie, wtedy je zetniesz."
"Łk13,10": "I nauczał w jednej z synagog w szabat."
"Łk13,11": "A była tam kobieta, która od osiemnastu lat miała ducha niemocy i była pochylona, i w żaden sposób nie mogła się wyprostować."
"Łk13,12": "Gdy Jezus ją zobaczył, przywołał ją do siebie i powiedział: Kobieto, jesteś uwolniona od swojej choroby."
"Łk13,13": "I położył na nią ręce, a ona natychmiast wyprostowała się i chwaliła Boga."
"Łk13,14": "Wtedy przełożony synagogi, oburzony tym, że Jezus uzdrowił w szabat, powiedział do ludzi: Jest sześć dni, w których należy pracować. W te dni przychodźcie i leczcie się, a nie w dzień szabatu."
"Łk13,15": "Ale Pan mu odpowiedział: Obłudniku, czyż każdy z was w szabat nie odwiązuje swego wołu albo osła od żłobu i nie prowadzi, żeby go napoić?"
"Łk13,16": "A ta córka Abrahama, którą szatan wiązał już osiemnaście lat, czyż nie miała być uwolniona od tych więzów w dzień szabatu?"
"Łk13,17": "A gdy to mówił, zawstydzili się wszyscy jego przeciwnicy, a cały lud cieszył się ze wszystkich chwalebnych czynów dokonywanych przez niego."
"Łk13,18": "Potem Jezus powiedział: Do czego podobne jest królestwo Boże i z czym je porównam?"
"Łk13,19": "Podobne jest do ziarna gorczycy, które człowiek wziął i posiał w swoim ogrodzie. Wyrosło i stało się wielkim drzewem, a ptaki niebieskie gnieździły się w jego gałęziach."
"Łk13,20": "I znowu powiedział: Do czego przyrównam królestwo Boże?"
"Łk13,21": "Podobne jest do zakwasu, który wziąwszy, kobieta włożyła w trzy miary mąki, aż wszystko się zakwasiło."
"Łk13,22": "I nauczał, chodząc po miastach i wioskach i podążając w kierunku Jerozolimy."
"Łk13,23": "I ktoś go zapytał: Panie, czy mało jest tych, którzy będą zbawieni? On zaś im odpowiedział:"
"Łk13,24": "Usiłujcie wejść przez ciasną bramę, bo mówię wam, że wielu będzie chciało wejść, lecz nie będą mogli."
"Łk13,25": "Gdy gospodarz wstanie i zamknie drzwi, zaczniecie stać na zewnątrz i pukać do drzwi, mówiąc: Panie, Panie, otwórz nam! A on wam odpowie: Nie znam was i nie wiem, skąd jesteście."
"Łk13,26": "Wtedy zaczniecie mówić: Jedliśmy i piliśmy z tobą, i nauczałeś na naszych ulicach."
"Łk13,27": "A on powie: Mówię wam, nie znam was i nie wiem, skąd jesteście; odstąpcie ode mnie wszyscy, którzy czynicie nieprawość."
"Łk13,28": "Tam będzie płacz i zgrzytanie zębów, gdy ujrzycie Abrahama, Izaaka, Jakuba i wszystkich proroków w królestwie Bożym, a samych siebie wyrzuconych precz."
"Łk13,29": "I przyjdą inni ze wschodu i z zachodu, z północy i z południa, i zasiądą za stołem w królestwie Bożym."
"Łk13,30": "Tak oto są ostatni, którzy będą pierwszymi, i są pierwsi, którzy będą ostatnimi."
"Łk13,31": "W tym dniu przyszli niektórzy z faryzeuszy i powiedzieli mu: Wyjdź i odejdź stąd, bo Herod chce cię zabić."
"Łk13,32": "I powiedział im: Idźcie i powiedzcie temu lisowi: Oto wypędzam demony i uzdrawiam dziś i jutro, a trzeciego dnia zakończę."
"Łk13,33": "Jednak dziś, jutro i pojutrze muszę przebyć drogę, bo niemożliwe jest, aby prorok zginął poza Jerozolimą."
"Łk13,34": "Jeruzalem, Jeruzalem, które zabijasz proroków i kamienujesz tych, którzy są do ciebie posłani. Ile razy chciałem zgromadzić twoje dzieci, tak jak kokoszka gromadzi swoje kurczęta pod skrzydła, a nie chcieliście!"
"Łk13,35": "Oto wasz dom zostanie wam pusty. Zaprawdę powiadam wam, że nie ujrzycie mnie, aż przyjdzie czas, gdy powiecie: Błogosławiony, który przychodzi w imieniu Pana."
