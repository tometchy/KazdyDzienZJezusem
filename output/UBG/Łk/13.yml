"Łk13,1":
  text: "W tym samym czasie niektórzy z tam obecnych oznajmili mu o Galilejczykach, których krew Piłat zmieszał z ich ofiarami."
  tags: []
"Łk13,2":
  text: "A Jezus im odpowiedział: Czy myślicie, że ci Galilejczycy byli większymi grzesznikami niż wszyscy inni Galilejczycy, że to ucierpieli?"
  tags: []
"Łk13,3":
  text: "Bynajmniej, mówię wam, lecz jeśli nie będziecie pokutować, wszyscy tak samo zginiecie."
  tags: []
"Łk13,4":
  text: "Albo czy myślicie, że tych osiemnastu, na których runęła wieża w Siloam i zabiła ich, było większymi winowajcami niż wszyscy ludzie mieszkający w Jerozolimie?"
  tags: []
"Łk13,5":
  text: "Bynajmniej, mówię wam, lecz jeśli nie będziecie pokutować, wszyscy tak samo zginiecie."
  tags: []
"Łk13,6":
  text: "I opowiedział im taką przypowieść: Pewien człowiek miał drzewo figowe zasadzone w swojej winnicy. Przyszedł i szukał na nim owocu, lecz nie znalazł."
  tags: []
"Łk13,7":
  text: "Wtedy powiedział do rolnika: Oto od trzech lat przychodzę, szukając owocu na tym drzewie figowym, lecz nie znajduję. Zetnij je, bo po co ziemię na darmo zajmuje?"
  tags: []
"Łk13,8":
  text: "Lecz on mu odpowiedział: Panie, zostaw je jeszcze na ten rok, aż je okopię i obłożę nawozem."
  tags: []
"Łk13,9":
  text: "Może wyda owoc, a jeśli nie, wtedy je zetniesz."
  tags: []
"Łk13,10":
  text: "I nauczał w jednej z synagog w szabat."
  tags: []
"Łk13,11":
  text: "A była tam kobieta, która od osiemnastu lat miała ducha niemocy i była pochylona, i w żaden sposób nie mogła się wyprostować."
  tags: []
"Łk13,12":
  text: "Gdy Jezus ją zobaczył, przywołał ją do siebie i powiedział: Kobieto, jesteś uwolniona od swojej choroby."
  tags: []
"Łk13,13":
  text: "I położył na nią ręce, a ona natychmiast wyprostowała się i chwaliła Boga."
  tags: []
"Łk13,14":
  text: "Wtedy przełożony synagogi, oburzony tym, że Jezus uzdrowił w szabat, powiedział do ludzi: Jest sześć dni, w których należy pracować. W te dni przychodźcie i leczcie się, a nie w dzień szabatu."
  tags: []
"Łk13,15":
  text: "Ale Pan mu odpowiedział: Obłudniku, czyż każdy z was w szabat nie odwiązuje swego wołu albo osła od żłobu i nie prowadzi, żeby go napoić?"
  tags: []
"Łk13,16":
  text: "A ta córka Abrahama, którą szatan wiązał już osiemnaście lat, czyż nie miała być uwolniona od tych więzów w dzień szabatu?"
  tags: []
"Łk13,17":
  text: "A gdy to mówił, zawstydzili się wszyscy jego przeciwnicy, a cały lud cieszył się ze wszystkich chwalebnych czynów dokonywanych przez niego."
  tags: []
"Łk13,18":
  text: "Potem Jezus powiedział: Do czego podobne jest królestwo Boże i z czym je porównam?"
  tags: []
"Łk13,19":
  text: "Podobne jest do ziarna gorczycy, które człowiek wziął i posiał w swoim ogrodzie. Wyrosło i stało się wielkim drzewem, a ptaki niebieskie gnieździły się w jego gałęziach."
  tags: []
"Łk13,20":
  text: "I znowu powiedział: Do czego przyrównam królestwo Boże?"
  tags: []
"Łk13,21":
  text: "Podobne jest do zakwasu, który wziąwszy, kobieta włożyła w trzy miary mąki, aż wszystko się zakwasiło."
  tags: []
"Łk13,22":
  text: "I nauczał, chodząc po miastach i wioskach i podążając w kierunku Jerozolimy."
  tags: []
"Łk13,23":
  text: "I ktoś go zapytał: Panie, czy mało jest tych, którzy będą zbawieni? On zaś im odpowiedział:"
  tags: []
"Łk13,24":
  text: "Usiłujcie wejść przez ciasną bramę, bo mówię wam, że wielu będzie chciało wejść, lecz nie będą mogli."
  tags: []
"Łk13,25":
  text: "Gdy gospodarz wstanie i zamknie drzwi, zaczniecie stać na zewnątrz i pukać do drzwi, mówiąc: Panie, Panie, otwórz nam! A on wam odpowie: Nie znam was i nie wiem, skąd jesteście."
  tags: []
"Łk13,26":
  text: "Wtedy zaczniecie mówić: Jedliśmy i piliśmy z tobą, i nauczałeś na naszych ulicach."
  tags: []
"Łk13,27":
  text: "A on powie: Mówię wam, nie znam was i nie wiem, skąd jesteście; odstąpcie ode mnie wszyscy, którzy czynicie nieprawość."
  tags: []
"Łk13,28":
  text: "Tam będzie płacz i zgrzytanie zębów, gdy ujrzycie Abrahama, Izaaka, Jakuba i wszystkich proroków w królestwie Bożym, a samych siebie wyrzuconych precz."
  tags: []
"Łk13,29":
  text: "I przyjdą inni ze wschodu i z zachodu, z północy i z południa, i zasiądą za stołem w królestwie Bożym."
  tags: []
"Łk13,30":
  text: "Tak oto są ostatni, którzy będą pierwszymi, i są pierwsi, którzy będą ostatnimi."
  tags: []
"Łk13,31":
  text: "W tym dniu przyszli niektórzy z faryzeuszy i powiedzieli mu: Wyjdź i odejdź stąd, bo Herod chce cię zabić."
  tags: []
"Łk13,32":
  text: "I powiedział im: Idźcie i powiedzcie temu lisowi: Oto wypędzam demony i uzdrawiam dziś i jutro, a trzeciego dnia zakończę."
  tags: []
"Łk13,33":
  text: "Jednak dziś, jutro i pojutrze muszę przebyć drogę, bo niemożliwe jest, aby prorok zginął poza Jerozolimą."
  tags: []
"Łk13,34":
  text: "Jeruzalem, Jeruzalem, które zabijasz proroków i kamienujesz tych, którzy są do ciebie posłani. Ile razy chciałem zgromadzić twoje dzieci, tak jak kokoszka gromadzi swoje kurczęta pod skrzydła, a nie chcieliście!"
  tags: []
"Łk13,35":
  text: "Oto wasz dom zostanie wam pusty. Zaprawdę powiadam wam, że nie ujrzycie mnie, aż przyjdzie czas, gdy powiecie: Błogosławiony, który przychodzi w imieniu Pana."
  tags: []
