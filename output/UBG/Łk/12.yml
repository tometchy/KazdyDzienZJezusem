"Łk12,1":
  text: "Tymczasem, gdy zgromadziły się wielotysięczne tłumy, tak że jedni po drugich deptali, zaczął mówić najpierw do swoich uczniów: Strzeżcie się zakwasu faryzeuszy, którym jest obłuda."
  tags: []
"Łk12,2":
  text: "Nie ma bowiem nic ukrytego, co by nie miało być ujawnione, ani nic tajemnego, o czym by się nie miano dowiedzieć."
  tags: []
"Łk12,3":
  text: "Dlatego to, co mówiliście w ciemności, będzie słyszane w świetle, a to, co szeptaliście do ucha w pokojach, będzie rozgłaszane na dachach."
  tags: []
"Łk12,4":
  text: "A mówię wam, moim przyjaciołom: Nie bójcie się tych, którzy zabijają ciało, a potem już nic więcej nie mogą zrobić."
  tags: []
"Łk12,5":
  text: "Ale pokażę wam, kogo macie się bać. Bójcie się tego, który, gdy zabije, ma moc wrzucić do ognia piekielnego. Doprawdy, mówię wam, tego się bójcie."
  tags: []
"Łk12,6":
  text: "Czy nie sprzedają pięciu wróbli za dwa pieniążki? A jednak żaden z nich nie jest zapomniany w oczach Boga."
  tags: []
"Łk12,7":
  text: "Nawet włosy na waszej głowie wszystkie są policzone. Dlatego nie bójcie się, jesteście cenniejsi niż wiele wróbli."
  tags: []
"Łk12,8":
  text: "A mówię wam: Każdego, kto mnie wyzna przed ludźmi, tego też Syn Człowieczy wyzna przed aniołami Bożymi."
  tags: []
"Łk12,9":
  text: "Ale kto się mnie wyprze przed ludźmi, tego też ja się wyprę przed aniołami Boga."
  tags: []
"Łk12,10":
  text: "I każdemu, kto powie słowo przeciwko Synowi Człowieczemu, będzie przebaczone, ale temu, kto bluźni przeciwko Duchowi Świętemu, nie będzie przebaczone."
  tags: []
"Łk12,11":
  text: "A gdy będą was prowadzić do synagog, przełożonych i władz, nie martwcie się, jak i co macie odpowiedzieć na swoją obronę lub co macie mówić."
  tags: []
"Łk12,12":
  text: "Duch Święty bowiem nauczy was w tej właśnie godzinie, co macie mówić."
  tags: []
"Łk12,13":
  text: "I powiedział mu ktoś z tłumu: Nauczycielu, powiedz memu bratu, aby podzielił się ze mną spadkiem."
  tags: []
"Łk12,14":
  text: "Lecz on mu odpowiedział: Człowieku, któż mnie ustanowił sędzią albo rozjemcą między wami?"
  tags: []
"Łk12,15":
  text: "Powiedział też do nich: Uważajcie i strzeżcie się chciwości, gdyż nie od tego, że ktoś ma obfitość dóbr, zależy jego życie."
  tags: []
"Łk12,16":
  text: "I opowiedział im przypowieść: Pewnemu bogatemu człowiekowi pole przyniosło obfity plon."
  tags: []
"Łk12,17":
  text: "I rozważał w sobie: Cóż mam zrobić, skoro nie mam gdzie zgromadzić moich plonów?"
  tags: []
"Łk12,18":
  text: "Powiedział więc: Zrobię tak: zburzę moje spichlerze, a zbuduję większe i zgromadzę tam wszystkie moje plony i moje dobra."
  tags: []
"Łk12,19":
  text: "I powiem mojej duszy: Duszo, masz wiele dóbr złożonych na wiele lat; odpoczywaj, jedz, pij i wesel się."
  tags: []
"Łk12,20":
  text: "Ale Bóg mu powiedział: Głupcze, tej nocy zażądają od ciebie twojej duszy, a to, co przygotowałeś, czyje będzie?"
  tags: []
"Łk12,21":
  text: "Tak jest z każdym, kto gromadzi skarby dla siebie, a nie jest bogaty w Bogu."
  tags: []
"Łk12,22":
  text: "Potem powiedział do swoich uczniów: Dlatego mówię wam: Nie troszczcie się o wasze życie, co będziecie jeść, ani o ciało, w co będziecie się ubierać."
  tags: []
"Łk12,23":
  text: "Życie jest czymś więcej niż pokarm, a ciało niż ubranie."
  tags: []
"Łk12,24":
  text: "Przypatrzcie się krukom, że nie sieją ani nie żną, nie mają spiżarni ani spichlerza, a jednak Bóg je żywi. O ileż cenniejsi jesteście wy niż ptaki!"
  tags: []
"Łk12,25":
  text: "I któż z was, martwiąc się, może dodać do swego wzrostu jeden łokieć?"
  tags: []
"Łk12,26":
  text: "Jeśli więc najmniejszej rzeczy nie możecie uczynić, czemu troszczycie się o inne?"
  tags: []
"Łk12,27":
  text: "Przypatrzcie się liliom, jak rosną: nie pracują ani nie przędą, a mówię wam, że nawet Salomon w całej swojej chwale nie był tak ubrany, jak jedna z nich."
  tags: []
"Łk12,28":
  text: "A jeśli trawę, która dziś jest na polu, a jutro będzie wrzucona do pieca, Bóg tak ubiera, o ileż bardziej was, ludzie małej wiary?"
  tags: []
"Łk12,29":
  text: "Nie pytajcie więc, co będziecie jeść lub co będziecie pić, ani nie martwcie się o to."
  tags: []
"Łk12,30":
  text: "O to wszystko bowiem zabiegają narody świata. Lecz wasz Ojciec wie, że tego potrzebujecie."
  tags: []
"Łk12,31":
  text: "Szukajcie raczej królestwa Bożego, a to wszystko będzie wam dodane."
  tags: []
"Łk12,32":
  text: "Nie bój się, mała trzódko, gdyż upodobało się waszemu Ojcu dać wam królestwo."
  tags: []
"Łk12,33":
  text: "Sprzedawajcie, co posiadacie, i dawajcie jałmużnę. Przygotujcie sobie sakiewki, które nie starzeją się, skarb w niebie, którego nie ubywa, gdzie złodziej nie ma dostępu ani mól nie niszczy."
  tags: []
"Łk12,34":
  text: "Bo gdzie jest wasz skarb, tam będzie też wasze serce."
  tags: []
"Łk12,35":
  text: "Niech będą przepasane wasze biodra i zapalone lampy."
  tags: []
"Łk12,36":
  text: "A wy bądźcie podobni do ludzi oczekujących swego pana, aż wróci z wesela, aby gdy przyjdzie i zapuka, zaraz mu otworzyć."
  tags: []
"Łk12,37":
  text: "Błogosławieni ci słudzy, których pan, gdy przyjdzie, zastanie czuwających. Zaprawdę powiadam wam, że się przepasze i posadzi ich za stołem, a obchodząc, będzie im usługiwał."
  tags: []
"Łk12,38":
  text: "Jeśli przyjdzie o drugiej czy o trzeciej straży i tak ich zastanie, błogosławieni są ci słudzy."
  tags: []
"Łk12,39":
  text: "A to wiedzcie, że gdyby gospodarz znał godzinę, o której ma przyjść złodziej, czuwałby i nie pozwoliłby włamać się do swego domu."
  tags: []
"Łk12,40":
  text: "Dlatego i wy bądźcie gotowi, bo Syn Człowieczy przyjdzie o godzinie, której się nie spodziewacie."
  tags: []
"Łk12,41":
  text: "Wtedy Piotr go zapytał: Panie, czy tę przypowieść mówisz do nas, czy też do wszystkich?"
  tags: []
"Łk12,42":
  text: "A Pan odpowiedział: Któż więc jest szafarzem wiernym i roztropnym, którego Pan ustanowi nad swoją służbą, aby we właściwym czasie wydawał jej wyznaczoną żywność?"
  tags: []
"Łk12,43":
  text: "Błogosławiony ten sługa, którego pan, gdy przyjdzie, zastanie tak czyniącego."
  tags: []
"Łk12,44":
  text: "Zaprawdę powiadam wam, że postawi go nad wszystkimi swoimi dobrami."
  tags: []
"Łk12,45":
  text: "Ale jeśli ten sługa powie w swoim sercu: Mój pan zwleka ze swoim przyjściem, i zacznie bić sługi i służące, jeść, pić i upijać się;"
  tags: []
"Łk12,46":
  text: "Przyjdzie pan tego sługi w dniu, w którym się nie spodziewa i o godzinie, której nie zna, i odłączy go, i wyznaczy mu dział z niewierzącymi."
  tags: []
"Łk12,47":
  text: "Ten zaś sługa, który znał wolę swego pana, a nie był gotowy i nie postąpił według jego woli, otrzyma wielką chłostę."
  tags: []
"Łk12,48":
  text: "Lecz ten, który jej nie znał i uczynił coś godnego kary, otrzyma małą chłostę. Komu wiele dano, od tego wiele się będzie wymagać, a komu wiele powierzono, więcej będzie się od niego żądać."
  tags: []
"Łk12,49":
  text: "Przyszedłem, aby rzucić ogień na ziemię, i czegóż pragnę, skoro już zapłonął?"
  tags: []
"Łk12,50":
  text: "Lecz chrztem mam być ochrzczony i jakże jestem udręczony, aż się to dopełni."
  tags: []
"Łk12,51":
  text: "Czy myślicie, że przyszedłem dać ziemi pokój? Bynajmniej, mówię wam, raczej rozłam."
  tags: []
"Łk12,52":
  text: "Odtąd bowiem w jednym domu będzie pięciu poróżnionych, trzech przeciwko dwom, a dwóch przeciwko trzem."
  tags: []
"Łk12,53":
  text: "Ojciec powstanie przeciwko synowi, a syn przeciwko ojcu, matka przeciwko córce, a córka przeciwko matce, teściowa przeciwko synowej, a synowa przeciwko teściowej."
  tags: []
"Łk12,54":
  text: "Mówił też do ludu: Gdy widzicie chmurę pojawiającą się od zachodu, zaraz mówicie: Nadchodzi ulewny deszcz. I tak jest."
  tags: []
"Łk12,55":
  text: "A gdy wieje wiatr z południa, mówicie: Będzie gorąco. I tak jest."
  tags: []
"Łk12,56":
  text: "Obłudnicy, wygląd nieba i ziemi umiecie rozpoznawać, jakże więc obecnego czasu nie rozpoznajecie?"
  tags: []
"Łk12,57":
  text: "Dlaczego sami z siebie nie umiecie osądzić, co jest sprawiedliwe?"
  tags: []
"Łk12,58":
  text: "Gdy więc idziesz ze swoim przeciwnikiem do urzędnika, staraj się w drodze dojść z nim do zgody, aby cię nie zaciągnął przed sędziego, a sędzia przekazałby cię strażnikowi, a strażnik wtrąciłby cię do więzienia."
  tags: []
"Łk12,59":
  text: "Mówię ci, że nie wyjdziesz stamtąd, dopóki nie oddasz ostatniego grosza."
  tags: []
