"Łk7,1":
  text: "Gdy skończył mówić wszystkie te słowa w obecności ludzi, wszedł do Kafarnaum."
  tags: []
"Łk7,2":
  text: "A sługa pewnego setnika, bardzo przez niego ceniony, chorował i był bliski śmierci."
  tags: []
"Łk7,3":
  text: "Kiedy setnik usłyszał o Jezusie, posłał do niego starszych spośród Żydów, prosząc, aby przyszedł i uzdrowił jego sługę."
  tags: []
"Łk7,4":
  text: "A oni przyszli do Jezusa i prosili go usilnie: Godny jest, abyś mu to uczynił."
  tags: []
"Łk7,5":
  text: "Miłuje bowiem nasz naród i zbudował nam synagogę."
  tags: []
"Łk7,6":
  text: "Wtedy Jezus poszedł z nimi. Ale gdy był już niedaleko domu, setnik posłał do niego przyjaciół ze słowami: Panie, nie trudź się, bo nie jestem godny, abyś wszedł pod mój dach."
  tags: []
"Łk7,7":
  text: "Dlatego i samego siebie nie uważałem za godnego przyjść do ciebie. Lecz powiedz słowo, a mój sługa zostanie uzdrowiony."
  tags: []
"Łk7,8":
  text: "Bo i ja jestem człowiekiem podległym władzy i mam pod sobą żołnierzy, i mówię jednemu: Idź, a idzie, a drugiemu: Chodź tu, a przychodzi, a mojemu słudze: Zrób to, a robi."
  tags: []
"Łk7,9":
  text: "Gdy Jezus to usłyszał, zdziwił się i odwróciwszy się, powiedział do ludzi, którzy szli za nim: Mówię wam, nawet w Izraelu nie znalazłem tak wielkiej wiary."
  tags: []
"Łk7,10":
  text: "Ci zaś, którzy byli posłani, po powrocie do domu zastali zdrowym sługę, który chorował."
  tags: []
"Łk7,11":
  text: "A nazajutrz udał się do miasta zwanego Nain. I szło z nim wielu jego uczniów i mnóstwo ludzi."
  tags: []
"Łk7,12":
  text: "A gdy zbliżył się do bramy miasta, właśnie wynoszono zmarłego, jedynego syna matki, która była wdową. Towarzyszyło jej mnóstwo ludzi z miasta."
  tags: []
"Łk7,13":
  text: "Kiedy Pan ją zobaczył, ulitował się nad nią i powiedział do niej: Nie płacz."
  tags: []
"Łk7,14":
  text: "Potem podszedł i dotknął mar, a ci, którzy je nieśli, stanęli. I powiedział: Młodzieńcze, mówię ci, wstań!"
  tags: []
"Łk7,15":
  text: "A ten, który był martwy, usiadł i zaczął mówić. I oddał go jego matce."
  tags: []
"Łk7,16":
  text: "Wtedy wszystkich ogarnął strach i wielbili Boga, mówiąc: Wielki prorok powstał wśród nas, oraz: Bóg nawiedził swój lud."
  tags: []
"Łk7,17":
  text: "I rozeszła się ta wieść o nim po całej Judei i po całej okolicznej krainie."
  tags: []
"Łk7,18":
  text: "O tym wszystkim oznajmili Janowi jego uczniowie."
  tags: []
"Łk7,19":
  text: "A Jan, wezwawszy dwóch spośród swoich uczniów, posłał ich do Jezusa z zapytaniem: Czy ty jesteś tym, który ma przyjść, czy mamy oczekiwać innego?"
  tags: []
"Łk7,20":
  text: "A gdy ci mężczyźni przyszli do niego, powiedzieli: Jan Chrzciciel przysłał nas do ciebie z zapytaniem: Czy ty jesteś tym, który ma przyjść, czy mamy oczekiwać innego?"
  tags: []
"Łk7,21":
  text: "A w tym właśnie czasie wielu uzdrowił z chorób i dolegliwości i uwolnił od złych duchów, a wielu ślepych obdarzył wzrokiem."
  tags: []
"Łk7,22":
  text: "Jezus więc odpowiedział im: Idźcie i oznajmijcie Janowi to, co widzieliście i słyszeliście: Ślepi widzą, chromi chodzą, trędowaci zostają oczyszczeni, głusi słyszą, umarli zmartwychwstają, a ubogim głoszona jest ewangelia."
  tags: []
"Łk7,23":
  text: "A błogosławiony jest ten, kto się nie zgorszy z mojego powodu."
  tags: []
"Łk7,24":
  text: "Gdy zaś posłańcy Jana odeszli, zaczął mówić do ludzi o Janie: Co wyszliście zobaczyć na pustyni? Trzcinę kołyszącą się na wietrze?"
  tags: []
"Łk7,25":
  text: "Ale co wyszliście zobaczyć? Człowieka ubranego w miękkie szaty? Oto ci, którzy noszą kosztowne szaty i żyją w rozkoszach, są w domach królewskich."
  tags: []
"Łk7,26":
  text: "Ale co wyszliście zobaczyć? Proroka? Tak, mówię wam, nawet więcej niż proroka."
  tags: []
"Łk7,27":
  text: "On jest tym, o którym jest napisane: Oto posyłam mego posłańca przed twoim obliczem, który przygotuje twoją drogę przed tobą."
  tags: []
"Łk7,28":
  text: "Mówię wam bowiem: Nie ma wśród narodzonych z kobiet większego proroka od Jana Chrzciciela. Lecz ten, kto jest najmniejszy w królestwie Bożym, jest większy niż on."
  tags: []
"Łk7,29":
  text: "Słysząc to, wszyscy ludzie, jak również celnicy, przyznawali słuszność Bogu, będąc ochrzczeni chrztem Jana."
  tags: []
"Łk7,30":
  text: "Ale faryzeusze i znawcy prawa odrzucili radę Boga sami przeciwko sobie, nie dając się przez niego ochrzcić."
  tags: []
"Łk7,31":
  text: "I powiedział Pan: Do kogo więc przyrównam ludzi tego pokolenia? Do kogo są podobni?"
  tags: []
"Łk7,32":
  text: "Podobni są do dzieci, które siedzą na rynku i wołają jedne na drugie: Graliśmy wam na flecie, a nie tańczyliście, śpiewaliśmy pieśni żałobne, a nie płakaliście."
  tags: []
"Łk7,33":
  text: "Przyszedł bowiem Jan Chrzciciel, nie jadł chleba i nie pił wina, a mówicie: Ma demona."
  tags: []
"Łk7,34":
  text: "Przyszedł Syn Człowieczy, jedząc i pijąc, a mówicie: Oto żarłok i pijak, przyjaciel celników i grzeszników."
  tags: []
"Łk7,35":
  text: "Lecz usprawiedliwiona jest mądrość przez wszystkie swoje dzieci."
  tags: []
"Łk7,36":
  text: "I zaprosił go jeden z faryzeuszy na wspólny posiłek. Wszedł więc do domu faryzeusza i usiadł przy stole."
  tags: []
"Łk7,37":
  text: "A oto kobieta, grzesznica, która była w tym mieście, dowiedziawszy się, że siedzi przy stole w domu faryzeusza, przyniosła alabastrowe naczynie olejku;"
  tags: []
"Łk7,38":
  text: "I stanąwszy z tyłu u jego nóg, płacząc, zaczęła łzami obmywać jego nogi, wycierała je włosami swojej głowy, całowała i namaszczała olejkiem."
  tags: []
"Łk7,39":
  text: "A widząc to, faryzeusz, który go zaprosił, pomyślał sobie: Gdyby on był prorokiem, wiedziałby, kim i jaka jest ta kobieta, która go dotyka. Jest bowiem grzesznicą."
  tags: []
"Łk7,40":
  text: "A Jezus odezwał się do niego: Szymonie, mam ci coś do powiedzenia. A on odrzekł: Powiedz, Nauczycielu."
  tags: []
"Łk7,41":
  text: "Pewien wierzyciel miał dwóch dłużników. Jeden był winien pięćset groszy, a drugi pięćdziesiąt."
  tags: []
"Łk7,42":
  text: "A gdy nie mieli z czego oddać, darował obydwóm. Powiedz więc, który z nich będzie go bardziej miłował?"
  tags: []
"Łk7,43":
  text: "Szymon odpowiedział: Sądzę, że ten, któremu więcej darował. A on mu powiedział: Słusznie osądziłeś."
  tags: []
"Łk7,44":
  text: "I odwróciwszy się do kobiety, powiedział do Szymona: Widzisz tę kobietę? Wszedłem do twego domu, a nie podałeś mi wody do nóg, ona zaś łzami obmyła moje nogi i otarła je swoimi włosami."
  tags: []
"Łk7,45":
  text: "Nie pocałowałeś mnie, a ona, odkąd wszedłem, nie przestała całować moich nóg."
  tags: []
"Łk7,46":
  text: "Nie namaściłeś mi głowy oliwą, a ona olejkiem namaściła moje nogi."
  tags: []
"Łk7,47":
  text: "Dlatego mówię ci: Przebaczono jej wiele grzechów, gdyż bardzo umiłowała. A komu mało przebaczono, mało miłuje."
  tags: []
"Łk7,48":
  text: "Do niej zaś powiedział: Twoje grzechy są przebaczone."
  tags: []
"Łk7,49":
  text: "Wtedy współbiesiadnicy zaczęli mówić między sobą: Kim jest ten, który i grzechy przebacza?"
  tags: []
"Łk7,50":
  text: "I powiedział do kobiety: Twoja wiara cię zbawiła. Idź w pokoju."
  tags: []
