"Łk7,1": "Gdy skończył mówić wszystkie te słowa w obecności ludzi, wszedł do Kafarnaum."
"Łk7,2": "A sługa pewnego setnika, bardzo przez niego ceniony, chorował i był bliski śmierci."
"Łk7,3": "Kiedy setnik usłyszał o Jezusie, posłał do niego starszych spośród Żydów, prosząc, aby przyszedł i uzdrowił jego sługę."
"Łk7,4": "A oni przyszli do Jezusa i prosili go usilnie: Godny jest, abyś mu to uczynił."
"Łk7,5": "Miłuje bowiem nasz naród i zbudował nam synagogę."
"Łk7,6": "Wtedy Jezus poszedł z nimi. Ale gdy był już niedaleko domu, setnik posłał do niego przyjaciół ze słowami: Panie, nie trudź się, bo nie jestem godny, abyś wszedł pod mój dach."
"Łk7,7": "Dlatego i samego siebie nie uważałem za godnego przyjść do ciebie. Lecz powiedz słowo, a mój sługa zostanie uzdrowiony."
"Łk7,8": "Bo i ja jestem człowiekiem podległym władzy i mam pod sobą żołnierzy, i mówię jednemu: Idź, a idzie, a drugiemu: Chodź tu, a przychodzi, a mojemu słudze: Zrób to, a robi."
"Łk7,9": "Gdy Jezus to usłyszał, zdziwił się i odwróciwszy się, powiedział do ludzi, którzy szli za nim: Mówię wam, nawet w Izraelu nie znalazłem tak wielkiej wiary."
"Łk7,10": "Ci zaś, którzy byli posłani, po powrocie do domu zastali zdrowym sługę, który chorował."
"Łk7,11": "A nazajutrz udał się do miasta zwanego Nain. I szło z nim wielu jego uczniów i mnóstwo ludzi."
"Łk7,12": "A gdy zbliżył się do bramy miasta, właśnie wynoszono zmarłego, jedynego syna matki, która była wdową. Towarzyszyło jej mnóstwo ludzi z miasta."
"Łk7,13": "Kiedy Pan ją zobaczył, ulitował się nad nią i powiedział do niej: Nie płacz."
"Łk7,14": "Potem podszedł i dotknął mar, a ci, którzy je nieśli, stanęli. I powiedział: Młodzieńcze, mówię ci, wstań!"
"Łk7,15": "A ten, który był martwy, usiadł i zaczął mówić. I oddał go jego matce."
"Łk7,16": "Wtedy wszystkich ogarnął strach i wielbili Boga, mówiąc: Wielki prorok powstał wśród nas, oraz: Bóg nawiedził swój lud."
"Łk7,17": "I rozeszła się ta wieść o nim po całej Judei i po całej okolicznej krainie."
"Łk7,18": "O tym wszystkim oznajmili Janowi jego uczniowie."
"Łk7,19": "A Jan, wezwawszy dwóch spośród swoich uczniów, posłał ich do Jezusa z zapytaniem: Czy ty jesteś tym, który ma przyjść, czy mamy oczekiwać innego?"
"Łk7,20": "A gdy ci mężczyźni przyszli do niego, powiedzieli: Jan Chrzciciel przysłał nas do ciebie z zapytaniem: Czy ty jesteś tym, który ma przyjść, czy mamy oczekiwać innego?"
"Łk7,21": "A w tym właśnie czasie wielu uzdrowił z chorób i dolegliwości i uwolnił od złych duchów, a wielu ślepych obdarzył wzrokiem."
"Łk7,22": "Jezus więc odpowiedział im: Idźcie i oznajmijcie Janowi to, co widzieliście i słyszeliście: Ślepi widzą, chromi chodzą, trędowaci zostają oczyszczeni, głusi słyszą, umarli zmartwychwstają, a ubogim głoszona jest ewangelia."
"Łk7,23": "A błogosławiony jest ten, kto się nie zgorszy z mojego powodu."
"Łk7,24": "Gdy zaś posłańcy Jana odeszli, zaczął mówić do ludzi o Janie: Co wyszliście zobaczyć na pustyni? Trzcinę kołyszącą się na wietrze?"
"Łk7,25": "Ale co wyszliście zobaczyć? Człowieka ubranego w miękkie szaty? Oto ci, którzy noszą kosztowne szaty i żyją w rozkoszach, są w domach królewskich."
"Łk7,26": "Ale co wyszliście zobaczyć? Proroka? Tak, mówię wam, nawet więcej niż proroka."
"Łk7,27": "On jest tym, o którym jest napisane: Oto posyłam mego posłańca przed twoim obliczem, który przygotuje twoją drogę przed tobą."
"Łk7,28": "Mówię wam bowiem: Nie ma wśród narodzonych z kobiet większego proroka od Jana Chrzciciela. Lecz ten, kto jest najmniejszy w królestwie Bożym, jest większy niż on."
"Łk7,29": "Słysząc to, wszyscy ludzie, jak również celnicy, przyznawali słuszność Bogu, będąc ochrzczeni chrztem Jana."
"Łk7,30": "Ale faryzeusze i znawcy prawa odrzucili radę Boga sami przeciwko sobie, nie dając się przez niego ochrzcić."
"Łk7,31": "I powiedział Pan: Do kogo więc przyrównam ludzi tego pokolenia? Do kogo są podobni?"
"Łk7,32": "Podobni są do dzieci, które siedzą na rynku i wołają jedne na drugie: Graliśmy wam na flecie, a nie tańczyliście, śpiewaliśmy pieśni żałobne, a nie płakaliście."
"Łk7,33": "Przyszedł bowiem Jan Chrzciciel, nie jadł chleba i nie pił wina, a mówicie: Ma demona."
"Łk7,34": "Przyszedł Syn Człowieczy, jedząc i pijąc, a mówicie: Oto żarłok i pijak, przyjaciel celników i grzeszników."
"Łk7,35": "Lecz usprawiedliwiona jest mądrość przez wszystkie swoje dzieci."
"Łk7,36": "I zaprosił go jeden z faryzeuszy na wspólny posiłek. Wszedł więc do domu faryzeusza i usiadł przy stole."
"Łk7,37": "A oto kobieta, grzesznica, która była w tym mieście, dowiedziawszy się, że siedzi przy stole w domu faryzeusza, przyniosła alabastrowe naczynie olejku;"
"Łk7,38": "I stanąwszy z tyłu u jego nóg, płacząc, zaczęła łzami obmywać jego nogi, wycierała je włosami swojej głowy, całowała i namaszczała olejkiem."
"Łk7,39": "A widząc to, faryzeusz, który go zaprosił, pomyślał sobie: Gdyby on był prorokiem, wiedziałby, kim i jaka jest ta kobieta, która go dotyka. Jest bowiem grzesznicą."
"Łk7,40": "A Jezus odezwał się do niego: Szymonie, mam ci coś do powiedzenia. A on odrzekł: Powiedz, Nauczycielu."
"Łk7,41": "Pewien wierzyciel miał dwóch dłużników. Jeden był winien pięćset groszy, a drugi pięćdziesiąt."
"Łk7,42": "A gdy nie mieli z czego oddać, darował obydwóm. Powiedz więc, który z nich będzie go bardziej miłował?"
"Łk7,43": "Szymon odpowiedział: Sądzę, że ten, któremu więcej darował. A on mu powiedział: Słusznie osądziłeś."
"Łk7,44": "I odwróciwszy się do kobiety, powiedział do Szymona: Widzisz tę kobietę? Wszedłem do twego domu, a nie podałeś mi wody do nóg, ona zaś łzami obmyła moje nogi i otarła je swoimi włosami."
"Łk7,45": "Nie pocałowałeś mnie, a ona, odkąd wszedłem, nie przestała całować moich nóg."
"Łk7,46": "Nie namaściłeś mi głowy oliwą, a ona olejkiem namaściła moje nogi."
"Łk7,47": "Dlatego mówię ci: Przebaczono jej wiele grzechów, gdyż bardzo umiłowała. A komu mało przebaczono, mało miłuje."
"Łk7,48": "Do niej zaś powiedział: Twoje grzechy są przebaczone."
"Łk7,49": "Wtedy współbiesiadnicy zaczęli mówić między sobą: Kim jest ten, który i grzechy przebacza?"
"Łk7,50": "I powiedział do kobiety: Twoja wiara cię zbawiła. Idź w pokoju."
