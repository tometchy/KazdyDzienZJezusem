"Łk17,1": "I powiedział do uczniów: Nie jest możliwe, żeby nie przyszły zgorszenia, lecz biada temu, przez którego przychodzą!"
"Łk17,2": "Lepiej byłoby dla niego, gdyby zawieszono mu u szyi kamień młyński i wrzucono go do morza, niż żeby miał zgorszyć jednego z tych małych."
"Łk17,3": "Miejcie się na baczności. Jeśli twój brat zgrzeszy przeciwko tobie, strofuj go, a jeśli żałuje, przebacz mu."
"Łk17,4": "A jeśli siedem razy na dzień zgrzeszy przeciwko tobie i siedem razy w ciągu dnia zwróci się do ciebie, mówiąc: Żałuję tego – przebacz mu."
"Łk17,5": "I powiedzieli apostołowie do Pana: Dodaj nam wiary."
"Łk17,6": "A Pan odpowiedział: Gdybyście mieli wiarę jak ziarno gorczycy i powiedzielibyście temu drzewu morwy: Wyrwij się z korzeniem i przesadź się do morza, usłuchałoby was."
"Łk17,7": "Kto z was, mając sługę, który orze albo pasie, powie mu, gdy wróci z pola: Chodź i usiądź za stołem?"
"Łk17,8": "Czy nie powie mu raczej: Przygotuj mi kolację, przepasz się i usługuj mi, aż się najem i napiję, a potem i ty będziesz jadł i pił?"
"Łk17,9": "Czy dziękuje słudze, że zrobił to, co mu nakazano? Nie wydaje mi się."
"Łk17,10": "Także i wy, gdy zrobicie wszystko, co wam nakazano, mówcie: Sługami nieużytecznymi jesteśmy. Zrobiliśmy to, co powinniśmy byli zrobić."
"Łk17,11": "A w drodze do Jerozolimy przechodził przez pogranicze Samarii i Galilei."
"Łk17,12": "Gdy wchodził do pewnej wioski, wyszło mu naprzeciw dziesięciu trędowatych mężczyzn, którzy stanęli z daleka."
"Łk17,13": "I donośnym głosem zawołali: Jezusie, Mistrzu, zmiłuj się nad nami!"
"Łk17,14": "Kiedy ich zobaczył, powiedział do nich: Idźcie, pokażcie się kapłanom. A gdy szli, zostali oczyszczeni."
"Łk17,15": "Lecz jeden z nich, widząc, że został uzdrowiony, wrócił, chwaląc Boga donośnym głosem."
"Łk17,16": "I upadł na twarz do jego nóg, dziękując mu. A był to Samarytanin."
"Łk17,17": "Jezus zaś odezwał się: Czyż nie dziesięciu zostało oczyszczonych? Gdzie jest dziewięciu?"
"Łk17,18": "Nie znalazł się nikt, kto by wrócił i oddał chwałę Bogu, tylko ten cudzoziemiec."
"Łk17,19": "I powiedział do niego: Wstań, idź! Twoja wiara cię uzdrowiła."
"Łk17,20": "Zapytany zaś przez faryzeuszy, kiedy przyjdzie królestwo Boże, odpowiedział im: Królestwo Boże nie przyjdzie dostrzegalnie."
"Łk17,21": "I nie powiedzą: Oto tu, albo: Oto tam jest. Królestwo Boże bowiem jest wewnątrz was."
"Łk17,22": "A do uczniów powiedział: Przyjdzie czas, kiedy będziecie pragnęli zobaczyć jeden z dni Syna Człowieczego, ale nie zobaczycie."
"Łk17,23": "I powiedzą wam: Oto tu, albo: Oto tam jest. Nie chodźcie tam ani nie idźcie za nimi."
"Łk17,24": "Bo jak błyskawica, gdy zabłyśnie, świeci od jednego krańca nieba aż po drugi, tak będzie i z Synem Człowieczym w jego dniu."
"Łk17,25": "Ale najpierw musi wiele cierpieć i zostać odrzucony przez to pokolenie."
"Łk17,26": "A jak było za dni Noego, tak będzie i za dni Syna Człowieczego:"
"Łk17,27": "Jedli, pili, żenili się i za mąż wychodziły aż do dnia, w którym Noe wszedł do arki; i nastał potop, i wszystkich wytracił."
"Łk17,28": "Podobnie jak działo się za dni Lota: jedli, pili, kupowali, sprzedawali, sadzili, budowali;"
"Łk17,29": "Lecz tego dnia, gdy Lot wyszedł z Sodomy, spadł z nieba deszcz ognia i siarki i wszystkich wytracił."
"Łk17,30": "Tak też będzie w dniu, kiedy Syn Człowieczy się objawi."
"Łk17,31": "Tego dnia, jeśli ktoś będzie na dachu, a jego rzeczy w domu, niech nie schodzi, aby je zabrać, a kto będzie na polu, niech również nie wraca."
"Łk17,32": "Pamiętajcie żonę Lota."
"Łk17,33": "Kto chce zachować swoje życie, straci je, a kto je straci, zachowa je."
"Łk17,34": "Mówię wam: Tej nocy dwóch będzie w jednym łóżku, jeden będzie wzięty, a drugi zostawiony."
"Łk17,35": "Dwie będą mleć razem, jedna będzie wzięta, a druga zostawiona."
"Łk17,36": "Dwaj będą na polu, jeden będzie wzięty, a drugi zostawiony."
"Łk17,37": "I pytali go: Gdzie, Panie? A on im powiedział: Gdzie jest ciało, tam zgromadzą się i orły."
