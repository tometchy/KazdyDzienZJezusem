"Łk17,1":
  text: "I powiedział do uczniów: Nie jest możliwe, żeby nie przyszły zgorszenia, lecz biada temu, przez którego przychodzą!"
  tags: []
"Łk17,2":
  text: "Lepiej byłoby dla niego, gdyby zawieszono mu u szyi kamień młyński i wrzucono go do morza, niż żeby miał zgorszyć jednego z tych małych."
  tags: []
"Łk17,3":
  text: "Miejcie się na baczności. Jeśli twój brat zgrzeszy przeciwko tobie, strofuj go, a jeśli żałuje, przebacz mu."
  tags: []
"Łk17,4":
  text: "A jeśli siedem razy na dzień zgrzeszy przeciwko tobie i siedem razy w ciągu dnia zwróci się do ciebie, mówiąc: Żałuję tego – przebacz mu."
  tags: []
"Łk17,5":
  text: "I powiedzieli apostołowie do Pana: Dodaj nam wiary."
  tags: []
"Łk17,6":
  text: "A Pan odpowiedział: Gdybyście mieli wiarę jak ziarno gorczycy i powiedzielibyście temu drzewu morwy: Wyrwij się z korzeniem i przesadź się do morza, usłuchałoby was."
  tags: []
"Łk17,7":
  text: "Kto z was, mając sługę, który orze albo pasie, powie mu, gdy wróci z pola: Chodź i usiądź za stołem?"
  tags: []
"Łk17,8":
  text: "Czy nie powie mu raczej: Przygotuj mi kolację, przepasz się i usługuj mi, aż się najem i napiję, a potem i ty będziesz jadł i pił?"
  tags: []
"Łk17,9":
  text: "Czy dziękuje słudze, że zrobił to, co mu nakazano? Nie wydaje mi się."
  tags: []
"Łk17,10":
  text: "Także i wy, gdy zrobicie wszystko, co wam nakazano, mówcie: Sługami nieużytecznymi jesteśmy. Zrobiliśmy to, co powinniśmy byli zrobić."
  tags: []
"Łk17,11":
  text: "A w drodze do Jerozolimy przechodził przez pogranicze Samarii i Galilei."
  tags: []
"Łk17,12":
  text: "Gdy wchodził do pewnej wioski, wyszło mu naprzeciw dziesięciu trędowatych mężczyzn, którzy stanęli z daleka."
  tags: []
"Łk17,13":
  text: "I donośnym głosem zawołali: Jezusie, Mistrzu, zmiłuj się nad nami!"
  tags: []
"Łk17,14":
  text: "Kiedy ich zobaczył, powiedział do nich: Idźcie, pokażcie się kapłanom. A gdy szli, zostali oczyszczeni."
  tags: []
"Łk17,15":
  text: "Lecz jeden z nich, widząc, że został uzdrowiony, wrócił, chwaląc Boga donośnym głosem."
  tags: []
"Łk17,16":
  text: "I upadł na twarz do jego nóg, dziękując mu. A był to Samarytanin."
  tags: []
"Łk17,17":
  text: "Jezus zaś odezwał się: Czyż nie dziesięciu zostało oczyszczonych? Gdzie jest dziewięciu?"
  tags: []
"Łk17,18":
  text: "Nie znalazł się nikt, kto by wrócił i oddał chwałę Bogu, tylko ten cudzoziemiec."
  tags: []
"Łk17,19":
  text: "I powiedział do niego: Wstań, idź! Twoja wiara cię uzdrowiła."
  tags: []
"Łk17,20":
  text: "Zapytany zaś przez faryzeuszy, kiedy przyjdzie królestwo Boże, odpowiedział im: Królestwo Boże nie przyjdzie dostrzegalnie."
  tags: []
"Łk17,21":
  text: "I nie powiedzą: Oto tu, albo: Oto tam jest. Królestwo Boże bowiem jest wewnątrz was."
  tags: []
"Łk17,22":
  text: "A do uczniów powiedział: Przyjdzie czas, kiedy będziecie pragnęli zobaczyć jeden z dni Syna Człowieczego, ale nie zobaczycie."
  tags: []
"Łk17,23":
  text: "I powiedzą wam: Oto tu, albo: Oto tam jest. Nie chodźcie tam ani nie idźcie za nimi."
  tags: []
"Łk17,24":
  text: "Bo jak błyskawica, gdy zabłyśnie, świeci od jednego krańca nieba aż po drugi, tak będzie i z Synem Człowieczym w jego dniu."
  tags: []
"Łk17,25":
  text: "Ale najpierw musi wiele cierpieć i zostać odrzucony przez to pokolenie."
  tags: []
"Łk17,26":
  text: "A jak było za dni Noego, tak będzie i za dni Syna Człowieczego:"
  tags: []
"Łk17,27":
  text: "Jedli, pili, żenili się i za mąż wychodziły aż do dnia, w którym Noe wszedł do arki; i nastał potop, i wszystkich wytracił."
  tags: []
"Łk17,28":
  text: "Podobnie jak działo się za dni Lota: jedli, pili, kupowali, sprzedawali, sadzili, budowali;"
  tags: []
"Łk17,29":
  text: "Lecz tego dnia, gdy Lot wyszedł z Sodomy, spadł z nieba deszcz ognia i siarki i wszystkich wytracił."
  tags: []
"Łk17,30":
  text: "Tak też będzie w dniu, kiedy Syn Człowieczy się objawi."
  tags: []
"Łk17,31":
  text: "Tego dnia, jeśli ktoś będzie na dachu, a jego rzeczy w domu, niech nie schodzi, aby je zabrać, a kto będzie na polu, niech również nie wraca."
  tags: []
"Łk17,32":
  text: "Pamiętajcie żonę Lota."
  tags: []
"Łk17,33":
  text: "Kto chce zachować swoje życie, straci je, a kto je straci, zachowa je."
  tags: []
"Łk17,34":
  text: "Mówię wam: Tej nocy dwóch będzie w jednym łóżku, jeden będzie wzięty, a drugi zostawiony."
  tags: []
"Łk17,35":
  text: "Dwie będą mleć razem, jedna będzie wzięta, a druga zostawiona."
  tags: []
"Łk17,36":
  text: "Dwaj będą na polu, jeden będzie wzięty, a drugi zostawiony."
  tags: []
"Łk17,37":
  text: "I pytali go: Gdzie, Panie? A on im powiedział: Gdzie jest ciało, tam zgromadzą się i orły."
  tags: []
