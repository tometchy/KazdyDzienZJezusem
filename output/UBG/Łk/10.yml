"Łk10,1": "A potem Pan wyznaczył jeszcze innych siedemdziesięciu i rozesłał ich po dwóch przed sobą do każdego miasta i miejsca, do którego sam miał przyjść."
"Łk10,2": "I mówił im: Żniwo wprawdzie wielkie, ale robotników mało. Proście więc Pana żniwa, aby wysłał robotników na swoje żniwo."
"Łk10,3": "Idźcie! Oto posyłam was jak baranki między wilki."
"Łk10,4": "Nie noście ze sobą sakiewki ani torby, ani obuwia. Nikogo też w drodze nie pozdrawiajcie."
"Łk10,5": "A gdy wejdziecie do jakiegoś domu, najpierw mówcie: Pokój temu domowi."
"Łk10,6": "Jeśli tam będzie syn pokoju, wasz pokój spocznie na nim, a jeśli nie – wróci do was."
"Łk10,7": "W tym domu zostańcie, jedząc i pijąc, co mają. Godny jest bowiem robotnik swojej zapłaty. Nie przenoście się z domu do domu."
"Łk10,8": "A gdy wejdziecie do jakiegoś miasta i przyjmą was, jedzcie, co przed wami położą;"
"Łk10,9": "I uzdrawiajcie chorych, którzy w nim są, i mówcie im: Przybliżyło się do was królestwo Boże."
"Łk10,10": "A jeśli wejdziecie do jakiegoś miasta, a nie przyjmą was, wyjdźcie na jego ulice i mówcie:"
"Łk10,11": "Nawet pył z waszego miasta, który przylgnął do nas, strząsamy na was. Jednak wiedzcie, że przybliżyło się do was królestwo Boże."
"Łk10,12": "A mówię wam, że w ten dzień lżej będzie Sodomie niż temu miastu."
"Łk10,13": "Biada tobie, Korozain! Biada tobie, Betsaido! Bo gdyby w Tyrze i Sydonie działy się te cuda, które się u was dokonały, dawno by pokutowały, siedząc w worze i popiele."
"Łk10,14": "Dlatego Tyrowi i Sydonowi lżej będzie na sądzie niż wam."
"Łk10,15": "A ty, Kafarnaum, które jesteś aż do nieba wywyższone, aż do piekła będziesz strącone."
"Łk10,16": "Kto was słucha, mnie słucha, a kto wami gardzi, mną gardzi. Kto zaś mną gardzi, gardzi tym, który mnie posłał."
"Łk10,17": "I siedemdziesięciu wróciło z radością, mówiąc: Panie, nawet demony nam się poddają ze względu na twoje imię."
"Łk10,18": "Wtedy powiedział do nich: Widziałem szatana spadającego z nieba jak błyskawica."
"Łk10,19": "Oto daję wam moc stąpania po wężach, skorpionach i po wszelkiej mocy nieprzyjaciela, a nic wam nie zaszkodzi."
"Łk10,20": "Jednak nie z tego się cieszcie, że duchy się wam poddają, ale cieszcie się raczej, że wasze imiona są zapisane w niebie."
"Łk10,21": "W tej godzinie Jezus rozradował się w duchu i powiedział: Wysławiam cię, Ojcze, Panie nieba i ziemi, że zakryłeś te sprawy przed mądrymi i roztropnymi, a objawiłeś je niemowlętom. Tak, Ojcze, bo tak się tobie upodobało."
"Łk10,22": "Wszystko zostało mi przekazane od mego Ojca i nikt nie wie, kim jest Syn, tylko Ojciec, ani kim jest Ojciec, tylko Syn i ten, komu Syn zechce objawić."
"Łk10,23": "Wtedy odwrócił się do uczniów i powiedział do nich na osobności: Błogosławione oczy, które widzą to, co wy widzicie."
"Łk10,24": "Bo mówię wam, że wielu proroków i królów pragnęło widzieć to, co wy widzicie, a nie zobaczyli, i słyszeć to, co wy słyszycie, a nie usłyszeli."
"Łk10,25": "A oto powstał pewien znawca prawa i wystawiając go na próbę, zapytał: Nauczycielu, co mam czynić, aby odziedziczyć życie wieczne?"
"Łk10,26": "A on powiedział do niego: Co jest napisane w Prawie? Jak czytasz?"
"Łk10,27": "A on odpowiedział: Będziesz miłował Pana, swego Boga, całym swym sercem, całą swą duszą, z całej swojej siły i całym swym umysłem, a swego bliźniego jak samego siebie."
"Łk10,28": "I powiedział mu: Dobrze odpowiedziałeś. Czyń to, a będziesz żył."
"Łk10,29": "On zaś, chcąc się usprawiedliwić, powiedział do Jezusa: A kto jest moim bliźnim?"
"Łk10,30": "Lecz Jezus odpowiedział: Pewien człowiek schodził z Jerozolimy do Jerycha i wpadł w ręce bandytów, którzy go obrabowali, poranili i odeszli, zostawiając na pół umarłego."
"Łk10,31": "A przypadkiem szedł tą drogą pewien kapłan; zobaczył go i ominął."
"Łk10,32": "Podobnie i Lewita, gdy dotarł na to miejsce, podszedł, zobaczył go i ominął."
"Łk10,33": "Lecz pewien Samarytanin, będąc w podróży, zbliżył się do niego. A gdy go zobaczył, ulitował się nad nim."
"Łk10,34": "A podszedłszy, opatrzył mu rany, zalewając je oliwą i winem; potem wsadził go na swoje zwierzę, zawiózł do gospody i opiekował się nim."
"Łk10,35": "A nazajutrz, odjeżdżając, wyjął dwa grosze, dał gospodarzowi i powiedział: Opiekuj się nim, a wszystko, co wydasz ponad to, oddam ci, gdy wrócę."
"Łk10,36": "Który z tych trzech, twoim zdaniem, był bliźnim tego, który wpadł w ręce bandytów?"
"Łk10,37": "A on odpowiedział: Ten, który okazał mu miłosierdzie. Wtedy Jezus mu powiedział: Idź i ty czyń podobnie."
"Łk10,38": "A gdy szli, wszedł do jednej wsi. Tam pewna kobieta, imieniem Marta, przyjęła go do swego domu."
"Łk10,39": "Miała ona siostrę, zwaną Marią, która usiadła u nóg Jezusa i słuchała jego słów."
"Łk10,40": "Ale Marta krzątała się koło rozmaitych posług, a podszedłszy, powiedziała: Panie, czy nie obchodzi cię, że moja siostra zostawiła mnie samą przy usługiwaniu? Powiedz jej, aby mi pomogła."
"Łk10,41": "A Jezus jej odpowiedział: Marto, Marto, troszczysz się i martwisz o wiele spraw;"
"Łk10,42": "Ale jedno jest potrzebne. Maria wybrała dobrą cząstkę, która nie będzie jej odebrana."
