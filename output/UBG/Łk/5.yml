"Łk5,1":
  text: "Pewnego razu, gdy ludzie cisnęli się do niego, aby słuchać słowa Bożego, on stał nad jeziorem Genezaret."
  tags: []
"Łk5,2":
  text: "I zobaczył dwie łodzie stojące przy brzegu jeziora, a rybacy, wyszedłszy z nich, płukali sieci."
  tags: []
"Łk5,3":
  text: "Wsiadł do jednej z tych łodzi, która należała do Szymona, i poprosił go, aby trochę odpłynął od brzegu. A usiadłszy, nauczał ludzi z łodzi."
  tags: []
"Łk5,4":
  text: "Kiedy przestał mówić, zwrócił się do Szymona: Wypłyń na głębię i zarzućcie wasze sieci na połów."
  tags: []
"Łk5,5":
  text: "A Szymon mu odpowiedział: Mistrzu, przez całą noc pracowaliśmy i nic nie złowiliśmy, ale na twoje słowo zarzucę sieć."
  tags: []
"Łk5,6":
  text: "A gdy to zrobili, zagarnęli wielkie mnóstwo ryb, tak że sieć im się rwała."
  tags: []
"Łk5,7":
  text: "Skinęli więc na towarzyszy, którzy byli w drugiej łodzi, aby przybyli i pomogli im. A oni przypłynęli i napełnili obie łodzie, tak że się zanurzały."
  tags: []
"Łk5,8":
  text: "Widząc to, Szymon Piotr przypadł do kolan Jezusa i powiedział: Odejdź ode mnie, Panie, bo jestem grzesznym człowiekiem."
  tags: []
"Łk5,9":
  text: "I jego bowiem, i wszystkich, którzy z nim byli, ogarnęło zdumienie z powodu połowu ryb, jakiego dokonali."
  tags: []
"Łk5,10":
  text: "Podobnie też Jakuba i Jana, synów Zebedeusza, którzy byli towarzyszami Szymona. I powiedział Jezus do Szymona: Nie bój się, odtąd będziesz łowił ludzi."
  tags: []
"Łk5,11":
  text: "A oni, wyciągnąwszy łódź na brzeg, zostawili wszystko i poszli za nim."
  tags: []
"Łk5,12":
  text: "A gdy przebywał w pewnym mieście, był tam człowiek cały pokryty trądem. Kiedy zobaczył Jezusa, upadł na twarz i prosił go: Panie, jeśli chcesz, możesz mnie oczyścić."
  tags: []
"Łk5,13":
  text: "Wtedy Jezus wyciągnął rękę, dotknął go i powiedział: Chcę, bądź oczyszczony. I natychmiast trąd go opuścił."
  tags: []
"Łk5,14":
  text: "Potem przykazał mu, aby nikomu o tym nie mówił. I dodał: Ale idź, pokaż się kapłanowi i ofiaruj za swoje oczyszczenie, jak nakazał Mojżesz, na świadectwo dla nich."
  tags: []
"Łk5,15":
  text: "Lecz wieść o nim jeszcze bardziej się rozchodziła. I schodziły się wielkie tłumy, aby go słuchać i aby ich uzdrowił z chorób."
  tags: []
"Łk5,16":
  text: "A on odchodził na pustynię i modlił się."
  tags: []
"Łk5,17":
  text: "Pewnego dnia, gdy nauczał, siedzieli tam też faryzeusze i nauczyciele prawa, którzy się zeszli ze wszystkich miasteczek Galilei, Judei i Jerozolimy. A moc Pana była obecna, aby ich uzdrawiać."
  tags: []
"Łk5,18":
  text: "A oto jacyś mężczyźni nieśli na posłaniu sparaliżowanego. Szukali sposobu, jak go wnieść i położyć przed nim."
  tags: []
"Łk5,19":
  text: "Gdy jednak z powodu tłumu nie znaleźli drogi, którą by go mogli wnieść, weszli na dach i przez dachówkę spuścili go z posłaniem w sam środek, przed Jezusa."
  tags: []
"Łk5,20":
  text: "On, widząc ich wiarę, powiedział mu: Człowieku, przebaczone ci są twoje grzechy."
  tags: []
"Łk5,21":
  text: "Wtedy uczeni w Piśmie i faryzeusze zaczęli się zastanawiać i mówić: Kim jest ten, który mówi bluźnierstwa? Któż może przebaczać grzechy oprócz samego Boga?"
  tags: []
"Łk5,22":
  text: "Ale Jezus, poznawszy ich myśli, odpowiedział im: Co myślicie w waszych sercach?"
  tags: []
"Łk5,23":
  text: "Cóż jest łatwiej powiedzieć: Przebaczone ci są twoje grzechy, czy powiedzieć: Wstań i chodź?"
  tags: []
"Łk5,24":
  text: "Lecz abyście wiedzieli, że Syn Człowieczy ma na ziemi moc przebaczać grzechy – powiedział do sparaliżowanego: Mówię ci: Wstań, weź swoje posłanie i idź do domu."
  tags: []
"Łk5,25":
  text: "A on natychmiast wstał na ich oczach, wziął to, na czym leżał, i poszedł do domu, wielbiąc Boga."
  tags: []
"Łk5,26":
  text: "Wtedy wszyscy się zdumieli, chwalili Boga i pełni lęku mówili: Widzieliśmy dziś dziwne rzeczy."
  tags: []
"Łk5,27":
  text: "Potem wyszedł i zobaczył celnika, imieniem Lewi, siedzącego w punkcie celnym, i powiedział do niego: Pójdź za mną."
  tags: []
"Łk5,28":
  text: "A on zostawił wszystko, wstał i poszedł za nim."
  tags: []
"Łk5,29":
  text: "I przygotował mu Lewi wielką ucztę w swoim domu. A była tam wielka grupa celników i innych, którzy zasiedli z nimi za stołem."
  tags: []
"Łk5,30":
  text: "A uczeni w Piśmie i faryzeusze szemrali, mówiąc do jego uczniów: Dlaczego jecie i pijecie z celnikami i grzesznikami?"
  tags: []
"Łk5,31":
  text: "Jezus zaś im odpowiedział: Nie zdrowi, lecz chorzy potrzebują lekarza."
  tags: []
"Łk5,32":
  text: "Nie przyszedłem wzywać do pokuty sprawiedliwych, ale grzeszników."
  tags: []
"Łk5,33":
  text: "I zapytali go: Dlaczego uczniowie Jana często poszczą i modlą się, podobnie uczniowie faryzeuszy, a twoi jedzą i piją?"
  tags: []
"Łk5,34":
  text: "A on im odpowiedział: Czy możecie sprawić, żeby przyjaciele oblubieńca pościli, dopóki jest z nimi oblubieniec?"
  tags: []
"Łk5,35":
  text: "Lecz przyjdą dni, gdy oblubieniec zostanie od nich zabrany, wtedy, w te dni, będą pościć."
  tags: []
"Łk5,36":
  text: "Opowiedział im też przypowieść: Nikt nie przyszywa łaty z nowej szaty do starej, bo inaczej to, co jest nowe, drze stare, a do starego nie nadaje się łata z nowego."
  tags: []
"Łk5,37":
  text: "I nikt nie wlewa młodego wina do starych bukłaków, bo inaczej młode wino rozsadzi bukłaki i samo wycieknie, a bukłaki się popsują."
  tags: []
"Łk5,38":
  text: "Ale młode wino należy wlewać do nowych bukłaków i tak zachowuje się jedno i drugie."
  tags: []
"Łk5,39":
  text: "Nikt też, kto napił się starego, nie chce od razu młodego. Mówi bowiem: Stare jest lepsze."
  tags: []
