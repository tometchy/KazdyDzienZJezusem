"Łk20,1": "A pewnego dnia, gdy nauczał ludzi w świątyni i głosił ewangelię, nadeszli naczelni kapłani i uczeni w Piśmie wraz ze starszymi;"
"Łk20,2": "I zapytali go: Powiedz nam, jakim prawem to czynisz? Albo kim jest ten, kto dał ci tę władzę?"
"Łk20,3": "A on im odpowiedział: I ja was spytam o jedną rzecz. Powiedzcie mi:"
"Łk20,4": "Chrzest Jana pochodził z nieba czy od ludzi?"
"Łk20,5": "A oni zastanawiali się między sobą i mówili: Jeśli powiemy, że z nieba, zapyta: Czemu więc mu nie uwierzyliście?"
"Łk20,6": "Jeśli zaś powiemy, że od ludzi, wszyscy nas ukamienują, bo są przekonani, że Jan był prorokiem."
"Łk20,7": "I odpowiedzieli, że nie wiedzą, skąd pochodził."
"Łk20,8": "Wtedy Jezus im powiedział: To i ja wam nie powiem, jakim prawem to czynię."
"Łk20,9": "I zaczął mówić do ludzi taką przypowieść: Pewien człowiek założył winnicę, wydzierżawił ją rolnikom i wyjechał na dłuższy czas."
"Łk20,10": "A we właściwym czasie posłał sługę do rolników, aby mu dali część plonów winnicy. Lecz oni go pobili i odesłali z niczym."
"Łk20,11": "Ponownie posłał innego sługę, ale oni i tego pobili, znieważyli i odesłali z niczym."
"Łk20,12": "Posłał jeszcze trzeciego, a oni również jego poranili i wyrzucili."
"Łk20,13": "Wtedy pan winnicy powiedział: Co mam zrobić? Poślę mego umiłowanego syna, może go uszanują, gdy go zobaczą."
"Łk20,14": "Lecz gdy rolnicy go zobaczyli, naradzali się między sobą i mówili: To jest dziedzic. Chodźmy, zabijmy go, a dziedzictwo będzie nasze."
"Łk20,15": "I wyrzuciwszy go z winnicy, zabili. Cóż więc zrobi z nimi pan winnicy?"
"Łk20,16": "Przyjdzie i wytraci tych rolników, a winnicę odda innym. Gdy oni to usłyszeli, powiedzieli: Nie daj Boże!"
"Łk20,17": "Lecz on spojrzał na nich i zapytał: Cóż więc znaczy to, co jest napisane: Kamień, który odrzucili budujący, stał się kamieniem węgielnym?"
"Łk20,18": "Każdy, kto upadnie na ten kamień, roztrzaska się, a na kogo on upadnie, zmiażdży go."
"Łk20,19": "W tej właśnie godzinie naczelni kapłani i uczeni w Piśmie starali się dostać go w swoje ręce, ale bali się ludu. Zrozumieli bowiem, że przeciwko nim powiedział tę przypowieść."
"Łk20,20": "Obserwowali go więc i posłali szpiegów, którzy udawali sprawiedliwych, aby go złapać za słowo, a potem wydać władzy i mocy namiestnika."
"Łk20,21": "I zapytali go: Nauczycielu, wiemy, że dobrze mówisz i uczysz, i nie masz względu na osobę, lecz drogi Bożej w prawdzie nauczasz."
"Łk20,22": "Czy wolno nam płacić podatek cesarzowi, czy nie?"
"Łk20,23": "Ale on, przejrzawszy ich podstęp, powiedział do nich: Czemu wystawiacie mnie na próbę?"
"Łk20,24": "Pokażcie mi grosz. Czyj nosi wizerunek i napis? I odpowiedzieli: Cesarza."
"Łk20,25": "Wtedy on im powiedział: Oddajcie więc cesarzowi to, co należy do cesarza, a Bogu to, co należy do Boga."
"Łk20,26": "I nie mogli go złapać za słowo w obecności ludu. Zdziwieni jego odpowiedzią, zamilkli."
"Łk20,27": "Wówczas przyszli niektórzy z saduceuszy, którzy twierdzą, że nie ma zmartwychwstania, i pytali go:"
"Łk20,28": "Nauczycielu, Mojżesz nam napisał: Jeśli czyjś brat umrze, mając żonę, a umrze bezdzietnie, to jego brat ma pojąć jego żonę i wzbudzić potomstwo swemu bratu."
"Łk20,29": "Było więc siedmiu braci, z których pierwszy ożenił się i umarł bezdzietnie."
"Łk20,30": "I ożenił się z nią drugi, lecz i ten umarł bezdzietnie."
"Łk20,31": "Potem ożenił się z nią także trzeci, podobnie aż do siódmego, a nie zostawiwszy dzieci, poumierali."
"Łk20,32": "W końcu umarła też ta kobieta."
"Łk20,33": "Żoną którego z nich będzie więc przy zmartwychwstaniu? Siedmiu bowiem miało ją za żonę."
"Łk20,34": "Wtedy Jezus im odpowiedział: Dzieci tego świata żenią się i za mąż wychodzą."
"Łk20,35": "Lecz ci, którzy są uznani za godnych dostąpienia tamtego świata i powstania z martwych, ani się żenić nie będą, ani za mąż wychodzić."
"Łk20,36": "Nie mogą bowiem więcej umrzeć, bo są równi aniołom i będąc dziećmi zmartwychwstania, są dziećmi Bożymi."
"Łk20,37": "A że umarli zmartwychwstaną, to i Mojżesz pokazał przy krzaku, gdy nazywa Pana Bogiem Abrahama, Bogiem Izaaka i Bogiem Jakuba."
"Łk20,38": "Bóg przecież nie jest Bogiem umarłych, lecz żywych, bo dla niego wszyscy żyją."
"Łk20,39": "Wtedy niektórzy z uczonych w Piśmie odezwali się: Nauczycielu, dobrze powiedziałeś."
"Łk20,40": "I nie śmieli go już o nic pytać."
"Łk20,41": "On zaś powiedział do nich: Jak to jest, że mówią, iż Chrystus jest synem Dawida?"
"Łk20,42": "A sam Dawid mówi w Księdze Psalmów: Powiedział Pan memu Panu: Siądź po mojej prawicy;"
"Łk20,43": "Aż położę twoich nieprzyjaciół jako podnóżek pod twoje stopy."
"Łk20,44": "Jeśli więc Dawid nazywa go Panem, to jakże może być jego synem?"
"Łk20,45": "A gdy wszyscy ludzie słuchali, powiedział do swoich uczniów:"
"Łk20,46": "Strzeżcie się uczonych w Piśmie, którzy lubią chodzić w długich szatach, kochają pozdrowienia na rynkach, pierwsze krzesła w synagogach i pierwsze miejsca na ucztach."
"Łk20,47": "Pożerają oni domy wdów i dla pozoru odprawiają długie modlitwy. Ci otrzymają surowszy wyrok."
