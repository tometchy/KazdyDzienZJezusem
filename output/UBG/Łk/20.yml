"Łk20,1":
  text: "A pewnego dnia, gdy nauczał ludzi w świątyni i głosił ewangelię, nadeszli naczelni kapłani i uczeni w Piśmie wraz ze starszymi;"
  tags: []
"Łk20,2":
  text: "I zapytali go: Powiedz nam, jakim prawem to czynisz? Albo kim jest ten, kto dał ci tę władzę?"
  tags: []
"Łk20,3":
  text: "A on im odpowiedział: I ja was spytam o jedną rzecz. Powiedzcie mi:"
  tags: []
"Łk20,4":
  text: "Chrzest Jana pochodził z nieba czy od ludzi?"
  tags: []
"Łk20,5":
  text: "A oni zastanawiali się między sobą i mówili: Jeśli powiemy, że z nieba, zapyta: Czemu więc mu nie uwierzyliście?"
  tags: []
"Łk20,6":
  text: "Jeśli zaś powiemy, że od ludzi, wszyscy nas ukamienują, bo są przekonani, że Jan był prorokiem."
  tags: []
"Łk20,7":
  text: "I odpowiedzieli, że nie wiedzą, skąd pochodził."
  tags: []
"Łk20,8":
  text: "Wtedy Jezus im powiedział: To i ja wam nie powiem, jakim prawem to czynię."
  tags: []
"Łk20,9":
  text: "I zaczął mówić do ludzi taką przypowieść: Pewien człowiek założył winnicę, wydzierżawił ją rolnikom i wyjechał na dłuższy czas."
  tags: []
"Łk20,10":
  text: "A we właściwym czasie posłał sługę do rolników, aby mu dali część plonów winnicy. Lecz oni go pobili i odesłali z niczym."
  tags: []
"Łk20,11":
  text: "Ponownie posłał innego sługę, ale oni i tego pobili, znieważyli i odesłali z niczym."
  tags: []
"Łk20,12":
  text: "Posłał jeszcze trzeciego, a oni również jego poranili i wyrzucili."
  tags: []
"Łk20,13":
  text: "Wtedy pan winnicy powiedział: Co mam zrobić? Poślę mego umiłowanego syna, może go uszanują, gdy go zobaczą."
  tags: []
"Łk20,14":
  text: "Lecz gdy rolnicy go zobaczyli, naradzali się między sobą i mówili: To jest dziedzic. Chodźmy, zabijmy go, a dziedzictwo będzie nasze."
  tags: []
"Łk20,15":
  text: "I wyrzuciwszy go z winnicy, zabili. Cóż więc zrobi z nimi pan winnicy?"
  tags: []
"Łk20,16":
  text: "Przyjdzie i wytraci tych rolników, a winnicę odda innym. Gdy oni to usłyszeli, powiedzieli: Nie daj Boże!"
  tags: []
"Łk20,17":
  text: "Lecz on spojrzał na nich i zapytał: Cóż więc znaczy to, co jest napisane: Kamień, który odrzucili budujący, stał się kamieniem węgielnym?"
  tags: []
"Łk20,18":
  text: "Każdy, kto upadnie na ten kamień, roztrzaska się, a na kogo on upadnie, zmiażdży go."
  tags: []
"Łk20,19":
  text: "W tej właśnie godzinie naczelni kapłani i uczeni w Piśmie starali się dostać go w swoje ręce, ale bali się ludu. Zrozumieli bowiem, że przeciwko nim powiedział tę przypowieść."
  tags: []
"Łk20,20":
  text: "Obserwowali go więc i posłali szpiegów, którzy udawali sprawiedliwych, aby go złapać za słowo, a potem wydać władzy i mocy namiestnika."
  tags: []
"Łk20,21":
  text: "I zapytali go: Nauczycielu, wiemy, że dobrze mówisz i uczysz, i nie masz względu na osobę, lecz drogi Bożej w prawdzie nauczasz."
  tags: []
"Łk20,22":
  text: "Czy wolno nam płacić podatek cesarzowi, czy nie?"
  tags: []
"Łk20,23":
  text: "Ale on, przejrzawszy ich podstęp, powiedział do nich: Czemu wystawiacie mnie na próbę?"
  tags: []
"Łk20,24":
  text: "Pokażcie mi grosz. Czyj nosi wizerunek i napis? I odpowiedzieli: Cesarza."
  tags: []
"Łk20,25":
  text: "Wtedy on im powiedział: Oddajcie więc cesarzowi to, co należy do cesarza, a Bogu to, co należy do Boga."
  tags: []
"Łk20,26":
  text: "I nie mogli go złapać za słowo w obecności ludu. Zdziwieni jego odpowiedzią, zamilkli."
  tags: []
"Łk20,27":
  text: "Wówczas przyszli niektórzy z saduceuszy, którzy twierdzą, że nie ma zmartwychwstania, i pytali go:"
  tags: []
"Łk20,28":
  text: "Nauczycielu, Mojżesz nam napisał: Jeśli czyjś brat umrze, mając żonę, a umrze bezdzietnie, to jego brat ma pojąć jego żonę i wzbudzić potomstwo swemu bratu."
  tags: []
"Łk20,29":
  text: "Było więc siedmiu braci, z których pierwszy ożenił się i umarł bezdzietnie."
  tags: []
"Łk20,30":
  text: "I ożenił się z nią drugi, lecz i ten umarł bezdzietnie."
  tags: []
"Łk20,31":
  text: "Potem ożenił się z nią także trzeci, podobnie aż do siódmego, a nie zostawiwszy dzieci, poumierali."
  tags: []
"Łk20,32":
  text: "W końcu umarła też ta kobieta."
  tags: []
"Łk20,33":
  text: "Żoną którego z nich będzie więc przy zmartwychwstaniu? Siedmiu bowiem miało ją za żonę."
  tags: []
"Łk20,34":
  text: "Wtedy Jezus im odpowiedział: Dzieci tego świata żenią się i za mąż wychodzą."
  tags: []
"Łk20,35":
  text: "Lecz ci, którzy są uznani za godnych dostąpienia tamtego świata i powstania z martwych, ani się żenić nie będą, ani za mąż wychodzić."
  tags: []
"Łk20,36":
  text: "Nie mogą bowiem więcej umrzeć, bo są równi aniołom i będąc dziećmi zmartwychwstania, są dziećmi Bożymi."
  tags: []
"Łk20,37":
  text: "A że umarli zmartwychwstaną, to i Mojżesz pokazał przy krzaku, gdy nazywa Pana Bogiem Abrahama, Bogiem Izaaka i Bogiem Jakuba."
  tags: []
"Łk20,38":
  text: "Bóg przecież nie jest Bogiem umarłych, lecz żywych, bo dla niego wszyscy żyją."
  tags: []
"Łk20,39":
  text: "Wtedy niektórzy z uczonych w Piśmie odezwali się: Nauczycielu, dobrze powiedziałeś."
  tags: []
"Łk20,40":
  text: "I nie śmieli go już o nic pytać."
  tags: []
"Łk20,41":
  text: "On zaś powiedział do nich: Jak to jest, że mówią, iż Chrystus jest synem Dawida?"
  tags: []
"Łk20,42":
  text: "A sam Dawid mówi w Księdze Psalmów: Powiedział Pan memu Panu: Siądź po mojej prawicy;"
  tags: []
"Łk20,43":
  text: "Aż położę twoich nieprzyjaciół jako podnóżek pod twoje stopy."
  tags: []
"Łk20,44":
  text: "Jeśli więc Dawid nazywa go Panem, to jakże może być jego synem?"
  tags: []
"Łk20,45":
  text: "A gdy wszyscy ludzie słuchali, powiedział do swoich uczniów:"
  tags: []
"Łk20,46":
  text: "Strzeżcie się uczonych w Piśmie, którzy lubią chodzić w długich szatach, kochają pozdrowienia na rynkach, pierwsze krzesła w synagogach i pierwsze miejsca na ucztach."
  tags: []
"Łk20,47":
  text: "Pożerają oni domy wdów i dla pozoru odprawiają długie modlitwy. Ci otrzymają surowszy wyrok."
  tags: []
