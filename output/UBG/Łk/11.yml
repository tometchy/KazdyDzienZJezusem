"Łk11,1": "A gdy przebywał w jakimś miejscu na modlitwie i skończył ją, jeden z jego uczniów powiedział do niego: Panie, naucz nas się modlić, tak jak i Jan nauczył swoich uczniów."
"Łk11,2": "I powiedział do nich: Gdy się modlicie, mówcie: Ojcze nasz, który jesteś w niebie, niech będzie uświęcone twoje imię. Niech przyjdzie twoje królestwo. Niech się dzieje twoja wola na ziemi, tak jak w niebie."
"Łk11,3": "Dawaj nam każdego dnia naszego powszedniego chleba."
"Łk11,4": "Przebacz nam nasze grzechy, bo i my przebaczamy każdemu, kto przeciwko nam zawinił. I nie wystawiaj nas na pokusę, ale wybaw nas od złego."
"Łk11,5": "I powiedział do nich: Któż z was, mając przyjaciela, pójdzie do niego o północy i powie mu: Przyjacielu, pożycz mi trzy chleby;"
"Łk11,6": "Mój przyjaciel bowiem przyszedł do mnie z drogi, a nie mam mu co podać?"
"Łk11,7": "A on z wewnątrz odpowie: Nie naprzykrzaj mi się. Drzwi są już zamknięte i moje dzieci są ze mną w łóżku. Nie mogę wstać i dać ci."
"Łk11,8": "Mówię wam: Chociażby nie wstał i nie dał mu dlatego, że jest jego przyjacielem, jednak z powodu jego natarczywości wstanie i da mu, ile potrzebuje."
"Łk11,9": "I ja wam mówię: Proście, a będzie wam dane, szukajcie, a znajdziecie, pukajcie, a będzie wam otworzone."
"Łk11,10": "Każdy bowiem, kto prosi, otrzymuje, a kto szuka, znajduje, a temu, kto puka, będzie otworzone."
"Łk11,11": "I czy jest wśród was ojciec, który, gdy syn prosi go o chleb, da mu kamień? Albo gdy prosi o rybę, czy zamiast ryby da mu węża?"
"Łk11,12": "Albo gdy prosi o jajko, czy da mu skorpiona?"
"Łk11,13": "Jeśli więc wy, będąc złymi, umiecie dawać dobre dary waszym dzieciom, o ileż bardziej wasz Ojciec niebieski da Ducha Świętego tym, którzy go proszą?"
"Łk11,14": "I wypędzał demona, który był niemy. A gdy demon wyszedł, niemy przemówił, a ludzie się dziwili."
"Łk11,15": "Lecz niektórzy z nich mówili: Przez Belzebuba, władcę demonów, wypędza demony."
"Łk11,16": "Inni zaś, wystawiając go na próbę, żądali od niego znaku z nieba."
"Łk11,17": "Ale on, znając ich myśli, powiedział do nich: Każde królestwo podzielone wewnętrznie pustoszeje, a dom skłócony sam ze sobą upada."
"Łk11,18": "Jeśli i szatan jest wewnętrznie podzielony, jakże przetrwa jego królestwo? Mówicie bowiem, że ja przez Belzebuba wypędzam demony."
"Łk11,19": "A jeśli ja przez Belzebuba wypędzam demony, to przez kogo wypędzają wasi synowie? Dlatego oni będą waszymi sędziami."
"Łk11,20": "Ale jeśli ja palcem Bożym wypędzam demony, to istotnie przyszło do was królestwo Boże."
"Łk11,21": "Gdy uzbrojony mocarz strzeże swego pałacu, bezpieczne jest jego mienie."
"Łk11,22": "Lecz gdy mocniejszy od niego nadejdzie i zwycięży go, zabiera całą jego broń, na której polegał, i rozdaje jego łupy."
"Łk11,23": "Kto nie jest ze mną, jest przeciwko mnie, a kto nie zbiera ze mną, rozprasza."
"Łk11,24": "Gdy duch nieczysty wychodzi z człowieka, przechadza się po miejscach bezwodnych, szukając odpoczynku, a gdy nie znajduje, mówi: Wrócę do mego domu, skąd wyszedłem."
"Łk11,25": "A przyszedłszy, zastaje go zamiecionym i przyozdobionym."
"Łk11,26": "Wtedy idzie i bierze ze sobą siedem innych duchów, gorszych niż on sam, i wszedłszy, mieszkają tam. I końcowy stan tego człowieka staje się gorszy niż pierwszy."
"Łk11,27": "A gdy on to mówił, pewna kobieta spośród zgromadzonych powiedziała do niego donośnym głosem: Błogosławione łono, które cię nosiło, i piersi, które ssałeś!"
"Łk11,28": "On zaś odpowiedział: Błogosławieni są raczej ci, którzy słuchają słowa Bożego i strzegą go."
"Łk11,29": "A gdy ludzie się gromadzili, zaczął mówić: Pokolenie to jest złe. Żąda znaku, ale żaden znak nie będzie mu dany, oprócz znaku proroka Jonasza."
"Łk11,30": "Jak bowiem Jonasz był znakiem dla mieszkańców Niniwy, tak będzie i Syn Człowieczy dla tego pokolenia."
"Łk11,31": "Królowa z południa stanie na sądzie z ludźmi tego pokolenia i potępi ich, bo przybyła z krańców ziemi, aby słuchać mądrości Salomona, a oto tu ktoś więcej niż Salomon."
"Łk11,32": "Ludzie z Niniwy staną na sądzie z tym pokoleniem i potępią je, ponieważ pokutowali na skutek głoszenia Jonasza, a oto tu ktoś więcej niż Jonasz."
"Łk11,33": "Nikt nie zapala świecy i nie stawia jej w ukryciu ani pod naczyniem, ale na świeczniku, aby ci, którzy wchodzą, widzieli światło."
"Łk11,34": "Światłem ciała jest oko. Jeśli więc twoje oko jest szczere, to i całe twoje ciało będzie pełne światła, a jeśli jest złe, to i twoje ciało będzie pełne ciemności."
"Łk11,35": "Uważaj więc, aby światło, które jest w tobie, nie było ciemnością."
"Łk11,36": "Jeśli zatem całe twoje ciało będzie pełne światła, nie mając w sobie żadnej ciemnej cząstki, całe będzie tak pełne światła, jak gdy świeca oświetla cię swoim blaskiem."
"Łk11,37": "Kiedy to mówił, pewien faryzeusz poprosił go, aby zjadł u niego obiad. Wszedł więc i usiadł za stołem."
"Łk11,38": "A faryzeusz, widząc to, dziwił się, że nie umył się przed obiadem."
"Łk11,39": "Wtedy Pan powiedział do niego: Teraz wy, faryzeusze, oczyszczacie to, co jest na zewnątrz kubka i misy, ale to, co jest wewnątrz was, pełne jest zdzierstwa i nieprawości."
"Łk11,40": "Głupcy, czyż ten, który uczynił to, co jest na zewnątrz, nie uczynił też tego, co jest wewnątrz?"
"Łk11,41": "Raczej z tego, co jest wewnątrz, dawajcie jałmużnę, a wszystko będzie dla was czyste."
"Łk11,42": "Ale biada wam, faryzeusze, bo dajecie dziesięcinę z mięty, ruty i z każdego ziela, lecz opuszczacie sąd i miłość Boga. To należało czynić i tamtego nie opuszczać."
"Łk11,43": "Biada wam, faryzeusze, bo kochacie pierwsze miejsca w synagogach i pozdrowienia na rynkach."
"Łk11,44": "Biada wam, uczeni w Piśmie i faryzeusze, obłudnicy, bo jesteście jak groby, których nie widać, a ludzie, którzy chodzą po nich, nie wiedzą o tym."
"Łk11,45": "I odezwał się jeden ze znawców prawa: Nauczycielu, mówiąc to, i nas znieważasz."
"Łk11,46": "A on powiedział: I wam, znawcom prawa, biada, bo obciążacie ludzi brzemionami nie do uniesienia, a sami nawet jednym palcem tych brzemion nie dotykacie."
"Łk11,47": "Biada wam, bo budujecie grobowce proroków, a wasi ojcowie ich pozabijali."
"Łk11,48": "Doprawdy świadczycie, że pochwalacie uczynki waszych ojców. Oni bowiem ich pozabijali, a wy budujecie ich grobowce."
"Łk11,49": "Dlatego też mądrość Boża powiedziała: Poślę do nich proroków i apostołów, a niektórych z nich będą zabijać i prześladować;"
"Łk11,50": "Aby dopominano się od tego pokolenia krwi wszystkich proroków, która została przelana od założenia świata;"
"Łk11,51": "Od krwi Abla aż do krwi Zachariasza, który zginął między ołtarzem a świątynią. Doprawdy, mówię wam, dopominać się jej będą od tego pokolenia."
"Łk11,52": "Biada wam, znawcom prawa, bo zabraliście klucz poznania. Sami nie weszliście i tym, którzy chcieli wejść, przeszkodziliście."
"Łk11,53": "A gdy im to mówił, uczeni w Piśmie i faryzeusze zaczęli bardzo na niego nastawać i prowokować go do mówienia o wielu rzeczach;"
"Łk11,54": "Czyhając na niego i próbując wychwycić coś z jego słów, żeby go oskarżyć."
