"Łk11,1":
  text: "A gdy przebywał w jakimś miejscu na modlitwie i skończył ją, jeden z jego uczniów powiedział do niego: Panie, naucz nas się modlić, tak jak i Jan nauczył swoich uczniów."
  tags: []
"Łk11,2":
  text: "I powiedział do nich: Gdy się modlicie, mówcie: Ojcze nasz, który jesteś w niebie, niech będzie uświęcone twoje imię. Niech przyjdzie twoje królestwo. Niech się dzieje twoja wola na ziemi, tak jak w niebie."
  tags: []
"Łk11,3":
  text: "Dawaj nam każdego dnia naszego powszedniego chleba."
  tags: []
"Łk11,4":
  text: "Przebacz nam nasze grzechy, bo i my przebaczamy każdemu, kto przeciwko nam zawinił. I nie wystawiaj nas na pokusę, ale wybaw nas od złego."
  tags: []
"Łk11,5":
  text: "I powiedział do nich: Któż z was, mając przyjaciela, pójdzie do niego o północy i powie mu: Przyjacielu, pożycz mi trzy chleby;"
  tags: []
"Łk11,6":
  text: "Mój przyjaciel bowiem przyszedł do mnie z drogi, a nie mam mu co podać?"
  tags: []
"Łk11,7":
  text: "A on z wewnątrz odpowie: Nie naprzykrzaj mi się. Drzwi są już zamknięte i moje dzieci są ze mną w łóżku. Nie mogę wstać i dać ci."
  tags: []
"Łk11,8":
  text: "Mówię wam: Chociażby nie wstał i nie dał mu dlatego, że jest jego przyjacielem, jednak z powodu jego natarczywości wstanie i da mu, ile potrzebuje."
  tags: []
"Łk11,9":
  text: "I ja wam mówię: Proście, a będzie wam dane, szukajcie, a znajdziecie, pukajcie, a będzie wam otworzone."
  tags: []
"Łk11,10":
  text: "Każdy bowiem, kto prosi, otrzymuje, a kto szuka, znajduje, a temu, kto puka, będzie otworzone."
  tags: []
"Łk11,11":
  text: "I czy jest wśród was ojciec, który, gdy syn prosi go o chleb, da mu kamień? Albo gdy prosi o rybę, czy zamiast ryby da mu węża?"
  tags: []
"Łk11,12":
  text: "Albo gdy prosi o jajko, czy da mu skorpiona?"
  tags: []
"Łk11,13":
  text: "Jeśli więc wy, będąc złymi, umiecie dawać dobre dary waszym dzieciom, o ileż bardziej wasz Ojciec niebieski da Ducha Świętego tym, którzy go proszą?"
  tags: []
"Łk11,14":
  text: "I wypędzał demona, który był niemy. A gdy demon wyszedł, niemy przemówił, a ludzie się dziwili."
  tags: []
"Łk11,15":
  text: "Lecz niektórzy z nich mówili: Przez Belzebuba, władcę demonów, wypędza demony."
  tags: []
"Łk11,16":
  text: "Inni zaś, wystawiając go na próbę, żądali od niego znaku z nieba."
  tags: []
"Łk11,17":
  text: "Ale on, znając ich myśli, powiedział do nich: Każde królestwo podzielone wewnętrznie pustoszeje, a dom skłócony sam ze sobą upada."
  tags: []
"Łk11,18":
  text: "Jeśli i szatan jest wewnętrznie podzielony, jakże przetrwa jego królestwo? Mówicie bowiem, że ja przez Belzebuba wypędzam demony."
  tags: []
"Łk11,19":
  text: "A jeśli ja przez Belzebuba wypędzam demony, to przez kogo wypędzają wasi synowie? Dlatego oni będą waszymi sędziami."
  tags: []
"Łk11,20":
  text: "Ale jeśli ja palcem Bożym wypędzam demony, to istotnie przyszło do was królestwo Boże."
  tags: []
"Łk11,21":
  text: "Gdy uzbrojony mocarz strzeże swego pałacu, bezpieczne jest jego mienie."
  tags: []
"Łk11,22":
  text: "Lecz gdy mocniejszy od niego nadejdzie i zwycięży go, zabiera całą jego broń, na której polegał, i rozdaje jego łupy."
  tags: []
"Łk11,23":
  text: "Kto nie jest ze mną, jest przeciwko mnie, a kto nie zbiera ze mną, rozprasza."
  tags: []
"Łk11,24":
  text: "Gdy duch nieczysty wychodzi z człowieka, przechadza się po miejscach bezwodnych, szukając odpoczynku, a gdy nie znajduje, mówi: Wrócę do mego domu, skąd wyszedłem."
  tags: []
"Łk11,25":
  text: "A przyszedłszy, zastaje go zamiecionym i przyozdobionym."
  tags: []
"Łk11,26":
  text: "Wtedy idzie i bierze ze sobą siedem innych duchów, gorszych niż on sam, i wszedłszy, mieszkają tam. I końcowy stan tego człowieka staje się gorszy niż pierwszy."
  tags: []
"Łk11,27":
  text: "A gdy on to mówił, pewna kobieta spośród zgromadzonych powiedziała do niego donośnym głosem: Błogosławione łono, które cię nosiło, i piersi, które ssałeś!"
  tags: []
"Łk11,28":
  text: "On zaś odpowiedział: Błogosławieni są raczej ci, którzy słuchają słowa Bożego i strzegą go."
  tags: []
"Łk11,29":
  text: "A gdy ludzie się gromadzili, zaczął mówić: Pokolenie to jest złe. Żąda znaku, ale żaden znak nie będzie mu dany, oprócz znaku proroka Jonasza."
  tags: []
"Łk11,30":
  text: "Jak bowiem Jonasz był znakiem dla mieszkańców Niniwy, tak będzie i Syn Człowieczy dla tego pokolenia."
  tags: []
"Łk11,31":
  text: "Królowa z południa stanie na sądzie z ludźmi tego pokolenia i potępi ich, bo przybyła z krańców ziemi, aby słuchać mądrości Salomona, a oto tu ktoś więcej niż Salomon."
  tags: []
"Łk11,32":
  text: "Ludzie z Niniwy staną na sądzie z tym pokoleniem i potępią je, ponieważ pokutowali na skutek głoszenia Jonasza, a oto tu ktoś więcej niż Jonasz."
  tags: []
"Łk11,33":
  text: "Nikt nie zapala świecy i nie stawia jej w ukryciu ani pod naczyniem, ale na świeczniku, aby ci, którzy wchodzą, widzieli światło."
  tags: []
"Łk11,34":
  text: "Światłem ciała jest oko. Jeśli więc twoje oko jest szczere, to i całe twoje ciało będzie pełne światła, a jeśli jest złe, to i twoje ciało będzie pełne ciemności."
  tags: []
"Łk11,35":
  text: "Uważaj więc, aby światło, które jest w tobie, nie było ciemnością."
  tags: []
"Łk11,36":
  text: "Jeśli zatem całe twoje ciało będzie pełne światła, nie mając w sobie żadnej ciemnej cząstki, całe będzie tak pełne światła, jak gdy świeca oświetla cię swoim blaskiem."
  tags: []
"Łk11,37":
  text: "Kiedy to mówił, pewien faryzeusz poprosił go, aby zjadł u niego obiad. Wszedł więc i usiadł za stołem."
  tags: []
"Łk11,38":
  text: "A faryzeusz, widząc to, dziwił się, że nie umył się przed obiadem."
  tags: []
"Łk11,39":
  text: "Wtedy Pan powiedział do niego: Teraz wy, faryzeusze, oczyszczacie to, co jest na zewnątrz kubka i misy, ale to, co jest wewnątrz was, pełne jest zdzierstwa i nieprawości."
  tags: []
"Łk11,40":
  text: "Głupcy, czyż ten, który uczynił to, co jest na zewnątrz, nie uczynił też tego, co jest wewnątrz?"
  tags: []
"Łk11,41":
  text: "Raczej z tego, co jest wewnątrz, dawajcie jałmużnę, a wszystko będzie dla was czyste."
  tags: []
"Łk11,42":
  text: "Ale biada wam, faryzeusze, bo dajecie dziesięcinę z mięty, ruty i z każdego ziela, lecz opuszczacie sąd i miłość Boga. To należało czynić i tamtego nie opuszczać."
  tags: []
"Łk11,43":
  text: "Biada wam, faryzeusze, bo kochacie pierwsze miejsca w synagogach i pozdrowienia na rynkach."
  tags: []
"Łk11,44":
  text: "Biada wam, uczeni w Piśmie i faryzeusze, obłudnicy, bo jesteście jak groby, których nie widać, a ludzie, którzy chodzą po nich, nie wiedzą o tym."
  tags: []
"Łk11,45":
  text: "I odezwał się jeden ze znawców prawa: Nauczycielu, mówiąc to, i nas znieważasz."
  tags: []
"Łk11,46":
  text: "A on powiedział: I wam, znawcom prawa, biada, bo obciążacie ludzi brzemionami nie do uniesienia, a sami nawet jednym palcem tych brzemion nie dotykacie."
  tags: []
"Łk11,47":
  text: "Biada wam, bo budujecie grobowce proroków, a wasi ojcowie ich pozabijali."
  tags: []
"Łk11,48":
  text: "Doprawdy świadczycie, że pochwalacie uczynki waszych ojców. Oni bowiem ich pozabijali, a wy budujecie ich grobowce."
  tags: []
"Łk11,49":
  text: "Dlatego też mądrość Boża powiedziała: Poślę do nich proroków i apostołów, a niektórych z nich będą zabijać i prześladować;"
  tags: []
"Łk11,50":
  text: "Aby dopominano się od tego pokolenia krwi wszystkich proroków, która została przelana od założenia świata;"
  tags: []
"Łk11,51":
  text: "Od krwi Abla aż do krwi Zachariasza, który zginął między ołtarzem a świątynią. Doprawdy, mówię wam, dopominać się jej będą od tego pokolenia."
  tags: []
"Łk11,52":
  text: "Biada wam, znawcom prawa, bo zabraliście klucz poznania. Sami nie weszliście i tym, którzy chcieli wejść, przeszkodziliście."
  tags: []
"Łk11,53":
  text: "A gdy im to mówił, uczeni w Piśmie i faryzeusze zaczęli bardzo na niego nastawać i prowokować go do mówienia o wielu rzeczach;"
  tags: []
"Łk11,54":
  text: "Czyhając na niego i próbując wychwycić coś z jego słów, żeby go oskarżyć."
  tags: []
