"Łk8,1":
  text: "Następnie chodził po miastach i po wioskach, głosząc i opowiadając ewangelię królestwa Bożego. A było z nim dwunastu;"
  tags: []
"Łk8,2":
  text: "I kilka kobiet, które uwolnił od złych duchów i chorób: Maria, zwana Magdaleną, z której wyszło siedem demonów;"
  tags: []
"Łk8,3":
  text: "Joanna, żona Chuzy, zarządcy u Heroda, Zuzanna i wiele innych, które służyły mu swoimi dobrami."
  tags: []
"Łk8,4":
  text: "A gdy zeszło się wielu ludzi i z różnych miast przychodzili do niego, powiedział w przypowieści:"
  tags: []
"Łk8,5":
  text: "Siewca wyszedł siać swoje ziarno. A gdy siał, jedno padło przy drodze i zostało podeptane, a ptaki niebieskie wydziobały je."
  tags: []
"Łk8,6":
  text: "Inne padło na skałę, a gdy wzeszło, uschło, bo nie miało wilgoci."
  tags: []
"Łk8,7":
  text: "Inne zaś padło między ciernie, ale ciernie razem z nim wyrosły i zagłuszyły je."
  tags: []
"Łk8,8":
  text: "A jeszcze inne padło na dobrą ziemię, a gdy wzrosło, wydało plon stokrotny. To powiedziawszy, zawołał: Kto ma uszy do słuchania, niech słucha."
  tags: []
"Łk8,9":
  text: "I pytali go jego uczniowie: Co znaczy ta przypowieść?"
  tags: []
"Łk8,10":
  text: "A on im powiedział: Wam dano poznać tajemnice królestwa Bożego, ale innym opowiada się w przypowieściach, aby patrząc, nie widzieli i słysząc, nie rozumieli."
  tags: []
"Łk8,11":
  text: "A takie jest znaczenie przypowieści: Ziarnem jest słowo Boże."
  tags: []
"Łk8,12":
  text: "Tymi przy drodze są ci, którzy słuchają; potem przychodzi diabeł i zabiera słowo z ich serca, aby nie uwierzyli i nie zostali zbawieni."
  tags: []
"Łk8,13":
  text: "A tymi na skale są ci, którzy, gdy usłyszą, z radością przyjmują słowo. Nie mają jednak korzenia, wierzą do czasu, a w chwili pokusy odstępują."
  tags: []
"Łk8,14":
  text: "To zaś, które padło między ciernie, to są ci, którzy słuchają słowa, ale odchodzą i przez troski, bogactwa i rozkosze życia zostają zagłuszeni i nie wydają owocu."
  tags: []
"Łk8,15":
  text: "Lecz to, które padło na dobrą ziemię, to są ci, którzy szczerym i dobrym sercem usłyszeli słowo i zachowują je, i wydają owoc w cierpliwości."
  tags: []
"Łk8,16":
  text: "Nikt, zapaliwszy świecę, nie nakrywa jej naczyniem i nie stawia pod łóżkiem, ale na świeczniku, aby ci, którzy wchodzą, widzieli światło."
  tags: []
"Łk8,17":
  text: "Nie ma bowiem nic tajemnego, co by nie miało być ujawnione, ani nic ukrytego, o czym by się nie dowiedziano i co by nie wyszło na jaw."
  tags: []
"Łk8,18":
  text: "Uważajcie więc, jak słuchacie. Kto bowiem ma, temu będzie dodane, a kto nie ma, zostanie mu zabrane nawet to, co sądzi, że ma."
  tags: []
"Łk8,19":
  text: "Wtedy przyszli do niego jego matka i bracia, ale nie mogli podejść z powodu tłumu."
  tags: []
"Łk8,20":
  text: "I dano mu znać, mówiąc: Twoja matka i twoi bracia stoją przed domem i chcą się z tobą widzieć."
  tags: []
"Łk8,21":
  text: "A on im odpowiedział: Moją matką i moimi braćmi są ci, którzy słuchają słowa Bożego i wypełniają je."
  tags: []
"Łk8,22":
  text: "Pewnego dnia wsiadł do łodzi ze swymi uczniami i powiedział do nich: Przeprawmy się na drugą stronę jeziora. I odpłynęli."
  tags: []
"Łk8,23":
  text: "A gdy płynęli, usnął. I zerwał się gwałtowny wicher na jeziorze, i zalewało łódź, tak że byli w niebezpieczeństwie."
  tags: []
"Łk8,24":
  text: "Podeszli więc i obudzili go, mówiąc: Mistrzu, mistrzu, giniemy! Wówczas wstał, zgromił wiatr i wzburzone fale, a one się uspokoiły i nastała cisza."
  tags: []
"Łk8,25":
  text: "Wtedy powiedział do nich: Gdzież jest wasza wiara? A oni, bojąc się, dziwili się i mówili między sobą: Kim on jest, że nawet wichrom i wodzie rozkazuje, a są mu posłuszne?"
  tags: []
"Łk8,26":
  text: "I przeprawili się do krainy Gadareńczyków, która leży naprzeciw Galilei."
  tags: []
"Łk8,27":
  text: "A gdy wyszedł na ląd, zabiegł mu drogę pewien człowiek z miasta, który od dłuższego czasu miał demony. Nie nosił ubrania i nie mieszkał w domu, lecz w grobowcach."
  tags: []
"Łk8,28":
  text: "Gdy zobaczył Jezusa, krzyknął, upadł przed nim i zawołał donośnym głosem: Cóż ja mam z tobą, Jezusie, Synu Boga Najwyższego? Proszę cię, nie dręcz mnie."
  tags: []
"Łk8,29":
  text: "Rozkazał bowiem duchowi nieczystemu, aby wyszedł z tego człowieka. Bo od dłuższego czasu porywał go, a chociaż wiązano go łańcuchami i trzymano w pętach, on rwał więzy, a demon pędził go na pustynię."
  tags: []
"Łk8,30":
  text: "I zapytał go Jezus: Jak ci na imię? A on odpowiedział: Legion. Wiele bowiem demonów weszło w niego."
  tags: []
"Łk8,31":
  text: "Wtedy prosiły go, aby nie kazał im odejść stamtąd w otchłań."
  tags: []
"Łk8,32":
  text: "A było tam wielkie stado świń, które pasły się na górze. I demony prosiły go, aby pozwolił im w nie wejść. I pozwolił im."
  tags: []
"Łk8,33":
  text: "Wtedy demony wyszły z tego człowieka i weszły w świnie. I ruszyło to stado pędem po urwisku do jeziora, i utonęło."
  tags: []
"Łk8,34":
  text: "A pasterze, widząc, co się stało, uciekli, a poszedłszy, oznajmili to w mieście i we wsiach."
  tags: []
"Łk8,35":
  text: "I wyszli ludzie, aby zobaczyć, co zaszło, a przyszedłszy do Jezusa, zastali człowieka, z którego wyszły demony, ubranego i przy zdrowych zmysłach, siedzącego u stóp Jezusa. I przestraszyli się."
  tags: []
"Łk8,36":
  text: "A ci, którzy to widzieli, opowiedzieli im, jak ten opętany został uzdrowiony."
  tags: []
"Łk8,37":
  text: "Wówczas cała ludność okolicznej krainy Gadareńczyków prosiła go, aby od nich odszedł, gdyż ogarnął ich wielki strach. Wtedy on wsiadł do łodzi i zawrócił."
  tags: []
"Łk8,38":
  text: "A człowiek, z którego wyszły demony, prosił go, aby mógł przy nim zostać. Lecz Jezus odprawił go, mówiąc:"
  tags: []
"Łk8,39":
  text: "Wróć do swego domu i opowiedz, jak wielkie rzeczy Bóg ci uczynił. I odszedł, opowiadając po całym mieście, jak wielkie rzeczy Jezus mu uczynił."
  tags: []
"Łk8,40":
  text: "A gdy Jezus wrócił, ludzie przyjęli go z radością. Wszyscy bowiem go oczekiwali."
  tags: []
"Łk8,41":
  text: "A oto przyszedł człowiek imieniem Jair, który był przełożonym synagogi. Upadł Jezusowi do nóg i prosił go, aby wszedł do jego domu."
  tags: []
"Łk8,42":
  text: "Miał bowiem córkę jedynaczkę, mającą około dwunastu lat, która umierała. A gdy on szedł, ludzie napierali na niego."
  tags: []
"Łk8,43":
  text: "A kobieta, która od dwunastu lat cierpiała na krwotok i wydała na lekarzy całe swoje mienie, a żaden nie mógł jej uleczyć;"
  tags: []
"Łk8,44":
  text: "Podeszła z tyłu, dotknęła brzegu jego szaty i natychmiast ustał jej krwotok."
  tags: []
"Łk8,45":
  text: "Wtedy Jezus zapytał: Kto mnie dotknął? A gdy wszyscy się wypierali, Piotr i ci, którzy z nim byli, powiedzieli: Mistrzu, ludzie się do ciebie cisną i tłoczą, a ty pytasz: Kto mnie dotknął?"
  tags: []
"Łk8,46":
  text: "Jezus jednak powiedział: Ktoś mnie dotknął, bo poczułem, że moc wyszła ze mnie."
  tags: []
"Łk8,47":
  text: "Wtedy kobieta, widząc, że się nie ukryje, z drżeniem podeszła i upadłszy przed nim, powiedziała wobec wszystkich ludzi, dlaczego go dotknęła i jak natychmiast została uzdrowiona."
  tags: []
"Łk8,48":
  text: "On zaś powiedział do niej: Ufaj, córko! Twoja wiara cię uzdrowiła, idź w pokoju."
  tags: []
"Łk8,49":
  text: "A gdy on jeszcze to mówił, przyszedł ktoś z domu przełożonego synagogi i powiedział: Twoja córka umarła, nie trudź Nauczyciela."
  tags: []
"Łk8,50":
  text: "Ale Jezus, słysząc to, odezwał się do niego: Nie bój się, tylko wierz, a będzie uzdrowiona."
  tags: []
"Łk8,51":
  text: "Gdy przyszedł do domu, nie pozwolił wejść ze sobą nikomu oprócz Piotra, Jakuba i Jana oraz ojca i matki dziewczynki."
  tags: []
"Łk8,52":
  text: "A wszyscy płakali i lamentowali nad nią. Lecz on powiedział: Nie płaczcie, nie umarła, tylko śpi."
  tags: []
"Łk8,53":
  text: "I naśmiewali się z niego, wiedząc, że umarła."
  tags: []
"Łk8,54":
  text: "A on wyrzucił wszystkich, ujął ją za rękę i zawołał: Dziewczynko, wstań!"
  tags: []
"Łk8,55":
  text: "Wtedy jej duch powrócił i zaraz wstała, a on polecił, aby dano jej jeść."
  tags: []
"Łk8,56":
  text: "I zdumieli się jej rodzice. A on im nakazał, aby nikomu nie mówili o tym, co się stało."
  tags: []
