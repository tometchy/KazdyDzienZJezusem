"Łk8,1": "Następnie chodził po miastach i po wioskach, głosząc i opowiadając ewangelię królestwa Bożego. A było z nim dwunastu;"
"Łk8,2": "I kilka kobiet, które uwolnił od złych duchów i chorób: Maria, zwana Magdaleną, z której wyszło siedem demonów;"
"Łk8,3": "Joanna, żona Chuzy, zarządcy u Heroda, Zuzanna i wiele innych, które służyły mu swoimi dobrami."
"Łk8,4": "A gdy zeszło się wielu ludzi i z różnych miast przychodzili do niego, powiedział w przypowieści:"
"Łk8,5": "Siewca wyszedł siać swoje ziarno. A gdy siał, jedno padło przy drodze i zostało podeptane, a ptaki niebieskie wydziobały je."
"Łk8,6": "Inne padło na skałę, a gdy wzeszło, uschło, bo nie miało wilgoci."
"Łk8,7": "Inne zaś padło między ciernie, ale ciernie razem z nim wyrosły i zagłuszyły je."
"Łk8,8": "A jeszcze inne padło na dobrą ziemię, a gdy wzrosło, wydało plon stokrotny. To powiedziawszy, zawołał: Kto ma uszy do słuchania, niech słucha."
"Łk8,9": "I pytali go jego uczniowie: Co znaczy ta przypowieść?"
"Łk8,10": "A on im powiedział: Wam dano poznać tajemnice królestwa Bożego, ale innym opowiada się w przypowieściach, aby patrząc, nie widzieli i słysząc, nie rozumieli."
"Łk8,11": "A takie jest znaczenie przypowieści: Ziarnem jest słowo Boże."
"Łk8,12": "Tymi przy drodze są ci, którzy słuchają; potem przychodzi diabeł i zabiera słowo z ich serca, aby nie uwierzyli i nie zostali zbawieni."
"Łk8,13": "A tymi na skale są ci, którzy, gdy usłyszą, z radością przyjmują słowo. Nie mają jednak korzenia, wierzą do czasu, a w chwili pokusy odstępują."
"Łk8,14": "To zaś, które padło między ciernie, to są ci, którzy słuchają słowa, ale odchodzą i przez troski, bogactwa i rozkosze życia zostają zagłuszeni i nie wydają owocu."
"Łk8,15": "Lecz to, które padło na dobrą ziemię, to są ci, którzy szczerym i dobrym sercem usłyszeli słowo i zachowują je, i wydają owoc w cierpliwości."
"Łk8,16": "Nikt, zapaliwszy świecę, nie nakrywa jej naczyniem i nie stawia pod łóżkiem, ale na świeczniku, aby ci, którzy wchodzą, widzieli światło."
"Łk8,17": "Nie ma bowiem nic tajemnego, co by nie miało być ujawnione, ani nic ukrytego, o czym by się nie dowiedziano i co by nie wyszło na jaw."
"Łk8,18": "Uważajcie więc, jak słuchacie. Kto bowiem ma, temu będzie dodane, a kto nie ma, zostanie mu zabrane nawet to, co sądzi, że ma."
"Łk8,19": "Wtedy przyszli do niego jego matka i bracia, ale nie mogli podejść z powodu tłumu."
"Łk8,20": "I dano mu znać, mówiąc: Twoja matka i twoi bracia stoją przed domem i chcą się z tobą widzieć."
"Łk8,21": "A on im odpowiedział: Moją matką i moimi braćmi są ci, którzy słuchają słowa Bożego i wypełniają je."
"Łk8,22": "Pewnego dnia wsiadł do łodzi ze swymi uczniami i powiedział do nich: Przeprawmy się na drugą stronę jeziora. I odpłynęli."
"Łk8,23": "A gdy płynęli, usnął. I zerwał się gwałtowny wicher na jeziorze, i zalewało łódź, tak że byli w niebezpieczeństwie."
"Łk8,24": "Podeszli więc i obudzili go, mówiąc: Mistrzu, mistrzu, giniemy! Wówczas wstał, zgromił wiatr i wzburzone fale, a one się uspokoiły i nastała cisza."
"Łk8,25": "Wtedy powiedział do nich: Gdzież jest wasza wiara? A oni, bojąc się, dziwili się i mówili między sobą: Kim on jest, że nawet wichrom i wodzie rozkazuje, a są mu posłuszne?"
"Łk8,26": "I przeprawili się do krainy Gadareńczyków, która leży naprzeciw Galilei."
"Łk8,27": "A gdy wyszedł na ląd, zabiegł mu drogę pewien człowiek z miasta, który od dłuższego czasu miał demony. Nie nosił ubrania i nie mieszkał w domu, lecz w grobowcach."
"Łk8,28": "Gdy zobaczył Jezusa, krzyknął, upadł przed nim i zawołał donośnym głosem: Cóż ja mam z tobą, Jezusie, Synu Boga Najwyższego? Proszę cię, nie dręcz mnie."
"Łk8,29": "Rozkazał bowiem duchowi nieczystemu, aby wyszedł z tego człowieka. Bo od dłuższego czasu porywał go, a chociaż wiązano go łańcuchami i trzymano w pętach, on rwał więzy, a demon pędził go na pustynię."
"Łk8,30": "I zapytał go Jezus: Jak ci na imię? A on odpowiedział: Legion. Wiele bowiem demonów weszło w niego."
"Łk8,31": "Wtedy prosiły go, aby nie kazał im odejść stamtąd w otchłań."
"Łk8,32": "A było tam wielkie stado świń, które pasły się na górze. I demony prosiły go, aby pozwolił im w nie wejść. I pozwolił im."
"Łk8,33": "Wtedy demony wyszły z tego człowieka i weszły w świnie. I ruszyło to stado pędem po urwisku do jeziora, i utonęło."
"Łk8,34": "A pasterze, widząc, co się stało, uciekli, a poszedłszy, oznajmili to w mieście i we wsiach."
"Łk8,35": "I wyszli ludzie, aby zobaczyć, co zaszło, a przyszedłszy do Jezusa, zastali człowieka, z którego wyszły demony, ubranego i przy zdrowych zmysłach, siedzącego u stóp Jezusa. I przestraszyli się."
"Łk8,36": "A ci, którzy to widzieli, opowiedzieli im, jak ten opętany został uzdrowiony."
"Łk8,37": "Wówczas cała ludność okolicznej krainy Gadareńczyków prosiła go, aby od nich odszedł, gdyż ogarnął ich wielki strach. Wtedy on wsiadł do łodzi i zawrócił."
"Łk8,38": "A człowiek, z którego wyszły demony, prosił go, aby mógł przy nim zostać. Lecz Jezus odprawił go, mówiąc:"
"Łk8,39": "Wróć do swego domu i opowiedz, jak wielkie rzeczy Bóg ci uczynił. I odszedł, opowiadając po całym mieście, jak wielkie rzeczy Jezus mu uczynił."
"Łk8,40": "A gdy Jezus wrócił, ludzie przyjęli go z radością. Wszyscy bowiem go oczekiwali."
"Łk8,41": "A oto przyszedł człowiek imieniem Jair, który był przełożonym synagogi. Upadł Jezusowi do nóg i prosił go, aby wszedł do jego domu."
"Łk8,42": "Miał bowiem córkę jedynaczkę, mającą około dwunastu lat, która umierała. A gdy on szedł, ludzie napierali na niego."
"Łk8,43": "A kobieta, która od dwunastu lat cierpiała na krwotok i wydała na lekarzy całe swoje mienie, a żaden nie mógł jej uleczyć;"
"Łk8,44": "Podeszła z tyłu, dotknęła brzegu jego szaty i natychmiast ustał jej krwotok."
"Łk8,45": "Wtedy Jezus zapytał: Kto mnie dotknął? A gdy wszyscy się wypierali, Piotr i ci, którzy z nim byli, powiedzieli: Mistrzu, ludzie się do ciebie cisną i tłoczą, a ty pytasz: Kto mnie dotknął?"
"Łk8,46": "Jezus jednak powiedział: Ktoś mnie dotknął, bo poczułem, że moc wyszła ze mnie."
"Łk8,47": "Wtedy kobieta, widząc, że się nie ukryje, z drżeniem podeszła i upadłszy przed nim, powiedziała wobec wszystkich ludzi, dlaczego go dotknęła i jak natychmiast została uzdrowiona."
"Łk8,48": "On zaś powiedział do niej: Ufaj, córko! Twoja wiara cię uzdrowiła, idź w pokoju."
"Łk8,49": "A gdy on jeszcze to mówił, przyszedł ktoś z domu przełożonego synagogi i powiedział: Twoja córka umarła, nie trudź Nauczyciela."
"Łk8,50": "Ale Jezus, słysząc to, odezwał się do niego: Nie bój się, tylko wierz, a będzie uzdrowiona."
"Łk8,51": "Gdy przyszedł do domu, nie pozwolił wejść ze sobą nikomu oprócz Piotra, Jakuba i Jana oraz ojca i matki dziewczynki."
"Łk8,52": "A wszyscy płakali i lamentowali nad nią. Lecz on powiedział: Nie płaczcie, nie umarła, tylko śpi."
"Łk8,53": "I naśmiewali się z niego, wiedząc, że umarła."
"Łk8,54": "A on wyrzucił wszystkich, ujął ją za rękę i zawołał: Dziewczynko, wstań!"
"Łk8,55": "Wtedy jej duch powrócił i zaraz wstała, a on polecił, aby dano jej jeść."
"Łk8,56": "I zdumieli się jej rodzice. A on im nakazał, aby nikomu nie mówili o tym, co się stało."
