"Łk14,1": "I stało się tak, że gdy Jezus wszedł w szabat do domu pewnego przywódcy faryzeuszy, aby jeść chleb, oni go obserwowali."
"Łk14,2": "A oto był przed nim pewien człowiek chory na puchlinę."
"Łk14,3": "Wtedy Jezus zapytał znawców prawa i faryzeuszy: Czy wolno uzdrawiać w szabat?"
"Łk14,4": "Lecz oni milczeli. On zaś ujął go, uzdrowił i odprawił."
"Łk14,5": "I powiedział im: Któż z was, jeśli jego osioł albo wół wpadnie do studni, nie wyciągnie go natychmiast w dzień szabatu?"
"Łk14,6": "I nie mogli mu na to odpowiedzieć."
"Łk14,7": "Gdy zauważył, jak zaproszeni wybierali pierwsze miejsca, opowiedział im przypowieść:"
"Łk14,8": "Gdy ktoś cię zaprosi na wesele, nie siadaj na pierwszym miejscu, aby czasem ktoś ważniejszy od ciebie nie był zaproszony przez niego."
"Łk14,9": "Wówczas przyjdzie ten, który ciebie i jego zaprosił, i powie ci: Ustąp temu miejsca; i wtedy ze wstydem musiałbyś zająć ostatnie miejsce."
"Łk14,10": "Lecz gdy będziesz zaproszony, idź i usiądź na ostatnim miejscu, a gdy przyjdzie ten, który cię zaprosił, powie ci: Przyjacielu, przesiądź się wyżej. Wtedy doznasz czci wobec współbiesiadników."
"Łk14,11": "Bo każdy, kto się wywyższa, będzie poniżony, a kto się poniża, będzie wywyższony."
"Łk14,12": "Powiedział też do tego, który go zaprosił: Gdy wydajesz obiad albo kolację, nie zapraszaj swoich przyjaciół ani braci, ani krewnych, ani bogatych sąsiadów, żeby cię czasem i oni w zamian nie zaprosili, i miałbyś odpłatę."
"Łk14,13": "Lecz gdy wydajesz ucztę, zaproś ubogich, ułomnych, chromych i ślepych."
"Łk14,14": "A będziesz błogosławiony, bo nie mają ci czym odpłacić, ale otrzymasz odpłatę przy zmartwychwstaniu sprawiedliwych."
"Łk14,15": "Gdy usłyszał to jeden ze współbiesiadników, powiedział do niego: Błogosławiony ten, kto będzie jadł chleb w królestwie Bożym."
"Łk14,16": "Wtedy on mu powiedział: Pewien człowiek wydał wielką ucztę i zaprosił wielu."
"Łk14,17": "A gdy nadszedł czas uczty, posłał swego sługę, żeby powiedział zaproszonym: Chodźcie, bo już wszystko gotowe."
"Łk14,18": "A oni zaczęli się wszyscy jednomyślnie wymawiać. Pierwszy mu powiedział: Kupiłem pole i muszę iść je obejrzeć. Proszę cię, uważaj mnie za wytłumaczonego."
"Łk14,19": "Drugi zaś powiedział: Kupiłem pięć par wołów i idę je wypróbować. Proszę cię, uważaj mnie za wytłumaczonego."
"Łk14,20": "A jeszcze inny powiedział: Pojąłem żonę i dlatego nie mogę przyjść."
"Łk14,21": "A gdy sługa wrócił, oznajmił to swemu panu. Wtedy gospodarz rozgniewał się i powiedział do swego sługi: Wyjdź szybko na ulice i zaułki miasta i wprowadź tu ubogich, ułomnych, chromych i ślepych."
"Łk14,22": "I powiedział sługa: Panie, stało się, jak rozkazałeś, a jeszcze jest miejsce."
"Łk14,23": "Wtedy Pan powiedział do sługi: Wyjdź na drogi i między opłotki i przymuszaj do wejścia, aby mój dom się zapełnił."
"Łk14,24": "Mówię wam bowiem, że żaden z tych ludzi, którzy byli zaproszeni, nie skosztuje mojej uczty."
"Łk14,25": "I szły z nim wielkie tłumy. A on, odwróciwszy się, powiedział do nich:"
"Łk14,26": "Jeśli ktoś przychodzi do mnie, a nie ma w nienawiści swego ojca i matki, żony i dzieci, braci i sióstr, a nawet swego życia, nie może być moim uczniem."
"Łk14,27": "Kto nie niesie swego krzyża, a idzie za mną, nie może być moim uczniem."
"Łk14,28": "Bo któż z was, chcąc zbudować wieżę, najpierw nie usiądzie i nie obliczy wydatków, czy mu wystarczy na ukończenie?"
"Łk14,29": "Aby czasem, gdyby położył fundament, a nie mógłby ukończyć, wszyscy, którzy by to widzieli, nie zaczęli się z niego naśmiewać;"
"Łk14,30": "Mówiąc: Ten człowiek zaczął budować, a nie zdołał ukończyć."
"Łk14,31": "Albo który król, wyruszając na wojnę z drugim królem, najpierw nie usiądzie i nie naradzi się, czy w dziesięć tysięcy może zmierzyć się z tym, który z dwudziestoma tysiącami nadciąga przeciwko niemu?"
"Łk14,32": "A jeśli nie, to gdy tamten jeszcze jest daleko, wysyła poselstwo i prosi o warunki pokoju."
"Łk14,33": "Tak i każdy z was, kto nie wyrzeknie się wszystkiego, co posiada, nie może być moim uczniem."
"Łk14,34": "Dobra jest sól. Lecz jeśli sól zwietrzeje, czym się ją przyprawi?"
"Łk14,35": "Nie nadaje się ani do ziemi, ani do nawozu; precz się ją wyrzuca. Kto ma uszy do słuchania, niech słucha."
