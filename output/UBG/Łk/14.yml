"Łk14,1":
  text: "I stało się tak, że gdy Jezus wszedł w szabat do domu pewnego przywódcy faryzeuszy, aby jeść chleb, oni go obserwowali."
  tags: []
"Łk14,2":
  text: "A oto był przed nim pewien człowiek chory na puchlinę."
  tags: []
"Łk14,3":
  text: "Wtedy Jezus zapytał znawców prawa i faryzeuszy: Czy wolno uzdrawiać w szabat?"
  tags: []
"Łk14,4":
  text: "Lecz oni milczeli. On zaś ujął go, uzdrowił i odprawił."
  tags: []
"Łk14,5":
  text: "I powiedział im: Któż z was, jeśli jego osioł albo wół wpadnie do studni, nie wyciągnie go natychmiast w dzień szabatu?"
  tags: []
"Łk14,6":
  text: "I nie mogli mu na to odpowiedzieć."
  tags: []
"Łk14,7":
  text: "Gdy zauważył, jak zaproszeni wybierali pierwsze miejsca, opowiedział im przypowieść:"
  tags: []
"Łk14,8":
  text: "Gdy ktoś cię zaprosi na wesele, nie siadaj na pierwszym miejscu, aby czasem ktoś ważniejszy od ciebie nie był zaproszony przez niego."
  tags: []
"Łk14,9":
  text: "Wówczas przyjdzie ten, który ciebie i jego zaprosił, i powie ci: Ustąp temu miejsca; i wtedy ze wstydem musiałbyś zająć ostatnie miejsce."
  tags: []
"Łk14,10":
  text: "Lecz gdy będziesz zaproszony, idź i usiądź na ostatnim miejscu, a gdy przyjdzie ten, który cię zaprosił, powie ci: Przyjacielu, przesiądź się wyżej. Wtedy doznasz czci wobec współbiesiadników."
  tags: []
"Łk14,11":
  text: "Bo każdy, kto się wywyższa, będzie poniżony, a kto się poniża, będzie wywyższony."
  tags: []
"Łk14,12":
  text: "Powiedział też do tego, który go zaprosił: Gdy wydajesz obiad albo kolację, nie zapraszaj swoich przyjaciół ani braci, ani krewnych, ani bogatych sąsiadów, żeby cię czasem i oni w zamian nie zaprosili, i miałbyś odpłatę."
  tags: []
"Łk14,13":
  text: "Lecz gdy wydajesz ucztę, zaproś ubogich, ułomnych, chromych i ślepych."
  tags: []
"Łk14,14":
  text: "A będziesz błogosławiony, bo nie mają ci czym odpłacić, ale otrzymasz odpłatę przy zmartwychwstaniu sprawiedliwych."
  tags: []
"Łk14,15":
  text: "Gdy usłyszał to jeden ze współbiesiadników, powiedział do niego: Błogosławiony ten, kto będzie jadł chleb w królestwie Bożym."
  tags: []
"Łk14,16":
  text: "Wtedy on mu powiedział: Pewien człowiek wydał wielką ucztę i zaprosił wielu."
  tags: []
"Łk14,17":
  text: "A gdy nadszedł czas uczty, posłał swego sługę, żeby powiedział zaproszonym: Chodźcie, bo już wszystko gotowe."
  tags: []
"Łk14,18":
  text: "A oni zaczęli się wszyscy jednomyślnie wymawiać. Pierwszy mu powiedział: Kupiłem pole i muszę iść je obejrzeć. Proszę cię, uważaj mnie za wytłumaczonego."
  tags: []
"Łk14,19":
  text: "Drugi zaś powiedział: Kupiłem pięć par wołów i idę je wypróbować. Proszę cię, uważaj mnie za wytłumaczonego."
  tags: []
"Łk14,20":
  text: "A jeszcze inny powiedział: Pojąłem żonę i dlatego nie mogę przyjść."
  tags: []
"Łk14,21":
  text: "A gdy sługa wrócił, oznajmił to swemu panu. Wtedy gospodarz rozgniewał się i powiedział do swego sługi: Wyjdź szybko na ulice i zaułki miasta i wprowadź tu ubogich, ułomnych, chromych i ślepych."
  tags: []
"Łk14,22":
  text: "I powiedział sługa: Panie, stało się, jak rozkazałeś, a jeszcze jest miejsce."
  tags: []
"Łk14,23":
  text: "Wtedy Pan powiedział do sługi: Wyjdź na drogi i między opłotki i przymuszaj do wejścia, aby mój dom się zapełnił."
  tags: []
"Łk14,24":
  text: "Mówię wam bowiem, że żaden z tych ludzi, którzy byli zaproszeni, nie skosztuje mojej uczty."
  tags: []
"Łk14,25":
  text: "I szły z nim wielkie tłumy. A on, odwróciwszy się, powiedział do nich:"
  tags: []
"Łk14,26":
  text: "Jeśli ktoś przychodzi do mnie, a nie ma w nienawiści swego ojca i matki, żony i dzieci, braci i sióstr, a nawet swego życia, nie może być moim uczniem."
  tags: []
"Łk14,27":
  text: "Kto nie niesie swego krzyża, a idzie za mną, nie może być moim uczniem."
  tags: []
"Łk14,28":
  text: "Bo któż z was, chcąc zbudować wieżę, najpierw nie usiądzie i nie obliczy wydatków, czy mu wystarczy na ukończenie?"
  tags: []
"Łk14,29":
  text: "Aby czasem, gdyby położył fundament, a nie mógłby ukończyć, wszyscy, którzy by to widzieli, nie zaczęli się z niego naśmiewać;"
  tags: []
"Łk14,30":
  text: "Mówiąc: Ten człowiek zaczął budować, a nie zdołał ukończyć."
  tags: []
"Łk14,31":
  text: "Albo który król, wyruszając na wojnę z drugim królem, najpierw nie usiądzie i nie naradzi się, czy w dziesięć tysięcy może zmierzyć się z tym, który z dwudziestoma tysiącami nadciąga przeciwko niemu?"
  tags: []
"Łk14,32":
  text: "A jeśli nie, to gdy tamten jeszcze jest daleko, wysyła poselstwo i prosi o warunki pokoju."
  tags: []
"Łk14,33":
  text: "Tak i każdy z was, kto nie wyrzeknie się wszystkiego, co posiada, nie może być moim uczniem."
  tags: []
"Łk14,34":
  text: "Dobra jest sól. Lecz jeśli sól zwietrzeje, czym się ją przyprawi?"
  tags: []
"Łk14,35":
  text: "Nie nadaje się ani do ziemi, ani do nawozu; precz się ją wyrzuca. Kto ma uszy do słuchania, niech słucha."
  tags: []
