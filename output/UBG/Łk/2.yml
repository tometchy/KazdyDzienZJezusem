"Łk2,1": "A w tych dniach wyszedł dekret cesarza Augusta, aby spisano cały świat."
"Łk2,2": "A ten pierwszy spis odbył się, gdy Kwiryniusz był namiestnikiem Syrii."
"Łk2,3": "Szli więc wszyscy, aby dać się spisać, każdy do swego miasta."
"Łk2,4": "Poszedł też Józef z Galilei, z miasta Nazaret, do Judei, do miasta Dawida, zwanego Betlejem, ponieważ pochodził z domu i z rodu Dawida;"
"Łk2,5": "Aby dać się spisać z Marią, poślubioną sobie małżonką, która była brzemienna."
"Łk2,6": "A gdy tam byli, nadszedł czas porodu."
"Łk2,7": "I urodziła swego pierworodnego syna, owinęła go w pieluszki i położyła w żłobie, gdyż nie było dla nich miejsca w gospodzie."
"Łk2,8": "A byli w tej okolicy pasterze przebywający w polu i trzymający straż nocną nad swoim stadem."
"Łk2,9": "I oto stanął przy nich anioł Pana, a chwała Pana zewsząd ich oświeciła. I ogarnął ich wielki strach."
"Łk2,10": "I powiedział do nich anioł: Nie bójcie się, bo oto zwiastuję wam wielką radość, która będzie udziałem całego ludu."
"Łk2,11": "Dziś bowiem w mieście Dawida narodził się wam Zbawiciel, którym jest Chrystus Pan."
"Łk2,12": "A to będzie dla was znakiem: Znajdziecie niemowlę owinięte w pieluszki i leżące w żłobie."
"Łk2,13": "I zaraz z aniołem przybyło mnóstwo wojsk niebieskich chwalących Boga i mówiących:"
"Łk2,14": "Chwała na wysokościach Bogu, a na ziemi pokój, wobec ludzi dobra wola."
"Łk2,15": "A gdy aniołowie odeszli od nich do nieba, pasterze mówili między sobą: Chodźmy aż do Betlejem i zobaczmy to, co się wydarzyło, a co Pan nam oznajmił."
"Łk2,16": "Spiesząc się więc, przyszli i znaleźli Marię, Józefa i niemowlę leżące w żłobie."
"Łk2,17": "A ujrzawszy, rozgłosili to, co zostało im powiedziane o tym dziecku."
"Łk2,18": "A wszyscy, którzy słyszeli, dziwili się temu, co pasterze im mówili."
"Łk2,19": "Lecz Maria zachowywała wszystkie te słowa, rozważając je w swoim sercu."
"Łk2,20": "I wrócili pasterze, wielbiąc i chwaląc Boga za wszystko, co słyszeli i widzieli, tak jak im zostało powiedziane."
"Łk2,21": "A gdy minęło osiem dni i należało obrzezać dziecko, nadano mu imię Jezus, którym nazwał je anioł, zanim się poczęło w łonie."
"Łk2,22": "Gdy też według Prawa Mojżesza minęły dni jej oczyszczenia, przynieśli go do Jerozolimy, aby stawić go przed Panem;"
"Łk2,23": "(Tak jak jest napisane w Prawie Pana: Każdy mężczyzna otwierający łono będzie nazywany świętym Panu);"
"Łk2,24": "I żeby złożyć ofiarę według tego, co zostało powiedziane w Prawie Pana, parę synogarlic albo dwa gołąbki."
"Łk2,25": "A był w Jerozolimie człowiek imieniem Symeon. Ten człowiek był sprawiedliwy i bogobojny, oczekujący pociechy Izraela, a Duch Święty był nad nim."
"Łk2,26": "I objawił mu Bóg przez Ducha Świętego, że nie ujrzy śmierci, dopóki nie zobaczy Chrystusa Pańskiego."
"Łk2,27": "Przyszedł on prowadzony przez Ducha Świętego do świątyni. A gdy rodzice wnosili dziecko – Jezusa, aby postąpić z nim według zwyczaju prawa;"
"Łk2,28": "Wtedy on, wziąwszy go na ręce, chwalił Boga i mówił:"
"Łk2,29": "Teraz pozwalasz odejść twemu słudze, Panie, w pokoju, według twego słowa;"
"Łk2,30": "Gdyż moje oczy ujrzały twoje zbawienie;"
"Łk2,31": "Które przygotowałeś wobec wszystkich ludzi;"
"Łk2,32": "Światłość na oświecenie pogan i chwałę twego ludu, Izraela."
"Łk2,33": "A Józef i jego matka dziwili się temu, co o nim mówiono."
"Łk2,34": "I błogosławił im Symeon, i powiedział do Marii, jego matki: Oto ten położony jest na upadek i na powstanie wielu w Izraelu, i na znak, przeciwko któremu będą mówić;"
"Łk2,35": "(I twoją duszę miecz przeniknie), aby myśli wielu serc zostały objawione."
"Łk2,36": "A była tam prorokini Anna, córka Fanuela, z pokolenia Asera, która była w bardzo podeszłym wieku, a żyła siedem lat z mężem od swego dziewictwa."
"Łk2,37": "A była wdową mającą około osiemdziesięciu czterech lat, która nie opuszczała świątyni, służąc Bogu w postach i modlitwach dniem i nocą."
"Łk2,38": "Ona też, przyszedłszy w tej właśnie chwili, dziękowała Panu i mówiła o nim wszystkim, którzy oczekiwali odkupienia w Jerozolimie."
"Łk2,39": "A gdy wykonali wszystko według prawa Pana, wrócili do Galilei, do swego miasta, Nazaretu."
"Łk2,40": "Dziecko zaś rosło i umacniało się w duchu, będąc pełne mądrości, a łaska Boga była nad nim."
"Łk2,41": "A jego rodzice chodzili co roku do Jerozolimy na święto Paschy."
"Łk2,42": "I gdy miał dwanaście lat, poszli do Jerozolimy, zgodnie ze zwyczajem tego święta."
"Łk2,43": "A gdy minęły te dni i już wracali, dziecię Jezus zostało w Jerozolimie, ale Józef i jego matka o tym nie wiedzieli."
"Łk2,44": "Lecz sądząc, że jest w towarzystwie podróżnych, przeszli dzień drogi i szukali go wśród krewnych i znajomych."
"Łk2,45": "A gdy go nie znaleźli, wrócili do Jerozolimy, szukając go."
"Łk2,46": "A po trzech dniach znaleźli go siedzącego w świątyni wśród nauczycieli, słuchającego i pytającego ich."
"Łk2,47": "I wszyscy, którzy go słuchali, zdumiewali się jego rozumem i odpowiedziami."
"Łk2,48": "A rodzice, ujrzawszy go, zdziwili się. I powiedziała do niego jego matka: Synu, dlaczego nam to zrobiłeś? Oto twój ojciec i ja z bólem serca szukaliśmy ciebie."
"Łk2,49": "I powiedział do nich: Czemu mnie szukaliście? Czy nie wiedzieliście, że muszę być w tym, co należy do mego Ojca?"
"Łk2,50": "Lecz oni nie zrozumieli tych słów, które im mówił."
"Łk2,51": "Wtedy poszedł z nimi i wrócił do Nazaretu, i był im posłuszny. A jego matka zachowywała wszystkie te słowa w swoim sercu."
"Łk2,52": "A Jezusowi przybywało mądrości i wzrostu oraz łaski u Boga i u ludzi."
