"Łk2,1":
  text: "A w tych dniach wyszedł dekret cesarza Augusta, aby spisano cały świat."
  tags: []
"Łk2,2":
  text: "A ten pierwszy spis odbył się, gdy Kwiryniusz był namiestnikiem Syrii."
  tags: []
"Łk2,3":
  text: "Szli więc wszyscy, aby dać się spisać, każdy do swego miasta."
  tags: []
"Łk2,4":
  text: "Poszedł też Józef z Galilei, z miasta Nazaret, do Judei, do miasta Dawida, zwanego Betlejem, ponieważ pochodził z domu i z rodu Dawida;"
  tags: []
"Łk2,5":
  text: "Aby dać się spisać z Marią, poślubioną sobie małżonką, która była brzemienna."
  tags: []
"Łk2,6":
  text: "A gdy tam byli, nadszedł czas porodu."
  tags: []
"Łk2,7":
  text: "I urodziła swego pierworodnego syna, owinęła go w pieluszki i położyła w żłobie, gdyż nie było dla nich miejsca w gospodzie."
  tags: []
"Łk2,8":
  text: "A byli w tej okolicy pasterze przebywający w polu i trzymający straż nocną nad swoim stadem."
  tags: []
"Łk2,9":
  text: "I oto stanął przy nich anioł Pana, a chwała Pana zewsząd ich oświeciła. I ogarnął ich wielki strach."
  tags: []
"Łk2,10":
  text: "I powiedział do nich anioł: Nie bójcie się, bo oto zwiastuję wam wielką radość, która będzie udziałem całego ludu."
  tags: []
"Łk2,11":
  text: "Dziś bowiem w mieście Dawida narodził się wam Zbawiciel, którym jest Chrystus Pan."
  tags: []
"Łk2,12":
  text: "A to będzie dla was znakiem: Znajdziecie niemowlę owinięte w pieluszki i leżące w żłobie."
  tags: []
"Łk2,13":
  text: "I zaraz z aniołem przybyło mnóstwo wojsk niebieskich chwalących Boga i mówiących:"
  tags: []
"Łk2,14":
  text: "Chwała na wysokościach Bogu, a na ziemi pokój, wobec ludzi dobra wola."
  tags: []
"Łk2,15":
  text: "A gdy aniołowie odeszli od nich do nieba, pasterze mówili między sobą: Chodźmy aż do Betlejem i zobaczmy to, co się wydarzyło, a co Pan nam oznajmił."
  tags: []
"Łk2,16":
  text: "Spiesząc się więc, przyszli i znaleźli Marię, Józefa i niemowlę leżące w żłobie."
  tags: []
"Łk2,17":
  text: "A ujrzawszy, rozgłosili to, co zostało im powiedziane o tym dziecku."
  tags: []
"Łk2,18":
  text: "A wszyscy, którzy słyszeli, dziwili się temu, co pasterze im mówili."
  tags: []
"Łk2,19":
  text: "Lecz Maria zachowywała wszystkie te słowa, rozważając je w swoim sercu."
  tags: []
"Łk2,20":
  text: "I wrócili pasterze, wielbiąc i chwaląc Boga za wszystko, co słyszeli i widzieli, tak jak im zostało powiedziane."
  tags: []
"Łk2,21":
  text: "A gdy minęło osiem dni i należało obrzezać dziecko, nadano mu imię Jezus, którym nazwał je anioł, zanim się poczęło w łonie."
  tags: []
"Łk2,22":
  text: "Gdy też według Prawa Mojżesza minęły dni jej oczyszczenia, przynieśli go do Jerozolimy, aby stawić go przed Panem;"
  tags: []
"Łk2,23":
  text: "(Tak jak jest napisane w Prawie Pana: Każdy mężczyzna otwierający łono będzie nazywany świętym Panu);"
  tags: []
"Łk2,24":
  text: "I żeby złożyć ofiarę według tego, co zostało powiedziane w Prawie Pana, parę synogarlic albo dwa gołąbki."
  tags: []
"Łk2,25":
  text: "A był w Jerozolimie człowiek imieniem Symeon. Ten człowiek był sprawiedliwy i bogobojny, oczekujący pociechy Izraela, a Duch Święty był nad nim."
  tags: []
"Łk2,26":
  text: "I objawił mu Bóg przez Ducha Świętego, że nie ujrzy śmierci, dopóki nie zobaczy Chrystusa Pańskiego."
  tags: []
"Łk2,27":
  text: "Przyszedł on prowadzony przez Ducha Świętego do świątyni. A gdy rodzice wnosili dziecko – Jezusa, aby postąpić z nim według zwyczaju prawa;"
  tags: []
"Łk2,28":
  text: "Wtedy on, wziąwszy go na ręce, chwalił Boga i mówił:"
  tags: []
"Łk2,29":
  text: "Teraz pozwalasz odejść twemu słudze, Panie, w pokoju, według twego słowa;"
  tags: []
"Łk2,30":
  text: "Gdyż moje oczy ujrzały twoje zbawienie;"
  tags: []
"Łk2,31":
  text: "Które przygotowałeś wobec wszystkich ludzi;"
  tags: []
"Łk2,32":
  text: "Światłość na oświecenie pogan i chwałę twego ludu, Izraela."
  tags: []
"Łk2,33":
  text: "A Józef i jego matka dziwili się temu, co o nim mówiono."
  tags: []
"Łk2,34":
  text: "I błogosławił im Symeon, i powiedział do Marii, jego matki: Oto ten położony jest na upadek i na powstanie wielu w Izraelu, i na znak, przeciwko któremu będą mówić;"
  tags: []
"Łk2,35":
  text: "(I twoją duszę miecz przeniknie), aby myśli wielu serc zostały objawione."
  tags: []
"Łk2,36":
  text: "A była tam prorokini Anna, córka Fanuela, z pokolenia Asera, która była w bardzo podeszłym wieku, a żyła siedem lat z mężem od swego dziewictwa."
  tags: []
"Łk2,37":
  text: "A była wdową mającą około osiemdziesięciu czterech lat, która nie opuszczała świątyni, służąc Bogu w postach i modlitwach dniem i nocą."
  tags: []
"Łk2,38":
  text: "Ona też, przyszedłszy w tej właśnie chwili, dziękowała Panu i mówiła o nim wszystkim, którzy oczekiwali odkupienia w Jerozolimie."
  tags: []
"Łk2,39":
  text: "A gdy wykonali wszystko według prawa Pana, wrócili do Galilei, do swego miasta, Nazaretu."
  tags: []
"Łk2,40":
  text: "Dziecko zaś rosło i umacniało się w duchu, będąc pełne mądrości, a łaska Boga była nad nim."
  tags: []
"Łk2,41":
  text: "A jego rodzice chodzili co roku do Jerozolimy na święto Paschy."
  tags: []
"Łk2,42":
  text: "I gdy miał dwanaście lat, poszli do Jerozolimy, zgodnie ze zwyczajem tego święta."
  tags: []
"Łk2,43":
  text: "A gdy minęły te dni i już wracali, dziecię Jezus zostało w Jerozolimie, ale Józef i jego matka o tym nie wiedzieli."
  tags: []
"Łk2,44":
  text: "Lecz sądząc, że jest w towarzystwie podróżnych, przeszli dzień drogi i szukali go wśród krewnych i znajomych."
  tags: []
"Łk2,45":
  text: "A gdy go nie znaleźli, wrócili do Jerozolimy, szukając go."
  tags: []
"Łk2,46":
  text: "A po trzech dniach znaleźli go siedzącego w świątyni wśród nauczycieli, słuchającego i pytającego ich."
  tags: []
"Łk2,47":
  text: "I wszyscy, którzy go słuchali, zdumiewali się jego rozumem i odpowiedziami."
  tags: []
"Łk2,48":
  text: "A rodzice, ujrzawszy go, zdziwili się. I powiedziała do niego jego matka: Synu, dlaczego nam to zrobiłeś? Oto twój ojciec i ja z bólem serca szukaliśmy ciebie."
  tags: []
"Łk2,49":
  text: "I powiedział do nich: Czemu mnie szukaliście? Czy nie wiedzieliście, że muszę być w tym, co należy do mego Ojca?"
  tags: []
"Łk2,50":
  text: "Lecz oni nie zrozumieli tych słów, które im mówił."
  tags: []
"Łk2,51":
  text: "Wtedy poszedł z nimi i wrócił do Nazaretu, i był im posłuszny. A jego matka zachowywała wszystkie te słowa w swoim sercu."
  tags: []
"Łk2,52":
  text: "A Jezusowi przybywało mądrości i wzrostu oraz łaski u Boga i u ludzi."
  tags: []
