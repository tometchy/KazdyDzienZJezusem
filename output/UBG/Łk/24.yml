"Łk24,1":
  text: "Pierwszego dnia tygodnia wczesnym rankiem przyszły do grobu, niosąc wonności, które przygotowały, a z nimi i inne kobiety;"
  tags: []
"Łk24,2":
  text: "I zastały kamień odwalony od grobowca."
  tags: []
"Łk24,3":
  text: "A wszedłszy do środka, nie znalazły ciała Pana Jezusa."
  tags: []
"Łk24,4":
  text: "A gdy zakłopotały się z tego powodu, nagle dwaj mężowie stanęli przy nich w lśniących szatach."
  tags: []
"Łk24,5":
  text: "I przestraszone, schyliły twarze ku ziemi, a oni powiedzieli do nich: Dlaczego szukacie żyjącego wśród umarłych?"
  tags: []
"Łk24,6":
  text: "Nie ma go tu, ale powstał z martwych. Przypomnijcie sobie, jak wam mówił, gdy był jeszcze w Galilei:"
  tags: []
"Łk24,7":
  text: "Syn Człowieczy musi być wydany w ręce grzesznych ludzi i ukrzyżowany, a trzeciego dnia zmartwychwstać."
  tags: []
"Łk24,8":
  text: "I przypomniały sobie jego słowa."
  tags: []
"Łk24,9":
  text: "A wróciwszy od grobu, oznajmiły to wszystko jedenastu i wszystkim pozostałym."
  tags: []
"Łk24,10":
  text: "A były to: Maria Magdalena i Joanna, Maria, matka Jakuba, i inne z nimi, które opowiedziały to apostołom."
  tags: []
"Łk24,11":
  text: "Lecz ich słowa wydały im się niczym baśnie i nie uwierzyli im."
  tags: []
"Łk24,12":
  text: "Wtedy Piotr wstał i pobiegł do grobu. A gdy się nachylił, zobaczył płótna leżące osobno i odszedł, dziwiąc się temu, co się stało."
  tags: []
"Łk24,13":
  text: "A tego samego dnia dwaj z nich szli do wioski zwanej Emmaus, która była oddalona o sześćdziesiąt stadiów od Jerozolimy."
  tags: []
"Łk24,14":
  text: "I rozmawiali ze sobą o tym wszystkim, co się stało."
  tags: []
"Łk24,15":
  text: "A gdy tak rozmawiali i wspólnie się zastanawiali, sam Jezus przybliżył się i szedł z nimi."
  tags: []
"Łk24,16":
  text: "Lecz ich oczy były zakryte, żeby go nie poznali."
  tags: []
"Łk24,17":
  text: "I zapytał ich: Cóż to za rozmowy prowadzicie między sobą w drodze? Dlaczego jesteście smutni?"
  tags: []
"Łk24,18":
  text: "A jeden z nich, któremu było na imię Kleofas, odpowiedział mu: Czy jesteś tylko przychodniem w Jerozolimie i nie wiesz, co się tam w tych dniach stało?"
  tags: []
"Łk24,19":
  text: "I zapytał ich: O czym? A oni mu odpowiedzieli: O Jezusie z Nazaretu, który był prorokiem potężnym w czynie i słowie przed Bogiem i całym ludem;"
  tags: []
"Łk24,20":
  text: "Jak naczelni kapłani i nasi przywódcy wydali go na śmierć i ukrzyżowali."
  tags: []
"Łk24,21":
  text: "A my spodziewaliśmy się, że on odkupi Izraela. Lecz po tym wszystkim dziś już trzeci dzień, jak to się stało."
  tags: []
"Łk24,22":
  text: "Nadto niektóre z naszych kobiet zdumiały nas: były wcześnie rano przy grobie;"
  tags: []
"Łk24,23":
  text: "A nie znalazłszy jego ciała, przyszły, mówiąc, że miały widzenie aniołów, którzy powiedzieli, iż on żyje."
  tags: []
"Łk24,24":
  text: "Wówczas niektórzy z naszych poszli do grobu i zastali wszystko tak, jak mówiły kobiety, ale jego nie widzieli."
  tags: []
"Łk24,25":
  text: "Wtedy on powiedział do nich: O głupi i serca nieskorego do wierzenia we wszystko, co powiedzieli prorocy!"
  tags: []
"Łk24,26":
  text: "Czyż Chrystus nie musiał tego wycierpieć i wejść do swojej chwały?"
  tags: []
"Łk24,27":
  text: "I zaczynając od Mojżesza i wszystkich proroków, wykładał im, co było o nim napisane we wszystkich Pismach."
  tags: []
"Łk24,28":
  text: "I zbliżyli się do wsi, do której szli, a on zachowywał się tak, jakby miał iść dalej."
  tags: []
"Łk24,29":
  text: "Lecz oni go przymusili, mówiąc: Zostań z nami, bo zbliża się wieczór i dzień się już kończy. Wszedł więc, aby z nimi zostać."
  tags: []
"Łk24,30":
  text: "A gdy siedział z nimi za stołem, wziął chleb, pobłogosławił i łamiąc, podawał im."
  tags: []
"Łk24,31":
  text: "Wtedy otworzyły się im oczy i poznali go, lecz on zniknął im z oczu."
  tags: []
"Łk24,32":
  text: "I mówili między sobą: Czy nasze serce nie pałało w nas, gdy rozmawiał z nami w drodze i otwierał nam Pisma?"
  tags: []
"Łk24,33":
  text: "A wstawszy o tej godzinie, wrócili do Jerozolimy i zastali zgromadzonych jedenastu i tych, którzy z nimi byli."
  tags: []
"Łk24,34":
  text: "Ci mówili: Pan naprawdę zmartwychwstał i ukazał się Szymonowi."
  tags: []
"Łk24,35":
  text: "Oni zaś opowiedzieli, co się stało w drodze i jak go poznali przy łamaniu chleba."
  tags: []
"Łk24,36":
  text: "A gdy to mówili, sam Jezus stanął pośród nich i powiedział do nich: Pokój wam."
  tags: []
"Łk24,37":
  text: "A oni się zlękli i przestraszeni myśleli, że widzą ducha."
  tags: []
"Łk24,38":
  text: "I zapytał ich: Czemu się boicie i czemu myśli budzą się w waszych sercach?"
  tags: []
"Łk24,39":
  text: "Popatrzcie na moje ręce i nogi, że to jestem ja. Dotknijcie mnie i zobaczcie, bo duch nie ma ciała ani kości, jak widzicie, że ja mam."
  tags: []
"Łk24,40":
  text: "Kiedy to powiedział, pokazał im ręce i nogi."
  tags: []
"Łk24,41":
  text: "Lecz gdy oni z radości jeszcze nie wierzyli i dziwili się, zapytał ich: Macie tu coś do jedzenia?"
  tags: []
"Łk24,42":
  text: "I podali mu kawałek pieczonej ryby i plaster miodu."
  tags: []
"Łk24,43":
  text: "A on wziął i jadł przy nich."
  tags: []
"Łk24,44":
  text: "Potem powiedział do nich: To są słowa, które mówiłem do was, będąc jeszcze z wami, że musi się wypełnić wszystko, co jest o mnie napisane w Prawie Mojżesza, u Proroków i w Psalmach."
  tags: []
"Łk24,45":
  text: "Wtedy otworzył ich umysły, żeby rozumieli Pisma."
  tags: []
"Łk24,46":
  text: "I powiedział im: Tak jest napisane i tak Chrystus musiał cierpieć, i trzeciego dnia zmartwychwstać;"
  tags: []
"Łk24,47":
  text: "I w jego imieniu ma być głoszona pokuta i przebaczenie grzechów wszystkim narodom, począwszy od Jerozolimy."
  tags: []
"Łk24,48":
  text: "A wy jesteście tego świadkami."
  tags: []
"Łk24,49":
  text: "A oto ja ześlę na was obietnicę mego Ojca, a wy zostańcie w mieście Jerozolimie, aż będziecie przyobleczeni mocą z wysoka."
  tags: []
"Łk24,50":
  text: "I wyprowadził ich aż do Betanii, a podniósłszy ręce, błogosławił ich."
  tags: []
"Łk24,51":
  text: "A gdy ich błogosławił, rozstał się z nimi i został uniesiony w górę do nieba."
  tags: []
"Łk24,52":
  text: "A oni oddali mu pokłon i wrócili do Jerozolimy z wielką radością."
  tags: []
"Łk24,53":
  text: "I byli zawsze w świątyni, chwaląc i błogosławiąc Boga. Amen."
  tags: []
