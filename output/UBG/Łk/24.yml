"Łk24,1": "Pierwszego dnia tygodnia wczesnym rankiem przyszły do grobu, niosąc wonności, które przygotowały, a z nimi i inne kobiety;"
"Łk24,2": "I zastały kamień odwalony od grobowca."
"Łk24,3": "A wszedłszy do środka, nie znalazły ciała Pana Jezusa."
"Łk24,4": "A gdy zakłopotały się z tego powodu, nagle dwaj mężowie stanęli przy nich w lśniących szatach."
"Łk24,5": "I przestraszone, schyliły twarze ku ziemi, a oni powiedzieli do nich: Dlaczego szukacie żyjącego wśród umarłych?"
"Łk24,6": "Nie ma go tu, ale powstał z martwych. Przypomnijcie sobie, jak wam mówił, gdy był jeszcze w Galilei:"
"Łk24,7": "Syn Człowieczy musi być wydany w ręce grzesznych ludzi i ukrzyżowany, a trzeciego dnia zmartwychwstać."
"Łk24,8": "I przypomniały sobie jego słowa."
"Łk24,9": "A wróciwszy od grobu, oznajmiły to wszystko jedenastu i wszystkim pozostałym."
"Łk24,10": "A były to: Maria Magdalena i Joanna, Maria, matka Jakuba, i inne z nimi, które opowiedziały to apostołom."
"Łk24,11": "Lecz ich słowa wydały im się niczym baśnie i nie uwierzyli im."
"Łk24,12": "Wtedy Piotr wstał i pobiegł do grobu. A gdy się nachylił, zobaczył płótna leżące osobno i odszedł, dziwiąc się temu, co się stało."
"Łk24,13": "A tego samego dnia dwaj z nich szli do wioski zwanej Emmaus, która była oddalona o sześćdziesiąt stadiów od Jerozolimy."
"Łk24,14": "I rozmawiali ze sobą o tym wszystkim, co się stało."
"Łk24,15": "A gdy tak rozmawiali i wspólnie się zastanawiali, sam Jezus przybliżył się i szedł z nimi."
"Łk24,16": "Lecz ich oczy były zakryte, żeby go nie poznali."
"Łk24,17": "I zapytał ich: Cóż to za rozmowy prowadzicie między sobą w drodze? Dlaczego jesteście smutni?"
"Łk24,18": "A jeden z nich, któremu było na imię Kleofas, odpowiedział mu: Czy jesteś tylko przychodniem w Jerozolimie i nie wiesz, co się tam w tych dniach stało?"
"Łk24,19": "I zapytał ich: O czym? A oni mu odpowiedzieli: O Jezusie z Nazaretu, który był prorokiem potężnym w czynie i słowie przed Bogiem i całym ludem;"
"Łk24,20": "Jak naczelni kapłani i nasi przywódcy wydali go na śmierć i ukrzyżowali."
"Łk24,21": "A my spodziewaliśmy się, że on odkupi Izraela. Lecz po tym wszystkim dziś już trzeci dzień, jak to się stało."
"Łk24,22": "Nadto niektóre z naszych kobiet zdumiały nas: były wcześnie rano przy grobie;"
"Łk24,23": "A nie znalazłszy jego ciała, przyszły, mówiąc, że miały widzenie aniołów, którzy powiedzieli, iż on żyje."
"Łk24,24": "Wówczas niektórzy z naszych poszli do grobu i zastali wszystko tak, jak mówiły kobiety, ale jego nie widzieli."
"Łk24,25": "Wtedy on powiedział do nich: O głupi i serca nieskorego do wierzenia we wszystko, co powiedzieli prorocy!"
"Łk24,26": "Czyż Chrystus nie musiał tego wycierpieć i wejść do swojej chwały?"
"Łk24,27": "I zaczynając od Mojżesza i wszystkich proroków, wykładał im, co było o nim napisane we wszystkich Pismach."
"Łk24,28": "I zbliżyli się do wsi, do której szli, a on zachowywał się tak, jakby miał iść dalej."
"Łk24,29": "Lecz oni go przymusili, mówiąc: Zostań z nami, bo zbliża się wieczór i dzień się już kończy. Wszedł więc, aby z nimi zostać."
"Łk24,30": "A gdy siedział z nimi za stołem, wziął chleb, pobłogosławił i łamiąc, podawał im."
"Łk24,31": "Wtedy otworzyły się im oczy i poznali go, lecz on zniknął im z oczu."
"Łk24,32": "I mówili między sobą: Czy nasze serce nie pałało w nas, gdy rozmawiał z nami w drodze i otwierał nam Pisma?"
"Łk24,33": "A wstawszy o tej godzinie, wrócili do Jerozolimy i zastali zgromadzonych jedenastu i tych, którzy z nimi byli."
"Łk24,34": "Ci mówili: Pan naprawdę zmartwychwstał i ukazał się Szymonowi."
"Łk24,35": "Oni zaś opowiedzieli, co się stało w drodze i jak go poznali przy łamaniu chleba."
"Łk24,36": "A gdy to mówili, sam Jezus stanął pośród nich i powiedział do nich: Pokój wam."
"Łk24,37": "A oni się zlękli i przestraszeni myśleli, że widzą ducha."
"Łk24,38": "I zapytał ich: Czemu się boicie i czemu myśli budzą się w waszych sercach?"
"Łk24,39": "Popatrzcie na moje ręce i nogi, że to jestem ja. Dotknijcie mnie i zobaczcie, bo duch nie ma ciała ani kości, jak widzicie, że ja mam."
"Łk24,40": "Kiedy to powiedział, pokazał im ręce i nogi."
"Łk24,41": "Lecz gdy oni z radości jeszcze nie wierzyli i dziwili się, zapytał ich: Macie tu coś do jedzenia?"
"Łk24,42": "I podali mu kawałek pieczonej ryby i plaster miodu."
"Łk24,43": "A on wziął i jadł przy nich."
"Łk24,44": "Potem powiedział do nich: To są słowa, które mówiłem do was, będąc jeszcze z wami, że musi się wypełnić wszystko, co jest o mnie napisane w Prawie Mojżesza, u Proroków i w Psalmach."
"Łk24,45": "Wtedy otworzył ich umysły, żeby rozumieli Pisma."
"Łk24,46": "I powiedział im: Tak jest napisane i tak Chrystus musiał cierpieć, i trzeciego dnia zmartwychwstać;"
"Łk24,47": "I w jego imieniu ma być głoszona pokuta i przebaczenie grzechów wszystkim narodom, począwszy od Jerozolimy."
"Łk24,48": "A wy jesteście tego świadkami."
"Łk24,49": "A oto ja ześlę na was obietnicę mego Ojca, a wy zostańcie w mieście Jerozolimie, aż będziecie przyobleczeni mocą z wysoka."
"Łk24,50": "I wyprowadził ich aż do Betanii, a podniósłszy ręce, błogosławił ich."
"Łk24,51": "A gdy ich błogosławił, rozstał się z nimi i został uniesiony w górę do nieba."
"Łk24,52": "A oni oddali mu pokłon i wrócili do Jerozolimy z wielką radością."
"Łk24,53": "I byli zawsze w świątyni, chwaląc i błogosławiąc Boga. Amen."
