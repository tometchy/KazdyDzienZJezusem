"Łk1,1": "Ponieważ wielu podjęło się sporządzić opis tych wydarzeń, co do których mamy zupełną pewność;"
"Łk1,2": "Tak jak nam je przekazali ci, którzy od początku byli naocznymi świadkami i sługami słowa;"
"Łk1,3": "Postanowiłem i ja, który to wszystko od początku dokładnie wybadałem, opisać ci to po kolei, zacny Teofilu;"
"Łk1,4": "Abyś nabrał pewności co do tego, czego cię nauczono."
"Łk1,5": "Za dni Heroda, króla Judei, żył pewien kapłan imieniem Zachariasz, ze zmiany Abiasza. Miał on za żonę jedną z córek Aarona, której na imię było Elżbieta."
"Łk1,6": "Oboje byli sprawiedliwi w oczach Boga, postępując nienagannie według wszystkich przykazań i nakazów Pana."
"Łk1,7": "Nie mieli jednak dziecka, ponieważ Elżbieta była niepłodna, i oboje byli w podeszłym wieku."
"Łk1,8": "A gdy pełnił służbę kapłańską przed Bogiem w kolejności swojej zmiany;"
"Łk1,9": "Zgodnie ze zwyczajem urzędu kapłańskiego padł na niego los, aby wejść do świątyni Pana i palić kadzidło."
"Łk1,10": "A cała rzesza ludzi modliła się na zewnątrz w czasie kadzenia."
"Łk1,11": "Wtedy ukazał mu się anioł Pana stojący po prawej stronie ołtarza kadzenia."
"Łk1,12": "I przeraził się Zachariasz na jego widok, i ogarnął go strach."
"Łk1,13": "Lecz anioł powiedział do niego: Nie bój się, Zachariaszu, bo twoja modlitwa została wysłuchana. Elżbieta, twoja żona, urodzi ci syna, któremu nadasz imię Jan."
"Łk1,14": "Będzie to dla ciebie radość i wesele; i wielu będzie się radować z jego narodzin."
"Łk1,15": "Będzie bowiem wielki w oczach Pana. Nie będzie pił wina ani mocnego napoju i zostanie napełniony Duchem Świętym już w łonie swojej matki."
"Łk1,16": "I wielu z synów Izraela nawróci do Pana, ich Boga."
"Łk1,17": "On bowiem pójdzie przed nim w duchu i mocy Eliasza, aby zwrócić serca ojców ku dzieciom, a opornych ku roztropności sprawiedliwych, aby przygotować Panu lud gotowy."
"Łk1,18": "I powiedział Zachariasz do anioła: Po czym to poznam? Bo ja jestem stary i moja żona jest w podeszłym wieku."
"Łk1,19": "A anioł mu odpowiedział: Ja jestem Gabriel, który stoi przed Bogiem. Zostałem posłany, aby mówić do ciebie i przynieść ci tę radosną nowinę."
"Łk1,20": "I będziesz niemy, i nie będziesz mógł mówić aż do dnia, kiedy się to stanie, dlatego że nie uwierzyłeś moim słowom, które się wypełnią w swoim czasie."
"Łk1,21": "A ludzie czekali na Zachariasza i dziwili się, że tak długo przebywa w świątyni."
"Łk1,22": "Kiedy wyszedł, nie mógł do nich mówić. I zrozumieli, że miał widzenie w świątyni, bo dawał im znaki, i pozostał niemy."
"Łk1,23": "A gdy skończyły się dni jego posługi, wrócił do swego domu."
"Łk1,24": "Po tych dniach Elżbieta, jego żona, poczęła i ukrywała się przez pięć miesięcy, mówiąc:"
"Łk1,25": "Tak mi uczynił Pan w dniach, kiedy wejrzał na mnie, aby zdjąć moją hańbę w oczach ludzi."
"Łk1,26": "A w szóstym miesiącu Bóg posłał anioła Gabriela do miasta w Galilei, zwanego Nazaret;"
"Łk1,27": "Do dziewicy zaślubionej mężczyźnie, któremu na imię było Józef, z rodu Dawida; a dziewicy było na imię Maria."
"Łk1,28": "Kiedy anioł przyszedł do niej, powiedział: Witaj, obdarowana łaską, Pan jest z tobą. Błogosławiona jesteś między kobietami."
"Łk1,29": "Ale ona, ujrzawszy go, zlękła się z powodu jego słów i zastanawiała się, co miałoby znaczyć to pozdrowienie."
"Łk1,30": "Wtedy anioł powiedział do niej: Nie bój się, Mario, znalazłaś bowiem łaskę u Boga."
"Łk1,31": "Oto poczniesz w swym łonie i urodzisz syna, któremu nadasz imię Jezus."
"Łk1,32": "Będzie on wielki i będzie nazwany Synem Najwyższego, a Pan Bóg da mu tron jego ojca Dawida."
"Łk1,33": "I będzie królował nad domem Jakuba na wieki, a jego królestwu nie będzie końca."
"Łk1,34": "Wtedy Maria powiedziała do anioła: Jak to się stanie, skoro nie obcowałam z mężczyzną?"
"Łk1,35": "A anioł jej odpowiedział: Duch Święty zstąpi na ciebie i moc Najwyższego zacieni cię. Dlatego też to święte, co się z ciebie narodzi, będzie nazwane Synem Bożym."
"Łk1,36": "A oto Elżbieta, twoja krewna, także poczęła syna w swojej starości i jest w szóstym miesiącu ta, którą nazywano niepłodną."
"Łk1,37": "Dla Boga bowiem nie ma nic niemożliwego."
"Łk1,38": "I powiedziała Maria: Oto służebnica Pana, niech mi się stanie według twego słowa. Wtedy odszedł od niej anioł."
"Łk1,39": "W tych dniach Maria wstała i poszła z pośpiechem w góry do miasta w Judei."
"Łk1,40": "Weszła do domu Zachariasza i pozdrowiła Elżbietę."
"Łk1,41": "A gdy Elżbieta usłyszała pozdrowienie Marii, poruszyło się dziecko w jej łonie i Elżbieta została napełniona Duchem Świętym."
"Łk1,42": "I zawołała donośnym głosem: Błogosławiona jesteś między kobietami i błogosławiony jest owoc twego łona."
"Łk1,43": "A skądże mi to, że matka mego Pana przyszła do mnie?"
"Łk1,44": "Gdy bowiem głos twego pozdrowienia zabrzmiał w moich uszach, poruszyło się z radości dziecko w moim łonie."
"Łk1,45": "A błogosławiona, która uwierzyła. Spełni się bowiem to, co zostało jej powiedziane przez Pana."
"Łk1,46": "Wtedy Maria powiedziała: Wielbi moja dusza Pana;"
"Łk1,47": "I rozradował się mój duch w Bogu, moim Zbawicielu;"
"Łk1,48": "Bo wejrzał na uniżenie swojej służebnicy. Oto bowiem wszystkie pokolenia będą mnie odtąd nazywać błogosławioną."
"Łk1,49": "Bo uczynił mi wielkie rzeczy ten, który jest mocny, i święte jest jego imię."
"Łk1,50": "A jego miłosierdzie z pokolenia na pokolenie nad tymi, którzy się go boją."
"Łk1,51": "Okazał moc swoim ramieniem i rozproszył pysznych w myślach ich serc."
"Łk1,52": "Strącił mocarzy z tronów, a wywyższył pokornych."
"Łk1,53": "Głodnych napełnił dobrami, a bogaczy odprawił z niczym."
"Łk1,54": "Ujął się za Izraelem, swym sługą, pomny na swoje miłosierdzie;"
"Łk1,55": "Jak mówił do naszych ojców, do Abrahama i jego potomstwa na wieki."
"Łk1,56": "I została z nią Maria około trzech miesięcy, a potem wróciła do swego domu."
"Łk1,57": "Dla Elżbiety zaś nadszedł czas porodu i urodziła syna."
"Łk1,58": "A gdy jej sąsiedzi i krewni usłyszeli, że Pan okazał jej swoje wielkie miłosierdzie, cieszyli się razem z nią."
"Łk1,59": "A ósmego dnia przyszli, aby obrzezać dziecko, i chcieli nadać mu imię jego ojca, Zachariasza."
"Łk1,60": "Ale jego matka powiedziała: Nie tak, lecz będzie się nazywał Jan."
"Łk1,61": "I powiedzieli do niej: Nie ma nikogo w twoim rodzie, kogo by nazwano tym imieniem."
"Łk1,62": "Pytali więc znakami jego ojca, jak chce go nazwać."
"Łk1,63": "A on poprosił o tabliczkę i napisał: Jan jest jego imię. I dziwili się wszyscy."
"Łk1,64": "Natychmiast otworzyły się jego usta i rozwiązał się jego język, i mówił, wielbiąc Boga."
"Łk1,65": "I padł strach na wszystkich ich sąsiadów, i po całej górskiej krainie judzkiej rozgłoszone zostały wszystkie te słowa."
"Łk1,66": "Wszyscy zaś, którzy o tym słyszeli, brali to sobie do serca i mówili: Cóż to będzie za dziecko? I była z nim ręka Pańska."
"Łk1,67": "A Zachariasz, jego ojciec, będąc napełniony Duchem Świętym, prorokował:"
"Łk1,68": "Błogosławiony niech będzie Pan, Bóg Izraela, bo nawiedził i odkupił swój lud;"
"Łk1,69": "I wzbudził nam róg zbawienia w domu Dawida, swego sługi;"
"Łk1,70": "Jak mówił przez usta swoich świętych proroków, którzy byli od wieków;"
"Łk1,71": "Że nas wybawi od naszych nieprzyjaciół i z ręki wszystkich, którzy nas nienawidzą;"
"Łk1,72": "Aby okazać miłosierdzie naszym ojcom i przypomnieć swoje święte przymierze;"
"Łk1,73": "I przysięgę, którą złożył Abrahamowi, naszemu ojcu;"
"Łk1,74": "Że nam da, abyśmy mu służyli bez lęku, wybawieni z ręki naszych nieprzyjaciół;"
"Łk1,75": "W świętości i sprawiedliwości przed nim po wszystkie dni naszego życia."
"Łk1,76": "A ty, dziecko, będziesz nazwane prorokiem Najwyższego, bo pójdziesz przed obliczem Pana, aby przygotować jego drogi;"
"Łk1,77": "I żeby jego ludowi dać poznać zbawienie przez przebaczenie mu grzechów;"
"Łk1,78": "Dzięki serdecznemu miłosierdziu naszego Boga, przez które nawiedził nas wschód słońca z wysoka;"
"Łk1,79": "Aby oświecić siedzących w ciemności i w cieniu śmierci, aby skierować nasze kroki na drogę pokoju."
"Łk1,80": "A dziecko rosło i umacniało się w duchu, i przebywało na pustyniach aż do dnia ukazania się przed Izraelem."
