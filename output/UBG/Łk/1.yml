"Łk1,1":
  text: "Ponieważ wielu podjęło się sporządzić opis tych wydarzeń, co do których mamy zupełną pewność;"
  tags: []
"Łk1,2":
  text: "Tak jak nam je przekazali ci, którzy od początku byli naocznymi świadkami i sługami słowa;"
  tags: []
"Łk1,3":
  text: "Postanowiłem i ja, który to wszystko od początku dokładnie wybadałem, opisać ci to po kolei, zacny Teofilu;"
  tags: []
"Łk1,4":
  text: "Abyś nabrał pewności co do tego, czego cię nauczono."
  tags: []
"Łk1,5":
  text: "Za dni Heroda, króla Judei, żył pewien kapłan imieniem Zachariasz, ze zmiany Abiasza. Miał on za żonę jedną z córek Aarona, której na imię było Elżbieta."
  tags: []
"Łk1,6":
  text: "Oboje byli sprawiedliwi w oczach Boga, postępując nienagannie według wszystkich przykazań i nakazów Pana."
  tags: []
"Łk1,7":
  text: "Nie mieli jednak dziecka, ponieważ Elżbieta była niepłodna, i oboje byli w podeszłym wieku."
  tags: []
"Łk1,8":
  text: "A gdy pełnił służbę kapłańską przed Bogiem w kolejności swojej zmiany;"
  tags: []
"Łk1,9":
  text: "Zgodnie ze zwyczajem urzędu kapłańskiego padł na niego los, aby wejść do świątyni Pana i palić kadzidło."
  tags: []
"Łk1,10":
  text: "A cała rzesza ludzi modliła się na zewnątrz w czasie kadzenia."
  tags: []
"Łk1,11":
  text: "Wtedy ukazał mu się anioł Pana stojący po prawej stronie ołtarza kadzenia."
  tags: []
"Łk1,12":
  text: "I przeraził się Zachariasz na jego widok, i ogarnął go strach."
  tags: []
"Łk1,13":
  text: "Lecz anioł powiedział do niego: Nie bój się, Zachariaszu, bo twoja modlitwa została wysłuchana. Elżbieta, twoja żona, urodzi ci syna, któremu nadasz imię Jan."
  tags: []
"Łk1,14":
  text: "Będzie to dla ciebie radość i wesele; i wielu będzie się radować z jego narodzin."
  tags: []
"Łk1,15":
  text: "Będzie bowiem wielki w oczach Pana. Nie będzie pił wina ani mocnego napoju i zostanie napełniony Duchem Świętym już w łonie swojej matki."
  tags: []
"Łk1,16":
  text: "I wielu z synów Izraela nawróci do Pana, ich Boga."
  tags: []
"Łk1,17":
  text: "On bowiem pójdzie przed nim w duchu i mocy Eliasza, aby zwrócić serca ojców ku dzieciom, a opornych ku roztropności sprawiedliwych, aby przygotować Panu lud gotowy."
  tags: []
"Łk1,18":
  text: "I powiedział Zachariasz do anioła: Po czym to poznam? Bo ja jestem stary i moja żona jest w podeszłym wieku."
  tags: []
"Łk1,19":
  text: "A anioł mu odpowiedział: Ja jestem Gabriel, który stoi przed Bogiem. Zostałem posłany, aby mówić do ciebie i przynieść ci tę radosną nowinę."
  tags: []
"Łk1,20":
  text: "I będziesz niemy, i nie będziesz mógł mówić aż do dnia, kiedy się to stanie, dlatego że nie uwierzyłeś moim słowom, które się wypełnią w swoim czasie."
  tags: []
"Łk1,21":
  text: "A ludzie czekali na Zachariasza i dziwili się, że tak długo przebywa w świątyni."
  tags: []
"Łk1,22":
  text: "Kiedy wyszedł, nie mógł do nich mówić. I zrozumieli, że miał widzenie w świątyni, bo dawał im znaki, i pozostał niemy."
  tags: []
"Łk1,23":
  text: "A gdy skończyły się dni jego posługi, wrócił do swego domu."
  tags: []
"Łk1,24":
  text: "Po tych dniach Elżbieta, jego żona, poczęła i ukrywała się przez pięć miesięcy, mówiąc:"
  tags: []
"Łk1,25":
  text: "Tak mi uczynił Pan w dniach, kiedy wejrzał na mnie, aby zdjąć moją hańbę w oczach ludzi."
  tags: []
"Łk1,26":
  text: "A w szóstym miesiącu Bóg posłał anioła Gabriela do miasta w Galilei, zwanego Nazaret;"
  tags: []
"Łk1,27":
  text: "Do dziewicy zaślubionej mężczyźnie, któremu na imię było Józef, z rodu Dawida; a dziewicy było na imię Maria."
  tags: []
"Łk1,28":
  text: "Kiedy anioł przyszedł do niej, powiedział: Witaj, obdarowana łaską, Pan jest z tobą. Błogosławiona jesteś między kobietami."
  tags: []
"Łk1,29":
  text: "Ale ona, ujrzawszy go, zlękła się z powodu jego słów i zastanawiała się, co miałoby znaczyć to pozdrowienie."
  tags: []
"Łk1,30":
  text: "Wtedy anioł powiedział do niej: Nie bój się, Mario, znalazłaś bowiem łaskę u Boga."
  tags: []
"Łk1,31":
  text: "Oto poczniesz w swym łonie i urodzisz syna, któremu nadasz imię Jezus."
  tags: []
"Łk1,32":
  text: "Będzie on wielki i będzie nazwany Synem Najwyższego, a Pan Bóg da mu tron jego ojca Dawida."
  tags: []
"Łk1,33":
  text: "I będzie królował nad domem Jakuba na wieki, a jego królestwu nie będzie końca."
  tags: []
"Łk1,34":
  text: "Wtedy Maria powiedziała do anioła: Jak to się stanie, skoro nie obcowałam z mężczyzną?"
  tags: []
"Łk1,35":
  text: "A anioł jej odpowiedział: Duch Święty zstąpi na ciebie i moc Najwyższego zacieni cię. Dlatego też to święte, co się z ciebie narodzi, będzie nazwane Synem Bożym."
  tags: []
"Łk1,36":
  text: "A oto Elżbieta, twoja krewna, także poczęła syna w swojej starości i jest w szóstym miesiącu ta, którą nazywano niepłodną."
  tags: []
"Łk1,37":
  text: "Dla Boga bowiem nie ma nic niemożliwego."
  tags: []
"Łk1,38":
  text: "I powiedziała Maria: Oto służebnica Pana, niech mi się stanie według twego słowa. Wtedy odszedł od niej anioł."
  tags: []
"Łk1,39":
  text: "W tych dniach Maria wstała i poszła z pośpiechem w góry do miasta w Judei."
  tags: []
"Łk1,40":
  text: "Weszła do domu Zachariasza i pozdrowiła Elżbietę."
  tags: []
"Łk1,41":
  text: "A gdy Elżbieta usłyszała pozdrowienie Marii, poruszyło się dziecko w jej łonie i Elżbieta została napełniona Duchem Świętym."
  tags: []
"Łk1,42":
  text: "I zawołała donośnym głosem: Błogosławiona jesteś między kobietami i błogosławiony jest owoc twego łona."
  tags: []
"Łk1,43":
  text: "A skądże mi to, że matka mego Pana przyszła do mnie?"
  tags: []
"Łk1,44":
  text: "Gdy bowiem głos twego pozdrowienia zabrzmiał w moich uszach, poruszyło się z radości dziecko w moim łonie."
  tags: []
"Łk1,45":
  text: "A błogosławiona, która uwierzyła. Spełni się bowiem to, co zostało jej powiedziane przez Pana."
  tags: []
"Łk1,46":
  text: "Wtedy Maria powiedziała: Wielbi moja dusza Pana;"
  tags: []
"Łk1,47":
  text: "I rozradował się mój duch w Bogu, moim Zbawicielu;"
  tags: []
"Łk1,48":
  text: "Bo wejrzał na uniżenie swojej służebnicy. Oto bowiem wszystkie pokolenia będą mnie odtąd nazywać błogosławioną."
  tags: []
"Łk1,49":
  text: "Bo uczynił mi wielkie rzeczy ten, który jest mocny, i święte jest jego imię."
  tags: []
"Łk1,50":
  text: "A jego miłosierdzie z pokolenia na pokolenie nad tymi, którzy się go boją."
  tags: []
"Łk1,51":
  text: "Okazał moc swoim ramieniem i rozproszył pysznych w myślach ich serc."
  tags: []
"Łk1,52":
  text: "Strącił mocarzy z tronów, a wywyższył pokornych."
  tags: []
"Łk1,53":
  text: "Głodnych napełnił dobrami, a bogaczy odprawił z niczym."
  tags: []
"Łk1,54":
  text: "Ujął się za Izraelem, swym sługą, pomny na swoje miłosierdzie;"
  tags: []
"Łk1,55":
  text: "Jak mówił do naszych ojców, do Abrahama i jego potomstwa na wieki."
  tags: []
"Łk1,56":
  text: "I została z nią Maria około trzech miesięcy, a potem wróciła do swego domu."
  tags: []
"Łk1,57":
  text: "Dla Elżbiety zaś nadszedł czas porodu i urodziła syna."
  tags: []
"Łk1,58":
  text: "A gdy jej sąsiedzi i krewni usłyszeli, że Pan okazał jej swoje wielkie miłosierdzie, cieszyli się razem z nią."
  tags: []
"Łk1,59":
  text: "A ósmego dnia przyszli, aby obrzezać dziecko, i chcieli nadać mu imię jego ojca, Zachariasza."
  tags: []
"Łk1,60":
  text: "Ale jego matka powiedziała: Nie tak, lecz będzie się nazywał Jan."
  tags: []
"Łk1,61":
  text: "I powiedzieli do niej: Nie ma nikogo w twoim rodzie, kogo by nazwano tym imieniem."
  tags: []
"Łk1,62":
  text: "Pytali więc znakami jego ojca, jak chce go nazwać."
  tags: []
"Łk1,63":
  text: "A on poprosił o tabliczkę i napisał: Jan jest jego imię. I dziwili się wszyscy."
  tags: []
"Łk1,64":
  text: "Natychmiast otworzyły się jego usta i rozwiązał się jego język, i mówił, wielbiąc Boga."
  tags: []
"Łk1,65":
  text: "I padł strach na wszystkich ich sąsiadów, i po całej górskiej krainie judzkiej rozgłoszone zostały wszystkie te słowa."
  tags: []
"Łk1,66":
  text: "Wszyscy zaś, którzy o tym słyszeli, brali to sobie do serca i mówili: Cóż to będzie za dziecko? I była z nim ręka Pańska."
  tags: []
"Łk1,67":
  text: "A Zachariasz, jego ojciec, będąc napełniony Duchem Świętym, prorokował:"
  tags: []
"Łk1,68":
  text: "Błogosławiony niech będzie Pan, Bóg Izraela, bo nawiedził i odkupił swój lud;"
  tags: []
"Łk1,69":
  text: "I wzbudził nam róg zbawienia w domu Dawida, swego sługi;"
  tags: []
"Łk1,70":
  text: "Jak mówił przez usta swoich świętych proroków, którzy byli od wieków;"
  tags: []
"Łk1,71":
  text: "Że nas wybawi od naszych nieprzyjaciół i z ręki wszystkich, którzy nas nienawidzą;"
  tags: []
"Łk1,72":
  text: "Aby okazać miłosierdzie naszym ojcom i przypomnieć swoje święte przymierze;"
  tags: []
"Łk1,73":
  text: "I przysięgę, którą złożył Abrahamowi, naszemu ojcu;"
  tags: []
"Łk1,74":
  text: "Że nam da, abyśmy mu służyli bez lęku, wybawieni z ręki naszych nieprzyjaciół;"
  tags: []
"Łk1,75":
  text: "W świętości i sprawiedliwości przed nim po wszystkie dni naszego życia."
  tags: []
"Łk1,76":
  text: "A ty, dziecko, będziesz nazwane prorokiem Najwyższego, bo pójdziesz przed obliczem Pana, aby przygotować jego drogi;"
  tags: []
"Łk1,77":
  text: "I żeby jego ludowi dać poznać zbawienie przez przebaczenie mu grzechów;"
  tags: []
"Łk1,78":
  text: "Dzięki serdecznemu miłosierdziu naszego Boga, przez które nawiedził nas wschód słońca z wysoka;"
  tags: []
"Łk1,79":
  text: "Aby oświecić siedzących w ciemności i w cieniu śmierci, aby skierować nasze kroki na drogę pokoju."
  tags: []
"Łk1,80":
  text: "A dziecko rosło i umacniało się w duchu, i przebywało na pustyniach aż do dnia ukazania się przed Izraelem."
  tags: []
