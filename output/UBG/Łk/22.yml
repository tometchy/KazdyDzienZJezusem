"Łk22,1":
  text: "I zbliżało się święto Przaśników, zwane Paschą."
  tags: []
"Łk22,2":
  text: "A naczelni kapłani i uczeni w Piśmie szukali sposobu, jak by go zabić, ale bali się ludu."
  tags: []
"Łk22,3":
  text: "Wtedy szatan wszedł w Judasza, zwanego Iskariotą, który był z grona dwunastu."
  tags: []
"Łk22,4":
  text: "Poszedł więc i umówił się z naczelnymi kapłanami i przełożonymi świątyni, jak ma im go wydać."
  tags: []
"Łk22,5":
  text: "A oni ucieszyli się i umówili się z nim, że dadzą mu pieniądze."
  tags: []
"Łk22,6":
  text: "On się zgodził i szukał sposobności, aby im go wydać z dala od tłumu."
  tags: []
"Łk22,7":
  text: "I nadszedł dzień Przaśników, w którym należało zabić baranka paschalnego."
  tags: []
"Łk22,8":
  text: "Wtedy posłał Piotra i Jana, mówiąc: Idźcie i przygotujcie nam Paschę, abyśmy mogli jeść."
  tags: []
"Łk22,9":
  text: "A oni go zapytali: Gdzie chcesz, abyśmy ją przygotowali?"
  tags: []
"Łk22,10":
  text: "On im odpowiedział: Gdy będziecie wchodzić do miasta, spotka się z wami człowiek niosący dzban wody. Idźcie za nim do domu, do którego wejdzie;"
  tags: []
"Łk22,11":
  text: "I powiedzcie gospodarzowi tego domu: Nauczyciel cię pyta: Gdzie jest pokój, w którym będę jadł Paschę z moimi uczniami?"
  tags: []
"Łk22,12":
  text: "On wam pokaże wielką, urządzoną salę na piętrze. Tam wszystko przygotujcie."
  tags: []
"Łk22,13":
  text: "Odeszli więc i znaleźli wszystko tak, jak im powiedział, i przygotowali Paschę."
  tags: []
"Łk22,14":
  text: "A gdy nadeszła pora, usiadł za stołem, a z nim dwunastu apostołów."
  tags: []
"Łk22,15":
  text: "I powiedział do nich: Gorąco pragnąłem zjeść tę Paschę z wami, zanim będę cierpiał."
  tags: []
"Łk22,16":
  text: "Mówię wam bowiem, że nie będę jej więcej jadł, aż się spełni w królestwie Bożym."
  tags: []
"Łk22,17":
  text: "Potem wziął kielich, złożył dziękczynienie i powiedział: Weźcie go i rozdzielcie między siebie."
  tags: []
"Łk22,18":
  text: "Mówię wam bowiem, że nie będę pił z owocu winorośli, aż przyjdzie królestwo Boże."
  tags: []
"Łk22,19":
  text: "Wziął też chleb, złożył dziękczynienie, połamał i dał im, mówiąc: To jest moje ciało, które jest za was dane. To czyńcie na moją pamiątkę."
  tags: []
"Łk22,20":
  text: "Podobnie i kielich, gdy było po wieczerzy, mówiąc: Ten kielich to nowy testament w mojej krwi, która jest za was wylana."
  tags: []
"Łk22,21":
  text: "Lecz oto ręka tego, który mnie wydaje, jest ze mną na stole."
  tags: []
"Łk22,22":
  text: "Wprawdzie Syn Człowieczy odchodzi, jak zostało postanowione, ale biada temu człowiekowi, przez którego będzie wydany."
  tags: []
"Łk22,23":
  text: "Wtedy oni zaczęli się między sobą pytać, który z nich miałby to zrobić."
  tags: []
"Łk22,24":
  text: "Wszczął się też między nimi spór o to, kto z nich ma być uważany za największego."
  tags: []
"Łk22,25":
  text: "Lecz on powiedział do nich: Królowie narodów panują nad nimi, a ci, którzy sprawują nad nimi władzę, nazywani są dobroczyńcami."
  tags: []
"Łk22,26":
  text: "Wy zaś tak nie postępujcie. Lecz kto jest największy wśród was, niech będzie jak najmniejszy, a kto jest przełożonym, niech będzie jak ten, kto służy."
  tags: []
"Łk22,27":
  text: "Któż bowiem jest większy? Ten, kto siedzi, czy ten, kto służy? Czy nie ten, kto siedzi? Ale ja jestem pośród was jako ten, kto służy."
  tags: []
"Łk22,28":
  text: "A wy jesteście tymi, którzy wytrwali przy mnie w moich próbach."
  tags: []
"Łk22,29":
  text: "I ja przekazuję wam królestwo, jak mnie przekazał mój Ojciec;"
  tags: []
"Łk22,30":
  text: "Abyście jedli i pili za moim stołem w moim królestwie, i zasiadali na tronach, sądząc dwanaście pokoleń Izraela."
  tags: []
"Łk22,31":
  text: "I powiedział Pan: Szymonie, Szymonie, oto szatan wyprosił, żeby was przesiać jak pszenicę."
  tags: []
"Łk22,32":
  text: "Lecz ja prosiłem za tobą, żeby nie ustała twoja wiara. Ty zaś, gdy się nawrócisz, utwierdzaj swoich braci."
  tags: []
"Łk22,33":
  text: "A on mu powiedział: Panie, z tobą gotów jestem iść i do więzienia, i na śmierć."
  tags: []
"Łk22,34":
  text: "On rzekł: Mówię ci, Piotrze, nim zapieje dziś kogut, trzy razy się wyprzesz, że mnie znasz."
  tags: []
"Łk22,35":
  text: "I powiedział do nich: Gdy was posyłałem bez sakiewki, bez torby i bez obuwia, czy brakowało wam czegoś? A oni odpowiedzieli: Niczego."
  tags: []
"Łk22,36":
  text: "Wtedy im powiedział: Teraz jednak, kto ma sakiewkę, niech ją weźmie, podobnie i torbę. A kto nie ma miecza, niech sprzeda swoją szatę i kupi go."
  tags: []
"Łk22,37":
  text: "Mówię wam bowiem, że jeszcze musi się wypełnić na mnie to, co jest napisane: Zaliczono go w poczet złoczyńców. Spełnia się bowiem to, co mnie dotyczy."
  tags: []
"Łk22,38":
  text: "Oni zaś powiedzieli: Panie, oto tu dwa miecze. A on im odpowiedział: Wystarczy."
  tags: []
"Łk22,39":
  text: "Potem wyszedł i udał się według swego zwyczaju na Górę Oliwną, a szli za nim także jego uczniowie."
  tags: []
"Łk22,40":
  text: "Kiedy przyszedł na miejsce, powiedział do nich: Módlcie się, abyście nie ulegli pokusie."
  tags: []
"Łk22,41":
  text: "A sam oddalił się od nich na odległość jakby rzutu kamieniem, upadł na kolana i modlił się:"
  tags: []
"Łk22,42":
  text: "Ojcze, jeśli chcesz, zabierz ode mnie ten kielich. Jednak nie moja wola, lecz twoja niech się stanie."
  tags: []
"Łk22,43":
  text: "Wtedy ukazał mu się anioł z nieba i umacniał go."
  tags: []
"Łk22,44":
  text: "I w śmiertelnym zmaganiu jeszcze gorliwiej się modlił, a jego pot był jak krople krwi spadające na ziemię."
  tags: []
"Łk22,45":
  text: "A gdy wstał od modlitwy i przyszedł do uczniów, zastał ich śpiących ze smutku."
  tags: []
"Łk22,46":
  text: "I powiedział do nich: Czemu śpicie? Wstańcie i módlcie się, abyście nie ulegli pokusie."
  tags: []
"Łk22,47":
  text: "Kiedy on jeszcze mówił, oto nadszedł tłum, a jeden z dwunastu, zwany Judaszem, idąc przodem, zbliżył się do Jezusa, aby go pocałować."
  tags: []
"Łk22,48":
  text: "Lecz Jezus mu powiedział: Judaszu, pocałunkiem wydajesz Syna Człowieczego?"
  tags: []
"Łk22,49":
  text: "A ci, którzy przy nim byli, widząc, na co się zanosi, zapytali go: Panie, czy mamy uderzyć mieczem?"
  tags: []
"Łk22,50":
  text: "I jeden z nich uderzył sługę najwyższego kapłana i odciął mu prawe ucho."
  tags: []
"Łk22,51":
  text: "Ale Jezus odezwał się: Pozwólcie aż dotąd. I dotknąwszy jego ucha, uzdrowił go."
  tags: []
"Łk22,52":
  text: "Wtedy Jezus powiedział do naczelnych kapłanów, przełożonych świątyni i starszych, którzy przyszli do niego: Jak na bandytę wyszliście z mieczami i kijami?"
  tags: []
"Łk22,53":
  text: "Gdy codziennie bywałem z wami w świątyni, nie podnieśliście na mnie ręki. Lecz to jest wasza godzina i moc ciemności."
  tags: []
"Łk22,54":
  text: "Wtedy schwytali go, poprowadzili i przywiedli do domu najwyższego kapłana. A Piotr szedł za nim z daleka."
  tags: []
"Łk22,55":
  text: "Kiedy rozniecili ogień na środku dziedzińca i usiedli razem, usiadł i Piotr wśród nich."
  tags: []
"Łk22,56":
  text: "A pewna służąca, gdy zobaczyła go siedzącego przy ogniu, uważnie mu się przyjrzała i powiedziała: On też był z nim."
  tags: []
"Łk22,57":
  text: "Lecz on zaparł się go, mówiąc: Kobieto, nie znam go."
  tags: []
"Łk22,58":
  text: "A po chwili ktoś inny go zobaczył i powiedział: I ty jesteś jednym z nich. Ale Piotr odrzekł: Człowieku, nie jestem."
  tags: []
"Łk22,59":
  text: "A po upływie około jednej godziny ktoś inny stwierdził stanowczo: Na pewno i ten człowiek był z nim, bo też jest Galilejczykiem."
  tags: []
"Łk22,60":
  text: "Piotr zaś powiedział: Człowieku, nie wiem, o czym mówisz. I natychmiast, gdy on jeszcze mówił, zapiał kogut."
  tags: []
"Łk22,61":
  text: "A Pan odwrócił się i spojrzał na Piotra. I przypomniał sobie Piotr słowa Pana, jak mu powiedział: Zanim kogut zapieje, trzy razy się mnie wyprzesz."
  tags: []
"Łk22,62":
  text: "I Piotr, wyszedłszy na zewnątrz, gorzko zapłakał."
  tags: []
"Łk22,63":
  text: "Tymczasem mężczyźni, którzy trzymali Jezusa, naśmiewali się z niego i bili go."
  tags: []
"Łk22,64":
  text: "A zasłoniwszy mu oczy, bili go po twarzy i mówili: Prorokuj, kto cię uderzył."
  tags: []
"Łk22,65":
  text: "Wiele też innych bluźnierstw wypowiadali przeciwko niemu."
  tags: []
"Łk22,66":
  text: "A gdy nastał dzień, zebrali się starsi ludu, naczelni kapłani i uczeni w Piśmie i przyprowadzili go przed swoją Radę."
  tags: []
"Łk22,67":
  text: "I mówili: Jeśli ty jesteś Chrystusem, powiedz nam. I odpowiedział im: Jeśli wam powiem, nie uwierzycie."
  tags: []
"Łk22,68":
  text: "A jeśli też o coś zapytam, nie odpowiecie mi ani mnie nie wypuścicie."
  tags: []
"Łk22,69":
  text: "Odtąd Syn Człowieczy będzie siedział po prawicy mocy Boga."
  tags: []
"Łk22,70":
  text: "Wtedy wszyscy powiedzieli: Więc ty jesteś Synem Bożym? A on im odpowiedział: Wy sami mówicie, że ja jestem."
  tags: []
"Łk22,71":
  text: "A oni rzekli: Czyż jeszcze potrzebujemy świadectwa? Sami przecież słyszeliśmy z jego ust."
  tags: []
