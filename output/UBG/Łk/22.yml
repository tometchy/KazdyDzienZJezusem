"Łk22,1": "I zbliżało się święto Przaśników, zwane Paschą."
"Łk22,2": "A naczelni kapłani i uczeni w Piśmie szukali sposobu, jak by go zabić, ale bali się ludu."
"Łk22,3": "Wtedy szatan wszedł w Judasza, zwanego Iskariotą, który był z grona dwunastu."
"Łk22,4": "Poszedł więc i umówił się z naczelnymi kapłanami i przełożonymi świątyni, jak ma im go wydać."
"Łk22,5": "A oni ucieszyli się i umówili się z nim, że dadzą mu pieniądze."
"Łk22,6": "On się zgodził i szukał sposobności, aby im go wydać z dala od tłumu."
"Łk22,7": "I nadszedł dzień Przaśników, w którym należało zabić baranka paschalnego."
"Łk22,8": "Wtedy posłał Piotra i Jana, mówiąc: Idźcie i przygotujcie nam Paschę, abyśmy mogli jeść."
"Łk22,9": "A oni go zapytali: Gdzie chcesz, abyśmy ją przygotowali?"
"Łk22,10": "On im odpowiedział: Gdy będziecie wchodzić do miasta, spotka się z wami człowiek niosący dzban wody. Idźcie za nim do domu, do którego wejdzie;"
"Łk22,11": "I powiedzcie gospodarzowi tego domu: Nauczyciel cię pyta: Gdzie jest pokój, w którym będę jadł Paschę z moimi uczniami?"
"Łk22,12": "On wam pokaże wielką, urządzoną salę na piętrze. Tam wszystko przygotujcie."
"Łk22,13": "Odeszli więc i znaleźli wszystko tak, jak im powiedział, i przygotowali Paschę."
"Łk22,14": "A gdy nadeszła pora, usiadł za stołem, a z nim dwunastu apostołów."
"Łk22,15": "I powiedział do nich: Gorąco pragnąłem zjeść tę Paschę z wami, zanim będę cierpiał."
"Łk22,16": "Mówię wam bowiem, że nie będę jej więcej jadł, aż się spełni w królestwie Bożym."
"Łk22,17": "Potem wziął kielich, złożył dziękczynienie i powiedział: Weźcie go i rozdzielcie między siebie."
"Łk22,18": "Mówię wam bowiem, że nie będę pił z owocu winorośli, aż przyjdzie królestwo Boże."
"Łk22,19": "Wziął też chleb, złożył dziękczynienie, połamał i dał im, mówiąc: To jest moje ciało, które jest za was dane. To czyńcie na moją pamiątkę."
"Łk22,20": "Podobnie i kielich, gdy było po wieczerzy, mówiąc: Ten kielich to nowy testament w mojej krwi, która jest za was wylana."
"Łk22,21": "Lecz oto ręka tego, który mnie wydaje, jest ze mną na stole."
"Łk22,22": "Wprawdzie Syn Człowieczy odchodzi, jak zostało postanowione, ale biada temu człowiekowi, przez którego będzie wydany."
"Łk22,23": "Wtedy oni zaczęli się między sobą pytać, który z nich miałby to zrobić."
"Łk22,24": "Wszczął się też między nimi spór o to, kto z nich ma być uważany za największego."
"Łk22,25": "Lecz on powiedział do nich: Królowie narodów panują nad nimi, a ci, którzy sprawują nad nimi władzę, nazywani są dobroczyńcami."
"Łk22,26": "Wy zaś tak nie postępujcie. Lecz kto jest największy wśród was, niech będzie jak najmniejszy, a kto jest przełożonym, niech będzie jak ten, kto służy."
"Łk22,27": "Któż bowiem jest większy? Ten, kto siedzi, czy ten, kto służy? Czy nie ten, kto siedzi? Ale ja jestem pośród was jako ten, kto służy."
"Łk22,28": "A wy jesteście tymi, którzy wytrwali przy mnie w moich próbach."
"Łk22,29": "I ja przekazuję wam królestwo, jak mnie przekazał mój Ojciec;"
"Łk22,30": "Abyście jedli i pili za moim stołem w moim królestwie, i zasiadali na tronach, sądząc dwanaście pokoleń Izraela."
"Łk22,31": "I powiedział Pan: Szymonie, Szymonie, oto szatan wyprosił, żeby was przesiać jak pszenicę."
"Łk22,32": "Lecz ja prosiłem za tobą, żeby nie ustała twoja wiara. Ty zaś, gdy się nawrócisz, utwierdzaj swoich braci."
"Łk22,33": "A on mu powiedział: Panie, z tobą gotów jestem iść i do więzienia, i na śmierć."
"Łk22,34": "On rzekł: Mówię ci, Piotrze, nim zapieje dziś kogut, trzy razy się wyprzesz, że mnie znasz."
"Łk22,35": "I powiedział do nich: Gdy was posyłałem bez sakiewki, bez torby i bez obuwia, czy brakowało wam czegoś? A oni odpowiedzieli: Niczego."
"Łk22,36": "Wtedy im powiedział: Teraz jednak, kto ma sakiewkę, niech ją weźmie, podobnie i torbę. A kto nie ma miecza, niech sprzeda swoją szatę i kupi go."
"Łk22,37": "Mówię wam bowiem, że jeszcze musi się wypełnić na mnie to, co jest napisane: Zaliczono go w poczet złoczyńców. Spełnia się bowiem to, co mnie dotyczy."
"Łk22,38": "Oni zaś powiedzieli: Panie, oto tu dwa miecze. A on im odpowiedział: Wystarczy."
"Łk22,39": "Potem wyszedł i udał się według swego zwyczaju na Górę Oliwną, a szli za nim także jego uczniowie."
"Łk22,40": "Kiedy przyszedł na miejsce, powiedział do nich: Módlcie się, abyście nie ulegli pokusie."
"Łk22,41": "A sam oddalił się od nich na odległość jakby rzutu kamieniem, upadł na kolana i modlił się:"
"Łk22,42": "Ojcze, jeśli chcesz, zabierz ode mnie ten kielich. Jednak nie moja wola, lecz twoja niech się stanie."
"Łk22,43": "Wtedy ukazał mu się anioł z nieba i umacniał go."
"Łk22,44": "I w śmiertelnym zmaganiu jeszcze gorliwiej się modlił, a jego pot był jak krople krwi spadające na ziemię."
"Łk22,45": "A gdy wstał od modlitwy i przyszedł do uczniów, zastał ich śpiących ze smutku."
"Łk22,46": "I powiedział do nich: Czemu śpicie? Wstańcie i módlcie się, abyście nie ulegli pokusie."
"Łk22,47": "Kiedy on jeszcze mówił, oto nadszedł tłum, a jeden z dwunastu, zwany Judaszem, idąc przodem, zbliżył się do Jezusa, aby go pocałować."
"Łk22,48": "Lecz Jezus mu powiedział: Judaszu, pocałunkiem wydajesz Syna Człowieczego?"
"Łk22,49": "A ci, którzy przy nim byli, widząc, na co się zanosi, zapytali go: Panie, czy mamy uderzyć mieczem?"
"Łk22,50": "I jeden z nich uderzył sługę najwyższego kapłana i odciął mu prawe ucho."
"Łk22,51": "Ale Jezus odezwał się: Pozwólcie aż dotąd. I dotknąwszy jego ucha, uzdrowił go."
"Łk22,52": "Wtedy Jezus powiedział do naczelnych kapłanów, przełożonych świątyni i starszych, którzy przyszli do niego: Jak na bandytę wyszliście z mieczami i kijami?"
"Łk22,53": "Gdy codziennie bywałem z wami w świątyni, nie podnieśliście na mnie ręki. Lecz to jest wasza godzina i moc ciemności."
"Łk22,54": "Wtedy schwytali go, poprowadzili i przywiedli do domu najwyższego kapłana. A Piotr szedł za nim z daleka."
"Łk22,55": "Kiedy rozniecili ogień na środku dziedzińca i usiedli razem, usiadł i Piotr wśród nich."
"Łk22,56": "A pewna służąca, gdy zobaczyła go siedzącego przy ogniu, uważnie mu się przyjrzała i powiedziała: On też był z nim."
"Łk22,57": "Lecz on zaparł się go, mówiąc: Kobieto, nie znam go."
"Łk22,58": "A po chwili ktoś inny go zobaczył i powiedział: I ty jesteś jednym z nich. Ale Piotr odrzekł: Człowieku, nie jestem."
"Łk22,59": "A po upływie około jednej godziny ktoś inny stwierdził stanowczo: Na pewno i ten człowiek był z nim, bo też jest Galilejczykiem."
"Łk22,60": "Piotr zaś powiedział: Człowieku, nie wiem, o czym mówisz. I natychmiast, gdy on jeszcze mówił, zapiał kogut."
"Łk22,61": "A Pan odwrócił się i spojrzał na Piotra. I przypomniał sobie Piotr słowa Pana, jak mu powiedział: Zanim kogut zapieje, trzy razy się mnie wyprzesz."
"Łk22,62": "I Piotr, wyszedłszy na zewnątrz, gorzko zapłakał."
"Łk22,63": "Tymczasem mężczyźni, którzy trzymali Jezusa, naśmiewali się z niego i bili go."
"Łk22,64": "A zasłoniwszy mu oczy, bili go po twarzy i mówili: Prorokuj, kto cię uderzył."
"Łk22,65": "Wiele też innych bluźnierstw wypowiadali przeciwko niemu."
"Łk22,66": "A gdy nastał dzień, zebrali się starsi ludu, naczelni kapłani i uczeni w Piśmie i przyprowadzili go przed swoją Radę."
"Łk22,67": "I mówili: Jeśli ty jesteś Chrystusem, powiedz nam. I odpowiedział im: Jeśli wam powiem, nie uwierzycie."
"Łk22,68": "A jeśli też o coś zapytam, nie odpowiecie mi ani mnie nie wypuścicie."
"Łk22,69": "Odtąd Syn Człowieczy będzie siedział po prawicy mocy Boga."
"Łk22,70": "Wtedy wszyscy powiedzieli: Więc ty jesteś Synem Bożym? A on im odpowiedział: Wy sami mówicie, że ja jestem."
"Łk22,71": "A oni rzekli: Czyż jeszcze potrzebujemy świadectwa? Sami przecież słyszeliśmy z jego ust."
