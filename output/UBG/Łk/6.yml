"Łk6,1":
  text: "W drugi szabat Jezus szedł przez zboża, a jego uczniowie zrywali kłosy i jedli, wykruszając je rękami."
  tags: []
"Łk6,2":
  text: "Wtedy niektórzy z faryzeuszy mówili do nich: Dlaczego robicie to, czego nie wolno robić w szabat?"
  tags: []
"Łk6,3":
  text: "A Jezus im odpowiedział: Czy nie czytaliście o tym, co zrobił Dawid, gdy był głodny, on i ci, którzy z nim byli?"
  tags: []
"Łk6,4":
  text: "Jak wszedł do domu Bożego, wziął chleby pokładne, których nie wolno było jeść nikomu oprócz kapłanów, i jadł, i dał również tym, którzy z nim byli?"
  tags: []
"Łk6,5":
  text: "I powiedział im: Syn Człowieczy jest też Panem szabatu."
  tags: []
"Łk6,6":
  text: "W inny szabat Jezus wszedł do synagogi i nauczał. A był tam człowiek, który miał uschłą prawą rękę."
  tags: []
"Łk6,7":
  text: "I obserwowali go uczeni w Piśmie i faryzeusze, czy uzdrowi w szabat, aby znaleźć powód do oskarżenia go."
  tags: []
"Łk6,8":
  text: "Ale on znał ich myśli i powiedział do człowieka, który miał uschłą rękę: Podnieś się i stań na środku. A on podniósł się i stanął."
  tags: []
"Łk6,9":
  text: "Wtedy Jezus powiedział do nich: Spytam was o pewną rzecz: Czy wolno w szabaty czynić dobrze, czy źle? Ocalić życie czy zniszczyć?"
  tags: []
"Łk6,10":
  text: "A spojrzawszy wokoło po wszystkich, powiedział do tego człowieka: Wyciągnij rękę. A on to zrobił i jego ręka znowu stała się zdrowa tak jak druga."
  tags: []
"Łk6,11":
  text: "Ale oni wpadli we wściekłość i rozmawiali między sobą, co by zrobić Jezusowi."
  tags: []
"Łk6,12":
  text: "W tych dniach odszedł na górę, aby się modlić, i spędził całą noc na modlitwie do Boga."
  tags: []
"Łk6,13":
  text: "A gdy nastał dzień, przywołał swych uczniów i wybrał z nich dwunastu, których też nazwał apostołami:"
  tags: []
"Łk6,14":
  text: "Szymona, którego nazwał Piotrem, i jego brata Andrzeja, Jakuba i Jana, Filipa i Bartłomieja;"
  tags: []
"Łk6,15":
  text: "Mateusza i Tomasza, Jakuba, syna Alfeusza, i Szymona, zwanego Zelotą;"
  tags: []
"Łk6,16":
  text: "Judasza, brata Jakuba, i Judasza Iskariotę, który stał się zdrajcą."
  tags: []
"Łk6,17":
  text: "Potem zszedł z nimi i stanął na równinie. Była z nim też gromada jego uczniów i wielkie mnóstwo ludzi z całej Judei i Jerozolimy oraz z okolic nadmorskich, z Tyru i Sydonu, którzy przyszli, aby go słuchać i aby ich uzdrowił z chorób."
  tags: []
"Łk6,18":
  text: "Także ci, którzy byli dręczeni przez duchy nieczyste, zostali uzdrowieni."
  tags: []
"Łk6,19":
  text: "A wszyscy ludzie starali się go dotknąć, ponieważ moc wychodziła z niego i uzdrawiała wszystkich."
  tags: []
"Łk6,20":
  text: "A on podniósł oczy na uczniów i mówił: Błogosławieni jesteście wy, ubodzy, bo wasze jest królestwo Boże."
  tags: []
"Łk6,21":
  text: "Błogosławieni jesteście wy, którzy teraz cierpicie głód, bo będziecie nasyceni. Błogosławieni jesteście wy, którzy teraz płaczecie, bo śmiać się będziecie."
  tags: []
"Łk6,22":
  text: "Błogosławieni będziecie, gdy ludzie będą was nienawidzić i gdy was wyłączą spośród siebie, będą was znieważać i odrzucą wasze imię jako niecne z powodu Syna Człowieczego."
  tags: []
"Łk6,23":
  text: "Radujcie się w tym dniu i weselcie, bo obfita jest wasza nagroda w niebie. Tak samo bowiem ich ojcowie postępowali wobec proroków."
  tags: []
"Łk6,24":
  text: "Lecz biada wam, bogaczom, bo już otrzymaliście waszą pociechę."
  tags: []
"Łk6,25":
  text: "Biada wam, którzy jesteście nasyceni, bo będziecie cierpieć głód. Biada wam, którzy się teraz śmiejecie, bo będziecie się smucić i płakać."
  tags: []
"Łk6,26":
  text: "Biada wam, gdy wszyscy ludzie będą dobrze o was mówić, bo tak ich ojcowie postępowali wobec fałszywych proroków."
  tags: []
"Łk6,27":
  text: "Lecz mówię wam, którzy słuchacie: Miłujcie waszych nieprzyjaciół, dobrze czyńcie tym, którzy was nienawidzą."
  tags: []
"Łk6,28":
  text: "Błogosławcie tym, którzy was przeklinają, módlcie się za tych, którzy wam wyrządzają zło."
  tags: []
"Łk6,29":
  text: "Temu, kto cię uderzy w policzek, nadstaw i drugi, a temu, kto zabiera ci płaszcz, i szaty nie odmawiaj."
  tags: []
"Łk6,30":
  text: "Każdemu, kto cię prosi, daj, a od tego, kto bierze, co twoje, nie upominaj się o zwrot."
  tags: []
"Łk6,31":
  text: "Jak chcecie, aby ludzie wam czynili, tak i wy im czyńcie."
  tags: []
"Łk6,32":
  text: "Jeśli bowiem miłujecie tych, którzy was miłują, na jaką wdzięczność zasługujecie? Przecież i grzesznicy miłują tych, którzy ich miłują."
  tags: []
"Łk6,33":
  text: "A jeśli dobrze czynicie tym, którzy wam dobrze czynią, na jaką wdzięczność zasługujecie? Przecież i grzesznicy postępują tak samo."
  tags: []
"Łk6,34":
  text: "I jeśli pożyczacie tym, od których spodziewacie się zwrotu, na jaką wdzięczność zasługujecie? Przecież i grzesznicy pożyczają grzesznikom, aby z powrotem odebrać tyle samo."
  tags: []
"Łk6,35":
  text: "Ale miłujcie waszych nieprzyjaciół, czyńcie im dobrze i pożyczajcie, niczego się za to nie spodziewając, a wielka będzie wasza nagroda i będziecie synami Najwyższego. On bowiem jest dobry dla niewdzięcznych i złych."
  tags: []
"Łk6,36":
  text: "Dlatego bądźcie miłosierni, jak i wasz Ojciec jest miłosierny."
  tags: []
"Łk6,37":
  text: "Nie sądźcie, a nie będziecie sądzeni; nie potępiajcie, a nie będziecie potępieni; przebaczajcie, a będzie wam przebaczone."
  tags: []
"Łk6,38":
  text: "Dawajcie, a będzie wam dane; miarę dobrą, natłoczoną, utrzęsioną i przelewającą się dadzą w wasze zanadrze. Jaką bowiem miarą mierzycie, taką będzie wam odmierzone."
  tags: []
"Łk6,39":
  text: "I opowiedział im przypowieść: Czy może ślepy prowadzić ślepego? Czyż obaj nie wpadną do dołu?"
  tags: []
"Łk6,40":
  text: "Uczeń nie przewyższa swego mistrza. Lecz doskonały będzie każdy, kto będzie jak jego mistrz."
  tags: []
"Łk6,41":
  text: "Czemu widzisz źdźbło w oku swego brata, a na belkę, która jest w twoim oku, nie zwracasz uwagi?"
  tags: []
"Łk6,42":
  text: "Albo jakże możesz mówić swemu bratu: Bracie, pozwól, że wyjmę źdźbło, które jest w twoim oku, gdy sam nie widzisz belki, która jest w twoim oku? Obłudniku, wyjmij najpierw belkę ze swego oka, a wtedy przejrzysz, aby wyjąć źdźbło, które jest w oku twego brata."
  tags: []
"Łk6,43":
  text: "Nie jest bowiem dobre to drzewo, które wydaje zły owoc, ani złe to drzewo, które wydaje dobry owoc."
  tags: []
"Łk6,44":
  text: "Gdyż każde drzewo poznaje się po jego owocu. Nie zbiera się bowiem fig z cierni ani winogron z głogu."
  tags: []
"Łk6,45":
  text: "Dobry człowiek z dobrego skarbca swego serca wydobywa dobre rzeczy, a zły człowiek ze złego skarbca swego serca wydobywa złe rzeczy. Z obfitości serca bowiem mówią jego usta."
  tags: []
"Łk6,46":
  text: "Dlaczego więc mówicie do mnie: Panie, Panie, a nie robicie tego, co mówię?"
  tags: []
"Łk6,47":
  text: "Pokażę wam, do kogo jest podobny każdy, kto przychodzi do mnie, słucha moich słów i wypełnia je."
  tags: []
"Łk6,48":
  text: "Podobny jest do człowieka budującego dom, który zrobił głęboki wykop i założył fundament na skale. A gdy przyszła powódź, rzeka uderzyła w ten dom, ale nie mogła go poruszyć, bo był założony na skale."
  tags: []
"Łk6,49":
  text: "Ten zaś, kto słucha, a nie wypełnia, podobny jest do człowieka, który zbudował swój dom na ziemi bez fundamentu. Uderzyła w niego rzeka i natychmiast się zawalił, a upadek tego domu był wielki."
  tags: []
