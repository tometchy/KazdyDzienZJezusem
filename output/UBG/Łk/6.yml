"Łk6,1": "W drugi szabat Jezus szedł przez zboża, a jego uczniowie zrywali kłosy i jedli, wykruszając je rękami."
"Łk6,2": "Wtedy niektórzy z faryzeuszy mówili do nich: Dlaczego robicie to, czego nie wolno robić w szabat?"
"Łk6,3": "A Jezus im odpowiedział: Czy nie czytaliście o tym, co zrobił Dawid, gdy był głodny, on i ci, którzy z nim byli?"
"Łk6,4": "Jak wszedł do domu Bożego, wziął chleby pokładne, których nie wolno było jeść nikomu oprócz kapłanów, i jadł, i dał również tym, którzy z nim byli?"
"Łk6,5": "I powiedział im: Syn Człowieczy jest też Panem szabatu."
"Łk6,6": "W inny szabat Jezus wszedł do synagogi i nauczał. A był tam człowiek, który miał uschłą prawą rękę."
"Łk6,7": "I obserwowali go uczeni w Piśmie i faryzeusze, czy uzdrowi w szabat, aby znaleźć powód do oskarżenia go."
"Łk6,8": "Ale on znał ich myśli i powiedział do człowieka, który miał uschłą rękę: Podnieś się i stań na środku. A on podniósł się i stanął."
"Łk6,9": "Wtedy Jezus powiedział do nich: Spytam was o pewną rzecz: Czy wolno w szabaty czynić dobrze, czy źle? Ocalić życie czy zniszczyć?"
"Łk6,10": "A spojrzawszy wokoło po wszystkich, powiedział do tego człowieka: Wyciągnij rękę. A on to zrobił i jego ręka znowu stała się zdrowa tak jak druga."
"Łk6,11": "Ale oni wpadli we wściekłość i rozmawiali między sobą, co by zrobić Jezusowi."
"Łk6,12": "W tych dniach odszedł na górę, aby się modlić, i spędził całą noc na modlitwie do Boga."
"Łk6,13": "A gdy nastał dzień, przywołał swych uczniów i wybrał z nich dwunastu, których też nazwał apostołami:"
"Łk6,14": "Szymona, którego nazwał Piotrem, i jego brata Andrzeja, Jakuba i Jana, Filipa i Bartłomieja;"
"Łk6,15": "Mateusza i Tomasza, Jakuba, syna Alfeusza, i Szymona, zwanego Zelotą;"
"Łk6,16": "Judasza, brata Jakuba, i Judasza Iskariotę, który stał się zdrajcą."
"Łk6,17": "Potem zszedł z nimi i stanął na równinie. Była z nim też gromada jego uczniów i wielkie mnóstwo ludzi z całej Judei i Jerozolimy oraz z okolic nadmorskich, z Tyru i Sydonu, którzy przyszli, aby go słuchać i aby ich uzdrowił z chorób."
"Łk6,18": "Także ci, którzy byli dręczeni przez duchy nieczyste, zostali uzdrowieni."
"Łk6,19": "A wszyscy ludzie starali się go dotknąć, ponieważ moc wychodziła z niego i uzdrawiała wszystkich."
"Łk6,20": "A on podniósł oczy na uczniów i mówił: Błogosławieni jesteście wy, ubodzy, bo wasze jest królestwo Boże."
"Łk6,21": "Błogosławieni jesteście wy, którzy teraz cierpicie głód, bo będziecie nasyceni. Błogosławieni jesteście wy, którzy teraz płaczecie, bo śmiać się będziecie."
"Łk6,22": "Błogosławieni będziecie, gdy ludzie będą was nienawidzić i gdy was wyłączą spośród siebie, będą was znieważać i odrzucą wasze imię jako niecne z powodu Syna Człowieczego."
"Łk6,23": "Radujcie się w tym dniu i weselcie, bo obfita jest wasza nagroda w niebie. Tak samo bowiem ich ojcowie postępowali wobec proroków."
"Łk6,24": "Lecz biada wam, bogaczom, bo już otrzymaliście waszą pociechę."
"Łk6,25": "Biada wam, którzy jesteście nasyceni, bo będziecie cierpieć głód. Biada wam, którzy się teraz śmiejecie, bo będziecie się smucić i płakać."
"Łk6,26": "Biada wam, gdy wszyscy ludzie będą dobrze o was mówić, bo tak ich ojcowie postępowali wobec fałszywych proroków."
"Łk6,27": "Lecz mówię wam, którzy słuchacie: Miłujcie waszych nieprzyjaciół, dobrze czyńcie tym, którzy was nienawidzą."
"Łk6,28": "Błogosławcie tym, którzy was przeklinają, módlcie się za tych, którzy wam wyrządzają zło."
"Łk6,29": "Temu, kto cię uderzy w policzek, nadstaw i drugi, a temu, kto zabiera ci płaszcz, i szaty nie odmawiaj."
"Łk6,30": "Każdemu, kto cię prosi, daj, a od tego, kto bierze, co twoje, nie upominaj się o zwrot."
"Łk6,31": "Jak chcecie, aby ludzie wam czynili, tak i wy im czyńcie."
"Łk6,32": "Jeśli bowiem miłujecie tych, którzy was miłują, na jaką wdzięczność zasługujecie? Przecież i grzesznicy miłują tych, którzy ich miłują."
"Łk6,33": "A jeśli dobrze czynicie tym, którzy wam dobrze czynią, na jaką wdzięczność zasługujecie? Przecież i grzesznicy postępują tak samo."
"Łk6,34": "I jeśli pożyczacie tym, od których spodziewacie się zwrotu, na jaką wdzięczność zasługujecie? Przecież i grzesznicy pożyczają grzesznikom, aby z powrotem odebrać tyle samo."
"Łk6,35": "Ale miłujcie waszych nieprzyjaciół, czyńcie im dobrze i pożyczajcie, niczego się za to nie spodziewając, a wielka będzie wasza nagroda i będziecie synami Najwyższego. On bowiem jest dobry dla niewdzięcznych i złych."
"Łk6,36": "Dlatego bądźcie miłosierni, jak i wasz Ojciec jest miłosierny."
"Łk6,37": "Nie sądźcie, a nie będziecie sądzeni; nie potępiajcie, a nie będziecie potępieni; przebaczajcie, a będzie wam przebaczone."
"Łk6,38": "Dawajcie, a będzie wam dane; miarę dobrą, natłoczoną, utrzęsioną i przelewającą się dadzą w wasze zanadrze. Jaką bowiem miarą mierzycie, taką będzie wam odmierzone."
"Łk6,39": "I opowiedział im przypowieść: Czy może ślepy prowadzić ślepego? Czyż obaj nie wpadną do dołu?"
"Łk6,40": "Uczeń nie przewyższa swego mistrza. Lecz doskonały będzie każdy, kto będzie jak jego mistrz."
"Łk6,41": "Czemu widzisz źdźbło w oku swego brata, a na belkę, która jest w twoim oku, nie zwracasz uwagi?"
"Łk6,42": "Albo jakże możesz mówić swemu bratu: Bracie, pozwól, że wyjmę źdźbło, które jest w twoim oku, gdy sam nie widzisz belki, która jest w twoim oku? Obłudniku, wyjmij najpierw belkę ze swego oka, a wtedy przejrzysz, aby wyjąć źdźbło, które jest w oku twego brata."
"Łk6,43": "Nie jest bowiem dobre to drzewo, które wydaje zły owoc, ani złe to drzewo, które wydaje dobry owoc."
"Łk6,44": "Gdyż każde drzewo poznaje się po jego owocu. Nie zbiera się bowiem fig z cierni ani winogron z głogu."
"Łk6,45": "Dobry człowiek z dobrego skarbca swego serca wydobywa dobre rzeczy, a zły człowiek ze złego skarbca swego serca wydobywa złe rzeczy. Z obfitości serca bowiem mówią jego usta."
"Łk6,46": "Dlaczego więc mówicie do mnie: Panie, Panie, a nie robicie tego, co mówię?"
"Łk6,47": "Pokażę wam, do kogo jest podobny każdy, kto przychodzi do mnie, słucha moich słów i wypełnia je."
"Łk6,48": "Podobny jest do człowieka budującego dom, który zrobił głęboki wykop i założył fundament na skale. A gdy przyszła powódź, rzeka uderzyła w ten dom, ale nie mogła go poruszyć, bo był założony na skale."
"Łk6,49": "Ten zaś, kto słucha, a nie wypełnia, podobny jest do człowieka, który zbudował swój dom na ziemi bez fundamentu. Uderzyła w niego rzeka i natychmiast się zawalił, a upadek tego domu był wielki."
