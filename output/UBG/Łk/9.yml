"Łk9,1": "A Jezus, przywoławszy swoich dwunastu uczniów, dał im moc i władzę nad wszystkimi demonami i moc, aby uzdrawiali choroby."
"Łk9,2": "I rozesłał ich, żeby głosili królestwo Boże i uzdrawiali chorych."
"Łk9,3": "Powiedział też do nich: Nie bierzcie nic na drogę: ani laski, ani torby, ani chleba, ani pieniędzy i nie miejcie dwóch szat."
"Łk9,4": "A gdy wejdziecie do jakiegoś domu, tam pozostańcie i stamtąd wychodźcie."
"Łk9,5": "A jeśli was nie przyjmą, wychodząc z tego miasta, strząśnijcie pył z waszych nóg na świadectwo przeciwko nim."
"Łk9,6": "Wyszedłszy więc, obchodzili wszystkie miasteczka, głosząc ewangelię i uzdrawiając wszędzie."
"Łk9,7": "A o wszystkim, co się przez niego dokonywało, usłyszał tetrarcha Herod i zaniepokoił się, ponieważ niektórzy mówili, że Jan zmartwychwstał;"
"Łk9,8": "Inni zaś, że Eliasz się pojawił, a jeszcze inni, że zmartwychwstał któryś z dawnych proroków."
"Łk9,9": "A Herod powiedział: Jana ściąłem. Kim więc jest ten, o którym słyszę takie rzeczy? I chciał go zobaczyć."
"Łk9,10": "Kiedy apostołowie wrócili, opowiedzieli mu wszystko, co uczynili. A on, wziąwszy ich ze sobą, odszedł osobno na odludne miejsce koło miasta zwanego Betsaidą."
"Łk9,11": "Gdy ludzie się o tym dowiedzieli, poszli za nim. On ich przyjął i mówił im o królestwie Bożym, i uzdrawiał tych, którzy potrzebowali uzdrowienia."
"Łk9,12": "A gdy dzień zaczął się chylić ku wieczorowi, podeszło do niego dwunastu, mówiąc: Odpraw tłum, aby poszli do okolicznych miasteczek i wsi i znaleźli żywność oraz schronienie, bo jesteśmy tu na pustkowiu."
"Łk9,13": "Ale on powiedział do nich: Wy dajcie im jeść. A oni odpowiedzieli: Nie mamy nic więcej oprócz pięciu chlebów i dwóch ryb; chyba że pójdziemy i kupimy jedzenie dla tych wszystkich ludzi."
"Łk9,14": "Mężczyzn bowiem było około pięciu tysięcy. I powiedział do swoich uczniów: Rozkażcie im usiąść w grupach po pięćdziesięciu."
"Łk9,15": "Uczynili tak i usadowili wszystkich."
"Łk9,16": "A on, wziąwszy te pięć chlebów i dwie ryby, spojrzał w niebo, pobłogosławił je, łamał i dawał uczniom, aby kładli przed ludźmi."
"Łk9,17": "I jedli wszyscy do syta. A z kawałków, które im pozostały, zebrano dwanaście koszy."
"Łk9,18": "I stało się tak, że kiedy modlił się na osobności, a byli z nim uczniowie, zapytał ich: Za kogo mnie ludzie uważają?"
"Łk9,19": "A oni odpowiedzieli: Za Jana Chrzciciela, inni za Eliasza, a jeszcze inni mówią, że zmartwychwstał któryś z dawnych proroków."
"Łk9,20": "I powiedział do nich: A wy za kogo mnie uważacie? A Piotr odpowiedział: Za Chrystusa Bożego."
"Łk9,21": "Ale on surowo ich napomniał i nakazał, aby nikomu tego nie mówili."
"Łk9,22": "I powiedział: Syn Człowieczy musi wiele cierpieć i zostać odrzucony przez starszych, naczelnych kapłanów i uczonych w Piśmie, i być zabity, a trzeciego dnia zmartwychwstać."
"Łk9,23": "Mówił też do wszystkich: Jeśli ktoś chce pójść za mną, niech się wyprze samego siebie, niech bierze swój krzyż każdego dnia i idzie za mną."
"Łk9,24": "Kto bowiem chce zachować swoje życie, straci je, a kto straci swe życie z mojego powodu, ten je zachowa."
"Łk9,25": "Bo cóż pomoże człowiekowi, choćby cały świat pozyskał, jeśli samego siebie zatraci lub szkodę poniesie?"
"Łk9,26": "Kto bowiem wstydzi się mnie i moich słów, tego Syn Człowieczy będzie się wstydził, gdy przyjdzie w chwale swojej, Ojca i świętych aniołów."
"Łk9,27": "Ale zapewniam was: Niektórzy z tych, co tu stoją, nie zakosztują śmierci, dopóki nie ujrzą królestwa Bożego."
"Łk9,28": "W jakieś osiem dni po tych mowach wziął ze sobą Piotra, Jana i Jakuba i wszedł na górę, aby się modlić."
"Łk9,29": "A gdy się modlił, zmienił się wygląd jego oblicza, a jego szaty stały się białe i lśniące."
"Łk9,30": "A oto rozmawiało z nim dwóch mężów. Byli to Mojżesz i Eliasz."
"Łk9,31": "Ukazali się oni w chwale i mówili o jego odejściu, którego miał dokonać w Jerozolimie."
"Łk9,32": "A Piotra i tych, którzy z nim byli, zmógł sen. Gdy się obudzili, ujrzeli jego chwałę i tych dwóch mężów, którzy z nim stali."
"Łk9,33": "Kiedy oni od niego odeszli, Piotr powiedział do Jezusa: Mistrzu, dobrze nam tu być. Postawmy więc trzy namioty: jeden dla ciebie, jeden dla Mojżesza i jeden dla Eliasza. Nie wiedział bowiem, co mówi."
"Łk9,34": "A gdy on to mówił, pojawił się obłok i zacienił ich. I zlękli się, kiedy oni wchodzili w obłok."
"Łk9,35": "I rozległ się głos z obłoku: To jest mój umiłowany Syn, jego słuchajcie."
"Łk9,36": "Gdy zaś ten głos się rozległ, okazało się, że Jezus jest sam. A oni milczeli i w tych dniach nikomu nie mówili nic o tym, co widzieli."
"Łk9,37": "Nazajutrz, gdy zeszli z góry, mnóstwo ludzi wyszło mu naprzeciw."
"Łk9,38": "Nagle jakiś człowiek z tłumu zawołał: Nauczycielu, proszę cię, spójrz na mego syna, bo to mój jedynak."
"Łk9,39": "I oto duch dopada go, a on nagle krzyczy. Szarpie nim tak, że się pieni i potłukłszy go, niechętnie od niego odchodzi."
"Łk9,40": "I prosiłem twoich uczniów, aby go wypędzili, ale nie mogli."
"Łk9,41": "Wtedy Jezus odpowiedział: O pokolenie bez wiary i przewrotne! Jak długo będę z wami i jak długo mam was znosić? Przyprowadź tu swego syna."
"Łk9,42": "A gdy on jeszcze podchodził, powalił go demon i zaczął nim targać. Lecz Jezus zgromił ducha nieczystego, uzdrowił chłopca i oddał go jego ojcu."
"Łk9,43": "I zdumieli się wszyscy potęgą Boga. A gdy się dziwili wszystkiemu, co czynił Jezus, on powiedział do swoich uczniów:"
"Łk9,44": "Przyjmijcie te słowa do waszych uszu, Syn Człowieczy bowiem będzie wydany w ręce ludzi."
"Łk9,45": "Lecz oni nie zrozumieli tych słów i były one zakryte przed nimi, tak że ich nie pojęli, a bali się go o nie zapytać."
"Łk9,46": "Wszczęła się też między nimi dyskusja o tym, kto z nich jest największy."
"Łk9,47": "A Jezus, znając tę myśl ich serca, wziął dziecko, postawił je przy sobie;"
"Łk9,48": "I powiedział do nich: Kto przyjmie to dziecko w moje imię, mnie przyjmuje, a kto mnie przyjmie, przyjmuje tego, który mnie posłał. Kto bowiem jest najmniejszy wśród was wszystkich, ten będzie wielki."
"Łk9,49": "Wtedy odezwał się Jan: Mistrzu, widzieliśmy kogoś, kto w twoim imieniu wypędzał demony i zabranialiśmy mu, bo nie chodzi z nami za tobą."
"Łk9,50": "I powiedział do niego Jezus: Nie zabraniajcie mu, bo kto nie jest przeciwko nam, ten jest z nami."
"Łk9,51": "A gdy wypełniły się dni, aby został wzięty w górę, mocno postanowił udać się do Jerozolimy."
"Łk9,52": "I wysłał przed sobą posłańców. Poszli więc i weszli do wioski Samarytan, aby przygotować dla niego miejsce."
"Łk9,53": "Lecz nie przyjęto go, ponieważ zmierzał do Jerozolimy."
"Łk9,54": "A jego uczniowie Jakub i Jan, widząc to, powiedzieli: Panie, czy chcesz, żebyśmy rozkazali, aby ogień zstąpił z nieba i pochłonął ich, jak to uczynił Eliasz?"
"Łk9,55": "Lecz Jezus, odwróciwszy się, zgromił ich i powiedział: Nie wiecie, jakiego jesteście ducha."
"Łk9,56": "Syn Człowieczy bowiem nie przyszedł zatracać dusz ludzkich, ale je zbawić. I poszli do innej wioski."
"Łk9,57": "Kiedy byli w drodze, ktoś powiedział do niego: Panie, pójdę za tobą, dokądkolwiek się udasz."
"Łk9,58": "Jezus mu odpowiedział: Lisy mają nory, a ptaki niebieskie – gniazda, ale Syn Człowieczy nie ma gdzie położyć głowy."
"Łk9,59": "Do innego zaś powiedział: Pójdź za mną! Ale on rzekł: Panie, pozwól mi najpierw odejść i pogrzebać mego ojca."
"Łk9,60": "Lecz Jezus mu odpowiedział: Niech umarli grzebią swoich umarłych, a ty idź i głoś królestwo Boże."
"Łk9,61": "Jeszcze inny powiedział: Pójdę za tobą, Panie, ale pozwól mi najpierw pożegnać się z tymi, którzy są w moim domu."
"Łk9,62": "Jezus mu odpowiedział: Nikt, kto przykłada swoją rękę do pługa i ogląda się wstecz, nie nadaje się do królestwa Bożego."
