"Łk9,1":
  text: "A Jezus, przywoławszy swoich dwunastu uczniów, dał im moc i władzę nad wszystkimi demonami i moc, aby uzdrawiali choroby."
  tags: []
"Łk9,2":
  text: "I rozesłał ich, żeby głosili królestwo Boże i uzdrawiali chorych."
  tags: []
"Łk9,3":
  text: "Powiedział też do nich: Nie bierzcie nic na drogę: ani laski, ani torby, ani chleba, ani pieniędzy i nie miejcie dwóch szat."
  tags: []
"Łk9,4":
  text: "A gdy wejdziecie do jakiegoś domu, tam pozostańcie i stamtąd wychodźcie."
  tags: []
"Łk9,5":
  text: "A jeśli was nie przyjmą, wychodząc z tego miasta, strząśnijcie pył z waszych nóg na świadectwo przeciwko nim."
  tags: []
"Łk9,6":
  text: "Wyszedłszy więc, obchodzili wszystkie miasteczka, głosząc ewangelię i uzdrawiając wszędzie."
  tags: []
"Łk9,7":
  text: "A o wszystkim, co się przez niego dokonywało, usłyszał tetrarcha Herod i zaniepokoił się, ponieważ niektórzy mówili, że Jan zmartwychwstał;"
  tags: []
"Łk9,8":
  text: "Inni zaś, że Eliasz się pojawił, a jeszcze inni, że zmartwychwstał któryś z dawnych proroków."
  tags: []
"Łk9,9":
  text: "A Herod powiedział: Jana ściąłem. Kim więc jest ten, o którym słyszę takie rzeczy? I chciał go zobaczyć."
  tags: []
"Łk9,10":
  text: "Kiedy apostołowie wrócili, opowiedzieli mu wszystko, co uczynili. A on, wziąwszy ich ze sobą, odszedł osobno na odludne miejsce koło miasta zwanego Betsaidą."
  tags: []
"Łk9,11":
  text: "Gdy ludzie się o tym dowiedzieli, poszli za nim. On ich przyjął i mówił im o królestwie Bożym, i uzdrawiał tych, którzy potrzebowali uzdrowienia."
  tags: []
"Łk9,12":
  text: "A gdy dzień zaczął się chylić ku wieczorowi, podeszło do niego dwunastu, mówiąc: Odpraw tłum, aby poszli do okolicznych miasteczek i wsi i znaleźli żywność oraz schronienie, bo jesteśmy tu na pustkowiu."
  tags: []
"Łk9,13":
  text: "Ale on powiedział do nich: Wy dajcie im jeść. A oni odpowiedzieli: Nie mamy nic więcej oprócz pięciu chlebów i dwóch ryb; chyba że pójdziemy i kupimy jedzenie dla tych wszystkich ludzi."
  tags: []
"Łk9,14":
  text: "Mężczyzn bowiem było około pięciu tysięcy. I powiedział do swoich uczniów: Rozkażcie im usiąść w grupach po pięćdziesięciu."
  tags: []
"Łk9,15":
  text: "Uczynili tak i usadowili wszystkich."
  tags: []
"Łk9,16":
  text: "A on, wziąwszy te pięć chlebów i dwie ryby, spojrzał w niebo, pobłogosławił je, łamał i dawał uczniom, aby kładli przed ludźmi."
  tags: []
"Łk9,17":
  text: "I jedli wszyscy do syta. A z kawałków, które im pozostały, zebrano dwanaście koszy."
  tags: []
"Łk9,18":
  text: "I stało się tak, że kiedy modlił się na osobności, a byli z nim uczniowie, zapytał ich: Za kogo mnie ludzie uważają?"
  tags: []
"Łk9,19":
  text: "A oni odpowiedzieli: Za Jana Chrzciciela, inni za Eliasza, a jeszcze inni mówią, że zmartwychwstał któryś z dawnych proroków."
  tags: []
"Łk9,20":
  text: "I powiedział do nich: A wy za kogo mnie uważacie? A Piotr odpowiedział: Za Chrystusa Bożego."
  tags: []
"Łk9,21":
  text: "Ale on surowo ich napomniał i nakazał, aby nikomu tego nie mówili."
  tags: []
"Łk9,22":
  text: "I powiedział: Syn Człowieczy musi wiele cierpieć i zostać odrzucony przez starszych, naczelnych kapłanów i uczonych w Piśmie, i być zabity, a trzeciego dnia zmartwychwstać."
  tags: []
"Łk9,23":
  text: "Mówił też do wszystkich: Jeśli ktoś chce pójść za mną, niech się wyprze samego siebie, niech bierze swój krzyż każdego dnia i idzie za mną."
  tags: []
"Łk9,24":
  text: "Kto bowiem chce zachować swoje życie, straci je, a kto straci swe życie z mojego powodu, ten je zachowa."
  tags: []
"Łk9,25":
  text: "Bo cóż pomoże człowiekowi, choćby cały świat pozyskał, jeśli samego siebie zatraci lub szkodę poniesie?"
  tags: []
"Łk9,26":
  text: "Kto bowiem wstydzi się mnie i moich słów, tego Syn Człowieczy będzie się wstydził, gdy przyjdzie w chwale swojej, Ojca i świętych aniołów."
  tags: []
"Łk9,27":
  text: "Ale zapewniam was: Niektórzy z tych, co tu stoją, nie zakosztują śmierci, dopóki nie ujrzą królestwa Bożego."
  tags: []
"Łk9,28":
  text: "W jakieś osiem dni po tych mowach wziął ze sobą Piotra, Jana i Jakuba i wszedł na górę, aby się modlić."
  tags: []
"Łk9,29":
  text: "A gdy się modlił, zmienił się wygląd jego oblicza, a jego szaty stały się białe i lśniące."
  tags: []
"Łk9,30":
  text: "A oto rozmawiało z nim dwóch mężów. Byli to Mojżesz i Eliasz."
  tags: []
"Łk9,31":
  text: "Ukazali się oni w chwale i mówili o jego odejściu, którego miał dokonać w Jerozolimie."
  tags: []
"Łk9,32":
  text: "A Piotra i tych, którzy z nim byli, zmógł sen. Gdy się obudzili, ujrzeli jego chwałę i tych dwóch mężów, którzy z nim stali."
  tags: []
"Łk9,33":
  text: "Kiedy oni od niego odeszli, Piotr powiedział do Jezusa: Mistrzu, dobrze nam tu być. Postawmy więc trzy namioty: jeden dla ciebie, jeden dla Mojżesza i jeden dla Eliasza. Nie wiedział bowiem, co mówi."
  tags: []
"Łk9,34":
  text: "A gdy on to mówił, pojawił się obłok i zacienił ich. I zlękli się, kiedy oni wchodzili w obłok."
  tags: []
"Łk9,35":
  text: "I rozległ się głos z obłoku: To jest mój umiłowany Syn, jego słuchajcie."
  tags: []
"Łk9,36":
  text: "Gdy zaś ten głos się rozległ, okazało się, że Jezus jest sam. A oni milczeli i w tych dniach nikomu nie mówili nic o tym, co widzieli."
  tags: []
"Łk9,37":
  text: "Nazajutrz, gdy zeszli z góry, mnóstwo ludzi wyszło mu naprzeciw."
  tags: []
"Łk9,38":
  text: "Nagle jakiś człowiek z tłumu zawołał: Nauczycielu, proszę cię, spójrz na mego syna, bo to mój jedynak."
  tags: []
"Łk9,39":
  text: "I oto duch dopada go, a on nagle krzyczy. Szarpie nim tak, że się pieni i potłukłszy go, niechętnie od niego odchodzi."
  tags: []
"Łk9,40":
  text: "I prosiłem twoich uczniów, aby go wypędzili, ale nie mogli."
  tags: []
"Łk9,41":
  text: "Wtedy Jezus odpowiedział: O pokolenie bez wiary i przewrotne! Jak długo będę z wami i jak długo mam was znosić? Przyprowadź tu swego syna."
  tags: []
"Łk9,42":
  text: "A gdy on jeszcze podchodził, powalił go demon i zaczął nim targać. Lecz Jezus zgromił ducha nieczystego, uzdrowił chłopca i oddał go jego ojcu."
  tags: []
"Łk9,43":
  text: "I zdumieli się wszyscy potęgą Boga. A gdy się dziwili wszystkiemu, co czynił Jezus, on powiedział do swoich uczniów:"
  tags: []
"Łk9,44":
  text: "Przyjmijcie te słowa do waszych uszu, Syn Człowieczy bowiem będzie wydany w ręce ludzi."
  tags: []
"Łk9,45":
  text: "Lecz oni nie zrozumieli tych słów i były one zakryte przed nimi, tak że ich nie pojęli, a bali się go o nie zapytać."
  tags: []
"Łk9,46":
  text: "Wszczęła się też między nimi dyskusja o tym, kto z nich jest największy."
  tags: []
"Łk9,47":
  text: "A Jezus, znając tę myśl ich serca, wziął dziecko, postawił je przy sobie;"
  tags: []
"Łk9,48":
  text: "I powiedział do nich: Kto przyjmie to dziecko w moje imię, mnie przyjmuje, a kto mnie przyjmie, przyjmuje tego, który mnie posłał. Kto bowiem jest najmniejszy wśród was wszystkich, ten będzie wielki."
  tags: []
"Łk9,49":
  text: "Wtedy odezwał się Jan: Mistrzu, widzieliśmy kogoś, kto w twoim imieniu wypędzał demony i zabranialiśmy mu, bo nie chodzi z nami za tobą."
  tags: []
"Łk9,50":
  text: "I powiedział do niego Jezus: Nie zabraniajcie mu, bo kto nie jest przeciwko nam, ten jest z nami."
  tags: []
"Łk9,51":
  text: "A gdy wypełniły się dni, aby został wzięty w górę, mocno postanowił udać się do Jerozolimy."
  tags: []
"Łk9,52":
  text: "I wysłał przed sobą posłańców. Poszli więc i weszli do wioski Samarytan, aby przygotować dla niego miejsce."
  tags: []
"Łk9,53":
  text: "Lecz nie przyjęto go, ponieważ zmierzał do Jerozolimy."
  tags: []
"Łk9,54":
  text: "A jego uczniowie Jakub i Jan, widząc to, powiedzieli: Panie, czy chcesz, żebyśmy rozkazali, aby ogień zstąpił z nieba i pochłonął ich, jak to uczynił Eliasz?"
  tags: []
"Łk9,55":
  text: "Lecz Jezus, odwróciwszy się, zgromił ich i powiedział: Nie wiecie, jakiego jesteście ducha."
  tags: []
"Łk9,56":
  text: "Syn Człowieczy bowiem nie przyszedł zatracać dusz ludzkich, ale je zbawić. I poszli do innej wioski."
  tags: []
"Łk9,57":
  text: "Kiedy byli w drodze, ktoś powiedział do niego: Panie, pójdę za tobą, dokądkolwiek się udasz."
  tags: []
"Łk9,58":
  text: "Jezus mu odpowiedział: Lisy mają nory, a ptaki niebieskie – gniazda, ale Syn Człowieczy nie ma gdzie położyć głowy."
  tags: []
"Łk9,59":
  text: "Do innego zaś powiedział: Pójdź za mną! Ale on rzekł: Panie, pozwól mi najpierw odejść i pogrzebać mego ojca."
  tags: []
"Łk9,60":
  text: "Lecz Jezus mu odpowiedział: Niech umarli grzebią swoich umarłych, a ty idź i głoś królestwo Boże."
  tags: []
"Łk9,61":
  text: "Jeszcze inny powiedział: Pójdę za tobą, Panie, ale pozwól mi najpierw pożegnać się z tymi, którzy są w moim domu."
  tags: []
"Łk9,62":
  text: "Jezus mu odpowiedział: Nikt, kto przykłada swoją rękę do pługa i ogląda się wstecz, nie nadaje się do królestwa Bożego."
  tags: []
