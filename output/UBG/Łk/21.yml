"Łk21,1":
  text: "A gdy spojrzał, zobaczył bogaczy wrzucających swoje ofiary do skarbony."
  tags: []
"Łk21,2":
  text: "Zobaczył też pewną ubogą wdowę wrzucającą tam dwie drobne monety."
  tags: []
"Łk21,3":
  text: "I powiedział: Prawdziwie mówię wam, że ta uboga wdowa wrzuciła więcej niż wszyscy."
  tags: []
"Łk21,4":
  text: "Oni wszyscy bowiem wrzucili do darów Bożych z tego, co im zbywało, ale ona ze swego niedostatku wrzuciła wszystko, co miała na utrzymanie."
  tags: []
"Łk21,5":
  text: "A gdy niektórzy mówili o świątyni, że jest ozdobiona pięknymi kamieniami i darami, powiedział:"
  tags: []
"Łk21,6":
  text: "Przyjdą dni, w których z tego, co widzicie, nie zostanie kamień na kamieniu, który by nie był zwalony."
  tags: []
"Łk21,7":
  text: "I zapytali go: Nauczycielu, kiedy to nastąpi? I jaki będzie znak, gdy się to będzie miało stać?"
  tags: []
"Łk21,8":
  text: "A on odpowiedział: Uważajcie, abyście nie zostali zwiedzeni. Wielu bowiem przyjdzie pod moim imieniem i będą mówić: Ja jestem Chrystusem, oraz: Nadchodzi czas. Nie idźcie więc za nimi."
  tags: []
"Łk21,9":
  text: "Gdy zaś usłyszycie o wojnach i rozruchach, nie bójcie się. To bowiem najpierw musi się stać, ale koniec nie nastąpi natychmiast."
  tags: []
"Łk21,10":
  text: "Wtedy mówił do nich: Powstanie naród przeciwko narodowi i królestwo przeciwko królestwu."
  tags: []
"Łk21,11":
  text: "I będą miejscami wielkie trzęsienia ziemi oraz głód i zaraza, będą także straszne zjawiska i wielkie znaki z nieba."
  tags: []
"Łk21,12":
  text: "Lecz przed tym wszystkim podniosą na was ręce i będą was prześladować, wydawać do synagog i więzień, prowadzić do królów i namiestników z powodu mego imienia."
  tags: []
"Łk21,13":
  text: "A to was spotka na świadectwo."
  tags: []
"Łk21,14":
  text: "Dlatego postanówcie sobie w sercu, aby nie obmyślać wcześniej, jak macie odpowiadać."
  tags: []
"Łk21,15":
  text: "Ja bowiem dam wam usta i mądrość, której nie będą mogli odeprzeć ani się sprzeciwić wszyscy wasi przeciwnicy."
  tags: []
"Łk21,16":
  text: "A wydawać was też będą rodzice i bracia, krewni i przyjaciele i zabiją niektórych z was."
  tags: []
"Łk21,17":
  text: "Będziecie znienawidzeni przez wszystkich z powodu mego imienia."
  tags: []
"Łk21,18":
  text: "Ale nawet włos z waszej głowy nie zginie."
  tags: []
"Łk21,19":
  text: "Przez swoją cierpliwość zyskajcie wasze dusze."
  tags: []
"Łk21,20":
  text: "A gdy zobaczycie Jerozolimę otoczoną przez wojska, wtedy wiedzcie, że jej spustoszenie jest bliskie."
  tags: []
"Łk21,21":
  text: "Wówczas ci, którzy są w Judei, niech uciekają w góry, a ci, którzy są wewnątrz miasta, niech wyjdą, a ci, którzy są na wsi, niech do niego nie wchodzą."
  tags: []
"Łk21,22":
  text: "Będą to bowiem dni pomsty, aby się wypełniło wszystko, co jest napisane."
  tags: []
"Łk21,23":
  text: "Lecz biada brzemiennym i karmiącym w tych dniach! Będzie bowiem wielki ucisk w tej ziemi i gniew nad tym ludem."
  tags: []
"Łk21,24":
  text: "I polegną od ostrza miecza, i będą uprowadzeni w niewolę między wszystkie narody. A Jerozolima będzie deptana przez pogan, aż wypełnią się czasy pogan."
  tags: []
"Łk21,25":
  text: "I będą znaki na słońcu, księżycu i gwiazdach, a na ziemi trwoga zrozpaczonych narodów, gdy zaszumi morze i fale."
  tags: []
"Łk21,26":
  text: "Ludzie będą drętwieć ze strachu w oczekiwaniu tego, co przyjdzie na cały świat. Poruszą się bowiem moce niebios."
  tags: []
"Łk21,27":
  text: "Wtedy ujrzą Syna Człowieczego, przychodzącego w obłoku z mocą i wielką chwałą."
  tags: []
"Łk21,28":
  text: "A gdy się to zacznie dziać, spójrzcie w górę i podnieście głowy, gdyż zbliża się wasze odkupienie."
  tags: []
"Łk21,29":
  text: "I opowiedział im przypowieść: Popatrzcie na drzewo figowe i na wszystkie drzewa."
  tags: []
"Łk21,30":
  text: "Gdy widzicie, że już wypuszczają pąki, sami poznajecie, że lato jest już blisko."
  tags: []
"Łk21,31":
  text: "Tak i wy, gdy ujrzycie, że to się dzieje, wiedzcie, iż blisko jest królestwo Boże."
  tags: []
"Łk21,32":
  text: "Zaprawdę powiadam wam, że nie przeminie to pokolenie, aż się to wszystko stanie."
  tags: []
"Łk21,33":
  text: "Niebo i ziemia przeminą, ale moje słowa nie przeminą."
  tags: []
"Łk21,34":
  text: "Pilnujcie się, aby wasze serca nie były obciążone obżarstwem, pijaństwem i troską o to życie, aby ten dzień was nie zaskoczył."
  tags: []
"Łk21,35":
  text: "Jak sidło bowiem przyjdzie na wszystkich, którzy mieszkają na powierzchni całej ziemi."
  tags: []
"Łk21,36":
  text: "Dlatego czuwajcie, modląc się w każdym czasie, abyście byli godni uniknąć tego wszystkiego, co ma nadejść, i stanąć przed Synem Człowieczym."
  tags: []
"Łk21,37":
  text: "W ciągu dnia nauczał w świątyni, a w nocy wychodził i przebywał na górze zwanej Oliwną."
  tags: []
"Łk21,38":
  text: "Rano zaś wszyscy ludzie schodzili się do niego, aby go słuchać w świątyni."
  tags: []
