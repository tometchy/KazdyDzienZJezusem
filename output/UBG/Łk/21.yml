"Łk21,1": "A gdy spojrzał, zobaczył bogaczy wrzucających swoje ofiary do skarbony."
"Łk21,2": "Zobaczył też pewną ubogą wdowę wrzucającą tam dwie drobne monety."
"Łk21,3": "I powiedział: Prawdziwie mówię wam, że ta uboga wdowa wrzuciła więcej niż wszyscy."
"Łk21,4": "Oni wszyscy bowiem wrzucili do darów Bożych z tego, co im zbywało, ale ona ze swego niedostatku wrzuciła wszystko, co miała na utrzymanie."
"Łk21,5": "A gdy niektórzy mówili o świątyni, że jest ozdobiona pięknymi kamieniami i darami, powiedział:"
"Łk21,6": "Przyjdą dni, w których z tego, co widzicie, nie zostanie kamień na kamieniu, który by nie był zwalony."
"Łk21,7": "I zapytali go: Nauczycielu, kiedy to nastąpi? I jaki będzie znak, gdy się to będzie miało stać?"
"Łk21,8": "A on odpowiedział: Uważajcie, abyście nie zostali zwiedzeni. Wielu bowiem przyjdzie pod moim imieniem i będą mówić: Ja jestem Chrystusem, oraz: Nadchodzi czas. Nie idźcie więc za nimi."
"Łk21,9": "Gdy zaś usłyszycie o wojnach i rozruchach, nie bójcie się. To bowiem najpierw musi się stać, ale koniec nie nastąpi natychmiast."
"Łk21,10": "Wtedy mówił do nich: Powstanie naród przeciwko narodowi i królestwo przeciwko królestwu."
"Łk21,11": "I będą miejscami wielkie trzęsienia ziemi oraz głód i zaraza, będą także straszne zjawiska i wielkie znaki z nieba."
"Łk21,12": "Lecz przed tym wszystkim podniosą na was ręce i będą was prześladować, wydawać do synagog i więzień, prowadzić do królów i namiestników z powodu mego imienia."
"Łk21,13": "A to was spotka na świadectwo."
"Łk21,14": "Dlatego postanówcie sobie w sercu, aby nie obmyślać wcześniej, jak macie odpowiadać."
"Łk21,15": "Ja bowiem dam wam usta i mądrość, której nie będą mogli odeprzeć ani się sprzeciwić wszyscy wasi przeciwnicy."
"Łk21,16": "A wydawać was też będą rodzice i bracia, krewni i przyjaciele i zabiją niektórych z was."
"Łk21,17": "Będziecie znienawidzeni przez wszystkich z powodu mego imienia."
"Łk21,18": "Ale nawet włos z waszej głowy nie zginie."
"Łk21,19": "Przez swoją cierpliwość zyskajcie wasze dusze."
"Łk21,20": "A gdy zobaczycie Jerozolimę otoczoną przez wojska, wtedy wiedzcie, że jej spustoszenie jest bliskie."
"Łk21,21": "Wówczas ci, którzy są w Judei, niech uciekają w góry, a ci, którzy są wewnątrz miasta, niech wyjdą, a ci, którzy są na wsi, niech do niego nie wchodzą."
"Łk21,22": "Będą to bowiem dni pomsty, aby się wypełniło wszystko, co jest napisane."
"Łk21,23": "Lecz biada brzemiennym i karmiącym w tych dniach! Będzie bowiem wielki ucisk w tej ziemi i gniew nad tym ludem."
"Łk21,24": "I polegną od ostrza miecza, i będą uprowadzeni w niewolę między wszystkie narody. A Jerozolima będzie deptana przez pogan, aż wypełnią się czasy pogan."
"Łk21,25": "I będą znaki na słońcu, księżycu i gwiazdach, a na ziemi trwoga zrozpaczonych narodów, gdy zaszumi morze i fale."
"Łk21,26": "Ludzie będą drętwieć ze strachu w oczekiwaniu tego, co przyjdzie na cały świat. Poruszą się bowiem moce niebios."
"Łk21,27": "Wtedy ujrzą Syna Człowieczego, przychodzącego w obłoku z mocą i wielką chwałą."
"Łk21,28": "A gdy się to zacznie dziać, spójrzcie w górę i podnieście głowy, gdyż zbliża się wasze odkupienie."
"Łk21,29": "I opowiedział im przypowieść: Popatrzcie na drzewo figowe i na wszystkie drzewa."
"Łk21,30": "Gdy widzicie, że już wypuszczają pąki, sami poznajecie, że lato jest już blisko."
"Łk21,31": "Tak i wy, gdy ujrzycie, że to się dzieje, wiedzcie, iż blisko jest królestwo Boże."
"Łk21,32": "Zaprawdę powiadam wam, że nie przeminie to pokolenie, aż się to wszystko stanie."
"Łk21,33": "Niebo i ziemia przeminą, ale moje słowa nie przeminą."
"Łk21,34": "Pilnujcie się, aby wasze serca nie były obciążone obżarstwem, pijaństwem i troską o to życie, aby ten dzień was nie zaskoczył."
"Łk21,35": "Jak sidło bowiem przyjdzie na wszystkich, którzy mieszkają na powierzchni całej ziemi."
"Łk21,36": "Dlatego czuwajcie, modląc się w każdym czasie, abyście byli godni uniknąć tego wszystkiego, co ma nadejść, i stanąć przed Synem Człowieczym."
"Łk21,37": "W ciągu dnia nauczał w świątyni, a w nocy wychodził i przebywał na górze zwanej Oliwną."
"Łk21,38": "Rano zaś wszyscy ludzie schodzili się do niego, aby go słuchać w świątyni."
