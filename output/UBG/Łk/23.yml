"Łk23,1": "Wtedy całe to zgromadzenie powstało i zaprowadzili go do Piłata."
"Łk23,2": "I zaczęli go oskarżać, mówiąc: Zastaliśmy tego człowieka, jak odwracał naród i zakazywał płacić podatki cesarzowi, mówiąc, że on jest Chrystusem, królem."
"Łk23,3": "Piłat zapytał go: Czy ty jesteś królem Żydów? A on mu odpowiedział: Ty sam to mówisz."
"Łk23,4": "Wtedy Piłat powiedział do naczelnych kapłanów i do ludu: Nie znajduję żadnej winy w tym człowieku."
"Łk23,5": "Lecz oni jeszcze bardziej nastawali, mówiąc: Podburza lud, nauczając po całej Judei, począwszy od Galilei aż dotąd."
"Łk23,6": "Kiedy Piłat usłyszał o Galilei, zapytał, czy człowiek ten jest Galilejczykiem."
"Łk23,7": "A gdy się dowiedział, że podlega władzy Heroda, odesłał go do Heroda, który w tych dniach również był w Jerozolimie."
"Łk23,8": "Na widok Jezusa Herod bardzo się ucieszył. Od dawna bowiem pragnął go zobaczyć, ponieważ wiele o nim słyszał i spodziewał się, że ujrzy jakiś cud przez niego dokonany."
"Łk23,9": "I zadawał mu wiele pytań, lecz on mu nic nie odpowiedział."
"Łk23,10": "A naczelni kapłani i uczeni w Piśmie stali tam i gwałtownie go oskarżali."
"Łk23,11": "Wtedy Herod ze swymi żołnierzami wzgardził nim i naśmiewał się z niego, ubierając go w białą szatę, i odesłał z powrotem do Piłata."
"Łk23,12": "W tym dniu Piłat i Herod stali się przyjaciółmi. Przedtem bowiem byli sobie wrogami."
"Łk23,13": "A Piłat, zwoławszy naczelnych kapłanów, przełożonych oraz lud;"
"Łk23,14": "Powiedział do nich: Przyprowadziliście mi tego człowieka jako podburzającego lud. Otóż ja przesłuchałem go wobec was i nie znalazłem w tym człowieku żadnej winy w sprawach, o które go oskarżacie;"
"Łk23,15": "Ani też Herod. Odesłałem was bowiem do niego i nie znalazł w nim nic, co zasługiwałoby na śmierć."
"Łk23,16": "Ubiczuję go więc i wypuszczę."
"Łk23,17": "Piłat bowiem miał obowiązek wypuszczać im jednego więźnia na święto."
"Łk23,18": "Wtedy wszyscy razem zawołali: Strać tego człowieka, a wypuść nam Barabasza!"
"Łk23,19": "Był on wtrącony do więzienia za jakiś rozruch wywołany w mieście i za zabójstwo."
"Łk23,20": "Wtedy Piłat znowu przemówił, chcąc wypuścić Jezusa."
"Łk23,21": "Oni jednak wołali: Ukrzyżuj, ukrzyżuj go!"
"Łk23,22": "A on po raz trzeci powiedział do nich: Cóż on złego uczynił? Nie znalazłem w nim nic, co zasługuje na śmierć. Ubiczuję go więc i wypuszczę."
"Łk23,23": "Lecz oni nalegali donośnym głosem, domagając się, aby go ukrzyżowano. I wzmagały się głosy ich i naczelnych kapłanów."
"Łk23,24": "Piłat więc zawyrokował, aby stało się według ich żądania."
"Łk23,25": "I uwolnił im tego, o którego prosili, a który został wtrącony do więzienia za rozruch i zabójstwo. Jezusa zaś zdał na ich wolę."
"Łk23,26": "A gdy go prowadzili, zatrzymali niejakiego Szymona z Cyreny, który szedł z pola, i włożyli na niego krzyż, aby go niósł za Jezusem."
"Łk23,27": "I szło za nim wielkie mnóstwo ludzi i kobiet, które płakały nad nim i zawodziły."
"Łk23,28": "Ale Jezus zwrócił się do nich i powiedział: Córki Jerozolimy, nie płaczcie nade mną, ale raczej płaczcie nad sobą i nad waszymi dziećmi."
"Łk23,29": "Oto bowiem idą dni, kiedy będą mówić: Błogosławione niepłodne, łona, które nie rodziły, i piersi, które nie karmiły."
"Łk23,30": "Wtedy zaczną mówić do gór: Padnijcie na nas! A do pagórków: Przykryjcie nas!"
"Łk23,31": "Bo jeśli na zielonym drzewie tak się dzieje, cóż będzie na suchym?"
"Łk23,32": "Prowadzono też dwóch innych, złoczyńców, aby razem z nim zostali straceni."
"Łk23,33": "A gdy przyszli na miejsce zwane Miejscem Czaszki, ukrzyżowali tam jego i złoczyńców, jednego po prawej, a drugiego po lewej stronie."
"Łk23,34": "Wtedy Jezus powiedział: Ojcze, przebacz im, bo nie wiedzą, co czynią. Potem podzielili jego szaty i rzucali o nie losy."
"Łk23,35": "A lud stał i przypatrywał się, i wraz z przełożonymi naśmiewał się z niego, mówiąc: Innych ratował, niech ratuje samego siebie, jeśli on jest Chrystusem, wybranym Boga."
"Łk23,36": "Naśmiewali się z niego również żołnierze, podchodząc i podając mu ocet;"
"Łk23,37": "I mówili: Jeśli ty jesteś królem Żydów, ratuj samego siebie."
"Łk23,38": "Był też nad nim napis sporządzony w języku greckim, łacińskim i hebrajskim: To jest król Żydów."
"Łk23,39": "A jeden z tych złoczyńców, którzy z nim wisieli, urągał mu: Jeśli ty jesteś Chrystusem, ratuj siebie i nas."
"Łk23,40": "Lecz drugi odezwał się, gromiąc go słowami: I ty się Boga nie boisz, chociaż ponosisz tę samą karę?"
"Łk23,41": "My doprawdy – sprawiedliwie, bo odbieramy należną zapłatę za nasze uczynki, ale on nic złego nie zrobił."
"Łk23,42": "I powiedział do Jezusa: Panie, wspomnij na mnie, gdy przyjdziesz do swego królestwa."
"Łk23,43": "A Jezus mu odpowiedział: Zaprawdę powiadam ci: Dziś będziesz ze mną w raju."
"Łk23,44": "A było około godziny szóstej i ciemność ogarnęła całą ziemię aż do godziny dziewiątej."
"Łk23,45": "I zaćmiło się słońce, a zasłona świątyni rozerwała się przez środek."
"Łk23,46": "Wtedy Jezus zawołał donośnym głosem: Ojcze, w twoje ręce powierzam mego ducha. Gdy to powiedział, skonał."
"Łk23,47": "A setnik, widząc, co się działo, chwalił Boga, mówiąc: Istotnie, to był sprawiedliwy człowiek."
"Łk23,48": "Także i wszyscy ludzie, którzy zeszli się na to widowisko, gdy zobaczyli, co się stało, bili się w piersi i zawracali."
"Łk23,49": "Wszyscy zaś jego znajomi stali z daleka, przypatrując się temu, również kobiety, które przyszły za nim z Galilei."
"Łk23,50": "A był tam człowiek imieniem Józef, który był członkiem Rady, człowiek dobry i sprawiedliwy."
"Łk23,51": "Nie zgadzał się on z ich uchwałą i czynem. Pochodził z Arymatei, miasta żydowskiego, i oczekiwał królestwa Bożego."
"Łk23,52": "Przyszedł on do Piłata i poprosił o ciało Jezusa."
"Łk23,53": "Zdjął je, owinął płótnem i położył w grobowcu wykutym w skale, w którym jeszcze nikt nigdy nie był złożony."
"Łk23,54": "A był to dzień przygotowania i zbliżał się szabat."
"Łk23,55": "Poszły też za nim kobiety, które przybyły z nim z Galilei. Zobaczyły grobowiec i jak złożono jego ciało."
"Łk23,56": "A gdy wróciły, przygotowały wonności i olejki. Lecz w szabat odpoczywały zgodnie z przykazaniem."
