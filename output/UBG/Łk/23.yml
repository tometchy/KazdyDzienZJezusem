"Łk23,1":
  text: "Wtedy całe to zgromadzenie powstało i zaprowadzili go do Piłata."
  tags: []
"Łk23,2":
  text: "I zaczęli go oskarżać, mówiąc: Zastaliśmy tego człowieka, jak odwracał naród i zakazywał płacić podatki cesarzowi, mówiąc, że on jest Chrystusem, królem."
  tags: []
"Łk23,3":
  text: "Piłat zapytał go: Czy ty jesteś królem Żydów? A on mu odpowiedział: Ty sam to mówisz."
  tags: []
"Łk23,4":
  text: "Wtedy Piłat powiedział do naczelnych kapłanów i do ludu: Nie znajduję żadnej winy w tym człowieku."
  tags: []
"Łk23,5":
  text: "Lecz oni jeszcze bardziej nastawali, mówiąc: Podburza lud, nauczając po całej Judei, począwszy od Galilei aż dotąd."
  tags: []
"Łk23,6":
  text: "Kiedy Piłat usłyszał o Galilei, zapytał, czy człowiek ten jest Galilejczykiem."
  tags: []
"Łk23,7":
  text: "A gdy się dowiedział, że podlega władzy Heroda, odesłał go do Heroda, który w tych dniach również był w Jerozolimie."
  tags: []
"Łk23,8":
  text: "Na widok Jezusa Herod bardzo się ucieszył. Od dawna bowiem pragnął go zobaczyć, ponieważ wiele o nim słyszał i spodziewał się, że ujrzy jakiś cud przez niego dokonany."
  tags: []
"Łk23,9":
  text: "I zadawał mu wiele pytań, lecz on mu nic nie odpowiedział."
  tags: []
"Łk23,10":
  text: "A naczelni kapłani i uczeni w Piśmie stali tam i gwałtownie go oskarżali."
  tags: []
"Łk23,11":
  text: "Wtedy Herod ze swymi żołnierzami wzgardził nim i naśmiewał się z niego, ubierając go w białą szatę, i odesłał z powrotem do Piłata."
  tags: []
"Łk23,12":
  text: "W tym dniu Piłat i Herod stali się przyjaciółmi. Przedtem bowiem byli sobie wrogami."
  tags: []
"Łk23,13":
  text: "A Piłat, zwoławszy naczelnych kapłanów, przełożonych oraz lud;"
  tags: []
"Łk23,14":
  text: "Powiedział do nich: Przyprowadziliście mi tego człowieka jako podburzającego lud. Otóż ja przesłuchałem go wobec was i nie znalazłem w tym człowieku żadnej winy w sprawach, o które go oskarżacie;"
  tags: []
"Łk23,15":
  text: "Ani też Herod. Odesłałem was bowiem do niego i nie znalazł w nim nic, co zasługiwałoby na śmierć."
  tags: []
"Łk23,16":
  text: "Ubiczuję go więc i wypuszczę."
  tags: []
"Łk23,17":
  text: "Piłat bowiem miał obowiązek wypuszczać im jednego więźnia na święto."
  tags: []
"Łk23,18":
  text: "Wtedy wszyscy razem zawołali: Strać tego człowieka, a wypuść nam Barabasza!"
  tags: []
"Łk23,19":
  text: "Był on wtrącony do więzienia za jakiś rozruch wywołany w mieście i za zabójstwo."
  tags: []
"Łk23,20":
  text: "Wtedy Piłat znowu przemówił, chcąc wypuścić Jezusa."
  tags: []
"Łk23,21":
  text: "Oni jednak wołali: Ukrzyżuj, ukrzyżuj go!"
  tags: []
"Łk23,22":
  text: "A on po raz trzeci powiedział do nich: Cóż on złego uczynił? Nie znalazłem w nim nic, co zasługuje na śmierć. Ubiczuję go więc i wypuszczę."
  tags: []
"Łk23,23":
  text: "Lecz oni nalegali donośnym głosem, domagając się, aby go ukrzyżowano. I wzmagały się głosy ich i naczelnych kapłanów."
  tags: []
"Łk23,24":
  text: "Piłat więc zawyrokował, aby stało się według ich żądania."
  tags: []
"Łk23,25":
  text: "I uwolnił im tego, o którego prosili, a który został wtrącony do więzienia za rozruch i zabójstwo. Jezusa zaś zdał na ich wolę."
  tags: []
"Łk23,26":
  text: "A gdy go prowadzili, zatrzymali niejakiego Szymona z Cyreny, który szedł z pola, i włożyli na niego krzyż, aby go niósł za Jezusem."
  tags: []
"Łk23,27":
  text: "I szło za nim wielkie mnóstwo ludzi i kobiet, które płakały nad nim i zawodziły."
  tags: []
"Łk23,28":
  text: "Ale Jezus zwrócił się do nich i powiedział: Córki Jerozolimy, nie płaczcie nade mną, ale raczej płaczcie nad sobą i nad waszymi dziećmi."
  tags: []
"Łk23,29":
  text: "Oto bowiem idą dni, kiedy będą mówić: Błogosławione niepłodne, łona, które nie rodziły, i piersi, które nie karmiły."
  tags: []
"Łk23,30":
  text: "Wtedy zaczną mówić do gór: Padnijcie na nas! A do pagórków: Przykryjcie nas!"
  tags: []
"Łk23,31":
  text: "Bo jeśli na zielonym drzewie tak się dzieje, cóż będzie na suchym?"
  tags: []
"Łk23,32":
  text: "Prowadzono też dwóch innych, złoczyńców, aby razem z nim zostali straceni."
  tags: []
"Łk23,33":
  text: "A gdy przyszli na miejsce zwane Miejscem Czaszki, ukrzyżowali tam jego i złoczyńców, jednego po prawej, a drugiego po lewej stronie."
  tags: []
"Łk23,34":
  text: "Wtedy Jezus powiedział: Ojcze, przebacz im, bo nie wiedzą, co czynią. Potem podzielili jego szaty i rzucali o nie losy."
  tags: []
"Łk23,35":
  text: "A lud stał i przypatrywał się, i wraz z przełożonymi naśmiewał się z niego, mówiąc: Innych ratował, niech ratuje samego siebie, jeśli on jest Chrystusem, wybranym Boga."
  tags: []
"Łk23,36":
  text: "Naśmiewali się z niego również żołnierze, podchodząc i podając mu ocet;"
  tags: []
"Łk23,37":
  text: "I mówili: Jeśli ty jesteś królem Żydów, ratuj samego siebie."
  tags: []
"Łk23,38":
  text: "Był też nad nim napis sporządzony w języku greckim, łacińskim i hebrajskim: To jest król Żydów."
  tags: []
"Łk23,39":
  text: "A jeden z tych złoczyńców, którzy z nim wisieli, urągał mu: Jeśli ty jesteś Chrystusem, ratuj siebie i nas."
  tags: []
"Łk23,40":
  text: "Lecz drugi odezwał się, gromiąc go słowami: I ty się Boga nie boisz, chociaż ponosisz tę samą karę?"
  tags: []
"Łk23,41":
  text: "My doprawdy – sprawiedliwie, bo odbieramy należną zapłatę za nasze uczynki, ale on nic złego nie zrobił."
  tags: []
"Łk23,42":
  text: "I powiedział do Jezusa: Panie, wspomnij na mnie, gdy przyjdziesz do swego królestwa."
  tags: []
"Łk23,43":
  text: "A Jezus mu odpowiedział: Zaprawdę powiadam ci: Dziś będziesz ze mną w raju."
  tags: []
"Łk23,44":
  text: "A było około godziny szóstej i ciemność ogarnęła całą ziemię aż do godziny dziewiątej."
  tags: []
"Łk23,45":
  text: "I zaćmiło się słońce, a zasłona świątyni rozerwała się przez środek."
  tags: []
"Łk23,46":
  text: "Wtedy Jezus zawołał donośnym głosem: Ojcze, w twoje ręce powierzam mego ducha. Gdy to powiedział, skonał."
  tags: []
"Łk23,47":
  text: "A setnik, widząc, co się działo, chwalił Boga, mówiąc: Istotnie, to był sprawiedliwy człowiek."
  tags: []
"Łk23,48":
  text: "Także i wszyscy ludzie, którzy zeszli się na to widowisko, gdy zobaczyli, co się stało, bili się w piersi i zawracali."
  tags: []
"Łk23,49":
  text: "Wszyscy zaś jego znajomi stali z daleka, przypatrując się temu, również kobiety, które przyszły za nim z Galilei."
  tags: []
"Łk23,50":
  text: "A był tam człowiek imieniem Józef, który był członkiem Rady, człowiek dobry i sprawiedliwy."
  tags: []
"Łk23,51":
  text: "Nie zgadzał się on z ich uchwałą i czynem. Pochodził z Arymatei, miasta żydowskiego, i oczekiwał królestwa Bożego."
  tags: []
"Łk23,52":
  text: "Przyszedł on do Piłata i poprosił o ciało Jezusa."
  tags: []
"Łk23,53":
  text: "Zdjął je, owinął płótnem i położył w grobowcu wykutym w skale, w którym jeszcze nikt nigdy nie był złożony."
  tags: []
"Łk23,54":
  text: "A był to dzień przygotowania i zbliżał się szabat."
  tags: []
"Łk23,55":
  text: "Poszły też za nim kobiety, które przybyły z nim z Galilei. Zobaczyły grobowiec i jak złożono jego ciało."
  tags: []
"Łk23,56":
  text: "A gdy wróciły, przygotowały wonności i olejki. Lecz w szabat odpoczywały zgodnie z przykazaniem."
  tags: []
