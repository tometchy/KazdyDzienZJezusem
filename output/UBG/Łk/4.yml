"Łk4,1":
  text: "A Jezus, pełen Ducha Świętego, wrócił znad Jordanu i został zaprowadzony przez Ducha na pustynię;"
  tags: []
"Łk4,2":
  text: "I przez czterdzieści dni był kuszony przez diabła. Nic nie jadł w tych dniach, a gdy minęły, poczuł głód."
  tags: []
"Łk4,3":
  text: "I powiedział do niego diabeł: Jeśli jesteś Synem Bożym, powiedz temu kamieniowi, aby stał się chlebem."
  tags: []
"Łk4,4":
  text: "Ale Jezus mu odpowiedział: Jest napisane: Nie samym chlebem będzie żył człowiek, ale każdym słowem Bożym."
  tags: []
"Łk4,5":
  text: "Wtedy wyprowadził go diabeł na wysoką górę i pokazał mu w jednej chwili wszystkie królestwa świata."
  tags: []
"Łk4,6":
  text: "I powiedział do niego diabeł: Dam ci całą tę potęgę i ich chwałę, bo zostały mi przekazane i daję je, komu chcę."
  tags: []
"Łk4,7":
  text: "Jeśli więc oddasz mi pokłon, wszystko będzie twoje."
  tags: []
"Łk4,8":
  text: "A Jezus mu odpowiedział: Idź precz ode mnie, szatanie! Jest bowiem napisane: Panu, swemu Bogu, będziesz oddawał pokłon i tylko jemu będziesz służył."
  tags: []
"Łk4,9":
  text: "Potem zaprowadził go do Jerozolimy, postawił na szczycie świątyni i powiedział do niego: Jeśli jesteś Synem Bożym, rzuć się stąd w dół."
  tags: []
"Łk4,10":
  text: "Jest bowiem napisane: Rozkaże o tobie swoim aniołom, aby cię strzegli;"
  tags: []
"Łk4,11":
  text: "I będą cię nosić na rękach, abyś przypadkiem nie uderzył swojej nogi o kamień."
  tags: []
"Łk4,12":
  text: "A Jezus mu odpowiedział: Powiedziano: Nie będziesz wystawiał na próbę Pana, swego Boga."
  tags: []
"Łk4,13":
  text: "Kiedy diabeł skończył całe kuszenie, odstąpił od niego na jakiś czas."
  tags: []
"Łk4,14":
  text: "Jezus zaś wrócił w mocy Ducha do Galilei, a wieść o nim rozeszła się po całej okolicy."
  tags: []
"Łk4,15":
  text: "I nauczał w ich synagogach, sławiony przez wszystkich."
  tags: []
"Łk4,16":
  text: "Przyszedł też do Nazaretu, gdzie się wychował. Według swego zwyczaju wszedł w dzień szabatu do synagogi i wstał, aby czytać."
  tags: []
"Łk4,17":
  text: "I podano mu księgę proroka Izajasza. Gdy otworzył księgę, znalazł miejsce, gdzie było napisane:"
  tags: []
"Łk4,18":
  text: "Duch Pana nade mną, ponieważ namaścił mnie, abym głosił ewangelię ubogim, posłał mnie, abym uzdrawiał skruszonych w sercu, abym uwięzionym zwiastował wyzwolenie, a ślepym przejrzenie, abym uciśnionych wypuścił na wolność;"
  tags: []
"Łk4,19":
  text: "Abym głosił miłościwy rok Pana."
  tags: []
"Łk4,20":
  text: "Potem zamknął księgę, oddał ją słudze i usiadł, a oczy wszystkich w synagodze były w nim utkwione."
  tags: []
"Łk4,21":
  text: "I zaczął do nich mówić: Dziś wypełniły się te słowa Pisma w waszych uszach."
  tags: []
"Łk4,22":
  text: "A wszyscy przyświadczali mu i dziwili się słowom łaski, które wychodziły z jego ust. I mówili: Czyż nie jest to syn Józefa?"
  tags: []
"Łk4,23":
  text: "I powiedział do nich: Z pewnością powiecie mi to przysłowie: Lekarzu, ulecz samego siebie. To, o czym słyszeliśmy, że wydarzyło się w Kafarnaum, uczyń i tu, w swojej ojczyźnie."
  tags: []
"Łk4,24":
  text: "I powiedział: Zaprawdę powiadam wam: Żaden prorok nie jest dobrze przyjmowany w swojej ojczyźnie."
  tags: []
"Łk4,25":
  text: "Ale mówię wam zgodnie z prawdą, że wiele wdów było w Izraelu za dni Eliasza, gdy niebo było zamknięte przez trzy lata i sześć miesięcy, tak że wielki głód panował na całej ziemi;"
  tags: []
"Łk4,26":
  text: "Jednak Eliasz nie został posłany do żadnej z nich, tylko do pewnej wdowy z Sarepty Sydońskiej."
  tags: []
"Łk4,27":
  text: "I wielu było trędowatych w Izraelu za czasów proroka Elizeusza, jednak żaden z nich nie został oczyszczony, tylko Naaman Syryjczyk."
  tags: []
"Łk4,28":
  text: "I wszyscy w synagodze, słysząc to, zapłonęli gniewem;"
  tags: []
"Łk4,29":
  text: "A wstawszy, wypchnęli go z miasta i wyprowadzili na szczyt góry, na której było zbudowane ich miasto, aby go z niej zrzucić."
  tags: []
"Łk4,30":
  text: "Lecz on przeszedł między nimi i oddalił się."
  tags: []
"Łk4,31":
  text: "Potem przyszedł do Kafarnaum, miasta w Galilei, i tam nauczał ich w szabaty."
  tags: []
"Łk4,32":
  text: "I zdumiewali się jego nauką, bo przemawiał z mocą."
  tags: []
"Łk4,33":
  text: "A był w synagodze człowiek, który miał ducha demona nieczystego. Zawołał on donośnym głosem:"
  tags: []
"Łk4,34":
  text: "Ach, cóż my z tobą mamy, Jezusie z Nazaretu? Przyszedłeś nas zniszczyć? Wiem, kim jesteś: Świętym Boga."
  tags: []
"Łk4,35":
  text: "I zgromił go Jezus: Zamilcz i wyjdź z niego! Wtedy demon rzucił go na środek i wyszedł z niego, nie wyrządzając mu żadnej krzywdy."
  tags: []
"Łk4,36":
  text: "A wszystkich ogarnęło zdumienie i rozmawiali między sobą: Cóż to za słowo? Bo z władzą i mocą rozkazuje duchom nieczystym, a one wychodzą."
  tags: []
"Łk4,37":
  text: "I wieść o nim rozeszła się wszędzie po okolicznej krainie."
  tags: []
"Łk4,38":
  text: "Po wyjściu z synagogi Jezus przyszedł do domu Szymona. A teściowa Szymona miała wysoką gorączkę, więc prosili go za nią."
  tags: []
"Łk4,39":
  text: "Wtedy on, stanąwszy nad nią, zgromił gorączkę, a ta ją opuściła. Zaraz też wstała i usługiwała im."
  tags: []
"Łk4,40":
  text: "A gdy słońce zachodziło, wszyscy, którzy mieli cierpiących na rozmaite choroby, przyprowadzali ich do niego, a on na każdego z nich kładł ręce i uzdrawiał ich."
  tags: []
"Łk4,41":
  text: "Z wielu też wychodziły demony, wołając: Ty jesteś Chrystusem, Synem Bożym. Ale on gromił je i nie pozwalał im mówić. Wiedziały bowiem, że on jest Chrystusem."
  tags: []
"Łk4,42":
  text: "Kiedy nastał dzień, wyszedł i udał się na odludne miejsce. A ludzie go szukali i przyszli aż do niego, i zatrzymywali go, aby od nich nie odchodził."
  tags: []
"Łk4,43":
  text: "Lecz on powiedział do nich: Także innym miastom muszę głosić królestwo Boże, bo po to zostałem posłany."
  tags: []
"Łk4,44":
  text: "I głosił w synagogach w Galilei."
  tags: []
