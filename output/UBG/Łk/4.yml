"Łk4,1": "A Jezus, pełen Ducha Świętego, wrócił znad Jordanu i został zaprowadzony przez Ducha na pustynię;"
"Łk4,2": "I przez czterdzieści dni był kuszony przez diabła. Nic nie jadł w tych dniach, a gdy minęły, poczuł głód."
"Łk4,3": "I powiedział do niego diabeł: Jeśli jesteś Synem Bożym, powiedz temu kamieniowi, aby stał się chlebem."
"Łk4,4": "Ale Jezus mu odpowiedział: Jest napisane: Nie samym chlebem będzie żył człowiek, ale każdym słowem Bożym."
"Łk4,5": "Wtedy wyprowadził go diabeł na wysoką górę i pokazał mu w jednej chwili wszystkie królestwa świata."
"Łk4,6": "I powiedział do niego diabeł: Dam ci całą tę potęgę i ich chwałę, bo zostały mi przekazane i daję je, komu chcę."
"Łk4,7": "Jeśli więc oddasz mi pokłon, wszystko będzie twoje."
"Łk4,8": "A Jezus mu odpowiedział: Idź precz ode mnie, szatanie! Jest bowiem napisane: Panu, swemu Bogu, będziesz oddawał pokłon i tylko jemu będziesz służył."
"Łk4,9": "Potem zaprowadził go do Jerozolimy, postawił na szczycie świątyni i powiedział do niego: Jeśli jesteś Synem Bożym, rzuć się stąd w dół."
"Łk4,10": "Jest bowiem napisane: Rozkaże o tobie swoim aniołom, aby cię strzegli;"
"Łk4,11": "I będą cię nosić na rękach, abyś przypadkiem nie uderzył swojej nogi o kamień."
"Łk4,12": "A Jezus mu odpowiedział: Powiedziano: Nie będziesz wystawiał na próbę Pana, swego Boga."
"Łk4,13": "Kiedy diabeł skończył całe kuszenie, odstąpił od niego na jakiś czas."
"Łk4,14": "Jezus zaś wrócił w mocy Ducha do Galilei, a wieść o nim rozeszła się po całej okolicy."
"Łk4,15": "I nauczał w ich synagogach, sławiony przez wszystkich."
"Łk4,16": "Przyszedł też do Nazaretu, gdzie się wychował. Według swego zwyczaju wszedł w dzień szabatu do synagogi i wstał, aby czytać."
"Łk4,17": "I podano mu księgę proroka Izajasza. Gdy otworzył księgę, znalazł miejsce, gdzie było napisane:"
"Łk4,18": "Duch Pana nade mną, ponieważ namaścił mnie, abym głosił ewangelię ubogim, posłał mnie, abym uzdrawiał skruszonych w sercu, abym uwięzionym zwiastował wyzwolenie, a ślepym przejrzenie, abym uciśnionych wypuścił na wolność;"
"Łk4,19": "Abym głosił miłościwy rok Pana."
"Łk4,20": "Potem zamknął księgę, oddał ją słudze i usiadł, a oczy wszystkich w synagodze były w nim utkwione."
"Łk4,21": "I zaczął do nich mówić: Dziś wypełniły się te słowa Pisma w waszych uszach."
"Łk4,22": "A wszyscy przyświadczali mu i dziwili się słowom łaski, które wychodziły z jego ust. I mówili: Czyż nie jest to syn Józefa?"
"Łk4,23": "I powiedział do nich: Z pewnością powiecie mi to przysłowie: Lekarzu, ulecz samego siebie. To, o czym słyszeliśmy, że wydarzyło się w Kafarnaum, uczyń i tu, w swojej ojczyźnie."
"Łk4,24": "I powiedział: Zaprawdę powiadam wam: Żaden prorok nie jest dobrze przyjmowany w swojej ojczyźnie."
"Łk4,25": "Ale mówię wam zgodnie z prawdą, że wiele wdów było w Izraelu za dni Eliasza, gdy niebo było zamknięte przez trzy lata i sześć miesięcy, tak że wielki głód panował na całej ziemi;"
"Łk4,26": "Jednak Eliasz nie został posłany do żadnej z nich, tylko do pewnej wdowy z Sarepty Sydońskiej."
"Łk4,27": "I wielu było trędowatych w Izraelu za czasów proroka Elizeusza, jednak żaden z nich nie został oczyszczony, tylko Naaman Syryjczyk."
"Łk4,28": "I wszyscy w synagodze, słysząc to, zapłonęli gniewem;"
"Łk4,29": "A wstawszy, wypchnęli go z miasta i wyprowadzili na szczyt góry, na której było zbudowane ich miasto, aby go z niej zrzucić."
"Łk4,30": "Lecz on przeszedł między nimi i oddalił się."
"Łk4,31": "Potem przyszedł do Kafarnaum, miasta w Galilei, i tam nauczał ich w szabaty."
"Łk4,32": "I zdumiewali się jego nauką, bo przemawiał z mocą."
"Łk4,33": "A był w synagodze człowiek, który miał ducha demona nieczystego. Zawołał on donośnym głosem:"
"Łk4,34": "Ach, cóż my z tobą mamy, Jezusie z Nazaretu? Przyszedłeś nas zniszczyć? Wiem, kim jesteś: Świętym Boga."
"Łk4,35": "I zgromił go Jezus: Zamilcz i wyjdź z niego! Wtedy demon rzucił go na środek i wyszedł z niego, nie wyrządzając mu żadnej krzywdy."
"Łk4,36": "A wszystkich ogarnęło zdumienie i rozmawiali między sobą: Cóż to za słowo? Bo z władzą i mocą rozkazuje duchom nieczystym, a one wychodzą."
"Łk4,37": "I wieść o nim rozeszła się wszędzie po okolicznej krainie."
"Łk4,38": "Po wyjściu z synagogi Jezus przyszedł do domu Szymona. A teściowa Szymona miała wysoką gorączkę, więc prosili go za nią."
"Łk4,39": "Wtedy on, stanąwszy nad nią, zgromił gorączkę, a ta ją opuściła. Zaraz też wstała i usługiwała im."
"Łk4,40": "A gdy słońce zachodziło, wszyscy, którzy mieli cierpiących na rozmaite choroby, przyprowadzali ich do niego, a on na każdego z nich kładł ręce i uzdrawiał ich."
"Łk4,41": "Z wielu też wychodziły demony, wołając: Ty jesteś Chrystusem, Synem Bożym. Ale on gromił je i nie pozwalał im mówić. Wiedziały bowiem, że on jest Chrystusem."
"Łk4,42": "Kiedy nastał dzień, wyszedł i udał się na odludne miejsce. A ludzie go szukali i przyszli aż do niego, i zatrzymywali go, aby od nich nie odchodził."
"Łk4,43": "Lecz on powiedział do nich: Także innym miastom muszę głosić królestwo Boże, bo po to zostałem posłany."
"Łk4,44": "I głosił w synagogach w Galilei."
