"Łk19,1":
  text: "A Jezus wszedł do Jerycha i przechodził przez nie."
  tags: []
"Łk19,2":
  text: "Był tam pewien człowiek, imieniem Zacheusz, przełożony celników, a był on bogaty."
  tags: []
"Łk19,3":
  text: "Pragnął on zobaczyć Jezusa, kto to jest, lecz nie mógł z powodu tłumu, bo był niskiego wzrostu."
  tags: []
"Łk19,4":
  text: "Pobiegł więc naprzód i wszedł na drzewo sykomory, aby go zobaczyć, bo miał tamtędy przechodzić."
  tags: []
"Łk19,5":
  text: "A gdy Jezus przyszedł na to miejsce, spojrzał w górę, zobaczył go i powiedział: Zacheuszu, zejdź szybko, bo dziś muszę zatrzymać się w twoim domu."
  tags: []
"Łk19,6":
  text: "I zszedł szybko, i przyjął go z radością."
  tags: []
"Łk19,7":
  text: "A wszyscy, widząc to, szemrali: Do człowieka grzesznego przybył w gościnę."
  tags: []
"Łk19,8":
  text: "Zacheusz zaś stanął i powiedział do Pana: Panie, oto połowę mojego majątku daję ubogim, a jeśli kogoś w czymś oszukałem, oddaję poczwórnie."
  tags: []
"Łk19,9":
  text: "I powiedział Jezus do niego: Dziś zbawienie przyszło do tego domu, gdyż i on jest synem Abrahama."
  tags: []
"Łk19,10":
  text: "Bo Syn Człowieczy przyszedł, aby szukać i zbawić to, co zginęło."
  tags: []
"Łk19,11":
  text: "A gdy oni tego słuchali, opowiedział im dodatkowo przypowieść, dlatego że był blisko Jerozolimy, a oni myśleli, że wnet ma się objawić królestwo Boże."
  tags: []
"Łk19,12":
  text: "Mówił więc: Pewien człowiek szlachetnego rodu udał się do dalekiego kraju, aby objąć królestwo, a potem wrócić."
  tags: []
"Łk19,13":
  text: "A przywoławszy dziesięciu swoich sług, dał im dziesięć grzywien i powiedział do nich: Obracajcie nimi, aż wrócę."
  tags: []
"Łk19,14":
  text: "Lecz jego poddani nienawidzili go i wysłali za nim poselstwo ze słowami: Nie chcemy, aby ten człowiek królował nad nami."
  tags: []
"Łk19,15":
  text: "A gdy wrócił po objęciu królestwa, rozkazał przywołać do siebie te sługi, którym dał pieniądze, aby się dowiedzieć, co każdy zyskał, handlując."
  tags: []
"Łk19,16":
  text: "Wtedy przyszedł pierwszy i powiedział: Panie, twoja grzywna zyskała dziesięć grzywien."
  tags: []
"Łk19,17":
  text: "I powiedział do niego: Dobrze, sługo dobry, ponieważ byłeś wierny w małym, sprawuj władzę nad dziesięcioma miastami."
  tags: []
"Łk19,18":
  text: "Przyszedł też drugi i powiedział: Panie, twoja grzywna zyskała pięć grzywien."
  tags: []
"Łk19,19":
  text: "Również temu powiedział: I ty władaj pięcioma miastami."
  tags: []
"Łk19,20":
  text: "A inny przyszedł i powiedział: Panie, oto twoja grzywna, którą miałem schowaną w chustce."
  tags: []
"Łk19,21":
  text: "Bałem się bowiem ciebie, bo jesteś człowiekiem surowym: bierzesz, czego nie położyłeś, i żniesz, czego nie posiałeś."
  tags: []
"Łk19,22":
  text: "Wtedy mu odpowiedział: Na podstawie twoich słów osądzę cię, zły sługo. Wiedziałeś, że jestem człowiekiem surowym, który bierze, czego nie położył, i żnie, czego nie posiał."
  tags: []
"Łk19,23":
  text: "Dlaczego więc nie dałeś moich pieniędzy do banku, abym po powrocie odebrał je z zyskiem?"
  tags: []
"Łk19,24":
  text: "Do tych zaś, którzy stali obok, powiedział: Odbierzcie mu grzywnę i dajcie temu, który ma dziesięć grzywien."
  tags: []
"Łk19,25":
  text: "Odpowiedzieli mu: Panie, ma już dziesięć grzywien."
  tags: []
"Łk19,26":
  text: "Zaprawdę powiadam wam, że każdemu, kto ma, będzie dodane, a temu, kto nie ma, zostanie zabrane nawet to, co ma."
  tags: []
"Łk19,27":
  text: "Lecz tych moich nieprzyjaciół, którzy nie chcieli, abym nad nimi panował, przyprowadźcie tu i zabijcie na moich oczach."
  tags: []
"Łk19,28":
  text: "A powiedziawszy to, ruszył przodem, zmierzając do Jerozolimy."
  tags: []
"Łk19,29":
  text: "A gdy przybliżył się do Betfage i Betanii, przy górze zwanej Oliwną, wysłał dwóch ze swoich uczniów;"
  tags: []
"Łk19,30":
  text: "Mówiąc: Idźcie do wioski, która jest naprzeciwko, a wchodząc do niej, znajdziecie oślątko uwiązane, na którym nigdy nie siedział żaden człowiek. Odwiążcie je i przyprowadźcie."
  tags: []
"Łk19,31":
  text: "A gdyby was ktoś spytał: Dlaczego je odwiązujecie? tak mu powiecie: Dlatego, że Pan go potrzebuje."
  tags: []
"Łk19,32":
  text: "Wtedy odeszli ci, którzy zostali posłani, i znaleźli wszystko, jak im powiedział."
  tags: []
"Łk19,33":
  text: "A gdy odwiązywali oślątko, zapytali ich jego właściciele: Dlaczego odwiązujecie oślątko?"
  tags: []
"Łk19,34":
  text: "A oni odpowiedzieli: Pan go potrzebuje."
  tags: []
"Łk19,35":
  text: "I przyprowadzili je do Jezusa, położyli swoje szaty na oślątko i wsadzili na nie Jezusa."
  tags: []
"Łk19,36":
  text: "Kiedy jechał, słali swoje szaty na drodze."
  tags: []
"Łk19,37":
  text: "A gdy się już zbliżał do podnóża Góry Oliwnej, całe mnóstwo uczniów zaczęło radować się i donośnym głosem chwalić Boga za wszystkie cuda, które widzieli:"
  tags: []
"Łk19,38":
  text: "Mówili: Błogosławiony król, który przychodzi w imieniu Pana! Pokój w niebie i chwała na wysokościach!"
  tags: []
"Łk19,39":
  text: "Lecz niektórzy faryzeusze spośród tłumu powiedzieli do niego: Nauczycielu, zgrom swoich uczniów."
  tags: []
"Łk19,40":
  text: "A on im odpowiedział: Mówię wam, jeśli oni będą milczeć, wnet kamienie będą wołać."
  tags: []
"Łk19,41":
  text: "A gdy się przybliżył i zobaczył miasto, zapłakał nad nim;"
  tags: []
"Łk19,42":
  text: "Mówiąc: O gdybyś i ty poznało, przynajmniej w tym twoim dniu, co służy twemu pokojowi! Lecz teraz zakryte jest to przed twoimi oczami."
  tags: []
"Łk19,43":
  text: "Przyjdą bowiem na ciebie dni, gdy twoi nieprzyjaciele otoczą cię wałem, oblegną cię i ścisną zewsząd."
  tags: []
"Łk19,44":
  text: "Zrównają z ziemią ciebie i twoje dzieci, które są w tobie, i nie zostawią w tobie kamienia na kamieniu, dlatego żeś nie poznało czasu twego nawiedzenia."
  tags: []
"Łk19,45":
  text: "A gdy wszedł do świątyni, zaczął wyganiać tych, którzy w niej sprzedawali i kupowali;"
  tags: []
"Łk19,46":
  text: "Mówiąc im: Jest napisane: Mój dom jest domem modlitwy, a wy zrobiliście z niego jaskinię zbójców."
  tags: []
"Łk19,47":
  text: "I nauczał każdego dnia w świątyni. Naczelni kapłani zaś i uczeni w Piśmie oraz przywódcy ludu szukali sposobności, aby go zabić;"
  tags: []
"Łk19,48":
  text: "Ale nie wiedzieli, co mogliby zrobić, bo wszyscy ludzie słuchali go z zapartym tchem."
  tags: []
