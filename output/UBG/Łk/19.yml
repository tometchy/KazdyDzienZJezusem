"Łk19,1": "A Jezus wszedł do Jerycha i przechodził przez nie."
"Łk19,2": "Był tam pewien człowiek, imieniem Zacheusz, przełożony celników, a był on bogaty."
"Łk19,3": "Pragnął on zobaczyć Jezusa, kto to jest, lecz nie mógł z powodu tłumu, bo był niskiego wzrostu."
"Łk19,4": "Pobiegł więc naprzód i wszedł na drzewo sykomory, aby go zobaczyć, bo miał tamtędy przechodzić."
"Łk19,5": "A gdy Jezus przyszedł na to miejsce, spojrzał w górę, zobaczył go i powiedział: Zacheuszu, zejdź szybko, bo dziś muszę zatrzymać się w twoim domu."
"Łk19,6": "I zszedł szybko, i przyjął go z radością."
"Łk19,7": "A wszyscy, widząc to, szemrali: Do człowieka grzesznego przybył w gościnę."
"Łk19,8": "Zacheusz zaś stanął i powiedział do Pana: Panie, oto połowę mojego majątku daję ubogim, a jeśli kogoś w czymś oszukałem, oddaję poczwórnie."
"Łk19,9": "I powiedział Jezus do niego: Dziś zbawienie przyszło do tego domu, gdyż i on jest synem Abrahama."
"Łk19,10": "Bo Syn Człowieczy przyszedł, aby szukać i zbawić to, co zginęło."
"Łk19,11": "A gdy oni tego słuchali, opowiedział im dodatkowo przypowieść, dlatego że był blisko Jerozolimy, a oni myśleli, że wnet ma się objawić królestwo Boże."
"Łk19,12": "Mówił więc: Pewien człowiek szlachetnego rodu udał się do dalekiego kraju, aby objąć królestwo, a potem wrócić."
"Łk19,13": "A przywoławszy dziesięciu swoich sług, dał im dziesięć grzywien i powiedział do nich: Obracajcie nimi, aż wrócę."
"Łk19,14": "Lecz jego poddani nienawidzili go i wysłali za nim poselstwo ze słowami: Nie chcemy, aby ten człowiek królował nad nami."
"Łk19,15": "A gdy wrócił po objęciu królestwa, rozkazał przywołać do siebie te sługi, którym dał pieniądze, aby się dowiedzieć, co każdy zyskał, handlując."
"Łk19,16": "Wtedy przyszedł pierwszy i powiedział: Panie, twoja grzywna zyskała dziesięć grzywien."
"Łk19,17": "I powiedział do niego: Dobrze, sługo dobry, ponieważ byłeś wierny w małym, sprawuj władzę nad dziesięcioma miastami."
"Łk19,18": "Przyszedł też drugi i powiedział: Panie, twoja grzywna zyskała pięć grzywien."
"Łk19,19": "Również temu powiedział: I ty władaj pięcioma miastami."
"Łk19,20": "A inny przyszedł i powiedział: Panie, oto twoja grzywna, którą miałem schowaną w chustce."
"Łk19,21": "Bałem się bowiem ciebie, bo jesteś człowiekiem surowym: bierzesz, czego nie położyłeś, i żniesz, czego nie posiałeś."
"Łk19,22": "Wtedy mu odpowiedział: Na podstawie twoich słów osądzę cię, zły sługo. Wiedziałeś, że jestem człowiekiem surowym, który bierze, czego nie położył, i żnie, czego nie posiał."
"Łk19,23": "Dlaczego więc nie dałeś moich pieniędzy do banku, abym po powrocie odebrał je z zyskiem?"
"Łk19,24": "Do tych zaś, którzy stali obok, powiedział: Odbierzcie mu grzywnę i dajcie temu, który ma dziesięć grzywien."
"Łk19,25": "Odpowiedzieli mu: Panie, ma już dziesięć grzywien."
"Łk19,26": "Zaprawdę powiadam wam, że każdemu, kto ma, będzie dodane, a temu, kto nie ma, zostanie zabrane nawet to, co ma."
"Łk19,27": "Lecz tych moich nieprzyjaciół, którzy nie chcieli, abym nad nimi panował, przyprowadźcie tu i zabijcie na moich oczach."
"Łk19,28": "A powiedziawszy to, ruszył przodem, zmierzając do Jerozolimy."
"Łk19,29": "A gdy przybliżył się do Betfage i Betanii, przy górze zwanej Oliwną, wysłał dwóch ze swoich uczniów;"
"Łk19,30": "Mówiąc: Idźcie do wioski, która jest naprzeciwko, a wchodząc do niej, znajdziecie oślątko uwiązane, na którym nigdy nie siedział żaden człowiek. Odwiążcie je i przyprowadźcie."
"Łk19,31": "A gdyby was ktoś spytał: Dlaczego je odwiązujecie? tak mu powiecie: Dlatego, że Pan go potrzebuje."
"Łk19,32": "Wtedy odeszli ci, którzy zostali posłani, i znaleźli wszystko, jak im powiedział."
"Łk19,33": "A gdy odwiązywali oślątko, zapytali ich jego właściciele: Dlaczego odwiązujecie oślątko?"
"Łk19,34": "A oni odpowiedzieli: Pan go potrzebuje."
"Łk19,35": "I przyprowadzili je do Jezusa, położyli swoje szaty na oślątko i wsadzili na nie Jezusa."
"Łk19,36": "Kiedy jechał, słali swoje szaty na drodze."
"Łk19,37": "A gdy się już zbliżał do podnóża Góry Oliwnej, całe mnóstwo uczniów zaczęło radować się i donośnym głosem chwalić Boga za wszystkie cuda, które widzieli:"
"Łk19,38": "Mówili: Błogosławiony król, który przychodzi w imieniu Pana! Pokój w niebie i chwała na wysokościach!"
"Łk19,39": "Lecz niektórzy faryzeusze spośród tłumu powiedzieli do niego: Nauczycielu, zgrom swoich uczniów."
"Łk19,40": "A on im odpowiedział: Mówię wam, jeśli oni będą milczeć, wnet kamienie będą wołać."
"Łk19,41": "A gdy się przybliżył i zobaczył miasto, zapłakał nad nim;"
"Łk19,42": "Mówiąc: O gdybyś i ty poznało, przynajmniej w tym twoim dniu, co służy twemu pokojowi! Lecz teraz zakryte jest to przed twoimi oczami."
"Łk19,43": "Przyjdą bowiem na ciebie dni, gdy twoi nieprzyjaciele otoczą cię wałem, oblegną cię i ścisną zewsząd."
"Łk19,44": "Zrównają z ziemią ciebie i twoje dzieci, które są w tobie, i nie zostawią w tobie kamienia na kamieniu, dlatego żeś nie poznało czasu twego nawiedzenia."
"Łk19,45": "A gdy wszedł do świątyni, zaczął wyganiać tych, którzy w niej sprzedawali i kupowali;"
"Łk19,46": "Mówiąc im: Jest napisane: Mój dom jest domem modlitwy, a wy zrobiliście z niego jaskinię zbójców."
"Łk19,47": "I nauczał każdego dnia w świątyni. Naczelni kapłani zaś i uczeni w Piśmie oraz przywódcy ludu szukali sposobności, aby go zabić;"
"Łk19,48": "Ale nie wiedzieli, co mogliby zrobić, bo wszyscy ludzie słuchali go z zapartym tchem."
