"Kpł23,1":
  text: "I PAN powiedział do Mojżesza:"
  tags: []
"Kpł23,2":
  text: "Przemów do synów Izraela i powiedz im: Uroczyste święta PANA, które będziecie ogłaszać jako święte zgromadzenia. One są moimi uroczystymi świętami."
  tags: []
"Kpł23,3":
  text: "Przez sześć dni będziecie wykonywać pracę, ale siódmy dzień będzie szabatem odpoczynku, świętym zgromadzeniem, nie będziecie wykonywać wtedy żadnej pracy. Jest to szabat PANA we wszystkich waszych domach."
  tags: []
"Kpł23,4":
  text: "Oto uroczyste święta PANA, święte zgromadzenia, które będziecie ogłaszać w ich oznaczonych porach:"
  tags: []
"Kpł23,5":
  text: "W pierwszym miesiącu, czternastego dnia tego miesiąca, o zmierzchu, jest Pascha PANA."
  tags: []
"Kpł23,6":
  text: "A piętnastego dnia tego miesiąca będzie Święto Przaśników dla PANA. Przez siedem dni będziecie jeść przaśne chleby."
  tags: []
"Kpł23,7":
  text: "Pierwszego dnia będziecie mieć święte zgromadzenie. Nie będziecie wykonywać żadnej uciążliwej pracy."
  tags: []
"Kpł23,8":
  text: "Lecz będziecie składali PANU ofiarę spalaną przez siedem dni. Siódmego dnia będzie święte zgromadzenie. Nie będziecie wykonywać żadnej ciężkiej pracy."
  tags: []
"Kpł23,9":
  text: "I PAN powiedział do Mojżesza:"
  tags: []
"Kpł23,10":
  text: "Przemów do synów Izraela i powiedz im: Gdy wejdziecie do ziemi, którą wam daję, i będziecie zbierać plony, wtedy przyniesiecie do kapłana snop z pierwocin waszego plonu."
  tags: []
"Kpł23,11":
  text: "I on będzie kołysał tym snopem przed PANEM, aby był przyjęty za was. Nazajutrz po sabacie kapłan będzie nim kołysał."
  tags: []
"Kpł23,12":
  text: "W dniu kołysania tym snopem złożycie w ofierze rocznego baranka bez skazy jako całopalenie dla PANA;"
  tags: []
"Kpł23,13":
  text: "Wraz z nim na ofiarę pokarmową dwie dziesiąte efy mąki pszennej zmieszanej z oliwą jako ofiarę spalaną PANU na miłą woń, a do tego także ofiarę z płynów, jedną czwartą hinu wina."
  tags: []
"Kpł23,14":
  text: "Nie będziecie jeść chleba ani prażonego ziarna, ani świeżych kłosów aż do dnia, w którym przyniesiecie ofiarę waszemu Bogu. Będzie to wieczna ustawa przez wszystkie wasze pokolenia, we wszystkich waszych mieszkaniach."
  tags: []
"Kpł23,15":
  text: "I odliczycie sobie od pierwszego dnia po szabacie, od dnia, w którym przynieśliście snop kołysania, siedem pełnych tygodni."
  tags: []
"Kpł23,16":
  text: "Aż do pierwszego dnia po siódmym szabacie odliczycie pięćdziesiąt dni i wtedy złożycie PANU nową ofiarę pokarmową."
  tags: []
"Kpł23,17":
  text: "Przyniesiecie z waszych domów dwa chleby na ofiarę kołysania. Będą one z dwóch dziesiątych efy mąki pszennej, upieczone na zakwasie; to będą pierwociny dla PANA."
  tags: []
"Kpł23,18":
  text: "Razem z tym chlebem złożycie w ofierze siedem rocznych baranków bez skazy, jednego młodego cielca i dwa barany. Będą one na ofiarę całopalenia dla PANA wraz z ich ofiarą pokarmową i ofiarami z płynów. Będzie to ofiara spalana na miłą woń dla PANA."
  tags: []
"Kpł23,19":
  text: "Złożycie też jednego kozła na ofiarę za grzech i dwa roczne baranki na ofiarę pojednawczą."
  tags: []
"Kpł23,20":
  text: "I kapłan będzie je kołysał razem z chlebem pierwocin na ofiarę kołysania przed PANEM wraz z dwoma barankami. One będą poświęcone PANU, przeznaczone dla kapłana."
  tags: []
"Kpł23,21":
  text: "I ogłosicie w tym dniu święto; będzie to dla was święte zgromadzenie. Nie będziecie wykonywać żadnej uciążliwej pracy. To będzie wieczysta ustawa we wszystkich waszych domach, przez wszystkie wasze pokolenia."
  tags: []
"Kpł23,22":
  text: "A gdy będziecie zbierać plony waszej ziemi, nie będziesz wycinać doszczętnie skraju twego pola i nie będziesz zbierać pokłosia twoich plonów. Zostawisz je dla ubogiego i przybysza. Ja jestem PAN, wasz Bóg."
  tags: []
"Kpł23,23":
  text: "PAN dalej mówił do Mojżesza:"
  tags: []
"Kpł23,24":
  text: "Przemów do synów Izraela i powiedz im: W siódmym miesiącu, pierwszego dnia tego miesiąca, będziecie mieli szabat, upamiętnienie przez trąbienie, święte zgromadzenie."
  tags: []
"Kpł23,25":
  text: "Nie będziecie wykonywać żadnej uciążliwej pracy, lecz złożycie PANU ofiarę spalaną."
  tags: []
"Kpł23,26":
  text: "PAN powiedział jeszcze do Mojżesza:"
  tags: []
"Kpł23,27":
  text: "Lecz dziesiątego dnia tego siódmego miesiąca będzie Dzień Przebłagania. Będzie to dla was święte zgromadzenie; będziecie trapić swoje dusze i składać PANU ofiarę spalaną."
  tags: []
"Kpł23,28":
  text: "W tym dniu nie będziecie wykonywać żadnej pracy, gdyż jest to Dzień Przebłagania, żeby dokonano dla was przebłagania przed PANEM, waszym Bogiem."
  tags: []
"Kpł23,29":
  text: "Każdy bowiem człowiek, który nie będzie trapił swojej duszy tego dnia, zostanie wykluczony ze swego ludu."
  tags: []
"Kpł23,30":
  text: "Także każdego, kto będzie wykonywał jakąkolwiek pracę w tym dniu, zgładzę spośród jego ludu."
  tags: []
"Kpł23,31":
  text: "Nie będziecie wykonywać żadnej pracy; będzie to wieczysta ustawa przez wszystkie wasze pokolenia, we wszystkich waszych domach."
  tags: []
"Kpł23,32":
  text: "Będzie to dla was szabat odpoczynku i będziecie trapić swoje dusze. Dziewiątego dnia tego miesiąca, wieczorem, od wieczora aż do wieczora, będziecie obchodzić wasz szabat."
  tags: []
"Kpł23,33":
  text: "PAN dalej mówił do Mojżesza:"
  tags: []
"Kpł23,34":
  text: "Przemów do synów Izraela i powiedz im: Piętnastego dnia tego siódmego miesiąca będzie Święto Namiotów przez siedem dni dla PANA."
  tags: []
"Kpł23,35":
  text: "Pierwszego dnia będzie święte zgromadzenie. Nie będziecie wykonywać żadnej uciążliwej pracy."
  tags: []
"Kpł23,36":
  text: "Przez siedem dni będziecie składać PANU ofiarę spalaną. Ósmego dnia będziecie mieć święte zgromadzenie i będziecie składać PANU ofiarę spalaną. Jest to święto, żadnej uciążliwej pracy nie będziecie wykonywać."
  tags: []
"Kpł23,37":
  text: "To są święta PANA, które ogłosicie jako święte zgromadzenia, abyście składali PANU ofiarę spalaną, całopalenie, ofiarę pokarmową, ofiarę pojednawczą i ofiary z płynów, każdą w swój dzień;"
  tags: []
"Kpł23,38":
  text: "Oprócz szabatów PANA, oprócz waszych darów, oprócz wszystkich waszych ślubów i wszystkich waszych dobrowolnych ofiar, które będziecie składać PANU."
  tags: []
"Kpł23,39":
  text: "Piętnastego dnia siódmego miesiąca, gdy zbierzecie plony ziemi, będziecie obchodzili święto dla PANA przez siedem dni; w pierwszym dniu będzie odpoczynek, także w ósmym dniu będzie odpoczynek."
  tags: []
"Kpł23,40":
  text: "Pierwszego dnia weźmiecie sobie owoce z najlepszych drzew, gałązki palmowe, gałązki gęstych drzew i wierzbiny znad potoku i będziecie się weselić przed PANEM, waszym Bogiem, przez siedem dni."
  tags: []
"Kpł23,41":
  text: "Będziecie obchodzić to święto dla PANA przez siedem dni, co rok. Będzie to wieczysta ustawa przez wszystkie wasze pokolenia. W siódmym miesiącu będziecie je obchodzić."
  tags: []
"Kpł23,42":
  text: "Przez siedem dni będziecie mieszkać w szałasach. Wszyscy urodzeni Izraelici będą mieszkać w szałasach;"
  tags: []
"Kpł23,43":
  text: "Aby wasze pokolenia wiedziały, że kazałem synom Izraela mieszkać w szałasach, gdy wyprowadziłem ich z ziemi Egiptu. Ja jestem PAN, wasz Bóg."
  tags: []
"Kpł23,44":
  text: "I ogłosił Mojżesz synom Izraela te święta PANA."
  tags: []
