"Kpł26,1":
  text: "Nie czyńcie sobie bożków ani rzeźbionego posągu ani nie stawiajcie stel, ani kamiennych rzeźb w waszej ziemi, by im oddawać pokłon, bo ja jestem PAN, wasz Bóg."
  tags: []
"Kpł26,2":
  text: "Będziecie zachowywać moje szabaty i czcić moją świątynię. Ja jestem PAN."
  tags: []
"Kpł26,3":
  text: "Jeśli będziecie postępować według moich ustaw i przestrzegać moich przykazań, i wykonywać je;"
  tags: []
"Kpł26,4":
  text: "To ześlę wam deszcze we właściwym czasie i ziemia wyda swój plon, i drzewa polne wydadzą swój owoc;"
  tags: []
"Kpł26,5":
  text: "Młocka będzie trwać do winobrania, a winobranie do siewu; będziecie jeść swój chleb do syta i mieszkać bezpiecznie w swojej ziemi."
  tags: []
"Kpł26,6":
  text: "Udzielę ziemi pokoju, położycie się i nikt was nie będzie straszył. Usunę z ziemi groźne zwierzę i miecz nie przejdzie przez waszą ziemię."
  tags: []
"Kpł26,7":
  text: "Będziecie ścigać waszych wrogów i upadną przed wami od miecza."
  tags: []
"Kpł26,8":
  text: "Pięciu z was będzie ścigać stu, a stu z was będzie ścigać dziesięć tysięcy. I wasi wrogowie padną przed wami od miecza."
  tags: []
"Kpł26,9":
  text: "Zwrócę się bowiem ku wam i rozplenię was, rozmnożę was i utwierdzę moje przymierze z wami."
  tags: []
"Kpł26,10":
  text: "I będziecie jedli zboże z poprzednich zbiorów, potem wyniesiecie stare, gdy nastaną nowe."
  tags: []
"Kpł26,11":
  text: "Umieszczę też mój przybytek wśród was i moja dusza nie obrzydzi was sobie."
  tags: []
"Kpł26,12":
  text: "I będę przechadzał się wśród was, i będę waszym Bogiem, a wy będziecie moim ludem."
  tags: []
"Kpł26,13":
  text: "Ja jestem PAN, wasz Bóg, który wyprowadził was z ziemi Egiptu, abyście już nie byli ich niewolnikami; i połamałem więzy waszego jarzma, abyście chodzili wyprostowani."
  tags: []
"Kpł26,14":
  text: "Jeśli jednak nie posłuchacie mnie i nie wykonacie wszystkich tych przykazań;"
  tags: []
"Kpł26,15":
  text: "I jeśli wzgardzicie moimi ustawami, i wasza dusza będzie się brzydzić moimi sądami, tak że nie wykonacie wszystkich moich przykazań i złamiecie moje przymierze;"
  tags: []
"Kpł26,16":
  text: "To i ja z wami tak postąpię: Dotknę was przerażeniem, wycieńczeniem i gorączką, które wyniszczą wam oczy i napełnią wasze dusze boleścią. Na próżno będziecie siać wasze ziarno, bo zjedzą je wasi wrogowie;"
  tags: []
"Kpł26,17":
  text: "I zwrócę moje oblicze przeciwko wam, i zostaniecie pobici przez waszych wrogów. Ci, którzy was nienawidzą, będą panować nad wami i będziecie uciekali, choć nikt was nie będzie ścigać."
  tags: []
"Kpł26,18":
  text: "A jeśli mimo to nie posłuchacie mnie, będę karał was siedem razy więcej za wasze grzechy;"
  tags: []
"Kpł26,19":
  text: "Złamię pychę waszej potęgi i niebo nad wami uczynię jak z żelaza, a waszą ziemię jak z miedzi;"
  tags: []
"Kpł26,20":
  text: "I wasza praca będzie szła na próżno, bo wasza ziemia nie wyda swego plonu, a drzewa ziemi nie wydadzą swego owocu."
  tags: []
"Kpł26,21":
  text: "A jeśli będziecie postępować na przekór mnie i nie zechcecie mnie słuchać, to przydam wam siedem razy więcej plag za wasze grzechy."
  tags: []
"Kpł26,22":
  text: "Ześlę też na was dzikie zwierzęta, które was osierocą, wyniszczą wasze bydło i zmniejszą waszą liczbę, tak że opustoszeją wasze drogi."
  tags: []
"Kpł26,23":
  text: "A jeśli przez to nie poprawicie się, ale będziecie postępować na przekór mnie;"
  tags: []
"Kpł26,24":
  text: "To i ja postąpię na przekór wam i będę was karał siedmiokrotnie za wasze grzechy;"
  tags: []
"Kpł26,25":
  text: "I sprowadzę na was miecz, który pomści złamane przymierze; gdy zbierzecie się w swych miastach, wtedy ześlę zarazę pomiędzy was i będziecie wydani w ręce wroga."
  tags: []
"Kpł26,26":
  text: "A gdy złamię podporę waszego chleba, dziesięć kobiet będzie piec wasz chleb w jednym piecu i będą wam wydzielać wasz chleb na wagę; będziecie jeść, lecz się nie nasycicie."
  tags: []
"Kpł26,27":
  text: "A jeśli mimo to nie posłuchacie mnie, ale będziecie postępować na przekór mnie;"
  tags: []
"Kpł26,28":
  text: "To ja też postąpię na przekór wam z gniewem; też będę was karać siedmiokrotnie za wasze grzechy."
  tags: []
"Kpł26,29":
  text: "I będziecie jeść ciało waszych synów i ciało waszych córek."
  tags: []
"Kpł26,30":
  text: "Zniszczę wasze wyżyny, zburzę wasze posągi i rzucę wasze szczątki na szczątki waszych bożków, a moja dusza będzie się wami brzydzić."
  tags: []
"Kpł26,31":
  text: "I zamienię wasze miasta w ruiny, i zburzę wasze świątynie, i więcej nie przyjmę waszych wdzięcznych wonności."
  tags: []
"Kpł26,32":
  text: "I spustoszę ziemię tak, że zdumieją się nad nią wasi wrogowie, którzy w niej mieszkają."
  tags: []
"Kpł26,33":
  text: "A was rozproszę między narodami i dobędę miecz za wami; wasza ziemia będzie spustoszona i wasze miasta zburzone."
  tags: []
"Kpł26,34":
  text: "Wtedy ziemia ucieszy się swoimi szabatami przez wszystkie dni swojego spustoszenia, a wy będziecie w ziemi waszych wrogów. Wtedy ziemia odpocznie i ucieszy się swoimi szabatami."
  tags: []
"Kpł26,35":
  text: "Przez wszystkie dni swojego spustoszenia będzie odpoczywać, gdyż nie odpoczywała w czasie waszych szabatów, kiedy w niej mieszkaliście."
  tags: []
"Kpł26,36":
  text: "A tym, którzy z was pozostaną, ześlę do ich serc lękliwość w ziemiach ich wrogów, tak że będzie ich ścigać szelest opadającego liścia i będą uciekać jak przed mieczem, i będą padać, chociaż nikt nie będzie ich ścigać."
  tags: []
"Kpł26,37":
  text: "I padną jeden na drugiego jakby od miecza, choć nikt ich nie będzie ścigać. Nie będziecie mogli się ostać przed waszymi wrogami."
  tags: []
"Kpł26,38":
  text: "Zginiecie wśród narodów i pożre was ziemia waszych wrogów."
  tags: []
"Kpł26,39":
  text: "A ci z was, którzy zostaną, zgniją z powodu swojej nieprawości w ziemi swoich wrogów; także z powodu nieprawości swoich ojców zgniją wraz z nimi."
  tags: []
"Kpł26,40":
  text: "Ale jeśli wyznają swoją nieprawość i nieprawość swoich ojców oraz przewinienie, którymi wystąpili przeciwko mnie, oraz to, że postępowali na przekór mnie;"
  tags: []
"Kpł26,41":
  text: "I że ja postępowałem na przekór im, i wprowadziłem ich do ziemi ich wrogów; jeśli wtedy ukorzą się ich nieobrzezane serca i będą znosić karę za swoje nieprawości;"
  tags: []
"Kpł26,42":
  text: "Wtedy wspomnę na moje przymierze z Jakubem i na moje przymierze z Izaakiem, wspomnę też na moje przymierze z Abrahamem, wspomnę i na tę ziemię."
  tags: []
"Kpł26,43":
  text: "A ziemia będzie przez nich opuszczona i ucieszy się swoimi szabatami, gdy będzie spustoszona z ich powodu. Będą cierpliwie nosić karę za swoją nieprawość, ponieważ wzgardzili moimi sądami i ich dusza obrzydziła sobie moje ustawy."
  tags: []
"Kpł26,44":
  text: "Lecz mimo tego wszystkiego, gdy będą w ziemi swoich wrogów, nie odrzucę ich ani nie obrzydzę ich sobie tak, by ich wytępić i złamać moje przymierze z nimi, gdyż ja jestem PAN, ich Bóg."
  tags: []
"Kpł26,45":
  text: "Ale dla nich wspomnę na przymierze ich przodków, których wyprowadziłem z ziemi Egiptu na oczach pogan, aby być ich Bogiem. Ja jestem PAN."
  tags: []
"Kpł26,46":
  text: "To są ustawy, sądy i prawa, które ustanowił PAN między sobą a synami Izraela na górze Synaj za pośrednictwem Mojżesza."
  tags: []
