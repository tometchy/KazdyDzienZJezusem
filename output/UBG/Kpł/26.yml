"Kpł26,1": "Nie czyńcie sobie bożków ani rzeźbionego posągu ani nie stawiajcie stel, ani kamiennych rzeźb w waszej ziemi, by im oddawać pokłon, bo ja jestem PAN, wasz Bóg."
"Kpł26,2": "Będziecie zachowywać moje szabaty i czcić moją świątynię. Ja jestem PAN."
"Kpł26,3": "Jeśli będziecie postępować według moich ustaw i przestrzegać moich przykazań, i wykonywać je;"
"Kpł26,4": "To ześlę wam deszcze we właściwym czasie i ziemia wyda swój plon, i drzewa polne wydadzą swój owoc;"
"Kpł26,5": "Młocka będzie trwać do winobrania, a winobranie do siewu; będziecie jeść swój chleb do syta i mieszkać bezpiecznie w swojej ziemi."
"Kpł26,6": "Udzielę ziemi pokoju, położycie się i nikt was nie będzie straszył. Usunę z ziemi groźne zwierzę i miecz nie przejdzie przez waszą ziemię."
"Kpł26,7": "Będziecie ścigać waszych wrogów i upadną przed wami od miecza."
"Kpł26,8": "Pięciu z was będzie ścigać stu, a stu z was będzie ścigać dziesięć tysięcy. I wasi wrogowie padną przed wami od miecza."
"Kpł26,9": "Zwrócę się bowiem ku wam i rozplenię was, rozmnożę was i utwierdzę moje przymierze z wami."
"Kpł26,10": "I będziecie jedli zboże z poprzednich zbiorów, potem wyniesiecie stare, gdy nastaną nowe."
"Kpł26,11": "Umieszczę też mój przybytek wśród was i moja dusza nie obrzydzi was sobie."
"Kpł26,12": "I będę przechadzał się wśród was, i będę waszym Bogiem, a wy będziecie moim ludem."
"Kpł26,13": "Ja jestem PAN, wasz Bóg, który wyprowadził was z ziemi Egiptu, abyście już nie byli ich niewolnikami; i połamałem więzy waszego jarzma, abyście chodzili wyprostowani."
"Kpł26,14": "Jeśli jednak nie posłuchacie mnie i nie wykonacie wszystkich tych przykazań;"
"Kpł26,15": "I jeśli wzgardzicie moimi ustawami, i wasza dusza będzie się brzydzić moimi sądami, tak że nie wykonacie wszystkich moich przykazań i złamiecie moje przymierze;"
"Kpł26,16": "To i ja z wami tak postąpię: Dotknę was przerażeniem, wycieńczeniem i gorączką, które wyniszczą wam oczy i napełnią wasze dusze boleścią. Na próżno będziecie siać wasze ziarno, bo zjedzą je wasi wrogowie;"
"Kpł26,17": "I zwrócę moje oblicze przeciwko wam, i zostaniecie pobici przez waszych wrogów. Ci, którzy was nienawidzą, będą panować nad wami i będziecie uciekali, choć nikt was nie będzie ścigać."
"Kpł26,18": "A jeśli mimo to nie posłuchacie mnie, będę karał was siedem razy więcej za wasze grzechy;"
"Kpł26,19": "Złamię pychę waszej potęgi i niebo nad wami uczynię jak z żelaza, a waszą ziemię jak z miedzi;"
"Kpł26,20": "I wasza praca będzie szła na próżno, bo wasza ziemia nie wyda swego plonu, a drzewa ziemi nie wydadzą swego owocu."
"Kpł26,21": "A jeśli będziecie postępować na przekór mnie i nie zechcecie mnie słuchać, to przydam wam siedem razy więcej plag za wasze grzechy."
"Kpł26,22": "Ześlę też na was dzikie zwierzęta, które was osierocą, wyniszczą wasze bydło i zmniejszą waszą liczbę, tak że opustoszeją wasze drogi."
"Kpł26,23": "A jeśli przez to nie poprawicie się, ale będziecie postępować na przekór mnie;"
"Kpł26,24": "To i ja postąpię na przekór wam i będę was karał siedmiokrotnie za wasze grzechy;"
"Kpł26,25": "I sprowadzę na was miecz, który pomści złamane przymierze; gdy zbierzecie się w swych miastach, wtedy ześlę zarazę pomiędzy was i będziecie wydani w ręce wroga."
"Kpł26,26": "A gdy złamię podporę waszego chleba, dziesięć kobiet będzie piec wasz chleb w jednym piecu i będą wam wydzielać wasz chleb na wagę; będziecie jeść, lecz się nie nasycicie."
"Kpł26,27": "A jeśli mimo to nie posłuchacie mnie, ale będziecie postępować na przekór mnie;"
"Kpł26,28": "To ja też postąpię na przekór wam z gniewem; też będę was karać siedmiokrotnie za wasze grzechy."
"Kpł26,29": "I będziecie jeść ciało waszych synów i ciało waszych córek."
"Kpł26,30": "Zniszczę wasze wyżyny, zburzę wasze posągi i rzucę wasze szczątki na szczątki waszych bożków, a moja dusza będzie się wami brzydzić."
"Kpł26,31": "I zamienię wasze miasta w ruiny, i zburzę wasze świątynie, i więcej nie przyjmę waszych wdzięcznych wonności."
"Kpł26,32": "I spustoszę ziemię tak, że zdumieją się nad nią wasi wrogowie, którzy w niej mieszkają."
"Kpł26,33": "A was rozproszę między narodami i dobędę miecz za wami; wasza ziemia będzie spustoszona i wasze miasta zburzone."
"Kpł26,34": "Wtedy ziemia ucieszy się swoimi szabatami przez wszystkie dni swojego spustoszenia, a wy będziecie w ziemi waszych wrogów. Wtedy ziemia odpocznie i ucieszy się swoimi szabatami."
"Kpł26,35": "Przez wszystkie dni swojego spustoszenia będzie odpoczywać, gdyż nie odpoczywała w czasie waszych szabatów, kiedy w niej mieszkaliście."
"Kpł26,36": "A tym, którzy z was pozostaną, ześlę do ich serc lękliwość w ziemiach ich wrogów, tak że będzie ich ścigać szelest opadającego liścia i będą uciekać jak przed mieczem, i będą padać, chociaż nikt nie będzie ich ścigać."
"Kpł26,37": "I padną jeden na drugiego jakby od miecza, choć nikt ich nie będzie ścigać. Nie będziecie mogli się ostać przed waszymi wrogami."
"Kpł26,38": "Zginiecie wśród narodów i pożre was ziemia waszych wrogów."
"Kpł26,39": "A ci z was, którzy zostaną, zgniją z powodu swojej nieprawości w ziemi swoich wrogów; także z powodu nieprawości swoich ojców zgniją wraz z nimi."
"Kpł26,40": "Ale jeśli wyznają swoją nieprawość i nieprawość swoich ojców oraz przewinienie, którymi wystąpili przeciwko mnie, oraz to, że postępowali na przekór mnie;"
"Kpł26,41": "I że ja postępowałem na przekór im, i wprowadziłem ich do ziemi ich wrogów; jeśli wtedy ukorzą się ich nieobrzezane serca i będą znosić karę za swoje nieprawości;"
"Kpł26,42": "Wtedy wspomnę na moje przymierze z Jakubem i na moje przymierze z Izaakiem, wspomnę też na moje przymierze z Abrahamem, wspomnę i na tę ziemię."
"Kpł26,43": "A ziemia będzie przez nich opuszczona i ucieszy się swoimi szabatami, gdy będzie spustoszona z ich powodu. Będą cierpliwie nosić karę za swoją nieprawość, ponieważ wzgardzili moimi sądami i ich dusza obrzydziła sobie moje ustawy."
"Kpł26,44": "Lecz mimo tego wszystkiego, gdy będą w ziemi swoich wrogów, nie odrzucę ich ani nie obrzydzę ich sobie tak, by ich wytępić i złamać moje przymierze z nimi, gdyż ja jestem PAN, ich Bóg."
"Kpł26,45": "Ale dla nich wspomnę na przymierze ich przodków, których wyprowadziłem z ziemi Egiptu na oczach pogan, aby być ich Bogiem. Ja jestem PAN."
"Kpł26,46": "To są ustawy, sądy i prawa, które ustanowił PAN między sobą a synami Izraela na górze Synaj za pośrednictwem Mojżesza."
