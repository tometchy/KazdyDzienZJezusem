"Kpł20,1": "Potem PAN powiedział do Mojżesza:"
"Kpł20,2": "Powiedz synom Izraela: Ktokolwiek z synów Izraela albo z przybyszów mieszkających w Izraelu złoży Molochowi w ofierze kogoś ze swego potomstwa, poniesie śmierć. Lud tej ziemi go ukamienuje."
"Kpł20,3": "I ja zwrócę moje oblicze przeciwko temu człowiekowi i wyłączę go spośród jego ludu, dlatego że złożył ofiarę Molochowi ze swego potomstwa, by zanieczyścić moją świątynię i zbezcześcić moje święte imię."
"Kpł20,4": "A jeśli lud tej ziemi zasłoni swe oczy przed takim człowiekiem, który złożył Molochowi ofiarę ze swego potomstwa, i nie zabije go;"
"Kpł20,5": "To zwrócę swoje oblicze przeciw temu człowiekowi i przeciw jego domowi i wyłączę go oraz wszystkich, którzy cudzołożyli za jego przykładem, by uprawiać nierząd z Molochem, spośród ich ludu."
"Kpł20,6": "Przeciwko człowiekowi, który zwróci się do czarowników i wróżbitów, by cudzołożyć za ich przykładem, zwrócę swoje oblicze i wyłączę go spośród jego ludu."
"Kpł20,7": "Uświęcajcie się więc i bądźcie święci, bo ja jestem PAN, wasz Bóg."
"Kpł20,8": "Będziecie przestrzegać moich ustaw i wypełniać je. Ja jestem PAN, który was uświęca."
"Kpł20,9": "Ktokolwiek bowiem złorzeczy swemu ojcu albo swej matce, poniesie śmierć. Złorzeczył swemu ojcu i swej matce, więc jego krew spadnie na niego."
"Kpł20,10": "Mężczyzna, który dopuści się cudzołóstwa z czyjąś żoną, ponieważ cudzołożył z żoną swego bliźniego, poniesie śmierć, zarówno cudzołożnik, jak i cudzołożnica."
"Kpł20,11": "Mężczyzna, który położy się z żoną swego ojca, odsłonił nagość swego ojca: oboje poniosą śmierć, ich krew spadnie na nich."
"Kpł20,12": "Jeśli mężczyzna położy się ze swoją synową, oboje poniosą śmierć. Dopuścili się zboczenia, ich krew spadnie na nich."
"Kpł20,13": "Także jeśli mężczyzna obcuje z mężczyzną tak jak z kobietą, to obaj popełnili obrzydliwość. Poniosą śmierć, ich krew spadnie na nich."
"Kpł20,14": "Jeśli mężczyzna pojmie za żonę kobietę i jej matkę, to jest to niegodziwość. W ogniu spalą i jego, i je, aby nie było tej niegodziwości wśród was."
"Kpł20,15": "Także mężczyzna, jeśli się położy ze zwierzęciem, poniesie śmierć. Zwierzę też zabijecie."
"Kpł20,16": "Jeśli kobieta zbliża się do jakiegoś zwierzęcia, aby się z nim położyć, zabijesz kobietę i zwierzę. Poniosą śmierć, ich krew będzie na nich."
"Kpł20,17": "Jeśli mężczyzna pojmie swoją siostrę, córkę swego ojca albo córkę swej matki i zobaczy jej nagość, i ona zobaczy jego nagość, to jest to hańba. Będą wytraceni na oczach swego ludu. Odsłonił nagość swej siostry, obciążył się swoją nieprawością."
"Kpł20,18": "A jeśli mężczyzna położy się z kobietą w czasie jej słabości i odkryje jej nagość, i obnaży jej źródło, a ona też odsłoni źródło swojej krwi, to oboje zostaną wykluczeni spośród swego ludu."
"Kpł20,19": "Nie będziesz odsłaniał nagości siostry swej matki ani siostry swego ojca, bo kto obnaża swoją krewną, obciąża się swoją nieprawością."
"Kpł20,20": "Jeśli mężczyzna kładzie się z żoną swego stryja, odsłania nagość swego stryja. Obciążą się swoim grzechem, umrą bez dzieci."
"Kpł20,21": "Także jeśli mężczyzna pojmie żonę swego brata, to jest to nieczystość. Odsłania nagość swego brata, będą bezdzietni."
"Kpł20,22": "Przestrzegajcie więc wszystkich moich ustaw i wszystkich moich praw i wypełniajcie je, aby was nie wyrzuciła ziemia, do której was wprowadzę, abyście w niej mieszkali."
"Kpł20,23": "A nie postępujcie według obyczajów tego narodu, który wypędzam przed wami. To wszystko bowiem czynili i obrzydziłem ich sobie."
"Kpł20,24": "Wam zaś powiedziałem: Wy posiądziecie ich ziemię i dam ją wam jako posiadłość – ziemię opływającą mlekiem i miodem. Ja jestem PAN, wasz Bóg, który oddzielił was od innych narodów."
"Kpł20,25": "Będziecie więc rozróżniać między zwierzęciem czystym a nieczystym i między ptakiem nieczystym a czystym. Nie kalajcie waszych dusz przez zwierzęta i ptactwo, i wszystko, co pełza po ziemi, co oddzieliłem od was jako nieczyste."
"Kpł20,26": "I będziecie dla mnie święci, bo ja, PAN, jestem święty i oddzieliłem was od innych narodów, abyście byli moimi."
"Kpł20,27": "Mężczyzna lub kobieta, w których będzie duch czarownika albo wróżbity, poniosą śmierć: będą ukamienowani, ich krew spadnie na nich."
