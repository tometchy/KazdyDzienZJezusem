"Kpł2,1": "Gdy ktoś zechce złożyć PANU ofiarę pokarmową, niech jego ofiara będzie z mąki pszennej. Niech poleje ją oliwą i położy na niej kadzidła."
"Kpł2,2": "I przyniesie ją do synów Aarona, kapłanów, a kapłan weźmie stamtąd pełną garść tej mąki pszennej wraz z oliwą i całym kadzidłem i spali to na ołtarzu jako pamiątkę. To jest ofiara ogniowa, miła woń dla PANA."
"Kpł2,3": "To zaś, co zostanie z tej ofiary pokarmowej, będzie dla Aarona i jego synów. Jest to najświętsza część z ofiar ogniowych dla PANA."
"Kpł2,4": "A jeśli będziesz składał ofiarę pokarmową upieczoną w piecu, niech to będą przaśne placki z mąki pszennej zmieszane z oliwą albo przaśne podpłomyki skropione oliwą."
"Kpł2,5": "Jeśli zaś będziesz składał ofiarę pokarmową smażoną na patelni, niech będzie ona z mąki pszennej niezakwaszonej, zmieszanej z oliwą."
"Kpł2,6": "Połamiesz ją na kawałki i polejesz oliwą. To jest ofiara pokarmowa."
"Kpł2,7": "A jeśli będziesz składał ofiarę pokarmową gotowaną w rondlu, niech ona będzie z mąki pszennej z oliwą."
"Kpł2,8": "I przyniesiesz PANU ofiarę pokarmową tak przyrządzoną. Oddasz ją kapłanowi, a on odniesie ją do ołtarza."
"Kpł2,9": "I kapłan weźmie z tej ofiary pokarmowej część na pamiątkę i spali na ołtarzu. To jest ofiara ogniowa, miła woń dla PANA."
"Kpł2,10": "To zaś, co pozostanie z ofiary pokarmowej, będzie należeć do Aarona i jego synów. Jest to najświętsza część z ofiar ogniowych dla PANA."
"Kpł2,11": "Żadna ofiara pokarmowa, jaką będziecie składać PANU, nie będzie przygotowywana z zakwasem, bo żadnego zakwasu ani żadnego miodu nie będziecie spalać na ofiarę ogniową dla PANA."
"Kpł2,12": "Możecie je składać PANU jako ofiarę pierwocin, ale nie będziecie ich kłaść na ołtarzu na miłą woń."
"Kpł2,13": "Każdą z ofiar pokarmowych posolisz i nie pozbawisz soli przymierza twego Boga swej ofiary pokarmowej. Przy każdej twojej ofierze złożysz sól."
"Kpł2,14": "A jeśli będziesz składał PANU ofiarę pokarmową z pierwocin, to złożysz świeże kłosy prażone na ogniu, zboże wykruszone ze świeżych kłosów jako ofiarę pokarmową z twoich pierwszych plonów;"
"Kpł2,15": "Nalejesz na nią oliwy i położysz na nią kadzidła. To jest ofiara pokarmowa."
"Kpł2,16": "Wtedy kapłan spali na pamiątkę trochę jej wykruszonego zboża i oliwy wraz z całym jej kadzidłem. To jest ofiara ogniowa dla PANA."
