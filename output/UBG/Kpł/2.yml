"Kpł2,1":
  text: "Gdy ktoś zechce złożyć PANU ofiarę pokarmową, niech jego ofiara będzie z mąki pszennej. Niech poleje ją oliwą i położy na niej kadzidła."
  tags: []
"Kpł2,2":
  text: "I przyniesie ją do synów Aarona, kapłanów, a kapłan weźmie stamtąd pełną garść tej mąki pszennej wraz z oliwą i całym kadzidłem i spali to na ołtarzu jako pamiątkę. To jest ofiara ogniowa, miła woń dla PANA."
  tags: []
"Kpł2,3":
  text: "To zaś, co zostanie z tej ofiary pokarmowej, będzie dla Aarona i jego synów. Jest to najświętsza część z ofiar ogniowych dla PANA."
  tags: []
"Kpł2,4":
  text: "A jeśli będziesz składał ofiarę pokarmową upieczoną w piecu, niech to będą przaśne placki z mąki pszennej zmieszane z oliwą albo przaśne podpłomyki skropione oliwą."
  tags: []
"Kpł2,5":
  text: "Jeśli zaś będziesz składał ofiarę pokarmową smażoną na patelni, niech będzie ona z mąki pszennej niezakwaszonej, zmieszanej z oliwą."
  tags: []
"Kpł2,6":
  text: "Połamiesz ją na kawałki i polejesz oliwą. To jest ofiara pokarmowa."
  tags: []
"Kpł2,7":
  text: "A jeśli będziesz składał ofiarę pokarmową gotowaną w rondlu, niech ona będzie z mąki pszennej z oliwą."
  tags: []
"Kpł2,8":
  text: "I przyniesiesz PANU ofiarę pokarmową tak przyrządzoną. Oddasz ją kapłanowi, a on odniesie ją do ołtarza."
  tags: []
"Kpł2,9":
  text: "I kapłan weźmie z tej ofiary pokarmowej część na pamiątkę i spali na ołtarzu. To jest ofiara ogniowa, miła woń dla PANA."
  tags: []
"Kpł2,10":
  text: "To zaś, co pozostanie z ofiary pokarmowej, będzie należeć do Aarona i jego synów. Jest to najświętsza część z ofiar ogniowych dla PANA."
  tags: []
"Kpł2,11":
  text: "Żadna ofiara pokarmowa, jaką będziecie składać PANU, nie będzie przygotowywana z zakwasem, bo żadnego zakwasu ani żadnego miodu nie będziecie spalać na ofiarę ogniową dla PANA."
  tags: []
"Kpł2,12":
  text: "Możecie je składać PANU jako ofiarę pierwocin, ale nie będziecie ich kłaść na ołtarzu na miłą woń."
  tags: []
"Kpł2,13":
  text: "Każdą z ofiar pokarmowych posolisz i nie pozbawisz soli przymierza twego Boga swej ofiary pokarmowej. Przy każdej twojej ofierze złożysz sól."
  tags: []
"Kpł2,14":
  text: "A jeśli będziesz składał PANU ofiarę pokarmową z pierwocin, to złożysz świeże kłosy prażone na ogniu, zboże wykruszone ze świeżych kłosów jako ofiarę pokarmową z twoich pierwszych plonów;"
  tags: []
"Kpł2,15":
  text: "Nalejesz na nią oliwy i położysz na nią kadzidła. To jest ofiara pokarmowa."
  tags: []
"Kpł2,16":
  text: "Wtedy kapłan spali na pamiątkę trochę jej wykruszonego zboża i oliwy wraz z całym jej kadzidłem. To jest ofiara ogniowa dla PANA."
  tags: []
