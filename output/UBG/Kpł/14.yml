"Kpł14,1": "Potem PAN powiedział do Mojżesza:"
"Kpł14,2": "Takie będzie prawo dotyczące trędowatego w dniu jego oczyszczenia: będzie przyprowadzony do kapłana."
"Kpł14,3": "A kapłan wyjdzie poza obóz. Jeśli kapłan zobaczy, że plaga trądu została uleczona na trędowatym;"
"Kpł14,4": "To kapłan każe, by wziąć dla oczyszczającego się dwa żywe i czyste ptaki, drewno cedrowe, karmazyn i hizop."
"Kpł14,5": "I kapłan każe zabić jednego ptaka nad naczyniem glinianym, nad wodą źródlaną."
"Kpł14,6": "Następnie weźmie żywego ptaka, drewno cedrowe, karmazyn i hizop i umoczy to wszystko z żywym ptakiem we krwi ptaka zabitego nad źródlaną wodą."
"Kpł14,7": "I pokropi siedem razy oczyszczającego się od trądu, i uzna go za czystego, a żywego ptaka wypuści na otwarte pole."
"Kpł14,8": "Ten, który się poddaje oczyszczeniu, upierze swoje szaty, ogoli wszystkie swoje włosy, umyje się wodą i będzie czysty. Potem wejdzie do obozu i będzie mieszkał przez siedem dni poza swoim namiotem."
"Kpł14,9": "A siódmego dnia ogoli wszystkie swoje włosy, głowę, brodę i brwi nad swoimi oczami i ogoli wszystkie inne włosy. Potem wypierze swoje szaty i obmyje swoje ciało w wodzie, i będzie czysty."
"Kpł14,10": "Ósmego dnia weźmie dwa baranki bez skazy i jedną owcę jednoroczną bez skazy, trzy dziesiąte efy mąki pszennej zmieszanej z oliwą na ofiarę pokarmową i jeden log oliwy."
"Kpł14,11": "A kapłan dokonujący oczyszczenia postawi człowieka, który ma być oczyszczony, oraz to wszystko przed PANEM, u wejścia do Namiotu Zgromadzenia."
"Kpł14,12": "Potem kapłan weźmie jednego baranka i złoży go w ofierze za przewinienie wraz z logiem oliwy, i będzie to kołysał na ofiarę kołysania przed PANEM."
"Kpł14,13": "Potem zabije tego baranka na miejscu, gdzie się zabija ofiarę za grzech i ofiarę całopalną, na miejscu świętym. Zarówno bowiem ofiara za grzech, jak i ofiara za przewinienie należą do kapłana. Jest to rzecz najświętsza."
"Kpł14,14": "Następnie kapłan weźmie nieco krwi z ofiary za przewinienie i pomaże nią koniuszek prawego ucha oczyszczającego się, kciuk jego prawej ręki i wielki palec jego prawej nogi."
"Kpł14,15": "Kapłan weźmie też nieco z logu oliwy i wyleje na swoją lewą dłoń;"
"Kpł14,16": "I umoczy swój prawy palec w oliwie, która jest na jego lewej dłoni, i tym palcem pokropi oliwą siedem razy przed PANEM."
"Kpł14,17": "A z reszty oliwy, która jest na jego dłoni, kapłan pomaże koniuszek prawego ucha oczyszczającego się, kciuk jego prawej ręki i wielki palec jego prawej nogi nad miejscem pomazanym krwią ofiary za przewinienie."
"Kpł14,18": "A resztę oliwy, która jest na dłoni kapłana, wyleje na głowę oczyszczającego się. Tak kapłan dokona za niego przebłagania przed PANEM."
"Kpł14,19": "Kapłan złoży także ofiarę za grzech i dokona przebłagania za oczyszczającego się ze swojej nieczystości, po czym zabije ofiarę całopalną."
"Kpł14,20": "I kapłan złoży na ołtarzu ofiarę całopalną i ofiarę pokarmową. Tak kapłan dokona za niego przebłagania i będzie on czysty."
"Kpł14,21": "Jeśli jednak jest on tak ubogi, że nie stać go na to, wtedy weźmie jednego baranka na ofiarę za przewinienie, na kołysanie, by dokonano za niego przebłagania, i jedną dziesiątą efy mąki pszennej zmieszanej z oliwą na ofiarę pokarmową oraz log oliwy;"
"Kpł14,22": "I dwie synogarlice albo dwa młode gołębie, na co go stać; jeden będzie na ofiarę za grzech, a drugi na ofiarę całopalną;"
"Kpł14,23": "I przyniesie je ósmego dnia dla swego oczyszczenia do kapłana, przed wejście do Namiotu Zgromadzenia przed PANA."
"Kpł14,24": "Kapłan weźmie baranka na ofiarę za przewinienie oraz log oliwy i kapłan będzie to kołysał na ofiarę kołysania przed PANEM."
"Kpł14,25": "Potem zabije baranka na ofiarę za przewinienie i kapłan weźmie nieco krwi ofiary za przewinienie, i pomaże koniuszek prawego ucha oczyszczającego się, kciuk jego prawej ręki i wielki palec jego prawej nogi."
"Kpł14,26": "Kapłan naleje także oliwy na swoją lewą dłoń."
"Kpł14,27": "I oliwą, która jest na jego lewej dłoni, kapłan będzie kropić siedem razy swoim prawym palcem przed PANEM."
"Kpł14,28": "Kapłan też pomaże tą oliwą, która jest na jego dłoni, koniuszek prawego ucha oczyszczającego się, kciuk jego prawej ręki i wielki palec jego prawej nogi nad miejscem pomazanym krwią ofiary za przewinienie."
"Kpł14,29": "A resztą oliwy, która jest na dłoni kapłana, pomaże głowę oczyszczającego się, aby dokonać za niego przebłagania przed PANEM."
"Kpł14,30": "Potem złoży jedną synogarlicę albo jednego młodego gołębia, na co go było stać."
"Kpł14,31": "Z tego, na co go stać, jedno będzie na ofiarę za grzech, a drugie na ofiarę całopalną razem z ofiarą pokarmową. I tak kapłan dokona przebłagania za oczyszczającego się przed PANEM."
"Kpł14,32": "To jest prawo dotyczące tego, na którym będzie plaga trądu, a którego nie stać na ofiarę za swoje oczyszczenie."
"Kpł14,33": "Potem PAN powiedział do Mojżesza i Aarona:"
"Kpł14,34": "Gdy wejdziecie do ziemi Kanaan, którą daję wam w posiadanie, a ja dopuszczę plagę trądu na jakimś domu z waszej posiadłości;"
"Kpł14,35": "To właściciel domu przyjdzie i powie kapłanowi: Zdaje mi się, jakby plaga trądu jest w moim domu."
"Kpł14,36": "Wówczas kapłan każe opróżnić dom, zanim sam wejdzie, aby obejrzeć tę plagę, żeby się nie zanieczyściło to wszystko, co jest w domu. Potem kapłan wejdzie, aby obejrzeć ten dom."
"Kpł14,37": "I obejrzy tę plagę. Jeśli zobaczy na ścianach domu, że plaga występuje jak dołki zielonkawe lub czerwonawe, które wydają się być głębsze niż ściana;"
"Kpł14,38": "Wtedy kapłan wyjdzie przed drzwi tego domu i zamknie ten dom na siedem dni."
"Kpł14,39": "Siódmego dnia kapłan wróci i obejrzy. Jeśli plaga rozszerzyła się na ścianach tego domu;"
"Kpł14,40": "Kapłan każe wyrwać te kamienie, na których jest plaga, i wyrzucić je poza miasto na miejsce nieczyste;"
"Kpł14,41": "A dom każe oskrobać wewnątrz dokoła; i wysypią proch, który oskrobali, poza miasto na miejsce nieczyste;"
"Kpł14,42": "Potem wezmą inne kamienie i wstawią je na miejsce tamtych kamieni; wezmą też inny tynk i otynkują dom."
"Kpł14,43": "A jeśli ta plaga się odnowi i rozszerzy się w domu po wyrzuceniu kamienia, po oskrobaniu domu i po jego otynkowaniu;"
"Kpł14,44": "Wtedy wejdzie kapłan i obejrzy. Jeśli zobaczy, że plaga się rozszerzyła w domu, jest to złośliwy trąd w tym domu. Jest on nieczysty."
"Kpł14,45": "Potem zburzy ten dom, jego kamienie, jego drewno i cały tynk tego domu, i wyniesie poza miasto na miejsce nieczyste."
"Kpł14,46": "A kto by wszedł do tego domu podczas jego zamknięcia, będzie nieczysty aż do wieczora."
"Kpł14,47": "Kto by spał w tym domu, wypierze swoje szaty, a kto by jadł w tym domu, wypierze swoje szaty."
"Kpł14,48": "Lecz jeśli kapłan wejdzie i zobaczy, że plaga nie szerzy się w domu po jego tynkowaniu, to kapłan uzna, że ten dom jest czysty, gdyż plaga została uleczona."
"Kpł14,49": "A weźmie na oczyszczenie tego domu dwa ptaki, drewno cedrowe, karmazyn i hizop;"
"Kpł14,50": "I zabije jednego ptaka nad glinianym naczyniem, nad wodą źródlaną;"
"Kpł14,51": "Potem weźmie drewno cedrowe, hizop, karmazyn oraz żywego ptaka i umoczy to wszystko we krwi zabitego ptaka i w źródlanej wodzie i pokropi ten dom siedem razy."
"Kpł14,52": "I tak oczyści ten dom krwią tego ptaka, źródlaną wodą, żywym ptakiem, drewnem cedrowym, hizopem i karmazynem."
"Kpł14,53": "Żywego zaś ptaka wypuści poza miasto na otwarte pole. Tak dokona przebłagania za ten dom i będzie on czysty."
"Kpł14,54": "Takie jest prawo dotyczące każdej plagi trądu i liszaju:"
"Kpł14,55": "Trądu na ubraniu i w domu;"
"Kpł14,56": "Nabrzmienia, wysypki i białej plamy;"
"Kpł14,57": "Aby pouczać, kiedy coś jest nieczyste, a kiedy czyste. To jest prawo dotyczące trądu."
