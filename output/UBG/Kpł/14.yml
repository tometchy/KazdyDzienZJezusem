"Kpł14,1":
  text: "Potem PAN powiedział do Mojżesza:"
  tags: []
"Kpł14,2":
  text: "Takie będzie prawo dotyczące trędowatego w dniu jego oczyszczenia: będzie przyprowadzony do kapłana."
  tags: []
"Kpł14,3":
  text: "A kapłan wyjdzie poza obóz. Jeśli kapłan zobaczy, że plaga trądu została uleczona na trędowatym;"
  tags: []
"Kpł14,4":
  text: "To kapłan każe, by wziąć dla oczyszczającego się dwa żywe i czyste ptaki, drewno cedrowe, karmazyn i hizop."
  tags: []
"Kpł14,5":
  text: "I kapłan każe zabić jednego ptaka nad naczyniem glinianym, nad wodą źródlaną."
  tags: []
"Kpł14,6":
  text: "Następnie weźmie żywego ptaka, drewno cedrowe, karmazyn i hizop i umoczy to wszystko z żywym ptakiem we krwi ptaka zabitego nad źródlaną wodą."
  tags: []
"Kpł14,7":
  text: "I pokropi siedem razy oczyszczającego się od trądu, i uzna go za czystego, a żywego ptaka wypuści na otwarte pole."
  tags: []
"Kpł14,8":
  text: "Ten, który się poddaje oczyszczeniu, upierze swoje szaty, ogoli wszystkie swoje włosy, umyje się wodą i będzie czysty. Potem wejdzie do obozu i będzie mieszkał przez siedem dni poza swoim namiotem."
  tags: []
"Kpł14,9":
  text: "A siódmego dnia ogoli wszystkie swoje włosy, głowę, brodę i brwi nad swoimi oczami i ogoli wszystkie inne włosy. Potem wypierze swoje szaty i obmyje swoje ciało w wodzie, i będzie czysty."
  tags: []
"Kpł14,10":
  text: "Ósmego dnia weźmie dwa baranki bez skazy i jedną owcę jednoroczną bez skazy, trzy dziesiąte efy mąki pszennej zmieszanej z oliwą na ofiarę pokarmową i jeden log oliwy."
  tags: []
"Kpł14,11":
  text: "A kapłan dokonujący oczyszczenia postawi człowieka, który ma być oczyszczony, oraz to wszystko przed PANEM, u wejścia do Namiotu Zgromadzenia."
  tags: []
"Kpł14,12":
  text: "Potem kapłan weźmie jednego baranka i złoży go w ofierze za przewinienie wraz z logiem oliwy, i będzie to kołysał na ofiarę kołysania przed PANEM."
  tags: []
"Kpł14,13":
  text: "Potem zabije tego baranka na miejscu, gdzie się zabija ofiarę za grzech i ofiarę całopalną, na miejscu świętym. Zarówno bowiem ofiara za grzech, jak i ofiara za przewinienie należą do kapłana. Jest to rzecz najświętsza."
  tags: []
"Kpł14,14":
  text: "Następnie kapłan weźmie nieco krwi z ofiary za przewinienie i pomaże nią koniuszek prawego ucha oczyszczającego się, kciuk jego prawej ręki i wielki palec jego prawej nogi."
  tags: []
"Kpł14,15":
  text: "Kapłan weźmie też nieco z logu oliwy i wyleje na swoją lewą dłoń;"
  tags: []
"Kpł14,16":
  text: "I umoczy swój prawy palec w oliwie, która jest na jego lewej dłoni, i tym palcem pokropi oliwą siedem razy przed PANEM."
  tags: []
"Kpł14,17":
  text: "A z reszty oliwy, która jest na jego dłoni, kapłan pomaże koniuszek prawego ucha oczyszczającego się, kciuk jego prawej ręki i wielki palec jego prawej nogi nad miejscem pomazanym krwią ofiary za przewinienie."
  tags: []
"Kpł14,18":
  text: "A resztę oliwy, która jest na dłoni kapłana, wyleje na głowę oczyszczającego się. Tak kapłan dokona za niego przebłagania przed PANEM."
  tags: []
"Kpł14,19":
  text: "Kapłan złoży także ofiarę za grzech i dokona przebłagania za oczyszczającego się ze swojej nieczystości, po czym zabije ofiarę całopalną."
  tags: []
"Kpł14,20":
  text: "I kapłan złoży na ołtarzu ofiarę całopalną i ofiarę pokarmową. Tak kapłan dokona za niego przebłagania i będzie on czysty."
  tags: []
"Kpł14,21":
  text: "Jeśli jednak jest on tak ubogi, że nie stać go na to, wtedy weźmie jednego baranka na ofiarę za przewinienie, na kołysanie, by dokonano za niego przebłagania, i jedną dziesiątą efy mąki pszennej zmieszanej z oliwą na ofiarę pokarmową oraz log oliwy;"
  tags: []
"Kpł14,22":
  text: "I dwie synogarlice albo dwa młode gołębie, na co go stać; jeden będzie na ofiarę za grzech, a drugi na ofiarę całopalną;"
  tags: []
"Kpł14,23":
  text: "I przyniesie je ósmego dnia dla swego oczyszczenia do kapłana, przed wejście do Namiotu Zgromadzenia przed PANA."
  tags: []
"Kpł14,24":
  text: "Kapłan weźmie baranka na ofiarę za przewinienie oraz log oliwy i kapłan będzie to kołysał na ofiarę kołysania przed PANEM."
  tags: []
"Kpł14,25":
  text: "Potem zabije baranka na ofiarę za przewinienie i kapłan weźmie nieco krwi ofiary za przewinienie, i pomaże koniuszek prawego ucha oczyszczającego się, kciuk jego prawej ręki i wielki palec jego prawej nogi."
  tags: []
"Kpł14,26":
  text: "Kapłan naleje także oliwy na swoją lewą dłoń."
  tags: []
"Kpł14,27":
  text: "I oliwą, która jest na jego lewej dłoni, kapłan będzie kropić siedem razy swoim prawym palcem przed PANEM."
  tags: []
"Kpł14,28":
  text: "Kapłan też pomaże tą oliwą, która jest na jego dłoni, koniuszek prawego ucha oczyszczającego się, kciuk jego prawej ręki i wielki palec jego prawej nogi nad miejscem pomazanym krwią ofiary za przewinienie."
  tags: []
"Kpł14,29":
  text: "A resztą oliwy, która jest na dłoni kapłana, pomaże głowę oczyszczającego się, aby dokonać za niego przebłagania przed PANEM."
  tags: []
"Kpł14,30":
  text: "Potem złoży jedną synogarlicę albo jednego młodego gołębia, na co go było stać."
  tags: []
"Kpł14,31":
  text: "Z tego, na co go stać, jedno będzie na ofiarę za grzech, a drugie na ofiarę całopalną razem z ofiarą pokarmową. I tak kapłan dokona przebłagania za oczyszczającego się przed PANEM."
  tags: []
"Kpł14,32":
  text: "To jest prawo dotyczące tego, na którym będzie plaga trądu, a którego nie stać na ofiarę za swoje oczyszczenie."
  tags: []
"Kpł14,33":
  text: "Potem PAN powiedział do Mojżesza i Aarona:"
  tags: []
"Kpł14,34":
  text: "Gdy wejdziecie do ziemi Kanaan, którą daję wam w posiadanie, a ja dopuszczę plagę trądu na jakimś domu z waszej posiadłości;"
  tags: []
"Kpł14,35":
  text: "To właściciel domu przyjdzie i powie kapłanowi: Zdaje mi się, jakby plaga trądu jest w moim domu."
  tags: []
"Kpł14,36":
  text: "Wówczas kapłan każe opróżnić dom, zanim sam wejdzie, aby obejrzeć tę plagę, żeby się nie zanieczyściło to wszystko, co jest w domu. Potem kapłan wejdzie, aby obejrzeć ten dom."
  tags: []
"Kpł14,37":
  text: "I obejrzy tę plagę. Jeśli zobaczy na ścianach domu, że plaga występuje jak dołki zielonkawe lub czerwonawe, które wydają się być głębsze niż ściana;"
  tags: []
"Kpł14,38":
  text: "Wtedy kapłan wyjdzie przed drzwi tego domu i zamknie ten dom na siedem dni."
  tags: []
"Kpł14,39":
  text: "Siódmego dnia kapłan wróci i obejrzy. Jeśli plaga rozszerzyła się na ścianach tego domu;"
  tags: []
"Kpł14,40":
  text: "Kapłan każe wyrwać te kamienie, na których jest plaga, i wyrzucić je poza miasto na miejsce nieczyste;"
  tags: []
"Kpł14,41":
  text: "A dom każe oskrobać wewnątrz dokoła; i wysypią proch, który oskrobali, poza miasto na miejsce nieczyste;"
  tags: []
"Kpł14,42":
  text: "Potem wezmą inne kamienie i wstawią je na miejsce tamtych kamieni; wezmą też inny tynk i otynkują dom."
  tags: []
"Kpł14,43":
  text: "A jeśli ta plaga się odnowi i rozszerzy się w domu po wyrzuceniu kamienia, po oskrobaniu domu i po jego otynkowaniu;"
  tags: []
"Kpł14,44":
  text: "Wtedy wejdzie kapłan i obejrzy. Jeśli zobaczy, że plaga się rozszerzyła w domu, jest to złośliwy trąd w tym domu. Jest on nieczysty."
  tags: []
"Kpł14,45":
  text: "Potem zburzy ten dom, jego kamienie, jego drewno i cały tynk tego domu, i wyniesie poza miasto na miejsce nieczyste."
  tags: []
"Kpł14,46":
  text: "A kto by wszedł do tego domu podczas jego zamknięcia, będzie nieczysty aż do wieczora."
  tags: []
"Kpł14,47":
  text: "Kto by spał w tym domu, wypierze swoje szaty, a kto by jadł w tym domu, wypierze swoje szaty."
  tags: []
"Kpł14,48":
  text: "Lecz jeśli kapłan wejdzie i zobaczy, że plaga nie szerzy się w domu po jego tynkowaniu, to kapłan uzna, że ten dom jest czysty, gdyż plaga została uleczona."
  tags: []
"Kpł14,49":
  text: "A weźmie na oczyszczenie tego domu dwa ptaki, drewno cedrowe, karmazyn i hizop;"
  tags: []
"Kpł14,50":
  text: "I zabije jednego ptaka nad glinianym naczyniem, nad wodą źródlaną;"
  tags: []
"Kpł14,51":
  text: "Potem weźmie drewno cedrowe, hizop, karmazyn oraz żywego ptaka i umoczy to wszystko we krwi zabitego ptaka i w źródlanej wodzie i pokropi ten dom siedem razy."
  tags: []
"Kpł14,52":
  text: "I tak oczyści ten dom krwią tego ptaka, źródlaną wodą, żywym ptakiem, drewnem cedrowym, hizopem i karmazynem."
  tags: []
"Kpł14,53":
  text: "Żywego zaś ptaka wypuści poza miasto na otwarte pole. Tak dokona przebłagania za ten dom i będzie on czysty."
  tags: []
"Kpł14,54":
  text: "Takie jest prawo dotyczące każdej plagi trądu i liszaju:"
  tags: []
"Kpł14,55":
  text: "Trądu na ubraniu i w domu;"
  tags: []
"Kpł14,56":
  text: "Nabrzmienia, wysypki i białej plamy;"
  tags: []
"Kpł14,57":
  text: "Aby pouczać, kiedy coś jest nieczyste, a kiedy czyste. To jest prawo dotyczące trądu."
  tags: []
