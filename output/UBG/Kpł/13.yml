"Kpł13,1": "PAN powiedział dalej do Mojżesza i Aarona:"
"Kpł13,2": "Gdyby człowiek miał na skórze swego ciała nabrzmienie, wysypkę lub białą plamę i będzie to wyglądało na skórze jego ciała jak plaga trądu, zostanie przyprowadzony do kapłana Aarona lub do któregoś z jego synów, kapłanów."
"Kpł13,3": "Wtedy kapłan obejrzy chore miejsce na skórze jego ciała. Jeśli włos w tym miejscu zbielał i to miejsce zdaje się być bardziej wklęsłe niż pozostała skóra ciała, to jest to plaga trądu. Gdy kapłan go obejrzy, uzna go za nieczystego."
"Kpł13,4": "A jeśli plama na skórze jego ciała jest biała i z wyglądu nie jest głębsza niż skóra, i włosy na niej nie zbielały, wtedy kapłan odosobni chorego na siedem dni."
"Kpł13,5": "Potem kapłan obejrzy go siódmego dnia. Jeśli wydaje mu się, że chore miejsce zatrzymało się i nie rozszerzyło na skórze, wtedy kapłan odosobni go na kolejne siedem dni."
"Kpł13,6": "I kapłan ponownie obejrzy go siódmego dnia. Jeśli chore miejsce przyciemniało i nie rozszerzyło się na skórze, wtedy kapłan uzna go za czystego. Jest to wysypka. Wypierze on swoje szaty i będzie czysty."
"Kpł13,7": "Jeśli jednak wysypka mocno się rozszerzyła na skórze po obejrzeniu przez kapłana w celu oczyszczenia, pokaże się znowu kapłanowi."
"Kpł13,8": "Jeśli kapłan zobaczy, że wysypka rozszerzyła się na skórze, uzna go za nieczystego. Jest to trąd."
"Kpł13,9": "Gdy plaga trądu pojawi się na człowieku, zostanie przyprowadzony do kapłana;"
"Kpł13,10": "I kapłan obejrzy go. A jeśli jest na skórze białe nabrzmienie, przez które włosy zbielały, i na tym nabrzmieniu jest żywe mięso;"
"Kpł13,11": "Jest to zastarzały trąd na skórze jego ciała; i kapłan uzna go za nieczystego, a nie odosobni go, gdyż jest nieczysty."
"Kpł13,12": "A jeśli trąd rozszerza się na skórze i pokryje całą skórę zarażonego od głowy aż do stóp, gdziekolwiek kapłan spojrzy;"
"Kpł13,13": "Wtedy kapłan obejrzy; a jeśli trąd pokrył całe jego ciało, uzna zarażonego za czystego. Cały zbielał, więc jest czysty."
"Kpł13,14": "Jednak w dniu, gdy ukaże się na nim żywe mięso, będzie nieczysty."
"Kpł13,15": "I kapłan obejrzy żywe mięso i uzna go za nieczystego. Żywe mięso bowiem jest nieczyste. Jest to trąd."
"Kpł13,16": "Jeśli jednak żywe mięso ustąpi i stanie się białe, wtedy przyjdzie do kapłana."
"Kpł13,17": "I kapłan obejrzy go. Jeśli chore miejsce zbielało, kapłan uzna zarażonego za czystego. Jest on czysty."
"Kpł13,18": "Jeśli zaś na skórze pojawił się wrzód, a potem się zagoił;"
"Kpł13,19": "A na miejscu tego wrzodu pojawi się białe nabrzmienie lub białoczerwonawa plama, wtedy zostanie pokazana kapłanowi."
"Kpł13,20": "I kapłan obejrzy ją, a jeśli z wyglądu jest głębsza niż skóra i włosy na niej zbielały, kapłan uzna go za nieczystego. Jest to plaga trądu, która rozwinęła się na wrzodzie."
"Kpł13,21": "Jeśli jednak kapłan zobaczy, że nie ma na niej białych włosów i że nie jest głębsza niż skóra, ale pociemniała, wtedy kapłan odosobni go na siedem dni."
"Kpł13,22": "A jeśli rozszerza się mocno na skórze, kapłan uzna go za nieczystego. Jest to plaga trądu."
"Kpł13,23": "Jeśli jednak ta biała plama pozostanie na swoim miejscu i nie rozszerzy się, jest to zapalenie wrzodu; i kapłan uzna go za czystego."
"Kpł13,24": "Jeśli ktoś ma na skórze oparzelinę i na żywym mięsie pojawi się plama białoczerwonawa lub biała;"
"Kpł13,25": "To kapłan obejrzy ją. Jeśli włos na plamie zbielał i z wyglądu jest ona głębsza niż skóra, jest to trąd, który rozwinął się na oparzelinie. Kapłan uzna go więc za nieczystego. Jest to plaga trądu."
"Kpł13,26": "A jeśli kapłan zobaczy, że na tej plamie nie ma białych włosów ani nie jest ona głębsza niż skóra, ale pociemniała, to kapłan odosobni go na siedem dni."
"Kpł13,27": "W siódmym dniu kapłan go obejrzy. Jeśli mocno rozszerzyła się na skórze, kapłan uzna go za nieczystego. Jest to plaga trądu."
"Kpł13,28": "A jeśli ta plama pozostanie na swoim miejscu, a nie rozszerzyła się na skórze, ale pociemniała, jest to nabrzmienie po oparzeniu; i kapłan uzna go za czystego. Jest to zapalenie po oparzeniu."
"Kpł13,29": "Jeśli na głowie lub brodzie mężczyzny albo kobiety pojawi się chore miejsce;"
"Kpł13,30": "To kapłan obejrzy to miejsce. Jeśli z wyglądu jest głębsze niż skóra i włos na niej jest żółty i cienki, wtedy kapłan uzna takiego za nieczystego. Jest to łuszczyca, trąd na głowie lub na brodzie."
"Kpł13,31": "Jeśli jednak kapłan obejrzy miejsce tego liszaju, a z wyglądu nie jest ono głębsze niż skóra i nie ma na nim czarnych włosów, to kapłan odosobni dotkniętego plagą liszaju na siedem dni."
"Kpł13,32": "W siódmym dniu kapłan obejrzy to miejsce. Jeśli liszaj nie rozszerzył się i nie ma na nim żółtych włosów, i liszaj z wyglądu nie jest głębszy niż skóra;"
"Kpł13,33": "To ten człowiek będzie ogolony, ale liszaju nie będzie golić; i kapłan odosobni dotkniętego liszajem na kolejne siedem dni."
"Kpł13,34": "Siódmego dnia kapłan obejrzy ten liszaj. Jeśli liszaj nie rozszerzył się na skórze i z wyglądu nie jest głębszy niż skóra, kapłan uzna go za czystego, a on wypierze swoje ubranie i będzie czysty."
"Kpł13,35": "A jeśli liszaj mocno się rozszerzył na skórze po jego oczyszczeniu;"
"Kpł13,36": "To kapłan obejrzy go. Jeśli liszaj rozszerza się na skórze, kapłan nie będzie już szukał żółtego włosa, jest on nieczysty."
"Kpł13,37": "Jeśli jednak wydaje mu się, że liszaj pozostał bez zmiany i wyrosły na nim czarne włosy, to liszaj został wyleczony, jest on czysty i kapłan uzna go za czystego."
"Kpł13,38": "Jeśli u mężczyzny lub kobiety ukażą się na skórze ciała białe plamy;"
"Kpł13,39": "To kapłan je obejrzy. Jeśli te białe plamy na skórze ich ciała są przyciemnione, jest to wyrzut, który się rozwinął na skórze; jest on czysty."
"Kpł13,40": "Także mężczyzna, któremu włosy wypadły z głowy, jest łysy, ale czysty."
"Kpł13,41": "A jeśli wypadły mu włosy z przodu głowy, to ma łyse czoło, ale jest czysty."
"Kpł13,42": "Jeśli jednak na łysinie albo na łysym czole pojawi się białoczerwonawa rana, jest to trąd, który się rozwinął na jego łysinie albo na łysym czole."
"Kpł13,43": "I kapłan go obejrzy. Jeśli nabrzmienie rany jest białoczerwonawe na jego łysinie albo na łysym czole, jak wygląda trąd na skórze ciała;"
"Kpł13,44": "To taki człowiek jest trędowaty, jest on nieczysty. I kapłan uzna go za całkowicie nieczystego, bo na jego głowie jest jego trąd."
"Kpł13,45": "Trędowaty zaś, który ma na sobie tę plagę, będzie miał rozdarte szaty, jego głowa będzie odkryta, zakryje sobie usta i będzie wołał: Nieczysty! Nieczysty!"
"Kpł13,46": "Przez wszystkie dni, póki jest na nim plaga, będzie skalany, bo jest nieczysty. Będzie mieszkał sam; jego mieszkanie będzie poza obozem."
"Kpł13,47": "Jeśli też na szacie będzie plaga trądu, na szacie wełnianej lub lnianej;"
"Kpł13,48": "Czy to na osnowie, czy na wątku z lnu lub wełny, czy też na skórze, czy na jakimkolwiek wyrobie skórzanym;"
"Kpł13,49": "A będzie to plaga zielonkawa albo czerwonawa na szacie lub na skórze, na osnowie lub na wątku, lub na jakimkolwiek przedmiocie skórzanym, jest to plaga trądu i będzie pokazana kapłanowi."
"Kpł13,50": "Kapłan obejrzy tę plagę i odosobni zarażoną rzecz na siedem dni."
"Kpł13,51": "W siódmym dniu obejrzy tę plagę. Jeśli plaga rozszerzyła się na szacie czy na osnowie albo wątku, na skórze lub na jakimś przedmiocie wykonanym ze skóry, jest to plaga trądu złośliwego, przedmiot jest nieczysty."
"Kpł13,52": "Spali więc tę szatę czy osnowę albo wątek, czy to z wełny, czy z lnu, czy z jakiegokolwiek przedmiotu skórzanego, na którym jest plaga. Jest to bowiem trąd złośliwy, będzie spalony w ogniu."
"Kpł13,53": "Jeśli jednak kapłan zobaczy, że ta plaga nie rozszerzyła się na szacie ani na osnowie, ani na wątku, ani na jakimkolwiek przedmiocie skórzanym;"
"Kpł13,54": "To kapłan rozkaże, aby wyprano to, na czym jest plaga, i odosobni to na kolejne siedem dni."
"Kpł13,55": "I kapłan obejrzy plagę po wypraniu. Jeśli ta plaga nie zmieniła swojej barwy, choćby plaga nie rozszerzyła się, to jest to rzecz nieczysta, spalisz ją w ogniu; rzecz jest przeżarta bądź z wierzchniej, bądź ze spodniej strony."
"Kpł13,56": "Jeśli jednak kapłan zobaczy, że po wypraniu plaga pociemniała, oderwie ją z szaty lub ze skóry czy z osnowy, czy z wątku."
"Kpł13,57": "A jeśli nadal będzie widoczna na szacie czy na osnowie lub na wątku, albo na jakimś przedmiocie skórzanym, jest to szerzący się trąd. Spalisz w ogniu to, na czym jest ta plaga."
"Kpł13,58": "Szatę zaś lub osnowę czy wątek albo każdy przedmiot skórzany, z którego po wypraniu odeszłaby plaga, wypierzesz powtórnie i będzie to czyste."
"Kpł13,59": "To jest prawo dotyczące plagi trądu na szacie wełnianej lub lnianej czy na osnowie, czy wątku albo na jakimkolwiek przedmiocie skórzanym, aby uznać je za czyste lub nieczyste."
