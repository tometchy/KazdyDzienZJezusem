"Kpł17,1": "Wtedy PAN powiedział do Mojżesza:"
"Kpł17,2": "Mów do Aarona i do jego synów, i do wszystkich synów Izraela i powiedz im: Oto co PAN nakazał:"
"Kpł17,3": "Ktokolwiek z domu Izraela zabije wołu, owcę albo kozę w obozie lub zabije je poza obozem;"
"Kpł17,4": "A nie przyprowadzi tego przed wejście do Namiotu Zgromadzenia, aby złożyć w ofierze PANU przed przybytkiem PANA, to będzie on winien krwi, bo przelał krew. Ten człowiek zostanie wykluczony spośród swego ludu."
"Kpł17,5": "Ma tak być, aby synowie Izraela przyprowadzili swoje ofiary, które dotychczas zabijali na polu, by przyprowadzili je do PANA przed wejście do Namiotu Zgromadzenia, do kapłana, i złożyli je jako ofiary pojednawcze PANU."
"Kpł17,6": "Kapłan pokropi krwią ołtarz PANA u wejścia do Namiotu Zgromadzenia, a tłuszcz spali jako miłą woń dla PANA."
"Kpł17,7": "I nie będą już więcej składać swoich ofiar demonom, z którymi uprawiali nierząd. To będzie dla nich wieczna ustawa przez wszystkie ich pokolenia."
"Kpł17,8": "Powiedz im jeszcze: Jeśli ktokolwiek z domu Izraela albo z przybyszów mieszkających wśród was będzie składał całopalenie lub inną ofiarę;"
"Kpł17,9": "A nie przyprowadzi jej przed wejście do Namiotu Zgromadzenia, aby ją złożyć PANU, to człowiek ten będzie wykluczony ze swego ludu."
"Kpł17,10": "A gdyby ktokolwiek z domu Izraela lub z przybyszów, którzy goszczą wśród was, spożywał jakąkolwiek krew, to zwrócę swoje oblicze przeciw człowiekowi, który spożywa krew, i wykluczę go spośród jego ludu."
"Kpł17,11": "Życie wszelkiego ciała bowiem jest we krwi. Ja dałem ją wam na ołtarz dla dokonywania przebłagania za wasze dusze, gdyż to krew dokonuje przebłagania za duszę."
"Kpł17,12": "Dlatego powiedziałem synom Izraela: Żadna dusza wśród was nie będzie spożywała krwi ani żaden przybysz, który gości wśród was, nie będzie spożywał krwi."
"Kpł17,13": "I ktokolwiek z synów Izraela lub z przybyszów, którzy goszczą wśród was, upoluje jakieś zwierzę lub ptaka, które wolno jeść, to wypuści jego krew i przykryje ją piaskiem."
"Kpł17,14": "Gdyż to jest życie wszelkiego ciała, krew stanowi jego życie. Dlatego powiedziałem synom Izraela: Krwi wszelkiego ciała spożywać nie będziecie, bo życiem wszelkiego ciała jest jego krew. Ktokolwiek ją spożywa, zostanie wytracony."
"Kpł17,15": "Każda dusza, która spożywa zwierzę padłe lub rozszarpane, czy to rodowity mieszkaniec, czy przybysz, wypierze swoje szaty i obmyje się w wodzie, i będzie nieczysta aż do wieczora. Potem będzie czysta."
"Kpł17,16": "Ale jeśli nie wypierze swoich szat ani nie obmyje swego ciała, obciąży się nieprawością."
