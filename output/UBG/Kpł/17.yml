"Kpł17,1":
  text: "Wtedy PAN powiedział do Mojżesza:"
  tags: []
"Kpł17,2":
  text: "Mów do Aarona i do jego synów, i do wszystkich synów Izraela i powiedz im: Oto co PAN nakazał:"
  tags: []
"Kpł17,3":
  text: "Ktokolwiek z domu Izraela zabije wołu, owcę albo kozę w obozie lub zabije je poza obozem;"
  tags: []
"Kpł17,4":
  text: "A nie przyprowadzi tego przed wejście do Namiotu Zgromadzenia, aby złożyć w ofierze PANU przed przybytkiem PANA, to będzie on winien krwi, bo przelał krew. Ten człowiek zostanie wykluczony spośród swego ludu."
  tags: []
"Kpł17,5":
  text: "Ma tak być, aby synowie Izraela przyprowadzili swoje ofiary, które dotychczas zabijali na polu, by przyprowadzili je do PANA przed wejście do Namiotu Zgromadzenia, do kapłana, i złożyli je jako ofiary pojednawcze PANU."
  tags: []
"Kpł17,6":
  text: "Kapłan pokropi krwią ołtarz PANA u wejścia do Namiotu Zgromadzenia, a tłuszcz spali jako miłą woń dla PANA."
  tags: []
"Kpł17,7":
  text: "I nie będą już więcej składać swoich ofiar demonom, z którymi uprawiali nierząd. To będzie dla nich wieczna ustawa przez wszystkie ich pokolenia."
  tags: []
"Kpł17,8":
  text: "Powiedz im jeszcze: Jeśli ktokolwiek z domu Izraela albo z przybyszów mieszkających wśród was będzie składał całopalenie lub inną ofiarę;"
  tags: []
"Kpł17,9":
  text: "A nie przyprowadzi jej przed wejście do Namiotu Zgromadzenia, aby ją złożyć PANU, to człowiek ten będzie wykluczony ze swego ludu."
  tags: []
"Kpł17,10":
  text: "A gdyby ktokolwiek z domu Izraela lub z przybyszów, którzy goszczą wśród was, spożywał jakąkolwiek krew, to zwrócę swoje oblicze przeciw człowiekowi, który spożywa krew, i wykluczę go spośród jego ludu."
  tags: []
"Kpł17,11":
  text: "Życie wszelkiego ciała bowiem jest we krwi. Ja dałem ją wam na ołtarz dla dokonywania przebłagania za wasze dusze, gdyż to krew dokonuje przebłagania za duszę."
  tags: []
"Kpł17,12":
  text: "Dlatego powiedziałem synom Izraela: Żadna dusza wśród was nie będzie spożywała krwi ani żaden przybysz, który gości wśród was, nie będzie spożywał krwi."
  tags: []
"Kpł17,13":
  text: "I ktokolwiek z synów Izraela lub z przybyszów, którzy goszczą wśród was, upoluje jakieś zwierzę lub ptaka, które wolno jeść, to wypuści jego krew i przykryje ją piaskiem."
  tags: []
"Kpł17,14":
  text: "Gdyż to jest życie wszelkiego ciała, krew stanowi jego życie. Dlatego powiedziałem synom Izraela: Krwi wszelkiego ciała spożywać nie będziecie, bo życiem wszelkiego ciała jest jego krew. Ktokolwiek ją spożywa, zostanie wytracony."
  tags: []
"Kpł17,15":
  text: "Każda dusza, która spożywa zwierzę padłe lub rozszarpane, czy to rodowity mieszkaniec, czy przybysz, wypierze swoje szaty i obmyje się w wodzie, i będzie nieczysta aż do wieczora. Potem będzie czysta."
  tags: []
"Kpł17,16":
  text: "Ale jeśli nie wypierze swoich szat ani nie obmyje swego ciała, obciąży się nieprawością."
  tags: []
