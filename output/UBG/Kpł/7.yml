"Kpł7,1":
  text: "Takie jest prawo ofiary za przewinienie: jest to rzecz najświętsza."
  tags: []
"Kpł7,2":
  text: "Na miejscu, gdzie zabijają ofiarę całopalną, zabiją ofiarę za przewinienie, a pokropią jej krwią z wierzchu dokoła ołtarz."
  tags: []
"Kpł7,3":
  text: "I kapłan złoży w ofierze cały jej tłuszcz, ogon i tłuszcz pokrywający wnętrzności;"
  tags: []
"Kpł7,4":
  text: "Obie nerki z tłuszczem, który jest na nich i na lędźwiach, i płat tłuszczu na wątrobie, który oddzieli wraz z nerkami."
  tags: []
"Kpł7,5":
  text: "I kapłan spali to na ołtarzu jako ofiarę ogniową dla PANA. To jest ofiara za przewinienie."
  tags: []
"Kpł7,6":
  text: "Każdy mężczyzna spośród kapłanów będzie z niej jeść, będzie spożywana na miejscu świętym. Jest to rzecz najświętsza."
  tags: []
"Kpł7,7":
  text: "Zarówno do ofiary za grzech, jak i do ofiary za przewinienie odnosi się jednakowe prawo: będą one należeć do tego kapłana, który dokonuje przebłagania."
  tags: []
"Kpł7,8":
  text: "Do kapłana, który składa czyjąś ofiarę całopalną, będzie należeć skóra tej ofiary, którą złożył."
  tags: []
"Kpł7,9":
  text: "Także każda ofiara pokarmowa upieczona w piecu i wszystko, co przyrządzone w rondlu albo na patelni, będzie należeć do kapłana, który je składa."
  tags: []
"Kpł7,10":
  text: "Lecz każda ofiara pokarmowa zmieszana z oliwą albo sucha będzie należeć do wszystkich synów Aarona, do każdego w równej części."
  tags: []
"Kpł7,11":
  text: "A takie jest prawo ofiary pojednawczej, którą będzie się składać PANU."
  tags: []
"Kpł7,12":
  text: "Jeśli ktoś składa ją jako ofiarę dziękczynną, złoży z ofiarą dziękczynną przaśne placki zmieszane z oliwą, przaśne podpłomyki pomazane oliwą i placki z mąki pszennej zmieszane z oliwą i smażone."
  tags: []
"Kpł7,13":
  text: "Oprócz tych placków złoży jako ofiarę chleb zakwaszony wraz z ofiarą dziękczynną ze swoich ofiar pojednawczych."
  tags: []
"Kpł7,14":
  text: "I z niego będzie składał PANU po jednym chlebie z każdej ofiary jako ofiarę wzniesienia. Będzie to należeć do kapłana, który kropi krwią ofiar pojednawczych."
  tags: []
"Kpł7,15":
  text: "Mięso z dziękczynnej ofiary pojednawczej należy spożyć w dniu składania jego ofiary; nic z niego nie zostawią do rana."
  tags: []
"Kpł7,16":
  text: "A jeśli jego ofiara jest darem ślubowanym lub dobrowolnym, należy ją spożyć w dniu jej złożenia; a to, co z niej zostanie, spożyją nazajutrz."
  tags: []
"Kpł7,17":
  text: "Lecz jeśli coś z mięsa tej ofiary zostanie do trzeciego dnia, będzie spalone w ogniu."
  tags: []
"Kpł7,18":
  text: "A jeśli ktoś zje mięso tej ofiary pojednawczej trzeciego dnia, nie zostanie przyjęta ani nie zostanie policzona temu, który ją złożył. Będzie to obrzydliwością, a kto ją spożyje, będzie obciążony nieprawością."
  tags: []
"Kpł7,19":
  text: "Mięso, które dotknie czegoś nieczystego, nie będzie spożywane, ale zostanie spalone w ogniu. Inne mięso zaś może jeść każdy, kto jest czysty."
  tags: []
"Kpł7,20":
  text: "A ktokolwiek spożyje mięso z ofiary pojednawczej, która należy do PANA, będąc nieczysty, to taki człowiek zostanie wykluczony ze swego ludu."
  tags: []
"Kpł7,21":
  text: "A kto dotknie czegoś nieczystego: nieczystości ludzkiej lub nieczystego zwierzęcia lub jakiejkolwiek nieczystej obrzydliwości, a spożyje mięso z ofiary pojednawczej, która należy do PANA, to taki człowiek zostanie wykluczony ze swego ludu."
  tags: []
"Kpł7,22":
  text: "PAN powiedział jeszcze do Mojżesza:"
  tags: []
"Kpł7,23":
  text: "Powiedz synom Izraela: Nie będziecie jedli żadnego tłuszczu wołu, owcy ani kozy;"
  tags: []
"Kpł7,24":
  text: "Tłuszcz zwierzęcia padłego lub tłuszcz rozszarpanego może być używany do wszelkich celów, ale spożywać go nie wolno."
  tags: []
"Kpł7,25":
  text: "Ktokolwiek bowiem spożyje tłuszcz zwierzęcia złożonego PANU jako ofiarę ogniową, ten zostanie wykluczony ze swego ludu."
  tags: []
"Kpł7,26":
  text: "Żadnej krwi nie będziecie jeść we wszystkich waszych mieszkaniach – ani z ptaków, ani ze zwierząt."
  tags: []
"Kpł7,27":
  text: "Każdy człowiek, który spożyje jakąkolwiek krew, zostanie wykluczony ze swego ludu."
  tags: []
"Kpł7,28":
  text: "PAN powiedział jeszcze do Mojżesza:"
  tags: []
"Kpł7,29":
  text: "Powiedz synom Izraela: Kto będzie składał PANU ofiarę pojednawczą, niech przyniesie PANU swoją ofiarę ze swoich ofiar pojednawczych."
  tags: []
"Kpł7,30":
  text: "Własnoręcznie przyniesie PANU ofiarę ogniową; przyniesie tłuszcz wraz z mostkiem, aby kołysać nim jako ofiarą kołysaną przed PANEM."
  tags: []
"Kpł7,31":
  text: "Potem kapłan spali tłuszcz na ołtarzu, a mostek będzie należał do Aarona i jego synów."
  tags: []
"Kpł7,32":
  text: "A prawą łopatkę oddacie kapłanowi jako ofiarę wzniesienia z waszych ofiar pojednawczych."
  tags: []
"Kpł7,33":
  text: "Kto spośród synów Aarona będzie składał krew ofiar pojednawczych i tłuszcz, weźmie jako swoją część prawą łopatkę."
  tags: []
"Kpł7,34":
  text: "Gdyż mostek kołysania i łopatkę wzniesienia wziąłem od synów Izraela z ich ofiar pojednawczych i dałem je kapłanowi Aaronowi oraz jego synom od synów Izraela na mocy wiecznej ustawy."
  tags: []
"Kpł7,35":
  text: "To jest część z ofiar ogniowych PANA z powodu namaszczenia Aarona i jego synów od dnia, kiedy przyprowadził ich, aby pełnili służbę kapłańską dla PANA;"
  tags: []
"Kpł7,36":
  text: "O którym PAN rozkazał, aby im dawano od synów Izraela w dniu, w którym ich namaścił, na mocy wiecznej ustawy dla ich pokoleń."
  tags: []
"Kpł7,37":
  text: "Takie jest prawo całopalenia, ofiary pokarmowej, ofiary za grzech, ofiary za przewinienie, ofiary poświęcenia i ofiary pojednawczej;"
  tags: []
"Kpł7,38":
  text: "Które PAN nadał Mojżeszowi na górze Synaj w dniu, kiedy nakazał synom Izraela, aby składali swoje ofiary PANU na pustyni Synaj."
  tags: []
