"Kpł3,1":
  text: "A jeśli ktoś będzie chciał złożyć ofiarę pojednawczą, a byłaby ze stada – czy to samca, czy samicę – niech złoży ją bez skazy przed PANEM."
  tags: []
"Kpł3,2":
  text: "I położy rękę na głowie swojej ofiary, i zabije ją przed wejściem do Namiotu Zgromadzenia. I synowie Aarona, kapłani, pokropią krwią z wierzchu dokoła ołtarz."
  tags: []
"Kpł3,3":
  text: "Potem z ofiary pojednawczej złoży PANU ofiarę ogniową: tłuszcz okrywający wnętrzności i cały tłuszcz, który jest na nich;"
  tags: []
"Kpł3,4":
  text: "Obie nerki z tłuszczem, który jest na nich i na lędźwiach, i płat tłuszczu na wątrobie oddzieli wraz z nerkami."
  tags: []
"Kpł3,5":
  text: "I synowie Aarona spalą to na ołtarzu razem z ofiarą całopalną, która jest na drwach leżących na ogniu. To jest ofiara ogniowa na miłą woń dla PANA."
  tags: []
"Kpł3,6":
  text: "Jeśli zaś jego ofiara na ofiarę pojednawczą dla PANA będzie z trzody, czy to samiec, czy samica, niech złoży ją bez skazy."
  tags: []
"Kpł3,7":
  text: "Jeśli składa owcę na swoją ofiarę, niech złoży ją przed PANEM."
  tags: []
"Kpł3,8":
  text: "I położy rękę na głowie swojej ofiary, i zabije ją przed Namiotem Zgromadzenia. I synowie Aarona pokropią jej krwią z wierzchu dokoła ołtarz."
  tags: []
"Kpł3,9":
  text: "I z ofiary pojednawczej złoży PANU ofiarę ogniową: jej tłuszcz, cały ogon, który odetnie przy samej kości ogonowej, tłuszcz okrywający wnętrzności oraz cały tłuszcz na wnętrznościach;"
  tags: []
"Kpł3,10":
  text: "Obie nerki z tłuszczem, który jest na nich i na lędźwiach, i płat tłuszczu na wątrobie, który oddzieli wraz z nerkami."
  tags: []
"Kpł3,11":
  text: "I kapłan spali to na ołtarzu. To jest pokarm ofiary ogniowej dla PANA."
  tags: []
"Kpł3,12":
  text: "Jeśli zaś jego ofiara będzie kozą, niech złoży ją przed PANEM."
  tags: []
"Kpł3,13":
  text: "Położy rękę na jej głowie i zabije ją przed Namiotem Zgromadzenia. I synowie Aarona pokropią jej krwią ołtarz dokoła."
  tags: []
"Kpł3,14":
  text: "I złoży z niej PANU swoją ofiarę na ofiarę ogniową: tłuszcz okrywający wnętrzności i cały tłuszcz na wnętrznościach;"
  tags: []
"Kpł3,15":
  text: "Obie nerki z tłuszczem, który jest na nich i na lędźwiach, i płat tłuszczu na wątrobie, który oddzieli wraz z nerkami."
  tags: []
"Kpł3,16":
  text: "I kapłan spali to na ołtarzu. To jest pokarm ofiary ogniowej na miłą woń. Wszelki bowiem tłuszcz należy do PANA."
  tags: []
"Kpł3,17":
  text: "To jest wieczna ustawa dla waszych pokoleń, we wszystkich waszych mieszkaniach: Nie będziecie jeść żadnego tłuszczu ani żadnej krwi."
  tags: []
