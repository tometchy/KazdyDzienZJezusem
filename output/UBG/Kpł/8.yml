"Kpł8,1":
  text: "Potem PAN powiedział do Mojżesza:"
  tags: []
"Kpł8,2":
  text: "Weź Aarona i z nim jego synów, ich szaty, oliwę do namaszczenia, cielca na ofiarę za grzech, dwa barany i kosz przaśnych chlebów;"
  tags: []
"Kpł8,3":
  text: "I zgromadź cały lud przy wejściu do Namiotu Zgromadzenia."
  tags: []
"Kpł8,4":
  text: "I Mojżesz zrobił tak, jak mu PAN rozkazał; i zgromadził się cały lud przy wejściu do Namiotu Zgromadzenia."
  tags: []
"Kpł8,5":
  text: "Wtedy Mojżesz powiedział do zgromadzenia: Oto co PAN rozkazał uczynić."
  tags: []
"Kpł8,6":
  text: "I kazał Mojżesz zbliżyć się Aaronowi i jego synom, i obmył ich wodą;"
  tags: []
"Kpł8,7":
  text: "Potem włożył tunikę na niego i przepasał go pasem, ubrał go w płaszcz, nałożył na niego efod i przepasał go pasem efodu, i przymocował go nim."
  tags: []
"Kpł8,8":
  text: "Włożył też na niego pektorał i do pektorału włożył Urim i Tummim."
  tags: []
"Kpł8,9":
  text: "Włożył także na jego głowę mitrę, a na mitrze z przodu umieścił złotą blaszkę, świętą koronę, jak PAN rozkazał Mojżeszowi."
  tags: []
"Kpł8,10":
  text: "Mojżesz wziął też oliwę do namaszczenia i namaścił przybytek oraz wszystkie rzeczy, które w nim były, i poświęcił je."
  tags: []
"Kpł8,11":
  text: "Potem pokropił nią ołtarz siedem razy i namaścił ołtarz wraz ze wszystkimi jego przyborami, również kadź i jej podstawę, aby je poświęcić."
  tags: []
"Kpł8,12":
  text: "Wylał także oliwę do namaszczenia na głowę Aarona i namaścił go, aby go poświęcić."
  tags: []
"Kpł8,13":
  text: "Potem Mojżesz kazał zbliżyć się synom Aarona, włożył na nich tuniki, przepasał ich pasami i włożył im na głowy mitry, jak PAN rozkazał Mojżeszowi."
  tags: []
"Kpł8,14":
  text: "Przyprowadził też cielca na ofiarę za grzech, a Aaron i jego synowie włożyli ręce na głowę cielca ofiary za grzech."
  tags: []
"Kpł8,15":
  text: "Następnie Mojżesz zabił go, wziął jego krew i pomazał palcem rogi ołtarza dokoła, i oczyścił ołtarz. Resztę zaś krwi wylał u podstawy ołtarza i poświęcił go dla dokonywania na nim przebłagania."
  tags: []
"Kpł8,16":
  text: "Potem wziął cały tłuszcz pokrywający wnętrzności, płat tłuszczu na wątrobie i obie nerki razem z ich tłuszczem i spalił to Mojżesz na ołtarzu."
  tags: []
"Kpł8,17":
  text: "A cielca, jego skórę, mięso i odchody spalił w ogniu poza obozem, tak jak PAN rozkazał Mojżeszowi."
  tags: []
"Kpł8,18":
  text: "Potem przyprowadził barana na całopalenie. I Aaron, i jego synowie włożyli ręce na głowę tego barana."
  tags: []
"Kpł8,19":
  text: "Mojżesz zabił go i pokropił jego krwią ołtarz dokoła."
  tags: []
"Kpł8,20":
  text: "Potem podzielił barana na części i spalił Mojżesz głowę, części i tłuszcz."
  tags: []
"Kpł8,21":
  text: "Wnętrzności zaś i nogi opłukał wodą; i Mojżesz spalił całego barana na ołtarzu. Jest to całopalenie na miłą woń, ofiara ogniowa dla PANA, jak PAN rozkazał Mojżeszowi."
  tags: []
"Kpł8,22":
  text: "Potem kazał przyprowadzić drugiego barana, barana poświęcenia. I Aaron, i jego synowie włożyli ręce na głowę tego barana."
  tags: []
"Kpł8,23":
  text: "I Mojżesz zabił go, wziął nieco z jego krwi i pomazał nią koniec prawego ucha Aarona, kciuk jego prawej ręki i wielki palec jego prawej nogi."
  tags: []
"Kpł8,24":
  text: "Kazał też zbliżyć się synom Aarona i pomazał Mojżesz tą krwią koniec ich prawego ucha, kciuki ich prawej ręki i wielkie palce ich prawej nogi. I Mojżesz pokropił krwią dokoła ołtarza."
  tags: []
"Kpł8,25":
  text: "Potem wziął tłuszcz, ogon, cały tłuszcz pokrywający wnętrzności, płat tłuszczu na wątrobie oraz obie nerki z ich tłuszczem i prawą łopatkę."
  tags: []
"Kpł8,26":
  text: "Także z kosza przaśnych chlebów, który był przed PANEM, wziął jeden przaśny placek, jeden placek chleba z oliwą oraz jeden podpłomyk i położył je na kawałki tłuszczu i na prawej łopatce."
  tags: []
"Kpł8,27":
  text: "I dał to wszystko do rąk Aarona i do rąk jego synów i kołysał to jako ofiarę kołysaną przed PANEM."
  tags: []
"Kpł8,28":
  text: "Następnie Mojżesz wziął to z ich rąk i spalił na ołtarzu na ofierze całopalnej. To była ofiara poświęcenia na miłą woń, ofiara ogniowa dla PANA."
  tags: []
"Kpł8,29":
  text: "Mojżesz wziął też mostek i kołysał go jako ofiarę kołysaną przed PANEM. Była to bowiem część Mojżesza z barana poświęcenia, jak mu PAN rozkazał."
  tags: []
"Kpł8,30":
  text: "Wziął też Mojżesz trochę oliwy do namaszczenia i nieco krwi z ołtarza, i pokropił nimi Aarona i jego szaty, a także jego synów i ich szaty. Tak poświęcił Aarona i jego szaty, jego synów i ich szaty."
  tags: []
"Kpł8,31":
  text: "I Mojżesz powiedział do Aarona i jego synów: Ugotujcie to mięso przy wejściu do Namiotu Zgromadzenia i tam je spożywajcie wraz z chlebem, który jest w koszu poświęcenia, jak przykazałem: Aaron i jego synowie będą to spożywać."
  tags: []
"Kpł8,32":
  text: "A to, co pozostanie z mięsa i chleba, spalicie w ogniu."
  tags: []
"Kpł8,33":
  text: "Nie odchodźcie od wejścia do Namiotu Zgromadzenia przez siedem dni, aż do dnia, kiedy wypełni się czas waszego poświęcenia. Przez siedem dni bowiem będziecie poświęcani."
  tags: []
"Kpł8,34":
  text: "Tak jak dziś uczyniono, tak PAN nakazał czynić, aby dokonać za was przebłagania."
  tags: []
"Kpł8,35":
  text: "Dlatego przy wejściu do Namiotu Zgromadzenia będziecie przebywać dzień i noc przez siedem dni i będziecie pełnili straż PANA, abyście nie pomarli. Tak mi bowiem rozkazano."
  tags: []
"Kpł8,36":
  text: "I Aaron oraz jego synowie uczynili to wszystko, co im PAN rozkazał przez Mojżesza."
  tags: []
