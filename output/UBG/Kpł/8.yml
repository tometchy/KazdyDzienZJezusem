"Kpł8,1": "Potem PAN powiedział do Mojżesza:"
"Kpł8,2": "Weź Aarona i z nim jego synów, ich szaty, oliwę do namaszczenia, cielca na ofiarę za grzech, dwa barany i kosz przaśnych chlebów;"
"Kpł8,3": "I zgromadź cały lud przy wejściu do Namiotu Zgromadzenia."
"Kpł8,4": "I Mojżesz zrobił tak, jak mu PAN rozkazał; i zgromadził się cały lud przy wejściu do Namiotu Zgromadzenia."
"Kpł8,5": "Wtedy Mojżesz powiedział do zgromadzenia: Oto co PAN rozkazał uczynić."
"Kpł8,6": "I kazał Mojżesz zbliżyć się Aaronowi i jego synom, i obmył ich wodą;"
"Kpł8,7": "Potem włożył tunikę na niego i przepasał go pasem, ubrał go w płaszcz, nałożył na niego efod i przepasał go pasem efodu, i przymocował go nim."
"Kpł8,8": "Włożył też na niego pektorał i do pektorału włożył Urim i Tummim."
"Kpł8,9": "Włożył także na jego głowę mitrę, a na mitrze z przodu umieścił złotą blaszkę, świętą koronę, jak PAN rozkazał Mojżeszowi."
"Kpł8,10": "Mojżesz wziął też oliwę do namaszczenia i namaścił przybytek oraz wszystkie rzeczy, które w nim były, i poświęcił je."
"Kpł8,11": "Potem pokropił nią ołtarz siedem razy i namaścił ołtarz wraz ze wszystkimi jego przyborami, również kadź i jej podstawę, aby je poświęcić."
"Kpł8,12": "Wylał także oliwę do namaszczenia na głowę Aarona i namaścił go, aby go poświęcić."
"Kpł8,13": "Potem Mojżesz kazał zbliżyć się synom Aarona, włożył na nich tuniki, przepasał ich pasami i włożył im na głowy mitry, jak PAN rozkazał Mojżeszowi."
"Kpł8,14": "Przyprowadził też cielca na ofiarę za grzech, a Aaron i jego synowie włożyli ręce na głowę cielca ofiary za grzech."
"Kpł8,15": "Następnie Mojżesz zabił go, wziął jego krew i pomazał palcem rogi ołtarza dokoła, i oczyścił ołtarz. Resztę zaś krwi wylał u podstawy ołtarza i poświęcił go dla dokonywania na nim przebłagania."
"Kpł8,16": "Potem wziął cały tłuszcz pokrywający wnętrzności, płat tłuszczu na wątrobie i obie nerki razem z ich tłuszczem i spalił to Mojżesz na ołtarzu."
"Kpł8,17": "A cielca, jego skórę, mięso i odchody spalił w ogniu poza obozem, tak jak PAN rozkazał Mojżeszowi."
"Kpł8,18": "Potem przyprowadził barana na całopalenie. I Aaron, i jego synowie włożyli ręce na głowę tego barana."
"Kpł8,19": "Mojżesz zabił go i pokropił jego krwią ołtarz dokoła."
"Kpł8,20": "Potem podzielił barana na części i spalił Mojżesz głowę, części i tłuszcz."
"Kpł8,21": "Wnętrzności zaś i nogi opłukał wodą; i Mojżesz spalił całego barana na ołtarzu. Jest to całopalenie na miłą woń, ofiara ogniowa dla PANA, jak PAN rozkazał Mojżeszowi."
"Kpł8,22": "Potem kazał przyprowadzić drugiego barana, barana poświęcenia. I Aaron, i jego synowie włożyli ręce na głowę tego barana."
"Kpł8,23": "I Mojżesz zabił go, wziął nieco z jego krwi i pomazał nią koniec prawego ucha Aarona, kciuk jego prawej ręki i wielki palec jego prawej nogi."
"Kpł8,24": "Kazał też zbliżyć się synom Aarona i pomazał Mojżesz tą krwią koniec ich prawego ucha, kciuki ich prawej ręki i wielkie palce ich prawej nogi. I Mojżesz pokropił krwią dokoła ołtarza."
"Kpł8,25": "Potem wziął tłuszcz, ogon, cały tłuszcz pokrywający wnętrzności, płat tłuszczu na wątrobie oraz obie nerki z ich tłuszczem i prawą łopatkę."
"Kpł8,26": "Także z kosza przaśnych chlebów, który był przed PANEM, wziął jeden przaśny placek, jeden placek chleba z oliwą oraz jeden podpłomyk i położył je na kawałki tłuszczu i na prawej łopatce."
"Kpł8,27": "I dał to wszystko do rąk Aarona i do rąk jego synów i kołysał to jako ofiarę kołysaną przed PANEM."
"Kpł8,28": "Następnie Mojżesz wziął to z ich rąk i spalił na ołtarzu na ofierze całopalnej. To była ofiara poświęcenia na miłą woń, ofiara ogniowa dla PANA."
"Kpł8,29": "Mojżesz wziął też mostek i kołysał go jako ofiarę kołysaną przed PANEM. Była to bowiem część Mojżesza z barana poświęcenia, jak mu PAN rozkazał."
"Kpł8,30": "Wziął też Mojżesz trochę oliwy do namaszczenia i nieco krwi z ołtarza, i pokropił nimi Aarona i jego szaty, a także jego synów i ich szaty. Tak poświęcił Aarona i jego szaty, jego synów i ich szaty."
"Kpł8,31": "I Mojżesz powiedział do Aarona i jego synów: Ugotujcie to mięso przy wejściu do Namiotu Zgromadzenia i tam je spożywajcie wraz z chlebem, który jest w koszu poświęcenia, jak przykazałem: Aaron i jego synowie będą to spożywać."
"Kpł8,32": "A to, co pozostanie z mięsa i chleba, spalicie w ogniu."
"Kpł8,33": "Nie odchodźcie od wejścia do Namiotu Zgromadzenia przez siedem dni, aż do dnia, kiedy wypełni się czas waszego poświęcenia. Przez siedem dni bowiem będziecie poświęcani."
"Kpł8,34": "Tak jak dziś uczyniono, tak PAN nakazał czynić, aby dokonać za was przebłagania."
"Kpł8,35": "Dlatego przy wejściu do Namiotu Zgromadzenia będziecie przebywać dzień i noc przez siedem dni i będziecie pełnili straż PANA, abyście nie pomarli. Tak mi bowiem rozkazano."
"Kpł8,36": "I Aaron oraz jego synowie uczynili to wszystko, co im PAN rozkazał przez Mojżesza."
