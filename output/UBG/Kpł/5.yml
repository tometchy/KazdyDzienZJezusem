"Kpł5,1":
  text: "Gdyby ktoś zgrzeszył przez to, że usłyszał przekleństwo i był tego świadkiem lub widział czy dowiedział się o tym, a tego nie oznajmił, będzie obciążony nieprawością;"
  tags: []
"Kpł5,2":
  text: "Albo jeśli ktoś dotknął czegoś nieczystego, czy to padliny nieczystego zwierzęcia, czy padliny nieczystego bydlęcia, czy padliny nieczystego zwierzęcia pełzającego, a nie jest tego świadomy, i tak będzie nieczysty i winny;"
  tags: []
"Kpł5,3":
  text: "Lub jeśli ktoś dotknął jakiejkolwiek nieczystości ludzkiej, przez którą stanie się nieczysty, a nie jest tego świadomy, a potem się o tym dowie, będzie winny;"
  tags: []
"Kpł5,4":
  text: "Albo jeśli ktoś przysiągł, mówiąc wargami, że źle lub dobrze uczyni w czymkolwiek, co ów człowiek powie w przysiędze, a nie jest tego świadomy, lecz potem sobie uświadomi, będzie winny w jednej z tych rzeczy."
  tags: []
"Kpł5,5":
  text: "Jeśli więc jest winny jednej z tych rzeczy, ma wyznać swój grzech;"
  tags: []
"Kpł5,6":
  text: "I przyprowadzi PANU ofiarę za przewinienie z powodu swego grzechu, który popełnił: samicę z trzody, owcę albo kozę na ofiarę za grzech, a kapłan dokona za niego przebłagania za jego grzech."
  tags: []
"Kpł5,7":
  text: "A jeśli nie stać go na owcę, niech przyniesie PANU jako ofiarę za swoje przewinienie, które popełnił, dwie synogarlice lub dwa młode gołębie: jednego na ofiarę za grzech, a drugiego na całopalenie;"
  tags: []
"Kpł5,8":
  text: "I przyniesie je do kapłana, a on najpierw złoży to, co ma być na ofiarę za grzech, i ukręci jego głowę przy szyi, ale jej nie oddzieli."
  tags: []
"Kpł5,9":
  text: "I pokropi krwią tej ofiary za grzech ścianę ołtarza, a resztę krwi wyciśnie u podstawy ołtarza. To jest ofiara za grzech."
  tags: []
"Kpł5,10":
  text: "Drugiego zaś złoży jako całopalenie według przepisu. W ten sposób kapłan dokona za niego przebłagania za jego grzech, który popełnił, i będzie mu przebaczony."
  tags: []
"Kpł5,11":
  text: "A jeśli nie stać go na dwie synogarlice lub dwa młode gołębie, niech ten, który zgrzeszył, przyniesie na swoją ofiarę dziesiątą część efy mąki pszennej na ofiarę za swój grzech. Nie naleje jednak na nią oliwy ani nie położy na nią kadzidła, gdyż jest to ofiara za grzech."
  tags: []
"Kpł5,12":
  text: "Przyniesie ją do kapłana, a kapłan nabierze z niej pełną garść jako pamiątkę i spali ją na ołtarzu na ofiarach całopalnych dla PANA. To jest ofiara za grzech."
  tags: []
"Kpł5,13":
  text: "I kapłan dokona za niego przebłagania za jego grzech, który popełnił w jednej z tych spraw, i będzie mu przebaczony. Reszta zaś będzie dla kapłana, jak przy ofierze pokarmowej."
  tags: []
"Kpł5,14":
  text: "PAN powiedział jeszcze do Mojżesza:"
  tags: []
"Kpł5,15":
  text: "Jeśli ktoś popełni przewinienie i zgrzeszy nieświadomie przy rzeczach poświęconych PANU, to przyprowadzi PANU jako ofiarę za swoje przewinienie barana bez skazy z trzody oraz twoje oszacowanie w syklach srebra według sykla świątynnego na ofiarę za przewinienie."
  tags: []
"Kpł5,16":
  text: "I odda kapłanowi za to, czym przewinił przy rzeczach poświęconych, i dołoży do tego jedną piątą. I kapłan dokona za niego przebłagania baranem, będącym ofiarą za przewinienie, a będzie mu przebaczone."
  tags: []
"Kpł5,17":
  text: "Jeśli ktoś zgrzeszy i przekroczy nieświadomie którekolwiek z przykazań PANA, czyniąc to, czego nie wolno, stanie się winny i będzie obciążony nieprawością."
  tags: []
"Kpł5,18":
  text: "Przyprowadzi do kapłana barana z trzody bez skazy według twojego oszacowania na ofiarę za przewinienie. A kapłan dokona za niego przebłagania za jego uchybienie, którego nieświadomie się dopuścił, i będzie mu przebaczone."
  tags: []
"Kpł5,19":
  text: "Jest to ofiara za przewinienie, gdyż w istocie zawinił przeciwko PANU."
  tags: []
