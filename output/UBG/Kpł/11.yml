"Kpł11,1":
  text: "Potem PAN przemówił do Mojżesza i Aarona tymi słowy:"
  tags: []
"Kpł11,2":
  text: "Powiedzcie synom Izraela: Oto są zwierzęta, które będziecie mogli jeść spośród wszystkich zwierząt, które są na ziemi;"
  tags: []
"Kpł11,3":
  text: "Wszystkie zwierzęta, które mają rozdzielone kopyta i racice oraz przeżuwają – je możecie jeść."
  tags: []
"Kpł11,4":
  text: "Jednak spośród tych, które przeżuwają albo mają tylko rozdzielone kopyta, nie będziecie jedli: wielbłąda, który choć przeżuwa, ale nie ma rozdzielonego kopyta – będzie dla was nieczysty."
  tags: []
"Kpł11,5":
  text: "Także królika, który choć przeżuwa, ale nie ma rozdzielonego kopyta – będzie dla was nieczysty."
  tags: []
"Kpł11,6":
  text: "Również zająca, który choć przeżuwa, ale nie ma rozdzielonego kopyta – będzie dla was nieczysty."
  tags: []
"Kpł11,7":
  text: "Świni, która choć ma rozdzielone kopyto i racice, ale nie przeżuwa – będzie dla was nieczysta."
  tags: []
"Kpł11,8":
  text: "Nie będziecie jeść ich mięsa ani dotykać ich padliny – będą dla was nieczyste."
  tags: []
"Kpł11,9":
  text: "To będziecie jeść spośród wszystkiego, co żyje w wodach: wszystko, co w wodach – w morzach i rzekach – ma płetwy i łuski. To będziecie jeść."
  tags: []
"Kpł11,10":
  text: "Wszystko zaś, co nie ma płetw ani łusek w morzach i rzekach spośród wszystkiego, co się porusza w wodach, i spośród wszystkich stworzeń wodnych, będzie dla was obrzydliwością."
  tags: []
"Kpł11,11":
  text: "Będą dla was obrzydliwością; nie będziecie jedli ich mięsa, a ich padliną będziecie się brzydzić."
  tags: []
"Kpł11,12":
  text: "Wszystko w wodach, co nie ma płetw ani łusek, będzie dla was obrzydliwością."
  tags: []
"Kpł11,13":
  text: "Tymi zaś będziecie się brzydzić z ptactwa i jeść ich nie będziecie, bo są obrzydliwością: orzeł, orłosęp i rybołów;"
  tags: []
"Kpł11,14":
  text: "Sęp i kania według ich rodzaju;"
  tags: []
"Kpł11,15":
  text: "Wszelki kruk według jego rodzaju;"
  tags: []
"Kpł11,16":
  text: "Struś, sowa, mewa i jastrząb według ich rodzaju;"
  tags: []
"Kpł11,17":
  text: "Puszczyk, kormoran i puchacz;"
  tags: []
"Kpł11,18":
  text: "Łabędź, pelikan i ścierwnik;"
  tags: []
"Kpł11,19":
  text: "Bocian, czapla według jej rodzaju, dudek i nietoperz."
  tags: []
"Kpł11,20":
  text: "Wszelkie skrzydlate owady chodzące na czterech odnóżach będą dla was obrzydliwością."
  tags: []
"Kpł11,21":
  text: "Jednak spośród wszystkich skrzydlatych owadów, które mają cztery odnóża, możecie jeść te, które mają z tyłu przedłużone odnóża do skakania po ziemi."
  tags: []
"Kpł11,22":
  text: "Te z nich możecie jeść: szarańcza według jej rodzaju, szarańcza pustynna według jej rodzaju, skoczek według jego rodzaju i konik polny według jego rodzaju."
  tags: []
"Kpł11,23":
  text: "Wszelkie zaś inne skrzydlate pełzające istoty mające cztery odnóża będą dla was obrzydliwością."
  tags: []
"Kpł11,24":
  text: "Przez nie staniecie się nieczyści. Każdy, kto dotknie ich padliny, będzie nieczysty aż do wieczora;"
  tags: []
"Kpł11,25":
  text: "A ktokolwiek będzie nosił ich padlinę, upierze swoje szaty i będzie nieczysty aż do wieczora."
  tags: []
"Kpł11,26":
  text: "Padlina wszystkich zwierząt, które mają rozdzielone kopyto, ale nie mają racicy i nie przeżuwają, będzie dla was nieczysta. Każdy, kto jej dotknie, będzie nieczysty."
  tags: []
"Kpł11,27":
  text: "A wszystko, co chodzi na łapach spośród wszystkich zwierząt chodzących na czterech nogach, będzie dla was nieczyste. Kto dotknie ich padliny, będzie nieczysty aż do wieczora."
  tags: []
"Kpł11,28":
  text: "A kto będzie nosił ich padlinę, upierze swoje szaty i będzie nieczysty aż do wieczora. Są one dla was nieczyste."
  tags: []
"Kpł11,29":
  text: "Także spośród zwierząt, które pełzają po ziemi, będą dla was nieczyste: łasica, mysz i żółw według ich rodzaju;"
  tags: []
"Kpł11,30":
  text: "Jeż, jaszczurka, tchórz, ślimak i kret."
  tags: []
"Kpł11,31":
  text: "Te będą dla was nieczyste spośród wszystkich pełzających zwierząt. Kto ich dotknie, gdy są martwe, będzie nieczysty aż do wieczora."
  tags: []
"Kpł11,32":
  text: "A każda rzecz, na którą upadnie coś zdechłego z nich, będzie nieczysta, zarówno drewniane naczynie, jak i szata, a także skóra, worek lub jakikolwiek inny przedmiot, którym wykonuje się pracę; należy je włożyć do wody i będzie nieczyste aż do wieczora. Potem będzie czyste."
  tags: []
"Kpł11,33":
  text: "Wszelkie zaś gliniane naczynie, do którego wpadnie którekolwiek z nich, wraz ze wszystkim, co znajduje się w nim, będzie nieczyste, a naczynie rozbijecie."
  tags: []
"Kpł11,34":
  text: "Każdy pokarm, który się spożywa, do którego dostanie się woda z tego naczynia, będzie nieczysty. I wszelki napój, który by się piło z takiego naczynia, będzie nieczysty."
  tags: []
"Kpł11,35":
  text: "Wszystko, na co upadnie cokolwiek z ich padlin, będzie nieczyste, czy to piec, czy palenisko; mają być zniszczone. Są bowiem nieczyste i będą dla was nieczyste."
  tags: []
"Kpł11,36":
  text: "Lecz źródło i studnie, zbiorniki wody, będą czyste. Cokolwiek jednak dotknie ich padliny, będzie nieczyste."
  tags: []
"Kpł11,37":
  text: "A jeśli coś z ich padliny upadnie na jakiekolwiek ziarno przeznaczone do siewu, to pozostanie czyste."
  tags: []
"Kpł11,38":
  text: "Jeśli jednak coś z ich padliny upadnie na ziarno zmoczone wodą, będzie ono dla was nieczyste."
  tags: []
"Kpł11,39":
  text: "Jeśli zdechnie zwierzę, które możecie jeść, to ten, kto dotknie jego padliny, będzie nieczysty aż do wieczora."
  tags: []
"Kpł11,40":
  text: "A kto by jadł jego padlinę, upierze swoje szaty i będzie nieczysty aż do wieczora. Ten, kto by wynosił tę padlinę, upierze swoje szaty i będzie nieczysty aż do wieczora."
  tags: []
"Kpł11,41":
  text: "Także wszelkie zwierzęta pełzające po ziemi są obrzydliwością; nie będziecie ich jeść."
  tags: []
"Kpł11,42":
  text: "Niczego, co pełza na brzuchu, i niczego, co chodzi na czterech lub więcej odnóżach spośród wszystkich zwierząt pełzających po ziemi, nie będziecie jeść, bo są obrzydliwością."
  tags: []
"Kpł11,43":
  text: "Nie plugawcie siebie samych przez wszelkie te zwierzęta pełzające po ziemi i nie zanieczyszczajcie się nimi, byście nie stali się nieczyści;"
  tags: []
"Kpł11,44":
  text: "Gdyż ja jestem PAN, wasz Bóg. Uświęcajcie się więc i bądźcie świętymi, bo ja jestem święty. I nie zanieczyszczajcie się żadnym zwierzęciem pełzającym po ziemi."
  tags: []
"Kpł11,45":
  text: "Gdyż ja jestem PAN, który was wyprowadził z ziemi Egiptu, aby być waszym Bogiem. Bądźcie więc świętymi, bo ja jestem święty."
  tags: []
"Kpł11,46":
  text: "To jest prawo dotyczące zwierząt, ptactwa i wszelkich żywych istot poruszających się w wodach, a także wszelkich istot pełzających po ziemi;"
  tags: []
"Kpł11,47":
  text: "Dla rozróżnienia między nieczystym a czystym, między zwierzętami, które można jeść, a których jeść nie wolno."
  tags: []
