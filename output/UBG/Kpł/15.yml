"Kpł15,1":
  text: "Potem PAN powiedział do Mojżesza i Aarona:"
  tags: []
"Kpł15,2":
  text: "Przemówcie do synów Izraela i powiedzcie im: Jeśli mężczyzna ma wyciek ze swego ciała, to jest on nieczysty."
  tags: []
"Kpł15,3":
  text: "A na tym będzie polegała nieczystość jego wycieku: Jeśli jego ciało wypuszcza wyciek albo jeśli jego ciało zatrzymuje wyciek, to jest jego nieczystość."
  tags: []
"Kpł15,4":
  text: "Każde posłanie, na którym będzie leżał chory na wyciek, będzie nieczyste, i wszystko, na czym usiądzie, będzie nieczyste."
  tags: []
"Kpł15,5":
  text: "Kto dotknie jego posłania, wypierze swoje szaty i umyje się w wodzie, i będzie nieczysty aż do wieczora."
  tags: []
"Kpł15,6":
  text: "A kto usiądzie na tym, na czym siedział chory na wyciek, wypierze swoje szaty i umyje się w wodzie, i będzie nieczysty aż do wieczora."
  tags: []
"Kpł15,7":
  text: "A kto dotknie ciała mężczyzny chorego na wyciek, wypierze swoje szaty i umyje się w wodzie, i będzie nieczysty aż do wieczora."
  tags: []
"Kpł15,8":
  text: "A jeśli chory na wyciek plunie na człowieka czystego, ten wypierze swoje szaty i umyje się w wodzie, i będzie nieczysty aż do wieczora."
  tags: []
"Kpł15,9":
  text: "Każde też siodło, na którym będzie siedział chory na wyciek, będzie nieczyste."
  tags: []
"Kpł15,10":
  text: "Kto dotknie jakiejkolwiek rzeczy, która była pod nim, będzie nieczysty aż do wieczora. A kto przenosi cokolwiek z tego, wypierze swoje szaty i umyje się w wodzie, i będzie nieczysty aż do wieczora."
  tags: []
"Kpł15,11":
  text: "Każdy też, kogo dotknie chory na wyciek, który nie umył swoich rąk w wodzie, wypierze swoje szaty i umyje się w wodzie, i będzie nieczysty aż do wieczora."
  tags: []
"Kpł15,12":
  text: "A naczynie gliniane, którego dotknie chory na wyciek, będzie stłuczone, a każde drewniane naczynie będzie umyte wodą."
  tags: []
"Kpł15,13":
  text: "A gdy chory na wyciek zostanie oczyszczony od swego wycieku, odliczy sobie siedem dni na swoje oczyszczenie, wypierze swe szaty i obmyje swoje ciało źródlaną wodą, i będzie czysty."
  tags: []
"Kpł15,14":
  text: "Ósmego dnia weźmie sobie dwie synogarlice albo dwa młode gołębie, przyjdzie przed PANA do wejścia do Namiotu Zgromadzenia i odda je kapłanowi."
  tags: []
"Kpł15,15":
  text: "A kapłan złoży je w ofierze: jednego na ofiarę za grzech, a drugiego na ofiarę całopalną. Tak dokona kapłan przebłagania za niego przed PANEM z powodu jego wycieku."
  tags: []
"Kpł15,16":
  text: "Jeśli mężczyźnie wypłynie nasienie obcowania, obmyje w wodzie całe swe ciało i będzie nieczysty aż do wieczora."
  tags: []
"Kpł15,17":
  text: "Każda też szata i każda skóra, na których będzie nasienie obcowania, będą wyprane wodą i będą nieczyste aż do wieczora."
  tags: []
"Kpł15,18":
  text: "Dotyczy to także kobiety, z którą obcuje mężczyzna mający wypływ nasienia obcowania: oboje umyją się w wodzie i będą nieczyści aż do wieczora."
  tags: []
"Kpł15,19":
  text: "A jeśli kobieta ma upływ, a jest to upływ krwi z jej ciała, to przez siedem dni będzie w swojej nieczystości. Każdy, kto jej dotknie, będzie nieczysty aż do wieczora."
  tags: []
"Kpł15,20":
  text: "Wszystko, na czym się położy w trakcie swojej nieczystości, będzie nieczyste. Wszystko, na czym usiądzie, będzie nieczyste."
  tags: []
"Kpł15,21":
  text: "Każdy, kto dotknie jej posłania, wypierze swoje szaty i umyje się wodą, i będzie nieczysty aż do wieczora."
  tags: []
"Kpł15,22":
  text: "Każdy, kto dotknie tego, na czym siedziała, wypierze swoje szaty i umyje się wodą, i będzie nieczysty aż do wieczora."
  tags: []
"Kpł15,23":
  text: "Jeśli coś było na jej posłaniu albo na czymkolwiek siedziała, a ktoś tego dotknie, będzie nieczysty aż do wieczora."
  tags: []
"Kpł15,24":
  text: "A jeśli mężczyzna położy się z nią, a jej nieczystość będzie na nim, to będzie on nieczysty przez siedem dni i każde posłanie, na którym się położy, będzie nieczyste."
  tags: []
"Kpł15,25":
  text: "Jeśli kobieta będzie miała upływ krwi przez wiele dni poza czasem swej nieczystości albo jeśli upływ krwi będzie trwał dłużej niż czas jej odłączenia, wtedy będzie nieczysta przez wszystkie dni upływu jej nieczystości jak w czasie jej odłączenia."
  tags: []
"Kpł15,26":
  text: "Każde posłanie, na którym się położy przez wszystkie dni swojego upływu, będzie dla niej jak posłanie jej odłączenia. I wszystko, na czym usiądzie, będzie nieczyste tak jak nieczystość jej odłączenia."
  tags: []
"Kpł15,27":
  text: "Ktokolwiek dotknie tych rzeczy, będzie nieczysty, i wypierze swoje szaty, i umyje się w wodzie, i będzie nieczysty aż do wieczora."
  tags: []
"Kpł15,28":
  text: "A gdy będzie oczyszczona ze swego upływu, odliczy sobie siedem dni, a potem będzie czysta."
  tags: []
"Kpł15,29":
  text: "A dnia ósmego weźmie sobie dwie synogarlice lub dwa młode gołębie i przyniesie je kapłanowi przed wejście do Namiotu Zgromadzenia."
  tags: []
"Kpł15,30":
  text: "A kapłan złoży jednego na ofiarę za grzech i drugiego na ofiarę całopalną: tak dokona kapłan przebłagania za nią przed PANEM z powodu upływu jej nieczystości."
  tags: []
"Kpł15,31":
  text: "Tak będziecie odłączać synów Izraela od ich nieczystości, aby nie pomarli w swojej nieczystości, gdy zanieczyszczają mój przybytek, który jest wśród nich."
  tags: []
"Kpł15,32":
  text: "Takie jest prawo dotyczące tego, który ma wyciek i z którego wypływa nasienie spółkowania, przez co staje się nieczysty;"
  tags: []
"Kpł15,33":
  text: "Oraz kobiety w czasie jej nieczystości i osoby, która ma wyciek, tak mężczyzny, jak i niewiasty, i mężczyzny, który się położy z kobietą nieczystą."
  tags: []
