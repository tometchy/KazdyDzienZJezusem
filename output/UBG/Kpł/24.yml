"Kpł24,1":
  text: "I PAN powiedział do Mojżesza:"
  tags: []
"Kpł24,2":
  text: "Rozkaż synom Izraela, aby przynieśli ci czystą, wyciśniętą oliwę z oliwek, na oświetlenie, aby lampy ciągle się paliły."
  tags: []
"Kpł24,3":
  text: "Aaron sporządzi je na zewnątrz zasłony Świadectwa, w Namiocie Zgromadzenia, aby się paliły od wieczora aż do poranka przed PANEM nieustannie. Będzie to wieczysta ustawa przez wszystkie wasze pokolenia."
  tags: []
"Kpł24,4":
  text: "Będzie ustawiał lampy na czystym świeczniku przed PANEM nieustannie."
  tags: []
"Kpł24,5":
  text: "Weźmiesz też mąki pszennej i upieczesz z niej dwanaście placków, każdy placek będzie z dwóch dziesiątych efy."
  tags: []
"Kpł24,6":
  text: "Potem ułożysz je w dwóch rzędach, po sześć w każdym rzędzie, na czystym stole przed PANEM."
  tags: []
"Kpł24,7":
  text: "Na każdy rząd położysz czystego kadzidła, aby było pamiątką na chlebie, ofiarą spaloną dla PANA."
  tags: []
"Kpł24,8":
  text: "W każdy dzień szabatu kapłan będzie je nieustannie układać przed PANEM, biorąc je od synów Izraela jako wieczne przymierze."
  tags: []
"Kpł24,9":
  text: "I będą należały do Aarona i jego synów: będą je jeść w miejscu świętym, gdyż jest to dla nich najświętsza rzecz ze spalanych ofiar PANA jako wieczysta ustawa."
  tags: []
"Kpł24,10":
  text: "W tym czasie syn Izraelitki, którego ojcem był Egipcjanin, wyszedł między synów Izraela. I pokłócił się w obozie syn tej Izraelitki z pewnym Izraelitą."
  tags: []
"Kpł24,11":
  text: "I syn Izraelitki bluźnił imieniu PANA i przeklinał. Przyprowadzono go więc do Mojżesza. A jego matce było na imię Szelomit, była córką Dibriego, z pokolenia Dana."
  tags: []
"Kpł24,12":
  text: "I osadzili go pod strażą, żeby im oznajmiono, co PAN rozkaże uczynić."
  tags: []
"Kpł24,13":
  text: "Wtedy PAN powiedział do Mojżesza:"
  tags: []
"Kpł24,14":
  text: "Wyprowadź bluźniercę poza obóz i niech wszyscy, którzy to słyszeli, położą swoje ręce na jego głowie i niech ukamienuje go całe zgromadzenie."
  tags: []
"Kpł24,15":
  text: "A synom Izraela powiedz tak: Ktokolwiek przeklnie swego Boga, obciąży się swym grzechem."
  tags: []
"Kpł24,16":
  text: "Ten również, kto zbluźnił imieniu PANA, poniesie śmierć: Ukamienuje go całe zgromadzenie. Zarówno przybysz, jak i rodowity mieszkaniec, jeśli zbluźni imieniu PANA, poniesie śmierć."
  tags: []
"Kpł24,17":
  text: "Każdy, kto zabije jakiegokolwiek człowieka, poniesie śmierć."
  tags: []
"Kpł24,18":
  text: "A kto zabije zwierzę, zwróci inne: zwierzę za zwierzę."
  tags: []
"Kpł24,19":
  text: "Kto też ranił swego bliźniego, niech mu uczynią tak, jak on uczynił."
  tags: []
"Kpł24,20":
  text: "Złamanie za złamanie, oko za oko, ząb za ząb; jak ranił człowieka, tak niech mu oddadzą."
  tags: []
"Kpł24,21":
  text: "Kto zabije zwierzę, zwróci inne; lecz kto zabije człowieka, poniesie śmierć."
  tags: []
"Kpł24,22":
  text: "Będziecie mieli jedno prawo zarówno dla przybysza, jak i dla rodowitego mieszkańca, gdyż ja jestem PAN, wasz Bóg."
  tags: []
"Kpł24,23":
  text: "I Mojżesz przemówił do synów Izraela, a wyprowadzili bluźniercę poza obóz i ukamienowali go. I synowie Izraela uczynili tak, jak PAN przykazał Mojżeszowi."
  tags: []
