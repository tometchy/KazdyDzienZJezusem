"Kpł4,1":
  text: "I PAN powiedział do Mojżesza:"
  tags: []
"Kpł4,2":
  text: "Przemów do synów Izraela i powiedz im: Gdyby ktoś zgrzeszył nieświadomie przeciw któremuś z przykazań PANA i zrobił coś, czego nie wolno robić, i przekroczyłby jedno z nich:"
  tags: []
"Kpł4,3":
  text: "Jeśli to namaszczony kapłan zgrzeszył jak ktoś z ludu, niech złoży PANU za swój grzech, którego się dopuścił, młodego cielca bez skazy jako ofiarę za grzech."
  tags: []
"Kpł4,4":
  text: "I przyprowadzi tego cielca przed wejście do Namiotu Zgromadzenia przed PANA, położy rękę na głowie tego cielca i zabije go przed PANEM."
  tags: []
"Kpł4,5":
  text: "I namaszczony kapłan weźmie nieco krwi tego cielca, i wniesie ją do Namiotu Zgromadzenia."
  tags: []
"Kpł4,6":
  text: "Potem kapłan umoczy swój palec we krwi i siedem razy pokropi tą krwią przed PANEM, przed zasłoną Miejsca Świętego."
  tags: []
"Kpł4,7":
  text: "I kapłan pomaże tą krwią rogi ołtarza wonnego kadzidła, który jest przed PANEM w Namiocie Zgromadzenia; resztę zaś krwi tego cielca wyleje u podstawy ołtarza całopalenia, który jest przy wejściu do Namiotu Zgromadzenia."
  tags: []
"Kpł4,8":
  text: "A cały tłuszcz wyjmie z cielca na ofiarę za grzech: tłuszcz okrywający wnętrzności i cały tłuszcz, który jest na wnętrznościach;"
  tags: []
"Kpł4,9":
  text: "Obie nerki z tłuszczem, który jest na nich i na lędźwiach, i płat tłuszczu na wątrobie, który oddzieli wraz z nerkami;"
  tags: []
"Kpł4,10":
  text: "Tak jak wyjmuje się go z cielca ofiary pojednawczej. I kapłan spali to na ołtarzu całopalenia."
  tags: []
"Kpł4,11":
  text: "Skórę zaś tego cielca i całe jego mięso wraz z głową i nogami, jego wnętrzności i odchody;"
  tags: []
"Kpł4,12":
  text: "A więc całego cielca, wyniesie poza obóz na miejsce czyste, gdzie wysypuje się popiół, i spali go na drwach, na ogniu. Będzie spalony tam, gdzie wysypują popiół."
  tags: []
"Kpł4,13":
  text: "Gdyby całe zgromadzenie Izraela zgrzeszyło nieświadomie, a sprawa była ukryta przed oczami zgromadzenia, i uczynili coś przeciw któremuś z przykazań PANA, czego nie wolno czynić, i w ten sposób zawinili;"
  tags: []
"Kpł4,14":
  text: "Kiedy grzech, którego się dopuścili, wyjdzie na jaw, wtedy zgromadzenie złoży młodego cielca jako ofiarę za grzech i przyprowadzi go przed Namiot Zgromadzenia;"
  tags: []
"Kpł4,15":
  text: "A starsi zgromadzenia włożą ręce na głowę cielca przed PANEM. I zabiją tego cielca przed PANEM."
  tags: []
"Kpł4,16":
  text: "Wtedy namaszczony kapłan wniesie nieco krwi cielca do Namiotu Zgromadzenia."
  tags: []
"Kpł4,17":
  text: "I kapłan umoczy swój palec w tej krwi, i pokropi nią siedem razy przed PANEM, przed zasłoną."
  tags: []
"Kpł4,18":
  text: "Potem pomaże tą krwią rogi ołtarza, który jest przed PANEM w Namiocie Zgromadzenia; resztę zaś krwi wyleje u podstawy ołtarza całopalenia, który jest przy wejściu do Namiotu Zgromadzenia."
  tags: []
"Kpł4,19":
  text: "Cały tłuszcz wyjmie z niego i spali na ołtarzu."
  tags: []
"Kpł4,20":
  text: "I postąpi z tym cielcem tak samo jak postąpił z cielcem złożonym za grzech; tak właśnie z nim postąpi. W ten sposób kapłan dokona za nich przebłagania i będzie im przebaczone."
  tags: []
"Kpł4,21":
  text: "Potem wyniesie tego cielca poza obóz i spali go, tak jak spalił pierwszego cielca. To jest ofiara za grzech zgromadzenia."
  tags: []
"Kpł4,22":
  text: "Gdyby przełożony ludu zgrzeszył nieświadomie i przekroczył jedno z przykazań PANA, swego Boga, czyniąc coś, czego nie wolno czynić, i w ten sposób zawinił;"
  tags: []
"Kpł4,23":
  text: "Lub gdyby uświadomił sobie swój grzech, który popełnił, to przyprowadzi na ofiarę kozła z kóz, samca bez skazy;"
  tags: []
"Kpł4,24":
  text: "Położy rękę na głowie tego kozła i zabije go na tym miejscu, gdzie się zabija ofiary całopalne przed PANEM. To jest ofiara za grzech."
  tags: []
"Kpł4,25":
  text: "I kapłan weźmie na palec nieco krwi ofiary za grzech, i pomaże rogi ołtarza całopalenia, a resztę krwi wyleje u podstawy ołtarza całopalenia."
  tags: []
"Kpł4,26":
  text: "Cały zaś jego tłuszcz spali na ołtarzu, tak jak tłuszcz ofiary pojednawczej. W ten sposób kapłan dokona za niego przebłagania za jego grzech i będzie mu przebaczony."
  tags: []
"Kpł4,27":
  text: "Gdyby ktoś spośród ludu zgrzeszył nieświadomie i przekroczył jedno z przykazań PANA, czyniąc coś, czego nie wolno czynić, i w ten sposób zawinił;"
  tags: []
"Kpł4,28":
  text: "Lub gdyby uświadomił sobie swój grzech, który popełnił, to przyprowadzi na ofiarę kozę z kóz, samicę bez skazy, za swój grzech, którego się dopuścił."
  tags: []
"Kpł4,29":
  text: "Potem położy rękę na głowie tej ofiary za grzech i zabije ją na miejscu ofiar całopalnych."
  tags: []
"Kpł4,30":
  text: "Kapłan zaś weźmie na palec nieco jej krwi i pomaże rogi ołtarza całopalenia, a resztę krwi wyleje u podstawy ołtarza."
  tags: []
"Kpł4,31":
  text: "Cały jej tłuszcz oddzieli – tak jak oddziela się tłuszcz z ofiary pojednawczej – i kapłan spali to na ołtarzu na miłą woń dla PANA. Tak kapłan dokona przebłagania za niego i będzie mu przebaczone."
  tags: []
"Kpł4,32":
  text: "A jeśli przyprowadzi owcę na ofiarę za grzech, niech przyprowadzi samicę bez skazy."
  tags: []
"Kpł4,33":
  text: "I położy rękę na głowie tej ofiary za grzech, i zabije ją jako ofiarę za grzech na tym miejscu, gdzie się zabija ofiary całopalne."
  tags: []
"Kpł4,34":
  text: "Potem kapłan weźmie na palec nieco krwi ofiary za grzech i pomaże rogi ołtarza całopalenia, a resztę krwi wyleje u podstawy ołtarza."
  tags: []
"Kpł4,35":
  text: "I cały jej tłuszcz oddzieli – tak jak oddziela się tłuszcz z owcy ofiary pojednawczej – i kapłan spali to na ołtarzu, na ofiarach całopalnych dla PANA. W ten sposób kapłan dokona za niego przebłagania za jego grzech, którego się dopuścił, i będzie mu przebaczony."
  tags: []
