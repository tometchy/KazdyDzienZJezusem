"Kpł4,1": "I PAN powiedział do Mojżesza:"
"Kpł4,2": "Przemów do synów Izraela i powiedz im: Gdyby ktoś zgrzeszył nieświadomie przeciw któremuś z przykazań PANA i zrobił coś, czego nie wolno robić, i przekroczyłby jedno z nich:"
"Kpł4,3": "Jeśli to namaszczony kapłan zgrzeszył jak ktoś z ludu, niech złoży PANU za swój grzech, którego się dopuścił, młodego cielca bez skazy jako ofiarę za grzech."
"Kpł4,4": "I przyprowadzi tego cielca przed wejście do Namiotu Zgromadzenia przed PANA, położy rękę na głowie tego cielca i zabije go przed PANEM."
"Kpł4,5": "I namaszczony kapłan weźmie nieco krwi tego cielca, i wniesie ją do Namiotu Zgromadzenia."
"Kpł4,6": "Potem kapłan umoczy swój palec we krwi i siedem razy pokropi tą krwią przed PANEM, przed zasłoną Miejsca Świętego."
"Kpł4,7": "I kapłan pomaże tą krwią rogi ołtarza wonnego kadzidła, który jest przed PANEM w Namiocie Zgromadzenia; resztę zaś krwi tego cielca wyleje u podstawy ołtarza całopalenia, który jest przy wejściu do Namiotu Zgromadzenia."
"Kpł4,8": "A cały tłuszcz wyjmie z cielca na ofiarę za grzech: tłuszcz okrywający wnętrzności i cały tłuszcz, który jest na wnętrznościach;"
"Kpł4,9": "Obie nerki z tłuszczem, który jest na nich i na lędźwiach, i płat tłuszczu na wątrobie, który oddzieli wraz z nerkami;"
"Kpł4,10": "Tak jak wyjmuje się go z cielca ofiary pojednawczej. I kapłan spali to na ołtarzu całopalenia."
"Kpł4,11": "Skórę zaś tego cielca i całe jego mięso wraz z głową i nogami, jego wnętrzności i odchody;"
"Kpł4,12": "A więc całego cielca, wyniesie poza obóz na miejsce czyste, gdzie wysypuje się popiół, i spali go na drwach, na ogniu. Będzie spalony tam, gdzie wysypują popiół."
"Kpł4,13": "Gdyby całe zgromadzenie Izraela zgrzeszyło nieświadomie, a sprawa była ukryta przed oczami zgromadzenia, i uczynili coś przeciw któremuś z przykazań PANA, czego nie wolno czynić, i w ten sposób zawinili;"
"Kpł4,14": "Kiedy grzech, którego się dopuścili, wyjdzie na jaw, wtedy zgromadzenie złoży młodego cielca jako ofiarę za grzech i przyprowadzi go przed Namiot Zgromadzenia;"
"Kpł4,15": "A starsi zgromadzenia włożą ręce na głowę cielca przed PANEM. I zabiją tego cielca przed PANEM."
"Kpł4,16": "Wtedy namaszczony kapłan wniesie nieco krwi cielca do Namiotu Zgromadzenia."
"Kpł4,17": "I kapłan umoczy swój palec w tej krwi, i pokropi nią siedem razy przed PANEM, przed zasłoną."
"Kpł4,18": "Potem pomaże tą krwią rogi ołtarza, który jest przed PANEM w Namiocie Zgromadzenia; resztę zaś krwi wyleje u podstawy ołtarza całopalenia, który jest przy wejściu do Namiotu Zgromadzenia."
"Kpł4,19": "Cały tłuszcz wyjmie z niego i spali na ołtarzu."
"Kpł4,20": "I postąpi z tym cielcem tak samo jak postąpił z cielcem złożonym za grzech; tak właśnie z nim postąpi. W ten sposób kapłan dokona za nich przebłagania i będzie im przebaczone."
"Kpł4,21": "Potem wyniesie tego cielca poza obóz i spali go, tak jak spalił pierwszego cielca. To jest ofiara za grzech zgromadzenia."
"Kpł4,22": "Gdyby przełożony ludu zgrzeszył nieświadomie i przekroczył jedno z przykazań PANA, swego Boga, czyniąc coś, czego nie wolno czynić, i w ten sposób zawinił;"
"Kpł4,23": "Lub gdyby uświadomił sobie swój grzech, który popełnił, to przyprowadzi na ofiarę kozła z kóz, samca bez skazy;"
"Kpł4,24": "Położy rękę na głowie tego kozła i zabije go na tym miejscu, gdzie się zabija ofiary całopalne przed PANEM. To jest ofiara za grzech."
"Kpł4,25": "I kapłan weźmie na palec nieco krwi ofiary za grzech, i pomaże rogi ołtarza całopalenia, a resztę krwi wyleje u podstawy ołtarza całopalenia."
"Kpł4,26": "Cały zaś jego tłuszcz spali na ołtarzu, tak jak tłuszcz ofiary pojednawczej. W ten sposób kapłan dokona za niego przebłagania za jego grzech i będzie mu przebaczony."
"Kpł4,27": "Gdyby ktoś spośród ludu zgrzeszył nieświadomie i przekroczył jedno z przykazań PANA, czyniąc coś, czego nie wolno czynić, i w ten sposób zawinił;"
"Kpł4,28": "Lub gdyby uświadomił sobie swój grzech, który popełnił, to przyprowadzi na ofiarę kozę z kóz, samicę bez skazy, za swój grzech, którego się dopuścił."
"Kpł4,29": "Potem położy rękę na głowie tej ofiary za grzech i zabije ją na miejscu ofiar całopalnych."
"Kpł4,30": "Kapłan zaś weźmie na palec nieco jej krwi i pomaże rogi ołtarza całopalenia, a resztę krwi wyleje u podstawy ołtarza."
"Kpł4,31": "Cały jej tłuszcz oddzieli – tak jak oddziela się tłuszcz z ofiary pojednawczej – i kapłan spali to na ołtarzu na miłą woń dla PANA. Tak kapłan dokona przebłagania za niego i będzie mu przebaczone."
"Kpł4,32": "A jeśli przyprowadzi owcę na ofiarę za grzech, niech przyprowadzi samicę bez skazy."
"Kpł4,33": "I położy rękę na głowie tej ofiary za grzech, i zabije ją jako ofiarę za grzech na tym miejscu, gdzie się zabija ofiary całopalne."
"Kpł4,34": "Potem kapłan weźmie na palec nieco krwi ofiary za grzech i pomaże rogi ołtarza całopalenia, a resztę krwi wyleje u podstawy ołtarza."
"Kpł4,35": "I cały jej tłuszcz oddzieli – tak jak oddziela się tłuszcz z owcy ofiary pojednawczej – i kapłan spali to na ołtarzu, na ofiarach całopalnych dla PANA. W ten sposób kapłan dokona za niego przebłagania za jego grzech, którego się dopuścił, i będzie mu przebaczony."
