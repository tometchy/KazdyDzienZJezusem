"Kpł25,1":
  text: "Potem PAN powiedział do Mojżesza na górze Synaj:"
  tags: []
"Kpł25,2":
  text: "Przemów do synów Izraela i powiedz im: Gdy wejdziecie do ziemi, którą wam daję, wtedy ziemia będzie obchodzić szabat dla PANA."
  tags: []
"Kpł25,3":
  text: "Przez sześć lat będziesz obsiewał swoje pole i przez sześć lat będziesz obcinał swoją winnicę, i zbierał z niej plony;"
  tags: []
"Kpł25,4":
  text: "Lecz w siódmym roku ziemia będzie mieć szabat odpoczynku, szabat dla PANA. Nie będziesz obsiewał swego pola ani obcinał swojej winnicy."
  tags: []
"Kpł25,5":
  text: "Nie będziesz żął tego, co samo wyrośnie po twoich żniwach, ani nie będziesz zbierał winogron twojej zaniechanej winnicy. To będzie rok odpoczynku dla ziemi."
  tags: []
"Kpł25,6":
  text: "I szabat ziemi będzie dla was pokarmem: dla ciebie, dla twego sługi, dla twojej służącej, dla twego najemnika i dla przybysza, który mieszka u ciebie."
  tags: []
"Kpł25,7":
  text: "Także dla twego bydła i zwierząt, które są w twojej ziemi; cały jej plon będzie służyć za pokarm."
  tags: []
"Kpł25,8":
  text: "Policzysz też sobie siedem lat szabatowych, to jest siedem razy po siedem lat; okres siedmiu szabatowych lat będzie wynosił czterdzieści dziewięć lat."
  tags: []
"Kpł25,9":
  text: "Wtedy w dziesiątym dniu siódmego miesiąca każesz zatrąbić w trąbę o donośnym dźwięku; w Dniu Przebłagania zatrąbicie po całej waszej ziemi."
  tags: []
"Kpł25,10":
  text: "Poświęcicie pięćdziesiąty rok i ogłosicie wolność w ziemi wszystkim jej mieszkańcom. Będzie to dla was rok jubileuszowy. Każdy z was wróci do swojej posiadłości i do swojej rodziny."
  tags: []
"Kpł25,11":
  text: "Rok pięćdziesiąty będzie dla was rokiem jubileuszowym. Nie będziecie siać ani żąć tego, co samo wyrosło, ani zbierać winogron z winnic zaniechanych."
  tags: []
"Kpł25,12":
  text: "Jest to bowiem rok jubileuszowy, będzie dla was święty. Będziecie jeść to, co na polu urośnie."
  tags: []
"Kpł25,13":
  text: "W tym roku jubileuszowym każdy z was wróci do swojej posiadłości."
  tags: []
"Kpł25,14":
  text: "Jeśli sprzedasz coś swemu bliźniemu albo kupisz coś od niego, niech jeden nie oszukuje drugiego."
  tags: []
"Kpł25,15":
  text: "Według liczby lat po roku jubileuszowym kupisz od swego bliźniego i według liczby lat plonów on sprzeda tobie."
  tags: []
"Kpł25,16":
  text: "Im więcej będzie lat, tym wyższa będzie cena, a im mniej będzie lat, tym niższa będzie cena, ponieważ on sprzedaje ci ilość rocznych plonów."
  tags: []
"Kpł25,17":
  text: "Nie będziecie oszukiwać jeden drugiego, lecz będziesz się bał swego Boga, gdyż ja jestem PAN, wasz Bóg."
  tags: []
"Kpł25,18":
  text: "Wykonujcie moje ustawy i przestrzegajcie moich praw, i wypełniajcie je, a będziecie mieszkać w tej ziemi bezpiecznie."
  tags: []
"Kpł25,19":
  text: "Ziemia wyda swój plon i będziecie jedli do syta, i będziecie bezpiecznie w niej mieszkać."
  tags: []
"Kpł25,20":
  text: "A jeśli powiecie: Cóż będziemy jeść w siódmym roku, jeśli nie będziemy siać ani zbierać naszych plonów?"
  tags: []
"Kpł25,21":
  text: "Wtedy rozkażę, żeby moje błogosławieństwo przyszło na was w szóstym roku i wyda plon na trzy lata."
  tags: []
"Kpł25,22":
  text: "I będziecie siać w ósmym roku, ale będziecie jeść ze starego plonu aż do dziewiątego roku; dopóki nie nadejdą jego plony, będziecie jeść stare."
  tags: []
"Kpł25,23":
  text: "Ziemia nie będzie sprzedawana na zawsze, gdyż ziemia należy do mnie, a wy jesteście u mnie gośćmi i przybyszami."
  tags: []
"Kpł25,24":
  text: "A w całej ziemi waszej posiadłości ustanowicie dla ziemi prawo wykupu."
  tags: []
"Kpł25,25":
  text: "Jeśli twój brat zubożeje, a sprzeda coś ze swojej własności i przyjdzie najbliższy krewny, mający prawo wykupu, to niech wykupi, co jego brat sprzedał."
  tags: []
"Kpł25,26":
  text: "A jeśli ktoś nie ma nikogo, kto może to wykupić, lecz sam będzie mógł i znajdzie środki na wykup;"
  tags: []
"Kpł25,27":
  text: "To odliczy lat od swojej sprzedaży, zwróci resztę temu, komu sprzedał, i wróci do swojej posiadłości."
  tags: []
"Kpł25,28":
  text: "Lecz jeśli nie ma środków, aby zwrócić, to pozostanie to, co sprzedał, w ręku tego, który to kupił aż do roku jubileuszowego. W roku jubileuszowym zwolni mu to, a ten wróci do swojej posiadłości."
  tags: []
"Kpł25,29":
  text: "Jeśli ktoś sprzeda dom mieszkalny w mieście otoczonym murami, będzie miał prawo wykupu do końca roku sprzedaży; będzie miał prawo wykupu przez cały rok."
  tags: []
"Kpł25,30":
  text: "A jeśli nie zostanie wykupiony do końca roku, wtedy ten dom w mieście otoczonym murami zostanie własnością na zawsze tego, który go kupił, oraz jego potomków. Nie będzie zwolniony w roku jubileuszowym."
  tags: []
"Kpł25,31":
  text: "Ale domy we wsiach, które nie są otoczone murami, będą traktowane na równi z polami ziemi. Będą podlegały prawu wykupu i w roku jubileuszowym zostaną zwolnione."
  tags: []
"Kpł25,32":
  text: "Co do miast Lewitów i domów w miastach ich posiadłości, to Lewitom zawsze przysługuje prawo wykupu."
  tags: []
"Kpł25,33":
  text: "A jeśli ktoś kupuje od Lewitów, to kupiony dom lub miejska posiadłość zostaną zwolnione w roku jubileuszowym, gdyż domy miast Lewitów są ich posiadłością pośród synów Izraela."
  tags: []
"Kpł25,34":
  text: "Ale pole wokół ich miast nie będzie sprzedawane, gdyż jest ich wieczystą posiadłością."
  tags: []
"Kpł25,35":
  text: "Jeśli twój brat zubożeje i jego ręka osłabnie przy tobie, wspomożesz go, aby mógł żyć przy tobie jako gość lub przybysz."
  tags: []
"Kpł25,36":
  text: "Nie bierz od niego lichwy ani odsetek, lecz bój się swego Boga, aby twój brat mógł się żywić przy tobie."
  tags: []
"Kpł25,37":
  text: "Nie dasz mu swoich pieniędzy na lichwę ani nie pożyczysz mu swojej żywności dla zysku."
  tags: []
"Kpł25,38":
  text: "Ja jestem PAN, wasz Bóg, który was wyprowadził z ziemi Egiptu, aby dać wam ziemię Kanaan i być waszym Bogiem."
  tags: []
"Kpł25,39":
  text: "Jeśli też zubożeje twój brat przy tobie i zaprzeda się tobie, nie będziesz go obarczał niewolniczą pracą;"
  tags: []
"Kpł25,40":
  text: "Będzie u ciebie jako najemnik i jako przybysz; aż do roku jubileuszowego będzie ci służyć."
  tags: []
"Kpł25,41":
  text: "Potem odejdzie od ciebie, on i jego dzieci z nim, i wróci do swojej rodziny i do posiadłości swoich przodków."
  tags: []
"Kpł25,42":
  text: "Oni bowiem są moimi sługami, których wyprowadziłem z ziemi Egiptu. Nie będą sprzedawani jako niewolnicy."
  tags: []
"Kpł25,43":
  text: "Nie będziesz srogo panował nad nimi, ale będziesz się bał swego Boga."
  tags: []
"Kpł25,44":
  text: "Twój niewolnik i twoja niewolnica, których będziesz miał, będą z tych narodów, które są wokoło was; od nich będziecie kupować niewolnika i niewolnicę."
  tags: []
"Kpł25,45":
  text: "Także spośród synów przybyszów mieszkających wśród was będziecie kupować i z potomstwa tych, którzy są z wami, urodzonych w waszej ziemi. Oni będą waszą własnością."
  tags: []
"Kpł25,46":
  text: "Będziecie ich przekazywać waszym dzieciom w dziedzictwie, na dziedziczną własność; będą wam służyć na zawsze. Lecz nad waszymi braćmi, synami Izraela, nikt z was nie będzie srogo panował."
  tags: []
"Kpł25,47":
  text: "A jeśli gość lub przybysz wzbogaci się przy tobie, a twój brat zubożeje przy nim i sprzeda się gościowi lub przybyszowi przy tobie lub potomstwu rodziny przybysza;"
  tags: []
"Kpł25,48":
  text: "To po sprzedaniu może zostać wykupiony; ktokolwiek z jego braci może go wykupić;"
  tags: []
"Kpł25,49":
  text: "Albo jego stryj, albo syn jego stryja może go wykupić, albo ktokolwiek z jego bliskich krewnych z jego rodziny może go wykupić, albo jeśli go stać, sam siebie wykupi."
  tags: []
"Kpł25,50":
  text: "I rozliczy się ze swoim nabywcą od roku swego sprzedania aż do roku jubileuszowego; a pieniądze, za które się sprzedał, zostaną obliczone według liczby lat; postąpi z nim jak z najemnikiem."
  tags: []
"Kpł25,51":
  text: "Jeśli zostało jeszcze wiele lat, to według ich liczby zwróci swój wykup z pieniędzy, za które został kupiony."
  tags: []
"Kpł25,52":
  text: "A jeśli do roku jubileuszowego zostało niewiele lat, to rozliczy się z nim i według ich liczby tych lat zwróci swój wykup."
  tags: []
"Kpł25,53":
  text: "Będzie u niego jako najemnik, rok po roku; nie będzie nad nim srogo panował na twoich oczach."
  tags: []
"Kpł25,54":
  text: "A jeśli nie zostanie wykupiony tymi sposobami, wtedy wyjdzie wolny w roku jubileuszowym, on razem ze swoimi dziećmi;"
  tags: []
"Kpł25,55":
  text: "Bo synowie Izraela są moimi sługami. Są moimi sługami, których wyprowadziłem z ziemi Egiptu. Ja jestem PAN, wasz Bóg."
  tags: []
