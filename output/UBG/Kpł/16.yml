"Kpł16,1":
  text: "Potem PAN mówił do Mojżesza po śmierci dwóch synów Aarona, którzy umarli, gdy złożyli ofiarę przed PANEM."
  tags: []
"Kpł16,2":
  text: "I PAN powiedział do Mojżesza: Powiedz swojemu bratu Aaronowi, żeby nie wchodził w każdym czasie do Miejsca Świętego poza zasłonę przed przebłagalnią, która jest na arce, aby nie umarł. W obłoku bowiem będę się ukazywać nad przebłagalnią."
  tags: []
"Kpł16,3":
  text: "Oto w taki sposób Aaron będzie wchodzić do Świętego Miejsca: z młodym cielcem na ofiarę za grzech i z baranem na całopalenie."
  tags: []
"Kpł16,4":
  text: "Ubierze się w świętą lnianą tunikę, na ciele będzie miał lniane spodnie, opasze się lnianym pasem i włoży na głowę lnianą mitrę. To są święte szaty; obmyje więc swoje ciało w wodzie i założy je."
  tags: []
"Kpł16,5":
  text: "A od zgromadzenia synów Izraela weźmie dwa kozły na ofiarę za grzech i jednego baranka na całopalenie."
  tags: []
"Kpł16,6":
  text: "I Aaron złoży swego cielca na ofiarę za grzech za siebie samego, i dokona przebłagania za siebie i swój dom."
  tags: []
"Kpł16,7":
  text: "Weźmie też dwa kozły i postawi je przed PANEM u wejścia do Namiotu Zgromadzenia."
  tags: []
"Kpł16,8":
  text: "I Aaron rzuci losy o dwa kozły, jeden los dla PANA, a drugi los dla kozła ofiarnego."
  tags: []
"Kpł16,9":
  text: "I przyprowadzi Aaron tego kozła, na którego padł los dla PANA, i złoży go w ofierze za grzech."
  tags: []
"Kpł16,10":
  text: "Ale kozła, na którego padł los dla kozła ofiarnego, postawi żywego przed PANEM, aby nim dokonać przebłagania i wypuścić go na pustynię jako kozła ofiarnego."
  tags: []
"Kpł16,11":
  text: "I przyprowadzi Aaron cielca na ofiarę za grzech za siebie samego, i dokona przebłagania za siebie i swój dom, i zabije cielca na ofiarę za grzech za siebie samego."
  tags: []
"Kpł16,12":
  text: "Następnie weźmie pełną kadzielnicę węgla rozpalonego z ołtarza przed PANEM oraz dwie pełne garści wonnego utłuczonego kadzidła i wniesie poza zasłonę."
  tags: []
"Kpł16,13":
  text: "I nasypie kadzidło na ogień przed PANEM, aby obłok kadzidła okrył przebłagalnię, która jest nad arką, aby nie umarł."
  tags: []
"Kpł16,14":
  text: "Potem weźmie z krwi tego cielca i pokropi swym palcem nad przebłagalnią ku wschodowi. Przed przebłagalnią będzie kropić tą krwią siedem razy swym palcem."
  tags: []
"Kpł16,15":
  text: "Następnie zabije kozła na ofiarę za grzech za lud i wniesie jego krew poza zasłonę, i uczyni z jego krwią, jak uczynił z krwią cielca: pokropi nią nad przebłagalnią i przed przebłagalnią."
  tags: []
"Kpł16,16":
  text: "Tak dokona przebłagania nad Miejscem Świętym za nieczystości synów Izraela, za ich przestępstwa i za wszystkie ich grzechy. Tak też uczyni z Namiotem Zgromadzenia, który jest wśród nich, pośrodku ich nieczystości."
  tags: []
"Kpł16,17":
  text: "A żaden człowiek nie może przebywać w Namiocie Zgromadzenia, gdy on będzie wchodzić do Miejsca Świętego, by dokonać przebłagania, aż wyjdzie i dokona przebłagania sam za siebie, swój dom i za całe zgromadzenie Izraela."
  tags: []
"Kpł16,18":
  text: "Potem wyjdzie do ołtarza, który jest przed PANEM, i dokona za niego przebłagania: weźmie nieco krwi cielca i krwi kozła i pomaże rogi ołtarza dokoła."
  tags: []
"Kpł16,19":
  text: "Pokropi go z wierzchu tą krwią swym palcem siedem razy, oczyści go i poświęci go od nieczystości synów Izraela."
  tags: []
"Kpł16,20":
  text: "A gdy dokona przebłagania za Miejsce Święte, Namiot Zgromadzenia i ołtarz, przyprowadzi żywego kozła."
  tags: []
"Kpł16,21":
  text: "I Aaron położy obie ręce na głowie żywego kozła, wyznawać będzie nad nim wszystkie nieprawości synów Izraela i wszystkie ich przestępstwa ze wszystkimi ich grzechami i złoży je na głowę tego kozła, i wypuści go przez wyznaczonego człowieka na pustynię."
  tags: []
"Kpł16,22":
  text: "Tak poniesie ten kozioł na sobie wszystkie ich nieprawości do ziemi pustej. I wypuści tego kozła na pustynię."
  tags: []
"Kpł16,23":
  text: "Potem Aaron wejdzie do Namiotu Zgromadzenia, zdejmie z siebie lniane szaty, które włożył, gdy wszedł do Miejsca Świętego, i zostawi je tam."
  tags: []
"Kpł16,24":
  text: "Obmyje też swoje ciało w wodzie na Miejscu Świętym i włoży swoje szaty, wyjdzie i złoży swoje całopalenie i całopalenie ludu i dokona przebłagania za siebie i za lud."
  tags: []
"Kpł16,25":
  text: "A tłuszcz ofiary za grzech spali na ołtarzu."
  tags: []
"Kpł16,26":
  text: "A ten, który wypuścił kozła jako kozła ofiarnego, wypierze swoje szaty i obmyje swoje ciało w wodzie, potem wejdzie do obozu."
  tags: []
"Kpł16,27":
  text: "Cielca zaś ofiary za grzech i kozła ofiary za grzech, których krew została wniesiona do Miejsca Świętego dla przebłagania, wyniosą poza obóz i spalą w ogniu ich skóry, ich mięso i ich gnój."
  tags: []
"Kpł16,28":
  text: "A ten, który je spali, wypierze swoje szaty i obmyje swoje ciało w wodzie, potem wejdzie do obozu."
  tags: []
"Kpł16,29":
  text: "To będzie dla was wieczną ustawą: W dziesiątym dniu tego siódmego miesiąca będziecie trapić swoje dusze i nie będziecie wykonywać żadnej pracy, zarówno rodowity mieszkaniec, jak i przybysz, który gości wśród was;"
  tags: []
"Kpł16,30":
  text: "Bo w tym dniu kapłan dokona za was przebłagania, aby was oczyścić od wszystkich waszych grzechów, abyście byli oczyszczeni przed PANEM."
  tags: []
"Kpł16,31":
  text: "Będzie to dla was szabatem odpoczynku i będziecie trapić wasze dusze ustawą wieczną."
  tags: []
"Kpł16,32":
  text: "A dokona przebłagania kapłan, który jest namaszczony i poświęcony do pełnienia służby na miejsce swego ojca, a włoży lniane szaty, szaty święte;"
  tags: []
"Kpł16,33":
  text: "I dokona przebłagania za Miejsce Najświętsze i Namiot Zgromadzenia, i za ołtarz, dokona też przebłagania za kapłanów i cały lud zgromadzenia."
  tags: []
"Kpł16,34":
  text: "I będzie to dla was wieczną ustawą, aby raz w roku dokonywać za synów Izraela przebłagania za wszystkie ich grzechy. I uczynił Mojżesz tak, jak mu PAN rozkazał."
  tags: []
