"Kpł21,1":
  text: "PAN powiedział też do Mojżesza: Mów do kapłanów, synów Aarona i powiedz im: Niech nikt z was nie zanieczyści się z powodu umarłych spośród swego ludu;"
  tags: []
"Kpł21,2":
  text: "Z wyjątkiem najbliższych krewnych, czyli swej matki, swego ojca, swego syna, swej córki i swego brata;"
  tags: []
"Kpł21,3":
  text: "A także swej siostry dziewicy, bliskiej mu, która nie miała męża; z jej powodu może się zanieczyścić."
  tags: []
"Kpł21,4":
  text: "Jako przełożony wśród swego ludu nie zanieczyści się, tak żeby był skalany."
  tags: []
"Kpł21,5":
  text: "Nie będą sobie czynili łysiny na swej głowie ani nie będą golić skrajów swej brody, ani nie będą nacinać swego ciała."
  tags: []
"Kpł21,6":
  text: "Będą święci dla swego Boga i nie będą bezcześcili imienia swego Boga, składają bowiem ofiary PANA spalane w ogniu oraz chleb swego Boga. Będą więc święci."
  tags: []
"Kpł21,7":
  text: "Nie pojmą sobie za żonę nierządnicy lub naruszonej w panieństwie; nie będą także pojmować kobiety oddalonej przez jej męża, gdyż każdy z nich jest święty dla swego Boga."
  tags: []
"Kpł21,8":
  text: "Miej go więc za świętego, bo on składa w ofierze chleb twego Boga; dlatego będzie święty dla ciebie, bo ja, PAN, który was poświęca, jestem święty."
  tags: []
"Kpł21,9":
  text: "Jeśli córka kapłana zbezcześci się przez nierząd, zbezcześci swego ojca. Będzie spalona w ogniu."
  tags: []
"Kpł21,10":
  text: "Najwyższy kapłan wśród swoich braci, na którego głowę została wylana oliwa namaszczenia i który został poświęcony, aby wkładać na siebie święte szaty, nie będzie odsłaniał swej głowy i nie rozedrze swoich szat;"
  tags: []
"Kpł21,11":
  text: "I nie zbliży się do żadnego zmarłego, nawet nie zanieczyści się z powodu swego ojca lub z powodu swej matki."
  tags: []
"Kpł21,12":
  text: "Nie wyjdzie ze świątyni i nie zbezcześci świątyni swego Boga, gdyż korona oliwy namaszczenia swego Boga jest na nim: Ja jestem PAN."
  tags: []
"Kpł21,13":
  text: "I weźmie sobie dziewicę za żonę."
  tags: []
"Kpł21,14":
  text: "Nie weźmie sobie ani wdowy, ani oddalonej, ani zhańbionej, ani nierządnicy, lecz weźmie sobie za żonę dziewicę ze swego ludu."
  tags: []
"Kpł21,15":
  text: "I nie zbezcześci swego potomstwa wśród swego ludu, bo ja jestem PAN, który go uświęca."
  tags: []
"Kpł21,16":
  text: "Przemówił dalej PAN do Mojżesza, mówiąc:"
  tags: []
"Kpł21,17":
  text: "Powiedz Aaronowi tymi słowy: Ktokolwiek z twego potomstwa w ich pokoleniach miał jakąś wadę, niech nie zbliża się, aby składać w ofierze chleb swego Boga."
  tags: []
"Kpł21,18":
  text: "Żaden mężczyzna, który ma jakąś wadę, nie zbliży się: ani niewidomy, ani chromy, ani mający płaski nos, ani nieproporcjonalnie zbudowany;"
  tags: []
"Kpł21,19":
  text: "Ani ten, który ma złamaną nogę lub rękę;"
  tags: []
"Kpł21,20":
  text: "Ani garbaty, ani z bielmem na oku, ani chory na świerzb, ani pokryty liszajami, ani eunuch:"
  tags: []
"Kpł21,21":
  text: "Żaden mężczyzna z potomków kapłana Aarona, który ma jakąś wadę, nie zbliży się, by składać ofiary PANA spalane w ogniu. Ma wadę, więc nie zbliży się, aby składać w ofierze chleb swego Boga."
  tags: []
"Kpł21,22":
  text: "Może jednak spożywać chleb swego Boga, zarówno święty, jak i najświętszy."
  tags: []
"Kpł21,23":
  text: "Lecz nie może wchodzić poza zasłonę ani zbliżać się do ołtarza, bo ma wadę, żeby nie zbezcześcił mojej świątyni. Ja bowiem jestem PAN, który ją poświęca."
  tags: []
"Kpł21,24":
  text: "I Mojżesz powiedział to Aaronowi, jego synom i wszystkim synom Izraela."
  tags: []
