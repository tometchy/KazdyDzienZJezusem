"Kpł21,1": "PAN powiedział też do Mojżesza: Mów do kapłanów, synów Aarona i powiedz im: Niech nikt z was nie zanieczyści się z powodu umarłych spośród swego ludu;"
"Kpł21,2": "Z wyjątkiem najbliższych krewnych, czyli swej matki, swego ojca, swego syna, swej córki i swego brata;"
"Kpł21,3": "A także swej siostry dziewicy, bliskiej mu, która nie miała męża; z jej powodu może się zanieczyścić."
"Kpł21,4": "Jako przełożony wśród swego ludu nie zanieczyści się, tak żeby był skalany."
"Kpł21,5": "Nie będą sobie czynili łysiny na swej głowie ani nie będą golić skrajów swej brody, ani nie będą nacinać swego ciała."
"Kpł21,6": "Będą święci dla swego Boga i nie będą bezcześcili imienia swego Boga, składają bowiem ofiary PANA spalane w ogniu oraz chleb swego Boga. Będą więc święci."
"Kpł21,7": "Nie pojmą sobie za żonę nierządnicy lub naruszonej w panieństwie; nie będą także pojmować kobiety oddalonej przez jej męża, gdyż każdy z nich jest święty dla swego Boga."
"Kpł21,8": "Miej go więc za świętego, bo on składa w ofierze chleb twego Boga; dlatego będzie święty dla ciebie, bo ja, PAN, który was poświęca, jestem święty."
"Kpł21,9": "Jeśli córka kapłana zbezcześci się przez nierząd, zbezcześci swego ojca. Będzie spalona w ogniu."
"Kpł21,10": "Najwyższy kapłan wśród swoich braci, na którego głowę została wylana oliwa namaszczenia i który został poświęcony, aby wkładać na siebie święte szaty, nie będzie odsłaniał swej głowy i nie rozedrze swoich szat;"
"Kpł21,11": "I nie zbliży się do żadnego zmarłego, nawet nie zanieczyści się z powodu swego ojca lub z powodu swej matki."
"Kpł21,12": "Nie wyjdzie ze świątyni i nie zbezcześci świątyni swego Boga, gdyż korona oliwy namaszczenia swego Boga jest na nim: Ja jestem PAN."
"Kpł21,13": "I weźmie sobie dziewicę za żonę."
"Kpł21,14": "Nie weźmie sobie ani wdowy, ani oddalonej, ani zhańbionej, ani nierządnicy, lecz weźmie sobie za żonę dziewicę ze swego ludu."
"Kpł21,15": "I nie zbezcześci swego potomstwa wśród swego ludu, bo ja jestem PAN, który go uświęca."
"Kpł21,16": "Przemówił dalej PAN do Mojżesza, mówiąc:"
"Kpł21,17": "Powiedz Aaronowi tymi słowy: Ktokolwiek z twego potomstwa w ich pokoleniach miał jakąś wadę, niech nie zbliża się, aby składać w ofierze chleb swego Boga."
"Kpł21,18": "Żaden mężczyzna, który ma jakąś wadę, nie zbliży się: ani niewidomy, ani chromy, ani mający płaski nos, ani nieproporcjonalnie zbudowany;"
"Kpł21,19": "Ani ten, który ma złamaną nogę lub rękę;"
"Kpł21,20": "Ani garbaty, ani z bielmem na oku, ani chory na świerzb, ani pokryty liszajami, ani eunuch:"
"Kpł21,21": "Żaden mężczyzna z potomków kapłana Aarona, który ma jakąś wadę, nie zbliży się, by składać ofiary PANA spalane w ogniu. Ma wadę, więc nie zbliży się, aby składać w ofierze chleb swego Boga."
"Kpł21,22": "Może jednak spożywać chleb swego Boga, zarówno święty, jak i najświętszy."
"Kpł21,23": "Lecz nie może wchodzić poza zasłonę ani zbliżać się do ołtarza, bo ma wadę, żeby nie zbezcześcił mojej świątyni. Ja bowiem jestem PAN, który ją poświęca."
"Kpł21,24": "I Mojżesz powiedział to Aaronowi, jego synom i wszystkim synom Izraela."
