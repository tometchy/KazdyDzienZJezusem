"Kpł10,1":
  text: "A Nadab i Abihu, synowie Aarona, wzięli każdy swoją kadzielnicę, włożyli do nich ogień, nałożyli na nie kadzidła i ofiarowali przed PANEM obcy ogień, którego im nie nakazał."
  tags: []
"Kpł10,2":
  text: "Wtedy wyszedł ogień sprzed PANA i pochłonął ich, i pomarli przed PANEM."
  tags: []
"Kpł10,3":
  text: "Wówczas Mojżesz powiedział do Aarona: Oto co PAN powiedział: W tych, którzy zbliżają się do mnie, będę uświęcony i będę uwielbiony przed całym ludem. I Aaron zamilkł."
  tags: []
"Kpł10,4":
  text: "Mojżesz wezwał Miszaela i Elsafana, synów Uzziela, stryja Aarona, i powiedział do nich: Zbliżcie się i wynieście waszych braci sprzed świątyni poza obóz."
  tags: []
"Kpł10,5":
  text: "Podeszli więc i wynieśli ich w ich tunikach poza obóz, jak Mojżesz nakazał."
  tags: []
"Kpł10,6":
  text: "Potem Mojżesz powiedział do Aarona i jego synów, Eleazara i Itamara: Nie obnażajcie swoich głów ani nie rozdzierajcie swoich szat, abyście nie pomarli i aby Bóg nie rozgniewał się na całe zgromadzenie. Lecz wasi bracia, cały dom Izraela, niech opłakują ten pożar, który PAN rozpalił."
  tags: []
"Kpł10,7":
  text: "Nie odchodźcie od wejścia do Namiotu Zgromadzenia, abyście nie pomarli, ponieważ oliwa namaszczenia PANA jest na was. I postąpili według słowa Mojżesza."
  tags: []
"Kpł10,8":
  text: "Następnie PAN powiedział do Aarona:"
  tags: []
"Kpł10,9":
  text: "Nie pij wina ani mocnego napoju, ani ty, ani twoi synowie z tobą, gdy będziecie wchodzić do Namiotu Zgromadzenia, abyście nie pomarli. To będzie ustawa wieczna dla wszystkich waszych pokoleń;"
  tags: []
"Kpł10,10":
  text: "Abyście mogli rozróżniać między tym, co święte, a tym, co pospolite, między tym, co nieczyste, a tym, co czyste;"
  tags: []
"Kpł10,11":
  text: "I abyście nauczali synów Izraela wszystkich ustaw, które PAN nakazał im przez Mojżesza."
  tags: []
"Kpł10,12":
  text: "I Mojżesz powiedział do Aarona oraz jego pozostałych synów, Eleazara i Itamara: Weźcie ofiarę pokarmową, która pozostała z ofiar ogniowych PANA, i jedzcie ją bez zakwasu przy ołtarzu. Jest to bowiem rzecz najświętsza."
  tags: []
"Kpł10,13":
  text: "Będziecie ją spożywać w miejscu świętym, bo jest to część należna tobie i twoim synom z ofiar ogniowych PANA. Tak mi bowiem rozkazano."
  tags: []
"Kpł10,14":
  text: "Także mostek kołysania i łopatkę wzniesienia będziecie spożywać w miejscu czystym, ty, twoi synowie i twoje córki z tobą. To bowiem należy się tobie, a także twoim synom, dane wam z ofiar pojednawczych synów Izraela."
  tags: []
"Kpł10,15":
  text: "Przyniosą łopatkę wzniesienia i mostek kołysania wraz z tłuszczem z ofiar ogniowych, aby kołysać je przed PANEM; a będzie to dla ciebie i twoich synów z tobą na mocy ustawy wiecznej, tak jak PAN rozkazał."
  tags: []
"Kpł10,16":
  text: "Potem Mojżesz pilnie szukał kozła na ofiarę za grzech, ale okazało się, że został on już spalony. I rozgniewał się na synów Aarona, Eleazara i Itamara, którzy mu pozostali, i mówił:"
  tags: []
"Kpł10,17":
  text: "Dlaczego nie zjedliście ofiary za grzech w miejscu świętym? Przecież jest ona rzeczą najświętszą, którą dano wam, abyście nosili nieprawość całego ludu, abyście dokonali za niego przebłagania przed PANEM."
  tags: []
"Kpł10,18":
  text: "Oto jej krwi nie wniesiono do wnętrza miejsca świętego. Powinniście byli ją jeść na miejscu świętym, jak nakazałem."
  tags: []
"Kpł10,19":
  text: "Wtedy Aaron odpowiedział Mojżeszowi: Oto dziś złożyli swoją ofiarę za grzech i swoją ofiarę całopalną przed PANEM, a taka rzecz mnie spotkała. Gdybym dziś spożył ofiarę za grzech, czy to by się spodobało PANU?"
  tags: []
"Kpł10,20":
  text: "Gdy Mojżesz to usłyszał, uznał to za słuszne."
  tags: []
