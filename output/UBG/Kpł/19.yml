"Kpł19,1": "Potem PAN powiedział do Mojżesza:"
"Kpł19,2": "Przemów do całego zgromadzenia synów Izraela i powiedz im: Bądźcie święci, bo ja, PAN, wasz Bóg, jestem święty."
"Kpł19,3": "Niech każdy z was boi się swojej matki i swojego ojca i niech przestrzega moich szabatów. Ja jestem PAN, wasz Bóg."
"Kpł19,4": "Nie będziecie się zwracać do bożków i nie czyńcie sobie odlewanych bogów. Ja jestem PAN, wasz Bóg."
"Kpł19,5": "A gdy będziecie składać PANU ofiarę pojednawczą, składajcie ją dobrowolnie."
"Kpł19,6": "Będziecie ją spożywali w dniu, w którym ją złożycie w ofierze, i nazajutrz. A co pozostanie do trzeciego dnia, będzie spalone w ogniu."
"Kpł19,7": "A jeśli spożyjecie ją trzeciego dnia, będzie obrzydliwa i nie zostanie przyjęta."
"Kpł19,8": "Ktokolwiek ją spożyje, obciąży się nieprawością, bo zbezcześcił świętość PANA. Ta dusza będzie wykluczona spośród swego ludu."
"Kpł19,9": "Gdy będziecie żąć zboża waszej ziemi, nie będziesz żął swego pola do samego skraju ani nie będziesz zbierał pokłosia po swoim żniwie."
"Kpł19,10": "Także gron swej winnicy nie będziesz obierał całkowicie i nie zbieraj z winnicy winogron, które upadły; zostawisz je dla ubogiego i przybysza. Ja jestem PAN, wasz Bóg."
"Kpł19,11": "Nie będziecie kraść, nie będziecie oszukiwać i nie będziecie okłamywać jeden drugiego."
"Kpł19,12": "Nie będziecie przysięgać fałszywie na moje imię i nie będziecie bezcześcić imienia swego Boga. Ja jestem PAN."
"Kpł19,13": "Nie będziesz uciskać swego bliźniego i nie będziesz go wyzyskiwać. Zapłata najemnika nie zostanie u ciebie aż do rana."
"Kpł19,14": "Nie będziesz złorzeczył głuchemu, a przed ślepym nie będziesz stawiał przeszkody, ale będziesz się bał swego Boga. Ja jestem PAN."
"Kpł19,15": "Nie będziesz postępował niesłusznie w sądzie. Nie będziesz miał względu na osobę ubogiego i nie wyróżniaj osoby bogatego. Sprawiedliwie będziesz sądził swego bliźniego."
"Kpł19,16": "Nie będziesz szerzył oszczerstw wśród swego ludu. Nie będziesz nastawał na krew swego bliźniego. Ja jestem PAN."
"Kpł19,17": "Nie będziesz w swoim sercu nienawidził swego brata. Będziesz upominał swego bliźniego i nie zniesiesz u niego grzechu."
"Kpł19,18": "Nie będziesz się mścił i nie będziesz chować urazy do synów swego ludu, lecz będziesz miłował swego bliźniego jak samego siebie. Ja jestem PAN."
"Kpł19,19": "Będziesz przestrzegać moich ustaw. Nie będziesz parzył swego bydła z bydłem innego rodzaju. Nie będziesz obsiewał swego pola dwoma rodzajami ziarna. Także nie będziesz wkładał na siebie szaty utkanej z dwóch różnych przędzy, jak z wełny i lnu."
"Kpł19,20": "Jeśli mężczyzna obcuje z kobietą, która jest niewolnicą, poślubioną mężowi, lecz jeszcze niewykupioną ani nieobdarzoną wolnością, oboje będą karani, ale nie zostaną zabici, ponieważ nie była wolna."
"Kpł19,21": "I przyprowadzi PANU ofiarę za swoje przewinienie przed wejście do Namiotu Zgromadzenia, to jest barana za przewinienie."
"Kpł19,22": "Wówczas kapłan dokona przed PANEM przebłagania za niego przez barana za przewinienie za jego grzech, którego się dopuścił. I będzie mu odpuszczony jego grzech, który popełnił."
"Kpł19,23": "A gdy wejdziecie do ziemi i zasadzicie wszelkie drzewa dające owoc, wtedy będziecie uważać ich owoce za nieobrzezane. Przez trzy lata będziecie je mieć za nieobrzezane, nie będziecie ich jeść."
"Kpł19,24": "Lecz w czwartym roku wszystkie ich owoce będą poświęcone jako ofiara na chwałę PANA."
"Kpł19,25": "A w piątym roku będziecie jeść ich owoc, aby mnożył się wam jego urodzaj. Ja jestem PAN, wasz Bóg."
"Kpł19,26": "Nie będziecie jeść niczego z krwią. Nie będziecie uprawiać wróżbiarstwa ani czarów."
"Kpł19,27": "Nie będziecie obcinać włosów dokoła waszej głowy ani nie będziecie przycinać końców swojej brody."
"Kpł19,28": "Nie będziecie robić żadnych nacięć na swoim ciele za umarłych ani czynić żadnego piętna na sobie. Ja jestem PAN."
"Kpł19,29": "Nie będziesz hańbił swojej córki, nakłaniając ją do nierządu, aby ziemia nie uległa nierządowi i nie napełniła się rozpustą."
"Kpł19,30": "Będziecie przestrzegać moich szabatów i moją świątynię będziecie czcić. Ja jestem PAN."
"Kpł19,31": "Nie będziecie się zwracać do czarowników ani szukać rady u wróżbitów, abyście się przez nich nie skalali. Ja jestem PAN, wasz Bóg."
"Kpł19,32": "Przed siwizną wstaniesz i uczcisz osobę starca, i bój się swego Boga. Ja jestem PAN."
"Kpł19,33": "Jeśli przybysz będzie mieszkał z tobą w waszej ziemi, nie czyńcie mu krzywdy;"
"Kpł19,34": "Przybysz, który gości u was, będzie jak jeden urodzony wśród was. Będziesz go miłować jak samego siebie, bo i wy byliście przybyszami w ziemi Egiptu. Ja jestem PAN, wasz Bóg."
"Kpł19,35": "Nie czyńcie nieprawości w sądzie, w miarach, w wagach i w objętości."
"Kpł19,36": "Wagi sprawiedliwe, odważniki sprawiedliwe, efę sprawiedliwą i kwartę sprawiedliwą będziecie mieć. Ja jestem PAN, wasz Bóg, który wyprowadził was z ziemi Egiptu."
"Kpł19,37": "Będziecie więc przestrzegać wszystkich moich ustaw i wszystkich moich praw i będziecie je wypełniać. Ja jestem PAN."
