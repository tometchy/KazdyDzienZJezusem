"Kpł19,1":
  text: "Potem PAN powiedział do Mojżesza:"
  tags: []
"Kpł19,2":
  text: "Przemów do całego zgromadzenia synów Izraela i powiedz im: Bądźcie święci, bo ja, PAN, wasz Bóg, jestem święty."
  tags: []
"Kpł19,3":
  text: "Niech każdy z was boi się swojej matki i swojego ojca i niech przestrzega moich szabatów. Ja jestem PAN, wasz Bóg."
  tags: []
"Kpł19,4":
  text: "Nie będziecie się zwracać do bożków i nie czyńcie sobie odlewanych bogów. Ja jestem PAN, wasz Bóg."
  tags: []
"Kpł19,5":
  text: "A gdy będziecie składać PANU ofiarę pojednawczą, składajcie ją dobrowolnie."
  tags: []
"Kpł19,6":
  text: "Będziecie ją spożywali w dniu, w którym ją złożycie w ofierze, i nazajutrz. A co pozostanie do trzeciego dnia, będzie spalone w ogniu."
  tags: []
"Kpł19,7":
  text: "A jeśli spożyjecie ją trzeciego dnia, będzie obrzydliwa i nie zostanie przyjęta."
  tags: []
"Kpł19,8":
  text: "Ktokolwiek ją spożyje, obciąży się nieprawością, bo zbezcześcił świętość PANA. Ta dusza będzie wykluczona spośród swego ludu."
  tags: []
"Kpł19,9":
  text: "Gdy będziecie żąć zboża waszej ziemi, nie będziesz żął swego pola do samego skraju ani nie będziesz zbierał pokłosia po swoim żniwie."
  tags: []
"Kpł19,10":
  text: "Także gron swej winnicy nie będziesz obierał całkowicie i nie zbieraj z winnicy winogron, które upadły; zostawisz je dla ubogiego i przybysza. Ja jestem PAN, wasz Bóg."
  tags: []
"Kpł19,11":
  text: "Nie będziecie kraść, nie będziecie oszukiwać i nie będziecie okłamywać jeden drugiego."
  tags: []
"Kpł19,12":
  text: "Nie będziecie przysięgać fałszywie na moje imię i nie będziecie bezcześcić imienia swego Boga. Ja jestem PAN."
  tags: []
"Kpł19,13":
  text: "Nie będziesz uciskać swego bliźniego i nie będziesz go wyzyskiwać. Zapłata najemnika nie zostanie u ciebie aż do rana."
  tags: []
"Kpł19,14":
  text: "Nie będziesz złorzeczył głuchemu, a przed ślepym nie będziesz stawiał przeszkody, ale będziesz się bał swego Boga. Ja jestem PAN."
  tags: []
"Kpł19,15":
  text: "Nie będziesz postępował niesłusznie w sądzie. Nie będziesz miał względu na osobę ubogiego i nie wyróżniaj osoby bogatego. Sprawiedliwie będziesz sądził swego bliźniego."
  tags: []
"Kpł19,16":
  text: "Nie będziesz szerzył oszczerstw wśród swego ludu. Nie będziesz nastawał na krew swego bliźniego. Ja jestem PAN."
  tags: []
"Kpł19,17":
  text: "Nie będziesz w swoim sercu nienawidził swego brata. Będziesz upominał swego bliźniego i nie zniesiesz u niego grzechu."
  tags: []
"Kpł19,18":
  text: "Nie będziesz się mścił i nie będziesz chować urazy do synów swego ludu, lecz będziesz miłował swego bliźniego jak samego siebie. Ja jestem PAN."
  tags: []
"Kpł19,19":
  text: "Będziesz przestrzegać moich ustaw. Nie będziesz parzył swego bydła z bydłem innego rodzaju. Nie będziesz obsiewał swego pola dwoma rodzajami ziarna. Także nie będziesz wkładał na siebie szaty utkanej z dwóch różnych przędzy, jak z wełny i lnu."
  tags: []
"Kpł19,20":
  text: "Jeśli mężczyzna obcuje z kobietą, która jest niewolnicą, poślubioną mężowi, lecz jeszcze niewykupioną ani nieobdarzoną wolnością, oboje będą karani, ale nie zostaną zabici, ponieważ nie była wolna."
  tags: []
"Kpł19,21":
  text: "I przyprowadzi PANU ofiarę za swoje przewinienie przed wejście do Namiotu Zgromadzenia, to jest barana za przewinienie."
  tags: []
"Kpł19,22":
  text: "Wówczas kapłan dokona przed PANEM przebłagania za niego przez barana za przewinienie za jego grzech, którego się dopuścił. I będzie mu odpuszczony jego grzech, który popełnił."
  tags: []
"Kpł19,23":
  text: "A gdy wejdziecie do ziemi i zasadzicie wszelkie drzewa dające owoc, wtedy będziecie uważać ich owoce za nieobrzezane. Przez trzy lata będziecie je mieć za nieobrzezane, nie będziecie ich jeść."
  tags: []
"Kpł19,24":
  text: "Lecz w czwartym roku wszystkie ich owoce będą poświęcone jako ofiara na chwałę PANA."
  tags: []
"Kpł19,25":
  text: "A w piątym roku będziecie jeść ich owoc, aby mnożył się wam jego urodzaj. Ja jestem PAN, wasz Bóg."
  tags: []
"Kpł19,26":
  text: "Nie będziecie jeść niczego z krwią. Nie będziecie uprawiać wróżbiarstwa ani czarów."
  tags: []
"Kpł19,27":
  text: "Nie będziecie obcinać włosów dokoła waszej głowy ani nie będziecie przycinać końców swojej brody."
  tags: []
"Kpł19,28":
  text: "Nie będziecie robić żadnych nacięć na swoim ciele za umarłych ani czynić żadnego piętna na sobie. Ja jestem PAN."
  tags: []
"Kpł19,29":
  text: "Nie będziesz hańbił swojej córki, nakłaniając ją do nierządu, aby ziemia nie uległa nierządowi i nie napełniła się rozpustą."
  tags: []
"Kpł19,30":
  text: "Będziecie przestrzegać moich szabatów i moją świątynię będziecie czcić. Ja jestem PAN."
  tags: []
"Kpł19,31":
  text: "Nie będziecie się zwracać do czarowników ani szukać rady u wróżbitów, abyście się przez nich nie skalali. Ja jestem PAN, wasz Bóg."
  tags: []
"Kpł19,32":
  text: "Przed siwizną wstaniesz i uczcisz osobę starca, i bój się swego Boga. Ja jestem PAN."
  tags: []
"Kpł19,33":
  text: "Jeśli przybysz będzie mieszkał z tobą w waszej ziemi, nie czyńcie mu krzywdy;"
  tags: []
"Kpł19,34":
  text: "Przybysz, który gości u was, będzie jak jeden urodzony wśród was. Będziesz go miłować jak samego siebie, bo i wy byliście przybyszami w ziemi Egiptu. Ja jestem PAN, wasz Bóg."
  tags: []
"Kpł19,35":
  text: "Nie czyńcie nieprawości w sądzie, w miarach, w wagach i w objętości."
  tags: []
"Kpł19,36":
  text: "Wagi sprawiedliwe, odważniki sprawiedliwe, efę sprawiedliwą i kwartę sprawiedliwą będziecie mieć. Ja jestem PAN, wasz Bóg, który wyprowadził was z ziemi Egiptu."
  tags: []
"Kpł19,37":
  text: "Będziecie więc przestrzegać wszystkich moich ustaw i wszystkich moich praw i będziecie je wypełniać. Ja jestem PAN."
  tags: []
