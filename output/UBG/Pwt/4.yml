"Pwt4,1":
  text: "Teraz więc, o Izraelu, słuchaj nakazów i praw, których uczę was wypełniać, abyście żyli i weszli, i posiedli ziemię, którą daje wam PAN, Bóg waszych ojców."
  tags: []
"Pwt4,2":
  text: "Nie dodawajcie do słowa, które ja wam nakazuję, ani z niego nie ujmujcie, abyście przestrzegali przykazań PANA, waszego Boga, które ja wam nakazuję."
  tags: []
"Pwt4,3":
  text: "Wasze oczy widziały, co PAN uczynił z powodu Baal-Peora, jak każdego człowieka, który poszedł za Baal-Peorem, PAN, twój Bóg, wytracił spośród was."
  tags: []
"Pwt4,4":
  text: "A wy, którzy przylgnęliście do PANA, swojego Boga, żyjecie wszyscy aż do dziś."
  tags: []
"Pwt4,5":
  text: "Spójrzcie, nauczyłem was nakazów i praw, jak mi nakazał PAN, mój Bóg, abyście tak czynili w tej ziemi, do której wchodzicie, aby ją wziąć w posiadanie."
  tags: []
"Pwt4,6":
  text: "Przestrzegajcie ich więc i wypełniajcie je; to bowiem jest wasza mądrość i wasz rozum w oczach narodów, które usłyszą o wszystkich tych nakazach i powiedzą: Zaprawdę, ten wielki naród jest mądrym i rozumnym ludem."
  tags: []
"Pwt4,7":
  text: "Który bowiem naród jest tak wielki, by mieć bogów tak bliskich jak PAN, nasz Bóg, we wszystkim, ilekroć go wzywamy?"
  tags: []
"Pwt4,8":
  text: "Albo który naród jest tak wielki, by mieć nakazy i prawa tak sprawiedliwe jak całe to prawo, które dziś wam przedkładam?"
  tags: []
"Pwt4,9":
  text: "Tylko miej się na baczności i strzeż swej duszy pilnie, abyś nie zapomniał o tych rzeczach, które twoje oczy widziały, i aby nie odstępowały one od twego serca po wszystkie dni twego życia. Ale ucz ich swoich synów i synów swoich synów."
  tags: []
"Pwt4,10":
  text: "Nie zapominaj o dniu, w którym stałeś przed PANEM, swoim Bogiem, na Horebie, gdy PAN powiedział do mnie: Zgromadź mi lud, abym im przekazał swoje słowa, aby nauczyli się mnie bać przez wszystkie dni swego życia na ziemi i żeby uczyli tego swoich synów."
  tags: []
"Pwt4,11":
  text: "Wtedy zbliżyliście się i stanęliście pod górą, a góra płonęła ogniem aż po samo niebo, okryta ciemnością, obłokiem i mrokiem."
  tags: []
"Pwt4,12":
  text: "I PAN przemówił do was spośród ognia. Usłyszeliście dźwięk słów, lecz nie widzieliście żadnej postaci, tylko głos usłyszeliście."
  tags: []
"Pwt4,13":
  text: "Wówczas oznajmił wam swoje przymierze, które nakazał wam wypełniać, dziesięć przykazań, które napisał na dwóch kamiennych tablicach."
  tags: []
"Pwt4,14":
  text: "W tym czasie PAN rozkazał mi nauczać was nakazów i praw, abyście je wypełniali w ziemi, do której idziecie, aby ją wziąć w posiadanie."
  tags: []
"Pwt4,15":
  text: "Strzeżcie więc pilnie swoich dusz, gdyż nie widzieliście żadnej postaci w dniu, w którym PAN przemówił do was na Horebie spośród ognia;"
  tags: []
"Pwt4,16":
  text: "Abyście się nie zepsuli i nie czynili sobie rzeźbionego posągu, podobizny wszelkiej postaci w kształcie mężczyzny lub kobiety;"
  tags: []
"Pwt4,17":
  text: "W kształcie jakiegokolwiek zwierzęcia, które jest na ziemi, w kształcie wszelkiego ptaka skrzydlatego, który lata w powietrzu;"
  tags: []
"Pwt4,18":
  text: "W kształcie czegokolwiek, co pełza po ziemi, w kształcie wszelkiej ryby, która jest w wodach pod ziemią."
  tags: []
"Pwt4,19":
  text: "I abyś – gdy podniesiesz swoje oczy ku niebu i ujrzysz słońce, księżyc i gwiazdy, cały zastęp niebios – nie dał się zwieść, by oddać im pokłon i im służyć, ponieważ PAN, twój Bóg, przydzielił je wszystkim ludom pod całym niebem."
  tags: []
"Pwt4,20":
  text: "Lecz PAN was wziął i wyprowadził z pieca do topienia żelaza, z Egiptu, abyście byli jego ludem, jego dziedzictwem, jak dziś jesteście."
  tags: []
"Pwt4,21":
  text: "I PAN rozgniewał się na mnie z waszego powodu, i przysiągł, że nie przejdę Jordanu i nie wejdę do tej dobrej ziemi, którą PAN, twój Bóg, daje tobie w dziedzictwo."
  tags: []
"Pwt4,22":
  text: "Ja bowiem umrę w tej ziemi, nie przejdę Jordanu. Wy zaś przejdziecie i posiądziecie tę dobrą ziemię."
  tags: []
"Pwt4,23":
  text: "Strzeżcie się, abyście nie zapomnieli o przymierzu PANA, swojego Boga, które z wami zawarł, i nie czynili sobie żadnego rzeźbionego posągu lub podobizny czegokolwiek, czego ci zakazał PAN, twój Bóg."
  tags: []
"Pwt4,24":
  text: "Bo PAN, twój Bóg, jest ogniem trawiącym, Bogiem zazdrosnym."
  tags: []
"Pwt4,25":
  text: "Gdy urodzisz synów i wnuki i zestarzejecie się w tej ziemi, jeśli popsujecie się i uczynicie sobie rzeźbiony posąg lub podobiznę czegokolwiek, i dopuścicie się zła w oczach PANA, swojego Boga, pobudzając go do gniewu;"
  tags: []
"Pwt4,26":
  text: "To biorę dziś na świadków przeciwko wam niebo i ziemię, że prędko wyginiecie doszczętnie z ziemi, do której przejdziecie przez Jordan, aby ją posiąść; nie przedłużycie w niej swych dni, bo zostaniecie całkowicie wytępieni."
  tags: []
"Pwt4,27":
  text: "PAN rozproszy was między narodami i mało z was zostanie pośród narodów, do których PAN was zaprowadzi."
  tags: []
"Pwt4,28":
  text: "Tam będziecie służyli bogom, dziełom ludzkich rąk, drewnu i kamieniowi, które nie widzą ani nie słyszą, nie jedzą ani nie wąchają."
  tags: []
"Pwt4,29":
  text: "Jeśli jednak stamtąd będziesz szukać PANA, swego Boga, wtedy znajdziesz go, jeśli będziesz go szukał całym swym sercem i całą swą duszą."
  tags: []
"Pwt4,30":
  text: "Gdy znajdziesz się w ucisku i spotka cię to wszystko w ostatnich dniach, jeśli wtedy zawrócisz do PANA, swego Boga, i będziesz słuchał jego głosu;"
  tags: []
"Pwt4,31":
  text: "Ponieważ PAN, twój Bóg, jest miłosiernym Bogiem, nie opuści cię ani cię nie zniszczy, ani nie zapomni o przymierzu z twoimi ojcami, które im poprzysiągł."
  tags: []
"Pwt4,32":
  text: "Zapytaj się bowiem dawnych czasów, które były przed tobą od dnia, kiedy Bóg stworzył człowieka na ziemi, i od jednego krańca nieba aż do drugiego, czy stała się kiedykolwiek rzecz podobna do tej tak wielkiej albo czy słyszano kiedykolwiek o czymś takim?"
  tags: []
"Pwt4,33":
  text: "Czy słyszał kiedykolwiek jakiś naród głos Boga mówiącego spośród ognia, tak jak ty słyszałeś, i pozostał żywy?"
  tags: []
"Pwt4,34":
  text: "Albo czy Bóg spróbował przyjść i wziąć sobie naród spośród innego narodu przez doświadczenia, przez znaki, przez cuda i przez wojny, potężną ręką i wyciągniętym ramieniem, wśród wielkich i strasznych dzieł jak to wszystko, co na twoich oczach PAN, wasz Bóg, uczynił dla was w Egipcie?"
  tags: []
"Pwt4,35":
  text: "Tobie to ukazano, abyś wiedział, że PAN jest Bogiem i nie ma innego oprócz niego."
  tags: []
"Pwt4,36":
  text: "Dał ci słyszeć swój głos z nieba, aby cię pouczyć, a na ziemi ukazał ci swój wielki ogień i usłyszałeś jego słowa spośród ognia."
  tags: []
"Pwt4,37":
  text: "A ponieważ umiłował twoich ojców, wybrał ich potomstwo po nich i wyprowadził cię z Egiptu przed sobą swoją wielką mocą;"
  tags: []
"Pwt4,38":
  text: "Aby wypędzić przed tobą narody większe i potężniejsze od ciebie, by cię wprowadzić i dać ci ich ziemię w dziedzictwo, jak to jest dzisiaj."
  tags: []
"Pwt4,39":
  text: "Poznaj więc dziś i weź to sobie do swego serca, że PAN jest Bogiem wysoko na niebie i nisko na ziemi. Nie ma innego."
  tags: []
"Pwt4,40":
  text: "Przestrzegaj więc jego nakazów i przykazań, które dziś tobie nakładam, aby się dobrze powodziło tobie i twoim synom po tobie; abyś też przedłużył swe dni na ziemi, którą PAN, twój Bóg, daje tobie przez wszystkie dni."
  tags: []
"Pwt4,41":
  text: "Wtedy Mojżesz wydzielił trzy miasta po tej stronie Jordanu na wschodzie;"
  tags: []
"Pwt4,42":
  text: "Aby mógł tam uciec zabójca, który zabił swego bliźniego nieumyślnie i wcześniej nie nienawidził go, aby uciekł on do jednego z tych miast i pozostał żywy:"
  tags: []
"Pwt4,43":
  text: "Beser na pustyni, w ziemi równinnej Rubenitów, Ramot w Gileadzie Gadytów i Golan w Baszanie Manassytów."
  tags: []
"Pwt4,44":
  text: "Oto prawo, które Mojżesz przedłożył synom Izraela."
  tags: []
"Pwt4,45":
  text: "To są świadectwa, nakazy i prawa, które Mojżesz ogłosił synom Izraela, kiedy wyszli z Egiptu;"
  tags: []
"Pwt4,46":
  text: "Po tej stronie Jordanu, w dolinie naprzeciw Bet-Peor, w ziemi Sichona, króla Amorytów, mieszkającego w Cheszbonie, którego Mojżesz i synowie Izraela pobili po wyjściu z Egiptu;"
  tags: []
"Pwt4,47":
  text: "I posiedli jego ziemię i ziemię Oga, króla Baszanu – dwóch królów Amorytów, którzy byli po tej stronie Jordanu na wschodzie;"
  tags: []
"Pwt4,48":
  text: "Od Aroeru, leżącego nad brzegiem rzeki Arnon, aż do góry Sirion, czyli Hermon;"
  tags: []
"Pwt4,49":
  text: "I całą równinę po tej stronie Jordanu na wschodzie aż do Morza Pustego, pod zdrojami Pizga."
  tags: []
