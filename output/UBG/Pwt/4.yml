"Pwt4,1": "Teraz więc, o Izraelu, słuchaj nakazów i praw, których uczę was wypełniać, abyście żyli i weszli, i posiedli ziemię, którą daje wam PAN, Bóg waszych ojców."
"Pwt4,2": "Nie dodawajcie do słowa, które ja wam nakazuję, ani z niego nie ujmujcie, abyście przestrzegali przykazań PANA, waszego Boga, które ja wam nakazuję."
"Pwt4,3": "Wasze oczy widziały, co PAN uczynił z powodu Baal-Peora, jak każdego człowieka, który poszedł za Baal-Peorem, PAN, twój Bóg, wytracił spośród was."
"Pwt4,4": "A wy, którzy przylgnęliście do PANA, swojego Boga, żyjecie wszyscy aż do dziś."
"Pwt4,5": "Spójrzcie, nauczyłem was nakazów i praw, jak mi nakazał PAN, mój Bóg, abyście tak czynili w tej ziemi, do której wchodzicie, aby ją wziąć w posiadanie."
"Pwt4,6": "Przestrzegajcie ich więc i wypełniajcie je; to bowiem jest wasza mądrość i wasz rozum w oczach narodów, które usłyszą o wszystkich tych nakazach i powiedzą: Zaprawdę, ten wielki naród jest mądrym i rozumnym ludem."
"Pwt4,7": "Który bowiem naród jest tak wielki, by mieć bogów tak bliskich jak PAN, nasz Bóg, we wszystkim, ilekroć go wzywamy?"
"Pwt4,8": "Albo który naród jest tak wielki, by mieć nakazy i prawa tak sprawiedliwe jak całe to prawo, które dziś wam przedkładam?"
"Pwt4,9": "Tylko miej się na baczności i strzeż swej duszy pilnie, abyś nie zapomniał o tych rzeczach, które twoje oczy widziały, i aby nie odstępowały one od twego serca po wszystkie dni twego życia. Ale ucz ich swoich synów i synów swoich synów."
"Pwt4,10": "Nie zapominaj o dniu, w którym stałeś przed PANEM, swoim Bogiem, na Horebie, gdy PAN powiedział do mnie: Zgromadź mi lud, abym im przekazał swoje słowa, aby nauczyli się mnie bać przez wszystkie dni swego życia na ziemi i żeby uczyli tego swoich synów."
"Pwt4,11": "Wtedy zbliżyliście się i stanęliście pod górą, a góra płonęła ogniem aż po samo niebo, okryta ciemnością, obłokiem i mrokiem."
"Pwt4,12": "I PAN przemówił do was spośród ognia. Usłyszeliście dźwięk słów, lecz nie widzieliście żadnej postaci, tylko głos usłyszeliście."
"Pwt4,13": "Wówczas oznajmił wam swoje przymierze, które nakazał wam wypełniać, dziesięć przykazań, które napisał na dwóch kamiennych tablicach."
"Pwt4,14": "W tym czasie PAN rozkazał mi nauczać was nakazów i praw, abyście je wypełniali w ziemi, do której idziecie, aby ją wziąć w posiadanie."
"Pwt4,15": "Strzeżcie więc pilnie swoich dusz, gdyż nie widzieliście żadnej postaci w dniu, w którym PAN przemówił do was na Horebie spośród ognia;"
"Pwt4,16": "Abyście się nie zepsuli i nie czynili sobie rzeźbionego posągu, podobizny wszelkiej postaci w kształcie mężczyzny lub kobiety;"
"Pwt4,17": "W kształcie jakiegokolwiek zwierzęcia, które jest na ziemi, w kształcie wszelkiego ptaka skrzydlatego, który lata w powietrzu;"
"Pwt4,18": "W kształcie czegokolwiek, co pełza po ziemi, w kształcie wszelkiej ryby, która jest w wodach pod ziemią."
"Pwt4,19": "I abyś – gdy podniesiesz swoje oczy ku niebu i ujrzysz słońce, księżyc i gwiazdy, cały zastęp niebios – nie dał się zwieść, by oddać im pokłon i im służyć, ponieważ PAN, twój Bóg, przydzielił je wszystkim ludom pod całym niebem."
"Pwt4,20": "Lecz PAN was wziął i wyprowadził z pieca do topienia żelaza, z Egiptu, abyście byli jego ludem, jego dziedzictwem, jak dziś jesteście."
"Pwt4,21": "I PAN rozgniewał się na mnie z waszego powodu, i przysiągł, że nie przejdę Jordanu i nie wejdę do tej dobrej ziemi, którą PAN, twój Bóg, daje tobie w dziedzictwo."
"Pwt4,22": "Ja bowiem umrę w tej ziemi, nie przejdę Jordanu. Wy zaś przejdziecie i posiądziecie tę dobrą ziemię."
"Pwt4,23": "Strzeżcie się, abyście nie zapomnieli o przymierzu PANA, swojego Boga, które z wami zawarł, i nie czynili sobie żadnego rzeźbionego posągu lub podobizny czegokolwiek, czego ci zakazał PAN, twój Bóg."
"Pwt4,24": "Bo PAN, twój Bóg, jest ogniem trawiącym, Bogiem zazdrosnym."
"Pwt4,25": "Gdy urodzisz synów i wnuki i zestarzejecie się w tej ziemi, jeśli popsujecie się i uczynicie sobie rzeźbiony posąg lub podobiznę czegokolwiek, i dopuścicie się zła w oczach PANA, swojego Boga, pobudzając go do gniewu;"
"Pwt4,26": "To biorę dziś na świadków przeciwko wam niebo i ziemię, że prędko wyginiecie doszczętnie z ziemi, do której przejdziecie przez Jordan, aby ją posiąść; nie przedłużycie w niej swych dni, bo zostaniecie całkowicie wytępieni."
"Pwt4,27": "PAN rozproszy was między narodami i mało z was zostanie pośród narodów, do których PAN was zaprowadzi."
"Pwt4,28": "Tam będziecie służyli bogom, dziełom ludzkich rąk, drewnu i kamieniowi, które nie widzą ani nie słyszą, nie jedzą ani nie wąchają."
"Pwt4,29": "Jeśli jednak stamtąd będziesz szukać PANA, swego Boga, wtedy znajdziesz go, jeśli będziesz go szukał całym swym sercem i całą swą duszą."
"Pwt4,30": "Gdy znajdziesz się w ucisku i spotka cię to wszystko w ostatnich dniach, jeśli wtedy zawrócisz do PANA, swego Boga, i będziesz słuchał jego głosu;"
"Pwt4,31": "Ponieważ PAN, twój Bóg, jest miłosiernym Bogiem, nie opuści cię ani cię nie zniszczy, ani nie zapomni o przymierzu z twoimi ojcami, które im poprzysiągł."
"Pwt4,32": "Zapytaj się bowiem dawnych czasów, które były przed tobą od dnia, kiedy Bóg stworzył człowieka na ziemi, i od jednego krańca nieba aż do drugiego, czy stała się kiedykolwiek rzecz podobna do tej tak wielkiej albo czy słyszano kiedykolwiek o czymś takim?"
"Pwt4,33": "Czy słyszał kiedykolwiek jakiś naród głos Boga mówiącego spośród ognia, tak jak ty słyszałeś, i pozostał żywy?"
"Pwt4,34": "Albo czy Bóg spróbował przyjść i wziąć sobie naród spośród innego narodu przez doświadczenia, przez znaki, przez cuda i przez wojny, potężną ręką i wyciągniętym ramieniem, wśród wielkich i strasznych dzieł jak to wszystko, co na twoich oczach PAN, wasz Bóg, uczynił dla was w Egipcie?"
"Pwt4,35": "Tobie to ukazano, abyś wiedział, że PAN jest Bogiem i nie ma innego oprócz niego."
"Pwt4,36": "Dał ci słyszeć swój głos z nieba, aby cię pouczyć, a na ziemi ukazał ci swój wielki ogień i usłyszałeś jego słowa spośród ognia."
"Pwt4,37": "A ponieważ umiłował twoich ojców, wybrał ich potomstwo po nich i wyprowadził cię z Egiptu przed sobą swoją wielką mocą;"
"Pwt4,38": "Aby wypędzić przed tobą narody większe i potężniejsze od ciebie, by cię wprowadzić i dać ci ich ziemię w dziedzictwo, jak to jest dzisiaj."
"Pwt4,39": "Poznaj więc dziś i weź to sobie do swego serca, że PAN jest Bogiem wysoko na niebie i nisko na ziemi. Nie ma innego."
"Pwt4,40": "Przestrzegaj więc jego nakazów i przykazań, które dziś tobie nakładam, aby się dobrze powodziło tobie i twoim synom po tobie; abyś też przedłużył swe dni na ziemi, którą PAN, twój Bóg, daje tobie przez wszystkie dni."
"Pwt4,41": "Wtedy Mojżesz wydzielił trzy miasta po tej stronie Jordanu na wschodzie;"
"Pwt4,42": "Aby mógł tam uciec zabójca, który zabił swego bliźniego nieumyślnie i wcześniej nie nienawidził go, aby uciekł on do jednego z tych miast i pozostał żywy:"
"Pwt4,43": "Beser na pustyni, w ziemi równinnej Rubenitów, Ramot w Gileadzie Gadytów i Golan w Baszanie Manassytów."
"Pwt4,44": "Oto prawo, które Mojżesz przedłożył synom Izraela."
"Pwt4,45": "To są świadectwa, nakazy i prawa, które Mojżesz ogłosił synom Izraela, kiedy wyszli z Egiptu;"
"Pwt4,46": "Po tej stronie Jordanu, w dolinie naprzeciw Bet-Peor, w ziemi Sichona, króla Amorytów, mieszkającego w Cheszbonie, którego Mojżesz i synowie Izraela pobili po wyjściu z Egiptu;"
"Pwt4,47": "I posiedli jego ziemię i ziemię Oga, króla Baszanu – dwóch królów Amorytów, którzy byli po tej stronie Jordanu na wschodzie;"
"Pwt4,48": "Od Aroeru, leżącego nad brzegiem rzeki Arnon, aż do góry Sirion, czyli Hermon;"
"Pwt4,49": "I całą równinę po tej stronie Jordanu na wschodzie aż do Morza Pustego, pod zdrojami Pizga."
