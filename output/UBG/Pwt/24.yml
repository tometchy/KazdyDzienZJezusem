"Pwt24,1":
  text: "Jeśli mężczyzna poślubi kobietę i zostanie jej mężem, a potem zdarzy się, że nie znajdzie ona upodobania w jego oczach, gdyż znalazł u niej coś nieprzyzwoitego, wtedy wypisze jej list rozwodowy, wręczy go jej i odprawi ją ze swego domu."
  tags: []
"Pwt24,2":
  text: "A gdy ona opuści jego dom, może wyjść za mąż za innego."
  tags: []
"Pwt24,3":
  text: "A jeśli drugi mąż ją znienawidzi, wypisze jej list rozwodowy, wręczy go jej i odprawi ją ze swego domu, albo jeśli umrze ten drugi mąż, który pojął ją za żonę;"
  tags: []
"Pwt24,4":
  text: "To ten pierwszy mąż, który ją odprawił, nie będzie mógł powtórnie pojąć jej za żonę, gdyż jest ona splugawiona; to bowiem jest obrzydliwością przed PANEM. Nie dopuszczaj do popełnienia takiego grzechu w ziemi, którą PAN, twój Bóg, daje ci w dziedzictwo."
  tags: []
"Pwt24,5":
  text: "Mężczyzna, który niedawno się ożenił, nie pójdzie na wojnę ani nie będzie obciążony żadnym obowiązkiem pracy. Będzie wolny w swym domu przez jeden rok i będzie cieszyć się swoją żoną, którą pojął."
  tags: []
"Pwt24,6":
  text: "Nikt nie weźmie w zastaw kamienia młyńskiego górnego ani dolnego, gdyż to brałby jakby jego życie w zastaw."
  tags: []
"Pwt24,7":
  text: "Jeśli znajdzie się człowiek, który porwał kogoś ze swych braci, z synów Izraela, i handluje nim lub go sprzedał, to ten złodziej poniesie śmierć; tak usuniesz zło spośród siebie."
  tags: []
"Pwt24,8":
  text: "Uważaj na plagę trądu, aby pilnie przestrzegać i czynić wszystko, czego was uczą kapłani Lewici. Dopilnujcie wypełnienia tego, co im nakazałem."
  tags: []
"Pwt24,9":
  text: "Pamiętaj o tym, co PAN, twój Bóg, uczynił Miriam w drodze, gdy wyszliście z Egiptu."
  tags: []
"Pwt24,10":
  text: "Gdy coś pożyczysz swemu bliźniemu, nie wchodź do jego domu, aby wziąć od niego zastaw."
  tags: []
"Pwt24,11":
  text: "Będziesz stał na dworze, a człowiek, któremu pożyczyłeś, wyniesie do ciebie zastaw przed dom."
  tags: []
"Pwt24,12":
  text: "A jeśli ten człowiek jest ubogi, nie położysz się spać z jego zastawem."
  tags: []
"Pwt24,13":
  text: "Koniecznie zwrócisz mu zastaw o zachodzie słońca, żeby mógł spać w swojej odzieży i błogosławić cię. To zostanie ci poczytane za sprawiedliwość przed PANEM, twoim Bogiem."
  tags: []
"Pwt24,14":
  text: "Nie wyrządzisz krzywdy ubogiemu i nędznemu najemnikowi spośród swoich braci lub obcych, którzy są w twojej ziemi, w obrębie twoich bram."
  tags: []
"Pwt24,15":
  text: "Tego samego dnia dasz mu jego zapłatę, przed zachodem słońca. Jest bowiem ubogi i z tego się żywi; by nie wołał do PANA przeciwko tobie, a to obciążyło cię grzechem."
  tags: []
"Pwt24,16":
  text: "Ojcowie nie poniosą śmierci za dzieci ani dzieci nie poniosą śmierci za ojców. Każdy za swój grzech poniesie śmierć."
  tags: []
"Pwt24,17":
  text: "Nie naginaj sądu obcego ani sieroty i nie bierz w zastaw odzieży wdowy;"
  tags: []
"Pwt24,18":
  text: "Ale pamiętaj, że byłeś niewolnikiem w Egipcie i że PAN, twój Bóg, wybawił cię stamtąd. Dlatego nakazuję ci, abyś to czynił."
  tags: []
"Pwt24,19":
  text: "Gdy będziesz żął zboże na swoim polu i zapomnisz snopka na polu, to nie wracaj, aby go wziąć. Będzie to dla obcego, sieroty i wdowy, aby ci błogosławił PAN, twój Bóg, w każdym dziele twoich rąk."
  tags: []
"Pwt24,20":
  text: "Gdy będziesz otrząsał swoje drzewo oliwne, nie przeglądaj drugi raz gałązek. Będzie to dla obcego, sieroty i wdowy."
  tags: []
"Pwt24,21":
  text: "Gdy będziesz zbierał winogrona ze swojej winnicy, nie zbieraj pozostałych gron. Będzie to dla obcego, sieroty i wdowy."
  tags: []
"Pwt24,22":
  text: "I pamiętaj, że byłeś niewolnikiem w ziemi Egiptu. Dlatego nakazuję ci, abyś to czynił."
  tags: []
