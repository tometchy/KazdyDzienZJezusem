"Pwt18,1":
  text: "Kapłani lewiccy oraz całe pokolenie Lewiego nie będą mieli działu ani dziedzictwa z Izraelem. Będą spożywać ofiary ogniowe PANA i jego dziedzictwo."
  tags: []
"Pwt18,2":
  text: "Nie będą mieli dziedzictwa pośród swoich braci. PAN jest ich dziedzictwem, tak jak im powiedział."
  tags: []
"Pwt18,3":
  text: "A taka będzie należność kapłanów od ludu, od tych, którzy składają ofiarę, czy to wołu, czy owcę: oddadzą kapłanowi łopatkę, obie szczęki i żołądek."
  tags: []
"Pwt18,4":
  text: "Oddasz mu pierwociny swego zboża, wina i oliwy oraz pierwociny wełny ze swoich owiec."
  tags: []
"Pwt18,5":
  text: "Jego bowiem wybrał PAN, twój Bóg, ze wszystkich twoich pokoleń, aby stawał i służył w imię PANA, on i jego synowie, po wszystkie dni."
  tags: []
"Pwt18,6":
  text: "A jeśli przyjdzie Lewita z jednego z twoich miast z całego Izraela, gdzie przebywa, a przyjdzie z całym pragnieniem swej duszy do miejsca, które PAN wybierze;"
  tags: []
"Pwt18,7":
  text: "Wtedy będzie służyć w imię PANA, swego Boga, tak jak wszyscy jego bracia Lewici, którzy tam stoją przed PANEM."
  tags: []
"Pwt18,8":
  text: "Będą jeść równą część oprócz tego, co mają ze sprzedaży ojcowizny."
  tags: []
"Pwt18,9":
  text: "Gdy wejdziesz do ziemi, którą PAN, twój Bóg, ci daje, nie ucz się postępować według obrzydliwości tych narodów."
  tags: []
"Pwt18,10":
  text: "Niech nie znajdzie się pośród was nikt, kto by przeprowadzał swego syna lub córkę przez ogień, ani wróżbita, ani wróżbiarz, ani jasnowidz, ani czarownik;"
  tags: []
"Pwt18,11":
  text: "Ani zaklinacz, ani nikt, kto by wywoływał duchy, ani czarnoksiężnik, ani nekromanta."
  tags: []
"Pwt18,12":
  text: "Każdy bowiem, kto czyni takie rzeczy, budzi odrazę w PANU. Z powodu tych obrzydliwości PAN, twój Bóg, wypędza przed tobą te narody."
  tags: []
"Pwt18,13":
  text: "Będziesz doskonały przed PANEM, swoim Bogiem."
  tags: []
"Pwt18,14":
  text: "Gdyż te narody, które opanujesz, słuchają wieszczbiarzy i wróżbitów, lecz tobie nie pozwala na to PAN, twój Bóg."
  tags: []
"Pwt18,15":
  text: "PAN, twój Bóg, wzbudzi ci proroka podobnego do mnie spośród ciebie, spośród twoich braci. Jego będziecie słuchać;"
  tags: []
"Pwt18,16":
  text: "Zgodnie z tym wszystkim, o co prosiłeś PANA, swego Boga, na Horebie, w dniu zgromadzenia: Niech już nie słucham głosu PANA, swego Boga, i niech już nie patrzę na ten wielki ogień, abym nie umarł."
  tags: []
"Pwt18,17":
  text: "Wtedy PAN powiedział do mnie: Słusznie powiedzieli."
  tags: []
"Pwt18,18":
  text: "Wzbudzę im proroka podobnego do ciebie spośród ich braci i włożę moje słowa w jego usta, a on powie im wszystko, co mu rozkażę."
  tags: []
"Pwt18,19":
  text: "I jeśli ktoś nie będzie posłuszny moim słowom, które będzie on mówić w moim imieniu, zażądam od niego zdania sprawy."
  tags: []
"Pwt18,20":
  text: "Natomiast prorok, który odważy się mówić słowo w moim imieniu, którego mu nie nakazałem mówić, albo będzie mówił w imieniu obcych bogów, taki prorok poniesie śmierć."
  tags: []
"Pwt18,21":
  text: "A jeśli powiesz w swym sercu: Jak rozpoznamy to słowo, którego PAN nie wypowiedział?"
  tags: []
"Pwt18,22":
  text: "Gdy prorok będzie coś mówił w imieniu PANA, a to się nie spełni ani nie nastąpi, to jest to słowo, którego PAN nie wypowiedział, lecz prorok mówił to z zuchwalstwa. Nie bój się go."
  tags: []
