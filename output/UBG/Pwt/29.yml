"Pwt29,1": "To są słowa przymierza, które PAN nakazał Mojżeszowi zawrzeć z synami Izraela w ziemi Moabu, oprócz przymierza, które zawarł z nimi na Horebie."
"Pwt29,2": "I Mojżesz zwołał cały Izrael, i przemówił do nich: Widzieliście wszystko, co PAN uczynił na waszych oczach w ziemi Egiptu faraonowi, wszystkim jego sługom i całej jego ziemi:"
"Pwt29,3": "Te wielkie próby, które widziały twoje oczy, znaki i wielkie cuda."
"Pwt29,4": "Ale PAN nie dał wam serca do zrozumienia ani oczu do patrzenia, ani uszu do słuchania aż do dziś."
"Pwt29,5": "I prowadziłem was przez czterdzieści lat po pustyni. Wasze szaty nie zniszczyły się na was i wasze obuwie na waszych nogach się nie zużyło."
"Pwt29,6": "Nie jedliście chleba, nie piliście wina i mocnego napoju, abyście poznali, że ja jestem PAN, wasz Bóg."
"Pwt29,7": "A gdy przyszliście na to miejsce, Sichon, król Cheszbonu, i Og, król Baszanu, wyruszyli przeciwko nam do walki, i pobiliśmy ich."
"Pwt29,8": "I wzięliśmy ich ziemię, i daliśmy ją jako dziedzictwo Rubenitom, Gadytom i połowie pokolenia Manassesa."
"Pwt29,9": "Przestrzegajcie więc słów tego przymierza i wypełniajcie je, aby się wam szczęśliwie powodziło we wszystkim, co będziecie czynić."
"Pwt29,10": "Stoicie dziś wszyscy przed PANEM, swoim Bogiem: naczelnicy waszych pokoleń, wasi starsi, wasi przełożeni, wszyscy mężczyźni Izraela;"
"Pwt29,11": "Wasze dzieci, wasze żony i przybysz, który mieszka w twoim obozie; od tego, który rąbie drwa, po tego, który czerpie wodę;"
"Pwt29,12": "Aby wejść w przymierze z PANEM, swoim Bogiem, i w jego przysięgę, którą PAN, twój Bóg, zawiera dziś z tobą;"
"Pwt29,13": "Aby cię dziś ustanowić dla siebie ludem i żeby on sam był dla ciebie Bogiem, tak jak ci powiedział i tak jak poprzysiągł twoim ojcom: Abrahamowi, Izaakowi i Jakubowi."
"Pwt29,14": "Nie tylko z wami zawieram to przymierze i tę przysięgę;"
"Pwt29,15": "Lecz z każdym, kto dziś stoi tu z nami przed PANEM, naszym Bogiem, i z każdym, kogo tu dziś z nami nie ma."
"Pwt29,16": "Wy bowiem wiecie, jak mieszkaliśmy w ziemi Egiptu i jak przechodziliśmy wśród narodów, które minęliśmy;"
"Pwt29,17": "I widzieliście ich obrzydliwości i posągi z drewna i kamienia, ze srebra i złota, które są u nich."
"Pwt29,18": "Niech nie będzie wśród was mężczyzny ani kobiety, ani rodziny, ani pokolenia, których serce odwróciłoby się dziś od PANA, naszego Boga, by iść i służyć bogom tych narodów i żeby nie było wśród was korzenia wydającego żółć i piołun;"
"Pwt29,19": "Który gdy usłyszy słowa tego przekleństwa, pobłogosławi sobie w sercu, mówiąc: Będę miał pokój, chociaż będę postępował według zdania mego serca, dodając pijaństwo do pragnienia."
"Pwt29,20": "PAN nie zechce mu przebaczyć, lecz zapali się gniew PANA i jego zazdrość przeciwko temu człowiekowi, spadną na niego wszystkie przekleństwa, które są zapisane w tej księdze, i PAN wymaże jego imię spod nieba."
"Pwt29,21": "I PAN go oddzieli ku złemu ze wszystkich pokoleń Izraela według wszystkich przekleństw przymierza zapisanych w księdze tego Prawa."
"Pwt29,22": "A wasze przyszłe pokolenie, wasi synowie, którzy powstaną po was, i cudzoziemiec, który przyjdzie z dalekiej ziemi, powiedzą, gdy zobaczą plagi tej ziemi i choroby, którymi PAN ją dotknął;"
"Pwt29,23": "Bo siarka i sól wypalą całą tę ziemię, że nie będzie obsiewana ani też nie będzie wydawać owocu i nie urośnie na niej żadna trawa jak w przypadku zniszczenia Sodomy i Gomory, Admy i Seboim, które PAN zniszczył w swoim gniewie i zapalczywości;"
"Pwt29,24": "A zapytają wszystkie narody: Dlaczego PAN tak postąpił z tą ziemią? Cóż to za żar tej wielkiej zapalczywości?"
"Pwt29,25": "I odpowiedzą: Ponieważ porzucili przymierze PANA, Boga swych ojców, które zawarł z nimi, gdy ich wyprowadził z ziemi Egiptu."
"Pwt29,26": "Poszli bowiem służyć innym bogom i oddali im pokłon – bogom, których nie znali i których im nie przydzielił."
"Pwt29,27": "Dlatego gniew PANA zapłonął przeciw tej ziemi, aby sprowadzić na nią wszelkie przekleństwa zapisane w tej księdze."
"Pwt29,28": "I PAN wykorzenił ich z ich ziemi w gniewie i zapalczywości oraz w wielkim oburzeniu i wyrzucił ich do obcej ziemi, jak to dziś widzicie."
"Pwt29,29": "Rzeczy tajemne należą do PANA, naszego Boga, a objawione – do nas i naszych synów na wieki, abyśmy wypełniali wszystkie słowa tego prawa."
