"Pwt15,1": "Po upływie każdego siódmego roku ustanowisz darowanie długów."
"Pwt15,2": "A to jest sposób darowania: każdy wierzyciel daruje pożyczkę, jakiej udzielił swemu bliźniemu; nie będzie domagał się zwrotu od swego bliźniego lub od swego brata, ponieważ obwołano darowanie długów dla PANA."
"Pwt15,3": "Od obcego możesz domagać się zwrotu, lecz co będziesz miał u swego brata, twoja ręka daruje;"
"Pwt15,4": "Do czasu, gdy nie będzie pośród was ubogich, ponieważ PAN będzie cię hojnie błogosławił w ziemi, którą PAN, twój Bóg, daje ci w dziedziczne posiadanie."
"Pwt15,5": "Jeśli tylko będziesz uważnie słuchał głosu PANA, swego Boga, byś pilnował wypełniania wszystkich przykazań, które dziś ci nakazuję;"
"Pwt15,6": "Gdyż PAN, twój Bóg, będzie cię błogosławić, tak jak ci obiecał; będziesz pożyczał wielu narodom, a sam od nikogo nie będziesz pożyczał; będziesz panował nad wieloma narodami, a one nad tobą nie zapanują."
"Pwt15,7": "Jeśli będzie u ciebie jakiś ubogi spośród twoich braci w którymkolwiek z twoich miast w ziemi, którą ci daje PAN, twój Bóg, nie zatwardzaj swego serca ani nie zamykaj swej ręki przed swoim ubogim bratem;"
"Pwt15,8": "Ale hojnie otworzysz mu swoją rękę i chętnie pożyczysz mu tyle, ile będzie potrzebował, czego mu będzie brakowało."
"Pwt15,9": "Strzeż się, by nie powstała w twoim sercu niegodziwa myśl, byś nie mówił: Zbliża się rok siódmy, rok darowania długów – i abyś nie patrzył surowo na swego ubogiego brata i nic mu nie dał; wtedy on wołałby do PANA przeciwko tobie i obciążyłbyś się grzechem;"
"Pwt15,10": "Chętnie mu dasz i twoje serce nie będzie ubolewało, gdy mu dajesz, gdyż PAN, twój Bóg, będzie cię za to błogosławił w każdym twoim dziele i w każdym twoim przedsięwzięciu."
"Pwt15,11": "Ubogich bowiem nie zabraknie w waszej ziemi. Dlatego nakazuję ci: Otworzysz hojnie swoją rękę swemu bratu, nędznemu i ubogiemu w twej ziemi."
"Pwt15,12": "Jeśli zaprzeda ci się twój brat, Hebrajczyk lub Hebrajka, a będzie ci służyć przez sześć lat, to w siódmym roku wypuścisz go od siebie na wolność."
"Pwt15,13": "A gdy wypuścisz go od siebie na wolność, nie wypuścisz go z pustymi rękami."
"Pwt15,14": "Hojnie go obdarujesz ze swego bydła, klepiska i tłoczni. Dasz mu z tego, w czym pobłogosławił cię PAN, twój Bóg."
"Pwt15,15": "I będziesz pamiętać, że sam byłeś niewolnikiem w ziemi Egiptu i że, PAN, twój Bóg, wykupił cię. Dlatego ja nakazuję ci to dziś."
"Pwt15,16": "Ale jeśli on ci powie: Nie odejdę od ciebie – bo miłuje ciebie i twój dom i ponieważ jest mu u ciebie dobrze;"
"Pwt15,17": "Wtedy weźmiesz szydło i przekłujesz mu ucho, przykładając je o drzwi, i będzie twoim sługą na wieki. Tak samo postąpisz ze swoją służącą."
"Pwt15,18": "Niech nie będzie ci przykro, że wypuścisz go od siebie na wolność, gdyż służąc ci przez sześć lat, wysłużył podwójną zapłatę najemnika. A PAN, twój Bóg, będzie cię błogosławił we wszystkim, co uczynisz."
"Pwt15,19": "Każdego pierworodnego samca ze swego bydła albo z owiec poświęcisz PANU, swemu Bogu. Nie będziesz używał do pracy pierworodnego z cielców ani nie będziesz strzygł pierworodnego ze swoich owiec."
"Pwt15,20": "Będziesz je spożywał każdego roku przed PANEM, swoim Bogiem, ty i twój dom, w miejscu, które wybierze PAN;"
"Pwt15,21": "A gdyby miało jakąś wadę, było kulawe, ślepe lub miało jakąkolwiek inną wadę, nie złożysz go na ofiarę PANU, swemu Bogu."
"Pwt15,22": "Zjesz je w swoich bramach. Zarówno nieczysty, jak i czysty może je jeść, tak jak sarnę i jelenia;"
"Pwt15,23": "Tylko jego krwi nie będziesz spożywał; wylejesz ją na ziemię jak wodę."
