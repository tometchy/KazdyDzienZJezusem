"Pwt8,1":
  text: "Wszystkich przykazań, które ci dziś nakazuję, będziecie przestrzegać i wypełniać je, abyście żyli, rozmnażali się, weszli i posiedli ziemię, którą PAN przysiągł waszym ojcom."
  tags: []
"Pwt8,2":
  text: "Pamiętaj całą drogę, którą prowadził cię PAN, twój Bóg, przez te czterdzieści lat po pustyni, by cię ukorzyć i doświadczać, aby poznać, co jest w twoim sercu, czy będziesz przestrzegał jego przykazań, czy nie."
  tags: []
"Pwt8,3":
  text: "Upokorzył cię, dawał ci odczuć głód i karmił cię manną, której nie znałeś ani ty, ani twoi ojcowie, aby cię nauczyć, że nie samym chlebem człowiek żyje, ale że człowiek żyje każdym słowem, które wychodzi z ust PANA."
  tags: []
"Pwt8,4":
  text: "Twoja odzież nie zniszczyła się na tobie i twoja noga nie opuchła przez te czterdzieści lat."
  tags: []
"Pwt8,5":
  text: "Rozważ więc w swym sercu, że jak człowiek karze swego syna, tak PAN, twój Bóg, karze ciebie."
  tags: []
"Pwt8,6":
  text: "Dlatego przestrzegaj przykazań PANA, swego Boga, abyś chodził jego drogami i bał się go."
  tags: []
"Pwt8,7":
  text: "PAN, twój Bóg, prowadzi cię bowiem do ziemi dobrej, do ziemi potoków wód, źródeł i głębin, wytryskających w dolinach i górach;"
  tags: []
"Pwt8,8":
  text: "Do ziemi pszenicy i jęczmienia, winorośli, figowców i drzew granatu; do ziemi oliwy i miodu;"
  tags: []
"Pwt8,9":
  text: "Do ziemi, w której będziesz jeść chleb, nie odczuwając niedostatku; w której niczego ci nie zabraknie; do ziemi, której kamienie są żelazem, a z jej gór będziesz wydobywać miedź."
  tags: []
"Pwt8,10":
  text: "Gdy będziesz jadł do syta, będziesz błogosławił PANA, swego Boga, za dobrą ziemię, którą ci dał."
  tags: []
"Pwt8,11":
  text: "Strzeż się, byś nie zapomniał PANA, swego Boga, i nie zaniedbał jego przykazań, jego praw i jego nakazów, które ci dziś nakazuję;"
  tags: []
"Pwt8,12":
  text: "Aby – gdy najesz się do syta, pobudujesz piękne domy i zamieszkasz w nich;"
  tags: []
"Pwt8,13":
  text: "I kiedy twoje bydło i owce rozmnożą się, przybędzie ci srebra i złota oraz wszystko, co będziesz miał, powiększy się;"
  tags: []
"Pwt8,14":
  text: "Twoje serce nie uniosło się i abyś nie zapomniał PANA, swego Boga, który cię wyprowadził z ziemi Egiptu, z domu niewoli;"
  tags: []
"Pwt8,15":
  text: "Który cię przeprowadził przez tę wielką i straszną pustynię, gdzie były węże jadowite i skorpiony, przez suchą ziemię, bez wody, i wydobył ci wodę z krzemiennej skały;"
  tags: []
"Pwt8,16":
  text: "Który cię karmił na pustyni manną, której nie znali twoi ojcowie, aby cię ukorzyć i doświadczać, by w przyszłości wyświadczyć ci dobro;"
  tags: []
"Pwt8,17":
  text: "Abyś nie mówił w swym sercu: Moja moc i siła mojej ręki zdobyły mi to bogactwo;"
  tags: []
"Pwt8,18":
  text: "Ale pamiętaj PANA, swego Boga, gdyż to on daje ci siłę do zdobywania bogactwa, aby potwierdzić swoje przymierze, które poprzysiągł twoim ojcom, jak się to dziś okazuje."
  tags: []
"Pwt8,19":
  text: "Ale jeśli całkiem zapomnisz PANA, swego Boga, i pójdziesz za innymi bogami, będziesz im służył i oddawał pokłon, to oświadczam wam dziś, że na pewno zginiecie."
  tags: []
"Pwt8,20":
  text: "Jak narody, które PAN niszczy przed wami, tak zginiecie, ponieważ nie słuchaliście głosu PANA, waszego Boga."
  tags: []
