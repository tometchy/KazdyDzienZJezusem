"Pwt8,1": "Wszystkich przykazań, które ci dziś nakazuję, będziecie przestrzegać i wypełniać je, abyście żyli, rozmnażali się, weszli i posiedli ziemię, którą PAN przysiągł waszym ojcom."
"Pwt8,2": "Pamiętaj całą drogę, którą prowadził cię PAN, twój Bóg, przez te czterdzieści lat po pustyni, by cię ukorzyć i doświadczać, aby poznać, co jest w twoim sercu, czy będziesz przestrzegał jego przykazań, czy nie."
"Pwt8,3": "Upokorzył cię, dawał ci odczuć głód i karmił cię manną, której nie znałeś ani ty, ani twoi ojcowie, aby cię nauczyć, że nie samym chlebem człowiek żyje, ale że człowiek żyje każdym słowem, które wychodzi z ust PANA."
"Pwt8,4": "Twoja odzież nie zniszczyła się na tobie i twoja noga nie opuchła przez te czterdzieści lat."
"Pwt8,5": "Rozważ więc w swym sercu, że jak człowiek karze swego syna, tak PAN, twój Bóg, karze ciebie."
"Pwt8,6": "Dlatego przestrzegaj przykazań PANA, swego Boga, abyś chodził jego drogami i bał się go."
"Pwt8,7": "PAN, twój Bóg, prowadzi cię bowiem do ziemi dobrej, do ziemi potoków wód, źródeł i głębin, wytryskających w dolinach i górach;"
"Pwt8,8": "Do ziemi pszenicy i jęczmienia, winorośli, figowców i drzew granatu; do ziemi oliwy i miodu;"
"Pwt8,9": "Do ziemi, w której będziesz jeść chleb, nie odczuwając niedostatku; w której niczego ci nie zabraknie; do ziemi, której kamienie są żelazem, a z jej gór będziesz wydobywać miedź."
"Pwt8,10": "Gdy będziesz jadł do syta, będziesz błogosławił PANA, swego Boga, za dobrą ziemię, którą ci dał."
"Pwt8,11": "Strzeż się, byś nie zapomniał PANA, swego Boga, i nie zaniedbał jego przykazań, jego praw i jego nakazów, które ci dziś nakazuję;"
"Pwt8,12": "Aby – gdy najesz się do syta, pobudujesz piękne domy i zamieszkasz w nich;"
"Pwt8,13": "I kiedy twoje bydło i owce rozmnożą się, przybędzie ci srebra i złota oraz wszystko, co będziesz miał, powiększy się;"
"Pwt8,14": "Twoje serce nie uniosło się i abyś nie zapomniał PANA, swego Boga, który cię wyprowadził z ziemi Egiptu, z domu niewoli;"
"Pwt8,15": "Który cię przeprowadził przez tę wielką i straszną pustynię, gdzie były węże jadowite i skorpiony, przez suchą ziemię, bez wody, i wydobył ci wodę z krzemiennej skały;"
"Pwt8,16": "Który cię karmił na pustyni manną, której nie znali twoi ojcowie, aby cię ukorzyć i doświadczać, by w przyszłości wyświadczyć ci dobro;"
"Pwt8,17": "Abyś nie mówił w swym sercu: Moja moc i siła mojej ręki zdobyły mi to bogactwo;"
"Pwt8,18": "Ale pamiętaj PANA, swego Boga, gdyż to on daje ci siłę do zdobywania bogactwa, aby potwierdzić swoje przymierze, które poprzysiągł twoim ojcom, jak się to dziś okazuje."
"Pwt8,19": "Ale jeśli całkiem zapomnisz PANA, swego Boga, i pójdziesz za innymi bogami, będziesz im służył i oddawał pokłon, to oświadczam wam dziś, że na pewno zginiecie."
"Pwt8,20": "Jak narody, które PAN niszczy przed wami, tak zginiecie, ponieważ nie słuchaliście głosu PANA, waszego Boga."
