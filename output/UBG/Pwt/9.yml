"Pwt9,1":
  text: "Słuchaj, Izraelu! Dziś przejdziesz przez Jordan, aby wejść i zawładnąć narodami większymi i potężniejszymi od ciebie, miastami wielkimi i obwarowanymi aż po samo niebo;"
  tags: []
"Pwt9,2":
  text: "Ludem wielkim i wysokim, synami Anakitów, których znasz i o których słyszałeś, kiedy mówiono: Któż się może ostać wobec synów Anaka?"
  tags: []
"Pwt9,3":
  text: "Wiedz zatem dzisiaj, że PAN, twój Bóg, przeprawia się przed tobą; jak ogień trawiący, zniszczy ich i poniży przed tobą, abyś ich wypędził i wytracił szybko, jak ci to obiecał PAN."
  tags: []
"Pwt9,4":
  text: "A gdy PAN, twój Bóg, wypędzi ich przed tobą, nie mów w swym sercu: Dzięki mojej sprawiedliwości PAN mnie wprowadził, abym posiadł tę ziemię. Lecz z powodu niegodziwości tych narodów PAN wygnał je przed tobą."
  tags: []
"Pwt9,5":
  text: "Nie dzięki swojej sprawiedliwości ani prawości swego serca wchodzisz, aby posiąść ich ziemię, lecz z powodu niegodziwości tych narodów PAN, twój Bóg, wypędza je przed tobą, i aby dopełnić słowo, które PAN poprzysiągł twoim ojcom: Abrahamowi, Izaakowi i Jakubowi."
  tags: []
"Pwt9,6":
  text: "Wiedz zatem, że nie dzięki twojej sprawiedliwości PAN, twój Bóg, daje ci tę dobrą ziemię w posiadanie, gdyż jesteś ludem twardego karku."
  tags: []
"Pwt9,7":
  text: "Pamiętaj, a nie zapominaj, jak pobudzałeś do gniewu PANA, swego Boga, na pustyni. Od tego dnia, w którym wyszedłeś z ziemi Egiptu, aż do waszego przyjścia na to miejsce buntowaliście się przeciwko PANU."
  tags: []
"Pwt9,8":
  text: "Także przy Horebie pobudziliście PANA do gniewu i rozgniewał się PAN na was tak, że chciał was wytępić."
  tags: []
"Pwt9,9":
  text: "Gdy wstąpiłem na górę, aby otrzymać kamienne tablice, tablice przymierza, które PAN zawarł z wami, przebywałem na górze przez czterdzieści dni i czterdzieści nocy, nie jedząc chleba i nie pijąc wody."
  tags: []
"Pwt9,10":
  text: "Wtedy PAN dał mi dwie kamienne tablice zapisane palcem Boga, na których były wszystkie te słowa, które PAN powiedział wam na górze spośród ognia, w dniu waszego zgromadzenia."
  tags: []
"Pwt9,11":
  text: "A kiedy minęło czterdzieści dni i czterdzieści nocy, PAN dał mi dwie tablice kamienne, tablice przymierza."
  tags: []
"Pwt9,12":
  text: "I PAN powiedział do mnie: Wstań, zejdź stąd szybko, gdyż zepsuł się twój lud, który wyprowadziłeś z Egiptu. Szybko zboczyli z drogi, którą im nakazałem, i uczynili sobie odlany posąg."
  tags: []
"Pwt9,13":
  text: "PAN powiedział też do mnie: Widziałem ten lud, a jest to lud twardego karku."
  tags: []
"Pwt9,14":
  text: "Zostaw mnie, a ich wytępię i wytracę ich imię spod nieba, a z ciebie uczynię naród potężniejszy i większy od nich."
  tags: []
"Pwt9,15":
  text: "Wtedy zawróciłem i zszedłem z góry. Góra płonęła ogniem, a dwie tablice przymierza były w obu moich rękach."
  tags: []
"Pwt9,16":
  text: "A gdy spojrzałem, oto zgrzeszyliście przeciw PANU, waszemu Bogu, bo uczyniliście sobie lanego cielca. Szybko zboczyliście z drogi, którą PAN wam nakazał."
  tags: []
"Pwt9,17":
  text: "Wtedy wziąłem te dwie tablice, wyrzuciłem je z rąk i stłukłem je na waszych oczach."
  tags: []
"Pwt9,18":
  text: "Potem upadłem przed PANEM jak za pierwszym razem, przez czterdzieści dni i czterdzieści nocy nie jadłem chleba i nie piłem wody z powodu wszystkich waszych grzechów, które popełniliście, czyniąc zło w oczach PANA, pobudzając go do gniewu."
  tags: []
"Pwt9,19":
  text: "Bałem się bowiem tej zapalczywości i gniewu, którymi PAN zapłonął przeciwko wam, by was wytępić. Lecz i tym razem PAN mnie wysłuchał."
  tags: []
"Pwt9,20":
  text: "Również na Aarona PAN bardzo się rozgniewał i chciał go zgładzić. W tym czasie modliłem się też za Aarona."
  tags: []
"Pwt9,21":
  text: "A wasz grzech, to jest cielca, którego uczyniliście, wziąłem i spaliłem w ogniu, potłukłem go i pokruszyłem, aż się stał miałki jak proch. I wrzuciłem jego proch do potoku wypływającego z góry."
  tags: []
"Pwt9,22":
  text: "Potem w Tabera, w Massa i w Kibrot-Hattaawa pobudziliście PANA do gniewu."
  tags: []
"Pwt9,23":
  text: "A gdy PAN wysłał was z Kadesz-Barnea, mówiąc: Idźcie i weźcie w posiadanie ziemię, którą wam dałem, zbuntowaliście się przeciw nakazowi PANA, waszego Boga, nie uwierzyliście mu i nie usłuchaliście jego głosu;"
  tags: []
"Pwt9,24":
  text: "Buntowaliście się przeciw PANU od dnia, kiedy was poznałem."
  tags: []
"Pwt9,25":
  text: "Dlatego upadłem przed PANEM i leżałem przez czterdzieści dni i czterdzieści nocy, bo PAN już powiedział, że was wytępi."
  tags: []
"Pwt9,26":
  text: "I modliłem się do PANA tymi słowy: Panie BOŻE, nie gub swego ludu i swego dziedzictwa, które odkupiłeś swoją wielkością, które wyprowadziłeś z Egiptu potężną ręką."
  tags: []
"Pwt9,27":
  text: "Wspomnij na swoje sługi: Abrahama, Izaaka i Jakuba; nie patrz na zatwardziałość tego ludu, na jego niegodziwość i grzech;"
  tags: []
"Pwt9,28":
  text: "Aby nie mówiono w tej ziemi, z której nas wyprowadziłeś: Ponieważ PAN nie mógł wprowadzić ich do ziemi, którą im obiecał, i ponieważ ich znienawidził, wyprowadził ich, aby ich zgładzić na pustyni."
  tags: []
"Pwt9,29":
  text: "Oni są twoim ludem i twoim dziedzictwem, które wyprowadziłeś swą wielką mocą i wyciągniętym ramieniem."
  tags: []
