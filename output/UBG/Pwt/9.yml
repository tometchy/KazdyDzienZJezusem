"Pwt9,1": "Słuchaj, Izraelu! Dziś przejdziesz przez Jordan, aby wejść i zawładnąć narodami większymi i potężniejszymi od ciebie, miastami wielkimi i obwarowanymi aż po samo niebo;"
"Pwt9,2": "Ludem wielkim i wysokim, synami Anakitów, których znasz i o których słyszałeś, kiedy mówiono: Któż się może ostać wobec synów Anaka?"
"Pwt9,3": "Wiedz zatem dzisiaj, że PAN, twój Bóg, przeprawia się przed tobą; jak ogień trawiący, zniszczy ich i poniży przed tobą, abyś ich wypędził i wytracił szybko, jak ci to obiecał PAN."
"Pwt9,4": "A gdy PAN, twój Bóg, wypędzi ich przed tobą, nie mów w swym sercu: Dzięki mojej sprawiedliwości PAN mnie wprowadził, abym posiadł tę ziemię. Lecz z powodu niegodziwości tych narodów PAN wygnał je przed tobą."
"Pwt9,5": "Nie dzięki swojej sprawiedliwości ani prawości swego serca wchodzisz, aby posiąść ich ziemię, lecz z powodu niegodziwości tych narodów PAN, twój Bóg, wypędza je przed tobą, i aby dopełnić słowo, które PAN poprzysiągł twoim ojcom: Abrahamowi, Izaakowi i Jakubowi."
"Pwt9,6": "Wiedz zatem, że nie dzięki twojej sprawiedliwości PAN, twój Bóg, daje ci tę dobrą ziemię w posiadanie, gdyż jesteś ludem twardego karku."
"Pwt9,7": "Pamiętaj, a nie zapominaj, jak pobudzałeś do gniewu PANA, swego Boga, na pustyni. Od tego dnia, w którym wyszedłeś z ziemi Egiptu, aż do waszego przyjścia na to miejsce buntowaliście się przeciwko PANU."
"Pwt9,8": "Także przy Horebie pobudziliście PANA do gniewu i rozgniewał się PAN na was tak, że chciał was wytępić."
"Pwt9,9": "Gdy wstąpiłem na górę, aby otrzymać kamienne tablice, tablice przymierza, które PAN zawarł z wami, przebywałem na górze przez czterdzieści dni i czterdzieści nocy, nie jedząc chleba i nie pijąc wody."
"Pwt9,10": "Wtedy PAN dał mi dwie kamienne tablice zapisane palcem Boga, na których były wszystkie te słowa, które PAN powiedział wam na górze spośród ognia, w dniu waszego zgromadzenia."
"Pwt9,11": "A kiedy minęło czterdzieści dni i czterdzieści nocy, PAN dał mi dwie tablice kamienne, tablice przymierza."
"Pwt9,12": "I PAN powiedział do mnie: Wstań, zejdź stąd szybko, gdyż zepsuł się twój lud, który wyprowadziłeś z Egiptu. Szybko zboczyli z drogi, którą im nakazałem, i uczynili sobie odlany posąg."
"Pwt9,13": "PAN powiedział też do mnie: Widziałem ten lud, a jest to lud twardego karku."
"Pwt9,14": "Zostaw mnie, a ich wytępię i wytracę ich imię spod nieba, a z ciebie uczynię naród potężniejszy i większy od nich."
"Pwt9,15": "Wtedy zawróciłem i zszedłem z góry. Góra płonęła ogniem, a dwie tablice przymierza były w obu moich rękach."
"Pwt9,16": "A gdy spojrzałem, oto zgrzeszyliście przeciw PANU, waszemu Bogu, bo uczyniliście sobie lanego cielca. Szybko zboczyliście z drogi, którą PAN wam nakazał."
"Pwt9,17": "Wtedy wziąłem te dwie tablice, wyrzuciłem je z rąk i stłukłem je na waszych oczach."
"Pwt9,18": "Potem upadłem przed PANEM jak za pierwszym razem, przez czterdzieści dni i czterdzieści nocy nie jadłem chleba i nie piłem wody z powodu wszystkich waszych grzechów, które popełniliście, czyniąc zło w oczach PANA, pobudzając go do gniewu."
"Pwt9,19": "Bałem się bowiem tej zapalczywości i gniewu, którymi PAN zapłonął przeciwko wam, by was wytępić. Lecz i tym razem PAN mnie wysłuchał."
"Pwt9,20": "Również na Aarona PAN bardzo się rozgniewał i chciał go zgładzić. W tym czasie modliłem się też za Aarona."
"Pwt9,21": "A wasz grzech, to jest cielca, którego uczyniliście, wziąłem i spaliłem w ogniu, potłukłem go i pokruszyłem, aż się stał miałki jak proch. I wrzuciłem jego proch do potoku wypływającego z góry."
"Pwt9,22": "Potem w Tabera, w Massa i w Kibrot-Hattaawa pobudziliście PANA do gniewu."
"Pwt9,23": "A gdy PAN wysłał was z Kadesz-Barnea, mówiąc: Idźcie i weźcie w posiadanie ziemię, którą wam dałem, zbuntowaliście się przeciw nakazowi PANA, waszego Boga, nie uwierzyliście mu i nie usłuchaliście jego głosu;"
"Pwt9,24": "Buntowaliście się przeciw PANU od dnia, kiedy was poznałem."
"Pwt9,25": "Dlatego upadłem przed PANEM i leżałem przez czterdzieści dni i czterdzieści nocy, bo PAN już powiedział, że was wytępi."
"Pwt9,26": "I modliłem się do PANA tymi słowy: Panie BOŻE, nie gub swego ludu i swego dziedzictwa, które odkupiłeś swoją wielkością, które wyprowadziłeś z Egiptu potężną ręką."
"Pwt9,27": "Wspomnij na swoje sługi: Abrahama, Izaaka i Jakuba; nie patrz na zatwardziałość tego ludu, na jego niegodziwość i grzech;"
"Pwt9,28": "Aby nie mówiono w tej ziemi, z której nas wyprowadziłeś: Ponieważ PAN nie mógł wprowadzić ich do ziemi, którą im obiecał, i ponieważ ich znienawidził, wyprowadził ich, aby ich zgładzić na pustyni."
"Pwt9,29": "Oni są twoim ludem i twoim dziedzictwem, które wyprowadziłeś swą wielką mocą i wyciągniętym ramieniem."
