"Pwt20,1":
  text: "Gdy wyruszysz na wojnę przeciw swoim wrogom i zobaczysz konie, rydwany i lud liczniejszy od ciebie, nie bój się ich, gdyż jest z tobą PAN, twój Bóg, który cię wyprowadził z ziemi Egiptu."
  tags: []
"Pwt20,2":
  text: "A gdy będziecie się zbliżać do walki, kapłan wystąpi i przemówi do ludu;"
  tags: []
"Pwt20,3":
  text: "I powie do niego: Słuchaj, Izraelu! Dziś staczacie bitwę ze swymi wrogami. Niech wasze serce nie słabnie, nie bójcie się, nie trwóżcie ani nie lękajcie się ich;"
  tags: []
"Pwt20,4":
  text: "Gdyż PAN, wasz Bóg, idzie z wami, aby za was walczyć z waszymi wrogami i was wybawić."
  tags: []
"Pwt20,5":
  text: "Dowódcy również przemówią do ludu i powiedzą: Jeśli jest ktoś, kto zbudował nowy dom, a jeszcze go nie poświęcił, niech idzie i wraca do swego domu, aby nie zginął w bitwie i aby ktoś inny go nie poświęcił."
  tags: []
"Pwt20,6":
  text: "Albo jeśli jest ktoś, kto zasadził winnicę i jeszcze nie spożywał z niej owocu, niech idzie i wraca do swego domu, by nie zginął w bitwie i aby ktoś inny z niej nie spożywał."
  tags: []
"Pwt20,7":
  text: "Albo jeśli jest ktoś, kto poślubił żonę, a jeszcze jej nie pojął, niech idzie i wraca do swego domu, by nie zginął w bitwie i aby inny jej nie pojął."
  tags: []
"Pwt20,8":
  text: "Dowódcy jeszcze przemówią do ludu i powiedzą: Jeśli ktoś jest bojaźliwy i lękliwego serca, niech idzie i wraca do swego domu, aby serce jego braci nie było słabe jak jego serce jest słabe."
  tags: []
"Pwt20,9":
  text: "A gdy dowódcy przestaną mówić do ludu, wtedy wyznaczą dowódców wojsk na czele ludu."
  tags: []
"Pwt20,10":
  text: "Gdy podejdziesz do jakiegoś miasta, aby je zdobyć, zaoferujesz mu pokój."
  tags: []
"Pwt20,11":
  text: "A jeśli odpowie ci z pokojem i otworzy ci bramy, wtedy cały lud znajdujący się w nim stanie się twoim hołdownikiem i będzie ci służył."
  tags: []
"Pwt20,12":
  text: "Jeśli jednak nie zawrze z tobą pokoju, lecz wznieci przeciw tobie wojnę, oblegniesz je."
  tags: []
"Pwt20,13":
  text: "A gdy PAN, twój Bóg, wyda je w twoje ręce, zabijesz w nim każdego mężczyznę ostrzem miecza."
  tags: []
"Pwt20,14":
  text: "Tylko kobiety, dzieci, bydło oraz wszystko, co będzie w mieście, cały łup z niego, weźmiesz sobie jako zdobycz; i będziesz jadł z łupu swoich wrogów, których daje ci PAN, twój Bóg."
  tags: []
"Pwt20,15":
  text: "Tak postąpisz ze wszystkimi miastami bardzo oddalonymi od ciebie, które nie należą do miast tych narodów."
  tags: []
"Pwt20,16":
  text: "Ale z miast tych narodów, które PAN, twój Bóg, daje ci w dziedzictwo, żadnej duszy nie zostawisz przy życiu."
  tags: []
"Pwt20,17":
  text: "Lecz doszczętnie je wytępisz: Chetytów, Amorytów, Kananejczyków, Peryzzytów, Chiwwitów i Jebusytów, jak ci nakazał PAN, twój Bóg;"
  tags: []
"Pwt20,18":
  text: "Aby nie uczyli was czynić według wszystkich swoich obrzydliwości, jakie czynili swym bogom, i abyście nie zgrzeszyli przeciw PANU, swojemu Bogu."
  tags: []
"Pwt20,19":
  text: "Gdy przez wiele dni będziesz oblegał jakieś miasto, walcząc przeciwko niemu, aby je zdobyć, nie niszcz jego drzew, wycinając je siekierą. Będziesz bowiem z nich jeść, więc nie wycinaj ich (bo drzewa polne są dla życia człowieka), aby ich użyć do oblężenia."
  tags: []
"Pwt20,20":
  text: "Tylko te drzewa, o których wiesz, że nie rodzą owoców, zniszczysz i wytniesz; i zbudujesz narzędzia przeciwko temu miastu, które z tobą walczy, aż je opanujesz."
  tags: []
