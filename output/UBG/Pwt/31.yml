"Pwt31,1": "Potem Mojżesz poszedł i powiedział te słowa całemu Izraelowi."
"Pwt31,2": "Powiedział do nich: Mam dziś sto dwadzieścia lat, nie mogę już wychodzić i wchodzić. A PAN powiedział mi też: Nie przejdziesz przez Jordan."
"Pwt31,3": "Sam PAN, twój Bóg, przejdzie przed tobą i on wytępi te narody przed tobą, a ty je posiądziesz. A Jozue przejdzie przed tobą, jak PAN powiedział."
"Pwt31,4": "I PAN uczyni im tak, jak uczynił Sichonowi i Ogowi, królom Amorytów, i ich ziemi, gdy ich zniszczył."
"Pwt31,5": "PAN wyda ich wam, a wy uczynicie im zgodnie ze wszystkimi przykazaniami, które wam nakazałem."
"Pwt31,6": "Wzmocnijcie się i bądźcie mężni, nie bójcie się ani się nie lękajcie ich, gdyż PAN, twój Bóg, on sam pójdzie z tobą, nie porzuci cię ani cię nie opuści."
"Pwt31,7": "Następnie Mojżesz przywołał Jozuego i powiedział do niego przed całym Izraelem: Wzmocnij się i bądź mężny, bo ty wejdziesz z tym ludem do ziemi, którą PAN poprzysiągł dać ich ojcom, a ty im ją dasz w dziedzictwo."
"Pwt31,8": "A sam PAN pójdzie przed tobą, on będzie z tobą, nie porzuci cię ani cię nie opuści. Nie bój się ani się nie lękaj."
"Pwt31,9": "Wtedy Mojżesz zapisał to prawo i oddał je kapłanom, synom Lewiego, którzy nosili arkę przymierza PANA, i wszystkim starszym Izraela."
"Pwt31,10": "Mojżesz nakazał im też: Po upływie każdego siódmego roku, w wyznaczonej porze roku darowania długów, w Święto Namiotów;"
"Pwt31,11": "Gdy cały Izrael przybędzie, aby się stawić przed PANEM, twoim Bogiem, na miejscu, które wybierze, odczytasz to prawo do uszu całego Izraela."
"Pwt31,12": "Zgromadzisz lud: mężczyzn, kobiety, dzieci i obcych, którzy są w obrębie twoich bram, aby słuchali i uczyli się, aby się bali PANA, swojego Boga, i pilnowali wypełnienia wszystkich słów tego prawa."
"Pwt31,13": "Ich synowie, którzy jeszcze nie znają, niech też słuchają i uczą się bać PANA, waszego Boga, po wszystkie dni waszego życia na ziemi, do której przeprawiacie się przez Jordan, aby ją posiąść."
"Pwt31,14": "Potem PAN powiedział do Mojżesza: Oto zbliżają się dni twojej śmierci. Przywołaj Jozuego i stawcie się w Namiocie Zgromadzenia, a ja mu wydam polecenie. Poszedł więc Mojżesz i Jozue i stawili się w Namiocie Zgromadzenia."
"Pwt31,15": "I PAN ukazał się w namiocie w słupie obłoku. A słup obłoku stanął nad wejściem do namiotu."
"Pwt31,16": "I PAN powiedział do Mojżesza: Oto zaśniesz ze swoimi ojcami, a ten lud powstanie i będzie uprawiał nierząd, idąc za bogami cudzoziemców tej ziemi, do której wchodzi, by wśród nich zamieszkać, i opuści mnie, i złamie moje przymierze, które z nim zawarłem."
"Pwt31,17": "W tym dniu zapłonie mój gniew przeciwko nim, opuszczę ich i skryję swe oblicze przed nimi, a oni będą pożarci i spotka ich wiele nieszczęść i utrapień i powiedzą w tym dniu: Czy nie dlatego, że naszego Boga nie ma pośród nas, spotkały nas te nieszczęścia?"
"Pwt31,18": "Lecz ja zupełnie zakryję swe oblicze w tym dniu z powodu całego zła, które czynili, zwracając się ku innym bogom."
"Pwt31,19": "Teraz więc zapiszcie sobie tę pieśń i naucz jej synów Izraela. Włóż ją w ich usta, aby ta pieśń była dla mnie świadectwem przeciwko synom Izraela."
"Pwt31,20": "Gdy bowiem wprowadzę ich do ziemi, którą poprzysiągłem ich ojcom, do ziemi mlekiem i miodem płynącej, i będą jeść do syta, i utyją, wtedy zwrócą się ku innym bogom i będą im służyć, a mnie rozdrażnią i złamią moje przymierze;"
"Pwt31,21": "I kiedy spotka ich wiele nieszczęść i utrapień, ta pieśń będzie świadkiem przeciwko nim, gdyż nie zostanie zapomniana w ustach ich potomstwa. Znam bowiem ich zamysł i to, co jeszcze dziś będą czynić, zanim wprowadzę ich do ziemi, którą im poprzysiągłem."
"Pwt31,22": "I Mojżesz napisał tę pieśń tego dnia, i nauczył jej synów Izraela."
"Pwt31,23": "Potem nakazał Jozuemu, synowi Nuna: Wzmocnij się i bądź mężny, bo ty wprowadzisz synów Izraela do ziemi, którą im poprzysiągłem, a ja będę z tobą."
"Pwt31,24": "I kiedy Mojżesz skończył zapisywać słowa tego prawa w księdze;"
"Pwt31,25": "Nakazał Mojżesz Lewitom, którzy nosili arkę przymierza PANA:"
"Pwt31,26": "Weźcie księgę tego Prawa i połóżcie ją obok arki przymierza PANA, waszego Boga, aby tam była świadkiem przeciwko tobie."
"Pwt31,27": "Znam bowiem twój upór i twój twardy kark. Oto dziś, dopóki jeszcze żyję z wami, buntujecie się przeciwko PANU, a cóż dopiero po mojej śmierci?"
"Pwt31,28": "Zgromadźcie u mnie wszystkich starszych waszych pokoleń i waszych dowódców, żebym mówił do ich uszu te słowa i wezwał na świadków przeciwko nim niebo i ziemię."
"Pwt31,29": "Wiem bowiem, że po mojej śmierci zepsujecie się całkowicie i zboczycie z drogi, którą wam nakazałem. I spotka was nieszczęście w ostateczne dni, gdyż będziecie czynić to, co złe w oczach PANA, drażniąc go dziełem swoich rąk."
"Pwt31,30": "I Mojżesz przemówił do uszu całego zgromadzenia Izraela słowami tej pieśni aż do końca."
