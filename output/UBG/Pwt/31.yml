"Pwt31,1":
  text: "Potem Mojżesz poszedł i powiedział te słowa całemu Izraelowi."
  tags: []
"Pwt31,2":
  text: "Powiedział do nich: Mam dziś sto dwadzieścia lat, nie mogę już wychodzić i wchodzić. A PAN powiedział mi też: Nie przejdziesz przez Jordan."
  tags: []
"Pwt31,3":
  text: "Sam PAN, twój Bóg, przejdzie przed tobą i on wytępi te narody przed tobą, a ty je posiądziesz. A Jozue przejdzie przed tobą, jak PAN powiedział."
  tags: []
"Pwt31,4":
  text: "I PAN uczyni im tak, jak uczynił Sichonowi i Ogowi, królom Amorytów, i ich ziemi, gdy ich zniszczył."
  tags: []
"Pwt31,5":
  text: "PAN wyda ich wam, a wy uczynicie im zgodnie ze wszystkimi przykazaniami, które wam nakazałem."
  tags: []
"Pwt31,6":
  text: "Wzmocnijcie się i bądźcie mężni, nie bójcie się ani się nie lękajcie ich, gdyż PAN, twój Bóg, on sam pójdzie z tobą, nie porzuci cię ani cię nie opuści."
  tags: []
"Pwt31,7":
  text: "Następnie Mojżesz przywołał Jozuego i powiedział do niego przed całym Izraelem: Wzmocnij się i bądź mężny, bo ty wejdziesz z tym ludem do ziemi, którą PAN poprzysiągł dać ich ojcom, a ty im ją dasz w dziedzictwo."
  tags: []
"Pwt31,8":
  text: "A sam PAN pójdzie przed tobą, on będzie z tobą, nie porzuci cię ani cię nie opuści. Nie bój się ani się nie lękaj."
  tags: []
"Pwt31,9":
  text: "Wtedy Mojżesz zapisał to prawo i oddał je kapłanom, synom Lewiego, którzy nosili arkę przymierza PANA, i wszystkim starszym Izraela."
  tags: []
"Pwt31,10":
  text: "Mojżesz nakazał im też: Po upływie każdego siódmego roku, w wyznaczonej porze roku darowania długów, w Święto Namiotów;"
  tags: []
"Pwt31,11":
  text: "Gdy cały Izrael przybędzie, aby się stawić przed PANEM, twoim Bogiem, na miejscu, które wybierze, odczytasz to prawo do uszu całego Izraela."
  tags: []
"Pwt31,12":
  text: "Zgromadzisz lud: mężczyzn, kobiety, dzieci i obcych, którzy są w obrębie twoich bram, aby słuchali i uczyli się, aby się bali PANA, swojego Boga, i pilnowali wypełnienia wszystkich słów tego prawa."
  tags: []
"Pwt31,13":
  text: "Ich synowie, którzy jeszcze nie znają, niech też słuchają i uczą się bać PANA, waszego Boga, po wszystkie dni waszego życia na ziemi, do której przeprawiacie się przez Jordan, aby ją posiąść."
  tags: []
"Pwt31,14":
  text: "Potem PAN powiedział do Mojżesza: Oto zbliżają się dni twojej śmierci. Przywołaj Jozuego i stawcie się w Namiocie Zgromadzenia, a ja mu wydam polecenie. Poszedł więc Mojżesz i Jozue i stawili się w Namiocie Zgromadzenia."
  tags: []
"Pwt31,15":
  text: "I PAN ukazał się w namiocie w słupie obłoku. A słup obłoku stanął nad wejściem do namiotu."
  tags: []
"Pwt31,16":
  text: "I PAN powiedział do Mojżesza: Oto zaśniesz ze swoimi ojcami, a ten lud powstanie i będzie uprawiał nierząd, idąc za bogami cudzoziemców tej ziemi, do której wchodzi, by wśród nich zamieszkać, i opuści mnie, i złamie moje przymierze, które z nim zawarłem."
  tags: []
"Pwt31,17":
  text: "W tym dniu zapłonie mój gniew przeciwko nim, opuszczę ich i skryję swe oblicze przed nimi, a oni będą pożarci i spotka ich wiele nieszczęść i utrapień i powiedzą w tym dniu: Czy nie dlatego, że naszego Boga nie ma pośród nas, spotkały nas te nieszczęścia?"
  tags: []
"Pwt31,18":
  text: "Lecz ja zupełnie zakryję swe oblicze w tym dniu z powodu całego zła, które czynili, zwracając się ku innym bogom."
  tags: []
"Pwt31,19":
  text: "Teraz więc zapiszcie sobie tę pieśń i naucz jej synów Izraela. Włóż ją w ich usta, aby ta pieśń była dla mnie świadectwem przeciwko synom Izraela."
  tags: []
"Pwt31,20":
  text: "Gdy bowiem wprowadzę ich do ziemi, którą poprzysiągłem ich ojcom, do ziemi mlekiem i miodem płynącej, i będą jeść do syta, i utyją, wtedy zwrócą się ku innym bogom i będą im służyć, a mnie rozdrażnią i złamią moje przymierze;"
  tags: []
"Pwt31,21":
  text: "I kiedy spotka ich wiele nieszczęść i utrapień, ta pieśń będzie świadkiem przeciwko nim, gdyż nie zostanie zapomniana w ustach ich potomstwa. Znam bowiem ich zamysł i to, co jeszcze dziś będą czynić, zanim wprowadzę ich do ziemi, którą im poprzysiągłem."
  tags: []
"Pwt31,22":
  text: "I Mojżesz napisał tę pieśń tego dnia, i nauczył jej synów Izraela."
  tags: []
"Pwt31,23":
  text: "Potem nakazał Jozuemu, synowi Nuna: Wzmocnij się i bądź mężny, bo ty wprowadzisz synów Izraela do ziemi, którą im poprzysiągłem, a ja będę z tobą."
  tags: []
"Pwt31,24":
  text: "I kiedy Mojżesz skończył zapisywać słowa tego prawa w księdze;"
  tags: []
"Pwt31,25":
  text: "Nakazał Mojżesz Lewitom, którzy nosili arkę przymierza PANA:"
  tags: []
"Pwt31,26":
  text: "Weźcie księgę tego Prawa i połóżcie ją obok arki przymierza PANA, waszego Boga, aby tam była świadkiem przeciwko tobie."
  tags: []
"Pwt31,27":
  text: "Znam bowiem twój upór i twój twardy kark. Oto dziś, dopóki jeszcze żyję z wami, buntujecie się przeciwko PANU, a cóż dopiero po mojej śmierci?"
  tags: []
"Pwt31,28":
  text: "Zgromadźcie u mnie wszystkich starszych waszych pokoleń i waszych dowódców, żebym mówił do ich uszu te słowa i wezwał na świadków przeciwko nim niebo i ziemię."
  tags: []
"Pwt31,29":
  text: "Wiem bowiem, że po mojej śmierci zepsujecie się całkowicie i zboczycie z drogi, którą wam nakazałem. I spotka was nieszczęście w ostateczne dni, gdyż będziecie czynić to, co złe w oczach PANA, drażniąc go dziełem swoich rąk."
  tags: []
"Pwt31,30":
  text: "I Mojżesz przemówił do uszu całego zgromadzenia Izraela słowami tej pieśni aż do końca."
  tags: []
