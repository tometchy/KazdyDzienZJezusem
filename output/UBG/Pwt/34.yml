"Pwt34,1":
  text: "Potem Mojżesz wstąpił z równin Moabu na górę Nebo, na szczyt Pizga, który jest naprzeciw Jerycha. I PAN pokazał mu całą ziemię, od Gileadu aż po Dan;"
  tags: []
"Pwt34,2":
  text: "I całą ziemię Neftalego, ziemię Efraima i Manassesa oraz całą ziemię Judy aż po Morze Zachodnie;"
  tags: []
"Pwt34,3":
  text: "I stronę południową, i równinę doliny Jerycha, miasta palm aż po Soar."
  tags: []
"Pwt34,4":
  text: "Wtedy PAN mu powiedział: To jest ziemia, którą poprzysiągłem Abrahamowi, Izaakowi i Jakubowi, mówiąc: Dam ją twemu potomstwu. Pozwoliłem ci ją zobaczyć na własne oczy, ale do niej nie wejdziesz."
  tags: []
"Pwt34,5":
  text: "Tam właśnie umarł Mojżesz, sługa PANA, w ziemi Moabu, według słowa PANA."
  tags: []
"Pwt34,6":
  text: "I pogrzebał go w dolinie, w ziemi Moabu, naprzeciw Bet-Peor, a nikt nie zna jego grobu aż po dziś dzień."
  tags: []
"Pwt34,7":
  text: "Mojżesz miał sto dwadzieścia lat, gdy umarł. Jego wzrok nie był przyćmiony i jego siła go nie opuściła."
  tags: []
"Pwt34,8":
  text: "I synowie Izraela opłakiwali Mojżesza na równinach Moabu przez trzydzieści dni. Potem skończyły się dni płaczu i żałoby po Mojżeszu."
  tags: []
"Pwt34,9":
  text: "A Jozue, syn Nuna, był pełen ducha mądrości, bo Mojżesz włożył na niego swoje ręce. I synowie Izraela byli mu posłuszni i czynili tak, jak PAN nakazał Mojżeszowi."
  tags: []
"Pwt34,10":
  text: "I nie powstał już prorok w Izraelu równy Mojżeszowi, którego PAN znał twarzą w twarz;"
  tags: []
"Pwt34,11":
  text: "We wszystkich znakach i cudach, dla których PAN posłał go, by je czynił w ziemi Egiptu wobec faraona, wszystkich jego sług i całej jego ziemi;"
  tags: []
"Pwt34,12":
  text: "I we wszystkich sprawach potężnej ręki, i w całej wielkiej grozie, którą Mojżesz wywołał na oczach całego Izraela."
  tags: []
