"Pwt23,1": "Ten, kto ma zgniecione jądra lub odcięty członek, nie wejdzie do zgromadzenia PANA."
"Pwt23,2": "Żaden bękart nie wejdzie do zgromadzenia PANA; nawet jego dziesiąte pokolenie nie wejdzie do zgromadzenia PANA."
"Pwt23,3": "Nie wejdzie też Ammonita ani Moabita do zgromadzenia PANA; nawet ich dziesiąte pokolenie nie wejdzie do zgromadzenia PANA aż na wieki;"
"Pwt23,4": "Dlatego że nie wyszli do was z chlebem i wodą w czasie, gdy wyszliście z Egiptu i byliście w drodze, i ponieważ najęli za opłatę przeciw tobie Balaama, syna Beora, z Petor w Mezopotamii, aby cię przeklinał."
"Pwt23,5": "PAN, twój Bóg, nie chciał jednak wysłuchać Balaama, lecz zamienił ci PAN, twój Bóg, przekleństwo w błogosławieństwo, gdyż umiłował cię PAN, twój Bóg."
"Pwt23,6": "Nie zabiegaj o ich pokój ani dobro po wszystkie swoje dni na wieki."
"Pwt23,7": "Nie będziesz się brzydził Edomitą, gdyż jest on twoim bratem. Nie będziesz się brzydził Egipcjaninem, gdyż byłeś przybyszem w jego ziemi."
"Pwt23,8": "Dzieci, które urodzą się im w trzecim pokoleniu, wejdą do zgromadzenia PANA."
"Pwt23,9": "Gdy wyruszysz z wojskiem przeciwko swoim wrogom, wystrzegaj się wszelkiej niegodziwości."
"Pwt23,10": "Jeśli będzie pośród was człowiek nieczysty z powodu nocnego zdarzenia, to wyjdzie za obóz i nie wróci do niego."
"Pwt23,11": "A pod wieczór umyje się wodą, a gdy zajdzie słońce, wejdzie do obozu."
"Pwt23,12": "Będziesz też miał miejsce za obozem, gdzie będziesz wychodził;"
"Pwt23,13": "I wśród swoich przyborów będziesz miał łopatkę; a gdy wyjdziesz na zewnątrz za potrzebą, wykopiesz nią dołek, potem odwrócisz się i przykryjesz swoje nieczystości."
"Pwt23,14": "PAN, twój Bóg, przechadza się bowiem pośród twego obozu, aby cię wybawić i wydać ci twoich wrogów; niech więc twój obóz będzie święty, aby nie widział u ciebie żadnej nieprzyzwoitości i nie odwrócił się od ciebie."
"Pwt23,15": "Nie wydasz panu sługi, który uciekł do ciebie od swego pana."
"Pwt23,16": "Będzie z tobą mieszkał pośród ciebie w miejscu, które sobie wybierze w jednym z twoich miast, gdzie mu się podoba. Nie będziesz go gnębił."
"Pwt23,17": "Nie będzie żadnej nierządnicy wśród córek Izraela ani nie będzie sodomity wśród synów Izraela."
"Pwt23,18": "Nie przyniesiesz do domu PANA, swego Boga, zapłaty nierządnicy ani zarobku psa jako ofiary ślubowanej, gdyż obie rzeczy budzą odrazę u PANA, twego Boga."
"Pwt23,19": "Nie będziesz brał odsetek od brata za pożyczone pieniądze, żywność ani cokolwiek, co się pożycza na procent."
"Pwt23,20": "Obcemu możesz pożyczać na procent, lecz swemu bratu nie pożyczysz na procent, aby PAN, twój Bóg, błogosławił cię w każdym dziele twoich rąk w ziemi, do której wchodzisz, by ją posiąść."
"Pwt23,21": "Jeśli złożysz PANU, swemu Bogu, jakiś ślub, nie zwlekaj z jego spełnieniem, gdyż PAN, twój Bóg, z pewnością będzie się tego domagał od ciebie, a na tobie będzie ciążył grzech."
"Pwt23,22": "Lecz jeśli nie będziesz ślubował, grzech nie będzie na tobie ciążył."
"Pwt23,23": "To, co wyjdzie z twoich ust, wypełnisz i uczynisz, gdyż dobrowolnie ślubowałeś PANU, swemu Bogu, co powiedziałeś swoimi ustami."
"Pwt23,24": "Gdy wejdziesz do winnicy swego bliźniego, możesz jeść do syta tyle winogron, ile chcesz, lecz do swego naczynia nie wkładaj."
"Pwt23,25": "Gdy wejdziesz w zboże swego bliźniego, możesz zrywać kłosy swoją ręką, lecz sierpa nie zapuszczaj w zboże swego bliźniego."
