"Pwt23,1":
  text: "Ten, kto ma zgniecione jądra lub odcięty członek, nie wejdzie do zgromadzenia PANA."
  tags: []
"Pwt23,2":
  text: "Żaden bękart nie wejdzie do zgromadzenia PANA; nawet jego dziesiąte pokolenie nie wejdzie do zgromadzenia PANA."
  tags: []
"Pwt23,3":
  text: "Nie wejdzie też Ammonita ani Moabita do zgromadzenia PANA; nawet ich dziesiąte pokolenie nie wejdzie do zgromadzenia PANA aż na wieki;"
  tags: []
"Pwt23,4":
  text: "Dlatego że nie wyszli do was z chlebem i wodą w czasie, gdy wyszliście z Egiptu i byliście w drodze, i ponieważ najęli za opłatę przeciw tobie Balaama, syna Beora, z Petor w Mezopotamii, aby cię przeklinał."
  tags: []
"Pwt23,5":
  text: "PAN, twój Bóg, nie chciał jednak wysłuchać Balaama, lecz zamienił ci PAN, twój Bóg, przekleństwo w błogosławieństwo, gdyż umiłował cię PAN, twój Bóg."
  tags: []
"Pwt23,6":
  text: "Nie zabiegaj o ich pokój ani dobro po wszystkie swoje dni na wieki."
  tags: []
"Pwt23,7":
  text: "Nie będziesz się brzydził Edomitą, gdyż jest on twoim bratem. Nie będziesz się brzydził Egipcjaninem, gdyż byłeś przybyszem w jego ziemi."
  tags: []
"Pwt23,8":
  text: "Dzieci, które urodzą się im w trzecim pokoleniu, wejdą do zgromadzenia PANA."
  tags: []
"Pwt23,9":
  text: "Gdy wyruszysz z wojskiem przeciwko swoim wrogom, wystrzegaj się wszelkiej niegodziwości."
  tags: []
"Pwt23,10":
  text: "Jeśli będzie pośród was człowiek nieczysty z powodu nocnego zdarzenia, to wyjdzie za obóz i nie wróci do niego."
  tags: []
"Pwt23,11":
  text: "A pod wieczór umyje się wodą, a gdy zajdzie słońce, wejdzie do obozu."
  tags: []
"Pwt23,12":
  text: "Będziesz też miał miejsce za obozem, gdzie będziesz wychodził;"
  tags: []
"Pwt23,13":
  text: "I wśród swoich przyborów będziesz miał łopatkę; a gdy wyjdziesz na zewnątrz za potrzebą, wykopiesz nią dołek, potem odwrócisz się i przykryjesz swoje nieczystości."
  tags: []
"Pwt23,14":
  text: "PAN, twój Bóg, przechadza się bowiem pośród twego obozu, aby cię wybawić i wydać ci twoich wrogów; niech więc twój obóz będzie święty, aby nie widział u ciebie żadnej nieprzyzwoitości i nie odwrócił się od ciebie."
  tags: []
"Pwt23,15":
  text: "Nie wydasz panu sługi, który uciekł do ciebie od swego pana."
  tags: []
"Pwt23,16":
  text: "Będzie z tobą mieszkał pośród ciebie w miejscu, które sobie wybierze w jednym z twoich miast, gdzie mu się podoba. Nie będziesz go gnębił."
  tags: []
"Pwt23,17":
  text: "Nie będzie żadnej nierządnicy wśród córek Izraela ani nie będzie sodomity wśród synów Izraela."
  tags: []
"Pwt23,18":
  text: "Nie przyniesiesz do domu PANA, swego Boga, zapłaty nierządnicy ani zarobku psa jako ofiary ślubowanej, gdyż obie rzeczy budzą odrazę u PANA, twego Boga."
  tags: []
"Pwt23,19":
  text: "Nie będziesz brał odsetek od brata za pożyczone pieniądze, żywność ani cokolwiek, co się pożycza na procent."
  tags: []
"Pwt23,20":
  text: "Obcemu możesz pożyczać na procent, lecz swemu bratu nie pożyczysz na procent, aby PAN, twój Bóg, błogosławił cię w każdym dziele twoich rąk w ziemi, do której wchodzisz, by ją posiąść."
  tags: []
"Pwt23,21":
  text: "Jeśli złożysz PANU, swemu Bogu, jakiś ślub, nie zwlekaj z jego spełnieniem, gdyż PAN, twój Bóg, z pewnością będzie się tego domagał od ciebie, a na tobie będzie ciążył grzech."
  tags: []
"Pwt23,22":
  text: "Lecz jeśli nie będziesz ślubował, grzech nie będzie na tobie ciążył."
  tags: []
"Pwt23,23":
  text: "To, co wyjdzie z twoich ust, wypełnisz i uczynisz, gdyż dobrowolnie ślubowałeś PANU, swemu Bogu, co powiedziałeś swoimi ustami."
  tags: []
"Pwt23,24":
  text: "Gdy wejdziesz do winnicy swego bliźniego, możesz jeść do syta tyle winogron, ile chcesz, lecz do swego naczynia nie wkładaj."
  tags: []
"Pwt23,25":
  text: "Gdy wejdziesz w zboże swego bliźniego, możesz zrywać kłosy swoją ręką, lecz sierpa nie zapuszczaj w zboże swego bliźniego."
  tags: []
