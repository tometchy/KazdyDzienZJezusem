"Pwt22,1":
  text: "Jeśli zobaczysz zabłąkanego wołu albo owcę swego brata, nie omijaj ich, lecz koniecznie odprowadź je do swego brata."
  tags: []
"Pwt22,2":
  text: "A jeśli twój brat nie jest blisko ciebie albo nie znasz go, to zaprowadź je do swego domu i będą u ciebie, aż twój brat będzie ich poszukiwał i wtedy mu je zwrócisz."
  tags: []
"Pwt22,3":
  text: "Tak samo postąpisz z jego osłem, tak samo postąpisz z jego szatą i tak samo postąpisz z każdą zgubioną rzeczą swego brata, która mu zginęła, a ty ją znalazłeś. Nie omijaj jej."
  tags: []
"Pwt22,4":
  text: "Jeśli zobaczysz, że osioł albo wół twego brata upadł na drodze, nie omijaj ich, lecz niezwłocznie pomóż mu je podnieść."
  tags: []
"Pwt22,5":
  text: "Kobieta nie będzie nosiła ubrania mężczyzny ani mężczyzna nie włoży na siebie ubrania kobiety, gdyż ci, którzy tak czynią, budzą odrazę u PANA, twego Boga."
  tags: []
"Pwt22,6":
  text: "Jeśli przed sobą na drodze napotkasz ptasie gniazdo na jakimkolwiek drzewie lub na ziemi, z pisklętami lub jajkami, a matka wysiaduje pisklęta lub jajka, nie zabierzesz matki z młodymi;"
  tags: []
"Pwt22,7":
  text: "Lecz wypuścisz matkę na wolność, a młode weźmiesz sobie, aby ci się dobrze powodziło i abyś przedłużył swoje dni."
  tags: []
"Pwt22,8":
  text: "Gdy zbudujesz nowy dom, wtedy uczynisz na swoim dachu ogrodzenie, byś nie sprowadził krwi na swój dom, gdyby ktoś z niego spadł."
  tags: []
"Pwt22,9":
  text: "Nie zasiewaj w swojej winnicy różnych rodzajów ziarna, abyś nie splugawił plonu posianego ziarna i zbioru winnicy."
  tags: []
"Pwt22,10":
  text: "Nie będziesz orał wołem razem z osłem."
  tags: []
"Pwt22,11":
  text: "Nie będziesz nosił szaty utkanej z wełny razem z lnem."
  tags: []
"Pwt22,12":
  text: "Sporządzisz sobie frędzle na czterech rogach swego płaszcza, którym będziesz się okrywał."
  tags: []
"Pwt22,13":
  text: "Jeśli mężczyzna pojmie żonę, będzie z nią obcował, a potem ją znienawidzi;"
  tags: []
"Pwt22,14":
  text: "I sprawi, że będą o niej mówić źle, i zniesławi jej imię, mówiąc: Pojąłem tę żonę, lecz gdy obcowałem z nią, nie stwierdziłem u niej dziewictwa;"
  tags: []
"Pwt22,15":
  text: "Wtedy ojciec i matka dziewczyny wezmą i zaniosą dowody dziewictwa tej dziewczyny do starszych miasta, do bramy;"
  tags: []
"Pwt22,16":
  text: "I ojciec tej dziewczyny powie do starszych: Dałem swoją córkę temu mężczyźnie za żonę, a on jej nienawidzi;"
  tags: []
"Pwt22,17":
  text: "A oto sam daje powód, aby mówiono o niej źle, mówiąc: Nie stwierdziłem u twej córki dziewictwa; lecz oto są dowody dziewictwa mojej córki. Wtedy rozłożą prześcieradło przed starszymi miasta."
  tags: []
"Pwt22,18":
  text: "Wtedy starsi miasta wezmą tego mężczyznę i ukarzą go."
  tags: []
"Pwt22,19":
  text: "I nałożą na niego grzywnę wynoszącą sto syklów srebra, które oddadzą ojcu tej dziewczyny, ponieważ zniesławił dziewicę Izraela. Pozostanie jego żoną i nie będzie mógł jej oddalić po wszystkie swoje dni."
  tags: []
"Pwt22,20":
  text: "Lecz jeśli oskarżenie będzie słuszne, a nie znajdą się dowody dziewictwa tej dziewczyny;"
  tags: []
"Pwt22,21":
  text: "Wtedy wyprowadzą tę dziewczynę do drzwi domu jej ojca i mężczyźni tego miasta ukamienują ją na śmierć, gdyż popełniła haniebny czyn w Izraelu, uprawiając nierząd w domu swego ojca. Tak usuniesz zło spośród siebie."
  tags: []
"Pwt22,22":
  text: "Jeśli znajdzie się mężczyznę leżącego z zamężną kobietą, wtedy oboje umrą, mężczyzna, który leżał z kobietą, i ta kobieta. Tak usuniesz zło z Izraela."
  tags: []
"Pwt22,23":
  text: "Jeśli dziewczynę, która jest dziewicą zaślubioną mężowi, napotka jakiś mężczyzna w mieście i będzie z nią obcował;"
  tags: []
"Pwt22,24":
  text: "Wtedy wyprowadzisz oboje do bramy miasta i ukamienujecie ich na śmierć; dziewczynę za to, że będąc w mieście, nie krzyczała, a mężczyznę za to, że zhańbił żonę swego bliźniego. Tak usuniesz zło spośród siebie."
  tags: []
"Pwt22,25":
  text: "Lecz jeśli mężczyzna napotka zaślubioną dziewczynę w polu, porwie ją i zgwałci, wtedy poniesie śmierć tylko mężczyzna, który z nią obcował."
  tags: []
"Pwt22,26":
  text: "Ale dziewczynie nic nie uczynisz; dziewczyna nie zasługuje na śmierć, gdyż jest podobnie jak w przypadku, gdy ktoś powstaje przeciwko swemu bliźniemu i morduje go."
  tags: []
"Pwt22,27":
  text: "Napotkał ją bowiem w polu, a gdy zaślubiona dziewczyna krzyczała, nie było nikogo, kto by ją uratował."
  tags: []
"Pwt22,28":
  text: "Jeśli mężczyzna napotka dziewczynę, która jest dziewicą i niezaślubiona, pochwyci ją i będzie z nią obcował, i zostaną przyłapani;"
  tags: []
"Pwt22,29":
  text: "Wtedy mężczyzna, który z nią obcował, da ojcu dziewczyny pięćdziesiąt syklów srebra i będzie ona jego żoną; a ponieważ ją zhańbił, nie będzie mógł jej oddalić po wszystkie swoje dni."
  tags: []
"Pwt22,30":
  text: "Nie pojmie mężczyzna żony swego ojca i nie odkryje brzegu szaty swego ojca."
  tags: []
