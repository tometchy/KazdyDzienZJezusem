"Pwt28,1": "Jeśli będziesz pilnie słuchał głosu PANA, swego Boga, by przestrzegać i wypełniać wszystkie jego przykazania, które ci dziś nakazuję, to PAN, twój Bóg, wywyższy cię ponad wszystkie narody ziemi."
"Pwt28,2": "I spłyną na ciebie te wszystkie błogosławieństwa, i dosięgną cię, jeśli będziesz słuchał głosu PANA, swego Boga:"
"Pwt28,3": "Błogosławiony będziesz w mieście i błogosławiony będziesz na polu."
"Pwt28,4": "Błogosławiony będzie owoc twego łona, owoc twojej ziemi, owoc twego bydła, przyrost twego stada oraz trzody twoich owiec."
"Pwt28,5": "Błogosławiony będzie twój kosz i twoja dzieża."
"Pwt28,6": "Błogosławiony będziesz, gdy będziesz wchodził, i błogosławiony, gdy będziesz wychodził."
"Pwt28,7": "PAN sprawi, że twoi wrogowie, którzy powstaną przeciwko tobie, zostaną pobici przed tobą. Jedną drogą wyruszą przeciwko tobie, a siedmioma drogami będą przed tobą uciekać."
"Pwt28,8": "PAN przykaże, aby było z tobą błogosławieństwo w twoich spichlerzach i we wszystkim, do czego wyciągniesz swoją rękę; i będzie ci błogosławił w ziemi, którą daje ci PAN, twój Bóg."
"Pwt28,9": "PAN ustanowi cię dla siebie świętym ludem, tak jak ci poprzysiągł, jeśli będziesz przestrzegać przykazań PANA, swego Boga, i chodził jego drogami."
"Pwt28,10": "I wszystkie narody ziemi zobaczą, że jesteś nazywany imieniem PANA, i będą się ciebie lękać."
"Pwt28,11": "PAN obdarzy cię obfitością dobra, owocu twego łona, owocu twego bydła, owocu twego pola, w ziemi, którą PAN poprzysiągł twoim ojcom, że ją tobie da."
"Pwt28,12": "PAN otworzy dla ciebie swój bogaty skarbiec, niebo, aby dawać deszcz twojej ziemi w odpowiednim czasie i błogosławić wszelką pracę twoich rąk. Będziesz pożyczał wielu narodom, a sam od nikogo nie będziesz pożyczał."
"Pwt28,13": "I PAN umieści cię na czele, a nie na końcu; i będziesz tylko na górze, a nie będziesz na dole, jeśli będziesz słuchał przykazań PANA, swego Boga, które ci dziś nakazuję, abyś ich przestrzegał i je wypełniał."
"Pwt28,14": "I nie odstąpisz od żadnego słowa, które ja wam dziś nakazuję, ani na prawo, ani na lewo, by iść za innymi bogami i im służyć."
"Pwt28,15": "Lecz jeśli nie będziesz słuchał głosu PANA, swego Boga, by przestrzegać wszystkich jego przykazań i ustaw, które ci dziś nakazuję, i wypełniać je, to spadną na ciebie wszystkie te przekleństwa i cię dosięgną:"
"Pwt28,16": "Przeklęty będziesz w mieście, przeklęty będziesz na polu."
"Pwt28,17": "Przeklęty będzie twój kosz i twoja dzieża."
"Pwt28,18": "Przeklęty będzie owoc twego łona, owoc twojej ziemi, przyrost twego bydła oraz trzody twoich owiec."
"Pwt28,19": "Przeklęty będziesz, kiedy będziesz wchodził, i przeklęty, kiedy będziesz wychodził."
"Pwt28,20": "PAN ześle na ciebie przekleństwo, trwogę i karę we wszystkim, do czego wyciągniesz swoją rękę i co czynić będziesz, aż zostaniesz zniszczony i szybko zginiesz z powodu niegodziwości swoich czynów, przez które mnie opuściłeś."
"Pwt28,21": "PAN sprawi, że przylgnie do ciebie zaraza, aż cię wyniszczy z ziemi, do której idziesz, by ją posiąść."
"Pwt28,22": "PAN uderzy cię suchotami, febrą, zapaleniem, silną gorączką, mieczem, suszą i pleśnią, które będą cię prześladować, aż zginiesz."
"Pwt28,23": "Niebo nad twoją głową stanie się miedzią, a ziemia pod tobą – żelazem."
"Pwt28,24": "PAN ześle na twą ziemię jak deszcz proch i pył, które na ciebie spadną z nieba, aż cię zniszczy."
"Pwt28,25": "PAN sprawi, że zostaniesz pobity przed swymi wrogami. Jedną drogą wyruszysz przeciwko nim, lecz siedmioma drogami będziesz uciekał przed nimi, i będziesz wysiedlony do wszystkich królestw ziemi."
"Pwt28,26": "A twój trup będzie pokarmem dla wszelkiego ptactwa nieba i zwierząt ziemi i nikt ich nie odpędzi."
"Pwt28,27": "PAN dotknie cię wrzodem egipskim, hemoroidami, świerzbem i liszajem, z których nie zdołasz się wyleczyć."
"Pwt28,28": "PAN dotknie cię obłędem, ślepotą i przerażeniem serca."
"Pwt28,29": "W południe będziesz chodził po omacku, jak ślepy w ciemności, i nie powiedzie ci się na twoich drogach. Będziesz uciskany i łupiony po wszystkie dni, a nikt cię nie wybawi."
"Pwt28,30": "Poślubisz sobie żonę, lecz inny mężczyzna będzie z nią obcować. Zbudujesz dom, lecz w nim nie zamieszkasz. Zasadzisz winnicę, lecz z niej nie skorzystasz."
"Pwt28,31": "Twój wół zostanie zabity na twoich oczach, ale nie będziesz go jadł. Twój osioł zostanie ci zabrany sprzed twego oblicza, ale nie zwrócą ci go. Twoje owce zostaną oddane twoim wrogom, ale nikt cię nie uratuje."
"Pwt28,32": "Twoi synowie i twoje córki zostaną wydani innemu narodowi, a twoje oczy, wypatrując ich, zasłabną z tęsknoty za nimi przez cały dzień, a twoja ręka będzie bezsilna."
"Pwt28,33": "Owoc twojej ziemi i całą twoją pracę pożre naród, którego ty nie znasz, i będziesz tylko uciskany i dręczony po wszystkie dni."
"Pwt28,34": "I oszalejesz na widok tego, co zobaczą twoje oczy."
"Pwt28,35": "PAN dotknie cię złośliwym wrzodem na kolanach i na goleniach, którego nie będzie można wyleczyć, od stopy aż po czubek głowy."
"Pwt28,36": "PAN zaprowadzi ciebie i twojego króla, którego ustanowisz nad sobą, do narodu, którego nie znałeś ani ty, ani twoi ojcowie. Tam będziesz służył innym bogom, drewnu i kamieniowi."
"Pwt28,37": "I będziesz dziwowiskiem, tematem przysłowia i pośmiewiskiem wśród wszystkich narodów, do których PAN cię zaprowadzi."
"Pwt28,38": "Dużo ziarna wyniesiesz na pole, lecz mało zbierzesz, gdyż pożre je szarańcza."
"Pwt28,39": "Winnicę zasadzisz i uprawisz, ale nie będziesz pił wina ani zbierał winogron, gdyż pożre je robactwo."
"Pwt28,40": "Będziesz miał drzewa oliwne we wszystkich swoich granicach, lecz nie namaścisz się oliwą, bo twoje oliwki opadną."
"Pwt28,41": "Spłodzisz synów i córki, ale nie będą twoje, bo pójdą w niewolę."
"Pwt28,42": "Wszystkie twoje drzewa i owoc twojej ziemi pożre szarańcza."
"Pwt28,43": "Cudzoziemiec, który jest pośród ciebie, wzniesie się wielce nad tobą, a ty schylisz się bardzo nisko."
"Pwt28,44": "On będzie tobie pożyczał, a ty jemu nie będziesz pożyczał. On będzie na czele, a ty będziesz na końcu."
"Pwt28,45": "I spadną na ciebie wszystkie te przekleństwa, i będą cię ścigały, i dosięgną cię, aż cię zniszczą, ponieważ nie słuchałeś głosu PANA, swego Boga, by przestrzegać jego przykazań i ustaw, które ci nakazał."
"Pwt28,46": "A te plagi będą na tobie i na twym potomstwie jako znak i cud na wieki."
"Pwt28,47": "Dlatego, że nie służyłeś PANU, swemu Bogu, w radości i z weselem serca, gdy miałeś obfitość wszystkiego."
"Pwt28,48": "I będziesz służył swoim wrogom, których PAN ześle na ciebie, w głodzie, w pragnieniu, w nagości i w niedostatku wszystkiego. I włoży żelazne jarzmo na twoją szyję, aż cię wyniszczy."
"Pwt28,49": "PAN sprowadzi na ciebie naród z daleka, z krańców ziemi, który przyleci jak orzeł; naród, którego języka nie zrozumiesz."
"Pwt28,50": "Naród o srogim obliczu, który nie będzie miał względu na starego ani się nad dzieckiem nie zlituje;"
"Pwt28,51": "I pożre owoc twego bydła i owoc twojej ziemi, aż cię zniszczy. I nie zostawi ci ani zboża, ani moszczu, ani oliwy, ani przyrostu twych wołów, ani trzód twych owiec, aż cię wyniszczy."
"Pwt28,52": "I oblegnie cię we wszystkich twoich bramach, aż w całej twojej ziemi upadną twoje wysokie i obronne mury, w których pokładałeś ufność. Oblegnie cię we wszystkich twoich bramach, na całej twojej ziemi, którą daje ci PAN, twój Bóg."
"Pwt28,53": "Będziesz jadł płód swego łona, ciało swoich synów i córek, których dał ci PAN, twój Bóg, w czasie oblężenia i ucisku, jakimi twój wróg cię przytłoczy."
"Pwt28,54": "Mężczyzna delikatny pośród was i w rozkoszy wychowany będzie spoglądał złym okiem na swego brata, na swą własną żonę i na resztę swych dzieci, które pozostały."
"Pwt28,55": "I nie da żadnemu z nich z ciała swych dzieci, które będzie jadł, dlatego że nic innego mu nie zostało w oblężeniu i ucisku, jakimi twój wróg cię uciśnie we wszystkich twoich bramach."
"Pwt28,56": "Kobieta delikatna pośród was i w rozkoszy wychowana, która nie chciała postawić swojej nogi na ziemi z powodu delikatności i rozkoszy, będzie spoglądała złym okiem na męża swego łona, na swego syna i na swoją córkę;"
"Pwt28,57": "I na swe łożysko, które wychodzi z niej przy porodzie, i na swoje dzieci, które urodzi. Potajemnie będzie je bowiem jeść z braku wszystkiego w czasie oblężenia i ucisku, jakimi twój wróg przytłoczy cię w twoich bramach."
"Pwt28,58": "Jeśli nie będziesz pilnował wypełnienia wszystkich słów tego prawa, które są napisane w tej księdze, żebyś się bał tego chwalebnego i strasznego imienia: PAN, twój Bóg;"
"Pwt28,59": "PAN ześle na ciebie i na twoje potomstwo niezwykłe plagi, plagi wielkie i niekończące się, także ciężkie i długotrwałe choroby."
"Pwt28,60": "I sprowadzi na ciebie wszystkie choroby egipskie, których się lękałeś, i przylgną one do ciebie."
"Pwt28,61": "Także wszelką chorobę i wszelką plagę, która nie jest napisana w księdze tego prawa, PAN sprowadzi na ciebie, aż cię wytępi."
"Pwt28,62": "I pozostanie was niewielu, którzy przedtem byliście tak liczni jak gwiazdy niebieskie, bo nie posłuchałeś głosu PANA, swego Boga."
"Pwt28,63": "I będzie tak, że jak PAN radował się wami, czyniąc wam dobrze i rozmnażając was, tak PAN będzie się wami radował, niszcząc was i gładząc was; i będziecie wykorzenieni z ziemi, do której idziecie, aby ją posiąść."
"Pwt28,64": "I PAN rozproszy cię wśród wszystkich narodów, od jednego krańca ziemi aż do drugiego; tam będziesz służył innym bogom, których nie znałeś ani ty, ani twoi ojcowie – nawet drewnu i kamieniowi."
"Pwt28,65": "A wśród tych narodów nie zaznasz wytchnienia ani stopa twojej nogi nie odpocznie. A PAN da ci tam lękliwe serce, wyczerpane oczy i smutek duszy."
"Pwt28,66": "I twoje życie będzie przed tobą jakby w zawieszeniu, będziesz się lękał w nocy i we dnie i nie będziesz pewien swego życia."
"Pwt28,67": "Rano powiesz: Oby już był wieczór, a wieczorem powiesz: Oby już był ranek; z powodu strachu w twoim sercu, który będziesz odczuwać, i z powodu tego, co zobaczą twoje oczy."
"Pwt28,68": "I PAN zawróci cię do Egiptu na okrętach drogą, o której ci powiedziałem, że już jej nie zobaczysz. Tam będziecie się sprzedawać swoim wrogom jako niewolnicy i niewolnice, ale nikt was nie kupi."
