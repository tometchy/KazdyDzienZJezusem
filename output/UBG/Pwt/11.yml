"Pwt11,1":
  text: "Miłuj więc PANA, swego Boga, i przestrzegaj jego nakazu, jego ustaw, jego praw i jego przykazań przez wszystkie dni."
  tags: []
"Pwt11,2":
  text: "A poznajcie dziś (bo nie mówię do waszych synów, którzy nie znali i nie widzieli karania PANA, waszego Boga) jego wielkość, jego potężną rękę i jego wyciągnięte ramię;"
  tags: []
"Pwt11,3":
  text: "Jego cuda i jego dzieła, których dokonał w Egipcie na faraonie, królu Egiptu, i na całej jego ziemi;"
  tags: []
"Pwt11,4":
  text: "I co uczynił wojskom Egiptu, ich koniom i ich rydwanom: sprawił, że wody Morza Czerwonego zalały je, gdy was gonili, i wytracił ich PAN aż do dziś;"
  tags: []
"Pwt11,5":
  text: "Także i to, co uczynił dla was na pustyni, aż do waszego przybycia na to miejsce;"
  tags: []
"Pwt11,6":
  text: "I to, co uczynił Datanowi i Abiramowi, synom Eliaba, syna Rubena, gdy ziemia otworzyła swe usta i pochłonęła ich spośród całego Izraela razem z ich rodzinami, namiotami i całym ich dobytkiem."
  tags: []
"Pwt11,7":
  text: "A wasze oczy widziały wszystkie te wielkie dzieła PANA, których dokonał."
  tags: []
"Pwt11,8":
  text: "Przestrzegajcie więc każdego przykazania, które wam dziś nakazuję, abyście się umocnili, weszli i posiedli ziemię, do której wchodzicie, aby ją wziąć w posiadanie;"
  tags: []
"Pwt11,9":
  text: "I żebyście przedłużyli swoje dni na ziemi, którą PAN poprzysiągł dać waszym ojcom i ich potomstwu, ziemię opływającą mlekiem i miodem."
  tags: []
"Pwt11,10":
  text: "Ziemia bowiem, do której wchodzisz, aby ją posiąść, nie jest jak ziemia Egiptu, z której wyszliście, którą zasiewałeś swoim ziarnem i nawadniałeś przy pomocy swoich nóg, jak ogród jarzyn."
  tags: []
"Pwt11,11":
  text: "Lecz ziemia, do której wchodzicie, aby ją posiąść, jest ziemią gór i dolin, która pije wodę deszczu z nieba;"
  tags: []
"Pwt11,12":
  text: "Jest to ziemia, o którą PAN, twój Bóg, się troszczy, i na której oczy PANA, twego Boga, stale spoczywają, od początku roku do jego końca."
  tags: []
"Pwt11,13":
  text: "A jeśli będziecie pilnie słuchać moich przykazań, które wam dziś nakazuję – żebyście miłowali PANA, swojego Boga, i służyli mu z całego swego serca i całą swoją duszą;"
  tags: []
"Pwt11,14":
  text: "Wtedy dam waszej ziemi w odpowiednim czasie deszcz wczesny i późny i będziesz zbierał swoje zboża, swoje wino i swoją oliwę."
  tags: []
"Pwt11,15":
  text: "Dam też trawę na twoich polach dla twojego bydła, a będziesz jadł do syta."
  tags: []
"Pwt11,16":
  text: "Strzeżcie się, aby wasze serce nie dało się zwieść, abyście nie odstąpili i nie służyli innym bogom, i nie oddawali im pokłonu;"
  tags: []
"Pwt11,17":
  text: "Bo wówczas zapali się gniew PANA przeciwko wam i zamknie on niebo, aby nie było deszczu i aby ziemia nie wydała swego plonu, i szybko wyginiecie z tej dobrej ziemi, którą PAN wam daje."
  tags: []
"Pwt11,18":
  text: "Weźcie więc te moje słowa do swego serca i do swej duszy i przywiążcie je do swojej ręki jako znak, i niech będą jak przepaski między waszymi oczami."
  tags: []
"Pwt11,19":
  text: "I nauczcie ich swoje dzieci, rozmawiając o nich, gdy siedzisz w domu i gdy będziesz w drodze, gdy się kładziesz i gdy wstajesz."
  tags: []
"Pwt11,20":
  text: "Wypiszesz je też na odrzwiach swego domu i na swoich bramach;"
  tags: []
"Pwt11,21":
  text: "Aby się pomnożyły wasze dni i dni waszych dzieci w ziemi, którą PAN poprzysiągł dać waszym ojcom, dopóki niebo będzie trwać nad ziemią."
  tags: []
"Pwt11,22":
  text: "Bo jeśli będziecie pilnie przestrzegać wszystkich przykazań, które ja wam nakazuję wypełniać, żebyście miłowali PANA, swojego Boga, i chodzili wszystkimi jego drogami, lgnąc do niego;"
  tags: []
"Pwt11,23":
  text: "Wtedy PAN wypędzi przed wami wszystkie te narody i zawładniecie narodami większymi i potężniejszymi od was."
  tags: []
"Pwt11,24":
  text: "Każde miejsce, po którym stąpać będzie stopa waszej nogi, będzie wasze: od pustyni i Libanu, od rzeki Eufrat aż do morza zachodniego będzie wasza granica."
  tags: []
"Pwt11,25":
  text: "Nikt nie ostoi się przed wami. PAN, wasz Bóg, wzbudzi strach i lęk przed wami po całej ziemi, którą będziecie deptać, jak wam powiedział."
  tags: []
"Pwt11,26":
  text: "Oto dziś kładę przed wami błogosławieństwo i przekleństwo."
  tags: []
"Pwt11,27":
  text: "Błogosławieństwo, jeśli będziecie posłuszni przykazaniom PANA, swojego Boga, które dziś wam nakazuję."
  tags: []
"Pwt11,28":
  text: "A przekleństwo, jeśli nie będziecie posłuszni przykazaniom PANA, swojego Boga, i zboczycie z drogi, którą wam dziś nakazuję, aby pójść za innymi bogami, których nie poznaliście."
  tags: []
"Pwt11,29":
  text: "Gdy PAN, twój Bóg, wprowadzi cię do ziemi, do której wchodzisz, aby ją posiąść, umieścisz to błogosławieństwo na górze Gerizim, a przekleństwo na górze Ebal."
  tags: []
"Pwt11,30":
  text: "Czy nie znajdują się one za Jordanem, po drodze w kierunku zachodu słońca, w ziemi Kananejczyków, którzy mieszkają na stepie, naprzeciwko Gilgal, przy równinie More?"
  tags: []
"Pwt11,31":
  text: "Wy bowiem przejdziecie przez Jordan, aby wejść i posiąść ziemię, którą daje wam PAN, wasz Bóg, i posiądziecie ją i w niej zamieszkacie."
  tags: []
"Pwt11,32":
  text: "Dopilnujcie, abyście wypełniali wszystkie nakazy i prawa, które dziś wam przedkładam."
  tags: []
