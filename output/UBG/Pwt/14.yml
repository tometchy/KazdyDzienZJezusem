"Pwt14,1":
  text: "Jesteście dziećmi PANA, swojego Boga. Nie będziecie się kaleczyć ani robić łysiny między swymi oczyma po umarłym;"
  tags: []
"Pwt14,2":
  text: "Jesteś bowiem ludem świętym dla PANA, swego Boga, i PAN wybrał cię, abyś był dla niego szczególnym ludem spośród wszystkich narodów, które są na ziemi."
  tags: []
"Pwt14,3":
  text: "Nie będziesz jeść nic obrzydliwego."
  tags: []
"Pwt14,4":
  text: "Oto zwierzęta, które możecie jeść: wół, owca i koza;"
  tags: []
"Pwt14,5":
  text: "Jeleń, sarna, daniel, koziorożec, antylopa, dziki wół i kozica."
  tags: []
"Pwt14,6":
  text: "I każde zwierzę, które ma rozdzielone kopyto, podzielone na pół racice i które spośród zwierząt przeżuwa, te będziecie jeść."
  tags: []
"Pwt14,7":
  text: "Lecz z tych, które przeżuwają lub które mają rozdzielone kopyta, nie będziecie jeść wielbłąda, zająca i królika. One bowiem przeżuwają, ale nie mają rozdzielonych kopyt; będą dla was nieczyste."
  tags: []
"Pwt14,8":
  text: "Także świni, bo choć ma kopyto rozdzielone, nie przeżuwa; będzie dla was nieczysta. Ich mięsa nie będziecie jeść i ich padliny nie będziecie dotykać."
  tags: []
"Pwt14,9":
  text: "To będziecie jeść ze wszystkiego, co jest w wodzie: wszystko, co ma płetwy i łuski, będziecie jeść."
  tags: []
"Pwt14,10":
  text: "Lecz wszystkiego, co nie ma płetw i łusek, nie będziecie jeść; będzie to dla was nieczyste."
  tags: []
"Pwt14,11":
  text: "Wszelkie czyste ptactwo będziecie jeść."
  tags: []
"Pwt14,12":
  text: "Lecz oto te, których jeść nie będziecie: orzeł, orłosęp i rybołów;"
  tags: []
"Pwt14,13":
  text: "Sokół, kania i sęp według jego rodzaju;"
  tags: []
"Pwt14,14":
  text: "I kruk według jego rodzaju;"
  tags: []
"Pwt14,15":
  text: "Struś, sowa, mewa i jastrząb według jego rodzaju;"
  tags: []
"Pwt14,16":
  text: "Puszczyk, puchacz i łabędź;"
  tags: []
"Pwt14,17":
  text: "Pelikan, ścierwnik i kormoran;"
  tags: []
"Pwt14,18":
  text: "Bocian i czapla według ich rodzaju, dudek i nietoperz."
  tags: []
"Pwt14,19":
  text: "Wszelkie owady skrzydlate będą dla was nieczyste, nie będziecie ich jeść."
  tags: []
"Pwt14,20":
  text: "Możecie jeść każdego ptaka czystego."
  tags: []
"Pwt14,21":
  text: "Nie będziecie jeść żadnej padliny. Dasz to do spożycia przybyszowi, który jest w twoich bramach, albo sprzedasz cudzoziemcowi, gdyż jesteś ludem świętym dla PANA, swego Boga. Nie będziesz gotować koźlęcia w mleku jego matki."
  tags: []
"Pwt14,22":
  text: "Ochoczo będziesz dawać dziesięciny z całego zbioru swego nasienia, które co roku wydaje pole."
  tags: []
"Pwt14,23":
  text: "A będziesz spożywać przed PANEM, swoim Bogiem, w miejscu, które wybierze na mieszkanie dla swego imienia, dziesięcinę ze swego zboża, wina i oliwy oraz z pierworodnych swoich wołów i trzód, byś uczył się bać PANA, swego Boga, po wszystkie dni."
  tags: []
"Pwt14,24":
  text: "A jeśli daleka będzie twoja droga i nie będziesz mógł tego tam zanieść, jeśli odległe jest od ciebie to miejsce, które wybierze PAN, twój Bóg, na mieszkanie dla swego imienia, gdy PAN, twój Bóg, będzie cię błogosławić;"
  tags: []
"Pwt14,25":
  text: "Wtedy spieniężysz to, pieniądze zawiniesz w swoich rękach i pójdziesz na miejsce, które wybierze PAN, twój Bóg."
  tags: []
"Pwt14,26":
  text: "I za te pieniądze kupisz wszystko, czego zapragnie twoja dusza: woły, owce, wino czy mocny napój lub wszystko, czego zechce twoja dusza. I będziesz tam jadł przed PANEM, swoim Bogiem, i będziesz się cieszył, ty i twój dom;"
  tags: []
"Pwt14,27":
  text: "Oraz Lewita, który mieszka w twoich bramach; nie opuścisz go, gdyż nie ma działu ani dziedzictwa z tobą."
  tags: []
"Pwt14,28":
  text: "Po upływie trzech lat odłożysz wszystkie dziesięciny ze zbiorów tego samego roku i złożysz ją w swoich bramach."
  tags: []
"Pwt14,29":
  text: "Wtedy przyjdzie Lewita, który nie ma działu ani dziedzictwa z tobą, oraz przybysz, sierota i wdowa, którzy są w twoich bramach, i będą jeść do syta, aby PAN, twój Bóg, błogosławił cię w każdej pracy twoich rąk, której się podejmiesz."
  tags: []
