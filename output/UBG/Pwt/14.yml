"Pwt14,1": "Jesteście dziećmi PANA, swojego Boga. Nie będziecie się kaleczyć ani robić łysiny między swymi oczyma po umarłym;"
"Pwt14,2": "Jesteś bowiem ludem świętym dla PANA, swego Boga, i PAN wybrał cię, abyś był dla niego szczególnym ludem spośród wszystkich narodów, które są na ziemi."
"Pwt14,3": "Nie będziesz jeść nic obrzydliwego."
"Pwt14,4": "Oto zwierzęta, które możecie jeść: wół, owca i koza;"
"Pwt14,5": "Jeleń, sarna, daniel, koziorożec, antylopa, dziki wół i kozica."
"Pwt14,6": "I każde zwierzę, które ma rozdzielone kopyto, podzielone na pół racice i które spośród zwierząt przeżuwa, te będziecie jeść."
"Pwt14,7": "Lecz z tych, które przeżuwają lub które mają rozdzielone kopyta, nie będziecie jeść wielbłąda, zająca i królika. One bowiem przeżuwają, ale nie mają rozdzielonych kopyt; będą dla was nieczyste."
"Pwt14,8": "Także świni, bo choć ma kopyto rozdzielone, nie przeżuwa; będzie dla was nieczysta. Ich mięsa nie będziecie jeść i ich padliny nie będziecie dotykać."
"Pwt14,9": "To będziecie jeść ze wszystkiego, co jest w wodzie: wszystko, co ma płetwy i łuski, będziecie jeść."
"Pwt14,10": "Lecz wszystkiego, co nie ma płetw i łusek, nie będziecie jeść; będzie to dla was nieczyste."
"Pwt14,11": "Wszelkie czyste ptactwo będziecie jeść."
"Pwt14,12": "Lecz oto te, których jeść nie będziecie: orzeł, orłosęp i rybołów;"
"Pwt14,13": "Sokół, kania i sęp według jego rodzaju;"
"Pwt14,14": "I kruk według jego rodzaju;"
"Pwt14,15": "Struś, sowa, mewa i jastrząb według jego rodzaju;"
"Pwt14,16": "Puszczyk, puchacz i łabędź;"
"Pwt14,17": "Pelikan, ścierwnik i kormoran;"
"Pwt14,18": "Bocian i czapla według ich rodzaju, dudek i nietoperz."
"Pwt14,19": "Wszelkie owady skrzydlate będą dla was nieczyste, nie będziecie ich jeść."
"Pwt14,20": "Możecie jeść każdego ptaka czystego."
"Pwt14,21": "Nie będziecie jeść żadnej padliny. Dasz to do spożycia przybyszowi, który jest w twoich bramach, albo sprzedasz cudzoziemcowi, gdyż jesteś ludem świętym dla PANA, swego Boga. Nie będziesz gotować koźlęcia w mleku jego matki."
"Pwt14,22": "Ochoczo będziesz dawać dziesięciny z całego zbioru swego nasienia, które co roku wydaje pole."
"Pwt14,23": "A będziesz spożywać przed PANEM, swoim Bogiem, w miejscu, które wybierze na mieszkanie dla swego imienia, dziesięcinę ze swego zboża, wina i oliwy oraz z pierworodnych swoich wołów i trzód, byś uczył się bać PANA, swego Boga, po wszystkie dni."
"Pwt14,24": "A jeśli daleka będzie twoja droga i nie będziesz mógł tego tam zanieść, jeśli odległe jest od ciebie to miejsce, które wybierze PAN, twój Bóg, na mieszkanie dla swego imienia, gdy PAN, twój Bóg, będzie cię błogosławić;"
"Pwt14,25": "Wtedy spieniężysz to, pieniądze zawiniesz w swoich rękach i pójdziesz na miejsce, które wybierze PAN, twój Bóg."
"Pwt14,26": "I za te pieniądze kupisz wszystko, czego zapragnie twoja dusza: woły, owce, wino czy mocny napój lub wszystko, czego zechce twoja dusza. I będziesz tam jadł przed PANEM, swoim Bogiem, i będziesz się cieszył, ty i twój dom;"
"Pwt14,27": "Oraz Lewita, który mieszka w twoich bramach; nie opuścisz go, gdyż nie ma działu ani dziedzictwa z tobą."
"Pwt14,28": "Po upływie trzech lat odłożysz wszystkie dziesięciny ze zbiorów tego samego roku i złożysz ją w swoich bramach."
"Pwt14,29": "Wtedy przyjdzie Lewita, który nie ma działu ani dziedzictwa z tobą, oraz przybysz, sierota i wdowa, którzy są w twoich bramach, i będą jeść do syta, aby PAN, twój Bóg, błogosławił cię w każdej pracy twoich rąk, której się podejmiesz."
