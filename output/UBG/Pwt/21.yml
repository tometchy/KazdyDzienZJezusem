"Pwt21,1":
  text: "Jeśli w ziemi, którą PAN, twój Bóg, daje ci w posiadanie, zostanie znaleziony zabity człowiek leżący na polu, a nie wiadomo, kto go zabił;"
  tags: []
"Pwt21,2":
  text: "Wtedy twoi starsi i sędziowie wyjdą i zmierzą odległość do miast leżących dokoła zabitego."
  tags: []
"Pwt21,3":
  text: "A starsi tego miasta, które leży najbliżej zabitego, wezmą jałówkę, której jeszcze nie użyto do pracy i która jeszcze nie ciągnęła w jarzmie;"
  tags: []
"Pwt21,4":
  text: "I zaprowadzą starsi tego miasta jałówkę do kamienistej doliny, gdzie nigdy nie uprawiano ani nie zasiewano, i tam utną kark jałówki w tej dolinie."
  tags: []
"Pwt21,5":
  text: "Potem przyjdą kapłani, synowie Lewiego, gdyż ich wybrał PAN, twój Bóg, aby mu służyli i aby błogosławili w imię PANA, a według ich uznania ma być rozstrzygnięty każdy spór i każde zranienie;"
  tags: []
"Pwt21,6":
  text: "I wszyscy starsi tego miasta, które leży najbliżej zabitego, umyją swoje ręce nad jałówką, którą ścięto w dolinie;"
  tags: []
"Pwt21,7":
  text: "I oświadczą: Nasze ręce nie wylały tej krwi i nasze oczy tego nie widziały."
  tags: []
"Pwt21,8":
  text: "PANIE, przyjmij przebłaganie za twój lud Izraela, który odkupiłeś, a nie poczytaj twemu ludowi Izraela niewinnej krwi. I będą oczyszczeni od tej krwi."
  tags: []
"Pwt21,9":
  text: "W ten sposób usuniesz niewinną krew spośród siebie, gdy uczynisz to, co jest prawe w oczach PANA."
  tags: []
"Pwt21,10":
  text: "Gdy też wyruszysz na wojnę przeciwko swoim wrogom i PAN, twój Bóg, wyda ich w twoje ręce, i weźmiesz z nich jeńców;"
  tags: []
"Pwt21,11":
  text: "I zobaczysz wśród jeńców piękną kobietę, którą sobie upodobasz, i chciałbyś pojąć ją za żonę;"
  tags: []
"Pwt21,12":
  text: "Wtedy przyprowadzisz ją do swego domu, a ona ogoli swoją głowę i obetnie sobie paznokcie;"
  tags: []
"Pwt21,13":
  text: "I złoży z siebie szatę, w której została pojmana, zostanie w twoim domu i będzie opłakiwać swego ojca i matkę przez cały miesiąc. Potem będziesz z nią obcował i będziesz jej mężem, a ona będzie twoją żoną."
  tags: []
"Pwt21,14":
  text: "A jeśli nie będzie ci się podobać, wtedy pozwolisz jej odejść, dokąd zechce; żadną miarą nie sprzedasz jej za pieniądze i nie będziesz nią kupczyć, gdyż ją poniżyłeś."
  tags: []
"Pwt21,15":
  text: "Gdyby mężczyzna miał dwie żony, jedną kochaną, a drugą znienawidzoną, i one urodzą mu synów – kochana i znienawidzona – a pierworodny będzie synem znienawidzonej;"
  tags: []
"Pwt21,16":
  text: "To gdy będzie przydzielał dobra swoim synom w dziedzictwo, nie będzie mógł ustanowić pierworodnym syna kochanej przed pierworodnym synem znienawidzonej;"
  tags: []
"Pwt21,17":
  text: "Ale za pierworodnego uzna syna znienawidzonej, dając mu podwójną część wszystkiego, co ma, gdyż on jest początkiem jego siły, jemu przysługuje prawo pierworództwa."
  tags: []
"Pwt21,18":
  text: "Jeśli ktoś ma syna upartego i krnąbrnego, który nie słucha ani głosu swojego ojca, ani głosu swojej matki, a choć go karcą, nie słucha ich;"
  tags: []
"Pwt21,19":
  text: "Wtedy jego ojciec i matka wezmą go i przyprowadzą do starszych swego miasta i do bramy jego miejscowości;"
  tags: []
"Pwt21,20":
  text: "I powiedzą do starszych miasta: Ten nasz syn jest uparty i krnąbrny, nie słucha naszego głosu, jest żarłokiem i pijakiem;"
  tags: []
"Pwt21,21":
  text: "Wtedy wszyscy mężczyźni tego miasta ukamienują go na śmierć; w ten sposób usuniesz zło spośród siebie, a cały Izrael usłyszy o tym i będzie się bać."
  tags: []
"Pwt21,22":
  text: "A jeśli ktoś popełni grzech zasługujący na śmierć i poniesie śmierć, a powiesisz go na drzewie;"
  tags: []
"Pwt21,23":
  text: "Jego trup nie pozostanie na drzewie przez noc, lecz musisz go pochować tego samego dnia, bo ten, kto wisi, jest przeklęty przez Boga. Nie będziesz plugawił twojej ziemi, którą PAN, twój Bóg, daje ci w dziedzictwo."
  tags: []
