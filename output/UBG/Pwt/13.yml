"Pwt13,1":
  text: "Jeśli powstanie pośród was prorok albo ktoś, kto ma sny, i ukaże ci znak lub cud;"
  tags: []
"Pwt13,2":
  text: "I stanie się ten znak albo cud, o którym ci oznajmił, i powie: Pójdźmy za innymi bogami, których ty nie znasz, i służmy im;"
  tags: []
"Pwt13,3":
  text: "Nie usłuchasz słów tego proroka ani tego, który ma sny, gdyż PAN, wasz Bóg, doświadcza was, aby poznać, czy miłujecie PANA, swego Boga, z całego swego serca i całą swoją duszą."
  tags: []
"Pwt13,4":
  text: "Za PANEM, swoim Bogiem, będziecie chodzić, jego będziecie się bać, przestrzegać jego przykazań i słuchać jego głosu, będziecie mu służyć i do niego lgnąć."
  tags: []
"Pwt13,5":
  text: "A ten prorok albo ten, który ma sny, poniesie śmierć, gdyż namówił do odstępstwa od PANA, waszego Boga (który wyprowadził was z ziemi Egiptu i odkupił was z domu niewoli), by sprowadzić cię z drogi, którą PAN, twój Bóg, nakazał ci iść. W ten sposób wykorzenisz to zło spośród siebie."
  tags: []
"Pwt13,6":
  text: "Jeśli twój brat, syn twojej matki, albo twój syn bądź twoja córka albo żona spoczywająca na twym łonie, albo twój przyjaciel, który jest dla ciebie jak twoja dusza, będą cię namawiać, mówiąc potajemnie: Pójdźmy i służmy innym bogom, których nie poznałeś ani ty, ani twoi ojcowie;"
  tags: []
"Pwt13,7":
  text: "Któremuś z bogów tych narodów, które są dokoła was, tych blisko ciebie lub daleko od ciebie, od jednego końca ziemi aż do jej drugiego końca;"
  tags: []
"Pwt13,8":
  text: "Nie ulegniesz mu ani go nie usłuchasz; twoje oko nie zlituje się nad nim, nie zmiłujesz się nad nim ani nie ukryjesz go;"
  tags: []
"Pwt13,9":
  text: "Ale koniecznie go zabijesz; najpierw twoja ręka będzie nad nim, by go zabić, a potem ręka całego ludu."
  tags: []
"Pwt13,10":
  text: "I ukamienujesz go na śmierć, ponieważ chciał odwieść cię od PANA, twego Boga, który cię wyprowadził z ziemi Egiptu, z domu niewoli;"
  tags: []
"Pwt13,11":
  text: "A cały Izrael usłyszy o tym i będzie się bał, i już nie popełni takiego zła pośród was."
  tags: []
"Pwt13,12":
  text: "A jeśli usłyszysz, że w jednym z twoich miast, które PAN, twój Bóg, daje ci na mieszkanie, ktoś powie:"
  tags: []
"Pwt13,13":
  text: "Wyszli pewni ludzie Beliala spośród ciebie i uwodzą mieszkańców miasta, mówiąc: Pójdźmy i służmy innym bogom, których nie poznaliście;"
  tags: []
"Pwt13,14":
  text: "Wtedy przeprowadzisz dochodzenie, zbadasz i pilnie wypytasz. Jeśli okaże się prawdą i rzeczą pewną, że popełniono taką obrzydliwość pośród was;"
  tags: []
"Pwt13,15":
  text: "Koniecznie wytracisz mieszkańców tego miasta ostrzem miecza, zniszczysz je doszczętnie i wszystko, co w nim jest, również jego bydło, ostrzem miecza."
  tags: []
"Pwt13,16":
  text: "A cały jego łup zbierzesz na środku placu i doszczętnie spalisz w ogniu miasto razem z całym łupem dla PANA, swego Boga. I będzie zwaliskiem wiecznym, nigdy nie zostanie odbudowane."
  tags: []
"Pwt13,17":
  text: "I nie zostanie w twoich rękach nic z tych rzeczy przeklętych, aby PAN odwrócił gniew swojej zapalczywości i okazał ci miłosierdzie, i zmiłował się nad tobą, i rozmnożył cię, jak poprzysiągł twoim ojcom;"
  tags: []
"Pwt13,18":
  text: "Gdy będziesz słuchał głosu PANA, swego Boga, zachowując wszystkie jego przykazania, które ci dziś nakazuję, byś czynił to, co prawe w oczach PANA, twojego Boga."
  tags: []
