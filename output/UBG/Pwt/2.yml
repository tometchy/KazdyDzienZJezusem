"Pwt2,1":
  text: "Potem zawróciliśmy i wyruszyliśmy na pustynię, drogą w kierunku Morza Czerwonego, tak jak mi PAN powiedział, i przez wiele dni krążyliśmy dokoła góry Seir."
  tags: []
"Pwt2,2":
  text: "I PAN powiedział do mnie:"
  tags: []
"Pwt2,3":
  text: "Dosyć krążyliście dokoła tej góry. Skierujcie się na północ;"
  tags: []
"Pwt2,4":
  text: "I rozkaż ludowi: Będziecie przechodzić przez granicę waszych braci, synów Ezawa, którzy mieszkają w Seirze. Oni będą się was bać, lecz wy strzeżcie się bardzo."
  tags: []
"Pwt2,5":
  text: "Nie prowokujcie ich, gdyż nie dam wam ich ziemi nawet na szerokość stopy, bo Ezawowi dałem w posiadanie górę Seir."
  tags: []
"Pwt2,6":
  text: "Żywność będziecie kupowali od nich za pieniądze, abyście mieli co jeść; także wodę od nich będziecie kupować za pieniądze, abyście mieli co pić."
  tags: []
"Pwt2,7":
  text: "Gdyż PAN, twój Bóg, błogosławił cię w każdym dziele twoich rąk i znał twoją drogę na tej wielkiej pustyni. Już przez czterdzieści lat PAN, twój Bóg, był z tobą, a niczego ci nie brakowało."
  tags: []
"Pwt2,8":
  text: "Ominęliśmy więc naszych braci, synów Ezawa, mieszkających w Seirze, drogą równinną od Elat i od Esjon-Geber, po czym skręciliśmy i udaliśmy się w stronę pustyni Moabu."
  tags: []
"Pwt2,9":
  text: "I PAN powiedział do mnie: Nie napadaj na Moabitów ani nie rozniecaj z nimi wojny, bo nie dam ci ich ziemi w posiadanie; Ar bowiem dałem w posiadanie synom Lota."
  tags: []
"Pwt2,10":
  text: "Poprzednio mieszkali w niej Emici, lud potężny, liczny i wysoki jak Anakici;"
  tags: []
"Pwt2,11":
  text: "Uważano ich też za olbrzymów jak Anakitów, lecz Moabici nazywają ich Emitami."
  tags: []
"Pwt2,12":
  text: "Przedtem w Seirze mieszkali również Choryci, ale synowie Ezawa wypędzili ich i wyniszczyli przed sobą, po czym zamieszkali na ich miejscu, jak uczynił Izrael w ziemi swego posiadania, którą dał im PAN."
  tags: []
"Pwt2,13":
  text: "Wstańcie więc i przeprawcie się przez potok Zered. I przeprawiliśmy się przez potok Zered."
  tags: []
"Pwt2,14":
  text: "A czas, który upłynął od naszego wyjścia z Kadesz-Barnea aż do przeprawienia się przez potok Zered, wynosił trzydzieści osiem lat, aż wyginęło z obozu całe pokolenie wojowników, tak jak im to PAN poprzysiągł."
  tags: []
"Pwt2,15":
  text: "Ręka PANA bowiem zaciążyła nad nimi, aby wyniszczyć ich z obozu, aż wyginęli."
  tags: []
"Pwt2,16":
  text: "A gdy wszyscy wojownicy spośród ludu wyginęli i umarli;"
  tags: []
"Pwt2,17":
  text: "PAN przemówił do mnie:"
  tags: []
"Pwt2,18":
  text: "Dziś przejdziesz przez Ar, granicę Moabu;"
  tags: []
"Pwt2,19":
  text: "I zbliżysz się do synów Ammona; nie napadaj na nich i nie rozniecaj z nimi wojny, bo nie dam ci w posiadanie ziemi synów Ammona, dałem ją bowiem w posiadanie synom Lota."
  tags: []
"Pwt2,20":
  text: "(Także i tę ziemię uważano za ziemię olbrzymów. Olbrzymi mieszkali w niej wcześniej, a Ammonici nazywają ich Zamzummitami;"
  tags: []
"Pwt2,21":
  text: "Lud potężny, liczny i wysoki jak Anakici; lecz PAN wygubił ich przed nimi, a Ammonici ich wypędzili i zamieszkali na ich miejscu;"
  tags: []
"Pwt2,22":
  text: "Podobnie jak uczynił synom Ezawa mieszkającym w Seirze, przed którymi wytracił Chorytów; i wypędzili ich, i zamieszkali na ich miejscu aż do dziś."
  tags: []
"Pwt2,23":
  text: "Także Awwitów, którzy mieszkali w Chazerim aż do Gazy, wytracili Kaftoryci, którzy wyszli z Kaftor, i zamieszkali na ich miejscu)."
  tags: []
"Pwt2,24":
  text: "Wstańcie więc, wyruszcie i przeprawcie się przez rzekę Arnon. Oto daję w twoje ręce Sichona, króla Cheszbonu, Amorytę, oraz jego ziemię. Zacznij ją zajmować i rozpocznij z nim wojnę."
  tags: []
"Pwt2,25":
  text: "Od dziś zacznę wzbudzać strach i lęk przed tobą wśród narodów, które są pod całym niebem; kiedy usłyszą wieść o tobie, będą drżeć i będą się ciebie lękać."
  tags: []
"Pwt2,26":
  text: "Wysłałem więc posłańców z pustyni Kedemot do Sichona, króla Cheszbonu, ze słowami pokoju:"
  tags: []
"Pwt2,27":
  text: "Pozwól mi przejść przez twoją ziemię. Pójdę tylko drogą, nie zboczę ani na prawo, ani na lewo."
  tags: []
"Pwt2,28":
  text: "Sprzedasz mi za pieniądze żywność, abym mógł się pożywić; wody także za pieniądze mi dasz, abym pił. Tylko przejdę pieszo;"
  tags: []
"Pwt2,29":
  text: "Jak mi to uczynili synowie Ezawa, którzy mieszkają w Seirze, i Moabici, którzy mieszkają w Ar, aż się przeprawię przez Jordan, do ziemi, którą daje nam PAN, nasz Bóg."
  tags: []
"Pwt2,30":
  text: "Lecz Sichon, król Cheszbonu, nie pozwolił nam przejść przez swoją ziemię, gdyż PAN, twój Bóg, zatwardził jego ducha i uczynił jego serce uparte, aby go wydać w twoje ręce, jak to dzisiaj widzisz."
  tags: []
"Pwt2,31":
  text: "Wtedy PAN powiedział do mnie: Oto zacząłem już wydawać ci Sichona i jego ziemię. Zacznij ją zajmować, abyś odziedziczył jego ziemię."
  tags: []
"Pwt2,32":
  text: "Wtedy Sichon wyruszył przeciwko nam, on i cały jego lud, aby zmierzyć się z nami w bitwie w Jahaz;"
  tags: []
"Pwt2,33":
  text: "Lecz PAN, nasz Bóg, wydał go nam i pobiliśmy go, jego synów i cały jego lud."
  tags: []
"Pwt2,34":
  text: "I zdobyliśmy w tym czasie wszystkie jego miasta, i zniszczyliśmy doszczętnie we wszystkich miastach mężczyzn, kobiety i dzieci; nie pozostawiliśmy spośród nich nikogo."
  tags: []
"Pwt2,35":
  text: "Tylko bydło zagarnęliśmy dla siebie i łupy z miast, które zdobyliśmy."
  tags: []
"Pwt2,36":
  text: "Od Aroeru, leżącego nad brzegiem rzeki Arnon, i od miasta położonego w dolinie aż do Gileadu nie było miasta nie do zdobycia; wszystkie wydał nam PAN, nasz Bóg."
  tags: []
"Pwt2,37":
  text: "Tylko do ziemi synów Ammona nie zbliżyłeś się, do żadnego miejsca na brzegu rzeki Jabbok ani do miast w górach, ani do żadnych miejsc, których PAN, nasz Bóg, nam zabronił."
  tags: []
