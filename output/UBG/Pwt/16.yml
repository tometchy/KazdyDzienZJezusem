"Pwt16,1":
  text: "Przestrzegaj miesiąca Abib i obchodź Paschę dla PANA, swego Boga, ponieważ w miesiącu Abib PAN, twój Bóg, wyprowadził cię w nocy z Egiptu."
  tags: []
"Pwt16,2":
  text: "Złożysz PANU, swemu Bogu, ofiarę paschalną z owiec i wołów w miejscu, które PAN wybierze na mieszkanie dla swego imienia."
  tags: []
"Pwt16,3":
  text: "Nie będziesz jadł wraz z nią chleba kwaszonego; przez siedem dni będziesz jadł z nią przaśniki, chleb utrapienia – gdyż w pośpiechu wyszedłeś z ziemi Egiptu – abyś pamiętał dzień swego wyjścia z ziemi Egiptu po wszystkie dni swego życia."
  tags: []
"Pwt16,4":
  text: "Nie zobaczy się u ciebie kwasu we wszystkich twoich granicach przez siedem dni. Z mięsa, które złożyłeś pierwszego dnia wieczorem, nie zostawisz nic przez noc do rana."
  tags: []
"Pwt16,5":
  text: "Nie będziesz mógł składać ofiary paschalnej w żadnej twojej miejscowości, którą daje ci PAN, twój Bóg;"
  tags: []
"Pwt16,6":
  text: "Lecz w miejscu, które PAN, twój Bóg, wybierze na mieszkanie dla swego imienia, tam będziesz składał ofiarę paschalną wieczorem o zachodzie słońca, w porze swego wyjścia z Egiptu."
  tags: []
"Pwt16,7":
  text: "Upieczesz ją i spożyjesz w miejscu, które PAN, twój Bóg, wybierze. Potem rano zawrócisz i pójdziesz do swoich namiotów."
  tags: []
"Pwt16,8":
  text: "Przez sześć dni będziesz jadł przaśniki, a siódmego dnia będzie uroczyste święto dla PANA, twego Boga. Nie będziesz wtedy wykonywał żadnej pracy."
  tags: []
"Pwt16,9":
  text: "Odliczysz sobie siedem tygodni. Zaczniesz liczyć te siedem tygodni od zapuszczenia sierpa w zboże."
  tags: []
"Pwt16,10":
  text: "Potem będziesz obchodził Święto Tygodni dla PANA, swego Boga, z dobrowolną ofiarą twojej ręki, którą dasz stosownie do tego, jak cię błogosławił PAN, twój Bóg."
  tags: []
"Pwt16,11":
  text: "A w miejscu, które PAN, twój Bóg, wybierze na mieszkanie dla swego imienia, będziesz się radował przed PANEM, swoim Bogiem, ty, twój syn i twoja córka, twój sługa i twoja służąca, Lewita, który jest w twoich bramach, przybysz, sierota i wdowa, którzy będą wśród was."
  tags: []
"Pwt16,12":
  text: "I będziesz pamiętał, że byłeś niewolnikiem w Egipcie. Dlatego pilnuj wypełnienia tych nakazów."
  tags: []
"Pwt16,13":
  text: "Będziesz obchodził Święto Namiotów przez siedem dni, gdy zbierzesz plony ze swojego klepiska i tłoczni."
  tags: []
"Pwt16,14":
  text: "I będziesz się radował podczas tego święta, ty, twój syn i twoja córka, twój sługa i twoja służąca, Lewita, który jest w twoich bramach, przybysz, sierota i wdowa, którzy będą w obrębie twoich bram."
  tags: []
"Pwt16,15":
  text: "Przez siedem dni będziesz obchodził uroczyste święto dla PANA, swego Boga, w miejscu, które PAN wybierze, gdyż PAN, twój Bóg, będzie cię błogosławił we wszystkich twoich zbiorach i w każdej pracy twoich rąk; i będziesz pełny radości."
  tags: []
"Pwt16,16":
  text: "Trzy razy w roku wszyscy twoi mężczyźni pokażą się przed PANEM, twoim Bogiem, w miejscu, które on wybierze: na Święto Przaśników, na Święto Tygodni i na Święto Namiotów. A nikt nie pokaże się przed PANEM z pustymi rękami."
  tags: []
"Pwt16,17":
  text: "Każdy przyjdzie z darem ze swojej ręki według błogosławieństwa PANA, twojego Boga, które on ci daje."
  tags: []
"Pwt16,18":
  text: "Ustanowisz sobie sędziów i urzędników we wszystkich swoich miastach, które PAN, twój Bóg, daje ci dla wszystkich waszych pokoleń, aby sądzili lud sprawiedliwym sądem."
  tags: []
"Pwt16,19":
  text: "Nie będziesz naginał sądu, nie będziesz miał względu na osobę i nie będziesz brał daru, gdyż dar zaślepia oczy mądrych i wypacza słowa sprawiedliwych."
  tags: []
"Pwt16,20":
  text: "Podążaj całkowicie za sprawiedliwością, abyś żył i posiadł ziemię, którą daje ci PAN, twój Bóg."
  tags: []
"Pwt16,21":
  text: "Nie posadzisz sobie gaju z żadnego drzewa dokoła ołtarza PANA, swego Boga, jaki sobie zbudujesz."
  tags: []
"Pwt16,22":
  text: "Nie postawisz sobie posągu, gdyż PAN, twój Bóg, nienawidzi tego."
  tags: []
