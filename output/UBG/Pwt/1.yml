"Pwt1,1":
  text: "Oto słowa, które Mojżesz wypowiedział do całego Izraela po tej stronie Jordanu na pustyni, na równinie, naprzeciw Morza Czerwonego, pomiędzy Faran, Tofel, Laban, Chaserot a Dizahab."
  tags: []
"Pwt1,2":
  text: "A jedenaście dni drogi jest od Horebu przez górę Seir do Kadesz-Barnea."
  tags: []
"Pwt1,3":
  text: "W czterdziestym roku, jedenastego miesiąca, pierwszego dnia tego miesiąca, Mojżesz powiedział synom Izraela to wszystko, co PAN mu dla nich rozkazał."
  tags: []
"Pwt1,4":
  text: "Gdy pobił Sichona, króla Amorytów, który mieszkał w Cheszbonie, i Oga, króla Baszanu, który mieszkał w Asztarot w Edrei;"
  tags: []
"Pwt1,5":
  text: "Po tej stronie Jordanu, w ziemi Moabu, Mojżesz zaczął objaśniać to prawo:"
  tags: []
"Pwt1,6":
  text: "PAN, nasz Bóg, przemówił do nas na Horebie: Dość długo przebywacie na tej górze."
  tags: []
"Pwt1,7":
  text: "Zawróćcie i wyruszcie, a idźcie w stronę góry Amorytów oraz do wszystkich miejsc leżących w jej pobliżu, na równinie, w górach i w dolinie, na południu i na wybrzeżu morza, do ziemi Kanaan i do Libanu, aż do wielkiej rzeki, rzeki Eufrat."
  tags: []
"Pwt1,8":
  text: "Oto położyłem przed wami tę ziemię. Wejdźcie do niej i weźcie w posiadanie tę ziemię, którą PAN przysiągł dać waszym ojcom: Abrahamowi, Izaakowi i Jakubowi oraz ich potomstwu po nich."
  tags: []
"Pwt1,9":
  text: "I powiedziałem wam w tamtym czasie: Nie mogę już sam was nosić."
  tags: []
"Pwt1,10":
  text: "PAN, wasz Bóg, rozmnożył was, a oto jesteście dziś tak liczni jak gwiazdy na niebie."
  tags: []
"Pwt1,11":
  text: "Niech PAN, Bóg waszych ojców, rozmnoży was jeszcze tysiąckroć i błogosławi wam, tak jak wam obiecał."
  tags: []
"Pwt1,12":
  text: "Jak mogę sam znosić troskę o was, wasz ciężar i wasze spory?"
  tags: []
"Pwt1,13":
  text: "Wybierzcie spośród siebie mężczyzn mądrych, rozumnych i doświadczonych w waszych pokoleniach, a ja ustanowię ich waszymi przywódcami."
  tags: []
"Pwt1,14":
  text: "Wtedy odpowiedzieliście mi: Dobra to rzecz, którą nakazałeś uczynić."
  tags: []
"Pwt1,15":
  text: "I wybrałem naczelników z waszych pokoleń, mężczyzn mądrych i doświadczonych, i ustanowiłem ich waszymi zwierzchnikami: przełożonymi nad tysiącami, nad setkami, nad pięćdziesięcioma i nad dziesięcioma oraz urzędnikami dla waszych pokoleń."
  tags: []
"Pwt1,16":
  text: "I rozkazałem waszym sędziom w tym czasie: Wysłuchujcie spraw między waszymi braćmi i sądźcie sprawiedliwie pomiędzy każdym mężczyzną a jego bratem czy obcym."
  tags: []
"Pwt1,17":
  text: "Nie miejcie względu na osoby w sądzie; wysłuchujcie zarówno małego, jak i wielkiego. Nie bójcie się nikogo, ponieważ jest to sąd Boga. Jeśli sprawa będzie dla was zbyt trudna, przedstawcie ją mnie i ja jej wysłucham."
  tags: []
"Pwt1,18":
  text: "I przykazałem wam w tamtym czasie wszystko, co macie czynić."
  tags: []
"Pwt1,19":
  text: "Potem wyruszyliśmy z Horebu i przeszliśmy przez całą tę wielką i straszną pustynię, którą widzieliście po drodze do góry Amorytów, jak nakazał nam PAN, nasz Bóg, i przyszliśmy aż do Kadesz-Barnea."
  tags: []
"Pwt1,20":
  text: "I powiedziałem do was: Przyszliście do góry Amorytów, którą daje nam PAN, nasz Bóg."
  tags: []
"Pwt1,21":
  text: "Oto PAN, twój Bóg, położył przed tobą tę ziemię. Idź i weź ją w posiadanie, jak ci powiedział PAN, Bóg twoich ojców; nie bój się i nie lękaj się."
  tags: []
"Pwt1,22":
  text: "I przyszliście do mnie wszyscy, i tak powiedzieliście: Wyślijmy mężczyzn przed sobą, aby wyszpiegowali nam tę ziemię i zdali nam sprawę o drodze, którą mamy iść, i o miastach, do których mamy wejść."
  tags: []
"Pwt1,23":
  text: "To mi się spodobało, więc wybrałem spośród was dwunastu mężczyzn, po jednym z każdego pokolenia."
  tags: []
"Pwt1,24":
  text: "Oni zaś wyruszyli i weszli na górę, potem dotarli do doliny Eszkol i przebadali ziemię."
  tags: []
"Pwt1,25":
  text: "Zabrali też ze sobą owoc tej ziemi i przynieśli do nas, i zdając nam o tym sprawę, powiedzieli: Ziemia, którą daje nam PAN, nasz Bóg, jest dobra."
  tags: []
"Pwt1,26":
  text: "Lecz nie chcieliście iść i buntowaliście się przeciw nakazowi PANA, swojego Boga."
  tags: []
"Pwt1,27":
  text: "I szemraliście w swoich namiotach, mówiąc: Z nienawiści do nas PAN wyprowadził nas z ziemi Egiptu, aby nas wydać w ręce Amorytów na naszą zgubę."
  tags: []
"Pwt1,28":
  text: "Dokąd pójdziemy? Nasi bracia napełnili nasze serca strachem, gdy mówili: Ten lud jest wyższy i roślejszy od nas, miasta są wielkie i obwarowane aż do nieba, a ponadto widzieliśmy tam synów Anakitów."
  tags: []
"Pwt1,29":
  text: "Wtedy mówiłem do was: Nie lękajcie się ani nie bójcie się ich."
  tags: []
"Pwt1,30":
  text: "PAN, wasz Bóg, który idzie przed wami, będzie walczyć za was, tak jak wam uczynił w Egipcie na waszych oczach;"
  tags: []
"Pwt1,31":
  text: "I na pustyni, gdzie widziałeś, jak PAN, twój Bóg, nosił cię tak, jak ojciec nosi swego syna, przez całą drogę, którą szliście, aż przybyliście na to miejsce."
  tags: []
"Pwt1,32":
  text: "Lecz mimo to nie uwierzyliście PANU, swojemu Bogu;"
  tags: []
"Pwt1,33":
  text: "Który szedł przed wami w drodze, wypatrując dla was miejsca do rozbicia obozu, nocą w ogniu, aby wskazać wam drogę, którą macie iść, we dnie zaś w obłoku."
  tags: []
"Pwt1,34":
  text: "A PAN usłyszał głos waszych słów i bardzo się rozgniewał, i przysiągł tymi słowy:"
  tags: []
"Pwt1,35":
  text: "Żaden człowiek z tego złego pokolenia nie zobaczy tej dobrej ziemi, którą przysiągłem dać waszym ojcom;"
  tags: []
"Pwt1,36":
  text: "Oprócz Kaleba, syna Jefunnego; on ją zobaczy i jemu dam ziemię, którą stąpał, a także jego synom, gdyż chodził całkowicie za PANEM."
  tags: []
"Pwt1,37":
  text: "Także na mnie rozgniewał się PAN z waszego powodu, mówiąc: Ty również tam nie wejdziesz."
  tags: []
"Pwt1,38":
  text: "Jozue, syn Nuna, który ci służy, on tam wejdzie. Umacniaj go, gdyż on ją poda w dziedzictwo Izraelowi."
  tags: []
"Pwt1,39":
  text: "Także wasze dzieci, o których mówiliście, że staną się łupem, i wasi synowie, którzy w tym dniu nie odróżniali dobra od zła, oni tam wejdą i im ją oddam, a oni ją wezmą w posiadanie;"
  tags: []
"Pwt1,40":
  text: "A wy zawróćcie i idźcie na pustynię drogą ku Morzu Czerwonemu."
  tags: []
"Pwt1,41":
  text: "Wtedy odpowiedzieliście mi: Zgrzeszyliśmy przeciwko PANU, pójdziemy i będziemy walczyć zgodnie z tym wszystkim, co nakazał nam PAN, nasz Bóg. I każdy z was przypasał sobie broń wojenną i chcieliście wejść na górę."
  tags: []
"Pwt1,42":
  text: "I PAN powiedział do mnie: Powiedz im: Nie wstępujcie ani nie walczcie, gdyż nie ma mnie wśród was, abyście nie byli pobici przez swoich wrogów."
  tags: []
"Pwt1,43":
  text: "Powiedziałem wam o tym, lecz nie słuchaliście, ale zbuntowaliście się przeciw nakazowi PANA i uparliście się, i weszliście na górę."
  tags: []
"Pwt1,44":
  text: "Wtedy Amoryci, którzy mieszkali na tej górze, wystąpili przeciwko wam i ścigali was, jak to czynią pszczoły, i pobili was w Seirze aż do Chorma."
  tags: []
"Pwt1,45":
  text: "Potem wróciliście i płakaliście przed PANEM; lecz PAN nie wysłuchał waszego głosu i nie nakłonił ku wam swego ucha."
  tags: []
"Pwt1,46":
  text: "I mieszkaliście w Kadesz przez wiele dni, według liczby dni, ile tam mieszkaliście."
  tags: []
