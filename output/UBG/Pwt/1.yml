"Pwt1,1": "Oto słowa, które Mojżesz wypowiedział do całego Izraela po tej stronie Jordanu na pustyni, na równinie, naprzeciw Morza Czerwonego, pomiędzy Faran, Tofel, Laban, Chaserot a Dizahab."
"Pwt1,2": "A jedenaście dni drogi jest od Horebu przez górę Seir do Kadesz-Barnea."
"Pwt1,3": "W czterdziestym roku, jedenastego miesiąca, pierwszego dnia tego miesiąca, Mojżesz powiedział synom Izraela to wszystko, co PAN mu dla nich rozkazał."
"Pwt1,4": "Gdy pobił Sichona, króla Amorytów, który mieszkał w Cheszbonie, i Oga, króla Baszanu, który mieszkał w Asztarot w Edrei;"
"Pwt1,5": "Po tej stronie Jordanu, w ziemi Moabu, Mojżesz zaczął objaśniać to prawo:"
"Pwt1,6": "PAN, nasz Bóg, przemówił do nas na Horebie: Dość długo przebywacie na tej górze."
"Pwt1,7": "Zawróćcie i wyruszcie, a idźcie w stronę góry Amorytów oraz do wszystkich miejsc leżących w jej pobliżu, na równinie, w górach i w dolinie, na południu i na wybrzeżu morza, do ziemi Kanaan i do Libanu, aż do wielkiej rzeki, rzeki Eufrat."
"Pwt1,8": "Oto położyłem przed wami tę ziemię. Wejdźcie do niej i weźcie w posiadanie tę ziemię, którą PAN przysiągł dać waszym ojcom: Abrahamowi, Izaakowi i Jakubowi oraz ich potomstwu po nich."
"Pwt1,9": "I powiedziałem wam w tamtym czasie: Nie mogę już sam was nosić."
"Pwt1,10": "PAN, wasz Bóg, rozmnożył was, a oto jesteście dziś tak liczni jak gwiazdy na niebie."
"Pwt1,11": "Niech PAN, Bóg waszych ojców, rozmnoży was jeszcze tysiąckroć i błogosławi wam, tak jak wam obiecał."
"Pwt1,12": "Jak mogę sam znosić troskę o was, wasz ciężar i wasze spory?"
"Pwt1,13": "Wybierzcie spośród siebie mężczyzn mądrych, rozumnych i doświadczonych w waszych pokoleniach, a ja ustanowię ich waszymi przywódcami."
"Pwt1,14": "Wtedy odpowiedzieliście mi: Dobra to rzecz, którą nakazałeś uczynić."
"Pwt1,15": "I wybrałem naczelników z waszych pokoleń, mężczyzn mądrych i doświadczonych, i ustanowiłem ich waszymi zwierzchnikami: przełożonymi nad tysiącami, nad setkami, nad pięćdziesięcioma i nad dziesięcioma oraz urzędnikami dla waszych pokoleń."
"Pwt1,16": "I rozkazałem waszym sędziom w tym czasie: Wysłuchujcie spraw między waszymi braćmi i sądźcie sprawiedliwie pomiędzy każdym mężczyzną a jego bratem czy obcym."
"Pwt1,17": "Nie miejcie względu na osoby w sądzie; wysłuchujcie zarówno małego, jak i wielkiego. Nie bójcie się nikogo, ponieważ jest to sąd Boga. Jeśli sprawa będzie dla was zbyt trudna, przedstawcie ją mnie i ja jej wysłucham."
"Pwt1,18": "I przykazałem wam w tamtym czasie wszystko, co macie czynić."
"Pwt1,19": "Potem wyruszyliśmy z Horebu i przeszliśmy przez całą tę wielką i straszną pustynię, którą widzieliście po drodze do góry Amorytów, jak nakazał nam PAN, nasz Bóg, i przyszliśmy aż do Kadesz-Barnea."
"Pwt1,20": "I powiedziałem do was: Przyszliście do góry Amorytów, którą daje nam PAN, nasz Bóg."
"Pwt1,21": "Oto PAN, twój Bóg, położył przed tobą tę ziemię. Idź i weź ją w posiadanie, jak ci powiedział PAN, Bóg twoich ojców; nie bój się i nie lękaj się."
"Pwt1,22": "I przyszliście do mnie wszyscy, i tak powiedzieliście: Wyślijmy mężczyzn przed sobą, aby wyszpiegowali nam tę ziemię i zdali nam sprawę o drodze, którą mamy iść, i o miastach, do których mamy wejść."
"Pwt1,23": "To mi się spodobało, więc wybrałem spośród was dwunastu mężczyzn, po jednym z każdego pokolenia."
"Pwt1,24": "Oni zaś wyruszyli i weszli na górę, potem dotarli do doliny Eszkol i przebadali ziemię."
"Pwt1,25": "Zabrali też ze sobą owoc tej ziemi i przynieśli do nas, i zdając nam o tym sprawę, powiedzieli: Ziemia, którą daje nam PAN, nasz Bóg, jest dobra."
"Pwt1,26": "Lecz nie chcieliście iść i buntowaliście się przeciw nakazowi PANA, swojego Boga."
"Pwt1,27": "I szemraliście w swoich namiotach, mówiąc: Z nienawiści do nas PAN wyprowadził nas z ziemi Egiptu, aby nas wydać w ręce Amorytów na naszą zgubę."
"Pwt1,28": "Dokąd pójdziemy? Nasi bracia napełnili nasze serca strachem, gdy mówili: Ten lud jest wyższy i roślejszy od nas, miasta są wielkie i obwarowane aż do nieba, a ponadto widzieliśmy tam synów Anakitów."
"Pwt1,29": "Wtedy mówiłem do was: Nie lękajcie się ani nie bójcie się ich."
"Pwt1,30": "PAN, wasz Bóg, który idzie przed wami, będzie walczyć za was, tak jak wam uczynił w Egipcie na waszych oczach;"
"Pwt1,31": "I na pustyni, gdzie widziałeś, jak PAN, twój Bóg, nosił cię tak, jak ojciec nosi swego syna, przez całą drogę, którą szliście, aż przybyliście na to miejsce."
"Pwt1,32": "Lecz mimo to nie uwierzyliście PANU, swojemu Bogu;"
"Pwt1,33": "Który szedł przed wami w drodze, wypatrując dla was miejsca do rozbicia obozu, nocą w ogniu, aby wskazać wam drogę, którą macie iść, we dnie zaś w obłoku."
"Pwt1,34": "A PAN usłyszał głos waszych słów i bardzo się rozgniewał, i przysiągł tymi słowy:"
"Pwt1,35": "Żaden człowiek z tego złego pokolenia nie zobaczy tej dobrej ziemi, którą przysiągłem dać waszym ojcom;"
"Pwt1,36": "Oprócz Kaleba, syna Jefunnego; on ją zobaczy i jemu dam ziemię, którą stąpał, a także jego synom, gdyż chodził całkowicie za PANEM."
"Pwt1,37": "Także na mnie rozgniewał się PAN z waszego powodu, mówiąc: Ty również tam nie wejdziesz."
"Pwt1,38": "Jozue, syn Nuna, który ci służy, on tam wejdzie. Umacniaj go, gdyż on ją poda w dziedzictwo Izraelowi."
"Pwt1,39": "Także wasze dzieci, o których mówiliście, że staną się łupem, i wasi synowie, którzy w tym dniu nie odróżniali dobra od zła, oni tam wejdą i im ją oddam, a oni ją wezmą w posiadanie;"
"Pwt1,40": "A wy zawróćcie i idźcie na pustynię drogą ku Morzu Czerwonemu."
"Pwt1,41": "Wtedy odpowiedzieliście mi: Zgrzeszyliśmy przeciwko PANU, pójdziemy i będziemy walczyć zgodnie z tym wszystkim, co nakazał nam PAN, nasz Bóg. I każdy z was przypasał sobie broń wojenną i chcieliście wejść na górę."
"Pwt1,42": "I PAN powiedział do mnie: Powiedz im: Nie wstępujcie ani nie walczcie, gdyż nie ma mnie wśród was, abyście nie byli pobici przez swoich wrogów."
"Pwt1,43": "Powiedziałem wam o tym, lecz nie słuchaliście, ale zbuntowaliście się przeciw nakazowi PANA i uparliście się, i weszliście na górę."
"Pwt1,44": "Wtedy Amoryci, którzy mieszkali na tej górze, wystąpili przeciwko wam i ścigali was, jak to czynią pszczoły, i pobili was w Seirze aż do Chorma."
"Pwt1,45": "Potem wróciliście i płakaliście przed PANEM; lecz PAN nie wysłuchał waszego głosu i nie nakłonił ku wam swego ucha."
"Pwt1,46": "I mieszkaliście w Kadesz przez wiele dni, według liczby dni, ile tam mieszkaliście."
