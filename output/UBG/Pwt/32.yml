"Pwt32,1":
  text: "Słuchajcie, niebiosa, a będę mówić; niech i ziemia słucha słów moich ust."
  tags: []
"Pwt32,2":
  text: "Moja nauka będzie kropić jak deszcz, moja mowa będzie ściekać jak rosa, jak drobny deszcz na zioła, jak krople na trawę."
  tags: []
"Pwt32,3":
  text: "Będę bowiem głosił imię PANA. Uznajcie wielkość naszego Boga."
  tags: []
"Pwt32,4":
  text: "On jest Skałą, a jego dzieło jest doskonałe, bo wszystkie jego drogi są sprawiedliwe. Jest Bogiem prawdziwym i bez nieprawości, sprawiedliwym i prawym."
  tags: []
"Pwt32,5":
  text: "Zepsuli się, ich skaza nie jest skazą jego dzieci; pokolenie złe i przewrotne."
  tags: []
"Pwt32,6":
  text: "Tak to odpłacasz PANU, ludu głupi i niemądry? Czy nie jest on twoim ojcem, który cię nabył dla siebie? Czy nie on cię uczynił i utwierdził?"
  tags: []
"Pwt32,7":
  text: "Wspomnij dni dawne, rozważ lata wielu pokoleń. Zapytaj swego ojca, a oznajmi ci; swoich starszych, a powiedzą ci."
  tags: []
"Pwt32,8":
  text: "Gdy Najwyższy rozdzielał dziedzictwa narodom, a oddzielał synów Adama, wyznaczył granice narodom według liczby synów Izraela."
  tags: []
"Pwt32,9":
  text: "Działem PANA jest bowiem jego lud, Jakub jest jego wydzielonym dziedzictwem."
  tags: []
"Pwt32,10":
  text: "Znalazł go na pustynnej ziemi i na wielkim, strasznym pustkowiu. Obwodził go, uczył, strzegł jak źrenicy swego oka."
  tags: []
"Pwt32,11":
  text: "Jak orzeł pobudza swoje młode, trzepocze skrzydłami nad swymi orlętami, rozpościera swoje skrzydła, bierze je i nosi je na skrzydłach;"
  tags: []
"Pwt32,12":
  text: "Tak PAN sam prowadził go i nie było z nim żadnego obcego boga."
  tags: []
"Pwt32,13":
  text: "Wzniósł go po wysokich miejscach ziemi, aby żywił się plonami pól, i pozwolił mu ssać miód ze skały i oliwę ze skalnego krzemienia;"
  tags: []
"Pwt32,14":
  text: "Masło od krów i mleko od owiec wraz z tłuszczem jagniąt, barany odchowane w Baszanie, kozły razem z tłuszczem ziaren pszenicy, a piłeś z wybornej krwi winogron."
  tags: []
"Pwt32,15":
  text: "Lecz Jeszurun utył i wierzgał – otyłeś, obrosłeś w tłuszcz, zgrubiałeś; opuściłeś Boga, który cię uczynił, i lekceważyłeś Skałę swego zbawienia."
  tags: []
"Pwt32,16":
  text: "Pobudzili go do zazdrości obcymi bogami, rozdrażnili go obrzydliwościami."
  tags: []
"Pwt32,17":
  text: "Składali ofiary demonom, a nie Bogu; nowym bogom, których nie znali, świeżo przybyłym, których się nie bali wasi ojcowie."
  tags: []
"Pwt32,18":
  text: "O Skale, która cię spłodziła, zapomniałeś, i zapomniałeś Boga, swego Stwórcę."
  tags: []
"Pwt32,19":
  text: "Gdy PAN to zobaczył, wzgardził nimi z powodu rozdrażnienia swoich synów i córek."
  tags: []
"Pwt32,20":
  text: "I powiedział: Zakryję przed nimi swoje oblicze, zobaczę, jaki będzie ich koniec. Są bowiem pokoleniem przewrotnym, synami, w których nie ma wiary."
  tags: []
"Pwt32,21":
  text: "Oni mnie pobudzili do zazdrości tym, co nie jest Bogiem; rozdrażnili mnie swymi marnościami. Ja też pobudzę ich do zazdrości tymi, którzy nie są ludem, rozdrażnię ich przez głupi naród."
  tags: []
"Pwt32,22":
  text: "Zapłonął bowiem ogień mojego gniewu i spłonie aż do głębin piekła, i pożre ziemię i jej plony, i wypali posady gór."
  tags: []
"Pwt32,23":
  text: "Zgromadzę na nich nieszczęścia, zużyję na nich moje strzały."
  tags: []
"Pwt32,24":
  text: "Będą wyczerpani z głodu i strawieni gorączką i gorzką zarazą. Wyślę na nich też zęby bestii, z jadem gadów ziemskich."
  tags: []
"Pwt32,25":
  text: "Na zewnątrz osieroci ich miecz, a w domach – strach, tak młodzieńca, jak i dziewicę, niemowlę i sędziwego."
  tags: []
"Pwt32,26":
  text: "Powiedziałem: Rozproszę ich po kątach, wymażę pamięć o nich wśród ludzi;"
  tags: []
"Pwt32,27":
  text: "Gdybym się nie obawiał pychy wroga, by ich wrogowie nie powstali i nie powiedzieli: Nasza wielka ręka, a nie PAN, uczyniła to wszystko."
  tags: []
"Pwt32,28":
  text: "Ten naród bowiem jest pozbawiony rady i nie ma rozumu."
  tags: []
"Pwt32,29":
  text: "Oby byli mądrzy, zrozumieliby to i zważaliby na swój koniec."
  tags: []
"Pwt32,30":
  text: "Jakże mógłby jeden gonić tysiąc i dwóch zmusić do ucieczki dziesięć tysięcy, gdyby ich Skała nie zaprzedała ich i PAN ich nie wydał?"
  tags: []
"Pwt32,31":
  text: "Bo ich skała nie jest jak nasza Skała, nasi wrogowie sami są sędziami."
  tags: []
"Pwt32,32":
  text: "Ich winorośl bowiem pochodzi z winorośli Sodomy i z pól Gomory, ich grona to grona trujące, ich kiście są gorzkie."
  tags: []
"Pwt32,33":
  text: "Ich wino jest jadem smoków, okrutną trucizną żmij."
  tags: []
"Pwt32,34":
  text: "Czy to nie jest u mnie ukryte, zapieczętowane w moich skarbcach?"
  tags: []
"Pwt32,35":
  text: "Do mnie należy zemsta i odpłata; ich noga poślizgnie się w wyznaczonym czasie. Bliski bowiem jest dzień ich klęski, a ich przyszłość spieszy się do nich."
  tags: []
"Pwt32,36":
  text: "PAN bowiem będzie sądzić swój lud, zlituje się nad swymi sługami, gdy zobaczy, że ich siła ustała i że nie ma ani niewolnika, ani wolnego."
  tags: []
"Pwt32,37":
  text: "I powie: Gdzie są ich bogowie? Ta skała, w której pokładali ufność?"
  tags: []
"Pwt32,38":
  text: "Ci, co jadali tłuszcz ich ofiar i pili wino ich ofiar z płynów? Niech wstaną i wam pomogą, niech będą waszym schronieniem."
  tags: []
"Pwt32,39":
  text: "Spójrzcie teraz, że to ja, tylko ja jestem, a nie ma innych bogów oprócz mnie. Ja zabijam i ożywiam, ja ranię i ja leczę, i nikt nie wyrwie z mojej ręki."
  tags: []
"Pwt32,40":
  text: "Podnoszę bowiem swą rękę ku niebu i mówię: Ja żyję na wieki."
  tags: []
"Pwt32,41":
  text: "Jeśli zaostrzę swój błyszczący miecz i moja ręka chwyci sąd, dokonam zemsty na swoich wrogach i odpłacę tym, którzy mnie nienawidzą."
  tags: []
"Pwt32,42":
  text: "Krwią upoję moje strzały, mój miecz naje się mięsa, krwią zabitych i pojmanych, jak tylko zacznę mścić się nad wrogami."
  tags: []
"Pwt32,43":
  text: "Weselcie się, narody, z jego ludem, gdyż on pomści krew swoich sług i odpłaci zemstą swoim wrogom, a będzie łaskawy dla swej ziemi i swego ludu."
  tags: []
"Pwt32,44":
  text: "Przyszedł więc Mojżesz i powiedział wszystkie słowa tej pieśni do uszu tego ludu, on i Ozeasz, syn Nuna."
  tags: []
"Pwt32,45":
  text: "A gdy Mojżesz skończył mówić wszystkie te słowa do całego Izraela;"
  tags: []
"Pwt32,46":
  text: "Powiedział do nich: Weźcie sobie do serca wszystkie te słowa, które wam dzisiaj oświadczam, byście przykazywali je waszym dzieciom, by pilnowały wypełnienia wszystkich słów tego prawa;"
  tags: []
"Pwt32,47":
  text: "Nie jest to bowiem dla was słowem pustym, gdyż jest waszym życiem. I dzięki niemu przedłużycie swoje dni na ziemi, do której się przeprawiacie przez Jordan, aby ją posiąść."
  tags: []
"Pwt32,48":
  text: "I tego samego dnia PAN powiedział do Mojżesza:"
  tags: []
"Pwt32,49":
  text: "Wstąp na tę górę Abarim, na górę Nebo, która jest w ziemi Moabu naprzeciw Jerycha, i spójrz na ziemię Kanaan, którą daję synom Izraela w posiadanie."
  tags: []
"Pwt32,50":
  text: "I umrzesz na tej górze, na którą wstąpisz, i zostaniesz przyłączony do swego ludu, tak jak umarł twój brat Aaron na górze Hor i został przyłączony do swego ludu;"
  tags: []
"Pwt32,51":
  text: "Za to, że wystąpiliście przeciwko mnie pośród synów Izraela przy wodach Meriba w Kadesz, na pustyni Syn, i nie poświęciliście mnie pośród synów Izraela."
  tags: []
"Pwt32,52":
  text: "Przed sobą zobaczysz ziemię, lecz nie wejdziesz do tej ziemi, którą daję synom Izraela."
  tags: []
