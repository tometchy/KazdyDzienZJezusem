"Pwt32,1": "Słuchajcie, niebiosa, a będę mówić; niech i ziemia słucha słów moich ust."
"Pwt32,2": "Moja nauka będzie kropić jak deszcz, moja mowa będzie ściekać jak rosa, jak drobny deszcz na zioła, jak krople na trawę."
"Pwt32,3": "Będę bowiem głosił imię PANA. Uznajcie wielkość naszego Boga."
"Pwt32,4": "On jest Skałą, a jego dzieło jest doskonałe, bo wszystkie jego drogi są sprawiedliwe. Jest Bogiem prawdziwym i bez nieprawości, sprawiedliwym i prawym."
"Pwt32,5": "Zepsuli się, ich skaza nie jest skazą jego dzieci; pokolenie złe i przewrotne."
"Pwt32,6": "Tak to odpłacasz PANU, ludu głupi i niemądry? Czy nie jest on twoim ojcem, który cię nabył dla siebie? Czy nie on cię uczynił i utwierdził?"
"Pwt32,7": "Wspomnij dni dawne, rozważ lata wielu pokoleń. Zapytaj swego ojca, a oznajmi ci; swoich starszych, a powiedzą ci."
"Pwt32,8": "Gdy Najwyższy rozdzielał dziedzictwa narodom, a oddzielał synów Adama, wyznaczył granice narodom według liczby synów Izraela."
"Pwt32,9": "Działem PANA jest bowiem jego lud, Jakub jest jego wydzielonym dziedzictwem."
"Pwt32,10": "Znalazł go na pustynnej ziemi i na wielkim, strasznym pustkowiu. Obwodził go, uczył, strzegł jak źrenicy swego oka."
"Pwt32,11": "Jak orzeł pobudza swoje młode, trzepocze skrzydłami nad swymi orlętami, rozpościera swoje skrzydła, bierze je i nosi je na skrzydłach;"
"Pwt32,12": "Tak PAN sam prowadził go i nie było z nim żadnego obcego boga."
"Pwt32,13": "Wzniósł go po wysokich miejscach ziemi, aby żywił się plonami pól, i pozwolił mu ssać miód ze skały i oliwę ze skalnego krzemienia;"
"Pwt32,14": "Masło od krów i mleko od owiec wraz z tłuszczem jagniąt, barany odchowane w Baszanie, kozły razem z tłuszczem ziaren pszenicy, a piłeś z wybornej krwi winogron."
"Pwt32,15": "Lecz Jeszurun utył i wierzgał – otyłeś, obrosłeś w tłuszcz, zgrubiałeś; opuściłeś Boga, który cię uczynił, i lekceważyłeś Skałę swego zbawienia."
"Pwt32,16": "Pobudzili go do zazdrości obcymi bogami, rozdrażnili go obrzydliwościami."
"Pwt32,17": "Składali ofiary demonom, a nie Bogu; nowym bogom, których nie znali, świeżo przybyłym, których się nie bali wasi ojcowie."
"Pwt32,18": "O Skale, która cię spłodziła, zapomniałeś, i zapomniałeś Boga, swego Stwórcę."
"Pwt32,19": "Gdy PAN to zobaczył, wzgardził nimi z powodu rozdrażnienia swoich synów i córek."
"Pwt32,20": "I powiedział: Zakryję przed nimi swoje oblicze, zobaczę, jaki będzie ich koniec. Są bowiem pokoleniem przewrotnym, synami, w których nie ma wiary."
"Pwt32,21": "Oni mnie pobudzili do zazdrości tym, co nie jest Bogiem; rozdrażnili mnie swymi marnościami. Ja też pobudzę ich do zazdrości tymi, którzy nie są ludem, rozdrażnię ich przez głupi naród."
"Pwt32,22": "Zapłonął bowiem ogień mojego gniewu i spłonie aż do głębin piekła, i pożre ziemię i jej plony, i wypali posady gór."
"Pwt32,23": "Zgromadzę na nich nieszczęścia, zużyję na nich moje strzały."
"Pwt32,24": "Będą wyczerpani z głodu i strawieni gorączką i gorzką zarazą. Wyślę na nich też zęby bestii, z jadem gadów ziemskich."
"Pwt32,25": "Na zewnątrz osieroci ich miecz, a w domach – strach, tak młodzieńca, jak i dziewicę, niemowlę i sędziwego."
"Pwt32,26": "Powiedziałem: Rozproszę ich po kątach, wymażę pamięć o nich wśród ludzi;"
"Pwt32,27": "Gdybym się nie obawiał pychy wroga, by ich wrogowie nie powstali i nie powiedzieli: Nasza wielka ręka, a nie PAN, uczyniła to wszystko."
"Pwt32,28": "Ten naród bowiem jest pozbawiony rady i nie ma rozumu."
"Pwt32,29": "Oby byli mądrzy, zrozumieliby to i zważaliby na swój koniec."
"Pwt32,30": "Jakże mógłby jeden gonić tysiąc i dwóch zmusić do ucieczki dziesięć tysięcy, gdyby ich Skała nie zaprzedała ich i PAN ich nie wydał?"
"Pwt32,31": "Bo ich skała nie jest jak nasza Skała, nasi wrogowie sami są sędziami."
"Pwt32,32": "Ich winorośl bowiem pochodzi z winorośli Sodomy i z pól Gomory, ich grona to grona trujące, ich kiście są gorzkie."
"Pwt32,33": "Ich wino jest jadem smoków, okrutną trucizną żmij."
"Pwt32,34": "Czy to nie jest u mnie ukryte, zapieczętowane w moich skarbcach?"
"Pwt32,35": "Do mnie należy zemsta i odpłata; ich noga poślizgnie się w wyznaczonym czasie. Bliski bowiem jest dzień ich klęski, a ich przyszłość spieszy się do nich."
"Pwt32,36": "PAN bowiem będzie sądzić swój lud, zlituje się nad swymi sługami, gdy zobaczy, że ich siła ustała i że nie ma ani niewolnika, ani wolnego."
"Pwt32,37": "I powie: Gdzie są ich bogowie? Ta skała, w której pokładali ufność?"
"Pwt32,38": "Ci, co jadali tłuszcz ich ofiar i pili wino ich ofiar z płynów? Niech wstaną i wam pomogą, niech będą waszym schronieniem."
"Pwt32,39": "Spójrzcie teraz, że to ja, tylko ja jestem, a nie ma innych bogów oprócz mnie. Ja zabijam i ożywiam, ja ranię i ja leczę, i nikt nie wyrwie z mojej ręki."
"Pwt32,40": "Podnoszę bowiem swą rękę ku niebu i mówię: Ja żyję na wieki."
"Pwt32,41": "Jeśli zaostrzę swój błyszczący miecz i moja ręka chwyci sąd, dokonam zemsty na swoich wrogach i odpłacę tym, którzy mnie nienawidzą."
"Pwt32,42": "Krwią upoję moje strzały, mój miecz naje się mięsa, krwią zabitych i pojmanych, jak tylko zacznę mścić się nad wrogami."
"Pwt32,43": "Weselcie się, narody, z jego ludem, gdyż on pomści krew swoich sług i odpłaci zemstą swoim wrogom, a będzie łaskawy dla swej ziemi i swego ludu."
"Pwt32,44": "Przyszedł więc Mojżesz i powiedział wszystkie słowa tej pieśni do uszu tego ludu, on i Ozeasz, syn Nuna."
"Pwt32,45": "A gdy Mojżesz skończył mówić wszystkie te słowa do całego Izraela;"
"Pwt32,46": "Powiedział do nich: Weźcie sobie do serca wszystkie te słowa, które wam dzisiaj oświadczam, byście przykazywali je waszym dzieciom, by pilnowały wypełnienia wszystkich słów tego prawa;"
"Pwt32,47": "Nie jest to bowiem dla was słowem pustym, gdyż jest waszym życiem. I dzięki niemu przedłużycie swoje dni na ziemi, do której się przeprawiacie przez Jordan, aby ją posiąść."
"Pwt32,48": "I tego samego dnia PAN powiedział do Mojżesza:"
"Pwt32,49": "Wstąp na tę górę Abarim, na górę Nebo, która jest w ziemi Moabu naprzeciw Jerycha, i spójrz na ziemię Kanaan, którą daję synom Izraela w posiadanie."
"Pwt32,50": "I umrzesz na tej górze, na którą wstąpisz, i zostaniesz przyłączony do swego ludu, tak jak umarł twój brat Aaron na górze Hor i został przyłączony do swego ludu;"
"Pwt32,51": "Za to, że wystąpiliście przeciwko mnie pośród synów Izraela przy wodach Meriba w Kadesz, na pustyni Syn, i nie poświęciliście mnie pośród synów Izraela."
"Pwt32,52": "Przed sobą zobaczysz ziemię, lecz nie wejdziesz do tej ziemi, którą daję synom Izraela."
