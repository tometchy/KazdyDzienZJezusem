"Pwt27,1":
  text: "Wtedy Mojżesz i starsi Izraela nakazali ludowi: Przestrzegajcie wszystkich przykazań, które wam dziś nakazuję."
  tags: []
"Pwt27,2":
  text: "A w dniu, w którym przeprawicie się przez Jordan do ziemi, którą daje ci PAN, twój Bóg, ustawisz sobie wielkie kamienie i pobielisz je wapnem."
  tags: []
"Pwt27,3":
  text: "I wypiszesz na nich wszystkie słowa tego prawa, gdy tylko przeprawisz się, abyś wszedł do ziemi, którą daje ci PAN, twój Bóg, do ziemi mlekiem i miodem płynącej, jak ci obiecał PAN, Bóg twoich ojców."
  tags: []
"Pwt27,4":
  text: "Gdy więc przeprawicie się przez Jordan, ustawicie te kamienie, o których wam dziś nakazuję, na górze Ebal, i pobielisz je wapnem."
  tags: []
"Pwt27,5":
  text: "Tam też zbudujesz ołtarz PANU, swemu Bogu, ołtarz z kamieni. Nie będziesz ich ciosał narzędziem z żelaza."
  tags: []
"Pwt27,6":
  text: "Z kamieni nieciosanych zbudujesz ołtarz PANU, swemu Bogu, i na nim będziesz składał całopalenia PANU, swemu Bogu."
  tags: []
"Pwt27,7":
  text: "Złożysz też ofiary pojednawcze i będziesz tam jadł, i radował się przed PANEM, swoim Bogiem;"
  tags: []
"Pwt27,8":
  text: "I na tych kamieniach bardzo wyraźnie wypiszesz wszystkie słowa tego prawa."
  tags: []
"Pwt27,9":
  text: "Potem Mojżesz i kapłani Lewici powiedzieli do całego Izraela: Milcz i słuchaj, Izraelu. Dziś stałeś się ludem PANA, swego Boga."
  tags: []
"Pwt27,10":
  text: "Będziesz więc słuchał głosu PANA, swego Boga, i będziesz wypełniał jego przykazania i ustawy, które dziś ci nakazuję."
  tags: []
"Pwt27,11":
  text: "W tym samym dniu Mojżesz nakazał ludowi:"
  tags: []
"Pwt27,12":
  text: "Oto ci, którzy staną, by błogosławić lud na górze Gerizim, gdy przeprawicie się przez Jordan: Symeon, Lewi, Juda, Issachar, Józef i Beniamin."
  tags: []
"Pwt27,13":
  text: "Oto zaś ci staną na górze Ebal, by przeklinać: Ruben, Gad, Aszer, Zebulon, Dan i Neftali."
  tags: []
"Pwt27,14":
  text: "I odezwą się Lewici, i przemówią donośnym głosem do wszystkich mężczyzn Izraela:"
  tags: []
"Pwt27,15":
  text: "Przeklęty człowiek, który wykona wyrzeźbiony lub odlewany posąg – obrzydliwość dla PANA, dzieło rąk rzemieślnika, i postawi w ukrytym miejscu. A cały lud odpowie: Amen."
  tags: []
"Pwt27,16":
  text: "Przeklęty, kto lekceważy swego ojca i swoją matkę. A cały lud powie: Amen."
  tags: []
"Pwt27,17":
  text: "Przeklęty, kto przesuwa granicę swego bliźniego. A cały lud powie: Amen."
  tags: []
"Pwt27,18":
  text: "Przeklęty, kto sprowadza ślepego z drogi, aby błądził. A cały lud powie: Amen."
  tags: []
"Pwt27,19":
  text: "Przeklęty, kto nagina sądu przybysza, sieroty i wdowy. A cały lud powie: Amen."
  tags: []
"Pwt27,20":
  text: "Przeklęty, kto obcuje z żoną swego ojca, bo odkrywa brzeg płaszcza swego ojca. A cały lud powie: Amen."
  tags: []
"Pwt27,21":
  text: "Przeklęty, kto obcuje z jakimkolwiek zwierzęciem. A cały lud powie: Amen."
  tags: []
"Pwt27,22":
  text: "Przeklęty, kto obcuje ze swoją siostrą, córką swego ojca lub córką swojej matki. A cały lud powie: Amen."
  tags: []
"Pwt27,23":
  text: "Przeklęty, kto obcuje ze swoją teściową. A cały lud powie: Amen."
  tags: []
"Pwt27,24":
  text: "Przeklęty, kto zabija potajemnie swego bliźniego. A cały lud powie: Amen."
  tags: []
"Pwt27,25":
  text: "Przeklęty, kto przyjmuje dary, by zabić niewinnego człowieka. A cały lud powie: Amen."
  tags: []
"Pwt27,26":
  text: "Przeklęty, kto nie trwa w wypełnianiu słów tego prawa. A cały lud powie: Amen."
  tags: []
