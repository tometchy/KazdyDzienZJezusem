"Pwt30,1":
  text: "A gdy spadnie na ciebie to wszystko, błogosławieństwo i przekleństwo, które przedłożyłem przed tobą, a wspomnisz je sobie w swym sercu pośród wszystkich narodów, do których PAN, twój Bóg, cię wypędzi;"
  tags: []
"Pwt30,2":
  text: "I zawrócisz do PANA, swego Boga, i będziesz słuchał jego głosu we wszystkim, co ci dziś nakazuję, ty i twoi synowie, z całego swego serca i całą swoją duszą;"
  tags: []
"Pwt30,3":
  text: "Wtedy PAN, twój Bóg, wyprowadzi cię z twego więzienia i zlituje się nad tobą, i przywróci, i zgromadzi cię ze wszystkich narodów, wśród których PAN, twój Bóg, cię rozproszył."
  tags: []
"Pwt30,4":
  text: "Choćby twoi wygnani byli na krańcu nieba, stamtąd zgromadzi cię PAN, twój Bóg, i stamtąd cię zabierze;"
  tags: []
"Pwt30,5":
  text: "I PAN, twój Bóg, przyprowadzi cię do ziemi, którą odziedziczyli twoi ojcowie, i posiądziesz ją, i będzie ci wyświadczać dobro oraz rozmnoży cię bardziej niż twoich przodków."
  tags: []
"Pwt30,6":
  text: "PAN, twój Bóg, obrzeza twoje serce i serce twego potomstwa, abyś miłował PANA, swego Boga, z całego swego serca i całą swoją duszą, abyś żył."
  tags: []
"Pwt30,7":
  text: "I włoży PAN, twój Bóg, wszystkie te przekleństwa na twoich wrogów i na tych, którzy cię nienawidzą i którzy cię prześladowali."
  tags: []
"Pwt30,8":
  text: "A ty zawrócisz i będziesz słuchał głosu PANA i wypełniał wszystkie jego przykazania, które ci dziś nakazuję."
  tags: []
"Pwt30,9":
  text: "I PAN, twój Bóg, poszczęści tobie w każdej sprawie twych rąk, w owocu twego łona, w owocu twego bydła i w owocu twej ziemi, ku dobremu. PAN bowiem znowu będzie się cieszył tobą, czyniąc ci dobro, jak się cieszył twoimi ojcami;"
  tags: []
"Pwt30,10":
  text: "Jeśli będziesz słuchał głosu PANA, swego Boga, by przestrzegać jego przykazań i ustaw zapisanych w księdze tego Prawa, i jeśli zawrócisz do PANA, swego Boga, z całego swego serca i całą swoją duszą."
  tags: []
"Pwt30,11":
  text: "To przykazanie bowiem, które ci dziś nakazuję, nie jest zakryte przed tobą ani nie jest zbyt dalekie;"
  tags: []
"Pwt30,12":
  text: "Nie jest w niebie, byś miał mówić: Któż dla nas wstąpi do nieba i przyniesie je nam, i opowie je nam, abyśmy je wypełniali?"
  tags: []
"Pwt30,13":
  text: "Nie jest też ono za morzem, byś miał mówić: Któż dla nas popłynie za morze i przyniesie je nam, i opowie je nam, abyśmy je wypełniali."
  tags: []
"Pwt30,14":
  text: "Lecz to słowo jest bardzo blisko ciebie, w twoich ustach i w twoim sercu, abyś je wypełniał."
  tags: []
"Pwt30,15":
  text: "Oto dziś położyłem przed tobą życie i dobro oraz śmierć i zło;"
  tags: []
"Pwt30,16":
  text: "Gdyż dziś ci nakazuję, abyś miłował PANA, swego Boga, i chodził jego drogami, i przestrzegał jego przykazań, ustaw i praw, abyś żył i rozmnożył się, i PAN, twój Bóg, będzie ci błogosławił w ziemi, do której idziesz, aby ją posiąść."
  tags: []
"Pwt30,17":
  text: "Jeśli zaś twoje serce odwróci się i nie posłuchasz, ale dasz się odwieść, będziesz oddawał pokłon innym bogom i im służył;"
  tags: []
"Pwt30,18":
  text: "Oznajmiam wam dziś, że na pewno zginiecie i nie przedłużycie swych dni na ziemi, do której się przeprawiasz przez Jordan, aby tam wejść i posiąść ją."
  tags: []
"Pwt30,19":
  text: "Biorę dziś na świadków przeciwko wam niebo i ziemię, że położyłem przed tobą życie i śmierć, błogosławieństwo i przekleństwo. Wybierz więc życie, abyś żył, ty i twoje potomstwo;"
  tags: []
"Pwt30,20":
  text: "I miłował PANA, swego Boga, słuchał jego głosu i do niego lgnął. On bowiem jest twoim życiem i przedłużeniem twoich dni, abyś mieszkał w ziemi, którą PAN poprzysiągł dać twoim ojcom: Abrahamowi, Izaakowi i Jakubowi."
  tags: []
