"Pwt30,1": "A gdy spadnie na ciebie to wszystko, błogosławieństwo i przekleństwo, które przedłożyłem przed tobą, a wspomnisz je sobie w swym sercu pośród wszystkich narodów, do których PAN, twój Bóg, cię wypędzi;"
"Pwt30,2": "I zawrócisz do PANA, swego Boga, i będziesz słuchał jego głosu we wszystkim, co ci dziś nakazuję, ty i twoi synowie, z całego swego serca i całą swoją duszą;"
"Pwt30,3": "Wtedy PAN, twój Bóg, wyprowadzi cię z twego więzienia i zlituje się nad tobą, i przywróci, i zgromadzi cię ze wszystkich narodów, wśród których PAN, twój Bóg, cię rozproszył."
"Pwt30,4": "Choćby twoi wygnani byli na krańcu nieba, stamtąd zgromadzi cię PAN, twój Bóg, i stamtąd cię zabierze;"
"Pwt30,5": "I PAN, twój Bóg, przyprowadzi cię do ziemi, którą odziedziczyli twoi ojcowie, i posiądziesz ją, i będzie ci wyświadczać dobro oraz rozmnoży cię bardziej niż twoich przodków."
"Pwt30,6": "PAN, twój Bóg, obrzeza twoje serce i serce twego potomstwa, abyś miłował PANA, swego Boga, z całego swego serca i całą swoją duszą, abyś żył."
"Pwt30,7": "I włoży PAN, twój Bóg, wszystkie te przekleństwa na twoich wrogów i na tych, którzy cię nienawidzą i którzy cię prześladowali."
"Pwt30,8": "A ty zawrócisz i będziesz słuchał głosu PANA i wypełniał wszystkie jego przykazania, które ci dziś nakazuję."
"Pwt30,9": "I PAN, twój Bóg, poszczęści tobie w każdej sprawie twych rąk, w owocu twego łona, w owocu twego bydła i w owocu twej ziemi, ku dobremu. PAN bowiem znowu będzie się cieszył tobą, czyniąc ci dobro, jak się cieszył twoimi ojcami;"
"Pwt30,10": "Jeśli będziesz słuchał głosu PANA, swego Boga, by przestrzegać jego przykazań i ustaw zapisanych w księdze tego Prawa, i jeśli zawrócisz do PANA, swego Boga, z całego swego serca i całą swoją duszą."
"Pwt30,11": "To przykazanie bowiem, które ci dziś nakazuję, nie jest zakryte przed tobą ani nie jest zbyt dalekie;"
"Pwt30,12": "Nie jest w niebie, byś miał mówić: Któż dla nas wstąpi do nieba i przyniesie je nam, i opowie je nam, abyśmy je wypełniali?"
"Pwt30,13": "Nie jest też ono za morzem, byś miał mówić: Któż dla nas popłynie za morze i przyniesie je nam, i opowie je nam, abyśmy je wypełniali."
"Pwt30,14": "Lecz to słowo jest bardzo blisko ciebie, w twoich ustach i w twoim sercu, abyś je wypełniał."
"Pwt30,15": "Oto dziś położyłem przed tobą życie i dobro oraz śmierć i zło;"
"Pwt30,16": "Gdyż dziś ci nakazuję, abyś miłował PANA, swego Boga, i chodził jego drogami, i przestrzegał jego przykazań, ustaw i praw, abyś żył i rozmnożył się, i PAN, twój Bóg, będzie ci błogosławił w ziemi, do której idziesz, aby ją posiąść."
"Pwt30,17": "Jeśli zaś twoje serce odwróci się i nie posłuchasz, ale dasz się odwieść, będziesz oddawał pokłon innym bogom i im służył;"
"Pwt30,18": "Oznajmiam wam dziś, że na pewno zginiecie i nie przedłużycie swych dni na ziemi, do której się przeprawiasz przez Jordan, aby tam wejść i posiąść ją."
"Pwt30,19": "Biorę dziś na świadków przeciwko wam niebo i ziemię, że położyłem przed tobą życie i śmierć, błogosławieństwo i przekleństwo. Wybierz więc życie, abyś żył, ty i twoje potomstwo;"
"Pwt30,20": "I miłował PANA, swego Boga, słuchał jego głosu i do niego lgnął. On bowiem jest twoim życiem i przedłużeniem twoich dni, abyś mieszkał w ziemi, którą PAN poprzysiągł dać twoim ojcom: Abrahamowi, Izaakowi i Jakubowi."
