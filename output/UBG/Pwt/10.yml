"Pwt10,1":
  text: "W tym czasie PAN powiedział do mnie: Wyciosaj sobie dwie tablice kamienne podobne do pierwszych i wstąp do mnie na górę; uczyń też drewnianą arkę."
  tags: []
"Pwt10,2":
  text: "A napiszę na tych tablicach słowa, które były na pierwszych tablicach, które rozbiłeś; potem włożysz je do arki."
  tags: []
"Pwt10,3":
  text: "Uczyniłem więc arkę z drewna akacjowego i wyciosałem dwie tablice kamienne podobne do pierwszych, i wstąpiłem na górę, trzymając w rękach dwie tablice."
  tags: []
"Pwt10,4":
  text: "I PAN napisał na tych tablicach takie pismo jak poprzednio, dziesięć przykazań, które PAN wypowiedział do was na górze spośród ognia w dniu zgromadzenia. I dał mi je PAN."
  tags: []
"Pwt10,5":
  text: "Potem zawróciłem i zszedłem z góry, i włożyłem tablice do arki, którą uczyniłem, i tam się znajdują, tak jak PAN mi rozkazał."
  tags: []
"Pwt10,6":
  text: "Wtedy synowie Izraela wyruszyli od Beerot należącego do synów Jaakana do Mosery. Tam umarł Aaron i tam został pogrzebany. A jego syn Eleazar sprawował urząd kapłański w jego miejsce."
  tags: []
"Pwt10,7":
  text: "Stamtąd wyruszyli do Gudgody, a z Gudgody do Jotbata, do ziemi potoków wód."
  tags: []
"Pwt10,8":
  text: "W tym czasie PAN oddzielił pokolenie Lewiego do noszenia arki przymierza PANA, do stawania przed PANEM, by mu służyć i błogosławić w jego imię aż do dziś."
  tags: []
"Pwt10,9":
  text: "Dlatego pokolenie Lewiego nie ma działu ani dziedzictwa wśród swoich braci; PAN jest jego dziedzictwem, jak mu powiedział PAN, twój Bóg."
  tags: []
"Pwt10,10":
  text: "A ja pozostałem na górze, jak poprzednio, czterdzieści dni i czterdzieści nocy; także tym razem PAN mnie wysłuchał i nie chciał cię wytępić PAN."
  tags: []
"Pwt10,11":
  text: "Potem PAN powiedział do mnie: Wstań, wyrusz przed tym ludem, żeby weszli i posiedli ziemię, którą poprzysiągłem dać ich ojcom."
  tags: []
"Pwt10,12":
  text: "Teraz więc, Izraelu, czego żąda od ciebie PAN, twój Bóg? Tylko tego, abyś się bał PANA, swego Boga, abyś chodził wszystkimi jego drogami i abyś go miłował, i służył PANU, swemu Bogu, z całego swego serca i całą swoją duszą;"
  tags: []
"Pwt10,13":
  text: "Abyś przestrzegał przykazań PANA i jego nakazów, które ja ci dziś nakazuję dla twojego dobra."
  tags: []
"Pwt10,14":
  text: "Oto do PANA, twego Boga, należą niebiosa, niebiosa niebios, ziemia i wszystko, co jest na niej."
  tags: []
"Pwt10,15":
  text: "Jednak PAN upodobał sobie twoich ojców i umiłował ich, i wybrał ich potomstwo po nich, czyli was, ze wszystkich narodów, jak to jest dzisiaj."
  tags: []
"Pwt10,16":
  text: "Obrzeżcie więc nieobrzezanie swojego serca i nie zatwardzajcie już swojego karku."
  tags: []
"Pwt10,17":
  text: "Gdyż PAN, wasz Bóg, jest Bogiem bogów i PANEM panów, Bogiem wielkim, potężnym i straszliwym, który nie ma względu na osoby i nie przyjmuje darów."
  tags: []
"Pwt10,18":
  text: "On wymierza sprawiedliwość sierocie i wdowie i miłuje przybysza, dając mu chleb i odzież."
  tags: []
"Pwt10,19":
  text: "Miłujcie więc i wy przybysza, bo sami byliście przybyszami w ziemi Egiptu."
  tags: []
"Pwt10,20":
  text: "Będziesz się bał PANA, swego Boga, jemu będziesz służył, do niego będziesz lgnąć i na jego imię będziesz przysięgał."
  tags: []
"Pwt10,21":
  text: "On jest twoją chwałą i twoim Bogiem, który uczynił dla ciebie wielkie i straszliwe rzeczy, które widziały twoje oczy."
  tags: []
"Pwt10,22":
  text: "W liczbie siedemdziesięciu dusz zeszli twoi ojcowie do Egiptu, a teraz PAN, twój Bóg, uczynił cię tak licznym jak gwiazdy niebieskie."
  tags: []
