"Pwt10,1": "W tym czasie PAN powiedział do mnie: Wyciosaj sobie dwie tablice kamienne podobne do pierwszych i wstąp do mnie na górę; uczyń też drewnianą arkę."
"Pwt10,2": "A napiszę na tych tablicach słowa, które były na pierwszych tablicach, które rozbiłeś; potem włożysz je do arki."
"Pwt10,3": "Uczyniłem więc arkę z drewna akacjowego i wyciosałem dwie tablice kamienne podobne do pierwszych, i wstąpiłem na górę, trzymając w rękach dwie tablice."
"Pwt10,4": "I PAN napisał na tych tablicach takie pismo jak poprzednio, dziesięć przykazań, które PAN wypowiedział do was na górze spośród ognia w dniu zgromadzenia. I dał mi je PAN."
"Pwt10,5": "Potem zawróciłem i zszedłem z góry, i włożyłem tablice do arki, którą uczyniłem, i tam się znajdują, tak jak PAN mi rozkazał."
"Pwt10,6": "Wtedy synowie Izraela wyruszyli od Beerot należącego do synów Jaakana do Mosery. Tam umarł Aaron i tam został pogrzebany. A jego syn Eleazar sprawował urząd kapłański w jego miejsce."
"Pwt10,7": "Stamtąd wyruszyli do Gudgody, a z Gudgody do Jotbata, do ziemi potoków wód."
"Pwt10,8": "W tym czasie PAN oddzielił pokolenie Lewiego do noszenia arki przymierza PANA, do stawania przed PANEM, by mu służyć i błogosławić w jego imię aż do dziś."
"Pwt10,9": "Dlatego pokolenie Lewiego nie ma działu ani dziedzictwa wśród swoich braci; PAN jest jego dziedzictwem, jak mu powiedział PAN, twój Bóg."
"Pwt10,10": "A ja pozostałem na górze, jak poprzednio, czterdzieści dni i czterdzieści nocy; także tym razem PAN mnie wysłuchał i nie chciał cię wytępić PAN."
"Pwt10,11": "Potem PAN powiedział do mnie: Wstań, wyrusz przed tym ludem, żeby weszli i posiedli ziemię, którą poprzysiągłem dać ich ojcom."
"Pwt10,12": "Teraz więc, Izraelu, czego żąda od ciebie PAN, twój Bóg? Tylko tego, abyś się bał PANA, swego Boga, abyś chodził wszystkimi jego drogami i abyś go miłował, i służył PANU, swemu Bogu, z całego swego serca i całą swoją duszą;"
"Pwt10,13": "Abyś przestrzegał przykazań PANA i jego nakazów, które ja ci dziś nakazuję dla twojego dobra."
"Pwt10,14": "Oto do PANA, twego Boga, należą niebiosa, niebiosa niebios, ziemia i wszystko, co jest na niej."
"Pwt10,15": "Jednak PAN upodobał sobie twoich ojców i umiłował ich, i wybrał ich potomstwo po nich, czyli was, ze wszystkich narodów, jak to jest dzisiaj."
"Pwt10,16": "Obrzeżcie więc nieobrzezanie swojego serca i nie zatwardzajcie już swojego karku."
"Pwt10,17": "Gdyż PAN, wasz Bóg, jest Bogiem bogów i PANEM panów, Bogiem wielkim, potężnym i straszliwym, który nie ma względu na osoby i nie przyjmuje darów."
"Pwt10,18": "On wymierza sprawiedliwość sierocie i wdowie i miłuje przybysza, dając mu chleb i odzież."
"Pwt10,19": "Miłujcie więc i wy przybysza, bo sami byliście przybyszami w ziemi Egiptu."
"Pwt10,20": "Będziesz się bał PANA, swego Boga, jemu będziesz służył, do niego będziesz lgnąć i na jego imię będziesz przysięgał."
"Pwt10,21": "On jest twoją chwałą i twoim Bogiem, który uczynił dla ciebie wielkie i straszliwe rzeczy, które widziały twoje oczy."
"Pwt10,22": "W liczbie siedemdziesięciu dusz zeszli twoi ojcowie do Egiptu, a teraz PAN, twój Bóg, uczynił cię tak licznym jak gwiazdy niebieskie."
