"Pwt33,1": "A to jest błogosławieństwo, którym Mojżesz, mąż Boży, pobłogosławił synów Izraela przed swoją śmiercią."
"Pwt33,2": "Powiedział: PAN przyszedł z Synaju i z Seiru wzeszedł dla nich, zajaśniał z góry Paran i przyszedł z dziesięcioma tysiącami świętych; z jego prawicy wyszło dla nich ogniste prawo."
"Pwt33,3": "Doprawdy, on umiłował lud; wszyscy jego święci są w twych rękach i oni usiedli u twoich stóp; przyjmują twoje słowa."
"Pwt33,4": "Mojżesz dał nam prawo, dziedzictwo zgromadzenia Jakuba."
"Pwt33,5": "I był królem w Jeszurunie, gdy się zebrali naczelnicy ludu wraz z pokoleniami Izraela."
"Pwt33,6": "Niech żyje Ruben i niech nie umiera; niech jego mężczyzn będzie dużo."
"Pwt33,7": "Potem też dał błogosławieństwo dla Judy i powiedział: Wysłuchaj, PANIE, głosu Judy, i przyprowadź go do jego ludu. Niech starczy mu sił jego rąk, a ty bądź mu pomocą przeciw jego wrogom."
"Pwt33,8": "A o Lewim powiedział: Niech twoje Tummim i Urim będą przy twoim świętym, którego doświadczyłeś w Massa, z którym spierałeś się u wód Meriba;"
"Pwt33,9": "Który powiedział swemu ojcu i matce: Nie widziałem go; nie znał też swych braci ani nie znał swych synów. Oni bowiem przestrzegają twoich słów i zachowują twoje przymierze."
"Pwt33,10": "Będą uczyć Jakuba twoich sądów, a Izraela twego prawa. Będą kłaść kadzidło przed tobą i całopalenia na twoim ołtarzu."
"Pwt33,11": "Błogosław, PANIE, jego siłę, i przyjmij dzieło jego rąk; skrusz biodra jego wrogów i tych, którzy go nienawidzą, aby już nie powstali."
"Pwt33,12": "A o Beniaminie powiedział: Umiłowany przez PANA będzie mieszkał przy nim bezpiecznie; PAN będzie go bronił każdego dnia, a on będzie przebywał między jego ramionami."
"Pwt33,13": "O Józefie powiedział: Niech jego ziemia będzie błogosławiona przez PANA, z najlepszych rzeczy niebios, z rosy i z otchłani rozłożonej pod ziemią."
"Pwt33,14": "I z najcenniejszych plonów słońca, z najcenniejszych plonów księżyca;"
"Pwt33,15": "I z najlepszych skarbów gór starożytnych, z najlepszych darów odwiecznych pagórków;"
"Pwt33,16": "I z najcenniejszych owoców ziemi i jej obfitości oraz z przychylności tego, który przebywał w krzaku. Niech to błogosławieństwo spłynie na głowę Józefa i na czubek głowy tego, który został oddzielony od swoich braci."
"Pwt33,17": "Jego chwała jest jak pierworodny wół, a jego rogi jak rogi jednorożca. Nimi będzie bódł wszystkie narody aż po krańce ziemi; a są to dziesiątki tysięcy Efraima i tysiące Manassesa."
"Pwt33,18": "A o Zebulonie powiedział: Wesel się, Zebulonie, gdy wyruszasz, a ty, Issacharze, w swoich namiotach."
"Pwt33,19": "Zwołują ludy na górę, tam będą składać ofiary sprawiedliwości. Będą bowiem ssać z obfitości morza i ze skarbów ukrytych w piasku."
"Pwt33,20": "A o Gadzie powiedział: Błogosławiony ten, kto rozprzestrzeni Gada. Będzie mieszkać jak lew, a urwie ramię i głowę."
"Pwt33,21": "Upatrzył sobie najlepszą część, gdyż tam został mu wyznaczony dział przez prawodawcę; przyszedł z naczelnikami ludu i wykonał sprawiedliwość PANA i jego sądy z Izraelem."
"Pwt33,22": "A o Danie powiedział: Dan to szczenię lwie, wyskoczy z Baszanu."
"Pwt33,23": "A o Neftalim powiedział: Neftali, nasycony przychylnością i pełen błogosławieństwa PANA, posiądź zachód i południe."
"Pwt33,24": "A o Aszerze powiedział: Aszer będzie błogosławiony dziećmi, niech się podoba swoim braciom i niech kąpie swoje nogi w oliwie."
"Pwt33,25": "Twoje obuwie będzie z żelaza i miedzi; a ile twoich dni, taka będzie twoja siła."
"Pwt33,26": "Nikt nie jest jak Bóg Jeszuruna, który jeździ po niebie, by tobie pomóc, i po obłokach w swym majestacie."
"Pwt33,27": "Twoim schronieniem jest wieczny Bóg, a pod tobą są wieczne ramiona. On wypędzi przed tobą wroga i powie: Wyniszcz go."
"Pwt33,28": "Wtedy Izrael będzie mieszkać bezpiecznie sam. Źródło Jakuba – w ziemi zboża i wina, a niebiosa spuszczą rosę."
"Pwt33,29": "Błogosławiony jesteś, Izraelu! Któż do ciebie podobny, ludu zbawiony przez PANA, który jest tarczą twego ratunku i mieczem twego dostojeństwa! Twoi wrogowie poddadzą się tobie obłudnie, a ty zdepczesz ich wyniosłość."
