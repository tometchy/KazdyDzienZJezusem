"Pwt33,1":
  text: "A to jest błogosławieństwo, którym Mojżesz, mąż Boży, pobłogosławił synów Izraela przed swoją śmiercią."
  tags: []
"Pwt33,2":
  text: "Powiedział: PAN przyszedł z Synaju i z Seiru wzeszedł dla nich, zajaśniał z góry Paran i przyszedł z dziesięcioma tysiącami świętych; z jego prawicy wyszło dla nich ogniste prawo."
  tags: []
"Pwt33,3":
  text: "Doprawdy, on umiłował lud; wszyscy jego święci są w twych rękach i oni usiedli u twoich stóp; przyjmują twoje słowa."
  tags: []
"Pwt33,4":
  text: "Mojżesz dał nam prawo, dziedzictwo zgromadzenia Jakuba."
  tags: []
"Pwt33,5":
  text: "I był królem w Jeszurunie, gdy się zebrali naczelnicy ludu wraz z pokoleniami Izraela."
  tags: []
"Pwt33,6":
  text: "Niech żyje Ruben i niech nie umiera; niech jego mężczyzn będzie dużo."
  tags: []
"Pwt33,7":
  text: "Potem też dał błogosławieństwo dla Judy i powiedział: Wysłuchaj, PANIE, głosu Judy, i przyprowadź go do jego ludu. Niech starczy mu sił jego rąk, a ty bądź mu pomocą przeciw jego wrogom."
  tags: []
"Pwt33,8":
  text: "A o Lewim powiedział: Niech twoje Tummim i Urim będą przy twoim świętym, którego doświadczyłeś w Massa, z którym spierałeś się u wód Meriba;"
  tags: []
"Pwt33,9":
  text: "Który powiedział swemu ojcu i matce: Nie widziałem go; nie znał też swych braci ani nie znał swych synów. Oni bowiem przestrzegają twoich słów i zachowują twoje przymierze."
  tags: []
"Pwt33,10":
  text: "Będą uczyć Jakuba twoich sądów, a Izraela twego prawa. Będą kłaść kadzidło przed tobą i całopalenia na twoim ołtarzu."
  tags: []
"Pwt33,11":
  text: "Błogosław, PANIE, jego siłę, i przyjmij dzieło jego rąk; skrusz biodra jego wrogów i tych, którzy go nienawidzą, aby już nie powstali."
  tags: []
"Pwt33,12":
  text: "A o Beniaminie powiedział: Umiłowany przez PANA będzie mieszkał przy nim bezpiecznie; PAN będzie go bronił każdego dnia, a on będzie przebywał między jego ramionami."
  tags: []
"Pwt33,13":
  text: "O Józefie powiedział: Niech jego ziemia będzie błogosławiona przez PANA, z najlepszych rzeczy niebios, z rosy i z otchłani rozłożonej pod ziemią."
  tags: []
"Pwt33,14":
  text: "I z najcenniejszych plonów słońca, z najcenniejszych plonów księżyca;"
  tags: []
"Pwt33,15":
  text: "I z najlepszych skarbów gór starożytnych, z najlepszych darów odwiecznych pagórków;"
  tags: []
"Pwt33,16":
  text: "I z najcenniejszych owoców ziemi i jej obfitości oraz z przychylności tego, który przebywał w krzaku. Niech to błogosławieństwo spłynie na głowę Józefa i na czubek głowy tego, który został oddzielony od swoich braci."
  tags: []
"Pwt33,17":
  text: "Jego chwała jest jak pierworodny wół, a jego rogi jak rogi jednorożca. Nimi będzie bódł wszystkie narody aż po krańce ziemi; a są to dziesiątki tysięcy Efraima i tysiące Manassesa."
  tags: []
"Pwt33,18":
  text: "A o Zebulonie powiedział: Wesel się, Zebulonie, gdy wyruszasz, a ty, Issacharze, w swoich namiotach."
  tags: []
"Pwt33,19":
  text: "Zwołują ludy na górę, tam będą składać ofiary sprawiedliwości. Będą bowiem ssać z obfitości morza i ze skarbów ukrytych w piasku."
  tags: []
"Pwt33,20":
  text: "A o Gadzie powiedział: Błogosławiony ten, kto rozprzestrzeni Gada. Będzie mieszkać jak lew, a urwie ramię i głowę."
  tags: []
"Pwt33,21":
  text: "Upatrzył sobie najlepszą część, gdyż tam został mu wyznaczony dział przez prawodawcę; przyszedł z naczelnikami ludu i wykonał sprawiedliwość PANA i jego sądy z Izraelem."
  tags: []
"Pwt33,22":
  text: "A o Danie powiedział: Dan to szczenię lwie, wyskoczy z Baszanu."
  tags: []
"Pwt33,23":
  text: "A o Neftalim powiedział: Neftali, nasycony przychylnością i pełen błogosławieństwa PANA, posiądź zachód i południe."
  tags: []
"Pwt33,24":
  text: "A o Aszerze powiedział: Aszer będzie błogosławiony dziećmi, niech się podoba swoim braciom i niech kąpie swoje nogi w oliwie."
  tags: []
"Pwt33,25":
  text: "Twoje obuwie będzie z żelaza i miedzi; a ile twoich dni, taka będzie twoja siła."
  tags: []
"Pwt33,26":
  text: "Nikt nie jest jak Bóg Jeszuruna, który jeździ po niebie, by tobie pomóc, i po obłokach w swym majestacie."
  tags: []
"Pwt33,27":
  text: "Twoim schronieniem jest wieczny Bóg, a pod tobą są wieczne ramiona. On wypędzi przed tobą wroga i powie: Wyniszcz go."
  tags: []
"Pwt33,28":
  text: "Wtedy Izrael będzie mieszkać bezpiecznie sam. Źródło Jakuba – w ziemi zboża i wina, a niebiosa spuszczą rosę."
  tags: []
"Pwt33,29":
  text: "Błogosławiony jesteś, Izraelu! Któż do ciebie podobny, ludu zbawiony przez PANA, który jest tarczą twego ratunku i mieczem twego dostojeństwa! Twoi wrogowie poddadzą się tobie obłudnie, a ty zdepczesz ich wyniosłość."
  tags: []
