"Pwt12,1":
  text: "To są nakazy i prawa, których wypełnienia dopilnujcie w ziemi, którą daje ci PAN, Bóg waszych ojców, żebyś ją dziedzicznie otrzymał po wszystkie dni swojego życia na ziemi."
  tags: []
"Pwt12,2":
  text: "Doszczętnie zniszczycie wszystkie miejsca, w których narody, którymi wy zawładniecie, służyli swoim bogom na wysokich górach, na wzgórzach i pod każdym zielonym drzewem."
  tags: []
"Pwt12,3":
  text: "Zburzycie ich ołtarze, potłuczecie ich pomniki i spalicie w ogniu ich gaje; porąbiecie też wyrzeźbione posągi ich bogów i wytracicie ich imiona z tego miejsca."
  tags: []
"Pwt12,4":
  text: "Nie postępujcie tak z PANEM, swoim Bogiem;"
  tags: []
"Pwt12,5":
  text: "Lecz do miejsca, które PAN, wasz Bóg, wybierze ze wszystkich waszych pokoleń, aby tam umieścić swoje imię i zamieszkać, właśnie tam będziecie uczęszczać i tam będziecie przychodzić."
  tags: []
"Pwt12,6":
  text: "Tam będziecie przynosić swoje całopalenia, ofiary, dziesięciny i ofiary wzniesienia, swoje ofiary ślubowane i dobrowolne oraz pierworodne ze swojego bydła i owiec."
  tags: []
"Pwt12,7":
  text: "I tam będziecie jeść przed PANEM, swoim Bogiem, i będziecie się radować ze wszystkiego, co osiągnęły wasze ręce, wy i wasze rodziny, w czym pobłogosławi cię PAN, twój Bóg."
  tags: []
"Pwt12,8":
  text: "Nie będziecie postępować zgodnie z tym wszystkim, co my tu dziś czynimy: każdy, co jest dobre w jego oczach;"
  tags: []
"Pwt12,9":
  text: "Jeszcze nie przyszliście bowiem do odpoczynku i do dziedzictwa, które PAN, twój Bóg, daje tobie."
  tags: []
"Pwt12,10":
  text: "Ale gdy przejdziecie przez Jordan, będziecie mieszkać w ziemi, którą PAN, wasz Bóg, daje wam w dziedzictwo, gdy tam da wam odpoczynek od wszystkich waszych wrogów wokoło i zamieszkacie bezpiecznie;"
  tags: []
"Pwt12,11":
  text: "Wtedy na miejsce, które PAN, wasz Bóg, wybierze sobie, by w nim przebywało jego imię, przyniesiecie wszystko, co wam nakazuję: wasze całopalenia, ofiary, dziesięciny i ofiary wzniesienia, oraz wszystkie najlepsze ofiary ślubowane, które będziecie ślubować PANU."
  tags: []
"Pwt12,12":
  text: "I będziecie się radować przed PANEM, swoim Bogiem, wy, wasi synowie, wasze córki, wasi słudzy, wasze służące oraz Lewita, który jest w waszych bramach, ponieważ nie ma działu ani dziedzictwa z wami."
  tags: []
"Pwt12,13":
  text: "Strzeż się, abyś nie składał swoich całopaleń na każdym miejscu, które zobaczysz;"
  tags: []
"Pwt12,14":
  text: "Lecz tylko na miejscu, które wybierze PAN w jednym z twoich pokoleń, tam będziesz składał swoje całopalenia i tam będziesz czynił wszystko, co ci nakazuję."
  tags: []
"Pwt12,15":
  text: "Jeśli jednak twoja dusza zapragnie, możesz zabić i jeść mięso według błogosławieństwa PANA, swego Boga, które da tobie we wszystkich twoich bramach. Może je jeść nieczysty i czysty, podobnie jak sarnę albo jelenia."
  tags: []
"Pwt12,16":
  text: "Tylko krwi nie będziecie spożywać; wylejecie ją na ziemię jak wodę."
  tags: []
"Pwt12,17":
  text: "Nie będziesz mógł w swoich bramach spożywać dziesięciny ze swego zboża, wina i oliwy, pierworodnych ze swego bydła i swoich owiec ani żadnej ze swoich ofiar ślubowanych, które ślubowałeś, ze swoich dobrowolnych ofiar lub z ofiary wzniesienia."
  tags: []
"Pwt12,18":
  text: "Lecz będziesz je spożywał przed PANEM, swoim Bogiem, na miejscu, które wybierze PAN, twój Bóg, spożyjesz ty, twój syn, twoja córka, twój sługa, twoja służąca oraz Lewita, który jest w twoich bramach. I będziesz się radował przed PANEM, swoim Bogiem, ze wszystkiego, co osiągną twoje ręce."
  tags: []
"Pwt12,19":
  text: "Strzeż się, abyś nie opuszczał Lewity przez wszystkie twoje dni na ziemi."
  tags: []
"Pwt12,20":
  text: "Gdy PAN, twój Bóg, poszerzy twoją granicę, tak jak ci zapowiedział, a powiesz: Będę jadł mięso, ponieważ twoja dusza pragnie jeść mięso, to możesz go spożyć tyle, ile tylko zapragnie twoja dusza."
  tags: []
"Pwt12,21":
  text: "A jeśli daleko od ciebie będzie miejsce, które PAN, twój Bóg, wybierze, aby tam przebywało jego imię, wtedy zabijesz ze swego bydła i ze swoich owiec, które da ci PAN, tak jak ci nakazałem, i będziesz jadł w swoich bramach cokolwiek twoja dusza zapragnie."
  tags: []
"Pwt12,22":
  text: "Jak się je sarnę lub jelenia, tak będziesz je spożywać. Zarówno nieczysty, jak i czysty może je spożywać."
  tags: []
"Pwt12,23":
  text: "Tylko wystrzegaj się, byś nie spożywał krwi, bo krew jest życiem, i nie będziesz spożywał życia razem z mięsem."
  tags: []
"Pwt12,24":
  text: "Nie będziesz jej spożywał, wylej ją na ziemię jak wodę."
  tags: []
"Pwt12,25":
  text: "Nie będziesz jej spożywał, aby się dobrze powodziło tobie i twoim synom po tobie, gdy uczynisz to, co jest dobre w oczach PANA."
  tags: []
"Pwt12,26":
  text: "Tylko twoje rzeczy święte, które będziesz miał, i twoje ofiary ślubowane weźmiesz i przyniesiesz na miejsce, które wybierze PAN;"
  tags: []
"Pwt12,27":
  text: "I złożysz swoje całopalenia, mięso i krew na ołtarzu PANA, swego Boga. Lecz krew twoich ofiar będzie wylana na ołtarzu PANA, twego Boga, mięso zaś spożyjesz."
  tags: []
"Pwt12,28":
  text: "Przestrzegaj i słuchaj wszystkich tych słów, które ci nakazuję, aby dobrze się powodziło tobie i twoim synom po tobie aż na wieki, gdy będziesz czynić to, co dobre i prawe w oczach PANA, twojego Boga."
  tags: []
"Pwt12,29":
  text: "Gdy PAN, twój Bóg, wytępi przed tobą narody, do których idziesz, by nimi zawładnąć, i opanujesz je, i zamieszkasz w ich ziemi;"
  tags: []
"Pwt12,30":
  text: "Strzeż się, byś się nie dał usidlić, idąc za nimi, gdy będą wytępione przed tobą; nie pytaj się też o ich bogów, mówiąc: W jaki sposób te narody służyły swoim bogom? Tak samo i ja uczynię."
  tags: []
"Pwt12,31":
  text: "Nie uczynisz tak PANU, swemu Bogu, gdyż wszystko, czym brzydzi się PAN i czego nienawidzi, czynili swoim bogom; nawet swoich synów i swoje córki palili w ogniu dla swoich bogów."
  tags: []
"Pwt12,32":
  text: "Cokolwiek wam nakazuję, pilnie wypełniajcie. Nic do tego nie dodasz ani od tego nie ujmiesz."
  tags: []
