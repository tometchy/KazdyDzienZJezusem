"Pwt7,1": "Gdy PAN, twój Bóg, wprowadzi cię do ziemi, do której wchodzisz, by ją posiąść, i gdy wypędzi przed tobą wiele narodów: Chetytów, Girgaszytów, Amorytów, Kananejczyków, Peryzzytów, Chiwwitów i Jebusytów – siedem narodów liczniejszych i potężniejszych niż ty;"
"Pwt7,2": "Gdy więc PAN, twój Bóg, wyda je tobie, wytępisz je, doszczętnie je wyniszczysz, nie zawrzesz z nimi przymierza i nie zlitujesz się nad nimi;"
"Pwt7,3": "Nie będziesz z nimi zawierał małżeństw: swej córki nie dasz ich synowi i ich córki nie weźmiesz dla swego syna;"
"Pwt7,4": "Gdyż odwiodłaby twego syna od kroczenia za mną, by służyli innym bogom. Wtedy rozpaliłby się gniew PANA na was i prędko by was wytępił."
"Pwt7,5": "Lecz tak z nimi postąpicie: Zburzycie ich ołtarze, pokruszycie ich pomniki, wytniecie ich gaje i spalicie ogniem ich rzeźbione posągi."
"Pwt7,6": "Ty bowiem jesteś świętym ludem dla PANA, swego Boga: PAN, twój Bóg, wybrał cię, abyś był dla niego szczególnym ludem spośród wszystkich narodów, które są na ziemi."
"Pwt7,7": "PAN umiłował was i wybrał was nie dlatego, że byliście liczniejsi od innych narodów, gdyż byliście najmniej liczni ze wszystkich narodów;"
"Pwt7,8": "Lecz ponieważ PAN was umiłował i chciał dochować przysięgi, którą złożył waszym ojcom, PAN wyprowadził was potężną ręką i wykupił was z domu niewoli, z ręki faraona, króla Egiptu."
"Pwt7,9": "Uznaj więc, że PAN, twój Bóg, jest Bogiem, Bogiem wiernym, który zachowuje przymierze i miłosierdzie do tysiącznego pokolenia względem tych, którzy go miłują i przestrzegają jego przykazań;"
"Pwt7,10": "A odpłaca w twarz tym, którzy go nienawidzą, aby ich zniszczyć. Nie zwleka z karą dla tego, który go nienawidzi; odpłaci mu w twarz."
"Pwt7,11": "Przestrzegaj więc przykazań, nakazów i praw, które ja dziś nakazuję ci wypełnić."
"Pwt7,12": "Jeśli będziecie słuchać tych praw, przestrzegać ich i wypełniać je, wtedy PAN, twój Bóg, dochowa ci przymierza i miłosierdzia, które poprzysiągł twoim ojcom."
"Pwt7,13": "I będzie cię miłował, błogosławił ci i rozmnoży cię. I pobłogosławi owoc twego łona i owoc twojej ziemi: twoje zboże, twoje wino i twoją oliwę, przyrost twoich krów i trzody twoich owiec na ziemi, którą poprzysiągł twoim ojcom dać tobie."
"Pwt7,14": "Będziesz błogosławiony ponad wszystkie narody. Nie będzie niepłodnego i niepłodnej ani wśród ciebie, ani wśród twego bydła."
"Pwt7,15": "PAN oddali też od ciebie każdą chorobę i nie ześle na ciebie żadnych dotkliwych chorób Egiptu, które poznałeś, lecz ześle je na wszystkich, którzy cię nienawidzą."
"Pwt7,16": "I wytępisz wszystkie narody, które PAN, twój Bóg, tobie wyda; nie zlituje się nad nimi twoje oko. I nie będziesz służył ich bogom, bo byłoby to dla ciebie sidłem."
"Pwt7,17": "Jeśli powiesz w swym sercu: Te narody są liczniejsze ode mnie, jakże będę mógł je wypędzić?"
"Pwt7,18": "Nie bój się ich, ale dobrze pamiętaj to, co PAN, twój Bóg, uczynił faraonowi i całemu Egiptowi;"
"Pwt7,19": "Te wielkie doświadczenia, które twoje oczy widziały, te znaki, cuda, potężną rękę i wyciągnięte ramię, którymi PAN, twój Bóg, cię wyprowadził. Tak uczyni PAN, twój Bóg, wszystkim narodom, których się boisz."
"Pwt7,20": "Ponadto PAN, twój Bóg, ześle na nich szerszenie, aż wyginą ci, którzy pozostali, i ci, którzy ukryli się przed tobą."
"Pwt7,21": "Nie drżyj przed nimi, gdyż PAN, twój Bóg, jest pośród ciebie, Bóg wielki i straszliwy."
"Pwt7,22": "I PAN, twój Bóg, wypędzi przed tobą te narody z wolna i po trosze: Nie będziesz mógł wytępić ich szybko, aby nie rozmnożyły się przeciw tobie zwierzęta polne."
"Pwt7,23": "Lecz PAN, twój Bóg, wyda je tobie i porazi je wielką klęską, aż będą wyniszczone."
"Pwt7,24": "I wyda ich królów w twoje ręce i zgładzisz ich imię spod nieba. Nikt nie ostoi się przed tobą, aż ich wytępisz."
"Pwt7,25": "Rzeźbione posągi ich bogów spalisz w ogniu. Nie będziesz pożądał srebra ani złota, które jest na nich, ani nie będziesz brał go dla siebie, byś nie został przez nie usidlony, ponieważ to budzi odrazę u PANA, twego Boga."
"Pwt7,26": "Nie wnoś takiej obrzydliwości do swego domu, abyś się nie stał przekleństwem tak jak i ona. Będziesz się nią bardzo brzydził i czuł do niej ogromny wstręt, gdyż to jest przekleństwo."
