"Pwt5,1":
  text: "I Mojżesz zwołał całego Izraela, i powiedział do nich: Słuchaj, Izraelu, nakazów i praw, które dziś mówię do twoich uszu; nauczcie się ich i przestrzegajcie, i wypełniajcie je."
  tags: []
"Pwt5,2":
  text: "PAN, nasz Bóg, zawarł z nami przymierze na Horebie."
  tags: []
"Pwt5,3":
  text: "PAN zawarł to przymierze nie z naszymi ojcami, ale z nami, którzy tu wszyscy dziś jesteśmy przy życiu."
  tags: []
"Pwt5,4":
  text: "Twarzą w twarz rozmawiał z wami PAN na górze spośród ognia;"
  tags: []
"Pwt5,5":
  text: "Ja stałem w tym czasie pomiędzy PANEM a wami, aby oznajmić wam słowo PANA, gdyż baliście się ognia i nie wstąpiliście na górę. A on powiedział:"
  tags: []
"Pwt5,6":
  text: "Ja jestem PAN, twój Bóg, który cię wyprowadził z ziemi Egiptu, z domu niewoli."
  tags: []
"Pwt5,7":
  text: "Nie będziesz miał innych bogów przede mną."
  tags: []
"Pwt5,8":
  text: "Nie czyń sobie rzeźbionego posągu ani żadnej podobizny czegokolwiek, co jest w górze na niebie, co jest nisko na ziemi ani tego, co jest w wodach pod ziemią;"
  tags: []
"Pwt5,9":
  text: "Nie będziesz oddawał im pokłonu ani nie będziesz im służył, gdyż ja jestem PAN, twój Bóg, Bóg zazdrosny, nawiedzający nieprawość ojców na synach do trzeciego i czwartego pokolenia tych, którzy mnie nienawidzą;"
  tags: []
"Pwt5,10":
  text: "A okazujący miłosierdzie tysiącom tych, którzy mnie miłują i strzegą moich przykazań."
  tags: []
"Pwt5,11":
  text: "Nie będziesz brał imienia PANA, twego Boga, nadaremnie, gdyż PAN nie zostawi bez kary tego, który bierze jego imię nadaremnie."
  tags: []
"Pwt5,12":
  text: "Przestrzegaj dnia szabatu, abyś go święcił, tak jak ci nakazał PAN, twój Bóg."
  tags: []
"Pwt5,13":
  text: "Przez sześć dni będziesz pracował i wykonywał wszelką swoją pracę;"
  tags: []
"Pwt5,14":
  text: "Lecz siódmy dzień jest szabatem PANA, twego Boga. Nie będziesz wykonywał żadnej pracy w tym dniu ani ty, ani twój syn, ani twoja córka, ani twój sługa, ani twoja służąca, ani twój wół, ani twój osioł, ani żadne twoje bydło, ani twój gość, który jest w twych bramach; aby odpoczął twój sługa i twoja służąca – jak i ty."
  tags: []
"Pwt5,15":
  text: "I pamiętaj, że byłeś niewolnikiem w ziemi Egiptu i że PAN, twój Bóg, wyprowadził cię stamtąd potężną ręką i wyciągniętym ramieniem. Dlatego PAN, twój Bóg, nakazał ci obchodzić dzień szabatu."
  tags: []
"Pwt5,16":
  text: "Czcij swego ojca i swoją matkę, tak jak nakazał ci PAN, twój Bóg, aby przedłużone były twoje dni i żeby ci się dobrze powodziło na ziemi, którą PAN, twój Bóg, da tobie."
  tags: []
"Pwt5,17":
  text: "Nie będziesz zabijał."
  tags: []
"Pwt5,18":
  text: "Nie będziesz cudzołożył."
  tags: []
"Pwt5,19":
  text: "Nie będziesz kradł."
  tags: []
"Pwt5,20":
  text: "Nie będziesz mówił fałszywego świadectwa przeciw twemu bliźniemu."
  tags: []
"Pwt5,21":
  text: "Nie będziesz pragnął żony swego bliźniego ani nie będziesz pożądał domu swego bliźniego, ani jego pola, ani jego sługi czy służącej, ani jego wołu czy osła, ani żadnej rzeczy, która należy do twego bliźniego."
  tags: []
"Pwt5,22":
  text: "Te słowa wypowiedział PAN do całego waszego zgromadzenia na górze spośród ognia, obłoku i ciemności donośnym głosem. I nic nie dodał. Potem napisał je na dwóch tablicach kamiennych i dał mi je."
  tags: []
"Pwt5,23":
  text: "A gdy usłyszeliście głos spośród ciemności, a góra płonęła ogniem, zbliżyliście się do mnie, wszyscy naczelnicy waszych pokoleń oraz starsi;"
  tags: []
"Pwt5,24":
  text: "I powiedzieliście: Oto PAN, nasz Bóg, ukazał nam swoją chwałę i wielkość i słyszeliśmy jego głos spośród ognia. Dziś widzieliśmy, że Bóg przemawia do człowieka, a ten pozostaje przy życiu."
  tags: []
"Pwt5,25":
  text: "Dlaczego więc teraz mamy umrzeć? Bo ten wielki ogień nas pochłonie. Jeśli nadal będziemy słyszeć głos PANA, naszego Boga, pomrzemy."
  tags: []
"Pwt5,26":
  text: "Któż bowiem spośród wszelkiego ciała słyszał głos Boga żywego mówiącego spośród ognia, tak jak my, a pozostał przy życiu?"
  tags: []
"Pwt5,27":
  text: "Zbliż się ty i wysłuchaj wszystkiego, co będzie mówił PAN, nasz Bóg. Ty zaś powiesz nam wszystko, co powie do ciebie PAN, nasz Bóg, a my posłuchamy i wykonamy to."
  tags: []
"Pwt5,28":
  text: "I PAN wysłuchał głosu waszych słów, kiedy mówiliście do mnie, i powiedział PAN do mnie: Słyszałem głos słów tego ludu, które wypowiedzieli do ciebie. Wszystko, co powiedzieli, jest słuszne."
  tags: []
"Pwt5,29":
  text: "Oby ich serce było takie, by się mnie bali i przestrzegali wszystkich moich przykazań przez wszystkie dni, aby dobrze się powodziło im i ich synom na wieki."
  tags: []
"Pwt5,30":
  text: "Idź i powiedz im: Wróćcie do swoich namiotów."
  tags: []
"Pwt5,31":
  text: "A ty zostań tu przy mnie, a powiem ci wszystkie przykazania, nakazy i prawa, których będziesz ich nauczał, aby je wypełniali w ziemi, którą daję im w posiadanie."
  tags: []
"Pwt5,32":
  text: "Dopilnujcie wypełniania tego tak, jak wam nakazał PAN, wasz Bóg. Nie zbaczajcie ani w prawo, ani w lewo."
  tags: []
"Pwt5,33":
  text: "Będziecie chodzić wszelką drogą, którą wam nakazał PAN, wasz Bóg, abyście żyli, aby dobrze się wam powodziło i żebyście przedłużyli swoje dni na ziemi, którą posiądziecie."
  tags: []
