"Pwt26,1": "Gdy wejdziesz do ziemi, którą PAN, twój Bóg, daje ci w dziedzictwo, gdy posiądziesz ją i zamieszkasz w niej;"
"Pwt26,2": "Wtedy weźmiesz pierwociny ze wszystkich owoców ziemi, które złożysz w ofierze ze swojej ziemi danej ci przez PANA, twojego Boga, i włożysz je do kosza, i udasz się na miejsce, które wybierze PAN, twój Bóg, na mieszkanie dla swego imienia."
"Pwt26,3": "I przyjdziesz do kapłana, który w tym czasie będzie pełnić służbę, i powiesz do niego: Wyznaję dziś PANU, twemu Bogu, że wszedłem do ziemi, którą PAN poprzysiągł naszym ojcom, że nam ją da."
"Pwt26,4": "Wtedy kapłan weźmie kosz z twojej ręki i postawi go przed ołtarzem PANA, twego Boga."
"Pwt26,5": "I odezwiesz się, i powiesz przed PANEM, swoim Bogiem: Mój ojciec był Syryjczykiem bliskim śmierci, zstąpił do Egiptu, gdzie przebywał w nielicznej garstce i stał się tam wielkim narodem, potężnym i licznym."
"Pwt26,6": "Lecz Egipcjanie źle nas traktowali, dręczyli nas i nakładali na nas ciężką pracę."
"Pwt26,7": "Wtedy wołaliśmy do PANA, Boga naszych ojców, i PAN wysłuchał naszego głosu, i wejrzał na nasze utrapienie, naszą pracę i nasz ucisk;"
"Pwt26,8": "I wywiódł nas PAN z Egiptu potężną ręką i wyciągniętym ramieniem wśród wielkiej grozy, znaków i cudów;"
"Pwt26,9": "I przyprowadził nas na to miejsce, i dał nam tę ziemię, ziemię opływającą mlekiem i miodem."
"Pwt26,10": "Teraz oto przyniosłem pierwociny z owoców ziemi, którą mi dałeś, PANIE. I położysz je przed PANEM, swoim Bogiem, i oddasz pokłon przed PANEM, swoim Bogiem;"
"Pwt26,11": "I będziesz się radował ze wszystkich dóbr, które PAN, twój Bóg, dał tobie i twemu domowi, ty, Lewita i przybysz, który jest pośród ciebie."
"Pwt26,12": "A gdy zakończysz składanie wszystkich dziesięcin swoich zbiorów w trzecim roku, roku dziesięcin, gdy oddasz je Lewicie, przybyszowi, sierocie oraz wdowie, aby najedli się do syta w twoich bramach;"
"Pwt26,13": "Wtedy powiesz przed PANEM, swoim Bogiem: Wziąłem z domu to, co jest poświęcone, i dałem też z tego Lewicie, przybyszowi, sierocie oraz wdowie zgodnie ze wszystkimi twoimi przykazaniami, które mi nakazałeś. Nie przekroczyłem twoich przykazań ani nie zapomniałem ich."
"Pwt26,14": "Nie jadłem z tego w czasie żałoby, niczego z tego nie odjąłem do użytku pospolitego, ani też nic z tego nie dałem dla zmarłych. Usłuchałem głosu PANA, mojego Boga, uczyniłem wszystko, co mi nakazałeś."
"Pwt26,15": "Spójrz ze swego świętego przybytku z nieba, i błogosław swemu ludowi Izraela oraz ziemi, którą nam dałeś, tak jak poprzysiągłeś naszym ojcom, ziemi mlekiem i miodem płynącej."
"Pwt26,16": "Dziś PAN, twój Bóg, nakazuje ci wypełnić te ustawy i prawa. Przestrzegaj ich więc i wypełniaj je z całego swego serca i całą swoją duszą."
"Pwt26,17": "Dziś oświadczyłeś, że PAN jest twoim Bogiem, że będziesz chodził jego drogami, przestrzegał jego ustaw, przykazań i praw oraz że będziesz słuchał jego głosu."
"Pwt26,18": "PAN zaś oświadczył dziś, że będziesz jego szczególnym ludem, jak ci obiecał, i że masz przestrzegać wszystkich jego przykazań;"
"Pwt26,19": "Że wywyższy cię ponad wszystkie narody, które uczynił, w chwale, w sławie i we czci, i że masz być ludem świętym dla PANA, swego Boga, tak jak powiedział."
