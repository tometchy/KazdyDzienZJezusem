"Pwt3,1":
  text: "Potem zawróciliśmy i poszliśmy drogą w kierunku Baszanu. I wyszedł nam naprzeciw Og, król Baszanu – on i cały jego lud – by stoczyć z nami bitwę w Edrei."
  tags: []
"Pwt3,2":
  text: "Wtedy PAN powiedział do mnie: Nie bój się go, gdyż wydałem go w twoje ręce wraz z całym jego ludem i ziemią; uczynisz mu, jak uczyniłeś Sichonowi, królowi Amorytów, który mieszkał w Cheszbonie."
  tags: []
"Pwt3,3":
  text: "PAN, nasz Bóg, wydał więc w nasze ręce również Oga, króla Baszanu, i cały jego lud. Pobiliśmy go tak, że nikt po nim nie pozostał."
  tags: []
"Pwt3,4":
  text: "Zdobyliśmy w tym czasie wszystkie jego miasta; nie było miasta, którego im nie zabraliśmy: sześćdziesiąt miast, całą krainę Argob, królestwo Oga w Baszanie."
  tags: []
"Pwt3,5":
  text: "Wszystkie te miasta były obwarowane wysokimi murami, bramami i ryglami, a oprócz tego było bardzo wiele nieobwarowanych miasteczek."
  tags: []
"Pwt3,6":
  text: "I spustoszyliśmy je, jak uczyniliśmy Sichonowi, królowi Cheszbonu, zniszczyliśmy we wszystkich miastach mężczyzn, kobiety i dzieci."
  tags: []
"Pwt3,7":
  text: "Lecz całe bydło i łupy z miast zgarnęliśmy dla siebie."
  tags: []
"Pwt3,8":
  text: "W tym czasie wzięliśmy również z ręki dwóch królów Amorytów ziemię, która leży po tej stronie Jordanu, od rzeki Arnon aż do góry Hermon;"
  tags: []
"Pwt3,9":
  text: "(Sydończycy nazywają Hermon Sirionem, a Amoryci – Sanirem)."
  tags: []
"Pwt3,10":
  text: "Wszystkie miasta na równinie i cały Gilead oraz cały Baszan aż do Salka i Edrei, miasta królestwa Oga w Baszanie."
  tags: []
"Pwt3,11":
  text: "Gdyż tylko sam Og, król Baszanu, pozostał z olbrzymów; a jego łoże, łoże żelazne, czy nie znajduje się w Rabbie synów Ammona? Długie na dziewięć łokci, a szerokie na cztery łokcie, według łokcia męskiego."
  tags: []
"Pwt3,12":
  text: "A ziemię, którą wzięliśmy w posiadanie w tym czasie od Aroeru, który leży nad rzeką Arnon, i połowę góry Gilead oraz jej miasta dałem Rubenitom i Gadytom."
  tags: []
"Pwt3,13":
  text: "A resztę Gileadu i cały Baszan, królestwa Oga, dałem połowie pokolenia Manassesa: całą krainę Argob i cały Baszan nazwano ziemią olbrzymów."
  tags: []
"Pwt3,14":
  text: "Jair, syn Manassesa, posiadł całą krainę Argob aż do granicy Geszurytów i Machaty i nazwał ją od swego imienia Baszan-Chawot-Jair; nazywa się tak aż do dziś."
  tags: []
"Pwt3,15":
  text: "Makirowi zaś dałem Gilead."
  tags: []
"Pwt3,16":
  text: "A Rubenitom i Gadytom dałem krainę od Gileadu aż do rzeki Arnon, ze środkiem rzeki jako granicą, aż do rzeki Jabbok, która jest granicą synów Ammona;"
  tags: []
"Pwt3,17":
  text: "Do tego równinę i Jordan z granicą od Kinneret aż do Morza Równinnego, czyli Morza Słonego, pod górą Pizga na wschodzie."
  tags: []
"Pwt3,18":
  text: "W tym czasie rozkazałem wam: PAN, wasz Bóg, dał wam tę ziemię w posiadanie. Pójdziecie uzbrojeni przed waszymi braćmi, synami Izraela, wszyscy wojownicy."
  tags: []
"Pwt3,19":
  text: "Tylko wasze żony i dzieci oraz wasze bydło (gdyż wiem, że macie wiele stad) zostaną w waszych miastach, które wam dałem."
  tags: []
"Pwt3,20":
  text: "Aż PAN da odpoczynek waszym braciom, jak również wam, i aż oni posiądą ziemię, którą PAN, wasz Bóg, dał im za Jordanem. Wtedy każdy wróci do swojej posiadłości, którą wam dałem."
  tags: []
"Pwt3,21":
  text: "W tym czasie przykazałem też Jozuemu: Twoje oczy widziały wszystko, co PAN, wasz Bóg, uczynił tym dwom królom. Tak samo uczyni PAN wszystkim królestwom, do których pójdziesz."
  tags: []
"Pwt3,22":
  text: "Nie bójcie się ich, ponieważ sam PAN, wasz Bóg, walczy za was."
  tags: []
"Pwt3,23":
  text: "I prosiłem PANA w tym czasie:"
  tags: []
"Pwt3,24":
  text: "Panie BOŻE, ty zacząłeś okazywać twemu słudze swoją wielkość i swoją potężną rękę; któryż bóg na niebie albo na ziemi potrafi czynić takie potężne dzieła jak ty?"
  tags: []
"Pwt3,25":
  text: "Pozwól mi, proszę, przejść i zobaczyć tę dobrą ziemię, która jest za Jordanem, tę dobrą górę i Liban."
  tags: []
"Pwt3,26":
  text: "Lecz PAN rozgniewał się na mnie z waszego powodu i nie wysłuchał mnie. I PAN powiedział do mnie: Dosyć, nie mów już do mnie w tej sprawie."
  tags: []
"Pwt3,27":
  text: "Wejdź na szczyt góry Pizga i podnieś oczy na zachód, na północ, na południe i na wschód, i przypatrz się temu własnymi oczami, gdyż nie przejdziesz tego Jordanu;"
  tags: []
"Pwt3,28":
  text: "Ale rozkaż Jozuemu, zachęć go i wzmocnij, gdyż on pójdzie przed tym ludem i on da mu w dziedzictwo ziemię, którą zobaczysz."
  tags: []
"Pwt3,29":
  text: "Mieszkaliśmy więc w dolinie naprzeciw Bet-Peor."
  tags: []
