"Pwt6,1": "A oto przykazania, nakazy i prawa, których PAN, wasz Bóg, nakazał was nauczyć, żebyście je wypełniali w ziemi, do której idziecie, by ją posiąść;"
"Pwt6,2": "Ażebyś bał się PANA, swego Boga, tak byś przestrzegał wszystkich jego nakazów i przykazań, które tobie nakazuję, tobie, twojemu synowi i synowi twego syna, po wszystkie dni twego życia, i aby twoje dni się przedłużyły."
"Pwt6,3": "Słuchaj więc, Izraelu, i pilnuj wypełniania tego, aby dobrze ci się powodziło i żebyście się bardzo rozmnożyli, tak jak obiecał ci PAN, Bóg twoich ojców, w ziemi opływającej mlekiem i miodem."
"Pwt6,4": "Słuchaj, Izraelu! PAN, nasz Bóg, PAN jest jeden."
"Pwt6,5": "Będziesz miłował PANA, swego Boga, całym swym sercem, całą swą duszą i z całej swej siły;"
"Pwt6,6": "A te słowa, które ja dziś nakazuję tobie, będą w twoim sercu;"
"Pwt6,7": "I będziesz je często przypominał swoim synom i rozmawiał o nich, przebywając w swoim domu, idąc drogą, kładąc się i wstając."
"Pwt6,8": "Przywiążesz je jako znak do swoich rąk i będą jako przepaski między twymi oczami."
"Pwt6,9": "Wypiszesz je też na odrzwiach swego domu i na swoich bramach."
"Pwt6,10": "A gdy PAN, twój Bóg, wprowadzi cię do ziemi, którą poprzysiągł twoim ojcom: Abrahamowi, Izaakowi i Jakubowi, że da tobie miasta wielkie i dobre, których nie budowałeś;"
"Pwt6,11": "I wypełnione dobrami domy, których nie napełniałeś, i wykute studnie, których nie wykuwałeś, winnice i ogrody oliwne, których nie sadziłeś; gdy więc będziesz jadł do syta;"
"Pwt6,12": "Strzeż się, abyś nie zapomniał PANA, który cię wyprowadził z ziemi Egiptu, z domu niewoli."
"Pwt6,13": "Będziesz się bał PANA, swego Boga, i będziesz mu służyć, i na jego imię przysięgać."
"Pwt6,14": "Nie pójdziecie za obcymi bogami, za bogami narodów, które są dokoła was;"
"Pwt6,15": "(PAN bowiem, twój Bóg, znajdujący się pośród ciebie, jest Bogiem zazdrosnym), by nie rozpalił się gniew PANA, twego Boga, przeciw tobie i aby nie wytępił cię z powierzchni ziemi."
"Pwt6,16": "Nie będziecie wystawiać na próbę PANA, swojego Boga, tak jak go wystawialiście na próbę w Massa."
"Pwt6,17": "Będziecie pilnie przestrzegać przykazań PANA, swojego Boga, jego świadectw i nakazów, które ci nakazał."
"Pwt6,18": "A czyń to, co jest prawe i dobre w oczach PANA, aby ci się dobrze powodziło, abyś wszedł i posiadł tę dobrą ziemię, którą PAN przysiągł twoim ojcom;"
"Pwt6,19": "Aby wypędzić przed tobą wszystkich twoich wrogów, jak to PAN powiedział."
"Pwt6,20": "A gdy twój syn zapyta cię kiedyś: Co to za świadectwa, nakazy i prawa, które wam nakazał PAN, nasz Bóg?"
"Pwt6,21": "Wtedy powiesz swemu synowi: Byliśmy niewolnikami faraona w Egipcie i PAN wyprowadził nas z Egiptu potężną ręką."
"Pwt6,22": "I na naszych oczach PAN czynił w Egipcie znaki i cuda, wielkie i dotkliwe, nad faraonem i nad całym jego domem."
"Pwt6,23": "Lecz wyprowadził nas stamtąd, aby nas wprowadzić i dać nam tę ziemię, którą przysiągł naszym ojcom."
"Pwt6,24": "I PAN nakazał nam wypełniać wszystkie te nakazy i bać się PANA, naszego Boga, żeby nam się dobrze powodziło po wszystkie dni, aby nas zachować przy życiu, tak jak dziś."
"Pwt6,25": "I będzie to nasza sprawiedliwość, gdy będziemy przestrzegać wszystkich tych przykazań i wypełniać je przed PANEM, naszym Bogiem, tak jak nam nakazał."
