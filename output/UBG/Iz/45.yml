"Iz45,1":
  text: "Tak mówi PAN do swego pomazańca Cyrusa, którego prawicę ująłem, by podbić przed nim narody, rozpinać biodra królów i otworzyć przed nim wrota, a bramy nie będą zamknięte."
  tags: []
"Iz45,2":
  text: "Ja pójdę przed tobą, a krzywe drogi wyprostuję, skruszę spiżowe wrota, a połamię żelazne rygle."
  tags: []
"Iz45,3":
  text: "I dam ci ukryte skarby i bogactwa schowane, abyś poznał, że ja jestem PANEM, Bogiem Izraela, który cię wzywa po imieniu."
  tags: []
"Iz45,4":
  text: "Ze względu na swego sługę Jakuba i Izraela, swego wybrańca, nazwałem cię twoim imieniem, nadałem ci zaszczytny tytuł, chociaż mnie nie znałeś."
  tags: []
"Iz45,5":
  text: "Ja jestem PANEM i nie ma żadnego innego, oprócz mnie nie ma żadnego Boga. Przepasałem cię, chociaż mnie nie znałeś;"
  tags: []
"Iz45,6":
  text: "Aby poznali od wschodu i od zachodu, że nie ma nikogo oprócz mnie. Ja jestem PANEM i nie ma żadnego innego;"
  tags: []
"Iz45,7":
  text: "Ja tworzę światłość i stwarzam ciemność. Czynię pokój i stwarzam nieszczęście. Ja, PAN, czynię to wszystko."
  tags: []
"Iz45,8":
  text: "Niebiosa, spuśćcie rosę z góry i niech obłoki wylewają sprawiedliwość. Niech ziemia się otworzy i niech wyrośnie zbawienie, a razem z nim niech zakwitnie sprawiedliwość. Ja, PAN, to stworzyłem."
  tags: []
"Iz45,9":
  text: "Biada temu, który się spiera ze swoim Stwórcą, będąc skorupą jak inne skorupy gliniane. Czy glina powie swemu garncarzowi: Cóż czynisz? A twoje dzieło: On nie ma rąk?"
  tags: []
"Iz45,10":
  text: "Biada temu, który mówi ojcu: Cóż spłodziłeś? A do kobiety: Cóż urodziłaś?"
  tags: []
"Iz45,11":
  text: "Tak mówi PAN, Święty Izraela i jego Stwórca: Pytajcie mnie o przyszłe rzeczy moich synów i sprawę moich rąk pozostawcie mnie."
  tags: []
"Iz45,12":
  text: "Ja uczyniłem ziemię i stworzyłem na niej człowieka. To ja – moje ręce rozciągnęły niebiosa i całemu ich zastępowi rozkazuję."
  tags: []
"Iz45,13":
  text: "Ja go wzbudziłem w sprawiedliwości i wyprostuję wszystkie jego drogi. On odbuduje moje miasto i wypuści moich więźniów, nie za okup ani za dar, mówi PAN zastępów."
  tags: []
"Iz45,14":
  text: "Tak mówi PAN: Dorobek Egiptu i kupiectwo Etiopii i Sabejczyków, wysocy mężczyźni, przyjdą do ciebie i będą twoi. Pójdą za tobą; przyjdą w pętach, upadną przed tobą i będą błagać, mówiąc: Tylko u ciebie jest Bóg, a nie ma żadnego innego oprócz tego Boga."
  tags: []
"Iz45,15":
  text: "Zaprawdę ty jesteś Bogiem ukrytym, Boże Izraela, Zbawicielu."
  tags: []
"Iz45,16":
  text: "Wszyscy oni się zawstydzą i będą zhańbieni. Razem odejdą w hańbie wytwórcy bożków."
  tags: []
"Iz45,17":
  text: "Ale Izrael będzie zbawiony przez PANA zbawieniem wiecznym. Nie zawstydzicie się ani nie będziecie zhańbieni aż na wieki wieków."
  tags: []
"Iz45,18":
  text: "Bo tak mówi PAN, który stworzył niebiosa, Bóg, który stworzył ziemię i uczynił ją, który ją utwierdził, nie na próżno stworzył ją, lecz na mieszkanie ją utworzył: Ja jestem PANEM i nie ma żadnego innego."
  tags: []
"Iz45,19":
  text: "Nie mówiłem potajemnie, w ciemnym miejscu na ziemi, nie mówiłem do potomstwa Jakuba: Na próżno mnie szukajcie. Ja, PAN, mówię sprawiedliwość i zwiastuję to, co słuszne."
  tags: []
"Iz45,20":
  text: "Zgromadźcie się i przyjdźcie; zbliżcie się razem, wy, którzy ocaleliście spośród narodów. Nic nie wiedzą ci, którzy noszą swoje drewniane bożki i modlą się do boga, który nie może zbawić."
  tags: []
"Iz45,21":
  text: "Oznajmijcie i przyprowadźcie ich, niech naradzają się razem: Kto to od dawna przepowiadał? Kto od tamtego czasu to ogłaszał? Czy nie ja, PAN? A nie ma żadnego innego Boga oprócz mnie. Nie ma Boga sprawiedliwego ani innego Zbawiciela oprócz mnie."
  tags: []
"Iz45,22":
  text: "Spójrzcie na mnie, abyście byli zbawieni, wszystkie krańce ziemi, gdyż ja jestem Bogiem i nie ma żadnego innego."
  tags: []
"Iz45,23":
  text: "Przysiągłem na siebie, z moich ust wyszło słowo sprawiedliwe, które jest nieodwołalne: Przede mną będzie się zginać każde kolano, będzie przysięgać każdy język;"
  tags: []
"Iz45,24":
  text: "Mówiąc: Tylko w PANU mam wszelką sprawiedliwość i siłę. Ci do niego przyjdą, ale będą zhańbieni wszyscy, którzy płoną gniewem przeciwko niemu."
  tags: []
"Iz45,25":
  text: "W PANU będzie usprawiedliwione i będzie się chlubić całe potomstwo Izraela."
  tags: []
