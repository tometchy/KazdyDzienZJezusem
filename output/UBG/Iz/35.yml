"Iz35,1": "Będzie się weselić z tego pustkowie i spieczona ziemia, pustynia rozraduje się i zakwitnie jak róża."
"Iz35,2": "Bujnie zakwitnie i rozweseli się w radości i wśród okrzyków. Chwała Libanu będzie jej dana, ozdoba Karmelu i Szaronu. Ujrzą chwałę PANA i wspaniałość naszego Boga."
"Iz35,3": "Wzmacniajcie osłabłe ręce i posilcie omdlałe kolana."
"Iz35,4": "Mówcie do zatrwożonych w sercu: Bądźcie mocni, nie bójcie się. Oto wasz Bóg przyjdzie z pomstą, z odpłatą przyjdzie sam Bóg i zbawi was."
"Iz35,5": "Wtedy otworzą się oczy ślepych i otworzą się uszy głuchych."
"Iz35,6": "Wtedy chromy podskoczy jak jeleń i język niemych będzie śpiewać. Wytrysną bowiem wody na pustkowiu i potoki na pustyni."
"Iz35,7": "Sucha ziemia stanie się jeziorem i spieczona ziemia – źródłami wód. W kryjówkach smoków, gdzie odpoczywały, urośnie trawa, trzcina i sitowie."
"Iz35,8": "I będzie tam ścieżka i droga, którą nazwą Drogą Świętą. Nie będzie po niej chodził nieczysty, ale będzie ona dla nich. Ci, którzy tą drogą będą chodzić, nawet głupcy, nie zbłądzą."
"Iz35,9": "Nie będzie tam lwa i żaden drapieżny zwierz po niej nie będzie chodził ani się tam nie znajdzie, ale będą chodzić po niej wybawieni."
"Iz35,10": "Odkupieni PANA powrócą i przyjdą na Syjon ze śpiewem, a wieczna radość będzie na ich głowach. Dostąpią radości i wesela, a smutek i wzdychanie znikną."
