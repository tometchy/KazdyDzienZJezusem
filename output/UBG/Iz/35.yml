"Iz35,1":
  text: "Będzie się weselić z tego pustkowie i spieczona ziemia, pustynia rozraduje się i zakwitnie jak róża."
  tags: []
"Iz35,2":
  text: "Bujnie zakwitnie i rozweseli się w radości i wśród okrzyków. Chwała Libanu będzie jej dana, ozdoba Karmelu i Szaronu. Ujrzą chwałę PANA i wspaniałość naszego Boga."
  tags: []
"Iz35,3":
  text: "Wzmacniajcie osłabłe ręce i posilcie omdlałe kolana."
  tags: []
"Iz35,4":
  text: "Mówcie do zatrwożonych w sercu: Bądźcie mocni, nie bójcie się. Oto wasz Bóg przyjdzie z pomstą, z odpłatą przyjdzie sam Bóg i zbawi was."
  tags: []
"Iz35,5":
  text: "Wtedy otworzą się oczy ślepych i otworzą się uszy głuchych."
  tags: []
"Iz35,6":
  text: "Wtedy chromy podskoczy jak jeleń i język niemych będzie śpiewać. Wytrysną bowiem wody na pustkowiu i potoki na pustyni."
  tags: []
"Iz35,7":
  text: "Sucha ziemia stanie się jeziorem i spieczona ziemia – źródłami wód. W kryjówkach smoków, gdzie odpoczywały, urośnie trawa, trzcina i sitowie."
  tags: []
"Iz35,8":
  text: "I będzie tam ścieżka i droga, którą nazwą Drogą Świętą. Nie będzie po niej chodził nieczysty, ale będzie ona dla nich. Ci, którzy tą drogą będą chodzić, nawet głupcy, nie zbłądzą."
  tags: []
"Iz35,9":
  text: "Nie będzie tam lwa i żaden drapieżny zwierz po niej nie będzie chodził ani się tam nie znajdzie, ale będą chodzić po niej wybawieni."
  tags: []
"Iz35,10":
  text: "Odkupieni PANA powrócą i przyjdą na Syjon ze śpiewem, a wieczna radość będzie na ich głowach. Dostąpią radości i wesela, a smutek i wzdychanie znikną."
  tags: []
