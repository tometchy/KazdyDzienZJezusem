"Iz12,1":
  text: "I w tym dniu powiesz: Wysławiać cię będę, PANIE, bo choć gniewałeś się na mnie, odwróciłeś swój gniew i pocieszyłeś mnie."
  tags: []
"Iz12,2":
  text: "Oto Bóg jest moim zbawieniem, zaufam i nie będę się lękał, gdyż JEHOWA BÓG jest moją mocą i moją pieśnią; i on stał się moim zbawieniem."
  tags: []
"Iz12,3":
  text: "Z radością więc będziecie czerpać wodę ze zdrojów zbawienia."
  tags: []
"Iz12,4":
  text: "W tym dniu powiecie: Wysławiajcie PANA, wzywajcie jego imienia, rozgłaszajcie wśród ludów jego dzieła, przypominajcie, że jego imię jest wywyższone."
  tags: []
"Iz12,5":
  text: "Śpiewajcie PANU, gdyż uczynił wielkie rzeczy. Niech będzie o tym wiadomo w całej ziemi."
  tags: []
"Iz12,6":
  text: "Wykrzykuj i śpiewaj, mieszkanko Syjonu! Wielki bowiem jest pośród ciebie Święty Izraela."
  tags: []
