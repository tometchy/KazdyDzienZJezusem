"Iz12,1": "I w tym dniu powiesz: Wysławiać cię będę, PANIE, bo choć gniewałeś się na mnie, odwróciłeś swój gniew i pocieszyłeś mnie."
"Iz12,2": "Oto Bóg jest moim zbawieniem, zaufam i nie będę się lękał, gdyż JEHOWA BÓG jest moją mocą i moją pieśnią; i on stał się moim zbawieniem."
"Iz12,3": "Z radością więc będziecie czerpać wodę ze zdrojów zbawienia."
"Iz12,4": "W tym dniu powiecie: Wysławiajcie PANA, wzywajcie jego imienia, rozgłaszajcie wśród ludów jego dzieła, przypominajcie, że jego imię jest wywyższone."
"Iz12,5": "Śpiewajcie PANU, gdyż uczynił wielkie rzeczy. Niech będzie o tym wiadomo w całej ziemi."
"Iz12,6": "Wykrzykuj i śpiewaj, mieszkanko Syjonu! Wielki bowiem jest pośród ciebie Święty Izraela."
