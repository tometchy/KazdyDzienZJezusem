"Iz52,1":
  text: "Obudź się, obudź się; przyoblecz się w swoją siłę, Syjonie! Przyoblecz się w swą wspaniałą szatę, Jerozolimo, miasto święte! Już bowiem nie wtargnie do ciebie nieobrzezany ani nieczysty."
  tags: []
"Iz52,2":
  text: "Otrząśnij się z prochu, powstań i usiądź, Jerozolimo! Uwolnij się z okowów swojej szyi, pojmana córko Syjonu!"
  tags: []
"Iz52,3":
  text: "Tak bowiem mówi PAN: Za darmo sprzedaliście się i bez pieniędzy zostaniecie odkupieni."
  tags: []
"Iz52,4":
  text: "Tak bowiem mówi Pan BÓG: Mój lud niegdyś wstąpił do Egiptu, aby tam przebywać; ale Asyryjczyk bez przyczyny go trapił."
  tags: []
"Iz52,5":
  text: "A teraz co mam czynić, mówi PAN, skoro mój lud został zabrany bez powodu, a ci, którzy panują nad nim, doprowadzają go do płaczu, mówi PAN, natomiast moje imię nieustannie każdego dnia jest bluźnione?"
  tags: []
"Iz52,6":
  text: "Dlatego mój lud pozna moje imię. Dlatego pozna w tym dniu, że ja jestem tym, który mówi. Oto ja."
  tags: []
"Iz52,7":
  text: "O jak piękne są na górach nogi tego, kto zwiastuje dobre wieści i ogłasza pokój; tego, kto zwiastuje dobro i ogłasza zbawienie, kto mówi do Syjonu: Twój Bóg króluje!"
  tags: []
"Iz52,8":
  text: "Twoi stróże podnoszą głos, tym głosem wspólnie wznoszą okrzyki, bo oko w oko ujrzą, jak PAN przywróci Syjon."
  tags: []
"Iz52,9":
  text: "Wykrzykujcie i śpiewajcie razem, ruiny Jerozolimy! PAN bowiem pocieszył swój lud, odkupił Jerozolimę."
  tags: []
"Iz52,10":
  text: "PAN obnażył swoje święte ramię na oczach wszystkich narodów i wszystkie krańce ziemi zobaczą zbawienie naszego Boga."
  tags: []
"Iz52,11":
  text: "Odstąpcie, odstąpcie, wyjdźcie stamtąd, nieczystego nie dotykajcie; wyjdźcie spośród niego; oczyśćcie się, wy, którzy nosicie naczynia PANA."
  tags: []
"Iz52,12":
  text: "Nie wyjdziecie bowiem w pośpiechu ani nie będziecie uciekać, gdyż PAN pójdzie przed wami, a Bóg Izraela będzie za wami."
  tags: []
"Iz52,13":
  text: "Oto się szczęśliwie powiedzie memu słudze. Będzie on wywyższony, wyniesiony i wielce uwielbiony."
  tags: []
"Iz52,14":
  text: "Jak wielu przeraziło się z jego powodu, że zeszpecono jego wygląd bardziej niż innych ludzi, a jego postać – bardziej niż synów ludzkich;"
  tags: []
"Iz52,15":
  text: "Tak też pokropi wiele narodów, królowie zamkną przed nim swoje usta, dlatego że ujrzą to, czego im nie powiedziano, i zrozumieją to, o czym nie słyszeli."
  tags: []
