"Iz1,1": "Widzenie Izajasza, syna Amosa, dotyczące Judy i Jerozolimy, które miał za dni Uzjasza, Jotama, Achaza i Ezechiasza – królów Judy."
"Iz1,2": "Słuchajcie, niebiosa, a ty, ziemio, nakłoń ucha. PAN bowiem przemówił: Wychowałem i wywyższyłem synów, ale oni zbuntowali się przeciw mnie."
"Iz1,3": "Wół zna swojego gospodarza i osioł żłób swego pana, lecz Izrael mnie nie zna, mój lud się nie zastanawia."
"Iz1,4": "Biada narodowi grzesznemu, ludowi obciążonemu nieprawością, potomstwu złoczyńców, synom powodującym zepsucie! Opuścili PANA, pobudzili do gniewu Świętego Izraela, odwrócili się od niego."
"Iz1,5": "Po co was jeszcze bić, skoro mnożycie przestępstwa? Cała głowa chora, całe serce omdlałe."
"Iz1,6": "Od stopy aż do głowy nie ma w nim nic zdrowego; same rany i sińce, i gnijące rany; nieopatrzone ani nieprzewiązane, ani niezmiękczone olejkiem."
"Iz1,7": "Wasza ziemia jest spustoszona, wasze miasta – spalone ogniem. Waszą ziemię pożerają na waszych oczach cudzoziemcy i pustoszą, jak to zwykli czynić obcy."
"Iz1,8": "I córka Syjonu została jak szałas w winnicy, jak budka w ogrodzie ogórkowym, jak miasto oblężone."
"Iz1,9": "Gdyby PAN zastępów nie zostawił nam malutkiej resztki, bylibyśmy jak Sodoma, stalibyśmy się podobni do Gomory."
"Iz1,10": "Słuchajcie słowa PANA, przywódcy Sodomy! Nakłońcie ucha ku prawu naszego Boga, ludzie Gomory!"
"Iz1,11": "Co mi po mnóstwie waszych ofiar? – mówi PAN. Jestem syty całopaleń baranów i tłuszczu tuczonych zwierząt; nie pragnę krwi cielców, jagniąt i kozłów."
"Iz1,12": "Gdy przychodzicie, by stanąć przede mną, kto od waszych rąk żądał tego, abyście deptali po moich dziedzińcach?"
"Iz1,13": "Nie składajcie już więcej daremnych ofiar. Kadzidło wzbudza we mnie odrazę; nowiów i szabatów, zgromadzeń nie mogę znieść (bo to nieprawość), ani uroczystości."
"Iz1,14": "Waszych nowiów i świąt nienawidzi moja dusza. Stały się dla mnie ciężarem; znużyło mnie ich znoszenie."
"Iz1,15": "Gdy wyciągniecie swoje ręce, skryję swoje oczy przed wami. A gdy będziecie mnożyć modlitwy, nie wysłucham, gdyż wasze ręce są pełne krwi."
"Iz1,16": "Obmyjcie się i oczyśćcie; usuńcie sprzed moich oczu zło waszych uczynków; przestańcie źle czynić."
"Iz1,17": "Uczcie się czynić dobrze; szukajcie tego, co sprawiedliwe, wspomagajcie uciśnionego, brońcie sieroty, wstawiajcie się za wdową."
"Iz1,18": "Chodźcie teraz, a rozsądźmy, mówi PAN: Choćby wasze grzechy były jak szkarłat, jak śnieg wybieleją; choćby były czerwone jak karmazyn, staną się białe jak wełna."
"Iz1,19": "Jeśli będziecie ulegli i posłuszni, będziecie zażywali dóbr ziemi."
"Iz1,20": "Lecz jeśli będziecie nieposłuszni i uparci, miecz was pożre. Tak bowiem wyrzekły usta PANA."
"Iz1,21": "Jakże to wierne miasto stało się nierządnicą! Niegdyś pełne sądu; mieszkała w nim sprawiedliwość, lecz teraz – mordercy."
"Iz1,22": "Twoje srebro zamieniło się w żużel, twoje wino zmieszane z wodą."
"Iz1,23": "Twoi książęta są buntownikami i wspólnikami złodziei. Każdy z nich kocha dary, goni za nagrodą; sierocie nie wymierzają sprawiedliwości, a sprawa wdowy do nich nie dociera."
"Iz1,24": "Dlatego mówi Pan, PAN zastępów, Mocarz Izraela: Biada! Ulżę sobie od swoich przeciwników i zemszczę się na moich wrogach."
"Iz1,25": "I zwrócę moją rękę przeciwko tobie, wypalę twój żużel i usunę całą twoją cynę."
"Iz1,26": "I przywrócę twoich sędziów, tak jak dawniej, i twoich doradców, jak na początku. Potem nazwą cię Miastem Sprawiedliwości, Miastem Wiernym."
"Iz1,27": "Syjon zostanie odkupiony przez sąd, a jego nawróceni – przez sprawiedliwość."
"Iz1,28": "Ale przestępcy i grzesznicy będą razem starci, a ci, którzy opuścili PANA, zginą."
"Iz1,29": "Będziecie bowiem zawstydzeni z powodu dębów, których pożądaliście, i zarumienicie się z powodu ogrodów, które sobie wybraliście."
"Iz1,30": "Staniecie się bowiem jak dąb, którego liście zwiędły, i jak ogród, w którym nie ma wody."
"Iz1,31": "I mocarz będzie jak paździerz, a ten, który go uczynił – jak iskra; i zapłoną obaj razem, a nie będzie nikogo, kto by ich ugasił."
