"Iz1,1":
  text: "Widzenie Izajasza, syna Amosa, dotyczące Judy i Jerozolimy, które miał za dni Uzjasza, Jotama, Achaza i Ezechiasza – królów Judy."
  tags: []
"Iz1,2":
  text: "Słuchajcie, niebiosa, a ty, ziemio, nakłoń ucha. PAN bowiem przemówił: Wychowałem i wywyższyłem synów, ale oni zbuntowali się przeciw mnie."
  tags: []
"Iz1,3":
  text: "Wół zna swojego gospodarza i osioł żłób swego pana, lecz Izrael mnie nie zna, mój lud się nie zastanawia."
  tags: []
"Iz1,4":
  text: "Biada narodowi grzesznemu, ludowi obciążonemu nieprawością, potomstwu złoczyńców, synom powodującym zepsucie! Opuścili PANA, pobudzili do gniewu Świętego Izraela, odwrócili się od niego."
  tags: []
"Iz1,5":
  text: "Po co was jeszcze bić, skoro mnożycie przestępstwa? Cała głowa chora, całe serce omdlałe."
  tags: []
"Iz1,6":
  text: "Od stopy aż do głowy nie ma w nim nic zdrowego; same rany i sińce, i gnijące rany; nieopatrzone ani nieprzewiązane, ani niezmiękczone olejkiem."
  tags: []
"Iz1,7":
  text: "Wasza ziemia jest spustoszona, wasze miasta – spalone ogniem. Waszą ziemię pożerają na waszych oczach cudzoziemcy i pustoszą, jak to zwykli czynić obcy."
  tags: []
"Iz1,8":
  text: "I córka Syjonu została jak szałas w winnicy, jak budka w ogrodzie ogórkowym, jak miasto oblężone."
  tags: []
"Iz1,9":
  text: "Gdyby PAN zastępów nie zostawił nam malutkiej resztki, bylibyśmy jak Sodoma, stalibyśmy się podobni do Gomory."
  tags: []
"Iz1,10":
  text: "Słuchajcie słowa PANA, przywódcy Sodomy! Nakłońcie ucha ku prawu naszego Boga, ludzie Gomory!"
  tags: []
"Iz1,11":
  text: "Co mi po mnóstwie waszych ofiar? – mówi PAN. Jestem syty całopaleń baranów i tłuszczu tuczonych zwierząt; nie pragnę krwi cielców, jagniąt i kozłów."
  tags: []
"Iz1,12":
  text: "Gdy przychodzicie, by stanąć przede mną, kto od waszych rąk żądał tego, abyście deptali po moich dziedzińcach?"
  tags: []
"Iz1,13":
  text: "Nie składajcie już więcej daremnych ofiar. Kadzidło wzbudza we mnie odrazę; nowiów i szabatów, zgromadzeń nie mogę znieść (bo to nieprawość), ani uroczystości."
  tags: []
"Iz1,14":
  text: "Waszych nowiów i świąt nienawidzi moja dusza. Stały się dla mnie ciężarem; znużyło mnie ich znoszenie."
  tags: []
"Iz1,15":
  text: "Gdy wyciągniecie swoje ręce, skryję swoje oczy przed wami. A gdy będziecie mnożyć modlitwy, nie wysłucham, gdyż wasze ręce są pełne krwi."
  tags: []
"Iz1,16":
  text: "Obmyjcie się i oczyśćcie; usuńcie sprzed moich oczu zło waszych uczynków; przestańcie źle czynić."
  tags: []
"Iz1,17":
  text: "Uczcie się czynić dobrze; szukajcie tego, co sprawiedliwe, wspomagajcie uciśnionego, brońcie sieroty, wstawiajcie się za wdową."
  tags: []
"Iz1,18":
  text: "Chodźcie teraz, a rozsądźmy, mówi PAN: Choćby wasze grzechy były jak szkarłat, jak śnieg wybieleją; choćby były czerwone jak karmazyn, staną się białe jak wełna."
  tags: []
"Iz1,19":
  text: "Jeśli będziecie ulegli i posłuszni, będziecie zażywali dóbr ziemi."
  tags: []
"Iz1,20":
  text: "Lecz jeśli będziecie nieposłuszni i uparci, miecz was pożre. Tak bowiem wyrzekły usta PANA."
  tags: []
"Iz1,21":
  text: "Jakże to wierne miasto stało się nierządnicą! Niegdyś pełne sądu; mieszkała w nim sprawiedliwość, lecz teraz – mordercy."
  tags: []
"Iz1,22":
  text: "Twoje srebro zamieniło się w żużel, twoje wino zmieszane z wodą."
  tags: []
"Iz1,23":
  text: "Twoi książęta są buntownikami i wspólnikami złodziei. Każdy z nich kocha dary, goni za nagrodą; sierocie nie wymierzają sprawiedliwości, a sprawa wdowy do nich nie dociera."
  tags: []
"Iz1,24":
  text: "Dlatego mówi Pan, PAN zastępów, Mocarz Izraela: Biada! Ulżę sobie od swoich przeciwników i zemszczę się na moich wrogach."
  tags: []
"Iz1,25":
  text: "I zwrócę moją rękę przeciwko tobie, wypalę twój żużel i usunę całą twoją cynę."
  tags: []
"Iz1,26":
  text: "I przywrócę twoich sędziów, tak jak dawniej, i twoich doradców, jak na początku. Potem nazwą cię Miastem Sprawiedliwości, Miastem Wiernym."
  tags: []
"Iz1,27":
  text: "Syjon zostanie odkupiony przez sąd, a jego nawróceni – przez sprawiedliwość."
  tags: []
"Iz1,28":
  text: "Ale przestępcy i grzesznicy będą razem starci, a ci, którzy opuścili PANA, zginą."
  tags: []
"Iz1,29":
  text: "Będziecie bowiem zawstydzeni z powodu dębów, których pożądaliście, i zarumienicie się z powodu ogrodów, które sobie wybraliście."
  tags: []
"Iz1,30":
  text: "Staniecie się bowiem jak dąb, którego liście zwiędły, i jak ogród, w którym nie ma wody."
  tags: []
"Iz1,31":
  text: "I mocarz będzie jak paździerz, a ten, który go uczynił – jak iskra; i zapłoną obaj razem, a nie będzie nikogo, kto by ich ugasił."
  tags: []
