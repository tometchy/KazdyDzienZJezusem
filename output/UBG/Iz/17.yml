"Iz17,1":
  text: "Brzemię Damaszku. Oto Damaszek przestanie być miastem, a stanie się rumowiskiem."
  tags: []
"Iz17,2":
  text: "Miasta Aroeru będą opuszczone. Będą dla trzód, by się tam kładły, a nikt ich nie spłoszy."
  tags: []
"Iz17,3":
  text: "Nastąpi koniec twierdzy Efraima i królestwa Damaszku. A z resztką Syrii będzie jak z chwałą synów Izraela, mówi PAN zastępów."
  tags: []
"Iz17,4":
  text: "I stanie się w tym dniu tak, że chwała Jakuba zmaleje, a jego tłuste ciało schudnie."
  tags: []
"Iz17,5":
  text: "I będzie tak jak wtedy, gdy żniwiarz zbiera zboże, a jego ramię ścina kłosy; będzie jak ten, co zbiera kłosy w dolinie Refaim."
  tags: []
"Iz17,6":
  text: "Pozostanie na nim jednak pokłosie, jak przy otrząsaniu drzewa oliwnego: dwie lub trzy oliwki zostaną na samym wierzchołku drzewa, a cztery lub pięć na urodzajnych gałęziach, mówi PAN, Bóg Izraela."
  tags: []
"Iz17,7":
  text: "W tym dniu człowiek spojrzy na swego Stwórcę i jego oczy będą spoglądać na Świętego Izraela."
  tags: []
"Iz17,8":
  text: "A nie popatrzy więcej na ołtarze, dzieło swoich rąk, ani nie będzie patrzeć na to, co uczyniły jego palce ani na gaje, ani na posągi."
  tags: []
"Iz17,9":
  text: "W tym dniu jego miasta warowne będą jak porzucony konar i sucha gałąź, które opuścili przed synami Izraela – i będzie spustoszenie."
  tags: []
"Iz17,10":
  text: "A ponieważ zapomniałeś o Bogu twojego zbawienia i nie pamiętałeś o skale twojej mocy, to choć zasadzasz rozkoszne sadzonki i sadzisz obce winorośle;"
  tags: []
"Iz17,11":
  text: "I w dniu sprawiasz, że sadzonka rośnie, i rano doprowadzasz swój siew do rozkwitu, w dniu żniwa będziesz żąć mnóstwo smutku i nieuleczalnej rozpaczy."
  tags: []
"Iz17,12":
  text: "Biada tłumom licznych ludów, które huczą jak rozhukane morze, i zgiełkowi narodów, które szumią jak szum wód gwałtownych!"
  tags: []
"Iz17,13":
  text: "Narody szumią jak szum wielkich wód, ale PAN je zgromi i uciekną daleko gnane wiatrem jak plewy na górach i jak biegacz stepowy przed wichurą."
  tags: []
"Iz17,14":
  text: "Oto w porze wieczornej trwoga, a nim nadejdzie poranek, już go nie ma. Taki jest dział tych, którzy nas łupią, i los tych, którzy nas plądrują."
  tags: []
