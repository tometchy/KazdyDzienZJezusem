"Iz10,1":
  text: "Biada tym, którzy wydają niesprawiedliwe ustawy, i tym, którzy wypisują dekrety ucisku;"
  tags: []
"Iz10,2":
  text: "Aby odepchnąć ubogiego od sądu i pozbawić sprawiedliwości ubogich mego ludu, aby wdowy stały się ich łupem i aby mogli ograbiać sieroty."
  tags: []
"Iz10,3":
  text: "A co uczynicie w dniu nawiedzenia i spustoszenia, który przyjdzie z daleka? Do kogo będziecie uciekać się o pomoc? I gdzie zostawicie swoją chwałę?"
  tags: []
"Iz10,4":
  text: "Beze mnie skulą się wśród więźniów, upadną wśród zabitych. Mimo tego wszystkiego jego gniew nie ustał, ale jego ręka jest jeszcze wyciągnięta."
  tags: []
"Iz10,5":
  text: "Ach, Asyryjczyk, rózga mego gniewu; w jego ręku jest kij mojego oburzenia."
  tags: []
"Iz10,6":
  text: "Wyślę go przeciw obłudnemu narodowi, przeciw ludowi mojego gniewu przykażę mu, aby zebrał łup i zdobycz, aby zdeptał go, jak błoto na ulicach."
  tags: []
"Iz10,7":
  text: "Lecz on nie tak będzie mniemał i jego serce nie będzie tak myślało, ponieważ w swoim sercu umyślił wytracić i wytępić niemało narodów."
  tags: []
"Iz10,8":
  text: "Mówi bowiem: Czyż moi książęta nie są królami?"
  tags: []
"Iz10,9":
  text: "Czy Kalno nie jest jak Karkemisz? Czy Chamat nie jest jak Arpad? Czy Samaria nie jest jak Damaszek?"
  tags: []
"Iz10,10":
  text: "Jak moja ręka dosięgła królestw bożków, chociaż ich bożki przewyższały te w Jerozolimie i Samarii;"
  tags: []
"Iz10,11":
  text: "Czyż nie uczynię z Jerozolimą i jej bożkami tak, jak uczyniłem z Samarią i jej bożkami?"
  tags: []
"Iz10,12":
  text: "I stanie się, że gdy Pan dokona całego swojego dzieła nad górą Syjonu i nad Jerozolimą, ukarzę owoc wyniosłego serca króla Asyrii i pychę jego zuchwałych oczu."
  tags: []
"Iz10,13":
  text: "Mówi bowiem: Dokonałem tego mocą swojej ręki i własną mądrością, bo jestem mądry. Zniosłem granice narodów, zabrałem ich skarby i powaliłem mieszkańców jak mocarz."
  tags: []
"Iz10,14":
  text: "Moja ręka sięgnęła po bogactwo narodów jak do gniazda. A jak się zbiera porzucone jajka, tak ja zgarnąłem całą ziemię; i nikt nawet skrzydłem nie poruszył, nie otworzył dzioba ani nie pisnął."
  tags: []
"Iz10,15":
  text: "Czy chełpi się siekiera wobec tego, który nią rąbie? Czy wynosi się piła nad tego, który nią piłuje? Jak gdyby rózga wywijała tym, który ją podnosi, jak gdyby kij podnosił się, jakby nie był drewnem."
  tags: []
"Iz10,16":
  text: "Dlatego Pan, PAN zastępów, ześle wycieńczenie na jego opasłych, a pod jego chwałą rozpali ogień, jakby płonący ogień."
  tags: []
"Iz10,17":
  text: "A Światłość Izraela będzie ogniem, a jego Święty – płomieniem, który spali i strawi jego ciernie i osty w jednym dniu."
  tags: []
"Iz10,18":
  text: "Strawi także wspaniałość jego lasu i urodzajnych pól, od duszy aż do ciała, i stanie się tak jak wtedy, gdy chorąży ucieka ze strachu."
  tags: []
"Iz10,19":
  text: "A pozostałych drzew jego lasu będzie tak niewiele, że nawet dziecko będzie mogło je spisać."
  tags: []
"Iz10,20":
  text: "I w tym dniu stanie się, że resztka Izraela i ci, którzy ocaleli z domu Jakuba, nie będą już polegać na tym, który ich bije, lecz będą prawdziwie polegać na PANU, Świętym Izraela."
  tags: []
"Iz10,21":
  text: "Resztka zawróci, resztka Jakuba, do Boga mocnego."
  tags: []
"Iz10,22":
  text: "Bo choćby twój lud, Izraelu, był jak piasek morski, tylko resztka z niego powróci. Postanowione wytracenie będzie opływało w sprawiedliwość."
  tags: []
"Iz10,23":
  text: "Pan BÓG zastępów dokona bowiem postanowionego wytracenia pośród całej tej ziemi."
  tags: []
"Iz10,24":
  text: "Dlatego tak mówi Pan BÓG zastępów: Mój ludu, który mieszkasz na Syjonie, nie bój się Asyryjczyka. Uderzy cię rózgą i swą laskę podniesie na ciebie, tak jak Egipt."
  tags: []
"Iz10,25":
  text: "Jeszcze chwila bowiem, a skończy się mój gniew i moja zapalczywość – ku ich zniszczeniu."
  tags: []
"Iz10,26":
  text: "I PAN zastępów wzbudzi bicz na niego, jak podczas porażki Midianitów przy skale Oreba, i podniesie swą laskę tak, jak ją podniósł nad morzem, w Egipcie."
  tags: []
"Iz10,27":
  text: "I stanie się w tym dniu, że jego brzemię zostanie zdjęte z twoich ramion i jego jarzmo z twojej szyi, a to jarzmo zostanie zniszczone z powodu namaszczenia."
  tags: []
"Iz10,28":
  text: "Przybył do Ajjat, przeszedł przez Migron, w Mikmas zostawił swój oręż."
  tags: []
"Iz10,29":
  text: "Przeszli przełęcz, w Geba zanocowali; zlękła się Rama, uciekła Gibea Saula."
  tags: []
"Iz10,30":
  text: "Podnieś swój głos, córko Gallim! Niech słyszą w Laisz, biedny Anatot!"
  tags: []
"Iz10,31":
  text: "Madmena ustąpiła, mieszkańcy Gabim szykują się do ucieczki."
  tags: []
"Iz10,32":
  text: "Jeszcze przez dzień zostanie w Nob, potrząśnie swoją ręką przeciwko córce Syjonu, wzgórzu Jerozolimy."
  tags: []
"Iz10,33":
  text: "Oto Pan, PAN zastępów odetnie latorośle gwałtownie. Wznoszące się wysoko zostaną ścięte, a wyniosłe będą poniżone."
  tags: []
"Iz10,34":
  text: "Wytnie także gęstwiny lasu siekierą, a Liban upadnie od wielmożnego."
  tags: []
