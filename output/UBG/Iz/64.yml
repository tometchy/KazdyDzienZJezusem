"Iz64,1":
  text: "Obyś rozdarł niebiosa i zstąpił, aby góry rozpłynęły się przed tobą;"
  tags: []
"Iz64,2":
  text: "Jak płonie ogień rozżarzony, ogień, który doprowadza wodę do wrzenia, abyś oznajmił swoje imię twoim wrogom, tak by narody zadrżały przed tobą;"
  tags: []
"Iz64,3":
  text: "Jak kiedyś, gdy czyniłeś rzeczy przedziwne, których się nie spodziewaliśmy; zstąpiłeś, a góry rozpływały się przed tobą!"
  tags: []
"Iz64,4":
  text: "Czego od początku świata nie słyszano ani do uszu nie dochodziło, ani oko nie widziało oprócz ciebie samego, Boże, który by tak uczynił dla tego, który go oczekuje."
  tags: []
"Iz64,5":
  text: "Wychodzisz naprzeciw radosnego i czyniącego sprawiedliwość, i tych, którzy krocząc po twoich drogach pamiętają o tobie. Oto się rozgniewałeś, gdyż grzeszyliśmy ustawicznie, nie krocząc po tych drogach, lecz będziemy zbawieni."
  tags: []
"Iz64,6":
  text: "My wszyscy jednak jesteśmy jak nieczyści, a wszystkie nasze sprawiedliwości są jak szata splugawiona; wszyscy opadliśmy jak liść, a nasze nieprawości uniosły nas jak wiatr."
  tags: []
"Iz64,7":
  text: "I nie ma nikogo, kto by wzywał twego imienia i zbudził się, aby się ciebie chwycić. Zakryłeś bowiem swoje oblicze przed nami i sprawiłeś, że niszczejemy z powodu naszych nieprawości."
  tags: []
"Iz64,8":
  text: "Ale teraz, PANIE, ty jesteś naszym ojcem, my jesteśmy gliną, a ty jesteś naszym garncarzem; i jesteśmy wszyscy dziełem twojej ręki."
  tags: []
"Iz64,9":
  text: "Nie gniewaj się, PANIE, tak bardzo i nie pamiętaj o naszych nieprawościach na wieki. Oto spójrz, prosimy, my wszyscy jesteśmy twoim ludem."
  tags: []
"Iz64,10":
  text: "Twoje święte miasta zostały obrócone w pustynię, Syjon jest pustynią, Jerozolima stała się spustoszeniem."
  tags: []
"Iz64,11":
  text: "Nasz dom, święty i wspaniały, w którym cię chwalili nasi ojcowie, został spalony w ogniu, i wszystkie nasze najkosztowniejsze rzeczy leżą w gruzach."
  tags: []
"Iz64,12":
  text: "Czy wobec tego powstrzymasz się, PANIE? Czy będziesz milczeć i tak bardzo nas trapić?"
  tags: []
