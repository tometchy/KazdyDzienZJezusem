"Iz34,1":
  text: "Zbliżcie się, narody, aby słuchać, i wy, ludy, słuchajcie uważnie! Niech słucha ziemia i to, co ją napełnia, świat i wszystko, co się na nim rodzi."
  tags: []
"Iz34,2":
  text: "Bo oburzenie PANA spadło na wszystkie narody, jego zapalczywość – na wszystkie ich wojska. Wytracił je doszczętnie, wydał je na rzeź."
  tags: []
"Iz34,3":
  text: "Ich zabici będą porzuceni, a z ich trupów będzie unosił się smród i ich krew z gór popłynie."
  tags: []
"Iz34,4":
  text: "Cały zastęp niebios stopnieje, a niebiosa jak zwój zostaną zwinięte, całe ich zastępy opadną, jak opada liść z winorośli i jak opada niedojrzały owoc z drzewa figowego."
  tags: []
"Iz34,5":
  text: "Mój miecz bowiem nasyci się na niebie. Oto spadnie na Edom i na lud, który przekląłem, na sąd."
  tags: []
"Iz34,6":
  text: "Miecz PANA jest pełny krwi, pokrył się tłuszczem i krwią baranków i kozłów, tłuszczem nerek baranich, bo ofiara PANA dokonuje się w Bosra, a wielka rzeź w ziemi Edom."
  tags: []
"Iz34,7":
  text: "Zstąpią z nimi jednorożce i byki z wołami, ich ziemia nasiąknie krwią, a ich proch nasyci się tłuszczem."
  tags: []
"Iz34,8":
  text: "To jest bowiem dzień pomsty PANA i rok odpłaty za spór z Syjonem."
  tags: []
"Iz34,9":
  text: "Potoki obrócą się w smołę, a proch w siarkę, jego ziemia stanie się smołą płonącą."
  tags: []
"Iz34,10":
  text: "Nie zagaśnie ani w nocy, ani w dzień, jej dym będzie się unosił na wieki. Z pokolenia na pokolenie będzie pustkowiem; na wieki wieków nikt przez nią nie przejdzie."
  tags: []
"Iz34,11":
  text: "Ale pelikan i bąk ją posiądą, a sowa i kruk w niej zamieszkają. Rozciągnie on nad nią sznur spustoszenia i próżne wagi."
  tags: []
"Iz34,12":
  text: "Wezwą jej szlachtę na królestwo, ale nie będzie tam żadnego, a wszyscy jej książęta obrócą się wniwecz."
  tags: []
"Iz34,13":
  text: "W ich pałacach wyrosną ciernie, w ich zamkach – pokrzywy i osty. Będzie siedliskiem smoków i dziedzińcem dla strusiów."
  tags: []
"Iz34,14":
  text: "Tam będą się spotykać dzikie zwierzęta pustyni ze strasznymi bestiami wysp, a kozice będą się nawoływać; tam leżeć będzie płomykówka i znajdzie dla siebie odpoczynek."
  tags: []
"Iz34,15":
  text: "Tam sowa się zagnieździ, zniesie jajka, wyleży młode i zbierze je w swoim cieniu. Tam też zlecą się sępy, jeden z drugim."
  tags: []
"Iz34,16":
  text: "Szukajcie w księdze PANA i czytajcie. Ani jedno z nich nie przepadnie, żadne z nich nie będzie bez drugiego, bo usta PANA to rozkazały, a jego Duch je zgromadził."
  tags: []
"Iz34,17":
  text: "On też rzucił dla nich los i jego ręka wydzieliła im to sznurem mierniczym. Posiadać ją będą na wieki, będą w niej mieszkać z pokolenia na pokolenie."
  tags: []
