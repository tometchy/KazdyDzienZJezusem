"Iz42,1":
  text: "Oto mój sługa, którego wspieram, mój wybrany, którego sobie upodobała moja dusza. Dałem mu swojego Ducha, on przyniesie narodom sąd."
  tags: []
"Iz42,2":
  text: "Nie będzie wołał ani się wywyższał, nie będzie słychać jego głosu na ulicy."
  tags: []
"Iz42,3":
  text: "Trzciny nadłamanej nie złamie, a knota tlącego się nie zagasi. Wyda sąd według prawdy."
  tags: []
"Iz42,4":
  text: "Nie ustanie ani się nie zniechęci, dopóki nie utrwali sądu na ziemi, a jego prawa będą oczekiwać wyspy."
  tags: []
"Iz42,5":
  text: "Tak mówi Bóg, PAN, który stworzył niebiosa i je rozpostarł; który rozszerzył ziemię i to, co się z niej rodzi; który daje tchnienie ludziom mieszkającym na niej i ducha tym, co po niej chodzą."
  tags: []
"Iz42,6":
  text: "Ja, PAN, wezwałem cię w sprawiedliwości i ująłem cię za rękę, będę cię strzegł i dam cię jako przymierze dla ludu, jako światłość dla narodów;"
  tags: []
"Iz42,7":
  text: "Abyś otwierał oczy ślepym, wyprowadził więźniów z ciemnicy i z więzienia tych, co siedzą w ciemności."
  tags: []
"Iz42,8":
  text: "Ja, PAN, to jest moje imię, a mojej chwały nie oddam innemu ani mojej czci – rzeźbionym posągom."
  tags: []
"Iz42,9":
  text: "Oto nastąpiły pierwsze rzeczy, a ja ogłaszam nowe; zanim się zaczną, dam wam o nich słyszeć."
  tags: []
"Iz42,10":
  text: "Śpiewajcie PANU nową pieśń, jego chwałę od krańców ziemi, wy, którzy się w morzu pławicie, i wszystko, co w nim jest, wyspy i ich mieszkańcy."
  tags: []
"Iz42,11":
  text: "Niech podniosą głos pustynia i jej miasta oraz wsie, w których mieszka Kedar. Niech wykrzykują mieszkańcy skały, niech wołają ze szczytu gór."
  tags: []
"Iz42,12":
  text: "Oddajcie cześć PANU i głoście jego chwałę na wyspach."
  tags: []
"Iz42,13":
  text: "PAN wyruszy jak mocarz, jak mąż waleczny wzbudzi swoją gorliwość. Zawoła, nawet zagrzmi i odniesie zwycięstwo nad swoimi wrogami;"
  tags: []
"Iz42,14":
  text: "Mówiąc: Milczałem dość długo, w spokoju wstrzymywałem się; ale teraz będę krzyczeć jak rodząca, spustoszę i pożrę wszystkich razem."
  tags: []
"Iz42,15":
  text: "Góry i pagórki zamienię w pustynię i całą ich zieleń wysuszę. Zamienię rzeki w wyspy, a jeziora wysuszę."
  tags: []
"Iz42,16":
  text: "Powiodę ślepych drogą, której nie znali, poprowadzę ich ścieżkami, o których nie wiedzieli. Ciemność zamienię w światłość przed nimi, a miejsca nierówne – w równinę. To są rzeczy, które dla nich uczynię, a nie opuszczę ich."
  tags: []
"Iz42,17":
  text: "Cofną się i bardzo zawstydzą się ci, którzy ufają rzeźbionym posągom, którzy mówią odlanym posągom: Wy jesteście naszymi bogami."
  tags: []
"Iz42,18":
  text: "O głusi, słuchajcie! Wy, ślepi, przejrzyjcie, abyście widzieli."
  tags: []
"Iz42,19":
  text: "Kto jest ślepy, jeśli nie mój sługa, i głuchy, jeśli nie mój posłaniec, którego posłałem? Kto jest tak ślepy jak ten, który jest doskonały, kto tak ślepy jak sługa PANA?"
  tags: []
"Iz42,20":
  text: "Widzi wiele rzeczy, lecz nie zważa na nie; otwarte ma uszy, ale nie słucha."
  tags: []
"Iz42,21":
  text: "PAN go sobie upodobał ze względu na swoją sprawiedliwość; wywyższy prawo i uczyni je sławnym."
  tags: []
"Iz42,22":
  text: "Ale ten lud jest złupiony i ograbiony, wszyscy spętani są w ciemnicach; wydani są na łup, a nie ma nikogo, kto by ich wybawił; wydani są na rabunek, a nikt nie mówi: Oddaj."
  tags: []
"Iz42,23":
  text: "Kto z was nakłoni na to ucha? Kto usłyszy i posłucha na przyszły czas?"
  tags: []
"Iz42,24":
  text: "Kto wydał Jakuba na rabunek, a Izraela łupieżcom? Czy nie PAN, przeciwko któremu zgrzeszyliśmy? Nie chcieli bowiem kroczyć jego drogami ani słuchać jego prawa."
  tags: []
"Iz42,25":
  text: "Dlatego PAN wylał na niego zapalczywość swego gniewu i gwałtowną wojnę. Rozgorzała wokół niego, lecz on tego nie poznał, paliła go, ale nie wziął tego do serca."
  tags: []
