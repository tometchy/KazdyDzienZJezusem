"Iz42,1": "Oto mój sługa, którego wspieram, mój wybrany, którego sobie upodobała moja dusza. Dałem mu swojego Ducha, on przyniesie narodom sąd."
"Iz42,2": "Nie będzie wołał ani się wywyższał, nie będzie słychać jego głosu na ulicy."
"Iz42,3": "Trzciny nadłamanej nie złamie, a knota tlącego się nie zagasi. Wyda sąd według prawdy."
"Iz42,4": "Nie ustanie ani się nie zniechęci, dopóki nie utrwali sądu na ziemi, a jego prawa będą oczekiwać wyspy."
"Iz42,5": "Tak mówi Bóg, PAN, który stworzył niebiosa i je rozpostarł; który rozszerzył ziemię i to, co się z niej rodzi; który daje tchnienie ludziom mieszkającym na niej i ducha tym, co po niej chodzą."
"Iz42,6": "Ja, PAN, wezwałem cię w sprawiedliwości i ująłem cię za rękę, będę cię strzegł i dam cię jako przymierze dla ludu, jako światłość dla narodów;"
"Iz42,7": "Abyś otwierał oczy ślepym, wyprowadził więźniów z ciemnicy i z więzienia tych, co siedzą w ciemności."
"Iz42,8": "Ja, PAN, to jest moje imię, a mojej chwały nie oddam innemu ani mojej czci – rzeźbionym posągom."
"Iz42,9": "Oto nastąpiły pierwsze rzeczy, a ja ogłaszam nowe; zanim się zaczną, dam wam o nich słyszeć."
"Iz42,10": "Śpiewajcie PANU nową pieśń, jego chwałę od krańców ziemi, wy, którzy się w morzu pławicie, i wszystko, co w nim jest, wyspy i ich mieszkańcy."
"Iz42,11": "Niech podniosą głos pustynia i jej miasta oraz wsie, w których mieszka Kedar. Niech wykrzykują mieszkańcy skały, niech wołają ze szczytu gór."
"Iz42,12": "Oddajcie cześć PANU i głoście jego chwałę na wyspach."
"Iz42,13": "PAN wyruszy jak mocarz, jak mąż waleczny wzbudzi swoją gorliwość. Zawoła, nawet zagrzmi i odniesie zwycięstwo nad swoimi wrogami;"
"Iz42,14": "Mówiąc: Milczałem dość długo, w spokoju wstrzymywałem się; ale teraz będę krzyczeć jak rodząca, spustoszę i pożrę wszystkich razem."
"Iz42,15": "Góry i pagórki zamienię w pustynię i całą ich zieleń wysuszę. Zamienię rzeki w wyspy, a jeziora wysuszę."
"Iz42,16": "Powiodę ślepych drogą, której nie znali, poprowadzę ich ścieżkami, o których nie wiedzieli. Ciemność zamienię w światłość przed nimi, a miejsca nierówne – w równinę. To są rzeczy, które dla nich uczynię, a nie opuszczę ich."
"Iz42,17": "Cofną się i bardzo zawstydzą się ci, którzy ufają rzeźbionym posągom, którzy mówią odlanym posągom: Wy jesteście naszymi bogami."
"Iz42,18": "O głusi, słuchajcie! Wy, ślepi, przejrzyjcie, abyście widzieli."
"Iz42,19": "Kto jest ślepy, jeśli nie mój sługa, i głuchy, jeśli nie mój posłaniec, którego posłałem? Kto jest tak ślepy jak ten, który jest doskonały, kto tak ślepy jak sługa PANA?"
"Iz42,20": "Widzi wiele rzeczy, lecz nie zważa na nie; otwarte ma uszy, ale nie słucha."
"Iz42,21": "PAN go sobie upodobał ze względu na swoją sprawiedliwość; wywyższy prawo i uczyni je sławnym."
"Iz42,22": "Ale ten lud jest złupiony i ograbiony, wszyscy spętani są w ciemnicach; wydani są na łup, a nie ma nikogo, kto by ich wybawił; wydani są na rabunek, a nikt nie mówi: Oddaj."
"Iz42,23": "Kto z was nakłoni na to ucha? Kto usłyszy i posłucha na przyszły czas?"
"Iz42,24": "Kto wydał Jakuba na rabunek, a Izraela łupieżcom? Czy nie PAN, przeciwko któremu zgrzeszyliśmy? Nie chcieli bowiem kroczyć jego drogami ani słuchać jego prawa."
"Iz42,25": "Dlatego PAN wylał na niego zapalczywość swego gniewu i gwałtowną wojnę. Rozgorzała wokół niego, lecz on tego nie poznał, paliła go, ale nie wziął tego do serca."
