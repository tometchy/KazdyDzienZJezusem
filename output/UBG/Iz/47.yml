"Iz47,1":
  text: "Zstąp i usiądź w prochu, dziewico, córko Babilonu! Siądź na ziemi, a nie na tronie, córko chaldejska, gdyż już cię nie będą nazywać delikatną i rozkoszną."
  tags: []
"Iz47,2":
  text: "Weź żarna i miel mąkę, odkryj swoje warkocze, obnaż nogi, odkryj uda, brnij przez rzeki."
  tags: []
"Iz47,3":
  text: "Twoja nagość będzie odkryta i twoja hańba będzie widoczna. Dokonam pomsty, żaden człowiek mnie nie powstrzyma."
  tags: []
"Iz47,4":
  text: "Tak mówi nasz Odkupiciel, jego imię to PAN zastępów, Święty Izraela."
  tags: []
"Iz47,5":
  text: "Usiądź w milczeniu i wejdź w ciemności, córko chaldejska, bo już nie będą cię nazywali panią królestw."
  tags: []
"Iz47,6":
  text: "Rozgniewałem się na mój lud, splugawiłem moje dziedzictwo i oddałem je w twoje ręce, ale ty nie okazałaś im miłosierdzia i starców niezmiernie obciążyłaś swoim jarzmem."
  tags: []
"Iz47,7":
  text: "I powiedziałaś: Będę panią na wieki. I nie wzięłaś sobie tego do serca ani nie pamiętałaś o tym, jakie będzie tego zakończenie."
  tags: []
"Iz47,8":
  text: "Dlatego słuchaj teraz, rozkosznico, która mieszkasz bezpiecznie i mówisz w swoim sercu: Ja jestem i nie ma oprócz mnie żadnej innej, nie będę wdową ani nie zaznam bezdzietności!"
  tags: []
"Iz47,9":
  text: "Lecz obie te rzeczy spadną na ciebie nagle, w jednym dniu: bezdzietność i wdowieństwo. W pełni spadną na ciebie z powodu mnóstwa twoich guseł i z powodu twoich licznych czarów."
  tags: []
"Iz47,10":
  text: "Zaufałaś bowiem swojej niegodziwości i mówiłaś: Nikt mnie nie widzi. Twoja mądrość i twoja wiedza uczyniły cię przewrotną i mówiłaś w swoim sercu: Ja jestem i nie ma oprócz mnie żadnej innej."
  tags: []
"Iz47,11":
  text: "Dlatego przyjdzie na ciebie zło, ale nie poznasz, skąd pochodzi, spadnie na ciebie nieszczęście, którego nie będziesz mogła się pozbyć, i przyjdzie na ciebie nagle spustoszenie, którego nie spostrzeżesz."
  tags: []
"Iz47,12":
  text: "Pozostań przy swoich czarach i mnóstwie swych guseł, którymi się trudziłaś od młodości; może zdołasz sobie pomóc, może się umocnisz."
  tags: []
"Iz47,13":
  text: "Jesteś zmęczona mnóstwem swoich rad. Niech teraz staną astrolodzy, ci, którzy przypatrują się gwiazdom, ci, którzy przepowiadają co miesiąc, co ma się wydarzyć, i niech cię wybawią z tego, co ma przyjść na ciebie."
  tags: []
"Iz47,14":
  text: "Oto są oni jak ściernisko, ogień ich spali i nie wybawią swojej duszy z mocy płomienia. Nie zostanie węgla do ogrzania się ani ognia, aby przy nim posiedzieć."
  tags: []
"Iz47,15":
  text: "Tacy będą dla ciebie handlarze, z którymi się zadawałaś od młodości: każdy z nich uda się w swoją stronę, nie będzie nikogo, kto by cię ocalił."
  tags: []
