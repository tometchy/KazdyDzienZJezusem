"Iz47,1": "Zstąp i usiądź w prochu, dziewico, córko Babilonu! Siądź na ziemi, a nie na tronie, córko chaldejska, gdyż już cię nie będą nazywać delikatną i rozkoszną."
"Iz47,2": "Weź żarna i miel mąkę, odkryj swoje warkocze, obnaż nogi, odkryj uda, brnij przez rzeki."
"Iz47,3": "Twoja nagość będzie odkryta i twoja hańba będzie widoczna. Dokonam pomsty, żaden człowiek mnie nie powstrzyma."
"Iz47,4": "Tak mówi nasz Odkupiciel, jego imię to PAN zastępów, Święty Izraela."
"Iz47,5": "Usiądź w milczeniu i wejdź w ciemności, córko chaldejska, bo już nie będą cię nazywali panią królestw."
"Iz47,6": "Rozgniewałem się na mój lud, splugawiłem moje dziedzictwo i oddałem je w twoje ręce, ale ty nie okazałaś im miłosierdzia i starców niezmiernie obciążyłaś swoim jarzmem."
"Iz47,7": "I powiedziałaś: Będę panią na wieki. I nie wzięłaś sobie tego do serca ani nie pamiętałaś o tym, jakie będzie tego zakończenie."
"Iz47,8": "Dlatego słuchaj teraz, rozkosznico, która mieszkasz bezpiecznie i mówisz w swoim sercu: Ja jestem i nie ma oprócz mnie żadnej innej, nie będę wdową ani nie zaznam bezdzietności!"
"Iz47,9": "Lecz obie te rzeczy spadną na ciebie nagle, w jednym dniu: bezdzietność i wdowieństwo. W pełni spadną na ciebie z powodu mnóstwa twoich guseł i z powodu twoich licznych czarów."
"Iz47,10": "Zaufałaś bowiem swojej niegodziwości i mówiłaś: Nikt mnie nie widzi. Twoja mądrość i twoja wiedza uczyniły cię przewrotną i mówiłaś w swoim sercu: Ja jestem i nie ma oprócz mnie żadnej innej."
"Iz47,11": "Dlatego przyjdzie na ciebie zło, ale nie poznasz, skąd pochodzi, spadnie na ciebie nieszczęście, którego nie będziesz mogła się pozbyć, i przyjdzie na ciebie nagle spustoszenie, którego nie spostrzeżesz."
"Iz47,12": "Pozostań przy swoich czarach i mnóstwie swych guseł, którymi się trudziłaś od młodości; może zdołasz sobie pomóc, może się umocnisz."
"Iz47,13": "Jesteś zmęczona mnóstwem swoich rad. Niech teraz staną astrolodzy, ci, którzy przypatrują się gwiazdom, ci, którzy przepowiadają co miesiąc, co ma się wydarzyć, i niech cię wybawią z tego, co ma przyjść na ciebie."
"Iz47,14": "Oto są oni jak ściernisko, ogień ich spali i nie wybawią swojej duszy z mocy płomienia. Nie zostanie węgla do ogrzania się ani ognia, aby przy nim posiedzieć."
"Iz47,15": "Tacy będą dla ciebie handlarze, z którymi się zadawałaś od młodości: każdy z nich uda się w swoją stronę, nie będzie nikogo, kto by cię ocalił."
