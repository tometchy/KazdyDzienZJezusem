"Iz3,1":
  text: "Oto bowiem Pan, PAN zastępów, odbierze Jerozolimie i Judzie podporę i laskę, wszelką podporę w chlebie i wszelką podporę w wodzie."
  tags: []
"Iz3,2":
  text: "Mocarza i męża walecznego, sędziego i proroka, mędrca i starca;"
  tags: []
"Iz3,3":
  text: "Dowódcę pięćdziesiątki i dostojnika, doradcę, wybitnego rzemieślnika i krasomówcę."
  tags: []
"Iz3,4":
  text: "Książętami ustanowię chłopców, dzieci będą panować nad nimi."
  tags: []
"Iz3,5":
  text: "Ludzie będą gnębić jeden drugiego, każdy swego bliźniego. Dziecko powstanie przeciwko starcowi, a podły przeciwko dostojnikowi."
  tags: []
"Iz3,6":
  text: "Gdy człowiek uchwyci się swego brata z domu swego ojca i powie: Masz ubranie, bądź naszym wodzem, niech te ruiny będą pod twoją ręką;"
  tags: []
"Iz3,7":
  text: "Ten przysięgnie w tym dniu, mówiąc: Nie będę opatrywał tych ran; w moim domu bowiem nie ma chleba ani ubrania; nie czyńcie mnie wodzem ludu."
  tags: []
"Iz3,8":
  text: "Bo Jerozolima upada, a Juda się wali, gdyż ich język i czyny są przeciwko PANU, aby pobudzić do gniewu oczy jego majestatu."
  tags: []
"Iz3,9":
  text: "Wyraz ich twarzy świadczy przeciwko nim; jak Sodoma ogłaszają swój grzech, nie kryją go. Biada ich duszy! Gdyż sami na siebie sprowadzają zło."
  tags: []
"Iz3,10":
  text: "Powiedzcie sprawiedliwemu, że będzie mu dobrze, bo będzie spożywać owoc swoich rąk."
  tags: []
"Iz3,11":
  text: "Biada niegodziwemu! Będzie mu źle, odpłacą mu bowiem według czynów jego rąk."
  tags: []
"Iz3,12":
  text: "Ciemięzcami mego ludu są dzieci i kobiety nim rządzą. O ludu mój! Twoi wodzowie cię zwodzą i niszczą drogę twoich ścieżek."
  tags: []
"Iz3,13":
  text: "PAN powstał, aby się rozprawić, stoi, aby sądzić lud."
  tags: []
"Iz3,14":
  text: "PAN stawi na sąd starszych swego ludu i ich książąt: Wy spustoszyliście moją winnicę, w waszych domach znajduje się łup ubogich."
  tags: []
"Iz3,15":
  text: "Po co miażdżycie mój lud i uciskacie oblicza ubogich? – mówi Pan BÓG zastępów."
  tags: []
"Iz3,16":
  text: "PAN powiedział: Ponieważ wynoszą się córki Syjonu i chodzą z wyciągniętą szyją, uwodzą oczami, a chodząc, drepczą i pobrzękują swoimi nogami;"
  tags: []
"Iz3,17":
  text: "Dlatego Pan ogoli wierzch głowy córek Syjonu i PAN obnaży ich nagość."
  tags: []
"Iz3,18":
  text: "W tym dniu Pan odejmie ozdobne brzękadła od ich stóp, ich czepce i księżyce;"
  tags: []
"Iz3,19":
  text: "Łańcuszki, bransolety i welony;"
  tags: []
"Iz3,20":
  text: "Czapeczki, ozdoby u nóg, opaski, naszyjniki i kolczyki;"
  tags: []
"Iz3,21":
  text: "Pierścionki i wisiorki na czołach;"
  tags: []
"Iz3,22":
  text: "Odświętne szaty, płaszcze, szale i torebki;"
  tags: []
"Iz3,23":
  text: "Zwierciadełka, bisior, turbany i narzutki."
  tags: []
"Iz3,24":
  text: "I wtedy zamiast wonności będzie smród, zamiast pasa będzie rozdarcie, zamiast upiętych włosów będzie łysina, zamiast szerokiej szaty będzie przepasanie worem i zamiast piękna będzie oparzenie."
  tags: []
"Iz3,25":
  text: "Twoi mężczyźni polegną od miecza i twoi mocarze – na wojnie."
  tags: []
"Iz3,26":
  text: "Jej bramy zasmucą się i zapłaczą, a ona, spustoszona, usiądzie na ziemi."
  tags: []
