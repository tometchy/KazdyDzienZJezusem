"Iz3,1": "Oto bowiem Pan, PAN zastępów, odbierze Jerozolimie i Judzie podporę i laskę, wszelką podporę w chlebie i wszelką podporę w wodzie."
"Iz3,2": "Mocarza i męża walecznego, sędziego i proroka, mędrca i starca;"
"Iz3,3": "Dowódcę pięćdziesiątki i dostojnika, doradcę, wybitnego rzemieślnika i krasomówcę."
"Iz3,4": "Książętami ustanowię chłopców, dzieci będą panować nad nimi."
"Iz3,5": "Ludzie będą gnębić jeden drugiego, każdy swego bliźniego. Dziecko powstanie przeciwko starcowi, a podły przeciwko dostojnikowi."
"Iz3,6": "Gdy człowiek uchwyci się swego brata z domu swego ojca i powie: Masz ubranie, bądź naszym wodzem, niech te ruiny będą pod twoją ręką;"
"Iz3,7": "Ten przysięgnie w tym dniu, mówiąc: Nie będę opatrywał tych ran; w moim domu bowiem nie ma chleba ani ubrania; nie czyńcie mnie wodzem ludu."
"Iz3,8": "Bo Jerozolima upada, a Juda się wali, gdyż ich język i czyny są przeciwko PANU, aby pobudzić do gniewu oczy jego majestatu."
"Iz3,9": "Wyraz ich twarzy świadczy przeciwko nim; jak Sodoma ogłaszają swój grzech, nie kryją go. Biada ich duszy! Gdyż sami na siebie sprowadzają zło."
"Iz3,10": "Powiedzcie sprawiedliwemu, że będzie mu dobrze, bo będzie spożywać owoc swoich rąk."
"Iz3,11": "Biada niegodziwemu! Będzie mu źle, odpłacą mu bowiem według czynów jego rąk."
"Iz3,12": "Ciemięzcami mego ludu są dzieci i kobiety nim rządzą. O ludu mój! Twoi wodzowie cię zwodzą i niszczą drogę twoich ścieżek."
"Iz3,13": "PAN powstał, aby się rozprawić, stoi, aby sądzić lud."
"Iz3,14": "PAN stawi na sąd starszych swego ludu i ich książąt: Wy spustoszyliście moją winnicę, w waszych domach znajduje się łup ubogich."
"Iz3,15": "Po co miażdżycie mój lud i uciskacie oblicza ubogich? – mówi Pan BÓG zastępów."
"Iz3,16": "PAN powiedział: Ponieważ wynoszą się córki Syjonu i chodzą z wyciągniętą szyją, uwodzą oczami, a chodząc, drepczą i pobrzękują swoimi nogami;"
"Iz3,17": "Dlatego Pan ogoli wierzch głowy córek Syjonu i PAN obnaży ich nagość."
"Iz3,18": "W tym dniu Pan odejmie ozdobne brzękadła od ich stóp, ich czepce i księżyce;"
"Iz3,19": "Łańcuszki, bransolety i welony;"
"Iz3,20": "Czapeczki, ozdoby u nóg, opaski, naszyjniki i kolczyki;"
"Iz3,21": "Pierścionki i wisiorki na czołach;"
"Iz3,22": "Odświętne szaty, płaszcze, szale i torebki;"
"Iz3,23": "Zwierciadełka, bisior, turbany i narzutki."
"Iz3,24": "I wtedy zamiast wonności będzie smród, zamiast pasa będzie rozdarcie, zamiast upiętych włosów będzie łysina, zamiast szerokiej szaty będzie przepasanie worem i zamiast piękna będzie oparzenie."
"Iz3,25": "Twoi mężczyźni polegną od miecza i twoi mocarze – na wojnie."
"Iz3,26": "Jej bramy zasmucą się i zapłaczą, a ona, spustoszona, usiądzie na ziemi."
