"Iz55,1": "O wszyscy spragnieni, przyjdźcie do wód, i wy, którzy nie macie pieniędzy, przyjdźcie, kupujcie i jedzcie; tak, przyjdźcie, kupujcie bez pieniędzy i bez zapłaty wino i mleko."
"Iz55,2": "Czemu wydajecie pieniądze nie na chleb, swoją pracę na to, co nie nasyci? Słuchajcie mnie uważnie, a jedzcie to, co jest dobre, i niech wasza dusza rozkoszuje się tłuszczem."
"Iz55,3": "Nakłońcie swego ucha i przyjdźcie do mnie, słuchajcie, a wasza dusza będzie żyć. I zawrę z wami wieczne przymierze, pewne miłosierdzia Dawida."
"Iz55,4": "Oto ustanowiłem go świadkiem dla narodów, wodzem i dowódcą dla narodów."
"Iz55,5": "Oto przywołasz naród, którego nie znałeś, a narody, które cię nie znały, zbiegną się do ciebie ze względu na PANA, twego Boga, i Świętego Izraela, bo on cię uwielbił."
"Iz55,6": "Szukajcie PANA, póki może być znaleziony; wzywajcie go, póki jest blisko."
"Iz55,7": "Niech bezbożny opuści swoją drogę, a człowiek nieprawy swoje myśli i niech wróci do PANA, a on się zlituje; niech wróci do naszego Boga, gdyż jest on hojny w przebaczeniu."
"Iz55,8": "Moje myśli bowiem nie są waszymi myślami ani wasze drogi nie są moimi drogami, mówi PAN;"
"Iz55,9": "Ale jak niebiosa są wyższe niż ziemia, tak moje drogi przewyższają wasze drogi, a moje myśli – wasze myśli."
"Iz55,10": "Bo jak spada deszcz i śnieg z nieba i już tam nie wraca, ale nawadnia ziemię i czyni ją płodną, czyni ją też urodzajną, tak że wydaje siewcy nasienie, a chleb jedzącym;"
"Iz55,11": "Tak będzie z moim słowem, które wyjdzie z moich ust: nie wróci do mnie na próżno, ale uczyni to, co mi się podoba, i poszczęści mu się w tym, do czego je poślę."
"Iz55,12": "Dlatego wyjdziecie z radością i w pokoju poprowadzą was. Góry i pagórki będą śpiewać głośno przed wami i wszystkie drzewa polne będą klaskać w dłonie."
"Iz55,13": "Zamiast cierni wyrośnie cyprys, zamiast pokrzywy wyrośnie mirt. I będzie to dla PANA na chwałę, na wieczny znak, który nigdy nie będzie wymazany."
