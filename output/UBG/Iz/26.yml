"Iz26,1": "W tym dniu śpiewana będzie taka pieśń w ziemi Judy: Mamy miasto obronne, Bóg zaopatrzy je w zbawienie jako mur i wały obronne."
"Iz26,2": "Otwórzcie bramy, niech wejdzie naród sprawiedliwy, który strzeże prawdy."
"Iz26,3": "Człowieka polegającego na tobie zachowujesz w doskonałym pokoju, bo tobie ufa."
"Iz26,4": "Pokładajcie nadzieję w PANU na wieki, bo JEHOWA BÓG jest wieczną skałą."
"Iz26,5": "On bowiem poniża tych, którzy mieszkają wysoko; burzy miasto wyniosłe, burzy je aż do ziemi, i strąca aż do prochu."
"Iz26,6": "Depcze je noga; nogi ubogiego, stopy nędzarzy."
"Iz26,7": "Ścieżka sprawiedliwego jest prosta; wyrównujesz prostą drogę sprawiedliwego."
"Iz26,8": "Na drodze twoich sądów, o PANIE, oczekujemy cię; pragnieniem naszej duszy jest twoje imię i wspominanie ciebie."
"Iz26,9": "Moja dusza pragnie cię w nocy; swoim duchem, który jest we mnie, szukam cię nawet rano. Gdy bowiem twoje sądy odbywają się na ziemi, mieszkańcy świata uczą się sprawiedliwości."
"Iz26,10": "Choć niegodziwemu okaże się łaskę, nie nauczy się sprawiedliwości. W ziemi prawości będzie czynić nieprawość i nie będzie zważać na majestat PANA."
"Iz26,11": "PANIE, choć twoja ręka jest wywyższona, oni jednak tego nie widzą. Ale ujrzą i będą zawstydzeni z powodu ich zazdrości wobec twego ludu; ponadto ogień twoich wrogów pożre ich."
"Iz26,12": "PANIE, zaprowadzisz nam pokój, bo wszystko, co się działo przy nas, czyniłeś ku naszemu dobru."
"Iz26,13": "PANIE, nasz Boże, panowali nad nami inni panowie niż ty, ale my, ufając tylko tobie, wspominamy twoje imię."
"Iz26,14": "Umarli oni i nie ożyją, są martwi i nie powstaną, ponieważ nawiedziłeś ich i wytępiłeś, i zgładziłeś wszelką pamięć o nich."
"Iz26,15": "Rozmnożyłeś naród, PANIE, rozmnożyłeś naród. Jesteś uwielbiony, choć go wypędziłeś na wszystkie krańce ziemi."
"Iz26,16": "PANIE, w ucisku ciebie szukali; gdy ich karałeś, wylewali swoje modlitwy."
"Iz26,17": "Jak brzemienna, gdy zbliża się poród, odczuwa ból i woła w boleściach, takimi byliśmy przed tobą, PANIE."
"Iz26,18": "Poczęliśmy, wiliśmy się z bólu, ale zrodziliśmy jakby tylko wiatr; żadnego wybawienia nie dokonaliśmy na ziemi i nie upadli mieszkańcy świata."
"Iz26,19": "Twoi umarli ożyją, wraz z moim trupem powstaną. Ocućcie się i śpiewajcie, wy, którzy spoczywacie w prochu! Twoja rosa bowiem będzie jak rosa na ziołach, a ziemia wyda umarłych."
"Iz26,20": "Chodź, mój ludu! Wejdź do swoich komnat i zamknij swoje drzwi za sobą. Skryj się na krótką chwilę, aż gniew przeminie."
"Iz26,21": "Oto bowiem PAN wychodzi ze swojego miejsca, aby nawiedzić nieprawość mieszkańców ziemi. Wtedy ziemia ujawni swoją krew i nie będzie już ukrywać swoich zabitych."
