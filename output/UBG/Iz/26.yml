"Iz26,1":
  text: "W tym dniu śpiewana będzie taka pieśń w ziemi Judy: Mamy miasto obronne, Bóg zaopatrzy je w zbawienie jako mur i wały obronne."
  tags: []
"Iz26,2":
  text: "Otwórzcie bramy, niech wejdzie naród sprawiedliwy, który strzeże prawdy."
  tags: []
"Iz26,3":
  text: "Człowieka polegającego na tobie zachowujesz w doskonałym pokoju, bo tobie ufa."
  tags: []
"Iz26,4":
  text: "Pokładajcie nadzieję w PANU na wieki, bo JEHOWA BÓG jest wieczną skałą."
  tags: []
"Iz26,5":
  text: "On bowiem poniża tych, którzy mieszkają wysoko; burzy miasto wyniosłe, burzy je aż do ziemi, i strąca aż do prochu."
  tags: []
"Iz26,6":
  text: "Depcze je noga; nogi ubogiego, stopy nędzarzy."
  tags: []
"Iz26,7":
  text: "Ścieżka sprawiedliwego jest prosta; wyrównujesz prostą drogę sprawiedliwego."
  tags: []
"Iz26,8":
  text: "Na drodze twoich sądów, o PANIE, oczekujemy cię; pragnieniem naszej duszy jest twoje imię i wspominanie ciebie."
  tags: []
"Iz26,9":
  text: "Moja dusza pragnie cię w nocy; swoim duchem, który jest we mnie, szukam cię nawet rano. Gdy bowiem twoje sądy odbywają się na ziemi, mieszkańcy świata uczą się sprawiedliwości."
  tags: []
"Iz26,10":
  text: "Choć niegodziwemu okaże się łaskę, nie nauczy się sprawiedliwości. W ziemi prawości będzie czynić nieprawość i nie będzie zważać na majestat PANA."
  tags: []
"Iz26,11":
  text: "PANIE, choć twoja ręka jest wywyższona, oni jednak tego nie widzą. Ale ujrzą i będą zawstydzeni z powodu ich zazdrości wobec twego ludu; ponadto ogień twoich wrogów pożre ich."
  tags: []
"Iz26,12":
  text: "PANIE, zaprowadzisz nam pokój, bo wszystko, co się działo przy nas, czyniłeś ku naszemu dobru."
  tags: []
"Iz26,13":
  text: "PANIE, nasz Boże, panowali nad nami inni panowie niż ty, ale my, ufając tylko tobie, wspominamy twoje imię."
  tags: []
"Iz26,14":
  text: "Umarli oni i nie ożyją, są martwi i nie powstaną, ponieważ nawiedziłeś ich i wytępiłeś, i zgładziłeś wszelką pamięć o nich."
  tags: []
"Iz26,15":
  text: "Rozmnożyłeś naród, PANIE, rozmnożyłeś naród. Jesteś uwielbiony, choć go wypędziłeś na wszystkie krańce ziemi."
  tags: []
"Iz26,16":
  text: "PANIE, w ucisku ciebie szukali; gdy ich karałeś, wylewali swoje modlitwy."
  tags: []
"Iz26,17":
  text: "Jak brzemienna, gdy zbliża się poród, odczuwa ból i woła w boleściach, takimi byliśmy przed tobą, PANIE."
  tags: []
"Iz26,18":
  text: "Poczęliśmy, wiliśmy się z bólu, ale zrodziliśmy jakby tylko wiatr; żadnego wybawienia nie dokonaliśmy na ziemi i nie upadli mieszkańcy świata."
  tags: []
"Iz26,19":
  text: "Twoi umarli ożyją, wraz z moim trupem powstaną. Ocućcie się i śpiewajcie, wy, którzy spoczywacie w prochu! Twoja rosa bowiem będzie jak rosa na ziołach, a ziemia wyda umarłych."
  tags: []
"Iz26,20":
  text: "Chodź, mój ludu! Wejdź do swoich komnat i zamknij swoje drzwi za sobą. Skryj się na krótką chwilę, aż gniew przeminie."
  tags: []
"Iz26,21":
  text: "Oto bowiem PAN wychodzi ze swojego miejsca, aby nawiedzić nieprawość mieszkańców ziemi. Wtedy ziemia ujawni swoją krew i nie będzie już ukrywać swoich zabitych."
  tags: []
