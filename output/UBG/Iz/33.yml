"Iz33,1": "Biada tobie, który łupisz, chociaż sam nie byłeś złupiony, i który zdradzasz, chociaż sam nie byłeś zdradzony! Gdy przestaniesz łupić, też zostaniesz złupiony; gdy przestaniesz zdradzać, też będą cię zdradzać."
"Iz33,2": "PANIE, zlituj się nad nami, ciebie oczekujemy. Bądź ramieniem dla swoich każdego poranka i naszym zbawieniem w czasie ucisku."
"Iz33,3": "Na głos wrzawy rozpierzchną się narody; gdy się podniesiesz, rozproszą się poganie."
"Iz33,4": "I wasze łupy będą zebrane, jak się zbiera robactwo; a jak rzuca się szarańcza, tak on przypadnie na nie."
"Iz33,5": "PAN jest wywyższony, bo mieszka na wysokości. Napełni Syjon sądem i sprawiedliwością."
"Iz33,6": "Mądrość i wiedza będą utwierdzeniem twych czasów, siłą i twoim obfitym zbawieniem, a bojaźń PANA to jego skarb."
"Iz33,7": "Oto ich mocarze wołają na dworze, posłowie pokoju gorzko płaczą."
"Iz33,8": "Opustoszały drogi, przechodzień przestał podążać ścieżką. Zerwał przymierze, znieważył miasta, a z człowiekiem się nie liczy."
"Iz33,9": "Ziemia płacze i marnieje; Liban jest zawstydzony i usycha; Szaron stał się niczym pustynia, a Baszan i Karmel są ogołocone."
"Iz33,10": "Teraz powstanę – mówi PAN – teraz się wywyższę, teraz się podniosę."
"Iz33,11": "Poczniecie słomę i zrodzicie ściernisko; wasze tchnienie pożre was jak ogień."
"Iz33,12": "I narody będą jak wypalone wapno; jak ścięte ciernie będą spalone ogniem."
"Iz33,13": "Słuchajcie, wy, którzy jesteście daleko, co uczyniłem, a wy, bliscy, poznajcie moją moc."
"Iz33,14": "Grzesznicy na Syjonie zlękli się, strach ogarnął obłudników: Kto z nas może przebywać przy trawiącym ogniu? Kto z nas może przebywać przy wiecznym płomieniu?"
"Iz33,15": "Ten, kto postępuje w sprawiedliwości i mówi to, co prawe; ten, kto brzydzi się zyskiem niesprawiedliwym, kto otrząsa swe ręce, by nie brać darów, kto zatyka uszy, by nie słuchać o rozlewie krwi, i zamyka oczy, by nie patrzeć na zło;"
"Iz33,16": "Ten będzie mieszkać na wysokościach, zamki na skałach będą jego ucieczką; będzie mu dany chleb i wody mu nie zabraknie."
"Iz33,17": "Twoje oczy ujrzą króla w jego pięknie, ujrzą ziemię daleką."
"Iz33,18": "Twoje serce będzie wspominać grozę: Gdzie jest pisarz? Gdzie jest poborca? Gdzie jest ten, co liczył wieże?"
"Iz33,19": "Nie zobaczysz już okrutnego ludu, ludu o ciemnej, niewyraźnej mowie, o bełkotliwym i niezrozumiałym języku."
"Iz33,20": "Spójrz na Syjon, miasto naszych uroczystych świąt. Twoje oczy zobaczą Jerozolimę, spokojne miejsce zamieszkania, namiot, który nie będzie przeniesiony; jego kołki nigdy nie zostaną wyciągnięte i żaden z jego sznurów nie będzie zerwany."
"Iz33,21": "Wielmożny PAN sam będzie dla nas miejscem szerokich rzek i strumieni, po których nie popłynie okręt wiosłowy ani przez które okazały statek się nie przeprawi."
"Iz33,22": "PAN bowiem jest naszym sędzią, PAN naszym prawodawcą, PAN naszym królem. On nas zbawi."
"Iz33,23": "Osłabły twoje liny, nie będą mogli utrzymać twego masztu ani rozciągnąć żagla. Wtedy zostanie rozdzielony ogromny łup, chromi pochwycą zdobycz."
"Iz33,24": "I żaden z mieszkańców nie powie: Zachorowałem. Ludowi, który mieszka w nim, zostanie przebaczona nieprawość."
