"Iz22,1": "Brzemię Doliny Widzenia. Co ci się stało, że cała wystąpiłaś na dachy?"
"Iz22,2": "Miasto pełne wrzasku i zgiełku, miasto wesołe! Twoi zabici nie padli od miecza ani nie zginęli w bitwie."
"Iz22,3": "Wszyscy twoi dowódcy pierzchli razem, związani przez łuczników. Zostali związani razem ci, których znaleziono u ciebie, ci, którzy uciekli z daleka."
"Iz22,4": "Dlatego powiedziałem: Odwróćcie swój wzrok ode mnie, abym gorzko zapłakał; nie próbujcie mnie pocieszać z powodu spustoszenia córki mojego ludu."
"Iz22,5": "To jest bowiem dzień ucisku, deptania i zamieszania od Pana, BOGA zastępów, w Dolinie Widzenia, dzień burzenia murów i wołania na góry."
"Iz22,6": "Elam wziął kołczan z rydwanami ludu wojennego, a Kir odsłonił swoją tarczę."
"Iz22,7": "I stało się tak, że najpiękniejsze doliny były pełne rydwanów, a jeźdźcy ustawili się potężnie przy bramie."
"Iz22,8": "I odkryto osłonę Judy, i w tym dniu spoglądałeś na zbrojownię w Domu Lasu."
"Iz22,9": "I spoglądaliście na wyłomy miasta Dawida – na to, że były liczne, i zgromadziliście wody Dolnej Sadzawki."
"Iz22,10": "Policzyliście domy w Jerozolimie i burzyliście domy, aby wzmocnić mur."
"Iz22,11": "Zrobiliście też zbiornik między dwoma murami na wodę Starej Sadzawki, ale nie spoglądaliście na jej twórcę ani nie widzieliście tego, który od dawna ją ukształtował."
"Iz22,12": "W tym dniu Pan, BÓG zastępów, wzywał do płaczu i do żałoby, do ostrzyżenia się i do przepasania się worem."
"Iz22,13": "A oto radość i wesele, zabijanie wołów i owiec, spożywanie mięsa i picie wina: Jedzmy, pijmy, bo jutro umrzemy."
"Iz22,14": "Ale PAN zastępów objawił mi to, mówiąc do mych uszu: Na pewno ta nieprawość nie będzie wam przebaczona aż do śmierci, mówi Pan, BÓG zastępów."
"Iz22,15": "Tak mówi Pan, BÓG zastępów: Idź, udaj się do tego skarbnika, do Szebny, przełożonego domu, i powiedz:"
"Iz22,16": "Co ty tu masz i kogo tu masz, że wykułeś sobie w tym miejscu grób? Wykułeś sobie grób wysoko, wydrążyłeś sobie w skale swoje mieszkanie."
"Iz22,17": "Oto PAN, który cię przykrył jak zacnego człowieka i który cię kosztownie przyoblekł;"
"Iz22,18": "Tocząc cię, zwinie i rzuci jak kulę w przestronną ziemię. Tam umrzesz, tam też rydwany twojej chwały będą hańbą domu twego pana."
"Iz22,19": "Wypędzę cię z twego stanowiska, z twego urzędu ściągnę cię."
"Iz22,20": "W tym dniu powołam swego sługę Eliakima, syna Chilkiasza."
"Iz22,21": "I ubiorę go w twoją szatę, i przepaszę go twoim pasem, i oddam w jego ręce twoją władzę; i będzie on ojcem dla mieszkańców Jerozolimy i domu Judy."
"Iz22,22": "I położę klucz domu Dawida na jego ramieniu; gdy on otworzy, nikt nie zamknie, a gdy zamknie, nikt nie otworzy."
"Iz22,23": "I wbiję go jak gwóźdź na miejscu pewnym, a będzie tronem chwały dla domu swego ojca."
"Iz22,24": "I zawieszą na nim całą chwałę domu jego ojca, synów i córki, wszelkie drobne naczynia, od kubków do wszelkich dzbanów."
"Iz22,25": "W tym dniu, mówi PAN zastępów, gwóźdź, który był wbity w miejscu pewnym, zostanie wyjęty i przycięty, i spadnie; a brzemię, które wisiało na nim, zostanie odcięte. Tak bowiem PAN to powiedział."
