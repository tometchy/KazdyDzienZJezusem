"Iz22,1":
  text: "Brzemię Doliny Widzenia. Co ci się stało, że cała wystąpiłaś na dachy?"
  tags: []
"Iz22,2":
  text: "Miasto pełne wrzasku i zgiełku, miasto wesołe! Twoi zabici nie padli od miecza ani nie zginęli w bitwie."
  tags: []
"Iz22,3":
  text: "Wszyscy twoi dowódcy pierzchli razem, związani przez łuczników. Zostali związani razem ci, których znaleziono u ciebie, ci, którzy uciekli z daleka."
  tags: []
"Iz22,4":
  text: "Dlatego powiedziałem: Odwróćcie swój wzrok ode mnie, abym gorzko zapłakał; nie próbujcie mnie pocieszać z powodu spustoszenia córki mojego ludu."
  tags: []
"Iz22,5":
  text: "To jest bowiem dzień ucisku, deptania i zamieszania od Pana, BOGA zastępów, w Dolinie Widzenia, dzień burzenia murów i wołania na góry."
  tags: []
"Iz22,6":
  text: "Elam wziął kołczan z rydwanami ludu wojennego, a Kir odsłonił swoją tarczę."
  tags: []
"Iz22,7":
  text: "I stało się tak, że najpiękniejsze doliny były pełne rydwanów, a jeźdźcy ustawili się potężnie przy bramie."
  tags: []
"Iz22,8":
  text: "I odkryto osłonę Judy, i w tym dniu spoglądałeś na zbrojownię w Domu Lasu."
  tags: []
"Iz22,9":
  text: "I spoglądaliście na wyłomy miasta Dawida – na to, że były liczne, i zgromadziliście wody Dolnej Sadzawki."
  tags: []
"Iz22,10":
  text: "Policzyliście domy w Jerozolimie i burzyliście domy, aby wzmocnić mur."
  tags: []
"Iz22,11":
  text: "Zrobiliście też zbiornik między dwoma murami na wodę Starej Sadzawki, ale nie spoglądaliście na jej twórcę ani nie widzieliście tego, który od dawna ją ukształtował."
  tags: []
"Iz22,12":
  text: "W tym dniu Pan, BÓG zastępów, wzywał do płaczu i do żałoby, do ostrzyżenia się i do przepasania się worem."
  tags: []
"Iz22,13":
  text: "A oto radość i wesele, zabijanie wołów i owiec, spożywanie mięsa i picie wina: Jedzmy, pijmy, bo jutro umrzemy."
  tags: []
"Iz22,14":
  text: "Ale PAN zastępów objawił mi to, mówiąc do mych uszu: Na pewno ta nieprawość nie będzie wam przebaczona aż do śmierci, mówi Pan, BÓG zastępów."
  tags: []
"Iz22,15":
  text: "Tak mówi Pan, BÓG zastępów: Idź, udaj się do tego skarbnika, do Szebny, przełożonego domu, i powiedz:"
  tags: []
"Iz22,16":
  text: "Co ty tu masz i kogo tu masz, że wykułeś sobie w tym miejscu grób? Wykułeś sobie grób wysoko, wydrążyłeś sobie w skale swoje mieszkanie."
  tags: []
"Iz22,17":
  text: "Oto PAN, który cię przykrył jak zacnego człowieka i który cię kosztownie przyoblekł;"
  tags: []
"Iz22,18":
  text: "Tocząc cię, zwinie i rzuci jak kulę w przestronną ziemię. Tam umrzesz, tam też rydwany twojej chwały będą hańbą domu twego pana."
  tags: []
"Iz22,19":
  text: "Wypędzę cię z twego stanowiska, z twego urzędu ściągnę cię."
  tags: []
"Iz22,20":
  text: "W tym dniu powołam swego sługę Eliakima, syna Chilkiasza."
  tags: []
"Iz22,21":
  text: "I ubiorę go w twoją szatę, i przepaszę go twoim pasem, i oddam w jego ręce twoją władzę; i będzie on ojcem dla mieszkańców Jerozolimy i domu Judy."
  tags: []
"Iz22,22":
  text: "I położę klucz domu Dawida na jego ramieniu; gdy on otworzy, nikt nie zamknie, a gdy zamknie, nikt nie otworzy."
  tags: []
"Iz22,23":
  text: "I wbiję go jak gwóźdź na miejscu pewnym, a będzie tronem chwały dla domu swego ojca."
  tags: []
"Iz22,24":
  text: "I zawieszą na nim całą chwałę domu jego ojca, synów i córki, wszelkie drobne naczynia, od kubków do wszelkich dzbanów."
  tags: []
"Iz22,25":
  text: "W tym dniu, mówi PAN zastępów, gwóźdź, który był wbity w miejscu pewnym, zostanie wyjęty i przycięty, i spadnie; a brzemię, które wisiało na nim, zostanie odcięte. Tak bowiem PAN to powiedział."
  tags: []
