"Iz18,1":
  text: "Biada ziemi, którą zacieniają skrzydła, ziemi leżącej za rzekami Etiopii;"
  tags: []
"Iz18,2":
  text: "Która wysyła posłów przez morze w łodziach z sitowia po wodach, mówiąc: Idźcie, prędcy posłańcy, do narodu rozszarpanego i splądrowanego, do ludu, który budzi grozę, odkąd istnieje, do narodu zdeptanego do szczętu, którego ziemię rozrywają rzeki."
  tags: []
"Iz18,3":
  text: "Wszyscy mieszkańcy świata i osiedleńcy ziemi, zobaczycie, jak sztandar zostanie wzniesiony na górach, i usłyszycie, gdy zadmą w trąby."
  tags: []
"Iz18,4":
  text: "Tak bowiem mówi PAN do mnie: Będę spokojny i będę przypatrywać się z mojego przybytku – jak pogodne ciepło po deszczu, jak obłok rosy w upalne żniwo."
  tags: []
"Iz18,5":
  text: "Bo przed żniwem, gdy puszczą pączki, a kwiat wyda dojrzewające cierpkie grono, wtedy obetnie gałązki nożami i gałęzie usunie i obetnie."
  tags: []
"Iz18,6":
  text: "I będą pozostawione wszystkie razem ptakom górskim i zwierzętom polnym. Ptaki spędzą na nich lato, a wszystkie zwierzęta polne na nich przezimują."
  tags: []
"Iz18,7":
  text: "W tym czasie będzie przyniesiony dar PANU zastępów od ludu rozszarpanego i splądrowanego, od ludu budzącego grozę, odkąd istnieje aż do dziś, od narodu do szczętu zdeptanego, którego ziemię rozrywały rzeki, na miejsce imienia PANA zastępów, na górę Syjon."
  tags: []
