"Iz9,1":
  text: "Mrok jednak nie będzie taki, jak był w czasie jej ucisku, gdy Bóg dotknął ziemię Zebulona i ziemię Neftalego, ani jak potem, gdy trapił ją przy drodze morskiej za Jordanem, w Galilei pogan."
  tags: []
"Iz9,2":
  text: "Lud, który chodził w ciemności, ujrzał wielką światłość, a mieszkającym w ziemi cienia śmierci zajaśniała światłość."
  tags: []
"Iz9,3":
  text: "Rozmnożyłeś ten naród, ale nie zwiększyłeś radości. Będą się jednak radować przed tobą, jak się radują w czasie żniwa, jak się radują przy podziale łupów;"
  tags: []
"Iz9,4":
  text: "Gdyż złamałeś jarzmo jego ciężaru i laskę jego ramienia, pręt jego ciemięzcy, jak za dni Midianitów."
  tags: []
"Iz9,5":
  text: "Każdej bitwie wojowników towarzyszą trzask i szaty zbroczone krwią, lecz tej – spalenie i ogień."
  tags: []
"Iz9,6":
  text: "Dziecko bowiem narodziło się nam, syn został nam dany. Na jego ramieniu spocznie władza, a nazwą go imieniem: Cudowny, Doradca, Bóg Mocny, Ojciec Wieczności, Książę Pokoju;"
  tags: []
"Iz9,7":
  text: "A rozszerzeniu jego władzy i pokoju nie będzie końca, zasiądzie na tronie Dawida i nad jego królestwem, aż je ustanowi i utwierdzi sądem i sprawiedliwością, odtąd i na wieki. Dokona tego gorliwość PANA zastępów."
  tags: []
"Iz9,8":
  text: "Pan posłał słowo do Jakuba i spadło na Izraela."
  tags: []
"Iz9,9":
  text: "Pozna je cały lud, Efraim i mieszkańcy Samarii, którzy mówią w pysze i wyniosłości serca:"
  tags: []
"Iz9,10":
  text: "Cegły rozsypały się, ale my będziemy budować ciosanym kamieniem. Wycięto sykomory, ale my zastąpimy je cedrami."
  tags: []
"Iz9,11":
  text: "PAN wywyższy wrogów Resina przeciwko niemu i zjednoczy jego nieprzyjaciół;"
  tags: []
"Iz9,12":
  text: "Syryjczyków z przodu i Filistynów z tyłu; i pożrą Izraela całą paszczą. Mimo tego wszystkiego jego gniew nie ustał, ale jego ręka jest jeszcze wyciągnięta."
  tags: []
"Iz9,13":
  text: "Lud bowiem nie nawraca się do tego, który go bije, ani nie szuka PANA zastępów;"
  tags: []
"Iz9,14":
  text: "Dlatego PAN odetnie Izraelowi głowę i ogon, gałąź i sitowie, w jednym dniu."
  tags: []
"Iz9,15":
  text: "Starzec i dostojnik – to głowa, a prorok, który uczy kłamstwa – to ogon."
  tags: []
"Iz9,16":
  text: "Przywódcy tego ludu stali się bowiem zwodzicielami, a ci, którym przewodzą, giną."
  tags: []
"Iz9,17":
  text: "Dlatego Pan nie ucieszy się z jego młodzieńców i nie zlituje się nad jego sierotami i wdowami. Wszyscy bowiem są obłudni i niegodziwi, a każde usta mówią sprośności. Mimo tego wszystkiego jego gniew nie ustał, ale jego ręka jest jeszcze wyciągnięta."
  tags: []
"Iz9,18":
  text: "Niegodziwość bowiem płonie jak ogień, pożre głogi i ciernie, potem zapali się w gęstwinach lasu, skąd jak dym unoszą się."
  tags: []
"Iz9,19":
  text: "Od gniewu PANA zastępów zaćmi się ziemia, a ten lud będzie jak strawa dla ognia. Nikt nie oszczędzi swego brata."
  tags: []
"Iz9,20":
  text: "A porwie, co znajduje się po prawej stronie, ale nadal będzie głodny; zje, co z lewej, ale nie nasyci się. Każdy z nich będzie pożerać ciało swego ramienia;"
  tags: []
"Iz9,21":
  text: "Manasses – Efraima, a Efraim – Manassesa, a obaj razem będą przeciwko Judzie. Mimo tego wszystkiego jego gniew nie ustał, ale jego ręka jest jeszcze wyciągnięta."
  tags: []
