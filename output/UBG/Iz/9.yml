"Iz9,1": "Mrok jednak nie będzie taki, jak był w czasie jej ucisku, gdy Bóg dotknął ziemię Zebulona i ziemię Neftalego, ani jak potem, gdy trapił ją przy drodze morskiej za Jordanem, w Galilei pogan."
"Iz9,2": "Lud, który chodził w ciemności, ujrzał wielką światłość, a mieszkającym w ziemi cienia śmierci zajaśniała światłość."
"Iz9,3": "Rozmnożyłeś ten naród, ale nie zwiększyłeś radości. Będą się jednak radować przed tobą, jak się radują w czasie żniwa, jak się radują przy podziale łupów;"
"Iz9,4": "Gdyż złamałeś jarzmo jego ciężaru i laskę jego ramienia, pręt jego ciemięzcy, jak za dni Midianitów."
"Iz9,5": "Każdej bitwie wojowników towarzyszą trzask i szaty zbroczone krwią, lecz tej – spalenie i ogień."
"Iz9,6": "Dziecko bowiem narodziło się nam, syn został nam dany. Na jego ramieniu spocznie władza, a nazwą go imieniem: Cudowny, Doradca, Bóg Mocny, Ojciec Wieczności, Książę Pokoju;"
"Iz9,7": "A rozszerzeniu jego władzy i pokoju nie będzie końca, zasiądzie na tronie Dawida i nad jego królestwem, aż je ustanowi i utwierdzi sądem i sprawiedliwością, odtąd i na wieki. Dokona tego gorliwość PANA zastępów."
"Iz9,8": "Pan posłał słowo do Jakuba i spadło na Izraela."
"Iz9,9": "Pozna je cały lud, Efraim i mieszkańcy Samarii, którzy mówią w pysze i wyniosłości serca:"
"Iz9,10": "Cegły rozsypały się, ale my będziemy budować ciosanym kamieniem. Wycięto sykomory, ale my zastąpimy je cedrami."
"Iz9,11": "PAN wywyższy wrogów Resina przeciwko niemu i zjednoczy jego nieprzyjaciół;"
"Iz9,12": "Syryjczyków z przodu i Filistynów z tyłu; i pożrą Izraela całą paszczą. Mimo tego wszystkiego jego gniew nie ustał, ale jego ręka jest jeszcze wyciągnięta."
"Iz9,13": "Lud bowiem nie nawraca się do tego, który go bije, ani nie szuka PANA zastępów;"
"Iz9,14": "Dlatego PAN odetnie Izraelowi głowę i ogon, gałąź i sitowie, w jednym dniu."
"Iz9,15": "Starzec i dostojnik – to głowa, a prorok, który uczy kłamstwa – to ogon."
"Iz9,16": "Przywódcy tego ludu stali się bowiem zwodzicielami, a ci, którym przewodzą, giną."
"Iz9,17": "Dlatego Pan nie ucieszy się z jego młodzieńców i nie zlituje się nad jego sierotami i wdowami. Wszyscy bowiem są obłudni i niegodziwi, a każde usta mówią sprośności. Mimo tego wszystkiego jego gniew nie ustał, ale jego ręka jest jeszcze wyciągnięta."
"Iz9,18": "Niegodziwość bowiem płonie jak ogień, pożre głogi i ciernie, potem zapali się w gęstwinach lasu, skąd jak dym unoszą się."
"Iz9,19": "Od gniewu PANA zastępów zaćmi się ziemia, a ten lud będzie jak strawa dla ognia. Nikt nie oszczędzi swego brata."
"Iz9,20": "A porwie, co znajduje się po prawej stronie, ale nadal będzie głodny; zje, co z lewej, ale nie nasyci się. Każdy z nich będzie pożerać ciało swego ramienia;"
"Iz9,21": "Manasses – Efraima, a Efraim – Manassesa, a obaj razem będą przeciwko Judzie. Mimo tego wszystkiego jego gniew nie ustał, ale jego ręka jest jeszcze wyciągnięta."
