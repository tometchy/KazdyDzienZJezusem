"Iz57,1":
  text: "Sprawiedliwy ginie, a nikt nie bierze sobie tego do serca. Ludzie pobożni odchodzą, a nikt nie zważa na to, że sprawiedliwy jest zabierany przed nadejściem zła."
  tags: []
"Iz57,2":
  text: "Dostąpi pokoju i odpocznie na swoim łożu każdy, kto postępuje uczciwie."
  tags: []
"Iz57,3":
  text: "Ale wy zbliżcie się tutaj, synowie czarownicy, potomstwo cudzołożnika i nierządnicy."
  tags: []
"Iz57,4":
  text: "Z kogo się naigrawacie? Na kogo rozdziawiacie usta i wywieszacie język? Czy nie jesteście synami nierządu, potomstwem fałszu;"
  tags: []
"Iz57,5":
  text: "Wy, którzy uprawiacie nierząd z posągami pod każdym zielonym drzewem, zabijając swoje dzieci przy potokach, pod wysokimi skałami?"
  tags: []
"Iz57,6":
  text: "Wśród gładkich kamieni potoku jest twój dział. Właśnie one są twoim losem, na nie wylewasz ofiarę z płynów i ofiarowujesz ofiarę z pokarmów. Czyż w tym miałbym mieć upodobanie?"
  tags: []
"Iz57,7":
  text: "Na górze wysokiej i wyniosłej postawiłaś swoje łoże i tam wstępowałaś, aby składać ofiary."
  tags: []
"Iz57,8":
  text: "A za drzwiami i za odrzwiami postawiłaś swoją pamiątkę, gdyż odchodząc ode mnie, odkrywałaś się innym, wstąpiłaś i rozszerzyłaś swoje łoże, czyniąc z nimi przymierze; kochałaś ich łoże w każdym miejscu, gdzie je widziałaś."
  tags: []
"Iz57,9":
  text: "Chodziłaś także do króla z olejkiem i mnożyłaś swoje wonności; posłałaś daleko swoich posłańców, a poniżałaś się aż do grobu."
  tags: []
"Iz57,10":
  text: "Zmęczyłaś się licznymi swymi drogami, ale nie powiedziałaś: Na próżno. Znalazłaś pomoc w swojej ręce, dlatego nie osłabłaś."
  tags: []
"Iz57,11":
  text: "Kogo się bałaś i lękałaś, że skłamałaś, i nie pamiętałaś o mnie ani nie wzięłaś sobie tego do serca? Czy ja nie milczałem, i to od dawna, a ty mnie się nie boisz?"
  tags: []
"Iz57,12":
  text: "Opowiem twoją sprawiedliwość i twoje uczynki, które nic ci nie pomogą."
  tags: []
"Iz57,13":
  text: "Gdy zawołasz, niech wybawi cię twoja zgraja; ale wszystkich ich wiatr rozniesie i pochwyci marność. Lecz ten, który mi zaufa, odziedziczy ziemię i posiądzie moją świętą górę."
  tags: []
"Iz57,14":
  text: "I powiedzą: Wyrównajcie, wyrównajcie, przygotujcie drogę, usuńcie przeszkody z drogi mojego ludu."
  tags: []
"Iz57,15":
  text: "Tak bowiem mówi Wysoki i Wyniosły, który zamieszkuje wieczność, którego imię to Święty: Ja, który mieszkam na wysokościach, na miejscu świętym, mieszkam i z tym, który jest skruszony i uniżony w duchu, aby ożywić ducha pokornych i ożywić serce skruszonych."
  tags: []
"Iz57,16":
  text: "Nie będę się spierał na wieki ani nie będę wiecznie się gniewał, bo zemdlałby przede mną duch i dusze, które uczyniłem."
  tags: []
"Iz57,17":
  text: "Z powodu jego niegodziwej chciwości rozgniewałem się i uderzyłem go. Ukryłem się i rozgniewałem, on jednak był uparty i poszedł drogą swego serca."
  tags: []
"Iz57,18":
  text: "Widziałem jego drogi, lecz uzdrowię go. Poprowadzę go i przywrócę mu pociechę, również tym, którzy z nim płaczą."
  tags: []
"Iz57,19":
  text: "Stworzę owoc warg: Pokój, pokój dalekiemu i bliskiemu, mówi PAN; i tak uzdrowię go."
  tags: []
"Iz57,20":
  text: "Lecz bezbożni będą jak wzburzone morze niemogące się uspokoić, którego wody wyrzucają muł i błoto."
  tags: []
"Iz57,21":
  text: "Nie ma pokoju dla bezbożnych, mówi mój Bóg."
  tags: []
