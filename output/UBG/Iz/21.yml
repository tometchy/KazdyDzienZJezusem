"Iz21,1":
  text: "Brzemię pustynnego morza. Jak wicher na południe nadciąga, tak przyjdzie z pustyni, ze strasznej ziemi."
  tags: []
"Iz21,2":
  text: "Srogie widzenie jest mi pokazane. Zdrajca zdradza, niszczyciel niszczy. Nadciągnij, Elamie! Oblegaj, Medio! Położę kres wszelkiemu wzdychaniu."
  tags: []
"Iz21,3":
  text: "Dlatego moje biodra są wypełnione bólem, ogarnęły mnie skurcze jak skurcze rodzącej. Wstrząśnięty jestem tym, co słyszę, przerażony tym, co widzę."
  tags: []
"Iz21,4":
  text: "Zlękło się moje serce, strach mnie ogarnął. Noc moich rozkoszy zamieniła się w postrach."
  tags: []
"Iz21,5":
  text: "Przygotuj stół, niech strażnik trzyma straż; jedz, pij. Wstańcie, książęta, namaszczajcie tarcze."
  tags: []
"Iz21,6":
  text: "Tak bowiem powiedział mi Pan: Idź, postaw strażnika, niech mówi, co widzi."
  tags: []
"Iz21,7":
  text: "I zobaczył rydwan z dwoma jeźdźcami, który ciągnęły osły, i rydwan, który ciągnęły wielbłądy; i przypatrywał się im z wielką uwagą."
  tags: []
"Iz21,8":
  text: "Wtedy zawołał jak lew: Panie mój! Stoję ciągle za dnia na wieży strażniczej; stoję na warcie całymi nocami."
  tags: []
"Iz21,9":
  text: "A oto nadciągają mężczyźni na rydwanie z dwoma jeźdźcami. I zawołał: Upadł, upadł Babilon i wszystkie rzeźbione posągi jego bogów roztrzaskane zostały o ziemię."
  tags: []
"Iz21,10":
  text: "O moi wymłóceni i zboże mego klepiska! Co usłyszałem od PANA zastępów, Boga Izraela, to wam oznajmiłem."
  tags: []
"Iz21,11":
  text: "Brzemię Dumy. Z Seiru ktoś woła do mnie: Strażniku, co się stało w nocy? Strażniku, co się stało w nocy?"
  tags: []
"Iz21,12":
  text: "Strażnik odpowiedział: Nadchodzi poranek, a także noc. Jeśli chcecie dopytywać, dopytujcie, nawróćcie się, przyjdźcie."
  tags: []
"Iz21,13":
  text: "Brzemię na Arabię. W lasach Arabii będziecie nocować, wy, karawany Dedanitów."
  tags: []
"Iz21,14":
  text: "Niech mieszkańcy Tema wyjdą z wodą naprzeciw spragnionych, ze swoim chlebem niech wyjdą na spotkanie uciekającym."
  tags: []
"Iz21,15":
  text: "Będą bowiem uciekali przed mieczami, przed dobytym mieczem, przed napiętym łukiem, przed ciężką bitwą."
  tags: []
"Iz21,16":
  text: "Gdyż tak Pan powiedział do mnie: Za rok, liczony jak rok najemnika, ustanie cała chwała Kedaru."
  tags: []
"Iz21,17":
  text: "A reszta spośród łuczników, dzielni wojownicy spośród synów Kedaru, będzie zmniejszona. Tak bowiem powiedział PAN, Bóg Izraela."
  tags: []
