"Iz21,1": "Brzemię pustynnego morza. Jak wicher na południe nadciąga, tak przyjdzie z pustyni, ze strasznej ziemi."
"Iz21,2": "Srogie widzenie jest mi pokazane. Zdrajca zdradza, niszczyciel niszczy. Nadciągnij, Elamie! Oblegaj, Medio! Położę kres wszelkiemu wzdychaniu."
"Iz21,3": "Dlatego moje biodra są wypełnione bólem, ogarnęły mnie skurcze jak skurcze rodzącej. Wstrząśnięty jestem tym, co słyszę, przerażony tym, co widzę."
"Iz21,4": "Zlękło się moje serce, strach mnie ogarnął. Noc moich rozkoszy zamieniła się w postrach."
"Iz21,5": "Przygotuj stół, niech strażnik trzyma straż; jedz, pij. Wstańcie, książęta, namaszczajcie tarcze."
"Iz21,6": "Tak bowiem powiedział mi Pan: Idź, postaw strażnika, niech mówi, co widzi."
"Iz21,7": "I zobaczył rydwan z dwoma jeźdźcami, który ciągnęły osły, i rydwan, który ciągnęły wielbłądy; i przypatrywał się im z wielką uwagą."
"Iz21,8": "Wtedy zawołał jak lew: Panie mój! Stoję ciągle za dnia na wieży strażniczej; stoję na warcie całymi nocami."
"Iz21,9": "A oto nadciągają mężczyźni na rydwanie z dwoma jeźdźcami. I zawołał: Upadł, upadł Babilon i wszystkie rzeźbione posągi jego bogów roztrzaskane zostały o ziemię."
"Iz21,10": "O moi wymłóceni i zboże mego klepiska! Co usłyszałem od PANA zastępów, Boga Izraela, to wam oznajmiłem."
"Iz21,11": "Brzemię Dumy. Z Seiru ktoś woła do mnie: Strażniku, co się stało w nocy? Strażniku, co się stało w nocy?"
"Iz21,12": "Strażnik odpowiedział: Nadchodzi poranek, a także noc. Jeśli chcecie dopytywać, dopytujcie, nawróćcie się, przyjdźcie."
"Iz21,13": "Brzemię na Arabię. W lasach Arabii będziecie nocować, wy, karawany Dedanitów."
"Iz21,14": "Niech mieszkańcy Tema wyjdą z wodą naprzeciw spragnionych, ze swoim chlebem niech wyjdą na spotkanie uciekającym."
"Iz21,15": "Będą bowiem uciekali przed mieczami, przed dobytym mieczem, przed napiętym łukiem, przed ciężką bitwą."
"Iz21,16": "Gdyż tak Pan powiedział do mnie: Za rok, liczony jak rok najemnika, ustanie cała chwała Kedaru."
"Iz21,17": "A reszta spośród łuczników, dzielni wojownicy spośród synów Kedaru, będzie zmniejszona. Tak bowiem powiedział PAN, Bóg Izraela."
