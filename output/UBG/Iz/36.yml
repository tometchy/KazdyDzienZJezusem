"Iz36,1":
  text: "W czternastym roku królowania Ezechiasza Sennacheryb, król Asyrii, wyruszył przeciwko wszystkim warownym miastom Judy i zdobył je."
  tags: []
"Iz36,2":
  text: "I król Asyrii posłał Rabszaka z Lakisz do Jerozolimy, do króla Ezechiasza, z wielkim wojskiem. Ten stanął przy kanale górnej sadzawki przy drodze pola folusznika."
  tags: []
"Iz36,3":
  text: "Wtedy wyszli do niego Eliakim, syn Chilkiasza, przełożony domu, i Szebna, pisarz, oraz Joach, syn Asafa, kronikarz."
  tags: []
"Iz36,4":
  text: "Wtedy Rabszak powiedział do nich: Proszę, powiedzcie Ezechiaszowi: Tak mówi wielki król, król Asyrii: Co to za ufność, na której polegasz?"
  tags: []
"Iz36,5":
  text: "Mówisz – ale to słowa daremne – mam dość dużo rad i siły do wojny. Teraz więc w kim pokładasz ufność, że zbuntowałeś się przeciwko mnie?"
  tags: []
"Iz36,6":
  text: "Oto opierasz się na tej nadłamanej lasce trzcinowej – na Egipcie – która, gdy ktoś się oprze na niej, wbija mu się w dłoń i przebija ją. Taki jest faraon, król Egiptu, dla wszystkich, którzy mu ufają."
  tags: []
"Iz36,7":
  text: "A jeśli mi powiesz: Ufamy PANU, naszemu Bogu, czy on nie jest tym, którego wyżyny i ołtarze zniósł Ezechiasz i nakazał Judzie i Jerozolimie: Przed tym ołtarzem będziecie oddawać pokłon?"
  tags: []
"Iz36,8":
  text: "Dlatego teraz proszę, daj zastaw memu panu, królowi Asyrii, a ja dam ci dwa tysiące koni, jeśli zdołasz posadzić na nich jeźdźców."
  tags: []
"Iz36,9":
  text: "Jakże więc stawisz opór jednemu dowódcy z najmniejszych sług mego pana, a pokładasz nadzieję w Egipcie, że otrzymasz rydwany i jeźdźców?"
  tags: []
"Iz36,10":
  text: "Poza tym czy bez woli PANA wyruszyłem przeciw tej ziemi, aby ją zniszczyć? PAN powiedział do mnie: Wyrusz przeciwko tej ziemi i spustosz ją."
  tags: []
"Iz36,11":
  text: "Wtedy Eliakim, Szebna i Joach powiedzieli do Rabszaka: Proszę, mów do swoich sług po syryjsku, bo rozumiemy, a nie mów do nas po hebrajsku wobec ludu, który jest na murze."
  tags: []
"Iz36,12":
  text: "Lecz Rabszak odpowiedział: Czy do twego pana i do ciebie posłał mnie mój pan, abym mówił te słowa? Czyż nie do tych mężczyzn siedzących na murze, aby jedli swój kał i pili swój mocz razem z wami?"
  tags: []
"Iz36,13":
  text: "Stał więc Rabszak i zawołał donośnym głosem po hebrajsku tymi słowami: Słuchajcie słów wielkiego króla, króla Asyrii."
  tags: []
"Iz36,14":
  text: "Tak mówi król: Niech was nie zwodzi Ezechiasz, bo nie będzie mógł was wybawić."
  tags: []
"Iz36,15":
  text: "A nie dajcie się przekonać Ezechiaszowi, by zaufać PANU, gdy mówi: Na pewno PAN nas wybawi i to miasto nie będzie wydane w ręce króla Asyrii."
  tags: []
"Iz36,16":
  text: "Nie słuchajcie Ezechiasza. Tak bowiem powiedział król Asyrii: Zawrzyjcie ze mną przymierze i wyjdźcie do mnie, a każdy będzie jeść ze swojej winorośli i ze swego drzewa figowego i każdy będzie pić wodę ze swojej studni;"
  tags: []
"Iz36,17":
  text: "Aż przyjdę i zabiorę was do ziemi podobnej do waszej ziemi, do ziemi zboża i wina, do ziemi chleba i winnic."
  tags: []
"Iz36,18":
  text: "Niech Ezechiasz nie zwodzi was, mówiąc: PAN nas wybawi. Czy bogowie innych narodów mogli wybawić swoją ziemię z ręki króla Asyrii?"
  tags: []
"Iz36,19":
  text: "Gdzie są bogowie Chamatu i Arpadu? Gdzie są bogowie Sefarwaim? Czy wybawili Samarię z mojej ręki?"
  tags: []
"Iz36,20":
  text: "Którzy spośród wszystkich bogów tych ziem wybawili swoją ziemię z mojej ręki, żeby PAN miał wybawić Jerozolimę z mojej ręki?"
  tags: []
"Iz36,21":
  text: "Lecz lud milczał i nie odpowiedział mu ani słowa, bo taki był rozkaz króla: Nie odpowiadajcie mu."
  tags: []
"Iz36,22":
  text: "Wtedy przełożony domu Eliakim, syn Chilkiasza, pisarz Szebna i kronikarz Joach, syn Asafa, przyszli do Ezechiasza z rozdartymi szatami i oznajmili mu słowa Rabszaka."
  tags: []
