"Iz36,1": "W czternastym roku królowania Ezechiasza Sennacheryb, król Asyrii, wyruszył przeciwko wszystkim warownym miastom Judy i zdobył je."
"Iz36,2": "I król Asyrii posłał Rabszaka z Lakisz do Jerozolimy, do króla Ezechiasza, z wielkim wojskiem. Ten stanął przy kanale górnej sadzawki przy drodze pola folusznika."
"Iz36,3": "Wtedy wyszli do niego Eliakim, syn Chilkiasza, przełożony domu, i Szebna, pisarz, oraz Joach, syn Asafa, kronikarz."
"Iz36,4": "Wtedy Rabszak powiedział do nich: Proszę, powiedzcie Ezechiaszowi: Tak mówi wielki król, król Asyrii: Co to za ufność, na której polegasz?"
"Iz36,5": "Mówisz – ale to słowa daremne – mam dość dużo rad i siły do wojny. Teraz więc w kim pokładasz ufność, że zbuntowałeś się przeciwko mnie?"
"Iz36,6": "Oto opierasz się na tej nadłamanej lasce trzcinowej – na Egipcie – która, gdy ktoś się oprze na niej, wbija mu się w dłoń i przebija ją. Taki jest faraon, król Egiptu, dla wszystkich, którzy mu ufają."
"Iz36,7": "A jeśli mi powiesz: Ufamy PANU, naszemu Bogu, czy on nie jest tym, którego wyżyny i ołtarze zniósł Ezechiasz i nakazał Judzie i Jerozolimie: Przed tym ołtarzem będziecie oddawać pokłon?"
"Iz36,8": "Dlatego teraz proszę, daj zastaw memu panu, królowi Asyrii, a ja dam ci dwa tysiące koni, jeśli zdołasz posadzić na nich jeźdźców."
"Iz36,9": "Jakże więc stawisz opór jednemu dowódcy z najmniejszych sług mego pana, a pokładasz nadzieję w Egipcie, że otrzymasz rydwany i jeźdźców?"
"Iz36,10": "Poza tym czy bez woli PANA wyruszyłem przeciw tej ziemi, aby ją zniszczyć? PAN powiedział do mnie: Wyrusz przeciwko tej ziemi i spustosz ją."
"Iz36,11": "Wtedy Eliakim, Szebna i Joach powiedzieli do Rabszaka: Proszę, mów do swoich sług po syryjsku, bo rozumiemy, a nie mów do nas po hebrajsku wobec ludu, który jest na murze."
"Iz36,12": "Lecz Rabszak odpowiedział: Czy do twego pana i do ciebie posłał mnie mój pan, abym mówił te słowa? Czyż nie do tych mężczyzn siedzących na murze, aby jedli swój kał i pili swój mocz razem z wami?"
"Iz36,13": "Stał więc Rabszak i zawołał donośnym głosem po hebrajsku tymi słowami: Słuchajcie słów wielkiego króla, króla Asyrii."
"Iz36,14": "Tak mówi król: Niech was nie zwodzi Ezechiasz, bo nie będzie mógł was wybawić."
"Iz36,15": "A nie dajcie się przekonać Ezechiaszowi, by zaufać PANU, gdy mówi: Na pewno PAN nas wybawi i to miasto nie będzie wydane w ręce króla Asyrii."
"Iz36,16": "Nie słuchajcie Ezechiasza. Tak bowiem powiedział król Asyrii: Zawrzyjcie ze mną przymierze i wyjdźcie do mnie, a każdy będzie jeść ze swojej winorośli i ze swego drzewa figowego i każdy będzie pić wodę ze swojej studni;"
"Iz36,17": "Aż przyjdę i zabiorę was do ziemi podobnej do waszej ziemi, do ziemi zboża i wina, do ziemi chleba i winnic."
"Iz36,18": "Niech Ezechiasz nie zwodzi was, mówiąc: PAN nas wybawi. Czy bogowie innych narodów mogli wybawić swoją ziemię z ręki króla Asyrii?"
"Iz36,19": "Gdzie są bogowie Chamatu i Arpadu? Gdzie są bogowie Sefarwaim? Czy wybawili Samarię z mojej ręki?"
"Iz36,20": "Którzy spośród wszystkich bogów tych ziem wybawili swoją ziemię z mojej ręki, żeby PAN miał wybawić Jerozolimę z mojej ręki?"
"Iz36,21": "Lecz lud milczał i nie odpowiedział mu ani słowa, bo taki był rozkaz króla: Nie odpowiadajcie mu."
"Iz36,22": "Wtedy przełożony domu Eliakim, syn Chilkiasza, pisarz Szebna i kronikarz Joach, syn Asafa, przyszli do Ezechiasza z rozdartymi szatami i oznajmili mu słowa Rabszaka."
