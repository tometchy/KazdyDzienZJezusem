"Iz6,1": "W roku, w którym umarł król Uzjasz, widziałem Pana siedzącego na wysokim i wyniosłym tronie, a tren jego szaty wypełnił świątynię."
"Iz6,2": "Serafiny stały ponad nim, a każdy z nich miał po sześć skrzydeł: dwoma zakrywał swoją twarz, dwoma przykrywał swoje nogi, a dwoma latał."
"Iz6,3": "I wołał jeden do drugiego: Święty, święty, święty, PAN zastępów. Cała ziemia jest pełna jego chwały."
"Iz6,4": "I filary drzwi poruszyły się od głosu wołającego, a dom napełnił się dymem."
"Iz6,5": "I powiedziałem: Biada mi! Już zginąłem; jestem bowiem człowiekiem o nieczystych wargach i mieszkam wśród ludu o nieczystych wargach, a moje oczy widziały Króla, PANA zastępów."
"Iz6,6": "Wówczas przyleciał do mnie jeden z serafinów, mając w ręku rozżarzony węgiel, który wziął kleszczami z ołtarza;"
"Iz6,7": "I dotknął nim moich ust, i powiedział: Oto ten węgiel dotknął twoich warg; twoja nieprawość jest usunięta, a twój grzech zgładzony."
"Iz6,8": "Potem usłyszałem głos Pana mówiącego: Kogo poślę i kto nam pójdzie? Wtedy odpowiedziałem: Oto jestem, poślij mnie."
"Iz6,9": "A on powiedział: Idź i powiedz temu ludowi: Słuchajcie uważnie, ale nie rozumiejcie, patrzcie uważnie, ale nie poznawajcie."
"Iz6,10": "Zatwardź serce tego ludu, uczyń jego uszy ciężkimi do słuchania i zaślep jego oczy, aby nie widział swoimi oczami, nie słyszał swoimi uszami i nie zrozumiał swoim sercem, aby nie nawrócił się i nie był uzdrowiony."
"Iz6,11": "Wtedy zapytałem: Jak długo, Panie? A on odpowiedział: Aż miasta zostaną spustoszone i bez mieszkańca, domy bez ludzi, a ziemia zostanie doszczętnie spustoszona;"
"Iz6,12": "Aż PAN zapędzi ludzi daleko i będzie wielkie spustoszenie pośród ziemi."
"Iz6,13": "Lecz zostanie w niej dziesiąta część, która powróci i ulegnie zniszczeniu. A jak po ścięciu terebintu lub dębu zostaje pień, tak samo będzie ze świętym potomstwem."
