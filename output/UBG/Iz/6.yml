"Iz6,1":
  text: "W roku, w którym umarł król Uzjasz, widziałem Pana siedzącego na wysokim i wyniosłym tronie, a tren jego szaty wypełnił świątynię."
  tags: []
"Iz6,2":
  text: "Serafiny stały ponad nim, a każdy z nich miał po sześć skrzydeł: dwoma zakrywał swoją twarz, dwoma przykrywał swoje nogi, a dwoma latał."
  tags: []
"Iz6,3":
  text: "I wołał jeden do drugiego: Święty, święty, święty, PAN zastępów. Cała ziemia jest pełna jego chwały."
  tags: []
"Iz6,4":
  text: "I filary drzwi poruszyły się od głosu wołającego, a dom napełnił się dymem."
  tags: []
"Iz6,5":
  text: "I powiedziałem: Biada mi! Już zginąłem; jestem bowiem człowiekiem o nieczystych wargach i mieszkam wśród ludu o nieczystych wargach, a moje oczy widziały Króla, PANA zastępów."
  tags: []
"Iz6,6":
  text: "Wówczas przyleciał do mnie jeden z serafinów, mając w ręku rozżarzony węgiel, który wziął kleszczami z ołtarza;"
  tags: []
"Iz6,7":
  text: "I dotknął nim moich ust, i powiedział: Oto ten węgiel dotknął twoich warg; twoja nieprawość jest usunięta, a twój grzech zgładzony."
  tags: []
"Iz6,8":
  text: "Potem usłyszałem głos Pana mówiącego: Kogo poślę i kto nam pójdzie? Wtedy odpowiedziałem: Oto jestem, poślij mnie."
  tags: []
"Iz6,9":
  text: "A on powiedział: Idź i powiedz temu ludowi: Słuchajcie uważnie, ale nie rozumiejcie, patrzcie uważnie, ale nie poznawajcie."
  tags: []
"Iz6,10":
  text: "Zatwardź serce tego ludu, uczyń jego uszy ciężkimi do słuchania i zaślep jego oczy, aby nie widział swoimi oczami, nie słyszał swoimi uszami i nie zrozumiał swoim sercem, aby nie nawrócił się i nie był uzdrowiony."
  tags: []
"Iz6,11":
  text: "Wtedy zapytałem: Jak długo, Panie? A on odpowiedział: Aż miasta zostaną spustoszone i bez mieszkańca, domy bez ludzi, a ziemia zostanie doszczętnie spustoszona;"
  tags: []
"Iz6,12":
  text: "Aż PAN zapędzi ludzi daleko i będzie wielkie spustoszenie pośród ziemi."
  tags: []
"Iz6,13":
  text: "Lecz zostanie w niej dziesiąta część, która powróci i ulegnie zniszczeniu. A jak po ścięciu terebintu lub dębu zostaje pień, tak samo będzie ze świętym potomstwem."
  tags: []
