"Iz58,1": "Wołaj donośnie, nie wstrzymuj się, podnoś swój głos jak trąba i oznajmij mojemu ludowi ich przestępstwa, a domowi Jakuba ich grzechy."
"Iz58,2": "Mimo że szukają mnie każdego dnia i chcą poznać moje drogi, niczym naród, który czyni sprawiedliwość i nie opuszcza sądu swego Boga. Pytają mnie o sądy sprawiedliwości i pragną zbliżyć się do Boga, mówiąc:"
"Iz58,3": "Czemu pościmy, a tego nie widzisz? Czemu trapimy nasze dusze, a tego nie zauważasz? Oto w dzień waszego postu wykonujecie swoją wolę i żądacie wykonywania wszystkich prac."
"Iz58,4": "Oto pościcie dla kłótni i sporów i aby bić niegodziwą pięścią. Nie pośćcie tak, jak robicie dzisiaj, aby wasz głos był słyszany w górze."
"Iz58,5": "Czy to jest ten post, który wybrałem, dzień, w którym człowiek trapi swoją duszę, żeby zwiesić swoją głowę jak sitowie i słać sobie posłanie z wora i popiołu? Czyż to nazwiesz postem i dniem przyjemnym dla PANA?"
"Iz58,6": "Czy nie to jest tym postem, który wybrałem: rozerwać więzy niegodziwości, rozwiązać ciężkie brzemiona, puścić wolno uciśnionych i połamać wszelkie jarzmo;"
"Iz58,7": "Dzielić swój chleb z głodnym i ubogich wygnańców wprowadzić do swego domu, a widząc nagiego, przyodziać go i nie ukrywać się przed nikim, kto jest twoim ciałem?"
"Iz58,8": "Wtedy twoje światło zabłyśnie jak poranna zorza i twoje zdrowie szybko zakwitnie. Twoja sprawiedliwość pójdzie przed tobą i chwała PANA będzie za tobą."
"Iz58,9": "Wtedy będziesz wzywał, a PAN wysłucha; zawołasz, a odpowie: Oto jestem. Jeśli usuniesz spośród siebie jarzmo, przestaniesz wytykać palcem i mówić nieprawości;"
"Iz58,10": "Jeśli otworzysz swoją duszę głodnemu i nasycisz duszę utrapioną, wtedy twoje światło wzejdzie wśród ciemności, a twój zmierzch będzie jak południe."
"Iz58,11": "I PAN nieustannie będzie cię prowadził i nasyci twoją duszę w czasie suszy, i utuczy twoje kości. I będziesz jak nawodniony ogród i jak źródło wody, którego wody nie ustają."
"Iz58,12": "Twoi potomni odbudują starodawne ruiny, wzniesiesz fundamenty wielu pokoleń i nazwą cię naprawcą wyłomów i odnowicielem ścieżek na zamieszkanie."
"Iz58,13": "Jeśli powstrzymasz swoją nogę od przekraczania szabatu, aby nie wykonać swojej woli w moim świętym dniu; jeśli nazwiesz szabat rozkoszą, dzień święty PANA – szanownym; jeśli go uczcisz, nie czyniąc swoich spraw ani nie wykonując swojej woli, ani nie mówiąc słowa próżnego;"
"Iz58,14": "Wtedy będziesz rozkoszował się PANEM, a wprowadzę cię na wysokie miejsca ziemi i nakarmię cię dziedzictwem Jakuba, twego ojca. Tak bowiem powiedziały usta PANA."
