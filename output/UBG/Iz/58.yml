"Iz58,1":
  text: "Wołaj donośnie, nie wstrzymuj się, podnoś swój głos jak trąba i oznajmij mojemu ludowi ich przestępstwa, a domowi Jakuba ich grzechy."
  tags: []
"Iz58,2":
  text: "Mimo że szukają mnie każdego dnia i chcą poznać moje drogi, niczym naród, który czyni sprawiedliwość i nie opuszcza sądu swego Boga. Pytają mnie o sądy sprawiedliwości i pragną zbliżyć się do Boga, mówiąc:"
  tags: []
"Iz58,3":
  text: "Czemu pościmy, a tego nie widzisz? Czemu trapimy nasze dusze, a tego nie zauważasz? Oto w dzień waszego postu wykonujecie swoją wolę i żądacie wykonywania wszystkich prac."
  tags: []
"Iz58,4":
  text: "Oto pościcie dla kłótni i sporów i aby bić niegodziwą pięścią. Nie pośćcie tak, jak robicie dzisiaj, aby wasz głos był słyszany w górze."
  tags: []
"Iz58,5":
  text: "Czy to jest ten post, który wybrałem, dzień, w którym człowiek trapi swoją duszę, żeby zwiesić swoją głowę jak sitowie i słać sobie posłanie z wora i popiołu? Czyż to nazwiesz postem i dniem przyjemnym dla PANA?"
  tags: []
"Iz58,6":
  text: "Czy nie to jest tym postem, który wybrałem: rozerwać więzy niegodziwości, rozwiązać ciężkie brzemiona, puścić wolno uciśnionych i połamać wszelkie jarzmo;"
  tags: []
"Iz58,7":
  text: "Dzielić swój chleb z głodnym i ubogich wygnańców wprowadzić do swego domu, a widząc nagiego, przyodziać go i nie ukrywać się przed nikim, kto jest twoim ciałem?"
  tags: []
"Iz58,8":
  text: "Wtedy twoje światło zabłyśnie jak poranna zorza i twoje zdrowie szybko zakwitnie. Twoja sprawiedliwość pójdzie przed tobą i chwała PANA będzie za tobą."
  tags: []
"Iz58,9":
  text: "Wtedy będziesz wzywał, a PAN wysłucha; zawołasz, a odpowie: Oto jestem. Jeśli usuniesz spośród siebie jarzmo, przestaniesz wytykać palcem i mówić nieprawości;"
  tags: []
"Iz58,10":
  text: "Jeśli otworzysz swoją duszę głodnemu i nasycisz duszę utrapioną, wtedy twoje światło wzejdzie wśród ciemności, a twój zmierzch będzie jak południe."
  tags: []
"Iz58,11":
  text: "I PAN nieustannie będzie cię prowadził i nasyci twoją duszę w czasie suszy, i utuczy twoje kości. I będziesz jak nawodniony ogród i jak źródło wody, którego wody nie ustają."
  tags: []
"Iz58,12":
  text: "Twoi potomni odbudują starodawne ruiny, wzniesiesz fundamenty wielu pokoleń i nazwą cię naprawcą wyłomów i odnowicielem ścieżek na zamieszkanie."
  tags: []
"Iz58,13":
  text: "Jeśli powstrzymasz swoją nogę od przekraczania szabatu, aby nie wykonać swojej woli w moim świętym dniu; jeśli nazwiesz szabat rozkoszą, dzień święty PANA – szanownym; jeśli go uczcisz, nie czyniąc swoich spraw ani nie wykonując swojej woli, ani nie mówiąc słowa próżnego;"
  tags: []
"Iz58,14":
  text: "Wtedy będziesz rozkoszował się PANEM, a wprowadzę cię na wysokie miejsca ziemi i nakarmię cię dziedzictwem Jakuba, twego ojca. Tak bowiem powiedziały usta PANA."
  tags: []
