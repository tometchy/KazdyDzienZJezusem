"Iz65,1":
  text: "Objawiłem się tym, którzy o mnie nie pytali, zostałem znaleziony przez tych, którzy mnie nie szukali. Do narodu, który się nie nazywał moim imieniem, mówiłem: Oto jestem, oto jestem."
  tags: []
"Iz65,2":
  text: "Cały dzień wyciągałem swoje ręce do ludu buntowniczego, który kroczy drogą niedobrą, za własnymi myślami;"
  tags: []
"Iz65,3":
  text: "Do ludu, który stale i zuchwale pobudza mnie do gniewu, składając ofiary w ogrodach i paląc kadzidło na cegłach;"
  tags: []
"Iz65,4":
  text: "Który przesiaduje na grobach i nocuje przy swoich bożkach, który je mięso wieprzowe, a obrzydliwa polewka jest w jego naczyniach;"
  tags: []
"Iz65,5":
  text: "I mówi: Odsuń się, nie zbliżaj się do mnie, bo jestem świętszy od ciebie. On jest dymem w moich nozdrzach i ogniem płonącym przez cały dzień."
  tags: []
"Iz65,6":
  text: "Oto zapisano to przede mną. Nie zamilknę, ale oddam i odpłacę im w zanadrzu;"
  tags: []
"Iz65,7":
  text: "Za wasze nieprawości i nieprawości waszych ojców, mówi PAN, którzy palili kadzidło na górach i hańbili mnie na pagórkach; dlatego wymierzę im w zanadrze za ich dawne czyny."
  tags: []
"Iz65,8":
  text: "Tak mówi PAN: Jak wtedy, gdy znajduje się wino w kiści i mówi się: Nie psuj go, bo w nim jest błogosławieństwo, tak i ja uczynię przez wzgląd na moje sługi – nie zniszczę ich wszystkich."
  tags: []
"Iz65,9":
  text: "Bo wywiodę z Jakuba potomstwo, a z Judy dziedzica moich gór. Moi wybrani posiądą je i moi słudzy będą tam mieszkać."
  tags: []
"Iz65,10":
  text: "A Szaron stanie się pastwiskiem dla owiec, a dolina Akor legowiskiem dla wołów – to dla mojego ludu, który mnie szukał."
  tags: []
"Iz65,11":
  text: "Ale was, którzy opuściliście PANA, którzy zapominacie o mojej świętej górze, którzy zastawiacie stół dla tego wojska i składacie ofiary z płynów temu mnóstwu;"
  tags: []
"Iz65,12":
  text: "Was przeznaczę pod miecz i wy wszyscy schylicie się na rzeź, ponieważ wołałem, a nie odezwaliście się, mówiłem, a nie słyszeliście, ale czyniliście to, co złe w moich oczach, i wybraliście to, co mi się nie podobało."
  tags: []
"Iz65,13":
  text: "Dlatego tak mówi Pan BÓG: Oto moi słudzy będą jeść, a wy będziecie głodni. Oto moi słudzy będą pić, a wy będziecie spragnieni. Oto moi słudzy będą się radować, a wy będziecie zawstydzeni."
  tags: []
"Iz65,14":
  text: "Oto moi słudzy będą śpiewać z radości serca, a wy będziecie krzyczeć z boleści serca i zawodzić z powodu zrozpaczonego ducha."
  tags: []
"Iz65,15":
  text: "I zostawicie swoje imię moim wybranym na przekleństwo, gdyż Pan BÓG zabije was, a swoje sługi nazwie innym imieniem."
  tags: []
"Iz65,16":
  text: "Ten, który będzie sobie błogosławił na ziemi, będzie sobie błogosławił w Bogu prawdziwym, a kto będzie przysięgał na ziemi, będzie przysięgał na Boga prawdziwego, bo dawne uciski pójdą w zapomnienie i będą zakryte przed moimi oczami."
  tags: []
"Iz65,17":
  text: "Oto bowiem stworzę nowe niebiosa i nową ziemię i nie będą wspominane pierwsze rzeczy ani nie przyjdą na myśl."
  tags: []
"Iz65,18":
  text: "Lecz weselcie się i radujcie na wieki wieków z tego, co ja stworzę, bo oto stworzę Jerozolimę radością i jej lud weselem."
  tags: []
"Iz65,19":
  text: "I będę się radować z powodu Jerozolimy i weselić z powodu mojego ludu, a nie będzie już słychać w nim głosu płaczu ani narzekania."
  tags: []
"Iz65,20":
  text: "Nie będzie tam już ani niemowlęcia żyjącego tylko kilka dni, ani starca, który by nie dożył swoich dni, bo dziecko umrze jako stuletni, ale grzesznik, choćby miał i sto lat, będzie przeklęty."
  tags: []
"Iz65,21":
  text: "Pobudują też domy i będą w nich mieszkać, zasadzą winnice i będą jeść z nich owoce."
  tags: []
"Iz65,22":
  text: "Nie będą budować, by ktoś inny tam mieszkał, nie będą sadzić, by ktoś inny jadł, bo dni mojego ludu będą jak dni drzewa i moi wybrani długo będą korzystać z dzieła swoich rąk."
  tags: []
"Iz65,23":
  text: "Nie będą trudzić się na próżno ani rodzić, aby się bać, gdyż są potomstwem błogosławionym przez PANA, oni i ich potomkowie wraz z nimi."
  tags: []
"Iz65,24":
  text: "I będzie tak, że zanim zawołają, ja się odezwę, gdy jeszcze będą mówić, ja wysłucham."
  tags: []
"Iz65,25":
  text: "Wilk z barankiem paść się będą razem, lew jak wół będzie jeść słomę i proch będzie pokarmem węża. Nie będą szkodzić ani niszczyć na całej mojej świętej górze, mówi PAN."
  tags: []
