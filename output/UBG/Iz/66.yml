"Iz66,1":
  text: "Tak mówi PAN: Niebo jest moim tronem, a ziemia podnóżkiem moich stóp. Gdzie więc będzie ten dom, który mi zbudujecie? Gdzie będzie miejsce mego odpoczynku?"
  tags: []
"Iz66,2":
  text: "Bo to wszystko moja ręka uczyniła i dzięki niej powstało to wszystko, mówi PAN. Lecz ja patrzę na tego, który jest ubogi i skruszony w duchu i który drży na moje słowo."
  tags: []
"Iz66,3":
  text: "Ten, kto zabija wołu na ofiarę, to jakby zabił człowieka; kto zabija na ofiarę barana, to jakby ściął psu głowę; kto przynosi ofiarę, to jakby ofiarował krew świni; kto pali kadzidło, to jakby błogosławił bożkowi. Lecz jak oni wybrali sobie swoje drogi i ich dusza ma upodobanie w obrzydliwościach;"
  tags: []
"Iz66,4":
  text: "Tak i ja wybiorę ich zmyślenia i sprowadzę na nich to, czego się boją, ponieważ gdy wołałem, nikt się nie odezwał, gdy mówiłem, nie słuchali, ale czynili to, co złe w moich oczach, i wybrali to, co mi się nie podobało."
  tags: []
"Iz66,5":
  text: "Słuchajcie słowa PANA, wy, którzy drżycie na jego słowo. Wasi bracia, którzy was nienawidzą, którzy wypędzają was ze względu na moje imię, mówią: Niech PAN pokaże swoją chwałę. Ukaże się jednak dla waszej radości, a oni będą zawstydzeni."
  tags: []
"Iz66,6":
  text: "Odgłos zgiełku z miasta, głos ze świątyni, głos PANA oddającego zapłatę swoim wrogom."
  tags: []
"Iz66,7":
  text: "Zanim odczuła bóle porodu, urodziła, zanim ogarnął ją ból, urodziła chłopca."
  tags: []
"Iz66,8":
  text: "Kto słyszał o czymś takim? Kto widział coś podobnego? Czy ziemia może urodzić w jednym dniu? Czy naród rodzi się od razu? Ale Syjon ledwie zaczął odczuwać bóle, a już urodził swoich synów."
  tags: []
"Iz66,9":
  text: "Czyżbym ja, który otwieram łono, nie doprowadził do rodzenia? – mówi PAN. Czyżbym ja, który doprowadzam do rodzenia, zamknął łono? – mówi twój Bóg."
  tags: []
"Iz66,10":
  text: "Weselcie się z Jerozolimą i radujcie się z nią wszyscy, którzy ją miłujecie. Cieszcie się z nią wielce wszyscy, którzy nad nią płaczecie;"
  tags: []
"Iz66,11":
  text: "Aby ssać do syta z piersi jej pociech; abyście ssali i rozkoszowali się pełnią jej chwały."
  tags: []
"Iz66,12":
  text: "Tak bowiem mówi PAN: Oto skieruję do niej pokój jak rzekę i chwałę narodów jak strumień wezbrany. Wtedy będziecie ssać, będziecie noszeni na rękach i pieszczeni na kolanach."
  tags: []
"Iz66,13":
  text: "Jak tego, którego pociesza matka, tak ja was będę pocieszał; i tak w Jerozolimie doznacie pociechy."
  tags: []
"Iz66,14":
  text: "Ujrzycie to i rozraduje się wasze serce, a wasze kości zakwitną jak trawa. I będzie rozpoznana ręka PANA wobec jego sług, a jego gniew – wobec jego wrogów."
  tags: []
"Iz66,15":
  text: "Oto bowiem PAN przyjdzie w ogniu, a jego rydwany będą jak wicher, by wylać zapalczywość swego gniewu i ukazać swoją grozę w płomieniu ognia;"
  tags: []
"Iz66,16":
  text: "Gdyż PAN będzie sądził ogniem i mieczem wszelkie ciało, a wielu będzie pobitych przez PANA."
  tags: []
"Iz66,17":
  text: "I ci, którzy się uświęcają i oczyszczają w środku ogrodów, jeden za drugim, którzy jedzą mięso wieprzowe oraz inną obrzydliwość, a także myszy, wszyscy razem zginą – mówi PAN."
  tags: []
"Iz66,18":
  text: "Ja znam bowiem ich uczynki i myśli. I przyjdzie czas, że zgromadzę wszystkie narody i języki, a one przyjdą i ujrzą moją chwałę."
  tags: []
"Iz66,19":
  text: "I ustanowię wśród nich znak i wyślę ocalałych spośród nich do narodów do Tarszisz, Pul i Lud, a tych, którzy naciągają łuk – do Tubala i Jawan, do wysp dalekich, które nic o mnie nie słyszały i nie widziały mojej chwały; i będą głosić moją chwałę wśród narodów."
  tags: []
"Iz66,20":
  text: "I przyprowadzą wszystkich waszych braci jako dar dla PANA ze wszystkich narodów, na koniach, na rydwanach, w lektykach, na mułach i na wielbłądach, na moją świętą górę, do Jerozolimy, mówi PAN, tak jak synowie Izraela przynoszą dar w czystym naczyniu do domu PANA."
  tags: []
"Iz66,21":
  text: "I z nich także wezmę sobie kapłanów i Lewitów, mówi PAN."
  tags: []
"Iz66,22":
  text: "Jak bowiem to nowe niebo i ta nowa ziemia, które ja uczynię, będą trwać przede mną, mówi PAN, tak będzie trwać wasze potomstwo i wasze imię."
  tags: []
"Iz66,23":
  text: "I stanie się tak, że od nowiu do nowiu księżyca i od szabatu do szabatu przychodzić będzie wszelkie ciało, aby oddać pokłon przede mną, mówi PAN."
  tags: []
"Iz66,24":
  text: "I gdy wyjdą, zobaczą trupy ludzi, którzy wystąpili przeciwko mnie. Ich robak bowiem nie zdechnie i ich ogień nie zgaśnie, i będą obrzydliwością dla wszelkiego ciała."
  tags: []
