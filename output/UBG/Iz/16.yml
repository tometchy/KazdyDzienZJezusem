"Iz16,1":
  text: "Poślijcie baranki, władcy ziemi, od Sela aż do pustyni, do góry córki Syjonu."
  tags: []
"Iz16,2":
  text: "Bo inaczej jak ptak wędrowny i z gniazda wypłoszony będą córki Moabu przy brodach Arnonu."
  tags: []
"Iz16,3":
  text: "Naradź się, rozstrzygnij sprawę; rozłóż swój cień w pełne południe jak w nocy; ukryj wygnańców, nie wydawaj tułacza."
  tags: []
"Iz16,4":
  text: "Niech mieszkają u ciebie moi wygnańcy, Moabie; bądź ich schronieniem przed grabieżcą. Ustanie bowiem gnębiciel, przeminie grabieżca, a ciemięzca zostanie zgładzony z ziemi."
  tags: []
"Iz16,5":
  text: "I tron będzie utwierdzony dzięki miłosierdziu; zasiądzie na nim w prawdzie, w przybytku Dawida, ten, który będzie sądził i dbał o prawo, i niezwłocznie wymierzy sprawiedliwość."
  tags: []
"Iz16,6":
  text: "Słyszeliśmy o pysze Moabu, że jest bardzo pyszny, o jego zuchwałości, wyniosłości i gniewie. Lecz jego zamiary nie dojdą do skutku."
  tags: []
"Iz16,7":
  text: "Dlatego Moab będzie zawodzić nad Moabem, wszyscy będą zawodzić. Nad gruntami miasta Kir-Chareset będą wzdychać, mówiąc: Już są zniszczone."
  tags: []
"Iz16,8":
  text: "Spustoszone są bowiem pola Cheszbonu i winorośl Sibmy. Władcy narodów stratowali najwyborniejsze jej latorośle, które sięgały aż do Jazer, a szerzyły się na pustyni; jej latorośle rozłożyły się i przeszły morze."
  tags: []
"Iz16,9":
  text: "Dlatego jak opłakuję Jazer, będę opłakiwał winorośl Sibmy. Zroszę cię swymi łzami, Cheszbonie i Eleale, bo na twój letni owoc i na twoje żniwo padł okrzyk wojenny."
  tags: []
"Iz16,10":
  text: "Znikło wesele i znikła radość z urodzajnego pola; w winnicach nie będzie śpiewania ani okrzyku. Nie będzie się tłoczyć wina w tłoczniach; powstrzymałem okrzyki."
  tags: []
"Iz16,11":
  text: "Dlatego moje wnętrze będzie jęczeć nad Moabem jak harfa, a moje serce nad Kir-Chares."
  tags: []
"Iz16,12":
  text: "I stanie się, gdy się okaże, że Moab się męczył na wyżynie, że wejdzie on do swojej świątyni, aby się modlić, ale nie przemoże."
  tags: []
"Iz16,13":
  text: "To jest słowo, które PAN niegdyś powiedział o Moabie."
  tags: []
"Iz16,14":
  text: "Ale teraz PAN powiedział: Po trzech latach, liczonych jak lata najemnika, chwała Moabu zostanie wzgardzona wraz z całym jego wielkim tłumem, a jego resztka będzie bardzo mała i bezsilna."
  tags: []
