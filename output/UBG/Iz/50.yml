"Iz50,1":
  text: "Tak mówi PAN: Gdzie jest list rozwodowy waszej matki, którym ją oddaliłem? Albo któremu ze swoich wierzycieli was sprzedałem? Oto z powodu waszych nieprawości sami siebie sprzedaliście, a z powodu waszych przestępstw wasza matka została oddalona."
  tags: []
"Iz50,2":
  text: "Dlaczego gdy przyszedłem, nie było nikogo? A gdy wołałem, nikt się nie odezwał? Czy moja ręka jest zbyt krótka, aby odkupić? Czy nie ma we mnie mocy, aby wybawić? Oto swoją groźbą osuszam morze, zamieniam rzeki w pustynię, tak że ich ryby śmierdzą z braku wody i zdychają z pragnienia."
  tags: []
"Iz50,3":
  text: "Powlekam niebiosa ciemnością i wór im daję za osłonę."
  tags: []
"Iz50,4":
  text: "Pan BÓG dał mi język uczonych, abym umiał znużonemu mówić słowo w odpowiednim czasie. Budzi mnie każdego ranka, pobudza moje uszy, abym słuchał tak jak uczeni."
  tags: []
"Iz50,5":
  text: "Pan BÓG otworzył mi uszy, a ja się nie sprzeciwiłem ani się nie cofnąłem."
  tags: []
"Iz50,6":
  text: "Podałem moje plecy bijącym, a moje policzki rwącym mi brodę. Nie zakrywałem mojej twarzy przed zniewagami i pluciem."
  tags: []
"Iz50,7":
  text: "Bo Pan BÓG wspomoże mnie, dlatego nie będę zhańbiony. Dlatego uczyniłem swoją twarz jak krzemień i wiem, że nie będę zawstydzony."
  tags: []
"Iz50,8":
  text: "Blisko jest ten, który mnie usprawiedliwia. Kto będzie się spierać ze mną? Stańmy razem. Kto chce prawować się ze mną, niech przystąpi do mnie."
  tags: []
"Iz50,9":
  text: "Oto Pan BÓG pomoże mi; któż mnie potępi? Oto wszyscy jak szata się zestarzeją, a mól ich pożre."
  tags: []
"Iz50,10":
  text: "Kto wśród was boi się PANA? Kto słucha głosu jego sługi? Kto chodzi w ciemności i nie ma światłości? Niech zaufa imieniu PANA i polega na swoim Bogu."
  tags: []
"Iz50,11":
  text: "Oto wy wszyscy, którzy rozniecacie ogień i przepasujecie się iskrami, chodźcie w światłości waszego ognia i w iskrach, które rozpaliliście. Spotka was to z mojej ręki, że będziecie leżeć w boleści."
  tags: []
