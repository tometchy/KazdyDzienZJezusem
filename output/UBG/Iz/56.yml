"Iz56,1": "Tak mówi PAN: Strzeżcie sądu i czyńcie sprawiedliwość, bo bliskie jest nadejście mojego zbawienia i objawienie się mojej sprawiedliwości."
"Iz56,2": "Błogosławiony człowiek, który to czyni, i syn człowieczy, który się tego trzyma, który przestrzega szabatu, aby go nie bezcześcić, który strzeże swej ręki, aby nie czyniła nic złego."
"Iz56,3": "Niech więc nie mówi cudzoziemiec, który przyłączył się do PANA: PAN na pewno odłączył mnie od swego ludu. Niech też eunuch nie mówi: Oto jestem suchym drzewem."
"Iz56,4": "Tak bowiem mówi PAN o eunuchach, którzy przestrzegają moich szabatów i wybierają to, co mi się podoba, i trzymają się mojego przymierza:"
"Iz56,5": "Dam im miejsce w swoim domu i w swoich murach oraz imię lepsze od synów i córek; dam im imię wieczne, które nie będzie zgładzone."
"Iz56,6": "A cudzoziemców, którzy przyłączyli się do PANA, aby mu służyć, miłować imię PANA i być jego sługami, wszystkich przestrzegających szabatu, by go nie bezcześcić, i trzymających się mojego przymierza;"
"Iz56,7": "Tych przyprowadzę na swoją świętą górę i rozraduję ich w swoim domu modlitwy. Ich całopalenia i ofiary będą przyjęte na moim ołtarzu, bo mój dom będzie nazywany domem modlitwy dla wszystkich narodów."
"Iz56,8": "Tak mówi Pan BÓG, który gromadzi rozproszonych z Izraela: Jeszcze innych zgromadzę do niego i do jego zgromadzonych."
"Iz56,9": "Wszystkie zwierzęta polne, przyjdźcie na żer, i wy, wszystkie zwierzęta leśne."
"Iz56,10": "Jego stróżowie są ślepi wszyscy, nic nie wiedzą, wszyscy są niemymi psami, nie mogą szczekać; są ospali, leżą, kochają drzemać."
"Iz56,11": "A są to psy żarłoczne i nienasycone; są to pasterze niezdolni do zrozumienia. Wszyscy udali się w swoją drogę, każdy w swoim miejscu szuka własnego zysku, mówiąc:"
"Iz56,12": "Przyjdźcie, wezmę wino i upijemy się mocnym napojem; jutro będzie tak jak dziś i jeszcze bardziej obficie."
