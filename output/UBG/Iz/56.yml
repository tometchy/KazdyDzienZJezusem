"Iz56,1":
  text: "Tak mówi PAN: Strzeżcie sądu i czyńcie sprawiedliwość, bo bliskie jest nadejście mojego zbawienia i objawienie się mojej sprawiedliwości."
  tags: []
"Iz56,2":
  text: "Błogosławiony człowiek, który to czyni, i syn człowieczy, który się tego trzyma, który przestrzega szabatu, aby go nie bezcześcić, który strzeże swej ręki, aby nie czyniła nic złego."
  tags: []
"Iz56,3":
  text: "Niech więc nie mówi cudzoziemiec, który przyłączył się do PANA: PAN na pewno odłączył mnie od swego ludu. Niech też eunuch nie mówi: Oto jestem suchym drzewem."
  tags: []
"Iz56,4":
  text: "Tak bowiem mówi PAN o eunuchach, którzy przestrzegają moich szabatów i wybierają to, co mi się podoba, i trzymają się mojego przymierza:"
  tags: []
"Iz56,5":
  text: "Dam im miejsce w swoim domu i w swoich murach oraz imię lepsze od synów i córek; dam im imię wieczne, które nie będzie zgładzone."
  tags: []
"Iz56,6":
  text: "A cudzoziemców, którzy przyłączyli się do PANA, aby mu służyć, miłować imię PANA i być jego sługami, wszystkich przestrzegających szabatu, by go nie bezcześcić, i trzymających się mojego przymierza;"
  tags: []
"Iz56,7":
  text: "Tych przyprowadzę na swoją świętą górę i rozraduję ich w swoim domu modlitwy. Ich całopalenia i ofiary będą przyjęte na moim ołtarzu, bo mój dom będzie nazywany domem modlitwy dla wszystkich narodów."
  tags: []
"Iz56,8":
  text: "Tak mówi Pan BÓG, który gromadzi rozproszonych z Izraela: Jeszcze innych zgromadzę do niego i do jego zgromadzonych."
  tags: []
"Iz56,9":
  text: "Wszystkie zwierzęta polne, przyjdźcie na żer, i wy, wszystkie zwierzęta leśne."
  tags: []
"Iz56,10":
  text: "Jego stróżowie są ślepi wszyscy, nic nie wiedzą, wszyscy są niemymi psami, nie mogą szczekać; są ospali, leżą, kochają drzemać."
  tags: []
"Iz56,11":
  text: "A są to psy żarłoczne i nienasycone; są to pasterze niezdolni do zrozumienia. Wszyscy udali się w swoją drogę, każdy w swoim miejscu szuka własnego zysku, mówiąc:"
  tags: []
"Iz56,12":
  text: "Przyjdźcie, wezmę wino i upijemy się mocnym napojem; jutro będzie tak jak dziś i jeszcze bardziej obficie."
  tags: []
