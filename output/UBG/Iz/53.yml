"Iz53,1":
  text: "Któż uwierzył naszemu głoszeniu, a komu jest objawione ramię PANA?"
  tags: []
"Iz53,2":
  text: "Wyrósł bowiem przed nim jak latorośl i jak korzeń z suchej ziemi. Nie miał kształtu ani urody; i gdy widzieliśmy go, nie było wyglądu, który by się nam podobał."
  tags: []
"Iz53,3":
  text: "Wzgardzony i odrzucony przez ludzi; mąż boleści i doświadczony cierpieniem. I przed nim ukrywaliśmy jakby swoją twarz; wzgardzony tak, że mieliśmy go za nic."
  tags: []
"Iz53,4":
  text: "Zaprawdę on wziął na siebie nasze cierpienia i nosił naszą boleść. A my uważaliśmy, że jest zraniony, uderzony przez Boga i utrapiony."
  tags: []
"Iz53,5":
  text: "Lecz on był zraniony za nasze występki, starty za nasze nieprawości. Kara dla naszego pokoju była na nim, a jego ranami zostaliśmy uzdrowieni."
  tags: []
"Iz53,6":
  text: "Wszyscy jak owce zbłądziliśmy, każdy z nas zboczył na swą drogę, a PAN włożył na niego nieprawość nas wszystkich."
  tags: []
"Iz53,7":
  text: "Uciśniony i gnębiony, ale nie otworzył swoich ust. Jak baranek na rzeź prowadzony i jak owca przed tymi, którzy ją strzygą, zamilkł i nie otworzył swoich ust."
  tags: []
"Iz53,8":
  text: "Został zabrany z więzienia i z sądu. Kto wypowie jego pokolenie? Został bowiem wyrwany z ziemi żyjących i zraniony za przestępstwo mojego ludu."
  tags: []
"Iz53,9":
  text: "I wyznaczono mu grób z niegodziwcami, a z bogaczami była jego śmierć, choć nieprawości nie uczynił ani nie znaleziono fałszu w jego ustach."
  tags: []
"Iz53,10":
  text: "Lecz spodobało się PANU zetrzeć go i zgnębić. A po złożeniu swojej duszy na ofiarę za grzech, ujrzy swoje potomstwo, przedłuży swoje dni i to, co się podoba PANU, przez jego rękę szczęśliwie się spełni."
  tags: []
"Iz53,11":
  text: "Z udręki swojej duszy ujrzy owoc i nasyci się. Mój sprawiedliwy sługa swoim poznaniem usprawiedliwi wielu, bo sam poniesie ich nieprawości."
  tags: []
"Iz53,12":
  text: "Dlatego dam mu dział wśród wielkich, aby dzielił się zdobyczami z mocarzami, ponieważ wylał swoją duszę na śmierć. Został zaliczony do przestępców, sam poniósł grzech wielu i wstawił się za przestępcami."
  tags: []
