"Iz15,1":
  text: "Brzemię Moabu. Ponieważ w nocy Ar-Moab został zburzony i spustoszony, ponieważ w nocy Kir-Moab został zburzony i spustoszony;"
  tags: []
"Iz15,2":
  text: "Wstąpił do Bajit i do Dibonu, na wyżyny, by płakać. Moab będzie lamentować nad Nebo i Medebą; wszystkie ich głowy będą ogolone, a każda broda będzie obcięta."
  tags: []
"Iz15,3":
  text: "Na jego ulicach przepasują się worem; na jego dachach i placach każdy będzie zawodził, rozpływając się we łzach."
  tags: []
"Iz15,4":
  text: "Cheszbon i Eleale będą krzyczeć, a ich głos będzie słychać aż w Jahaza. Dlatego uzbrojeni wojownicy Moabu będą biadać, a dusza każdego rozrzewni się w sobie."
  tags: []
"Iz15,5":
  text: "Moje serce jęczy nad Moabem, jego uchodźcy uciekną aż do Zoar jak jałowica trzyletnia; bo drogą pod górę do Luchit pójdą z płaczem, a na drodze do Choronaim podniosą krzyk z powodu klęski."
  tags: []
"Iz15,6":
  text: "Wody Nimrim staną się bowiem pustkowiem, bo trawa uschła, zieleń zwiędła, nie ma nic zielonego."
  tags: []
"Iz15,7":
  text: "Dlatego swój majątek i to, co zgromadzili, przenoszą nad Potok Wierzbowy."
  tags: []
"Iz15,8":
  text: "Bo krzyk obiega granicę Moabu, aż do Eglaim jego lament i aż do Beer-Elim jego zawodzenie;"
  tags: []
"Iz15,9":
  text: "Ponieważ wody Dimonu będą pełne krwi, gdyż sprowadzę na Dimon jeszcze więcej – lwy na tych, którzy uszli z Moabu i na resztkę tej ziemi."
  tags: []
