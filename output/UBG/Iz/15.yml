"Iz15,1": "Brzemię Moabu. Ponieważ w nocy Ar-Moab został zburzony i spustoszony, ponieważ w nocy Kir-Moab został zburzony i spustoszony;"
"Iz15,2": "Wstąpił do Bajit i do Dibonu, na wyżyny, by płakać. Moab będzie lamentować nad Nebo i Medebą; wszystkie ich głowy będą ogolone, a każda broda będzie obcięta."
"Iz15,3": "Na jego ulicach przepasują się worem; na jego dachach i placach każdy będzie zawodził, rozpływając się we łzach."
"Iz15,4": "Cheszbon i Eleale będą krzyczeć, a ich głos będzie słychać aż w Jahaza. Dlatego uzbrojeni wojownicy Moabu będą biadać, a dusza każdego rozrzewni się w sobie."
"Iz15,5": "Moje serce jęczy nad Moabem, jego uchodźcy uciekną aż do Zoar jak jałowica trzyletnia; bo drogą pod górę do Luchit pójdą z płaczem, a na drodze do Choronaim podniosą krzyk z powodu klęski."
"Iz15,6": "Wody Nimrim staną się bowiem pustkowiem, bo trawa uschła, zieleń zwiędła, nie ma nic zielonego."
"Iz15,7": "Dlatego swój majątek i to, co zgromadzili, przenoszą nad Potok Wierzbowy."
"Iz15,8": "Bo krzyk obiega granicę Moabu, aż do Eglaim jego lament i aż do Beer-Elim jego zawodzenie;"
"Iz15,9": "Ponieważ wody Dimonu będą pełne krwi, gdyż sprowadzę na Dimon jeszcze więcej – lwy na tych, którzy uszli z Moabu i na resztkę tej ziemi."
