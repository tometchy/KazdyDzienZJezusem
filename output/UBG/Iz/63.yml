"Iz63,1":
  text: "Kim jest ten, który przybywa z Edomu, w farbowanych szatach z Bosry? Ten wspaniały w swoich szatach, kroczący w swojej wielkiej mocy? To ja jestem, który mówię w sprawiedliwości, potężny w wybawieniu."
  tags: []
"Iz63,2":
  text: "Dlaczego twoja odzież jest czerwona? A twoje szaty jak u tego, który tłoczy w prasie?"
  tags: []
"Iz63,3":
  text: "Sam jeden tłoczyłem prasę i spośród ludu nie było ze mną nikogo. Tłoczyłem go w swoim gniewie i deptałem go w swojej zapalczywości, aż pryskała jego krew na moje szaty, poplamiłem całą swą odzież."
  tags: []
"Iz63,4":
  text: "Dzień pomsty był bowiem w moim sercu, a rok moich odkupionych nadszedł."
  tags: []
"Iz63,5":
  text: "Rozglądałem się, ale nie było pomocnika, zdumiałem się, że nikogo nie było, kto by mnie podparł. Dlatego moje ramię przyniosło mi zbawienie, a moja zapalczywość – ona mnie podparła."
  tags: []
"Iz63,6":
  text: "Zdeptałem narody w swoim gniewie, upoiłem je w swojej zapalczywości i uderzyłem o ziemię ich mocarzy."
  tags: []
"Iz63,7":
  text: "Będę wspominać miłosierdzie PANA i chwałę PANA za wszystko, co nam PAN wyświadczył, i za wielką dobroć, którą okazał domowi Izraela według swego miłosierdzia i według swojej wielkiej łaskawości."
  tags: []
"Iz63,8":
  text: "Powiedział bowiem: Na pewno są moim ludem, synami, którzy mi się nie sprzeniewierzą. I tak stał się ich Zbawicielem."
  tags: []
"Iz63,9":
  text: "We wszelkim ich ucisku i on był uciśniony, a Anioł jego oblicza zbawił ich. W swojej miłości i litości on ich odkupił. Troszczył się o nich i nosił ich przez wszystkie dni wieków."
  tags: []
"Iz63,10":
  text: "Ale oni się zbuntowali i zasmucili jego Świętego Ducha. Dlatego zamienił się w ich wroga i walczył przeciwko nim."
  tags: []
"Iz63,11":
  text: "Wówczas wspomniał dawne dni, Mojżesza i jego lud, mówiąc: Gdzież jest ten, który ich wyprowadził z morza, z pasterzem swojej trzody? Gdzież jest ten, który włożył w jego wnętrze swego Świętego Ducha?"
  tags: []
"Iz63,12":
  text: "Który prowadził ich prawicą Mojżesza dzięki swemu chwalebnemu ramieniu i rozdzielił wody przed nimi, aby uczynić sobie wieczne imię?"
  tags: []
"Iz63,13":
  text: "Który ich przeprowadził przez głębiny, jak konia na pustyni, tak że się nie potknęli?"
  tags: []
"Iz63,14":
  text: "Jak bydło schodzące w dolinę tak Duch PANA spokojnie ich prowadził. Tak prowadziłeś swój lud, aby uczynić sobie chwalebne imię."
  tags: []
"Iz63,15":
  text: "Spójrz z nieba i popatrz z przybytku swojej świętości i chwały. Gdzie twoja gorliwość i twoja wielka siła? Gdzie poruszenie twoich uczuć i litości przede mną? Czy powstrzymałeś je?"
  tags: []
"Iz63,16":
  text: "Przecież ty jesteś naszym ojcem, bo Abraham nas nie zna, a Izrael nas nie uznaje. Ty, PANIE, jesteś naszym ojcem, naszym Odkupicielem; twoje imię jest od wieków."
  tags: []
"Iz63,17":
  text: "Czemu, PANIE, pozwoliłeś nam zboczyć z twoich dróg i zatwardziłeś nasze serce, abyśmy się ciebie nie bali? Odwróć się ze względu na twoje sługi, pokolenia twego dziedzictwa."
  tags: []
"Iz63,18":
  text: "Lud posiadł ją na krótki czas, nasi wrogowie zaś zdeptali twoją świątynię."
  tags: []
"Iz63,19":
  text: "My jesteśmy twoi. Nad nimi nigdy nie panowałeś ani nie byli nazywani twoim imieniem."
  tags: []
