"Iz63,1": "Kim jest ten, który przybywa z Edomu, w farbowanych szatach z Bosry? Ten wspaniały w swoich szatach, kroczący w swojej wielkiej mocy? To ja jestem, który mówię w sprawiedliwości, potężny w wybawieniu."
"Iz63,2": "Dlaczego twoja odzież jest czerwona? A twoje szaty jak u tego, który tłoczy w prasie?"
"Iz63,3": "Sam jeden tłoczyłem prasę i spośród ludu nie było ze mną nikogo. Tłoczyłem go w swoim gniewie i deptałem go w swojej zapalczywości, aż pryskała jego krew na moje szaty, poplamiłem całą swą odzież."
"Iz63,4": "Dzień pomsty był bowiem w moim sercu, a rok moich odkupionych nadszedł."
"Iz63,5": "Rozglądałem się, ale nie było pomocnika, zdumiałem się, że nikogo nie było, kto by mnie podparł. Dlatego moje ramię przyniosło mi zbawienie, a moja zapalczywość – ona mnie podparła."
"Iz63,6": "Zdeptałem narody w swoim gniewie, upoiłem je w swojej zapalczywości i uderzyłem o ziemię ich mocarzy."
"Iz63,7": "Będę wspominać miłosierdzie PANA i chwałę PANA za wszystko, co nam PAN wyświadczył, i za wielką dobroć, którą okazał domowi Izraela według swego miłosierdzia i według swojej wielkiej łaskawości."
"Iz63,8": "Powiedział bowiem: Na pewno są moim ludem, synami, którzy mi się nie sprzeniewierzą. I tak stał się ich Zbawicielem."
"Iz63,9": "We wszelkim ich ucisku i on był uciśniony, a Anioł jego oblicza zbawił ich. W swojej miłości i litości on ich odkupił. Troszczył się o nich i nosił ich przez wszystkie dni wieków."
"Iz63,10": "Ale oni się zbuntowali i zasmucili jego Świętego Ducha. Dlatego zamienił się w ich wroga i walczył przeciwko nim."
"Iz63,11": "Wówczas wspomniał dawne dni, Mojżesza i jego lud, mówiąc: Gdzież jest ten, który ich wyprowadził z morza, z pasterzem swojej trzody? Gdzież jest ten, który włożył w jego wnętrze swego Świętego Ducha?"
"Iz63,12": "Który prowadził ich prawicą Mojżesza dzięki swemu chwalebnemu ramieniu i rozdzielił wody przed nimi, aby uczynić sobie wieczne imię?"
"Iz63,13": "Który ich przeprowadził przez głębiny, jak konia na pustyni, tak że się nie potknęli?"
"Iz63,14": "Jak bydło schodzące w dolinę tak Duch PANA spokojnie ich prowadził. Tak prowadziłeś swój lud, aby uczynić sobie chwalebne imię."
"Iz63,15": "Spójrz z nieba i popatrz z przybytku swojej świętości i chwały. Gdzie twoja gorliwość i twoja wielka siła? Gdzie poruszenie twoich uczuć i litości przede mną? Czy powstrzymałeś je?"
"Iz63,16": "Przecież ty jesteś naszym ojcem, bo Abraham nas nie zna, a Izrael nas nie uznaje. Ty, PANIE, jesteś naszym ojcem, naszym Odkupicielem; twoje imię jest od wieków."
"Iz63,17": "Czemu, PANIE, pozwoliłeś nam zboczyć z twoich dróg i zatwardziłeś nasze serce, abyśmy się ciebie nie bali? Odwróć się ze względu na twoje sługi, pokolenia twego dziedzictwa."
"Iz63,18": "Lud posiadł ją na krótki czas, nasi wrogowie zaś zdeptali twoją świątynię."
"Iz63,19": "My jesteśmy twoi. Nad nimi nigdy nie panowałeś ani nie byli nazywani twoim imieniem."
