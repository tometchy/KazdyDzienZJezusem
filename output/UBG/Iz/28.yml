"Iz28,1": "Biada koronie pychy, pijakom Efraima, których wspaniała ozdoba jest więdnącym kwiatem rosnącym na szczycie urodzajnych dolin odurzonych winem!"
"Iz28,2": "Oto ktoś od Pana, mocny i silny, jak burza gradowa, jak niszcząca nawałnica, jak ulewa gwałtownych rwących wód, rzuci ją na ziemię swoją ręką."
"Iz28,3": "Zostanie zdeptana nogami korona pychy, pijacy Efraima."
"Iz28,4": "A wspaniała ozdoba, która jest na szczycie urodzajnej doliny, będzie więdnącym kwiatem jak przed latem wczesny owoc; kto go tylko zobaczy, weźmie do ręki i zje."
"Iz28,5": "W tym dniu PAN zastępów będzie koroną chwały i diademem ozdoby dla resztki swojego ludu;"
"Iz28,6": "Duchem sądu dla zasiadającego w sądzie i mocą dla tych, którzy odpierają atak aż do bramy."
"Iz28,7": "Ale również ci od wina błądzą i od mocnego napoju zataczają się. Kapłan i prorok błądzą od mocnego napoju, utonęli w winie, zataczają się od mocnego napoju, błądzą w widzeniach, potykają się w sądzie."
"Iz28,8": "Wszystkie ich stoły bowiem są pełne wymiotów i plugastwa, tak że nie ma czystego miejsca."
"Iz28,9": "Kogo ma uczyć poznania? Komu ma wyjaśnić naukę? Czyż odstawionym od mleka i odłożonym od piersi?"
"Iz28,10": "Ponieważ podaje się przykazanie za przykazaniem, przykazanie za przykazaniem, przepis za przepisem, przepis za przepisem, trochę tu, trochę tam."
"Iz28,11": "Bo wargami jąkających się i obcym językiem będę mówił do tego ludu."
"Iz28,12": "A gdy im powiedział: To jest odpoczynek, dajcie odpocząć spracowanemu; to jest wytchnienie. Ale oni nie chcieli słuchać."
"Iz28,13": "I słowo PANA będzie im: przykazanie za przykazaniem, przykazanie za przykazaniem, przepis za przepisem, przepis za przepisem, trochę tu, trochę tam, po to, aby szli, padli na wznak i rozbili się, aby zostali uwikłani i pojmani."
"Iz28,14": "Dlatego słuchajcie słowa PANA, wy, mężowie szyderczy, panujący nad tym ludem, który jest w Jerozolimie."
"Iz28,15": "Ponieważ mówicie: Zawarliśmy przymierze ze śmiercią i z piekłem mamy układ; gdy przejdzie bicz gwałtowny, nie dosięgnie nas, gdyż kłamstwo uczyniliśmy naszą ucieczką i skryliśmy się za fałszem;"
"Iz28,16": "Dlatego tak powiedział Pan BÓG: Oto kładę jako grunt na Syjonie kamień, kamień wypróbowany, węgielny, drogocenny, utwierdzony fundament. Kto uwierzy, nie pospieszy się."
"Iz28,17": "A wykonam sąd według sznura, a sprawiedliwość według pionu. I grad zmiecie schronienie kłamstw, a wody zaleją kryjówkę."
"Iz28,18": "Wasze przymierze ze śmiercią zostanie zerwane, a wasz układ z piekłem nie ostoi się; gdy ten bicz gwałtowny przejdzie, zostaniecie przez niego zdeptani."
"Iz28,19": "Jak tylko zacznie przechodzić, pochwyci was, bo każdego poranka będzie przechodzić, dniem i nocą. Sam tylko postrach zaprowadzi was do zrozumienia tego, co słyszeliście;"
"Iz28,20": "Bo łóżko będzie za krótkie, aby się na nim rozciągnąć, przykrycie zbyt wąskie, by się nim owinąć."
"Iz28,21": "PAN bowiem powstanie jak na górze Perazym i rozgniewa się jak w dolinie Gibeon, aby dokonać swego dzieła, swego niezwykłego dzieła, aby dokończyć swoje zadanie, swoje niezwykłe zadanie."
"Iz28,22": "Teraz więc nie naśmiewajcie się, aby wasze węzły nie zacisnęły się mocniej, gdyż słyszałem od Pana, BOGA zastępów, że postanowione jest zniszczenie na całej ziemi."
"Iz28,23": "Nadstawcie uszu, posłuchajcie mego głosu; bądźcie uważni, słuchajcie mojej mowy."
"Iz28,24": "Czyż oracz codziennie orze, aby siać? Czy robi bruzdy i bronuje swoją rolę?"
"Iz28,25": "Czyż gdy wyrówna jej powierzchnię, nie rozsiewa czarnuszki, nie rozsiewa kminu i nie obsiewa pszenicą wyborną, jęczmieniem przednim i orkiszem w odpowiednich miejscach?"
"Iz28,26": "Jego Bóg uczy go roztropności i poucza go."
"Iz28,27": "Czarnuszki bowiem nie młóci się saniami młockarskimi ani nie przetacza się koła wozu po kminku; ale kijem wybija się czarnuszkę, a kminek – laską."
"Iz28,28": "Pszenicę młóci się, ale nie bez końca, i nie pociera jej kołem wozu ani jej nie kruszy zaprzęgiem."
"Iz28,29": "I to także pochodzi od PANA zastępów, który jest cudowny w radzie i wielki w działaniu."
