"Iz28,1":
  text: "Biada koronie pychy, pijakom Efraima, których wspaniała ozdoba jest więdnącym kwiatem rosnącym na szczycie urodzajnych dolin odurzonych winem!"
  tags: []
"Iz28,2":
  text: "Oto ktoś od Pana, mocny i silny, jak burza gradowa, jak niszcząca nawałnica, jak ulewa gwałtownych rwących wód, rzuci ją na ziemię swoją ręką."
  tags: []
"Iz28,3":
  text: "Zostanie zdeptana nogami korona pychy, pijacy Efraima."
  tags: []
"Iz28,4":
  text: "A wspaniała ozdoba, która jest na szczycie urodzajnej doliny, będzie więdnącym kwiatem jak przed latem wczesny owoc; kto go tylko zobaczy, weźmie do ręki i zje."
  tags: []
"Iz28,5":
  text: "W tym dniu PAN zastępów będzie koroną chwały i diademem ozdoby dla resztki swojego ludu;"
  tags: []
"Iz28,6":
  text: "Duchem sądu dla zasiadającego w sądzie i mocą dla tych, którzy odpierają atak aż do bramy."
  tags: []
"Iz28,7":
  text: "Ale również ci od wina błądzą i od mocnego napoju zataczają się. Kapłan i prorok błądzą od mocnego napoju, utonęli w winie, zataczają się od mocnego napoju, błądzą w widzeniach, potykają się w sądzie."
  tags: []
"Iz28,8":
  text: "Wszystkie ich stoły bowiem są pełne wymiotów i plugastwa, tak że nie ma czystego miejsca."
  tags: []
"Iz28,9":
  text: "Kogo ma uczyć poznania? Komu ma wyjaśnić naukę? Czyż odstawionym od mleka i odłożonym od piersi?"
  tags: []
"Iz28,10":
  text: "Ponieważ podaje się przykazanie za przykazaniem, przykazanie za przykazaniem, przepis za przepisem, przepis za przepisem, trochę tu, trochę tam."
  tags: []
"Iz28,11":
  text: "Bo wargami jąkających się i obcym językiem będę mówił do tego ludu."
  tags: []
"Iz28,12":
  text: "A gdy im powiedział: To jest odpoczynek, dajcie odpocząć spracowanemu; to jest wytchnienie. Ale oni nie chcieli słuchać."
  tags: []
"Iz28,13":
  text: "I słowo PANA będzie im: przykazanie za przykazaniem, przykazanie za przykazaniem, przepis za przepisem, przepis za przepisem, trochę tu, trochę tam, po to, aby szli, padli na wznak i rozbili się, aby zostali uwikłani i pojmani."
  tags: []
"Iz28,14":
  text: "Dlatego słuchajcie słowa PANA, wy, mężowie szyderczy, panujący nad tym ludem, który jest w Jerozolimie."
  tags: []
"Iz28,15":
  text: "Ponieważ mówicie: Zawarliśmy przymierze ze śmiercią i z piekłem mamy układ; gdy przejdzie bicz gwałtowny, nie dosięgnie nas, gdyż kłamstwo uczyniliśmy naszą ucieczką i skryliśmy się za fałszem;"
  tags: []
"Iz28,16":
  text: "Dlatego tak powiedział Pan BÓG: Oto kładę jako grunt na Syjonie kamień, kamień wypróbowany, węgielny, drogocenny, utwierdzony fundament. Kto uwierzy, nie pospieszy się."
  tags: []
"Iz28,17":
  text: "A wykonam sąd według sznura, a sprawiedliwość według pionu. I grad zmiecie schronienie kłamstw, a wody zaleją kryjówkę."
  tags: []
"Iz28,18":
  text: "Wasze przymierze ze śmiercią zostanie zerwane, a wasz układ z piekłem nie ostoi się; gdy ten bicz gwałtowny przejdzie, zostaniecie przez niego zdeptani."
  tags: []
"Iz28,19":
  text: "Jak tylko zacznie przechodzić, pochwyci was, bo każdego poranka będzie przechodzić, dniem i nocą. Sam tylko postrach zaprowadzi was do zrozumienia tego, co słyszeliście;"
  tags: []
"Iz28,20":
  text: "Bo łóżko będzie za krótkie, aby się na nim rozciągnąć, przykrycie zbyt wąskie, by się nim owinąć."
  tags: []
"Iz28,21":
  text: "PAN bowiem powstanie jak na górze Perazym i rozgniewa się jak w dolinie Gibeon, aby dokonać swego dzieła, swego niezwykłego dzieła, aby dokończyć swoje zadanie, swoje niezwykłe zadanie."
  tags: []
"Iz28,22":
  text: "Teraz więc nie naśmiewajcie się, aby wasze węzły nie zacisnęły się mocniej, gdyż słyszałem od Pana, BOGA zastępów, że postanowione jest zniszczenie na całej ziemi."
  tags: []
"Iz28,23":
  text: "Nadstawcie uszu, posłuchajcie mego głosu; bądźcie uważni, słuchajcie mojej mowy."
  tags: []
"Iz28,24":
  text: "Czyż oracz codziennie orze, aby siać? Czy robi bruzdy i bronuje swoją rolę?"
  tags: []
"Iz28,25":
  text: "Czyż gdy wyrówna jej powierzchnię, nie rozsiewa czarnuszki, nie rozsiewa kminu i nie obsiewa pszenicą wyborną, jęczmieniem przednim i orkiszem w odpowiednich miejscach?"
  tags: []
"Iz28,26":
  text: "Jego Bóg uczy go roztropności i poucza go."
  tags: []
"Iz28,27":
  text: "Czarnuszki bowiem nie młóci się saniami młockarskimi ani nie przetacza się koła wozu po kminku; ale kijem wybija się czarnuszkę, a kminek – laską."
  tags: []
"Iz28,28":
  text: "Pszenicę młóci się, ale nie bez końca, i nie pociera jej kołem wozu ani jej nie kruszy zaprzęgiem."
  tags: []
"Iz28,29":
  text: "I to także pochodzi od PANA zastępów, który jest cudowny w radzie i wielki w działaniu."
  tags: []
