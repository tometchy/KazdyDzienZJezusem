"Iz7,1":
  text: "Za czasów Achaza, syna Jotama, syna Uzjasza, króla Judy, wyruszył Resin, król Syrii, wraz z Pekachem, synem Remaliasza, królem Izraela, przeciw Jerozolimie, aby z nią walczyć, lecz nie mógł jej zdobyć."
  tags: []
"Iz7,2":
  text: "I doniesiono domowi Dawida: Syria zmówiła się z Efraimem. Wtedy zadrżało jego serce i serce jego ludu, jak drżą od wiatru drzewa w lesie."
  tags: []
"Iz7,3":
  text: "Wtedy PAN powiedział do Izajasza: Wyjdź teraz naprzeciw Achaza, ty i Szear-Jaszub, twój syn, na koniec kanału górnej sadzawki przy drodze pola folusznika;"
  tags: []
"Iz7,4":
  text: "I powiedz mu: Uważaj i bądź spokojny; nie bój się i niech twoje serce nie lęka się z powodu dwóch niedopałków dymiących głowni, z powodu zapalczywego gniewu Resina z Syrią oraz syna Remaliasza."
  tags: []
"Iz7,5":
  text: "A ponieważ Syria, Efraim i syn Remaliasza uknuli przeciwko tobie zło, mówiąc:"
  tags: []
"Iz7,6":
  text: "Wyruszmy przeciw Judzie i nastraszmy ją, zróbmy sobie w niej wyłom i ustanówmy w niej królem syna Tabeela;"
  tags: []
"Iz7,7":
  text: "Tak mówi Pan BÓG: Nie stanie się to i nie dojdzie do tego."
  tags: []
"Iz7,8":
  text: "Głową Syrii bowiem jest Damaszek, a głową Damaszku Resin; a po sześćdziesięciu pięciu latach Efraim będzie tak rozbity, że już nie będzie ludem."
  tags: []
"Iz7,9":
  text: "A głową Efraima jest Samaria, głową zaś Samarii – syn Remaliasza. Jeśli nie uwierzycie, na pewno się nie ostoicie."
  tags: []
"Iz7,10":
  text: "Ponadto PAN powiedział do Achaza:"
  tags: []
"Iz7,11":
  text: "Proś dla siebie o znak od PANA, twego Boga, czy to z głębin, czy wysoko w górze."
  tags: []
"Iz7,12":
  text: "Wtedy Achaz odpowiedział: Nie będę prosił PANA ani wystawiał go na próbę."
  tags: []
"Iz7,13":
  text: "A on powiedział: Posłuchaj teraz, domu Dawida! Czy mało wam naprzykrzać się ludziom, że naprzykrzacie się także mojemu Bogu?"
  tags: []
"Iz7,14":
  text: "Dlatego sam Pan da wam znak. Oto dziewica pocznie i urodzi syna, i nazwie go Emmanuel."
  tags: []
"Iz7,15":
  text: "Będzie on jadł masło i miód, aż będzie umiał odrzucać zło, a wybierać dobro."
  tags: []
"Iz7,16":
  text: "Zanim bowiem to dziecko będzie umiało odrzucać zło i wybierać dobro, ziemia, którą się brzydzisz, zostanie opuszczona przez dwóch swoich królów."
  tags: []
"Iz7,17":
  text: "PAN sprowadzi na ciebie, na twój lud i na dom twego ojca dni, jakich nie było od dnia, w którym Efraim odstąpił od Judy – za sprawą króla Asyrii."
  tags: []
"Iz7,18":
  text: "I stanie się w tym dniu, że PAN zaświszcze na muchy, które są na krańcach rzek Egiptu, i na pszczoły, które są w ziemi Asyrii."
  tags: []
"Iz7,19":
  text: "I przybędą, i wszystkie obsiądą puste doliny i rozpadliny skalne, wszelkie krzaki kolczaste i wszelkie krzewy."
  tags: []
"Iz7,20":
  text: "W tym dniu Pan ogoli wynajętą brzytwą – tymi, którzy są za rzeką, czyli królem Asyrii – głowę i włosy na nogach, także i brodę obetnie."
  tags: []
"Iz7,21":
  text: "I stanie się w tym dniu, że człowiek będzie hodował jedną krowę i dwie owce."
  tags: []
"Iz7,22":
  text: "A dzięki obfitemu udojowi mleka będzie jadł masło. Każdy bowiem, kto pozostanie w ziemi, będzie jadł masło i miód."
  tags: []
"Iz7,23":
  text: "Stanie się też w tym dniu, że każde miejsce, gdzie rosło tysiąc winorośli wartości tysiąca srebrników, zarośnie ostem i cierniem."
  tags: []
"Iz7,24":
  text: "Wtedy ze strzałami i z łukiem będą tam chodzić, bo cała ziemia zarośnie ostem i cierniem."
  tags: []
"Iz7,25":
  text: "A na wszystkie góry, które uprawiano motyką, nie dojdzie strach przed ostem i cierniem. Ale będą przeznaczone na pastwisko dla wołów i do deptania przez trzodę."
  tags: []
