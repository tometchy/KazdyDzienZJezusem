"Iz31,1":
  text: "Biada tym, którzy zstępują do Egiptu po pomoc, polegają na koniach i ufają rydwanom, bo jest ich wiele, i jeźdźcom, bo są bardzo silni, a nie patrzą na Świętego Izraela i nie szukają PANA!"
  tags: []
"Iz31,2":
  text: "Ale on też jest mądry, dlatego sprowadzi zło, a swoich słów nie cofnie. Lecz powstanie przeciw domowi złoczyńców i przeciwko pomocy tych, którzy czynią nieprawość."
  tags: []
"Iz31,3":
  text: "Przecież Egipcjanie są ludźmi, a nie Bogiem, ich konie są ciałem, a nie duchem. Gdy więc PAN wyciągnie swą rękę, padnie i ten, co pomaga, padnie i ten, któremu on pomaga, i tak wszyscy razem zginą."
  tags: []
"Iz31,4":
  text: "Tak bowiem PAN powiedział do mnie: Jak ryczy lew lub lwiątko nad swym łupem, choć zwoła się przeciwko niemu gromadę pasterzy i nie lęka się ich wrzasku ani nie kuli się przed ich hałasem, tak zstąpi PAN zastępów, aby walczyć o górę Syjon i o jej pagórek."
  tags: []
"Iz31,5":
  text: "Jak ptaki latają koło swego gniazda, tak PAN zastępów obroni Jerozolimę; owszem, obroni i wybawi, a przechodząc, zachowa."
  tags: []
"Iz31,6":
  text: "Nawróćcie się do tego, od którego synowie Izraela mocno odstąpili."
  tags: []
"Iz31,7":
  text: "Tego dnia bowiem każdy porzuci swoje bożki ze srebra i swoje bożki ze złota, które wasze ręce uczyniły wam na grzech."
  tags: []
"Iz31,8":
  text: "Wtedy Asyryjczyk padnie od miecza, lecz nie człowieka walecznego, a miecz nieludzki pochłonie go. I ucieknie przed mieczem, a jego młodzieńcy będą podbici."
  tags: []
"Iz31,9":
  text: "Swoją twierdzę ominie ze strachu, a jego książęta ulękną się sztandaru, mówi PAN, którego ogień jest na Syjonie, a jego piec – w Jerozolimie."
  tags: []
