"Iz4,1": "W tym dniu siedem kobiet uchwyci się jednego mężczyzny, mówiąc: Będziemy jadły swój chleb i ubierały się we własne ubranie, tylko niech zwiemy się twoim imieniem, odejmij od nas hańbę."
"Iz4,2": "W ten dzień latorośl PANA będzie piękna i chwalebna, a owoc ziemi wyborny i wspaniały dla ocalałych spośród Izraela."
"Iz4,3": "I stanie się tak, że ten, kto zostanie na Syjonie, i ten, kto pozostanie w Jerozolimie, będą nazwani świętymi – każdy, kto jest zapisany wśród żywych w Jerozolimie;"
"Iz4,4": "Gdy PAN obmyje brud córek Syjonu i oczyści duchem sądu i duchem wypalenia krew Jerozolimy z jej wnętrza."
"Iz4,5": "I PAN stworzy nad każdym miejscem zamieszkania góry Syjon i nad każdym jej zgromadzeniem obłok i dym za dnia, a blask płonącego ognia w nocy. Nad całą chwałą bowiem będzie osłona."
"Iz4,6": "I będzie namiot, by za dnia dawać cień w upale; na schronienie i ukrycie przed burzą i deszczem."
