"Iz4,1":
  text: "W tym dniu siedem kobiet uchwyci się jednego mężczyzny, mówiąc: Będziemy jadły swój chleb i ubierały się we własne ubranie, tylko niech zwiemy się twoim imieniem, odejmij od nas hańbę."
  tags: []
"Iz4,2":
  text: "W ten dzień latorośl PANA będzie piękna i chwalebna, a owoc ziemi wyborny i wspaniały dla ocalałych spośród Izraela."
  tags: []
"Iz4,3":
  text: "I stanie się tak, że ten, kto zostanie na Syjonie, i ten, kto pozostanie w Jerozolimie, będą nazwani świętymi – każdy, kto jest zapisany wśród żywych w Jerozolimie;"
  tags: []
"Iz4,4":
  text: "Gdy PAN obmyje brud córek Syjonu i oczyści duchem sądu i duchem wypalenia krew Jerozolimy z jej wnętrza."
  tags: []
"Iz4,5":
  text: "I PAN stworzy nad każdym miejscem zamieszkania góry Syjon i nad każdym jej zgromadzeniem obłok i dym za dnia, a blask płonącego ognia w nocy. Nad całą chwałą bowiem będzie osłona."
  tags: []
"Iz4,6":
  text: "I będzie namiot, by za dnia dawać cień w upale; na schronienie i ukrycie przed burzą i deszczem."
  tags: []
