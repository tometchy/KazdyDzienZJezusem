"Iz62,1":
  text: "Ze względu na Syjon nie będę milczeć, ze względu na Jerozolimę nie spocznę, dopóki jego sprawiedliwość nie wzejdzie jak blask i jego zbawienie nie zapłonie jak pochodnia."
  tags: []
"Iz62,2":
  text: "I ujrzą narody twoją sprawiedliwość i wszyscy królowie – twoją chwałę. I nazwą cię nowym imieniem, które usta PANA ustalą."
  tags: []
"Iz62,3":
  text: "I będziesz koroną chwały w ręku PANA i królewskim diademem w ręce twego Boga."
  tags: []
"Iz62,4":
  text: "Nie będą cię więcej zwać Opuszczoną ani twoja ziemia nie będzie więcej nazwana Spustoszoną. Ale ty będziesz nazywana Chefsiba, a twoja ziemia Beula, bo PAN ma w tobie upodobanie i twoja ziemia będzie poślubiona."
  tags: []
"Iz62,5":
  text: "Jak bowiem młodzieniec poślubia dziewicę, tak twoi synowie cię poślubią. I jak oblubieniec raduje się z oblubienicy, tak twój Bóg będzie się radować z ciebie."
  tags: []
"Iz62,6":
  text: "Na twoich murach, Jerozolimo, postawiłem stróżów, którzy przez cały dzień i całą noc nigdy nie zamilkną. Wy, którzy wspominacie PANA, nie milczcie;"
  tags: []
"Iz62,7":
  text: "I nie dajcie mu odpoczynku, dopóki nie utwierdzi i dopóki nie uczyni Jerozolimy chwałą na ziemi."
  tags: []
"Iz62,8":
  text: "PAN przysiągł na swoją prawicę i na ramię swojej mocy: Nie wydam już twojej pszenicy na pokarm twoim wrogom, a synowie cudzoziemców nie będą pić twego wina, przy którym się trudziłaś."
  tags: []
"Iz62,9":
  text: "Ale ci, którzy je zgromadzą, będą je spożywać i chwalić PANA; a ci, którzy je zbierają, będą je pić w dziedzińcach mojej świątyni."
  tags: []
"Iz62,10":
  text: "Przechodźcie, przechodźcie przez bramy! Torujcie drogę ludowi; wyrównajcie, wyrównajcie gościńce; usuwajcie kamienie, podnieście sztandar dla narodów."
  tags: []
"Iz62,11":
  text: "Oto PAN rozkaże wołać aż po krańce ziemi: Powiedzcie córce Syjonu: Oto nadchodzi twój Zbawiciel, oto jego zapłata z nim, a jego dzieło przed nim."
  tags: []
"Iz62,12":
  text: "Twoich synów nazwą Ludem Świętym, Odkupionymi PANA, a ciebie nazwą Poszukiwaną, Miastem Nieopuszczonym."
  tags: []
