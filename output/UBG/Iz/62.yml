"Iz62,1": "Ze względu na Syjon nie będę milczeć, ze względu na Jerozolimę nie spocznę, dopóki jego sprawiedliwość nie wzejdzie jak blask i jego zbawienie nie zapłonie jak pochodnia."
"Iz62,2": "I ujrzą narody twoją sprawiedliwość i wszyscy królowie – twoją chwałę. I nazwą cię nowym imieniem, które usta PANA ustalą."
"Iz62,3": "I będziesz koroną chwały w ręku PANA i królewskim diademem w ręce twego Boga."
"Iz62,4": "Nie będą cię więcej zwać Opuszczoną ani twoja ziemia nie będzie więcej nazwana Spustoszoną. Ale ty będziesz nazywana Chefsiba, a twoja ziemia Beula, bo PAN ma w tobie upodobanie i twoja ziemia będzie poślubiona."
"Iz62,5": "Jak bowiem młodzieniec poślubia dziewicę, tak twoi synowie cię poślubią. I jak oblubieniec raduje się z oblubienicy, tak twój Bóg będzie się radować z ciebie."
"Iz62,6": "Na twoich murach, Jerozolimo, postawiłem stróżów, którzy przez cały dzień i całą noc nigdy nie zamilkną. Wy, którzy wspominacie PANA, nie milczcie;"
"Iz62,7": "I nie dajcie mu odpoczynku, dopóki nie utwierdzi i dopóki nie uczyni Jerozolimy chwałą na ziemi."
"Iz62,8": "PAN przysiągł na swoją prawicę i na ramię swojej mocy: Nie wydam już twojej pszenicy na pokarm twoim wrogom, a synowie cudzoziemców nie będą pić twego wina, przy którym się trudziłaś."
"Iz62,9": "Ale ci, którzy je zgromadzą, będą je spożywać i chwalić PANA; a ci, którzy je zbierają, będą je pić w dziedzińcach mojej świątyni."
"Iz62,10": "Przechodźcie, przechodźcie przez bramy! Torujcie drogę ludowi; wyrównajcie, wyrównajcie gościńce; usuwajcie kamienie, podnieście sztandar dla narodów."
"Iz62,11": "Oto PAN rozkaże wołać aż po krańce ziemi: Powiedzcie córce Syjonu: Oto nadchodzi twój Zbawiciel, oto jego zapłata z nim, a jego dzieło przed nim."
"Iz62,12": "Twoich synów nazwą Ludem Świętym, Odkupionymi PANA, a ciebie nazwą Poszukiwaną, Miastem Nieopuszczonym."
