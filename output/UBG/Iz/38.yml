"Iz38,1":
  text: "W tych dniach Ezechiasz śmiertelnie zachorował. Przyszedł do niego prorok Izajasz, syn Amosa, i powiedział do niego: Tak mówi PAN: Uporządkuj swój dom, bo umrzesz i nie będziesz żył."
  tags: []
"Iz38,2":
  text: "Wtedy Ezechiasz odwrócił swoją twarz do ściany i modlił się do PANA;"
  tags: []
"Iz38,3":
  text: "I powiedział: O PANIE, proszę cię, wspomnij teraz, że postępowałem wobec ciebie w prawdzie i z doskonałym sercem, czyniąc to, co dobre w twoich oczach. I Ezechiasz płakał bardzo rzewnie."
  tags: []
"Iz38,4":
  text: "Wtedy doszło do Izajasza słowo PANA:"
  tags: []
"Iz38,5":
  text: "Idź i powiedz Ezechiaszowi: Tak mówi PAN, Bóg Dawida, twego ojca: Wysłuchałem twojej modlitwy, widziałem twoje łzy. Oto dodam do twoich dni piętnaście lat;"
  tags: []
"Iz38,6":
  text: "Wybawię cię i to miasto z ręki króla Asyrii i będę bronić tego miasta."
  tags: []
"Iz38,7":
  text: "A taki będzie znak dla ciebie od PANA, że PAN uczyni to, o czym mówił:"
  tags: []
"Iz38,8":
  text: "Oto cofnę cień o dziesięć stopni w stopniach, po których przesunął się na zegarze słonecznym Achaza. I cofnęło się słońce o dziesięć stopni w tych stopniach, po których przesunęło się."
  tags: []
"Iz38,9":
  text: "(Oto pismo Ezechiasza, króla Judy, gdy zachorował i wyzdrowiał:"
  tags: []
"Iz38,10":
  text: "Mówiłem, gdy skrócono moje dni: Zejdę do bram grobu, zostanę pozbawiony reszty swoich lat."
  tags: []
"Iz38,11":
  text: "Powiedziałem: Nie ujrzę PANA, PANA w ziemi żyjących. Już nie zobaczę człowieka pośród mieszkańców świata."
  tags: []
"Iz38,12":
  text: "Moje życie przeminęło i przenoszone jest ode mnie jak namiot pasterski. Odciąłem swoje życie jak tkacz, on mnie odetnie od krosien. Dziś, zanim noc nadejdzie, zakończysz mnie."
  tags: []
"Iz38,13":
  text: "Rozmyślałem sobie o poranku, że jak lew on zmiażdży wszystkie moje kości. Dziś, zanim noc nadejdzie, wykończysz mnie."
  tags: []
"Iz38,14":
  text: "Jak żuraw i jaskółka kwiliłem, gruchałem jak gołąb. Moje oczy słabną, patrzą w górę. PANIE, cierpię w udręce, przedłuż mi życie."
  tags: []
"Iz38,15":
  text: "Cóż powiem? On przemówił do mnie i sam to uczynił. Będę kroczyć przez wszystkie swoje lata z goryczą w swojej duszy."
  tags: []
"Iz38,16":
  text: "Panie, przez te rzeczy ludzie żyją i w nich wszystkich jest życie mego ducha. Przecież przywróciłeś mi zdrowie i zachowałeś mnie przy życiu."
  tags: []
"Iz38,17":
  text: "Oto w czasie pokoju zaznałem ciężkiej goryczy, ale z miłości do mojej duszy wyrwałeś ją z dołu zniszczenia, gdyż rzuciłeś za siebie wszystkie moje grzechy."
  tags: []
"Iz38,18":
  text: "Grób bowiem nie wysławia cię ani śmierć cię nie chwali. Ci, którzy w dół zstępują, nie oczekują twojej prawdy."
  tags: []
"Iz38,19":
  text: "Żywy, żywy będzie cię wysławiać jak ja dzisiaj. Ojciec oznajmi dzieciom twoją prawdę."
  tags: []
"Iz38,20":
  text: "PAN zechciał mnie wybawić. Dlatego będziemy śpiewać moje pieśni przy dźwiękach strun po wszystkie dni naszego życia w domu PANA)."
  tags: []
"Iz38,21":
  text: "Izajasz bowiem powiedział: Niech wezmą bryłę suchych fig i przyłożą na wrzód, a będzie uzdrowiony."
  tags: []
"Iz38,22":
  text: "Ezechiasz zaś powiedział: Jaki jest znak, że wejdę do domu PANA?"
  tags: []
