"Iz51,1": "Słuchajcie mnie, wy, którzy podążacie za sprawiedliwością, którzy szukacie PANA. Spójrzcie na skałę, z której was wyciosano i na głębokość dołu, skąd was wykopano."
"Iz51,2": "Spójrzcie na Abrahama, waszego ojca, i na Sarę, która was porodziła, gdyż jego jednego wezwałem, pobłogosławiłem i rozmnożyłem."
"Iz51,3": "PAN bowiem pocieszy Syjon, pocieszy wszystkie jego ruiny i uczyni jego pustkowia jak Eden, a jego pustynię jak ogród PANA. Znajdzie się w nim radość i wesele, dziękczynienie i głos śpiewania."
"Iz51,4": "Słuchaj mnie, mój ludu, nadstaw ucha, mój narodzie. Ode mnie bowiem wyjdzie prawo, a wystawię mój sąd jako światłość dla narodów."
"Iz51,5": "Bliska jest moja sprawiedliwość, wyszło moje zbawienie, a moje ramiona będą sądzić narody. Wyspy będą mnie oczekiwać i w moim ramieniu będą pokładać nadzieję."
"Iz51,6": "Podnieście ku niebu swoje oczy i spójrzcie na dół, na ziemię: Niebiosa jak dym się rozwieją i ziemia jak szata się zestarzeje, a jej mieszkańcy zginą jak one. Ale moje zbawienie będzie trwać na wieki i moja sprawiedliwość nie ustanie."
"Iz51,7": "Słuchajcie mnie, wy, którzy znacie sprawiedliwość, ludu, w którego sercu jest moje prawo! Nie bójcie się urągania ludzi i nie lękajcie się ich lżenia."
"Iz51,8": "Mól bowiem pożre ich jak szatę, a robak pogryzie ich jak wełnę. Ale moja sprawiedliwość będzie trwać na wieki i moje zbawienie – z pokolenia na pokolenie."
"Iz51,9": "Zbudź się, zbudź się, przyoblecz się w siłę, ramię PANA! Zbudź się jak za dawnych dni i jak za pokoleń minionych! Czyś to nie ty porąbało Egipt i zraniło smoka?"
"Iz51,10": "Czyś to nie ty wysuszyło morze, wody wielkiej głębi, i zamieniło głębiny morskie w drogę, aby przeszli odkupieni?"
"Iz51,11": "Powrócą więc odkupieni przez PANA i przyjdą do Syjonu ze śpiewaniem, a wieczna radość będzie nad ich głową. Dostąpią wesela i radości i ucieknie smutek i wzdychanie."
"Iz51,12": "Ja, to ja jestem waszym pocieszycielem. Kim jesteś, że się boisz człowieka śmiertelnego i syna człowieczego, który jest jak trawa;"
"Iz51,13": "I zapominasz o PANU, swoim Stwórcy, który rozciągnął niebiosa i założył ziemię; że lękasz się nieustannie każdego dnia z powodu wściekłości ciemięzcy, gdy zmierza do tego, aby zniszczyć? Ale gdzie jest ta wściekłość ciemięzcy?"
"Iz51,14": "Jeniec spieszy się, aby zostać uwolniony, bo nie chce umrzeć w dole ani z braku chleba."
"Iz51,15": "Doprawdy ja jestem PANEM, twoim Bogiem, który rozdziela morze tak, że szumią jego fale. PAN zastępów to moje imię."
"Iz51,16": "Ja włożyłem swoje słowa w twoje usta i w cieniu swojej ręki cię zakryłem, aby osadzić niebiosa i założyć ziemię, i powiedzieć Syjonowi: Ty jesteś moim ludem."
"Iz51,17": "Zbudź się, zbudź się, powstań Jerozolimo, która piłaś z ręki PANA kubek jego gniewu; wypiłaś męty z kubka odurzenia i je wysączyłaś."
"Iz51,18": "Nikt jej nie prowadzi spośród wszystkich synów, których urodziła, i nikt jej za rękę nie trzyma ze wszystkich synów, których wychowała."
"Iz51,19": "Dwie rzeczy cię spotkały, któż się użali nad tobą? Spustoszenie i zniszczenie, głód i miecz; któż cię pocieszy?"
"Iz51,20": "Twoi synowie leżeli omdlali na rogach wszystkich ulic, jak dziki wół w sieci. Są pełni gniewu PANA, upomnienia twego Boga."
"Iz51,21": "Dlatego teraz słuchaj tego, utrapiona i pijana, lecz nie winem:"
"Iz51,22": "Tak mówi twój Pan, PAN i twój Bóg, który wstawia się za swoim ludem: Oto zabieram z twojej ręki kubek odurzenia, męty kubka swojej wściekłości. Nie będziesz już pić z niego;"
"Iz51,23": "Ale podam go w rękę tych, którzy cię trapią, którzy mówili twojej duszy: Nachyl się, abyśmy przeszli przez ciebie. A ty uczyniłaś swoje plecy jakby ziemią i jakby ulicą dla przechodzących."
