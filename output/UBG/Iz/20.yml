"Iz20,1": "W roku, w którym Tartan przybył do Aszdodu, wysłany tam przez Sargona, króla Asyrii, walczył przeciw Aszdodowi i go zdobył;"
"Iz20,2": "W tym czasie PAN powiedział przez Izajasza, syna Amosa: Idź, zdejmij wór ze swych bioder i obuwie ze swoich nóg. I uczynił tak, chodząc nago i boso."
"Iz20,3": "I PAN powiedział: Jak mój sługa Izajasz chodzi nago i boso przez trzy lata jako znak i cud dla Egiptu i Etiopii;"
"Iz20,4": "Tak król Asyrii uprowadzi więźniów Egiptu i jeńców Etiopii, młodych i starych, nagich i bosych, z obnażonymi pośladkami, na pohańbienie Egiptu."
"Iz20,5": "I przestraszą się, i zawstydzą z powodu Etiopii, ich nadziei, i z powodu Egiptu, ich chluby."
"Iz20,6": "Tego dnia mieszkaniec tej wyspy powie: Oto co się stało z naszą nadzieją, do której uciekliśmy się o pomoc, abyśmy zostali wyzwoleni od króla Asyrii. A teraz jak zdołamy ujść cało?"
