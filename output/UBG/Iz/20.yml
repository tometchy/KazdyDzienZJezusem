"Iz20,1":
  text: "W roku, w którym Tartan przybył do Aszdodu, wysłany tam przez Sargona, króla Asyrii, walczył przeciw Aszdodowi i go zdobył;"
  tags: []
"Iz20,2":
  text: "W tym czasie PAN powiedział przez Izajasza, syna Amosa: Idź, zdejmij wór ze swych bioder i obuwie ze swoich nóg. I uczynił tak, chodząc nago i boso."
  tags: []
"Iz20,3":
  text: "I PAN powiedział: Jak mój sługa Izajasz chodzi nago i boso przez trzy lata jako znak i cud dla Egiptu i Etiopii;"
  tags: []
"Iz20,4":
  text: "Tak król Asyrii uprowadzi więźniów Egiptu i jeńców Etiopii, młodych i starych, nagich i bosych, z obnażonymi pośladkami, na pohańbienie Egiptu."
  tags: []
"Iz20,5":
  text: "I przestraszą się, i zawstydzą z powodu Etiopii, ich nadziei, i z powodu Egiptu, ich chluby."
  tags: []
"Iz20,6":
  text: "Tego dnia mieszkaniec tej wyspy powie: Oto co się stało z naszą nadzieją, do której uciekliśmy się o pomoc, abyśmy zostali wyzwoleni od króla Asyrii. A teraz jak zdołamy ujść cało?"
  tags: []
