"Iz43,1": "Ale teraz tak mówi PAN, który cię stworzył, Jakubie, i który cię ukształtował, Izraelu: Nie bój się, bo cię odkupiłem i wezwałem cię po imieniu; jesteś mój."
"Iz43,2": "Gdy pójdziesz przez wody, będę z tobą, jeśli przez rzeki, one cię nie zaleją. Gdy pójdziesz przez ogień, nie spłoniesz i płomień cię nie spali."
"Iz43,3": "Ja bowiem jestem PANEM, twoim Bogiem, Świętym Izraela, twoim Zbawicielem. Dałem Egipt na okup za ciebie, Etiopię i Sabę zamiast ciebie."
"Iz43,4": "Ponieważ jesteś w moich oczach drogi, jesteś uwielbiony, a ja cię umiłowałem – dlatego dałem ludzi za ciebie i narody za twoje życie."
"Iz43,5": "Nie bój się, bo ja jestem z tobą; ze wschodu przyprowadzę twoje potomstwo i z zachodu cię zgromadzę."
"Iz43,6": "Powiem północy: Oddaj; a południu: Nie zatrzymuj. Przyprowadź moich synów z daleka i moje córki z krańców ziemi;"
"Iz43,7": "Każdego, kto nazywany jest moim imieniem i którego dla swojej chwały stworzyłem, ukształtowałem i uczyniłem."
"Iz43,8": "Wyprowadź lud ślepy, który już ma oczy, i głuchy, który już ma uszy."
"Iz43,9": "Niech wszystkie narody zbiorą się razem i niech się zgromadzą ludy. Kto spośród nich może ogłosić i oznajmić nam przeszłe rzeczy? Niech postawią swoich świadków, a będą usprawiedliwieni; albo niech słyszą i powiedzą: To jest prawda!"
"Iz43,10": "Wy jesteście moimi świadkami, mówi PAN, i moim sługą, którego wybrałem, abyście poznali mnie i wierzyli mi, i zrozumieli, że to ja jestem. Przede mną nie został stworzony żaden Bóg ani po mnie nie będzie."
"Iz43,11": "Ja, ja jestem PANEM i oprócz mnie nie ma zbawiciela."
"Iz43,12": "Ja ogłaszałem, wybawiałem i opowiadałem, gdy nie było wśród was żadnego obcego boga. Wy jesteście moimi świadkami, mówi PAN, że ja jestem Bogiem."
"Iz43,13": "Zanim powstał dzień, ja jestem, a nie ma nikogo, kto by wyrwał cokolwiek z mojej ręki. Gdy coś uczynię, któż to odwróci?"
"Iz43,14": "Tak mówi PAN, wasz Odkupiciel, Święty Izraela: Ze względu na was posłałem do Babilonu i zerwałem wszystkie rygle, i powaliłem Chaldejczyków, którzy się chlubią w swoich okrętach."
"Iz43,15": "Ja jestem PANEM, waszym Świętym, Stwórcą Izraela, waszym Królem."
"Iz43,16": "Tak mówi PAN, który toruje drogę przez morze i ścieżkę przez potężne wody;"
"Iz43,17": "Który wyprowadza rydwany i konie, wojsko i siły; upadli razem, a nie powstaną: zgaśli, dotlili się jak knot."
"Iz43,18": "Nie wspominajcie przeszłych rzeczy, na starodawne nie zważajcie."
"Iz43,19": "Oto ja czynię nową rzecz i zaraz się pojawi. Czy nie poznacie tego? Utoruję drogę na pustkowiu i uczynię rzeki na pustyni."
"Iz43,20": "Chwalić mnie będą zwierzęta polne, smoki i sowy, gdyż dostarczę wodę na pustkowie i uczynię rzeki na pustyni, aby napoić swój lud, swój lud wybrany."
"Iz43,21": "Ten lud, który dla siebie stworzyłem, będzie opowiadać moją chwałę."
"Iz43,22": "A jednak ty nie wzywałeś mnie, Jakubie, lecz męczyłeś się mną, Izraelu."
"Iz43,23": "Nie przyniosłeś mi baranka na swoje całopalenie, nie czciłeś mnie swymi ofiarami. Nie zmuszałem cię do służenia mi ofiarami i nie obciążałem cię ofiarą kadzidła;"
"Iz43,24": "Nie kupiłeś mi za pieniądze wonności ani mnie nie nasyciłeś tłuszczem swoich ofiar. Ale obciążyłeś mnie swoimi grzechami i utrudziłeś mnie swoimi nieprawościami."
"Iz43,25": "Ja, właśnie ja, zmazuję twoje przestępstwa ze względu na siebie, a twoich grzechów nie wspomnę."
"Iz43,26": "Przypomnij mi, rozprawmy się ze sobą, powiedz, co masz na swoje usprawiedliwienie."
"Iz43,27": "Twój pierwszy ojciec zgrzeszył, a twoi nauczyciele wykroczyli przeciwko mnie."
"Iz43,28": "Dlatego zhańbiłem książąt świątyni i wydałem Jakuba klątwie, a Izraela zniewagom."
