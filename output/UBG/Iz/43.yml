"Iz43,1":
  text: "Ale teraz tak mówi PAN, który cię stworzył, Jakubie, i który cię ukształtował, Izraelu: Nie bój się, bo cię odkupiłem i wezwałem cię po imieniu; jesteś mój."
  tags: []
"Iz43,2":
  text: "Gdy pójdziesz przez wody, będę z tobą, jeśli przez rzeki, one cię nie zaleją. Gdy pójdziesz przez ogień, nie spłoniesz i płomień cię nie spali."
  tags: []
"Iz43,3":
  text: "Ja bowiem jestem PANEM, twoim Bogiem, Świętym Izraela, twoim Zbawicielem. Dałem Egipt na okup za ciebie, Etiopię i Sabę zamiast ciebie."
  tags: []
"Iz43,4":
  text: "Ponieważ jesteś w moich oczach drogi, jesteś uwielbiony, a ja cię umiłowałem – dlatego dałem ludzi za ciebie i narody za twoje życie."
  tags: []
"Iz43,5":
  text: "Nie bój się, bo ja jestem z tobą; ze wschodu przyprowadzę twoje potomstwo i z zachodu cię zgromadzę."
  tags: []
"Iz43,6":
  text: "Powiem północy: Oddaj; a południu: Nie zatrzymuj. Przyprowadź moich synów z daleka i moje córki z krańców ziemi;"
  tags: []
"Iz43,7":
  text: "Każdego, kto nazywany jest moim imieniem i którego dla swojej chwały stworzyłem, ukształtowałem i uczyniłem."
  tags: []
"Iz43,8":
  text: "Wyprowadź lud ślepy, który już ma oczy, i głuchy, który już ma uszy."
  tags: []
"Iz43,9":
  text: "Niech wszystkie narody zbiorą się razem i niech się zgromadzą ludy. Kto spośród nich może ogłosić i oznajmić nam przeszłe rzeczy? Niech postawią swoich świadków, a będą usprawiedliwieni; albo niech słyszą i powiedzą: To jest prawda!"
  tags: []
"Iz43,10":
  text: "Wy jesteście moimi świadkami, mówi PAN, i moim sługą, którego wybrałem, abyście poznali mnie i wierzyli mi, i zrozumieli, że to ja jestem. Przede mną nie został stworzony żaden Bóg ani po mnie nie będzie."
  tags: []
"Iz43,11":
  text: "Ja, ja jestem PANEM i oprócz mnie nie ma zbawiciela."
  tags: []
"Iz43,12":
  text: "Ja ogłaszałem, wybawiałem i opowiadałem, gdy nie było wśród was żadnego obcego boga. Wy jesteście moimi świadkami, mówi PAN, że ja jestem Bogiem."
  tags: []
"Iz43,13":
  text: "Zanim powstał dzień, ja jestem, a nie ma nikogo, kto by wyrwał cokolwiek z mojej ręki. Gdy coś uczynię, któż to odwróci?"
  tags: []
"Iz43,14":
  text: "Tak mówi PAN, wasz Odkupiciel, Święty Izraela: Ze względu na was posłałem do Babilonu i zerwałem wszystkie rygle, i powaliłem Chaldejczyków, którzy się chlubią w swoich okrętach."
  tags: []
"Iz43,15":
  text: "Ja jestem PANEM, waszym Świętym, Stwórcą Izraela, waszym Królem."
  tags: []
"Iz43,16":
  text: "Tak mówi PAN, który toruje drogę przez morze i ścieżkę przez potężne wody;"
  tags: []
"Iz43,17":
  text: "Który wyprowadza rydwany i konie, wojsko i siły; upadli razem, a nie powstaną: zgaśli, dotlili się jak knot."
  tags: []
"Iz43,18":
  text: "Nie wspominajcie przeszłych rzeczy, na starodawne nie zważajcie."
  tags: []
"Iz43,19":
  text: "Oto ja czynię nową rzecz i zaraz się pojawi. Czy nie poznacie tego? Utoruję drogę na pustkowiu i uczynię rzeki na pustyni."
  tags: []
"Iz43,20":
  text: "Chwalić mnie będą zwierzęta polne, smoki i sowy, gdyż dostarczę wodę na pustkowie i uczynię rzeki na pustyni, aby napoić swój lud, swój lud wybrany."
  tags: []
"Iz43,21":
  text: "Ten lud, który dla siebie stworzyłem, będzie opowiadać moją chwałę."
  tags: []
"Iz43,22":
  text: "A jednak ty nie wzywałeś mnie, Jakubie, lecz męczyłeś się mną, Izraelu."
  tags: []
"Iz43,23":
  text: "Nie przyniosłeś mi baranka na swoje całopalenie, nie czciłeś mnie swymi ofiarami. Nie zmuszałem cię do służenia mi ofiarami i nie obciążałem cię ofiarą kadzidła;"
  tags: []
"Iz43,24":
  text: "Nie kupiłeś mi za pieniądze wonności ani mnie nie nasyciłeś tłuszczem swoich ofiar. Ale obciążyłeś mnie swoimi grzechami i utrudziłeś mnie swoimi nieprawościami."
  tags: []
"Iz43,25":
  text: "Ja, właśnie ja, zmazuję twoje przestępstwa ze względu na siebie, a twoich grzechów nie wspomnę."
  tags: []
"Iz43,26":
  text: "Przypomnij mi, rozprawmy się ze sobą, powiedz, co masz na swoje usprawiedliwienie."
  tags: []
"Iz43,27":
  text: "Twój pierwszy ojciec zgrzeszył, a twoi nauczyciele wykroczyli przeciwko mnie."
  tags: []
"Iz43,28":
  text: "Dlatego zhańbiłem książąt świątyni i wydałem Jakuba klątwie, a Izraela zniewagom."
  tags: []
