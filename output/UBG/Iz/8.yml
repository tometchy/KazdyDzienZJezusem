"Iz8,1":
  text: "I PAN powiedział do mnie: Weź sobie wielką księgę i napisz w niej ludzkim pismem: Maherszalalchaszbaz."
  tags: []
"Iz8,2":
  text: "Wziąłem sobie wtedy za wiernych świadków Uriasza, kapłana, i Zachariasza, syna Jeberechiasza."
  tags: []
"Iz8,3":
  text: "Potem zbliżyłem się do prorokini, a ona poczęła i urodziła syna. I PAN powiedział do mnie: Nazwij go: Maherszalalchaszbaz."
  tags: []
"Iz8,4":
  text: "Zanim bowiem to dziecko nauczy się wołać: Mój ojcze i moja matko, bogactwa Damaszku i łupy Samarii zostaną wywiezione przed króla Asyrii."
  tags: []
"Iz8,5":
  text: "Ponadto PAN powiedział do mnie:"
  tags: []
"Iz8,6":
  text: "Ponieważ ten lud wzgardził wodami Siloe, które płyną łagodnie, a chlubi się Resinem i synem Remaliasza;"
  tags: []
"Iz8,7":
  text: "Oto Pan sprowadzi na niego wody rzeki, gwałtowne i obfite – króla Asyrii i całą jego chwałę. Wystąpi ze wszystkich swoich strumieni i wyleje ze wszystkich swoich brzegów."
  tags: []
"Iz8,8":
  text: "Wedrze się do Judy, zaleje i rozejdzie się, aż dosięgnie szyi; a jego rozpostarte skrzydła napełnią szerokość twojej ziemi, Emmanuelu!"
  tags: []
"Iz8,9":
  text: "Zbierajcie się, ludy, a zostaniecie zgniecione, nakłońcie ucha, wszyscy z dalekich ziem: Przepaszcie się, a zostaniecie zmiażdżeni; przepaszcie się, a zostaniecie zmiażdżeni."
  tags: []
"Iz8,10":
  text: "Obmyślajcie plan, a będzie udaremniony; wypowiedzcie słowo, a nie ostoi się, bo Bóg jest z nami."
  tags: []
"Iz8,11":
  text: "Tak bowiem PAN powiedział do mnie, gdy chwycił mnie za rękę, i przestrzegł mnie, abym nie kroczył drogą tego ludu:"
  tags: []
"Iz8,12":
  text: "Nie mówcie: sprzysiężenie, kiedy ten lud mówi: sprzysiężenie; nie bójcie się tego, czego on się boi, ani się nie lękajcie."
  tags: []
"Iz8,13":
  text: "PANA zastępów – jego uświęcajcie; niech on będzie waszą bojaźnią i on waszą trwogą."
  tags: []
"Iz8,14":
  text: "On będzie dla was świątynią, ale kamieniem potknięcia i skałą zgorszenia dla obu domów Izraela, pułapką i sidłem dla mieszkańców Jerozolimy."
  tags: []
"Iz8,15":
  text: "I wielu z nich się potknie, upadnie i rozbije, będą usidleni i pojmani."
  tags: []
"Iz8,16":
  text: "Zawiąż to świadectwo, zapieczętuj prawo wśród moich uczniów."
  tags: []
"Iz8,17":
  text: "I będę czekał na PANA, który ukrył swoje oblicze przed domem Jakuba, i będę go oczekiwać."
  tags: []
"Iz8,18":
  text: "Oto ja i dzieci, które PAN mi dał, jesteśmy znakami i cudami w Izraelu od PANA zastępów, który mieszka na górze Syjon."
  tags: []
"Iz8,19":
  text: "A gdy będą wam mówić: Radźcie się czarowników i wróżbitów, którzy szepcą i mruczą, powiedzcie: Czyż lud nie powinien radzić się swego Boga? Czy ma się radzić umarłych w sprawie żywych?"
  tags: []
"Iz8,20":
  text: "Do prawa i do świadectwa! Jeśli nie będą mówić według tego słowa, to w nich nie ma żadnej światłości."
  tags: []
"Iz8,21":
  text: "A będą się tułali po ziemi, uciskani i wygłodzeni; a cierpiąc głód, będą się złościć i złorzeczyć swemu królowi oraz swemu Bogu, spoglądając ku górze."
  tags: []
"Iz8,22":
  text: "I spojrzą na ziemię, a oto ucisk i ciemność, mrok i cierpienie, i będą zapędzeni w ciemności."
  tags: []
