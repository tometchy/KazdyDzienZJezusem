"Iz2,1": "Słowo, które widział Izajasz, syn Amosa, dotyczące Judy i Jerozolimy."
"Iz2,2": "Stanie się w dniach ostatecznych, że góra domu PANA będzie utwierdzona na szczycie gór i wywyższona ponad pagórki; i wszystkie narody popłyną do niej."
"Iz2,3": "I pójdzie wiele ludów, i powie: Chodźcie, wstąpmy na górę PANA, do domu Boga Jakuba; on będzie nas uczył swoich dróg, a my będziemy kroczyli jego ścieżkami. Z Syjonu bowiem wyjdzie prawo, a słowo PANA z Jerozolimy."
"Iz2,4": "On będzie sądził wśród narodów i karcił wielu ludzi. I przekują swe miecze na lemiesze, a swoje włócznie na sierpy. Naród przeciw narodowi nie podniesie już miecza i nie będą się już ćwiczyć do wojny."
"Iz2,5": "Domu Jakuba, chodźcie, postępujmy w światłości PANA."
"Iz2,6": "Ale ty opuściłeś swój lud, dom Jakuba, gdyż pełen jest obrzydliwości wschodu i są oni wróżbitami jak Filistyni, a kochają się w cudzych synach."
"Iz2,7": "Ich ziemia jest pełna srebra i złota i nie ma końca ich skarbom. Ich ziemia jest pełna koni i nie ma końca ich rydwanom."
"Iz2,8": "Ich ziemia jest pełna bożków, oni oddają pokłon dziełom własnych rąk, które wykonały ich palce."
"Iz2,9": "Kłania się przed nimi prosty człowiek, poniża się też wielki; nie przebaczaj im."
"Iz2,10": "Wejdź w skałę i ukryj się w prochu ze strachu przed PANEM i przed chwałą jego majestatu."
"Iz2,11": "Wyniosłe oczy człowieka ukorzą się, ludzka pycha będzie poniżona, a sam tylko PAN zostanie wywyższony w tym dniu."
"Iz2,12": "Przyjdzie bowiem dzień PANA zastępów przeciwko każdemu pysznemu i wyniosłemu, i przeciwko każdemu wywyższonemu, a każdy zostanie poniżony;"
"Iz2,13": "Przeciwko wszystkim cedrom Libanu, które są wysokie a wyniosłe, i przeciwko wszystkim dębom Baszanu;"
"Iz2,14": "Przeciwko wszystkim wysokim górom i przeciwko wszystkim wyniosłym pagórkom;"
"Iz2,15": "Przeciwko każdej wysokiej wieży i przeciwko każdemu murowi obronnemu;"
"Iz2,16": "Przeciwko wszystkim okrętom Tarszisz i przeciwko wszelkiemu pięknemu malarstwu."
"Iz2,17": "I wyniosłość człowieka będzie ugięta i pycha ludzka będzie poniżona, a sam tylko PAN zostanie wywyższony w tym dniu."
"Iz2,18": "A bożki zniszczy doszczętnie."
"Iz2,19": "Wtedy wejdą do jaskiń skalnych i do jam podziemnych ze strachu przed PANEM i przed chwałą jego majestatu, gdy powstanie, by przerazić ziemię."
"Iz2,20": "W tym dniu człowiek wrzuci kretom i nietoperzom swoje bożki srebrne i złote, które uczynił, aby oddawać im pokłon;"
"Iz2,21": "I wejdzie w szczeliny skalne i na szczyty opok ze strachu przed PANEM i przed chwałą jego majestatu, gdy powstanie, aby przerazić ziemię."
"Iz2,22": "Przestańcie polegać na człowieku, którego tchnienie jest w jego nozdrzach. Za co bowiem ma być uznany?"
