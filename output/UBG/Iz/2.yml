"Iz2,1":
  text: "Słowo, które widział Izajasz, syn Amosa, dotyczące Judy i Jerozolimy."
  tags: []
"Iz2,2":
  text: "Stanie się w dniach ostatecznych, że góra domu PANA będzie utwierdzona na szczycie gór i wywyższona ponad pagórki; i wszystkie narody popłyną do niej."
  tags: []
"Iz2,3":
  text: "I pójdzie wiele ludów, i powie: Chodźcie, wstąpmy na górę PANA, do domu Boga Jakuba; on będzie nas uczył swoich dróg, a my będziemy kroczyli jego ścieżkami. Z Syjonu bowiem wyjdzie prawo, a słowo PANA z Jerozolimy."
  tags: []
"Iz2,4":
  text: "On będzie sądził wśród narodów i karcił wielu ludzi. I przekują swe miecze na lemiesze, a swoje włócznie na sierpy. Naród przeciw narodowi nie podniesie już miecza i nie będą się już ćwiczyć do wojny."
  tags: []
"Iz2,5":
  text: "Domu Jakuba, chodźcie, postępujmy w światłości PANA."
  tags: []
"Iz2,6":
  text: "Ale ty opuściłeś swój lud, dom Jakuba, gdyż pełen jest obrzydliwości wschodu i są oni wróżbitami jak Filistyni, a kochają się w cudzych synach."
  tags: []
"Iz2,7":
  text: "Ich ziemia jest pełna srebra i złota i nie ma końca ich skarbom. Ich ziemia jest pełna koni i nie ma końca ich rydwanom."
  tags: []
"Iz2,8":
  text: "Ich ziemia jest pełna bożków, oni oddają pokłon dziełom własnych rąk, które wykonały ich palce."
  tags: []
"Iz2,9":
  text: "Kłania się przed nimi prosty człowiek, poniża się też wielki; nie przebaczaj im."
  tags: []
"Iz2,10":
  text: "Wejdź w skałę i ukryj się w prochu ze strachu przed PANEM i przed chwałą jego majestatu."
  tags: []
"Iz2,11":
  text: "Wyniosłe oczy człowieka ukorzą się, ludzka pycha będzie poniżona, a sam tylko PAN zostanie wywyższony w tym dniu."
  tags: []
"Iz2,12":
  text: "Przyjdzie bowiem dzień PANA zastępów przeciwko każdemu pysznemu i wyniosłemu, i przeciwko każdemu wywyższonemu, a każdy zostanie poniżony;"
  tags: []
"Iz2,13":
  text: "Przeciwko wszystkim cedrom Libanu, które są wysokie a wyniosłe, i przeciwko wszystkim dębom Baszanu;"
  tags: []
"Iz2,14":
  text: "Przeciwko wszystkim wysokim górom i przeciwko wszystkim wyniosłym pagórkom;"
  tags: []
"Iz2,15":
  text: "Przeciwko każdej wysokiej wieży i przeciwko każdemu murowi obronnemu;"
  tags: []
"Iz2,16":
  text: "Przeciwko wszystkim okrętom Tarszisz i przeciwko wszelkiemu pięknemu malarstwu."
  tags: []
"Iz2,17":
  text: "I wyniosłość człowieka będzie ugięta i pycha ludzka będzie poniżona, a sam tylko PAN zostanie wywyższony w tym dniu."
  tags: []
"Iz2,18":
  text: "A bożki zniszczy doszczętnie."
  tags: []
"Iz2,19":
  text: "Wtedy wejdą do jaskiń skalnych i do jam podziemnych ze strachu przed PANEM i przed chwałą jego majestatu, gdy powstanie, by przerazić ziemię."
  tags: []
"Iz2,20":
  text: "W tym dniu człowiek wrzuci kretom i nietoperzom swoje bożki srebrne i złote, które uczynił, aby oddawać im pokłon;"
  tags: []
"Iz2,21":
  text: "I wejdzie w szczeliny skalne i na szczyty opok ze strachu przed PANEM i przed chwałą jego majestatu, gdy powstanie, aby przerazić ziemię."
  tags: []
"Iz2,22":
  text: "Przestańcie polegać na człowieku, którego tchnienie jest w jego nozdrzach. Za co bowiem ma być uznany?"
  tags: []
