"Iz44,1":
  text: "A teraz słuchaj, Jakubie, mój sługo, i ty, Izraelu, którego wybrałem."
  tags: []
"Iz44,2":
  text: "Tak mówi PAN, który cię uczynił i który cię ukształtował już od łona matki, i który cię wspomaga: Nie bój się, Jakubie, mój sługo, i Jeszurunie, którego wybrałem."
  tags: []
"Iz44,3":
  text: "Wyleję bowiem wody na spragnionego, a potoki na suchą ziemię. Wyleję mego Ducha na twoje potomstwo i moje błogosławieństwo na twoich potomków."
  tags: []
"Iz44,4":
  text: "I rozkrzewią się tak jakby pomiędzy trawą i jak wierzby nad potokami wód."
  tags: []
"Iz44,5":
  text: "Jeden powie: Ja należę do PANA, drugi nazwie się imieniem Jakuba, a inny napisze swoją ręką: PANU, i będzie się nazywał imieniem Izraela."
  tags: []
"Iz44,6":
  text: "Tak mówi PAN, Król Izraela i jego Odkupiciel, PAN zastępów: Ja jestem pierwszy i ja jestem ostatni, a oprócz mnie nie ma Boga."
  tags: []
"Iz44,7":
  text: "Czy od czasów, gdy ustanowiłem pierwszy lud na świecie, znalazł się ktoś, kto jak ja jest w stanie ogłosić i opowiedzieć rzeczy przyszłe? Jeśli tak – niech więc powie, co ma nastąpić."
  tags: []
"Iz44,8":
  text: "Nie bójcie się i nie lękajcie. Czy od dawna nie oznajmiałem wam wszystkiego i nie opowiadałem? Wy sami jesteście moimi świadkami. Czy jest Bóg oprócz mnie? Nie ma innej Skały; nie znam żadnej."
  tags: []
"Iz44,9":
  text: "Wytwórcy rzeźbionych posągów są niczym, a ich piękne dzieła nic im nie pomogą; oni sami sobie są świadkami, że nic nie widzą ani nie rozumieją – ku swemu zawstydzeniu."
  tags: []
"Iz44,10":
  text: "Kto utworzył boga i odlewał posąg, który nie przynosi żadnego pożytku?"
  tags: []
"Iz44,11":
  text: "Oto wszyscy jego towarzysze będą zawstydzeni. Rzemieślnicy są tylko ludźmi. Niech się zbiorą wszyscy i niech staną. Przelęknąć się muszą i razem będą zawstydzeni."
  tags: []
"Iz44,12":
  text: "Kowal kleszczami pracuje przy węglu, młotami kształtuje posąg i wykonuje go siłą swoich ramion, aż z głodu jego siły opadają, wody nie pije i omdlewa."
  tags: []
"Iz44,13":
  text: "Cieśla zaś rozciąga sznur, wyznacza farbowanym sznurem, ciosa toporem, zaznacza go cyrklem i wykonuje go na podobieństwo człowieka, na podobieństwo pięknego człowieka, aby pozostawał w domu."
  tags: []
"Iz44,14":
  text: "Narąbie sobie cedrów i bierze cyprys i dąb lub to, co jest najsilniejsze spośród drzew leśnych, wsadzi jesion, który rośnie dzięki deszczom."
  tags: []
"Iz44,15":
  text: "Wtedy służy to człowiekowi na opał: bierze z tego, aby się ogrzać, także roznieca ogień, aby upiec chleb, ponadto robi sobie boga i oddaje mu pokłon, czyni z tego posąg i pada przed nim."
  tags: []
"Iz44,16":
  text: "Część tego spala w ogniu, przy drugiej części je mięso – przyrządza pieczeń i syci się. Także grzeje się i mówi: Ach, jak mi ciepło, widziałem ogień."
  tags: []
"Iz44,17":
  text: "A z reszty tego czyni boga, swój posąg. Pada przed nim, oddaje mu pokłon i modli się do niego, mówiąc: Ratuj mnie, bo ty jesteś moim bogiem."
  tags: []
"Iz44,18":
  text: "Nie wiedzą ani nie rozumieją, bo Bóg zaślepił ich oczy, aby nie widzieli, i ich serca, aby nie rozumieli."
  tags: []
"Iz44,19":
  text: "I nie rozważają tego w swoim sercu, nie mają wiedzy ani rozumu, by powiedzieć: Część tego spaliłem w ogniu, a na węglu z tego wypiekłem chleb, upiekłem mięso i najadłem się. Czyż z reszty tego mam uczynić coś obrzydliwego? Czyż mam padać przed klocem drzewa?"
  tags: []
"Iz44,20":
  text: "Taki się karmi popiołem, jego zwiedzione serce wprowadziło go w błąd, tak że nie może wybawić swojej duszy ani powiedzieć: Czyż nie jest fałszem to, co znajduje się w mojej prawicy?"
  tags: []
"Iz44,21":
  text: "Pamiętaj o tym, Jakubie i Izraelu, gdyż jesteś moim sługą. Stworzyłem cię, jesteś moim sługą. O Izraelu, nie zapomnę o tobie."
  tags: []
"Iz44,22":
  text: "Zmazałem twoje nieprawości jak obłok, a twoje grzechy jak mgłę. Nawróć się do mnie, bo cię odkupiłem."
  tags: []
"Iz44,23":
  text: "Śpiewajcie, niebiosa, bo PAN to uczynił. Wykrzykujcie, głębiny ziemi. Rozbrzmiewajcie śpiewaniem góry, lesie wraz ze wszystkimi drzewami; PAN bowiem odkupił Jakuba, a w Izraelu okrył się chwałą."
  tags: []
"Iz44,24":
  text: "Tak mówi PAN, twój Odkupiciel, który cię stworzył już od łona matki: Ja, PAN, wszystko czynię: sam rozciągam niebiosa, rozpościeram ziemię swoją mocą;"
  tags: []
"Iz44,25":
  text: "Wniwecz obracam znaki kłamców i z wróżbitów czynię szaleńców; mędrców zmuszam do odwrotu, a ich wiedzę czynię głupstwem."
  tags: []
"Iz44,26":
  text: "Potwierdzam słowa swego sługi i spełniam radę swoich posłańców. Ja mówię do Jerozolimy: Będziesz zamieszkana, do miast Judy: Będziecie odbudowane, bo podniosę jej ruiny;"
  tags: []
"Iz44,27":
  text: "To ja mówię głębinie: Wysychaj, ja wysuszę twoje potoki;"
  tags: []
"Iz44,28":
  text: "I o Cyrusie mówię: On jest moim pasterzem, bo wypełni całą moją wolę; i mówię do Jerozolimy: Będziesz odbudowana, a do świątyni: Będziesz założona."
  tags: []
