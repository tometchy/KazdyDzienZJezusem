"Iz44,1": "A teraz słuchaj, Jakubie, mój sługo, i ty, Izraelu, którego wybrałem."
"Iz44,2": "Tak mówi PAN, który cię uczynił i który cię ukształtował już od łona matki, i który cię wspomaga: Nie bój się, Jakubie, mój sługo, i Jeszurunie, którego wybrałem."
"Iz44,3": "Wyleję bowiem wody na spragnionego, a potoki na suchą ziemię. Wyleję mego Ducha na twoje potomstwo i moje błogosławieństwo na twoich potomków."
"Iz44,4": "I rozkrzewią się tak jakby pomiędzy trawą i jak wierzby nad potokami wód."
"Iz44,5": "Jeden powie: Ja należę do PANA, drugi nazwie się imieniem Jakuba, a inny napisze swoją ręką: PANU, i będzie się nazywał imieniem Izraela."
"Iz44,6": "Tak mówi PAN, Król Izraela i jego Odkupiciel, PAN zastępów: Ja jestem pierwszy i ja jestem ostatni, a oprócz mnie nie ma Boga."
"Iz44,7": "Czy od czasów, gdy ustanowiłem pierwszy lud na świecie, znalazł się ktoś, kto jak ja jest w stanie ogłosić i opowiedzieć rzeczy przyszłe? Jeśli tak – niech więc powie, co ma nastąpić."
"Iz44,8": "Nie bójcie się i nie lękajcie. Czy od dawna nie oznajmiałem wam wszystkiego i nie opowiadałem? Wy sami jesteście moimi świadkami. Czy jest Bóg oprócz mnie? Nie ma innej Skały; nie znam żadnej."
"Iz44,9": "Wytwórcy rzeźbionych posągów są niczym, a ich piękne dzieła nic im nie pomogą; oni sami sobie są świadkami, że nic nie widzą ani nie rozumieją – ku swemu zawstydzeniu."
"Iz44,10": "Kto utworzył boga i odlewał posąg, który nie przynosi żadnego pożytku?"
"Iz44,11": "Oto wszyscy jego towarzysze będą zawstydzeni. Rzemieślnicy są tylko ludźmi. Niech się zbiorą wszyscy i niech staną. Przelęknąć się muszą i razem będą zawstydzeni."
"Iz44,12": "Kowal kleszczami pracuje przy węglu, młotami kształtuje posąg i wykonuje go siłą swoich ramion, aż z głodu jego siły opadają, wody nie pije i omdlewa."
"Iz44,13": "Cieśla zaś rozciąga sznur, wyznacza farbowanym sznurem, ciosa toporem, zaznacza go cyrklem i wykonuje go na podobieństwo człowieka, na podobieństwo pięknego człowieka, aby pozostawał w domu."
"Iz44,14": "Narąbie sobie cedrów i bierze cyprys i dąb lub to, co jest najsilniejsze spośród drzew leśnych, wsadzi jesion, który rośnie dzięki deszczom."
"Iz44,15": "Wtedy służy to człowiekowi na opał: bierze z tego, aby się ogrzać, także roznieca ogień, aby upiec chleb, ponadto robi sobie boga i oddaje mu pokłon, czyni z tego posąg i pada przed nim."
"Iz44,16": "Część tego spala w ogniu, przy drugiej części je mięso – przyrządza pieczeń i syci się. Także grzeje się i mówi: Ach, jak mi ciepło, widziałem ogień."
"Iz44,17": "A z reszty tego czyni boga, swój posąg. Pada przed nim, oddaje mu pokłon i modli się do niego, mówiąc: Ratuj mnie, bo ty jesteś moim bogiem."
"Iz44,18": "Nie wiedzą ani nie rozumieją, bo Bóg zaślepił ich oczy, aby nie widzieli, i ich serca, aby nie rozumieli."
"Iz44,19": "I nie rozważają tego w swoim sercu, nie mają wiedzy ani rozumu, by powiedzieć: Część tego spaliłem w ogniu, a na węglu z tego wypiekłem chleb, upiekłem mięso i najadłem się. Czyż z reszty tego mam uczynić coś obrzydliwego? Czyż mam padać przed klocem drzewa?"
"Iz44,20": "Taki się karmi popiołem, jego zwiedzione serce wprowadziło go w błąd, tak że nie może wybawić swojej duszy ani powiedzieć: Czyż nie jest fałszem to, co znajduje się w mojej prawicy?"
"Iz44,21": "Pamiętaj o tym, Jakubie i Izraelu, gdyż jesteś moim sługą. Stworzyłem cię, jesteś moim sługą. O Izraelu, nie zapomnę o tobie."
"Iz44,22": "Zmazałem twoje nieprawości jak obłok, a twoje grzechy jak mgłę. Nawróć się do mnie, bo cię odkupiłem."
"Iz44,23": "Śpiewajcie, niebiosa, bo PAN to uczynił. Wykrzykujcie, głębiny ziemi. Rozbrzmiewajcie śpiewaniem góry, lesie wraz ze wszystkimi drzewami; PAN bowiem odkupił Jakuba, a w Izraelu okrył się chwałą."
"Iz44,24": "Tak mówi PAN, twój Odkupiciel, który cię stworzył już od łona matki: Ja, PAN, wszystko czynię: sam rozciągam niebiosa, rozpościeram ziemię swoją mocą;"
"Iz44,25": "Wniwecz obracam znaki kłamców i z wróżbitów czynię szaleńców; mędrców zmuszam do odwrotu, a ich wiedzę czynię głupstwem."
"Iz44,26": "Potwierdzam słowa swego sługi i spełniam radę swoich posłańców. Ja mówię do Jerozolimy: Będziesz zamieszkana, do miast Judy: Będziecie odbudowane, bo podniosę jej ruiny;"
"Iz44,27": "To ja mówię głębinie: Wysychaj, ja wysuszę twoje potoki;"
"Iz44,28": "I o Cyrusie mówię: On jest moim pasterzem, bo wypełni całą moją wolę; i mówię do Jerozolimy: Będziesz odbudowana, a do świątyni: Będziesz założona."
