"Iz27,1":
  text: "W tym dniu PAN ukarze swoim mieczem srogim, wielkim i mocnym Lewiatana, węża długiego, Lewiatana, węża skręconego, i zabije smoka, który jest w morzu."
  tags: []
"Iz27,2":
  text: "Tego dnia śpiewajcie o winnicy wybornego wina."
  tags: []
"Iz27,3":
  text: "Ja, PAN, który jej strzeże, co chwila będę ją podlewać i żeby nikt jej nie zniszczył, będę jej strzegł nocą i dniem."
  tags: []
"Iz27,4":
  text: "Nie ma we mnie żadnej zapalczywości. Kto wystawi osty i ciernie do walki ze mną, abym z nimi walczył? Spaliłbym je do szczętu."
  tags: []
"Iz27,5":
  text: "Niech raczej uchwyci moją siłę, aby zawrzeć ze mną pokój, a pokój ze mną uczyni."
  tags: []
"Iz27,6":
  text: "Przyjdzie dzień, gdy Jakub się rozkorzeni, Izrael zakwitnie, puści pędy i napełni powierzchnię ziemi owocem."
  tags: []
"Iz27,7":
  text: "Czy uderzył go, jak uderzył jego wroga? Czy zabito go, jak inni zostali zabici przez niego?"
  tags: []
"Iz27,8":
  text: "Z umiarem go ukarze, bo gdy ten wypuści gałązki, zabierze go swoim gwałtownym wiatrem w dniu wschodniego wichru."
  tags: []
"Iz27,9":
  text: "Dlatego w ten sposób będzie oczyszczona nieprawość Jakuba; a taki będzie wszelki owoc usunięcia jego grzechu: rozrzuci wszystkie kamienie ołtarza, jak rozbija się kamienie wapienne, a nie będą już stać gaje i posągi słoneczne."
  tags: []
"Iz27,10":
  text: "Gdyż miasto obronne opustoszeje, a będzie mieszkaniem porzuconym i opuszczonym jak pustynia. Tam cielec będzie się paść, tam będzie leżeć i ogryzać jego gałązki."
  tags: []
"Iz27,11":
  text: "Gdy jego gałązki uschną, będą się odłamywać; przyjdą kobiety i spalą je. Ten lud bowiem nie ma żadnego rozumu; dlatego ten, który go uczynił, nie zlituje się nad nim, a ten, który go stworzył, nie okaże mu żadnej łaski."
  tags: []
"Iz27,12":
  text: "Tego dnia PAN będzie młócił od koryta rzeki do potoku Egiptu; i wy, synowie Izraela, będziecie zbierani jeden po drugim."
  tags: []
"Iz27,13":
  text: "I stanie się też w tym dniu, że zadmą w wielką trąbę i przyjdą zaginieni w ziemi Asyrii oraz ci, którzy byli wygnani do ziemi Egiptu; i będą oddawać pokłon PANU na świętej górze w Jerozolimie."
  tags: []
