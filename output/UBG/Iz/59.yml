"Iz59,1":
  text: "Oto ręka PANA nie jest skrócona, aby nie mogła zbawić, ani jego ucho nie jest przytępione, aby nie mogło wysłuchać."
  tags: []
"Iz59,2":
  text: "Ale wasze nieprawości uczyniły przepaść między wami a waszym Bogiem i wasze grzechy sprawiły, że ukrył twarz przed wami, tak że nie słyszy."
  tags: []
"Iz59,3":
  text: "Wasze ręce bowiem są splamione krwią, a wasze palce – nieprawością. Wasze wargi mówią kłamstwa, a wasz język szepce przewrotności."
  tags: []
"Iz59,4":
  text: "Nikt nie woła o sprawiedliwość i nikt się nie spiera o prawdę. Ufają marności i mówią kłamstwa, wyrządzają krzywdę i rodzą nieprawość."
  tags: []
"Iz59,5":
  text: "Wylęgają jaja węża i tkają pajęczynę. Kto spożywa ich jaja, umiera, a jeśli je stłucze, wykluwa się żmija."
  tags: []
"Iz59,6":
  text: "Ich pajęczyny nie nadają się na szatę ani nie okryją się swoimi uczynkami. Ich uczynki to uczynki nieprawości i w ich rękach są czyny przemocy."
  tags: []
"Iz59,7":
  text: "Ich nogi biegną do zła i spieszą się do przelewania niewinnej krwi. Ich myśli są myślami nieprawości, spustoszenie i zniszczenie na ich drogach."
  tags: []
"Iz59,8":
  text: "Drogi pokoju nie znają i nie ma na ich drogach sprawiedliwości. Uczynili sobie kręte ścieżki; ten, kto po nich chodzi, nie zazna pokoju."
  tags: []
"Iz59,9":
  text: "Dlatego sąd jest daleki od nas i nie dociera do nas sprawiedliwość. Czekamy na światłość – a oto ciemność, na jasność – ale kroczymy w mrokach."
  tags: []
"Iz59,10":
  text: "Macamy ściany jak ślepi, macamy, jakbyśmy oczu nie mieli. Potykamy się w południe jak o zmierzchu; w miejscach opustoszałych – jak umarli."
  tags: []
"Iz59,11":
  text: "Ryczymy wszyscy jak niedźwiedzie, jak gołębie ciągle wzdychamy; oczekujemy sądu, ale go nie ma; oczekujemy na wybawienie, ale jest od nas daleko."
  tags: []
"Iz59,12":
  text: "Rozmnożyły się bowiem nasze przestępstwa przed tobą i nasze grzechy świadczą przeciwko nam, ponieważ nasze nieprawości są przy nas i uznajemy swoje przestępstwa;"
  tags: []
"Iz59,13":
  text: "Zgrzeszyliśmy i kłamaliśmy przeciw PANU i odwróciliśmy się od naszego Boga, aby nie chodzić za nim; mówiliśmy o ucisku i buncie, obmyślaliśmy i wypowiadaliśmy słowa kłamliwe ze swego serca."
  tags: []
"Iz59,14":
  text: "Dlatego sąd został wycofany i sprawiedliwość stoi z daleka, bo prawda runęła na ulicy, a prawość nie może tam wejść."
  tags: []
"Iz59,15":
  text: "Tak, prawda zginęła, a ten, kto odstępuje od zła, pada ofiarą łupu. PAN to widział i nie podobało mu się, że nie ma sądu."
  tags: []
"Iz59,16":
  text: "Widział, że nie ma żadnego człowieka i zdziwił się, że nie ma nikogo, kto by się wstawił. Dlatego jego ramię przyniosło mu zbawienie i jego własna sprawiedliwość była jego podporą."
  tags: []
"Iz59,17":
  text: "Przyodział się bowiem w sprawiedliwość jak w pancerz i włożył hełm zbawienia na swą głowę. Przyoblekł się w odzienie pomsty jak w szatę i okrył się gorliwością jak płaszczem."
  tags: []
"Iz59,18":
  text: "Według uczynków, stosownie do nich, odpłaci gniewem swoim przeciwnikom, odwetem swoim wrogom; wyspom odpłaci odwetem."
  tags: []
"Iz59,19":
  text: "I ci, którzy są na zachodzie, będą się bali imienia PANA, i ci, którzy na wschodzie – jego chwały. Gdy wróg przyjdzie jak rzeka, Duch PANA przepędzi go."
  tags: []
"Iz59,20":
  text: "Przyjdzie bowiem Odkupiciel do Syjonu i do tych spośród Jakuba, którzy odwracają się od występków, mówi PAN."
  tags: []
"Iz59,21":
  text: "A to będzie moje przymierze z nimi, mówi PAN: Mój Duch, który jest w tobie, i moje słowa, które włożyłem w twoje usta, nie odstąpią od twoich ust ani od ust twego potomstwa, ani od ust potomków twego potomstwa, mówi PAN, odtąd aż na wieki."
  tags: []
