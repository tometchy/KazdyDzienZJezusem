"Iz59,1": "Oto ręka PANA nie jest skrócona, aby nie mogła zbawić, ani jego ucho nie jest przytępione, aby nie mogło wysłuchać."
"Iz59,2": "Ale wasze nieprawości uczyniły przepaść między wami a waszym Bogiem i wasze grzechy sprawiły, że ukrył twarz przed wami, tak że nie słyszy."
"Iz59,3": "Wasze ręce bowiem są splamione krwią, a wasze palce – nieprawością. Wasze wargi mówią kłamstwa, a wasz język szepce przewrotności."
"Iz59,4": "Nikt nie woła o sprawiedliwość i nikt się nie spiera o prawdę. Ufają marności i mówią kłamstwa, wyrządzają krzywdę i rodzą nieprawość."
"Iz59,5": "Wylęgają jaja węża i tkają pajęczynę. Kto spożywa ich jaja, umiera, a jeśli je stłucze, wykluwa się żmija."
"Iz59,6": "Ich pajęczyny nie nadają się na szatę ani nie okryją się swoimi uczynkami. Ich uczynki to uczynki nieprawości i w ich rękach są czyny przemocy."
"Iz59,7": "Ich nogi biegną do zła i spieszą się do przelewania niewinnej krwi. Ich myśli są myślami nieprawości, spustoszenie i zniszczenie na ich drogach."
"Iz59,8": "Drogi pokoju nie znają i nie ma na ich drogach sprawiedliwości. Uczynili sobie kręte ścieżki; ten, kto po nich chodzi, nie zazna pokoju."
"Iz59,9": "Dlatego sąd jest daleki od nas i nie dociera do nas sprawiedliwość. Czekamy na światłość – a oto ciemność, na jasność – ale kroczymy w mrokach."
"Iz59,10": "Macamy ściany jak ślepi, macamy, jakbyśmy oczu nie mieli. Potykamy się w południe jak o zmierzchu; w miejscach opustoszałych – jak umarli."
"Iz59,11": "Ryczymy wszyscy jak niedźwiedzie, jak gołębie ciągle wzdychamy; oczekujemy sądu, ale go nie ma; oczekujemy na wybawienie, ale jest od nas daleko."
"Iz59,12": "Rozmnożyły się bowiem nasze przestępstwa przed tobą i nasze grzechy świadczą przeciwko nam, ponieważ nasze nieprawości są przy nas i uznajemy swoje przestępstwa;"
"Iz59,13": "Zgrzeszyliśmy i kłamaliśmy przeciw PANU i odwróciliśmy się od naszego Boga, aby nie chodzić za nim; mówiliśmy o ucisku i buncie, obmyślaliśmy i wypowiadaliśmy słowa kłamliwe ze swego serca."
"Iz59,14": "Dlatego sąd został wycofany i sprawiedliwość stoi z daleka, bo prawda runęła na ulicy, a prawość nie może tam wejść."
"Iz59,15": "Tak, prawda zginęła, a ten, kto odstępuje od zła, pada ofiarą łupu. PAN to widział i nie podobało mu się, że nie ma sądu."
"Iz59,16": "Widział, że nie ma żadnego człowieka i zdziwił się, że nie ma nikogo, kto by się wstawił. Dlatego jego ramię przyniosło mu zbawienie i jego własna sprawiedliwość była jego podporą."
"Iz59,17": "Przyodział się bowiem w sprawiedliwość jak w pancerz i włożył hełm zbawienia na swą głowę. Przyoblekł się w odzienie pomsty jak w szatę i okrył się gorliwością jak płaszczem."
"Iz59,18": "Według uczynków, stosownie do nich, odpłaci gniewem swoim przeciwnikom, odwetem swoim wrogom; wyspom odpłaci odwetem."
"Iz59,19": "I ci, którzy są na zachodzie, będą się bali imienia PANA, i ci, którzy na wschodzie – jego chwały. Gdy wróg przyjdzie jak rzeka, Duch PANA przepędzi go."
"Iz59,20": "Przyjdzie bowiem Odkupiciel do Syjonu i do tych spośród Jakuba, którzy odwracają się od występków, mówi PAN."
"Iz59,21": "A to będzie moje przymierze z nimi, mówi PAN: Mój Duch, który jest w tobie, i moje słowa, które włożyłem w twoje usta, nie odstąpią od twoich ust ani od ust twego potomstwa, ani od ust potomków twego potomstwa, mówi PAN, odtąd aż na wieki."
