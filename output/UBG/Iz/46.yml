"Iz46,1":
  text: "Ugiął się Bel, chyli się Nebo. Ich posągi włożono na zwierzęta i bydło, które będąc obciążone, zmęczyły się pod brzemieniem."
  tags: []
"Iz46,2":
  text: "Pochyliły się i ugięły się razem; nie mogły ratować brzemion, ale one same poszły w niewolę."
  tags: []
"Iz46,3":
  text: "Słuchajcie mnie, domu Jakuba i cała resztko domu Izraela, których noszę od łona, których piastuję od urodzenia:"
  tags: []
"Iz46,4":
  text: "Aż do waszej starości ja jestem ten sam i aż do siwizny będę was nosić. Ja was uczyniłem, ja też nosić będę; ja mówię, będę was nosił i was wybawię."
  tags: []
"Iz46,5":
  text: "Do kogo mnie porównacie i z kim mnie zestawicie albo do kogo uczynicie mnie podobnym, abyśmy byli sobie równi?"
  tags: []
"Iz46,6":
  text: "Wysypują złoto z worka i odważają srebro na szalach, najmują złotnika, aby uczynił z nich bożka, przed którym padają i któremu oddają pokłon."
  tags: []
"Iz46,7":
  text: "Noszą go na ramieniu, dźwigają go i stawiają go na swoim miejscu. I stoi, nie ruszy się ze swego miejsca. Jeśli ktoś zawoła do niego, nie odzywa się ani go nie wybawia z jego utrapienia."
  tags: []
"Iz46,8":
  text: "Pamiętajcie o tym i wstydźcie się, weźcie to sobie do serca, przestępcy!"
  tags: []
"Iz46,9":
  text: "Wspomnijcie rzeczy dawne i odwieczne, bo ja jestem Bogiem, nie ma żadnego innego, jestem Bogiem i nie ma nikogo podobnego do mnie;"
  tags: []
"Iz46,10":
  text: "Zapowiadam od początku rzeczy ostatnie i od dawna to, czego jeszcze nie było. Mówię: Mój zamiar się spełni i wykonam całą swoją wolę."
  tags: []
"Iz46,11":
  text: "Przywołuję ze wschodu ptaka drapieżnego, z dalekiej ziemi mężczyznę, który wykonuje moją radę. Powiedziałem i wykonam to, postanowiłem i uczynię to."
  tags: []
"Iz46,12":
  text: "Słuchajcie mnie, wy, twardego serca, którzy jesteście dalecy od sprawiedliwości."
  tags: []
"Iz46,13":
  text: "Zbliżę moją sprawiedliwość, nie będzie ona daleko, a moje zbawienie nie odwlecze się. I położę w Syjonie zbawienie, a w Izraelu moją chwałę."
  tags: []
