"Iz30,1":
  text: "Biada upartym synom, mówi PAN, którzy naradzają się, ale nie ze mną, i zasłaniają nakryciem, ale nie z mojego ducha, aby dodawać grzech do grzechu;"
  tags: []
"Iz30,2":
  text: "Którzy wyruszają, by zejść do Egiptu, nie radząc się moich ust, aby umocnić się siłą faraona i schronić się w cieniu Egiptu."
  tags: []
"Iz30,3":
  text: "Dlatego siła faraona będzie dla was zawstydzeniem, a schronienie w cieniu Egiptu waszą hańbą."
  tags: []
"Iz30,4":
  text: "Jego książęta bowiem byli w Soan i jego posłowie dotarli do Chanes."
  tags: []
"Iz30,5":
  text: "Wszyscy zawstydzili się przez lud, który nie był dla nich użyteczny ani pomocny i nie przynosił żadnych korzyści, lecz tylko wstyd i hańbę."
  tags: []
"Iz30,6":
  text: "Brzemię zwierząt południa. Do ziemi ucisku i utrapienia, skąd pochodzi lew i lwiątko, żmija i ognisty smok latający, zaniosą swoje bogactwa na grzbietach osłów i swe skarby na garbach wielbłądów do ludu, który im nic nie pomoże;"
  tags: []
"Iz30,7":
  text: "Bo pomoc Egipcjan będzie daremna i próżna. Dlatego ogłaszam, że ich siłą jest siedzieć w pokoju."
  tags: []
"Iz30,8":
  text: "Teraz idź, napisz to na tablicy przy nich i utrwal w księdze, aby zostało to zachowane na przyszłość i aż na wieki wieków:"
  tags: []
"Iz30,9":
  text: "Że ten lud jest uparty, że to synowie kłamliwi, synowie, którzy nie chcą słuchać prawa PANA;"
  tags: []
"Iz30,10":
  text: "Którzy mówią do widzących: Nie miejcie widzenia; a prorokom: Nie prorokujcie nam, co jest prawe; mówcie nam rzeczy przyjemne, prorokujcie oszustwa;"
  tags: []
"Iz30,11":
  text: "Zejdźcie z drogi, zejdźcie ze ścieżki, zabierzcie sprzed nas Świętego Izraela."
  tags: []
"Iz30,12":
  text: "Dlatego tak mówi Święty Izraela: Ponieważ gardzicie tym słowem, a pokładacie ufność w krzywdzie i przewrotności i na nich polegacie;"
  tags: []
"Iz30,13":
  text: "Dlatego ta nieprawość będzie dla was jak pęknięcie grożące zawaleniem i jak wygięcie na wysokim murze, który zawala się nagle, w mgnieniu oka;"
  tags: []
"Iz30,14":
  text: "I rozbije ją, jak rozbija się gliniane naczynie stłuczone tak bezlitośnie, że nie znajdzie się wśród jego odłamków skorupki, aby nabrać ognia z ogniska lub zaczerpnąć wody ze zbiornika."
  tags: []
"Iz30,15":
  text: "Tak bowiem mówi Pan BÓG, Święty Izraela: W nawróceniu i spokoju będziecie zbawieni; w ciszy i ufności będzie wasza siła. Ale nie chcieliście;"
  tags: []
"Iz30,16":
  text: "Przeciwnie, powiedzieliście: Nie tak, ale na koniach uciekniemy! Dlatego będziecie uciekać. Na szybkich koniach pojedziemy! Dlatego będą szybsi ci, którzy będą was ścigać."
  tags: []
"Iz30,17":
  text: "Tysiąc was ucieknie przed groźbą jednego, a przed groźbą pięciu wszyscy uciekniecie, aż zostaniecie jak maszt na szczycie góry i jak sztandar na pagórku."
  tags: []
"Iz30,18":
  text: "I dlatego PAN będzie czekać, aby okazać wam łaskę, i dlatego będzie wywyższony, aby się zlitować nad wami. PAN bowiem jest Bogiem sądu. Błogosławieni wszyscy, którzy na niego czekają."
  tags: []
"Iz30,19":
  text: "Lud bowiem będzie mieszkał na Syjonie, w Jerozolimie, nie będziesz już płakał. Na pewno zlituje się nad tobą na głos twego wołania, a gdy tylko cię usłyszy, odezwie się."
  tags: []
"Iz30,20":
  text: "A choć Pan dał wam chleb niedoli i wodę ucisku, to jednak twoi nauczyciele nie będą już usunięci, ale twoje oczy zobaczą twoich nauczycieli;"
  tags: []
"Iz30,21":
  text: "Twoje uszy usłyszą słowo wołające za tobą: To jest droga, chodźcie nią – gdybyście zboczyli na prawo lub na lewo."
  tags: []
"Iz30,22":
  text: "Wtedy uznasz za nieczyste obicie swoich rzeźbionych posągów ze srebra i odzienie swoich odlanych posągów ze złota. Wyrzucisz je jako nieczystość miesiączkującej kobiety i powiesz im: Precz stąd."
  tags: []
"Iz30,23":
  text: "Bóg ześle deszcz na twój siew, którym obsiewasz ziemię, i chleb z plonów ziemi będzie syty i obfity. W tym dniu twoje bydło będzie się pasło na rozległych pastwiskach."
  tags: []
"Iz30,24":
  text: "Także woły i osły uprawiające ziemię będą się karmić czystą paszą, która została przesiana wiejadłem i szuflą."
  tags: []
"Iz30,25":
  text: "Na każdej wysokiej górze i na każdym wyniosłym pagórku będą strumienie i potoki wód, w dniu wielkiej rzezi, gdy wieże upadną."
  tags: []
"Iz30,26":
  text: "Światło księżyca będzie jak światło słońca, światło słońca będzie siedmiokrotnie jaśniejsze, jakby światło siedmiu dni – w dniu, kiedy PAN obwiąże złamanie swego ludu i uleczy zadaną mu ranę."
  tags: []
"Iz30,27":
  text: "Oto imię PANA przybywa z daleka, jego gniew płonie, jego brzemię ciężkie. Jego wargi są pełne gniewu, a jego język jak trawiący ogień."
  tags: []
"Iz30,28":
  text: "A jego tchnienie jest jak wezbrana rzeka, która aż po gardła sięga, aby przesiewać narody rzeszotem zniszczenia i włożyć na szczęki narodów zwodnicze wędzidło."
  tags: []
"Iz30,29":
  text: "Wtedy zaśpiewacie jak w noc, gdy obchodzi się uroczyste święto, a rozweselicie się w sercu jak ten, który idzie wśród dźwięków fletu na górę PANA, do Skały Izraela;"
  tags: []
"Iz30,30":
  text: "Gdy PAN da usłyszeć swój wspaniały głos i pokaże swoje wyciągnięte ramię w zapalczywości swego gniewu, w płomieniu trawiącego ognia, z rozproszeniem, wśród nawałnic i gradu."
  tags: []
"Iz30,31":
  text: "Bo głosem PANA zostanie starty Asyryjczyk, który bił kijem."
  tags: []
"Iz30,32":
  text: "I każde uderzenie utwierdzoną rózgą, którą go PAN uderzy, zadane będzie z bębnami i harfami. A w srogich bitwach będzie walczyć z nim."
  tags: []
"Iz30,33":
  text: "Od dawna bowiem przygotowane jest piekło, także dla samego króla jest przygotowane; uczynił je głębokim i szerokim, jego stos to ogień i wiele drew. Tchnienie PANA, jak strumień siarki, rozpala je."
  tags: []
