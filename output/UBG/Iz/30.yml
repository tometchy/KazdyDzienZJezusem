"Iz30,1": "Biada upartym synom, mówi PAN, którzy naradzają się, ale nie ze mną, i zasłaniają nakryciem, ale nie z mojego ducha, aby dodawać grzech do grzechu;"
"Iz30,2": "Którzy wyruszają, by zejść do Egiptu, nie radząc się moich ust, aby umocnić się siłą faraona i schronić się w cieniu Egiptu."
"Iz30,3": "Dlatego siła faraona będzie dla was zawstydzeniem, a schronienie w cieniu Egiptu waszą hańbą."
"Iz30,4": "Jego książęta bowiem byli w Soan i jego posłowie dotarli do Chanes."
"Iz30,5": "Wszyscy zawstydzili się przez lud, który nie był dla nich użyteczny ani pomocny i nie przynosił żadnych korzyści, lecz tylko wstyd i hańbę."
"Iz30,6": "Brzemię zwierząt południa. Do ziemi ucisku i utrapienia, skąd pochodzi lew i lwiątko, żmija i ognisty smok latający, zaniosą swoje bogactwa na grzbietach osłów i swe skarby na garbach wielbłądów do ludu, który im nic nie pomoże;"
"Iz30,7": "Bo pomoc Egipcjan będzie daremna i próżna. Dlatego ogłaszam, że ich siłą jest siedzieć w pokoju."
"Iz30,8": "Teraz idź, napisz to na tablicy przy nich i utrwal w księdze, aby zostało to zachowane na przyszłość i aż na wieki wieków:"
"Iz30,9": "Że ten lud jest uparty, że to synowie kłamliwi, synowie, którzy nie chcą słuchać prawa PANA;"
"Iz30,10": "Którzy mówią do widzących: Nie miejcie widzenia; a prorokom: Nie prorokujcie nam, co jest prawe; mówcie nam rzeczy przyjemne, prorokujcie oszustwa;"
"Iz30,11": "Zejdźcie z drogi, zejdźcie ze ścieżki, zabierzcie sprzed nas Świętego Izraela."
"Iz30,12": "Dlatego tak mówi Święty Izraela: Ponieważ gardzicie tym słowem, a pokładacie ufność w krzywdzie i przewrotności i na nich polegacie;"
"Iz30,13": "Dlatego ta nieprawość będzie dla was jak pęknięcie grożące zawaleniem i jak wygięcie na wysokim murze, który zawala się nagle, w mgnieniu oka;"
"Iz30,14": "I rozbije ją, jak rozbija się gliniane naczynie stłuczone tak bezlitośnie, że nie znajdzie się wśród jego odłamków skorupki, aby nabrać ognia z ogniska lub zaczerpnąć wody ze zbiornika."
"Iz30,15": "Tak bowiem mówi Pan BÓG, Święty Izraela: W nawróceniu i spokoju będziecie zbawieni; w ciszy i ufności będzie wasza siła. Ale nie chcieliście;"
"Iz30,16": "Przeciwnie, powiedzieliście: Nie tak, ale na koniach uciekniemy! Dlatego będziecie uciekać. Na szybkich koniach pojedziemy! Dlatego będą szybsi ci, którzy będą was ścigać."
"Iz30,17": "Tysiąc was ucieknie przed groźbą jednego, a przed groźbą pięciu wszyscy uciekniecie, aż zostaniecie jak maszt na szczycie góry i jak sztandar na pagórku."
"Iz30,18": "I dlatego PAN będzie czekać, aby okazać wam łaskę, i dlatego będzie wywyższony, aby się zlitować nad wami. PAN bowiem jest Bogiem sądu. Błogosławieni wszyscy, którzy na niego czekają."
"Iz30,19": "Lud bowiem będzie mieszkał na Syjonie, w Jerozolimie, nie będziesz już płakał. Na pewno zlituje się nad tobą na głos twego wołania, a gdy tylko cię usłyszy, odezwie się."
"Iz30,20": "A choć Pan dał wam chleb niedoli i wodę ucisku, to jednak twoi nauczyciele nie będą już usunięci, ale twoje oczy zobaczą twoich nauczycieli;"
"Iz30,21": "Twoje uszy usłyszą słowo wołające za tobą: To jest droga, chodźcie nią – gdybyście zboczyli na prawo lub na lewo."
"Iz30,22": "Wtedy uznasz za nieczyste obicie swoich rzeźbionych posągów ze srebra i odzienie swoich odlanych posągów ze złota. Wyrzucisz je jako nieczystość miesiączkującej kobiety i powiesz im: Precz stąd."
"Iz30,23": "Bóg ześle deszcz na twój siew, którym obsiewasz ziemię, i chleb z plonów ziemi będzie syty i obfity. W tym dniu twoje bydło będzie się pasło na rozległych pastwiskach."
"Iz30,24": "Także woły i osły uprawiające ziemię będą się karmić czystą paszą, która została przesiana wiejadłem i szuflą."
"Iz30,25": "Na każdej wysokiej górze i na każdym wyniosłym pagórku będą strumienie i potoki wód, w dniu wielkiej rzezi, gdy wieże upadną."
"Iz30,26": "Światło księżyca będzie jak światło słońca, światło słońca będzie siedmiokrotnie jaśniejsze, jakby światło siedmiu dni – w dniu, kiedy PAN obwiąże złamanie swego ludu i uleczy zadaną mu ranę."
"Iz30,27": "Oto imię PANA przybywa z daleka, jego gniew płonie, jego brzemię ciężkie. Jego wargi są pełne gniewu, a jego język jak trawiący ogień."
"Iz30,28": "A jego tchnienie jest jak wezbrana rzeka, która aż po gardła sięga, aby przesiewać narody rzeszotem zniszczenia i włożyć na szczęki narodów zwodnicze wędzidło."
"Iz30,29": "Wtedy zaśpiewacie jak w noc, gdy obchodzi się uroczyste święto, a rozweselicie się w sercu jak ten, który idzie wśród dźwięków fletu na górę PANA, do Skały Izraela;"
"Iz30,30": "Gdy PAN da usłyszeć swój wspaniały głos i pokaże swoje wyciągnięte ramię w zapalczywości swego gniewu, w płomieniu trawiącego ognia, z rozproszeniem, wśród nawałnic i gradu."
"Iz30,31": "Bo głosem PANA zostanie starty Asyryjczyk, który bił kijem."
"Iz30,32": "I każde uderzenie utwierdzoną rózgą, którą go PAN uderzy, zadane będzie z bębnami i harfami. A w srogich bitwach będzie walczyć z nim."
"Iz30,33": "Od dawna bowiem przygotowane jest piekło, także dla samego króla jest przygotowane; uczynił je głębokim i szerokim, jego stos to ogień i wiele drew. Tchnienie PANA, jak strumień siarki, rozpala je."
