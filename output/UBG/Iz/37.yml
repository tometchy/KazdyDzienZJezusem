"Iz37,1":
  text: "A gdy król Ezechiasz to usłyszał, rozdarł swoje szaty, oblekł się w wór i wszedł do domu PANA."
  tags: []
"Iz37,2":
  text: "I posłał Eliakima, przełożonego swego domu, pisarza Szebnę i starszych spośród kapłanów, obleczonych w wory, do proroka Izajasza, syna Amosa."
  tags: []
"Iz37,3":
  text: "I powiedzieli mu: Tak mówi Ezechiasz: Ten dzień jest dniem utrapienia, upomnienia i bluźnierstwa. Nadszedł bowiem czas porodu dzieci, a nie ma siły, aby je urodzić."
  tags: []
"Iz37,4":
  text: "Może PAN, twój Bóg, usłyszy słowa Rabszaka, którego przysłał król Asyrii, jego pan, aby znieważać Boga żywego, i pomści słowa, które usłyszał PAN, twój Bóg. Zanieś więc modlitwę za resztkę, która pozostaje."
  tags: []
"Iz37,5":
  text: "Tak to słudzy króla Ezechiasza przyszli do Izajasza."
  tags: []
"Iz37,6":
  text: "A Izajasz im odpowiedział: Tak powiedzcie waszemu panu: Tak mówi PAN: Nie bój się tych słów, które słyszałeś, którymi bluźnili mi słudzy króla Asyrii."
  tags: []
"Iz37,7":
  text: "Oto ześlę na niego ducha i usłyszy pewną wieść, a potem wróci do swojej ziemi i sprawię, że padnie od miecza w swojej ziemi."
  tags: []
"Iz37,8":
  text: "Wrócił więc Rabszak i zastał króla Asyrii walczącego przeciwko Libnie. Usłyszał bowiem, że odstąpił od Lakisz."
  tags: []
"Iz37,9":
  text: "A dotarło do niego, że mówiono o Tirhace, królu Etiopii: Oto wyruszył na wojnę przeciwko tobie. Gdy to usłyszał, wysłał posłańców do Ezechiasza z tymi słowami:"
  tags: []
"Iz37,10":
  text: "Tak powiedzcie Ezechiaszowi, królowi Judy: Niech cię nie zwodzi twój Bóg, któremu ufasz, mówiąc: Jerozolima nie zostanie wydana w ręce króla Asyrii."
  tags: []
"Iz37,11":
  text: "Oto słyszałeś, co uczynili królowie Asyrii wszystkim ziemiom, niszcząc je. A ty miałbyś zostać wybawiony?"
  tags: []
"Iz37,12":
  text: "Czy bogowie narodów wybawili tych, których moi ojcowie wygubili: Gozan, Charan, Resef i synów Edenu, którzy byli w Telassar?"
  tags: []
"Iz37,13":
  text: "Gdzie jest król Chamatu, król Arpadu i król miasta Sefarwaim, Heny i Iwwy?"
  tags: []
"Iz37,14":
  text: "Gdy Ezechiasz wziął list z rąk posłów, przeczytał go, wszedł do domu PANA i rozwinął go przed PANEM."
  tags: []
"Iz37,15":
  text: "I Ezechiasz modlił się do PANA, mówiąc:"
  tags: []
"Iz37,16":
  text: "PANIE zastępów, Boże Izraela, który zasiadasz pomiędzy cherubinami, ty, ty jedynie jesteś Bogiem wszystkich królestw ziemi, ty stworzyłeś niebo i ziemię."
  tags: []
"Iz37,17":
  text: "Nakłoń swego ucha, PANIE, i słuchaj. Otwórz swe oczy, PANIE, i spójrz. Słuchaj wszystkich słów Sennacheryba, które przesłał, aby znieważać Boga żywego."
  tags: []
"Iz37,18":
  text: "To prawda, PANIE, że królowie Asyrii spustoszyli wszystkie narody i ich ziemie;"
  tags: []
"Iz37,19":
  text: "I powrzucali ich bogów do ognia. Nie byli bowiem bogami, ale dziełem rąk ludzkich, drewnem i kamieniem. Dlatego ich zniszczyli."
  tags: []
"Iz37,20":
  text: "Teraz więc, PANIE, nasz Boże, wybaw nas z jego ręki, aby wszystkie królestwa ziemi poznały, że jedynie ty jesteś PANEM."
  tags: []
"Iz37,21":
  text: "Wtedy Izajasz, syn Amosa, posłał wiadomość do Ezechiasza: Tak mówi PAN, Bóg Izraela: Ponieważ modliłeś się do mnie w sprawie Sennacheryba, króla Asyrii;"
  tags: []
"Iz37,22":
  text: "Oto słowo, które PAN o nim wypowiedział: Dziewica, córka Syjonu, wzgardziła tobą i śmiała się z ciebie. Córka Jerozolimy kiwała głową za tobą."
  tags: []
"Iz37,23":
  text: "Kogo znieważyłeś i komu bluźniłeś? Przeciwko komu podniosłeś swój głos i wysoko podniosłeś swoje oczy? Przeciwko Świętemu Izraela."
  tags: []
"Iz37,24":
  text: "Przez swoje sługi znieważyłeś Pana i powiedziałeś: Z mnóstwem swoich rydwanów wyszedłem na wysokie góry i zbocza Libanu. Wytnę jego wysokie cedry i jego wyborowe cyprysy i przyjdę aż do najwyższego jego szczytu, do lasów i do lasu jego pola."
  tags: []
"Iz37,25":
  text: "Ja wykopałem studnie i piłem wody, swoimi stopami wysuszyłem wszystkie rzeki oblężonych miejsc."
  tags: []
"Iz37,26":
  text: "Czy nie słyszałeś, że ja dawno to uczyniłem i za dawnych dni to sprawiłem? A teraz wypełniam, gdy obracasz warowne miasta w stosy gruzów."
  tags: []
"Iz37,27":
  text: "Ich mieszkańcy, bezsilni, przestraszyli się i zawstydzili. Byli jak trawa polna, jak świeża zieleń, jak trawa na dachach, jak zboże, które uschło, zanim dojrzało."
  tags: []
"Iz37,28":
  text: "Znam twoje miejsce pobytu, twoje wyjście i twoje wejście, a także twoją wściekłość przeciwko mnie."
  tags: []
"Iz37,29":
  text: "Ponieważ twoja wściekłość na mnie i twoja zuchwałość doszły do moich uszu, włożę moje kółko w twoje nozdrza i moje wędzidło na twoje wargi i zawrócę cię tą drogą, którą przyszedłeś."
  tags: []
"Iz37,30":
  text: "A to będzie znakiem dla ciebie: Tego roku będziesz jadł zboże samorodne, w drugim roku także zboże samorodne, w trzecim roku zaś siejcie i zbierajcie żniwo, sadźcie winnice i jedzcie ich owoce."
  tags: []
"Iz37,31":
  text: "Resztka ocalonych z domu Judy ponownie zapuści korzenie w głąb i wyda owoc w górze."
  tags: []
"Iz37,32":
  text: "Z Jerozolimy wyjdą bowiem resztka i ci, którzy ocaleli z góry Syjon. Sprawi to gorliwość PANA zastępów."
  tags: []
"Iz37,33":
  text: "Dlatego tak mówi PAN o królu Asyrii: Nie wejdzie do tego miasta ani nie wypuści tam strzały, nie wyruszy przeciw niemu z tarczą ani nie usypie szańców przeciwko niemu."
  tags: []
"Iz37,34":
  text: "Drogą, którą przyszedł, powróci, a do tego miasta nie wejdzie, mówi PAN."
  tags: []
"Iz37,35":
  text: "Będę bowiem bronił tego miasta i ocalę je ze względu na siebie i ze względu na Dawida, swego sługę."
  tags: []
"Iz37,36":
  text: "Wtedy wyszedł Anioł PANA i zabił w obozie Asyrii sto osiemdziesiąt pięć tysięcy osób. A gdy wstali wcześnie rano, oto wszędzie było pełno trupów."
  tags: []
"Iz37,37":
  text: "Sennacheryb, król Asyrii, wycofał się więc i wyruszył. Wrócił i zamieszkał w Niniwie."
  tags: []
"Iz37,38":
  text: "A gdy oddawał pokłon w domu swego boga Nisroka, jego synowie – Adramelek i Sareser – zabili go mieczem. Potem uciekli do ziemi Ararat. I Asarchaddon, jego syn, królował w jego miejsce."
  tags: []
