"Iz5,1": "Zaśpiewam teraz mojemu umiłowanemu pieśń mego ukochanego o jego winnicy. Mój umiłowany ma winnicę na urodzajnym pagórku."
"Iz5,2": "Ogrodził ją, oczyścił z kamieni, zasadził szlachetną winorośl, zbudował pośrodku niej wieżę i sporządził w niej tłocznię. I oczekiwał, że wyda winogrona, ale ona wydała dzikie winogrona."
"Iz5,3": "Teraz więc, mieszkańcy Jerozolimy i mężczyźni Judy, rozsądźcie, proszę, między mną a moją winnicą."
"Iz5,4": "Co jeszcze należało uczynić dla mojej winnicy, czego dla niej nie uczyniłem? Dlaczego gdy oczekiwałem, że wyda winogrona, wydała ona dzikie winogrona?"
"Iz5,5": "Oto oznajmię wam, co uczynię dla mojej winnicy: rozbiorę jej płot i będzie spustoszona, zniszczę jej ogrodzenie i będzie zdeptana."
"Iz5,6": "I uczynię z niej pustkowie. Nie będzie przycinana ani okopywana, ale porośnie cierniem i ostem; chmurom także nakażę, aby nie spuszczały na nią deszczu."
"Iz5,7": "Otóż winnicą PANA zastępów jest dom Izraela, a lud Judy jego rozkosznym szczepem. Oczekiwał sądu, a oto ucisk; oczekiwał sprawiedliwości, a oto krzyk."
"Iz5,8": "Biada tym, którzy przyłączają dom do domu i pole dodają do pola, tak że nie ma już wolnego miejsca, tak jakby mieli sami mieszkać na ziemi!"
"Iz5,9": "Do moich uszu mówił PAN zastępów: Zaprawdę wiele domów spustoszeje, a wielkie i piękne domy będą bez mieszkańca."
"Iz5,10": "Do tego dziesięć morgów winnicy wyda jeden bat, a jeden chomer ziarna wyda jedną efę."
"Iz5,11": "Biada tym, którzy od wczesnego ranka wstają, by gonić za mocnym trunkiem, a tak trwają do wieczora, aż wino ich rozpala!"
"Iz5,12": "Na ich biesiadach jest harfa, lutnia, bęben, flet i wino. Lecz sprawy PANA nic ich nie obchodzą ani nie zważają na dzieła jego rąk."
"Iz5,13": "Mój lud pójdzie więc w niewolę, bo nie ma poznania, a jego dostojnicy będą głodni i jego pospólstwo wyschnie z pragnienia."
"Iz5,14": "Dlatego piekło rozszerzyło swą gardziel, rozwarło swoją paszczę bez miary. I do niego zstąpi jego szlachta i pospólstwo, jego zgiełk i weselący się."
"Iz5,15": "W ten sposób zostanie upokorzony prosty człowiek, wielki człowiek zostanie poniżony i oczy wyniosłych zostaną poniżone."
"Iz5,16": "Ale PAN zastępów będzie wywyższony przez swój sąd, a Święty Bóg okaże się święty w sprawiedliwości."
"Iz5,17": "Baranki będą się paść według swego zwyczaju, a obcy pożywią się na opuszczonych polach bogaczy."
"Iz5,18": "Biada tym, którzy ciągną nieprawość sznurami marności, a grzech – jakby powrozem wozu!"
"Iz5,19": "Tym, którzy mówią: Niech się pospieszy i niech przyspieszy swoje dzieło, abyśmy je widzieli, niech się przybliży i przyjdzie zamysł Świętego Izraela, abyśmy go poznali."
"Iz5,20": "Biada tym, którzy zło nazywają dobrem, a dobro złem; którzy ciemność uważają za światłość, a światłość za ciemność; którzy gorycz uważają za słodycz, a słodycz za gorycz!"
"Iz5,21": "Biada tym, którzy we własnych oczach uchodzą za mądrych i uważają się za roztropnych!"
"Iz5,22": "Biada tym, którzy są mocni w piciu wina i dzielni w mieszaniu mocnego napoju!"
"Iz5,23": "Tym, którzy za podarek usprawiedliwiają niegodziwego, a odejmują sprawiedliwym ich sprawiedliwość!"
"Iz5,24": "Dlatego jak ogień pożera ściernisko i jak płomień trawi plewy, tak ich korzeń będzie jak zgnilizna, a ich kwiat ku górze uleci jak proch. Odrzucili bowiem prawo PANA zastępów i wzgardzili słowem Świętego Izraela."
"Iz5,25": "Zapłonął więc gniew PANA na jego lud, wyciągnął na niego swą rękę i uderzył go, aż góry zadrżały i trupy leżały jak gnój rozrzucony po ulicach. Mimo tego wszystkiego jego gniew nie ustał, ale jego ręka jest jeszcze wyciągnięta."
"Iz5,26": "I wzniesie on sztandar dla narodów z daleka, i zaświszcze na nie z krańców ziemi, a oto śpiesznie i prędko przybędą."
"Iz5,27": "Nie będzie wśród nich ani spracowanego, ani potykającego; nie będzie drzemiącego ani śpiącego, nikomu nie rozluźni się pas na biodrach ani nie pęknie rzemyk u sandałów."
"Iz5,28": "Ich strzały są ostre i wszystkie ich łuki napięte; kopyta ich koni są jak krzemień, a ich koła jak wicher."
"Iz5,29": "Ich ryk jak ryk lwicy, będą ryczeć jak lwiątka. Będą zgrzytać i porywać łup, z którym uciekną i nikt im tego nie wyrwie."
"Iz5,30": "W tym dniu będą ryczeć na nich jak szum morza. Gdy spojrzy się na ziemię, oto ciemność i ucisk, a na niebie przyćmi się światło."
