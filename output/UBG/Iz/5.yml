"Iz5,1":
  text: "Zaśpiewam teraz mojemu umiłowanemu pieśń mego ukochanego o jego winnicy. Mój umiłowany ma winnicę na urodzajnym pagórku."
  tags: []
"Iz5,2":
  text: "Ogrodził ją, oczyścił z kamieni, zasadził szlachetną winorośl, zbudował pośrodku niej wieżę i sporządził w niej tłocznię. I oczekiwał, że wyda winogrona, ale ona wydała dzikie winogrona."
  tags: []
"Iz5,3":
  text: "Teraz więc, mieszkańcy Jerozolimy i mężczyźni Judy, rozsądźcie, proszę, między mną a moją winnicą."
  tags: []
"Iz5,4":
  text: "Co jeszcze należało uczynić dla mojej winnicy, czego dla niej nie uczyniłem? Dlaczego gdy oczekiwałem, że wyda winogrona, wydała ona dzikie winogrona?"
  tags: []
"Iz5,5":
  text: "Oto oznajmię wam, co uczynię dla mojej winnicy: rozbiorę jej płot i będzie spustoszona, zniszczę jej ogrodzenie i będzie zdeptana."
  tags: []
"Iz5,6":
  text: "I uczynię z niej pustkowie. Nie będzie przycinana ani okopywana, ale porośnie cierniem i ostem; chmurom także nakażę, aby nie spuszczały na nią deszczu."
  tags: []
"Iz5,7":
  text: "Otóż winnicą PANA zastępów jest dom Izraela, a lud Judy jego rozkosznym szczepem. Oczekiwał sądu, a oto ucisk; oczekiwał sprawiedliwości, a oto krzyk."
  tags: []
"Iz5,8":
  text: "Biada tym, którzy przyłączają dom do domu i pole dodają do pola, tak że nie ma już wolnego miejsca, tak jakby mieli sami mieszkać na ziemi!"
  tags: []
"Iz5,9":
  text: "Do moich uszu mówił PAN zastępów: Zaprawdę wiele domów spustoszeje, a wielkie i piękne domy będą bez mieszkańca."
  tags: []
"Iz5,10":
  text: "Do tego dziesięć morgów winnicy wyda jeden bat, a jeden chomer ziarna wyda jedną efę."
  tags: []
"Iz5,11":
  text: "Biada tym, którzy od wczesnego ranka wstają, by gonić za mocnym trunkiem, a tak trwają do wieczora, aż wino ich rozpala!"
  tags: []
"Iz5,12":
  text: "Na ich biesiadach jest harfa, lutnia, bęben, flet i wino. Lecz sprawy PANA nic ich nie obchodzą ani nie zważają na dzieła jego rąk."
  tags: []
"Iz5,13":
  text: "Mój lud pójdzie więc w niewolę, bo nie ma poznania, a jego dostojnicy będą głodni i jego pospólstwo wyschnie z pragnienia."
  tags: []
"Iz5,14":
  text: "Dlatego piekło rozszerzyło swą gardziel, rozwarło swoją paszczę bez miary. I do niego zstąpi jego szlachta i pospólstwo, jego zgiełk i weselący się."
  tags: []
"Iz5,15":
  text: "W ten sposób zostanie upokorzony prosty człowiek, wielki człowiek zostanie poniżony i oczy wyniosłych zostaną poniżone."
  tags: []
"Iz5,16":
  text: "Ale PAN zastępów będzie wywyższony przez swój sąd, a Święty Bóg okaże się święty w sprawiedliwości."
  tags: []
"Iz5,17":
  text: "Baranki będą się paść według swego zwyczaju, a obcy pożywią się na opuszczonych polach bogaczy."
  tags: []
"Iz5,18":
  text: "Biada tym, którzy ciągną nieprawość sznurami marności, a grzech – jakby powrozem wozu!"
  tags: []
"Iz5,19":
  text: "Tym, którzy mówią: Niech się pospieszy i niech przyspieszy swoje dzieło, abyśmy je widzieli, niech się przybliży i przyjdzie zamysł Świętego Izraela, abyśmy go poznali."
  tags: []
"Iz5,20":
  text: "Biada tym, którzy zło nazywają dobrem, a dobro złem; którzy ciemność uważają za światłość, a światłość za ciemność; którzy gorycz uważają za słodycz, a słodycz za gorycz!"
  tags: []
"Iz5,21":
  text: "Biada tym, którzy we własnych oczach uchodzą za mądrych i uważają się za roztropnych!"
  tags: []
"Iz5,22":
  text: "Biada tym, którzy są mocni w piciu wina i dzielni w mieszaniu mocnego napoju!"
  tags: []
"Iz5,23":
  text: "Tym, którzy za podarek usprawiedliwiają niegodziwego, a odejmują sprawiedliwym ich sprawiedliwość!"
  tags: []
"Iz5,24":
  text: "Dlatego jak ogień pożera ściernisko i jak płomień trawi plewy, tak ich korzeń będzie jak zgnilizna, a ich kwiat ku górze uleci jak proch. Odrzucili bowiem prawo PANA zastępów i wzgardzili słowem Świętego Izraela."
  tags: []
"Iz5,25":
  text: "Zapłonął więc gniew PANA na jego lud, wyciągnął na niego swą rękę i uderzył go, aż góry zadrżały i trupy leżały jak gnój rozrzucony po ulicach. Mimo tego wszystkiego jego gniew nie ustał, ale jego ręka jest jeszcze wyciągnięta."
  tags: []
"Iz5,26":
  text: "I wzniesie on sztandar dla narodów z daleka, i zaświszcze na nie z krańców ziemi, a oto śpiesznie i prędko przybędą."
  tags: []
"Iz5,27":
  text: "Nie będzie wśród nich ani spracowanego, ani potykającego; nie będzie drzemiącego ani śpiącego, nikomu nie rozluźni się pas na biodrach ani nie pęknie rzemyk u sandałów."
  tags: []
"Iz5,28":
  text: "Ich strzały są ostre i wszystkie ich łuki napięte; kopyta ich koni są jak krzemień, a ich koła jak wicher."
  tags: []
"Iz5,29":
  text: "Ich ryk jak ryk lwicy, będą ryczeć jak lwiątka. Będą zgrzytać i porywać łup, z którym uciekną i nikt im tego nie wyrwie."
  tags: []
"Iz5,30":
  text: "W tym dniu będą ryczeć na nich jak szum morza. Gdy spojrzy się na ziemię, oto ciemność i ucisk, a na niebie przyćmi się światło."
  tags: []
