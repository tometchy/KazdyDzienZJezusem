"Iz13,1":
  text: "Brzemię Babilonu, które widział Izajasz, syn Amosa."
  tags: []
"Iz13,2":
  text: "Na wysokiej górze wznieście sztandar, podnieście na nich głos, machajcie ręką, aby weszli w bramy książąt."
  tags: []
"Iz13,3":
  text: "Ja nakazałem swoim poświęconym, wezwałem też swoich mocarzy do okazywania mojego gniewu, tych, którzy radują się z mojego majestatu."
  tags: []
"Iz13,4":
  text: "Odgłosy zgrai na górach jakby licznego ludu, odgłosy zgiełku królestw, zgromadzonych narodów. PAN zastępów gromadzi wojsko na wojnę."
  tags: []
"Iz13,5":
  text: "Przybywają z dalekiej ziemi, z krańców nieba, PAN i narzędzia jego zapalczywości, aby spustoszyć całą ziemię."
  tags: []
"Iz13,6":
  text: "Zawódźcie, bo bliski jest dzień PANA; przyjdzie jak spustoszenie od Wszechmocnego."
  tags: []
"Iz13,7":
  text: "Dlatego wszelkie ręce opadną, a każde serce człowieka struchleje."
  tags: []
"Iz13,8":
  text: "I będą przerażeni: ogarną ich skurcze i boleści, będą wić się z bólu jak rodząca kobieta. Jeden na drugiego spojrzy z osłupieniem, ich twarze będą podobne do płomieni."
  tags: []
"Iz13,9":
  text: "Oto dzień PANA nadchodzi, okrutny, w zapalczywości i srogim gniewie, aby zamienić tę ziemię w pustynię i wytępić z niej grzeszników."
  tags: []
"Iz13,10":
  text: "Gwiazdy nieba bowiem i ich konstelacje nie będą jaśniały swoim światłem. Słońce się zaćmi, gdy tylko wzejdzie, a księżyc nie zabłyśnie swoim światłem."
  tags: []
"Iz13,11":
  text: "I ukarzę świat za jego zło i niegodziwych za ich nieprawość; położę kres pysze zuchwałych i poniżę wyniosłość okrutników."
  tags: []
"Iz13,12":
  text: "Uczynię człowieka droższym niż czyste złoto, a nawet droższym niż złoto z Ofiru."
  tags: []
"Iz13,13":
  text: "Dlatego zatrząsnę niebem, a ziemia ruszy się ze swego miejsca pod zapalczywością PANA zastępów i w dniu jego srogiego gniewu."
  tags: []
"Iz13,14":
  text: "I będzie jak spłoszona sarna i jak trzoda, której nikt nie gromadzi: każdy powróci do swego ludu i każdy ucieknie do swojej ziemi."
  tags: []
"Iz13,15":
  text: "Każdy, kogo znajdą, zostanie przebity; a każdy, kto się do nich przyłączy, polegnie od miecza."
  tags: []
"Iz13,16":
  text: "Ich dzieci będą roztrzaskane na ich oczach, ich domy będą splądrowane, a ich żony – zgwałcone."
  tags: []
"Iz13,17":
  text: "Oto pobudzę przeciwko nim Medów, którzy o srebro nie będą dbać, a w złocie nie będą się lubować."
  tags: []
"Iz13,18":
  text: "Ich łuki roztrzaskają młodzieńców, nie zlitują się nad płodem łona, ich oko nie przepuści dzieciom."
  tags: []
"Iz13,19":
  text: "I Babilon, ozdoba królestw i chluba majestatu Chaldejczyków, stanie się jak Sodoma i Gomora, kiedy Bóg je zniszczył."
  tags: []
"Iz13,20":
  text: "Nie będzie nigdy więcej zamieszkany ani zasiedlony z pokolenia na pokolenie; Arab nie rozbije tam namiotu ani pasterze nie odpoczną tam z trzodami."
  tags: []
"Iz13,21":
  text: "Ale dziki zwierz pustyni będzie tam odpoczywać, a ich domy będą pełne wyjących bestii; zamieszkają tam sowy, a kozice będą tam podskakiwać."
  tags: []
"Iz13,22":
  text: "Straszne bestie wysp będą wyć w ich opuszczonych domach, a smoki w ich wspaniałych pałacach. Jego czas jest bliski, jego dni nie będą przedłużone."
  tags: []
