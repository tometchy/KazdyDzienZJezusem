"Iz11,1":
  text: "I wyjdzie gałązka z pnia Jessego, a latorośl z jego korzenia wyrośnie."
  tags: []
"Iz11,2":
  text: "I spocznie na nim Duch PANA, duch mądrości i rozumu, duch rady i mocy, duch poznania i bojaźni PANA."
  tags: []
"Iz11,3":
  text: "I będzie czujny w bojaźni PANA, nie będzie sądził według tego, co oczy widzą, ani karał według tego, co uszy słyszą."
  tags: []
"Iz11,4":
  text: "Ale w sprawiedliwości będzie sądził ubogich, a w prawości będzie rozstrzygał sprawy cichych na ziemi. Uderzy ziemię rózgą swoich ust, a tchnieniem swoich warg zabije niegodziwego."
  tags: []
"Iz11,5":
  text: "Sprawiedliwość będzie pasem jego bioder, a prawda pasem jego lędźwi."
  tags: []
"Iz11,6":
  text: "I wilk będzie przebywał z barankiem, a lampart będzie leżał przy koźlęciu; także cielę i młody lew, i tuczne bydło będą razem; a małe dziecko będzie je prowadziło."
  tags: []
"Iz11,7":
  text: "Krowa i niedźwiedzica razem będą się pasły, ich młode będą leżały razem, a lew, jak wół, będzie jeść słomę."
  tags: []
"Iz11,8":
  text: "Niemowlę będzie się bawić nad jamą żmii; a dziecko włoży swą rękę do nory jadowitego węża."
  tags: []
"Iz11,9":
  text: "Nie będą wyrządzać krzywdy ani zabijać na całej mojej świętej górze, bo ziemia będzie napełniona poznaniem PANA, tak jak wody okrywają morze."
  tags: []
"Iz11,10":
  text: "W tym dniu korzeń Jessego będzie stać jako sztandar dla narodów. Poganie będą się do niego zwracać, a jego odpoczynek będzie cudowny."
  tags: []
"Iz11,11":
  text: "Stanie się też w tym dniu, że Pan ponownie wyciągnie swą rękę, aby wykupić resztkę swego ludu, który pozostanie, z Asyrii i Egiptu, z Patros i Chus, z Elamu i Szinearu, i z Chamat, i wysp morskich."
  tags: []
"Iz11,12":
  text: "I podniesie sztandar dla narodów, i zgromadzi wygnańców z Izraela, a rozproszonych z Judy zbierze z czterech krańców ziemi."
  tags: []
"Iz11,13":
  text: "Ustanie zazdrość Efraima, a nieprzyjaciele Judy zostaną wytraceni. Efraim nie będzie zazdrościł Judzie, a Juda nie będzie trapił Efraima;"
  tags: []
"Iz11,14":
  text: "Ale polecą na ramionach Filistynów ku zachodowi, razem złupią narody na wschodzie; na Edomitów i Moabitów położą swą rękę, a synowie Amona będą im posłuszni."
  tags: []
"Iz11,15":
  text: "I PAN zniszczy odnogę morza Egiptu i swoim potężnym wiatrem potrząśnie swoją ręką nad rzeką, uderzy jej siedem strumieni i sprawi, że będą przez nią przechodzić w obuwiu."
  tags: []
"Iz11,16":
  text: "Tak powstanie droga dla resztki jego ludu, który pozostanie z Asyrii, jak powstała dla Izraela w tym dniu, kiedy wychodził z ziemi Egiptu."
  tags: []
