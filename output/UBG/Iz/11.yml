"Iz11,1": "I wyjdzie gałązka z pnia Jessego, a latorośl z jego korzenia wyrośnie."
"Iz11,2": "I spocznie na nim Duch PANA, duch mądrości i rozumu, duch rady i mocy, duch poznania i bojaźni PANA."
"Iz11,3": "I będzie czujny w bojaźni PANA, nie będzie sądził według tego, co oczy widzą, ani karał według tego, co uszy słyszą."
"Iz11,4": "Ale w sprawiedliwości będzie sądził ubogich, a w prawości będzie rozstrzygał sprawy cichych na ziemi. Uderzy ziemię rózgą swoich ust, a tchnieniem swoich warg zabije niegodziwego."
"Iz11,5": "Sprawiedliwość będzie pasem jego bioder, a prawda pasem jego lędźwi."
"Iz11,6": "I wilk będzie przebywał z barankiem, a lampart będzie leżał przy koźlęciu; także cielę i młody lew, i tuczne bydło będą razem; a małe dziecko będzie je prowadziło."
"Iz11,7": "Krowa i niedźwiedzica razem będą się pasły, ich młode będą leżały razem, a lew, jak wół, będzie jeść słomę."
"Iz11,8": "Niemowlę będzie się bawić nad jamą żmii; a dziecko włoży swą rękę do nory jadowitego węża."
"Iz11,9": "Nie będą wyrządzać krzywdy ani zabijać na całej mojej świętej górze, bo ziemia będzie napełniona poznaniem PANA, tak jak wody okrywają morze."
"Iz11,10": "W tym dniu korzeń Jessego będzie stać jako sztandar dla narodów. Poganie będą się do niego zwracać, a jego odpoczynek będzie cudowny."
"Iz11,11": "Stanie się też w tym dniu, że Pan ponownie wyciągnie swą rękę, aby wykupić resztkę swego ludu, który pozostanie, z Asyrii i Egiptu, z Patros i Chus, z Elamu i Szinearu, i z Chamat, i wysp morskich."
"Iz11,12": "I podniesie sztandar dla narodów, i zgromadzi wygnańców z Izraela, a rozproszonych z Judy zbierze z czterech krańców ziemi."
"Iz11,13": "Ustanie zazdrość Efraima, a nieprzyjaciele Judy zostaną wytraceni. Efraim nie będzie zazdrościł Judzie, a Juda nie będzie trapił Efraima;"
"Iz11,14": "Ale polecą na ramionach Filistynów ku zachodowi, razem złupią narody na wschodzie; na Edomitów i Moabitów położą swą rękę, a synowie Amona będą im posłuszni."
"Iz11,15": "I PAN zniszczy odnogę morza Egiptu i swoim potężnym wiatrem potrząśnie swoją ręką nad rzeką, uderzy jej siedem strumieni i sprawi, że będą przez nią przechodzić w obuwiu."
"Iz11,16": "Tak powstanie droga dla resztki jego ludu, który pozostanie z Asyrii, jak powstała dla Izraela w tym dniu, kiedy wychodził z ziemi Egiptu."
