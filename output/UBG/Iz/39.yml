"Iz39,1":
  text: "W tym czasie Merodak-Baladan, syn Baladana, król Babilonu, posłał listy i dar do Ezechiasza. Usłyszał bowiem, że chorował, a potem wyzdrowiał."
  tags: []
"Iz39,2":
  text: "I Ezechiasz ucieszył się z tego, i pokazał im cały skarbiec swoich kosztowności: srebro i złoto, wonności, drogocenne olejki oraz swoją zbrojownię, a także wszystko, co się znajdowało w jego skarbcach. Nie było niczego, czego Ezechiasz by im nie pokazał w swoim domu i w całym swoim państwie."
  tags: []
"Iz39,3":
  text: "Wtedy prorok Izajasz przyszedł do króla Ezechiasza i zapytał go: Co powiedzieli ci mężczyźni i skąd przyszli do ciebie? Ezechiasz odpowiedział: Przybyli do mnie z dalekiej ziemi, z Babilonu."
  tags: []
"Iz39,4":
  text: "Znowu zapytał: Co widzieli w twoim domu? Ezechiasz odpowiedział: Widzieli wszystko, co jest w moim domu. Nie było niczego, czego bym im nie pokazał w swoich skarbcach."
  tags: []
"Iz39,5":
  text: "Wtedy Izajasz powiedział do Ezechiasza: Słuchaj słowa PANA zastępów:"
  tags: []
"Iz39,6":
  text: "Oto przyjdą dni, gdy zabiorą do Babilonu wszystko, co jest w twoim domu i co twoi ojcowie zgromadzili aż do tego dnia, mówi PAN."
  tags: []
"Iz39,7":
  text: "A z twoich synów, którzy będą pochodzić od ciebie i których spłodzisz, zabiorą niektórych i będą eunuchami w pałacu króla Babilonu."
  tags: []
"Iz39,8":
  text: "Wtedy Ezechiasz powiedział do Izajasza: Dobre jest słowo PANA, które wypowiedziałeś. I dodał: Będzie bowiem pokój i prawda za moich dni."
  tags: []
