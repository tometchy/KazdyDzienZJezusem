"Iz23,1":
  text: "Brzemię Tyru. Zawódźcie, okręty Tarszisz, bo został zburzony tak, że nie ma ani domu, ani żadnego portu; oznajmiono im z ziemi Kittim."
  tags: []
"Iz23,2":
  text: "Zamilczcie, mieszkańcy wyspy; którą napełnili kupcy Sydonu, przepływając przez morze."
  tags: []
"Iz23,3":
  text: "I ziarno Szichoru, sprowadzane przez wielkie wody, żniwo rzeki, było jego dochodem; był też rynkiem narodów."
  tags: []
"Iz23,4":
  text: "Wstydź się, Sydonie. Przemówiło bowiem morze, przemówiła twierdza morska: Nie wiję się w bólu ani nie rodzę, nie wychowuję młodzieńców ani nie odchowuję dziewic."
  tags: []
"Iz23,5":
  text: "Jak na wieść o Egipcie tak będą się wić na wieść o Tyrze."
  tags: []
"Iz23,6":
  text: "Przeprawcie się do Tarszisz, zawódźcie, mieszkańcy wyspy!"
  tags: []
"Iz23,7":
  text: "Czy to jest wasze wesołe miasto, którego historia sięga dawnych dni? Jego własne nogi zawiodą je na daleką wędrówkę."
  tags: []
"Iz23,8":
  text: "Kto powziął takie postanowienie przeciw Tyrowi, który rozdawał korony, którego kupcy są książętami, a jego handlarze – szanowanymi ziemi?"
  tags: []
"Iz23,9":
  text: "PAN zastępów to postanowił, aby poniżyć pychę całej jego chwały i aby znieważyć wszystkich szanowanych ziemi."
  tags: []
"Iz23,10":
  text: "Przeprawcie się przez swoją ziemię jak rzeka, o córko Tarszisz. Nie ma już siły."
  tags: []
"Iz23,11":
  text: "Wyciągnął swoją rękę nad morze, zatrząsł królestwami. PAN wydał rozkaz przeciwko Kanaanowi, aby zburzyć jego twierdze;"
  tags: []
"Iz23,12":
  text: "I powiedział: Już nie będziesz się weselić, ty zhańbiona dziewico, córko Sydonu. Powstań, przepraw się do Kittim; lecz i tam nie będziesz miała odpoczynku."
  tags: []
"Iz23,13":
  text: "Oto ziemia Chaldejczyków – ten lud nie był ludem. Asyryjczyk założył ją dla mieszkańców pustyni. Wznieśli jej wieże, pobudowali jej pałace, ale on obrócił ją w gruzy."
  tags: []
"Iz23,14":
  text: "Zawódźcie, okręty Tarszisz, gdyż wasza twierdza jest zburzona."
  tags: []
"Iz23,15":
  text: "I stanie się w tym dniu, że Tyr pójdzie w zapomnienie na siedemdziesiąt lat, na okres dni jednego króla. A po upływie siedemdziesięciu lat Tyr będzie śpiewał jak nierządnica."
  tags: []
"Iz23,16":
  text: "Weź harfę, obejdź miasto, zapomniana nierządnico! Graj ładnie, śpiewaj dużo, by przypomniano sobie ciebie."
  tags: []
"Iz23,17":
  text: "I stanie się po upływie siedemdziesięciu lat, że PAN nawiedzi Tyr, a ten wróci do czerpania korzyści ze swego nierządu i będzie go uprawiał ze wszystkimi królestwami świata na powierzchni ziemi."
  tags: []
"Iz23,18":
  text: "Lecz jego dochody i jego zysk będą poświęcone PANU. Nie będzie ich odkładać i gromadzić. Jego dochody będą dla tych, którzy przebywają przed PANEM, aby mogli jeść do syta i mieć dobre ubranie."
  tags: []
