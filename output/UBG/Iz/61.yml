"Iz61,1": "Duch Pana BOGA jest nade mną, bo PAN mnie namaścił, abym głosił dobrą nowinę cichym, posłał mnie, abym opatrzył rany skruszonym w sercu, abym zwiastował uwięzionym wyzwolenie, a związanym otworzenie więzienia;"
"Iz61,2": "Abym ogłosił miłościwy rok PANA i dzień pomsty naszego Boga; abym pocieszył wszystkich płaczących;"
"Iz61,3": "Abym sprawił radość płaczącym w Syjonie i dał im ozdobę zamiast popiołu, olejek radości zamiast smutku, szatę chwały zamiast ducha przygnębienia; i będą nazwani drzewami sprawiedliwości, szczepem PANA, aby był uwielbiony."
"Iz61,4": "I odbudują starodawne ruiny, naprawią dawne spustoszenia i odnowią zniszczone miasta, opustoszałe od wielu pokoleń."
"Iz61,5": "I stawią się cudzoziemcy, i będą paść wasze stada, a synowie cudzoziemców będą waszymi oraczami i winogrodnikami."
"Iz61,6": "Ale wy będziecie nazwani kapłanami PANA, będą was nazywać sługami naszego Boga. Będziecie korzystać z bogactwa narodów i będziecie się chlubić ich chwałą."
"Iz61,7": "Za waszą hańbę wynagrodzę wam podwójnie, a zamiast wstydzić się, będziecie śpiewać; dlatego posiądziecie podwójne dziedzictwo z ich działu i w ich ziemi. I będziecie mieć wieczną radość."
"Iz61,8": "Ja bowiem, PAN, miłuję sąd i nienawidzę grabieży dla całopalenia; dlatego sprawię, by wykonali swoje dzieła w prawdzie i zawrę z nimi wieczne przymierze."
"Iz61,9": "Ich potomstwo będzie znane wśród pogan, a ich potomkowie pośród ludów; wszyscy, którzy ich zobaczą, poznają, że są potomstwem błogosławionym przez PANA."
"Iz61,10": "Będę się wielce radować w PANU i moja dusza rozraduje się w moim Bogu, bo przyoblekł mnie w szaty zbawienia i przyodział mnie w płaszcz sprawiedliwości, jak przyozdobionego oblubieńca i jak oblubienicę ozdobioną swoimi klejnotami."
"Iz61,11": "Jak ziemia bowiem wydaje swe plony i jak ogród wydaje nasienie, tak Pan BÓG sprawi, że wzejdzie sprawiedliwość i chwała przed wszystkimi narodami."
