"Iz61,1":
  text: "Duch Pana BOGA jest nade mną, bo PAN mnie namaścił, abym głosił dobrą nowinę cichym, posłał mnie, abym opatrzył rany skruszonym w sercu, abym zwiastował uwięzionym wyzwolenie, a związanym otworzenie więzienia;"
  tags: []
"Iz61,2":
  text: "Abym ogłosił miłościwy rok PANA i dzień pomsty naszego Boga; abym pocieszył wszystkich płaczących;"
  tags: []
"Iz61,3":
  text: "Abym sprawił radość płaczącym w Syjonie i dał im ozdobę zamiast popiołu, olejek radości zamiast smutku, szatę chwały zamiast ducha przygnębienia; i będą nazwani drzewami sprawiedliwości, szczepem PANA, aby był uwielbiony."
  tags: []
"Iz61,4":
  text: "I odbudują starodawne ruiny, naprawią dawne spustoszenia i odnowią zniszczone miasta, opustoszałe od wielu pokoleń."
  tags: []
"Iz61,5":
  text: "I stawią się cudzoziemcy, i będą paść wasze stada, a synowie cudzoziemców będą waszymi oraczami i winogrodnikami."
  tags: []
"Iz61,6":
  text: "Ale wy będziecie nazwani kapłanami PANA, będą was nazywać sługami naszego Boga. Będziecie korzystać z bogactwa narodów i będziecie się chlubić ich chwałą."
  tags: []
"Iz61,7":
  text: "Za waszą hańbę wynagrodzę wam podwójnie, a zamiast wstydzić się, będziecie śpiewać; dlatego posiądziecie podwójne dziedzictwo z ich działu i w ich ziemi. I będziecie mieć wieczną radość."
  tags: []
"Iz61,8":
  text: "Ja bowiem, PAN, miłuję sąd i nienawidzę grabieży dla całopalenia; dlatego sprawię, by wykonali swoje dzieła w prawdzie i zawrę z nimi wieczne przymierze."
  tags: []
"Iz61,9":
  text: "Ich potomstwo będzie znane wśród pogan, a ich potomkowie pośród ludów; wszyscy, którzy ich zobaczą, poznają, że są potomstwem błogosławionym przez PANA."
  tags: []
"Iz61,10":
  text: "Będę się wielce radować w PANU i moja dusza rozraduje się w moim Bogu, bo przyoblekł mnie w szaty zbawienia i przyodział mnie w płaszcz sprawiedliwości, jak przyozdobionego oblubieńca i jak oblubienicę ozdobioną swoimi klejnotami."
  tags: []
"Iz61,11":
  text: "Jak ziemia bowiem wydaje swe plony i jak ogród wydaje nasienie, tak Pan BÓG sprawi, że wzejdzie sprawiedliwość i chwała przed wszystkimi narodami."
  tags: []
