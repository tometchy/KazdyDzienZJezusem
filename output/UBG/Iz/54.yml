"Iz54,1":
  text: "Śpiewaj, niepłodna, która nie rodziłaś, śpiewaj głośno i krzycz, która nie zaznałaś bólów rodzenia. Więcej bowiem jest synów opuszczonej niż synów zamężnej, mówi PAN."
  tags: []
"Iz54,2":
  text: "Rozszerz miejsce swego namiotu, a niech rozciągają zasłony twoich mieszkań; nie oszczędzaj, wydłuż swoje powrozy i wzmocnij swoje kołki."
  tags: []
"Iz54,3":
  text: "Rozprzestrzenisz się bowiem na prawo i lewo, a twoje potomstwo odziedziczy narody i zaludni spustoszone miasta."
  tags: []
"Iz54,4":
  text: "Nie bój się, bo nie zostaniesz zawstydzona, nie rumień się, bo nie doznasz hańby, gdyż zapomnisz o wstydzie swojej młodości i o niesławie swego wdowieństwa już więcej nie wspomnisz."
  tags: []
"Iz54,5":
  text: "Bo twoim małżonkiem jest twój Stwórca, PAN zastępów – to jego imię, a twoim Odkupicielem jest Święty Izraela – będzie nazywany Bogiem całej ziemi."
  tags: []
"Iz54,6":
  text: "PAN bowiem powołał cię jak żonę opuszczoną i przygnębioną na duchu, jak młodą żonę, gdy była porzucona, mówi twój Bóg."
  tags: []
"Iz54,7":
  text: "Na krótką chwilę cię opuściłem, ale w wielkim miłosierdziu przygarniam cię."
  tags: []
"Iz54,8":
  text: "W niewielkim gniewie ukryłem na chwilę swoją twarz przed tobą, ale zlituję się nad tobą w wiecznym miłosierdziu, mówi PAN, twój Odkupiciel."
  tags: []
"Iz54,9":
  text: "Jest to bowiem dla mnie tak, jak było przy potopie Noego: jak przysięgałem, że wody Noego już więcej nie będą rozlewać się po ziemi, tak też przysięgałem, że nie rozgniewam się na ciebie ani nie będę cię gromić."
  tags: []
"Iz54,10":
  text: "A choćby i góry się poruszyły i pagórki się zachwiały, moje miłosierdzie nie odstąpi od ciebie, a przymierze mojego pokoju nie zachwieje się, mówi PAN, który lituje się nad tobą."
  tags: []
"Iz54,11":
  text: "O utrapiona, smagana wichrem, niepocieszona! Oto położę twoje kamienie na błyszczących kamieniach, a twoje fundamenty na szafirach."
  tags: []
"Iz54,12":
  text: "I uczynię twoje okna z kryształu, twoje bramy z kamienia rubinowego i wszystkie twoje mury graniczne z drogich kamieni."
  tags: []
"Iz54,13":
  text: "A wszystkie twoje dzieci będą wyuczone przez PANA, wielki będzie pokój twoich dzieci."
  tags: []
"Iz54,14":
  text: "W sprawiedliwości będziesz utwierdzona, będziesz daleka od ucisku, bo nie będziesz się go bać; i od trwogi, bo nie zbliży się do ciebie."
  tags: []
"Iz54,15":
  text: "Oto zbiorą się razem, ale nie przeze mnie. Ktokolwiek zbierze się przeciwko tobie, upadnie ze względu na ciebie."
  tags: []
"Iz54,16":
  text: "Oto stworzyłem kowala, który dmie na węgiel w ogniu i wyciąga narzędzia do obróbki. Ja stworzyłem też burzyciela, aby niszczył."
  tags: []
"Iz54,17":
  text: "Żadna broń przeciw tobie sporządzona nie będzie skuteczna, a każdy język, który w sądzie występuje przeciw tobie, potępisz. To jest dziedzictwo sług PANA, a ich sprawiedliwość pochodzi ode mnie, mówi PAN."
  tags: []
