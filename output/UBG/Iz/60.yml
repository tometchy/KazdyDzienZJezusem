"Iz60,1":
  text: "Powstań, zajaśniej, ponieważ przyszła twoja światłość i chwała PANA wzeszła nad tobą."
  tags: []
"Iz60,2":
  text: "Oto bowiem ciemność okryje ziemię i mrok – ludy, ale nad tobą wzejdzie PAN i jego chwała pojawi się nad tobą."
  tags: []
"Iz60,3":
  text: "I pójdą narody do twojej światłości, a królowie do blasku twojego wschodu."
  tags: []
"Iz60,4":
  text: "Podnieś wokoło swe oczy i spójrz: ci wszyscy, którzy się zgromadzili, przyjdą do ciebie. Twoi synowie przyjdą z daleka i twoje córki będą wychowane przy twoim boku."
  tags: []
"Iz60,5":
  text: "Wtedy zobaczysz i rozweselisz się, twoje serce zadrży i rozszerzy się, gdyż nawróci się do ciebie tłum morski, a siły narodów przyjdą do ciebie."
  tags: []
"Iz60,6":
  text: "Okryje cię mnóstwo wielbłądów, dromadery z Midianu i Efy. Przyjdą wszyscy z Szeby, przyniosą złoto i kadzidło i będą głosić chwałę PANA."
  tags: []
"Iz60,7":
  text: "Wszystkie stada Kedaru zgromadzą się u ciebie, barany Nebajotu będą ci służyć: wstąpią na mój ołtarz, gdzie będą przyjęte; i tak ozdobię dom mego majestatu."
  tags: []
"Iz60,8":
  text: "I powiesz: Kim są ci, co nadciągają jak obłoki i jak gołębie do swoich okien?"
  tags: []
"Iz60,9":
  text: "Zaprawdę wyspy oczekują mnie, a na czele okręty Tarszisz, aby przyprowadzić twoich synów z daleka, a z nimi ich srebro i złoto, do imienia PANA, twego Boga, i do Świętego Izraela, bo cię uwielbił."
  tags: []
"Iz60,10":
  text: "Synowie cudzoziemców odbudują twoje mury i ich królowie będą ci służyć, gdyż w moim gniewie uderzyłem cię, a w mojej łaskawości zlitowałem się nad tobą."
  tags: []
"Iz60,11":
  text: "I twoje bramy będą nieustannie otwarte, nie będą zamknięte ani w dzień, ani w nocy, aby można było przyprowadzić do ciebie siły narodów, i aby ich królowie byli przyprowadzeni."
  tags: []
"Iz60,12":
  text: "Ten naród i królestwo, które nie będą ci służyć, zginą. Takie narody właśnie zostaną do szczętu spustoszone."
  tags: []
"Iz60,13":
  text: "Chwała Libanu przyjdzie do ciebie: razem cyprys, sosna oraz bukszpan, na ozdobę miejsca mojej świątyni. I wsławię miejsce moich nóg."
  tags: []
"Iz60,14":
  text: "Przyjdą też do ciebie w pokorze synowie tych, którzy cię trapili, i będą się kłaniać do twoich stóp wszyscy ci, którzy tobą wzgardzili. I nazwą cię Miastem PANA, Syjonem Świętego Izraela."
  tags: []
"Iz60,15":
  text: "Za to, że byłaś opuszczona i znienawidzona tak, że nie było nikogo, kto by przez ciebie przechodził, uczynię cię wiecznym dostojeństwem, radością z pokolenia na pokolenie."
  tags: []
"Iz60,16":
  text: "Będziesz ssać mleko narodów i piersiami królów będziesz karmiona. I poznasz, że ja jestem PANEM, twoim Zbawicielem i twoim Odkupicielem, Mocarzem Jakuba."
  tags: []
"Iz60,17":
  text: "Zamiast miedzi naniosę złota, a zamiast żelaza naniosę srebra, zamiast drewna – miedzi, a zamiast kamieni – żelazo. Ustanowię nad tobą spokojnych zwierzchników i urzędników sprawiedliwych."
  tags: []
"Iz60,18":
  text: "Nie będzie więcej słychać o przemocy w twojej ziemi ani o spustoszeniu i zniszczeniu w twoich granicach; ale nazwiesz swoje mury Zbawieniem, a twoje bramy – Chwałą."
  tags: []
"Iz60,19":
  text: "Słońce nie będzie już twoją światłością za dnia ani księżyc już nie zaświeci ci swoim blaskiem; ale PAN będzie twoją wieczną światłością, a twój Bóg – twoją chwałą."
  tags: []
"Iz60,20":
  text: "Nie zajdzie już więcej twoje słońce, a twój księżyc nie ukryje się, bo PAN będzie twoją wieczną światłością i skończą się dni twojej żałoby."
  tags: []
"Iz60,21":
  text: "Cały twój lud będzie sprawiedliwy. Odziedziczy ziemię na wieki, będzie latoroślą mego szczepu, dziełem moich rąk, abym był uwielbiony."
  tags: []
"Iz60,22":
  text: "Najmniejszy rozmnoży się tysiąckrotnie, a malutki – w naród potężny. Ja, PAN, dokonam tego rychło, w swoim czasie."
  tags: []
