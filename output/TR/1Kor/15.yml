"1Kor15,1":
  text: "Γνωρίζω δὲ ὑμῖν, ἀδελφοί, τὸ εὐαγγέλιον ὃ εὐηγγελισάμην ὑμῖν, ὃ καὶ παρελάβετε, ἐν ᾧ καὶ ἑστήκατε,"
  tags: []
"1Kor15,2":
  text: "δι᾽ οὗ καὶ σώζεσθε· τίνι λόγῳ εὐηγγελισάμην ὑμῖν, εἰ κατέχετε, ἐκτὸς εἰ μὴ εἰκῆ ἐπιστεύσατε."
  tags: []
"1Kor15,3":
  text: "παρέδωκα γὰρ ὑμῖν ἐν πρώτοις, ὃ καὶ παρέλαβον, ὅτι Χριστὸς ἀπέθανεν ὑπὲρ τῶν ἁμαρτιῶν ἡμῶν κατὰ τὰς γραφάς·"
  tags: []
"1Kor15,4":
  text: "καὶ ὅτι ἐτάφη· καὶ ὅτι ἐγήγερται τῇ τρίτῃ ἡμέρᾳ κατὰ τὰς γραφάς·"
  tags: []
"1Kor15,5":
  text: "καὶ ὅτι ὤφθη Κηφᾷ, εἶτα τοῖς δώδεκα·"
  tags: []
"1Kor15,6":
  text: "ἔπειτα ὤφθη ἐπάνω πεντακοσίοις ἀδελφοῖς ἐφάπαξ, ἐξ ὧν οἱ πλείους μένουσιν ἕως ἄρτι, τινὲς δὲ καὶ ἐκοιμήθησαν·"
  tags: []
"1Kor15,7":
  text: "ἔπειτα ὤφθη Ἰακώβῳ, εἶτα τοῖς ἀποστόλοις πᾶσιν·"
  tags: []
"1Kor15,8":
  text: "ἔσχατον δὲ πάντων, ὡσπερεὶ τῷ ἐκτρώματι, ὤφθη κἀμοί."
  tags: []
"1Kor15,9":
  text: "ἐγὼ γάρ εἰμι ὁ ἐλάχιστος τῶν ἀποστόλων, ὃς οὐκ εἰμὶ ἱκανὸς καλεῖσθαι ἀπόστολος, διότι ἐδίωξα τὴν ἐκκλησίαν τοῦ Θεοῦ."
  tags: []
"1Kor15,10":
  text: "χάριτι δὲ Θεοῦ εἰμὶ ὅ εἰμι, καὶ ἡ χάρις αὐτοῦ ἡ εἰς ἐμὲ οὐ κενὴ ἐγενήθη, ἀλλὰ περισσότερον αὐτῶν πάντων ἐκοπίασα· οὐκ ἐγὼ δέ, ἀλλ᾽ ἡ χάρις τοῦ Θεοῦ ἡ σὺν ἐμοί."
  tags: []
"1Kor15,11":
  text: "εἴτε οὖν ἐγώ, εἴτε ἐκεῖνοι, οὕτω κηρύσσομεν, καὶ οὕτως ἐπιστεύσατε."
  tags: []
"1Kor15,12":
  text: "Εἰ δὲ Χριστὸς κηρύσσεται ὅτι ἐκ νεκρῶν ἐγήγερται, πῶς λέγουσί τινες ἐν ὑμῖν ὅτι ἀνάστασις νεκρῶν οὐκ ἔστιν;"
  tags: []
"1Kor15,13":
  text: "εἰ δὲ ἀνάστασις νεκρῶν οὐκ ἔστιν, οὐδὲ Χριστὸς ἐγήγερται·"
  tags: []
"1Kor15,14":
  text: "εἰ δὲ Χριστὸς οὐκ ἐγήγερται, κενὸν ἄρα τὸ κήρυγμα ἡμῶν, κενὴ δὲ καὶ ἡ πίστις ὑμῶν."
  tags: []
"1Kor15,15":
  text: "εὑρισκόμεθα δὲ καὶ ψευδομάρτυρες τοῦ Θεοῦ, ὅτι ἐμαρτυρήσαμεν κατὰ τοῦ Θεοῦ ὅτι ἤγειρε τὸν Χριστόν, ὃν οὐκ ἤγειρεν, εἴπερ ἄρα νεκροὶ οὐκ ἐγείρονται."
  tags: []
"1Kor15,16":
  text: "εἰ γὰρ νεκροὶ οὐκ ἐγείρονται, οὐδὲ Χριστὸς ἐγήγερται·"
  tags: []
"1Kor15,17":
  text: "εἰ δὲ Χριστὸς οὐκ ἐγήγερται, ματαία ἡ πίστις ὑμῶν· ἔτι ἐστὲ ἐν ταῖς ἁμαρτίαις ὑμῶν."
  tags: []
"1Kor15,18":
  text: "ἄρα καὶ οἱ κοιμηθέντες ἐν Χριστῷ ἀπώλοντο."
  tags: []
"1Kor15,19":
  text: "εἰ ἐν τῇ ζωῇ ταύτῃ ἠλπικότες ἐσμὲν ἐν Χριστῷ μόνον, ἐλεεινότεροι πάντων ἀνθρώπων ἐσμέν."
  tags: []
"1Kor15,20":
  text: "Νυνὶ δὲ Χριστὸς ἐγήγερται ἐκ νεκρῶν, ἀπαρχὴ τῶν κεκοιμημένων ἐγένετο."
  tags: []
"1Kor15,21":
  text: "ἐπειδὴ γὰρ δι᾽ ἀνθρώπου ὁ θάνατος, καὶ δι᾽ ἀνθρώπου ἀνάστασις νεκρῶν."
  tags: []
"1Kor15,22":
  text: "ὥσπερ γὰρ ἐν τῷ Ἀδὰμ πάντες ἀποθνήσκουσιν, οὕτω καὶ ἐν τῷ Χριστῷ πάντες ζωοποιηθήσονται."
  tags: []
"1Kor15,23":
  text: "ἕκαστος δὲ ἐν τῷ ἰδίῳ τάγματι· ἀπαρχὴ Χριστός, ἔπειτα οἱ Χριστοῦ ἐν τῇ παρουσίᾳ αὐτοῦ."
  tags: []
"1Kor15,24":
  text: "εἶτα τὸ τέλος, ὅταν παραδῷ τὴν βασιλείαν τῷ Θεῷ καὶ πατρί, ὅταν καταργήσῃ πᾶσαν ἀρχὴν καὶ πᾶσαν ἐξουσίαν καὶ δύναμιν."
  tags: []
"1Kor15,25":
  text: "δεῖ γὰρ αὐτὸν βασιλεύειν, ἄχρις οὗ ἂν θῇ πάντας τοὺς ἐχθροὺς ὑπὸ τοὺς πόδας αὐτοῦ."
  tags: []
"1Kor15,26":
  text: "ἔσχατος ἐχθρὸς καταργεῖται ὁ θάνατος."
  tags: []
"1Kor15,27":
  text: "Πάντα γὰρ ὑπέταξεν ὑπὸ τοὺς πόδας αὐτοῦ. ὅταν δὲ εἴπῃ ὅτι Πάντα ὑποτέτακται, δῆλον ὅτι ἐκτὸς τοῦ ὑποτάξαντος αὐτῷ τὰ πάντα."
  tags: []
"1Kor15,28":
  text: "ὅταν δὲ ὑποταγῇ αὐτῷ τὰ πάντα, τότε καὶ αὐτὸς ὁ υἱὸς ὑποταγήσεται τῷ ὑποτάξαντι αὐτῷ τὰ πάντα, ἵνα ᾖ ὁ Θεὸς τὰ πάντα ἐν πᾶσιν."
  tags: []
"1Kor15,29":
  text: "Ἐπεὶ τί ποιήσουσιν οἱ βαπτιζόμενοι ὑπὲρ τῶν νεκρῶν; εἰ ὅλως νεκροὶ οὐκ ἐγείρονται, τί καὶ βαπτίζονται ὑπὲρ τῶν νεκρῶν;"
  tags: []
"1Kor15,30":
  text: "τί καὶ ἡμεῖς κινδυνεύομεν πᾶσαν ὥραν;"
  tags: []
"1Kor15,31":
  text: "καθ᾽ ἡμέραν ἀποθνήσκω, νὴ τὴν ὑμετέραν καύχησιν, ἣν ἔχω ἐν Χριστῷ Ἰησοῦ τῷ Κυρίῳ ἡμῶν."
  tags: []
"1Kor15,32":
  text: "εἰ κατὰ ἄνθρωπον ἐθηριομάχησα ἐν Ἐφέσῳ, τί μοι τὸ ὄφελος, εἰ νεκροὶ οὐκ ἐγείρονται; φάγωμεν καὶ πίωμεν, αὔριον γὰρ ἀποθνήσκομεν."
  tags: []
"1Kor15,33":
  text: "μὴ πλανᾶσθε· Φθείρουσιν ἤθη χρήσθ᾽ ὁμιλίαι κακαί."
  tags: []
"1Kor15,34":
  text: "ἐκνήψατε δικαίως, καὶ μὴ ἁμαρτάνετε· ἀγνωσίαν γὰρ Θεοῦ τινὲς ἔχουσι· πρὸς ἐντροπὴν ὑμῖν λέγω."
  tags: []
"1Kor15,35":
  text: "Ἀλλ᾽ ἐρεῖ τις, Πῶς ἐγείρονται οἱ νεκροί; ποίῳ δὲ σώματι ἔρχονται;"
  tags: []
"1Kor15,36":
  text: "ἄφρον, σὺ ὃ σπείρεις, οὐ ζωοποιεῖται, ἐὰν μὴ ἀποθάνῃ·"
  tags: []
"1Kor15,37":
  text: "καὶ ὃ σπείρεις, οὐ τὸ σῶμα τὸ γενησόμενον σπείρεις, ἀλλὰ γυμνὸν κόκκον, εἰ τύχοι, σίτου ἤ τινος τῶν λοιπῶν·"
  tags: []
"1Kor15,38":
  text: "ὁ δὲ Θεὸς αὐτῷ δίδωσι σῶμα καθὼς ἠθέλησε, καὶ ἑκάστῳ τῶν σπερμάτων τὸ ἴδιον σῶμα."
  tags: []
"1Kor15,39":
  text: "οὐ πᾶσα σὰρξ ἡ αὐτὴ σάρξ· ἀλλὰ ἄλλη μὲν σὰρξ ἀνθρώπων, ἄλλη δὲ σὰρξ κτηνῶν, ἄλλη δὲ ἰχθύων, ἄλλη δὲ πτηνῶν."
  tags: []
"1Kor15,40":
  text: "καὶ σώματα ἐπουράνια, καὶ σώματα ἐπίγεια· ἀλλ᾽ ἑτέρα μὲν ἡ τῶν ἐπουρανίων δόξα, ἑτέρα δὲ ἡ τῶν ἐπιγείων."
  tags: []
"1Kor15,41":
  text: "ἄλλη δόξα ἡλίου, καὶ ἄλλη δόξα σελήνης, καὶ ἄλλη δόξα ἀστέρων· ἀστὴρ γὰρ ἀστέρος διαφέρει ἐν δόξῃ."
  tags: []
"1Kor15,42":
  text: "οὕτω καὶ ἡ ἀνάστασις τῶν νεκρῶν. σπείρεται ἐν φθορᾷ, ἐγείρεται ἐν ἀφθαρσίᾳ·"
  tags: []
"1Kor15,43":
  text: "σπείρεται ἐν ἀτιμίᾳ, ἐγείρεται ἐν δόξῃ· σπείρεται ἐν ἀσθενείᾳ, ἐγείρεται ἐν δυνάμει·"
  tags: []
"1Kor15,44":
  text: "σπείρεται σῶμα ψυχικόν, ἐγείρεται σῶμα πνευματικόν. ἔστι σῶμα ψυχικόν, καὶ ἔστι σῶμα πνευματικόν."
  tags: []
"1Kor15,45":
  text: "οὕτω καὶ γέγραπται, Ἐγένετο ὁ πρῶτος ἄνθρωπος Ἀδὰμ εἰς ψυχὴν ζῶσαν. ὁ ἔσχατος Ἀδὰμ εἰς πνεῦμα ζωοποιοῦν."
  tags: []
"1Kor15,46":
  text: "ἀλλ᾽ οὐ πρῶτον τὸ πνευματικόν, ἀλλὰ τὸ ψυχικόν, ἔπειτα τὸ πνευματικόν."
  tags: []
"1Kor15,47":
  text: "ὁ πρῶτος ἄνθρωπος ἐκ γῆς, χοϊκός· ὁ δεύτερος ἄνθρωπος, ὁ Κύριος ἐξ οὐρανοῦ."
  tags: []
"1Kor15,48":
  text: "οἷος ὁ χοϊκός, τοιοῦτοι καὶ οἱ χοϊκοί· καὶ οἷος ὁ ἐπουράνιος, τοιοῦτοι καὶ οἱ ἐπουράνιοι·"
  tags: []
"1Kor15,49":
  text: "καὶ καθὼς ἐφορέσαμεν τὴν εἰκόνα τοῦ χοϊκοῦ, φορέσομεν καὶ τὴν εἰκόνα τοῦ ἐπουρανίου."
  tags: []
"1Kor15,50":
  text: "Τοῦτο δέ φημι, ἀδελφοί, ὅτι σὰρξ καὶ αἷμα βασιλείαν Θεοῦ κληρονομῆσαι οὐ δύνανται, οὐδὲ ἡ φθορὰ τὴν ἀφθαρσίαν κληρονομεῖ."
  tags: []
"1Kor15,51":
  text: "ἰδού, μυστήριον ὑμῖν λέγω· Πάντες μὲν οὐ κοιμηθησόμεθα, πάντες δὲ ἀλλαγησόμεθα,"
  tags: []
"1Kor15,52":
  text: "ἐν ἀτόμῳ, ἐν ῥιπῇ ὀφθαλμοῦ, ἐν τῇ ἐσχάτῃ σάλπιγγι· σαλπίσει γάρ, καὶ οἱ νεκροὶ ἐγερθήσονται ἄφθαρτοι, καὶ ἡμεῖς ἀλλαγησόμεθα."
  tags: []
"1Kor15,53":
  text: "δεῖ γὰρ τὸ φθαρτὸν τοῦτο ἐνδύσασθαι ἀφθαρσίαν, καὶ τὸ θνητὸν τοῦτο ἐνδύσασθαι ἀθανασίαν."
  tags: []
"1Kor15,54":
  text: "ὅταν δὲ τὸ φθαρτὸν τοῦτο ἐνδύσηται ἀφθαρσίαν, καὶ τὸ θνητὸν τοῦτο ἐνδύσηται ἀθανασίαν, τότε γενήσεται ὁ λόγος ὁ γεγραμμένος, Κατεπόθη ὁ θάνατος εἰς νῖκος."
  tags: []
"1Kor15,55":
  text: "Ποῦ σου, θάνατε, τὸ κέντρον; ποῦ σου, ᾅδη, τὸ νῖκος;"
  tags: []
"1Kor15,56":
  text: "τὸ δὲ κέντρον τοῦ θανάτου ἡ ἁμαρτία· ἡ δὲ δύναμις τῆς ἁμαρτίας ὁ νόμος·"
  tags: []
"1Kor15,57":
  text: "τῷ δὲ Θεῷ χάρις τῷ διδόντι ἡμῖν τὸ νῖκος διὰ τοῦ Κυρίου ἡμῶν Ἰησοῦ Χριστοῦ."
  tags: []
"1Kor15,58":
  text: "ὥστε, ἀδελφοί μου ἀγαπητοί, ἑδραῖοι γίνεσθε, ἀμετακίνητοι, περισσεύοντες ἐν τῷ ἔργῳ τοῦ Κυρίου πάντοτε, εἰδότες ὅτι ὁ κόπος ὑμῶν οὐκ ἔστι κενὸς ἐν Κυρίῳ."
  tags: []
