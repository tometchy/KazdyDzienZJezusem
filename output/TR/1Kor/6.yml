"1Kor6,1":
  text: "Τολμᾷ τις ὑμῶν, πρᾶγμα ἔχων πρὸς τὸν ἕτερον, κρίνεσθαι ἐπὶ τῶν ἀδίκων, καὶ οὐχὶ ἐπὶ τῶν ἁγίων;"
  tags: []
"1Kor6,2":
  text: "οὐκ οἴδατε ὅτι οἱ ἅγιοι τὸν κόσμον κρινοῦσι; καὶ εἰ ἐν ὑμῖν κρίνεται ὁ κόσμος, ἀνάξιοί ἐστε κριτηρίων ἐλαχίστων;"
  tags: []
"1Kor6,3":
  text: "οὐκ οἴδατε ὅτι ἀγγέλους κρινοῦμεν; μήτι γε βιωτικά;"
  tags: []
"1Kor6,4":
  text: "βιωτικὰ μὲν οὖν κριτήρια ἐὰν ἔχητε, τοὺς ἐξουθενημένους ἐν τῇ ἐκκλησίᾳ, τούτους καθίζετε."
  tags: []
"1Kor6,5":
  text: "πρὸς ἐντροπὴν ὑμῖν λέγω. οὕτως οὐκ ἔστιν ἐν ὑμῖν σοφὸς οὐδὲ εἷς, ὃς δυνήσεται διακρῖναι ἀνὰ μέσον τοῦ ἀδελφοῦ αὐτοῦ,"
  tags: []
"1Kor6,6":
  text: "ἀλλὰ ἀδελφὸς μετὰ ἀδελφοῦ κρίνεται, καὶ τοῦτο ἐπὶ ἀπίστων;"
  tags: []
"1Kor6,7":
  text: "ἤδη μὲν οὖν ὅλως ἥττημα ἐν ὑμῖν ἐστιν, ὅτι κρίματα ἔχετε μεθ᾽ ἑαυτῶν. διατί οὐχὶ μᾶλλον ἀδικεῖσθε; διατί οὐχὶ μᾶλλον ἀποστερεῖσθε;"
  tags: []
"1Kor6,8":
  text: "ἀλλὰ ὑμεῖς ἀδικεῖτε καὶ ἀποστερεῖτε, καὶ ταῦτα ἀδελφούς."
  tags: []
"1Kor6,9":
  text: "ἢ οὐκ οἴδατε ὅτι ἄδικοι βασιλείαν Θεοῦ οὐ κληρονομήσουσι; μὴ πλανᾶσθε· οὔτε πόρνοι, οὔτε εἰδωλολάτραι, οὔτε μοιχοί, οὔτε μαλακοί, οὔτε ἀρσενοκοῖται,"
  tags: []
"1Kor6,10":
  text: "οὔτε κλέπται, οὔτε πλεονέκται, οὔτε μέθυσοι, οὐ λοίδοροι, οὐχ ἅρπαγες, βασιλείαν Θεοῦ οὐ κληρονομήσουσι."
  tags: []
"1Kor6,11":
  text: "καὶ ταῦτά τινες ἦτε· ἀλλὰ ἀπελούσασθε, ἀλλὰ ἡγιάσθητε, ἀλλ᾽ ἐδικαιώθητε ἐν τῷ ὀνόματι τοῦ Κυρίου Ἰησοῦ, καὶ ἐν τῷ Πνεύματι τοῦ Θεοῦ ἡμῶν."
  tags: []
"1Kor6,12":
  text: "Πάντα μοι ἔξεστιν, ἀλλ᾽ οὐ πάντα συμφέρει· πάντα μοι ἔξεστιν, ἀλλ᾽ οὐκ ἐγὼ ἐξουσιασθήσομαι ὑπό τινος."
  tags: []
"1Kor6,13":
  text: "τὰ βρώματα τῇ κοιλίᾳ, καὶ ἡ κοιλία τοῖς βρώμασιν· ὁ δὲ Θεὸς καὶ ταύτην καὶ ταῦτα καταργήσει. τὸ δὲ σῶμα οὐ τῇ πορνείᾳ, ἀλλὰ τῷ Κυρίῳ, καὶ ὁ Κύριος τῷ σώματι·"
  tags: []
"1Kor6,14":
  text: "ὁ δὲ Θεὸς καὶ τὸν Κύριον ἤγειρε, καὶ ἡμᾶς ἐξεγερεῖ διὰ τῆς δυνάμεως αὐτοῦ."
  tags: []
"1Kor6,15":
  text: "οὐκ οἴδατε ὅτι τὰ σώματα ὑμῶν μέλη Χριστοῦ ἐστιν; ἄρας οὖν τὰ μέλη τοῦ Χριστοῦ ποιήσω πόρνης μέλη; μὴ γένοιτο."
  tags: []
"1Kor6,16":
  text: "ἢ οὐκ οἴδατε ὅτι ὁ κολλώμενος τῇ πόρνῃ ἓν σῶμά ἐστιν; Ἔσονται γάρ, φησίν, οἱ δύο εἰς σάρκα μίαν."
  tags: []
"1Kor6,17":
  text: "ὁ δὲ κολλώμενος τῷ Κυρίῳ ἓν πνεῦμά ἐστι."
  tags: []
"1Kor6,18":
  text: "φεύγετε τὴν πορνείαν. πᾶν ἁμάρτημα ὃ ἐὰν ποιήσῃ ἄνθρωπος ἐκτὸς τοῦ σώματός ἐστιν· ὁ δὲ πορνεύων εἰς τὸ ἴδιον σῶμα ἁμαρτάνει."
  tags: []
"1Kor6,19":
  text: "ἢ οὐκ οἴδατε ὅτι τὸ σῶμα ὑμῶν ναὸς τοῦ ἐν ὑμῖν Ἁγίου Πνεύματός ἐστιν, οὗ ἔχετε ἀπὸ Θεοῦ; καὶ οὐκ ἐστὲ ἑαυτῶν,"
  tags: []
"1Kor6,20":
  text: "ἠγοράσθητε γὰρ τιμῆς· δοξάσατε δὴ τὸν Θεὸν ἐν τῷ σώματι ὑμῶν, καὶ ἐν τῷ πνεύματι ὑμῶν, ἅτινά ἐστι τοῦ Θεοῦ."
  tags: []
