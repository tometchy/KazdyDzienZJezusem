"Dz19,1": "Ἐγένετο δέ, ἐν τῷ τὸν Ἀπολλὼ εἶναι ἐν Κορίνθῳ, Παῦλον διελθόντα τὰ ἀνωτερικὰ μέρη ἐλθεῖν εἰς Ἔφεσον· καὶ εὑρών τινας μαθητὰς"
"Dz19,2": "εἶπε πρὸς αὐτούς, Εἰ Πνεῦμα Ἅγιον ἐλάβετε πιστεύσαντες; οἱ δὲ εἶπον πρὸς αὐτόν, Ἀλλ᾽ οὐδὲ εἰ Πνεῦμα Ἅγιόν ἐστιν, ἠκούσαμεν."
"Dz19,3": "εἶπέ τε πρὸς αὐτούς, Εἰς τί οὖν ἐβαπτίσθητε; οἱ δὲ εἶπον, Εἰς τὸ Ἰωάννου βάπτισμα."
"Dz19,4": "εἶπε δὲ Παῦλος, Ἰωάννης μὲν ἐβάπτισε βάπτισμα μετανοίας, τῷ λαῷ λέγων εἰς τὸν ἐρχόμενον μετ᾽ αὐτὸν ἵνα πιστεύσωσι, τοῦτ᾽ ἔστιν, εἰς τὸν Χριστὸν Ἰησοῦν."
"Dz19,5": "ἀκούσαντες δὲ ἐβαπτίσθησαν εἰς τὸ ὄνομα τοῦ Κυρίου Ἰησοῦ."
"Dz19,6": "καὶ ἐπιθέντος αὐτοῖς τοῦ Παύλου τὰς χεῖρας, ἦλθε τὸ Πνεῦμα τὸ Ἅγιον ἐπ᾽ αὐτούς, ἐλάλουν τε γλώσσαις καὶ προεφήτευον."
"Dz19,7": "ἦσαν δὲ οἱ πάντες ἄνδρες ὡσεὶ δεκαδύο."
"Dz19,8": "Εἰσελθὼν δὲ εἰς τὴν συναγωγὴν ἐπαρρησιάζετο, ἐπὶ μῆνας τρεῖς διαλεγόμενος καὶ πείθων τὰ περὶ τῆς βασιλείας τοῦ Θεοῦ."
"Dz19,9": "ὡς δέ τινες ἐσκληρύνοντο καὶ ἠπείθουν, κακολογοῦντες τὴν ὁδὸν ἐνώπιον τοῦ πλήθους, ἀποστὰς ἀπ᾽ αὐτῶν ἀφώρισε τοὺς μαθητάς, καθ᾽ ἡμέραν διαλεγόμενος ἐν τῇ σχολῇ Τυράννου τινός."
"Dz19,10": "τοῦτο δὲ ἐγένετο ἐπὶ ἔτη δύο, ὥστε πάντας τοὺς κατοικοῦντας τὴν Ἀσίαν ἀκοῦσαι τὸν λόγον τοῦ Κυρίου Ἰησοῦ, Ἰουδαίους τε καὶ Ἕλληνας."
"Dz19,11": "δυνάμεις τε οὐ τὰς τυχούσας ἐποίει ὁ Θεὸς διὰ τῶν χειρῶν Παύλου,"
"Dz19,12": "ὥστε καὶ ἐπὶ τοὺς ἀσθενοῦντας ἐπιφέρεσθαι ἀπὸ τοῦ χρωτὸς αὐτοῦ σουδάρια ἢ σιμικίνθια, καὶ ἀπαλλάσσεσθαι ἀπ᾽ αὐτῶν τὰς νόσους, τά τε πνεύματα τὰ πονηρὰ ἐξέρχεσθαι ἀπ᾽ αὐτῶν."
"Dz19,13": "ἐπεχείρησαν δέ τινες ἀπὸ τῶν περιερχομένων Ἰουδαίων ἐξορκιστῶν ὀνομάζειν ἐπὶ τοὺς ἔχοντας τὰ πνεύματα τὰ πονηρὰ τὸ ὄνομα τοῦ Κυρίου Ἰησοῦ, λέγοντες, Ὁρκίζομεν ὑμᾶς τὸν Ἰησοῦν ὃν ὁ Παῦλος κηρύσσει."
"Dz19,14": "ἦσαν δέ τινες υἱοὶ Σκευᾶ Ἰουδαίου ἀρχιερέως ἑπτὰ οἱ τοῦτο ποιοῦντες."
"Dz19,15": "ἀποκριθὲν δὲ τὸ πνεῦμα τὸ πονηρὸν εἶπε, Τὸν Ἰησοῦν γινώσκω, καὶ τὸν Παῦλον ἐπίσταμαι· ὑμεῖς δὲ τίνες ἐστέ;"
"Dz19,16": "καὶ ἐφαλλόμενος ἐπ᾽ αὐτοὺς ὁ ἄνθρωπος ἐν ᾧ ἦν τὸ πνεῦμα τὸ πονηρόν, καὶ κατακυριεύσας αὐτῶν, ἴσχυσε κατ᾽ αὐτῶν, ὥστε γυμνοὺς καὶ τετραυματισμένους ἐκφυγεῖν ἐκ τοῦ οἴκου ἐκείνου."
"Dz19,17": "τοῦτο δὲ ἐγένετο γνωστὸν πᾶσιν Ἰουδαίοις τε καὶ Ἕλλησι τοῖς κατοικοῦσι τὴν Ἔφεσον, καὶ ἐπέπεσε φόβος ἐπὶ πάντας αὐτούς, καὶ ἐμεγαλύνετο τὸ ὄνομα τοῦ Κυρίου Ἰησοῦ."
"Dz19,18": "πολλοί τε τῶν πεπιστευκότων ἤρχοντο, ἐξομολογούμενοι, καὶ ἀναγγέλλοντες τὰς πράξεις αὐτῶν."
"Dz19,19": "ἱκανοὶ δὲ τῶν τὰ περίεργα πραξάντων συνενέγκαντες τὰς βίβλους κατέκαιον ἐνώπιον πάντων· καὶ συνεψήφισαν τὰς τιμὰς αὐτῶν, καὶ εὗρον ἀργυρίου μυριάδας πέντε."
"Dz19,20": "οὕτω κατὰ κράτος ὁ λόγος τοῦ Κυρίου ηὔξανε καὶ ἴσχυεν."
"Dz19,21": "Ὡς δὲ ἐπληρώθη ταῦτα, ἔθετο ὁ Παῦλος ἐν τῷ πνεύματι, διελθὼν τὴν Μακεδονίαν καὶ Ἀχαΐαν, πορεύεσθαι εἰς Ἱερουσαλήμ, εἰπὼν ὅτι Μετὰ τὸ γενέσθαι με ἐκεῖ, δεῖ με καὶ Ῥώμην ἰδεῖν."
"Dz19,22": "ἀποστείλας δὲ εἰς τὴν Μακεδονίαν δύο τῶν διακονούντων αὐτῷ, Τιμόθεον καὶ Ἔραστον, αὐτὸς ἐπέσχε χρόνον εἰς τὴν Ἀσίαν."
"Dz19,23": "Ἐγένετο δὲ κατὰ τὸν καιρὸν ἐκεῖνον τάραχος οὐκ ὀλίγος περὶ τῆς ὁδοῦ."
"Dz19,24": "Δημήτριος γάρ τις ὀνόματι, ἀργυροκόπος, ποιῶν ναοὺς ἀργυροῦς Ἀρτέμιδος, παρείχετο τοῖς τεχνίταις ἐργασίαν οὐκ ὀλίγην·"
"Dz19,25": "οὓς συναθροίσας, καὶ τοὺς περὶ τὰ τοιαῦτα ἐργάτας, εἶπεν, Ἄνδρες, ἐπίστασθε ὅτι ἐκ ταύτης τῆς ἐργασίας ἡ εὐπορία ἡμῶν ἐστι."
"Dz19,26": "καὶ θεωρεῖτε καὶ ἀκούετε ὅτι οὐ μόνον Ἐφέσου, ἀλλὰ σχεδὸν πάσης τῆς Ἀσίας, ὁ Παῦλος οὗτος πείσας μετέστησεν ἱκανὸν ὄχλον, λέγων ὅτι οὐκ εἰσὶ θεοὶ οἱ διὰ χειρῶν γινόμενοι."
"Dz19,27": "οὐ μόνον δὲ τοῦτο κινδυνεύει ἡμῖν τὸ μέρος εἰς ἀπελεγμὸν ἐλθεῖν, ἀλλὰ καὶ τὸ τῆς μεγάλης θεᾶς Ἀρτέμιδος ἱερὸν εἰς οὐδὲν λογισθῆναι, μέλλειν τε καὶ καθαιρεῖσθαι τὴν μεγαλειότητα αὐτῆς, ἣν ὅλη ἡ Ἀσία καὶ ἡ οἰκουμένη σέβεται."
"Dz19,28": "ἀκούσαντες δὲ καὶ γενόμενοι πλήρεις θυμοῦ, ἔκραζον λέγοντες, Μεγάλη ἡ Ἄρτεμις Ἐφεσίων."
"Dz19,29": "καὶ ἐπλήσθη ἡ πόλις ὅλη συγχύσεως· ὥρμησάν τε ὁμοθυμαδὸν εἰς τὸ θέατρον, συναρπάσαντες Γάϊον καὶ Ἀρίσταρχον Μακεδόνας, συνεκδήμους τοῦ Παύλου."
"Dz19,30": "τοῦ δὲ Παύλου βουλομένου εἰσελθεῖν εἰς τὸν δῆμον, οὐκ εἴων αὐτὸν οἱ μαθηταί."
"Dz19,31": "τινὲς δὲ καὶ τῶν Ἀσιαρχῶν, ὄντες αὐτῷ φίλοι, πέμψαντες πρὸς αὐτόν, παρεκάλουν μὴ δοῦναι ἑαυτὸν εἰς τὸ θέατρον."
"Dz19,32": "ἄλλοι μὲν οὖν ἄλλο τι ἔκραζον· ἦν γὰρ ἡ ἐκκλησία συγκεχυμένη, καὶ οἱ πλείους οὐκ ᾔδεισαν τίνος ἕνεκεν συνεληλύθεισαν."
"Dz19,33": "ἐκ δὲ τοῦ ὄχλου προεβίβασαν Ἀλέξανδρον, προβαλλόντων αὐτὸν τῶν Ἰουδαίων. ὁ δὲ Ἀλέξανδρος, κατασείσας τὴν χεῖρα, ἤθελεν ἀπολογεῖσθαι τῷ δήμῳ."
"Dz19,34": "ἐπιγνόντων δὲ ὅτι Ἰουδαῖός ἐστι, φωνὴ ἐγένετο μία ἐκ πάντων ὡς ἐπὶ ὥρας δύο κραζόντων, Μεγάλη ἡ Ἄρτεμις Ἐφεσίων."
"Dz19,35": "καταστείλας δὲ ὁ γραμματεὺς τὸν ὄχλον φησίν, Ἄνδρες Ἐφέσιοι, τίς γάρ ἐστιν ἄνθρωπος ὃς οὐ γινώσκει τὴν Ἐφεσίων πόλιν νεωκόρον οὖσαν τῆς μεγάλης θεᾶς Ἀρτέμιδος καὶ τοῦ Διοπετοῦς;"
"Dz19,36": "ἀναντιρρήτων οὖν ὄντων τούτων, δέον ἐστὶν ὑμᾶς κατεσταλμένους ὑπάρχειν, καὶ μηδὲν προπετὲς πράττειν."
"Dz19,37": "ἠγάγετε γὰρ τοὺς ἄνδρας τούτους, οὔτε ἱεροσύλους οὔτε βλασφημοῦντας τὴν θεὰν ὑμῶν."
"Dz19,38": "εἰ μὲν οὖν Δημήτριος καὶ οἱ σὺν αὐτῷ τεχνῖται πρός τινα λόγον ἔχουσιν, ἀγοραῖοι ἄγονται, καὶ ἀνθύπατοί εἰσιν· ἐγκαλείτωσαν ἀλλήλοις."
"Dz19,39": "εἰ δέ τι περὶ ἑτέρων ἐπιζητεῖτε, ἐν τῇ ἐννόμῳ ἐκκλησίᾳ ἐπιλυθήσεται."
"Dz19,40": "καὶ γὰρ κινδυνεύομεν ἐγκαλεῖσθαι στάσεως περὶ τῆς σήμερον, μηδενὸς αἰτίου ὑπάρχοντος περὶ οὗ δυνησόμεθα ἀποδοῦναι λόγον τῆς συστροφῆς ταύτης."
"Dz19,41": "καὶ ταῦτα εἰπών, ἀπέλυσε τὴν ἐκκλησίαν."
