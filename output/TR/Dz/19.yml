"Dz19,1":
  text: "Ἐγένετο δέ, ἐν τῷ τὸν Ἀπολλὼ εἶναι ἐν Κορίνθῳ, Παῦλον διελθόντα τὰ ἀνωτερικὰ μέρη ἐλθεῖν εἰς Ἔφεσον· καὶ εὑρών τινας μαθητὰς"
  tags: []
"Dz19,2":
  text: "εἶπε πρὸς αὐτούς, Εἰ Πνεῦμα Ἅγιον ἐλάβετε πιστεύσαντες; οἱ δὲ εἶπον πρὸς αὐτόν, Ἀλλ᾽ οὐδὲ εἰ Πνεῦμα Ἅγιόν ἐστιν, ἠκούσαμεν."
  tags: []
"Dz19,3":
  text: "εἶπέ τε πρὸς αὐτούς, Εἰς τί οὖν ἐβαπτίσθητε; οἱ δὲ εἶπον, Εἰς τὸ Ἰωάννου βάπτισμα."
  tags: []
"Dz19,4":
  text: "εἶπε δὲ Παῦλος, Ἰωάννης μὲν ἐβάπτισε βάπτισμα μετανοίας, τῷ λαῷ λέγων εἰς τὸν ἐρχόμενον μετ᾽ αὐτὸν ἵνα πιστεύσωσι, τοῦτ᾽ ἔστιν, εἰς τὸν Χριστὸν Ἰησοῦν."
  tags: []
"Dz19,5":
  text: "ἀκούσαντες δὲ ἐβαπτίσθησαν εἰς τὸ ὄνομα τοῦ Κυρίου Ἰησοῦ."
  tags: []
"Dz19,6":
  text: "καὶ ἐπιθέντος αὐτοῖς τοῦ Παύλου τὰς χεῖρας, ἦλθε τὸ Πνεῦμα τὸ Ἅγιον ἐπ᾽ αὐτούς, ἐλάλουν τε γλώσσαις καὶ προεφήτευον."
  tags: []
"Dz19,7":
  text: "ἦσαν δὲ οἱ πάντες ἄνδρες ὡσεὶ δεκαδύο."
  tags: []
"Dz19,8":
  text: "Εἰσελθὼν δὲ εἰς τὴν συναγωγὴν ἐπαρρησιάζετο, ἐπὶ μῆνας τρεῖς διαλεγόμενος καὶ πείθων τὰ περὶ τῆς βασιλείας τοῦ Θεοῦ."
  tags: []
"Dz19,9":
  text: "ὡς δέ τινες ἐσκληρύνοντο καὶ ἠπείθουν, κακολογοῦντες τὴν ὁδὸν ἐνώπιον τοῦ πλήθους, ἀποστὰς ἀπ᾽ αὐτῶν ἀφώρισε τοὺς μαθητάς, καθ᾽ ἡμέραν διαλεγόμενος ἐν τῇ σχολῇ Τυράννου τινός."
  tags: []
"Dz19,10":
  text: "τοῦτο δὲ ἐγένετο ἐπὶ ἔτη δύο, ὥστε πάντας τοὺς κατοικοῦντας τὴν Ἀσίαν ἀκοῦσαι τὸν λόγον τοῦ Κυρίου Ἰησοῦ, Ἰουδαίους τε καὶ Ἕλληνας."
  tags: []
"Dz19,11":
  text: "δυνάμεις τε οὐ τὰς τυχούσας ἐποίει ὁ Θεὸς διὰ τῶν χειρῶν Παύλου,"
  tags: []
"Dz19,12":
  text: "ὥστε καὶ ἐπὶ τοὺς ἀσθενοῦντας ἐπιφέρεσθαι ἀπὸ τοῦ χρωτὸς αὐτοῦ σουδάρια ἢ σιμικίνθια, καὶ ἀπαλλάσσεσθαι ἀπ᾽ αὐτῶν τὰς νόσους, τά τε πνεύματα τὰ πονηρὰ ἐξέρχεσθαι ἀπ᾽ αὐτῶν."
  tags: []
"Dz19,13":
  text: "ἐπεχείρησαν δέ τινες ἀπὸ τῶν περιερχομένων Ἰουδαίων ἐξορκιστῶν ὀνομάζειν ἐπὶ τοὺς ἔχοντας τὰ πνεύματα τὰ πονηρὰ τὸ ὄνομα τοῦ Κυρίου Ἰησοῦ, λέγοντες, Ὁρκίζομεν ὑμᾶς τὸν Ἰησοῦν ὃν ὁ Παῦλος κηρύσσει."
  tags: []
"Dz19,14":
  text: "ἦσαν δέ τινες υἱοὶ Σκευᾶ Ἰουδαίου ἀρχιερέως ἑπτὰ οἱ τοῦτο ποιοῦντες."
  tags: []
"Dz19,15":
  text: "ἀποκριθὲν δὲ τὸ πνεῦμα τὸ πονηρὸν εἶπε, Τὸν Ἰησοῦν γινώσκω, καὶ τὸν Παῦλον ἐπίσταμαι· ὑμεῖς δὲ τίνες ἐστέ;"
  tags: []
"Dz19,16":
  text: "καὶ ἐφαλλόμενος ἐπ᾽ αὐτοὺς ὁ ἄνθρωπος ἐν ᾧ ἦν τὸ πνεῦμα τὸ πονηρόν, καὶ κατακυριεύσας αὐτῶν, ἴσχυσε κατ᾽ αὐτῶν, ὥστε γυμνοὺς καὶ τετραυματισμένους ἐκφυγεῖν ἐκ τοῦ οἴκου ἐκείνου."
  tags: []
"Dz19,17":
  text: "τοῦτο δὲ ἐγένετο γνωστὸν πᾶσιν Ἰουδαίοις τε καὶ Ἕλλησι τοῖς κατοικοῦσι τὴν Ἔφεσον, καὶ ἐπέπεσε φόβος ἐπὶ πάντας αὐτούς, καὶ ἐμεγαλύνετο τὸ ὄνομα τοῦ Κυρίου Ἰησοῦ."
  tags: []
"Dz19,18":
  text: "πολλοί τε τῶν πεπιστευκότων ἤρχοντο, ἐξομολογούμενοι, καὶ ἀναγγέλλοντες τὰς πράξεις αὐτῶν."
  tags: []
"Dz19,19":
  text: "ἱκανοὶ δὲ τῶν τὰ περίεργα πραξάντων συνενέγκαντες τὰς βίβλους κατέκαιον ἐνώπιον πάντων· καὶ συνεψήφισαν τὰς τιμὰς αὐτῶν, καὶ εὗρον ἀργυρίου μυριάδας πέντε."
  tags: []
"Dz19,20":
  text: "οὕτω κατὰ κράτος ὁ λόγος τοῦ Κυρίου ηὔξανε καὶ ἴσχυεν."
  tags: []
"Dz19,21":
  text: "Ὡς δὲ ἐπληρώθη ταῦτα, ἔθετο ὁ Παῦλος ἐν τῷ πνεύματι, διελθὼν τὴν Μακεδονίαν καὶ Ἀχαΐαν, πορεύεσθαι εἰς Ἱερουσαλήμ, εἰπὼν ὅτι Μετὰ τὸ γενέσθαι με ἐκεῖ, δεῖ με καὶ Ῥώμην ἰδεῖν."
  tags: []
"Dz19,22":
  text: "ἀποστείλας δὲ εἰς τὴν Μακεδονίαν δύο τῶν διακονούντων αὐτῷ, Τιμόθεον καὶ Ἔραστον, αὐτὸς ἐπέσχε χρόνον εἰς τὴν Ἀσίαν."
  tags: []
"Dz19,23":
  text: "Ἐγένετο δὲ κατὰ τὸν καιρὸν ἐκεῖνον τάραχος οὐκ ὀλίγος περὶ τῆς ὁδοῦ."
  tags: []
"Dz19,24":
  text: "Δημήτριος γάρ τις ὀνόματι, ἀργυροκόπος, ποιῶν ναοὺς ἀργυροῦς Ἀρτέμιδος, παρείχετο τοῖς τεχνίταις ἐργασίαν οὐκ ὀλίγην·"
  tags: []
"Dz19,25":
  text: "οὓς συναθροίσας, καὶ τοὺς περὶ τὰ τοιαῦτα ἐργάτας, εἶπεν, Ἄνδρες, ἐπίστασθε ὅτι ἐκ ταύτης τῆς ἐργασίας ἡ εὐπορία ἡμῶν ἐστι."
  tags: []
"Dz19,26":
  text: "καὶ θεωρεῖτε καὶ ἀκούετε ὅτι οὐ μόνον Ἐφέσου, ἀλλὰ σχεδὸν πάσης τῆς Ἀσίας, ὁ Παῦλος οὗτος πείσας μετέστησεν ἱκανὸν ὄχλον, λέγων ὅτι οὐκ εἰσὶ θεοὶ οἱ διὰ χειρῶν γινόμενοι."
  tags: []
"Dz19,27":
  text: "οὐ μόνον δὲ τοῦτο κινδυνεύει ἡμῖν τὸ μέρος εἰς ἀπελεγμὸν ἐλθεῖν, ἀλλὰ καὶ τὸ τῆς μεγάλης θεᾶς Ἀρτέμιδος ἱερὸν εἰς οὐδὲν λογισθῆναι, μέλλειν τε καὶ καθαιρεῖσθαι τὴν μεγαλειότητα αὐτῆς, ἣν ὅλη ἡ Ἀσία καὶ ἡ οἰκουμένη σέβεται."
  tags: []
"Dz19,28":
  text: "ἀκούσαντες δὲ καὶ γενόμενοι πλήρεις θυμοῦ, ἔκραζον λέγοντες, Μεγάλη ἡ Ἄρτεμις Ἐφεσίων."
  tags: []
"Dz19,29":
  text: "καὶ ἐπλήσθη ἡ πόλις ὅλη συγχύσεως· ὥρμησάν τε ὁμοθυμαδὸν εἰς τὸ θέατρον, συναρπάσαντες Γάϊον καὶ Ἀρίσταρχον Μακεδόνας, συνεκδήμους τοῦ Παύλου."
  tags: []
"Dz19,30":
  text: "τοῦ δὲ Παύλου βουλομένου εἰσελθεῖν εἰς τὸν δῆμον, οὐκ εἴων αὐτὸν οἱ μαθηταί."
  tags: []
"Dz19,31":
  text: "τινὲς δὲ καὶ τῶν Ἀσιαρχῶν, ὄντες αὐτῷ φίλοι, πέμψαντες πρὸς αὐτόν, παρεκάλουν μὴ δοῦναι ἑαυτὸν εἰς τὸ θέατρον."
  tags: []
"Dz19,32":
  text: "ἄλλοι μὲν οὖν ἄλλο τι ἔκραζον· ἦν γὰρ ἡ ἐκκλησία συγκεχυμένη, καὶ οἱ πλείους οὐκ ᾔδεισαν τίνος ἕνεκεν συνεληλύθεισαν."
  tags: []
"Dz19,33":
  text: "ἐκ δὲ τοῦ ὄχλου προεβίβασαν Ἀλέξανδρον, προβαλλόντων αὐτὸν τῶν Ἰουδαίων. ὁ δὲ Ἀλέξανδρος, κατασείσας τὴν χεῖρα, ἤθελεν ἀπολογεῖσθαι τῷ δήμῳ."
  tags: []
"Dz19,34":
  text: "ἐπιγνόντων δὲ ὅτι Ἰουδαῖός ἐστι, φωνὴ ἐγένετο μία ἐκ πάντων ὡς ἐπὶ ὥρας δύο κραζόντων, Μεγάλη ἡ Ἄρτεμις Ἐφεσίων."
  tags: []
"Dz19,35":
  text: "καταστείλας δὲ ὁ γραμματεὺς τὸν ὄχλον φησίν, Ἄνδρες Ἐφέσιοι, τίς γάρ ἐστιν ἄνθρωπος ὃς οὐ γινώσκει τὴν Ἐφεσίων πόλιν νεωκόρον οὖσαν τῆς μεγάλης θεᾶς Ἀρτέμιδος καὶ τοῦ Διοπετοῦς;"
  tags: []
"Dz19,36":
  text: "ἀναντιρρήτων οὖν ὄντων τούτων, δέον ἐστὶν ὑμᾶς κατεσταλμένους ὑπάρχειν, καὶ μηδὲν προπετὲς πράττειν."
  tags: []
"Dz19,37":
  text: "ἠγάγετε γὰρ τοὺς ἄνδρας τούτους, οὔτε ἱεροσύλους οὔτε βλασφημοῦντας τὴν θεὰν ὑμῶν."
  tags: []
"Dz19,38":
  text: "εἰ μὲν οὖν Δημήτριος καὶ οἱ σὺν αὐτῷ τεχνῖται πρός τινα λόγον ἔχουσιν, ἀγοραῖοι ἄγονται, καὶ ἀνθύπατοί εἰσιν· ἐγκαλείτωσαν ἀλλήλοις."
  tags: []
"Dz19,39":
  text: "εἰ δέ τι περὶ ἑτέρων ἐπιζητεῖτε, ἐν τῇ ἐννόμῳ ἐκκλησίᾳ ἐπιλυθήσεται."
  tags: []
"Dz19,40":
  text: "καὶ γὰρ κινδυνεύομεν ἐγκαλεῖσθαι στάσεως περὶ τῆς σήμερον, μηδενὸς αἰτίου ὑπάρχοντος περὶ οὗ δυνησόμεθα ἀποδοῦναι λόγον τῆς συστροφῆς ταύτης."
  tags: []
"Dz19,41":
  text: "καὶ ταῦτα εἰπών, ἀπέλυσε τὴν ἐκκλησίαν."
  tags: []
