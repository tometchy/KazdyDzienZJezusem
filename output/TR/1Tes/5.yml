"1Tes5,1":
  text: "Περὶ δὲ τῶν χρόνων καὶ τῶν καιρῶν, ἀδελφοί, οὐ χρείαν ἔχετε ὑμῖν γράφεσθαι."
  tags: []
"1Tes5,2":
  text: "αὐτοὶ γὰρ ἀκριβῶς οἴδατε ὅτι ἡ ἡμέρα Κυρίου ὡς κλέπτης ἐν νυκτὶ οὕτως ἔρχεται·"
  tags: []
"1Tes5,3":
  text: "ὅταν γὰρ λέγωσιν, Εἰρήνη καὶ ἀσφάλεια, τότε αἰφνίδιος αὐτοῖς ἐφίσταται ὄλεθρος, ὥσπερ ἡ ὠδὶν τῇ ἐν γαστρὶ ἐχούσῃ, καὶ οὐ μὴ ἐκφύγωσιν."
  tags: []
"1Tes5,4":
  text: "ὑμεῖς δέ, ἀδελφοί, οὐκ ἐστὲ ἐν σκότει, ἵνα ἡ ἡμέρα ὑμᾶς ὡς κλέπτης καταλάβῃ·"
  tags: []
"1Tes5,5":
  text: "πάντες ὑμεῖς υἱοὶ φωτός ἐστε καὶ υἱοὶ ἡμέρας· οὐκ ἐσμὲν νυκτὸς οὐδὲ σκότους·"
  tags: []
"1Tes5,6":
  text: "ἄρα οὖν μὴ καθεύδωμεν ὡς καὶ οἱ λοιποί, ἀλλὰ γρηγορῶμεν καὶ νήφωμεν."
  tags: []
"1Tes5,7":
  text: "οἱ γὰρ καθεύδοντες νυκτὸς καθεύδουσι· καὶ οἱ μεθυσκόμενοι νυκτὸς μεθύουσιν."
  tags: []
"1Tes5,8":
  text: "ἡμεῖς δέ, ἡμέρας ὄντες, νήφωμεν, ἐνδυσάμενοι θώρακα πίστεως καὶ ἀγάπης, καὶ περικεφαλαίαν, ἐλπίδα σωτηρίας."
  tags: []
"1Tes5,9":
  text: "ὅτι οὐκ ἔθετο ἡμᾶς ὁ Θεὸς εἰς ὀργήν, ἀλλ᾽ εἰς περιποίησιν σωτηρίας διὰ τοῦ Κυρίου ἡμῶν Ἰησοῦ Χριστοῦ,"
  tags: []
"1Tes5,10":
  text: "τοῦ ἀποθανόντος ὑπὲρ ἡμῶν, ἵνα, εἴτε γρηγορῶμεν εἴτε καθεύδωμεν, ἅμα σὺν αὐτῷ ζήσωμεν."
  tags: []
"1Tes5,11":
  text: "διὸ παρακαλεῖτε ἀλλήλους, καὶ οἰκοδομεῖτε εἷς τὸν ἕνα, καθὼς καὶ ποιεῖτε."
  tags: []
"1Tes5,12":
  text: "Ἐρωτῶμεν δὲ ὑμᾶς, ἀδελφοί, εἰδέναι τοὺς κοπιῶντας ἐν ὑμῖν, καὶ προϊσταμένους ὑμῶν ἐν Κυρίῳ, καὶ νουθετοῦντας ὑμᾶς,"
  tags: []
"1Tes5,13":
  text: "καὶ ἡγεῖσθαι αὐτοὺς ὑπὲρ ἐκ περισσοῦ ἐν ἀγάπῃ διὰ τὸ ἔργον αὐτῶν. εἰρηνεύετε ἐν ἑαυτοῖς."
  tags: []
"1Tes5,14":
  text: "παρακαλοῦμεν δὲ ὑμᾶς, ἀδελφοί, νουθετεῖτε τοὺς ἀτάκτους, παραμυθεῖσθε τοὺς ὀλιγοψύχους, ἀντέχεσθε τῶν ἀσθενῶν, μακροθυμεῖτε πρὸς πάντας."
  tags: []
"1Tes5,15":
  text: "ὁρᾶτε μή τις κακὸν ἀντὶ κακοῦ τινὶ ἀποδῷ· ἀλλὰ πάντοτε τὸ ἀγαθὸν διώκετε καὶ εἰς ἀλλήλους καὶ εἰς πάντας."
  tags: []
"1Tes5,16":
  text: "πάντοτε χαίρετε·"
  tags: []
"1Tes5,17":
  text: "ἀδιαλείπτως προσεύχεσθε·"
  tags: []
"1Tes5,18":
  text: "ἐν παντὶ εὐχαριστεῖτε· τοῦτο γὰρ θέλημα Θεοῦ ἐν Χριστῷ Ἰησοῦ εἰς ὑμᾶς."
  tags: []
"1Tes5,19":
  text: "τὸ Πνεῦμα μὴ σβέννυτε·"
  tags: []
"1Tes5,20":
  text: "προφητείας μὴ ἐξουθενεῖτε·"
  tags: []
"1Tes5,21":
  text: "πάντα δοκιμάζετε· τὸ καλὸν κατέχετε·"
  tags: []
"1Tes5,22":
  text: "ἀπὸ παντὸς εἴδους πονηροῦ ἀπέχεσθε."
  tags: []
"1Tes5,23":
  text: "Αὐτὸς δὲ ὁ Θεὸς τῆς εἰρήνης ἁγιάσαι ὑμᾶς ὁλοτελεῖς· καὶ ὁλόκληρον ὑμῶν τὸ πνεῦμα καὶ ἡ ψυχὴ καὶ τὸ σῶμα ἀμέμπτως ἐν τῇ παρουσίᾳ τοῦ Κυρίου ἡμῶν Ἰησοῦ Χριστοῦ τηρηθείη."
  tags: []
"1Tes5,24":
  text: "πιστὸς ὁ καλῶν ὑμᾶς, ὃς καὶ ποιήσει."
  tags: []
"1Tes5,25":
  text: "Ἀδελφοί, προσεύχεσθε περὶ ἡμῶν."
  tags: []
"1Tes5,26":
  text: "Ἀσπάσασθε τοὺς ἀδελφοὺς πάντας ἐν φιλήματι ἁγίῳ."
  tags: []
"1Tes5,27":
  text: "ὁρκίζω ὑμᾶς τὸν Κύριον, ἀναγνωσθῆναι τὴν ἐπιστολὴν πᾶσι τοῖς ἁγίοις ἀδελφοῖς."
  tags: []
"1Tes5,28":
  text: "Ἡ χάρις τοῦ Κυρίου ἡμῶν Ἰησοῦ Χριστοῦ μεθ᾽ ὑμῶν. ἀμήν."
  tags: []
