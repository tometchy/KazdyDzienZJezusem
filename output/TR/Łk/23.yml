"Łk23,1":
  text: "Καὶ ἀναστὰν ἅπαν τὸ πλῆθος αὐτῶν, ἤγαγεν αὐτὸν ἐπὶ τὸν Πιλάτον."
  tags: []
"Łk23,2":
  text: "ἤρξαντο δὲ κατηγορεῖν αὐτοῦ, λέγοντες, Τοῦτον εὕρομεν διαστρέφοντα τὸ ἔθνος, καὶ κωλύοντα Καίσαρι φόρους διδόναι, λέγοντα ἑαυτὸν Χριστὸν βασιλέα εἶναι."
  tags: []
"Łk23,3":
  text: "ὁ δὲ Πιλάτος ἐπηρώτησεν αὐτόν, λέγων, Σὺ εἶ ὁ βασιλεὺς τῶν Ἰουδαίων; ὁ δὲ ἀποκριθεὶς αὐτῷ ἔφη, Σὺ λέγεις."
  tags: []
"Łk23,4":
  text: "ὁ δὲ Πιλάτος εἶπε πρὸς τοὺς ἀρχιερεῖς καὶ τοὺς ὄχλους, Οὐδὲν εὑρίσκω αἴτιον ἐν τῷ ἀνθρώπῳ τούτῳ."
  tags: []
"Łk23,5":
  text: "οἱ δὲ ἐπίσχυον, λέγοντες ὅτι Ἀνασείει τὸν λαόν, διδάσκων καθ᾽ ὅλης τῆς Ἰουδαίας, ἀρξάμενος ἀπὸ τῆς Γαλιλαίας ἕως ὧδε."
  tags: []
"Łk23,6":
  text: "Πιλάτος δὲ ἀκούσας Γαλιλαίαν ἐπηρώτησεν εἰ ὁ ἄνθρωπος Γαλιλαῖός ἐστι."
  tags: []
"Łk23,7":
  text: "καὶ ἐπιγνοὺς ὅτι ἐκ τῆς ἐξουσίας Ἡρώδου ἐστίν, ἀνέπεμψεν αὐτὸν πρὸς Ἡρώδην, ὄντα καὶ αὐτὸν ἐν Ἱεροσολύμοις ἐν ταύταις ταῖς ἡμέραις."
  tags: []
"Łk23,8":
  text: "Ὁ δὲ Ἡρώδης ἰδὼν τὸν Ἰησοῦν ἐχάρη λίαν· ἦν γὰρ θέλων ἐξ ἱκανοῦ ἰδεῖν αὐτόν, διὰ τὸ ἀκούειν πολλὰ περὶ αὐτοῦ· καὶ ἤλπιζέ τι σημεῖον ἰδεῖν ὑπ᾽ αὐτοῦ γινόμενον."
  tags: []
"Łk23,9":
  text: "ἐπηρώτα δὲ αὐτὸν ἐν λόγοις ἱκανοῖς· αὐτὸς δὲ οὐδὲν ἀπεκρίνατο αὐτῷ."
  tags: []
"Łk23,10":
  text: "εἱστήκεισαν δὲ οἱ ἀρχιερεῖς καὶ οἱ γραμματεῖς, εὐτόνως κατηγοροῦντες αὐτοῦ."
  tags: []
"Łk23,11":
  text: "ἐξουθενήσας δὲ αὐτὸν ὁ Ἡρώδης σὺν τοῖς στρατεύμασιν αὐτοῦ, καὶ ἐμπαίξας, περιβαλὼν αὐτὸν ἐσθῆτα λαμπράν, ἀνέπεμψεν αὐτὸν τῷ Πιλάτῳ."
  tags: []
"Łk23,12":
  text: "ἐγένοντο δὲ φίλοι ὅ τε Πιλάτος καὶ ὁ Ἡρώδης ἐν αὐτῇ τῇ ἡμέρᾳ μετ᾽ ἀλλήλων· προϋπῆρχον γὰρ ἐν ἔχθρᾳ ὄντες πρὸς ἑαυτούς."
  tags: []
"Łk23,13":
  text: "Πιλάτος δὲ συγκαλεσάμενος τοὺς ἀρχιερεῖς καὶ τοὺς ἄρχοντας καὶ τὸν λαόν,"
  tags: []
"Łk23,14":
  text: "εἶπε πρὸς αὐτούς, Προσηνέγκατέ μοι τὸν ἄνθρωπον τοῦτον, ὡς ἀποστρέφοντα τὸν λαόν· καὶ ἰδού, ἐγὼ ἐνώπιον ὑμῶν ἀνακρίνας οὐδὲν εὗρον ἐν τῷ ἀνθρώπῳ τούτῳ αἴτιον ὧν κατηγορεῖτε κατ᾽ αὐτοῦ·"
  tags: []
"Łk23,15":
  text: "ἀλλ᾽ οὐδὲ Ἡρώδης· ἀνέπεμψα γὰρ ὑμᾶς πρὸς αὐτόν, καὶ ἰδού, οὐδὲν ἄξιον θανάτου ἐστὶ πεπραγμένον αὐτῷ."
  tags: []
"Łk23,16":
  text: "παιδεύσας οὖν αὐτὸν ἀπολύσω."
  tags: []
"Łk23,17":
  text: "ἀνάγκην δὲ εἶχεν ἀπολύειν αὐτοῖς κατὰ ἑορτὴν ἕνα."
  tags: []
"Łk23,18":
  text: "ἀνέκραξαν δὲ παμπληθεί, λέγοντες, Αἶρε τοῦτον, ἀπόλυσον δὲ ἡμῖν τὸν Βαραββᾶν·"
  tags: []
"Łk23,19":
  text: "ὅστις ἦν διὰ στάσιν τινὰ γενομένην ἐν τῇ πόλει καὶ φόνον βεβλημένος εἰς φυλακήν."
  tags: []
"Łk23,20":
  text: "πάλιν οὖν ὁ Πιλάτος προσεφώνησε, θέλων ἀπολῦσαι τὸν Ἰησοῦν."
  tags: []
"Łk23,21":
  text: "οἱ δὲ ἐπεφώνουν, λέγοντες, Σταύρωσον, σταύρωσον αὐτόν."
  tags: []
"Łk23,22":
  text: "ὁ δὲ τρίτον εἶπε πρὸς αὐτούς, Τί γὰρ κακὸν ἐποίησεν οὗτος; οὐδὲν αἴτιον θανάτου εὗρον ἐν αὐτῷ· παιδεύσας οὖν αὐτὸν ἀπολύσω."
  tags: []
"Łk23,23":
  text: "οἱ δὲ ἐπέκειντο φωναῖς μεγάλαις, αἰτούμενοι αὐτὸν σταυρωθῆναι· καὶ κατίσχυον αἱ φωναὶ αὐτῶν καὶ τῶν ἀρχιερέων."
  tags: []
"Łk23,24":
  text: "ὁ δὲ Πιλάτος ἐπέκρινε γενέσθαι τὸ αἴτημα αὐτῶν."
  tags: []
"Łk23,25":
  text: "ἀπέλυσε δὲ αὐτοῖς τὸν διὰ στάσιν καὶ φόνον βεβλημένον εἰς τὴν φυλακήν, ὃν ᾐτοῦντο· τὸν δὲ Ἰησοῦν παρέδωκε τῷ θελήματι αὐτῶν."
  tags: []
"Łk23,26":
  text: "Καὶ ὡς ἀπήγαγον αὐτόν, ἐπιλαβόμενοι Σίμωνός τινος Κυρηναίου τοῦ ἐρχομένου ἀπ᾽ ἀγροῦ, ἐπέθηκαν αὐτῷ τὸν σταυρόν, φέρειν ὄπισθεν τοῦ Ἰησοῦ."
  tags: []
"Łk23,27":
  text: "Ἠκολούθει δὲ αὐτῷ πολὺ πλῆθος τοῦ λαοῦ, καὶ γυναικῶν αἳ καὶ ἐκόπτοντο καὶ ἐθρήνουν αὐτόν."
  tags: []
"Łk23,28":
  text: "στραφεὶς δὲ πρὸς αὐτὰς ὁ Ἰησοῦς εἶπε, Θυγατέρες Ἱερουσαλήμ, μὴ κλαίετε ἐπ᾽ ἐμέ, πλὴν ἐφ᾽ ἑαυτὰς κλαίετε καὶ ἐπὶ τὰ τέκνα ὑμῶν."
  tags: []
"Łk23,29":
  text: "ὅτι ἰδού, ἔρχονται ἡμέραι ἐν αἷς ἐροῦσι, Μακάριαι αἱ στεῖραι, καὶ κοιλίαι αἳ οὐκ ἐγέννησαν, καὶ μαστοὶ οἳ οὐκ ἐθήλασαν."
  tags: []
"Łk23,30":
  text: "τότε ἄρξονται λέγειν τοῖς ὄρεσι, Πέσετε ἐφ᾽ ἡμᾶς· καὶ τοῖς βουνοῖς, Καλύψατε ἡμᾶς."
  tags: []
"Łk23,31":
  text: "ὅτι εἰ ἐν τῷ ὑγρῷ ξύλῳ ταῦτα ποιοῦσιν, ἐν τῷ ξηρῷ τί γένηται;"
  tags: []
"Łk23,32":
  text: "Ἤγοντο δὲ καὶ ἕτεροι δύο κακοῦργοι σὺν αὐτῷ ἀναιρεθῆναι."
  tags: []
"Łk23,33":
  text: "Καὶ ὅτε ἀπῆλθον ἐπὶ τὸν τόπον τὸν καλούμενον Κρανίον, ἐκεῖ ἐσταύρωσαν αὐτόν, καὶ τοὺς κακούργους, ὃν μὲν ἐκ δεξιῶν, ὃν δὲ ἐξ ἀριστερῶν."
  tags: []
"Łk23,34":
  text: "ὁ δὲ Ἰησοῦς ἔλεγε, Πάτερ, ἄφες αὐτοῖς· οὐ γὰρ οἴδασι τί ποιοῦσι. διαμεριζόμενοι δὲ τὰ ἱμάτια αὐτοῦ, ἔβαλον κλῆρον."
  tags: []
"Łk23,35":
  text: "καὶ εἱστήκει ὁ λαὸς θεωρῶν. ἐξεμυκτήριζον δὲ καὶ οἱ ἄρχοντες σὺν αὐτοῖς, λέγοντες, Ἄλλους ἔσωσε, σωσάτω ἑαυτόν, εἰ οὗτός ἐστιν ὁ Χριστός, ὁ τοῦ Θεοῦ ἐκλεκτός."
  tags: []
"Łk23,36":
  text: "ἐνέπαιζον δὲ αὐτῷ καὶ οἱ στρατιῶται, προσερχόμενοι καὶ ὄξος προσφέροντες αὐτῷ,"
  tags: []
"Łk23,37":
  text: "καὶ λέγοντες, Εἰ σὺ εἶ ὁ βασιλεὺς τῶν Ἰουδαίων, σῶσον σεαυτόν."
  tags: []
"Łk23,38":
  text: "ἦν δὲ καὶ ἐπιγραφὴ γεγραμμένη ἐπ᾽ αὐτῷ γράμμασιν Ἑλληνικοῖς καὶ Ῥωμαϊκοῖς καὶ Ἑβραϊκοῖς, Οὗτός ἐστιν ὁ βασιλεὺς τῶν Ἰουδαίων."
  tags: []
"Łk23,39":
  text: "Εἷς δὲ τῶν κρεμασθέντων κακούργων ἐβλασφήμει αὐτόν, λέγων, Εἰ σὺ εἶ ὁ Χριστός, σῶσον σεαυτὸν καὶ ἡμᾶς."
  tags: []
"Łk23,40":
  text: "ἀποκριθεὶς δὲ ὁ ἕτερος ἐπετίμα αὐτῷ, λέγων, Οὐδὲ φοβῇ σὺ τὸν Θεόν, ὅτι ἐν τῷ αὐτῷ κρίματι εἶ;"
  tags: []
"Łk23,41":
  text: "καὶ ἡμεῖς μὲν δικαίως, ἄξια γὰρ ὧν ἐπράξαμεν ἀπολαμβάνομεν· οὗτος δὲ οὐδὲν ἄτοπον ἔπραξε."
  tags: []
"Łk23,42":
  text: "καὶ ἔλεγε τῷ Ἰησοῦ, Μνήσθητί μου, Κύριε, ὅταν ἔλθῃς ἐν τῇ βασιλείᾳ σου."
  tags: []
"Łk23,43":
  text: "καὶ εἶπεν αὐτῷ ὁ Ἰησοῦς, Ἀμὴν λέγω σοι, σήμερον μετ᾽ ἐμοῦ ἔσῃ ἐν τῷ παραδείσῳ."
  tags: []
"Łk23,44":
  text: "Ἦν δὲ ὡσεὶ ὥρα ἕκτη, καὶ σκότος ἐγένετο ἐφ᾽ ὅλην τὴν γῆν ἕως ὥρας ἐννάτης."
  tags: []
"Łk23,45":
  text: "καὶ ἐσκοτίσθη ὁ ἥλιος, καὶ ἐσχίσθη τὸ καταπέτασμα τοῦ ναοῦ μέσον."
  tags: []
"Łk23,46":
  text: "καὶ φωνήσας φωνῇ μεγάλῃ ὁ Ἰησοῦς εἶπε, Πάτερ, εἰς χεῖράς σου παραθήσομαι τὸ πνεῦμά μου· καὶ ταῦτα εἰπὼν ἐξέπνευσεν."
  tags: []
"Łk23,47":
  text: "ἰδὼν δὲ ὁ ἑκατόνταρχος τὸ γενόμενον ἐδόξασε τὸν Θεόν, λέγων, Ὄντως ὁ ἄνθρωπος οὗτος δίκαιος ἦν."
  tags: []
"Łk23,48":
  text: "καὶ πάντες οἱ συμπαραγενόμενοι ὄχλοι ἐπὶ τὴν θεωρίαν ταύτην, θεωροῦντες τὰ γενόμενα, τύπτοντες ἑαυτῶν τὰ στήθη ὑπέστρεφον."
  tags: []
"Łk23,49":
  text: "εἱστήκεισαν δὲ πάντες οἱ γνωστοὶ αὐτοῦ μακρόθεν, καὶ γυναῖκες αἱ συνακολουθήσασαι αὐτῷ ἀπὸ τῆς Γαλιλαίας, ὁρῶσαι ταῦτα."
  tags: []
"Łk23,50":
  text: "Καὶ ἰδού, ἀνὴρ ὀνόματι Ἰωσήφ, βουλευτὴς ὑπάρχων, ἀνὴρ ἀγαθὸς καὶ δίκαιος"
  tags: []
"Łk23,51":
  text: "(οὗτος οὐκ ἦν συγκατατεθειμένος τῇ βουλῇ καὶ τῇ πράξει αὐτῶν), ἀπὸ Ἀριμαθαίας πόλεως τῶν Ἰουδαίων, ὃς καὶ προσεδέχετο καὶ αὐτὸς τὴν βασιλείαν τοῦ Θεοῦ·"
  tags: []
"Łk23,52":
  text: "οὗτος προσελθὼν τῷ Πιλάτῳ ᾐτήσατο τὸ σῶμα τοῦ Ἰησοῦ."
  tags: []
"Łk23,53":
  text: "καὶ καθελὼν αὐτὸ ἐνετύλιξεν αὐτὸ σινδόνι, καὶ ἔθηκεν αὐτὸ ἐν μνήματι λαξευτῷ, οὗ οὐκ ἦν οὐδέπω οὐδεὶς κείμενος."
  tags: []
"Łk23,54":
  text: "καὶ ἡμέρα ἦν Παρασκευή, καὶ σάββατον ἐπέφωσκε."
  tags: []
"Łk23,55":
  text: "κατακολουθήσασαι δὲ καὶ γυναῖκες, αἵτινες ἦσαν συνεληλυθυῖαι αὐτῷ ἐκ τῆς Γαλιλαίας, ἐθεάσαντο τὸ μνημεῖον, καὶ ὡς ἐτέθη τὸ σῶμα αὐτοῦ."
  tags: []
"Łk23,56":
  text: "ὑποστρέψασαι δὲ ἡτοίμασαν ἀρώματα καὶ μύρα. Καὶ τὸ μὲν σάββατον ἡσύχασαν κατὰ τὴν ἐντολήν."
  tags: []
