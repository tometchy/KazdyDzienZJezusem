"Łk18,1":
  text: "Ἔλεγε δὲ καὶ παραβολὴν αὐτοῖς πρὸς τὸ δεῖν πάντοτε προσεύχεσθαι, καὶ μὴ ἐκκακεῖν,"
  tags: []
"Łk18,2":
  text: "λέγων, Κριτής τις ἦν ἔν τινι πόλει, τὸν Θεὸν μὴ φοβούμενος, καὶ ἄνθρωπον μὴ ἐντρεπόμενος·"
  tags: []
"Łk18,3":
  text: "χήρα δὲ ἦν ἐν τῇ πόλει ἐκείνῃ, καὶ ἤρχετο πρὸς αὐτόν, λέγουσα, Ἐκδίκησόν με ἀπὸ τοῦ ἀντιδίκου μου."
  tags: []
"Łk18,4":
  text: "καὶ οὐκ ἠθέλησεν ἐπὶ χρόνον· μετὰ δὲ ταῦτα εἶπεν ἐν ἑαυτῷ, Εἰ καὶ τὸν Θεὸν οὐ φοβοῦμαι, καὶ ἄνθρωπον οὐκ ἐντρέπομαι·"
  tags: []
"Łk18,5":
  text: "διά γε τὸ παρέχειν μοι κόπον τὴν χήραν ταύτην, ἐκδικήσω αὐτήν, ἵνα μὴ εἰς τέλος ἐρχομένη ὑπωπιάζῃ με."
  tags: []
"Łk18,6":
  text: "εἶπε δὲ ὁ Κύριος, Ἀκούσατε τί ὁ κριτὴς τῆς ἀδικίας λέγει."
  tags: []
"Łk18,7":
  text: "ὁ δὲ Θεὸς οὐ μὴ ποιήσει τὴν ἐκδίκησιν τῶν ἐκλεκτῶν αὐτοῦ τῶν βοώντων πρὸς αὐτὸν ἡμέρας καὶ νυκτός, καὶ μακροθυμῶν ἐπ᾽ αὐτοῖς;"
  tags: []
"Łk18,8":
  text: "λέγω ὑμῖν ὅτι ποιήσει τὴν ἐκδίκησιν αὐτῶν ἐν τάχει. πλὴν ὁ υἱὸς τοῦ ἀνθρώπου ἐλθὼν ἆρα εὑρήσει τὴν πίστιν ἐπὶ τῆς γῆς;"
  tags: []
"Łk18,9":
  text: "Εἶπε δὲ καὶ πρός τινας τοὺς πεποιθότας ἐφ᾽ ἑαυτοῖς ὅτι εἰσὶ δίκαιοι, καὶ ἐξουθενοῦντας τοὺς λοιπούς, τὴν παραβολὴν ταύτην·"
  tags: []
"Łk18,10":
  text: "Ἄνθρωποι δύο ἀνέβησαν εἰς τὸ ἱερὸν προσεύξασθαι· ὁ εἷς Φαρισαῖος, καὶ ὁ ἕτερος τελώνης."
  tags: []
"Łk18,11":
  text: "ὁ Φαρισαῖος σταθεὶς πρὸς ἑαυτὸν ταῦτα προσηύχετο, Ὁ Θεός, εὐχαριστῶ σοι ὅτι οὐκ εἰμὶ ὥσπερ οἱ λοιποὶ τῶν ἀνθρώπων, ἅρπαγες, ἄδικοι, μοιχοί, ἢ καὶ ὡς οὗτος ὁ τελώνης."
  tags: []
"Łk18,12":
  text: "νηστεύω δὶς τοῦ σαββάτου, ἀποδεκατῶ πάντα ὅσα κτῶμαι."
  tags: []
"Łk18,13":
  text: "καὶ ὁ τελώνης μακρόθεν ἑστὼς οὐκ ἤθελεν οὐδὲ τοὺς ὀφθαλμοὺς εἰς τὸν οὐρανὸν ἐπᾶραι, ἀλλ᾽ ἔτυπτεν εἰς τὸ στῆθος αὐτοῦ, λέγων, Ὁ Θεός, ἱλάσθητί μοι τῷ ἁμαρτωλῷ."
  tags: []
"Łk18,14":
  text: "λέγω ὑμῖν, κατέβη οὗτος δεδικαιωμένος εἰς τὸν οἶκον αὐτοῦ ἢ ἐκεῖνος· ὅτι πᾶς ὁ ὑψῶν ἑαυτὸν ταπεινωθήσεται, ὁ δὲ ταπεινῶν ἑαυτὸν ὑψωθήσεται."
  tags: []
"Łk18,15":
  text: "Προσέφερον δὲ αὐτῷ καὶ τὰ βρέφη, ἵνα αὐτῶν ἅπτηται· ἰδόντες δὲ οἱ μαθηταὶ ἐπετίμησαν αὐτοῖς."
  tags: []
"Łk18,16":
  text: "ὁ δὲ Ἰησοῦς προσκαλεσάμενος αὐτὰ εἶπεν, Ἄφετε τὰ παιδία ἔρχεσθαι πρός με, καὶ μὴ κωλύετε αὐτά· τῶν γὰρ τοιούτων ἐστὶν ἡ βασιλεία τοῦ Θεοῦ."
  tags: []
"Łk18,17":
  text: "ἀμὴν λέγω ὑμῖν, ὃς ἐὰν μὴ δέξηται τὴν βασιλείαν τοῦ Θεοῦ ὡς παιδίον, οὐ μὴ εἰσέλθῃ εἰς αὐτήν."
  tags: []
"Łk18,18":
  text: "Καὶ ἐπηρώτησέ τις αὐτὸν ἄρχων, λέγων, Διδάσκαλε ἀγαθέ, τί ποιήσας ζωὴν αἰώνιον κληρονομήσω;"
  tags: []
"Łk18,19":
  text: "εἶπε δὲ αὐτῷ ὁ Ἰησοῦς, Τί με λέγεις ἀγαθόν; οὐδεὶς ἀγαθός, εἰ μὴ εἷς, ὁ Θεός."
  tags: []
"Łk18,20":
  text: "τὰς ἐντολὰς οἶδας, Μὴ μοιχεύσῃς, μὴ φονεύσῃς, μὴ κλέψῃς, μὴ ψευδομαρτυρήσῃς, τίμα τὸν πατέρα σου καὶ τὴν μητέρα σου."
  tags: []
"Łk18,21":
  text: "ὁ δὲ εἶπε, Ταῦτα πάντα ἐφυλαξάμην ἐκ νεότητός μου."
  tags: []
"Łk18,22":
  text: "ἀκούσας δὲ ταῦτα ὁ Ἰησοῦς εἶπεν αὐτῷ, Ἔτι ἕν σοι λείπει· πάντα ὅσα ἔχεις πώλησον, καὶ διάδος πτωχοῖς, καὶ ἕξεις θησαυρὸν ἐν οὐρανῷ· καὶ δεῦρο, ἀκολούθει μοι."
  tags: []
"Łk18,23":
  text: "ὁ δὲ ἀκούσας ταῦτα περίλυπος ἐγένετο· ἦν γὰρ πλούσιος σφόδρα."
  tags: []
"Łk18,24":
  text: "ἰδὼν δὲ αὐτὸν ὁ Ἰησοῦς περίλυπον γενόμενον εἶπε, Πῶς δυσκόλως οἱ τὰ χρήματα ἔχοντες εἰσελεύσονται εἰς τὴν βασιλείαν τοῦ Θεοῦ."
  tags: []
"Łk18,25":
  text: "εὐκοπώτερον γάρ ἐστι κάμηλον διὰ τρυμαλιᾶς ῥαφίδος εἰσελθεῖν, ἢ πλούσιον εἰς τὴν βασιλείαν τοῦ Θεοῦ εἰσελθεῖν."
  tags: []
"Łk18,26":
  text: "εἶπον δὲ οἱ ἀκούσαντες, Καὶ τίς δύναται σωθῆναι;"
  tags: []
"Łk18,27":
  text: "ὁ δὲ εἶπε, Τὰ ἀδύνατα παρὰ ἀνθρώποις δυνατά ἐστι παρὰ τῷ Θεῷ."
  tags: []
"Łk18,28":
  text: "εἶπε δὲ ὁ Πέτρος, Ἰδού, ἡμεῖς ἀφήκαμεν πάντα, καὶ ἠκολουθήσαμέν σοι."
  tags: []
"Łk18,29":
  text: "ὁ δὲ εἶπεν αὐτοῖς, Ἀμὴν λέγω ὑμῖν ὅτι οὐδείς ἐστιν ὃς ἀφῆκεν οἰκίαν, ἢ γονεῖς, ἢ ἀδελφούς, ἢ γυναῖκα, ἢ τέκνα, ἕνεκεν τῆς βασιλείας τοῦ Θεοῦ,"
  tags: []
"Łk18,30":
  text: "ὃς οὐ μὴ ἀπολάβῃ πολλαπλασίονα ἐν τῷ καιρῷ τούτῳ, καὶ ἐν τῷ αἰῶνι τῷ ἐρχομένῳ ζωὴν αἰώνιον."
  tags: []
"Łk18,31":
  text: "Παραλαβὼν δὲ τοὺς δώδεκα, εἶπε πρὸς αὐτούς, Ἰδού, ἀναβαίνομεν εἰς Ἱεροσόλυμα, καὶ τελεσθήσεται πάντα τὰ γεγραμμένα διὰ τῶν προφητῶν τῷ υἱῷ τοῦ ἀνθρώπου."
  tags: []
"Łk18,32":
  text: "παραδοθήσεται γὰρ τοῖς ἔθνεσι, καὶ ἐμπαιχθήσεται, καὶ ὑβρισθήσεται, καὶ ἐμπτυσθήσεται,"
  tags: []
"Łk18,33":
  text: "καὶ μαστιγώσαντες ἀποκτενοῦσιν αὐτόν· καὶ τῇ ἡμέρᾳ τῇ τρίτῃ ἀναστήσεται."
  tags: []
"Łk18,34":
  text: "καὶ αὐτοὶ οὐδὲν τούτων συνῆκαν, καὶ ἦν τὸ ῥῆμα τοῦτο κεκρυμμένον ἀπ᾽ αὐτῶν, καὶ οὐκ ἐγίνωσκον τὰ λεγόμενα."
  tags: []
"Łk18,35":
  text: "Ἐγένετο δὲ ἐν τῷ ἐγγίζειν αὐτὸν εἰς Ἰεριχώ, τυφλός τις ἐκάθητο παρὰ τὴν ὁδὸν προσαιτῶν·"
  tags: []
"Łk18,36":
  text: "ἀκούσας δὲ ὄχλου διαπορευομένου, ἐπυνθάνετο τί εἴη τοῦτο."
  tags: []
"Łk18,37":
  text: "ἀπήγγειλαν δὲ αὐτῷ ὅτι Ἰησοῦς ὁ Ναζωραῖος παρέρχεται."
  tags: []
"Łk18,38":
  text: "καὶ ἐβόησε, λέγων, Ἰησοῦ, υἱὲ Δαβίδ, ἐλέησόν με."
  tags: []
"Łk18,39":
  text: "καὶ οἱ προάγοντες ἐπετίμων αὐτῷ ἵνα σιωπήσῃ· αὐτὸς δὲ πολλῷ μᾶλλον ἔκραζεν, Υἱὲ Δαβίδ, ἐλέησόν με."
  tags: []
"Łk18,40":
  text: "σταθεὶς δὲ ὁ Ἰησοῦς ἐκέλευσεν αὐτὸν ἀχθῆναι πρὸς αὐτόν· ἐγγίσαντος δὲ αὐτοῦ ἐπηρώτησεν αὐτόν,"
  tags: []
"Łk18,41":
  text: "λέγων, Τί σοι θέλεις ποιήσω; ὁ δὲ εἶπε, Κύριε, ἵνα ἀναβλέψω."
  tags: []
"Łk18,42":
  text: "καὶ ὁ Ἰησοῦς εἶπεν αὐτῷ, Ἀνάβλεψον· ἡ πίστις σου σέσωκέ σε."
  tags: []
"Łk18,43":
  text: "καὶ παραχρῆμα ἀνέβλεψε, καὶ ἠκολούθει αὐτῷ, δοξάζων τὸν Θεόν· καὶ πᾶς ὁ λαὸς ἰδὼν ἔδωκεν αἶνον τῷ Θεῷ."
  tags: []
