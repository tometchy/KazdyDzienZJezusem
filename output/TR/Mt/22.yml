"Mt22,1":
  text: "Καὶ ἀποκριθεὶς ὁ Ἰησοῦς πάλιν εἶπεν αὐτοῖς ἐν παραβολαῖς, λέγων,"
  tags: []
"Mt22,2":
  text: "Ὡμοιώθη ἡ βασιλεία τῶν οὐρανῶν ἀνθρώπῳ βασιλεῖ, ὅστις ἐποίησε γάμους τῷ υἱῷ αὐτοῦ·"
  tags: []
"Mt22,3":
  text: "καὶ ἀπέστειλε τοὺς δούλους αὐτοῦ καλέσαι τοὺς κεκλημένους εἰς τοὺς γάμους, καὶ οὐκ ἤθελον ἐλθεῖν."
  tags: []
"Mt22,4":
  text: "πάλιν ἀπέστειλεν ἄλλους δούλους, λέγων, Εἴπατε τοῖς κεκλημένοις, Ἰδού, τὸ ἄριστόν μου ἡτοίμασα, οἱ ταῦροί μου καὶ τὰ σιτιστὰ τεθυμένα, καὶ πάντα ἕτοιμα· δεῦτε εἰς τοὺς γάμους."
  tags: []
"Mt22,5":
  text: "οἱ δὲ ἀμελήσαντες ἀπῆλθον, ὁ μὲν εἰς τὸν ἴδιον ἀγρόν, ὁ δὲ εἰς τὴν ἐμπορίαν αὐτοῦ·"
  tags: []
"Mt22,6":
  text: "οἱ δὲ λοιποὶ κρατήσαντες τοὺς δούλους αὐτοῦ ὕβρισαν καὶ ἀπέκτειναν."
  tags: []
"Mt22,7":
  text: "ἀκούσας δὲ ὁ βασιλεὺς ὠργίσθη, καὶ πέμψας τὰ στρατεύματα αὐτοῦ ἀπώλεσε τοὺς φονεῖς ἐκείνους, καὶ τὴν πόλιν αὐτῶν ἐνέπρησε."
  tags: []
"Mt22,8":
  text: "τότε λέγει τοῖς δούλοις αὐτοῦ, Ὁ μὲν γάμος ἕτοιμός ἐστιν, οἱ δὲ κεκλημένοι οὐκ ἦσαν ἄξιοι."
  tags: []
"Mt22,9":
  text: "πορεύεσθε οὖν ἐπὶ τὰς διεξόδους τῶν ὁδῶν, καὶ ὅσους ἂν εὕρητε, καλέσατε εἰς τοὺς γάμους."
  tags: []
"Mt22,10":
  text: "καὶ ἐξελθόντες οἱ δοῦλοι ἐκεῖνοι εἰς τὰς ὁδοὺς συνήγαγον πάντας ὅσους εὗρον, πονηρούς τε καὶ ἀγαθούς· καὶ ἐπλήσθη ὁ γάμος ἀνακειμένων."
  tags: []
"Mt22,11":
  text: "εἰσελθὼν δὲ ὁ βασιλεὺς θεάσασθαι τοὺς ἀνακειμένους εἶδεν ἐκεῖ ἄνθρωπον οὐκ ἐνδεδυμένον ἔνδυμα γάμου·"
  tags: []
"Mt22,12":
  text: "καὶ λέγει αὐτῷ, Ἑταῖρε, πῶς εἰσῆλθες ὧδε μὴ ἔχων ἔνδυμα γάμου; ὁ δὲ ἐφιμώθη."
  tags: []
"Mt22,13":
  text: "τότε εἶπεν ὁ βασιλεὺς τοῖς διακόνοις, Δήσαντες αὐτοῦ πόδας καὶ χεῖρας, ἄρατε αὐτὸν καὶ ἐκβάλετε εἰς τὸ σκότος τὸ ἐξώτερον· ἐκεῖ ἔσται ὁ κλαυθμὸς καὶ ὁ βρυγμὸς τῶν ὀδόντων."
  tags: []
"Mt22,14":
  text: "πολλοὶ γάρ εἰσι κλητοί, ὀλίγοι δὲ ἐκλεκτοί."
  tags: []
"Mt22,15":
  text: "Τότε πορευθέντες οἱ Φαρισαῖοι συμβούλιον ἔλαβον ὅπως αὐτὸν παγιδεύσωσιν ἐν λόγῳ."
  tags: []
"Mt22,16":
  text: "καὶ ἀποστέλλουσιν αὐτῷ τοὺς μαθητὰς αὐτῶν μετὰ τῶν Ἡρωδιανῶν, λέγοντες, Διδάσκαλε, οἴδαμεν ὅτι ἀληθὴς εἶ, καὶ τὴν ὁδὸν τοῦ Θεοῦ ἐν ἀληθείᾳ διδάσκεις, καὶ οὐ μέλει σοι περὶ οὐδενός, οὐ γὰρ βλέπεις εἰς πρόσωπον ἀνθρώπων."
  tags: []
"Mt22,17":
  text: "εἰπὲ οὖν ἡμῖν, τί σοι δοκεῖ; ἔξεστι δοῦναι κῆνσον Καίσαρι, ἢ οὔ;"
  tags: []
"Mt22,18":
  text: "γνοὺς δὲ ὁ Ἰησοῦς τὴν πονηρίαν αὐτῶν εἶπε, Τί με πειράζετε, ὑποκριταί;"
  tags: []
"Mt22,19":
  text: "ἐπιδείξατέ μοι τὸ νόμισμα τοῦ κήνσου. οἱ δὲ προσήνεγκαν αὐτῷ δηνάριον."
  tags: []
"Mt22,20":
  text: "καὶ λέγει αὐτοῖς, Τίνος ἡ εἰκὼν αὕτη καὶ ἡ ἐπιγραφή;"
  tags: []
"Mt22,21":
  text: "λέγουσιν αὐτῷ, Καίσαρος. τότε λέγει αὐτοῖς, Ἀπόδοτε οὖν τὰ Καίσαρος Καίσαρι· καὶ τὰ τοῦ Θεοῦ τῷ Θεῷ."
  tags: []
"Mt22,22":
  text: "καὶ ἀκούσαντες ἐθαύμασαν· καὶ ἀφέντες αὐτὸν ἀπῆλθον."
  tags: []
"Mt22,23":
  text: "Ἐν ἐκείνῃ τῇ ἡμέρᾳ προσῆλθον αὐτῷ Σαδδουκαῖοι, οἱ λέγοντες μὴ εἶναι ἀνάστασιν, καὶ ἐπηρώτησαν αὐτόν,"
  tags: []
"Mt22,24":
  text: "λέγοντες, Διδάσκαλε, Μωσῆς εἶπεν, Ἐάν τις ἀποθάνῃ μὴ ἔχων τέκνα, ἐπιγαμβρεύσει ὁ ἀδελφὸς αὐτοῦ τὴν γυναῖκα αὐτοῦ, καὶ ἀναστήσει σπέρμα τῷ ἀδελφῷ αὐτοῦ."
  tags: []
"Mt22,25":
  text: "ἦσαν δὲ παρ᾽ ἡμῖν ἑπτὰ ἀδελφοί· καὶ ὁ πρῶτος γαμήσας ἐτελεύτησε· καὶ μὴ ἔχων σπέρμα, ἀφῆκε τὴν γυναῖκα αὐτοῦ τῷ ἀδελφῷ αὐτοῦ."
  tags: []
"Mt22,26":
  text: "ὁμοίως καὶ ὁ δεύτερος, καὶ ὁ τρίτος, ἕως τῶν ἑπτά."
  tags: []
"Mt22,27":
  text: "ὕστερον δὲ πάντων ἀπέθανε καὶ ἡ γυνή."
  tags: []
"Mt22,28":
  text: "ἐν τῇ οὖν ἀναστάσει, τίνος τῶν ἑπτὰ ἔσται γυνή; πάντες γὰρ ἔσχον αὐτήν."
  tags: []
"Mt22,29":
  text: "ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν αὐτοῖς, Πλανᾶσθε, μὴ εἰδότες τὰς γραφάς, μηδὲ τὴν δύναμιν τοῦ Θεοῦ."
  tags: []
"Mt22,30":
  text: "ἐν γὰρ τῇ ἀναστάσει οὔτε γαμοῦσιν, οὔτε ἐκγαμίζονται, ἀλλ᾽ ὡς ἄγγελοι τοῦ Θεοῦ ἐν οὐρανῷ εἰσι."
  tags: []
"Mt22,31":
  text: "περὶ δὲ τῆς ἀναστάσεως τῶν νεκρῶν, οὐκ ἀνέγνωτε τὸ ῥηθὲν ὑμῖν ὑπὸ τοῦ Θεοῦ, λέγοντος,"
  tags: []
"Mt22,32":
  text: "Ἐγώ εἰμι ὁ Θεὸς Ἀβραάμ, καὶ ὁ Θεὸς Ἰσαάκ, καὶ ὁ Θεὸς Ἰακώβ; οὐκ ἔστιν ὁ Θεὸς Θεὸς νεκρῶν, ἀλλὰ ζώντων."
  tags: []
"Mt22,33":
  text: "καὶ ἀκούσαντες οἱ ὄχλοι ἐξεπλήσσοντο ἐπὶ τῇ διδαχῇ αὐτοῦ."
  tags: []
"Mt22,34":
  text: "Οἱ δὲ Φαρισαῖοι, ἀκούσαντες ὅτι ἐφίμωσε τοὺς Σαδδουκαίους, συνήχθησαν ἐπὶ τὸ αὐτό."
  tags: []
"Mt22,35":
  text: "καὶ ἐπηρώτησεν εἷς ἐξ αὐτῶν νομικός, πειράζων αὐτόν, καὶ λέγων,"
  tags: []
"Mt22,36":
  text: "Διδάσκαλε, ποία ἐντολὴ μεγάλη ἐν τῷ νόμῳ;"
  tags: []
"Mt22,37":
  text: "ὁ δὲ Ἰησοῦς εἶπεν αὐτῷ, Ἀγαπήσεις Κύριον τὸν Θεόν σου, ἐν ὅλῃ τῇ καρδίᾳ σου, καὶ ἐν ὅλῃ τῇ ψυχῇ σου, καὶ ἐν ὅλῃ τῇ διανοίᾳ σου."
  tags: []
"Mt22,38":
  text: "αὕτη ἐστὶ πρώτη καὶ μεγάλη ἐντολή."
  tags: []
"Mt22,39":
  text: "δευτέρα δὲ ὁμοία αὐτῇ, Ἀγαπήσεις τὸν πλησίον σου ὡς σεαυτόν."
  tags: []
"Mt22,40":
  text: "ἐν ταύταις ταῖς δυσὶν ἐντολαῖς ὅλος ὁ νόμος καὶ οἱ προφῆται κρέμανται."
  tags: []
"Mt22,41":
  text: "Συνηγμένων δὲ τῶν Φαρισαίων, ἐπηρώτησεν αὐτοὺς ὁ Ἰησοῦς,"
  tags: []
"Mt22,42":
  text: "λέγων, Τί ὑμῖν δοκεῖ περὶ τοῦ Χριστοῦ; τίνος υἱός ἐστι; λέγουσιν αὐτῷ, Τοῦ Δαβίδ."
  tags: []
"Mt22,43":
  text: "λέγει αὐτοῖς, Πῶς οὖν Δαβὶδ ἐν πνεύματι Κύριον αὐτὸν καλεῖ, λέγων,"
  tags: []
"Mt22,44":
  text: "Εἶπεν ὁ Κύριος τῷ Κυρίῳ μου, Κάθου ἐκ δεξιῶν μου, ἕως ἂν θῶ τοὺς ἐχθρούς σου ὑποπόδιον τῶν ποδῶν σου;"
  tags: []
"Mt22,45":
  text: "εἰ οὖν Δαβὶδ καλεῖ αὐτὸν Κύριον, πῶς υἱὸς αὐτοῦ ἐστι;"
  tags: []
"Mt22,46":
  text: "καὶ οὐδεὶς ἐδύνατο αὐτῷ ἀποκριθῆναι λόγον· οὐδὲ ἐτόλμησέ τις ἀπ᾽ ἐκείνης τῆς ἡμέρας ἐπερωτῆσαι αὐτὸν οὐκέτι."
  tags: []
