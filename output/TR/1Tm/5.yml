"1Tm5,1":
  text: "Πρεσβυτέρῳ μὴ ἐπιπλήξῃς, ἀλλὰ παρακάλει ὡς πατέρα· νεωτέρους, ὡς ἀδελφούς·"
  tags: []
"1Tm5,2":
  text: "πρεσβυτέρας, ὡς μητέρας· νεωτέρας, ὡς ἀδελφάς, ἐν πάσῃ ἁγνείᾳ."
  tags: []
"1Tm5,3":
  text: "χήρας τίμα τὰς ὄντως χήρας."
  tags: []
"1Tm5,4":
  text: "εἰ δέ τις χήρα τέκνα ἢ ἔκγονα ἔχει, μανθανέτωσαν πρῶτον τὸν ἴδιον οἶκον εὐσεβεῖν, καὶ ἀμοιβὰς ἀποδιδόναι τοῖς προγόνοις· τοῦτο γάρ ἐστι καλὸν καὶ ἀπόδεκτον ἐνώπιον τοῦ Θεοῦ."
  tags: []
"1Tm5,5":
  text: "ἡ δὲ ὄντως χήρα καὶ μεμονωμένη ἤλπικεν ἐπὶ τὸν Θεόν, καὶ προσμένει ταῖς δεήσεσι καὶ ταῖς προσευχαῖς νυκτὸς καὶ ἡμέρας."
  tags: []
"1Tm5,6":
  text: "ἡ δὲ σπαταλῶσα, ζῶσα τέθνηκε."
  tags: []
"1Tm5,7":
  text: "καὶ ταῦτα παράγγελλε, ἵνα ἀνεπίληπτοι ὦσιν."
  tags: []
"1Tm5,8":
  text: "εἰ δέ τις τῶν ἰδίων καὶ μάλιστα τῶν οἰκείων οὐ προνοεῖ, τὴν πίστιν ἤρνηται, καὶ ἔστιν ἀπίστου χείρων."
  tags: []
"1Tm5,9":
  text: "χήρα καταλεγέσθω μὴ ἔλαττον ἐτῶν ἑξήκοντα, γεγονυῖα ἑνὸς ἀνδρὸς γυνή,"
  tags: []
"1Tm5,10":
  text: "ἐν ἔργοις καλοῖς μαρτυρουμένη, εἰ ἐτεκνοτρόφησεν, εἰ ἐξενοδόχησεν, εἰ ἁγίων πόδας ἔνιψεν, εἰ θλιβομένοις ἐπήρκεσεν, εἰ παντὶ ἔργῳ ἀγαθῷ ἐπηκολούθησε."
  tags: []
"1Tm5,11":
  text: "νεωτέρας δὲ χήρας παραιτοῦ· ὅταν γὰρ καταστρηνιάσωσι τοῦ Χριστοῦ, γαμεῖν θέλουσιν,"
  tags: []
"1Tm5,12":
  text: "ἔχουσαι κρίμα, ὅτι τὴν πρώτην πίστιν ἠθέτησαν."
  tags: []
"1Tm5,13":
  text: "ἅμα δὲ καὶ ἀργαὶ μανθάνουσι, περιερχόμεναι τὰς οἰκίας, οὐ μόνον δὲ ἀργαί, ἀλλὰ καὶ φλύαροι καὶ περίεργοι, λαλοῦσαι τὰ μὴ δέοντα."
  tags: []
"1Tm5,14":
  text: "βούλομαι οὖν νεωτέρας γαμεῖν, τεκνογονεῖν, οἰκοδεσποτεῖν, μηδεμίαν ἀφορμὴν διδόναι τῷ ἀντικειμένῳ λοιδορίας χάριν."
  tags: []
"1Tm5,15":
  text: "ἤδη γάρ τινες ἐξετράπησαν ὀπίσω τοῦ Σατανᾶ."
  tags: []
"1Tm5,16":
  text: "εἴ τις πιστὸς ἢ πιστὴ ἔχει χήρας, ἐπαρκείτω αὐταῖς, καὶ μὴ βαρείσθω ἡ ἐκκλησία, ἵνα ταῖς ὄντως χήραις ἐπαρκέσῃ."
  tags: []
"1Tm5,17":
  text: "Οἱ καλῶς προεστῶτες πρεσβύτεροι διπλῆς τιμῆς ἀξιούσθωσαν, μάλιστα οἱ κοπιῶντες ἐν λόγῳ καὶ διδασκαλίᾳ."
  tags: []
"1Tm5,18":
  text: "λέγει γὰρ ἡ γραφή, Βοῦν ἀλοῶντα οὐ φιμώσεις. καί, Ἄξιος ὁ ἐργάτης τοῦ μισθοῦ αὐτοῦ."
  tags: []
"1Tm5,19":
  text: "κατὰ πρεσβυτέρου κατηγορίαν μὴ παραδέχου, ἐκτὸς εἰ μὴ ἐπὶ δύο ἢ τριῶν μαρτύρων."
  tags: []
"1Tm5,20":
  text: "τοὺς ἁμαρτάνοντας ἐνώπιον πάντων ἔλεγχε, ἵνα καὶ οἱ λοιποὶ φόβον ἔχωσι."
  tags: []
"1Tm5,21":
  text: "διαμαρτύρομαι ἐνώπιον τοῦ Θεοῦ καὶ Κυρίου Ἰησοῦ Χριστοῦ καὶ τῶν ἐκλεκτῶν ἀγγέλων, ἵνα ταῦτα φυλάξῃς χωρὶς προκρίματος, μηδὲν ποιῶν κατὰ πρόσκλισιν."
  tags: []
"1Tm5,22":
  text: "χεῖρας ταχέως μηδενὶ ἐπιτίθει, μηδὲ κοινώνει ἁμαρτίαις ἀλλοτρίαις· σεαυτὸν ἁγνὸν τήρει."
  tags: []
"1Tm5,23":
  text: "μηκέτι ὑδροπότει, ἀλλ᾽ οἴνῳ ὀλίγῳ χρῶ, διὰ τὸν στόμαχόν σου καὶ τὰς πυκνάς σου ἀσθενείας."
  tags: []
"1Tm5,24":
  text: "τινῶν ἀνθρώπων αἱ ἁμαρτίαι πρόδηλοί εἰσι, προάγουσαι εἰς κρίσιν· τισὶ δὲ καὶ ἐπακολουθοῦσιν."
  tags: []
"1Tm5,25":
  text: "ὡσαύτως καὶ τὰ καλὰ ἔργα πρόδηλά ἐστι· καὶ τὰ ἄλλως ἔχοντα κρυβῆναι οὐ δύναται."
  tags: []
