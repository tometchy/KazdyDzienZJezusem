"1Tm2,1":
  text: "Παρακαλῶ οὖν πρῶτον πάντων ποιεῖσθαι δεήσεις, προσευχάς, ἐντεύξεις, εὐχαριστίας, ὑπὲρ πάντων ἀνθρώπων·"
  tags: []
"1Tm2,2":
  text: "ὑπὲρ βασιλέων καὶ πάντων τῶν ἐν ὑπεροχῇ ὄντων, ἵνα ἤρεμον καὶ ἡσύχιον βίον διάγωμεν ἐν πάσῃ εὐσεβείᾳ καὶ σεμνότητι."
  tags: []
"1Tm2,3":
  text: "τοῦτο γὰρ καλὸν καὶ ἀπόδεκτον ἐνώπιον τοῦ σωτῆρος ἡμῶν Θεοῦ,"
  tags: []
"1Tm2,4":
  text: "ὃς πάντας ἀνθρώπους θέλει σωθῆναι καὶ εἰς ἐπίγνωσιν ἀληθείας ἐλθεῖν."
  tags: []
"1Tm2,5":
  text: "εἷς γὰρ Θεός, εἷς καὶ μεσίτης Θεοῦ καὶ ἀνθρώπων, ἄνθρωπος Χριστὸς Ἰησοῦς,"
  tags: []
"1Tm2,6":
  text: "ὁ δοὺς ἑαυτὸν ἀντίλυτρον ὑπὲρ πάντων, τὸ μαρτύριον καιροῖς ἰδίοις,"
  tags: []
"1Tm2,7":
  text: "εἰς ὃ ἐτέθην ἐγὼ κήρυξ καὶ ἀπόστολος (ἀλήθειαν λέγω ἐν Χριστῷ, οὐ ψεύδομαι), διδάσκαλος ἐθνῶν ἐν πίστει καὶ ἀληθείᾳ."
  tags: []
"1Tm2,8":
  text: "Βούλομαι οὖν προσεύχεσθαι τοὺς ἄνδρας ἐν παντὶ τόπῳ, ἐπαίροντας ὁσίους χεῖρας, χωρὶς ὀργῆς καὶ διαλογισμοῦ."
  tags: []
"1Tm2,9":
  text: "ὡσαύτως καὶ τὰς γυναῖκας ἐν καταστολῇ κοσμίῳ, μετὰ αἰδοῦς καὶ σωφροσύνης, κοσμεῖν ἑαυτάς, μὴ ἐν πλέγμασιν, ἢ χρυσῷ, ἢ μαργαρίταις, ἢ ἱματισμῷ πολυτελεῖ,"
  tags: []
"1Tm2,10":
  text: "ἀλλ᾽ (ὃ πρέπει γυναιξὶν ἐπαγγελλομέναις θεοσέβειαν) δι᾽ ἔργων ἀγαθῶν."
  tags: []
"1Tm2,11":
  text: "γυνὴ ἐν ἡσυχίᾳ μανθανέτω ἐν πάσῃ ὑποταγῇ."
  tags: []
"1Tm2,12":
  text: "γυναικὶ δὲ διδάσκειν οὐκ ἐπιτρέπω, οὐδὲ αὐθεντεῖν ἀνδρός, ἀλλ᾽ εἶναι ἐν ἡσυχίᾳ."
  tags: []
"1Tm2,13":
  text: "Ἀδὰμ γὰρ πρῶτος ἐπλάσθη, εἶτα Εὔα·"
  tags: []
"1Tm2,14":
  text: "καὶ Ἀδὰμ οὐκ ἠπατήθη, ἡ δὲ γυνὴ ἀπατηθεῖσα ἐν παραβάσει γέγονε·"
  tags: []
"1Tm2,15":
  text: "σωθήσεται δὲ διὰ τῆς τεκνογονίας, ἐὰν μείνωσιν ἐν πίστει καὶ ἀγάπῃ καὶ ἁγιασμῷ μετὰ σωφροσύνης."
  tags: []
