"Ga5,1":
  text: "τῇ ἐλευθερίᾳ οὖν ᾗ Χριστὸς ἡμᾶς ἠλευθέρωσε, στήκετε, καὶ μὴ πάλιν ζυγῷ δουλείας ἐνέχεσθε."
  tags: []
"Ga5,2":
  text: "Ἴδε, ἐγὼ Παῦλος λέγω ὑμῖν, ὅτι ἐὰν περιτέμνησθε, Χριστὸς ὑμᾶς οὐδὲν ὠφελήσει."
  tags: []
"Ga5,3":
  text: "μαρτύρομαι δὲ πάλιν παντὶ ἀνθρώπῳ περιτεμνομένῳ, ὅτι ὀφειλέτης ἐστὶν ὅλον τὸν νόμον ποιῆσαι."
  tags: []
"Ga5,4":
  text: "κατηργήθητε ἀπὸ τοῦ Χριστοῦ, οἵτινες ἐν νόμῳ δικαιοῦσθε· τῆς χάριτος ἐξεπέσατε."
  tags: []
"Ga5,5":
  text: "ἡμεῖς γὰρ Πνεύματι ἐκ πίστεως ἐλπίδα δικαιοσύνης ἀπεκδεχόμεθα."
  tags: []
"Ga5,6":
  text: "ἐν γὰρ Χριστῷ Ἰησοῦ οὔτε περιτομή τι ἰσχύει, οὔτε ἀκροβυστία, ἀλλὰ πίστις δι᾽ ἀγάπης ἐνεργουμένη."
  tags: []
"Ga5,7":
  text: "ἐτρέχετε καλῶς· τίς ὑμᾶς ἀνέκοψε τῇ ἀληθείᾳ μὴ πείθεσθαι;"
  tags: []
"Ga5,8":
  text: "ἡ πεισμονὴ οὐκ ἐκ τοῦ καλοῦντος ὑμᾶς."
  tags: []
"Ga5,9":
  text: "μικρὰ ζύμη ὅλον τὸ φύραμα ζυμοῖ."
  tags: []
"Ga5,10":
  text: "ἐγὼ πέποιθα εἰς ὑμᾶς ἐν Κυρίῳ, ὅτι οὐδὲν ἄλλο φρονήσετε· ὁ δὲ ταράσσων ὑμᾶς βαστάσει τὸ κρίμα, ὅστις ἂν ᾖ."
  tags: []
"Ga5,11":
  text: "ἐγὼ δέ, ἀδελφοί, εἰ περιτομὴν ἔτι κηρύσσω, τί ἔτι διώκομαι; ἄρα κατήργηται τὸ σκάνδαλον τοῦ σταυροῦ."
  tags: []
"Ga5,12":
  text: "ὄφελον καὶ ἀποκόψονται οἱ ἀναστατοῦντες ὑμᾶς."
  tags: []
"Ga5,13":
  text: "Ὑμεῖς γὰρ ἐπ᾽ ἐλευθερίᾳ ἐκλήθητε, ἀδελφοί· μόνον μὴ τὴν ἐλευθερίαν εἰς ἀφορμὴν τῇ σαρκί, ἀλλὰ διὰ τῆς ἀγάπης δουλεύετε ἀλλήλοις."
  tags: []
"Ga5,14":
  text: "ὁ γὰρ πᾶς νόμος ἐν ἑνὶ λόγῳ πληροῦται, ἐν τῷ, Ἀγαπήσεις τὸν πλησίον σου ὡς ἑαυτόν."
  tags: []
"Ga5,15":
  text: "εἰ δὲ ἀλλήλους δάκνετε καὶ κατεσθίετε, βλέπετε μὴ ὑπὸ ἀλλήλων ἀναλωθῆτε."
  tags: []
"Ga5,16":
  text: "Λέγω δέ, Πνεύματι περιπατεῖτε, καὶ ἐπιθυμίαν σαρκὸς οὐ μὴ τελέσητε."
  tags: []
"Ga5,17":
  text: "ἡ γὰρ σὰρξ ἐπιθυμεῖ κατὰ τοῦ Πνεύματος, τὸ δὲ Πνεῦμα κατὰ τῆς σαρκός· ταῦτα δὲ ἀντίκειται ἀλλήλοις, ἵνα μὴ ἃ ἂν θέλητε, ταῦτα ποιῆτε."
  tags: []
"Ga5,18":
  text: "εἰ δὲ Πνεύματι ἄγεσθε, οὐκ ἐστὲ ὑπὸ νόμον."
  tags: []
"Ga5,19":
  text: "φανερὰ δέ ἐστι τὰ ἔργα τῆς σαρκός, ἅτινά ἐστι μοιχεία, πορνεία, ἀκαθαρσία, ἀσέλγεια,"
  tags: []
"Ga5,20":
  text: "εἰδωλολατρεία, φαρμακεία, ἔχθραι, ἔρεις, ζῆλοι, θυμοί, ἐριθεῖαι, διχοστασίαι, αἱρέσεις,"
  tags: []
"Ga5,21":
  text: "φθόνοι, φόνοι, μέθαι, κῶμοι, καὶ τὰ ὅμοια τούτοις· ἃ προλέγω ὑμῖν, καθὼς καὶ προεῖπον, ὅτι οἱ τὰ τοιαῦτα πράσσοντες βασιλείαν Θεοῦ οὐ κληρονομήσουσιν."
  tags: []
"Ga5,22":
  text: "ὁ δὲ καρπὸς τοῦ Πνεύματός ἐστιν ἀγάπη, χαρά, εἰρήνη, μακροθυμία, χρηστότης, ἀγαθωσύνη, πίστις,"
  tags: []
"Ga5,23":
  text: "πρᾳότης, ἐγκράτεια· κατὰ τῶν τοιούτων οὐκ ἔστι νόμος."
  tags: []
"Ga5,24":
  text: "οἱ δὲ τοῦ Χριστοῦ, τὴν σάρκα ἐσταύρωσαν σὺν τοῖς παθήμασι καὶ ταῖς ἐπιθυμίαις."
  tags: []
"Ga5,25":
  text: "Εἰ ζῶμεν Πνεύματι, Πνεύματι καὶ στοιχῶμεν."
  tags: []
"Ga5,26":
  text: "μὴ γινώμεθα κενόδοξοι, ἀλλήλους προκαλούμενοι, ἀλλήλοις φθονοῦντες."
  tags: []
