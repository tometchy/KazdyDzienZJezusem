"Rz3,1":
  text: "Τί οὖν τὸ περισσὸν τοῦ Ἰουδαίου, ἢ τίς ἡ ὠφέλεια τῆς περιτομῆς;"
  tags: []
"Rz3,2":
  text: "πολὺ κατὰ πάντα τρόπον· πρῶτον μὲν γὰρ ὅτι ἐπιστεύθησαν τὰ λόγια τοῦ Θεοῦ."
  tags: []
"Rz3,3":
  text: "τί γὰρ εἰ ἠπίστησάν τινες; μὴ ἡ ἀπιστία αὐτῶν τὴν πίστιν τοῦ Θεοῦ καταργήσει;"
  tags: []
"Rz3,4":
  text: "μὴ γένοιτο· γινέσθω δὲ ὁ Θεὸς ἀληθής, πᾶς δὲ ἄνθρωπος ψεύστης, καθὼς γέγραπται, Ὅπως ἂν δικαιωθῇς ἐν τοῖς λόγοις σου, καὶ νικήσῃς ἐν τῷ κρίνεσθαί σε."
  tags: []
"Rz3,5":
  text: "εἰ δὲ ἡ ἀδικία ἡμῶν Θεοῦ δικαιοσύνην συνίστησι, τί ἐροῦμεν; μὴ ἄδικος ὁ Θεὸς ὁ ἐπιφέρων τὴν ὀργήν (κατὰ ἄνθρωπον λέγω);"
  tags: []
"Rz3,6":
  text: "μὴ γένοιτο· ἐπεὶ πῶς κρινεῖ ὁ Θεὸς τὸν κόσμον;"
  tags: []
"Rz3,7":
  text: "εἰ γὰρ ἡ ἀλήθεια τοῦ Θεοῦ ἐν τῷ ἐμῷ ψεύσματι ἐπερίσσευσεν εἰς τὴν δόξαν αὐτοῦ, τί ἔτι κἀγὼ ὡς ἁμαρτωλὸς κρίνομαι;"
  tags: []
"Rz3,8":
  text: "καὶ μή (καθὼς βλασφημούμεθα, καὶ καθώς φασί τινες ἡμᾶς λέγειν ὅτι), Ποιήσωμεν τὰ κακὰ ἵνα ἔλθῃ τὰ ἀγαθά; ὧν τὸ κρίμα ἔνδικόν ἐστι."
  tags: []
"Rz3,9":
  text: "Τί οὖν; προεχόμεθα; οὐ πάντως· προῃτιασάμεθα γὰρ Ἰουδαίους τε καὶ Ἕλληνας πάντας ὑφ᾽ ἁμαρτίαν εἶναι,"
  tags: []
"Rz3,10":
  text: "καθὼς γέγραπται ὅτι Οὐκ ἔστι δίκαιος οὐδὲ εἷς·"
  tags: []
"Rz3,11":
  text: "οὐκ ἔστιν ὁ συνιῶν, οὐκ ἔστιν ὁ ἐκζητῶν τὸν Θεόν·"
  tags: []
"Rz3,12":
  text: "πάντες ἐξέκλιναν, ἅμα ἠχρειώθησαν· οὐκ ἔστι ποιῶν χρηστότητα, οὐκ ἔστιν ἕως ἑνός·"
  tags: []
"Rz3,13":
  text: "τάφος ἀνεῳγμένος ὁ λάρυγξ αὐτῶν, ταῖς γλώσσαις αὐτῶν ἐδολιοῦσαν· ἰὸς ἀσπίδων ὑπὸ τὰ χείλη αὐτῶν·"
  tags: []
"Rz3,14":
  text: "ὧν τὸ στόμα ἀρᾶς καὶ πικρίας γέμει·"
  tags: []
"Rz3,15":
  text: "ὀξεῖς οἱ πόδες αὐτῶν ἐκχέαι αἷμα·"
  tags: []
"Rz3,16":
  text: "σύντριμμα καὶ ταλαιπωρία ἐν ταῖς ὁδοῖς αὐτῶν,"
  tags: []
"Rz3,17":
  text: "καὶ ὁδὸν εἰρήνης οὐκ ἔγνωσαν·"
  tags: []
"Rz3,18":
  text: "οὐκ ἔστι φόβος Θεοῦ ἀπέναντι τῶν ὀφθαλμῶν αὐτῶν."
  tags: []
"Rz3,19":
  text: "Οἴδαμεν δὲ ὅτι ὅσα ὁ νόμος λέγει, τοῖς ἐν τῷ νόμῳ λαλεῖ, ἵνα πᾶν στόμα φραγῇ, καὶ ὑπόδικος γένηται πᾶς ὁ κόσμος τῷ Θεῷ·"
  tags: []
"Rz3,20":
  text: "διότι ἐξ ἔργων νόμου οὐ δικαιωθήσεται πᾶσα σὰρξ ἐνώπιον αὐτοῦ· διὰ γὰρ νόμου ἐπίγνωσις ἁμαρτίας."
  tags: []
"Rz3,21":
  text: "νυνὶ δὲ χωρὶς νόμου δικαιοσύνη Θεοῦ πεφανέρωται, μαρτυρουμένη ὑπὸ τοῦ νόμου καὶ τῶν προφητῶν·"
  tags: []
"Rz3,22":
  text: "δικαιοσύνη δὲ Θεοῦ διὰ πίστεως Ἰησοῦ Χριστοῦ εἰς πάντας καὶ ἐπὶ πάντας τοὺς πιστεύοντας· οὐ γάρ ἐστι διαστολή·"
  tags: []
"Rz3,23":
  text: "πάντες γὰρ ἥμαρτον καὶ ὑστεροῦνται τῆς δόξης τοῦ Θεοῦ,"
  tags: []
"Rz3,24":
  text: "δικαιούμενοι δωρεὰν τῇ αὐτοῦ χάριτι διὰ τῆς ἀπολυτρώσεως τῆς ἐν Χριστῷ Ἰησοῦ·"
  tags: []
"Rz3,25":
  text: "ὃν προέθετο ὁ Θεὸς ἱλαστήριον, διὰ τῆς πίστεως, ἐν τῷ αὐτοῦ αἵματι, εἰς ἔνδειξιν τῆς δικαιοσύνης αὐτοῦ, διὰ τὴν πάρεσιν τῶν προγεγονότων ἁμαρτημάτων, ἐν τῇ ἀνοχῇ τοῦ Θεοῦ·"
  tags: []
"Rz3,26":
  text: "πρὸς ἔνδειξιν τῆς δικαιοσύνης αὐτοῦ ἐν τῷ νῦν καιρῷ, εἰς τὸ εἶναι αὐτὸν δίκαιον καὶ δικαιοῦντα τὸν ἐκ πίστεως Ἰησοῦ."
  tags: []
"Rz3,27":
  text: "ποῦ οὖν ἡ καύχησις; ἐξεκλείσθη. διὰ ποίου νόμου; τῶν ἔργων; οὐχί, ἀλλὰ διὰ νόμου πίστεως."
  tags: []
"Rz3,28":
  text: "λογιζόμεθα οὖν πίστει δικαιοῦσθαι ἄνθρωπον, χωρὶς ἔργων νόμου."
  tags: []
"Rz3,29":
  text: "ἢ Ἰουδαίων ὁ Θεὸς μόνον; οὐχὶ δὲ καὶ ἐθνῶν; ναὶ καὶ ἐθνῶν·"
  tags: []
"Rz3,30":
  text: "ἐπείπερ εἷς ὁ Θεός, ὃς δικαιώσει περιτομὴν ἐκ πίστεως, καὶ ἀκροβυστίαν διὰ τῆς πίστεως."
  tags: []
"Rz3,31":
  text: "νόμον οὖν καταργοῦμεν διὰ τῆς πίστεως; μὴ γένοιτο· ἀλλὰ νόμον ἱστῶμεν."
  tags: []
