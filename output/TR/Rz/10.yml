"Rz10,1":
  text: "Ἀδελφοί, ἡ μὲν εὐδοκία τῆς ἐμῆς καρδίας καὶ ἡ δέησις ἡ πρὸς τὸν Θεὸν ὑπὲρ τοῦ Ἰσραήλ ἐστιν εἰς σωτηρίαν."
  tags: []
"Rz10,2":
  text: "μαρτυρῶ γὰρ αὐτοῖς ὅτι ζῆλον Θεοῦ ἔχουσιν, ἀλλ᾽ οὐ κατ᾽ ἐπίγνωσιν."
  tags: []
"Rz10,3":
  text: "ἀγνοοῦντες γὰρ τὴν τοῦ Θεοῦ δικαιοσύνην, καὶ τὴν ἰδίαν δικαιοσύνην ζητοῦντες στῆσαι, τῇ δικαιοσύνῃ τοῦ Θεοῦ οὐχ ὑπετάγησαν."
  tags: []
"Rz10,4":
  text: "τέλος γὰρ νόμου Χριστὸς εἰς δικαιοσύνην παντὶ τῷ πιστεύοντι."
  tags: []
"Rz10,5":
  text: "Μωσῆς γὰρ γράφει τὴν δικαιοσύνην τὴν ἐκ τοῦ νόμου, ὅτι ὁ ποιήσας αὐτὰ ἄνθρωπος ζήσεται ἐν αὐτοῖς."
  tags: []
"Rz10,6":
  text: "ἡ δὲ ἐκ πίστεως δικαιοσύνη οὕτω λέγει, Μὴ εἴπῃς ἐν τῇ καρδίᾳ σου, Τίς ἀναβήσεται εἰς τὸν οὐρανόν; (τοῦτ᾽ ἔστι Χριστὸν καταγαγεῖν·)"
  tags: []
"Rz10,7":
  text: "ἤ, Τίς καταβήσεται εἰς τὴν ἄβυσσον; (τοῦτ᾽ ἔστι Χριστὸν ἐκ νεκρῶν ἀναγαγεῖν.)"
  tags: []
"Rz10,8":
  text: "ἀλλὰ τί λέγει; Ἐγγύς σου τὸ ῥῆμά ἐστιν, ἐν τῷ στόματί σου καὶ ἐν τῇ καρδίᾳ σου· τοῦτ᾽ ἔστι τὸ ῥῆμα τῆς πίστεως ὃ κηρύσσομεν·"
  tags: []
"Rz10,9":
  text: "ὅτι ἐὰν ὁμολογήσῃς ἐν τῷ στόματί σου Κύριον Ἰησοῦν, καὶ πιστεύσῃς ἐν τῇ καρδίᾳ σου ὅτι ὁ Θεὸς αὐτὸν ἤγειρεν ἐκ νεκρῶν, σωθήσῃ·"
  tags: []
"Rz10,10":
  text: "καρδίᾳ γὰρ πιστεύεται εἰς δικαιοσύνην, στόματι δὲ ὁμολογεῖται εἰς σωτηρίαν."
  tags: []
"Rz10,11":
  text: "λέγει γὰρ ἡ γραφή, Πᾶς ὁ πιστεύων ἐπ᾽ αὐτῷ οὐ καταισχυνθήσεται."
  tags: []
"Rz10,12":
  text: "οὐ γάρ ἐστι διαστολὴ Ἰουδαίου τε καὶ Ἕλληνος· ὁ γὰρ αὐτὸς Κύριος πάντων, πλουτῶν εἰς πάντας τοὺς ἐπικαλουμένους αὐτόν."
  tags: []
"Rz10,13":
  text: "πᾶς γὰρ ὃς ἂν ἐπικαλέσηται τὸ ὄνομα Κυρίου σωθήσεται."
  tags: []
"Rz10,14":
  text: "πῶς οὖν ἐπικαλέσονται εἰς ὃν οὐκ ἐπίστευσαν; πῶς δὲ πιστεύσουσιν οὗ οὐκ ἤκουσαν; πῶς δὲ ἀκούσουσι χωρὶς κηρύσσοντος;"
  tags: []
"Rz10,15":
  text: "πῶς δὲ κηρύξουσιν ἐὰν μὴ ἀποσταλῶσι; καθὼς γέγραπται, Ὡς ὡραῖοι οἱ πόδες τῶν εὐαγγελιζομένων εἰρήνην, τῶν εὐαγγελιζομένων τὰ ἀγαθά."
  tags: []
"Rz10,16":
  text: "Ἀλλ᾽ οὐ πάντες ὑπήκουσαν τῷ εὐαγγελίῳ. Ἠσαΐας γὰρ λέγει, Κύριε, τίς ἐπίστευσε τῇ ἀκοῇ ἡμῶν;"
  tags: []
"Rz10,17":
  text: "ἄρα ἡ πίστις ἐξ ἀκοῆς, ἡ δὲ ἀκοὴ διὰ ῥήματος Θεοῦ."
  tags: []
"Rz10,18":
  text: "ἀλλὰ λέγω, Μὴ οὐκ ἤκουσαν; μενοῦνγε· εἰς πᾶσαν τὴν γῆν ἐξῆλθεν ὁ φθόγγος αὐτῶν, καὶ εἰς τὰ πέρατα τῆς οἰκουμένης τὰ ῥήματα αὐτῶν."
  tags: []
"Rz10,19":
  text: "ἀλλὰ λέγω, Μὴ οὐκ ἔγνω Ἰσραήλ; πρῶτος Μωσῆς λέγει, Ἐγὼ παραζηλώσω ὑμᾶς ἐπ᾽ οὐκ ἔθνει, ἐπὶ ἔθνει ἀσυνέτῳ παροργιῶ ὑμᾶς."
  tags: []
"Rz10,20":
  text: "Ἠσαΐας δὲ ἀποτολμᾷ καὶ λέγει, Εὑρέθην τοῖς ἐμὲ μὴ ζητοῦσιν, ἐμφανὴς ἐγενόμην τοῖς ἐμὲ μὴ ἐπερωτῶσι."
  tags: []
"Rz10,21":
  text: "πρὸς δὲ τὸν Ἰσραὴλ λέγει, Ὅλην τὴν ἡμέραν ἐξεπέτασα τὰς χεῖράς μου πρὸς λαὸν ἀπειθοῦντα καὶ ἀντιλέγοντα."
  tags: []
