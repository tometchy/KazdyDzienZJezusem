"Lb10,1": "And the LORD spake unto Moses, saying,"
"Lb10,2": "Make thee two trumpets of silver; of a whole piece shalt thou make them: that thou mayest use them for the calling of the assembly, and for the journeying of the camps."
"Lb10,3": "And when they shall blow with them, all the assembly shall assemble themselves to thee at the door of the tabernacle of the congregation."
"Lb10,4": "And if they blow [but] with one [trumpet], then the princes, [which are] heads of the thousands of Israel, shall gather themselves unto thee."
"Lb10,5": "When ye blow an alarm, then the camps that lie on the east parts shall go forward."
"Lb10,6": "When ye blow an alarm the second time, then the camps that lie on the south side shall take their journey: they shall blow an alarm for their journeys."
"Lb10,7": "But when the congregation is to be gathered together, ye shall blow, but ye shall not sound an alarm."
"Lb10,8": "And the sons of Aaron, the priests, shall blow with the trumpets; and they shall be to you for an ordinance for ever throughout your generations."
"Lb10,9": "And if ye go to war in your land against the enemy that oppresseth you, then ye shall blow an alarm with the trumpets; and ye shall be remembered before the LORD your God, and ye shall be saved from your enemies."
"Lb10,10": "Also in the day of your gladness, and in your solemn days, and in the beginnings of your months, ye shall blow with the trumpets over your burnt offerings, and over the sacrifices of your peace offerings; that they may be to you for a memorial before your God: I [am] the LORD your God."
"Lb10,11": "And it came to pass on the twentieth [day] of the second month, in the second year, that the cloud was taken up from off the tabernacle of the testimony."
"Lb10,12": "And the children of Israel took their journeys out of the wilderness of Sinai; and the cloud rested in the wilderness of Paran."
"Lb10,13": "And they first took their journey according to the commandment of the LORD by the hand of Moses."
"Lb10,14": "In the first [place] went the standard of the camp of the children of Judah according to their armies: and over his host [was] Nahshon the son of Amminadab."
"Lb10,15": "And over the host of the tribe of the children of Issachar [was] Nethaneel the son of Zuar."
"Lb10,16": "And over the host of the tribe of the children of Zebulun [was] Eliab the son of Helon."
"Lb10,17": "And the tabernacle was taken down; and the sons of Gershon and the sons of Merari set forward, bearing the tabernacle."
"Lb10,18": "And the standard of the camp of Reuben set forward according to their armies: and over his host [was] Elizur the son of Shedeur."
"Lb10,19": "And over the host of the tribe of the children of Simeon [was] Shelumiel the son of Zurishaddai."
"Lb10,20": "And over the host of the tribe of the children of Gad [was] Eliasaph the son of Deuel."
"Lb10,21": "And the Kohathites set forward, bearing the sanctuary: and [the other] did set up the tabernacle against they came."
"Lb10,22": "And the standard of the camp of the children of Ephraim set forward according to their armies: and over his host [was] Elishama the son of Ammihud."
"Lb10,23": "And over the host of the tribe of the children of Manasseh [was] Gamaliel the son of Pedahzur."
"Lb10,24": "And over the host of the tribe of the children of Benjamin [was] Abidan the son of Gideoni."
"Lb10,25": "And the standard of the camp of the children of Dan set forward, [which was] the rereward of all the camps throughout their hosts: and over his host [was] Ahiezer the son of Ammishaddai."
"Lb10,26": "And over the host of the tribe of the children of Asher [was] Pagiel the son of Ocran."
"Lb10,27": "And over the host of the tribe of the children of Naphtali [was] Ahira the son of Enan."
"Lb10,28": "Thus [were] the journeyings of the children of Israel according to their armies, when they set forward."
"Lb10,29": "And Moses said unto Hobab, the son of Raguel the Midianite, Moses' father in law, We are journeying unto the place of which the LORD said, I will give it you: come thou with us, and we will do thee good: for the LORD hath spoken good concerning Israel."
"Lb10,30": "And he said unto him, I will not go; but I will depart to mine own land, and to my kindred."
"Lb10,31": "And he said, Leave us not, I pray thee; forasmuch as thou knowest how we are to encamp in the wilderness, and thou mayest be to us instead of eyes."
"Lb10,32": "And it shall be, if thou go with us, yea, it shall be, that what goodness the LORD shall do unto us, the same will we do unto thee."
"Lb10,33": "And they departed from the mount of the LORD three days' journey: and the ark of the covenant of the LORD went before them in the three days' journey, to search out a resting place for them."
"Lb10,34": "And the cloud of the LORD [was] upon them by day, when they went out of the camp."
"Lb10,35": "And it came to pass, when the ark set forward, that Moses said, Rise up, LORD, and let thine enemies be scattered; and let them that hate thee flee before thee."
"Lb10,36": "And when it rested, he said, Return, O LORD, unto the many thousands of Israel."
