"Lb7,84":
  text: "This [was] the dedication of the altar, in the day when it was anointed, by the princes of Israel: twelve chargers of silver, twelve silver bowls, twelve spoons of gold:"
  tags: []
"Lb7,85":
  text: "Each charger of silver [weighing] an hundred and thirty [shekels], each bowl seventy: all the silver vessels [weighed] two thousand and four hundred [shekels], after the shekel of the sanctuary:"
  tags: []
"Lb7,86":
  text: "The golden spoons [were] twelve, full of incense, [weighing] ten [shekels] apiece, after the shekel of the sanctuary: all the gold of the spoons [was] an hundred and twenty [shekels]."
  tags: []
"Lb7,87":
  text: "All the oxen for the burnt offering [were] twelve bullocks, the rams twelve, the lambs of the first year twelve, with their meat offering: and the kids of the goats for sin offering twelve."
  tags: []
"Lb7,88":
  text: "And all the oxen for the sacrifice of the peace offerings [were] twenty and four bullocks, the rams sixty, the he goats sixty, the lambs of the first year sixty. This [was] the dedication of the altar, after that it was anointed."
  tags: []
"Lb7,89":
  text: "And when Moses was gone into the tabernacle of the congregation to speak with him, then he heard the voice of one speaking unto him from off the mercy seat that [was] upon the ark of testimony, from between the two cherubims: and he spake unto him."
  tags: []
