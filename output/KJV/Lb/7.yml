"Lb7,1":
  text: "And it came to pass on the day that Moses had fully set up the tabernacle, and had anointed it, and sanctified it, and all the instruments thereof, both the altar and all the vessels thereof, and had anointed them, and sanctified them;"
  tags: []
"Lb7,2":
  text: "That the princes of Israel, heads of the house of their fathers, who [were] the princes of the tribes, and were over them that were numbered, offered:"
  tags: []
"Lb7,3":
  text: "And they brought their offering before the LORD, six covered wagons, and twelve oxen; a wagon for two of the princes, and for each one an ox: and they brought them before the tabernacle."
  tags: []
"Lb7,4":
  text: "And the LORD spake unto Moses, saying,"
  tags: []
"Lb7,5":
  text: "Take [it] of them, that they may be to do the service of the tabernacle of the congregation; and thou shalt give them unto the Levites, to every man according to his service."
  tags: []
"Lb7,6":
  text: "And Moses took the wagons and the oxen, and gave them unto the Levites."
  tags: []
"Lb7,7":
  text: "Two wagons and four oxen he gave unto the sons of Gershon, according to their service:"
  tags: []
"Lb7,8":
  text: "And four wagons and eight oxen he gave unto the sons of Merari, according unto their service, under the hand of Ithamar the son of Aaron the priest."
  tags: []
"Lb7,9":
  text: "But unto the sons of Kohath he gave none: because the service of the sanctuary belonging unto them [was that] they should bear upon their shoulders."
  tags: []
"Lb7,10":
  text: "And the princes offered for dedicating of the altar in the day that it was anointed, even the princes offered their offering before the altar."
  tags: []
"Lb7,11":
  text: "And the LORD said unto Moses, They shall offer their offering, each prince on his day, for the dedicating of the altar."
  tags: []
"Lb7,12":
  text: "And he that offered his offering the first day was Nahshon the son of Amminadab, of the tribe of Judah:"
  tags: []
"Lb7,13":
  text: "And his offering [was] one silver charger, the weight thereof [was] an hundred and thirty [shekels], one silver bowl of seventy shekels, after the shekel of the sanctuary; both of them [were] full of fine flour mingled with oil for a meat offering:"
  tags: []
"Lb7,14":
  text: "One spoon of ten [shekels] of gold, full of incense:"
  tags: []
"Lb7,15":
  text: "One young bullock, one ram, one lamb of the first year, for a burnt offering:"
  tags: []
"Lb7,16":
  text: "One kid of the goats for a sin offering:"
  tags: []
"Lb7,17":
  text: "And for a sacrifice of peace offerings, two oxen, five rams, five he goats, five lambs of the first year: this [was] the offering of Nahshon the son of Amminadab."
  tags: []
"Lb7,18":
  text: "On the second day Nethaneel the son of Zuar, prince of Issachar, did offer:"
  tags: []
"Lb7,19":
