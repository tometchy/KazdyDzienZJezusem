"Joz21,1":
  text: "Then came near the heads of the fathers of the Levites unto Eleazar the priest, and unto Joshua the son of Nun, and unto the heads of the fathers of the tribes of the children of Israel;"
  tags: []
"Joz21,2":
  text: "And they spake unto them at Shiloh in the land of Canaan, saying, The LORD commanded by the hand of Moses to give us cities to dwell in, with the suburbs thereof for our cattle."
  tags: []
"Joz21,3":
  text: "And the children of Israel gave unto the Levites out of their inheritance, at the commandment of the LORD, these cities and their suburbs."
  tags: []
"Joz21,4":
  text: "And the lot came out for the families of the Kohathites: and the children of Aaron the priest, [which were] of the Levites, had by lot out of the tribe of Judah, and out of the tribe of Simeon, and out of the tribe of Benjamin, thirteen cities."
  tags: []
"Joz21,5":
  text: "And the rest of the children of Kohath [had] by lot out of the families of the tribe of Ephraim, and out of the tribe of Dan, and out of the half tribe of Manasseh, ten cities."
  tags: []
"Joz21,6":
  text: "And the children of Gershon [had] by lot out of the families of the tribe of Issachar, and out of the tribe of Asher, and out of the tribe of Naphtali, and out of the half tribe of Manasseh in Bashan, thirteen cities."
  tags: []
"Joz21,7":
  text: "The children of Merari by their families [had] out of the tribe of Reuben, and out of the tribe of Gad, and out of the tribe of Zebulun, twelve cities."
  tags: []
"Joz21,8":
  text: "And the children of Israel gave by lot unto the Levites these cities with their suburbs, as the LORD commanded by the hand of Moses."
  tags: []
"Joz21,9":
  text: "And they gave out of the tribe of the children of Judah, and out of the tribe of the children of Simeon, these cities which are [here] mentioned by name,"
  tags: []
"Joz21,10":
  text: "Which the children of Aaron, [being] of the families of the Kohathites, [who were] of the children of Levi, had: for their's was the first lot."
  tags: []
"Joz21,11":
  text: "And they gave them the city of Arba the father of Anak, which [city is] Hebron, in the hill [country] of Judah, with the suburbs thereof round about it."
  tags: []
"Joz21,12":
  text: "But the fields of the city, and the villages thereof, gave they to Caleb the son of Jephunneh for his possession."
  tags: []
"Joz21,13":
  text: "Thus they gave to the children of Aaron the priest Hebron with her suburbs, [to be] a city of refuge for the slayer; and Libnah with her suburbs,"
  tags: []
"Joz21,14":
  text: "And Jattir with her suburbs, and Eshtemoa with her suburbs,"
  tags: []
"Joz21,15":
  text: "And Holon with her suburbs, and Debir with her suburbs,"
  tags: []
"Joz21,16":
  text: "And Ain with her suburbs, and Juttah with her suburbs, [and] Beth-shemesh with her suburbs; nine cities out of those two tribes."
  tags: []
"Joz21,17":
  text: "And out of the tribe of Benjamin, Gibeon with her suburbs, Geba with her suburbs,"
  tags: []
"Joz21,18":
  text: "Anathoth with her suburbs, and Almon with her suburbs; four cities."
  tags: []
"Joz21,19":
  text: "All the cities of the children of Aaron, the priests, [were] thirteen cities with their suburbs."
  tags: []
"Joz21,20":
  text: "And the families of the children of Kohath, the Levites which remained of the children of Kohath, even they had the cities of their lot out of the tribe of Ephraim."
  tags: []
"Joz21,21":
  text: "For they gave them Shechem with her suburbs in mount Ephraim, [to be] a city of refuge for the slayer; and Gezer with her suburbs,"
  tags: []
"Joz21,22":
  text: "And Kibzaim with her suburbs, and Beth-horon with her suburbs; four cities."
  tags: []
"Joz21,23":
  text: "And out of the tribe of Dan, Eltekeh with her suburbs, Gibbethon with her suburbs,"
  tags: []
"Joz21,24":
  text: "Aijalon with her suburbs, Gath-rimmon with her suburbs; four cities."
  tags: []
"Joz21,25":
  text: "And out of the half tribe of Manasseh, Tanach with her suburbs, and Gath-rimmon with her suburbs; two cities."
  tags: []
"Joz21,26":
  text: "All the cities [were] ten with their suburbs for the families of the children of Kohath that remained."
  tags: []
"Joz21,27":
  text: "And unto the children of Gershon, of the families of the Levites, out of the [other] half tribe of Manasseh [they gave] Golan in Bashan with her suburbs, [to be] a city of refuge for the slayer; and Beesh-terah with her suburbs; two cities."
  tags: []
"Joz21,28":
  text: "And out of the tribe of Issachar, Kishon with her suburbs, Dabareh with her suburbs,"
  tags: []
"Joz21,29":
  text: "Jarmuth with her suburbs, En-gannim with her suburbs; four cities."
  tags: []
"Joz21,30":
  text: "And out of the tribe of Asher, Mishal with her suburbs, Abdon with her suburbs,"
  tags: []
"Joz21,31":
  text: "Helkath with her suburbs, and Rehob with her suburbs; four cities."
  tags: []
"Joz21,32":
  text: "And out of the tribe of Naphtali, Kedesh in Galilee with her suburbs, [to be] a city of refuge for the slayer; and Hammoth-dor with her suburbs, and Kartan with her suburbs; three cities."
  tags: []
"Joz21,33":
  text: "All the cities of the Gershonites according to their families [were] thirteen cities with their suburbs."
  tags: []
"Joz21,34":
  text: "And unto the families of the children of Merari, the rest of the Levites, out of the tribe of Zebulun, Jokneam with her suburbs, and Kartah with her suburbs,"
  tags: []
"Joz21,35":
  text: "Dimnah with her suburbs, Nahalal with her suburbs; four cities."
  tags: []
"Joz21,36":
  text: "And out of the tribe of Reuben, Bezer with her suburbs, and Jahazah with her suburbs,"
  tags: []
"Joz21,37":
  text: "Kedemoth with her suburbs, and Mephaath with her suburbs; four cities."
  tags: []
"Joz21,38":
  text: "And out of the tribe of Gad, Ramoth in Gilead with her suburbs, [to be] a city of refuge for the slayer; and Mahanaim with her suburbs,"
  tags: []
"Joz21,39":
  text: "Heshbon with her suburbs, Jazer with her suburbs; four cities in all."
  tags: []
"Joz21,40":
  text: "So all the cities for the children of Merari by their families, which were remaining of the families of the Levites, were [by] their lot twelve cities."
  tags: []
"Joz21,41":
  text: "All the cities of the Levites within the possession of the children of Israel [were] forty and eight cities with their suburbs."
  tags: []
"Joz21,42":
  text: "These cities were every one with their suburbs round about them: thus [were] all these cities."
  tags: []
"Joz21,43":
  text: "And the LORD gave unto Israel all the land which he sware to give unto their fathers; and they possessed it, and dwelt therein."
  tags: []
"Joz21,44":
  text: "And the LORD gave them rest round about, according to all that he sware unto their fathers: and there stood not a man of all their enemies before them; the LORD delivered all their enemies into their hand."
  tags: []
"Joz21,45":
  text: "There failed not ought of any good thing which the LORD had spoken unto the house of Israel; all came to pass."
  tags: []
