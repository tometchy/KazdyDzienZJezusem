"Ps7,1": "O LORD my God, in thee do I put my trust: save me from all them that persecute me, and deliver me:"
"Ps7,2": "Lest he tear my soul like a lion, rending [it] in pieces, while [there is] none to deliver."
"Ps7,3": "O LORD my God, if I have done this; if there be iniquity in my hands;"
"Ps7,4": "If I have rewarded evil unto him that was at peace with me; (yea, I have delivered him that without cause is mine enemy:)"
"Ps7,5": "Let the enemy persecute my soul, and take [it]; yea, let him tread down my life upon the earth, and lay mine honour in the dust. Selah."
"Ps7,6": "Arise, O LORD, in thine anger, lift up thyself because of the rage of mine enemies: and awake for me [to] the judgment [that] thou hast commanded."
"Ps7,7": "So shall the congregation of the people compass thee about: for their sakes therefore return thou on high."
"Ps7,8": "The LORD shall judge the people: judge me, O LORD, according to my righteousness, and according to mine integrity [that is] in me."
"Ps7,9": "Oh let the wickedness of the wicked come to an end; but establish the just: for the righteous God trieth the hearts and reins."
"Ps7,10": "My defence [is] of God, which saveth the upright in heart."
"Ps7,11": "God judgeth the righteous, and God is angry [with the wicked] every day."
"Ps7,12": "If he turn not, he will whet his sword; he hath bent his bow, and made it ready."
"Ps7,13": "He hath also prepared for him the instruments of death; he ordaineth his arrows against the persecutors."
"Ps7,14": "Behold, he travaileth with iniquity, and hath conceived mischief, and brought forth falsehood."
"Ps7,15": "He made a pit, and digged it, and is fallen into the ditch [which] he made."
"Ps7,16": "His mischief shall return upon his own head, and his violent dealing shall come down upon his own pate."
"Ps7,17": "I will praise the LORD according to his righteousness: and will sing praise to the name of the LORD most high."
