"Ps100,1": "Make a joyful noise unto the LORD, all ye lands."
"Ps100,2": "Serve the LORD with gladness: come before his presence with singing."
"Ps100,3": "Know ye that the LORD he [is] God: [it is] he [that] hath made us, and not we ourselves; [we are] his people, and the sheep of his pasture."
"Ps100,4": "Enter into his gates with thanksgiving, [and] into his courts with praise: be thankful unto him, [and] bless his name."
"Ps100,5": "For the LORD [is] good; his mercy [is] everlasting; and his truth [endureth] to all generations."
