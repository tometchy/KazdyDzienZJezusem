"Ps47,1": "O clap your hands, all ye people; shout unto God with the voice of triumph."
"Ps47,2": "For the LORD most high [is] terrible; [he is] a great King over all the earth."
"Ps47,3": "He shall subdue the people under us, and the nations under our feet."
"Ps47,4": "He shall choose our inheritance for us, the excellency of Jacob whom he loved. Selah."
"Ps47,5": "God is gone up with a shout, the LORD with the sound of a trumpet."
"Ps47,6": "Sing praises to God, sing praises: sing praises unto our King, sing praises."
"Ps47,7": "For God [is] the King of all the earth: sing ye praises with understanding."
"Ps47,8": "God reigneth over the heathen: God sitteth upon the throne of his holiness."
"Ps47,9": "The princes of the people are gathered together, [even] the people of the God of Abraham: for the shields of the earth [belong] unto God: he is greatly exalted."
