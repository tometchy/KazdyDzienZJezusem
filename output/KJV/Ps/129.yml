"Ps129,1": "Many a time have they afflicted me from my youth, may Israel now say:"
"Ps129,2": "Many a time have they afflicted me from my youth: yet they have not prevailed against me."
"Ps129,3": "The plowers plowed upon my back: they made long their furrows."
"Ps129,4": "The LORD [is] righteous: he hath cut asunder the cords of the wicked."
"Ps129,5": "Let them all be confounded and turned back that hate Zion."
"Ps129,6": "Let them be as the grass [upon] the housetops, which withereth afore it groweth up:"
"Ps129,7": "Wherewith the mower filleth not his hand; nor he that bindeth sheaves his bosom."
"Ps129,8": "Neither do they which go by say, The blessing of the LORD [be] upon you: we bless you in the name of the LORD."
