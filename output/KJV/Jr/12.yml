"Jr12,1":
  text: "Righteous [art] thou, O LORD, when I plead with thee: yet let me talk with thee of [thy] judgments: Wherefore doth the way of the wicked prosper? [wherefore] are all they happy that deal very treacherously?"
  tags: []
"Jr12,2":
  text: "Thou hast planted them, yea, they have taken root: they grow, yea, they bring forth fruit: thou [art] near in their mouth, and far from their reins."
  tags: []
"Jr12,3":
  text: "But thou, O LORD, knowest me: thou hast seen me, and tried mine heart toward thee: pull them out like sheep for the slaughter, and prepare them for the day of slaughter."
  tags: []
"Jr12,4":
  text: "How long shall the land mourn, and the herbs of every field wither, for the wickedness of them that dwell therein? the beasts are consumed, and the birds; because they said, He shall not see our last end."
  tags: []
"Jr12,5":
  text: "If thou hast run with the footmen, and they have wearied thee, then how canst thou contend with horses? and [if] in the land of peace, [wherein] thou trustedst, [they wearied thee], then how wilt thou do in the swelling of Jordan?"
  tags: []
"Jr12,6":
  text: "For even thy brethren, and the house of thy father, even they have dealt treacherously with thee; yea, they have called a multitude after thee: believe them not, though they speak fair words unto thee."
  tags: []
"Jr12,7":
  text: "I have forsaken mine house, I have left mine heritage; I have given the dearly beloved of my soul into the hand of her enemies."
  tags: []
"Jr12,8":
  text: "Mine heritage is unto me as a lion in the forest; it crieth out against me: therefore have I hated it."
  tags: []
"Jr12,9":
  text: "Mine heritage [is] unto me [as] a speckled bird, the birds round about [are] against her; come ye, assemble all the beasts of the field, come to devour."
  tags: []
"Jr12,10":
  text: "Many pastors have destroyed my vineyard, they have trodden my portion under foot, they have made my pleasant portion a desolate wilderness."
  tags: []
"Jr12,11":
  text: "They have made it desolate, [and being] desolate it mourneth unto me; the whole land is made desolate, because no man layeth [it] to heart."
  tags: []
"Jr12,12":
  text: "The spoilers are come upon all high places through the wilderness: for the sword of the LORD shall devour from the [one] end of the land even to the [other] end of the land: no flesh shall have peace."
  tags: []
"Jr12,13":
  text: "They have sown wheat, but shall reap thorns: they have put themselves to pain, [but] shall not profit: and they shall be ashamed of your revenues because of the fierce anger of the LORD."
  tags: []
"Jr12,14":
  text: "Thus saith the LORD against all mine evil neighbours, that touch the inheritance which I have caused my people Israel to inherit; Behold, I will pluck them out of their land, and pluck out the house of Judah from among them."
  tags: []
"Jr12,15":
  text: "And it shall come to pass, after that I have plucked them out I will return, and have compassion on them, and will bring them again, every man to his heritage, and every man to his land."
  tags: []
"Jr12,16":
  text: "And it shall come to pass, if they will diligently learn the ways of my people, to swear by my name, The LORD liveth; as they taught my people to swear by Baal; then shall they be built in the midst of my people."
  tags: []
"Jr12,17":
  text: "But if they will not obey, I will utterly pluck up and destroy that nation, saith the LORD."
  tags: []
