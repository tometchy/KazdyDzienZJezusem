"Pwt32,1":
  text: "Give ear, O ye heavens, and I will speak; and hear, O earth, the words of my mouth."
  tags: []
"Pwt32,2":
  text: "My doctrine shall drop as the rain, my speech shall distil as the dew, as the small rain upon the tender herb, and as the showers upon the grass:"
  tags: []
"Pwt32,3":
  text: "Because I will publish the name of the LORD: ascribe ye greatness unto our God."
  tags: []
"Pwt32,4":
  text: "[He is] the Rock, his work [is] perfect: for all his ways [are] judgment: a God of truth and without iniquity, just and right [is] he."
  tags: []
"Pwt32,5":
  text: "They have corrupted themselves, their spot [is] not [the spot] of his children: [they are] a perverse and crooked generation."
  tags: []
"Pwt32,6":
  text: "Do ye thus requite the LORD, O foolish people and unwise? [is] not he thy father [that] hath bought thee? hath he not made thee, and established thee?"
  tags: []
"Pwt32,7":
  text: "Remember the days of old, consider the years of many generations: ask thy father, and he will shew thee; thy elders, and they will tell thee."
  tags: []
"Pwt32,8":
  text: "When the most High divided to the nations their inheritance, when he separated the sons of Adam, he set the bounds of the people according to the number of the children of Israel."
  tags: []
"Pwt32,9":
  text: "For the LORD'S portion [is] his people; Jacob [is] the lot of his inheritance."
  tags: []
"Pwt32,10":
  text: "He found him in a desert land, and in the waste howling wilderness; he led him about, he instructed him, he kept him as the apple of his eye."
  tags: []
"Pwt32,11":
  text: "As an eagle stirreth up her nest, fluttereth over her young, spreadeth abroad her wings, taketh them, beareth them on her wings:"
  tags: []
"Pwt32,12":
  text: "[So] the LORD alone did lead him, and [there was] no strange god with him."
  tags: []
"Pwt32,13":
  text: "He made him ride on the high places of the earth, that he might eat the increase of the fields; and he made him to suck honey out of the rock, and oil out of the flinty rock;"
  tags: []
"Pwt32,14":
  text: "Butter of kine, and milk of sheep, with fat of lambs, and rams of the breed of Bashan, and goats, with the fat of kidneys of wheat; and thou didst drink the pure blood of the grape."
  tags: []
"Pwt32,15":
  text: "But Jeshurun waxed fat, and kicked: thou art waxen fat, thou art grown thick, thou art covered [with fatness]; then he forsook God [which] made him, and lightly esteemed the Rock of his salvation."
  tags: []
"Pwt32,16":
  text: "They provoked him to jealousy with strange [gods], with abominations provoked they him to anger."
  tags: []
"Pwt32,17":
  text: "They sacrificed unto devils, not to God; to gods whom they knew not, to new [gods that] came newly up, whom your fathers feared not."
  tags: []
"Pwt32,18":
  text: "Of the Rock [that] begat thee thou art unmindful, and hast forgotten God that formed thee."
  tags: []
"Pwt32,19":
  text: "And when the LORD saw [it], he abhorred [them], because of the provoking of his sons, and of his daughters."
  tags: []
"Pwt32,20":
  text: "And he said, I will hide my face from them, I will see what their end [shall be]: for they [are] a very froward generation, children in whom [is] no faith."
  tags: []
"Pwt32,21":
  text: "They have moved me to jealousy with [that which is] not God; they have provoked me to anger with their vanities: and I will move them to jealousy with [those which are] not a people; I will provoke them to anger with a foolish nation."
  tags: []
"Pwt32,22":
  text: "For a fire is kindled in mine anger, and shall burn unto the lowest hell, and shall consume the earth with her increase, and set on fire the foundations of the mountains."
  tags: []
"Pwt32,23":
  text: "I will heap mischiefs upon them; I will spend mine arrows upon them."
  tags: []
"Pwt32,24":
  text: "[They shall be] burnt with hunger, and devoured with burning heat, and with bitter destruction: I will also send the teeth of beasts upon them, with the poison of serpents of the dust."
  tags: []
"Pwt32,25":
  text: "The sword without, and terror within, shall destroy both the young man and the virgin, the suckling [also] with the man of gray hairs."
  tags: []
"Pwt32,26":
  text: "I said, I would scatter them into corners, I would make the remembrance of them to cease from among men:"
  tags: []
"Pwt32,27":
  text: "Were it not that I feared the wrath of the enemy, lest their adversaries should behave themselves strangely, [and] lest they should say, Our hand [is] high, and the LORD hath not done all this."
  tags: []
"Pwt32,28":
  text: "For they [are] a nation void of counsel, neither [is there any] understanding in them."
  tags: []
"Pwt32,29":
  text: "O that they were wise, [that] they understood this, [that] they would consider their latter end!"
  tags: []
"Pwt32,30":
  text: "How should one chase a thousand, and two put ten thousand to flight, except their Rock had sold them, and the LORD had shut them up?"
  tags: []
"Pwt32,31":
  text: "For their rock [is] not as our Rock, even our enemies themselves [being] judges."
  tags: []
"Pwt32,32":
  text: "For their vine [is] of the vine of Sodom, and of the fields of Gomorrah: their grapes [are] grapes of gall, their clusters [are] bitter:"
  tags: []
"Pwt32,33":
  text: "Their wine [is] the poison of dragons, and the cruel venom of asps."
  tags: []
"Pwt32,34":
  text: "[Is] not this laid up in store with me, [and] sealed up among my treasures?"
  tags: []
"Pwt32,35":
  text: "To me [belongeth] vengeance, and recompence; their foot shall slide in [due] time: for the day of their calamity [is] at hand, and the things that shall come upon them make haste."
  tags: []
"Pwt32,36":
  text: "For the LORD shall judge his people, and repent himself for his servants, when he seeth that [their] power is gone, and [there is] none shut up, or left."
  tags: []
"Pwt32,37":
  text: "And he shall say, Where [are] their gods, [their] rock in whom they trusted,"
  tags: []
"Pwt32,38":
  text: "Which did eat the fat of their sacrifices, [and] drank the wine of their drink offerings? let them rise up and help you, [and] be your protection."
  tags: []
"Pwt32,39":
  text: "See now that I, [even] I, [am] he, and [there is] no god with me: I kill, and I make alive; I wound, and I heal: neither [is there any] that can deliver out of my hand."
  tags: []
"Pwt32,40":
  text: "For I lift up my hand to heaven, and say, I live for ever."
  tags: []
"Pwt32,41":
  text: "If I whet my glittering sword, and mine hand take hold on judgment; I will render vengeance to mine enemies, and will reward them that hate me."
  tags: []
"Pwt32,42":
  text: "I will make mine arrows drunk with blood, and my sword shall devour flesh; [and that] with the blood of the slain and of the captives, from the beginning of revenges upon the enemy."
  tags: []
"Pwt32,43":
  text: "Rejoice, O ye nations, [with] his people: for he will avenge the blood of his servants, and will render vengeance to his adversaries, and will be merciful unto his land, [and] to his people."
  tags: []
"Pwt32,44":
  text: "And Moses came and spake all the words of this song in the ears of the people, he, and Hoshea the son of Nun."
  tags: []
"Pwt32,45":
  text: "And Moses made an end of speaking all these words to all Israel:"
  tags: []
"Pwt32,46":
  text: "And he said unto them, Set your hearts unto all the words which I testify among you this day, which ye shall command your children to observe to do, all the words of this law."
  tags: []
"Pwt32,47":
  text: "For it [is] not a vain thing for you; because it [is] your life: and through this thing ye shall prolong [your] days in the land, whither ye go over Jordan to possess it."
  tags: []
"Pwt32,48":
  text: "And the LORD spake unto Moses that selfsame day, saying,"
  tags: []
"Pwt32,49":
  text: "Get thee up into this mountain Abarim, [unto] mount Nebo, which [is] in the land of Moab, that [is] over against Jericho; and behold the land of Canaan, which I give unto the children of Israel for a possession:"
  tags: []
"Pwt32,50":
  text: "And die in the mount whither thou goest up, and be gathered unto thy people; as Aaron thy brother died in mount Hor, and was gathered unto his people:"
  tags: []
"Pwt32,51":
  text: "Because ye trespassed against me among the children of Israel at the waters of Meribah-Kadesh, in the wilderness of Zin; because ye sanctified me not in the midst of the children of Israel."
  tags: []
"Pwt32,52":
  text: "Yet thou shalt see the land before [thee]; but thou shalt not go thither unto the land which I give the children of Israel."
  tags: []
