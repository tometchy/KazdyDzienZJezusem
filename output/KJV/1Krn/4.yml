"1Krn4,1":
  text: "The sons of Judah; Pharez, Hezron, and Carmi, and Hur, and Shobal."
  tags: []
"1Krn4,2":
  text: "And Reaiah the son of Shobal begat Jahath; and Jahath begat Ahumai, and Lahad. These [are] the families of the Zorathites."
  tags: []
"1Krn4,3":
  text: "And these [were of] the father of Etam; Jezreel, and Ishma, and Idbash: and the name of their sister [was] Hazelelponi:"
  tags: []
"1Krn4,4":
  text: "And Penuel the father of Gedor, and Ezer the father of Hushah. These [are] the sons of Hur, the firstborn of Ephratah, the father of Beth-lehem."
  tags: []
"1Krn4,5":
  text: "And Ashur the father of Tekoa had two wives, Helah and Naarah."
  tags: []
"1Krn4,6":
  text: "And Naarah bare him Ahuzam, and Hepher, and Temeni, and Haahashtari. These [were] the sons of Naarah."
  tags: []
"1Krn4,7":
  text: "And the sons of Helah [were], Zereth, and Jezoar, and Ethnan."
  tags: []
"1Krn4,8":
  text: "And Coz begat Anub, and Zobebah, and the families of Aharhel the son of Harum."
  tags: []
"1Krn4,9":
  text: "And Jabez was more honourable than his brethren: and his mother called his name Jabez, saying, Because I bare him with sorrow."
  tags: []
"1Krn4,10":
  text: "And Jabez called on the God of Israel, saying, Oh that thou wouldest bless me indeed, and enlarge my coast, and that thine hand might be with me, and that thou wouldest keep [me] from evil, that it may not grieve me! And God granted him that which he requested."
  tags: []
"1Krn4,11":
  text: "And Chelub the brother of Shuah begat Mehir, which [was] the father of Eshton."
  tags: []
"1Krn4,12":
  text: "And Eshton begat Beth-rapha, and Paseah, and Tehinnah the father of Ir-nahash. These [are] the men of Rechah."
  tags: []
"1Krn4,13":
  text: "And the sons of Kenaz; Othniel, and Seraiah: and the sons of Othniel; Hathath."
  tags: []
"1Krn4,14":
  text: "And Meonothai begat Ophrah: and Seraiah begat Joab, the father of the valley of Charashim; for they were craftsmen."
  tags: []
"1Krn4,15":
  text: "And the sons of Caleb the son of Jephunneh; Iru, Elah, and Naam: and the sons of Elah, even Kenaz."
  tags: []
"1Krn4,16":
  text: "And the sons of Jehaleleel; Ziph, and Ziphah, Tiria, and Asareel."
  tags: []
"1Krn4,17":
  text: "And the sons of Ezra [were], Jether, and Mered, and Epher, and Jalon: and she bare Miriam, and Shammai, and Ishbah the father of Eshtemoa."
  tags: []
"1Krn4,18":
  text: "And his wife Jehudijah bare Jered the father of Gedor, and Heber the father of Socho, and Jekuthiel the father of Zanoah. And these [are] the sons of Bithiah the daughter of Pharaoh, which Mered took."
  tags: []
"1Krn4,19":
  text: "And the sons of [his] wife Hodiah the sister of Naham, the father of Keilah the Garmite, and Eshtemoa the Maachathite."
  tags: []
"1Krn4,20":
  text: "And the sons of Shimon [were], Amnon, and Rinnah, Ben-hanan, and Tilon. And the sons of Ishi [were], Zoheth, and Ben-zoheth."
  tags: []
"1Krn4,21":
  text: "The sons of Shelah the son of Judah [were], Er the father of Lecah, and Laadah the father of Mareshah, and the families of the house of them that wrought fine linen, of the house of Ashbea,"
  tags: []
"1Krn4,22":
  text: "And Jokim, and the men of Chozeba, and Joash, and Saraph, who had the dominion in Moab, and Jashubi-lehem. And [these are] ancient things."
  tags: []
"1Krn4,23":
  text: "These [were] the potters, and those that dwelt among plants and hedges: there they dwelt with the king for his work."
  tags: []
"1Krn4,24":
  text: "The sons of Simeon [were], Nemuel, and Jamin, Jarib, Zerah, [and] Shaul:"
  tags: []
"1Krn4,25":
  text: "Shallum his son, Mibsam his son, Mishma his son."
  tags: []
"1Krn4,26":
  text: "And the sons of Mishma; Hamuel his son, Zacchur his son, Shimei his son."
  tags: []
"1Krn4,27":
  text: "And Shimei had sixteen sons and six daughters; but his brethren had not many children, neither did all their family multiply, like to the children of Judah."
  tags: []
"1Krn4,28":
  text: "And they dwelt at Beer-sheba, and Moladah, and Hazar-shual,"
  tags: []
"1Krn4,29":
  text: "And at Bilhah, and at Ezem, and at Tolad,"
  tags: []
"1Krn4,30":
  text: "And at Bethuel, and at Hormah, and at Ziklag,"
  tags: []
"1Krn4,31":
  text: "And at Beth-marcaboth, and Hazar-susim, and at Beth-birei, and at Shaaraim. These [were] their cities unto the reign of David."
  tags: []
"1Krn4,32":
  text: "And their villages [were], Etam, and Ain, Rimmon, and Tochen, and Ashan, five cities:"
  tags: []
"1Krn4,33":
  text: "And all their villages that [were] round about the same cities, unto Baal. These [were] their habitations, and their genealogy."
  tags: []
"1Krn4,34":
  text: "And Meshobab, and Jamlech, and Joshah the son of Amaziah,"
  tags: []
"1Krn4,35":
  text: "And Joel, and Jehu the son of Josibiah, the son of Seraiah, the son of Asiel,"
  tags: []
"1Krn4,36":
  text: "And Elioenai, and Jaakobah, and Jeshohaiah, and Asaiah, and Adiel, and Jesimiel, and Benaiah,"
  tags: []
"1Krn4,37":
  text: "And Ziza the son of Shiphi, the son of Allon, the son of Jedaiah, the son of Shimri, the son of Shemaiah;"
  tags: []
"1Krn4,38":
  text: "These mentioned by [their] names [were] princes in their families: and the house of their fathers increased greatly."
  tags: []
"1Krn4,39":
  text: "And they went to the entrance of Gedor, [even] unto the east side of the valley, to seek pasture for their flocks."
  tags: []
"1Krn4,40":
  text: "And they found fat pasture and good, and the land [was] wide, and quiet, and peaceable; for [they] of Ham had dwelt there of old."
  tags: []
"1Krn4,41":
  text: "And these written by name came in the days of Hezekiah king of Judah, and smote their tents, and the habitations that were found there, and destroyed them utterly unto this day, and dwelt in their rooms: because [there was] pasture there for their flocks."
  tags: []
"1Krn4,42":
  text: "And [some] of them, [even] of the sons of Simeon, five hundred men, went to mount Seir, having for their captains Pelatiah, and Neariah, and Rephaiah, and Uzziel, the sons of Ishi."
  tags: []
"1Krn4,43":
  text: "And they smote the rest of the Amalekites that were escaped, and dwelt there unto this day."
  tags: []
