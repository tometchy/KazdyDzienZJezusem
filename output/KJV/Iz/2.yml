"Iz2,1": "The word that Isaiah the son of Amoz saw concerning Judah and Jerusalem."
"Iz2,2": "And it shall come to pass in the last days, [that] the mountain of the LORD'S house shall be established in the top of the mountains, and shall be exalted above the hills; and all nations shall flow unto it."
"Iz2,3": "And many people shall go and say, Come ye, and let us go up to the mountain of the LORD, to the house of the God of Jacob; and he will teach us of his ways, and we will walk in his paths: for out of Zion shall go forth the law, and the word of the LORD from Jerusalem."
"Iz2,4": "And he shall judge among the nations, and shall rebuke many people: and they shall beat their swords into plowshares, and their spears into pruninghooks: nation shall not lift up sword against nation, neither shall they learn war any more."
"Iz2,5": "O house of Jacob, come ye, and let us walk in the light of the LORD."
"Iz2,6": "Therefore thou hast forsaken thy people the house of Jacob, because they be replenished from the east, and [are] soothsayers like the Philistines, and they please themselves in the children of strangers."
"Iz2,7": "Their land also is full of silver and gold, neither [is there any] end of their treasures; their land is also full of horses, neither [is there any] end of their chariots:"
"Iz2,8": "Their land also is full of idols; they worship the work of their own hands, that which their own fingers have made:"
"Iz2,9": "And the mean man boweth down, and the great man humbleth himself: therefore forgive them not."
"Iz2,10": "Enter into the rock, and hide thee in the dust, for fear of the LORD, and for the glory of his majesty."
"Iz2,11": "The lofty looks of man shall be humbled, and the haughtiness of men shall be bowed down, and the LORD alone shall be exalted in that day."
"Iz2,12": "For the day of the LORD of hosts [shall be] upon every [one that is] proud and lofty, and upon every [one that is] lifted up; and he shall be brought low:"
"Iz2,13": "And upon all the cedars of Lebanon, [that are] high and lifted up, and upon all the oaks of Bashan,"
"Iz2,14": "And upon all the high mountains, and upon all the hills [that are] lifted up,"
"Iz2,15": "And upon every high tower, and upon every fenced wall,"
"Iz2,16": "And upon all the ships of Tarshish, and upon all pleasant pictures."
"Iz2,17": "And the loftiness of man shall be bowed down, and the haughtiness of men shall be made low: and the LORD alone shall be exalted in that day."
"Iz2,18": "And the idols he shall utterly abolish."
"Iz2,19": "And they shall go into the holes of the rocks, and into the caves of the earth, for fear of the LORD, and for the glory of his majesty, when he ariseth to shake terribly the earth."
"Iz2,20": "In that day a man shall cast his idols of silver, and his idols of gold, which they made [each one] for himself to worship, to the moles and to the bats;"
"Iz2,21": "To go into the clefts of the rocks, and into the tops of the ragged rocks, for fear of the LORD, and for the glory of his majesty, when he ariseth to shake terribly the earth."
"Iz2,22": "Cease ye from man, whose breath [is] in his nostrils: for wherein is he to be accounted of?"
