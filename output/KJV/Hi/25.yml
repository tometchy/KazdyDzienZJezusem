"Hi25,1": "Then answered Bildad the Shuhite, and said,"
"Hi25,2": "Dominion and fear [are] with him, he maketh peace in his high places."
"Hi25,3": "Is there any number of his armies? and upon whom doth not his light arise?"
"Hi25,4": "How then can man be justified with God? or how can he be clean [that is] born of a woman?"
"Hi25,5": "Behold even to the moon, and it shineth not; yea, the stars are not pure in his sight."
"Hi25,6": "How much less man, [that is] a worm? and the son of man, [which is] a worm?"
