"Hi5,1": "Call now, if there be any that will answer thee; and to which of the saints wilt thou turn?"
"Hi5,2": "For wrath killeth the foolish man, and envy slayeth the silly one."
"Hi5,3": "I have seen the foolish taking root: but suddenly I cursed his habitation."
"Hi5,4": "His children are far from safety, and they are crushed in the gate, neither [is there] any to deliver [them]."
"Hi5,5": "Whose harvest the hungry eateth up, and taketh it even out of the thorns, and the robber swalloweth up their substance."
"Hi5,6": "Although affliction cometh not forth of the dust, neither doth trouble spring out of the ground;"
"Hi5,7": "Yet man is born unto trouble, as the sparks fly upward."
"Hi5,8": "I would seek unto God, and unto God would I commit my cause:"
"Hi5,9": "Which doeth great things and unsearchable; marvellous things without number:"
"Hi5,10": "Who giveth rain upon the earth, and sendeth waters upon the fields:"
"Hi5,11": "To set up on high those that be low; that those which mourn may be exalted to safety."
"Hi5,12": "He disappointeth the devices of the crafty, so that their hands cannot perform [their] enterprise."
"Hi5,13": "He taketh the wise in their own craftiness: and the counsel of the froward is carried headlong."
"Hi5,14": "They meet with darkness in the daytime, and grope in the noonday as in the night."
"Hi5,15": "But he saveth the poor from the sword, from their mouth, and from the hand of the mighty."
"Hi5,16": "So the poor hath hope, and iniquity stoppeth her mouth."
"Hi5,17": "Behold, happy [is] the man whom God correcteth: therefore despise not thou the chastening of the Almighty:"
"Hi5,18": "For he maketh sore, and bindeth up: he woundeth, and his hands make whole."
"Hi5,19": "He shall deliver thee in six troubles: yea, in seven there shall no evil touch thee."
"Hi5,20": "In famine he shall redeem thee from death: and in war from the power of the sword."
"Hi5,21": "Thou shalt be hid from the scourge of the tongue: neither shalt thou be afraid of destruction when it cometh."
"Hi5,22": "At destruction and famine thou shalt laugh: neither shalt thou be afraid of the beasts of the earth."
"Hi5,23": "For thou shalt be in league with the stones of the field: and the beasts of the field shall be at peace with thee."
"Hi5,24": "And thou shalt know that thy tabernacle [shall be] in peace; and thou shalt visit thy habitation, and shalt not sin."
"Hi5,25": "Thou shalt know also that thy seed [shall be] great, and thine offspring as the grass of the earth."
"Hi5,26": "Thou shalt come to [thy] grave in a full age, like as a shock of corn cometh in in his season."
"Hi5,27": "Lo this, we have searched it, so it [is]; hear it, and know thou [it] for thy good."
