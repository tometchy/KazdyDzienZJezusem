"Hi15,1": "Then answered Eliphaz the Temanite, and said,"
"Hi15,2": "Should a wise man utter vain knowledge, and fill his belly with the east wind?"
"Hi15,3": "Should he reason with unprofitable talk? or with speeches wherewith he can do no good?"
"Hi15,4": "Yea, thou castest off fear, and restrainest prayer before God."
"Hi15,5": "For thy mouth uttereth thine iniquity, and thou choosest the tongue of the crafty."
"Hi15,6": "Thine own mouth condemneth thee, and not I: yea, thine own lips testify against thee."
"Hi15,7": "[Art] thou the first man [that] was born? or wast thou made before the hills?"
"Hi15,8": "Hast thou heard the secret of God? and dost thou restrain wisdom to thyself?"
"Hi15,9": "What knowest thou, that we know not? [what] understandest thou, which [is] not in us?"
"Hi15,10": "With us [are] both the grayheaded and very aged men, much elder than thy father."
"Hi15,11": "[Are] the consolations of God small with thee? is there any secret thing with thee?"
"Hi15,12": "Why doth thine heart carry thee away? and what do thy eyes wink at,"
"Hi15,13": "That thou turnest thy spirit against God, and lettest [such] words go out of thy mouth?"
"Hi15,14": "What [is] man, that he should be clean? and [he which is] born of a woman, that he should be righteous?"
"Hi15,15": "Behold, he putteth no trust in his saints; yea, the heavens are not clean in his sight."
"Hi15,16": "How much more abominable and filthy [is] man, which drinketh iniquity like water?"
"Hi15,17": "I will shew thee, hear me; and that [which] I have seen I will declare;"
"Hi15,18": "Which wise men have told from their fathers, and have not hid [it]:"
"Hi15,19": "Unto whom alone the earth was given, and no stranger passed among them."
"Hi15,20": "The wicked man travaileth with pain all [his] days, and the number of years is hidden to the oppressor."
"Hi15,21": "A dreadful sound [is] in his ears: in prosperity the destroyer shall come upon him."
"Hi15,22": "He believeth not that he shall return out of darkness, and he is waited for of the sword."
"Hi15,23": "He wandereth abroad for bread, [saying], Where [is it]? he knoweth that the day of darkness is ready at his hand."
"Hi15,24": "Trouble and anguish shall make him afraid; they shall prevail against him, as a king ready to the battle."
"Hi15,25": "For he stretcheth out his hand against God, and strengtheneth himself against the Almighty."
"Hi15,26": "He runneth upon him, [even] on [his] neck, upon the thick bosses of his bucklers:"
"Hi15,27": "Because he covereth his face with his fatness, and maketh collops of fat on [his] flanks."
"Hi15,28": "And he dwelleth in desolate cities, [and] in houses which no man inhabiteth, which are ready to become heaps."
"Hi15,29": "He shall not be rich, neither shall his substance continue, neither shall he prolong the perfection thereof upon the earth."
"Hi15,30": "He shall not depart out of darkness; the flame shall dry up his branches, and by the breath of his mouth shall he go away."
"Hi15,31": "Let not him that is deceived trust in vanity: for vanity shall be his recompence."
"Hi15,32": "It shall be accomplished before his time, and his branch shall not be green."
"Hi15,33": "He shall shake off his unripe grape as the vine, and shall cast off his flower as the olive."
"Hi15,34": "For the congregation of hypocrites [shall be] desolate, and fire shall consume the tabernacles of bribery."
"Hi15,35": "They conceive mischief, and bring forth vanity, and their belly prepareth deceit."
