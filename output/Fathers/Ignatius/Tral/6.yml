"Tral6,1":
  text: "Παρακαλῶ οὖν ὑμᾶς, οὐκ ἐγώ, ἀλλ’ ἡ ἀγάπη Ἰησοῦ Χριστοῦ: μόνῃ τῇ χριστιανῇ τροφῇ χρῆσθε, ἀλλοτρίας δὲ βοτάνης ἀπέχεσθε, ἥτις ἐστὶν αἵρεσις:"
  tags: []
"Tral6,2":
  text: "οἳ ἑαυτοῖς παρεμπλέκουσιν Ἰησοῦν Χριστὸν καταξιοπιστευόμενοι, ὥσπερ θανάσιμον φάρμακον διδόντες μετὰ οἰνομέλιτος, ὅπερ ὁ ἀγνοῶν ἡδέως λαμβάνει ἐν ἡδονῇ κακῇ τὸ ἀποθανεῖν."
  tags: []
