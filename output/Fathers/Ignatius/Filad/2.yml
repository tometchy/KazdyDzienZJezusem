"Filad2,1":
  text: "Τέκνα οὖν φωτὸς ἀληθείας, φεύγετε τὸν μερισμὸν καὶ τὰς κακοδιδασκαλίας: ὅπου δὲ ὁ ποιμήν ἐστιν, ἐκεῖ ὡς πρόβατα ἀκολουθεῖτε."
  tags: []
"Filad2,2":
  text: "πολλοὶ γὰρ λύκοι ἀξιόπιστοι ἡδονῇ κακῇ αἰχμαλωτίζουσιν τοὺς θεοδρόμους: ἀλλ’ ἐν τῇ ἑνότητι ὑμῶν οὐχ ἕξουσιν τόπον."
  tags: []
