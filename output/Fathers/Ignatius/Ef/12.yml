"Ef12,1":
  text: "Οἶδα, τίς εἰμι καὶ τίσιν γράφω. ἐγὼ κατάκριτος, ὑμεῖς ἠλεημένοι: ἐγὼ ὑπὸ κίνδυνον, ὑμεῖς ἐστηριγμένοι:"
  tags: []
"Ef12,2":
  text: "πάροδός ἐστε τῶν εἰς θεὸν ἀναιρουμένων, Παύλου συμμύσται τοῦ ἡγιασμένου. τοῦ μεμαρτυρημένου, ἀξιομακαρίστου, οὖ γένοιτό μοι ὑπὸ τὰ ἴχνη εὑρεθῆναι, ὅταν θεοῦ ἐπιτύχω, ὃς ἐν πάσῃ ἐπιστολῇ μνημονεύει ὑμῶν ἐν Χριστῷ Ἰησοῦ."
  tags: []
