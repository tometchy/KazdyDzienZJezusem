"Ef21,1":
  text: "Ἀντίψυχον ὑμῶν ἐγὼ καὶ ὧν ἐπέμψατε εἰς θεοῦ τιμὴν εἰς Σμύρναν, ὅθεν καὶ γράφω ὑμῖν, εὐχαριστῶν τῷ κυρίῳ, ἀγαπῶν Πολύκαρπον ὡς καὶ ὑμᾶς: μνημονεύετέ μου, ὡς καὶ ὑμῶν Ἰησοῦς Χριστός."
  tags: []
"Ef21,2":
  text: "προσεύχεσθε ὑπὲρ τῆς ἐκκλησίας τῆς ἐν Συρίᾳ, ὅθεν δεδεμένος εἰς Ῥώμην ἀπάγομαι, ἔσχατος ὢν τῶν ἐκεῖ πιστῶν, ὥσπερ ἠξιώθην εἰς τιμὴν θεοῦ εὑρεθῆναι. ἔρρωσθε ἐν θεῷ πατρὶ καὶ ἐν Ἰησοῦ Χριστῷ, τῇ κοινῇ ἐλπίδι ἡμῶν."
  tags: []
