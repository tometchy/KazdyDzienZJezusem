"Smyr11,1":
  text: "Ἡ προσευχὴ ὑμῶν ἀπῆλθεν ἐπὶ τὴν ἐκκλησίαν τὴν ἐν Ἀντιοχείᾳ τῆς Συρίας, ὅθεν δεδεμένος θεοπρεπεστάτοις δεσμοῖς πάντας ἀσπάζομαι, οὐκ ὢν ἄξιος ἐκεῖθεν εἶναι, ἔσχατος αὐτῶν ὤν: κατὰ θέλημα δὲ κατηξιώθην, οὐκ ἐκ συνειδότος ἀλλ’ ἐκ χάριτος θεοῦ: ἣν εὔχομαι τελείαν μοι δοθῆναι, ἵνα ἐν τῇ προσευχῇ ὑμῶν θεοῦ ἐπιτύχω."
  tags: []
"Smyr11,2":
  text: "ἵνα οὖν ὑμῶν τέλειον γένηται τὸ ἔργον καὶ ἐπὶ γῆς καὶ ἐν οὐρανῷ, πρέπει εἰς τιμὴν θεοῦ χειροτονῆσαι τὴν ἐκκλησίαν ὑμῶν θεοπρεσβεύτην, εἰς τὸ γενόμενον ἐν Συρίᾳ συγχαρῆναι αὐτοῖς, ὅτι εἰρηνεύουσιν καὶ ἀπέλαβον τὸ ἴδιον μέγεθος καὶ ἀπεκατεστάθη αὐτοῖς τὸ ἴδιον σωματεῖον."
  tags: []
"Smyr11,3":
  text: "ἐφάνη μοι οὖν θεοῦ ἄξιον πρᾶγμα, πέμψαι τινὰ τῶν ὑμετέρων μετ’ ἐπιστολῆς, ἵνα συνδοξάσῃ τὴν κατὰ θεὸν αὐτοῖς γενομένην εὐδίαν, καὶ ὅτι λιμένος ἤδη ἐτύγχανον τῇ προσευχῇ ὑμῶν. τέλειοι ὄντες τέλεια καὶ φρονεῖτε. θέλουσιν γὰρ ὑμῖν εὖ πράσσειν θεὸς ἕτοιμος εἰς τὸ παρέχειν."
  tags: []
