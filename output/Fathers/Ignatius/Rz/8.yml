"Rz8,1":
  text: "Οὐκέτι θέλω κατὰ ἀνθρώπους ζῆν. τοῦτο δὲ ἔσται, ἐὰν ὑμεῖς θελήσητε. θελήσατε, ἵνα καὶ ὑμεῖς θεληθῆτε."
  tags: []
"Rz8,2":
  text: "δἰ ὀλίγων γραμμάτων αἰτοῦμαι ὑμᾶς: πιστεύσατέ μοι. Ἰησοῦς δὲ Χριστὸς ὑμῖν ταῦτα φανερώσει, ὅτι ἀληθῶς λέγω: τὸ ἀψευδὲς στόμα, ἐν ᾧ ὁ πατὴρ ἐλάλησεν ἀληθῶς."
  tags: []
"Rz8,3":
  text: "αἰτήσασθε περὶ ἐμοῦ, ἵνα ἐπιτύχω. οὐ κατὰ σάρκα ὑμῖν ἔγραψα, ἀλλὰ κατὰ γνώμην θεοῦ. ἐὰν πάθω, ἠθελήσατε: ἐὰν ἀποδοκιμασθῶ, ἐμισήσατε."
  tags: []
