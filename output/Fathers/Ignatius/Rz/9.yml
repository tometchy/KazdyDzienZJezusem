"Rz9,1":
  text: "Μνημονεύετε ἐν τῇ προσευχῇ ὑμῶν τῆς ἐν Συρίᾳ ἐκκλησίας, ἥτις ἀντὶ ἐμοῦ ποιμένι τῷ θεῷ χρῆται. μόνος αὐτὴν Ἰησοῦς Χριστὸς ἐπισκοπήσει καὶ ἡ ὑμῶν ἀγάπη."
  tags: []
"Rz9,2":
  text: "ἐγὼ δὲ αἰσχύνομαι ἐξ αὐτῶν λέγεσθαι: οὐδὲ γὰρ ἄξιός εἰμι, ὣν ἔσχατος αὐτῶν καὶ ἔκτρωμα: ἀλλ’ ἠλέημαί τις εἶναι, ἐὰν θεοῦ ἐπιτύχω."
  tags: []
"Rz9,3":
  text: "ἀσπάζεται ὑμᾶς τὸ ἐμὸν πνεῦμα καὶ ἡ ἀγάπη τῶν ἐκκλησιῶν τῶν δεξαμένων με εἰς ὄνομα Ἰησοῦ Χριστοῦ, οὐχ ὡς παροδεύοντα. καὶ γὰρ αἱ μὴ προσήκουσαί μοι τῇ ὁδῷ τῇ κατὰ σάρκα, κατὰ πόλιν με προῆγον."
  tags: []
