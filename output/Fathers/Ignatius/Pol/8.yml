"Pol8,1":
  text: "Ἐπεὶ πάσαις ταῖς ἐκκλησίαις οὐκ ἠδυνήθην γράψαι διὰ τὸ ἐξαίφνης πλεῖν με ἀπὸ Τρωάδος εἰς Νεάπολιν, ὡς τὸ θέλημα προστάσσει, γράψεις ταῖς ἔμπροσθεν ἐκκλησίαις, ὡς θεοῦ γνώμην κεκτημένος, εἰς τὸ καὶ αὐτοὺς τὸ αὐτὸ ποιῆσαι, ʽοἱ μὲν δυνάμενοι πεζοὺς πέμψαι, οἱ δὲ ἐπιστολὰς διὰ τῶν ὑπό σου πεμπομένων. ἵνα δοξασθῆτε αἰωνίῳ ἔργῳ.ʼ ὡς ἄξιος ὤν."
  tags: []
"Pol8,2":
  text: "ἀσπάζομαι πάντας ἐξ ὀνόματος καὶ τὴν τοῦ Ἐπιτρόπου σὺν ὅλῳ τῷ οἴκῳ αὐτῆς καὶ τῶν τέκνων. ἀσπάζομαι Ἄτταλον τὸν ἀγαπητόν μου. ἀσπάζομαι τὸν μέλλοντα καταξιοῦσθαι τοῦ εἰς Συρίαν πορεύεσθαι. ἔσται ἡ χάρις μετ’ αὐτοῦ διὰ παντὸς καὶ τοῦ πέμποντος αὐτὸν Πολυκάρπου."
  tags: []
"Pol8,3":
  text: "ἐρρῶσθαι ὑμᾶς διὰ παντὸς ἐν θεῷ ἡμῶν Ἰησοῦ Χριστῷ εὔχομαι, ἐν ᾧ διαμείνητε ἐν ἑνότητι θεοῦ καὶ ἐπισκοπῇ. ἀσπάζομαι Ἄλκην, τὸ ποθητόν μοι ὄνομα. ἔρρωσθε ἐν κυρίῳ."
  tags: []
