"Pol1,1":
  text: "Ἀποδεχόμενός σου τὴν ἐν θεῷ γνώμην ἡδρασμένην ὡς ἐπὶ πέτραν ἀκίνητον, ὑπερδοξάζω, καταξιωθεὶς τοῦ προσώπου σου τοῦ ἀμώμου, οὗ ὀναίμην ἐν θεῷ."
  tags: []
"Pol1,2":
  text: "παρακαλῶ σε ἐν χάριτι ᾗ ἐνδέδυσαι, προσθεῖναι τῷ δρόμῳ σου καὶ πάντας παρακαλεῖν, ἵνα σώζωνται. ἐκδίκει σου τὸν τόπον ἐν πάσῃ ἐπιμελείᾳ σαρκικῇ τε καὶ πνευματικῇ. τῆς ἑνώσεως φρόντιζε, ἧς οὐδὲν ἄμεινον, πάντας βάσταζε, ὡς καὶ σὲ ὁ κύριος: πάντων ἀνέχου ἐν ἀγάπῃ, ὥσπερ καὶ ποιεῖς."
  tags: []
"Pol1,3":
  text: "προσευχαῖς σχόλαζε ἀδιαλείπτοις: αἰτοῦ σύνεσιν πλείονα ἧς ἔχεις: γρηγόρει ἀκοίμητον πνεῦμα κεκτημένος. τοῖς κατ’ ἄνδρα κατὰ ὁμοήθειαν θεοῦ λάλει: πάντων τὰς νόσους βάσταζε ὡς τέλειος ἀθλητής. ὅπου πλείων κόπος, πολὺ κέρδος."
  tags: []
